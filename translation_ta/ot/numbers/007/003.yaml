source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: ta
  text: 'அவர்கள் தங்கள் காணிக்கையை யாவேயின் முன்னிலையில் கொண்டுவந்தார்கள்: ஆறு மூடப்பட்ட வண்டிகளையும்[a] பன்னிரண்டு எருதுகளையும்—ஒவ்வொரு இரண்டு தலைவர்களுக்கும் ஒரு வண்டி, ஒவ்வொரு தலைவருக்கும் ஓர் எருது—திருக்கூடாரத்தின் முன் சமர்ப்பித்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் மரபாக ‘மூடப்பட்ட வண்டிகள்’ என்று புரிந்துகொள்ளப்படுகிறது; அதன் துல்லியமான பொருள் உறுதியானதல்ல. ‘விதானமிட்ட வண்டிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: தங்கள் காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பை קָרְבָּן குறிக்கிறது; நவீனத் தமிழில் ‘காணிக்கை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் இடம் மற்றும் உறவு சார்ந்த ‘முன்/முன்னிலையில்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய வேதப்பிரதியில் உள்ள இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֶגְלֹת צָב
  choice: மூடப்பட்ட ஆறு வண்டிகள்
  rationale: עֲגָלוֹת என்பது வண்டிகள்; צָב இங்கு மரபாக மூடப்பட்ட அல்லது விதானமிட்ட வண்டிகளைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. எண்ணைத் தமிழின் இயல்பான சொல் வரிசையில் அமைத்துள்ளது.
- source_word: בָּקָר
  choice: எருதுகள்
  rationale: அடுத்துள்ள שׁוֹר என்ற ஒருமைச் சொல்லும் போக்குவரத்துச் சூழலும் இவை வண்டி இழுக்கும் எருதுகள் என்பதைக் காட்டுகின்றன.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: ஒவ்வொரு இரண்டு தலைவர்களுக்கும் ஒரு வண்டி
  rationale: இரண்டு தலைவர்களுக்கு ஒரு வண்டி என்ற பகிர்ந்தளிப்பு உறவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַנְּשִׂאִים
  choice: தலைவர்கள்
  rationale: இங்கு கோத்திரத் தலைவர்களைக் குறிக்கிறது; ‘தலைவர்கள்’ என்பது அரச மரபுப் பொருளைத் தேவையின்றி சேர்க்காத பொதுவான நவீனத் தமிழ்.
- source_word: וְשׁוֹר לְאֶחָד
  choice: ஒவ்வொரு தலைவருக்கும் ஓர் எருது
  rationale: ‘ஒவ்வொருவருக்கும் ஓர் எருது’ என்ற பகிர்ந்தளிப்புப் பொருளை வெளிப்படையாக்க, குறிக்கப்பட்ட நபர்களான தலைவர்களை மீண்டும் குறிப்பிடுகிறது.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: அவற்றைச் சமர்ப்பித்தார்கள்
  rationale: வண்டிகளும் எருதுகளும் வழிபாட்டிடத்தில் முன்வைக்கப்பட்டதைத் தெரிவிக்கிறது; அவை பலியிட்டுக் கொல்லப்பட்டன என்று மிகையாகக் குறிப்பிடுவதில்லை.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பதன் ‘உறைவிடம்’ சார்ந்த பொருளைப் பாதுகாத்து, אֹהֶל מוֹעֵד எனும் ‘சந்திப்புக் கூடாரத்துடன்’ கலக்காமல் வழிபாட்டுக்குரிய புனித உறைவிடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: וַיַּקְרִיבוּ என்பதன் வழிபாட்டுச் சூழல்
  choice: சமர்ப்பித்தார்கள்
  alternative: பலியிட்டார்கள்
  rationale: இங்கு சமர்ப்பிக்கப்படுபவை வண்டிகளும் எருதுகளும் என்பதால், செயல் பலியிட்டுக் கொல்வதைக் கட்டாயமாகக் குறிக்காது; ‘சமர்ப்பித்தார்கள்’ அந்தத் திறந்த பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பகிர்ந்தளிப்பு அமைப்பும் வழிபாட்டுச் சூழலும் பாதுகாக்கப்பட்டுள்ளன.
