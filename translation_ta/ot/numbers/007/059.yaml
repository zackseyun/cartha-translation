  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: ta
  text: 'சமாதானப் பலிக்காக[a]: இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஓராண்டு வயதுடைய ஐந்து செம்மறியாட்டுக் குட்டிகள். இது பெதாசூரின் மகன் கம்லியேலின் காணிக்கை.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலி’ என்பதற்கு ‘நல்லுறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இது ... காணிக்கை” என்று வினைச்சொல் இல்லாமல் உள்ளது.
    reason: source_form
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: זֶבַח என்பது பலியைக் குறிக்கிறது; שְׁלָמִים என்பது சமாதானம், நல்லுறவு, நல்வாழ்வு ஆகிய தொடர்புடைய கருத்துகளை உள்ளடக்கிய மரபான பலிவகைப் பெயர். பட்டியலின் தொடர்ச்சியையும் நோக்கத்தையும் ‘பலிக்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது ஆண் உழவு மாடுகளை மட்டும் அல்லாமல் மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; ‘மாடுகள்’ அதன் பரந்த பொருளைப் பேணுகிறது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ பாலின வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிக்கிறது; செம்மறியாட்டுக் கடாக்களிலிருந்து தெளிவாக வேறுபடுத்தப்பட்டுள்ளது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஓராண்டான ஐந்து செம்மறியாட்டுக் குட்டிகள்
  rationale: בְּנֵי שָׁנָה என்பதன் வயதுக் குறிப்பை ‘ஓராண்டான’ நேரடியாகப் பேணுகிறது; כְּבָשִׂים என்பதற்கு செம்மறியாட்டுக் குட்டிகள் எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: எபிரெயச் சொற்றொடர் வினைச்சொல் இல்லாத அடையாள வாக்கியம். தமிழிலும் ‘இது ... காணிக்கை’ என்று அமைப்பதன் மூலம் நிகழ்காலம் அல்லது இறந்தகாலம் என்று தேவையின்றி முடிவுசெய்யாமல் அதன் வடிவம் பேணப்படுகிறது.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: பெதாசூரின் மகன் கம்லியேல்
  rationale: எபிரெயப் பெயர்களின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்து, בֶּן என்பதைக் ‘மகன்’ என்று இயல்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள் பரப்பு
  choice: சமாதானப் பலி
  alternative: நல்லுறவுப் பலி; நல்வாழ்வுப் பலி
  rationale: ‘சமாதானப் பலி’ தமிழில் அறியப்பட்ட மரபுச் சொல்; ஆனால் மூலச்சொல் நல்லுறவு அல்லது நலநிலை என்ற நுணுக்கங்களையும் கொண்டிருக்கலாம் என்பதால் அவை அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில், பலிப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடாக்கள்’ என்பது ஆண் செம்மறியாடுகளையும் ஆண் வெள்ளாடுகளையும் தெளிவாக வேறுபடுத்த உதவுகிறது. முதல் சொற்றொடர் தனித்து நிற்காமல் முழுமையான தமிழ்வாக்கியமாக அமைய ‘கொண்டுவரப்பட்டன’ சேர்க்கப்பட்டுள்ளது; இது பட்டியலின் சூழலால் வெளிப்படும் செயலைத் தெரிவிக்கிறது.
