revisions:
- from: பன்னிரண்டாம் நாளில், நப்தலியின் மகன்களுடைய தலைவன் ஏனானின் மகன் அகீரா.
  to: பன்னிரண்டாம் நாளில், நப்தலியின் மகன்களின் தலைவர் ஏனானின் மகன் அகீரா.
  rationale: The revision makes only a stylistic-syntactic improvement to the tribal affiliation phrase. It preserves the Hebrew temporal formula, the concise verbless identification, the masculine plural tribal designation, and both personal names without introducing interpretive content.
