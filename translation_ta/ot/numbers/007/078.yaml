  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: ta
  text: பன்னிரண்டாம் நாளில், நப்தலியின் மகன்களின் தலைவர் ஏனானின் மகன் அகீரா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר יוֹם
  choice: பன்னிரண்டாம் நாளில்
  rationale: எபிரெயத் தொடரில் உள்ள காலத்தைக் குறிக்கும் בְּ மற்றும் எண்ணிக்கைச் சொற்றொடர் சேர்ந்து ‘பன்னிரண்டாம் நாளில்’ என்ற வரிசை எண்ணுப் பொருளைத் தருகின்றன; இது இயல்பான நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: கோத்திரச் சூழலில் அங்கீகரிக்கப்பட்ட தலைமை வகிப்பவரைக் குறிக்கிறது; அரச மரபைத் தவறாக உணர்த்தக்கூடிய சொற்களைத் தவிர்த்து, மூலத்தின் ஆண்பால் ஒருமையையும் காக்கிறது.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: நப்தலியின் மகன்களுடைய
  rationale: לְ இங்கு தலைவனுக்கும் நப்தலி கோத்திரத்தாருக்கும் உள்ள தொடர்பைக் குறிக்கிறது. בְּנֵי என்பதன் ஆண்பால் பன்மையை ‘மகன்கள்’ என்று வெளிப்படையாகப் பேணுகிறது.
- source_word: אֲחִירַע
  choice: அகீரா
  rationale: எபிரெயத் தனிப்பெயர் அதன் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בֶּן עֵינָן
  choice: ஏனானின் மகன்
  rationale: எபிரெயத் தந்தைவழிப் பெயரடையாளக் கட்டமைப்பை இயல்பான தமிழ்ச் சொந்தவிகுதி அமைப்பில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי என்ற பாலினம் குறிக்கப்பட்ட கோத்திரப் பெயரடை
  choice: நப்தலியின் மகன்கள்
  alternative: நப்தலியின் சந்ததியினர்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையைத் தெளிவாகப் பேணுகிறது; சூழல் அதை பாலினநடுநிலையாக்க வேண்டுமெனக் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதும் ஆகிய உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான பட்டியல் வடிவமும் கோத்திரத் தலைமைச் சொல்லாட்சியும் பேணப்பட்டுள்ளன.
