  yaml_path: translation/ot/numbers/007/062.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: ta
  text: பத்து சேக்கல் எடையுள்ள ஒரு தங்கத் தட்டு[a]; அது தூபப்பொருளால் நிறைந்திருந்தது;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “ஒரு தட்டு, பத்து தங்கம், தூபப்பொருளால் நிறைந்தது.” எண்ணாகமம் 7-இல் திரும்பத் திரும்ப வரும் காணிக்கை வாய்பாட்டின் அடிப்படையில், “சேக்கல்” என்ற எடை அலகு உள்ளார்ந்து கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: தட்டு
  rationale: இங்கு உள்ளங்கை அல்லது கரண்டி என்பதல்லாமல், தூபப்பொருளை வைக்கும் சிறிய வழிபாட்டுப் பாத்திரத்தைக் குறிக்கிறது; நவீன தமிழில் ‘தட்டு’ இயல்பாக உள்ளது.
- source_word: אַחַת
  choice: ஒரு
  rationale: பாத்திரத்தின் எண்ணிக்கையைக் குறிக்கும் எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்து சேக்கல் எடையுள்ள ... தங்க
  rationale: மூலத்தில் எடை அலகான ‘சேக்கல்’ வெளிப்படையாக இல்லை; எண்ணாகமம் 7-இல் திரும்பத் திரும்ப வரும் காணிக்கை வாய்பாட்டின் அடிப்படையில் அது உள்ளார்ந்து கொள்ளப்படுகிறது. தமிழில் பொருள் தெளிவாக இருக்க எடை அலகு சேர்க்கப்பட்டுள்ளது.
- source_word: מְלֵאָה
  choice: நிறைந்திருந்தது
  rationale: பெண்பால் பாத்திரத்துடன் இயையும் பயனிலை உரிச்சொல்; தமிழில் முழுமையான, இயல்பான வாக்கியமாக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: வழிபாட்டில் நறுமணப் புகை எழுப்பப் பயன்படுத்தப்படும் பொருளைக் குறிக்கிறது; ‘தூபம்’ என்ற செயற்பொருள் சார்ந்த சொல்லைவிட ‘தூபப்பொருள்’ இங்கு பாத்திரத்தை நிரப்பிய பொருளைத் தெளிவுபடுத்துகிறது.
