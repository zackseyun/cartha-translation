  source_fidelity: மூல எபிரெயத்தின் சுருக்கமான காணிக்கைப் பட்டியல் அமைப்பு துல்லியமாகப் பிரதிபலிக்கப்படுகிறது. כַּף என்பதற்கு இச்சூழலில் பொருந்தும் ‘தட்டு’ பயன்படுத்தப்பட்டுள்ளது; பத்து சேக்கல் என்ற எடை அலகு எண்ணாகமம் 7-இன் மீளும் வாய்பாட்டிலிருந்து நியாயமாக உள்ளார்ந்து வழங்கப்பட்டுள்ளது. ‘தூபப்பொருளால் நிறைந்திருந்தது’ என்பது מְלֵאָה קְטֹרֶת என்பதற்குப் பொருத்தமானது.
  naturalness: ‘பத்து சேக்கல் எடையுள்ள ஒரு தங்கத் தட்டு; அது தூபப்பொருளால் நிறைந்திருந்தது’ நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இரண்டு கூறுகளாக அமைத்தது மூலத்தின் பட்டியல் பாணியிலிருந்து சிறிது விரிவானதாயினும், தமிழில் இயல்பான முழுவாக்கியத்தை வழங்குகிறது.
  terminology: ‘சேக்கல்’ எடை அலகாகவும், ‘தூபப்பொருள்’ வழிபாட்டுச் சூழலின் incense-க்காகவும் பொருத்தமாக உள்ளன. ‘தங்கத் தட்டு’ என்பது כַּף என்பதற்கான சூழல்சார் ஏற்ற தேர்வு; கரண்டி அல்லது கிண்ணம் போன்ற ஒரே வடிவத்தைத் திணிக்கவில்லை.
