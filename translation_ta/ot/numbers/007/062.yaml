translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான பட்டியல் நடையைப் பேணியபடி, தமிழில் தேவையான ‘எடையுள்ள’ மற்றும் ‘இருந்தது’ சேர்க்கப்பட்டுள்ளன.
