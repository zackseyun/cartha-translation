  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: ta
  text: 'மேலும், சமாதானப் பலிக்காக[a]: இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஒரு வயதுடைய ஐந்து செம்மறியாட்டுக் குட்டிகள். இது அம்மினதாபின் மகன் நக்சோனின் காணிக்கை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறவுப் பலி” அல்லது “நல்வாழ்வுப் பலி.” எபிரெயச் சொல் பொதுவாகப் பகிர்ந்து உண்ணப்படும் பலியையும் சமாதானம் அல்லது நல்வாழ்வு என்ற கருத்துகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: மேலும், சமாதானப் பலிக்காக
  rationale: இணைப்பையும் நோக்கத்தைக் குறிக்கும் முன்னொட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. שְׁלָמִים என்பதன் வழக்கமான பலியியல் பொருளை ‘சமாதானப் பலி’ தக்கவைக்கிறது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது கூட்டுப்பெயராக கால்நடைகளைச் சுட்டுகிறது; பாலினத்தை எபிரெயம் இங்கு குறிப்பிடாததால் ‘எருதுகள்’ என்று மிகுதியாகக் குறிப்பாக்காமல் ‘மாடுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைத் தெளிவாகக் குறிக்கிறது; ‘கடாக்கள்’ பாலினத்தைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתּוּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான இன மற்றும் பாலின வேறுபாடு காக்கப்படுகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து செம்மறியாட்டுக் குட்டிகள்
  rationale: כְּבָשִׂים என்பதைச் செம்மறியாட்டுக் குட்டிகள் என்றும் בְּנֵי שָׁנָה என்பதை ‘ஒரு வயதான’ என்றும் வழங்குகிறது. இத்தொடரில் பாலினம் வெளிப்படையாகக் குறிக்கப்படாததால் அதைத் தமிழில் சேர்க்கவில்லை.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: எபிரெயத்தின் வினையற்ற அடையாள வாக்கியத்தை இயல்பாகத் தக்கவைத்து, קָרְבָּן என்பதற்கு பலியியல் சூழலில் பொதுவாகப் புரியக்கூடிய ‘காணிக்கை’ பயன்படுத்தப்பட்டது.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: அம்மினதாபின் மகன் நக்சோன்
  rationale: தந்தைவழி அடையாளத்தை இயல்பான தமிழ் உடைமைத் தொடரில் வழங்கி, பெயர்கள் ஒலிபெயர்க்கப்பட்டன.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியியல் சொல்லின் பொருள் விரிவு
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: ‘சமாதானப் பலி’ வழக்கில் அறியப்பட்டதும் மூலச்சொல்லின் பலியியல் தன்மையைத் தக்கவைப்பதும் ஆகும். எனினும் இச்சொல் பகிர்ந்துண்ணுதல், உறவு, நல்வாழ்வு ஆகிய கருத்துகளையும் தாங்கக்கூடும்; வசனத்தில் அவற்றில் ஒன்றை மட்டும் தீர்மானமாகத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலிப் பட்டியலின் சுருக்கமான அமைப்பும் மரியாதையான வேதாகம நடையும் காக்கப்பட்டுள்ளன. மூலத்தில் தெளிவில்லாத இடங்களில் பாலினம் போன்ற தகவல்கள் சேர்க்கப்படவில்லை.
