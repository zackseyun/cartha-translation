source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: ta
  text: மோசே திருக்கூடாரத்தை அமைத்து முடித்த நாளில்[a], அதை எண்ணெயால் அபிஷேகம் செய்து பரிசுத்தப்படுத்தினார். அதன் எல்லாப் பொருள்களையும், பலிபீடத்தையும் அதன் எல்லாக் கருவிகளையும் எண்ணெயால் அபிஷேகம் செய்து பரிசுத்தப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசே திருக்கூடாரத்தை அமைத்து முடித்தபோது.” எபிரெய மொழியின் காலக் குறிப்பு இவ்வாறும் இயல்பாக மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனியாக மொழிபெயர்க்காமல் காலச் சூழல் வாக்கியத்தில் இயல்பாக வெளிப்படுத்தப்பட்டது]'
  rationale: இது புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வடிவம். தமிழில் ‘அது நிகழ்ந்தது’ எனச் சொல்வது செயற்கையாக இருப்பதால், காலத் தொடரால் அதன் உரையாடல் பணி இயல்பாகத் தெரிவிக்கப்படுகிறது.
- source_word: בְּיוֹם כַּלּוֹת
  choice: அமைத்து முடித்த நாளில்
  rationale: יוֹם உடன் வரும் infinitive construct காலச் சூழலைக் குறிக்கிறது. இந்தத் தேர்வு மூலமொழியின் ‘நாளில்’ என்ற சொல்லாட்சியைப் பேணுகிறது; அது ‘அமைத்து முடித்தபோது’ என்றும் பொருள்படலாம்.
- source_word: לְהָקִים
  choice: அமைத்து
  rationale: திருக்கூடாரத்தை எழுப்பி நிறுவும் உடல்சார்ந்த செயலை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: வனாந்தரப் பரிசுத்த இடத்தைக் குறிக்கும் משכן என்பதற்குத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்டதும், ‘கூடாரம்’ என்ற கருத்தையும் தக்கவைத்திருப்பதும் ஆன சொல்.
- source_word: וַיִּמְשַׁח
  choice: எண்ணெயால் அபிஷேகம் செய்து
  rationale: משׁח என்பது அர்ப்பணிப்புச் சடங்கில் எண்ணெய் பூசுதலைக் குறிக்கிறது. ‘எண்ணெயால்’ என்பது செயலைத் தெளிவாக்குகிறது; ‘அபிஷேகம்’ அதன் சடங்கியல் பொருளைப் பேணுகிறது.
- source_word: וַיְקַדֵּשׁ
  choice: அர்ப்பணித்தார்
  rationale: இங்கு קדשׁ ஒழுக்க மாற்றத்தை அல்ல, புனிதப் பயன்பாட்டுக்காக வேறுபடுத்தி ஒதுக்குவதைச் சுட்டுகிறது. பொருள்களைப் பற்றிய இச்சூழலில் ‘அர்ப்பணித்தார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל כֵּלָיו (tabernacle)
  choice: அதன் பொருள்கள் அனைத்தையும்
  rationale: திருக்கூடாரத்துடன் தொடர்புடைய பலவகையான உபகரணங்களையும் அலங்காரப் பொருள்களையும் உள்ளடக்கும் பரந்த சொல்லாக்கம்.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: מזבח என்பதற்கான வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: כָּל כֵּלָיו (altar)
  choice: அதன் கருவிகள் அனைத்தையும்
  rationale: இரண்டாவது כֵּלִים பலிபீடத்தில் பயன்படுத்தப்படும் சாதனங்களைக் குறிப்பதால், ‘கருவிகள்’ என்பது முதல் இடத்திலுள்ள பரந்த ‘பொருள்கள்’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: அவர் அவற்றை எண்ணெயால் அபிஷேகம் செய்து அர்ப்பணித்தார்
  rationale: மூலத்தின் மீளுரைப்பையும் பன்மைச் சுட்டையும் பேணுகிறது; ‘அவற்றை’ என்பதன் பரப்பு முன்னர் குறிப்பிடப்பட்ட புனிதப் பொருள்களை உள்ளடக்கக்கூடியதாக விடப்படுகிறது.
theological_decisions:
- issue: சடங்கியல் பரிசுத்தப்படுத்தல்
  choice: அர்ப்பணித்தார்
  alternative: பரிசுத்தப்படுத்தினார்
  rationale: இவ்வசனம் உயிரற்ற வழிபாட்டுப் பொருள்களைப் புனிதப் பயன்பாட்டுக்காக ஒதுக்குவதைப் பற்றியது. ‘அர்ப்பணித்தார்’ ஒழுக்க ரீதியான மாற்றம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, சடங்கியல் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- issue: இறுதி பன்மைப் பெயர்ச்சுட்டின் பரப்பு
  choice: ‘அவற்றை’ எனத் தெளிவுபடுத்தாமல் வைத்தல்
  alternative: பலிபீடத்தையும் அதன் கருவிகளையும் மட்டும் என்று விரித்துரைத்தல்
  rationale: எபிரெயப் பன்மைச் சுட்டு உடனடியாக பலிபீடத்தையும் அதன் கருவிகளையும் சுட்டினாலும், முன் குறிப்பிடப்பட்ட புனிதப் பொருள்களின் தொகுப்பையும் சுருக்கமாக எடுத்துரைக்கக்கூடும். மொழிபெயர்ப்பு இந்த உண்மையான பரப்பு ஐயத்தைத் தீர்மானித்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திருக்கூடாரம்’, ‘அபிஷேகம்’, ‘பலிபீடம்’ ஆகிய பரவலாக அறியப்பட்ட வழிபாட்டுச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; ‘அர்ப்பணித்தார்’ என்பது இங்கு சடங்கியல் ரீதியில் புனிதப் பயன்பாட்டுக்காக ஒதுக்குதலைக் குறிக்கிறது. மூலத்தின் இறுதி மீளுரை நீக்கப்படாமல் பேணப்பட்டுள்ளது.
