  yaml_path: translation/ot/numbers/007/068.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ta
  text: தூபப்பொருளால் நிறைந்த பத்து சேக்கல்[a] எடையுள்ள ஒரு தங்கத் தட்டு;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘ஒரு தங்கத் தட்டு, பத்து, தூபப்பொருளால் நிறைந்தது.’ எண்ணாகமம் 7-இல் திரும்ப வரும் காணிக்கை விவரிப்பின் அடிப்படையில், ‘சேக்கல்’ என்ற எடை அலகு இங்கு உள்ளார்ந்ததாகக் கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு உணவு உண்ணும் கரண்டி அல்ல, தூபப்பொருளைத் தாங்கும் சிறிய சடங்குப் பாத்திரம் குறிக்கப்படுகிறது. நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַחַת
  choice: ஒரு
  rationale: כַּף என்ற பெண்பால் பெயர்ச்சொல்லோடு இயைந்த எளிய எண்ணுப்பெயர்.
- source_word: זָהָב
  choice: தங்க
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைக் குறிக்கிறது; தமிழில் பெயரடையாக ‘தங்கக் கிண்ணம்’ என்பது இயல்பான அமைப்பு.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்து சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையில் எடை அலகு வெளிப்படையாக இல்லை. எண்ணாகமம் 7-இல் திரும்பத் திரும்ப வரும் காணிக்கைச் சூத்திரம் இதை பாத்திரத்தின் எடையாகக் காட்டுவதால், பொருள் தெளிவடைய ‘சேக்கல்’ மற்றும் ‘எடையுள்ள’ சேர்க்கப்பட்டன.
- source_word: מְלֵאָה
  choice: நிறைந்திருந்தது
  rationale: பாத்திரத்தின் உள்ளடக்க நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: எரித்து நறுமணப் புகை எழுப்பும் காணிக்கைப் பொருளைக் குறிக்கிறது; ‘தூபம்’ என்பதைக் காட்டிலும் பொருளையே தெளிவாகச் சுட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான அமைப்பை வாசிக்கத்தக்க தமிழாக்கமாக்கியபோதும், சேர்க்கப்பட்ட எடை அலகு அடிக்குறிப்பில் வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
