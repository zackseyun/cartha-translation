id: NUM.7.48
reference: Numbers 7:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י אֶפְרָ֑יִם אֱלִֽישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: ta
  text: ஏழாம் நாளில், எப்பிராயீமின் மகன்களின் தலைவன் அம்மிஹூதின் மகன் எலிசாமா இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: ב־ முன்னிடைச்சொல், יוֹם மற்றும் வரிசை எண்ணுடன் சேர்ந்து காலத்தைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: எண்ணாகமம் 7-ல் இச்சொல் காணிக்கை செலுத்தும் கோத்திரத் தலைவரைக் குறிக்கிறது; ‘தலைவன்’ என்பது அவரது நிர்வாக மற்றும் பிரதிநிதித்துவப் பங்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: எப்பிராயீமின் மக்களுக்கான
  rationale: ל־ இங்கு உறவு அல்லது பிரதிநிதித்துவத்தைக் குறிக்கலாம். ‘மக்களுக்கான’ என்பது தலைவன் அவர்களுக்காக அல்லது அவர்களைச் சார்ந்து செயல்படுவதை இயல்பான தமிழில் காட்டுகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: தனிப்பெயர் தமிழின் ஒலியமைப்புக்கு ஏற்ற வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן עַמִּיהוּד
  choice: அம்மியூதின் மகன்
  rationale: எபிரெய மரபுவழி அடையாள அமைப்பை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எப்பிராயீமின் மக்கள்’ என்பது நேரடியான ‘எப்பிராயீமின் மகன்கள்’ என்பதைக் காட்டிலும் கோத்திர மக்களைக் குறிக்கும் இயல்பான தமிழாகத் தேர்ந்தெடுக்கப்பட்டது; எபிரெய முன்னிடைச்சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
