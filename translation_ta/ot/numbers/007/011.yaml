  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “ஒவ்வொரு நாளும் ஒரு தலைவர், ஒவ்வொரு நாளும் ஒரு தலைவர் என[a], அவர்கள் பலிபீடத்தின் அர்ப்பணிப்புக்காகத் தங்கள் காணிக்கையைச் சமர்ப்பிக்க வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நாளுக்கு ஒரு கோத்திரத் தலைவர்.” காணிக்கைகள் ஒழுங்கான வரிசையில் சமர்ப்பிக்கப்பட வேண்டும் என்பதை வலியுறுத்த எபிரெயத்தில் “ஒரு தலைவர், ஒரு நாள்” என்ற அமைப்பு திரும்பக் கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்ச்சியை முன்னெடுத்துச் செல்கிறது; இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: נָשִׂיא
  choice: தலைவர்
  rationale: இச்சூழலில் இஸ்ரவேலின் கோத்திரத் தலைவர்களைக் குறிக்கிறது; ‘தலைவர்’ என்பது அரச மரபைத் தேவையின்றி உணர்த்தாத, இயல்பான நவீனச் சொல்.
- source_word: אֶחָד לַיּוֹם
  choice: ஒரு நாளுக்கு ஒரு தலைவர்
  rationale: ஒவ்வொரு நாளிலும் ஒருவர் என்ற பகிர்முறைப் பொருளை வெளிப்படுத்தி, எபிரெய உரையின் வலியுறுத்தும் இரட்டிப்பையும் முதன்மை உரையில் காக்கிறது.
- source_word: יַקְרִיבוּ
  choice: செலுத்த வேண்டும்
  rationale: பலிசார் சூழலில் காணிக்கையை இறைவனிடம் சமர்ப்பிக்கும் செயலை இயல்பான தமிழில் குறிக்கிறது; பன்மை வினை வடிவத்தின் கட்டளைப் பொருளையும் காக்கிறது.
- source_word: קָרְבָּנָם
  choice: தங்கள் காணிக்கை
  rationale: கடவுளிடம் கொண்டுவரப்படும் பலிசார் அளிப்பைக் குறிக்கும் வழக்கமான, எளிதில் புரியும் தமிழ்ச் சொல்.
- source_word: לַחֲנֻכַּת
  choice: அர்ப்பணிப்புக்காக
  rationale: பலிபீடத்தை வழிபாட்டுப் பயன்பாட்டுக்கென அர்ப்பணிக்கும் நிகழ்வையும் நோக்கத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிகளைச் செலுத்தும் altar என்பதற்கான நிலையான தமிழாக்கம்.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெய உரையில் வரும் உடன்படிக்கையின் தனிப்பெயரை ‘ஆண்டவர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது; பழைய ஒலிப்பின் முழுத் துல்லியம் உறுதியாக இல்லாத நிலையையும் இந்த வழக்கமான வடிவம் ஏற்றுக்கொள்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தும் சொற்றொடர் மீளுரைத்தல் நீக்கப்படாமல் காக்கப்பட்டுள்ளது.
