base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b]; அவை இரண்டும் எண்ணெயுடன் கலந்த மெல்லிய மாவினால் தானியக் காணிக்கைக்காக நிரப்பப்பட்டிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘ஆழமற்ற பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம் (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: ‘கிண்ணம்’ என்பதற்குப் பதிலாக ‘பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம் (מִזְרָק); இது வழிபாட்டுச் சடங்கில் பயன்படுத்தப்பட்ட ஒரு பாத்திரம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: קָרְבָּן என்பது வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் காணிக்கையைக் குறிக்கிறது. ‘காணிக்கை’ என்பது இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் இணைச்சொல்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה அகலமான, ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கிறது; அதன் பொதுவான வடிவை ‘தட்டு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையில் பாத்திரத்தின் எடை குறிப்பிடப்படுவதை இயல்பான தமிழ்ப் பெயரெச்சத் தொடராகத் தருகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק ஒரு சடங்குப் பாத்திரம். இவ்வசனத்தில் அதன் குறிப்பிட்ட பயன்பாடு கூறப்படாததால், பொதுவாகப் புரியும் ‘கிண்ணம்’ பயன்படுத்தப்படுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் அளவின்படி
  rationale: இது எடையை நிர்ணயிக்கும் பரிசுத்த இடத்தின் அங்கீகரிக்கப்பட்ட சேக்கல் அளவைக் குறிக்கிறது; கூடுதல் விளக்கத்தைப் புகுத்தாமல் அந்த அளவுத் தரத்தைத் தெளிவுபடுத்துகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிரப்பப்பட்டிருந்தன
  rationale: இரண்டு பாத்திரங்களையும் வெளிப்படையாகச் சுட்டும் எபிரெய இருமைக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளில் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் வழிபாட்டுச் சொல்லை எளிய நவீன தமிழில் தருகிறது.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்த
  rationale: எண்ணெயும் மாவும் கலக்கப்பட்டிருந்த நிலையை எபிரெயச் செயப்பாட்டு வடிவுக்கு ஏற்ப தெரிவிக்கிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் מִנְחָה குறிக்கும் குறிப்பிட்ட தானியக் காணிக்கை வகையைப் பொதுவான ‘காணிக்கை’ என்று மங்கச் செய்யாமல் வழங்குகிறது.
