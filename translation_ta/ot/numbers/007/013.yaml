  register: நவீனத் தரத் தமிழில், பட்டியல் தன்மையுள்ள எபிரெய அமைப்பை வாசிக்க இயல்பாக இரண்டு வாக்கியங்களாக வழங்குகிறது. வழிபாட்டுச் சொற்களின் வேறுபாட்டைக் காக்க קָרְבָּן என்பதற்கு ‘காணிக்கை’ என்றும் מִנְחָה என்பதற்கு ‘தானியக் காணிக்கை’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
