translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் பட்டியல் அமைப்பு பெருங்குறி மூலம் பாதுகாக்கப்பட்டுள்ளது; பழமையான அளவான ‘சேக்கல்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டு, பரிசுத்த இடத்தின் எடைத் தரம் உரையிலேயே தெளிவாக்கப்பட்டுள்ளது.
