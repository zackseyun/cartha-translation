base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கலசம்[b]; அவை இரண்டும் தானியக் காணிக்கைக்காக எண்ணெய் கலந்த மெல்லிய மாவால் நிறைந்திருந்தன.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளித் தாம்பாளம்’; எபிரெயச் சொல் வழிபாட்டில் பயன்படுத்தப்பட்ட ஒரு பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெள்ளிக் கிண்ணம்’; எபிரெயச் சொல் பலிச் சடங்கில் பயன்படுத்தப்பட்ட ஒரு பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, பரிசுத்த ஸ்தலத்தில் பயன்பட்ட நிலையான சேக்கல் எடை அளவின்படி.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுக்காகக் கொண்டுவரப்பட்ட அர்ப்பணிப்பை குறிக்கும் קָרְבָּן என்பதற்கு இச்சூழலில் இயல்பான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קְעָרָה என்பது ஆழம் குறைந்த சடங்குப் பாத்திரத்தைக் குறிக்கலாம்; ‘தட்டு’ நவீன தமிழில் இயல்பாக உள்ளது, ‘தாம்பாளம்’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: ‘அதன் எடை நூற்று முப்பது’ என்ற எபிரெய அமைப்பை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק பலிக்குரிய பொருட்களுடன் தொடர்புடைய பாத்திரம்; ‘கிண்ணம்’ பொதுவாசகருக்குப் புரியும் இயல்பான சொல், அதேவேளை அதன் துல்லிய வடிவத்தை அளவுக்கு மீறி நிர்ணயிப்பதில்லை.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் எடைமுறையின்படி
  rationale: இது வழிபாட்டிடத்தில் அங்கீகரிக்கப்பட்ட எடைத் தரத்தைச் சுட்டும் வழக்குச் சொற்றொடர்; ‘எடைமுறை’ என்பதைச் சேர்ப்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிரப்பப்பட்டிருந்தன
  rationale: இரு பாத்திரங்களையும் வெளிப்படையாகக் குறிக்கும் எபிரெயப் பன்மையைப் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளில் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் பிசைந்த
  rationale: மாவும் எண்ணெயும் ஒன்றாகக் கலக்கப்பட்ட நிலையைக் குறிக்கும் எபிரெயச் செயப்பாட்டு பெயரெச்சத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரியச் சட்டச் சூழலில் מִנְחָה குறிப்பாக மாவு அல்லது தானியம் சார்ந்த காணிக்கையைச் சுட்டுகிறது.
