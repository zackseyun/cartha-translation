  source_fidelity: 'மூல எபிரெய உரையின் பொருள் பெரும்பாலும் துல்லியமாக உள்ளது: இரண்டு வெள்ளிப் பாத்திரங்கள், அவற்றின் எடைகள், பரிசுத்த சேக்கல் தரம், எண்ணெய் கலந்த மெல்லிய மாவு, தானியக் காணிக்கை ஆகிய அனைத்தும் காக்கப்பட்டுள்ளன. ஆனால் מִזְרָק என்பதற்கு ‘கிண்ணம்’ என்பதைவிட சடங்குப் பயன்பாட்டைச் சுட்டும் ‘கலசம்’ பொருத்தமானது. மேலும் ‘பரிசுத்த இடத்தின்’ என்பது הַקֹּדֶשׁ என்பதன் நிறுவப்பட்ட எடைத் தரப் பொருளை ஓரளவு இடமாக மாற்றுகிறது; ‘பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி’ என்பது வழக்கமான, தெளிவான வடிவம்.'
