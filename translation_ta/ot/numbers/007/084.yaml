translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’, ‘பலிபீடம்’, ‘அர்ப்பணிப்புக் காணிக்கை’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன; பாத்திரப் பெயர்களிலுள்ள மூலமொழி நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
