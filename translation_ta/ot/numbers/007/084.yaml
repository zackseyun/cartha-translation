base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: ta
  text: 'பலிபீடம் அபிஷேகம் செய்யப்பட்ட நாளில், இஸ்ரவேலின் தலைவர்கள்[b] அளித்த பலிபீடத்தின் அர்ப்பணிப்புக் காணிக்கை[a] இதுவே: வெள்ளித் தட்டுகள் பன்னிரண்டு, வெள்ளிக் கிண்ணங்கள் பன்னிரண்டு, தங்கக் கரண்டிகள் பன்னிரண்டு.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சொல்லாக, “இது பலிபீடத்தின் அர்ப்பணிப்பு” என்றும் மொழிபெயர்க்கலாம். ஆனால் முன்பு அளிக்கப்பட்ட காணிக்கைகளை இவ்வசனம் சுருக்கிக் கூறுவதால், “அர்ப்பணிப்புக் காணிக்கை” என்பது இங்குள்ள பொருளைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் முதன்மையானவர்கள்” அல்லது “இஸ்ரவேலின் கோத்திரத் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அங்கீகரிக்கப்பட்ட கோத்திரத் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இந்தப் பாத்திரங்களுக்கான எபிரெயப் பெயர்களை முறையே “வெள்ளித் தட்டுகள்/அகன்ற கிண்ணங்கள்,” “வெள்ளிக் கிண்ணங்கள்/பாத்திரங்கள்,” “தங்கக் கரண்டிகள்/சிறிய அகப்பைகள்” என்றும் புரிந்துகொள்ளலாம்; அவற்றின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: அதன் அர்ப்பணிப்புக் காணிக்கை இதுவே
  rationale: חֲנֻכָּה என்பது அர்ப்பணிப்பு அல்லது பிரதிஷ்டையைக் குறிக்கிறது. முந்தைய காணிக்கைகளின் பட்டியலைச் சுருக்கிக் கூறும் சூழலில், அவை அர்ப்பணிப்புக்காக அளிக்கப்பட்ட காணிக்கைகள் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; זֹאת என்பதன் சுட்டுப்பொருளை ‘இதுவே’ காக்கிறது.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: பலிபீடம் அபிஷேகம் செய்யப்பட்ட நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய சொற்றொடரை இயல்பாகத் தருகிறது; ‘அது’ என்பதற்குப் பதிலாகக் குறிப்பிட்ட பெயரைப் பயன்படுத்துவது தமிழில் தெளிவளிக்கிறது.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்கள்
  rationale: இந்தச் சூழலில் נָשִׂיא என்பது கோத்திரங்களின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; ‘இளவரசர்கள்’ என்ற அரசகுலப் பொருள் தவிர்க்கப்படுகிறது.
- source_word: קַעֲרֹת כֶּסֶף
  choice: வெள்ளித் தட்டுகள்
  rationale: காணிக்கைப் பொருட்களை வைக்கும் தட்டு அல்லது அகன்ற பாத்திரத்தைக் குறிக்கும் சொல்லாகும்; அடுத்து வரும் வேறுவகைப் பாத்திரத்திலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: מִזְרְקֵי כֶסֶף
  choice: வெள்ளிக் கிண்ணங்கள்
  rationale: சடங்கில் பயன்படுத்தப்பட்ட கிண்ணம் அல்லது basin வகைப் பாத்திரத்தைக் குறிக்கிறது; நவீன தமிழில் ‘கிண்ணங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כַּפּוֹת זָהָב
  choice: தங்கக் கரண்டிகள்
  rationale: כַּף என்பதன் அடிப்படைப் பொருள் ‘உள்ளங்கை’; பாத்திரப் பயன்பாட்டில் இது கரண்டி அல்லது சிறிய அகப்பை போன்ற பொருளைக் குறிக்கலாம். ‘கரண்டிகள்’ வாசகருக்குப் புரியும் நேரடியான தமிழ்; வடிவம் குறித்த நிச்சயமின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு
  rationale: மூன்று வகைப் பாத்திரங்களின் எண்ணிக்கையையும் நேரடியாகத் தருகிறது; எபிரெய பாலின ஒத்திசைவைத் தமிழில் தனியே காட்டத் தேவையில்லை.
