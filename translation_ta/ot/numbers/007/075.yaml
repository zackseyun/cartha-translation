  text: மாட்டினத்தில் ஒரு காளை, ஒரு செம்மறியாட்டுக் கடா, ஓராண்டு வயதுள்ள ஒரு ஆண் செம்மறியாட்டுக்குட்டி தகனபலிக்காக;
