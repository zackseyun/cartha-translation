lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: எருதுக்கூட்டத்திலிருந்து ஒரு காளை
  rationale: פַּר என்பது காளையையும், בֶּן־בָּקָר என்பது மந்தையிலுள்ள மாட்டினத்திலிருந்து வந்தது என்பதையும் குறிக்கிறது. எபிரெயச் சொல்லமைப்பை மரத்தனமாக மொழிபெயர்க்காமல், பலிக்குரிய விலங்கின் வகையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַיִל
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: பலிச்சூழலில் இது வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ அதன் பாலினத்தையும் வகையையும் துல்லியமாகக் காட்டுகிறது.
- source_word: כֶּבֶשׂ
  choice: ஓர் ஆட்டுக்குட்டி
  rationale: இச்சொல் பலிக்குரிய இளம் செம்மறியாட்டைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்பட்டது; இங்கு இலக்கண ஆண்பால் வடிவமே இருப்பதால் தனியே ‘ஆண்’ என்று சேர்க்கத் தேவையில்லை.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ஓராண்டான
  rationale: ‘அதன் ஆண்டின் மகன்’ என்ற சொற்படி வடிவம், முதல் ஆண்டில் உள்ள அல்லது ஓராண்டு வயதான விலங்கைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் ‘ஓராண்டான’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான சொல். முன்னொட்டு לְ நோக்கம் அல்லது பயன்பாட்டைக் குறைப்பதால் ‘தகனபலிக்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒரு / ஓர்
  rationale: ஒவ்வொரு விலங்கின் எண்ணிக்கையையும் தனித்தனியாகக் குறிக்கும் எண்ணுப்பெயர் மொழிபெயர்ப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
