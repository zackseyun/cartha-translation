  text: one male goat for a sin offering.
translation:
  language: ta
  text: பாவப்பலிக்காக ஓர் ஆண் வெள்ளாடு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆண் வெள்ளாடு
  rationale: பலிச் சூழலில் இந்த எபிரெயச் சொற்றொடர் ஆண் பாலினத்தைச் சேர்ந்த வெள்ளாட்டைக் குறிக்கிறது. நவீனத் தமிழில் ‘ஆண் வெள்ளாடு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: பலிகளின் எண்ணிக்கைப்பட்டியலில் வெளிப்படையாக உள்ள ‘ஒன்று’ என்ற எண்ணிக்கையைத் தமிழில் ‘ஓர்’ என்று இயல்பாகத் தக்கவைக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: இங்கு חַטָּאת என்பது பொதுவான ‘பாவம்’ என்பதையல்ல, பலியிடும் முறையில் செலுத்தப்படும் ஒரு குறிப்பிட்ட பலியைக் குறிக்கிறது; לְ முன்னொட்டின் நோக்கப் பொருளை ‘-க்காக’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பலியியல் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவத்துக்காக
  rationale: உடனடிச் சூழல் பலிப்பொருட்களின் பட்டியல் என்பதால், இங்கு குறிக்கப்படுவது கருத்தளவிலான பாவம் அல்ல, ஒரு பலிவகை. ‘பாவநிவாரணப் பலி’ என்பது தமிழில் அந்த வழிபாட்டுச் சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; பின்னைய கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: சுருக்கமான பலிப்பட்டியல் நடையைப் பேணும், நவீனமும் கண்ணியமானதுமான நிலையான தமிழ். எபிரெயத்தில் வெளிப்படையாக உள்ள விலங்கின் பாலினமும் எண்ணிக்கையும் தக்கவைக்கப்பட்டுள்ளன.
