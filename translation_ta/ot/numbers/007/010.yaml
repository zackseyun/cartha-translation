  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: ta
  text: பலிபீடம் அபிஷேகம் செய்யப்பட்ட நாளில், தலைவர்கள் அதன் அர்ப்பணிப்புக்கான காணிக்கையைச் செலுத்தினார்கள்[a]. தலைவர்கள் தங்கள் காணிக்கையைப் பலிபீடத்தின் முன் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, ‘பலிபீடத்தின் அர்ப்பணிப்பை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: செலுத்தினார்கள்
  rationale: הקריב என்பதன் ஹிஃபில் வடிவம் வழிபாட்டு மற்றும் பலியிடும் சூழலில் ஒன்றைக் கொண்டுவந்து சமர்ப்பிப்பதையோ காணிக்கையாகச் செலுத்துவதையோ குறிக்கிறது. ‘செலுத்தினார்கள்’ என்பது இரு இடங்களிலும் இயல்பாகப் பொருந்தி, வழிபாட்டுச் சூழலையும் காக்கிறது.
- source_word: הַנְּשִׂאִים
  choice: தலைவர்கள்
  rationale: எண்ணாகமத்தில் נָשִׂיא என்பது கோத்திரங்களின் தலைவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது நவீன தமிழில் தெளிவானதும், தேவையற்ற அரச மரபுப் பொருளைத் தவிர்ப்பதும் ஆகும்.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: அதன் அர்ப்பணிப்புக்கான காணிக்கை
  rationale: חֲנֻכָּה என்பதன் அடிப்படைப் பொருள் ‘அர்ப்பணிப்பு’. இங்கு தலைவர்கள் அர்ப்பணிப்பு நிகழ்வுடன் தொடர்புடைய காணிக்கைகளைச் செலுத்துவதால், தமிழில் செயப்பொருள் தெளிவாக இருக்க ‘அர்ப்பணிப்புக்கான காணிக்கை’ என்று வழங்கப்பட்டுள்ளது; சொற்சொல்லான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: அபிஷேகம் செய்யப்பட்ட நாளில்
  rationale: בְּ + infinitive construct காலத்தைக் குறிக்கிறது. பலிபீடமே செயப்படுபொருள் என்பதை இந்த இயல்பான தமிழ்ச் செயலப்பாட்டு அமைப்பு தெளிவாக்குகிறது.
- source_word: קָרְבָּנָם
  choice: தங்கள் காணிக்கை
  rationale: קָרְבָּן என்பது வழிபாட்டில் கடவுளிடம் கொண்டுவரப்படும் படைப்பு அல்லது காணிக்கையைக் குறிக்கும் பொதுச் சொல். இச்சூழலில் ‘காணிக்கை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் முன்
  rationale: לִפְנֵי இங்கு இடத்தைக் குறிக்கிறது. ‘பலிபீடத்தின் முன்’ என்பது நேரடியான, இயல்பான தமிழாக்கம்.
