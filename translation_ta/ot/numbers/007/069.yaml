  language: en
  yaml_path: translation/ot/numbers/007/069.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ta
  text: தகனபலிக்காக மாட்டுமந்தையைச் சேர்ந்த ஒரு காளை[a], ஒரு செம்மறியாட்டுக் கடா, ஒரு வயதுடைய ஒரு ஆண் ஆட்டுக்குட்டி[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘ஒரு காளை, மாட்டுமந்தையின் மகன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு ஆட்டுக்குட்டி’; எபிரெயச் சொல் பலிச் சூழல்களில் ஆண் ஆட்டுக்குட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: மந்தையிலிருந்து ஒரு காளை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘மாட்டுமந்தையின் மகனான ஒரு காளை.’ இது மாட்டினத்தை வகைப்படுத்தும் மரபுத்தொடர் என்பதால், இயல்பான தமிழில் ‘மந்தையிலிருந்து ஒரு காளை’ என வழங்கப்பட்டுள்ளது.
- source_word: אַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது பலிச் சூழலில் வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘செம்மறியாட்டுக் கடா’ தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ஓர் ஆட்டுக்குட்டி
  rationale: כֶּבֶשׂ என்பது ஆட்டுக்குட்டியைக் குறிக்கிறது. இச்சொல்லே அதன் பாலினத்தை எப்போதும் வெளிப்படையாகக் குறிக்காததால், மூலத்தின் சாத்தியமான பொதுப் பொருள் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בֶּן שְׁנָתוֹ
  choice: ஒரு வயதான
  rationale: ‘தன் ஆண்டின் மகன்’ என்ற எபிரெய மரபுத்தொடர் ஒரு வயதுடையது என்பதைக் குறிக்கிறது; தமிழில் ‘ஒரு வயதான’ என்பது இயல்பான வயதுக் குறிப்பு.
- source_word: לְעֹלָה
  choice: தகனபலிக்காக
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல்; தமிழ் வேதாகம நடையில் அறியப்பட்ட ‘தகனபலி’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֶחָד
  choice: ஒரு / ஓர்
  rationale: ஒவ்வொரு விலங்குடனும் மீள வரும் எண்ணிக்கையைப் பட்டியல் அமைப்பில் காக்கிறது; அடுத்த சொல்லின் தொடக்கத்திற்கேற்ப தமிழ் புணர்ச்சி வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
