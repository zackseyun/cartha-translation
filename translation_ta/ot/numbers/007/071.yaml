  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: ta
  text: சமாதானப் பலிக்காக[a] இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஒரு வயதுள்ள ஐந்து செம்மறியாட்டுக் குட்டிகள். இது அம்மிசதாயின் மகன் அகியேசேரின் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘கூட்டுறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ‘சமாதானப் பலி’ என்று மொழிபெயர்க்கப்பட்ட שְׁלָמִים என்பதன் பிற ஏற்றுக்கொள்ளத்தக்க பொருள் நிழல்களைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்பிடைச்சொல் மற்றும் முன்னிடைச்சொல்லுடன் வரும் வழிபாட்டுச் சொற்றொடரை இயல்பான தமிழில் தருகிறது. שְׁלָמִים என்பதற்குரிய மரபான பலியியல் சொல்லாக ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினத்தைக் குறிப்பாக வரையறுக்காமல் மாட்டினத்தைக் குறிக்கிறது; ஆகவே ‘எருதுகள்’ என்று மிகையாகக் குறிப்பாக்காமல் ‘மாடுகள்’ எனத் தரப்பட்டது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாக ‘செம்மறியாட்டுக் கடாக்கள்’ என வழங்கப்பட்டது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிக்கும் என்பதால் பாலின வேறுபாடு பாதுகாக்கப்பட்டது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து செம்மறியாட்டுக் குட்டிகள்
  rationale: ‘ஒரு ஆண்டின் குட்டிகள்’ என்ற எபிரெயச் சொற்றொடரின் வயது விவரத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: கதைச்சூழலில் ஏற்கெனவே செலுத்தப்பட்ட அர்ப்பணிப்பைச் சுட்டும் சூத்திரத்தைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: அம்மிசதாயின் மகன் அகியேசேர்
  rationale: தனிப்பெயர்கள் எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டு, בֶּן என்பது ‘மகன்’ என நேரடியாகத் தரப்பட்டது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியியல் சொல்லின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: எபிரெயச் சொல் சமாதானம், நல்வாழ்வு, உறவுணர்வு ஆகிய பொருள் வளைகளைக் கொண்டிருக்கலாம். தமிழில் பரவலாக அறியப்படும் மரபுச் சொல் பயன்படுத்தப்பட்டது; எந்த ஒரு தனிப்பட்ட கோட்பாட்டு விளக்கமும் வசனத்துக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பலியியல் பட்டியலின் மீளுருவ அமைப்பு பாதுகாக்கப்பட்டு, விலங்குகளின் வகை மற்றும் பாலின வேறுபாடுகள் தெளிவாக்கப்பட்டுள்ளன.
