  terminology: ‘சமாதானப் பலி’ is an established, suitable rendering for שְׁלָמִים. A footnote should retain the lexical breadth reflected in the English audit trail. ‘செம்மறியாட்டுக் கடாக்கள்’ and ‘வெள்ளாட்டுக் கடாக்கள்’ correctly preserve the distinction between rams and male goats.
