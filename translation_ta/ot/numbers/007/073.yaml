base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி[b] எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்; அவை இரண்டும் தானியக் காணிக்கைக்காக எண்ணெயுடன் கலக்கப்பட்ட நுண்ணிய மாவால் நிறைந்திருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளித் தாம்பாளம்.’ קַעֲרָה என்பது பரிசுத்தக் கூடாரப் பொருட்களில் இடம்பெறும் ஆழம் குறைந்த பாத்திரம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘பரிசுத்த ஸ்தலத்தின் சேக்கலின்படி’; இது பரிசுத்தமான எடைத் தரத்தைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பை קָרְבָּן குறிக்கிறது; ‘காணிக்கை’ என்பது இயல்பானதும் சூழலுக்கு ஏற்றதுமான தமிழ் சொல்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קְעָרָה என்பது இங்கு பரிசுத்தக் கூடாரப் பயன்பாட்டிலுள்ள ஆழம் குறைந்த பாத்திரம்; ‘தட்டு’ இதைத் தெளிவாகக் குறிக்கிறது. ‘தாம்பாளம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையின் பாத்திரம்–எடைத் தகவலை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק என்பது சடங்கில் பயன்படுத்தப்பட்ட ஒரு பாத்திரம்; தமிழில் எளிதில் புரியும் ‘கிண்ணம்’ அதன் வடிவத்தையும் பயன்பாட்டையும் மிகையாகத் தீர்மானிக்காமல் தெரிவிக்கிறது.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இத்தொடர் கிண்ணத்தின் எடையைக் குறிப்பிடுவதைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் எடைமுறையின்படி
  rationale: இது அளவுக்கான பரிசுத்த நிலையத் தரத்தைச் சுட்டுகிறது; ‘எடைமுறை’ என்பதைச் சேர்ப்பது நவீன வாசகருக்கு பொருளைத் தெளிவாக்குகிறது, அதேவேளை மூலத்தின் ‘பரிசுத்த இடத்தின் சேக்கல்’ வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிறைந்திருந்தன
  rationale: இரு பாத்திரங்களையும் வெளிப்படையாகச் சுட்டும் எபிரெயப் பன்மை வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: பலிக்காகப் பயன்படுத்தப்படும் நன்றாக அரைக்கப்பட்ட உயர்தர மாவைத் தமிழில் வழக்கமான வேதாகமச் சொல்லாக்கமான ‘நைசான மாவு’ குறிக்கிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலக்கப்பட்ட
  rationale: செயப்பாட்டு வினையெச்சத்தின் பொருளை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரியச் சட்டச் சூழலில் מִנְחָה குறிப்பாக தானியத்தால் செய்யப்பட்ட காணிக்கையைக் குறிக்கிறது; பொதுவான ‘காணிக்கை’ என்று மட்டும் மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
