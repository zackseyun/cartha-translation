base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: ta
  text: மோசே அவரோடு பேசுவதற்காகச் சந்திப்புக் கூடாரத்திற்குள் சென்றபோது, சாட்சிப் பெட்டியின்மேல் இருந்த பாவநிவாரண மூடியின் மேலிருந்தும் இரண்டு கேருபீன்களுக்கு இடையிலிருந்தும் அவரிடம் பேசுகிற குரலைக் கேட்டார்[a][b]. அவர் அவரிடம் பேசினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேசுகிற குரல்” என்பதை “அவரிடம் உரைக்கப்படும் குரல்” என்ற நுணுக்கத்திலும் எபிரெயச் சொல்லமைப்பைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பாவநிவாரண மூடி” என்பது சாட்சிப் பெட்டியின் பரிசுத்த மூடி. குரல் அந்த மூடியின் மேலிருந்தும் இரண்டு கேருபீன்களுக்கு இடையிலிருந்தும் வந்ததாக வசனம் கூறுகிறது.
    reason: cultural_note
  - marker: c
    text: இறுதி வாக்கியத்தின் எழுவாய் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை. இதை “அந்தக் குரல் அவரிடம் பேசியது” என்றும், சூழலின் அடிப்படையில் “ஆண்டவர் மோசேயிடம் பேசினார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: சென்றபோது
  rationale: ב முன்னொட்டுடன் வரும் בוא வினையெச்சம் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாகவும் மூலத்தின் காலத் தொடர்பைத் தெளிவாகவும் தருகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தமது மக்களைச் சந்திக்கும் பரிசுத்த இடத்தைக் குறிக்கும் நிலையான, பொருள்தெளிவுள்ள தமிழ் சொற்றொடர்.
- source_word: לְדַבֵּר אִתּוֹ
  choice: அவரோடு பேசுவதற்காக
  rationale: אִתּוֹ என்பதிலுள்ள ‘உடன்/ஓடு’ என்ற உறவுநிலையைப் பாதுகாக்கிறது; சூழலின்படி ‘அவர்’ என்பது தேவனைக் குறிக்கிறது.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: குரலைக் கேட்டார்
  rationale: קוֹל என்பது ‘ஒலி’ அல்லது ‘குரல்’ எனலாம்; தொடர்ந்து வரும் ‘பேசுகிற’ என்பதால் இங்கு ‘குரல்’ இயல்பானது.
- source_word: מִדַּבֵּר
  choice: பேசுகிற
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்நிலைச் செயலை நேரடியாகக் காட்டுகிறது; அதன் அரிய தன்னிலை/செயப்பாட்டு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடியின் மேலிருந்து
  rationale: כַּפֹּרֶת என்பது பெட்டியின் பரிசுத்த மூடி; ‘பாவநிவாரண மூடி’ அதன் வழிபாட்டு செயல்பாட்டையும் அது ஒரு மூடி என்பதையும் சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: אֲרֹן הָעֵדֻת
  choice: சாட்சிப் பெட்டி
  rationale: עֵדֻת என்பதன் சாட்சி/உடன்படிக்கைச் சான்று சார்ந்த பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: இரண்டு கேருபீன்களுக்கும் நடுவிலிருந்து
  rationale: குறிப்பிட்ட விண்ணுலக உயிரினங்களின் எபிரெயப் பெயரை ஒலிபெயர்த்து, பன்மையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: அவர் மோசேயோடு பேசினார்
  rationale: மறைந்துள்ள ஒருமை எழுவாயைச் சூழலின்படி தேவனாகவும், אֵלָיו என்பதன் பெறுநரை மோசேயாகவும் வெளிப்படுத்துகிறது; மாற்று இலக்கணப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: לְדַבֵּר אִתּוֹ என்பதில் உள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அவரோடு’ என்பது தேவனைக் குறிக்கிறது
  alternative: சுட்டுப்பெயரை வெளிப்படுத்தாமல் ‘பேசுவதற்காக’ என மொழிபெயர்த்தல்
  rationale: சந்திப்புக் கூடாரமும் கேருபீன்களுக்கு நடுவிலிருந்து வரும் குரலும் தெய்வீக உரையாடலைச் சுட்டுகின்றன; அதேவேளை மூலத்தில் உள்ள சுட்டுப்பெயர் தமிழிலும் வைக்கப்படுகிறது.
- issue: וַיְדַבֵּר אֵלָיו என்ற இறுதி வாக்கியத்தின் எழுவாய்
  choice: தேவன் மோசேயோடு பேசினார்
  alternative: ‘அந்தக் குரல் அவரோடு பேசியது’ அல்லது ‘மோசே அவரோடு பேசினார்’
  rationale: உடனடியான சூழலில் குரல் மோசேயை நோக்கிப் பேசுவதால் தேவனே மறைந்துள்ள எழுவாய் என்பது மிக இயல்பான வாசிப்பு. எனினும் எபிரெயத்தில் எழுவாய் வெளிப்படையாகப் பெயரிடப்படாததால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. ‘சந்திப்புக் கூடாரம்’, ‘சாட்சிப் பெட்டி’, ‘பாவநிவாரண மூடி’ ஆகியவை வழிபாட்டுச் சூழலைச் சாதாரண வாசகருக்குத் தெளிவாக்குகின்றன. எபிரெயத்தின் மறைந்த எழுவாய் தொடர்பான உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
