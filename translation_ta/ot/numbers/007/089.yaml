  source_fidelity: 'மையப் பொருள் பெரும்பாலும் துல்லியமாக உள்ளது: மோசே சந்திப்புக் கூடாரத்திற்குள் செல்வதும், சாட்சிப் பெட்டியின்மேலுள்ள மூடியின் மேலிருந்தும் கேருபீன்களுக்கு இடையிலிருந்தும் வந்த குரலைக் கேட்பதும் சரியாகத் தரப்பட்டுள்ளன. ஆனால் இறுதி வாக்கியத்தில் மூலத்தில் வெளிப்படையாக இல்லாத ‘மோசே’ சேர்க்கப்பட்டு, மறைந்துள்ள எழுவாய் மற்றும் சுட்டுப்பெயர்களின் தெளிவின்மை தேவையற்ற வகையில் தீர்மானிக்கப்பட்டுள்ளது. மேலும் கேருபீன்களைக் குறிக்கும் இடவியல் சொற்றொடர் இயல்பாகத் திருத்தப்பட வேண்டும்.'
