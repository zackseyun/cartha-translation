  terminology: ‘சந்திப்புக் கூடாரம்,’ ‘சாட்சிப் பெட்டி,’ ‘பாவநிவாரண மூடி,’ ‘கேருபீன்கள்’ ஆகியவை பொருத்தமான, நிலையான வழிபாட்டு/வரலாற்றுச் சொற்கள். அடிக்குறிப்பு b-யில் மூலத்தில் இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படாத ‘ஆண்டவர்’ என்பதைக் கூற்றாகச் சேர்ப்பதைத் தவிர்த்து, பொருள்விளக்கமாக மாற்றுவது பாதுகாப்பானது.
