  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: ta
  text: 'பத்தாம் நாளில், தாணின் மக்களின் தலைவர் அம்மிசத்தாயின் மகன் அகியேசேர்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: பத்தாம் நாளில்
  rationale: בְּ உடன் வரும் יוֹם இங்கு காலத்தைக் குறிக்கிறது; தமிழ் வழக்கில் இயல்பாகவும் மூலத்தின் வரிசைக்கு நெருக்கமாகவும் ‘பத்தாம் நாளில்’ என வழங்கப்பட்டது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இச்சூழலில் கோத்திரத்தின் அங்கீகரிக்கப்பட்ட பிரதிநிதித் தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிப்பதாகத் தவறாகப் புரியக்கூடிய ‘இளவரசன்’ என்பதைக் காட்டிலும் ‘தலைவன்’ தெளிவானது.
- source_word: לִבְנֵי דָן
  choice: தாணின் மக்களுக்கான
  rationale: לְ என்பது இங்கு அந்தத் தலைவன் பிரதிநிதித்துவப்படுத்தும் குழுவுடனான உறவைக் காட்டுகிறது. בְּנֵי என்பதன் குடும்பவழி சொல்லாட்சியை ‘மக்கள்’ காக்கிறது; ‘-க்கான’ எபிரெய முன்னிடைச்சொல்லின் இயல்பான தமிழ் இணை.
- source_word: אֲחִיעֶזֶר
  choice: அகியேசர்
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தைவழி உறவைக் காட்டும் வழக்கமான நேரடி தமிழ் இணை.
- source_word: עַמִּישַׁדָּי
  choice: அம்மிசதாய்
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவத்தின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. அடுத்த வசனத்தில் காணிக்கையின் விவரங்கள் தொடர்வதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
