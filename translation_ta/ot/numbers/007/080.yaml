lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு இந்தச் சொல் உள்ளங்கை அல்லது கரண்டியைக் குறிக்காமல், தூபத்தை வைக்கும் சிறிய சடங்குப் பாத்திரத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘கிண்ணம்’ அந்தப் பயன்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַחַת
  choice: ஒரு
  rationale: כַּף என்ற பெண்பால் பெயர்ச்சொல்லுடன் இயையும் எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்து சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையில் எடையலகின் பெயர் விடுபட்டுள்ளது. எண்ணாகமம் 7-இல் திரும்பத் திரும்ப வரும் காணிக்கைப் பட்டியல் அமைப்பின்படி ‘சேக்கல்’ என்பது உள்ளுறையாகப் புரிந்துகொள்ளப்படுகிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘எடையுள்ள’ என்பதும் சேர்க்கப்பட்டுள்ளது.
- source_word: זָהָב
  choice: பொன்
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைக் குறிக்கிறது; ‘பொற்கிண்ணம்’ என்பது இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: מְלֵאָה
  choice: நிறைந்தது
  rationale: பாத்திரத்தின் உள்ளடக்கத்தை விவரிக்கும் பயனிலைப் பெயரடை; தமிழில் இயல்பாக வினைமுற்று வடிவில் தரப்பட்டுள்ளது.
- source_word: קְטֹרֶת
  choice: தூபம்
  rationale: ஆசரிப்புக்கூடார மற்றும் ஆசாரியச் சூழலில் எரிக்கப்படும் நறுமணத் தூபப்பொருளுக்கான வழக்கமான தமிழ் சொல்.
