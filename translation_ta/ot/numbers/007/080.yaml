  text: பத்து சேக்கல் எடையுள்ள ஒரு பொற்கிண்ணம்[b], தூபத்தால் நிறைந்தது;
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: כַּף என்ற எபிரெயச் சொல் சில பாரம்பரிய மொழிபெயர்ப்புகளில் ‘கரண்டி’ என மொழிபெயர்க்கப்பட்டுள்ளது. இங்கு அது தூபத்தை வைக்கும் சிறிய பாத்திரம் அல்லது கிண்ணத்தைக் குறிக்கிறது.
