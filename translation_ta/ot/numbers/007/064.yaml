lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆண் வெள்ளாடு
  rationale: இந்த எபிரெய மரபுத்தொடர் ஆண் வெள்ளாட்டைக் குறிக்கிறது. ‘ஆண் வெள்ளாடு’ என்பது இன்றைய வாசகர்களுக்குத் தெளிவாகவும் பலியிடப்படும் விலங்கின் பாலினத்தைத் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: எபிரெயத்தில் எண்ணிக்கை வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது. எண்ணாகத் திரும்பத் திரும்ப வரும் பட்டியல் நடையைத் தமிழில் இயல்பாகப் பாதுகாக்க ‘ஒரு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரண பலிக்காக
  rationale: பலியிடும் சடங்கு சார்ந்த இச்சூழலில் חַטָּאת என்பது பொதுவாகப் ‘பாவம்’ என்ற கருத்தை மட்டும் அல்ல, பாவத்துக்காகச் செலுத்தப்படும் குறிப்பிட்ட பலியைக் குறிக்கிறது. முன்னொட்டு לְ நோக்கத்தைக் குறிப்பதால் ‘பலிக்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
