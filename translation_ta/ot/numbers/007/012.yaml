  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: ta
  text: முதல் நாளில் தன் காணிக்கையை அர்ப்பணித்தவர் யூதா கோத்திரத்தைச் சேர்ந்த அம்மினதாபின் மகன் நகசோன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதா கோத்திரத்தின் சார்பில்.” எபிரெயத்தில் இச்சொற்றொடர் நகசோனின் கோத்திரச் சார்பைக் குறிக்கலாம்; அவர் அந்தக் கோத்திரத்தின் பிரதிநிதியாகக் காணிக்கையை அர்ப்பணித்தார் என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: செலுத்தியவர் ... நகசோன்
  rationale: எபிரெயக் கதைத் தொடரின் இணைப்பையும் இருப்பைக் குறிக்கும் வினையையும், தமிழில் இயல்பான அடையாளப்படுத்தும் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது; தேவையற்ற பழமையான ‘அப்பொழுது சம்பவித்ததாவது’ போன்ற நடையைத் தவிர்க்கிறது.
- source_word: הַמַּקְרִיב
  choice: செலுத்தியவர்
  rationale: ஹிஃபில் வினையெச்சம் காணிக்கையை அணுகச் செய்தல் அல்லது முன்வைத்தல் என்ற வழிபாட்டுச் செயலைக் குறிக்கிறது. ‘செலுத்தியவர்’ என்பது இச்சூழலில் இயல்பாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதல் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֶת קָרְבָּנוֹ
  choice: தன் காணிக்கையை
  rationale: קָרְבָּן இங்கு திருக்கூடார அர்ப்பணிப்புடன் தொடர்புடைய வழிபாட்டுக் காணிக்கையைக் குறிக்கிறது. ‘தன்’ என்பது எழுவாயையே உடைமையாளராகத் தெளிவாகக் காட்டுகிறது.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: அம்மினதாபின் மகனான நகசோன்
  rationale: தனிப்பெயர்களைத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கி, எபிரெயத் தந்தைவழி உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְמַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்தைச் சேர்ந்தவர்
  rationale: מַטֶּה இங்கு ‘கோத்திரம்’ எனப் பொருள்படும். לְ முன்னொட்டு கோத்திரச் சார்பையோ அதன் பிரதிநிதித்துவத்தையோ குறிக்கலாம்; முதன்மை உரையில் இயல்பான சார்பு பொருள் தரப்பட்டுள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
