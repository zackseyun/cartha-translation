  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. வழிபாட்டுச் சூழலைப் பாதுகாக்க ‘காணிக்கை’, பழங்குடி அமைப்பைக் குறிக்க ‘கோத்திரம்’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
