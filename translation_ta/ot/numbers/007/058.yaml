  text: one male goat for a sin offering;[a]
translation:
  language: ta
  text: பாவநிவாரணப் பலிக்காக ஓர் ஆண் வெள்ளாடு;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூய்மைப்படுத்தும் பலிக்காக.’ எபிரெயச் சொல் חַטָּאת, பாவத்தையும் சடங்குத் தீட்டையும் நீக்குவதற்குரிய பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆண் வெள்ளாடு
  rationale: இந்த எபிரெய மொழித்தொடர் பலிக்குரிய ஆண் வெள்ளாட்டைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் விலங்கின் பாலினத்தைத் தெளிவாகவும் தெரிவிக்கும் சொற்றொடர் இது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: எண்ணிக்கையை வெளிப்படையாகத் தக்கவைத்து, எண்ணாகமம் 7-இன் திரும்பத் திரும்ப வரும் காணிக்கைப் பட்டியல் நடையைப் பேணுகிறது; உயிர்மெய்யால் தொடங்கும் பெயருக்கு முன் ‘ஓர்’ இயல்பான வடிவம்.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: לְ நோக்கத்தைக் குறிக்கிறது; பலிசார் சூழலில் חַטָּאת என்பது பாவத்தையும் சடங்குத் தீட்டையும் கையாளும் பலியைக் குறிக்கலாம். ‘பாவநிவாரணப் பலி’ தமிழில் அடையாளம் காணக்கூடிய பலிவகைப் பெயராகவும் சூழலுக்கு இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: பலிசார் சூழலில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: இங்கு ஒரு குறிப்பிட்ட பலிவகை குறிக்கப்படுவது தெளிவு. ஆனால் அந்த எபிரெயச் சொல் பாவத்தோடு மட்டுமல்லாமல் சடங்குத் தீட்டை அகற்றுவதோடும் தொடர்புடையதால், முதன்மை உரையில் பரிச்சயமான ‘பாவநிவாரணப் பலி’ பயன்படுத்தப்பட்டு மாற்று நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், காணிக்கைப் பட்டியலின் சுருக்கமான மற்றும் கண்ணியமான நடையைப் பேணும் மொழியாக்கம். ‘ஓர்’ மூலம் மூலத்தின் எண்ணிக்கை அமைப்பு வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
