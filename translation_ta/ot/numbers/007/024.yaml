translation:
  language: ta
  text: மூன்றாம் நாளில், செபுலோனின் சந்ததியினரின் தலைவர் ஏலோனின் மகன் எலியாப்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: בְּ முன்னிலைச்சொல் இங்குக் காலத்தைக் குறிக்கிறது; நவீனத் தமிழில் இந்த நிகழ்வுரைச் சூத்திரத்திற்கு ‘நாளில்’ இயல்பானது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: எண்ணாகமத்தில் இச்சொல் ஒரு கோத்திரத்தின் அங்கீகரிக்கப்பட்ட தலைமகனைக் குறிக்கிறது. அரச மரபைத் தேவையின்றி உணர்த்தக்கூடிய சொற்களை விட ‘தலைவன்’ இங்கு தெளிவானதும் சூழலுக்கு ஏற்றதும் ஆகும்.
- source_word: לִבְנֵי זְבוּלֻן
  choice: செபுலோனின் மக்களின்
  rationale: לְ இங்கு செபுலோனின் வழிவந்த மக்களோடு உள்ள இணைப்பையோ அவர்களைப் பிரதிநிதித்துவப்படுத்துவதையோ குறிக்கலாம். முதன்மை உரை affiliation-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אֱלִיאָב
  choice: எலியாப்
  rationale: எபிரெயப் பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுப்பெயர்த் தொடரை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: חֵלֹן
  choice: ஏலோன்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வடிவிலுள்ள எபிரெய மூலத்தின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லாததால் தமிழிலும் தேவையற்ற வினைச்சொல் சேர்க்கப்படவில்லை.
