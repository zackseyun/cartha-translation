id: NUM.7.77
reference: Numbers 7:77
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: ta
  text: மேலும், சமாதானப் பலியாக இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஒரு வயதுடைய ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள். இது ஆக்ரானின் மகன் பகியேலின் காணிக்கை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் காணிக்கைப் பட்டியலின் அடுத்த பகுதியை அறிமுகப்படுத்துகின்றன. שְׁלָמִים என்பது நியமிக்கப்பட்ட பலிவகையின் பெயர்; மரபில் அறியப்பட்ட ‘சமாதானப் பலி’ அதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினத்தைக் குறிப்பிடாத கூட்டுப்பெயர். ஆகவே ‘இரண்டு எருதுகள்’ என்று குறிப்பாக்காமல் ‘இரண்டு மாடுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵילִים חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִים என்பது வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; தமிழில் விலங்கு வகையும் பாலினமும் தெளிவாகத் தெரிவிக்கப்படுகின்றன.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிக்கிறது; ‘வெள்ளாட்டுக் கடாக்கள்’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து ஆட்டுக்குட்டிகள்
  rationale: בְּנֵי שָׁנָה என்பதன் பொருள் ‘ஒரு வயதான’. כְּבָשִׂים இங்கு ஆண் ஆட்டுக்குட்டிகளைக் குறிக்கக்கூடும்; ஆனால் இயல்பான தமிழில் ‘ஆட்டுக்குட்டிகள்’ என்று வழங்குவது வயது வகையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: எபிரெய உரையின் நிகழ்கால சுட்டுமுறை தமிழிலும் இயல்பாகத் தக்கவைக்கப்பட்டது; கதைச்சூழலில் இது அர்ப்பணிக்கப்பட்ட காணிக்கையைச் சுட்டுகிறது.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: ஆகிரானின் மகன் பகியேல்
  rationale: பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழாக்கப்பட்டன; patronymic அமைப்பு இயல்பான தமிழ் உடைமைத் தொடராக வழங்கப்பட்டது.
theological_decisions:
- issue: הַשְּׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: இந்தச் சொல்லின் கருத்துவட்டத்தில் சமாதானம், நல்வாழ்வு, பகிர்ந்துண்ணும் உறவு ஆகியவை உள்ளன. ஒரே விளக்கப் பொருளைத் திணிக்காமல், அறியப்பட்ட பலிவகைப் பெயரான ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடை. மூலத்தின் பட்டியல் வடிவம் காக்கப்பட்டு, தமிழில் வாக்கியம் நிறைவடைய ‘ஆகியவற்றைக் கொண்டுவந்தான்’ சேர்க்கப்பட்டது. தனிப்பெயர்கள் WLC எபிரெய வடிவங்களான פַּגְעִיאֵל (Pagiel) மற்றும் עָכְרָן (Ocran) அடிப்படையில் ‘பகியேல்’, ‘ஆகிரான்’ என ஒலிபெயர்க்கப்பட்டன.
