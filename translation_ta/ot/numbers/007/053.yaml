  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: ta
  text: மேலும், சமாதானப் பலிக்காக[a] இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஒரு வயதுடைய ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள் ஆகியவற்றைக் கொடுத்தான். இது அம்மிஹூதின் மகன் எலீஷாமாவின் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘நல்லுறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், சமாதானம் அல்லது முழுநலத்தை வெளிப்படுத்தும் வகையில் பகிர்ந்து உண்ணப்பட்ட பலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்புச் சொல்லையும் நோக்கத்தைக் குறிக்கும் முன்னொட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. שְׁלָמִים என்பதற்கான மரபான பலியியல் சொல்லாக ‘சமாதானப் பலி’ வைக்கப்பட்டுள்ளது; அதன் நல்லுறவு/நலவாழ்வு சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; எபிரெயம் காளைகள் என்று குறிப்பாகச் சொல்லாததால் பாலினத்தைச் சேர்க்கவில்லை.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; வெள்ளாட்டுக் கடாக்களிலிருந்து வேறுபாடு தெளிவாக வைக்கப்பட்டுள்ளது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிப்பதால் இனமும் பாலினமும் வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: כְּבָשִׂים என்பதன் ஆண் செம்மறியாட்டுக் குட்டி என்ற பொருளையும், בְּנֵי שָׁנָה என்பதன் ‘ஒரு வயதான’ என்ற வயதுக் குறிப்பையும் பாதுகாக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இது … காணிக்கை
  rationale: வினையில்லா எபிரெய அடையாள வாக்கியத்தை இயல்பான தமிழில் தருகிறது; קָרְבָּן இங்கு தலைவன் கொண்டுவந்த முழுக் காணிக்கையைக் குறிக்கிறது.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: அம்மிஹூதின் மகன் எலிசாமா
  rationale: தந்தை–மகன் உறவை இயல்பான தமிழ் உடைமை அமைப்பில் கொடுத்து, பெயர்களை எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்த்துள்ளது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியின் பெயர்
  choice: சமாதானப் பலி
  alternative: நல்லுறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: மரபாக அறியப்பட்ட சொல்லை முதன்மை உரையில் வைத்தபோதும், மூலச்சொல்லின் நல்லுறவு, முழுநலம் ஆகிய பரந்த கருத்துகளை ஒரே விளக்கமாகச் சுருக்காமல் அடிக்குறிப்பில் மாற்றுப் பெயர்களாகத் தருகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, வாசிக்க எளிதான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பலியியல் வேறுபாடுகளைத் துல்லியமாகக் காட்ட ‘செம்மறியாட்டுக் கடாக்கள்’, ‘வெள்ளாட்டுக் கடாக்கள்’, ‘ஆண் செம்மறியாட்டுக் குட்டிகள்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
