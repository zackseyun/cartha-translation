translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நோக்கப்பொருள் இயல்பாகத் தரப்பட்டுள்ளது; ‘அவரவர் பணிக்கு ஏற்ப’ என்ற சொற்றொடர் அதன் பகிர்ந்தளிக்கும் தன்மையைப் பாதுகாக்கிறது.
