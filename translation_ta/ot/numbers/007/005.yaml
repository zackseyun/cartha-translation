source:
  edition: WLC
  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: ta
  text: அவற்றை அவர்களிடமிருந்து பெற்றுக்கொள். சந்திப்புக் கூடாரப் பணிக்காக அவை பயன்படட்டும்[a]. அவரவர் பணிக்கு ஏற்ப அவற்றை லேவியர்களுக்குக் கொடு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “சந்திப்புக் கூடாரத்தின் பணியைச் செய்வதற்காக அவை இருக்கட்டும்.” குறிப்பிடப்படுபவை வண்டிகளும் மாடுகளுமாதலால், அவை அந்தப் பணிக்குப் பயன்படுத்தப்பட வேண்டும் என்ற பொருள் முதன்மை உரையில் இயல்பான தமிழில் தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒவ்வொருவருக்கும் அவரவருடைய பணிக்கு ஏற்ப.” ஒவ்வொருவரின் அல்லது ஒவ்வொரு லேவியர் குழுவின் ஒதுக்கப்பட்ட பணியின் தேவைக்கு ஏற்ப அவை கொடுக்கப்பட வேண்டும் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: அவற்றை அவர்களிடமிருந்து பெற்றுக்கொள்
  rationale: לקח என்ற கட்டளை வினை இங்கு காணிக்கையாகக் கொண்டுவந்த பொருட்களை மோசே ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘பெற்றுக்கொள்’ என்பது வாங்குதல் என்ற பொருளைத் தவிர்த்து, மூலத்தையும் கட்டளையின் நேரடித் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיוּ לַעֲבֹד
  choice: பணியைச் செய்வதற்கு அவை பயன்படட்டும்
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘பணிசெய்வதற்காக அவை இருக்கட்டும்’ என்று அமைகிறது. குறிப்பிடப்படுபவை வண்டிகளும் மாடுகளுமாதலால், உயிரற்ற பொருட்களைப் பற்றிய நோக்கத்தைத் தமிழில் இயல்பாகக் காட்ட ‘பயன்படட்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲבֹדַת
  choice: பணி
  rationale: இங்கு עֲבֹדָה என்பது பரிசுத்த இடத்தோடு தொடர்புடைய ஒதுக்கப்பட்ட வேலையைக் குறிக்கிறது. ‘பணி’ என்பது சமயப் பின்னணியை அழிக்காமலும் தேவையற்ற தொழில்நுட்பச் சொல்லைச் சேர்க்காமலும் பொருளைத் தருகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: வனாந்தரப் பரிசுத்த இடத்தின் நிலையான பெயரான இந்தச் சொற்றொடர், கடவுள் தம் மக்களைச் சந்திக்கும் கூடாரத்தை நேரடியாகக் குறிக்கிறது.
- source_word: וְנָתַתָּה אֹתָם אֶל הַלְוִיִּם
  choice: அவற்றை லேவியர்களிடம் கொடு
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ பாதுகாக்கப்பட்டுள்ளது. இச்சூழலில் அது பயன்பாட்டிற்காக ஒப்படைப்பதையும் உள்ளடக்குகிறது.
- source_word: אִישׁ
  choice: அவரவர்
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவரும்/ஒவ்வொருவருக்கும்’ என்ற விநியோகப் பொருளைக் கொண்டுள்ளது. ‘அவரவர்’ என்பது இதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כְּפִי עֲבֹדָתוֹ
  choice: பணிக்கு ஏற்ப
  rationale: சொற்பட ‘அவனுடைய பணியின் வாயின்படி’ என்ற எபிரெய மரபுத்தொடர், ஒருவருக்கு ஒதுக்கப்பட்ட பணியின் தேவைக்கோ அளவுக்கோ ஏற்ப என்பதைக் குறிக்கிறது.
