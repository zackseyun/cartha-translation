base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], பரிசுத்த இடத்தின் சேக்கல் அளவின்படி[c] எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b]; அவை இரண்டும் தானியக் காணிக்கைக்கான எண்ணெய் கலந்த மெல்லிய மாவால் நிரம்பியிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘அகன்ற பாத்திரம்’ என்றும் மொழிபெயர்க்கலாம் (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: இது சடங்கில் பயன்படுத்தப்பட்ட ஒரு பாத்திரத்தைக் குறிக்கிறது; ‘கிண்ணம்’ என்பதற்குப் பதிலாக ‘குவளை’ என்றும் மொழிபெயர்க்கலாம் (מִזְרָק).
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘பரிசுத்த இடத்தின் சேக்கலின்படி’; இது பரிசுத்த இடத்தில் பின்பற்றப்பட்ட எடைத் தரத்தைக் குறிக்கிறது.
    reason: cultural_note
