  rationale: சடங்கில் பயன்படும் பாத்திரம்; அதன் குறிப்பிட்ட பயன்பாட்டை ஊகிக்காமல் பொதுவான பாத்திரப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இந்த அளவு கிண்ணத்தின் எடையைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் என்னும் எடை அளவின்படி
  rationale: ஆலயப் பரிசுத்த இடத்துடன் தொடர்புடைய அதிகாரப்பூர்வ சேக்கல் எடைத் தரத்தை விளக்கமாகவும் மூலத்துக்கு நெருக்கமாகவும் தருகிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிரப்பப்பட்டிருந்தன
  rationale: இரண்டு பாத்திரங்களையும் குறிக்கும் பன்மைச் சுட்டுதலை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைக்குப் பயன்படும் நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலக்கப்பட்ட
  rationale: செயப்பாட்டு வினையெச்சத்தின் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரியச் சட்டச் சூழலில் מִנְחָה குறிக்கும் குறிப்பிட்ட தானியக் காணிக்கையை வேறு காணிக்கைகளிலிருந்து வேறுபடுத்துகிறது.
