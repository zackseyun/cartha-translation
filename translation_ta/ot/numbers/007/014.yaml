  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ta
  text: பத்து சேக்கல் எடையுள்ள, தூபப்பொருளால் நிறைந்த ஒரு தங்கக் கிண்ணம்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “ஒரு தங்கக் கிண்ணம், பத்து, தூபப்பொருளால் நிறைந்தது” என்று உள்ளது; சுற்றியுள்ள காணிக்கைச் சூத்திரத்தின் அடிப்படையில் “சேக்கல்” என்பது பொருளில் கொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: வழிபாட்டுப் பொருட்களின் பட்டியலில், இது மனித உள்ளங்கையை அல்ல, தூபப்பொருளை வைக்கும் சிறிய பாத்திரத்தைக் குறிக்கிறது. நவீன தமிழில் ‘கரண்டி’ என மொழிபெயர்த்தால் உணவுக்கருவி என்ற தவறான எண்ணம் ஏற்படலாம்; ‘கிண்ணம்’ பொருத்தமான பாத்திரத்தை இயல்பாகக் குறிக்கிறது.
- source_word: אַחַת
  choice: ஒரு
  rationale: பெண்பால் பெயர்ச்சொல்லுடன் இயையும் எளிய எண்ணுப்பெயர்; தமிழில் இயல்பாக ‘ஒரு’ என வருகிறது.
- source_word: עֲשָׂרָה
  choice: பத்து சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையில் ‘பத்து’ என்று மட்டும் இருந்தாலும், சுற்றியுள்ள காணிக்கைச் சூத்திரத்தில் எடையலகான சேக்கல் விடுபட்ட நிலையில் புரிந்துகொள்ளப்படுகிறது. தமிழில் பொருள் முழுமையாகவும் இயல்பாகவும் இருக்க எடையலகு வெளிப்படுத்தப்படுகிறது.
- source_word: זָהָב
  choice: தங்க
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מְלֵאָה
  choice: நிறைந்த
  rationale: பாத்திரம் எதனால் நிரம்பியுள்ளது என்பதை இயல்பான தமிழில் தெரிவிக்கும் பெயரெச்ச வடிவம்.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: வழிபாட்டில் நறுமணப் புகை எழுப்பப் பயன்படுத்தப்படும் பொருளைக் குறிக்கிறது; ‘தூபப்பொருள்’ என்பது பொருளையே தெளிவாகச் சுட்டுகிறது.
