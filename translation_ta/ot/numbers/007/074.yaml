translation:
  language: ta
  text: தூபம் நிறைந்த பத்துச் சேக்கல் எடையுள்ள ஒரு பொற்கிண்ணம்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: ஆசரிப்புக்கூடாரக் காணிக்கைப் பட்டியலில் இது கை அல்லது உணவு உண்ணும் கரண்டியைக் குறிக்காமல், பொருளைத் தாங்கும் சிறிய பாத்திரத்தைக் குறிக்கிறது. நவீன தமிழில் ‘கிண்ணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אַחַת
  choice: ஒரு
  rationale: பெண்பால் பெயர்ச்சொல்லோடு பொருந்தும் எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்துச் சேக்கல் எடையுள்ள பொன்
  rationale: எபிரெயத்தில் எடை அலகு வெளிப்படையாக இல்லை; ஆனால் சுற்றியுள்ள வசனங்களில் மீண்டும் வரும் காணிக்கைச் சூத்திரத்திலிருந்து ‘சேக்கல்’ என்பது புரிந்துகொள்ளப்படுகிறது. தமிழில் பொருள் தெளிவாக இருக்க அதைச் சேர்த்து, பொன் பாத்திரத்தின் எடையாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מְלֵאָה
  choice: நிறைந்த
  rationale: பாத்திரத்தின் உள்ளடக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் விவரிக்கிறது.
- source_word: קְטֹרֶת
  choice: தூபவர்க்கம்
  rationale: பரிசுத்த இடத்து வழிபாட்டில் பயன்படுத்தப்பட்ட நறுமணத் தூபப் பொருளைக் குறிக்கும் மரியாதையான, வேதாகமச் சூழலுக்கேற்ற தமிழ் சொல்.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், பட்டியல் நடைக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கரண்டி’ என்றால் உணவு உண்ணும் கருவி என்ற தவறான எண்ணம் எழக்கூடும் என்பதால் ‘கிண்ணம்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தில் மறைந்துள்ள எடை அலகு அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
