translation:
  language: ta
  text: பத்துச் சேக்கல்[a] எடையுள்ள ஒரு பொற்கிண்ணம், தூபப்பொருள் நிறைந்தது;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘ஒரு பொற்கிண்ணம், பத்து, தூபப்பொருள் நிறைந்தது.’ உடனடியான சூழலில் மீண்டும் வரும் காணிக்கைச் சூத்திரத்தின் அடிப்படையில் ‘சேக்கல்’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு மனிதக் ‘உள்ளங்கை’ அல்ல, தூபப்பொருளைத் தாங்கும் வழிபாட்டுப் பாத்திரம் குறிக்கப்படுகிறது. நவீனத் தமிழில் ‘கிண்ணம்’ என்பது அதன் வடிவத்தையும் பயன்பாட்டையும் இயல்பாக உணர்த்துகிறது.
- source_word: אַחַת
  choice: ஒரு
  rationale: כַּף என்ற ஒருமைப் பெண்பால் பெயர்ச்சொல்லைத் திருத்தும் எளிய எண்ணுப்பெயர்; நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: עֲשָׂרָה
  choice: பத்துச் சேக்கல் எடையுள்ள
  rationale: எபிரெய உரையில் ‘பத்து’ என்று மட்டும் இருந்தாலும், உடனடியான சூழலில் மீண்டும் வரும் காணிக்கைப் பட்டியல் பாத்திரங்களின் எடையைச் சேக்கல்களில் குறிப்பிடுகிறது. தமிழில் அளவைத் தெளிவாக்க ‘சேக்கல்’ சேர்க்கப்பட்டு, அதைக் குறிக்க அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: זָהָב
  choice: பொன்
  rationale: பாத்திரம் செய்யப்பட்ட பொருளைக் குறிக்கிறது; ‘பொற்கிண்ணம்’ என இயல்பான தமிழ்க் கூட்டுச்சொல்லில் வழங்கப்பட்டது.
- source_word: מְלֵאָה
  choice: நிறைந்திருந்தது
  rationale: பெண்பால் பாத்திரத்தைப் பற்றிய பயனிலைப் பெயரடை; தமிழில் முழுமையான, இயல்பான வாக்கியமாக வழங்கப்பட்டது.
- source_word: קְטֹרֶת
  choice: தூபப்பொருள்
  rationale: பரிசுத்த இடத்து வழிபாட்டில் எரிக்கப்படும் நறுமணப் பொருளைக் குறிக்கிறது; ‘தூபப்பொருள்’ அதன் பொருட்தன்மையைத் தெளிவாகக் காட்டுகிறது.
