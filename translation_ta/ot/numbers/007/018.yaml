  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: ta
  text: இரண்டாம் நாளில் இசக்கார் கோத்திரத்தின் தலைவனான சூவாரின் மகன் நெதனெயேல் தன் காணிக்கையைச் செலுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘செலுத்தினான்’ என்று மட்டுமே உள்ளது; ஒவ்வொரு கோத்திரத் தலைவனும் காணிக்கை செலுத்தும் எண்ணாகமம் 7-ன் திரும்பத் திரும்ப வரும் சூழலிலிருந்து ‘தன் காணிக்கையை’ என்பது வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: בְּ முன்னொட்டுடன் வரும் ‘நாள்’ மற்றும் வரிசை எண்ணை இயல்பான நவீனத் தமிழில் காலக் குறிப்பாகத் தருகிறது; இவ்வசனத்தில் இல்லாத ‘அர்ப்பணிப்பு விழாவின்’ என்ற தகவலைச் சேர்க்கவில்லை.
- source_word: הִקְרִיב
  choice: தன் காணிக்கையைச் செலுத்தினான்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் வழிபாட்டு மற்றும் அர்ப்பணிப்புச் சூழலில் ஒன்றைக் கொண்டுவந்து காணிக்கையாகச் செலுத்துவதைக் குறிக்கிறது. எபிரெயத்தில் செயப்படுபொருள் இவ்வசனத்தில் விடுபட்டிருந்தாலும், எண்ணாகமம் 7-ன் திரும்பத் திரும்ப வரும் உடனடிச் சூழல் காணிக்கையையே குறிக்கிறது; ஆகவே தமிழில் இயல்பாகப் புரிய ‘தன் காணிக்கையை’ வழங்கப்பட்டுள்ளது.
- source_word: נְתַנְאֵל
  choice: நெதனெயேல்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן צוּעָר
  choice: சூவாரின் மகன்
  rationale: எபிரெய மரபுவழி உறவுக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராகத் தருகிறது.
- source_word: נְשִׂיא
  choice: தலைவன்
  rationale: கோத்திரச் சூழலில் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது; அரச குடும்பத்தை நினைவூட்டக்கூடிய ‘இளவரசன்’ தவிர்க்கப்படுகிறது.
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: எபிரெயக் கோத்திரப் பெயரின் நிலைபெற்ற தமிழ் வேதாகம எழுத்துப்பெயர்ப்பு.
