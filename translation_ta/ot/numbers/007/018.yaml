translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோத்திரத்தின்’ என்பது יִשָּׂשכָר என்ற பெயரின் இனக்குழுச் செயல்பாட்டைத் தமிழில் தெளிவாக்குகிறது; ‘தன் காணிக்கையை’ என்ற சூழல்சார் நிரப்புதல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
