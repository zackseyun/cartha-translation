  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: ta
  text: 'மேலும், சமாதானப் பலிக்காக: இரண்டு மாடுகள்,[a] ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஓராண்டு வயதுடைய ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள். இது ஏனானின் மகன் அகீராவின் காணிக்கை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலி’ என்பதை ‘ஐக்கியப் பலி’ அல்லது ‘நலவாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்பிடைச்சொல் மற்றும் முன்னிடைச்சொல்லுடன் வரும் பலிவகைப் பெயரை, பட்டியலின் இயல்பான தொடர்ச்சியாகவும் வழக்கமான பலியியல் சொல்லாகவும் வழங்குகிறது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினத்தைக் குறிப்பிடாத கூட்டுப்பெயர்; ஆகவே ‘மாடுகள்’ என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִים குறிப்பாக ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ பாலினத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתּוּדִים குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிக்கிறது; செம்மறியாட்டுக் கடாக்களிலிருந்து வேறுபாடு தெளிவாக்கப்பட்டுள்ளது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து ஆட்டுக்குட்டிகள்
  rationale: בְּנֵי שָׁנָה குறிக்கும் ஒரு வயது என்ற தகவலை இயல்பான தமிழில் பாதுகாக்கிறது; כְּבָשִׂים என்பதன் பாலின நுட்பத்தைத் தமிழ் ‘ஆட்டுக்குட்டி’ இயல்பாக வெளிப்படுத்தாததால் மிகை விளக்கம் தவிர்க்கப்பட்டது.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: மீண்டும் வரும் நிறைவு அடையாளச் சூத்திரத்தைச் சுருக்கமாகத் தருகிறது; கָרְבַּן என்பதற்கு இச்சூழலில் ‘காணிக்கை’ இயல்பான பலியியல் சொல்.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: ஏனானின் மகன் அகீரா
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தைவழி உறவு இயல்பான தமிழ் உடைமைத் தொடரால் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: הַשְּׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலி
  alternative: ஐக்கியப் பலி; நலவாழ்வுப் பலி
  rationale: ‘சமாதானப் பலி’ மரபாக அறியப்படும் சுருக்கமான பலியியல் பெயர்; இச்சொல் ஐக்கியம் அல்லது நலநிலை என்ற நுட்பங்களையும் கொண்டிருக்கக்கூடும் என்பதால் அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலிப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தில் இல்லாத பாலினத் தகவல் ‘மாடுகள்’ என்பதில் சேர்க்கப்படவில்லை; குறிப்பாக உள்ள ஆண் விலங்குகளின் வேறுபாடு கடாக்கள் என்ற சொல்லால் பாதுகாக்கப்பட்டது.
