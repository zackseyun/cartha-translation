  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b], பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி[c]; அவை இரண்டும் எண்ணெய் கலந்த நுண்ணிய மாவினால் தானியக் காணிக்கைக்காக நிரப்பப்பட்டிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டு’ என்பதற்குப் பதிலாக ‘தாம்பாளம்’ என்றும் மொழிபெயர்க்கலாம்; இது காணிக்கைப் பொருட்களில் பயன்படுத்தப்பட்ட ஆழமற்ற பாத்திரம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கிண்ணம்’ என்பதற்குப் பதிலாக ‘கலம்’ என்றும் மொழிபெயர்க்கலாம்; இது பலிச் சடங்கில் பயன்படுத்தப்பட்ட பாத்திரம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, பரிசுத்த ஸ்தலத்தில் கடைப்பிடிக்கப்பட்ட நிலையான எடை அளவின்படி.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: வழிபாட்டுச் சூழலில் கொண்டுவரப்படும் அர்ப்பணிப்பை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה என்பது ஆழமற்ற தட்டு அல்லது பாத்திரத்தைக் குறிக்கிறது; ‘தட்டு’ இங்கு இயல்பான தமிழ்.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: எடையை வெளிப்படையாகக் கூறும் எபிரெய கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק பலியிடும் பணியில் பயன்படுத்தப்பட்ட கிண்ணம் அல்லது கலம் போன்ற பாத்திரம்; ‘கிண்ணம்’ பொதுவாகப் புரியும் சொல்.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இது கிண்ணத்தின் எடையைக் குறிப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் எடைமுறையின்படி
  rationale: ஆலயப் பரிசுத்த இடத்தில் கடைப்பிடிக்கப்பட்ட நிலையான எடை அளவைக் குறிக்கும் மூலப்பொருளைப் பாதுகாக்கிறது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிரப்பப்பட்டிருந்தன
  rationale: இரு பாத்திரங்களும் நிறைந்திருந்தன என்ற எபிரெய வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைக்காகப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெய் கலந்து பிசைந்த
  rationale: மாவில் எண்ணெய் கலக்கப்பட்ட தயாரிப்பு முறையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் מִנְחָה குறிப்பாக தானியக் காணிக்கையைக் குறிக்கிறது.
