translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவிலான மூலத்தின் கண்ணியமான வழிபாட்டு நடையைப் பேணுகிறது. ‘சேக்கல்’ என்ற பழங்கால எடை அலகு ஒலிபெயர்ப்பாக வைக்கப்பட்டு, அதன் அளவீட்டு இயல்பு உரையிலும் அடிக்குறிப்பிலும் தெளிவாக்கப்பட்டுள்ளது.
