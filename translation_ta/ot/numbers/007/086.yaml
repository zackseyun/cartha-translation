base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: ta
  text: தூபம் நிறைந்த பன்னிரண்டு பொன் தட்டுகள்[a]; ஒவ்வொரு தட்டும் பரிசுத்த இடத்தின் சேக்கல் அளவின்படி பத்து சேக்கல் எடையுள்ளது. தட்டுகளின் பொன்னின் மொத்த எடை நூற்று இருபது சேக்கல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தட்டுகள்’ என்பதற்குப் பதிலாக ‘சிறு பாத்திரங்கள்’ அல்லது ‘கிண்ணங்கள்’ என்றும், மரபுவழியாக ‘கரண்டிகள்’ என்றும் மொழிபெயர்க்கலாம்; இவை தூபத்திற்கான பாத்திரங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: கிண்ணங்கள்
  rationale: இங்கு כַּף என்பது தூபவர்க்கம் நிரப்பப்பட்ட ஒரு சிறிய பாத்திரத்தைக் குறிக்கிறது. நவீன தமிழில் ‘கிண்ணங்கள்’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது; ‘கரண்டிகள்’ என்பது தவறான வடிவ எண்ணத்தைத் தரக்கூடும்.
- source_word: זָהָב
  choice: பொன்
  rationale: பாத்திரங்கள் செய்யப்பட்ட பொருளை நேரடியாகக் குறிக்கிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: பன்னிரண்டு
  rationale: பாத்திரங்களின் மொத்த எண்ணிக்கை.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: தூபவர்க்கத்தால் நிரப்பப்பட்ட
  rationale: קְטֹרֶת என்பது வழிபாட்டில் எரிக்கப்படும் நறுமணத் தூபக் கலவையைக் குறிக்கிறது; ‘தூபவர்க்கம்’ அந்தச் சிறப்புப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: ஒவ்வொரு கிண்ணமும் பத்து சேக்கல்
  rationale: எண்ணின் இரட்டிப்பு பகிர்ந்தளிக்கும் பொருளைக் கொண்டதால், ஒவ்வொரு பாத்திரத்தின் தனித்தனி எடையைத் தெளிவாகக் கூறுகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் அளவுப்படி
  rationale: வழிபாட்டிடத்தில் ஏற்றுக்கொள்ளப்பட்ட அதிகாரப்பூர்வ எடைத் தரத்தைக் குறிக்கும் தொழில்நுட்பச் சொற்றொடரை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: கிண்ணங்களின் பொன் மொத்தம்
  rationale: அனைத்துக் கிண்ணங்களிலும் பயன்படுத்தப்பட்ட பொன்னின் மொத்த எடையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: நூற்று இருபது சேக்கல்
  rationale: எபிரெய எண்ணைத் துல்லியமாக மொழிபெயர்க்கிறது; முந்தைய எடைச் சூழலிலிருந்து ‘சேக்கல்’ தெளிவுக்காக மீண்டும் வழங்கப்படுகிறது.
