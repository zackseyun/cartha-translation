  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: ta
  text: மேலும், சமாதானப் பலிகளுக்காக[a] இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஓராண்டு வயதுடைய ஆண் செம்மறியாட்டுக் குட்டிகள் ஐந்து. இதுவே கிதெயோனியின் மகன் அபிதானின் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலிகள்’ என்பதற்கு ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிகளுக்காக
  rationale: இணைப்புச் சொல்லும் முன்னொட்டும் முந்தைய பட்டியலுடன் இதை இணைக்கின்றன. זֶבַח மற்றும் שְׁלָמִים ஆகியவை சேர்ந்து ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கின்றன; ‘சமாதானப் பலிகள்’ என்பது சுருக்கமாகவும் அறியப்பட்ட வழிபாட்டுச் சொல்லாகவும் உள்ளது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது மாட்டினத்தைக் குறிக்கும் பொதுப்பெயர்; மூலத்தில் கூறப்படாத பாலினத்தையோ உழவுப் பயன்பாட்டையோ இது சேர்ப்பதில்லை.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைக் குறிப்பாகக் குறிக்கிறது; ‘கடாக்கள்’ பாலின வேறுபாட்டைத் துல்லியமாகத் தக்கவைக்கிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிக்கிறது; பலிப்பட்டியலில் முக்கியமான பாலின வேறுபாடு தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஓராண்டான ஆண் செம்மறியாட்டுக் குட்டிகள் ஐந்து
  rationale: כְּבָשִׂים என்பது இங்கு ஆண் செம்மறியாட்டுக் குட்டிகளைக் குறிக்கிறது; בְּנֵי שָׁנָה என்ற மரபுத்தொடர் ‘ஓராண்டான’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זֶה קָרְבַּן
  choice: இதுவே ... காணிக்கை
  rationale: எபிரெயச் சொற்றொடரில் வெளிப்படையான காலவினை இல்லை. ‘இதுவே’ என்ற வடிவம் அத்தியாயத்தின் முடிவுச் சூத்திரத்தை இயல்பாக வழங்கி, தேவையின்றி இறந்தகாலத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: கிதெயோனியின் மகன் அபிதான்
  rationale: தனிப்பெயர்கள் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; בֶּן என்ற தந்தைவழி உறவு ‘மகன்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
