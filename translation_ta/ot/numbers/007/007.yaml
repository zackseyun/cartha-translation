id: NUM.7.7
reference: Numbers 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֣ת שְׁתֵּ֣י הָ/עֲגָלֹ֗ת וְ/אֵת֙ אַרְבַּ֣עַת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י גֵרְשׁ֑וֹן כְּ/פִ֖י עֲבֹדָתָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: ta
  text: அவர்களுடைய பணிக்குத் தக்கவாறு, இரண்டு வண்டிகளையும்[a] நான்கு மாடுகளையும்[b] கெர்சோனின் மக்களுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சரக்கு வண்டிகளையும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எருதுகளையும்.’ எபிரெயச் சொல் மாட்டினத்தை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டுப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: வண்டிகள்
  rationale: עֲגָלָה என்பது பொருட்களை ஏற்றிச் செல்லும் வண்டியைக் குறிக்கிறது. கூடாரப் பொருட்களின் போக்குவரத்துச் சூழலுக்கு இயல்பாகப் பொருந்தும் பொதுவான சொல்லாக ‘வண்டிகள்’ தேர்ந்தெடுக்கப்பட்டது; ‘சரக்கு வண்டிகள்’ என்பது சாத்தியமான விளக்கமான மாற்று.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בָּקָר என்பது மாட்டினத்தைக் கூட்டாகக் குறிக்கும் சொல். இங்கு அவை வண்டிகளை இழுக்கும் விலங்குகள் என்றாலும், அவற்றின் பாலினம் அல்லது வகையைத் தேவையின்றி குறிப்பாக்காமல் எபிரெயச் சொல்லின் பொதுத்தன்மையை ‘மாடுகள்’ காக்கிறது; சூழலின் அடிப்படையில் ‘எருதுகள்’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: கெர்சோனின் மக்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான வடிவம் ‘கெர்சோனின் மக்களுக்கு’ என்பதாகும். ஒரு குலப்பெயராக மட்டும் மாற்றாமல், மூலத்தின் உறவுமுறை வடிவம் இயல்பான தமிழில் பாதுகாக்கப்பட்டது.
- source_word: כְּפִי עֲבֹדָתָם
  choice: அவர்களுடைய பணிக்குத் தக்கவாறு
  rationale: כְּפִי என்பது ‘அதற்கேற்ப’ அல்லது ‘தக்கவாறு’ என்றும், עֲבֹדָה இங்கு அவர்களுக்கு ஒதுக்கப்பட்ட கூடாரப் பணியையும் குறிக்கிறது. ‘பணிக்குத் தக்கவாறு’ என்பது பணியின் தேவைக்கேற்ப வழங்கப்பட்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: נָתַן
  choice: கொடுத்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடுத்தார்’ என்பதே. சூழலில் பங்கிட்டு அளித்தல் அடங்கியிருந்தாலும், ‘ஒதுக்கினார்’ என்று விளக்கத்தைச் சேர்க்காமல் மூலத்தின் எளிய வினைப்பொருள் காக்கப்பட்டது.
