translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் பொருள் வரிசை பெருமளவு காக்கப்பட்டாலும், ‘அவர்களுடைய பணிக்குத் தக்கவாறு’ தொடக்கத்தில் வைக்கப்பட்டு தமிழில் இயல்பான ஓட்டம் அளிக்கப்பட்டுள்ளது. பெயர் ‘கெர்சோன்’ எனத் தமிழாக்கப்பட்டது.
