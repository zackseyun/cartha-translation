base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: ta
  text: மேலும், சமாதானப் பலிக்காக[a] இரண்டு மாடுகள், ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக்கடாக்கள், ஓராண்டு வயதுடைய ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள். இது ஹேலோனின் மகன் எலியாபின் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலி’ என்பதற்கு ‘உறவுணர்வுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்பிடைச்சொல் முந்தைய பட்டியலைத் தொடர்கிறது; זֶבַח הַשְּׁלָמִים என்பது பலிவகையைக் குறிக்கும் நிலையான வழிபாட்டுச் சொற்றொடர். ‘சமாதானப் பலி’ சுருக்கமாகவும் அறிமுகமானதாகவும் உள்ளது; சொல்லின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினத்தைக் குறிப்பிடாத மாட்டினப் பொதுப்பெயர்; எனவே ஆண் மாடுகள் என்று குறிப்பாக்காமல் ‘மாடுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து ஆட்டுக்கடாக்கள்
  rationale: אֵילִם பலிக்குரிய வளர்ந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது; ‘ஆட்டுக்கடாக்கள்’ பாலின வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக்கடாக்கள்
  rationale: עַתֻּדִים குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் பாலினம் வெளிப்படுத்தப்பட்டது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஓராண்டான ஐந்து ஆட்டுக்குட்டிகள்
  rationale: בְּנֵי שָׁנָה என்பது வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர். כְּבָשִׂים இங்கு இளம் செம்மறியாடுகளைக் குறிக்கிறது; எபிரெய இலக்கணப் பாலினத்தை உயிரியல் பாலினமாக மிகைப்படுத்தாமல் இயல்பான தமிழ் பயன்படுத்தப்பட்டது.
- source_word: זֶה קָרְבַּן
  choice: இது ... கொண்டுவந்த காணிக்கை
  rationale: קָרְבָּן என்பது கடவுளிடம் கொண்டுவரப்படும் காணிக்கை. எபிரெயத்தின் சுருக்கமான பெயர்ச்சொல் வாக்கியம் தமிழில் இயல்பாகப் புரிய ‘கொண்டுவந்த’ சேர்க்கப்பட்டது; பட்டியல் நிகழ்வின் சூழலும் காக்கப்படுகிறது.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: ஏலியாப் ... ஏலோனின் மகன்
  rationale: பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன; בֶּן உறவு இயல்பான தமிழில் ‘மகன்’ என்று தரப்பட்டது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள் பரப்பு
  choice: முதன்மை உரையில் ‘சமாதானப் பலி’
  alternative: ‘உறவுணர்வுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’
  rationale: இந்த எபிரெயச் சொல் சமாதானம், நல்வாழ்வு, பங்கேற்பு/உறவு ஆகிய பொருள் நிழல்களை உடையது. ஓர் இறையியல் விளக்கத்திற்குள் அதைச் சுருக்காமல், மரபாக அறியப்படும் பெயர் முதன்மை உரையிலும் மாற்றுகள் அடிக்குறிப்பிலும் வைக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். பலிப்பட்டியலின் சுருக்கமான ஓசை காக்கப்பட்டது. ‘ஆட்டுக்கடா’ மற்றும் ‘வெள்ளாட்டுக்கடா’ மூலம் விலங்குவகையும் பாலினமும் வேறுபடுத்தப்பட்டன; மூலத்தில் உயிரியல் பாலினம் தெளிவாகக் கூறப்படாத இடங்களில் அது சேர்க்கப்படவில்லை.
