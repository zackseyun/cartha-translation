source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: ta
  text: ஆனால் கோகாத்தின் வழிவந்தவர்களுக்கு அவர் ஒன்றும் கொடுக்கவில்லை. ஏனெனில் பரிசுத்தப் பொருட்களுக்குரிய பணி அவர்கள்மேல் இருந்தது[a]; அவற்றை அவர்கள் தோளில் சுமக்க வேண்டியிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்துக்குரிய பணி அவர்கள்மேல் இருந்தது.” இங்கு எபிரெயச் சொல் பரிசுத்த இடத்தையோ, கோகாத்தியரிடம் ஒப்படைக்கப்பட்ட பரிசுத்தப் பொருட்களையோ குறிக்கலாம்; உடனடிச் சூழல் பரிசுத்தப் பொருட்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: ஆனால் கோகாத்தின் வழிவந்தவர்களுக்கு
  rationale: לִבְנֵי என்பது கோகாத்தின் குலத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘வழிவந்தவர்கள்’ என்பது உயிரியல் மகன்கள் என்று தவறாகக் குறுக்காமல் குலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; தொடக்க וְ முந்தைய குலங்களுக்கு அளிக்கப்பட்டவற்றுடன் உள்ள முரண்பாட்டால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא נָתָן
  choice: அவர் ஒன்றும் கொடுக்கவில்லை
  rationale: முந்தைய சூழலில் கொடுக்கப்பட்ட வண்டிகளையும் மாடுகளையும் மறைமுகமாகச் சுட்டுகிறது. மூலத்தில் விடப்பட்டுள்ள செயப்படுபொருளை தேவையின்றி விரிவாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்களுக்கு எதுவும் கொடுக்கப்படாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: பரிசுத்தப் பொருட்களுக்குரிய பணி
  rationale: עֲבֹדָה என்பது பணி அல்லது சேவை; הַקֹּדֶשׁ என்பது இச்சூழலில் கோகாத்தியரிடம் ஒப்படைக்கப்பட்ட பரிசுத்தப் பொருட்களை மிக இயல்பாகக் குறிக்கிறது. எனினும் ‘பரிசுத்த இடம்’ என்ற பொருள் சாத்தியமுள்ளதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல் இருந்தது
  rationale: கடமை அவர்கள்மேல் இருந்தது என்ற எபிரெய மொழிநடையைப் பாதுகாக்கிறது; தமிழிலும் இது பொறுப்பு அல்லது கடமையை இயல்பாக உணர்த்துகிறது.
- source_word: בַּכָּתֵף
  choice: தோளில்
  rationale: மூலத்தின் ஒருமை வடிவைத் தக்கவைத்து, ஒவ்வொருவரும் தம் தோளில் சுமப்பதைக் கூட்டுப் பொருளில் இயல்பாகக் குறிக்கிறது.
- source_word: יִשָּׂאוּ
  choice: அவற்றை அவர்கள் தோளில் சுமக்க வேண்டியிருந்தது
  rationale: இங்குள்ள imperfect வடிவம் நியமிக்கப்பட்ட கடமையை வெளிப்படுத்துகிறது. தமிழில் பொருள் தெளிவதற்காக, சூழலில் உள்ள பரிசுத்தப் பொருட்களைக் குறிக்கும் ‘அவற்றை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: הַקֹּדֶשׁ என்பது பரிசுத்தப் பொருட்களையா அல்லது பரிசுத்த இடத்தையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘பரிசுத்தப் பொருட்கள்’
  alternative: ‘பரிசுத்த இடம்’ அல்லது ‘பரிசுத்த இடத்துக்குரிய பணி’
  rationale: எண்ணாகமம் 4-இல் கோகாத்தியருக்கு ஒப்படைக்கப்பட்ட பணி பரிசுத்த அலங்காரப் பொருட்களைத் தோளில் சுமப்பதாக இருப்பதால் பொருட்கள் என்ற பொருள் உடனடிச் சூழலுக்கு நன்கு பொருந்துகிறது. இருப்பினும் எபிரெயச் சொல்லின் பரந்த பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘புத்திரர்’ போன்ற பழைய வழக்கிற்கு பதிலாக ‘வழிவந்தவர்கள்’ பயன்படுத்தப்பட்டுள்ளது; கடமை மற்றும் சுமத்தல் பற்றிய எபிரெய உருவகம் இயன்றவரை தக்கவைக்கப்பட்டுள்ளது.
