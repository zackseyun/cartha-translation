base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ta
  text: 'அவனுடைய காணிக்கை: நூற்று முப்பது சேக்கல் எடையுள்ள ஒரு வெள்ளித் தட்டு[a], திருத்தலச் சேக்கல் அளவின்படி எழுபது சேக்கல் எடையுள்ள ஒரு வெள்ளிக் கிண்ணம்[b]; அவை இரண்டும் தானியக் காணிக்கைக்காக எண்ணெயுடன் கலக்கப்பட்ட மெல்லிய மாவால் நிரம்பியிருந்தன.


    [a] “வெள்ளித் தட்டு” என்பதற்குப் பதிலாக “வெள்ளிக் கிண்ணம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு பாத்திரத்தைக் குறிக்கிறது; அதன் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.


    [b] “வெள்ளிக் கிண்ணம்” என்பதற்குப் பதிலாக, அதன் சடங்குசார் பயன்பாட்டைச் சுட்டிக்காட்டும் வகையில் “வெள்ளித் தெளிப்புக் கிண்ணம்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெள்ளித் தட்டு” என்பதற்குப் பதிலாக “வெள்ளிக் கிண்ணம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு பாத்திரத்தைக் குறிக்கிறது; அதன் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “வெள்ளிக் கிண்ணம்” என்பதற்குப் பதிலாக, அதன் சடங்குசார் பயன்பாட்டைச் சுட்டிக்காட்டும் வகையில் “வெள்ளித் தெளிப்புக் கிண்ணம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: அவனுடைய காணிக்கை
  rationale: கடவுளிடம் கொண்டுவரப்படும் அர்ப்பணிப்பை இச்சொல் குறிக்கிறது; பலிச்சூழலில் ‘காணிக்கை’ தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ஒரு வெள்ளித் தட்டு
  rationale: קַעֲרָה காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட, சற்றுத் தட்டையான பாத்திரத்தைக் குறிக்கலாம். அதன் வடிவம் முற்றிலும் உறுதியல்ல என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: நூற்று முப்பது சேக்கல் எடையுள்ள
  rationale: மூலத்தில் பாத்திரத்தின் எடை வெளிப்படையாகக் குறிப்பிடப்படுகிறது; தமிழ் வாக்கியத்தில் இயல்பாக அமைய பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ஒரு வெள்ளிக் கிண்ணம்
  rationale: מִזְרָק சடங்குகளில் பயன்படுத்தப்பட்ட ஒரு பாத்திரம். அதன் குறிப்பிட்ட செயல்பாட்டை முதன்மை உரையில் மிகையாக நிர்ணயிக்காமல் ‘கிண்ணம்’ என வழங்கி, சடங்குசார் மாற்றை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: எழுபது சேக்கல் எடையுள்ள
  rationale: இது இரண்டாவது பாத்திரத்தின் எடையைக் குறிக்கிறது; எபிரெய வாக்கியத்தின் விடுபட்ட வினைப்பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: திருத்தலச் சேக்கல் அளவின்படி
  rationale: திருத்தலத்தில் ஏற்றுக்கொள்ளப்பட்ட அதிகாரப்பூர்வ எடைத் தரத்தைச் சுட்டும் தொழில்நுட்பச் சொற்றொடராக இது மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: அவை இரண்டும் ... நிரம்பியிருந்தன
  rationale: இரு பாத்திரங்களையும் வெளிப்படையாகச் சுட்டும் மூலமொழியின் பன்மை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும்; நவீன வாசகருக்குத் தெளிவான சொற்றொடர்.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலக்கப்பட்ட
  rationale: மாவு எண்ணெயோடு கலக்கப்பட்டிருந்தது என்ற செயல்நிலையைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கைக்காக
  rationale: ஆசாரியச் சட்டச் சூழலில் מִנְחָה குறிப்பாகத் தானியத்தால் செய்யப்படும் காணிக்கை வகையைக் குறிக்கிறது.
