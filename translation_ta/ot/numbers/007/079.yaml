translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் பட்டியல் அமைப்பும் இரு பாத்திரங்களின் எடைகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; பாத்திரங்களின் வடிவம் அல்லது சடங்குசார் செயல்பாடு உறுதியற்ற இடங்களில் முதன்மை உரை மிகையாகக் குறிப்பாக்கப்படாமல் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
