  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: ta
  text: சமாதானப் பலிக்காக[a] இரண்டு மாடுகள்[b], ஐந்து செம்மறியாட்டுக் கடாக்கள், ஐந்து வெள்ளாட்டுக் கடாக்கள், ஒரு வயதுடைய ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள். இது சூரிஷத்தாயின் மகன் செலுமியேலின் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சமாதானப் பலி’ என்பதை ‘உறவுப் பலி’ அல்லது ‘நல்வாழ்வுப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் மாட்டினத்தைக் குறிக்கும் பொதுப்பெயர்; சில மொழிபெயர்ப்புகள் இதை ‘எருதுகள்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்புச் சொல்லையும் நோக்கத்தைக் குறிக்கும் முன்னொட்டையும் இயல்பான தமிழில் வெளிப்படுத்தி, שְׁלָמִים என்பதன் பலியியல் சிறப்புப் பொருளைத் தக்கவைக்கிறது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது ஆண் எருதுகளை மட்டும் குறிக்காமல் மாட்டினத்தைக் குறிக்கும் பரந்த கூட்டுப்பெயர்; எனவே பாலினத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது பலியியல் சூழலில் வயதுவந்த ஆண் செம்மறியாடுகளைக் குறிக்கிறது.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתֻּדִים குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிப்பதால் அந்தப் பாலின வேறுபாடு தக்கவைக்கப்பட்டது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: כְּבָשִׂים என்பதிலுள்ள ஆண்பால் குறிப்பையும் בְּנֵי שָׁנָה என்பதிலுள்ள ஒரு வயது என்ற வழக்குச் சொல்லையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: எபிரெய உரையின் நிகழ்காலச் சுட்டான זֶה என்பதைக் ‘இது’ என்று தக்கவைத்து, קָרְבַּן என்பதற்கு பட்டியல் சூழலில் இயல்பான ‘காணிக்கை’ பயன்படுத்தப்பட்டது.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: சூரிஷதாயின் மகன் செலுமியேல்
  rationale: எபிரெயப் பெயர்களின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்து, בֶּן உறவை இயல்பான தமிழ் உடைமைத் தொடரால் வழங்குகிறது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலியியல் சொல்லின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி; நல்வாழ்வுப் பலி
  rationale: ‘சமாதானப் பலி’ பாரம்பரியமாக அறியப்படும் சொல்லாகவும் பலியின் தனித்த வகையைச் சுருக்கமாகக் காட்டுவதாகவும் உள்ளது; மற்ற பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பலியியல் வேறுபாடுகளைத் தெளிவாக வைத்தபடியே பட்டியலின் இயல்பான ஓட்டம் பேணப்பட்டுள்ளது. ‘கடாக்கள்’ என்பது ஆண் விலங்கைக் குறிக்கும் துல்லியமான, இன்னும் புரிந்துகொள்ளத்தக்க சொல்; செம்மறியாடு மற்றும் வெள்ளாடு தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
