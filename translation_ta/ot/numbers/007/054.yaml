- from: எட்டாம் நாளில், மனாசேயின் மக்களுக்கான தலைவன் பெதாசூரின் மகன் கமாலியேல்.
  to: எட்டாம் நாளில், மனாசேயின் மக்களின்[a] தலைவர் பெதாசூரின் மகன் கமாலியேல்.
  rationale: ‘மக்களுக்கான’ என்பதற்குப் பதிலாக ‘மக்களின்’ பயன்படுத்தப்பட்டுள்ளது; இது மூலத்தின் கோத்திரத் தலைமை உறவை நெருக்கமாகக் காட்டுகிறது. பெயர்களும் தலைமைப் பதவியும் மாற்றப்படவில்லை. மூலத்தில் உள்ள ‘மனாசேயின் மகன்கள்’ என்ற கோத்திர வழக்கைத் தெளிவுபடுத்த ஒரு குறிப்பு சேர்க்கப்பட்டுள்ளது.
