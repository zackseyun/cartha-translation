  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ta
  text: எட்டாம் நாளில், மனாசேயின் மக்களின்[a] தலைவர் பெதாசூரின் மகன் கமாலியேல்.
  philosophy: optimal-equivalence
  footnotes:
