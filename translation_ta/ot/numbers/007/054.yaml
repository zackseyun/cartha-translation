lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: בְּ முன்னொட்டுடன் வரும் நாள் மற்றும் வரிசை எண் காலத்தைக் குறிக்கின்றன; தமிழில் இயல்பாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இச்சூழலில் கோத்திரத்தைப் பிரதிநிதித்துவப்படுத்தும் அங்கீகரிக்கப்பட்ட தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிக்கும் பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: மனாசேயின் மக்களுக்கான
  rationale: לְ என்பதன் பிரதிநிதித்துவ உறவையும் בְּנֵי என்பதன் மக்கள்/வம்சத்தார் என்ற கோத்திரப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: גַּמְלִיאֵל
  choice: கமாலியேல்
  rationale: தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: בֶּן
  choice: மகன்
  rationale: தந்தைவழிப் பெயரடையாளத்தை நேரடியாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: פְּדָה צוּר
  choice: பெதாசூர்
  rationale: மசோரா உரையில் கூறுகளாகத் தோன்றும் கூட்டுத் தனிப்பெயரை ஒரே பெயராக எழுத்துப்பெயர்க்கிறது.
