translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. மூலத்தின் மறைமுக எடையலகு அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
