  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: ta
  text: பத்து சேக்கல் எடையுள்ள, தூபப்பொருள் நிறைந்த ஒரு தங்கக் கிண்ணம்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “ஒரு தங்கக் கிண்ணம், பத்து தங்கம், தூபப்பொருள் நிறைந்தது.” இவ்வதிகாரத்தில் மீண்டும் மீண்டும் வரும் எடைச் சூத்திரத்தின் அடிப்படையில், தெளிவுக்காக “சேக்கல்” சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: கிண்ணம்
  rationale: இங்கு தூபப்பொருளை வைக்கும் சிறிய பாத்திரத்தை இச்சொல் குறிக்கிறது. ‘கரண்டி’ என மிகக் குறிப்பாகச் சொல்லாமல், இயல்பான தமிழில் பாத்திரத்தின் தன்மையை ‘கிண்ணம்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: אַחַת
  choice: ஒரு
  rationale: כַּף என்ற பெண்பால் பெயர்ச்சொல்லுடன் பொருந்தும் எளிய எண்ணுப்பெயர்.
- source_word: עֲשָׂרָה זָהָב
  choice: பத்து சேக்கல் எடையுள்ள தங்க
  rationale: எபிரெய உரையில் எடையலகு வெளிப்படையாக இல்லை. இவ்வதிகாரத்தில் திரும்பத் திரும்ப வரும் எடை வாய்பாட்டின் அடிப்படையில் ‘சேக்கல்’ வழங்கப்பட்டு, இது பாத்திரத்தின் எடை என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: מְלֵאָה
  choice: நிறைந்திருந்தது
  rationale: பாத்திரத்தின் உள்ளடக்கத்தை விவரிக்கும் பயனிலைப் பெயரடை; தமிழ் வாக்கியத்தில் இயல்பாக இறந்தகாலப் பயனிலையாக வழங்கப்பட்டுள்ளது.
- source_word: קְטֹרֶת
  choice: நறுமணத் தூபப்பொருள்
  rationale: வழிபாட்டில் எரிக்கப்படும் நறுமணப் பொருளைக் குறிக்கிறது. ‘தூபம்’ மட்டும் புகையையோ சடங்கையையோ குறிக்கக்கூடும் என்பதால், பொருளைத் தெளிவுபடுத்த ‘நறுமணத் தூபப்பொருள்’ பயன்படுத்தப்பட்டுள்ளது.
