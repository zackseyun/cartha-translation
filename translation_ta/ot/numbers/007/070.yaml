  yaml_path: translation/ot/numbers/007/070.yaml
  text: one male goat for a sin offering[a].
translation:
  language: ta
  text: பாவநிவாரணப் பலிக்காக ஒரு ஆட்டுக்கடா[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாவநிவாரணப் பலியாக.’ எபிரெயச் சொல்லான חַטָּאת என்பதற்கு ‘பாவம்’ என்றும், இதுபோன்ற பலியிடும் சூழல்களில் ‘பாவநிவாரணப் பலி’ என்றும் பொருள் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இந்த எபிரெயச் சொற்றொடர் ஆண் வெள்ளாட்டைக் குறிக்கிறது. பலிக்குரிய விலங்கின் பாலினத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்க ‘ஆட்டுக்கடா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: பலிக்குரிய விலங்கின் எண்ணிக்கையைக் குறிக்கும் எளிய எண்ணுப்பெயர்; எண்ணாகமம் 7-இன் திரும்பத் திரும்ப வரும் பட்டியல் நடையை இது காக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலிகளைப் பட்டியலிடும் இச்சூழலில் חַטָּאת என்பது பாவத்தையே அல்ல, பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. முன்னொட்டு לְ- இங்கே நோக்கத்தைக் குறிப்பதால் ‘-க்காக’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: பலியிடும் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவத்திற்கான பலி / பாவத்திற்காக
  rationale: இவ்வசனம் பலிப்பொருட்களின் பட்டியலில் இருப்பதால், இச்சொல்லின் சடங்குசார் பொருளான பாவநிவாரணப் பலி என்பதே சூழலுக்குப் பொருத்தமானது. அடிப்படைச் சொல்லின் வேறுபட்ட சாத்தியத்தை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பட்டியல் நடையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் மொழிபெயர்ப்பு. ‘பாவநிவாரணப் பலி’ என்பது சாதாரண வாசகருக்குப் பலியின் நோக்கத்தைத் தெளிவாக்குகிறது.
