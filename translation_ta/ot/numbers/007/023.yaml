  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: ta
  text: சமாதானப் பலி[a]க்காக இரண்டு மாடுகளையும், ஐந்து செம்மறியாட்டுக் கடாக்களையும், ஐந்து வெள்ளாட்டுக் கடாக்களையும், ஒரு வயதுடைய ஐந்து ஆண் செம்மறியாட்டுக் குட்டிகளையும் செலுத்தினான். இது சூவாரின் மகன் நெதனெயேலின் காணிக்கை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, «கூட்டுறவுப் பலி»; «நல்வாழ்வுப் பலி». எபிரெயச் சொல்லான שְׁלָמִים என்பதற்கான மாற்று மொழிபெயர்ப்புகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலிக்காக
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் காணிக்கைப் பட்டியலின் அடுத்த பகுதியை அறிமுகப்படுத்துகின்றன. שְׁלָמִים என்பது வழிபாட்டுச் சூழலில் பலிவகையைக் குறிக்கும் மரபுச் சொல்; ‘சமாதானப் பலி’ என்பது தமிழில் இயல்பாகவும் தொடர்ச்சியாகவும் உள்ளது.
- source_word: בָּקָר שְׁנַיִם
  choice: இரண்டு மாடுகள்
  rationale: בָּקָר என்பது பாலினத்தைக் குறிப்பிடாத மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர். ஆகவே ‘எருதுகள்’ என்று பாலினத்தை மிகைப்படுத்தாமல் ‘மாடுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ஐந்து செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைத் தெளிவாகக் குறிக்கிறது; ‘கடாக்கள்’ பாலின வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: ஐந்து வெள்ளாட்டுக் கடாக்கள்
  rationale: עַתּוּדִים என்பது ஆண் வெள்ளாடுகளைக் குறிக்கிறது; நவீன தமிழில் தெளிவிற்காக ‘வெள்ளாட்டுக் கடாக்கள்’ பயன்படுத்தப்பட்டது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ஒரு வயதான ஐந்து ஆட்டுக்குட்டிகள்
  rationale: כְּבָשִׂים இங்கு இளம் செம்மறியாடுகளையும், בְּנֵי שָׁנָה ஒரு வயதுடையவை என்பதையும் குறிக்கிறது. எண்ணிக்கையையும் வயதையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: זֶה קָרְבַּן
  choice: இது ... காணிக்கை
  rationale: இந்தச் சுட்டுப்பெயர்-பெயர்ச்சொல் அமைப்பு முன் பட்டியலிட்டவற்றை முடிவாக அடையாளப்படுத்துகிறது. קָרְבָּן என்பதற்கு இச்சூழலில் ‘காணிக்கை’ பொருத்தமானது.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: சூவாரின் மகன் நெதனெயேல்
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, patronymic அமைப்பு இயல்பான தமிழ் உடைமைத் தொடராக வழங்கப்பட்டது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: இந்தச் சொல் சமாதானம், நல்வாழ்வு, கூட்டுறவு ஆகிய பொருள் நிழல்களைக் கொண்டிருக்கலாம். வசன உரையில் தமிழ்வேதாகம வழக்கில் புரிந்துகொள்ளத்தக்க ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டது; குறிப்பிட்ட ஒரு கோட்பாட்டு விளக்கம் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், வழிபாட்டுச் சொற்களின் கண்ணியத்தையும் பட்டியல் அமைப்பின் தெளிவையும் காக்கும் நடை. விலங்குகளின் வகை மற்றும் பாலின வேறுபாடு எபிரெய மூலத்திற்கேற்ப இயன்றவரை வெளிப்படுத்தப்பட்டுள்ளது.
