source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: ta
  text: 'சமாதானப் பலி[a]க்கான மாட்டினம் அனைத்தும்: இருபத்து நான்கு காளைகள், அறுபது செம்மறியாட்டுக் கடாக்கள், அறுபது வெள்ளாட்டுக் கடாக்கள், ஓராண்டான செம்மறியாட்டுக் குட்டிகள் அறுபது. பலிபீடம் அபிஷேகம் செய்யப்பட்ட பின்பு அதற்கான அர்ப்பணிப்பு இதுவே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானப் பலி” என்பதை “ஐக்கியப் பலி” அல்லது “நல்வாழ்வுப் பலி” என்றும் மொழிபெயர்க்கலாம்.
    reason: שְׁלָמִים என்பதற்கான சொற்பொருள் மாற்றுகள்; இச்சொல் சமாதானம், உறவொற்றுமை, முழுநலம் ஆகிய நுண்பொருள்களையும் கொண்டுள்ளது.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: செலுத்தப்பட்ட மாடுகள் அனைத்தும்
  rationale: בקר என்பது மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; வசனம் மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறுவதால் இயல்பான தமிழுக்காக ‘செலுத்தப்பட்ட’ என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டது.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: சமாதானப் பலி
  rationale: זבח என்பது பலியையும் שלמים என்பது சமாதானம், நல்வாழ்வு, உறவொற்றுமை ஆகிய நுண்பொருள்களைக் கொண்ட பலிவகையையும் குறிக்கிறது; பழக்கமான வேதாகமச் சொல்லாட்சியாக ‘சமாதானப் பலி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פָּרִים
  choice: காளைகள்
  rationale: பலிச் சூழலில் ஆண் மாடுகளைக் குறிக்கும் இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: אֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: ஆண் செம்மறியாடுகள் என்பதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: עַתֻּדִים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: ஆண் வெள்ளாடுகளைக் குறிக்கும் சொல்லை நவீனத் தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ஓராண்டான ஆட்டுக்குட்டிகள்
  rationale: குட்டிகளின் வயது ஓராண்டு என்பதை மூலத்தின் படி பாதுகாக்கிறது; இங்கு செம்மறியாட்டுக் குட்டிகள் என்பது சூழலால் தெளிவாகிறது.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அர்ப்பண விழா
  rationale: חנכה என்பது பலிபீடத்தை முதன்முறையாகப் பயன்பாட்டுக்கு அர்ப்பணித்த நிகழ்வைக் குறிக்கிறது; மூலத்தில் தனியாக ‘காணிக்கை’ என்ற சொல் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: பலிபீடம் அபிஷேகம் செய்யப்பட்ட பின்பு
  rationale: எவர் அபிஷேகம் செய்தார் என்று மூலத்தில் வெளிப்படையாக இல்லாததால் தமிழிலும் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலி
  alternative: உறவுறவுப் பலி / நல்வாழ்வுப் பலி
  rationale: இந்த எபிரெயச் சொல் சமாதானம் மட்டுமன்றி முழுநலம் மற்றும் கடவுளோடும் சமூகத்தோடும் பகிரப்படும் உறவையும் உணர்த்தலாம். பிரதான உரையில் மரபாகப் புரிந்துகொள்ளப்படும் சொல்லை வைத்து, மற்ற நுண்பொருள்களை அடிக்குறிப்பில் பாதுகாத்தோம்.
- issue: חֲנֻכָּה என்பது நிகழ்வா அல்லது காணிக்கைகளா
  choice: அர்ப்பண விழா
  alternative: அர்ப்பணக் காணிக்கை
  rationale: இவ்வசனம் காணிக்கைகளின் மொத்தத்தைச் சுருக்கினாலும், எபிரெயச் சொல் நேரடியாக அர்ப்பணிப்பு அல்லது தொடக்க விழாவைக் குறிக்கிறது; ‘காணிக்கை’ என்பதை உரைக்குள் சேர்ப்பது விளக்கத்தை மூலமாக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பலியிடும் விலங்குகளின் பாலின வேறுபாடு தெளிவாக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு சம்பந்தப்பட்ட சொல்லுக்குப் பதிலாக வசன இறுதியில் வைக்கப்பட்டு, உரையின் வாசிப்போட்டம் காக்கப்பட்டுள்ளது.
