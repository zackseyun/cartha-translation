  terminology: “தலைவர்” suitably renders נָשִׂיא in this tribal setting. “காதின் மகன்கள்” preserves the source expression without unnecessarily replacing it with a purely interpretive tribal designation. “எலியாசாப்” is an appropriate rendering of אֶלְיָסָף.
