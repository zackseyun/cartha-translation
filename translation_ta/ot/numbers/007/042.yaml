  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: ta
  text: 'ஆறாம் நாளில், காதின் மகன்களின்[a] தலைவர் தேகுவேலின்[b] மகன் எலியாசாப்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “காதின் மகன்கள்”; அதாவது, காதின் வழிவந்த கோத்திரத்தார்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு எபிரெய மூலப்பிரதியில் பெயர் “தேகுவேல்” என்று உள்ளது; தொடர்புடைய வேறு சில இடங்களில் அது “ரெகுவேல்” என்று வருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: ஆறாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் בְּ முன்னொட்டையும் வரிசை எண்ணான ‘ஆறாம்’ என்பதையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָשִׂיא
  choice: தலைவன்
  rationale: இச்சூழலில் ஒரு கோத்திரத்தின் அதிகாரப்பூர்வத் தலைவரைக் குறிக்கிறது; அரச மரபைக் குறிக்கும் தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: לִבְנֵי גָד
  choice: காதின் மகன்களுக்கான
  rationale: לְ குறிக்கும் தொடர்பையும், ‘காதின் மகன்கள்’ என்ற எபிரெய குடும்ப/கோத்திர மரபுத்தொடரையும் பாதுகாக்கிறது.
- source_word: אֶלְיָסָף
  choice: எலியாசாப்
  rationale: தனிப்பெயர் மூல எபிரெய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய தந்தைவழிப் பெயரமைப்பைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: דְּעוּאֵל
  choice: தெகூவேல்
  rationale: இவ்வசனத்தின் மசோரா எபிரெய வடிவமான דְּעוּאֵל என்பதைக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளது.
