translation:
  language: ta
  text: பாவப் பலிக்காக ஒரு வெள்ளாட்டுக்கடா;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆட்டுக்கடா
  rationale: இந்த எபிரெயச் சொற்றொடர் வெள்ளாட்டு இனத்தைச் சேர்ந்த ஆண் ஆட்டைக் குறிக்கும் மரபுத்தொடர். நவீனத் தமிழில் ‘ஆட்டுக்கடா’ என்பது விலங்கின் ஆண்பாலையும் பலிக்குரிய விலங்கு என்ற குறிப்பையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: பலிப்பொருட்களின் எண்ணிக்கையைப் பட்டியலிடும் எண்ணாகிய ‘ஒன்று’ என்பதைத் தமிழில் பெயருக்கு முன் இயல்பாக வரும் ‘ஓர்’ என வெளிப்படுத்துகிறது; எண்ணிக்கை வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலிக்காக
  rationale: பலிச் சடங்குச் சூழலில் חַטָּאת என்பது பொதுவாகப் பாவம் என்ற கருத்தை மட்டும் அல்லாமல் அதற்கான பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ அந்தச் சடங்குப் பொருளைத் தெளிவாகத் தருகிறது; ‘-க்காக’ முன்னொட்டு לְ-ன் நோக்கப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவப் பலி
  rationale: இங்கு சொல் ஒரு பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது பாவத்துடன் தொடர்புடைய பரிகாரச் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: எண்ணாகமம் 7-இன் திரும்பத் திரும்ப வரும் காணிக்கைப் பட்டியல் நடைக்கு ஏற்றவாறு சுருக்கமான, dignified நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் தொடர்ச்சியைச் சுட்டிக்காட்ட இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
