  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֤וּ אֵלָי/ו֙ וַ֣/יֹּאמְר֔וּ גִּדְרֹ֥ת צֹ֛אן נִבְנֶ֥ה לְ/מִקְנֵ֖/נוּ פֹּ֑ה וְ/עָרִ֖ים לְ/טַפֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: ta
  text: அப்போது அவர்கள் அவரிடம் நெருங்கிவந்து, “எங்கள் கால்நடைகளுக்காக இங்கே ஆட்டுப்பட்டிகளையும், எங்கள் சிறுவர்களுக்காக[a] நகரங்களையும் கட்டுவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் பிள்ளைகளுக்காக.” எபிரெயச் சொல் சிறு பிள்ளைகளையோ சார்ந்திருப்பவர்களையோ குறிக்கலாம்; சமூகத்தின் பாதுகாப்பற்ற உறுப்பினர்கள் என்ற நுட்பமும் இதில் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: அவர்கள் அவரிடம் நெருங்கிவந்து
  rationale: נגשׁ என்பது உடலளவில் ஒருவரை அணுகுவதைக் குறிக்கிறது; ‘அவரிடம் நெருங்கிவந்து’ என்பது இயக்கத்தையும் இலக்கையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: நேர்கூற்றுக்குப் பின் வரும் ‘என்றார்கள்’ நவீன தமிழ்க் கதைநடையில் இயல்பாக இருந்து, எபிரெயத் தொடர்நிகழ்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: גִּדְרֹת צֹאן
  choice: ஆட்டுப்பட்டிகள்
  rationale: இந்தக் கூட்டுச்சொல் மந்தைக்கான வேலியிடப்பட்ட அடைப்புகளைக் குறிக்கிறது; சூழலில் ‘ஆட்டுப்பட்டிகள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: נִבְנֶה
  choice: கட்டுவோம்
  rationale: முதலாம் நபர் பன்மை முற்றுப்பெறா வினை இங்கு அவர்களுடைய நோக்கம் அல்லது முன்மொழிவைக் குறிக்கிறது; ‘கட்டுவோம்’ அந்தத் திறந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: לְמִקְנֵנוּ
  choice: எங்கள் கால்நடைகளுக்காக
  rationale: מִקְנֶה என்பது மாடுகள் மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கால்நடைகள்’ பொருத்தமான விரிவுடைய தமிழ்ச் சொல்.
- source_word: פֹּה
  choice: இங்கே
  rationale: எளிய இடக்குறிப்பு வினையடை இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעָרִים
  choice: நகரங்களையும்
  rationale: עָרִים என்பதன் நேரடி பன்மைப் பொருள் ‘நகரங்கள்’; குடியிருப்புகளின் அளவை உரை தெளிவுபடுத்தாததால் அதை ‘ஊர்கள்’ என்று குறுக்கவில்லை.
- source_word: לְטַפֵּנוּ
  choice: எங்கள் சிறுவர்களுக்காக
  rationale: טַף சிறு பிள்ளைகளையும், சில சூழல்களில் சார்ந்திருக்கும் பாதுகாப்பற்ற குடும்ப உறுப்பினர்களையும் குறிக்கலாம். ‘சிறுவர்கள்’ அதன் முதன்மையான வயது மற்றும் பாதுகாப்புத் தேவையின் நுட்பத்தைப் பேணுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டுவோம்’ என்பது உறுதியான நோக்கமாகவும் சூழலுக்கு ஏற்ப முன்மொழிவாகவும் வாசிக்கக்கூடிய எபிரெய வடிவின் நெகிழ்வைப் பேணுகிறது. அடிக்குறிப்பு குறியீடு உரையில் தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
