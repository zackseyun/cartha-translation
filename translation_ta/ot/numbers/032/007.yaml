reference: Numbers 32:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: ta
  text: யாவே அவர்களுக்குக் கொடுத்த நாட்டிற்குள் இஸ்ரவேல் மக்கள் கடந்து செல்லாதபடி, நீங்கள் ஏன் அவர்களுடைய மனத்தைத் தளரச் செய்கிறீர்கள்?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனத்தைத் தளரச்” என்பதற்கு “மனவுறுதியை அல்லது துணிவைக் குலைக்க” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லுக்குச் சொல் “இதயத்தைத் தளரச்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேல் மக்கள்” என்பதற்கு எபிரெயில் சொல்லுக்குச் சொல் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது; “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: நீங்கள் ஏன்
  rationale: வினாவை இயல்பான நவீனத் தமிழில் தருகிறது. எபிரெயச் சொற்றொடரிலுள்ள இணைப்பின் தொடர்ச்சி, முந்தைய வசனத்தோடு இயல்பாக வாசிக்கப்படுவதால் தனியே ‘மேலும்’ என்று சேர்க்கப்படவில்லை.
- source_word: תנואון אֶת־לֵב
  choice: அவர்களுடைய மனத்தைத் தளரச் செய்கிறீர்கள்
  rationale: நוא என்பதன் காரணவினைப் பொருளான ஊக்கத்தையும் மனவுறுதியையும் குலைத்தலைத் தெரிவிக்கிறது; ‘இதயம்’ என்ற எபிரெய உருவகத்தைத் தமிழில் இயல்பான ‘மனம்’ மூலம் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இனக்குழுவைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘இஸ்ரவேல் மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵעֲבֹר אֶל־הָאָרֶץ
  choice: நாட்டிற்குள் ... கடந்து செல்லாதபடி
  rationale: מִן + infinitive அமைப்பு அவர்கள் கடந்து செல்வதிலிருந்து தடுக்கப்படுவதைக் காட்டுகிறது. ‘நாட்டிற்குள்’ என்பது எல்லையைக் கடந்து நுழையும் இயக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: அவர்களுக்குக் கொடுத்த
  rationale: எபிரெய நிறைவுவினையைத் தமிழில் இயல்பான இறந்தகால உறவெச்சமாக வழங்குகிறது; கொடை நிறைவேறியதாகக் கூறப்படும் வலிமையைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரை நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரைப் பதிலிடாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ என்பது சாத்தியமான எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற இனக்குழுப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: இங்கு ஆண் சந்ததியினரை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் மரபுவழிப் பெயர். இயல்பான தமிழை முதன்மை உரையில் பயன்படுத்தி, மூலத்தின் குடும்ப உருவகத்தை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய ‘இதயம்’ உருவகம் தமிழுக்கேற்ற ‘மனம்’ என வழங்கப்பட்டு, அதன் நேரடி வடிவமும் பொருள் மாற்றுகளும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
