  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: ta
  text: மோசே அவர்களிடம், “நீங்கள் இந்தக் காரியத்தைச் செய்வீர்களானால், ஆயுதம் தரித்துக்கொள்வீர்களானால்[a] யாவேக்கு முன்பாக[b] போருக்காக,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆயுதம் தரித்துக்கொள்வீர்களானால்” என்பதற்கு “போருக்கு ஆயத்தமாயிருந்தால்,” “ஆயுதமேந்தியவர்களாகச் சென்றால்,” அல்லது “போருக்காக அணிவகுத்தால்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஆயுதமணிதல் அல்லது போருக்கு ஆயத்தமாதல் என்ற இராணுவப் பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யாவேக்கு முன்பாக.” அவர்களுடைய போர்ச் செயல் யாவேயின் முன்னிலையிலும் அவருடைய அதிகாரத்தின் கீழும் மேற்கொள்ளப்படுவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: மோசே அவர்களிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும் பேச்சின் இயல்பான தமிழ் அமைப்பையும் காக்கிறது.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: நீங்கள் இந்தக் காரியத்தைச் செய்வீர்களானால்
  rationale: முன்வைக்கப்பட்ட உடன்பாட்டைக் குறிக்கும் דָּבָר என்பதற்கு இச்சூழலில் ‘காரியம்’ இயல்பாகவும் போதிய பரப்புடனும் உள்ளது; நிபந்தனை அமைப்பும் வெளிப்படையாகக் காக்கப்படுகிறது.
- source_word: אִם תֵּחָלְצוּ
  choice: ஆயுதம் தரித்துக்கொள்வீர்களானால்
  rationale: חלץ என்பதன் நிஃபால் வடிவம் இங்கு போருக்காக ஆயுதமணிந்து ஆயத்தமாவதைக் குறிக்கிறது. தமிழ் வாசகருக்கு இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற இடவியல் மற்றும் இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது; יהוה என்பது பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: இச்சூழலில் מִלְחָמָה குறிக்கும் போர்ச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே நேரடியாக உள்ளது. ஆகவே பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: לִפְנֵי יְהוָה என்பதன் பொருள்
  choice: யாவேக்கு முன்பாக
  alternative: யாவேயின் சந்நிதியில்
  rationale: இராணுவ நடவடிக்கை யாவேயின் முன்னிலையிலும் அதிகாரத்தின் கீழும் நடப்பதைக் குறிக்கும் மூலச் சொல்லின் திறந்த நுணுக்கத்தைப் பாதுகாக்கிறது; ‘சந்நிதியில்’ என்பதிலுள்ள வழிபாட்டு ஒலிநயத்தைத் தேவையின்றி வலுப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரட்டை நிபந்தனை அமைப்பும், அடுத்த வசனத்தில் தொடரும் முடிவுறாத மேற்கோள் அமைப்பும் காக்கப்பட்டுள்ளன.
