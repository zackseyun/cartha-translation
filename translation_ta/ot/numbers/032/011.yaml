  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: ta
  text: எகிப்திலிருந்து புறப்பட்டு வந்த, இருபது வயதுமுதல் அதற்கு மேற்பட்ட வயதுடைய ஆண்களில் ஒருவர்கூட, நான் ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் அளிப்பதாகச் சத்தியம் செய்த நாட்டைக் காணமாட்டார்[a]; ஏனெனில் அவர்கள் என்னை முழுமையாகப் பின்பற்றவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அந்த ஆண்கள் ... நாட்டைக் காண்பார்களானால்” என்ற சத்தியச் சூத்திரம் உள்ளது; இது “ஒருவர்கூட காணமாட்டார்” என்ற வலுவான மறுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் எனக்குப் பின்னால் முழுமையாக வரவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ஒருவர்கூட ... காணப்போவதில்லை
  rationale: இங்கு אִם என்பது நிறைவு பெறாமல் விடப்பட்ட எபிரெய ஆணைச் சூத்திரத்தில் வலுவான மறுப்பைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க வலுவான எதிர்மறையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הָאֲנָשִׁים
  choice: ஆண்களில்
  rationale: எபிரெயச் சொல் குறிப்பாக ஆண்பால் பன்மை; இருபது வயது முதல் கணக்கிடப்பட்ட இராணுவச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்த
  rationale: עלה מן என்ற வெளியேற்றச் சூழலின் ‘மேலேறி வந்த’ கருத்தை இயல்பான நவீனத் தமிழில் ‘புறப்பட்டு வந்த’ என வழங்குகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதுமுள்ள
  rationale: வயது வரம்பைக் குறிக்கும் எபிரெயச் சூத்திரத்தின் பொருளைத் துல்லியமாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: הָאֲדָמָה
  choice: நாடு
  rationale: இங்கு אֲדָמָה மண்ணைக் காட்டிலும் முன்னோர்களுக்கு வாக்களிக்கப்பட்ட நிலப்பரப்பைக் குறிக்கிறது.
- source_word: נִשְׁבַּעְתִּי
  choice: தருவதாக ஆணையிட்ட
  rationale: லாமேத் முன்னிடைச்சொல்லுடன் வரும் பெயர்களை நோக்கமாக மட்டும் தவறாகப் புரிந்துகொள்ளாமல், முன்னோர்களுக்கான நாட்டின் வாக்குறுதியைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது; ‘ஆணையிட்ட’ என்பது தெய்வீக ஆணையின் தீவிரத்தைப் பேணுகிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: ஒவ்வொரு பெயருடனும் எபிரெயத்தில் மீண்டும் வரும் לְ என்பதன் முறையான உடன்படிக்கை நடையைத் தமிழில் ‘-க்கும்’ எனப் பேணுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: என்னை முழுமையாகப் பின்பற்றவில்லை
  rationale: מלא אחרי என்ற மரபுத்தொடரின் ‘முழுவதுமாகப் பின்பற்றுதல்’ என்ற உறவு சார்ந்த பொருளை விளக்க விரிவாக்கமின்றி தருகிறது.
theological_decisions:
- issue: אִם தொடங்கும் ஆணைச் சூத்திரத்தின் பொருள்
  choice: ஒருவர்கூட ... காணப்போவதில்லை
  alternative: ஆண்கள் ... நாட்டைக் கண்டால்
  rationale: எபிரெயத்தில் இது வலுவான மறுப்பை உள்ளடக்கிய நிறைவு பெறாத ஆணைச் சூத்திரம். சொற்சொல்லான நிபந்தனை வடிவம் தமிழில் தீர்ப்பின் உண்மைப் பொருளை மறைத்துவிடும்.
- issue: לֹא מִלְאוּ אַחֲרַי என்பதன் வரம்பு
  choice: என்னை முழுமையாகப் பின்பற்றவில்லை
  alternative: எனக்கு முற்றிலும் உண்மையுள்ளவர்களாக இருக்கவில்லை
  rationale: மூலமொழி ‘பின்பற்றுதல்’ என்ற உறவு மற்றும் உடன்படிக்கைப் படிமத்தையே பயன்படுத்துகிறது; பொதுவான விசுவாசக் கருத்தாக விரிவுபடுத்தாமல் அது பேணப்படுகிறது.
- issue: נִשְׁבַּעְתִּי לְאַבְרָהָם... என்ற தொடரின் தொடர்பு
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் தருவதாக ஆணையிட்ட நாடு
  alternative: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் ஆணையிட்ட நாடு
  rationale: எபிரெயத் தொடர் நாட்டைப் பற்றிய முன்னோர்களுக்கான ஆணையைச் சுருக்கமாகக் கூறுகிறது. தமிழில் ‘தருவதாக’ என்பது அந்த இலக்கணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்கள்’ என்பது மூலத்தின் ஆண்பால் குறிப்பையும் கணக்கெடுப்பு/போர்ச் சூழலையும் பேணுகிறது. ‘காணப்போவதில்லை’ என்பது நாட்டை அனுபவித்தல் அல்லது அதற்குள் நுழைதல் என்ற சூழற்பொருளைத் தீர்மானித்து விரிவாக்காமல், ‘காணுதல்’ என்ற மூலப் படிமத்தை வைத்திருக்கிறது.
