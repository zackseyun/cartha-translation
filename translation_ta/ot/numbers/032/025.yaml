  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: ta
  text: 'அப்போது காத் மக்களும் ரூபன் மக்களும் மோசேயிடம் இவ்வாறு சொன்னார்கள்: “தலைவரே, நீங்கள் கட்டளையிடுகிறபடியே உங்கள் ஊழியர்களாகிய நாங்கள் செய்வோம்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: காத் மக்களும் ரூபன் மக்களும்
  rationale: எபிரெய மொழியில் நேரடியாக ‘காத்தின் மகன்களும் ரூபனின் மகன்களும்’ என்றாலும், இங்கு அந்தக் கோத்திரங்களைச் சேர்ந்த மக்களைக் குறிப்பதால் இயல்பான நவீனத் தமிழில் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: ‘சொல்லி/சொல்வதாவது’ என்ற மேற்கோள் அறிமுகத்தின் பொருளைத் தமிழில் இயல்பான நேரடி உரை முடிவாக வெளிப்படுத்துகிறது; தனியாக ‘சொல்லி’ என இடுவது தேவையற்ற மீளுரைப்பாக இருக்கும்.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்களாகிய நாங்கள்
  rationale: பேசுவோர் தங்களை மரியாதையுடனும் கீழ்ப்படிதலுடனும் ‘உமது பணியாளர்கள்’ என்று குறிப்பிடுவதைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אֲדֹנִי
  choice: எங்கள் தலைவர்
  rationale: இங்கு மோசேயை நோக்கிய மரியாதைமிக்க மனிதப் பட்டம்; தெய்வீகப் பெயராகத் தவறாகப் புரிந்துகொள்ளப்படாதவாறு சூழலுக்கேற்ற ‘தலைவர்’ பயன்படுத்தப்பட்டது.
- source_word: כַּאֲשֶׁר ... מְצַוֶּה
  choice: கட்டளையிடுகிறபடியே
  rationale: כַּאֲשֶׁר என்பதிலுள்ள ‘எப்படியோ/அப்படியே’ என்ற துல்லிய இணக்கத்தையும், நிகழ்கால கட்டளையையும் ஒருங்கே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנִי என்ற மரியாதைப் பட்டம் கடவுளையா மோசேயையா குறிக்கிறது
  choice: மோசேயைக் குறிக்கும் மனித மரியாதைப் பட்டமாக ‘எங்கள் தலைவர்’
  alternative: ‘என் ஆண்டவர்’ அல்லது ‘என் தலைவன்’
  rationale: வாக்கியத்தில் உரை நேரடியாக மோசேயிடம் கூறப்படுகிறது; אֲדֹנִי என்பது ஒருமை வடிவில் மனித அதிகாரியை மரியாதையுடன் அழைக்கும் சொல். கடவுளுக்குரிய பட்டமாக வாசிக்கச் செய்யக்கூடிய சொல்லைத் தவிர்ப்பது சூழலைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். மூலத்தின் மரியாதை மற்றும் கீழ்ப்படிதல் தொனி காக்கப்பட்டுள்ளது; எபிரெய மேற்கோள் அறிமுகமான ‘சொல்லி’ தமிழின் இயல்புக்காக நேரடி உரை முடிவில் ஒன்றிணைக்கப்பட்டுள்ளது.
