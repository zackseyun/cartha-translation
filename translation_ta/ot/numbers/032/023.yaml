  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: ta
  text: ஆனால் நீங்கள் அப்படிச் செய்யாவிட்டால், இதோ, யாவேக்கு எதிராகப் பாவம் செய்திருப்பீர்கள். உங்கள் பாவம் உங்களைப் பிடித்துக்கொள்ளும் என்பதை அறிந்துகொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் பாவம் உங்களைக் கண்டுபிடிக்கும்” அல்லது “உங்கள் குற்றப்பழி உங்களை வந்தடையும்.” பாவம் தவறாமல் வெளிப்பட்டு, அதன் விளைவு பாவம் செய்தவரை வந்தடையும் என்ற கருத்தை எபிரெய மரபுத்தொடர் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... செய்யாவிட்டால்
  rationale: முந்தைய கட்டளைக்கு மாறான நிபந்தனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: நீங்கள் அப்படிச் செய்யாவிட்டால்
  rationale: முந்தைய சூழலில் கட்டளையிடப்பட்ட செயலைக் குறிப்பதோடு, எபிரெய நிபந்தனை அமைப்பையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: எச்சரிக்கையின் கவன ஈர்ப்பையும் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: חֲטָאתֶם
  choice: பாவம் செய்தவர்களாக இருப்பீர்கள்
  rationale: நிபந்தனை நிறைவேறாதபோது ஏற்படும் நிலையை எபிரெய நிறைவுற்ற வினையின் எச்சரிக்கைச் சூழலுக்கு ஏற்ற தமிழில் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு எதிராக
  rationale: חטא என்பதுடன் வரும் לְ, பாவம் யாருக்கு எதிராகச் செய்யப்படுகிறது என்பதைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וּדְעוּ
  choice: அறிந்துகொள்ளுங்கள்
  rationale: பன்மை ஏவல் வடிவின் நேரடியான கட்டளையையும் உறுதியான எச்சரிக்கையையும் தக்கவைக்கிறது.
- source_word: חַטַּאתְכֶם
  choice: உங்கள் பாவம்
  rationale: இச்சொல் ‘பாவம்’ அல்லது ‘குற்றப்பழி’ எனப் பொருள்படலாம்; முதன்மை உரையில் நேரடியான அறநெறிப் பொருளான ‘பாவம்’ தேர்ந்தெடுக்கப்படுகிறது.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: உங்களைக் கண்டுபிடிக்கும்
  rationale: מצא என்பதன் அடிப்படைப் பொருளையும், பாவம் செய்பவரைத் தவறாமல் சென்றடையும் என்ற உருவகத்தையும் பாதுகாக்கிறது; அதன் வெளிப்பாடு மற்றும் விளைவு சார்ந்த நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூல வடிவைத் தெளிவாகப் பிரதிபலிக்கிறது.
- issue: பாவம் மனிதனை ‘கண்டுபிடிக்கும்’ என்ற உருவகம்
  choice: உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: உங்கள் பாவம் வெளிப்பட்டுவிடும் / உங்கள் குற்றப்பழி உங்களை வந்தடையும்
  rationale: மூலம் பாவத்தைச் செயற்படும் ஒன்றாக உருவகப்படுத்துகிறது. அதை ஒரு குறிப்பிட்ட விளைவாக மட்டும் விளக்காமல், வெளிப்பாடும் தவிர்க்க முடியாத விளைவும் ஆகிய இரண்டுக்குமான இறுக்கத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கை நடையில் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற சற்றே உயர்ந்த சொல் மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது; மற்ற சொற்றொடர்கள் இயல்பான தற்போதைய தமிழில் உள்ளன.
