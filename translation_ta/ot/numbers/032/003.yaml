base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/003.yaml
  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: ta
  text: அதாரோத், தீபோன், யாசேர், நிம்ரா, எஷ்போன், எலெயாலே, செபாம்[a], நேபோ, மற்றும் பெயோன்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘செபாம்’; வேறு இடங்களில் இதனுடன் தொடர்புடைய இடப்பெயர் ‘சிப்மா’ அல்லது ‘ஷிப்மா’ என வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘பெயோன்’; வேறு இடங்களில் இதனுடன் தொடர்புடைய இடப்பெயர் ‘பாகால்-மெயோன்’ என்ற விரிவான வடிவத்தில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: அதாரோத்
  rationale: இடப்பெயரை அதன் எபிரெய வடிவத்திற்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: דִיבֹן
  choice: தீபோன்
  rationale: எபிரெய உச்சரிப்பைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: יַעְזֵר
  choice: யாசேர்
  rationale: இடப்பெயரின் எபிரெய வடிவத்தை இயல்பான தமிழ் எழுத்தமைப்பில் தருகிறது.
- source_word: נִמְרָה
  choice: நிம்ரா
  rationale: இவ்வசனத்திலுள்ள சுருக்கமான இடப்பெயரையே ஒலிபெயர்த்துள்ளது; வேறு இடங்களில் வரும் விரிவான பெயருடன் ஒத்திசைக்கவில்லை.
- source_word: חֶשְׁבּוֹן
  choice: எஷ்போன்
  rationale: எபிரெய பெயரிலுள்ள sh ஒலியைத் தமிழில் ‘ஷ்’ கொண்டு வெளிப்படுத்தும் நேரடி ஒலிபெயர்ப்பு.
- source_word: אֶלְעָלֵה
  choice: எலெயாலே
  rationale: இடப்பெயரின் எழுத்து மற்றும் உயிரொலி அமைப்பைத் தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: שְׂבָם
  choice: செபாம்
  rationale: இவ்வசனத்தின் மெய்யெழுத்து வடிவத்தையே அடிப்படையாகக் கொண்டது; வேறு இடங்களில் காணப்படும் தொடர்புடைய பெயரால் இதை மாற்றவில்லை.
- source_word: נְבוֹ
  choice: நேபோ
  rationale: பரவலாக அறியப்படும் இடப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּעֹן
  choice: பெயோன்
  rationale: இங்கு உள்ள சுருக்கமான பெயரை அப்படியே ஒலிபெயர்க்கிறது; வேறு இடங்களிலுள்ள விரிவான ‘பாகால்-மெயோன்’ வடிவத்தைப் புகுத்தவில்லை.
- source_word: וְ / וּ
  choice: பட்டியலின் முடிவில் ‘ஆகிய ஊர்கள்’
  rationale: எபிரெய மொழியின் தொடர்ச்சியான இணைப்புச் சொற்களைத் தமிழில் ஒவ்வொரு பெயருக்கும் மீண்டும் கூறுவது இயல்பற்றதாக இருப்பதால், பட்டியலைத் தெளிவாக முடிக்கும் தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
