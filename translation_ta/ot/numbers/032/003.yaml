translation_notes:
  register: நவீன தரத் தமிழில், இடப்பெயர்களை மொழிபெயர்க்காமல் மூல எபிரெய வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்த்துள்ளது. தமிழ் பட்டியல் நடைக்கு ஏற்ப இறுதியில் ‘ஆகிய ஊர்கள்’ சேர்க்கப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் வாக்கியத் துணுக்கு என்பதைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [a] குறி தவறாக ‘Ataroth’ அருகே இருந்தாலும், அதன் அடிக்குறிப்பு ‘Sebam’ பற்றியது என்பதால் மூலத் தகவலுக்கு ஏற்றவாறு ‘செபாம்’ அருகே அமைக்கப்பட்டுள்ளது.
