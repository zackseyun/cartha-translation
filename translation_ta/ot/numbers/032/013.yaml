  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: ta
  text: யாவேவின் கோபம் இஸ்ரவேலுக்கு எதிராகப் பற்றியெரிந்தது[a]. யாவேவின் பார்வையில் தீமை செய்த தலைமுறை முழுவதும் முடிவுக்கு வரும்வரை, அவர் அவர்களை நாற்பது ஆண்டுகள் வனாந்தரத்தில் அலைந்து திரியச் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே இஸ்ரவேல்மீது கோபமடைந்தார்.” எபிரெய மரபுத்தொடரைச் சொற்படக் கூறினால், “யாவேவின் மூக்கு/கோபம் எரிந்தது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் அவர்களை வனாந்தரத்தில் அலைந்து திரியும்படி செய்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற தீவிரமான உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயராகிய நான்கெழுத்துப் பெயர்; அதனை ஒலிபெயர்த்துள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: கோபத்தைக் குறிக்கும் வினையுடன் வரும் முன்னொட்டு, கோபத்தின் இலக்கை இங்கு குறிக்கிறது.
- source_word: וַיְנִעֵם
  choice: அவர்களை ... அலைந்து திரியச் செய்தார்
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளை வெளிப்படையாகக் காக்கிறது; அவர்கள் தாமாகவே அலைந்தனர் என்று மட்டும் கூறவில்லை.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: யாத்திரைப் பின்னணியில் மִדְבָּר என்பதற்குப் பொருத்தமானதும் தமிழ் வேதாகம நடையில் பரவலாக அறியப்பட்டதுமான சொல்.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: எண்ணளவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: அந்தத் தலைமுறை முழுவதும் அழிந்துபோகும்வரை
  rationale: תֹּם குறிக்கும் முற்றுப்பெறுதலை, இச்சூழலில் அந்தத் தலைமுறையினர் அனைவரும் முடிவடைவதாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעֹשֶׂה הָרַע
  choice: தீமையானதைச் செய்த
  rationale: கூட்டுப்பொருளுடைய ‘தலைமுறை’ என்பதை விளக்கும் எபிரெயப் பங்கேற்புவினையை இயல்பான தமிழ்ச் சார்பு தொடராக மொழிபெயர்க்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: ‘யாவேவின் கண்களில்’ என்ற எபிரெய மதிப்பீட்டு மரபுத்தொடரின் பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: இறைக் கோபத்தின் சித்தரிப்பு
  choice: யாவேவின் கோபம் பற்றியெரிந்தது
  alternative: யாவே இஸ்ரவேல்மீது கோபமடைந்தார்
  rationale: மூலத்தின் ‘கோபம் எரிந்தது’ என்ற உருவகத்தையும் அதன் இறையியல் தீவிரத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- issue: வனாந்தர அலைச்சலில் இறைச் செயலின் காரணவினை
  choice: அவர் அவர்களை ... அலைந்து திரியச் செய்தார்
  alternative: அவர்கள் ... அலைந்து திரிந்தார்கள்
  rationale: וַיְנִעֵם என்பதிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, தீர்ப்பில் யாவேவின் செயற்பாட்டை மறைக்காமல் கூறுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ என்ற பரிச்சயமான வேதாகமச் சொல் சூழலுக்காகத் தக்கவைக்கப்பட்டுள்ளது; மற்ற வாக்கிய அமைப்பு இயல்பான நடப்புத் தமிழில் உள்ளது. அனைத்து அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
