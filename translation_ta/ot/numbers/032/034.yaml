  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: ta
  text: காத்தின் மகன்கள்[b] தீபோனையும், அதரோத்தையும், அரோவேரையும் கட்டினார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலைப் பொறுத்து, ‘மீண்டும் கட்டினார்கள்’ அல்லது ‘அரணாக்கினார்கள்’ என்றும் பொருள் கொள்ளலாம்; எபிரெய வினைச்சொல் தனியாகப் பார்க்கும்போது ‘கட்டினார்கள்’ என்றே பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, காத்தின் கோத்திரத்தைச் சேர்ந்தவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: கட்டினார்கள்
  rationale: בנה என்ற எபிரெய வினைச்சொல்லின் நேரடியான பொருள் ‘கட்டினார்கள்.’ குடியேற்றச் சூழலில் ‘மீண்டும் கட்டினார்கள்’ அல்லது ‘அரணூட்டினார்கள்’ என்ற நுண்பொருள் இருக்கக்கூடும்; ஆனால் வினைச்சொல் தனக்குள் அதைத் தெளிவாகக் குறிக்கவில்லை.
- source_word: בְנֵי גָד
