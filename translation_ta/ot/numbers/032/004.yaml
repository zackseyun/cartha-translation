  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: ta
  text: யாவே இஸ்ரவேல் சபைக்கு[a] முன்னால் தாக்கிய நாடு கால்நடைகளுக்கு ஏற்ற நாடாகும்[b]; உமது அடியார்களுக்குக் கால்நடைகள் உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் கூட்டம்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடரை ‘கால்நடைகளுக்கான நாடு’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள சொல் மாடுகளை மட்டுமல்ல, கால்நடைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: இந்த நாடு
  rationale: אֶרֶץ இங்கு அவர்கள் முன்னர் பெயரிட்ட பகுதிகளைக் குறிக்கிறது. தமிழில் தொடர்புச் சொற்றொடருடன் இயல்பாக அமைய ‘இந்த நாடு’ என வழங்கப்பட்டது.
- source_word: הִכָּה
  choice: தாக்கிய
  rationale: נכה என்பதன் அடிப்படை வன்முறைச் செயலைப் பாதுகாக்கிறது; ‘தோற்கடித்த’ என்று விளக்கமாகச் சுருக்காமல், மூலத்தின் உருவகத்தையும் பதற்றத்தையும் விடாமல் வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לִפְנֵי
  choice: கண்முன்னே
  rationale: இஸ்ரவேல் சபை சாட்சியாக இருக்கும்போது நிகழ்ந்த செயலைக் குறிக்கும் ‘முன்பாக/முன்னிலையில்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் சபை
  rationale: עֵדָה என்பது திரண்ட சமூகத்தையோ சபையையோ குறிக்கிறது. ‘மக்கள் சபை’ என்பது வழிபாட்டுக் கூட்டத்துக்கு மட்டும் பொருளைக் குறுக்காமல், இஸ்ரவேலின் கூடிய சமூகத்தைத் தெளிவுபடுத்துகிறது.
- source_word: אֶרֶץ מִקְנֶה
  choice: கால்நடைகளை வளர்ப்பதற்கு ஏற்ற நாடு
  rationale: எபிரெயச் சொற்றொடர் நிலத்தின் தன்மை அல்லது கால்நடைகளுக்கான ஏற்றத்தைக் குறிக்கிறது. சொற்சொல்லான ‘கால்நடைகளின் நாடு’ என்பதைக் காட்டிலும் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: உமது அடியார்களிடமும் கால்நடைகள் உள்ளன
  rationale: לְ குறிக்கும் உடைமையை தமிழின் இயல்பான ‘இடம் ... உள்ளன’ அமைப்பில் வெளிப்படுத்தி, மோசேயிடம் அவர்கள் தங்களைத் தாழ்மையாகக் குறிப்பிடும் ‘அடியார்கள்’ என்பதையும் காக்கிறது.
- source_word: מִקְנֶה
  choice: கால்நடைகள்
  rationale: மாடுகள் மட்டுமல்லாமல் பலவகை வளர்ப்பு விலங்குகளையும் குறிக்கக்கூடிய விரிவான சொல்லாக இருப்பதால் ‘கால்நடைகள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்கப்பட்டது.
- issue: யாவே ‘நாட்டைத் தாக்கினார்’ என்ற சொற்றொடரின் பொருள்
  choice: தாக்கிய
  alternative: தோற்கடித்த
  rationale: சூழலில் அந்நாட்டின் மக்கள்மீதான இராணுவ வெற்றி உட்பொருளாக இருக்கலாம். எனினும், எபிரெய உரை ‘நாடு’ என்பதையே நேரடி பொருளாக வைத்து ‘தாக்கினார்’ எனக் கூறுவதால், அந்த மொழிநடையை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘உமது அடியார்கள்’ என்ற மரியாதைமிக்க பன்மை, பேசுவோர் மோசேயிடம் தங்களைத் தாழ்த்திக் கூறும் தொனியை நிலைநிறுத்துகிறது.
