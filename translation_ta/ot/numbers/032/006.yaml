source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: ta
  text: 'மோசே காத் மகன்களிடமும் ரூபன் மகன்களிடமும் கூறினார்: “உங்கள் சகோதரர்கள்[b] போருக்குச் செல்லும்போது[a], நீங்கள் இங்கேயே உட்கார்ந்திருப்பீர்களா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரில் ஈடுபடச் செல்லும்போது.” எபிரெய மொழியில் இது இராணுவ மோதலுக்குள் செல்வதைக் குறிக்கும் வழக்குச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் சகோதரர்கள்” என்பது மற்ற கோத்திரங்களைச் சேர்ந்த சக இஸ்ரவேலர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் மோசே ... என்று கேட்டார்
  rationale: வாவ் தொடர் உரையாடலை முன்னெடுக்கிறது; சூழலில் எதிர்மறைத் திருப்பம் இருப்பதால் இயல்பான தமிழில் ‘ஆனால்’ பயன்படுத்தப்பட்டது. கேள்வி வடிவ நேரடி உரையாதலால் ‘என்று கேட்டார்’ பொருத்தமானது.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: காதின் மகன்களிடமும் ரூபனின் மகன்களிடமும்
  rationale: בני என்பதன் ‘மகன்கள்’ என்ற உருவகத்தையும், கோத்திர வழிவந்தோரைக் குறிக்கும் எபிரெய வடிவத்தையும் காக்கிறது.
- source_word: הַאַחֵיכֶם
  choice: உங்கள் சகோதரர்கள்
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லை நேரடியாகக் காக்கிறது; இச்சூழலில் மற்ற இஸ்ரவேல் கோத்திரத்தாரைக் குறிக்கிறது.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: போருக்குச் செல்லும்போது
  rationale: ‘போருக்குள் செல்/போருக்குச் செல்’ என்ற வழக்குச் சேர்க்கையை இயல்பான தமிழில் தருகிறது. தொடரும் வினாவுடன் இணைந்து மோசேயின் கண்டிக்கும் முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: நீங்கள் இங்கேயே உட்கார்ந்திருப்பீர்களா?
  rationale: ישב என்பதன் konkretமான ‘உட்கார்’ பொருளையும், அவர்கள் போரில் பங்கேற்காமல் இங்கே தங்குவதைக் கண்டிக்கும் கூர்மையையும் காக்கிறது; ‘இங்கேயே’ முரண்பாட்டை இயல்பாக வலியுறுத்துகிறது.
theological_decisions:
- issue: ‘உங்கள் சகோதரர்கள்’ என்பதன் குறிப்பு
  choice: மூலத்தின் குடும்ப உறவுச் சொல்லை முதன்மை உரையில் வைத்தல்
  alternative: ‘மற்ற இஸ்ரவேலர்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலச் சொல்லின் கோத்திரக் குடும்ப ஒற்றுமை உருவகத்தைப் பாதுகாத்து, அதன் சூழல்பொருளை அடிக்குறிப்பில் விளக்குவது தேவையற்ற விளக்கவுரையை முதன்மை உரைக்குள் கொண்டுவராமல் இருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. ‘மகன்கள்’ மற்றும் ‘சகோதரர்கள்’ ஆகிய குடும்ப உறவுச் சொற்கள் எபிரெய கோத்திர மொழிநடையைப் பாதுகாக்கின்றன. கண்டிக்கும் வினாவின் கூர்மைக்காக ‘இங்கேயே உட்கார்ந்திருப்பீர்களா?’ பயன்படுத்தப்பட்டது.
