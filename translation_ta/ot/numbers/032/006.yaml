revisions:
- from: ஆனால் மோசே காதின் மகன்களிடமும் ரூபனின் மகன்களிடமும், “உங்கள் சகோதரர்கள் போருக்குச் செல்லும்போது[a], நீங்கள் இங்கேயே உட்கார்ந்திருப்பீர்களா?” என்று கேட்டார்.[b]
  to: 'மோசே காத் மகன்களிடமும் ரூபன் மகன்களிடமும் கூறினார்: “உங்கள் சகோதரர்கள்[b] போருக்குச் செல்லும்போது[a], நீங்கள் இங்கேயே உட்கார்ந்திருப்பீர்களா?”'
  rationale: The revision retains the source’s rhetorical rebuke, the literal familial designation, and the concrete ‘sit here’ contrast. It removes an unwarranted adversative, renders the speech-introduction verb as ‘said,’ regularizes tribal names, and relocates the explanatory footnote marker to its referent.
