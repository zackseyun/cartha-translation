base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: ta
  text: ஆனால் அவர்கள் ஆயுதம் தரித்தவர்களாக உங்களோடு கடந்து செல்லாவிட்டால், கானான் நாட்டில் உங்களிடையே நிலப்பங்கு பெறுவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கானான் நாட்டில் உங்களிடையே குடியமர்த்தப்படுவார்கள்.” எபிரெய வினைச்சொல் வெறுமனே நிலத்தைப் பெறும் செயலை மட்டுமல்லாமல், உடைமையில் நிலைநிறுத்தப்படுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: ஆனால் ... செல்லாவிட்டால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிபந்தனைக்கு மாறான சாத்தியத்தை இது அறிமுகப்படுத்துவதால், எதிர்மறைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעַבְרוּ
  choice: கடந்து செல்ல
  rationale: யோர்தானைக் கடந்து கானான் நாட்டிற்குச் செல்வதைக் குறிக்கும் புவியியல் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: חֲלוּצִים
  choice: ஆயுதம் தரித்தவர்களாக
  rationale: போருக்காக ஆயுதம் ஏந்தி அணிவகுத்த நிலையில் இருப்பதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: אִתְּ/כֶם
  choice: உங்களோடு
  rationale: மற்ற இஸ்ரவேலரோடு சேர்ந்து செல்வதைக் குறிக்கும் உடனிருப்புப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְ/נֹאחֲזוּ
  choice: நிலப்பங்கு பெறுவார்கள்
  rationale: நிபால் வடிவம் நிலவுடைமையில் நிலைநிறுத்தப்படுதல் அல்லது பங்கு பெறுதல் என்ற பொருளை இச்சூழலில் தருகிறது; ‘நிலப்பங்கு பெறுவார்கள்’ என்பது அதன் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது, அதேவேளையில் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְ/תֹכְ/כֶם
  choice: உங்களிடையே
  rationale: இஸ்ரவேல் மக்களின் நடுவில் அவர்களுக்கு இடம் அளிக்கப்படுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: எபிரெய மூலத்தின் முழுப் புவியியல் குறிப்பை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
