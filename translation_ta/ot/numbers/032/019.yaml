  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: ta
  text: ஏனெனில், யோர்தானுக்கு அப்பாலும் அதற்கு அப்பாலுள்ள பகுதிகளிலும் அவர்களோடு நாங்கள் உரிமைப்பங்கு பெறமாட்டோம்; எங்கள் உரிமைப்பங்கு யோர்தானின் கிழக்குப் பக்கத்தில் எங்களுக்குக் கிடைத்துவிட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִנְחַל
  choice: உரிமைப்பங்கு பெறமாட்டோம்
  rationale: נחל என்ற வினை நிலப் பங்கீட்டுச் சூழலில் சுதந்தரமாக அல்லது ஒதுக்கப்பட்ட பங்காகப் பெறுவதைக் குறிக்கிறது. நவீன தமிழில் ‘உரிமைப்பங்கு பெறுதல்’ அந்த நிலப்பங்கீட்டு நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: אִתָּם
  choice: அவர்களோடு
  rationale: மேற்குப் பகுதியைப் பெறும் மற்ற கோத்திரங்களுடன் சேர்ந்து பங்கு பெறாதிருப்பதை நேரடியாகக் காட்டுகிறது.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: யோர்தானுக்கு அப்பால் இன்னும் தொலைவில்
  rationale: מֵעֵבֶר என்பது ஆற்றுக்கு அப்பாலுள்ள பகுதியையும், וָהָלְאָה என்பது அதற்கு அப்பால் தொடர்ந்து செல்லும் இடத்தையும் குறிக்கிறது. தமிழ் சொற்றொடர் இந்த இடவியல் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: בָאָה
  choice: கிடைத்துவிட்டது
  rationale: பெண்பால் ஒருமை நிறைவுவினை ‘எங்கள் உரிமைப்பங்கு’ கிடைத்திருப்பதைச் சுட்டுகிறது. எபிரெய ‘வந்தது’ என்ற உருவகத்தைச் சொற்சொல்லாக மொழிபெயர்ப்பதைவிட, தமிழில் ‘கிடைத்துவிட்டது’ நிலப்பங்கீட்டுச் சூழலில் இயல்பாக உள்ளது.
- source_word: נַחֲלָתֵנוּ
  choice: எங்கள் உரிமைப்பங்கு
  rationale: נחלה என்பது இங்கு தலைமுறைச் சுதந்தரம் மட்டுமல்ல, கோத்திரத்துக்கு ஒதுக்கப்பட்ட நிலப்பங்கையும் குறிக்கிறது; ‘உரிமைப்பங்கு’ இரு நுணுக்கங்களையும் சுருக்கமாகத் தருகிறது.
- source_word: אֵלֵינוּ
  choice: எங்களுக்கு
  rationale: אֶלֵינוּ என்பதன் ‘எங்களிடம்/எங்களுக்கு’ என்ற திசை அல்லது பெறுநர் பொருள், ‘கிடைத்துவிட்டது’ என்பதுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: யோர்தானின் கிழக்குப் பக்கத்தில்
  rationale: பேசுகிறவர்கள் இருக்கும் பகுதியைத் தெளிவுபடுத்தும் வகையில், ‘யோர்தானுக்கு அப்பால், கிழக்கே’ என்ற எபிரெய இடவியல் கருத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
