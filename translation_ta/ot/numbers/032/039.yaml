translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘மகன்கள்’ என்ற எபிரெய உறவுமுறைச் சொல் பாதுகாக்கப்பட்டுள்ளது. பன்மை வினைகளுக்குப் பின் வரும் மூலத்தின் எதிர்பாராத ஒருமை வினை உரையில் அப்படியே வைக்கப்பட்டு, அதன் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
