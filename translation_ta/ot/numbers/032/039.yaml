base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: ta
  text: மனாசேயின் மகனான மாகீரின் மகன்கள் கீலேயாத்துக்குச் சென்று அதைக் கைப்பற்றினார்கள். அங்கிருந்த எமோரியரை[a] அவன் வெளியேற்றினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எமோரியன்’ என்று ஒருமை இனப்பெயர் உள்ளது; அது இங்கு எமோரிய மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இதற்கு முந்திய வினைகள் பன்மையில் இருந்தாலும், எபிரெயத்தில் இங்கு ‘அவன் வெளியேற்றினான்’ என்று ஒருமை வினை உள்ளது. இது மாகீரின் சந்ததியை ஒரே குழுவாகக் கருதுவதாலோ, உரை அல்லது நடையில் ஏற்பட்ட மாற்றத்தாலோ இருக்கலாம். சில மொழிபெயர்ப்புகள் இதை ‘அவர்கள் வெளியேற்றினார்கள்’ என்று சீராக்குகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பது இங்கு வழக்கமான வரலாற்றுக் கதைநடை வினையாக இருப்பதால், உயரமான இடத்துக்குச் சென்றார்கள் என்ற கருத்தைச் சேர்க்காமல் ‘சென்றார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகனான மாகீரின் மகன்கள்
  rationale: בני என்பது நேரடியாக ‘மகன்கள்’ என்று பொருள்பட்டாலும், சந்ததியினரையோ குலத்தினரையோ குறிக்கவும் முடியும். எபிரெய உறவுமுறைச் சொல்லைத் தமிழில் தெளிவாகப் பாதுகாக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: גִּלְעָדָה
  choice: கீலேயாத்துக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைச் சுட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் இயல்பாக ‘கீலேயாத்துக்கு’ என வழங்கப்பட்டது.
- source_word: וַיִּלְכְּדֻהָ
  choice: அதைக் கைப்பற்றினார்கள்
  rationale: לכד என்பது ஓர் இடத்தைப் போர்வழியாகப் பிடித்தல் அல்லது கைப்பற்றுதல் என்ற பொருளில் வருவதால், ‘கைப்பற்றினார்கள்’ பொருத்தமானது.
- source_word: וַיּוֹרֶשׁ
  choice: அவன் வெளியேற்றினான்
  rationale: ירש என்பதன் ஹிஃபில் வடிவம் குடியிருப்போரைக் கட்டுப்பாட்டிலிருந்தோ நிலத்திலிருந்தோ அகற்றுவதைக் குறிக்கிறது. மசோரா உரையின் மூன்றாம் நபர் ஆண்பால் ஒருமையைப் பாதுகாக்க ‘அவன்’ பயன்படுத்தப்பட்டது; அதன் திடீர் இலக்கண மாற்றம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியரை
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், அது ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது. தமிழில் அந்தக் கூட்டு மக்களைக் குறிக்க ‘எமோரியரை’ இயல்பானது.
- source_word: אֲשֶׁר בָּהּ
  choice: அங்கிருந்த
  rationale: கீலேயாத்தில் வாழ்ந்த குடியிருப்போரைக் குறிக்கும் உறவுத் தொடரைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் ‘அங்கிருந்த’ என வழங்குகிறது.
