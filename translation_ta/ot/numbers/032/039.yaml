  source_fidelity: 'மூல எபிரெய உரையின் வரிசையும் கருத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: மாகீரின் மகன்கள் கீலேயாத்திற்குச் செல்வது, அதை கைப்பற்றுவது, பின்னர் எதிர்பாராத மூன்றாம் நபர் ஆண்பால் ஒருமை வினையுடன் எமோரியரை வெளியேற்றுவது ஆகியவை சரியாக உள்ளன. ‘அவன்’ என்பது மூலத்தின் ஒருமை வினையை வெளிப்படையாகப் பாதுகாக்கிறது; அடிக்குறிப்பு அந்த இலக்கணத் தெளிவின்மையை உரியவாறு குறிப்பிடுகிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிக்க இயல்பாகவும் உள்ளது. ‘அதைக் கைப்பற்றினார்கள்’ மற்றும் ‘அங்கிருந்த எமோரியரை’ ஆகியவை கதைநடைக்கு ஏற்றவை. ‘அவன் வெளியேற்றினான்’ என்ற திடீர் ஒருமை வடிவம் தமிழில் சற்றே குறித்துக் கவனிக்கத்தக்கதாக இருந்தாலும், அது மூலத்தின் நோக்கமுள்ள/விவாதத்துக்குரிய இலக்கண அம்சத்தைப் பாதுகாக்கிறது; எனவே அடிக்குறிப்புடன் இது பொருத்தமானது.
