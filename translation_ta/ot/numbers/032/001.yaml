source:
  edition: WLC
  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: ta
  text: ரூபனின் மக்களுக்கும் காதின் மக்களுக்கும் மிகவும் ஏராளமான கால்நடைகள் இருந்தன. அவர்கள் யாசேர் நாட்டையும் கீலேயாத் நாட்டையும் கண்டார்கள்; இதோ, அந்த இடம் கால்நடைகளுக்கு ஏற்ற இடமாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “அந்த இடம் கால்நடைகளுக்கான இடமாக இருந்தது.”'
    reason: மூலத்தில் ‘இடம்’ என்ற சொல் மீண்டும் வருவதால் ஏற்படும் வலியுறுத்தலை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: ஏராளமான கால்நடைகள் இருந்தன; அவற்றின் எண்ணிக்கை மிகப் பெரிதாயிருந்தது
  rationale: מִקְנֶה என்பது மாடுகள் மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது; எனவே ‘கால்நடைகள்’ என மொழிபெயர்க்கப்பட்டது. רַב மற்றும் עָצוּם מְאֹד ஆகிய இரு வலியுறுத்தல்களையும் இயல்பான தமிழில் தனித்தனியாக வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: ரூபனின் மக்களுக்கும் காதின் மக்களுக்கும்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மக்கள்/மகன்கள்’; இங்கு கோத்திரத்தாரைக் குறிப்பதால், பாலின வரம்பைத் தவிர்த்து எபிரெய அமைப்பையும் ஓரளவு காக்கும் ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּרְאוּ
  choice: அவர்கள் ... பார்த்தபோது
  rationale: தொடர்ந்து வரும் கண்டறிதலுடன் இயல்பாக இணைக்கத் தமிழில் காலநிலைத் தொடர்பு பயன்படுத்தப்பட்டது; இது நிகழ்வுகளின் கதைத் தொடரை வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ יַעְזֵר וְאֶרֶץ גִּלְעָד
  choice: யாசேர் நாட்டையும் கீலேயாத் நாட்டையும்
  rationale: אֶרֶץ என்பதன் மீளுரையைப் பாதுகாத்து, இச்சூழலில் ‘நாடு’ என்ற இயல்பான தமிழ் இணை பயன்படுத்தப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்த்து, அவர்கள் கண்ட உண்மையைத் தெளிவாக முன்னிறுத்துகிறது; ‘இதோ’ அதன் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: அந்த இடம் கால்நடைகளுக்கு ஏற்ற இடமாக இருந்தது
  rationale: மூலத்திலுள்ள מָקוֹם என்ற சொல்லின் மீளுரையை ‘இடம் ... இடம்’ எனக் காத்து, அதன் பொருளான கால்நடை வளர்ப்புக்கான ஏற்ற தன்மையையும் தெளிவாக்குகிறது.
