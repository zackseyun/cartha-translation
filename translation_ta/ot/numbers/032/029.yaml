source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: ta
  text: மோசே அவர்களிடம், “காதின் மகன்களும் ரூபனின் மகன்களும், போருக்காக ஆயுதம் ஏந்திய ஒவ்வொருவரும், யாவேக்கு முன்பாக உங்களோடு யோர்தானைக் கடந்தால், நாடு உங்கள் முன்பாக அடக்கப்பட்டால், கீலேயாத் நாட்டை அவர்களுக்கு உடைமையாகக் கொடுக்க வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான உரையறிமுகத்தை இயல்பான தமிழ் நேரடி உரை அமைப்பில் முடிவில் வைக்கிறது.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: காதின் மகன்களும் ரூபனின் மகன்களும்
  rationale: கோத்திர அடையாளத்தைக் குறிக்கும் மூலமொழியின் முறையான உறவுச் சொல்லான ‘மகன்கள்’ என்பதைத் தக்கவைக்கிறது.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עבר என்பதன் இயக்கத்தையும் யோர்தான் நேரடி செயப்படுபொருளாக இருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: போருக்காக ஆயுதம் ஏந்திய ஒவ்வொருவரும்
  rationale: போருக்கு ஆயத்தமாக ஆயுதம் தரித்த ஒவ்வொருவரையும் குறிக்கும் இராணுவச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: இறைநாமத்தையும் ‘முன்பாக’ என்ற உடன்படிக்கை சார்ந்த முன்னிலை உணர்வையும் தக்கவைக்கிறது.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: அந்த நாடு ... அடக்கப்பட்டால்
  rationale: כבש என்பதன் நிபால் வடிவிலுள்ள செயப்பாட்டு மற்றும் விளைவு உணர்வைப் பாதுகாக்கிறது; முற்றாக அழித்தல் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: לִפְנֵיכֶם
  choice: உங்கள் முன்பாக
  rationale: இஸ்ரவேலரின் முன்னேற்றத்துக்கு முன் நாடு கட்டுப்பாட்டுக்குள் வருவதைச் சுட்டும் எபிரெய மரபுத்தொடரைத் தக்கவைக்கிறது.
- source_word: וּנְתַתֶּם לָהֶם ... לַאֲחֻזָּה
  choice: அவர்களுக்கு உரிமைச் சொத்தாகக் கொடுக்க வேண்டும்
  rationale: நிபந்தனை நிறைவேறிய பின் நிலத்தை நிலையான உடைமையாக வழங்க வேண்டிய கடமையை இயல்பான தமிழில் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நேரடி உரை. மூலத்தின் நிபந்தனை அமைப்பும் இராணுவச் சூழலும் செயப்பாட்டு வினையும் பாதுகாக்கப்பட்டுள்ளன.
