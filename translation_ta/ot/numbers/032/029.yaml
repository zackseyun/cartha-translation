  source_fidelity: மூலத்தின் நிபந்தனை அமைப்பும் இராணுவத் தகுதியும் பெரும்பாலும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் வரைவில் ‘யோர்தானைக் கடந்து’ என்பது நிபந்தனை வினையுடன் வெளிப்படையாக இணைக்கப்படவில்லை; எனவே கடந்துசெல்லுதலும் நாடு அடக்கப்படுதலும் நிபந்தனையின் இணை கூறுகள் என்பதைத் தெளிவாக்கத் திருத்தம் தேவை.
