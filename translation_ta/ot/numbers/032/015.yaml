base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் அவரைப் பின்பற்றுவதிலிருந்து விலகினால்[a], அவர் அவனை மீண்டும் வனாந்தரத்தில் விட்டுவிடுவார்[b]; இந்த மக்கள் அனைவருக்கும் நீங்கள் அழிவை வரவழைப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல் வடிவம், “அவருக்குப் பின்னாலிருந்து திரும்பினால்”; இது அவரைப் பின்பற்றுவதை விட்டுவிடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரையில் “அவனை வனாந்தரத்தில் விட்டுவிடுவார்” என்று ஒருமைச் சுட்டுப்பெயர் உள்ளது. அது இஸ்ரவேலையோ மக்களையோ ஒரு கூட்டாகக் குறிப்பதாக இருக்கலாம். சில மொழிபெயர்ப்புகள் இதை “அவர்களை” அல்லது “இஸ்ரவேலை” என்று வெளிப்படையாகத் தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில், ... விலகினால்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தையும் இங்கு உள்ள நிபந்தனைப் பொருளையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: நீங்கள் அவரைப் பின்பற்றுவதிலிருந்து விலகினால்
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘அவருக்குப் பின்னாலிருந்து திரும்பினால்’ என்பதற்குப் பதிலாக, அவரைப் பின்பற்றுவதை நிறுத்தும் கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְיָסַף עוֹד
  choice: மீண்டும்
  rationale: இரு எபிரெயச் சொற்களும் சேர்ந்து ஒரு செயலை மறுபடியும் செய்வதைக் குறிக்கும்.
- source_word: לְהַנִּיחוֹ
  choice: அவனை ... விட்டுவிடுவார்
  rationale: நிலைத்திருக்கச் செய்தல் அல்லது அங்கேயே விட்டுவிடுதல் என்ற ஹிஃபில் வினையின் சூழல்சார் பொருளைத் தருவதோடு, எபிரெய மூலத்திலுள்ள ஒருமைச் சுட்டுப்பெயரையும் தக்கவைக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்திலேயே
  rationale: இஸ்ரவேலின் அலைந்து திரிந்த நிலப்பரப்பையும் அங்கேயே விடப்படும் தீர்ப்பின் வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: וְשִׁחַתֶּם
  choice: அழிவை வரவழைப்பீர்கள்
  rationale: மக்களை அழிக்கும் விளைவுக்கு இவர்களே காரணமாவார்கள் என்ற வினையின் அழிவுண்டாக்கும் பொருளைப் பாதுகாக்கிறது; உடனடி முழு ஒழிப்பாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: לְכָל הָעָם הַזֶּה
  choice: இந்த மக்கள் அனைவருக்கும்
  rationale: எபிரெயில் ஒருமைக் கூட்டுப்பெயராக உள்ள ‘இந்த மக்கள்’ என்பதைத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: לְהַנִּיחוֹ என்பதிலுள்ள ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அவனை’ என்ற ஒருமையைத் தக்கவைத்து, அதை இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிப்பதாக அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அவர்களை’ என்று பன்மையாக்குதல் அல்லது ‘இஸ்ரவேலை’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: மூல எபிரெய உரை ஒருமைச் சுட்டுப்பெயரைப் பயன்படுத்துகிறது. அடுத்த சொற்றொடரிலுள்ள ‘இந்த மக்கள் அனைவரும்’ என்பதால் அது இஸ்ரவேல் மக்களை ஒரு கூட்டமாகக் குறிப்பது சாத்தியம்; மொழிபெயர்ப்பில் அதை மறைத்து ஒரே விளக்கத்தை மட்டும் நிர்ணயிக்காமல் மூல வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்கும் ‘அவர்’ மரியாதை வடிவில் தரப்பட்டுள்ளது; மக்களைக் கூட்டாகக் குறிக்கும் மூலத்தின் ஒருமை ‘அவனை’ மட்டும் திட்டமிட்டு அப்படியே பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
