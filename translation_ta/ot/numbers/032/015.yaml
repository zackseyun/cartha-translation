    issue: Unwarranted emphasis in ‘வனாந்தரத்திலேயே’
    rationale: The Hebrew preposition בְּ means ‘in’; it does not include an explicit emphatic particle corresponding to Tamil -ஏ. ‘வனாந்தரத்தில்’ is more exact.
