source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: ta
  text: எப்புன்னேயின் மகனும் கெனிசியனுமான காலேபும், நூனின் மகன் யோசுவாவும் தவிர; ஏனெனில் அவர்கள் யாவேவை முழுமையாகப் பின்பற்றினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவை முழு மனதுடன் பின்பற்றினார்கள்.” எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல், “யாவேக்குப் பின்னால் நிறைத்தார்கள்” என உள்ளது; அது முழுமையான பற்றுறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: தவிர
  rationale: முந்தைய தீர்ப்பிலிருந்து காலேபும் யோசுவாவும் மட்டும் விலக்கப்பட்டிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: கெனிசியனான எப்புன்னேயின் மகன் காலேப்
  rationale: தனிப்பெயர்களையும் குல அடையாளத்தையும் தமிழில் தெளிவாக ஒலிபெயர்த்து, בֶּן என்பதைக் ‘மகன்’ என்று மொழிபெயர்க்கிறது.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவாவும்
  rationale: וְ இணைப்பை ‘-உம்’ மூலம் இயல்பாகக் காட்டி, தந்தை–மகன் உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இருவரும் தீர்ப்பிலிருந்து விலக்கப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் பொருளை வெளிப்படுத்துகிறது.
- source_word: מִלְאוּ אַחֲרֵי
  choice: முழுமையாகப் பின்பற்றினார்கள்
  rationale: சொல்லுக்குச் சொல் ‘பின்னால் நிறைத்தார்கள்’ எனும் எபிரேய மரபுத்தொடர், இங்கு முழுமையான பற்றுறுதியுடன் பின்பற்றுவதைக் குறிக்கிறது; தேர்ந்தெடுத்த தமிழ் அதன் வலிமையை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், ஒரு பட்டத்தைப் பதிலிடாமல் அந்தப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: מִלְאוּ אַחֲרֵי என்பதிலுள்ள முழுமையான பற்றுறுதி
  choice: முழுமையாகப் பின்பற்றினார்கள்
  alternative: முழு மனதுடன் பின்பற்றினார்கள்
  rationale: இரண்டு வாசிப்புகளும் முழுமையான விசுவாசப் பற்றுறுதியைத் தெரிவிக்கின்றன. முதன்மை உரை எபிரேய உருவகத்தின் தீவிரத்தைச் சுருக்கமாகப் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியான விதிவிலக்குக் கூறாக இருப்பதால், ‘தவிர’ என்ற அமைப்பு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் வினைத்தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
