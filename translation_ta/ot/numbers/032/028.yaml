source:
  edition: WLC
  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: ta
  text: அப்பொழுது மோசே அவர்களைக் குறித்து ஆசாரியனாகிய எலெயாசாருக்கும், நூனின் மகன் யோசுவாவுக்கும், இஸ்ரவேல் மக்களின் கோத்திரங்களிலுள்ள தந்தைவழிக் குடும்பங்களின் தலைவர்களுக்கும் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டார்
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளையிடும் பொருளை இயல்பான, கண்ணியமான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָהֶם
  choice: அவர்களைக் குறித்து
  rationale: உடனுள்ள சூழலில் காத் மற்றும் ரூபன் கோத்திரத்தாரைக் குறிக்கிறது; கட்டளையைப் பெறுவோர் பின்னர் பெயரிடப்பட்ட தலைவர்கள் என்பதால், ‘அவர்களைக் குறித்து’ என்பது வாக்கிய உறவைத் தெளிவாக வெளிப்படுத்துகிறது. ‘அவர்களுக்கு’ என்ற இலக்கண வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: ஆசாரியனாகிய எலெயாசாருக்கும்
  rationale: אֵת இங்கு צוה வினையின் நபர்-சார்ந்த நேரடிப் பொருளை அறிமுகப்படுத்துகிறது; தமிழில் ‘-க்கும்’ கட்டளையைப் பெறுபவரை இயல்பாகக் குறிக்கிறது.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: நூனின் மகன் யோசுவாவுக்கும்
  rationale: எபிரேயத் தந்தைப்பெயர் அமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: கோத்திரங்களிலுள்ள தந்தைவழிக் குடும்பங்களின் தலைவர்களுக்கும்
  rationale: சுருக்கமான நிர்வாகச் சொல்லாட்சியில் உள்ள கோத்திரம், தந்தைவழிக் குடும்பம், தலைவர் ஆகிய அடுக்குகளை வாசகருக்குப் புரியும் தமிழில் காக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பதிலாக, இங்கு கோத்திர நிர்வாக அமைப்பைக் குறிக்கும் இயல்பான தமிழ் மரபுச் சொல்லாட்சியைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: לָהֶם என்பதன் தொடர்பு
  choice: முந்தைய சூழலில் குறிப்பிடப்பட்ட காத் மற்றும் ரூபன் கோத்திரத்தாரைக் குறித்து மோசே தலைவர்களுக்குக் கட்டளையிட்டார்
  alternative: לָהֶם என்பதை இவ்வசனத்தில் பெயரிடப்பட்ட தலைவர்களைக் குறிக்கும் ‘அவர்களுக்கு’ எனக் கொள்ளலாம்
  rationale: אֵת உடன் பெயரிடப்பட்டவர்கள் צוה வினையின் கட்டளைப் பெறுநர்களாக இருப்பதும், முந்தைய வசனங்களின் பொருளும் ‘அவர்களைக் குறித்து’ என்ற வாசிப்பை ஆதரிக்கின்றன; எனினும் எபிரேய வடிவத்தின் மாற்று தொடர்பு சாத்தியம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வேதாகமச் சூழலுக்கு ஏற்ற கண்ணியமான நடை. ‘தந்தைவழிக் குடும்பங்கள்’ என்பது אֲבוֹת என்ற நிர்வாக-வம்சச் சொல்லை விளங்கத்தக்க வகையில் தருகிறது; மிகப் பழமையான ‘பிதாக்களின் வீடுகள்’ போன்ற சொல்லுக்கு சொல் வடிவம் தவிர்க்கப்பட்டது.
