base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: ta
  text: மோசே காதின் மக்களுக்கும் ரூபனின் மக்களுக்கும் யோசேப்பின் மகனான மனாசேயின் அரைக் கோத்திரத்துக்கும் எமோரியரின் அரசனான சீகோனின் ராஜ்யத்தையும் பாசானின் அரசனான ஓகின் ராஜ்யத்தையும் கொடுத்தார்—அதாவது, அதன் நகரங்களும் அவற்றின் எல்லைகளும் சுற்றியுள்ள நாட்டின் நகரங்களுமாகிய நாட்டை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாட்டையும், அதன் எல்லைகளோடு அதன் நகரங்களையும், சுற்றிலும் உள்ள நாட்டின் நகரங்களையும்.” இறுதி எபிரேயத் தொடர் இலக்கண ரீதியாகச் சுருக்கமாக அமைந்துள்ளது; எனவே ஒன்றுக்கொன்று நெருக்கமான பல மொழிபெயர்ப்புகள் சாத்தியமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן இங்கு நிலப்பகுதியை வழங்குவதைக் குறிக்கிறது; எளிய கதைநடையையும் நேரடியான பொருளையும் இது காக்கிறது.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: காதின் மக்களுக்கும் ரூபனின் மக்களுக்கும்
  rationale: בְּנֵי என்பதன் குடும்பத்தையும் கோத்திரத்தையும் சுட்டும் மரபுத்தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה בֶן יוֹסֵף
  choice: யோசேப்பின் மகனான மனாசேயின் அரைக் கோத்திரத்துக்கும்
  rationale: மனாசேயின் வம்ச அடையாளத்தையும் அரைக் கோத்திரம் என்ற அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מַמְלֶכֶת
  choice: அரசாட்சி
  rationale: இங்கு முன்னர் சீகோனும் ஓகும் ஆட்சி செய்த அரச எல்லையையும் ஆட்சிப் பரப்பையும் குறிக்கிறது; ‘அரசாட்சி’ அதன் அரசியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: எமோரியரின் அரசன் சீகோன்
  rationale: எபிரேயச் சொல்லமைப்பிலுள்ள அரசனின் பெயரையும் மக்கள் இன அடையாளத்தையும் நேரடியாகக் காக்கிறது.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: பாசானின் அரசன் ஓகு
  rationale: பெயர்–பட்டம் தொடர்பைத் தெளிவாக வெளிப்படுத்தும் நேரடி மொழிபெயர்ப்பு.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: முன்னர் குறிப்பிடப்பட்ட அரசாட்சிகளின் நிலப்பரப்பைச் சுட்டுவதால் ‘அந்த நாடு’ சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: לְעָרֶיהָ בִּגְבֻלֹת עָרֵי הָאָרֶץ סָבִיב
  choice: அதன் பட்டணங்களோடும் அவற்றின் எல்லைகளிலுள்ள சுற்றுப்புற நாட்டின் பட்டணங்களோடும்
  rationale: சுருக்கமாகவும் இலக்கணத் தெளிவின்றியும் அமைந்துள்ள எபிரேய இறுதித் தொடரின் நிலம்–பட்டணங்கள்–எல்லைகள் தொடர்பைத் தீர்மானமாக்காமல் வாசிக்கத்தக்க தமிழில் தருகிறது.
