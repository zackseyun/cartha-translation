  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கோத்திரப் பெயர்களும் இடப்பெயர்களும் பரவலான தமிழ் வேதாகம மரபுக்கு ஏற்ற வடிவங்களில் தரப்பட்டுள்ளன; எபிரேய இறுதித் தொடரின் உண்மையான தொடரியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
