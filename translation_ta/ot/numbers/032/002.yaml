lexical_decisions:
- source_word: בְנֵי־גָד / בְנֵי רְאוּבֵן
  choice: காதின் மகன்கள் / ரூபனின் மகன்கள்
  rationale: எபிரெய மொழியின் மரபுவழிப் பெயரிடலை நேரடியாகப் பாதுகாக்கிறது; இச்சூழலில் இவை கோத்திரத்தாரைக் குறிக்கின்றன.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள்
  rationale: נְשִׂיאִים என்பதன் தலைமைப் பொருளையும் עֵדָה என்பதன் ஒன்றுகூடிய இஸ்ரவேல் சமூகப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொன்னார்கள்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரை இயல்பான தமிழ் உரைநடையில் வெளிப்படுத்துகிறது.
