  text: 'காதின் மகன்களும் ரூபேனின் மகன்களும் வந்து, மோசேயிடமும் ஆசாரியனாகிய எலெயாசாரிடமும் சபையின் தலைவர்களிடமும் கூறினார்கள்:'
