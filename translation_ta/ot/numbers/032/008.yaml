  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் சரியாக உள்ளன: ‘உங்கள் தந்தையர்,’ ‘நான் அனுப்பியபோது,’ காதேஸ்-பர்னேயாவிலிருந்து, மற்றும் நாட்டைப் பார்க்கும் நோக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் “அவர்களும்” என்பதிலுள்ள “-உம்” மூலத்தில் இல்லாத ‘அவர்களும்/அவர்களும் கூட’ என்ற சேர்க்கை நிழலை உண்டாக்குகிறது. כֹּה-வின் ஒப்பீட்டு வலியுறுத்தலை ‘இப்படித்தான்’ ஏற்கெனவே துல்லியமாகத் தருகிறது.'
