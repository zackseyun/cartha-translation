translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘பார்க்க’ என்ற பொதுவான வினை முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழல் சார்ந்த குறிப்பான பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
