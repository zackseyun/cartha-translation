  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: ta
  text: நான் காதேஸ்-பர்னேயாவிலிருந்து நாட்டைப் பார்ப்பதற்காக[a] உங்கள் தந்தையரை அனுப்பியபோது, அவர்கள் இப்படித்தான் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டை ஆய்வு செய்வதற்காக” அல்லது “நாட்டை வேவுபார்ப்பதற்காக.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “பார்ப்பது”; இச்சூழலில் அது நாட்டைச் சுற்றிப்பார்த்து ஆராய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: இப்படித்தான்
  rationale: முந்தைய தலைமுறையின் செயலை இப்போதைய சூழ்நிலையுடன் ஒப்பிடும் சுட்டுப்பொருளையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: முடிந்துபோன முந்தைய செயலைக் குறிக்கும் எளிய இறந்தகால வடிவம்.
- source_word: אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையர்
  rationale: எபிரெயச் சொல்லின் நேரடியான தலைமுறை சார்ந்த பொருளைப் பாதுகாக்கிறது; இங்கு அது முந்தைய தலைமுறையினரைக் குறிக்கிறது.
- source_word: בְּשָׁלְחִי
  choice: நான் ... அனுப்பியபோது
  rationale: בְּ உடன் வரும் முதலாம் நபர் பின்னொட்டுடைய வினையெச்சக் கட்டமைப்பின் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: முந்தைய தலைமுறையினரைச் சுட்டும் நேரடி செயப்படுபொருள்; தமிழ்ச் சொற்றொடரில் மரியாதைப் பன்மையாக வருகிறது.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: காதேஸ்-பர்னேயாவிலிருந்து
  rationale: இடப்பெயரை ஒலிபெயர்த்து, מִן முன்னிடைச்சொல்லின் ‘இலிருந்து’ பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִרְאוֹת
  choice: பார்ப்பதற்காக
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘பார்’ என்பதை முதன்மை உரையில் காக்கிறது; சூழலில் நிலத்தை ஆராய்வது என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת הָאָרֶץ
  choice: நாட்டை
  rationale: הָאָרֶץ இங்கு அவர்கள் சென்று பார்வையிட வேண்டிய குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கிறது; நவீன தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
