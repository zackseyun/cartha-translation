  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: ta
  text: இதோ, உங்கள் தந்தையருக்குப் பதிலாக, பாவிகளான ஆண்களின் பெருக்கமாக நீங்கள் எழுந்திருக்கிறீர்கள்; இஸ்ரவேலுக்கு எதிரான யாவேயின் பற்றியெரியும் கோபத்தை[b] இன்னும் அதிகரிப்பதற்கு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெருக்கம்” என்பதற்கான எபிரெயச் சொல் “சந்ததி” அல்லது “பெருகிய கூட்டம்” என்றும் பொருள்படலாம். இங்குள்ள கண்டனத் தொனியையும் தலைமுறைத் தொடர்பையும் வெளிப்படுத்த “பெருக்கம்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “யாவேயின் மூக்கின் எரிச்சல்.” இது கடுமையான கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: மோசேயின் கண்டனத்தில் உள்ள கவன ஈர்ப்பையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: קַמְתֶּם
  choice: நீங்கள் எழும்பியிருக்கிறீர்கள்
  rationale: உடலளவில் எழுதல் என்ற சொல்லுருவத்தையும், முந்தைய தலைமுறையின் இடத்தில் புதிய தலைமுறை தோன்றியிருப்பது என்ற சூழல்சார் பொருளையும் தக்கவைக்கிறது.
- source_word: תַּחַת אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையருக்குப் பதிலாக
  rationale: இங்கு תַּחַת என்பது தலைமுறைத் தொடர்ச்சியில் ‘இடத்தில்/பதிலாக’ என்பதைக் குறிக்கிறது.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: பாவிகளான ஆண்களின் சந்ததியாக
  rationale: תַּרְבּוּת என்பதிலுள்ள சந்ததி அல்லது பெருக்கம் என்ற கருத்தையும், கண்டனத் தொனியையும் வெளிப்படுத்துகிறது; אֲנָשִׁים என்ற ஆண்பால் பன்மையும் தக்கவைக்கப்படுகிறது.
- source_word: לִסְפּוֹת עוֹד
  choice: இன்னும் அதிகமாக்கும்படி
  rationale: ஏற்கெனவே உள்ள கோபத்தோடு மேலும் சேர்த்தல் அல்லது அதை அதிகரித்தல் என்ற தொடர்ச்சியான தீவிரத்தை இயல்பாகக் கூறுகிறது.
- source_word: עַל חֲרוֹן אַף
  choice: பற்றியெரியும் கோபத்தை
  rationale: எபிரெய மொழியின் ‘மூக்கு எரிதல்’ என்ற தீவிரக் கோப மரபுத்தொடரின் எரியும் உருவகத்தைத் தமிழில் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல், எபிரெயத் திருப்பெயரான יהוה-ஐத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிரான
  rationale: கோபம் செலுத்தப்படும் இலக்கைத் தமிழில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אֲנָשִׁים חַטָּאִים என்பதிலுள்ள பாலினக் குறிப்பு
  choice: பாவிகளான ஆண்கள்
  alternative: பாவிகளான மக்கள்
  rationale: மூலம் ஆண்பால் பன்மையைப் பயன்படுத்துவதோடு, சூழலில் கோத்திரங்களின் ஆண்களே நேரடியாகப் பேசப்படுகிறார்கள்; எனவே பாலினக் குறிப்பைத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதவசனத்திற்கேற்ற கண்ணியமான கண்டனத் தொனியுடனும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ மற்றும் ‘எழும்பியிருக்கிறீர்கள்’ ஆகியவை மூலத்தின் வாக்குவன்மையைத் தக்கவைக்கின்றன; தெளிவுக்காக வாக்கிய உறுப்புகள் தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டுள்ளன.
