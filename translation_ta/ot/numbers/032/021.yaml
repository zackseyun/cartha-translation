source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: ta
  text: உங்களில் ஆயுதம் ஏந்திய ஒவ்வொருவனும் யோர்தானை யாவேக்கு முன்பாகக் கடந்து, அவர் தம் எதிரிகளைத் தம் முன்னிலையிலிருந்து துரத்திவிடும்வரை[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தம் எதிரிகளைத் தம் முன்னிலையிலிருந்து உடைமையிலிருந்து அகற்றும்வரை.” எபிரெய வினைச்சொல் “துரத்திவிடுதல்” அல்லது “உடைமையிலிருந்து அகற்றுதல்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்,” “தம்” ஆகிய சுட்டுகள் இயல்பாக யாவேயைக் குறிக்கின்றன. ஆனால் அவை இஸ்ரவேலரின் படையையோ ஆயுதம் ஏந்தியவர்களையோ கூட்டாகக் குறிப்பதாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: கடந்து ... சென்று
  rationale: முந்தைய வசனத்தில் தொடங்கிய நிபந்தனையின் தொடர்ச்சியாக, இந்த வினை எதிர்கால நிபந்தனைப் பொருளைக் கொண்டுள்ளது. தமிழில் வாக்கியத் தொடரை இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לָכֶם כָּל חָלוּץ
  choice: உங்களில் ஆயுதம் ஏந்திய ஒவ்வொருவனும்
  rationale: לָכֶם இங்கு அழைக்கப்படும் கோத்திரத்தாரில் உள்ளவர்களைக் குறிக்கிறது; חָלוּץ போருக்காக ஆயத்தமாகி ஆயுதம் ஏந்திய ஒருவனைக் குறிக்கிறது. כָּל என்பதன் தனித்தனி நபரை உள்ளடக்கும் வலிமையை ‘ஒவ்வொருவனும்’ காக்கிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானைக்
  rationale: ஆற்றின் வழக்கமான தமிழ்ப் பெயர் பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘ஆறு’ என்பதைக் கூட்டத் தேவையில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ஒருவரின் முன்னிலையில் அல்லது முன்பாக இருப்பதைக் குறிக்கிறது. யாவே என்ற உடன்படிக்கைப் பெயர் நேரடியாகப் பெயர்க்கப்பட்டுள்ளது.
- source_word: עַד
  choice: வரை
  rationale: செயல் நீடிக்கும் கால எல்லையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הוֹרִישׁוֹ
  choice: அவர் ... துரத்திவிடும்
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் இங்கு எதிரிகளை வெளியேற்றுதல் அல்லது அவர்களுடைய உடைமையிலிருந்து அகற்றுதல் என்ற பொருளைத் தருகிறது. ‘துரத்திவிடும்’ என்பது தெளிவான நவீனத் தமிழ்; ‘உரிமையிழக்கச் செய்வது’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֹיְבָיו מִפָּנָיו
  choice: தமது எதிரிகளைத் தமக்கு முன்பாக இருந்து
  rationale: மூலத்தின் இரு மூன்றாம் நபர் ஆண்பால் ஒருமை உருபுகளையும் ஒரே எழுவாயோடு இணைக்க ‘தமது/தமக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘முன்பாக இருந்து’ என்பது פָּנִים சார்ந்த மூல உருவகத்தை இயன்றவரை காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் நான்கு எழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ தரப்பட்டுள்ளது.
- issue: הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו என்பவற்றிலுள்ள மூன்றாம் நபர் ஒருமைச் சுட்டுகளின் குறிப்பு
  choice: அவை யாவேயைக் குறிக்கின்றன
  alternative: அவை இஸ்ரவேல் மக்களையோ ஆயுதம் ஏந்திய படையினரையோ கூட்டாகக் குறிக்கின்றன
  rationale: ‘யாவேக்கு முன்பாக’ என்ற உடனடியான சொற்றொடரும், யாவே எதிரிகளைத் துரத்தும் வெற்றிப்போர் மொழிநடையும், யாவேதான் இயல்பான முன்னிலைக் குறிப்பு என்பதைக் காட்டுகின்றன. எனினும் மாற்று இலக்கணப் புரிதல் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நடை நவீன, தெளிவான, மரியாதைமிக்க பொதுத் தமிழில் உள்ளது. வசனம் முந்தைய வசனத்தில் தொடங்கும் நிபந்தனை வாக்கியத்தின் தொடராக இருப்பதால், நிறைவுறாத தொடரமைப்பும் இறுதிக் காற்புள்ளியும் காக்கப்பட்டுள்ளன. ‘ஆயுதம் ஏந்திய’ என்பது இராணுவச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது; தேவையற்ற விளக்கச் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
