  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: ta
  text: 'அந்த நாளில் யாவேயின்[a] கோபம் பற்றியெரிந்தது; அவர் இவ்வாறு சத்தியம் செய்தார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் பற்றியெரிந்தது
  rationale: חרה உடன் אף சேர்ந்த எபிரெய மரபுத்தொடர் கோபம் சூடாகுதல் அல்லது எரிதல் என்ற உருவகத்தைக் கொண்டது. ‘கோபம் பற்றியெரிந்தது’ என்பது அந்த உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: கதைச்சூழலில் குறிப்பிட்ட நாளைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டார்
  rationale: שבע என்பதன் நிஃபால் வடிவம் சத்தியம் செய்தல் அல்லது ஆணையிடுதல் என்று பொருள்படும். இங்கு இறைவன் தம்மை உறுதிப்படுத்தி உரைப்பதை ‘ஆணையிட்டார்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: அடுத்த வசனத்தில் வரும் ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பை, தமிழில் தொடர்ச்சியான மேற்கோளை இயல்பாகத் தொடங்கும் வகையில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; மற்ற வழக்குகளைக் குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. மூலத்தின் கோபம் எரியும் உருவகமும், அடுத்த வசனத்திற்குள் தொடரும் ஆணைமொழியும் காக்கப்பட்டுள்ளன.
