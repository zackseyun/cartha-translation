  text: וְ/אֶת נְב֞וֹ וְ/אֶת בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְ/אֶת שִׂבְמָ֑ה וַ/יִּקְרְא֣וּ בְ/שֵׁמֹ֔ת אֶת שְׁמ֥וֹת הֶ/עָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: ta
  text: நேபோவையும்[a], பாகால்-மேயோனையும் (அவற்றின் பெயர்கள் மாற்றப்பட்டிருந்தன), சிப்மாவையும் கட்டினார்கள். தாங்கள் கட்டிய நகரங்களுக்குப் பெயர்களிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெயர்கள் மாற்றப்பட்ட நிலையில்” அல்லது “அவற்றின் பெயர்கள் மாற்றப்பட்டிருந்தன” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொற்றொடர் நேபோ, பாகால்-மேயோன் ஆகியவற்றின் பெயர்கள் மாற்றப்பட்டதைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: நேபோ
  rationale: இடப்பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּעַל מְעוֹן
  choice: பாகால்-மேயோன்
  rationale: கூட்டு இடப்பெயரின் இரு கூறுகளையும் தெளிவாகக் காட்ட இணைப்புக்குறியுடன் ஒலிபெயர்க்கப்பட்டது.
- source_word: מוּסַבֹּת שֵׁם
  choice: அவற்றின் பெயர்கள் மாற்றப்பட்டன
  rationale: சுற்றிலும் அல்லது மாற்றப்படுதல் என்ற செயலற்ற, விளைவுநிலைக் கருத்தைத் தரும் சொற்றொடர்; அருகிலுள்ள நேபோ, பாகால்-மேயோன் ஆகிய பெயர்களைக் கூட்டாகக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டது. எபிரெயத் தொடரின் தொடர்பில் ஓரளவு தெளிவின்மை இருப்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டது.
- source_word: שִׂבְמָה
  choice: சிப்மா
  rationale: இடப்பெயர் என்பதால் எபிரெய மெய்யொலிகளுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: பெயர்களிட்டார்கள்
  rationale: பெயரிடும் சூழலில் ‘பெயர்களால் அழைத்தார்கள்’ என்பதைக் காட்டிலும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: நகரங்களுக்குப் பெயர்கள்
  rationale: எபிரெயத்தில் சொற்படியாக ‘நகரங்களின் பெயர்களை’ என்றிருந்தாலும், தமிழில் பெயரிடும் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בָּנוּ
  choice: தாங்கள் கட்டிய
  rationale: בנה என்பதன் வழக்கமான பொருளான ‘கட்டு’ பாதுகாக்கப்பட்டது; சூழல் மறுகட்டுதலைக் குறிக்கக்கூடும் என்றாலும் அது உரையில் வெளிப்படையாக இல்லை.
