base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: ta
  text: மனாசேயின் மகன் யாயீர் சென்று, அவர்களுடைய குடியிருப்புகளைக் கைப்பற்றி, அவற்றுக்கு ஹவ்வோத்-யாயீர் என்று பெயரிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஹவ்வோத்-யாயீர்” என்பதற்கு “யாயீரின் குடியிருப்புகள்” அல்லது “யாயீரின் சிற்றூர்கள்” என்று பொருள்.
    reason: இடப்பெயரான ஹவ்வோத்-யாயீரின் எபிரேய சொற்பொருளையும் சாத்தியமான தமிழ் இணைகளையும் விளக்குகிறது.
lexical_decisions:
- source_word: יָאִיר
  choice: யாவீர்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகன்
  rationale: எபிரேய கட்டமைப்பின் நேரடிப் பொருளான ‘மனாசேயின் மகன்’ என்பதைக் காக்கிறது; ‘வழிவந்தவன்’ என்ற சாத்தியத்தைத் தேவையின்றி முதன்மை உரையில் புகுத்தவில்லை.
- source_word: הָלַךְ
  choice: சென்று
  rationale: கதைத் தொடரில் வரும் வினையை நவீனத் தமிழில் இயல்பாக இணைக்கிறது; திசையையோ நோக்கத்தையோ கூடுதலாக ஊகிக்கவில்லை.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றி
  rationale: இராணுவ அல்லது நிலப்பகுதி சூழலில் לכד குறிக்கும் பிடித்தல் அல்லது வசப்படுத்துதல் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: חַוֺּתֵיהֶם
  choice: அவர்களுடைய குடியிருப்புகள்
  rationale: சிறிய, மதிலற்ற ஊர்கள் அல்லது குடியேற்றங்களைக் குறிக்கும் சொல்லுக்கு ‘குடியிருப்புகள்’ என்பது இயல்பான விரிவுடைய தமிழ் இணை; ‘கிராமங்கள்’ என்பதைக் காட்டிலும் சொல்லின் பொருள் வரம்பை நன்கு காக்கிறது.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: அவற்றுக்கு ... என்று பெயரிட்டான்
  rationale: பெயரிடும் சூழலில் קרא என்பதன் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: חַוֺּת יָאִיר
  choice: அவ்வோத்-யாவீர்
  rationale: இது ஒரு இடப்பெயராகச் செயல்படுவதால் முதன்மை உரையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது; அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
