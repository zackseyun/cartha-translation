revisions:
- from: ஆயுதம் தரித்தவர்களாக நாங்களே யாவேக்கு முன்பாகக் கானான் நாட்டிற்குள் கடந்து செல்வோம்; யோர்தானின் இக்கரையில்[a] எங்கள் பரம்பரைச் சொத்தான நிலப்பங்கு எங்களோடு இருக்கும்.
