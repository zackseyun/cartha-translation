id: NUM.32.32
reference: Numbers 32:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: ta
  text: ஆயுதம் தரித்தவர்களாக நாங்களே யாவேக்கு முன்பாகக் கானான் நாட்டிற்குள் கடந்து செல்வோம்; யோர்தானின் இக்கரையில்[a] எங்கள் மரபுரிமையான நிலப்பங்கு எங்களிடமே இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோர்தானுக்கு அப்பால்’ அல்லது ‘யோர்தானின் மறுகரையில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடரின் பொருள் பேசுபவரின் பார்வைநிலையைச் சார்ந்தது; இங்கு பேசுகிறவர்கள் ஆற்றின் கிழக்குப் பகுதியில் இருப்பதால் ‘இக்கரையில்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: நாங்களே
  rationale: தனித்துப் பயன்படுத்தப்பட்டுள்ள முதலாம் நபர் பன்மைப் பெயர்ச்சொல் வினைச்சொல்லில் ஏற்கெனவே உள்ள எழுவாயை வலியுறுத்துகிறது; ‘நாங்களே’ அந்த அழுத்தத்தை இயல்பாகக் காக்கிறது.
- source_word: נַעֲבֹר
  choice: கடந்து செல்வோம்
  rationale: עבר என்பதன் Qal முற்றுப்பெறாத வடிவம் இங்கு யோர்தானைக் கடப்பதற்கான எதிர்கால உறுதிமொழியைக் குறிக்கிறது.
- source_word: חֲלוּצִים
  choice: ஆயுதம் தரித்தவர்களாக
  rationale: இராணுவச் சூழலில் போருக்குத் தயாராக ஆயுதம் ஏந்தியிருப்பதைக் குறிக்கிறது; தமிழ் வாசகருக்கு பொருள் தெளிவாக இருக்க இவ்வாறு விரிவாக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/திருமுன்’ என்ற இட-உறவுப் பொருளையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிற்குள்
  rationale: ‘கடந்து செல்வோம்’ என்ற இயக்க வினையின் இலக்கைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘நாட்டிற்குள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאִתָּנוּ
  choice: எங்களோடு இருக்கும்
  rationale: எபிரெயில் வினையில்லாத தொடராக உள்ளது; முன் வரும் எதிர்கால உறுதிமொழிக்கு ஏற்றவாறு தமிழில் ‘இருக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: எங்கள் பரம்பரைச் சொத்தான நிலப்பங்கு
  rationale: אֲחֻזָּה என்பதிலுள்ள உடைமை/நிலப்பங்கு கருத்தையும் נַחֲלָה என்பதிலுள்ள பரம்பரை உரிமைக் கருத்தையும் இயல்பான தமிழில் ஒன்றிணைக்கிறது.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: யோர்தானின் இக்கரையில்
  rationale: இத்தொடர் பார்வைநிலையைச் சார்ந்தது. பேசுகிறவர்கள் யோர்தானுக்குக் கிழக்கே இருந்து அங்குள்ள தங்கள் பங்கைச் சுட்டுவதால் ‘இக்கரையில்’ சூழலுக்கு ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: ‘யாவேக்கு முன்பாக’ என்பதன் பொருள்
  choice: மூலத்தின் இட-உறவு மொழியை அப்படியே காத்தல்
  alternative: யாவேயின் முன்னிலையில்; யாவேயின் தலைமையில்
  rationale: இச்சொற்றொடரில் உடன்படிக்கை மற்றும் இறையியல் வலிமை இருக்கலாம்; ஆனால் ‘முன்னிலையில்’ அல்லது ‘தலைமையில்’ எனத் தீர்மானமாக விளக்காமல் மூலத்தின் பொருள் திறப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரம்பரைச் சொத்தான நிலப்பங்கு’ என்பது சட்ட/நில உரிமை சார்ந்த இரட்டை எபிரெயக் கருத்தையும் மிகக் கடினமான சொற்றொடராகாமல் காக்கிறது.
