revisions:
- from: உங்கள் சிறுவர்களுக்காக நகரங்களையும், உங்கள் மந்தைகளுக்காக அடைப்புகளையும்[b] கட்டுங்கள்; உங்கள் வாயிலிருந்து புறப்பட்டதைச் செய்யுங்கள்[a].
  to: உங்களுக்காக, உங்கள் சிறு பிள்ளைகளுக்கான நகரங்களையும் உங்கள் மந்தைகளுக்கான வேலியிட்ட இடங்களையும் கட்டுங்கள்[b]; உங்கள் வாயிலிருந்து புறப்பட்டதைச் செய்யுங்கள்[a].
  rationale: The revision restores the force of לָכֶם, uses an inclusive Tamil expression for טַף, and clarifies that the enclosures are fenced livestock spaces. It retains the Hebrew mouth idiom and its explanatory footnote, without introducing interpretive or doctrinal expansion.
