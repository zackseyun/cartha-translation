base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: ta
  text: உங்களுக்காக, உங்கள் சிறு பிள்ளைகளுக்கான நகரங்களையும் உங்கள் மந்தைகளுக்கான வேலியிட்ட இடங்களையும் கட்டுங்கள்[b]; உங்கள் வாயிலிருந்து புறப்பட்டதைச் செய்யுங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “நீங்கள் வாக்குக் கொடுத்ததை நிறைவேற்றுங்கள்.” “உங்கள் வாயிலிருந்து புறப்பட்டது” என்பது தாம் கூறியதை நிறைவேற்றுவதைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
  - marker: b
    text: “வேலியிட்ட இடங்கள்” என்பதை மந்தைகளுக்கான “பட்டிகள்” அல்லது “தொழுவங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ לָכֶם
  choice: கட்டுங்கள்
  rationale: בְּנוּ என்பது பன்மை கட்டளை வினை. לָכֶם தரும் பயன்நோக்குப் பொருள் அடுத்துள்ள ‘உங்கள் சிறுவர்களுக்காக’ மற்றும் ‘உங்கள் மந்தைகளுக்காக’ என்பவற்றில் இயல்பாக வெளிப்படுவதால், தமிழில் தனியே ‘உங்களுக்காக’ என்று சேர்த்து சுமையாக்கவில்லை.
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: עִיר என்பது நகரம் அல்லது ஊரைக் குறிக்கலாம்; இங்கு குடியேற்றச் சூழலில் ‘நகரங்கள்’ நேரடியான, வழக்கமான பொருத்தம்.
- source_word: טַפְּכֶם
  choice: உங்கள் சிறுவர்கள்
  rationale: טַף முதன்மையாக குடும்பங்களிலுள்ள சிறு பிள்ளைகளைக் குறிக்கிறது. ‘சிறுவர்கள்’ அதன் உறுதியான குடும்பப் பொருளைப் பேணுகிறது; ‘சார்ந்திருப்போர்’ என்பது தேவையற்ற அளவு விரிவானது.
- source_word: גְדֵרֹת
  choice: அடைப்புகள்
  rationale: גְדֵרֹת என்பது மந்தைகளைப் பாதுகாக்க வேலியிடப்பட்ட இடங்கள். ‘அடைப்புகள்’ அதன் அமைப்பையும் பயன்பாட்டையும் பொதுவாகக் காட்டுகிறது; ‘தொழுவங்கள்’ மூடப்பட்ட கட்டடங்கள் என்ற குறுகிய எண்ணத்தைத் தரக்கூடும்.
- source_word: צֹנַאֲכֶם
  choice: உங்கள் மந்தைகள்
  rationale: צֹאן என்பது குறிப்பாக செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறுகால்நடைகளின் கூட்டுப் பெயர். சூழலில் ‘மந்தைகள்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: הַיֹּצֵא מִפִּיכֶם
  choice: உங்கள் வாயிலிருந்து புறப்பட்டது
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தைப் பேணி, அவர்கள் கூறிய உறுதிமொழியைக் குறிக்கும் மொழிவழக்கை நேரடியாக வைத்திருக்கிறது.
- source_word: תַּעֲשׂוּ
  choice: செய்யுங்கள்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருளான ‘செய்’ இங்கே சுருக்கமாகவும் நேரடியாகவும் உள்ளது; முந்தைய சொற்றொடருடன் சேர்ந்து கூறியதை நிறைவேற்றுதல் என்ற பொருளை அளிக்கிறது.
theological_decisions:
- issue: வாயால் கூறிய உறுதிமொழியை நிறைவேற்றுதல்
  choice: ‘உங்கள் வாயிலிருந்து புறப்பட்டதைச் செய்யுங்கள்’ என்ற எபிரெய உருவகம் பேணப்பட்டது.
  alternative: ‘நீங்கள் வாக்குக் கொடுத்ததை நிறைவேற்றுங்கள்.’
  rationale: மாற்றுப் பொருள் சூழலைத் தெளிவாக்கினாலும், மூலத்தின் உடலுறுப்புச் சார்ந்த வலுவான மொழிவழக்கை விளக்கமாக மாற்றிவிடும். நேரடி உருவகமும் அதன் உறுதிமொழிப் பொருளும் அடிக்குறிப்பின் மூலம் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இணை அமைப்பும் ‘வாயிலிருந்து புறப்பட்டது’ என்ற உண்மையான மொழிவழக்கும் பேணப்பட்டுள்ளன; அரிதாகத் தோன்றக்கூடிய சொற்களுக்கு அடிக்குறிப்புகள் தரப்பட்டுள்ளன.
