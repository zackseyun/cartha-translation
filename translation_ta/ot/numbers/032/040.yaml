source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ אֶת הַ/גִּלְעָ֔ד לְ/מָכִ֖יר בֶּן מְנַשֶּׁ֑ה וַ/יֵּ֖שֶׁב בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: ta
  text: மோசே கிலேயாத்தை மனாசேயின் மகனாகிய மாகீருக்குக் கொடுத்தார்; அவன் அதில் குடியேறினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில் வாழ்ந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடுத்தார்’; நிர்வாக ஒதுக்கீடு என்ற கூடுதல் நுணுக்கத்தைச் சேர்க்காமல் எபிரெய வினையின் எளிய வலிமையைப் பேணுகிறது.
- source_word: הַגִּלְעָד
  choice: கிலேயாத்தை
  rationale: இது நிலப்பகுதியின் பெயர். தமிழில் இயல்பாக இடப்பெயரை நேரடி செயப்படுபொருளாக வழங்குகிறது.
- source_word: לְמָכִיר
  choice: மாகீருக்கு
  rationale: לְ இங்கு பெறுநரைக் குறிக்கிறது; ‘மாகீருக்கு’ என்பது நேரடியும் இயல்புமான தமிழ் வடிவம்.
- source_word: בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகனாகிய
  rationale: בֶּן என்பதன் இயல்பான பொருள் ‘மகன்’; இவ்வசனம் ‘வம்சத்தான்’ என்று விரிவுபடுத்த வேண்டிய கட்டாயத்தை அளிக்கவில்லை.
- source_word: וַיֵּשֶׁב
  choice: குடியேறினான்
  rationale: ישׁב என்பது ‘வாழ்தல், குடியிருத்தல், குடியேறுதல்’ எனப் பொருள்படும். நிலம் வழங்கப்படும் இச்சூழலில் அங்கு வசிப்பை நிறுவியதைக் ‘குடியேறினான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּהּ
  choice: அதில்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் கூறப்பட்ட கிலேயாத் நிலப்பகுதியைச் சுட்டுகிறது; தமிழில் ‘அதில்’ அந்தத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய உரையின் தொடர்ச்சியான கதைநடையை இயல்பான தமிழ் வாக்கியமாக வழங்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; ஆண்பால் ஒருமை வினை வடிவங்கள் மூலத்தின் இலக்கண எண்ணைத் தக்கவைக்கின்றன.
