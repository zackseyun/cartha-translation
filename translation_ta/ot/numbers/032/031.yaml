source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: ta
  text: 'அப்போது காதின் மகன்களும் ரூபனின் மகன்களும் பதிலளித்துக் கூறினார்கள்: “யாவே உமது ஊழியர்களிடம் சொன்னபடியே நாங்கள் செய்வோம்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உமது ஊழியர்களிடம் சொன்னதையே நாங்கள் செய்வோம்.”
    reason: אֵת אֲשֶׁר ... כֵּן என்ற தொடர்பை ‘சொன்னபடியே’ என்ற ஒப்புமைத் தொடராகவும், ‘சொன்னதையே’ என்ற உள்ளடக்கத்தை வலியுறுத்தும் தொடராகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: மறுமொழியாக ... என்றார்கள்
  rationale: ענה என்ற வினை இக்கதைச் சூழலில் முன்பு கூறப்பட்டதற்கான பதிலை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நேரடி உரை அமைப்புக்காக ‘மறுமொழியாக ... என்றார்கள்’ என வழங்கப்பட்டது.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: காதின் மகன்களும் ரூபனின் மகன்களும்
  rationale: இரு பெயர்களுடனும் வரும் בְּנֵי என்ற ‘மகன்கள்’ கட்டமைப்பை வெளிப்படையாகப் பாதுகாக்கிறது; இனக்குழுப் பெயர்களாக மாற்றவில்லை.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: எபிரெய மொழியில் இது உரையை அறிமுகப்படுத்தும் வடிவம். ‘மறுமொழியாக’ என்பதுடன் சேர்ந்து தமிழில் இயல்பான மேற்கோள் முடிப்பு வினையாக வழங்கப்பட்டுள்ளது.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: சொன்னபடியே
  rationale: ‘எதை/எவ்வாறு ... அதையே/அவ்வாறே’ என்ற தொடர்பிணைப்பை தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: דִּבֶּר
  choice: சொன்ன
  rationale: முன்னதாகக் கூறப்பட்ட, இப்போதும் பொருந்தும் உரையைக் குறிக்கிறது; தமிழில் கால உறவு சூழலிலேயே தெளிவாக இருப்பதால் ‘சொன்ன’ இயல்பானது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: אֶל עֲבָדֶיךָ
  choice: உமது ஊழியர்களிடம்
  rationale: பேசுகிறவர்கள் மோசேயிடம் தங்களைத் தாழ்மையுடன் குறிப்பிடும் மரியாதைச் சொற்றொடர்; இங்கு அடிமைநிலையை விட பணிவான சுயக்குறிப்பே முன்னிலைப்படுகிறது.
- source_word: נַעֲשֶׂה
  choice: நாங்கள் செய்வோம்
  rationale: கட்டளையை நிறைவேற்றுவதாகிய உறுதியை, மூலத்தில் இல்லாத தனிப்பட்ட செயப்படுபொருளைச் சேர்க்காமல் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரை ஒரு தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டமான ‘கர்த்தர்’ என்பதைக் காட்டிலும் தனிப்பெயரைப் பாதுகாக்கப்பட்டது; தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கண்ணியமும் கொண்ட எளிய நடையில் வடிவமைக்கப்பட்டது. ‘உமது’ என்பது மோசேயை நோக்கிய ஒருமை மரியாதையையும், ‘ஊழியர்கள்’ பேசுகிறவர்களின் பணிவான சுயக்குறிப்பையும் காக்கிறது.
