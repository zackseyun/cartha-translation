base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: ta
  text: ஆனால் நாங்களோ விரைவாக ஆயுதம் ஏந்தி இஸ்ரவேல் மக்களுக்கு முன்பாக[a] செல்வோம்; அவர்களை அவர்களுடைய இடத்திற்குக் கொண்டுசேர்க்கும்வரை. நாட்டில் குடியிருப்பவர்களால், எங்கள் சிறுபிள்ளைகள்[b] அரண்செய்யப்பட்ட நகரங்களில் தங்கியிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் மக்களுக்கு முன்பாக” என்பது எபிரெயத்தில் சொல்லுக்குச் சொல் இவ்வாறே உள்ளது; போர்ச் சூழலில், இஸ்ரவேலருக்குமுன் முன்னணியில் செல்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சிறுபிள்ளைகள்” என்பதற்கான எபிரெயச் சொல் குழந்தைகளையும் குடும்பத்தின் பிற சார்புடையவர்களையும் உள்ளடக்கக்கூடியது.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: போருக்குத் தயாராகி
  rationale: நிஃபால் வடிவம் இச்சூழலில் தங்களைப் போருக்கு ஆயத்தப்படுத்திக்கொள்வதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: חֻשִׁים
  choice: விரைந்து
  rationale: இந்த வினையடை வேகம் அல்லது உடனடி ஆயத்தத்தைக் குறிக்கலாம். முந்தைய சொல் போருக்கான ஆயத்தத்தை ஏற்கெனவே கூறுவதால், இதை ‘விரைந்து’ எனத் தனியே மொழிபெயர்ப்பது மீளுரையைத் தவிர்க்கிறது.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு முன்னால்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான இடப்பொருளைப் பாதுகாக்கிறது; போர்ச் சூழலில் படைக்கு முன்னணியில் செல்வதையும் குறிக்கக்கூடும்.
- source_word: עַד אֲשֶׁר אִם
  choice: கொண்டுசேர்க்கும்வரை
  rationale: செயலின் முடிவெல்லையைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் ‘வரை’ என்று வழங்குகிறது.
- source_word: הֲבִיאֹנֻם אֶל מְקוֹמָם
  choice: அவர்களை அவர்களுடைய இடத்திற்குக் கொண்டுசேர்க்க
  rationale: ஹிஃபில் வடிவத்தின் ‘வரச்செய்தல்/கொண்டுவருதல்’ பொருளையும், יעדத்தைச் சென்றடையச் செய்வதையும் தெளிவாகக் காட்டுகிறது; ‘இடம்’ என்ற மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: எங்கள் குழந்தைகளும் எங்களைச் சார்ந்தவர்களும் தங்கியிருப்பார்கள்
  rationale: טַף என்பது குழந்தைகளை மட்டுமல்லாமல் குடும்பத்தின் சார்பிலுள்ளவர்களையும் உள்ளடக்கக்கூடிய கூட்டுப்பெயர்; தமிழில் அதன் பரந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: அரண்செய்யப்பட்ட நகரங்களில்
  rationale: பாதுகாப்பு அரண்களைக் கொண்ட நகரங்கள் என்ற கட்டமைப்பைத் துல்லியமாகவும் நவீன தமிழிலும் வழங்குகிறது.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: நாட்டில் குடியிருப்பவர்களால் ஆபத்து இருப்பதால்
  rationale: מִפְּנֵי இங்கு அவர்களிடமிருந்து வரும் அச்சுறுத்தலின் காரணமாகப் பாதுகாப்பான நகரங்களில் தங்குவதைச் சுட்டுகிறது; தமிழில் காரணத்தையும் பாதுகாப்புச் சூழலையும் வெளிப்படையாகக் காட்டுகிறது.
