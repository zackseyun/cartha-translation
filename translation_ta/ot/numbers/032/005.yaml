source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: ta
  text: அவர்கள், “உமது பார்வையில் எங்களுக்குத் தயவு கிடைத்திருந்தால், இந்த நிலம் உமது பணியாளர்களுக்கு உடைமையாகக் கொடுக்கப்படட்டும். எங்களை யோர்தானைக் கடக்கச் செய்யாதீர்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை யோர்தானுக்கு அப்பால் அழைத்துச் செல்லாதீர்.” எபிரேய வினைச்சொல் காரணவினை வடிவில் இருப்பதால், நெருக்கமான பல விதங்களில் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எங்களுக்குத் தயவு கிடைத்திருந்தால்
  rationale: எபிரேய மரபுத்தொடரின் சாதகமான ஏற்றுக்கொள்ளுதலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘கிருபை’ என்று இறையியல் பொருளைத் தேவையின்றி ஏற்றவில்லை.
- source_word: יֻתַּן
  choice: கொடுக்கப்படட்டும்
  rationale: செயப்பாட்டு வடிவத்தையும் பணிவான வேண்டுகோளின் நுணுக்கத்தையும் காக்கிறது.
- source_word: הָאָרֶץ הַזֹּאת
  choice: இந்த நிலம்
  rationale: இங்கு பிரதேசத்தைக் குறிக்கும் אֶרֶץ என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: לַעֲבָדֶיךָ
  choice: உமது பணியாளர்களுக்கு
  rationale: மோசேயிடம் பணிவுடன் தங்களைக் குறிப்பிடும் சூழலை வெளிப்படுத்துகிறது; இங்கு ‘அடிமைகள்’ என்பது தேவையற்ற சமூக-சட்ட நுணுக்கத்தை முன்வைக்கும்.
- source_word: לַאֲחֻזָּה
  choice: உடைமையாக
  rationale: நிலையான நிலவுடைமை என்ற கருத்தைத் தெளிவாகக் காட்டுகிறது; ‘சுதந்தரம்’ என்று பொருளை விரிவாக்கவில்லை.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: எங்களை யோர்தானைக் கடக்கச் செய்யாதீர்
  rationale: עבר என்பதன் ஹிஃபீல் காரணவினை வடிவத்தை வெளிப்படையாகக் காக்கிறது.
