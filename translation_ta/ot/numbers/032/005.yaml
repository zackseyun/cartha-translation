translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. மோசேயை நோக்கிய மரியாதை ஒருமை வடிவங்களான ‘உமது’, ‘செய்யாதீர்’ பயன்படுத்தப்பட்டுள்ளன; காரணவினையின் தெளிவும் பணிவான வேண்டுகோளும் காக்கப்பட்டுள்ளன.
