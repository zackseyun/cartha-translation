  text: and Atroth-shophan[a], and Jazer, and Jogbehah.
translation:
  language: ta
  text: அதரோத்-சோப்பான்[a], யாசேர், யொக்பெகா ஆகியவற்றையும் கட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதாரோத்-சோப்பான்’ என்றும் எழுதலாம். எபிரெயத்தில் இது இரண்டு கூறுகளைக் கொண்ட ஓர் இடப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆகியவற்றையும்
  rationale: வְ இணைப்பையும், אֶת நேரடி செயப்படுபொருள் குறியீட்டையும் முந்தைய வசனத்தின் வினையோடு இயல்பாக இணைக்க ‘ஆகியவற்றையும்’ என வழங்கப்பட்டுள்ளது; אֶת தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: עַטְרֹת שׁוֹפָן
  choice: அதரோத்-சோப்பான்
  rationale: இது கூட்டுப் பெயராக அமைந்த இடப்பெயர்; பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יַעְזֵר
  choice: யாசேர்
  rationale: இடப்பெயர் என்பதால், எபிரெய ஒலிப்பைத் தமிழில் இயல்பாகக் காட்டும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָגְבֳּהָה
  choice: யொக்பெகா
  rationale: இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரெய மெய்யெழுத்துகளையும் உயிரொலிகளையும் தமிழில் சாத்தியமான அளவு பிரதிபலிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்கவும் எளிதில் புரிந்துகொள்ளத்தக்கவுமான நடை. மூலத்தில் இவ்வசனம் முந்தைய வசனத்தின் வினையைத் தொடரும் இடப்பெயர்ப் பட்டியல் மட்டுமே; தமிழில் தனி வசனமாக இயல்பாக வாசிக்க ‘கட்டினார்கள்’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
