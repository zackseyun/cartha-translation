translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ரூபனின் மகன்கள்’ என்பது எபிரெயச் சொற்றொடரின் நேரடி வம்ச வடிவத்தைப் பாதுகாக்கிறது; இயல்பான இனக்குழுப் பெயரான ‘ரூபனியர்கள்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. இடப்பெயர்கள் மூல எபிரெய ஒலியை அடிப்படையாகக் கொண்டு எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
