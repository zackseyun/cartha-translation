  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: ta
  text: ரூபனின் மகன்கள் எஸ்போன்[a], எலெயாலே, கிரியத்தாயிம் ஆகிய நகரங்களைக் கட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரூபனியர்கள் எஸ்போன், எலெயாலே, கிரியத்தாயிம் ஆகிய நகரங்களைக் கட்டினார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: ரூபனின் மகன்கள்
  rationale: בְנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; கோத்திரப் பெயருடன் வருவதால் ரூபனின் வழிவந்தோரைக் குறிக்கிறது. எபிரெய வடிவத்தையும் வம்சத் தொடர்பையும் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בָּנוּ
  choice: கட்டினார்கள்
  rationale: בנה வினையின் கால் முற்றுவினை பொதுவாக ‘கட்டினார்கள்’ என்று பொருள்படும். இச்சூழலில் மீண்டும் கட்டுதல் அல்லது நகரங்களை நிலைநிறுத்துதல் உட்பொருளாக இருக்கலாம்; ஆனால் அவற்றை உரையில் வெளிப்படையாகச் சேர்க்காமல் அடிப்படைப் பொருள் காக்கப்பட்டது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் தனிச் சொல்லாக மொழிபெயர்க்காமல் ‘-ஐ’ வேற்றுமையுருபும் இயல்பான வாக்கிய அமைப்பும் மூலம் உணர்த்தப்படுகிறது.
- source_word: חֶשְׁבּוֹן
  choice: எஸ்போன்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֶלְעָלֵא
  choice: எலெயாலே
  rationale: மசோரா உயிர்க்குறிப்புகளுடன் உள்ள எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: קִרְיָתָיִם
  choice: கிரியத்தாயிம்
  rationale: எபிரெய இடப்பெயரின் ஒலியையும் -யிம் முடிவையும் தெளிவாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
