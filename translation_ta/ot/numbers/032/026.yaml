  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: ta
  text: எங்கள் சிறுபிள்ளைகளும்[a], எங்கள் மனைவிகளும், எங்கள் கால்நடைகளும், எங்கள் எல்லா விலங்குகளும் அங்கே, கிலேயாத்தின் நகரங்களில் தங்கியிருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் பிள்ளைகள்.’ எபிரேயச் சொல் טַף குறிப்பாகச் சிறுவர்களையோ பெரியவர்களைச் சார்ந்திருக்கும் பிள்ளைகளையோ அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அங்கே இருக்கும்.’ எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் ‘இருக்கும்’; ஆனால் மற்றவர்கள் போருக்குச் செல்லும்போது இவர்கள் அங்கேயே தங்கியிருப்பது இச்சூழலில் உட்பொருளாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: எங்கள் சிறுபிள்ளைகள்
  rationale: טַף என்பது பொதுவாகப் போரில் பங்கேற்காத சிறுவர்களையும் சார்ந்திருக்கும் பிள்ளைகளையும் குறிக்கிறது. ‘சிறுபிள்ளைகள்’ அதன் வயதுசார்ந்த நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָשֵׁינוּ
  choice: எங்கள் மனைவிகள்
  rationale: குடும்பங்களைக் குறித்த இந்தச் சூழலில் אִשָּׁה என்பதன் பன்மை வடிவத்திற்கு ‘மனைவிகள்’ என்பதே இயல்பான பொருள்.
- source_word: מִקְנֵנוּ
  choice: எங்கள் கால்நடைகள்
  rationale: מִקְנֶה என்பது மந்தைகளையும் ஆட்டு மாடுகளையும் உள்ளடக்கிய கால்நடைச் செல்வத்தைக் குறிக்கும்; நவீன தமிழில் ‘கால்நடைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: எங்கள் வளர்ப்பு விலங்குகள் அனைத்தும்
  rationale: בְּהֵמָה என்பது குறிப்பாக மனிதர்களால் வளர்க்கப்படும் விலங்குகளைக் குறிக்கும் பரந்த சொல். முந்தைய מִקְנֶה என்பதிலிருந்து சொல்வேறுபாட்டைப் பேண ‘வளர்ப்பு விலங்குகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִהְיוּ
  choice: தங்கியிருக்கும்
  rationale: வினைச்சொல்லின் நேரடிப் பொருள் ‘இருக்கும்’; ஆனால் ஆண்கள் போருக்குச் செல்லும்போது குடும்பங்களும் விலங்குகளும் அங்கேயே விடப்படுவதால், சூழலுக்கேற்ற ‘தங்கியிருக்கும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இது நேரடியான இடவினையடை; ‘அங்கே’ இயல்பான தமிழ் இணைச்சொல்.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: கிலேயாத்தின் நகரங்களில்
  rationale: עָרִים என்பது நகரங்கள் அல்லது ஊர்களைக் குறிக்கலாம்; இங்கு ‘கிலேயாத்தின் நகரங்கள்’ என்பது நேரடியான, மரபான இடப்பெயர் அமைப்பு.
