translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே தொடரில் மனிதர்களும் விலங்குகளும் எழுவாய்களாக வருவதால், அனைவரையும் உள்ளடக்கும் வகையில் நடுநிலை ஒருமை வினைமுற்றான ‘தங்கியிருக்கும்’ இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது. מִקְנֶה மற்றும் בְּהֵמָה ஆகிய அருகிய பொருளுடைய இரு எபிரேயச் சொற்களின் வேறுபாடு ‘கால்நடைகள்’ / ‘வளர்ப்பு விலங்குகள்’ எனப் பேணப்பட்டுள்ளது.
