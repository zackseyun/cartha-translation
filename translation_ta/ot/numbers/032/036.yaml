  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: ta
  text: பெத்-நிம்ரா, பெத்-ஹாரான் ஆகிய அரணமைக்கப்பட்ட நகரங்களையும்[a], சிறு கால்நடை மந்தைகளுக்கான தொழுவங்களையும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அரண் நகரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘சிறு கால்நடை மந்தைகளுக்கான அடைப்புகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: பெத்-நிம்ரா
  rationale: இது ஓர் இடப்பெயர். בֵּית என்பதைக் ‘வீடு’ என்று பொருளாக்காமல், பெயரின் ஓர் அங்கமாக ‘பெத்’ என்று ஒலிபெயர்த்துள்ளோம்.
- source_word: בֵּית הָרָן
  choice: பெத்-ஹாரான்
  rationale: இது நிலைபெற்ற நகரப்பெயர் என்பதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָרֵי מִבְצָר
  choice: அரணமைக்கப்பட்ட நகரங்கள்
  rationale: இச்சேர்க்கைச் சொற்றொடர் பாதுகாப்புக்காக அரண் செய்யப்பட்ட நகரங்களைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் இராணுவப் பாதுகாப்புப் பொருளைத் தெளிவாகவும் தெரிவிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גִדְרֹת צֹאן
  choice: ஆட்டு மந்தைகளுக்கான தொழுவங்கள்
  rationale: גִדְרֹת என்பது வேலியிட்ட அடைப்பிடங்களையும், צֹאן என்பது செம்மறியாடுகள் அல்லது வெள்ளாடுகள் உள்ளிட்ட சிறு கால்நடை மந்தைகளையும் குறிக்கலாம். சூழலுக்கேற்ற இயல்பான தமிழாக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: …யையும் …யையும்
  rationale: மீண்டும் வரும் וְ மற்றும் நேர் செயப்படுபொருள் குறியீடு אֵת, முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலைக் காட்டுகின்றன. தமிழில் ‘-யையும்’ என்ற இணைப்பால் அந்தத் தொடர்ச்சி பேணப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: முந்தைய வசனத்தில் தொடங்கிய கட்டுமானப் பட்டியலின் தொடர்ச்சியாக, மூலத்தில் இவ்வசனத்துக்குத் தனி வினைச்சொல் இல்லை. அதனால் தமிழிலும் வினைச்சொல் சேர்க்காமல், செயப்படுபொருள் வடிவில் தொடர்ச்சி பேணப்பட்டுள்ளது. நடை நவீனமானதும் மரியாதைமிக்கதும் பொதுவாசகருக்கு விளங்கக்கூடியதுமாக உள்ளது.
