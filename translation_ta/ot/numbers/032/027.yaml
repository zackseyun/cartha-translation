  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: ta
  text: ஆனால், உமது அடியார்களாகிய நாங்கள் ஒவ்வொருவரும் போராயுதம் ஏந்தி[a], யெகோவாவின் முன்னிலையில்[b] போருக்குக்[c] கடந்து செல்வோம்; என் தலைவர் சொல்வதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படைத்தொண்டுக்குத் தயாரான ஒவ்வொருவரும்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘யெகோவாவின் முன்னிலையில்.’ அவர்கள் இந்தப் படை நடவடிக்கையில் யெகோவாவின் அதிகாரத்தின்கீழும் அவரது சந்நிதியிலும் பங்கேற்பதை இது உணர்த்துகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘போருக்காக’ / ‘போர் செய்ய.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: ஆனால், உமது அடியார்களான நாங்கள்
  rationale: עֶבֶד இங்கு மோசேயிடம் தங்களைத் தாழ்மையுடன் குறிப்பிடும் மரியாதைச் சொல்; எனவே ‘அடியார்கள்’ பொருத்தமானது. முந்தைய கருத்துடன் உள்ள எதிர்நிலையை வாவ் இணைப்புச் சொல் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יַעַבְרוּ
  choice: கடந்து செல்வோம்
  rationale: עבר இச்சூழலில் ஆற்றையோ எல்லையையோ கடந்து படை நடவடிக்கைக்குச் செல்வதைக் குறிக்கிறது. தமிழில் பேசுவோர் தங்களை ‘நாங்கள்’ என்று குறிப்பதால் வினை முதல்நபர் பன்மையாக இயல்பாக்கப்பட்டது.
- source_word: כָּל חֲלוּץ צָבָא
  choice: போருக்கு ஆயுதம் ஏந்திய ஒவ்வொருவரும்
  rationale: כָּל உடன் வரும் ஒருமை வடிவம் பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ எனப் பொருள்படுகிறது. חֲלוּץ צָבָא என்பது படைப்போருக்காக ஆயுதம் பூண்டு ஆயத்தமான நபரைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற பொருளைத் தக்கவைத்து, படை நடவடிக்கை யெகோவாவின் அதிகாரத்திற்கும் பார்வைக்கும் உட்பட்டு நடைபெறுவதை வெளிப்படுத்துகிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: לְ முன்னொட்டு இங்கு நோக்கம் அல்லது திசையைக் குறிக்கலாம். இயல்பான தமிழில் ‘போருக்காக’ என்பது படை நடவடிக்கையின் நோக்கத்தைத் தெளிவாகத் தருகிறது; ‘போருக்கு’ என்பதும் சாத்தியம்.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: என் தலைவரே, நீர் சொல்வதுபோலவே
  rationale: אֲדֹנִי இங்கு தெய்வப் பட்டம் அல்ல; மோசேயை மரியாதையுடன் அழைக்கும் சொல். நிகழ்காலப் பங்கேற்பு வடிவமான דֹּבֵר உடனடி உரையாடலில் ‘சொல்வது’ என இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ என்று வழங்குவது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: ‘யெகோவாவின் முன்னிலையில்’ என்பதன் இறையியல் நுணுக்கம்
  choice: முன்னிலையில் என்ற வெளிப்பாட்டைத் தக்கவைத்தல்
  alternative: யெகோவாவுக்காக
  rationale: மூலம் நேரடியாக ‘யெகோவாவுக்காக’ என்று சொல்லாமல் ‘யெகோவாவின் முன்னிலையில்’ என்கிறது. ஆகவே அவரது அதிகாரம் மற்றும் சந்நிதி ஆகிய இரு நுணுக்கங்களையும் தீர்மானித்து சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், மோசேயிடம் பேசும் மரியாதைத் தொனியைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. ‘உமது,’ ‘நீர்,’ ‘என் தலைவரே’ ஆகியவை கண்ணியமான உரையாடல் நடையை வழங்குகின்றன; வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும் வகையில் உள்ளது.
