  verdict: revise
  source_fidelity: The draft accurately conveys the servants’ pledge, their crossing over, military readiness, Yahweh’s presence, and the deferential address to Moses. However, it adds “செய்வோம்” (“we will do”), which is not expressed in the Hebrew; the final clause only says “as my lord speaks/says.”
