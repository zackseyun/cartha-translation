    issue: The text adds “செய்வோம்” at the end.
    rationale: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר means “as my lord says/speaks”; it does not explicitly contain a verb meaning “we will do.” The addition slightly expands the stated commitment.
  - severity: low
