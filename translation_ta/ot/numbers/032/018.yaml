  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவரும் அவரவருடைய சுதந்தரத்தைப் பெற்றுக்கொள்ளும்வரை நாங்கள் எங்கள் வீடுகளுக்குத் திரும்பமாட்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: திரும்பமாட்டோம்
  rationale: எதிர்மறையுடன் வந்த Qal முற்றுப்பெறா வினை, சூழலில் எதிர்கால உறுதிமொழியைக் குறிக்கிறது; தமிழில் இயல்பாக ஒரே வினை வடிவில் தரப்பட்டுள்ளது.
- source_word: אֶל בָּתֵּינוּ
  choice: எங்கள் வீடுகளுக்கு
  rationale: திசையைக் குறிக்கும் முன்னிடைச்சொல்லையும் ‘எங்கள் வீடுகள்’ என்ற நேரடியான பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עַד
  choice: பெற்றுக்கொள்ளும்வரை
  rationale: அவர்கள் திரும்பாதிருப்பதற்கான கால எல்லையை ‘வரை’ தெளிவாகக் காட்டுகிறது.
- source_word: הִתְנַחֵל
  choice: பெற்றுக்கொள்ளும்
  rationale: Hitpael வடிவம் ஒதுக்கப்பட்ட பரம்பரை நிலத்தைத் தமக்குரிய உடைமையாகப் பெறுவதைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் ‘உரிமைச் சொத்தைப் பெற்றுக்கொள்ளும்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தின் குடும்ப உறவுசார், ஆண்பால் பன்மை வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; வழக்கமான ‘இஸ்ரவேலர்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு אִישׁ பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவரும்’ எனச் செயல்படுகிறது; ‘ஒவ்வொரு ஆணும்’ என்று கடினமாக மொழிபெயர்ப்பதைத் தவிர்த்து அதன் பகிர்வுப் பொருளைப் பாதுகாக்கிறது.
- source_word: נַחֲלָתוֹ
  choice: அவரவருடைய உரிமைச் சொத்தை
  rationale: ஒவ்வொருவருக்கும் ஒதுக்கப்பட்ட பரம்பரை நிலவுடைமையைக் குறிக்கிறது. ‘உரிமைச் சொத்து’ என்பது ‘சுதந்தரம்’ என்பதில் தோன்றக்கூடிய நவீன ‘விடுதலை’ என்ற குழப்பத்தைத் தவிர்த்து, உடைமைப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலினம் குறிக்கப்பட்ட உடன்படிக்கைச் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் குடும்பச் சொற்றொடரையும் உடன்படிக்கைச் சார்ந்த மொழிநடையையும் பிரதான உரையில் காக்கிறது; இயல்பான இனப்பெயர் வடிவம் அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரவருடைய’ என்பது אִישׁ ... נַחֲלָתוֹ என்ற பகிர்ந்தளிக்கும் அமைப்பை இயல்பாக எடுத்துரைக்கிறது.
