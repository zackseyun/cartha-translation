source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: ta
  text: யாவேவின் முன்னிலையில் அந்த நாடு கீழ்ப்படுத்தப்பட்ட பின்பு, நீங்கள் திரும்பலாம். அப்போது, யாவேக்கும் இஸ்ரவேலுக்கும் உள்ள உங்கள் கடமையிலிருந்து விடுபடுவீர்கள்[a]. இந்த நாடு யாவேவின் முன்னிலையில் உங்களுக்கு உடைமையாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவுக்கும் இஸ்ரவேலுக்கும் முன்பாகக் குற்றமற்றவர்களாக (அல்லது, நிரபராதிகளாக) இருப்பீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது எபிரெய மொழியிலுள்ள YHWH என்ற இறைப்பெயரின் ஒலிபெயர்ப்பு; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: கீழ்ப்படுத்தப்பட்டதும்
  rationale: נפעל வடிவின் செயப்பாட்டு மற்றும் விளைவு சார்ந்த பொருளைப் பாதுகாக்கிறது; நாடு கட்டுப்பாட்டுக்குள் கொண்டுவரப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற இடவியல் மற்றும் பொறுப்புக்கூறல் சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: நீங்கள் திரும்பிச் செல்லலாம்
  rationale: முந்தைய நிபந்தனை நிறைவேறிய பின்னர் அனுமதிக்கப்படும் திரும்புதலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: யாவேக்கும் இஸ்ரவேலுக்கும் செய்ய வேண்டிய கடமையிலிருந்து விடுபட்டவர்களாவீர்கள்
  rationale: נָקִי என்பதன் குற்றமின்மை, பொறுப்பிலிருந்து விடுதலை ஆகிய பொருள் வரம்புகளில், இச்சூழலில் உறுதியளிக்கப்பட்ட கடமை நிறைவேறியதைக் காட்டும் பொருள் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַאֲחֻזָּה
  choice: உடைமை நிலமாக
  rationale: אֲחֻזָּה குறிக்கும் நிலம் சார்ந்த நிரந்தர உடைமை அல்லது பங்கினை, வெறும் பொதுவான ‘சொத்து’ என்பதைவிடத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: נְקִיִּים என்பதன் உடன்படிக்கைச் சூழலிலான பொருள்
  choice: கடமையிலிருந்து விடுபட்டவர்கள்
  alternative: குற்றமற்றவர்கள்; நிரபராதிகள்
  rationale: போருக்குச் செல்லும் உறுதிமொழியை நிறைவேற்றிய பின் ஏற்படும் பொறுப்புவிடுதலையே உடனடிச் சூழல் வலியுறுத்துகிறது; இருப்பினும் எபிரெயச் சொல்லின் நீதிமன்ற/ஒழுக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. சட்ட/உடன்படிக்கை நுணுக்கம் இயல்பான ‘கடமையிலிருந்து விடுபட்டவர்கள்’ என்ற தொடரால் வெளிப்படுத்தப்பட்டு, மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
