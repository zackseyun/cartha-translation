revisions:
- from: யாவேக்கு[b] முன்பாக அந்த நாடு கீழ்ப்படுத்தப்பட்டதும், நீங்கள் திரும்பிச் செல்லலாம். அப்போது யாவேக்கும் இஸ்ரவேலுக்கும் செய்ய வேண்டிய கடமையிலிருந்து விடுபட்டவர்களாவீர்கள்[a]. இந்த நாடு யாவேக்கு முன்பாக உங்களுக்கு உடைமை நிலமாக இருக்கும்.
  to: யாவேவின் முன்னிலையில் அந்த நாடு கீழ்ப்படுத்தப்பட்ட பின்பு, நீங்கள் திரும்பலாம். அப்போது, யாவேக்கும் இஸ்ரவேலுக்கும் உள்ள உங்கள் கடமையிலிருந்து விடுபடுவீர்கள்[a]. இந்த நாடு யாவேவின் முன்னிலையில் உங்களுக்கு உடைமையாகும்[b].
  rationale: The revision corrects the Tamil relational construction for ‘before Yahweh,’ smooths the legal expression concerning release from obligation, and renders the final possessory clause more idiomatically. Footnote markers are placed at the first relevant occurrence of the disputed lexical sense and the divine name, respectively; the footnotes preserve the stated alternatives without adding doctrinal interpretation.
