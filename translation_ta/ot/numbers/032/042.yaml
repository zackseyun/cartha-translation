    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அதன் மகள்கள்’; இது கெனாத் நகரைச் சார்ந்த சிறிய குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  revision_rationale: The revision preserves every action and relationship in the Hebrew while correcting the proper-name forms, simplifying the motion verb to match הלך, and rendering the naming formula with idiomatic Tamil that closely reflects בִּשְׁמוֹ. The footnote remains anchored to “சிற்றூர்களையும்” and explains the Hebrew idiom.
