source:
  edition: WLC
  text: וְ/נֹ֣בַח הָלַ֔ךְ וַ/יִּלְכֹּ֥ד אֶת קְנָ֖ת וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יִּקְרָ֧א לָ֦/ה נֹ֖בַח בִּ/שְׁמֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: ta
  text: நோபா சென்று, கெனாத்தையும் அதைச் சார்ந்த சிற்றூர்களையும்[a] கைப்பற்றி, அந்த நகருக்கு நோபா என்று தன் பெயரால் பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அதன் மகள்கள்’; இது கெனாத் நகரைச் சார்ந்த சிறிய குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: நோபாகு
  rationale: ஆளின் பெயரும் பின்னர் நகருக்கு வைக்கப்பட்ட பெயரும் எபிரெயத்தில் ஒரே வடிவில் உள்ளன; தமிழில் இயல்பாக ஒலிபெயர்த்து, இரு இடங்களிலும் ஒரே வடிவம் பேணப்பட்டுள்ளது.
- source_word: הָלַךְ
  choice: புறப்பட்டுச் சென்று
  rationale: கதைத் தொடரில் இயக்கத்தைக் குறிக்கும் எளிய வினை; தமிழில் அடுத்துவரும் கைப்பற்றும் செயலுடன் இயல்பாக இணைகிறது.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றி
  rationale: לכד என்பது இங்குள்ள படையெடுப்புச் சூழலில் ஒரு நகரைக் கைப்பற்றுவதைக் குறிக்கிறது.
- source_word: קְנָת
  choice: கேனாத்
  rationale: இது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנֹתֶיהָ
  choice: அதைச் சார்ந்த சிற்றூர்களையும்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அதன் மகள்கள்’; ஆனால் இது முதன்மை நகரைச் சார்ந்த துணைக் குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடர். பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּקְרָא לָהּ
  choice: அந்த நகருக்கு ... என்று வைத்தான்
  rationale: קרא + ל இங்கு பெயரிடுதலைக் குறிக்கிறது. பெண்பால் சுட்டுப்பெயர் கேனாத் நகரைக் குறிப்பதைத் தமிழில் தெளிவாக்க ‘அந்த நகருக்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּשְׁמוֹ
  choice: தன் பெயரையே
  rationale: அந்த இடம் நோபாகின் சொந்தப் பெயரால் பெயரிடப்பட்டதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது; ‘ஏ’ வலியுறுத்தல் பெயர் ஒன்றே என்பதைக் காட்டுகிறது.
