    issue: Footnote c gives a semantically opposite alternative.
    rationale: ‘அவர்களை மனமுடையச் செய்தார்கள்’ normally suggests giving courage or heart, whereas וַיָּנִיאוּ denotes causing discouragement/aversion in this context. It must be replaced.
