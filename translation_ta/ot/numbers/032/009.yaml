  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: ta
  text: அவர்கள் எஸ்கோல் பள்ளத்தாக்கு[a] வரை மேலேறிச் சென்று, நாட்டைப் பார்த்தார்கள்; யாவே[b] தங்களுக்குக் கொடுத்திருந்த அந்த நாட்டிற்குள் அவர்கள் செல்லாதபடி இஸ்ரவேல் மக்களின் மனத்தைத் தளரச் செய்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பள்ளத்தாக்கு’ என்பதற்கான எபிரெயச் சொல் ஓடை ஓடும் பள்ளத்தாக்கையோ, பருவகாலத்தில் மட்டும் நீர் ஓடும் வாடியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே’ என்பது எபிரெய மூலத்தில் வரும் יהוה (YHWH) என்ற இறைப்பெயரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘மனத்தைத் தளரச் செய்தார்கள்’ என்பதை ‘இஸ்ரவேல் மக்களின் மனவுறுதியைக் குலைத்தார்கள்’ அல்லது ‘அவர்கள் செல்ல விரும்பாதபடி செய்தார்கள்’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: போய்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தைச் சூழல் உணர்த்தினாலும், தமிழில் பயணத்தை இயல்பாகக் கூற ‘போய்’ என்பது தெளிவானது; ‘மேலேறிப் போய்’ என்பது இங்கு தேவையற்ற அளவு சொல்லுக்கு சொல் அமைப்பாக இருக்கும்.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: எஸ்கோல் பள்ளத்தாக்கு வரை
  rationale: עַד என்பதற்கு ‘வரை’; נַחַל என்பது ஓடை ஓடும் பள்ளத்தாக்கையோ வாடியையோ குறிக்கலாம். பொதுவாசகருக்குப் புரியும் வகையில் ‘பள்ளத்தாக்கு’ தேர்ந்தெடுக்கப்பட்டது; அதன் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: அந்த நாட்டைப் பார்த்தார்கள்
  rationale: ראה என்பதன் நேரடியான பொருள் ‘பார்’. முன்னரே அறியப்பட்ட நாட்டைக் குறிப்பதால் தமிழ் இயல்புக்கேற்ப ‘அந்த நாடு’ என வழங்கப்பட்டது.
- source_word: וַיָּנִיאוּ
  choice: மனத்தைத் தளரச் செய்தார்கள்
  rationale: இந்த வினையின் Hiphil வடிவம் ஒருவரை விலகச் செய்தல், விருப்பம் அல்லது துணிவை இழக்கச் செய்தல் என்ற பொருளைக் கொண்டது. ‘மனத்தைத் தளரச் செய்தார்கள்’ என்பது அடுத்துவரும் ‘போகாதபடி’ என்பதோடு இயல்பாக இணைந்து காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் மனத்தை
  rationale: לֵב ஒருமையில் இருந்து இஸ்ரவேலரின் கூட்டு உள்ளத்தையும் மனவுறுதியையும் குறிக்கிறது. தமிழில் ‘இஸ்ரவேல் மக்களின் மனம்’ என்பது இயல்பாகவும் தேசியக் குழுவைக் குறிக்கும் மூலச் சொல்லுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: அந்த நாட்டிற்குள் போகாதபடி
  rationale: לְבִלְתִּי + வினையெச்சம் தடுத்தல் அல்லது விளைவைச் சுட்டுகிறது; בוא אֶל இங்கு நாட்டிற்குள் நுழைவதைக் குறிக்கிறது. ‘போகாதபடி’ மூலத்தின் நோக்கம்/விளைவு நிழலைத் திறந்தவாறே வைக்கிறது.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: யாவே தங்களுக்குக் கொடுத்திருந்த
  rationale: נתן நிறைவேற்றப்பட்ட கொடையைச் சுட்டுவதால், பின்னோக்கிய கதைநிலையில் ‘கொடுத்திருந்த’ பொருத்தமானது. יְהוָה தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய உரையில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு அண்மையாக ‘யாவே’ என வழங்குவது மூலத்தின் உடன்படிக்கைப் பெயரைத் தெளிவாக வைத்திருக்கிறது.
- issue: இஸ்ரவேலின் ‘இதயம்’ ஒருமையைக் கையாளுதல்
  choice: இஸ்ரவேல் மக்களின் மனத்தை
  alternative: இஸ்ரவேலர்களின் மனங்களை / மனவுறுதியை
  rationale: மூலத்தில் ‘இதயம்’ ஒருமையில் வந்து மக்களின் கூட்டு மனநிலையைக் குறிக்கிறது. தமிழில் ‘மனம்’ ஒருமையை வைத்திருப்பது அந்தக் கூட்டு உருவகத்தைப் பாதுகாக்கிறது; ‘மனவுறுதி’ என மட்டும் மாற்றுவது உருவகத்தை விளக்கமாகத் தீர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான வாவ் இணைப்பை எதிர்மறைத் திருப்பாக மாற்றாமல் அரைப்புள்ளியால் இயல்பாக இணைத்துள்ளோம். ‘இஸ்ரவேல் புத்திரர்’ என்ற சொல்லுக்கு சொல் வடிவத்துக்குப் பதிலாக இயல்பான தேசிய அடையாளச் சொல்லான ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டது.
