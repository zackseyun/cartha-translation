  to: 'ஓய்வுநாளில்: ஒரு வயதான பழுதற்ற இரண்டு ஆண் ஆட்டுக்குட்டிகள், எண்ணெயுடன் கலந்த மெல்லிய மாவாகிய எப்பாவின் பத்தில் இரண்டு பங்குகள் தானியக் காணிக்கையாக, அதனுடைய பானக் காணிக்கையுடன்[a] செலுத்தப்பட வேண்டும்.[b]'
