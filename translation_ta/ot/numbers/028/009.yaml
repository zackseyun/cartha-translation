  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: ta
  text: 'ஓய்வுநாளில்: ஒரு வயதான பழுதற்ற இரண்டு ஆண் ஆட்டுக்குட்டிகள், எண்ணெயுடன் கலந்த மெல்லிய மாவாகிய எப்பாவின் பத்தில் இரண்டு பங்குகள் தானியக் காணிக்கையாக, அதனுடைய பானக் காணிக்கையுடன்[a] செலுத்தப்பட வேண்டும்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதனுடைய ஊற்றுக் காணிக்கையுடன்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் வினைச்சொல் இல்லை; இது முந்தைய வசனத்தில் உள்ள பலி ஆணையைத் தொடரும் காணிக்கைப் பட்டியல்.
    reason: translation_note
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளிலோ
  rationale: இணைப்புச் சொல்லையும் காலக் குறிப்பையும் இயல்பான தமிழில் தருகிறது; முந்தைய நாள்தோறும் செலுத்தப்படும் காணிக்கைகளிலிருந்து ஓய்வுநாள் காணிக்கைக்கு மாறுவதையும் உணர்த்துகிறது.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: ஒரு வயதான ... இரண்டு ஆட்டுக்குட்டிகள்
  rationale: எபிரெயச் சொற்றொடர் ‘ஒரு ஆண்டின் குட்டிகள்’ என்ற பொருளில், வயது ஒரு ஆண்டு நிரம்பிய இளம் ஆடுகளைக் குறிக்கிறது. כְבָשִׂים ஆண்பால் வடிவம் என்றாலும், தமிழில் ‘ஆட்டுக்குட்டிகள்’ இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: תְּמִימִם
  choice: பழுதற்ற
  rationale: பலிக்குரிய விலங்குகளில் உடல் குறைபாடு இல்லாத நிலையைச் சுருக்கமாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ஓர் எப்பாவின் பத்தில் இரண்டு பங்கு
  rationale: மூலத்தில் உள்ள ‘இரண்டு பத்தில் பங்குகள்’ என்பது பலி ஒழுங்குகளில் எப்பா அளவின் பத்தில் இரண்டு பங்கைக் குறிக்கிறது; அளவின் அடிப்படையை உரையிலேயே தெளிவாக்குகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைக்காக நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: ஆசார ஒழுங்குச் சூழலில் பொதுவான பரிசை அல்ல, தானியத்தால் செய்யப்படும் காணிக்கையைத் துல்லியமாகக் குறிக்கிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்த
  rationale: மாவும் எண்ணெயும் ஒன்றாகக் கலக்கப்பட்டிருப்பதை நேரடியாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וְנִסְכּוֹ
  choice: அதற்குரிய பானக் காணிக்கை
  rationale: பலியுடன் சேர்த்து ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கிறது; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டை ‘அதற்குரிய’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: மூல வசனத்தில் வெளிப்படையான வினைச்சொல் இல்லாமை
  choice: ‘செலுத்த வேண்டும்’ எனச் சூழலிலிருந்து வெளிப்படுத்தப்பட்டது
  alternative: வினைச்சொல் இல்லாத பட்டியல் வடிவத்தை அப்படியே வைத்தல்
  rationale: எபிரெயத்தில் இது முந்தைய பலி ஆணையின் தொடர்ச்சியாக உள்ள வினையற்ற பட்டியல். தமிழில் தனி வசனமாகத் தெளிவாக வாசிக்க, சூழலில் உள்ள கட்டளையின் வினைச் செயல் வெளிப்படுத்தப்பட்டது; புதிய சடங்கு அல்லது இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘ஓய்வுநாள்’, ‘தானியக் காணிக்கை’, ‘பானக் காணிக்கை’ ஆகியவை சூழலைத் தெளிவாகக் காட்டுகின்றன; அளவீட்டுச் சொல்லான ‘எப்பா’ விளக்கத்துடன் உரையில் வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் அவற்றுக்குரிய சொற்றொடர்களுக்குப் பின்னர் அமைக்கப்பட்டுள்ளன.
