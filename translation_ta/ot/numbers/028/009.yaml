  source_fidelity: திருத்தம் தேவை. ‘ஓய்வுநாளிலோ’வில் உள்ள ‘-லோ’ விலக்கு/மாறுபாட்டுத் தொனியைத் தருகிறது; எபிரெயத்தின் எளிய இணைப்பும் காலக் குறிப்பும் இதைக் கோரவில்லை. மேலும், மூல வசனம் முந்தைய கட்டளையைச் சார்ந்த வினையற்ற காணிக்கைப் பட்டியலாக இருப்பதால், ‘செலுத்த வேண்டும்’ என்பதைச் சேர்ப்பது தமிழில் தெளிவாக்கினும் இவ்வசனத்தில் வெளிப்படையாக இல்லாத கட்டளை வினையைச் சேர்க்கிறது. ஆண்பால் ஆட்டுக்குட்டிகள் என்ற ஆங்கில POB audit-trail தீர்மானமும் திருத்தத்தில் காக்கப்பட்டுள்ளது.
  naturalness: திருத்தப்பட்ட உரை நவீன தரத் தமிழில் இயல்பான வழிபாட்டு நடையுடன் உள்ளது. ‘மெல்லிய மாவாகிய ... தானியக் காணிக்கை’ என்ற அமைப்பு, மாவு காணிக்கையின் பொருள் என்பதைத் தெளிவாக இணைக்கிறது. ‘எப்பாவின் பத்தில் இரண்டு பங்குகள்’ என்பது அளவைக் குழப்பமின்றி தருகிறது.
