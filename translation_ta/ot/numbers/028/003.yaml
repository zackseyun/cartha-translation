  source_fidelity: 'மூலத்தின் முக்கியமான பலியியல் கூறுகள் பாதுகாக்கப்பட்டுள்ளன: யாவே, நெருப்புடன் தொடர்புடைய காணிக்கை, ஆண் ஒரு வயதுக் குட்டிகள், குறையற்ற நிலை, நாள்தோறும் இரண்டு, வழக்கமான தகனபலி. ஆனால் தற்போதைய வாக்கியத்தில் ‘ஒரு வயதான ... குட்டிகள் இரண்டை’ என்ற எண்ணிக்கை/பெயர்ச்சொல் அமைப்பு இலக்கண ரீதியாகச் சரியில்லை; மேலும் ‘செலுத்தவேண்டிய’ மற்றும் ‘செலுத்துங்கள்’ என ஒரே கடமை தேவையின்றி இருமுறை வருகிறது.'
