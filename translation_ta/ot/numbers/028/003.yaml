source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: ta
  text: 'நீ அவர்களிடம் சொல்ல வேண்டும்: “நீங்கள் யாவேக்குச் செலுத்த வேண்டிய நெருப்புக் காணிக்கை[a] இதுவே: ஒரு வயதுடைய, பழுதற்ற இரண்டு ஆண் செம்மறியாட்டுக் குட்டிகளை ஒவ்வொரு நாளும் வழக்கமான தகனபலியாகச் செலுத்த வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுக் காணிக்கை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: நெருப்பில் செலுத்தும் காணிக்கை
  rationale: இந்த ஆசாரச் சொல் நெருப்புடன் தொடர்புடைய பலியைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; ‘உணவுப் படையல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תַּקְרִיבוּ
  choice: செலுத்தவேண்டிய / செலுத்துங்கள்
  rationale: ஹிப்ஃபில் வடிவிலுள்ள קרב, பலியிடும் சூழலில் கர்த்தரின் முன்னிலையில் காணிக்கையைச் சமர்ப்பிப்பதைக் குறிக்கிறது. ‘செலுத்து’ என்பது தமிழில் வழிபாட்டு நுணுக்கத்துடன் இயல்பாக உள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான יהוה ஒலிபெயர்க்கப்பட்டு, தனிப்பட்ட இறைப்பெயராகப் பாதுகாக்கப்படுகிறது.
- source_word: כְבָשִׂים בְּנֵי שָׁנָה
  choice: ஒரு வயதான ஆண் செம்மறியாட்டுக் குட்டிகள்
  rationale: விலங்கின் வகை, ஆண்பால் வடிவு, ‘ஒரு வயது’ என்னும் எபிரேய மரபுத்தொடர் ஆகியவற்றைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תְמִימִם
  choice: பழுதற்ற
  rationale: பலிக்கான விலங்குகளில் உடற்குறை அல்லது குறைபாடு இல்லாதிருக்க வேண்டும் என்ற ஆசாரப் பொருளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: לַיּוֹם
  choice: ஒவ்வொரு நாளும்
  rationale: நாளொன்றுக்கு இரண்டு என்ற பகிர்ந்தளிக்கும் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலைபெற்ற, தெளிவான தமிழ்ச் சொல்.
- source_word: תָמִיד
  choice: வழக்கமான
  rationale: பலியிடுதல் இடைவிடாமல் நிகழ்வதாக அல்லாமல், நிர்ணயிக்கப்பட்ட முறையில் தொடர்ந்து ஒவ்வொரு நாளும் நிகழ்வதாகக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், வெளிப்படுத்தப்பட்ட உடன்படிக்கைப் பெயரை மறைக்காமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- issue: אִשֶּׁה என்பதன் ஆசாரப் பொருள்
  choice: நெருப்பில் செலுத்தும் காணிக்கை
  alternative: உணவுப் படையல்
  rationale: இச்சொல்லின் நெருப்புடன் தொடர்புடைய நேரடிப் பொருளை முதன்மை உரையில் வைத்தபோதும், ஆசாரச் சூழலில் காணப்படும் ‘உணவுப் படையல்’ என்ற புரிதலை அடிக்குறிப்பில் பாதுகாத்து உண்மையான சொற்பொருள் தெளிவின்மையைத் தீர்த்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் ஆசாரத் துல்லியமும் காக்கப்பட்டுள்ளன. கட்டளையின் ஒருமை (‘நீ சொல்லவேண்டியது’) மற்றும் மக்களைக் குறிக்கும் பன்மை (‘நீங்கள் செலுத்தவேண்டிய’) வேறுபடுத்தப்பட்டுள்ளன; பலியியல் சொற்களுக்கு புரிந்துகொள்ளத்தக்க நிலையான வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
