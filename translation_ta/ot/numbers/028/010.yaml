revisions:
- from: ஒவ்வொரு ஓய்வுநாளுக்குரிய தகனபலியை அந்தந்த ஓய்வுநாளில் செலுத்த வேண்டும்; இது வழக்கமான தகனபலிக்கும் அதற்குரிய பானபலிக்கும் கூடுதலானது.
  to: ஒவ்வோர் ஓய்வுநாளுக்குமான தகனபலி, அந்த ஓய்வுநாளில், வழக்கமான தகனபலிக்கும் அதன் பானபலிக்கும் கூடுதலாகும்.
  rationale: The revision removes the explicit modal command added for fluency and retains the source's nominal, additive formulation. It preserves the recurring/distributive sense of “on its Sabbath” as «அந்த ஓய்வுநாளில்» and keeps the established sacrificial terminology.
  reviewer_model: gpt-5.6-terra
