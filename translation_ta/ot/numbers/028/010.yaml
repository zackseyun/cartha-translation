reference: Numbers 28:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: ta
  text: ஒவ்வோர் ஓய்வுநாளுக்குமான தகனபலி, அந்த ஓய்வுநாளில், வழக்கமான தகனபலிக்கும் அதன் பானபலிக்கும் கூடுதலாகும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: தகனபலி
  rationale: עֹלָה என்பது முழுவதுமாக எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான பலிச்சொல்; ‘தகனபலி’ தமிழில் தெளிவான, மரபாக நிலைபெற்ற இணைச்சொல்.
- source_word: שַׁבַּת
  choice: ஓய்வுநாள்
  rationale: பலிகளுக்கான நாள்காட்டிச் சூழலில் இது வாரத்தையல்ல, சபாத்து நாளையே குறிக்கிறது; ‘ஓய்வுநாள்’ நவீனத் தமிழில் அதன் அடிப்படைப் பொருளையும் தெரிவிக்கிறது.
- source_word: בְּשַׁבַּתּוֹ
  choice: அந்தந்த ஓய்வுநாளில்
  rationale: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டுள்ள எபிரெயச் சொற்றொடர், ஒவ்வொரு ஓய்வுநாளிலும் மீண்டும் நிகழும் பகிர்வுப் பொருளைக் கொண்டுள்ளது; ‘அந்தந்த’ என்பது ‘அதன் ஓய்வுநாளில்’ என்ற வடிவத்தைவிட இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: கூடுதலானது
  rationale: பலிச்சடங்கு வழிமுறைகளில் עַל மற்றொரு பலியோடு சேர்க்கப்படுவதைக் குறிக்கிறது; இங்கு ‘கூடுதலானது’ அந்த நடைமுறை உறவைத் தெளிவுபடுத்துகிறது.
- source_word: הַתָּמִיד
  choice: வழக்கமான
  rationale: תָּמִיד தொடர்ந்து அல்லது ஒழுங்காகச் செலுத்தப்படுவதைக் குறிக்கிறது. முன்வரும் עֹלַת உடன் சேர்த்து ‘வழக்கமான தகனபலி’ என்பது இயல்பான தமிழாகவும் தொடர்ச்சியான நியமத்தை உணர்த்துவதாகவும் உள்ளது.
- source_word: וְנִסְכָּהּ
  choice: அதற்குரிய பானபலி
  rationale: נֶסֶךְ ஊற்றிச் செலுத்தப்படும் துணைப் பலியைக் குறிக்கிறது; பெண்பால் ஒருமைப் பின்னொட்டு தகனபலியைச் சுட்டுவதால் ‘அதற்குரிய பானபலி’ என்று மொழிபெயர்க்கப்பட்டது.
