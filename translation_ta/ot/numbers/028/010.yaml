review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the principal sacrificial terms and the distributive sense of בְּשַׁבַּתּוֹ. However, adding «செலுத்த வேண்டும்» converts the Hebrew nominal prescription into an explicit obligation. The source states the Sabbath offering's relation to the regular offering without an overt modal verb.
  naturalness: The wording is clear and suitably formal for modern standard Tamil. Removing the added modal preserves a natural declarative construction while remaining intelligible.
  terminology: «தகனபலி» and «பானபலி» are appropriate established cultic terms. «ஓய்வுநாள்» communicates Sabbath accessibly in this calendar context. «வழக்கமான தகனபலி» adequately represents עֹלַת הַתָּמִיד without over-specifying it as daily.
  issues:
  - severity: medium
    issue: «செலுத்த வேண்டும்» is an interpretive addition.
    rationale: 'The Hebrew is a noun-centered formulation: “the burnt offering of Sabbath on its Sabbath, in addition to …” It does not explicitly say “must be offered.” The prescriptive context may be implicit, but the Tamil should not add an overt modal when a declarative formulation can preserve the source syntax and force.'
  revised_text: ஒவ்வோர் ஓய்வுநாளுக்குமான தகனபலி, அந்த ஓய்வுநாளில், வழக்கமான தகனபலிக்கும் அதன் பானபலிக்கும் கூடுதலாகும்.
  revised_footnotes: []
  revision_rationale: The revision removes the explicit modal command added for fluency and retains the source's nominal, additive formulation. It preserves the recurring/distributive sense of “on its Sabbath” as «அந்த ஓய்வுநாளில்» and keeps the established sacrificial terminology.
