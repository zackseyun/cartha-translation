translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலிச்சடங்கு நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் பெயர்ச்சொல் மையமான சுருக்கத்தைத் தமிழில் முழுமையான கட்டளையாக இயல்பாக்க ‘செலுத்த வேண்டும்’ சேர்க்கப்பட்டுள்ளது; இது சூழலில் மறைந்திருக்கும் விதிமுறைத் தன்மையை வெளிப்படுத்துகிறது.
