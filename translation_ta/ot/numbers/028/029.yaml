translation:
  language: ta
  text: ஏழு செம்மறியாட்டுக் குட்டிகள் ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஒரு பத்தில் அளவு, ஒரு பத்தில் அளவு—அந்த ஒரு குட்டிக்கு, அந்த ஏழு குட்டிகளுக்கு.” இவ்வாறு திரும்பக் கூறுவது, ஏழு குட்டிகளில் ஒவ்வொன்றுக்கும் பத்தில் ஒரு அளவு என்பதைக் குறிக்கும் எபிரெயப் பகிர்ந்தளிப்பு மரபுத்தொடர். இச்சூழலில் இது தானியக் காணிக்கைக்கான அளவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: ஒவ்வொன்றுக்கும் பத்தில் ஒரு பங்கு
  rationale: திரும்பத் திரும்ப வரும் ஒருமைச் சொல், பலியிடும் ஒவ்வொரு விலங்கிற்கும் தனித்தனியாக ஒரே அளவு வழங்கப்படுவதைக் குறிக்கும் பகிர்ந்தளிப்பு மரபுத்தொடர். எபிரெய உரையில் இங்கு ‘எப்பா’ வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: செம்மறியாட்டுக் குட்டிகள் ஒவ்வொன்றுக்கும்
  rationale: சொல்லெழுத்தாக ‘அந்த ஒரு குட்டிக்கு’ என்றாலும், சூழலில் குறிக்கப்பட்ட அளவு ஒவ்வொரு குட்டிக்கும் பொருந்தும் பகிர்ந்தளிப்பு பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: அந்த ஏழு செம்மறியாட்டுக் குட்டிகள்
  rationale: எபிரெயிலுள்ள சுட்டுப் பொருளுடைய உருபைப் பிரதிபலித்து, முன்பே குறிப்பிடப்பட்ட ஏழு குட்டிகளின் முழுத் தொகுதியைக் குறிக்கிறது.
