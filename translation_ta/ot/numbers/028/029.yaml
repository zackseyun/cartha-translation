  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘செம்மறியாட்டுக் குட்டி’ என்பது כֶּבֶשׂ என்பதைக் தெளிவாகக் குறிக்கிறது. மூலத்தில் இல்லாத ‘எப்பா’ முதன்மை உரையில் சேர்க்கப்படாமல், அளவின் சூழல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
