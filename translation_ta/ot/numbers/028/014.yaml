source:
  edition: WLC
  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: ta
  text: 'அவற்றுக்குரிய திராட்சரசப் பானபலிகள் இவை: காளைக்கு அரை ஹின், செம்மறியாட்டுக் கடாவுக்கு ஒரு ஹின்னில் மூன்றில் ஒரு பங்கு, ஆட்டுக்குட்டிக்கு ஒரு ஹின்னில் நான்கில் ஒரு பங்கு. ஆண்டின் மாதங்கள் அனைத்திலும் அந்தந்த மாதத்திற்குரிய தகனபலி இதுவே.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டின் மாதங்கள் அனைத்திலும் அந்தந்த மாதத்தின் புதுநிலாவுக்குரிய தகனபலி இதுவே.” எபிரெயச் சொல் חֹדֶשׁ என்பது ‘மாதம்’ என்றும் ‘புதுநிலா’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: அவற்றுக்குரிய பானபலிகள்
  rationale: பலியுடன் ஊற்றிச் செலுத்தப்படும் திரவப் பலிகளைத் தமிழில் வழக்கமான வேதாகமச் சொல்லான ‘பானபலிகள்’ தெளிவாகக் குறிக்கிறது; பன்மை மற்றும் தொடர்புப்பொருள் காக்கப்படுகின்றன.
- source_word: חֲצִי הַהִין
  choice: அரை ஹின்
  rationale: பண்டைய அளவலகை மாற்றிக் கணக்கிடாமல் ‘ஹின்’ என ஒலிபெயர்த்து, அரைப் பங்கு என்ற மூலவடிவை நேரடியாகக் காக்கிறது.
- source_word: לַפָּר
  choice: காளைக்கு
  rationale: குறிப்பிட்ட பலிமிருகத்திற்குரிய அளவை இயல்பான தமிழில் தருகிறது.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: ஒரு ஹின்னில் மூன்றில் ஒரு பங்கு
  rationale: எபிரெயப் பின்னக் கூறைத் தெளிவான நவீன தமிழில் அளவுடன் இணைத்துக் கூறுகிறது.
- source_word: לָאַיִל
  choice: செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל என்பதன் ஆண் செம்மறியாடு என்ற குறிப்பிட்ட பொருளை ‘கடா’ மட்டும் என்பதிலுள்ள தெளிவின்மையைத் தவிர்த்து வெளிப்படுத்துகிறது.
- source_word: וּרְבִיעִת הַהִין
  choice: ஒரு ஹின்னில் நான்கில் ஒரு பங்கு
  rationale: மூலத்தின் பின்னக் கட்டமைப்பை இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: לַכֶּבֶשׂ
  choice: ஆட்டுக்குட்டிக்கு
  rationale: כֶּבֶשׂ என்பதன் பலிக்குரிய இளம் ஆடு என்ற பொருளைச் சாதாரண வாசகருக்குப் புரியும் தமிழில் தருகிறது.
- source_word: יָיִן
  choice: திராட்சரசத்தில்
  rationale: பட்டியலின் இறுதியில் வரும் יָיִן எல்லாப் பானபலிகளின் திரவப்பொருளையும் குறிப்பிடுவதால், தமிழில் தொடக்கத்திலேயே இணைத்து இயல்பாகத் தெளிவுபடுத்தப்படுகிறது.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: மாதாந்தரத் தகனபலி இதுவே
  rationale: חֹדֶשׁ என்பதன் ‘மாதம்/அமாவாசை அல்லது புதுநிலா’ என்ற பொருள் வாய்ப்புகளில், தொடர்ச்சியாக வரும் ‘ஆண்டின் மாதங்கள்’ என்ற சொற்றொடருடன் பொருந்தும் மாதாந்தர நிகழ்வை முதன்மை உரை தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: ஆண்டின் மாதங்கள் தோறும் செலுத்தப்பட வேண்டிய
  rationale: சொல்லுக்குச் சொல் அமைப்பின் செயற்கைத்தன்மையைத் தவிர்த்து, ஒவ்வொரு மாதமும் ஆண்டு முழுவதும் மீள நிகழும் பகிர்வுப் பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: חֹדֶשׁ என்பது ‘மாதம்’ அல்லது ‘புதுநிலா/அமாவாசை’ என இரு பொருள் தரக்கூடியது
  choice: முதன்மை உரையில் ‘மாதாந்தரத் தகனபலி’
  alternative: ‘அந்தந்த மாதத்தின் புதுநிலா நாளுக்கான தகனபலி’
  rationale: அடுத்துவரும் ‘ஆண்டின் மாதங்கள்’ என்ற தொடர் மாதந்தோறும் மீளும் பலியை வலியுறுத்துகிறது. இருப்பினும் வழிபாட்டுச் சூழலில் புதுநிலா குறிப்பு உண்மையான சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஹின்’ என்ற பண்டைய அளவலகு மூலத் தெளிவுக்காக மாற்றமின்றி ஒலிபெயர்க்கப்பட்டது. பலிமுறைச் சொற்களில் பரவலாக அறியப்பட்ட ‘பானபலி’, ‘தகனபலி’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன; எபிரெய உரையின் உண்மையான ‘மாதம்/புதுநிலா’ தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
