revisions:
- from: 'யெகோவாவுக்கு இனிய நறுமணமாக எரிபலியைச் செலுத்துங்கள்: மந்தையிலிருந்து இரண்டு காளைகள், ஒரு செம்மறியாட்டுக் கடா, ஓராண்டான ஏழு ஆட்டுக்குட்டிகள் ஆகியவற்றைச் செலுத்துங்கள்.[a]'
  to: 'யாவேக்கு இனிய நறுமணமளிக்கும் எரிபலியைச் செலுத்துங்கள்: மாட்டுமந்தையிலிருந்து இரண்டு காளைகள், ஒரு செம்மறியாட்டுக் கடா, ஓராண்டு வயதுள்ள ஏழு ஆண் ஆட்டுக்குட்டிகள்.'
