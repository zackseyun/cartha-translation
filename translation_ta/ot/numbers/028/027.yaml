source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: ta
  text: 'யாவேக்கு இனிய நறுமணமளிக்கும் எரிபலியைச் செலுத்துங்கள்: மாட்டுமந்தையிலிருந்து இரண்டு காளைகள், ஒரு செம்மறியாட்டுக் கடா, ஓராண்டு வயதுள்ள ஏழு ஆண் ஆட்டுக்குட்டிகள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: செலுத்துங்கள்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச் சூழலில் பலியை முன்வைத்தல் அல்லது செலுத்துதல் என்று பொருள்படும்; நவீன தமிழில் ‘செலுத்துங்கள்’ சடங்குசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: עוֹלָה
  choice: எரிபலி
  rationale: முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கும் நிலையான எபிரெயச் சொல்; தமிழில் ‘எரிபலி’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: பலியை இறைவன் ஏற்றுக்கொள்வதைச் சுட்டும் நிலையான பலிச் சொற்றொடர்; ‘இனிய நறுமணமாக’ அதன் உருவகத்தையும் ஏற்றுக்கொள்ளத்தக்க தன்மையையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுவாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பான ‘யெகோவா’ என வழங்குகிறது.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: மந்தையிலிருந்து இரண்டு காளைகள்
  rationale: בני בקר என்பது மாட்டுமந்தையைச் சேர்ந்த கால்நடைகளைக் குறிக்கிறது; இங்கு வயது வெளிப்படையாகக் கூறப்படாததால் ‘இளம்’ என்று சேர்க்கப்படவில்லை.
- source_word: אַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் பல விலங்குகளைக் குறிக்கக்கூடும் என்பதால் இனப்பெயர் சேர்க்கப்பட்டுள்ளது.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: ஏழு ஆட்டுக்குட்டிகள்
  rationale: כְבָשִׂים ஆண்பால் வடிவமாக இருந்தாலும், தமிழில் ‘ஆட்டுக்குட்டிகள்’ சூழலில் இயல்பாக உள்ளது; பலிக்கான பட்டியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּנֵי שָׁנָה
  choice: ஓராண்டான
  rationale: பலிக்குரிய விலங்குகளின் வயதைக் குறிக்கும் வழக்கமான சொற்றொடர்; ‘ஓராண்டான’ இயல்பான, சுருக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே உள்ளது. அதை பட்டப்பெயராக மாற்றாமல், தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் காக்கப்பட்டுள்ளது; மூல உச்சரிப்பை நெருக்கமாகக் காட்ட ‘யாவே’ என்பதும் சாத்தியம்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பலிச் சட்டத்தின் கண்ணியமான நடையைப் பேணியும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கட்டளைப் பன்மை தமிழில் இயல்பாக அமைய வினைச்சொல் இறுதியில் மீண்டும் வழங்கப்பட்டது.
