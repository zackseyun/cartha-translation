source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: ta
  text: மேலும், ஒவ்வோர் ஆட்டுக்குட்டிக்கும் எண்ணெய் கலந்து செய்யப்பட்ட நன்கு அரைக்கப்பட்ட மாவில் ஓர் எப்பாவின் பத்தில் ஒரு பங்கைத் தானியக் காணிக்கையாகச் செலுத்த வேண்டும். இது யாவேக்குச் செலுத்தப்படும் இனிய நறுமணமுள்ள தகனபலியும் நெருப்புக் காணிக்கையும் ஆகும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உணவுக் காணிக்கை.’
    reason: אִשֶּׁה என்ற எபிரேயச் சொல் முதன்மையாக நெருப்பினால் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது; பலியியல் சூழலில் ‘உணவுக் காணிக்கை’ என்றும் மொழிபெயர்க்கப்படுகிறது.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: ஓர் எப்பாவின் பத்தில் ஒரு பங்கு
  rationale: இரட்டிக்கப்பட்ட எபிரேய அளவைச் சொற்றொடர் ஒவ்வொரு காணிக்கைக்கும் எப்பாவில் பத்தில் ஒரு பங்கைக் குறிக்கிறது. மூலத்தில் ‘எப்பா’ வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் அளவைத் தெளிவுபடுத்த அது சேர்க்கப்பட்டது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலிக்கான நன்கு சலிக்கப்பட்ட அல்லது தரமான மாவைக் குறிக்கும் வழக்கமான சொல்; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: இச்சடங்குச் சூழலில் பொதுவான காணிக்கையல்ல, மாவால் செய்யப்படும் தானியக் காணிக்கையைக் குறிக்கிறது.
- source_word: בְּלוּלָה בַּשֶּׁמֶן
  choice: எண்ணெய் கலந்து செய்த
  rationale: மாவும் எண்ணெயும் கலக்கப்பட்டிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ஒவ்வோர் ஆட்டுக்குட்டிக்கும்
  rationale: ஒவ்வொரு தனிப்பட்ட ஆட்டுக்குட்டிக்கும் குறிப்பிட்ட அளவு செலுத்தப்பட வேண்டும் என்ற பகிர்ந்தளிக்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரிக்கப்படும் பலிக்கான நிலையான சடங்குச் சொல்.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய மணம் தரும்
  rationale: காணிக்கை கடவுளுக்கு ஏற்புடையதாக இருப்பதைச் சுட்டும் நிலையான பலி மொழியை இயல்பாகத் தருகிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புக் காணிக்கை
  rationale: சொல்லின் நெருப்புடன் தொடர்புடைய பலியியல் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘உணவுக் காணிக்கை’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரேய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה என்பதைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: אִשֶּׁה என்ற பலியியல் சொல்லின் பொருள்
  choice: நெருப்புக் காணிக்கை
  alternative: உணவுக் காணிக்கை
  rationale: இச்சொல்லின் சொற்பிறப்பும் பலிச் சூழலும் நெருப்போடு உள்ள தொடர்பைத் தெளிவாகக் காட்டுகின்றன. ‘உணவுக் காணிக்கை’ என்பதும் சாத்தியமான சூழல்சார் விளக்கம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குச் சொற்களின் துல்லியத்தைப் பேணியபடி இயல்பாக வடிவமைக்கப்பட்டது. முந்தைய வசனத்தோடு தொடரும் וְ என்பதற்கு ‘மேலும்’ பயன்படுத்தப்பட்டது; தமிழில் தெளிவுக்காக கட்டளைப் பொருள் ‘செலுத்த வேண்டும்’ என வெளிப்படுத்தப்பட்டது.
