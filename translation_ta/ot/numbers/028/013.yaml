revisions:
- from: மேலும், ஒவ்வோர் ஆட்டுக்குட்டிக்கும் எண்ணெய் கலந்து செய்த மெல்லிய மாவில் ஓர் எப்பாவின் பத்தில் ஒரு பங்கைத் தானியக் காணிக்கையாகச் செலுத்த வேண்டும். அது யாவேக்கு இனிய மணம் தரும் தகனபலியாகிய நெருப்புக் காணிக்கை[a].
  to: மேலும், ஒவ்வோர் ஆட்டுக்குட்டிக்கும் எண்ணெய் கலந்து செய்யப்பட்ட நன்கு அரைக்கப்பட்ட மாவில் ஓர் எப்பாவின் பத்தில் ஒரு பங்கைத் தானியக் காணிக்கையாகச் செலுத்த வேண்டும். இது யாவேக்குச் செலுத்தப்படும் இனிய நறுமணமுள்ள தகனபலியும் நெருப்புக் காணிக்கையும் ஆகும்[a].
  rationale: ‘மெல்லிய மாவு’ என்பதற்குப் பதிலாக சֹלֶת-இன் ‘fine/refined flour’ பொருளைத் தெளிவாகத் தரும் ‘நன்கு அரைக்கப்பட்ட மாவு’ பயன்படுத்தப்பட்டுள்ளது. இறுதி பலி-சூத்திரம், தானியக் காணிக்கையைத் தகனபலியுடன் தவறாக வரையறுக்காமல், மூலத்தின் சுருக்கமான இணைச்சொல் அமைப்பைத் தக்கவைத்துள்ளது. அடிக்குறிப்பு மாற்றுப் பொருளைத் தொடர்ந்து வழங்குகிறது.
