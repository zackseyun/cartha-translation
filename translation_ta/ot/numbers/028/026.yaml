  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: ta
  text: முதற்கனிகளின் நாளில், உங்கள் வாரங்களின் விழாவின்போது யாவேக்கு ஒரு புதிய தானியக் காணிக்கையைச் செலுத்தும்போது, உங்களுக்குப் பரிசுத்தக் கூட்டம்[a] இருக்க வேண்டும். வழக்கமான வேலை[b] எதையும் செய்யக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தச் சபைக்கூடல்.” இந்த எபிரெயச் சொற்றொடர் வழிபாட்டிற்காக அழைத்துக் கூட்டப்படும் புனிதமான சந்திப்பைக் குறிக்கும் தொழில்நுட்பச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடின உழைப்புக்குரிய வேலை” அல்லது “தொழில்சார்ந்த வேலை.” இந்தச் சொற்றொடர் அன்றாட வாழ்வாதாரத்தோடு தொடர்புடைய வழக்கமான உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: முதற்கனிகளின் நாளில்
  rationale: விழாவுடன் தொடர்புடைய முதற்கனிகளின் நாளைக் குறிக்கும் காலச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: בְּהַקְרִיבְכֶם
  choice: செலுத்தும்போது
  rationale: பலியிடும் சூழலில் קרב என்பது காணிக்கையை இறைவனிடம் கொண்டுவந்து அர்ப்பணிப்பதைக் குறிக்கிறது; காலத்தொடர்பையும் இவ்வடிவம் காக்கிறது.
- source_word: מִנְחָה חֲדָשָׁה
  choice: ஒரு புதிய தானியக் காணிக்கை
  rationale: ஆசாரியச் சட்டச் சூழலில் מִנְחָה பொதுவாகத் தானியக் காணிக்கையைக் குறிக்கிறது; புதிய விளைச்சலுடன் அதன் தொடர்பை ‘புதிய’ காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் வரும் இறைத் திருப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: உங்கள் வாரங்களின் பண்டிகையின்போது
  rationale: இங்கு ‘வாரங்கள்’ என்பது வாரங்களின் பண்டிகை எனப்படும் நாள்காட்டி விழாவைக் குறிக்கும் தொழில்நுட்பப் பயன்பாடு.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: வழிபாட்டிற்காக முறையாக அழைத்துக் கூட்டப்படும் புனிதச் சந்திப்பைக் குறிக்கும் வழிபாட்டுச் சொற்றொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: ஒன்றை நடத்த வேண்டும்
  rationale: ‘உங்களுக்காக அது இருக்க வேண்டும்’ என்ற எபிரெய அமைப்பின் கட்டளை வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: வழக்கமான வேலை எதையும் செய்யக்கூடாது
  rationale: விழா நாளில் தடைசெய்யப்படும் அன்றாடத் தொழில்சார்ந்த வேலையைக் குறிக்கிறது; எல்லா வகையான செயல்களும் முற்றிலும் தடை என்ற அளவுக்கு பொருளை விரிவுபடுத்தவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பட்ட உடன்படிக்கைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘முதற்கனிகள்,’ ‘தானியக் காணிக்கை,’ ‘பரிசுத்தக் கூடுகை’ ஆகிய வழிபாட்டுச் சொற்கள் சாதாரண வாசகர்களுக்கும் புரியும் வகையில் காக்கப்பட்டுள்ளன.
