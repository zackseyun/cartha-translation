  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; “யெகோவா” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: இறைப் பெயரின் எபிரெய எழுத்து வடிவத்தையும் மாற்று ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் பியேல் வடிவம் இங்கு எபிரெயக் கதைநடையின் வழக்கமான ‘பேசினார்’ என்ற பொருளைத் தருகிறது; அதைத் தொடர்ந்து வரும் לֵאמֹר உடன் இயல்பான தமிழில் இணைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகளான YHWH-ன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிபெயர்ப்பு; ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றப்படவில்லை.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: אֶל குறிக்கும் நோக்குத் திசை தமிழில் ‘-இடம்’ என்ற வேற்றுமை அமைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: மֹשֶׁה என்ற தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: இவ்வாறு கூறினார்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை, அடுத்த வசனத்தில் பேச்சு தொடர்வதைத் தெளிவுபடுத்தும் இயல்பான தமிழால் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல வசனம் YHWH என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பு; பட்டப்பெயரைப் பதிலீடு செய்யாமல் மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது. உச்சரிப்பு முற்றிலும் உறுதியானதல்ல என்பதால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடிப் பேச்சு அறிமுக நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசி, இவ்வாறு கூறினார்’ என்பது மூலத்தின் דבר ... לאמר அமைப்பைப் பாதுகாத்தபடியே தமிழில் புரியத்தக்கதாக உள்ளது.
