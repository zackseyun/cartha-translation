source:
  edition: WLC
  text: וּ/שְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְ/חַטָּ֖את לַ/יהוָ֑ה עַל עֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: ta
  text: வழக்கமான தகனபலியோடும் அதற்குரிய பானபலியோடும் கூடுதலாக, பாவநிவாரணப் பலியாக[a] ஓர் ஆண் வெள்ளாடு யாவேக்குச் செலுத்தப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மைப்படுத்தும் பலியாக.” எபிரெயச் சொல் חַטָּאת, பாவத்தையும் சடங்குசார் அசுத்தத்தையும் நீக்கும் பலியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ஆண் வெள்ளாடு
  rationale: பலியிடும் சூழலில் இச்சொற்றொடர் ஆண் வெள்ளாட்டைக் குறிக்கிறது; விலங்கின் பாலினத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: பலிக்கான எண்ணிக்கை ஒன்றே என்பதை எபிரெய எண்ணுக்கேற்ப வெளிப்படையாகக் காட்டுகிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: பலிச்சட்டச் சூழலில் חַטָּאת பாவத்தையோ சடங்குத் தீட்டையோ கையாளும் பலியைக் குறிக்கலாம். தமிழில் அறியப்பட்ட வழக்கை முதன்மை உரையில் வைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: எபிரெய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பெயராகவே தமிழில் வழங்குகிறது.
- source_word: עַל
  choice: கூடுதலாக
  rationale: இங்கு இடவியல் பொருள் அல்லாமல், வழக்கமான பலியுடன் சேர்த்து அளிக்கப்படுவதைத் தெரிவிக்கிறது.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமான தகனபலி
  rationale: தொடர்ந்து நிர்ணயிக்கப்பட்ட முறையில் செலுத்தப்படும் பலியைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘தினசரி’ என்ற காலவரையறையைச் சேர்க்கவில்லை.
- source_word: יֵעָשֶׂה
  choice: செலுத்தப்பட வேண்டும்
  rationale: சொல்லடிப்படையில் ‘செய்யப்பட வேண்டும்’ என்றாலும், பலியிடும் சூழலில் இயல்பான தமிழாக பலி செலுத்தப்படுவதை வெளிப்படுத்துகிறது.
- source_word: וְנִסְכּוֹ
  choice: அதற்குரிய பானபலி
  rationale: தகனபலியுடன் இணைந்த திரவப் படையலைத் தெளிவாகக் குறிக்கிறது; உடைமைப் பின்னொட்டை ‘அதற்குரிய’ எனப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு எழுத்து இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் தனிப்பெயராகப் பேணுகிறது. தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மாற்று வடிவம்.
- issue: பலிச்சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: மரபாகவும் பொதுவாகவும் புரியக்கூடிய சொல்லை முதன்மை உரையில் தருகிறது; இப்பலி சடங்குத் தீட்டைப் போக்கும் செயலையும் குறிக்கலாம் என்ற உண்மையான பொருள் நுட்பத்தை அடிக்குறிப்பில் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமான தொனியைப் பேணும் இயல்பான நடை. பலிச்சொற்களில் பரவலாகப் புரியும் ‘தகனபலி’, ‘பானபலி’, ‘பாவநிவாரணப் பலி’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன.
