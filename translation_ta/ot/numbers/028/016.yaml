source:
  edition: WLC
  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: ta
  text: முதல் மாதத்தின் பதினான்காம் நாள் யாவேக்குரிய[a] பஸ்கா ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்காக.” எபிரேய முன்னிடைச்சொல் அர்ப்பணிப்பையோ உரிமைத் தொடர்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: முதல் மாதத்தில்
  rationale: தொடக்க וּ இணைப்பைத் தமிழில் தனியாக மொழிபெயர்க்காமல் விடுவது இயல்பான தொடர்ச்சியைத் தருகிறது; בַחֹדֶשׁ הָרִאשׁוֹן என்பதன் காலக் குறிப்பை ‘முதல் மாதத்தில்’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּ/אַרְבָּעָה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: மாதத்தின் பதினான்காம் நாள்
  rationale: இது எபிரேய வழக்கிலுள்ள தேதிக் குறிப்பு. தமிழில் இயல்பாக இருக்கும்படி முந்தைய ‘முதல் மாதம்’ என்பதோடு இணைத்து ‘முதல் மாதத்தின் பதினான்காம் நாள்’ என அமைக்கப்பட்டுள்ளது.
- source_word: פֶּסַח
  choice: பஸ்கா
  rationale: யூதர்களின் இந்தக் குறிப்பிட்ட பண்டிகை மற்றும் அனுசரிப்பைக் குறிக்கும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற பெயர் ‘பஸ்கா’. ‘பஸ்கா பலி’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத பலி என்ற கருத்தை மிகையாகக் குறிப்பாக்கும்.
- source_word: לַ/יהוָה
  choice: யாவேக்குரிய
  rationale: לְ முன்னிடைச்சொல் அர்ப்பணிப்பு, தொடர்பு அல்லது உரிமையை உணர்த்தலாம். ‘யாவேக்குரிய’ என்பது எபிரேயத்தின் சுருக்கமான தொடர்பு உணர்வைப் பாதுகாக்கிறது; அர்ப்பணிப்பு சார்ந்த ‘யாவேக்காக’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: לַיהוָה என்பதில் உள்ள தொடர்பின் தன்மை
  choice: யாவேக்குரிய
  alternative: யாவேக்காக
  rationale: לְ என்பது உடைமை அல்லது தொடர்பையும், அர்ப்பணிப்பு அல்லது நோக்கத்தையும் குறிக்கக்கூடும். முதன்மை உரை தொடர்பு/உரிமை உணர்வைத் தருகிறது; நோக்கம்/அர்ப்பணிப்பு உணர்வு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான நாள்காட்டி அறிவிப்பாக அமைக்கப்பட்டுள்ளது. ‘ஆகும்’ என்பது எபிரேய பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் முழுமையாக்குகிறது; கட்டளை அல்லது பலி என்ற கருத்து சேர்க்கப்படவில்லை.
