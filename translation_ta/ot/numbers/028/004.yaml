  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶת הַ/כֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ta
  text: ஒரு ஆட்டுக்குட்டியைக் காலையில் பலியிட வேண்டும்; இரண்டாவது ஆட்டுக்குட்டியை மாலைப்பொழுதுகளுக்கு இடையில்[a] பலியிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாலைப்பொழுதுகளுக்கு இடையில்’ என்பது எபிரெய மொழியின் மரபுத்தொடர்; இது பொதுவாக அந்திப்பொழுதை அல்லது பிற்பகலின் இறுதிப் பகுதியைச் சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: இந்தச் சொல் பலியிடப்படும் இளம் செம்மறியாட்டைக் குறிக்கிறது. இவ்வசனத்தில் ஆண்பால் தனியே மீண்டும் குறிப்பிடப்படாததால், இயல்பான தமிழில் ‘ஆட்டுக்குட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: எபிரெயச் சொல் வரிசை எண்ணான ‘முதல்’ என்பதற்குப் பதிலாக எண்ணிக்கையைக் குறிக்கும் ‘ஒன்று’ என்பதையே பயன்படுத்துகிறது; ஆகவே ‘ஒரு’ என நேரடியாகத் தரப்பட்டது.
- source_word: תַּעֲשֶׂה
  choice: பலியிட வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’ என்றாலும், பலி தொடர்பான கட்டளைகளில் பலியை ஆயத்தப்படுத்திச் செலுத்துவதைக் குறிக்கிறது. ‘பலியிட வேண்டும்’ என்பது இச்சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַבֹּקֶר
  choice: காலையில்
  rationale: ‘காலை’ என்பதைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான தமிழ் காலக்குறிப்பு.
- source_word: הַשֵּׁנִי
  choice: இரண்டாவது
  rationale: இது ‘இரண்டாவது’ எனும் வரிசை எண்ணை நேரடியாகக் குறிக்கிறது; முதல் ஆட்டுக்குட்டிக்கு அடுத்ததைச் சுட்டுகிறது.
- source_word: בֵּין הָעַרְבָּיִם
  choice: இரண்டு மாலை நேரங்களுக்கு இடையில்
  rationale: எபிரெய மரபுத்தொடரின் சொல்லமைப்பைத் தக்கவைத்து, அதன் துல்லியமான நேரம் குறித்த தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது. புரிதலுக்காக அடிக்குறிப்பு சேர்க்கப்பட்டது.
