translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. எபிரெய மூலத்தின் ஒருமை இரண்டாம் நபர் கட்டளை தமிழில் இயல்பாக விடுபட்ட எழுவாயுடன் தரப்பட்டுள்ளது; காலத்தைக் குறிக்கும் விவாதத்துக்குரிய மரபுத்தொடர் முதன்மை உரையில் முறையாகப் பாதுகாக்கப்பட்டுள்ளது.
