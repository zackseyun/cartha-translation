  terminology: “ஆட்டுக்குட்டி,” “தானியப் பலி,” “பானப் பலி,” “நெருப்புப் பலி,” “இனிய நறுமணம்,” and “யாவே” are suitable modern-standard Tamil renderings. The main text retains “நெருப்புப் பலி”; the alternate “உணவுக் காணிக்கை” remains confined to the note, as in the audit trail.
