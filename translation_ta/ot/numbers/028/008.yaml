source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ta
  text: இரண்டாவது ஆட்டுக்குட்டியை மாலை நேரங்களுக்கு இடையில்[a] பலியிட வேண்டும். காலையின் தானியப் பலியைப் போலவும், அதன் பானப் பலியைப் போலவும், இதை யாவேக்கு இனிய நறுமணமான நெருப்புப் பலியாக[b] செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “மாலை நேரங்களுக்கு இடையில்”; இது பொதுவாக “அந்தி வேளையில்” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உணவுக் காணிக்கையாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: இரண்டாவது ஆட்டுக்குட்டி
  rationale: பலிச் சூழலில் כֶּבֶשׂ ஆட்டுக்குட்டியைக் குறிக்கிறது; காலைப் பலியைத் தொடர்ந்து வருவதைச் சுட்ட ‘இரண்டாவது’ தக்கவைக்கப்படுகிறது.
- source_word: תַּעֲשֶׂה
  choice: பலியிட வேண்டும் / செலுத்த வேண்டும்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், பலியைச் சார்ந்த இச்சூழலில் இயல்பான தமிழில் ‘பலியிடு’ அல்லது ‘செலுத்து’ பொருத்தமானது.
- source_word: בֵּין הָעַרְבָּיִם
  choice: மாலை நேரங்களுக்கு இடையில்
  rationale: எபிரெய மரபுத்தொடரின் வடிவத்தையும் அதன் துல்லியமான நேரம் குறித்த தெளிவின்மையையும் பாதுகாக்கும் ஒப்பீட்டளவில் நேரடி மொழிபெயர்ப்பு.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: காலையின் தானியப் பலியைப் போலவே
  rationale: ஆசாரிய பலிமுறைச் சூழலில் מִנְחָה பொதுவான காணிக்கை அல்ல, குறிப்பாகத் தானியப் பலியைக் குறிக்கிறது.
- source_word: וּכְנִסְכּוֹ
  choice: அதற்குரிய பானப் பலியைப் போலவே
  rationale: נֶסֶךְ ஊற்றிச் செலுத்தப்படும் துணைப் பலியைக் குறிக்கிறது; ‘பானப் பலி’ தெளிவான நவீனத் தமிழ் வழக்கு.
- source_word: אִשֵּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்பின் மூலம் செலுத்தப்படும் பலி என்ற சொல்லின் முக்கிய கூறை நேரடியாகப் பாதுகாக்கிறது.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணம்
  rationale: பலியை ஏற்றுக்கொள்ளும் தன்மையை வெளிப்படுத்தும் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருநான்கெழுத்துப் பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தக்கவைக்கிறது.
- issue: בֵּין הָעַרְבָּיִם என்ற கால மரபுத்தொடர்
  choice: மாலை நேரங்களுக்கு இடையில்
  alternative: அந்தி வேளையில்
  rationale: குறிப்பிடப்படும் துல்லியமான நேரம் விவாதத்திற்குரியது; எனவே மூலத்தின் தெளிவின்மையை முதன்மை உரையில் பாதுகாத்து, இயல்பான விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- issue: אִשֵּׁה என்பதன் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுக் காணிக்கை
  rationale: இச்சொல்லில் உள்ள நெருப்பு சார்ந்த பொருளை மறைக்காமல் பாதுகாக்கிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பலிமுறைச் சொற்களில் துல்லியம் காக்கப்பட்டு, விவாதத்திற்குரிய கால மரபுத்தொடர் விளக்கமின்றித் தீர்மானிக்கப்படவில்லை. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
