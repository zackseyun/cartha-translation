  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: ta
  text: வழக்கமான காலைத்தகனபலியோடு கூடுதலாக, இவற்றைச் செலுத்துங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: கூடுதலாக
  rationale: பண்டிகைக்குரிய இப்பலிகள் வழக்கமான பலிக்குப் பதிலாக அல்லாமல், அதோடு சேர்த்துச் செலுத்தப்பட வேண்டியவை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: வழக்கமான காலைக் காணிக்கையாகிய தகனபலி
  rationale: உறவுத்தொடர், காலையில் செலுத்தப்படும் தகனபலியே வழக்கமான தொடர்ச்சியான பலி என்று அடையாளப்படுத்துகிறது; ஒரு பலி மற்றொரு பலிக்காகச் செலுத்தப்படுவதாகக் கூறவில்லை.
- source_word: תַּעֲשׂוּ
  choice: செலுத்துங்கள்
  rationale: பலியிடுதல் குறித்த கட்டளையின் சூழலில் ‘செய்யுங்கள்’ என்பதைவிட ‘செலுத்துங்கள்’ என்பது இயல்பான தமிழ்ச் சொல்.
- source_word: אֶת אֵלֶּה
  choice: இவற்றையும்
  rationale: சுட்டுப்பெயர் முன்பு விதிக்கப்பட்ட பலிகளைக் குறிக்கிறது; கூடுதல் பொருளை இயல்பாக வெளிப்படுத்த ‘-யும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தகனபலி’ என்ற நிலைபெற்ற வேதாகமச் சொல் பாதுகாக்கப்பட்டுள்ளது.
