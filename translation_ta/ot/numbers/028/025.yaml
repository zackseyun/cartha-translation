  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: ta
  text: ஏழாம் நாளில் உங்களுக்குப் புனிதக் கூடுகை இருக்க வேண்டும்[a]. வழக்கமான தொழில்சார் வேலை எதையும் நீங்கள் செய்யக்கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த ஒன்றுகூடல்’ அல்லது ‘புனித ஒன்றுகூடல்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘உழைப்பின்/பணியின் வேலை எதையும்’; அதாவது, வழக்கமான தொழில்சார் வேலை எதையும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: இணைப்பிடைச்சொல்லுடன் வந்த காலக் குறிப்பை, தமிழில் இயல்பாகவும் துல்லியமாகவும் காலவெற்றுமையால் வெளிப்படுத்துகிறது; இங்கு ‘மேலும்’ என்று தனியே மொழிபெயர்க்கத் தேவையில்லை.
- source_word: מִקְרָא קֹדֶשׁ
  choice: புனிதக் கூடுகை
  rationale: முறையாக அழைத்துக் கூட்டப்படும் வழிபாட்டுக் கூட்டம் என்ற நிலையான வழிபாட்டுச் சொல்லின் பொருளைப் பாதுகாக்கிறது; ‘கூடுகை’ அழைப்பும் ஒன்றுகூடலும் சேர்ந்த நுணுக்கத்தைத் தருகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்குப் ... இருக்க வேண்டும்
  rationale: ‘உங்களுக்காக/உங்களுக்கு இருக்கட்டும்’ என்ற எபிரேய அமைப்பையும், சட்டவழங்கும் சூழலின் கட்டளை வலிமையையும் பாதுகாக்கிறது.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: வழக்கமான தொழில் வேலை
  rationale: எல்லா வகைச் செயல்களையும் அல்லாமல், புனித நாளில் விலக்கப்பட்ட வழக்கமான தொழில் அல்லது பணிசார் வேலையைக் குறிக்கும் சொற்றொடரின் சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: நீங்கள் செய்யக்கூடாது
  rationale: சட்டப்பூர்வமான தடை விதிப்பை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
