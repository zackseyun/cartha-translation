translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான சடங்குசார் நடை பயன்படுத்தப்பட்டது. அளவலகு மூலத்தில் மறைமுகமாக இருந்தாலும் அடிக்குறிப்புடன் உரையில் தெளிவுபடுத்தப்பட்டது; முந்தைய வசனத்தின் எண்ணிக்கையை முன்னிட்டு காளைகளுக்கான பகிர்வு இயல்பான தமிழில் கூறப்பட்டது.
