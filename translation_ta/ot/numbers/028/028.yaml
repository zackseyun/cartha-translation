source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֣ר הָֽ/אֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: ta
  text: 'அவற்றுக்குரிய தானியப் படையல் எண்ணெயுடன் பிசைந்த மெல்லிய மாவாக இருக்க வேண்டும்: ஒவ்வொரு காளைக்கும் மூன்று பத்தில்-ஒரு-பங்கு அளவுகள்[a], அந்த ஒரு செம்மறியாட்டுக் கடாவுக்கு இரண்டு பத்தில்-ஒரு-பங்கு அளவுகள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மூன்று பத்தில்-ஒரு-பங்கு அளவுகள்” என்றும், பின்னர் “இரண்டு பத்தில்-ஒரு-பங்கு அளவுகள்” என்றும் உள்ளது. இப்பலிச் சூழலில் இவை பொதுவாக எப்பாவின் பத்தில் ஒரு பங்கு அளவுகளாகப் புரிந்துகொள்ளப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்குரிய தானியப் படையல்
  rationale: பலிகளுடன் சேர்த்துச் செலுத்தப்படும் மִנְחָה இச்சடங்குச் சூழலில் பொதுவான காணிக்கையல்ல, தானியப் படையலைக் குறிக்கிறது. பின்னொட்டு முன்வசனத்தில் கூறப்பட்ட பலிகளைக் குறிக்கிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலிச் சட்டங்களில் பயன்படும் நன்றாக அரைக்கப்பட்ட உயர்தர மாவை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெயுடன் பிசைந்த
  rationale: எண்ணெயோடு கலந்து தயாரிக்கப்பட்ட மாவைக் குறிக்கும் செயப்பாட்டு வடிவத்தின் சடங்குசார் பொருளைப் பாதுகாக்கிறது.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் மூன்று பங்கு
  rationale: עִשָּׂרוֹן என்பது பத்தில் ஒரு பங்கு அளவு; இப்பலிச் சட்டச் சூழலில் அது எப்பாவின் பத்தில் ஒரு பங்காகப் புரிந்துகொள்ளப்படுகிறது. அளவைக் குறிப்பில் வெளிப்படையாகச் சொல்வது தமிழ் வாசகருக்குத் தெளிவளிக்கிறது.
- source_word: לַפָּר הָאֶחָד
  choice: ஒவ்வொரு காளைக்கும்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் 'அந்த ஒரு காளைக்கு' என்றாலும், முன்வசனத்தில் இரண்டு காளைகள் உள்ளதால் பகிர்ந்தளிக்கும் பொருளில் தமிழில் 'ஒவ்வொரு காளைக்கும்' என்பது இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ஓர் எப்பாவில் பத்தில் இரண்டு பங்கு
  rationale: இரண்டு பத்தில்-ஒரு-பங்கு அளவுகள் என்பதைக் குறிக்கிறது; இச்சூழலில் எப்பாவை அளவலகாக வெளிப்படுத்துவது தெளிவானது.
- source_word: לָאַיִל הָאֶחָד
  choice: அந்த ஒரு செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל என்பது ஆண் செம்மறியாடு. முன்வசனத்தில் ஒரு கடா மட்டுமே இருப்பதால் הָאֶחָד என்பதன் குறிப்பிட்ட ஒருமையை 'அந்த ஒரு' எனப் பாதுகாக்கிறது.
