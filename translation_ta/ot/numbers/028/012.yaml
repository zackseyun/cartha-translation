  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: ta
  text: ஒரு காளைக்காக, எண்ணெயுடன் கலந்த மெல்லிய மாவாகிய எப்பாவின் பத்தில் மூன்று பங்கைத் தானியக் காணிக்கையாக[a]வும், ஒரு கடாவுக்காக, எண்ணெயுடன் கலந்த[b] மெல்லிய மாவாகிய எப்பாவின் பத்தில் இரண்டு பங்கைத் தானியக் காணிக்கையாகவும் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “பத்தில் மூன்று” மற்றும் “பத்தில் இரண்டு”; இவை எப்பாவின் பத்தில் மூன்று மற்றும் இரண்டு பங்குகள் எனப் புரிந்துகொள்ளப்படுகின்றன.
    reason: cultural_note
  - marker: b
    text: “கலந்த” என்பதற்கு “எண்ணெயுடன் ஒன்றாகக் கலக்கப்பட்ட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים / וּשְׁנֵי עֶשְׂרֹנִים
  choice: பத்தில் மூன்று எப்பா / பத்தில் இரண்டு எப்பா
  rationale: עֶשְׂרוֹן என்பது பலியிடும் விதிமுறைகளில் எப்பாவின் பத்தில் ஒரு பங்கு அளவைக் குறிக்கிறது. தமிழ் வாசகர்களுக்காக அளவின் அடிப்படையை வெளிப்படையாகக் கூறுகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: காணிக்கைகளுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் வழிபாட்டுச் சொல்.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: இச்சூழலில் பொதுவான பரிசை அல்ல, தானியத்தால் செய்யப்பட்ட குறிப்பிட்ட காணிக்கையைச் சுட்டுகிறது.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: எண்ணெயுடன் கலந்த
  rationale: மாவும் எண்ணெயும் கலந்து தயார் செய்யப்படுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לַפָּר הָאֶחָד
  choice: ஒரு காளைக்கு
  rationale: எபிரெயச் சொற்றொடரின் தனித்தனி விலங்கைக் குறிக்கும் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது; ‘முதல் காளை’ என்ற வரிசைப் பொருளைத் திணிக்கவில்லை.
- source_word: לָאַיִל הָאֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל என்பதன் ஆண் செம்மறியாடு என்ற பொருளைத் தெளிவாக்கி, ‘முதல்’ என்ற ஆதாரமற்ற வரிசைப் பொருளைத் தவிர்க்கிறது.
