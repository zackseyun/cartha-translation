  to: ஒரு காளைக்காக, எண்ணெயுடன் கலந்த மெல்லிய மாவாகிய எப்பாவின் பத்தில் மூன்று பங்கைத் தானியக் காணிக்கையாக[a]வும், ஒரு கடாவுக்காக, எண்ணெயுடன் கலந்த[b] மெல்லிய மாவாகிய எப்பாவின் பத்தில் இரண்டு பங்கைத் தானியக் காணிக்கையாகவும் செலுத்த வேண்டும்.
  rationale: The revision clarifies the understood ephah-based fractions, retains the source’s parallel structure and sacrificial terminology, simplifies the designation of the ram without loss of meaning, and moves the lexical footnote marker to its proper textual anchor. The final command is retained as a natural contextual completion of the prescription carried over from the preceding verse.
