translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு விதிமுறைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இணை அமைப்பு காக்கப்பட்டாலும், முந்தைய வசனத்திலிருந்து தொடரும் கட்டளைப் பொருள் தமிழில் முழுமையான வாக்கியமாகத் தெளிவாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
