source:
  edition: WLC
  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: ta
  text: அதற்குரிய பானபலி ஒவ்வொரு செம்மறியாட்டுக் குட்டிக்கும்[a] கால் ஹின் அளவாக இருக்க வேண்டும். பரிசுத்த இடத்தில்[b] போதையூட்டும் பானத்தை[c] யாவேக்கு பானபலியாக ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “ஒரு செம்மறியாட்டுக் குட்டிக்கு”; சொல்லுக்குச் சொல்: “அந்த ஒரு செம்மறியாட்டுக் குட்டிக்கு.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “பரிசுத்த ஸ்தலத்தில்.”'
    reason: lexical_alternative
  - marker: c
    text: “போதையூட்டும் பானம்” என்பது திராட்சரசம் அல்லாத வேறொரு போதையூட்டும் பானத்தைக் குறிக்கிறது; அதன் துல்லியமான வகை குறிப்பிடப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: அதற்குரிய பானபலி
  rationale: பின்னொட்டு முந்தைய சூழலில் கூறப்பட்ட பலியுடன் தொடர்புடைய பானபலியைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு வழங்கப்பட்டது.
- source_word: רְבִיעִת הַהִין
  choice: கால் ஹின் அளவு
  rationale: பண்டைய அளவலகான ‘ஹின்’ மாற்றப்படாமல் வைக்கப்பட்டு, அதன் நான்கில் ஒரு பங்கு இயல்பான தமிழில் ‘கால்’ எனக் கூறப்பட்டுள்ளது.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ஒவ்வொரு செம்மறியாட்டுக் குட்டிக்கும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அந்த ஒரு குட்டிக்கு’ என்றாலும், இச்சூழலில் ஒவ்வொரு குட்டிக்கும் உரிய அளவை விநியோகப் பொருளில் குறிக்கிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: பலியிடும் சூழலில் இது அருவமான ‘பரிசுத்தத்துடன்’ என்பதைக் காட்டிலும் புனிதமான இடத்தைக் குறிக்கிறது; ‘பரிசுத்த ஸ்தலத்தில்’ என்பதைக் காட்டிலும் இது நவீன வாசகருக்கு இயல்பானது.
- source_word: הַסֵּךְ
  choice: ஊற்ற வேண்டும்
  rationale: திரவப் பலியை ஊற்றிச் செலுத்தும் கட்டளையைத் தமிழின் அறிவுறுத்தல் நடையில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: נֶסֶךְ
  choice: பானபலியாக
  rationale: திரவத்தை ஊற்றிச் செலுத்தும் பலிக்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்; மூலத்தில் மீண்டும் வரும் பலிப்பெயர் விடுபடாமல் வைக்கப்பட்டுள்ளது.
- source_word: שֵׁכָר
  choice: போதையூட்டும் பானம்
  rationale: திராட்சரசத்தைத் தவிர வேறு வகையான போதையூட்டும் பானத்தைக் குறிக்கும் பொதுப்பெயர்; குறிப்பிட்ட பானவகையை ஆதாரமின்றி நிர்ணயிக்கவில்லை.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள இறைநாமமான יהוה பெயராகவே ஒலிபெயர்க்கப்பட்டு, பலி செலுத்தப்படும் இலக்கு ‘-க்கு’ என்ற வேற்றுமையால் காட்டப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கெழுத்து இறைநாமத்தை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: בַּקֹּדֶשׁ என்பதன் இடப்பொருள்
  choice: பரிசுத்த இடத்தில்
  alternative: பரிசுத்தத்தில்; பரிசுத்த ஸ்தலத்தில்
  rationale: பலியாராதனைச் சூழல் இடப்பொருளை ஆதரிக்கிறது; அதேவேளை ‘திருத்தலத்தில்’ என்று குறிப்பிட்ட அமைப்பை மிகையாகத் தீர்மானிக்காமல் பொதுவான இடச்சொல் பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பானபலி’, ‘பரிசுத்த இடம்’ போன்ற சொற்கள் மூலத்தின் பலியாராதனைச் சூழலைத் தெளிவாகப் பாதுகாக்கின்றன; பண்டைய அளவலகான ‘ஹின்’ மாற்றப்படாமல் வைக்கப்பட்டுள்ளது.
