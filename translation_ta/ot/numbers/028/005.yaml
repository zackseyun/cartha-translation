base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: ta
  text: மேலும், தானியக் காணிக்கையாக ஒரு எப்பாவில் பத்தில் ஒரு பங்கு நன்றாக அரைக்கப்பட்ட மாவை, கால் ஹின் அளவு இடித்துப் பெற்ற எண்ணெயுடன் கலந்து செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எப்பாவும் ஹின்னும் பண்டைய இஸ்ரவேலர் பயன்படுத்திய அளவை அலகுகள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: மேலும், ஒரு எப்பாவில் பத்தில் ஒரு பங்கு அளவான
  rationale: வாவ் இணைப்புச் சொல் முந்தைய பலி விதியுடன் இதை இணைக்கிறது. பழங்கால அளவின் துல்லியத்தைப் பாதுகாக்க ‘எப்பா’ ஒலிபெயர்க்கப்பட்டு, பத்தில் ஒரு பங்கு இயல்பான தமிழில் கூறப்படுகிறது.
- source_word: סֹלֶת
  choice: மெல்லிய மாவு
  rationale: பலிக்காகப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும்; ‘மெல்லிய மாவு’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: לְמִנְחָה
  choice: தானியக் காணிக்கையாக
  rationale: ஆசாரியச் சட்டச் சூழலில் இது பொதுவான காணிக்கையைக் காட்டிலும் தானியத்தால் செய்யப்படும் காணிக்கை வகையைக் குறிக்கிறது.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: எண்ணெயைக் கலந்து
  rationale: எண்ணெய் மாவுடன் சேர்க்கப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּתִית
  choice: இடித்துப் பெற்ற
  rationale: ஒலிவப் பழங்களை இடித்தோ நசுக்கியோ பெற்ற எண்ணெயைக் குறிக்கும் எபிரெயப் பெயரடையின் செய்முறை சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: רְבִיעִת הַהִין
  choice: கால் ஹின் அளவான
  rationale: நான்கில் ஒரு பங்கு என்ற அளவை இயல்பான ‘கால்’ என்பதாலும், பழங்கால அலகை ‘ஹின்’ என்ற ஒலிபெயர்ப்பாலும் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பலிச் சட்டத்திற்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எப்பா, ஹின் ஆகிய பழங்கால அலகுகள் மாற்றுக் கணக்கீடு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளன. ‘செலுத்த வேண்டும்’ என்பது முந்தைய வசனத்தின் கட்டளைச் சூழலை தமிழில் நிறைவு செய்ய உதவுகிறது; இவ்வசனத்தின் எபிரெய உரை தனியாக பெயர்ச்சொல் தொடராக அமைந்துள்ளது.
