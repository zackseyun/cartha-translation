source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: ta
  text: 'யாவேக்கு நெருப்புப் பலியாகிய ஒரு தகனபலியைச் செலுத்துங்கள்: மாட்டினத்தைச் சேர்ந்த இரண்டு காளைகள், ஒரு செம்மறியாட்டுக் கடா, ஓராண்டான ஆண் செம்மறியாட்டுக் குட்டிகள் ஏழு. அவை உங்களுக்குக் குறைபாடற்றவையாக இருக்க வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: செலுத்துங்கள்
  rationale: הקריב என்பதன் ஹிஃபில் வடிவம் பலியிடும் சூழலில் பலியை முன்வைத்தல் அல்லது செலுத்துதல் என்று பொருள்படும்; தமிழில் ‘செலுத்துங்கள்’ இயல்பாகவும் சடங்குசார் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: இது பலிபீட நெருப்பில் எரிக்கப்படும் காணிக்கையைக் குறிக்கும் தொழில்நுட்ப பலிச்சொல். ‘நெருப்புப் பலி’ அதன் செயற்பாட்டு தன்மையைத் தெளிவாகக் காட்டுகிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: பலிபீடத்தில் முழுவதுமாக எரிக்கப்படும் பலிவகைக்கான நிலைபெற்ற, சுருக்கமான தமிழ்ச் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה என்பதைப் பெயராகவே ஒலிபெயர்த்து, ל முன்னொட்டின் பெறுநர்/அர்ப்பணிப்பு உறவை ‘-க்கு’ எனக் காட்டுகிறது.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: இரண்டு காளைகள்
  rationale: இச்சூழலில் פָּרִים בְּנֵי בָקָר என்பது மாட்டினத்தைச் சேர்ந்த காளைகளைக் குறிக்கும்; தமிழில் ‘காளைகள்’ என்பதே இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: וְאַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது பலிக்குரிய முதிர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘செம்மறியாட்டுக் கடா’ பாலினத்தையும் விலங்கினத்தையும் தெளிவாக்குகிறது.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: ஓராண்டான ஆண் செம்மறியாட்டுக் குட்டிகள் ஏழு
  rationale: כְבָשִׂים ஆண் ஆட்டுக்குட்டிகளையும் בְּנֵי שָׁנָה ஓராண்டு வயதையும் குறிக்கின்றன; தமிழ் எண்ணிக்கை அமைப்புக்கேற்ப எண்ணை இறுதியில் வைத்துள்ளது.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: நீங்கள் செலுத்தும் இவை குறைபாடற்றவையாக இருக்க வேண்டும்
  rationale: தָּמִים பலிச்சூழலில் உடற்குறை அல்லது பழுதில்லாமையைக் குறிக்கிறது. לָכֶם தரும் இஸ்ரவேலரின் பொறுப்பு நுணுக்கத்தை இயல்பான தமிழில் ‘நீங்கள் செலுத்தும்’ என்று வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: אִשֶּׁה மற்றும் עֹלָה ஆகியவற்றின் உறவு
  choice: ‘நெருப்புப் பலியாகிய ஒரு தகனபலி’ என்ற இணைப்புரை
  alternative: ‘நெருப்புப் பலியும் தகனபலியும்’
  rationale: இங்கு עֹלָה என்பது தனியான இரண்டாவது பலி அல்ல; אִשֶּׁה எனப்படும் நெருப்புப் பலியின் வகையை விளக்கும் இணைப்புரையாக உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடையைப் பயன்படுத்தியுள்ளது. பலிச்சடங்குக்குரிய ‘தகனபலி’ போன்ற நிலைபெற்ற சொல்லாக்கம் தக்கவைக்கப்பட்டு, பட்டியல் இயல்பான தமிழ் சொல்வரிசையில் அமைக்கப்பட்டுள்ளது.
