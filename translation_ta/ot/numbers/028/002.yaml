  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: ta
  text: '“இஸ்ரவேலின் மகன்களுக்குக்[a] கட்டளையிடு; அவர்களிடம் சொல்: ‘என் காணிக்கையை—என் நெருப்புப் பலிகளுக்கான என் உணவை,[b] எனக்கு உகந்த நறுமணத்தை[c]—அதற்குரிய குறித்த நேரத்தில் எனக்குச் செலுத்துவதை கவனமாகக் கடைப்பிடியுங்கள்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘இஸ்ரவேல் மக்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எனக்கான நெருப்புப் பலிகளாகிய.’ இந்த எபிரெயச் சொல் பலிபீடத்தில் எரித்துச் செலுத்தப்படும் பலிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘உகந்த நறுமணம்’ என்பது கடவுள் ஒரு பலியை ஏற்றுக்கொள்வதைக் குறிக்கும் மரபான பலிமுறைச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: கட்டளையிட்டு
  rationale: இது மோசேக்கு அளிக்கப்படும் வலுவான கட்டளை; மென்மையான ‘அறிவுறுத்து’ என்பதைவிட மூலத்தின் வலிமையைப் பேணுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொல்லமைப்பை வெளிப்படையாகப் பேணுகிறது; இயல்பான ‘இஸ்ரவேல் மக்கள்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קָרְבָּנִי
  choice: என் காணிக்கை
  rationale: கடவுளிடம் கொண்டுவரப்படும் பலி அல்லது அர்ப்பணிப்பைக் குறிக்கும் பொதுவான வழிபாட்டுச் சொல்.
- source_word: לַחְמִי
  choice: என் உணவு
  rationale: சொல்லுக்குச் சொல் ‘என் அப்பம்’ என்றாலும், பலிச் சூழலில் உணவாகச் செலுத்தப்படும் பொருளை விரிவாகக் குறிக்கிறது.
- source_word: לְאִשַּׁי
  choice: எனக்கான நெருப்புப் பலிகள்
  rationale: பலிபீடத்தில் எரித்துச் செலுத்தப்படும் காணிக்கைகளைக் குறிக்கும் வழிபாட்டுச் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது; அதன் துல்லியமான உருவாக்கம் விவாதத்திற்குரியது என்பதால் அடிக்குறிப்பு மாற்று தரப்படுகிறது.
- source_word: רֵיחַ נִיחֹחִי
  choice: எனக்கு உகந்த நறுமணம்
  rationale: கடவுளால் ஏற்றுக்கொள்ளப்படும் பலியைக் குறிக்கும் நிலையான பலிமுறைச் சொற்றொடரை, அதன் தெளிவான புலனுணர்வு உருவகத்துடன் பேணுகிறது.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב לִי
  choice: எனக்குச் செலுத்துவதில் கவனமாக இருங்கள்
  rationale: שמר உடன் வரும் வினையெச்சம் கட்டளையை விழிப்புடன், ஒழுங்காக நிறைவேற்றுவதை வலியுறுத்துகிறது.
- source_word: בְּמוֹעֲדוֹ
  choice: அதற்குக் குறிக்கப்பட்ட நேரத்தில்
  rationale: முன்னர் குறிப்பிடப்பட்ட காணிக்கைக்குரிய நிர்ணயிக்கப்பட்ட நேரத்தை ஒருமை பின்னொட்டு சுட்டுகிறது.
theological_decisions:
- issue: ‘என் உணவு’, ‘எனக்கு உகந்த நறுமணம்’ என்ற மனித உருவகப் பலிமொழி
  choice: மூலத்தின் தெளிவான பலிமுறை உருவகங்களைப் பேணுதல்
  alternative: ‘எனக்கு ஏற்றுக்கொள்ளத்தக்க காணிக்கைகள்’ என்று கருத்தை மட்டும் விளக்கும் பொழிப்புரை
  rationale: மூலம் கடவுளுக்கான உணவு மற்றும் நறுமணம் என்ற உறுதியான வழிபாட்டு மொழியைப் பயன்படுத்துகிறது. அதை நீக்காமல் வைத்திருப்பது உரையின் இறையியல் அழுத்தத்தைப் பேணுகிறது; அடிக்குறிப்பு ‘உகந்த நறுமணம்’ என்பது ஏற்றுக்கொள்ளப்படுதலைக் குறிக்கும் மரபுச் சொற்றொடர் என்பதை விளக்குகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட கூட்டுப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை வடிவத்தை முதன்மை உரை வெளிப்படையாகப் பேணுகிறது; அது இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இணைநிலைப் பலிச்சொற்கள் கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளன; அதே நேரத்தில் ‘என் உணவு’ போன்ற திட்டமிட்ட மனித உருவக மொழி மென்மையாக்கப்படவில்லை.
