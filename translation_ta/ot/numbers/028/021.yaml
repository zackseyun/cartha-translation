  text: עִשָּׂר֤וֹן עִשָּׂרוֹן֙ תַּעֲשֶׂ֔ה לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד לְ/שִׁבְעַ֖ת הַ/כְּבָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: ta
  text: அந்த ஏழு செம்மறியாட்டுக் குட்டிகள் ஒவ்வொன்றுக்கும், ஒரு எப்பாவின் பத்தில் ஒரு பங்கை[a][b] ஆயத்தம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “பத்தில் ஒரு பங்கு, பத்தில் ஒரு பங்கு—அந்த ஒரு குட்டிக்காக, அந்த ஏழு குட்டிகளுக்காக ஆயத்தம் செய்ய வேண்டும்.” இந்தச் சொல் இருமுறை வருவது, ஒவ்வொரு குட்டிக்கும் தனித்தனியாக ஒரு பங்கு என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஒரு எப்பாவின் பத்தில் ஒரு பங்கு; இச்சூழலில் தானியக் காணிக்கைக்குப் பயன்படுத்தப்பட்ட வழக்கமான அளவு இதுவே.
    reason: cultural_note
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: ஒவ்வொன்றுக்கும் ஒரு எப்பாவில் பத்தில் ஒரு பங்கு
  rationale: 'ஒருமையில் இருமுறை வரும் அளவுப்பெயர் பகிர்ந்தளிக்கும் பொருளைத் தருகிறது: ஒவ்வொரு குட்டிக்கும் பத்தில் ஒரு பங்கு. பலி சார்ந்த இச்சூழலில் அது வழக்கமாக எப்பாவின் பத்தில் ஒரு பங்கைக் குறிக்கும்.'
- source_word: תַּעֲשֶׂה
  choice: ஆயத்தம் செய்ய வேண்டும்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செய்’ என்பதாக இருந்தாலும், தானியக் காணிக்கைக்கான அளவைத் தயாரிக்கும் இச்சூழலில் ‘ஆயத்தம் செய்’ இயல்பானது; ‘செலுத்து’ என்பது மூல வினையை விடக் குறுகிய பொருளைத் திணிக்கும்.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ஒவ்வொன்றுக்கும்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒரு குட்டிக்கு’ என்றாலும், முன் வரும் இரட்டிப்பு இதனைப் பகிர்ந்தளிக்கும் பொருளில் அமைக்கிறது; தமிழில் ‘ஒவ்வொன்றுக்கும்’ அதைத் தெளிவாகத் தருகிறது.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: அந்த ஏழு செம்மறியாட்டுக் குட்டிகளில்
  rationale: அறிவுறுத்தல் பொருந்தும் முழுத் தொகுதி ஏழு குட்டிகள் என்பதைப் பாதுகாக்கிறது; தமிழின் இயல்பான வாக்கிய அமைப்புக்காக இது தொடக்கத்தில் வைக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘செம்மறியாட்டுக் குட்டி’ என்பது כֶּבֶשׂ என்பதைக் குறிப்பாகத் தருகிறது. மூலத்தின் பகிர்ந்தளிக்கும் இரட்டிப்பு முதன்மை உரையில் ‘ஒவ்வொன்றுக்கும்’ என்றும், அதன் நேரடி வடிவம் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
