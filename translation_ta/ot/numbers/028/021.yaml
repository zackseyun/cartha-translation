  to: அந்த ஏழு செம்மறியாட்டுக் குட்டிகள் ஒவ்வொன்றுக்கும், ஒரு எப்பாவின் பத்தில் ஒரு பங்கை[a][b] ஆயத்தம் செய்ய வேண்டும்.
