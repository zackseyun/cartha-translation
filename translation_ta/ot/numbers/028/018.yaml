  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: ta
  text: முதல் நாளில் பரிசுத்தக் கூடுகை[a] நடைபெற வேண்டும்; வழக்கமான வேலை எதையும் நீங்கள் செய்யக்கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புனித ஒன்றுகூடல்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘சேவைப் பணி’; அதாவது, வழக்கமான தொழில் உழைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதல் நாளில்
  rationale: திட்டவட்டமான பெயர்ச்சொல்லுடன் வரும் காலத்தைக் குறிக்கும் முன்னிடைத் தொடர்; ‘பண்டிகையின்’ என்பது சூழலில் புரிந்தாலும் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: அதிகாரபூர்வமாக அழைக்கப்பட்ட புனித ஒன்றுகூடலைக் குறிக்கும் நிலையான வழிபாட்டுச் சொற்றொடர். ‘பரிசுத்தக் கூடுகை’ அதன் வழிபாட்டு மரியாதையையும் ஒன்றுகூடல் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: כָּל ... לֹא
  choice: எதையும் ... செய்யக்கூடாது
  rationale: எபிரெயச் சொற்றொடரின் முழுமையான தடையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: தொழில் சார்ந்த வேலை
  rationale: எல்லா செயல்களையும் அல்லாமல், வழக்கமான உழைப்பு அல்லது பணித்தொழிலைச் சுட்டுகிறது. ‘தொழில் சார்ந்த வேலை’ என்பது பழமையான அல்லது அடிமைத்தனத்தை உணர்த்தும் சொல்லாட்சியைத் தவிர்த்து அந்த வரம்பைப் பாதுகாக்கிறது.
- source_word: לֹא תַעֲשׂוּ
  choice: நீங்கள் செய்யக்கூடாது
  rationale: சமூகத்தினரைப் பன்மையில் நோக்கிக் கூறப்படும் சட்டரீதியான தடையை நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
