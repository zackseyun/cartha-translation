revisions:
- from: முதல் நாளில் பரிசுத்தக் கூடுகை[a] நடைபெற வேண்டும்; தொழில் சார்ந்த வேலை எதையும் நீங்கள் செய்யக்கூடாது[b].
  to: முதல் நாளில் பரிசுத்தக் கூடுகை[a] நடைபெற வேண்டும்; வழக்கமான வேலை எதையும் நீங்கள் செய்யக்கூடாது[b].
  rationale: The revision preserves the formal cultic register and the verse’s concise legal force. ‘வழக்கமான வேலை’ naturally expresses the prohibited ordinary/service labor without implying that every action is forbidden or restricting the phrase to a person’s specific occupation. Footnote b is recast into idiomatic Tamil while retaining the lexical explanation.
