  naturalness: The sentence is clear and appropriately formal. ‘வழக்கமான வேலை’ is more idiomatic, accessible modern Tamil than ‘தொழில் சார்ந்த வேலை’ while retaining the intended contrast with all activity whatsoever.
  terminology: ‘பரிசுத்தக் கூடுகை’ suitably renders the fixed cultic expression מִקְרָא קֹדֶשׁ. The work-expression footnote should avoid the awkwardly literal ‘பணி/ஊழியத்தின் வேலை’ and explain the Hebrew phrase naturally.
