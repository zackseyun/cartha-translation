translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான கட்டளைத் தன்மை காக்கப்பட்டுள்ளது; சூழலில் தெரியும் ‘பண்டிகை’ என்ற சொல்லை வசனத்துக்குள் சேர்க்கவில்லை.
