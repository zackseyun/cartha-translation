  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் அளவுச் சுருக்கம் முதன்மை உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
