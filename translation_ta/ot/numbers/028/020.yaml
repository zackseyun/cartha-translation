id: NUM.28.20
reference: Numbers 28:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: ta
  text: 'அவற்றுக்கான தானியக் காணிக்கையை எண்ணெயோடு கலந்து பிசைந்த மெல்லிய மாவால் ஆயத்தம் செய்யுங்கள்: காளைக்கு மூன்று பத்தில் பங்கும்[a], செம்மறியாட்டுக் கடாவுக்கு இரண்டு பத்தில் பங்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூன்று பத்தில் பங்கு,” “இரண்டு பத்தில் பங்கு” என்பவை முறையே ஓர் எப்பாவின் பத்தில் மூன்று பங்கையும் பத்தில் இரண்டு பங்கையும் குறிக்கின்றன. எப்பா என்பது உலர் பொருட்களை அளக்கும் ஓர் அளவை.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: அவற்றுக்கான தானியக் காணிக்கையாக
  rationale: பலியிடப்படும் விலங்குகளைச் சுட்டும் 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டை ‘அவற்றுக்கான’ என இயல்பாக வெளிப்படுத்துகிறது; பலிச்சடங்குச் சூழலில் מִנְחָה என்பது பொதுவான காணிக்கை அல்ல, தானியக் காணிக்கை.
- source_word: סֹלֶת
  choice: மெல்லிய மாவை
  rationale: பலிக்காகப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: எண்ணெய் கலந்து பிசைந்த
  rationale: எண்ணெயோடு கலக்கப்பட்ட மாவின் தயாரிப்பு நிலையைக் குறிக்கும் எபிரெயச் செயப்பாட்டு வினையெச்சத்தின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: மூன்று பத்தில் பங்கு
  rationale: עִשָּׂרוֹן என்பது ஓர் எப்பாவின் பத்தில் ஒரு பங்கு அளவு; மூலத்தில் ‘எப்பா’ விடுபட்டுள்ள சுருக்கமான வடிவம் தமிழிலும் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לַפָּר
  choice: காளைக்கு
  rationale: குறிப்பிட்ட பலிக் காளையைச் சுட்டும் எபிரெயத் திட்டவுருபின் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: இரண்டு பத்தில் பங்கு
  rationale: முந்தைய அளவுச் சொல்லுடன் இணையான அமைப்பையும் ஒரே சொல்லாட்சியையும் காக்கிறது.
- source_word: לָאַיִל
  choice: செம்மறியாட்டுக் கடாவுக்கு
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் வேறு விலங்காகப் புரியக்கூடும் என்பதால் இனத்தையும் பாலையும் தெளிவுபடுத்துகிறது.
- source_word: תַּעֲשׂוּ
  choice: ஆயத்தம் செய்யுங்கள்
  rationale: עשה என்பதன் பரந்த ‘செய்/உருவாக்கு’ பொருளை இப்பலிச்சடங்கு வழிமுறையில் இயல்பாகத் தருகிறது; ‘பலியிடுங்கள்’ என்று மூலத்தைவிட மிகத் துல்லியப்படுத்தவில்லை.
