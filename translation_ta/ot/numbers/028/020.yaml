  to: 'அவற்றுக்கான தானியக் காணிக்கையை எண்ணெயோடு கலந்து பிசைந்த மெல்லிய மாவால் ஆயத்தம் செய்யுங்கள்: காளைக்கு மூன்று பத்தில் பங்கும்[a], செம்மறியாட்டுக் கடாவுக்கு இரண்டு பத்தில் பங்கும்.'
  rationale: The revision removes the unsupported command to ‘present/offer’ and lets ‘ஆயத்தம் செய்யுங்கள்’ render the Hebrew imperative for both measured flour portions. It retains the draft’s accurate sacrificial terminology and preserves the source’s abbreviated measurement terminology, explained in the footnote.
