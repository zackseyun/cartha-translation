  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: ta
  text: உங்கள் மாதங்களின் தொடக்கங்களில்[a], யாவேக்குத் தகனபலியாக கால்நடை மந்தையைச் சேர்ந்த இரண்டு காளைகளையும், ஒரு செம்மறியாட்டுக் கடாவையும், ஒரு வயதுடைய பழுதற்ற ஏழு ஆண் ஆட்டுக்குட்டிகளையும் செலுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உங்கள் மாதங்களின் தொடக்கங்களில்”; அதாவது, புதுநிலவு அனுசரிப்புகளின்போது.
    reason: மூலத்தின் நேரடிச் சொற்றொடரையும் அது குறிக்கும் மாதாந்திரப் புதுநிலவு அனுசரிப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: உங்கள் மாதங்களின் தொடக்கங்களில்
  rationale: ‘உங்கள் மாதங்களின் தலைப்பகுதிகளில்/தொடக்கங்களில்’ என்ற எபிரெயச் சொற்றொடரின் அமைப்பைப் பாதுகாக்கிறது; இது ஒவ்வொரு மாதத்தின் தொடக்கத்திலுள்ள அமாவாசை அனுசரிப்பைக் குறிக்கும்.
- source_word: תַּקְרִיבוּ
  choice: செலுத்துங்கள்
  rationale: பலியை இறைவனுக்கு முன் கொண்டுவந்து அர்ப்பணிக்கும் ஹிஃபில் வினையின் வழிபாட்டுச் சூழலை இயல்பான தமிழில் தருகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரிக்கப்படும் பலிவகைக்கான தெளிவான, நிலைபெற்ற தமிழ் இணைச்சொல்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் יהוה என்ற உடன்படிக்கைப் பெயரை பொதுவாக அறியப்பட்ட தமிழ் வடிவில் ஒலிபெயர்க்கிறது.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: மந்தையிலிருந்து இரண்டு காளைகள்
  rationale: கால்நடை மந்தையைச் சேர்ந்த காளைகள் என்ற பொருளையும் எண்ணிக்கையையும் இயல்பாகப் பாதுகாக்கிறது; அவை இளம் காளைகள் என்று மூலத்தைவிட அதிகமாகக் குறிப்பிடவில்லை.
- source_word: וְאַיִל אֶחָד
  choice: ஒரு செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது பலிக்குரிய வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் தெளிவற்றிருக்கக்கூடும் என்பதால் இனப்பெயர் சேர்க்கப்பட்டுள்ளது.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ஒரு வயதான ஏழு ஆட்டுக்குட்டிகள்
  rationale: ‘ஓராண்டின் புதல்வர்கள்’ என்ற எபிரெய மரபுத்தொடரை வயதைக் குறிக்கும் இயல்பான தமிழில் தருகிறது; כְּבָשִׂים ஆண் குட்டிகளைக் குறித்தாலும், தமிழில் ‘ஆட்டுக்குட்டிகள்’ இச்சூழலில் பாலினத்தைத் தனியே சொல்லாமல் இயல்பாக உள்ளது.
- source_word: תְּמִימִם
  choice: பழுதற்ற
  rationale: பலிக்குரிய விலங்குகளில் உடல் குறைபாடு இல்லாத நிலையைத் துல்லியமாகக் குறிக்கிறது.
theological_decisions:
- issue: மாதாந்திர அனுசரிப்பைக் குறிக்கும் காலச் சொற்றொடர்
  choice: உங்கள் மாதங்களின் தொடக்கங்களில்
  alternative: உங்கள் அமாவாசை நாட்களில்
  rationale: மூலத்தின் ‘மாதங்களின் தொடக்கங்கள்’ என்ற உருவக அமைப்பை முதன்மை உரையில் பாதுகாத்து, அது குறிக்கும் அமாவாசை அனுசரிப்பை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: திருநாமத்தைப் பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது. ‘யெகோவா’ தமிழில் பரவலாக அறியப்படும் வடிவம்; ‘யாவே’ மூல உச்சரிப்பிற்கு நெருக்கமான மாற்று வடிவம்.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. விலங்குகளின் பட்டியல் தெளிவாக இருக்க ‘செம்மறியாட்டுக் கடா’ பயன்படுத்தப்பட்டுள்ளது; எபிரெயச் சொற்றொடரின் உண்மையான உருவகம் முதன்மை உரையிலும் அதன் நடைமுறைப் பொருள் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
