  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். பலியியல் சொற்களில் ‘தகனபலி’, ‘நெருப்புப் பலி’ ஆகிய தெளிவான மரபுச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயச் சொற்றொடரின் சிறிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
