base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: ta
  text: இது சீனாய் மலையில் செய்யப்பட்ட, யாவேக்குச் செலுத்தப்படும் இனிய நறுமணத்திற்கான நெருப்புப் பலியான வழக்கமான தகனபலி[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ச்சியான தகனபலி.”
    reason: lexical_alternative
  - marker: b
    text: “சீனாய் மலையில் செய்யப்பட்ட” என்பது “சீனாய் மலையில் ஏற்படுத்தப்பட்ட” என்றும் புரிந்துகொள்ளப்படலாம். எபிரெயச் சொல் சொற்பட “செய்யப்பட்ட” என்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלַת
  choice: தகனபலி
  rationale: முழுவதும் நெருப்பில் எரிக்கப்படும் பலியைக் குறிக்கும் நிலைபெற்ற, தெளிவான தமிழ் வழிபாட்டுச் சொல்.
- source_word: תָּמִיד
  choice: வழக்கமான
  rationale: தொடர்ந்து நடைபெறும் ஒழுங்கான தினசரிப் பலியைச் சுட்டுகிறது; இடைவிடாத செயல் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: הָעֲשֻׂיָה
  choice: செலுத்தப்பட்ட
  rationale: எபிரெயப் பங்கேற்புவினைச் சொல் நேரடியாக ‘செய்யப்பட்ட’ எனப் பொருள்படலாம்; பலிச் சூழலில் ‘செலுத்தப்பட்ட’ என்பது இயல்பான தமிழ். அது சீனாயில் ஏற்படுத்தப்பட்டதைக் குறிக்கலாம் என்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּהַר סִינַי
  choice: சீனாய் மலையில்
  rationale: இடத்தைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: நறுமணமுள்ள
  rationale: பலியை இறைவன் ஏற்றுக்கொள்வதைச் சுட்டும் பலியியல் மொழிநடையை இயல்பாகப் பாதுகாக்கிறது; ‘இனிய நறுமணம்’ என்பதும் சாத்தியம்.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்போடு தொடர்புடைய பலியைக் குறிக்கும் சொல்லாக மூலத்தின் உருவகத் தொடர்பைப் பாதுகாக்கிறது; ‘உணவுப் படையல்’ என்ற பொருள் விவாதத்திற்குரியது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருநாமமான יהוה என்பதை பொதுப்பட்டத்தால் மாற்றாமல் பெயரொலிப்பாக வழங்குகிறது; לְ முன்னிடைச்சொல் ‘-க்கு’ எனத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைத் திருநாமத்தைப் பாதுகாக்கிறது; பொதுப்பட்டத்தைப் பதிலிடவில்லை.
- issue: רֵיחַ נִיחֹחַ என்ற பலியியல் மரபுத்தொடர்
  choice: நறுமணமுள்ள
  alternative: இனிய நறுமணமாக / மனநிறைவளிக்கும் நறுமணமாக
  rationale: இறைவன் பலியை ஏற்றுக்கொள்வதைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது; சமாதானப்படுத்தும் இயந்திரத்தனமான கருத்தைத் திணிக்கவில்லை.
- issue: הָעֲשֻׂיָה בְּהַר סִינַי என்பதன் பொருள்
  choice: சீனாய் மலையில் செலுத்தப்பட்ட
  alternative: சீனாய் மலையில் ஏற்படுத்தப்பட்ட
  rationale: பங்கேற்புவினையின் நேரடியான ‘செய்யப்பட்ட/செலுத்தப்பட்ட’ பொருளை முதன்மைப்படுத்துகிறது; பலி அங்கே நிறுவப்பட்டது என்ற சூழல்சார் வாசிப்பை அடிக்குறிப்பில் திறந்தவையாக வைக்கிறது.
