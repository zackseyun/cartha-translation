reference: Numbers 28:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: ta
  text: வழக்கமான தகனபலிக்கும் அதற்குரிய தானியபலிக்கும் கூடுதலாக, இவற்றையும் அவற்றின் பானபலிகளையும் செலுத்துங்கள்; இவை குறைபாடற்றவையாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: தவிர
  rationale: இங்கு குறிப்பிடப்படும் பலிகள் வழக்கமான பலிகளுக்கு மாற்றானவை அல்ல, அவற்றோடு கூடுதலாகச் செலுத்தப்பட வேண்டியவை என்பதைச் சூழல் தெளிவாக்குகிறது; தமிழில் ‘தவிர’ இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: עֹלַת הַתָּמִיד
  choice: வழக்கமான தகனபலி
  rationale: תָּמִיד என்பது தொடர்ந்து நிர்ணயிக்கப்பட்ட அன்றாடப் பலியைக் குறிக்கிறது; ‘வழக்கமான’ என்பது அதன் ஒழுங்கான, தொடர்ச்சியான தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: וּמִנְחָתוֹ
  choice: அதற்குரிய தானியபலி
  rationale: ஆசாரச் சட்டச் சூழலில் מִנְחָה தகனபலியுடன் செலுத்தப்படும் தானியபலியைக் குறிக்கிறது.
- source_word: תַּעֲשׂוּ
  choice: செலுத்துங்கள்
  rationale: பலியிடும் சூழலில் עשה என்பது வெறுமனே ‘செய்தல்’ அல்ல, பலியை ஆயத்தப்படுத்திச் செலுத்துவதைக் குறிக்கிறது; ‘செலுத்துங்கள்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: அவை பழுதற்றவையாக இருக்க வேண்டும்
  rationale: பலிக்குரிய விலங்குகள் உடற்குறை அல்லது பழுது அற்றவையாக இருக்க வேண்டும் என்பதே ஆசாரச் சட்டப் பொருள். לָכֶם என்பதைக் கட்டாயமாகச் சொற்சொல்லாக மொழிபெயர்ப்பது தமிழில் செயற்கையாகும்.
- source_word: וְנִסְכֵּיהֶם
  choice: அவற்றுக்குரிய பானபலிகளையும்
  rationale: נֶסֶךְ என்பது ஊற்றிச் செலுத்தப்படும் திரவப் பலியைக் குறிக்கிறது; ‘பானபலி’ தெளிவான, சுருக்கமான வழிபாட்டுச் சொல்.
theological_decisions:
- issue: תְּמִימִם என்பதன் ஆசாரச் சட்டப் பொருள்
  choice: பழுதற்றவையாக
  alternative: முழுமையானவையாக / பரிபூரணமானவையாக
  rationale: இச்சூழலில் சொல் பலியிடப்படும் விலங்குகளின் உடற்குறை அற்ற தன்மையைக் குறிக்கிறது; ஒழுக்க அல்லது ஆன்மீகப் பரிபூரணத்தை இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; ஆசாரச் சட்டத்தின் மரியாதையான நடையைக் காத்து, சொற்சொல் மொழிபெயர்ப்பால் ஏற்படும் செயற்கைத்தன்மை தவிர்க்கப்பட்டது. தொடர்ச்சியான தகனபலிக்கு ‘வழக்கமான தகனபலி’, உடற்குறை அற்ற பலிவிலங்குகளுக்கு ‘பழுதற்றவை’ என்ற தெளிவான சொற்கள் பயன்படுத்தப்பட்டன.
