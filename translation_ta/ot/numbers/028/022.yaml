language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: ta
  text: மேலும், உங்களுக்காகப் பாவநிவிர்த்தி செய்ய, பாவநிவாரணப் பலியாக ஒரு ஆண் வெள்ளாடு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ஓர் ஆண் வெள்ளாடு
  rationale: שָׂעִיר என்பது ஆண் வெள்ளாட்டைக் குறிக்கிறது; וְ இணைப்புச்சொல் தமிழ் வாக்கிய அமைப்புக்கு ஏற்றவாறு ‘-யும்’ என்பதில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலியிடல் சூழலில் חַטָּאת என்பது பாவம் என்ற கருத்தை மட்டும் அல்லாமல், அதற்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. ‘பாவநிவாரணப் பலி’ என்பது நவீன தமிழில் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் உள்ளது; ‘தூய்மைப்படுத்தும் பலி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶחָד
  choice: ஓர்
  rationale: பலியிடப்பட வேண்டிய விலங்கின் எண்ணிக்கையைச் சுட்டும் אֶחָד என்பதைக் ‘ஓர்’ என்று வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: לְ/כַפֵּר
  choice: பாவநிவிர்த்தி செய்ய
  rationale: ஆசாரியப் பலியிடல் சூழலில் כפר என்பதன் சமயவழிபாட்டு வலிமையைப் பாதுகாக்கிறது; அது எவ்வாறு செயல்படுகிறது என்ற குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பு திணிக்கவில்லை.
- source_word: עֲלֵי/כֶם
  choice: உங்களுக்காக
  rationale: இச்சூழலில் עַל + இரண்டாம் நபர் பன்மை பின்னொட்டு, மக்களின் நிமித்தமாக அல்லது அவர்களுக்காகச் செய்யப்படுவதைக் குறிக்கிறது.
theological_decisions:
- issue: பலியிடல் சூழலில் כפר என்பதன் மொழிபெயர்ப்பு
  choice: உங்களுக்காகப் பாவநிவிர்த்தி செய்ய
  alternative: உங்களுக்காகப் பரிகாரம் செய்ய
  rationale: ‘பாவநிவிர்த்தி செய்ய’ என்பது எபிரெயச் சொல்லின் சமயவழிபாட்டு மற்றும் இறையியல் கனத்தைப் பாதுகாக்கிறது; நிவிர்த்தி எந்த முறையில் நிகழ்கிறது என்பதை அதற்கு அப்பால் வரையறுக்கவில்லை.
- issue: חַטָּאת என்பது பாவப்பலியா அல்லது தூய்மைப்படுத்தும் பலியா
  choice: பாவநிவாரணப் பலி
  alternative: தூய்மைப்படுத்தும் பலி
  rationale: பலியிடல் சூழலில் வழக்கமான பொருளை முதன்மை உரை தருகிறது; சொல் கொண்டிருக்கக்கூடிய தூய்மைப்படுத்தும் நுணுக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத ‘செலுத்த வேண்டும்’ என்பது சுற்றியுள்ள கட்டளைப்பட்டியல் அமைப்பைத் தமிழில் முழுமையான வாக்கியமாகத் தருவதற்காகச் சேர்க்கப்பட்டுள்ளது.
