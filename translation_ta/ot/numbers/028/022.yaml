revisions:
- from: உங்களுக்காகப் பாவநிவிர்த்தி செய்ய, பாவநிவாரணப் பலியாக[a] ஓர் ஆண் வெள்ளாட்டையும் செலுத்த வேண்டும்.
  to: மேலும், உங்களுக்காகப் பாவநிவிர்த்தி செய்ய, பாவநிவாரணப் பலியாக ஒரு ஆண் வெள்ளாடு.
  rationale: The revision removes the unsupported finite obligation verb and retains the Hebrew’s concise, list-like sacrificial formulation. It preserves the explicit numeral, the animal’s sex, the sacrificial designation, the atonement purpose, and the lexical-alternative footnote.
