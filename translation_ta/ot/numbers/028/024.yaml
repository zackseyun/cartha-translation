revisions:
- from: இவற்றைப் போலவே ஏழு நாட்களும் ஒவ்வொரு நாளும் உணவாகிய[a] நெருப்புப் பலியை யெகோவாவுக்கு இனிய நறுமணமாகச் செலுத்துங்கள். இது வழக்கமான தகனபலிக்கும் அதற்குரிய பானபலிக்கும் கூடுதலாகச் செலுத்தப்பட வேண்டும்.[b]
  to: இவ்வாறே ஏழு நாட்களும் ஒவ்வொரு நாளும் யெகோவாவுக்கு இனிய நறுமணமான நெருப்புப் பலிக்குரிய உணவைச் செலுத்துங்கள்.[a] அது வழக்கமான தகனபலிக்கும் அதன் பானபலிக்கும் கூடுதலாகச் செலுத்தப்பட வேண்டும்.[b]
  rationale: The revised wording preserves the comparative instruction, daily seven-day scope, sacrificial-food idiom, pleasing-aroma formula, and the additive relation to the regular burnt offering. It also removes the misleading exclusionary wording from footnote b.
