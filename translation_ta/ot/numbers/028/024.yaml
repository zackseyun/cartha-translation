  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: ta
  text: இவ்வாறே ஏழு நாட்களும் ஒவ்வொரு நாளும் யெகோவாவுக்கு இனிய நறுமணமான நெருப்புப் பலிக்குரிய உணவைச் செலுத்துங்கள்.[a] அது வழக்கமான தகனபலிக்கும் அதன் பானபலிக்கும் கூடுதலாகச் செலுத்தப்பட வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நெருப்புப் பலியின் அப்பம்/உணவு.” இங்கு “உணவு” என்பது வெறும் அப்பத்தை மட்டும் அல்ல, பலியாக அளிக்கப்படும் படையலைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “தொடர்ச்சியான தகனபலிக்கும் அதன் பானபலிக்கும் மேலாக.” இச்சூழலில் வழக்கமான பலிகளோடு இவையும் சேர்த்துச் செலுத்தப்பட வேண்டும் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: இவற்றைப் போலவே
  rationale: כ முன்னொட்டின் ஒப்புமைப் பொருளை நேரடியாகப் பேணுகிறது; முன்பு குறிப்பிடப்பட்ட பலிகளைப் போன்றவற்றையே செலுத்த வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: תַּעֲשׂוּ
  choice: செலுத்துங்கள்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தல்’ என்றாலும், பலியிடும் சூழலில் இயல்பான தமிழ் வினைச்சொல் ‘செலுத்துதல்’ ஆகும்.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: ஏழு நாட்களும் ஒவ்வொரு நாளும்
  rationale: ஏழு நாட்களில் ஒவ்வொரு நாளும் இச்செயல் திரும்பச் செய்யப்பட வேண்டும் என்ற பகிர்ந்தளிக்கும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֶחֶם אִשֵּׁה
  choice: உணவாகிய நெருப்புப் பலி
  rationale: לֶחֶם இங்கு வெறும் அப்பத்தை மட்டும் குறிக்காமல் பலிக்குரிய உணவு அல்லது படையலைக் குறிக்கிறது; אִשֵּׁה என்பது நெருப்பில் செலுத்தப்படும் பலி.
- source_word: רֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமாக
  rationale: பலியை யெகோவா ஏற்றுக்கொள்வதைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் பேணுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַל עֹלַת הַתָּמִיד
  choice: வழக்கமான தகனபலிக்கு ... கூடுதலாக
  rationale: இச்சூழலில் עַל என்பது வழக்கமான தொடர்ச்சியான பலியோடு சேர்த்து செலுத்தப்படுவதைக் குறிக்கிறது.
- source_word: יֵעָשֶׂה
  choice: செலுத்தப்பட வேண்டும்
  rationale: பலியிடும் சூழலுக்கேற்றவாறு עשה-வின் செயப்பாட்டு வடிவத்தைத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: וְנִסְכּוֹ
  choice: அதற்குரிய பானபலி
  rationale: נסך என்பது ஊற்றிச் செலுத்தப்படும் பானபலியைக் குறிக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு வழக்கமான தகனபலியைக் குறிப்பதால் ‘அதற்குரிய’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப்பட்டமாக மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: רֵיחַ נִיחֹחַ என்ற பலிசார் மொழிநடையின் பொருள்
  choice: இனிய நறுமணம்
  alternative: ஏற்றுக்கொள்ளத்தக்க பலி
  rationale: ஏற்றுக்கொள்ளப்படுதல் என்ற கருத்தை விளக்கவுரையாக மட்டும் தராமல், மூலத்தின் மணம் சார்ந்த உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘தகனபலி’, ‘பானபலி’, ‘நெருப்புப் பலி’ ஆகியவை தெளிவான பலிசார் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ஒப்புமை, உணவு உருவகம், இனிய நறுமணம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
