  yaml_path: translation/ot/numbers/028/030.yaml
  text: and one male goat to make atonement for you[a].
translation:
  language: ta
  text: உங்களுக்காகப் பாவநிவிர்த்தி செய்வதற்கு ஒரு வெள்ளாட்டுக் கடாவையும் செலுத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் வினை வெளிப்படையாக இல்லை: ‘உங்களுக்காகப் பாவநிவிர்த்தி செய்வதற்கு ஒரு வெள்ளாட்டுக் கடா.’ ‘செலுத்த வேண்டும்’ என்பது முந்திய பலிப்பட்டியலிலிருந்து தமிழில் நிரப்பப்பட்டுள்ளது. இவ்வசனத்தில் பலிவகையின் பெயர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: வெள்ளாட்டுக் கடா
  rationale: பலியிடும் சூழலில் இச்சொற்றொடர் ஆண் வெள்ளாட்டைக் குறிக்கிறது. ‘வெள்ளாட்டுக் கடா’ என்பது இயல்பான நவீனத் தமிழில் விலங்கின் இனத்தையும் பாலையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: ஒரே ஒரு விலங்கு என்பதைக் குறிக்கும் எளிய எண்ணுப்பெயர்.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்வதற்கு
  rationale: ஆசாரிய பலிச்சூழலில் כפר என்பதன் பரிகாரப் பொருளைப் பாதுகாக்கிறது; நிவிர்த்தி எவ்வாறு நிகழ்கிறது என்ற குறிப்பிட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
- source_word: עֲלֵיכֶם
  choice: உங்களுக்காக
  rationale: כפר என்பதுடன் வரும் עַל, நிவிர்த்தி யாருக்காகச் செய்யப்படுகிறது என்பதைக் குறிக்கிறது.
- source_word: '[implied verbal coordination]'
  choice: செலுத்த வேண்டும்
  rationale: எபிரெய வசனம் பலிப்பட்டியலின் தொடர்ச்சியாக வினையின்றிச் சுருக்கமாக உள்ளது. தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமைய உடனடிச் சூழலிலிருந்து வினை நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: எபிரெய உரையில் வெளிப்படையாக இல்லாத பலிவகையைச் சேர்த்தல்
  choice: முதன்மை உரையில் ‘பாவநிவாரண பலியாக’ என்பதைச் சேர்க்காமல், சுருக்கமான எபிரெய அமைப்பைப் பாதுகாத்தல்
  alternative: ‘பாவநிவாரண பலியாக ஒரு வெள்ளாட்டுக் கடாவையும்’ என்று மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் இதைப் பாவநிவாரண பலியாகப் புரிந்துகொள்ள ஆதரித்தாலும், இவ்வசனத்தின் எபிரெய உரையில் חטאת இல்லை. ஆகவே அந்தச் சூழல்சார் தகவலை அடிக்குறிப்பில் தருவது மூலமொழி முன்னுரிமையையும் உண்மையான சுருக்கத்தையும் காக்கிறது.
- issue: כפר என்பதன் இறையியல் பொருள்
  choice: ‘பாவநிவிர்த்தி செய்வதற்கு’
  alternative: ‘தூய்மைப்படுத்துவதற்கு’ அல்லது ‘பரிகாரம் செய்வதற்கு’
  rationale: பலிச்சடங்கு சார்ந்த நிவிர்த்திப் பொருளைத் தெளிவாகத் தருகிறது; அதே வேளையில் நிவிர்த்தியைப் பற்றிய ஒரு குறிப்பிட்ட சமயக் கோட்பாட்டை மொழிபெயர்ப்புக்குள் இறக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பலிச்சடங்கு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான பலிப்பட்டியலுக்கு இயல்பாக அமைய ‘செலுத்த வேண்டும்’ நிரப்பப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத பலிவகை முதன்மை உரையில் சேர்க்கப்படவில்லை.
