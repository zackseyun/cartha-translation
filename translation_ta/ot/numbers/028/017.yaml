lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: பதினைந்தாம் நாளில்
  rationale: எபிரெய காலக் குறிப்பை இயல்பான நவீனத் தமிழில் வரிசை எண்ணாகத் தருகிறது.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தின்
  rationale: விழா நாட்காட்டிச் சூழலில் חֹדֶשׁ என்பது ‘மாதம்’ என்பதைக் குறிக்கிறது.
- source_word: חָג
  choice: திருவிழா
  rationale: இந்தச் சொல் வெறும் விருந்தை மட்டுமல்ல, புனிதமான விழாக் கடைப்பிடிப்பையும் குறிக்கக்கூடும்; ‘திருவிழா’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கடைத்தேற்றப்பட வேண்டிய கால அளவைத் தமிழில் நேரடியாகக் குறிப்பிடுகிறது.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பம்
  rationale: புளிக்கவைக்கப்படாத அப்பத்தைக் குறிக்கும் எபிரெயப் பன்மைச் சொல்லைத் தமிழில் வழக்கமான தொகுப்பொருள் ஒருமையாகத் தருகிறது.
- source_word: יֵאָכֵל
  choice: உண்ணப்பட வேண்டும்
  rationale: நிபால் வினையின் செயப்பாட்டு வடிவத்தைப் பேணுவதோடு, இச்சூழலிலுள்ள விதிமுறையின் கட்டளைக் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
