translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் இயல்பாக்க ‘இருக்கும்’ சேர்க்கப்பட்டுள்ளது; பொருள் விரிவாக்கப்படவில்லை.
