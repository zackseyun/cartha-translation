source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: ta
  text: அன்புக்குரியவர்களே, உங்களிடையே உங்களைச் சோதிப்பதற்காக நிகழ்ந்துகொண்டிருக்கும் எரியும் துன்பத்தைக் குறித்து, ஏதோ விசித்திரமானது உங்களுக்கு நிகழ்வதுபோல் வியப்படையாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே நிகழ்ந்துகொண்டிருக்கும் எரியும் வேதனை—உங்களைச் சோதிப்பதற்காக.” πυρώσει என்ற கிரேக்கச் சொல் சொற்படியாக எரிதல் அல்லது எரியும் வேதனை என்ற நெருப்பு உருவகத்தைத் தருகிறது; πειρασμός என்பது “சோதித்தல்,” “சோதனை,” அல்லது வேறு சூழல்களில் “பாவத்திற்கான தூண்டுதல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் மேய்ப்புப் பரிவும் நிறைந்த பன்மை விளிப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ἀγαπάω/ἀγάπη என்பவற்றுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: μὴ ξενίζεσθε
  choice: வியப்படையாதீர்கள்
  rationale: எதிர்பாராத அல்லது விசித்திரமான ஒன்றென எண்ணி ஆச்சரியப்பட வேண்டாம் என்ற பொருளை இயல்பாகத் தருகிறது; பின்னர் வரும் ξένου உடனான கருத்துத் தொடர்பு தொடர்கிறது.
- source_word: τῇ ... πυρώσει
  choice: நெருப்புப் போன்ற துன்பத்தை
  rationale: πύρωσις என்பதன் நெருப்பு/எரிதல் உருவகத்தை வெளிப்படையாகக் காத்து, சூழலில் அது கடுமையான துன்பத்தைக் குறிப்பதைத் தெளிவாக்குகிறது. ‘அக்கினிச் சோதனை’ என்று மொழிபெயர்த்தால் அடுத்த πειρασμόν உடன் பொருள் மீளுருவாகும் அபாயம் உண்டு.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: கூட்டாக விசுவாசிகளின் நடுவில் நிகழும் அனுபவத்தைச் சுட்டுகிறது; தனிநபர் அனுபவத்தையும் விலக்குவதில்லை.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: உங்களைச் சோதிப்பதற்காக
  rationale: துன்பம் வழியாக அவர்களைச் சோதித்தல் என்ற சூழல்சார் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: γινομένῃ
  choice: நிகழ்ந்துகொண்டிருக்கும்
  rationale: நிகழ்காலப் பங்கேற்பெயரின் தொடர்ச்சியான அம்சத்தைத் தமிழில் காக்கிறது.
- source_word: ὡς ξένου ... συμβαίνοντος
  choice: ஏதோ விசித்திரமானது உங்களுக்கு நிகழ்வதுபோல்
  rationale: ‘அந்நியமானது/விசித்திரமானது’ என்ற ξένος பொருளையும், ξενίζεσθε உடனான சொல்விளையாட்டின் கருத்துத் தொடர்பையும் இயன்றவரை காக்கிறது.
theological_decisions:
- issue: இச்சூழலில் πειρασμός என்பதன் தன்மை
  choice: சோதித்தல்
  alternative: பாவத்திற்கான சோதனை/தூண்டுதல்; துன்பச் சோதனை
  rationale: உடனடிச் சூழல் துன்பத்தையும் எதிர்ப்பையும் பற்றியது; ஆகவே இது பாவத்திற்கு உள்ளார்ந்த தூண்டுதலைவிட, ஒருவரை நிரூபிக்கும் சோதனையைக் குறிக்கிறது. இருப்பினும் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: πύρωσις உருவகத்தின் விளக்கம்
  choice: நெருப்புப் போன்ற துன்பம்
  alternative: எரிதல்; அக்கினிச் சோதனை; நெருப்பான கடுந்துயரம்
  rationale: மூலத்தின் நெருப்பு உருவகத்தை அழிக்காமல், அது இங்கு அனுபவிக்கப்படும் கடுமையான துன்பத்தைக் குறிப்பதை வாசகருக்குத் தெளிவாக்குகிறது; சுத்திகரிப்பு என்ற குறிப்பிட்ட இறையியல் விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் மேய்ப்புப் பரிவும் கொண்ட பன்மை விளிப்பு பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் காக்கப்பட்டபடியே தமிழ் வாசிப்புக்கு இயல்பான சொல்வரிசை அமைக்கப்பட்டுள்ளது; நெருப்பு உருவகமும் ‘விசித்திரம்’ என்ற கருத்துத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
