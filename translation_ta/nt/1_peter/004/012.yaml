- from: அன்புக்குரியவர்களே, உங்களைச் சோதிப்பதற்காக உங்களிடையே நிகழ்ந்துகொண்டிருக்கும் நெருப்புப் போன்ற துன்பத்தைக் குறித்து, ஏதோ விசித்திரமானது உங்களுக்கு நிகழ்வதுபோல் வியப்படையாதீர்கள்.[a]
