revisions:
- from: ஆனால், எல்லாவற்றின் முடிவும் நெருங்கிவிட்டது.[a] ஆகவே, இறைவேண்டல்களில் ஈடுபடுவதற்காகத் தெளிந்த சிந்தனையுடன் இருந்து, விழிப்புடன் இருங்கள்.[b]
  to: ஆனால், எல்லாவற்றின் முடிவும் நெருங்கிவிட்டது.[a] ஆகவே, இறைவேண்டல்களுக்காக நிதானமான சிந்தையுடனும் விழிப்புணர்வுடனும் இருங்கள்.[b]
  rationale: The revision preserves the eschatological assertion and the Greek sequence while distinguishing sound judgment from alertness. It also renders εἰς προσευχάς with a closer, less interpretively expanded purpose expression. The footnote is adjusted so that its alternative wording is idiomatic Tamil and does not add “spiritual” as an explicit source-level qualification.
