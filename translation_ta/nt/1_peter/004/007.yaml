  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: ta
  text: ஆனால், எல்லாவற்றின் முடிவும் நெருங்கிவிட்டது.[a] ஆகவே, இறைவேண்டல்களுக்காக நிதானமான சிந்தையுடனும் விழிப்புணர்வுடனும் இருங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அருகில் இருக்கிறது.” கிரேக்க நிறைவுக்கால வினை, “நெருங்கிவிட்டது” என்றும், தற்போதைய நிலையை வலியுறுத்தி “அருகில் இருக்கிறது” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நல்ல சிந்தனையுள்ளவர்களாகவும் தெளிவான மனநிலையுள்ளவர்களாகவும் இருங்கள்.” இவ்விரு கட்டளைகளும் நிதானமான தீர்மானத்தையும் மன விழிப்புணர்வையும் வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: எல்லாவற்றின்
  rationale: நடுநிலைப் பன்மையான πᾶς, τέλος என்பதுடன் இணைந்து ‘எல்லாவற்றின் முடிவு’ என்ற அனைத்தையும் உள்ளடக்கும் பொருளைத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்திலிருந்து மென்மையான திருப்பத்தையும் இவ்வாக்கியத்தின் அவசரத்தையும் குறிக்கிறது.
- source_word: τὸ τέλος
  choice: முடிவு
  rationale: இங்கு τέλος, விளைவு அல்லது நோக்கம் என்பதைக் காட்டிலும் வரவிருக்கும் இறுதியை நேரடியாகக் குறிக்கிறது.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டது
  rationale: கிரேக்க நிறைவுக்கால வினை, நெருங்கி வந்து இப்போது அருகில் இருக்கும் நிலையைக் காட்டுகிறது; ‘நெருங்கிவிட்டது’ அந்த நிகழ்வையும் தற்போதைய நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σωφρονήσατε
  choice: தெளிந்த சிந்தனையுடன் இருந்து
  rationale: இச்சொல் நிதானமான தீர்மானத்தையும் கட்டுப்பாடுள்ள சிந்தனையையும் வலியுறுத்துகிறது. தமிழ் தொடரில் அடுத்த கட்டளையுடன் இயல்பாக இணைய இவ்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முடிவு நெருங்கிவிட்டது என்ற கூற்றிலிருந்து வரும் நடைமுறைத் தீர்மானத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: νήψατε
  choice: விழிப்புடன் இருங்கள்
  rationale: புதிய ஏற்பாட்டில் இச்சொல் உருவகமாக மன மற்றும் ஆவிக்குரிய விழிப்புணர்வைக் குறிக்கிறது; மதுவிலக்கு என்ற கருத்தைத் தேவையின்றி இறக்குமதி செய்யாமல் அந்த விழிப்பை மொழிபெயர்க்கிறது.
- source_word: εἰς προσευχάς
  choice: இறைவேண்டல்களில் ஈடுபடுவதற்காக
  rationale: εἰς இங்கு நோக்கத்தைக் குறிக்கிறது. προσευχάς என்பதன் பன்மை, ஒரே ஒரு வேண்டுதலைவிடத் தொடர்ந்து செய்யப்படும் இறைவேண்டல்களைக் குறிக்கிறது; தமிழ் இயல்புக்காக ‘ஈடுபடுவதற்காக’ என வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘எல்லாவற்றின் முடிவு’ என்பதன் இறுதிக்காலப் பொருள்
  choice: காலக்கணக்கையோ குறிப்பிட்ட இறுதிக்கால அமைப்பையோ சேர்க்காமல், நேரடியான இறுதிக்கால அறிவிப்பாக வைக்கப்பட்டது.
  alternative: ‘எல்லாவற்றின் நோக்கம்’ என்ற இருப்பியல் பொருள் அல்லது எதிர்கால இறுதியைத் தணிக்கும் முழுமையாக நிறைவேறிய பொருள்.
  rationale: வசனம் எல்லாவற்றின் முடிவு நெருங்கியிருப்பதை அறிவித்து, அதையே தெளிந்த சிந்தனைக்கும் விழிப்பான இறைவேண்டலுக்கும் அடிப்படையாக்குகிறது; குறிப்பிட்ட பிரிவுசார் இறுதிக்காலக் கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘இறைவேண்டல்’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் προσευχή-யின் மதச்சார்பற்ற தெளிவைத் தக்கவைக்கிறது. இரு கிரேக்கக் கட்டளைகளின் வேறுபாடு ‘தெளிந்த சிந்தனை’ மற்றும் ‘விழிப்பு’ எனப் பாதுகாக்கப்பட்டுள்ளது.
