review_pass:
  verdict: revise
  source_fidelity: The first clause faithfully renders Πάντων δὲ τὸ τέλος ἤγγικεν, including the perfect’s sense of an approach that has already occurred. The draft’s two Tamil descriptors broadly convey the two imperatives, but their wording and the expanded purpose phrase somewhat blur the distinct force and compact construction of σωφρονήσατε, νήψατε εἰς προσευχάς.
  naturalness: The existing sentence is understandable, but “இறைவேண்டல்களில் ஈடுபடுவதற்காகத்” is more expansive and procedural than the Greek. “நிதானமான சிந்தையுடனும் விழிப்புணர்வுடனும் இருங்கள்” is smoother modern standard Tamil and directly relates both qualities to prayer.
  terminology: “முடிவு,” “நெருங்கிவிட்டது,” and “இறைவேண்டல்கள்” are suitable. “நிதானமான சிந்தை” better represents σωφρονέω (sound, disciplined judgment), while “விழிப்புணர்வு” appropriately renders the figurative mental alertness of νήφω without importing abstinence language.
  issues:
  - severity: medium
    issue: The two imperative terms are insufficiently differentiated in the main text.
    rationale: “தெளிந்த சிந்தனையுடன்” fits νήφω especially well, while “விழிப்புடன்” can suggest simple wakefulness. The Greek first calls for sound, disciplined judgment (σωφρονήσατε), then mental alertness (νήψατε).
  - severity: low
    issue: The purpose expression is overly expanded.
    rationale: “இறைவேண்டல்களில் ஈடுபடுவதற்காக” adds a verbal notion of participation not explicit in εἰς προσευχάς. “இறைவேண்டல்களுக்காக” preserves the purpose relation more closely and naturally.
  revised_text: ஆனால், எல்லாவற்றின் முடிவும் நெருங்கிவிட்டது.[a] ஆகவே, இறைவேண்டல்களுக்காக நிதானமான சிந்தையுடனும் விழிப்புணர்வுடனும் இருங்கள்.[b]
