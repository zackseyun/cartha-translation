source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: ta
  text: ஆனால், ஒருவர் கிறிஸ்தவராகத் துன்பப்பட்டால், வெட்கப்படாமல், அந்தப் பெயரில்[a] கடவுளை மகிமைப்படுத்தட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அந்தப் பெயரில்.” இதை “அந்தப் பெயரின் காரணமாக” என்றும், சிலர் “இந்தக் காரியத்தில்” என்றும் புரிந்துகொள்கின்றனர். இது பெரும்பாலும் “கிறிஸ்தவர்” என்ற பெயரையே குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: ஆனால், கிறிஸ்தவர் என்று துன்பப்படுகிறவர்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நிபந்தனையையும் மிதமான முரண்பாட்டையும் ‘ஆனால்’ வெளிப்படுத்துகிறது. கிரேக்கத்தில் ‘துன்பப்படுகிறவர்’ என்பது பொருளால் நிரப்பப்பட வேண்டியதாக இருப்பதால், முந்தைய வசனத்தின் சூழலை இயல்பான தமிழில் தெளிவாக்குகிறது. Χριστιανός என்பதற்கு நிலைபெற்ற ‘கிறிஸ்தவர்’ என்ற பெயர் பயன்படுத்தப்படுகிறது.
- source_word: μὴ αἰσχυνέσθω
  choice: வெட்கப்படாமல்
  rationale: மூன்றாம் நபருக்கான எதிர்மறைக் கட்டளையை, அதனைத் தொடர்ந்து வரும் நேர்மறைக் கட்டளையுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்தட்டும்
  rationale: δοξάζω என்பதன் கடவுளை நோக்கிய அர்த்தமான ‘மகிமைப்படுத்து’ என்பதையும் மூன்றாம் நபர் கட்டளை வலிமையையும் காக்கிறது.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: அந்தப் பெயருக்காக
  rationale: Χριστιανός என்ற உடனடி முன்னிலையைக் குறிக்கும் ‘பெயர்’ என்ற கருத்தைக் காக்கிறது; ἐν என்பதன் காரண/அடிப்படை நுணுக்கத்தை இயல்பான தமிழில் ‘பெயருக்காக’ என வழங்குகிறது. மேலும் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἐν τῷ ὀνόματι τούτῳ என்பதில் ‘அந்தப் பெயர்’ எதைக் குறிக்கிறது?
  choice: ‘கிறிஸ்தவர்’ என்ற பெயரைத் தாங்குவதால் அல்லது அந்தப் பெயரின் காரணமாக
  alternative: ‘அந்தப் பெயரில்’; அல்லது ‘இந்தக் காரியத்தில்/நிலையில்’
  rationale: உடனடி முன்னிலை Χριστιανός என்பதால், ‘பெயர்’ என்பது ‘கிறிஸ்தவர்’ என்ற அடையாளத்தைக் குறிப்பதே இயல்பான வாசிப்பு. ஆயினும், கிரேக்க முன்னிடைச்சொல் மற்றும் சொற்றொடரின் மாற்றுப் புரிதல்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து மறைமுகமாகத் தொடரும் ‘துன்பப்படுதல்’ தமிழில் தெளிவாகச் சேர்க்கப்பட்டுள்ளது; பாலினத்தைக் குறிப்பாக முன்வைக்காத சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
