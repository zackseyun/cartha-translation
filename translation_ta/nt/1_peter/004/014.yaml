reference: 1 Peter 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: ta
  text: மேசியாவின்[b] பெயரினிமித்தம் நீங்கள் இகழப்பட்டால், நீங்கள் பேறுபெற்றவர்கள்; ஏனெனில் மகிமைக்கும் கடவுளுக்கும் உரிய ஆவி[a] உங்கள்மேல் தங்கியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளின் மகிமையான ஆவி’ என்றும்; அல்லது ‘மகிமையின் ஆவி, அதாவது கடவுளின் ஆவி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: கிரேக்கச் சொற்றொடரில் ‘மகிமை’ மற்றும் ‘கடவுள்’ என்பவை ‘ஆவி’ என்பதுடன் எவ்வாறு தொடர்புபடுகின்றன என்பது ஒன்றுக்கு மேற்பட்ட விதத்தில் புரிந்துகொள்ளப்படலாம்.
  - marker: b
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு Χριστός பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: மூலச் சொல்லின் பட்டப்பெயர் தன்மையையும் பரவலாக அறியப்பட்ட மாற்றுவடிவத்தையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: நீங்கள் இகழப்பட்டால்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம், பிறரால் வாய்மொழியாக அவமதிக்கப்படுவதையும் சமூக இழிவுக்கு ஆளாக்கப்படுவதையும் குறிக்கிறது. ‘இகழப்பட்டால்’ என்பது இயல்பான நவீனத் தமிழில் இரு கூறுகளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: மேசியாவின் பெயரினிமித்தம்
  rationale: இங்கு ἐν ὀνόματι என்பது அந்தப் பெயருடனான தொடர்பினால் அல்லது அந்த அடையாளத்தின் நிமித்தம் துன்புறுவதைக் குறிக்கிறது. ‘பெயரினிமித்தம்’ காரணத்தையும் மூலத்தின் ‘பெயர்’ என்ற சொல்லையும் காக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு வெறும் பெயராக அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பெயரின் வலிமையுடன் வருகிறது; ஆகவே ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இந்த வாழ்த்துரை போன்ற கூற்றில், கடவுளின் அங்கீகாரத்தால் கிடைக்கும் நல்வாய்ப்பை ‘பேறுபெற்றவர்கள்’ இயல்பாகக் காட்டுகிறது; வெறும் மனநிலையைக் குறிக்கும் ‘மகிழ்ச்சியானவர்கள்’ என்பதைவிட இதன் இறையியல் நிறை அதிகம்.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: மகிமைக்கும் கடவுளுக்கும் உரிய ஆவி
  rationale: ஒரே πνεῦμα என்பதுடன் ‘மகிமை’ மற்றும் ‘கடவுள்’ ஆகிய இரு மரபுத்தொடர்களையும் இணைத்து, அவற்றின் உறவை முழுமையாக விளக்கித் தீர்க்காமல் காக்கிறது. தமிழில் இரண்டு தனித்தனி ஆவிகள் என்ற தவறான எண்ணம் எழாதவாறும் அமைந்துள்ளது.
- source_word: ἀναπαύεται
  choice: உங்கள்மேல் தங்கியிருக்கிறார்
  rationale: வினைச்சொல் ஒருவர்மேல் வந்து தங்குதல் அல்லது இளைப்பாறுதல் என்ற கருத்தைக் கொண்டது. ‘தங்கியிருக்கிறார்’ என்பது தொடரும் இருப்பைக் காட்டுவதுடன், கடவுளின் ஆவியை மரியாதையுடன் குறிப்பிடுகிறது.
theological_decisions:
- issue: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα என்பதன் உட்பொருள் உறவு
  choice: ‘மகிமைக்கும் கடவுளுக்கும் உரிய ஆவி’ என்று, ஒரே ஆவியுடன் இரு கூறுகளையும் இணைத்துக் கூறுதல்.
  alternative: ‘கடவுளின் மகிமையான ஆவி’ அல்லது ‘மகிமையின் ஆவி, அதாவது கடவுளின் ஆவி’.
  rationale: கிரேக்கத்தின் சுருக்கமான அமைப்பு, இரு இணையான உடைமைத் தொடர்புகளாகவோ இரண்டாவது கூறு முதலாவதை விளக்கும் இணைப்பாகவோ புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை எந்த ஒரு விளக்கத்தையும் கட்டாயப்படுத்தாமல் அந்த இறையியல் நெருக்கடியைக் காக்கிறது.
- issue: Χριστός என்பதை பட்டப்பெயராகவா பெயராகவா வழங்குவது
  choice: ‘மேசியா’ என்று பட்டப்பெயரின் பொருளை வெளிப்படுத்துதல்.
  alternative: ‘கிறிஸ்து’.
  rationale: இந்தச் சூழலில் Χριστός என்பதன் பட்டப்பெயர் தன்மை செயலில் இருப்பதால், மொழிபெயர்க்கப்பட்ட பட்டப்பெயரான ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது; பரவலான மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெயரினிமித்தம்’ என்ற சிறிது உயர்நடை வடிவம் மூலத்தின் ‘பெயர்’ கூறையும் காரணப் பொருளையும் சுருக்கமாகக் காக்கிறது. ஆவியைச் சுட்டும் வினை மரியாதைப் பன்மையில் அமைக்கப்பட்டுள்ளது.
