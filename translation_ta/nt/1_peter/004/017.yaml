source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: ta
  text: ஏனெனில், நியாயத்தீர்ப்பு கடவுளின் குடும்பத்தாரிடமிருந்து[a] தொடங்குவதற்கான காலம் வந்துவிட்டது. அது முதலில் நம்மிடமிருந்து தொடங்குமானால், கடவுளின் நற்செய்திக்குக் கீழ்ப்படியாதவர்களின்[c] விளைவு[b] என்னவாகும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளின் வீட்டிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வீடு அல்லது குடும்பம் ஆகிய இரண்டையும் குறிக்கலாம்; இங்கு அது கடவுளின் மக்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘முடிவு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முடிவு, இறுதி நிலை, அல்லது விளைவு எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நம்ப மறுப்பவர்களின்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் நற்செய்திக்குப் பதிலளிக்கும் சூழலில் கீழ்ப்படியாமையையும் நம்பாமையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் அறிவுறுத்தலுக்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ καιρός
  choice: காலம் வந்துவிட்டது
  rationale: καιρός என்பது வெறும் கால ஓட்டத்தை அல்ல, ஏற்ற அல்லது நியமிக்கப்பட்ட நேரத்தைக் குறிக்கிறது. தமிழில் வாக்கியம் முழுமையாகவும் இயல்பாகவும் அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: நியாயத்தீர்ப்பு ... தொடங்குவதற்கான
  rationale: கிரேக்கக் கட்டமைப்பில் நியாயத்தீர்ப்பு தொடங்க வேண்டிய நேரம் என்ற பொருள் உள்ளது; தமிழில் தெளிவாக இருக்க வினையெச்சப் பெயர் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: κρίμα
  choice: நியாயத்தீர்ப்பு
  rationale: இது கண்டனம் அல்லது தண்டனை என்று மட்டும் குறுகலாக்காமல், கடவுளின் நீதிசார்ந்த மதிப்பீட்டையும் செயல்பாட்டையும் பொதுவாகக் குறிக்கிறது.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: கடவுளின் குடும்பத்தாரிடமிருந்து
  rationale: οἶκος என்பது வீடு அல்லது குடும்பம் எனப் பொருள்படலாம். தொடர்ந்து வரும் ‘நம்மிடமிருந்து’ என்பது இங்கு கட்டடத்தைவிட கடவுளின் மக்களைக் குறிப்பதை உறுதிப்படுத்துகிறது; ἀπό என்பதன் தொடக்கப்புள்ளியும் ‘இடமிருந்து’ என்பதால் காக்கப்படுகிறது.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: அது முதலில் நம்மிடமிருந்து தொடங்குமானால்
  rationale: முந்தைய கூற்றிலிருந்து ‘நியாயத்தீர்ப்பு’ மற்றும் ‘தொடங்குதல்’ ஆகியவை இயல்பாக எடுத்துக்கொள்ளப்படுகின்றன. தமிழில் தெளிவுக்காக ‘அது’ மற்றும் ‘தொடங்குமானால்’ வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
- source_word: τέλος
  choice: விளைவு
  rationale: τέλος என்பது முடிவு, இறுதி நிலை, அல்லது விளைவு எனப் பொருள்படலாம். இங்குள்ள ஒப்பீட்டு வினாவில் ‘விளைவு’ இயல்பாக இருப்பதோடு, வெறும் கால முடிவாக மட்டும் பொருள்கொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: ἀπειθούντων
  choice: கீழ்ப்படியாதவர்களின்
  rationale: இச்சொல் கீழ்ப்படியாமையையும், நற்செய்தியை நம்ப மறுக்கும் பதிலையும் உள்ளடக்கக்கூடும். முதன்மை உரை அதன் நேரடியான ஒழுக்கப் பொருளைத் தக்கவைக்கிறது.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: கடவுளின் நற்செய்திக்கு
  rationale: இந்த வேற்றுமை அமைப்பு நற்செய்திக்குக் காட்டப்படும் பதிலைச் சுட்டுகிறது; இறைச்செய்தியின் மூலமும் உரிமையும் கடவுள் என்பதைக் ‘கடவுளின்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: கடவுளின் மக்களுடன் தொடர்புடைய κρίμα என்பதன் இயல்பு
  choice: ‘நியாயத்தீர்ப்பு’ என்று மொழிபெயர்த்து, அதைத் தண்டனைத் தீர்ப்பு அல்லது ஒழுக்கப்படுத்துதல் என்று மட்டும் வரையறுக்கவில்லை.
  alternative: ‘கண்டனத் தீர்ப்பு’ அல்லது ‘ஒழுக்கப்படுத்துதல்’
  rationale: கடவுளின் சொந்த மக்களிடமே நியாயத்தீர்ப்பு தொடங்குகிறது என்ற தீவிரத்தையும், நற்செய்திக்குக் கீழ்ப்படியாதவர்களின் எதிர்கால விளைவுடனான வேறுபாட்டையும் இச்சொல் ஒருசேர காக்கிறது.
- issue: ‘கடவுளின் வீடு/குடும்பம்’ என்பதன் குறிப்பு
  choice: கடவுளின் மக்களாகிய குடும்பத்தார்
  alternative: ஆலயம் அல்லது கடவுளுக்குரிய கட்டடம்
  rationale: ‘முதலில் நம்மிடமிருந்து’ என்ற அடுத்த சொற்றொடர் தனிநபர்களால் ஆன விசுவாசச் சமூகத்தையே குறிக்கிறது; ஆகவே சமூகப் பொருள் முதன்மை உரையில் வெளிப்படுத்தப்பட்டுள்ளது.
