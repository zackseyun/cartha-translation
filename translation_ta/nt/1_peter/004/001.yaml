reference: 1 Peter 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: ta
  text: ஆகவே, மெசியா[a] மாம்சத்தில் பாடுபட்டதால், நீங்களும் அதே மனப்பாங்கை ஆயுதமாக ஏந்திக்கொள்ளுங்கள். ஏனெனில், மாம்சத்தில்[b] பாடுபட்டவர் பாவத்தை விட்டுவிட்டார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘மெசியா’ என்பதற்குப் பதிலாக ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: Christos). இங்கு அதன் பட்டப்பெயர் சார்ந்த பொருள் பேணப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: ‘மாம்சத்தில்’ என்பது கிரேக்க sarx என்ற சொல்லை நேரடியாகப் பிரதிபலிக்கிறது. இங்கு அது உடலுக்குரிய மனித வாழ்வைக் குறிக்கிறது; ‘பாவ இயல்பு’ என்பதையே கட்டாயமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: c
    text: ‘மாம்சத்தில் பாடுபட்டவர் பாவத்தை விட்டுவிட்டார்’ என்ற வாசகத்தின் பொருள் குறித்து கருத்து வேறுபாடு உள்ளது. அது குறிப்பாக மெசியாவைக் குறிக்கலாம்; அவருடைய மாதிரியில் பாடுகளை அனுபவிக்கும் விசுவாசிகளைக் குறிக்கலாம்; அல்லது பாவத்துடன் ஏற்பட்ட தீர்மானமான முறிவைப் பற்றிய பொதுக் கொள்கையாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளுடன் வருகிறது. ‘கிறிஸ்து’ என்ற மரபுவழி ஒலிபெயர்ப்புக்கு மாற்றாக, ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பெயர் சார்ந்த உணர்வைப் பேண ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவையோ அறிவுறுத்தலையோ இயல்பான தமிழில் தெளிவாக இணைக்கிறது.
- source_word: παθόντος
  choice: பாடுபட்டதால்
  rationale: இறந்தகாலப் பங்கேற்பெச்சத்தின் கால-காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σαρκὶ
  choice: மாம்சத்தில்
  rationale: உடலுக்குரிய மனித வாழ்வையும் உடல் சார்ந்த பாடுகளையும் குறிக்கும் மூலமொழியின் உருவகத்தைப் பேணுகிறது; அதை ‘பாவ இயல்பு’ என்று விளக்கிச் சுருக்கவில்லை.
- source_word: ἔννοιαν
  choice: மனப்பாங்கை
  rationale: சிந்தனை, நோக்கம், உள்ளார்ந்த தீர்மானம் ஆகியவற்றை உள்ளடக்கும் சொல்லாக அறிவுறுத்தலின் சூழலுக்கு இயல்பாக அமைகிறது.
- source_word: ὁπλίσασθε
  choice: ஆயுதமாக ஏந்திக்கொள்ளுங்கள்
  rationale: நடுநிலை கட்டளை வடிவத்தின் தற்சார்பு உணர்வையும் இராணுவ உருவகத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ὁ παθὼν
  choice: பாடுபட்டவர்
  rationale: குறிப்பிட்ட நபரை முன்கூட்டியே நிர்ணயிக்காமல், பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பெச்சத்தின் சுருக்கமான பொதுவான வடிவத்தைப் பேணுகிறது.
- source_word: πέπαυται ἁμαρτίας
  choice: பாவத்திலிருந்து ஓய்ந்துவிட்டார்
  rationale: முடிவுக்கு வந்த செயலின் தொடரும் விளைவைக் காட்டும் நிறைவு வினையின் வலிமையையும், பாவத்திலிருந்து பிரிவைக் காட்டும் வேற்றுமைத் தொடர்பையும் பேணுகிறது.
theological_decisions:
- issue: ‘மாம்சத்தில் பாடுபட்டவர் பாவத்திலிருந்து ஓய்ந்துவிட்டார்’ என்பதன் சுட்டுப்பொருளும் கருத்து வலிமையும்
  choice: இது மெசியாவை மட்டுமே குறிக்கிறதா, அவருடைய மாதிரியைப் பின்பற்றும் விசுவாசிகளைக் குறிக்கிறதா, அல்லது பாவத்துடன் ஏற்பட்ட தீர்மானமான முறிவைப் பற்றிய பொதுக் கூற்றா என்பதை முதன்மை உரை தீர்மானிக்காமல் விடுகிறது.
  alternative: இதை மெசியாவின் பாவமின்மையையும் பாவத்துடனான அவருடைய நிறைவுற்ற தொடர்பையும் மட்டும் குறிப்பதாகவோ, பாடுகளின் வழியாகப் பாவத்தின் ஆட்சியிலிருந்து முறியும் விசுவாசிகளை மட்டும் குறிப்பதாகவோ வெளிப்படையாக மொழிபெயர்க்கலாம்.
  rationale: கிரேக்க வாசகம் சுருக்கமானதும் விளக்கவுரையாளர்களிடையே விவாதிக்கப்படுவதுமாக உள்ளது. மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் அதன் இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பேணப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயுதமாக ஏந்திக்கொள்ளுங்கள்’ என்ற இராணுவ உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது. ‘மாம்சத்தில்’ என்ற மறுபடியும் வரும் சொற்றொடரும் மூலத்தின் சொல்லாட்சி ஒத்திசைவுக்காக இரு இடங்களிலும் பேணப்பட்டுள்ளது.
