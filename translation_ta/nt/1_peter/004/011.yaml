id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: ta
  text: ஒருவர் பேசினால், கடவுளின் திருவாக்குகளைப் பேசுவதுபோல் பேசட்டும்[a]; ஒருவர் தொண்டு செய்தால், கடவுள் அளிக்கும் வலிமையால் செய்வதுபோல் செய்யட்டும்[b]; எல்லாவற்றிலும் கடவுள் இயேசு மெசியா வழியாக மகிமைப்படும்படி அப்படிச் செய்யட்டும். மகிமையும் ஆட்சிவல்லமையும் என்றென்றைக்கும் அவருக்கே உரியவை[c][d]. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளின் வாக்குகளைப் பேசுவதுபோல்’ என்றும் மொழிபெயர்க்கலாம். λόγια என்பது தெய்வீக வாக்குகள் அல்லது அருளுரைகள் என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் நேரடியாக, ‘கடவுள் அளிக்கும் வலிமையிலிருந்து செய்வதுபோல்’ என்று உள்ளது.
    reason: previous_rendering
  - marker: c
    text: ‘அவருக்கே’ என்பது இலக்கணப்படி மிக இயல்பாக இயேசு மெசியாவைக் குறிக்கிறது. ஆனால் முந்தைய வாக்கியத்தை முன்னிட்டு, சிலர் இதைக் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: d
    text: 'சொல்லுக்குச் சொல்: ‘யுகங்களின் யுகங்கள்வரை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: பேசினால்
  rationale: பொதுவான நிபந்தனை அமைப்பை இயல்பான தமிழில் தருகிறது; இதைப் பிரசங்கத்துக்கு மட்டும் குறுக்கவில்லை.
- source_word: λόγια θεοῦ
  choice: கடவுளின் திருவாக்குகள்
  rationale: λόγια என்பது சாதாரண வார்த்தைகள் மட்டுமல்லாமல் தெய்வீக வாக்குகளைக் குறிக்கிறது; ‘திருவாக்குகள்’ அதன் உயர்ந்த பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: διακονεῖ
  choice: தொண்டு செய்தால்
  rationale: திருச்சபைப் பதவிக்குரிய ஊழியமாக மட்டும் குறுக்காமல், பிறருக்குச் செய்யும் பரந்த சேவையைக் குறிக்கிறது.
- source_word: ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: கடவுள் வழங்கும் வலிமையிலிருந்து
  rationale: ἐξ குறிக்கும் மூலத்தைத் தெளிவாகப் பாதுகாக்கிறது; வலிமை கடவுளிடமிருந்து வருகிறது.
- source_word: ἵνα ἐν πᾶσιν δοξάζηται ὁ θεός
  choice: இதனால் எல்லாவற்றிலும் ... கடவுள் மகிமைப்படுத்தப்படுவாராக
  rationale: ἵνα-வின் நோக்கத்தையும் δοξάζηται-யின் இறைப்பாட்டு வினையையும் தமிழில் தெளிவாகத் தருகிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா வழியாக
  rationale: διά-வின் இடைமுகப் பொருளை ‘வழியாக’ தருகிறது; Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என வழங்கப்படுகிறது.
- source_word: κράτος
  choice: ஆட்சிவல்லமை
  rationale: புகழுரையில் வரும் ஆளுகைமிக்க வல்லமை என்ற அரசர்சார்ந்த நுண்பொருளைத் தக்கவைக்கிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: முடிவுப் புகழுரையிலுள்ள ᾧ (‘அவருக்கே’) என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் அண்மைய முன்னிலையான இயேசு மெசியாவைச் சுட்டுவதாக அமைக்கப்பட்டுள்ளது.
  alternative: முந்தைய வாக்கியத்தின் மையத்தை முன்னிட்டு இது பிதாவாகிய கடவுளைக் குறிக்கலாம்; அல்லது கடவுள் இயேசு மெசியா வழியாக மகிமைப்படுவது என்ற சுருக்கமான ஒருங்கிணைந்த குறிப்பாக இருக்கலாம்.
  rationale: இலக்கணப்படி மிக அண்மைய முன்னிலை Ἰησοῦ Χριστοῦ; எனினும் கருத்தோட்டம் கடவுள் மகிமைப்படுத்தப்படுவதை மையப்படுத்துவதால் மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்க வேண்டும்.
- issue: இரு இடங்களிலும் ὡς என்பதன் வலிமை
  choice: தமிழில் புரியும் வகையில் ‘பேசுவதுபோல் பேசட்டும்’ மற்றும் ‘செய்வதுபோல் செய்யட்டும்’ என்று அறிவுறுத்தல் வினை வெளிப்படுத்தப்பட்டுள்ளது.
  alternative: ‘ஒருவர் பேசினால், கடவுளின் திருவாக்குகளாக; ஒருவர் தொண்டு செய்தால், கடவுள் வழங்கும் வலிமையிலிருந்து’ என்ற நீள்விடுபட்ட நேரடி அமைப்பு.
  rationale: கிரேக்கத்தில் வினை நீள்விடுபட்டிருந்தாலும், இயல்பான தமிழுக்கு அறிவுறுத்தல் கருத்தை வெளிப்படையாகக் காட்டுவது தேவை; இதனால் கூடுதல் கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான இறைநூல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருவாக்குகள்’, ‘மகிமை’, ‘ஆட்சிவல்லமை’ ஆகியவை உயர்ந்த கருத்தைத் தக்கவைத்தாலும் பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது. ‘கடவுள்’ ஒரேமுறையாகப் பயன்படுத்தப்பட்டு, ‘மெசியா’ பட்டமாகத் தக்கவைக்கப்பட்டுள்ளது.
