id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: ta
  text: 'ஏனெனில், பிற இனத்தாரின்[a] விருப்பத்தை நிறைவேற்று, கட்டுப்பாடற்ற வெட்கங்கெட்ட நடத்தைகளிலும்[b], இச்சைகளிலும், குடிவெறிகளிலும்[c], களியாட்டங்களிலும், குடிவிருந்துகளிலும், நெறிக்குப் புறம்பான சிலைவழிபாடுகளிலும்[d] நீங்கள் வாழ்ந்ததற்குக் கடந்த காலமே போதுமானது.


    [a] “பிற இனத்தார்” என்பது இங்கே யூதரல்லாத மக்களை, குறிப்பாக வேறு தெய்வங்களை வழிபட்டவர்களைக் குறிக்கிறது. “தேசத்தார்” என்றும் மொழிபெயர்க்கலாம்.


    [b] “கட்டுப்பாடற்ற வெட்கங்கெட்ட நடத்தைகள்” என்பதற்கான கிரேக்கச் சொல், வெட்கமற்றதும் கட்டுப்பாடற்றதுமான சிற்றின்ப நடத்தைகளைக் குறிக்கிறது.


    [c] “குடிவெறிகள்” என்பது அளவுமீறிக் குடித்து வெறிகொள்ளும் நிகழ்வுகள் அல்லது பழக்கங்களைக் குறிக்கலாம்.


    [d] “நெறிக்குப் புறம்பான” என்பதை “அனுமதிக்கப்படாத” என்றும் மொழிபெயர்க்கலாம்; சிலர் “அருவருப்பான” என்றும் பொருள்கொள்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிற இனத்தார்” என்பது இங்கே யூதரல்லாத மக்களை, குறிப்பாக வேறு தெய்வங்களை வழிபட்டவர்களைக் குறிக்கிறது. “தேசத்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கட்டுப்பாடற்ற வெட்கங்கெட்ட நடத்தைகள்” என்பதற்கான கிரேக்கச் சொல், வெட்கமற்றதும் கட்டுப்பாடற்றதுமான சிற்றின்ப நடத்தைகளைக் குறிக்கிறது.
    reason: lexical_scope
  - marker: c
    text: “குடிவெறிகள்” என்பது அளவுமீறிக் குடித்து வெறிகொள்ளும் நிகழ்வுகள் அல்லது பழக்கங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: “நெறிக்குப் புறம்பான” என்பதை “அனுமதிக்கப்படாத” என்றும் மொழிபெயர்க்கலாம்; சிலர் “அருவருப்பான” என்றும் பொருள்கொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: ஏனெனில், கடந்துபோன காலத்தில் … வாழ்ந்தது போதும்
  rationale: ἀρκετός என்பதன் ‘போதும்/போதுமானது’ என்ற பொருளையும், γάρ என்பதன் விளக்கத் தொடர்பையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: பிற இனத்தாரின் விருப்பம்
  rationale: βούλημα என்பது விருப்பம், நோக்கம், சித்தம் ஆகிய பொருட்களைத் தரலாம். இச்சூழலில் ἐθνῶν யூதரல்லாத, வேறு தெய்வங்களை வழிபட்ட மக்களைக் குறிக்கிறது; ‘பிற இனத்தார்’ மரியாதையானதும் சூழலுக்கேற்றதுமான தமிழ்.
- source_word: κατειργάσθαι
  choice: நிறைவேற்றி
  rationale: செய்துமுடித்தல் அல்லது நடைமுறைப்படுத்துதல் என்ற வலிமையைத் தருகிறது; perfect infinitive சுட்டும் முற்கால நிறைவேற்றப்பட்ட செயல், ‘கடந்துபோன காலத்தில் … வாழ்ந்தது’ என்ற முழு அமைப்பில் வெளிப்படுகிறது.
- source_word: πεπορευμένους
  choice: வாழ்ந்தது
  rationale: இங்கு πορεύομαι என்பது நேரடியாகப் பயணம் செய்வதை அல்ல, ஒழுக்க நடத்தையில் வாழ்வதைக் குறிக்கிறது. தமிழ் வாசகருக்கு ‘வாழ்ந்தது’ இயல்பானது.
- source_word: ἀσελγείαις
  choice: வெட்கங்கெட்ட செயல்கள்
  rationale: வெட்கமற்ற, கட்டுப்பாடற்ற சிற்றின்ப நடத்தையை உள்ளடக்கும் பரந்த பொருளைத் தருகிறது. கிரேக்கப் பன்மையின் மீளும் செயல்கள் என்ற நுணுக்கம் தமிழில் ‘செயல்கள்’ என்பதால் காக்கப்படுகிறது.
- source_word: ἐπιθυμίαις
  choice: இச்சைகள்
  rationale: சொல்லின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது. இச்சொல் தனியே நல்ல அல்லது தீய ஆசையைக் குறிக்கக்கூடும்; இங்குள்ள தீய பொருள் சுற்றியுள்ள தீச்செயல் பட்டியலால் தெளிவாகிறது.
- source_word: οἰνοφλυγίαις
  choice: குடிவெறிகள்
  rationale: அளவுமீறிய மதுக்குடிப்பும் அதனால் உண்டாகும் வெறிநிலைகளும் மீண்டும் மீண்டும் நிகழ்வதைக் குறிக்கும் அரிய பன்மைச் சொல்லுக்கு சுருக்கமான இணை.
- source_word: κώμοις
  choice: களியாட்டங்கள்
  rationale: குடிப்பும் கட்டுப்பாடற்ற கொண்டாட்டமும் சேர்ந்த ஆரவார விருந்துகளைக் குறிக்கும்; நவீனத் தமிழில் எளிதில் புரியும்.
- source_word: πότοις
  choice: குடிவிருந்துகள்
  rationale: மது அருந்துவதை மையமாகக் கொண்ட சமூகக் கூடுகைகள் அல்லது குடிப்புக் கொண்டாட்டங்களைக் குறிக்கிறது; κώμοις என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: நெறிக்குப் புறம்பான சிலைவழிபாடுகள்
  rationale: ἀθέμιτος என்பதிலுள்ள அனுமதிக்கப்படாத, ஏற்றுக்கொள்ளப்பட்ட தெய்வீக நெறிக்கு முரணான தன்மையைத் தருகிறது; வெறும் உணர்ச்சிவசப்பட்ட ‘அருவருப்பான’ என்ற தீவிரப்படுத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἐθνῶν என்பதன் அடையாளம்
  choice: பிற இனத்தார்
  alternative: தேசத்தார்; யூதரல்லாதவர்கள்; பிறதெய்வ வழிபாட்டினர்
  rationale: பேதுருவின் சூழலில் இது பொதுவான புவியியல் தேசங்களை மட்டும் அல்லாமல் யூதரல்லாத சமூகத்தையும் அவர்களுடைய முந்தைய வாழ்க்கை முறையையும் குறிக்கிறது. பிரதான உரை பழக்கமான வேதாகமப் பொருளைத் தக்கவைக்கிறது; அடிக்குறிப்பு சூழலை விளக்குகிறது.
- issue: ἐπιθυμίαις என்பதன் ஒழுக்க மதிப்பு
  choice: இச்சைகள்
  alternative: தீய ஆசைகள்; காம இச்சைகள்
  rationale: கிரேக்கச் சொல் இயல்பில் நடுநிலையாகவும் இருக்க முடியும்; இங்கு தீச்செயல் பட்டியல் அதை எதிர்மறையாக்குகிறது. பிரதான உரையில் ‘தீய’ அல்லது ‘காம’ என்று சேர்த்து அதன் பொருள் வரம்பை தேவையின்றிக் குறுக்கவில்லை.
- issue: ἀθεμίτοις εἰδωλολατρίαις என்பதன் கண்டன வலிமை
  choice: நெறிக்குப் புறம்பான சிலைவழிபாடுகள்
  alternative: அனுமதிக்கப்படாத சிலைவழிபாடுகள்; அருவருப்பான சிலைவழிபாடுகள்
  rationale: இச்சொற்றொடர் வெறும் உணர்ச்சி அருவருப்பை அல்லாமல் அனுமதிக்கப்பட்ட நெறியை மீறுவதை முதன்மையாகக் குறிக்கிறது. எனவே சட்டம் அல்லது குறிப்பிட்ட சமய மரபை தேவையின்றி இறக்குமதி செய்யாத பொதுவான நெறிசார் மொழி தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட துணை அமைப்பை இயல்பான தமிழ் வரிசைக்கு மாற்றியபோதும், கடந்த வாழ்க்கை போதுமானது என்ற வலியுறுத்தலும் தீச்செயல் பட்டியலின் தனித்த கூறுகளும் காக்கப்பட்டன.
