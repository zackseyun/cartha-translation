id: 1PE.4.15
reference: 1 Peter 4:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: ta
  text: ஏனெனில், உங்களில் யாரும் கொலைகாரராகவோ, திருடராகவோ, தீமை செய்பவராகவோ, பிறர் காரியங்களில் தலையிடுகிறவராகவோ[a] துன்பப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிறர் விவகாரங்களில் தலையிடுபவராக.’ சொல்லுக்கு நெருக்கமாக, ‘பிறருக்குரிய காரியங்களைக் கண்காணிப்பவராக,’ அதாவது தனக்குச் சாராத விஷயங்களில் தலையிடுபவராக.
    reason: ἀλλοτριεπίσκοπος என்பது அரிதான கூட்டுச்சொல் என்பதால் அதன் மாற்றுப் பொருளையும் சொற்பொருள் அமைப்பையும் கண்ணியமான நவீனத் தமிழில் காட்டுதல்.
lexical_decisions:
- source_word: μὴ γάρ
  choice: ஏனெனில் ... கூடாது
  rationale: γάρ முந்தைய கருத்துடன் உள்ள விளக்கத் தொடர்பை ‘ஏனெனில்’ எனக் காக்கிறது; μὴ உடன் வரும் கட்டளை வடிவத்தின் தடைப்பொருளை இயல்பான நவீனத் தமிழில் ‘கூடாது’ வெளிப்படுத்துகிறது.
- source_word: τις ὑμῶν
  choice: உங்களில் யாரும்
  rationale: மறுப்புச் சூழலில் partitive genitive உடன் வரும் indefinite pronoun-ஐத் தமிழில் இயல்பாகவும் தனிநபர் வலியுறுத்தலைக் காக்கும் விதமாகவும் மொழிபெயர்க்கிறது.
- source_word: πασχέτω
  choice: துன்பப்பட
  rationale: சொல்லின் பொதுவான ‘துன்பத்தை அனுபவித்தல்’ என்ற பொருளைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தண்டனை’ என்னும் கருத்தைச் சேர்க்கவில்லை.
- source_word: ὡς
  choice: -ராகவோ / -கிறவராகவோ
  rationale: ஒருவர் எந்தச் செயலாளராக அல்லது எந்த அடிப்படையில் துன்பப்படுகிறார் என்பதைக் காட்டும் ὡς என்பதன் பங்கைத் தமிழ் வேற்றுமை அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φονεύς
  choice: கொலைகாரர்
  rationale: பொதுவான ‘கொல்பவர்’ என்பதைக் காட்டிலும் குற்றத்தன்மையுள்ள கொலையைச் செய்பவர் என்ற துல்லியமான பொருளை அளிக்கிறது.
- source_word: κλέπτης
  choice: திருடர்
  rationale: κλέπτης என்பதன் நேரடியான, வழக்கமான பொருளை நவீனத் தமிழில் தருகிறது.
- source_word: κακοποιός
  choice: தீமை செய்கிறவர்
  rationale: சட்டரீதியான ‘குற்றவாளி’ என்று குறுக்காமல், சொல்லின் பரந்த ஒழுக்கப் பொருளையும் செயற்பாட்டு நுணுக்கத்தையும் காக்கிறது.
- source_word: ἀλλοτριεπίσκοπος
  choice: பிறர் காரியங்களில் தலையிடுகிறவர்
  rationale: அரிதான கூட்டுச்சொல்லின் ‘பிறருக்குரியவற்றைக் கண்காணிப்பவர்’ என்ற சொற்பிறப்புச் சாயலை வாசகருக்குப் புரியும் எதிர்மறையான தலையீடாகத் தருகிறது; திருச்சபைப் பதவிச் சாயலைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἀλλοτριεπίσκοπος என்பதன் பொருள்
  choice: பிறர் காரியங்களில் தலையிடுகிறவர்
  alternative: பிறருடையவற்றைக் கண்காணிப்பவர்; பிறர் விஷயத்தில் மூக்கை நுழைப்பவர்
  rationale: இது அரிதானதும் பொருள் விவாதத்திற்குரியதுமான சொல். இங்கு குற்றத்துக்குரிய நடத்தைகளின் பட்டியலில் வருவதால், பிறருக்குரிய காரியங்களில் முறையற்ற தலையீடு என்ற பொருள் சூழலுக்கு ஏற்றது. அதேவேளை அடிக்குறிப்பு அதன் சொற்பொருள் சாயலையும் மாற்று சொல்லாக்கத்தையும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏனெனில்’ மூலம் சூழல் தொடர்பும், ‘துன்பப்படக் கூடாது’ மூலம் தடைப்பொருளும் காக்கப்பட்டுள்ளன. அரிதான இறுதிச் சொல்லின் தெளிவான பொருள் முதன்மை உரையில் தரப்பட்டு, அதன் உண்மையான சொற்பொருள் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
