id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: ta
  text: 'இதற்காகத்தான் இறந்தவர்களுக்கும்கூட நற்செய்தி அறிவிக்கப்பட்டது: அவர்கள் மாம்சத்தில் மனிதர்களின்படி[a] தீர்ப்புக்குள்ளாக்கப்பட்டாலும், ஆவியில்[b] கடவுளின்படி வாழும்படியாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனித அளவுகோலின்படி.’ கிரேக்கத்தில் இது ‘மனிதர்களின்படி’ என்று வந்து, ‘கடவுளின்படி’ என்பதற்கு எதிராக நிற்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆவி சார்ந்த நிலையில்.’ இச்சொல் மாம்ச வாழ்வுக்கு எதிரான ஆவிக்குரிய வாழ்வின் தளத்தைக் குறிக்கலாம்; சிலர் இதைப் பரிசுத்த ஆவியினால் கிடைக்கும் வாழ்வு என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: இதற்காகத்தான்
  rationale: முந்தைய உரையுடன் இணையும் விளக்கக் காரணத்தையும் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νεκροῖς
  choice: இறந்தவர்களுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழியை நடுநிலையாக மொழிபெயர்த்து, அவர்கள் யார் என்ற சர்ச்சைக்குரிய விளக்கத்தைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: εὐηγγελίσθη
  choice: நற்செய்தி அறிவிக்கப்பட்டது
  rationale: εὐαγγελίζω என்பதன் இறையியல் சார்ந்த நற்செய்தி அறிவித்தல் பொருளையும் செயலப்பாட்டு வடிவையும் தெளிவாகப் பேணுகிறது.
- source_word: ἵνα
  choice: வாழும்படியாகவே
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் இணைப்பைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாகத் தருகிறது.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: தீர்ப்புக்குள்ளானாலும் ... வாழும்படியாகவே
  rationale: μέν...δέ எதிர்மறை இணைப்பை விட்டுக்கொடுப்பு அமைப்பாக இயல்பாக்கி, இரு வினைகளின் வேறுபாட்டைப் பேணுகிறது.
- source_word: κατὰ ἀνθρώπους
  choice: மனிதர்களின்படி
  rationale: κατά குறிக்கும் அளவுகோல் அல்லது பார்வையைப் பேணி, κατὰ θεόν என்பதுடனான நேரடியான இணைப்பையும் காக்கிறது.
- source_word: σαρκὶ
  choice: மாம்சத்தில்
  rationale: πνεύματι என்பதுடனான திட்டமிட்ட எதிரிணையைப் பேணுகிறது; ‘பாவ இயல்பு’ என்ற கருத்தைத் தேவையின்றி உட்புகுத்தவில்லை.
- source_word: κατὰ θεὸν
  choice: கடவுளின்படி
  rationale: ‘மனிதர்களின்படி’ என்பதற்கு இணையான வடிவில் கடவுளின் அளவுகோல் அல்லது பார்வை என்ற திறந்த பொருளைப் பேணுகிறது.
- source_word: πνεύματι
  choice: ஆவியில்
  rationale: செயல் நடைபெறும் தளத்தைக் குறிக்கும் தத்தி வேற்றுமையையும் மாம்சம்/ஆவி எதிரிணையையும் பேணுகிறது; பரிசுத்த ஆவியானவரைக் குறிப்பதாகத் திட்டவட்டமாக்கவில்லை.
theological_decisions:
- issue: ‘இறந்தவர்கள்’ என்போரின் அடையாளம்
  choice: ‘இறந்தவர்கள்’ என்று மட்டும் நடுநிலையாக வழங்கப்பட்டது.
  alternative: நற்செய்தியைக் கேட்டபோது உயிருடன் இருந்து இப்போது இறந்தவர்கள்; ஆன்மீகமாக இறந்தவர்கள்; 3:19 உடன் தொடர்புடைய இறந்தோர்.
  rationale: கிரேக்க உரை இவ்வசனத்திலேயே அவர்களின் அடையாளத்தைத் தெளிவுபடுத்தவில்லை; எனவே ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கம் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- issue: ‘மாம்சத்தில் ... தீர்ப்புக்குள்ளானாலும், ஆவியில் ... வாழ’ என்ற எதிரிணை
  choice: மனிதர்கள்/கடவுள் மற்றும் மாம்சம்/ஆவி என்ற இரட்டை எதிரிணை திறந்த நிலையில் பேணப்பட்டது.
  alternative: மனிதத் தீர்ப்புக்கு உள்ளாதல்; உடல் மரணத்துக்கு உள்ளாதல்; மனித வாழ்வுத் தளத்தில் தெய்வீகத் தீர்ப்புக்கு உள்ளாதல்.
  rationale: ‘தீர்ப்பு’ யாரால் அல்லது எந்தத் துல்லியமான பொருளில் நிகழ்கிறது என்பதை உரை வெளிப்படையாகச் சொல்லாததால், அதன் இறையியல் பதற்றம் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் உள்ள நடையில் வடிவமைக்கப்பட்டது. ‘மாம்சம்’ மற்றும் ‘ஆவி’ என்ற சொற்கள் மூலத்தின் திட்டமிட்ட எதிரிணையைப் பேணுவதற்காக வைக்கப்பட்டுள்ளன; அடிக்குறிப்புகள் உண்மையான பொருள் வாய்ப்புகளை மட்டும் சுட்டுகின்றன.
