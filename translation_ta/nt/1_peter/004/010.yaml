id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: ta
  text: நீங்கள் ஒவ்வொருவரும் பெற்றுள்ள அருள்வரத்தை, கடவுளுடைய பலவகையான அருளின் நல்ல பொறுப்பாளர்களாக, ஒருவருக்கொருவர் சேவை செய்யப் பயன்படுத்துங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: பகிர்ந்தளிக்கும் ஒருமைப் பொருளைத் தக்கவைத்து, சமூகத்தின் ஒவ்வொரு உறுப்பினரையும் தனித்தனியாகக் குறிக்கிறது.
- source_word: καθὼς ἔλαβεν
  choice: தாம் பெற்றுக்கொண்ட
  rationale: பெற்றுக்கொண்டது என்ற நிகழ்வை இயல்பான தமிழில் கூறுகிறது; கொடுத்தவர் யார் என்பதை வினைச்சொல்லில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: χάρισμα
  choice: அருள்வரம்
  rationale: வெறும் ‘வரம்’ என்பதைவிட அருளால் வழங்கப்பட்ட கொடை என்ற சொல்லின் நுண்பொருளைக் காட்டுகிறது; அதேவேளையில் ‘ஆவிக்குரிய வரம்’ என்ற குறுகிய தொழில்நுட்பப் பொருளைத் திணிக்கவில்லை.
- source_word: εἰς ἑαυτοὺς
  choice: ஒருவருக்கொருவர்
  rationale: சமூகத்தினரே இந்தப் பணியின் பயனாளிகள் என்பதைக் காட்டும் இயல்பான தமிழ் வடிவம்; கிரேக்கச் சொற்றொடரின் இடம்/பயன் சார்ந்த சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: αὐτὸ διακονοῦντες
  choice: பணிசெய்யப் பயன்படுத்துங்கள்
  rationale: தொடர்பெயரெச்சத்தின் சூழல்சார் அறிவுறுத்தல் வலிமையைத் தெளிவான தமிழ்க் கட்டளையாக வெளிப்படுத்துகிறது; ‘ஊழியம்’ என்ற சமயத் தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- source_word: καλοὶ οἰκονόμοι
  choice: நல்ல பொறுப்பாளர்கள்
  rationale: தமக்குச் சொந்தமல்லாத ஒன்றை நம்பி ஒப்படைக்கப்பட்டவர்களாக நிர்வகிக்கும் பொறுப்பை நவீன வாசகருக்கு இயல்பாக உணர்த்துகிறது.
- source_word: ποικίλης χάριτος θεοῦ
  choice: கடவுளுடைய பலவகையான அருள்
  rationale: கடவுளின் அருள் பல வடிவங்களில் வெளிப்படுகிறது என்ற பொருளையும் உரிமைத் தொடர்பையும் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: χάρισμα என்பதை ‘ஆவிக்குரிய வரம்’ என்ற குறுகிய பொருளில் மொழிபெயர்ப்பதா
  choice: அருள்வரம்
  alternative: ஆவிக்குரிய வரம்; வரம்
  rationale: சூழல் விசுவாசச் சமூகத்துக்குள் அருளால் இயல்பாக்கப்பட்ட பணியைப் பற்றியது. ஆயினும், இப்பெயர்ச்சொல் தனியாக ‘ஆவிக்குரிய வரம்’ என்ற தொழில்நுட்பப் பொருளை கட்டாயப்படுத்தாததால் அதன் பரந்த பொருள் பாதுகாக்கப்படுகிறது.
- issue: εἰς ἑαυτούς என்பதன் சமூக நோக்கை எவ்வாறு வெளிப்படுத்துவது
  choice: ஒருவருக்கொருவர்
  alternative: உங்களுக்குள்ளே; ஒருவருக்காக ஒருவர்
  rationale: பணியின் பயனாளிகள் சமூக உறுப்பினர்களே என்பதை இயல்பாகக் கூறுகிறது. முன்னிடைச்சொல் மற்றும் தற்சுட்டுப் பன்மையின் இடம்/பயன் சார்ந்த நுணுக்கத்தைத் தீர்மானமாகச் சுருக்காமல் அடிக்குறிப்பில் மாற்றுகள் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையைக் காக்கும் அதேவேளையில் பொதுவாசகருக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘பணிசெய்ய’ என்பது தேவையற்ற சமயத் தொழில்நுட்பச் சாயலைத் தவிர்க்கிறது; ‘பொறுப்பாளர்கள்’ ஒப்படைக்கப்பட்டதை நிர்வகிக்கும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
