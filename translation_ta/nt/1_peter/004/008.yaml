  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: ta
  text: எல்லாவற்றிற்கும் மேலாக[a], ஒருவருக்கொருவர் தீவிரமான அன்பு கொண்டிருங்கள்[c]; ஏனெனில், அன்பு ஏராளமான பாவங்களை மூடுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவற்றிற்கும் முன்பாக.” இங்கு இந்தச் சொற்றொடர் முதன்மையாக மிகுந்த முக்கியத்துவத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்தச் சொற்கள் நீதிமொழிகள் 10:12-ஐ எதிரொலிக்கின்றன. “மூடுகிறது” என்பது குற்றங்களைத் தூண்டிவிடாமல் இருப்பது, அவற்றைப் பொருட்படுத்தாமல் விடுவது, அல்லது வெளிப்படுத்தாமல் இருப்பது என்ற பொருளையும் தரலாம்.
    reason: cross_reference
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “ஒருவருக்கொருவர் தீவிரமான அன்பைக் கொண்டவர்களாய் இருந்து.”'
    reason: source_form
