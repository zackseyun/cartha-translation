- source_word: πρὸ πάντων
  choice: எல்லாவற்றிற்கும் மேலாக
  rationale: காலவரிசையை மட்டும் அல்லாமல் முதன்மையையும் மிகுந்த முக்கியத்துவத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: εἰς ἑαυτοὺς
  choice: ஒருவர்மீது ஒருவர்
  rationale: சமூகத்திற்குள் பரஸ்பரமாகச் செலுத்தப்படும் அன்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியான, சூழலுக்கு ஏற்ற பொதுவான மொழிபெயர்ப்பு.
- source_word: ἐκτενῆ
  choice: தீவிரமான
  rationale: நீட்டிச் செலுத்தப்படும், முழு முனைப்புடனான, வலுவான அன்பு என்ற கருத்தைச் சுருக்கமாகத் தெரிவிக்கிறது; தொடர்ச்சியின் நிழற்பொருளை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: ἔχοντες
  choice: கொண்டிருங்கள்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் அறிவுறுத்தல் சூழலில் நிகழ்காலப் பங்கேற்புச் சொல்லின் கட்டளை வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: καλύπτει
  choice: மூடுகிறது
  rationale: நீதிமொழிகள் 10:12-ஐ எதிரொலிக்கும் உருவகத்தைத் தக்கவைக்கிறது; ‘மன்னிக்கிறது’ அல்லது ‘கண்டுகொள்ளாமல் விடுகிறது’ என்று பொருளை ஒரே விதமாக முடிவுசெய்யவில்லை.
- source_word: πλῆθος ἁμαρτιῶν
  choice: ஏராளமான பாவங்களை
