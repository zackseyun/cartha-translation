theological_decisions:
- issue: ‘அன்பு ஏராளமான பாவங்களை மூடுகிறது’ என்பதன் பொருள்
  choice: ‘மூடுகிறது’ என்ற உருவகத்தை விளக்கித் தீர்மானிக்காமல் தக்கவைத்தல்
  alternative: அன்பு பல குற்றங்களைப் பொருட்படுத்தாமல் விடுகிறது; அன்பு பல பாவங்களுக்கு மன்னிப்பைப் பெற்றுத் தருகிறது
  rationale: கிரேக்க வாசகம் நீதிமொழி போன்ற சுருக்கமான மறைபொருளுடன் உள்ளது; யாருடைய பாவங்கள் அல்லது அவை எவ்வாறு ‘மூடப்படுகின்றன’ என்பதை அது வெளிப்படையாகத் தீர்மானிக்கவில்லை. உருவகத்தைத் தக்கவைப்பது சம்பாதிக்கப்பட்ட மன்னிப்பு, சடங்குசார் விளைவு, அல்லது வெறும் உளவியல் சகிப்புத்தன்மை போன்ற குறிப்பிட்ட கோட்பாட்டை உரைக்குள் புகுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டது. ‘தீவிரமான’ என்பது அன்பின் முனைப்பையும் வலிமையையும் காட்டுகிறது; ‘மூடுகிறது’ என்பது மூலத்தின் உருவகத்தையும் அதன் திட்டமிட்ட பொருள் திறப்பையும் பாதுகாக்கிறது.
