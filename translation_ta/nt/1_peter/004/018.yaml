  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: ta
  text: நீதிமான் மிகுந்த சிரமத்தோடுதான் மீட்கப்படுகிறார் என்றால்,[a] இறைப்பக்தியற்றவரும் பாவியும் எங்கே தோன்றுவார்கள்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரிதாகவே மீட்கப்படுகிறார்,” “மிகுந்த சிரமத்துடன் மீட்கப்படுகிறார்.” நீதிமானின் மீட்பு கடுமையான சோதனைகளின் வழியாக நிகழ்வதை இச்சொல் குறிக்கலாம்; மீட்பு தானே நிச்சயமற்றது என்று அவசியம் பொருளல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இறைப்பக்தியற்றவரும் பாவியும் எங்கே காணப்படுவார்கள்?”
    reason: alternative_rendering
lexical_decisions:
- source_word: δίκαιος
  choice: நீதிமான்
  rationale: கட்டுரையுடன் வரும் ஒருமை ஆண்பால் பெயரடையின் பொதுப் பிரதிநிதித்துவ வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: μόλις
  choice: மிகுந்த சிரமத்தோடுதான்
  rationale: சிரமம் அல்லது கடினத்தன்மை என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இறுதி மீட்பு சந்தேகத்திற்குரியது என்று தனியே தீர்மானிக்கவில்லை.
- source_word: σῴζεται
  choice: மீட்கப்படுகிறார்
  rationale: நிகழ்காலப் passive வடிவையும், இச்சூழலில் உள்ள இரட்சிப்பு/மீட்பு கருத்தையும் காக்கிறது.
- source_word: ἀσεβής
  choice: இறைப்பற்றற்றவர்
  rationale: கடவுளிடம் பக்தியோ மரியாதையோ இல்லாதவர் என்ற அறநெறி-சமயப் பொருளை நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἁμαρτωλός
  choice: பாவி
  rationale: வழக்கமான துல்லியமான இணைச்சொல்; ἀσεβής என்பதிலிருந்து தனியே வைக்கப்பட்டுள்ளது.
- source_word: ποῦ
  choice: எங்கே
  rationale: நேரடியான வினாவிடை இடச்சொல்; சொல்லாட்சியின் வினாவலிமையைப் பாதுகாக்கிறது.
- source_word: φανεῖται
  choice: தோன்றுவார்கள்
  rationale: ‘தோன்றுதல்/காணப்படுதல்’ என்ற அடிப்படைப் பொருளை நேரடியாகக் காக்கிறது; தமிழில் இணைக்கப்பட்ட இரு நபர்வகைகளுக்கு மரியாதைப் பன்மை இயல்பானது.
theological_decisions:
- issue: μόλις σῴζεται என்பதன் உட்கருத்து
  choice: நீதிமானின் மீட்புடன் தொடர்புடைய கடுமையான சிரமத்தை உரை வெளிப்படுத்துகிறது; மீட்பு தானே நிச்சயமற்றது என்று வெளிப்படையாகக் கூறவில்லை.
  alternative: நீதிமான் இறுதியில் மீட்கப்படுவாரா என்பதே நிச்சயமற்றது.
  rationale: உடனடிச் சூழல் பாடு, தேவனுடைய வீட்டில் தொடங்கும் நியாயத்தீர்ப்பு, நிலைத்திருத்தல் ஆகியவற்றைப் பற்றியது. ‘மிகுந்த சிரமத்தோடுதான்’ என்பது பதற்றத்தைப் பாதுகாக்கிறது; அதை மறைபொருள் விளக்கமாகத் தீர்த்துவிடவில்லை.
- issue: ஒருமை ஆண்பால் பிரதிநிதித்துவம்
  choice: ‘நீதிமான்’ என்ற பொதுப் பிரதிநிதித்துவ ஒருமையைப் பயன்படுத்துதல்.
  alternative: ‘நீதியுள்ளவர்கள்’ என்ற பன்மை அல்லது ‘நீதியுள்ள நபர்’ என்ற விரிவு.
  rationale: கிரேக்கத்தின் ஒருமை வடிவத்தையும் பழமொழி போன்ற சுருக்கமான நடையையும் காக்கிறது.
- issue: இரண்டு ஒருமை நபர்வகைகளுக்கான தமிழ் வினை ஒத்திசைவு
  choice: ‘இறைப்பற்றற்றவரும் பாவியும் ... தோன்றுவார்கள்’ என மரியாதைப் பன்மை வினை பயன்படுத்துதல்.
  alternative: கிரேக்க ஒருமையை இயந்திரமாகப் பின்பற்றி ‘தோன்றுவார்’ எனக் கூறுதல்.
  rationale: உம்மைத் தொகையில் இரண்டு தனித்த நபர்வகைகள் இணைவதால் பன்மை வினை நவீனத் தமிழில் இயல்பானது; கிரேக்கத்தின் இரு தனித்த விளக்கச்சொற்களும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழ்; சுருக்கமான பழமொழி/மேற்கோள் போன்ற வினா நடை. ‘இறைப்பற்றற்றவர்’ என்பது dignified மற்றும் பொதுவாசகருக்குப் புரியும் தேர்வு. மூலத்தின் இறையியல் பதற்றம் அடிக்குறிப்பில் விளக்கப்பட்டாலும் முதன்மை உரையில் தீர்த்துவிடப்படவில்லை.
