id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: ta
  text: இனி மனிதர்களின் ஆசைகளின்படி அல்ல, கடவுளுடைய விருப்பத்தின்படி, மாம்சத்தில்[a] தமக்கு மீதமுள்ள காலத்தை வாழும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடலில் தமக்கு மீதமுள்ள காலத்தை.” இங்கு “மாம்சத்தில்” என்ற கிரேக்கச் சொற்றொடர் உடலோடு கூடிய இவ்வுலக வாழ்க்கையைக் குறிக்கிறது; அது கட்டாயமாக “பாவ இயல்பை” குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: வாழும்படியாக
  rationale: முந்தைய வசனத்துடன் தொடர்புடைய நோக்கம் அல்லது விளைவைத் தெரிவிக்கும் உருபுடன் கூடிய வினையெச்சக் கட்டமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: μηκέτι
  choice: இனி ... அல்ல
  rationale: முந்தைய வாழ்க்கை முறையைத் தொடர்ந்து பின்பற்றாத மாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: மனிதர்களின் ஆசைகளின்படி
  rationale: ἀνθρώπων என்பது ஆண்களை மட்டும் குறிக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ἐπιθυμίαις என்பதற்கு பாலியல் பொருளில் மட்டுப்படுத்தும் ‘இச்சைகள்’ என்பதற்குப் பதிலாக விரிவான ‘ஆசைகள்’ பொருத்தமானது. வேற்றுமை உருபின் வழிநடத்தும் அளவுகோல் சார்ந்த பொருளை ‘-இன்படி’ வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: அல்ல, கடவுளுடைய விருப்பத்தின்படி
  rationale: மனித ஆசைகளுக்கும் கடவுளின் விருப்பத்திற்கும் இடையிலான வலுவான முரண்பாட்டைப் பேணுகிறது; இணையான ‘-இன்படி’ அமைப்பு இரண்டு வாழ்க்கை நோக்குகளையும் தெளிவுபடுத்துகிறது.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: மீதமுள்ள காலத்தை
  rationale: ஒருவருடைய இவ்வுலக வாழ்க்கையில் எஞ்சிய காலத்தைச் சுருக்கமாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: ἐν σαρκὶ
  choice: மாம்சத்தில்
  rationale: σάρξ என்ற மூலச்சொல்லின் உருவகத் திறனையும் சொல் தொடர்பையும் பேணுகிறது; இங்கு அது பாவ இயல்பை அவசியமாகக் குறிக்காமல் உடலோடு கூடிய இவ்வுலக வாழ்வைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: βιῶσαι
  choice: வாழும்படியாக
  rationale: எஞ்சிய காலத்தை எவ்வாறு நடத்துவது அல்லது கழிப்பது என்ற பொருளை இயல்பான தமிழில் தருகிறது; εἰς τὸ உடனான நோக்கக் கட்டமைப்பும் இதில் வெளிப்படுகிறது.
theological_decisions:
- issue: ἐν σαρκὶ என்பதில் σάρξ-இன் பொருள்
  choice: உடலோடு கூடிய இவ்வுலக வாழ்க்கை (‘மாம்சத்தில்’)
  alternative: பாவ இயல்பில்
  rationale: உடனடியான சூழல் முந்தைய பாவ வாழ்க்கையையும் இப்போதைய கீழ்ப்படிதலையும் வேறுபடுத்தினாலும், இச்சொற்றொடர் தன்னிலேயே உள்ளார்ந்த ‘பாவ இயல்பை’ குறிக்கவில்லை; விசுவாசியின் எஞ்சிய உடல்சார்ந்த இவ்வுலக வாழ்நாளைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. வசனம் முந்தைய கூற்றைச் சார்ந்த நோக்கத் தொடராக இருப்பதால், கிரேக்கத்தின் முழுமையற்ற வாக்கியத் தொடர்பைத் தீர்த்து புதிய கட்டளையாக மாற்றாமல் ‘வாழும்படியாக’ என்று முடிக்கப்பட்டுள்ளது.
