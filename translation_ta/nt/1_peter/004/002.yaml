revisions:
- from: இனி மனிதர்களின் ஆசைகளின்படி அல்ல, கடவுளுடைய விருப்பத்தின்படி, மாம்சத்தில்[a] மீதமுள்ள காலத்தை வாழும்படியாக.
  to: இனி மனிதர்களின் ஆசைகளின்படி அல்ல, கடவுளுடைய விருப்பத்தின்படி, மாம்சத்தில்[a] தமக்கு மீதமுள்ள காலத்தை வாழும்படியாக.
  rationale: The revision clarifies the syntactic relationship of ‘in the flesh’ to the person’s remaining life, while preserving the Greek’s dependent purpose clause, its generic reference to human desires, and the deliberate σάρξ terminology. The footnote is adjusted to match the revised wording exactly.
