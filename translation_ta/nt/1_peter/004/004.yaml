source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: ta
  text: இதில், நீங்கள் அவர்களோடு சேர்ந்து அதே கட்டுப்பாடற்ற வாழ்வின் வெள்ளத்திற்குள் ஓடாததைக் கண்டு, அவர்கள் அதை விசித்திரமாக எண்ணி உங்களைப் பழித்துப் பேசுகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: …ஓடாததை
  rationale: இச்சொற்றொடர் முந்தைய வாழ்க்கைமாற்றத்துடன் வாக்கியத்தை இணைக்கிறது. தமிழில் தனியே ‘இதில்’ என்று மொழிபெயர்ப்பதைவிட, அவர்கள் விசித்திரமாக எண்ணுவதற்கான சூழலை ‘ஓடாததை’ என்ற உட்படுத்தப்பட்ட கூறு இயல்பாக வெளிப்படுத்துகிறது; வெளிப்படையான காரணவினைச் சொல்லைச் சேர்த்து பொருளை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: ξενίζονται
  choice: விசித்திரமாக எண்ணி
  rationale: இந்த வினை வியப்படைவதையும் ஒன்றை அந்நியமானதாக அல்லது விசித்திரமானதாகக் கருதுவதையும் குறிக்கலாம். ‘விசித்திரமாக எண்ணி’ என்பது அடிப்படைப் படிமத்தைத் தக்கவைத்து, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: நீங்கள் அவர்களோடு சேர்ந்து … ஓடாததை
  rationale: சொல்லர்த்தமான ‘ஒன்றாக ஓடுதல்’ என்ற உருவகத்தையும், அவர்களுடைய நடத்தையில் பங்குகொள்ளாத சமூகப் பொருளையும் இது தக்கவைக்கிறது.
- source_word: τῆς ἀσωτίας
  choice: கட்டுப்பாடற்ற வாழ்வின்
  rationale: ἀσωτία என்பது வீணான, ஒழுக்கக் கட்டுப்பாடற்ற நடத்தையைக் குறிக்கிறது. ‘கட்டுப்பாடற்ற வாழ்வு’ பொதுவாசகருக்குத் தெளிவானது; பாலியல் ஒழுக்கக்கேட்டுக்கு மட்டும் பொருளைச் சுருக்குவதில்லை.
- source_word: ἀνάχυσιν
  choice: பெருக்குக்குள்
  rationale: இச்சொல் ஊற்றப்படுதல், நிரம்பிவழிதல் அல்லது பெருக்கு என்ற படிமத்தைக் கொண்டது. ‘பெருக்கு’ அளவுமீறிய நடத்தையின் உருவகத்தையும் εἰς குறிக்கும் ‘உள்ளே’ செல்லும் இயக்கத்தையும் தக்கவைக்கிறது.
- source_word: βλασφημοῦντες
  choice: உங்களைப் பழித்துப் பேசுகிறார்கள்
  rationale: இச்சூழலில் இழிவாக அல்லது அவதூறாகப் பேசுவதே கருத்து. தமிழில் ‘தூஷிக்கிறார்கள்’ என்பது கடவுளுக்கு எதிரான பேச்சாகப் புரிந்துகொள்ளப்படலாம்; ‘பழித்துப் பேசுகிறார்கள்’ மனிதர்கள்மீது செலுத்தப்படும் பகைமையான பேச்சைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: βλασφημοῦντες குறிக்கும் பகைமையான பேச்சின் இலக்கு
  choice: விசுவாசிகளைப் பழித்துப் பேசுதல்
  alternative: கடவுளைத் தூஷித்தல் அல்லது பொதுவாகத் தீயதாகப் பேசுதல்
  rationale: உடனடியான சூழல், மாறிய நடத்தையுடைய விசுவாசிகளுக்கு மற்றவர்கள் காட்டும் எதிர்வினையை விவரிக்கிறது. ஆகவே மறைமுகமாக உள்ள இலக்கு ‘உங்களை’ என்று வெளிப்படுத்தப்படுகிறது; கடவுளுக்கு எதிரான தூஷணம் என்ற குறுகிய பொருள் இங்கே திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ‘ஒன்றாக ஓடுதல்’ மற்றும் ‘பெருக்கு’ ஆகிய உருவகங்கள் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன; ἀσωτία பாலியல் பொருளுக்கு மட்டும் சுருக்கப்படாமல் பரந்த ஒழுக்கக் கட்டுப்பாடின்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
