id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: ta
  text: மாறாக, மெசியாவின் பாடுகளில் நீங்கள் எந்த அளவுக்குப் பங்குபெறுகிறீர்களோ, அந்த அளவுக்கு மகிழுங்கள்; அவருடைய மகிமை வெளிப்படும் வேளையில் நீங்களும் பேருவகையுடன் மகிழும்படியாக மகிழுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὸ
  choice: எந்த அளவுக்கு... அந்த அளவுக்கு
  rationale: வாசகர்கள் மெசியாவின் பாடுகளில் பங்குபெறும் அளவுக்கும் மகிழ்ச்சிக்கான அழைப்புக்கும் இடையிலுள்ள விகிதத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κοινωνεῖτε
  choice: பங்குபெறுகிறீர்களோ
  rationale: வெறும் அனுதாபத்தை அல்லாமல், பாடுகளில் உண்மையான பங்கேற்பைக் குறிக்கிறது.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: மெசியாவின் பாடுகளில்
  rationale: உடைமை வேற்றுமையையும் பாடுகளில் பங்கேற்பு என்ற பொருளையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் மெசியத் தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: χαίρετε
  choice: மகிழுங்கள்
  rationale: கட்டளையின் செயற்பாட்டுத் தன்மையை நவீன, கண்ணியமான தமிழில் வழங்குகிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: தற்போதைய மகிழ்ச்சிக்கும் மகிமை வெளிப்படும் நேரத்திலான எதிர்கால மகிழ்ச்சிக்கும் உள்ள நோக்கம்/விளைவு உறவை தமிழில் இயல்பாக இணைக்கிறது; அந்த உறவின் துல்லியத்தை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἀποκαλύψει
  choice: வெளிப்படுகையில்
  rationale: மறைந்திருந்த மகிமை வெளிப்படுத்தப்படுதல் என்ற பொருளையும் காலச் சூழலையும் இயல்பான வினை வடிவில் தருகிறது.
- source_word: δόξης αὐτοῦ
  choice: அவருடைய மகிமை
  rationale: மூலத்தின் உடைமைத் தொடர்பை நேரடியாகக் காக்கிறது.
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: பேருவகையுடன் மகிழ்வீர்கள்
  rationale: χαίρω என்ற மீளுரைப்பை ‘மகிழ்’ மூலம் காத்து, ἀγαλλιάω குறிக்கும் தீவிரமான களிப்பை ‘பேருவகையுடன்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் பட்டமாக இருப்பதைத் தெளிவாக்கி, யூத மெசிய எதிர்பார்ப்பின் பின்னணியை காக்கிறது.
- issue: ‘மெசியாவின் பாடுகளில்’ பங்கேற்பதன் தன்மை
  choice: மெசியாவின் பாடுகளில் பங்குபெறுதல்
  alternative: மெசியாவுக்காகப் பாடுபடுதல்
  rationale: இது மெசியாவின் மீட்புப் பாடுகளை மீண்டும் நிகழ்த்துவதா, அவரோடு ஒன்றிப்பட்டதால் வரும் பாடுகளா, அல்லது அவருக்காகத் துன்புறுதலா என்பதை மொழிபெயர்ப்பு தனியே தீர்மானிக்காமல், மூலத்தின் பங்கேற்பு மொழியையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: ἵνα கூறும் தொடர்பு
  choice: நோக்கம் அல்லது விளைவைக் கொண்ட எதிர்கால இணைப்பு
  alternative: வெறும் காலத் தொடர்
  rationale: ἵνα-வின் நோக்கம்/விளைவு நுணுக்கத்தை அடிக்குறிப்பில் காத்து, பிரதான உரையில் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியக்கூடியதாயும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘பாடுகள்’, ‘மகிமை’, ‘பேருவகை’ ஆகிய சொற்கள் உயர்ந்தாலும் பரவலாகப் புரியும் நடையைத் தருகின்றன.
