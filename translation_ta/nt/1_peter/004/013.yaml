revisions:
- from: மாறாக, மெசியாவின் பாடுகளில் நீங்கள் எந்த அளவுக்குப் பங்குபெறுகிறீர்களோ, அந்த அளவுக்கு மகிழுங்கள்; அப்போது அவருடைய மகிமை வெளிப்படுகையில், நீங்களும் பேருவகையுடன் மகிழ்வீர்கள்.[a]
