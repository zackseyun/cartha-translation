  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: ta
  text: ஆகவே, கடவுளுடைய திருவுளத்தின்படி துன்பப்படுகிறவர்களும் நன்மை செய்துகொண்டே தங்கள் உயிர்களை[a] நம்பிக்கைக்குரிய படைப்பாளரிடம் ஒப்படைக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆத்துமாக்களை” அல்லது “தங்களையே.” கிரேக்கச் சொல் உயிர், ஆத்துமா, அல்லது தன்னையே குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: οἱ πάσχοντες
  choice: துன்பப்படுகிறவர்கள்
  rationale: துன்பத்தை அனுபவிக்கும் மக்களைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினையின் பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: கடவுளுடைய திருவுளத்தின்படி
  rationale: κατά என்பதன் ‘இசைவாக/அதன்படி’ என்ற பொருளைத் தருகிறது; துன்பத்துக்கும் கடவுளின் திருவுளத்துக்கும் உள்ள உறவை இதற்கு மேல் விளக்கி முடிவுகட்டவில்லை.
- source_word: πιστῷ κτίστῃ
  choice: உண்மையுள்ள படைப்பாளரிடம்
  rationale: πιστός என்பதிலுள்ள நம்பகத்தன்மை மற்றும் உண்மைத்தன்மையையும், κτίστης என்பதிலுள்ள படைப்பாளர் என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: παρατιθέσθωσαν
  choice: ஒப்படைக்கட்டும்
  rationale: ஒருவரின் பாதுகாப்பில் நம்பிக்கையுடன் ஒப்படைத்தல் என்ற நடுத்தர வினை ஏவலின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: தங்கள் உயிர்களை
  rationale: ψυχή என்பதன் உயிர், ஆத்துமா, தன்னையே என்ற பொருள் எல்லையை மனதில் கொண்டு, இச்சூழலில் முழு வாழ்வையும் தன்னையும் கடவுளிடம் ஒப்படைப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: நன்மை செய்துகொண்டே
  rationale: ஒப்படைத்தல் நன்மை செய்வதுடன் தொடர்ந்து நிகழ வேண்டும் என்ற உடனிகழ்வையும் முறையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: துன்பத்துக்கும் கடவுளின் திருவுளத்துக்கும் உள்ள உறவு
  choice: கடவுளுடைய திருவுளத்தின்படி
  alternative: கடவுளின் திருவுளத்தால்
  rationale: கிரேக்கம் துன்பம் கடவுளின் திருவுளத்தின்படி நிகழ்வதாகக் கூறுகிறது; அது அனுமதி, நியமனம் அல்லது வேறு எந்தக் கோட்பாட்டு விளக்கம் என்பதைத் தீர்மானிப்பதில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: ψυχή என்பதன் சூழல் சார்ந்த பொருள்
  choice: உயிர்கள்
  alternative: ஆத்துமாக்கள்; தங்களையே
  rationale: ‘உயிர்கள்’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, உடல் வாழ்க்கை மட்டுமல்லாமல் முழு நபரையும் குறிக்க முடியும். ‘ஆத்துமா’ என்ற தனிப்பட்ட இறையியல் மனிதவியல் விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல், மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πιστός என்பதன் பொருள்
  choice: உண்மையுள்ள
  alternative: நம்பிக்கைக்குரிய
  rationale: படைப்பாளர் நம்பத்தக்கவர் என்ற கருத்தை ‘உண்மையுள்ள’ தக்கவைக்கிறது; இது கடவுளின் உண்மைத்தன்மையையும் நம்பகத்தன்மையையும் தேவையின்றி பிரிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘திருவுளம்’ மற்றும் ‘படைப்பாளர்’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற உயர்நடையைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் புரியும்படி நேரடியாக உள்ளது.
