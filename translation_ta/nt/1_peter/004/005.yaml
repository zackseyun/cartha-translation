base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: ta
  text: அவர்கள், உயிருள்ளவர்களையும் இறந்தவர்களையும் நியாயந்தீர்க்க ஆயத்தமாக இருப்பவரிடம்[a] கணக்குக் கொடுப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயந்தீர்க்கத் தயாராயிருப்பவரிடம்.’ கிரேக்கச் சொல்லாட்சி, நியாயந்தீர்ப்பதற்கு ஆயத்தநிலையில் இருப்பவரை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: அவர்கள்
  rationale: இந்த உறவுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைக் குறிக்கிறது. தனி வசனமாகத் தெளிவாகவும் இயல்பாகவும் அமைய, தமிழில் ‘அவர்கள்’ என்று வழங்கப்பட்டது.
- source_word: ἀποδώσουσιν λόγον
  choice: கணக்குக் கொடுப்பார்கள்
  rationale: ஒருவர் தமது செயல்களுக்குப் பொறுப்பாக விளக்கம் அளிப்பதைக் குறிக்கும் நீதித்துறைச் சாயலுள்ள மரபுத்தொடர்; ‘கணக்குக் கொடுப்பார்கள்’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: τῷ
  choice: இருப்பவரிடம்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கட்டுரையுடனான பங்கேற்பு வடிவத்தைத் தமிழில் ‘...இருப்பவரிடம்’ என வழங்குவது இயல்பானது; நீதிபதி யார் என்பதை மூலவசனத்தைத் தாண்டி வெளிப்படையாகக் குறிப்பிடுவதையும் இது தவிர்க்கிறது.
- source_word: ἑτοίμως
  choice: ஆயத்தமாக
  rationale: இது ஆயத்தநிலை அல்லது தயார்நிலையைக் குறிக்கும் வினையடை. ‘ஆயத்தமாக’ என்பது கண்ணியமான, பொதுவாகப் புரியும் தமிழ் வழக்கு.
- source_word: ἔχοντι κρῖναι
  choice: நியாயந்தீர்க்க ஆயத்தமாக இருப்பவரிடம்
  rationale: சொல்லாட்சியின் நேரடிப் பொருள் ‘நியாயந்தீர்க்க ஆயத்தநிலையில் இருப்பவர்’ என்பதாகும். தேர்ந்தெடுக்கப்பட்ட வடிவம் தொடரும் ஆயத்தநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ζῶντας καὶ νεκρούς
  choice: உயிருள்ளவர்களையும் இறந்தவர்களையும்
  rationale: இரு குழுக்களையும் உள்ளடக்கும் பரந்த பொருளைத் தெளிவாகக் காக்கும் நேரான தமிழ் வடிவம்.
theological_decisions:
- issue: உயிருள்ளவர்களையும் இறந்தவர்களையும் நியாயந்தீர்க்க ஆயத்தமாக இருப்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘இருப்பவர்’ என்றே வைக்கப்பட்டது; கடவுள் அல்லது கிறிஸ்து என்று பெயரிடப்படவில்லை.
  alternative: ‘கடவுளிடம்’ அல்லது ‘கிறிஸ்துவிடம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: கிரேக்க வசனம் இங்கு நீதிபதியின் பெயரை வெளிப்படையாகச் சொல்லவில்லை. புதிய ஏற்பாட்டின் பிற பகுதிகள் கடவுளையும் கிறிஸ்துவையும் நியாயத்தீர்ப்புடன் தொடர்புபடுத்தினாலும், இவ்வசனத்தின் உண்மையான இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மூலத்தின் பெயரிடாத அமைப்பு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதாயும் பொதுவாசகர்களுக்கு எளிதில் புரிவதாயும் வடிவமைக்கப்பட்டது. ‘நியாயந்தீர்க்க’ மற்றும் ‘கணக்குக் கொடுப்பார்கள்’ ஆகியவை வசனத்தின் நீதித்துறைச் சாயலைப் பாதுகாக்கின்றன; நீதிபதியின் அடையாளம் மூலத்தைவிடத் தெளிவுபடுத்தப்படவில்லை.
