translation:
  language: ta
  text: முணுமுணுக்காமல் ஒருவருக்கொருவர் விருந்தோம்பல் செய்யுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறைசொல்லாமல் ஒருவருக்கொருவர் விருந்தோம்பல் செய்யுங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλόξενοι
  choice: விருந்தோம்பல் செய்யுங்கள்
  rationale: இது இலக்கண வடிவில் பெயரடையாக இருந்தாலும், சூழலில் கட்டளைக்குரிய வலிமையுடன் நிற்கிறது. ‘விருந்தோம்பல் செய்யுங்கள்’ என்பது அந்த அறிவுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: சமூகத்தினரிடையே பரஸ்பரமாகச் செலுத்தப்படும் செயலைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: ἄνευ
  choice: -ஆமல்
  rationale: ஒரு செயல் இல்லாத நிலையில் மற்றொரு செயலைச் செய்ய வேண்டும் என்ற பொருளைத் தமிழில் இயல்பாகக் காட்டும் எதிர்மறை வினையெச்ச வடிவம்.
- source_word: γογγυσμοῦ
  choice: முணுமுணுக்காமல்
  rationale: γογγυσμός குறிக்கும் அதிருப்தியுடன் கூடிய தாழ்குரல் குறைகூறுதலை ‘முணுமுணுத்தல்’ துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
