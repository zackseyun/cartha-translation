source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: ta
  text: மனிதர்களால் நிராகரிக்கப்பட்டாலும், கடவுளின் பார்வையில் தேர்ந்தெடுக்கப்பட்டவரும் மதிப்புமிக்கவருமான உயிருள்ள கல்லாகிய அவரிடம் நீங்கள் வரும்போது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரிடம் வருகிற நீங்கள்” அல்லது “அவரிடம் வந்துகொண்டிருக்கிற நீங்கள்.”
    reason: கிரேக்க நிகழ்காலப் பங்கேற்புவினையை நேரடியான பங்கேற்பு வடிவமாகவோ, தொடரும் செயலாகவோ வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: அவரிடம்
  rationale: திசையைக் குறிக்கும் πρός என்பதையும், முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆண்டவரையே சுட்டும் ὃν என்ற சுட்டுப்பெயரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வசனத்திற்குள் ‘இயேசு’ என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: προσερχόμενοι
  choice: நீங்கள் வரும்போது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது சூழ்நிலை சார்ந்த செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; அடுத்த வசனத்துடன் தொடரும் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: λίθον ζῶντα
  choice: உயிருள்ள கல்
  rationale: λίθος என்பதற்கு ‘கல்’ என்பது துல்லியமான பொருள்; ζῶντα உடன் சேர்ந்து வரும் நோக்கமுள்ள முரணுருவகத்தையும் கட்டடக் கல் படிமத்தையும் பாதுகாக்கிறது.
- source_word: ὑπὸ ἀνθρώπων
  choice: மனிதர்களால்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்க முடியும். ‘மனிதர்களால்’ என்பது கடவுளின் மதிப்பீட்டுக்கு எதிராக நிறுத்தப்படும் மனித மதிப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀποδεδοκιμασμένον
  choice: நிராகரிக்கப்பட்டாலும்
  rationale: சோதித்து ஏற்காமல் விட்ட நிலையைக் குறிக்கும் நிறைவுற்ற செயப்பாட்டு வடிவத்தை ‘நிராகரிக்கப்பட்ட’ எனத் தெளிவாகத் தருகிறது; μέν…δέ எதிர்மறை ஒப்புமையை ‘ஆலும்’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρὰ δὲ θεῷ
  choice: ஆனால், கடவுளின் பார்வையில்
  rationale: παρά + வேற்றுமை இங்கு கடவுளிடத்தில் ஒருவருக்கு உள்ள மதிப்பு அல்லது கடவுளின் மதிப்பீட்டைக் குறிக்கிறது. சொற்சொல்லான ‘கடவுளிடம்’ என்பதைவிட இத்தமிழாக்கம் பொருளைத் தெளிவாக்குகிறது.
- source_word: ἐκλεκτὸν
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: தெய்வீகத் தேர்வைத் தக்கவைத்தபடி, சமயத் தொழில்நுட்பச் சொல்லாக ஒலிக்காத நவீனத் தமிழைப் பயன்படுத்துகிறது.
- source_word: ἔντιμον
  choice: மதிப்புமிக்க
  rationale: உயர்ந்த மதிப்பும் கண்ணியமும் உடையது என்ற பொருளை வழங்குகிறது; ‘விலையேறப்பெற்ற’ போன்ற பழைய நடையைத் தவிர்த்து கல் உருவகத்துக்கும் ஏற்றதாக உள்ளது.
theological_decisions:
- issue: ‘அவர்’ என்பவரும் உயிருள்ள கல் உருவகமும் யாரைக் குறிக்கின்றன?
  choice: சுட்டுப்பெயரை அப்படியே வைத்துக் கொண்டு, அவரை ‘உயிருள்ள கல்’ என விவரித்தல்
  alternative: ‘இயேசு கிறிஸ்துவிடம்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: 2:3–4 இன் உடனடிச் சூழலும் 2:6–8 இன் கல் குறித்த மேற்கோள்களும் கிறிஸ்துவையே சுட்டுகின்றன. ஆயினும் கிரேக்க மூலத்தில் இவ்வசனத்தில் பெயர் இல்லாததால், மொழிபெயர்ப்பு ‘அவர்’ என்ற சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- issue: ἀνθρώπων என்பதன் பாலின வரம்பு
  choice: மனிதர்களால்
  alternative: ஆண்களால்
  rationale: இங்குள்ள பன்மைச் சொல் மனித மதிப்பீட்டுக்கும் கடவுளின் மதிப்பீட்டுக்கும் இடையேயான வேறுபாட்டைக் குறிக்கிறது; ஆண்களை மட்டும் குறிக்கிறது என்பதற்கான சூழல் ஆதாரம் இல்லை.
- issue: παρὰ θεῷ என்பதின் மதிப்பீட்டு நுணுக்கம்
  choice: கடவுளின் பார்வையில்
  alternative: கடவுளிடம்
  rationale: தேர்ந்தெடுக்கப்பட்டவர், மதிப்புமிக்கவர் என்ற இரு பண்புகளும் கடவுளின் மதிப்பீட்டில் அவருடைய நிலையைச் சொல்கின்றன. ‘பார்வையில்’ என்பது அந்த உறவை விளக்குகிறது; தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘உயிருள்ள கல்’ என்ற திட்டமிட்ட உருவக முரண் மாற்றமின்றி பாதுகாக்கப்பட்டுள்ளது.
