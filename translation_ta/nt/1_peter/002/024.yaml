id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: ta
  text: அவர் தாமே நம் பாவங்களைத் தமது உடலில் மரத்தின்மேல்[a] சுமந்தார்; நாம் பாவங்களுக்கு இறந்து, நீதியின்படி வாழும்படியாக. அவருடைய காயத்தால்[b] நீங்கள் குணமடைந்தீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிலுவையின்மேல்.’ கிரேக்கத்தில் ‘மரத்தின்மேல்’ என்று உள்ளது; இது உபாகமம் 21:23-ஐ எதிரொலிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அடிபட்ட காயத்தால்’ அல்லது ‘தழும்பால்.’ கிரேக்கச் சொல் ஒருமையில் உள்ளது; அது ஏசாயா 53:5-ஐ எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு குணமடைதல் பரந்த விதத்தில் சொல்லப்படுகிறது. சூழலில் அது பாவங்களையும் நீதியையும் சார்ந்துள்ளது; ஆனால் மூலவாக்கியம் அதன் பொருளை உடல் சார்ந்தது அல்லது ஆன்மீக சார்ந்தது என்ற ஒன்றுக்கு மட்டும் வரையறுக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: சுமந்தார்
  rationale: இந்தச் சொல் ‘மேலே கொண்டுசெல்,’ ‘பலியாகச் செலுத்து,’ அல்லது ‘சும’ எனப் பொருள்படலாம். இங்கு ‘நம் பாவங்கள்’ அதன் நேரடிப் பொருளாக இருப்பதாலும், ஏசாயா 53-ன் எதிரொலியைத் தக்கவைப்பதாலும் ‘சுமந்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; பலியியல் சார்ந்த ஒரே விளக்கத்தை அது திணிப்பதில்லை.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: தமது உடலில்
  rationale: உடலால் ஏற்பட்ட உண்மையான துன்பத்தைத் தெளிவாகக் காட்டுகிறது. முன்வரும் ‘அவர் தாமே’ என்பதில் வலியுறுத்தல் இருப்பதால், இங்கு ‘தமது’ என்பது இயல்பான தமிழாக அமைகிறது.
- source_word: ἐπὶ τὸ ξύλον
  choice: மரத்தின்மேல்
  rationale: ξύλον என்பதன் அடிப்படைப் பொருள் ‘மரம்/மரக்கட்டை.’ ‘மரத்தின்மேல்’ என்பது மூலச் சொல்லையும் உபாகமம் 21:23-ன் சாத்தியமான எதிரொலியையும் காக்கிறது; ‘சிலுவை’ என்பது பொருளை விளக்கும் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: பாவங்களைப் பொறுத்தவரை இறந்து
  rationale: ἀπογίνομαι இங்கு பாவங்களிலிருந்து ஏற்பட்ட தீர்மானமான பிரிவைக் குறிக்கிறது. ‘பாவங்களைப் பொறுத்தவரை இறந்து’ என்பது அந்த முறிவை உயிரோட்டமான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் உள்ள பன்மையும் தக்கவைக்கப்படுகிறது.
- source_word: τῇ δικαιοσύνῃ
  choice: நீதிக்காக
  rationale: δικαιοσύνη என்பதற்கு இங்கு ‘நீதி’ பொருத்தமானது. ‘நீதிக்காக வாழ’ என்பது நீதியை நோக்கிய வாழ்வைச் சுருக்கமாகக் காட்டுகிறது; அதை வெறும் சமூக நீதி என்றோ குறிப்பிட்ட கோட்பாட்டு பொருள் என்றோ குறுக்குவதில்லை.
- source_word: μώλωπι
  choice: காயத்தால்
  rationale: μώλωψ என்பது அடியால் ஏற்பட்ட காயம், தழும்பு அல்லது வீக்கத்தைக் குறிக்கலாம். ஒருமையைத் தக்கவைக்கும் ‘காயம்’ நவீன வாசகருக்குத் தெளிவாகவும் ஏசாயா 53:5-ன் எதிரொலிக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἰάθητε
  choice: குணமடைந்தீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவின் பொருளை இயல்பான தமிழில் தருகிறது. இது குணப்படுத்துதலின் பரந்த உருவக மற்றும் இரட்சிப்பு சார்ந்த பொருளைத் திறந்தே வைக்கிறது; உடல் நலம் அல்லது ஆன்மீக நலம் என்ற ஒன்றுக்குள் மட்டும் குறுக்குவதில்லை.
- source_word: αὐτὸς
  choice: அவர் தாமே
  rationale: வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள குணமடைதலின் பரப்பு
  choice: ‘நீங்கள் குணமடைந்தீர்கள்’ என்று மட்டும் கூறி, உடல் சார்ந்ததா ஆன்மீக சார்ந்ததா என்று வரையறுக்காமல் விடுதல்
  alternative: உடல் குணமடைதல் மட்டும்; பாவத்திலிருந்து ஆன்மீக குணமடைதல் மட்டும்; முதன்மையாக இரட்சிப்பு சார்ந்த முழுமையான குணமடைதல்
  rationale: உடனடிச் சூழல் பாவங்கள், நீதி, கிறிஸ்துவின் பாடுகள் ஆகியவற்றைப் பற்றியது; ஆகவே பாவத்திலிருந்து மீட்கப்படுதல் இதில் தெளிவாக அடங்குகிறது. எனினும், மூலவாக்கியம் குணமடைதலை அதைவிடக் குறுகிய கோட்பாட்டு வரையறைக்குள் அடைக்கவில்லை. ஏசாயா 53-ன் பரந்த மொழியும் இறையியல் அழுத்தமும் அப்படியே காக்கப்படுகின்றன.
- issue: ξύλον என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘மரம்’
  alternative: ‘சிலுவை’
  rationale: இது இயேசுவின் சிலுவை மரணத்தைக் குறித்தாலும், கிரேக்கம் σταυρός என்பதற்குப் பதிலாக ξύλον என்பதைப் பயன்படுத்துகிறது. ‘மரம்’ மூலச் சொல்லையும் வேதாகம எதிரொலியையும் காக்கிறது; ‘சிலுவை’ விளக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர் தாமே,’ ‘தமது உடலில்,’ ‘மரத்தின்மேல்’ ஆகியவை மூலத்தின் வலியுறுத்தலையும் உடல் சார்ந்த துன்பத்தையும் வேதாகம எதிரொலியையும் காக்கின்றன. ‘பாவங்களைப் பொறுத்தவரை இறந்து’ என்பது சற்றே செறிவான வேதாகம உருவகமாக இருந்தாலும், மூலத்தில் உள்ள தீர்மானமான பிரிவை இயல்பாக எடுத்துரைக்கிறது.
