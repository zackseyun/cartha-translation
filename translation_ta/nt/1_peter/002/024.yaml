  source_fidelity: 'மையப் பொருள் துல்லியமாக உள்ளது: αὐτός-இன் வலியுறுத்தல், பாவங்களைச் சுமத்தல், உடலில் மரத்தின்மேல் நிகழ்ந்தது, பாவங்களிலிருந்து தீர்மானமான பிரிவு, குணமடைதலின் பரந்த தன்மை ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் τῇ δικαιοσύνῃ ζήσωμεν என்பதற்கு ‘நீதிக்காக வாழ’ என்பது நீதிக்காகச் செயல்படுதல் என்ற நோக்கப் பொருளைத் தரக்கூடும்; இங்கு நீதியால் வகைப்படுத்தப்படும் வாழ்க்கை என்பதே இயல்பான பொருள்.'
