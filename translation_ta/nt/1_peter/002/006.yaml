id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: ta
  text: 'ஏனெனில், வேதத்தில் இவ்வாறு உள்ளது[a]: “இதோ, தேர்ந்தெடுக்கப்பட்டதும் மதிப்புக்குரியதுமான[b] ஒரு மூலைக்கல்லைச் சீயோனில் வைக்கிறேன்; அவர்மேல்[c] நம்பிக்கை வைக்கிறவர் ஒருபோதும் வெட்கத்திற்கு உள்ளாகமாட்டார்[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேதத்தில் எழுதப்பட்டுள்ளது” அல்லது “வேதம் கூறுகிறது.” கிரேக்கச் சொல்லாட்சி சொற்சொல்லாக, “வேதத்தில் அது அடங்கியுள்ளது” என்பதற்கு நெருக்கமானது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விலைமதிப்புள்ள மூலைக்கல்.” கிரேக்கச் சொல் மரியாதை பெற்றிருப்பதையும் உயர்ந்த மதிப்புடையதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கல் உருவகத்தை முன்னிறுத்தி சிலர் “அதன்மேல்” என்று மொழிபெயர்க்கின்றனர். இங்கு “அவர்மேல்” என்பது சுற்றியுள்ள வசனங்களில் பேதுரு இந்தக் கல் பற்றிய வாக்கியத்தை கிறிஸ்துவைக் குறித்துப் பயன்படுத்துவதைப் பிரதிபலிக்கிறது.
    reason: alternative_reading
  - marker: d
    text: அல்லது, “நிச்சயமாக வெட்கத்திற்கு உள்ளாகமாட்டார்.” கிரேக்க மறுப்பு மிகவும் வலியுறுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு வேதவாக்கிய ஆதாரத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: περιέχει ἐν γραφῇ
  choice: வேதத்தில் இவ்வாறு உள்ளது
  rationale: கிரேக்கத்தில் உள்ள வழக்கத்திற்கு மாறான ஆளில்லா சொல்லாட்சியைத் தமிழில் இயல்பாகக் கூறி, தொடர்ந்து வரும் மேற்கோளை நேரடியாகச் சுட்டுகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் தீர்க்கதரிசன அறிவிப்பின் வலிமையையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: τίθημι
  choice: வைக்கிறேன்
  rationale: கட்டுமான உருவகத்தில் கல்லை இடுவதைக் குறிக்கும் இயல்பான நிகழ்காலத் தமிழ் வினை.
- source_word: ἐν Σιὼν
  choice: சீயோனில்
  rationale: ἐν என்பதன் இடப்பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: λίθον ἀκρογωνιαῖον
  choice: ஒரு மூலைக்கல்
  rationale: கட்டிடத்தின் மூலையில் அடிப்படையாக அமையும் கல்லைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: ἐκλεκτὸν
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: தெய்வீகத் தெரிவின் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; பிற்கால இறையியல் கலைச்சொல்லைத் திணிக்கவில்லை.
- source_word: ἔντιμον
  choice: மதிப்புக்குரிய
  rationale: இச்சொல்லிலுள்ள கனம், மதிப்பு ஆகிய பொருட்களை வெளிப்படுத்தி, உடனடி சூழலிலுள்ள மதிப்பு/கனம் என்ற கருப்பொருளுடன் பொருந்துகிறது.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: அவர்மேல் நம்பிக்கை வைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வினையை இயல்பாகக் கூறுகிறது; ἐπ’ αὐτῷ என்பதையும் ‘அவர்மேல்’ என்று வெளிப்படுத்தி, பேதுருவின் கிறிஸ்துவைச் சார்ந்த பயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ஒருபோதும் வெட்கத்திற்கு உள்ளாகமாட்டார்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பை ‘ஒருபோதும்’ என்பதால் காட்டி, καταισχύνω என்பதன் வெட்கம்/அவமானம் சார்ந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: தனிநபரைச் சுட்டும் வகையில் ‘அவர்மேல்’
  alternative: கல் உருவகத்தை மட்டும் முன்னிறுத்தி ‘அதன்மேல்’
  rationale: உடனடி உருவகம் ஒரு கல்லைப் பற்றியது என்றாலும், 1 பேதுரு 2:4–8 சூழலில் அந்தக் கல் கிறிஸ்துவுக்குப் பயன்படுத்தப்படுகிறது. ‘அவர்மேல்’ என்பது உருவகத்தை நீக்காமல் பேதுருவின் தனிநபர் சார்ந்த பயன்பாட்டை வெளிப்படுத்துகிறது.
- issue: ἀκρογωνιαῖον ἐκλεκτὸν ἔντιμον ஆகியவற்றின் தொடர்பு
  choice: ‘தேர்ந்தெடுக்கப்பட்டதும் மதிப்புக்குரியதுமான ஒரு மூலைக்கல்’
  alternative: ‘ஒரு மூலைக்கல்—தேர்ந்தெடுக்கப்பட்டதும் விலையேறப்பெற்றதுமானது’
  rationale: மூன்று விவரிப்புகளையும் தெளிவாக ஒரே கல்லோடு இணைக்கிறது; கிரேக்கச் சொல் வரிசையைச் செயற்கையாகப் பின்பற்றாமல் அதன் பொருள் உறவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதநடை பயன்படுத்தப்பட்டுள்ளது. “இதோ” மேற்கோளின் தீர்க்கதரிசனத் தொனியைத் தக்கவைக்கிறது. “சீயோன்,” “மூலைக்கல்” போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தெளிவுக்காகப் பாதுகாக்கப்பட்டுள்ளன.
