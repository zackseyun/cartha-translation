- from: வீட்டு அடிமைகளே,[a] உங்கள் எஜமானர்களுக்கு முழு மரியாதையுடன் கீழ்ப்படிந்திருங்கள்; நல்லவர்களுக்கும் கனிவானவர்களுக்கும் மட்டுமல்ல, நேர்மையற்றவர்களுக்கும் கீழ்ப்படிந்திருங்கள்.[b]
  to: வீட்டு அடிமைகளே,[a] உங்கள் எஜமானர்களுக்கு முழு மரியாதையுடன்[b] கீழ்ப்படிந்திருங்கள்; நல்லவர்களுக்கும் கனிவானவர்களுக்கும் மட்டுமல்ல, நேர்மையற்றவர்களுக்கும்.[c]
  rationale: The revision removes an unnecessary repeated command so that the Tamil mirrors the Greek’s single exhortation and elliptical ‘not only ... but also ...’ construction. It also separates the notes for ἐν παντὶ φόβῳ and σκολιοῖς, placing each marker beside its corresponding rendering. No doctrinal interpretation is introduced.
