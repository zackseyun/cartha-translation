  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: ta
  text: வீட்டு அடிமைகளே,[a] உங்கள் எஜமானர்களுக்கு முழு மரியாதையுடன்[b] கீழ்ப்படிந்திருங்கள்; நல்லவர்களுக்கும் கனிவானவர்களுக்கும் மட்டுமல்ல, நேர்மையற்றவர்களுக்கும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீட்டு அடிமைகள்’ என்பதற்குப் பதிலாக ‘வீட்டுப் பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒரு வீட்டுக்குள் சார்புநிலையில் இருந்த வீட்டுப் பணியாளர்கள் அல்லது அடிமைகளைச் சிறப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘முழுப் பயத்துடன்.’ இங்கு மரியாதையுடன் கூடிய பணிவான கீழ்ப்படிதலே பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நேர்மையற்றவர்கள்’ என்பதற்கு ‘கடுமையானவர்கள்’ அல்லது ‘அநியாயமானவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லின் நேரடிப் பொருள் ‘கோணலானவர்கள்’ அல்லது ‘வளைந்தவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: வீட்டு அடிமைகள்
  rationale: இச்சொல் பொதுவான வேலைக்காரர்களை அல்ல, ஒரு வீட்டைச் சார்ந்து அதன் அதிகாரத்தின்கீழ் இருந்த அடிமைநிலையிலான வீட்டுப் பணியாளர்களைக் குறிக்கிறது. ‘அடிமைகள்’ என்பது வரலாற்றுச் சமூக நிலையைக் மென்மையாக்காமல் காட்டுகிறது; ‘வீட்டு’ என்பது அதன் குறிப்பிட்ட சூழலைப் பாதுகாக்கிறது.
- source_word: ὑποτασσόμενοι
  choice: கீழ்ப்படிந்திருங்கள்
  rationale: இப்பங்கேற்புவினை சூழலில் கட்டளைப் பொருளில் செயல்படுகிறது. நவீன தமிழில் ‘கீழ்ப்படிந்திருங்கள்’ இயல்பாகவும் அதிகாரத்திற்குத் தம்மை உட்படுத்தும் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: ἐν παντὶ φόβῳ
  choice: முழு மரியாதையுடன்
  rationale: φόβος என்பதற்கு ‘பயம்’ என்ற நேரடிப் பொருள் இருந்தாலும், இங்கு பணிவும் மரியாதையும் கலந்த மதிப்பளிப்பைச் சுட்டலாம். உணர்ச்சி சார்ந்த அச்சத்தை மட்டும் கட்டளையிடுவதாகத் தவறாகப் புரியாமல், சூழற்பொருளை ‘முழு மரியாதையுடன்’ வெளிப்படுத்துகிறது.
- source_word: δεσπόταις
  choice: எஜமானர்கள்
  rationale: வீட்டு அடிமைகள் மீது அதிகாரம் செலுத்துவோரைக் குறிக்கும் சமூக உறவை ‘எஜமானர்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἀγαθοῖς
  choice: நல்லவர்கள்
  rationale: ἀγαθός என்பதன் பரந்த நெறிசார் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐπιεικέσιν
  choice: கனிவானவர்கள்
  rationale: இச்சொல்லின் மென்மை, நியாயமான அணுகுமுறை, பொறுமை ஆகிய பொருள் வளையத்தை இச்சூழலில் இயல்பான தமிழில் தருகிறது.
- source_word: σκολιοῖς
  choice: நேர்மையற்றவர்கள்
  rationale: இச்சொல்லின் அடிப்படை உருவகம் ‘கோணலான/வளைந்த’ என்பதாகவும், மனிதர்களைப் பற்றியபோது ஒழுக்கத்தில் பிறழ்ந்த, அநியாயமான அல்லது கடுமையானவர்களைக் குறிக்கக்கூடியதாகவும் உள்ளது. ‘நேர்மையற்றவர்கள்’ உருவகத்தின் நெறிசார் வலிமையை இயல்பான தமிழில் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
theological_decisions:
- issue: οἰκέται குறிக்கும் சமூக நிலையை மென்மையாக்காமலும் அதன் வீட்டுச் சூழலை இழக்காமலும் மொழிபெயர்த்தல்
  choice: ‘வீட்டு அடிமைகள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘வீட்டுப் பணியாளர்கள்’ அல்லது ‘வீட்டு வேலைக்காரர்கள்’
  rationale: பண்டைய வீட்டமைப்புக்குள் அதிகாரத்திற்குட்பட்ட அடிமைநிலையை உரை முன்னிறுத்துகிறது. ‘பணியாளர்கள்’ என்பது நவீன சுதந்திர வேலைவாய்ப்பை நினைவூட்டிச் சமூக நிதர்சனத்தை மென்மையாக்கலாம். இந்த மொழிபெயர்ப்பு வசனத்தின் அறிவுறுத்தலைப் பதிவு செய்கிறது; அந்த அமைப்பைத் தானாகவே நெறிசார் அங்கீகாரமாக மாற்றுவதில்லை.
- issue: φόβος என்பதை ‘பயம்’ என்றே தர வேண்டுமா அல்லது சூழற்பொருளில் தர வேண்டுமா
  choice: ‘முழு மரியாதையுடன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘முழுப் பயத்துடன்’ அல்லது ‘முழு பயபக்தியுடன்’
  rationale: இங்கு எஜமானர்களிடம் காட்ட வேண்டிய பணிவான மதிப்பளிப்பே மையமாக இருக்கலாம்; ‘பயம்’ மட்டும் பயன்படுத்துவது அச்சுறுத்தலால் உண்டாகும் திகிலை வாசகரிடம் முதன்மைப்படுத்தக்கூடும். எனினும் மூலத்தின் நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: σκολιοῖς என்பதன் உருவகத்தையும் பரந்த எதிர்மறைப் பொருளையும் கையாளுதல்
  choice: முதன்மை உரையில் ‘நேர்மையற்றவர்கள்’; அடிக்குறிப்பில் ‘கடுமையானவர்கள்/அநியாயமானவர்கள்/கோணலானவர்கள்’
  alternative: முதன்மை உரையில் ‘கடுமையானவர்கள்’ அல்லது ‘கோணலானவர்கள்’
  rationale: ஒரே ஒரு தமிழ் சொல்லால் ஒழுக்கப் பிறழ்வு, அநீதி, கடுமை ஆகிய எல்லா சாத்தியங்களையும் முழுமையாகக் காட்ட முடியாது. முதன்மை உரை இயல்பாக இருக்க, உண்மையான சொற்பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. பண்டைய சமூக நிலையை மறைக்காமல் ‘வீட்டு அடிமைகள்’ எனத் தெளிவாகக் கூறப்பட்டுள்ளது. கட்டளைப் பொருளை இயல்பாக வெளிப்படுத்த ‘கீழ்ப்படிந்திருங்கள்’ பயன்படுத்தப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
