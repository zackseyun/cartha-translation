id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: ta
  text: எல்லாரையும் மதியுங்கள்; சகோதர சமுதாயத்தினரிடம்[a] அன்புகூருங்கள்; கடவுளுக்குப் பயப்படுங்கள்; அரசனை[b] மதியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சமுதாயத்தினர்” என்பது சக விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பேரரசனை.” கிரேக்கச் சொல்லின் நேரடிப் பொருள் “அரசன்”; ஆனால் பேதுருவின் ரோமச் சூழலில் அது பேரரசரைக் குறிப்பதாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: எல்லாரையும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மை வடிவத்தின் உலகளாவிய விரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τιμήσατε / τιμᾶτε
  choice: மதியுங்கள்
  rationale: ஒரே கிரேக்க வினைச்சொல் வசனத்தின் தொடக்கத்திலும் முடிவிலும் வருவதால், அதன் திட்டமிட்ட மறுபடிவத்தைத் தமிழிலும் ஒரே சொல்லால் காக்கிறது. ‘கனம் பண்ணுங்கள்’ என்பதைவிட இது நவீனத் தமிழில் இயல்பானது.
- source_word: ἀδελφότητα
  choice: சகோதர சமுதாயத்தினரிடம்
  rationale: உடன்பிறந்த உறவைப் போன்ற நெருக்கத்தால் இணைக்கப்பட்ட விசுவாசிகளின் கூட்டத்தைக் குறிக்கும் சொல். ‘சகோதரத்துவம்’ என்ற அருவமான வடிவத்தைவிட, அன்பு செலுத்தப்படுகிற மக்களைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγαπᾶτε
  choice: அன்புகூருங்கள்
  rationale: ἀγαπάω என்பதன் நேரடியான, dignified Tamil equivalent; நிகழ்காலக் கட்டளையின் தொடர்ச்சியான தன்மையைத் தமிழ் கட்டளை வடிவம் சூழலிலேயே இயல்பாகத் தெரிவிக்கிறது.
- source_word: θεὸν
  choice: கடவுள்
  rationale: θεός என்பதற்கான நேரடியான, பரவலாகப் புரியக்கூடிய நவீனத் தமிழ் இணை.
- source_word: φοβεῖσθε
  choice: பயப்படுங்கள்
  rationale: ‘போற்றுங்கள்’ அல்லது ‘பக்தியாயிருங்கள்’ என்று மென்மைப்படுத்தாமல், கிரேக்கச் சொல்லின் வலிமையையும் அரசனுக்குரிய ‘மதிப்பு’ என்பதிலிருந்து உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: βασιλέα
  choice: அரசனை
  rationale: βασιλεύς என்பதன் நேரடி பொருளை முதன்மை உரையில் காக்கிறது; பேதுருவின் ரோமச் சூழலில் அது பேரரசரைக் குறிப்பதற்கான வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கடவுளுக்குரிய பதிலுக்கும் ஆட்சியாளருக்குரிய பதிலுக்கும் உள்ள வேறுபாடு
  choice: கடவுளுக்குப் ‘பயப்படுங்கள்’; அரசனை ‘மதியுங்கள்’
  alternative: கடவுளைப் ‘போற்றுங்கள்’; அரசனை ‘மரியாதை செய்யுங்கள்’
  rationale: அனைவருக்கும் மதிப்பு, விசுவாசிகளின் சமூகத்திற்கு அன்பு, கடவுளுக்குப் பயம், அரசனுக்கு மதிப்பு என்ற நான்கு வேறுபட்ட கடமைகளை வசனம் அமைக்கிறது. கடவுளுக்குரிய வலிமையான வினையையும் அரசனுக்குரிய வரையறுக்கப்பட்ட மதிப்பையும் இத்தேர்வு கலக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. நான்கு இணை கட்டளைகளின் சுருக்கத்தையும், முதல் மற்றும் கடைசி கட்டளைகளில் வரும் ஒரே வினைச்சொல்லின் மறுபடிவத்தையும் காக்கிறது.
