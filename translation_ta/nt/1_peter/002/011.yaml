reference: 1 Peter 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: ta
  text: அன்புக்குரியவர்களே, அந்நியக் குடியிருப்பாளர்களாகவும் தற்காலிகமாகத் தங்கியிருப்பவர்களாகவும் இருக்கும் நீங்கள்[a], மாம்சத்திற்குரிய ஆசைகளிலிருந்து[b] விலகியிருக்கும்படி உங்களை வலியுறுத்துகிறேன். அவை ஆத்துமாவுக்கு எதிராகப் போரிடுகின்றன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணைச் சொற்களை ‘அந்நியர்கள் மற்றும் தற்காலிக வாசிகள்’ என்றும் மொழிபெயர்க்கலாம். இவை, வாசகர்கள் தாங்கள் வாழும் இடத்திற்கோ தற்போதைய கால ஒழுங்கிற்கோ முழுமையாகச் சொந்தமானவர்கள் அல்ல என்பதை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘மாம்சத்திற்குரிய ஆசைகள்’ என்பதை ‘மாம்சத்தின் ஆசைகள்’ என்றும், விளக்கமாக ‘பாவ ஆசைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆத்துமாவுக்கு எதிராக’ என்பதைச் சூழலின்படி ‘உயிருக்கு எதிராக’ அல்லது ‘ஒருவரின் முழுத் தன்மைக்கு எதிராக’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் நெருக்கமும் நிறைந்த பன்மை விளிவடிவத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ἀγαπάω/ἀγάπη சொல்லினத்துடனான பொருள் தொடர்பையும் காக்கிறது.
- source_word: παρακαλῶ
  choice: உங்களை வலியுறுத்துகிறேன்
  rationale: இங்கு ஆறுதல் அல்லது சாதாரண வேண்டுகோள் அல்ல, மனமார்ந்த ஒழுக்க அறிவுறுத்தலே கருத்து. ‘வலியுறுத்துகிறேன்’ அதன் தீவிரத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ὡς
  choice: …ஆகவும் …ஆகவும் இருக்கும் நீங்கள்
  rationale: வாசகர்கள் எந்த நிலையினராகக் கருதி அறிவுறுத்தப்படுகிறார்கள் என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; காரணப் பொருளைச் சேர்க்கவில்லை.
- source_word: παροίκους
  choice: அந்நியர்களாக
  rationale: தமது சொந்த நாட்டில் அல்லாமல், முழு குடியுரிமைச் சேர்ந்துணர்வு இன்றி வாழ்பவர்களின் நிலையைக் குறிக்கிறது.
- source_word: παρεπιδήμους
  choice: தற்காலிகக் குடியிருப்பாளர்களாக
  rationale: ஒரு இடத்தில் நிலையாகச் சேர்ந்தவர்களாக அல்லாமல் தற்காலிகமாகத் தங்கியிருப்பதை வெளிப்படுத்தி, இணைச் சொல்லான παροίκους என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἀπέχεσθαι
  choice: விட்டு விலகியிருக்கும்படி
  rationale: தொடர்ந்து தன்னைக் கட்டுப்படுத்திக்கொண்டு விலகியிருக்கும் அழைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: மாம்சத்திற்குரிய ஆசைகளை
  rationale: ‘பாவ ஆசைகள்’ என்று விளக்கிப் பொருளைச் சுருக்காமல், σάρξ சொல்லினத்தின் உருவகத்தையும் ஒழுக்கத் தன்மையையும் காக்கிறது.
- source_word: αἵτινες
  choice: அவை
  rationale: முந்தைய ஆசைகளை மீண்டும் சுட்டி, அவற்றின் தன்மையை விளக்கும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: στρατεύονται
  choice: போரிடுகின்றன
  rationale: ஆசைகள் தீவிரமாகத் தாக்குகின்றன என்ற இராணுவ உருவகத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: κατὰ τῆς ψυχῆς
  choice: ஆத்துமாவுக்கு எதிராக
  rationale: ψυχή என்பதன் மனித உயிர்/தன்/ஆத்துமா சார்ந்த பொருள் அகலத்தை முற்றிலும் ஒரு உளவியல் அல்லது உடலியல் பொருளாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: ஒழுக்கச் சூழலில் σαρκικῶν என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சத்திற்குரிய
  alternative: பாவமுள்ள; மாம்சத்தின்
  rationale: ‘பாவமுள்ள’ என்பது சூழலின் கருத்தைத் தெரிவித்தாலும் மூலத்தின் மாம்ச உருவகத்தை விளக்கமாக மாற்றிவிடும். ‘மாம்சத்திற்குரிய’ என்பது உருவகத்தையும் அதன் இறையியல் இழுபறியையும் காக்கிறது.
- issue: ψυχή என்பதன் பொருள்
  choice: ஆத்துமா
  alternative: உயிர்; தன் முழுமை
  rationale: இங்கு ஆசைகள் மனிதரின் உள்ளார்ந்த உயிரையே எதிர்த்துப் போரிடுகின்றன. ‘ஆத்துமா’ மூலத்தின் மானுடவியல் கனத்தைப் பாதுகாக்கிறது; அதேவேளையில் இதை கடுமையான உடல்–ஆத்துமா இருபிரிவுக் கோட்பாடாக உரை வற்புறுத்தவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: παροίκους καὶ παρεπιδήμους என்ற இணைச் சொற்களின் நிலை
  choice: அந்நியர்களாகவும் தற்காலிகக் குடியிருப்பாளர்களாகவும்
  alternative: பரதேசிகளாகவும் நாடுகடத்தப்பட்டவர்களாகவும்
  rationale: மூலச் சொற்கள் கட்டாய நாடுகடத்தலைத் தெளிவாகக் கூறுவதில்லை. தேர்ந்த மொழிபெயர்ப்பு சமூக ரீதியான வெளிநிலையையும் தற்காலிகத் தங்குதலையும் காக்கிறது; நிகழ்கால உலகிற்கு முழுமையாகச் சொந்தமல்ல என்ற இறையியல் ஒலியையும் முடக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘மாம்சம்’, ‘ஆத்துமா’ ஆகிய வேதாகமச் சொற்கள் மூலத்தின் உருவக மற்றும் இறையியல் அகலத்தைப் பாதுகாக்க வைக்கப்பட்டுள்ளன; அவற்றின் பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளன. வாக்கியம் தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
