id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: ta
  text: முன்பு ஒரு மக்களாக இல்லாத நீங்கள்[a], இப்போது கடவுளின் மக்கள்; இரக்கம் பெறாதிருந்த நீங்கள்[b], இப்போது இரக்கம் பெற்றவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பேதுரு ஓசியா 1:9–10; 2:23 ஆகிய பகுதிகளை எதிரொலிக்கிறார்; இஸ்ரவேல் மீண்டும் நிலைநிறுத்தப்படுவதைப் பற்றிய மொழியைத் தமது வாசகர்கள் இப்போது கடவுளின் மக்களாகப் பெற்றுள்ள அடையாளத்திற்குப் பயன்படுத்துகிறார்.
    reason: cross_reference
  - marker: b
    text: 'அல்லது: “உங்களுக்கு இரக்கம் காட்டப்படாதிருந்தது; ஆனால் இப்போது உங்களுக்கு இரக்கம் காட்டப்பட்டுள்ளது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: நீங்கள்
  rationale: இந்தப் பன்மை உறவுப்பெயர் முந்தைய வசனத்தில் நேரடியாக அழைக்கப்பட்ட வாசகர்களையே குறிக்கிறது. தமிழில் “நீங்கள்” என்பது அந்தத் தொடர்பை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: ποτε
  choice: முன்பு
  rationale: இது νῦν (“இப்போது”) என்பதற்கு எதிராக அவர்களுடைய முந்தைய நிலையைச் சுட்டுகிறது.
- source_word: λαὸς
  choice: ஒரு மக்கள் / கடவுளின் மக்கள்
  rationale: λαός என்பது உடன்படிக்கைச் சூழலில் ஒரு கூட்டு மக்களைக் குறிக்கிறது. முதல் பகுதியில் உள்ள “ஒரு மக்கள்” என்ற பொதுவான பொருளையும், இரண்டாம் பகுதியில் உள்ள λαὸς θεοῦ என்ற குறிப்பிட்ட சொற்றொடரையும் இந்தத் தேர்வு வேறுபடுத்திக் காக்கிறது.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: இந்த உரிமைச் சுட்டும் வேற்றுமை வடிவம், அந்த மக்கள் கடவுளுக்குரியவர்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐκ ἠλεημένοι
  choice: இரக்கம் பெறாதிருந்த
  rationale: நிறைவுற்ற செயப்பாட்டு வினையெச்சம், இரக்கத்தைப் பெற்றிராத முந்தைய நிலையைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் அந்த நிலையின் நீடித்த விளைவையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐλεηθέντες
  choice: இரக்கம் பெற்றிருக்கிறீர்கள்
  rationale: இறந்தகால செயப்பாட்டு வினையெச்சம் கடவுளின் இரக்கச் செயலால் ஏற்பட்டுள்ள தற்போதைய நிலையைக் குறிக்கிறது. “பெற்றிருக்கிறீர்கள்” அந்த விளைவு இப்போதும் நிலவுவதை இயல்பாகக் காட்டுகிறது.
- source_word: δὲ
  choice: இப்போது ... ; ... இப்போது
  rationale: கிரேக்கத்தில் δέ இரு இடங்களிலும் முந்தைய நிலையையும் தற்போதைய நிலையையும் எதிர்மறையாக ஒப்பிடுகிறது. தமிழில் “முன்பு ... இப்போது” என்ற அமைப்பே அந்தத் திருப்பத்தை இயல்பாகத் தெளிவாக்குவதால் தனியாக “ஆனால்” சேர்க்கப்படவில்லை.
- source_word: νῦν
  choice: இப்போது
  rationale: விசுவாசிகளின் தற்போதைய அடையாளத்தை அவர்களுடைய முந்தைய நிலையுடன் நேரடியாக எதிர்கொள்கிறது.
theological_decisions:
- issue: ஓசியா நூலுக்கான மறைமுகச் சுட்டும் உடன்படிக்கை மக்களின் அடையாளமும்
  choice: முதல் பகுதியில் “ஒரு மக்களாக இல்லாத” என்றும், இரண்டாம் பகுதியில் “கடவுளின் மக்கள்” என்றும் உள்ள வேறுபாட்டைக் காத்து, மக்களின் கூட்டு நிலை மாற்றத்தை வெளிப்படுத்துதல்
  alternative: இரு பகுதிகளிலும் விளக்கமாக “கடவுளின் மக்களாக இல்லாதவர்கள் ... கடவுளின் மக்கள்” என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கம் முதலில் “ஒரு மக்கள் அல்ல” என்றே கூறுகிறது; “கடவுளின் மக்கள் அல்ல” என்று வெளிப்படையாகக் கூறவில்லை. இந்த வேறுபாட்டைக் காப்பது ஓசியா நூலின் பின்னணியை ஒலிக்கச் செய்வதோடு, குறிப்பிட்ட இன அல்லது திருச்சபைப் பிரிவு சார்ந்த விளக்கத்தை உரைக்குள் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “ஒரு மக்கள்” என்பது தனிநபர்களின் தொகுப்பை மட்டும் அல்லாமல், ஒரே கூட்டு அடையாளமுள்ள மக்களைக் குறிக்கிறது. இணையான இரு பகுதிகளின் “முன்பு ... இப்போது” அமைப்பு மூலத்தின் வலுவான நிலைமாற்றத்தைத் தக்கவைக்கிறது.
