id: 1PE.2.8
reference: 1 Peter 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: ta
  text: மேலும், “இடறவைக்கும் கல்லும், விழவைக்கும் பாறையும்” ஆனார். அவர்கள் வார்த்தைக்குக் கீழ்ப்படியாமல் அதில் இடறுகிறார்கள்; இதற்கும் அவர்கள் நியமிக்கப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதற்கு” என்பது கிரேக்கத்தில் சுருக்கமாக உள்ளது. அது அவர்கள் இடறுவதையா, அதற்கு வழிவகுக்கும் கீழ்ப்படியாமையையா குறிக்கிறது என்பதை வாக்கியம் வெளிப்படையாகத் தெளிவுபடுத்தவில்லை.
    reason: Preserves the genuine ambiguity of εἰς ὃ without specifying whether the appointment concerns stumbling, disobedience, or the preceding situation more broadly.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: இடறவைக்கும் கல்
  rationale: The genitive construction denotes a stone that causes stumbling; this rendering is natural in modern Tamil while retaining the source image.
- source_word: πέτρα σκανδάλου
  choice: விழவைக்கும் பாறை
  rationale: σκανδάλου here conveys an occasion of falling or offense. ‘விழவைக்கும்’ preserves the parallel physical metaphor without reducing it to mere emotional offense.
- source_word: τῷ λόγῳ
  choice: வார்த்தைக்கு
  rationale: ‘வார்த்தை’ retains the broad sense of λόγος and does not explicitly narrow it to ‘message’ or ‘gospel,’ though that is likely in context.
- source_word: ἀπειθοῦντες
  choice: கீழ்ப்படியாமல்
  rationale: The participle can express disobedience or refusal to believe. ‘கீழ்ப்படியாமல்’ preserves its volitional force and fits its relation to ‘the word.’
- source_word: ἐτέθησαν
  choice: நியமிக்கப்பட்டார்கள்
  rationale: The passive verb means that they were set, placed, or appointed for this outcome. ‘நியமிக்கப்பட்டார்கள்’ clearly conveys the passive appointment while leaving the agent unstated, as in Greek.
theological_decisions:
- issue: Referent and scope of εἰς ὃ (‘to which/for this’)
  choice: இதற்காகவே அவர்கள் நியமிக்கப்பட்டார்கள்
  alternative: அந்த இடறுதலுக்கே அவர்கள் நியமிக்கப்பட்டார்கள் / கீழ்ப்படியாமைக்கே அவர்கள் நியமிக்கப்பட்டார்கள்
  rationale: The Greek demonstrative is grammatically terse and its precise referent is debated. The translation retains ‘this’ rather than explicitly identifying the appointment as either to disobedience itself or to the resulting stumbling.
- issue: Relationship between disobedience and stumbling
  choice: அவர்கள் வார்த்தைக்குக் கீழ்ப்படியாமல் அதில் இடறுகிறார்கள்
  alternative: அவர்கள் வார்த்தைக்குக் கீழ்ப்படியாததால் இடறுகிறார்கள்
  rationale: The participial construction links disobedience closely with stumbling but does not require the translator to make the relationship exclusively causal. The chosen wording preserves the manner/attendant-circumstance nuance and identifies the word as what they stumble over.
translation_notes:
  register: Modern standard Tamil with a dignified but accessible biblical register. The paired images ‘கல் / பாறை’ and ‘இடறுதல் / விழுதல்’ are retained. ‘ஆனார்’ supplies the Tamil predicate required by the quotation’s contextual application to Christ.
