revisions:
- from: மேலும், “இடறவைக்கும் கல்லும், விழவைக்கும் பாறையும்” ஆனார். அவர்கள் வார்த்தைக்குக் கீழ்ப்படியாமல் அதில் இடறுகிறார்கள்; இதற்காகவே அவர்கள் நியமிக்கப்பட்டார்கள்.[a]
  to: மேலும், “இடறவைக்கும் கல்லும், விழவைக்கும் பாறையும்” ஆனார். அவர்கள் வார்த்தைக்குக் கீழ்ப்படியாமல் அதில் இடறுகிறார்கள்; இதற்கும் அவர்கள் நியமிக்கப்பட்டார்கள்.[a]
  rationale: The revision makes the Greek additive particle καί explicit through ‘இதற்கும்,’ while preserving the draft’s intentional ambiguity concerning εἰς ὃ and retaining its natural modern biblical Tamil register.
