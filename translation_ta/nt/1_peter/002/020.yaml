- from: நீங்கள் பாவம் செய்துகொண்டிருக்கும்போது அடிக்கப்படுவதையும் பொறுத்துக்கொண்டால், அதில் என்ன பாராட்டு இருக்கிறது? ஆனால் நீங்கள் நன்மை செய்துகொண்டிருக்கும்போது துன்பப்படுவதையும் பொறுத்துக்கொண்டால், இது கடவுள்முன் அருளாகும்.[a]
  to: நீங்கள் பாவம் செய்து அடிக்கப்படும்போது பொறுத்துக்கொண்டால், அதில் என்ன பாராட்டு இருக்கிறது? ஆனால் நீங்கள் நன்மை செய்து துன்பப்படும்போது பொறுத்துக்கொண்டால், அது கடவுளின் பார்வையில் தயவைப் பெறுகிறது.[a]
  rationale: மாற்றம் மூலத்தின் பொருளை மாற்றாது. இரு εἰ-கூறுகளின் இணை அமைப்பைத் தமிழில் இயல்பாக அமைத்து, முதல் கூறில் தகுதியற்ற செயலுக்குப் பிறகு வரும் அடியையும், இரண்டாம் கூறில் நன்மை செய்தபின் வரும் துன்பத்தையும் தெளிவாக்குகிறது. முடிவில் χάρις παρὰ θεῷ-இன் சூழல்சார் மதிப்பீட்டுப் பொருள் முதன்மை உரையில் தரப்பட்டு, ‘அருள்’ மற்றும் ‘பாராட்டுக்குரியது’ ஆகிய மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
