id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: ta
  text: நீங்கள் பாவம் செய்து அடிக்கப்படும்போது பொறுத்துக்கொண்டால், அதில் என்ன பாராட்டு இருக்கிறது? ஆனால் நீங்கள் நன்மை செய்து துன்பப்படும்போது பொறுத்துக்கொண்டால், அது கடவுளின் பார்வையில் தயவைப் பெறுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது கடவுள்முன் அருளாகும்”; அல்லது, “இது கடவுள்முன் பாராட்டுக்குரியது.”
    reason: χάρις παρὰ θεῷ இச்சூழலில் கடவுளின் தயவு அல்லது அங்கீகாரத்தைப் பெறுதல் என்று பொருள்படும்; ‘அருள்’ என்பது சொல்லியல் வெளிப்படைத்தன்மையைப் பாதுகாக்கும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: κλέος
  choice: பாராட்டு
  rationale: இங்கு புகழ் அல்லது பெயர்பெறுதல் என்பதல்ல, ஒருவரது நடத்தைக்குக் கிடைக்கும் பாராட்டே குறிக்கப்படுகிறது; கேள்வியின் நெறிசார் நோக்கை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: ἁμαρτάνοντες
  choice: பாவம் செய்துகொண்டிருக்கும்போது
  rationale: தொடர்நிலைப் பங்கேற்புவினையின் காலச்சூழலையும், பொதுவான ‘தவறு செய்வது’ என்பதைக் காட்டிலும் மூலத்தின் பாவம் சார்ந்த வலிமையையும் காக்கிறது.
- source_word: κολαφιζόμενοι
  choice: அடிக்கப்படுவதையும்
  rationale: கையால் தாக்கப்படுதல் அல்லது உடல்ரீதியாக அடிக்கப்படுதல் என்ற தெளிவான பொருளை நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ὑπομενεῖτε
  choice: பொறுத்துக்கொண்டால்
  rationale: துன்பத்தின் கீழ் நிலைத்திருத்தல் என்ற பொருளை இயல்பாகத் தருவதோடு, இரு கூறுகளிலும் வரும் ஒரே வினையின் மீளுரைப்பையும் காக்கிறது.
- source_word: ἀγαθοποιοῦντες
  choice: நன்மை செய்துகொண்டிருக்கும்போது
  rationale: நல்லதைச் செய்தல் என்ற நேரடியான பொருளையும் தொடர்நிலைச் சூழலையும் காக்கிறது.
- source_word: πάσχοντες
  choice: துன்பப்படுவதையும்
  rationale: அநியாய நடத்தைக்கு மட்டும் குறுக்காமல், மூலத்தில் உள்ள பரந்த ‘துன்பம் அனுபவித்தல்’ என்ற பொருளைத் தருகிறது.
- source_word: χάρις
  choice: அருள்
  rationale: சொல்லின் இறையியல் ஒலிப்பையும் மூலச்சொல்லுடனான வெளிப்படைத்தன்மையையும் காக்கிறது; இச்சூழலில் சாத்தியமான ‘தயவு/பாராட்டு’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρὰ θεῷ
  choice: கடவுள்முன்
  rationale: கடவுளுடைய பார்வை அல்லது மதிப்பீட்டில் என்ற உறவுநிலையைச் சுருக்கமாக வெளிப்படுத்துகிறது; ‘கடவுளிடம்’ என்பதும் சாத்தியமான மாற்று.
theological_decisions:
- issue: முடிவுக் கூறில் χάρις என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘கடவுள்முன் அருளாகும்’ என்று மொழிபெயர்த்து, தெய்வீகத் தயவு அல்லது பாராட்டு என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் காத்தல்.
  alternative: ‘இது கடவுளின் தயவைப் பெறுகிறது’ அல்லது ‘இது கடவுள்முன் பாராட்டுக்குரியது.’
  rationale: இத்தொடர் ‘அருள்’ என்ற இறையியல் பொருளுடனும், இச்சூழலில் ‘தயவு/அங்கீகாரம்’ என்ற பொருளுடனும் கேட்கப்படலாம். முதன்மை உரை அந்த இழுபறியைத் தீர்த்துவிடாமல் காக்கிறது; அடிக்குறிப்பு இயல்பான சூழல்சார் வாசிப்புகளை அளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் தெளிவும் காக்கப்பட்டுள்ளன. இரு நிபந்தனைக் கூறுகளிலும் தொடர்நிலைச் செயலும் ‘பொறுத்துக்கொள்வது’ என்ற மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன; ‘அருள்’ என்ற சற்று இறுக்கமான சொற்றொடர் மூலத்தின் உண்மையான பொருள் நெருக்கடியை அடிக்குறிப்புடன் காக்கிறது.
