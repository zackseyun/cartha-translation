  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: ta
  text: புதிதாய்ப் பிறந்த குழந்தைகளைப்போல், அதன் மூலம் நீங்கள் இரட்சிப்பை நோக்கி வளரும்படியாக, கலப்படமற்ற ஆவிக்குரிய பாலுக்காக ஏங்குங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: போல்
  rationale: இது அடையாளப்படுத்தாமல் ஒப்புமையை அறிமுகப்படுத்துகிறது.
- source_word: ἀρτιγέννητα βρέφη
  choice: புதிதாய்ப் பிறந்த குழந்தைகள்
  rationale: ἀρτιγέννητα என்பது மிக அண்மையில் பிறந்த நிலையையும், βρέφη என்பது சிறு குழந்தைகளையும் குறிக்கிறது; இந்தத் தேர்வு உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: τὸ λογικὸν
  choice: பகுத்தறிவுக்குரிய
  rationale: λογικός என்பதன் பகுத்தறிவு அல்லது உள்ளார்ந்த வாழ்வு சார்ந்த பொருளை நேரடியாகக் காக்கிறது; இதை வெறுமனே ‘ஆவிக்குரிய’ என்று மொழிபெயர்த்து அதன் உண்மையான பொருள் விரிவைச் சுருக்கவில்லை.
- source_word: ἄδολον
  choice: கலப்படமற்ற
  rationale: கலக்கப்படாத, தூய, வஞ்சகக் கலவையற்ற என்ற பொருளை பாலைச் சார்ந்த சூழலில் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γάλα
  choice: பால்
  rationale: போஷிப்பை மையமாகக் கொண்ட மூல உருவகத்தை அப்படியே காக்கிறது.
- source_word: ἐπιποθήσατε
  choice: ஏங்குங்கள்
  rationale: தீவிரமாக விரும்புமாறு கூறும் கட்டளையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: வளரும்படி
  rationale: அடுத்து வரும் நோக்கக் கூற்றை தமிழில் இயல்பாக இணைக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அதனால்
  rationale: ஒருமை நடுநிலைச் சுட்டுப்பெயர் முந்தைய ‘பாலை’க் குறிக்கிறது; வளர்ச்சிக்கான வழிமுறையாக அதன் பங்கைத் தெரிவிக்கிறது.
- source_word: αὐξηθῆτε
  choice: நீங்கள் வளர
  rationale: செயப்பாட்டு வடிவை தமிழில் செயற்கையாக மாற்றாமல், சூழலில் இயல்பாகத் தெரியும் வளர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: εἰς σωτηρίαν
  choice: இரட்சிப்பை நோக்கி
  rationale: εἰς என்பதன் இலக்கு நோக்கிய இயக்கத்தைப் பாதுகாத்து, இரட்சிப்பின் நிகழ்கால அல்லது எதிர்கால அம்சம் பற்றிய தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: λογικός என்ற சொல்லின் பொருள்
  choice: முதன்மை உரையில் ‘பகுத்தறிவுக்குரிய’
  alternative: ‘ஆவிக்குரிய’ அல்லது ‘உள்ளார்ந்த வாழ்வுக்குரிய’
  rationale: இந்தச் சொல் பகுத்தறிவு சார்ந்தது என்றும் உள்ளார்ந்த அல்லது ஆவிக்குரிய போஷிப்பு என்றும் புரிந்துகொள்ளப்படலாம். நேரடித் தொடர்பை முதன்மை உரையில் காத்து, உருவகப் பொருளை அடிக்குறிப்பில் விளக்குவது மூலத்தின் பொருள் விரிவை மறைக்காது.
- issue: εἰς σωτηρίαν என்பதன் திசைநோக்கிய வலிமை
  choice: ‘இரட்சிப்பை நோக்கி’ என்று மொழிபெயர்த்தல்
  alternative: ‘இரட்சிப்புக்காக’ அல்லது ‘உங்கள் இரட்சிப்பில்’
  rationale: மூலம் இரட்சிப்பை இலக்காகக் கொண்ட வளர்ச்சியை வெளிப்படுத்துகிறது. இத்தேர்வு அதை முற்றிலும் நிகழ்காலமாகவோ முற்றிலும் எதிர்காலமாகவோ தீர்மானிக்காமல் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘கலப்படமற்ற பால்’ என்ற இயல்பான சொற்றொடர் ἄδολον என்பதன் துல்லியத்தைத் தக்கவைக்கிறது. நோக்கக் கூற்றைத் தெளிவுபடுத்த ‘இப்படிச் செய்யுங்கள்’ சேர்க்கப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் கட்டளைக்கும் ἵνα கூற்றுக்கும் உள்ள உறவைத் தமிழில் வெளிப்படையாக்குகிறது.
