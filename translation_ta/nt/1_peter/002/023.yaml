id: 1PE.2.23
reference: 1 Peter 2:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: ta
  text: அவர் இகழப்பட்டபோது, பதிலுக்கு இகழவில்லை[a]; துன்பப்பட்டபோது, மிரட்டவில்லை; மாறாக, நீதியுடன் தீர்ப்பளிக்கிறவரிடம் தம்மை ஒப்படைத்துக்கொண்டே இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் பழித்துரைக்கப்பட்டபோது, பதிலுக்குப் பழித்துரைக்கவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘தம்மை’ என்ற செயப்படுபொருள் வெளிப்படையாக இல்லை; “தமது காரியத்தை ஒப்படைத்துக்கொண்டே இருந்தார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: λοιδορούμενος
  choice: இகழப்பட்டபோது
  rationale: λοιδορέω என்பதன் செயப்பாட்டு வினையெச்சம் வாய்மொழியாக இகழப்படுவதைக் குறிக்கிறது. ‘இகழப்பட்டபோது’ என்பது நவீனத் தமிழில் இயல்பாகவும், இணையான காலச்சூழலைத் தெளிவாகவும் தருகிறது.
- source_word: οὐκ ἀντελοιδόρει
  choice: பதிலுக்கு இகழவில்லை
  rationale: ἀντιλοιδορέω என்பதில் உள்ள பதிலடி அல்லது பரஸ்பரச் செயல் கருத்தை ‘பதிலுக்கு’ வெளிப்படுத்துகிறது; இறந்தகாலத் தொடர்ச்சியான அல்லது வழக்கமான பதிலடி மறுப்பையும் சூழல் உணர்த்துகிறது.
- source_word: πάσχων
  choice: துன்பப்பட்டபோது
  rationale: πάσχω என்ற நிகழ்கால வினையெச்சம் முன் வரும் வினையெச்சத்துக்கு இணையான காலச்சூழலாக அமைந்துள்ளது.
- source_word: οὐκ ἠπείλει
  choice: மிரட்டவில்லை
  rationale: ἀπειλέω அச்சுறுத்தும் வார்த்தைகளைச் சொல்வதைக் குறிக்கிறது. ‘மிரட்டவில்லை’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: παρεδίδου
  choice: தம்மை ஒப்படைத்துக்கொண்டே இருந்தார்
  rationale: παραδίδωμι என்பதன் முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து ஒப்படைத்தல் அல்லது நம்பி விடுதல் என்ற கருத்தை இங்கு தருகிறது. கிரேக்கத்தில் நேரடி செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் அது அவரையே குறிக்கும் என முதன்மை உரை எடுத்துரைக்கிறது; அடிக்குறிப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τῷ κρίνοντι δικαίως
  choice: நீதியுடன் தீர்ப்பளிக்கிறவரிடம்
  rationale: பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்ட வினையெச்சத்தையும் δικαίως என்ற வினையடையையும் தனிப்பட்ட பட்டமாக மாற்றாமல் விளக்கவுரையாகப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: மாறாக
  rationale: பதிலடி கொடுக்காததற்கும் நீதியான தீர்ப்பளிப்பவரிடம் ஒப்படைப்பதற்கும் இடையிலான எதிர்மறை மாற்றத்தைத் தெளிவாக்குகிறது.
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கிறிஸ்துவைத் தொடர்ந்து சுட்டும் உறவுப்பெயர்; தமிழ் வசனத் தொடரில் ‘அவர்’ இயல்பாகச் செயல்படுகிறது.
theological_decisions:
- issue: ‘நீதியுடன் தீர்ப்பளிக்கிறவர்’ என்பவரின் அடையாளம்
  choice: கிரேக்கத்தைப் போலவே விளக்கவுரையாக மட்டும் கூறி, ‘பிதாவாகிய தேவன்’ என்ற குறிப்பிட்ட பட்டத்தைச் சேர்க்கவில்லை.
  alternative: இது தேவனைக் குறிக்கிறது என்று வெளிப்படையாகப் பெயரிடுதல்.
  rationale: சூழல் தேவனைக் குறித்தாலும், மூலவாக்கியம் அவரைப் பெயராலோ குறிப்பிட்ட நபருக்குரிய பட்டத்தாலோ அழைக்கவில்லை. ஆகவே மொழிபெயர்ப்பு மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- issue: παρεδίδου என்பதன் மறைந்த செயப்படுபொருள்
  choice: முதன்மை உரையில் ‘தம்மை’ என்று வழங்கி, கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பில் குறிப்பிட்டது.
  alternative: ‘தமது காரியத்தை’ அல்லது ‘தமது வழக்கை’ ஒப்படைத்தார் எனப் பொருள் கொள்ளுதல்.
  rationale: கிறிஸ்துவின் பாடுகளும் பதிலடி கொடுக்காத செயலுமே உடனடி சூழல் என்பதால் ‘தம்மை’ என்பது இயல்பான வாசிப்பு. எனினும் மூலத்தில் செயப்படுபொருள் சொல்லப்படாததால் மாற்று புரிதலை அடிக்குறிப்பு மூலம் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘இகழ்’, ‘துன்பப்படு’, ‘மிரட்டு’, ‘தீர்ப்பளி’ போன்ற வழக்கிலுள்ள தெளிவான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; ‘ஒப்படைத்துக்கொண்டே இருந்தார்’ என்பது முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
