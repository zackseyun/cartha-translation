source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: ta
  text: பிற இனத்தார் நடுவில் உங்கள் நடத்தை நற்பண்புடையதாக இருக்கட்டும். அப்போது, அவர்கள் உங்களைத் தீமை செய்கிறவர்கள் என்று பழித்துப் பேசும் காரியத்தில், உங்கள் நற்செயல்களைக் கவனித்துப் பார்த்து, கடவுள் வருகை தரும் நாளில் அவரை மகிமைப்படுத்துவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுள் வருகை தரும் நாள்” என்பது கடவுள் மக்களிடம் வந்து கவனிக்கும், விசாரிக்கும், அல்லது தலையிடும் நாளைக் குறிக்கலாம்; இங்கே அது அருளான வருகையையா நீதித்தீர்ப்பையா குறிப்பதாகத் தெளிவாகச் சொல்லப்படவில்லை.
    reason: ἐπισκοπή என்ற சொல்லின் வருகை, கவனிப்பு, விசாரணை, தலையீடு ஆகிய பொருள் விரிவையும் அதன் இறையியல் திறந்த தன்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἀναστροφή
  choice: நடத்தை
  rationale: ஒருவரின் அன்றாட வாழ்க்கை முறை மற்றும் ஒழுக்கத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἔθνη
  choice: பிற இனத்தார்
  rationale: இங்கு யூதரல்லாத சுற்றுப்புற மக்களைக் குறிக்கும் சொல்லின் இன/மக்கள் சார்ந்த பொருளைப் பாதுகாக்கிறது; மதப்பெயராக மட்டும் சுருக்கவில்லை.
- source_word: καλήν / καλῶν
  choice: நற்பண்புடையதாக / நற்செயல்கள்
  rationale: முதல் இடத்தில் கண்ணியமான நடத்தையையும், அடுத்த இடத்தில் நல்ல செயல்களையும் சூழலுக்கேற்ப வேறுபடுத்திக் காட்டுகிறது.
- source_word: καταλαλοῦσιν
  choice: பழித்துப் பேசுகிறார்கள்
  rationale: தீங்காக அல்லது அவதூறாகப் பேசும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποπτεύοντες
  choice: கண்ணாரக் கண்டு
  rationale: வெறுமனே பார்ப்பதைவிட நேரடியாகவும் கவனமாகவும் அவதானிப்பதைச் சுட்டுகிறது.
- source_word: ἐπισκοπῆς
  choice: சந்திப்பு
  rationale: கடவுள் வந்து கவனிப்பது, விசாரிப்பது, அல்லது தலையிடுவது ஆகிய சாத்தியங்களை ஒரே விளக்கமாக முடிவுசெய்யாமல் வைத்திருக்கிறது.
theological_decisions:
- issue: ἐν ᾧ என்பதன் தொடர்பும் பொருளும்
  choice: எந்தக் காரியத்தில் ... அதே காரியத்தில்
  alternative: அவர்கள் உங்களைத் தீமை செய்கிறவர்கள் என்று பழித்துப் பேசினாலும்
  rationale: கிரேக்கத்தின் ‘எதில்/எந்தக் காரியத்தில்’ என்ற கட்டமைப்பைப் பாதுகாத்து, அதை வெறும் எதிர்மறை இணைப்பாக மாற்றவில்லை.
- issue: ἡμέρα ἐπισκοπῆς என்பதன் தன்மை
  choice: சந்திப்பின் நாள்
  alternative: விசாரணையின் நாள் / கடவுள் சந்திக்கும் நாள் / தண்டனைத் தீர்ப்பின் நாள்
  rationale: இது இரட்சிப்பான வருகையையா, நீதித்தீர்ப்பையா, பொதுவான தெய்வீகத் தலையீட்டையா குறிக்கிறது என்பது சூழலில் முழுமையாகத் தீர்மானிக்கப்படாததால் அம்பிகையைப் பாதுகாக்கிறது.
- issue: δοξάσωσι என்பதன் கால/நோக்குச் சாயல்
  choice: மகிமைப்படுத்துவார்கள்
  alternative: மகிமைப்படுத்தும்படியாக
  rationale: ἵνα நோக்கத்தையோ விளைவையோ குறிக்கலாம்; தமிழில் இயல்பான விளைவு வாக்கியமாக வழங்கப்பட்டாலும் உறுதியான மனமாற்றக் கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் சிக்கலான தொடர்பைத் தெளிவாக்க சிறு மறுசீரமைப்பு செய்யப்பட்டது; ஆனால் ‘எந்தக் காரியத்தில்’ என்ற அம்பிகை நீக்கப்படவில்லை.
