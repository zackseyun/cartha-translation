  source_fidelity: 'முதல் கட்டளை, ‘எதில்/எந்தக் காரியத்தில்’ (ἐν ᾧ) என்ற தொடர்பு, அவதூறு, நற்செயல்களைக் கவனித்தல், கடவுளை மகிமைப்படுத்துதல் ஆகியவை பெரும்பாலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் “அதே காரியத்தில் உங்கள் நற்செயல்களைக் கண்டு” என்பது கிரேக்கத்தில் இல்லாத நேரடி இணைப்பை ஏற்படுத்துகிறது: நற்செயல்களைக் கவனிப்பது அவதூறு கூறப்படும் அதே காரியத்திலேயே நிகழ்கிறது எனச் சுட்டுகிறது. மேலும் ἐπισκοπῆς-ஐ “சந்திப்பு” என மொழிபெயர்ப்பது தமிழில் சாதாரண மனிதச் சந்திப்பைக் குறிக்கக்கூடும்; தெய்வீக வருகை/கவனிப்பின் பொருள் போதியளவு வெளிப்படவில்லை.'
