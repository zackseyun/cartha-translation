- from: ஆண்டவருக்காக, மனிதர்கள் ஏற்படுத்திய ஒவ்வோர் ஆட்சி அமைப்புக்கும்[a] கீழ்ப்படியுங்கள்; உயரதிகாரம் உடையவர் என்ற முறையில் அரசனுக்கோ[b],
