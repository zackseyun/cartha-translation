  text: ஆண்டவரின் பொருட்டு, மனிதச் சமூகத்தின் ஒவ்வோர் அதிகார அமைப்புக்கும்[a] கீழ்ப்படியுங்கள்; மேலான அதிகாரம் உடையவராக அரசனுக்கோ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘ஒவ்வொரு மனிதப் படைப்புக்கும்’; மரபாக, ‘மனிதருடைய ஒவ்வொரு கட்டளைக்கும்.’ அடுத்து அரசனும் ஆளுநர்களும் குறிப்பிடப்படுவதால், இங்கே இச்சொற்றொடர் மனிதச் சமூகத்தின் குடிமை அமைப்புகளையோ அதிகாரங்களையோ குறிக்கிறது.'
