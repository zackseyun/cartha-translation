  source_fidelity: 'முக்கியப் பொருள் சரியாக உள்ளது: Ὑποτάγητε கட்டளையாகவும், πάσῃ பகிர்ந்தளிக்கும் ‘ஒவ்வோர்’ என்பதாகவும், அரசனை உயர்ந்த அதிகார நிலையில் உள்ளவராகவும் மொழிபெயர்க்கப்பட்டுள்ளது. ஆனால் ‘மனிதர்கள் ஏற்படுத்திய’ என்பது ἀνθρωπίνῃ என்பதன் ‘மனித/மனிதச் சமூகத்தைச் சார்ந்த’ என்ற அடைமொழியைச் சற்றே வலுப்படுத்தி, ‘மனிதர்களால் நிறுவப்பட்ட’ என்ற குறிப்பிட்ட செயற்பொருளைச் சேர்க்கிறது. மேலும் அடிக்குறிப்பில் உள்ள ‘குடியாட்சி’ ஜனநாயக ஆட்சியைக் குறிப்பதால், மூலத்தின் பொதுவான civic sense-ஐ தேவையின்றி குறுக்குகிறது.'
  naturalness: திருத்தப்பட்ட வாசகம் நவீனத் தரத் தமிழில் இயல்பாகவும், வசனம் அடுத்த வசனத்தில் தொடரும் அமைப்பையும் காக்கிறது. ‘மேலான அதிகாரம் உடையவராக’ என்பது ‘உயரதிகாரம் உடையவர் என்ற முறையில்’ என்பதைக் காட்டிலும் வழக்கானதும் தெளிவானதுமாகும்.
  terminology: ‘ஆண்டவர்’ κύριος என்பதன் குறிப்பாக்கப்படாத பட்டத்தைத் தக்கவைக்கிறது. ‘மனிதச் சமூகத்தின் ஒவ்வோர் அதிகார அமைப்பு’ என்பது சூழலில் உள்ள κτίσις-இன் நிறுவன/குடிமை அதிகாரப் பொருளைத் தருகிறது; அதே நேரத்தில் ‘மனிதர்களால் ஏற்படுத்தப்பட்டது’ என மூலத்தை விடக் குறிப்பாக்குவதில்லை. அடிக்குறிப்பில் ‘குடிமை அமைப்புகள்’ பயன்படுத்தப்படுகிறது; இது ‘குடியாட்சி’ (democracy) என்ற தவறான அரசியல் குறிப்பைத் தவிர்க்கிறது.
