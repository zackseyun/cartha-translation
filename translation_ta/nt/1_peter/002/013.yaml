lexical_decisions:
- source_word: Ὑποτάγητε
  choice: கீழ்ப்படியுங்கள்
  rationale: தன்னார்வமாக அதிகாரத்துக்குக் கீழ்ப்பட்டு நடக்குமாறு கூறும் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάσῃ
  choice: ஒவ்வோர்
  rationale: ஒருமைத் தத்துவப் பெயருடன் வரும் πᾶς என்பதன் பகிர்ந்தளிக்கும் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἀνθρωπίνῃ κτίσει
  choice: மனிதர்கள் ஏற்படுத்திய ஒவ்வோர் ஆட்சி அமைப்புக்கும்
  rationale: κτίσις என்பதன் அடிப்படைப் பொருள் ‘படைப்பு’ என்றாலும், அடுத்து அரசனும் ஆளுநர்களும் எடுத்துக்காட்டப்படுவதால் இங்கு மனிதச் சமூகத்தின் குடியாட்சி அமைப்புகளைக் குறிக்கிறது. ‘ஆட்சி அமைப்பு’ என்பது ஒவ்வொரு மனிதரையும் குறிக்கும் தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: διὰ τὸν κύριον
  choice: ஆண்டவருக்காக
  rationale: διά + வேற்றுமை உருபின் இப்பயன்பாடு காரணம் அல்லது நோக்கத்தைச் சுட்டுகிறது; கீழ்ப்படிதல் ஆண்டவருடனான உறவின் பொருட்டு நிகழ்வதைச் சுருக்கமாகக் கூறுகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: கிரேக்கத்தில் உள்ள பட்டத்தை மட்டும் தக்கவைத்து, அது இயேசுவையா கடவுளையா குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: εἴτε βασιλεῖ
  choice: அரசனுக்கோ
  rationale: εἴτε தொடங்கும் இணை அமைப்பை ‘-க்கோ’ என்ற தமிழ்ச் சொல்லமைப்பு இயல்பாகத் தொடங்குகிறது; βασιλεύς என்பதன் பொதுவான பொருளான ‘அரசன்’ தக்கவைக்கப்படுகிறது.
- source_word: ὡς ὑπερέχοντι
  choice: உயரதிகாரம் உடையவர் என்ற முறையில்
  rationale: மற்றவர்களுக்கு மேற்பட்ட நிலை அல்லது அதிகாரம் உடையவர் என்ற செயல்பாட்டுப் பொருளை வெளிப்படுத்துகிறது; முற்றிலும் வரம்பற்ற அதிகாரத்தை மொழிபெயர்ப்பு தானாகக் கூறுவதில்லை.
theological_decisions:
- issue: ἀνθρωπίνῃ κτίσει குறிக்கும் குடியாட்சி அதிகாரத்தின் இயல்பு
  choice: மனிதர்கள் ஏற்படுத்திய ஆட்சி அமைப்பு
  alternative: மனிதப் படைப்பு; மனிதருடைய கட்டளை; ஒவ்வொரு மனித உயிரும்
  rationale: அரசனும் ஆளுநர்களும் தொடர்ந்து குறிப்பிடப்படுவது குடியாட்சி அமைப்புகளே நோக்கத்தில் இருப்பதைக் காட்டுகிறது. இந்த மொழியாக்கம் அமைப்பின் மனிதச் சமூக வடிவைத் தெரிவிக்கிறது; அதேவேளையில் அதன் இறையியல் சட்டப்பூர்வத்தன்மை குறித்து மூலவசனம் கூறாத ஒன்றைச் சேர்ப்பதில்லை.
- issue: κύριον என்பதன் குறிப்பிட்ட நபர்
  choice: ஆண்டவர் என்று குறிப்பாக்காமல் தக்கவைத்தல்
  alternative: இயேசு; கடவுள்
  rationale: மூலத்தில் ‘ஆண்டவர்’ என்ற பட்டம் மட்டுமே உள்ளது. எனவே மொழிபெயர்ப்பு அதன் உண்மையான குறிப்பீட்டு விரிவைத் தக்கவைக்கிறது.
- issue: ὑπερέχοντι குறிக்கும் அதிகாரத்தின் அளவு
  choice: உயரதிகாரம் உடையவர்
  alternative: உச்ச அதிகாரம் உடையவர்; எல்லாருக்கும் மேலானவர்
  rationale: பங்கேற்புவினை உயர்ந்த நிலை அல்லது அதிகாரத்தைக் குறிக்கிறது. ‘உயரதிகாரம்’ இந்தப் பொருளைத் தருகிறது; அரசனுக்கு இறுதியான அல்லது வரம்பற்ற மேலாதிக்கத்தை இறையியல் கூற்றாக மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆட்சி அமைப்பு’ சூழலைத் தெளிவாக்குகிறது; அடிப்படைச் சொற்பொருளின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதை இறுதியிலுள்ள காற்புள்ளி காட்டுகிறது.
