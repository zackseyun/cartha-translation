  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: ta
  text: ஆகையால்[a], எல்லா வன்மத்தையும், எல்லா வஞ்சகத்தையும், பாசாங்குகளையும், பொறாமைகளையும், எல்லாப் புறங்கூறுதல்களையும்[b] களைந்துவிட்டு,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆகவே’ என்றும் மொழிபெயர்க்கலாம். ‘களைந்துவிட்டு’ என்பதற்கான கிரேக்கச் சொல், இன்னும் சொல்லுக்குச் சொல்லாக ‘ஒதுக்கிவிட்டு’ அல்லது ‘கழற்றிவிட்டு’ என்றும் தரப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எல்லாத் தீய பேச்சுகளையும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், பிறரைப் பற்றித் தீங்காகப் பேசுவதைப் பரந்த வகையில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: களைந்துவிட்டு
  rationale: இது இறந்தகால நடுவினைப் பெயரெச்சமாக இருந்து, 2ஆம் வசனத்தின் முதன்மை ஏவலுக்கு ஆயத்தமாக நிகழும் செயலைக் குறிக்கிறது. ‘களைந்துவிட்டு’ என்பது தீய பழக்கங்களை நீக்கிவிடுதல் என்ற பொருளையும் தொடரும் வாக்கியத்துடனான இலக்கணத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய பகுதியிலிருந்து, குறிப்பாக 1:22–25 இலிருந்து, வரும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πᾶσαν κακίαν
  choice: எல்லா வன்மத்தையும்
  rationale: இந்தத் தீய பண்புகளின் பட்டியலில் κακία என்பது பொதுவான தீமையை மட்டும் அல்லாமல், பிறர்மீது கொண்ட தீய நோக்கம் அல்லது பகைமையையும் குறிக்கிறது. ‘வன்மம்’ அந்த உறவுசார் நெறிக்கேட்டைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: πάντα δόλον
  choice: எல்லா வஞ்சகத்தையும்
  rationale: δόλος குறிக்கும் ஏமாற்றும் சூழ்ச்சித்தன்மையை நவீனத் தமிழில் தெளிவாக எடுத்துரைக்கிறது.
- source_word: ὑποκρίσεις
  choice: பாசாங்குகளையும்
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, பல்வேறு போலிநடத்தைகளையும் வெளிவேடங்களையும் குறிக்கிறது.
- source_word: φθόνους
  choice: பொறாமைகளையும்
  rationale: மூலத்திலுள்ள பன்மையைப் பேணி, மீண்டும் மீண்டும் தோன்றும் அல்லது பலவகையாக வெளிப்படும் பொறாமையைச் சுட்டுகிறது.
- source_word: πάσας καταλαλιάς
  choice: பிறருக்கு எதிரான எல்லாப் புறங்கூறுதல்களையும்
  rationale: καταλαλιά என்பது பிறரைப் பழித்தோ அவர்களுக்கு எதிராகவோ பேசுவதைப் பரந்த வகையில் குறிக்கிறது. ‘பிறருக்கு எதிரான’ என்பது அதன் உறவுசார் திசையை வெளிப்படுத்துகிறது; ‘புறங்கூறுதல்’ இயல்பான தமிழில் அதன் தீய பேச்சு அம்சத்தைப் பிடிக்கிறது.
theological_decisions:
- issue: தீய பண்புகளின் பட்டியலின் நெறிசார் பரப்பு
  choice: ஒவ்வொரு தீய பண்பையும் தெளிவான, உறவுசார் நெறிக்கேடாக மொழிபெயர்த்தல்
  alternative: κακία என்பதை ‘எல்லாத் தீமையும்’ என்றும் καταλαλιάς என்பதை ‘எல்லாத் தீய பேச்சுகளும்’ என்றும் பொதுவாக மொழிபெயர்த்தல்
  rationale: இது ஒரு நெறிசார் அறிவுரை; கொள்கை விளக்கத்தைச் சேர்க்காமல், கிரேக்கப் பட்டியலின் தெளிவான ஒழுக்க வலிமையையும் அதன் பரந்த பேச்சுசார் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம அறிவுரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. இது 2ஆம் வசனத்தில் தொடரும் வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; கிரேக்கப் பன்மைகள் இயன்றவரை தமிழிலும் பேணப்பட்டுள்ளன.
