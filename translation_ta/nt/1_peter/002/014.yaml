source:
  edition: SBLGNT
  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: ta
  text: அல்லது, தீமை செய்கிறவர்களைத் தண்டிப்பதற்கும், நன்மை செய்கிறவர்களைப் பாராட்டுவதற்கும், அவர் மூலம்[a] அனுப்பப்பட்ட ஆளுநர்களுக்குக் கீழ்ப்படியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் மூலம்” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அரசன் அல்லது பேரரசரைக் குறிக்கிறது. சிலர் இதை, அதிகாரத்தை ஒழுங்குபடுத்தும் கடவுளைக் குறிக்கும் என்று விரிவாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: அல்லது
  rationale: முந்தைய வசனத்தில் தொடங்கிய மாற்றுத் தொடரை இயல்பாகத் தொடர்கிறது.
- source_word: ἡγεμόσιν
  choice: ஆளுநர்களுக்கு
  rationale: குடிமை ஆட்சிச் சூழலில் ஆட்சி அதிகாரிகளைச் சுட்டும் இயல்பான, குறிப்பான சொல்; ரோம நிர்வாகப் பதவியை அளவுக்கு மீறிக் குறுக்கவில்லை.
- source_word: ὡς δι’ αὐτοῦ πεμπομένοις
  choice: அவரால் அனுப்பப்பட்ட
  rationale: διά + ஆறாம் வேற்றுமையின் முகமைப் பொருளையும், முந்தைய வசனத்தின் அரசனை αὐτοῦ சுட்டுகிறது என்ற மிக அருகிலுள்ள தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: εἰς ἐκδίκησιν
  choice: தண்டிப்பதற்கும்
  rationale: அரசின் நீதித்துறைச் செயல்பாட்டை இச்சூழலில் தெளிவாகக் காட்டுகிறது; ‘பழிவாங்குதல்’ என்ற உணர்ச்சிசார் மிகைப்பைத் தவிர்க்கிறது.
- source_word: κακοποιῶν
  choice: தீமை செய்கிறவர்களை
  rationale: தீய செயலில் ஈடுபடுவோரைச் சுட்டும் வினைநயத்தைப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: ἔπαινον
  choice: பாராட்டுவதற்கும்
  rationale: தண்டனைக்கு இணையாக ஆட்சியாளரின் அங்கீகாரம் அல்லது புகழ்ச்சியைச் சுட்டுகிறது; தமிழில் வினை வடிவம் இணைப்பை இயல்பாக்குகிறது.
- source_word: ἀγαθοποιῶν
  choice: நன்மை செய்கிறவர்களை
  rationale: நல்ல செயலைச் செய்பவர்கள் என்ற கிரேக்க வினைநயத்தைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: δι’ αὐτοῦ என்பதில் αὐτοῦ யாரைக் குறிக்கிறது?
  choice: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அரசன் அல்லது பேரரசன்
  alternative: கடவுள்
  rationale: அருகிலுள்ள இயல்பான முன்னிலைச் சொல் முந்தைய வசனத்தின் அரசன்; இருந்தாலும் கடவுளின் வழியாக அதிகாரம் ஒழுங்குபடுத்தப்படுவதாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். தனியாக வழங்கப்பட்ட இந்த வசனம் முந்தைய வசனத்தின் ‘கீழ்ப்படியுங்கள்’ என்ற கட்டளையைத் தொடர்வதால், தமிழில் பொருள் நிறைவடைய அந்த வினை மீண்டும் வெளிப்படையாக இடப்பட்டுள்ளது. அடிக்குறி தொடர்புடைய ‘அவரால்’ என்பதற்குப் பின் அல்லாமல் வசன முடிவில் வைக்கப்பட்டாலும், [a] குறிப்பு முதன்மை உரையில் தெளிவாக உள்ளது.
