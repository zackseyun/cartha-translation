  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: ta
  text: ஆண்டவர் நல்லவர் என்பதை நீங்கள் உண்மையிலேயே சுவைத்தறிந்திருந்தால்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவர் நல்லவர் என்பதை நீங்கள் சுவைத்தறிந்திருப்பதால்.’ கிரேக்கத்தில் நிபந்தனை வடிவம் பயன்படுத்தப்பட்டாலும், அந்த நிபந்தனை உண்மையானது என்ற கருத்து அதில் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘நல்லவர்’ என்பதை ‘கனிவுள்ளவர்’ அல்லது ‘கிருபையுள்ளவர்’ என்றும் மொழிபெயர்க்கலாம். இச்சொல்லாட்சி சங்கீதம் 34:8-ஐ எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: உண்மையிலேயே ... இருந்தால்
  rationale: கிரேக்கத்தின் நிபந்தனை வடிவத்தைத் தக்கவைத்தபடியே, இந்நிபந்தனை உண்மையானது என்று எழுத்தாளர் எதிர்பார்க்கும் சொல்லாட்சியின் வலிமையை ‘உண்மையிலேயே’ வெளிப்படுத்துகிறது.
- source_word: ἐγεύσασθε
  choice: சுவைத்தறிந்திருந்தால்
  rationale: ‘சுவைத்தல்’ என்ற நேரடி உருவகத்தைப் பாதுகாக்கிறது; அதேவேளையில், ஆண்டவரின் நன்மையை அனுபவித்து அறிதல் என்ற கருத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது. 2:2–3-இன் உணவு சார்ந்த உருவகத்துக்கும் சங்கீதம் 34:8-ன் எதிரொலிக்கும் இது பொருந்துகிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: சுவைத்தறிந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் கிரேக்கத் தொடரை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: χρηστὸς
  choice: நல்லவர்
  rationale: இந்தச் சொல் ‘நல்லவர்,’ ‘கனிவுள்ளவர்,’ ‘கிருபையுள்ளவர்’ ஆகிய பொருள்களைத் தரலாம். ‘நல்லவர்’ என்பது அதன் பரந்த பொருளையும் சங்கீதம் 34:8-ன் எதிரொலியையும் பாதுகாக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் மொழிபெயர்ப்பு. சூழலில் இது கிறிஸ்துவைக் குறிப்பதாகத் தோன்றினாலும், சங்கீதத்தில் ஆண்டவரைக் குறிக்கும் மொழியுடனான தொடர்பையும் இத்தலைப்பு தக்கவைக்கிறது.
theological_decisions:
- issue: εἰ நிபந்தனைத் தொடரின் வலிமை
  choice: ‘உண்மையிலேயே ... இருந்தால்’ என்று நிபந்தனை வடிவத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘சுவைத்தறிந்திருப்பதால்’ என்று உறுதிப்படுத்திக் கூறுதல்
  rationale: வாசகர்கள் உண்மையில் இதை அனுபவித்திருக்கிறார்கள் என்று இத்தொடர் கருதக்கூடும்; இருப்பினும் கிரேக்கம் நிபந்தனை வடிவையே பயன்படுத்துகிறது. ஆகவே அதன் அறிவுறுத்தல் சார்ந்த சொல்லாட்சியையும் உள்ளார்ந்த இறுக்கத்தையும் தீர்த்துவிடாமல் பாதுகாக்கப்படுகிறது.
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘ஆண்டவர்’ என்று மட்டும் வழங்குதல்
  alternative: ‘ஆண்டவராகிய கிறிஸ்து’ என்று விளக்கிச் சேர்த்தல்
  rationale: 1 பேதுரு 2-ன் சூழல் இயேசுவுடன் நெருக்கமாக இணைந்திருந்தாலும், இச்சொல்லாட்சி சங்கீதம் 34:8-ஐயும் எதிரொலிக்கிறது. ‘கிறிஸ்து’ என்று உரைக்குள் சேர்க்காமல் இருப்பது இரு தொடர்புகளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘சுவைத்தறிதல்’ என்பது உணவின் உருவகத்தை இழக்காமல் அனுபவித்து அறிதல் என்ற பொருளையும் இயல்பாகத் தருகிறது; நிபந்தனை வடிவமும் இறையியல் தொடர்பின் தெளிவின்மையும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
