review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the comparison, ongoing passive force of οἰκοδομεῖσθε, the corporate sense of ἱεράτευμα, sacrificial language, divine acceptability, and mediation through Jesus the Messiah. However, its final repeated clause, ‘இவ்வாறு கட்டப்பட்டுவருகிறீர்கள்,’ is not present in Greek and unnecessarily restates the main verb; ‘வே’ also adds emphasis not supplied by the source. A single, ordered Tamil clause can retain the source relationships without this addition.
  naturalness: Most wording is clear modern Tamil. ‘கட்டப்பட்டு வருகிறீர்கள்’ is more naturally spaced than ‘கட்டப்பட்டுவருகிறீர்கள்.’ Recasting the coordinated result expressions as ‘ஆவிக்குரிய வீடாகவும் பரிசுத்த ஆசாரியக் கூட்டமாகவும்’ produces a fluent sentence and avoids the awkward repetition.
  terminology: ‘ஆவிக்குரிய,’ ‘பலிகள்,’ ‘கடவுளுக்கு ஏற்ற,’ and ‘இயேசு மெசியாவின் வழியாக’ are appropriate. ‘பரிசுத்த ஆசாரியக் கூட்டம்’ adequately conveys the collective priesthood without reducing it to isolated priests. The Messiah rendering follows the supplied project decision.
  issues:
  - severity: medium
    issue: The final clause repeats ‘கட்டப்பட்டுவருகிறீர்கள்.’
    rationale: The Greek contains one occurrence of οἰκοδομεῖσθε. Repeating it as an explanatory conclusion adds material and obscures the direct connection between holy priesthood and offering sacrifices.
  - severity: low
    issue: ‘வே’ in ‘செலுத்துவதற்காகவே’ adds restrictive/emphatic force.
    rationale: ἀνενέγκαι marks purpose but does not itself supply ‘indeed/precisely/only.’ The unmarked purpose expression is more faithful.
  - severity: low
    issue: The translation reverses the sequence of ‘spiritual house’ and ‘holy priesthood.’
    rationale: The reversal is not a major meaning change, but retaining source order improves transparency and allows the coordinated building-result imagery to read naturally in Tamil.
  revised_text: நீங்களும்கூட உயிருள்ள கற்களைப்போல்[a], ஆவிக்குரிய வீடாகவும் பரிசுத்த ஆசாரியக் கூட்டமாகவும் கட்டப்பட்டு வருகிறீர்கள்; இயேசு மெசியாவின்[c] வழியாகக் கடவுளுக்கு ஏற்ற ஆவிக்குரிய பலிகளைச் செலுத்துவதற்காக.
