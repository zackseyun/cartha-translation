source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: ta
  text: நீங்களும்கூட உயிருள்ள கற்களைப்போல்[a], ஆவிக்குரிய வீடாகவும் பரிசுத்த ஆசாரியக் கூட்டமாகவும் கட்டப்பட்டு வருகிறீர்கள்; இயேசு மெசியாவின்[c] வழியாகக் கடவுளுக்கு ஏற்ற ஆவிக்குரிய பலிகளைச் செலுத்துவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள கற்களாக.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் “இயேசு கிறிஸ்து”; Χριστός இங்கு ஒரு பட்டமாகச் செயல்படுவதால் “இயேசு மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: நீங்களும்கூட
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் αὐτοί என்பதன் வலியுறுத்தலையும் இயல்பான பன்மை நேரடி அழைப்பில் தக்கவைக்கிறது.
- source_word: ὡς λίθοι ζῶντες
  choice: உயிருள்ள கற்களைப்போல்
  rationale: ὡς குறிக்கும் ஒப்புமையையும் ζῶντες குறிக்கும் உயிருள்ள தன்மையையும், முந்தைய வசனத்திலுள்ள உருவகத் தொடர்புடன் பாதுகாக்கிறது.
- source_word: οἰκοδομεῖσθε
  choice: கட்டப்பட்டுவருகிறீர்கள்
  rationale: நிகழ்காலச் செயலின் தொடர்ச்சியையும் செயப்பாட்டு வினையையும் காட்டுகிறது; செய்பவர் யார் என்பதை வசனம் வெளிப்படையாகச் சொல்லாததால் மொழிபெயர்ப்பும் சேர்த்துச் சொல்லவில்லை.
- source_word: οἶκος πνευματικὸς
  choice: ஆவிக்குரிய வீடாக
  rationale: கட்டட உருவகத்தையும் πνευματικός என்பதன் பரந்த பொருளையும் குறிப்பிட்ட விளக்கத்தால் குறுக்காமல் தக்கவைக்கிறது.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: பரிசுத்த ஆசாரியக் கூட்டமாகும்படி
  rationale: εἰς காட்டும் நோக்கம் அல்லது விளைவு இரண்டிற்கும் இடமளிக்கிறது; ἱεράτευμα தனித்தனி ஆசாரியர்களை மட்டும் அல்ல, ஆசாரியப் பணிக்குரிய ஒருங்கிணைந்த சமூகத்தைக் குறிப்பதால் ‘ஆசாரியக் கூட்டம்’ என வழங்கப்படுகிறது.
- source_word: ἀνενέγκαι
  choice: செலுத்துவதற்காக
  rationale: பலியியல் சூழலில் ἀναφέρω என்பதன் ‘பலியாகச் செலுத்துதல்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: πνευματικὰς θυσίας
  choice: ஆவிக்குரிய பலிகளை
  rationale: பலியியல் உருவகத்தையும் πνευματικός என்பதையும், பலிகளின் தன்மை என்னவென்று உரை கூறாத நிலையில் மேலதிகமாக வரையறுக்காமல் பாதுகாக்கிறது.
- source_word: εὐπροσδέκτους θεῷ
  choice: கடவுளுக்கு ஏற்ற
  rationale: பலிகள் கடவுளால் ஏற்றுக்கொள்ளப்படுதல் என்ற கருத்தைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின் வழியாக
  rationale: διά + மரபுவேற்றுமை காட்டும் வழிமுறை அல்லது இடைநிலையைத் தக்கவைக்கிறது; Χριστός இங்கு இயேசுவோடு இணைந்த பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: οἰκοδομεῖσθε என்பதன் வினைக்குரலும் செய்பவரும்
  choice: செயப்பாட்டில் ‘கட்டப்பட்டுவருகிறீர்கள்’; செய்பவர் குறிப்பிடப்படவில்லை
  alternative: ‘உங்களை நீங்களே கட்டியெழுப்புங்கள்’ என்ற தற்சுட்டு அல்லது கட்டளைப் பொருள்
  rationale: வடிவம் நிகழ்காலச் செயப்பாடாகவும் சூழல் விசுவாசிகள் கட்டடமாக அமைக்கப்படுவதைச் சுட்டுவதாகவும் உள்ளது. உரையில் பெயரிடப்படாத செய்பவரை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: εἰς ἱεράτευμα ἅγιον காட்டும் தொடர்பு
  choice: ‘பரிசுத்த ஆசாரியக் கூட்டமாகும்படி’ என்று நோக்கம்/விளைவு திறந்த நிலையில் வழங்குதல்
  alternative: ‘பரிசுத்த ஆசாரியக் கூட்டத்திற்காக’ அல்லது ‘பரிசுத்த ஆசாரியக் கூட்டமாக’
  rationale: εἰς இங்கு நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும். தேர்ந்த வடிவம் இரண்டையும் முற்றிலும் பிரித்துத் தீர்மானிக்காமல் வாசிக்க இடமளிக்கிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சொல் இயேசுவுக்குரிய பட்டமாகச் செயல்படுவதால் அதன் மெசியத் தன்மையை வெளிப்படையாக மொழிபெயர்க்கிறது; இதனால் கிறிஸ்தியல் கருத்தில் வேறு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியத்தக்க, கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘ஆசாரியக் கூட்டம்’ என்பது ἱεράτευμα குறிக்கும் சமூகத் தன்மையை வெளிப்படுத்துகிறது. ‘ஆவிக்குரிய’ என்ற சொல் πνευματικός என்பதிலுள்ள பொருள் விரிவை தேவையின்றிக் குறுக்காமல் வைக்கிறது. கடைசியில் ‘இவ்வாறு கட்டப்பட்டுவருகிறீர்கள்’ என்பது நீண்ட கிரேக்க வாக்கியத்தின் நோக்கத் தொடர்பைத் தமிழில் தெளிவாக்குவதற்கான சிறிய மீளுரையாகும்.
