revisions:
- from: நீங்களும்கூட உயிருள்ள கற்களைப்போல்[a], பரிசுத்த ஆசாரியக் கூட்டமாகும்படி[b] ஆவிக்குரிய வீடாகக் கட்டப்பட்டுவருகிறீர்கள்; இயேசு மெசியாவின்[c] வழியாகக் கடவுளுக்கு ஏற்ற ஆவிக்குரிய பலிகளைச் செலுத்துவதற்காகவே இவ்வாறு கட்டப்பட்டுவருகிறீர்கள்.
  to: நீங்களும்கூட உயிருள்ள கற்களைப்போல்[a], ஆவிக்குரிய வீடாகவும் பரிசுத்த ஆசாரியக் கூட்டமாகவும் கட்டப்பட்டு வருகிறீர்கள்; இயேசு மெசியாவின்[c] வழியாகக் கடவுளுக்கு ஏற்ற ஆவிக்குரிய பலிகளைச் செலுத்துவதற்காக.
  rationale: The revision removes the source-unwarranted repetition and added emphasis, restores the source order, and expresses the two building-result phrases in a natural coordinated Tamil construction. Footnote b is retained as an available alternative even though the main rendering uses the broader result-oriented ‘ஆசாரியக் கூட்டமாகவும்.’
