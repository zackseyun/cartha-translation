reference: 1 Peter 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: ta
  text: ஏனெனில், நீங்கள் நன்மை செய்வதன் மூலம் மதியற்ற மக்களின் அறியாமையை வாயடைக்கச் செய்வதே கடவுளுடைய விருப்பம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மதியற்ற மக்களின் அறியாமைக்கு வாய்க்கட்டு போடுவதே.’ இங்குள்ள வினைச்சொல்லின் நேரடிப் பொருள் ‘வாய்க்கட்டு போடுதல்’; எதிரான பேச்சை நிறுத்துவதைக் குறிக்க இங்கு உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὕτως
  choice: நீங்கள் நன்மை செய்வதன் மூலம்… செய்வதே
  rationale: கடவுளுடைய விருப்பம் நிறைவேறும் விதத்தைச் சுட்டுகிறது; தமிழில் வாக்கிய அமைப்புக்குள் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: θέλημα
  choice: விருப்பம்
  rationale: இங்கு கடவுள் விரும்புவதையும் நோக்குவதையும் நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἀγαθοποιοῦντας
  choice: நீங்கள் நன்மை செய்வதன் மூலம்
  rationale: பங்கேற்புவினையின் கருவிப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: φιμοῦν
  choice: வாயடைக்கச் செய்வது
  rationale: அடிப்படையில் ‘வாய்க்கட்டு போடுதல்’ எனும் உருவகத்தைத் தக்கவைத்தபடி, எதிரான பேச்சை நிறுத்துதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀγνωσίαν
  choice: அறியாமை
  rationale: மூலச் சொல்லின் நேரடியான பொருளையும் குற்றத்துக்குரிய அறிவின்மையின் நிழற்பொருளையும் தக்கவைக்கிறது.
- source_word: ἀφρόνων ἀνθρώπων
  choice: அறிவற்ற மனிதர்களின்
  rationale: ἄφρων என்பதன் அறிவில்லாத/மதியற்ற தன்மையையும் ἄνθρωποι என்பதன் பொதுவான மனிதக் குறிப்பையும் பாலின வரம்பின்றி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀνθρώπων என்பதன் பாலினப் பொதுமை
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: கிரேக்க இலக்கண வடிவம் ஆண்பாலாக இருந்தாலும், இங்கு எதிர்ப்பவர்கள் ஆண்கள் மட்டுமே என்ற குறிப்பு இல்லை; மனிதர்களை பொதுவாகக் குறிக்கிறது.
- issue: φιμοῦν என்பதன் உருவக வலிமை
  choice: வாயடைக்கச் செய்வது
  alternative: மௌனமாக்குவது
  rationale: பகைமையான பேச்சை நிறுத்துதல் என்ற சூழற்பொருளோடு, ‘வாய்க்கட்டு போடுதல்’ என்ற மூல உருவகத்தையும் ஓரளவு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. ‘வாயடைக்கச் செய்வது’ என்ற சொற்றொடர் மூல உருவகத்தின் வலிமையைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் நேரடிப் பொருளை விளக்குகிறது.
