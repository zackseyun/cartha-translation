id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: ta
  text: சுதந்திரமானவர்களாக, தீமையை மறைக்கும் போர்வையாகச் சுதந்திரத்தைப் பயன்படுத்துகிறவர்களாக அல்லாமல், கடவுளின் அடிமைகளாக[a] இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் சேவகர்களாக.’ கிரேக்கச் சொல் இரு வகையிலும் மொழிபெயர்க்கப்படலாம்; ஆனால் ‘சுதந்திரமானவர்கள்’ என்பதுடனான வலுவான முரண்பாட்டைத் தக்கவைக்க இங்கே ‘அடிமைகள்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: சுதந்திரமானவர்கள்
  rationale: கேட்போர் அனைவரையும் கூட்டாகக் குறிக்கும் இந்தப் பெயரடை, சமூக மற்றும் தனிநிலைச் சுதந்திரத்தின் கருத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπικάλυμμα
  choice: மறைக்கும் போர்வை
  rationale: இச்சொல்லின் நேரடியான ‘மூடுதல்/மூடுபொருள்’ என்ற உருவகத்தையும், தீமையை மறைக்கப் பயன்படுத்துதல் என்ற சூழல்சார் பொருளையும் இது தக்கவைக்கிறது.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: அந்தச் சுதந்திரத்தை ... பயன்படுத்தாமல்
  rationale: சொல்லுக்குச் சொல் ‘சுதந்திரத்தை ஒரு போர்வையாகக் கொண்டிராமல்’ என்பதற்குப் பதிலாக, கருவியாகப் பயன்படுத்தும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κακίας
  choice: தீமை
  rationale: κακία இங்கு ஒரு குறிப்பிட்ட பகைமையை மட்டும் அல்லாமல் ஒழுக்கரீதியான தீமையைப் பொதுவாகக் குறிக்கிறது.
- source_word: θεοῦ δοῦλοι
  choice: கடவுளின் அடிமைகள்
  rationale: δοῦλοι என்பதன் வலுவான உடைமைக்கும் கட்டுப்பாட்டிற்குமான பொருளையும், ‘சுதந்திரமானவர்கள்’ என்பதுடனான திட்டமிட்ட முரண்பாட்டையும் ‘அடிமைகள்’ தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: கிறிஸ்தவ அடையாளத்தைச் சுட்டும் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் அடிமைகள்
  alternative: கடவுளின் பணியாளர்கள்
  rationale: இவ்வசனம் சுதந்திரத்தையும் கடவுளுக்குச் சொந்தமான முழுமையான கட்டுப்பாட்டையும் வேண்டுமென்றே அருகருகே வைக்கிறது. ‘பணியாளர்கள்’ என்பது அந்த இறையியல் பதற்றத்தை மென்மையாக்கும்; ‘அடிமைகள்’ மூலத்தின் வலிமையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள ὡς தொடர்களின் வாழ்வியல் வலியுறுத்தலை இயல்பாக்க ‘வாழுங்கள்’ சேர்க்கப்பட்டுள்ளது; ‘போர்வை’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது.
