revisions:
- from: சுதந்திரமானவர்களாக வாழுங்கள்; ஆனால் அந்தச் சுதந்திரத்தைத் தீமையை மறைக்கும் போர்வையாகப் பயன்படுத்தாமல், கடவுளின் அடிமைகளாக[a] வாழுங்கள்.
  to: சுதந்திரமானவர்களாக, தீமையை மறைக்கும் போர்வையாகச் சுதந்திரத்தைப் பயன்படுத்துகிறவர்களாக அல்லாமல், கடவுளின் அடிமைகளாக[a] இருங்கள்.
  rationale: The revision preserves the Greek’s parallel ‘as ... not as ... but as ...’ structure while maintaining idiomatic modern Tamil through a single closing ‘இருங்கள்.’ It also retains the concrete covering metaphor and strengthens the naturalness of the footnote’s alternative term without weakening the main rendering.
  reviewer_model: gpt-5.6-terra
