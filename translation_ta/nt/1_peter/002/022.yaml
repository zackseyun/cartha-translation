  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: ta
  text: அவர் பாவம் செய்யவில்லை[b]; அவருடைய வாயில் வஞ்சகம்[a] காணப்படவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கபடம்’; கிரேக்கச் சொல் ஏமாற்றுதல், மோசடி அல்லது துரோகம் ஆகிய கருத்துகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்தச் சொற்கள் ஏசாயா 53:9-ஐ எதிரொலிக்கின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கிறிஸ்துவையே தொடர்புப்பெயர் சுட்டுகிறது. தனியாக வாசிக்கும்போதும் இயல்பாக இருக்கத் தமிழில் மரியாதை ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது; புதிய வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: பாவம் செய்யவில்லை
  rationale: ποιέω என்பதன் அடிப்படைப் பொருள் ‘செய்’; ἁμαρτίαν உடன் அது ‘பாவம் செய்’ என்ற வழக்கமான பொருளைத் தருகிறது. ஒருமை வடிவம் பாவத்தை ஒரு பொதுவகையாகக் காட்டுவதால் தக்கவைக்கப்பட்டுள்ளது.
- source_word: οὐδὲ
  choice: …வும் இல்லை
  rationale: இரண்டாவது மறுப்புக் கூற்றை முதலாவதுடன் இணைக்கும் கிரேக்கத் தொடர் மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὑρέθη
  choice: காணப்படவும் இல்லை
  rationale: இறந்தகாலச் செயலப்பாட்டு வடிவத்தின் கருத்தையும், செய்பவரை வெளிப்படையாகக் குறிப்பிடாத மூலத்தின் அமைப்பையும் காக்கிறது.
- source_word: δόλος
  choice: வஞ்சகம்
  rationale: ஏமாற்றுதல், கபடம், மோசடி ஆகிய பொருள் பரப்பைத் தாங்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: அவருடைய வாயில்
  rationale: கிரேக்கத்தின் உடல் உறுப்புச் சார்ந்த உருவகத்தையும் ஏசாயா 53:9-ஐ எதிரொலிக்கும் சொற்றொடரையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் பாவமின்மையையும் உண்மைத்தன்மையையும் விவரிக்கும் ஏசாயா 53:9-ன் எதிரொலி
  choice: ‘பாவம் செய்யவில்லை’ என்றும் ‘வாயில் வஞ்சகம் காணப்படவும் இல்லை’ என்றும் மூலத்திற்கு நெருக்கமாக மொழிபெயர்த்தல்
  alternative: ‘அவர் ஒருபோதும் பாவம் செய்யவில்லை; ஒருபோதும் பொய் பேசவில்லை’ போன்ற விளக்கமான மொழிபெயர்ப்பு
  rationale: மூலத்தின் இரு கூற்றுகளையும் பழைய ஏற்பாட்டு எதிரொலியையும் காக்கிறது; ‘வஞ்சகம்’ என்பதை வெறும் பொய்பேச்சாகக் குறுக்கவோ, ‘ஒருபோதும்’ போன்ற வெளிப்படையாக இல்லாத வலியுறுத்தலைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பழமையான ‘வஞ்சனை’ போன்ற வடிவத்தை விட ‘வஞ்சகம்’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தின் செயலப்பாட்டு அமைப்பும் ‘வாயில்’ என்ற உருவகமும் இயன்றவரை காக்கப்பட்டுள்ளன.
