reference: 1 Peter 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: ta
  text: இதற்காக நீங்கள் அழைக்கப்பட்டீர்கள். ஏனெனில் மேசியாவும் உங்களுக்காகத் துன்பப்பட்டு, நீங்கள் தமது அடிச்சுவடுகளைப் பின்பற்றும்படி உங்களுக்கு ஒரு முன்மாதிரியை[a] விட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாதிரி’ என்றும் மொழிபெயர்க்கலாம். இக்கிரேக்கச் சொல், மாணவர்கள் அதைப் பார்த்து எழுதுவதற்காக அவர்கள்முன் வைக்கப்படும் எழுத்து மாதிரியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: இதற்காகவே
  rationale: முந்தைய சூழலில் கூறப்பட்ட அநியாயமான துன்பத்தைப் பொறுமையுடன் சகிப்பதைக் குறிப்பதோடு, εἰς என்பதன் நோக்கத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκλήθητε
  choice: நீங்கள் அழைக்கப்பட்டீர்கள்
  rationale: இறைவனிடமிருந்து வரும் அழைப்பு என்ற இறையியல் ஒலிப்பைத் தக்கவைக்கிறது; அழைப்பின் செயல்திறனைப் பற்றிய குறிப்பிட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன் கூறிய அழைப்புக்கான காரணத்தையோ விளக்கத்தையோ தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயராக இருப்பதை வெளிப்படுத்துகிறது; தனிப்பெயராக மட்டும் ஒலிக்கச் செய்வதைத் தவிர்க்கிறது.
- source_word: ἔπαθεν
  choice: பாடுபட்டு
  rationale: பாடுகளையும் துன்ப அனுபவத்தையும் இயல்பான தமிழில் குறிக்கிறது; இந்த வசனம் சொல்லாத மரணம் போன்ற விவரங்களைச் சேர்ப்பதில்லை.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: வாசகர்களின் நன்மைக்காகவும் அவர்கள் சார்பாகவும் என்ற பொருள் அகலத்தைப் பாதுகாக்கிறது; பதிலீடு குறித்த ஒரு குறுகிய விளக்கத்தைத் திணிப்பதில்லை.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: உங்களுக்கு ... விட்டுச் சென்றார்
  rationale: பங்கேற்புவினையின் உறவைத் தெளிவான தமிழ் வாக்கியமாக மாற்றி, முன்மாதிரி அவர்களுக்காக விடப்பட்டது என்பதைத் தக்கவைக்கிறது.
- source_word: ὑπογραμμὸν
  choice: ஒரு முன்மாதிரியை
  rationale: பின்பற்றுவதற்காக முன்வைக்கப்பட்ட மாதிரி என்ற மையப் பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது; மாணவர்கள் பார்த்து எழுதும் எழுத்து மாதிரி என்ற உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἵνα
  choice: '...படி'
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα என்பதன் விசையை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἐπακολουθήσητε
  choice: பின்பற்றும்படி
  rationale: ஒருவரின் வழியைத் தொடர்ந்து செல்வது என்ற கருத்தையும் நோக்கவினைத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: தமது அடிச்சுவடுகளை
  rationale: கிரேக்கத்தின் காலடித்தட உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது; ‘தமது’ என்பது வாக்கியத்தின் எழுவாயான மேசியாவையே குறிக்கிறது.
theological_decisions:
- issue: ὑπὲρ ὑμῶν என்பதன் இறையியல் வீச்சு
  choice: உங்களுக்காக
  alternative: உங்கள் சார்பாக; உங்கள் இடத்தில்
  rationale: உங்களுக்காக என்பது நன்மை மற்றும் பிரதிநிதித்துவப் பொருள் இரண்டிற்கும் இடமளிக்கிறது. உடனடியான சூழல் மேசியாவின் பாடுகளைப் பின்பற்றத்தக்க முன்மாதிரியாக வலியுறுத்துவதால், இவ்வசனம் மட்டும் வெளிப்படையாகக் கூறாத குறிப்பிட்ட பதிலீட்டுப் பாவநிவாரணச் சூத்திரத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: Χριστός பட்டப்பெயரா அல்லது பெயர்போன்ற வடிவமா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு துன்பத்தில் முன்மாதிரியாக நிற்கும் அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டப்பெயரின் விசையை வெளிப்படையாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. மூலத்தின் காரண–நோக்கத் தொடர்பும் அடிச்சுவடு உருவகமும் பாதுகாக்கப்பட்டுள்ளன. வாசிப்புத் தெளிவுக்காக முதல் காரணவாக்கியம் தனி வாக்கியமாக அமைக்கப்பட்டது.
