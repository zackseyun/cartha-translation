revisions:
- from: இதற்காகவே நீங்கள் அழைக்கப்பட்டீர்கள். ஏனெனில் மேசியாவும் உங்களுக்காகப் பாடுபட்டு, நீங்கள் தமது அடிச்சுவடுகளைப் பின்பற்றும்படி உங்களுக்கு ஒரு முன்மாதிரியை[a] விட்டுச் சென்றார்.
  to: இதற்காக நீங்கள் அழைக்கப்பட்டீர்கள். ஏனெனில் மேசியாவும் உங்களுக்காகத் துன்பப்பட்டு, நீங்கள் தமது அடிச்சுவடுகளைப் பின்பற்றும்படி உங்களுக்கு ஒரு முன்மாதிரியை[a] விட்டுச் சென்றார்.
