id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் வழிதவறிச் செல்லும் ஆடுகளைப்போல் இருந்தீர்கள்[a]. ஆனால் இப்போது உங்கள் ஆன்மாக்களின் மேய்ப்பரும் கண்காணிப்பாளருமானவரிடம் திரும்பியிருக்கிறீர்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அலைந்து திரியும்’; அல்லது, ‘வழிதவறச் செய்யப்படும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திரும்பினீர்கள்’; கிரேக்க வினைவடிவத்தை passive நுணுக்கத்துடன் ‘திருப்பப்பட்டீர்கள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘காவலர்’; பாரம்பரியமாக, ‘ஆயர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: ஏனெனில், நீங்கள் ... இருந்தீர்கள்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத்தை இணைக்கிறது; ἦτε அவர்களுடைய முந்தைய, தொடர்ந்த நிலையைக் குறிக்கும் இறந்தகால வடிவம்.
- source_word: ὡς πρόβατα
  choice: ஆடுகளைப்போல்
  rationale: ὡς ஒப்புமையைக் குறிக்கிறது; πρόβατα என்பது பன்மை. தமிழில் இந்த மேய்ப்பர் உருவகத்திற்கு ‘ஆடுகள்’ இயல்பான சொல்.
- source_word: πλανώμενοι
  choice: வழிதவறிச் செல்லும்
  rationale: πλανάω இங்கு தாமே வழிதவறிச் செல்வதையோ அலைந்து திரிவதையோ, மறைமுகமாக வழிதவறச் செய்யப்படுவதையோ குறிக்கலாம். ‘வழிதவறிச் செல்லும்’ என்பது செயற்படுத்துபவரைத் தீர்மானிக்காமல் ஆட்டு உருவகத்தைப் பேணுகிறது.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: ஆனால் இப்போது ... திரும்பியிருக்கிறீர்கள்
  rationale: ἀλλά வலுவான முரண்பாட்டைக் காட்டுகிறது. இறந்தகால passive வடிவமான ἐπεστράφητε நடுநிலை/தன்னிலை நுணுக்கத்துடன் ‘திரும்பினீர்கள்’ எனவும் புரியலாம்; ‘திரும்பியிருக்கிறீர்கள்’ நிகழ்ந்த மாற்றத்தின் தற்போதைய விளைவையும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: ἐπὶ τὸν ποιμένα
  choice: மேய்ப்பருமானவரிடம்
  rationale: ποιμήν என்பதன் நேரடிப் பொருள் ‘மேய்ப்பர்.’ இங்கு அது கிறிஸ்துவைக் குறிக்கும் தனிப்பட்ட பட்டமாகச் செயல்படுகிறது.
- source_word: καὶ ἐπίσκοπον
  choice: கண்காணிப்பாளருமானவரிடம்
  rationale: ἐπίσκοπος கவனித்துப் பராமரிப்பவரைக் குறிக்கிறது. ‘கண்காணிப்பாளர்’ மூலச்சொல்லின் பொருளைத் தெளிவாகத் தருகிறது; பிற்காலத் திருச்சபைப் பதவியை முன்வைக்கும் ‘ஆயர்’ போன்ற சொல்லைத் தவிர்க்கிறது.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: உங்கள் ஆன்மாக்களின்
  rationale: ψυχή என்பது சூழலின்படி ஆன்மா, உயிர், வாழ்க்கை அல்லது நபர் என்று பொருள்படலாம். இங்கு ‘ஆன்மாக்கள்’ ஆன்மீகப் பராமரிப்பு சார்ந்த பொருளையும் மூலத்தின் சொற்படிவத்தையும் பேணுகிறது; இது முழு மனிதருக்கான பராமரிப்பை மறுப்பதல்ல.
theological_decisions:
- issue: ἐπίσκοπος என்பதைக் கிறிஸ்துவுக்குரிய பட்டமாக மொழிபெயர்த்தல்
  choice: கண்காணிப்பாளர்
  alternative: காவலர்; ஆயர்
  rationale: இந்த வசனம் ποιμήν, ἐπίσκοπος ஆகிய இரண்டையும் கிறிஸ்துவுக்குப் பயன்படுத்துகிறது. ‘கண்காணிப்பாளர்’ அதன் அடிப்படைப் பொருளைப் பேணுவதோடு, ‘ஆயர்’ என்பதில் ஏற்படக்கூடிய பிற்காலத் திருச்சபை ஆட்சிமுறை சார்ந்த பொருளைத் திணிக்காது.
- issue: ἐπεστράφητε என்பதன் வினைக்குரல் நுணுக்கம்
  choice: திரும்பியிருக்கிறீர்கள்
  alternative: திருப்பப்பட்டிருக்கிறீர்கள்
  rationale: இலக்கண வடிவம் passive ஆக இருப்பதால் ‘திருப்பப்பட்டீர்கள்’ என்ற நுணுக்கம் சாத்தியம்; எனினும் இவ்வினை நடுநிலை அல்லது செயப்படுபொருள் குன்றிய பொருளில் ‘திரும்புதல்’ என்றும் பயன்படுகிறது. முதன்மை மொழிபெயர்ப்பு தெய்வீகச் செயலுக்கும் மனிதப் பதிலுக்கும் இடையிலான உறவை மிகையாகத் தீர்மானிக்காமல் விடுகிறது.
- issue: ψυχή என்பதன் பரப்பு
  choice: ஆன்மாக்கள்
  alternative: உயிர்கள்; முழு நபர்கள்
  rationale: ‘ஆன்மாக்கள்’ பாரம்பரியமும் நேரடியுமான இணைச்சொல்; ஆனால் ψυχή உடலிலிருந்து பிரிந்த ஓர் அம்சத்தை மட்டும் கட்டாயமாகக் குறிக்காது. மாற்றுப் பொருள் குறிப்பில் அதன் பரந்த பொருள் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘ஆத்துமா’ என்ற பழைய வடிவத்திற்குப் பதிலாக இன்றைய ‘ஆன்மா’ பயன்படுத்தப்பட்டது. மேய்ப்பர் உருவகமும் மூலத்தில் உள்ள வினைக்குரல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
