base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: ta
  text: ஏனெனில், ஒருவர் கடவுளைப் பற்றிய விழிப்புணர்வினால்[a] அநியாயமாகத் துன்பப்பட்டுத் துயரங்களைச் சகித்துக்கொண்டால், அது அருள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளை நினைவில் கொண்டிருப்பதால்,” அல்லது “கடவுளை நோக்கிய மனச்சாட்சியின் காரணமாக.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அருள்” என்பது அருளுக்குரியது, பாராட்டத்தக்கது, அல்லது தயவு பெறத்தக்கது என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γὰρ
  choice: ஏனெனில் ... அது
  rationale: γάρ முந்தைய கருத்தை விளக்கும் தொடர்பைக் குறிக்கிறது; τοῦτο நிபந்தனையில் சொல்லப்படும் செயலையே சுட்டுகிறது. இயல்பான தமிழ் வாக்கிய அமைப்புக்காக சுட்டுப்பெயர் முடிவில் வைக்கப்பட்டுள்ளது.
- source_word: χάρις
  choice: அருள்
  rationale: மூலச்சொல்லின் புதிய ஏற்பாட்டுத் தொடர்பையும், இங்கு காணப்படும் அருளுக்குரிய அல்லது தயவு பெறத்தக்க செயல் என்ற மதிப்பீட்டு நயத்தையும் காக்கிறது; அந்தச் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: διὰ συνείδησιν θεοῦ
  choice: கடவுளைப் பற்றிய மனவுணர்வினால்
  rationale: συνείδησις என்பதில் ‘மனச்சாட்சி’ மற்றும் ‘உணர்வுடன் இருத்தல்’ ஆகிய இரு நயங்களும் இருக்கலாம். θεοῦ என்பதை கடவுளை நோக்கிய அல்லது கடவுளைப் பற்றிய உணர்வு என்று எடுத்துக்கொண்டு, காரணத்தைக் குறிக்கும் διά-வையும் வெளிப்படுத்துகிறது.
- source_word: ὑποφέρει
  choice: சகித்துக்கொண்டால்
  rationale: இன்னலின் கீழ் பொறுமையுடன் நிலைத்திருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: λύπας
  choice: துயரங்களை
  rationale: உணர்ச்சிசார் வருத்தத்தையும் துன்ப அனுபவங்களையும் உள்ளடக்கும் பன்மைச் சொல்லாக உள்ளது.
- source_word: πάσχων ἀδίκως
  choice: அநியாயமாகத் துன்பப்பட்டு
  rationale: பங்கேற்புவினை வடிவமும் ἀδίκως கூறும் அநீதியான சூழலும் சுருக்கமாகக் காக்கப்படுகின்றன.
- source_word: τις
  choice: ஒருவர்
  rationale: பாலினத்தைக் குறிப்பாகச் சேர்க்காமல் கிரேக்க மொழியின் பொதுவான ஒருமைப் பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: χάρις என்பதன் சூழல்சார் பொருள்
  choice: முதன்மை உரையில் ‘அருள்’ என்று வைக்கப்பட்டது.
  alternative: ‘இது பாராட்டத்தக்கது’ அல்லது ‘இது தயவு பெறத்தக்கது’
  rationale: வசனம் நேரடியாகச் சொல்லாத ‘கடவுளிடம் பாராட்டைப் பெறுகிறது’ போன்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், மூலச்சொல்லின் இறையியல் ஒலிப்பையும் மதிப்பீட்டு நயத்தையும் காக்கிறது.
- issue: συνείδησις θεοῦ என்பதன் பொருள்
  choice: ‘கடவுளைப் பற்றிய மனவுணர்வு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளை நினைவில் கொண்டிருப்பதால்’ அல்லது ‘கடவுளுக்கு முன்பான மனச்சாட்சியின் காரணமாக’
  rationale: இத்தொடரில் உள்ள கடவுளை உணர்ந்திருத்தல் மற்றும் மனச்சாட்சி ஆகிய நயங்களில் ஒன்றை மட்டும் தீர்மானித்து மற்றொன்றை நீக்காமல், உண்மையான பொருள் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. காரணத் தொடர் ‘சகித்துக்கொண்டால்’ என்பதோடு தெளிவாக இணைக்கப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் இறையியல் தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
