source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: ta
  text: ஆனால் நீங்கள் தேர்ந்தெடுக்கப்பட்ட மக்கள்[a], அரசருக்குரிய ஆசாரியக்கூட்டம், பரிசுத்தமான நாடு, அவருக்கே உரிய மக்கள்; இருளிலிருந்து அவருடைய வியத்தகு ஒளிக்குள் உங்களை அழைத்தவரின் மேன்மைகளை அறிவிக்கும்படியாக இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேர்ந்தெடுக்கப்பட்ட ஒரு வம்சம்.’ γένος என்ற கிரேக்கச் சொல் வம்சம், இனக்குழு அல்லது மக்கள் என்பதைக் குறிக்கலாம்; இங்கு நவீன இனவியல் பொருள் தவறாகத் தோன்றாதபடி ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: ஆனால் நீங்கள்
  rationale: δὲ முந்தைய வசனத்தில் கூறப்பட்டவர்களுடன் உள்ள முரண்பாட்டைக் குறிக்கிறது; வெளிப்படையாக வந்துள்ள Ὑμεῖς நேரடி அழைப்பையும் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: γένος ἐκλεκτόν
  choice: தேர்ந்தெடுக்கப்பட்ட ஒரு மக்கள்
  rationale: γένος என்பது வம்சம், இனக்குழு, மக்கள் ஆகிய பொருள்களை உடையது. இங்கு நவீன இனவியல் பொருள் தவறாகத் தோன்றாதபடி, கூட்டான உடன்படிக்கை அடையாளத்தைத் தக்கவைக்கும் வகையில் ‘மக்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: βασίλειον ἱεράτευμα
  choice: அரசருக்குரிய ஆசாரியக்கூட்டம்
  rationale: βασίλειον என்பதன் ‘அரசருக்குரிய/அரசாட்சிசார்’ நுணுக்கத்தையும் ἱεράτευμα என்பதன் கூட்டான ஆசாரியர் அமைப்பையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது; ‘ராஜரீக ஆசாரியக்கூட்டம்’ என்பதைக் காட்டிலும் இயல்பான நவீன தமிழாக உள்ளது.
- source_word: ἔθνος ἅγιον
  choice: பரிசுத்தமான ஒரு நாடு
  rationale: ἔθνος என்பதன் கூட்டான மக்கள்-நாடு பொருளையும் ἅγιον என்பதன் கடவுளுக்காகப் பிரித்துவைக்கப்பட்ட தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: λαὸς εἰς περιποίησιν
  choice: கடவுளுக்கே உரிய மக்கள்
  rationale: περιποίησις சிறப்பாகச் சொந்தமாக்கப்பட்ட அல்லது உடைமையாகிய நிலையைச் சுட்டுகிறது. கிரேக்கத்தில் உடையவர் வெளிப்படையாகக் கூறப்படாவிட்டாலும் சூழலில் அவர் கடவுள் என்பது தெளிவு; தமிழில் உறவை இயல்பாகத் தெரிவிக்க ‘கடவுளுக்கே’ எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: ὅπως
  choice: நீங்கள் அறிவிக்கும்படிக்கே
  rationale: ὅπως நோக்கத்தைக் குறிக்கிறது. ‘-ம்படிக்கே’ என்னும் அமைப்பு அந்த நோக்க வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τὰς ἀρετὰς
  choice: மேன்மைகளை
  rationale: ἀρετή இங்கு புகழத்தக்க சிறப்புகள், மேன்மைகள் அல்லது வல்ல செயல்கள் ஆகிய பரப்பைக் கொண்டிருக்கலாம். ‘மேன்மைகள்’ அந்த அகலத்தை ஓரளவு தக்கவைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἐξαγγείλητε
  choice: நீங்கள் அறிவிக்க
  rationale: ἐξαγγέλλω பொதுவாக வெளியே எடுத்துரைத்தல் அல்லது பிரகடனப்படுத்துதல் என்ற வலிமையைக் கொண்டது; ‘அறிவிக்க’ ordinary modern Tamil-இல் தெளிவாகவும் பொதுவான அறிவிப்பின் தன்மையுடனும் உள்ளது.
- source_word: τοῦ ... καλέσαντος
  choice: உங்களை அழைத்தவரின்
  rationale: பெயரெச்சத் தொடர் கடவுளை அவருடைய அழைக்கும் செயலால் அடையாளப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரை இங்கு மீண்டும் சேர்க்காமல் தனிப்பட்ட குறிப்பைப் பாதுகாக்கிறது.
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: இருளிலிருந்து தமது வியத்தகு ஒளிக்குள்
  rationale: ἐκ...εἰς இயக்கத்தை—இருளின் நிலையிலிருந்து ஒளியின் பரப்புக்குள்—தக்கவைக்கிறது. θαυμαστός என்பதற்கு ‘வியத்தகு’ உயர்ந்தும் புரியத்தக்கதுமான தமிழ் இணையாகும்.
theological_decisions:
- issue: இஸ்ரவேலின் உடன்படிக்கைப் பட்டங்களிலிருந்து எடுக்கப்பட்ட கூட்டான அடையாள மொழி
  choice: ‘தேர்ந்தெடுக்கப்பட்ட மக்கள்’, ‘அரசருக்குரிய ஆசாரியக்கூட்டம்’, ‘பரிசுத்தமான நாடு’ என்ற கூட்டுப் பட்டங்களை நேரடியாகத் தக்கவைத்தல்
  alternative: அவற்றை வெறும் உருவக அல்லது தனிநபர் ஆன்மீக பண்புகளாக மென்மைப்படுத்துதல்
  rationale: பேதுரு தன் வாசகர்களுக்கு பழைய ஏற்பாட்டு உடன்படிக்கை அடையாள மொழியை நோக்கத்துடன் பயன்படுத்துகிறார். அதன் இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு பாதுகாக்க வேண்டும்; அதிலிருந்து ஒரு விரிவான சமயக் கோட்பாட்டைத் தனியாக முடிவுசெய்யக்கூடாது.
- issue: λαὸς εἰς περιποίησιν என்பதில் மறைந்துள்ள உடையவர்
  choice: ‘கடவுளுக்கே உரிய மக்கள்’ என்று உடையவரை வெளிப்படுத்துதல்
  alternative: ‘உடைமையாவதற்கான மக்கள்’ என்று தெளிவின்றி விடுதல்
  rationale: உடையவர் கிரேக்கச் சொற்றொடரில் வெளிப்படையாக இல்லாவிட்டாலும் சூழல் கடவுளையே சுட்டுகிறது. தமிழில் சொந்த உறவைத் தெளிவாகவும் இயல்பாகவும் கூறுவது சூழல் ஆதரிக்கும் விளக்கமாகும்; புதிய கோட்பாட்டைச் சேர்ப்பதல்ல.
- issue: τὰς ἀρετὰς என்பது பண்புகளையா புகழ்களையா வல்ல செயல்களையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘மேன்மைகள்’ என அதன் பரந்த குறிப்பைத் தக்கவைத்தல்
  alternative: ‘புகழ்கள்’ அல்லது ‘வல்ல செயல்கள்’ என்று ஒரு பொருளுக்கு மட்டும் வரையறுத்தல்
  rationale: சொல் கடவுளின் புகழத்தக்க குணங்களையும் செயல்களையும் உள்ளடக்கக்கூடும். உண்மையான சொற்பொருள் நெகிழ்வைத் தீர்த்துவிடாமல் மாற்று வாசிப்புகளை அடிக்குறிப்பில் தருவது பொருத்தமானது.
