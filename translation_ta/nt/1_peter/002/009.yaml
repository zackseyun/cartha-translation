  register: நடை நவீனத் தரத் தமிழில், கண்ணியமும் பொதுவாசகர்களுக்கான தெளிவும் உடையதாக வைக்கப்பட்டுள்ளது. ‘ஆசாரியக்கூட்டம்’, ‘பரிசுத்தம்’ போன்ற வேதாகமப் பயன்பாட்டில் நிலைபெற்ற சொற்கள் intertextual resonance-ஐப் பாதுகாக்கப் பயன்படுத்தப்பட்டுள்ளன. வசனத்தின் பட்டியல் அமைப்பும் நோக்கத் தொடர்பும் தக்கவைக்கப்பட்டுள்ளன.
