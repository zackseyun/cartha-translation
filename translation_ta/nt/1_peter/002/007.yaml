id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: ta
  text: ஆகவே, நம்புகிற உங்களுக்கே அந்த மரியாதை உரியது[a]. ஆனால் நம்பாதவர்களுக்கோ[b], “கட்டுகிறவர்கள் நிராகரித்த கல்—அதுவே மூலைக்குத் தலையான கல்லாயிற்று[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்புகிற உங்களுக்கு அந்தக் கல் விலைமதிப்புள்ளது.’
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கீழ்ப்படியாதவர்களுக்கோ’; இச்சொல் நம்ப மறுப்பதையும், அதனால் கீழ்ப்படியாமல் நடப்பதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: பாரம்பரியமாக, ‘மூலைக்கல்’ அல்லது ‘பிரதான மூலைக்கல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: மரியாதை
  rationale: இந்தச் சொல் மரியாதை, மதிப்பு, விலைமதிப்பு ஆகிய பொருள்களைக் கொண்டிருக்கலாம். ὑμῖν ... ἡ τιμή என்ற சுருக்கமான கூற்றையும், நம்புகிறவர்களுக்கும் நம்பாதவர்களுக்கும் இடையிலான வேறுபாட்டையும் இயல்பான தமிழில் காக்க ‘மரியாதை’ தேர்ந்தெடுக்கப்பட்டது; கல்லின் விலைமதிப்பைக் குறிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῖς πιστεύουσιν
  choice: நம்புகிற உங்களுக்கு
  rationale: இது வாசகர்களை நேரடியாக விளிக்கும் ὑμῖν என்பதையும், நிகழ்காலப் பங்கேற்புவினையின் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: ἀπιστοῦσιν
  choice: நம்பாதவர்களுக்கோ
  rationale: πιστεύουσιν என்பதற்கு நேரான எதிர்மறையாக இங்கு முதன்மையாக ‘நம்பாதவர்கள்’ என்ற பொருள் வருகிறது. நம்ப மறுத்து கீழ்ப்படியாதிருத்தல் என்ற சாயலும் இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: λίθος
  choice: கல்
  rationale: கட்டுமான உருவகத்துக்கும் மேற்கோளுக்கும் ஏற்ற நேரடியான, வழக்கமான தமிழ் சொல்.
- source_word: ἀπεδοκίμασαν
  choice: நிராகரித்த
  rationale: பரிசீலித்த பின்பு தகுதியற்றதாகக் கருதி ஒதுக்குதல் என்ற வினையின் பொருளை, மேற்கோளின் சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: οἱ οἰκοδομοῦντες
  choice: கட்டுகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினையைத் தெளிவாகக் காட்டி, கட்டுமான உருவகத்தையும் தக்கவைக்கிறது.
- source_word: κεφαλὴν γωνίας
  choice: மூலையின் தலைக்கல்
  rationale: ‘மூலையின் தலை’ என்ற கிரேக்க உருவகத்திற்கு நெருக்கமாக இருந்து, தமிழில் இது ஒரு கல்லைக் குறிக்கிறது என்பதையும் தெளிவாக்குகிறது. ‘மூலைக்கல்’ என்ற பாரம்பரிய விளக்க மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἡ τιμή என்பது நம்புகிறவர்களுக்கு உரிய மரியாதையைக் குறிக்கிறதா, அல்லது கிறிஸ்துவாகிய கல்லின் விலைமதிப்பைக் குறிக்கிறதா?
  choice: மரியாதை நம்புகிற உங்களுக்கு உரியது
  alternative: நம்புகிற உங்களுக்கு அந்தக் கல் விலைமதிப்புள்ளது
  rationale: ὑμῖν οὖν ἡ τιμή என்ற சொற்றொடர் நேரடியாக நம்புகிறவர்களுக்கு மரியாதை உரியது என்று வாசிக்க இடமளிக்கிறது; வெட்கப்படாதிருத்தல் என்ற முந்தைய ஏசாயா பின்னணிக்கும் இது பொருந்துகிறது. முந்தைய வசனத்தின் ‘விலைமதிப்புள்ள’ கல்லோடு இணைக்கும் சாத்தியமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: κεφαλὴ γωνίας என்ற கிறிஸ்துவியல் கட்டுமான உருவகத்தின் மொழிபெயர்ப்பு
  choice: மூலையின் தலைக்கல்
  alternative: மூலைக்கல்; பிரதான மூலைக்கல்
  rationale: கிரேக்கத்தின் உருவக வடிவத்தை முதன்மை உரையில் காத்து, அதை ஒரே கட்டடக்கலை விளக்கமாகச் சுருக்காமல் விடுகிறது. வாசகர்களுக்குப் பழக்கமான விளக்க மொழிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மேற்கோளின் கட்டுமான உருவகமும், ‘மரியாதை/விலைமதிப்பு’ மற்றும் ‘நம்பாமை/கீழ்ப்படியாமை’ ஆகிய உண்மையான பொருள் இருமைகளும் அடிக்குறிப்புகள் மூலம் காக்கப்படுகின்றன.
