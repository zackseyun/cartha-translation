  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: ta
  text: உங்கள் பராமரிப்புக்கு ஒதுக்கப்பட்டவர்கள்மேல் மேலாதிக்கம் செலுத்தாமல், மாறாக மந்தைக்கு முன்மாதிரிகளாய் விளங்குங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு ஒதுக்கப்பட்ட பங்குகள்மேல் மேலாதிக்கம் செலுத்தாமல்.” கிரேக்கத்தில் சொல்லளவில் “பங்குகள்/ஒதுக்கப்பட்ட பகுதிகள்” என்று உள்ளது; இது ஒவ்வொரு மூப்பரின் பராமரிப்புக்கும் ஒதுக்கப்பட்ட தேவனுடைய மந்தையின் பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: ஆளாமல்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் எதிர்மறை இணைப்பையும், மேய்ப்புப் பணியில் தவிர்க்க வேண்டிய நடத்தையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατακυριεύοντες
  choice: அதிகாரம் செலுத்தி அடக்கி ஆளாமல்
  rationale: சட்டபூர்வமான தலைமைத்துவத்தை அல்ல, அதிகாரத்தைத் தவறாகப் பயன்படுத்தி மேலாதிக்கம் செய்வதைக் குறிக்கிறது. ‘அடக்கி ஆளுதல்’ அதன் கடுமையான பொருளைத் தெளிவாக்குகிறது.
- source_word: τῶν κλήρων
  choice: உங்கள் பராமரிப்புக்கு ஒதுக்கப்பட்டவர்கள்
  rationale: சொல்லளவில் ‘பங்குகள்/ஒதுக்கப்பட்ட பகுதிகள்’; சூழலில் மூப்பர்களின் பராமரிப்புக்கு ஒதுக்கப்பட்ட தேவனுடைய மந்தையின் மக்களைக் குறிக்கிறது. உரிமையுடைமை அல்ல, பொறுப்புடன் கவனிக்கும் பணியை உணர்த்துகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: தடைசெய்யப்பட்ட நடத்தைக்கும் வேண்டப்படும் நடத்தைக்கும் இடையிலான வலுவான மாறுபாட்டை வெளிப்படுத்துகிறது; தமிழ்ச் சொற்றொடரில் கருத்தாக வெளிப்படுவதால் வசனத்தில் தனிச் சொல்லாகச் சேர்க்கப்படவில்லை.
- source_word: τύποι
  choice: முன்மாதிரிகள்
  rationale: பின்பற்றத்தக்க எடுத்துக்காட்டுகள் அல்லது மாதிரிகள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: γινόμενοι
  choice: ஆகுங்கள்
  rationale: நிலையான ‘இருத்தல்’ என்பதைக் காட்டிலும், நடத்தையில் முன்மாதிரிகளாக உருவாகி விளங்க வேண்டும் என்ற வினை வலிமையைப் பாதுகாக்கிறது.
- source_word: τοῦ ποιμνίου
  choice: மந்தைக்கு
  rationale: விசுவாசிகளின் சமூகத்தைக் குறிக்கும் வழக்கமான மேய்ப்பர் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சபைத் தலைமைத்துவத்துடன் தொடர்புடைய κλήρων என்பதன் பொருள்
  choice: மூப்பர்களின் பராமரிப்புக்கு ஒதுக்கப்பட்ட விசுவாசிகளைக் குறிக்கிறது; அவர்கள் மூப்பர்களுக்குச் சொந்தமானவர்கள் அல்ல
  alternative: ‘ஒதுக்கப்பட்ட பங்குகள்’ என்று விளக்கமின்றி சொல்லளவில் மொழிபெயர்த்தல்; அல்லது மூப்பர்களின் ஆட்சிப் பகுதிகள் என்று புரிந்துகொள்ளுதல்
  rationale: உடனடிச் சூழல் தேவனுடைய மந்தையை மேய்க்கும் மூப்பர்களைப் பற்றியது. இந்த மொழிபெயர்ப்பு உரிமையைக் காட்டாமல், ஒப்படைக்கப்பட்ட பராமரிப்புப் பொறுப்பை வெளிப்படுத்துகிறது; சொல்லளவிலான உருவகத்தையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: κατακυριεύοντες என்பதன் வலிமை
  choice: அதிகாரத்தை ஒடுக்குமுறையாக அல்லது மேலாதிக்கமாகப் பயன்படுத்துவதைத் தடைசெய்கிறது
  alternative: மூப்பர்கள் எந்த வகையிலும் தலைமை வகிப்பதைத் தடைசெய்கிறது
  rationale: இந்த வினை தலைமைத்துவத்தையே மறுப்பதில்லை; அதிகாரத்தை ஆதிக்க மனப்பான்மையுடன் தவறாகப் பயன்படுத்துவதைக் குறிக்கிறது. வசனம் அத்தகைய நடத்தையை முன்மாதிரியான தலைமைத்துவத்துடன் எதிரெதிராக நிறுத்துகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மந்தை’ என்ற வேதாகம மேய்ப்பர் உருவகம் பாதுகாக்கப்பட்டுள்ளது. ‘அதிகாரம் செலுத்தி அடக்கி ஆளுதல்’ என்பது சாதாரண தலைமைத்துவத்தையும் ஒடுக்குமுறை மேலாதிக்கத்தையும் வேறுபடுத்துகிறது.
