  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: ta
  text: உங்கள் எல்லாக் கவலைகளையும் அவர்மேல்[b] போடுங்கள்[c]; ஏனெனில், அவர் உங்களைப் பற்றி அக்கறை கொண்டிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அதாவது, உடனடி சூழலின்படி கடவுள்மேல் (வசனம் 6).
    reason: cross_reference
  - marker: c
    text: சொல்லர்த்தமாக, ‘அவர்மேல் போட்டு’ அல்லது ‘அவர்மேல் போட்டவர்களாய்.’ இந்த வினையெச்சம் வசனம் 6-இன் அறிவுறுத்தலுடன் இணைந்துள்ளது; தமிழில் வசனத்தை இயல்பாகத் தர ஏவல் வடிவில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν
  choice: அனைத்தையும்
  rationale: μέριμναν என்பதன் முழுமையான அளவைக் குறிக்கிறது; தமிழில் ‘அனைத்தையும்’ இயல்பாகவும் வலியுறுத்தலுடனும் உள்ளது.
- source_word: μέριμναν
  choice: கவலை
  rationale: இச்சூழலில் நடுநிலையான பொறுப்பையோ பராமரிப்பையோ அல்ல, மனத்தைச் சுமக்கும் பதற்றமான அக்கறையைக் குறிக்கிறது. ‘கவலை’ பொதுவாகப் புரியும் இயல்பான தமிழ் சொல்.
- source_word: ἐπιρίψαντες
  choice: போட்டுவிடுங்கள்
  rationale: ஒரு சுமையை மற்றொருவர்மேல் மாற்றிவைக்கும் உருவகத்தைத் தெளிவாகக் காக்கிறது. கிரேக்கத்தில் இது இறந்தகால வினையெச்சம்; தமிழில் தனி வசனமாக இயல்பாக வாசிக்க, முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடரும் ஏவல் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπ’ αὐτόν
  choice: அவர்மேல்
  rationale: ἐπί உடன் வரும் இயக்கத்தையும் சுமையை அவர்மீது வைக்கும் உருவகத்தையும் காக்கிறது; சுட்டுப்பெயரின் குறிப்பைச் சூழலிலிருந்தே அறிய விடுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கவலையை அவர்மேல் போடுவதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: μέλει περὶ ὑμῶν
  choice: அவர் உங்கள்மேல் அக்கறை கொண்டிருக்கிறார்
  rationale: ஒருவரைக் குறித்து உண்மையான, செயலுள்ள கரிசனை இருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் தகவல் அறிதல் அல்லது பொருளாதாரப் பராமரிப்பு என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: αὐτόν / αὐτῷ என்பவற்றின் குறிப்பு
  choice: ‘அவர்’ என்பது உடனடி சூழலில் கடவுளைக் குறிக்கிறது
  alternative: பொதுவாக ஆண்டவரைக் குறிக்கும் சுட்டுப்பெயர்
  rationale: 5:6-இல் வரும் ‘கடவுளுடைய வல்லமையான கையின் கீழ்’ என்பதே மிக அருகிலுள்ள தெளிவான குறிப்பு. எனினும், மூலத்தின் சுட்டுப்பெயர் வடிவத்தைப் பாதுகாக்க முதன்மை உரையில் ‘கடவுள்’ என்று வெளிப்படையாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘போட்டுவிடுங்கள்’ என்பது சுமையை மாற்றிவைக்கும் மூல உருவகத்தை இயல்பாகக் காக்கிறது; ‘அக்கறை கொண்டிருக்கிறார்’ என்பது மேய்ப்பருணர்வைத் தெரிவிக்கிறது. வசனம் தனியே வாசிக்கப்படும்போது முழுமையான வாக்கியமாக இருக்க, கிரேக்க வினையெச்சம் தமிழில் ஏவல் வடிவில் தரப்பட்டு அதன் இலக்கணத் தொடர்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
