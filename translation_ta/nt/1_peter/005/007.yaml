  rationale: சிறு மொழிநடைத் திருத்தங்கள் மட்டுமே செய்யப்படுகின்றன. ‘எல்லாக் கவலைகளையும்’ தமிழின் இயல்பான எண்ணமைப்பை வழங்குகிறது. ‘உங்களைப் பற்றி அக்கறை’ என்பது μέλει περὶ ὑμῶν என்பதன் உறவுசார் கரிசனையைத் தெளிவாகக் காக்கிறது. ‘போடுங்கள்’ ἐπιρίπτω-வின் சுமையை ஒருவர்மேல் இடும் உருவகத்தை, தேவையற்ற நிறைவுப் பொருள் சேர்க்காமல் தருகிறது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களின் இடத்திலேயே வைக்கப்பட்டுள்ளன; a குறியீட்டின் தொடர்புடைய சொல் திருத்தப்பட்ட உரையில் இல்லாததால், அந்த அடிக்குறிப்பு நீக்கப்பட்டுள்ளது.
