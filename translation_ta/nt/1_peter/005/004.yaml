base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: ta
  text: தலைமை மேய்ப்பர் வெளிப்படும்போது[a], வாடாத மகிமையின் கிரீடத்தை[b] நீங்கள் பெற்றுக்கொள்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோன்றும்போது.”
    reason: alternative_reading
  - marker: b
    text: “கிரீடம்” என்பதற்கான கிரேக்கச் சொல் அரசரின் கிரீடத்தை மட்டும் குறிப்பதல்ல; வெற்றி அல்லது கௌரவத்திற்கான பரிசாக வழங்கப்படும் மாலையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: வெளிப்படும்போது
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்துடன் அமைந்த தனிநிலை ஆறாம் வேற்றுமைத் தொடரை இயல்பான காலத் தொடராக மொழிபெயர்க்கிறது. ‘வெளிப்படும்போது’ என்பது வெளிப்படுத்தப்படுதல்/தோன்றுதல் என்ற வெளிப்பாட்டு நுணுக்கத்தைத் தக்கவைத்துக்கொண்டே நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἀρχιποίμενος
  choice: தலைமை மேய்ப்பர்
  rationale: மந்தையை மேய்ப்பவர்களில் முதன்மையானவரைக் குறிக்கும் கூட்டுச்சொல். ‘தலைமை மேய்ப்பர்’ என்பது பட்டப்பெயரின் வலிமையைத் தக்கவைத்து, பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: κομιεῖσθε
  choice: பெற்றுக்கொள்வீர்கள்
  rationale: எதிர்கால இடைநிலை வினை இங்கு பரிசாக வழங்கப்படுவதைப் பெறுதல் என்ற பொருளில் வருகிறது. ‘பெற்றுக்கொள்வீர்கள்’ என்பது செயலில் ஏற்றுக்கொள்ளும் நுணுக்கத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἀμαράντινον
  choice: வாடாத
  rationale: புத்துணர்ச்சி அல்லது அழகு குன்றாமல் இருப்பதைக் குறிக்கும் சொல்லின் உருவகத்தை நேரடியாகவும் எளிமையாகவும் வெளிப்படுத்துகிறது; ‘அழியாத’ என்று வலுப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: τῆς δόξης
  choice: மகிமையின்
  rationale: ஆறாம் வேற்றுமை உறவை வெளிப்படையாகத் தக்கவைத்து, ‘மகிமையின் கிரீடம்’ என்ற செறிவான உருவகத்தை பெயரடையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: στέφανον
  choice: கிரீடம்
  rationale: தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் புரியக்கூடிய சொல். கிரேக்கச் சொல் அரசரின் முடியை மட்டும் அல்லாமல் வெற்றி அல்லது கௌரவப் பரிசாக அளிக்கப்படும் மாலையையும் குறிக்கக்கூடும் என்பதால் அந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘தலைமை மேய்ப்பர்’ என்பவரின் அடையாளம்
  choice: சூழலில் இயேசுவைக் குறிக்கும் கிறிஸ்துவியல் பட்டப்பெயராக மொழிபெயர்த்தல்
  alternative: பெயரைக் கொண்டு விரிவாக ‘இயேசு கிறிஸ்து’ என்று சேர்த்தல்
  rationale: முந்தைய வசனங்களின் மேய்ப்பர் உருவகமும் எதிர்கால வெளிப்பாடும் இயேசுவைக் குறிக்கின்றன; ஆனால் மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் பட்டப்பெயரையே தக்கவைப்பது உரைக்கு உண்மையாக உள்ளது.
- issue: இறுதிக்கால வெளிப்பாட்டைக் குறிக்கும் மொழி
  choice: வெளிப்படும்போது
  alternative: தோன்றும்போது
  rationale: இந்தத் தேர்வு manifestation என்ற கருத்தையும் கிரேக்கத்தின் செயப்பாட்டு வடிவ நுணுக்கத்தையும் காக்கிறது; நிகழ்வை அளவுக்கு மீறி விளக்காமல் அதன் இறுதிக்காலத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வாடாத’ என்ற உயிருள்ள உருவகமும் ‘மகிமையின்’ என்ற மூல ஆறாம் வேற்றுமை உறவும் தக்கவைக்கப்பட்டுள்ளன.
