  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: ta
  text: தெளிந்த மனதுடன் இருங்கள்[a]; விழிப்புடன் இருங்கள். உங்கள் எதிரியாகிய பிசாசு கர்ஜிக்கும் சிங்கம்போல் சுற்றித் திரிகிறான்; யாரையாவது விழுங்கிவிடத் தேடுகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிதானமான மனதுடன் இருங்கள்.” νήψατε என்ற கிரேக்க வினை அடிப்படையில் மதுபோதையின்றி இருப்பதைக் குறித்தாலும், புதிய ஏற்பாட்டில் அதன் பயன்பாடுகள் உருவகமானவை. இங்கு மதுவிலக்கை அல்ல, மனத்தெளிவையும் தன்னடக்கத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: தெளிந்த மனதுடன் இருங்கள்
  rationale: இங்கு வினைச்சொல் மதுவிலக்கை நேரடியாகக் குறிக்காமல், ஆவிக்குரிய தாக்குதலின் மத்தியில் மனத்தெளிவும் தன்னடக்கமும் கொண்டிருப்பதைக் குறிக்கிறது. அடுத்து வரும் γρηγορήσατε என்பதிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: γρηγορήσατε
  choice: விழிப்புடன் இருங்கள்
  rationale: விழித்திருந்து எச்சரிக்கையாக இருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ἀντίδικος
  choice: எதிரி
  rationale: சட்டவழக்கில் எதிர்த்தரப்பினரையும் குறிக்கக்கூடிய சொல் என்றாலும், இங்கு வாசகர்களுக்கு விரோதமானவனைப் பொதுவாகக் குறிக்கிறது.
- source_word: διάβολος
  choice: பிசாசு
  rationale: இங்கு இது பொதுவான ‘அவதூறு செய்பவன்’ என்பதல்ல; சாத்தானுக்கான அறியப்பட்ட தனிப்பட்ட அடைமொழியாகப் பயன்படுகிறது.
- source_word: ὡς λέων ὠρυόμενος
  choice: கர்ஜிக்கிற சிங்கத்தைப் போல
  rationale: வெளிப்படையான ஒப்புமையையும் அச்சுறுத்தும் வேட்டையாடும் உருவகத்தையும் இயல்பாகக் காக்கிறது.
- source_word: περιπατεῖ
  choice: சுற்றித் திரிந்து
  rationale: அடிப்படைப் பொருளான ‘சுற்றி நட’ அல்லது ‘அங்குமிங்கும் செல்’ என்பதை இயல்பான தமிழில் தருகிறது; ‘பதுங்கித் திரிகிறான்’ என்ற விளக்கமான பொருளை நேரடியாகச் சேர்க்கவில்லை.
- source_word: ζητῶν
  choice: தேடுகிறான்
  rationale: இலக்கைத் தீவிரமாகத் தேடும் தொடர்ச்சியான செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τινα
  choice: யாரையாவது
  rationale: ஒருமை, குறிப்பில்லாத இலக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: καταπιεῖν
  choice: விழுங்கிவிட
  rationale: சொல்லின் ‘முழுவதுமாக விழுங்கு’ என்ற பொருளையும் சிங்க உருவகத்தின் வன்மையான வேட்டைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: διάβολος என்பதைப் பொதுப்பெயராகவா அல்லது சாத்தானைக் குறிக்கும் தனிப்பட்ட அடைமொழியாகவா மொழிபெயர்ப்பது
  choice: பிசாசு
  alternative: அவதூறு செய்பவன்
  rationale: சூழலில் விசுவாசிகளுக்கு எதிராகச் செயல்படும் தனிப்பட்ட தீயவனே குறிக்கப்படுகிறான்; ‘பிசாசு’ என்பது உரையை மீறிய கோட்பாட்டைச் சேர்க்காமல் இதைத் தெளிவாக்குகிறது.
- issue: περιπατεῖ என்ற சொல்லில் சிங்க உருவகத்தின் வேட்டையாடும் நுணுக்கத்தை எந்த அளவு வெளிப்படுத்துவது
  choice: சுற்றித் திரிந்து
  alternative: பதுங்கித் திரிந்து
  rationale: கிரேக்க வினையின் சாதாரண பொருளைக் காக்கிறது; அச்சுறுத்தலை சிங்க ஒப்புமையே சுமக்க அனுமதிக்கிறது. சூழலுக்கேற்ற விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இணையான இரண்டு கட்டளைகளின் வேறுபாடு ‘தெளிந்த மனதுடன்’ மற்றும் ‘விழிப்புடன்’ என்பவற்றால் காக்கப்பட்டுள்ளது; சிங்க உருவகத்தின் வலிமை மிகைப்படுத்தாமல் பாதுகாக்கப்பட்டுள்ளது.
