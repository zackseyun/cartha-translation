    text: அல்லது, “கடவுள் விரும்புகிறபடி” / “கடவுளின் விருப்பத்திற்கு இசைவாக.”
    reason: மாற்று விளக்க மொழிபெயர்ப்பு
  revision_rationale: The revision preserves all source-language contrasts and avoids a technical church-office rendering. It clarifies that both adverbial contrasts qualify the elders' oversight, while the footnote continues to offer natural interpretive renderings of the compressed phrase κατὰ θεόν without making either one the sole meaning.
