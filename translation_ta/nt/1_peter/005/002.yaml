review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the imperative to shepherd God's flock, God's ownership of the flock, the non-technical sense of ἐπισκοποῦντες, and both contrasting motive clauses. However, the final generic “செய்யுங்கள்” weakens the explicit connection of προθύμως to the oversight/shepherding activity. Repeating the governing activity makes the syntax and scope clear in Tamil.
  naturalness: The proposed revision uses clear modern standard Tamil. “கடவுளுக்கு ஏற்றபடி” is slightly more idiomatic than “கடவுளுக்கு ஏற்ப” while retaining the Greek phrase's deliberate semantic openness. Repetition of “கண்காணியுங்கள்” is preferable here to a vague final auxiliary verb.
  terminology: “மந்தையை மேயுங்கள்” preserves the pastoral metaphor; “கண்காணியுங்கள்” remains descriptive rather than imposing an ecclesiastical office title. “இழிவான ஆதாயம்” adequately conveys morally disgraceful gain.
  issues:
  - severity: medium
    issue: The final phrase ends with the generic verb “செய்யுங்கள்.”
    rationale: The Greek προθύμως modifies the participial activity ἐπισκοποῦντες. In Tamil, “ஆர்வத்துடன் செய்யுங்கள்” leaves the action less explicit and can sound detached from the preceding oversight. Repeating “கண்காணியுங்கள்” makes its syntactic relation clear.
  - severity: low
    issue: “கடவுளுக்கு ஏற்ப” is somewhat stiff in contemporary Tamil.
    rationale: “கடவுளுக்கு ஏற்றபடி” is more natural while still not deciding whether κατὰ θεόν means God's will, standard, or manner.
  revised_text: உங்களிடையே இருக்கும் கடவுளின் மந்தையை மேயுங்கள்; அதை கட்டாயத்தினால் அல்ல, மனமுவந்து, கடவுளுக்கு ஏற்றபடி கண்காணியுங்கள்; இழிவான ஆதாயத்திற்காக அல்ல, ஆர்வத்துடன் கண்காணியுங்கள்.
  revised_footnotes:
