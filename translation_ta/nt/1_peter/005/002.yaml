- from: உங்களிடையே இருக்கும் கடவுளின் மந்தையை மேயுங்கள்; கட்டாயத்தினால் அல்ல, மனமுவந்து, கடவுளுக்கு ஏற்ப[a] அதைக் கண்காணியுங்கள்; இழிவான ஆதாயத்திற்காக அல்ல, ஆர்வத்துடன் செய்யுங்கள்.
