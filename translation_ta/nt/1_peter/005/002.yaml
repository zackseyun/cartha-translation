id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: ta
  text: உங்களிடையே இருக்கும் கடவுளின் மந்தையை மேயுங்கள்; அதை கட்டாயத்தினால் அல்ல, மனமுவந்து, கடவுளுக்கு ஏற்றபடி கண்காணியுங்கள்; இழிவான ஆதாயத்திற்காக அல்ல, ஆர்வத்துடன் கண்காணியுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμάνατε
  choice: மேயுங்கள்
  rationale: மூப்பர்கள் மேய்ப்பர்களைப் போலப் பராமரித்து வழிநடத்த வேண்டும் என்ற உருவகத்தைத் தக்கவைக்கும் கட்டளை வினை.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: உங்களிடையே இருக்கும் கடவுளின் மந்தை
  rationale: ποίμνιον என்பதன் மேய்ப்பர் உருவகத்தை ‘மந்தை’ தக்கவைக்கிறது. ἐν ὑμῖν என்பதை உரிமையாக அல்லாமல், அவர்கள் நடுவில் இருக்கும் மந்தை என்று காட்டுகிறது; மந்தை கடவுளுக்குரியது என்பதையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: ἐπισκοποῦντες
  choice: அதைக் கண்காணியுங்கள்
  rationale: மந்தையை மேய்ப்பது எவ்வாறு நடைபெற வேண்டும் என்பதை இப்பங்கேற்பு வினை விளக்குகிறது. ‘கண்காணியுங்கள்’ என்பது பிந்தைய திருச்சபைப் பதவிப்பெயரைத் திணிக்காமல் கவனிப்பையும் மேற்பார்வையையும் தெரிவிக்கிறது.
- source_word: μὴ ἀναγκαστῶς
  choice: கட்டாயத்தினால் அல்ல
  rationale: வற்புறுத்தல் அல்லது தவிர்க்க முடியாத கடமை உணர்வினால் செயல்படுவதைக் குறிக்கும் எதிர்மறைக் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἀλλὰ ἑκουσίως
  choice: மனமுவந்து
  rationale: கட்டாயத்திற்கு மாறாகத் தன் விருப்பத்தோடும் உள்ளார்ந்த சம்மதத்தோடும் செய்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κατὰ θεόν
  choice: கடவுளுக்கு ஏற்ப
  rationale: இச்சுருக்கமான கிரேக்கச் சொற்றொடர் கடவுளின் விருப்பம், நெறி அல்லது அவர் விரும்பும் முறை ஆகியவற்றில் எதைக் குறிப்பாக வலியுறுத்துகிறது என்பதைத் தீர்மானித்துவிடாமல் அதன் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: இழிவான ஆதாயத்திற்காக அல்ல
  rationale: ஒழுக்கக்கேடான அல்லது கீழ்த்தரமான இலாப நோக்கத்தை αἰσχροκερδῶς கண்டிக்கிறது; ‘இழிவான ஆதாயம்’ அதன் அறநெறி வலிமையைத் தக்கவைக்கிறது.
- source_word: ἀλλὰ προθύμως
  choice: ஆர்வத்துடன்
  rationale: செய்ய ஆயத்தமாகவும் ஆவலாகவும் இருப்பதைத் தெரிவித்து, முன்னுள்ள ἑκουσίως என்பதற்கான ‘மனமுவந்து’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: ἐπισκοποῦντες என்பதைத் திருச்சபைப் பதவிப்பெயராக மொழிபெயர்க்க வேண்டுமா
  choice: ‘அதைக் கண்காணியுங்கள்’ என்று செயலை விவரிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கண்காணிகளாகப் பணியாற்றுங்கள்’ அல்லது ‘ஆயர்களாகச் செயல்படுங்கள்’
  rationale: சூழலில் இது மூப்பர்கள் செய்ய வேண்டிய செயலை விளக்குகிறது; பிற்காலத்தில் நிலைபெற்ற எந்த ஒரு திருச்சபை ஆட்சிமுறையையோ பதவிப்பெயரையோ வசனத்துக்குள் கொண்டு வராமல் சொற்பொருளைத் தக்கவைக்கிறது.
- issue: κατὰ θεόν என்பதன் பொருளை எவ்வளவு வெளிப்படையாக விளக்குவது
  choice: முதன்மை உரையில் ‘கடவுளுக்கு ஏற்ப’ என்ற சுருக்கமான வடிவம் வைக்கப்பட்டு, இயல்பான விளக்க வடிவங்கள் அடிக்குறிப்பில் தரப்பட்டன.
  alternative: ‘கடவுளின் விருப்பத்தின்படி’ அல்லது ‘கடவுள் விரும்புகிறபடி’
  rationale: கிரேக்கச் சொற்றொடர் இறையியல் நிறைவுடையதாயினும் பொருளில் சுருக்கமானது. ஒரே விளக்கத்தைத் தீர்மானமாக்காமல் அதன் உண்மையான நுட்பத் திறந்த தன்மையை இது காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மந்தையை மேயுங்கள்’ என்ற வேதாகம மேய்ப்பர் உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘கண்காணியுங்கள்’ என்பது குறிப்பிட்ட திருச்சபைப் பதவியமைப்பைத் திணிக்காமல் பொறுப்பான கவனிப்பை உணர்த்துகிறது.
