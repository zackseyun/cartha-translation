    text: அல்லது, “தாழ்த்தப்படுங்கள் ... அவர் உங்களைத் தக்க காலத்தில் உயர்த்தும்படி.” கிரேக்கத்தில் இந்தக் கட்டளை செயப்பாட்டு வடிவில் உள்ளது; எனினும் இச்சூழலில் அது பொதுவாகத் தன்முகப் பொருளில், “உங்களைத் தாழ்த்துங்கள்” என்று புரிந்துகொள்ளப்படுகிறது.
