  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: ta
  text: ஆகையால், கடவுளுடைய வல்லமையான கரத்தின்கீழ் உங்களைத் தாழ்த்துங்கள்[a]; அவர் தக்க காலத்தில் உங்களை உயர்த்தும்படி.
  philosophy: optimal-equivalence
  footnotes:
