lexical_decisions:
- source_word: Ταπεινώθητε
  choice: உங்களைத் தாழ்த்துங்கள்
  rationale: வடிவத்தில் இது இறந்தகாலச் செயப்பாட்டு ஏவல் என்றாலும், இச்சூழலில் தன்முகப் பொருளுடன் வரும் கட்டளையாக இயல்பாகப் புரிந்துகொள்ளப்படுகிறது. தமிழ் மொழியில் கட்டளையின் வலிமையையும் கடவுளுக்கு அடங்குவதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் பெருமையுள்ளவர்களுக்கு கடவுள் எதிர்த்து நிற்பதும் தாழ்மையுள்ளவர்களுக்கு அருள் அளிப்பதும் கூறப்பட்டுள்ளதால், அதிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: வல்லமையான கரத்தின்கீழ்
  rationale: கடவுளின் வல்லமையும் ஆளுகையும் செயலும் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது; நவீன தமிழிலும் தெளிவாக உள்ளது.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: அந்த வல்லமையான கரம் கடவுளுடையது என்பதை நேரடியாக அடையாளப்படுத்தும் உரிமைத் தொடர்பு.
- source_word: ἵνα
  choice: அப்போது
  rationale: தாழ்மைப்படுவதற்கும் கடவுள் ஏற்ற காலத்தில் உயர்த்துவதற்கும் உள்ள நோக்கம்/விளைவு உறவை இயல்பான தமிழில் காட்டுகிறது. இது வெறும் காலத்தொடர்ச்சியல்ல; முன்னுள்ள கட்டளையுடன் பின்னுள்ள இறைச் செயலை இணைக்கிறது.
- source_word: ὑμᾶς ὑψώσῃ
  choice: அவர் உங்களை உயர்த்துவார்
  rationale: மறைமுக எழுவாய் முந்தைய சொற்றொடரில் உள்ள கடவுள். இங்கு உடலளவில் தூக்குவதைவிட மதிப்பு, மீட்பு அல்லது நியாயப்படுத்துதலுக்கு உயர்த்துவதை ‘உயர்த்துவார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν καιρῷ
  choice: ஏற்ற காலத்தில்
  rationale: καιρός என்பது வெறும் நேரத்தைக் காட்டாமல் பொருத்தமான அல்லது நிர்ணயிக்கப்பட்ட தருணத்தைக் குறிக்கிறது. ‘ஏற்ற காலத்தில்’ இந்த நுணுக்கத்தைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: Ταπεινώθητε என்பதிலுள்ள வினைக்குரலும் செயலாண்மையும்
  choice: ‘உங்களைத் தாழ்த்துங்கள்’ என்று தன்முகக் கட்டளையாக மொழிபெயர்த்து, ‘கடவுளுடைய வல்லமையான கரத்தின்கீழ்’ என்பதன் மூலம் இது கடவுளுக்கு அடங்குதலைக் குறிக்கிறது என்பதைத் தக்கவைத்தல்.
  alternative: ‘தாழ்த்தப்படுங்கள்’
  rationale: மனிதர்கள் தாங்களாகவே மதிப்பிழக்க வேண்டும் என்ற கருத்தைத் தவிர்த்து, கடவுளுக்கு முன் தாழ்மையுடன் அடங்க வேண்டிய மனிதப் பொறுப்பையும், பின்னர் உயர்த்துபவர் கடவுளே என்பதையும் ஒன்றாகப் பாதுகாக்கிறது. அதேவேளையில் கிரேக்கச் செயப்பாட்டு வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வல்லமையான கரம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘ஏற்ற காலத்தில்’ என்பது பாரம்பரியத் தொனியும் தெளிவும் கொண்ட இயல்பான சொற்றொடர்.
