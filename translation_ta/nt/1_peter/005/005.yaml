source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: ta
  text: அவ்வாறே, இளைய ஆண்களே,[a] மூப்பர்களுக்குக் கீழ்ப்படியுங்கள். நீங்கள் அனைவரும் ஒருவரோடொருவர் உறவுகொள்ளும்போது பணிவை ஆடையாக அணிந்துகொள்ளுங்கள்,[b] ஏனெனில், “கடவுள் அகந்தையுள்ளவர்களை எதிர்க்கிறார்; பணிவுள்ளவர்களுக்கோ அருள் அளிக்கிறார்.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இளையவர்களே.” கிரேக்கத்தில் இது ஆண்பால் பன்மை வடிவம்; எனினும் சிலர் இதைச் சபையின் இளைய உறுப்பினர்களைப் பொதுவாகக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பணிவைக் கட்டிக்கொள்ளுங்கள்.” கிரேக்க வினைச்சொல் ஆடையை அணிவதையோ கட்டிக்கொள்வதையோ நினைவூட்டுகிறது; பணிவை வேண்டுமென்றே தரித்துக்கொள்ளும் உருவகத்தை இது வலுப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: நீதிமொழிகள் 3:34 (கிரேக்கப் பழைய ஏற்பாடு) மேற்கோள் அல்லது சுட்டு.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: முந்தைய அறிவுரைகளோடு இவ்வறிவுரையை இணைக்கும் சொல்; சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: νεώτεροι
  choice: இளைய ஆண்களே
  rationale: ஆண்பால் பன்மை விளிப்பை வெளிப்படையாகக் காக்கிறது; பொதுவாக இளையவர்களைக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ὑποτάγητε
  choice: கீழ்ப்படியுங்கள்
  rationale: தம்மை உட்படுத்திக்கொள்ளும் அறிவுறுத்தலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πρεσβυτέροις
  choice: மூப்பர்களுக்கு
  rationale: உடனடி சூழலான 5:1–4 சபை மூப்பர்களைக் குறிப்பிடுவதால், வெறும் வயதில் மூத்த ஆண்கள் என்பதைக் காட்டிலும் இதுவே பொருத்தமானது.
- source_word: πάντες δὲ
  choice: நீங்கள் அனைவரும்
  rationale: அறிவுரை இளைய ஆண்களைத் தாண்டி முழுச் சமூகத்திற்கும் விரிவடைவதைத் தெளிவாக்குகிறது.
- source_word: ἀλλήλοις
  choice: ஒருவருக்கொருவர்
  rationale: சமூக உறவுகளில் பரஸ்பரமான நோக்கை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ταπεινοφροσύνην
  choice: பணிவை
  rationale: தாழ்மையான மனப்பாங்கை ordinary modern Tamil-இல் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἐγκομβώσασθε
  choice: ஆடையாக அணிந்துகொள்ளுங்கள்
  rationale: ஆடையை உடுத்துதல் அல்லது கட்டிக்கொள்ளுதல் சார்ந்த உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள அறிவுரைக்கான வேதாகம அடிப்படையை அறிமுகப்படுத்துகிறது.
- source_word: ὑπερηφάνοις
  choice: அகந்தையுள்ளவர்களை
  rationale: பெருமிதமும் ஆணவமும் கொண்டவர்களைக் குறிக்கும் substantival adjective-ஐ தெளிவாகத் தருகிறது.
- source_word: ἀντιτάσσεται
  choice: எதிர்க்கிறார்
  rationale: தம்மை எதிராக நிறுத்திக்கொள்ளுதல் என்ற வலுவான பொருளை நேரடியாகக் காக்கிறது.
- source_word: ταπεινοῖς ... χάριν
  choice: பணிவுள்ளவர்களுக்கோ அருள்
  rationale: மாறுபாட்டைக் காட்டும் δέ-ஐ ‘-க்கோ’ மூலம் வெளிப்படுத்தி, χάρις என்பதற்கு இச்சூழலில் பொருத்தமான ‘அருள்’ என்பதைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: πρεσβυτέροις என்பதன் குறிப்பு
  choice: சபை மூப்பர்கள்
  alternative: பொதுவாக வயதில் மூத்த ஆண்கள்
  rationale: 5:1–4-இல் மூப்பர்கள் நேரடியாகச் சொல்லப்பட்டுள்ள உடனடி இலக்கியச் சூழல், அங்கீகரிக்கப்பட்ட சபை மூப்பர்களையே இங்கு குறிக்கிறது என்பதற்கு வலுவான ஆதாரம் தருகிறது.
- issue: νεώτεροι என்பதின் பாலின வெளிப்பாடு
  choice: இளைய ஆண்களே
  alternative: இளையவர்களே
  rationale: கிரேக்க வடிவம் ஆண்பால் பன்மை என்பதைக் காக்கிறது; அதேவேளை அது சபையின் இளைய உறுப்பினர்களை விரிவாகக் குறிக்கலாம் என்ற உண்மையான வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: நீதிமொழிகள் 3:34 மேற்கோளின் வடிவம்
  choice: மேற்கோள் குறிகளுடன் தனித்த வேதாகம ஆதாரமாக வழங்குதல்
  alternative: மேற்கோள் குறிகளின்றி ஆசிரியரின் தொடர்வாக்கியமாக வழங்குதல்
  rationale: சொற்றொடர் நீதிமொழிகள் 3:34 LXX-ஐ மேற்கோள் அல்லது தெளிவான சுட்டாகக் கொண்டுள்ளது; மேற்கோள் குறிகள் அதன் வேதாகம அடிப்படையை வாசகருக்குத் தெளிவாக்குகின்றன, ஆனால் தொடர்பு அடிக்குறிப்பிலும் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை. ‘மூப்பர்கள்’, ‘அருள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ஆடை உருவகமும், ஆண்பால் விளிப்பும், அகந்தையுள்ளோர்/பணிவுள்ளோர் என்ற இறையியல் எதிர்மறைத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
