  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: ta
  text: எல்லா அருளின் கடவுள், மெசியாவில் தமது நித்திய மகிமைக்குள் உங்களை அழைத்தவர், சிறிது காலம் நீங்கள் துன்பப்பட்ட பின்பு, தாமே உங்களைச் சீர்ப்படுத்தி[a], நிலைப்படுத்தி, வலுப்படுத்தி, உறுதியான அடித்தளத்தில் நிறுத்துவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழுமைப்படுத்தி’ அல்லது ‘உரிய நிலைக்குக் கொண்டுவந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை, ஒன்றைச் சரியான நிலைக்குச் சீரமைக்கும் பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்களுக்கு அடித்தளமிடுவார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் அடித்தளம் அமைக்கும் உருவகம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: எல்லா அருளுக்கும் ஊற்றாகிய
  rationale: சொல்லுக்குச் சொல் வடிவான ‘எல்லா அருளின் கடவுள்’ தமிழில் இயல்பற்றதாக இருப்பதால், கடவுளே எல்லா அருளுக்கும் ஆதாரம் என்ற விரிவான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καλέσας
  choice: அழைத்தவர்
  rationale: இறந்தகால வினையெச்சத்தின் செயலை இயல்பான தமிழ் தொடர்பு வினை வடிவில் தருகிறது.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: தமது நித்திய மகிமைக்குள்
  rationale: εἰς என்பதன் திசை மற்றும் உட்புகுதல் சார்ந்த பொருளை ‘மகிமைக்குள்’ காக்கிறது; αὐτοῦ-வின் தற்சுட்டுப் பொருளை ‘தமது’ தெளிவாகக் காட்டுகிறது.
- source_word: ἐν Χριστῷ
  choice: மெசியாவில்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பொருளைத் தக்கவைக்கிறது; ἐν என்பதையும் ‘-இல்’ வடிவில் காக்கிறது.
- source_word: ὀλίγον παθόντας
  choice: சிறிது காலம் நீங்கள் துன்பப்பட்ட பின்பு
  rationale: ὀλίγον என்பதை கால அளவாகப் புரிந்து, துன்பம் குறுகிய காலத்திற்குரியது என்பதையும் பின்னர் வரும் இறைச்செயலோடு அதன் காலத் தொடர்பையும் தெளிவாக்குகிறது.
- source_word: αὐτὸς
  choice: தாமே
  rationale: கடவுள் தனிப்பட்ட முறையில் செயற்படுவார் என்ற வலியுறுத்தலை மரியாதையான ஒருமை வடிவில் காக்கிறது.
- source_word: καταρτίσει
  choice: சீர்ப்படுத்தி
  rationale: கேடுற்றதை உரிய நிலைக்கு மீட்டல், குறையை நிறைவு செய்தல் ஆகிய பொருள் நிழல்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: στηρίξει
  choice: நிலைப்படுத்தி
  rationale: உறுதியாக்குதல், அசையாமல் நிலைநிறுத்துதல் என்ற பொருளை அடுத்த வினைகளிலிருந்து முடிந்தவரை வேறுபடுத்துகிறது.
- source_word: σθενώσει
  choice: வலுப்படுத்தி
  rationale: பலமளித்தல் என்ற நேரடியான பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: θεμελιώσει
  choice: உறுதியான அடித்தளத்தில் நிறுத்துவார்
  rationale: கிரேக்க வினையின் அடித்தள உருவகத்தை வெளிப்படையாகக் காத்து, ‘நிலைப்படுத்தி’ என்பதோடு தேவையற்ற ஒற்றுமையைத் தவிர்க்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: இச்சொல் வெறும் பெயராக அல்லாமல் பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அதன் பட்டப்பொருளை வெளிப்படுத்துகிறது; பாரம்பரிய தமிழ் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: துன்பத்துக்கும் கடவுளின் செயலுக்கும் உள்ள காலத் தொடர்பு
  choice: சிறிது காலம் நீங்கள் துன்பப்பட்ட பின்பு
  alternative: சிறிது காலம் நீங்கள் துன்பப்படும்போது
  rationale: வினையெச்சம் ஓரளவு கால நெகிழ்வைக் கொண்டிருந்தாலும், குறுகிய துன்பத்தைத் தொடர்ந்து கடவுளின் மீட்டமைக்கும் செயல் வரும் வரிசையை இவ்வடிவம் இயல்பாகக் காட்டுகிறது; துன்பத்தின் காரணம் அல்லது கோட்பாட்டை கூடுதலாக நிர்ணயிப்பதில்லை.
- issue: நான்கு இறுதி வினைகளின் வேறுபாடு
  choice: சீர்ப்படுத்தி, நிலைப்படுத்தி, வலுப்படுத்தி, உறுதியான அடித்தளத்தில் நிறுத்துவார்
  alternative: முழுமைப்படுத்தி, உறுதிப்படுத்தி, பலப்படுத்தி, அடித்தளமிடுவார்
  rationale: ஒன்றோடொன்று தொடர்புடைய வினைகளை ஒரே கருத்தாகச் சுருக்காமல், மீட்டமைத்தல், நிலைத்தன்மை, வலிமை, அடித்தளம் ஆகிய தனித்த நிழல்களைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. கடவுளைக் குறிக்கும் இடங்களில் ‘தமது’, ‘தாமே’ என்ற மரியாதையான ஒருமை வடிவங்கள் உள்ளன. கிரேக்க மூலத்தில் இல்லாத இணைப்புச் சொல்லைத் தொடக்கத்தில் சேர்க்காமல், வசனம் தனித்து வாசிக்க இயலுமாறு அமைக்கப்பட்டுள்ளது.
