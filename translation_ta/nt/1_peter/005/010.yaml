  to: எல்லா அருளின் கடவுள், மெசியாவில் தமது நித்திய மகிமைக்குள் உங்களை அழைத்தவர், சிறிது காலம் நீங்கள் துன்பப்பட்ட பின்பு, தாமே உங்களைச் சீர்ப்படுத்தி[a], நிலைப்படுத்தி, வலுப்படுத்தி, உறுதியான அடித்தளத்தில் நிறுத்துவார்[b].
