revisions:
- from: அவருக்கே ஆட்சிவல்லமை என்றென்றைக்கும் உரியதாகுக[a]. ஆமென்.
  to: அவருக்கு அதிகாரம் என்றென்றைக்கும் உரியது[a]. ஆமென்.
  rationale: The revision replaces the less natural compound «ஆட்சிவல்லமை» with the idiomatic and contextually apt «அதிகாரம்». «அவருக்கு ... உரியது» renders the Greek verbless doxology without introducing a stronger optative force than the source requires. The footnote is revised to reflect more closely the literal Greek expression εἰς τοὺς αἰῶνας τῶν αἰώνων while the main text retains natural modern Tamil.
