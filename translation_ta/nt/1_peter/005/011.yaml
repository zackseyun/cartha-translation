  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: ta
  text: அவருக்கு அதிகாரம் என்றென்றைக்கும் உரியது[a]. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சார்ந்து: “யுகங்களின் யுகங்களுக்குள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: அவருக்கே
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட கடவுளைக் குறிக்கும் ஒருமை வேற்றுமை வடிவம். ‘-க்கே’ என்பது புகழுரையின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κράτος
  choice: ஆட்சிவல்லமை
  rationale: இங்கு வெறும் உடல் வலிமையையோ பொதுவான சக்தியையோ அல்லாமல், ஆளும் இறையாண்மையுள்ள வல்லமையைக் குறிக்கிறது. ‘ஆட்சிவல்லமை’ அந்த இரு கூறுகளையும் சுருக்கமாகத் தருகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: முடிவில்லாத காலத்தை வலியுறுத்தும் வழக்கமான கிரேக்கப் புகழுரை. ‘என்றென்றைக்கும்’ என்பது அதன் பொருளையும் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு உறுதிப்பாட்டைக் காக்கும், தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: வினைச்சொல் இல்லாத கிரேக்கப் புகழுரையில் உள்ள மறைமுகப் பயனிலை
  choice: அவருக்கே ... உரியதாகுக
  alternative: ஆட்சிவல்லமை அவருக்கே உரியது
  rationale: மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லை. ‘உரியதாகுக’ என்பது புகழுரையின் வேண்டுதல்/அறிவிப்பு நயத்தைக் காக்கிறது; ஆட்சிவல்லமை இப்போதுதான் உருவாகிறது என்ற எண்ணத்தைத் தரக்கூடிய ‘உண்டாவதாக’ என்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் வழிபாட்டு நயமுடையதுமான நடை. ‘ஆட்சிவல்லமை’ என்பது κράτος என்பதிலுள்ள ஆளுகை மற்றும் வல்லமை ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
