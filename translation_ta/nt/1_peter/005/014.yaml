  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: ta
  text: அன்பின் முத்தத்தோடு ஒருவரையொருவர் வாழ்த்துங்கள். மேசியாவுக்குள் இருக்கிற உங்கள் அனைவருக்கும் சமாதானம் உண்டாவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழக்கில், “கிறிஸ்துவுக்குள் இருக்கிற உங்கள் அனைவருக்கும் சமாதானம் உண்டாவதாக.”
    reason: Χριστός என்பதற்கான தமிழ்க் கிறிஸ்தவ மரபில் பரவலாக அறியப்பட்ட மாற்று வடிவத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துங்கள்
  rationale: இது பன்மை முன்னிலை ஏவல் வடிவம்; திருமுக நிறைவுரையில் சமூகத்தினர் ஒருவரையொருவர் வாழ்த்த வேண்டும் என்ற அழைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: சமூகத்தினரிடையே பரஸ்பரமாக நடைபெறும் செயலைக் குறிக்கும் பதிலிடுபெயரைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἐν φιλήματι ἀγάπης
  choice: அன்பின் முத்தத்தோடு
  rationale: ἐν என்பதை வாழ்த்தும் முறையைக் குறிக்கும் ‘-ஓடு’ என இயல்பாக வழங்குகிறது; φίλημα என்பதன் ‘முத்தம்’ என்ற பொருளையும் ἀγάπη என்பதன் ‘அன்பு’ என்ற நேரடி சொற்பிணைப்பையும் காக்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம் உண்டாவதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் இல்லாத சுருக்கமான ஆசீர்வாதக் கூற்றை, தமிழில் தெளிவான வாழ்த்தாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑμῖν πᾶσιν
  choice: உங்கள் அனைவருக்கும்
  rationale: ஆசீர்வாதத்தைப் பெறுவோரின் முழுமையான வட்டத்தை இயல்பான தமிழில் உள்ளடக்குகிறது.
- source_word: τοῖς ἐν Χριστῷ
  choice: மேசியாவுக்குள் இருக்கிற
  rationale: உருபுடன் வரும் முன்னிடைச்சொல் தொடரின் ‘அவருக்குள் இருப்பவர்கள்’ என்ற பெயர்ச்சொல் செயல்பாட்டைக் காக்கிறது. Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டமாக இருப்பதால் ‘மேசியா’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்ற தொடரில் Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவுக்குள்
  alternative: கிறிஸ்துவுக்குள்
  rationale: Χριστός என்பதன் பட்டப் பொருளான ‘அபிஷேகம் பெற்றவர்’ என்பதை ‘மேசியா’ வெளிப்படையாகக் காக்கிறது. தமிழ்க் கிறிஸ்தவ வழக்கில் நன்கு அறியப்பட்ட ‘கிறிஸ்து’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது; ‘-க்குள்’ என்பது அவருடனான ஒன்றிப்பைக் குறிக்கும் கிரேக்க உருவகத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருமுக நிறைவுரைக்கு ஏற்ற கண்ணியமான பன்மை ஏவலும் ஆசீர்வாத நடையும் பயன்படுத்தப்பட்டுள்ளன. ‘அன்பின் முத்தம்’ என்ற சற்றே செறிவான அமைப்பு மூலத்தின் பெயர்ச்சொல் தொடர்பைக் காக்கிறது; ‘மேசியாவுக்குள்’ என்ற உருவகம் விளக்கமாக விரித்துரைக்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
