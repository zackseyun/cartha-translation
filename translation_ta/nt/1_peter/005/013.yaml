  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: ta
  text: பாபிலோனில் உள்ள, உங்களுடன் சேர்ந்து தேர்ந்தெடுக்கப்பட்டவள்[a][b] உங்களுக்கு வாழ்த்துத் தெரிவிக்கிறாள்; என் மகன்[c] மாற்குவும் வாழ்த்துத் தெரிவிக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் விளக்கமாக, “பாபிலோனில் உள்ள, உங்களுடன் சேர்ந்து தேர்ந்தெடுக்கப்பட்ட திருச்சபை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் பெண்பால் ஒருமைச் சொற்றொடர் உள்ளது; அதற்குரிய பெயர்ச்சொல் கூறப்படாமல் விடப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் “பாபிலோன்” என்பது ரோமைக் குறிக்கும் அடையாளப் பெயராக இருக்கலாம்; ஆனால் உரை தானாகவே “பாபிலோன்” என்றுதான் கூறுகிறது.
    reason: cultural_note
  - marker: c
    text: “என் மகன்” என்பது உயிரியல் உறவை அல்லாமல் ஆன்மிக உறவைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: வாழ்த்துத் தெரிவிக்கிறாள் / வாழ்த்துத் தெரிவிக்கிறான்
  rationale: கடிதச் சூழலில் ἀσπάζομαι என்பதன் ‘வாழ்த்துதல், வாழ்த்துகளைத் தெரிவித்தல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. எழுவாய்களின் பாலுக்கேற்ப வினைச்சொல் இருமுறை வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: ἡ ... συνεκλεκτὴ
  choice: உங்களோடுகூடத் தேர்ந்தெடுக்கப்பட்டவள்
  rationale: பெண்பால் ஒருமையில் உள்ள கிரேக்கக் கட்டமைப்பில் பெயர்ச்சொல் வெளிப்படையாக இல்லை. ‘திருச்சபை’ என்று முதன்மை உரையில் நிரப்பாமல், பெண்பால் குறிப்பையும் மூலத்தின் தெளிவின்மையையும் காக்கிறது.
- source_word: ἐν Βαβυλῶνι
  choice: பாபிலோனில்
  rationale: மூல உரை குறிப்பிடும் இடப்பெயரை அப்படியே வைத்திருக்கிறது; ‘ரோம்’ என்ற விளக்கத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: συνεκλεκτὴ
  choice: உங்களோடுகூடத் தேர்ந்தெடுக்கப்பட்டவள்
  rationale: மற்றவர்களோடு சேர்ந்து தேர்ந்தெடுக்கப்பட்டிருப்பது என்ற உறவுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Μᾶρκος
  choice: மாற்கு
  rationale: Μᾶρκος என்ற பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம்.
- source_word: ὁ υἱός μου
  choice: என் மகன்
  rationale: υἱός என்பதன் நேரடியான குடும்ப உறவுச் சொல்லைத் தக்கவைக்கிறது; ஆன்மிக உறவு என்ற சாத்தியமான விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ἡ ... συνεκλεκτὴ என்பதன் அடையாளம்
  choice: பெண்பால் ஒருமைச் சுட்டை ‘தேர்ந்தெடுக்கப்பட்டவள்’ என்று வைத்துப் பெயர்ச்சொல்லை நிரப்பாமல் விடுதல்
  alternative: ‘உங்களோடுகூடத் தேர்ந்தெடுக்கப்பட்ட பாபிலோனிலுள்ள திருச்சபை’ என்று மொழிபெயர்த்தல்; அல்லது பேதுருவின் மனைவி/வேறொரு கிறிஸ்தவப் பெண் எனப் புரிந்துகொள்ளுதல்
  rationale: கிரேக்கத்தில் பெண்பால் ஒருமை உருபும் பெயரடையும் உள்ளன; ஆனால் அவற்றுடன் செல்லும் பெயர்ச்சொல் வெளிப்படையாக இல்லை. ஆகவே உண்மையான தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- issue: ‘பாபிலோன்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘பாபிலோன்’ என்ற பெயரைத் தக்கவைத்தல்
  alternative: ஆரம்பக் கிறிஸ்தவ அடையாளப் பயன்பாட்டின்படி ‘ரோம்’ என்று மொழிபெயர்த்தல்; அல்லது மெசொப்பொத்தாமிய பாபிலோன் எனத் திட்டவட்டமாகப் புரிந்துகொள்ளுதல்
  rationale: மூல உரை நேரடியாக ‘பாபிலோன்’ என்றே கூறுகிறது. வரலாற்று அடையாளம் விவாதத்திற்குரியது என்பதால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
- issue: மாற்குவை ‘என் மகன்’ என்று அழைப்பதன் பொருள்
  choice: குடும்ப உறவைக் குறிக்கும் நேரடி சொல்லை அப்படியே வைத்தல்
  alternative: ‘என் ஆன்மிக மகன்’ அல்லது ‘என் அன்பு மகன்’
  rationale: சூழலில் இது ஆன்மிக உறவைக் குறிக்கக்கூடும்; ஆனால் கிரேக்கம் அந்த விளக்கத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தின் பெண்பால் ஒருமையும் அதன் மறைபெயர்ச்சொல் சார்ந்த தெளிவின்மையும் காக்கப்பட்டுள்ளன. ‘வாழ்த்துத் தெரிவிக்கிறாள்/தெரிவிக்கிறான்’ என்ற இணையான வடிவங்கள் தமிழில் எழுவாய்களைத் தெளிவுபடுத்துகின்றன.
