source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: ta
  text: விசுவாசத்தில் உறுதியாய் இருந்து, அவனை எதிர்த்து நில்லுங்கள். உலகத்தில் உள்ள உங்கள் சகோதரச் சமுதாயத்தினரும்[b] அதேவகையான துன்பங்களை அனுபவித்து வருகிறார்கள்[a] என்பதை அறிந்திருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதேவகையான துன்பங்கள் நிறைவேற்றப்பட்டு வருகின்றன.”
    reason: ἐπιτελεῖσθαι என்பது துன்பங்கள் அனுபவிக்கப்படுவதை மட்டுமல்லாமல், அவை நிறைவேற்றப்படுவது அல்லது நிறைவுக்கு கொண்டுவரப்படுவது என்ற நுணுக்கத்தையும் தரக்கூடும்.
  - marker: b
    text: “சகோதரச் சமுதாயத்தினர்” என்பது ஆண்களை மட்டும் அல்ல, சக விசுவாசிகள் அனைவரையும் குறிக்கிறது.
    reason: ἀδελφότης என்பது விசுவாசிகளின் முழுச் சமூகத்தைக் குறிக்கும் கூட்டு குடும்பச் சொல்.
lexical_decisions:
- source_word: ᾧ
  choice: அவனை
  rationale: இது முந்தைய வசனத்திலுள்ள பிசாசைக் குறிக்கும் உறவுப்பெயர்; தமிழில் செயப்படுபொருளை வெளிப்படையாகக் கூறுவது இயல்பானது.
- source_word: ἀντίστητε
  choice: எதிர்த்து நில்லுங்கள்
  rationale: தீர்மானமான எதிர்ப்பைக் கோரும் கட்டளையின் வலிமையையும், ‘எதிர்த்து நிற்றல்’ என்ற சொல்லுருவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: στερεοὶ τῇ πίστει
  choice: விசுவாசத்தில் உறுதியாய் இருந்து
  rationale: στερεοὶ என்பதன் நிலைத்தன்மையையும் τῇ πίστει என்பதன் விசுவாசச் சூழலையும் தெளிவாகத் தருகிறது; ‘விசுவாசம்’ தனிப்பட்ட நம்பிக்கையையும் கிறிஸ்தவ விசுவாசத்தில் நிலைத்திருப்பதையும் உள்ளடக்கக்கூடியது.
- source_word: εἰδότες
  choice: என்பதை அறிந்திருங்கள்
  rationale: கிரேக்கப் பங்கேற்புவினையின் அறிவை அடிப்படையாகக் கொண்ட கட்டளைத் தொடர்பை இயல்பான தமிழ் வாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: இதேவிதமான துன்பங்களை
  rationale: முற்றிலும் ஒரே நிகழ்வுகள் என்பதற்குப் பதிலாக ஒரே வகையைச் சேர்ந்த துன்பங்கள் என்ற கிரேக்கச் சொற்றொடரின் இயல்பான பொருளைக் காட்டுகிறது.
- source_word: ἀδελφότητι
  choice: சகோதரச் சமுதாயத்தார்
  rationale: விசுவாசிகளின் முழுக் குடும்பச் சமூகத்தைக் குறிக்கும் கூட்டு உறவுமுறையைப் பாதுகாக்கிறது; இது ஆண்களை மட்டும் குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἐν τῷ κόσμῳ
  choice: உலகத்திலுள்ள
  rationale: சகோதரச் சமுதாயம் இருக்கும் இடத்தை நேரடியாகவும் சுருக்கமாகவும் குறிப்பிடுகிறது.
- source_word: ἐπιτελεῖσθαι
  choice: அனுபவித்து வருகிறார்கள்
  rationale: துன்பங்களோடு இயல்பாக இணையும் தமிழாக்கம்; நிகழ்காலத் தொடர்ச்சியையும் பிற விசுவாசிகளுக்கு நேரும் அதே அனுபவத்தையும் தெளிவாக்குகிறது. ‘நிறைவேற்றப்பட்டு வருகின்றன’ என்ற நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: τῇ πίστει என்பதன் பொருள்
  choice: விசுவாசத்தில்
  alternative: கிறிஸ்தவ விசுவாசத்தில் / விசுவாசத்தினால்
  rationale: கிரேக்க உரை தனிப்பட்ட நம்பிக்கையையோ ஏற்றுக்கொள்ளப்பட்ட கிறிஸ்தவ விசுவாசத்தையோ முற்றிலும் பிரித்துக் காட்டவில்லை. தமிழில் ‘விசுவாசத்தில்’ என்பது இரு நுணுக்கங்களுக்கும் இடமளித்து, பிரிவுசார் விளக்கத்தைச் சேர்க்காமல் இருக்கிறது.
- issue: ἐπιτελεῖσθαι என்பதன் கடினமான பொருள்
  choice: அனுபவித்து வருகிறார்கள்
  alternative: நிறைவேற்றப்பட்டு வருகின்றன / நிறைவுக்கு கொண்டுவரப்படுகின்றன
  rationale: செயப்படுவினை வடிவம் துன்பங்கள் நிகழ்ந்து அல்லது நிறைவேற்றப்பட்டு வருவதைச் சுட்டலாம். முதன்மை உரை இயல்பான அனுபவப் பொருளைத் தருகிறது; நிறைவு சார்ந்த சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ἀδελφότητι என்பதன் உள்ளடக்கம்
  choice: சகோதரச் சமுதாயத்தார்
  alternative: விசுவாசக் குடும்பத்தினர் / சகோதர சகோதரிகள்
  rationale: மூலத்தின் கூட்டு குடும்பச் சொல்லைத் தக்கவைத்தபடியே, அது ஆண் விசுவாசிகளை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘எதிர்த்து நில்லுங்கள்’ கட்டளையின் வலிமையைத் தருகிறது; நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. தொழில்நுட்ப அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
