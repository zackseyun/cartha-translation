  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் காக்கப்பட்டுள்ளது: சில்வானுவின் மூலம் எழுதுதல், அவரைப் பற்றிய பேதுருவின் தனிப்பட்ட மதிப்பீடு, சுருக்கமாக எழுதுதல், ஊக்குவித்தலும் சான்றளித்தலும், அருளில் நிலைத்திருக்கும்படியான கட்டளை ஆகியவை உள்ளன. ஆனால் வரைவில் ஊக்குவித்தல் மற்றும் சான்றளித்தல் ‘எழுதியிருக்கிறேன்’ என்பதோடு நேரடியாக இணைக்கப்படாமல் தனி வாக்கியமாக அமைந்துள்ளது; திருத்தம் கிரேக்கப் பங்கேற்பு அமைப்பையும் ‘இதுவே ... என்று’ என்ற உள்ளடக்கக் கூற்றையும் தெளிவாகப் பிரதிபலிக்கிறது.'
  naturalness: ‘என் கருத்தில் நம்பிக்கைக்குரிய சகோதரரான’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும், ὡς λογίζομαι என்பதன் தனிப்பட்ட மதிப்பீட்டையும் தெளிவாகவும் தருகிறது. ஒரே வாக்கியத்தில் பங்கேற்புகளை இணைப்பது தமிழில் சீரான ஓட்டத்தை அளிக்கிறது.
  terminology: ‘சில்வானு’ என்ற பெயரொலிபெயர்ப்பு பொருத்தமானது. குறிப்பிட்ட ஆண் இணைப் பணியாளரைக் குறிக்கும் ἀδελφός-க்கு ‘சகோதரர்’ தக்கது. இச்சூழலில் πιστός-க்கு ‘நம்பிக்கைக்குரிய’ என்பது பேதுருவின் மதிப்பீடாகிய ‘trustworthy/faithful’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது. ‘கடவுளின் உண்மையான அருள்’ மற்றும் ‘உறுதியாக நில்லுங்கள்’ மூலத்தின் சொற்செறிவையும் கட்டளைத் தொனியையும் காக்கின்றன.
