revisions:
- from: உண்மையுள்ள சகோதரராக நான் கருதும் சில்வானுவின் மூலம்[a] உங்களுக்குச் சுருக்கமாக எழுதியிருக்கிறேன். இதுவே கடவுளின் உண்மையான அருள் என்று உங்களை ஊக்குவித்துச் சான்றளிக்கிறேன். அந்த அருளில் உறுதியாக நில்லுங்கள்.[b]
  to: என் கருத்தில் நம்பிக்கைக்குரிய சகோதரரான சில்வானுவின் மூலம்[a], உங்களுக்குச் சுருக்கமாக எழுதியிருக்கிறேன்; இதுவே கடவுளின் உண்மையான அருள் என்பதை உங்களை ஊக்குவித்தும் சான்றளித்தும் எழுதியிருக்கிறேன். அந்த அருளில் உறுதியாக நில்லுங்கள்.[b]
  rationale: ஊக்குவித்தலும் சான்றளித்தலும் பேதுருவின் எழுத்துச் செயலோடு நேரடியாக இணைக்கப்பட்டன. ‘இதுவே கடவுளின் உண்மையான அருள் என்பதை’ என்ற அமைப்பு ὅτι/உள்ளடக்கக் கூற்றின் பொருளைத் துல்லியமாகக் காட்டுகிறது. கட்டளை வடிவமான στῆτε முதன்மை உரையில் தக்கவைக்கப்பட்டு, கூறுநிலை வாசக வேறுபாடு அடிக்குறிப்பில் மாற்றமின்றி காக்கப்பட்டுள்ளது.
