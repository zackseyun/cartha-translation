id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: ta
  text: என் கருத்தில் நம்பிக்கைக்குரிய சகோதரரான சில்வானுவின் மூலம்[a], உங்களுக்குச் சுருக்கமாக எழுதியிருக்கிறேன்; இதுவே கடவுளின் உண்மையான அருள் என்பதை உங்களை ஊக்குவித்தும் சான்றளித்தும் எழுதியிருக்கிறேன். அந்த அருளில் உறுதியாக நில்லுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சில்வானுவின் மூலம்’ என்பது அவர் கடிதத்தை எடுத்துச் சென்றதையோ, எழுதுவதில் உதவியதையோ குறிக்கலாம்; அவருடைய துல்லியமான பங்கு இங்கே சொல்லப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், ‘அந்த அருளில் உறுதியாக நில்லுங்கள்’ என்பதற்குப் பதிலாக, ‘அந்த அருளில் நீங்கள் நிலைத்திருக்கிறீர்கள்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: சில்வானுவின் மூலம்
  rationale: διά உடன் வரும் உருபு சில்வானுவின் இடைமுகத்தையோ செயலாண்மையையோ குறிக்கிறது. அவர் கடிதத்தை எடுத்துச் சென்றாரா அல்லது எழுதுவதில் உதவினாரா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் இந்த மொழிபெயர்ப்பு விடுகிறது.
- source_word: τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι
  choice: உண்மையுள்ள சகோதரராக நான் கருதும்
  rationale: πιστός என்பதன் உண்மைத்தன்மை அல்லது நம்பகத்தன்மை சார்ந்த பொருளையும், λογίζομαι வெளிப்படுத்தும் பேதுருவின் தனிப்பட்ட மதிப்பீட்டையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: δι’ ὀλίγων ἔγραψα
  choice: சுருக்கமாக எழுதியிருக்கிறேன்
  rationale: δι’ ὀλίγων என்பது ‘சில சொற்களால்’, அதாவது சுருக்கமாக எழுதுதல் என்ற மரபுத்தொடர். கடித முடிவின் epistolary aorist தமிழில் இயல்பாக நிறைவுநிகழ்காலத்தில் தரப்பட்டுள்ளது.
- source_word: παρακαλῶν
  choice: ஊக்குவித்து
  rationale: இச்சூழலில் παρακαλέω அறிவுரை, வேண்டுகோள், ஊக்கம் ஆகிய நிறங்களை உடையது. ‘ஊக்குவித்து’ என்பது வாசகர்களை உறுதியாக நிற்க அழைக்கும் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπιμαρτυρῶν
  choice: சான்றளிக்கிறேன்
  rationale: வெறும் உறுதிப்படுத்துதலைவிட வலுவான சாட்சி கூறும் பொருளைத் தக்கவைக்கிறது.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: இதுவே கடவுளின் உண்மையான அருள்
  rationale: ταύτην என்பதன் சுட்டுப்பொருளை அதிகமாகக் குறுக்காமல், ἀληθῆ என்பதின் ‘உண்மையான’ என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: εἰς ἣν στῆτε
  choice: அந்த அருளில் உறுதியாக நில்லுங்கள்
  rationale: στῆτε என்ற கட்டளையின் உறுதியான நிலைப்பாட்டை ‘உறுதியாக நில்லுங்கள்’ தெரிவிக்கிறது; தெளிவுக்காக சார்புப்பெயரின் முன்னோடியான ‘அருள்’ மீண்டும் சொல்லப்பட்டுள்ளது.
theological_decisions:
- issue: ‘இதுவே’ என்பதன் குறிப்பு
  choice: பேதுரு எழுதிய செய்தி மற்றும் அறிவுரையின் உள்ளடக்கத்தைப் பொதுவாகச் சுட்டுகிறது; அதன் எல்லை மொழிபெயர்ப்பில் மேலும் குறுக்கப்படவில்லை.
  alternative: வாசகர்களின் அருள் அனுபவத்தை அல்லது சில்வானுவின் மூலம் அறிவிக்கப்பட்ட நற்செய்தியை மட்டும் சுட்டுகிறது.
  rationale: எழுதுதல், ஊக்குவித்தல், சான்றளித்தல் ஆகிய உடனடிச் சூழல் கடிதத்தின் செய்தியைச் சுட்டுகிறது; எனினும் ταύτην என்பதன் துல்லிய எல்லையை மூலவாக்கியம் வெளிப்படையாக வரையறுக்கவில்லை.
- issue: இறுதி στῆτε என்பதன் வினைமுறை
  choice: ‘உறுதியாக நில்லுங்கள்’ என்ற கட்டளை வினை.
  alternative: சில கையெழுத்துப் பிரதிகளின்படி ‘அதில் நீங்கள் நிலைத்திருக்கிறீர்கள்’ என்ற கூறுநிலை வினை.
  rationale: கொடுக்கப்பட்ட SBLGNT உரை στῆτε என்ற கட்டளை வடிவத்தைக் கொண்டுள்ளதால் முதன்மை உரை அதைத் தொடர்கிறது; வேறுபட்ட வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சில்வானு’ என்பது Σιλουανός என்ற கிரேக்கப் பெயரின் தமிழ் ஒலிபெயர்ப்பு. நீண்ட கிரேக்க வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
