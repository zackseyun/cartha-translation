reference: 1 Peter 5:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: ta
  text: ஆகையால், உங்களிடையே உள்ள மூப்பர்களை, சக மூப்பனும் மேசியாவின்[a] பாடுகளுக்குச் சாட்சியும் வெளிப்படுத்தப்படவிருக்கும் மகிமையில் பங்குபெறுகிறவனுமாகிய நான் வலியுறுத்தி வேண்டுகிறேன்:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின்.” கிரேக்கப் பட்டமான Χριστός என்பதை “மேசியா” என்றும், மரபுவழியாக “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வெளிப்படுத்தப்படப் போகும் மகிமையில் பங்கேற்பவனுமாகிய.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: மூப்பர்களை
  rationale: இச்சபைச் சூழலில் இச்சொல் வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், சபையை வழிநடத்தும் பொறுப்புடையவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது பிற்காலப் பிரிவுசார் பதவிப்பெயரைத் திணிக்காமல் அந்தச் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய பகுதியிலிருந்து வரும் முடிவுறு தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே உள்ள
  rationale: நபர்களின் நடுவில் அல்லது அவர்களுள் இருப்பதை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: παρακαλῶ
  choice: வலியுறுத்திக் கேட்டுக்கொள்கிறேன்
  rationale: இங்கு வெறும் வேண்டுகோளைக் காட்டிலும் தீவிரமான மேய்ப்புப் பணிசார் அறிவுறுத்தல் உள்ளது. இத்தொடர் அதன் அன்பான வேண்டுகோளையும் வலியுறுத்தலையும் ஒன்றாகக் காக்கிறது.
- source_word: συμπρεσβύτερος
  choice: சக மூப்பன்
  rationale: பேசுகிறவர் அதே மூப்பர் பொறுப்பைப் பகிர்கிறார் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μάρτυς
  choice: சாட்சி
  rationale: மேசியாவின் பாடுகளைக் குறித்துச் சான்றளிப்பவரைக் குறிக்கிறது; ‘உயிர்த்தியாகி’ என்ற பிற்காலப் பொருளை இங்கு திணிக்கவில்லை.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: மேசியாவின் பாடுகளுக்கு
  rationale: இந்த இறைவேற்றுமை அமைப்பு மேசியா அனுபவித்த பாடுகளைக் குறிப்பதாக இயல்பாக வாசிக்கப்படுகிறது; ‘பாடுகள்’ என்பது துன்ப அனுபவங்களின் பன்மையைத் தக்கவைக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டத்தின் பொருளைத் தக்கவைக்கிறது. வழக்கமான ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: κοινωνός
  choice: பங்குபெறுகிறவன்
  rationale: வரவிருக்கும் மகிமையில் பங்கு கொள்வதைத் தெளிவாகக் காட்டுகிறது; வணிகப் பொருள் தோன்றக்கூடிய ‘பங்காளி’ என்பதைத் தவிர்க்கிறது.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: வெளிப்படுத்தப்படவிருக்கும் மகிமையில்
  rationale: μέλλω தரும் எதிர்நோக்கையும் ἀποκαλύπτεσθαι என்பதன் செயப்பாட்டு வடிவையும் காக்கிறது; வெளிப்பாட்டின் துல்லியமான காலத்தை விளக்கித் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: Χριστοῦ என்ற கிறிஸ்தியல் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός வெறும் பெயராக மட்டுமல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகவும் செயல்படுகிறது. ஆகவே ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, தமிழ் கிறிஸ்தவ மரபில் நிலைபெற்ற ‘கிறிஸ்து’ மாற்றாகக் கொடுக்கப்படுகிறது.
- issue: μελλούσης ἀποκαλύπτεσθαι என்பதன் எதிர்கால எதிர்நோக்கு
  choice: வெளிப்படுத்தப்படவிருக்கும்
  alternative: வெளிப்படுத்தப்படப் போகும்
  rationale: இந்த வடிவம் வருங்கால வெளிப்பாட்டின் எதிர்நோக்கைக் காக்கிறது; அது எவ்வளவு விரைவில் நிகழும் என்பது குறித்த இறுதிக்கால விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்க்கவில்லை.
- issue: μάρτυς என்பதில் நேரில் கண்டவர் மற்றும் சான்றளிப்பவர் என்ற சாத்தியங்கள்
  choice: சாட்சி
  alternative: சான்றளிப்பவன்
  rationale: ‘சாட்சி’ என்ற சொல் நேரில் கண்டவர் அல்லது அறிந்ததைச் சான்றுரைப்பவர் என்ற இரு தொடர்புடைய சாத்தியங்களையும் திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மேய்ப்புப் பணிசார் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வலியுறுத்திக் கேட்டுக்கொள்கிறேன்’ என்பது παρακαλῶ என்பதிலுள்ள தீவிரத்தையும் அன்பான வேண்டுகோளையும் இணைக்கிறது. கிரேக்க வாக்கியம் அடுத்த வசனத்தின் கட்டளைக்குத் திறந்து நிற்பதால் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
