source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: ta
  text: முன்பு கீழ்ப்படியாமல் இருந்த அந்த ஆவிகள்—நோவாவின் நாட்களில் பேழை ஆயத்தமாக்கப்பட்டுக்கொண்டிருந்தபோது கடவுளுடைய நீடிய பொறுமை காத்திருந்த காலத்தில்—அந்தப் பேழைக்குள் சிலர், அதாவது எட்டுப் பேர்[a], தண்ணீரினூடாகப் பாதுகாப்பாகக் கொண்டுவரப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “எட்டு ஆத்துமாக்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தண்ணீரால் மீட்கப்பட்டார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: கீழ்ப்படியாமல் இருந்த
  rationale: கீழ்ப்படிய மறுத்ததையோ கீழ்ப்படியாமையையோ குறிக்கும் வினையெச்சத்தின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இதை அறிவுசார் அவநம்பிக்கையாக மட்டும் குறுக்கவில்லை.
- source_word: ποτε
  choice: முன்பு
  rationale: முதன்மை உரையாடலுக்கு முந்திய ஒரு காலத்தைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀπεξεδέχετο
  choice: காத்திருந்த
  rationale: இறந்தகாலத்தில் தொடர்ந்த காத்திருப்பைச் சுட்டுகிறது. பொறுமை என்ற கருத்து μακροθυμία-வில் ஏற்கெனவே இருப்பதால் தேவையற்ற மறுகூறலைத் தவிர்க்கிறது.
- source_word: μακροθυμία
  choice: நீடிய பொறுமை
  rationale: தீர்ப்பை உடனடியாக நிறைவேற்றாமல் கடவுள் நீண்ட காலம் பொறுத்திருந்த கருத்தைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: κατασκευαζομένης
  choice: ஆயத்தமாக்கப்பட்டுக்கொண்டிருந்தபோது
  rationale: பேழை கட்டப்பட்டு ஆயத்தப்படுத்தப்பட்டு வந்த தொடர்நிலையைப் பாதுகாக்கிறது; கட்டுமானம் என்ற ஒரே அம்சத்துக்கு பொருளைக் குறுக்கவில்லை.
- source_word: κιβωτοῦ
  choice: பேழை
  rationale: நோவாவின் நிகழ்வில் κιβωτός என்பதற்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: εἰς ἣν
  choice: அந்தப் பேழைக்குள் சென்ற
  rationale: εἰς குறிக்கும் உள்ளே செல்லும் இயக்கத்தைப் பாதுகாக்கிறது; வெறுமனே ‘அதில்’ என்று இடத்தைக் குறிப்பதைக் காட்டிலும் துல்லியமானது.
- source_word: ὀλίγοι
  choice: சிலர்
  rationale: மிகக் குறைந்த எண்ணிக்கையினர் என்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முந்தைய ‘சிலர்’ என்பதை எட்டு பேர் என விளக்கும் கிரேக்கத் தொடரின் செயல்பாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: ψυχαί
  choice: பேர்
  rationale: இங்கு மனிதர்களின் எண்ணிக்கையே குறிப்பிடப்படுகிறது; மனித இயல்பின் கூறுகள் பற்றிய தொழில்நுட்பமான கருத்தைத் தேவையின்றி உருவாக்காமல் நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: διεσώθησαν
  choice: பாதுகாப்பாகக் கொண்டுவரப்பட்டார்கள்
  rationale: ஆபத்தினூடாகப் பத்திரமாகக் கடத்தப்பட்டனர் என்ற διασῴζω-வின் நுணுக்கத்தைப் பாதுகாக்கிறது; ‘மீட்கப்பட்டார்கள்’ என்ற இறையியல் சார்புடைய சொல்லை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: δι’ ὕδατος
  choice: தண்ணீரினூடாக
  rationale: διά + genitive-இன் வழியாக அல்லது மூலம் என்ற உண்மையான இருபொருள் வாய்ப்பில், வெள்ளநீரினூடாகப் பாதுகாக்கப்பட்ட நிகழ்வை இயல்பாகக் காட்டுகிறது; ‘தண்ணீரால்’ என்பது அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: διεσώθησαν δι’ ὕδατος என்பதிலுள்ள இரட்சிப்பு சார்ந்தும் கருவி/வழி சார்ந்தும் உள்ள பதற்றம்
  choice: தண்ணீரினூடாகப் பாதுகாப்பாகக் கொண்டுவரப்பட்டார்கள்
  alternative: தண்ணீரால் மீட்கப்பட்டார்கள்
  rationale: முதன்மை மொழிபெயர்ப்பு வெள்ளத்தின் ஆபத்தினூடாக எட்டுப் பேர் பத்திரமாகக் கடத்தப்பட்ட வரலாற்று நிகழ்வை முன்னிறுத்துகிறது. அதேவேளையில், ‘மீட்கப்பட்டார்கள்’ மற்றும் ‘தண்ணீரால்’ என்ற கிரேக்கத்தால் இயலும் வாசிப்பை அடிக்குறிப்பில் காக்கிறது; அடுத்த வசனத்தின் திருமுழுக்கு உருவகத்தை முன்கூட்டியே ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் அடைக்கவில்லை.
- issue: ψυχαί என்பதன் மனிதவியல் பொருள்
  choice: பேர்
  alternative: ஆத்துமாக்கள்
  rationale: இந்த இடத்தில் கப்பலிலிருந்த மனிதர்களின் எண்ணிக்கையே நோக்கம்; ஆத்துமா-உடல் வேறுபாட்டைப் பற்றிய தொழில்நுட்பக் கூற்றை உரையில் சேர்க்கவில்லை. சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்பை காக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன. ‘கடவுள்’, ‘பேழை’, ‘நீடிய பொறுமை’ ஆகியவை இயல்பும் வேதாகமச் செறிவும் சமநிலைப்படுத்துகின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
