  terminology: “நீடிய பொறுமை,” “பேழை,” “எட்டுப் பேர்,” மற்றும் “ஆத்துமாக்கள்” என்ற அடிக்குறிப்பு மாற்று ஆகியவை பொருத்தமானவை. “அந்தப் பேழைக்குள் சென்ற சிலர்” என்பது εἰς ἣν-ன் இயக்கப் பொருளைத் தருகிறது; ஆயினும் ‘சென்ற’ என்ற செயற்பாட்டை விட, கிரேக்கத்தின் passive διεσώθησαν-ஐ “அதற்குள் ... பாதுகாப்பாகக் கொண்டுவரப்பட்டார்கள்” என இணைப்பது நெருக்கமானது.
