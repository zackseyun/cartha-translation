source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: ta
  text: அவ்வாறே, கணவர்களே, அறிவுக்கேற்ப[a] உங்கள் மனைவியருடன் வாழ்ந்து, வலிமை குறைந்த பாத்திரமான மனைவிக்கு மதிப்பளியுங்கள்; அவர்களும் வாழ்வின் அருளுக்கு உடன் வாரிசுகளாக இருப்பதால், உங்கள் ஜெபங்கள் தடைபடாதபடி அவ்வாறு செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புரிந்துணர்வுடன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: கணவர்களே
  rationale: முந்தைய வசனங்களில் மனைவியருக்குக் கூறப்பட்ட அறிவுரையைத் தொடர்ந்து வரும் குடும்பச் சூழலில், இது பொதுவாக ஆண்களை அல்ல, கணவர்களைக் குறிக்கிறது.
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: முந்தைய அறிவுரைகளோடு உள்ள உரையாடல் தொடர்பையும் ஒப்புமைத் தன்மையையும் காக்கிறது.
- source_word: συνοικοῦντες
  choice: உங்கள் மனைவியருடன் வாழுங்கள்
  rationale: திருமண வாழ்வைப் பகிர்ந்துகொள்வதைக் குறிக்கும் பங்கேற்புவினை, இயல்பான நவீனத் தமிழில் கட்டளையாக வெளிப்படுத்தப்பட்டுள்ளது; சூழலிலிருந்து மனைவியர் தெளிவாக்கப்பட்டுள்ளனர்.
- source_word: κατὰ γνῶσιν
  choice: அறிவுக்கேற்ப
  rationale: அறிந்த புரிதலால் வழிநடத்தப்படும் நடத்தையைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: ἀσθενεστέρῳ
  choice: வலிமை குறைந்த
  rationale: ஒப்பீட்டு வலிமைக்குறைவைத் தக்கவைக்கிறது; ஒழுக்க அல்லது ஆன்மிகத் தாழ்வைச் சேர்க்கவில்லை.
- source_word: σκεύει
  choice: பாத்திரம்
  rationale: மூலத்திலுள்ள உருவகத்தை விளக்கச் சொல்லால் மாற்றாமல் தக்கவைக்கிறது.
- source_word: τῷ γυναικείῳ
  choice: பெண்
  rationale: பெண்பாலுக்குரிய பாத்திரம் என்ற பாலினக் குறிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπονέμοντες τιμήν
  choice: மதிப்பளியுங்கள்
  rationale: கொடுக்க வேண்டிய கனத்தையும் மதிப்பையும் வழங்குதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: συγκληρονόμοις
  choice: உங்களுடன் உடன் வாரிசுகள்
  rationale: மனைவியரும் பகிரப்பட்ட சுதந்தரத்தில் சமமாகப் பங்குபெறுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: χάριτος ζωῆς
  choice: வாழ்வின் அருள்
  rationale: வாழ்வாக அமையும் அருள் அல்லது வாழ்வை அளிக்கும் அருள் என்ற இரு சாத்தியங்களையும் குறுக்காமல் மரபுத்தொடரைத் தக்கவைக்கிறது.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι
  choice: தடைபடாதபடி
  rationale: நோக்கம் அல்லது விளைவு என்ற நுண்ணிய திறந்தநிலையையும் தடைக்குள்ளாகுதல் என்ற செயலப்பாட்டு உணர்வையும் சுருக்கமாகக் காக்கிறது.
- source_word: τὰς προσευχὰς ὑμῶν
  choice: உங்கள் மன்றாட்டுகள்
  rationale: இரண்டாம் நபர் பன்மையையும் ஜெப வேண்டுதல்களின் பன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘வலிமை குறைந்த பாத்திரம்’ என்பதன் பொருள்
  choice: ஒப்பீட்டளவிலான வலிமைக்குறைவு அல்லது பாதிப்புக்குள்ளாகும் நிலையைச் சொல்லும் உருவகமாக அப்படியே வைக்கப்பட்டது; மதிப்பிலோ ஆன்மிக நிலையிலோ தாழ்வு என்று மொழிபெயர்க்கப்படவில்லை.
  alternative: உடலளவில் வலிமை குறைந்தவர்; சமூக ரீதியாக அதிகம் பாதிக்கப்படக்கூடியவர்
  rationale: உடனடி சூழல் பெண்ணுக்கு மதிப்பளிக்கக் கட்டளையிடுவதோடு, அவள் வாழ்வின் அருளுக்கு உடன் வாரிசு என்றும் உறுதிப்படுத்துகிறது. உருவகம் எந்த வகையான வலிமைக்குறைவை மட்டும் குறிக்கிறது என்பதை மூலவாக்கியம் தீர்மானிக்கவில்லை.
- issue: பகிரப்பட்ட சுதந்தரத்தின் தன்மை
  choice: மனைவியர் கணவர்களுடன் வாழ்வின் அருளுக்கு உடன் வாரிசுகள் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நித்திய வாழ்வின் உடன் வாரிசுகள்; கடவுள் அருளும் வாழ்வு என்ற பரந்த கொடையின் உடன் வாரிசுகள்
  rationale: மூலவாக்கியம் பகிரப்பட்ட வாரிசுரிமையைத் தெளிவாக உறுதிப்படுத்துகிறது; ஆனால் ‘வாழ்வின் அருள்’ என்பதை மேலும் குறுகலாக வரையறுக்கவில்லை.
- issue: ὡς καὶ என்பதன் உறவு
  choice: ‘என்பதற்கேற்பவும்’ என்று இணையான இரண்டாவது அடிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களும் உடன் வாரிசுகள் என்பதால்’
  rationale: கிரேக்கத்தில் வெளிப்படையாக இல்லாத காரணவியல் நுணுக்கத்தைச் சேர்க்காமல், மனைவியருக்கு மதிப்பளிப்பதற்குரிய இணையான நிலையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. கிரேக்கப் பங்கேற்புவினை அமைப்பு தமிழில் தெளிவான கட்டளை வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘பாத்திரம்’ மற்றும் ‘வாழ்வின் அருள்’ ஆகிய உருவக/இணைப்புத் தொடர்கள் விளக்கமாகச் சுருக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
