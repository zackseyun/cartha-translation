revisions:
- from: அவ்வாறே, கணவர்களே, அறிவுக்கேற்ப[a] உங்கள் மனைவியருடன் வாழுங்கள். பெண் வலிமை குறைந்த பாத்திரம்[b] என்பதற்கேற்பவும், அவர்களும் வாழ்வின் அருளுக்கு உங்களுடன் உடன் வாரிசுகள்[c] என்பதற்கேற்பவும், அவர்களுக்கு மதிப்பளியுங்கள். உங்கள் மன்றாட்டுகள் தடைபடாதபடி இவ்வாறு செய்யுங்கள்.
  to: அவ்வாறே, கணவர்களே, அறிவுக்கேற்ப[a] உங்கள் மனைவியருடன் வாழ்ந்து, வலிமை குறைந்த பாத்திரமான மனைவிக்கு மதிப்பளியுங்கள்; அவர்களும் வாழ்வின் அருளுக்கு உடன் வாரிசுகளாக இருப்பதால், உங்கள் ஜெபங்கள் தடைபடாதபடி அவ்வாறு செய்யுங்கள்.
  rationale: 'The revised text improves Tamil syntax and removes redundancy, while preserving the Greek metaphor, shared-heir language, and prayer-purpose clause. Footnote anchors b and c must be restored in the main text: b after ‘வலிமை குறைந்த பாத்திரமான மனைவிக்கு’ and c after ‘உடன் வாரிசுகளாக’ (the tool text field cannot reliably display inline markers separately from the footnote set). The causal ‘இருப்பதால்’ is not ideal for the disputed force of ὡς καὶ; a final production text should preferably avoid it by using an appositional construction such as ‘... மதிப்பளியுங்கள்; அவர்களும் வாழ்வின் அருளுக்கு உடன் வாரிசுகள்.’ This retains the non-causal ambiguity more closely.'
