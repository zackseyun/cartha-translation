id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவருடைய கண்கள் நீதிமான்களை நோக்கியிருக்கின்றன; அவருடைய செவிகள் அவர்களுடைய வேண்டுதலுக்குத் திறந்திருக்கின்றன[a]. ஆனால், தீமை செய்கிறவர்களுக்கு எதிராக ஆண்டவருடைய முகம் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவருடைய செவிகள் அவர்களுடைய வேண்டுதலை நோக்கி இருக்கின்றன.’ தெளிவுக்காக ‘அவர்களுடைய வேண்டுதலுக்குத் திறந்திருக்கின்றன’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான வேதவாக்கிய அடிப்படையை அறிமுகப்படுத்தும் காரண இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: ஆண்டவருடைய கண்கள் நீதிமான்கள்மேல் நோக்கமாயிருக்கின்றன
  rationale: ஆண்டவரின் கவனமும் அருள்நோக்கும் நீதிமான்களை நோக்கியிருப்பதைச் சொல்வதோடு, மூலத்தின் உருவகத்தையும் காக்கிறது.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: அவருடைய செவிகள் அவர்களுடைய வேண்டுதலைக் கேட்கத் திறந்திருக்கின்றன
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான ‘அவருடைய செவிகள் அவர்களுடைய வேண்டுதலை நோக்கி’ என்ற அமைப்பின் உட்கருத்தான செவிகொடுத்தலை இயல்பான தமிழில் தெளிவாக்குகிறது; δέησις என்பதன் மன்றாட்டு நுணுக்கத்திற்காக ‘வேண்டுதல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: πρόσωπον δὲ κυρίου
  choice: ஆனால் ... ஆண்டவருடைய முகம்
  rationale: δέ குறிக்கும் முரண்பாட்டையும் πρόσωπον என்ற நேரடி முக உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: தீமை செய்கிறவர்களுக்கு எதிராக ... இருக்கிறது
  rationale: எதிர்ப்பைக் குறிக்கும் சூழ்நிலைப் பொருளைத் தெளிவாகக் காட்டி, செயற்பெயரெச்சத்தின் தொடர்ச்சியான வாய்மொழி வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: கடவுளுடைய கண்கள், செவிகள், முகம் என்னும் மனித உடல்சார் உருவகங்கள்
  choice: உருவகங்களை மொழிபெயர்ப்பில் நேரடியாகப் பாதுகாத்தல்
  alternative: ‘ஆண்டவர் நீதிமான்களைக் கவனித்து, அவர்கள் வேண்டுதலைக் கேட்கிறார்; தீமை செய்கிறவர்களை எதிர்க்கிறார்’ என்று விளக்கிப் பரிமாற்றுதல்
  rationale: சங்கீத மேற்கோளின் இலக்கிய வலிமையும், தெய்வீக அருள்நோக்கு மற்றும் எதிர்ப்பு குறித்த தனிப்பட்ட உருவகமும் நிலைத்திருக்க வேண்டும்; அவற்றை உரைநடைக் கருத்தாக மட்டும் மாற்றுவது மூலத்தின் வடிவத்தை இழக்கச் செய்யும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. ‘ஆண்டவர்’, ‘நீதிமான்கள்’, ‘வேண்டுதல்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்றும் தற்போதைய வாசிப்புக்கு இயல்பானவையுமாக உள்ளன; மூலத்தின் இணைநிலை அமைப்பும் உடல்சார் உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
