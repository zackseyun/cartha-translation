revisions:
- from: ஆனால் சாந்தத்தோடும் பயத்தோடும்[a], நல்ல மனசாட்சியைக் கொண்டவர்களாய் இருங்கள். நீங்கள் எந்தக் காரியத்தில் பழித்துப் பேசப்படுகிறீர்களோ[b], அந்தக் காரியத்தில் மெசியாவில் உங்கள் நல்ல நடத்தையை இகழ்ந்து பேசுகிறவர்கள் வெட்கத்திற்குள்ளாகும்படி இப்படிச் செய்யுங்கள்.[c]
  to: ஆனால், சாந்தத்தோடும் பயத்தோடும்[a], நல்ல மனசாட்சியைக் கொண்டவர்களாய் பதிலளியுங்கள்; அப்போது, நீங்கள் எந்தக் காரியத்தில் பழித்துப் பேசப்படுகிறீர்களோ[b], அதில் மெசியாவில் உள்ள உங்கள் நல்ல நடத்தையை இகழ்ந்து பேசுகிறவர்கள் வெட்கத்திற்குள்ளாவார்கள்.[c]
  rationale: முந்தைய வசனத்தில் உள்ள பதிலளிக்கும் கட்டளையின் தொடர்ச்சியைத் தமிழில் ‘பதிலளியுங்கள்’ என வெளிப்படுத்தி, மூலத்தில் இல்லாத ‘இப்படிச் செய்யுங்கள்’ என்பதை நீக்கினேன். இதனால் சாந்தம், பயம், நல்ல மனசாட்சி ஆகியவை பதிலளிக்கும் முறையைச் சுட்டுகின்றன; பழிப்பவர்களின் வெட்கம் அதன் நோக்க/விளைவாகத் தெளிவாகிறது. அடிக்குறிப்பு குறியீடுகளும் அவற்றின் பொருள்களும் மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
