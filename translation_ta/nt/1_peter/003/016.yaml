  source_fidelity: திருத்தம் தேவை. வரைவில் உள்ள ‘இப்படிச் செய்யுங்கள்’ என்பது கிரேக்கத்தில் இல்லாத ஒரு புதிய கட்டளையைச் சேர்க்கிறது; மேலும் ἵνα-வின் நோக்க/விளைவு உறவைத் தெளிவற்றதாக்குகிறது. முந்தைய வசனத்தின் ‘பதிலளியுங்கள்’ என்ற முதன்மை வினை இவ்வசனத்தில் தொடர்வதால், தமிழில் அதைத் தேவையான அளவு வெளிப்படுத்துவது பாதுகாப்பானது. ‘வெட்கத்திற்குள்ளாவார்கள்’ καταισχυνθῶσιν என்ற செயப்பாட்டு, நோக்கநிலையை இயல்பாகக் காக்கிறது.
