reference: 1 Peter 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: ta
  text: ஆனால், சாந்தத்தோடும் பயத்தோடும்[a], நல்ல மனசாட்சியைக் கொண்டவர்களாய் பதிலளியுங்கள்; அப்போது, நீங்கள் எந்தக் காரியத்தில் பழித்துப் பேசப்படுகிறீர்களோ[b], அதில் மெசியாவில் உள்ள உங்கள் நல்ல நடத்தையை இகழ்ந்து பேசுகிறவர்கள் வெட்கத்திற்குள்ளாவார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாந்தத்தோடும் பயபக்தியோடும்’ அல்லது ‘சாந்தத்தோடும் மரியாதையோடும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீங்கள் எதைப் பற்றிப் பழித்துப் பேசப்படுகிறீர்களோ’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் ‘மெசியாவில்’; பாரம்பரியமாக, ‘கிறிஸ்துவில்.’
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: சாந்தத்தோடும்
  rationale: கடுமையற்ற, தாழ்மையான அணுகுமுறையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: φόβου
  choice: பயத்தோடும்
  rationale: இதன் பொருள் பயம், பயபக்தி, மரியாதை என விரியக்கூடும். யாருக்கான பயம் என்பதை மூலவாக்கியம் குறிப்பிடாததால், அதன் திறந்த தன்மையைப் பாதுகாக்க ‘பயம்’ பயன்படுத்தப்பட்டது.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: நல்ல மனசாட்சியைக் கொண்டவர்களாய் இருங்கள்
  rationale: பங்கேற்புவினை வடிவம் முந்தைய அறிவுறுத்தலோடு தொடர்புடைய தொடர்ச்சியான நிலையாகத் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ἐν ᾧ
  choice: எந்தக் காரியத்தில் ... அந்தக் காரியத்தில்
  rationale: கிரேக்கத்தின் சுருக்கமான தொடர்புச் சொற்றொடரைத் தெளிவுபடுத்துகிறது; குறிக்கப்படும் காரியம் என்ன என்பதைத் தீர்மானிக்கவில்லை.
- source_word: καταλαλεῖσθε
  choice: பழித்துப் பேசப்படுகிறீர்களோ
  rationale: ஒருவருக்கு எதிராக பகைமையோடு அல்லது அவதூறாகப் பேசும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καταισχυνθῶσιν
  choice: வெட்கத்திற்குள்ளாகும்படி
  rationale: இறுதி அல்லது விளைவைச் சுட்டும் ἵνα அமைப்பையும், செயப்பாட்டு வடிவத்தின் வலிமையையும் பாதுகாக்கிறது.
- source_word: ἐπηρεάζοντες
  choice: இகழ்ந்து பேசுகிறவர்கள்
  rationale: இச்சூழலில் நல்ல நடத்தையை எதிர்த்துத் தூற்றுதல் அல்லது பழித்தல் என்ற பகைமையான செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: ἀναστροφήν
  choice: நடத்தையை
  rationale: வாழ்க்கை முறை அல்லது ஒழுக்க நடத்தை என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐν Χριστῷ
  choice: மெசியாவில்
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டது; பாரம்பரிய ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀγαθήν / ἀγαθὴν
  choice: நல்ல
  rationale: மனசாட்சிக்கும் நடத்தைக்கும் பயன்படுத்தப்பட்டுள்ள மூலச்சொல் மீளுருவைத் தமிழிலும் பாதுகாக்கிறது.
theological_decisions:
- issue: φόβου என்பதன் பொருளும் அதன் குறிப்பிடப்படாத நோக்கமும்
  choice: பயம்
  alternative: பயபக்தி; மரியாதை; கடவுளுக்கான பயம்
  rationale: உடனடிச் சூழல் பயத்தின் நோக்கத்தை வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் பதற்றம் பாதுகாக்கப்பட்டது.
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு பட்டப்பெயரின் பொருள் உயிரோடு இருப்பதால் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டது; பரவலான பாரம்பரிய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: ἐν Χριστῷ என்பது நடத்தையோடு கொண்டுள்ள உறவு
  choice: மெசியாவில் உங்கள் நல்ல நடத்தை
  alternative: மெசியாவுக்குள் நீங்கள் வாழும் நல்ல வாழ்க்கைமுறை
  rationale: மெசியாவோடு உள்ள ஒன்றிப்பில் அமையும் நடத்தையை மூலத்தின் சுருக்கமான வடிவத்துக்கு நெருக்கமாகத் தருகிறது; விரிவான விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாந்தம்’, ‘மனசாட்சி’, ‘நடத்தை’ ஆகியவை பரவலாகப் புரியக்கூடிய சொற்கள். மூலத்தின் சுருக்கமான இறையியல் சொற்றொடரான ‘மெசியாவில்’ திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
