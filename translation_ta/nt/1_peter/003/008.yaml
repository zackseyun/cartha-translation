reference: 1 Peter 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: ta
  text: இறுதியாக, நீங்கள் அனைவரும் ஒரே மனப்பான்மை கொண்டவர்களாகவும், பரிவுணர்வுள்ளவர்களாகவும், உடன்பிறப்புகளிடம் அன்புள்ளவர்களாகவும்[a], கனிவான உள்ளமுள்ளவர்களாகவும், தாழ்மையான மனப்பான்மை கொண்டவர்களாகவும்[b] இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் உடன்பிறப்புகளுக்குரிய குடும்ப அன்பைக் குறிக்கிறது; இங்கு அது விசுவாசச் சமூகத்திலுள்ள சகோதரர் சகோதரிகள் அனைவரையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘தாழ்மையான மனப்பான்மை கொண்டவர்களாக’ என்பதற்குப் பதிலாக, ‘மரியாதையுடன் பழகுகிறவர்களாக’ அல்லது ‘நட்பானவர்களாக’ என்று பொருள்படும் சொல் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: இறுதியாக
  rationale: அறிவுரைகளின் முடிவுச் சுருக்கத்தை அறிமுகப்படுத்தும் இயல்பான உரைக்குறியாக இது செயல்படுகிறது; ‘முடிவு’ என்று சொற்சொல்லாக மொழிபெயர்ப்பதைவிடத் தமிழில் ஓட்டம் இயல்பாக உள்ளது.
- source_word: πάντες
  choice: நீங்கள் அனைவரும்
  rationale: முழுச் சபையாரையும் நேரடியாகக் கூட்டாக விளிக்கும் பொருளைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁμόφρονες
  choice: ஒரே மனமுள்ளவர்களாக
  rationale: ஒரே சிந்தனையும் நோக்குநிலையும் கொண்டிருப்பதைக் குறிக்கும் கூட்டுச் சொல்லின் மனம் சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: συμπαθεῖς
  choice: பரிவுணர்வுள்ளவர்களாக
  rationale: பிறருடைய உணர்வுகளோடு இணைந்து உணரும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: φιλάδελφοι
  choice: சகோதர அன்புள்ளவர்களாக
  rationale: விசுவாசச் சமூகத்தினரிடையேயான உடன்பிறப்புக்குரிய குடும்ப அன்பைச் சுட்டும் கிரேக்க உருவகத்தைப் பாதுகாக்கிறது; அதன் உள்ளடக்கும் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: εὔσπλαγχνοι
  choice: கனிவுள்ளவர்களாக
  rationale: உள்ளத்தின் ஆழத்திலிருந்து வரும் இரக்கத்தையும் மென்மையான அன்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; முந்தைய ‘பரிவுணர்வு’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ταπεινόφρονες
  choice: தாழ்மையான மனமுள்ளவர்களாக
  rationale: வெறும் வெளிப்புறத் தாழ்ச்சியல்லாமல் மனப்பான்மையில் தாழ்மையைக் குறிக்கும் கூட்டுச் சொல்லின் நுட்பத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: φιλάδελφοι என்பதில் உள்ள பாலினக் குறியுடைய உடன்பிறப்பு மொழி
  choice: சகோதர அன்புள்ளவர்களாக
  alternative: சகோதர சகோதரிகளைப் போல ஒருவர்மேல் ஒருவர் அன்புள்ளவர்களாக
  rationale: மூலத்தின் குடும்ப உருவகத்தை முதன்மை உரையில் காக்கிறது. இச்சொல் ஆண், பெண் இருபாலரையும் கொண்ட விசுவாசச் சமூகத்தை உள்ளடக்கிப் பயன்படுத்தப்படுவதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: இறுதி பெயரடையின் மூலபாடம்
  choice: ταπεινόφρονες — தாழ்மையான மனமுள்ளவர்களாக
  alternative: φιλόφρονες — மரியாதையுள்ளவர்களாக அல்லது நட்புணர்வுள்ளவர்களாக
  rationale: SBLGNT மூலபாடத்திலுள்ள ταπεινόφρονες முதன்மை உரையில் பின்பற்றப்படுகிறது; குறிப்பிடத்தக்க மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான அறிவுரை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான கிரேக்கப் பெயரடைகள் தமிழில் ‘-உள்ளவர்களாகவும்’ என்ற இணை அமைப்பால் காக்கப்பட்டு, வாக்கியத்தின் முடிவில் சூழலால் உணரப்படும் கட்டளையை ‘இருங்கள்’ என்று வெளிப்படையாகத் தருகிறது. வழங்கப்பட்ட ஆங்கில உரையில் [a] குறி ‘Finally’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு φιλάδελφοι பற்றியது என்பதால் தமிழில் பொருத்தமான ‘சகோதர அன்புள்ளவர்களாகவும்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
