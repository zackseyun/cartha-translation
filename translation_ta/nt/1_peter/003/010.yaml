id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: ta
  text: ஏனெனில், வாழ்வை நேசித்து நல்ல நாட்களைக் காண விரும்புகிறவர், தமது நாவைத் தீமையிலிருந்தும் தமது உதடுகளை வஞ்சகம் பேசுவதிலிருந்தும் காத்துக்கொள்ள வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கபடம் பேசுவதிலிருந்து.” கிரேக்கப் பெயர்ச்சொல் ஏமாற்றுதல், துரோகம், அல்லது சூழ்ச்சித்தனம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: விரும்புகிறவர்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை பொதுவாக எந்த ஒருவரையும் குறிக்கிறது; தமிழில் இயல்பான பொதுமை ஒருமையைப் பேணுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான வேதவாக்கிய ஆதாரத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ζωὴν ἀγαπᾶν
  choice: வாழ்வை நேசித்து
  rationale: சொற்களின் நேரடிப் பொருளையும், நல்ல வாழ்வை விரும்பும் கருத்தையும் இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத உடைமைப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: நல்ல நாட்களைக் காண
  rationale: ‘காண’ என்ற மூலத்தின் உருவகச் சொல்லாட்சியைப் பேணி, நல்ல நாட்களை அனுபவிப்பது என்ற விரிந்த பொருளுக்கும் இடமளிக்கிறது.
- source_word: παυσάτω
  choice: விலக்கிக்கொள்ள வேண்டும்
  rationale: இது கட்டளை வடிவம்; நாவையும் உதடுகளையும் தீய பேச்சிலிருந்து தடுத்து நிறுத்த வேண்டும் என்ற பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: தீமையிலிருந்து தமது நாவை
  rationale: ‘தீமை’ என்ற பரந்த பொருளைப் பேணுகிறது. தமிழின் மரியாதைமிக்க பொதுமை ஒருமைக்கேற்ற ‘தமது’ உடைமைச்சொல் சேர்க்கப்பட்டுள்ளது.
- source_word: χείλη
  choice: தமது உதடுகளை
  rationale: மூலத்தின் பன்மை உடலுறுப்பு உருவகத்தைப் பேணுகிறது; முந்தைய பொதுமை ஒருமையுடன் ‘தமது’ இயைந்து நிற்கிறது.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: வஞ்சகம் பேசுவதிலிருந்து
  rationale: தடுத்தல் அல்லது விலக்குதல் சார்ந்த பொருளை இயல்பாகக் காட்டுகிறது; δόλος என்பதன் ஏமாற்றும் பேச்சு என்ற கருத்தை ‘வஞ்சகம்’ தெளிவாகத் தருகிறது.
theological_decisions:
- issue: பொதுமை ஒருமையும் பாலினக் குறிப்பும்
  choice: ‘விரும்புகிறவர்’ என்றும், ‘தமது நாவை ... தமது உதடுகளை’ என்றும் பாலினம் குறிப்பிடாத மரியாதை ஒருமையைப் பயன்படுத்துதல்
  alternative: ‘விரும்புகிறவன் ... அவன் நாவை ... அவன் உதடுகளை’ என்று ஆண்பால் வடிவைப் பயன்படுத்துதல்
  rationale: கிரேக்க வடிவம் ஒருமையாக இருந்தாலும் எந்த மனிதருக்கும் பொருந்தும் பொதுமைப் பொருள் கொண்டது. தமிழ் மரியாதை ஒருமை அந்த ஒருமையையும் பொதுமையையும் பாலினம் சேர்க்காமல் இயல்பாகப் பேணுகிறது.
- issue: δόλος என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘வஞ்சகம்’
  alternative: ‘கபடம்’ அல்லது ‘சூழ்ச்சி’
  rationale: இச்சொல் ஏமாற்றுதல், கபடம், சூழ்ச்சித்தனம் ஆகிய பொருட்களைத் தாங்கலாம். ‘வஞ்சகம்’ பரந்ததும் புரியக்கூடியதுமாக இருப்பதால் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கிய மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ஒருமை மற்றும் உடலுறுப்பு உருவகங்கள் பேணப்பட்டுள்ளன.
