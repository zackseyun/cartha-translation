- from: ஏனெனில், வாழ்வை நேசித்து நல்ல நாட்களைக் காண விரும்புகிறவர், தீமையிலிருந்து தமது நாவையும் வஞ்சகம் பேசுவதிலிருந்து தமது உதடுகளையும் விலக்கிக்கொள்ள வேண்டும்.[a]
  to: ஏனெனில், வாழ்வை நேசித்து நல்ல நாட்களைக் காண விரும்புகிறவர், தமது நாவைத் தீமையிலிருந்தும் தமது உதடுகளை வஞ்சகம் பேசுவதிலிருந்தும் காத்துக்கொள்ள வேண்டும்.[a]
