review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic singular subject, the desire to love life and see good days, and the imperative force of παυσάτω. It also retains the broad sense of κακόν ('evil') and renders δόλος suitably as 'வஞ்சகம்.'
  naturalness: The wording is understandable, but 'நாவையும் ... உதடுகளையும் விலக்கிக்கொள்ள வேண்டும்' can sound as though one is physically removing the tongue and lips. In modern standard Tamil, 'காத்துக்கொள்ள வேண்டும்' idiomatically expresses restraining them from the specified conduct while retaining the source imagery.
  terminology: ‘வாழ்வை நேசித்து,’ ‘நல்ல நாட்களைக் காண,’ ‘தீமை,’ and ‘வஞ்சகம்’ are appropriate and dignified modern Tamil equivalents. The lexical-alternative footnote is accurate; ‘சூழ்ச்சித்தனம்’ is somewhat abstract here but remains valid as a possible semantic range description.
  issues:
  - severity: low
    issue: The verb ‘விலக்கிக்கொள்ள’ is less idiomatic with ‘நாவு’ and ‘உதடுகள்.’
    rationale: It risks a physical-removal reading, whereas the Greek imperative calls for refraining/restraint. ‘காத்துக்கொள்ள’ communicates the required restraint naturally without narrowing the meaning.
