  revised_text: அதுபோலவே, மனைவிகளே, உங்கள் சொந்தக் கணவர்களுக்குக் கீழ்ப்பட்டிருங்கள்; அப்பொழுது, அவர்களில் சிலர் வார்த்தைக்குக் கீழ்ப்படியாதவர்களாக இருந்தாலும் கூட[a], தங்கள் மனைவிகளின் நடத்தையால், ஒரு வார்த்தையும் இல்லாமலே வென்றெடுக்கப்படுவார்கள்.
