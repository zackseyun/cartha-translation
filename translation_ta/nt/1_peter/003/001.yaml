reference: 1 Peter 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: ta
  text: அதுபோலவே, மனைவிகளே, உங்கள் சொந்தக் கணவர்களுக்குக் கீழ்ப்பட்டிருங்கள்; அப்பொழுது, அவர்களில் சிலர் வார்த்தைக்குக் கீழ்ப்படியாதவர்களாக இருந்தாலும் கூட[a], தங்கள் மனைவிகளின் நடத்தையால், ஒரு வார்த்தையும் இல்லாமலே வென்றெடுக்கப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செய்திக்குக் கீழ்ப்படியாதவர்களாக இருந்தாலும்.” அதாவது, அவர்கள் நற்செய்தியின் வார்த்தையை ஏற்க மறுக்கிறார்கள்.
    reason: ἀπειθέω மற்றும் λόγος ஆகிய சொற்களின் சூழல்சார் மாற்றுப் பொருளை விளக்கி, நம்பாமை–கீழ்ப்படியாமை நுட்பத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Ὁμοίως
  choice: அதுபோலவே
  rationale: முந்தைய குடும்ப உறவு அறிவுரையுடன் இவ்வறிவுரையை இணைக்கும் தொடர்புச் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: γυναῖκες
  choice: மனைவிகளே
  rationale: τοῖς ἰδίοις ἀνδράσιν என்ற கணவர்களைக் குறிக்கும் தொடரால், பொதுவான ‘பெண்கள்’ என்பதற்குப் பதிலாக உறவுமுறைப் பொருளான ‘மனைவிகள்’ தேவைப்படுகிறது.
- source_word: ὑποτασσόμεναι
  choice: கீழ்ப்பட்டிருங்கள்
  rationale: கிரேக்கத்தில் இது பங்கேற்புவினை வடிவில் இருந்தாலும் அறிவுறுத்தலின் கட்டளைப் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘கீழ்ப்படியுங்கள்’ என்று மொழிபெயர்த்து முழுமையான கீழ்ப்படிதலைச் சேர்க்கவில்லை.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: உங்கள் சொந்தக் கணவர்களுக்கு
  rationale: ἰδίοις தரும் ‘சொந்த’ என்ற வலியுறுத்தலையும், இச்சூழலில் ἀνήρ தரும் ‘கணவர்’ என்ற பொருளையும் காக்கிறது.
- source_word: ἵνα
  choice: இதனால்
  rationale: தொடர்ந்து வரும் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; இரண்டிற்குமிடையிலான நுட்பமான தெளிவின்மையைத் தீர்மானித்துவிடவில்லை.
- source_word: καὶ εἴ τινες
  choice: அவர்களில் சிலர் ... இருந்தாலும்
  rationale: καὶ εἴ தரும் விட்டுக்கொடுப்பு வலிமையை ‘இருந்தாலும்’ என்பதும், τινες என்பதை ‘சிலர்’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: வார்த்தைக்குக் கீழ்ப்படியாதவர்களாக
  rationale: ἀπειθέω என்பதில் உள்ள நம்பாமை–கீழ்ப்படியாமை சார்ந்த பதற்றத்தை காக்கிறது; ‘வார்த்தை’ நற்செய்தியைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: தங்கள் மனைவிகளின் நடத்தையின் மூலம்
  rationale: ἀναστροφή என்பதன் வாழ்க்கைமுறை அல்லது நடத்தை என்ற பொருளைச் சுருக்கமாகத் தருகிறது; சூழலுக்கேற்ற உறவுமுறை குறிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄνευ λόγου
  choice: ஒரு வார்த்தையும் இல்லாமலே
  rationale: முன்னர் வரும் ‘வார்த்தை’ என்பதுடனான சொல்லாட்சித் தொடர்பைக் காத்து, மனைவிகளின் வாய்மொழி வாதமின்றி என்ற கருத்தை மிகையாக விரிக்காமல் தருகிறது.
- source_word: κερδηθήσονται
  choice: வென்றெடுக்கப்படுவார்கள்
  rationale: κερδαίνω என்பதன் ‘ஆதாயமாகப் பெறுதல்/வெல்லுதல்’ உருவகத்தை, மனிதர்கள் மனமாற்றத்திற்குக் கொண்டுவரப்படும் இச்சூழலில் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: குடும்ப அறிவுறுத்தலில் ὑποτασσόμεναι என்பதன் இயல்பு
  choice: ‘கீழ்ப்பட்டிருங்கள்’ என்று மொழிபெயர்த்து உறவுசார் ஒழுங்கை மட்டும் வெளிப்படுத்துதல்
  alternative: ‘முழுமையாகக் கீழ்ப்படியுங்கள்’ அல்லது ‘பணிந்திருங்கள்’
  rationale: இவ்வசனம் உறவுசார் கீழ்ப்படிதலைக் கூறுகிறது; ஆனால் தாழ்ந்த இயல்பு, கட்டுப்பாடற்ற அதிகாரம் அல்லது முழுமையான கீழ்ப்படிதல் ஆகியவற்றைச் சொல்லவில்லை. ஆகவே மூலத்தில் இல்லாத கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: ἀπειθοῦσιν τῷ λόγῳ என்பதில் நம்பாமையும் கீழ்ப்படியாமையும்
  choice: ‘வார்த்தைக்குக் கீழ்ப்படியாதவர்களாக’ என்று முதன்மை உரையில் வைத்து, நற்செய்திச் செய்தியை மறுப்பது என்ற பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘நற்செய்தியை நம்பாதவர்களாக’
  rationale: கிரேக்க வினை நம்பாமை மற்றும் கீழ்ப்படியாமை ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்க முடியும். முதன்மை மொழிபெயர்ப்பு ஒழுக்க–சித்த வலிமையைக் காக்கிறது; அடிக்குறிப்பு சூழலின் நற்செய்திப் பொருளைத் தெளிவுபடுத்துகிறது.
- issue: κερδηθήσονται குறிப்பிடும் முடிவு
  choice: ‘வென்றெடுக்கப்படுவார்கள்’ என்ற உருவக மொழியை அப்படியே வைத்தல்
  alternative: ‘மனந்திரும்புவார்கள்’ அல்லது ‘இரட்சிக்கப்படுவார்கள்’
  rationale: மூலம் முடிவை நேரடியாக மனந்திரும்புதல் அல்லது இரட்சிப்பு என்ற இறையியல் சொல்லால் வரையறுக்காமல் ‘வெல்லப்படுதல்/பெறப்படுதல்’ என்ற உருவகத்தைப் பயன்படுத்துகிறது; மொழிபெயர்ப்பும் அதே திறந்த தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அதுபோலவே’, ‘சொந்தக் கணவர்கள்’, ‘வார்த்தை’, ‘வென்றெடுக்கப்படுவார்கள்’ ஆகியவை மூலத்தின் தொடர்பு, வலியுறுத்தல் மற்றும் உருவகத்தைப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
