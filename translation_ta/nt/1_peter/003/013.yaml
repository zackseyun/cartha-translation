  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: ta
  text: 'மேலும், நீங்கள் நன்மைக்காக ஆர்வமுள்ளவர்களாக ஆனால், உங்களுக்குத் தீங்கு விளைவிப்பவன் யார்?[a]


    [a] அல்லது, “நல்லதற்காக ஆவலுள்ளவர்களாக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நல்லதற்காக ஆவலுள்ளவர்களாக.”
    reason: ζηλωταὶ τοῦ ἀγαθοῦ என்பதிலுள்ள ζηλωταίக்கு “ஆர்வமுள்ளவர்கள்” என்பதற்குப் பதிலாக நெருக்கமான சொற்பொருள் மாற்றாக “ஆவலுள்ளவர்கள்” வழங்கப்படுகிறது; τοῦ ἀγαθοῦ என்பதன் பரந்த “நல்லது/நன்மை” என்ற குறிப்பும் காக்கப்படுகிறது.
lexical_decisions:
- source_word: Καὶ
  choice: மேலும்
  rationale: முந்தைய அறிவுரையுடன் வசனத்தை இணைக்கும் நடுநிலையான தொடர்ச்சிச் சொல்லாக இது இயல்பாக உள்ளது.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: உங்களுக்குத் தீங்கு செய்பவன் யார்?
  rationale: வருங்கால நோக்குடைய பெயரெச்சத் தொடரையும் வினாவியல் வலிமையையும் இயல்பான தமிழில் காக்கிறது; ‘தீங்கு’ என்பது உடல்சார் காயத்தையும் பொதுவான துன்புறுத்தலையும் உள்ளடக்கக்கூடியது.
- source_word: ἐὰν
  choice: ஆகினால்
  rationale: நிபந்தனையைத் தெளிவாகக் காட்டுகிறது; γένησθε என்பதிலுள்ள ‘ஆகுதல்’ என்ற பொருளுடனும் இணைகிறது.
- source_word: τοῦ ἀγαθοῦ
  choice: நன்மையின் மீது
  rationale: நடுநிலைப் பெயரடை குறிக்கும் ‘நல்லது/நன்மை’ என்ற பொதுவான கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ζηλωταὶ
  choice: தீவிர ஆர்வமுள்ளவர்களாக
  rationale: ζηλωτής குறிக்கும் சாதாரண விருப்பத்தைவிட வலுவான ஊக்கத்தையும் அர்ப்பணிப்பையும் காட்டுகிறது; தமிழில் வேறு பொருள் தரக்கூடிய ‘வைராக்கியம்’ தவிர்க்கப்படுகிறது.
- source_word: γένησθε
  choice: ஆகினால்
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ என்ற மாற்றநிலைக் கருத்தை வெறும் ‘இருந்தால்’ என்று சமப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: நீதிக்காகத் துன்பப்படுவதுடன் இந்த வினாவின் தொடர்பு
  choice: தீங்கு நேரிடவே முடியாது என்ற முழுமையான வாக்குறுதியாக மாற்றாமல், பொதுவான வினாவியல் உறுதிப்பாடாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: விசுவாசிகளுக்கு யாராலும் உண்மையில் எந்தத் தீங்கும் செய்ய முடியாது என்று வெளிப்படையாகக் கூறுதல்.
  rationale: அடுத்த வசனங்கள் நன்மை செய்தாலும் துன்பம் நேரலாம் என்பதை ஒப்புக்கொள்கின்றன. ஆகவே மூலத்தின் வினாவியல் வடிவமும் அதன் இறையியல் பதற்றமும் அப்படியே காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டது. பன்மை ‘நீங்கள்’ காக்கப்பட்டது; வினாவியல் வடிவம் மென்மைப்படுத்தப்படவில்லை.
