  rationale: πτόησις குறிக்கக்கூடிய பயமுறுத்தும் காரணி அல்லது திகிலைச் சூழலுக்கேற்ற தமிழில் தருகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு காக்கிறது.
theological_decisions:
- issue: கிறிஸ்தவ மனைவிகளுக்கான முன்மாதிரியாக சாராளின் கீழ்ப்படிதல்
  choice: ὑπήκουσεν என்பதற்கு நேரடியாக ‘கீழ்ப்படிந்து’ என்று மொழிபெயர்த்து, சாராளின் நடத்தையை முன்மாதிரியாக மட்டும் உரை கூறும் அளவில் வைத்திருக்கிறது.
  alternative: நவீன வாசகர்களுக்காக வலிமையைக் குறைத்து ‘இணங்கி நடந்தாள்’ என்று மொழிபெயர்த்தல்.
  rationale: பண்பாட்டு அல்லது கோட்பாட்டுக் காரணத்தால் கிரேக்க வினையின் பொருளை மெலிவாக்கக் கூடாது; அதேவேளை இந்த வசனத்தைத் தாண்டிய முழுமையான திருமணக் கோட்பாட்டையும் மொழிபெயர்ப்பில் புகுத்தக் கூடாது.
- issue: ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι என்ற பங்கேற்பு வினைகளின் தொடர்பு
  choice: ‘நன்மை செய்து … அஞ்சாமல் இருந்தால்’ என்று நிபந்தனை நுட்பத்துடன் வெளிப்படுத்தப்பட்டுள்ளது.
  alternative: ‘நன்மை செய்துகொண்டும் … அஞ்சாமலும்’ என்று விளக்கநிலை அல்லது உடனிகழ்ச்சி முறையில் தருதல்.
  rationale: இவை வாசகர்கள் சாராளின் பிள்ளைகளாகத் தங்களை வெளிப்படுத்தும் நடத்தையைச் சுட்டுகின்றன; சூழலில் உள்ள நடைமுறை நிபந்தனை நுட்பத்தைத் தமிழ் வாக்கிய அமைப்பு தெளிவுபடுத்துகிறது, ஆனால் அதை கோட்பாட்டு நிபந்தனையாக மிகைப்படுத்தவில்லை.
- issue: κύριον என்பது தெய்வீகப் பட்டமா, மனிதருக்கான மரியாதைச் சொல்லா
  choice: மனிதருக்கான மரியாதைச் சொல்லாக ‘தலைவர்’ என்று தரப்பட்டுள்ளது.
  alternative: ‘ஆண்டவர்’ அல்லது ‘எஜமானர்’.
  rationale: இங்கு சொல் ஆபிரகாமைக் குறிக்கிறது; தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து, மரியாதைத் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் ஒப்புமை, குடும்ப உருவகம், விளைவுநிலை, நிபந்தனை நுட்பம் ஆகியவை இயல்பான தமிழ் தொடரமைப்பில் காக்கப்பட்டுள்ளன.
