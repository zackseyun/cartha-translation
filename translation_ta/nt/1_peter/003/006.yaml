base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: ta
  text: சாராள் ஆபிரகாமுக்குக் கீழ்ப்படிந்து, அவரை “எஜமான்” என்று அழைத்ததுபோல, நீங்கள் நன்மை செய்து, எந்த அச்சுறுத்தலுக்கும்[a] அஞ்சாமல் இருந்தால், அவளுடைய பிள்ளைகளாக ஆகியிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்தத் திகிலுக்கும்” அல்லது “பயமுறுத்தும் எதற்கும்.”
    reason: πτόησις என்பது திகில், அச்சம், அல்லது பயத்தை உண்டாக்கும் எதையும் குறிக்கலாம்.
lexical_decisions:
