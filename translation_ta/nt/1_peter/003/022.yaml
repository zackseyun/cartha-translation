source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: ta
  text: அவர் பரலோகத்திற்குச் சென்று, கடவுளின் வலப்பக்கத்தில் இருக்கிறார்; வானதூதர்களும் அதிகாரங்களும் வல்லமைகளும் அவருக்குக் கீழ்ப்படுத்தப்பட்டுள்ளன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இயேசு கிறிஸ்துவைக் குறிக்கும் தொடர்புப்பெயர். தனி வசனமாக இயல்பாக வாசிக்கத் தமிழில் ‘அவர்’ என வழங்கப்படுகிறது; புதிய வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: கடவுளின் வலப்பக்கத்தில்
  rationale: உயர்த்தப்பட்ட நிலை மற்றும் பெருமையைக் கொண்ட வேதாகம இடவியல் உருவகத்தை விளக்கவுரையாகக் குறுக்காமல் அப்படியே காக்கிறது.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: பரலோகத்திற்குச் சென்று
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் முன்னிகழ்ந்த செயலை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது. εἰς-இன் திசைநோக்கிய பொருளை ‘-க்கு’ வெளிப்படுத்துகிறது.
- source_word: ὑποταγέντων αὐτῷ
  choice: அவருக்குக் கீழ்ப்படுத்தப்பட்டுள்ளன
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் அவருக்கு உட்பட்ட நிலையின் விளைவையும் தெளிவாகக் காக்கிறது.
- source_word: ἀγγέλων
  choice: வானதூதர்கள்
  rationale: அண்டம்சார் அதிகாரங்களின் பட்டியல் என்பதால் மனிதத் தூதர்கள் அல்ல, விண்ணுலகத் தூதர்களே இங்கு குறிக்கப்படுகின்றனர்.
- source_word: ἐξουσιῶν
  choice: அதிகாரங்கள்
  rationale: ἐξουσίαι என்பதன் வழக்கமான வேறுபட்ட பொருளைத் தக்கவைத்து, அடுத்துள்ள δυνάμεις என்பதோடு ஒன்றாக்காமல் காட்டுகிறது.
- source_word: δυνάμεων
  choice: வல்லமைகள்
  rationale: அண்டம்சார் சக்திகளைக் குறிக்கும் பெயராகவும் ‘அதிகாரங்கள்’ என்பதிலிருந்து வேறுபட்ட பட்டியல் உறுப்பாகவும் அமைகிறது.
theological_decisions:
- issue: கிறிஸ்து கடவுளின் வலப்பக்கத்தில் இருப்பதன் இயல்பு
  choice: ‘கடவுளின் வலப்பக்கத்தில்’ என்ற வேதாகம இடவியல்-உறவியல் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘கடவுளுக்கு அருகிலுள்ள மிக உயர்ந்த பெருமைக்குரிய இடத்தில்’ என்று விளக்குதல்
  rationale: மூலத்தின் கிறிஸ்தியல் முக்கியத்துவமுள்ள உருவகத்தை வெறும் மரியாதை நிலை என்று சுருக்காமல் காக்கிறது.
- issue: ‘வானதூதர்கள், அதிகாரங்கள், வல்லமைகள்’ என்போரின் அடையாளம்
  choice: அவர்களின் ஒழுக்கத் தன்மையை வரையறுக்காமல் விண்ணுலக/அண்டம்சார் வகைகளாக மொழிபெயர்த்தல்
  alternative: நல்ல வானதூதர்கள் மட்டும் அல்லது பகைமையான ஆவிக்குரிய சக்திகள் மட்டும் என்று குறிப்பிடுதல்
  rationale: கிரேக்கப் பட்டியல் இவர்கள் நல்லவர்களா தீயவர்களா கலந்தவர்களா என்பதை வெளிப்படையாக வகைப்படுத்தவில்லை; அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் முதன்மை வினை ‘இருக்கிறார்’ என்பதால் அதனைத் தெளிவாக வைத்தும், πορευθείς என்பதை ‘சென்று’ என்ற வினையெச்சமாகவும் வழங்குகிறது. ‘பரலோகத்திற்குச்’ என்பது εἰς οὐρανόν என்பதன் இயக்கத் திசையை போதுமான அளவு காட்டுவதால் அடிக்குறிப்பு தேவையில்லை.
