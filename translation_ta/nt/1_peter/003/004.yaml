language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: ta
  text: மாறாக, உங்கள் அலங்காரம் இதயத்தில் மறைந்திருக்கும் நபராக[a] இருக்கட்டும்—அதாவது, சாந்தமும் அமைதியுமுள்ள[c] ஆவியின் அழியாத அழகாக[b] இருக்கட்டும். இதுவே கடவுளுக்கு முன்பாக மிகவும் மதிப்புமிக்கது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, ‘இதயத்தின் மறைவான மனிதர்.’ இங்குள்ள கிரேக்கச் சொல் ஆணை மட்டும் குறிக்காமல் பொதுவாக நபரையோ உள்ளான சுயத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘சாந்தமும் அமைதியுமுள்ள ஆவியின் அழியாததில்.’ முந்தைய வசனத்தில் கூறப்பட்ட வெளிப்புற அலங்காரத்துடனான வேறுபாட்டைக் கருத்தில் கொண்டு ‘அழகு’ என்ற சொல் தமிழில் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘அமைதியுள்ள’ என்பது பேசாமல் இருப்பதை அவசியமாகக் குறிக்காது; கலக்கமற்ற, சமாதானமான மனப்பாங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: இதயத்தில் மறைந்திருக்கும் மனிதர்
  rationale: ἄνθρωπος இங்கு ஆணைக் குறிப்பதல்ல; உள்ளார்ந்த மனிதத் தன்மையையோ உள்ளான சுயத்தையையோ குறிக்கிறது. ‘மனிதர்’ என்பது பாலினத் தனிச்சிறப்பைச் சேர்க்காமல் மூலத்தின் மனிதவியல் உருவகத்தைத் தக்கவைக்கிறது; κρυπτός என்பதற்கு ‘மறைந்திருக்கும்’ என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: அழியாத அழகாக
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் விடுபட்ட சுருக்கமான அமைப்பு உள்ளது. முந்தைய வசனத்தின் வெளிப்புற அலங்காரத்துடனான எதிர்மறை ஒப்பீட்டின் அடிப்படையில் ‘அழகு’ சேர்க்கப்படுகிறது; ‘அழியாத’ என்பது ἀφθάρτῳ என்பதன் மையப் பொருளைத் தக்கவைக்கிறது.
- source_word: πραέως
  choice: சாந்தமுள்ள
  rationale: πραΰς குறிக்கும் மென்மையான, கடுமையற்ற பண்பை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἡσυχίου
  choice: அமைதியுள்ள
  rationale: இது பேசாமையை மட்டும் அல்ல, கலக்கமற்ற சமாதானமான மனப்பாங்கைக் குறிக்கிறது. ‘அமைதியுள்ள’ என்பது அந்த விரிந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πνεύματος
  choice: ஆவி
  rationale: ‘ஆவி’ மூலச்சொல்லின் மனிதவியல் மொழியைத் தக்கவைக்கிறது; ‘மனப்பாங்கு’ என்பது சாத்தியமான விளக்கம் என்றாலும் அதிக விளக்கவுரைத்தன்மை கொண்டது.
- source_word: ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές
  choice: இதுவே கடவுளுக்கு முன்பாக மிகவும் மதிப்புமிக்கது
  rationale: ὅ என்பது முன்சொல்லப்பட்ட உள்ளார்ந்த பண்பு முழுவதையும் சுட்டக்கூடும் என்பதால் ‘இதுவே’ அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது. ἐνώπιον என்பதற்கு ‘முன்பாக’ என்றும் πολυτελές என்பதற்கு அதன் உயர்ந்த மதிப்பை வெளிப்படுத்த ‘மிகவும் மதிப்புமிக்கது’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாலினச் சூழலில் ἄνθρωπος என்பதன் பொருள்
  choice: ‘மனிதர்’ என்று பொதுப்பாலில் மொழிபெயர்த்து, உள்ளான சுயத்தைக் குறிக்கச் செய்தல்
  alternative: ‘ஆண்’ அல்லது ‘உள்ளான நபர்’
  rationale: இவ்வசனம் பெண்களை நோக்கிப் பேசினாலும், ἄνθρωπος இங்கு ஆண் பாலைக் குறிக்கவில்லை. ‘மனிதர்’ என்பது தேவையற்ற ஆண்பால் குறிப்பைத் தவிர்த்து, மூலத்தின் மனிதவியல் சொல்லாட்சியையும் பாதுகாக்கிறது.
- issue: ἀφθάρτῳ உடன் விடுபட்ட பெயர்ச்சொல்லை நிரப்புதல்
  choice: முந்தைய வசனத்தின் அலங்கார எதிர்மறை ஒப்பீட்டின் அடிப்படையில் ‘அழகு’ என்பதைச் சேர்த்தல்
  alternative: ‘அழியாத தன்மை’ அல்லது பெயர்ச்சொல் சேர்க்காமல் ‘அழியாததில்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்க அமைப்பு திட்டமிட்ட சுருக்கத்தைக் கொண்டது. தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் அமைய ‘அழகு’ சேர்க்கப்படுகிறது; அடிக்குறிப்பு மூலத்தின் சொற்படி அமைப்பை வெளிப்படையாகக் குறிப்பிடுகிறது.
- issue: ‘உங்கள் அலங்காரம் ... இருக்கட்டும்’ என்ற தொடரை வெளிப்படுத்துதல்
  choice: முந்தைய வசனத்திலிருந்து தொடரும் இலக்கணச் சார்பைத் தமிழில் வெளிப்படையாகக் கூறுதல்
  alternative: ‘மாறாக, இதயத்தில் மறைந்திருக்கும் மனிதர்...’ என்று வாக்கியத் துணுக்காகவே விடுதல்
  rationale: கிரேக்கத்தில் வசனம் 3-இன் ‘அலங்காரம்’ குறித்த கட்டளையோடு தொடர்கிறது. தமிழில் தனி வசனமாக வாசிக்கும்போது தெளிவாக இருக்க, அந்த மறைபொருள் வெளிப்படுத்தப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாந்தம்,’ ‘ஆவி,’ ‘கடவுளுக்கு முன்பாக’ போன்ற சொற்கள் வேதாகமத் தொனியைத் தக்கவைத்தாலும் பழமையான அல்லது சமயப்பிரிவு சார்ந்த தனிச்சொல்லாட்சியைத் தவிர்க்கின்றன. வசனம் தனியாகவும் இயல்பாக வாசிக்க, முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் ‘உங்கள் அலங்காரம்’ வெளிப்படுத்தப்பட்டுள்ளது.
