id: 1PE.3.11
reference: 1 Peter 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: ta
  text: ஆனால், அவன் தீமையை விட்டு விலகட்டும்; நன்மை செய்யட்டும்; சமாதானத்தைத் தேடட்டும்; அதைப் பின்தொடரட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவர் தீமையை விட்டு விலகட்டும்; நன்மை செய்யட்டும்; சமாதானத்தைத் தேடட்டும்; அதைப் பின்தொடரட்டும்.” கிரேக்கத்தில் மூன்றாம் நபர் ஒருமை கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இவை இங்கு பொதுவான, பிரதிநிதித்துவப் பொருளில் வருகின்றன.
    reason: «அவன்» என்பதற்கான பொதுப்பொருள் மாற்றை வழங்கி, மூலக் கிரேக்க வடிவம் ஆண்பாலை நேரடியாகக் குறிக்கிறது என்ற தவறான விளக்கத்தைச் சரிசெய்கிறது.
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: விலகி ... செய்யட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தையும், தீமையிலிருந்து திசைமாறிச் செல்லும் ἐκκλίνω என்பதன் வலிமையையும் ‘விலகி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றிலிருந்து தொடரும் மென்மையான முரண்பாட்டைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπὸ κακοῦ
  choice: தீமையைவிட்டு
  rationale: κακόν இங்கு துன்பம் அல்லது தீங்கு என்பதைக் காட்டிலும் ஒழுக்கநெறி சார்ந்த தீமையைக் குறிக்கிறது; அடுத்து வரும் ‘நன்மை’ என்பதற்கும் இது நேரான எதிரிணை.
- source_word: ποιησάτω ἀγαθόν
  choice: நன்மை செய்யட்டும்
  rationale: செயலில் வெளிப்படும் ஒழுக்கநன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ζητησάτω
  choice: தேடி
  rationale: ζητέω என்பதன் ‘தேடுதல்’ என்ற அடிப்படைப் பொருளைப் பேணி, அடுத்து வரும் வலிமையான διώκω வினையிலிருந்து வேறுபடுத்துகிறது.
- source_word: εἰρήνην
  choice: சமாதானத்தை
  rationale: εἰρήνη என்பதன் விரிவான வேதாகமப் பொருளைத் தாங்கக்கூடிய, வழக்கமான மற்றும் கண்ணியமான தமிழ்ச் சொல்.
- source_word: διωξάτω αὐτήν
  choice: அதை விடாமல் பின்தொடரட்டும்
  rationale: διώκω குறிக்கும் தீவிரமான, தொடர்ச்சியான பின்தொடர்தலை ‘விடாமல்’ தெளிவுபடுத்துகிறது; ‘அதை’ என்பது சமாதானத்தையே சுட்டுகிறது.
- source_word: 3rd person singular imperatives across the verse
  choice: அவன் ... செய்யட்டும்; ... பின்தொடரட்டும்
  rationale: மேற்கோளின் மூன்றாம் நபர் ஒருமை அமைப்பையும் அறிவுறுத்தல் தொனியையும் நேரடியான இரண்டாம் நபராக மாற்றாமல் பேணுகிறது.
theological_decisions:
- issue: அறிவுறுத்தல் மேற்கோளில் பிரதிநிதித்துவ ஒருமை ஆண்பால்
  choice: முதன்மை உரையில் ‘அவன்’
  alternative: ‘ஒருவர்’ அல்லது பன்மைப் பொதுப்பெயர்
  rationale: முந்தைய மேற்கோள் சூழலில் உள்ள ஒருமை ஆண்பால் குறிப்பைத் தொடர்ந்து, மூலத்தின் வடிவத்தைப் பேணுகிறது; அதேவேளையில் இது ஆண்களுக்கு மட்டும் வரையறுக்கப்படாத பிரதிநிதித்துவப் பயன்பாடு என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை. ‘தேடி / விடாமல் பின்தொடரட்டும்’ என்ற வினை முன்னேற்றம் மூலத்தின் சொல்லாட்சிச் செறிவையும் தீவிரத்தையும் பேணுகிறது.
