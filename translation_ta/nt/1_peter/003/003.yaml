id: 1PE.3.3
reference: 1 Peter 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: ta
  text: உங்கள் அலங்காரம் வெளிப்புறமானதாக—தலைமுடியைப் பின்னுதல், பொன் நகைகளை அணிதல், அல்லது ஆடைகளை உடுத்துதல்—இருக்க வேண்டாம்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: உங்கள்
  rationale: முந்தைய வசனத்தில் நேரடியாகப் பேசப்படும் பெண்கள் அல்லது மனைவிகளைக் குறிக்கும் பன்மை உடைமைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔστω οὐχ
  choice: இருக்க வேண்டாம்
  rationale: εἰμί என்பதன் மூன்றாம் நபர் நிகழ்காலக் கட்டளை வடிவத்தையும் அதை மறுக்கும் οὐχ என்பதையும், அறிவுறுத்தல் வலிமை குன்றாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: வெளிப்புற அலங்காரம்
  rationale: κόσμος இங்கு ‘உலகம்’ என்று அல்ல, ‘அலங்காரம்’ அல்லது ‘ஒழுங்குபடுத்தல்’ என்று பொருள்படுகிறது; ἔξωθεν அதை வெளிப்புறமானது எனக் குறிப்பிடுகிறது.
- source_word: ἐμπλοκῆς τριχῶν
  choice: தலைமுடியைப் பின்னுவது
  rationale: முடியைப் பின்னும் செயலைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: περιθέσεως χρυσίων
  choice: பொன் நகைகளை அணிவது
  rationale: περίθεσις அணிதல் அல்லது சுற்றிப் போட்டுக்கொள்ளுதலைக் குறிக்கிறது; χρυσίων இங்கு பொன்னால் ஆன அலங்காரப் பொருட்களைச் சுட்டுகிறது.
- source_word: ἢ ἐνδύσεως ἱματίων
  choice: ஆடைகளை உடுத்துவது
  rationale: ἢ என்பதன் மாற்றுப் பட்டியல் உறவையும், ἐνδύσεως ἱματίων என்பதன் நேரடியான ‘ஆடைகளை உடுத்துதல்’ என்ற பொருளையும் காக்கிறது.
theological_decisions:
- issue: பேதுரு வெளிப்புற ஒப்பனை, நகை, ஆடை ஆகியவற்றை முற்றிலும் தடைசெய்கிறாரா, அல்லது உள்ளார்ந்த பண்புக்கு அவற்றைக் கீழ்ப்படுத்துகிறாரா?
  choice: மூலத்தின் மறுப்புக் கட்டளையை முதன்மை உரையில் காத்து, அடுத்த வசனத்தோடு உள்ள ஒப்பீட்டு அல்லது முன்னுரிமைப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: தலைமுடி பின்னுதல், பொன் நகை அணிதல், ஆடை உடுத்துதல் ஆகிய அனைத்துக்கும் முழுமையான தடை என்று மொழிபெயர்த்தல்
  rationale: வசனம் 4 வெளிப்புற அலங்காரத்துக்கு மாறாக உள்ளத்தின் மறைவான மனிதரை முன்னிறுத்துகிறது. மேலும் ‘ஆடைகளை உடுத்துதல்’ என்பதையும் பட்டியல் உள்ளடக்குவதால் இதைச் சொற்பொருளில் முழுமையான தடையாகப் புரிவது மிகைப்படுத்தலாகும். இருப்பினும் கிரேக்கத்தில் ‘மட்டும்’ என்ற சொல் வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்காமல், உண்மையான விளக்கத் திறப்பை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சி அடுத்த வசனத்துக்குச் செல்லுவதைக் காட்ட இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
