source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: ta
  text: ஆனால், நீதியின் பொருட்டு நீங்கள் துன்பப்பட நேர்ந்தாலும்கூட, நீங்கள் பேறுபெற்றவர்கள். அவர்களுடைய பயத்திற்கு அஞ்சாதீர்கள்[a]; கலங்கவும் வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்குப் பயப்படாதீர்கள்” அல்லது “அவர்கள் அஞ்சுவதை அஞ்சாதீர்கள்” என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் உள்ள “அவர்களுடைய பயம்” என்ற தொடர் ஏசாயா 8:12-ன் சொல்லாட்சியை எதிரொலிப்பதோடு, ஒன்றுக்கு மேற்பட்ட பொருளையும் அனுமதிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: ஆனால், ... நீங்கள் துன்பப்பட நேர்ந்தாலும்கூட
  rationale: ἀλλ’ εἰ καὶ என்பதன் மாறுபாட்டு மற்றும் விட்டுக்கொடுப்பு நிபந்தனைப் பொருளையும், optative வினையின் நிகழக்கூடிய சாத்தியத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ δικαιοσύνην
  choice: நீதியின் பொருட்டு
  rationale: διά + accusative இங்கு காரணத்தைக் குறிக்கிறது. ‘நீதி’ என்பது δικαιοσύνη என்பதன் அறநெறி மற்றும் இறையியல் பரப்பைத் தக்கவைக்கிறது; ‘சரியானதைச் செய்வதால்’ என்பது அளவுக்கு மீறிய விளக்கமாகிவிடும்.
- source_word: μακάριοι
  choice: நீங்கள் பேறுபெற்றவர்கள்
  rationale: முகவர்களைக் குறிக்கும் பயனிலைப் பெயரடையைத் தமிழில் முழுமையான வாக்கியமாக்குகிறது. ‘பேறுபெற்றவர்கள்’ என்பது வெறும் உணர்ச்சியான மகிழ்ச்சியையோ உலகியல் அதிர்ஷ்டத்தையோ அல்லாமல், தேவனால் கிடைக்கும் நற்பேற்றைக் குறிக்கிறது.
- source_word: τὸν ... φόβον αὐτῶν
  choice: அவர்களுடைய பயத்துக்கு
  rationale: ‘அவர்களுடைய பயம்’ என்ற உடைமைத் தொடரைத் தக்கவைத்து, ஏசாயா 8:12-ன் கிரேக்க வடிவத்துடனான தொடர்பையும்—அவர்கள் உண்டாக்கும் பயமா அல்லது அவர்கள் பயப்படுவதா என்ற—மூலத்தின் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: μὴ φοβηθῆτε
  choice: அஞ்சாதீர்கள்
  rationale: தடைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது. ‘பயம்’/‘அஞ்சுதல்’ என ஒரே கருத்துப்புலத்தைத் தக்கவைக்கிறது.
- source_word: μηδὲ ταραχθῆτε
  choice: கலங்கவும் வேண்டாம்
  rationale: உள்ளம் குழம்பி நிலைகுலைவதைச் சுட்டும் ταράσσω என்பதைக் கூடுதல் விளக்கமின்றி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்; சரியானதைச் செய்தல்
  rationale: இச்சூழலில் கடவுளுக்கு முன்பாகவும் மனிதர்களுக்கு முன்பாகவும் நேர்மையான நடத்தைக்காகத் துன்பப்படுவதைக் குறிக்கிறது. ‘நீதி’ அதன் அறநெறி-இறையியல் அகலத்தைத் தக்கவைக்கிறது; ‘நியாயம்’ சமூக அல்லது சட்டத் தளத்துக்கு மட்டும் சுருங்கக்கூடும்.
- issue: τὸν φόβον αὐτῶν என்பதிலுள்ள தெளிவின்மை
  choice: அவர்களுடைய பயத்துக்கு அஞ்சாதீர்கள்
  alternative: அவர்களுக்குப் பயப்படாதீர்கள்; அவர்கள் பயப்படுவதற்கு அஞ்சாதீர்கள்
  rationale: மூலத் தொடர் இலக்கண ரீதியாக ஒன்றுக்கு மேற்பட்ட பொருளை அனுமதிப்பதோடு ஏசாயா 8:12-ஐ எதிரொலிக்கிறது. பிரதான உரையில் ஒரு பொருளை மட்டும் முடிவுசெய்யாமல், மாற்றுப் புரிதல்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘துன்பப்பட நேர்ந்தாலும்கூட’ சாத்திய நிபந்தனையை வெளிப்படுத்துகிறது; ‘பேறுபெற்றவர்கள்’ என்பது μακάριοι என்பதன் வேதாகம நற்பேற்றுப் பொருளைத் தக்கவைக்கிறது. மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்க ‘அவர்களுடைய பயம்’ என்ற உடைமை அமைப்பு பிரதான உரையில் வைக்கப்பட்டுள்ளது.
