source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: ta
  text: ஆனால், மெசியாவை ஆண்டவராக உங்கள் உள்ளங்களில் புனிதமாய்ப் போற்றுங்கள்[a]. உங்களுக்குள் இருக்கும் நம்பிக்கைக்கான காரணத்தை உங்களிடம் கேட்கும் ஒவ்வொருவருக்கும் தற்காப்புப் பதில் அளிக்க எப்போதும் ஆயத்தமாக இருங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “மெசியாவை ஆண்டவராக உங்கள் உள்ளங்களில் புனிதப்படுத்துங்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: “தற்காப்புப் பதில்” என்பதற்கான கிரேக்கச் சொல், ஒருவருடைய நிலைப்பாட்டை விளக்கி ஆதரிக்கும் பதிலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: மெசியாவை ஆண்டவராக
  rationale: κύριος என்ற பட்டத்தையும் Χριστός என்பதன் ‘மெசியா’ என்ற பட்டப்பொருளையும் காத்து, ἁγιάσατε உடன் இயல்பாக இணைக்கிறது.
- source_word: ἁγιάσατε
  choice: புனிதமாய்ப் போற்றுங்கள்
  rationale: அடிப்படையில் ‘புனிதப்படுத்துங்கள்’ அல்லது ‘புனிதமாக ஒதுக்கிவையுங்கள்’ என்ற பொருள். இங்கு மெசியாவை மனிதர்கள் புனிதராக்குகிறார்கள் என்று தோன்றாமல், அவரை உள்ளத்தில் புனிதராக மதித்துப் போற்றும் கட்டளையைத் தெரிவிக்கிறது.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் உள்ளங்களில்
  rationale: καρδία குறிக்கும் உள்ளார்ந்த மனநிலையையும் பன்மை வடிவையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἕτοιμοι ἀεὶ
  choice: எப்போதும் ஆயத்தமாக இருங்கள்
  rationale: ἕτοιμοι என்ற ஆயத்தநிலையையும் ἀεί என்ற காலத் தொடர்ச்சியையும் தெளிவாகக் காக்கிறது.
- source_word: πρὸς ἀπολογίαν
  choice: பதில் அளிக்க
  rationale: ἀπολογία என்பது கேள்வி அல்லது குற்றச்சாட்டுக்கு அளிக்கப்படும் தற்காப்பு விளக்கம் அல்லது பதிலைக் குறிக்கலாம். இச்சூழலில் இயல்பான தமிழ் நடைக்காக ‘பதில் அளிக்க’ தேர்ந்தெடுக்கப்பட்டது; விரிவான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: உங்களிடம் கேட்கும் ஒவ்வொருவருக்கும்
  rationale: παντί என்பதன் அனைவரையும் உள்ளடக்கும் பகிர்வுப் பொருளையும் αἰτοῦντι என்ற நிகழ்காலப் பெயரெச்சத்தையும் காக்கிறது.
- source_word: λόγον
  choice: காரணத்தை
  rationale: இங்கு λόγος என்பது வெறும் ‘சொல்’ அல்ல; நம்பிக்கைக்கான காரணம், கணக்கு அல்லது விளக்கம் என்று பொருள்படுகிறது.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: உங்களுக்குள் இருக்கும் நம்பிக்கைக்கான
  rationale: ἐν ὑμῖν என்பதன் ‘உங்களுக்குள்’ என்ற உள்ளார்ந்த அல்லது சமூகப் பொருளைத் திறந்தவாறே வைத்து, λόγον உடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός ஒரு பட்டமாகவும் κύριος உடன் அறிக்கையிடும் அமைப்பிலும் வருகிறது. ஆகவே அதன் பட்டப்பொருளைத் தெளிவாகத் தர ‘மெசியா’ பயன்படுத்தப்பட்டது.
- issue: மெசியாவைச் செயப்படுபொருளாகக் கொண்ட ἁγιάσατε என்பதன் பொருள்
  choice: புனிதமாய்ப் போற்றுங்கள்
  alternative: புனிதப்படுத்துங்கள்
  rationale: மூலத்தின் புனிதத்தன்மை சார்ந்த வலிமையைத் தக்கவைத்தபடியே, விசுவாசிகள் மெசியாவைப் புனிதராக்குகிறார்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. இது அவரை ஆண்டவராக உள்ளத்தில் புனிதமாக மதிக்கும் கட்டளையைத் தெரிவிக்கிறது.
- issue: κύριον τὸν Χριστόν என்ற தொடரின் உறவு
  choice: மெசியாவை ஆண்டவராக
  alternative: ஆண்டவராகிய மெசியாவை
  rationale: κύριον என்பதை Χριστός உடன் வெறும் இணைப்பட்டமாக மட்டும் காட்டாமல், மெசியாவை ‘ஆண்டவராக’ புனிதமாய்ப் போற்ற வேண்டும் என்ற சாத்தியமான தொடரியல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆயத்தமாக’ போன்ற வேதாகமப் பயன்பாட்டில் பழக்கமான ஆனால் இன்னும் இயல்பான சொல் வைக்கப்பட்டுள்ளது. மூலவாக்கியத்தின் நீண்ட தொடரை தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்.
