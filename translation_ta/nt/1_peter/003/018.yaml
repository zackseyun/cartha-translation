review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal textual reading ἔπαθεν (‘suffered’), the once-only adverb, the righteous/unrighteous contrast, the purpose of bringing the readers to God, and the passive flesh/spirit contrast. However, it repeats ‘துன்பப்பட்டார்’ in the appositional phrase, although Greek has only one finite verb, and ‘இப்படிச் செய்தார்’ adds an explicit explanatory action not present in the source.
  naturalness: The proposed revision retains clear, modern standard Tamil and a dignified biblical register while avoiding the unnecessary repeated verb. The dash-delimited apposition is natural and keeps the Greek’s compact contrast intelligible.
  terminology: ‘மெசியா,’ ‘பாவங்கள்,’ ‘நீதியுள்ளவர்,’ ‘நீதியற்றவர்கள்,’ ‘மாம்சம்,’ and ‘ஆவி’ are appropriate. ‘ஆவியில்’ appropriately preserves the ambiguity of πνεύματι; the alternative agentive reading remains in the footnote.
  issues:
  - severity: medium
    issue: The phrase ‘நீதியுள்ளவர் நீதியற்றவர்களுக்காகத் துன்பப்பட்டார்’ repeats the verb.
    rationale: The Greek reads literally, ‘Christ also suffered once for sins, righteous for unrighteous.’ Repeating ‘suffered’ is understandable Tamil but adds verbal material and weakens the terse representative contrast.
  - severity: medium
    issue: ‘உங்களைக் கடவுளிடம் கொண்டுவருவதற்காகவே இப்படிச் செய்தார்’ adds ‘இப்படிச் செய்தார்.’
    rationale: The purpose clause states the purpose of Messiah’s suffering; it does not supply a separate ‘he did this’ clause. The added wording is explanatory and should be removed for closer source fidelity.
  revised_text: ஏனெனில், மெசியாவும் பாவங்களுக்காக ஒரே முறை துன்பப்பட்டார்[a]—நீதியுள்ளவர் நீதியற்றவர்களுக்காக—அவர் உங்களைக் கடவுளிடம் கொண்டுவரும்படி; அவர் மாம்சத்தில் கொல்லப்பட்டார், ஆனால் ஆவியில் உயிர்ப்பிக்கப்பட்டார்[b].
