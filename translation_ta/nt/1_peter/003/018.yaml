revisions:
- from: ஏனெனில், மெசியாவும் பாவங்களுக்காக ஒரே முறை துன்பப்பட்டார்[a]—நீதியுள்ளவர் நீதியற்றவர்களுக்காகத் துன்பப்பட்டார்—உங்களைக் கடவுளிடம் கொண்டுவருவதற்காகவே இப்படிச் செய்தார். அவர் மாம்சத்தில் கொல்லப்பட்டார்; ஆனால் ஆவியில் உயிர்ப்பிக்கப்பட்டார்[b].
