  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: ta
  text: ஏனெனில், மெசியாவும் பாவங்களுக்காக ஒரே முறை துன்பப்பட்டார்[a]—நீதியுள்ளவர் நீதியற்றவர்களுக்காக—அவர் உங்களைக் கடவுளிடம் கொண்டுவரும்படி; அவர் மாம்சத்தில் கொல்லப்பட்டார், ஆனால் ஆவியில் உயிர்ப்பிக்கப்பட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘துன்பப்பட்டார்’ என்பதற்குப் பதிலாக ‘இறந்தார்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘ஆவியால் உயிர்ப்பிக்கப்பட்டார்.’ கிரேக்கச் சொற்றொடர் ஆவி என்னும் தளம் அல்லது அம்சத்தையோ, பரிசுத்த ஆவியின் செயலையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: மெசியா
  rationale: Χριστός என்பதன் அபிஷேகம் பெற்ற அரசர் என்ற பட்டப்பொருளை வெளிப்படையாகப் பாதுகாக்கிறது; பெயர்போல் ஒலிக்கும் ‘கிறிஸ்து’ என்பதைவிட மூலத்தின் மெசியாப் பொருளைத் தெளிவாக்குகிறது.
- source_word: ἅπαξ
  choice: ஒரே முறை
  rationale: நிகழ்வு ஒருமுறை நடந்ததை இயல்பான தமிழில் கூறுகிறது; மூலத்தில் தனியாக வெளிப்படாத ‘எல்லாக் காலத்திற்கும்’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: περὶ ἁμαρτιῶν
  choice: பாவங்களுக்காக
  rationale: இந்த மீட்பு/பலிசார் சூழலில் περί + genitive குறிக்கும் ‘பாவங்களுக்காக’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔπαθεν
  choice: துன்பப்பட்டார்
  rationale: SBLGNT மூலப் பாடமான ἔπαθεν என்பதைக் கடைப்பிடிக்கிறது; ‘இறந்தார்’ என்ற வேறுபட்ட கையெழுத்துப் பாடம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: நீதியுள்ளவர் நீதியற்றவர்களுக்காக
  rationale: ஒருமை நீதியுள்ளவருக்கும் பன்மை நீதியற்றவர்களுக்கும் இடையிலான பிரதிநிதித்துவ முரணைப் பாதுகாக்கிறது; குறிப்பிட்ட பரிகாரக் கோட்பாட்டை விரித்துரைக்கவில்லை.
- source_word: προσαγάγῃ
  choice: கடவுளிடம் கொண்டுவர
  rationale: ஒருவரை மற்றொருவரின் முன்னிலைக்குக் கொண்டுவருதல் அல்லது அணுகலை வழங்குதல் என்ற வினையின் உறவுசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θανατωθεὶς μὲν σαρκὶ
  choice: மாம்சத்தில் கொல்லப்பட்டார்
  rationale: θανατωθεὶς என்பதன் இறந்தகாலச் செயப்பாட்டு வினைத் தன்மையையும் σαρκί என்பதன் உடல்சார்/மரணத்துக்குட்பட்ட வாழ்வுத் தளத்தையும் பாதுகாக்கிறது.
- source_word: ζῳοποιηθεὶς δὲ πνεύματι
  choice: ஆவியில் உயிர்ப்பிக்கப்பட்டார்
  rationale: இணையான செயப்பாட்டு அமைப்பைத் தக்கவைத்து, πνεύματι என்பதை ஆவிக்குரிய தளம் அல்லது பரிமாணம் எனப் படிக்க இயலும் வகையில் மொழிபெயர்க்கிறது; பரிசுத்த ஆவியின் செயற்பாடு என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் உள்ளது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள மாம்சம்/ஆவி முரண்
  choice: ‘மாம்சத்தில் ... ஆவியில்’ என்று இணையான இரு தளங்கள் அல்லது பரிமாணங்களாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உடலில் ... பரிசுத்த ஆவியால்’ அல்லது ‘ஆவியால் உயிர்ப்பிக்கப்பட்டார்.’
  rationale: σαρκί, πνεύματι ஆகிய இரு dative வடிவங்களும் சுருக்கமான இணைப்பில் உள்ளன. πνεύματι என்பது தளம்/அம்சத்தையோ பரிசுத்த ஆவியின் செயற்பாட்டையோ குறிக்கக்கூடும்; முதன்மை உரை இந்த விவாதத்தைக் கட்டாயமாகத் தீர்க்காமல், மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ‘நீதியுள்ளவர் நீதியற்றவர்களுக்காக’ என்பதன் பிரதிநிதித்துவ அல்லது பதிலீட்டு வலிமை
  choice: மூலத்தின் சுருக்கமான ‘நீதியுள்ளவர் நீதியற்றவர்களுக்காக’ என்ற அமைப்பு அப்படியே பாதுகாக்கப்பட்டது.
  alternative: ‘குற்றமற்றவர் குற்றவாளிகளுக்குப் பதிலாக’ போன்ற விளக்கமான உரை.
  rationale: ὑπέρ பிறரின் நன்மைக்காகவும் பிரதிநிதியாகவும் துன்பப்படுதலைக் குறிக்கிறது; ஆனால் ஒரு முழுமையான பரிகாரக் கோட்பாட்டை இங்கே மொழிபெயர்ப்பு சேர்க்கக் கூடாது.
- issue: Χριστός என்பதன் மொழியாக்கம்
  choice: ‘மெசியா’ என்ற பட்டம் பயன்படுத்தப்பட்டது.
  alternative: ‘கிறிஸ்து.’
  rationale: மூலச் சொல்லின் அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளைத் தெளிவாக வைத்திருக்கிறது; பிற்காலத்தில் பெயர்போல நிலைபெற்ற வடிவை மட்டும் பயன்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியத்தை வாசிப்புக்கு ஏற்ற மூன்று உட்பகுதிகளாகப் பிரித்தாலும், காரணம், நோக்கம், மாம்சம்–ஆவி முரண் ஆகிய தர்க்கத் தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன. ‘மாம்சம்’ மற்றும் ‘ஆவி’ என்ற சொற்கள் அவற்றின் இறையியல் நெருக்கடியைத் தீர்க்காமல் வைத்திருக்கின்றன.
