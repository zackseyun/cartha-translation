id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: ta
  text: ஏனெனில், தீமை செய்துகொண்டு துன்பப்படுவதைவிட, நன்மை செய்துகொண்டு துன்பப்படுவது—கடவுளுடைய திருவுளம் அப்படி விரும்பினால்[a]—மேலானது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக, “கடவுளுடைய திருவுளம் விரும்பினால்” என்று உள்ளது. ஒரே வேருடன் தொடர்புடைய பெயர்ச்சொல்–வினைச்சொல் வலியுறுத்தல் தமிழில் “திருவுளம் அப்படி விரும்பினால்” என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நன்மை செய்துகொண்டு ... தீமை செய்துகொண்டு” என்பதற்கு, “நன்மை செய்ததற்காக ... தீமை செய்ததற்காக” என்றும் பொருள் கொள்ளலாம். கிரேக்கப் பங்கேற்புவினைகள் காரணத்தையோ, செயல் நிகழும் சூழலையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: மேலானது
  rationale: ஒப்பீட்டுப் பொருளை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; ἢ என்பதுடன் வரும் ‘...விட ... மேலானது’ என்ற அமைப்பையும் தக்கவைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பை வெளிப்படையாகக் காட்டுகிறது.
- source_word: ἀγαθοποιοῦντας
  choice: நன்மை செய்துகொண்டு
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்நிலைச் சூழலைக் காட்டுகிறது; ‘நன்மை செய்ததற்காக’ என்று காரணப் பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: εἰ θέλοι
  choice: அப்படி விரும்பினால்
  rationale: εἰ உடன் வரும் optative-இன் சாத்திய அல்லது நிபந்தனை நுணுக்கத்தை ‘-னால்’ மூலம் தெரிவிக்கிறது; θέλημα–θέλοι என்ற சொல்விளையாட்டை தமிழில் இயன்ற அளவு ‘திருவுளம் ... விரும்பினால்’ எனப் பாதுகாக்கிறது.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: கடவுளுடைய திருவுளம்
  rationale: இறைச் சித்தத்தைச் சுட்டும் கண்ணியமான, பொதுவாகப் புரியக்கூடிய தமிழ்; உடைமைத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: πάσχειν
  choice: துன்பப்படுவது
  rationale: κρεῖττον என்பதோடு தொடர்புடைய infinitive-ஐ தமிழில் பெயராக்கப்பட்ட வினை வடிவில் நேரடியாக வழங்குகிறது.
- source_word: ἢ
  choice: '...விட'
  rationale: κρεῖττον உடன் உள்ள ஒப்பீட்டை இயல்பான தமிழ் வேற்றுமை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: κακοποιοῦντας
  choice: தீமை செய்துகொண்டு
  rationale: ἀγαθοποιοῦντας என்பதற்கான எதிரிணையையும் இலக்கண இணைப்பையும் காக்கிறது; காரணப் பொருளைத் தீர்மானமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: துன்பத்துக்கும் கடவுளுடைய திருவுளத்துக்கும் உள்ள தொடர்பு
  choice: நன்மை செய்கிறவர் துன்பப்படுவது கடவுளுடைய திருவுளத்திற்குள் நிகழக்கூடியது என நிபந்தனையுடன் கூறப்படுகிறது.
  alternative: ஒவ்வொரு துன்பத்தையும் கடவுள் நேரடியாக நிர்ணயிக்கிறார்; அல்லது கடவுள் எந்த வகையிலும் சம்பந்தமின்றி வெறுமனே அனுமதிக்கிறார்.
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ என்பது கடவுளுடைய திருவுளத்தை நிபந்தனையாகக் குறிப்பிடுகிறது; ஆனால் நிர்ணயம்–அனுமதி குறித்த விரிவான கோட்பாட்டைத் தீர்மானிக்கவில்லை. மொழிபெயர்ப்பு அந்த இறையியல் இழுவிசையைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘சித்தம்’ என்பதற்குப் பதிலாக வழிபாட்டு மரபுகளைக் கடந்து பரவலாகப் புரியக்கூடிய ‘திருவுளம்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல் மறுமொழியும் நிபந்தனை நுணுக்கமும் இயன்ற அளவு காக்கப்பட்டுள்ளன; பங்கேற்புவினைகளின் காரண/சூழல் இரட்டைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
