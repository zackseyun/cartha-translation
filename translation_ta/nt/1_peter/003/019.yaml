  text: in which also he went and proclaimed to the spirits in prison[c][b][a],
translation:
  language: ta
  text: அந்த ஆவியில்[a] அவர் சென்று, சிறையில் உள்ள ஆவிகளுக்கும்[c] அறிவித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரில்’ என்றும், வேறொரு புரிதலின்படி ‘அந்த ஆவியினால்’ என்றும் மொழிபெயர்க்கலாம். முந்தைய கூற்றோடு இச்சொற்றொடர் எவ்வாறு தொடர்புபடுகிறது என்பதை கிரேக்கம் ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: ‘பிரசங்கித்தார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள வினைச்சொல் ஓர் அறிவிப்பைச் செய்வதைக் குறிக்கிறது; ஆனால் அந்தச் செய்தியின் துல்லியமான உள்ளடக்கத்தை இவ்வசனம் குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: c
    text: ‘சிறையில் உள்ள ஆவிகள்’ யார் என்பது விவாதத்திற்குரியது; இறந்த மனிதர்கள் அல்லது வீழ்ந்த தூதர்களாகிய ஆவிகள் என்பது உள்ளிட்ட புரிதல்கள் முன்வைக்கப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அந்த ஆவியிலேயே
  rationale: முந்தைய வசனத்தின் πνεύματι என்பதோடு இயல்பாக இணைத்து, ἐν என்பதன் அடிப்படை இடம்/நிலை சார்ந்த பொருளைத் தக்கவைக்கிறது. ‘அந்த’ என்பது தொடர்பைத் தெளிவாக்குகிறது; ‘-இலேயே’ என்பது καὶ உடைய சேர்க்கைப் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. கருவிப்பொருள் அல்லது தனிப்பட்ட ‘அவரில்’ என்ற விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: καὶ
  choice: -உம் / -ஏ
  rationale: தமிழில் தனி ‘மேலும்’ என்பதைக் காட்டிலும், ‘ஆவியிலேயே’ மற்றும் ‘ஆவிகளுக்கும்’ என்னும் இடைச்சொல் வடிவங்கள் இதன் சேர்க்கைப் பொருளை இயல்பாகக் காட்டுகின்றன.
- source_word: τοῖς ... πνεύμασιν
  choice: ஆவிகளுக்கும்
  rationale: πνεύμασιν என்பதற்கு நேரான ‘ஆவிகள்’ என்பதைப் பயன்படுத்தி, அவர்கள் இறந்த மனிதர்களா அல்லது வீழ்ந்த தூதர்சார் ஆவிகளா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἐν φυλακῇ
  choice: சிறையில் இருந்த
  rationale: φυλακή என்பதன் காவல்/சிறை நிலையை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πορευθεὶς
  choice: அவர் சென்று
  rationale: இறந்தகால வினையெச்சத்தை இயல்பான தமிழ்ச் சொற்றொடராகத் தருகிறது; இயக்கத்தின் கருத்தைத் தக்கவைக்கிறது.
- source_word: ἐκήρυξεν
  choice: அறிவித்தார்
  rationale: செய்தியின் உள்ளடக்கம் நற்செய்தியா, தீர்ப்பா, வெற்றியறிவிப்பா என்று வசனம் குறிப்பிடாததால், ‘நற்செய்தி பிரசங்கித்தார்’ போன்ற குறுகிய விளக்கத்தைத் தவிர்த்து, பொதுவான அறிவிப்புச் செயலைக் குறிக்கிறது.
theological_decisions:
- issue: ἐν ᾧ என்பதன் தொடர்பும் பொருளும்
  choice: ‘அந்த ஆவியிலேயே’ என்று, முந்தைய வசனத்தின் ‘ஆவி’ என்பதோடு இணைத்தும் அதன் துல்லியமான நுண்பொருளைத் திறந்தும் வைத்தல்
  alternative: ‘அவரில்’ அல்லது ‘அந்த ஆவியினால்’
  rationale: கிரேக்கத் தொடரின் தொடர்பும் செயல்முறையும் விவாதத்திற்குரியவை. முதன்மை மொழிபெயர்ப்பு ‘ஆவி’ என்ற அருகிலுள்ள இலக்கணத் தொடர்பை முன்னிறுத்துகிறது; அடிக்குறிப்பு மற்ற சாத்தியங்களைப் பாதுகாக்கிறது.
- issue: ‘சிறையில் இருந்த ஆவிகள்’ யார்?
  choice: முதன்மை உரையில் ‘ஆவிகள்’ என்றே குறிப்பிடுதல்
  alternative: இறந்த மனிதர்கள்; வீழ்ந்த தூதர்சார் ஆவிகள்; அல்லது சிறைப்படுத்தப்பட்ட ஆவிகளின் விரிந்த வகுப்பு
  rationale: கிரேக்கச் சொற்றொடர் அவர்களின் அடையாளத்தைத் தீர்மானிக்கவில்லை; ஆகவே மொழிபெயர்ப்பும் ஒரு குறிப்பிட்ட கோட்பாட்டைத் திணிக்காது.
- issue: ἐκήρυξεν குறிக்கும் செய்தியின் தன்மை
  choice: ‘அறிவித்தார்’
  alternative: ‘பிரசங்கித்தார்’; ‘நற்செய்தி அறிவித்தார்’; ‘வெற்றியை அறிவித்தார்’; ‘தீர்ப்பை அறிவித்தார்’
  rationale: κηρύσσω ஒரு தூதரின் பொது அறிவிப்பைக் குறிக்கிறது; இங்கு அதன் உள்ளடக்கம் சொல்லப்படவில்லை. எனவே பொதுவான மொழிபெயர்ப்பு இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘ஆவிகள்’, ‘சிறை’, ‘அறிவித்தார்’ ஆகிய சொற்கள் மூலத்தின் சுருக்கத்தையும் உண்மையான விளக்கத் திறந்தநிலையையும் காக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடம்பெற்றுள்ளன.
