source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: ta
  text: ஏனெனில், முற்காலத்தில் தேவனில் நம்பிக்கை வைத்திருந்த பரிசுத்தப் பெண்களும் இவ்வாறே தங்களை அலங்கரித்துக்கொண்டு, தங்களுடைய கணவர்களுக்குப் பணிந்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்ட அலங்கார முறையைச் சுட்டுகிறது; கிரேக்கச் சொல்லின் சுட்டும் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தையோ ஆதாரத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக உள்ளது.
- source_word: ποτε
  choice: முற்காலத்தில்
  rationale: முந்தைய தலைமுறைகளைச் சேர்ந்த பெண்களைக் குறிக்கும் வரலாற்றுக் காலப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἅγιαι γυναῖκες
  choice: பரிசுத்த பெண்கள்
  rationale: ἅγιαι என்பதன் வழக்கமான வேதாகமப் பொருளைத் தளர்த்தாமல், நவீனத் தமிழில் கண்ணியமாக வழங்குகிறது.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: தேவன்மேல் நம்பிக்கை வைத்திருந்த
  rationale: இப்பெண்களைத் தொடர்ந்து பண்புரைக்கும் நிகழ்காலப் பெயரெச்சத்தின் கருத்தையும், அவர்களுடைய நம்பிக்கையின் இலக்கு தேவன் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκόσμουν ἑαυτάς
  choice: தங்களை அலங்கரித்துக்கொண்டார்கள்
  rationale: முந்தைய சூழலில் வரும் அலங்காரம் மற்றும் அழகு பற்றிய கருத்துத் தொடர்பைக் காக்கிறது; ἑαυτάς என்பதன் தற்சுட்டுப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: ὑποτασσόμεναι
  choice: பணிந்து நடந்தார்கள்
  rationale: முதன்மை வினை கூறும் அலங்கரித்தலுடன் இணைந்த தொடர்ச்சியான நடத்தையை இயல்பான தமிழில் தருகிறது; இதை வெறும் கட்டளைக்குக் கீழ்ப்படிதலாகக் குறுக்கவில்லை.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: தங்களுடைய கணவர்களுக்கு
  rationale: திருமணச் சூழலில் ἀνδράσιν என்பது கணவர்களைக் குறிக்கிறது; ἰδίοις வரையறுக்கும் உறவின் எல்லையை ‘தங்களுடைய’ எனத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: திருமண உறவில் பணிதலை மொழிபெயர்த்தல்
  choice: தங்களுடைய கணவர்களுக்குப் பணிந்து நடந்தார்கள்
  alternative: தங்களுடைய கணவர்களுக்குக் கீழ்ப்பட்டிருந்தார்கள்
  rationale: கிரேக்கப் பெயரெச்சம் விவரிக்கும் நடத்தையையும், ‘தங்களுடைய கணவர்கள்’ என்ற திருமண உறவுக்குள் வரையறுக்கப்பட்ட எல்லையையும் காக்கிறது. எல்லாப் பெண்களுக்கும் எல்லா ஆண்களுக்கும் பொருந்தும் விரிவான கோட்பாடாக வசனத்தை மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த’ போன்ற நிறுவப்பட்ட வேதாகமச் சொல்லாட்சி காக்கப்பட்டாலும், வாக்கிய அமைப்பு இயல்பான தமிழுக்கு ஏற்றவாறு வடிவமைக்கப்பட்டுள்ளது.
