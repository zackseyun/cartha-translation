source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: ta
  text: இயேசுவாகிய மெசியாவின் உயிர்த்தெழுதலின் வழியாக, அதற்கு ஒத்ததாகிய திருமுழுக்கு இப்போது உங்களைக் காப்பாற்றுகிறது—உடலிலிருந்து அழுக்கை அகற்றுதல் அல்ல, மாறாக நல்ல மனச்சாட்சிக்காகக் கடவுளிடம் செய்யப்படும் வேண்டுகோள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு அளிக்கப்படும் நல்ல மனச்சாட்சியின் உறுதிமொழி.” “வேண்டுகோள்” என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (ἐπερώτημα), “உறுதிமொழி” அல்லது “பதில்” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: அதற்கு ஒத்ததாகிய
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வெள்ளநீரோடு உள்ள ஒப்புமையைத் தெளிவாகக் காட்டுகிறது; பிற்காலத் தொழில்நுட்ப இறையியல் சொல்லாட்சியைத் திணிக்கவில்லை.
- source_word: σῴζει
  choice: காப்பாற்றுகிறது
  rationale: நிகழ்கால வினையை நேரடியாகவும் பொதுமக்களுக்கு எளிதாகவும் தருகிறது; திருமுழுக்கின் பங்கை மெலிதாக்காமல், தொடர்ந்து வரும் விளக்கமே அதன் பொருளை வரையறுக்க விடுகிறது.
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: தமிழில் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க சொல்; வெறும் உடல் கழுவுதலாகப் பொழிப்புரை செய்யாமல் கிரேக்கச் சொல்லின் தனித்தன்மையைப் பேணுகிறது.
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: உடலிலுள்ள அழுக்கை அகற்றுவது
  rationale: இங்கு σάρξ உடல்சார்ந்த அழுக்கைக் குறிக்கும் சூழலில் வருகிறது. இயல்பான நவீனத் தமிழில் வெளிப்புறத் தூய்மைப்படுத்தலைத் தெளிவாகக் கூறுகிறது.
- source_word: συνειδήσεως ἀγαθῆς
  choice: நல்ல மனச்சாட்சிக்காக
  rationale: சுருக்கமான கிரேக்கத் தொடர் வேண்டுகோளின் நோக்கத்தைச் சுட்டுவதாகப் புரிந்துகொள்ளப்படுகிறது; தமிழில் இயல்பாகவும் உள்ளது, ஆனால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπερώτημα
  choice: வேண்டுகோள்
  rationale: εἰς θεόν என்பதுடன் சேர்ந்து கடவுளை நோக்கிய வேண்டுகோள் என்ற பொருளுக்கு நன்கு பொருந்துகிறது. சர்ச்சைக்குரிய ‘உறுதிமொழி/பதில்’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς θεόν
  choice: கடவுளிடம்
  rationale: வேண்டுகோள் யாரை நோக்கிச் செய்யப்படுகிறது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δι’ ἀναστάσεως
  choice: உயிர்த்தெழுதலின் வழியாக
  rationale: διά + genitive குறிக்கும் கருவி அல்லது வழிமுறையைப் பேணுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: திருமுழுக்கும் மீட்பும் கொண்டுள்ள தொடர்பு
  choice: ‘திருமுழுக்கு இப்போது உங்களையும் காப்பாற்றுகிறது’ என்ற நேரடியான கூற்றைத் தக்கவைத்து, பேதுருவின் அடுத்த விளக்கமே அதன் பொருளை வரையறுக்க விடுதல்.
  alternative: ‘திருமுழுக்கு மீட்பை அடையாளப்படுத்துகிறது’ என்று கூற்றை மெலிதாக்குதல், அல்லது ஒரு குறிப்பிட்ட திருச்சபை மரபின் திருமுழுக்குக் கோட்பாட்டை விரிவாகச் சேர்த்தல்.
  rationale: கிரேக்க உரை திருமுழுக்கு காப்பாற்றுகிறது என்று நேரடியாகக் கூறுகிறது; அதே நேரத்தில், அது வெறும் உடல் அழுக்கு நீக்கம் அல்ல என்றும், மனச்சாட்சியுடனும் இயேசுவின் உயிர்த்தெழுதலுடனும் தொடர்புடையது என்றும் விளக்குகிறது. இவ்விரு அம்சங்களும் தீர்க்கப்படாமல் பாதுகாக்கப்படுகின்றன.
- issue: ἐπερώτημα என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வேண்டுகோள்’ என்று தருதல்.
  alternative: ‘உறுதிமொழி’ அல்லது ‘பதில்’.
  rationale: கடவுளை நோக்கிய வேண்டுகோள் என்பது εἰς θεόν உடன் இயல்பாகப் பொருந்துகிறது. எனினும், சொல்லின் பொருள் உண்மையாகவே விவாதத்திற்குரியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: δι’ ἀναστάσεως எதனுடன் தொடர்புபடுகிறது
  choice: இறுதி வாக்கியத்தில் ‘அது உங்களைக் காப்பாற்றுகிறது’ என்பதை மீண்டும் கூறி, உயிர்த்தெழுதல் திருமுழுக்கின் காப்பாற்றும் செயலுக்கான வழி என்பதைத் தெளிவுபடுத்துதல்.
  alternative: இதை உடனடியாக முந்திய ‘வேண்டுகோள்’ என்பதுடன் இணைத்துப் படித்தல்.
  rationale: கிரேக்கச் சொற்றொடரின் இறுதி அமைப்பில் தொடர்பு ஓரளவு சுருக்கமாக உள்ளது. முதன்மையான தொடரியல் தொடர்பு σῴζει என்பதுடனே இருப்பதாக எடுத்துக்கொள்ளப்படுகிறது; தமிழில் தவறான அருகாமைத் தொடர்பைத் தவிர்க்க வினை மீண்டும் சொல்லப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; ‘சரீரம்’ போன்ற பழைய நடை தவிர்க்கப்பட்டு ‘உடல்’ பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ்ச் சொற்றொடர்களாகப் பிரிக்கப்பட்டுள்ளது; இறுதி வினை மீளுரைத்தல் பொருள் விளக்கத்திற்கானது, புதிய இறையியல் தகவல் அல்ல.
