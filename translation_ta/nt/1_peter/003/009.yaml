source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: ta
  text: தீமைக்குப் பதிலாகத் தீமை செய்யாதீர்கள்; இகழ்ச்சிக்குப் பதிலாக இகழ்ச்சி கூறாதீர்கள்[a]. மாறாக[b], ஆசீர்வதியுங்கள். ஏனெனில், இதற்காகவே நீங்கள் அழைக்கப்பட்டீர்கள்[c], நீங்கள் ஆசீர்வாதத்தை வாரிசாகப் பெறும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பழிப்புக்குப் பதிலாகப் பழிப்பு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அவமதிக்கும் அல்லது தாக்கிப் பேசும் வார்த்தைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆனால், அதற்கு நேர்மாறாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் வலுவான எதிர்மாற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, தவறாக நடத்தப்படும்போது பதிலடி கொடுக்காமல் ஆசீர்வதிப்பதற்காகக் கடவுள் அழைத்தார். இந்த அழைப்பு துன்பத்திலும் பதிலடி கொடுக்காமையிலும் கிறிஸ்தவர்கள் கடைப்பிடிக்க வேண்டிய நடத்தை முழுவதையும் சுட்டுவதாகவும் புரிந்துகொள்ளலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: திருப்பிச் செய்யாமலும் / கூறாமலும்
  rationale: முன்பு செய்யப்பட்டதற்குப் பதிலாகத் திருப்பிச் செய்வது என்ற பரிமாற்றப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தீமைக்கும் பேச்சுவழி இகழ்ச்சிக்கும் ஏற்ற வினைகள் தனித்தனியாகப் பயன்படுத்தப்பட்டுள்ளன.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: தீமைக்குத் தீமை
  rationale: κακόν என்பதன் ஒழுக்கவியல் கனத்தையும் ἀντί குறிக்கும் பதில்செயல் உறவையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: இகழ்ச்சிக்கு இகழ்ச்சி
  rationale: λοιδορία குறிக்கும் அவமதிப்பான, தாக்கும் பேச்சை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τοὐναντίον δὲ
  choice: அதற்கு மாறாக
  rationale: எதிர்பார்க்கப்படும் பதில்செயலிலிருந்து வலுவான திருப்பத்தைக் குறிக்கிறது.
- source_word: εὐλογοῦντες
  choice: ஆசீர்வதியுங்கள்
  rationale: நன்மையாகப் பேசுதல், கடவுளின் நன்மையை வேண்டுதல் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது; கிரேக்கத்தில் இல்லாத செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் இணைப்புச் சொல்.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: இதற்கே நீங்கள் அழைக்கப்பட்டீர்கள்
  rationale: இறைச் செயப்பாட்டு அழைப்பையும், உடனடியான முன் அறிவுரையைச் சுட்டும் εἰς τοῦτο என்பதையும் வெளிப்படுத்துகிறது; ‘இதற்கு’ எதைச் சுட்டுகிறது என்பதை மொழிபெயர்ப்பு மிகையாகக் குறுக்கவில்லை.
- source_word: ἵνα
  choice: பெறும்படிக்கே
  rationale: நோக்கம் அல்லது உத்தேசிக்கப்பட்ட விளைவு என்ற தொடர்பைப் பாதுகாக்கிறது.
- source_word: εὐλογίαν
  choice: ஆசீர்வாதத்தை
  rationale: பெறப்படும் இறைநன்மை என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: κληρονομήσητε
  choice: உரிமையாகப் பெற
  rationale: வெறுமனே ‘பெறுதல்’ என்பதைக் காட்டிலும், வாரிசுக்கு வழங்கப்படுவதைப் போலப் பெறுதல் என்ற உடன்படிக்கை மற்றும் குடும்ப நிழற்பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: εἰς τοῦτο ἐκλήθητε என்பதில் அழைப்பின் இயல்பு
  choice: ‘இதற்கே’ என்பது உடனடியாகக் கூறப்பட்ட, தீங்கிற்குப் பதிலடி கொடுக்காமல் ஆசீர்வதிக்கும் நடத்தையை முதன்மையாகச் சுட்டுகிறது.
  alternative: இது துன்பத்தையும் பதிலடி கொடுக்காமையையும் உள்ளடக்கிய கிறிஸ்தவ வாழ்வு முழுவதையும் விரிவாகச் சுட்டலாம்.
  rationale: உடனடி சூழல் ஆசீர்வதிக்கும் அறிவுரையோடு இணைப்பதை ஆதரிக்கிறது; ஆனால் ‘இதற்கே’ என்ற சுட்டுப்பெயர் மூலம் அதன் எல்லையை மொழிபெயர்ப்பு தேவையின்றி நிர்ணயிக்கவில்லை.
- issue: ἵνα தொடர் நோக்கமா அல்லது விளைவா
  choice: அழைக்கப்பட்டதன் நோக்கத்தை முன்னிலைப்படுத்தும் வகையில் ‘பெறும்படிக்கே’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அதன் உத்தேசிக்கப்பட்ட விளைவு என்று புரிந்துகொள்ளலாம்.
  rationale: ἵνα இரு நிழற்பொருள்களையும் தாங்கக்கூடும்; தமிழ் வடிவம் நோக்கத்தை முன்னிறுத்தினாலும் இறுக்கமான காரண-பலன் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பு வடிவங்கள் தமிழில் தனித்து இயல்பாக வாசிக்க அறிவுறுத்தல் வடிவில் அமைக்கப்பட்டுள்ளன. இறுதியில் ‘அப்படி அழைக்கப்பட்டீர்கள்’ என்பது தமிழில் நோக்கத் தொடர்பைத் தெளிவாக்கச் சேர்க்கப்பட்டது; புதிய கருத்தைச் சேர்ப்பதில்லை.
