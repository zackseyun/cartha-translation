review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the two prohibitions, the emphatic reversal, the divine calling, and the purpose of inheriting blessing. However, its final clause repeats “you were called” (“அப்படி அழைக்கப்பட்டீர்கள்”), although the Greek has only one calling clause followed by a purpose clause. The revision retains the purpose relationship without this addition and renders κληρονομήσητε explicitly as heir-like reception.
  naturalness: The revised wording is modern, direct Tamil. “தீமைக்குப் பதிலாகத் தீமை” and “இகழ்ச்சிக்குப் பதிலாக இகழ்ச்சி” make the retaliatory force of ἀντί clear. “வாரிசாகப் பெற” is more idiomatic than “உரிமையாகப் பெற” while retaining the inheritance sense.
  terminology: “ஆசீர்வதியுங்கள் / ஆசீர்வாதம்” appropriately preserves εὐλογοῦντες / εὐλογίαν without adding an object. “அழைக்கப்பட்டீர்கள்” retains the passive, and the note cautiously identifies God as the implied caller without doctrinal over-definition.
  issues:
  - severity: medium
    issue: The final sentence redundantly repeats the calling.
    rationale: “நீங்கள் ஆசீர்வாதத்தை உரிமையாகப் பெறும்படிக்கே அப்படி அழைக்கப்பட்டீர்கள்” restates the preceding “நீங்கள் அழைக்கப்பட்டீர்கள்.” The Greek instead has ἵνα plus subjunctive, expressing the purpose/result of the single calling.
  - severity: low
    issue: The inheritance nuance is weakened in “உரிமையாகப் பெற.”
    rationale: It can suggest merely receiving as a right. “வாரிசாகப் பெற” more naturally represents κληρονομήσητε as receiving in the capacity of an heir.
  revised_text: தீமைக்குப் பதிலாகத் தீமை செய்யாதீர்கள்; இகழ்ச்சிக்குப் பதிலாக இகழ்ச்சி கூறாதீர்கள்[a]. மாறாக[b], ஆசீர்வதியுங்கள். ஏனெனில், இதற்காகவே நீங்கள் அழைக்கப்பட்டீர்கள்[c], நீங்கள் ஆசீர்வாதத்தை வாரிசாகப் பெறும்படி.
