revisions:
- from: தீமைக்குத் தீமை செய்யாமலும், இகழ்ச்சிக்கு இகழ்ச்சி கூறாமலும்[a], அதற்கு மாறாக[b] ஆசீர்வதியுங்கள். ஏனெனில், இதற்கே நீங்கள் அழைக்கப்பட்டீர்கள்[c]; நீங்கள் ஆசீர்வாதத்தை உரிமையாகப் பெறும்படிக்கே அப்படி அழைக்கப்பட்டீர்கள்.
  to: தீமைக்குப் பதிலாகத் தீமை செய்யாதீர்கள்; இகழ்ச்சிக்குப் பதிலாக இகழ்ச்சி கூறாதீர்கள்[a]. மாறாக[b], ஆசீர்வதியுங்கள். ஏனெனில், இதற்காகவே நீங்கள் அழைக்கப்பட்டீர்கள்[c], நீங்கள் ஆசீர்வாதத்தை வாரிசாகப் பெறும்படி.
  rationale: The revision removes the duplicated calling statement, preserves the Greek’s concise participial exhortation in idiomatic Tamil imperatives, makes the reciprocal/retaliatory force of ἀντί explicit, and restores the heir/inheritance nuance of κληρονομήσητε. Footnote anchors remain attached to the corresponding lexical or contextual elements.
