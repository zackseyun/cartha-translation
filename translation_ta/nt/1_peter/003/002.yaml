revisions:
- from: நீங்கள் பயத்துடன் வாழும் தூய நடத்தையை அவர்கள் உற்றுக் கவனிக்கும்போது.
  to: பயத்துடன் கூடிய உங்கள் தூய நடத்தையை அவர்கள் உற்றுக் கவனிக்கும்போது.
  rationale: The revision places ‘பயத்துடன்’ with ‘உங்கள் தூய நடத்தை,’ preserving the Greek syntactic relationship and its unresolved referent while improving natural Tamil. The verse remains a dependent temporal clause, as in the source and the preceding-context connection.
