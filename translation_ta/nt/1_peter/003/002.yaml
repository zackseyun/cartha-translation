  text: when they observe your pure conduct in fear.
translation:
  language: ta
  text: பயத்துடன் கூடிய உங்கள் தூய நடத்தையை அவர்கள் உற்றுக் கவனிக்கும்போது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: உற்றுக் கவனிக்கும்போது
  rationale: இது வெறுமனே பார்ப்பதைவிடக் கூர்ந்து நேரில் கவனித்தறியும் பொருளைக் கொண்டுள்ளது; தமிழில் இயல்பான காலத் தொடர்புடன் மொழிபெயர்க்கப்பட்டது.
- source_word: ἁγνὴν
  choice: தூய
  rationale: ஒழுக்கத் தூய்மையையும் களங்கமின்மையையும் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: ἀναστροφὴν
  choice: நடத்தை
  rationale: ஒருவரின் வாழ்வுமுறையையும் ஒழுக்கத்தையும் குறிக்கிறது; இச்சூழலில் ‘நடத்தை’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐν φόβῳ
  choice: பயத்துடன்
  rationale: மூலத்தின் ‘பயத்தில்’ என்ற வடிவத்தை இயல்பான தமிழில் தருகிறது; அந்தப் பயம் யாரை அல்லது எதை நோக்கியது என்பதை வசனம் வெளிப்படையாகச் சொல்லாததால் அது தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: ἐν φόβῳ என்பதன் நோக்கம்
  choice: பயத்துடன்
  alternative: தேவபயத்துடன் / மரியாதையுடன்
  rationale: மூலவாக்கியம் பயத்தின் பொருளையோ நோக்கத்தையோ வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே ‘தேவபயம்’ என்று விளக்கிச் சேர்க்காமலும், ‘மரியாதை’ என்று அதன் தீவிரத்தைத் தணிக்காமலும் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், dignified ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டது. இது முந்தைய வசனத்தோடு இலக்கண ரீதியாக இணையும் துணைவாக்கியம் என்பதால் இறுதியில் ‘போது’ வடிவம் பயன்படுத்தப்பட்டது.
