lexical_decisions:
- source_word: ἐν ᾧ
  choice: இதனால்
  rationale: முன்னைய வசனங்களில் கூறப்பட்ட மீட்பு, உயிருள்ள நம்பிக்கை, அழியாத உரிமைப்பேறு ஆகியவற்றின் மொத்தத்தைச் சுட்டுகிறது. தமிழ் நடையில் இயல்பாக இருக்கும்படி காரணம்/அடிப்படை சார்ந்த தொடர்பை வெளிப்படுத்துகிறது; குறிப்பை ஒரே பொருளுக்கு மட்டும் சுருக்கவில்லை.
- source_word: ἀγαλλιᾶσθε
  choice: நீங்கள் பேருவகை கொள்கிறீர்கள்
  rationale: இந்த வினைச்சொல்லின் தீவிரமான மகிழ்ச்சி அல்லது களிகூருதல் என்ற உணர்வை, நவீனத் தமிழில் கண்ணியமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ὀλίγον ἄρτι
  choice: இப்போது சிறிது காலம்
  rationale: ἄρτι என்பதன் நிகழ்காலக் குறிப்பையும் ὀλίγον என்பதன் குறுகிய கால அளவையும் இரண்டையும் காக்கிறது.
- source_word: εἰ δέον
  choice: அவசியமானால்
  rationale: εἰ-யின் நிபந்தனைத் தன்மையையும் δέον-ன் அவசியத்தையும் சுருக்கமாகக் காக்கிறது; அந்த அவசியத்தின் காரணத்தையோ ஏற்படுத்துபவரையோ உரை கூறாத இடத்தில் சேர்க்கவில்லை.
- source_word: λυπηθέντες
  choice: துயருற்றிருக்கிறீர்கள்
  rationale: துயரத்தை அனுபவித்த நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்க இறந்தகாலப் பங்கேற்புச் சொல்லின் காலத் தன்மை பிரதான வினையுடன் தொடர்புடையதால், தற்போதைய விளைவைக் காட்டும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: பலவகையான சோதனைகளால்
  rationale: சூழலில் விசுவாசம் சோதிக்கப்படுவதும் துன்பத்தால் துயருறுவதும் பேசப்படுவதால், πειρασμοῖς என்பதற்கு ‘சோதனைகள்’ பொருத்தமானது. ‘-ஆல்’ என்பது துயரத்தின் சூழல்/காரணத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: துன்பச் சூழலில் πειρασμοῖς என்பதன் பொருள்
  choice: சோதனைகள்
  alternative: பரீட்சைகள்; சோதித்தல்கள்; பாவத் தூண்டுதல்கள்
  rationale: அடுத்த வசனம் விசுவாசத்தின் பரிசோதிக்கப்பட்ட தன்மையைப் பேசுவதாலும் இவ்வசனம் துயரத்தைச் சுட்டுவதாலும், வெளிப்புற நெருக்கடிகளையும் பரிசோதனையையும் உள்ளடக்கும் ‘சோதனைகள்’ சிறந்தது. இதை பாவத்திற்கான தூண்டுதல் என்று மட்டும் குறுக்கவில்லை.
- issue: εἰ δέον கூறும் அவசியத்தின் தன்மை
  choice: அவசியமானால்
  alternative: அவசியமாயிருப்பதால்; தேவன் அவசியம் என்று கருதினால்
  rationale: கிரேக்க உரை நிபந்தனைத் தொனியை வைத்திருக்கிறது; அந்த அவசியத்தை நேரடியாகத் தேவனுடைய தீர்மானம் என விரிவுபடுத்தவில்லை. ஆகவே இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. ‘பேருவகை’ தீவிர மகிழ்ச்சியைச் சுமக்கிறது; ‘அவசியமானால்’ மூலத்தின் நிபந்தனைத் தொனியைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘சோதனைகள்’ என்பதற்குப் பின்னர் வைக்கப்பட்டது.
