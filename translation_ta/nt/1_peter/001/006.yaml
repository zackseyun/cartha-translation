base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: ta
  text: இதில் நீங்கள் பேருவகை கொள்கிறீர்கள்; இப்போது சிறிது காலத்திற்கு, அவசியமானால், பலவகையான சோதனைகளால் துயருற்றிருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதனைகள்” என்பதற்கான கிரேக்கச் சொல் சூழலுக்கேற்ப “பரிசோதனைகள்” அல்லது “பாவத் தூண்டுதல்கள்” என்றும் பொருள்படலாம்.
