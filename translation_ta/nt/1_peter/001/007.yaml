  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘விசுவாசம்’, ‘மகிமை’, ‘கனம்’, ‘அக்கினி’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வாக்கியத்தின் ஒப்பீடும் இறுதிக்காலத் திறந்த பொருளும் பாதுகாக்கப்பட்டுள்ளன.
