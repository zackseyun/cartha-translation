source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: ta
  text: அழிந்துபோகும் பொன் அக்கினியால் சோதிக்கப்பட்டாலும், அதைவிட அதிக மதிப்புமிக்க உங்கள் விசுவாசத்தின் நிரூபிக்கப்பட்ட உண்மைத்தன்மை[a], இயேசு மெசியா வெளிப்படும் வேளையில் புகழும் மகிமையும் கனமும் விளைவிப்பதாகக் காணப்படுவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் விசுவாசத்தின் சோதனை.” கிரேக்கச் சொல் சோதிக்கும் செயல்முறையையோ, சோதனையால் நிரூபிக்கப்பட்ட உண்மைத்தன்மையையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: நிரூபிக்கப்பட்ட உண்மைத்தன்மை
  rationale: சோதிக்கும் செயல்முறையை மட்டும் அல்லாமல், சோதனையால் உண்மையானது என நிரூபிக்கப்பட்ட பண்பை இச்சொல் இங்கு முன்னிறுத்துகிறது; பொன்னுடனான ஒப்பீட்டிற்கும் இது பொருந்துகிறது.
- source_word: πίστεως
  choice: விசுவாசத்தின்
  rationale: இங்கு விசுவாசிகளின் விசுவாசமே சோதிக்கப்படுவதால், நவீனத் தமிழ் வேதாகம நடையில் இயல்பான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: πολυτιμότερον
  choice: அதிக மதிப்புமிக்க
  rationale: பொன்னைவிட மேலான மதிப்பைக் குறிக்கும் ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: χρυσίου
  choice: பொன்
  rationale: ஒப்பீட்டில் வரும் மூலச்சொல்லின் நேரடியான பொருள்.
- source_word: ἀπολλυμένου
  choice: அழிந்துபோகக்கூடியதாக
  rationale: சோதிக்கப்பட்ட பொனும் நிலையானதல்ல என்ற முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: διὰ πυρὸς δὲ δοκιμαζομένου
  choice: அக்கினியால் சோதிக்கப்படும் ... இருந்தாலும்
  rationale: δὲ-யின் concessive நுணுக்கத்தையும் அக்கினி சோதனையின் கருவியாக இருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὑρεθῇ εἰς
  choice: விளைவிப்பதாகக் காணப்படுவதற்காக
  rationale: செயப்பாட்டு வடிவமான ‘காணப்படுதல்’ என்பதையும், εἰς குறிக்கும் முடிவு அல்லது விளைவையும் பாதுகாக்கிறது.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: புகழும் மகிமையும் கனமும்
  rationale: மூன்று பெயர்ச்சொற்களின் உச்சநிலைத் தொடரைத் தக்கவைக்கிறது; அவை யாருக்கு உரியவை என்பதை உரை குறிப்பிடாததால் அதையும் திறந்தே விடுகிறது.
- source_word: ἐν ἀποκαλύψει
  choice: வெளிப்படும்போது
  rationale: இங்கு இயல்பாகத் தோன்றும் காலப்பொருளை நவீனத் தமிழில் தெளிவாக்குகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளான ‘மெசியா’வை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸ δοκίμιον ὑμῶν τῆς πίστεως என்பதன் பொருள்
  choice: சோதனையால் நிரூபிக்கப்பட்ட விசுவாசத்தின் உண்மைத்தன்மை
  alternative: உங்கள் விசுவாசத்தின் சோதனை
  rationale: δοκίμιον சோதனைச் செயல்முறையையும் குறிக்கக்கூடியதாயினும், இச்சூழலில் சோதனையிலிருந்து வெளிப்படும் நிரூபிக்கப்பட்ட பண்பு முதன்மையாகத் தெரிகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘புகழும் மகிமையும் கனமும்’ யாருக்குரியவை
  choice: பெறுபவர் அல்லது மூலத்தை வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  alternative: விசுவாசிகளுக்கு வழங்கப்படும் கனம்; அல்லது தேவன்/மெசியாவுக்கு செலுத்தப்படும் புகழ்
  rationale: கிரேக்க உரை இத்தொடரின் பெறுபவர் அல்லது மூலத்தைத் தெளிவாகக் குறிப்பிடவில்லை; ஆகவே இறையியல் சார்ந்த ஒரு விளக்கத்தை மொழிபெயர்ப்பில் திணிக்கவில்லை.
- issue: Χριστός என்ற பட்டப்பெயர்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: மூலச்சொல்லின் பட்டப்பெயர்ப் பொருளைத் தெளிவாகக் காட்டுகிறது; தமிழில் வழக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
