  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: ta
  text: அழிவுறாத, மாசற்ற, வாடாத வாரிசுச் சொத்திற்காக—அது உங்களுக்காகப் பரலோகங்களில் பாதுகாத்து வைக்கப்பட்டுள்ளது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: உரிமைச்சொத்து
  rationale: வாரிசாகப் பெறப்படும் உடைமை அல்லது பங்கைச் சுட்டும் சொல்லின் பொருளை, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἄφθαρτον
  choice: அழியாததும்
  rationale: சிதைவு அல்லது அழிவுக்கு உட்படாத தன்மையை நேரடியாகக் காட்டுகிறது.
- source_word: ἀμίαντον
  choice: மாசுபடாததும்
  rationale: கறைபடாத, தூய்மை கெடாத தன்மையைப் பாதுகாக்கிறது.
- source_word: ἀμάραντον
  choice: வாடாததுமான
  rationale: மலர் வாடுவதை அடிப்படையாகக் கொண்ட உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τετηρημένην
  choice: பாதுகாத்து வைக்கப்பட்டுள்ளது
  rationale: முன்பே காத்து வைக்கப்பட்டு, தொடர்ந்து பாதுகாப்பில் இருக்கும் நிலையை perfect passive வடிவுக்கு ஏற்ப காட்டுகிறது.
- source_word: ἐν οὐρανοῖς
  choice: பரலோகங்களில்
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவத்தைப் பாதுகாக்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்காக
  rationale: உரிமைச்சொத்து வாசகர்களுக்கென ஒதுக்கிப் பாதுகாக்கப்பட்டுள்ளது என்ற நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: εἰς κληρονομίαν என்பதன் தொடர்பும் திசைப் பொருளும்
  choice: முந்தைய வசனத்தின் ‘மறுபிறப்பளித்தார்’ என்பதோடு இணைத்து, ‘ஒரு உரிமைச்சொத்தைப் பெறுவதற்காக’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒரு உரிமைச்சொத்துக்குள்’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: εἰς என்பதன் இலக்கு/நோக்கத் தன்மையைத் தக்கவைத்தபடி தமிழில் புரியக்கூடிய வாக்கியமாக்குகிறது; உரிமைச்சொத்தின் இறையியல் இயல்பை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இவ்வசனம் கிரேக்கத்தில் முந்தைய வாக்கியத்தைத் தொடர்வதால், தமிழில் பொருள் தெளிவுக்காக முந்தைய வசனத்தின் செயற்பாடு சுருக்கமாக மீளெடுக்கப்பட்டுள்ளது.
