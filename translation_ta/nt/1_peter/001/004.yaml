revisions:
- from: அழியாததும், மாசுபடாததும், வாடாததுமான ஒரு உரிமைச்சொத்தைப் பெறுவதற்காக அவர் நமக்கு மறுபிறப்பளித்தார். அந்த உரிமைச்சொத்து உங்களுக்காகப் பரலோகங்களில் பாதுகாத்து வைக்கப்பட்டுள்ளது.
  to: அழிவுறாத, மாசற்ற, வாடாத வாரிசுச் சொத்திற்காக—அது உங்களுக்காகப் பரலோகங்களில் பாதுகாத்து வைக்கப்பட்டுள்ளது.
  rationale: Removed the unrepresented preceding-verse clause and retained this verse as a syntactic continuation, as in the Greek and English POB. Recast the inheritance term in idiomatic modern Tamil and retained the plural “heavens” and the second-person plural beneficiary.
