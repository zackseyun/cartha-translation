reference: 1 Peter 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின்[a] கடவுளும் தந்தையுமானவர் போற்றப்படுவாராக! அவர் தமது மிகுந்த இரக்கத்தின்படி, இறந்தோரிலிருந்து இயேசு மெசியா உயிர்த்தெழுந்ததன் மூலம், உயிருள்ள நம்பிக்கையை நோக்கி நம்மை மறுபடியும் பிறக்கச் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசு கிறிஸ்து.’ Χριστός என்ற கிரேக்கப் பட்டத்தின் பொருளைத் தெளிவாகக் காட்ட இங்கு ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நமக்குப் புதுப்பிறப்பு அளித்தார்.’ கிரேக்க வினைச்சொல் மறுபடியும் பிறப்பதன் உருவகத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: போற்றப்படுவாராக
  rationale: இது ஒரு வழிபாட்டுத் துதிப்புக் கூற்று. வெறும் பண்புச் சொல்லாக அல்லாமல், வாழ்த்தும் துதிக்கும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: கடவுளும் தந்தையுமானவர்
  rationale: ஒரே சுட்டுச் சொல் ஆளும் இரண்டு பெயர்களையும் தக்கவைத்து, இயேசுவோடு கடவுளுக்குள்ள உறவை மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος இங்கு மரியாதை அழைப்பு மட்டுமல்ல, அதிகாரத்தைக் குறிக்கும் பட்டம்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பொருளை மறைக்காமல் ‘மெசியா’ என்று மொழிபெயர்க்கிறது; ‘இயேசு கிறிஸ்து’ என்பது மரபுவழி மாற்று.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: தமது மிகுந்த இரக்கத்தின்படி
  rationale: κατά இங்கு அளவு அல்லது ஒத்திசைவை உணர்த்துகிறது; கடவுளின் செயல் அவரது மிகுந்த இரக்கத்திற்கு ஏற்ப நிகழ்ந்ததைத் தக்கவைக்கிறது.
- source_word: ἀναγεννήσας
  choice: நம்மை மறுபடியும் பிறக்கச் செய்தார்
  rationale: மறுபிறப்பின் உருவகத்தையும், அதை நிகழ்த்துபவர் கடவுளே என்ற வெளிப்படையான செயற்பாட்டையும் காக்கிறது.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: உயிருள்ள நம்பிக்கைக்காக
  rationale: εἰς குறிக்கும் இலக்கு அல்லது விளைவை இயல்பான தமிழில் தருகிறது; ζῶσαν என்பதன் உயிர்ப்புள்ள உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: δι’ ἀναστάσεως
  choice: உயிர்த்தெழுந்ததன் மூலம்
  rationale: διά உடன் வரும் உருபு இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது; தமிழில் வினைப்பெயர்சார் தொடராக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: உயிர்த்தெழுதல் மொழிநடையில் மூலத்தின் ‘இறந்தோரிடமிருந்து’ என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: Χριστός என்ற கிறிஸ்துவியல் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός ஒரு பொருளுள்ள பட்டம் என்பதை வெளிப்படுத்த ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; அதை வெறும் பெயரின் பகுதியாக மாற்றவில்லை.
- issue: ἀναγεννήσας என்பதில் கடவுளின் செயற்பாடு
  choice: நம்மை மறுபடியும் பிறக்கச் செய்தார்
  alternative: நமக்குப் புதுப்பிறப்பு அளித்தார்
  rationale: மூலத்தில் கடவுளே செய்பவர் என்பது வெளிப்படையாக உள்ளது. எந்த விரிவான கோட்பாட்டு அமைப்பையும் சேர்க்காமல் அந்தச் செயற்பாட்டையும் பிறப்பு உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. ‘போற்றப்படுவாராக’ துதிப்புக் கூற்றைத் தக்கவைக்கிறது; ‘இறந்தோர்’, ‘உயிர்த்தெழுதல்’ போன்ற சொற்கள் வேதாகமச் சூழலுக்கு ஏற்றவையாக இருந்தாலும் இன்றைய வாசகருக்கும் தெளிவானவை.
