revisions:
- from: நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின்[a] கடவுளும் தந்தையுமானவர் போற்றப்படுவாராக! அவர் தமது மிகுந்த இரக்கத்தின்படி, இறந்தோரிலிருந்து இயேசு மெசியா உயிர்த்தெழுந்ததன் மூலம், உயிருள்ள நம்பிக்கைக்காக நம்மை மறுபடியும் பிறக்கச் செய்தார்[b].
  to: நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின்[a] கடவுளும் தந்தையுமானவர் போற்றப்படுவாராக! அவர் தமது மிகுந்த இரக்கத்தின்படி, இறந்தோரிலிருந்து இயேசு மெசியா உயிர்த்தெழுந்ததன் மூலம், உயிருள்ள நம்பிக்கையை நோக்கி நம்மை மறுபடியும் பிறக்கச் செய்தார்[b].
  rationale: 'The only substantive revision corrects the rendering of εἰς ἐλπίδα ζῶσαν: ‘-க்காக’ is replaced with a directional expression that reflects the stated goal/result of new birth. Footnote b is polished for clarity without altering its lexical content. All other wording is retained because it faithfully and naturally represents the Greek.'
