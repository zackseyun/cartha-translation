source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: ta
  text: “ஆனால் ஆண்டவருடைய வார்த்தையோ என்றென்றும் நிலைத்திருக்கும்.” உங்களுக்கு நற்செய்தியாக அறிவிக்கப்பட்ட வார்த்தை இதுவே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குச் சுவிசேஷமாகப் பிரசங்கிக்கப்பட்ட வார்த்தை.”
    reason: εὐαγγελισθὲν என்பதன் சாத்தியமான சமய வழக்கிலான மாற்று மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: ῥῆμα
  choice: வார்த்தை
  rationale: பேசப்பட்ட சொல், உரை அல்லது செய்தி என்ற பொருள்களைத் தரும் ῥῆμα என்பதற்கு ‘வார்த்தை’ என்று மொழிபெயர்ப்பது ஏசாயா 40:8 மேற்கோளுடனான தொடர்பைக் காக்கிறது; இரு வாக்கியப் பகுதிகளிலும் ஒரே சொல்லைப் பயன்படுத்தவும் உதவுகிறது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κυρίου என்பது ‘ஆண்டவருடைய’ என்ற உடைமைப் பொருளைத் தருகிறது. புதிய ஏற்பாட்டின் κύριος என்ற சொல்லை இயல்பான, மரியாதையான தமிழில் இது வழங்குகிறது.
- source_word: μένει
  choice: நிலைத்திருக்கும்
  rationale: μένω இங்கு தொடர்ந்து மாறாமல் இருப்பதைக் குறிக்கிறது. ‘நிலைத்திருக்கும்’ என்பது நீடித்த நிலைப்பாட்டையும் எதிர்காலத்திற்கும் தொடரும் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: இந்த மரபுத்தொடர் முடிவில்லாத காலநீட்சியைக் குறிக்கிறது; ‘என்றென்றும்’ என்பது அதன் இயல்பான நவீனத் தமிழ் இணை.
- source_word: τοῦτο δέ ἐστιν
  choice: இதுவே
  rationale: δέ இங்கு மென்மையான தொடர்ச்சியைக் காட்டுகிறது. தமிழில் தனியே ஓர் இணைப்புச்சொல்லைச் சேர்க்காமல் ‘இதுவே’ என வலியுறுத்துவது மேற்கோளிலுள்ள வார்த்தையையும் அடுத்து அடையாளப்படுத்தப்படும் நற்செய்தியையும் இயல்பாக இணைக்கிறது.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: நற்செய்தியாக அறிவிக்கப்பட்ட வார்த்தை
  rationale: εὐαγγελίζω என்ற வினையின் ‘நற்செய்தியை அறிவித்தல்’ என்னும் வினைச்செயல் பொருளை வெளிப்படையாகக் காக்கிறது; ‘வார்த்தை’ என்பதையும் மேற்கோளிலிருந்து தொடர்கிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்கு
  rationale: εὐαγγελίζω என்பதுடன் வரும் εἰς + வேற்றுமை வடிவம் செய்தி கேட்பவர்களை நோக்கிச் சென்றதைக் குறிக்கிறது; ‘உங்களுக்கு’ என்பது தமிழில் நேரடியும் இயல்புமான வடிவம்.
theological_decisions:
- issue: ஏசாயா 40:8 மேற்கோளிலுள்ள ‘ஆண்டவருடைய வார்த்தை’க்கும் வாசகர்களுக்கு அறிவிக்கப்பட்ட நற்செய்திக்கும் உள்ள தொடர்பு
  choice: முதல் பகுதியில் ‘ஆண்டவருடைய வார்த்தை’ என்பதை அப்படியே வைத்து, இரண்டாம் பகுதியில் அதையே வாசகர்களுக்கு நற்செய்தியாக அறிவிக்கப்பட்ட வார்த்தை என்று அடையாளப்படுத்துதல்.
  alternative: இரு இடங்களிலும் விளக்கமாக ‘ஆண்டவரிடமிருந்து வந்த செய்தி’ என்று மொழிபெயர்த்தல்.
  rationale: இவ்வாறு மொழிபெயர்ப்பது வேதாகம மேற்கோளின் சொல் எதிரொலியையும் பேதுருவின் நற்செய்திப் பயன்பாட்டையும் காக்கிறது; மேற்கோளையும் அதன் பயன்பாட்டையும் விளக்கவுரையாக ஒன்றாக்கிவிடுவதில்லை.
- issue: εὐαγγελισθὲν என்பதன் மொழிபெயர்ப்பு
  choice: ‘நற்செய்தியாக அறிவிக்கப்பட்ட’ என்று வினைச்செயல் வடிவில் மொழிபெயர்த்தல்.
  alternative: ‘சுவிசேஷமாகப் பிரசங்கிக்கப்பட்ட’ அல்லது வெறுமனே ‘பிரசங்கிக்கப்பட்ட’ என்று மொழிபெயர்த்தல்.
  rationale: இந்தத் தேர்வு εὐαγγελίζω என்பதிலுள்ள ‘நற்செய்தி’ பொருளையும் அறிவிக்கும் செயற்பாட்டையும் தெளிவாக வெளிப்படுத்துகிறது; கூடுதல் சமய மரபுச் சொற்களைச் சார்ந்திருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம மேற்கோளுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வார்த்தை’ இரு பகுதிகளிலும் மீள வருவதன் மூலம் மூலத்தின் சொல் தொடர்பு பாதுகாக்கப்பட்டுள்ளது; ‘நற்செய்தியாக அறிவிக்கப்பட்ட’ என்பது சாதாரண வாசகர்களுக்கும் தெளிவான வடிவம்.
