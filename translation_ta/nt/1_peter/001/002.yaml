- from: 'பிதாவாகிய தேவனுடைய முன்அறிவின்படி[b], ஆவியானவரின் பரிசுத்தமாக்கும் செயலால், கீழ்ப்படிதலுக்காகவும் இயேசு மெசியாவின்[a] இரத்தம் தெளிக்கப்படுவதற்காகவும் தேர்ந்தெடுக்கப்பட்டவர்கள். கிருபையும் சமாதானமும் உங்களுக்குப் பெருகட்டும்.


    [a] “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லான Χριστός சில சூழல்களில் பெயரைப்போலப் பயன்படுத்தப்படலாம்; இங்கு அதன் பட்டப்பெயர் சார்ந்த பொருளைத் தக்கவைக்க “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.

    [b] “முன்அறிவு” என்பது πρόγνωσις என்ற கிரேக்கச் சொல்லின் மொழிபெயர்ப்பு. இது தேவனுடைய முன்னறிதலை வலியுறுத்துகிறதா, அவரது முன்தேர்வை வலியுறுத்துகிறதா, அல்லது இரண்டையும் குறிக்கிறதா என்பதில் விளக்கவுரையாளர்களிடையே கருத்து வேறுபாடு உள்ளது.

    [c] “இரத்தம் தெளிக்கப்படுதல்”[c] என்ற சொற்றொடர் பழைய ஏற்பாட்டின் உடன்படிக்கை மற்றும் தூய்மைப்படுத்துதல் சார்ந்த உருவகங்களை, குறிப்பாக யாத்திராகமம் 24:8-ஐ, நினைவூட்டுவதாக இருக்கலாம்.'
  to: பிதாவாகிய தேவனுடைய முன்அறிவின்படி[b], ஆவியானவரால் பரிசுத்தமாக்கப்படுவதில், கீழ்ப்படிதலுக்கும் இயேசு மெசியாவின்[a] இரத்தம் தெளிக்கப்படுதலுக்கும்[c]. கிருபையும் சமாதானமும் உங்களுக்குப் பெருகட்டும்.
  rationale: வசனம் 1-இலிருந்து சேர்க்கப்பட்ட சொல்லை நீக்கி, 1:2-ல் உள்ள தொடர்ச்சியான சொற்றொடர் அமைப்பைத் தக்கவைத்துள்ளேன். ἐν ἁγιασμῷ πνεύματος-ஐ ஆவியானவரின் பரிசுத்தமாக்கும் பணியைக் குறிக்கும் இயல்பான தமிழில் அளித்துள்ளேன். ῥαντισμὸν αἵματος-ஐ “இரத்தம் தெளிக்கப்படுதல்” என வைத்துப் [c] அடிக்குறிப்பை அதன் இடத்தில் இணைத்துள்ளேன். πρόγνωσις குறித்த விவாதத்தையோ கீழ்ப்படிதலின் குறிப்பிடப்படாத இலக்கையோ மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
