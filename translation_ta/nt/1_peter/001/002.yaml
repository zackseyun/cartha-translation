source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: ta
  text: பிதாவாகிய தேவனுடைய முன்அறிவின்படி[b], ஆவியானவரால் பரிசுத்தமாக்கப்படுவதில், கீழ்ப்படிதலுக்கும் இயேசு மெசியாவின்[a] இரத்தம் தெளிக்கப்படுதலுக்கும்[c]. கிருபையும் சமாதானமும் உங்களுக்குப் பெருகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லான Χριστός சில சூழல்களில் பெயரைப்போலப் பயன்படுத்தப்படலாம்; இங்கு அதன் பட்டப்பெயர் சார்ந்த பொருளைத் தக்கவைக்க “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “முன்அறிவு” என்பது πρόγνωσις என்ற கிரேக்கச் சொல்லின் மொழிபெயர்ப்பு. இது தேவனுடைய முன்னறிதலை வலியுறுத்துகிறதா, அவரது முன்தேர்வை வலியுறுத்துகிறதா, அல்லது இரண்டையும் குறிக்கிறதா என்பதில் விளக்கவுரையாளர்களிடையே கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “இரத்தம் தெளிக்கப்படுதல்” என்ற சொற்றொடர் பழைய ஏற்பாட்டின் உடன்படிக்கை மற்றும் தூய்மைப்படுத்துதல் சார்ந்த உருவகங்களை, குறிப்பாக யாத்திராகமம் 24:8-ஐ, நினைவூட்டுவதாக இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: முன்அறிவின்படி
  rationale: κατά என்பதன் அளவுகோல் அல்லது ஒத்திசைவு சார்ந்த பொருளையும், πρόγνωσις என்பதிலுள்ள விவாதத்திற்குரிய ‘முன்அறிவு’ என்ற பொருளையும் எந்த ஒரு இறையியல் விளக்கமாகவும் விரித்துரைக்காமல் தக்கவைக்கிறது.
- source_word: θεοῦ πατρός
  choice: பிதாவாகிய தேவனுடைய
  rationale: தேவனும் பிதாவும் ஒருவரையே குறிக்கும் இணைப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: ஆவியானவரின் பரிசுத்தமாக்கும் செயலால்
  rationale: ἁγιασμός என்பதன் பரிசுத்தமாக்குதல் சார்ந்த செயற்பொருளையும், இங்கு πνεῦμα பரிசுத்த ஆவியானவரைக் குறிக்கும் மும்மை அமைப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς ὑπακοὴν
  choice: கீழ்ப்படிதலுக்காக
  rationale: εἰς குறிக்கும் நோக்கம் அல்லது விளைவைத் தக்கவைக்கிறது; கீழ்ப்படிதலின் குறிப்பிட்ட பொருளை உரையில் சேர்க்கவில்லை.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: இரத்தம் தெளிக்கப்படுவதற்காகவும்
  rationale: ῥαντισμός என்பதிலுள்ள தெளித்தல் என்ற உடன்படிக்கை மற்றும் தூய்மைப்படுத்துதல் சார்ந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த வலிமையை ‘மெசியா’ என்பதன் மூலம் தக்கவைத்து, மரபான ‘கிறிஸ்து’ என்பதை அடிக்குறிப்பில் மாற்றாக அளிக்கிறது.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: கிருபையும் சமாதானமும் உங்களுக்குப் பெருகட்டும்
  rationale: வாழ்த்தும் விருப்பத்தைக் குறிக்கும் optative வினையின் வலிமையை இயல்பான தமிழ் ஆசீர்வாத நடையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேர்ந்தெடுத்தலுடன் πρόγνωσις கொண்டுள்ள தொடர்பு
  choice: முன்அறிவு
  alternative: முன்நியமனம் / முன்தேர்வு
  rationale: கிரேக்கச் சொல் கொண்டுள்ள இறையியல் பதற்றத்தைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: πνεύματος என்பதன் குறிப்பு
  choice: ஆவியானவர்
  alternative: மனித ஆவி அல்லது பொதுவான ஆவிக்குரிய நிலை
  rationale: பிதாவாகிய தேவன், ஆவியானவர், இயேசு மெசியா என்ற மும்மை அமைப்பு பரிசுத்த ஆவியானவரைக் குறிப்பதை வலுவாக ஆதரிக்கிறது.
- issue: Χριστοῦ என்பதன் வலிமை
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் பட்டப்பெயர் சார்ந்த பொருளை வெளிப்படையாகத் தக்கவைக்கிறது; வழக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὑπακοή என்பதன் இலக்கு
  choice: கீழ்ப்படிதல் என்று மட்டும் மொழிபெயர்த்து, யாருக்குக் கீழ்ப்படிதல் என்பதைச் சேர்க்கவில்லை
  alternative: இயேசு மெசியாவுக்குக் கீழ்ப்படிதல்
  rationale: மூலத்தில் கீழ்ப்படிதலின் இலக்கு வெளிப்படையாகக் கூறப்படாததால், மொழிபெயர்ப்பு அதை நிரப்பவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வேதாகம நடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கிருபை’, ‘சமாதானம்’, ‘பரிசுத்தமாக்குதல்’, ‘மெசியா’ போன்ற பரவலாக அறியப்பட்ட இறையியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் 1-இலிருந்து தொடரும் இலக்கண அமைப்பை நிறைவு செய்ய ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ சேர்க்கப்பட்டுள்ளது.
