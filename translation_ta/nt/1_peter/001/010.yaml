source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: ta
  text: இந்த இரட்சிப்பைக் குறித்து, உங்களுக்கான அருளைப் பற்றி[a] இறைவாக்குரைத்த தீர்க்கதரிசிகள் தீவிரமாகத் தேடி, நுணுக்கமாக ஆராய்ந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு வரவிருந்த அருளைப் பற்றி.” எதிர்காலப் பொருள் சூழலிலிருந்து உணரப்பட்டாலும், இவ்வசனத்தில் அது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: alternative_reading
  - marker: b
    text: “தீவிரமாகத் தேடி, நுணுக்கமாக ஆராய்ந்தார்கள்” என்று வரும் இரு வினைகளும் தீர்க்கதரிசிகளின் தீவிரமான தேடலையும் முழுமையான ஆய்வையும் வலியுறுத்துகின்றன.
    reason: source_expression
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: இந்த இரட்சிப்பைக் குறித்து
  rationale: περί உடன் வரும் மரபுவேற்றுமை இங்கு பேசுபொருளைக் குறிக்கிறது. ἧς முன்பு குறிப்பிடப்பட்ட இரட்சிப்பைச் சுட்டுவதால், இயல்பான தமிழில் ‘இந்த இரட்சிப்பு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: σωτηρίας
  choice: இரட்சிப்பு
  rationale: இச்சூழலில் σωτηρία என்பது தேவன் அளிக்கும் மீட்பையும் முழுமையான இரட்சிப்பையும் குறிக்கிறது; சுற்றியுள்ள வசனங்களுடனான கருத்துத் தொடர்ச்சியையும் ‘இரட்சிப்பு’ காக்கிறது.
- source_word: ἐξεζήτησαν
  choice: ஊக்கமாகத் தேடி
  rationale: ἐκζητέω அக்கறையுடனும் முனைப்புடனும் தேடுவதைக் குறிக்கிறது. அடுத்த வினையிலிருந்து வேறுபடுத்திக் காட்ட ‘ஊக்கமாகத் தேடி’ என வழங்கப்பட்டுள்ளது.
- source_word: ἐξηραύνησαν
  choice: நுணுக்கமாக ஆராய்ந்தார்கள்
  rationale: ἐξεραυνάω முழுமையாகத் துருவி ஆராயும் பொருளைக் கொண்டது. முதல் வினையுடன் சேர்ந்து வரும் வலுப்படுத்தலை இச்சொற்றொடர் காக்கிறது.
- source_word: προφῆται
  choice: தீர்க்கதரிசிகள்
  rationale: தொடர்ந்து வரும் பெயரெச்சத் தொடர் எந்தத் தீர்க்கதரிசிகள் என்பதைக் குறிப்பாக்குகிறது. வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ‘தீர்க்கதரிசிகள்’ இயல்பான தேர்வு.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: உங்களுக்கான அருளைப் பற்றி இறைவாக்குரைத்த தீர்க்கதரிசிகள்
  rationale: பெயரெச்சத் தொடர் தீர்க்கதரிசிகளை விவரிக்கிறது; περί தீர்க்கதரிசனத்தின் பொருளைக் குறிக்கிறது. εἰς ὑμᾶς என்பதன் திசை மற்றும் பயன் சார்ந்த நுணுக்கத்தை ‘உங்களுக்கான’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χάριτος
  choice: அருள்
  rationale: இரட்சிப்பு வரலாற்றுச் சூழலில் χάρις தேவனுடைய இலவசமான தயவையும் நன்மையையும் குறிக்கிறது; ‘அருள்’ அதன் வேதாகம மற்றும் இறையியல் நிறையைப் பேணுகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்கான
  rationale: εἰς இங்கு வாசகர்களை நோக்கிய திசையையும் அவர்களுக்குக் கிடைக்கும் நன்மையையும் கொண்டுள்ளது. ‘உங்களுக்கான’ என்பது எதிர்காலத்தை வெளிப்படையாகச் சேர்க்காமல் இந்த உறவைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ‘உங்களுக்கான அருள்’ என்பதில் எதிர்காலக் கருத்தை வெளிப்படையாகச் சேர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘உங்களுக்கான அருள்’ என்று மட்டும் வைத்தல்
  alternative: ‘உங்களுக்கு வரவிருந்த அருள்’
  rationale: தீர்க்கதரிசிகளின் முன்னோக்கிய பார்வையாலும் விரிந்த சூழலாலும் எதிர்காலப் பொருள் உணரப்படுகிறது. ஆனால் இவ்வசனத்தின் கிரேக்க உரையில் எதிர்காலத்தைக் குறிக்கும் வினை அல்லது பெயரெச்சம் வெளிப்படையாக இல்லை; ஆகவே அதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டுள்ளது. ‘இறைவாக்குரைத்த’ என்பது προφητεύσαντες என்ற வினைச்செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘தீர்க்கதரிசிகள்’ என்ற பரவலாக அறியப்பட்ட சொல்லும் தக்கவைக்கப்பட்டுள்ளது.
