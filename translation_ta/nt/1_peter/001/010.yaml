revisions:
- from: இந்த இரட்சிப்பைக் குறித்து, உங்களுக்கான அருளைப் பற்றி[a] இறைவாக்குரைத்த தீர்க்கதரிசிகள் ஊக்கமாகத் தேடி, நுணுக்கமாக ஆராய்ந்தார்கள்.[b]
  to: இந்த இரட்சிப்பைக் குறித்து, உங்களுக்கான அருளைப் பற்றி[a] இறைவாக்குரைத்த தீர்க்கதரிசிகள் தீவிரமாகத் தேடி, நுணுக்கமாக ஆராய்ந்தார்கள்.[b]
  rationale: The revision replaces only the potentially misleading adverb “ஊக்கமாக” with “தீவிரமாக.” It retains the two coordinated Greek verbs distinctly, the attribution of the participial phrase to “தீர்க்கதரிசிகள்,” and the source-text restraint concerning any future sense of grace.
