theological_decisions:
- issue: கடவுளின் பரிசுத்தத்துக்கும் விசுவாசிகளுக்கான அழைப்புக்கும் உள்ள தொடர்பு
  choice: உங்களை அழைத்தவர் பரிசுத்தராய் இருப்பதுபோல ... பரிசுத்தராய் இருங்கள்
  alternative: உங்களை அழைத்த பரிசுத்தரைப் போல ... பரிசுத்தராய் இருங்கள்
  rationale: கிரேக்கத்தில் அழைத்தவரைக் குறிக்கும் ἅγιον மற்றும் விசுவாசிகளைக் குறிக்கும் ἅγιοι ஆகியவற்றின் திட்டமிட்ட தொடர்பைத் தெளிவாகக் காக்கிறது; அதேவேளை ‘பரிசுத்தர்’ என்பதை பெயர்ப்பட்டமாக மட்டும் மாற்றாமல் அதன் பண்புப்பொருளை வெளிப்படுத்துகிறது.
- issue: γενήθητε என்ற கட்டளையின் வலிமை
  choice: பரிசுத்தராய் இருங்கள்
  alternative: பரிசுத்தராகுங்கள்
  rationale: குறிப்பிட்ட பரிசுத்தமாக்கல் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்காமல் நேரடியான அறவுறுத்தலைக் காக்கிறது. ‘ஆகுங்கள்’ என்ற நிலைக்குள் வருதலின் சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தர்/பரிசுத்தராய்’ என்ற மரபில் நன்கு அறியப்பட்ட சொல்லைத் தக்கவைத்து, மூலத்தின் சொல்லியல் மறுபயன்பாடு பாதுகாக்கப்பட்டுள்ளது.
