id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: ta
  text: 'இயேசு மெசியாவின் அப்போஸ்தலனாகிய பேதுரு, பொந்து, கலாத்தியா, கப்பத்தோக்கியா, ஆசியா, பித்தினியா ஆகிய பகுதிகளில் சிதறுண்டிருக்கும் தேர்ந்தெடுக்கப்பட்ட அந்நியர்களுக்கு[a][b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்நியர்கள்” என்பதற்கு “பரதேசிகள்” அல்லது “தற்காலிகமாகத் தங்கியிருப்பவர்கள்” என்றும் மொழிபெயர்க்கலாம். “சிதறுண்டிருக்கும்” என்பது யூதப் புலம்பெயர்வையும், தங்கள் உண்மையான தாயகத்துக்கு வெளியே வாழும் கடவுளுடைய மக்களையும் நினைவூட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “இயேசு மெசியா” என்பதற்கு மரபாக “இயேசு கிறிஸ்து” என்றும் வழங்கப்படுகிறது. இங்கே “மெசியா” என்பது ஒரு பட்டம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: புதிய ஏற்பாட்டில் அதிகாரப்பூர்வமாக அனுப்பப்பட்டவரைக் குறிக்கும் நிலைபெற்ற பட்டத்தைப் பாதுகாக்கிறது; பொதுவான ‘தூதர்’ என்பதைக் காட்டிலும் இச்சூழலுக்குத் துல்லியமானது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பொருளான ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்பதை வெளிப்படுத்துகிறது; ‘கிறிஸ்து’ என்ற மாற்று வடிவமும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκλεκτοῖς
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: தேர்வு செய்யப்பட்டவர்கள் என்ற கிரேக்கப் பொருளை இயல்பான தமிழில் தருகிறது; குறிப்பிட்ட ஓர் இறையியல் அமைப்பைத் திணிப்பதில்லை.
- source_word: παρεπιδήμοις
  choice: அந்நியக் குடியிருப்பாளர்கள்
  rationale: தமது சொந்த ஊரல்லாத இடத்தில் தற்காலிகமாக அல்லது அந்நியராக வசிப்போர் என்ற சமூக நிலையைப் பாதுகாக்கிறது; ‘பரதேசிகள்’ என்பது மாற்றாகக் குறிப்பிடப்படுகிறது.
- source_word: διασπορᾶς
  choice: சிதறி வாழும்
  rationale: διασπορά குறிக்கும் சிதறுண்ட வாழ்வை இயல்பான தமிழில் தெரிவிக்கிறது; யூதப் புலம்பெயர்வையும் கடவுளுடைய மக்கள் தங்கள் உண்மையான தாயகத்துக்கு வெளியே வாழ்வதையும் சுட்டக்கூடிய இரட்டைப் பின்னொலியைத் திறந்தே வைக்கிறது.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: பொந்து, கலாத்தியா, கப்பத்தோக்கியா, ஆசியா, பித்தினியா
  rationale: அக்காலப் புவியியல் மற்றும் ரோம மாகாணப் பெயர்களுக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்புகள்; ‘ஆசியா’ இங்கே அக்கால ரோம மாகாணத்தைக் குறிக்கிறது.
theological_decisions:
- issue: ἐκλεκτοῖς என்பதன் பொருள்
  choice: தேர்ந்தெடுக்கப்பட்ட
  alternative: தெரிந்துகொள்ளப்பட்ட / தேர்ந்துகொள்ளப்பட்ட மக்கள்
  rationale: கடவுளுடைய தேர்வை உறுதிப்படுத்தினாலும், அதன் முறையைப் பற்றிய எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் வசனத்துக்குள் சேர்க்கவில்லை.
- issue: παρεπιδήμοις διασπορᾶς என்ற தொடரின் தொடர்பும் பொருளும்
  choice: சிதறி வாழும், தேர்ந்தெடுக்கப்பட்ட அந்நியக் குடியிருப்பாளர்கள்
  alternative: சிதறலுக்குரிய தேர்ந்தெடுக்கப்பட்ட பரதேசிகள்
  rationale: இது நேரடியான சமூக-புவியியல் அடையாளமா, ஆவிக்குரிய உருவகமா, அல்லது இரண்டும் சேர்ந்ததா என்பதை முடிவுசெய்யாமல் கிரேக்கத்தின் பொருள் நெருக்கடியைப் பாதுகாக்கிறது.
- issue: Χριστοῦ என்பதன் பட்டப்பொருள்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός என்பதிலுள்ள மெசியப் பட்டப்பொருளை முதன்மைப்படுத்துகிறது; தமிழில் பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ வடிவத்தை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடிதத்தின் முகப்புரைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் நீண்ட பெயர்ச்சொல் தொடரை வாசிப்பிற்கு இயல்பாக மறுவரிசைப்படுத்தியுள்ளோம்; ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’, ‘அந்நியக் குடியிருப்பாளர்கள்’, ‘சிதறி வாழ்பவர்கள்’ ஆகிய அடையாளங்களுக்கிடையிலான திட்டமிட்ட தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
