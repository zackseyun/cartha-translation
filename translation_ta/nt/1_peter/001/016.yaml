  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: ta
  text: ஏனெனில், “நீங்கள் பரிசுத்தராக இருப்பீர்கள்; ஏனெனில் நான் பரிசுத்தமானவர்” என்று எழுதப்பட்டிருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதன் கட்டளைப் பொருளை நேரடியாகக் காட்டும் வகையில், “பரிசுத்தராயிருங்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் வேத மேற்கோளுக்கேற்ப எதிர்கால வடிவம், “பரிசுத்தராக இருப்பீர்கள்,” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான வேதவசன அடிப்படையை அறிமுகப்படுத்தும் காரணத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் நிறைவேற்றப்பட்ட செயப்பாட்டு வடிவத்தின் நிலைத்த விளைவைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὅτι (முதல்)
  choice: என்று
  rationale: நேரடி மேற்கோளை அறிமுகப்படுத்தும் கிரேக்க இணைப்புச் சொல்லின் பணியைத் தமிழில் மேற்கோளுக்குப் பிந்தைய ‘என்று’ இயல்பாக நிறைவேற்றுகிறது.
- source_word: Ἅγιοι
  choice: பரிசுத்தராக
  rationale: இங்கு கடவுளுடைய இயல்போடு தொடர்புபடுத்தப்படும் நெறி மற்றும் உடன்படிக்கைச் சார்ந்த பரிசுத்தத்தைக் குறிக்கிறது; ‘தனியாகப் பிரிக்கப்பட்டவர்’ என்பது பொருளை அளவுக்கு மீறிக் குறுக்கும்.
- source_word: ἔσεσθε
  choice: இருப்பீர்கள்
  rationale: லேவியராகம மேற்கோளின் எதிர்கால வடிவத்தைப் பாதுகாக்கிறது; சூழலில் அதற்கு கட்டளையின் வலிமை இருப்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ὅτι (இரண்டாம்)
  choice: இருப்பதால்
  rationale: மக்கள் பரிசுத்தராக இருக்க வேண்டியதற்கான காரணம் கடவுளுடைய பரிசுத்தமே என்பதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: மேற்கோளில் உள்ள வலியுறுத்தப்பட்ட தெய்வீகத் தற்சுட்டைத் தக்கவைக்கிறது.
- source_word: ἅγιος
  choice: பரிசுத்தராக
  rationale: முந்தைய Ἅγιοι என்பதுடன் சொல் ஒற்றுமையைப் பேணி, மக்களின் பரிசுத்தம் கடவுளுடைய பரிசுத்தத்தில் அடிப்படைகொள்வதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பரிசுத்தத்தைப் பற்றிய மேற்கோளில் ἔσεσθε என்ற எதிர்கால வடிவத்தின் வலிமை
  choice: “பரிசுத்தராக இருப்பீர்கள்” என்று எதிர்கால வடிவில் மொழிபெயர்த்து, அதன் வேத மேற்கோள் வடிவத்தைப் பாதுகாத்தல்
  alternative: “பரிசுத்தராயிருங்கள்” என்ற நேரடிக் கட்டளை அல்லது “பரிசுத்தராவீர்கள்” என்ற வெறும் முன்னறிவிப்பு
  rationale: கிரேக்கம் லேவியராகமத்தின் எதிர்கால வடிவத்தைக் கொண்ட மேற்கோளைப் பின்பற்றுகிறது; வேதாகமச் சட்ட/அறிவுறுத்தல் நடையில் அது கட்டளை வலிமையையும் கொண்டிருக்கலாம். முதன்மை உரை வடிவத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் கட்டளைப் பொருளைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தம்’ என்ற பரவலாக அறியப்பட்ட இறையியல் சொல்லைத் தக்கவைத்து, கிரேக்க எதிர்கால வடிவத்துக்கும் அதன் கட்டளை வலிமைக்கும் இடையிலான உண்மையான பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
