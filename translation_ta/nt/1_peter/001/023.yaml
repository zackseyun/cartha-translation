  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: ta
  text: அழிந்துபோகும் விதையிலிருந்து அல்ல, அழிவில்லாத விதையிலிருந்து—உயிருள்ளதும் நிலைத்திருப்பதுமான கடவுளுடைய வார்த்தையின் மூலம்—நீங்கள் மறுபடியும் பிறந்திருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ளவரும் நிலைத்திருப்பவருமான கடவுளுடைய வார்த்தையின் மூலம்.” ‘உயிருள்ள’ மற்றும் ‘நிலைத்திருக்கும்’ என்பவற்றுக்கான கிரேக்கப் பங்கேற்புச் சொற்கள் ‘வார்த்தை’ என்பதையோ ‘கடவுள்’ என்பதையோ விவரிக்கலாம்; ஆனால் சூழல் அவை ‘வார்த்தை’ என்பதையே விவரிப்பதை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: மறுபடியும் பிறப்பிக்கப்பட்டிருக்கிறீர்கள்
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவும் அடங்கிய perfect passive participle-இன் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. செயப்பாட்டு வடிவமும் மறுபிறப்பு உருவகமும் காக்கப்படுகின்றன.
- source_word: σπορᾶς
  choice: விதையினால்
  rationale: பிறப்பு உருவகத்துக்கும் அழிந்துபோகும்/அழிவில்லாத என்ற எதிர்மறை இணைக்கும் இயல்பாகப் பொருந்துகிறது; கருவியைக் குறிக்கும் கருத்தையும் வேற்றுமை உருபு வெளிப்படுத்துகிறது.
- source_word: φθαρτῆς
  choice: அழிந்துபோகும்
  rationale: சிதைவு அல்லது அழிவுக்கு உட்படுவதைத் தெளிவான தற்போதைய தமிழில் தெரிவிக்கிறது.
- source_word: ἀφθάρτου
  choice: அழிவில்லாத
  rationale: φθαρτῆς என்பதுடன் உள்ள நேரடியான எதிரிணையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: διὰ
  choice: மூலம்
  rationale: Genitive உடன் வரும் διά இங்கே வழிமுறை அல்லது கருவியைக் குறிக்கிறது; ‘மூலம்’ இயல்பான தமிழ் இணை.
- source_word: λόγου
  choice: வார்த்தை
  rationale: λόγος என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; அடுத்த வசனத்தின் மேற்கோளிலும் நீடிக்கும் ‘வார்த்தை’ கருத்துடன் பொருந்துகிறது.
- source_word: ζῶντος
  choice: உயிருள்ளதும்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடரும் பண்பை நேரடியாகக் காட்டி, முதன்மை வாசிப்பில் ‘வார்த்தை’ என்பதைக் குறிப்பிடுகிறது.
- source_word: θεοῦ
  choice: கடவுளுடைய
  rationale: λόγου-ஐச் சார்ந்த genitive ஆக ‘கடவுளுடைய வார்த்தை’ என்ற உடைமை/மூல உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μένοντος
  choice: நிலைத்திருப்பதுமான
  rationale: தொடர்ந்து இருப்பது, நீடிப்பது என்ற durative பொருளைப் பாதுகாக்கிறது; உடனடியான சூழலில் வார்த்தை நிலைத்திருப்பதை வலியுறுத்துவதற்கும் பொருந்துகிறது.
theological_decisions:
- issue: ζῶντος மற்றும் μένοντος ஆகிய இரண்டும் λόγου என்பதையா, θεοῦ என்பதையா விவரிக்கின்றன?
  choice: ‘உயிருள்ளதும் நிலைத்திருப்பதுமான கடவுளுடைய வார்த்தை’—இரு பெயரெச்சங்களும் ‘வார்த்தை’ என்பதைக் குறிப்பிடுகின்றன.
  alternative: ‘உயிருள்ளவரும் நிலைத்திருப்பவருமான கடவுளுடைய வார்த்தை’—இரு பெயரெச்சங்களும் ‘கடவுள்’ என்பதைக் குறிப்பிடுகின்றன.
  rationale: கிரேக்கத்தில் இரு தொடர்புகளும் இலக்கணரீதியாகச் சாத்தியமானவை. எனினும் அடுத்துள்ள 1 பேதுரு 1:25-இல் வார்த்தை என்றென்றும் நிலைத்திருப்பதாகக் கூறப்படுவதால், பெயரெச்சங்கள் ‘வார்த்தை’ என்பதைக் குறிப்பது சூழலுக்கு அதிகம் பொருந்துகிறது. உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. கிரேக்கப் பெயரெச்சத்தை அப்படியே துணைவாக்கியமாக்குவதற்குப் பதிலாக, தமிழில் முழுமையான வாக்கியமாக இயல்புற ‘நீங்கள் ... பிறப்பிக்கப்பட்டிருக்கிறீர்கள்’ என வழங்கப்பட்டுள்ளது; செயப்பாட்டு உணர்வும் தொடரும் விளைவும் காக்கப்பட்டுள்ளன.
