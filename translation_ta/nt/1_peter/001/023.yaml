revisions:
- from: அழிந்துபோகும் விதையினால் அல்ல, அழிவில்லாத விதையினால்—உயிருள்ளதும் நிலைத்திருப்பதுமான கடவுளுடைய வார்த்தையின் மூலம்—நீங்கள் மறுபடியும் பிறப்பிக்கப்பட்டிருக்கிறீர்கள்.[a]
  to: அழிந்துபோகும் விதையிலிருந்து அல்ல, அழிவில்லாத விதையிலிருந்து—உயிருள்ளதும் நிலைத்திருப்பதுமான கடவுளுடைய வார்த்தையின் மூலம்—நீங்கள் மறுபடியும் பிறந்திருக்கிறீர்கள்.[a]
  rationale: The revision distinguishes source (‘விதையிலிருந்து,’ ἐκ) from means (‘வார்த்தையின் மூலம்,’ διά), replaces an unnatural passive birth construction with idiomatic Tamil while retaining the completed-and-continuing sense of the perfect participle, and preserves the genuine syntactic alternative concerning the two participles in the footnote.
