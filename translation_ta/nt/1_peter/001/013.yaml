id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: ta
  text: ஆகையால், உங்கள் மனத்தின் இடுப்பை இறுக்கிக் கட்டிக்கொண்டு[a], தெளிந்த மனநிலையில் இருந்து, இயேசு மேசியா வெளிப்படும்போது உங்களிடம் கொண்டுவரப்படுகிற அருளின்மேல் முழுமையாக நம்பிக்கை வையுங்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, செயல்படுவதற்காக உங்கள் மனத்தை ஆயத்தப்படுத்திக்கொண்டு.
    reason: lexical_alternative
  - marker: b
    text: ‘முழுமையாக’ என்பது ‘தெளிந்த மனநிலையில் இருந்து’ என்பதோடும் இணைந்து, ‘முழுமையாகத் தெளிந்த மனநிலையில் இருந்து’ எனப் பொருள்படலாம்.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கத்தில், ‘இயேசு கிறிஸ்து’; இங்கு Χριστός ஒரு பட்டமாக இருப்பதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய கருத்துகளிலிருந்து வரும் முடிவுரையையும் அறிவுறுத்தலுக்கான மாற்றத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: உங்கள் மனத்தின் இடுப்புகளைக் கட்டிக்கொண்டு
  rationale: செயலுக்குத் தயாராக ஆடையை இடுப்பில் கட்டும் கிரேக்க உருவகத்தைத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: νήφοντες
  choice: தெளிந்த மனநிலையில் இருந்து
  rationale: இங்கு மதுவிலக்கைக் காட்டிலும் விழிப்பும் சிந்தனைத் தெளிவும் பொருத்தமானவை; மனத்தைப் பற்றிய முந்தைய உருவகத்தோடும் இது இணைகிறது.
- source_word: τελείως
  choice: முழுமையாக
  rationale: முழுமை அல்லது முற்றுமுழுதான ஈடுபாட்டைக் குறிக்கிறது. முதன்மை உரையில் நம்பிக்கை வைப்பதோடு இணைக்கப்பட்டுள்ளது; இலக்கண ரீதியான மற்றொரு இணைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐλπίσατε
  choice: நம்பிக்கை வையுங்கள்
  rationale: வெறும் எதிர்பார்ப்பை அல்லாமல், திட்டவட்டமாக நம்பிக்கையைச் செலுத்தும்படி கூறும் கட்டளையின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: உங்களிடம் கொண்டுவரப்படுகிற அருளின்மேல்
  rationale: φερομένην என்பதன் நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், அருள் அவர்களிடம் வந்து சேரும் இயக்கத்தையும் பாதுகாக்கிறது.
- source_word: ἐν ἀποκαλύψει
  choice: வெளிப்படும்போது
  rationale: இச்சூழலில் வெளிப்பாட்டின் காலப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός என்பதை பெயரின் ஒரு பகுதியாக மட்டும் அல்லாமல், ‘மேசியா’ என்னும் பட்டமாகக் கேட்கச் செய்கிறது; தமிழில் இயல்பான பட்டப்பெயர் அமைப்பு பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: மனத்தின் இடுப்புகளைக் கட்டுதல் என்ற உருவகத்தைத் தக்கவைத்தல்
  choice: உருவகத்தை முதன்மை உரையில் வைத்துக் கொண்டு அதன் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: செயல்பட உங்கள் மனத்தை ஆயத்தப்படுத்திக்கொண்டு
  rationale: மூலத்தின் உயிரோட்டமான உடல்சார் உருவகத்தை அழிக்காமல், சாதாரண வாசகருக்கும் அதன் நோக்கத்தைத் தெளிவுபடுத்துகிறது.
- issue: τελείως எந்த வினையோடு இணைகிறது
  choice: முதன்மை உரையில் ‘நம்பிக்கை வையுங்கள்’ என்பதோடு இணைத்தல்
  alternative: ‘முழுமையாகத் தெளிந்த மனநிலையில் இருந்து’ என νήφοντες என்பதோடு இணைத்தல்
  rationale: கிரேக்கச் சொற்றொடர் இருவிதமாகக் கேட்க முடியும்; முதன்மை உரைக்கு இயல்பான வாசிப்பு தேர்ந்தெடுக்கப்பட்டாலும் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இறுதிக்கால வெளிப்பாட்டுச் சூழலில் பட்டத்தின் அர்த்தம் செயலில் உள்ளது; எனவே ‘மேசியா’ என்று பொருளை வெளிப்படையாக மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், மரியாதையும் தெளிவும் காக்கப்பட்டுள்ளன. ‘மனத்தின் இடுப்புகள்’ என்ற திட்டமிட்ட அசாதாரண உருவகம் மூலத்தின் படிமத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் வழக்குப் பொருளைத் தருகிறது. கட்டளை பன்மை மரியாதை வடிவில் வழங்கப்பட்டுள்ளது.
