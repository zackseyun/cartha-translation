  rationale: கடவுளின் தந்தைமை பற்றிய நெருக்கத்தையும் அவரது பாரபட்சமற்ற தீர்ப்பின் தீவிரத்தையும் வசனம் ஒன்றாக வைத்திருக்கிறது. ‘பயம்’ என்பதை வெறும் மரியாதையாக மென்மையாக்காமல், மூலத்தின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: செயலின்படி வழங்கப்படும் தீர்ப்பின் வரம்பு
  choice: ‘ஒவ்வொருவரின் செயலின்படியும்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: விசுவாசிகளின் இறுதித் தீர்ப்பு அல்லது எல்லாரையும் குறித்த பொதுவான தெய்வீக மதிப்பீடு என்று விளக்கமாகச் சேர்த்தல்
  rationale: கிரேக்க உரை பாரபட்சமற்ற தீர்ப்பையும் ஒவ்வொருவரின் செயலையும் மட்டும் வெளிப்படையாகக் கூறுகிறது. புண்ணியம், இரட்சிப்பின் உறுதி அல்லது தீர்ப்பின் குறிப்பிட்ட அமைப்பு பற்றிய ஒரு பிரிவுசார் கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
