  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: ta
  text: ஒவ்வொருவரின் செயலின்படியும் பாரபட்சமின்றித் தீர்ப்பளிக்கிறவரை நீங்கள் தந்தை என்று அழைக்கிறீர்களானால்[a], நீங்கள் அந்நியராகத் தங்கியிருக்கும் காலம் முழுவதும்[b] பயத்துடன்[c] நடந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தந்தை என்று அழைத்து வேண்டுகிறீர்களானால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் புலம்பெயர் வாழ்வின் காலம் முழுவதும்.’ கிரேக்கச் சொல் அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பயபக்தியுடன்’ அல்லது ‘மரியாதை கலந்த அச்சத்துடன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: அழைக்கிறீர்கள்
  rationale: இங்கு நடுவினை வடிவம் கடவுளைத் ‘தந்தை’ என்று அழைப்பதையோ அவரை நோக்கி வேண்டுவதையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான தமிழில் ‘தந்தை என்று அழைக்கிறீர்கள்’ என்று தரப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πατέρα
  choice: தந்தை
  rationale: πατέρα இங்கு பயனிலைப் பொருளில் வந்து, விசுவாசிகள் கடவுளை எவ்வாறு அழைக்கிறார்கள் என்பதைக் காட்டுகிறது.
- source_word: ἀπροσωπολήμπτως
  choice: பாரபட்சமின்றி
  rationale: ஒருவரின் வெளிப்புற நிலை அல்லது அந்தஸ்தைப் பார்த்துச் சாயாமல் தீர்ப்பளிப்பதைக் குறிக்கும் இயல்பான, துல்லியமான தமிழ் சொற்றொடர்.
- source_word: κρίνοντα
  choice: தீர்ப்பளிக்கிறவரை
  rationale: நிகழ்காலப் பெயரெச்சம் தந்தையாக அழைக்கப்படுகிற கடவுளைத் தொடர்ந்து விவரிக்கிறது; தமிழில் உறவுப்பெயர் அமைப்பு இயல்பாக உள்ளது.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: ஒவ்வொருவரின் செயலின்படியும்
  rationale: κατά மதிப்பீட்டின் அளவுகோலைக் காட்டுகிறது. ἔργον ஒருமையில் இருந்தாலும் ஒருவரின் செயல் அல்லது வாழ்க்கைச் செயல்பாட்டை ஒருங்கிணைத்துக் குறிக்கக்கூடும்; அதைப் பலவசனமாக விரிவாக்காமல் தமிழ் வடிவம் பாதுகாக்கிறது.
- source_word: ἐν φόβῳ
  choice: பயத்துடன்
  rationale: φόβος என்பது பயம், பயபக்தி அல்லது மரியாதை கலந்த அச்சம் ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். ‘பயத்துடன்’ என்பது தந்தைமைக்கும் நீதித்தீர்ப்புக்கும் இடையிலான உரையின் அழுத்தத்தை மென்மையாக்காமல் காக்கிறது.
- source_word: παροικίας
  choice: அந்நியராகத் தங்கியிருக்கும்
  rationale: ஒருவர் தன் சொந்த நாட்டில் அல்லாமல் அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதை இச்சொல் குறிக்கிறது. அரசியல் நாடுகடத்தலை மட்டும் கட்டாயப்படுத்தாமல் அந்தப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀναστράφητε
  choice: நடந்துகொள்ளுங்கள்
  rationale: வாழ்க்கையை ஒரு குறிப்பிட்ட முறையில் நடத்த வேண்டும் என்ற ஒழுக்கக் கட்டளையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: நீங்கள் அந்நியராகத் தங்கியிருக்கும் காலம் முழுவதும்
  rationale: χρόνον கால நீடிப்பைக் குறிக்கிறது. ‘காலம் முழுவதும்’ அந்த நீடிப்பைத் தெளிவாக்கி, அந்நிய வாழ்வின் கருப்பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: தந்தையாகிய கடவுளுக்கும் நீதிபதியாகிய கடவுளுக்கும் இடையில் φόβος என்பதன் பொருள்
