id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: ta
  text: 'ஏனெனில்,


    “மனிதர் அனைவரும் புல்லைப் போன்றவர்கள்[a];


    அவர்களுடைய மகிமையெல்லாம்[b] புல்லின் பூவைப் போன்றது.


    புல் உலர்ந்தது,


    பூ உதிர்ந்தது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “எல்லா மாம்சமும்.” இது ஏசாயா 40:6-ஐ எதிரொலித்து, மனிதர்கள் மரணத்திற்குட்பட்டவர்கள் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “மகிமை” என்பதை “பெருமை” அல்லது “சிறப்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான வேதவசன அடிப்படையை அறிமுகப்படுத்தும் காரணப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶσα σὰρξ
  choice: மனிதர் அனைவரும்
  rationale: இங்கு σάρξ பாவ இயல்பைக் குறிக்காமல், மரணத்திற்குட்பட்ட மனிதகுலம் முழுவதையும் குறிக்கிறது. சொற்சொல்லான ‘எல்லா மாம்சமும்’ நவீன தமிழில் தவறாகப் புரிந்துகொள்ளப்படலாம்; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ὡς χόρτος
  choice: புல்லைப் போன்றவர்கள்
  rationale: மனித வாழ்வின் நிலையாமையை எடுத்துக்காட்டும் ஒப்புமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: πᾶσα δόξα αὐτῆς
  choice: அவர்களுடைய மகிமையெல்லாம்
  rationale: δόξα குறிக்கும் மனிதரின் சிறப்பு, பெருமை, வெளிப்புற மேன்மை ஆகிய பொருள் பரப்பை ‘மகிமை’ தக்கவைக்கிறது; ‘அவர்களுடைய’ என்பது முன்வரும் மனிதர் அனைவரையும் சுட்டுகிறது.
- source_word: ὡς ἄνθος χόρτου
  choice: புல்லின் பூவைப் போன்றது
  rationale: ஏசாயா மேற்கோளின் ‘புல்லின் பூ’ என்ற மரபுவழி உருவகத்தையும் மூலத்தின் உரிமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐξηράνθη
  choice: உலர்ந்தது
  rationale: தாவரம் ஈரப்பதத்தை இழந்து வாடிப்போகும் செயலைச் சுருக்கமாகவும் கவித்துவமாகவும் தெரிவிக்கிறது.
- source_word: ἐξέπεσεν
  choice: உதிர்ந்தது
  rationale: பூ தன் தண்டிலிருந்து விழுவதை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: மனித மரணத்தன்மையைச் சுட்டும் மேற்கோளில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மனிதர் அனைவரும்
  alternative: எல்லா மாம்சமும்
  rationale: இச்சூழலில் பொருள் ஒழுக்கச் சீர்கேடோ ‘பாவ இயல்போ’ அல்ல; மனிதகுலத்தின் பலவீனமும் நிலையாமையுமே. பிரதான உரை நவீன வாசகருக்குத் தெளிவாக இருக்கிறது; ‘எல்லா மாம்சமும்’ என்ற மூலச் சொற்றொடரும் ஏசாயா 40:6 எதிரொலியும் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க மேற்கோளின் ஒரே வாக்கிய ஓட்டத்தை அரைப்புள்ளி தக்கவைக்கிறது; வரிப்பிரிப்பு அதன் கவித்துவ இணைநிலையை வெளிப்படுத்துகிறது.
