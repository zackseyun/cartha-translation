revisions:
- from: இந்தக் காரியங்கள் மூலம் அவர்கள் தங்களுக்காக அல்ல, உங்களுக்காகவே சேவை செய்தார்கள்[a] என்று அவர்களுக்கு வெளிப்படுத்தப்பட்டது. பரலோகத்திலிருந்து அனுப்பப்பட்ட பரிசுத்த ஆவியினால்[c] உங்களுக்கு நற்செய்தியை அறிவித்தவர்கள்[b] வழியாக அந்தக் காரியங்களே இப்போது உங்களுக்கு அறிவிக்கப்பட்டுள்ளன. அவற்றுக்குள் கூர்ந்து பார்க்கத் தேவதூதர்களும் ஆவலாயிருக்கிறார்கள்[d].
  to: இந்தக் காரியங்களில் அவர்கள் தங்களுக்காக அல்ல, உங்களுக்காகவே சேவை செய்தார்கள்[a] என்று அவர்களுக்கு வெளிப்படுத்தப்பட்டது. பரலோகத்திலிருந்து அனுப்பப்பட்ட பரிசுத்த ஆவியினால்[c] உங்களுக்கு நற்செய்தியை அறிவித்தவர்கள்[b] வழியாக அந்தக் காரியங்களே இப்போது உங்களுக்கு அறிவிக்கப்பட்டுள்ளன. அவற்றுக்குள் கூர்ந்து பார்க்கத் தேவதூதர்களும் ஆவலாயிருக்கிறார்கள்[d].
  rationale: The only revision replaces the instrumental “இந்தக் காரியங்கள் மூலம்” with “இந்தக் காரியங்களில்.” This corrects the relation of αὐτά to διηκόνουν without adding interpretive content or altering the verse’s meaning. All footnote markers remain anchored to their relevant expressions, and the existing footnotes remain accurate.
