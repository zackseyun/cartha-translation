reference: 1 Peter 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: ta
  text: இந்தக் காரியங்களில் அவர்கள் தங்களுக்காக அல்ல, உங்களுக்காகவே சேவை செய்தார்கள்[a] என்று அவர்களுக்கு வெளிப்படுத்தப்பட்டது. பரலோகத்திலிருந்து அனுப்பப்பட்ட பரிசுத்த ஆவியினால்[c] உங்களுக்கு நற்செய்தியை அறிவித்தவர்கள்[b] வழியாக அந்தக் காரியங்களே இப்போது உங்களுக்கு அறிவிக்கப்பட்டுள்ளன. அவற்றுக்குள் கூர்ந்து பார்க்கத் தேவதூதர்களும் ஆவலாயிருக்கிறார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்கள் தங்களுக்குச் சேவை செய்யாமல் உங்களுக்குச் சேவை செய்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வேற்றுமை உருபு, அவர்களுடைய சேவையால் பயனடைந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்களுக்கு நற்செய்தியைப் பிரசங்கித்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘நற்செய்தியை அறிவித்தல்’ என்ற வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘பரிசுத்த ஆவியில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வடிவம் பரிசுத்த ஆவியை அறிவிப்பின் வழிமுறையாகவோ, அது நிகழும் ஆவிக்குரிய சூழலாகவோ குறிக்கக்கூடும்.
    reason: ambiguity
  - marker: d
    text: ‘அவற்றுக்குள் குனிந்து எட்டிப் பார்க்க’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஆவலோடும் கூர்ந்த கவனத்தோடும் உள்ளே நோக்குவதைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: அவர்களுக்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இறைவாக்கினர்களைக் குறிக்கும் வேற்றுமை உருபுடைய தொடர்புப்பெயர்; தமிழில் மறைமுகப் பெறுநரை இயல்பாகக் காட்டுகிறது.
- source_word: ἀπεκαλύφθη
  choice: வெளிப்படுத்தப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் வெளிப்படுத்துதல் சார்ந்த இறையியல் தொனியையும் காக்கிறது; செய்பவரை உரையில் இல்லாதவாறு சேர்க்கவில்லை.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: தங்களுக்காக அல்ல, உங்களுக்காகவே
  rationale: இரு வேற்றுமை உருபுகளும் சேவையின் பயனாளிகளைக் குறிக்கும் மாறுபாட்டைத் தெளிவாக வெளிப்படுத்துகின்றன; δέ தரும் வலியுறுத்தலை ‘வே’ காட்டுகிறது.
- source_word: διηκόνουν
  choice: சேவை செய்தார்கள்
  rationale: திருச்சபைச் சிறப்புச்சொல்லாக மட்டுப்படுத்தாமல், தொடர்ச்சியான கடந்தகாலச் சேவையைப் பொதுவான நவீன தமிழில் தருகிறது.
- source_word: αὐτά
  choice: இந்தக் காரியங்கள் மூலம்
  rationale: முன்னர் சொல்லப்பட்ட இறைவாக்குச் செய்திகளைச் சுட்டுகிறது; தமிழில் சேவைக்கும் அந்தக் காரியங்களுக்கும் உள்ள தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: அந்தக் காரியங்களே இப்போது உங்களுக்கு அறிவிக்கப்பட்டுள்ளன
  rationale: செயப்பாட்டு வடிவத்தையும் ‘இப்போது’ என்ற காலநிலையையும் காத்து, முந்தைய காரியங்களே தற்போது அறிவிக்கப்பட்டவை என்பதை ‘ஏ’ வலியுறுத்துகிறது.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: உங்களுக்கு நற்செய்தியை அறிவித்தவர்கள் வழியாக
  rationale: εὐαγγελίζω என்ற வினையின் ‘நல்ல செய்தியை அறிவித்தல்’ என்ற பொருளை எளிய தமிழில் தருகிறது; διὰ என்பதன் இடைமுகப் பொருளை ‘வழியாக’ காக்கிறது.
- source_word: πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியினால்
  rationale: இங்கு நற்செய்தி அறிவிக்கப்பட்டதற்கான தெய்வீகச் செயலாற்றும் வழிமுறையாக வேற்றுமை உருபைப் புரிந்துகொள்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: பரலோகத்திலிருந்து அனுப்பப்பட்ட
  rationale: ‘பரிசுத்த ஆவி’ என்பதை விளக்கும் செயப்பாட்டு எச்சத்தையும் அதன் தோற்ற இடத்தையும் நேரடியாகக் காக்கிறது.
- source_word: εἰς ἃ
  choice: அவற்றுக்குள்
  rationale: εἰς என்பதன் ‘உள்ளே/உள்நோக்கி’ என்ற திசைப்பொருளைத் தவிர்க்காமல் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: ἐπιθυμοῦσιν
  choice: ஆவலாயிருக்கிறார்கள்
  rationale: தொடரும் விருப்பத்தையும் தீவிரமான ஏக்கத்தையும் நிகழ்காலத்தில் இயல்பாகக் காட்டுகிறது.
- source_word: ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: பரலோகச் சூழலில் மனிதத் தூதர்கள் அல்ல, வானுலகத் தூதர்களே குறிக்கப்படுகின்றனர்.
- source_word: παρακύψαι
  choice: கூர்ந்து பார்க்க
  rationale: ஆர்வத்தோடும் கவனத்தோடும் உள்ளே நோக்கும் கருத்தை இயல்பான தமிழில் தருகிறது; உடலைக் குனிந்து எட்டிப் பார்க்கும் படிமம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: πνεύματι ἁγίῳ என்பதன் குறிப்பு மற்றும் செயல்பாடு
  choice: நற்செய்தி அறிவிப்பில் செயலாற்றும் பரிசுத்த ஆவி
  alternative: ‘பரிசுத்த ஆவியில்’ என்று, அறிவிப்பு நிகழும் ஆவிக்குரிய சூழல் அல்லது நிலையாக வாசித்தல்
  rationale: இந்த இரட்சிப்பு வரலாற்றுச் சூழலில் சொற்றொடர் தனிப்பட்ட தெய்வீகச் செயலாளரான பரிசுத்த ஆவியைக் குறிப்பது இயல்பு. வேற்றுமை உருபு கருவிப்பொருளையும் சூழற்பொருளையும் அனுமதிப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: இறைவாக்கினர்களின் சேவைக்கும் தற்போதைய நற்செய்தி அறிவிப்புக்கும் உள்ள காலத் தொடர்பு
  choice: இறைவாக்கினர்கள் முன்னறிவித்த காரியங்கள் பின்னர் வாசகர்களுக்கு நற்செய்தியாக அறிவிக்கப்பட்டன
  alternative: இறைவாக்கினர்களின் சேவை அவர்களது சொந்தக் காலத்தவர்களுக்கு மட்டுமே உரியது
  rationale: ‘தங்களுக்காக அல்ல, உங்களுக்காக’ என்ற வெளிப்படையான மாறுபாடும், ‘இப்போது அறிவிக்கப்பட்டுள்ளன’ என்ற தொடரும் முந்தைய இறைவாக்கிற்கும் தற்போதைய அறிவிப்பிற்கும் உள்ள தொடர்ச்சியை நிறுவுகின்றன; ஆனால் இரண்டையும் ஒன்றாகக் கலக்கவில்லை.
- issue: தேவதூதர்கள் பார்க்க ஆவலாயிருக்கும் காரியங்கள்
  choice: இறைவாக்கினர்கள் முன்னறிவித்து இப்போது நற்செய்தியாக அறிவிக்கப்பட்ட இரட்சிப்புச் சார்ந்த காரியங்கள்
  alternative: அறிவிக்கும் செயல் மட்டுமே அல்லது பரிசுத்த ஆவி மட்டுமே
  rationale: εἰς ἃ என்ற பன்மைத் தொடர்புப்பெயர் முன் குறிப்பிடப்பட்ட பன்மையான காரியங்களுக்குத் திரும்புகிறது; மொழிபெயர்ப்பு அந்தத் தொடர்பை ‘அவற்றுக்குள்’ எனக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் dignified நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஊழியம் செய்தார்கள்’ என்பதற்குப் பதில் பரந்த பொருளுடைய ‘சேவை செய்தார்கள்’ பயன்படுத்தப்பட்டது. ‘நற்செய்தி’, ‘பரிசுத்த ஆவி’, ‘தேவதூதர்கள்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
