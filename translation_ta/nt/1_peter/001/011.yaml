id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: ta
  text: தங்களுக்குள் இருந்த மேசியாவின் ஆவி, மேசியாவைச் சார்ந்த பாடுகளையும்[a] அவற்றுக்குப் பின்வரும் மகிமைகளையும் குறித்து முன்னரே சாட்சியளித்தபோது, அவர் எந்த நபரை அல்லது எத்தகைய காலத்தைச் சுட்டிக்காட்டினார் என்று அவர்கள் ஆராய்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவின் பாடுகளையும்.”
    reason: εἰς Χριστόν என்ற அமைப்பு மேசியாவைச் சார்ந்த பாடுகள் என்ற பரந்த பொருளிலும், மேசியா அனுபவித்த பாடுகள் என்ற உடைமைப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: ஆராய்ந்தார்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தீர்க்கதரிசிகளின் தேடலைத் தொடரும் பங்கேற்புவினையை, தமிழில் இயல்பான முழு வாக்கியமாகத் தருகிறது; தீவிரமாகத் தேடி விசாரிக்கும் கருத்தையும் காக்கிறது.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: எந்த நபரை அல்லது எத்தகைய காலத்தை
  rationale: τίνα என்பதன் நபரைக் குறிக்கும் சாத்தியத்தையும், ποῖον என்பதன் காலத்தின் தன்மையை விசாரிக்கும் நுணுக்கத்தையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: ἐδήλου
  choice: சுட்டிக்காட்டினார்
  rationale: ஆவி தொடர்ந்து வெளிப்படுத்திக் காட்டியதை உணர்த்தும் இறந்தகால வடிவம்; தமிழில் ஆவியைக் தனிப்பட்ட செயற்பாட்டாளராக இயல்பாகக் குறிப்பிடுகிறது.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: தங்களுக்குள் இருந்த மேசியாவின் ஆவி
  rationale: ஆவி தீர்க்கதரிசிகளுக்குள் இருந்ததையும், அந்த ஆவி மேசியாவோடு நேரடியாகத் தொடர்புடையவர் என்பதையும் விளக்கப் பராபிரேஸ் செய்யாமல் காக்கிறது.
- source_word: προμαρτυρόμενον
  choice: முன்னரே சாட்சியளித்தபோது
  rationale: προ- என்பதன் முன்னறிவித்தல் கூறையும் μαρτυρέω என்பதன் சாட்சியளித்தல் கூறையும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: மேசியாவைச் சார்ந்த பாடுகள்
  rationale: εἰς என்ற முன்னிடைச்சொல்லின் பரந்த தொடர்பைத் திட்டவட்டமான உடைமை அல்லது நோக்கம் என்று மட்டும் முடிவுசெய்யாமல், மேசியாவோடு தொடர்புடைய பாடுகள் எனத் திறந்தவாறு தருகிறது.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: அவற்றுக்குப் பின்வரும் மகிமைகள்
  rationale: δόξας என்பதன் பன்மையையும், பாடுகளுக்குப் பின்னான காலவரிசையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசிகளுக்குள் இருந்த ‘மேசியாவின் ஆவி’ என்பதன் பொருள்
  choice: ‘தங்களுக்குள் இருந்த மேசியாவின் ஆவி’ என்ற நேரடி அமைப்பைத் தக்கவைத்தல்
  alternative: மேசியாவைப் பற்றிப் பேசிய தீர்க்கதரிசன ஆவி
  rationale: கிரேக்க உரை மேசியாவோடு தொடர்புடைய ஆவியே தீர்க்கதரிசிகளுக்குள் செயல்பட்டதாக நேரடியாகக் கூறுகிறது; இதை விளக்கவுரையால் குறுக்காமல் அதன் இறையியல் நிறையைப் பாதுகாக்கிறது.
- issue: τὰ εἰς Χριστὸν παθήματα என்பதில் εἰς-இன் வலிமை
  choice: மேசியாவைச் சார்ந்த பாடுகள்
  alternative: மேசியாவின் பாடுகள்
  rationale: முன்னிடைச்சொல் காட்டும் தொடர்பை முதன்மை உரை பரந்தவாறு வைக்கிறது; இயல்பான உடைமை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ஆவியைக் குறிக்கும் தமிழ் வினைமுற்றின் பால் மற்றும் மரியாதை
  choice: அவர் … சுட்டிக்காட்டினார்
  alternative: அது … சுட்டிக்காட்டியது
  rationale: கிரேக்க இலக்கணப் பாலான நடுநிலையை ஆவியின் தனிப்பட்ட செயற்பாட்டை மறுக்கும் பொருளாக மாற்றாமல், நவீன கண்ணியமான தமிழில் செயற்பாட்டாளரைச் சுட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் பங்கேற்புவினை தமிழில் முழு வாக்கியமாக அமைய ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது. ‘மேசியா’ என்பது Χριστός என்ற பட்டப்பெயரின் பொருளை மொழிபெயர்க்கிறது; ‘மகிமைகள்’ என்ற பன்மை திட்டமிட்டு வைக்கப்பட்டுள்ளது.
