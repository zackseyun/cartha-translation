reference: 1 Peter 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ta
  text: நீங்கள் அவரைக் கண்டிராதபோதிலும், அவரை நேசிக்கிறீர்கள். இப்போதும் அவரைக் காணாதபோதிலும், அவர்மேல் நம்பிக்கை வைத்து, சொல்லால் விவரிக்க முடியாததும் மகிமை நிறைந்ததுமான மகிழ்ச்சியுடன்[a] பேருவகை கொள்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகிமைப்படுத்தப்பட்ட மகிழ்ச்சியுடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: δεδοξασμένῃ என்ற நிறைவுற்ற செயப்பாட்டுப் பங்கேற்புச் சொல்லின் வடிவருகான மாற்றை பாதுகாக்கிறது.
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: அவரைக் கண்டிராதபோதிலும்
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லையும் தற்போதைய அன்பையும் இயல்பான தமிழில் இணைத்து, இதுவரை அவரை நேரில் காணாத நிலையை வெளிப்படுத்துகிறது.
- source_word: ἀγαπᾶτε
  choice: அவர்மேல் அன்புகூருகிறீர்கள்
  rationale: நிகழ்கால வினையின் தொடரும் நிலையையும், கண்ணியமான நவீனத் தமிழ் நடையையும் காக்கிறது.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: அவர்மேல் நம்பிக்கை வைத்து
  rationale: πιστεύω உடன் வரும் εἰς, ஒருவரை விசுவாசத்தின் அல்லது நம்பிக்கையின் இலக்காகக் குறிப்பதால், தமிழில் இயல்பாகவும் உறவுசார் நம்பிக்கையை உணர்த்துமாறும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: இப்போது அவரைக் காணாதபோதிலும்
  rationale: ἄρτι என்பதன் தற்போதைய காலக் குறிப்பையும், நிகழ்காலத்தில் காணாத நிலையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀγαλλιᾶσθε
  choice: பேருவகை கொள்கிறீர்கள்
  rationale: சாதாரண மகிழ்ச்சியைவிட வலிமையான, பொங்கும் மகிழ்ச்சியை குறிக்கும் வினையின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: சொல்லால் விவரிக்க முடியாத ... மகிழ்ச்சியால்
  rationale: ἀνεκλάλητος என்பது வார்த்தைகளால் முழுமையாக எடுத்துரைக்க முடியாத தன்மையைச் சுட்டுகிறது; கருவி அல்லது முறையைக் குறிக்கும் வேற்றுமையையும் ‘மகிழ்ச்சியால்’ எனக் காட்டுகிறது.
- source_word: δεδοξασμένῃ
  choice: மகிமை நிறைந்ததுமான
  rationale: மகிமைப்படுத்தப்பட்ட அல்லது மகிமையால் நிரம்பிய என்ற சாத்தியமான பொருளை வாசிக்க எளிய தமிழில் தருகிறது; கிரேக்க நிறைவுற்ற செயப்பாட்டு வடிவத்தின் அசாதாரணத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: πιστεύοντες εἰς ὃν என்பதன் மொழிபெயர்ப்பு
  choice: அவர்மேல் நம்பிக்கை வைத்து
  alternative: அவரை விசுவாசித்து
  rationale: இங்கு கட்டமைப்பு கிறிஸ்துவை நம்பிக்கையின் இலக்காகக் காட்டுகிறது. ‘நம்பிக்கை வைத்து’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, வெறும் கருத்தை உண்மையென ஏற்றுக்கொள்வதைவிட தனிநபர்மேல் சார்ந்திருக்கும் நுணுக்கத்தையும் தருகிறது.
- issue: δεδοξασμένῃ χαρᾷ என்பதன் பொருள்
  choice: மகிமை நிறைந்ததுமான மகிழ்ச்சி
  alternative: மகிமைப்படுத்தப்பட்ட மகிழ்ச்சி
  rationale: δεδοξασμένῃ என்பது வடிவில் நிறைவுற்ற செயப்பாட்டுப் பங்கேற்புச் சொல். சொற்சார்ந்த மாற்று சாத்தியமானதாயினும், தமிழில் அது தெளிவற்றதாகவும் இயல்பற்றதாகவும் இருக்கும்; எனவே சூழலில் புரியத்தக்க முதன்மை வாசகம் தேர்ந்தெடுக்கப்பட்டு, வடிவருகான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேருவகை’ ἀγαλλιᾶσθε என்பதன் தீவிர மகிழ்ச்சியைச் சுமக்கிறது. அடிக்குறிப்பு குறி அதனுடன் தொடர்புடைய முழுச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
