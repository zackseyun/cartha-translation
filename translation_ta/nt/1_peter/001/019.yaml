  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: ta
  text: மாறாக, குறைபாடும் கறையும் இல்லாத ஆட்டுக்குட்டியின் இரத்தத்தைப் போன்ற மேசியாவின் மதிப்புமிக்க இரத்தத்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அழிவுக்குரிய பொருட்களுக்கு எதிரான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: τιμίῳ
  choice: விலைமதிப்புள்ள
  rationale: உயர்ந்த மதிப்பையும் சிறப்பையும் வெளிப்படுத்தி, இரத்தத்துடன் இயல்பாக இணைகிறது.
- source_word: αἵματι
  choice: இரத்தத்தால்
  rationale: கிரேக்கத்தின் கருவிப்பொருள் வேற்றுமையை இயல்பான தமிழில் தருகிறது; பலிமரணத்தின் உட்குறிப்பை விளக்கமாக மாற்றாமல், இரத்தம் என்ற திடமான உருவகத்தைப் பேணுகிறது.
- source_word: ὡς ἀμνοῦ
  choice: ஆட்டுக்குட்டியின் இரத்தத்தைப் போன்ற
  rationale: ஒப்பீடு ஆட்டுக்குட்டியை மட்டும் அல்ல, அதன் இரத்தத்தைச் சார்ந்தது என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: ἀμώμου καὶ ἀσπίλου
  choice: குறைபாடும் கறையும் இல்லாத
  rationale: பலிக்குரிய மிருகத்தின் ஏற்றுக்கொள்ளத்தக்க தன்மையைச் சுட்டும் இணையான இரு சொற்களையும் வேறுபடுத்திப் பேணுகிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: இங்கு பட்டமாகச் செயல்படும் Χριστός என்பதன் பொருளையும் யூத மேசிய எதிர்பார்ப்பின் பின்னணியையும் பேணுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இந்த இடத்தில் இச்சொல் வெறும் பெயர்போன்ற கூறாக இல்லாமல் பட்டமாகச் செயல்படுகிறது. ஆகவே ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பலியுடன் தொடர்புடைய ஒப்பீடு
  choice: ஆட்டுக்குட்டியின் இரத்தத்தைப் போன்ற
  alternative: ஆட்டுக்குட்டியைப் போன்ற
  rationale: ὡς என்பதன் ஒப்பீடு அருகிலுள்ள ‘இரத்தம்’ என்பதோடு தொடர்புடையது என்பதைத் தெளிவாக்குகிறது; பஸ்கா அல்லது குறிப்பிட்ட பலியை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடருவதால், மூலத்தைப் போலவே இறுதியில் நிறைவுறாத தொடரமைப்பு பேணப்பட்டுள்ளது.
