source:
  edition: SBLGNT
  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: ta
  text: அவர் உலகம் படைக்கப்படுவதற்கு முன்பே முன்னறியப்பட்டார்[a]; ஆனால் காலங்களின் இறுதியில் உங்களுக்காக வெளிப்படுத்தப்பட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முன்னமே தேர்ந்தெடுக்கப்பட்டார்.” கிரேக்கத்தில் சொல்லர்த்தமாக “முன்னறியப்பட்டார்” என்று உள்ளது; இது கடவுளுடைய நோக்கத்தை உள்ளடக்கக்கூடும், ஆனால் அந்த விரிவான விளக்கத்தை முதன்மை உரை கட்டாயப்படுத்துவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தக் கடைசிக் காலங்களில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: முன்னறியப்பட்டார்
  rationale: προγινώσκω என்பதன் ‘முன்னமே அறிதல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது. ‘முன்னமே தேர்ந்தெடுக்கப்பட்டார்’ என்று மொழிபெயர்த்து தெய்வீகத் திட்டம் அல்லது தேர்ந்தெடுத்தல் என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: πρὸ καταβολῆς κόσμου
  choice: உலகம் படைக்கப்படுவதற்கு முன்பே
  rationale: உலகம் தோன்றுவதற்கு முந்திய காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: φανερωθέντος
  choice: வெளிப்படுத்தப்பட்டார்
  rationale: மறைந்திருந்தவர் காணத்தக்கவராக அல்லது வெளிப்படையாக அறியத்தக்கவராக ஆக்கப்பட்டார் என்பதைக் குறிக்கும் இறைவினை வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: காலங்களின் இறுதியில்
  rationale: ‘காலங்களின் கடைசியில்’ என்ற காலம் சார்ந்த, முடிவுக்காலத் தொனியுடைய பொருளை ‘இந்த’ என்ற மூலத்தில் இல்லாத சுட்டைச் சேர்க்காமல் தருகிறது.
- source_word: δι’ ὑμᾶς
  choice: உங்களுக்காக
  rationale: διά + accusative இங்கு வாசகர்களின் நன்மை அல்லது பொருட்டைக் குறிக்கிறது; தமிழில் ‘உங்களுக்காக’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: படைப்புக்கு முன்பு மெசியாவைக் குறித்து வரும் προεγνωσμένου என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘முன்னறியப்பட்டார்’ என்று வைத்தல்
  alternative: ‘முன்னமே தேர்ந்தெடுக்கப்பட்டார்’ அல்லது ‘முன்னமே நியமிக்கப்பட்டார்’
  rationale: இச்சொல் தெய்வீக நோக்கத்தை உள்ளடக்கக்கூடும்; எனினும் அதைத் தேர்ந்தெடுத்தல் அல்லது முன்நியமனம் என்று கட்டாயமாக விரிவுபடுத்தாது. மூலத்தின் சொற்பொருளையும் இறையியல் அழுத்தத்தையும் திறந்த நிலையில் வைக்கிறது.
- issue: ἐπ’ ἐσχάτου τῶν χρόνων என்பதன் காலப் பொருள்
  choice: ‘காலங்களின் இறுதியில்’
  alternative: ‘இந்தக் கடைசிக் காலங்களில்’
  rationale: கிரேக்கம் முடிவுக்காலப் பகுதியைச் சுட்டுகிறது; ஆனால் ‘இந்த’ என்ற சுட்டுச்சொல் வெளிப்படையாக இல்லை. முதன்மை மொழிபெயர்ப்பு அதைச் சேர்க்காமல் மூலத்திற்கு நெருக்கமாக உள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிதில் புரியக்கூடிய, அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்னறியப்பட்டார்’ என்ற சற்று செறிவான சொல் மூலத்தின் திட்டமிட்ட தெளிவின்மையைக் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
