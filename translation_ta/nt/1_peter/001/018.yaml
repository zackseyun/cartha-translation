id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: ta
  text: வெள்ளி அல்லது தங்கம் போன்ற அழிந்துபோகக்கூடிய பொருட்களால் அல்ல, உங்கள் தந்தையரிடமிருந்து[b] மரபாக வந்த உங்கள் பயனற்ற வாழ்க்கை முறையிலிருந்து நீங்கள் மீட்கப்பட்டீர்கள்[a] என்பதை அறிந்தவர்களாய்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மீட்பு விலை கொடுத்து விடுவிக்கப்பட்டீர்கள்.’ கிரேக்க வினைச்சொல் விலை செலுத்துவதன் மூலம் விடுவிக்கப்படுதல் என்ற கருத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தந்தையர்’ என்பது இங்கு விரிவாக ‘முன்னோர்’ என்றும் பொருள்படலாம்; அதனால், ‘உங்கள் முன்னோர்களிடமிருந்து மரபாக வந்த’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: அறிந்திருக்கிறீர்கள்
  rationale: οἶδα என்பதன் நிறைவுநிலைப் பங்கேற்பு வடிவம் நிலைத்த அறிவைக் குறிக்கிறது. சூழலிலுள்ள அறிவுறுத்தலோடு அதன் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட வினைமுற்று வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐλυτρώθητε
  choice: மீட்கப்பட்டீர்கள்
  rationale: λυτρόομαι என்பது விலை செலுத்தி விடுவித்தல் அல்லது மீட்டல் என்ற கருத்தைக் கொண்டது. ‘மீட்கப்பட்டீர்கள்’ என்பது தமிழில் இயல்பாகவும் வேதாகமச் சொல்லாட்சிக்கு ஏற்றதாகவும் இருந்து, வெள்ளி மற்றும் தங்கத்தோடு வரும் விலை சார்ந்த உருவகத்தையும் திறந்த நிலையில் வைக்கிறது.
- source_word: φθαρτοῖς
  choice: அழிந்துபோகக்கூடிய
  rationale: இந்தச் சொல் அழிவு, சிதைவு, நிலையின்மை ஆகிய கருத்துகளைக் குறிக்கிறது; அடுத்த வசனத்தில் வரும் அழிவில்லாத மதிப்புடனான வேறுபாட்டையும் இச்சொல் தக்கவைக்கிறது.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: வெள்ளி அல்லது தங்கத்தால்
  rationale: கருவி அல்லது விலை வழிமுறையைக் காட்டும் வேற்றுமையை ‘-ஆல்’ இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் உள்ள ‘வெள்ளி அல்லது தங்கம்’ என்ற நேரடியான இணைப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐκ
  choice: முறையிலிருந்து
  rationale: முந்தைய வாழ்க்கை முறையிலிருந்து பிரித்து விடுவிக்கப்பட்டதைச் சுட்டும் மூல/பிரிவு பொருளை ‘-இலிருந்து’ தெளிவாகக் காட்டுகிறது.
- source_word: ματαίας
  choice: பயனற்ற
  rationale: μάταιος குறிக்கும் வெறுமை, வீண் தன்மை, பலனின்மை ஆகியவற்றை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀναστροφῆς
  choice: வாழ்க்கை முறை
  rationale: ἀναστροφή என்பது ஒருவரின் நடத்தை மட்டுமல்ல, வாழும் விதத்தையும் குறிக்கக்கூடும். ‘வாழ்க்கை முறை’ இந்த விரிவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: πατροπαραδότου
  choice: உங்கள் தந்தையரிடமிருந்து வழிவழியாக வந்த
  rationale: πατροπαράδοτος என்பதில் உள்ள ‘தந்தையரிடமிருந்து ஒப்படைக்கப்பட்ட’ என்ற கருத்தையும் தலைமுறைத் தொடர்ச்சியையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மரபாக வந்த வாழ்க்கை முறையைக் குறிக்கும் மொழி
  choice: உங்கள் தந்தையரிடமிருந்து வழிவழியாக வந்த
  alternative: உங்கள் முன்னோர்களிடமிருந்து மரபாக வந்த
  rationale: மூலச்சொல் தந்தையரைக் குறிப்பாகச் சொல்வதால் அந்தப் பிதாமக மொழி முதன்மை உரையில் பாதுகாக்கப்படுகிறது; அது பொதுவாக முன்னோர்களைக் குறிக்கக்கூடிய விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மீட்பு தொடர்பான சொல்லாட்சி
  choice: மீட்கப்பட்டீர்கள்
  alternative: மீட்பு விலை கொடுத்து விடுவிக்கப்பட்டீர்கள்
  rationale: இவ்வாக்கியத்தில் மீட்பு/விடுதலை உருவகம் உள்ளது; ஆனால் அதன் முழுக் கோட்பாட்டு செயல்முறையை இந்தத் துணைவாக்கியம் மட்டும் வரையறுக்கவில்லை. ‘மீட்கப்பட்டீர்கள்’ அந்த வேதாகமத் தொடர்பைப் பாதுகாத்து, விலை செலுத்தும் நுணுக்கத்தை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் வேதாகமத் தொனியும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் கருத்தோட்டம் தமிழில் தெளிவாக இருக்கச் சொற்களின் வரிசை இயல்பாக்கப்பட்டுள்ளது. பங்கேற்பு வடிவமான εἰδότες தனித்த தமிழ்வாக்கிய அமைப்பாக வழங்கப்பட்டாலும், இறுதியிலுள்ள அரைப்புள்ளி அதன் தொடர்ச்சிச் சார்பை உணர்த்துகிறது.
