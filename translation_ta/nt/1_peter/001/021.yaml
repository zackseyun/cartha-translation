  to: அவர் மூலமாகக் கடவுளை நம்புகிற நீங்கள்[a], கடவுள் அவரை இறந்தோரிலிருந்து எழுப்பி அவருக்கு மகிமை அளித்ததால், உங்கள் விசுவாசமும் நம்பிக்கையும் கடவுள்மேல் இருக்கின்றன.[b]
