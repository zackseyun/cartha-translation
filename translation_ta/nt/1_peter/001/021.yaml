reference: 1 Peter 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: ta
  text: அவர் மூலமாகக் கடவுளை நம்புகிற நீங்கள்[a], கடவுள் அவரை இறந்தோரிலிருந்து எழுப்பி அவருக்கு மகிமை அளித்ததால், உங்கள் விசுவாசமும் நம்பிக்கையும் கடவுள்மேல் இருக்கின்றன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உண்மையுள்ளவர்களாக இருக்கிற நீங்கள்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு கிறிஸ்து மூலமாகக் கடவுளை நம்புகிறவர்களையே இச்சொற்றொடர் பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இதன் விளைவாக உங்கள் விசுவாசமும் நம்பிக்கையும் கடவுள்மேல் இருக்கின்றன” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά + genitive இங்கு இடைமுகமான வழி அல்லது சாதனத்தைக் குறிக்கிறது; கிறிஸ்து மூலமாகக் கடவுளை நம்புவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πιστοὺς εἰς θεόν
  choice: கடவுள்மேல் நம்பிக்கை கொண்டிருக்கிற
  rationale: πιστός என்பதற்கு ‘உண்மையுள்ள’ என்ற பொருளும் இருக்கலாம்; ஆனால் εἰς θεόν உடனான இக்கட்டமைப்பு கடவுளை நம்புகிறவர்களைக் குறிப்பதே அதிக சாத்தியம்.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: அவரை இறந்தோரிலிருந்து எழுப்பி
  rationale: ἐκ νεκρῶν என்பதன் பன்மை நுணுக்கத்தை ‘இறந்தோரிலிருந்து’ காக்கிறது; உயிர்த்தெழுதலைத் தெளிவாகக் கூறுகிறது.
- source_word: δόξαν αὐτῷ δόντα
  choice: அவருக்கு மகிமை அளித்த
  rationale: δόξα என்பதைக் ‘மகிமை’ என நேரடியாகக் காத்து, கடவுள் கிறிஸ்துவுக்கு அதை அளித்தார் என்பதைத் தெரிவிக்கிறது.
- source_word: ὥστε
  choice: இதனால்
  rationale: இந்த இணைப்புச் சொல் முந்தைய கடவுளின் செயல்களிலிருந்து உண்டாகும் விளைவை இயல்பாகக் காட்டுகிறது; நோக்கம்/விளைவு இடையிலான சாத்தியமான நுணுக்கத்தையும் மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இங்கு வாசகர்களின் கடவுள்மீதான நம்பிக்கையைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்.
- source_word: ἐλπίδα
  choice: நம்பிக்கை
  rationale: ἐλπίς குறிக்கும் எதிர்நோக்கும் உறுதியான நம்பிக்கையையும் நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: εἶναι εἰς θεόν
  choice: கடவுள்மேல் இருக்கின்றன
  rationale: விசுவாசமும் நம்பிக்கையும் கடவுளை நோக்கியிருக்கின்றன என்பதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; வசனத்தில் εἰς θεόν மீண்டும் வருவதையும் கருத்தளவில் காக்கிறது.
theological_decisions:
- issue: πιστούς என்பதன் பொருள்
  choice: கடவுள்மேல் நம்பிக்கை கொண்டவர்கள்
  alternative: உண்மையுள்ளவர்கள்
  rationale: εἰς θεόν என்ற தொடரால் நம்புதல் என்ற பொருள் வலுப்பெறுகிறது; இருப்பினும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கிறிஸ்துவின் இடைமுகப் பங்கு
  choice: அவர் மூலமாகக் கடவுள்மேல் நம்பிக்கை
  alternative: அவரால் அல்லது அவரின் காரணமாக நம்பிக்கை
  rationale: διά + genitive கிறிஸ்துவின் மூலமாகக் கடவுளை நம்பும் இடைமுகத்தைக் காட்டுகிறது; உரையில் இல்லாத விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ὥστε தொடரின் வலிமை
  choice: இதனால்
  alternative: இதன் விளைவாக / இதற்காக
  rationale: கடவுள் கிறிஸ்துவை எழுப்பி மகிமைப்படுத்தியதன் விளைவாக விசுவாசமும் நம்பிக்கையும் கடவுள்மேல் இருப்பதை முதன்மையாகக் காட்டுகிறது; நோக்கம் என்ற சாத்தியத்தை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் உறவுத்தொடர் தமிழில் தெளிவடைய ‘கடவுளை நம்புகிறீர்கள்’ என முடிக்கப்பட்டது; மூலத்தின் பொருள் தொடர்புகள் காக்கப்பட்டுள்ளன. ‘விசுவாசம்’ மற்றும் ‘நம்பிக்கை’ மூலம் πίστις/ἐλπίς வேறுபாடு தக்கவைக்கப்பட்டுள்ளது.
