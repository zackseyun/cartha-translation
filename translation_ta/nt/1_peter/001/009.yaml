  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: ta
  text: உங்கள் விசுவாசத்தின் பலனாகிய[a] உங்கள் ஆத்துமாக்களின்[b] இரட்சிப்பைப் பெற்றுக்கொள்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் விசுவாசத்தின் முடிவை,” “இலக்கை,” அல்லது “விளைவை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் உயிர்களின் இரட்சிப்பை” அல்லது “உங்களுடைய இரட்சிப்பை.” கிரேக்கச் சொல் சூழலுக்கேற்ப “ஆத்துமாக்கள்,” “உயிர்கள்,” அல்லது “நபர்கள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: பெற்றுக்கொள்கிறீர்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை முந்தைய சூழலில் வாசகர்களோடு இணைகிறது; விசுவாசம் கொண்டுசெல்லும் பலனை அவர்கள் அடைந்து வருவதைக் காட்டும் இயல்பான தமிழ் நடை இது.
- source_word: τέλος
  choice: பலன்
  rationale: இங்கு வெறும் கால முடிவை விட, விசுவாசத்தால் அடையப்படும் நிறைவேறிய விளைவைச் சுட்டுகிறது. ‘பலன்’ இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் வாசகர்களின் நம்பிக்கையுள்ள பதிலைக் குறிக்கிறது. ‘விசுவாசம்’ என்பது πίστις என்பதற்கான நிலையான, சூழலுக்கேற்ற மொழிபெயர்ப்பு.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைப்பொருளை நேரடியாகக் காட்டுகிறது; இங்கு அது ‘விசுவாசம்’ என்பதோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: σωτηρίαν
  choice: இரட்சிப்பு
  rationale: நிருபத்தின் சூழலில் இப்போதைய அனுபவத்தையும் வருங்கால நிறைவையும் தாங்கக்கூடிய நிலையான வேதாகமச் சொல்.
- source_word: ψυχῶν
  choice: ஆத்துமாக்கள்
  rationale: ψυχή என்பதன் நேரடியான பாரம்பரியப் பொருளை இங்கு காக்கிறது; உடல்–ஆத்துமா குறித்த விரிவான கோட்பாட்டை வசனத்தில் திணிக்காமல், ‘உயிர்கள்’ அல்லது ‘நபர்கள்’ என்ற பொருள் வாய்ப்புகளை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: πίστις என்பதன் நுணுக்கமான பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; விசுவாசத்தன்மை
  rationale: ‘உங்கள் விசுவாசம்’ என்பது இங்கு வாசகர்களின் நம்பும் பதிலையே இயல்பாகக் குறிக்கிறது; ‘விசுவாசத்தன்மை’ என்று மாற்றுவதற்குச் சூழல் போதிய கட்டாயம் தரவில்லை.
- issue: ‘ஆத்துமாக்களின் இரட்சிப்பு’ என்பதில் ψυχαί-யின் பொருள்
  choice: ஆத்துமாக்கள்
  alternative: உயிர்கள்; நபர்கள்
  rationale: கிரேக்கச் சொல்லின் நேரடியான வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதேவேளையில், இது உடல் இரட்சிப்பை மறுப்பதாகவோ கடுமையான உடல்–ஆத்துமா இருமையைப் போதிப்பதாகவோ விளக்கப்படவில்லை; பரந்த சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. மூலத்தின் வாக்கிய உறவைத் தக்கவைத்தபடி, தமிழில் இயல்பாக வாசிக்க பிரதான கருத்து நேரடி வினைமுற்றாக வழங்கப்பட்டுள்ளது. ‘பலன்’ பொதுவழக்குக்கு நெருக்கமானது; ‘இரட்சிப்பு’ மற்றும் ‘ஆத்துமா’ வேதாகமப் பயன்பாட்டின் தொடர்ச்சிக்காக வைக்கப்பட்டு, அவற்றின் பொருள் வரம்புகள் அடிக்குறிப்புகளில் தெளிவுபடுத்தப்பட்டுள்ளன.
