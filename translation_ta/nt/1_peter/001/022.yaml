  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: ta
  text: உண்மைக்குக் கீழ்ப்படிவதன் மூலம், பாசாங்கற்ற சகோதர அன்பு உண்டாகும்படி[a] உங்கள் ஆன்மாக்களைத் தூய்மைப்படுத்தியுள்ள நீங்கள், உள்ளத்திலிருந்து[b] ஒருவருக்கொருவர் மிகுந்த ஆர்வத்துடன் அன்புகூருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சக விசுவாசிகளுக்கான பாசாங்கற்ற அன்பு உண்டாகும்படி.’ ‘சகோதர அன்பு’ என்பதற்கான கிரேக்கச் சொல், சகோதரர்களையும் சகோதரிகளையும் உள்ளடக்கிய சக கிறிஸ்தவர்களிடையேயான குடும்பப் பாசத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், ‘தூய உள்ளத்திலிருந்து’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: தூய்மைப்படுத்தியிருக்கிற
  rationale: நிறைவுற்ற செயல் தொடர்ந்து பொருந்துவதைக் காட்டும் கிரேக்க perfect participle-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது; முதன்மைக் கட்டளைக்கு முன்பான செயல் என்ற தொடர்பையும் காக்கிறது.
- source_word: ψυχὰς
  choice: ஆன்மாக்களை
  rationale: ψυχή என்பதன் ‘ஆன்மா, உயிர், தன்னையே’ என்ற பொருள் விரிவை முழுமையாகக் குறுக்காமல், இங்கு மனிதரின் உள்ளார்ந்த வாழ்வைக் குறிக்கும் நேரடியான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: உண்மைக்குக் கீழ்ப்படிந்ததன் மூலம்
  rationale: ἐν என்பது இங்கு வழிமுறை அல்லது நிகழும் தளத்தைக் குறிக்கலாம். ‘மூலம்’ என்பது வழிமுறைப் பொருளை இயல்பாகத் தருகிறது; ‘உண்மை’க்கு உள்ள கிரேக்க definite article தனியே தமிழில் சுட்டுச்சொல் சேர்க்காமல் சூழலால் வெளிப்படுகிறது.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: பாசாங்கற்ற சகோதர அன்பு உண்டாகும்படி
  rationale: εἰς குறிக்கும் நோக்கம் அல்லது விளைவு என்ற திறந்த தொடர்பை ‘உண்டாகும்படி’ இயல்பாக வெளிப்படுத்துகிறது. ἀνυπόκριτος என்பதற்கு ‘பாசாங்கற்ற’ நேரடியும் தெளிவுமான இணை.
- source_word: φιλαδελφίαν
  choice: சகோதர அன்பு
  rationale: சக விசுவாசிகளிடையேயான குடும்பப் பாசத்தைச் சுட்டும் சொல்லின் தனித்தன்மையைப் பேணுகிறது; பின்னர் வரும் ἀγαπάω உடனான சொல் வேறுபாட்டையும் அழிக்கவில்லை.
- source_word: ἐκ καρδίας
  choice: உள்ளத்திலிருந்து
  rationale: SBLGNT-இல் பெயரடை இல்லாத வாசகத்தை நேரடியாக வழங்குகிறது; ‘தூய உள்ளத்திலிருந்து’ என்ற மாற்றுப் பாடத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἀλλήλους ἀγαπήσατε
  choice: ஒருவருக்கொருவர் அன்புகூருங்கள்
  rationale: பரஸ்பரத்தையும் aorist imperative-இன் நேரடியான கட்டளையையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἐκτενῶς
  choice: ஆழமாக
  rationale: அன்பின் தீவிரத்தையும் முழுமையான ஈடுபாட்டையும் சாதாரண வாசகர்களுக்குப் புரியும் நவீன தமிழில் தெரிவிக்கிறது; தொடர்ச்சியை மட்டும் வலியுறுத்தும் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
theological_decisions:
- issue: φιλαδελφία மற்றும் ἀγαπάω ஆகிய இரு அன்புச் சொற்களின் வேறுபாடு
  choice: φιλαδελφία என்பதை ‘சகோதர அன்பு’ என்றும் ἀγαπήσατε என்பதை ‘அன்புகூருங்கள்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் பொதுவாக ‘அன்பு’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தின் சொல்லாட்சித் தன்மையைப் பேணுகிறது; அதே நேரத்தில் இந்த இரு சொற்களுக்கிடையே மூலவசனம் கூறாத கடுமையான இறையியல் வேறுபாட்டை உருவாக்கவில்லை.
- issue: φιλαδελφία என்ற சொல்லின் பாலின உள்ளடக்கம்
  choice: முதன்மை உரையில் ‘சகோதர அன்பு’ என்று வைத்து, அது சகோதரிகளையும் உள்ளடக்கிய சக விசுவாசிகளின் குடும்பப் பாசம் என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘சக விசுவாசிகளுக்கான அன்பு’ அல்லது ‘சகோதர சகோதரிகளுக்கான அன்பு’
  rationale: கிரேக்கச் சொல்லின் குடும்ப உறவுச் சாயலையும் அடுத்த அன்புச் சொல்லிலிருந்து அதன் வேறுபாட்டையும் காக்கிறது; அதன் உள்ளடக்கிய பொருளை அடிக்குறிப்பு தெளிவாக்குகிறது.
- issue: ἐκ καρδίας என்பதற்குப் பிந்தைய உரை வேறுபாடு
  choice: SBLGNT வாசகத்தின்படி ‘உள்ளத்திலிருந்து’
  alternative: ‘தூய உள்ளத்திலிருந்து’
  rationale: கொடுக்கப்பட்ட மூல உரையில் καθαρᾶς இல்லை. மாற்றுப் பாடம் முக்கியமானதால் அடிக்குறிப்பில் மட்டும் பதிவு செய்யப்படுகிறது.
