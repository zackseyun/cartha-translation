source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: ta
  text: கடைசிக் காலத்தில்[b] வெளிப்படுத்தப்பட ஆயத்தமாக இருக்கும் மீட்புக்காக, கடவுளின் வல்லமையால் விசுவாசத்தின்[a] வழியாகக் காக்கப்படுகிற நீங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நம்பிக்கையின்”; இங்கு சாத்தியம் குறைவாக, “உண்மைத்தன்மையின்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கடைசி நேரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: நீங்கள்
  rationale: இந்தச் சொல் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வாசகர்களை மீண்டும் சுட்டுகிறது. தமிழில் தொடர்பை இயல்பாகத் தொடர, வாக்கியத் துணுக்கின் முடிவில் “நீங்கள்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: φρουρουμένους
  choice: காக்கப்படுகிற
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சம், அவர்களுக்கு தொடர்ந்து செய்யப்படும் செயலைக் காட்டுகிறது. “காக்கப்படுகிற” என்பது பாதுகாப்பு மற்றும் காவல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாகத் தருகிறது.
- source_word: ἐν δυνάμει θεοῦ
  choice: கடவுளின் வல்லமையால்
  rationale: செயப்பாட்டு வினையுடன் வரும் ἐν இங்கு கருவி அல்லது செயலாற்றும் ஆற்றலைக் குறிக்கிறது. “வல்லமையால்” என்பது கடவுளின் ஆற்றலே காக்கும் வழிமுறை என்பதைத் தெளிவாக்குகிறது.
- source_word: διὰ πίστεως
  choice: விசுவாசத்தின் வழியாக
  rationale: διά + உரிய வேற்றுமை இங்கு இடைமுறையைக் குறிக்கிறது. πίστις என்பதற்கு இச்சூழலில் “விசுவாசம்” முதன்மைப் பொருத்தம்; “நம்பிக்கை” என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἰς σωτηρίαν
  choice: மீட்புக்காக
  rationale: εἰς நோக்கம் அல்லது சென்றடையும் முடிவைக் குறிக்கிறது. “மீட்புக்காக” என்பது வரவிருக்கும் σωτηρία-வை நோக்கிய இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: வெளிப்படுத்தப்பட ஆயத்தமாக இருக்கும்
  rationale: ἕτοιμος + செயப்பாட்டு முடிவிலி வினையின் பொருளை நேரடியாகக் காக்கிறது; மீட்பு இன்னும் வெளிப்பட வேண்டியதாக இருந்தாலும் அதற்கு ஆயத்தமாக உள்ளது என்ற எதிர்கால நோக்கை வெளிப்படுத்துகிறது.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: கடைசிக் காலத்தில்
  rationale: καιρός என்பது வெறும் காலநீளத்தைவிடத் தீர்மானிக்கப்பட்ட அல்லது முக்கியமான காலத்தைச் சுட்டலாம். “கடைசிக் காலத்தில்” என்பது குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டைத் திணிக்காமல் அதன் எதிர்கால நோக்கைக் காக்கிறது.
theological_decisions:
- issue: கடவுளின் காத்தலுக்கும் மனிதரின் விசுவாசத்துக்கும் உள்ள தொடர்பு
  choice: கடவுளின் வல்லமையே காக்கிறது; விசுவாசம் அதன் இடைமுறையாகச் சொல்லப்படுகிறது.
  alternative: விசுவாசம் இங்கு வெறும் விளக்கச் சேர்க்கை; அல்லது πίστις முதன்மையாக “உண்மைத்தன்மை” என்று பொருள்படும்.
  rationale: தொடரமைப்பு கடவுளின் வல்லமையை காக்கும் ஆற்றலாகவும் விசுவாசத்தை “வழியாக” நிகழும் இடைமுறையாகவும் வைக்கிறது. நிலைத்திருத்தல் அல்லது விலகுதல் குறித்த எந்தப் பிரிவுசார் முடிவையும் மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: மீட்பின் காலநோக்கு
  choice: இங்கு மீட்பு கடைசிக் காலத்தில் வெளிப்படவிருக்கும் எதிர்கால நிறைவை நோக்குகிறது.
  alternative: இது நிகழ்கால மனமாற்றத்தை மட்டும் குறிக்கிறது; அல்லது எந்த நிகழ்காலப் பரிமாணமும் இல்லாத இறுதி விடுதலையை மட்டும் குறிக்கிறது.
  rationale: “வெளிப்படுத்தப்பட ஆயத்தமாக இருக்கும்” என்பது எதிர்கால வெளிப்பாட்டைத் தெளிவாகக் குறிக்கிறது. ஆனால் புதிய ஏற்பாட்டில் மீட்புக்கு வேறு காலப் பரிமாணங்கள் உண்டா என்பதைக் குறித்து இவ்வசனம் கூறாததை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது முந்தைய வசனத்தைத் தொடரும் தொடர்பு வாக்கியத் துணுக்கு என்பதால், “நீங்கள்” இறுதியில் வைக்கப்பட்டுள்ளது. “மீட்பு” என்பது “இரட்சிப்பு” என்பதைக் காட்டிலும் பொதுவாசகருக்கு நேரடியாகப் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; அதேவேளை வரவிருக்கும் தெய்வீக விடுதலையின் பொருள் காக்கப்பட்டுள்ளது.
