id: 1PE.1.14
reference: 1 Peter 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: ta
  text: கீழ்ப்படிதலின் பிள்ளைகளாக[a], முன்பு உங்கள் அறியாமையில் உங்களுக்கு இருந்த ஆசைகளுக்கு ஏற்றபடி உங்களை வடிவமைத்துக்கொள்ளாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழ்ப்படிகிற பிள்ளைகளாக.” கிரேக்க மூலத்தில் சொல்லுக்குச் சொல், “கீழ்ப்படிதலின் பிள்ளைகளாக” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: …ஆக
  rationale: அறிவுரை வழங்கப்படும் அடையாளத்தையும் முறையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τέκνα ὑπακοῆς
  choice: கீழ்ப்படிதலின் பிள்ளைகள்
  rationale: ‘கீழ்ப்படிதலுக்குரிய பிள்ளைகள்’ என்ற அடையாளத்தை வலியுறுத்தும் மூலமொழியின் உருபுத் தொடர்பைத் தக்கவைக்கிறது; தமிழில் சற்றே அசாதாரணமாக இருந்தாலும் புரிந்துகொள்ளத்தக்கது.
- source_word: μὴ συσχηματιζόμενοι
  choice: உங்களை வடிவமைத்துக்கொள்ளாதீர்கள்
  rationale: நடந்துகொண்டிருக்கும் தன்னியக்க ஒத்திசைவைத் தடைசெய்யும் அறிவுரையாக நடு/செயப்பாட்டு வடிவத்தின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: ஆசைகளுக்கு ஏற்றபடி
  rationale: ἐπιθυμίαις இங்கு ஒழுக்கநெறிக்கு மாறான வலுவான விருப்பங்களைக் குறிக்கிறது; ‘ஆசைகள்’ பாலியல் பொருளுக்கு மட்டும் குறுக்காமல் பொதுவாகவும் தெளிவாகவும் உள்ளது.
- source_word: πρότερον
  choice: முன்பு ... இருந்த
  rationale: வாசகர்களின் முந்தைய வாழ்க்கை நிலையையும் அந்தக் கால ஆசைகளையும் இயல்பாக இணைக்கிறது.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: உங்கள் அறியாமையில்
  rationale: மூலத்தின் முன்னிடைச்சொல் அமைப்பை நெருக்கமாகக் காத்து, அவர்களுடைய முந்தைய அறியாமை நிலையைக் கூடுதல் விளக்கமின்றி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τέκνα ὑπακοῆς என்ற அடையாளம்சார் உருபுத் தொடரை பெயரடைத் தொடராக எளிமைப்படுத்தலாமா?
  choice: கீழ்ப்படிதலின் பிள்ளைகள்
  alternative: கீழ்ப்படிகிற பிள்ளைகள்
  rationale: மூலத்தின் ‘கீழ்ப்படிதலால் சிறப்பிக்கப்படும் பிள்ளைகள்’ என்ற அடையாள வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் மாற்று இயல்பான தமிழை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் அடையாளம்சார் சொற்றொடரைப் பாதுகாக்க ‘கீழ்ப்படிதலின் பிள்ளைகள்’ என்று வைத்து, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
