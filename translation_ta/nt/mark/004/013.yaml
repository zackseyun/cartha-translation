  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இந்த உவமையை நீங்கள் புரிந்துகொள்ளவில்லையா?[a] அப்படியானால், எல்லா உவமைகளையும் எப்படிப் புரிந்துகொள்வீர்கள்?” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “இந்த உவமையை நீங்கள் அறியவில்லையா? அப்படியிருக்க, எல்லா உவமைகளையும் எப்படி அறிந்துகொள்வீர்கள்?” கிரேக்க வினைச்சொற்களுக்கு ‘அறிதல்’ என்ற பொருள் வரலாம்; இங்கு அவை உவமைகளின் பொருளைப் புரிந்துகொள்வதைக் குறிக்கின்றன.'
    reason: lexical_alternative
