- source_word: λέγει
  choice: கேட்கிறார்
  rationale: மாற்குவின் வரலாற்று நிகழ்காலத்தைத் தக்கவைத்தபடி, தொடர்ந்து வரும் இரு வினாக்களுக்கு இயல்பான தமிழ்ச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; அடிப்படைப் பொருள் ‘சொல்கிறார்’ என்பதே.
- source_word: οἴδατε
  choice: புரிந்துகொள்ளவில்லையா
  rationale: οἶδα பொதுவாக ‘அறிதல்’ எனப் பொருள்பட்டாலும், இங்கு உவமையின் பொருளைப் பற்றிய புரிதலே சூழலுக்குரிய கருத்து.
- source_word: παραβολὴν
  choice: உவமையை
  rationale: இயேசுவின் இவ்வகைக் கற்பித்தலுக்கான வழக்கமான, துல்லியமான தமிழ் வேதாகமச் சொல்.
- source_word: ταύτην
  choice: இந்த
  rationale: உடனடியாக முன் கூறப்பட்ட உவமையைக் குறிக்கும் அண்மைச் சுட்டு.
- source_word: καὶ πῶς
  choice: அப்படியானால், ... எப்படி
  rationale: இரண்டாம் வினா முதலாவது வினாவிலிருந்து வரும் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தின் நேரடியான வடிவம் ‘அப்படியிருக்க, எப்படி’ அல்லது ‘மேலும் எப்படி’ எனவும் அமையலாம்.
- source_word: πάσας τὰς παραβολὰς
  choice: எல்லா உவமைகளையும்
  rationale: பன்மையுடன் வரும் πᾶς, உவமைகளின் முழுத் தொகுதியையும் பரந்த வகையில் குறிக்கிறது.
- source_word: γνώσεσθε
  choice: புரிந்துகொள்வீர்கள்
  rationale: γινώσκω என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’ என்றாலும், இங்கு உவமைகளின் பொருளை உணர்வதே கருத்து; எதிர்கால வினை வடிவமும் காக்கப்படுகிறது.
theological_decisions:
- issue: οἴδατε மற்றும் γνώσεσθε ஆகிய இரு வினைகளின் உறவு
