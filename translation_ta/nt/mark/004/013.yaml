  rationale: முதல் வினாவில் கூறப்பட்ட புரியாமையிலிருந்து இரண்டாம் வினா தர்க்கரீதியாக எழுகிறது. ‘அப்படியானால்’ என்பது கருத்தைத் தெளிவாக்குகிறது; புதிய இறையியல் முடிவைச் சேர்ப்பதில்லை.
