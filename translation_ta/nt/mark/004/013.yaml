  rationale: இவ்வசனம் உவமைகளைப் பற்றிய வெறும் தகவல் அறிவை அல்ல, அவற்றின் பொருளைப் புரிந்துகொள்வதைப் பற்றியது. ஒரே தமிழ்வினையைப் பயன்படுத்துவது சொல்லாட்சியில் உள்ள வேறுபாட்டைச் சற்றே சமப்படுத்தினாலும், சூழலின் சொல்லாற்றல் வலிமையையும் இரு கிரேக்க வினைகளின் பொருள் ஒட்டுமொத்தத்தையும் தெளிவாகக் காட்டுகிறது.
- issue: καί என்பதன் தர்க்கத் தொடர்பு
  choice: ‘அப்படியானால்’ என்று விளைவுறவை வெளிப்படுத்தல்
