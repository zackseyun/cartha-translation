translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வேளாண்மைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள முளைத்தல், வளர்தல், பலன் தருதல் என்ற முன்னேற்ற வரிசை காக்கப்பட்டுள்ளது.
