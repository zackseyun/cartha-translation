id: MRK.4.8
reference: Mark 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: ta
  text: வேறு சில விதைகள் நல்ல மண்ணில் விழுந்தன[a]. அவை முளைத்து வளர்ந்து பலன் கொடுத்தன; முப்பது மடங்காகவும், அறுபது மடங்காகவும், நூறு மடங்காகவும் விளைச்சல் தந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேறு சில நல்ல மண்ணில் விழுந்தன’ என்றும் மொழிபெயர்க்கலாம்; ‘விதைகள்’ என்பது சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: வேறு சில விதைகள்
  rationale: பலவின்பால் பெயரடையான ἄλλα இங்கு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, முந்தைய சூழலில் சொல்லப்பட்ட விதைகளைக் குறிக்கிறது. தெளிவுக்கும் இயல்பான தமிழுக்கும் ‘விதைகள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: γῆν τὴν καλήν
  choice: நல்ல மண்ணில்
  rationale: விதைப்பு பற்றிய இவ்வேளாண்மைச் சூழலில் γῆ என்பது பரந்த நிலப்பரப்பை அல்ல, பயிர் வளர ஏற்ற மண்ணைக் குறிக்கிறது.
- source_word: ἐδίδου καρπὸν
  choice: பலன் கொடுத்தன
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ச்சியான பலன் உண்டாக்குதலைக் காட்டுகிறது. ‘பலன் கொடுத்தன’ என்பது உருவகப் பொருளையும் வேளாண்மைச் சூழலையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἀναβαίνοντα
  choice: முளைத்து
  rationale: வேளாண்மைச் சூழலில் மேலெழுந்து வருவதைக் குறிக்கும் இச்சொல், தமிழில் விதை செடியாக வெளிவருவதை இயல்பாகக் கூறும் ‘முளைத்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αὐξανόμενα
  choice: வளர்ந்து
  rationale: தொடர்ந்து பெருகி வளர்வதைக் குறிக்கிறது; ἀναβαίνοντα என்பதிலிருந்து வேறுபட்ட வளர்ச்சிக் கட்டத்தை ‘வளர்ந்து’ வெளிப்படுத்துகிறது.
- source_word: ἔφερεν
  choice: விளைச்சல் தந்தன
  rationale: தொடர்ந்து காய்த்து விளைவை அளித்ததை இச்சூழலில் இயல்பாகக் காட்டுகிறது; முந்தைய ‘பலன் கொடுத்தன’ என்பதுடன் தேவையற்ற சொல் மீளலைத் தவிர்க்கிறது.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: சில முப்பது மடங்கும், சில அறுபது மடங்கும், சில நூறு மடங்கும்
  rationale: கிரேக்கத் தொடர் விதைக்கப்பட்ட அளவுடன் ஒப்பிடப்பட்ட விளைச்சல் விகிதங்களைக் குறிக்கிறது. ‘மடங்கு’ அதனைத் தெளிவாகச் சொல்கிறது; மீண்டும் வரும் ἓν ஒவ்வொரு பகுதியையும் தனித்தனியாகக் குறிப்பதால் தமிழில் ‘சில’ சேர்க்கப்பட்டுள்ளது.
