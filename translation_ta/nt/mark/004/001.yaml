source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: ta
  text: அவர் மீண்டும் கடலோரத்தில் போதிக்கத் தொடங்கினார். மிகப் பெரிய மக்கள் கூட்டம் அவரிடம் கூடுகிறது[a]. அதனால் அவர் ஒரு படகில் ஏறி, கடலில் அமர்ந்தார்[b]. மக்கள் கூட்டம் முழுவதும் கடலோரத்தில், கரையில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரிடம் கூடிக்கொண்டிருக்கிறது.” மாற்கு உயிரோட்டமான விவரிப்புக்காக வரலாற்று நிகழ்காலத்தை அடிக்கடி பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர் தண்ணீரின்மேல் இருந்த படகில் அமர்ந்தார்; மக்கள் கூட்டமோ கரையில் இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: இயேசுவின் போதனைச் செயல் மறுபடியும் நிகழ்வதை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: ἤρξατο διδάσκειν
  choice: போதிக்கத் தொடங்கினார்
  rationale: தொடக்கத்தைக் குறிக்கும் கிரேக்கக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: παρὰ τὴν θάλασσαν
  choice: கடலோரத்தில்
  rationale: παρά இங்கு கடலுக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; மூலத்தில் உள்ள θάλασσα என்பதற்கு ஏற்ப ‘கடல்’ தக்கவைக்கப்படுகிறது.
- source_word: συνάγεται
  choice: கூடுகிறது
  rationale: மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: ὄχλος πλεῖστος
  choice: மிகப் பெரிய மக்கள் கூட்டம்
  rationale: πλεῖστος என்பதன் வலியுறுத்தப்பட்ட அளவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: இயேசுவை நோக்கி மக்கள் வந்து கூடுவதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ὥστε
  choice: அதனால்
  rationale: கூட்டத்தின் அளவினால் ஏற்பட்ட விளைவைத் தெளிவாக இணைக்கிறது.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ஒரு படகில் ஏறி
  rationale: மூலத்தின் பங்கேற்புவினைக் கட்டமைப்பை இயல்பான தமிழ் தொடர் வினையாக வெளிப்படுத்துகிறது.
- source_word: καθῆσθαι
  choice: அமர்ந்தார்
  rationale: விளைவாக இயேசு படகில் அமர்ந்த செயலைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: ἐν τῇ θαλάσσῃ
  choice: கடலில்
  rationale: மூலத்தின் சொற்படிவத்தைப் பாதுகாக்கிறது; அவர் நீரில் அல்ல, நீரிலிருந்த படகில் அமர்ந்தார் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: கிரேக்கக் கூட்டு ஒருமையின் முழுமை உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: கடலோரத்தில், கரையில்
  rationale: கூட்டம் கடலருகே இருந்தபோதும் நிலத்தின் மேல் இருந்தது என்ற இரு இடக்குறிப்புகளையும் வேறுபடுத்திப் பாதுகாக்கிறது.
