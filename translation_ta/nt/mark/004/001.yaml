  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: ‘மீண்டும்,’ ‘போதிக்கத் தொடங்கினார்,’ கடலோர இடக்குறிப்பு, வரலாற்று நிகழ்காலமான ‘கூடுகிறது,’ மிகப் பெரிய கூட்டம், படகில் ஏறுதல், கடலில் அமர்ந்திருத்தல், மற்றும் கூட்டம் நிலத்தில்/கரையில் இருந்தமை. ‘கடலில் அமர்ந்தார்’ என்பது முந்திய ‘ஒரு படகில் ஏறி’ என்பதன் சூழலில் படகில் இருந்தபடி நீரின்மேல் அமர்ந்தார் என்பதைக் குறிக்கிறது; அடிக்குறிப்பும் இதைத் தெளிவுபடுத்துகிறது.'
