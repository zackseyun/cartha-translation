  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: ta
  text: அவர் விழித்தெழுந்து, காற்றைக் கடிந்தார்; கடலை[b] நோக்கி, “மௌனமாயிரு! வாயை மூடிக்கொள்!”[a] என்றார். காற்று ஓய்ந்தது; பெரும் அமைதி ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் இரண்டு கட்டளைகள் உள்ளன: “மௌனமாயிரு!” மற்றும், இன்னும் சொற்சொல்லாக, “வாயடைக்கப்பட்டிரு!” மரபுவழியாக, “சமாதானமாயிரு! அடங்கியிரு!” என்றும் மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: இது கலிலேயாக் கடலைக் குறிக்கிறது; கிரேக்கத்தில், “கடல்.”
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: அவர் விழித்தெழுந்து
  rationale: இறந்தகாலச் செயலெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் தருகிறது. கிரேக்கச் சொல்லின் வடிவம் செயப்பாட்டுவினையாக இருந்தாலும், இயேசு தாமாக விழித்தாரா அல்லது எழுப்பப்பட்டாரா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டு
  rationale: மாற்கு நூலில் காணப்படும் அதிகாரமிக்க கடிந்துகொள்ளுதலின் வலிமையைத் தக்கவைக்கிறது; வெறும் எச்சரிக்கை அல்லது மென்மையான கட்டளை என்று மாற்றவில்லை.
- source_word: ἀνέμῳ
  choice: காற்றை
  rationale: மூலச்சொல் நேரடியாகக் ‘காற்று’ என்கிறது; சூழலை விளக்குவதற்காக ‘புயற்காற்று’ என்று விரிவாக்கவில்லை.
- source_word: θαλάσσῃ
  choice: கடலை
  rationale: புவியியல் அடிப்படையில் இது ஒரு ஏரியாக இருந்தாலும், மூலத்தில் உள்ள ‘கடல்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: Σιώπα
  choice: சத்தமிடாதே!
  rationale: உடனே மௌனமாக இருக்கும்படி இடப்படும் நேரடியான கட்டளையை இயல்பான, வலிமையான தமிழில் தருகிறது.
- source_word: πεφίμωσο
  choice: அடங்கியிரு!
  rationale: கடலை நோக்கிய கட்டளையின் பொருளை இயல்பான தமிழில் தருகிறது. ‘வாயடைக்கப்பட்டிரு’ என்ற முகவாய்க்கட்டு உருவகம் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐκόπασεν
  choice: காற்று ஓய்ந்தது
  rationale: காற்று முற்றிலும் தணிந்து நின்றதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γαλήνη μεγάλη
  choice: மிகுந்த அமைதி
  rationale: ‘பெரிய/மிகுந்த அமைதி’ என்ற மூலத்தின் வலியுறுத்தலைத் தக்கவைத்து, சூழலில் இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: கடலுக்குக் கொடுக்கப்பட்ட இரு கட்டளைகளையும் மரபுவழி ‘சமாதானமாயிரு; அடங்கியிரு’ என்று தருவதா, அல்லது கிரேக்கத்தின் கூர்மையான சொற்படிமத்தைப் பாதுகாப்பதா
  choice: முதன்மை உரையில் “சத்தமிடாதே! அடங்கியிரு!” என்றும், முகவாய்க்கட்டு உருவகத்தை அடிக்குறிப்பிலும் தருதல்
  alternative: “சமாதானமாயிரு! அடங்கியிரு!” அல்லது “மௌனமாயிரு! வாயடைக்கப்பட்டிரு!”
  rationale: மூலத்தில் ‘சமாதானம்’ என்ற பெயர்ச்சொல் இல்லை; மௌனத்தையும் வாயைக் கட்டுவதையும் குறிக்கும் இரண்டு கட்டளைகள் உள்ளன. தமிழின் இயல்பையும் இயேசுவின் அதிகாரமிக்க கட்டளையையும் காக்கும் வகையில் முதன்மை உரை அமைக்கப்பட்டு, நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: θάλασσα என்பதைக் ‘கடல்’ என்றா ‘ஏரி’ என்றா மொழிபெயர்ப்பது
  choice: கடல்
  alternative: ஏரி அல்லது கலிலேயா ஏரி
  rationale: மூலச்சொல் ‘கடல்’ என்பதால் அதையே முதன்மை உரையில் வைத்திருக்கிறது; புவியியல் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. “கடிந்துகொண்டு” அதிகாரமிக்க தொனியைத் தக்கவைக்கிறது; “சத்தமிடாதே! அடங்கியிரு!” என்பது வாய்மொழியில் தெளிவாகவும் இயல்பாகவும் இருந்து, மூலத்தின் கடுமையை மென்மையாக்காமல் வழங்குகிறது.
