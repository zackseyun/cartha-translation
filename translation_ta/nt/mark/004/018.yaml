  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: ta
  text: மற்றவர்கள் முட்செடிகளிடையே[a] விதைக்கப்படுபவர்கள்; இவர்களே வார்த்தையைக்[b] கேட்டவர்கள்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முட்செடிகளுக்குள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செய்தியைக்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: மற்றவர்கள்
  rationale: முந்தைய நிலவகைகளுடன் ஒப்பிட்டு வேறொரு குழுவைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பெயரடை; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: εἰς τὰς ἀκάνθας
  choice: முட்செடிகளுக்குள்
  rationale: εἰς என்பதன் திசை/உட்புகும் நுணுக்கத்தையும், முட்கள் நிறைந்த இடத்தில் விதை விழும் வேளாண் சூழலையும் தக்கவைக்கிறது.
- source_word: ἀκάνθας
  choice: முட்செடிகள்
  rationale: வெறும் தனித்தனி முட்களைக் காட்டிலும் விதையை நெருக்கும் முள்ளுள்ள செடிகளைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: σπειρόμενοι
  choice: விதைக்கப்பட்ட
  rationale: நிகழ்காலச் செயல்பாட்டு வடிவம் passive ஆனாலும், உவமையில் விதையுடன் மனிதர்களை அடையாளப்படுத்தும் கருத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: οὗτοί εἰσιν
  choice: இவர்களே
  rationale: விளக்கத்தில் வரும் சுட்டிக்காட்டும் அடையாளப்படுத்தலை தமிழில் சுருக்கமாகவும் அழுத்தமாகவும் வெளிப்படுத்துகிறது.
- source_word: οἱ ... ἀκούσαντες
  choice: கேட்டவர்கள்
  rationale: அடுத்து நிகழப்போகும் செயல்களுக்கு முன்னதாக நிறைவுற்ற கேட்கும் செயலை இறந்தகாலப் பெயரெச்ச வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸν λόγον
  choice: வார்த்தை
  rationale: மாற்குவின் சூழலில் அறிவிக்கப்பட்ட செய்தியைக் குறிக்கும் வேதாகம வழக்கைத் தக்கவைக்கிறது; ‘செய்தி’ என்பதும் பொருத்தமான மாற்று.
theological_decisions:
- issue: உவமை விளக்கத்தில் மக்களை விதையுடன் அடையாளப்படுத்துதல்
  choice: “முட்செடிகளுக்குள் விதைக்கப்பட்ட மற்றவர்கள்” என்ற நேரடி உவமையைத் தக்கவைத்தல்
  alternative: “முட்செடிகள் நிறைந்த நிலத்தில் விதைக்கப்பட்டவர்கள்” அல்லது உவமையை விளக்கிப் பொருளுரைத்தல்
  rationale: கிரேக்கம் மனிதர்களை விதைக்கப்பட்ட விதையுடன் நேரடியாக அடையாளப்படுத்தி உவமையைத் தொடர்கிறது; கூடுதல் விளக்கத்தைச் சேர்க்காமல் அந்த இலக்கிய மற்றும் இறையியல் இழுவையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘இவர்களே’ என்பது οὗτοί εἰσιν என்ற அடையாளப்படுத்தலைத் தெளிவாகக் காட்டுகிறது; வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது.
