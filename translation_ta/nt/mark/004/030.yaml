id: MRK.4.30
reference: Mark 4:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: ta
  text: 'மேலும் அவர் தொடர்ந்து கூறினார்: “கடவுளின் அரசாட்சியை எப்படி ஒப்பிடுவோம்? அல்லது எந்த உவமையில் அதை எடுத்துரைப்போம்[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த உவமையைக் கொண்டு அதை எடுத்துரைப்போம்?” கிரேக்கச் சொற்றொடர், உவமை ஒரு கருத்தை விளக்கும் கருவி என்பதை வலியுறுத்தும் விதத்திலும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து கூறினார்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சி அல்லது மீள்நிகழ்வுத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Πῶς ὁμοιώσωμεν
  choice: எதற்கு ஒப்பிடுவோம்?
  rationale: இது ஆலோசனைத் தொனியுள்ள முதல் நபர் பன்மை வினாவைத் தக்கவைக்கிறது; தமிழில் ஒப்பீட்டின் பொருளைக் கேட்கும் இயல்பான வடிவம்.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சி
  rationale: βασιλεία என்பதிலுள்ள ஆளுகை/அரசுரிமை கருத்தைத் தெளிவாகக் காட்டுகிறது; வெறும் நிலப்பரப்பாகவோ அரசியல் அமைப்பாகவோ குறுக்குவதில்லை.
- source_word: ἐν τίνι ... παραβολῇ
  choice: எந்த உவமையில்
  rationale: ἐν என்பதன் அடிப்படை இடவியல்/சூழல் வடிவத்தை நெருக்கமாகப் பாதுகாக்கிறது; அதன் கருவிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτὴν ... θῶμεν
  choice: அதை எடுத்துரைப்போம்
  rationale: τίθημι என்பதன் சொற்பொருள் ‘வை’ என்றாலும், உவமையுடன் வரும் இச்சொற்றொடரில் ஒரு கருத்தை முன்வைத்து விளக்குதல் என்பதே பொருள்; ‘எடுத்துரைப்போம்’ தமிழில் இயல்பாக அதைக் காட்டுகிறது.
theological_decisions:
- issue: βασιλεία என்பதன் பொருள்
  choice: கடவுளின் அரசாட்சி
  alternative: கடவுளின் அரசு / இறையாட்சி
  rationale: ‘அரசாட்சி’ என்பது கடவுளின் ஆளுகையை முன்னிறுத்துகிறது; அதேவேளையில் குறிப்பிட்ட திருச்சபை மரபின் தனிப்பட்ட சொல்லாட்சியைத் திணிக்காமல் மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தொடர்ந்து கூறினார்’ என்பது கதைநடையில் இயல்பை இழக்காமல் கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சித் தன்மையை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பிறகு வைக்கப்பட்டுள்ளது.
