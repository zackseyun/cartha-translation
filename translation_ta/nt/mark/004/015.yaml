language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: ta
  text: 'வார்த்தை விதைக்கப்படும் வழியோரத்தில் இருப்பவர்கள் இவர்களே: அவர்கள் அதைக் கேட்கும்போது, உடனே சாத்தான் வந்து, அவர்களுக்குள் விதைக்கப்பட்ட வார்த்தையை[a] எடுத்துப்போய்விடுகிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களிடத்தில் விதைக்கப்பட்ட வார்த்தையை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: இவர்களே
  rationale: உவமையின் விளக்கத்தில் குறிப்பிடப்படுபவர்களை அடையாளப்படுத்துகிறது. δέ இங்கு மென்மையான தொடர்பை மட்டும் தருவதால், தமிழில் தனியாக மொழிபெயர்க்காமல் இயல்பான ஓட்டத்தில் விடப்பட்டுள்ளது.
- source_word: οἱ παρὰ τὴν ὁδὸν
  choice: வழியோரத்தில் இருப்பவர்கள்
  rationale: παρά இடத்தைக் குறிக்கிறது; ὁδός என்பதற்கு இவ்விவசாயச் சூழலில் ‘வழி’ இயல்பானது. மக்கள் குறிக்கப்படுகிறார்கள் என்பதை ‘இருப்பவர்கள்’ தெளிவாக்குகிறது.
- source_word: σπείρεται ὁ λόγος
  choice: வார்த்தை விதைக்கப்படும்
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் விதைப்பு உருவகத்தையும் காக்கிறது. λόγος முழு வசனத்திலும் ‘வார்த்தை’ என ஒரேவிதமாக வழங்கப்பட்டுள்ளது.
- source_word: ὅταν ἀκούσωσιν
  choice: அவர்கள் அதைக் கேட்கும்போது
  rationale: பொதுவாக நிகழும் கால உறவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘அதை’ என்பது முன் குறிப்பிடப்பட்ட வார்த்தையைக் குறிக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் நடையில் முக்கியமான உடனடித் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ὁ Σατανᾶς
  choice: சாத்தான்
  rationale: தனிப்பட்ட தீய ஆளைக் குறிக்கும் கிரேக்கப் பெயர்/பட்டத்தின் வழக்கமான தமிழ் வடிவம்.
- source_word: αἴρει
  choice: எடுத்துப்போய்விடுகிறான்
  rationale: ‘எடுத்தல், அகற்றுதல்’ என்ற பரந்த பொருளைக் காக்கும் இயல்பான தமிழ்; ‘பறித்துக்கொள்கிறான்’ என்று கிரேக்கத்தைவிட வலிமையாக விளக்கவில்லை.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: அவர்களுக்குள் விதைக்கப்பட்ட வார்த்தையை
  rationale: பெயரெச்சத் தொடரை ‘வார்த்தை’ என்பதோடு இணைத்து, εἰς αὐτούς என்பதன் உட்புகும்/உள்ளிருக்கும் பொருளை ‘அவர்களுக்குள்’ என வழங்குகிறது.
theological_decisions:
- issue: உவமை விளக்கத்தில் சாத்தானின் தனிப்பட்ட செயற்பாடு
  choice: ‘சாத்தான் வந்து ... எடுத்துப்போய்விடுகிறான்’ என்று தனிப்பட்ட செயற்பாட்டாளராக நேரடியாக வழங்குதல்
  alternative: ‘எதிரி’ போன்ற பொதுவான அல்லது ஆளற்ற கருத்தாக வழங்குதல்
  rationale: ὁ Σατανᾶς என்ற குறிப்பு இங்கு தனிப்பட்ட தீய ஆளைக் இயல்பாகக் குறிக்கிறது; அதை வெறும் கருத்தாக மாற்றாமல் மூலத்தின் இறையியல் அழுத்தம் காக்கப்படுகிறது.
- issue: εἰς αὐτούς என்பதன் உறவு
  choice: ‘அவர்களுக்குள் விதைக்கப்பட்ட’
  alternative: ‘அவர்களிடத்தில் விதைக்கப்பட்ட’
  rationale: εἰς என்பதன் திசை/உட்புகுதல் நிழலை முதன்மை உரை காக்கிறது; ஆனால் தமிழில் இடவுறவாகப் புரியும் மாற்றும் சாத்தியமுள்ளதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. விதைப்பு உருவகமும் ‘வார்த்தை’ என்ற சொல்லின் மறுபயன்பாடும் காக்கப்பட்டுள்ளன; தேவையற்ற சமயமரபுச் சிறப்புச் சொற்கள் சேர்க்கப்படவில்லை.
