source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: ta
  text: 'நல்ல நிலத்தில் விதைக்கப்பட்டவர்கள் அவர்களே: அவர்கள் வார்த்தையைக் கேட்கிறார்கள், அதை ஏற்றுக்கொள்கிறார்கள்[a], முப்பது மடங்காகவும் அறுபது மடங்காகவும் நூறு மடங்காகவும் கனி கொடுக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை ஏற்றுக்கொள்கிறார்கள்’ என்பதற்கு ‘அதை மனமுவந்து ஏற்றுக்கொள்கிறார்கள்’ அல்லது ‘அதை வரவேற்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம் (παραδέχονται).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: இவர்களே
  rationale: முந்தைய வகைகளிலிருந்து இப்போது விளக்கப்படும் நல்ல நிலத்துக்குரியவர்களைச் சுட்டுகிறது. தமிழில் நேரடியாக அடையாளப்படுத்தும் இவ்வமைப்பில் ‘இவர்களே’ இயல்பாகவும் வலியுறுத்தலுடனும் உள்ளது.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: நல்ல நிலத்தில் விதைக்கப்பட்டவர்கள்
  rationale: மூலத்திலுள்ள இறந்தகாலச் செயப்பாட்டு எச்சத்தையும் விதைப்பு உருவகத்தையும் காக்கிறது. தமிழில் விதைப்பைக் குறிப்பிடும்போது ‘நிலத்தில்’ என்பது இயல்பான இடவேற்றுமை வடிவம்.
- source_word: γῆν τὴν καλὴν
  choice: நல்ல நிலம்
  rationale: இந்த உவமையின் வேளாண்மைச் சூழலில் γῆ என்பது பயிரிடத்தக்க மண்ணையோ நிலத்தையோ குறிக்கிறது; ‘நல்ல நிலம்’ நவீனத் தமிழில் இயல்பாகவும் மற்ற நில வகைகளுடனான மதிப்பீட்டு வேறுபாட்டைத் தெளிவாகவும் காட்டுகிறது.
- source_word: ἀκούουσιν τὸν λόγον
  choice: வார்த்தையைக் கேட்டு
  rationale: λόγος இங்கு அறிவிக்கப்படும் செய்தியைக் குறித்தாலும், அதிகாரம் முழுவதும் திரும்பத் திரும்ப வரும் விதை–வார்த்தை தொடர்பை ‘வார்த்தை’ காக்கிறது.
- source_word: παραδέχονται
  choice: அதை ஏற்றுக்கொண்டு
  rationale: இந்த வினை சாதகமாகப் பெற்றுக்கொள்ளுதல் அல்லது வரவேற்றல் என்ற பொருளைக் கொண்டது. ‘அதை’ என்பது முன்வந்த ‘வார்த்தை’யைத் தெளிவாகச் சுட்டுகிறது; கேட்பது, ஏற்றுக்கொள்வது, கனி கொடுப்பது என்ற தொடரையும் இயல்பாகக் காக்கிறது.
- source_word: καρποφοροῦσιν
  choice: கனி கொடுக்கிறார்கள்
  rationale: வேளாண்மை உருவகத்தையும் அதன் ஆன்மீகப் பொருட்சாயலையும் கூடுதல் விளக்கமின்றி நேரடியாகக் காக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: முப்பது மடங்கும் அறுபது மடங்கும் நூறு மடங்கும்
  rationale: விளைச்சலின் பெருக்கத்தைத் தமிழில் தெளிவாகக் காட்ட ‘மடங்கு’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் மீண்டும் வரும் καὶ என்பதன் ஓசையையும் வரிசையையும் ‘-உம்’ வடிவங்கள் காக்கின்றன.
theological_decisions:
- issue: வார்த்தைக்கு நல்ல நிலம் அளிக்கும் பதிலின் இயல்பு
  choice: வார்த்தையைக் கேட்டு, ஏற்றுக்கொண்டு, கனி கொடுக்கும் உண்மையான சாதகப் பதிலாக வசனம் கூறுவதையே மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
  alternative: இது இறுதிவரை நிலைத்திருப்பதை அவசியமாக நிரூபிக்கிறது என்றோ, தொடக்கப் பதிலை மட்டுமே குறிக்கிறது என்றோ விளக்கத்தைச் சேர்த்தல்.
  rationale: கிரேக்க உரை கேட்பது, ஏற்றுக்கொள்வது, கனி கொடுப்பது ஆகியவற்றை மட்டுமே வெளிப்படையாகச் சொல்கிறது. விடாமுயற்சி அல்லது விசுவாசவிலகல் குறித்த பிற்காலக் கோட்பாட்டு முடிவை உரைக்குள் சேர்க்காமல் அதன் இறையியல் இழுவிசை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வார்த்தை’, ‘விதைக்கப்பட்டவர்கள்’, ‘கனி கொடுக்கிறார்கள்’ ஆகியவை மாற்கு 4-இன் தொடர்ச்சியான உருவகச் சொற்களைப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
