id: MRK.4.41
reference: Mark 4:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: ta
  text: அவர்கள் பெரிதும் பயந்தார்கள்[a]. ஒருவருக்கொருவர், “அப்படியானால் இவர் யார்? காற்றும் கடலும் கூட இவருக்குக் கீழ்ப்படிகின்றனவே!” என்று சொல்லிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “அவர்கள் பெரும் பயத்தைப் பயந்தார்கள்.” கிரேக்கத்தில் பயத்தின் தீவிரத்தை வலியுறுத்தும் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: பெரிதும் பயந்தார்கள்
  rationale: வினைச்சொல்லுடன் அதே வேரைச் சேர்ந்த பெயர்ச்சொல்லைப் பயன்படுத்தும் கிரேக்கச் சொற்றொடர் பயத்தின் தீவிரத்தை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் அந்த வலியுறுத்தலைக் காக்கும் வகையிலும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து அல்லது ஒருவரோடொருவர் பேசிக்கொண்டிருந்த நுணுக்கத்தைத் தரக்கூடும்; தமிழ் நிகழ்வுரையில் ‘சொல்லிக்கொண்டார்கள்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πρὸς ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: சீடர்கள் பரஸ்பரம் பேசினார்கள் என்பதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: அப்படியானால் இவர் யார்?
  rationale: ἄρα குறிக்கும் வியப்புடன் கூடிய முடிவுணர்வை ‘அப்படியானால்’ வெளிப்படுத்துகிறது. ‘இவர்’ என்பது நவீனத் தமிழில் இயல்பும் கண்ணியமும் உடைய சுட்டுப்பெயர்.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: காற்றும் கடலும் கூட
  rationale: முதல் καὶ தரும் ‘கூட’ என்ற வியப்பு வலியுறுத்தலையும், இரண்டாம் καὶ இணைக்கும் இரு எழுவாய்களையும் இச்சொற்றொடர் காக்கிறது.
- source_word: ὑπακούει αὐτῷ
  choice: இவருக்குக் கீழ்ப்படிகின்றனவே
  rationale: ὑπακούω இங்கு இயேசுவின் கட்டளைக்கு இயற்கைச் சக்திகள் கீழ்ப்படிவதைச் சுட்டுகிறது. ‘-வே’ சீடர்களின் வியப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: படைப்பின்மேல் இயேசுவுக்குள்ள அதிகாரம்
  choice: சீடர்களின் வியப்பையும் காற்றும் கடலும் அவருக்குக் கீழ்ப்படிவதையும் நேரடியாக வைத்திருத்தல்
  alternative: இயேசுவின் தெய்வீக அடையாளத்தை விளக்கும் சொற்களை வசனத்திற்குள் விரிவாகச் சேர்த்தல்
  rationale: வசனம் இயேசுவின் அசாதாரண அதிகாரத்தை வலுவாக உணர்த்தினாலும், அதன் இறையியல் முடிவை விளக்கவுரையாகச் சேர்க்காமல் சீடர்களின் கேள்வியாகவே முன்வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிகழ்வுரை. கிரேக்கத்தின் தீவிர வலியுறுத்தல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, முதன்மை உரை இயல்பான தமிழில் தரப்பட்டுள்ளது.
