lexical_decisions:
- source_word: ὁ σπείρων
  choice: விதைக்கிறவர்
  rationale: குறிப்பிட்ட நபரைச் சுட்டும் பெயர்ச்சொல் தன்மையுடைய நிகழ்காலப் பங்கேற்புப் பெயரை இயல்பான தமிழில் இவ்வாறு தருகிறது. ‘விவசாயி’ என்பது மூலத்தில் இல்லாத தொழில் அடையாளத்தைச் சேர்க்கும்; ‘விதைப்பவர்’ என்பதைக் காட்டிலும் ‘விதைக்கிறவர்’ சூழலில் இயல்பாக ஒலிக்கிறது.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: λόγος என்பதன் ‘வார்த்தை’ என்ற அடிப்படைப் பொருளைப் பேணி, இவ்வசனமே வெளிப்படையாகச் சொல்லாத ‘கடவுளுடைய வார்த்தை’ அல்லது ‘நற்செய்தி’ என்று விரிவுபடுத்துவதைத் தவிர்க்கிறது. இச்சூழலில் ‘செய்தி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σπείρει
  choice: விதைக்கிறார்
  rationale: உவமை விளக்கத்தில் பொதுவாக நிகழும் செயலைக் குறிக்கும் நிகழ்காலத்தை இயல்பான தமிழ் நிகழ்காலத்தில் தருகிறது; ‘விதைக்கிறவர்—விதைக்கிறார்’ என்ற மூலத்தின் சொல் மறுபயன்பாட்டையும் பேணுகிறது.
theological_decisions:
- issue: உவமை விளக்கத்தில் ‘வார்த்தை’ என்பதன் குறிப்பு
  choice: மூலத்தைப் பின்பற்றி ‘வார்த்தை’ என்று பொதுவாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘செய்தி’, ‘கடவுளுடைய வார்த்தை’, அல்லது ‘நற்செய்தி’
  rationale: கிரேக்க உரையில் τὸν λόγον மட்டுமே உள்ளது. சூழல் அறிவிக்கப்படும் இறைச்செய்தியைக் குறிப்பதாக இருந்தாலும், அதனை முதன்மை உரையில் வெளிப்படையாக விரிவுபடுத்துவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும். ‘செய்தி’ என்ற உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. கிரேக்கத்தில் உள்ள விதைத்தல் சார்ந்த சொல் மறுபயன்பாடு இயன்றவரை பேணப்பட்டுள்ளது; தேவையற்ற சமயவியல் விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
