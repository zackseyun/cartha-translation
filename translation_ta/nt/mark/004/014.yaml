translation:
  language: ta
  text: விதைக்கிறவர் வார்த்தையை[a] விதைக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செய்தி.’ கிரேக்கச் சொல் λόγος சூழலைப் பொறுத்து ‘வார்த்தை’ அல்லது ‘செய்தி’ என்று பொருள்படலாம்.
