source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: ta
  text: அவர்கள் பார்த்துக்கொண்டே பார்த்தும் உணராமலும்[a], கேட்டுக்கொண்டே கேட்டும் புரிந்துகொள்ளாமலும்[c] இருக்கும்படியாக; ஒருவேளை அவர்கள் திரும்பி[b], அவர்களுக்கு மன்னிப்பு அளிக்கப்படாதபடிக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகுத்துணராமலும்.”
    reason: lexical_alternative
  - marker: b
    text: “திரும்பி” என்பதை “திரும்ப” என்றும், சூழலுக்கு ஏற்ப “மனந்திரும்பி” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: இயேசு இங்கே ஏசாயா 6:9–10-ஐ எதிரொலிக்கிறார்; தெய்வீகத் தீர்ப்புக்கும் மக்கள் பதிலளிக்கத் தவறுவதற்கும் இடையிலான பதற்றத்தை அந்தப் பகுதி தக்கவைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: இருக்கும்படியாக
  rationale: நோக்கம் அல்லது விளைவு என்ற இரு சாயல்களுக்கும் இடமளிக்கும் வகையில், கிரேக்க இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: βλέποντες βλέπωσι
  choice: பார்த்துக்கொண்டே பார்த்தும்
  rationale: ஒரே வேர்ச்சொல் மீண்டும் வருவதால் உருவாகும் வலியுறுத்தலையும் முரண்பாட்டுத் தோற்றத்தையும் சுருக்காமல் தக்கவைக்கிறது.
- source_word: ἴδωσιν
  choice: உணராமலும்
  rationale: βλέπω என்பதன் வெளிப்புறப் பார்வையிலிருந்து வேறுபட்டு, உண்மையில் கண்டுணர்தல் அல்லது பகுத்தறிதல் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: ἀκούοντες ἀκούωσι
  choice: கேட்டுக்கொண்டே கேட்டும்
  rationale: ஏசாயாவிலிருந்து எதிரொலிக்கும் செமித்திய இரட்டிப்பு நடையையும் வலியுறுத்தலையும் தமிழில் தக்கவைக்கிறது.
- source_word: συνιῶσιν
  choice: புரிந்துகொள்ளாமலும்
  rationale: மனத்தாலும் உள்ளார்ந்த விதத்திலும் பொருளைப் புரிந்துகொள்வதைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொற்றொடர்.
- source_word: μήποτε
  choice: இல்லாவிட்டால் ... அளிக்கப்படக்கூடும்
  rationale: எதிர்மறையான எதிர்நோக்கை இயல்பான தமிழில் தெரிவிக்கிறது; அவர்கள் திரும்புவதும் மன்னிப்பு பெறுவதும் தவிர்க்கப்படும் சாத்தியமாக முன்வைக்கப்படுவதை மறைக்கவில்லை.
- source_word: ἐπιστρέψωσιν
  choice: திரும்பி
  rationale: திரும்புதல் என்ற அடிப்படை உருவகத்தைப் பாதுகாக்கிறது; மனந்திரும்புதல் என்ற உடன்படிக்கைச் சாயலை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: ἀφεθῇ αὐτοῖς
  choice: அவர்களுக்கு மன்னிப்பு அளிக்கப்படக்கூடும்
  rationale: செயப்பாட்டு வடிவத்தையும் செய்பவர் வெளிப்படையாகக் கூறப்படாத தெய்வீகச் செயப்பாட்டையும் தக்கவைக்கிறது; மன்னிக்கப்படுவது எது என்பதை அளவுக்கு மீறிக் குறிப்பிடவில்லை.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் நோக்கம்/விளைவு பற்றிய பதற்றமும், உவமைகள் மனந்திரும்புதலைத் தடுக்கின்றனவா என்ற கேள்வியும்
  choice: ἵνα-வின் நோக்கம்/விளைவு மொழியையும் μήποτε-யின் எதிர்மறையான எதிர்நோக்கையும் தக்கவைத்தல்
  alternative: இதை மக்களின் பதிலளிக்காமையை மட்டும் விவரிக்கும் விளைவாக மென்மைப்படுத்துதல்
  rationale: கிரேக்க உரை தெய்வீகத் தீர்ப்புக்கும் மக்களின் பதிலளிக்காமைக்கும் இடையிலான கடினமான பதற்றத்தைத் தீர்க்காமல் வைக்கிறது; மொழிபெயர்ப்பும் அதை ஒரு கோட்பாட்டு திசையில் தீர்த்துவிடக் கூடாது.
- issue: ἐπιστρέψωσιν என்பது சாதாரணமாகத் திரும்புவதா அல்லது மனந்திரும்புவதா
  choice: முதன்மை உரையில் ‘திரும்பி’; மனந்திரும்புதல் என்ற சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையிலேயே ‘மனந்திரும்பி’
  rationale: தீர்க்கதரிசனச் சூழலில் மனந்திரும்புதல் என்ற சாயல் உண்மையானது; எனினும் கிரேக்க வினை அதைவிட விரிவானது. ஆகவே அதன் இயல்பான உருவகமும் பொருள் நெகிழ்வும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் திட்டமிட்ட இரட்டிப்பு ‘பார்த்துக்கொண்டே பார்த்தும்’ மற்றும் ‘கேட்டுக்கொண்டே கேட்டும்’ என்று பாதுகாக்கப்பட்டுள்ளது. இறுதிப் பகுதியின் கடினமான இறையியல் பதற்றம் விளக்கவுரையால் தீர்க்கப்படாமல், தமிழில் புரியக்கூடிய எதிர்நோக்கு அமைப்பாக வழங்கப்பட்டுள்ளது.
