source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: ta
  text: அவர் உவமையின்றி அவர்களிடம் பேசிவந்ததில்லை; ஆனால் தனியாகத் தம் சொந்தச் சீடர்களுக்கு[b] அனைத்தையும் விளக்கிவந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அனைத்தையும் விளக்கினார்,’ ‘அனைத்திற்கும் பொருள் கூறினார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் விளக்குதல், பொருள் உரைத்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தம் சொந்தச் சீடர்கள்’ என்பது, அவர்கள் அவருக்குரிய சீடர்கள் என்பதை வலியுறுத்தும் கிரேக்க அடைமொழியின் பொருளைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: உவமையின்றி
  rationale: ‘உவமை இல்லாமல்/உவமையைத் தவிர்த்து’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ஒருமை வடிவத்தையும் காக்கிறது.
- source_word: οὐκ ἐλάλει
  choice: பேசிவந்ததில்லை
  rationale: நிகழ்ந்துகொண்டிருந்த அல்லது வழக்கமான செயலைக் குறிக்கும் இறந்தகால நிறைவுறா வினையின் கூறைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: பொதுமக்களிடம் பேசியதற்கு மாறாக, சீடர்களுடன் தனிப்பட்ட சூழலில் பேசியதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: தம் சொந்தச் சீடர்களுக்கு
  rationale: ἰδίοις என்பதிலுள்ள உடைமைசார் வலியுறுத்தலை ‘சொந்த’ என்பதன் மூலம் காக்கிறது; எழுவாயாகிய இயேசுவையே சுட்ட ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπέλυεν
  choice: விளக்கிவந்தார்
  rationale: ‘விளக்கு, பொருள் உரை’ என்ற சொல்லின் பரப்பில், நவீனத் தமிழில் எளிதில் புரியும் தேர்வு; இறந்தகால நிறைவுறா கூறையும் காக்கிறது.
- source_word: πάντα
  choice: அனைத்தையும்
  rationale: கிரேக்கத்தின் விரிவான, வரையறுக்கப்படாத பொருளை அப்படியே காக்கிறது; அதை ‘எல்லா உவமைகளையும்’ என்று குறுக்கவில்லை.
theological_decisions:
- issue: இயேசு தனியாக விளக்கியவற்றின் வரம்பு
  choice: அனைத்தையும்
  alternative: எல்லா உவமைகளையும் / அவர் கூறிய அனைத்தையும்
  rationale: மூலத்தில் πάντα என்று மட்டும் உள்ளது. சூழல் உவமைகளையோ போதனையையோ சுட்டலாம்; ஆனால் மொழிபெயர்ப்பு மூலத்தைவிட அதன் வரம்பைக் குறுக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு நிறைவுறா வினைகளும் ‘பேசிவந்ததில்லை,’ ‘விளக்கிவந்தார்’ என வழக்கமான அல்லது தொடர்ச்சியான செயலை வெளிப்படுத்துகின்றன. அரைப்புள்ளி பொதுப் போதனைக்கும் தனிப்பட்ட விளக்கத்திற்கும் இடையிலான மாறுபாட்டைத் தெளிவாக்குகிறது.
