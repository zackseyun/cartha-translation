source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் தொடர்ந்து கூறினார்: “ஒரு விளக்கு தானியத்தை அளக்கும் பாத்திரத்தின்[a] கீழோ கட்டிலின் கீழோ வைக்கப்படுவதற்காக வருவதில்லை அல்லவா? விளக்குத்தாங்கியின்மேல் வைக்கப்படுவதற்காகத்தானே வருகிறது?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலச்சொல் உலர் தானியத்தை அளப்பதற்கான அளவையும் அதற்கான பாத்திரத்தையும் குறிக்கிறது; பாரம்பரிய மொழிபெயர்ப்புகளில் ‘மரக்கால்’ என்றும் வழங்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து கூறினார்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்ச்சி அல்லது மீள்நிகழ்வு சார்ந்த கூறை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Μήτι
  choice: வருமா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைத் தமிழில் சூழலும், அதைத் தொடர்ந்து வரும் ‘அல்லவா’ வினாவும் தெளிவாக்குகின்றன.
- source_word: ἔρχεται ὁ λύχνος
  choice: ஒரு விளக்கு ... வருமா?
  rationale: விளக்கு தானாக ‘வருவது’ போன்ற மூலமொழியின் உயிரூட்டப்பட்ட, பழமொழித் தன்மையுள்ள உருவகத்தைப் பாதுகாக்கிறது; பொதுவான உண்மையைச் சொல்வதால் ‘ஒரு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: λύχνος
  choice: விளக்கு
  rationale: இது ஒளியை அல்ல, எடுத்துச் செல்லக்கூடிய எண்ணெய் விளக்கைக் குறிக்கிறது.
- source_word: μόδιον
  choice: தானிய அளவைப் பாத்திரம்
  rationale: உலர் தானியத்தை அளக்கும் அளவையும் அதற்கான பாத்திரத்தையும் குறிக்கும் சொல்லை, இன்றைய வாசகருக்குப் புரியும் வகையில் தருகிறது.
- source_word: κλίνην
  choice: கட்டில்
  rationale: வீட்டுச் சூழலிலுள்ள படுக்கை அல்லது சாய்விருக்கையை குறிக்கும் உருவகத்திற்கு இயல்பான தமிழ்ச் சொல்.
- source_word: λυχνίαν
  choice: விளக்குத் தண்டு
  rationale: விளக்கை உயரத்தில் வைப்பதற்குரிய குறிப்பிட்ட தாங்கியைத் தெளிவாகக் குறிக்கிறது.
- source_word: τεθῇ
  choice: வைக்கப்படுவதற்காக
  rationale: செயப்பாட்டு வடிவத்தையும் ἵνα தரும் நோக்கப் பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘விளக்கு வருகிறது’ என்ற உயிரூட்டப்பட்ட சொல்லாட்சியைப் பாதுகாப்பதா அல்லது ‘விளக்கைக் கொண்டுவருவார்களா’ என்று இயல்பாக்குவதா
  choice: ‘ஒரு விளக்கு ... வருமா?’ என்று செய்பாட்டு உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘ஒரு விளக்கைக் கொண்டுவந்து ... வைப்பார்களா?’
  rationale: இயேசுவின் கூற்றிலுள்ள உயிரோட்டமான பழமொழித் தன்மையையும் மூலத்தின் திட்டமிட்ட உருவகத் திருப்பத்தையும் இது காக்கிறது; அடிக்குறிப்பு தவறான புரிதலைத் தவிர்க்க உதவுகிறது.
- issue: ὁ λύχνος என்பதிலுள்ள சுட்டுத்தன்மையைத் தமிழில் எவ்வாறு வெளிப்படுத்துவது
  choice: பொதுப்பொருளில் ‘ஒரு விளக்கு’
  alternative: ‘அந்த விளக்கு’ அல்லது ‘விளக்கு’
  rationale: இங்கு ஒரு குறிப்பிட்ட விளக்கை அல்ல, விளக்கின் இயல்பான பயன்பாட்டைப் பற்றிய பொதுவான பழமொழி உண்மை கூறப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைக்குரிய பொதுத்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தானிய அளவைப் பாத்திரம்’ என்பது இன்றைய வாசகருக்குத் தெளிவாக இருக்கத் தேர்ந்தெடுக்கப்பட்டது; பாரம்பரியமான ‘மரக்கால்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. இரண்டு வினாக்களின் எதிர்பார்க்கப்பட்ட பதில்களையும் மாற்றாமல், இரண்டாவது வினாவில் ‘அல்லவா’ மூலம் சொல்லாட்சியின் வலிமை பாதுகாக்கப்பட்டுள்ளது.
