  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: ta
  text: அவர் அவர்களிடம், “தேவனுடைய அரசாட்சியின் மறைபொருள் உங்களுக்குக் கொடுக்கப்பட்டிருக்கிறது; ஆனால் வெளியே இருப்பவர்களுக்கு எல்லாமும் உவமைகளின் வழியாகவே வருகிறது,” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: இது வெறும் புரியாத ‘மர்மம்’ என்பதைவிட, முன்பு மறைந்திருந்து இப்போது வெளிப்படுத்தப்படும் தேவனுடைய நோக்கம் அல்லது உண்மையைக் குறிக்கிறது.
- source_word: βασιλείας τοῦ θεοῦ
  choice: தேவனுடைய அரசாட்சி
  rationale: βασιλεία என்பதன் ஆட்சிசெயல் மற்றும் ஆளுகை சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; ஒரு நிலப்பரப்பை மட்டும் குறிக்கும் ‘ராஜ்யம்’ என்பதைத் தவிர்க்கிறது.
- source_word: τοῖς ἔξω
  choice: வெளியே இருப்பவர்களுக்கு
  rationale: சீடர் வட்டத்துக்கு வெளியே இருப்பவர்களைக் குறிக்கும் மூலத்தின் இடவியல் உருவகத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளாகவே
  rationale: இங்கு ἐν என்பது வழிமுறை அல்லது வடிவத்தைக் குறிக்கிறது; இயல்பான தமிழில் ‘உவமைகளாக’ என வழங்கப்பட்டது.
- source_word: τὰ πάντα γίνεται
  choice: எல்லாம் … நிகழ்கின்றன
  rationale: γίνεται என்பதன் ‘நிகழ்கிறது/வருகிறது’ என்ற இயக்கமுள்ள பொருளைப் பாதுகாக்கிறது; ‘எல்லாம் உவமைகளில் இருக்கின்றன’ என்று நிலையானதாக மாற்றவில்லை.
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: குறையிறந்த காலத்தின் தொடர்ச்சியான அல்லது வழக்கமான செயற்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மறைபொருள் யாருக்குக் கிடைக்கிறது
  choice: ‘உங்களுக்குக் கொடுக்கப்பட்டிருக்கிறது’ என்ற இறையியல் செயப்பாட்டு வடிவம் பாதுகாக்கப்பட்டது.
  alternative: ‘நீங்கள் அறிந்துகொள்ள அனுமதிக்கப்பட்டிருக்கிறீர்கள்’
  rationale: மூலத்தில் உள்ள δέδοται என்ற தெய்வீகப் பரிசளிப்பு அல்லது வெளிப்படுத்தல் நுணுக்கத்தை விளக்கிச் சுருக்காமல் காக்கிறது.
- issue: வெளியாருக்கு உவமைகள் செயல்படும் விதம்
  choice: ‘எல்லாம் உவமைகளாகவே நிகழ்கின்றன’
  alternative: ‘எல்லாம் உவமைகளில் சொல்லப்படுகின்றன’
  rationale: மூலத்தின் γίνεται வடிவம் ‘சொல்லப்படுகின்றன’ என்று குறிப்பிடவில்லை. அதன் சற்றுக் கடினமான, இறையியல் பதற்றமுள்ள சொல்லமைப்பைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘தேவனுடைய அரசாட்சி’ பொதுவாசகருக்குப் புரியும் வகையில் ஆளுகை நுணுக்கத்தைத் தருகிறது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
