source:
  edition: SBLGNT
  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: ta
  text: வேறொரு விதை முட்செடிகளுக்குள் விழுந்தது. முட்செடிகள் வளர்ந்து வந்து அதை நெரித்தன; அது கனியைக் கொடுக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: வேறொரு விதை
  rationale: முந்தைய சூழலில் விதைப்பவனின் விதையே குறிக்கப்படுவதால், கிரேக்கத்தில் மறைமுகமாக உள்ள பெயர்ச்சொல்லைத் தமிழில் தெளிவுக்காகச் சேர்த்துள்ளது.
- source_word: ἔπεσεν
  choice: விழுந்தது
  rationale: πίπτω என்ற வினையின் நேரடியான பொருளைத் தருகிறது; ‘விதைக்கப்பட்டது’ என்று மொழிபெயர்ப்பது இங்கு இல்லாத கருத்தை வினைக்குள் சேர்த்துவிடும்.
- source_word: εἰς τὰς ἀκάνθας
  choice: முட்செடிகளுக்குள்
  rationale: εἰς என்பதன் ‘உள்ளே/உள்நோக்கி’ என்ற பொருளையும், முட்செடிகள் நிறைந்த இடத்தில் விதை விழுந்த காட்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀνέβησαν
  choice: வளர்ந்து வந்து
  rationale: தாவரங்கள் மேலெழுந்து வளர்வதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: συνέπνιξαν
  choice: நெருக்கி மூச்சுத்திணறச் செய்தன
  rationale: முட்செடிகள் விதையின் வளர்ச்சியை நெருக்கித் தடுக்கும் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: αὐτό
  choice: அதை
  rationale: ஒருமையில் குறிக்கப்படும் விதையைத் தெளிவாகச் சுட்டுகிறது.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: அது கனியைக் கொடுக்கவில்லை
  rationale: ‘கனியைக் கொடுக்கவில்லை’ என்பது கிரேக்கச் சொற்றொடரின் வடிவத்தையும் வேளாண்மைச் சூழலையும் இயல்பாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டது. விதை மற்றும் முட்செடிகள் என்ற உவமைக் காட்சியை விளக்கவுரையால் விரிவாக்காமல் அப்படியே பேணுகிறது.
