source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: ta
  text: அது ஒரு கடுகு விதையைப் போன்றது[a]. அது நிலத்தில் விதைக்கப்படும்போது, நிலத்திலுள்ள எல்லா விதைகளையும்விடச் சிறியதாக[b] இருக்கும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு கடுகு மணி.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘மிகச் சிறியது’ என்னும் உயர்படி அல்ல, ‘சிறியது’ என்னும் ஒப்பீட்டுப் படி பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: அது ... போன்றது
  rationale: முந்தைய வசனத்தின் கேள்வியைச் சார்ந்துள்ள ஒப்புமையை இயல்பான தமிழில் நிறைவான வாக்கியமாகத் தருகிறது.
- source_word: κόκκῳ σινάπεως
  choice: ஒரு கடுகு விதை
  rationale: κόκκος என்பது ‘மணி’ அல்லது ‘விதை’ எனப் பொருள்படலாம்; தாவர உவமையில் ‘கடுகு விதை’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὅταν σπαρῇ
  choice: விதைக்கப்படும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் பொதுவான காலச் சூழலைக் குறிக்கிறது; தமிழில் ‘விதைக்கப்படும்போது’ அந்தப் பொதுப் பொருளையும் செயப்பாட்டு நிலையையும் காக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: நிலத்தில்
  rationale: வேளாண்மைச் சூழலில் γῆ என்பது உலகம் முழுவதையும் அல்ல, மண் அல்லது நிலத்தைக் குறிக்கிறது. ‘நிலத்தில்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: μικρότερον ὂν
  choice: சிறியதாக இருக்கிறது
  rationale: μικρότερον என்னும் ஒப்பீட்டுப் படியை ‘எல்லா விதைகளையும்விடச் சிறியதாக’ என்று வெளிப்படையாகக் காக்கிறது; ὂν என்னும் பங்கேற்பு வடிவம் தமிழில் தெளிவுக்காக வினைமுற்றாக வழங்கப்படுகிறது.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: நிலத்திலுள்ள எல்லா விதைகளையும்விட
  rationale: ஒப்பீட்டுக்குரிய மரபுத்தொடரை இயல்பான தமிழ் ‘-விட’ அமைப்பில் தருவதோடு, கிரேக்கத்தில் மீண்டும் வரும் நிலம் குறித்த வரையறையையும் காக்கிறது.
theological_decisions:
- issue: கடுகு விதையின் அளவை ஒப்பீட்டுப் படியாகவா உயர்படியாகவா மொழிபெயர்ப்பது
  choice: நிலத்திலுள்ள எல்லா விதைகளையும்விடச் சிறியதாக
  alternative: நிலத்திலுள்ள விதைகளில் மிகச் சிறியதாக
  rationale: மூலத்தில் μικρότερον என்பது வெளிப்படையான உயர்படி அல்ல, ஒப்பீட்டுப் படி. ஆகவே ‘-விடச் சிறியது’ என்ற வடிவம் மூலத்தின் இலக்கண வேறுபாட்டைக் காக்கிறது; அதேவேளையில் உவமையின் தொடக்கச் சிறுமையையும் தெளிவாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலவாக்கியம் அடுத்த வசனத்துக்குத் தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘நிலத்தில்’ என்ற சொல் வேளாண்மைச் சூழலுக்கு இயல்பாக இருப்பதுடன், மூலத்தில் இருமுறை வரும் நிலம் குறித்த குறிப்பும் தக்கவைக்கப்பட்டுள்ளது.
