reference: Mark 4:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: ta
  text: ஏனெனில், வெளிப்படுத்தப்படுவதற்காகவே அன்றி எதுவும் மறைந்திருப்பதில்லை; வெளிப்படையாகத் தெரியவருவதற்காகவே அன்றி எதுவும் மறைவானதாக ஆகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதுவும் வெளிப்படுத்தப்படுவதற்காக அல்லாமல் மறைந்திருப்பதில்லை; எதுவும் வெளிப்படையாகத் தெரியவருவதற்காக அல்லாமல் மறைவானதாக ஆகவில்லை.” கிரேக்க மொழியிலுள்ள ἵνα கூறுகள் நோக்கத்தையோ விளைவையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: மறைந்திருப்பது
  rationale: மறைவாக அல்லது பிறர் பார்வைக்குப் புலப்படாமல் இருப்பதைக் குறிக்கும் அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது; திட்டமிட்ட இரகசியம் என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- source_word: ἐὰν μὴ ἵνα
  choice: …வதற்காகவே அன்றி
  rationale: விதிவிலக்கையும் ἵνα தரும் நோக்க நுணுக்கத்தையும் ஒருங்கே காக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: φανερωθῇ
  choice: வெளிப்படுத்தப்படுவதற்காக
  rationale: φανερόω என்பதன் செயலப்பாட்டு வடிவத்தையும், மறைந்தது வெளிப்படுதல் அல்லது அறியப்படுதல் என்ற பொருளையும் காக்கிறது.
- source_word: ἀπόκρυφον
  choice: மறைவானதாக
  rationale: பார்வையிலிருந்து மறைக்கப்பட்ட அல்லது மறைவில் உள்ள நிலையைச் சுட்டுகிறது; κρυπτόν உடன் உள்ள இணைநிலையைப் பேணுகிறது, அதேவேளை சொற்களை அப்படியே மீண்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: ἐγένετο
  choice: ஆனதும்
  rationale: ஒரு நிலைக்கு வந்தது என்ற γίνομαι வினையின் இயக்கத்தைக் காக்கிறது; யாரோ அதை மறைத்தார் என்று கிரேக்கத்தில் இல்லாத செய்பவரைச் சேர்க்கவில்லை.
- source_word: ἔλθῃ εἰς φανερόν
  choice: வெளிப்படையாகத் தெரியவருவதற்காக
  rationale: ‘புலப்படும் நிலைக்கு வருதல்’ என்ற இயக்கத்தையும் விளைவையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘வெளிச்சம்’ என்று மூலத்தில் இல்லாத உருவகத்தைத் திணிக்கவில்லை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் இந்தக் கூற்றை விளக்க உறவால் இணைக்கிறது.
theological_decisions:
- issue: இருமுறை வரும் ἵνα கூறுகளின் நோக்கம்/விளைவு நுணுக்கம்
  choice: முதன்மை உரையில் ‘…வதற்காகவே’ என்று நோக்க நுணுக்கத்துடன் மொழிபெயர்த்தல்
  alternative: ‘…வதாகவே இருக்கிறது’ அல்லது ‘…விளங்கும்’ என்று விளைவு நுணுக்கத்துடன் மொழிபெயர்த்தல்
  rationale: ἵνα பொதுவாக நோக்கத்தைக் குறித்தாலும், கொய்னே கிரேக்கத்தில் விளைவு நுணுக்கத்தையும் ஏற்க முடியும். முதன்மை உரை நோக்கத்தைப் பேணுகிறது; அடிக்குறிப்பு மாற்று நுணுக்கத்தை வெளிப்படையாகக் காட்டி, மறைந்திருப்பதற்குப் பின்னால் தெய்வீகக் காரணம் இருப்பதாக அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரு இணை வாக்கியங்களின் அமைப்பும் எதிரெதிர் கருத்துகளும் பேணப்பட்டுள்ளன; ‘மறைவானதாக ஆனது’ என்ற சற்றே குறியிடப்பட்ட சொற்றொடர் ἐγένετο என்பதையும் செய்பவர் குறிப்பிடப்படாத நிலையையும் பாதுகாக்கிறது.
