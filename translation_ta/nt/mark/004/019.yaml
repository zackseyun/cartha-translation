id: MRK.4.19
reference: Mark 4:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: ta
  text: இக்காலத்தின் கவலைகளும்[a], செல்வத்தின் வஞ்சகமும்[b], மற்றவற்றின்மீதான ஆசைகளும் உள்ளே புகுந்து, வார்த்தையை நெரித்துவிடுகின்றன; அது கனியற்றதாகிவிடுகிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த உலகத்தின் கவலைகள்.” கிரேக்கச் சொல் அடிப்படையில் “காலம்/யுகம்” என்றும், விரிவான பொருளில் தற்போதைய உலக ஒழுங்கு என்றும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “செல்வம் தரும் மயக்கம்.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் நேரடியாக, “அது கனியற்றதாகிவிடுகிறது” என்று உள்ளது. மிக அருகிலுள்ள குறிப்பு “வார்த்தை”; உவமையின் அடிப்படையில் விதை அல்லது கேட்பவரும் கருத்தில் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: கவலைகள்
  rationale: சுமையாக அழுத்தும் அக்கறைகள் அல்லது மனக்கவலைகள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; வெறும் உளவியல் பதற்றமாகக் குறுக்கவில்லை.
- source_word: τοῦ αἰῶνος
  choice: இக்காலத்தின்
  rationale: αἰών என்பதிலுள்ள காலம் அல்லது யுகம் சார்ந்த நுணுக்கத்தையும், தற்போதைய உலக ஒழுங்கைக் குறிக்கும் விரிவான பொருளையும் தக்கவைக்கிறது.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: செல்வத்தின் வஞ்சகம்
  rationale: செல்வம் நம்பிக்கை ஊட்டி ஏமாற்றும் தன்மையைக் காட்டுகிறது; மூலத்தின் பெயர்ச்சொல் அமைப்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: மற்றவற்றின்மீதான ஆசைகள்
  rationale: வார்த்தையைத் தவிர பிற பொருட்களையும் காரியங்களையும் நோக்கிச் செல்லும் பலவகை ஆசைகளை இயல்பாகவும் பரந்த பொருளுடனும் தெரிவிக்கிறது.
- source_word: εἰσπορευόμεναι
  choice: உள்ளே புகுந்து
  rationale: இந்தச் செல்வாக்குகள் ஒருவருக்குள் நுழைந்து ஆக்கிரமிப்பதைப் பற்றிய உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது; பெண்பால் பன்மை வடிவம் பட்டியலிலுள்ள மூன்று கூறுகளுடனும் தொடர்புடையதாகத் தமிழில் இயல்பாக வாசிக்கப்படுகிறது.
- source_word: συμπνίγουσιν
  choice: நெரித்துவிடுகின்றன
  rationale: விதையைச் சுற்றியுள்ளவை அதன் வளர்ச்சியை மூச்சுத்திணறச் செய்து அடக்கும் உவமையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: அறிவிக்கப்பட்ட செய்தியைக் குறிக்கும் வேதாகமப் பயன்பாட்டையும் விதை பற்றிய உவமையுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: ἄκαρπος γίνεται
  choice: அது கனியற்றதாகிவிடுகிறது
  rationale: ‘ஆகிறது’ என்ற நிகழ்வு–விளைவு உணர்வையும் ஒருமை வடிவத்தையும் காக்கிறது; ‘அது’ என்ற சுட்டுப்பெயர் மூலத்தில் உள்ள மறைமுக எழுவாயைத் தேவையின்றி விரித்துரைக்காது.
theological_decisions:
- issue: இறுதியிலுள்ள ஒருமை வினை மற்றும் பெயரடையின் குறிப்பு
  choice: ‘அது கனியற்றதாகிவிடுகிறது’ என்று மொழிபெயர்த்து, மிக அருகிலுள்ள ஒருமை முன்னிலையான ‘வார்த்தை’ முதன்மைக் குறிப்பாக இருக்க அனுமதிக்கப்பட்டது.
  alternative: கேட்பவர் கனியற்றவராகிறார்; அல்லது விதை/செடி கனியற்றதாகிறது.
  rationale: இலக்கணப்படி τὸν λόγον (‘வார்த்தை’) மிக அருகிலுள்ள வெளிப்படையான ஒருமை முன்னிலை. அதேவேளை உவமையின் படிமத்தில் வார்த்தை, விதை, அதைப் பெறும் நபர் ஆகியவை ஒன்றோடொன்று தொடர்புடையவை. ஆகவே முதன்மை வாசிப்பைத் தக்கவைத்தும் மாற்றுக் குறிப்புகளை அடிக்குறிப்பில் வெளிப்படுத்தியும் தீர்க்கப்படாத பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘இக்காலம்’ என்பது ‘யுகம்’ என்ற சற்றே தொழில்நுட்பமான சொல்லைவிட இயல்பாக இருந்தாலும், மூலத்தின் கால நுணுக்கத்தைத் தக்கவைக்கிறது. பட்டியலிலுள்ள மூன்று கூறுகளும் ‘உள்ளே புகுந்து’ வார்த்தையை நெரிப்பதாக வாக்கிய அமைப்பு தெளிவுபடுத்துகிறது.
