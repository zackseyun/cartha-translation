source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: ta
  text: அவர்களுக்குள் வேர் இல்லை; ஆனால் அவர்கள் சிறிது காலம் மட்டுமே நிலைத்திருக்கிறார்கள். பின்பு, வார்த்தையின் காரணமாக நெருக்கடியோ துன்புறுத்தலோ ஏற்படும்போது, உடனே விலகிவிடுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இடறிவிழுகிறார்கள்” அல்லது “இடறச் செய்யப்படுகிறார்கள்.” கிரேக்க வினைச்சொல் மனம் புண்பட்டு ஏற்றுக்கொள்ளாமல் போவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: வேர்
  rationale: விதை மற்றும் நிலம் பற்றிய உவமையின் வேளாண் உருவகத்தை அப்படியே காக்கிறது; மூலத்தில் இல்லாத ‘ஆழமான’ அல்லது ‘உறுதியான’ என்ற கருத்துகளைச் சேர்க்கவில்லை.
- source_word: ἐν ἑαυτοῖς
  choice: தங்களுக்குள்
  rationale: தற்சுட்டுப் பொருளை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πρόσκαιροί
  choice: சிறிது காலமே நிலைத்திருக்கிறார்கள்
  rationale: ஒரு காலத்திற்கு மட்டுமே நீடிப்பதைக் குறிக்கிறது; நிலையற்ற மனப்பான்மை போன்ற கூடுதல் உளவியல் கருத்தை இறக்குமதி செய்யவில்லை.
- source_word: εἶτα
  choice: பின்பு
  rationale: அடுத்ததாக நிகழும் வளர்ச்சியை இயல்பாகக் குறிக்கிறது.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: நெருக்கடியோ துன்புறுத்தலோ ஏற்படும்போது
  rationale: மூலத்தின் காலச் சூழலை ‘ஏற்படும்போது’ எனத் தெளிவாக்குகிறது; θλῖψις என்பதிலுள்ள அழுத்தம் மற்றும் துயரத்தின் பொருளை ‘நெருக்கடி’ காக்கிறது, διωγμός என்பதைக் குறிப்பாக ‘துன்புறுத்தல்’ என வழங்குகிறது.
- source_word: διὰ τὸν λόγον
  choice: வார்த்தையின் காரணமாக
  rationale: உவமையின் சூழலில் அறிவிக்கப்பட்ட வார்த்தையைக் குறிக்கிறது; பத்தியெங்கும் தொடரும் சொல் ஒற்றுமையையும் காக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவில் மீண்டும் மீண்டும் வரும் அவசரத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: σκανδαλίζονται
  choice: விலகிவிடுகிறார்கள்
  rationale: வார்த்தையை முதலில் ஏற்றுக்கொண்டவர்கள் அழுத்தத்தின் கீழ் தொடர்ந்து நிலைக்காமல் போவதைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது. கிரேக்கச் சொல்லின் உருவகமான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: சீடத்துவமும் விலகிப்போதலும் சார்ந்த சூழலில் σκανδαλίζονται என்பதன் மொழிபெயர்ப்பு
  choice: விலகிவிடுகிறார்கள்
  alternative: இடறிவிழுகிறார்கள்; இடறச் செய்யப்படுகிறார்கள்; மனம் புண்பட்டு ஏற்றுக்கொள்ளாமல் போகிறார்கள்
  rationale: இந்த வசனம் வார்த்தையைச் சிறிது காலம் ஏற்றுக்கொண்டு, நெருக்கடி அல்லது துன்புறுத்தலின்போது நிலைத்திருக்காதவர்களை விவரிக்கிறது. ‘விலகிவிடுகிறார்கள்’ என்பது அந்தச் செயலின் தீவிரத்தைக் காட்டுகிறது; அதேவேளை இறுதி இரட்சிப்பைப் பற்றி மூலவசனம் கூறுவதைக் கடந்த ஒரு கோட்பாட்டுத் தீர்ப்பைச் சேர்ப்பதில்லை. உருவக மற்றும் உணர்வுசார் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. வேர், வார்த்தை ஆகிய தொடர்ச்சியான உருவகச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன; கருத்தை மிகையாக விளக்கும் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
