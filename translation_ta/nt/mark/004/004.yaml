translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொகை ஒருமை தமிழில் இயல்புக்காகப் பன்மையாக மாற்றப்பட்டாலும், விதையின் ஒரு பகுதி என்ற பொருள் காக்கப்பட்டுள்ளது.
