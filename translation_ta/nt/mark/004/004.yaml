source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: ta
  text: அவன் விதைத்துக்கொண்டிருந்தபோது, சில விதைகள் பாதையோரத்தில்[a] விழுந்தன. பறவைகள் வந்து அவற்றைத் தின்றுவிட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாதைக்கு அருகில்.’ கிரேக்கச் சொற்றொடர் பாதையின் ஓரமாக அல்லது அதற்கு அருகில் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: அவன் விதைத்துக்கொண்டிருந்தபோது
  rationale: ἐγένετο ἐν + பெயர்ச்சொல்லாக்கப்பட்ட வினையெச்சம் இங்கு ஒரு செயல் நடந்துகொண்டிருந்த வேளையில் நிகழ்ந்ததை அறிமுகப்படுத்தும் கிரேக்கக் கதைநடை அமைப்பு. தமிழில் இயல்பாகவும் காலத் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: ὃ μὲν
  choice: சில விதைகள்
  rationale: நடுநிலை ஒருமை உறவுப்பெயரும் μέν என்பதும் விதைக்கப்பட்ட விதையின் ஒரு பகுதியைத் தொகுப்பாகக் குறிக்கின்றன. நவீன தமிழில் ‘சில விதைகள்’ என்பதே அந்தப் பகுப்புணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔπεσεν
  choice: விழுந்தன
  rationale: πίπτω என்பதன் இச்சூழலுக்குரிய நேரடியான பொருள். தமிழில் ‘சில விதைகள்’ என்ற பன்மை எழுவாய்க்கு ஏற்ப வினை பன்மையில் அமைக்கப்பட்டுள்ளது.
- source_word: παρὰ τὴν ὁδόν
  choice: பாதையோரத்தில்
  rationale: παρά + குற்றுவேற்றுமை இங்கு பாதைக்கு அருகிலோ அதன் ஓரமாகவோ உள்ள இடத்தைக் குறிக்கிறது. வயல்வெளிச் சூழலில் ‘பாதையோரத்தில்’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: τὰ πετεινὰ
  choice: பறவைகள்
  rationale: இவ்வசனத்தில் கூடுதல் ‘வானத்து’ போன்ற அடைமொழி இல்லாததால், எளிய ‘பறவைகள்’ கிரேக்கத்தை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: κατέφαγεν
  choice: தின்றுவிட்டன
  rationale: κατεσθίω சாதாரணமாக உண்பதைவிட முழுவதுமாகத் தின்றுவிடும் வலிமையை உடையது. ‘தின்றுவிட்டன’ என்பது விதைகள் எதுவும் மீதியில்லாமல் போன நிறைவுணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: αὐτό
  choice: அவற்றை
  rationale: கிரேக்க ஒருமைப் பதிலிடுபெயர் விதைப் பகுதியைத் தொகுப்பாகச் சுட்டுகிறது. தமிழாக்கத்தில் ‘சில விதைகள்’ என இயல்பாகப் பன்மைப்படுத்தப்பட்டதால், அதற்கேற்ற ‘அவற்றை’ பயன்படுத்தப்பட்டுள்ளது.
