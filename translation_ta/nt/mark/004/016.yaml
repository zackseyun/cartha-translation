source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: ta
  text: 'அதுபோலவே, பாறை நிலத்தில்[a] விதைக்கப்பட்டவர்கள் இவர்களே: இவர்கள் வார்த்தையைக் கேட்கும்போது, உடனே அதை மகிழ்ச்சியுடன் ஏற்றுக்கொள்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாறை மண்ணில்’ அல்லது ‘பாறைகள் நிறைந்த இடங்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: அதுபோலவே
  rationale: முந்தைய விதைப்பு நிலையைப் பற்றிய விளக்கத்தோடு இக்குழுவை ஒப்புமையாக இணைக்கும் உரையாடல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἐπὶ τὰ πετρώδη
  choice: பாறை நிலத்தில்
  rationale: பாறைத்தன்மையுள்ள இடத்தைக் குறிக்கும் வேளாண்மை உருவகத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘பாறை மண்’ என்பதும் சாத்தியம்.
- source_word: σπειρόμενοι
  choice: விதைக்கப்பட்டவர்கள்
  rationale: கிரேக்க நிகழ்காலப் பெயரெச்சம் இங்கு உவமை விளக்கத்தில் அந்த இடத்தில் விதைக்கப்பட்டவர்களை அடையாளப்படுத்துகிறது; உவமையின் சொற்படிமத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: τὸν λόγον
  choice: வார்த்தை
  rationale: மாற்கு 4-இல் மீண்டும் வரும் λόγος என்ற சொல்லின் தொடர்ச்சியையும் அறிவிக்கப்பட்ட இறைச்செய்தியைக் குறிக்கும் அதன் பரப்பையும் காக்கிறது.
- source_word: εὐθύς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்வதைத் தெளிவாகவும் இயல்பாகவும் காட்டி, மாற்குவின் வேகமான நடையையும் பிரதிபலிக்கிறது.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியுடன்
  rationale: ஏற்றுக்கொள்ளும் முறையை கிரேக்க முன்னிடைச்சொல் தொடருக்கு நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λαμβάνουσιν αὐτόν
  choice: அதை … ஏற்றுக்கொள்கிறார்கள்
  rationale: கேட்ட வார்த்தையை ஏற்றுக்கொள்வதைத் தெரிவிக்கிறது; நீடித்த விசுவாசம் இருப்பதாக வசனத்தைவிட அதிகமாகக் கூறுவதில்லை.
theological_decisions:
- issue: ‘விதைக்கப்பட்டவர்கள்’ என்பதன் குறிப்பு
  choice: ‘பாறை நிலத்தில் விதைக்கப்பட்டவர்கள்’ என்ற உவமை மொழியை அப்படியே தக்கவைத்தல்
  alternative: ‘பாறை நிலத்தைப் போன்ற இதயமுள்ளவர்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இயேசுவின் விளக்கம் மக்களைக் குறிக்கும்போதும் விதைத்தல் என்ற உவமைப் படிமத்தைத் தொடர்ந்து பயன்படுத்துகிறது; மாற்று வடிவம் கிரேக்கத்தில் இல்லாத ‘இதயம்’ என்ற விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தை’ என்பது சூழலில் அறிவிக்கப்படும் செய்தியைக் குறித்தாலும், மூலத்தின் மீளும் சொற்பயன்பாட்டைக் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
