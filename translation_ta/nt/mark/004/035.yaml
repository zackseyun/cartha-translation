  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: ta
  text: அந்த நாளில் மாலை வந்தபோது, அவர் அவர்களிடம், “நாம் அக்கரைக்குப் போவோம்” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மாற்குவின் கதையாடலில் இடம்பெறும் வரலாற்று நிகழ்காலத்தைத் தக்கவைக்க நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது; இது நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அன்றே
  rationale: ‘அந்த நாளில்’ என்ற காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; வலியுறுத்தும் ‘-ஏ’ அன்றைய நாளிலேயே நிகழ்ந்ததைத் தெளிவாக்குகிறது.
- source_word: ὀψίας γενομένης
  choice: மாலை வந்தபோது
  rationale: காலத்தைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான தமிழ் காலத் தொடராக வழங்குகிறது.
- source_word: Διέλθωμεν
  choice: நாம் ... போவோம்
  rationale: முதலாம் நபர் பன்மை exhortative subjunctive-இன் அழைப்பு/தூண்டல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ πέραν
  choice: அக்கரைக்கு
  rationale: ஏரி அல்லது கடலின் எதிர்க்கரையைக் குறிக்கும் சூழல்சார் பொருளை சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் வரலாற்று நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது.
