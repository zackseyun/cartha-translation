base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: ta
  text: சூரியன் உதித்தபோது, அது வெப்பத்தால் கருகியது; வேர் இல்லாததால் வாடிப்போனது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலர்ந்துபோனது.” கிரேக்க வினைச்சொல் உலர்ந்துபோதல் அல்லது வாடிப்போதல் ஆகிய இரண்டையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: சூரியன் உதித்தபோது
  rationale: ὅτε அறிமுகப்படுத்தும் காலத் தொடர்பையும், சூரியனைப் பொருளாகக் கொண்ட ἀνατέλλω என்பதன் இயல்பான பொருளையும் நவீனத் தமிழில் நேரடியாகத் தருகிறது. தொடக்க καὶ-ஐ தனியே மொழிபெயர்க்காமல் விட்டது தமிழின் இயல்பான தொடர் நடைக்காக; நிகழ்வுகளின் தொடர்பு மாறவில்லை.
- source_word: ἐκαυματίσθη
  choice: வெப்பத்தால் கருகியது
  rationale: சூரிய வெப்பத்தால் ஏற்பட்ட சேதத்தைச் சுட்டும் செயப்பாட்டு வடிவத்தின் பொருளைத் தெளிவாக்குகிறது; முற்றிலும் எரிந்துவிட்டதாக மிகைப்படுத்துவதில்லை.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: வேர் இல்லாததால்
  rationale: διά உடன் வரும் articular infinitive காட்டும் காரணத் தொடர்பை இயல்பான, சுருக்கமான தமிழில் காக்கிறது; ῥίζαν என்பதன் ஒருமையையும் தக்கவைக்கிறது.
- source_word: ἐξηράνθη
  choice: வாடிப்போனது
  rationale: ξηραίνω என்பதன் இச்சூழலுக்குரிய ‘உலர்ந்து வாடுதல்’ என்ற விளைவை இயல்பான வேளாண் உருவக மொழியில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
