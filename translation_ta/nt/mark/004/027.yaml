  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: ta
  text: அவன் இரவும் பகலும் தூங்கி எழுகிறான்; விதை முளைத்து உயரமாக வளர்கிறது[a], அது எப்படி நிகழ்கிறது என்று அவனுக்கே தெரியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயரமாக வளர்கிறது’ என்பதற்கு ‘வளர்கிறது’ அல்லது ‘நீண்டு வளர்கிறது’ என்றும் மொழிபெயர்க்கலாம். இரண்டாவது கிரேக்க வினை நீளுதல் அல்லது உயரத்தில் அதிகரித்தல் என்ற நுணுக்கத்தைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியான வடிவில், ‘எப்படி என்று அவனுக்கே தெரியாது.’ சூழலில், விதை எப்படி வளர்கிறது என்பது அவனுக்குத் தெரியாது என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ καὶ ἐγείρηται
  choice: தூங்கி… விழித்தெழுகிறான்
  rationale: இவை உவமையில் தொடர்ந்து, திரும்பத் திரும்ப நிகழும் செயலைக் குறிக்கும் நிகழ்கால வினைகள். ‘விழித்தெழுகிறான்’ என்பது இங்கு தூக்கத்திலிருந்து எழுவதைக் காட்டுகிறது; உயிர்த்தெழுதலைக் குறிக்கவில்லை.
- source_word: νύκτα καὶ ἡμέραν
  choice: இரவுதோறும்… பகல்தோறும்
  rationale: இரவும் பகலும் தொடரும் காலச்சுழற்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ σπόρος
  choice: விதை
  rationale: முந்தைய வசனத்தில் விதைக்கப்பட்ட விதையையே குறிப்பதால், எளியதும் சூழலுக்குப் பொருத்தமானதுமான சொல்.
- source_word: βλαστᾷ
  choice: முளைத்து
  rationale: தாவர வளர்ச்சியின் தொடக்கநிலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: μηκύνηται
  choice: வளர்ந்து உயர்கிறது
  rationale: பொதுவான வளர்ச்சியுடன் நீளுதல் அல்லது உயரமாதல் என்ற வினையின் குறிப்பான நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: அது எப்படி நிகழ்கிறது என்று அவனுக்கே தெரியாது
  rationale: ‘எப்படி’ என்ற உட்கருத்தை தமிழில் வெளிப்படையாக்கி, αὐτός தரும் அழுத்தத்தை ‘அவனுக்கே’ என்பதால் காக்கிறது.
theological_decisions:
- issue: விதை வளர்வதற்கான செயற்பாட்டாளர்
  choice: வளர்ச்சி எப்படிச் சம்பவிக்கிறது என்பது விதைப்பவனுக்குத் தெரியாது என்ற நிலையையே மொழிபெயர்ப்பு கூறுகிறது; அதன் காரணகர்த்தாவை வெளிப்படையாகப் பெயரிடவில்லை.
  alternative: ‘கடவுள் அதை வளரச் செய்கிறார்’ என்று சேர்த்தல், அல்லது இதை வெறும் இயற்கை நிகழ்வாக மட்டும் விளக்குதல்.
  rationale: கிரேக்க உரை விதையின் வளர்ச்சியையும் மனிதனின் அறியாமையையும் அருகருகே வைக்கிறது; தெய்வீகச் செயலை வெளிப்படையாகச் சேர்க்காமலும் அதை மறுக்காமலும் அந்தத் தத்துவ இறுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான உவமைநடை. ‘இரவுதோறும்… பகல்தோறும்’ என்பது தொடரும் அன்றாடச் சுழற்சியை இயல்பாக வெளிப்படுத்துகிறது. ‘வளர்ந்து உயர்கிறது’ என்பது μηκύνηται என்பதன் நீளுதல்/உயரமாதல் நுணுக்கத்தை வாசிப்பிற்கு ஏற்ற முறையில் காக்கிறது.
