source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் தொடர்ந்து கூறினார்: “நீங்கள் எதைக் கேட்கிறீர்கள் என்பதைக் கவனியுங்கள். எந்த அளவால் அளக்கிறீர்களோ, அதே அளவால் உங்களுக்கும் அளக்கப்படும்; உங்களுக்கும் மேலும் சேர்க்கப்படும்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலின் அடிப்படையில், இயேசுவின் போதனையை ஏற்றுக்கொள்கிறவர்களுக்கு மேலும் புரிதல் அளிக்கப்படும் என்று சிலர் இதைப் புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்க வாசகம் சேர்க்கப்படுவது என்ன என்பதை வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து கூறினார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை, அவர் கூறிவந்ததையோ தொடர்ந்து போதித்ததையோ சுட்டுகிறது; இயல்பான தமிழில் அதன் தொடர்ச்சித் தன்மையை இவ்வாறு காட்டுகிறது.
- source_word: Βλέπετε
  choice: கவனியுங்கள்
  rationale: சொற்பொருளில் ‘பாருங்கள்’ என்றாலும், இங்கு எச்சரிக்கையுடனும் கருத்துடனும் கவனிக்கும்படி அழைக்கும் இடியமாக உள்ளது.
- source_word: τί ἀκούετε
  choice: நீங்கள் எதைக் கேட்கிறீர்கள்
  rationale: τί என்பது ‘எதை’ என்பதைக் குறிக்கிறது. லூக்கா 8:18-இன் ‘எப்படிக் கேட்கிறீர்கள்’ என்ற வாசகத்துடன் ஒத்திசைக்காமல் மாற்குவின் தனித்த சொற்றொடர் காக்கப்படுகிறது.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: எந்த அளவையால் அளக்கிறீர்களோ
  rationale: அளவிடப் பயன்படுத்தப்படும் தரத்தையோ கருவியையோ குறிக்கும் உருவகத்தைத் தமிழில் இயல்பாகவும் நெருக்கமாகவும் காக்கிறது.
- source_word: μετρηθήσεται ὑμῖν
  choice: அதே அளவையால் உங்களுக்கும் அளக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் பரஸ்பரப் பதிலளிப்பைக் குறிக்கும் உருவகத்தையும் காக்கிறது. தமிழில் தொடர்பு தெளிவாக இருக்க ‘அதே அளவையால்’ சேர்க்கப்பட்டுள்ளது.
- source_word: προστεθήσεται ὑμῖν
  choice: உங்களுக்குக் கூடுதலாகவும் சேர்க்கப்படும்
  rationale: προστίθημι என்பதன் அடிப்படைப் பொருளான ‘சேர்த்தல்’ காக்கப்படுகிறது; எது சேர்க்கப்படும் என்பதை உரை வெளிப்படையாகச் சொல்லாததால் அதைக் குறிப்பிட்டு நிரப்பவில்லை.
theological_decisions:
- issue: அளவிடுதல் பற்றிய கூற்றின் பொருள்
  choice: இயேசுவின் போதனையைக் கேட்பதற்கான சூழலில் வரும் பரந்த பரஸ்பரப் பதிலளிப்பு உருவகமாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: இதைத் தீர்ப்பு, தாராளம், அல்லது ஆன்மிகப் புரிதல் ஆகியவற்றில் ஒன்றுக்கு மட்டும் உரிய கோட்பாடாகக் குறுக்கிப் பொருள் கொள்ளுதல்.
  rationale: உடனடி சூழல் கேட்பதையும் ஏற்றுக்கொள்வதையும் பற்றியது; ஆனாலும் கிரேக்க வாசகம் பயன்பாட்டை ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் வரையறுக்கவில்லை. எனவே அதன் இறையியல் திறந்தநிலையும் பதற்றமும் காக்கப்படுகின்றன.
- issue: ‘கூடுதலாகச் சேர்க்கப்படும்’ என்பதன் குறிப்பு
  choice: எது அல்லது எந்த வகையில் சேர்க்கப்படும் என்பதை முதன்மை உரையில் விளக்காமல் விடப்பட்டது.
  alternative: இதை அதிகரித்த ஆன்மிகப் புரிதல் என்று நேரடியாக மொழிபெயர்த்தல்.
  rationale: சூழல் அத்தகைய புரிதலை ஆதரிக்கக்கூடும்; ஆனால் மூலவாசகம் சேர்க்கப்படுவது என்ன என்பதை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘எதைக் கேட்கிறீர்கள்’ என்ற மாற்குவின் சொற்றொடர் அப்படியே காக்கப்பட்டு, வேறு நற்செய்தி வாசகத்துடன் ஒத்திசைக்கப்படவில்லை. அளவிடும் உருவகம் இயல்பான தமிழில் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
