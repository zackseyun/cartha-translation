  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் நன்றாகக் காக்கப்பட்டுள்ளன: ἔλεγεν என்பதன் தொடர்தன்மை, τί (‘எதை’) ἀκούετε என்பதன் மாற்குவுக்குரிய சொற்றொடர், அளவிடுதல் உருவகம், எதிர்காலச் செயப்பாட்டு, மற்றும் προστεθήσεται-யின் குறிப்பிடப்படாத பொருள் ஆகியவை உரியவாறு பிரதிபலிக்கின்றன. ஆனால் “உங்களுக்குக் கூடுதலாகவும் சேர்க்கப்படும்” என்பது தமிழில் ‘உங்களுக்கு மேலதிகமாக’ என்ற சற்றே குழப்பமான உணர்வைத் தரலாம். கிரேக்கத்தின் ‘மேலும் ... சேர்க்கப்படும்’ என்ற இணைப்பு இயல்பாகத் தெளிவுறச் செய்யப்பட்டுள்ளது.'
