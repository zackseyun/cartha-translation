  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: ta
  text: அவர்கள் கேட்க முடிந்த அளவுக்கு[b], இப்படிப்பட்ட பல உவமைகள் மூலம் அவர் அவர்களுக்குச் செய்தியைச் சொல்லிவந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “வார்த்தையை”; அல்லது “போதனையை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களால் எந்த அளவுக்குக் கேட்க முடிந்ததோ, அந்த அளவுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: இதுபோன்ற
  rationale: முன்பு கூறப்பட்ட உவமைகளின் வகையைச் சுட்டுகிறது; ஒப்புமைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: παραβολαῖς
  choice: உவமைகளால்
  rationale: இயேசுவின் ஒப்புமை சார்ந்த போதனைகளைக் குறிக்கத் தமிழில் நிலைபெற்றதும் சூழலுக்குத் துல்லியமானதுமான சொல்.
- source_word: πολλαῖς
  choice: பல
  rationale: அளவைக் குறிக்கும் பெயரடைக்கு இயல்பான நேரடி இணை.
- source_word: ἐλάλει
  choice: சொல்லிவந்தார்
  rationale: முற்றுப்பெறாத காலத்தின் தொடர்ச்சியான அல்லது வழக்கமான செயல் நிழலைக் காக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: λαλέω என்பதோடு வரும் மறைமுகச் செயப்படுபொருளை இயல்பாகக் காட்டுகிறது.
- source_word: τὸν λόγον
  choice: அந்தச் செய்தியை
  rationale: இங்கு λόγος என்பது இயேசு அறிவித்த அல்லது போதித்த உள்ளடக்கத்தைக் குறிக்கிறது. ‘அந்த’ என்பது கிரேக்கச் சுட்டு உறுப்பின் குறிப்பிட்ட தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘வார்த்தை’ என்ற நேரடி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: καθὼς
  choice: அளவுக்கு
  rationale: அவர்களுடைய கேட்கும் திறனுக்கும் அவர் சொன்னதற்கும் இடையிலான அளவு அல்லது பொருத்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἠδύναντο
  choice: முடிந்த
  rationale: தொடர்ந்து இருந்த திறனை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀκούειν
  choice: கேட்க
  rationale: அடிப்படைச் சொற்பொருளான ‘கேட்பது’ என்பதைக் காக்கிறது; ‘புரிந்துகொள்வது’ என்று விளக்கி இறையியல் நெருக்கடியைத் தீர்த்துவிடவில்லை.
theological_decisions:
- issue: τὸν λόγον என்பதன் பொருள்
  choice: அந்தச் செய்தியை
  alternative: வார்த்தையை; போதனையை
  rationale: இது இயேசுவின் அறிவிப்பு அல்லது போதனையின் உள்ளடக்கத்தைக் குறிக்கிறது. ‘செய்தி’ நவீனத் தமிழில் இயல்பாக இருக்கிறது; அதேவேளை கிரேக்கத்தின் நேரடி வடிவமும் மற்றொரு சாத்தியமும் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ἀκούειν என்பதில் புரிந்துகொள்ளுதல் உட்பொருளாக உள்ளதா
  choice: கேட்க
  alternative: புரிந்துகொள்ள; ஏற்றுக்கொள்ள
  rationale: சூழலில் புரிந்துகொள்ளுதல் உட்பொருளாக இருக்கக்கூடும்; ஆனாலும் மூலச்சொல் வெளிப்படையாகக் கூறுவது ‘கேட்பது’ என்பதால், மொழிபெயர்ப்பு அதை வலுப்படுத்தி விளக்கவில்லை.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்டதாக வைக்கப்பட்டுள்ளது. ‘சொல்லிவந்தார்’ தொடர்ச்சியான செயலைக் காட்டுகிறது. ‘கேட்க’ என்பது கேட்டறிதல் அல்லது புரிதல் குறித்துள்ள மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
