  source_fidelity: ‘நிலம் தானாகவே விளைச்சல் தருகிறது’ என்பது αὐτομάτη ἡ γῆ καρποφορεῖ என்பதன் மனிதச் செயல் வெளிப்படாமல் பயிர் வளரும் கருத்தைத் துல்லியமாகத் தருகிறது. வளர்ச்சியின் மூன்று நிலைகளான χόρτον, στάχυν, πλήρης σῖτον ἐν τῷ στάχυϊ ஆகியவை ‘பசுந்தளிர்,’ ‘கதிர்,’ ‘கதிரில் முழுமையாக உருவான தானியம்’ என வரிசையுடனும் பொருளுடனும் காக்கப்பட்டுள்ளன. ‘முழுமையாக உருவான’ என்பது ‘பழுத்த’ என மூலத்தில் வெளிப்படாத கருத்தைச் சேர்க்காமல் πλήρης-இன் நிறைவு கருத்தை நன்றாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. முக்கால் வளர்ச்சி வரிசையைச் சுட்டும் ‘முதலில் … பின்பு … அதன்பின்’ என்ற அமைப்பு வாசிப்பிற்கு எளிதானது. ‘கதிரில் முழுமையாக உருவான தானியம்’ சற்றே விளக்கமான சொற்றொடராக இருந்தாலும் இயல்பானதும் பொருள் தெளிவானதும் ஆகும்.
