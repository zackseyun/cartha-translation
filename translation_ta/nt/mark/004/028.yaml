  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் வேளாண்மைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் எளிய மூன்று கட்ட வளர்ச்சி வரிசையும் சுருக்கமான நடையும் காக்கப்பட்டுள்ளன.
