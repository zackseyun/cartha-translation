source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: ta
  text: 'நிலம் தானாகவே விளைச்சல் தருகிறது: முதலில் பசுந்தளிர்[a], பின்பு கதிர், அதன்பின் கதிரில் முழுமையாக உருவான தானியம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதலில் தண்டு.”
    reason: χόρτος என்பது இச்சூழலில் தானியச் செடியின் ஆரம்பப் பச்சை வளர்ச்சியைக் குறிக்கிறது; அதை ‘பசுந்தளிர்’ என்றும் ‘தண்டு’ என்றும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: αὐτομάτη
  choice: தானாகவே
  rationale: மனிதரின் வெளிப்படையான செயலின்றி நிலம் விளைச்சலை உண்டாக்குவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἡ γῆ
  choice: நிலம்
  rationale: வேளாண்மைச் சூழலில் பயிர் வளரும் மண்ணைக் குறிக்கும் இயல்பான பொதுத் தமிழ்ச் சொல்.
- source_word: καρποφορεῖ
  choice: விளைச்சல் தருகிறது
  rationale: இங்கு பொதுவான கனியைவிட தானியப் பயிரின் விளைச்சலே சூழலுக்குப் பொருத்தமானது; வேளாண்மை உருவகத்தையும் காக்கிறது.
- source_word: πρῶτον χόρτον
  choice: முதலில் பசுந்தளிர்
  rationale: தானியச் செடியின் முதலில் கண்ணுக்குத் தெரியும் பச்சை வளர்ச்சிநிலையைத் தெளிவாகக் குறிக்கிறது; ‘தண்டு’ என்பதும் சாத்தியம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἶτα στάχυν
  choice: பின்பு கதிர்
  rationale: στάχυς என்பதற்கு தானியத் தலையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘கதிர்’.
- source_word: εἶτα πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: அதன்பின் கதிரில் முழுமையாக உருவான தானியம்
  rationale: πλήρης என்பதன் ‘முழுமை/நிறைவு’ கருத்தைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘பழுத்த’ என்ற பொருளைச் சேர்க்காமல் வளர்ச்சியின் இறுதிநிலையை இயல்பாகத் தெரிவிக்கிறது.
