revisions:
- from: அவரோ படகின் பின்பகுதியில், தலைச்சாய்வின்மேல்[a] தூங்கிக்கொண்டிருந்தார். அவர்கள் அவரை எழுப்பி, “போதகரே, நாங்கள் அழிந்துபோகிறோமே, உமக்குக் கவலையில்லையா?” என்று கேட்டார்கள்.
  to: அவரோ படகின் பின்பகுதியில், தலை வைக்கும் மெத்தையின் மேல் தூங்கிக்கொண்டிருந்தார். அவர்கள் அவரை எழுப்பி, “போதகரே, நாங்கள் அழிந்துபோகிறோமே என்று உமக்குக் கவலையில்லையா?” என்று கேட்டார்கள்.
  rationale: The revision replaces an unclear noun with idiomatic modern Tamil for a head-cushion and explicitly connects the disciples’ imminent ruin with their accusation that Jesus does not care. It preserves the source’s emphasis, urgency, respectful register, and lexical ambiguity concerning προσκεφάλαιον.
  reviewer_model: gpt-5.6-terra
