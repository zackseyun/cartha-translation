source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: ta
  text: அவரோ படகின் பின்பகுதியில், தலை வைக்கும் மெத்தையின் மேல் தூங்கிக்கொண்டிருந்தார். அவர்கள் அவரை எழுப்பி, “போதகரே, நாங்கள் அழிந்துபோகிறோமே என்று உமக்குக் கவலையில்லையா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: அவரோ … இருந்தார்
  rationale: வெளிப்படையாக இடம்பெறும் αὐτός தரும் வேறுபடுத்திக் காட்டும் அழுத்தத்தைத் தமிழில் ‘அவரோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ πρύμνῃ
  choice: படகின் பின்பகுதியில்
  rationale: πρύμνα என்பது படகின் பின்புறப் பகுதியைக் குறிக்கிறது. தொழில்நுட்பச் சொல்லைவிட இது சாதாரண வாசகருக்குத் தெளிவானது.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: தலைச்சாய்வின்மேல்
  rationale: προσκεφάλαιον தலை வைப்பதற்கான மெத்தை அல்லது தலையணையைக் குறிக்கலாம். ‘தலைச்சாய்வு’ இரு சாத்தியங்களையும் அளவுக்கு மீறிக் குறிப்பாக்காமல் தக்கவைக்கிறது.
- source_word: καθεύδων
  choice: தூங்கிக்கொண்டிருந்தார்
  rationale: நடந்துகொண்டிருந்த உறக்க நிலையைக் காலத்திற்கேற்ற இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐγείρουσιν
  choice: எழுப்பி
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடையில் இயல்பான இறந்தகாலத் தொடராக வழங்குகிறது.
- source_word: λέγουσιν αὐτῷ
  choice: என்று கேட்டார்கள்
  rationale: சொற்கள் கேள்வி வடிவில் இருப்பதால், தமிழில் ‘கேட்டார்கள்’ என்பது உரையாடலின் செயலை இயல்பாகத் தெரிவிக்கிறது; அதன் குற்றஞ்சாட்டும் தொனி நேரடி உரையில் நிலைக்கிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: διδάσκαλος என்பதன் கற்பிப்பவர் என்ற பொருளை மரியாதை விளியுடன் வழங்குகிறது; ‘ஆண்டவரே’ போன்ற வேறு இறையியல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: οὐ μέλει σοι
  choice: உமக்குக் கவலையில்லையா?
  rationale: அக்கறை அல்லது கவலை இல்லையா என்று கடுமையாகக் கேட்கும் கிரேக்க மரபுத்தொடரின் உணர்வை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπολλύμεθα
  choice: நாங்கள் அழிந்துபோகிறோமே
  rationale: நெருங்கிய அழிவு அல்லது மரணத்தின் அவசரத்தைத் தக்கவைக்கிறது; ‘-மே’ அவர்களின் பதற்றத்தையும் குற்றஞ்சாட்டும் கேள்வியுடனான தொடர்பையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீடர்கள் இயேசுவிடம் கேட்ட கேள்வியின் கதைநடைத் தீவிரம்
  choice: “நாங்கள் அழிந்துபோகிறோமே, உமக்குக் கவலையில்லையா?” என்ற கூர்மையான, குற்றஞ்சாட்டும் கேள்வி
  alternative: “நாங்கள் சாகப்போகிறோம் என்பது உமக்குப் பொருட்டல்லவா?” என்ற மென்மையான அல்லது விளக்கமான வடிவம்
  rationale: கிரேக்கச் சொற்றொடர் வெறும் தகவல் கேள்வியாக இல்லாமல் அவசரமும் குற்றச்சாட்டும் கொண்டுள்ளது. இயேசுவின் நோக்கம் அல்லது சீடர்களின் விசுவாசம் குறித்து விளக்கம் சேர்க்காமல் அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குத் தெளிவாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவைச் சுட்டும் இடங்களில் மரியாதைப் பன்மையும் நேரடி அழைப்பில் ‘உமக்கு’ என்பதும் பயன்படுத்தப்பட்டுள்ளன; படகியல் தொழில்நுட்பச் சொல் தவிர்க்கப்பட்டு ‘படகின் பின்பகுதி’ எனத் தெளிவாக்கப்பட்டுள்ளது.
