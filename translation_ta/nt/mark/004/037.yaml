  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: ta
  text: ஒரு பெரும் காற்றுப்புயல் எழுந்தது[a]. அலைகள் படகுக்குள் பாய்ந்துகொண்டிருந்தன[b]. அதனால் படகு ஏற்கெனவே நிரம்பிக்கொண்டிருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியான முறையில், “பெரிய காற்றுப் புயல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அலைகள் படகுக்குள் மீண்டும் மீண்டும் மோதின.” கிரேக்க இறந்தகாலத் தொடர்நிலை வினை வடிவம், செயல் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்ததைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: c
