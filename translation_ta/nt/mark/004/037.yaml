- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: படகு ஏற்கெனவே நிரம்பிக்கொண்டிருந்தது
  rationale: நிகழ்ந்துகொண்டிருந்த நிரம்பும் செயல்முறையை இயல்பான தமிழில் தருகிறது; கிரேக்கச் செயப்பாட்டு/தற்சுட்டு வடிவத்தை மிகையாகத் தீர்மானிக்காமல் விடுகிறது.
