  to: 'அவர் சொல்லிக்கொண்டிருந்தார்: “கேட்பதற்குக் காதுள்ளவர் கேட்கட்டும்.”'
  rationale: The revision removes the extra nuance introduced by ‘தொடர்ந்து’ and renders the imperfect ἔλεγεν with a natural Tamil continuative form. The central saying is retained unchanged because it faithfully and idiomatically reflects the Greek.
