base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: ta
  text: 'அவர் சொல்லிக்கொண்டிருந்தார்: “கேட்பதற்குக் காதுள்ளவர் கேட்கட்டும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: தொடர்ந்து
  rationale: எளிய இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இங்கு புதிய காலவரிசை நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἔλεγεν
  choice: அவர் தொடர்ந்து சொன்னார்
  rationale: λέγω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது. சூழலில் சொல்லிக்கொண்டிருந்தார் என்றும் கொள்ளலாம்; ஆனால் தேவையற்ற நீடிப்பை வலியுறுத்தாமல் இந்தத் தெரிவு அமைகிறது.
- source_word: Ὃς ἔχει
  choice: உள்ளவர்
  rationale: ஆண்பாலைக் குறிப்பதாக இல்லாமல், கிரேக்கத்தின் பொதுப்பொருளுடைய ஒருமை உறவுநிலைக் கட்டமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ὦτα
  choice: காது
  rationale: தமிழில் ‘காதுள்ளவர்’ என்பது இயல்பான பொதுவழக்கு; கிரேக்கத்தில் பன்மையாக இருந்தாலும் தமிழில் இக்கூற்றில் ஒருமை வடிவமே இயல்பானது.
- source_word: ἀκούειν
  choice: கேட்பதற்கு
  rationale: ‘காது’ என்பதுடன் இயல்பாக இணைகிறது; அடுத்துள்ள ἀκουέτω உடனான சொல் மீளுருவாக்கத்தையும் ‘கேள்’ என்ற ஒரே வேரால் காக்கிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் நிகழ்காலக் கட்டளையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்தி, ἀκούειν உடனான வினைச்சொல் ஒலிப்பையும் காக்கிறது.
theological_decisions:
- issue: பழமொழித் தன்மையுள்ள கூற்றில் பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: ‘காதுள்ளவர் ... கேட்கட்டும்’ என்று பாலினம் குறிப்பிடாத ஒருமையாக மொழிபெயர்த்தல்
  alternative: ‘கேட்பதற்குக் காதுகள் உள்ள எவனோ அவன் கேட்கட்டும்’
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஆணை மட்டும் குறிப்பதல்ல; பொதுப்பொருளுடையது. தமிழ் மரியாதை/பொது ஒருமையான ‘வர்’ மூலத்தின் ஒருமை அமைப்பையும் அனைவரையும் உள்ளடக்கும் பொருளையும் இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதும் கண்ணியமானதும். மூலத்தின் சுருக்கமான பழமொழித் தன்மையும் ‘கேட்பதற்கு/கேட்கட்டும்’ என்ற சொல் மீளுருவாக்கமும் காக்கப்பட்டுள்ளன.
