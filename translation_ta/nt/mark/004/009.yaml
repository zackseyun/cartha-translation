review_pass:
  verdict: revise
  source_fidelity: 'The saying itself is accurately represented: ‘கேட்பதற்குக் காதுள்ளவர் கேட்கட்டும்’ retains the generic singular force, the ears/hearing idiom, and the lexical echo between ἀκούειν and ἀκουέτω. However, ‘தொடர்ந்து’ is not a dependable rendering of καὶ; it can imply either temporal succession (‘then/next’) or an emphatic continuative sense. The imperfect ἔλεγεν is better conveyed directly by ‘சொல்லிக்கொண்டிருந்தார்.’'
  naturalness: The revised wording is natural modern standard Tamil and retains the compact, proverbial cadence of the Greek. ‘காதுள்ளவர்’ is idiomatic in this fixed-style exhortation.
  terminology: No theological terminology occurs. The gender-inclusive generic singular ‘உள்ளவர்’ appropriately avoids making the saying male-specific while preserving its singular proverbial form.
  issues:
  - severity: low
    issue: ‘தொடர்ந்து’ is assigned to καὶ.
    rationale: καὶ is a simple connective. In Tamil, it may be left implicit in this narrative context, but ‘தொடர்ந்து’ adds a potentially stronger sequential or continuative nuance. The imperfect aspect belongs to ἔλεγεν and is more clearly represented by ‘சொல்லிக்கொண்டிருந்தார்.’
  revised_text: 'அவர் சொல்லிக்கொண்டிருந்தார்: “கேட்பதற்குக் காதுள்ளவர் கேட்கட்டும்.”'
