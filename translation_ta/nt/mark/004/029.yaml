source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: ta
  text: ஆனால் பயிர் அறுவடைக்குத் தயாரானவுடன்[a], அவர் உடனே அரிவாளைச் செலுத்துகிறார்; ஏனெனில் அறுவடை வந்துவிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “விளைச்சல் கொடுத்தவுடன்,” “முற்றியவுடன்” அல்லது இன்னும் சொல்லுக்குச் சொல்லாக, “தன்னையே ஒப்படைத்தவுடன்.” மூல கிரேக்கத்தில் ‘பயிர்’ எழுவாயாக வரும் வழக்கத்திற்கு மாறான செயல்வினை வடிவம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால் ... உடன்
  rationale: ὅταν குறிக்கும் காலத் தொடர்பையும், δέ குறிக்கும் மென்மையான மாறுதலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: παραδοῖ
  choice: அறுவடைக்குத் தயாரான
  rationale: παραδίδωμι என்பதன் வழக்கமான பொருள் ‘ஒப்படை’ என்பதாக இருந்தாலும், இங்கு பயிரே எழுவாயாக இருந்து அறுவடைக்கு ஏற்ற நிலையை அடைவதைக் குறிக்கிறது. முதன்மை உரை இயல்பாக இருக்க இந்தப் பொருள் தரப்பட்டது; கிரேக்கத்தின் வழக்கத்திற்கு மாறான செயப்பாட்டு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: ὁ καρπός
  choice: பயிர்
  rationale: அரிவாளும் அறுவடையும் இடம்பெறும் வயல் சூழலில் καρπός என்பதை ஒரு குறிப்பிட்ட தானியமாகச் சுருக்காமல் ‘பயிர்’ என்று மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நடைபெறுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: அரிவாளைச் செலுத்துகிறார்
  rationale: கிரேக்கத்தில் உள்ள ‘அரிவாளை அனுப்புகிறார்’ என்ற உருவகத்தை முற்றிலும் நீக்காமல், அறுவடையைத் தொடங்கும் செயலைத் தமிழில் புரியத்தக்க வகையில் கூறுகிறது.
- source_word: ὅτι παρέστηκεν ὁ θερισμός
  choice: ஏனெனில் அறுவடை வந்துவிட்டது
  rationale: ὅτι காரணத்தைத் தருகிறது; παρέστηκεν என்ற நிறைவுநிலை வடிவம் அறுவடை வந்து இப்போது முன்னிலையில் இருப்பதை ‘வந்துவிட்டது’ என்பதால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறையரசு உவமையில் பயிரின் ஆயத்தநிலையும் அறுவடையும்
  choice: பயிர் அறுவடைக்கு ஆயத்தமாவதையும் அறுவடை வந்திருப்பதையும் வேளாண் உருவகமாகவே வைத்தல்
  alternative: அறுவடையை இறுதித் தீர்ப்பு, நற்செய்திப் பணி அல்லது காலநிறைவு என்று நேரடியாக விளக்குதல்
  rationale: உவமையின் குறிப்பிட்ட இறையியல் பொருளை வசனத்துக்குள் சேர்க்காமல், மூலத்தின் உருவகத் திறப்பையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரிவாளைச் செலுத்துகிறார்’ என்பது மூலத்தின் உயிரூட்டப்பட்ட உருவகத்தையும் தமிழின் இயல்பையும் சமநிலைப்படுத்துகிறது.
