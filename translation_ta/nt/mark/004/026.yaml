  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: ta
  text: 'மேலும் அவர் சொல்லிக்கொண்டிருந்தார்[a]: “கடவுளுடைய ஆட்சி இவ்வாறு உள்ளது: ஒரு மனிதன்[b] நிலத்தில் விதையை வீசுவதைப் போல,[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர் சொன்னார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கக்கூடும்.
    reason: verbal_aspect
  - marker: b
    text: கிரேக்கத்தில் ‘ஒரு மனிதன்’ என்று இலக்கண ஆண்பால் ஒருமையில் உள்ளது; உவமையில் இவர் ஒரு பிரதிநிதி மனிதர்.
    reason: lexical_alternative
  - marker: c
    text: “கடவுளுடைய ஆட்சி, ஒரு மனிதன் நிலத்தில் விதை விதைப்பதைப் போல உள்ளது” என்றும் அமைக்கலாம். கிரேக்க ஒப்புமை சுருக்கமாக இருந்து அடுத்த வசனத்தில் தொடர்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: இறந்தகால முற்றுப்பெறாத வினையின் தொடர்ச்சி அல்லது மீள்நிகழ்வுத் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எளிய ‘சொன்னார்’ என்பதைக் காட்டிலும் மூலத்தின் வினைநோக்கை நெருக்கமாகக் காக்கிறது.
- source_word: Οὕτως
  choice: இப்படிப்பட்டது
  rationale: உவமையின் தன்மையை அறிமுகப்படுத்தும் ‘இவ்விதமாக உள்ளது’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய ஆட்சி
  rationale: βασιλεία என்பதில் உள்ள ஆளுகை/அரசு என்ற பொருள் விரிவை முற்றிலும் ஒரு நிலப்பரப்பு சார்ந்த ‘ராஜ்யம்’ எனக் குறுக்காமல், இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: ὡς
  choice: …போல்
  rationale: அடுத்த வசனத்திற்குத் தொடரும் சுருக்கமான ஒப்புமையைத் தமிழில் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: மூலத்தில் உள்ள இலக்கண ஆண்பால் ஒருமை பிரதிநிதி உருவைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: βάλῃ
  choice: வீசுவது
  rationale: βάλλω என்பதன் ‘வீசு’ என்ற காட்சிமயமான அடிப்படைப் பொருளை விவசாயச் சூழலிலும் புரியுமாறு காக்கிறது; ‘விதைப்பது’ எனப் பொருளை மட்டும் வெளிப்படுத்துவதைக் காட்டிலும் மூலச் சொல்லுக்கு நெருக்கமானது.
- source_word: τὸν σπόρον
  choice: விதையை
  rationale: கிரேக்க உரையின் ஒருமையையும் குறிப்புச் சுட்டையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: நிலத்தின்மேல்
  rationale: இங்கு γῆ உலகம் என்ற அண்டப் பொருளில் அல்லாமல் விதை வீசப்படும் நிலத்தைக் குறிக்கிறது; ἐπί என்பதையும் ‘மேல்’ எனத் தக்கவைக்கிறது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் அரசு/ஆட்சி பொருள் விரிவு
  choice: கடவுளுடைய ஆட்சி
  alternative: கடவுளுடைய அரசு / கடவுளுடைய ராஜ்யம்
  rationale: இங்கு கடவுளின் ஆளுகையை முன்னிறுத்தும் இயல்பான நவீன தமிழைத் தேர்ந்தெடுக்கிறது; இருப்பினும் மூலச் சொல் ஆளுகையையும் அரசையும் குறிக்கக்கூடியது என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: அடுத்த வசனத்திற்குத் தொடரும் சுருக்கமான ஒப்புமை
  choice: '‘இப்படிப்பட்டது: … வீசுவதுபோல்’ என்று முடிவுறாத ஓட்டத்தைத் தக்கவைத்தல்'
  alternative: ‘ஒரு மனிதன் நிலத்தில் விதை விதைப்பதுபோன்றது’ என்று முழுமையான வாக்கியமாகச் செம்மைப்படுத்துதல்
  rationale: கிரேக்கத்தில் Οὕτως…ὡς அமைப்பு சுருக்கமாக இருந்து ஒப்புமை 27ஆம் வசனத்தில் தொடர்கிறது. அதை இவ்வசனத்திலேயே விளக்கி முடிப்பது மூலத்தின் இலக்கிய மற்றும் பொருளியல் இழுப்பைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்/ராஜ்யம்’ போன்ற மரபுச் சமயச் சொற்களுக்கு மாற்றாக ‘கடவுள்/ஆட்சி’ தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் திறந்த ஒப்புமை திட்டமிட்டு முடிக்கப்படாமல் வைக்கப்பட்டுள்ளது.
