revisions:
- from: 'மேலும் அவர் சொல்லிக்கொண்டிருந்தார்[a]: “கடவுளுடைய ஆட்சி இப்படிப்பட்டது: ஒரு மனிதன்[b] நிலத்தின்மேல் விதையை வீசுவதுபோல்,[c]”'
  to: 'மேலும் அவர் சொல்லிக்கொண்டிருந்தார்[a]: “கடவுளுடைய ஆட்சி இவ்வாறு உள்ளது: ஒரு மனிதன்[b] நிலத்தில் விதையை வீசுவதைப் போல,[c]”'
  rationale: The revision makes the Οὕτως … ὡς comparison idiomatic in modern standard Tamil, uses the natural agricultural expression ‘நிலத்தில்,’ and retains the deliberately incomplete simile and comma because its development belongs to the following verse. No theological interpretation has been added.
