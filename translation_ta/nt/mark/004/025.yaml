source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: ta
  text: ஏனெனில், யாரிடம் இருக்கிறதோ, அவருக்குக் கொடுக்கப்படும்; யாரிடம் இல்லையோ, அவரிடம் இருப்பதும்கூட அவரிடமிருந்து எடுத்துக்கொள்ளப்படும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: யாரிடம்
  rationale: பொதுவாக எவரையும் குறிக்கும் தொடர்புப்பெயரின் பழமொழித் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; உடைமையைக் குறிக்கும் ἔχει என்பதோடு தமிழில் ‘யாரிடம்’ இயல்பாக அமைகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகப் பேணுகிறது.
- source_word: ἔχει
  choice: இருக்கிறதோ
  rationale: இங்கு உடைமையையோ ஒருவரிடம் ஏதோ இருப்பதையோ குறிக்கிறது. ‘யாரிடம் இருக்கிறதோ’ என்பது தமிழில் இயல்பான, சுருக்கமான அமைப்பு.
- source_word: δοθήσεται αὐτῷ
  choice: அவருக்குக் கொடுக்கப்படும்
  rationale: கிரேக்கத்தில் கொடுக்கப்படுவது எது என்று வெளிப்படையாகக் கூறப்படவில்லை. தமிழிலும் செயப்படுபொருளைச் சேர்க்காமல் இயல்பாகக் கூற முடிவதால், மூலத்தின் சுருக்கமும் தெளிவின்மையும் பேணப்படுகின்றன.
- source_word: οὐκ ἔχει
  choice: இல்லையோ
  rationale: முதல் பாதியுடன் நேரான எதிர்மறை இணைப்பை உருவாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: καὶ ὃ ἔχει
  choice: அவரிடம் இருப்பதும்கூட
  rationale: καὶ இங்கு வலியுறுத்தும் ‘கூட’ என்ற பொருளைத் தருகிறது; ὃ ἔχει என்பது குறிப்பிட்ட பொருளை வரையறுக்காமல் ‘அவரிடம் இருப்பது’ எனப் பொதுவாகவே வைக்கப்படுகிறது.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து எடுத்துக்கொள்ளப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், ஒருவரிடமிருந்து ஏதோ அகற்றப்படும் அல்லது பறிக்கப்படும் இழப்பின் கருத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δοθήσεται என்பதில் வெளிப்படையாக இல்லாத செயப்படுபொருள்
  choice: ‘அவருக்குக் கொடுக்கப்படும்’ என்று, செயப்படுபொருளைச் சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: ‘அவருக்கு இன்னும் அதிகமாகக் கொடுக்கப்படும்’ என்று ‘அதிகமாக’ என்பதைச் சேர்த்தல்
  rationale: எதிர்நிலை அமைப்பு அதிகரிப்பைக் குறிப்பதாகப் புரிந்துகொள்ள முடிந்தாலும், கிரேக்க மூலத்தில் ‘அதிகமாக’ என்பதற்குச் சமமான சொல் இல்லை. தமிழில் செயப்படுபொருள் இல்லாமலேயே வாக்கியம் இயல்பாக இருப்பதால், விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் உண்மையான திறந்த தன்மையைப் பேணுவது சிறந்தது.
- issue: இலக்கண ஆண்பால் ஒருமையின் பொதுப்பொருள்
  choice: ‘யார் ... அவர்’ என்ற பொதுவான ஒருமைப் பொருள் கொண்ட மரியாதை வடிவைப் பயன்படுத்துதல்
  alternative: ‘எவன் ... அவன்’ என்று இலக்கண ஆண்பாலை வெளிப்படையாகக் காட்டுதல்
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் குறிக்காமல் பிரதிநிதித்துவமான பொதுப்பொருளில் வருகிறது. நவீனத் தமிழில் ‘யார் ... அவர்’ என்பது அந்தப் பொதுப்பொருளையும் ஒருமைத் தன்மையையும் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; தேவையற்ற பாலினக் கட்டுப்பாட்டை உருவாக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பழமொழிபோன்ற சுருக்கமான எதிர்நிலை அமைப்பு பேணப்பட்டுள்ளது. ‘அவருக்குக் கொடுக்கப்படும்’ என்பதில் மூலத்தில் இல்லாத ‘மேலும்’ அல்லது ‘அதிகமாக’ சேர்க்கப்படவில்லை; தமிழில் இது இயல்பாக இருப்பதால் அடிக்குறிப்பும் தேவையில்லை.
