  source_fidelity: மூலக் கிரேக்கத்தின் பொதுப்பொருள் கொண்ட தொடர்புப்பெயர் அமைப்பு, நிகழ்கால ‘உள்ளது/இல்லை’ எதிர்நிலை, எதிர்காலச் செயப்பாட்டு வடிவங்கள், மற்றும் ἀπ’ αὐτοῦ-இன் ‘அவரிடமிருந்து’ என்ற அகற்றப் பொருள் ஆகியவை துல்லியமாகப் பேணப்பட்டுள்ளன. δοθήσεται-க்கு மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளையோ ‘மேலும்’ என்பதையோ சேர்க்காமல் விட்டிருப்பது மூலத்திற்கு மிக நெருக்கமானது.
  naturalness: ‘யாரிடம் இருக்கிறதோ ... யாரிடம் இல்லையோ’ மற்றும் ‘அவரிடம் இருப்பதும்கூட’ ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமான பழமொழி நடைக்கு ஏற்றதாகவும் உள்ளன. மரியாதை ஒருமை வடிவமான ‘அவர்’ பொதுப்பொருளைத் தெளிவாகக் காட்டுகிறது.
  terminology: ‘கொடுக்கப்படும்’ மற்றும் ‘எடுத்துக்கொள்ளப்படும்’ ஆகியவை முறையே δοθήσεται, ἀρθήσεται என்பவற்றின் செயப்பாட்டு எதிர்காலப் பொருளுக்கு ஏற்றவை. ‘கூட’ என்பது இரண்டாம் பாதியில் உள்ள வலியுறுத்தும் καὶ-யின் செயல்பாட்டை நன்றாக வெளிப்படுத்துகிறது.
