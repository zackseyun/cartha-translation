  text: καὶ ἐδίδασκεν αὐτοὺς ἐν παραβολαῖς πολλά καὶ ἔλεγεν αὐτοῖς ἐν τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: ta
  text: 'அவர் உவமைகள் மூலம் அவர்களுக்குப் பலவற்றைக்[a] கற்பித்துக்கொண்டிருந்தார். தமது போதனையில் அவர்களிடம் இவ்வாறு சொல்லிக்கொண்டிருந்தார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உவமைகள் மூலம் மிகுதியாகக் கற்பித்துக்கொண்டிருந்தார்.’ கிரேக்கச் சொல்லை ‘பலவற்றை’ என்றும், இன்னும் சுருக்கமாக ‘மிகுதியாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடைபெற்ற செயலைக் காட்டும் இறந்தகால வடிவத்தின் காட்சிசார் நீட்சியைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகள் மூலம்
  rationale: ἐν உடன் வரும் வேற்றுமை இங்கு கற்பிக்கும் முறை அல்லது ஊடகத்தைக் குறிக்கிறது; நவீனத் தமிழில் இது இயல்பான வெளிப்பாடு.
- source_word: πολλά
  choice: பலவற்றை
  rationale: நடுநிலைப் பன்மை வடிவம் அவர் கற்பித்த பல விஷயங்களைக் குறிக்கலாம்; சுருக்கமான தமிழில் ‘பலவற்றை’ அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: தொடர்ந்து நடைபெறும் உரையைக் காட்டும் இறந்தகால வினைவடிவத்தைப் பாதுகாத்து, அடுத்த வசனத்தில் தொடங்கும் நேரடிக் கூற்றுக்கு வழிவகுக்கிறது.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: தமது போதனையில்
  rationale: διδαχή என்பதன் ‘போதனை/அறிவுரை’ என்ற பொருளையும் கிரேக்கத் தொடரின் அமைப்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: அவர் … . தமது …
  rationale: கிரேக்கத்தில் இரு வினைக்கூற்றுகளையும் இணைக்கும் καί, தமிழின் இயல்பான வாசிப்பிற்காக இரண்டு தொடர்ச்சியான வாக்கியங்களாக வெளிப்படுத்தப்பட்டுள்ளது; நிகழ்வுகளின் தொடர்பு நீடிக்கிறது.
- source_word: αὐτοὺς / αὐτοῖς
  choice: அவர்களுக்கு / அவர்களிடம்
  rationale: முதல் வடிவம் கற்பித்தலின் பெறுநர்களையும், இரண்டாவது வடிவம் சொல்லப்பட்ட உரையின் பெறுநர்களையும் தமிழின் இயல்பான வேற்றுமை அமைப்பில் வேறுபடுத்துகிறது.
