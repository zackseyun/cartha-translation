  source_fidelity: மூலக் கிரேக்கத்தின் இரண்டு imperfect வினைகளான ἐδίδασκεν, ἔλεγεν ஆகியவற்றின் தொடர்ச்சியான/நடைபெற்றுக்கொண்டிருந்த காட்சிநிலையை ‘கற்பித்துக்கொண்டிருந்தார்’, ‘சொல்லிக்கொண்டிருந்தார்’ என்பவை நன்றாகக் காட்டுகின்றன. ἐν παραβολαῖς என்பதற்கான ‘உவமைகள் மூலம்’ கற்பித்தல் முறை/ஊடகத்தை இயல்பாகத் தருகிறது. πολλά என்பதன் ‘பலவற்றை’ என்ற பொருளும், αὐτούς/αὐτοῖς என்பவற்றின் பெறுநர் வேறுபாடும் தமிழில் பொருத்தமாக வெளிப்பட்டுள்ளன.
  naturalness: நவீனத் தரத் தமிழில் உரை தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இரண்டு கிரேக்கக் கூற்றுகளைத் தமிழில் இரண்டு வாக்கியங்களாக்குவது வாசிப்பிற்கு இயல்பானது. அடுத்த வசனத்தில் வரும் நேரடி உரைக்கான அறிமுகமாக ‘இவ்வாறு’ மற்றும் முற்றுக்குறி இயல்பாகச் செயல்படுகின்றன.
  terminology: ‘உவமைகள்’, ‘போதனை’ ஆகியவை நிலையான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ்ச் சொற்கள். தேவையற்ற இறையியல் விளக்கம் அல்லது பிரிவுசார் சொற்பயன்பாடு எதுவும் இல்லை. அடிக்குறிப்பு πολλά என்பதன் ‘பலவற்றை’/‘மிகுதியாக’ என்ற உரிய சொற்பொருள் மாற்றைச் சரியாகக் குறிக்கிறது.
