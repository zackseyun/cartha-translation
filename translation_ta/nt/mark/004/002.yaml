translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. தொடர்ச்சியான இறந்தகாலச் செயல்களை ‘கற்பித்துக்கொண்டிருந்தார்’, ‘சொல்லிக்கொண்டிருந்தார்’ என்பவை வெளிப்படுத்துகின்றன. அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்த ‘இவ்வாறு’ சேர்க்கப்பட்டுள்ளது.
