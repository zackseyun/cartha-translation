source:
  edition: SBLGNT
  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: ta
  text: அவர்கள் மக்கள் கூட்டத்தை விட்டுவிட்டு, அவர் இருந்தபடியே, படகில் அவரைத் தங்களுடன் கூட்டிக்கொண்டு சென்றார்கள்[a]. வேறு படகுகளும் அவருடன் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொற்றொடர், இயேசு ஏற்கெனவே படகில் இருந்தார் என்பதை வலியுறுத்தலாம்; அல்லது எந்தக் கூடுதல் ஆயத்தமும் செய்யாமல், அவர் இருந்த நிலையிலேயே அவரைக் கூட்டிக்கொண்டு சென்றார்கள் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன் நடந்த துணைச் செயலைக் குறிக்கிறது. இங்கு கூட்டத்தை முறையாகக் கலைத்துவிட்டார்கள் என்று மிகைப்படுத்தாமல், அதை விட்டுப் புறப்பட்டார்கள் என்ற இயல்பான பொருளை இது தருகிறது.
- source_word: τὸν ὄχλον
  choice: மக்கள் கூட்டத்தை
  rationale: ὄχλος என்பது இச்சூழலில் கூடியிருந்த மக்கள் திரளைக் குறிக்கிறது; நவீனத் தமிழில் ‘மக்கள் கூட்டம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: அவரைத் தங்களுடன் அழைத்துச் சென்றார்கள்
  rationale: παραλαμβάνω என்பதற்கு ஒருவரைத் தன்னுடன் கூட்டிக்கொண்டு செல்வது என்ற நுண்பொருள் உள்ளது. வரலாற்று நிகழ்காலத்தைத் தமிழ்க் கதைநடைக்கு இயல்பான இறந்தகாலத்தில் மொழிபெயர்த்துள்ளோம்.
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: அவர் படகில் இருந்தபடியே
  rationale: இயேசு ஏற்கெனவே படகில் இருந்தார் என்பதையும், இருந்த நிலையிலேயே அவரைக் கூட்டிச் சென்றார்கள் என்பதையும் சுருக்கமாகத் தெரிவிக்கிறது; கிரேக்கத் தொடரின் சிறிய பொருள் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἄλλα πλοῖα
  choice: வேறு படகுகளும்
  rationale: கிரேக்கத்தில் ‘சிறிய’ என்று எந்த அடைமொழியும் இல்லை; ஆகவே வெளிப்படையாக உள்ள ‘வேறு படகுகள்’ என்ற பொருள் மட்டும் தரப்பட்டுள்ளது.
- source_word: ἦν μετ’ αὐτοῦ
  choice: அவரோடு சென்றன
  rationale: μετά இங்கு உடன்செல்லுதலைக் குறிக்கிறது. தமிழில் ‘அவரோடு சென்றன’ என்பது மற்ற படகுகளும் பயணத்தில் உடனிருந்தன என்பதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὡς ἦν ἐν τῷ πλοίῳ என்ற தொடரின் இணைப்பு
  choice: அவர் ஏற்கெனவே படகில் இருந்த நிலையிலேயே அவரைக் கூட்டிச் சென்றார்கள் என்ற வாசிப்பு
  alternative: எந்தக் கூடுதல் ஆயத்தமும் செய்யாமல், இருந்த நிலையிலேயே அவரைக் கூட்டிச் சென்றார்கள் என்ற வாசிப்பு
  rationale: சொல் வரிசையும் உடனடி படகுச் சூழலும் முதன்மை வாசிப்பை ஆதரிக்கின்றன; எனினும் ‘ὡς ἦν’ அவருடைய அப்போதைய நிலையை வலியுறுத்தவும் முடியும் என்பதால் மாற்று நுண்பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. இதில் தனிப்பட்ட கோட்பாட்டு முடிவு எதுவும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க கதைநடையிலும் அமைக்கப்பட்டுள்ளது. ‘அவரைத் தங்களுடன் அழைத்துச் சென்றார்கள்’ என்பது παραλαμβάνω என்பதிலுள்ள உடன்கொண்டு செல்லும் நுண்பொருளைப் பாதுகாக்கிறது; ‘அவரோடு சென்றன’ என்பது இறுதி வாக்கியத்தைத் தமிழில் இயல்பாக்குகிறது.
