  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஏன் பயப்படுகிறீர்கள்?[a] உங்களுக்கு இன்னும் விசுவாசம் இல்லையா?[b][c]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் மொழிபெயர்ப்பு: “ஏன் கோழைகளாக இருக்கிறீர்கள்?”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களிடம் இன்னும் விசுவாசம் இல்லையா?”
    reason: lexical_alternative
  - marker: c
    text: இங்கு “விசுவாசம்” என்பதை “நம்பிக்கை” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: அவர் ... என்று சொன்னார்
  rationale: முந்தைய நிகழ்வுடன் இணைக்கும் எளிய தொடர்ச்சிச் சொல். இயல்பான தமிழ் வாக்கிய அமைப்பில் தனியாக ‘மற்றும்’ என்று தொடங்காமல் தொடர்ச்சி வெளிப்படுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்று சொன்னார்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: Τί
  choice: ஏன்
  rationale: பெயரடையுடனும் ‘இருத்தல்’ வினையுடனும் வரும் இக்கிரேக்க வினாச்சொல் இங்கு காரணம் கேட்கும் கண்டிப்பாகச் செயல்படுகிறது.
- source_word: δειλοί ἐστε
  choice: இப்படிப் பயப்படுகிறீர்கள்
  rationale: புயலின் நடுவே சீடர்களின் அச்சத்தைச் சுட்டும் இயல்பான தமிழ் மொழிபெயர்ப்பு; மூலச்சொல்லின் வலுவான ‘கோழைத்தனமான’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὔπω
  choice: இன்னும் ... இல்லையா
  rationale: ‘இதுவரையிலும் இல்லையா?’ என்ற கால மற்றும் கண்டிப்புத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχετε πίστιν
  choice: உங்களுக்கு விசுவாசம் இல்லையா
  rationale: உடைமைப் பொருளைத் தமிழில் இயல்பான ‘உங்களுக்கு ... இல்லை’ அமைப்பில் தருகிறது; πίστις என்பதற்கு முதன்மைத் தேர்வாக ‘விசுவாசம்’ வைக்கப்படுகிறது.
theological_decisions:
- issue: πίστις என்பது இச்சூழலில் ‘விசுவாசம்’ அல்லது ‘நம்பிக்கை’ என்று புரிந்துகொள்ளப்படலாம்
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: மூலத்தில் நம்பிக்கையின் இலக்கு வெளிப்படையாகக் கூறப்படவில்லை. ஆகவே முதன்மை உரையில் பரந்த சமயப் பொருளைக் கொண்ட ‘விசுவாசம்’ வைக்கப்பட்டு, சூழலுக்கேற்ற ‘நம்பிக்கை’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடிப் பேச்சு நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவின் கண்டிப்புத் தொனி காக்கப்பட்டுள்ளது; ‘கோழைத்தனம்’ என்ற வலுவான சொற்பொருள் முதன்மை உரையில் மிகைப்படுத்தப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
