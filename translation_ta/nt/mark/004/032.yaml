source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: ta
  text: அது விதைக்கப்படும்போது, முளைத்து வளர்ந்து, தோட்டச் செடிகள் எல்லாவற்றையும்விடப் பெரிதாகிறது. வானத்துப் பறவைகள்[a] அதன் நிழலின்கீழ் கூடுகட்ட[b] முடியும் அளவுக்குப் பெரிய கிளைகளை விடுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானின் பறவைகள்’; மரபுவழியாக, ‘ஆகாயத்துப் பறவைகள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘கூடுகட்ட’ என்பதற்குப் பதிலாக ‘தங்கியிருக்க’ அல்லது ‘குடியிருக்க’ என்றும் மொழிபெயர்க்கலாம். பெரிய மரத்தில் பறவைகள் அடைக்கலம் பெறும் பழைய ஏற்பாட்டுப் படிமத்தை இந்தச் சொற்கள் எதிரொலிக்கக்கூடும் (எடுத்துக்காட்டாக, எசேக்கியேல் 17:23; தானியேல் 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: விதைக்கப்பட்டதும்
  rationale: ὅταν உடன் வரும் இறந்தகாலச் செயப்பாட்டு வினைமுற்றின் பொதுவான காலநிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது; விதை பற்றிய உவமையின் சொல்லிணைப்பையும் காக்கிறது.
- source_word: ἀναβαίνει
  choice: முளைத்து வளர்ந்து
  rationale: வேளாண்மைச் சூழலில் மண்ணிலிருந்து மேலெழுந்து வளர்வதைக் குறிக்கிறது. வெறும் ‘மேலே எழுகிறது’ என்பதைவிடத் தமிழில் தெளிவானதும் இயல்பானதும்.
- source_word: γίνεται
  choice: பெரிதாகிறது
  rationale: செடி வளர்ந்து ஒரு புதிய நிலையை அடைவதைக் குறிக்கும் γίνομαι என்பதன் விளைவுநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: தோட்டச் செடிகள் எல்லாவற்றையும்விடப் பெரிதாகிறது
  rationale: λάχανα என்பதை நவீன தமிழில் குறுகிய பொருளுடைய ‘காய்கறிகள்’ என்று அல்லாமல், தோட்டத்தில் வளரும் செடிகள் என்ற விரிவான பொருளில் தருகிறது; ஒப்பீட்டு வடிவத்தையும் காக்கிறது.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: பெரிய கிளைகளை விடுகிறது
  rationale: செடி கிளைகளை உருவாக்குவதைத் தமிழில் இயல்பாகக் கூறும் வழக்கு; ‘பெரிய கிளைகளைச் செய்கிறது’ என்ற சொற்சொல்லான மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: ὥστε δύνασθαι
  choice: கூடுகட்டி வாழக்கூடிய அளவுக்கு
  rationale: ὥστε உடன் வரும் வல்லமைப் பொருளையும் அதன் விளைவையும் இயல்பான தமிழ் அமைப்பில் ஒருங்கிணைக்கிறது.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: அதன் நிழலின்கீழ்
  rationale: பறவைகளுக்குக் கிடைக்கும் மறைவையும் தங்குமிடத்தையும் குறிக்கும் சூழலில் σκιά என்பதற்கு ‘நிழல்’ இயல்பான தேர்வு.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: οὐρανός என்பதன் நேரடியான ‘வானம்’ பொருளைக் காக்கும் இயல்பான வேதாகமத் தமிழ் சொற்றொடர்.
- source_word: κατασκηνοῦν
  choice: கூடுகட்டி வாழ
  rationale: இந்த வினை தங்குதல், குடியிருத்தல் எனப் பொருள்படலாம்; பறவைகள் என்ற சூழலில் ‘கூடுகட்டி வாழ’ என்பது படிமத்தை இயல்பாக வெளிப்படுத்துகிறது, ஆனால் அதன் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பெரிய மரம் அல்லது செடியின் நிழலில் பறவைகள் தங்கும் பழைய ஏற்பாட்டுப் படிமம்
  choice: மூல உரையின் படிமத்தை விளக்கமின்றி முதன்மை உரையில் வைத்தல்
  alternative: ‘தங்கியிருக்க’ அல்லது ‘குடியிருக்க’ என்று மேலும் சொல்லுக்குச் சொல் நெருக்கமாக மொழிபெயர்த்து எசேக்கியேல் 17:23; தானியேல் 4:12 போன்ற பகுதிகளின் எதிரொலியைத் தெளிவுபடுத்துதல்
  rationale: இந்த வசனம் பழைய ஏற்பாட்டின் அரசாட்சி அல்லது பேரரசு-மரப் படிமத்தை எதிரொலிக்கக்கூடும்; ஆனால் கிரேக்க உரை அதன் பொருளை வெளிப்படையாக விளக்கவில்லை. ஆகவே இறையியல் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், படிமத்தையும் அதன் சாத்தியமான எதிரொலியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தோட்டச் செடிகள்’, ‘கிளைகளை விடுகிறது’, ‘கூடுகட்டி வாழ’ போன்ற இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடுகள் பொருந்தாத இடங்களில் இருந்ததால், அவை விளக்கும் சொற்களுக்குப் பின்னர் [a], [b] எனத் தமிழில் சரியாக வைக்கப்பட்டுள்ளன.
