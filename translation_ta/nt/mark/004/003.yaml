review_pass:
  verdict: revise
  source_fidelity: 'The draft represents all five Greek elements: plural attention-command (Ἀκούετε), the attention particle (ἰδού), outward departure (ἐξῆλθεν), the substantival participle (ὁ σπείρων), and the purpose infinitive (σπεῖραι). A small wording adjustment better conveys the participle as the established role within the parable and expresses the purpose construction idiomatically in modern Tamil.'
  naturalness: “விதைக்கிறவன் விதைக்க வெளியே சென்றான்” is understandable, but its repeated verbal forms and the placement of “வெளியே” are somewhat stiff. “விதைப்பவன் விதைக்கப் புறப்பட்டான்” is natural modern Tamil narrative prose while retaining the departure and purpose.
  terminology: “விதைப்பவன்” is the idiomatic agricultural role term for “the sower.” “இதோ” appropriately retains the marked attention-drawing force of ἰδού; the alternative “பாருங்கள்” is suitably supplied in the footnote.
  issues:
  - severity: low
    issue: The substantival participle is rendered with the less idiomatic form “விதைக்கிறவன்.”
    rationale: Although accurate at a basic level, “விதைப்பவன்” more naturally denotes “the sower” as a role designation in this parable.
  - severity: low
    issue: The purpose sequence “விதைக்க வெளியே சென்றான்” is stylistically awkward.
    rationale: The purposive linker in “விதைக்கப் புறப்பட்டான்” is idiomatic Tamil and retains the Greek infinitive of purpose.
  revised_text: கேளுங்கள்! இதோ[a], விதைப்பவன் விதைக்கப் புறப்பட்டான்.
