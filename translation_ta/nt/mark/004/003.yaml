lexical_decisions:
- source_word: Ἀκούετε
  choice: கேளுங்கள்!
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல், இரண்டாம் நபர் பன்மை. அனைவரின் கவனத்தையும் கோரும் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰδού
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதன்மீது கவனத்தைத் திருப்பும் உரையாடல் துகள். ‘இதோ’ அதன் திடமான கவன ஈர்ப்பைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்றான்
  rationale: வெளிநோக்கிய நகர்வைக் குறிக்கும் இறந்தகால வினை. ‘வெளியே சென்றான்’ என்பது கிரேக்கச் சொல்லின் இடநகர்வு கூறை வெளிப்படையாகக் காக்கிறது.
- source_word: ὁ σπείρων
  choice: விதைக்கிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் உருபுடனான நிகழ்காலப் பெயரெச்சம். செயலைச் செய்கிற நபரை நேரடியாகக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: σπεῖραι
  choice: விதைக்க
  rationale: வெளியே சென்றதன் நோக்கத்தைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு வினையெச்சம். தமிழில் நோக்கத்தை இயல்பாகத் தெரிவிக்கும் வடிவம்.
