  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: ta
  text: அவர் தனியாக இருந்தபோது, அவரைச் சுற்றியிருந்தவர்கள்[a] பன்னிருவரோடு சேர்ந்து அந்த உவமைகளைப் பற்றி அவரிடம் கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடன் இருந்தவர்கள்.” இச்சொற்றொடர் பன்னிருவரை மட்டும் அல்லாமல், இயேசுவைப் பின்பற்றிய விரிவான குழுவினரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: அவர் … இருந்தபோது
  rationale: காலத்தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வசனத் தொடக்கத்தில் உள்ள καί, தமிழில் அவசியமற்ற இணைப்புச் சொல்லாக இருப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை; மாற்கு நூலின் நிகழ்வோட்டம் தொடரமைப்பால் நீடிக்கிறது.
- source_word: ἐγένετο κατὰ μόνας
  choice: அவர் தனிமையாக இருந்தபோது
  rationale: κατὰ μόνας என்பது கூட்டத்திலிருந்து விலகித் தனிப்பட்ட சூழலில் இருப்பதைக் குறிக்கிறது; முற்றிலும் யாருமின்றி இருந்தார் என்று கட்டாயப்படுத்தாது.
- source_word: ἠρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வினையின் நீடித்த அல்லது தொடர்ந்த செயற்பாங்கை இயல்பான தமிழில் காக்கிறது.
- source_word: οἱ περὶ αὐτὸν
  choice: அவரைச் சூழ்ந்திருந்தவர்கள்
  rationale: இயேசுவைச் சுற்றியிருந்த விரிவான சீடர் வட்டத்தைக் குறிக்கும் சொல்லமைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது; அதை பன்னிருவரோடு மட்டும் ஒன்றாக்கவில்லை.
- source_word: σὺν τοῖς δώδεκα
  choice: பன்னிருவரோடு சேர்ந்து
  rationale: σύν குறிக்கும் உடனிருப்பையும், சுற்றியிருந்தவர்களுக்கும் பன்னிருவருக்கும் உரையில் காணப்படும் வேறுபாட்டையும் தெளிவாக வைத்திருக்கிறது.
- source_word: τὰς παραβολάς
  choice: அந்த உவமைகளை
  rationale: கிரேக்க மூலத்தின் பன்மையைப் பாதுகாத்து, முன்பு கூறப்பட்ட உவமைப் போதனைகளைக் குறிக்க சுட்டுப்பெயரடை பயன்படுத்துகிறது.
theological_decisions:
- issue: கேள்வி கேட்டவர்களின் அடையாளம்
  choice: இயேசுவைச் சூழ்ந்திருந்த விரிவான சீடர் குழுவினர் பன்னிருவரோடு சேர்ந்து கேட்டார்கள்.
  alternative: பன்னிருவர் மட்டுமே கேட்டார்கள்; அல்லது பன்னிருவரிலிருந்து முற்றிலும் வேறான உள்வட்டத்தினர் கேட்டார்கள்.
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα என்ற தொடரின் இயல்பான பொருள், இயேசுவைச் சுற்றியிருந்தவர்கள் பன்னிருவரோடு சேர்ந்து கேட்டார்கள் என்பதாகும். மொழிபெயர்ப்பு இந்த வேறுபாட்டை அழிக்காமல் காக்கிறது.
- issue: “தனிமையாக” என்பதன் பொருள்
  choice: பொதுமக்கள் கூட்டத்திலிருந்து விலகிய தனிப்பட்ட சூழல்
  alternative: இயேசு முற்றிலும் யாருமின்றி தனியாக இருந்தார்
  rationale: அடுத்த தொடரிலேயே அவரைச் சூழ்ந்திருந்தவர்களும் பன்னிருவரும் அவரிடம் கேட்பதால், κατὰ μόνας என்பதை முற்றிலும் யாருமற்ற நிலையாகப் புரிந்துகொள்ள வேண்டியதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “பன்னிருவர்” என்பது சூழலில் தெளிவான, வழக்கமான சுருக்கப்பெயர்; “உவமைகள்” என்பது παραβολαί என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல்.
