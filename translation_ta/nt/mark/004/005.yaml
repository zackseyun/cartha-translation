translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. விதைப்பு காட்சியில் இயல்பாக இருப்பதற்காகத் தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது; காரணத்தைச் சொல்லும் மூலத்தின் இரு தொடர்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
