id: MRK.4.5
reference: Mark 4:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: ta
  text: வேறு விதைகள் பாறை நிலத்தில்[a] விழுந்தன; அங்கே அதிக மண் இல்லை. மண்ணுக்கு ஆழம் இல்லாததால் அவை உடனே முளைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கற்கள் நிறைந்த நிலத்தில்.’ கிரேக்கச் சொல், மேலே மெல்லிய மண்படலம் மட்டுமே உள்ள பாறைத்தரையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: வேறு சில விதைகள்
  rationale: ஒருமை நடுநிலைச் சொல் முந்தைய சூழலில் உள்ள விதையை மறைமுகமாகக் குறிக்கிறது. தமிழில் இயல்பான விதைப்பு காட்சிக்காக ‘விதைகள்’ வெளிப்படையாகச் சேர்க்கப்பட்டு, கூட்டுப் பொருளில் கூறப்பட்டுள்ளது.
- source_word: πετρῶδες
  choice: பாறை நிலம்
  rationale: சிதறிய கற்கள் மட்டுமல்லாமல், மேலே மெல்லிய மண்படலம் கொண்ட பாறைத்தரையைக் குறிக்கிறது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: γῆν πολλήν
  choice: அதிக மண்
  rationale: இங்கு γῆ பொதுவான நிலப்பரப்பை அல்ல, செடி வளர்வதற்குரிய மண்ணைக் குறிக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: முளை விரைவாகத் தோன்றியதை இயல்பான நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐξανέτειλεν
  choice: முளைத்தன
  rationale: வேளாண் சூழலில் விதை நிலத்திலிருந்து முளைத்து மேலெழுவதைக் குறிக்கும் துல்லியமான, இயல்பான தமிழ் வினை.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: மண் ஆழமாக இல்லாத காரணத்தினால்
  rationale: διά + பெயரெச்ச வினை அமைப்பு காரணத்தைக் குறிக்கிறது; மூலத்தின் ‘மண்ணின் ஆழம் இல்லாமை’ என்ற படிமத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὅπου
  choice: அங்கே
  rationale: முந்தைய ‘பாறை நிலம்’ என்பதைக் குறிப்பிட்டு இடத்தொடர்பைத் தமிழில் இயல்பாக இணைக்கிறது.
