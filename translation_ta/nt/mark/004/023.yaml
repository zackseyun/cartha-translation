  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: ta
  text: யாருக்குக் கேட்பதற்குக் காதுகள் இருக்கிறதோ, அவர் கேட்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: உள்ளவன்
  rationale: கிரேக்கத்தின் நிபந்தனை வடிவம் தமிழில் சொற்சொல்லாக ‘யாருக்காவது ... இருந்தால்’ என வரலாம்; ஆனால் இத்தகைய பொதுவான அழைப்பில் ‘... உள்ளவன்’ என்பது இயல்பாகவும் சுருக்கமாகவும் அதே திறந்த பொருளைத் தருகிறது.
- source_word: ἔχει
  choice: உள்ளவன்
  rationale: உடைமையைக் குறிக்கும் ἔχει, தமிழின் இயல்பான உறவுநிலை அமைப்பில் ‘காதுகள் உள்ளவன்’ என்பதில் வெளிப்படுகிறது.
- source_word: ὦτα
  choice: காதுகள்
  rationale: மூலத்தில் உள்ள பன்மை நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἀκούειν
  choice: கேட்பதற்கு
  rationale: நோக்கம் அல்லது திறனைக் காட்டும் infinitive; ‘கேட்பதற்குக் காதுகள்’ என்ற மூல உருவகத்தையும் அடுத்த வினையுடனான மீளுரையையும் காக்கிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது; வெறும் ஒலியைக் கேட்பதைத் தாண்டிய கவனமுள்ள ஏற்றுக்கொள்ளுதலையும் சூழல் சுமக்க அனுமதிக்கிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஒருமை அழைப்பு
  choice: உள்ளவன் கேட்கட்டும்
  alternative: யாருக்காவது கேட்பதற்குக் காதுகள் இருந்தால், அவர் கேட்கட்டும்
  rationale: τις மற்றும் ἀκουέτω ஆகியவற்றின் ஒருமை அமைப்பைத் தக்கவைத்தபடி, தமிழில் பாலினத்தைத் தேவையின்றி வெளிப்படுத்தாத இயல்பான பொதுப்பொருள் வடிவம் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான பழமொழித்தன்மை கொண்ட நடை. மூலத்தின் ‘கேட்க—கேட்கட்டும்’ என்ற வினை மீளுரை பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற பாலினச் சுட்டு தவிர்க்கப்பட்டுள்ளது.
