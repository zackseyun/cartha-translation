revisions:
- from: கேட்பதற்குக் காதுகள் உள்ளவன் கேட்கட்டும்.
  to: யாருக்குக் கேட்பதற்குக் காதுகள் இருக்கிறதோ, அவர் கேட்கட்டும்.
  rationale: The revision explicitly but idiomatically represents the Greek conditional indefinite (“if anyone”) and preserves singular reference through “அவர்,” which is respectful and gender-inclusive in modern Tamil. It retains the plural “காதுகள்,” the purpose/capacity expression “கேட்பதற்குக்,” and the deliberate repetition of the hearing verb.
  reviewer_model: gpt-5.6-terra
