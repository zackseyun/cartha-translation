review_pass:
  verdict: revise
  source_fidelity: The draft preserves the plural “ears,” the purpose/capacity nuance of ἀκούειν, and the repeated hearing verb. However, “உள்ளவன்” turns the open-generic τις into a masculine-marked noun and compresses the conditional εἴ τις more than is desirable.
  naturalness: The proposed revision is idiomatic modern standard Tamil, retains the concise proverbial cadence, and avoids unnecessary masculine marking.
  terminology: “கேட்பதற்குக் காதுகள்” appropriately preserves the established biblical idiom and the verbal repetition with “கேட்கட்டும்.”
  issues:
  - severity: medium
    issue: “உள்ளவன்” is masculine-marked in Tamil.
    rationale: Although it can sometimes function generically, it is not gender-neutral as the draft rationale claims. The Greek τις is an open, indefinite singular; Tamil can convey this naturally without masculine marking.
  - severity: low
    issue: The conditional/open-indefinite structure is only implicit in the draft.
    rationale: “யாருக்குக் ... இருக்கிறதோ” more clearly represents εἴ τις while remaining natural Tamil.
  revised_text: யாருக்குக் கேட்பதற்குக் காதுகள் இருக்கிறதோ, அவர் கேட்கட்டும்.
