  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: ta
  text: 'அவர் தமது சீடர்களில் இருவரை அனுப்புகிறார்; அவர்களிடம் கூறுகிறார்: “நகருக்குள் செல்லுங்கள். தண்ணீர்க் குடத்தைச் சுமந்துகொண்டிருக்கும் ஒரு மனிதன் உங்களைச் சந்திப்பான். அவனைப் பின்தொடருங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: அனுப்பி
  rationale: மாற்கு பயன்படுத்தும் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைத் தொடர்ந்து வரும் ‘கூறுகிறார்’ என்பதுடன் இயல்பாக இணைக்கும் வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: தமது சீடர்களில் இருவரை
  rationale: பகுதிப்பொருள் அமைப்பைத் தெளிவாகக் காக்கிறது; μαθηταί என்பதற்கு நிலையான ‘சீடர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மூலத்தின் நிகழ்காலத்தையும் மாற்குவின் உயிரோட்டமான கதைநடையையும் காக்கிறது.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: நகருக்குள் செல்லுங்கள்
  rationale: கட்டளையின் வலிமையையும் εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπαντήσει ὑμῖν
  choice: உங்களைச் சந்திப்பான்
  rationale: எதிர்கால வினையையும் சந்திப்பு என்ற அடிப்படைப் பொருளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: இங்கு குறிப்பிட்ட ஆண் ஒருவரைக் குறிக்கும் மூலத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: κεράμιον ὕδατος
  choice: தண்ணீர்க் குடத்தை
  rationale: பாத்திரத்தையும் அதிலுள்ள பொருளையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; அது மண்ணால் செய்யப்பட்ட பாத்திரம் என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: βαστάζων
  choice: சுமந்துகொண்டிருக்கும்
  rationale: அந்த மனிதன் அப்போது செய்துகொண்டிருக்கும் செயலை நிகழ்நிலைப் பொருளுடன் காட்டுகிறது.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: அவனைப் பின்தொடருங்கள்
  rationale: நேரடியான கட்டளையைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
