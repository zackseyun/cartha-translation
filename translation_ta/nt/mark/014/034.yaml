source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் கூறுகிறார்: “என் உள்ளம்[a] மரணத்தை எட்டும் அளவுக்கு[b] மிகுந்த துயரத்தில் இருக்கிறது. நீங்கள் இங்கேயே இருந்து விழிப்புடன் இருங்கள்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “என் ஆன்மா” அல்லது “என் முழு ஆளுமையும்.”'
    reason: ψυχή என்பது இங்கு ஒருவரின் அக வாழ்வையோ முழு ஆளுமையையோ குறிக்கலாம்.
  - marker: b
    text: அல்லது “மரணம் வருமளவுக்கு.”
    reason: ἕως θανάτου என்ற சொற்றொடர் துயரத்தின் தீவிர உச்சத்தைச் சுட்டுகிறது.
  - marker: c
    text: அல்லது “விழித்திருங்கள்”; இக்கட்டளை உறங்காமல் இருப்பதையும் எச்சரிக்கையுடன் கவனித்திருப்பதையும் உள்ளடக்கலாம்.
    reason: γρηγορεῖτε என்பதில் உடல்சார்ந்த விழிப்பும் எச்சரிக்கையான கவனமும் இரண்டும் இருக்கக்கூடும்.
lexical_decisions:
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைப் பாதுகாக்க நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: Περίλυπός
  choice: மிகுந்த துயரத்தில்
  rationale: சூழ்ந்துகொள்ளும் அளவிலான ஆழ்ந்த துயரத்தைக் குறிக்கும் கிரேக்கச் சொல்லின் தீவிரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψυχή
  choice: உள்ளம்
  rationale: இங்கு இயேசுவின் அக வாழ்வையும் முழு ஆளுமையின் வேதனையையும் குறிக்கிறது; ‘ஆன்மா’ என்பதைக் காட்டிலும் உரையாடலில் இயல்பாக இருந்து, சொல்லை வெறும் உணர்ச்சியாகவும் சுருக்குவதில்லை.
- source_word: ἕως θανάτου
  choice: மரணத்தை எட்டும் அளவுக்கு
  rationale: துயரத்தின் உச்ச எல்லையைச் சுட்டும் சொற்றொடரின் வலிமையைப் பாதுகாக்கிறது; அது ‘மரணம் வருமளவுக்கு’ என்றும் புரிந்துகொள்ளப்படலாம்.
- source_word: μείνατε ὧδε
  choice: நீங்கள் இங்கேயே இருந்து
  rationale: சீடர்கள் அந்த இடத்திலேயே தொடர்ந்து இருக்க வேண்டும் என்ற கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: γρηγορεῖτε
  choice: விழிப்புடன் இருங்கள்
  rationale: உறங்காமல் இருப்பதையும் எச்சரிக்கையான கவனத்துடன் இருப்பதையும் உள்ளடக்கக்கூடிய கிரேக்கக் கட்டளையின் இரு பரிமாணங்களையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவின் ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: உள்ளம்
  alternative: ஆன்மா; உயிர்; நான்
  rationale: இயேசுவின் உண்மையான மனித வேதனையை வெளிப்படுத்தும் சொற்றொடரை இயல்பாகக் கூறுகிறது; உடல்–ஆன்மா குறித்த பிற்காலக் கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் திணிக்காமல், அவரது அக வாழ்வையும் முழு ஆளுமையையும் சுட்டுகிறது.
- issue: γρηγορεῖτε கட்டளையின் பொருள்
  choice: விழிப்புடன் இருங்கள்
  alternative: விழித்திருங்கள்; காவலாயிருங்கள்
  rationale: இது உடலளவில் உறங்காமல் இருப்பதையும் பரந்த விழிப்புணர்வையும் குறிக்கக்கூடும்; அவற்றில் ஒன்றை மட்டும் தேர்ந்து பதற்றத்தை நீக்காமல் இரண்டையும் திறந்த நிலையில் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் நிகழ்வின் ஆழ்ந்த துயரத்திற்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது; “நீங்கள்” என்பது கட்டளையின் பன்மையைத் தெளிவாக்குகிறது.
