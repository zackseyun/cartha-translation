  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: ta
  text: இயேசு, “நானே[a]. மனிதகுமாரன் வல்லமையின்[b] வலப்பக்கத்தில் அமர்ந்திருப்பதையும், வானத்தின் மேகங்களோடு வருவதையும் நீங்கள் காண்பீர்கள்[c],” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்சார்ந்து “நான் இருக்கிறேன்.” இச்சூழலில் இதை “நான்தான்” என்றும் பொருள்கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “வல்லமை” என்பது கடவுளை மரியாதையுடன் குறிப்பிடும் ஒரு சுற்றுப்பெயர்.
    reason: cultural_note
  - marker: c
    text: இக்கூற்று சங்கீதம் 110:1 மற்றும் தானியேல் 7:13 ஆகியவற்றை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: கிரேக்கச் சொற்றொடர் வலியுறுத்தப்பட்ட ‘நான் இருக்கிறேன்’ என்பதாகும்; ஆனால் தலைமை ஆசாரியனின் கேள்விக்கான நேரடியான பதிலாக நவீன தமிழில் ‘நானே’ என்பது இயல்பாகவும் சுருக்கமாகவும் அமைகிறது. வெளிப்படையாக இல்லாத பயனிலையைச் சேர்க்காமல், கூற்றின் ஆழ்ந்த ஒலிநயத்தையும் திறந்த நிலையில் வைக்கிறது.
- source_word: ὄψεσθε
  choice: நீங்கள் காண்பீர்கள்
  rationale: எதிர்காலத்தில் காண்பதை நேரடியாகக் குறிக்கிறது; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற தற்சுட்டுப் பெயரையும் தானியேல் 7-ன் பின்னணியையும் காக்கும் மரபான, புரிந்துகொள்ளத்தக்க தமிழ் வடிவம்.
- source_word: ἐκ δεξιῶν
  choice: வலப்பக்கத்தில்
  rationale: மிகுந்த மதிப்பும் அதிகாரமும் உடைய இடத்தைக் குறிக்கும் மூலமொழி உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τῆς δυνάμεως
  choice: வல்லமையின்
  rationale: கடவுளை நேரடியாகப் பெயரிடாமல் மரியாதையுடன் சுட்டும் மூலமொழிச் சுற்றுப்பெயரை அப்படியே காக்கிறது.
- source_word: καθήμενον
  choice: அமர்ந்திருப்பதையும்
  rationale: சாதாரணமாக உட்கார்ந்திருப்பதைவிட, உயர்ந்த அதிகார நிலையில் அமர்ந்திருக்கும் கருத்தை ஏற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐρχόμενον
  choice: வருவதையும்
  rationale: தானியேல் நூலுடனான இறுதிக்கால ஒலிப்பைச் சீராகக் காக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: வானத்தின் மேகங்களோடு
  rationale: மூலமொழியின் சொற்சித்திரத்தையும் தானியேல் 7:13-ன் மேன்மையான தரிசன மொழியையும் காக்கிறது.
- source_word: καὶ ... καὶ
  choice: …அமர்ந்திருப்பதையும், …வருவதையும்
  rationale: தமிழின் இணைப்பு அமைப்பைப் பயன்படுத்தி, அமர்ந்திருத்தல் மற்றும் வருதல் ஆகிய இரு கூற்றுகளையும் சமமாக இணைக்கிறது.
theological_decisions:
- issue: Ἐγώ εἰμι என்பதை எளிய உறுதிப்பாடாகவா அல்லது விரிவாக்கப்பட்ட அடையாளக் கூற்றாகவா மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘நானே’
  alternative: ‘நான் இருக்கிறேன்’ அல்லது ‘நான்தான்’
  rationale: ‘நானே’ என்பது கேள்விக்கான இயல்பான உறுதிப்பாடாக இருக்கிறது; அதேவேளையில் கிரேக்கத்தில் இல்லாத பெயர்ப் பயனிலையைச் சேர்ப்பதில்லை. அடிக்குறிப்பு சொற்சார்ந்த வடிவத்தைத் தெரிவிப்பதால், உடனடிப் பொருளுக்கும் சாத்தியமான ஆழ்ந்த இறையியல் ஒலிப்புக்கும் இடையிலான பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: τῆς δυνάμεως யாரைக் குறிக்கிறது என்பதை வெளிப்படையாகச் சொல்வதா
  choice: ‘கடவுள்’ என்று மாற்றாமல் ‘வல்லமை’ என்ற மரியாதைச் சுற்றுப்பெயரைப் பாதுகாத்தல்
  alternative: ‘கடவுள்’ அல்லது ‘வல்லமையுள்ளவர்’
  rationale: மூல உரை நேரடியாகக் கடவுள் என்று கூறாமல் மரியாதைச் சுற்றுப்பெயரைப் பயன்படுத்துகிறது. அதையே காப்பது மூலத்தின் தொனியையும் நோக்கமுள்ள மறைமுகத்தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நீதிமன்றச் சூழல் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்,’ ‘வல்லமை,’ ‘வானத்தின் மேகங்கள்’ ஆகிய வேதாகமச் சொற்சித்திரங்கள் எளிமைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன; அதேவேளையில் வாக்கிய இணைப்பு தமிழுக்கு இயல்பாக அமைக்கப்பட்டுள்ளது.
