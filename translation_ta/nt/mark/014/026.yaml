revisions:
- from: அவர்கள் துதிப்பாடல் பாடிய பின்பு[a], ஒலிவ மலையை நோக்கிப் புறப்பட்டுச் சென்றார்கள்.
  to: அவர்கள் துதிப்பாடல் பாடிய பின்பு[a], ஒலிவ மலைக்கு புறப்பட்டுச் சென்றார்கள்.
  rationale: The revision preserves the Greek sequence and participial relationship while rendering εἰς as a clear destination rather than a general direction. The footnote is smoothed without adding interpretation.
