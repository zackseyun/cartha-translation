  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ta
  text: அவர்கள் துதிப்பாடல் பாடிய பின்பு[a], ஒலிவ மலைக்கு புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்பாக, “துதிப்பாடல் பாடி.” கிரேக்கப் பங்கேற்புவினை, அவர்கள் புறப்படுவதற்கு முன்பு பாடியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: எளிய தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டுகிறது; முன்செயலுக்கும் அடுத்த செயலுக்கும் உள்ள வரிசையைத் தெளிவாக்குகிறது.
- source_word: ὑμνήσαντες
  choice: துதிப்பாடல் பாடிய பின்பு
  rationale: ὑμνέω என்பது துதிப்பாடல் பாடுவதைக் குறிக்கிறது; இறந்தகாலப் பங்கேற்புவினை, அவர்கள் புறப்படுவதற்கு முன் பாடியது நிகழ்ந்ததாகக் காட்டுகிறது.
- source_word: ἐξῆλθον
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: சூழலில் ஓர் இடத்தைவிட்டு இலக்கை நோக்கிச் சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εἰς
  choice: நோக்கி
  rationale: பெயரிடப்பட்ட இடத்தை இலக்காகக் கொண்ட இயக்கத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலை
  rationale: அந்தப் புவியியல் இடப்பெயரின் தெளிவான, வழக்கமான தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை. கிரேக்க வாக்கியத்தின் செயல்முறை வரிசை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
