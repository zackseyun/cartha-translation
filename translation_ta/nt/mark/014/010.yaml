source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: ta
  text: பன்னிருவரில் ஒருவனான யூதாஸ் இஸ்கரியோத், இயேசுவை அவர்களிடம் ஒப்படைப்பதற்காக[a] தலைமை ஆசாரியர்களிடம் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடம் இயேசுவைக் காட்டிக்கொடுப்பதற்காக.” கிரேக்க வினைச்சொல் “ஒப்படைக்க” என்றும் பொருள்படும்; யூதாஸின் செயலில் அந்த ஒப்படைத்தல் ஒரு துரோகச் செயலாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை)
  rationale: தமிழில் இந்த நிகழ்வை முந்தைய நிகழ்வுடன் இயல்பாகத் தொடர்வதற்கு வாக்கிய வரிசையே போதுமானது; ‘மேலும்’ போன்ற சொல் தேவையற்ற அழுத்தத்தை ஏற்படுத்தலாம்.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: யூதாஸ் இஸ்கரியோத்து
  rationale: தனிப்பெயரும் அடைபெயரும் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவனான
  rationale: இது இயேசுவால் தேர்ந்தெடுக்கப்பட்ட அறியப்பட்ட பன்னிருவர் குழுவைக் குறிக்கிறது; தமிழில் இயல்பான அடைமொழித் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: ἀπῆλθεν
  choice: சென்றான்
  rationale: எளிய இறந்தகால நிகழ்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘புறப்பட்டுச் சென்றான்’ என மூலத்தில் இல்லாத பிரிவுணர்வை மிகைப்படுத்தவில்லை.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: தலைமைக் குருக்களிடம்
  rationale: பன்மைச் சொல் எருசலேமின் உயர் நிலை ஆசாரியத் தலைமையைக் குறிக்கிறது; ஒரே ஒரு தலைமை ஆசாரியரை அல்ல. ‘தலைமைக் குருக்கள்’ நவீன வாசகருக்குத் தெளிவான நிறுவனச் சொல்லாக்கம்.
- source_word: ἵνα
  choice: ஒப்படைப்பதற்காக
  rationale: ἵνα இங்கு நோக்கத்தை அறிமுகப்படுத்துவதால் ‘-பதற்காக’ என்ற அமைப்பு அதன் நோக்கப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: παραδοῖ
  choice: ஒப்படைக்க
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருளான ஒருவரை மற்றவர்களின் கையில் ஒப்படைத்தலைப் பாதுகாக்கிறது; ‘காட்டிக்கொடுக்க’ என்று நேரடியாக மொழிபெயர்த்து துரோகப் பொருளை முதன்மை உரையிலேயே குறுக்கவில்லை.
- source_word: αὐτὸν ... αὐτοῖς
  choice: இயேசுவை அவர்களிடம்
  rationale: தமிழில் ‘அவரை’ என்பதன் முன்னிலைத் தொடர்பு குழப்பமடையக்கூடும் என்பதால், αὐτόν குறிக்கும் இயேசுவின் பெயர் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது; αὐτοῖς என்பது தலைமைக் குருக்களைக் குறிக்கும் ‘அவர்களிடம்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: துரோகச் சூழலில் παραδοῖ என்பதன் மொழிபெயர்ப்பு
  choice: இயேசுவை அவர்களிடம் ஒப்படைக்க
  alternative: அவர்களிடம் இயேசுவைக் காட்டிக்கொடுக்க
  rationale: யூதாஸின் செயல் துரோகம் என்றாலும், கிரேக்க வினைச்சொல் அதைவிட விரிவாக ‘ஒப்படை/கையளி’ என்று பொருள்படுகிறது; பாடுகளின் வர்ணனையில் தொடர்ந்து காணப்படும் ஒப்படைத்தல் என்ற கருத்தையும் அதன் அறநெறிசார் பதற்றத்தையும் முதன்மை உரை பாதுகாக்கிறது. துரோக நுட்பம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தலைமைக் குருக்கள்’ என்பது வரலாற்றுச் சமயத் தலைமையைத் தெளிவாகக் குறிக்கிறது. பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன.
