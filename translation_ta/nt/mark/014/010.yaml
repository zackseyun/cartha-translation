revisions:
- from: பன்னிருவரில் ஒருவனான யூதாஸ் இஸ்கரியோத்து, இயேசுவை அவர்களிடம் ஒப்படைப்பதற்காக[a] தலைமைக் குருக்களிடம் சென்றான்.
  to: பன்னிருவரில் ஒருவனான யூதாஸ் இஸ்கரியோத், இயேசுவை அவர்களிடம் ஒப்படைப்பதற்காக[a] தலைமை ஆசாரியர்களிடம் சென்றான்.
  rationale: The revision corrects the transliteration of Ἰσκαριώθ and uses a more precise modern Tamil designation for the chief priests. It retains the draft’s faithful purposive construction and its non-interpretive primary rendering of παραδοῖ. The footnote preserves the betrayal nuance without imposing it on the main text.
  reviewer_model: gpt-5.6-terra
