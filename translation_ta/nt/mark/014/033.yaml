  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: ta
  text: அவர் பேதுருவையும் யாக்கோபையும் யோவானையும் தம்முடன் அழைத்துக்கொண்டார்; அவர் பெரும் அதிர்ச்சியும்[a] மனவேதனையும் அடையத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் திடுக்குற்று.” முதல் வினை இச்சூழலில் தீவிரமான திடுக்கிடல், அதிர்ச்சி அல்லது கலக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: தம்முடன் அழைத்துக்கொண்டார்
  rationale: தேர்ந்தெடுக்கப்பட்ட சீடர்களைத் தம்முடன் கூட்டிச் செல்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. கிரேக்க வரலாற்று நிகழ்காலம், தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μετ’ αὐτοῦ
  choice: தம்முடன்
  rationale: இயேசுவுடன் பேதுரு, யாக்கோபு, யோவான் சென்றதைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: ἤρξατο
  choice: அடையத் தொடங்கினார்
  rationale: உணர்ச்சி நிலை அப்போது தொடங்கியது என்ற தொடக்கநிலைப் பொருளை வெளிப்படையாகப் பேணுகிறது.
- source_word: ἐκθαμβεῖσθαι
  choice: கடும் அதிர்ச்சி அடைய
  rationale: இச்சூழலில் வெறும் வியப்பைக் காட்டாமல், தீவிரமான திடுக்கிடல், அதிர்ச்சி அல்லது கலக்கத்தை எடுத்துரைக்கிறது; சொல்லின் பொருள் வரம்பை மிகையாகக் குறுக்காமல் வைத்திருக்கிறது.
- source_word: ἀδημονεῖν
  choice: மனவேதனை அடைய
  rationale: கடுமையான உள்ளார்ந்த நெருக்கடியையும் வேதனையையும் இயல்பான தமிழில் தெரிவித்து, முதல் வினையிலிருந்து வேறுபாட்டையும் பேணுகிறது.
- source_word: καὶ ... καὶ
  choice: …யும் …யும் …யும்; பின்பு
  rationale: பெயர்களை இணைக்கும் தொடர்ச்சியான καί தமிழின் ‘உம்’ இணைப்பால் பேணப்பட்டுள்ளது; அடுத்த நிகழ்வை அறிமுகப்படுத்தும் καί கதைநடைக்கு இயல்பாக ‘பின்பு’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: கெத்செமனேயில் இயேசுவின் உணர்ச்சி நிலையை மொழிபெயர்த்தல்
  choice: அவருடைய உண்மையான, தீவிரமான மனிதத் துயரத்தை ‘கடும் அதிர்ச்சியும் மனவேதனையும் அடையத் தொடங்கினார்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘வியப்படைந்து கலக்கமடைந்தார்’ என்று மென்மைப்படுத்துதல் அல்லது ‘திகிலால் ஆட்கொள்ளப்பட்டு கடும் வேதனைப்பட்டார்’ என்று வலுப்படுத்துதல்
  rationale: மூலவசனம் இயேசுவின் ஆழ்ந்த உணர்ச்சிக் கொந்தளிப்பை வெளிப்படுத்துகிறது. அதை மென்மைப்படுத்தாமலும், வசனத்திற்கு அப்பாற்பட்ட காரணவிளக்கத்தைச் சேர்க்காமலும், இரு கிரேக்க வினைகளின் தனித்த அழுத்தத்தை இம்மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலத்தில் வழங்கப்பட்டுள்ளது.
