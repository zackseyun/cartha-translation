  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: ta
  text: அவர் இன்னும் பேசிக்கொண்டிருந்தபோதே, பன்னிருவரில் ஒருவனான யூதாஸ் உடனே வந்தான்[a]; அவனுடன் வாள்களையும் தடிகளையும்[c] ஏந்திய ஒரு கூட்டமும்[b], தலைமைக் குருக்கள், வேத அறிஞர்கள், மூப்பர்கள் ஆகியோரிடமிருந்து வந்தது[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘வருகிறான்’ என்ற வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டு காட்சி உயிரோட்டமாகச் சொல்லப்படுகிறது; தமிழில் இயல்பான கதைநடைக்காக ‘வந்தான்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘கும்பல்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் அடிப்படையில் ‘கூட்டம்’ என்று பொருள்படும், ஆனால் இங்குள்ள சூழல் பகைமையானது.
    reason: lexical_alternative
  - marker: c
    text: நேர்ச்சொல்லாக ‘மரப்பொருள்கள்’; இங்கே ஆயுதங்களாகப் பயன்படுத்தப்பட்ட தடிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: ‘அனுப்பப்பட்ட’ என்றும் விளக்கமாக மொழிபெயர்க்கலாம்; கிரேக்கத்தில் நேரடியாக ‘...இடமிருந்து’ என்று உள்ளது. இது அந்தத் தலைவர்களுடனான கூட்டத்தின் மூலம் அல்லது அதிகாரத் தொடர்பைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: நிகழ்வின் திடீர்த்தன்மையையும் மாற்குவின் வேகமான கதைநடையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் பேசிக்கொண்டிருந்தபோதே
  rationale: ஒரே நேரத்தில் நடந்த செயலைக் குறிக்கும் கிரேக்க genitive absolute அமைப்பையும் ἔτι என்பதன் ‘இன்னும்’ என்ற பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παραγίνεται
  choice: வந்தான்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது; சம்பவ இடத்திற்கு வந்து சேர்ந்த பொருள் காக்கப்படுகிறது.
- source_word: Ἰούδας
  choice: யூதாஸ்
  rationale: தமிழில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: εἷς τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவன்
  rationale: ‘சீடன்’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல், மூலத்தின் சுருக்கமான குழுப் பெயரைப் பாதுகாக்கிறது.
- source_word: ὄχλος
  choice: ஒரு கூட்டம்
  rationale: சொல்லின் அடிப்படைப் பொருளை நேரடியாகத் தருகிறது; பகைமைச் சூழலை ஆயுதங்கள் வெளிப்படுத்துவதால் ‘கும்பல்’ என்று மிகையாக முன்தீர்மானிக்கவில்லை.
- source_word: μετὰ μαχαιρῶν
  choice: வாள்களை ஏந்திய
  rationale: μάχαιρα குறுகிய வாள் அல்லது கத்திவகையைக் குறிக்கக்கூடியபோதிலும், கைது நிகழ்வில் ‘வாள்’ தெளிவான, வழக்கமான இணைச்சொல்.
- source_word: ξύλων
  choice: தடிகளை ஏந்திய
  rationale: சொல் நேரடியாக ‘மரக்கட்டைகள்/மரப்பொருள்கள்’ என்று பொருள்பட்டாலும், இச்சூழலில் ஆயுதமாகப் பயன்படுத்தப்படும் தடிகளைக் குறிக்கிறது.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: தலைமைக் குருக்கள், வேத அறிஞர்கள், மூப்பர்கள் ஆகியோரிடமிருந்து வந்த
  rationale: παρά + genitive காட்டும் மூலம் அல்லது அதிகாரத் தொடர்பை காக்கிறது; ‘அனுப்பப்பட்ட’ என்று மூலத்தில் வெளிப்படையாக இல்லாத செயப்பாட்டு விவரத்தைச் சேர்க்கவில்லை.
- source_word: ἀρχιερέων
  choice: தலைமைக் குருக்கள்
  rationale: பல தலைமை மதகுருக்களைக் கொண்ட ஆலயத் தலைமை வட்டத்தைக் குறிக்கிறது; ஒரே நேரத்தில் பல தலைமைப் பிரதான குருக்கள் இருந்ததாகத் தவறாக உணர்த்தாது.
- source_word: γραμματέων
  choice: வேத அறிஞர்கள்
  rationale: யூத மறைநூல்களையும் திருச்சட்டத்தையும் ஆய்ந்து போதித்த அங்கீகரிக்கப்பட்ட அறிஞர் வகுப்பை, இன்றைய வாசகருக்குப் புரியும் வகையில் குறிக்கிறது.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட சமூக மற்றும் நிர்வாகத் தலைவர்களைக் குறிக்கும் நிலைபெற்ற நேரடி மொழிபெயர்ப்பு.
theological_decisions:
- issue: παραγίνεται என்ற வரலாற்று நிகழ்காலத்தின் காலநிலை
  choice: தமிழ் கதைநடைக்கு ஏற்ப ‘வந்தான்’ என்ற இறந்தகாலம்
  alternative: கிரேக்கத்தின் உயிரோட்டத்தை வடிவரீதியாகப் பிரதிபலித்து ‘வருகிறான்’ என நிகழ்காலத்தில் மொழிபெயர்த்தல்
  rationale: இது இறையியல் முடிவு அல்ல; வாசிப்பின் உயிரோட்டத்தைப் பாதிக்கும் நடைத் தீர்மானம். இயல்பான தமிழ்க் கதைநடையை முன்னிறுத்தி, மூலத்தின் வரலாற்று நிகழ்காலத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: அதிகாரத் தலைவர்களுடன் παρά காட்டும் தொடர்பு
  choice: ‘ஆகியோரிடமிருந்து வந்த’ என்று மூலம்/அதிகாரத் தொடர்பை வைத்திருத்தல்
  alternative: ‘ஆகியோரால் அனுப்பப்பட்ட’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: கூட்டத்துக்கும் தலைவர்களுக்கும் உள்ள நிறுவனம் சார்ந்த தொடர்பை மூல உரை காட்டுகிறது; அவர்கள் அனுப்பிய செயன்முறையை நேரடியாகக் கூறாததால் அதைக் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பன்னிருவர்’ என்ற நிலைபெற்ற குழுப் பெயர் விளக்கமின்றி காக்கப்பட்டுள்ளது. ‘வேத அறிஞர்கள்’ என்பது பழமையான அல்லது தொழில்சார் குழப்பம் தரக்கூடிய சொற்களைத் தவிர்த்து γραμματεῖς என்பதன் வரலாற்றுப் பணியை வாசகருக்கு உணர்த்துகிறது.
