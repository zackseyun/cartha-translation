source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: ta
  text: 'ஆனால், அவன் இன்னும் அதிகமாக வலியுறுத்திக் கூறிக்கொண்டிருந்தான்[a]: “நான் உம்மோடு சேர்ந்து சாக வேண்டியிருந்தாலும்[b], உம்மை ஒருபோதும் மறுதலிக்க மாட்டேன்[c].” எல்லாரும் அதையே கூறிக்கொண்டிருந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் மிகுந்த அழுத்தத்துடன் பேசிக்கொண்டிருந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உம்மோடு ஒன்றாகச் சாக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உம்மை நிச்சயமாக மறுதலிக்கவே மாட்டேன்.” கிரேக்கத்தில் மிகவும் வலுவான மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: இன்னும் அதிகமாக வலியுறுத்திக் கூறினான்
  rationale: ἐκπερισσῶς உரையின் மிகுதியையும் தீவிரத்தையும் காட்டுகிறது; ἐλάλει என்ற நிறைவுறா இறந்தகால வடிவம் தொடர்ந்து அல்லது மீண்டும் கூறிய செயலை உணர்த்துகிறது. இவ்விரண்டையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: Ἐὰν δέῃ με
  choice: நான் ... வேண்டியிருந்தாலும்
  rationale: δέῃ வெறும் சாத்தியத்தை அல்ல, அவசியத்தைச் சுட்டுகிறது. நிபந்தனை அமைப்பில் ‘வேண்டியிருந்தாலும்’ என்பது அந்த அவசியத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συναποθανεῖν σοι
  choice: உம்மோடு சேர்ந்து சாக
  rationale: συν- என்ற முன்னொட்டு ‘ஒன்றாக/உடன்’ என்ற கருத்தை வெளிப்படையாகக் கொண்டுள்ளது; ‘உம்மோடு சேர்ந்து’ அதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οὐ μή
  choice: நிச்சயமாக ... மாட்டேன்
  rationale: οὐ μή என்பது மிகவும் வலுவான மறுப்பாகும். ‘நிச்சயமாக’ மற்றும் ‘-வே மாட்டேன்’ ஆகியவை சேர்ந்து அதன் அழுத்தத்தை இயல்பான தமிழில் தருகின்றன.
- source_word: ἀπαρνήσομαι
  choice: மறுதலிக்கவே மாட்டேன்
  rationale: இச்சூழலில் இயேசுவுடனான தொடர்பை மறுப்பதைக் குறிக்கிறது; பின்னர் நடைபெறும் பேதுருவின் மறுதலிப்போடும் சொல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: மற்ற எல்லாரும் அதையே கூறிக்கொண்டிருந்தார்கள்
  rationale: ὡσαύτως என்பது அதே கருத்தைக் கூறியதைச் சுட்டுகிறது; πάντες அனைவரையும் உள்ளடக்குகிறது; ἔλεγον என்ற நிறைவுறா இறந்தகாலத்தின் தொடர்ச்சியை ‘கூறிக்கொண்டிருந்தார்கள்’ பாதுகாக்கிறது.
theological_decisions:
- issue: பேதுருவின் உறுதிமொழியிலுள்ள மறுப்பின் வலிமை
  choice: “உம்மை நிச்சயமாக மறுதலிக்கவே மாட்டேன்”
  alternative: “உம்மை ஒருபோதும் மறுதலிக்க மாட்டேன்”
  rationale: οὐ μή உடன் வரும் எதிர்கால வினையின் வலுவான மறுப்பைப் பாதுகாக்கிறது. பின்னர் பேதுரு தோல்வியடைவதால் உருவாகும் கதையின் இறையியல் பதற்றத்தை விளக்கிச் சமன்படுத்தாமல் அப்படியே விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமையான ‘உம்மை/உம்மோடு’ பயன்படுத்தப்பட்டுள்ளது; கதையுரையின் தொடர்ச்சியான செயற்பாங்கும் பேதுருவின் தீவிரமான வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
