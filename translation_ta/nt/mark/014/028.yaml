  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: ta
  text: ஆனால் நான் உயிர்த்தெழுப்பப்பட்ட பிறகு[a], உங்களுக்கு முன்னதாகக் கலிலேயாவுக்குச் செல்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் உயிர்த்தெழுந்த பிறகு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘எழுப்பு’ என்ற வினை செயப்பாட்டு வடிவில் உள்ளது; இது உயிர்த்தெழுதலைக் குறிப்பிடப் பொதுவாகப் பயன்படுத்தப்படும் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சீடர்கள் சிதறிப்போவார்கள் என்று கூறப்பட்டதற்கு மாறான அடுத்த நிகழ்வை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: நான் உயிர்த்தெழுப்பப்பட்ட பிறகு
  rationale: μετά உடன் வரும் வினையெச்சக் கட்டமைப்பு கால வரிசையில் ‘பிறகு’ என்பதைக் குறிக்கிறது; செயப்பாட்டு வடிவத்தையும் உயிர்த்தெழுதல் சார்ந்த பொருளையும் தமிழ் வாசகத்தில் தக்கவைக்கிறது.
- source_word: ἐγερθῆναί
  choice: உயிர்த்தெழுப்பப்பட்ட
  rationale: ἐγείρω என்பதன் இறந்தகாலச் செயப்பாட்டு முடிவிலி வடிவத்தைப் பிரதிபலிக்கிறது. வெறும் ‘எழுப்பப்பட்ட’ என்பதைவிட உயிர்த்தெழுதல் குறிப்பு தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: προάξω
  choice: முன்னதாகச் செல்வேன்
  rationale: இலக்கை நோக்கி மற்றவர்களுக்கு முன்பே செல்வதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘வழிநடத்துவேன்’ என்ற தேவையற்ற பொருளைச் சேர்க்கவில்லை.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் பன்மையை மரியாதை அல்லது உயர்வு காரணமாக அல்லாமல் சூழலுக்கேற்ற பன்மையாகக் குறிக்கிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: கலிலேயாவை நோக்கிய நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்க εἰς இன் திசை சார்ந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἐγερθῆναί με என்பதிலுள்ள உயிர்த்தெழுதல் மொழியும் செயப்பாட்டு வடிவமும்
  choice: நான் உயிர்த்தெழுப்பப்பட்ட பிறகு
  alternative: நான் உயிர்த்தெழுந்த பிறகு
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, அதைத் தன்னிலை/செய்வினையாக மாற்றாமல் விடுகிறது. அதே நேரத்தில் தமிழில் இது மரணத்திலிருந்து உயிர்த்தெழுதலைக் குறிக்கிறது என்பது தெளிவாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்த்தெழுப்பப்பட்ட’ என்பது அன்றாடப் பேச்சைவிட சற்றே வேதாகமச் சார்புடையதாக இருந்தாலும், உயிர்த்தெழுதல் பொருளையும் மூலத்தின் செயப்பாட்டு வடிவத்தையும் தெளிவாகப் பாதுகாக்கிறது.
