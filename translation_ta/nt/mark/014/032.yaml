source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: ta
  text: அவர்கள் கெத்செமனே என்னும் இடத்துக்கு வந்தார்கள்.[a] அவர் தம் சீடர்களிடம், “நான் ஜெபிக்கும்வரை இங்கே உட்கார்ந்திருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இன்னும் சொற்சொல்லாக, “அவர்கள் வருகிறார்கள் … அவர் சொல்கிறார்” என்று நிகழ்காலத்தில் உள்ளது; மாற்கு கடந்த நிகழ்வுகளை உயிரோட்டமாக விவரிக்க இவ்வாறு நிகழ்காலத்தைப் பயன்படுத்துகிறார்.
    reason: வரலாற்று நிகழ்காலம் தமிழில் இயல்பான கடந்தகாலக் கதைநடையாக மொழிபெயர்க்கப்பட்டதைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: ἔρχονται
  choice: வந்தார்கள்
  rationale: கிரேக்கத்தில் இது காட்சியை உயிரோட்டமாக்கும் வரலாற்று நிகழ்காலம். கடந்த நிகழ்வை விவரிக்கும் இயல்பான நவீன தமிழில் இறந்தகாலம் பயன்படுத்தப்பட்டது.
- source_word: χωρίον
  choice: இடம்
  rationale: இச்சொல் ஓர் இடம், நிலப்பகுதி அல்லது சொத்து எனப் பொருள்படலாம். மூலத்தில் உறுதிப்படுத்தப்படாத ‘தோட்டம்’ அல்லது ‘பண்ணை’ போன்ற குறிப்புகளைச் சேர்க்காமல், பரந்த பொருளுடைய ‘இடம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: கெத்செமனே என்னும்
  rationale: பெயரைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான தமிழில் தருகிறது; Γεθσημανί என்பது ‘கெத்செமனே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: λέγει
  choice: என்றார்
  rationale: இங்கும் கிரேக்கம் வரலாற்று நிகழ்காலத்தைப் பயன்படுத்துகிறது. தமிழின் இயல்பான கடந்தகாலக் கதைநடைக்காக இறந்தகாலம் பயன்படுத்தப்பட்டது.
- source_word: μαθηταῖς
  choice: சீடர்களிடம்
  rationale: ஆசிரியரிடம் கற்றுப் பின்பற்றுகிறவர்களைக் குறிக்கும் நற்செய்தி நூல்களின் வழக்கமான, துல்லியமான தமிழ்ச் சொல் ‘சீடர்கள்’ ஆகும்.
- source_word: Καθίσατε
  choice: உட்கார்ந்திருங்கள்
  rationale: கட்டளையின் நேரடியான பொருளை இயல்பான மரியாதைப் பன்மைத் தமிழில் தருகிறது; இச்சூழலில் அவர்கள் அங்கேயே இருக்க வேண்டிய கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் கிரேக்க வினையடைக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: ἕως προσεύξωμαι
  choice: நான் வேண்டிக்கொள்ளும்வரை
  rationale: ἕως உடன் வரும் அயோரிஸ்ட் துணைவினை கால எல்லையை, ‘நான் வேண்டிக்கொள்ளும் வரை,’ எனக் குறிக்கிறது. ‘வேண்டிக்கொள்ளுதல்’ என்பது προσεύχομαι என்பதன் இறைவேண்டல் சார்ந்த பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது; ‘முடித்துவிட்டு வரும்வரை’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
