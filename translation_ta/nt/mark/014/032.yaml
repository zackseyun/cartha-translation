translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. கிரேக்கத்தின் இரு வரலாற்று நிகழ்கால வினைகளும் இயல்பான தமிழ் இறந்தகாலமாக்கப்பட்டு, அந்த வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. மூலத்தின் இரு καί இணைப்புகளையும் அப்படியே குவிக்காமல் இரண்டு இயல்பான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
