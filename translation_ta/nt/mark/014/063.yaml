  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: ta
  text: அப்போது தலைமை ஆசாரியர் தம் உடைகளைக் கிழித்து, “சாட்சிகள் நமக்கு இன்னும் எதற்கு?” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் கதைநடை நிகழ்காலம் பயன்படுத்தப்பட்டு, “என்கிறார்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: இந்த விசாரணைக்குத் தலைமை தாங்கும் ஒரே பதவி வகிப்பவரைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் சொல்.
- source_word: διαρρήξας
  choice: கிழித்துக்கொண்டு
  rationale: உடைகளைக் கிழித்த செயல் முடிந்த பின்னணியில் அவர் பேசுவதை இயல்பான தமிழ் வினையெச்ச வடிவில் தருகிறது.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: தன் உடைகளை
  rationale: χιτών என்பது குறிப்பாக உள்ளங்கி அல்லது அங்கியைக் குறிக்கக்கூடும்; ஆனால் இங்கு பன்மையைப் பேணி, சடங்கு உடை என்று மிகையாகக் குறிப்பாக்காமல் பொதுவாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது; தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதால் ‘என்றார்’ என வழங்கப்பட்டுள்ளது.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: இன்னும் நமக்குச் சாட்சிகள் எதற்கு?
  rationale: ἔτι என்பதன் ‘இன்னும்’ என்ற பொருளையும், இனி கூடுதல் சாட்சிகள் தேவையில்லை எனக் கேள்வி உணர்த்தும் வலிமையையும் இயல்பான தமிழில் பேணுகிறது.
theological_decisions:
- issue: தலைமைக் குரு உடைகளைக் கிழித்ததன் பொருள்
  choice: உடைகளைக் கிழித்த செயலை மட்டும் கூறி, அதன் உணர்ச்சி அல்லது சமய நோக்கத்தை விளக்காமல் விடுதல்
  alternative: இறைநிந்தனையாகக் கருதி ஏற்பட்ட சினம் அல்லது துயரத்தின் வெளிப்பாடு என்று வெளிப்படையாக விளக்குதல்
  rationale: வசனம் செயலும் பேச்சும் மட்டுமே கூறுகிறது; அந்தச் சைகையின் பொருளைத் தானாக விளக்கவில்லை. ஆகவே விளக்கவுரையை மூலவசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உடைகள்’ என்ற சொல் மூலத்தின் பன்மையைப் பேணுகிறது; ‘அங்கிகள்’ என்பதும் சாத்தியம். அடிக்குறிப்பு குறியீடு சம்பந்தப்பட்ட ‘என்றார்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
