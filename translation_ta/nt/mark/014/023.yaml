  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: ta
  text: அவர் ஒரு கிண்ணத்தை[a] எடுத்து, நன்றி செலுத்திய பின்பு அதை அவர்களுக்குக் கொடுத்தார்; அவர்கள் எல்லாரும் அதிலிருந்து குடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கிண்ணத்தை.” கிரேக்க மூலத்தில் “கிண்ணம்” என்ற சொல்லுக்கு முன் நிர்ணய உருபு இல்லை; எனினும், உணவின் சூழல் ஒரு குறிப்பிட்ட கிண்ணத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: எடுத்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் துணைச் செயலை இயல்பான தமிழில் வினையெச்சமாகக் காட்டுகிறது.
- source_word: ποτήριον
  choice: ஒரு கிண்ணத்தை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு சுட்டுச் சொல் இல்லாததால் இது நேரடியான மொழிபெயர்ப்பு; உணவுச் சூழல் குறிப்பிட்ட கிண்ணத்தைக் குறிக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்திய பின்பு
  rationale: முதன்மை வினைக்கு முன்னதாக நன்றி செலுத்துதல் நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; பிற்காலச் சடங்கியல் சொல்லாட்சியைப் புகுத்தவில்லை.
- source_word: ἔδωκεν αὐτοῖς
  choice: அதை அவர்களுக்குக் கொடுத்தார்
  rationale: முந்தைய ‘கிண்ணத்தை’ குறிக்கும் செயப்படுபொருளைத் தமிழில் இயல்பாக ‘அதை’ என்று வெளிப்படுத்துகிறது.
- source_word: ἔπιον
  choice: குடித்தார்கள்
  rationale: இறந்தகால நிகழ்வை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐξ αὐτοῦ
  choice: அதிலிருந்து
  rationale: நடுநிலைப் பெயர்ச்சொல்லான கிண்ணத்தையே பதிலிப்பெயர் குறிக்கிறது; பாத்திரத்திலிருந்து குடித்தார்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: ஒவ்வொருவரும் குடித்தார்கள் என்ற வலியுறுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: εὐχαριστήσας என்பதிலுள்ள திருவிருந்து சார்ந்த பிற்கால எதிரொலி
  choice: நன்றி செலுத்திய பின்பு
  alternative: அதை ஆசீர்வதித்த பின்பு; நன்றியுரை கூறிய பின்பு
  rationale: εὐχαριστέω என்பதன் நேரடிப் பொருள் நன்றி செலுத்துதல். பிற்காலத் திருச்சபைச் சடங்கியல் பொருளை வசனத்திற்குள் முன்கூட்டியே புகுத்தாமல் மூலத்தின் சொல்லை மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘எடுத்து … நன்றி செலுத்திய பின்பு … கொடுத்தார்’ என்ற அமைப்பு கிரேக்க வினையெச்சங்களின் நிகழ்வுவரிசையைத் தெளிவாகப் பாதுகாக்கிறது.
