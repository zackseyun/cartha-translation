id: MRK.14.48
reference: Mark 14:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: ta
  text: இயேசு அவர்களுக்குப் பதிலளித்து, “ஒரு கொள்ளைக்காரனைப் பிடிக்க வருவதுபோல், வாள்களோடும் தடிகளோடும் என்னைக் கைது செய்ய வந்தீர்களா?” என்று கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: மறுமொழியாக … என்று கேட்டார்
  rationale: இது பேச்சை அறிமுகப்படுத்தும் வழக்கமான கிரேக்கக் கதைநடைச் சொற்றொடர். தமிழில் இயல்பாக இருக்கவும், இயேசு அவர்களுக்குப் பதிலளித்தார் என்ற தொடர்பைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ஒரு கொள்ளைக்காரனைப் பிடிக்க வருவதுபோல
  rationale: ஆயுதமேந்தியவர்கள் ஆபத்தான குற்றவாளியைப் பிடிக்கச் செல்வதுபோல் இயேசுவை நடத்தினார்கள் என்ற ஒப்பீட்டின் வலிமையை இது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: λῃστὴν
  choice: கொள்ளைக்காரனை
  rationale: பொதுவான வாசகருக்கு நேரடியாகப் புரியும் சொல். கிரேக்கச் சொல் ஆயுதமேந்திய கொள்ளைக்காரன் அல்லது கிளர்ச்சியாளன் போன்ற பரந்த பொருளையும் கொள்ளக்கூடும் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐξήλθατε
  choice: வந்தீர்களா
  rationale: இயேசு இருந்த இடத்தை நோக்கி அவர்கள் ஆயுதங்களுடன் வந்த நிகழ்வை இயல்பான தமிழில் குறிக்கிறது; வினாவின் சொல்லாட்சியுடன் ‘பிடிக்க வருவதுபோல’ என்ற அமைப்பு புறப்பட்டு வந்த கருத்தையும் தருகிறது.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: வாள்களோடும் தடிகளோடும்
  rationale: μάχαιρα இச்சூழலில் வாள் அல்லது பெரிய கத்தியையும், ξύλον மரத்தால் செய்யப்பட்ட தாக்குதல் கருவியையும் குறிக்கிறது. ‘வாள்கள்’, ‘தடிகள்’ என்பவை கைது நிகழ்வின் ஆயுதச் சூழலை இயல்பாகத் தெரிவிக்கின்றன.
- source_word: συλλαβεῖν με
  choice: என்னைக் கைதுசெய்ய
  rationale: இங்கு நோக்கம் இயேசுவைப் பிடித்துக் காவலில் கொண்டுசெல்வது என்பதால், பொதுவான ‘பிடிக்க’ என்பதைவிட சட்டரீதியான சூழலை ‘கைதுசெய்ய’ துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: λῃστής என்ற சொல்லின் வரலாற்று மற்றும் கருத்தியல் பரப்பு
  choice: முதன்மை உரையில் ‘கொள்ளைக்காரன்’; பரந்த பொருள் அடிக்குறிப்பில்
  alternative: ஆயுதக் கொள்ளைக்காரன், சட்டத்துக்குப் புறம்பானவன், அல்லது கிளர்ச்சியாளன்
  rationale: இயேசு தம்மீது சுமத்தப்பட்ட ஒரு குறிப்பிட்ட அரசியல் குற்றச்சாட்டை ஏற்றுக்கொண்டார் என்று உரை நேரடியாகச் சொல்லவில்லை. அதேவேளை, λῃστής என்பது சாதாரண திருடனைவிட வன்முறையுள்ள கொள்ளைக்காரனையோ கிளர்ச்சியாளனையோ குறிக்கக்கூடும். முதன்மை உரை வாசிப்புக்கு இயல்பாக வைக்கப்பட்டு, இந்த உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ‘பதிலளித்து கூறினார்’ என்ற இரட்டைச் சொல்லாட்சியை சொற்சொல்லாகக் கடினப்படுத்தாமல் ‘மறுமொழியாக … என்று கேட்டார்’ என இயல்பாக்கியுள்ளோம். ‘வாள்களோடும் தடிகளோடும்’ என்பது உரையின் செறிவையும் வாய்மொழி ஓசையையும் பாதுகாக்கிறது.
