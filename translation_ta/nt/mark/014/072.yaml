source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: ta
  text: உடனே சேவல் இரண்டாவது முறையாகக் கூவியது. அப்போது பேதுரு, “சேவல் இருமுறை கூவுவதற்கு முன் நீ என்னை மும்முறை மறுதலிப்பாய்” என்று இயேசு தன்னிடம் சொன்னதை நினைவுகூர்ந்தார். அவர் மனமுடைந்து[a] அழுதார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதை நினைத்தபோது அவர் அழுதார்” என்றும் பொருள் கொள்ளலாம். ἐπιβαλών என்ற கிரேக்கச் சொல் இங்கு பொருள் காண்பதற்குக் கடினமானது; அது உள்ளத்தில் திரும்பிச் சிந்தித்ததையோ, வெளிப்புற உடல் அசைவொன்றையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரைக்கே உரிய உடனடித் தன்மையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἐκ δευτέρου
  choice: இரண்டாவது முறையாக
  rationale: நிகழ்வு மீண்டும் நடந்தது என்பதோடு, அது குறிப்பாக இரண்டாம் முறை என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: சேவல் கூவியது
  rationale: சேவலின் குரலைக் குறிக்கும் இயல்பான தமிழ் சொல்லாட்சி.
- source_word: ἀνεμνήσθη ... τὸ ῥῆμα
  choice: சொன்னதை நினைவுகூர்ந்தார்
  rationale: ῥῆμα என்பதைக் கடினமான ‘வார்த்தை’ எனத் தனியே விடாமல், தொடரும் மேற்கோளுடன் இயல்பாக இணைக்கிறது; நினைவுக்கு வந்த செயலைத் தெளிவாகத் தருகிறது.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: சேவல் இருமுறை கூவுவதற்கு முன்
  rationale: πρίν மற்றும் இறந்தகாலமற்ற வினையெச்சக் கட்டமைப்பின் காலத் தொடர்பையும் δὶς என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τρίς με ἀπαρνήσῃ
  choice: நீ என்னை மும்முறை மறுதலிப்பாய்
  rationale: ἀπαρνέομαι என்பதன் மறுத்தல்/தொடர்பை ஏற்காதிருத்தல் என்ற வலிமையை வேதாகமச் சூழலுக்கு ஏற்ற, புரியக்கூடிய தமிழில் தருகிறது.
- source_word: ἐπιβαλών
  choice: மனமுடைந்து
  rationale: தெளிவுபடுத்தக் கடினமான இப்பங்கேற்புச் சொல்லை, குறிப்பிட்ட உடல் அசைவைத் திணிக்காமல் உணர்ச்சி முறிவாக இயல்பாக வழங்குகிறது; வேறு புரிதல்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: ἔκλαιεν
  choice: அழுதார்
  rationale: தொடர்ச்சியைக் காட்டும் இறந்தகால வடிவத்தை தமிழ் கதைநடையில் எளிமையாகவும் கண்ணியமாகவும் வழங்குகிறது.
theological_decisions:
- issue: ἐπιβαλών என்பதன் தெளிவற்ற பொருள் மற்றும் பேதுருவின் எதிர்வினை
  choice: “மனமுடைந்து” என்று உணர்ச்சி முறிவைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: “அதை நினைத்தபோது”; அல்லது தலை/முகத்தை மூடுதல் போன்ற வெளிப்புற உடல் அசைவைக் குறிக்கும் புரிதல்கள்.
  rationale: கிரேக்கம் எந்த ஒரு விளக்கத்தையும் உறுதியாகத் தீர்மானிக்கவில்லை. முதன்மை உரை நிகழ்ச்சியின் உணர்ச்சி வலிமையை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் தெளிவின்மையை வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மும்முறை’, ‘மறுதலிப்பாய்’ ஆகியவை சூழலின் தீவிரத்தைக் காக்கும் இலக்கியத் தன்மை கொண்டாலும் பரவலாகப் புரியக்கூடியவை. மரியாதைப் பன்மை வினைமுற்றுகள் பேதுரைக் குறிக்கும் கதைநடையில் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன.
