  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: ta
  text: அவர் மீண்டும் வந்து, அவர்கள் தூங்கிக்கொண்டிருப்பதைக் கண்டார்; ஏனெனில் அவர்களுடைய கண்கள் கனத்திருந்தன[a]. அவருக்கு என்ன பதில் சொல்வது என்று அவர்களுக்குத் தெரியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கண்கள் பாரமாயிருந்தன.” கிரேக்கத்தில், தூக்கத்தால் அவர்களுடைய கண்கள் பாரத்தால் அழுத்தப்பட்டன என்ற உருவகம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: நிகழ்ச்சி திரும்ப நடைபெறுவதை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: ἐλθὼν
  choice: வந்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கும் இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: அவர்கள் தூங்கிக்கொண்டிருப்பதைக் கண்டார்
  rationale: καθεύδοντας குறிக்கும் தொடர்ந்துகொண்டிருந்த செயலைத் தமிழின் ‘தூங்கிக்கொண்டிருப்பது’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: ஏனெனில், அவர்களுடைய கண்கள் கனத்திருந்தன
  rationale: அவர்கள் தூங்கியதற்கான காரணத்தைத் தெரிவிப்பதோடு, கண்கள் பாரத்தால் கீழே இழுக்கப்படுவது போன்ற கிரேக்க உருவகத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: οὐκ ᾔδεισαν
  choice: அவர்களுக்குத் தெரியவில்லை
  rationale: இங்கு அறிவின்மையைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: அவருக்கு என்ன பதில் சொல்வது என்று
  rationale: இயேசுவை நோக்கிய பதிலைக் குறிக்கும் மறைமுக வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
