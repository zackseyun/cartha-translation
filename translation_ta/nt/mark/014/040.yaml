translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கண்கள் கனத்திருந்தன’ என்பது இயல்பான தமிழ் வழக்கையும் மூலத்தின் உருவகத்தையும் இணைக்கிறது; அதன் நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
