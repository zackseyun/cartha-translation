source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: ta
  text: 'இயேசு அவனிடம் சொல்கிறார்: “உண்மையாகவே உனக்குச் சொல்கிறேன்: இன்று, இந்த இரவிலேயே, சேவல் இருமுறை கூவுவதற்குமுன்[a] நீ என்னை மூன்றுமுறை மறுதலிப்பாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “சேவல் இருமுறை குரல் எழுப்புவதற்குமுன்.”'
    reason: ‘கூவுதல்’ என்பது சேவலின் குரலைக் குறிக்கும் இயல்பான தமிழ் வழக்கு. ‘குரல் எழுப்புதல்’ என்பது பொருளை மாற்றாத சாத்தியமான மாற்றுச் சொல்லாக்கம்; இது அதிகச் சொல்லுக்கு நெருக்கமானது என்று உரிமை கோரப்படவில்லை.
lexical_decisions:
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மாற்குவின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, நிகழ்வின் உயிரோட்டத்தை வெளிப்படுத்த நிகழ்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Ἀμὴν λέγω σοι
  choice: உண்மையாகவே உனக்குச் சொல்கிறேன்
  rationale: இங்கு Ἀμήν என்பது இயேசுவின் கூற்றை உறுதிப்படுத்தும் solemn affirmation; நவீன தமிழில் அதன் வலிமையை இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃
  choice: இன்று, இந்த இரவிலேயே
  rationale: கிரேக்கத்தில் உள்ள இரு காலக் குறிப்புகளையும் விடாமல் வைத்து, -ஏ விகுதியால் குறிப்பிட்ட இந்த இரவின் வலியுறுத்தல் வெளிப்படுத்தப்பட்டது.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: சேவல் இருமுறை கூவுவதற்கு
  rationale: சேவலின் குரலைத் தமிழில் இயல்பாகக் குறிக்கும் ‘கூவு’ பயன்படுத்தப்பட்டு, மாற்குவுக்குச் சிறப்பான ‘இருமுறை’ என்பதும் துல்லியமாகப் பாதுகாக்கப்பட்டது.
- source_word: τρίς ⸂με ἀπαρνήσῃ⸃
  choice: நீ என்னை மூன்றுமுறை மறுதலிப்பாய்
  rationale: ἀπαρνέομαι என்பதன் மறுத்தல் அல்லது தன்னுடன் தொடர்பில்லை எனக் கூறுதல் என்ற வலிமையை ‘மறுதலித்தல்’ காக்கிறது; எண்ணிக்கையும் வெளிப்படையான σὺ என்பதும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டன.
theological_decisions:
- issue: σήμερον மற்றும் ταύτῃ τῇ νυκτί ஆகிய இரு காலக் குறிப்புகளின் தொடர்பு
  choice: ‘இன்று, இந்த இரவிலேயே’ என்று இரண்டையும் தக்கவைத்தல்
  alternative: ‘இந்த இரவிலேயே’ என்று ஒன்றிணைத்தல்
  rationale: மூலத்தில் இரண்டும் இருப்பதால், மறுப்பு மிக விரைவில் நிகழும் என்ற கூற்றின் தீவிரத்தை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
- issue: மாற்குவின் வரலாற்று நிகழ்காலம்
  choice: ‘இயேசு ... சொல்கிறார்’ என்ற நிகழ்காலம்
  alternative: ‘இயேசு ... சொன்னார்’ என்ற இறந்தகாலம்
  rationale: λέγει என்ற மூல நிகழ்காலத்தைத் தக்கவைத்து மாற்குவின் கதைசொல்லல் பாணியை வெளிப்படுத்துகிறது.
- issue: με ἀπαρνήσῃ என்பதன் பொருள்
  choice: ‘என்னை ... மறுதலிப்பாய்’
  alternative: ‘என்னைத் தெரியாது என்று மறுப்பாய்’
  rationale: மாற்றுச் சொற்றொடர் சூழலில் பொருத்தமான விளக்கமாக இருந்தாலும், மூலத்தில் நேரடியாக இல்லாத ‘தெரியாது’ என்பதைச் சேர்க்காமல் வினையின் பரந்த பொருளையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதவாக்கியத்துக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘மறுதலிப்பாய்’ சிறிது இலக்கியத் தன்மை கொண்டிருந்தாலும் சூழலின் தீவிரத்தையும் மூல வினையின் பொருள் பரப்பையும் தெளிவாகக் காக்கிறது.
