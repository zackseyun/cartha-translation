id: MRK.14.47
reference: Mark 14:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: ta
  text: ஆனால் அருகே நின்றுகொண்டிருந்தவர்களில் ஒருவர் தன் வாளை உருவி, தலைமைக் குருவின் அடிமையை[a]த் தாக்கி, அவனுடைய காதை வெட்டி அகற்றிவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளனை.” கிரேக்கச் சொல் அடிமை அல்லது கட்டுப்பட்ட பணியாள் நிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: ஆனால் ... ஒருவர்
  rationale: δέ என்பதன் மென்மையான எதிர்மறைத் தொடர்ச்சியை ‘ஆனால்’ காட்டுகிறது; εἷς ... τις சுட்டும் பெயர் குறிப்பிடப்படாத ஒருவரை ‘ஒருவர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν παρεστηκότων
  choice: அருகே நின்றுகொண்டிருந்தவர்களில்
  rationale: παρίστημι என்பதன் இடஞ்சார்ந்த பொருளையும் அங்கே நின்றிருந்த குழுவிலிருந்து ஒருவர் என்ற பகுதியுறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: தன் வாளை உருவி
  rationale: ஆயுதத்தை உறையிலிருந்து எடுத்தல் என்ற சூழல்சார் பொருளுக்கு ‘வாளை உருவி’ என்பது இயல்பான, செறிவான தமிழ்; கிரேக்க இறந்தகால வினையெச்சத்தின் செயல்வரிசையையும் காக்கிறது.
- source_word: ἔπαισεν
  choice: தாக்கி
  rationale: வன்மையான அடியைச் சுட்டும் παίω என்பதற்கு இச்சூழலில் ‘தாக்கி’ தெளிவான நவீனத் தமிழ்.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: தலைமைக் குருவின் அடிமையை
  rationale: δοῦλος குறிக்கும் கட்டுப்பட்ட சமூக நிலையைக் ‘அடிமை’ நேரடியாகப் பாதுகாக்கிறது; ἀρχιερεύς என்பதற்கு வழக்கமான ‘தலைமைக் குரு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: அவனுடைய காதை வெட்டிவிட்டார்
  rationale: ἀφαιρέω அடிப்படையில் ‘அகற்றுதல்’ என்றாலும், வாளால் தாக்கப்பட்ட இச்சூழலில் ‘வெட்டிவிட்டார்’ முடிவை இயல்பாகத் தெரிவிக்கிறது. ὠτάριον என்பதன் இலக்கணச் சிறுமை வடிவைத் தமிழில் தேவையின்றி ‘சிறிய காது’ என மொழிபெயர்க்கவில்லை.
theological_decisions:
- issue: δοῦλος என்ற சமூகநிலைச் சொல்லின் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாள் / வேலைக்காரன்
  rationale: இச்சொல் வெறும் சேவைச் செயலைவிட உரிமை மற்றும் கீழ்ப்படிதல் சார்ந்த நிலையைக் குறிக்கக்கூடும். ஆகவே வரலாற்றுச் சமூக உண்மையை மென்மைப்படுத்தாமல் ‘அடிமை’ என முதன்மை உரையில் தரப்பட்டுள்ளது; ‘பணியாள்’ அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர் குறிப்பிடப்படாத நபருக்கு ‘ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது; இணை நற்செய்திகளிலுள்ள நபரின் அடையாளமோ ‘வலது காது’ என்ற விவரமோ இங்கு சேர்க்கப்படவில்லை.
