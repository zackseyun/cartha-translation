revisions:
- from: ஆனால் அருகே நின்றுகொண்டிருந்தவர்களில் ஒருவர் தன் வாளை உருவி, தலைமைக் குருவின் அடிமையை[a]த் தாக்கி, அவனுடைய காதை வெட்டிவிட்டார்.
  to: ஆனால் அருகே நின்றுகொண்டிருந்தவர்களில் ஒருவர் தன் வாளை உருவி, தலைமைக் குருவின் அடிமையை[a]த் தாக்கி, அவனுடைய காதை வெட்டி அகற்றிவிட்டார்.
