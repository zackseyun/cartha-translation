revisions:
- from: விழித்திருந்து மன்றாடுங்கள்[a]; நீங்கள் சோதனைக்குள் நுழையாதபடி இப்படிச் செய்யுங்கள். உள்ளம் ஆயத்தமாக இருக்கிறது; ஆனால் உடல் பலவீனமாக இருக்கிறது.
  to: சோதனைக்குள் நுழையாதபடி விழித்திருந்து ஜெபியுங்கள்[a]. உள்ளம் விருப்பமாயிருக்கிறது; ஆனால் உடல் பலவீனமாயிருக்கிறது.
  rationale: The revision removes an added imperative, restores the purpose relationship directly, moves the lexical-alternative marker to its proper anchor, and renders πρόθυμον as inward willingness rather than only preparedness. It preserves the contextual, non-doctrinal contrast between human inward disposition and bodily weakness.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:14:04Z'
review_pass:
  verdict: revise
  source_fidelity: The two plural present imperatives and the purpose clause are represented, but “இப்படிச் செய்யுங்கள்” adds an unnecessary command not present in the Greek. The rendering “ஆயத்தமாக” weakens πρόθυμον (“willing/eager”) toward mere readiness. The footnote marker is attached to “மன்றாடுங்கள்,” though its note concerns πειρασμόν.
  naturalness: The revised wording is concise, dignified modern standard Tamil, and places the purpose clause naturally with the two commands.
  terminology: “ஜெபியுங்கள்” is the more neutral, standard term for προσεύχεσθε here. “உள்ளம்” and “உடல்” appropriately communicate the human inward willingness and bodily frailty in this context without identifying πνεῦμα as the Holy Spirit or reading a developed doctrinal sense into σάρξ. “சோதனை” retains the source term’s semantic breadth, supported by a correctly anchored footnote.
  issues:
  - severity: medium
    issue: The clause “இப்படிச் செய்யுங்கள்” is an addition.
    rationale: The Greek says “stay awake and pray, so that you may not enter into testing/temptation”; it does not separately say “do this.” Reordering the Tamil removes the addition while retaining the purpose relationship.
  - severity: medium
    issue: The footnote anchor is attached to the word for prayer rather than to “சோதனை.”
    rationale: The footnote explains πειρασμόν, so its marker must immediately follow the Tamil rendering of that term.
  - severity: low
    issue: “ஆயத்தமாக இருக்கிறது” does not fully express πρόθυμον.
    rationale: πρόθυμον denotes willingness, eagerness, or readiness. “விருப்பமாயிருக்கிறது” more directly preserves the contrast between inward intention and bodily weakness.
  revised_text: சோதனைக்குள் நுழையாதபடி விழித்திருந்து ஜெபியுங்கள்[a]. உள்ளம் விருப்பமாயிருக்கிறது; ஆனால் உடல் பலவீனமாயிருக்கிறது.
  revised_footnotes:
  - marker: a
    text: “சோதனை” என்பதற்கு “தீமைக்கான தூண்டுதல்” அல்லது “பரீட்சை” என்றும் பொருள் கொள்ளலாம் (πειρασμόν).
    reason: lexical_alternative
  revision_rationale: The revision removes an added imperative, restores the purpose relationship directly, moves the lexical-alternative marker to its proper anchor, and renders πρόθυμον as inward willingness rather than only preparedness. It preserves the contextual, non-doctrinal contrast between human inward disposition and bodily weakness.
