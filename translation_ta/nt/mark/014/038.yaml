  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ta
  text: சோதனைக்குள் நுழையாதபடி விழித்திருந்து ஜெபியுங்கள்[a]. உள்ளம் விருப்பமாயிருக்கிறது; ஆனால் உடல் பலவீனமாயிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதனை” என்பதற்கு “தீமைக்கான தூண்டுதல்” அல்லது “பரீட்சை” என்றும் பொருள் கொள்ளலாம் (πειρασμόν).
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: விழித்திருங்கள்
  rationale: பன்மை ஏவல் வடிவம்; கெத்செமனே சூழலில் தூங்காமல் விழித்திருப்பதையும் எச்சரிக்கையுடன் இருப்பதையும் இயல்பாக உணர்த்துகிறது.
- source_word: προσεύχεσθε
  choice: மன்றாடுங்கள்
  rationale: தொடர்ந்து கடவுளிடம் வேண்டுதல் செய்யும் ஏவலை இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: நீங்கள் சோதனைக்குள் நுழையாதபடி
  rationale: ἵνα μή உடன் வரும் நோக்கம் அல்லது தடுப்பு நுணுக்கத்தையும், εἰς உடன் உள்ள ‘உள்ளே நுழைதல்’ உருவகத்தையும் காக்கிறது.
- source_word: πειρασμόν
  choice: சோதனை
  rationale: இச்சொல் தூண்டுதல், பரீட்சை, நெருக்கடியான சோதனை ஆகிய பொருள்களை ஏற்கக்கூடியது. ‘சோதனை’ அந்தப் பொருள் அகலத்தைத் தமிழில் ஓரளவு காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: உள்ளம் ஆயத்தமாக இருக்கிறது
  rationale: இங்கு πνεῦμα பரிசுத்த ஆவியைக் காட்டிலும் மனிதனின் அகநிலை அல்லது மனவிருப்பத்தைக் குறிப்பதாகச் சூழல் காட்டுகிறது. ‘உள்ளம்’ தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது; πρόθυμον என்பதன் தயார்நிலை மற்றும் விருப்பம் ஆகிய நுணுக்கங்களை ‘ஆயத்தமாக’ காக்கிறது.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: ஆனால் உடல் பலவீனமாக இருக்கிறது
  rationale: இந்தச் சூழலில் σάρξ பாவ இயல்பு என்ற தனிப்பட்ட கோட்பாட்டுச் சொல்லைவிட மனித உடல் சார்ந்த பலவீனத்தைக் குறிக்கிறது. நவீன தமிழில் ‘உடல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ἀσθενής என்பதற்கு ‘பலவீனம்’ நேரான இணை.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: மனிதனின் உள்ளம் அல்லது அகநிலை
  alternative: பரிசுத்த ஆவி
  rationale: தூக்கத்தால் தோல்வியுற்ற சீடர்களிடம் பேசும் உடனடிச் சூழலும் σάρξ உடனான எதிர்மறை இணையும் மனிதரின் நல்ல நோக்கம் அல்லது அகமனத்தையே சுட்டுகின்றன. பரிசுத்த ஆவி என்று மொழிபெயர்ப்பது உரை கோராத விளக்கத்தைச் சேர்க்கும்.
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: உடல்
  alternative: மாம்சம்; பாவ இயல்பு
  rationale: இங்கு கருத்து குறிப்பாகப் பாவ இயல்பைப் பற்றியதல்ல; சீடர்களின் உடல் சார்ந்த மனிதப் பலவீனத்தைப் பற்றியது. ‘மாம்சம்’ மூல உருவகத்தை நெருக்கமாகக் காத்தாலும் சாதாரண நவீன தமிழில் தெளிவற்றதாக இருக்கலாம்; ‘பாவ இயல்பு’ அளவுக்கு மீறிய கோட்பாட்டு விளக்கமாகிவிடும்.
- issue: πειρασμός என்பதன் பொருள் அகலம்
  choice: சோதனை
  alternative: தூண்டுதல்; பரீட்சை
  rationale: மூலச் சொல் தீமைக்கான தூண்டுதலையும் நம்பிக்கையைப் பரிசோதிக்கும் நெருக்கடியையும் குறிக்க முடியும். முதன்மை உரையில் ‘சோதனை’ என வைத்து, உண்மையான சொற்பொருள் தெளிவின்மையை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. கிரேக்கத்தின் பன்மை ஏவல்கள் தமிழில் மரியாதைப் பன்மை வடிவில் தரப்பட்டுள்ளன. மூலத்தின் சுருக்கமான மாறுபாட்டை இயல்பாக்க சிறிய வினைச்சொற்கள் சேர்க்கப்பட்டுள்ளன; ஆனால் பொருள் விரிவாக்கப்படவில்லை.
