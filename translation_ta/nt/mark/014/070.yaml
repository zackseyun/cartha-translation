translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பையும் வேதாகம உரைக்குரிய கண்ணியத்தையும் இணைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேதுரு,’ ‘கலிலேயன்’ ஆகிய நிலையான பெயர்வடிவங்கள் பின்பற்றப்பட்டுள்ளன. தொடர்ச்சியை உணர்த்த ‘நின்றுகொண்டிருந்தவர்கள்,’ ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்ற வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
