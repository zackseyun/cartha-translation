  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: ta
  text: ஆனால் அவன் மறுபடியும் மறுத்தான். சிறிது நேரத்திற்குப் பின், அருகில் நின்றுகொண்டிருந்தவர்கள் மீண்டும் பேதுருவிடம், “நிச்சயமாக நீ அவர்களில் ஒருவன்; ஏனெனில் நீயும் கலிலேயன், உன் பேச்சும்[b] அதுபோலவே இருக்கிறது[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘உன் பேச்சும் அதுபோலவே இருக்கிறது’ என்ற சொற்றொடர் இல்லை.
    reason: textual_variant
  - marker: b
    text: ‘உன் பேச்சு’ என்பது ‘உன் பேச்சுமுறை,’ ‘உன் வட்டார வழக்கு’ அல்லது ‘உன் உச்சரிப்பு’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: மறுபடியும் மறுத்தான்
  rationale: முற்றுப்பெறாத இறந்தகால வினைச்சொல் தொடர்ச்சியான அல்லது மீண்டும் நிகழ்ந்த மறுப்பைக் குறிக்கலாம். சூழலில் உள்ள குற்றச்சாட்டே மறுக்கப்பட்ட பொருள் என்பதால், தமிழில் இயல்பாக மறைபொருளாக விடப்பட்டது.
- source_word: μετὰ μικρὸν
  choice: சிறிது நேரத்திற்குப் பின்
  rationale: குறுகிய கால இடைவெளிக்குப் பிறகு என்பதைக் கூறும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: οἱ παρεστῶτες
  choice: அருகில் நின்றுகொண்டிருந்தவர்கள்
  rationale: அங்கு அருகில் நின்றிருந்தவர்களைக் குறிக்கும் இடவியல் நுணுக்கத்தையும் பங்கேற்பின் தொடர்நிலையையும் காக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்ச்சியான அல்லது மீள்மீளான பேச்சுச் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: Ἀληθῶς
  choice: நிச்சயமாக
  rationale: பேசுகிறவர்களின் உறுதியான வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: ἐξ αὐτῶν εἶ
  choice: நீ அவர்களில் ஒருவன்
  rationale: இயேசுவோடு தொடர்புடைய குழுவைச் சேர்ந்தவன் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καὶ γὰρ
  choice: ஏனென்றால் நீயும்
  rationale: γάρ தரும் காரண உறவையும் καί தரும் ‘நீயும்’ என்ற சேர்க்கை வலியுறுத்தலையும் காக்கிறது.
- source_word: Γαλιλαῖος
  choice: கலிலேயன்தான்
  rationale: கலிலேயாவைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; ‘தான்’ அவர்கள் கூறும் அடையாளக் காரணத்தின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ λαλιά σου
  choice: உன் பேச்சு
  rationale: பேச்சுமுறை, வட்டார வழக்கு அல்லது உச்சரிப்பு ஆகியவற்றைக் குறிக்கக்கூடிய சொல்லின் பரந்த பொருள் வரம்பை உடனே ஒரே பொருளாகக் குறுக்காமல் காக்கிறது.
- source_word: ὁμοιάζει
  choice: அவர்களுடைய பேச்சைப் போல இருக்கிறது
  rationale: ‘ஒத்திருக்கிறது’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. ஒப்பிடப்படும் பொருள் கிரேக்கத்தில் வெளிப்படையாக இல்லை; சூழல் சுட்டும் கலிலேயக் குழுவின் பேச்சு தமிழில் வாசிப்புத் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
