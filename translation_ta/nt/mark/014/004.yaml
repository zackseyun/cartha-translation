  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: ta
  text: ஆனால் சிலர் தங்களுக்குள்[a] சினந்துகொண்டு, “இந்த நறுமணத் தைலம்[b] ஏன் இப்படி வீணாக்கப்பட்டது?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவரோடு ஒருவர்” அல்லது “தங்களுக்குள்ளேயே.” கிரேக்கத் தொடர், அந்தக் குழுவுக்குள் ஒருவரிடம் ஒருவர் குறைகூறியதையோ ஒவ்வொருவரின் உள்ளார்ந்த எதிர்வினையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நறுமணக் களிம்பு.” கிரேக்கச் சொல் மணமுள்ள எண்ணெயையோ களிம்பையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ஆனால் ...
  rationale: δέ இங்கு நிகழ்வைத் தொடர்ந்து சொல்லுவதோடு, அந்தப் பெண்ணின் செயலுக்கும் சிலரின் எதிர்வினைக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀγανακτοῦντες
  choice: கோபமடைந்து
  rationale: இந்த வினைச்சொல் வெறும் வருத்தத்தைவிட வலுவான அதிருப்தியையும் கோபத்தையும் குறிக்கிறது; நவீன தமிழில் இயல்பாகப் புரியும் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: πρὸς ἑαυτούς
  choice: தங்களுக்குள்
  rationale: குழுவினரிடையே பரிமாறப்பட்ட குறையையோ அவர்களுக்குள்ளான எதிர்வினையையோ குறிக்கக்கூடிய கிரேக்கத் தொடரின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: Εἰς τί
  choice: ஏன்
  rationale: நோக்கம் அல்லது விளைவை வினவும் இத்தொடருக்கான இயல்பான தமிழ் கேள்விவடிவம்.
- source_word: ἡ ἀπώλεια αὕτη
  choice: இப்படி வீணாக்கப்பட்டது
  rationale: ἀπώλεια என்பது இச்சூழலில் இழப்பு அல்லது அழிவைவிட, விலையுயர்ந்த பொருள் பயனின்றிச் செலவிடப்பட்டதாகப் பேசுவோரின் மதிப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: τοῦ μύρου
  choice: இந்த நறுமணத் தைலம்
  rationale: μύρον என்பது மணமுள்ள எண்ணெய் அல்லது களிம்பைக் குறிக்கிறது; ‘நறுமணத் தைலம்’ பொருளையும் இச்சூழலின் மதிப்புமிக்க மணப்பொருளையும் தெளிவாகச் சொல்கிறது.
- source_word: γέγονεν
  choice: வீணாக்கப்பட்டது
  rationale: முடிந்து தற்போதும் தொடர்புடையதாக நிற்கும் நிகழ்வை, தமிழில் இயல்பான கேள்வியாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் உள்ள ‘நிகழ்ந்துள்ளது’ என்ற கருத்து சூழலுக்கேற்ற செயப்பாட்டு வடிவில் தரப்படுகிறது.
