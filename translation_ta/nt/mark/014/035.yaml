source:
  edition: SBLGNT
  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: ta
  text: அவர் சற்றுத் தொலைவு சென்று[a], தரையில் விழுந்து, முடியுமானால், அந்த வேளை தம்மைவிட்டு கடந்துபோகும்படி வேண்டிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சற்று முன்னே சென்று.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: சற்றுத் தூரம் அப்பால் சென்று
  rationale: மற்றவர்களிடமிருந்து சிறிது தூரம் முன்னோக்கிச் சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இயக்கத்தையும் குறுகிய தூரத்தையும் காக்கிறது.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: தரையில் விழுந்து
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை இங்கு நிகழ்வை வருணிக்கும் அல்லது தொடக்கநிலையைக் குறிக்கும் வகையில் உள்ளது; தமிழில் ‘தரையில் விழுந்து’ என்பது இயக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: προσηύχετο
  choice: வேண்டிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்வினையின் நீடித்த செயற்பாங்கை ‘கொண்டிருந்தார்’ காக்கிறது; சூழலில் இது கடவுளிடம் செய்த மன்றாட்டைக் குறிக்கிறது.
- source_word: ἵνα
  choice: …படி
  rationale: வேண்டுதலின் உள்ளடக்கத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; நோக்கப் பொருளைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: εἰ δυνατόν ἐστιν
  choice: முடியுமானால்
  rationale: சாத்தியத்தின் நிபந்தனையையும் மன்றாட்டின் தயக்கமிக்க நுணுக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: அந்த வேளை தம்மைவிட்டு கடந்துபோகும்படி
  rationale: παρέρχομαι என்பதன் ‘கடந்துபோ’ என்ற உருவகத்தைத் தக்கவைக்கிறது. ‘வேளை’ என்பது நியமிக்கப்பட்ட துன்ப நேரத்தைக் குறிக்கும் மூல உரையின் செறிவான சொல்லாட்சியை விளக்கவுரையாக்காமல் காக்கிறது.
theological_decisions:
- issue: ‘ἡ ὥρα’ என்பதன் பொருள்
  choice: அந்த வேளை
  alternative: துன்பத்தின் நேரம் / மரண நேரம்
  rationale: இயேசுவின் வரவிருக்கும் துன்பத்தையும் மரணத்தையும் குறிக்கும் இறையியல் செறிவுள்ள உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; அது எதைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பிலேயே விளக்கி உரையின் பதற்றத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அதே நேரத்தில் கண்ணியமான வேதாகம நடையிலும் அமைக்கப்பட்டது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
