  to: அவர் சற்றுத் தொலைவு சென்று[a], தரையில் விழுந்து, முடியுமானால், அந்த வேளை தம்மைவிட்டு கடந்துபோகும்படி வேண்டிக்கொண்டிருந்தார்.
