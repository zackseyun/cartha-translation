source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: ta
  text: புளிப்பில்லாத அப்பப் பண்டிகையின் முதல் நாளில், பஸ்கா ஆட்டுக்குட்டியைப் பலியிட்டுக்கொண்டிருந்தபோது[a], அவருடைய சீடர்கள் அவரிடம், “நாங்கள் சென்று ஏற்பாடு செய்ய, நீர் பஸ்காவை உண்ண எங்கே விரும்புகிறீர்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பஸ்காவைப் பலியிட்டுக்கொண்டிருந்தபோது.” கிரேக்க மூலத்தில் “பஸ்கா” என்றே உள்ளது; இச்சூழலில் அது பலியிடப்பட்ட பஸ்கா ஆட்டுக்குட்டியைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: புளிப்பில்லாத அப்பப் பண்டிகையின் முதல் நாளில்
  rationale: தமிழில் இது ஒரு பண்டிகைக் காலத்தின் பெயர் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘பண்டிகை’ சேர்க்கப்பட்டுள்ளது; கிரேக்கத்தில் உள்ள காலக் குறிப்பின் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: பஸ்கா ஆட்டுக்குட்டியைப் பலியிட்டுக்கொண்டிருந்தபோது
  rationale: θύω என்பதுடன் வரும் πάσχα பலியிடப்படும் பஸ்கா ஆட்டுக்குட்டியைக் குறிக்கிறது. இறந்தகால imperfect வினையின் நடைபெற்றுக்கொண்டிருந்த தன்மையை ‘பலியிட்டுக்கொண்டிருந்தபோது’ வெளிப்படுத்துகிறது.
- source_word: λέγουσιν
  choice: கேட்டார்கள்
  rationale: வரலாற்று நிகழ்காலம் தமிழின் இயல்பான இறந்தகாலக் கதைநடையில் தரப்பட்டுள்ளது. தொடர்ந்து வரும் வாக்கியம் கேள்வியாக இருப்பதால் ‘சொன்னார்கள்’ என்பதைவிட ‘கேட்டார்கள்’ இயல்பானது.
- source_word: Ποῦ θέλεις
  choice: எங்கே ... வேண்டும் என்று விரும்புகிறீர்
  rationale: θέλω வெளிப்படுத்தும் விருப்பம் அல்லது எண்ணம் மொழிபெயர்ப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: நாங்கள் எங்கே போய் ஆயத்தம் செய்ய வேண்டும்
  rationale: பங்கேற்புவினை காட்டும் வரிசை ‘போய் ஆயத்தம் செய்ய’ என்று இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: நீர் பஸ்கா உணவைச் சாப்பிடுவதற்காக
  rationale: ἵνα காட்டும் நோக்கம் ‘சாப்பிடுவதற்காக’ எனத் தெளிவாக்கப்பட்டுள்ளது. இங்கு πάσχα பலியிடப்படும் விலங்கை அல்ல, பஸ்கா உணவைச் சுட்டுவதால் ‘உணவு’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஒரே வசனத்தில் இருமுறை வரும் πάσχα என்பதன் குறிப்பு
  choice: முதல் இடத்தில் ‘பஸ்கா ஆட்டுக்குட்டி’; இரண்டாம் இடத்தில் ‘பஸ்கா உணவு’
  alternative: இரண்டு இடங்களிலும் ‘பஸ்கா’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: முதல் இடத்தில் ‘பலியிடு’ என்ற வினை பலிக்குரிய ஆட்டுக்குட்டியைச் சுட்டுகிறது; இரண்டாம் இடத்தில் ‘சாப்பிடு’ என்ற வினை பஸ்கா உணவைச் சுட்டுகிறது. இந்த வேறுபாடு உடனடி சொற்சூழலைப் பின்பற்றுகிறது; ஒரு குறிப்பிட்ட இறையியல் நிலைப்பாட்டைத் திணிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் ‘நீர்/விரும்புகிறீர்’ என்ற மரியாதை ஒருமை கையாளப்பட்டுள்ளது.
