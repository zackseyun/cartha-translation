id: MRK.14.27
reference: Mark 14:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: ta
  text: இயேசு அவர்களிடம், “நீங்கள் எல்லாரும் என்னைவிட்டு விலகிப்போவீர்கள்[a]. ஏனெனில், ‘மேய்ப்பனை நான் அடிப்பேன்; ஆடுகள் சிதறிப்போகும்’ என்று எழுதப்பட்டுள்ளது” என்று கூறுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “நீங்கள் எல்லாரும் இடறுவீர்கள்” அல்லது “நீங்கள் எல்லாரும் இடறச் செய்யப்படுவீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தையும் கிரேக்க வினையின் நிகழ்கால வடிவத்தையும் இயன்றவரை பிரதிபலிக்கிறது.
- source_word: σκανδαλισθήσεσθε
  choice: என்னைவிட்டு விலகிப்போவீர்கள்
  rationale: சூழலில் சீடர்கள் இயேசுவைக் கைவிட்டுச் சிதறிப்போவதைக் குறிக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்கச் சொல்லின் ‘இடறுதல்’ என்ற உருவகமும் அதன் செயப்பாட்டு வடிவமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: வேதவாக்கை அறிமுகப்படுத்தும் நிறைவு செயப்பாட்டு சூத்திரத்தைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: Πατάξω
  choice: நான் அடிப்பேன்
  rationale: வினையின் வலிமையைப் பழமையான சொல்லாட்சி இன்றித் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ποιμένα
  choice: மேய்ப்பனை
  rationale: தீர்க்கதரிசன மேற்கோளிலுள்ள ஒருமை மேய்ப்பன் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὰ πρόβατα
  choice: ஆடுகள்
  rationale: மந்தையின் உருவகத்திற்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: διασκορπισθήσονται
  choice: சிதறிப்போகும்
  rationale: மேய்ப்பன் அடிக்கப்பட்டபின் மந்தை பிரிந்து போகும் காட்சியையும் எதிர்காலப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது; தமிழ் இலக்கணத்தின்படி அஃறிணைப் பன்மைக்கு ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: சீடர்களின் எதிர்வினையைச் சுட்டும் σκανδαλισθήσεσθε என்பதன் பொருள்
  choice: என்னைவிட்டு விலகிப்போவீர்கள்
  alternative: நீங்கள் எல்லாரும் இடறுவீர்கள் / இடறச் செய்யப்படுவீர்கள்
  rationale: உடனடி சூழலும் மேய்ப்பன் அடிக்கப்படும்போது ஆடுகள் சிதறும் என்ற மேற்கோளும் சீடர்களின் கைவிடுதலைச் சுட்டுகின்றன. அதேவேளை, கிரேக்கச் சொல்லின் உருவகத் தன்மையையும் செயப்பாட்டு வடிவத்தையும் அடிக்குறிப்பு மூலம் திறந்தவாறே வைத்திருக்கிறது; நிரந்தர விசுவாசத் துறப்பாக இதை மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ். மேற்கோளின் தீர்க்கதரிசன உருவகமும் மாற்குவின் வரலாற்று நிகழ்காலமும் பாதுகாக்கப்பட்டுள்ளன.
