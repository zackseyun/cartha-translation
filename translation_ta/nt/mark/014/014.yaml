source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: ta
  text: 'அவன் எங்கு நுழைந்தாலும், அந்த வீட்டுத் தலைவரிடம், ‘ஆசிரியர் சொல்கிறார்: “என் சீடர்களோடு நான் பஸ்காவை உண்ணக்கூடிய என் விருந்தினர் அறை[a] எங்கே?”’ என்று சொல்லுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்குமிடம்’ அல்லது ‘அறை’; கிரேக்கச் சொல் தங்குவதற்கான ஓர் இடத்தைக் குறிக்கிறது. இங்கு இது வணிக விடுதியைவிட ஒரு தனியார் வீட்டிலுள்ள விருந்தினர் அறையைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: அவர் எங்கே நுழைகிறாரோ, அங்கே
  rationale: ὅπου + ἐάν மற்றும் இறந்தகாலத் துணைவினை வடிவம் குறிப்பிட்டிராத இடத்தைக் குறிக்கிறது; தமிழில் ‘எங்கே…அங்கே’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: εἴπατε
  choice: சொல்லுங்கள்
  rationale: இது இரு சீடர்களை நோக்கிய பன்மை கட்டளை; நேரடிக் கூற்றை அறிமுகப்படுத்தும் விதமாக ‘சொல்லுங்கள்’ பொருத்தமானது.
- source_word: οἰκοδεσπότῃ
  choice: வீட்டுத் தலைவரிடம்
  rationale: வீட்டையும் குடும்பத்தையும் பொறுப்பாக நடத்துகிறவரைக் குறிக்கும் சொல்லின் சமூக அதிகாரப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Ὁ διδάσκαλος
  choice: போதகர்
  rationale: இங்கு இயேசுவைக் குறிக்கும் அறியப்பட்ட அழைப்புப்பெயராகப் பயன்படுத்தப்பட்டாலும், கிரேக்கச் சொல்லின் அடிப்படைப் பொருளான கற்பிப்பவரைத் தாண்டிய வேறு கிறிஸ்துவியல் பட்டத்தை இறக்குமதி செய்யாமல் மொழிபெயர்க்கிறது.
- source_word: κατάλυμά
  choice: விருந்தினர் அறை
  rationale: இச்சூழலில் வணிக விடுதியை அல்லாமல், தனியார் வீட்டில் தங்குவதற்கான அறையைக் குறிக்க வாய்ப்புள்ளதால் இந்தத் தேர்வு செய்யப்பட்டது; பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μου
  choice: என்
  rationale: SBLGNT உரையில் உள்ள உடைமைச் சுட்டை வெளிப்படையாகப் பாதுகாக்கிறது; இயேசுவுக்கும் அவருடைய குழுவுக்கும் ஒதுக்கப்பட்ட அல்லது உரிய அறை என்ற பொருள் இருக்கலாம்.
- source_word: τὸ πάσχα
  choice: பஸ்காவை
  rationale: இது பண்டிகையையோ அதற்குரிய உணவையோ குறிக்கலாம்; ‘உண்பது’ என்ற வினை இங்கு உணவு பங்கேற்பைச் சூழலிலேயே தெளிவாக்குவதால் கூடுதல் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: என் சீடர்களோடு
  rationale: இயேசுவைப் பின்பற்றிக் கற்றுக்கொள்கிறவர்களுடனான உறவையும் நற்செய்தி நூல்களின் வழக்கமான சொல்லாட்சியையும் ‘சீடர்கள்’ பாதுகாக்கிறது.
- source_word: φάγω
  choice: உண்பதற்கான
  rationale: தேடப்படும் அறையின் நோக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இதை எளிய எதிர்கால உறுதிப்பாடாக மாற்றவில்லை.
theological_decisions:
- issue: διδάσκαλος என்ற இயேசுவின் தன்னைக் குறிக்கும் அழைப்புப்பெயர்
  choice: போதகர்
  alternative: ஆசிரியர்; எஜமான்
  rationale: கிரேக்கச் சொல் முதன்மையாகக் கற்பிப்பவரைக் குறிக்கிறது. ‘போதகர்’ நற்செய்தி நூல் சூழலில் இயல்பாக இருந்து, ‘எஜமான்’ என்பதில் தோன்றக்கூடிய அதிகமான அதிகாரப் பொருளைச் சேர்க்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் உட்பொதிந்த நேரடிக் கூற்றும், ‘என்’ என்ற உடைமையும், அறையின் நோக்கத்தைக் குறிக்கும் தொடரும் பாதுகாக்கப்பட்டுள்ளன.
