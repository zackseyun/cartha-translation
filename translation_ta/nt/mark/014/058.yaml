source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: ta
  text: “நாங்கள் அவன், ‘கைகளால் செய்யப்பட்ட இந்த ஆலயத்தை நான் இடிப்பேன்; மூன்று நாட்களுக்குள் கைகளால் செய்யப்படாத வேறோர் ஆலயத்தைக் கட்டுவேன்’ என்று சொன்னதைக் கேட்டோம்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூன்று நாட்களுக்குள்” என்பதற்கு “மூன்று நாட்களில்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொற்றொடர், அந்தச் செயல் நிகழும் கால அளவை இயல்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: அதாவது
  rationale: இங்கு காரணத்தைக் குறிக்காமல், சாட்சிகள் கூறிய குற்றச்சாட்டின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: Ἡμεῖς
  choice: நாங்களே
  rationale: வெளிப்படையாக இடம்பெறும் வலியுறுத்தப்பட்ட பிரதிப்பெயரின் சுயசாட்சி வலிமையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: இவன் ... என்று சொன்னதை ... கேட்டோம்
  rationale: சாட்சி கூறுவோரின் பார்வையில் இயல்பான தமிழாகவும், அவன் சொல்வதை அவர்கள் கேட்டதாக உள்ள கிரேக்கக் கட்டமைப்பைத் துல்லியமாகவும் தருகிறது.
- source_word: καταλύσω
  choice: இடித்துவிட்டு
  rationale: கட்டடமான ஆலயத்தைத் தகர்ப்பதைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது; அடுத்த செயலை இணைக்கும் தமிழ் வினையெச்சம் தொடரின் இயல்பை மேம்படுத்துகிறது.
- source_word: ναὸν τοῦτον
  choice: இந்த ஆலயத்தை
  rationale: ναός என்பதன் ஆலயம்/திருக்கோவில் சார்ந்த பொருளையும் τοῦτον என்பதன் சுட்டுத்தன்மையையும் காக்கிறது.
- source_word: χειροποίητον
  choice: கைகளால் செய்யப்பட்ட
  rationale: ἀχειροποίητον என்பதுடனான திட்டமிட்ட சொல் எதிர்மறையை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: διὰ τριῶν ἡμερῶν
  choice: மூன்று நாட்களுக்குள்
  rationale: διά + genitive குறிக்கும் கால அளவின் எல்லைக்குள் நிகழும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘மூன்று நாட்களில்’ என்பதும் சாத்தியம்.
- source_word: ἄλλον
  choice: வேறொன்றை
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆலயத்திற்குப் பதிலாக இன்னொன்றைக் குறிக்கும் ἄλλος என்பதன் பொருளைக் காக்கிறது; தமிழில் ‘ஆலயம்’ அஃறிணையாக வருவதால் இவ்வடிவம் இயல்பு.
- source_word: ἀχειροποίητον
  choice: கைகளால் செய்யப்படாத
  rationale: χειροποίητον என்பதுடனான வடிவியல் மற்றும் கருத்தியல் எதிர்மறையை விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: οἰκοδομήσω
  choice: கட்டுவேன்
  rationale: ‘மீண்டும் கட்டுவேன்’ என்ற கூடுதல் கருத்தைச் சேர்க்காமல், கிரேக்க வினையின் நேரடிப் பொருளைத் தருகிறது.
theological_decisions:
- issue: இக்கூற்று இயேசுவின் சொற்களைப் பற்றிய பகைமைச் சாட்சிகளின் அறிக்கையா அல்லது உரையாசிரியரால் உறுதிப்படுத்தப்பட்ட மேற்கோளா
  choice: சாட்சிகள் கூறியதாக மேற்கோள் அமைப்பிலேயே தரப்பட்டது
  alternative: இது இயேசுவின் சொற்களைத் திரித்த குற்றச்சாட்டு என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: இந்த வசனம் சாட்சிகள் தாங்கள் கேட்டதாகக் கூறியதை மட்டுமே பதிவுசெய்கிறது; பிற பகுதிகளுடன் ஒத்திசைக்கும் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: கைகளால் செய்யப்பட்ட / செய்யப்படாத ஆலயத்தின் இறையியல் தொடர்பு
  choice: கிரேக்கச் சொல் எதிர்மறையை அப்படியே பாதுகாத்தல்
  alternative: ‘மனிதனால் ஆனது / கடவுளால் ஆனது’ என்று விளக்கமாக்கல்
  rationale: இந்த எதிர்மறைக்கு இறையியல் நுட்பம் இருக்கக்கூடும்; ஆனால் ‘கடவுளால்’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லை. ஆகவே பொருளை முன்கூட்டியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், நீதிமன்றச் சாட்சியின் நேரடி கூற்றுக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாங்களே’ என்பது Ἡμεῖς என்ற வலியுறுத்தலைக் காக்கிறது. ‘கைகளால் செய்யப்பட்ட / கைகளால் செய்யப்படாத’ என்ற இணை வடிவங்கள் கிரேக்க எதிர்மறையைத் தெளிவாகப் பாதுகாக்கின்றன.
