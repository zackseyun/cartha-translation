id: MRK.14.71
reference: Mark 14:71
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: ta
  text: ஆனால், அவன் சாபங்களை வரவழைக்கவும் சத்தியம் செய்யவும் தொடங்கி, “நீங்கள் பேசுகிற இந்த மனிதனை எனக்குத் தெரியாது!” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால் அவன்
  rationale: δέ இங்கு கதையின் தீவிரமடையும் போக்கில் மென்மையான முரண்பாட்டைக் குறிக்கிறது; ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἤρξατο
  choice: தொடங்கி
  rationale: துணை வினையெச்சங்களுடன் வரும் ἄρχω செயல் தொடங்கியதைச் சுட்டுகிறது; தமிழில் ‘தொடங்கி’ இயல்பான இணைப்பைத் தருகிறது.
- source_word: ἀναθεματίζειν
  choice: சாபங்களை வரவழைக்க
  rationale: இது வெறும் வசைபாடுதலை அல்ல, சாபத்தை வேண்டி அழைப்பதைக் குறிக்கிறது. சாபம் யார்மீது என்பதைக் கிரேக்கம் கூறாததால், அதைக் குறிப்பிட்டுச் சேர்க்கவில்லை.
- source_word: ὀμνύναι
  choice: ஆணையிட்டுச் சத்தியம் செய்ய
  rationale: ὀμνύναι என்பது உறுதிமொழியோடு சத்தியம் செய்வதைக் குறிக்கிறது; இவ்வுரை சாதாரணத் திட்டுச் சொல்லைக் குறிக்காதபடி இந்தச் சொற்றொடர் தெளிவுபடுத்துகிறது.
- source_word: ὅτι
  choice: நேரடிக் கூற்றாக மேற்கோள்
  rationale: ὅτι பேதுருவின் சத்தியத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேரடிக் கூற்று இயல்பானது.
- source_word: Οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: οἶδα என்பதன் அடிப்படைப் பொருள் ‘அறிதல்/தெரிந்திருத்தல்’; மறுதலையின் கூர்மையை ‘எனக்குத் தெரியாது’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: இந்த மனிதனை
  rationale: τοῦτον தரும் சுட்டுப்பொருளை ‘இந்த’ பாதுகாக்கிறது; இழிவான தொனியைத் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: ὃν λέγετε
  choice: நீங்கள் சொல்லுகிற
  rationale: சுற்றியிருந்தவர்கள் குறிப்பிட்டுப் பேசும் நபரை இது சுட்டுகிறது; நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: ἀναθεματίζειν என்பதில் சாபத்தின் இலக்கு
  choice: சாபங்களை வரவழைத்தான் என்று கூறி, சாபம் யார்மீது என்பதைத் திறந்தே வைத்தல்
  alternative: தன்ன்மீது சாபத்தை வரவழைத்தான்; அல்லது சபிக்கத் தொடங்கினான்
  rationale: சத்தியச் சூழலில் தன்னைச் சாபத்திற்குட்படுத்தும் பொருள் இருக்கக்கூடும். ஆனால் கிரேக்கத்தில் சாபத்தின் இலக்கு வெளிப்படையாகக் கூறப்படவில்லை; ஆகவே இயேசுவையோ பேதுருவையோ இலக்காக மொழிபெயர்ப்பு நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. ‘ஆணையிட்டுச் சத்தியம் செய்ய’ என்பது உறுதிமொழியின் வலிமையைத் தெளிவாக்குகிறது; அடிக்குறிப்பு ἀναθεματίζειν என்பதிலுள்ள உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
