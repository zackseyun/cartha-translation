    text: அல்லது, ‘சபிக்கவும்’; ஒருவேளை, ‘தன்மீது சாபத்தை வரவழைக்கவும்.’ சாபம் யார்மீது என்பதை கிரேக்க மூலவுரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
