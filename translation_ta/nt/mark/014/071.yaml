revisions:
- from: ஆனால் அவன் சாபங்களை வரவழைக்கவும் ஆணையிட்டுச் சத்தியம் செய்யவும் தொடங்கி[a], “நீங்கள் சொல்லுகிற இந்த மனிதனை எனக்குத் தெரியாது” என்றான்.
  to: ஆனால், அவன் சாபங்களை வரவழைக்கவும் சத்தியம் செய்யவும் தொடங்கி, “நீங்கள் பேசுகிற இந்த மனிதனை எனக்குத் தெரியாது!” என்றான்.
  rationale: 'The revision removes an overfull and potentially misleading expression for the single verb ὀμνύναι, while retaining the source''s escalation: Peter began both to invoke curses and to swear. It also improves the idiomatic Tamil rendering of ὃν λέγετε. The footnote continues to preserve the source-text ambiguity about the object of the curses.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:14:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the narrative contrast, the ingressive force of ἤρξατο, the unspecified target of ἀναθεματίζειν, Peter's oath, and the direct denial. However, “ஆணையிட்டுச் சத்தியம் செய்யவும்” is needlessly duplicative for ὀμνύναι and can sound like commanding someone to swear rather than swearing himself.
  naturalness: “சாபங்களை வரவழைக்கவும் சத்தியம் செய்யவும் தொடங்கி” is clearer and more natural modern Tamil than the draft's compounded “ஆணையிட்டுச் சத்தியம் செய்யவும்.” “நீங்கள் பேசுகிற” is a more idiomatic rendering of the ongoing referential sense of ὃν λέγετε than “நீங்கள் சொல்லுகிற.”
  terminology: “சத்தியம் செய்ய” adequately conveys oath-taking without conflating it with profanity. “சாபங்களை வரவழைக்க” retains the force of invoking curses while not deciding whether they were directed against Peter himself or another person. The footnote appropriately records the alternatives and ambiguity.
  issues:
  - severity: medium
    issue: “ஆணையிட்டுச் சத்தியம் செய்யவும்” for ὀμνύναι is redundant and potentially ambiguous.
    rationale: Both “ஆணையிடுதல்” (in its oath sense) and “சத்தியம் செய்தல்” can convey swearing. Combined, they overtranslate one Greek verb and may be understood as ‘commanding and swearing,’ rather than taking an oath.
  - severity: low
    issue: “நீங்கள் சொல்லுகிற” is less idiomatic in this context.
    rationale: λέγετε refers to the man whom the bystanders are talking about. “நீங்கள் பேசுகிற” naturally expresses that reference in modern standard Tamil.
  revised_text: ஆனால், அவன் சாபங்களை வரவழைக்கவும் சத்தியம் செய்யவும் தொடங்கி, “நீங்கள் பேசுகிற இந்த மனிதனை எனக்குத் தெரியாது!” என்றான்.
  revised_footnotes:
