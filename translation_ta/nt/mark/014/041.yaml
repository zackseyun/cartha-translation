id: MRK.14.41
reference: Mark 14:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ta
  text: அவர் மூன்றாம் முறையாக வந்து அவர்களிடம், “இன்னுமா தூங்கிக்கொண்டு ஓய்வெடுக்கிறீர்கள்?[a] போதும்![b] அந்த நேரம் வந்துவிட்டது. பாருங்கள், மானிடமகன் பாவிகளின் கைகளில் ஒப்படைக்கப்படுகிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இனி தூங்கி ஓய்வெடுங்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரை ஏளனமான கூற்று அல்லது அனுமதியாகவும், கண்டனத் தொனியுள்ள வினாவாகவும் புரிந்துகொள்ள முடியும். τὸ λοιπὸν என்பதற்கு சொல்லர்த்தமாக “இனிமேல்” அல்லது “மீதமுள்ள நேரத்தில்” என்ற பொருள் வரலாம்.
    reason: alternative_reading
  - marker: b
    text: “போதும்!” என்பது பொருள் காணக் கடினமான ἀπέχει என்ற சொல்லின் மொழிபெயர்ப்பு. “போதுமானது” என்றும், இங்கு சாத்தியம் குறைவாக “முழுத் தொகையும் கிடைத்துவிட்டது” என்ற வணிகப் பொருளிலும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: மூன்றாம் முறையாக வந்து
  rationale: வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழில் இயல்பான தொடர் வினையெச்ச அமைப்பால் வெளிப்படுத்துகிறது; τὸ τρίτον என்பதின் வரிசைப் பொருளையும் காக்கிறது.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: இன்னுமா தூங்கிக்கொண்டு ஓய்வெடுக்கிறீர்கள்?
  rationale: சூழலில் இயல்பாக ஒலிக்கும் கண்டனத் தொனியுள்ள வினாவாக வழங்கப்பட்டுள்ளது. கிரேக்கச் சொற்றொடரை ஏளனமான அனுமதி அல்லது கூற்றாகவும் எடுத்துக்கொள்ள முடியும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπέχει
  choice: போதும்!
  rationale: இது பொருள் காணக் கடினமான சொல். இச்சூழலில் சீடர்களின் உறக்கத்திலிருந்து தீர்மானமான தருணத்திற்கான திடீர் மாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἦλθεν ἡ ὥρα
  choice: அந்த நேரம் வந்துவிட்டது
  rationale: ὥρα குறிக்கும் முன்குறிக்கப்பட்ட தீர்மானமான தருணத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அந்த’ என்பது குறிப்பிட்ட தருணம் என்பதை உணர்த்துகிறது.
- source_word: ἰδοὺ
  choice: பாருங்கள்
  rationale: கவனத்தை உடனடியாகத் திருப்பும் கிரேக்க இடைச்சொல்லின் சுட்டும் வலிமையை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: παραδίδοται
  choice: ஒப்படைக்கப்படுகிறார்
  rationale: ‘காட்டிக்கொடுக்கப்படுகிறார்’ என்று யூதாசின் துரோகத்துக்கு மட்டும் பொருளைக் குறுக்காமல், ஒருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற பரந்த அடிப்படைப் பொருளைக் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் தனித்துவமான சுயக்குறிப்பைச் சுருக்கமாகவும் பட்டப்பெயரின் தன்மையுடனும் காக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: பாவிகளின் கைகளில்
  rationale: பிறருடைய அதிகாரத்திற்குள் செல்வதைக் குறிக்கும் ‘கைகளில்’ என்ற மூல உருவகத்தையும் ‘பாவிகள்’ என்ற பெயர்ச்சொல் வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε என்பதன் வாக்கிய வலிமை
  choice: 'கண்டனத் தொனியுள்ள வினா: “இன்னுமா தூங்கிக்கொண்டு ஓய்வெடுக்கிறீர்கள்?”'
  alternative: 'ஏளனமான அனுமதி அல்லது கூற்று: “இனி தூங்கி ஓய்வெடுங்கள்.”'
  rationale: பண்டைய கையெழுத்துப் பிரதிகளின் நிறுத்தற்குறிகள் இதைத் தீர்மானிப்பதில்லை. வடிவங்கள் கூற்றாக இருந்தாலும், சூழலில் வினாவாக ஒலிக்கலாம். தமிழில் காட்சியின் கண்டனத் தொனியை இயல்பாகத் தரும் வினா முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான இரட்டைப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- issue: ἀπέχει என்பதன் பொருள்
  choice: “போதும்!”
  alternative: “போதுமானது”; அல்லது இங்கு சாத்தியம் குறைந்த வணிகப் பொருளான “முழுத் தொகையும் கிடைத்துவிட்டது”
  rationale: சொல் பொருள் காணக் கடினமானது. உடனடி கதைமாற்றத்திற்கு “போதும்!” நன்கு பொருந்துகிறது; ஊகமான தொழில்நுட்ப அல்லது வணிகப் பொருள் முதன்மை உரையில் புகுத்தப்படவில்லை.
- issue: παραδίδοται என்பதன் மொழிபெயர்ப்பு
  choice: “ஒப்படைக்கப்படுகிறார்”
  alternative: “காட்டிக்கொடுக்கப்படுகிறார்” அல்லது “ஒப்புக்கொடுக்கப்படுகிறார்”
  rationale: இது செயலை யூதாசின் துரோகத்துக்கு மட்டும் குறுக்காமல், பாடுகளின் நிகழ்வில் உள்ள பரந்த ஒப்படைத்தல் கருத்தையும் நிகழ்காலச் செயல்முறையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; உரையாடல் இயல்பாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது. “மானிடமகன்,” “பாவிகள்,” “ஒப்படைக்கப்படுகிறார்” ஆகியவை மூலத்தின் இறையியல் மற்றும் கதைசார் பரப்பைச் சுருக்காமல் காக்கின்றன. உண்மையான இரண்டு முக்கிய மொழிபெயர்ப்பு ஐயங்களும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
