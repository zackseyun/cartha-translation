  text: 'சிலர் எழுந்து, அவருக்கு எதிராகப் பொய்ச் சாட்சி சொல்லிக்கொண்டிருந்தார்கள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: அப்போது
  rationale: மாற்குவின் எளிய கதைத் தொடர்ச்சியைத் தமிழில் இயல்பாக இணைக்கிறது; இவ்விடத்தில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத சில நபர்களைக் குறிக்கும் பன்மை வடிவத்தின் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀναστάντες
  choice: எழுந்து
  rationale: சாட்சி கூறுவதற்காக எழுந்து நின்ற செயலைச் சுருக்கமாகவும் நீதிமன்றச் சூழலுக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது.
- source_word: ἐψευδομαρτύρουν
  choice: பொய்ச் சாட்சி சொல்லிக்கொண்டிருந்தார்கள்
  rationale: சட்டம் சார்ந்த ‘பொய்ச் சாட்சி’ என்ற பொருளையும், இறந்தகாலத்தில் நீடித்த அல்லது தொடர்ந்த செயலைக் காட்டும் imperfect அம்சத்தையும் வெளிப்படுத்துகிறது.
- source_word: κατ’ αὐτοῦ
  choice: அவருக்கு எதிராக
  rationale: சட்ட விசாரணைச் சூழலில் κατά + genitive கொண்டுள்ள எதிரான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: λέγοντες
  choice: 'சொல்லிக்கொண்டிருந்தார்கள்:'
  rationale: அடுத்த வசனத்தில் வரும் சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேரடி உரைக்கு முன் முக்காற்புள்ளி இயல்பாக அமைகிறது.
