  source_fidelity: மூலக் கிரேக்கத்தின் πάλιν, ἀπελθὼν, προσηύξατο, τὸν αὐτὸν λόγον, εἰπών ஆகிய கூறுகள் அனைத்தும் பொருளிலும் நிகழ்வரிசையிலும் தக்கவாறு பிரதிபலிக்கப்படுகின்றன. λόγος ஒருமையில் இருந்தாலும், இச்சூழலில் முன்பு கூறிய ஜெபத்தின் உரை/உள்ளடக்கத்தைக் குறிப்பதால் “அதே வார்த்தைகளை” என்பது இயல்பானதும் பொருளுக்கு உண்மையானதுமாகும்.
  naturalness: “அவர் மீண்டும் விலகிச் சென்று, அதே வார்த்தைகளைச் சொல்லி ஜெபித்தார்” நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. பங்கேற்புவினைத் தொடர் தமிழில் இயல்பாக அமைந்துள்ளது.
  terminology: “ஜெபித்தார்” பொதுவாகப் புரியும் தகுந்த சமயச் சொல்லாகும். “விலகிச் சென்று” சீடர்களிடமிருந்து அகன்று சென்ற சூழல் இயக்கத்தைச் சரியாக உணர்த்துகிறது. அடிக்குறிப்பு λόγος-இன் நேரடி ஒருமை வடிவத்தையும் பொருள்சார் மாற்றுவழிகளையும் பொறுப்புடன் விளக்குகிறது.
