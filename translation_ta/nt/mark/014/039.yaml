  text: καὶ πάλιν ἀπελθὼν προσηύξατο τὸν αὐτὸν λόγον εἰπών.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: ta
  text: அவர் மீண்டும் விலகிச் சென்று, அதே வார்த்தைகளைச் சொல்லி ஜெபித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அதே சொல்லைச் சொல்லி.” இங்குள்ள கிரேக்கச் சொல் λόγος, அவர் முன்பு செய்த ஜெபத்தின் அதே உரை அல்லது உள்ளடக்கத்தைக் குறிக்கிறது; “அதே காரியத்தை” அல்லது “அதே கூற்றை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் திரும்ப நிகழ்வதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: ἀπελθὼν
  choice: விலகிச் சென்று
  rationale: இயேசு மற்றவர்களிடமிருந்து அகன்று சென்றதைத் தெளிவாகக் காட்டுகிறது; முதன்மை வினைக்கு முன் நிகழ்ந்த பங்கேற்புவினையின் தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: προσηύξατο
  choice: ஜெபித்தார்
  rationale: இறைவனை நோக்கிச் செய்யப்படும் ஜெபத்தைக் குறிக்கும், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் வழக்கமான சொல்.
- source_word: τὸν αὐτὸν λόγον
  choice: அதே வார்த்தைகளை
  rationale: λόγος ஒருமையில் இருந்தாலும், இங்கு அது ஒரே ஒரு சொல்லைக் காட்டாமல் முன்பு கூறப்பட்ட ஜெபத்தின் உரை அல்லது உள்ளடக்கத்தைக் குறிக்கிறது. தமிழில் பன்மை வடிவம் இயல்பாகவும் தவறான புரிதலைத் தவிர்ப்பதாகவும் உள்ளது; மூலத்தின் ஒருமைச் சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰπών
  choice: சொல்லி
  rationale: ஜெபித்த விதத்தையும் அதன் உரையையும் இணைக்கும் பங்கேற்புவினையை இயல்பான தமிழில் தருகிறது.
