revisions:
- from: சீடர்கள் புறப்பட்டு நகரத்திற்குள் சென்றார்கள். அவர் தங்களிடம் சொன்னபடியே எல்லாம் இருப்பதைக் கண்டார்கள்; பின்பு பஸ்காவை[a] ஆயத்தம் செய்தார்கள்.
  to: சீடர்கள் புறப்பட்டு நகரத்திற்குள் சென்று, அவர் அவர்களிடம் சொன்னபடியே இருந்ததைக் கண்டார்கள்; பின்பு பஸ்காவை[a] ஆயத்தம் செய்தார்கள்.
  rationale: The revision removes the added exhaustive sense in “எல்லாம்,” corrects the pronoun reference, and retains the Greek ambiguity concerning what precisely they found. It also preserves the contextual ambiguity of τὸ πάσχα in the footnote.
  reviewer_model: gpt-5.6-terra
