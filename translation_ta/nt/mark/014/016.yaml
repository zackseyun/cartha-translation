id: MRK.14.16
reference: Mark 14:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: ta
  text: சீடர்கள் புறப்பட்டு நகரத்திற்குள் சென்று, அவர் அவர்களிடம் சொன்னபடியே இருந்ததைக் கண்டார்கள்; பின்பு பஸ்காவை[a] ஆயத்தம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பஸ்கா உணவை.” கிரேக்கச் சொல் பஸ்கா பண்டிகையையோ, இந்தச் சூழலில் ஆயத்தம் செய்யப்பட்ட பஸ்கா உணவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: புறப்பட்டு
  rationale: முந்தைய இடத்தைவிட்டு அவர்கள் சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: இயேசுவைப் பின்பற்றிக் கற்றுக்கொண்டவர்களைக் குறிக்கும் வழக்கமான நற்செய்தி நூல் சொல்.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: நகரத்திற்குள் சென்றார்கள்
  rationale: εἰς என்பதிலுள்ள உள்ளே செல்லும் பொருளைப் பாதுகாக்கிறது; தமிழ்க் கதைநடையில் ‘சென்றார்கள்’ இயல்பாக உள்ளது.
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: அவர் தங்களிடம் சொன்னபடியே எல்லாம் இருப்பதைக் கண்டார்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படாத வினைப்பொருளை ‘எல்லாம் இருப்பதை’ எனச் சூழலிலிருந்து இயல்பாக நிறைவு செய்கிறது; நிகழ்வுகள் அவர் சொன்னதற்கு ஒத்திருந்ததைத் தெரிவிக்கிறது.
- source_word: ἡτοίμασαν
  choice: ஆயத்தம் செய்தார்கள்
  rationale: தேவையான ஏற்பாடுகளைச் செய்து தயாராக்கினர் என்ற பொருளை dignified, பொதுவாகப் புரியும் தமிழில் தருகிறது.
- source_word: τὸ πάσχα
  choice: பஸ்காவை
  rationale: கிரேக்கச் சொல்லின் பண்டிகை/உணவு என்ற இருபொருள் வாய்ப்பை முதன்மை உரையில் பாதுகாக்கும் மரபான தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர் ‘மற்றும்’ இணைப்புகள் தமிழில் இயல்பான வாக்கியப் பிரிவும் ‘பின்பு’ என்பதும் கொண்டு வழங்கப்பட்டுள்ளன.
