    text: அல்லது, ‘அடிமைப் பெண்களில் ஒருத்தி.’ παιδίσκη என்ற கிரேக்கச் சொல் வீட்டுப் பணிப்பெண்ணையோ அடிமைப் பெண்ணையோ குறிக்கலாம்.
