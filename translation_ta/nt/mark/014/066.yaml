lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: பேதுரு ... இருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருக்கும் பின்னணிச் சூழலைக் காட்டும் இந்த genitive absolute அமைப்பை இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக மொழிபெயர்க்கிறது.
- source_word: κάτω
  choice: கீழே
  rationale: பேதுரு தலைமைக் குருவின் இல்லத்தின் கீழ்ப்பகுதியில் இருந்தார் என்ற இடநிலையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐν τῇ αὐλῇ
  choice: முற்றத்தில்
  rationale: αὐλή இங்கு தலைமைக் குருவின் இல்லத்திற்குள் அமைந்த திறந்த முற்றத்தைக் குறிக்கிறது; நவீன தமிழில் ‘முற்றம்’ இயல்பான இணைச்சொல்.
- source_word: ἔρχεται
  choice: வந்தாள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக வழங்குகிறது; எழுவாயின் பெண்பாலையும் வெளிப்படுத்துகிறது.
- source_word: μία τῶν παιδισκῶν
  choice: பணிப்பெண்களில் ஒருத்தி
  rationale: παιδίσκη ஒரு வீட்டுப் பெண் பணியாளரையோ அடிமைப் பெண்ணையோ குறிக்கலாம். சூழலில் அவளுடைய வீட்டுப் பணி சார்ந்த நிலையை இயல்பாகக் காட்ட ‘பணிப்பெண்’ பயன்படுத்தப்பட்டு, சட்ட அல்லது சமூக அடிமை நிலை குறித்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ ἀρχιερέως
  choice: தலைமைக் குருவின்
  rationale: ἀρχιερεύς என்பதற்கு நவீன, தெளிவான தமிழ்ச் சொற்றொடராகவும், உடைமை அல்லது இல்லச் சார்பைக் காட்டும் genitive உறவை இயல்பாகவும் வழங்குகிறது.
