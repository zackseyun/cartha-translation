source:
  edition: SBLGNT
  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: ta
  text: “ஏனெனில், இந்த நறுமணத் தைலத்தை முந்நூறு தினாரிக்கு மேற்பட்ட விலைக்கு விற்று, ஏழைகளுக்குக் கொடுத்திருக்கலாமே!” என்று அவர்கள் அவளைக் கடுமையாகக் கண்டித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவளைக் கடிந்துகொண்டார்கள்.” கிரேக்க வினைச்சொல் அவள்மீது வெளிப்படுத்தப்பட்ட கடுமையான அதிருப்தியையோ வன்மையான கண்டனத்தையோ உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: நறுமணத் தைலம்
  rationale: வாசனைமிக்க எண்ணெய் அல்லது தைலத்தைக் குறிக்கும் கிரேக்கச் சொல்லை, சூழலுக்கும் நவீனத் தமிழுக்கும் இயல்பாகப் பொருந்தும் வகையில் மொழிபெயர்க்கிறது.
- source_word: ἠδύνατο … πραθῆναι
  choice: விற்றிருக்கலாமே
  rationale: நடைபெறாமல் போன சாத்தியத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மேற்கோளில் குற்றஞ்சாட்டும் தொனியையும் தருகிறது.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: முந்நூறு தினாரிக்கும் அதிகமாக
  rationale: ἐπάνω என்பதன் அளவை மீறும் பொருளைப் பாதுகாக்கிறது; பண்டைய நாணயத்தை நவீனப் பணமதிப்பாக மாற்றாமல் ‘தினார்’ என ஒலிபெயர்க்கிறது.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: ஏழைகளுக்குக் கொடுத்திருக்கலாமே
  rationale: πτωχοῖς குறிக்கும் பொருளாதார வறுமையிலுள்ள மக்களைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: அவளைக் கடுமையாகக் கண்டித்தார்கள்
  rationale: வெறும் அதிருப்தியை விட வலுவான, நேரடியாக வெளிப்படுத்தப்பட்ட சினத்தையும் கடிந்துரைத்தலையும் ἐμβριμάομαι இங்கு உணர்த்துவதால் இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: γὰρ
  choice: என்று சொல்லி
  rationale: γάρ முந்தைய குற்றச்சாட்டுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தனி வசனமாக வாசிக்கும்போது இயல்பான தமிழுக்காக அதன் விளக்கத் தொடர்பு மேற்கோள் அமைப்பில் வெளிப்படுத்தப்படுகிறது.
