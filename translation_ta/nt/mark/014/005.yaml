  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நறுமணப் பொருளின் எண்ணெய்/தைலத் தன்மையை ‘நறுமணத் தைலம்’ தெளிவாக்குகிறது. வரலாற்று நாணயப் பெயர் மாற்றமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
