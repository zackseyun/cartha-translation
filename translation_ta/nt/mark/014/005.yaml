revisions:
- from: “இந்த நறுமணத் தைலத்தை முந்நூறு தினாரிக்கும் அதிகமாக விற்று, ஏழைகளுக்குக் கொடுத்திருக்கலாமே!” என்று சொல்லி, அவர்கள் அவளைக் கடுமையாகக் கண்டித்தார்கள்[a].
  to: “ஏனெனில், இந்த நறுமணத் தைலத்தை முந்நூறு தினாரிக்கு மேற்பட்ட விலைக்கு விற்று, ஏழைகளுக்குக் கொடுத்திருக்கலாமே!” என்று அவர்கள் அவளைக் கடுமையாகக் கண்டித்தார்கள்[a].
  rationale: The revision explicitly renders γάρ as “ஏனெனில்,” replaces the less idiomatic amount expression with a clear sale-price construction, and retains the direct, strong sense of the final verb. The footnote gives a close Tamil alternative while explaining the verb’s intensity without weakening the main rendering.
