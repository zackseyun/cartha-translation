  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: ta
  text: அப்போது அவர்கள் அவர்மீது கைகளைப் போட்டு[a], அவரைப் பிடித்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்மீது தங்கள் கைகளை வைத்தார்கள்.’ இந்தக் கிரேக்க மரபுத்தொடர் ஒருவரைப் பிடிப்பதைக் குறிக்கிறது; பெரும்பாலும் அவரைக் கைது செய்வதற்காகப் பிடிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரைக் கைது செய்தார்கள்.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: அப்போது அவர்கள்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்வின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது; ஆகவே இயல்பான தமிழ் கதைநடைக்கு ஏற்ப ‘அப்போது அவர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: அவர்மேல் கைகளைப் போட்டு
  rationale: இது ஒருவரைப் பிடிப்பதை, குறிப்பாகக் கைது செய்யும் நோக்கில் பிடிப்பதைச் சுட்டும் கிரேக்க மரபுத்தொடர். மூலத்தின் உடல்சார்ந்த உருவகத்தையும் பகைமை நிறைந்த சூழலையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: ἐκράτησαν αὐτόν
  choice: அவரைப் பிடித்துக்கொண்டார்கள்
  rationale: κρατέω இச்சூழலில் வலுக்கட்டாயமாகப் பிடித்து கட்டுப்பாட்டில் வைத்திருப்பதைக் குறிக்கிறது. ‘பிடித்துக்கொண்டார்கள்’ என்பது அந்தச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சட்ட நடைமுறையை முன்னிறுத்தும் ‘கைது செய்தார்கள்’ என்பதை நேரடியாக முதன்மை உரையில் சேர்க்கவில்லை.
