source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: ta
  text: 'அவர் சொல்லிக்கொண்டிருந்தார்[a]: “அப்பா, தந்தையே[b], உமக்கு எல்லாம் சாத்தியம். இந்தக் கிண்ணத்தை என்னிடமிருந்து அகற்றும்[c]. ஆனாலும், நான் விரும்புவது அல்ல, நீர் விரும்புவது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சொன்னார்.” கிரேக்க முற்றுப்பெறாத இறந்தகால வினை வடிவம் அவர் தொடர்ந்து அல்லது மீண்டும் சொன்னதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அப்பா” என்பது தந்தையை அழைக்கும் அரமேயச் சொல்; அதனுடன் கிரேக்கத்தில் வரும் “தந்தையே” என்பதும் இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: cultural_note
  - marker: c
    text: “கிண்ணம்” என்பது அவருக்குக் குறிக்கப்பட்ட துன்பத்தைக் குறிக்கும் வேதாகம உருவகம்; மாற்கு 10:38-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து சொன்னார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கக்கூடும்; இயல்பான தமிழில் அந்தக் கூறை இது வெளிப்படுத்துகிறது.
- source_word: Αββα ὁ πατήρ
  choice: அப்பா, தந்தையே
  rationale: அரமேய அழைப்புச் சொல்லான ‘அப்பா’வை ஒலிபெயர்த்து வைத்துக் கொண்டு, அதைத் தொடர்ந்து வரும் கிரேக்க விளக்கத்தையும் நேரடி அழைப்பாக மொழிபெயர்க்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என்’ சேர்க்கப்படவில்லை.
- source_word: πάντα δυνατά σοι
  choice: உம்மால் எல்லாம் முடியும்
  rationale: இறைவனை நோக்கிய மரியாதையான நேரடி உரையில் இயல்பாகவும், அனைத்தையும் உள்ளடக்கும் மூலத்தின் பரப்பைத் தக்கவைத்தும் உள்ளது.
- source_word: παρένεγκε
  choice: அகற்றும்
  rationale: கிண்ணம் தம்மிடமிருந்து நீக்கப்பட வேண்டும் என்ற வேண்டுகோளை மரியாதைமிக்க ஏவல் வடிவில் தெளிவாகக் கூறுகிறது.
- source_word: τὸ ποτήριον τοῦτο
  choice: இந்தக் கிண்ணம்
  rationale: வரவிருக்கும் துன்பத்தைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே தக்கவைக்கிறது.
- source_word: ἀπ’ ἐμοῦ
  choice: என்னிடமிருந்து
  rationale: கிண்ணத்தைத் தம்மிடமிருந்து அகற்றுமாறு கேட்கும் மூலத்தின் தொடர்பை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: ஆனாலும், நான் விரும்புவது அல்ல; நீர் விரும்புவதே நடக்கட்டும்
  rationale: கிரேக்கத்தில் இரு கூறுகளிலும் விடுபட்டுள்ள கருத்தை தமிழில் இயல்பாக நிறைவு செய்கிறது. இயேசுவின் விருப்பத்துக்கும் பிதாவின் விருப்பத்துக்கும் இடையிலான பதற்றத்தைத் தக்கவைத்து, இறுதி வேண்டுதலின் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: இறைவனை அரமேய மற்றும் கிரேக்க அழைப்புச் சொற்கள் இரண்டாலும் அழைத்தல்
  choice: அப்பா, தந்தையே
  alternative: அப்பா, என் தந்தையே
  rationale: மூலமே அரமேய அழைப்பையும் அதன் கிரேக்க விளக்கத்தையும் வைத்துள்ளது. இரண்டையும் தக்கவைத்து, வெளிப்படையாக இல்லாத உடைமைச் சொல்லைச் சேர்க்கவில்லை.
- issue: ‘கிண்ணம்’ என்ற உருவகத்தின் பொருள்
  choice: இந்தக் கிண்ணம்
  alternative: இந்தத் துன்பம்
  rationale: இது இயேசுவுக்குக் குறிக்கப்பட்ட துன்பத்தைக் குறித்தாலும், மூலத்தின் உருவகத்தையும் அதன் வேதாகமத் தொடர்புகளையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: இயேசுவின் விருப்பமும் பிதாவின் விருப்பமும்
  choice: நான் விரும்புவது அல்ல; நீர் விரும்புவதே நடக்கட்டும்
  alternative: என் விருப்பப்படி அல்ல, உமது விருப்பப்படியே
  rationale: மூலத்தின் எதிரெதிர் அமைப்பையும் தனிப்பட்ட விருப்பங்களுக்கிடையிலான உண்மையான பதற்றத்தையும் தக்கவைக்கிறது; அதேவேளை தமிழில் முழுமையான வேண்டுதலாக இயல்பாக ஒலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கி ‘உம்மால்/நீர்’ என்ற மரியாதை வடிவங்கள் உள்ளன. அரமேய ‘அப்பா’வும் ‘கிண்ணம்’ உருவகமும் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
