- from: 'அவர் தொடர்ந்து சொன்னார்[a]: “அப்பா, தந்தையே[b], உம்மால் எல்லாம் முடியும். இந்தக் கிண்ணத்தை என்னிடமிருந்து அகற்றும்[c]. ஆனாலும், நான் விரும்புவது அல்ல; நீர் விரும்புவதே நடக்கட்டும்.”'
  to: 'அவர் சொல்லிக்கொண்டிருந்தார்[a]: “அப்பா, தந்தையே[b], உமக்கு எல்லாம் சாத்தியம். இந்தக் கிண்ணத்தை என்னிடமிருந்து அகற்றும்[c]. ஆனாலும், நான் விரும்புவது அல்ல, நீர் விரும்புவது.”'
  rationale: முற்றுப்பெறாத காலத்தின் அம்சத்தை உறுதியான ‘தொடர்ந்து’ எனக் கூறாமல் ‘சொல்லிக்கொண்டிருந்தார்’ எனத் திருத்தினேன். δυνατά σοι என்பதன் சாத்தியக் கருத்தை ‘உமக்கு எல்லாம் சாத்தியம்’ என நேரடியாகத் தந்தேன். இறுதிக் கிரேக்க எதிர்நிலை குறுகிய வடிவிலேயே இருப்பதால், மூலத்தில் இல்லாத ‘நடக்கட்டும்’ என்பதை நீக்கி, தமிழில் புரியக்கூடிய இணை அமைப்பை வைத்தேன். அடிக்குறிப்பு அடையாளங்களும் அவற்றின் குறிப்புகளும் சரியாகத் தக்கவைக்கப்பட்டுள்ளன.
