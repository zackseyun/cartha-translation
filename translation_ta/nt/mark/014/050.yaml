translation:
  language: ta
  text: அவரை விட்டுவிட்டு, எல்லாரும் தப்பி ஓடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் முந்தைய நிகழ்வுடன் தொடர்ச்சியை இயல்பான வாக்கிய வரிசையே காட்டுகிறது; ‘மேலும்’ அல்லது ‘அப்போது’ என்பவை மூலத்தில் இல்லாத கூடுதல் நுண்பொருளைத் தரக்கூடும்.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: இங்கு ἀφίημι என்பது இயேசுவை விட்டுச் செல்வதைக் குறிக்கிறது. ‘கைவிட்டு’ என்பதைக் காட்டிலும் ‘விட்டுவிட்டு’ மூலத்தின் சுருக்கத்தையும் செயற்பாட்டு வரிசையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: சூழலில் இயேசுவைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; தமிழின் மரியாதை வழக்குக்கு ஏற்ப ‘அவரை’ பயன்படுத்தப்படுகிறது.
- source_word: ἔφυγον
  choice: தப்பி ஓடினார்கள்
  rationale: φεύγω ஆபத்திலிருந்து விரைந்து விலகிச் செல்வதைக் குறிக்கிறது. நவீனத் தமிழில் ‘தப்பி ஓடினார்கள்’ என்பது ‘ஓடிப்போனார்கள்’ என்பதைக் காட்டிலும் அச்சத்திலிருந்து தப்பிச் செல்லும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: உடனிருந்தவர்களின் முழுத் தொகுதியையும் வலியுறுத்துகிறது; ‘எல்லாரும்’ இயல்பான தமிழில் அந்த முழுமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவுடன் இருந்தவர்களின் விலகலின் முழுமை
  choice: எல்லாரும் தப்பி ஓடினார்கள்
  alternative: அவர்கள் அனைவரும் ஓடிப்போனார்கள்
  rationale: πάντες காட்டும் முழுமையைச் சற்றும் மென்மைப்படுத்தாமல் மொழிபெயர்க்கிறது; அதேவேளையில், இவ்வசனத்தின் உடனடிச் சூழலைத் தாண்டி யாரைக் குறிக்கிறது என்று விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான கதைநடை. ‘அவரை’ என்பது இயேசுவைக் குறிக்கும் இயல்பான மரியாதைச் சுட்டுப்பெயர். அடிக்குறிப்புகள் தேவையில்லை.
