id: MRK.14.21
reference: Mark 14:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: ta
  text: ஏனெனில் மனிதகுமாரன் தம்மைக் குறித்து எழுதப்பட்டுள்ளபடியே போகிறார்; ஆனால் மனிதகுமாரன் எவனால் காட்டிக்கொடுக்கப்படுகிறாரோ, அந்த மனிதனுக்கு ஐயோ! அந்த மனிதன் பிறந்திருக்காவிட்டால், அவனுக்கு நலமாயிருந்திருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் காரணத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற சுயகுறிப்புப் பெயரைப் பாதுகாக்கிறது; அதன் வேதாகமப் பின்னொலிகளையும் விளக்கவுரையாக மாற்றாமல் விடுகிறது.
- source_word: ὑπάγει
  choice: போகிறார்
  rationale: நியமிக்கப்பட்ட முடிவை நோக்கிய நகர்வை மிகையாக விளக்காமல், நிகழ்கால வினையின் எளிய இயக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: தம்மைக் குறித்து எழுதப்பட்டிருக்கிறபடியே
  rationale: καθώς என்பதன் ஒப்பீட்டுப் பொருளையும், எழுதப்பட்டவை நிலைத்திருப்பதைக் குறிக்கும் γέγραπται என்பதன் நிறைவுநிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: οὐαὶ
  choice: ஐயோ!
  rationale: தீர்ப்பையும் துயர அறிவிப்பையும் ஒருங்கே தாங்கும் தீர்க்கதரிசன எச்சரிப்பின் வலிமையைப் பாதுகாக்கிறது.
- source_word: δι’ οὗ
  choice: எவனால்
  rationale: διά உடன் வரும் செயற்படுத்தும் நபரைக் குறிக்கும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: παραδίδοται
  choice: காட்டிக்கொடுக்கப்படுகிறார்
  rationale: இச்சூழலில் உள்ள துரோகச் செயலை இயல்பாக உணர்த்துகிறது; சொல்லின் நேரடியான ‘ஒப்படைக்கப்படுதல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: பிறக்காமலிருந்திருந்தால், அவனுக்கு நலமாயிருந்திருக்கும்
  rationale: நிகழ்ந்த உண்மைக்கு மாறான நிபந்தனையையும் அதன் கடுமையான மதிப்பீட்டையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: அந்த மனிதன்
  rationale: கிரேக்கத்தில் வலியுறுத்தப்பட்டு மீண்டும் வரும் சுட்டுப்பெயர்ச்சொல்லையும் குறிப்பிட்ட ஆண் நபரைக் குறிக்கும் தன்மையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: பாடுகளின் சூழலில் παραδίδοται என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுக்கப்படுகிறார்
  alternative: ஒப்படைக்கப்படுகிறார்
  rationale: உடனடிச் சூழலில் யூதாசின் துரோகம் முன்னிலையில் இருப்பதால் முதன்மை உரை அதன் ஒழுக்கப் பரிமாணத்தைத் தெளிவாக்குகிறது. அதேவேளை, வினைச்சொல்லின் விரிவான ‘ஒப்படை’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறைத் திட்டமும் மனிதப் பொறுப்பும் இணைந்திருக்கும் பதற்றம்
  choice: எழுதப்பட்டிருக்கிறபடியே போகிறார்; ஆனால் ... அந்த மனிதனுக்கு ஐயோ
  alternative: ஒன்றை மற்றொன்றால் விளக்கி மென்மைப்படுத்துதல்
  rationale: மனிதகுமாரனின் பாதை எழுதப்பட்டதற்கு ஏற்ப நடப்பதையும், அவரைக் காட்டிக்கொடுப்பவன் பொறுப்புக்குரியவன் என்பதையும் உரை அருகருகே வைக்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற பட்டமும், ‘ஐயோ!’ என்ற தீர்க்கதரிசனத் தீவிரமும் தக்கவைக்கப்பட்டுள்ளன.
