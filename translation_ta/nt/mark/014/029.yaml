  to: ஆனால் பேதுரு அவரிடம், “அனைவரும் விலகினாலும்[a], நான் விலகமாட்டேன்” என்றார்.
  rationale: The revision removes the added sequential nuance of “தடுமாறி” while retaining the contextually appropriate sense of falling away in “விலகினாலும்.” The footnote preserves the Greek verb's wider semantic range and remains anchored at the translated verb.
