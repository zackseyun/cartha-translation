source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: ta
  text: ஆனால் பேதுரு அவரிடம், “அனைவரும் விலகினாலும்[a], நான் விலகமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இடறினாலும்,” “இடறச் செய்யப்பட்டாலும்,” அல்லது “மனம் புண்பட்டு விலகினாலும்.” கிரேக்க வினைச்சொல் இடறுதல், இடறச் செய்யப்படுதல், மனம் புண்படுதல், அல்லது விலகிப்போதல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: இதற்கு முன் இயேசு கூறிய முன்னறிவிப்புக்கு எதிராகப் பேதுரு பதிலளிப்பதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἔφη
  choice: என்றார்
  rationale: கதைநடையில் வரும் பொதுவான பேச்சு வினையை இயல்பான நேரடி உரை அமைப்பில் தருகிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: சூழலில் இந்தச் சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது; மூலத்தில் பெயர் இல்லாததால் சுட்டுப்பெயரே தக்கவைக்கப்படுகிறது.
- source_word: Εἰ καὶ
  choice: …இனாலும்
  rationale: ‘Even if’ என்ற விட்டுக்கொடுக்கும் நிபந்தனைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: சூழலில் சீடர்கள் அனைவரையும் குறிக்கும் பரந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: σκανδαλισθήσονται
  choice: தடுமாறி விலகினாலும்
  rationale: சீடர்கள் இயேசுவை விட்டுவிலகும் சூழலில், வெறும் உடல் இடறலைவிட ஆழமான தோல்வியையும் விலகலையும் காட்டுகிறது; அதேவேளையில் இறுதியான விசுவாசத் துறப்பு என்று முடிவுசெய்யவில்லை.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: நான் விலகமாட்டேன்
  rationale: முந்தைய வினையைத் தமிழில் இயல்பாக மீட்டுரைத்து, மற்றவர்களிலிருந்து தன்னைப் பேதுரு வலியுறுத்திப் பிரித்துக் காட்டுவதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சீடத்துவத் தோல்வியின் சூழலில் σκανδαλισθήσονται என்பதன் பொருள்
  choice: தடுமாறி விலகினாலும்
  alternative: இடறினாலும்; இடறச் செய்யப்பட்டாலும்; மனம் புண்பட்டு விலகினாலும்
  rationale: இங்கு வரவிருக்கும் மறுதலிப்பும் சீடர்கள் சிதறிப்போவதும் பின்னணியாக உள்ளன. ஆகவே விலகலின் தீவிரத்தைக் காட்டுகிறது; ஆனால் அது இறுதியான விசுவாசத் துறப்பா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பேதுருவின் முரண்பாடும் ‘நான்’ என்பதிலுள்ள வலியுறுத்தலும் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
