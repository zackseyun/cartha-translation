reference: Mark 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: ta
  text: அவர் பெத்தானியாவில் தொழுநோயாளியான சீமோனின் வீட்டில் சாய்ந்திருந்தபோது, ஒரு பெண் மிகவும் விலையுயர்ந்த தூய[a] நளத நறுமணத் தைலம் கொண்ட வெள்ளைக்கல் குடுவையுடன் வந்தாள். அவள் அந்தக் குடுவையை உடைத்து, நறுமணத் தைலத்தை அவருடைய தலையின்மேல் ஊற்றினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மையான நளத’ என்றும் மொழிபெயர்க்கலாம்; ‘தூய’ என்று மொழிபெயர்க்கப்பட்ட πιστικῆς என்ற கிரேக்கச் சொல்லின் பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: அவர் ... சாய்ந்து அமர்ந்திருந்தபோது
  rationale: மரபுவழி விருந்துண்ணும் நிலையில் சாய்ந்திருப்பதைக் குறிக்கும் தொடர்ச்சியான பின்னணிச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உணவருந்தினார் என்று மூலத்தில் இல்லாத தகவலைச் சேர்க்கவில்லை.
- source_word: Βηθανίᾳ
  choice: பெத்தானியா
  rationale: தமிழில் நிலைபெற்ற இடப்பெயர் வடிவம்.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: தொழுநோயாளியான சீமோனின் வீடு
  rationale: மூலத்தின் அடைமொழியை அப்படியே தக்கவைக்கிறது; அவர் முன்பு தொழுநோயாளியாக இருந்தார் என்ற ஊகத்தைச் சேர்க்கவில்லை.
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: மாற்கு இவ்விடத்தில் அவளை அடையாளப்படுத்தாததால், இயல்பான குறிப்பற்ற வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἀλάβαστρον
  choice: வெள்ளைக்கல் குடுவை
  rationale: ἀλάβαστρον என்பது நறுமணத் தைலம் வைக்கப்பட்ட அலபாஸ்டர் கல் பாத்திரத்தைக் குறிக்கிறது. சாதாரண வாசகருக்குப் புரியும் வகையில் பொருளையும் பாத்திரத்தையும் தெரிவிக்கிறது.
- source_word: μύρου
  choice: நறுமணத் தைலம்
  rationale: μύρον குறிக்கும் மணமுள்ள எண்ணெய் அல்லது பூசுதைலத்தை இயல்பாகவும் அளவுக்கு மீறித் துல்லியப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: νάρδου
  choice: நளத
  rationale: குறிப்பிட்ட மணமுள்ள தாவரப் பொருளுக்கான நிலைபெற்ற தமிழ் பெயரைப் பயன்படுத்துகிறது; பொதுவான நறுமணப் பொருளாக மாற்றவில்லை.
- source_word: πιστικῆς
  choice: தூய
  rationale: சொல்லின் சரியான பொருள் விவாதத்திற்குரியது. சூழலில் நளதத்தின் கலப்பற்ற தன்மையைக் குறிக்கும் பொதுவான புரிதலை முதன்மை உரையில் தருகிறது; ‘உண்மையான’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πολυτελοῦς
  choice: மிகவும் விலையுயர்ந்த
  rationale: பொருளின் பெரும் செலவு அல்லது மதிப்பைத் தெளிவாகக் காட்டுகிறது; அடுத்த வசனங்களின் எதிர்வினைக்கும் பின்னணி அமைக்கிறது.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: அந்தக் குடுவையை உடைத்து
  rationale: ஊற்றுவதற்கு முன் பாத்திரத்தை உடைத்த செயலை நேரடியான கதைநடையில் தருகிறது; ‘நொறுக்கினாள்’ என்று வன்மையை மிகைப்படுத்தவில்லை.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: அவருடைய தலையின்மேல் ஊற்றினாள்
  rationale: திரவத்தை அவருடைய தலைமேல் ஊற்றிய செயலைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தொழுநோயாளியான சீமோன்’ என்பதை அவர் அப்போது நோயுற்றிருந்தார் என்று தோன்றாதபடி மென்மையாக்க வேண்டுமா?
  choice: ‘தொழுநோயாளியான சீமோன்’ என்ற மூல அடையாளத்தைத் தக்கவைத்தல்
  alternative: ‘முன்பு தொழுநோயாளியாக இருந்த சீமோன்’
  rationale: அவர் குணமடைந்தவர் என்பது வரலாற்றளவில் சாத்தியமான ஊகமாக இருந்தாலும், மூல உரை ‘முன்பு’ என்று கூறவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தகவலைச் சேர்க்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும், இயல்பான, கண்ணியமான கதைநடை. பழங்கால உணவு நிலையை ‘சாய்ந்து அமர்ந்திருந்தார்’ என்று விளக்குகிறது; மூலத்தில் இல்லாத ‘உணவருந்தினார்’ என்பதைச் சேர்க்கவில்லை. அடிக்குறி [a] அது விளக்கும் ‘தூய’ என்ற சொல்லுக்குப் பின்பே வைக்கப்பட்டுள்ளது.
