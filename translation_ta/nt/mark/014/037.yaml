  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: ta
  text: அவர் வந்து, அவர்கள் தூங்கிக்கொண்டிருப்பதைக் காண்கிறார். அவர் பேதுருவிடம், “சீமோனே, தூங்குகிறாயா? ஒரு மணிநேரம் விழித்திருக்க[a] உன்னால் முடியவில்லையா?” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழிப்புடன் இருக்க” அல்லது “காவல் காக்க.”
    reason: γρηγορέω என்பது தூங்காமல் இருப்பதையும் விழிப்புடன் காவலிருப்பதையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்து … காண்கிறார்
  rationale: மாற்குவின் நிகழ்கால வரலாற்று நடையைத் தக்கவைக்க, பிரதான வினை நிகழ்காலத்தில் தரப்பட்டுள்ளது; தமிழ் இயல்புக்காக ἔρχεται துணைவினைத் தொடராக இணைக்கப்பட்டுள்ளது.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: அவர்கள் தூங்கிக்கொண்டிருப்பதைக் காண்கிறார்
  rationale: καθεύδοντας குறிக்கும் தொடர்ச்சியான தூக்கநிலையை ‘தூங்கிக்கொண்டிருப்பது’ இயல்பாக வெளிப்படுத்துகிறது; εὑρίσκει என்பதற்கு இச்சூழலில் ‘காண்கிறார்’ பொருத்தமானது.
- source_word: λέγει τῷ Πέτρῳ
  choice: அவர் பேதுருவிடம் … என்று கேட்கிறார்
  rationale: நேரடி உரை கேள்விகளாக இருப்பதால், தமிழில் ‘கேட்கிறார்’ இயல்பாக உள்ளது; நிகழ்கால வரலாற்று நடை காக்கப்படுகிறது.
- source_word: Σίμων
  choice: சீமோனே
  rationale: பேதுருவை இயேசு அவரது தனிப்பெயரால் நேரடியாக அழைப்பதை விளிவேற்றுமையுடன் தக்கவைக்கிறது.
- source_word: καθεύδεις
  choice: தூங்குகிறாயா?
  rationale: உடனடியாக நடக்கும் செயலைச் சுட்டும் நிகழ்காலக் கேள்வியாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οὐκ ἴσχυσας
  choice: உன்னால் முடியவில்லையா?
  rationale: இங்கு ἰσχύω உடல் வலிமையை மட்டும் அல்லாமல் செயல் திறனைச் சுட்டுவதால், இயல்பான தமிழில் இயலாமையை வெளிப்படுத்துகிறது.
- source_word: μίαν ὥραν
  choice: ஒரு மணிநேரம்
  rationale: கால அளவைக் குறிக்கும் வேற்றுமைப் பயன்பாட்டை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: γρηγορῆσαι
  choice: விழித்திருக்க
  rationale: தூக்கத்திற்கு எதிரான நேரடி பொருளை முன்னிறுத்துகிறது; அதிலுள்ள விழிப்புணர்வு அல்லது காவலிருப்பு நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மாற்குவின் நிகழ்கால வரலாற்று நடை
  choice: ‘காண்கிறார்’, ‘கேட்கிறார்’ என்று நிகழ்காலம் தக்கவைக்கப்பட்டது.
  alternative: தமிழ் கதைநடைக்கேற்ப அனைத்தையும் இறந்தகாலமாக ‘கண்டார்’, ‘கேட்டார்’ என்று மாற்றுதல்.
  rationale: மூலத்தின் உயிரோட்டமான கதைநடையைத் தக்கவைக்கிறது; அதே நேரத்தில் தமிழ் வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது.
- issue: γρηγορέω என்பதன் சூழல்சார் பொருள்
  choice: விழித்திருக்க
  alternative: விழிப்புடன் இருக்க; காவல் காக்க
  rationale: உடனடி சூழலில் இது தூங்குவதற்கு எதிராக நிறுத்தப்படுவதால் ‘விழித்திருக்க’ முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; பரந்த விழிப்புணர்வு நுணுக்கத்தை முற்றிலும் நீக்காமல் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் ஒருமை மரியாதை வடிவம் பயன்படுத்தப்பட்டாலும், சீமோனை நோக்கிய நேரடி உரையில் மூலத்துக்கு ஏற்ப ஒருமை அணுக்க வடிவம் உள்ளது.
