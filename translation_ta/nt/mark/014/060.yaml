id: MRK.14.60
reference: Mark 14:60
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: ta
  text: அப்போது தலைமை ஆசாரியர் எழுந்து நடுவில் வந்து இயேசுவிடம், “நீ பதில் ஒன்றும் சொல்லவில்லையா? இவர்கள் உனக்கு எதிராக என்ன சாட்சி சொல்கிறார்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: உட்கார்ந்திருந்த நிலையிலிருந்து எழும் உடல் இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: விசாரணைக்குத் தலைமை வகித்த யூத உயர்குருவைக் குறிக்கும் தெளிவான, மரியாதையான நவீனத் தமிழ் சொல்.
- source_word: εἰς μέσον
  choice: நடுவில் நின்று
  rationale: அவையின் மையமான இடத்தை அவர் எடுத்துக்கொண்டார் என்ற இடஞ்சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது; இயக்கத்தின் நுணுக்கம் முந்திய ‘எழுந்து’ என்பதுடன் சேர்ந்து புலப்படுகிறது.
- source_word: ἐπηρώτησεν
  choice: கேட்டார்
  rationale: நீதிவிசாரணைச் சூழல் வாக்கியத்திலிருந்தே தெளிவாக இருப்பதால், அளவுக்கு மீறிய வலிமையைக் கூட்டாமல் கேள்வி எழுப்பிய செயலை இயல்பாகக் காட்டுகிறது.
- source_word: ἀποκρίνῃ οὐδέν
  choice: நீ பதில் ஒன்றும் சொல்லவில்லையா?
  rationale: கிரேக்கத்தின் எதிர்மறை வினாவையும் தலைமைக் குருவின் நேரடியான சவாலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὗτοί
  choice: இவர்கள்
  rationale: அங்கு இருந்த குறிப்பிட்ட சாட்சிகளைச் சுட்டுகிறது. தமிழில் இயல்பான சுட்டுப்பெயர் பாலினத்தை வெளிப்படையாகச் சொல்லாவிட்டாலும், கிரேக்கத்தில் உள்ள சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: καταμαρτυροῦσιν
  choice: உனக்கு எதிராக என்ன சாட்சி சொல்கிறார்கள்
  rationale: ஒருவருக்கு எதிராகச் சாட்சியளித்தல் என்ற சட்டவியல் பொருளையும் நிகழ்காலச் செயலையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: οὗτοί என்பதிலுள்ள ஆண்பால் பன்மை
  choice: இவர்கள்
  alternative: இந்த ஆண்கள்
  rationale: கிரேக்க வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், தமிழில் குறிப்பிட்ட ஆண் சாட்சிகளை ‘இவர்கள்’ என்று குறிப்பிடுவது இயல்பானது. ‘இந்த ஆண்கள்’ என்பது சூழலில் தேவையற்ற பாலின வலியுறுத்தலைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. நீதிவிசாரணையின் கூர்மையான கேள்வித் தொனி காக்கப்பட்டுள்ளது; பழமையான ‘ஆசாரியன்’ என்பதற்குப் பதிலாகச் சமயப் பதவியைக் குறிக்கும் இயல்பான ‘தலைமைக் குரு’ பயன்படுத்தப்பட்டுள்ளது.
