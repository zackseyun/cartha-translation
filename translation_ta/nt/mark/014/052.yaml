  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: ta
  text: ஆனால், அவன் அந்த லினன் துணியை விட்டுவிட்டு, நிர்வாணமாக ஓடிப்போனான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லினன் துணி” என்பதற்கு “லினன் விரிப்பு” அல்லது “லினன் ஆடை” என்றும் மொழிபெயர்க்கலாம் (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: “நிர்வாணமாக” (γυμνός) என்பது சில சூழல்களில் போதிய ஆடையின்றி இருப்பதையும் குறிக்கலாம்; இங்கு அவன் அணிந்திருந்த துணியை விட்டுவிட்டுத் தப்பியதால், உடனடியான பொருள் ஆடையின்றி என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் அவனைப் பிடித்த செயலுக்கும், இப்போது அவன் துணியை விட்டுவிட்டுத் தப்பியதற்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: καταλιπὼν
  choice: விட்டுவிட்டு
  rationale: καταλείπω என்பதன் இறந்தகால வினையெச்சம், ஒன்றைப் பின்னால் விட்டுச் செல்வதைக் குறிக்கிறது; தமிழில் நிகழ்ச்சித் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σινδόνα
  choice: மெல்லிய துணி
  rationale: σινδών என்பது பொதுவாக மெல்லிய நார்த்துணி அல்லது உடலைச் சுற்றிக்கொள்ளும் துணியைக் குறிக்கலாம். அதன் துல்லியமான வடிவத்தைத் தீர்மானிக்காமல், பொருளை இயல்பாகக் கூறுகிறது.
- source_word: γυμνὸς
  choice: நிர்வாணமாக
  rationale: இச்சூழலில் அவன் தன்னை மூடியிருந்த துணியை விட்டுவிட்டுத் தப்புவதால், γυμνός என்பதன் நேரடியான பொருளான ‘நிர்வாணமாக’ ஏற்றது; எனினும் சொல்லின் பரந்த பயன்பாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἔφυγεν
  choice: தப்பியோடினான்
  rationale: φεύγω இங்கு ஆபத்திலிருந்து அவசரமாக ஓடித் தப்புவதைக் குறிக்கிறது; ‘தப்பியோடினான்’ என்பது ஓட்டத்தையும் தப்பித்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
