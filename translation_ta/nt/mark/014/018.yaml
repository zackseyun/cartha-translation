source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: ta
  text: அவர்கள் பந்தியில் சாய்ந்தபடி உணவருந்திக்கொண்டிருந்தபோது[a], இயேசு, “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்[b], உங்களில் ஒருவன்—என்னோடு உண்பவன்—என்னைக் காட்டிக்கொடுப்பான்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முறையான விருந்துகளில் பந்தியைச் சுற்றிச் சாய்ந்தபடி உண்பது அக்கால வழக்கம்.
    reason: cultural_note
  - marker: b
    text: இன்னும் நேரடியாக, “ஆமென், உங்களுக்குச் சொல்கிறேன்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என்னை ஒப்படைப்பான்.” கிரேக்க வினைச்சொல் ஒப்படைத்தல், கையளித்தல், அல்லது காட்டிக்கொடுத்தல் என்று பொருள்படலாம்; இங்கு இயேசுவோடு உண்பவர்களில் ஒருவர் அவரைத் துரோகமாக ஒப்படைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: பந்தியில் சாய்ந்தபடி
  rationale: பண்டைய மத்தியதரைக் கடல் உலகில் முறையான விருந்தின்போது பந்தியைச் சுற்றிச் சாய்ந்திருக்கும் வழக்கமான உடல்நிலையைத் துல்லியமாகக் காட்டுகிறது; ‘அமர்ந்திருந்தபோது’ என்று பொதுமைப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: ἐσθιόντων / ἐσθίων
  choice: உணவருந்திக்கொண்டிருந்தபோது / உண்பவன்
  rationale: முதல் இடத்தில் தொடர்ந்துகொண்டிருந்த செயலை இயல்பாகக் காட்ட ‘உணவருந்திக்கொண்டிருந்தபோது’ என்றும், ὁ ἐσθίων என்ற பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையை ‘உண்பவன்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தலான தொடக்கக் கூற்றின் solemn force-ஐ இயல்பான நவீனத் தமிழில் தருகிறது; ‘ஆமென்’ என்ற நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἷς ἐξ ὑμῶν
  choice: உங்களில் ஒருவன்
  rationale: குழுவைச் சேர்ந்த ஒருவனைக் குறிக்கும் பகுதிப்பொருள் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: παραδώσει
  choice: காட்டிக்கொடுப்பான்
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’ என்றாலும், இங்கு இயேசுவோடு உணவு பகிரும் நெருங்கிய துணைவர் அவருக்கு எதிராகச் செய்வதைக் குறிக்கிறது. ‘காட்டிக்கொடுப்பான்’ உறவுத் துரோகத்தையும் ஒப்படைத்தலையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: உடனிருப்பையும் உணவைப் பகிர்வதையும் எளிமையாகவும் நேரடியாகவும் காட்டுகிறது.
theological_decisions:
- issue: பாடுகளின் சூழலில் παραδώσει என்பதன் மொழிபெயர்ப்பு
  choice: என்னைக் காட்டிக்கொடுப்பான்
  alternative: என்னை ஒப்படைப்பான்
  rationale: வினைச்சொல் தனியாக ‘ஒப்படைத்தல்’ என்ற பரந்த பொருளைக் கொண்டிருக்கலாம். ஆனால் தம்மோடு பந்தியில் உண்பவர்களில் ஒருவர் இயேசுவுக்கு எதிராக அவரை ஒப்படைக்கப்போகும் இச்சூழல் துரோகத்தைக் குறிக்கிறது. முதன்மை உரை அந்த உறவுத் துரோகத்தை இயல்பாகத் தெரிவிக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுப் பந்தி நிலையை ‘பந்தியில் சாய்ந்தபடி’ என்பதால் பாதுகாத்து, அதன் பண்பாட்டுப் பின்னணி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மேற்கோளுக்குள் உள்ள இடைச்செருகலை நீண்ட கோடுகள் தெளிவுபடுத்துகின்றன.
