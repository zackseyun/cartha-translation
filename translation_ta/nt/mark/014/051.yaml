revisions:
- from: இளைஞன் ஒருவன், வெற்று உடலின்மேல் ஒரு நார்த்துணியை[a] மட்டும் போர்த்திக்கொண்டு, அவரைப் பின்தொடர்ந்து வந்தான். அவர்கள் அவனைப் பிடிக்கிறார்கள்.
  to: இளைஞன் ஒருவன், தன் நிர்வாண உடல்மேல் ஒரு லினன் துணியை[a] மட்டும் போர்த்திக்கொண்டு, அவரைப் பின்தொடர்ந்து கொண்டிருந்தான். அவர்கள் அவனைப் பிடிக்கிறார்கள்.
  rationale: The revision identifies the material as linen, improves idiomatic modern Tamil, and makes the imperfect aspect clearer. It retains the source order of the two narrative actions broadly, the unnamed-yet-particular introduction («இளைஞன் ஒருவன்»), the only-covering implication («மட்டும்»), and the vivid historical present («பிடிக்கிறார்கள்»).
