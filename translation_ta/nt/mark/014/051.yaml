source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: ta
  text: இளைஞன் ஒருவன், தன் நிர்வாண உடல்மேல் ஒரு லினன் துணியை[a] மட்டும் போர்த்திக்கொண்டு, அவரைப் பின்தொடர்ந்து கொண்டிருந்தான். அவர்கள் அவனைப் பிடிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு லினன் விரிப்பை.” கிரேக்கச் சொல் லினன் துணியையோ, விரிப்பு போன்ற ஆடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: இளைஞன் ஒருவன்
  rationale: νεανίσκος என்பது இளைஞனைச் சுட்டுகிறது; τις தரும் அறிமுகப்படுத்தும் தெளிவின்மையையும் மெலிந்த தனிப்படுத்தும் வலியையும் இயல்பான தமிழில் “ஒருவன்” வெளிப்படுத்துகிறது.
- source_word: συνηκολούθει
  choice: பின்தொடர்ந்து வந்தான்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் imperfect வடிவத்தின் நீடித்த தன்மையை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவரை
  rationale: சூழலில் இச்சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது; மரியாதை ஒருமையுடன் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: περιβεβλημένος
  choice: போர்த்திக்கொண்டு
  rationale: துணியை உடலில் சுற்றியோ போர்த்தியோ இருந்த நிலையை participle குறிக்கிறது; அதன் வடிவத்தை அளவுக்கு மீறி வரையறுக்காமல் “போர்த்திக்கொண்டு” கூறுகிறது.
- source_word: σινδόνα
  choice: ஒரு நார்த்துணியை
  rationale: σινδών என்பது மெல்லிய நாரால் நெய்யப்பட்ட துணி, விரிப்பு அல்லது ஆடை போன்ற பொருளைக் குறிக்கலாம். “நார்த்துணி” அதன் வடிவத்தைத் தேவையின்றி குறிப்பாக்காமல் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπὶ γυμνοῦ
  choice: வெற்று உடலின்மேல் … மட்டும்
  rationale: வேறு ஆடை எதுவுமின்றி அந்தத் துணி நேரடியாக உடல்மேல் இருந்தது என்பதை “வெற்று உடலின்மேல்” என்பதும் “மட்டும்” என்பதும் தெளிவாக வெளிப்படுத்துகின்றன.
- source_word: κρατοῦσιν
  choice: பிடிக்கிறார்கள்
  rationale: கிரேக்க மூலத்தின் நிகழ்கால வடிவம் கதையில் திடீர் உயிரோட்டம் தரும் historical present ஆகும்; அதனைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: இச்சுட்டுப்பெயர் புதிதாக அறிமுகப்படுத்தப்பட்ட இளைஞனைக் குறிக்கிறது.
