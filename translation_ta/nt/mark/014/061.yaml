source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: ta
  text: ஆனால் அவர் மௌனமாக இருந்தார்; பதில் எதுவும் கூறவில்லை. தலைமைக் குரு மீண்டும் அவரிடம் விசாரித்துக்கொண்டிருந்தார்; அவரிடம், “நீ மெசியாவா[a], ஆசீர்வதிக்கப்பட்டவரின் மகனா[b]?” என்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கிறிஸ்துவா?” கிரேக்கச் சொல்லான Χριστός (கிறிஸ்தோஸ்) இங்கு யூத மெசியா எதிர்பார்ப்புச் சூழலில் ஒரு பட்டமாக வருவதால் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “ஆசீர்வதிக்கப்பட்டவர்” என்பது கடவுளை மரியாதையுடன் குறிப்பிடும் யூத வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: மௌனமாகவே இருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலையை உணர்த்தும் வினைவடிவம், அவர் தொடர்ந்து மௌனமாக இருந்ததைச் சுட்டுகிறது; ‘மௌனமாகவே’ என்பது அந்த நீடிப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀπεκρίνατο οὐδέν
  choice: பதில் எதுவும் கூறவில்லை
  rationale: οὐδέν தரும் முழுமையான மறுப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: தலைமைக் குரு கேள்வி கேட்பது மறுபடியும் நிகழ்வதைக் குறிக்கிறது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூதர்களின் பிரதான குருத்துவப் பதவியைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: ἐπηρώτα
  choice: கேள்வி கேட்டுக்கொண்டே
  rationale: இறந்தகாலத் தொடர்நிலை வினைவடிவம் காட்டும் தொடர்ந்த அல்லது திரும்பத் திரும்பக் கேட்கும் செயலைப் பாதுகாக்கிறது.
- source_word: λέγει
  choice: என்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: χριστός
  choice: மெசியா
  rationale: யூத விசாரணைச் சூழலில் இது பெயராக அல்லாமல் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: ஆசீர்வதிக்கப்பட்டவரின் மகன்
  rationale: கடவுளை நேரடியாகப் பெயரிடாமல் மரியாதையுடன் குறிப்பிடும் யூத வழக்கை மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு தலைமைக் குருவின் கேள்வியில் இது யூத மெசியா எதிர்பார்ப்பைச் சுட்டும் பட்டமாக உள்ளது; ‘மெசியா’ அந்தச் சூழலையும் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- issue: τοῦ εὐλογητοῦ என்ற இறைமரியாதைச் சுற்றுவழக்கின் மொழிபெயர்ப்பு
  choice: ஆசீர்வதிக்கப்பட்டவர்
  alternative: கடவுள்
  rationale: மூலத்தில் ‘கடவுள்’ என்று நேரடியாக இல்லாததால், யூத மரியாதை வழக்கின் மறைமுகத் தன்மையை முதன்மை உரையில் பாதுகாக்கிறது.
- issue: ὁ χριστὸς மற்றும் ὁ υἱὸς τοῦ εὐλογητοῦ ஆகியவற்றின் உறவு
  choice: 'இரு இணையான கேள்விப் பட்டங்களாக அமைத்தல்: ‘மெசியாவா, ... மகனா?’'
  alternative: ‘ஆசீர்வதிக்கப்பட்டவரின் மகனாகிய மெசியாவா?’
  rationale: கிரேக்கத்தில் இரு சுட்டுப்பெயர்த் தொடர்களும் இணையாக நிற்கும் இலக்கண அமைப்பையும் அவற்றுக்கிடையிலான பொருள் நெருக்கத்தையும், ஒன்றை மற்றொன்றின் விளக்கமாக மட்டுமே தீர்மானிக்காமல், தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நீதிவிசாரணைச் சூழலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘என்கிறார்’ மூலம் மாற்குவின் வரலாற்று நிகழ்காலமும், ‘கேள்வி கேட்டுக்கொண்டே’ மூலம் தொடர்நிலை அம்சமும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
