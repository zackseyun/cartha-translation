revisions:
- from: ஆனால் அவர் மௌனமாகவே இருந்தார்; பதில் எதுவும் கூறவில்லை. தலைமைக் குரு மீண்டும் அவரிடம் கேள்வி கேட்டுக்கொண்டே, “நீ மெசியாவா[a], ஆசீர்வதிக்கப்பட்டவரின் மகனா[b]?” என்கிறார்.
