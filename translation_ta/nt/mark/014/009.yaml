source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: ta
  text: 'உறுதியாக நான் உங்களுக்குச் சொல்கிறேன்: உலகம் முழுவதிலும் நற்செய்தி[a] எங்கெல்லாம் அறிவிக்கப்படுமோ, அங்கெல்லாம் இந்தப் பெண் செய்ததும் அவளுடைய நினைவாக[b] சொல்லப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “சுவிசேஷம்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “அவளை நினைவுகூரும் வகையில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உறுதியாக
  rationale: இயேசுவின் கூற்றைத் தொடங்கும் ஆணித்தரமான உறுதிப்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மொழிபெயர்க்காமல் ‘ஆமென்’ என்று விடுவதைக் காட்டிலும் பொதுவாசகர்களுக்குத் தெளிவானது.
- source_word: δὲ
  choice: தமிழ் வாக்கிய ஓட்டத்தில் தனியாக வெளிப்படுத்தப்படவில்லை
  rationale: இது மென்மையான உரையாடல் இணைப்புச்சொல்; இங்கு தனிச் சொல்லாக மொழிபெயர்க்காமல் விடுவது இயல்பான தமிழுக்கு ஏற்றது, கருத்தையும் மாற்றாது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி அழைப்பையும் கூற்றின் ஆணித்தரத்தையும் தெளிவாகப் பேணும் இயல்பான தமிழ் நடை.
- source_word: ὅπου ἐὰν
  choice: எங்கெல்லாம் … அங்கெல்லாம்
  rationale: எந்த இடத்தில் அந்த நிபந்தனை நிறைவேறினாலும் என்ற பொதுவான, வரையறுக்கப்படாத இடப்பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κηρυχθῇ
  choice: அறிவிக்கப்படுமோ
  rationale: பொதுவெளியில் பிரகடனம் செய்யப்படுதல் என்ற வினையின் பொருளையும் கிரேக்கச் செயப்பாட்டு வடிவத்தையும் பேணுகிறது; ‘பிரசங்கிக்கப்படுமோ’ என்று குறுகிய சமயப் பயன்பாட்டுக்குள் கட்டுப்படுத்தவில்லை.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: கிரேக்கச் சொல்லின் அடிப்படைப் பொருளை நேரடியாகவும் இன்றைய வாசகருக்குத் தெளிவாகவும் தருகிறது; மரபுவழிச் சமயச் சொல்லான ‘சுவிசேஷம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: உலகம் முழுவதிலும்
  rationale: அறிவிப்பின் விரிந்த உலகளாவிய பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -தும்
  rationale: நற்செய்தி அறிவிக்கப்படுவதோடு இந்தப் பெண்ணின் செயலும் சொல்லப்படும் என்ற சேர்க்கைப் பொருளைத் தமிழ் இணைப்பு விகுதி இயல்பாகக் காட்டுகிறது.
- source_word: ὃ ἐποίησεν αὕτη
  choice: இந்தப் பெண் செய்ததும்
  rationale: பெண்பால் சுட்டுப்பெயரின் உடனடிச் சூழல் குறிப்பைத் தெளிவாக்குகிறது; கிரேக்க இறந்தகால வினை நிகழ்ந்த செயலை எளிமையாகச் சுட்டுகிறது.
- source_word: λαληθήσεται
  choice: சொல்லப்படும்
  rationale: அவளுடைய செயல் பிறரால் பேசப்பட்டு எடுத்துரைக்கப்படும் என்ற எதிர்காலச் செயப்பாட்டுப் பொருளை நேரடியாகப் பேணுகிறது.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: அவளுடைய நினைவாக
  rationale: அவளை நினைவுகூருதல் அல்லது அவளுக்கான நினைவுச்சின்னத் தன்மை ஆகியவற்றைத் தேவையின்றி மிகத் துல்லியப்படுத்தாமல், மூலத்தின் நினைவு சார்ந்த பொருளைச் சுருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: உலகளாவிய அறிவிப்பைக் குறிக்கும் εὐαγγέλιον என்பதன் மொழிபெயர்ப்பு
  choice: நற்செய்தி
  alternative: சுவிசேஷம்
  rationale: ‘நற்செய்தி’ என்பது மூலச்சொல்லின் பொருளைத் தெளிவாக வழங்குகிறது. கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற ‘சுவிசேஷம்’ என்ற மாற்றும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது; எந்தக் குறிப்பிட்ட திருச்சபை மரபின் தனிப்பொருளும் திணிக்கப்படவில்லை.
- issue: αὕτη என்பவரை வெளிப்படையாக அடையாளப்படுத்துதல்
  choice: இந்தப் பெண்
  alternative: இவள்
  rationale: கிரேக்க வடிவம் பெண்பால் ஒருமைச் சுட்டுப்பெயராக இருந்து உடனடி நிகழ்விலுள்ள பெண்ணைக் குறிக்கிறது. ‘இந்தப் பெண்’ என்பது சூழலைத் தெளிவுபடுத்தினாலும் கூடுதல் விளக்கத்தை இறக்குமதி செய்யாது.
- issue: εἰς μνημόσυνον αὐτῆς என்பதிலுள்ள நினைவு/நினைவுச்சின்ன நுட்பம்
  choice: அவளுடைய நினைவாக
  alternative: அவளை நினைவுகூரும் வகையில்
  rationale: மூலத்தில் உள்ள பெயர்ச்சொல் அமைப்பையும் அதன் நோக்கம் அல்லது விளைவு சார்ந்த சிறிய திறந்தநிலையையும் முதன்மை வாசகம் பேணுகிறது; அதிக விளக்கமுள்ள வினைநடை மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பானதாயும் மதிப்புமிக்கதாயும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘எங்கெல்லாம் … அங்கெல்லாம்’ என்ற இணை அமைப்பு கிரேக்கத்தின் பொதுவான இடநிபந்தனையைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
