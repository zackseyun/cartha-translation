source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: ta
  text: அவர்கள் அதைக் கேட்டபோது மகிழ்ச்சியடைந்து, அவனுக்குப் பணம்[a] கொடுப்பதாக வாக்குறுதி அளித்தார்கள். அவனும் அவரைத் தகுந்த வாய்ப்பில் எப்படிக் காட்டிக்கொடுக்கலாம்[b] என்று வழி தேடிக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளி.’ கிரேக்கச் சொல் வெள்ளி உலோகத்தையோ, பொதுவாகப் பணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒப்படைக்கலாம்.’ கிரேக்க வினை ‘ஒப்படை’ அல்லது ‘கையளி’ என்று பொருள்படலாம்; யூதாஸ் சம்பந்தப்பட்ட இத்துரோகச் சூழலில் ‘காட்டிக்கொடுக்க’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: அவர்கள் அதைக் கேட்டபோது
  rationale: பெயரெச்சத் தொடரின் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், முந்தைய சூழலைச் சுட்டும் வகையில் ‘அதை’ என்று தமிழுக்குத் தேவையான அளவில் நிரப்பப்பட்டுள்ளது.
- source_word: ἐχάρησαν
  choice: மகிழ்ச்சியடைந்து
  rationale: அவர்கள் கேட்ட செய்திக்கு ஏற்பட்ட மகிழ்ச்சியான எதிர்வினையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: அவனுக்குப் பணம் கொடுப்பதாக வாக்குறுதி அளித்தார்கள்
  rationale: ἐπαγγέλλομαι என்பதன் உறுதியளித்தல் என்ற பொருளையும், ἀργύριον என்பதன் இச்சூழலுக்குரிய பொதுவான ‘பணம்’ என்ற பொருளையும் காக்கிறது; தொகையையோ நாணய வகையையோ சேர்க்கவில்லை.
- source_word: ἀργύριον
  choice: பணம்
  rationale: இச்சொல் சொல்லடிப்படையில் ‘வெள்ளி’ எனப் பொருள்படலாம்; ஆனால் கொடுக்கப்படும் கூலியைச் சுட்டும் இச்சூழலில் நவீன தமிழில் ‘பணம்’ என்பது தெளிவான இயல்பான தெரிவு. ‘வெள்ளி’ அடிக்குறிப்பில் மாற்றாகக் காக்கப்படுகிறது.
- source_word: ἐζήτει
  choice: வழி தேடிக்கொண்டிருந்தான்
  rationale: இறந்தகால முற்றுப்பெறாத வினையின் தொடர்ச்சியான முயற்சியை ‘தேடிக்கொண்டிருந்தான்’ வெளிப்படுத்துகிறது; ‘வழி’ என்பது πῶς உடன் சேர்ந்த தமிழ்ச் சொல்லாக்கத்திற்கான இயல்பான நிறைவு.
- source_word: πῶς
  choice: எப்படி … என்று
  rationale: செயலை நிறைவேற்றும் முறை அல்லது வழியை நேரடியாகக் குறிக்கிறது.
- source_word: εὐκαίρως
  choice: தகுந்த வாய்ப்பில்
  rationale: செயலைச் செய்வதற்கு ஏற்ற அல்லது சாதகமான சந்தர்ப்பம் என்ற பொருளைத் தருகிறது; வசனத்தில் இல்லாத கூடுதல் சூழ்நிலைகளைச் சேர்க்கவில்லை.
- source_word: παραδοῖ
  choice: காட்டிக்கொடுக்கலாம்
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’; யூதாஸ் இயேசுவின் எதிரிகளுடன் இரகசியமாக ஒத்துழைக்கும் இச்சூழலில், துரோகச் செயலை நவீன தமிழில் இயல்பாக ‘காட்டிக்கொடுத்தல்’ தெரிவிக்கிறது.
theological_decisions:
- issue: யூதாஸின் செயலில் παραδίδωμι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுக்க
  alternative: ஒப்படைக்க
  rationale: உடனடிக் கதைச்சூழலில் இது நடுநிலையான ஒப்படைப்பு அல்ல, இயேசுவின் எதிரிகளுக்கு அவரைக் காட்டிக்கொடுக்கும் துரோகச் செயல். இருப்பினும் கிரேக்க வினையின் பரந்த, நேரடியான பொருளான ‘ஒப்படைக்க’ அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவன்’ என்பது முந்தைய சூழலில் உள்ள யூதாஸையும், ‘அவர்’ என்பது இயேசுவையும் தெளிவாக வேறுபடுத்தும் தமிழ்ச் சிறப்பை பயன்படுத்துகிறது. மூலத்தில் உள்ள தொடர்ச்சியான தேடலையும், παραδίδωμι என்பதிலுள்ள ‘ஒப்படைத்தல்/துரோகம் செய்தல்’ என்ற பொருள் இழுவையையும் உரை மற்றும் அடிக்குறிப்பு இணைந்து காக்கின்றன.
