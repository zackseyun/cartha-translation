source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: ta
  text: சிலர் அவர்மேல் துப்பவும், அவருடைய முகத்தை மூடவும்[a], அவரை முஷ்டிகளால் தாக்கவும், அவரிடம், “தீர்க்கதரிசனம் சொல்!” என்று கூறவும் தொடங்கினார்கள். காவலர்களும் அவரை அடிகளால் தாக்கினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் கண்கட்டவும்.” கிரேக்கத்தில் நேரடியாக, “அவருடைய முகத்தை மூடவும்” என்றுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் நேரடியாக, “காவலர்கள் அவரை அடிகளால் ஏற்றுக்கொண்டார்கள்” என்றுள்ளது; இது அவரை அடிகளால் நடத்தினார்கள் அல்லது தாக்கினார்கள் என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: சிலர் … தொடங்கினார்கள்
  rationale: குறிப்பிடப்படாத சிலரைக் குறிக்கும் τινες என்பதையும், தொடர்ச்சியான செயல்களின் தொடக்கத்தைக் காட்டும் ἤρξαντο என்பதையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐμπτύειν αὐτῷ
  choice: அவர்மேல் துப்பவும்
  rationale: தத்திவ வேற்றுமையுடன் வரும் வினை, நேரடியாக அவர்மீது துப்பி அவமதித்த செயலைக் குறிக்கிறது.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: அவருடைய முகத்தை மூடவும்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடிப் பொருளைப் பாதுகாக்கிறது; இது கண்களைக் கட்டிய செயலைக் குறிக்கலாம் என்பதைக் குறிப்பில் தருகிறது.
- source_word: κολαφίζειν αὐτὸν
  choice: அவரைக் கைகளால் குத்தவும்
  rationale: κολαφίζω பொதுவாக முஷ்டியால் தாக்குவதைக் குறிக்கிறது. பொதுவான ‘அடிக்க’ என்பதைவிட ‘கைகளால் குத்த’ அதன் தனிப்பட்ட வன்முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: λέγειν αὐτῷ· Προφήτευσον
  choice: அவரிடம், “தீர்க்கதரிசனம் சொல்!” என்று கூறவும்
  rationale: விளக்கச் சொற்களைச் சேர்க்காமல், கேலியாகச் சொல்லப்பட்ட வெறும் கட்டளையைப் பாதுகாக்கிறது.
- source_word: οἱ ὑπηρέται
  choice: காவலர்கள்
  rationale: இந்த நீதித்துறைச் சூழலில் இது வீட்டு வேலைக்காரர்களை அல்ல, கீழ்நிலை அதிகாரிகளாகச் செயல்பட்ட காவலர்களைக் குறிக்கிறது.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: அவரை அடித்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அடிகளால் அவரை ஏற்றுக்கொண்டார்கள்’ என்பது தமிழில் இயல்பற்றதும் தவறாகப் புரியக்கூடியதும் ஆகும். சூழலில் குறிக்கப்படும் தாக்குதலை இயல்பான தமிழில் தருகிறது; மூலத்தின் அபூர்வமான அமைப்பு குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Προφήτευσον என்ற கேலிக் கட்டளையை இயேசுவின் அடையாளத்தோடு தொடர்புபடுத்தி மொழிபெயர்த்தல்
  choice: “தீர்க்கதரிசனம் சொல்!”
  alternative: “உன்னை அடித்தது யார் என்று தீர்க்கதரிசனமாகச் சொல்!” / “நீ ஒரு தீர்க்கதரிசி என்று காட்டு!”
  rationale: மூல வசனம் வெறும் கட்டளையை மட்டுமே தருகிறது. இணை நிகழ்வுகளிலிருந்து விளக்கத்தைச் சேர்க்காமல் இருப்பது கேலியையும் கதைசார் இறையியல் நையாண்டியையும் அதன் தீர்க்கப்படாத வடிவிலேயே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வன்முறையின் குறிப்பான தன்மை மறைக்கப்படவில்லை; அதேவேளையில் கிரேக்கத்தில் இல்லாத விளக்கமோ இறையியல் விரிவாக்கமோ சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய முதன்மை உரைப்பகுதியில் இடம்பெற்றுள்ளன.
