  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: ta
  text: '“உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: தேவனுடைய அரசாட்சியில் நான் அதை புதிதாய்[c] குடிக்கும் அந்த நாள் வரும்வரை, திராட்சைக்கொடியின் கனியிலிருந்து[b] இனி நிச்சயமாகக் குடிக்கவே மாட்டேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இனி ஒருபோதும் திராட்சைக்கொடியின் கனியிலிருந்து குடிக்கமாட்டேன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் மிகவும் வலியுறுத்தப்பட்ட மறுப்பு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு கிரேக்கத்தில் உள்ள சொற்றொடர் ‘திராட்சைக்கொடியின் கனி’; சூழலில் அது விருந்தின்போது பயன்படுத்தப்பட்ட திராட்சைக்கொடியிலிருந்து கிடைத்த பானத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘மறுபடியும் குடிக்கும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயரடை ‘புதியது’ என்று பொருள்படும்; இறுதிக்காலப் புதிய தன்மையையும் அது உணர்த்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உறுதியான அறிவிப்புச் சூத்திரத்தைத் தெளிவான, இயல்பான நவீனத் தமிழில் தருகிறது; ‘ஆமென்’ என்ற ஒலிபெயர்ப்பைவிடப் பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: இனி நிச்சயமாகக் குடிக்கவே மாட்டேன்
  rationale: οὐκέτι என்பதன் ‘இனி இல்லை’ என்ற காலப் பொருளையும், οὐ μὴ என்பதன் வலியுறுத்தப்பட்ட எதிர்கால மறுப்பையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: திராட்சைக்கொடியின் கனியிலிருந்து
  rationale: கிரேக்கச் சொற்றொடரின் உருவகத்தையும் பரப்பையும் தக்கவைக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘திராட்சரசம்’ என்ற குறிப்பான சொல்லைச் சேர்ப்பதில்லை.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: அந்த நாள் வரும்வரை
  rationale: எதிர்நோக்கப்படும் குறிப்பிட்ட நாளைக் குறிக்கும் சுட்டுப்பெயரின் வலிமையுடன் இயல்பான தமிழில் தருகிறது.
- source_word: ὅταν αὐτὸ πίνω
  choice: நான் அதை … குடிக்கும்
  rationale: αὐτό முன் குறிப்பிடப்பட்ட பானத்தைக் குறிக்கிறது; ὅταν உடனான நிகழ்கால வினை எதிர்கால நிகழ்வைக் குறிப்பதைத் தமிழ் சார்புவாக்கியம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καινὸν
  choice: புதிதாய்
  rationale: ‘புதிய தன்மையில்’ அல்லது ‘மறுபடியும்’ என்ற இரு சாத்திய நிழல்களையும் முற்றிலும் முடிவுசெய்யாமல், καινός என்பதன் புதிய தன்மை குறித்த அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: தேவனுடைய அரசாட்சியில்
  rationale: βασιλεία என்பதன் ஆட்சி/அரசுரிமை நுணுக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் இடப்பரப்பாக மட்டும் பொருள்கொள்ளச் செய்வதைத் தவிர்க்கிறது.
theological_decisions:
- issue: καινὸν என்பதன் பொருள்
  choice: ‘புதிதாய்’ என்று திறந்த நிலையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மறுபடியும்’ அல்லது ‘புதிய தன்மையுடன்’
  rationale: இச்சொல் மீண்டும் குடிப்பதையோ, இறையாட்சியில் வரும் தரப்புதிய தன்மையையோ சுட்டக்கூடும்; வசனம் அதன் முறையைத் தெளிவாக வரையறுக்காததால் அந்த இறுதிக்காலத் திணறலை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: ‘திராட்சைக்கொடியின் கனி’ என்பதன் குறிப்பு
  choice: மூலச் சொற்றொடர் தக்கவைக்கப்பட்டது.
  alternative: ‘திராட்சரசம்’
  rationale: சூழலில் இது விருந்தின் பானத்தைக் குறிப்பது தெளிவாக இருந்தாலும், கிரேக்கம் பானத்தை நேரடியாக ‘திராட்சரசம்’ என்று குறிப்பிடவில்லை.
- issue: தேவனுடைய βασιλεία
  choice: ‘தேவனுடைய அரசாட்சி’
  alternative: ‘தேவனுடைய ராஜ்யம்’ அல்லது ‘தேவனுடைய அரசு’
  rationale: இங்கு எதிர்நோக்கப்படும் இறுதிக்கால உண்மையை இடமாக மட்டும் சுருக்காமல், தேவனுடைய ஆட்சியையும் அரசுரிமையையும் எடுத்துரைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் நேரடியும் கண்ணியமுமான நடை பயன்படுத்தப்பட்டது. ‘குடிக்கவே மாட்டேன்’ என்பது வலியுறுத்தப்பட்ட மறுப்பை இயல்பாகக் காட்டுகிறது; ‘அரசாட்சி’ என்பது பாரம்பரியச் சொல்லாட்சியை மட்டும் சாராமல் βασιλεία என்பதன் ஆட்சி நுணுக்கத்தை வெளிப்படுத்துகிறது.
