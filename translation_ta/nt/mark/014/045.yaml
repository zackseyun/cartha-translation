revisions:
- from: அவன் வந்ததும், உடனே அவரிடம் சென்று, “ரபீ!” என்று சொல்லி, அவரை முத்தமிட்டுக்கொண்டான்[a].
  to: அவன் வந்ததும், உடனே அவரிடம் சென்று, “ரபீ!” என்று சொல்லி, அவரை முத்தமிட்டான்[a].
  rationale: The revision replaces the aspectually marked Tamil form with the neutral «முத்தமிட்டான்» and retains the possible intensive nuances in a footnote. This reflects the emphatic yet semantically disputed force of καταφιλέω without presenting repetition or affection as certain. All other wording faithfully and naturally represents the Greek text.
