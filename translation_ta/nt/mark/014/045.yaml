source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: ta
  text: அவன் வந்ததும், உடனே அவரிடம் சென்று, “ரபீ!” என்று சொல்லி, அவரை முத்தமிட்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் திரும்பத் திரும்ப முத்தமிட்டான்” அல்லது “அவரை அன்போடு முத்தமிட்டான்”; கிரேக்க வினைச்சொல் சாதாரணமான “முத்தமிட்டான்” என்பதைக் காட்டிலும் வலிமையானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: அவன் வந்ததும்
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு காலத் தொடர்பைக் காட்டுகிறது; நிகழ்வுகளின் வரிசையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்கு நற்செய்தியில் விரைவான கதைநகர்வைக் குறிக்கும் இச்சொல்லுக்கு தெளிவான, இயல்பான தமிழ் இணை.
- source_word: προσελθὼν αὐτῷ
  choice: அவரிடம் சென்று
  rationale: இயேசுவை நோக்கி உடலளவில் அணுகியதை இயல்பாகக் கூறுகிறது; முந்தைய ‘வந்ததும்’ என்பதுடன் தேவையற்ற சொல் மறுபதிப்பைத் தவிர்க்கிறது.
- source_word: λέγει
  choice: என்று சொல்லி
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ்க் கதைநடையில் இறந்தகாலத் தொடரமைப்பு இயல்பாக உள்ளது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: கிரேக்க உரையே ஒலிபெயர்த்து வழங்கும் செமித்திய அழைப்புப்பட்டத்தைத் தக்கவைத்து, காட்சியின் வரலாற்று மற்றும் பண்பாட்டுச் சூழலைப் பாதுகாக்கிறது.
- source_word: κατεφίλησεν
  choice: முத்தமிட்டுக்கொண்டான்
  rationale: சாதாரண ‘முத்தமிட்டான்’ என்பதைவிட வலியுறுத்தப்பட்ட அல்லது நீடித்த/மீளச்செய்யப்பட்ட முத்தத்தைக் குறிக்கும் கூட்டு வினையின் வலிமையைத் தமிழில் சுருக்கமாக உணர்த்துகிறது; அதன் துல்லிய நுணுக்கம் அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
theological_decisions:
- issue: யூதாஸ் பயன்படுத்திய Ῥαββί என்ற அழைப்பை மொழிபெயர்த்தல்
  choice: ரபீ
  alternative: போதகரே
  rationale: காட்சியில் பயன்படுத்தப்பட்ட செமித்தியப் பட்டத்தைப் பாதுகாப்பது வரலாற்றுத் தன்மையையும் நிகழ்விலுள்ள நையாண்டித் தொனியையும் தக்கவைக்கிறது; தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ என்பதும், யூதாஸைக் குறிக்க ‘அவன்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் வேகமான நிகழ்வுவரிசை காக்கப்பட்டுள்ளது.
