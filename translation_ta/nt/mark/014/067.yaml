  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: ta
  text: பேதுரு குளிர்காய்ந்துகொண்டிருப்பதை அவள் கண்டு, அவரை உற்றுப் பார்த்து, “நீயும் நாசரேத்தனாகிய இயேசுவோடு இருந்தாய்” என்று சொல்கிறாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: குளிர்காய்ந்துகொண்டிருப்பதை
  rationale: நெருப்பருகே உடலைச் சூடாக்கிக்கொண்டிருந்த செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐμβλέψασα αὐτῷ
  choice: அவரை உற்றுப் பார்த்து
  rationale: சாதாரணமாகப் பார்ப்பதைக் காட்டிலும் கூர்ந்து நோக்கும் பொருளைத் தக்கவைக்கிறது.
- source_word: λέγει
  choice: சொல்கிறாள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, காட்சியின் உடனடித் தன்மையை வெளிப்படுத்துகிறது.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: நாசரேத்தனாகிய இயேசுவோடு
  rationale: இயேசுவை நாசரேத்தோடு அடையாளப்படுத்தும் மூலத்தின் சொல்லமைப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: Καὶ σὺ என்ற குற்றச்சாட்டின் வலிமை
  choice: நீயும் ... இருந்தவன்தானே
  alternative: நீயும் ... இருந்தாய்
  rationale: இது வெறும் கூற்றாகவும் மறைமுக வினாவாகவும் கேட்கக்கூடியது; தமிழில் இயல்பான குற்றஞ்சாட்டும் தொனியை அளித்தாலும் கேள்விக்குறி சேர்த்து பொருளை முழுமையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையுடன், கதைசொல்லலின் வரலாற்று நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது.
