base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: ta
  text: அவளால் முடிந்ததை அவள் செய்தாள்[a]; என் அடக்கத்திற்காக என் உடலில் நறுமணப் பொருளைப் முன்னதாகவே பூசினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘அவளிடம் இருந்ததை அவள் செய்தாள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: அவளால் முடிந்ததை அவள் செய்தாள்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘அவளிடம் இருந்ததை அவள் செய்தாள்’ எனலாம். ஆனால் இந்தக் கிரேக்க மரபுத்தொடர், அவள் தன்னால் இயன்றதைச் செய்தாள் என்ற பொருளைச் சூழலில் தருகிறது; இயல்பான நவீனத் தமிழில் அதையே முதன்மை உரை வெளிப்படுத்துகிறது.
- source_word: προέλαβεν
  choice: முன்னதாகவே
  rationale: அடக்கத்திற்கு முன்பே இச்செயலைச் செய்துவிட்டாள் என்ற கால முன்னுரிமையைத் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தில் இல்லாத வருகை அல்லது இயக்கப் பொருளைச் சேர்க்கவில்லை.
- source_word: μυρίσαι
  choice: நறுமணத் தைலம் பூசினாள்
  rationale: μυρίζω என்பது நறுமணப் பொருள் அல்லது தைலத்தை உடலில் பூசுவதைக் குறிக்கிறது. ‘அபிஷேகம் செய்தாள்’ என்பதைக் காட்டிலும் இது இவ்வடக்க ஆயத்தச் சூழலில் தெளிவாகவும் சமயப் பிரிவுசார் மேல்பொருள் இன்றியும் உள்ளது.
- source_word: τὸ σῶμά μου
  choice: என் உடலை
  rationale: நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: அடக்கம் செய்வதற்காக
  rationale: இச்சொற்றொடரின் நோக்கப் பொருளைத் தெளிவாக எடுத்துரைக்கிறது; நவீனத் தமிழில் பொதுவாகப் புரியும் நடை.
theological_decisions:
- issue: இவ்வாக்கியத்தில் வெளிப்படையாக இல்லாத பெண்பால் எழுவாயைச் சூழலிலிருந்து குறிப்பிடுதல்
  choice: ‘அவள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: எழுவாயை விடுத்து, ‘முடிந்ததைச் செய்தாள்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்க வினை வடிவங்கள் மூன்றாம் நபர் ஒருமையைக் காட்டினாலும் பாலைக் காட்டவில்லை; உடனடி சூழல் அந்தப் பெண்ணையே சுட்டுகிறது. தமிழில் ‘அவள்’ என்பதைக் கொடுப்பது தெளிவையும் இயல்பையும் தருகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: ὃ ἔσχεν என்பதிலுள்ள சொல்லடிப்படை மற்றும் மரபுத்தொடர்ப் பொருளுக்கு இடையிலான பதற்றம்
  choice: முதன்மை உரையில் ‘அவளால் முடிந்ததை’
  alternative: ‘அவளிடம் இருந்ததை’
  rationale: முதன்மை உரை சூழலில் இயல்பான திறன்/வாய்ப்பு சார்ந்த பொருளைத் தருகிறது; சொல்லடிப்படையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நறுமணத் தைலம் பூசினாள்’ என்பது அடக்க ஆயத்தச் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘அபிஷேகம்’ போன்ற தேவையற்ற சமயத் தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
