  text: And not even in this way was their testimony consistent[a].
translation:
  language: ta
  text: அப்படியும்கூட அவர்களுடைய சாட்சிகள் ஒன்றுக்கொன்று ஒத்துப்போகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய சாட்சிகள் உடன்படவில்லை”; இன்னும் சொற்சொல்லாக, “அவர்களுடைய சாட்சி சமமாக இருக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: அப்படிச் சொல்லியும் ... ஒத்துப்போகவில்லை
  rationale: καὶ என்பது முந்தைய நிகழ்வோடு வாக்கியத்தை இணைக்கிறது; οὐδὲ வலியுறுத்திய மறுப்பைக் காட்டுகிறது. தமிழில் ‘-உம் ... இல்லை’ அமைப்பு இந்த இணைப்பையும் ‘அப்படியும்கூட இல்லை’ என்ற அழுத்தத்தையும் இயல்பாகத் தருகிறது.
- source_word: οὕτως
  choice: அப்படிச் சொல்லியும்
  rationale: முந்தைய வசனத்தில் அவர்கள் கூறிய குற்றச்சாட்டின் வடிவத்தை இது சுட்டுகிறது. ‘அப்படி’ என்பதைக் காட்டிலும் ‘அப்படிச் சொல்லியும்’ என்பது சூழலைத் தெளிவாக்குகிறது; புதிதான பொருளைச் சேர்ப்பதில்லை.
- source_word: ἴση
  choice: ஒன்றுக்கொன்று ஒத்துப்போகவில்லை
  rationale: இதன் நேரடிப் பொருள் ‘சமமாக’ என்பதாக இருந்தாலும், பல சாட்சிகளின் வாக்குமூலங்களைப் பற்றிய நீதிசார் சூழலில் அவை ஒன்றோடொன்று ஒத்திருந்தனவா என்பதே கருத்து. இந்தத் தமிழ் நடை அந்தச் சூழல்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ μαρτυρία αὐτῶν
  choice: அவர்களுடைய சாட்சி
  rationale: μαρτυρία ஒருமையில் இருந்தாலும், αὐτῶν உடன் இங்கு சாட்சிகளின் கூட்டு வாக்குமூலத்தைக் குறிக்கிறது. ‘அவர்களுடைய சாட்சி’ என்பது வடிவத்தையும் நீதிசார் பொருளையும் காக்கிறது.
- source_word: ἦν
  choice: ஒத்துப்போகவில்லை
  rationale: εἰμί என்பதன் இறந்தகாலத் தொடர்நிலை, தமிழில் நிலையைச் சுட்டும் எதிர்மறை வினைமுற்றுக்குள் இயல்பாக வெளிப்படுகிறது.
