  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: ta
  text: மாலை வந்தபோது, அவர் பன்னிருவருடன்[a] வருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பன்னிருவர்’ என்பது இயேசுவின் அப்போஸ்தலர் குழுவுக்கான நிலையான பெயராகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் வசனத் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்பொழுது’ சேர்ப்பது தேவையற்றதாகவும் சற்றே விளக்கவுரையாகவும் இருக்கும். நிகழ்வின் தொடர்ச்சியை வாக்கிய அமைப்பே இயல்பாக உணர்த்துகிறது.
- source_word: ὀψίας γενομένης
  choice: மாலையானபோது
  rationale: இந்த மரபுத்தொடர் காலச் சூழலைக் குறிக்கும் genitive absolute ஆகும். ‘மாலையானபோது’ என்பது அதன் காலப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, மாற்குவின் உயிரோட்டமான கதைநடையைத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: μετὰ τῶν δώδεκα
  choice: பன்னிருவருடன்
  rationale: μετά + genitive உடனிருப்பைக் குறிக்கிறது. ‘பன்னிருவர்’ என்பது ‘சீடர்கள்’ அல்லது ‘அப்போஸ்தலர்கள்’ என்று விளக்கமாக விரிவுபடுத்தாமல், இயேசுவின் அந்தக் குறிப்பிட்ட குழுவைக் குறிக்கும் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘பன்னிருவர்’ என்பதன் குறிப்பு
  choice: இந்நேரத்தில் யூதாசும் உட்பட்ட இயேசுவின் நெருங்கிய பன்னிருவர் குழு
  alternative: ‘பன்னிரு சீடர்கள்’ அல்லது ‘பன்னிரு அப்போஸ்தலர்கள்’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: கதைச்சூழலில் குறிக்கப்படுவது இயேசுவின் பன்னிருவர் குழுவே. ஆயினும், மூலத்தில் இல்லாத ‘சீடர்கள்’ அல்லது ‘அப்போஸ்தலர்கள்’ என்ற சொல்லைச் சேர்க்காமல் அதன் சுருக்கமும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வருகிறார்’ என்பது கிரேக்க வரலாற்று நிகழ்காலத்தை நோக்கமுடன் தக்கவைக்கிறது. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், ஆங்கிலத்தில் உள்ள ‘the twelve’ / ‘the Twelve’ வேறுபாடு அடிக்குறிப்பில் பொருளடிப்படையில் விளக்கப்பட்டுள்ளது.
