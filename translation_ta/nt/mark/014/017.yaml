  terminology: ‘பன்னிருவர்’ appropriately preserves the concise, recognized narrative designation without adding ‘சீடர்கள்’ or ‘அப்போஸ்தலர்கள்.’ The footnote should use more idiomatic wording than ‘நிலைபெற்ற பெயர்.’
