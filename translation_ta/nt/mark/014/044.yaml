source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: ta
  text: அவரைக் காட்டிக்கொடுத்தவன் அவர்களுக்கு முன்பே ஓர் அடையாளத்தை[a] கொடுத்திருந்தான். அவன், “நான் யாரை முத்தமிடுகிறேனோ[b], அவர்தான். அவரைப் பிடித்து, பத்திரமாக அழைத்துச் செல்லுங்கள்[c]” என்று சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சைகை.” கிரேக்கச் சொல், ஒருவரை அடையாளம் காட்டுவதற்காக முன்கூட்டியே ஒப்புக்கொள்ளப்பட்ட அடையாளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: முத்தமிடுவது அக்காலத்தில் வழக்கமான வாழ்த்துதல் முறையாக இருந்தது; இங்கு யூதாஸ் இயேசுவை அடையாளம் காட்ட அதைப் பயன்படுத்துகிறான்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “பாதுகாப்பாக அழைத்துச் செல்லுங்கள்.” இச்சூழலில், அவர் தப்பிவிடாதபடி உறுதியான காவலில் அழைத்துச் செல்வதே பெரும்பாலும் பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: முன்பே ... கொடுத்திருந்தான்
  rationale: இறந்தகாலத்தில் இதற்கு முன்பே ஏற்பாடு செய்யப்பட்டிருந்ததை உணர்த்தும் கிரேக்க முற்றிறந்தகால வினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: அவரைக் காட்டிக்கொடுக்கிறவன்
  rationale: இங்கு παραδίδωμι என்பது இயேசுவை எதிரிகளிடம் ஒப்படைக்கும் துரோகச் செயலைக் குறிக்கிறது; பெயரெச்சத் தொடரின் வடிவமும் தமிழில் இயன்றவரை காக்கப்படுகிறது.
- source_word: σύσσημον
  choice: ஓர் அடையாளம்
  rationale: முன்கூட்டியே ஒப்புக்கொள்ளப்பட்ட அடையாளச் சைகையை இச்சொல் குறிக்கிறது. தமிழ் வாசகருக்கு இயல்பான ‘அடையாளம்’ பயன்படுத்தப்பட்டு, குறிப்பான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: Ὃν ἂν φιλήσω
  choice: நான் யாரை முத்தமிடுகிறேனோ
  rationale: ἄν உடனான வரையறையற்ற தொடர்புத் தொடரின் அடையாளம் காட்டும் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: αὐτός ἐστιν
  choice: அவர்தான் அவர்
  rationale: αὐτός தரும் வலியுறுத்தப்பட்ட அடையாளப்படுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: κρατήσατε
  choice: அவரைப் பிடித்து
  rationale: வலுக்கட்டாயமாகப் பற்றிப் பிடிக்கும் உடனடி செயலைக் காட்டுகிறது; மூலத்தில் இல்லாத சட்ட நடைமுறை சார்ந்த நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: பாதுகாப்புடன் அழைத்துச் செல்லுங்கள்
  rationale: ἀπάγω என்பதன் ‘அங்கிருந்து அழைத்துச் செல்’ என்ற பொருளையும், ἀσφαλῶς என்பதில் உள்ள பாதுகாப்பாக அல்லது தப்பவிடாத உறுதியுடன் என்ற பொருள் வரம்பையும் மிகையாகத் தீர்மானிக்காமல் தக்கவைக்கிறது.
