translation_notes:
  register: நவீன பொதுத்தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரை கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்கு தெளிவானதாகவும் உள்ளது. கிரேக்க முற்றிறந்தகாலத்தின் முன்னிகழ்வை ‘முன்பே ... கொடுத்திருந்தான்’ என வெளிப்படுத்துவதற்கும், நேரடி உரையைத் தெளிவாக அமைப்பதற்கும் மூலத்தின் ஒரே வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
