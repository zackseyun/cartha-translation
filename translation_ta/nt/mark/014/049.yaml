  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: ta
  text: நாள்தோறும் நான் ஆலய வளாகத்தில்[a] உங்களோடு இருந்து போதித்துக்கொண்டிருந்தேன்; நீங்கள் என்னைப் பிடிக்கவில்லை[b]. ஆனால் வேதவாக்குகள் நிறைவேறுவதற்காகவே இது நடந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “ஆலயம்” என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்ல, ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “என்னைக் கைதுசெய்யவில்லை.”
    reason: lexical_alternative
  - marker: c
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “ஆனால் வேதவாக்குகள் நிறைவேறும்படியாக.” கிரேக்க வாக்கியத்தில் முதன்மை வினை சொல்லப்படாமல் விடப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ச்சியாக நடந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: நான் உங்களோடு இருந்து
  rationale: இயேசு அவர்களுடைய முன்னிலையில் வெளிப்படையாக இருந்தார் என்ற உறவுசார் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலயத்தின் முழு வளாகத்தையும் குறிக்கிறது; தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: διδάσκων
  choice: போதித்துக்கொண்டிருந்தேன்
  rationale: நிகழ்ந்துகொண்டிருந்த தொடர்ச்சியான போதனைச் செயலைப் பங்கேற்புவினையின் தன்மைக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: οὐκ ἐκρατήσατέ με
  choice: நீங்கள் என்னைப் பிடிக்கவில்லை
  rationale: κρατέω என்பதிலுள்ள உடலால் பற்றிப்பிடித்தல் மற்றும் கைது செய்தல் ஆகிய இரு சாத்தியங்களையும் மிகையாகக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: ἀλλ’ ἵνα πληρωθῶσιν
  choice: ஆனால் ... நிறைவேறுவதற்காகவே இது நடந்தது
  rationale: கிரேக்கத்தில் விடப்பட்டுள்ள முதன்மை வினையைத் தமிழின் இயல்புக்காகக் குறைந்த அளவில் நிரப்பி, நோக்கம் அல்லது விளைவு சார்ந்த ἵνα அமைப்பைப் பாதுகாக்கிறது.
- source_word: αἱ γραφαί
  choice: வேதவாக்குகள்
  rationale: இஸ்ரவேலின் அதிகாரப்பூர்வமான புனித எழுத்துகளைச் சுட்டும் பன்மைச் சொல்லை நவீனத் தமிழில் பரவலாகப் புரியும் வகையில் வழங்குகிறது.
theological_decisions:
- issue: விடுபட்டுள்ள நோக்கக் கூற்றும் இறைநோக்கமும்
  choice: ஆனால் வேதவாக்குகள் நிறைவேறுவதற்காகவே இது நடந்தது
  alternative: ஆனால் வேதவாக்குகள் நிறைவேறும்படியாக
  rationale: ἀλλ’ ἵνα என்பதற்குப் பின் கிரேக்கத்தில் முதன்மை வினை வெளிப்படையாக இல்லை. தமிழில் முழுமையான வாக்கியம் அமைய ‘இது நடந்தது’ எனச் சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; அதேவேளை நிகழ்வுகள் வேதவாக்குகளின்படி நிறைவேறுகின்றன என்ற கருத்தைத் தாண்டி கடுமையான நிர்ணயவாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘ஆலய வளாகம்’ வரலாற்று இடவியல் துல்லியத்தையும், ‘பிடிக்கவில்லை’ மூலச்சொல்லின் பரந்த பொருள் வரம்பையும் காக்கின்றன; கிரேக்கத்தின் விடுபட்ட வினை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
