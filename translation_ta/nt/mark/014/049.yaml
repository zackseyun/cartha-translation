  terminology: “ஆலய வளாகம்” suitably represents ἱερόν as the temple complex, and “வேதவாக்குகள்” is an established, understandable rendering for the sacred Scriptures in this context. “பிடிக்கவில்லை,” supported by its arrest alternative note, preserves κρατέω without prematurely limiting it to a technical legal sense.
  issues:
