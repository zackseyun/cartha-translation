source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: ta
  text: ஆனால் இயேசு, “அவளை விட்டுவிடுங்கள். ஏன் அவளுக்குத் தொல்லை கொடுக்கிறீர்கள்? அவள் எனக்கு[b] ஓர் அழகிய[a] செயலைச் செய்திருக்கிறாள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நல்ல’ அல்லது ‘மேன்மையான’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எனக்கு’ என்பதற்கான கிரேக்கச் சொற்றொடர் சொல்லுக்கு சொல் ‘என்னில்’ என்று உள்ளது; சூழலில் ‘என்மேல்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: அவளை விட்டுவிடுங்கள்
  rationale: உடனடியாக அவளைத் தொந்தரவு செய்வதை நிறுத்த வேண்டும் என்ற கட்டளையையும், அவளைப் பாதுகாக்கும் இயேசுவின் உறுதியான தொனியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: ஏன் அவளுக்குத் தொல்லை கொடுக்கிறீர்கள்?
  rationale: சொல்லுக்குச் சொல் வடிவில் ‘அவளுக்குக் கஷ்டங்களை அளிக்கிறீர்கள்’ என்ற கருத்தைத் தரும் இந்தச் சொற்றொடர், ஒருவரைச் சிரமப்படுத்துதல் அல்லது தொந்தரவு செய்தல் என்ற பொருளில் வருகிறது; ‘தொல்லை கொடுக்கிறீர்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: καλὸν ἔργον
  choice: ஓர் அழகிய செயல்
  rationale: καλός என்பதில் நல்லது, அழகியது, மேன்மையானது, பொருத்தமானது ஆகிய பொருள் நிழல்கள் உள்ளன. இங்கு அர்ப்பணிப்புடன் செய்யப்பட்ட செயலின் அழகையும் பொருத்தத்தையும் ‘அழகிய செயல்’ காக்கிறது.
- source_word: ἠργάσατο
  choice: செய்திருக்கிறாள்
  rationale: முடிவுற்ற அந்தச் செயல் தற்போதைய சூழலில் மதிப்பிடப்படுவதைக் காட்டும் இயல்பான தமிழ் வினை வடிவம்.
- source_word: ἐν ἐμοί
  choice: எனக்கு
  rationale: சொல்லுக்குச் சொல் ‘என்னில்’ என்றாலும், இயேசுவை நோக்கிச் செய்யப்பட்ட செயலைத் தமிழில் ‘எனக்கு’ என்று கூறுவது இயல்பானது; இடஞ்சார்ந்த பொருளைத் தேவையின்றி மிகைப்படுத்துவதையும் இது தவிர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பெண்ணைக் குறைகூறியவர்களின் பேச்சுக்கு மாறான இயேசுவின் பதிலை அறிமுகப்படுத்தும் மென்மையான எதிர்மறைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: καλὸν ἔργον என்ற சொற்றொடரில் பெண்ணின் செயலுக்குக் கொடுக்கப்படும் மதிப்பீடு
  choice: ‘ஓர் அழகிய செயல்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஒரு நல்ல செயல்’ அல்லது ‘ஒரு மேன்மையான செயல்’
  rationale: இயேசு அவளுடைய செயலைப் பாராட்டுவதையும் அதன் பொருத்தமான அழகையும் இது காக்கிறது; அதேவேளையில் அந்தச் செயலுக்கு உரையில் இல்லாத சடங்கியல் அல்லது புண்ணியக் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: ἐν ἐμοί என்பதன் தொடர்புப் பொருள்
  choice: ‘எனக்கு’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘என்மேல்’, ‘என்னிடம்’ அல்லது சொல்லுக்குச் சொல் ‘என்னில்’
  rationale: செயல் இயேசுவைத் தனிப்பட்ட முறையில் நோக்கியது என்பதைத் தெரிவிக்கிறது. அபிஷேகத்தின் உடல் சார்ந்த சூழலை ‘என்மேல்’ தெளிவாகக் காட்டக்கூடும்; ஆயினும் இவ்வசனத்தின் மதிப்பீட்டு மொழியை தேவையின்றி இடஞ்சார்ந்ததாக மட்டுப்படுத்தாமல் ‘எனக்கு’ வைத்திருக்கிறது.
