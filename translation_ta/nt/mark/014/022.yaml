language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: ta
  text: அவர்கள் சாப்பிட்டுக்கொண்டிருந்தபோது, அவர் அப்பத்தை எடுத்து, அதன்மேல் ஆசி கூறி, அதைப் பிட்டு, அவர்களுக்குக் கொடுத்தார். பின்பு, “எடுத்துக்கொள்ளுங்கள்; இது என் உடல்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்று விளக்கமாக, “இது என் உடலைக் குறிக்கிறது” அல்லது “இது என் உடலைப் பொருள்படுத்துகிறது” என்றும் கூறப்படுகிறது. கிரேக்கத்தில் நேரடியாக, “இது என் உடல்” என்றே உள்ளது.
    reason: மாற்று விளக்க வாசிப்புகளைத் தெளிவாகச் சுட்டிக்காட்டியபடியே கிரேக்கத்தின் நேரடி சொற்றொடரைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: அவர்கள் சாப்பிட்டுக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையுடன் அமைந்த தனிநிலை வேற்றுமைத்தொடர், மற்ற செயல்கள் நடந்துகொண்டிருந்த அதே நேரத்தில் உணவு உண்ணுதல் தொடர்ந்ததைச் சுட்டுகிறது.
- source_word: λαβὼν ἄρτον
  choice: அவர் அப்பத்தை எடுத்து
  rationale: கிரேக்கத்தின் இறந்தகாலப் பங்கேற்புவினை தமிழ்க் கதைநடையில் இயல்பாக வினையெச்சமாகத் தரப்பட்டுள்ளது. ἄρτος என்பதை உணவுச் சூழலில் தேவையின்றி வடிவத்தை மிகத் துல்லியப்படுத்தாமல் ‘அப்பம்’ என மொழிபெயர்த்துள்ளது.
- source_word: εὐλογήσας
  choice: அதன்மேல் ஆசி கூறி
  rationale: உணவுச் சூழலில் இந்த வினை அப்பத்தின்மேல் ஆசிமொழி கூறுவதைக் குறிக்கலாம். ‘அதை ஆசீர்வதித்து’ என்பதைக் காட்டிலும் ‘அதன்மேல் ஆசி கூறி’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔκλασεν
  choice: அதைப் பிட்டு
  rationale: பகிர்ந்தளிப்பதற்காக அப்பத்தைப் பிய்த்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔδωκεν αὐτοῖς
  choice: அவர்களுக்குக் கொடுத்தார்
  rationale: கொடுப்பதன் பொருள் முன் சூழலிலிருந்து தெளிவாக இருப்பதால் தமிழில் அதை மீண்டும் குறிப்பிடாமல் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: Λάβετε
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் நேரடியான அழைப்பை மரியாதையும் இயல்பும் கொண்ட நவீன தமிழில் தருகிறது.
- source_word: τοῦτό ἐστιν
  choice: இது
  rationale: தமிழில் நிகழ்கால இணைப்புவினை வெளிப்படையாகத் தேவையில்லாததால், கிரேக்கத்தின் ‘இது … ஆகும்’ என்ற நேரடியான அடையாளக் கூற்றை இயல்பாக ‘இது என் உடல்’ எனத் தருகிறது; ‘குறிக்கிறது’ என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: τὸ σῶμά μου
  choice: என் உடல்
  rationale: σῶμα என்பதன் நேரடியான பொருளைத் தக்கவைத்து, உருவக அல்லது திருச்சடங்கு சார்ந்த விளக்கத்தை மொழிபெயர்ப்பில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் இராப்போஜன அறிவிப்பில் ‘τοῦτό ἐστιν τὸ σῶμά μου’ என்பதன் பொருள்
  choice: இது என் உடல்
  alternative: இது என் உடலைக் குறிக்கிறது / இது என் உடல் என்று பொருள்
  rationale: கிரேக்கத்தில் சாதாரண இணைப்புவினையான ἐστιν பயன்படுத்தப்பட்டுள்ளது. ஆகவே திருச்சடங்கு குறித்த வேறுபட்ட இறையியல் விளக்கங்களில் ஒன்றை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் நேரடிக் கூற்றையும் அதிலுள்ள இறையியல் அழுத்தத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கண்ணியமும் கொண்ட எளிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத் தொடரை தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்; செயல்களின் வரிசை மாற்றப்படவில்லை.
