  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: ta
  text: “நீங்கள் அந்த இறைநிந்தனையைக் கேட்டீர்கள். உங்களுக்கு என்ன தோன்றுகிறது?[a]” அவர்கள் அனைவரும் அவரை மரண தண்டனைக்கு உரியவர் என்று தீர்ப்பளித்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது இயல்பான வழக்கில், “நீங்கள் என்ன நினைக்கிறீர்கள்?”; விசாரணைச் சூழலில், “உங்கள் தீர்ப்பு என்ன?” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “மரண தண்டனைக்கு ஆளாக வேண்டியவர்,” “மரணத்துக்குப் பாத்திரமானவர்,” அல்லது “மரண தண்டனைக்கு உட்பட்டவர் என்று தீர்ப்பளித்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: நீங்கள் கேட்டீர்கள்
  rationale: இறைநிந்தனையாகக் கருதப்பட்ட கூற்றை அவர்கள் அப்போதுதான் கேட்டிருந்ததை, இயல்பான நவீனத் தமிழில் இறந்தகால வினையாகத் தெரிவிக்கிறது.
- source_word: τῆς βλασφημίας
  choice: அந்த இறைநிந்தனையை
  rationale: குறிப்பிட்ட குற்றச்சாட்டைச் சுட்டிக்காட்ட ‘அந்த’ பயன்படுத்தப்படுகிறது; ‘இறைநிந்தனை’ என்பது சமய-சட்டப் பொருளின் கனத்தைப் பாதுகாக்கிறது. இது குற்றஞ்சாட்டுவோரின் மதிப்பீடு; உரையாசிரியரின் தீர்ப்பு என்று உரை கூறவில்லை.
- source_word: τί ὑμῖν φαίνεται
  choice: உங்களுக்கு என்ன தோன்றுகிறது?
  rationale: கிரேக்கச் சொற்றொடரின் உருவகத்தை நெருக்கமாகக் காக்கும் அதேவேளையில் தமிழில் புரியக்கூடியதாக உள்ளது; சூழலில் இது கருத்தையோ தீர்ப்பையோ கேட்கிறது.
- source_word: οἱ δὲ πάντες
  choice: அவர்கள் அனைவரும்
  rationale: πάντες வலியுறுத்தும் ஒருமித்த நிலைப்பாட்டை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: κατέκριναν
  choice: தீர்ப்பளித்தார்கள்
  rationale: நீதித்துறைச் சூழலில் κατακρίνω குற்றவாளி எனத் தீர்ப்பது அல்லது எதிராகத் தீர்ப்பளிப்பதைக் குறிக்கிறது; அடுத்துள்ள மரணத் தகுதி மொழியுடன் சேர்ந்து இச்சொல் இயல்பாக அமைகிறது.
- source_word: ἔνοχον εἶναι θανάτου
  choice: மரண தண்டனைக்கு உரியவர்
  rationale: மரணத்திற்கு உட்பட்டவர், மரணத்தைப் பெறத் தகுந்தவர் என்ற நீதித்துறைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘மரணத்துக்குக் குற்றவாளி’ போன்ற செயற்கையான சொற்சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: விசாரணைச் சூழலில் βλασφημία என்ற குற்றச்சாட்டை மொழிபெயர்த்தல்
  choice: இறைநிந்தனை
  alternative: இறைவனை நிந்தித்த பேச்சு
  rationale: முறையான சமய-சட்டக் குற்றச்சாட்டின் கனத்தை ‘இறைநிந்தனை’ காக்கிறது. இது அவையின் குற்றச்சாட்டை எடுத்துரைக்கிறது; அந்தக் குற்றச்சாட்டு நீதியானது என்று கதைசொல்லி உறுதிப்படுத்துவதாக மாற்றவில்லை.
- issue: ἔνοχον εἶναι θανάτου என்பதன் நீதித்துறைப் பொருள்
  choice: மரண தண்டனைக்கு உரியவர்
  alternative: மரண தண்டனைக்கு ஆளாக வேண்டியவர் / மரணத்துக்குப் பாத்திரமானவர்
  rationale: அவர்கள் இயேசுவை மரண தண்டனைக்குத் தகுதியானவர் என்று தீர்மானித்ததைத் தெளிவாகக் கூறுகிறது; தண்டனை ஏற்கெனவே நிறைவேற்றப்பட்டதாகவோ தனிப்பட்ட பாவநிலையை உரை தீர்மானிப்பதாகவோ மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; நீதித்துறை மற்றும் சமயச் சூழலுக்கேற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. தமிழில் பேசுபவர் தெளிவாக இருக்க வேண்டியதால் முந்தைய வசனத்தில் உள்ள பிரதான ஆசாரியரைக் குறிக்கும் ‘என்று கேட்டார்’ சேர்க்கப்பட்டுள்ளது; புதிய தகவல் சேர்க்காமல் கிரேக்கத்தில் உள்ள நேரடி உரையின் பேச்சாளரை இயல்பாக வெளிப்படுத்துகிறது.
