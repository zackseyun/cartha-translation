    rationale: The Greek of Mark 14:64 begins directly with “You heard the blasphemy” and contains no equivalent of “என்று கேட்டார்.” The prior context identifies the speaker, but this verse should not add those words.
  - severity: low
    issue: The judicial object can be stated more directly.
    rationale: Rendering κατέκριναν αὐτόν as “அவரை ... என்று தீர்ப்பளித்தார்கள்” preserves the explicit object αὐτόν and makes the Tamil legal construction smoother.
