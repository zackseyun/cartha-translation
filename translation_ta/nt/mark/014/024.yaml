  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இது உடன்படிக்கைக்குரிய, பலருக்காக[c] ஊற்றப்படுகிற[b] என் இரத்தம்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளிலும் இணை நிகழ்வுப் பகுதிகளிலும் ‘புதிய உடன்படிக்கைக்குரிய என் இரத்தம்’ என்று உள்ளது. இங்கே மாற்குவின் கிரேக்க உரையை ‘உடன்படிக்கைக்குரிய என் இரத்தம்’ என்றே வாசிப்பது சிறந்தது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘ஊற்றப்படுவது’; மரபுவழியாக, ‘சிந்தப்படுகிறது.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பலரின் சார்பாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: இது … ஆகும் / இது …
  rationale: கிரேக்க மொழியின் நேரடியான இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘இது குறிக்கிறது’ அல்லது ‘இது அடையாளப்படுத்துகிறது’ என்று விளக்கவுரை சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τὸ αἷμά μου
  choice: என் இரத்தம்
  rationale: உடைமைத் தொடர்பையும் பலி மற்றும் உடன்படிக்கை சார்ந்த இரத்த உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது; ‘என் மரணம்’ என்று பொருள்விரிவு செய்யவில்லை.
- source_word: τῆς διαθήκης
  choice: உடன்படிக்கைக்குரிய
  rationale: διαθήκη என்பதன் இச்சூழலுக்குரிய பொருள் ‘உடன்படிக்கை.’ தமிழில் ‘உடன்படிக்கையின் என் இரத்தம்’ என்பது இயல்பற்றதால், தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்ட ‘உடன்படிக்கைக்குரிய’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘புதிய’ சேர்க்கப்படவில்லை.
- source_word: ἐκχυννόμενον
  choice: ஊற்றப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் கருத்தை இயல்பான தமிழ் வாக்கியமாக்குகிறது; இரத்தம் ஊற்றப்படும் பலிசார் படிமத்தைக் காக்கிறது.
- source_word: ὑπὲρ πολλῶν
  choice: பலருக்காக
  rationale: ὑπέρ + பிறப்புவேற்றுமையின் சார்பாக/நன்மைக்காக என்ற வலிமையை இயல்பான தமிழில் தருகிறது; ‘அனைவருக்காக’ என்று மாற்றி இறையியல் விவாதத்தைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: διαθήκη என்பதை உடன்படிக்கை என்றா, ஏற்பாடு/உயில் என்றா மொழிபெயர்ப்பது
  choice: உடன்படிக்கை
  alternative: உயில் / இறுதி ஏற்பாடு
  rationale: இரத்தம் பற்றிய இறுதி இராப்போஜனச் சூழலும் யாத்திராகமம் 24:8-இன் உடன்படிக்கை மொழியும் ‘உடன்படிக்கை’ என்ற பொருளையே ஆதரிக்கின்றன.
- issue: மூலத்தில் இல்லாத ‘புதிய’ என்பதை உடன்படிக்கைக்கு முன் சேர்ப்பதா
  choice: ‘உடன்படிக்கை’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘புதிய உடன்படிக்கை’
  rationale: SBLGNT-இல் இவ்விடத்தில் καινῆς (‘புதிய’) இல்லை. இணை வசனங்களோ மரபுவழி எதிர்பார்ப்போ காரணமாக மாற்கு உரையை ஒத்திசைக்காமல், வேறுபட்ட வாசகம் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது.
- issue: ὑπὲρ πολλῶν என்பதன் பாவநிவாரணப் பரப்பை மொழிபெயர்ப்பிலேயே தீர்மானிப்பதா
  choice: பலருக்காக
  alternative: அனைவருக்காக / பலரின் சார்பாக
  rationale: இயேசுவின் ‘பலர்’ என்ற சொல் அப்படியே காக்கப்படுகிறது. அதேவேளை, ‘பலருக்காக’ என்பதிலிருந்து விரிவான கொள்கை முடிவை மொழிபெயர்ப்பே கட்டாயப்படுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட பெயரெச்சத் தொடரைத் தமிழில் இயல்பாக்க இரண்டு உட்பிரிவுகளாகப் பிரித்துள்ளோம். ‘உடன்படிக்கைக்குரிய’ என்பது தொடர்பை இயல்பாகக் காட்டுகிறது; ‘புதிய’ போன்ற மூலத்தில் இல்லாத இறையியல் விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
