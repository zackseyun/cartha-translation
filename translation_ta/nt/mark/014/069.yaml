reference: Mark 14:69
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: ta
  text: அந்தப் பணிப்பெண்[a] அவனைப் பார்த்து, அருகில் நின்றுகொண்டிருந்தவர்களிடம், “இவன் அவர்களில் ஒருவன்” என்று மறுபடியும் சொல்லத் தொடங்கினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமைப் பெண்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: παιδίσκη என்பது பெண் பணியாளைக் குறிக்கிறது; அக்காலச் சமூகச் சூழலில் அவள் அடிமை நிலையிலிருந்திருக்கலாம் என்ற சொற்பொருள் சாத்தியத்தை இவ்வடிக்குறிப்பு பாதுகாக்கிறது.
lexical_decisions:
- source_word: παιδίσκη
  choice: பணிப்பெண்
  rationale: இச்சொல் இளம் பெண் பணியாளையையோ அடிமைப் பெண்ணையையோ குறிக்கலாம். முற்றத்தின் சூழலில் இயல்பாகவும் மரியாதைக்குரிய நவீன தமிழிலும் ஒலிப்பதால் ‘பணிப்பெண்’ தேர்ந்தெடுக்கப்பட்டது; அடிமை நிலை சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ἰδοῦσα
  choice: அவனைப் பார்த்து
  rationale: இறந்தகாலப் பெயரெச்சத்தின் சூழ்நிலைச் செயலை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது; அவனைப் பார்த்ததே தொடர்ந்து பேசியதற்கான சூழலைக் காட்டுகிறது.
- source_word: ἤρξατο πάλιν λέγειν
  choice: மறுபடியும் சொல்லத் தொடங்கினாள்
  rationale: ἤρξατο என்பதன் தொடக்கப் பொருளையும் πάλιν என்பதன் ‘மீண்டும்’ என்ற பொருளையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: τοῖς παρεστῶσιν
  choice: அருகில் நின்றுகொண்டிருந்தவர்களிடம்
  rationale: அங்கு உடனிருந்த அல்லது அருகே நின்ற மக்களைக் குறிக்கும் பெயரெச்சத்தின் இடவுணர்வைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: Οὗτος
  choice: இவன்
  rationale: பேதுருவை நேரடியாகச் சுட்டும் ஆண்பால் சுட்டுப்பெயர்; கிரேக்கச் சொல்லில் இல்லாத இகழ்ச்சித் தொனியைச் சேர்க்காமல் குற்றஞ்சாட்டும் நேரடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐξ αὐτῶν
  choice: அவர்களில் ஒருவன்
  rationale: இயேசுவோடு தொடர்புடைய அந்தக் குழுவைச் சேர்ந்தவன் என்ற உறுப்புரிமைப் பொருளை இயல்பான தமிழில் தருகிறது.
