source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: ta
  text: அவனோ அதை மறுத்து, “நீ என்ன சொல்கிறாய் என்று எனக்குத் தெரியவும் இல்லை, புரியவும் இல்லை” என்றான். பிறகு அவன் வெளியே வாசல் முற்றத்திற்குச் சென்றான்; அப்போது ஒரு சேவல் கூவியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அப்போது ஒரு சேவல் கூவியது” என்பது இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: அதை மறுத்து
  rationale: இந்த நடுத்தர வினை வடிவம் மறுத்தல் அல்லது ஏற்றுக்கொள்ளாமல் இருப்பதைக் குறிக்கிறது. முந்தைய குற்றச்சாட்டையே பேதுரு மறுப்பது சூழலில் தெளிவாக இருப்பதால், இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது; இயேசுவை நேரடியாக மறுத்தான் என்று மூலத்தில் இல்லாத செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: எனக்குத் தெரியவும் இல்லை, புரியவும் இல்லை
  rationale: இரு வினைகளின் இணைப்பு பேதுருவின் மறுப்பை வலுப்படுத்துகிறது. ‘தெரியவும் இல்லை, புரியவும் இல்லை’ என்பது அந்த இரட்டிப்பைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: σὺ τί λέγεις
  choice: நீ என்ன சொல்கிறாய் என்று
  rationale: ‘நீ என்ன சொல்கிறாய்’ என்ற மூலத்தின் நேரடியான பொருளையும், λέγων/λέγεις ஆகிய சொல்வினைகளின் தொடர்பையும் இது காக்கிறது.
- source_word: ἐξῆλθεν ἔξω
  choice: வெளியே ... சென்றான்
  rationale: வினையும் வினையடையும் சேர்ந்து வெளிநோக்கிய நகர்வை வலியுறுத்துகின்றன. ‘வெளியே சென்றான்’ என்பது தமிழில் இயல்பாகவும் போதுமான தெளிவுடனும் உள்ளது.
- source_word: προαύλιον
  choice: வாசல் முற்றம்
  rationale: இது பிரதான உள்முற்றத்தை மட்டும் அல்லாமல், அதற்கு முன்புறம் அல்லது நுழைவாயிலருகே உள்ள பகுதியைக் குறிக்கிறது. ‘வாசல் முற்றம்’ அந்த இடவியல் நுணுக்கத்தை சாதாரண வாசகருக்குப் புரியும் தமிழில் தருகிறது.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: ஒரு சேவல் கூவியது
  rationale: சேவலின் குரலைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர் இது. பெயர்ச்சொல்லுக்கு சுட்டுருபு இல்லாததையும் ‘ஒரு சேவல்’ பிரதிபலிக்கிறது.
theological_decisions:
- issue: καὶ ἀλέκτωρ ἐφώνησεν என்ற வாசகத்தின் சேர்ப்பு
  choice: ‘அப்போது ஒரு சேவல் கூவியது’ என்பதை முதன்மை உரையில் சேர்த்தல்
  alternative: இந்த வாசகத்தை முதன்மை உரையிலிருந்து விடுதல்
  rationale: கொடுக்கப்பட்ட SBLGNT உரையில் இந்த வாசகம் உரைவேறுபாட்டைக் குறிக்கும் அடையாளங்களுடன் இடம்பெறுகிறது. ஆகவே அது முதன்மை உரையில் மொழிபெயர்க்கப்பட்டு, சில கையெழுத்துப் பிரதிகளில் இல்லாதது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான கதைநடை மொழியிலும் வடிவமைக்கப்பட்டது. ‘வாசல் முற்றம்’ என்பது προαύλιον என்பதன் இடவியல் வேறுபாட்டை மிகத் தொழில்நுட்பமாகாமல் வெளிப்படுத்துகிறது.
