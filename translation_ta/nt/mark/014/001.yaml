  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: ta
  text: பஸ்காவும் புளிப்பில்லா அப்பப் பண்டிகையும் இன்னும் இரண்டு நாட்களில் வரவிருந்தன[a]. தலைமைக் குருக்களும் மறைநூல் அறிஞர்களும் அவரை எவ்வாறு வஞ்சகமாகப் பிடித்துக் கொல்லலாம் என்று வழி தேடிக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “இரண்டு நாட்களுக்குப் பின்.” பஸ்காவும் புளிப்பில்லா அப்பப் பண்டிகையும் நெருங்கியிருந்ததை இச்சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கைது செய்து”; கிரேக்கச் சொல் “பற்றிப் பிடித்து” அல்லது “கைப்பற்றி” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: இருந்தன
  rationale: δέ-யின் மென்மையான உரைத் தொடர்ச்சி தமிழில் தனிச் சொல்லாக வலியுறுத்தப்படாமல் இயல்பான வாக்கியத் தொடரால் வெளிப்படுகிறது; இரண்டு பண்டிகைப் பெயர்களைக் கொண்ட எழுவாய்க்கேற்ப பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸ πάσχα
  choice: பஸ்கா
  rationale: யூதர்களின் பஸ்கா விழாவைக் குறிக்கும் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்.
- source_word: τὰ ἄζυμα
  choice: புளிப்பில்லா அப்பப் பண்டிகை
  rationale: சொல்லுக்கு நேரடியாக ‘புளிப்பில்லாதவை’ என்ற பொருள் இருந்தாலும், இச்சூழலில் புளிப்பில்லா அப்பப் பண்டிகையையே குறிக்கிறது; அதனைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μετὰ δύο ἡμέρας
  choice: இன்னும் இரண்டு நாட்கள் இருந்தன
  rationale: ‘இரண்டு நாட்களுக்குப் பின்’ என்ற நேரடிக் கட்டமைப்பின் இங்கு குறிக்கப்படும் அண்மித்த காலத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐζήτουν
  choice: வழிதேடிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்ச்சியான முயற்சியைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒன்றுக்கு மேற்பட்ட முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் இணை.
- source_word: οἱ γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: வேதநூல்களை நகலெடுத்து விளக்குவதில் தேர்ச்சி பெற்ற யூத அறிஞர்களைக் குறிக்கும் இயல்பான நவீன தமிழ்; வெறும் எழுதுநர்கள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: அவர்கள் திட்டமிட்ட செயலின் முறையை அறிமுகப்படுத்தும் நேரடியான, இயல்பான தமிழ்.
- source_word: ἐν δόλῳ
  choice: சூழ்ச்சியால்
  rationale: δόλος என்பதிலுள்ள வஞ்சனை, தந்திரம் ஆகிய ஒழுக்கப் பொருளைத் தக்கவைக்கிறது; வெறும் இரகசியத்தை மட்டும் குறுக்கிவிடாது.
- source_word: κρατήσαντες
  choice: பிடித்துக்
  rationale: பற்றிக்கொள்ளுதல் அல்லது காவலில் பிடித்தல் என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; சூழலில் கைது என்ற கருத்தும் உள்ளதால் அடிக்குறிப்பில் மாற்று விளக்கம் தரப்படுகிறது.
- source_word: ἀποκτείνωσιν
  choice: கொலைசெய்யலாம்
  rationale: அவரைக் கொல்லும் நோக்கத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பஸ்காவுக்கும் புளிப்பில்லா அப்பப் பண்டிகைக்கும் உள்ள உறவு
  choice: இரு பெயர்களையும் தனித்தனியாக ‘பஸ்கா’ மற்றும் ‘புளிப்பில்லா அப்பப் பண்டிகை’ என்று வழங்குதல்
  alternative: இரண்டையும் ஒரே பண்டிகைப் பெயராக இணைத்தல்
  rationale: கிரேக்க மூலம் இரண்டையும் வெளிப்படையாகப் பெயரிடுகிறது. அவற்றின் நெருங்கிய தொடர்பை மறுக்காமலும், மூலத்தில் உள்ள வேறுபாட்டை அழிக்காமலும் மொழிபெயர்ப்பு அமைக்கப்பட்டுள்ளது.
- issue: தலைவர்களின் திட்டத்திற்கான ஒழுக்கச் சித்தரிப்பு
  choice: ἐν δόλῳ என்பதை ‘சூழ்ச்சியால்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: இரகசியமாக
  rationale: கிரேக்கச் சொல் இரகசியத்தை மட்டும் அல்லாமல் வஞ்சனையையும் தந்திரத்தையும் குறிக்கிறது; அதன் ஒழுக்க வலிமை பாதுகாக்கப்பட்டுள்ளது.
- issue: κρατήσαντες என்பதன் அதிகாரப்பூர்வக் காவல் நுணுக்கம்
  choice: முதன்மை உரையில் ‘பிடித்துக்’ என்று வைத்து, ‘கைதுசெய்து’ என்பதை அடிக்குறிப்பில் தருதல்
  alternative: கைதுசெய்து
  rationale: மூலச் சொல்லின் ‘பற்றிப் பிடித்தல்/கைப்பற்றுதல்’ என்ற அகலத்தையும், இச்சூழலின் அதிகாரப்பூர்வ கைது நுணுக்கத்தையும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், பொது வாசிப்புக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பஸ்கா’ போன்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டு, ‘மறைநூல் அறிஞர்கள்’ போன்ற தெளிவான சமகாலச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
