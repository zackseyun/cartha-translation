source:
  edition: SBLGNT
  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: ta
  text: அவர்கள் துக்கமடையவும், ஒவ்வொருவராக அவரிடம், “நானல்லவே?”[a] என்று சொல்லவும் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்பாக, “நானா? இல்லைதானே?” என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கேள்வியில் வரும் μήτι என்ற துகள், ‘இல்லை’ என்ற பதிலை எதிர்பார்ப்பதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: தொடங்கினார்கள்
  rationale: துணை வினையெச்சங்களுடன் வரும் ἤρξαντο செயல்களின் தொடக்கத்தைக் குறிக்கிறது; தமிழில் வாக்கியத்தின் இறுதியில் ‘தொடங்கினார்கள்’ என்பது இயல்பாக அமைகிறது.
- source_word: λυπεῖσθαι
  choice: துக்கமடைந்து
  rationale: இச்சொல் துயரமடைவதையோ மனவேதனை அடைவதையோ குறிக்கிறது. ‘துக்கமடைந்து’ என்பது நிகழ்ந்த மனநிலை மாற்றத்தையும் சூழலின் கனத்த தன்மையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ λέγειν
  choice: என்று சொல்ல
  rationale: λέγειν என்பதன் அடிப்படைப் பொருள் ‘சொல்லுதல்.’ அதை ‘கேட்க’ என்று மாற்றாமல், கேள்வி வடிவிலுள்ள நேர்கூற்றுடன் ‘என்று சொல்ல’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: மூலத்தில் இயேசுவின் பெயருக்குப் பதிலாகப் பிரதிப்பெயர் உள்ளது. தமிழில் மரியாதையுடன் இயல்பாக அமையும் ‘அவரிடம்’ அதைப் பாதுகாக்கிறது.
- source_word: εἷς κατὰ εἷς
  choice: ஒவ்வொருவராக
  rationale: ஒவ்வொருவரும் தனித்தனியாக அடுத்தடுத்து பேசியதை இந்தத் தொடர் குறிக்கிறது; ‘ஒவ்வொருவராக’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: Μήτι ἐγώ;
  choice: நான் அல்ல, அல்லவா?
  rationale: μήτι எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வியை அறிமுகப்படுத்துகிறது. ‘நான் அல்ல, அல்லவா?’ என்பது சீடர்கள் ‘இல்லை’ என்ற உறுதிப்படுத்தலை எதிர்பார்த்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் சுருக்கமான கேள்வி வடிவத்தையும் பெரிதாக விரிவாக்குவதில்லை.
theological_decisions:
- issue: சீடர்களின் கேள்வியின் எதிர்பார்ப்பு
  choice: ‘நான் அல்ல, அல்லவா?’ என்று, ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கும் கேள்வியாக மொழிபெயர்த்தல்
  alternative: ‘நானா?’ அல்லது ‘அது நானா?’
  rationale: μήτι என்ற துகள் கேள்வி கேட்பவர் எதிர்மறையான பதிலை எதிர்பார்ப்பதைக் காட்டுகிறது. வெறுமனே ‘நானா?’ என்று மொழிபெயர்த்தால் அந்த மறுப்பு எதிர்பார்ப்பும் சீடர்களின் கலக்கமான எதிர்வினையும் தெளிவாகத் தெரியாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் சூழலுக்கேற்ற கண்ணியமான நடையைக் கொண்டுள்ளது. ‘அவரிடம்’ என்ற மரியாதைப் பிரதிப்பெயரும் ‘துக்கமடைந்து’ என்ற சொல்லும் தமிழ் வேதாகம வாசிப்பு நடைக்கு இயல்பானவை; கேள்வியின் எதிர்மறைப் பதில் எதிர்பார்ப்பும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
