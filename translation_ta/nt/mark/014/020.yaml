translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நேர்க்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள இடைநிறுத்தம் போன்ற இணைப்பை நீண்ட கோடு வழியாகப் பாதுகாத்து, துரோகியைப் பற்றிய கூற்றின் சுருக்கத்தையும் தீவிரத்தையும் நிலைநிறுத்துகிறது.
