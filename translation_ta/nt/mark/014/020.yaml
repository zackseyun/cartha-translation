    issue: Unwarranted emphatic suffix in ‘தோய்த்துக்கொண்டிருப்பவனே’
    rationale: ὁ ἐμβαπτόμενος is an articular identifying participle, not explicitly an emphatic expression. Tamil ‘-வனே’ can add a ‘the very one/indeed’ nuance. ‘-வன்’ preserves the identification without this added emphasis.
  revised_text: அவர் அவர்களிடம், “பன்னிருவரில் ஒருவன்—என்னோடு கிண்ணத்தில்[a] தோய்த்துக்கொண்டிருப்பவன்” என்றார்.
