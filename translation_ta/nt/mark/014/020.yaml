id: MRK.14.20
reference: Mark 14:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “பன்னிருவரில் ஒருவன்—என்னோடு கிண்ணத்தில்[a] தோய்த்துக்கொண்டிருப்பவன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தட்டில்.” கிரேக்கச் சொல் உணவு உண்ணப் பயன்படுத்தப்படும் கிண்ணத்தையோ தட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அவர்
  rationale: δέ இங்கு வலுவான எதிர்மறையைக் குறிக்காமல் உரையாடலைத் தொடரும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தனியாக இணைப்புச்சொல் சேர்க்காமல் வாக்கியத்தைத் தொடங்குவது இயல்பான ஓட்டத்தைத் தருகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: நேர்க்கூற்றை அறிமுகப்படுத்தும் λέγω என்பதன் எளிய பொருளைப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: Εἷς τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவன்
  rationale: இயேசுவின் நெருங்கிய பன்னிருவர் குழுவைச் சேர்ந்த ஒருவன் என்பதைக் கூடுதல் விளக்கமின்றி நேரடியாகக் காட்டுகிறது.
- source_word: ὁ ἐμβαπτόμενος
  choice: தோய்த்துக்கொண்டிருப்பவனே
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்பெயரின் அடையாளப்படுத்தும் வலிமையைப் பாதுகாக்கிறது. கிரேக்கத்தில் தோய்க்கப்படும் பொருள் சொல்லப்படாததால் தமிழிலும் அதைச் சேர்க்கவில்லை.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: μετά + உரிமை வேற்றுமை இங்கு உடனிருப்பதையும் ஒரே செயலில் பங்கேற்பதையும் குறிக்கிறது.
- source_word: εἰς τὸ τρύβλιον
  choice: கிண்ணத்தில்
  rationale: τρύβλιον உணவு உண்ணப் பயன்படுத்தப்படும் கிண்ணம் அல்லது தட்டைக் குறிக்கலாம். ‘கிண்ணத்தில் தோய்த்தல்’ என்பது εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
