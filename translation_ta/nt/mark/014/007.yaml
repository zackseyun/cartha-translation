source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: ta
  text: ஏனெனில், ஏழைகள் எப்போதும் உங்களோடு இருக்கிறார்கள்; நீங்கள் விரும்பும்போதெல்லாம் அவர்களுக்கு நன்மை செய்ய முடியும்[a]. ஆனால் நான் எப்போதும் உங்களோடு இருப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்கு நன்மை செய்ய” என்பதை “அவர்களுக்கு உதவி செய்ய” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மரபுத்தொடர் வெறும் நல்விருப்ப உணர்வைக் குறிக்காமல், அவர்களுக்குப் பயனளிக்கும் விதத்தில் செயல்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து கிடைக்கும் வாய்ப்பையும், வசனத்தின் இரு பகுதிகளிலுள்ள நேர வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πτωχούς
  choice: ஏழைகள்
  rationale: ஏழ்மையில் உள்ள மக்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; பொருளை பொதுவான ‘தேவையுள்ளவர்கள்’ என விரிவுபடுத்தவில்லை.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: உங்களோடு இருக்கிறார்கள்
  rationale: அவர்கள் தொடர்ந்து உடனிருப்பதையும் அணுகக்கூடியவர்களாக இருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது. சொற்சொல்லான ‘உங்களுடன் வைத்திருக்கிறீர்கள்’ தமிழில் செயற்கையாகவும் தவறான செயற்பாட்டு நிழலுடனும் ஒலிக்கும்.
- source_word: ὅταν θέλητε
  choice: நீங்கள் விரும்பும்போதெல்லாம்
  rationale: ὅταν உடன் வரும் subjunctive குறிக்கும் வரையறுக்கப்படாத எந்த நேரத்தையும் ‘போதெல்லாம்’ இயல்பாகக் காக்கிறது.
- source_word: δύνασθε
  choice: முடியும்
  rationale: செய்வதற்கான திறனையும் வாய்ப்பையும் நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: அவர்களுக்கு நன்மை செய்ய
  rationale: εὖ ποιέω என்ற மரபுத்தொடரின் பயனளிக்கும் செயலைக் காக்கிறது; அதை பண உதவி போன்ற ஒரே செயலாகச் சுருக்கவில்லை.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: ஆனால் நான் எப்போதும் உங்களோடு இருப்பதில்லை
  rationale: δέ குறிக்கும் முரண்பாட்டையும் οὐ πάντοτε குறிக்கும் தொடர்ச்சியற்ற உடனிருப்பையும் இயல்பான தமிழில் தருகிறது; எதிர்கால வினையாக மாற்றாமல் கிரேக்க நிகழ்காலத்தைப் பேணுகிறது.
theological_decisions:
- issue: ஏழைகளைக் கவனிப்பதை இயேசு மதிப்பிழக்கச் செய்கிறார் என்ற தவறான புரிதல்
  choice: ஏழைகள் தொடர்ந்து அவர்களோடு இருப்பதையும், விரும்பும்போதெல்லாம் அவர்களுக்கு நன்மை செய்ய இயலும் என்பதையும் உரை உறுதிப்படுத்துகிறது; இயேசுவின் உடனிருப்பு அதே விதத்தில் எப்போதும் இருக்காது என்பதே முரண்பாடு.
  alternative: தம்மீதான பக்திக்காக ஏழைகள்மீதான அக்கறையை இயேசு ஒதுக்குகிறார் என்று புரிந்துகொள்வது.
  rationale: ‘நீங்கள் விரும்பும்போதெல்லாம் அவர்களுக்கு நன்மை செய்ய முடியும்’ என்ற உட்பிரிவு ஏழைகளுக்குப் பயனளிக்கும் செயலை மறுக்காமல் வெளிப்படையாக உறுதிசெய்கிறது. எனவே உரையில் உள்ள கால மற்றும் சூழ்நிலை முரண்பாடு காக்கப்பட்டுள்ளது; அதற்கு மேலான கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உங்களோடு இருக்கிறார்கள்/இருப்பதில்லை’ என்ற இணையான அமைப்பு கிரேக்க உரையிலுள்ள மீளுரையையும் கால முரண்பாட்டையும் இயல்பாகப் பேணுகிறது.
