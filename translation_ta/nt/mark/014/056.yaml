  source_fidelity: 'மூலத்தின் எல்லாக் கூறுகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: πολλοὶ = «பலர்»; γάρ-இன் விளக்கத் தொடர்பு «ஏனெனில்»; ἐψευδομαρτύρουν-இன் தொடர்ச்சியான பொய்ச் சாட்சியளித்தல்; κατ’ αὐτοῦ-இன் எதிர்ப்புத் திசை; மேலும் சாட்சிகள் ஒன்றோடொன்று ஒத்திருக்கவில்லை என்பதான ἴσαι ... οὐκ ἦσαν-இன் சூழல்சார் பொருள். மூலத்தில் வெளிப்படையாக இல்லாத «சாட்சிகள்» என்ற நபர்க் குறிப்பை «பலர்» என்பதுடன் சேர்க்காமல் வைத்திருப்பது சரியானது.'
  naturalness: «பலர் அவருக்கு எதிராகப் பொய்ச் சாட்சி சொல்லிக்கொண்டிருந்தார்கள்; அவர்களுடைய சாட்சிகள் ஒன்றுக்கொன்று ஒத்துப்போகவில்லை» என்பது நவீன நிலையான தமிழில் இயல்பாகவும், விசாரணைச் சூழலுக்கேற்ற முறையான தொனியுடனும் உள்ளது. அரைப்புள்ளி இரண்டு தொடர்புடைய கூறுகளைத் தெளிவாக இணைக்கிறது.
