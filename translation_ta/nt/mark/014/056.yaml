  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: ta
  text: ஏனெனில், பலர் அவருக்கு எதிராகப் பொய்ச் சாட்சி சொல்லிக்கொண்டிருந்தார்கள்[a]; அவர்களுடைய சாட்சிகள் ஒன்றுக்கொன்று ஒத்துப்போகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லாக: “அவருக்கு எதிராகப் பொய்ச் சாட்சி கூறிக்கொண்டிருந்தார்கள்; அந்தச் சாட்சிகள் ஒன்றுடன் ஒன்று உடன்படவில்லை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்தப் பன்மை உரிச்சொல் பல நபர்களைக் குறிக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘சாட்சிகள்’ என்பதை இங்கு சேர்க்காமல் ‘பலர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள நிகழ்வுரைக்கு விளக்கக் காரணத்தை வழங்கும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐψευδομαρτύρουν
  choice: பொய்ச் சாட்சி சொல்லிக்கொண்டிருந்தார்கள்
  rationale: சட்டச் சூழலிலுள்ள பொய்ச் சாட்சியைக் குறிக்கும் பொருளையும், இறந்தகாலத்தில் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் காட்டும் imperfect வினையின் கூறையும் தக்கவைக்கிறது.
- source_word: κατ’ αὐτοῦ
  choice: அவருக்கு எதிராக
  rationale: இச்சட்ட விசாரணைச் சூழலில் இயேசுவுக்கு விரோதமாகச் செலுத்தப்பட்ட சாட்சியைக் குறிக்கும் κατά + genitive அமைப்பின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἴσαι
  choice: ஒன்றுக்கொன்று ஒத்துப்போகவில்லை
  rationale: ἴσαι என்பதன் அடிப்படைப் பொருள் ‘சமமானவை’ என்றாலும், சாட்சிகளைப் பற்றிய இச்சூழலில் அவை ஒன்றுடன் ஒன்று உடன்படவில்லை அல்லது பொருந்தவில்லை என்பதே கருத்து; அதனை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αἱ μαρτυρίαι
  choice: அவர்களுடைய சாட்சிகள்
  rationale: முன்னர் குறிப்பிடப்பட்ட நபர்கள் அளித்த சாட்சிகளையே சுட்டுவதால், தமிழில் இயல்பாக உரிமைத் தொடர்பை வெளிப்படுத்துகிறது; சட்ட விசாரணைத் தொனியையும் காக்கிறது.
- source_word: οὐκ ἦσαν
  choice: ஒத்துப்போகவில்லை
  rationale: எளிய மறுப்பு வடிவத்தின் பொருள் ἴσαι என்பதுடன் இணைக்கப்பட்டு இயல்பான தமிழ் வினைத்தொடராக வழங்கப்பட்டுள்ளது.
