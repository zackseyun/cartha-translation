source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: ta
  text: அவர்கள் இயேசுவைத் தலைமை ஆசாரியரிடம் அழைத்துச் சென்றார்கள். முதன்மை ஆசாரியர்கள், மூப்பர்கள், மறைநூல் அறிஞர்கள் ஆகிய அனைவரும் ஒன்றுகூடினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில், “ஒன்றுகூடுகிறார்கள்” என்று நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது; கடந்தகால நிகழ்வை உயிரோட்டமாகச் சொல்லும் வரலாற்று நிகழ்காலம் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον (ἀπάγω)
  choice: அழைத்துச் சென்றார்கள்
  rationale: ஒருவரைக் காவலின்கீழ் ஓரிடத்திலிருந்து வேறோர் இடத்துக்குக் கொண்டு செல்லும் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சென்ற முறையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: ἀρχιερέα
  choice: தலைமை ஆசாரியர்
  rationale: ஒருமையில் வரும் இச்சொல் அப்போது தலைமை வகித்த உயர்நிலை ஆசாரியரைக் குறிக்கிறது; பின்னர் வரும் ஆசாரியத் தலைவர்களின் பன்மையிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: συνέρχονται
  choice: ஒன்றுகூடினார்கள்
  rationale: கடந்தகால நிகழ்வைக் கூறும் தமிழ்க் கதைநடைக்கு இயல்பாக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் காணப்படும் நிகழ்கால வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: குறிப்பிடப்பட்ட தலைமைக்குழுவினர் முழுமையாகக் கூடினார்கள் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἀρχιερεῖς
  choice: முதன்மை ஆசாரியர்கள்
  rationale: பன்மையில் இது தலைமை ஆசாரியர் ஒருவரை மட்டும் அல்லாமல், ஆசாரியத் தலைமைக் குழுவினரைக் குறிக்கிறது.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இங்கு வயதான ஆண்களைப் பொதுவாக அல்லாமல், அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கும் நிறுவனப் பொருளைத் தெரிவிக்கிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: எழுத்தர்களாகச் செயல்பட்டதோடு மறைநூலில் தேர்ச்சி பெற்ற யூதத் தலைவர்களையும் குறிக்கும் சொல்லை, சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வழங்குகிறது.
theological_decisions:
- issue: கடந்தகாலக் கதைநடையில் συνέρχονται என்ற வரலாற்று நிகழ்காலம்
  choice: முதன்மை உரையில் இயல்பான தமிழ் இறந்தகாலமாக ‘ஒன்றுகூடினார்கள்’
  alternative: மூலத்தின் உயிரோட்டமான நிகழ்காலத்தை நேரடியாகப் பின்பற்றி ‘ஒன்றுகூடுகிறார்கள்’
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; கதைநடைத் தேர்வு. நிகழ்வின் பொருளை மாற்றாமல் நவீனத் தமிழின் இயல்பான கடந்தகால நடையைப் பேணுகிறது; மூல வடிவம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை. ஒருமை ἀρχιερεύς என்பதற்கு ‘தலைமை ஆசாரியர்’ என்றும், பன்மை ἀρχιερεῖς என்பதற்கு ‘முதன்மை ஆசாரியர்கள்’ என்றும் வழங்கி இரண்டிற்குமுள்ள சூழல்சார் வேறுபாடு தெளிவாக்கப்பட்டுள்ளது.
