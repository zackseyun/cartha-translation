  source_fidelity: மூலத்தின் ἀπήγαγον என்பதன் காவல்/கைது சூழலிலான ‘அழைத்துச் சென்றார்கள்’ என்ற பொருளும், ஒருமை ἀρχιερέα (‘தலைமை ஆசாரியர்’) மற்றும் பன்மை ἀρχιερεῖς (‘முதன்மை ஆசாரியர்கள்’) ஆகியவற்றின் வேறுபாடும் சரியாகக் காக்கப்பட்டுள்ளன. πάντες, πρεσβύτεροι, γραμματεῖς ஆகியவை முறையே ‘அனைவரும்,’ ‘மூப்பர்கள்,’ ‘மறைநூல் அறிஞர்கள்’ எனச் சூழலுக்கேற்றவாறு தரப்பட்டுள்ளன. συνέρχονται-இன் வரலாற்று நிகழ்காலம் உரையில் இயல்பான இறந்தகாலமாக மாற்றப்பட்டாலும், அடிக்குறிப்பு அதனைத் துல்லியமாகக் குறிக்கிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. இரண்டு வாக்கியங்களாகப் பிரித்திருப்பது மூலத்தின் நிகழ்வுத் தொடர்பை மாற்றாமல் வாசிப்பை இயல்பாக்குகிறது. ‘முதன்மை ஆசாரியர்கள், மூப்பர்கள், மறைநூல் அறிஞர்கள் ஆகிய அனைவரும்’ என்ற தொகுப்பு தமிழில் இயல்பாக உள்ளது.
  terminology: ‘தலைமை ஆசாரியர்’ மற்றும் ‘முதன்மை ஆசாரியர்கள்’ என்ற சொற்கள் ஒருமை அலுவலரையும் பன்மை ஆசாரியத் தலைமைக் குழுவையும் வேறுபடுத்துகின்றன. ‘மூப்பர்கள்’ நிறுவனத் தலைவர்களைக் குறிக்கும் நிலையான சொல்லாகும். ‘மறைநூல் அறிஞர்கள்’ என்பது γραμματεῖς என்பதற்கான புரிந்துகொள்ளத்தக்க, சூழல்சார் மொழிபெயர்ப்பு; அளவுக்கு மீறிய விளக்கத்தைச் சேர்ப்பதில்லை.
