  text: ἔλεγον ⸀γάρ· Μὴ ἐν τῇ ἑορτῇ, μήποτε ⸂ἔσται θόρυβος⸃ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: ta
  text: ஏனெனில் அவர்கள், “பண்டிகையின்போது வேண்டாம்; மக்களிடையே[a] ஒரு குழப்பம் ஏற்படக்கூடும்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களிடமிருந்து.” கிரேக்கத்தில் உள்ள சொற்றொடர், குழப்பம் மக்களிடையே நிகழும் என்பதையோ மக்களிடமிருந்து எழும் என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினைச்சொல், தொடர்ந்து அல்லது திரும்பத் திரும்பக் கூறியதைக் காட்டுகிறது; இத்தமிழ் வடிவம் அந்த அம்சத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்க வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: Μὴ
  choice: வேண்டாம்
  rationale: ‘அதைச் செய்ய வேண்டாம்’ என்ற விடுபட்ட வினையை உட்பொருளாகக் கொண்ட சுருக்கமான ஆலோசனைப் பேச்சை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῇ ἑορτῇ
  choice: பண்டிகையின்போது
  rationale: ἐν என்பதன் காலப்பொருளையும், சூழலில் பஸ்கா/புளிப்பில்லா அப்பப் பண்டிகைக் காலத்தைக் குறிக்கும் ἑορτή என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μήποτε
  choice: எழக்கூடும்
  rationale: அஞ்சப்படும் விளைவைக் குறிக்கும் μήποτε என்பதன் வலிமையை, தமிழில் சாத்தியத்தையும் எச்சரிக்கையையும் காட்டும் வினைமுற்றுடன் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἔσται
  choice: எழக்கூடும்
  rationale: வருங்காலத்தில் நிகழக்கூடிய நிலையைத் தமிழின் இயல்பான சாத்திய வடிவில் தருகிறது; μήποτε உடன் சேர்ந்த ஒரே தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: θόρυβος
  choice: கலகம்
  rationale: சத்தமுள்ள பொதுக் குழப்பம் அல்லது கொந்தளிப்பைக் குறிக்கிறது; முழு அளவிலான ‘கிளர்ச்சி’ என்று மிகைப்படுத்தாமல் சமூகப் பதற்றத்தை வெளிப்படுத்துகிறது.
- source_word: τοῦ λαοῦ
  choice: மக்களிடமிருந்து
  rationale: மக்களே கலகத்தின் மூலமாக இருப்பார்கள் என்ற இயல்பான பிறப்பிடப் பொருளைத் தருகிறது; மக்களிடையே நிகழும் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
