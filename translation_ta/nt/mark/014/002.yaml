  to: ஏனெனில் அவர்கள், “பண்டிகையின்போது வேண்டாம்; மக்களிடையே[a] ஒரு குழப்பம் ஏற்படக்கூடும்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  rationale: The revision uses idiomatic modern Tamil and renders θόρυβος as public commotion without overstating it as rebellion. It retains the ongoing sense of the imperfect verb, the elliptical negative instruction, and the disputed/elastic relationship expressed by τοῦ λαοῦ through a footnote.
