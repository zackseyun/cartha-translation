translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான ‘Μὴ’ தமிழில் இயல்பாக ‘வேண்டாம்’ எனவும், முற்றுப்பெறாத இறந்தகாலம் ‘சொல்லிக்கொண்டிருந்தார்கள்’ எனவும் தரப்பட்டுள்ளது. மூலத்தில் உள்ள τοῦ λαοῦ என்பதன் உண்மையான இலக்கண இருபொருள்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
