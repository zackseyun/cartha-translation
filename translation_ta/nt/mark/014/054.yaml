translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியைத் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக அமைக்காமல், இயக்கமும் பின்னணிச் செயலும் தெளிவாகத் தொடரும் வகையில் இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது. ‘நெருப்பின் வெளிச்சத்தருகே’ என்பது மூலத்தின் சொற்பொருளைக் காக்கிறது; வழக்கமான சூழல்சார் மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
