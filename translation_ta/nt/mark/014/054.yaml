  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: ta
  text: பேதுரு தொலைவிலிருந்து அவரைப் பின்தொடர்ந்து, தலைமைக் குருவின் முற்றத்திற்குள் வரையிலும் சென்றார். அவர் காவல் பணியாளர்களுடன் அமர்ந்து, நெருப்பருகே[a] குளிர்காய்ந்துகொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளிச்சத்தருகே.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “வெளிச்சத்தை நோக்கி/வெளிச்சத்தருகே” என்று உள்ளது; முற்றத்தில் எரிந்த நெருப்பின் வெளிச்சத்தையும் நெருப்பையும் இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: தொலைவில்
  rationale: பேதுரு எச்சரிக்கையுடன் இடைவெளி விட்டு இயேசுவைப் பின்தொடர்ந்த காட்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἠκολούθησεν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்து
  rationale: இறந்தகாலக் கதைநடையில் இயல்பாக அமைகிறது; அடுத்த இயக்க வினையுடன் இணைந்து கிரேக்கத் தொடரின் பொருளைக் காக்கிறது.
- source_word: ἕως ἔσω εἰς
  choice: முற்றத்திற்குள் வரையிலும் சென்றார்
  rationale: பேதுரு முற்றத்தின் உட்பகுதி வரை சென்றதைத் தெளிவுபடுத்துகிறது; வீட்டுக்குள் சென்றதாக மிகைப்படுத்துவதில்லை.
- source_word: αὐλήν
  choice: முற்றம்
  rationale: இச்சூழலில் தலைமைக் குருவின் இல்லத்தைச் சேர்ந்த அடைக்கப்பட்ட வெளிப்பகுதியைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἀρχιερέως
  choice: தலைமைக் குரு
  rationale: ἀρχιερεύς என்பதற்கான தெளிவான, நிலையான தமிழ் இணை.
- source_word: ἦν συγκαθήμενος
  choice: அமர்ந்து ... குளிர்காய்ந்துகொண்டிருந்தார்
  rationale: நீடித்த பின்னணிச் செயலைக் காட்டும் கிரேக்கப் பரிபிராஸ்டிக் இம்பெர்ஃபெக்டை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; σύν கூறு ‘காவலர்களுடன்’ என்பதில் காக்கப்படுகிறது.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: காவலர்களுடன்
  rationale: கைது மற்றும் விசாரணைச் சூழலில் இவர்கள் வீட்டு அடிமைகள் அல்லாமல் அதிகாரப்பூர்வப் பணியாளர்கள் அல்லது காவல் பணி செய்தவர்கள்; ‘காவலர்கள்’ வாசகருக்கு அவர்களின் சூழல்சார் பணியைத் தெளிவாகத் தருகிறது.
- source_word: θερμαινόμενος
  choice: குளிர்காய்ந்துகொண்டிருந்தார்
  rationale: நெருப்பருகே உடலைச் சூடாக்கிக்கொண்ட செயலைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: πρὸς τὸ φῶς
  choice: நெருப்பின் வெளிச்சத்தருகே
  rationale: φῶς என்பதன் நேரடிப் பொருளான ‘வெளிச்சம்’ என்பதைக் காத்துக்கொண்டு, குளிர்காயும் சூழலில் அது நெருப்பின் வெளிச்சம் என்பதைத் தெளிவுபடுத்துகிறது.
