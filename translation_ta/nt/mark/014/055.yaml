revisions:
- from: தலைமைக் குருக்களும் ஆலோசனைச் சங்கம் முழுவதும் இயேசுவுக்கு எதிராகச் சாட்சியம் தேடிக்கொண்டிருந்தார்கள்; அவரை மரணத்திற்கு உட்படுத்துவதே அவர்களுடைய நோக்கம். ஆனால் அப்படிப்பட்ட சாட்சியம் எதுவும் அவர்களுக்குக் கிடைக்கவில்லை.[a]
  to: தலைமை ஆசாரியர்களும் முழு ஆலோசனை மன்றமும்[a] இயேசுவுக்கு எதிராகச் சாட்சியத்தைத் தேடிக்கொண்டிருந்தார்கள்; அவரைக் கொல்லும் நோக்கில் அவர்கள் தேடினார்கள், ஆனால் சாட்சியம் எதுவும் அவர்களுக்குக் கிடைக்கவில்லை.
  rationale: The revision preserves the Greek participants, ongoing search, adversative testimony, purpose, and failure to find testimony. It improves modern Tamil flow by using a direct purpose expression, clarifies συνέδριον as a council-like deliberative body, and moves the lexical-alternative footnote marker to its proper anchor. ‘கொல்லும் நோக்கில்’ renders θανατῶσαι without adding a claim about the specific legal procedure.
