  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: ta
  text: தலைமை ஆசாரியர்களும் முழு ஆலோசனை மன்றமும்[a] இயேசுவுக்கு எதிராகச் சாட்சியத்தைத் தேடிக்கொண்டிருந்தார்கள்; அவரைக் கொல்லும் நோக்கில் அவர்கள் தேடினார்கள், ஆனால் சாட்சியம் எதுவும் அவர்களுக்குக் கிடைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் குறிப்பாக, ‘முழு சனெத்ரின்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: δέ எனும் மென்மையான தொடரிணைப்பைத் தமிழில் தனியாகச் சேர்க்காமல், கதை ஓட்டத்தின் மூலம் உணர்த்தப்பட்டுள்ளது. ἀρχιερεῖς என்பது எருசலேமின் முன்னணி ஆசாரியத் தலைமையைக் குறிக்கும் பன்மை; ‘தலைமைக் குருக்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ὅλον τὸ συνέδριον
  choice: ஆலோசனைச் சங்கம் முழுவதும்
  rationale: συνέδριον என்பது ஆளும் நீதிமன்ற ஆலோசனைச் சபையைக் குறிக்கிறது. ‘ஆலோசனைச் சங்கம்’ அதன் பொருளைத் தமிழில் தெரிவிக்கிறது; ὅλον என்பதற்கு ‘முழுவதும்’ வைக்கப்பட்டுள்ளது. வரலாற்றுப் பெயரான ‘சனெத்ரின்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐζήτουν
  choice: தேடிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடந்த முயற்சியைக் குறிக்கும் இறந்தகால imperfect வடிவத்தின் நீடித்த தன்மையை இந்தத் தமிழ் வினை வெளிப்படுத்துகிறது.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: இயேசுவுக்கு எதிராகச் சாட்சியம்
  rationale: κατά + genitive இங்கு எதிரான அல்லது குற்றஞ்சாட்டும் பொருளைக் கொண்டது. μαρτυρία நீதிமன்றச் சூழலில் சாட்சியத்தின் உள்ளடக்கத்தைக் குறிக்கிறது; ‘ஆதாரம்’ என்பதைவிட ‘சாட்சியம்’ மூலத்திற்கு நெருக்கமானது.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: அவரை மரணத்திற்கு உட்படுத்துவதே அவர்களுடைய நோக்கம்
  rationale: εἰς + articular infinitive நோக்கத்தைக் காட்டுகிறது; θανατόω என்பது கொல்லுதல் அல்லது மரண தண்டனைக்கு உட்படுத்துதல். விசாரணைச் சூழலின் நீதிமுறை நிழலைப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καὶ οὐχ ηὕρισκον
  choice: ஆனால் அப்படிப்பட்ட சாட்சியம் எதுவும் அவர்களுக்குக் கிடைக்கவில்லை
  rationale: ηὕρισκον என்ற imperfect, அவர்கள் தொடர்ந்து தேடியும் கண்டடையவில்லை என்பதை உணர்த்துகிறது. καί அடிப்படையில் ‘மற்றும்’ என்றாலும், இங்குள்ள விளைவுமுரணை இயல்பான தமிழில் ‘ஆனால்’ தெளிவாக வெளிப்படுத்துகிறது; ‘அப்படிப்பட்ட சாட்சியம்’ என்பது முன் குறிப்பிடப்பட்ட சொல்லை இயல்பாக மீள்குறிக்கிறது.
theological_decisions:
- issue: συνέδριον என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘ஆலோசனைச் சங்கம்’
  alternative: ‘சனெத்ரின் சங்கம்’ அல்லது ‘சனெத்ரின்’
  rationale: கிரேக்கம் அமைப்பின் வகையைக் குறிப்பிடுகிறது; வரலாற்றுப் பெயரை ஒலிபெயர்ப்பது கட்டாயமல்ல. பொதுவாசகருக்கு பொருள் தெளிவாக இருக்க முதன்மை உரையில் தமிழாக்கமும், வரலாற்று அடையாளத்தைப் பாதுகாக்க அடிக்குறிப்பில் ‘சனெத்ரின்’ என்பதும் தரப்பட்டுள்ளன.
- issue: சாட்சியம் கிடைக்காததின் தன்மை
  choice: ‘கிடைக்கவில்லை’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘உண்மையான சாட்சியம் கிடைக்கவில்லை’ அல்லது ‘செல்லத்தக்க சாட்சியம் கிடைக்கவில்லை’
  rationale: மூலத்தில் ‘உண்மையான’ அல்லது ‘செல்லத்தக்க’ என்ற அடைமொழி இல்லை. அத்தகைய விளக்கத்தைச் சேர்க்காமல், உரையின் பதற்றத்தையும் அடுத்த வசனங்கள் தரும் விளக்கத்தையும் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்றச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டது. ‘தேடிக்கொண்டிருந்தார்கள்’ என்பது தொடர்ச்சியான முயற்சியைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘ஆலோசனைச் சங்கம்’ என்பதற்குப் பின் உடனடியாக அல்லாமல் வசன முடிவில் வைக்கப்பட்டுள்ளது; வெளியீட்டு நடைமுறையில் அதை அந்தச் சொல்லுக்குப் பின் நகர்த்துவது தெளிவை மேம்படுத்தும்.
