  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: ta
  text: எழுந்திருங்கள்; போகலாம். இதோ, என்னைக் காட்டிக்கொடுக்கிறவன்[a] நெருங்கிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல்: ‘என்னை ஒப்படைக்கிறவன் நெருங்கிவிட்டான்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: எழுந்திருங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை கட்டளை வடிவம். இச்சூழலில் சீடர்கள் எழுந்து புறப்பட வேண்டும் என்பதே முதன்மை; வெறுமனே தூக்கத்திலிருந்து விழிப்பதை மட்டும் குறிக்கவில்லை.
- source_word: ἄγωμεν
  choice: போகலாம்
  rationale: முதல் நபர் பன்மை ஊக்குவிப்பு வினை வடிவத்தின் இயல்பான நவீனத் தமிழ் இணை; இயேசு தம்மோடு சீடர்களையும் செயலுக்கு அழைப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἰδού
  choice: இதோ
  rationale: அடுத்து நிகழப்போகிறதற்குக் கவனத்தை ஈர்க்கும் இடைச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ὁ παραδιδούς
  choice: என்னைக் காட்டிக்கொடுக்கிறவன்
  rationale: கட்டுரையுடன் வந்த நிகழ்காலப் பங்கேற்பு வடிவத்தை ஒருவரைக் குறிக்கும் சொல்லாக்கமாகப் பாதுகாக்கிறது. பாடுபடும் கதையில் யூதாசின் துரோகச் செயலை இயல்பாகத் தெரிவிக்கிறது; அதே நேரத்தில் அடிப்படையான ‘ஒப்படைத்தல்’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: με
  choice: என்னை
  rationale: இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டான்
  rationale: முடிவுற்ற அணுகுதலின் தற்போதைய விளைவை உணர்த்தும் நிறைவு வினையின் ஆற்றலைப் பாதுகாக்கிறது; வருகை மிக அருகில் இருப்பதையும் இயல்பாகச் சொல்கிறது.
theological_decisions:
- issue: பாடுபடும் நிகழ்வில் παραδίδωμι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுக்கிறவன்
  alternative: ஒப்படைக்கிறவன்
  rationale: இங்கு யூதாசின் உறவுத் துரோகமும் ஒப்படைக்கும் செயலும் இரண்டும் பின்னணியில் உள்ளன. முதன்மை உரையில் இயல்பான தமிழில் துரோகப் பொருள் வெளிப்படுத்தப்பட்டு, கிரேக்கச் சொல்லின் அடிப்படையான ‘ஒப்படைத்தல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. பன்மைக் கட்டளையும் ஊக்குவிப்பு வடிவமும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன; கிரேக்க மூலத்தின் சுருக்கமான, அவசரமான தொனி காக்கப்பட்டுள்ளது.
