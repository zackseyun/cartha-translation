translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அவரே’ என்பது மூலத்தின் வலியுறுத்தலைப் பேணுகிறது; ‘அமைக்கப்பட்டு’ என்பது ἐστρωμένον என்பதன் பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் தருகிறது. கிரேக்க καί தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல், இரண்டாம் வாக்கியத்தின் இயல்பான தொடர்ச்சியில் பிரதிபலிக்கப்படுகிறது.
