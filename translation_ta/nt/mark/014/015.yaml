  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: ta
  text: அவரே உங்களுக்குப் பெரிய மேல்மாடி அறை ஒன்றைக் காட்டுவார்[a]; அது ஒழுங்குபடுத்தப்பட்டு, தயாராக இருக்கும். அங்கே நமக்காக ஏற்பாடு செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒழுங்காக அமைக்கப்பட்டு, தயாராக இருக்கும் ஒரு பெரிய மேல்மாடி அறை.” ἐστρωμένον என்ற சொல் வெறுமனே அறைகலன்கள் உள்ளதைக் குறிக்காமல், அறை விரித்து அல்லது ஒழுங்குபடுத்தி பயன்பாட்டுக்குத் தயாராக்கப்பட்ட நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: அவரே
  rationale: எழுவாயான சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் ‘அவரே’ எனப் பேணுகிறது.
- source_word: δείξει
  choice: காட்டுவார்
  rationale: எதிர்கால வினையான δείξει என்பதன் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἀνάγαιον μέγα
  choice: ஒரு பெரிய மேல்மாடி அறை
  rationale: வீட்டின் மேற்பகுதியில் உள்ள அறையைக் குறிக்கும் ἀνάγαιον என்பதையும் அதன் அளவைக் குறிக்கும் μέγα என்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐστρωμένον
  choice: அமைக்கப்பட்டு
  rationale: அறை விரிப்புகள் அல்லது விருந்து ஏற்பாடுகளுடன் ஒழுங்குபடுத்தப்பட்டிருப்பதைக் குறிக்கக்கூடிய சொல்லின் பரந்த பொருளைப் பேணுகிறது; ‘அறைகலன்கள் வைக்கப்பட்டு’ என்று மிகக் குறிப்பாக்கவில்லை.
- source_word: ἕτοιμον
  choice: ஆயத்தமாக இருக்கும்
  rationale: அறை பயன்படுத்தத் தயாரான நிலையில் இருப்பதைத் தெரிவிக்கிறது; அடுத்துவரும் கட்டளையிலும் உள்ள ஆயத்தப்படுத்துதல் என்ற தொடர்பைப் பேணுகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் வினையடையின் இயல்பான தமிழ் வடிவம்.
- source_word: ἑτοιμάσατε
  choice: ஆயத்தம் செய்யுங்கள்
  rationale: பன்மை ஏவல் வினையின் செயற்பாட்டு வலிமையை மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡμῖν
  choice: நமக்காக
  rationale: முதல் நபர் பன்மைச் சுட்டை விளக்கவுரை சேர்க்காமல் எளிமையாகப் பேணுகிறது.
