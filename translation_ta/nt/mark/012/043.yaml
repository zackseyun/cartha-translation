  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: ta
  text: 'அவர் தம் சீடர்களைத் தம்மிடம் அழைத்து, அவர்களிடம், “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: காணிக்கைப் பெட்டியில்[a] இட்டுக்கொண்டிருக்கும் அனைவரையும்விட இந்த ஏழை விதவை அதிகமாக இட்டிருக்கிறாள்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆலயக் கருவூலம்” அல்லது “காணிக்கைப் பேழை.” கிரேக்கச் சொல் ஆலயக் கருவூலத்தையோ காணிக்கை இடும் பெட்டியையோ அந்தப் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம் சீடர்களைத் தம்மிடம் அழைத்து
  rationale: இடை வினையின் ‘தம்மிடம் அழைத்தல்’ என்ற நுண்பொருளைக் காத்து, தமிழில் இயல்பான தொடர்ச்சியாக அமைக்கிறது.
- source_word: μαθητὰς
  choice: சீடர்கள்
  rationale: இயேசுவைப் பின்பற்றிக் கற்றுக்கொள்பவர்களைக் குறிக்கும் நிலையான புதிய ஏற்பாட்டுச் சொல்.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தல்மிக்க உறுதிமொழித் தொடக்கத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: χήρα αὕτη ἡ πτωχὴ
  choice: இந்த ஏழை விதவை
  rationale: சொற்களின் நேரடியான பொருளையும், சுட்டும் தன்மையையும் எளிய தமிழில் காக்கிறது.
- source_word: πλεῖον πάντων
  choice: அனைவரையும்விட ... அதிகமாக
  rationale: ஒப்பீட்டை அப்படியே காக்கிறது; அது பணத்தின் எண்ணியல் அளவை மட்டுமே குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: ἔβαλεν
  choice: போட்டிருக்கிறாள்
  rationale: முடிந்த செயலைப் பற்றிய இயேசுவின் தற்போதைய மதிப்பீட்டை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν βαλλόντων
  choice: பணம் போட்டுக்கொண்டிருக்கும் அனைவரையும்
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் காட்டும் கிரேக்க நிகழ்காலப் பெயரெச்சத்தின் அம்சத்தைப் பாதுகாக்கிறது.
- source_word: γαζοφυλάκιον
  choice: காணிக்கைப் பெட்டி
  rationale: ஆலயத்தில் காணிக்கைகள் இடப்பட்ட பெட்டி அல்லது கருவூலப் பகுதியை சாதாரண வாசகர்கள் உடனே புரிந்துகொள்ளும் வகையில் தருகிறது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் உள்ளது.
theological_decisions:
- issue: விதவையின் காணிக்கையைப் பற்றிய மதிப்பீடு
  choice: ‘அனைவரையும்விட ... அதிகமாக’ என்ற ஒப்பீட்டை விளக்கப் பொருள் சேர்க்காமல் வைத்தல்
  alternative: அவள் பண மதிப்பில் ஒவ்வொருவரையும்விட அதிகத் தொகை கொடுத்தாள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: அடுத்த வசனம் அவளுடைய வறுமையையும் முழுமையான கொடையையும் விளக்குகிறது. இவ்வசனத்தில் உள்ள ஒப்பீட்டின் இறையியல் அழுத்தத்தையும் இயல்பான பதற்றத்தையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தம்/தம்மிடம்’ மரியாதையையும் இடை வினையின் நுண்பொருளையும் காக்கிறது; ‘போட்டுக்கொண்டிருக்கும்’ நிகழ்ந்துகொண்டிருக்கும் செயலை இயல்பாக வெளிப்படுத்துகிறது.
