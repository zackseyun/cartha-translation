  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மூலத்தின் நேரடியான நிகழ்வரிசையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
