  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: ta
  text: அவர்கள் அவனைப் பிடித்து, அடித்து, வெறுங்கையோடு அனுப்பிவிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “வெறுமையாக அனுப்பிவிட்டார்கள்”; கிரேக்கச் சொல் κενόν என்பது இங்கு அந்த வேலைக்காரன் எதையும் பெறாமல் திருப்பி அனுப்பப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: பிடித்து
  rationale: இறந்தகாலப் பங்கேற்புவினையான இது அடுத்த செயல்களுக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. சூழலில் வன்முறை தெளிவாக இருப்பதால், மிகையாகப் பொருள் சேர்க்காமல் ‘பிடித்து’ என்பது இயல்பாக அமைகிறது.
- source_word: ἔδειραν
  choice: அடித்து
  rationale: δέρω என்பது அடித்தல் அல்லது கடுமையாகத் தாக்குதல் என்று பொருள். முறையான சாட்டையடியைக் குறிப்பதாகத் தெளிவில்லை; ஆகவே பொதுவான ‘அடித்து’ பொருத்தமானது.
- source_word: ἀπέστειλαν
  choice: அனுப்பிவிட்டார்கள்
  rationale: ἀποστέλλω இங்கு அவனைத் தங்களிடமிருந்து திருப்பி அனுப்பியதைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் ‘அனுப்பிவிட்டார்கள்’ அந்த நிறைவுற்ற செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κενόν
  choice: வெறுங்கையோடு
  rationale: ‘வெறுமையாக’ என்பது இதன் நேரடிப் பொருள்; இச்சூழலில் அவன் பெறவேண்டியது எதுவும் இல்லாமல் திருப்பி அனுப்பப்பட்டான் என்பதால் ‘வெறுங்கையோடு’ தெளிவான, இயல்பான தமிழ்.
- source_word: καὶ ... καὶ
  choice: …, …,
  rationale: மீண்டும் வரும் καί செயல்களை எளிய தொடராக இணைக்கிறது. தமிழில் வினையெச்சத் தொடர் இதே நிகழ்வரிசையை இயல்பாகவும் சுருக்கமாகவும் காக்கிறது.
theological_decisions: []
