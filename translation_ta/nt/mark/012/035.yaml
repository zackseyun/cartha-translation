id: MRK.12.35
reference: Mark 12:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: ta
  text: 'இயேசு ஆலயத்தில் கற்பித்துக்கொண்டிருக்கையில் பதிலளித்துப் பேசினார்: “மேசியா[a] தாவீதின் மகன் என்று மறைநூல் அறிஞர்கள் எப்படிச் சொல்கிறார்கள்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டப்பெயர் கிறிஸ்தோஸ்; இங்கு அது மேசியாவைக் குறிக்கும் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: மறுமொழியாகக் கூறினார்
  rationale: முன்னதாக நேரடியான கேள்வி எதுவும் இல்லாதபோதும், சூழ்நிலைக்கோ சிந்தனை ஓட்டத்துக்கோ பதிலளிக்கும் உரையை இச்சொல் அறிமுகப்படுத்தலாம். ‘பதிலளித்து’ என்பதைக் காட்டிலும் ‘மறுமொழியாக’ என்பது இங்கு இயல்பாக உள்ளது.
- source_word: ἔλεγεν
  choice: கூறினார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்நிலைச் சாயல், உடன் வரும் ‘கற்பித்துக்கொண்டிருந்தபோது’ என்பதில் வெளிப்படுகிறது; நேரடி உரையை அறிமுகப்படுத்த ‘கூறினார்’ இயல்பானது.
- source_word: διδάσκων
  choice: கற்பித்துக்கொண்டிருந்தபோது
  rationale: இயேசு பேசுவதும் கற்பிப்பதும் ஒரே நேரத்தில் நிகழ்ந்ததை நிகழ்கால வினையெச்சம் குறிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உட்பரிசுத்தக் கட்டிடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையும் குறிக்கலாம்; ‘ஆலயத்தில்’ என்பது அந்த விரிவைச் சுருக்காமல் இயல்பாகத் தருகிறது.
- source_word: Πῶς
  choice: எப்படி
  rationale: இது எழுத்தறிஞர்களின் கூற்றுக்கான அடிப்படையைக் கேள்விக்குள்ளாக்கும் வினா. ‘எப்படி’ என்பது அதன் சொற்பொருளையும் சொல்லாட்சியின் திறந்த தன்மையையும் காக்கிறது; ‘எப்படிச் சொல்ல முடியும்’ என்று வலுப்படுத்தி விளக்கவில்லை.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: இங்கு யூத மறைநூல்களையும் சட்டத்தையும் நன்கு அறிந்து போதித்த வரலாற்றுக் குழுவைக் குறிக்கிறது. நவீனத் தமிழில் ‘வேத அறிஞர்கள்’ என்பது புரிந்துகொள்ள எளிதான செயல்பாட்டு இணை.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இங்கு Χριστός தனிப்பெயராக அல்லாமல் யூத எதிர்பார்ப்பில் உள்ள அபிஷேகம் பெற்ற அரசரைச் சுட்டும் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: υἱὸς Δαυίδ
  choice: தாவீதின் மகன்
  rationale: மேசியாவுக்குரிய அறியப்பட்ட வம்சப் பட்டத்தை இது குறிக்கிறது; ஆகவே இயல்பான திட்டவட்ட வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தை மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் இந்தச் சொல் யூத மேசியா எதிர்பார்ப்பில் உள்ள பட்டமாகத் தெளிவாகப் பயன்படுத்தப்படுகிறது. ‘கிறிஸ்து’ என்ற மரபுவழி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ‘தாவீதின் மகன்’ என்ற கூற்றின் நோக்கம்
  choice: கேள்வியை அதன் பதற்றத்துடன் அப்படியே வைத்தல்
  alternative: மேசியா தாவீதின் சந்ததியினராக இருக்க முடியாது என்று விளக்குதல்
  rationale: இவ்வசனம் எழுத்தறிஞர்களின் கூற்றைக் கேள்வியாக முன்வைக்கிறது; இயேசு தாவீதிய வம்சத்தை முற்றிலும் மறுக்கிறாரா அல்லது மேசியாவின் அடையாளம் அதைவிடப் பெரியது எனக் காட்டுகிறாரா என்பதை இவ்வசனம் மட்டும் வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் ‘மறுமொழி’ சாயல் காக்கப்பட்டாலும் தமிழில் கடினமான இரட்டை வினை தவிர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘மேசியா’ என்பதற்குப் பின்பே வைக்கப்பட்டது.
