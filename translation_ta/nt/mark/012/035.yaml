  to: 'இயேசு ஆலயத்தில் கற்பித்துக்கொண்டிருக்கையில் பதிலளித்துப் பேசினார்: “மேசியா[a] தாவீதின் மகன் என்று மறைநூல் அறிஞர்கள் எப்படிச் சொல்கிறார்கள்?”'
