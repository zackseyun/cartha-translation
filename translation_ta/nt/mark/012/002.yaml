source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: ta
  text: உரிய காலத்தில், திராட்சைத்தோட்டத்தைப் பயிரிடுகிறவர்களிடமிருந்து அதன் விளைச்சலில் ஒரு பங்கைப் பெற்றுக்கொள்வதற்காக, அவர் ஒரு அடிமையை[a] அவர்களிடம்[b] அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊழியன்.” கிரேக்கச் சொல் (δοῦλος) “அடிமை” அல்லது சூழலுக்கேற்ப “ஊழியன்” என மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “விவசாயிகளிடம்” அல்லது “குத்தகைதாரர்களிடம்.” கிரேக்கச் சொல் நிலத்தைப் பயிரிடுகிறவர்களைக் குறிக்கிறது; இங்கு திராட்சைத்தோட்டச் சூழலுக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: இறந்தகால நிகழ்வை இயல்பான நவீனத் தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: γεωργούς / γεωργῶν
  choice: திராட்சைத்தோட்டத்தைப் பயிரிடுகிறவர்கள்
  rationale: γεωργός என்பது நிலத்தைப் பயிரிடுபவரைக் குறிக்கிறது; திராட்சைத்தோட்டச் சூழலைத் தெளிவுபடுத்தும் அதேவேளையில், அவர்கள் குத்தகைதாரர்கள் என்று மூலத்தில் நேரடியாக இல்லாத தகவலைச் சேர்க்கவில்லை.
- source_word: τῷ καιρῷ
  choice: உரிய காலத்தில்
  rationale: καιρός குறிக்கும் தகுந்த அல்லது நிர்ணயிக்கப்பட்ட நேரத்தைப் பாதுகாக்கிறது; அது அறுவடைக்காலமே என்று தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
- source_word: δοῦλον
  choice: அடிமை
  rationale: δοῦλος குறிக்கும் எஜமானுக்குச் சொந்தமான சமூக நிலையைக் தெளிவாக வெளிப்படுத்துகிறது; மென்மையாக்கி வெறும் பணியாளர் என்ற பொருளாக்கவில்லை.
- source_word: ἵνα ... λάβῃ
  choice: பெற்றுக்கொள்வதற்காக
  rationale: ἵνα கூறும் நோக்கத்தை இயல்பான தமிழ் நோக்கவினை வடிவில் தருகிறது.
- source_word: παρὰ τῶν γεωργῶν
  choice: அவர்களிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமை குறிக்கும் மூலத்தையோ கொடுப்பவர்களையோ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின் விளைச்சலில் ஒரு பங்கை
  rationale: ἀπό அமைப்பின் பகுதிப்பொருளைத் தெளிவுபடுத்துகிறது. தமிழ் வேளாண்மைச் சூழலில் καρποί என்பதற்கு ‘விளைச்சல்’ இயல்பானது; ‘அவருக்குரிய பங்கு’ என்று மூலத்தில் வெளிப்படையாக இல்லாத உரிமைக் கருத்தைச் சேர்க்கவில்லை.
- source_word: ἀμπελῶνος
  choice: திராட்சைத்தோட்டம்
  rationale: ἀμπελών என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
