translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் குறிப்பில் ‘அடிமை’ என்ற வரலாற்றுச் சமூகப் பொருள் பாதுகாக்கப்பட்டு, பாரம்பரிய மாற்று ‘ஊழியன்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. இரண்டாவது குறிப்பில் γεωργός என்பதன் பொதுவான மற்றும் சமூகப் பங்கு சார்ந்த மாற்றுகள் பாதுகாக்கப்பட்டுள்ளன.
