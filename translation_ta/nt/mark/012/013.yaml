source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: ta
  text: அவர்கள் அவரைப் பேச்சில் சிக்கவைக்கும்படி, பரிசேயர்களில் சிலரையும் ஏரோதியர்களில் சிலரையும் அவரிடம் அனுப்புகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சொல்வதைக் கொண்டு அவரைச் சிக்கவைக்கும்படி.” “சிக்கவைக்க” எனும் கிரேக்க வினைச்சொல் வேட்டையாடிப் பிடிப்பதை உருவகமாகக் குறிக்கிறது; இறுதிச் சொற்றொடர் அவருடைய பேச்சின் வழியாக அவரைச் சிக்கவைப்பதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: அனுப்புகிறார்கள்
  rationale: கிரேக்கத்தின் வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, தமிழ் கதையோட்டத்திலும் இயல்பாக அமைக்கிறது.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: பரிசேயர்களில் சிலரையும் ஏரோதியர்களில் சிலரையும்
  rationale: τινας உடன் வரும் இரு பகுதிப்பொருள் வேற்றுமைகளையும் வெளிப்படையாகக் காட்டி, இரு குழுக்களிலிருந்தும் சிலர் அனுப்பப்பட்டதைத் தெளிவுபடுத்துகிறது.
- source_word: Φαρισαίων
  choice: பரிசேயர்கள்
  rationale: யூதக் குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: Ἡρῳδιανῶν
  choice: ஏரோதியர்கள்
  rationale: ஏரோதுடன் தொடர்புடைய குழுவின் பெயரைத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: ἵνα
  choice: சிக்கவைக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் கிரேக்கத் துணைவாக்கியத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀγρεύσωσιν
  choice: சிக்கவைக்க
  rationale: வேட்டையில் பிடிப்பதைக் குறிக்கும் உருவகத்தின் பகைமையான நோக்கத்தை இயல்பாகத் தருகிறது.
- source_word: λόγῳ
  choice: பேச்சில்
  rationale: அவருடைய வாய்மொழிப் பதிலின் வழியாக அவரைச் சிக்கவைக்க நினைத்தனர் என்ற கருவி/வழி சார்ந்த பொருளைத் தருகிறது; கிரேக்கச் சொற்றொடரின் சுருக்கத்தால் உள்ள சிறிய தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: கிரேக்கப் பன்மை வினைச்சொல்லில் எழுவாய் மறைமுகமாக இருப்பது
  choice: அவர்கள்
  alternative: தலைமை ஆசாரியர்கள், மறைநூல் அறிஞர்கள், மூப்பர்கள்; அல்லது அதிகாரிகள்
  rationale: இந்த வசனம் எழுவாயை மீண்டும் பெயரிட்டுச் சொல்லாததால், முந்தைய சூழலிலிருந்து குறிப்பிட்ட அடையாளத்தை முதன்மை உரைக்குள் சேர்க்காமல் மறைமுகப் பன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை. வரலாற்று நிகழ்காலம் தக்கவைக்கப்பட்டுள்ளது. “பேச்சில் சிக்கவைக்க” என்பது சுருக்கமானதும் இயல்பானதும்; மாற்று விரிவாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
