translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான விவிலிய நடையுடன் மொழிபெயர்க்கப்பட்டது. இயேசுவைக் குறிக்கும் மறைமுக எழுவாய் தமிழில் குழப்பம் தரக்கூடும் என்பதால் பெயர் வெளிப்படையாகச் சேர்க்கப்பட்டது. காணிக்கைப் பெட்டி/கருவூலம் என்ற மூலச்சொல்லின் இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
