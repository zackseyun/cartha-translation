source:
  edition: SBLGNT
  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: ta
  text: அவர் காணிக்கைப் பெட்டிக்கு[a] எதிரே உட்கார்ந்து, மக்கள் அதில் செம்பு நாணயங்களை எவ்வாறு போட்டுக்கொண்டிருந்தார்கள் என்பதை கவனித்துக்கொண்டிருந்தார்; செல்வந்தர்கள் பலர் மிகுதியாகப் போட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயக் கருவூலம்” அல்லது “காணிக்கைப் பெட்டி.” கிரேக்கச் சொல் ஆலயக் கருவூலத்தையோ, அதனுடன் தொடர்புடைய காணிக்கைப் பெட்டிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: உட்கார்ந்து
  rationale: முதன்மைச் செயலுக்கு முன்பான சூழல் அமைக்கும் செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: κατέναντι
  choice: எதிரே
  rationale: நேரெதிரான இருப்பிடத்தைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ்.
- source_word: γαζοφυλάκιον
  choice: காணிக்கைப் பெட்டி
  rationale: பணம் அதற்குள் போடப்படுவதாக வசனம் கூறுவதால், ஆலயக் கருவூலத்துடன் தொடர்புடைய காணிக்கை ஏற்கும் பெட்டியை இயல்பாகக் குறிக்கிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐθεώρει
  choice: கவனித்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியான கவனிப்பை வெளிப்படுத்துகிறது.
- source_word: πῶς
  choice: போடுவதை
  rationale: தமிழில் இயல்புக்காக தனியான ‘எப்படி’ சேர்க்கப்படவில்லை; சூழலில் காணிக்கை செலுத்தும் நிகழ்வை அவர் தொடர்ந்து கவனித்தார் என்ற கருத்து தரப்படுகிறது. இருப்பினும், கிரேக்கச் சொல் முறையையும் விதத்தையும் சுட்டக்கூடியது.
- source_word: ὄχλος
  choice: மக்கள்
  rationale: கூடியிருந்த பொதுமக்களைக் குறிக்கும் நவீன, இயல்பான கூட்டுப்பெயர்.
- source_word: βάλλει / ἔβαλλον
  choice: பணம் போடுவதை / போட்டார்கள்
  rationale: காணிக்கைப் பெட்டியில் பணம் செலுத்தும் சூழலில் βάλλω என்பதற்கான இயல்பான தமிழ்; இரண்டாம் வினையில் தொடர்ச்சியாக நடந்த செயல் சூழலால் தெளிவாகிறது.
- source_word: χαλκόν
  choice: பணம்
  rationale: சொற்பொருள் செம்பு அல்லது செம்பு நாணயங்கள்; இங்கு பணமாகப் பயன்படுத்தப்பட்ட நாணயங்களை பொதுவாகக் குறிக்கிறது. ‘பணம்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: πολλοὶ πλούσιοι
  choice: செல்வந்தர்கள் பலர்
  rationale: பாலினத்தைத் தேவையின்றி வரையறுக்காமல், பல செல்வமுள்ள நபர்களைக் குறிக்கிறது.
- source_word: πολλά
  choice: பெருந்தொகையாக
  rationale: பணச் சூழலில் ‘மிகுதியான அளவு’ என்ற இடைநிலைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
