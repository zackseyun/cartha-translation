revisions:
- from: இயேசு காணிக்கைப் பெட்டிக்கு[a] எதிரே உட்கார்ந்து, மக்கள் அதில் பணம் போடுவதை கவனித்துக்கொண்டிருந்தார். செல்வந்தர்கள் பலர் பெருந்தொகையாகப் போட்டார்கள்.
  to: அவர் காணிக்கைப் பெட்டிக்கு[a] எதிரே உட்கார்ந்து, மக்கள் அதில் செம்பு நாணயங்களை எவ்வாறு போட்டுக்கொண்டிருந்தார்கள் என்பதை கவனித்துக்கொண்டிருந்தார்; செல்வந்தர்கள் பலர் மிகுதியாகப் போட்டுக்கொண்டிருந்தார்கள்.
  rationale: The revision restores the manner-focused πῶς, represents both imperfect verbs as ongoing actions, and renders χαλκόν as copper coinage. It also avoids adding 'இயேசு,' which is supplied by the wider context but is not present in this verse's Greek text. The footnote continues to preserve the lexical ambiguity of γαζοφυλάκιον.
