id: MRK.12.5
reference: Mark 12:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: ta
  text: மேலும், அவர் வேறொருவரை அனுப்பினார்; அவரையும் அவர்கள் கொன்றார்கள். இன்னும் பலரையும் அனுப்பினார்; அவர்களில் சிலரை அடித்தார்கள், சிலரைக் கொன்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: வேறொருவரை
  rationale: முன்பு அனுப்பப்பட்ட பணியாளரைத் தொடர்ந்து அனுப்பப்பட்ட இன்னொருவரைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀπέστειλεν
  choice: அவர் ... அனுப்பினார்
  rationale: இறந்தகாலக் கதைநடையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κἀκεῖνον
  choice: அவரையும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் ἐκεῖνον என்பதன் சுட்டுப்பொருளையும் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀπέκτειναν
  choice: அவர்கள் கொன்றார்கள்
  rationale: வினையின் நேரடியான வன்முறைப் பொருளை மழுப்பாமல் வழங்குகிறது.
- source_word: πολλοὺς ἄλλους
  choice: இன்னும் பலரையும்
  rationale: முன்னர் அனுப்பப்பட்டவர்களுக்கு மேலாகப் பல பணியாளர்கள் அனுப்பப்பட்டதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: அவர்களில் சிலரை ... சிலரை
  rationale: பலருக்கு நேர்ந்த இருவகையான நடத்தையைப் பகிர்ந்துரைக்கும் கிரேக்க அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: δέροντες
  choice: அடித்தார்கள்
  rationale: முறையான சாட்டையடி என்று தேவையின்றிக் குறிப்பாக்காமல், δέρω என்பதன் பரந்த பொருளை வழங்குகிறது.
- source_word: ἀποκτέννοντες
  choice: கொன்றார்கள்
  rationale: சுருக்கமான தொடர் நிகழ்வுகளைத் தமிழில் இயல்பான முற்றுவினையாக வழங்குகிறது.
theological_decisions:
- issue: பங்கேற்புவினைகளால் அமைந்த சுருக்கத்தைத் தமிழில் வழங்குதல்
  choice: “அவர்களில் சிலரை அடித்தார்கள், சிலரைக் கொன்றார்கள்” என்று முற்றுவினைகளாக வழங்குதல்
  alternative: “சிலரை அடித்தும் சிலரைக் கொன்றும்”
  rationale: இது கோட்பாட்டுத் தீர்மானமல்ல; οὓς μὲν ... οὓς δὲ என்ற பகிர்ந்துரைக்கும் அமைப்பையும் மீண்டும் மீண்டும் நிகழ்ந்த வன்முறையையும் நவீன தமிழில் தெளிவாகப் பாதுகாக்கும் இலக்கணத் தீர்மானம்.
- issue: πολλοὺς ἄλλους உடன் வெளிப்படையாக இல்லாத அனுப்பும் வினையைத் தமிழில் நிறைவு செய்தல்
  choice: “இன்னும் பலரையும் அனுப்பினார்” என்று ἀπέστειλεν வினையைப் பொருளடிப்படையில் மீட்டுரைத்தல்
  alternative: “மேலும் பலரை—அவர்களில் சிலரை அடித்தார்கள், சிலரைக் கொன்றார்கள்”
  rationale: கிரேக்கத்தில் வினை முன் உறுப்பிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் அதை வெளிப்படையாக மீட்டுரைப்பது உரிமையாளர் பலரை அனுப்பினார் என்ற தொடர்பைத் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. கிரேக்கத்தின் சுருக்கமான இணைப்பை தமிழில் தெளிவாக்க “அனுப்பினார்” மீட்டுரைக்கப்பட்டுள்ளது. அடித்தல் மற்றும் கொல்லுதல் ஆகிய வன்முறைச் சொற்கள் மழுப்பப்படவில்லை.
