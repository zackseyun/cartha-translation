id: MRK.12.29
reference: Mark 12:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “முதலாவது[a] இதுதான்: ‘இஸ்ரயேலே, கேள்! நம் கடவுளாகிய ஆண்டவர்[b], ஆண்டவர் ஒருவரே.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிக் கூறை, “நம் கடவுளாகிய ஆண்டவர் ஒரே ஆண்டவர்” என்றோ, “ஆண்டவரே நம் கடவுள்; ஆண்டவர் மட்டுமே” என்றோ மொழிபெயர்க்கலாம். இந்தக் கிரேக்க வாசகம் உபாகமம் 6:4-ஐ எதிரொலிப்பதால், கடவுளின் ஒருமையையும் அவருக்கே உரிய தனித்தன்மையையும் அல்லது இரண்டையும் வலியுறுத்தக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: இது ஷெமா எனப்படும் உபாகமம் 6:4-ன் மேற்கோள். எனவே இங்குள்ள “ஆண்டவர்” என்பது, YHWH என்ற இறைப்பெயருக்காகச் செப்துவஜிந்தாவில் பயன்படுத்தப்பட்ட κύριος என்ற கிரேக்கச் சொல்லைப் பிரதிபலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: உரையாடலில் பதிலுரைக்கும் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Πρώτη ἐστίν
  choice: முதலாவது இதுதான்
  rationale: பெண்பால் பெயரடையான Πρώτη, சூழலில் மறைமுகமாக உள்ள ‘கட்டளை’ என்பதைக் குறிக்கிறது; தமிழில் அந்தப் பெயர்ச்சொல்லைத் தேவையின்றிச் சேர்க்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: Ἄκουε
  choice: கேள்
  rationale: உபாகமம் 6:4-இல் தொடங்கும் ஷெமா அறிக்கையின் நேரடி அழைப்பையும் உடன்படிக்கைச் செறிவையும் காக்கிறது.
- source_word: Ἰσραήλ
  choice: இஸ்ரயேலே
  rationale: நேரடி விளிப்பைத் தமிழின் இயல்பான விளிவேற்றுமை வடிவில் தருகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் κύριος என்பதற்குரிய இயல்பான மரியாதைத் தலைப்பு; இங்கு அது இறைப்பெயரான YHWH-ஐப் பிரதிபலிக்கும் செப்துவஜிந்தா பயன்பாட்டையும் சுமக்கிறது.
- source_word: ὁ θεὸς ἡμῶν
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைத் தொடர்பை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: εἷς
  choice: ஒருவரே
  rationale: தனிப்பட்ட இறைவனைக் குறிக்கும் தமிழில் இயல்பான வடிவம்; ஒருமையையும் தனித்தன்மையையும் அளவுக்கு மீறி விளக்காமல் காக்கிறது.
theological_decisions:
- issue: ஷெமாவின் இறுதிக் கூறிலுள்ள ஒருமை மற்றும் தனித்தன்மை சார்ந்த பதற்றம்
  choice: நம் கடவுளாகிய ஆண்டவர், ஆண்டவர் ஒருவரே
  alternative: “நம் கடவுளாகிய ஆண்டவர் ஒரே ஆண்டவர்” அல்லது “ஆண்டவரே நம் கடவுள்; ஆண்டவர் மட்டுமே”
  rationale: κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν என்ற கிரேக்கச் சொல்வரிசையை நெருக்கமாகப் பின்பற்றி, இறைவனின் ஒருமையா, அவருக்கே உரிய தனித்தன்மையா, அல்லது இரண்டுமா வலியுறுத்தப்படுகிறது என்பதைத் தீர்மானித்து விடாமல் காக்கிறது.
- issue: κύριος என்பதன் பின்னணியில் உள்ள இறைப்பெயர்
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மாற்கு எழுதிய கிரேக்க உரையின் κύριος என்ற சொல்லை மொழிபெயர்க்கிறது; அதே நேரத்தில் உபாகமம் 6:4-ன் எபிரெயப் பின்னணியில் இது YHWH என்ற இறைப்பெயரைப் பிரதிநிதித்துவப்படுத்துவதை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. “இஸ்ரயேலே, கேள்!” என்பது மேற்கோளின் அழைப்புத் தொனியைத் தக்கவைக்கிறது; இறுதிக் கூறின் உண்மையான இலக்கண மற்றும் இறையியல் இருபொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
