theological_decisions:
- issue: மதப் பாசாங்குக்கு எதிரான எச்சரிக்கையில் κρίμα என்பதன் வலிமை
  choice: கண்டனத் தீர்ப்பு
  alternative: நியாயத்தீர்ப்பு
  rationale: ‘இன்னும் கடுமையான’ என்ற ஒப்பீடு தண்டனை சார்ந்த இறைத் தீர்ப்பைக் குறிப்பதாகச் சூழல் காட்டுகிறது. இருப்பினும் இறுதி நியாயத்தீர்ப்பைப் பற்றிய விரிவான கோட்பாட்டை உரைக்குள் சேர்க்காமல், பரந்த மாற்றுச் சொல்லை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விழுங்கி’ என்ற தீவிர உருவகமும் ‘வீடுகள்’ என்ற concrete சொல்லாட்சியும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற கோட்பாட்டு விளக்கம் தவிர்க்கப்பட்டுள்ளது.
