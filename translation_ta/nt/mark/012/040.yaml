  text: விதவைகளின் வீடுகளை விழுங்கி, வெளித்தோற்றத்திற்காக[a] நீண்ட நேரம் ஜெபிக்கிறவர்கள் அதிகக் கடுமையான தீர்ப்பைப் பெறுவார்கள்[b].
  philosophy: optimal-equivalence
