  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: ta
  text: அவர் இறந்தவர்களின் கடவுள் அல்ல; உயிரோடு இருப்பவர்களின் கடவுள். நீங்கள் பெரிதும் தவறுகிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் மிகவும் வழிதவறியிருக்கிறீர்கள்.”
    reason: πλανᾶσθε என்பது ‘தவறுதல்’ என்றும் ‘வழிதவறுதல்’ என்றும் பொருள்படக்கூடும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: θεὸς
  choice: கடவுள்
  rationale: இது ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரின் கடவுளைக் குறிக்கும் தெய்வீகப் பட்டப்பெயர்; எனவே பொதுவான நவீனத் தமிழில் ‘கடவுள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: νεκρῶν
  choice: இறந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை வடிவம் ‘இறந்தவர்கள்’ என்பதைக் குறிக்கிறது; எதிர்மறை இணையான ζώντων உடனான முரணை இது தெளிவாகக் காக்கிறது.
- source_word: ζώντων
  choice: உயிரோடு இருப்பவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்பு வடிவம் உயிருடன் இருப்பவர்களைக் குறிக்கிறது; இயல்பான நவீனத் தமிழுக்காக இவ்வாறு தரப்பட்டது.
- source_word: πολὺ
  choice: பெரிதும்
  rationale: πλανᾶσθε என்ற வினையின் தீவிரத்தை வலுப்படுத்தும் வினையடை; கண்டனத்தின் வலிமையை dignified modern Tamil-இல் வெளிப்படுத்துகிறது.
- source_word: πλανᾶσθε
  choice: தவறுகிறீர்கள்
  rationale: இச்சூழலில் கருத்து அல்லது புரிதலில் கடுமையாகப் பிழைப்பதைக் குறிக்கிறது; வெளிப்புற ஏமாற்றத்தையோ தாமாக வழிதவறுவதையோ மட்டும் தீர்மானிக்காமல் பொருளைத் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: οὐκ ἔστιν
  choice: அவர் ... அல்ல
  rationale: கிரேக்கத்தில் வெளிப்படையான எழுவாய் இல்லாவிட்டாலும், முந்தைய சூழலில் பேசப்படும் கடவுளைக் குறிக்க இயல்பான தமிழில் ‘அவர்’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: கடவுளுக்கு முன்பாகத் தொடர்ந்து வாழ்வதும் உயிர்த்தெழுதலும் பற்றிய இயேசுவின் வாதம்
  choice: ‘இறந்தவர்கள்’ மற்றும் ‘உயிரோடு இருப்பவர்கள்’ என்ற நேரடியான முரணை மட்டும் காக்கப்பட்டது.
  alternative: இறந்தவர்கள் உண்மையில் உயிருடன் இருக்கிறார்கள் அல்லது இடைநிலையில் வாழ்கிறார்கள் என்று விளக்கிப் பரந்துரைத்தல்.
  rationale: இந்த வசனம் உயிர்த்தெழுதலைப் பற்றிய இயேசுவின் வாதத்திற்குச் சேவை செய்தாலும், மூலவாக்கியம் சொல்லாத கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் இறையியல் அழுத்தமும் திறந்த தன்மையும் காக்கப்பட்டன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘தேவன்’ என்பதற்குப் பதிலாக பரவலாகப் புரியும் ‘கடவுள்’ பயன்படுத்தப்பட்டது; ‘உயிரோடு இருப்பவர்கள்’ என்பது ‘உயிருள்ளோர்’ என்பதைக் காட்டிலும் அன்றாட வாசகருக்கு நேரடியானது.
