source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களிடம், “சீசருக்குரியவற்றைச் சீசருக்கும், கடவுளுக்குரியவற்றைக் கடவுளுக்கும் திருப்பிக் கொடுங்கள்[a]” என்றார். அவர்கள் அவரைக் குறித்து மிகவும் வியந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீசருக்குரியவற்றைச் சீசருக்கும், கடவுளுக்குரியவற்றைக் கடவுளுக்கும் செலுத்துங்கள்.” இந்த வினைச்சொல் திருப்பிக் கொடுப்பது, கடனைச் செலுத்துவது, அல்லது உரியதை அளிப்பது என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: திருப்பிக் கொடுங்கள்
  rationale: வினைச்சொல் திருப்பிக் கொடுத்தல், செலுத்துதல், உரியதை அளித்தல் ஆகிய பொருள்களைக் கொண்டது. வரிக்கு மட்டும் பொருளைக் குறுக்காமல், உரிமை அல்லது கடமை சார்ந்த நுணுக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: சீசருக்குரியவற்றைச் சீசருக்கும்
  rationale: உடைமைப் பொருளைக் காட்டும் கிரேக்க அமைப்பையும், இயேசுவின் கூற்றிலுள்ள இணை அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: கடவுளுக்குரியவற்றைக் கடவுளுக்கும்
  rationale: முதல் கூறுடன் உள்ள திட்டமிட்ட இணை அமைப்பைப் பாதுகாத்து, கடவுளுக்கு உரியது என்ன என்பதை விளக்கிச் சேர்க்காமல் விடுகிறது.
- source_word: ἐξεθαύμαζον
  choice: மிகவும் வியந்தார்கள்
  rationale: ἐκθαυμάζω என்பதிலுள்ள வலுப்படுத்தப்பட்ட வியப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இறந்தகாலத் தொடர்நிலையின் வருணனைச் சார்ந்த வலிமையையும் சூழலில் போதுமான அளவு தருகிறது.
- source_word: ἐπ’ αὐτῷ
  choice: அவரைக் குறித்து
  rationale: வியப்பின் பொருள் அல்லது அடிப்படையாக இயேசுவைக் குறிப்பிடும் கிரேக்கத்தின் நெகிழ்வைத் தக்கவைக்கிறது; அவர்கள் அவர் சொன்ன பதிலால் வியந்தார்கள் என்று மிகையாகத் தெளிவுபடுத்தவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: எதிராளிகளின் கேள்விக்கு இயேசு அளிக்கும் பதிலில் உள்ள மென்மையான எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... என்றார்
  rationale: தமிழின் இயல்பான நேரடிப் பேச்சு அமைப்பில் மூலத்தின் உரையறிமுகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: குடிமை சார்ந்த கடமையும் கடவுளுக்குரிய கடமையும் கொண்டுள்ள உறவு
  choice: இரு இணைக் கூறுகளையும் நேரடியாக மொழிபெயர்த்து, சீசருக்கும் கடவுளுக்கும் உரியவை என்ன என்பதைக் கூடுதலாக வரையறுக்காமல் விடுதல்
  alternative: இதை ஆட்சியதிகாரத்திற்கான வலுவான ஒப்புதலாகவோ, சீசரின் உரிமைக் கோரிக்கையைக் குறைக்கும் மறைமுகக் கூற்றாகவோ வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: வசனம் சீசருக்கும் கடவுளுக்கும் உரியவற்றை அவரவருக்குக் கொடுக்கும்படி கூறுகிறது; ஆனால் அரசு–மத உறவு பற்றிய முழுமையான கோட்பாட்டை வகுக்கவில்லை. ஆகவே அதன் இணை அமைப்பும் இறையியல் பதற்றமும் தீர்க்கப்படாமல் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சீசர்’ என்பது பதவிப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது. இரு கூறுகளின் சொல்லிணை அமைப்பு தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது; எந்த அரசியல் அல்லது சமயப் பிரிவின் தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
