source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: ta
  text: திராட்சைத்தோட்டத்தின் உரிமையாளர்[a] என்ன செய்வார்? அவர் வந்து அந்தக் குத்தகை விவசாயிகளை அழித்து, திராட்சைத்தோட்டத்தை மற்றவர்களுக்குக் கொடுப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சைத்தோட்டத்தின் ஆண்டவர்” அல்லது “திராட்சைத்தோட்டத்தின் எஜமான்.” கிரேக்கத்தில், “திராட்சைத்தோட்டத்தின் கீரியோஸ்.” இங்கே இச்சொல் உவமைக்குள் திராட்சைத்தோட்டத்தின் உரிமையாளரைக் குறிக்கிறது.
    reason: κύριος என்பதற்கான சொல்லியல் மாற்றுவழிகளையும், இவ்விடத்தின் சூழல்சார் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: τί ποιήσει
  choice: என்ன செய்வார்?
  rationale: கிரேக்கத்தின் எதிர்கால வினாவை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது; மூலத்தில் இல்லாத இணைப்புச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின் உரிமையாளர்
  rationale: இந்த உவமையின் கதைச்சூழலில் κύριος என்பது தோட்டத்தின் சொந்தக்காரரைக் குறிக்கிறது. ‘உரிமையாளர்’ என்பது அந்தப் பொருளைத் தெளிவாகத் தருவதோடு, இறைப்பட்டத்தைத் தேவையின்றி உள்ளே கொண்டுவருவதையும் தவிர்க்கிறது.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: திராட்சைத்தோட்டம்
  rationale: ἀμπελών என்பதற்கான இயல்பான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ἐλεύσεται
  choice: அவர் வந்து
  rationale: உரிமையாளர் நேரில் தலையிட வருவதைச் சுருக்கமாகவும் உயிரோட்டமாகவும் காட்டுகிறது; தொடரும் எதிர்கால வினையுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: ἀπολέσει
  choice: அழித்து
  rationale: ἀπόλλυμι குறிக்கும் கடுமையான, தீர்மானமான அழிவைத் தக்கவைக்கிறது; ‘கொல்வார்’ என்று பொருளை தேவையின்றிக் குறுக்கவில்லை.
- source_word: τοὺς γεωργούς
  choice: அந்தக் குத்தகை விவசாயிகளை
  rationale: இவர்கள் வெறும் கூலித் தொழிலாளர்கள் அல்லாமல், மற்றொருவருடைய தோட்டத்தை ஏற்றுப் பயிரிடுகிறவர்கள் என்பதால், வேளாண்மை மற்றும் குத்தகை ஆகிய இரு கூறுகளையும் இச்சொற்றொடர் தெரிவிக்கிறது. குறிப்பிட்ட முன் அறிமுகமான குழுவை கிரேக்க உருபு சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: δώσει
  choice: கொடுப்பார்
  rationale: δίδωμι என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘ஒப்படைப்பார்’ அல்லது ‘குத்தகைக்கு விடுவார்’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: ἄλλοις
  choice: மற்றவர்களுக்குக்
  rationale: கிரேக்கத்தைப் போலவே புதிய பெறுநர்கள் யார் என்பதைத் திறந்த நிலையில் வைக்கிறது; ‘வேறு குத்தகை விவசாயிகளுக்கு’ என்று வெளிப்படையாகாத தகவலைச் சேர்க்கவில்லை.
theological_decisions:
- issue: உவமையின் மனிதப் பாத்திரத்தைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: உரிமையாளர்
  alternative: ஆண்டவர் / எஜமான்
  rationale: உடனடி கதைச்சூழலில் இச்சொல் திராட்சைத்தோட்டத்தின் சொந்தக்காரரைக் குறிக்கிறது. ‘உரிமையாளர்’ என்பது சூழல்சார் பொருளைத் தருகிறது; உவமையின் விரிவான இறையியல் தொடர்புகளை மறுக்காமலும், வசனத்தின் சொல்லிலேயே இறைப்பட்டத்தைத் திணிக்காமலும் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் கண்ணியமான, கடுமையான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. உரிமையைக் காட்டும் ‘உரிமையாளர்’ மற்றும் வேளாண்மை-குத்தகை நிலையைத் தெளிவாக்கும் ‘குத்தகை விவசாயிகள்’ பயன்படுத்தப்பட்டுள்ளன.
