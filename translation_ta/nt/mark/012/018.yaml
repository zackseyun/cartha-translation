source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: ta
  text: 'உயிர்த்தெழுதல் இல்லை என்று சொல்லும் சதுசேயர்கள் அவரிடம் வந்து, அவரிடம் கேள்வி கேட்கத் தொடங்கினார்கள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: சதுசேயர்கள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள, மூலப் பெயரைத் தெளிவாகக் குறிக்கும் வடிவம்.
- source_word: ἀνάστασιν
  choice: உயிர்த்தெழுதல்
  rationale: இறந்தோர் மீண்டும் உயிருடன் எழுவதைக் குறிக்கும் புதிய ஏற்பாட்டின் வழக்கமான சொல்லாக்கம்.
- source_word: μὴ εἶναι
  choice: இல்லை
  rationale: சதுசேயர்களின் மறுப்புக் கூற்றை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἐπηρώτων
  choice: கேள்வி கேட்கத் தொடங்கினார்கள்
  rationale: மாறுபாட்டு வாசிப்பில் உள்ள நிறைவுறாத இறந்தகால வினையின் தொடக்க/தொடர்ச்சி நுணுக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγοντες
  choice: —
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்த தமிழில் தனியாக ‘சொல்லி’ என்பதற்குப் பதிலாக முக்காற்புள்ளி இயல்பாகப் பயன்படுகிறது.
theological_decisions:
- issue: சதுசேயர்களின் உயிர்த்தெழுதல் மறுப்பு
  choice: ‘உயிர்த்தெழுதல் இல்லை என்று சொல்லும்’ என அவர்களின் நிலைப்பாட்டை மட்டும் பதிவு செய்தல்
  alternative: ‘இறந்தவர்கள் உயிர்த்தெழுவதில்லை என்று நம்பும்’
  rationale: மூலத்தின் λέγουσιν மற்றும் ἀνάστασις ஆகியவற்றை நெருக்கமாகப் பேணி, ‘நம்பும்’ அல்லது ‘இறந்தவர்கள்’ போன்ற விளக்கச் சொற்களை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், தொடர்புச் சொற்றொடரை பெயருக்கு முன் வைத்து இயல்பான தமிழாக்கம் செய்யப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தின் நேரடி கேள்விக்குள் தொடர்வதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
