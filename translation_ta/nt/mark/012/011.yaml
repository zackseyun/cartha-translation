lexical_decisions:
- source_word: παρὰ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: παρά என்பதுடன் வரும் உருபுவடிவம் இங்கு மூலத்தையோ தோற்றுவாயையோ குறிக்கலாம். “ஆண்டவரிடமிருந்து” என்பது அந்த மூலப்பொருளை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது; செயற்பாட்டைக் குறிக்கும் “ஆண்டவரால்” என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டின் κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் இணைச்சொல். இங்கு சங்கீத மேற்கோளில் இது கடவுளைக் குறிக்கிறது; எனினும் கிரேக்க மூலத்தில் உள்ள κύριος என்பதையே மொழிபெயர்க்கிறது.
- source_word: ἐγένετο
  choice: வந்தது
  rationale: γίνομαι இச்சொற்றொடரில் ஒன்று நிகழ்ந்தது அல்லது ஒருவரிடமிருந்து தோன்றியது என்ற விரிந்த பொருளைக் கொண்டுள்ளது. “ஆண்டவரிடமிருந்து வந்தது” என்பது தற்செயலாக நிகழ்ந்தது என்ற எண்ணத்தைத் தவிர்த்து, இயல்பான தமிழில் மூலத்தைக் காட்டுகிறது.
- source_word: αὕτη
  choice: இது
  rationale: பெண்பால் சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட நிராகரிக்கப்பட்ட கல் மூலைக்கல்லான நிகழ்வைச் சுட்டுகிறது. “இந்தக் கல்” என்று மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் “இது” எனத் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
- source_word: θαυμαστὴ
  choice: வியப்புக்குரியது
  rationale: θαυμαστός என்பது வியப்பூட்டும் அல்லது அதிசயிக்கத்தக்க ஒன்றைக் குறிக்கிறது. “வியப்புக்குரியது” என்பது சங்கீத மேற்கோளின் உயர்ந்த தொனியையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: நம் கண்களுக்கு
  rationale: இது “நம் பார்வையில்” அல்லது “நமக்கு” என்று பொருள்படும் எபிரேயத் தாக்கமுள்ள கிரேக்க மரபுத்தொடர். “நம் கண்களுக்கு” என்பது மூல உருவகத்தைத் தக்கவைத்தும் தமிழில் புரியத்தக்கதாகவும் உள்ளது.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் சங்கீத மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: அடிப்படையான எபிரேய சங்கீதத்தில் இறைப்பெயர் இருந்தாலும், இங்குள்ள கிரேக்கப் புதிய ஏற்பாட்டு உரை κυρίου என்றே வாசிக்கிறது. ஆகவே பழைய ஏற்பாட்டின் இறைப்பெயரை முதன்மை உரைக்குள் இறக்குமதி செய்யாமல், கிரேக்கச் சொல்லை “ஆண்டவர்” என மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: παρὰ κυρίου என்பது மூலத்தையா செயற்பாட்டையா குறிக்கிறது
  choice: ஆண்டவரிடமிருந்து வந்தது
  alternative: ஆண்டவரால் நிகழ்ந்தது
  rationale: கிரேக்கச் சொற்றொடர் மூலம் மற்றும் செயற்பாடு ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது. முதன்மை உரை மூலத்தைக் குறிக்கும் வாசிப்பைத் தேர்ந்தெடுக்கிறது; உண்மையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
