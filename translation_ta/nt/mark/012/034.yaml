reference: Mark 12:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: ta
  text: இயேசு, அவர் விவேகத்துடன் பதிலளித்ததைக் கண்டு, அவரிடம், “நீ கடவுளுடைய ஆட்சியிலிருந்து வெகு தொலைவில் இல்லை[a]” என்றார். இனிமேல் யாரும் அவரிடம் கேள்வி கேட்கத் துணியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ கடவுளுடைய ஆட்சிக்கு அருகில் இருக்கிறாய்.” கிரேக்க வாசகம் அருகாமையைத் தெரிவிக்கிறது; ஆட்சிக்குள் நுழைந்துவிட்டதை வெளிப்படையாகக் கூறுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டு
  rationale: இறந்தகால வினையெச்சமாக இயல்பான தமிழில் அமைந்து, அவன் அளித்த பதிலை இயேசு கவனித்ததையும் அதனைத் தொடர்ந்து பேசியதையும் தெரிவிக்கிறது.
- source_word: νουνεχῶς
  choice: விவேகமாக
  rationale: சிந்தித்துணர்ந்து, நல்லறிவுடன் பதிலளித்தான் என்ற பாராட்டுக்குரிய பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀπεκρίθη
  choice: பதிலளித்ததை
  rationale: இயேசு பேசுவதற்கு முன் நிகழ்ந்த பதிலைத் தமிழின் வினையெச்சக் கட்டமைப்பில் தெளிவாகக் காட்டுகிறது.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: வெகுதொலைவில் இல்லை
  rationale: அருகாமையைச் சுட்டும் மூல மொழியின் இடவியல் உருவகத்தைப் பாதுகாக்கிறது; ஆட்சிக்குள் ஏற்கெனவே நுழைந்துவிட்டதாகக் கூறுவதில்லை.
- source_word: βασιλείας τοῦ θεοῦ
  choice: கடவுளுடைய ஆட்சி
  rationale: βασιλεία என்பதிலுள்ள அரசாளுதல் மற்றும் ஆட்சிக்குட்பட்ட நிலை ஆகிய பொருள் பரப்பைத் தக்கவைத்து, சாதாரண வாசகருக்கும் புரியும் வகையில் உள்ளது.
- source_word: οὐκέτι
  choice: அதன்பின்
  rationale: அந்தக் கட்டத்திலிருந்து இனி யாரும் கேட்கவில்லை என்ற காலத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐτόλμα
  choice: துணியவில்லை
  rationale: ஒரு செயலை மேற்கொள்ளத் தைரியப்படாத நிலையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπερωτῆσαι
  choice: கேள்வி கேட்க
  rationale: ஒருவரிடம் வினா எழுப்புதல் என்ற அடிப்படைப் பொருளைத் தருகிறது; சூழலில் உள்ள சோதிக்கும் நிழற்பொருளை அளவுக்கு மீறி ‘விசாரித்தல்’ என வலுப்படுத்துவதில்லை.
theological_decisions:
- issue: மறைநூல் அறிஞன் கடவுளுடைய ஆட்சியோடு கொண்டிருந்த உறவு
  choice: “கடவுளுடைய ஆட்சியிலிருந்து வெகுதொலைவில் இல்லை” என்று அருகாமையை மட்டும் கூறுதல்
  alternative: “கடவுளுடைய ஆட்சிக்கு அருகில் இருக்கிறாய்”
  rationale: கிரேக்கம் அருகாமையைத் தெரிவிக்கிறது; அவன் ஏற்கெனவே ஆட்சிக்குள் நுழைந்துவிட்டான் என்றோ அதைச் சொந்தமாகப் பெற்றுவிட்டான் என்றோ வெளிப்படையாகக் கூறவில்லை. இவ்வாறு அவனுடைய விவேகத்தைப் பாராட்டுவதற்கும் அவன் முழுமையாக உள்ளே இருப்பதாக அறிவிக்காததற்கும் இடையிலான இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுளுடைய ஆட்சி’ என்பது வெறும் அரசாங்கம் என்ற எண்ணத்தைக் குறைத்து, கடவுளின் அரசாளுதலையும் அதன் ஆட்சிப்பரப்பையும் திறந்த நிலையில் வைத்திருக்கிறது.
