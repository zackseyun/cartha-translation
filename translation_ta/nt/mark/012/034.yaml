revisions:
- from: இயேசு, அவன் விவேகமாகப் பதிலளித்ததைக் கண்டு, அவனிடம், “நீ கடவுளுடைய ஆட்சியிலிருந்து வெகுதொலைவில் இல்லை[a]” என்றார். அதன்பின் யாரும் அவரிடம் கேள்வி கேட்கத் துணியவில்லை.
  to: இயேசு, அவர் விவேகத்துடன் பதிலளித்ததைக் கண்டு, அவரிடம், “நீ கடவுளுடைய ஆட்சியிலிருந்து வெகு தொலைவில் இல்லை[a]” என்றார். இனிமேல் யாரும் அவரிடம் கேள்வி கேட்கத் துணியவில்லை.
  rationale: The revision preserves every source-level meaning while improving modern Tamil register and making the continuing temporal force of οὐκέτι explicit. The footnote remains anchored to “வெகு தொலைவில் இல்லை” and preserves the intended theological ambiguity.
