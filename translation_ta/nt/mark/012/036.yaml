id: MRK.12.36
reference: Mark 12:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: ta
  text: 'தாவீது தாமே பரிசுத்த ஆவியில்[a] இவ்வாறு சொன்னார்: “ஆண்டவர் என் ஆண்டவரிடம்[b], ‘நான் உன் பகைவர்களை உன் கால்களுக்குக் கீழே வைக்கும்வரை, என் வலப்பக்கத்தில் அமர்ந்திரு’ என்று சொன்னார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியினால்.”
    reason: alternative_reading
  - marker: b
    text: இந்த மேற்கோள் சங்கீதம் 110:1-லிருந்து எடுக்கப்பட்டது. அதன் எபிரெய உரையில் முதலாவது “ஆண்டவர்” என்பது கடவுளின் திருப்பெயரான YHWH-ஐக் குறிக்கிறது; இரண்டாவது “ஆண்டவர்” என்பது தாவீதின் ஆண்டவரைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: தாவீதே
  rationale: αὐτός தரும் வலியுறுத்தலைத் தமிழில் இயல்பாகக் காட்ட, ‘தாவீது தாமே’ என்பதற்குப் பதிலாக வேற்றுமை உருபுடன் கூடிய வலியுறுத்தல் வடிவமான ‘தாவீதே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: ἐν என்பதன் நேரடியான இடைச்சொல் உணர்வைப் பாதுகாக்கிறது; அதேவேளையில் ஆவியானவரின் தூண்டுதலின் துல்லியமான முறையைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, மரியாதைக்குரிய தமிழ் இணைச்சொல். சங்கீத மேற்கோளில் இருமுறையும் வரும் ஒரே கிரேக்கச் சொல்லைத் தமிழிலும் ஒரே சொல்லால் வெளிப்படுத்துகிறது.
- source_word: τῷ κυρίῳ μου
  choice: என் ஆண்டவரிடம்
  rationale: ‘என் ஆண்டவர்’ என்று தாவீது குறிப்பிடுவதைப் பாதுகாத்து, εἶπεν உடன் வரும் மறைமுகப் பேச்சின் இலக்கணத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: Κάθου
  choice: அமர்ந்திரு
  rationale: அரியணை ஏற்றம் சார்ந்த சூழலில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்கும் கட்டளை வடிவம்.
- source_word: ἐκ δεξιῶν μου
  choice: என் வலப்பக்கத்தில்
  rationale: இச்சொற்றொடரின் இடவியல் மரபுத்தொடர் பொருளை இயல்பான தமிழில் தருகிறது; சொல்லுக்குச் சொல் ‘வலதிலிருந்து’ என்று தவறாகப் புரியவிடாது.
- source_word: ἕως ἂν θῶ
  choice: நான் ... வைக்கும்வரை
  rationale: கட்டளையிலிருந்து எதிர்நோக்கப்படும் வருங்கால எல்லையை ‘வரை’ அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: உன் கால்களுக்குக் கீழே
  rationale: மாற்கு உரையில் உள்ள ‘கால்களுக்குக் கீழே’ என்ற அடக்குதலின் உருவகத்தைப் பாதுகாக்கிறது; இங்கு இல்லாத ‘கால்மணை’ என்ற விரிவாக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: தாவீதின் ஆவியால் தூண்டப்பட்ட பேச்சை மொழிபெயர்த்தல்
  choice: பரிசுத்த ஆவியில்
  alternative: பரிசுத்த ஆவியினால்
  rationale: முதன்மை வாசகம் கிரேக்க ἐν என்பதன் வடிவத்தையும், ஆவியானவருடன் தொடர்புடைய நிலையில் தாவீது பேசியதையும் பாதுகாக்கிறது. கருவிப் பொருளான ‘ஆவியினால்’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சங்கீதம் 110:1 மேற்கோளில் κύριος இருமுறை வருதல்
  choice: ஆண்டவர் என் ஆண்டவரிடம்
  alternative: யெகோவா என் ஆண்டவரிடம்
  rationale: மாற்குவின் கிரேக்க உரையில் இரு இடங்களிலும் κύριος என்பதே உள்ளது; ஆகவே முதன்மை உரையில் இரண்டையும் ‘ஆண்டவர்’ என்று மொழிபெயர்த்து வித்தியாசத்தைத் திணிக்கவில்லை. எபிரெய மூலத்தில் முதல் சொல் தெய்வீகப் பெயரைக் குறிக்கிறது என்ற முக்கியத் தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தாவீதே’ என்ற வடிவம் αὐτός தரும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. மேற்கோளுக்குள் மேற்கோள் இருப்பது தமிழ் நிறுத்தக்குறிகளால் தெளிவாக்கப்பட்டுள்ளது.
