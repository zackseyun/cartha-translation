  text: ἑπτὰ ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος ἔλαβεν γυναῖκα, καὶ ἀποθνῄσκων οὐκ ἀφῆκεν σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: ta
  text: ஏழு சகோதரர்கள் இருந்தார்கள்; அவர்களில் முதலாமவன் ஒரு பெண்ணைத் திருமணம் செய்துகொண்டான்; அவன் இறந்தபோது, அவன் எந்தச் சந்ததியையும் விட்டுச் செல்லவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: ஏழு சகோதரர்கள் இருந்தார்கள்
  rationale: ஆண் உடன்பிறந்தவர்களைக் குறிக்கும் மூலத்தின் பொருளையும், இருப்பைக் குறிக்கும் வாக்கிய அமைப்பையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ πρῶτος
  choice: அவர்களில் முதலாமவன்
  rationale: சகோதரர்களின் வரிசையில் முதலில் குறிப்பிடப்படுபவனைச் சுட்டுகிறது; ‘மூத்தவன்’ என்று மொழிபெயர்த்தால் மூலத்தில் கட்டாயமில்லாத வயது சார்ந்த பொருள் சேர்ந்துவிடும்.
- source_word: ἔλαβεν γυναῖκα
  choice: ஒரு பெண்ணை மணந்துகொண்டான்
  rationale: திருமணம் செய்துகொள்வதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளை, சொற்சொல்லான மற்றும் இன்றைய தமிழில் இயல்பற்ற ‘மனைவியை எடுத்தான்’ என்பதற்குப் பதிலாகத் தெளிவாகத் தருகிறது.
- source_word: ἀποθνῄσκων
  choice: அவன் இறந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் கால உறவை இயல்பான தமிழ்க் காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἀφῆκεν
  choice: எதையும் விட்டுச் செல்லவில்லை
  rationale: இறக்கும்போது பின்விட்டுச் செல்லுதல் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: σπέρμα
  choice: சந்ததி
  rationale: சொற்சொல்லாக ‘விதை’ என்று பொருள்படும் இச்சொல், இந்தக் குடும்ப மற்றும் வாரிசுரிமைச் சூழலில் ஒருவருடைய பிள்ளை அல்லது வழித்தோன்றலைக் குறிக்கிறது; ‘சந்ததி’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
