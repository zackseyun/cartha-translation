translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘மூத்தவன்’ என்ற வயது நுணுக்கம் தவிர்க்கப்பட்டுள்ளது.
