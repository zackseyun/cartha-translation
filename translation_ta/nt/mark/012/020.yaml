revisions:
- from: ஏழு சகோதரர்கள் இருந்தார்கள். அவர்களில் முதலாமவன் ஒரு பெண்ணை மணந்துகொண்டான்; அவன் இறந்தபோது சந்ததி[a] எதையும் விட்டுச் செல்லவில்லை.
  to: ஏழு சகோதரர்கள் இருந்தார்கள்; அவர்களில் முதலாமவன் ஒரு பெண்ணைத் திருமணம் செய்துகொண்டான்; அவன் இறந்தபோது, அவன் எந்தச் சந்ததியையும் விட்டுச் செல்லவில்லை.
  rationale: The revision retains the draft’s faithful lexical choices while explicitly marking the first brother as the one who left no offspring. This removes a grammatical ambiguity without adding interpretive content.
  reviewer_model: gpt-5.6-terra
