revisions:
- from: அவர்கள் வந்து அவரிடம், “போதகரே, நீங்கள் உண்மையுள்ளவர் என்றும், யாரைப் பற்றியும் உங்களுக்குக் கவலையில்லை என்றும் எங்களுக்குத் தெரியும். ஏனெனில் நீங்கள் மனிதர்களின் முகத்தைப் பார்ப்பதில்லை[a]; மாறாக, கடவுளின் வழியை உண்மையாகப் போதிக்கிறீர்கள். சீசருக்குத் தலைவரி[b] செலுத்துவது அனுமதிக்கப்பட்டதா, இல்லையா? நாங்கள் அதைச் செலுத்த வேண்டுமா, செலுத்தக் கூடாதா?” என்று கேட்டார்கள்.
