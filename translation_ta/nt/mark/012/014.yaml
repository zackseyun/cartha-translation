language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: ta
  text: அவர்கள் வந்து அவரிடம், “ஆசிரியரே, நீங்கள் உண்மையுள்ளவர் என்றும், யாரையும் பொருட்படுத்துவதில்லை என்றும் எங்களுக்குத் தெரியும். ஏனெனில் நீங்கள் மனிதர்களின் முகத்தைப் பார்த்து நடப்பதில்லை[a]; மாறாக, கடவுளின் வழியை உண்மையாகப் போதிக்கிறீர்கள். சீசருக்குத் தலைவரி[b] செலுத்துவது அனுமதிக்கப்பட்டதா, இல்லையா? நாங்கள் அதைச் செலுத்த வேண்டுமா, செலுத்தக் கூடாதா?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தச் சொற்றொடர், “நீங்கள் மக்களிடம் பாரபட்சம் காட்டுவதில்லை” அல்லது “ஒருவரின் தோற்றம் அல்லது அந்தஸ்தால் பாதிக்கப்படுவதில்லை” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள கிரேக்கச் சொல், ரோம அரசின் கணக்கெடுப்புடன் தொடர்புடைய தனிநபர் வரியை, அதாவது தலைவரியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: நற்செய்தி நூல்களில் ஆசிரியராகப் போதிப்பவரை மரியாதையுடன் அழைக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἀληθὴς
  choice: உண்மையுள்ளவர்
  rationale: ஒருவரின் உண்மைத் தன்மையையும் உண்மையாகப் பேசும் பண்பையும் குறிக்கிறது; ‘உண்மையானவர்’ என்பதில் ஏற்படக்கூடிய ‘போலியல்லாதவர்’ என்ற முதன்மை எண்ணத்தைத் தவிர்க்கிறது.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: யாரைப் பற்றியும் உங்களுக்குக் கவலையில்லை
  rationale: கிரேக்கச் சொற்றொடரின் சற்று கடினமான நேரடி வலிமையைப் பாதுகாக்கிறது; அடுத்துள்ள முகத்தைப் பார்க்காதிருத்தல் என்ற மரபுத்தொடர் இதன் நோக்கத்தை விளக்குகிறது.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: நீங்கள் மனிதர்களின் முகத்தைப் பார்ப்பதில்லை
  rationale: மூலத்தின் தெளிவான முக உருவகத்தை முதன்மை உரையில் வைத்திருக்கிறது; பாரபட்சம் காட்டாதிருத்தல் என்ற மரபுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπ’ ἀληθείας
  choice: உண்மையாக
  rationale: ‘போதிக்கிறீர்கள்’ என்பதை இயல்பாகவும் நேரடியாகவும் விவரிக்கும் வினையடை.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: கடவுளின் வழி
  rationale: மூலத்தின் ‘வழி’ உருவகத்தையும் அதன் வேதாகமச் செறிவையும் தக்கவைக்கிறது.
- source_word: ἔξεστιν
  choice: அனுமதிக்கப்பட்டதா
  rationale: செயல் சட்டரீதியாகவோ நெறிமுறைரீதியாகவோ செய்யத்தக்கதா என்ற கேள்வியை, ஓர் குறிப்பிட்ட சட்ட அமைப்பைத் தேவையின்றி முன்வைக்காமல் வெளிப்படுத்துகிறது.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: சீசருக்குத் தலைவரி செலுத்துவது
  rationale: κῆνσος என்பது ரோம அரசின் கணக்கெடுப்பு சார்ந்த தனிநபர் வரியைக் குறிக்கிறது; வரியை ‘கொடுப்பது’ என்பதற்குப் பதில் ‘செலுத்துவது’ நவீனத் தமிழில் இயல்பானது.
- source_word: Καίσαρι
  choice: சீசருக்கு
  rationale: ரோமப் பேரரசரின் மரபான பட்டப்பெயரை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: நாங்கள் அதைச் செலுத்த வேண்டுமா, செலுத்தக் கூடாதா?
  rationale: கிரேக்கத்தில் மீண்டும் வரும் வினைச்சொல்லின் கூர்மையைக் காக்கிறது; தமிழில் தெளிவுக்காக வரியைக் குறிக்கும் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மனிதர்களின் முகத்தைப் பாராதிருத்தல் என்ற மரபுத்தொடர்
  choice: மூலத்தின் முக உருவகத்தை முதன்மை உரையில் தக்கவைத்து, அதன் பாரபட்சமின்மை சார்ந்த பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: நீங்கள் மக்களிடம் பாரபட்சம் காட்டுவதில்லை / வெளித்தோற்றத்தால் பாதிக்கப்படுவதில்லை
  rationale: இது இயேசுவைப் புகழ்வதுபோல் அமைந்த வஞ்சகப் பேச்சின் மூல உருவகத்தையும் அதன் பொருள் பரப்பையும் வாசகர் காண அனுமதிக்கிறது; எந்தக் கோட்பாட்டுச் சிறப்புப் பொருளையும் திணிக்கவில்லை.
- issue: ἔξεστιν என்பதன் சட்ட மற்றும் நெறிமுறைத் திறந்த தன்மை
  choice: அனுமதிக்கப்பட்டதா
  alternative: சட்டப்படி நியாயமா
  rationale: கேள்வி ரோமச் சட்டத்தை மட்டும் குறிக்கிறதா, கடவுளுடைய கட்டளையின்படி நியாயமானதா என்பதைக் கிரேக்கம் வெளிப்படையாகத் தீர்மானிக்கவில்லை. ‘அனுமதிக்கப்பட்டதா’ அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: மரியாதைப் பன்மையுடன் கூடிய நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மொழிநடை பொதுவாசகர்களுக்குப் புரியும்படி இயல்பாக இருந்தாலும், ‘முகத்தைப் பார்ப்பதில்லை’ மற்றும் ‘கடவுளின் வழி’ போன்ற மூல உருவகங்கள் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளன.
