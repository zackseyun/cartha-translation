source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: ta
  text: அவரைப் பிடித்து, கொன்று, திராட்சைத்தோட்டத்துக்கு வெளியே எறிந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: அவரைப் பிடித்து
  rationale: முன்னதாக நிகழும் செயலைக் குறிக்கும் இறந்தகால வினையெச்சம். இச்சூழலில் ‘அவரைப் பிடித்து’ என்பது செயல்வரிசையை இயல்பான தமிழில் காட்டுகிறது; மூலச்சொல்லில் இல்லாத அளவுக்கு வன்முறையை வலியுறுத்தும் சொல்லைத் தவிர்க்கிறது.
- source_word: ἀπέκτειναν
  choice: கொன்று
  rationale: ἀποκτείνω என்பதன் நேரடியான பொருள் ‘கொல்லுதல்’; சுருக்கமான, கடுமையான செயல்வரிசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐξέβαλον
  choice: எறிந்தார்கள்
  rationale: ἐκβάλλω இங்கு வலுக்கட்டாயமாக வெளியே வீசுதல் அல்லது எறிதல் என்ற பொருளைக் கொண்டுள்ளது. ‘எறிந்தார்கள்’ அதன் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்திற்கு வெளியே
  rationale: ἐξέβαλον உடன் சேர்ந்து, திராட்சைத்தோட்டத்தின் உள்ளிருந்து வெளியே நிகழும் நகர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀμπελῶνος
  choice: திராட்சைத்தோட்டம்
  rationale: ἀμπελών என்பதற்கான வழக்கமான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்.
theological_decisions:
- issue: கொல்லுதலும் திராட்சைத்தோட்டத்திற்கு வெளியே எறிதலும் நிகழும் வரிசை
  choice: மாற்கு கிரேக்க உரையின்படி முதலில் அவரைக் கொன்று, பின்னர் திராட்சைத்தோட்டத்திற்கு வெளியே எறிந்ததாக மொழிபெயர்க்கப்பட்டது.
  alternative: இணையான உவமை மரபை ஒட்டி, முதலில் வெளியே எறிந்து பின்னர் கொன்றதாக அமைத்தல்.
  rationale: SBLGNT உரையில் λαβόντες, ἀπέκτειναν, ἐξέβαλον என்ற வரிசை உள்ளது. இணையான பகுதிகளோடு ஒத்திசைக்காமல், மாற்குவின் உரையில் உள்ள வரிசையும் அதனால் தோன்றும் விளக்கத் தளர்வும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் சுருக்கமான, கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் வேகமான மூன்று-செயல் வரிசை பாதுகாக்கப்பட்டுள்ளது.
