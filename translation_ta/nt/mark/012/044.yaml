revisions:
- from: ஏனெனில், அவர்கள் எல்லாரும் தங்களிடம் மிகுதியாக இருந்ததிலிருந்து போட்டார்கள்; ஆனால் இவளோ தன் வறுமையிலிருந்து, தன்னிடம் இருந்த அனைத்தையும்—தன் பிழைப்புக்கான முழுத் தொகையையும்—போட்டாள்.
  to: ஏனெனில், அவர்கள் எல்லாரும் தங்களிடம் மிகுதியாக இருந்ததிலிருந்து போட்டார்கள்; ஆனால் இவளோ தன் வறுமையிலிருந்து, தன்னிடம் இருந்த அனைத்தையும்—தன் வாழ்வாதாரம் முழுவதையும்—போட்டாள்.
