id: MRK.12.44
reference: Mark 12:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் எல்லாரும் தங்களிடம் மிகுதியாக இருந்ததிலிருந்து போட்டார்கள்; ஆனால் இவளோ தன் வறுமையிலிருந்து, தன்னிடம் இருந்த அனைத்தையும்—தன் வாழ்வாதாரம் முழுவதையும்—போட்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: செல்வந்த காணிக்கையாளர்கள் அனைவரையும் குறிக்கும் பன்மைச் சொல்லின் முழுமையை இயல்பான தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் இயேசு அளித்த மதிப்பீட்டுக்கான விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: தங்களிடம் மிகுதியாக இருந்ததிலிருந்து
  rationale: தேவைக்கு மேலாக இருந்தவற்றிலிருந்து கொடுத்தார்கள் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது; வெறும் செல்வநிலையைவிட மூலத்தின் மிகுதியை முன்னிறுத்துகிறது.
- source_word: ἔβαλον / ἔβαλεν
  choice: போட்டார்கள் / போட்டாள்
  rationale: காணிக்கைப் பெட்டியில் பணத்தைப் போடும் நேரடியான செயலைப் பாதுகாப்பதோடு, கிரேக்க மூலத்தில் இருமுறை வரும் வினையையும் தமிழில் எதிரொலிக்கச் செய்கிறது.
- source_word: αὕτη δὲ
  choice: ஆனால் இவளோ
  rationale: மற்ற காணிக்கையாளர்களுக்கும் இந்த விதவைக்கும் இடையிலான வலுவான முரண்பாட்டைத் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: தன் வறுமையிலிருந்து
  rationale: ὑστέρησις குறிக்கும் பற்றாக்குறை மற்றும் பொருளாதார நெருக்கடியைச் சுருக்கமாகவும் வலுவாகவும் தெரிவிக்கிறது.
- source_word: πάντα ὅσα εἶχεν
  choice: தன்னிடம் இருந்த அனைத்தையும்
  rationale: அவளிடம் இருந்தவற்றின் முழுமையையும் வலியுறுத்தும் கிரேக்கக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: தன் பிழைப்புக்கான முழுத் தொகையையும்
  rationale: βίος இச்சூழலில் உயிரையே அல்ல, வாழ்வாதாரமாக இருந்த பொருளாதார வசதியைச் சுட்டுகிறது; முன் வரும் ‘அனைத்தையும்’ என்பதுடன் தொடர்புடைய விளக்க மறுஉரையாகவும் இது செயல்படுகிறது.
theological_decisions:
- issue: விதவையின் காணிக்கையைப் பற்றிய சொல்லில் βίος என்பதன் பொருள்
  choice: பிழைப்புக்கான முழுத் தொகை, அதாவது வாழ்வாதாரம்
  alternative: அவளுடைய முழு வாழ்க்கை அல்லது உயிர்
  rationale: சூழல் பணக் காணிக்கையைப் பற்றியது; βίος வாழ்வதற்கான பொருள் வசதியைக் குறிக்க முடியும். எனவே அவள் அச்சமயத்தில் தன் உயிரையே கொடுத்தாள் என்று தவறாக உணர்த்தாமல், அவளுடைய கொடையின் முழுமையை இது காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘இவளோ’ எதிர்மறை ஒப்பீட்டை வலுப்படுத்துகிறது. மூலத்தின் வினைமுறைத் திருப்பத்தைப் பாதுகாக்க ‘போட்டார்கள்/போட்டாள்’ பயன்படுத்தப்பட்டுள்ளது.
