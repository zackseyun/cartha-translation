  terminology: “உருவம்” appropriately renders εἰκών, and “பொறிப்பு” precisely renders a coin’s ἐπιγραφή. “சீசர்” is the established Tamil form of Caesar. The footnote properly identifies that the object of “brought” is implicit in Greek and supplied by context.
