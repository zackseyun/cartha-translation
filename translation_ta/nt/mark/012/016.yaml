id: MRK.12.16
reference: Mark 12:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: ta
  text: அவர்கள் ஒரு நாணயத்தைக் கொண்டுவந்தார்கள்.[a] அவர் அவர்களிடம், “இந்த உருவமும் இந்தப் பொறிப்பும் யாருடையவை?” என்று கேட்கிறார். அவர்கள் அவரிடம், “சீசருடையவை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அதைக் கொண்டுவந்தார்கள்.” கிரேக்கத்தில் செயப்படுபொருள் குறிப்பிடப்படவில்லை; முந்தைய சூழலிலிருந்து தினாரிய நாணயமே குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: ஒரு நாணயத்தைக் கொண்டுவந்தார்கள்
  rationale: φέρω என்பதன் பொருள் ‘கொண்டுவருதல்.’ கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் கேட்கப்பட்ட தினாரிய நாணயமே குறிக்கப்படுகிறது. இயல்பான தமிழுக்காக ‘ஒரு நாணயம்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: λέγει
  choice: கேட்கிறார்
  rationale: இது மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலம். தொடர்ந்து வரும் சொற்கள் ஒரு கேள்வியாக இருப்பதால், நிகழ்காலத்தின் உயிரோட்டத்தைப் பேணும் இயல்பான தமிழாக ‘கேட்கிறார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Τίνος
  choice: யாருடையவை
  rationale: உடைமை அல்லது தொடர்பை வினவும் இறைவேற்றுமை வடிவம்; உருவம், பொறிப்பு ஆகிய இரண்டையும் ஒருங்கே சுட்டும் இயல்பான தமிழ்.
- source_word: εἰκών
  choice: உருவம்
  rationale: நாணயத்தில் காணப்படும் ஆட்சியாளரின் உருவத்தையும் வேதாகமத்தின் பரந்த பயன்பாட்டையும் தெளிவாகக் குறிக்கும் வழக்கமான சொல்.
- source_word: ἐπιγραφή
  choice: பொறிப்பு
  rationale: நாணயத்தின் மீது பொறிக்கப்பட்ட எழுத்தைக் குறிக்கும் துல்லியமான, சுருக்கமான தமிழ்.
- source_word: Καίσαρος
  choice: சீசருடையவை
  rationale: உருவமும் பொறிப்பும் சீசருக்குரியவை என்பதைக் குறிக்கும் இறைவேற்றுமைப் பதில்; பன்மை வினாவுடன் இயல்பாக ஒத்திசைக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மாற்குவின் வரலாற்று நிகழ்காலம் ‘கேட்கிறார்’ எனப் பேணப்பட்டுள்ளது; கேள்வியில் உருவமும் பொறிப்பும் ஒரே உரிமையாளருக்குரியவையா என்று இயல்பான தமிழில் ஒருங்கிணைக்கப்பட்டுள்ளது.
