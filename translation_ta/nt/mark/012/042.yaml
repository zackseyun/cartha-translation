  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: ta
  text: ஒரு ஏழை விதவை வந்து, இரண்டு லெப்டா நாணயங்களை[a] இட்டாள்; அதாவது, ஒரு குவாத்ரான்ஸ்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: லெப்டா என்பது மிகச் சிறிய மதிப்புடைய நாணயம்; இரண்டு லெப்டாக்கள் ஒரு ரோம குவாத்ரான்ஸுக்குச் சமம். இதை ‘மிகச் சிறிய இரண்டு செப்பு நாணயங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: குவாத்ரான்ஸ் என்பது கிரேக்க மூலத்தில் குறிப்பிடப்படும் ரோம நாணயம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: வந்து
  rationale: இறந்தகால வினையெச்சத்தைத் தமிழின் இயல்பான தொடர் வினை அமைப்பில் வழங்குகிறது.
- source_word: μία χήρα πτωχὴ
  choice: ஏழை விதவை ஒருவர்
  rationale: μία இங்கு எண்ணிக்கையை வலியுறுத்தாமல் ஒரு புதிய நபரை அறிமுகப்படுத்துகிறது; மரியாதையும் இயல்பும் காக்க ‘ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔβαλεν
  choice: காணிக்கைப் பெட்டியில் போட்டார்
  rationale: ‘போட்டார்’ என்பது செயலை இயல்பாகச் சொல்கிறது; முந்தைய வசனங்களின் சூழலிலிருந்து தெளிவாகும் இடத்தை வாசகருக்காக வெளிப்படையாக்க ‘காணிக்கைப் பெட்டியில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: λεπτὰ δύο
  choice: இரண்டு லெப்டா நாணயங்கள்
  rationale: கிரேக்க மூலத்தில் உள்ள குறிப்பிட்ட பழங்கால நாணயப் பெயரைப் பாதுகாக்கிறது; அதன் தன்மையும் மதிப்பும் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
- source_word: ὅ ἐστιν
  choice: அவை ... சமம்
  rationale: இரண்டு லெப்டாக்களின் கூட்டு மதிப்பை விளக்கும் தொடரை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: κοδράντης
  choice: ஒரு கொத்ராந்தேஸ்
  rationale: ரோம நாணயத்தின் வரலாற்றுப் பெயரைத் தக்கவைக்கிறது; நவீன நாணய மதிப்பாகத் தவறாக மாற்றப்படவில்லை.
