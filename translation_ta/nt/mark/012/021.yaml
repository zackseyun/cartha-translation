  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: ta
  text: இரண்டாமவனும் அவளை மணந்துகொண்டான்; சந்ததியை விட்டுச்செல்லாமல் இறந்தான். மூன்றாமவனும் அவ்வாறே செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: இரண்டாமவனும்
  rationale: கட்டுரையுடன் வரும் வரிசை எண் இங்கு பெயர்ச்சொல்லாகச் செயல்படுகிறது. சூழலில் சகோதரன் என்பது தெளிவாக இருந்தாலும், இக்கூற்றில் வெளிப்படையாக இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: ἔλαβεν αὐτήν
  choice: அவளை மணந்துகொண்டான்
  rationale: λαμβάνω என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்/பெற்றுக்கொள்’; ஆனால் இங்கு மறுமணம் சார்ந்த சூழலில் ‘மனைவியாக ஏற்றுக்கொண்டான்,’ அதாவது ‘மணந்துகொண்டான்’ என்பதே இயல்பான தமிழ்.
- source_word: ἀπέθανεν
  choice: இறந்துபோனான்
  rationale: எளிய நிகழ்வுரை நடைக்கு ஏற்ற நேரடியான மொழிபெயர்ப்பு.
- source_word: μὴ καταλιπὼν σπέρμα
  choice: பிள்ளை இல்லாமல்
  rationale: இச்சூழலில் σπέρμα என்பது சந்ததி அல்லது பிள்ளையைக் குறிக்கிறது. ‘பிள்ளை இல்லாமல்’ என்பது அவன் இறக்கும்போது சந்ததியை விட்டுச்செல்லவில்லை என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ τρίτος ὡσαύτως
  choice: மூன்றாமவனுக்கும் அவ்வாறே நடந்தது
  rationale: கிரேக்கத்தில் முந்தைய செயல்கள் விடுபட்ட நிலையில் சுருக்கமாகக் கூறப்படுகின்றன. தமிழில் அதே சுருக்கத்தையும் பொருளையும் தெளிவாக வைத்திருக்க இவ்வாறு வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிகழ்வுரை. கிரேக்கத்தின் சுருக்கமான இறுதிக் கூறு இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளது.
