id: MRK.12.24
reference: Mark 12:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: ta
  text: இயேசு அவர்களிடம், “நீங்கள் வேதநூல்களையும் கடவுளின் வல்லமையையும் அறியாததால்தானே தவறுகிறீர்கள்[a]?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழிதவறுகிறீர்கள்.”
    reason: πλανᾶσθε என்பதற்கு ‘தவறில் இருக்கிறீர்கள்’ என்பதோடு ‘வழிதவறுகிறீர்கள்’ என்ற நுட்பமும் இருக்கலாம்.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: இயேசு அவர்களிடம் ... என்றார்
  rationale: φημί என்பதன் எளிய ‘சொல்’ என்ற பொருளையும், நேரடி உரையை இயல்பாக அறிமுகப்படுத்தும் தமிழ் வாக்கிய அமைப்பையும் இது காக்கிறது; ‘பதிலளித்தார்’ போன்ற கூடுதல் நுட்பம் சேர்க்கப்படவில்லை.
- source_word: Οὐ διὰ τοῦτο
  choice: அறியாததால்தானே
  rationale: οὐ உடன் வரும் διὰ τοῦτο உடன்பாட்டை எதிர்பார்க்கும் வினாவாக இருப்பதால், காரணத்தையும் வினாவின் வலியுறுத்தலையும் இயல்பான தமிழில் ‘-தால்தானே’ எடுத்துரைக்கிறது.
- source_word: πλανᾶσθε
  choice: தவறுகிறீர்கள்
  rationale: இச்சூழலில் கருத்துப் பிழையைக் குறிக்கக்கூடியதோடு, கிரேக்கச் சொல்லிலுள்ள ‘வழிதவறுதல்’ என்ற விரிவான சாத்தியத்தையும் முற்றிலும் நீக்காத சுருக்கமான தமிழ் சொல்.
- source_word: μὴ εἰδότες
  choice: அறியாததால்
  rationale: எச்சவினை அமைப்பு அவர்களுடைய தவறுக்கான காரணத்தைத் தருகிறது; தமிழில் காரண விகுதி இதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰς γραφὰς
  choice: வேதநூல்கள்
  rationale: யூத மற்றும் தொடக்கக் கிறிஸ்தவப் பயன்பாட்டில் அங்கீகரிக்கப்பட்ட புனித எழுத்துக்களைக் குறிக்கும் பன்மையை, பொதுவாகப் புரியக்கூடிய நவீன தமிழில் தருகிறது.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: கடவுளின் வல்லமையையும்
  rationale: μηδέ இணைக்கும் இரண்டாவது மறுக்கப்பட்ட பொருளை ‘-யும்’ என்பதன் மூலம் முந்தைய பொருளோடு இணைக்கிறது; δύναμις என்பதற்கு ‘வல்லமை’ இச்சூழலில் இயல்பான, கண்ணியமான தேர்வு.
theological_decisions:
- issue: πλανᾶσθε குறிக்கும் தவறின் இயல்பு
  choice: தவறுகிறீர்கள்
  alternative: வழிதவறுகிறீர்கள்
  rationale: இங்கு உயிர்த்தெழுதல், வேதநூல்கள், கடவுளின் வல்லமை ஆகியவற்றைப் பற்றிய பிழை கண்டிக்கப்படுகிறது. ‘தவறுகிறீர்கள்’ என்பது இதை அறிவுசார் பிழையாக மட்டும் சுருக்காமலும், ஒழுக்க அல்லது ஆன்மீக வஞ்சிப்பாக மட்டும் வலுப்படுத்தாமலும் கிரேக்கத்தின் பொருள் விரிவை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வேதநூல்கள்’ மற்றும் ‘கடவுளின் வல்லமை’ ஆகியவை சாதாரண வாசகர்களுக்குத் தெளிவாகவும் மூலத்தின் சமயச் சூழலைக் காக்குமாறும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
