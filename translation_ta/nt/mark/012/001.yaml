    issue: Added temporal adverbs “பின்பு”
    rationale: Neither occurrence corresponds to a temporal adverb in the Greek. The repeated καί coordinates the actions but does not require ‘then/afterward’; retaining these additions subtly reshapes the narrative sequence.
  - severity: low
    issue: Cross-reference footnote uses “அரண்”
    rationale: The source image is an enclosing fence, hedge, or barrier. “அரண்” can suggest a fortification and is unnecessarily more specific; “வேலி” or “சுற்றுத் தடுப்பு” is preferable.
