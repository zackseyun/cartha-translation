id: MRK.12.1
reference: Mark 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: ta
  text: 'அவர் அவர்களிடம் உவமைகளாகப் பேசத் தொடங்கினார்: “ஒருவர் ஒரு திராட்சைத்தோட்டத்தை நட்டு, அதைச் சுற்றிலும் வேலி அமைத்து[a], திராட்சைச் சாறு சேரும் குழியைத் தோண்டி[b], ஒரு கோபுரத்தைக் கட்டி, அந்தத் தோட்டத்தைக் குத்தகை விவசாயிகளிடம் குத்தகைக்கு விட்டுவிட்டு[c], வெளியூர் சென்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைச் சுற்றிலும் உயிர்வேலி அமைத்து.” கிரேக்கச் சொல் வேலி, உயிர்வேலி, அல்லது சுற்றுத் தடுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, திராட்சைப் பழங்களை மிதிக்கும் இடத்தின் கீழே சாறு வழிந்து வந்து சேரும் தொட்டி அல்லது குழி.
    reason: lexical_clarification
  - marker: c
    text: அல்லது, “அதைத் திராட்சைத்தோட்டப் பயிரிடுவோரிடம் வாடகைக்கு விட்டுவிட்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: பேசத் தொடங்கினார்
  rationale: இறந்தகால வினையுடன் வினையெச்சம் சேர்ந்த தொடக்கநிலைக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் நேராக வெளிப்படுத்துகிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகள் மூலம்
  rationale: இயேசு பயன்படுத்திய உரைமுறையையும் பன்மையையும் இயல்பான தமிழில் காக்கிறது; ‘உவமைகளில்’ என்பதைவிட தெளிவான நடை.
- source_word: Ἀμπελῶνα
  choice: ஒரு திராட்சைத்தோட்டத்தை
  rationale: ἀμπελών என்பதற்கான நேரடியான, பொதுவாகப் புரியும் வேளாண்மைச் சொல்.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: கதையில் நில உரிமையாளரைக் குறிக்கும் ἄνθρωπος என்பதை இயல்பான மரியாதைத் தமிழில் வழங்குகிறது; கிரேக்கத்தில் இல்லாத ἀνήρ சார்ந்த ஆண்பால் வலியுறுத்தலைச் சேர்க்காது.
- source_word: περιέθηκεν φραγμόν
  choice: அதைச் சுற்றிலும் வேலி அமைத்து
  rationale: திராட்சைத்தோட்டத்தைச் சுற்றி பாதுகாப்பான எல்லை அமைத்த செயலைத் தெளிவாகக் கூறுகிறது; φραγμός வேலியையோ உயிர்வேலியையோ குறிக்கலாம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὤρυξεν ὑπολήνιον
  choice: திராட்சைச் சாறு சேகரிக்கும் குழியைத் தோண்டி
  rationale: ὑπολήνιον என்பது திராட்சை மிதிக்கும் மேற்பகுதியின் கீழே சாறு சேகரிக்கும் தொட்டி அல்லது குழி. தொழில்நுட்பச் சொல்லை மட்டும் பயன்படுத்தாமல் அதன் செயல்பாட்டை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ᾠκοδόμησεν πύργον
  choice: ஒரு கோபுரத்தைக் கட்டினார்
  rationale: மூலத்தின் பொதுவான πύργος சொல்லை நோக்கத்தை ஊகித்துச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: அந்தத் தோட்டத்தைக் குத்தகை விவசாயிகளிடம் குத்தகைக்கு விட்டுவிட்டு
  rationale: ἐκδίδωμι குறிக்கும் குத்தகைக்கு விடுதலையும், வேறொருவரின் நிலத்தைப் பயிரிடும் γεωργοί என்போரின் சமூக உறவையும் வெளிப்படையாகக் காக்கிறது.
- source_word: ἀπεδήμησεν
  choice: வெளியூர் சென்றார்
  rationale: சொந்த இடத்தைவிட்டு ஒரு காலத்திற்கு வேறு இடத்திற்குச் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; எவ்வளவு தூரம் அல்லது எவ்வளவு காலம் என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பாலின வெளிப்பாடு
  choice: ஒருவர்
  alternative: ஒரு மனிதர் / ஒரு மனிதன்
  rationale: ἄνθρωπος இங்கு ஒரு தனிநபரை அறிமுகப்படுத்துகிறது; ἀνήρ போல ஆண்பாலைத் தனியாக வலியுறுத்தவில்லை. ‘ஒருவர்’ என்பது கதாபாத்திரத்தின் பாலினத்தை மறுப்பதுமில்லை, மூலத்தைவிட அதிகமாக வலியுறுத்துவதுமில்லை; மேலும் இயல்பான, கண்ணியமான தமிழ்.
- issue: γεωργοῖς என்போரின் குத்தகை உறவு
  choice: குத்தகை விவசாயிகள்
  alternative: விவசாயிகள் / திராட்சைத்தோட்டத் தொழிலாளர்கள்
  rationale: தோட்டம் அவர்களுக்குக் குத்தகைக்கு விடப்படுவதால், உரிமையாளருக்கும் பயிரிடுவோருக்கும் இடையிலான வேறுபாடு உவமையின் தொடர்ச்சிக்கு முக்கியம். ‘குத்தகை விவசாயிகள்’ இந்த உறவை விளக்குகிறது; அவர்களை வெறும் கூலித் தொழிலாளர்களாக மாற்றாது.
- issue: ஏசாயா 5:1–2 உடனான ஒலிப்பு
  choice: மொழிபெயர்ப்பில் தோட்டம், வேலி, சாறு சேகரிக்கும் குழி, கோபுரம் ஆகிய படிமங்களைத் தக்கவைத்து, தொடர்பை அடிக்குறிப்பில் சுட்டுதல்
  alternative: பழைய ஏற்பாட்டு மேற்கோளாக முதன்மை உரையிலேயே வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: மாற்கு இதை நேரடி மேற்கோள் என்று அறிமுகப்படுத்தவில்லை. ஆகவே படிம ஒற்றுமையைப் பாதுகாத்து, அதன் விளக்கப் பொருளை முதன்மை உரைக்குள் சேர்க்காமல் விடுவது உண்மையான இலக்கியத் தொடர்பையும் அதன் மறைமுகத் தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்ச்சியைத் தக்கவைத்தபோதும், தமிழில் வாசிப்புத் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘திராட்சை ஆலை’ என்ற தொழில்நுட்பச் சொல்லுக்குப் பதிலாக சாறு சேகரிக்கும் குழியின் செயல்பாடு முதன்மை உரையில் தெளிவாக்கப்பட்டுள்ளது.
