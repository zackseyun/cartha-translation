  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: ta
  text: உன் கடவுளாகிய ஆண்டவரிடம் உன் முழு இதயத்தோடும், உன் முழு ஆன்மாவோடும்[a], உன் முழு மனதோடும்[b], உன் முழு வலிமையோடும்[c] நீ அன்புகூர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் முழு உயிரோடும்’ என்றும் மொழிபெயர்க்கலாம் (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: ‘உன் முழு புத்தியோடும்’ என்றும் மொழிபெயர்க்கலாம் (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: ‘உன் முழு ஆற்றலோடும்’ என்றும் மொழிபெயர்க்கலாம் (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: நீ அன்புகூர வேண்டும்
  rationale: எதிர்கால வினை வடிவம் இங்கு கட்டளையின் வலிமையைக் கொண்டுள்ளது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் அந்தக் கட்டளைப் பொருளை இது தெரிவிக்கிறது.
- source_word: κύριον τὸν θεόν σου
  choice: உன் கடவுளாகிய ஆண்டவரிடம்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும் θεός என்பதற்கு ‘கடவுள்’ என்றும் மொழிபெயர்த்து, உடைமை உறவையும் உடன்படிக்கைச் சொல்லமைப்பையும் இயல்பான தமிழில் காக்கிறது. ‘அன்புகூர்’ என்பதுடன் ‘-ிடம்’ அமைப்பு நவீனத் தமிழில் இயல்பானது.
- source_word: ἐξ
  choice: -ஓடும்
  rationale: உள்ளம் முதலிய முழு மனிதத் திறன்களைக் கொண்டு அன்புகூர்வதைக் குறிக்கும் இந்த மரபுத்தொடரில், சொல்லுக்குச் சொல் ‘இலிருந்து’ என்பதற்குப் பதிலாக தமிழில் இயல்பான உடனிகழ்ச்சி/கருவிப் பொருள் தரும் ‘-ஓடும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὅλης
  choice: முழு
  rationale: ஒவ்வொரு கூறிலும் வரும் முழுமை வலியுறுத்தலைக் காக்க ‘முழு’ மீண்டும் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: καρδίας
  choice: இதயம்
  rationale: உணர்வு, விருப்பம், உள்ளார்ந்த மையம் ஆகியவற்றைக் குறிக்கக்கூடிய நிலையான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: ψυχῆς
  choice: ஆன்மா
  rationale: ψυχή என்பதன் ‘ஆன்மா/உயிர்/தன்’ என்ற பொருள் வரம்பில், பட்டியலிலுள்ள மற்ற கூறுகளிலிருந்து வேறுபாட்டைப் பாதுகாக்கும் மரபானதும் புரிந்துகொள்ளத்தக்கதுமான சொல்.
- source_word: διανοίας
  choice: மனம்
  rationale: சிந்திக்கும், புரிந்துகொள்ளும் திறனைக் குறிக்கும் διάνοια என்பதற்கு நவீனத் தமிழில் இயல்பான இணைச்சொல்; ‘இதயம்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἰσχύος
  choice: வலிமை
  rationale: ἰσχύς குறிக்கும் பலம் அல்லது ஆற்றலைத் தெளிவான பொதுத் தமிழில் தெரிவிக்கிறது.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: -ஓடும் ... -ஓடும் ... -ஓடும் ... -ஓடும்
  rationale: கிரேக்கத்தின் திரட்டும், வலியுறுத்தும் தொடர் அமைப்பைத் தமிழுக்கேற்ற இணைப்புவிகுதியின் மறுமொழிவால் காக்கிறது.
theological_decisions:
- issue: கட்டளை மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர் / எஜமான்
  rationale: கிரேக்க மூலத்தில் κύριος இருப்பதால் ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்படுகிறது. இது தெய்வப் பெயரின் பின்னணியைத் தனியாக விளக்கிச் சேர்க்காமலும், வெறும் மனித எஜமானைக் குறிக்கும் சொல்லாகச் சுருக்காமலும் உள்ளது.
- issue: முழு மனிதனை விவரிக்கும் நான்கு சொற்கள்
  choice: இதயம் / ஆன்மா / மனம் / வலிமை
  alternative: இதயம் / உயிர் / புத்தி / ஆற்றல்
  rationale: ‘முழு மனிதனோடும்’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் நான்கு தனித்த கூறுகளையும் அவற்றுக்கிடையிலான பொருள் நெருக்கத்தையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘அன்புகூர வேண்டும்’ கட்டளையின் வலிமையை இயல்பாகத் தருகிறது; ‘ஆத்துமா’, ‘கர்த்தர்’, ‘அன்புகூருவாயாக’ போன்ற அதிகம் திருச்சபைச் சார்ந்த அல்லது பழமையான வடிவங்கள் தவிர்க்கப்பட்டுள்ளன. மறுமொழியும் நான்கு கூறுகளும் மூலத்தின் வலியுறுத்தலுக்காகப் பாதுகாக்கப்பட்டுள்ளன.
