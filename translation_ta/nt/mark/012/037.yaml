source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: ta
  text: தாவீதே அவரை ‘ஆண்டவர்’ என்று அழைக்கிறார்; அப்படியிருக்க, அவர் எப்படித் தாவீதின் மகனாக இருக்கிறார்?[a] திரளான மக்கள் அவரை மகிழ்ச்சியுடன் கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அவர் எங்கிருந்து தாவீதின் மகனாக இருக்கிறார்?” இங்கே இது “அவர் எப்படித் தாவீதின் மகனாக இருக்கிறார்?” என்ற தர்க்கரீதியான கேள்வியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: தாவீதே
  rationale: 'αὐτός தரும் வலியுறுத்தலைத் தமிழின் ஏகார வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது: தாவீது வேறு ஒருவர் அல்ல, தாவீதே இவ்வாறு கூறுகிறார்.'
- source_word: λέγει αὐτὸν κύριον
  choice: அவரை ‘ஆண்டவர்’ என்று அழைக்கிறார்
  rationale: இக்கட்டமைப்பில் λέγει என்பது வெறுமனே ‘சொல்கிறார்’ என்பதல்ல; ஒருவரை ஒரு பட்டத்தால் அழைப்பதைக் குறிக்கிறது. κύριος என்பதன் வேதவசன மற்றும் கிறிஸ்துவியல் வலிமையை ‘ஆண்டவர்’ காக்கிறது.
- source_word: πόθεν
  choice: எங்கிருந்து
  rationale: மூலச்சொல்லின் நேரடியான ‘எங்கிருந்து’ என்ற கேள்வியைத் தக்கவைத்து, இயேசுவின் வாதத்தில் உள்ள திட்டமிட்ட பதற்றத்தை விளக்கிக் களையாமல் விடுகிறது.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: தாவீதின் மகனாக இருக்கிறார்
  rationale: தமிழில் சுட்டுப்பெயரால் ஏற்படக்கூடிய தேவையற்ற குழப்பத்தைத் தவிர்க்க αὐτοῦ குறிக்கும் தாவீதின் பெயர் மீண்டும் தரப்படுகிறது. υἱός ‘மகன்’ எனவே வைக்கப்பட்டதால் ‘தாவீதின் மகன்’ என்னும் மெசியா பட்டத்தின் எதிரொலி காக்கப்படுகிறது.
- source_word: ὁ πολὺς ὄχλος
  choice: திரளான மக்கள்
  rationale: இது சமூக வர்க்கத்தைக் குறிக்காமல், பெரும் எண்ணிக்கையிலான கூட்டத்தைக் குறிக்கிறது; ‘திரளான மக்கள்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἤκουεν αὐτοῦ ἡδέως
  choice: அவர் பேசுவதை மகிழ்ச்சியுடன் கேட்டுக்கொண்டிருந்தார்கள்
  rationale: ἤκουεν என்பதன் இறந்தகாலத் தொடர்நிலையை ‘கேட்டுக்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது; ἡδέως குறிக்கும் விருப்பமும் இன்பமும் ‘மகிழ்ச்சியுடன்’ என்பதில் இயல்பாகத் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: தாவீது மெசியாவை ‘ஆண்டவர்’ என்று அழைப்பதன் கிறிஸ்துவியல் வலிமை
  choice: ‘ஆண்டவர்’ என்ற நேரடிப் பட்டமும் அதைத் தொடரும் கேள்வியும் விளக்கச் சேர்க்கையின்றித் தக்கவைக்கப்பட்டன.
  alternative: ‘மெசியாவாகிய அவரை ஆண்டவர்’ என்று வெளிப்படையாக விளக்குவது
  rationale: வசனம் மெசியா வெறும் தாவீதின் வழித்தோன்றல் மட்டுமல்லர் என்ற பதற்றத்தை உருவாக்குகிறது; ஆனால் அது எவ்வாறு தீர்க்கப்பட வேண்டும் என்பதை மொழிபெயர்ப்பே சேர்த்துச் சொல்லக்கூடாது.
- issue: மெசியா சூழலில் υἱός என்பதன் பொருள்
  choice: மகன்
  alternative: வழித்தோன்றல்
  rationale: ‘வழித்தோன்றல்’ வம்சப் பொருளைத் தெளிவாக்கினாலும், ‘தாவீதின் மகன்’ என்ற அறியப்பட்ட மெசியா பட்டத்தையும் இயேசுவின் சொல்வாதத்தையும் ‘மகன்’ சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தாவீதே’ என்ற வடிவம் மூலத்தின் வலியுறுத்தலைச் சுருக்கமாகக் காக்கிறது. πόθεν என்பதன் நேரடி உருவான ‘எங்கிருந்து’ முதன்மை உரையில் வைக்கப்பட்டு, இயல்பான கருத்துப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
