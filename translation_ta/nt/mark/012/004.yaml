translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவனையும்’ என்பது κἀκεῖνον என்பதிலுள்ள தொடர்ச்சி மற்றும் கூடுதல் வலியுறுத்தலைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் அவை சார்ந்த சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
