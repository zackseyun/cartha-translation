- from: மீண்டும் அவர் வேறொரு பணியாளனை அவர்களிடம் அனுப்பினார்.[a] அவனையும் அவர்கள் தலையில் அடித்து,[b] அவமானப்படுத்தினார்கள்.[c]
  to: மீண்டும் அவர் வேறொரு அடிமையை அவர்களிடம் அனுப்பினார்.[a] அவனையும் அவர்கள் தலையில் அடித்து,[b] அவமதித்தார்கள்.[c]
  rationale: The revision preserves every clause of the Greek while using ‘அடிமை’ for δοῦλος, which better reflects the social reality denoted by the source term. It also makes the second clause more fluent in modern standard Tamil and refines the lexical note’s wording without overstating the disputed rare verb.
