  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: ta
  text: மீண்டும் அவர் வேறொரு அடிமையை அவர்களிடம் அனுப்பினார்.[a] அவனையும் அவர்கள் தலையில் அடித்து,[b] அவமதித்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேறொரு பணியாளனை.’ கிரேக்கச் சொல் δοῦλος சூழலுக்கேற்ப ‘அடிமை’ அல்லது ‘பணியாளர்’ என்று மொழிபெயர்க்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: இங்குள்ள அரிய கிரேக்க வினை தலையை இலக்காகக் கொண்ட வன்முறையைக் குறிக்கிறது; ‘தலையில் காயப்படுத்தினார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு அது ‘தலை வெட்டினார்கள்’ என்று பொருள்பட வாய்ப்பில்லை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவனை இழிவாக நடத்தினார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: உவமையின் நிகழ்வுத் தொடரில் அதே செயல் மறுபடியும் நடைபெறுவதை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: ἀπέστειλεν
  choice: அவர் ... அனுப்பினார்
  rationale: இறந்தகாலத்தில் நடந்த எளிய கதை நிகழ்வை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: அனுப்புதல் என்ற வினையோடு இயல்பான தமிழ் இலக்கு வேற்றுமையை வழங்குகிறது.
- source_word: ἄλλον δοῦλον
  choice: வேறொரு பணியாளனை
  rationale: δοῦλος என்பதன் எஜமான்–பணியாளர் உறவை இயல்பான தமிழில் காட்டுகிறது; அதன் ‘அடிமை’ என்ற சமூகநிலைப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: κἀκεῖνον
  choice: அவனையும்
  rationale: ‘அந்த ஒருவனையும்’ என்ற தொடர்ச்சியையும் கூடுதல் வலியுறுத்தலையும் தமிழ் ‘-உம்’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐκεφαλίωσαν
  choice: தலையில் அடித்து
  rationale: அரிய இந்த வினை தலைக்கு எதிராக நிகழ்த்தப்பட்ட வன்முறையைக் குறிக்கிறது; தலை வெட்டுதலை அல்ல. தெளிவான சூழல்சார் பொருள் முதன்மை உரையில் தரப்படுகிறது.
- source_word: ἠτίμασαν
  choice: அவமானப்படுத்தினார்கள்
  rationale: ஒருவரை மதிப்பிழக்கச் செய்து இழிவாக நடத்துதல் என்ற பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
