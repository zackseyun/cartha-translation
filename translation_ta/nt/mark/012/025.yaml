source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: ta
  text: ஏனெனில், இறந்தோரிலிருந்து அவர்கள் உயிர்த்தெழும்போது, அவர்கள் திருமணம் செய்துகொள்வதுமில்லை, திருமணம் செய்து கொடுக்கப்படுவதுமில்லை; மாறாக, வானங்களில் உள்ள தூதர்களைப் போல இருப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் பன்மை: “வானங்களில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: ஏனெனில், ...போது
  rationale: γάρ தரும் விளக்கத் தொடர்பையும் ὅταν தரும் காலப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: இறந்தோரிலிருந்து அவர்கள் உயிர்த்தெழும்போது
  rationale: ἐκ νεκρῶν என்பதன் ‘இறந்தோரிடமிருந்து/இறந்தோரின் நடுவிலிருந்து’ என்ற உயிர்த்தெழுதல் சார்ந்த பொருளையும், செயப்பாட்டு வடிவமல்லாத ἀναστῶσιν என்பதையும் காக்கிறது.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: திருமணம் செய்துகொள்வதும் இல்லை, திருமணம் செய்துவைக்கப்படுவதும் இல்லை
  rationale: οὔτε...οὔτε இணைப்பையும், திருமணம் செய்துகொள்வது மற்றும் பிறரால் திருமணம் செய்துவைக்கப்படுவது என்ற இரு வினைகளின் வேறுபாட்டையும் வெளிப்படுத்துகிறது.
- source_word: ὡς ἄγγελοι
  choice: தூதர்களைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையைத் தெளிவாகக் காக்கிறது; உயிர்த்தெழுந்தவர்கள் தூதர்களாக மாறுகிறார்கள் என்று கூறவில்லை.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில் உள்ள
  rationale: மூலத்தில் உள்ள பன்மை வடிவத்தை தமிழில் இயல்பாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: தூதர்களுடனான ஒப்புமையின் இயல்பு
  choice: உயிர்த்தெழுந்தவர்கள் தூதர்களைப் போல இருப்பார்கள்
  alternative: உயிர்த்தெழுந்தவர்கள் தூதர்களாக மாறுவார்கள்
  rationale: ὡς என்பது அடையாளப்படுத்தலை அல்ல, ஒப்புமையைக் குறிக்கிறது. ஆகவே மனிதர்கள் தூதர்களாக மாறுவதாக மொழிபெயர்க்காமல் ஒப்புமை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திருமணம் செய்துவைக்கப்படுவது’ என்பது γαμίζονται-ன் செயப்பாட்டு பொருளைச் சற்றே முறையான ஆனால் பொதுவாகப் புரியக்கூடிய தமிழில் காக்கிறது. முதன்மை உரை SBLGNT-இன் ‘பரலோகங்களில்’ என்ற பன்மை வாசகத்தைப் பின்பற்றுகிறது; அடிக்குறிப்பு உரை வேறுபாட்டைக் குறிப்பிடுகிறது.
