source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: ta
  text: 'இரண்டாவது இதுதான்: ‘நீ உன்னை அன்புகூருவதுபோல் உன் அயலாரை அன்புகூர வேண்டும்.’ இவற்றைவிடப் பெரிய வேறு கட்டளை இல்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “வேறு எந்தக் கட்டளையும் இவற்றைவிடப் பெரியது அல்ல.” சூழலில் “இவை” என்பது இந்த இரண்டு கட்டளைகளையும் சேர்த்துக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: இரண்டாவது இதுதான்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ‘கட்டளை’ என்பதைச் சூழல் தெளிவாக்குகிறது. ‘இரண்டாவது’ என்பதை முன்வைப்பது மூலத்தின் வலியுறுத்தலையும் முந்தைய முதல் கட்டளையுடனான தொடர்பையும் காக்கிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூர வேண்டும்
  rationale: வேதாகம மேற்கோளில் எதிர்கால வினை கட்டளையின் வலிமையுடன் வருகிறது. நவீனத் தமிழில் ‘வேண்டும்’ அந்தக் கட்டாயப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸν πλησίον σου
  choice: உன் அயலார்
  rationale: πλησίον என்பதற்கான நிலையான வேதாகமச் சொல் ‘அயலார்’; இது லேவியராகமம் 19:18 உடனான தொடர்பையும் நெறிசார் பரப்பையும் காக்கிறது.
- source_word: ὡς σεαυτόν
  choice: உன்மீது நீ அன்புகூருவதுபோல்
  rationale: ‘உன்னைப்போல்’ என்ற சொற்சுருக்கம் தமிழில் ஒப்பீட்டின் நோக்கத்தை மங்கச் செய்யலாம். அன்பின் அளவைக் குறிக்கும் மூலப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: இவற்றைவிடப் பெரிய வேறு கட்டளை இல்லை
  rationale: மூலத்தின் ஒப்பீட்டையும் பன்மையான τούτων (‘இவை’) என்பதையும் நேரடியாகக் காக்கிறது.
- source_word: ἐντολή
  choice: கட்டளை
  rationale: திருச்சட்டச் சூழலுக்கு ஏற்ற, பொதுவாகப் புரியும் தமிழ்ச் சொல்; உடன்படிக்கை சார்ந்த வேதாகமப் பதிவையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்திலுள்ள τούτων (‘இவை’) என்பதன் சுட்டுப்பொருள்
  choice: சூழலில் கூறப்பட்ட இரண்டு கட்டளைகளையும் சேர்த்துச் சுட்டும் பன்மை
  alternative: உடனடியாக முந்திய இரண்டாவது கட்டளையை மட்டும் பொதுப்படுத்திச் சுட்டுதல்
  rationale: பன்மைச் சுட்டுப்பெயர் இயல்பாகச் சூழலில் விவாதிக்கப்பட்ட இரு கட்டளைகளையும் குறிக்கிறது. ‘இவற்றைவிட’ என்பது பன்மையைத் தீர்க்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘அன்புகூர’ மற்றும் ‘கட்டளை’ ஆகியவை வேதாகமத் தொடர்பைக் காக்கின்றன; வாக்கிய அமைப்பு இயல்பான தமிழாக வைக்கப்பட்டுள்ளது.
