reference: Mark 12:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: ta
  text: அவர்கள் அவரைப் பிடிக்க முயன்று கொண்டிருந்தார்கள்; ஆனால் மக்கள் கூட்டத்துக்குப் பயந்தார்கள். ஏனெனில், அவர் அந்த உவமையைத் தங்களைக் குறித்து சொன்னார் என்பதை அவர்கள் அறிந்தார்கள். எனவே, அவரை விட்டுவிட்டு சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτουν
  choice: பிடிக்க முயன்றார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை ongoing/attempted action-ஐக் காட்டுகிறது; தமிழில் ‘முயன்றார்கள்’ என்பது முயற்சியின் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρατῆσαι
  choice: பிடிக்க
  rationale: இங்கு ஒருவரைக் கைப்பற்றுதல் என்ற அடிப்படைப் பொருள் உள்ளது. முறையான சட்ட நடவடிக்கையைத் தெளிவாகக் கூறாததால் ‘கைது செய்ய’ என்பதற்குப் பதில் ‘பிடிக்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: மக்கள் கூட்டத்துக்குப் பயந்தார்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருளை நவீனத் தமிழின் இயல்பான வேற்றுமை அமைப்பில் தருகிறது.
- source_word: ἔγνωσαν
  choice: அறிந்திருந்தார்கள்
  rationale: அவர் முன்பு சொன்ன உவமையைப் பற்றிய அவர்களுடைய உறுதியான உணர்தலைக் காட்டுகிறது; தமிழில் நிகழ்வுகளின் கால உறவை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: πρὸς αὐτοὺς
  choice: தங்களைக் குறித்தே
  rationale: πρός இங்கு உவமை அவர்களை நோக்கி அல்லது அவர்களைப் பற்றிச் சொல்லப்பட்டது என்ற பொருளைக் கொண்டுள்ளது. சூழலின் எதிர்மறைத் தாக்கத்தை உணர்த்தினாலும் ‘அவர்களுக்கு எதிராக’ என்று பொருளை அதிகமாகத் தீர்மானிக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τὴν παραβολὴν
  choice: அந்த உவமையை
  rationale: உடனே முன்பு சொல்லப்பட்ட குறிப்பிட்ட உவமையை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: λέγω-வின் பொதுவான பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: ἀφέντες αὐτὸν
  choice: அவரை விட்டுவிட்டு
  rationale: அவரைப் பிடிக்கும் முயற்சியைக் கைவிட்டு அவரை அங்கேயே விட்டுச் சென்றனர் என்ற சூழல்சார் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: ἀπῆλθον
  choice: அங்கிருந்து சென்றார்கள்
  rationale: இடத்தை விட்டுச் சென்ற narrative movement-ஐ இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πρὸς αὐτοὺς என்பதன் தொடர்பும் எதிர்மறைத் தாக்கமும்
  choice: தங்களைக் குறித்தே
  alternative: தங்களுக்கு எதிராக / தங்களை நோக்கி
  rationale: சூழல் உவமை அவர்களை விமர்சித்ததை உணர்த்துகிறது; இருப்பினும் πρός என்பதே கட்டாயமாக ‘எதிராக’ என்று மட்டும் பொருள்படாது. ஆகவே பிரதான உரை குறிப்பு/தொடர்பை வைத்துக் கொண்டு, மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘மக்கள் கூட்டம்,’ ‘உவமை’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டன. கிரேக்கத்தின் நீண்ட ஒருங்கிணைந்த வாக்கியம் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
