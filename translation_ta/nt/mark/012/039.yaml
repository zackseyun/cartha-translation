  yaml_path: translation/nt/mark/012/039.yaml
  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: ta
  text: யூத வழிபாட்டுக்கூடங்களில் முதன்மையான இருக்கைகளையும்[a], விருந்துகளில் மரியாதைக்குரிய இடங்களையும்[b] விரும்புகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதன்மை இருக்கைகள்”; “மரியாதைக்குரிய இருக்கைகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முதன்மையான இடங்கள்”; பண்டைய விருந்து முறையைச் சொற்சொல்லாகக் காட்டினால், “முதன்மையான சாய்விருக்கைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: முதன்மையான இருக்கைகள்
  rationale: வழிபாட்டுக் கூடத்தில் உயர்ந்த நிலையையும் முன்னுரிமையையும் காட்டும் இருக்கைகளை இது குறிக்கிறது. இத்தமிழாக்கம் பதவிப் பெருமை என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συναγωγαῖς
  choice: யூத வழிபாட்டுக்கூடங்கள்
  rationale: இச்சூழலில் வெறும் கூடுகைகளை அல்ல, யூதர்கள் வழிபாட்டிற்காகக் கூடும் இடங்களைக் குறிக்கிறது. நவீன வாசகர்களுக்குத் தெளிவாக இருக்க ‘யூத’ என்பது விளக்கமாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: πρωτοκλισίας
  choice: மரியாதைக்குரிய இடங்கள்
  rationale: பண்டைய விருந்துகளில் உயர்ந்த மதிப்புடையவர்களுக்கு வழங்கப்பட்ட சாய்ந்து உணவருந்தும் இடங்களை இது குறிக்கிறது. சாய்விருக்கை என்ற பொருட்சார்ந்த வடிவத்தைவிட அதன் சமூகப் பொருளை இத்தேர்வு தெளிவாகக் கூறுகிறது.
- source_word: δείπνοις
  choice: விருந்துகள்
  rationale: பொது மரியாதையும் சமூக அந்தஸ்தும் வெளிப்படும் முறையான உணவு நிகழ்வுகளை இச்சூழலில் ‘விருந்துகள்’ இயல்பாகக் குறிக்கிறது.
- source_word: καὶ ... καὶ
  choice: …ஐயும் …ஐயும்
  rationale: இரண்டு விருப்பங்களையும் இணையாகக் குவித்துக் காட்டும் கிரேக்க இணைப்பமைப்பு தமிழின் ‘உம்’ அமைப்பால் பாதுகாக்கப்படுகிறது.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: யூத வழிபாட்டுக்கூடங்களில் ... விருந்துகளில்
  rationale: இரு சூழல்களிலும் ἐν என்பதன் இடம் அல்லது நிகழ்வு சார்ந்த பொருளை இயல்பான தமிழில் ‘இல்’ வேற்றுமை உருபு தெரிவிக்கிறது.
