translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்தின் ‘விரும்புகிறார்கள்’ என்ற கருத்தை இலக்கண ரீதியாகத் தொடர்வதால், தனிவசனமாகவும் தெளிவாக இருக்க அந்த வினைச்சொல் வெளிப்படையாக இடப்பட்டுள்ளது.
