  source_fidelity: கிரேக்கத்தின் καὶ … καὶ அமைப்பும், συναγωγαῖς, πρωτοκαθεδρίας, δείπνοις, πρωτοκλισίας ஆகியவற்றின் பொருளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. «விரும்புகிறார்கள்» என்பது முந்தைய வசனத்தில் தொடரும் வினையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; பொருளைச் சேர்க்கவில்லை.
  naturalness: «யூத வழிபாட்டுக்கூடங்களில் முதன்மையான இருக்கைகளையும், விருந்துகளில் மரியாதைக்குரிய இடங்களையும் விரும்புகிறார்கள்» என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. «மரியாதைக்குரிய இடங்கள்» விருந்தின் சமூக முன்னுரிமையைக் இயல்பாகத் தெரிவிக்கிறது.
  terminology: «யூத வழிபாட்டுக்கூடங்கள்» συναγωγαῖς என்பதன் வரலாற்றுச் சூழலை வாசகருக்குத் தெளிவாக்குகிறது. «முதன்மையான இருக்கைகள்» மற்றும் «மரியாதைக்குரிய இடங்கள்» ஆகியவை முறையே உயர் அந்தஸ்துடைய அமர்விடங்களையும் விருந்தின் கௌரவ இடங்களையும் நன்றாகக் காட்டுகின்றன. அடிக்குறிப்புகளில் உள்ள «சாய்விருக்கைகள்» பண்டைய உணவுமுறை சார்ந்த சொற்சொல்லான மாற்றைச் சரியாகப் பாதுகாக்கிறது.
