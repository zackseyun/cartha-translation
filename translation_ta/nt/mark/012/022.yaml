  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: ta
  text: அந்த ஏழு பேரும் சந்ததி எதையும் விட்டுச் செல்லவில்லை.[a] எல்லாரிலும் கடைசியாக அந்தப் பெண்ணும் இறந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “விதையை விட்டுச் செல்லவில்லை”; அதாவது, பிள்ளைகளையோ வழித்தோன்றலையோ விட்டுச் செல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: அந்த ஏழு பேரும்
  rationale: முன்னைய சூழலில் குறிப்பிடப்பட்ட ஏழு சகோதரர்களை எண்ணுடன் வரும் கிரேக்கச் சுட்டு உருபு குறிக்கிறது. தமிழில் “அந்த ஏழு பேரும்” என்பது அந்த முந்தைய குறிப்பையும் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: சந்ததி எதையும் விட்டுச் செல்லவில்லை
  rationale: சொற்சொல்லாக “விதையை விட்டுச் செல்லவில்லை” என்றாலும், இங்கு σπέρμα என்பது வழித்தோன்றல் அல்லது சந்ததியைக் குறிக்கிறது. “சந்ததி எதையும்” என்பது பொருளைத் தெளிவாகக் கூறி, மூலத்தின் மறுப்பையும் காக்கிறது.
- source_word: ἔσχατον πάντων
  choice: எல்லாருக்கும் கடைசியாக
  rationale: இந்தச் சொற்றொடர் நிகழ்வுகளின் வரிசையில் இறுதி நிலையைச் சுட்டுகிறது. “எல்லாருக்கும் கடைசியாக” என்பது அதன் வரிசை சார்ந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: καὶ ἡ γυνὴ
  choice: அந்தப் பெண்ணும்
  rationale: καί இங்கு பெண்ணின் மரணத்தையும் முந்தைய மரணங்களுடன் சேர்க்கிறது; “-உம்” அந்தக் கூட்டல் பொருளைத் தெளிவாகத் தருகிறது. “அந்தப் பெண்” முன்னர் அறிமுகமான பெண்ணைக் குறிக்கிறது.
- source_word: ἀπέθανεν
  choice: இறந்தாள்
  rationale: வினைச்சொல்லின் நேரடியான பொருள் “இறந்தாள்.” மூலத்தில் இல்லாத மென்மைப்படுத்தலைச் சேர்க்காமல் தமிழிலும் நேரடியாக வழங்கப்பட்டுள்ளது.
