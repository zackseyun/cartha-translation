  naturalness: “அந்த ஏழு பேரும் சந்ததி எதையும் விட்டுச் செல்லவில்லை” என்பது நவீனத் தரத் தமிழில் தெளிவானது. “எல்லாரிலும் கடைசியாக” என்பது நிகழ்வுவரிசையிலும் குழுவினரிடையிலும் பெண் இறுதியாக இறந்ததை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
