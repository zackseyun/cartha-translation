source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: ta
  text: “போதகரே, ஒருவனுடைய சகோதரன் இறந்து, மனைவியை விட்டுச்சென்றும் பிள்ளை எதையும் விட்டுச்செல்லாமல் இருந்தால், அவனுடைய சகோதரன் அவனுடைய மனைவியைத் திருமணம் செய்துகொண்டு, இறந்த சகோதரனுக்குச் சந்ததியை ஏற்படுத்த வேண்டும் என்று மோசே நமக்காக எழுதினார்.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: உபாகமம் 25:5-ஐப் பார்க்கவும்; இங்கு குறிப்பிடப்படுவது மோசேயின் மைத்துனத் திருமணச் சட்டம்.
    reason: cross_reference
  - marker: b
    text: ‘சந்ததியை ஏற்படுத்த’ என்பது சொல்லுக்குச் சொல் ‘விதையை எழுப்ப’ என்பதாகும்; இறந்த சகோதரனுக்காகச் சந்ததியைப் பெறுவதைக் குறிக்கும் மரபுச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் விளிவேற்றுமைச் சொல்; நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் διδάσκαλος என்பதன் கற்பித்தல் சார்ந்த பொருளைத் தருகிறது.
- source_word: ἔγραψεν ἡμῖν
  choice: நமக்காக எழுதியிருக்கிறார்
  rationale: ἡμῖν என்ற நான்காம் வேற்றுமை இங்கு நன்மை அல்லது தொடர்பைக் குறிக்கிறது; மோசேயின் சட்டம் இஸ்ரவேலருக்காக எழுதப்பட்டதாகப் பேசுவோரின் கூற்றை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ஒருவனுடைய சகோதரன் இறந்து
  rationale: τινος என்பது குறிப்பிடப்படாத ஒருவரைக் குறிக்கும் உரிமைவேற்றுமை; சட்டத்தின் ஆண்–பெண் திருமணச் சூழலைத் தமிழில் தெளிவாக வைத்திருக்க ‘ஒருவனுடைய’ பயன்படுத்தப்பட்டது.
- source_word: καταλίπῃ γυναῖκα
  choice: மனைவியை விட்டுச்சென்று
  rationale: καταλείπω என்பது மரணத்தின்போது ஒருவரை விட்டுச்செல்வதைக் குறிக்கிறது; ‘விட்டுச்சென்று’ அந்தச் சூழலைச் சுருக்கமாகத் தருகிறது.
- source_word: μὴ ἀφῇ τέκνον
  choice: பிள்ளை இல்லாமல் போனால்
  rationale: τέκνον ஒருமையில் இருப்பதை ‘பிள்ளை’ காக்கிறது. முந்தைய ‘விட்டுச்சென்று’ என்பதைக் கனமாக மறுபடியும் சொல்லாமல், குழந்தையின்றி இறந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: அவனுடைய சகோதரன் அந்த மனைவியை ஏற்றுக்கொண்டு
  rationale: இந்தச் சட்டத் திருமணச் சூழலில் λαμβάνω மனைவியாக ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘அந்த மனைவி’ என்பது இறந்தவனின் மனைவியையே சுட்டுவதைத் தெளிவாக்குகிறது; ‘திருமணம் செய்துகொண்டு’ என்பது இன்னும் விளக்கமான மாற்று.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: சந்ததியை உருவாக்க
  rationale: சொல்லுக்குச் சொல் ‘விதையை எழுப்ப’ என்பது தமிழில் தெளிவற்றது. சந்ததியைப் பெறச் செய்வதைக் குறிக்கும் சட்ட மரபுச் சொல்லாட்சியின் பொருளை ‘சந்ததியை உருவாக்க’ இயல்பாகத் தருகிறது.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: இறந்த சகோதரனுக்காக
  rationale: நான்காம் வேற்றுமையின் நன்மை அல்லது தொடர்புப் பொருளை ‘-க்காக’ தருகிறது. இங்கு எந்தச் சகோதரன் குறிக்கப்படுகிறார் என்பதை முன்னுள்ள நிபந்தனையிலிருந்து வெளிப்படையாகத் தெளிவாக்க ‘இறந்த’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: மைத்துனத் திருமணச் சட்டத்தின் மரபுச் சொல்லாட்சியை மொழிபெயர்த்தல்
  choice: ‘அந்த மனைவியை ஏற்றுக்கொண்டு, இறந்த சகோதரனுக்காகச் சந்ததியை உருவாக்க வேண்டும்’
  alternative: ‘அந்த விதவையைத் திருமணம் செய்துகொண்டு, தன் சகோதரனுக்குச் சந்ததியை எழுப்ப வேண்டும்’
  rationale: மூலத்தின் ‘மனைவியை எடுத்துக்கொள்’ மற்றும் ‘விதையை எழுப்பு’ என்ற மரபுச் சொற்களின் சட்ட, குடும்பப் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; ஆனால் இறந்தவருக்கான சந்ததி என்ற பதற்றத்தையும் உறவையும் நீக்கவில்லை.
- issue: பாலினம் குறிக்கும் உறவுச் சொற்கள்
  choice: ‘சகோதரன்’, ‘மனைவி’ ஆகிய பாலினம் தெளிவான சொற்களை வைத்திருத்தல்
  alternative: பாலினப் பொதுமைப்படுத்தலாக ‘உடன்பிறந்தவர்’, ‘வாழ்க்கைத்துணை’ என்று மொழிபெயர்த்தல்
  rationale: ἀδελφός மற்றும் γυνή ஆகியவை இந்த ஆண்–பெண் திருமணச் சட்டச் சூழலில் வெளிப்படையாகப் பாலினத்தைக் குறிக்கின்றன; ஆகவே அவற்றைப் பொதுமைப்படுத்தவில்லை.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழ், மரியாதையான நேரடி உரை, சாதாரண வாசகர்களுக்கு விளங்கும் சட்டத் தொனி ஆகியவற்றை நோக்கமாகக் கொண்டது. ‘போதகரே’ என்பது இயல்பான அழைப்பு; ‘ஏற்றுக்கொண்டு’ என்பது திருமணப் பொருளைச் சூழலிலிருந்து தெரிவிக்கிறது. அடிக்குறிப்புக் குறிகள் இரண்டும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
