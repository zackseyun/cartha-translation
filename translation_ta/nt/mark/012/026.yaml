id: MRK.12.26
reference: Mark 12:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: ta
  text: இறந்தோர் உயிர்த்தெழுப்பப்படுகிறார்கள் என்பதைக் குறித்து, மோசேயின் புத்தகத்தில் முட்புதரைப் பற்றிய பகுதியில்[a] கடவுள் மோசேயிடம் எவ்வாறு கூறினார் என்பதை நீங்கள் வாசித்ததில்லையா? அவர், ‘நான் ஆபிரகாமின் கடவுளாகவும், ஈசாக்கின் கடவுளாகவும், யாக்கோபின் கடவுளாகவும் இருக்கிறேன்’ என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்புதரருகே”; கிரேக்கத் தொடர் முட்புதர் நிகழ்வின் அடிப்படையில் வேதப்பகுதியை அடையாளப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: இறந்தவர்கள் ... என்பதைப் பற்றியோ
  rationale: περί + வேற்றுமை உருபு விவாதப் பொருளை அறிமுகப்படுத்துகிறது. δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் தலைப்பின் அடுத்த அம்சத்துக்குச் செல்கிறது; தமிழ் ‘-ஓ’ அமைப்பு அந்த மாற்றத்தை இயல்பாகத் தருகிறது.
- source_word: ὅτι ἐγείρονται
  choice: எழுப்பப்படுகிறார்கள் என்பதை
  rationale: நிகழ்காலப் passive வடிவத்தைத் தக்கவைத்து, இறந்தோர் தாமாக எழுகிறார்கள் என்று மாற்றாமல், அவர்கள் எழுப்பப்படுகிறார்கள் என்ற உயிர்த்தெழுதல் கருத்தை வெளிப்படுத்துகிறது.
- source_word: οὐκ ἀνέγνωτε
  choice: நீங்கள் வாசிக்கவில்லையா?
  rationale: வேதவசனத்தை அவர்கள் அறிந்திருக்க வேண்டுமென்ற எதிர்பார்ப்போடு கேட்கப்படும் கிரேக்க மறுப்புக் கேள்வியை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: மோசேயின் புத்தகத்தில்
  rationale: βίβλος என்பது புத்தகம் அல்லது சுருள் எனப் பொருள்படலாம்; இங்கு மோசேயின் எழுத்துகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் ‘புத்தகம்’.
- source_word: ἐπὶ τοῦ βάτου
  choice: முட்புதரைப் பற்றிய பகுதியில்[a]
  rationale: முட்புதர் நிகழ்வால் அடையாளப்படுத்தப்படும் வேதப்பகுதியைக் குறிக்கும் மேற்கோள் வழக்கை நவீன வாசகருக்குத் தெளிவாக்குகிறது; சொற்சார்ந்த இடவியல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: கடவுள் அவரிடம் எப்படிக் கூறினார் ... அவர் ... என்று கூறினார்
  rationale: πῶς மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதையும் λέγων நேரடி மேற்கோளைத் தொடங்குவதையும் தெளிவான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: நான் ஆபிரகாமின் கடவுளும் ஈசாக்கின் கடவுளும் யாக்கோபின் கடவுளுமாக இருக்கிறேன்
  rationale: θεός ஒவ்வொரு முறையும் திரும்ப வருவதன் வலியுறுத்தலைப் பாதுகாக்கிறது. தமிழில் சில நேரம் விடப்படும் நிகழ்காலக் குறிப்பை ‘இருக்கிறேன்’ என்று வெளிப்படையாகத் தந்து மேற்கோளின் காலநிலையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ὅτι ἐγείρονται என்பதில் உயிர்த்தெழுதல் மொழி
  choice: எழுப்பப்படுகிறார்கள்
  alternative: எழுகிறார்கள்
  rationale: கிரேக்க passive வடிவத்தைப் பாதுகாப்பதால் உயிர்த்தெழுதல் அவர்கள்மேல் நிகழ்த்தப்படுகிறது என்ற நுணுக்கம் நிலைக்கிறது; செய்பவர் யார் என்பதை மொழிபெயர்ப்பு தேவையின்றி சேர்ப்பதில்லை.
- issue: கடவுளின் தன்னை அடையாளப்படுத்தும் கூற்றின் நிகழ்காலம்
  choice: நான் ... கடவுளுமாக இருக்கிறேன்
  alternative: நான் ... கடவுள்
  rationale: தமிழில் பெயர்ப் பயனிலை நிகழ்கால வினையின்றியும் அமையலாம். எனினும் இங்கு இயேசுவின் வாதத்துக்கு மேற்கோளின் நிகழ்கால வடிவம் முக்கியமானதால் ‘இருக்கிறேன்’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுள்’ என்பது இயல்பான பொதுத் தமிழ் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. மேற்கோளின் மும்முறை அமைப்பும் நிகழ்காலமும் பாதுகாக்கப்பட்டுள்ளன.
