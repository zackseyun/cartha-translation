reference: Mark 12:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: ta
  text: அந்தத் திருச்சட்ட அறிஞர் அவரிடம், “போதகரே, நன்றாகச் சொன்னீர். அவர் ஒருவரே[a]; அவரைத் தவிர வேறு யாரும் இல்லை என்று உண்மையாகவே சொன்னீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலை வெளிப்படையாகக் காட்டும் வகையில், “கடவுள் ஒருவரே” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் “அவர் ஒருவரே” என்றே உள்ளது; ‘அவர்’ யார் என்பது முந்தைய வசனத்தின் சூழலிலிருந்து அறியப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: திருச்சட்ட அறிஞர்
  rationale: இச்சொல் நற்செய்தி நூல்களில் மோசேயின் திருச்சட்டத்தைப் படித்து விளக்கிய அங்கீகரிக்கப்பட்ட அறிஞரைக் குறிக்கிறது. மரபுவழி ‘வேதபாரகர்’ என்பதைக் காட்டிலும் ‘திருச்சட்ட அறிஞர்’ இன்றைய வாசகருக்கு உடனடியாகப் புரியும்; அதே நேரத்தில் பணியின் தன்மையையும் தெளிவாக்குகிறது.
- source_word: Καλῶς
  choice: நன்று!
  rationale: இயேசுவின் முந்தைய பதிலை அங்கீகரிக்கும் வினையடை. தமிழில் தனி பாராட்டாக ‘நன்று!’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: διδάσκαλε
  choice: போதகரே
  rationale: நற்செய்தி நூல்களின் உரையாடல் சூழலில் ஆசிரியராகப் போதிப்பவரை மரியாதையுடன் அழைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐπ’ ἀληθείας
  choice: உண்மையாகவே
  rationale: இயேசு கூறியதன் உண்மைத்தன்மையை வலியுறுத்தும் வினையடைப் பயன்பாட்டைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: εἶπες
  choice: சொன்னீர்
  rationale: அண்மையில் கூறப்பட்ட வார்த்தையைச் சுட்டும் கிரேக்க இறந்தகாலத்தை, மரியாதையானதும் இயல்பானதுமான தமிழ் இறந்தகால வடிவில் தருகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: காரணத்தை அல்ல, இயேசு கூறிய வார்த்தைகளின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால் தமிழில் மேற்கோள் நிறைவு உருபான ‘என்று’ பொருத்தமானது.
- source_word: εἷς ἐστιν
  choice: அவர் ஒருவரே
  rationale: கிரேக்கத்தில் ‘கடவுள்’ என்பது மீண்டும் வெளிப்படையாகக் கூறப்படாமல், முந்தைய சூழலிலிருந்து உணரப்படுகிறது. ‘அவர் ஒருவரே’ என்பது அந்தச் சுருக்கத்தையும் மரியாதை ஒருமையையும் பாதுகாக்கிறது.
- source_word: οὐκ ἔστιν ἄλλος
  choice: வேறு எவரும் இல்லை
  rationale: வேறொருவர் இல்லை என்ற தனித்துவக் கூற்றை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πλὴν αὐτοῦ
  choice: அவரைத் தவிர
  rationale: விலக்கைக் குறிக்கும் கிரேக்கத் தொடரின் நேரடியான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: εἷς ἐστιν என்பதிலுள்ள வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: முதன்மை உரையில் ‘அவர் ஒருவரே’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுள் ஒருவரே’ அல்லது ‘ஒரே கடவுள்தான் இருக்கிறார்’
  rationale: முந்தைய வசனச் சூழலில் குறிப்பிடப்படுபவர் கடவுள் என்பது தெளிவாக இருந்தாலும், இவ்வசனத்தின் கிரேக்கத்தில் θεός என்ற சொல் மீண்டும் இடம்பெறவில்லை. ஆகவே எழுவாயை வெளிப்படையாக்காமல் மூலத்தின் சுருக்கத்தையும் உண்மையான இலக்கணத் தெளிவின்மையையும் பாதுகாத்து, விளக்கமான வடிவத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மரபுவழி ஆனால் இப்போது குறைவாக வெளிப்படையான ‘வேதபாரகர்’ என்பதற்குப் பதிலாக சூழல்சார் ‘திருச்சட்ட அறிஞர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான ‘அவர் ஒருவரே’ என்ற வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
