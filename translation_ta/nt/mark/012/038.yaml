  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: ta
  text: 'மேலும், அவர் தமது போதனையில் கூறிக்கொண்டிருந்தார்: “நீண்ட அங்கிகளை[b] அணிந்துகொண்டு நடமாடவும், சந்தைகளில் வாழ்த்துகளைப் பெறவும் விரும்பும் வேத அறிஞர்களைக் குறித்து எச்சரிக்கையாக இருங்கள்[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேத அறிஞர்களைக் குறித்து விழிப்பாயிருங்கள்” அல்லது “வேத அறிஞர்களிடமிருந்து உங்களைக் காத்துக்கொள்ளுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “நீண்ட அங்கிகள்” என்பது மதிப்புநிலையையும் பொது மரியாதையையும் வெளிக்காட்டும் வகையில் அணியப்பட்ட குறிப்பிடத்தக்க மேலாடைகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: அவர் தமது போதனையில்
  rationale: இது இயேசுவின் போதனையின் சூழலில் அவர் கூறியதைச் சுட்டுகிறது; கிரேக்க அமைப்பையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
- source_word: ἔλεγεν
  choice: கூறிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த அல்லது தொடர்ச்சியான கூறலை வெளிப்படுத்துகிறது.
- source_word: Βλέπετε ἀπὸ
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: குறிப்பிட்டவர்களைக் குறித்து விழிப்புடனும் பாதுகாப்புடனும் இருக்கும்படி கூறும் எச்சரிக்கையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: γραμματέων
  choice: வேத அறிஞர்கள்
  rationale: யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்ற எழுத்தறிஞர்களைக் குறிக்கும் சொல்லை, பழமையான ‘வேதபாரகர்’ என்பதற்குப் பதிலாக நவீன வாசகர்களுக்குத் தெளிவாக வழங்குகிறது.
- source_word: τῶν θελόντων
  choice: விரும்பும்
  rationale: அவர்களுடைய வழக்கமான ஆசையையோ விருப்பத்தையோ நேரடியாகக் காட்டுகிறது.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: நீண்ட அங்கிகளை அணிந்துகொண்டு நடமாடவும்
  rationale: στολή குறிக்கும் நீளமான, மதிப்புநிலையை வெளிக்காட்டும் மேலங்கியையும் περιπατεῖν என்பதன் பொது இடங்களில் நடமாடும் கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἀσπασμοὺς
  choice: வாழ்த்துகளைப் பெறவும்
  rationale: மூலத்தில் ‘வாழ்த்துகள்’ என்றே இருந்தாலும், தமிழில் அவர்கள் நாடும் பொதுமக்களின் மரியாதைமிக்க வாழ்த்துகளை இயல்பாகத் தெரிவிக்க ‘பெறவும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: சந்தைவெளிகளில்
  rationale: விற்பனையும் பொதுமக்கள் கூடுகையும் நடைபெற்ற திறந்த பொது இடங்களைக் குறிக்கும் ἀγοραί என்பதற்கு சுருக்கமான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: வேத அறிஞர்களைப் பற்றிய இயேசுவின் எச்சரிக்கையின் வரம்பு
  choice: பொது மரியாதையையும் மதிப்புநிலையையும் நாடும் பண்பால் விவரிக்கப்படும் வேத அறிஞர்களுக்கு எதிரான ஒழுக்க எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: வேத அறிஞர்கள் அனைவரையும் ஒரு வகுப்பாக முழுமையாகக் கண்டிக்கும் வாசிப்பு.
  rationale: τῶν θελόντων எனும் பங்கேற்பு வினைச்சொற்றொடர் எச்சரிக்கப்படுகிற வேத அறிஞர்களை அவர்களுடைய விருப்பங்களால் விவரிக்கிறது. தமிழ் தொடரும் இந்தத் தொடர்பைத் தக்கவைத்து, கண்டனத்தை எல்லா தனிநபர்களுக்கும் வெளிப்படையாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேதபாரகர்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘வேத அறிஞர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. தொடர்நிலை கூறலை ‘கூறிக்கொண்டிருந்தார்’ தக்கவைக்கிறது; வசனம் அடுத்த வசனத்துடன் தொடருவதால் முடிவில் மேற்கோளுக்குள் காற்புள்ளி வைக்கப்பட்டுள்ளது.
