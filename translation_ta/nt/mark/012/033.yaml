revisions:
- from: மேலும், முழு இருதயத்தோடும் முழு புரிந்துணர்வோடும் முழு வலிமையோடும் அவரிடம் அன்புகூருவதும், தன்னிடம் அன்புகூருவதுபோலத் தன் அயலாரிடமும் அன்புகூருவதும், எல்லாத் தகனபலிகளையும்[a] பலிகளையும் விட மேலானது.
  to: மேலும், முழு இதயத்தோடும் முழுப் புரிந்துணர்வோடும் முழு வலிமையோடும் அவர்மீது அன்புகூருவதும், தன்ன்மீது அன்புகூருவதுபோலத் தன் அயலார்மீதும் அன்புகூருவதும், எல்லாத் தகனபலிகளையும்[a] பலிகளையும் விட மேலானது.
