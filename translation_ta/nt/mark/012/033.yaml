source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: ta
  text: மேலும், முழு இதயத்தோடும் முழுப் புரிந்துணர்வோடும் முழு வலிமையோடும் அவர்மீது அன்புகூருவதும், தன்ன்மீது அன்புகூருவதுபோலத் தன் அயலார்மீதும் அன்புகூருவதும், எல்லாத் தகனபலிகளையும்[a] பலிகளையும் விட மேலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகனபலி” என்பது பலிபீடத்தில் முழுவதுமாக எரிக்கப்படும் பலியைக் குறிக்கிறது.
    reason: ὁλοκαύτωμα என்ற கிரேக்கச் சொல்லின் குறிப்பிட்ட பலிவகைப் பொருளைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: அன்புகூருவதும்
  rationale: பெயர்ச்சொல் தன்மையுடைய வினையெச்ச வடிவை இயல்பான தமிழில் தொழிற்பெயராகக் கொடுத்து, இரு இணையான கூறுகளின் வினைத் தன்மையையும் காக்கிறது.
- source_word: αὐτόν
  choice: அவரிடம்
  rationale: முந்தைய சூழலில் கடவுளைக் குறிக்கும் பிரதிப்பெயரை வெளிப்படையாக ‘கடவுள்’ என்று மாற்றாமல், தமிழுக்குரிய மரியாதை ஒருமை வடிவில் தருகிறது.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: முழு இருதயத்தோடும்
  rationale: முழுமையான உள்ளார்ந்த அர்ப்பணிப்பைத் தெரிவிப்பதோடு, மூலத்தின் இணை அமைப்பையும் காக்கிறது.
- source_word: συνέσεως
  choice: புரிந்துணர்வு
  rationale: σύνεσις குறிக்கும் புரிதல் மற்றும் பகுத்துணர்தலை ‘மனம்’ என்று பொதுமைப்படுத்தாமல் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἰσχύος
  choice: வலிமை
  rationale: ஒருவரின் முழுத் திறனையும் ஆற்றலையும் குறிக்கும் தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: πλησίον
  choice: தன் அயலார்
  rationale: ஒரு குறிப்பிட்ட நபரை அல்லாமல் பொதுவாக ஒருவருக்கு அருகிலிருப்பவரைக் குறிக்கும் ஒருமைச் சொல்லின் பொதுப்பொருளைத் தருகிறது.
- source_word: ὡς ἑαυτόν
  choice: தன்னிடம் அன்புகூருவதுபோல
  rationale: நேரடி இரண்டாம் நபர் உரையாக மாற்றாமல், மூலத்திலுள்ள பொதுவான தற்சுட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: περισσότερόν ἐστιν
  choice: விட மேலானது
  rationale: அன்புக் கட்டளைகளும் பலிகளும் சமமானவை என்று அல்லாமல், முன்னவை மேம்பட்டவை எனக் கூறும் ஒப்பீட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὁλοκαυτωμάτων
  choice: தகனபலிகள்
  rationale: பலிபீடத்தில் முழுவதுமாக எரிக்கப்படும் பலிவகையைக் குறிக்கும் வழக்கிலுள்ள சுருக்கமான வேதாகமத் தமிழ்ச் சொல்; அதன் சிறப்புப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: θυσιῶν
  choice: பலிகள்
  rationale: சடங்காகச் செலுத்தப்படும் பலிகளைப் பொதுவாகக் குறிக்கும் சொல்லை எளிய, dignified தமிழில் தருகிறது.
theological_decisions:
- issue: அன்புக் கட்டளைகளுக்கும் பலி வழிபாட்டுக்கும் உள்ள உறவு
  choice: முழுமையாகக் கடவுளிடம் அன்புகூருவதும் அயலாரிடம் அன்புகூருவதும் எல்லாப் பலிகளையும்விட மேலானவை என்று வசனம் கூறுகிறது.
  alternative: இந்த வசனம் பலி முறையை முற்றிலும் ஒழித்துவிட்டதாகவோ, அன்பையும் பலியையும் சமமாக மதிப்பதாகவோ விளக்குவது.
  rationale: περισσότερόν ἐστιν தெளிவாக மேன்மையைக் குறிக்கிறது; ஆனால் பலி முறையை ஒழிப்பதாக வசனம் வெளிப்படையாகக் கூறாததால் அந்த முடிவு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை. மூலத்தின் இணை அமைப்பும் பொதுவான தற்சுட்டுப் பொருளும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
