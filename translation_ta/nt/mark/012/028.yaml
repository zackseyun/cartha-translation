source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: ta
  text: திருச்சட்ட அறிஞர்களில் ஒருவர் அருகில் வந்து, அவர்கள் விவாதித்துக்கொண்டிருந்ததைக் கேட்டார். இயேசு அவர்களுக்கு நன்றாகப் பதிலளித்ததைக் கண்டு, அவர் இயேசுவிடம், “எல்லாவற்றிலும் முதலாவது கட்டளை எது?”[a] என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவற்றிலும் முதன்மையான கட்டளை எது?” அல்லது “எல்லாவற்றிலும் மிக முக்கியமான கட்டளை எது?”
    reason: πρώτη πάντων என்பது வரிசையில் முதலாவதையோ, தரத்தில் முதன்மையான அல்லது மிக முக்கியமானதையோ குறிக்கலாம்.
lexical_decisions:
- source_word: γραμματέων
  choice: திருச்சட்ட அறிஞர்களில்
  rationale: நற்செய்தி நூல்களின் சூழலில், இந்தச் சொல் யூதத் திருச்சட்டத்தில் தேர்ச்சிபெற்ற அங்கீகரிக்கப்பட்ட அறிஞர்களைக் குறிக்கிறது. பழமையான ‘வேதபாரகர்’ என்பதைக் காட்டிலும் ‘திருச்சட்ட அறிஞர்’ இன்றைய வாசகர்களுக்குத் தெளிவானது.
- source_word: προσελθὼν
  choice: அருகில் வந்து
  rationale: இயேசுவை நோக்கி அணுகிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: அவர்கள் விவாதித்துக்கொண்டிருந்ததைக் கேட்டார்
  rationale: συζητέω என்பது கலந்துரையாடல் அல்லது விவாதத்தைக் குறிக்கலாம்; இங்குள்ள பொதுக் கேள்வி-பதில் சூழலுக்கு ‘விவாதித்துக்கொண்டிருந்தது’ பொருத்தமானது, பகைமையைத் தேவையின்றி வலியுறுத்தாது.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: இயேசு அவர்களுக்கு நன்றாகப் பதிலளித்ததைக் கண்டு
  rationale: கிரேக்கத்தின் உணர்தல் சார்ந்த ‘கண்டு’ என்பதையும் καλῶς என்பதன் நேரடியான ‘நன்றாக’ என்ற பொருளையும் காக்கிறது. பெயர்ச்சுட்டுத் தெளிவுக்காக ‘இயேசு’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἐπηρώτησεν αὐτόν
  choice: அவர் இயேசுவிடம் … என்று கேட்டார்
  rationale: ‘கேட்டார்’ என்பது ἐπερωτάω என்பதற்கான தெளிவான, இயல்பான தமிழ்; சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ‘இயேசுவிடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ποία ἐστὶν ἐντολὴ πρώτη πάντων
  choice: எல்லாக் கட்டளைகளிலும் முதலாவது கட்டளை எது?
  rationale: ‘கட்டளை’ என்பது ἐντολή என்பதன் நேரடி இணை. ‘முதலாவது’ என்பது πρώτη என்பதன் ‘முதல்’ என்ற வடிவைத் தக்கவைத்து, வரிசையிலும் தரநிலையிலும் முதன்மை என்ற சாத்தியங்களை வாசகர் கேட்க இடமளிக்கிறது.
theological_decisions:
- issue: கட்டளையைப் பற்றிய கேள்வியில் πρώτη என்பதன் பொருள்
  choice: எல்லாக் கட்டளைகளிலும் முதலாவது கட்டளை
  alternative: எல்லாக் கட்டளைகளிலும் முதன்மையானது / மிக முக்கியமானது
  rationale: πρώτη என்பது வரிசையில் ‘முதல்’ என்பதையும் தரத்தில் ‘முதன்மையானது’ என்பதையும் குறிக்கக்கூடும். மூலத்தின் உண்மையான அர்த்த அகலத்தைத் தீர்த்துவிடாமல் இருக்க முதன்மை உரையில் ‘முதலாவது’ வைக்கப்பட்டு, தரநிலைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘வேதபாரகர்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ordinary modern readers புரிந்துகொள்ளும் ‘திருச்சட்ட அறிஞர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
