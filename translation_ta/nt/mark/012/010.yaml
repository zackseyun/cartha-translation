language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: ta
  text: “இந்த வேதவசனத்தைக்கூட நீங்கள் வாசித்ததில்லையா? ‘கட்டடக்காரர்கள் நிராகரித்த கல்லே முதன்மை மூலைக்கல் ஆனது.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραφὴν
  choice: வேதவசனம்
  rationale: புதிய ஏற்பாட்டில் γραφή என்பது பொதுவான எழுத்தை அல்ல, புனித வேதத்தில் உள்ள ஒரு குறிப்பிட்ட பகுதியைக் குறிக்கிறது; இங்கு சங்கீத மேற்கோளை இயல்பாகச் சுட்டுகிறது.
- source_word: οὐδὲ ... ἀνέγνωτε
  choice: வாசிக்கவில்லையா ... கூட
  rationale: οὐδέ தரும் வலியுறுத்தலை ‘கூட’ வெளிப்படுத்துகிறது; இறந்தகால வினாவைத் தமிழில் இயல்பான கண்டிக்கும் வினாவாக மொழிபெயர்க்கிறது.
- source_word: Λίθον
  choice: கல்
  rationale: உருவகத்தை விளக்கமாக விரிவுபடுத்தாமல், சங்கீத மேற்கோளின் கல் உருவகத்தை அப்படியே தக்கவைக்கிறது.
- source_word: ἀπεδοκίμασαν
  choice: புறக்கணித்த
  rationale: மதிப்பிட்டு ஏற்காமல் தள்ளியதைக் குறிக்கும் வினையின் மையப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: οἱ οἰκοδομοῦντες
  choice: கட்டுகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான கட்டுமானச் செயலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὗτος
  choice: கல்லே
  rationale: ‘இந்தக் கல்லே’ என்ற கிரேக்க வலியுறுத்தலைத் தமிழின் ஏகாரத்தால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγενήθη
  choice: ஆனது
  rationale: கல் புதிய முதன்மை நிலையை அடைந்ததைக் காட்டுகிறது; செயப்பாட்டு அர்த்தத்தைத் தேவையின்றி திணிக்கவில்லை.
- source_word: εἰς κεφαλὴν γωνίας
  choice: முதன்மையான மூலைக்கல்
  rationale: சொற்றொடரின் ‘மூலையின் தலை’ என்ற சொற்பொருளையும், கட்டடத்தின் பிரதான மூலைக்கல் என்ற பொருளையும் வாசிக்கத் தெளிவான தமிழில் இணைக்கிறது; கட்டடத்தில் அதன் துல்லிய இடம் குறித்த சாத்தியமான வேறுபாட்டை அடிக்குறிப்பு தக்கவைக்கிறது.
theological_decisions:
- issue: சங்கீதம் 118:22-இன் கல் உருவகத்தின் மேசியானியப் பயன்பாடு
  choice: கல், கட்டுகிறவர்கள், மூலைக்கல் ஆகிய உருவகங்களை விளக்கச் சேர்க்கையின்றி தக்கவைத்தல்
  alternative: ‘கல்’ என்பது மேசியா அல்லது இயேசு என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: சூழலில் இந்த மேற்கோள் இயேசுவுக்குப் பொருந்தினாலும், மூலவசனம் அந்த அடையாளத்தை உருவகத்தின் வழியே தெரிவிக்கிறது. மொழிபெயர்ப்பு அதை வெளிப்படையான விளக்கமாக மாற்றாமல் அதன் இறையியல் வலிமையையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதமேற்கோளுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘கூட’ மற்றும் ‘கல்லே’ கிரேக்கத்தின் வலியுறுத்தலை இயல்பான தமிழில் தருகின்றன.
