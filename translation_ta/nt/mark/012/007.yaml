  to: ஆனால் அந்தக் குத்தகை விவசாயிகள் ஒருவருக்கொருவர்[a], ‘இவன்தான் வாரிசு. வாருங்கள், இவனைக் கொல்வோம்; பரம்பரைச் சொத்து நம்முடையதாகும்[b]’ என்று சொன்னார்கள்.
