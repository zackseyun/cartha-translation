id: MRK.12.7
reference: Mark 12:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: ta
  text: ஆனால் அந்தக் குத்தகை விவசாயிகள் ஒருவருக்கொருவர்[a], ‘இவன்தான் வாரிசு. வாருங்கள், இவனைக் கொல்வோம்; பரம்பரைச் சொத்து நம்முடையதாகும்[b]’ என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களுக்குள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரம்பரைச் சொத்து நமக்குச் சொந்தமாகும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: ஆனால் அந்தக் குத்தகை விவசாயிகள்
  rationale: δέ தரும் மென்மையான எதிர்மறைத் திருப்பை ‘ஆனால்’ காட்டுகிறது; ἐκεῖνοι என்பதன் சுட்டுத்தன்மை ‘அந்த’ எனப் பாதுகாக்கப்படுகிறது. திராட்சைத்தோட்ட உவமையின் சூழலில் γεωργοί என்பது உரிமையாளரிடமிருந்து நிலத்தைப் பெற்று உழைக்கும் குத்தகையாளர்களைக் குறிக்கிறது.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: ஒருவருக்கொருவர் … என்று சொன்னார்கள்
  rationale: குழுவினருக்குள் நிகழ்ந்த பரஸ்பர உரையாடலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘தங்களுக்குள்’ என்பதும் சாத்தியமான மாற்று.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: இவன்தான் வாரிசு
  rationale: Οὗτός என்பதன் உடனடி சுட்டுதலை ‘இவன்’ காக்கிறது; வலியுறுத்தப்பட்ட அடையாளத்தை இயல்பாகக் காட்ட ‘தான்’ பயன்படுத்தப்படுகிறது. κληρονόμος என்பதற்கு வழக்கமான சட்ட/குடும்பச் சொல் ‘வாரிசு’.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: வாருங்கள், இவனைக் கொன்றுவிடுவோம்
  rationale: δεῦτε குழுவைச் செயலுக்கு அழைக்கும் ஏவலை ‘வாருங்கள்’ எனவும், முதல் நபர் பன்மை ஏவல் பொருளுள்ள ἀποκτείνωμεν என்பதை ‘கொன்றுவிடுவோம்’ எனவும் நேரடியாக வழங்குகிறது.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: அப்போது பரம்பரைச் சொத்து நம்முடையதாகிவிடும்
  rationale: κληρονομία என்பதன் வாரிசுரிமை சார்ந்த சொத்துப் பொருளை ‘பரம்பரைச் சொத்து’ தெளிவாக்குகிறது; ἡμῶν என்பதன் உடைமை வலியுறுத்தல் ‘நம்முடையதாக’ என்பதில் நிலைக்கிறது. இணைப்பின் விளைவுப் பொருளை இயல்பான தமிழில் ‘அப்போது’ காட்டுகிறது.
theological_decisions:
- issue: உவமைச் சூழலில் γεωργοί என்பதன் பொருள்
  choice: குத்தகை விவசாயிகள்
  alternative: குத்தகைக்காரர்கள்; தோட்டக்காரர்கள்; விவசாயிகள்
  rationale: இவர்கள் வெறும் வேலையாட்கள் அல்லாமல் உரிமையாளருக்குப் பொறுப்புடைய குத்தகை உழவர்கள் என்பதை இச்சொல் காட்டுகிறது; அதேவேளையில் உவமைக்கு மேலதிக இறையியல் அடையாளங்களை மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் உவமையின் சட்ட-வேளாண் சூழலைத் தக்கவைக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. நேரடி உரை இயல்பான தமிழ் வாக்கிய வரிசையில் தரப்பட்டுள்ளது.
