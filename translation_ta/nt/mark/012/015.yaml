id: MRK.12.15
reference: Mark 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: ta
  text: ஆனால் அவர்களுடைய பாசாங்குத்தனத்தை அறிந்த அவர் அவர்களிடம், “என்னை ஏன் சோதிக்கிறீர்கள்[b]? நான் அதைப் பார்ப்பதற்காக ஒரு தினாரியத்தை[a] என்னிடம் கொண்டு வாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தினாரியம் என்பது ரோம வெள்ளி நாணயம்; பொதுவாக அது ஒரு நாள் கூலிக்குச் சமமாகக் கருதப்பட்டது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “என்னை ஏன் சோதனைக்கு உட்படுத்துகிறீர்கள்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்த
  rationale: இயேசு அவர்களுடைய நோக்கத்தை அறிந்திருந்தார் என்ற அறிவுசார் பொருளை இயல்பான தமிழில் தருகிறது; வெறும் ஊகமாகவோ புதிதாக உணர்ந்ததாகவோ மாற்றவில்லை.
- source_word: ὑπόκρισιν
  choice: வெளிவேடத்தை
  rationale: உள்ளார்ந்த நோக்கத்தை மறைத்து நேர்மையானவர்கள்போல் நடிக்கும் தன்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்கச் சொல்லின் அறநெறி சார்ந்த வலிமையையும் காக்கிறது.
- source_word: Τί
  choice: ஏன்
  rationale: πειράζετε என்பதோடு வரும் இக்கேள்வியில் Τί காரணத்தை விசாரிக்கும் வினையடையாகச் செயல்படுகிறது; தமிழில் ‘ஏன்’ என்பதே இயல்பான இணை.
- source_word: πειράζετε
  choice: சோதிக்கிறீர்கள்
  rationale: தொடர்ந்து நடைபெறும் பகைமையான சோதனையைத் தெரிவிக்கிறது. பாவத்திற்கு ஈர்க்கும் பொருளை மட்டும் வலியுறுத்தாமல், கிரேக்கச் சொல்லின் ‘சோதித்தல்/சோதனைக்கு உட்படுத்துதல்’ என்ற பரப்பை காக்கிறது.
- source_word: φέρετέ
  choice: கொண்டுவாருங்கள்
  rationale: பேசுகிறவரிடம் ஒரு பொருளைக் கொண்டுவருமாறு இடப்படும் கட்டளையை இயல்பான மரியாதைப் பன்மைத் தமிழில் தருகிறது.
- source_word: δηνάριον
  choice: ஒரு தினாரிய நாணயத்தை
  rationale: வரலாற்றுச் சிறப்புடைய நாணயப் பெயரைத் தக்கவைத்துக்கொண்டு, இன்றைய வாசகர் அது ஒரு நாணயம் என்பதை உடனே புரிந்துகொள்ள உதவுகிறது.
- source_word: ἵνα ἴδω
  choice: நான் அதைப் பார்ப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα கூறைத் தெளிவாகத் தருகிறது. ‘அதை’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், முன்சொல்லப்பட்ட தினாரிய நாணயமே புரிந்துகொள்ளப்படும் செயப்படுபொருள் என்பதால் தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: πειράζετε என்பதில் இயேசுவின் குற்றச்சாட்டை எவ்வாறு வழங்குவது
  choice: பகைமையான நோக்கத்துடன் சோதித்தல்
  alternative: சோதனைக்கு உட்படுத்துதல் / தூண்டுதல்
  rationale: சூழலில் அவர்கள் இயேசுவை வலையில் சிக்கவைக்க முயல்கிறார்கள். ‘சோதிக்கிறீர்கள்’ என்பது அந்த எதிர்மறை நோக்கைத் தாங்கியபடியே, பாவம் செய்யத் தூண்டுதல் என்ற குறுகிய இறையியல் பொருளைத் தேவையின்றி புகுத்தாமல் கிரேக்கத்தின் பொருள் விரிவைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெளிவேடம்’ பொதுவாசகருக்குப் புரியக்கூடியதாகவும் ὑπόκρισις என்பதன் வலிமையைத் தக்கவைக்கக்கூடியதாகவும் உள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
