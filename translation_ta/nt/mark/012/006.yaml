  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புக்குரிய மகன்’ மற்றும் ‘கடைசியாக’ ஆகியவை மூலத்தின் இலக்கிய மற்றும் இறையியல் வலுவை விளக்கச் சேர்க்கையின்றித் தக்கவைக்கின்றன.
