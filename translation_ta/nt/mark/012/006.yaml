source:
  edition: SBLGNT
  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: ta
  text: அவரிடம் இன்னும் ஒருவர் இருந்தார்—அவருடைய அன்புக்குரிய மகன்.[a] ‘என் மகனை மதிப்பார்கள்’[b] என்று சொல்லி, கடைசியாக அவரை அவர்களிடம் அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரிடம் இன்னும் ஒரே ஒருவர் இருந்தார்—அவர் மிகவும் நேசித்த மகன்.’
    reason: ἔτι ἕνα மற்றும் ἀγαπητόν ஆகியவை முறையே மீதமிருந்த ஒருவரையும் மிகவும் நேசிக்கப்பட்ட மகனையும் வலியுறுத்தலாம்.
  - marker: b
    text: இந்த வினைச்சொல் ‘அவருக்கு முன்பாக வெட்கப்படுவார்கள்’ அல்லது ‘அவருக்கு மரியாதை காட்டுவார்கள்’ என்றும் பொருள்படலாம்; இச்சூழலில் ‘மதிப்பார்கள்’ என்பது பொருத்தமானது.
    reason: ἐντρέπω என்ற சொல்லின் வெட்கம், மரியாதை, மதிப்பு ஆகியவற்றை உள்ளடக்கிய பொருள் வரம்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: அவரிடம் இன்னும் ஒருவர் இருந்தார்
  rationale: முன்பு அனுப்பப்பட்ட வேலைக்காரர்களுக்குப் பின் அனுப்புவதற்கு இன்னும் ஒருவர் இருந்தார் என்ற தொடர்ச்சியையும், ἕνα என்பதன் ‘ஒருவர்’ என்ற எண்ணையும் இயல்பான தமிழில் தருகிறது.
- source_word: υἱὸν ἀγαπητόν
  choice: அவருடைய அன்புக்குரிய மகன்
  rationale: ἀγαπητός என்பதன் ‘அன்புக்குரியவர்’ என்ற வலுவைத் தக்கவைத்து, மாற்குவில் காணப்படும் அன்புக்குரிய மகன் குறித்த எதிரொலியை விளக்கமாக விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: ἀποστέλλω என்பதற்கான நேரடியான, இயல்பான கதைநடைச் சொல்.
- source_word: ἔσχατον
  choice: கடைசியாக
  rationale: இங்கு வினையடைபோல் வரும் சொல்லின் ‘இறுதியாக/கடைசியாக’ என்ற பொருளை வெளிப்படுத்தி, அனுப்பப்பட்டவர்களின் வரிசையில் மகனுடைய உச்சநிலையைத் தக்கவைக்கிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: ஒருவரை அனுப்பும் சூழலில் இயல்பான தமிழ்ப் பயன்பாடு.
- source_word: λέγων ὅτι
  choice: என்று சொல்லி
  rationale: நில உரிமையாளரின் எதிர்பார்ப்பை நேர்கூற்றாக இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: Ἐντραπήσονται
  choice: மதிப்பார்கள்
  rationale: ἐντρέπω என்பதன் இச்சூழலுக்குரிய ‘மதிப்பு அல்லது மரியாதை காட்டுதல்’ என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; அதிலுள்ள வெட்கம்/மரியாதை சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὸν υἱόν μου
  choice: என் மகனை
  rationale: உடைமைத் தொடர்பை நேரடியாகத் தந்து, உவமையின் கிறிஸ்துவியல் வலுவை மிகைப்படுத்தாமலும் குறைக்காமலும் காக்கிறது.
theological_decisions:
- issue: உவமையில் ‘அன்புக்குரிய மகன்’ என்ற சொற்றொடரின் கிறிஸ்துவியல் எதிரொலி
  choice: முதன்மை உரையில் ‘அவருடைய அன்புக்குரிய மகன்’ என்று மட்டும் வைத்து, அதன் பொருளை விளக்கமாக விரிவுபடுத்தவில்லை.
  alternative: அவருடைய மிகவும் நேசிக்கப்பட்ட மகன்
  rationale: இச்சொற்றொடர் மாற்கு நற்செய்தியில் இயேசு அன்புக்குரிய மகனாகச் சித்தரிக்கப்படுவதை இயல்பாக எதிரொலிக்கிறது. அந்த எதிரொலியை உரை தானே சுமக்கும்படி விடுவது, ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்துவதைத் தவிர்க்கிறது.
