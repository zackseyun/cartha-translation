source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: ta
  text: உயிர்த்தெழுதலின்போது, அவர்கள் உயிர்த்தெழும்போது[a], அவள் அவர்களில் யாருக்கு மனைவியாக இருப்பாள்? ஏனெனில், அந்த ஏழு பேரும் அவளை மனைவியாகக் கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் எழும்போது.’ கிரேக்கத்தில் சொற்படியாக ‘அவர்கள் எழும்போது’ என்றே உள்ளது; உயிர்த்தெழுதல் பற்றிய சூழல் அதன் பொருளைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: உயிர்த்தெழுதல்
  rationale: சதுசேயர்களுடன் நடைபெறும் விவாதத்தின் சூழலில், இது இறுதிக்கால உயிர்த்தெழுதலைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் வழக்கமாகவும் உள்ள இணைச்சொல் இதுவே.
- source_word: ὅταν ἀναστῶσιν
  choice: அவர்கள் உயிர்த்தெழும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை எதிர்கால நேரத்தைக் குறிக்கிறது. கிரேக்கத்தில் ‘மீண்டும்’ என்பதற்கான தனிச்சொல் இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை; உயிர்த்தெழுதல் என்ற சூழல் பொருளைத் தெளிவாக்குகிறது.
- source_word: τίνος αὐτῶν
  choice: அவர்களில் யாருக்கு
  rationale: வினாப்பெயரின் உடைமைப் பொருளையும் பகுதிப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔσται γυνή
  choice: மனைவியாக இருப்பாள்
  rationale: இது திருமண உறவு நிலையில் அவள் யாருடைய மனைவியாக இருப்பாள் என்று கேட்கிறது; தமிழில் இயல்பான பயனிலை அமைப்பு இதுவாகும்.
- source_word: γυνή
  choice: மனைவி
  rationale: இரு இடங்களிலும் திருமணச் சூழல் இருப்பதால் பொதுவான ‘பெண்’ என்பதற்குப் பதிலாக ‘மனைவி’ துல்லியமானது.
- source_word: οἱ γὰρ ἑπτὰ
  choice: ஏனெனில், அந்த ஏழு பேரும்
  rationale: γάρ கேள்விக்கான காரணத்தை அறிமுகப்படுத்துகிறது. முன்சூழலில் குறிப்பிடப்பட்ட ஏழு சகோதரர்களை ‘அந்த ஏழு பேரும்’ இயல்பாகச் சுட்டுகிறது; ‘பேரும்’ அனைவரையும் உள்ளடக்கும் வலியுறுத்தலை தமிழில் தெளிவாக்குகிறது.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: அவளை மனைவியாகக் கொண்டிருந்தார்கள்
  rationale: ἔχω + இரண்டாம் வேற்றுமை + γυναῖκα என்பது திருமண உறவின் நிலையைச் சொல்கிறது. ‘மணந்தார்கள்’ என்பது நிகழ்வை முன்னிறுத்தும்; ‘மனைவியாகக் கொண்டிருந்தார்கள்’ மூலத்தின் உறவுநிலையை நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: சதுசேயர்களுடனான விவாதத்தில் உயிர்த்தெழுதல் மொழி
  choice: உயிர்த்தெழுதலின்போது ... அவர்கள் உயிர்த்தெழும்போது
  alternative: இறந்தோரின் உயிர்த்தெழுதலின்போது ... அவர்கள் மீண்டும் எழும்போது
  rationale: இவ்வசனம் எதிர்கால உயிர்த்தெழுதலை முன்வைக்கிறது; ஆனால் ‘இறந்தோரின்’ அல்லது ‘மீண்டும்’ என்ற சொற்கள் இங்கு வெளிப்படையாக இல்லை. ஆகவே சூழல் தரும் இறையியல் பொருளைக் காத்தபடியே மூலத்தில் இல்லாத விரிவாக்கங்களை முதன்மை உரையில் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘உயிர்த்தெழுதல்’ என்ற நிலையான வேதாகமச் சொல்லும், ‘மனைவியாகக் கொண்டிருந்தார்கள்’ என்ற மூலத்துக்கு நெருக்கமான உறவுநிலைச் சொற்றொடரும் பயன்படுத்தப்பட்டுள்ளன.
