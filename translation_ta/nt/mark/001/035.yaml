  source_fidelity: மூலக் கிரேக்கத்தின் கால வலியுறுத்தல் (πρωῒ ἔννυχα λίαν), தொடர்ந்து வரும் இரு நகர்வு வினைகள் (ἐξῆλθεν, ἀπῆλθεν), இடத்தின் வெறிச்சோடிய/மக்கள் நடமாட்டமற்ற தன்மை (ἔρημον τόπον), மற்றும் imperfect வினையின் தொடர்ச்சித் தன்மை (προσηύχετο) ஆகியவை துல்லியமாகப் பேணப்பட்டுள்ளன. “அதிகாலையிலேயே, இன்னும் இருட்டாக இருந்தபோது” என்பது ‘மிக அதிகாலையில், இருள் இன்னும் நீங்காதபோது’ என்ற பொருளை இயல்பாகத் தருகிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “எழுந்து வெளியே சென்று ... போனார்” என்பது மீளுரைப்பாகத் தெரியாமல் இரு கட்ட நகர்வையும் வாசகருக்குத் தெளிவாக்குகிறது. “ஜெபித்துக்கொண்டிருந்தார்” இயல்பானது; தொடர்ச்சியான செயலை நன்றாகக் காட்டுகிறது.
  terminology: “ஆளரவமற்ற ஓர் இடம்” என்பது இச்சூழலில் ἔρημος என்பதன் மக்கள் நடமாட்டமற்ற/வெறிச்சோடிய இடம் என்ற பரந்த பொருளைச் சரியாகக் கொண்டுவருகிறது. அடிக்குறிப்பில் “வெறிச்சோடிய,” “தனிமையான,” “வனாந்தரத் தன்மையுள்ள” என்ற மாற்றுகள் வழங்கப்பட்டிருப்பதால் தேவையற்ற புவியியல் அல்லது விளக்கக் கட்டுப்பாடு ஏற்படவில்லை. “ஜெபித்துக்கொண்டிருந்தார்” பொருத்தமான பொதுவான கிறிஸ்தவத் தமிழ்ச் சொல்வழக்கு.
