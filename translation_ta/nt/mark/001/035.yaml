source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: ta
  text: அதிகாலையிலேயே, இன்னும் இருட்டாக இருந்தபோது, அவர் எழுந்து வெளியே சென்று, ஆளரவமற்ற ஓர் இடத்திற்குப் போனார்[a]. அங்கே அவர் ஜெபித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெறிச்சோடிய ஓர் இடத்திற்கு,” “தனிமையான ஓர் இடத்திற்கு” அல்லது “வனாந்தரப் பகுதியிலுள்ள ஓர் இடத்திற்கு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மக்கள் குடியிராத, ஆளரவமற்ற அல்லது வனாந்தரத் தன்மையுள்ள இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: அதிகாலையிலேயே, இன்னும் இருட்டாக இருந்தபோது
  rationale: மூன்று சொற்களும் சேர்ந்து மிக அதிகாலை நேரத்தையும் அப்போது இருள் நீங்காதிருந்ததையும் வலியுறுத்துகின்றன. தமிழில் இயல்பாகவும் முழுப் பொருளுடனும் அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἀναστὰς
  choice: அவர் எழுந்து
  rationale: முதன்மை வினைகளுக்கு முன் நிகழ்ந்த உடன்செயலை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்று
  rationale: அவர் இருந்த இடத்திலிருந்து வெளியேறிய முதற்கட்ட நகர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπῆλθεν
  choice: போனார்
  rationale: ἐξῆλθεν என்பதிலிருந்து வேறுபட்ட, அங்கிருந்து மற்றோர் இடத்தை நோக்கிச் சென்ற நகர்வைத் தனியாகப் பேணுகிறது.
- source_word: εἰς ἔρημον τόπον
  choice: ஆளரவமற்ற ஓர் இடத்திற்கு
  rationale: ἔρημος என்பது குடியிருப்போ மக்கள் நடமாட்டமோ இல்லாத, வெறிச்சோடிய அல்லது வனாந்தரத் தன்மையுள்ள இடத்தைக் குறிக்கலாம். குறிப்பிட்ட புவியியல் வனாந்தரத்தைத் தவறாகக் குறிப்பதின்றி இடத்தின் தன்மையை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: κἀκεῖ
  choice: அங்கே
  rationale: καὶ ἐκεῖ என்பதன் சுருக்கமான வடிவத்திலுள்ள இடச் சுட்டுதலை இயல்பான தமிழில் தருகிறது; வாக்கியப் பிரிப்பே தொடர்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: προσηύχετο
  choice: ஜெபித்துக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் imperfect வினையின் நீடித்த அம்சத்தைப் பேணுகிறது.
theological_decisions:
- issue: இயேசுவின் ஜெபத்தைப் பற்றிய கதை வலியுறுத்தல்
  choice: அவர் தனியான இடத்திற்குச் சென்று தொடர்ந்து ஜெபித்தார் என்ற நிகழ்வை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: இதனைச் சீடத்துவத்தின் முன்மாதிரியாகவோ, இயேசுவின் சார்புநிலையைப் பற்றிய கிறிஸ்துவியல் விளக்கமாகவோ மொழிபெயர்ப்பிலேயே வலியுறுத்துதல்
  rationale: கிரேக்க வசனம் நிகழ்வை மட்டுமே விவரிக்கிறது; அதிலிருந்து பெறக்கூடிய இறையியல் முடிவுகளை மொழிபெயர்ப்பு சொற்களுக்குள் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. ‘எழுந்து வெளியே சென்று ... போனார்’ என்பது மாற்கு பேணும் இரு நகர்வு வினைகளையும் வேறுபடுத்துகிறது. ‘ஜெபித்துக்கொண்டிருந்தார்’ என்பது சபைச் சூழலிலும் பொதுத் தமிழிலும் புரியக்கூடியதுடன் கிரேக்க imperfect வினையின் தொடர்ச்சியையும் காட்டுகிறது.
