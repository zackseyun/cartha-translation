id: MRK.1.11
reference: Mark 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: ta
  text: 'அப்போது வானங்களிலிருந்து[a] ஒரு குரல் ஒலித்தது: “நீ என் அன்புக்குரிய மகன்; உன்னில் நான் மனமகிழ்ந்தேன்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் “வானங்கள்” என்பது பன்மையில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “உன்னிடத்தில் நான் மகிழ்ச்சியடைந்தேன்” அல்லது “உன்னில் நான் மனமகிழ்ந்திருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: ஒரு குரல் ஒலித்தது
  rationale: ἐγένετο என்பதன் நிகழ்வு சார்ந்த கருத்தை, நவீனத் தமிழில் இயல்பாகவும் குரல் கேட்கப்பட்டதைத் தெளிவாகவும் தெரிவிக்கிறது; சொற்சொல்லாக ‘ஒரு குரல் உண்டாயிற்று’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: ἐκ τῶν οὐρανῶν
  choice: வானங்களிலிருந்து
  rationale: கிரேக்க மூலத்தின் பன்மையைத் தக்கவைக்கிறது. வழக்கமான ஒருமை வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Σὺ εἶ
  choice: நீ
  rationale: தமிழ் வாக்கியத்தில் வெளிப்படையான ‘நீ’ நேரடியான அழைப்பையும் மூலத்திலுள்ள வலியுறுத்தலையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: என் அன்புக்குரிய மகன்
  rationale: மகன் என்ற உறவையும் ἀγαπητός தெரிவிக்கும் தனிப்பட்ட அன்பையும் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν σοὶ
  choice: உன்னில்
  rationale: ἐν என்பதன் நேரடியான இடவியல் வடிவத்தைத் தக்கவைத்து, பொருளைத் தேவையின்றி ‘உன்னைக் குறித்து’ அல்லது ‘உன்னிடத்தில்’ என்று தீர்மானிக்காமல் விடுகிறது.
- source_word: εὐδόκησα
  choice: நான் மனமகிழ்ந்தேன்
  rationale: அஓரிஸ்ட் வினையின் இறந்தகால வடிவத்தைத் தக்கவைத்தபடியே, தெய்வீக மகிழ்ச்சியையும் அங்கீகாரத்தையும் இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவிடம் கூறப்படும் தெய்வீக அறிவிப்பின் கிறிஸ்துவியல் வலிமையைத் தக்கவைத்தல்
  choice: என் அன்புக்குரிய மகன்
  alternative: என் மகன், அன்புக்குரியவர்
  rationale: மகன் என்ற அடையாளத்தையும் தெய்வீக அன்பையும் பாதுகாக்கிறது; வசனத்தில் இல்லாத பிற்கால கோட்பாட்டுச் சொற்களைச் சேர்ப்பதில்லை.
- issue: οὐρανῶν என்ற பன்மையை ஒருமையாகச் சீராக்க வேண்டுமா
  choice: வானங்களிலிருந்து
  alternative: வானத்திலிருந்து
  rationale: மூலமொழியிலுள்ள பன்மை தமிழிலும் புரிந்துகொள்ளத்தக்கதால் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது; பழக்கமான ஒருமை அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: ἐν σοὶ εὐδόκησα என்பதின் தொடர்பும் காலநிலையும்
  choice: உன்னில் நான் மனமகிழ்ந்தேன்
  alternative: உன்னிடத்தில் நான் மகிழ்ச்சியடைந்தேன்; உன்னில் நான் மனமகிழ்ந்திருக்கிறேன்
  rationale: ἐν என்பதையும் அஓரிஸ்ட் வடிவத்தையும் வெளிப்படையாகத் தக்கவைத்து, அது வெறும் தற்போதைய அங்கீகாரம் மட்டுமே என்று மொழிபெயர்ப்பில் முன்கூட்டியே முடிவுசெய்யாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானங்களிலிருந்து’ மற்றும் ‘உன்னில்’ ஆகிய சற்றே அசாதாரணமான வடிவங்கள் மூலத்தின் உண்மையான வடிவத்தையும் தெளிவின்மையையும் பாதுகாக்கத் திட்டமிட்டு வைக்கப்பட்டுள்ளன.
