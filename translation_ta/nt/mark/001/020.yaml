source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: ta
  text: உடனே அவர் அவர்களை அழைத்தார். அவர்கள் தங்கள் தந்தை செபெதேயுவைக் கூலிக்கு வேலை செய்பவர்களோடு படகில் விட்டுவிட்டு, அவருக்குப் பின்னால் சென்றார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பின்பற்றிச் சென்றார்கள்.” கிரேக்கச் சொற்றொடர் உடல்ரீதியாக ஒருவருக்குப் பின்னால் செல்வதையும், அவருடைய சீடராகப் பின்பற்றத் தொடங்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரையில் காணப்படும் உடனடித் தன்மையையும் வேகத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκάλεσεν
  choice: அழைத்தார்
  rationale: இங்கு καλέω என்பதன் நேரடியான பொருளைத் தருகிறது; ‘கட்டளையிட்டு வரவழைத்தார்’ அல்லது ‘அழைப்பு விடுத்தார்’ என்று தேவையற்ற விதத்தில் வலிமையையோ மென்மையையோ கூட்டவில்லை.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: முதன்மை வினைக்கு முன் நடந்த துணைச் செயலை இயல்பான தமிழில் காட்டுகிறது; ‘கைவிட்டு’ என்பதில் வரக்கூடிய கடுமையான பொருளைத் தவிர்க்கிறது.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: தங்கள் தந்தை செபெதேயுவை
  rationale: உறவையும் பெயரையும் தெளிவாகவும் இயல்பாகவும் தருகிறது; மூலத்தில் இல்லாத கூடுதல் அழுத்தம் சேர்க்கப்படவில்லை.
- source_word: πλοίῳ
  choice: படகில்
  rationale: கலிலேய மீன்பிடிச் சூழலுக்கு இயல்பான சொல்; பெரிய கப்பலைக் குறிக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: μισθωτῶν
  choice: கூலியாட்களோடு
  rationale: ஊதியத்திற்காக வேலை செய்பவர்களைக் குறிக்கும் μισθωτός என்பதன் பொருளைச் சுருக்கமாகவும் பொதுமக்களுக்கு எளிதாகவும் தருகிறது.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: அவருக்குப் பின்னால் சென்றார்கள்
  rationale: அவர்கள் இருந்த இடத்தைவிட்டு இயேசுவுக்குப் பின்னால் சென்ற உடல் இயக்கத்தையும், அவரைப் பின்பற்றத் தொடங்கிய சீடத்துவ நுட்பத்தையும் வெளிப்படையாக ஒன்றாக மட்டும் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: ὀπίσω αὐτοῦ என்பதில் உள்ள சீடத்துவ நுட்பம்
  choice: அவருக்குப் பின்னால் சென்றார்கள்
  alternative: அவரைப் பின்பற்றிச் சென்றார்கள்
  rationale: மூலச் சொற்றொடர் உடல்ரீதியாக ஒருவருக்குப் பின்னால் செல்வதையும் அவருடைய சீடராகப் பின்பற்றத் தொடங்குவதையும் குறிக்கக்கூடும். தேர்ந்தெடுத்த மொழிபெயர்ப்பு இரண்டு நுட்பங்களையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கியப் பிரிப்பு கிரேக்க உரையின் இரு முதன்மை வாக்கியங்களையும் தெளிவாகப் பிரதிபலிக்கிறது.
