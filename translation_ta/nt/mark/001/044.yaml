  naturalness: ‘ஆசாரியனிடம் உன்னைக் காட்டு’ மற்றும் ‘உன் சுத்திகரிப்புக்காக மோசே கட்டளையிட்டவற்றைக் காணிக்கையாகச் செலுத்து’ ஆகியவை நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையான வேதாகம நடையிலும் உள்ளன. ‘பார்த்துக்கொள்’ எச்சரிக்கைக் கட்டளைக்கு பொருத்தமானது.
  terminology: சடங்குசார் யூத வழிபாட்டு அதிகாரிக்காக ‘ஆசாரியன்’ பயன்படுத்தப்பட்டுள்ளது. καθαρισμός என்பதற்கு, உடல் நலமடைதலை மட்டும் குறைக்காமல் சடங்குசார் பின்னணியையும் காக்கும் வகையில் ‘சுத்திகரிப்பு’ பயன்படுத்தப்பட்டுள்ளது. μαρτύριον என்பதற்கு ‘சாட்சி’ என மொழிபெயர்க்கப்பட்டு, அது சாதகமான சான்றா எதிரான சாட்சியா என்பதைக் குறிப்பாகத் தீர்மானிக்கவில்லை.
