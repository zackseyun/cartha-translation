source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ta
  text: அவர் அவனிடம், “பார்த்துக்கொள்; யாரிடமும் எதையும் சொல்லாதே. மாறாக, நீ போய் ஆசாரியனிடம் உன்னைக் காட்டு. உன் சுத்திகரிப்புக்காக மோசே கட்டளையிட்டவற்றைக் காணிக்கையாகச் செலுத்து; அவர்களுக்குச் சாட்சியாக” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுக்குச் சாட்சியாக’ என்பது ஆசாரியர்களுக்கோ மற்றவர்களுக்கோ முன்வைக்கப்படும் சான்றைக் குறிக்கலாம்; சிலர் இதை இன்னும் கடுமையான பொருளில், ‘அவர்களுக்கு எதிரான சாட்சியாக’ என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: பார்த்துக்கொள்
  rationale: எச்சரிக்கையோடும் வலியுறுத்தலோடும் அடுத்து வரும் தடையை அறிமுகப்படுத்தும் கட்டளையின் வலிமையை, இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: யாரிடமும் எதையும் சொல்லாதே
  rationale: பெறுபவரையும் சொல்லப்படும் பொருளையும் முற்றிலும் விலக்கும் கிரேக்க இரட்டை எதிர்மறை அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: செய்யக்கூடாததிலிருந்து செய்யவேண்டியதற்குத் திருப்பும் எதிர்மறை மாறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὕπαγε
  choice: நீ போய்
  rationale: நேரடியான நகர்வு கட்டளையை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: குருவிடம் உன்னைக் காட்டு
  rationale: சுயசுட்டுப் பெயரையும், தோரா விதித்த குருவின் பரிசோதனைக்காகத் தன்னை முன்வைப்பதையும் மூலத்திற்கு நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: ἱερεῖ
  choice: குருவிடம்
  rationale: இங்கு வழிபாட்டு மற்றும் தோரா சார்ந்த அதிகாரம் கொண்ட ஆசாரியனைக் குறிக்கிறது; தமிழ் வேதாகமப் பயன்பாட்டில் ‘குரு’ தெளிவானதும் சுருக்கமானதும் ஆகும்.
- source_word: προσένεγκε
  choice: காணிக்கையாகச் செலுத்து
  rationale: பொதுவாகக் கொண்டுவருதல் என்பதைக் காட்டிலும், இங்குள்ள பலி/வழிபாட்டு சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: உன் தூய்மைப்படுத்தலுக்காக
  rationale: சடங்குசார் தூய்மையையும் அதற்கான காணிக்கையின் தொடர்பையும் வெளிப்படுத்துகிறது; வெறும் உடல் குணமடைதலாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: மோசே கட்டளையிட்டவற்றை
  rationale: கிரேக்கப் பன்மை உறவுப்பெயரின் கூட்டுப் பொருளைப் பாதுகாத்து, மோசேயின் விதிமுறைகளைக் குறிக்கிறது.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: அது அவர்களுக்குச் சாட்சியாக இருக்கும்
  rationale: εἰς என்பதன் நோக்கம்/விளைவு நுணுக்கத்தையும் μαρτύριον என்பதன் சான்று அல்லது சாட்சி பொருளையும் காக்கிறது; ‘அவர்களுக்கு எதிராக’ என்று தேவையின்றி தீவிரப்படுத்தவில்லை.
theological_decisions:
- issue: ‘அவர்களுக்குச் சாட்சியாக’ என்பதில் ‘அவர்கள்’ யார், சாட்சியின் தன்மை என்ன?
  choice: குருக்கள் அல்லது பிற பார்வையாளர்கள் உட்பட தொடர்புடையவர்களுக்கான சாட்சி என்ற பரந்த பொருள் தக்கவைக்கப்பட்டது.
  alternative: குருக்களுக்கான சான்று; அல்லது அவர்களுக்கு எதிரான சாட்சி
  rationale: கிரேக்க உரை ‘எதிராக’ என்று வெளிப்படையாகச் சொல்லவில்லை; குறிப்பிட்ட பெறுபவர்களையும் சாட்சியின் சாதக/எதிர்மறை தன்மையையும் தீர்மானிக்காமல் அதன் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளைகளின் நேரடித் தன்மை காக்கப்பட்டுள்ளது; சடங்குசார் சூழலை உணர்த்த ‘தூய்மைப்படுத்தல்’, ‘காணிக்கையாகச் செலுத்து’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
