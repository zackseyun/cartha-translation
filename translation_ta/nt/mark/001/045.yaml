revisions:
- from: ஆனால் அவர் அங்கிருந்து புறப்பட்டுச் சென்றபின், நடந்ததைப் பலருக்கும் அறிவிக்கவும் அந்தச் செய்தியை எங்கும் பரப்பவும் தொடங்கினார். அதனால் இயேசுவால் எந்த ஊருக்குள்ளும் வெளிப்படையாக நுழைய முடியவில்லை. மாறாக, அவர் வெளியே மக்கள் நடமாட்டமில்லாத இடங்களில் தங்கியிருந்தார். இருந்தாலும், எல்லாத் திசைகளிலிருந்தும் மக்கள் அவரிடம் வந்துகொண்டிருந்தார்கள்.
  to: ஆனால், வெளியே சென்ற அந்த மனிதர் பரவலாக அறிவிக்கவும் அந்தச் செய்தியை எங்கும் பரப்பவும் தொடங்கினார். அதனால், இயேசு இனி வெளிப்படையாக எந்த ஊருக்குள்ளும் நுழைய முடியவில்லை; மாறாக, வெளியே தனிமையான இடங்களில் இருந்தார். எல்லாத் திசைகளிலிருந்தும் மக்கள் அவரிடம் வந்துகொண்டிருந்தார்கள்.
  rationale: The revision removes the unsupported restriction that he announced only the event itself, renders κηρύσσειν πολλὰ as extensive proclamation, and identifies the healed man at the transition so that the subsequent reference to Jesus is unambiguous. It retains the source’s causal relation, contrast, and ongoing sense of people coming from all directions.
  reviewer_model: gpt-5.6-terra
