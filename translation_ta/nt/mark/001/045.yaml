id: MRK.1.45
reference: Mark 1:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: ta
  text: ஆனால், வெளியே சென்ற அந்த மனிதர் பரவலாக அறிவிக்கவும் அந்தச் செய்தியை எங்கும் பரப்பவும் தொடங்கினார். அதனால், இயேசு இனி வெளிப்படையாக எந்த ஊருக்குள்ளும் நுழைய முடியவில்லை; மாறாக, வெளியே தனிமையான இடங்களில் இருந்தார். எல்லாத் திசைகளிலிருந்தும் மக்கள் அவரிடம் வந்துகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: நடந்ததைப் பலருக்கும் அறிவிக்க
  rationale: κηρύσσειν என்பது வெளிப்படையாக அறிவித்தலைக் குறிக்கிறது; πολλὰ என்ற வினையடைப் பயன்பாடு அவர் மிகுதியாக அல்லது பரவலாக அறிவித்தார் என்ற பொருளைத் தருகிறது. தமிழில் இயல்பாகவும் முந்தைய நிகழ்வுடன் தொடர்பாகவும் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: διαφημίζειν τὸν λόγον
  choice: அந்தச் செய்தியை எங்கும் பரப்ப
  rationale: διαφημίζω என்பது செய்தியைப் பரவலாக அறியச்செய்தல்; τὸν λόγον இங்கு அவர் குணமடைந்த நிகழ்வு குறித்த செய்தி.
- source_word: φανερῶς
  choice: வெளிப்படையாக
  rationale: மறைவின்றி, பொதுவாக நுழைவதைக் குறிக்கும் மூலச்சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: மக்கள் நடமாட்டமில்லாத இடங்களில்
  rationale: ἐρήμοις என்பது அவசியமாக மணற்பாலை அல்ல; குடியிருப்புக்கு வெளியேயுள்ள தனிமையான அல்லது மக்கள் நடமாட்டமில்லாத இடங்களைக் குறிக்கிறது.
- source_word: ἤρχοντο ... πάντοθεν
  choice: எல்லாத் திசைகளிலிருந்தும் மக்கள் ... வந்துகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் மீண்டும் மீண்டும் அல்லது தொடர்ந்து மக்கள் வந்ததை வெளிப்படுத்துகிறது; πάντοθεν என்பது எல்லாப் பக்கங்களிலிருந்தும் என்பதாகும்.
theological_decisions:
- issue: αὐτόν என்பதன் சுட்டுப்பொருள்
  choice: இயேசு
  alternative: அவர்
  rationale: இலக்கண ரீதியில் சுட்டுப்பெயர் வந்தாலும், குணமடைந்த மனிதனின் செயலிலிருந்து இயேசுவுக்கான விளைவுக்கு வாக்கியம் மாறுவதால் தமிழில் குழப்பம் தவிர்க்கப் பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டது.
- issue: ὁ δὲ ἐξελθών என்பதன் செய்பவர்
  choice: அவர் அங்கிருந்து புறப்பட்டுச் சென்றபின்
  alternative: அந்த மனிதர் வெளியே சென்றபின்
  rationale: அருகிலுள்ள சூழலில் இது குணமடைந்த மனிதனைச் சுட்டுகிறது. வசனம் தனியாகவும் புரிய, செயல் இயல்பாகத் தரப்பட்டுள்ளது; ஆனால் பெயர்ச்சுட்டு விளக்கத்தை அளவுக்கு மீறிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் காரணவிளைவு அமைப்பும், இயேசு வெளியிடங்களில் தங்கியிருந்தபோதும் மக்கள் தொடர்ந்து வந்தனர் என்ற முரண்நயமும் பாதுகாக்கப்பட்டுள்ளன.
