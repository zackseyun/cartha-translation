  source_fidelity: ‘உடனே அவர்கள் வலைகளை விட்டுவிட்டு அவரைப் பின்பற்றினார்கள்’ என்பது καὶ εὐθὺς ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ என்ற மூலத்தின் செயல்வரிசையையும் பொருளையும் துல்லியமாகக் கொண்டுவருகிறது. ‘விட்டுவிட்டு’ முன்னதாக நிகழ்ந்த பங்கேற்புச் செயலை இயல்பாக வெளிப்படுத்துகிறது; ‘அவரைப் பின்பற்றினார்கள்’ ἠκολούθησαν αὐτῷ என்பதன் இயக்க மற்றும் சீடத்துவ நுண்பொருளைத் தேவையற்ற விரிவாக்கமின்றிக் காக்கிறது.
  naturalness: நவீன பொதுத்தமிழில் சுருக்கமாகவும் இயல்பான கதைநடையிலும் உள்ளது. வசனத் தொடக்கத்தில் καὶ-ஐத் தனிச் சொல்லாக மொழிபெயர்க்காமல் விடுவது தமிழில் இயல்பானது; ‘உடனே’ கதைத் தொடர்ச்சியையும் அவசரத்தையும் போதுமான அளவு தெரிவிக்கிறது.
  terminology: ‘வலைகளை,’ ‘விட்டுவிட்டு,’ மற்றும் ‘அவரைப் பின்பற்றினார்கள்’ ஆகியவை தெளிவான, கண்ணியமான, சூழலுக்கேற்ற சொற்கள். ‘பின்பற்றினார்கள்’ என்பதை ‘சீடர்களானார்கள்’ என விரிவுபடுத்தாதது மூலத்தின் திறந்த நுண்பொருளை பாதுகாக்கிறது. அடிக்குறிப்பில் ‘அப்போதே’ என்பது εὐθὺς-க்கு பொருத்தமான இயல்பான மாற்றாகும்.
