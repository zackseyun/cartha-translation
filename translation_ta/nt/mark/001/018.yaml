id: MRK.1.18
reference: Mark 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: ta
  text: உடனே[a] அவர்கள் வலைகளை விட்டுவிட்டு அவரைப் பின்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போதே.”
    reason: εὐθὺς என்பதற்கான இயல்பான மற்றொரு தமிழாக்கம்; அதே உடனடித் தன்மையைச் சற்றே வேறுபட்ட நடையில் தெரிவிக்கிறது.
lexical_decisions:
- source_word: καὶ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு καὶ கதைத் தொடரை இணைக்கும் பொதுவான இணைப்புச்சொல். தமிழில் வசனத் தொடக்கத்தில் அதைத் தனியே ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது இயல்பற்றதாகவோ கூடுதல் நுண்பொருளைத் தருவதாகவோ இருக்கும்; ‘உடனே’ என்பதுடன் நேரடியாகத் தொடங்குவது இயல்பான கதைநடையைப் பேணுகிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது; மாற்கு நூலின் விரைவான கதைநடையையும் காக்கிறது.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘கைவிட்டு’ என்பது தேவையற்ற உணர்ச்சி அல்லது நிரந்தரத் தன்மையை வலுப்படுத்தக்கூடும்.
- source_word: τὰ δίκτυα
  choice: வலைகளை
  rationale: கிரேக்கத்தில் உள்ள திட்டவட்டச் சுட்டை தமிழில் தனியே வெளிப்படுத்த வேண்டியதில்லை. சூழலில் அவை அவர்களுடைய வலைகள் என்பது தெளிவாயினும், மூலத்தில் இல்லாத ‘தங்கள்’ சேர்க்கப்படவில்லை.
- source_word: ἠκολούθησαν
  choice: பின்பற்றினார்கள்
  rationale: இது அவருக்குப் பின்னால் சென்றதையும் உருவாகும் சீடத்துவப் பொருளையும் ஒருசேர தாங்கக்கூடிய இயல்பான சொல்; ‘சீடர்களானார்கள்’ என்று விளக்கி விரிவாக்கவில்லை.
- source_word: αὐτῷ
  choice: அவரை
  rationale: உடனடி சூழலில் இந்தப் பிரதிப்பெயர் இயேசுவைக் குறிக்கிறது. மூலத்தைப் போலவே பெயருக்குப் பதிலாக மரியாதைப் பிரதிப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἠκολούθησαν என்பதில் உள்ள சீடத்துவ நுண்பொருள்
  choice: ‘அவரைப் பின்பற்றினார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவருடைய சீடர்களானார்கள்’ அல்லது ‘அவருடன் சென்றார்கள்’
  rationale: மூல வினை உடல்ரீதியாகப் பின்னால் செல்வதையும் சீடராகப் பின்பற்றுவதையும் சூழலின் வழியாக உணர்த்துகிறது. அதை வெளிப்படையான இறையியல் விளக்கமாக விரிவாக்காமல், இரு அடுக்குப் பொருளும் நிலைக்கச் செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விட்டுவிட்டு’ என்பது செயல்களின் வரிசையை இயல்பாகக் காட்டுகிறது; ‘பின்பற்றினார்கள்’ என்பது நேரடியான இயக்கத்தையும் சீடத்துவ நுண்பொருளையும் விளக்கமின்றி பேணுகிறது.
