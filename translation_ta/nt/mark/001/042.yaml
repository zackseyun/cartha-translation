  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: ta
  text: உடனே தொழுநோய் அவரைவிட்டு நீங்கியது; அவர் தூய்மையடைந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தூய்மையாக்கப்பட்டார்.” இவ்வினைச்சொல் உடல் குணமடைதலை மட்டுமல்லாமல், சடங்குசார் தீட்டிலிருந்து தூய்மையாக்கப்படுவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரையில் காணப்படும் உடனடித் தன்மையையும் வேகத்தையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: அவரைவிட்டு நீங்கியது
  rationale: நோயை எழுவாயாகக் கொண்ட கிரேக்கத் தொடரின் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἡ λέπρα
  choice: அந்தத் தொழுநோய்
  rationale: வேதாகமப் பயன்பாட்டில் λέπρα என்பது இன்றைய ஹான்சன் நோயைவிடப் பரந்த தோல் நோய்களைக் குறிக்கக்கூடும்; எனினும் மரபாகவும் சுருக்கமாகவும் அறியப்படும் ‘தொழுநோய்’ என்பதைப் பயன்படுத்தி, கிரேக்கச் சுட்டு உருபையும் ‘அந்த’ எனக் காட்டுகிறது.
- source_word: ἐκαθαρίσθη
  choice: அவர் தூய்மையாக்கப்பட்டார்
  rationale: உடல் நலமடைதலோடு சடங்குசார் தீட்டிலிருந்து தூய்மையாக்கப்படுதல் என்ற செயலற்ற வினையின் இரட்டை நுண்பொருளையும் காக்கிறது.
theological_decisions:
- issue: καθαρίζω என்பதில் உடல் குணமடைதலுக்கும் சடங்குசார் தூய்மைக்கும் உள்ள தொடர்பு
  choice: ‘அவர் தூய்மையாக்கப்பட்டார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர் குணமடைந்தார்’ அல்லது ‘அவர் சுத்தமானார்’
  rationale: ‘குணமடைந்தார்’ என்பது சடங்குசார் தூய்மையின் நுண்பொருளை இழக்கிறது; ‘தூய்மையாக்கப்பட்டார்’ என்பது உடல் மீட்பையும் தீட்டிலிருந்து விடுதலையையும் உள்ளடக்கிய மூலத்தின் இறையியல் அழுத்தத்தை, கூடுதல் கோட்பாட்டைச் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘அவரைவிட்டு நீங்கியது’ என்பது நோய் அகன்றதைத் தெளிவாகச் சொல்கிறது; ‘தூய்மையாக்கப்பட்டார்’ என்பது மூலத்தின் செயலற்ற வினையையும் தூய்மை சார்ந்த நுண்பொருளையும் காக்கிறது.
