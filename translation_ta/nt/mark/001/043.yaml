lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: கடுமையாக எச்சரித்த பின்பு
  rationale: இந்த வினையெச்சம் கடும் உணர்ச்சியுடன் கூடிய கண்டிப்பான அறிவுறுத்தல் அல்லது எச்சரிக்கை என்ற பொருளைத் தரக்கூடும். அடுத்த வசனத்தில் வரும் கட்டளையோடு பொருந்துமாறு அதன் தீவிரத்தையும் வழிகாட்டும் வலிமையையும் இயல்பான தமிழில் இது காக்கிறது.
- source_word: αὐτῷ
  choice: அவரை
  rationale: குணமடைந்த மனிதரைக் குறிக்கும் வேற்றுமைப் பொருள்; தமிழ் வினைத்தொடருக்கு இயல்பாகச் செயப்படுபொருளாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εὐθύς
