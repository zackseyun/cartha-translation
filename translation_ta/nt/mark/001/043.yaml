  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவுக்கான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு வலிமையான வினைகளும் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் தெளிவாகக் காக்கப்பட்டுள்ளன.
