  rationale: மாற்குவின் வேகமான கதைநடையையும் உடனடி நிகழ்வையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξέβαλεν
  choice: வெளியே அனுப்பிவிட்டார்
  rationale: ἐκβάλλω என்பது சாதாரணமாக அனுப்புவதைவிட வலிமையான ‘வெளியே தள்ளுதல்/துரத்துதல்’ என்ற நுண்பொருளைக் கொண்டது. இங்கு மனிதரைப் பற்றியதால் ‘வெளியே அனுப்பிவிட்டார்’ என்பது சூழலுக்கு இயல்பாகவும், ‘வெளியே’ மற்றும் ‘-விட்டார்’ மூலம் செயற்பாட்டின் வலிமையை ஓரளவு காக்கும் வகையிலும் உள்ளது; மேலும் வலுவான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: αὐτόν
  choice: அவரை
  rationale: அதே மனிதரைக் குறிக்கும் நேரடிச் செயப்படுபொருள்.
- source_word: καὶ
  choice: பின்பு
  rationale: கிரேக்க இணைப்புச் சொல்லின் கதைத் தொடர்ச்சியை, வினையெச்ச அமைப்புடன் இயல்பான தமிழில் நிகழ்வுகளின் வரிசையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: குணமடைந்த மனிதரிடம் இயேசு காட்டிய தொனி
  choice: இயேசு அவரைக் குறிப்பிடத்தக்க கடுமையுடன் எச்சரித்து வெளியே அனுப்பினார் என்ற வலிமை காக்கப்பட்டுள்ளது; ஆனால் அவர்மீது பகைமையோ பாவமான கோபமோ கொண்டிருந்தார் என்று சேர்க்கப்படவில்லை.
  alternative: வெறும் உறுதியான அறிவுறுத்தல் மட்டுமே; அல்லது அந்த மனிதரையே தனிப்பட்ட முறையில் இயேசு கடிந்துகொண்டார்.
  rationale: ἐμβριμησάμενος, ἐξέβαλεν ஆகிய இரண்டும் வலிமையான சொற்கள். அவற்றின் உணர்ச்சித் தீவிரத்தைத் தணிக்காமலும், அந்தத் தீவிரத்தின் காரணம் அல்லது ஒழுக்கத் தன்மை குறித்து மூலத்தில் இல்லாத தீர்ப்பைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
