source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: ta
  text: அவர் அருகில் சென்று, அவளுடைய கையைப் பிடித்து அவளை எழுப்பினார். காய்ச்சல் அவளைவிட்டு நீங்கியது; அவள் அவர்களுக்குச் சேவை செய்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குச் சேவை செய்யத் தொடங்கினாள்.” கிரேக்க இறந்தகாலத் தொடர்நிலை வினை அவள் சேவை செய்துகொண்டிருந்ததை மட்டும் குறிக்கலாம்; குணமடைந்ததன் உடனடி விளைவாக அவள் சேவை செய்யத் தொடங்கினாள் என்றும் சூழல் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: அருகில் சென்று
  rationale: இறந்தகால வினையெச்சம் இயேசு அவளை எழுப்புவதற்கு முன் அவளருகே சென்றதைச் சுட்டுகிறது; தேவையற்ற விவரங்களைச் சேர்க்காமல் அந்தச் செயல்முறையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἤγειρεν
  choice: அவளை எழுப்பினார்
  rationale: ἐγείρω இங்கு படுக்கையிலிருந்த அவளை எழும்பச் செய்ததைக் குறிக்கிறது. ‘எழுப்பினார்’ என்பது உடல்சார்ந்த பொருளைத் தெளிவாகத் தருவதோடு, மூலச்சொல்லின் விரிந்த ஒலிப்பையும் தேவையின்றி விளக்கிவிடாமல் காக்கிறது.
- source_word: κρατήσας τῆς χειρός
  choice: அவளுடைய கையைப் பிடித்து
  rationale: κρατέω என்பது பிடித்துக்கொள்வதைக் குறிக்கிறது; கை குறித்த கிரேக்க மரபுத்தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: ἀφῆκεν αὐτὴν
  choice: அவளைவிட்டு நீங்கியது
  rationale: காய்ச்சல் அவளிடமிருந்து விலகியதைத் தமிழில் இயல்பாகச் சொல்கிறது; ‘விட்டது’ என்பதைவிட நோய் நீங்கிய சூழலில் இது தெளிவானது.
- source_word: πυρετός
  choice: காய்ச்சல்
  rationale: இச்சூழலில் குறிப்பிட்ட நோய்நிலையை இயல்பான நவீன தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: διηκόνει
  choice: சேவை செய்தாள்
  rationale: διακονέω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவத்தை மிகையாகச் சமயப் பணியாகவோ உணவு பரிமாறுதலாகவோ குறுக்காமல் பொதுவாக வழங்குகிறது. செயல் தொடங்கியதா அல்லது தொடர்ந்து நடந்ததா என்ற நுட்பம் குறிப்பில் வைக்கப்படுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: பன்மைச் சுட்டுப்பெயர் இயேசுவை மட்டும் அல்லாமல் அங்கிருந்த குழுவினரைக் குறிக்கிறது.
theological_decisions:
- issue: ἐγείρω என்பதில் உயிர்த்தெழுதல் மொழியின் சாத்தியமான எதிரொலி
  choice: எழுப்பினார்
  alternative: தூக்கிவிட்டார் / எழுந்திருக்க உதவினார்
  rationale: இங்கு நேரடிச் சூழல் குணமாக்குதலாக இருந்தாலும், ‘எழுப்பினார்’ என்பது மாற்குவின் சொல்லாட்சியைத் தக்கவைக்கிறது; அதேவேளையில் உயிர்த்தெழுதல் குறித்த பொருளை வசனத்தின்மேல் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. ‘பணிவிடை’ போன்ற சமயநடைச் சொல்லையும், ‘பரிமாறினாள்’ போன்ற அளவுக்கு மீறிய குறிப்பாக்கத்தையும் தவிர்த்து, ‘சேவை செய்தாள்’ எனப் பொதுவான பொருள் காக்கப்பட்டது.
