  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: ta
  text: இயேசு அவனைக் கடிந்துகொண்டு, “பேசாதே[a]; இவனைவிட்டு வெளியே வா!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிக நேர்ப்பொருளில், “வாய்க்கட்டு போடப்படு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டு
  rationale: இச்சொல் கூர்மையான கண்டிப்பையும் அதிகாரத்துடன் பேசுவதையும் குறிக்கிறது. ‘கடிந்துகொண்டு’ என்பது இயேசுவின் அதிகாரமிக்க கண்டிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவனை
  rationale: இது முந்தைய சூழலில் பேசும் அசுத்த ஆவியைக் குறிக்கும் ஆண்பால் ஒருமைப் பதிலிப்பெயர். ‘அவனை’ என்பது ஆவியிடம் நேரடியாகப் பேசப்படுவதையும் அதன் தனிப்பட்ட செயற்பாட்டையும் தக்கவைக்கிறது.
- source_word: λέγων
  choice: … என்றார்
  rationale: கிரேக்கப் பங்கேற்புவினை இயேசுவின் கண்டிப்பின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் நேர்கூற்றின் முடிவில் ‘என்றார்’ என அமைப்பது இயல்பானதாகவும் பொருளுக்கு உண்மையானதாகவும் உள்ளது.
- source_word: Φιμώθητι
  choice: பேசாதே
  rationale: இதன் நேர்ப்பொருள் வாய்க்கட்டு போடப்படுவதாக இருந்தாலும், இங்குள்ள வலுவான கட்டளையின் சூழல்பொருள் பேசுவதை உடனே நிறுத்துவதாகும். ‘பேசாதே’ என்பது சுருக்கமாகவும் கடுமையாகவும் இயல்பான தமிழில் அதைக் கூறுகிறது; உருவகமான நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔξελθε
  choice: வெளியே வா
  rationale: பிடித்திருந்த மனிதனுக்குள் இருந்து ஆவி வெளியேற வேண்டும் என்ற கட்டளையை இது குறிக்கிறது. ‘வெளியே வா’ என்பது நேரடியான கட்டளையாக இயல்பாக ஒலிக்கிறது.
- source_word: ἐξ αὐτοῦ
  choice: இவனைவிட்டு
  rationale: ἐξ என்பது உள்ளிருந்து வெளியேறும் இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘இவனைவிட்டு’ என்பது மனிதனிடமிருந்து ஆவி பிரிந்து வெளியேறுவதைத் தெளிவாகக் காட்டுகிறது; ‘இவனை’ என்பது முதலில் குறிப்பிடப்பட்ட ஆவியிலிருந்து அந்த மனிதனை வேறுபடுத்துகிறது.
theological_decisions:
- issue: இயேசு கடிந்துகொண்டதன் குறிப்பு
  choice: இயேசு அசுத்த ஆவியையே நேரடியாகக் கடிந்துகொள்கிறார்; அந்த மனிதனை அல்ல.
  alternative: உடனடி இலக்கணக் குறிப்பாக அந்த மனிதனையே இயேசு கடிந்துகொள்கிறார்.
  rationale: ‘இவனைவிட்டு வெளியே வா’ என்ற கட்டளை, உரையாடப்படுவது மனிதனுக்குள் இருந்த ஆவி என்பதைக் காட்டுகிறது. இதனால் துன்புறும் மனிதனுக்கும் அவனைப் பிடித்திருந்த ஆவிக்கும் இடையிலான கதைசார் வேறுபாடு காக்கப்படுகிறது; கூடுதல் கோட்பாட்டுக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, அதிகாரமிக்க நேர்கூற்று பயன்படுத்தப்பட்டுள்ளது. ‘அவனை’ என்பது அசுத்த ஆவியையும், ‘இவனை’ என்பது துன்புறும் மனிதனையும் குறிக்கும்படி இயல்பான தமிழ்ச் சுட்டுவேறுபாடு பயன்படுத்தப்பட்டுள்ளது.
