translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதும் கண்ணியமானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வரலாற்று நிகழ்காலம் இயல்பான தமிழ் இறந்தகாலமாக மாற்றப்பட்டாலும் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது. ἐδίδασκεν என்பதிலுள்ள பொருள் நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் திறந்தவாறே வைக்கப்பட்டுள்ளது.
