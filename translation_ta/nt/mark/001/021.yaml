source:
  edition: SBLGNT
  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: ta
  text: அவர்கள் கப்பர்நகூமுக்குள் சென்றார்கள்.[a] ஓய்வுநாளில் உடனே அவர் ஜெபக்கூடத்தில் போதித்துக்கொண்டிருந்தார்.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் கப்பர்நகூமுக்குள் செல்கிறார்கள்.” உயிரோட்டமான கதைநடையில் மாற்கு வரலாற்று நிகழ்காலத்தை அடிக்கடி பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “ஓய்வுநாட்களில்”; இது “ஓய்வுநாளில்” என்று பொருள்படும் ஒரு வழக்குச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “போதிக்கத் தொடங்கினார்” அல்லது “போதித்தார்.” கிரேக்க முற்றுப்பெறாத இறந்தகால வினைவடிவம் தொடர்ந்த செயலை அல்லது செயல் தொடங்கியதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: சென்றார்கள்
  rationale: மாற்கு உயிரோட்டமான வர்ணனையில் நிகழ்காலத்தை வரலாற்று நிகழ்காலமாக அடிக்கடி பயன்படுத்துகிறார். இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது; εἰς உடன் வரும் இயக்கம் ‘கப்பர்நகூமுக்குள்’ என்பதில் காக்கப்பட்டுள்ளது.
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: εὐθύς
  choice: உடனே
  rationale: மாற்குவின் வர்ணனையில் காணப்படும் உடனடித் தன்மையையும் வேகத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், இங்கு அது ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொற்றொடராக உள்ளது.
- source_word: ἐδίδασκεν
  choice: போதித்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினைவடிவத்தின் தொடர்ச்சியான செயல் நுணுக்கத்தைத் தெளிவாகக் காக்கிறது; தொடக்கச் செயல் என்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: συναγωγήν
  choice: ஜெபக்கூடத்தில்
  rationale: இச்சூழலில் பொதுவான கூடுகையை அல்ல, உள்ளூர் யூத ஜெபக்கூடத்தைக் குறிக்கிறது; ‘ஜெபக்கூடம்’ என்பது தமிழில் புரிந்துகொள்ளக்கூடிய நிலைபெற்ற சொல்.
