  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: ta
  text: அவரைப் பற்றிய செய்தி[a] உடனே கலிலேயாவின் சுற்றுப்பகுதி முழுவதிலும் எங்கும் பரவியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைப் பற்றிய தகவல்’; அல்லது, ‘அவருடைய புகழ்.’
    reason: lexical_alternative
  - marker: b
    text: 'நேரடியாக: ‘உடனே எங்கும், கலிலேயாவின் சுற்றுப்பகுதி முழுவதற்குள்ளும் சென்றது.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: பரவியது
  rationale: செய்தி ஓரிடத்திலிருந்து பல இடங்களுக்குச் சென்றது என்பதைக் குறிக்கும் கிரேக்க வினைச்சொல்லின் உருவகத்தை, இயல்பான நவீனத் தமிழில் ‘பரவியது’ தெளிவாக வெளிப்படுத்துகிறது. மிக நேரடியான ‘வெளியே சென்றது’ இச்சூழலில் தமிழில் இயல்பாக ஒலிக்காது.
- source_word: ἀκοὴ
  choice: செய்தி
  rationale: இங்கு இச்சொல் கேட்டறியப்படும் தகவலை, அதாவது இயேசுவைப் பற்றிப் பரவிய செய்தியைக் குறிக்கிறது. ‘புகழ்’ என்பது நற்பெயர் அல்லது பிரபலத்தன்மை என்ற கூடுதல் கருத்தை வலுப்படுத்தக்கூடும்.
- source_word: αὐτοῦ
  choice: அவரைப் பற்றிய
  rationale: ἀκοή என்பதுடன் வரும் உரிமை வேற்றுமை இங்கு உடைமையைக் காட்டுவதைவிட செய்தியின் உள்ளடக்கத்தைக் காட்டுகிறது; ஆகவே ‘அவரைப் பற்றிய’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் நடையில் காணப்படும் உடனடித் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πανταχοῦ
  choice: எங்கும்
  rationale: இது ‘எல்லா இடங்களிலும்’ என்ற பரந்த பரப்பைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: περίχωρον
  choice: சுற்றுப்பகுதி
  rationale: ஒரு மைய இடத்தைச் சூழ்ந்துள்ள பகுதி அல்லது மாவட்டம் என்ற புவியியல் பொருளை, நகர்ப்புறம் அல்லது கிராமப்புறம் என்று தேவையின்றி வரையறுக்காமல் தெரிவிக்கிறது.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: கலிலேயாவின் சுற்றுப்பகுதி முழுவதிலும்
  rationale: εἰς தரும் விரிவடைந்து செல்லும் எண்ணத்தை ‘பரவியது’ என்ற வினைச்சொல் ஏற்கெனவே வெளிப்படுத்துகிறது; ‘முழுவதிலும்’ என்பது பரப்பின் முழுமையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀκοὴ αὐτοῦ என்பதன் பொருள்
  choice: அவரைப் பற்றிய செய்தி
  alternative: அவருடைய புகழ்
  rationale: வசனம் இயேசுவைப் பற்றிக் கேள்விப்பட்ட தகவல் விரைவாகப் பரவியதைச் சொல்கிறது. ‘புகழ்’ என்பது பிரபலத்தன்மை அல்லது நற்பெயர் என்ற கருத்தை மூலச்சொல் கட்டாயப்படுத்துவதைக் காட்டிலும் அதிகமாகச் சேர்க்கக்கூடும்; ‘செய்தி’ அந்தத் தெளிவின்மையைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முழுவதிலும் எங்கும்’ என்ற சிறு மீளுரைத்தல், ὅλην மற்றும் πανταχοῦ ஆகிய இரண்டின் வலியுறுத்தலையும் காக்கிறது.
