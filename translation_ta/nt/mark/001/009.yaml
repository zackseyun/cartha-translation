  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: ta
  text: அந்த நாட்களில், இயேசு கலிலேயாவிலுள்ள நாசரேத்திலிருந்து வந்து, யோவானால் யோர்தானில்[a] திருமுழுக்குப் பெற்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானுக்குள்.” கிரேக்க முன்னிடைச்சொல்லை இன்னும் சொற்சொல்லாக இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: கிரேக்கக் கதைத் தொடர் இடைமொழியைத் தமிழில் இயல்பாகச் சுருக்கி, காலச் சூழலையும் புதிய நிகழ்வு தொடங்குவதையும் காக்கிறது; சொற்சொல்லான ‘அப்போது நிகழ்ந்ததாவது’ இங்கு கனமாக ஒலிக்கும்.
- source_word: ἦλθεν
  choice: வந்து
  rationale: அடிப்படை இயக்கப் பொருளை இயல்பான தமிழ் தொடர் வினையெச்சமாக வழங்குகிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள நாசரேத்திலிருந்து
  rationale: நாசரேத்தின் புவியியல் அடையாளத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐβαπτίσθη
  choice: திருமுழுக்குப் பெற்றார்
  rationale: செயப்பாட்டு வினையின் பொருளைக் காக்கும், தமிழ் கிறிஸ்தவ மொழியில் பரவலாகப் புரியக்கூடிய மரியாதைமிக்க வடிவம்; குறிப்பிட்ட சடங்கு முறையைத் தீர்மானிக்கவில்லை.
- source_word: εἰς τὸν Ἰορδάνην
  choice: யோர்தானில்
  rationale: திருமுழுக்கு நிகழ்ந்த இடத்தைக் குறிக்கும் இயல்பான தமிழ். εἰς என்பதன் இயக்க நுணுக்கத்தைக் காட்ட ‘யோர்தானுக்குள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: ὑπὸ Ἰωάννου
  choice: யோவானால்
  rationale: செயப்பாட்டு அமைப்பில் செய்பவரைக் குறிக்கும் ὑπό + உருபின் நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: βαπτίζω என்பதன் திருச்சபை மரபுகளுடன் தொடர்புடைய மொழிபெயர்ப்பு
  choice: திருமுழுக்குப் பெற்றார்
  alternative: மூழ்கடிக்கப்பட்டார்
  rationale: நிகழ்வை அடையாளப்படுத்தும் நிலைபெற்ற தமிழ் சொல்லைத் தேர்ந்தெடுத்து, இவ்வசனம் கட்டாயப்படுத்தாத குறிப்பிட்ட திருமுழுக்கு முறையை மொழிபெயர்ப்பில் புகுத்தாமல் இருக்கிறது.
- issue: εἰς என்பதிலுள்ள இடம்/இயக்கம் குறித்த நுணுக்கம்
  choice: யோர்தானில்
  alternative: யோர்தானுக்குள்
  rationale: முதன்மை உரையில் இயல்பான இடவியல் தமிழைப் பயன்படுத்தி, கிரேக்க முன்னிடைச்சொல்லின் அதிக சொற்சொல்லான இயக்க வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை. ‘யோர்தான்’, ‘யோவான்’, ‘திருமுழுக்கு’ ஆகிய நிலைபெற்ற தமிழ் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
