source:
  edition: SBLGNT
  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: ta
  text: யோவான் ஒட்டக மயிரால் ஆன ஆடையை அணிந்திருந்தார்; தமது இடுப்பைச் சுற்றித் தோல் பட்டையை அணிந்திருந்தார்[a]. அவர் வெட்டுக்கிளிகளையும் காட்டுத் தேனையும் உண்டுகொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவானின் உடை 2 இராஜாக்கள் 1:8-இல் விவரிக்கப்படும் எலியாவின் தோற்றத்தை நினைவூட்டுகிறது; இது யோவானைத் தீர்க்கதரிசன முன்னோடியாக மாற்கு சித்தரிப்பதில் பங்களிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: அணிந்திருந்தார்
  rationale: நிறைவுநிலைப் பெயரெச்சம், யோவான் உடையணிந்திருந்த நிலையைச் சித்தரிக்கிறது. ‘அணிந்திருந்தார்’ என்பது அந்த நிலைத்தன்மையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τρίχας καμήλου
  choice: ஒட்டக மயிரால் ஆன ஆடை
  rationale: இது ஒட்டகத் தோலை அல்ல, ஒட்டக மயிரால் செய்யப்பட்ட உடையைச் சுட்டுகிறது. தமிழில் வெறும் ‘ஒட்டக மயிரை அணிந்திருந்தார்’ என்பது இயல்பற்றதால், பொருளில் உள்ளடங்கிய ‘ஆடை’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ζώνην δερματίνην
  choice: தோல் வார்
  rationale: ζώνη இடுப்பில் கட்டப்படும் வார் அல்லது பட்டையையும், δερματίνη அதன் தோல் பொருளையும் குறிக்கிறது. ‘தோல் வார்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: தமது இடுப்பைச் சுற்றி
  rationale: ὀσφύς குறிக்கும் இடுப்பு பகுதியைத் தெளிவான தற்காலத் தமிழில் தருகிறது.
- source_word: ἔσθων
  choice: உண்டுவந்தார்
  rationale: நிகழ்காலப் பெயரெச்சம் இங்கு யோவானின் வழக்கமான அல்லது தொடர்ந்து நிலவிய உணவுப் பழக்கத்தைச் சித்தரிக்கிறது. ‘உண்டுவந்தார்’ அதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκρίδας
  choice: வெட்டுக்கிளிகள்
  rationale: இச்சொல்லின் வழக்கமான நேரடிப் பொருள் உண்ணத்தக்க வெட்டுக்கிளி இனப் பூச்சிகள்; வேறு உருவகப் பொருளை எடுத்துக்கொள்ளச் சூழல் காரணம் இல்லை.
- source_word: μέλι ἄγριον
  choice: காட்டுத் தேன்
  rationale: காட்டில் இயற்கையாகக் கிடைக்கும் தேனைச் சுட்டும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: καὶ ἦν
  choice: தனி தொடக்க இணைப்புச் சொல் இல்லாமல் வாக்கியமாக்கப்பட்டது
  rationale: καί முந்தைய விவரணையைத் தொடர்கிறது. தமிழில் இங்கு ‘மேலும்’ அல்லது ‘இப்போது’ என்று சேர்ப்பது தேவையற்றதாக இருப்பதால், தொடர்ச்சியை வாக்கிய அமைப்பே உணர்த்துகிறது.
theological_decisions:
- issue: யோவானின் உடையும் உணவும் எலியாவை நினைவூட்டும் தீர்க்கதரிசனப் படிமத்துடன் கொண்ட தொடர்பு
  choice: முதன்மை உரையில் யோவானின் தோற்றத்தையும் உணவையும் மட்டும் விவரித்தல்
  alternative: யோவான் எலியாவைப் போன்றவர் அல்லது தீர்க்கதரிசன முன்னோடி என்று முதன்மை உரையிலேயே வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இந்த உடை 2 இராஜாக்கள் 1:8-இல் வரும் எலியாவின் தோற்றத்தை நினைவூட்டினாலும், மாற்கு 1:6 அந்த அடையாளத்தை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே மொழிபெயர்ப்பு விளக்கத்தை உரைக்குள் சேர்க்காமல், தொடர்பை அடிக்குறிப்பில் மட்டும் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரமான, வாசிக்க எளிய, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தோல் வார்’ மற்றும் ‘காட்டுத் தேன்’ போன்ற சொற்கள் சுருக்கமான இயல்பைத் தக்கவைக்கின்றன; மரியாதைப் பன்மை நடை முழுவதும் ஒருமையாகப் பின்பற்றப்பட்டுள்ளது.
