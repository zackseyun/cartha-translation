id: MRK.1.29
reference: Mark 1:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: ta
  text: உடனே அவர்கள் ஜெபக்கூடத்திலிருந்து வெளியேறி, யாக்கோபுடனும் யோவானுடனும் சீமோன், அந்திரேயா ஆகியோரின் வீட்டிற்குள் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் வேகமான கதை நகர்வைச் சுட்டும் வினையடையின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐκ τῆς συναγωγῆς
  choice: ஜெபக்கூடத்திலிருந்து
  rationale: ἐκ என்பதன் ‘உள்ளிருந்து வெளியே’ என்ற திசை உணர்வைத் தொடர்ந்து வரும் ‘வெளியேறி’ என்பதுடன் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐξελθόντες ἦλθον
  choice: வெளியேறி ... சென்றார்கள்
  rationale: முதலில் வெளியேறி, பின்னர் வீட்டிற்குச் சென்றார்கள் என்ற முற்காலப் பங்கேற்புச் சொல்லுக்கும் முதன்மை வினைக்கும் இடையிலான நிகழ்வு வரிசையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἦλθον
  choice: சென்றார்கள்
  rationale: ἔρχομαι சூழலுக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும்; புறப்பட்ட இடத்திலிருந்து இலக்கை நோக்கிய நகர்வைத் தமிழில் ‘சென்றார்கள்’ இயல்பாகக் குறிக்கிறது.
- source_word: εἰς τὴν οἰκίαν
  choice: வீட்டிற்குள்
  rationale: εἰς குறிக்கும் வீட்டின் உட்புறத்தை நோக்கிய நகர்வை ‘வீட்டிற்குள்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: சீமோன், அந்திரேயா ஆகியோரின்
  rationale: இருவருடனும் தொடர்புடைய வீடு என்பதை மரபியல்சார் உருபின் வழியாகத் தெளிவாகக் காட்டுகிறது; யாருடைய தனிப்பட்ட உரிமை என்பது குறித்து வசனம் கூறுவதைக் கடந்த முடிவை எடுக்கவில்லை.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: யாக்கோபுடனும் யோவானுடனும்
  rationale: μετά உடனிருத்தல் அல்லது துணைசெல்லுதலைக் குறிக்கிறது; ‘உடன்’ அதற்கான நேரடியான இயல்பான தமிழ் வடிவம்.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: சீமோன் / அந்திரேயா / யாக்கோபு / யோவான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
