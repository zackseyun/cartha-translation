source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: ta
  text: பல்வேறு நோய்களால் பாதிக்கப்பட்டிருந்த பலரை அவர் குணமாக்கினார்; பல பேய்களை வெளியேற்றினார். பேய்கள் அவரை அறிந்திருந்ததால்[a], அவை பேச அவர் அனுமதிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் யார் என்பதை அவை அறிந்திருந்ததால்.” கிரேக்கத்தில் சொற்சொல்லாக, “அவை அவரை அறிந்திருந்ததால்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: θεραπεύω இச்சூழலில் நோயிலிருந்து குணப்படுத்துவதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: பாதிக்கப்பட்டிருந்த பலரை
  rationale: κακῶς ἔχω என்பது நோயுற்றிருத்தல் என்ற கிரேக்க மரபுத்தொடர்; அடுத்துவரும் ‘நோய்களால்’ என்பதுடன் இணைத்து தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ποικίλαις νόσοις
  choice: பல்வேறு நோய்களால்
  rationale: ποικίλος நோய்களின் பல்வகைமையையும் νόσος நோயையும் குறிக்கின்றன; கிரேக்க வேற்றுமையின் கருவி/காரணத் தொடர்பை ‘-ஆல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: பல பேய்களையும் துரத்தினார்
  rationale: ἐκβάλλω வலுக்கட்டாயமாக வெளியேற்றுவதைக் குறிக்கிறது; ‘துரத்தினார்’ என்பது பேயோட்டும் சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: பேச அவர் அனுமதிக்கவில்லை
  rationale: ἤφιεν என்பதன் இறந்தகாலத் தொடர்நிலை நுணுக்கத்தை, நிகழ்வின் போது அவர் அவற்றைப் பேச விடாமல் இருந்தார் என்ற இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: அறிந்திருந்ததால்
  rationale: இங்கு ὅτι பேய்களைப் பேசவிடாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘-தால்’ அந்தக் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ᾔδεισαν αὐτόν
  choice: அவரை அறிந்திருந்ததால்
  rationale: கிரேக்கத்தில் αὐτόν என்பது ‘அவரை’ என்ற நேரடி பொருள் மட்டுமே; இயேசுவின் அடையாளத்தை விளக்கி விரிவுபடுத்தாமல் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: பேய்களின் அறிவை வெளிப்படையான கிறிஸ்துவியல் அறிக்கையாக விரிவுபடுத்தலாமா என்பது
  choice: அவரை அறிந்திருந்ததால்
  alternative: அவர் யார் என்பதை அவை அறிந்திருந்ததால்
  rationale: மூல கிரேக்கம் ‘அவரை’ என்று மட்டுமே கூறுகிறது. ‘அவர் யார்’ அல்லது ‘அவர் மெசியா/தேவகுமாரன்’ என்று விரிவுபடுத்துவது அருகிலுள்ள பகுதிகளின் தகவலை இவ்வசனத்திற்குள் கொண்டு வரும்; சுருக்கமான வாசகம் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடையிலும் அமைக்கப்பட்டுள்ளது. ‘பேய்கள்’ என்பது δαιμόνια என்பதற்கான பரவலாகப் புரியும் சொல்; ‘அவரை அறிந்திருந்ததால்’ என்ற மூலத்தின் சுருக்கம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
