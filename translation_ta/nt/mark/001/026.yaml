  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: ta
  text: அசுத்த ஆவி அவனை வலிப்புக்குள்ளாக்கி, உரத்த குரலில் கத்தி, அவனைவிட்டு வெளியேறியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: வலிப்புக்குள்ளாக்கி
  rationale: இந்த இறந்தகால வினையெச்சம் ஆவி வெளியேறுவதற்கு முன் செய்த செயலைக் குறிக்கிறது. சூழலில் உடலைக் கடுமையாக இழுத்துத் துடிக்கச் செய்ததை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது; ‘கிழித்து’ என்பது தவறான உடற்காயப் பொருளைத் தரக்கூடும்.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: அசுத்த ஆவி
  rationale: ἀκάθαρτος என்பதிலுள்ள தூய்மையின்மை சார்ந்த நுண்பொருளைப் பாதுகாக்கும், நற்செய்தி நூல்களின் பயன்பாட்டுக்கு ஏற்ற நிலையான தமிழ் சொற்றொடர்.
- source_word: φωνῆσαν
  choice: கூச்சலிட்டு
  rationale: வெளியேறும் நிகழ்வுடன் இணைந்த வலுவான ஒலியெழுப்புதலை இயல்பாகக் காட்டுகிறது; அதன் உணர்ச்சித் தன்மையைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: முறையைக் குறிக்கும் இத்தொடரில் ‘குரல்’ என்ற மூலச்சொல்லின் concrete imagery-ஐப் பாதுகாத்து, μεγάλη என்பதைக் சூழலுக்கேற்ற ‘உரத்த’ என வழங்குகிறது.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: அவனைவிட்டு வெளியேறியது
  rationale: ஆவி அந்த மனிதனிடமிருந்து நீங்கியதைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது; மூலத்தின் இடம்சார் கருத்தைப் பாதுகாக்கிறது.
- source_word: καὶ ... καὶ
  choice: அப்போது ... -இட்டு
  rationale: மாற்குவின் தொடர்ச்சியான கதைநடையை ‘அப்போது’ காட்டுகிறது; கிரேக்க வினையெச்சத் தொடர்களை இயல்பான தமிழ் வினையெச்சங்களால் இணைக்கிறது.
theological_decisions:
- issue: பிடித்திருந்த ஒன்றின் இயல்பு
  choice: தனிப்பட்ட செயற்பாட்டைக் கொண்ட அசுத்த ஆவி
  alternative: ஆளற்ற தீய சக்தி
  rationale: மாற்குவின் கதை உலகில் அது அவனை வலிப்புக்குள்ளாக்கி, கூச்சலிட்டு, வெளியேறும் செயற்பாட்டாளராக வருகிறது. உரை இந்தத் தனிப்பட்ட செயற்பாட்டைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கதைநடை. மூலத்தின் நிகழ்வு வரிசையும் அசுத்த ஆவியின் இலக்கணச் செயற்பாடும் பாதுகாக்கப்பட்டுள்ளன.
