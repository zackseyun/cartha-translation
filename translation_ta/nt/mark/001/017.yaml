  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “என் பின்னே வாருங்கள்; உங்களை மனிதர்களைப் பிடிக்கும் மீனவர்களாக ஆக்குவேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: என் பின்னே வாருங்கள்
  rationale: சீடராக இயேசுவைப் பின்பற்ற வருமாறு விடுக்கப்படும் அழைப்பை, மூலத்தின் இடவியல் உருவகத்தோடு இயல்பான தமிழில் காக்கிறது.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: உங்களை ... ஆக்குவேன்
  rationale: சொல்லுக்கு சொல் மொழிபெயர்த்தால் இயல்பில்லாத ‘உங்களை ஆகும்படி செய்வேன்’ என்பதற்குப் பதிலாக, செயற்படுத்தும் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: மனிதர்களைப் பிடிக்கும் மீனவர்கள்
  rationale: மீன்பிடி உருவகத்தையும் ἀνθρώπων என்பதன் மனிதகுலம் சார்ந்த பொதுப்பொருளையும் காக்கிறது; தமிழில் ‘மனிதர்களின் மீனவர்கள்’ என்பது இயல்பாக இல்லாததால் வினைத் தொடர்பு வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: ἀνθρώπων என்பதன் பாலினப் பரப்பு
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: ἄνθρωπος இங்கு ஆண்களை மட்டும் குறிக்கும் ἀνήρ அல்ல; பொதுவாக மனிதர்களைக் குறிக்கிறது. ஆகவே உள்ளடக்கிய மூலப்பொருள் தமிழில் காக்கப்படுகிறது.
- issue: சீடர்களின் மாற்றத்தில் இயேசுவின் செயற்பாடு
  choice: ஆக்குவேன்
  alternative: ஆகச் செய்வேன்
  rationale: ποιήσω ὑμᾶς γενέσθαι என்பதில் மாற்றத்தை நிகழ்த்துபவர் இயேசு என்ற வலியுறுத்தல் காக்கப்படுகிறது; மாற்றம் உடனடியாக நிறைவடையும் என கூடுதல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடை. ‘பின்னே’ என்பது அழைப்பின் சீடத்துவ உருவகத்தை காக்கிறது; ‘மனிதர்களைப் பிடிக்கும்’ என்பது தமிழில் தெளிவாக இருந்தாலும் மூலத்தின் திட்டமிட்ட மீன்பிடி உருவகத்தை மாற்றவில்லை.
