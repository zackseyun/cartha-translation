  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: ta
  text: சீமோனின் மாமியார் காய்ச்சலுடன் படுத்திருந்தார். உடனே அவர்கள் அவரைப் பற்றி இயேசுவிடம் சொன்னார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “அவரைப் பற்றி அவரிடம் சொல்கிறார்கள்” என்று நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது. கடந்த நிகழ்வை உயிரோட்டமாக விவரிக்கும் வரலாற்று நிகழ்காலம் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: மாமியார்
  rationale: சூழலில் சீமோனின் மனைவியின் தாயைக் குறிக்கும் வழக்கமான உறவுமுறைச் சொல்.
- source_word: κατέκειτο
  choice: படுத்திருந்தார்
  rationale: தொடர்ந்து படுத்திருந்த நிலையைக் குறிக்கும் இறந்தகால வடிவத்தின் நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது; அவர் நிரந்தரமாகப் படுக்கையிலேயே இருந்தார் என்று மிகைப்படுத்துவதில்லை.
- source_word: πυρέσσουσα
  choice: காய்ச்சலுடன்
  rationale: காய்ச்சலால் நோயுற்றிருந்தார் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நடந்ததைத் தெரிவிப்பதுடன், மாற்குவின் வேகமான கதைநடையையும் காக்கிறது.
- source_word: λέγουσιν
  choice: சொன்னார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடையாக வழங்குகிறது; மூலத்தின் நிகழ்கால வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: περὶ αὐτῆς
  choice: அவரைப் பற்றி
  rationale: περί உடன் வரும் உருபின் ‘அவரைக் குறித்து/அவரைப் பற்றி’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: αὐτῷ
  choice: இயேசுவிடம்
  rationale: கிரேக்கத்தில் உள்ள ‘அவரிடம்’ என்பதன் சூழல்சார் முன்னிலையைத் தமிழில் குழப்பமின்றித் தெளிவாக்குகிறது.
