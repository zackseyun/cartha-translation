  source_fidelity: மூலக் கிரேக்கத்தின் பொருளும் நிகழ்வுகளின் வரிசையும் துல்லியமாகக் காக்கப்பட்டுள்ளன. κατέκειτο என்பதன் தொடர்நிலை ‘படுத்திருந்தார்’ எனவும், πυρέσσουσα ‘காய்ச்சலுடன்’ எனவும், εὐθύς ‘உடனே’ எனவும் சரியாக வழங்கப்பட்டுள்ளன. αὐτῷ என்பதைச் சூழலுக்கு ஏற்ப ‘இயேசுவிடம்’ என்று தெளிவுபடுத்துவது பொருத்தமானது. δέ-யின் மென்மையான தொடர்ச்சிச் செயல்பாட்டைத் தமிழில் தனிச் சொல்லாகக் காட்டாமல் விடுவது ஏற்றது.
