  terminology: ‘மாமியார்,’ ‘காய்ச்சல்,’ ‘உடனே,’ மற்றும் ‘அவரைப் பற்றி’ ஆகிய சொற்கள் துல்லியமும் இயல்பும் உடையவை. ‘சீமோனின் மாமியார்’ என்பது πενθερά-வுக்கான சரியான உறவுமுறைச் சொல்லாகும்.
