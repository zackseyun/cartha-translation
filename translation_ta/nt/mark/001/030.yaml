translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. δέ தனியாக மொழிபெயர்க்கப்படவில்லை; இங்கு அது வலுவான எதிர்மறையை அல்ல, மென்மையான கதைத் தொடர்ச்சியையே குறிக்கிறது. கிரேக்கத்தின் ஒரே வாக்கியம் தமிழின் இயல்பான வாசிப்பிற்காக இரண்டு குறும் வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
