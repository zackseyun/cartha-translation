id: MRK.1.27
reference: Mark 1:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: ta
  text: அவர்கள் அனைவரும் வியப்பில் ஆழ்ந்தார்கள்; அதனால் அவர்கள் ஒருவரோடு ஒருவர் பேசிக்கொண்டு, “இது என்ன? அதிகாரமுள்ள புதிய போதனை![a] அசுத்த ஆவிகளுக்குக்கூட இவர் கட்டளையிடுகிறார்; அவையும் இவருக்குக் கீழ்ப்படிகின்றன!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது என்ன? அதிகாரமுள்ள இந்தப் புதிய போதனை என்ன?” ‘புதிய போதனை’ என்ற சொற்றொடரை முந்தைய கேள்வியோடு நேரடியாக இணைக்கும் வகையிலும் கிரேக்கத்தை நிறுத்தற்குறியிடலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: திகைத்துப்போய்
  rationale: வியப்பால் ஆழமாகத் தாக்கப்பட்ட எதிர்வினையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; அளவுக்கு மீறிய தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: ἅπαντες
  choice: அவர்கள் அனைவரும்
  rationale: அங்கிருந்தவர்களின் முழுமையான கூட்டுப் பிரதிபலிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: ஒருவரோடு ஒருவர் ... பேசிக்கொண்டார்கள்
  rationale: ὥστε கூறும் விளைவையும், குழுவினருக்குள் நடந்த பரஸ்பர உரையாடலையும் இயல்பான தமிழ்ச் சொற்றொடரில் தருகிறது.
- source_word: Τί ἐστιν τοῦτο;
  choice: இது என்ன?
  rationale: திடுக்கிட்ட நேரடிக் கேள்வியை, விளக்கவுரை சேர்க்காமல் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: διδαχὴ καινή
  choice: ஒரு புதிய போதனை
  rationale: διδαχή என்பதற்கு இச்சூழலில் தொழில்நுட்பத் தன்மை குறைந்த, பொதுவாகப் புரியும் ‘போதனை’ பொருத்தமானது.
- source_word: κατ’ ἐξουσίαν
  choice: அதிகாரமுள்ள
  rationale: இயேசுவின் போதனையிலும் கட்டளையிலும் வெளிப்படும் அதிகாரத்தைச் சுட்டுகிறது; கிரேக்கச் சொற்றொடரின் தொடரியல் நெகிழ்வை அடிக்குறிப்பு விளக்குகிறது.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: அசுத்த ஆவிகளுக்கு
  rationale: ἀκάθαρτος என்பதன் சமய மற்றும் ஒழுக்கத் தொனியை ‘அசுத்த’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐπιτάσσει
  choice: கட்டளையிடுகிறார்
  rationale: அதிகாரத்தோடு ஆணையிடும் செயலைத் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: ὑπακούουσιν αὐτῷ
  choice: அவை இவருக்குக் கீழ்ப்படிகின்றன
  rationale: கட்டளைக்குக் கீழ்ப்படிந்து செயல்படுவதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘அதிகாரமுள்ள’ என்பதன் தொடரியல் தொடர்பு
  choice: ‘அதிகாரமுள்ள ஒரு புதிய போதனை!’ என்ற வியப்புக் கூற்றாக அமைத்தல்
  alternative: ‘இது என்ன? அதிகாரமுள்ள இந்தப் புதிய போதனை என்ன?’ என்ற ஒருங்கிணைந்த கேள்வியாக அமைத்தல்; அல்லது ‘அதிகாரத்தோடு அசுத்த ஆவிகளுக்குக்கூட கட்டளையிடுகிறார்’ என்று அடுத்த வினையோடு முதன்மையாக இணைத்தல்
  rationale: கிரேக்கத்தில் நிறுத்தற்குறி மற்றும் தொடரியல் ஒன்றுக்கு மேற்பட்ட இயல்பான வாசிப்புகளை அனுமதிக்கின்றன. முதன்மை உரை புதிய போதனையையும் அதன் அதிகாரத்தையும் வலியுறுத்துகிறது; அடிக்குறிப்பு மாற்று வாசிப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. கூட்டத்தின் நேரடி பேச்சில் ‘இவர்/இவருக்கு’ பயன்படுத்தப்பட்டு இயல்பான மரியாதைநடை பேணப்பட்டுள்ளது; உண்மையான தொடரியல் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
