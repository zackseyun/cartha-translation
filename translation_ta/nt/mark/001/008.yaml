  source_fidelity: மூலக் கிரேக்கத்தின் கால வேறுபாடு (ἐβάπτισα/βαπτίσει), தண்ணீருக்கும் பரிசுத்த ஆவிக்கும் இடையிலான முரண், மற்றும் வெளிப்படையான ‘நான்’–‘அவரோ’ வலியுறுத்தல் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘தண்ணீரால்’ மற்றும் ‘பரிசுத்த ஆவியால்’ என்பவை ὕδατι மற்றும் ἐν πνεύματι ἁγίῳ என்பவற்றுக்கு இயல்பான, இணையான மொழிபெயர்ப்புகள்.
  naturalness: ‘நான் உங்களுக்குத் தண்ணீரால் திருமுழுக்கு கொடுத்தேன்; அவரோ … உங்களுக்குத் திருமுழுக்கு கொடுப்பார்’ என்பது நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘அவரோ’ என்பது தேவையற்ற சொற்சுமையின்றி மூலத்தின் எதிர்மறை ஒப்பீட்டை நன்றாக வெளிப்படுத்துகிறது.
  terminology: ‘திருமுழுக்கு’ βαπτίζω-வின் சடங்கு மற்றும் வேதாகமப் பயன்பாட்டைச் செய்முறையாகக் குறுக்காமல் காக்கிறது. ‘பரிசுத்த ஆவி’ நவீன நிலையான தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பொருத்தமானது. அடிக்குறிப்பு ἐν என்பதன் ‘-ஆல்’/‘-இல்’ சாத்தியங்களை நியாயமாகப் பாதுகாக்கிறது.
