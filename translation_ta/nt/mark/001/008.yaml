id: MRK.1.8
reference: Mark 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: ta
  text: நான் உங்களுக்குத் தண்ணீரால் திருமுழுக்கு கொடுத்தேன்; அவரோ பரிசுத்த ஆவியால்[a] உங்களுக்குத் திருமுழுக்கு கொடுப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியில்.” கிரேக்க முன்னிடைச்சொல்லை இங்கு “-ஆல்” என்றும் “-இல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: நான்
  rationale: வெளிப்படையாக உள்ள முதலாம் நபர் பதிற்பெயரைத் தக்கவைத்து, பின்னர் வரும் αὐτός உடனான வலியுறுத்தப்பட்ட வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐβάπτισα
  choice: திருமுழுக்கு கொடுத்தேன்
  rationale: βαπτίζω என்பதன் சடங்கு மற்றும் வேதாகமத் தொடர்புகளைத் தக்கவைக்கும் இயல்பான தமிழ் வழக்கு; செய்முறையை மட்டும் வலியுறுத்தும் ‘மூழ்கடித்தேன்’ என்பதைத் தவிர்க்கிறது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: கிரேக்கத்தில் இது பன்மை. தமிழில் ‘உங்களுக்கு’ என்பது சூழலில் இயல்பாகப் பன்மைக் கூட்டத்தைக் குறிக்கிறது.
- source_word: ὕδατι
  choice: தண்ணீரால்
  rationale: கருவிப்பொருள் தரும் வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்தி, பரிசுத்த ஆவியால் செய்யப்படும் திருமுழுக்குடன் உள்ள இணை அமைப்பையும் காக்கிறது.
- source_word: αὐτὸς
  choice: அவரோ
  rationale: மரியாதையான மூன்றாம் நபர் வடிவத்தோடு ‘-ஓ’ வேற்றுமை வலியுறுத்தலைப் பயன்படுத்தி, ‘நான்’ என்பதுடனான தெளிவான முரணைக் காக்கிறது.
- source_word: δὲ
  choice: ; அவரோ
  rationale: யோவானின் திருமுழுக்கும் வருகிறவரின் திருமுழுக்கும் இடையிலான முரணை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: βαπτίσει
  choice: திருமுழுக்கு கொடுப்பார்
  rationale: எதிர்காலத்தையும் ἐβάπτισα உடனான சொல் தொடர்ச்சியையும் காக்கிறது.
- source_word: ἐν
  choice: -ஆல்
  rationale: ἐν உடன் வரும் வேற்றுமை இங்கு கருவி அல்லது ஊடகப் பொருளில் புரிந்துகொள்ளப்படலாம்; தமிழில் ‘பரிசுத்த ஆவியால்’ இயல்பானது. இடம் அல்லது சூழலைக் குறிக்கும் ‘பரிசுத்த ஆவியில்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவி
  rationale: இச்சூழலில் தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கும் இயல்பான, பரவலாக அறியப்பட்ட தமிழ் சொற்றொடர்; மூலத்தில் இல்லாத மரியாதை விகுதியையோ விரிவான விளக்கத்தையோ சேர்க்கவில்லை.
theological_decisions:
- issue: πνεύματι ἁγίῳ என்பது தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கிறதா அல்லது ஆளற்ற பரிசுத்த வல்லமையைக் குறிக்கிறதா
  choice: பரிசுத்த ஆவி
  alternative: ஒரு பரிசுத்த ஆவி / பரிசுத்தமான ஆவி
  rationale: யோவானின் தண்ணீர் திருமுழுக்கையும் வருகிற வல்லமையானவரின் திருமுழுக்கையும் வேறுபடுத்தும் மாற்கு நற்செய்தியின் சூழலில், இது தெய்வீகப் பரிசுத்த ஆவியையே மிக இயல்பாகக் குறிக்கிறது; அதற்கு மேற்பட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: ἐν πνεύματι ἁγίῳ என்பதில் ἐν-ஐ எவ்வாறு மொழிபெயர்ப்பது
  choice: பரிசுத்த ஆவியால்
  alternative: பரிசுத்த ஆவியில்
  rationale: கிரேக்க முன்னிடைச்சொல் கருவி/ஊடகம் அல்லது சூழல்/இடம் ஆகிய பொருட்களை அனுமதிக்கிறது. முதன்மை உரையில் இயல்பான தமிழ் மற்றும் தண்ணீருடனான இணை அமைப்புக்காக ‘-ஆல்’ பயன்படுத்தப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், தெளிவும் கண்ணியமும் உடைய நடை பயன்படுத்தப்பட்டுள்ளது. ‘நான் … அவரோ’ என்ற அமைப்பு மூலத்தின் வலியுறுத்தப்பட்ட முரணைக் காக்கிறது. ‘திருமுழுக்கு கொடுத்தல்’ என்பது சடங்கு மற்றும் வேதாகமத் தொடர்பைத் தக்கவைத்து, செய்முறையைத் தேவையின்றி குறிப்பாக்காத சொல் தேர்வு.
