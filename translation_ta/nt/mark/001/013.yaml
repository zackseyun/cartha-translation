base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: ta
  text: அவர் வனாந்தரத்தில் நாற்பது நாட்கள் இருந்தார்; சாத்தான் அவரைச் சோதித்துக்கொண்டிருந்தான்.[a] அவர் காட்டு விலங்குகளுடன் இருந்தார்; தேவதூதர்கள் அவருக்குச் சேவை செய்துகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாத்தான் அவரைச் சோதனைக்கு உட்படுத்திக்கொண்டிருந்தான்.” கிரேக்க வினைச்சொல் ‘தீமைக்கு இழுக்கச் சோதித்தல்’ அல்லது ‘சோதனைக்கு உட்படுத்துதல்’ என இரு பொருள்களையும் தரலாம்; இங்கு சாத்தான் செயல்படுவதால், தீமைக்கு இழுக்க முயலும் சோதனை என்ற பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: மக்கள் வசிப்பிடங்களிலிருந்து விலகிய பாழ்வெளியைக் குறிக்கும் இயல்பான வேதாகமத் தமிழ் சொல். மணற்பாலைவனம் என்று தேவையின்றிக் குறிப்பாக்காமல், இந்த இடத்தின் புவியியல் மற்றும் வேதாகமப் பின்னொலிகளைத் தக்கவைக்கிறது.
- source_word: τεσσεράκοντα ἡμέρας
  choice: நாற்பது நாட்கள்
  rationale: கால அளவைக் குறிக்கும் கிரேக்கத் தொடரின் நேரடியான, இயல்பான மொழிபெயர்ப்பு; அதன் வேதாகமப் பின்னொலியை விளக்கமாகச் சேர்க்காமல் விடுகிறது.
- source_word: πειραζόμενος
  choice: சோதித்துக்கொண்டிருந்தான்
  rationale: πειράζω என்பது சூழலுக்கேற்ப சோதித்தல் அல்லது தீமைக்கு இழுக்க முயன்று சோதித்தல் எனப் பொருள்படலாம். சாத்தான் செய்பவனாக இருப்பதால் பகைமைமிக்க சோதனையின் பொருள் இங்கு முதன்மையானது; தொடர்ந்த செயலை இறந்தகாலத் தொடர்நிலை வடிவம் வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: சாத்தான் அவரை
  rationale: கிரேக்கச் செயலற்ற வாக்கியத்தை இயல்பான தமிழுக்காகச் செயல்வினை வாக்கியமாக மாற்றினாலும், சாத்தானே செயலின் முகவர் என்பது தெளிவாகத் தக்கவைக்கப்படுகிறது.
- source_word: μετὰ τῶν θηρίων
  choice: காட்டு விலங்குகளுடன்
  rationale: அடக்கப்படாத விலங்குகளைக் குறிக்கும் தெளிவான நவீனத் தமிழ்; பழமையான அல்லது மிகைப்படுத்தப்பட்ட சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: இங்கு மனிதத் தூதர்கள் அல்ல, விண்ணுலகத் தூதர்களே குறிக்கப்படுகிறார்கள் என்பதைச் சூழல் காட்டுவதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: διηκόνουν αὐτῷ
  choice: அவருக்குப் பணிவிடை செய்துகொண்டிருந்தார்கள்
  rationale: διακονέω என்பதன் சேவைசெய்தல் என்ற பொருளையும், இறந்தகாலத்தில் தொடர்ந்து நடைபெற்ற செயலைக் காட்டும் imperfect வடிவத்தையும் வெளிப்படுத்துகிறது.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: அவர் ... இருந்தார்; ... அவர் ... இருந்தார்; ...
  rationale: மாற்குவின் தொடரிணைப்பு நடையை முற்றிலும் மென்மையாக்கிவிடாமல், தமிழில் இயல்பான குறுவாக்கியங்களாலும் அரைப்புள்ளிகளாலும் நிகழ்வுகளின் தொடரைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சாத்தானோடு தொடர்புடைய πειραζόμενος என்பதன் பொருள்
  choice: சாத்தான் அவரைச் சோதித்துக்கொண்டிருந்தான்
  alternative: சாத்தான் அவரைப் பரீட்சித்துக்கொண்டிருந்தான் / அவர் சோதனைக்கு உட்படுத்தப்பட்டுக்கொண்டிருந்தார்
  rationale: கிரேக்க வினைச்சொல் நடுநிலையான பரிசோதனையையோ தீமைக்கு இழுக்கும் சோதனையையோ குறிக்கலாம். சாத்தான் செயலின் முகவராக வெளிப்படையாகக் குறிப்பிடப்படுவதால், பகைமைமிக்க சோதனை இங்கு அதிகம் பொருந்துகிறது; இருந்தாலும் மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தொடர்ச்சியான செயல்களைக் காட்ட ‘சோதித்துக்கொண்டிருந்தான்’, ‘பணிவிடை செய்துகொண்டிருந்தார்கள்’ என்ற வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மீளும் இணைப்பு நடை தமிழின் இயல்புக்கேற்ப அளவாகப் பாதுகாக்கப்பட்டுள்ளது.
