base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: ta
  text: மாலை நேரமானதும், சூரியன் மறைந்தபோது, நோயுற்றிருந்த அனைவரையும் பேய் பிடித்திருந்தவர்களையும்[a] அவரிடம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய்களின் ஆளுகைக்கு உட்பட்டிருந்தவர்களையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: மாலை நேரமானதும்
  rationale: கால மாற்றத்தைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘மாலை நேரம் வந்தபோது’ என்ற சொல்லுக்குச் சொல் அமைப்பின் கடினத்தன்மையைத் தவிர்க்கிறது.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: சூரியன் மறைந்தபோது
  rationale: ὅτε என்பதன் ‘போது/அப்போது’ என்ற காலப்பொருளையும், ἔδυ என்பதன் சூரியன் மறைதல் என்ற பொருளையும் நேரடியாகத் தக்கவைக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘பிறகு’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἔφερον
  choice: கொண்டுவந்தார்கள்
  rationale: கிரேக்க imperfect தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த செயலைக் காட்டக்கூடும். தமிழில் ‘கொண்டுவந்துகொண்டிருந்தார்கள்’ என்பது இங்கு செயற்கையாக ஒலிப்பதால், இயல்பான இறந்தகால வடிவம் சூழலில் அந்த நிகழ்வோட்டத்தைச் சுமக்கிறது.
- source_word: πρὸς αὐτὸν
  choice: அவரிடம்
  rationale: ஒரு நபரை நோக்கிய இயக்கத்தை இயல்பான தமிழில் குறிக்கிறது; கிரேக்கத்தில் பெயர் மீண்டும் இடம்பெறாததால் ‘இயேசுவிடம்’ என்று விரிவாக்கவில்லை.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: நோயுற்றிருந்த அனைவரையும்
  rationale: ‘நலமின்றி இருந்தவர்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, உடல்நலக்குறைவுடையவர்களைக் குறிக்கும் கிரேக்க மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; πάντας என்பதன் முழுமைப் பொருளையும் காக்கிறது.
- source_word: τοὺς δαιμονιζομένους
  choice: பேய் பிடித்திருந்தவர்களையும்
  rationale: உண்மையான பேய்சார் தாக்கத்தை மறைக்காமல், தமிழில் பரவலாகப் புரியும் மரபான சொற்றொடரைப் பயன்படுத்துகிறது. கிரேக்கச் சொல் குறிப்பதைக் கடந்த விரிவான பேயியல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: δαιμονιζομένους என்ற சொல்லில் உள்ள பேய்சார் ஆளுகையை எவ்வாறு வெளிப்படுத்துவது
  choice: பேய் பிடித்திருந்தவர்கள்
  alternative: பேய்களின் ஆளுகைக்கு உட்பட்டிருந்தவர்கள்
  rationale: முதன்மை வடிவம் சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது; இதை வெறும் நோயாக மாற்றாமல் உரையின் பேய்சார் குறிப்பைத் தக்கவைக்கிறது. மாற்று வடிவம் ‘பிடித்தல்’ என்ற தமிழ்ச் சொற்றொடரால் ஏற்படக்கூடிய மிகக் குறிப்பான புரிதலைத் தவிர்க்க உதவுவதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἔφερον என்ற imperfect வினையின் நிகழ்வோட்டம்
  choice: கொண்டுவந்தார்கள்
  alternative: கொண்டுவந்துகொண்டிருந்தார்கள்
  rationale: தொடர்ச்சியான செயல் என்ற சாத்தியத்தை ஏற்றுக்கொண்டாலும், நீண்ட கூட்டு வினை தமிழில் கனமாகவும் இயற்கையற்றதாகவும் அமையும். எளிய இறந்தகாலம் இக்கதைச் சூழலில் கூட்டமாக மக்களை அழைத்து வந்த நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- issue: ὅτε என்பதன் காலத் தொடர்பு
  choice: சூரியன் மறைந்தபோது
  alternative: சூரியன் மறைந்த பிறகு
  rationale: ὅτε என்பதன் நேரடியான ‘போது’ பொருளைத் தக்கவைத்து, ஓய்வுநாள் முடிந்த பின்பே அவர்கள் வந்தார்கள் என்ற சூழல்சார் விளக்கத்தை மொழிபெயர்ப்புக்குள் கட்டாயமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்கு எளிதில் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. இரு காலக் கூறுகளும் கிரேக்கத்தின் அமைப்பின்படி தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
