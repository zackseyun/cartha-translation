  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: ta
  text: யோவான் ஒப்படைக்கப்பட்ட பிறகு[a], இயேசு கலிலேயாவுக்கு வந்து, கடவுளின்[c] நற்செய்தியை[b] அறிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோவான் கைதுசெய்யப்பட்ட பிறகு.’ கிரேக்கத்தில் இன்னும் நேரடியாக ‘ஒப்படைக்கப்பட்ட பிறகு’ என்று உள்ளது; இதே சொல்லோட்டம் மாற்குவில் பின்னர் இயேசுவின் பாடுகளைப் பற்றிய பகுதிகளிலும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளின் சுவிசேஷத்தை.’
    reason: lexical_alternative
  - marker: c
    text: ‘கடவுளின்’ என்பது கடவுளிடமிருந்து வரும், கடவுளுக்குரிய, அல்லது கடவுளை மையமாகக் கொண்ட நற்செய்தி என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: ஒப்படைக்கப்பட்ட பிறகு
  rationale: μετά உடன் வரும் பெயராக்கப்பட்ட இறந்தகால வினையெச்சம் காலப் பொருளில் ‘பிறகு’ என்பதைக் குறிக்கிறது. παραδίδωμι என்பதன் அடிப்படைப் பொருளான ‘ஒப்படைத்தல்’ என்பதைத் தக்கவைத்து, மாற்குவில் பின்னர் இயேசு ஒப்படைக்கப்படுவதை விவரிக்கும் அதே சொல்லோட்டத்துடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: Ἰωάννην
  choice: யோவான்
  rationale: Ἰωάννης என்ற நபர்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: ἦλθεν
  choice: வந்து
  rationale: ἔρχομαι என்பதன் இயக்கப் பொருளை இயல்பான தமிழ் வாக்கியத் தொடரில் ‘வந்து’ என வழங்குகிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: εἰς குறிக்கும் கலிலேயாவை நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: κηρύσσων
  choice: அறிவித்தார்
  rationale: κηρύσσω குறிக்கும் பொதுவான, வெளிப்படையான பிரகடனத்தை எளிதில் புரியும் தமிழில் தருகிறது; ‘பிரசங்கித்தார்’ என்று சமயச் சொற்பயன்பாட்டுக்குள் மட்டும் குறுக்கவில்லை.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் ‘நல்ல செய்தி’ என்ற சொற்பொருளை இயல்பாகவும், தமிழில் பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாகவும் வழங்குகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: கிரேக்க உரையின் உரிமை/தொடர்பைக் குறிக்கும் விரிவான பிறப்புவேற்றுமையைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது; அது கடவுளிடமிருந்து வரும் செய்தியா, கடவுளுக்குரிய செய்தியா, கடவுளை மையமாகக் கொண்ட செய்தியா என்பதை முதன்மை உரைத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: மாற்குவில் மீண்டும் வரும் παραδίδωμι சொல்லுக்கும் இயேசுவின் பாடுகளுக்கும் உள்ள கதைத் தொடர்பு
  choice: ஒப்படைக்கப்பட்ட
  alternative: கைதுசெய்யப்பட்ட
  rationale: ‘கைதுசெய்யப்பட்ட’ என்பது சூழலில் பொருத்தமான விளக்கமாக இருந்தாலும், ‘ஒப்படைக்கப்பட்ட’ என்பது மூலச்சொல்லின் பரந்த பொருளையும், பின்னர் இயேசு ஒப்படைக்கப்படுவது பற்றிய மாற்குவின் சொல்லோட்டத் தொடர்பையும் பாதுகாக்கிறது.
- issue: τὸ εὐαγγέλιον τοῦ θεοῦ என்பதில் τοῦ θεοῦ-வின் பொருள்
  choice: கடவுளின் நற்செய்தி
  alternative: கடவுளிடமிருந்து வரும் நற்செய்தி / கடவுளைப் பற்றிய நற்செய்தி
  rationale: கிரேக்கப் பிறப்புவேற்றுமை ஒன்றோடொன்று தொடர்புடைய பல பொருள்களை அனுமதிக்கிறது. அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுக்காமல் முதன்மை உரை அதன் பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தி’ தெளிவுக்காக முதன்மை உரையில் வைக்கப்பட்டு, மரபான ‘சுவிசேஷம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. மூலத்தின் இறையியல் மற்றும் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
