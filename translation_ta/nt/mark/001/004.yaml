source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: ta
  text: திருமுழுக்கு கொடுக்கும் யோவான்[a] வனாந்தரத்தில் தோன்றி, பாவங்கள் மன்னிக்கப்படுவதற்கான மனந்திரும்புதலின் திருமுழுக்கை அறிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமுழுக்கு அளிப்பவரான யோவான் வனாந்தரத்தில் தோன்றி…” கிரேக்கப் பங்கேற்புவினையை யோவானின் பட்டப்பெயராகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: தோன்றி
  rationale: மாற்கு இங்கு ஒரு புதிய நபரை நிகழ்வுக் களத்தில் அறிமுகப்படுத்தும் விதத்தில் இந்த வினைச்சொல்லைப் பயன்படுத்துகிறார். ‘தோன்றி’ என்பது ‘உண்டானார்’ என்ற இயல்பற்ற சொற்பொருள் மொழிபெயர்ப்பைத் தவிர்த்து அந்தக் கதைநடை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ὁ βαπτίζων
  choice: திருமுழுக்கு கொடுக்கும்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட கிரேக்க நிகழ்காலப் பங்கேற்புவினை, யோவானை அவர் செய்துவந்த திருமுழுக்குப் பணியால் அடையாளப்படுத்துகிறது. இந்தத் தெளிவான வினைத் தொடர் நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: மக்கள் குடியிராத பாழ்நிலப் பகுதியைக் குறிக்கிறது; மணற்பாலை என்று தேவையின்றிக் குறிப்பாக்காமல், வேதாகமச் சூழலின் ஒலிப்பையும் காக்கிறது.
- source_word: κηρύσσων
  choice: அறிவித்தார்
  rationale: ஒரு தூதுவர் பொதுவாகப் பிரகடனம் செய்வதுபோன்ற κηρύσσω என்பதன் வலிமையை, திருச்சபை வழக்குக்கு மட்டும் கட்டுப்படுத்தாமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: கிறிஸ்தவச் சடங்கைக் குறிக்கும் அறியப்பட்ட, நவீனமான தமிழ்ச் சொல்; ‘கழுவுதல்’ என்று பொதுமைப்படுத்துவதையும் செய்முறையை மட்டும் வலியுறுத்துவதையும் தவிர்க்கிறது.
- source_word: μετανοίας
  choice: மனந்திரும்புதலின்
  rationale: இந்தப் பெயர்ச்சொல் மனம், நோக்கம், வாழ்க்கைத் திசை ஆகியவற்றில் கடவுளை நோக்கித் திரும்பும் ஒழுக்க மற்றும் ஆன்மிகப் பொருளைக் காக்கிறது. உடைமை வேற்றுமை, திருமுழுக்கும் மனந்திரும்புதலுக்கும் உள்ள உறவை மூலத்தைவிட அதிகமாக விளக்கித் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: பாவங்கள் மன்னிக்கப்படுவதற்கான
  rationale: εἰς கூறும் நோக்கம் அல்லது விளைவு சார்ந்த உறவை இயல்பான தமிழில் தருகிறது; திருமுழுக்கு கருவியா, அடையாளமா, அறிவிப்பா என்ற பிற்காலக் கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை. கிரேக்கத்தில் உள்ள ‘பாவங்கள்’ என்ற பன்மையும் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: திருமுழுக்கு, மனந்திரும்புதல், பாவமன்னிப்பு ஆகியவற்றின் உறவு
  choice: ‘பாவங்கள் மன்னிக்கப்படுவதற்கான மனந்திரும்புதலின் திருமுழுக்கு’ என்று உறவைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘மனந்திரும்புதலை அடையாளப்படுத்தும் திருமுழுக்கு’ அல்லது ‘பாவமன்னிப்பைக் கொண்டுவரும் திருமுழுக்கு’
  rationale: கிரேக்கத் தொடர் இம்மூன்றுக்கும் உறவை ஏற்படுத்துகிறது; ஆனால் திருமுழுக்கு வெறும் அடையாளமா, மன்னிப்புக்கான கருவியா, அல்லது மன்னிப்பை அறிவிப்பதா என்பதைத் தெளிவாகத் தீர்மானிப்பதில்லை. ஆகவே மூலத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ், எளிதில் புரியும் கண்ணியமான நடை. ‘ஞானஸ்நானம்’ என்பதற்குப் பதிலாக பரவலாகப் புரியக்கூடிய ‘திருமுழுக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகமச் சூழலின் பொருளைத் தக்கவைத்தாலும் ‘பாலைவனம்’ என அளவுக்கு மீறிக் குறிப்பாக்குவதில்லை.
