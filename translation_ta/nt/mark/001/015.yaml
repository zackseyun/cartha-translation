source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: ta
  text: அவர், “குறிக்கப்பட்ட காலம் நிறைவேறிவிட்டது; கடவுளின் அரசு நெருங்கிவிட்டது[a]. மனந்திரும்புங்கள்; நற்செய்தியை நம்புங்கள்[b]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய ஆட்சி நெருங்கிவிட்டது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சுவிசேஷத்தை நம்புங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: நிறைவேறிவிட்டது
  rationale: முற்றுப்பெற்ற நிகழ்வின் தற்போதைய விளைவை உணர்த்தும் கிரேக்க நிறைவுக்கால வினையின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ καιρὸς
  choice: குறிக்கப்பட்ட காலம்
  rationale: καιρός என்பது பொதுவான காலத்தை மட்டுமல்லாமல் தீர்மானிக்கப்பட்ட அல்லது தக்க தருணத்தையும் இங்கு குறிக்கிறது; தமிழில் தேவையற்ற விரிவுரை இல்லாமல் அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டது
  rationale: நெருங்கி வந்து இப்போது அருகில் இருப்பதைக் காட்டும் நிறைவுக்கால வடிவின் தற்போதைய விளைவைப் பாதுகாக்கிறது; வந்துவிட்டது என்று கூறி முழுமையாக வந்து சேர்ந்ததாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: ஆளுகை மற்றும் அரசுக்குரிய பரப்பு ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய பரந்த, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொற்றொடர்; இயக்கமுள்ள ஆட்சியை மட்டும் வலியுறுத்தவில்லை.
- source_word: μετανοεῖτε
  choice: மனந்திரும்புங்கள்
  rationale: சிந்தனை, மனப்பாங்கு, வாழ்க்கைத் திசை ஆகியவற்றின் தீர்மானமான திருப்பத்தை ஒருங்கே உணர்த்தும் வழக்கமான, கண்ணியமான தமிழ் கட்டளை வடிவம்.
- source_word: πιστεύετε
  choice: நம்புங்கள்
  rationale: πιστεύω என்பதன் கட்டளை வலிமையை நேரடியாகக் காக்கிறது; வெறும் கருத்து ஒப்புதலாகவோ குறிப்பிட்ட கோட்பாட்டு விளக்கமாகவோ குறுக்கவில்லை.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: நற்செய்தியை நம்புங்கள்
  rationale: தமிழில் ‘நம்பு’ இயல்பாக நேரடி செயப்படுபொருளுடன் வருவதால் கிரேக்க முன்னிடைச்சொல்லை சொற்சொல்லாகத் திணிக்காமல் அதன் பொருளை வழங்குகிறது; εὐαγγέλιον என்பதன் அடிப்படைப் பொருளையும் தெளிவாக்குகிறது.
- source_word: λέγων
  choice: என்று கூறினார்
  rationale: முந்தைய வசனத்தின் தொடர்ச்சியான கிரேக்கப் பங்கேற்பு வடிவத்தைத் தனித்து வாசிக்கப்படும் தமிழ்வசனத்தில் இயல்பான உரையாடல் அறிமுகமாக வழங்குகிறது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளுடைய அரசு
  alternative: கடவுளுடைய ஆட்சி
  rationale: ‘அரசு’ என்பது அரசரின் ஆளுகையையும் அவரது அரசுக்குரிய பரப்பையும் உள்ளடக்கும் மூலமொழியின் பரந்த இறையியல் பதற்றத்தைத் தக்கவைக்கிறது; ‘ஆட்சி’ என்ற இயக்கமுள்ள மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: εὐαγγέλιον என்பதன் மொழிபெயர்ப்பு
  choice: நற்செய்தி
  alternative: சுவிசேஷம்
  rationale: மூலச்சொல்லின் பொருளை இன்றைய பொதுவாசகருக்குத் தெளிவாக வழங்குகிறது; திருச்சபை வழக்கிலுள்ள மரபுச் சொல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: μετανοεῖτε καὶ πιστεύετε என்ற கட்டளைகளின் வலிமை
  choice: மனந்திரும்பி, … நம்புங்கள்
  alternative: தொடர்ந்து மனந்திரும்பி, தொடர்ந்து … நம்புங்கள்
  rationale: கிரேக்க நிகழ்காலக் கட்டளைகள் தொடர்ச்சியை உணர்த்தக்கூடும்; ஆனால் அதை வெளிப்படையாகச் சேர்ப்பது வினையம்சத்தை மிகையாகத் தீர்மானிக்கும். எளிய தமிழ் கட்டளை வடிவம் அழைப்பின் அவசரத்தையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான அறிவிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்/ராஜ்யம்’ போன்ற சில மரபுவழிப் பிரிவுசார் சொற்பயன்பாடுகளுக்குப் பதிலாக பொதுவாகப் புரியும் ‘கடவுள்/அரசு’ தேர்ந்தெடுக்கப்பட்டுள்ளது. வசனம் தனியே வாசிக்கப்படும்போதும் தெளிவாக இருக்க ‘அவர்’ சேர்க்கப்பட்டுள்ளது; இது முந்தைய வசனத்தில் இயேசுவைக் குறிக்கும் தொடர்ச்சியை வெளிப்படுத்துகிறது.
