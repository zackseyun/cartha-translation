  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: ta
  text: அவர் தண்ணீரிலிருந்து மேலே வந்துகொண்டிருந்தபோது, உடனே வானங்கள் பிளக்கப்படுவதையும்[a], ஆவியானவர் புறாவைப் போல அவர்மேல்[b] இறங்கி வருவதையும் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானங்கள் கிழிக்கப்படுவதையும்’ என்றும் மொழிபெயர்க்கலாம். இங்கே வரும் வினைச்சொல் வெறுமனே ‘திறப்பது’ என்பதைவிட வலிமையானது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருக்குள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘உள்ளே’ என்று பொருள்படக்கூடும்; ஆனால் ஆவியானவர் இறங்கும் இச்சூழலில் ‘அவர்மேல்’ என்பது இயல்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் விரைவான கதைநடையை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: அவர் தண்ணீரிலிருந்து மேலே வந்துகொண்டிருந்தபோதே
  rationale: நிகழ்காலப் பங்கேற்புவினையின் உடனிகழ்வையும் ἐκ என்பதன் ‘இலிருந்து வெளியே’ என்ற இயக்கத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: எளிய இறந்தகாலப் பார்வை வினையைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: வானங்கள் கிழிந்து திறப்பதையும்
  rationale: வெறுமனே ‘திறந்தன’ என்பதைக் காட்டிலும் σχίζω என்பதின் வலிமையான, நாடகமிக்க படிமத்தைத் தக்கவைக்கிறது; தமிழில் இயல்பாகவும் உள்ளது.
- source_word: τοὺς οὐρανούς
  choice: வானங்கள்
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, அதன் வேதாகமச் சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: இந்தத் திருமுழுக்குச் சூழலில் குறிக்கப்படுவது தெய்வீக ஆவி என்பதைத் தெளிவாக உணர்த்துகிறது; ஆனால் மூலத்தில் இல்லாத ‘பரிசுத்த’ என்ற அடைமொழியைச் சேர்க்கவில்லை.
- source_word: ὡς περιστερὰν
  choice: புறாவைப் போல
  rationale: ஒப்பீட்டை மட்டும் வெளிப்படுத்தி, அது உருவத்தையா, இறங்கிய விதத்தையா, இரண்டையுமா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: καταβαῖνον
  choice: இறங்கி வருவதையும்
  rationale: தொடர்ந்து நிகழும் இறங்குதலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἰς αὐτόν
  choice: அவர்மேல்
  rationale: ஆவியானவர் இறங்கும் இச்சூழலில் இயல்பான பொருளைத் தருகிறது; εἰς என்பதற்குச் சாத்தியமான ‘அவருக்குள்’ என்ற வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஆவி’ என்பதன் குறிப்பு
  choice: தெய்வீக ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: ‘பரிசுத்த ஆவியானவர்’ அல்லது ‘ஆவி’
  rationale: சூழல் கடவுளுடைய ஆவியைக் குறித்தாலும், கிரேக்கம் ‘பரிசுத்த’ என்று வெளிப்படையாகச் சொல்லவில்லை. எனவே அந்த அடைமொழி சேர்க்கப்படவில்லை; தமிழில் தெய்வீகக் குறிப்பை இயல்பாக உணர்த்த ‘ஆவியானவர்’ பயன்படுத்தப்பட்டுள்ளது.
- issue: புறா ஒப்பீட்டின் துல்லியமான அம்சம்
  choice: ‘புறாவைப் போல’ என்று மட்டும் கூறி ஒப்பீட்டின் அம்சத்தைத் திறந்தவாறு வைத்தல்
  alternative: ஆவியானவர் புறாவின் உருவம் எடுத்தார்; அல்லது புறாவைப் போல மென்மையாக இறங்கினார்
  rationale: ὡς περιστερὰν உருவம், இயக்கம் அல்லது வேறு ஒற்றுமை ஆகியவற்றில் எதைச் சுட்டுகிறது என்று மூலவாக்கியம் விளக்கவில்லை; அந்த உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: εἰς αὐτόν என்பதன் திசைநிலை
  choice: ‘அவர்மேல்’
  alternative: ‘அவருக்குள்’
  rationale: ஆவியானவர் இறங்குவது பற்றிய வழக்காற்றில் ‘அவர்மேல்’ என்பது சூழலுக்கு நன்றாகப் பொருந்துகிறது; இருப்பினும் εἰς என்பதன் நேரடியான ‘உள்ளே’ சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. ‘வானங்கள்’ என்ற பன்மையும், வலிமையான கிழிதல் படிமமும், புறா ஒப்பீட்டின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில உரையில் அடிக்குறி குறியீடுகள் தொடர்புடைய சொற்றொடர்களோடு பொருந்தாமல் இருந்ததால், [a] வானங்கள் கிழிவதற்கும் [b] ‘அவர்மேல்’ என்பதற்கும் பொருத்தப்பட்டுள்ளன.
