source:
  edition: SBLGNT
  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: ta
  text: உடனே ஆவியானவர் அவரை வனாந்தரத்திற்குள் தள்ளினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வனாந்தரத்திற்குள் அவரை வெளியே தள்ளினார்’ அல்லது ‘அவரை அனுப்பினார்.’ கிரேக்க வினை வலிமைமிக்கது; பேய்களை வெளியே தள்ளுவதைக் குறிக்கவும் மாற்கு இதே வினையை அடிக்கடி பயன்படுத்துகிறார் என்பதை ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழ் கதைநடையில் வசனத் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது இயல்பற்றதாகவோ, மூலத்தில் இல்லாத காலவரிசை விளக்கத்தைச் சேர்ப்பதாகவோ அமையலாம். εὐθὺς உடனான விரைவு நகர்வு ‘உடனே’ என்பதால் தெளிவாகிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் விரைவான கதைநகர்வையும் இச்சொல்லின் அவசரத் தன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: மாற்கு 1:10-ல் சற்றுமுன் குறிப்பிடப்பட்ட தெய்வீக ஆவியையே குறிக்கிறது. ‘பரிசுத்த ஆவியானவர்’ என்று மூலத்தில் இல்லாத அடைமொழியைச் சேர்க்காமல், தமிழில் நபர்தன்மையையும் மரியாதையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள்; மரியாதை ஒருமை தமிழில் பொருத்தமானது.
- source_word: ἐκβάλλει
  choice: துரத்தி அனுப்பினார்
  rationale: வெறுமனே ‘அனுப்பினார்’ அல்லது ‘வழிநடத்தினார்’ என்பதைக் காட்டிலும் வினையின் வலிமையைப் பேணுகிறது. அதேவேளை, தமிழில் ‘துரத்தினார்’ மட்டும் பகைமை அல்லது அங்கிருந்து விரட்டுதல் என்ற தேவையற்ற பொருளை மிகைப்படுத்தக்கூடும்; இணைந்த சொற்றொடர் வலிமையையும் இலக்கிடப்பட்ட அனுப்புதலையும் தருகிறது.
- source_word: εἰς τὴν ἔρημον
  choice: வனாந்தரத்திற்கு
  rationale: மக்கள் குடியிராத பாழ்வெளியைச் சுட்டுகிறது; மணற்பாலையை மட்டும் மனதில் வரவழைக்கும் ‘பாலைவனம்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பரப்பையும் வேதாகமச் சூழலையும் காக்கிறது.
theological_decisions:
- issue: இயேசுவின்மீது ஆவியானவரின் செயலின் வலிமை
  choice: ‘துரத்தி அனுப்பினார்’ என்று வலிமையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வழிநடத்தினார்’ அல்லது ‘அனுப்பினார்’
  rationale: ἐκβάλλει என்பது வலிமைமிக்க வினை. பிற நற்செய்தி நூல்களின் மென்மையான சொற்களோடு ஒத்திசைக்காமல், இயேசுவின் வனாந்தரச் சோதனை தெய்வீக முன்முயற்சியைத் தொடர்ந்து நிகழ்கிறது என்ற இறையியல் அழுத்தத்தையும் உரையின் பதற்றத்தையும் இது பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வனாந்தரம்’ என்பது வேதாகமத் தமிழில் பரிச்சயமானதாய் இருந்து, இங்கு குறிக்கப்படும் குடியிராத பாழ்வெளியைத் துல்லியமாகக் காட்டுகிறது. இறந்தகாலம் தமிழ் கதைநடைக்கு இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது; கிரேக்க வரலாற்று நிகழ்காலத்தின் உடனடித் தன்மை ‘உடனே’ என்பதால் பேணப்படுகிறது.
