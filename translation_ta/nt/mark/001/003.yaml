source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: ta
  text: '“பாலைவனத்தில் உரக்கக் கூப்பிடுகிற ஒருவரின் குரல்: ‘ஆண்டவரின்[a] வழியை ஆயத்தப்படுத்துங்கள்; அவருடைய பாதைகளை நேராக்குங்கள்.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆண்டவர்’ என்பது கிரேக்க kyriou என்பதன் மொழிபெயர்ப்பு. இந்த மேற்கோள் ஏசாயா 40:3-ஐ எதிரொலிக்கிறது; அங்கே எபிரெய உரை ஆண்டவரின் தனிப்பெயரான YHWH-ஐக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: 'ஏசாயா மேற்கோளுக்கு வேறுவிதமாக நிறுத்தக்குறியிடும்போது: “உரக்கக் கூப்பிடுகிற ஒருவரின் குரல்: ‘பாலைவனத்தில் ஆண்டவரின் வழியை ஆயத்தப்படுத்துங்கள் …’” என்றும் மொழிபெயர்க்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ
  choice: குரல்
  rationale: இங்கு φωνή என்பது மேற்கோளை அறிமுகப்படுத்தும் ‘குரல்’ என்ற பொருளில் வருகிறது. தமிழில் இயல்பாகச் சொல்ல வாக்கிய அமைப்பு மாற்றப்பட்டுள்ளது.
- source_word: βοῶντος
  choice: உரக்கக் கூப்பிடுகிற ஒருவரின்
  rationale: φωνὴ என்பதுடன் தொடர்புடைய இந்தப் பங்கெச்சம் வலிமையாக அறிவிக்கும் ஒருவரைக் குறிக்கிறது; ‘உரக்கக் கூப்பிடுகிற’ என்பது அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: பாலைவனத்தில்
  rationale: ἔρημος என்பது பாலைவனம் அல்லது மக்கள் வாழாத வனாந்தரப் பகுதியைக் குறிக்கலாம். மாற்கு நூலின் சூழலிலும் ஏசாயா மேற்கோளிலும் ‘பாலைவனம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: Ἑτοιμάσατε
  choice: ஆயத்தப்படுத்துங்கள்
  rationale: தீர்மானமான ஆயத்தத்தை வேண்டுகிற பன்மை கட்டளை வடிவத்தை இது தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: τὴν ὁδὸν
  choice: வழியை
  rationale: ὁδός என்பதன் நேரடியான பாதை உருவகத்தையும் தீர்க்கதரிசன உருவகப் பொருளையும் ‘வழி’ தக்கவைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதற்கு நவீனத் தமிழில் வழக்கமான மரியாதைத் தலைப்பான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது; வேற்றுமைத் தொடர்பும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: εὐθείας
  choice: நேராக்குங்கள்
  rationale: εὐθείας என்பது இங்கு ஒழுக்கரீதியான நேர்மையை அல்ல, பாதைகளை வளைவில்லாமல் நேராகச் செய்வதைக் குறிக்கிறது.
- source_word: ποιεῖτε
  choice: நேராக்குங்கள்
  rationale: ποιεῖτε மற்றும் εὐθείας ஆகியவை தமிழில் இயல்பாக ஒரே வினையான ‘நேராக்குங்கள்’ என்பதில் வெளிப்படுகின்றன.
- source_word: τὰς τρίβους αὐτοῦ
  choice: அவருடைய பாதைகளை
  rationale: τρίβος என்பதன் பாதை அல்லது தடம் என்ற பொருளையும் மூலத்தின் பன்மையையும் αὐτοῦ குறிக்கும் உறவையும் இந்த மொழிபெயர்ப்பு தக்கவைக்கிறது.
theological_decisions:
- issue: எபிரெய ஏசாயா மேற்கோளில் YHWH-ஐக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: முதன்மை உரை கிரேக்க κύριος என்பதையே ‘ஆண்டவர்’ என்று மொழிபெயர்க்கிறது. ஏசாயா 40:3-இன் எபிரெய மூலத்தில் இது YHWH-ஐக் குறிக்கும் பின்னணி அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது; அதை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: ‘பாலைவனத்தில்’ என்ற சொற்றொடரின் தொடர்பு
  choice: உரக்கக் கூப்பிடுகிற ஒருவருடன் இணைத்தல்
  alternative: ‘ஆண்டவரின் வழியை ஆயத்தப்படுத்துங்கள்’ என்ற கட்டளையுடன் இணைத்தல்
  rationale: மாற்குவின் கிரேக்கச் சொற்றொடர் அமைப்பில் இது கூப்பிடுகிறவருடன் இயல்பாக இணைகிறது. இருப்பினும் ஏசாயா மேற்கோளுக்கான மாற்று நிறுத்தக்குறியீடு வேறு தொடர்பைத் தருவதால், அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘ஆயத்தப்படுத்துங்கள்’ தீர்க்கதரிசனக் கட்டளையின் உயர்ந்த தொனியைத் தக்கவைக்கிறது; மாற்று நிறுத்தக்குறியீடும் தெய்வீகப் பெயரின் எபிரெயப் பின்னணியும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
