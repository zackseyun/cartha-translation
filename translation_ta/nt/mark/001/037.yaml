  register: நவீன, இயல்பான, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் மூன்றாம் நபர் வடிவங்களில் ‘அவர்’ என்றும், அவரிடம் நேரடியாகப் பேசும்போது மரியாதை ஒருமை ‘உம்மை’ என்றும் வழங்கப்பட்டுள்ளது.
