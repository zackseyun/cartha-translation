  text: καὶ ⸂εὗρον αὐτὸν καὶ⸃ λέγουσιν αὐτῷ ὅτι Πάντες ⸂ζητοῦσίν σε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: ta
  text: அவர்கள் அவரைக் கண்டுபிடித்து, அவரிடம், “எல்லாரும் உம்மைத் தேடிக்கொண்டிருக்கிறார்கள்”[a] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாரும் உம்மை நாடிக்கொண்டிருக்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் தேடுதல் அல்லது நாடுதல் என இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்; இச்சூழலில் மக்கள் இயேசு இருக்கும் இடத்தைக் கண்டுபிடிக்க முயல்வதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: கண்டுபிடித்து
  rationale: தேடலின் வெற்றிகரமான முடிவை இறந்தகால வினை வடிவம் குறிக்கிறது; தமிழில் ‘கண்டுபிடித்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: λέγουσιν
  choice: என்றார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்கள்’ இயல்பானது.
- source_word: ὅτι
  choice: நேர்க் கூற்றுக்கான மேற்கோள் குறிகள்
  rationale: ὅτι இங்கு நேர்க் கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோள் குறிகளும் ‘என்றார்கள்’ என்பதும் இதை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: Πάντες
  choice: எல்லாரும்
  rationale: சூழலில் இயேசுவைத் தேடும் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; ‘எல்லாரும்’ நவீனத் தமிழில் இயல்பான கூட்டு வெளிப்பாடு.
- source_word: ζητοῦσίν σε
  choice: உம்மைத் தேடிக்கொண்டிருக்கிறார்கள்
  rationale: ζητέω என்பதன் அடிப்படைப் பொருளான ‘தேடுதல்’ பாதுகாக்கப்படுகிறது; தொடரும் முயற்சியை ‘தேடிக்கொண்டிருக்கிறார்கள்’ இயல்பாகக் காட்டுகிறது. சூழலில் இது இயேசுவைக் கண்டுபிடிக்க முயல்வதைக் குறிக்கிறது.
- source_word: καὶ
  choice: -த்து
  rationale: முதல் καί-யின் இணைப்புப் பொருள் தமிழ் தொடர் வினையெச்சமான ‘கண்டுபிடித்து’ என்பதில் இயல்பாக வெளிப்படுகிறது; கிரேக்க அமைப்பைச் செயற்கையாக நகலெடுக்கவில்லை.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: அவரை / அவரிடம் / உம்மை
  rationale: வேற்றுமைச் செயல்பாடுகளுக்கேற்ப நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன; இயேசுவிடம் பேசும் இடத்தில் மரியாதை ஒருமையான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது.
