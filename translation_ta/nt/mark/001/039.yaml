source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: ta
  text: அவர் கலிலேயா முழுவதும் சென்று[a], அவர்களுடைய தொழுகைக்கூடங்களில் பிரசங்கித்துத் தீய ஆவிகளை வெளியேற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் வந்து, கலிலேயா முழுவதும் உள்ள அவர்களுடைய தொழுகைக்கூடங்களில் பிரசங்கித்துத் தீய ஆவிகளை வெளியேற்றினார்.’ கிரேக்க வினைச்சொல்லை ‘வந்து’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் இச்சூழலில் அது அந்தப் பகுதி முழுவதும் இடம்விட்டு இடம் சென்றதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: சென்று
  rationale: ἔρχομαι என்பதன் இந்த இறந்தகால வடிவம் தனியாக ‘வந்தார்’ என்று பொருள்படக்கூடும். ஆனால் கலிலேயா முழுவதையும் குறிக்கும் தொடரும், தொடர்ந்து வரும் நிகழ்காலப் பங்கேற்பு வினைகளும் இங்கு இடம்விட்டு இடம் சென்ற ஊழியப் பயணத்தைச் சுட்டுவதால், தமிழில் ‘சென்று’ என்பது இயல்பானது. சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κηρύσσων
  choice: பிரசங்கித்து
  rationale: κηρύσσω என்பது பொதுமக்களிடம் வெளிப்படையாக அறிவிப்பதைக் குறிக்கிறது. தொழுகைக்கூடச் சூழலில் ‘பிரசங்கித்து’ என்பது இயல்பாகவும் மூலத்தின் அறிவிப்புச் செயலுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: அவர்களுடைய தொழுகைக்கூடங்களில்
  rationale: εἰς என்பதற்கு அடிப்படையில் ‘உள்ளே/நோக்கி’ என்ற பொருள் இருந்தாலும், இங்கு நடைபெறும் செயலின் இடத்தைச் சுட்டுகிறது. συναγωγή என்பதை நவீன வாசகர்களுக்குப் புரியும் வகையில் ‘தொழுகைக்கூடம்’ என்றும், αὐτῶν என்பதை ‘அவர்களுடைய’ என்றும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: கலிலேயா பகுதி முழுவதும்
  rationale: இரண்டாவது εἰς, ὅλην உடன் சேர்ந்து பயணத்தின் பரப்பைச் சுட்டுகிறது. ‘பகுதி முழுவதும்’ என்பது பிரதேசம் முழுவதும் சென்றதைக் கருத்துச் சேர்க்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὰ δαιμόνια
  choice: பேய்களை
  rationale: δαιμόνια என்பது தீய ஆவிக்குரிய ஆளுமைகளைக் குறிக்கும் நேரடியான சொல். நவீன பொதுத் தமிழில் ‘பேய்கள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது; கிரேக்கப் பன்மை இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἐκβάλλων
  choice: விரட்டினார்
  rationale: பேயோட்டும் சூழலில் ἐκβάλλω என்பது வெளியேற்றுதல் அல்லது விரட்டுதல் என்று பொருள். ‘விரட்டினார்’ இயல்பான தற்போதைய தமிழில் இயேசு அவற்றை வெளியேற்றிய செயலைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: δαιμόνια என்பவற்றின் இயல்பு
  choice: தனித்த ஆவிக்குரிய தீய ஆளுமைகளைக் குறிக்கும் ‘பேய்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: தீய ஆவிகள்
  rationale: மூலச்சொல்லின் நேரடி இணையாக ‘பேய்கள்’ அமைகிறது. அவற்றின் இயல்பைப் பற்றி வசனம் கூறுவதற்கும் மேற்பட்ட கோட்பாட்டு விளக்கத்தை இது சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொழுகைக்கூடம்’ என்பது synagogue என்பதன் வரலாற்றுச் சூழலை தேவையற்ற சமயப் பிரிவுச் சொற்கள் இன்றி தெரிவிக்கிறது. பங்கேற்பு வினைகளின் தொடரை இயல்பான தமிழ் வினைத்தொடராக அமைத்துள்ளோம்; ἦλθεν என்பதிலுள்ள ‘வந்தார்/சென்றார்’ தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
