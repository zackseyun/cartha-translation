  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: ta
  text: “நாசரேயனாகிய இயேசுவே[b], எங்களுக்கும் உமக்கும் என்ன தொடர்பு?[a] எங்களை அழிக்க வந்தீரா? நீர் யார் என்று எனக்குத் தெரியும்—நீர் கடவுளின் பரிசுத்தர்” என்று அது சொன்னது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்கும் உமக்கும் என்ன இருக்கிறது?” இந்தக் கிரேக்க மரபுத்தொடர் விலகல் அல்லது பகைமையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாசரேத்தைச் சேர்ந்த இயேசுவே.” கிரேக்கத்தில், “நாசரேயனாகிய இயேசுவே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ἡμῖν καὶ σοί
  choice: எங்களுக்கும் உமக்கும் என்ன தொடர்பு?
  rationale: ‘எங்களுக்கு என்ன, உமக்கு என்ன’ என்று சொற்சொல்லாக மொழிபெயர்த்தால் இன்றைய தமிழில் பொருள் தெளிவாகாது. இத்தொடர் விலகல் அல்லது எதிர்ப்பை வெளிப்படுத்தும் மரபுத்தொடர் என்பதால், அதன் உறவுநீக்கும் வலிமையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: நாசரேயனாகிய இயேசுவே
  rationale: Ναζαρηνέ என்பது விளிவேற்றுமையில் வரும் அடைமொழி. ‘நாசரேயன்’ என்ற வடிவம் கிரேக்கக் கட்டமைப்பை நெருக்கமாகப் பாதுகாக்கிறது; இடப்பெயர் சார்ந்த இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦλθες
  choice: வந்தீரா
  rationale: வருகையையும் அதன் தற்போதைய நோக்கையும் நேரடியான தமிழ்க் கேள்வியாக வெளிப்படுத்துகிறது.
- source_word: ἀπολέσαι
  choice: அழிக்க
  rationale: இந்தப் பேயோட்டும் சூழலில் ἀπόλλυμι குறிக்கும் அழிவு அல்லது ஒழிப்பை நேரடியாகத் தருகிறது.
- source_word: ἡμᾶς
  choice: எங்களை
  rationale: மூலத்தின் முதலாவது நபர் பன்மையைப் பாதுகாக்கிறது; பேசுபவன் தன்னை ஒரு பன்மையோடு இணைத்துக் கூறும் பதற்றத்தைத் தீர்த்து விளக்கவில்லை.
- source_word: οἶδά σε τίς εἶ
  choice: நீர் யார் என்று எனக்குத் தெரியும்
  rationale: அடையாளம் அறிந்திருப்பதாகச் சொல்லும் கூற்றை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: கடவுளின் பரிசுத்தர்
  rationale: கிரேக்கத்தில் பட்டப்பெயராகச் செயல்படும் ஒருமை வடிவத்தையும் τοῦ θεοῦ என்ற உரிமை/உறவு அமைப்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: λέγων
  choice: என்று அது சொன்னது
  rationale: முந்தைய வசனத்திலுள்ள அசுத்த ஆவியைச் சார்ந்த பங்கேற்புவினையை, தனி வசனமாகவும் புரியுமாறு இயல்பான தமிழ் வாக்கிய முடிவாக அளிக்கிறது.
theological_decisions:
- issue: பேய் இயேசுவை அடையாளம் காணும்போது பயன்படுத்தும் கிறிஸ்துவியல் பட்டப்பெயர்
  choice: கடவுளின் பரிசுத்தர்
  alternative: கடவுளுடைய பரிசுத்தமானவர்
  rationale: இதை முழுமையான கோட்பாட்டு அறிக்கையாக விரித்துரைக்காமல், மூலத்தில் உள்ள வலிமையான பட்டப்பெயராகவே பாதுகாக்கிறது.
- issue: பேசுபவனின் ஒருமையும் அவன் குறிப்பிடும் பன்மையும்
  choice: ‘எங்களை’ என்ற பன்மையையும் ‘எனக்குத் தெரியும்’ என்ற ஒருமையையும் அப்படியே பாதுகாத்தல்
  alternative: இரண்டையும் ஒருமையாகவோ பன்மையாகவோ ஒருமைப்படுத்துதல்
  rationale: மூலத்தில் ἡμᾶς பன்மையாகவும் οἶδα முதலாவது நபர் ஒருமையாகவும் உள்ள பதற்றத்தை விளக்கி நீக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமக்கும்’, ‘வந்தீரா’, ‘நீர்’ பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
