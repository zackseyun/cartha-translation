lexical_decisions:
- source_word: κατεδίωξεν
  choice: தீவிரமாகத் தேடிப் பின்தொடர்ந்தார்கள்
  rationale: καταδιώκω என்பது வெறுமனே தேடுவதைவிட முனைப்புடன் தேடிச் செல்வதையோ பின்தொடர்வதையோ குறிக்கக்கூடும். தமிழில் இயல்பாகவும் அதன் வலிமையை வெளிப்படுத்தவும் இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: உடனடி சூழலில் இந்தப் பதிலிப்பெயர் இயேசுவைக் குறிக்கிறது; மரியாதை ஒருமையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Σίμων
  choice: சீமோன்
  rationale: கிரேக்கப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ μετ’ αὐτοῦ
  choice: அவரோடு இருந்தவர்கள்
  rationale: ‘அவரோடு இருந்தவர்கள்’ என்பது மூலத்தின் பொதுவான சொல்லாட்சியைப் பேணுகிறது; ‘தோழர்கள்’ போன்ற கூடுதல் உறவுவிளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: கிரேக்க இணைப்பைத் தமிழின் இயல்பான இணைப்பு அமைப்பில் வெளிப்படுத்துகிறது; மாற்கு நற்செய்தியின் தொடர்ச்சியான கதைநடையையும் பேணுகிறது.
