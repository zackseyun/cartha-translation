source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நாம் வேறிடங்களான அருகிலுள்ள சிற்றூர்களுக்குப் போவோம்; அங்கேயும் நான் பிரசங்கிக்கும்பொருட்டு. ஏனெனில், இதற்காகத்தான் நான் புறப்பட்டேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதற்காகத்தான் நான் வெளியே வந்தேன்” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் இயேசு அப்போதைய இடத்தைவிட்டு வெளியேறியதையோ, இன்னும் பரந்த பொருளில் பிரசங்கிக்கப் புறப்பட்ட அவருடைய நோக்கத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: நாம் ... போவோம்
  rationale: முதல் நபர் பன்மை ஏவல் சார்ந்த துணைவினையின் அழைப்புத் தன்மையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀλλαχοῦ
  choice: வேறிடத்திற்கு
  rationale: தற்போதைய இடத்திலிருந்து வேறு இடத்திற்குச் செல்வதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐχομένας
  choice: அருகிலுள்ள
  rationale: அடுத்துள்ள அல்லது அண்டிய இடங்கள் என்ற புவியியல் பொருளைப் பாதுகாக்கிறது.
- source_word: κωμοπόλεις
  choice: சிற்றூர்கள்
  rationale: கிராமத்திற்கும் நகரத்திற்கும் இடைப்பட்ட சிறிய குடியிருப்பு மையங்களைக் குறிக்கும் அரிய கூட்டுச்சொல்லுக்கு இயல்பான தமிழ் இணை; வெறும் ‘நகரங்கள்’ என்பது அளவை மிகைப்படுத்தலாம்.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: அங்கேயும் நான் பிரசங்கிக்க வேண்டும்
  rationale: ἵνα கூறும் நோக்கத்தையும் καὶ ἐκεῖ என்பதன் ‘அங்கேயும்’ என்ற வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τοῦτο
  choice: இதற்காகத்தான்
  rationale: நோக்கம் அல்லது காரணத்தை விளக்கும் சொற்றொடரின் வலியுறுத்தலைத் தெளிவாகத் தருகிறது.
- source_word: ἐξῆλθον
  choice: நான் புறப்பட்டு வந்தேன்
  rationale: வெளியேறுதல்/புறப்படுதல் என்ற அடிப்படை உணர்வைத் தக்கவைத்து, தற்போதைய இடத்தைவிட்டு வந்ததா அல்லது பரந்த பிரசங்க நோக்கத்திற்காகப் புறப்பட்டதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: λέγει αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடையில் இறந்தகாலமாக வழங்குகிறது.
theological_decisions:
- issue: ἐξῆλθον என்பதன் குறிப்பு எல்லை
  choice: ‘நான் புறப்பட்டு வந்தேன்’ என்று பொதுவாக மொழிபெயர்த்து இருபொருள் வாய்ப்பையும் தக்கவைத்தல்
  alternative: ‘நான் இங்கிருந்து புறப்பட்டேன்’ அல்லது ‘இந்தப் பணிக்காகவே நான் வந்தேன்’
  rationale: இச்சொல் இயேசு அப்போதைய இடத்திலிருந்து வெளியேறியதைக் குறிக்கலாம்; சூழலில் அவருடைய பரந்த பிரசங்க நோக்கத்தையும் சுட்டலாம். இடம் அல்லது தெய்வீகத் தோற்றம் குறித்த ஒரு விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தாமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. κωμοπόλεις என்பதற்கான இடைநிலை குடியிருப்பு நுணுக்கத்தை ‘சிற்றூர்கள்’ என்பதே முதன்மை உரையில் சுருக்கமாகத் தருகிறது; ஆகவே அதற்கென தனி அடிக்குறிப்பு தேவையில்லை.
