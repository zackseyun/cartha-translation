id: MRK.1.40
reference: Mark 1:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: ta
  text: தொழுநோயால் பாதிக்கப்பட்ட ஒருவர்[a] அவரிடம் வந்து, அவரை மன்றாடி முழங்கால்படியிட்டு, “நீர் விரும்பினால், என்னைத் தூய்மையாக்க உம்மால் முடியும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல், இன்றைய தொழுநோயை மட்டுமல்லாமல் பலவகையான கடுமையான தோல் நோய்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைச் சுத்தமாக்க உம்மால் முடியும்.” இச்சொல் உடல்நல மீட்சியையும் சடங்குசார் அசுத்தத்திலிருந்து தூய்மையாக்கப்படுவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: தொழுநோயால் பாதிக்கப்பட்ட ஒருவர்
  rationale: ஆளைக் குறைபாட்டுடன் அடையாளப்படுத்தாமல், நவீனத் தமிழில் மரியாதையுடன் கூறுகிறது. அதேவேளையில், பண்டைய பயன்பாட்டின் பரந்த நோய்ப்பிரிவை அடிக்குறிப்பு விளக்குகிறது.
- source_word: παρακαλῶν
  choice: மன்றாடி
  rationale: குணம்பெற வேண்டிய சூழலில் உள்ள உருக்கமான வேண்டுகோளை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γονυπετῶν
  choice: முழங்கால்படியிட்டு
  rationale: முழங்காலில் அமரும் உடல் நிலையைக் குறிக்கும் கிரேக்கச் சொல்லைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: Ἐὰν θέλῃς
  choice: நீர் விரும்பினால்
  rationale: எதிர்காலச் செயலைவிட இயேசுவின் விருப்பத்தைச் சார்ந்த நிபந்தனையைப் பாதுகாக்கிறது.
- source_word: δύνασαί
  choice: உம்மால் முடியும்
  rationale: δύναμαι குறிக்கும் ஆற்றல் அல்லது வல்லமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καθαρίσαι
  choice: என்னைத் தூய்மையாக்க
  rationale: வெறும் உடல்நலக் குணப்படுத்துதலாகச் சுருக்காமல், உடல்சார் மீட்சியையும் சடங்குசார் தூய்மையையும் உள்ளடக்கக்கூடிய சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἔρχεται
  choice: வந்து
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழின் இயல்பான தொடர்வினை அமைப்பில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: தோல் நோயின் சூழலில் ‘தூய்மையாக்குதல்’ என்பதன் தன்மை
  choice: என்னைத் தூய்மையாக்க
  alternative: என்னைக் குணமாக்க
  rationale: மூலத்தில் பொதுவான குணப்படுத்துதல் வினைச்சொல் அல்ல, தூய்மையாக்குதல் என்ற வினைச்சொல்லே உள்ளது. எனவே உடல்சார் மீட்புக்கும் சடங்குசார் அசுத்தத்திலிருந்து மீட்புக்கும் இடையிலான பொருள் அழுத்தம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதை ஒருமை வடிவங்களான “நீர்,” “உம்மால்” பயன்படுத்தப்பட்டுள்ளன. நோயுற்ற நபரை இழிவுபடுத்தாத ஆள்முன்னுரிமைச் சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டுள்ளது.
