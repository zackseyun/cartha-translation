  text: Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ ⸀χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: ta
  text: மேசியாவாகிய[b] இயேசுவின் நற்செய்தியின்[a] தொடக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுவிசேஷம்.’ εὐαγγέλιον என்ற கிரேக்கச் சொல் ‘நற்செய்தி’ என்றும், மரபாக ‘சுவிசேஷம்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவாகிய.’ Χριστός என்ற கிரேக்கச் சொல் பட்டமாகப் பயன்படுத்தப்படும்போது ‘மேசியா’ என்று பொருள்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: தொடக்கம்
  rationale: வினையற்ற பெயர்ச்சொல் வடிவிலான கிரேக்கத் தொடக்கத்தை இயல்பான தமிழில் அதே சுருக்கத்துடன் தருகிறது; இதை முழு வாக்கியமாக விரித்தோ, ‘தோற்றம்’ என்று பொருளைக் குறுக்கியோ விடவில்லை.
- source_word: εὐαγγελίου
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் அடிப்படைப் பொருளை இன்றைய வாசகர்களுக்கு நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; மரபான ‘சுவிசேஷம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: χριστοῦ
  choice: மேசியா
  rationale: இங்கு Χριστός இயேசுவின் பட்டமாகச் செயல்படுவதால், பெயரின் ஒரு பகுதிபோல் ‘கிறிஸ்து’ என்று மட்டும் ஒலிபெயர்க்காமல் அதன் மெசியானியப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதை மொழிபெயர்க்கப்பட்ட பட்டமாகத் தருவதா, மரபான பெயர்போன்ற ‘கிறிஸ்து’ வடிவில் தருவதா
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: மாற்கு 1:1-ல் Χριστός இயேசுவை அவரது அபிஷேகம் பெற்ற அரசருக்குரிய பட்டத்தால் அடையாளப்படுத்துகிறது. ‘மேசியா’ அந்தப் பட்டத்தின் யூத மற்றும் வேதப் பின்னணியைத் தக்கவைக்கிறது; மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Ἰησοῦ என்ற பிறப்புவேற்றுமையின் உறவை ‘இயேசுவைப் பற்றிய’ என்று வெளிப்படையாகக் குறுக்குவதா
  choice: இயேசுவின்
  alternative: இயேசுவைப் பற்றிய
  rationale: கிரேக்கப் பிறப்புவேற்றுமை நற்செய்தி இயேசுவைப் பற்றியது என்பதையும், அவரோடு சேர்ந்தது அல்லது அவரிடமிருந்து வருவது என்பதையும் சுட்டக்கூடும். ‘இயேசுவின்’ இந்த இயல்பான பன்முகத் தொடர்பைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான தலைப்புப்போன்ற நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேசியாவாகிய இயேசு’ என்பது தமிழின் இயல்பான பெயரடை அமைப்பாகவும் Χριστός என்பதன் பட்டத்தன்மையைத் தெளிவாகவும் காட்டுகிறது. ‘இயேசுவின்’ என்பது மூலத்தின் பிறப்புவேற்றுமை உறவிலுள்ள உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
