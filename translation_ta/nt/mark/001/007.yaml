source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: ta
  text: 'அவர் இவ்வாறு அறிவித்து வந்தார்: “என்னைவிட வலிமைமிக்கவர் எனக்குப் பின் வருகிறார்.[a] குனிந்து அவருடைய செருப்புகளின் வாரை அவிழ்ப்பதற்கு நான் தகுதியானவன் அல்ல.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எனக்குப் பின்” என்பது “எனக்குப் பின்னால்” என்றும் பொருள்படலாம்; இங்கு காலவரிசை அல்லது தொடர்வரிசை முதன்மையாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தகுதியானவன்” என்பதற்குப் பதிலாக “தகுந்தவன்,” “போதுமானவன்” அல்லது “திறனுடையவன்” என்றும் மொழிபெயர்க்கலாம்; இச்சொற்றொடர் வருகிறவருக்கு முன் யோவானின் ஆழ்ந்த தகுதியின்மையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: அறிவித்து வந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வினையானது தொடர்ந்து அல்லது மீண்டும் மீண்டும் நிகழ்ந்த அறிவிப்பைக் குறிக்கிறது; ‘அறிவித்து வந்தார்’ என்பது κηρύσσω என்பதன் பொதுமக்களுக்கான பிரகடனத் தன்மையையும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: λέγων
  choice: இவ்வாறு
  rationale: முதன்மை வினையுடன் இணைந்து நேர்கூற்றை அறிமுகப்படுத்தும் பங்கேற்புவினையை, தமிழில் இயல்பாக ‘இவ்வாறு’ என்று வழங்குகிறது.
- source_word: Ἔρχεται
  choice: வருகிறார்
  rationale: நிகழ்கால வடிவம் வருகையின் உடனடித் தன்மையை வெளிப்படுத்துகிறது; மரியாதை ஒருமை இயேசுவைக் குறிக்கும் சூழலுக்கு ஏற்ற இயல்பான தமிழாகும்.
- source_word: ὁ ἰσχυρότερός μου
  choice: என்னைவிட வலிமைமிக்கவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒப்புமை உரிச்சொல்லின் நேரடியான பொருளைத் தெளிவாகத் தருகிறது; ‘வல்லவர்’ என்ற உயர்நடைச் சொல்லைவிட இது நவீன வாசகருக்கு உடனடியாகப் புரியும்.
- source_word: ὀπίσω μου
  choice: எனக்குப் பின்
  rationale: இச்சூழலில் இடத்தையும் காலத்தையும் அல்லது தொடர்வரிசையையும் சுட்டக்கூடிய கிரேக்கச் சொல்லின் இயல்பான இருபொருள் வாய்ப்பைத் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: ἱκανὸς
  choice: தகுதியானவன்
  rationale: இங்கு வெறும் திறன் அல்லது போதுமான தன்மை அல்லாமல், வருகிறவருக்கு முன் யோவான் தன்னைத் தகுதியற்றவராகக் கருதும் பணிவைச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: κύψας
  choice: குனிந்து
  rationale: செருப்பு வாரை அவிழ்ப்பதற்கு முன் அல்லது அதனுடன் நிகழும் உடல் தாழ்த்தும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λῦσαι
  choice: அவிழ்ப்பதற்கு
  rationale: செருப்பின் வாரைப் பற்றிய சூழலில் λύω என்பதற்கான இயல்பான நவீனத் தமிழ் வினை ‘அவிழ்’ ஆகும்.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: அவருடைய செருப்புகளின் வாரை
  rationale: ἱμάντα என்பது செருப்பைக் கட்டும் தோல் வாரைக் குறிக்கிறது; பண்டைய காலணியை ‘செருப்புகள்’ என்றும் அதன் கட்டுப்பகுதியை ‘வார்’ என்றும் வழங்குவது தெளிவும் வரலாற்றுப் பொருத்தமும் உடையது.
theological_decisions:
- issue: யோவானின் தாழ்மையின் தன்மை
  choice: நான் தகுதியானவன் அல்ல
  alternative: எனக்குத் திறன் இல்லை / நான் போதுமானவன் அல்ல
  rationale: ἱκανός திறன் அல்லது போதுமான தன்மையையும் குறிக்கலாம்; ஆனால் இங்குள்ள தாழ்ந்த அடிமைப்பணியோடு தொடர்புடைய ஒப்பீடு, வருகிறவருக்கு முன் யோவானின் ஆழ்ந்த தகுதியின்மையை முதன்மையாக வெளிப்படுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ὀπίσω μου என்பதன் நுணுக்கம்
  choice: எனக்குப் பின்
  alternative: எனக்குப் பின்னால்
  rationale: ‘எனக்குப் பின்’ என்பது காலவரிசை அல்லது பணித் தொடர்ச்சியைக் குறிக்கும் முதன்மைச் சூழல்பொருளைத் தருவதோடு, மூலத்தில் இருக்கக்கூடிய இடவியல் நிழலையும் முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் அதேவேளை கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அறிவித்து வந்தார்’ தொடர்ச்சியான செயலைக் காட்டுகிறது; ‘செருப்புகளின் வார்’ பண்டைய பொருளைத் தெளிவாக வழங்குகிறது. தேவையற்ற சமயக் குழுசார் சொற்களும் மிக உயர்நடைச் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
