source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: ta
  text: 'இறைவாக்கினரான ஏசாயாவின் நூலில்[a] எழுதப்பட்டுள்ளபடியே: “இதோ, நான் என் தூதனை உனக்கு முன்னே[c] அனுப்புகிறேன்; அவன் உன் வழியை ஆயத்தப்படுத்துவான்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “இறைவாக்கினரான ஏசாயாவின் நூலில்” என்பதற்குப் பதிலாக “இறைவாக்கினர்களின் நூல்களில்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: இந்த மேற்கோள் மல்கியா 3:1 மற்றும் ஏசாயா 40:3 ஆகியவற்றின் சொற்களை இணைக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “உனக்கு முன்பாக.” சொற்படி, “உன் முகத்திற்கு முன்பாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: எழுதப்பட்டுள்ளபடியே
  rationale: ஒப்புமையையும் தொடர்ச்சியையும் இயல்பான தமிழில் காட்டுகிறது; γέγραπται என்பதுடன் இணைந்து வரும் கிரேக்கத் தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: முற்காலத்தில் எழுதப்பட்டு இன்றும் அதிகாரமுள்ள எழுத்தாக நிலைத்திருப்பதைக் குறிக்கும் நிறைவு செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: இறைவாக்கினரான ஏசாயாவின் நூலில்
  rationale: தமிழில் மேற்கோள் நூலைச் சுட்டும் இயல்பான நடை. ‘நூலில்’ என்பது கிரேக்க ἐν என்பதன் சூழல்சார் பொருளை வெளிப்படுத்தும் தெளிவாக்கம்.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் தீர்க்கதரிசன அறிவிப்பின் வலிமையையும் கண்ணியமான நடையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀποστέλλω
  choice: அனுப்புகிறேன்
  rationale: கிரேக்க நிகழ்காலத்தை நேரடியாகவும் இயல்பாகவும் வழங்கி, அறிவிப்பின் உடனடித் தன்மையைப் பேணுகிறது.
- source_word: ἄγγελόν
  choice: தூதனை
  rationale: இங்கு முன்னோடியாக அனுப்பப்படும் செய்தியாளரைக் குறிக்கிறது; வானதூதர் என்று தேவையின்றி குறிப்பாக்காமல் கிரேக்கச் சொல்லின் பொதுப் பொருளைப் பாதுகாக்கிறது.
- source_word: πρὸ προσώπου σου
  choice: உனக்கு முன்னே
  rationale: ‘உன் முகத்திற்கு முன்பாக’ என்ற கிரேக்க மரபுத்தொடரின் திசைசார் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது; சொற்படி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατασκευάσει
  choice: ஆயத்தப்படுத்துவான்
  rationale: வழியை முன்னதாகத் தயார் செய்வது என்ற பொருளையும் உயர்வான வேதாகம நடையையும் தெளிவாகக் கொண்டுள்ளது.
- source_word: τὴν ὁδόν σου
  choice: உன் வழியை
  rationale: நேரடியான பாதை உருவகத்தையும் அதன் விரிவான உருவகப் பொருளையும் ஒருசேரப் பாதுகாக்கிறது.
theological_decisions:
- issue: மேற்கோளில் மல்கியா 3:1-இன் சொற்களும் ஏசாயா 40:3-இன் பின்னணியும் இணைந்திருந்தாலும், மேற்கோள் அறிமுகம் ஏசாயாவை மட்டும் பெயரிடுகிறது.
  choice: முதன்மை உரையில் ‘இறைவாக்கினரான ஏசாயாவின் நூலில்’ என்று வைத்தல்.
  alternative: ‘இறைவாக்கினர்களின் நூல்களில்’
  rationale: SBLGNT மூலவாசகம் ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ என்று உள்ளது. கூட்டுமேற்கோளால் தோன்றும் பதற்றத்தை மொழிபெயர்ப்பில் ஒத்திசைத்து நீக்காமல், மூலவாசகத்தைப் பேணி மாற்று சுவடிவாசகத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘ஆயத்தப்படுத்துவான்’ ஆகியவை தீர்க்கதரிசன மேற்கோளின் உயர்வான தொனியைப் பேணுகின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
