source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: ta
  text: அவர் கலிலேயாக் கடலின் ஓரமாகச் சென்றுகொண்டிருந்தபோது, சீமோனையும் அவரது சகோதரரான அந்திரேயாவையும் கடலில் வலை வீசிக்கொண்டிருந்ததைக் கண்டார்; ஏனெனில் அவர்கள் மீனவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: கடலோரமாகச் சென்றுகொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையான παράγων, εἶδεν என்ற முதன்மை வினையுடன் ஒரே நேரத்தில் தொடர்ந்த செயலைக் காட்டுகிறது; παρά + வேற்றுமை உருபு கடலின் ஓரமாக நகர்வதைக் குறிக்கிறது.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: கலிலேயாக் கடல்
  rationale: θάλασσα என்பதன் நேரடிப் பொருளையும் தமிழில் நிலைபெற்றுள்ள புவியியல் பெயரையும் காக்கிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் இறந்தகால வடிவுக்கு நேரடியான இயல்பான தமிழ்; ‘கவனித்தார்’ போன்ற கூடுதல் நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: சீமோனும் ... அந்திரேயாவும்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுடன் ஒத்த ஒலிபெயர்ப்புகள்; கூட்டு எழுவாய் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: சீமோனின் சகோதரன்
  rationale: அந்திரேயாவை அடையாளப்படுத்தும் உடன்பாட்டுத் தொடரைச் சுருக்கமின்றி காக்கிறது.
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: கடலில் வலை வீசிக்கொண்டிருப்பதை
  rationale: ἀμφιβάλλω மீன்பிடி வலையை வீசுவதைக் குறிப்பாகக் குறிக்கிறது; பன்மை நிகழ்காலப் பங்கேற்புவினையின் தொடர்நிலையை ‘வீசிக்கொண்டிருப்பது’ வெளிப்படுத்துகிறது. கிரேக்க ἐν என்பதற்கேற்ப ‘கடலில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ஏனெனில் அவர்கள் மீனவர்கள்
  rationale: γάρ தரும் விளக்கக் காரண உறவை வெளிப்படையாகவும் இயல்பாகவும் காக்கிறது.
