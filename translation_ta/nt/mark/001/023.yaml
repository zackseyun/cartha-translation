  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: ta
  text: 'உடனே, அவர்களுடைய தொழுகைக்கூடத்தில் அசுத்த ஆவியுடன்[a] ஒரு மனிதன் இருந்தான்; அவன் உரக்கக் கூக்குரலிட்டான்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “அசுத்த ஆவியில் இருந்த ஒரு மனிதன்.”'
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகள் இதை “அசுத்த ஆவி பிடித்திருந்த ஒரு மனிதன்” என்று வழங்குகின்றன; இது கிரேக்கச் சொற்றொடரின் பொருளை விரித்துரைக்கும் மொழிபெயர்ப்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் வேகமான கதைநகர்வை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἦν
  choice: இருந்த
  rationale: குறிப்பிட்ட இடத்தில் அந்த மனிதன் இருந்ததைத் தமிழின் இயல்பான வாக்கிய அமைப்பில் தெரிவிக்கிறது.
- source_word: συναγωγῇ αὐτῶν
  choice: அவர்களுடைய தொழுகைக்கூடத்தில்
  rationale: சூழலில் இது யூதர்களின் வழிபாட்டுக் கூடத்தைக் குறிக்கிறது; αὐτῶν என்பதையும் ‘அவர்களுடைய’ என்று தக்கவைக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆண் நபரைக் குறிக்கும் ஒருமைச் சொல்லைத் துல்லியமாக வழங்குகிறது.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: அசுத்த ஆவியோடு இருந்த
  rationale: கிரேக்கத்தின் ‘அசுத்த ஆவியில்’ என்ற அமைப்பைத் தமிழில் புரியும்படி வழங்குகிறது; அதேவேளை ‘பிடித்திருந்த’ என்ற கூடுதல் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἀκαθάρτῳ
  choice: அசுத்த
  rationale: இச்சொல்லிலுள்ள தூய்மையின்மை சார்ந்த சமய மற்றும் ஒழுக்கப் பொருள்நிழல்களைப் பாதுகாக்கிறது.
- source_word: ἀνέκραξεν
  choice: உரக்கக் கத்தினான்
  rationale: இவ்வினைச்சொல் குறிக்கும் உரத்த கூக்குரலை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐν πνεύματι ἀκαθάρτῳ என்பதில் தீய ஆவியின் தாக்கத்தை எவ்வாறு மொழிபெயர்ப்பது
  choice: அசுத்த ஆவியோடு இருந்த
  alternative: அசுத்த ஆவி பிடித்திருந்த
  rationale: மூலத்தின் தொடர்பைத் தெளிவாகக் கூறுகிறது; ஆனால் அந்தத் தொடர்பின் தன்மையை ‘பிடித்திருந்த’ என்று விளக்கி, மூலத்தில் இல்லாத அளவுக்கு உறுதிப்படுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொழுகைக்கூடம்’ என்பது யூதச் சூழலை இயல்பாகச் சுட்டுகிறது. அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்த இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
