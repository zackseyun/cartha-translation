- from: அவருடைய போதனையைக் கேட்டு அவர்கள் வியப்படைந்தார்கள். ஏனெனில், அவர் அதிகாரமுள்ள ஒருவரைப் போல அவர்களுக்குப் போதித்துக்கொண்டிருந்தார்[a]; வேத அறிஞர்களைப் போல அல்ல.
  to: அவருடைய போதனையைக் குறித்து அவர்கள் வியப்படைந்தார்கள்; ஏனெனில், அவர் அதிகாரம் உடையவராக அவர்களுக்குப் போதித்துக்கொண்டிருந்தார்[a], மறைநூல் அறிஞர்களைப் போல அல்ல.
