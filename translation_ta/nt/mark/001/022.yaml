source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: ta
  text: அவருடைய போதனையைக் குறித்து அவர்கள் வியப்படைந்தார்கள்; ஏனெனில், அவர் அதிகாரம் உடையவராக அவர்களுக்குப் போதித்துக்கொண்டிருந்தார்[a], மறைநூல் அறிஞர்களைப் போல அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரத்துடன் அவர்களுக்குப் போதித்துக்கொண்டிருந்தார்.”
    reason: ὡς ἐξουσίαν ἔχων என்பதற்கான இயல்பான தமிழ் மாற்று; இது கிரேக்க ஒப்பீட்டு அமைப்பைச் சற்றுச் சுருக்குகிறது.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: வியப்படைந்தார்கள்
  rationale: வலுவான வியப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. இறந்தகாலத் தொடர்நிலைச் சூழலைத் தமிழ் நடையில் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: அவருடைய போதனையைக் கேட்டு
  rationale: கிரேக்கத்தின் காரணம்/அடிப்படை சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; வியப்பு அவருடைய போதனையுடன் தொடர்புடையது என்பதைத் தெளிவாக்குகிறது.
- source_word: ἦν γὰρ διδάσκων
  choice: போதித்துக்கொண்டிருந்தார்
  rationale: ἦν + நிகழ்கால வினையெச்சம் காட்டும் தொடர்ச்சியான செயலைத் தமிழ் தொடர்நிலை வினையால் காக்கிறது.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: அதிகாரமுள்ள ஒருவரைப் போல
  rationale: ὡς என்பதன் ஒப்பீட்டு அமைப்பையும் ἐξουσία என்பதன் ‘அதிகாரம்’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: யூத வேதங்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்ற எழுத்தறிஞர்களைக் குறிக்கும் சொல்லை, சாதாரண நவீனத் தமிழ் வாசகர்கள் புரிந்துகொள்ளும் வகையில் சூழலுக்கேற்றபடி தருகிறது.
theological_decisions:
- issue: வேத அறிஞர்களுக்கு மாறாக இயேசுவின் அதிகாரத்தின் இயல்பு
  choice: அவர் ‘அதிகாரமுள்ள ஒருவரைப் போல’ போதித்தார் என்று விளக்கமாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தெய்வீக அதிகாரத்துடன்’ என்று விரிவாக மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் இயேசுவின் போதிக்கும் முறையை வேத அறிஞர்களின் முறையுடன் வேறுபடுத்துகிறது; ஆனால் அந்த அதிகாரத்தின் மூலத்தையோ இயல்பையோ இவ்வாக்கியத்தில் வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே இறையியல் முடிவு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேத அறிஞர்கள்’ என்பது ‘மறைநூல் அறிஞர்கள்’ அல்லது ஒலிபெயர்ப்பான ‘வேதபாரகர்’ என்பவற்றைவிட இன்றைய வாசகருக்கு உடனடியாக விளங்கும் தேர்வு. வசனத்தின் நீண்ட கிரேக்க வாக்கியம் தமிழ் வாசிப்பின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
