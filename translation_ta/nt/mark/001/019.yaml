  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: ta
  text: அவர் சற்று தூரம் சென்றபின், செபெதேயுவின் மகன் யாக்கோபையும், அவனுடைய சகோதரன் யோவானையும், அவர்கள் படகில் வலைகளைச் சீர்செய்துகொண்டிருப்பதைக் கண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பழுதுபார்த்துக்கொண்டிருப்பது” அல்லது “ஆயத்தப்படுத்திக்கொண்டிருப்பது” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் ஒன்றை ஒழுங்குபடுத்துவதையோ மீண்டும் சரியான நிலைக்குக் கொண்டுவருவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: இன்னும் சிறிது தூரம் சென்றபோது
  rationale: இறந்தகால வினையெச்சம் அடுத்த நிகழ்வுக்கு முன்பான குறுகிய தொலைவு நகர்வைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாக அந்தக் காலத் தொடர்பையும் தொடர்ந்து சென்றதையும் வெளிப்படுத்துகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் எளிய கதைநடைப் பொருளை, கூடுதல் அழுத்தம் சேர்க்காமல் தருகிறது.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: செபெதேயுவின் மகன் யாக்கோபை
  rationale: மூலத்திலுள்ள தந்தைவழி அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: அவனுடைய சகோதரன் யோவானை
  rationale: αὐτοῦ என்பது இயல்பாக யாக்கோபைக் குறிக்கிறது; தமிழில் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ πλοίῳ
  choice: படகில்
  rationale: குறிப்பிட்ட படகில் அவர்கள் இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; தமிழில் திட்டவட்டச் சுட்டுக்கான தனி உருபு தேவையில்லை.
- source_word: καταρτίζοντας
  choice: சீர்செய்துகொண்டிருந்தார்கள்
  rationale: வலைகளை ஒழுங்குபடுத்துதல் அல்லது பழுதைச் சரிசெய்தல் ஆகிய சூழல்சார் பொருட்களை உள்ளடக்கும் இயல்பான சொல்; தொடர்ந்துகொண்டிருந்த செயலை வினை வடிவம் காட்டுகிறது.
- source_word: τὰ δίκτυα
  choice: வலைகளை
  rationale: மீன்பிடி வலைகளைக் குறிக்கிறது; மூலத்தில் இல்லாத உடைமைச் சொல்லைச் சேர்க்கவில்லை.
- source_word: καὶ αὐτούς
  choice: அவர்கள் … கொண்டிருந்தார்கள்
  rationale: மூலத்தில் εἶδεν என்பதன் பொருளாக இருந்து, வினையெச்சத்தால் அவர்கள் செய்துகொண்டிருந்த செயல் விவரிக்கப்படுகிறது; தமிழில் இயல்புக்காக இது தனி வாக்கியமாக மாற்றப்பட்டுள்ளது.
