revisions:
- from: யூதேயா பகுதி முழுவதிலிருந்தும் எருசலேம் மக்கள் அனைவரும் அவரிடம் சென்றுகொண்டிருந்தார்கள். அவர்கள் தங்கள் பாவங்களை அறிக்கையிட்டு, யோர்தான் ஆற்றில் அவரால் திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்.
  to: யூதேயா நாடெங்குமிருந்த மக்களும் எருசலேம் மக்களெல்லாரும் அவரிடம் சென்று கொண்டிருந்தார்கள்; தங்கள் பாவங்களை அறிக்கையிட்டபடி, யோர்தான் ஆற்றில் அவரால் திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்.
  rationale: The revision corrects the coordination so that people from throughout Judea and all the people of Jerusalem are clearly separate, coordinated groups. It retains the ongoing sense of both Greek imperfect verbs, the passive agency “by him,” and the attendant confession of sins. No footnote is needed because the narrative-generalizing force of “all” is conveyed directly and idiomatically.
  reviewer_model: gpt-5.6-terra
