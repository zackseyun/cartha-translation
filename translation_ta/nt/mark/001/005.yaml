source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: ta
  text: யூதேயா நாடெங்குமிருந்த மக்களும் எருசலேம் மக்களெல்லாரும் அவரிடம் சென்று கொண்டிருந்தார்கள்; தங்கள் பாவங்களை அறிக்கையிட்டபடி, யோர்தான் ஆற்றில் அவரால் திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: சென்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கும் imperfect வடிவத்தின் நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: யூதேயா பகுதி முழுவதிலிருந்தும்
  rationale: χώρα என்பது பகுதி, மாவட்டம் அல்லது சுற்றுப்புற நிலப்பரப்பைக் குறிக்கலாம். இங்கு மக்களே சென்றார்கள் என்பது தமிழில் தெளிவாக இருக்க, இடத்தைக் குறிக்கும் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது; πᾶσα-வின் விரிவான கூட்டுப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: எருசலேம் மக்கள் அனைவரும்
  rationale: எருசலேமின் குடிமக்களைக் குறிக்கும் சொல்லையும் πάντες-ன் கூட்டுமுழுமையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐβαπτίζοντο
  choice: திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்
  rationale: செயப்படுபொருள் நிலையையும், தொடர்ந்து பலரிடம் நிகழ்ந்த imperfect செயலையும் காக்கிறது; முறையையோ பின்னைய இறையியல் விளக்கத்தையோ சேர்க்கவில்லை.
- source_word: ὑπ’ αὐτοῦ
  choice: அவரால்
  rationale: சூழலில் யோவானைக் குறிக்கும் மூலத்தின் பதிலிப்பெயரைப் பெயராக விரிவாக்காமல் பாதுகாக்கிறது.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: யோர்தான் ஆற்றில்
  rationale: ποταμός என்பதன் ‘ஆறு’ என்ற பொருளை வெளிப்படையாகத் தந்து, தமிழின் இயல்பான சொல்வரிசையைப் பின்பற்றுகிறது.
- source_word: ἐξομολογούμενοι
  choice: அறிக்கையிட்டு
  rationale: திருமுழுக்குடன் இணைந்து நிகழ்ந்த, தங்கள் பாவங்களை வெளிப்படையாக ஒப்புக்கொள்ளும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: தங்கள் பாவங்களை
  rationale: எழுவாயையே திரும்பச் சுட்டும் உடைமையை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யூதேயாவையும் எருசலேமையும் பற்றிய ‘முழுவதும்/அனைவரும்’ என்பதன் பரப்பு
  choice: மூலத்தின் முழுமையைக் காட்டும் சொற்களைத் தக்கவைத்து, அவற்றை கதையாடல் சார்ந்த கூட்டுப் பொதுமைப்படுத்தலாக வாசிக்க இடமளித்தல்
  alternative: ‘யூதேயாவிலும் எருசலேமிலும் இருந்து பலர்’ என்று தளர்த்துதல்
  rationale: மூலத்தில் πᾶσα, πάντες உள்ளதால் அதன் வலிமையைப் பாதுகாக்க வேண்டும்; அதேவேளை ஒவ்வொரு தனிநபரும் விதிவிலக்கின்றி வந்தார் என்ற கணிதத் துல்லியத்தை மொழிபெயர்ப்பு திணிக்கக் கூடாது.
- issue: திருமுழுக்கின் முறை அல்லது இறையியல் முக்கியத்துவம்
  choice: திருமுழுக்கு என்ற நிறுவப்பட்ட பொதுச் சொல்லைப் பயன்படுத்தி, செயலை மட்டும் அறிவித்தல்
  alternative: ‘அமிழ்த்தப்பட்டார்கள்’ அல்லது ‘கழுவப்பட்டார்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் முறையையோ பிற்கால சமயக்கோட்பாட்டு விளக்கத்தையோ தெளிவாக நிர்ணயிக்கவில்லை; ஆகவே பிரிவுசார் முடிவைச் சேர்க்காமல் ambiguity-ஐ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடை. கிரேக்கத்தின் நீடித்த imperfect செயல்கள் ‘சென்றுகொண்டிருந்தார்கள்’, ‘பெற்றுக்கொண்டிருந்தார்கள்’ எனக் காட்டப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
