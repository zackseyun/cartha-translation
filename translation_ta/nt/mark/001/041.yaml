source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: ta
  text: அவர் கோபமடைந்து[a], தமது கையை நீட்டி அவனைத் தொட்டு, “எனக்கு விருப்பமுண்டு; தூய்மையாகு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “கோபமடைந்து” என்பதற்குப் பதிலாக “மனமிரங்கி” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: கோபமடைந்து
  rationale: SBLGNT-யில் உள்ள ὀργισθείς என்பதன் நேரடியான பொருளைத் தருகிறது. யார்மீது அல்லது எதனால் கோபம் ஏற்பட்டது என்பதை மூலவாக்கியம் குறிப்பிடாததால், மொழிபெயர்ப்பும் அதை விளக்கிச் சேர்க்கவில்லை.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: தமது கையை நீட்டி
  rationale: இயேசுவின் தெளிவான உடல்செயலை இயல்பான தமிழ் தொடர் வினையெச்சமாகப் பாதுகாக்கிறது.
- source_word: ἥψατο
  choice: அவனைத் தொட்டு
  rationale: இந்தக் குணமாக்கும் சூழலில் ἅπτω என்பதன் இயல்பான பொருள் ‘தொடுதல்’; நோயாளியுடன் ஏற்பட்ட உடல்தொடர்பின் முக்கியத்துவத்தையும் இது காக்கிறது.
- source_word: λέγει αὐτῷ
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக உள்ளது. மேற்கோள் யாரிடம் கூறப்பட்டது என்பது உடனுள்ள சூழலிலேயே தெளிவாக இருப்பதால் தேவையற்ற மறுபதிப்பு தவிர்க்கப்பட்டது.
- source_word: Θέλω
  choice: எனக்கு விருப்பமுண்டு
  rationale: இங்கு எதிர்காலச் செயலைவிட, குணமாக்குவதற்கான மனவிருப்பத்தையும் சம்மதத்தையும் தெரிவிக்கிறது; தொழுநோயாளியின் வேண்டுகோளுக்கு நேரடியான பதிலாகவும் இயல்பாக அமைகிறது.
- source_word: καθαρίσθητι
  choice: தூய்மையாகு
  rationale: தோல் நோயிலிருந்து குணமடைதல் மற்றும் சடங்குசார் தூய்மை ஆகிய இரு பரிமாணங்களையும் ‘தூய்மை’ காக்கிறது. சொற்கூறாகிய ‘தூய்மையாக்கப்படு’ என்பதைவிட இது இயல்பான தமிழ் கட்டளை வடிவம்.
theological_decisions:
- issue: இயேசுவின் உணர்ச்சியை விவரிக்கும் பங்கேற்புச் சொல்லிலுள்ள பாட வேறுபாடு
  choice: SBLGNT-யின் ὀργισθείς என்பதை முதன்மை உரையில் ‘கோபமடைந்து’ என்று மொழிபெயர்த்தல்
  alternative: மனமிரங்கி
  rationale: வழங்கப்பட்ட மூலமொழிப் பதிப்புக்கு முன்னுரிமை அளிக்கப்படுகிறது. இந்தப் பாட வேறுபாடு இயேசுவின் உணர்ச்சியைப் பற்றிய வாசிப்பை குறிப்பிடத்தக்க விதத்தில் மாற்றுவதால், பரிச்சயமான மாற்றுப் பாடத்தை முதன்மை உரைக்குள் அமைதியாகக் கொண்டுவராமல் அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பது மரியாதையையும் இயல்பான குறிப்பிடுதலையும் தருகிறது. மூலத்தில் கோபத்தின் காரணமோ இலக்கோ கூறப்படாததால் அது திறந்த நிலையிலேயே விடப்பட்டுள்ளது.
