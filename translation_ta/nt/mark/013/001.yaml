  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: ta
  text: அவர் ஆலயத்திலிருந்து[a] வெளியேறிக்கொண்டிருந்தபோது, அவருடைய சீடர்களில் ஒருவர் அவரிடம், “ஆசிரியரே, பாருங்கள்! எப்பேர்ப்பட்ட கற்கள்[b], எப்பேர்ப்பட்ட கட்டிடங்கள்!” என்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் (ἱερόν) ஆலயத்தின் உள் பரிசுத்த இடத்தை மட்டும் அல்ல, ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எவ்வளவு பிரமாண்டமான கற்கள், எவ்வளவு பிரமாண்டமான கட்டிடங்கள்!” கிரேக்கப் பெயரடை வியப்பையோ பாராட்டையோ வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: அவர் ... வெளியே போய்க்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருக்கும் சமகாலச் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையுடன் கூடிய genitive absolute அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ ἱεροῦ
  choice: ஆலயத்திலிருந்து
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது; வாசிப்புக்கு இயல்பான ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: λέγει
  choice: என்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தை இறந்தகாலமாக மாற்றாமல் காக்கிறது.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் ஒருவர்
  rationale: பகுதிசார் தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை மரியாதையுடன் அழைக்கும் விளிவடிவம்; நவீன வேதாகமத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் கட்டளையை நவீன மரியாதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: எப்பேர்ப்பட்ட ... எப்பேர்ப்பட்ட ...
  rationale: கற்கள் மற்றும் கட்டடங்களின் தன்மையைக் கண்டு வியப்பும் பாராட்டும் தொனியில் கூறப்படும் கிரேக்கச் சொல்லின் விச்மயப் பயன்பாட்டைப் பொருள் குறுக்காமல் காக்கிறது.
- source_word: λίθοι
  choice: கற்கள்
  rationale: ஆலயக் கட்டுமானத்தில் இருந்த கற்களை நேரடியாகக் குறிக்கும் இயல்பான இணைச்சொல்.
- source_word: οἰκοδομαί
  choice: கட்டடங்கள்
  rationale: ஆலய வளாகத்திலுள்ள பல கட்டுமானங்களைக் குறிக்கும் தெளிவான நவீன தமிழ்ச் சொல்.
