id: MRK.13.13
reference: Mark 13:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ta
  text: என் பெயரின் காரணமாக நீங்கள் எல்லாராலும் வெறுக்கப்படுவீர்கள்.[a] ஆனால் முடிவுவரை நிலைத்திருப்பவர் எவரோ, அவரே காப்பாற்றப்படுவார்.[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் பெயரினிமித்தம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முடிவுவரை பொறுமையுடன் தாங்குகிறவர்’ அல்லது ‘முடிவுவரை உறுதியாக இருப்பவர்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘விடுவிக்கப்படுவார்’ அல்லது ‘இரட்சிக்கப்படுவார்.’ கிரேக்கச் சொல் மீட்பையோ இரட்சிப்பையோ குறிக்கலாம்; அதன் முழு நுட்பத்தைச் சூழல் திறந்ததாக வைத்திருக்கிறது.
    reason: alternative_reading
  - marker: d
    text: இதைக் குறைந்த வலியுறுத்தலுடன், ‘முடிவுவரை நிலைத்திருப்பவர் காப்பாற்றப்படுவார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘இவரே’ என்ற மீள்சுட்டு வலியுறுத்தல் உள்ளது.
    reason: syntactic_alternative
lexical_decisions:
- source_word: μισούμενοι
  choice: வெறுக்கப்படுவீர்கள்
  rationale: ἔσεσθε என்பதுடன் சேர்ந்துள்ள இப்பெயரெச்சம் எதிர்காலச் செயலற்ற வினையாக அமைகிறது; தமிழில் ‘வெறுக்கப்படுவீர்கள்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ὑπὸ πάντων
  choice: எல்லாராலும்
  rationale: மூலத்தின் விரிவான, எந்த வரம்பும் குறிப்பிடாத சொல்லாட்சியை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: διὰ τὸ ὄνομά μου
  choice: என் பெயரின் காரணமாக
  rationale: διά + வேற்றுமை வடிவம் காரணத்தைக் குறிக்கிறது. ‘பெயர்’ என்ற உருவகத்தை அப்படியே வைத்துக்கொண்டு, இயேசுவோடு கொண்ட அடையாளமும் பற்றுறுதியுமே பகைக்குக் காரணம் என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ δὲ ὑπομείνας
  choice: நிலைத்திருப்பவர் எவரோ
  rationale: ὑπομένω அழுத்தம் அல்லது துன்பத்தின் கீழும் தொடர்ந்து உறுதியாக இருப்பதைக் குறிக்கிறது. ‘நிலைத்திருப்பவர்’ இயல்பானது; பின்னுள்ள οὗτος உடன் சேர்ந்து வரும் அமைப்பை ‘எவரோ, அவரே’ எனக் காக்கிறது.
- source_word: εἰς τέλος
  choice: முடிவுவரை
  rationale: சோதனையின் முடிவா, வாழ்வின் முடிவா, இறுதிக்கால முடிவா என்பதைத் தீர்மானிக்காமல், மூலத்தில் உள்ள திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: οὗτος
  choice: அவரே
  rationale: முந்தைய பெயரெச்சத் தொடரை மீண்டும் சுட்டி வலியுறுத்தும் οὗτος என்பதன் பணியை, தமிழில் இயல்பான தொடர்பிணை அமைப்பான ‘எவரோ, அவரே’ மூலம் வெளிப்படுத்துகிறது.
- source_word: σωθήσεται
  choice: காப்பாற்றப்படுவார்
  rationale: σῴζω என்பதில் உடனடி மீட்பும் முழுமையான இரட்சிப்பும் ஆகிய இரு நிழற்பொருள்களும் இருக்கலாம். ‘காப்பாற்றப்படுவார்’ இரண்டையும் சூழல் தீர்மானிக்கும்படி திறந்ததாக வைத்திருக்கிறது.
theological_decisions:
- issue: σωθήσεται என்பதன் பொருள்
  choice: காப்பாற்றப்படுவார்
  alternative: விடுவிக்கப்படுவார்; இரட்சிக்கப்படுவார்
  rationale: இது வெறும் தற்காலிகத் தப்புவிப்பை மட்டுமே குறிக்கிறது என்றும், குறிப்பிட்ட ஒரு கோட்பாட்டு இரட்சிப்பு விளக்கத்தையே குறிக்கிறது என்றும் மொழிபெயர்ப்பு முடிவுசெய்யவில்லை. கிரேக்கச் சொல்லின் மீட்பு/இரட்சிப்பு சார்ந்த பரப்பைத் தக்கவைக்கிறது.
- issue: πάντων என்பதன் வரம்பு
  choice: எல்லாராலும்
  alternative: எல்லா மக்களாலும்; ஒவ்வொருவராலும்
  rationale: மூலத்தின் வலுவான பொதுப்படுத்தலை எந்தத் தகுதியுரையாலும் குறுக்காமல் அப்படியே காக்கிறது.
- issue: நிலைத்திருத்தலுக்கும் காப்பாற்றப்படுதலுக்கும் உள்ள தொடர்பு
  choice: வாக்கியத்தின் நேரடியான நிபந்தனைத் தன்மையும் எதிர்கால வாக்குறுதியும் காக்கப்பட்டுள்ளன
  alternative: குறிப்பிட்ட ஒரு சமயப்பிரிவின் விடாமுயற்சி அல்லது இரட்சிப்புக் கோட்பாட்டின்படி விளக்குதல்
  rationale: வசனத்தின் இறையியல் அழுத்தத்தையும் தீர்க்கப்படாத பதற்றத்தையும் அப்படியே வைத்திருந்து, மொழிபெயர்ப்பில் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் பெயரின் காரணமாக’ என்பது காரணத்தைக் தெளிவாகக் கூறுகிறது; ‘எவரோ, அவரே’ என்ற இயல்பான தமிழ் அமைப்பு கிரேக்கத்தின் மீள்சுட்டு வலியுறுத்தலைக் காக்கிறது. ‘முடிவுவரை’ என்பதன் குறிப்பு திட்டமிட்டு விளக்கப்படாமல் விடப்பட்டுள்ளது.
