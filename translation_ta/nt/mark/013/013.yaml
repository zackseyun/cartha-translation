  source_fidelity: மூலக் கிரேக்கத்தின் எதிர்காலச் செயலற்ற கருத்தான “வெறுக்கப்படுவீர்கள்,” ὑπὸ πάντων என்பதன் பரந்த “எல்லாராலும்,” மற்றும் διὰ τὸ ὄνομά μου என்பதன் காரணப் பொருள் ஆகியவை துல்லியமாக உள்ளன. “முடிவுவரை நிலைத்திருப்பவர் எவரோ, அவரே” என்பது ὁ ... ὑπομείνας மற்றும் வலியுறுத்தும் οὗτος ஆகிய இரண்டையும் காக்கிறது. “காப்பாற்றப்படுவார்” σωθήσεται என்பதன் மீட்பு/இரட்சிப்பு பரப்பை முன்கூட்டியே குறுக்கவில்லை.
