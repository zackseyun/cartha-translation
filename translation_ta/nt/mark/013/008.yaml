source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: ta
  text: ஏனெனில் ஒரு நாடு மற்றொரு நாட்டுக்கு எதிராகவும், ஒரு அரசு மற்றொரு அரசுக்கு எதிராகவும் எழும்பும். பல்வேறு இடங்களில் நிலநடுக்கங்கள் ஏற்படும்; பஞ்சங்கள் உண்டாகும். இவையெல்லாம் பிரசவ வேதனைகளின் தொடக்கம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேறுகால வேதனைகளின்.’ கிரேக்கச் சொல் குழந்தைப்பேற்றுடன் தொடர்புடைய வேதனைகளைக் குறிக்கிறது; இங்கு, பின்னர் வரவிருப்பதற்கு முன்னதாக ஏற்படும் துன்பங்களுக்கான உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: எழும்பும்
  rationale: எதிர்ப்போரின் மோதல் தொடங்குவதை இச்சூழலில் குறிக்கும் எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான செய்பாட்டு வினையாகக் கொடுக்கிறது.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: நாட்டுக்கு எதிராக நாடு
  rationale: βασιλεία என்பதுடன் இணைந்த அரசியல் மோதல் சூழலில் ἔθνος என்பதன் நாடு/மக்களினம் சார்ந்த பொருள்களில் ‘நாடு’ மிகவும் இயல்பாகப் பொருந்துகிறது.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: அரசுக்கு எதிராக அரசு
  rationale: இங்கு சொல் அரசுரிமை என்ற கருத்தைக் காட்டிலும் அரசியல் ஆட்சிப்பகுதியைக் குறிக்கிறது; ‘அரசு’ என்பது இணைநிலையையும் மோதல் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: σεισμοὶ
  choice: நிலநடுக்கங்கள்
  rationale: இச்சூழலில் σεισμός என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: κατὰ τόπους
  choice: பல்வேறு இடங்களில்
  rationale: κατά மற்றும் பன்மை τόπους சேர்ந்து நிகழ்வுகள் வெவ்வேறு இடங்களில் பரவலாக நடைபெறுவதைக் குறிக்கின்றன.
- source_word: λιμοί
  choice: பஞ்சங்கள்
  rationale: λιμός வெறும் பசியையோ குறுகிய உணவுத் தட்டுப்பாட்டையோ அல்லாமல் பஞ்சத்தைக் குறிக்கிறது.
- source_word: ἀρχὴ
  choice: தொடக்கம்
  rationale: இந்த நிகழ்வுகள் பின்னர் வரவிருப்பவற்றின் முழுமை அல்ல, ஆரம்பம் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὠδίνων
  choice: பிரசவ வேதனைகளின்
  rationale: பிள்ளைப்பேற்றுடன் தொடர்புடைய வேதனைகளைச் சுட்டும் மூல உருவகத்தை நவீன வாசகர்களுக்குப் புரியும் வகையில் தக்கவைக்கிறது.
- source_word: ταῦτα
  choice: இவையெல்லாம்
  rationale: முன்னர் குறிப்பிடப்பட்ட பல நிகழ்வுகளையும் ஒருங்கிணைத்து, அவை தொடக்கம் என்ற ஒருமைக் கருத்துடன் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: ἀρχὴ ὠδίνων என்பதில் உள்ள வெளிப்படுத்தல் சார்ந்த உருவகம்
  choice: இவையெல்லாம் பிரசவ வேதனைகளின் தொடக்கம்
  alternative: இவை வெறும் துன்பங்களின் தொடக்கம்
  rationale: துன்பத்திற்குப் பின் என்ன வருமென்பதை மொழிபெயர்ப்பில் கோட்பாட்டு முறையில் நிர்ணயிக்காமல், பிரசவ வேதனை என்ற மூல உருவகத்தையும் இவை ஆரம்பகட்ட நிகழ்வுகள் என்ற அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘நாடு… அரசு…’ என்ற இணை அமைப்பும் ‘பிரசவ வேதனைகள்’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
