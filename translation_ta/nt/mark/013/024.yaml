reference: Mark 13:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: ta
  text: ஆனால் அந்த நாட்களில், அந்த உபத்திரவத்திற்குப்[a] பிறகு, சூரியன் இருளடையும்; சந்திரன் தன் ஒளியைக் கொடுக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த நெருக்கடிக்குப் பிறகு’ அல்லது ‘அந்தத் துன்பத்திற்குப் பிறகு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: θλῖψις என்பதன் பொருள் வரம்பில் உபத்திரவம், நெருக்கடி, துன்பம் ஆகியவை அடங்குகின்றன.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய உரையிலிருந்து வலுவான மாறுபாட்டையும் புதிய திருப்பத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: கிரேக்கத்தின் காலக் குறிப்பையும் இறுதிக்கால உரையின் தொனியையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: அந்த உபத்திரவத்திற்குப் பிறகு
  rationale: μετά என்பதன் காலப் பொருளை ‘பிறகு’ என்றும், demonstrative-ஐ ‘அந்த’ என்றும் தக்கவைக்கிறது. θλῖψις இச்சூழலில் கடுமையான துன்பம் அல்லது நெருக்கடியைக் குறிக்கிறது; ‘உபத்திரவம்’ அதன் கனத்த இறுதிக்காலத் தொனியைப் பாதுகாக்கிறது.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: சூரியன் இருண்டுபோகும்
  rationale: எதிர்கால இருளடைதலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. சொற்சொல்லான ‘இருளாக்கப்படும்’ என்பதைக் காட்டிலும் இது வாசிப்புக்கு இயல்பானது; கிரேக்க வினையின் விளைவைத் தெளிவாகத் தருகிறது.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: சந்திரன் தன் ஒளியைக் கொடுக்காது
  rationale: ‘கொடுக்காது’ என்பது δίδωμι என்பதின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது; ‘தன் ஒளி’ αὐτῆς என்பதன் தொடர்பை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: இறுதிக்கால உரையில் θλῖψις என்பதன் மொழிபெயர்ப்பு
  choice: உபத்திரவம்
  alternative: நெருக்கடி / துன்பம்
  rationale: இச்சொல் கடுமையான அழுத்தம், துன்பம், நெருக்கடி ஆகிய பொருட்களை ஏற்கிறது. ‘உபத்திரவம்’ உரையின் கனத்த இறுதிக்காலத் தொனியைத் தக்கவைக்கிறது; ஆனால் எந்தக் குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டின் தொழில்நுட்பப் பெயராகவும் அதை விளக்கவில்லை.
- issue: σκοτισθήσεται என்ற எதிர்காலப் passive வடிவம்
  choice: இருண்டுபோகும்
  alternative: இருளாக்கப்படும்
  rationale: ‘இருளாக்கப்படும்’ கிரேக்க passive வடிவத்துக்கு நெருக்கமானது, ஆனால் நவீன தமிழில் கடினமாக ஒலிக்கிறது. ‘இருண்டுபோகும்’ நிகழும் மாற்றத்தின் விளைவை இயல்பாகக் கூறுகிறது; அதை ஏற்படுத்துபவர் யார் என்பதைக் கூடுதலாக விளக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இறுதிக்காலத் தொனி தக்கவைக்கப்பட்டாலும், குறிப்பிட்ட சமயப்பிரிவின் விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
