review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative, the uncertainty of the householder's arrival, and all four temporal alternatives in their Greek order. However, the repeated final “தெரியாது” makes the Tamil syntax less direct than the Greek's single statement of not knowing followed by the alternatives.
  naturalness: “விழிப்புடன் இருங்கள்” is natural modern standard Tamil. Recasting the latter half as “எப்போது வருவார் என்பது உங்களுக்குத் தெரியாது:” removes the awkward repetition and clearly governs the following list.
  terminology: “வீட்டின் எஜமான்” appropriately represents the domestic/parabolic sense of ὁ κύριος τῆς οἰκίας. “சேவல் கூவும் வேளை” preserves the time-marker sense of ἀλεκτοροφωνία. The lexical footnote's alternative is more idiomatically expressed as “விழித்திருங்கள்” than “காவலாயிருங்கள்.”
  issues:
  - severity: medium
    issue: The main text repeats “தெரியாது” after the four alternatives.
    rationale: This is not required by the Greek and produces a less smooth Tamil construction. The temporal list should depend directly on the single clause stating that the readers do not know when the householder will come.
  - severity: low
    issue: Footnote [a] gives “காவலாயிருங்கள்” as the alternative for γρηγορεῖτε.
    rationale: This can suggest acting as a guard rather than remaining awake/watchful. “விழித்திருங்கள்” is a closer and natural Tamil lexical alternative.
  revised_text: 'எனவே விழிப்புடன் இருங்கள்[a]; ஏனெனில் வீட்டின் எஜமான் எப்போது வருவார் என்பது உங்களுக்குத் தெரியாது: மாலையிலோ, நள்ளிரவிலோ, சேவல் கூவும் வேளையிலோ[b], காலையிலோ.'
