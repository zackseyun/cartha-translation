source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: ta
  text: 'எனவே விழிப்புடன் இருங்கள்[a]; ஏனெனில் வீட்டின் எஜமான் எப்போது வருவார் என்பது உங்களுக்குத் தெரியாது: மாலையிலோ, நள்ளிரவிலோ, சேவல் கூவும் வேளையிலோ[b], காலையிலோ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழித்திருங்கள்.” இக்கட்டளை தொடர்ந்து எச்சரிக்கையுடனும் விழிப்புணர்வுடனும் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “சேவல் கூவும் வேளை” என்பது சேவல் கூவுதலோடு தொடர்புபடுத்தப்பட்ட இரவுக் காவல் வேளையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: விழிப்புடன் இருங்கள்
  rationale: உறங்காமல் இருப்பதை மட்டும் அல்லாமல், தொடர்ந்து எச்சரிக்கையுடனும் ஆயத்தமாகவும் இருப்பதைக் குறிக்கும் கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய போதனையிலிருந்து வரும் முடிவையும் தர்க்கத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாது
  rationale: அறியாமையைக் குறிக்கும் கிரேக்க மறுப்பு வினையை கூடுதல் விளக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: πότε
  choice: எப்போது
  rationale: காலத்தைப் பற்றிய மறைமுகக் கேள்வியை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: வீட்டின் எஜமான்
  rationale: வீட்டின் மீது அதிகாரமுள்ளவரைச் சுட்டும் உவமைச் சூழலைப் பாதுகாக்கிறது; இவ்வாக்கியத்தில் இதை நேரடியான தெய்வீகப் பட்டமாக மாற்றுவதில்லை.
- source_word: ἔρχεται
  choice: வருவார்
  rationale: சூழலில் எதிர்பார்க்கப்படும் வருகையைக் குறிக்கும் நிகழ்கால வடிவத்தை தமிழில் இயல்பான எதிர்காலக் குறிப்பாக வழங்குகிறது.
- source_word: ὀψὲ
  choice: மாலையில்
  rationale: இரவுக் காவல் வேளைகளின் வரிசையில் முதல், மாலை நேரக் காவலைக் குறிக்கிறது.
- source_word: μεσονύκτιον
  choice: நள்ளிரவில்
  rationale: நள்ளிரவு நேரத்திற்கான நேரடியான, வழக்கமான தமிழாக்கம்.
- source_word: ἀλεκτοροφωνίας
  choice: சேவல் கூவும் வேளையில்
  rationale: சேவல் கூவுதலோடு தொடர்புடைய இரவுக் காவல் வேளையை நவீன வாசகருக்கு இயல்பாக விளங்குமாறு தருகிறது.
- source_word: πρωΐ
  choice: காலையில்
  rationale: இரவின் இறுதிக் காவல் வேளை காலைக்குள் நகர்வதைத் தெளிவாகக் குறிக்கிறது; குறிப்பாக ‘விடியற்காலை’ என்று அளவுக்கு மீறி வரையறுப்பதில்லை.
theological_decisions:
- issue: வீட்டு உவமையில் κύριος என்பதன் மொழிபெயர்ப்பு; அது மறைமுகமாக இயேசுவைக் குறிக்கக்கூடும்
  choice: வீட்டின் எஜமான்
  alternative: வீட்டின் ஆண்டவர் / வீட்டின் உரிமையாளர்
  rationale: உடனடி சூழலில் இது வீட்டின் மீது அதிகாரமுள்ள ஒருவரைக் குறிக்கும் சாதாரண மரபுத்தொடர். ‘எஜமான்’ உவமையின் நேரடிப் பொருளைப் பாதுகாக்கிறது; அதே நேரத்தில் அதன் விரிவான கிறிஸ்துவியல் சுட்டுதலை மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. இரவின் நான்கு வேளைகளின் வரிசை பாதுகாக்கப்பட்டுள்ளது; [a], [b] ஆகிய அடிக்குறிப்பு குறியீடுகள் முதன்மை உரையில் இடப்பட்டுள்ளன.
