  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: ta
  text: '“எங்களுக்குச் சொல்லுங்கள்: இவை எப்போது நிகழும்? இவை அனைத்தும் நிறைவேறவிருக்கும்போது[a] என்ன அடையாளம் இருக்கும்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவை அனைத்தும் நிறைவேறும்போது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் μέλλῃ என்பதுடன் முடிவிலா வினை வடிவம் வருவதால், ‘நிறைவேறவிருக்கும்போது’ என்ற எதிர்நோக்கிய பொருளும் குறிப்பாக வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: எங்களுக்குச் சொல்லும்
  rationale: இயேசுவை நோக்கிய ஒருமை ஏவல் வடிவையும், ἡμῖν என்பதன் ‘எங்களுக்கு’ என்ற பொருளையும் இயல்பான மரியாதைமிக்க தமிழ் நடையில் தருகிறது.
- source_word: πότε ταῦτα ἔσται
  choice: இவை எப்போது நிகழும்?
  rationale: εἰμί என்பதன் சொற்பொருள் ‘இருக்கும்’ என்றாலும், முன்னறிவிக்கப்பட்ட சம்பவங்களைப் பற்றிய கேள்வியில் ‘நிகழும்’ என்பது இயல்பான தமிழாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது; ταῦτα என்பதன் பன்மையும் காக்கப்படுகிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: ஒரு நிகழ்வு அணுகிவிட்டதைச் சுட்டிக்காட்டும் குறி என்ற சூழல்சார் பொருளைத் தெளிவாகத் தரும் பொதுவான தமிழ் சொல்.
- source_word: ὅταν μέλλῃ
  choice: நிறைவேறவிருக்கும்போது
  rationale: ὅταν என்பதன் காலத் தொடர்பையும், μέλλω + வினையெச்சம் தரும் எதிர்நோக்கிய அல்லது அண்மித்த நிகழ்வு என்ற நுணுக்கத்தையும் ஒரே இயல்பான தமிழ் அமைப்பில் காக்கிறது.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: இவை அனைத்தும் நிறைவேற
  rationale: πάντα உடன் வரும் ταῦτα என்பதைக் ‘இவை அனைத்தும்’ என்று வழங்கி, συντελεῖσθαι என்பதன் நிறைவு அல்லது முடிவை அடைதல் என்ற இடைநிலைப் பொருளை ‘நிறைவேற’ எனத் தருகிறது; ‘தீர்க்கதரிசனம் நிறைவேறுதல்’ என்ற கருத்தைத் தேவையின்றி மேலேற்றுவதில்லை.
theological_decisions:
- issue: μέλλῃ + συντελεῖσθαι என்பதன் இறுதிக்கால நுணுக்கம்
  choice: ‘நிறைவேறவிருக்கும்போது’ என்று prospective/imminent நுணுக்கத்தைத் தக்கவைத்தல்
  alternative: ‘நிறைவேறும்போது’ அல்லது ‘நிறைவேறும் காலத்தில்’
  rationale: μέλλω சாதாரண எதிர்காலத்தை மட்டும் அல்லாமல், ஒன்று நிகழவிருக்கிறது என்ற எதிர்நோக்கிய தன்மையையும் கொண்டிருக்கலாம். அதைத் தமிழில் காக்கிறோம்; ஆனால் இதன் மூலம் இறுதிக்கால நிகழ்வுகளின் காலவரிசை குறித்த எந்தக் குறிப்பிட்ட கோட்பாட்டையும் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் மரியாதைமிக்க நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எங்களுக்குச் சொல்லும்’ என்பது இயேசுவை நோக்கிய மரியாதையையும் ஒருமை ஏவலையும் காட்டுகிறது; கேள்விகளின் அமைப்பு தெளிவுக்காக இயல்பான தமிழ் நிறுத்தக்குறிகளுடன் வழங்கப்பட்டுள்ளது.
