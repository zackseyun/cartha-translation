  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: ta
  text: ஆனால், அது குளிர்காலத்தில் நிகழாதபடி வேண்டிக்கொள்ளுங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சூழலைக் கருத்தில் கொண்டு இன்னும் வெளிப்படையாக: ‘நீங்கள் தப்பிச் செல்வது குளிர்காலத்தில் நிகழாதபடி.’ மாற்குவின் கிரேக்க வாசகம் மத்தேயு 24:20-இல் உள்ள இணை வாசகத்தைவிடச் சுருக்கமானது.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை. நவீனத் தமிழில் இயல்பான கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது; நிகழ்காலத்தின் தொடர்ச்சித் தன்மையை ‘தொடர்ந்து’ என்று சேர்த்து மிகுதியாகக் குறிப்பாக்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கையைத் தொடர்ந்து வரும் மென்மையான மாறுபாட்டையும் உரையோட்டத்தையும் காட்டுகிறது.
- source_word: ἵνα μὴ
  choice: நிகழாதபடி
  rationale: வேண்டுதலின் எதிர்மறை உள்ளடக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γένηται
  choice: அது ... நிகழ
  rationale: γίνομαι என்பதன் இறந்தகாலத் தோற்றம் கொண்ட நடுநிலை வினைமுற்று. கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படாத நிகழ்வைத் தமிழிலும் ‘அது’ என்ற பொதுச் சுட்டுடன் சுருக்கமாக வைத்திருக்கிறது.
- source_word: χειμῶνος
  choice: குளிர்காலத்தில்
  rationale: காலத்தைக் குறிக்கும் உருபுப் பயன்பாட்டை இயல்பான தமிழில் ‘குளிர்காலத்தில்’ என வழங்குகிறது.
theological_decisions:
- issue: γένηται என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்/பொருள்
  choice: எதிர்பார்க்கப்படும் நிகழ்வை ‘அது’ என்று பொதுவாகவும் சுருக்கமாகவும் குறிப்பிடுதல்
  alternative: ‘நீங்கள் தப்பிச் செல்வது குளிர்காலத்தில் நிகழாதபடி’ என்று சூழலின் அடிப்படையில் வெளிப்படையாக்குதல்
  rationale: மாற்கு எழுதிய கிரேக்க உரையில் ‘நீங்கள் தப்பிச் செல்வது’ என்ற சொற்கள் வெளிப்படையாக இல்லை; மத்தேயு 24:20-இன் விரிவான வடிவத்தை இங்கே கொண்டு வராமல், மூலத்தின் சுருக்கத்தையும் பொருள் இடைவெளியையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான, மறைமுகமான குறிப்பு முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழலால் பெறப்படும் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
