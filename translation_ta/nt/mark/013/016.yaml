source:
  edition: SBLGNT
  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: ta
  text: வயலில் இருப்பவர் தமது மேலங்கியை எடுத்துக்கொள்ளத் திரும்பிப் போக வேண்டாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளிப்புற ஆடை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: வயலில் இருப்பவர்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் ஒருமைத் தொடரை இயல்பான தமிழில் பொதுவாக ஒருவரைக் குறிக்கும் வகையில் தருகிறது; தேவையின்றி ஆண்பாலாக மட்டும் வரையறுக்கவில்லை.
- source_word: ἀγρός
  choice: வயல்
  rationale: இச்சூழலில் வயல் அல்லது பயிர்நிலம் என்பதே நேரடியான பொருள்; தப்பிச் செல்லும் அவசர எச்சரிக்கைக்கும் இது பொருந்துகிறது.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: திரும்பிப் போக வேண்டாம்
  rationale: μή உடனான இறந்தகாலக் கட்டளை வடிவத்தின் தடைப் பொருளையும், பின்னால் உள்ள இடத்திற்குத் திரும்பிச் செல்லக்கூடாது என்ற அவசரத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἆραι
  choice: எடுத்துக்கொள்ள
  rationale: திரும்பிச் செல்வதன் நோக்கத்தைத் தெரிவிக்கும் வினையெச்சமாக, விட்டுவந்த பொருளைப் பெறுதல் அல்லது எடுத்துக்கொள்ளுதல் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἱμάτιον
  choice: மேலங்கி
  rationale: உடலின் மேல் அணியும் வெளிப்புற ஆடையைக் குறிக்கும் சொல்லுக்கு சுருக்கமான, புரிந்துகொள்ள எளிய தமிழ் இணை.
- source_word: αὐτοῦ
  choice: தமது
  rationale: மூலத்தின் ஒருமைக் குறிப்பைத் தக்கவைத்தபடி, ‘இருப்பவர்’ என்ற மரியாதை ஒருமையுடன் இயல்பாக இசைகிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமைக் குறிப்பு
  choice: ‘இருப்பவர் ... தமது மேலங்கி’ என்று ஒருமைப் பொதுக் குறிப்பைத் தக்கவைத்தல்
  alternative: ‘வயலில் இருப்பவர்கள் தங்கள் மேலங்கிகளை’ என்று பன்மையாக்குதல்
  rationale: கிரேக்கம் ஒருமை ஆண்பால் இலக்கண வடிவத்தையும் ஒருமைப் பெயர்ப்பதிலியையும் கொண்டுள்ளது. தமிழில் ‘இருப்பவர்’ என்பது பாலினத்தைத் தேவையின்றி வரையறுக்காமல் அந்த ஒருமைப் பிரதிநிதித்துவ வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திரும்பிப் போக வேண்டாம்’ என்பது தடை மற்றும் அவசரத்தை இயல்பாக வெளிப்படுத்துகிறது.
