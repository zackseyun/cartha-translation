source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: ta
  text: ஆனால், நீங்கள் உங்களைக் குறித்து விழிப்பாயிருங்கள். அவர்கள் உங்களை மன்றங்களிடம் ஒப்புக்கொடுப்பார்கள்; யூதத் தொழுகைக்கூடங்களில் நீங்கள் அடிக்கப்படுவீர்கள்; என் நிமித்தமாக ஆளுநர்களுக்கும் அரசர்களுக்கும் முன்பாக நிறுத்தப்படுவீர்கள்—அவர்களுக்கு ஒரு சாட்சியாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுக்குச் சாட்சியாக’ என்றும் மொழிபெயர்க்கலாம்; இச்சொற்றொடர் சூழலுக்கு ஏற்ப ‘அவர்களுக்கு எதிரான சாட்சியாக’ என்ற நுணுக்கத்தையும் கொண்டிருக்கக்கூடும்.
    reason: εἰς μαρτύριον αὐτοῖς என்பதன் திசைநோக்கிய சாட்சிப் பொருளைத் தக்கவைத்துக்கொண்டு, சாத்தியமான எதிர்மறை/கண்டன நுணுக்கத்தை பிரதான உரையில் திணிக்காமல் குறிக்கிறது.
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: ஆனால், நீங்கள் உங்களைக் குறித்து எச்சரிக்கையாயிருங்கள்
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான விழிப்புணர்வையும், வெளிப்படையாக இடம்பெறும் ὑμεῖς ἑαυτούς என்பதன் தன்னிலை வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: παραδώσουσιν
  choice: ஒப்புக்கொடுப்பார்கள்
  rationale: துன்புறுத்தலின் நீதித்துறைச் சூழலில் அதிகாரிகளின் கையில் ஒப்படைக்கப்படுவதைக் குறிக்கிறது; ‘காட்டிக்கொடுப்பார்கள்’ என மொழிபெயர்த்து துரோகத்தின் கருத்தை தேவையின்றி புகுத்தவில்லை.
- source_word: συνέδρια
  choice: மன்றங்கள்
  rationale: பன்மையில் வரும் இச்சொல் எருசலேமின் ஒரே சனெத்ரினை மட்டும் அல்லாமல் உள்ளூர் ஆட்சி அல்லது நீதித்துறை மன்றங்களையும் குறிக்கலாம்; ‘மன்றங்கள்’ அந்தப் பரப்பைத் திறந்தவாறு வைக்கிறது.
- source_word: συναγωγάς
  choice: தொழுகைக்கூடங்கள்
  rationale: யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தைக் குறிக்கும் தமிழில் பரவலாகப் புரியக்கூடிய சொல்; இங்கு ஒழுங்கு நடவடிக்கையாக அடிக்கப்படும் இடத்தையும் சுட்டுகிறது.
- source_word: δαρήσεσθε
  choice: நீங்கள் அடிக்கப்படுவீர்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தின் உடல் வன்முறையை நேரடியாகக் காட்டுகிறது; குறிப்பிட்ட சாட்டைத் தண்டனையாக அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων
  choice: ஆளுநர்களுக்கும் அரசர்களுக்கும் முன்பாக
  rationale: இரு வேறுபட்ட அதிகாரப் பதவிகளையும் காத்து, அவர்களுடைய முன்னிலையில் அதிகாரபூர்வமாக நிறுத்தப்படுவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σταθήσεσθε
  choice: நிறுத்தப்படுவீர்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தில் உள்ள, அதிகாரிகளுக்கு முன் கொண்டுவரப்பட்டு நிற்கச் செய்யப்படும் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἕνεκεν ἐμοῦ
  choice: என் நிமித்தமாக
  rationale: இயேசுவுடன் உள்ள தொடர்பே துன்புறுத்தலுக்குக் காரணம் என்பதைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: அவர்களுக்கு ஒரு சாட்சியாக
  rationale: μαρτύριον என்பதன் சாட்சி/சான்று பொருளையும் αὐτοῖς என்பதன் திசைநோக்கிய பொருளையும் காக்கிறது; அது அவர்களுக்கு எதிரான கண்டனச் சாட்சியே என்று பிரதான உரையில் முடிவுசெய்யவில்லை.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς என்ற சொற்றொடரின் விசை
  choice: சீடர்கள் அதிகாரிகளுக்கு முன் நிறுத்தப்படுவது அவர்களுக்கான சாட்சியாக அமைகிறது.
  alternative: அது அவர்களுக்கு எதிரான, கண்டனத் தன்மையுள்ள சாட்சியாக அமைகிறது.
  rationale: மூலச்சொற்றொடர் ‘அவர்களுக்கு’ என்ற பரந்த பொருளை இயல்பாக அனுமதிக்கிறது; சில சூழல்களில் ‘அவர்களுக்கு எதிராக’ என்ற நுணுக்கமும் இருக்கலாம். எனவே பிரதான உரை குறைவாக விளக்கமளிக்கும் வடிவத்தைத் தேர்ந்தெடுத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மன்றங்கள்’ உள்ளூர் நீதித்துறை அல்லது ஆட்சிக் குழுக்களின் பன்மையைத் திறந்தவாறு வைக்கிறது. இறுதி சாட்சிச் சொற்றொடரின் உண்மையான பொருள் நெருக்கடி அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
