  to: ஆனால், நீங்கள் உங்களைக் குறித்து விழிப்பாயிருங்கள். அவர்கள் உங்களை மன்றங்களிடம் ஒப்புக்கொடுப்பார்கள்; யூதத் தொழுகைக்கூடங்களில் நீங்கள் அடிக்கப்படுவீர்கள்; என் நிமித்தமாக ஆளுநர்களுக்கும் அரசர்களுக்கும் முன்பாக நிறுத்தப்படுவீர்கள்—அவர்களுக்கு ஒரு சாட்சியாக.[a]
  rationale: The revision improves modern Tamil idiom in the opening warning, identifies συναγωγαί accurately as Jewish synagogues, and makes the footnote a genuine clarification of the source phrase’s unresolved semantic range. The judicial setting, passive force, distinct authorities, and causal phrase “because of me” remain intact.
