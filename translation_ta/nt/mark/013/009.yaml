review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the future passive sequence: being handed over to local councils, beaten in synagogues, and made to stand before governors and kings because of Jesus. It also appropriately retains the noncommittal directional force of εἰς μαρτύριον αὐτοῖς in the main text and notes the possible adversative implication.'
  naturalness: Most of the verse is clear modern Tamil. However, “உங்களைக் குறித்து எச்சரிக்கையாயிருங்கள்” is somewhat bureaucratic/stilted for the urgent imperative βλέπετε ... ἑαυτούς. “உங்களைக் குறித்து விழிப்பாயிருங்கள்” is more direct and idiomatic in this warning context. “தொழுகைக்கூடங்கள்” can be read broadly as prayer halls and does not clearly identify συναγωγαί as Jewish synagogues.
  terminology: “மன்றங்கள்,” “ஒப்புக்கொடுப்பார்கள்,” “அடிக்கப்படுவீர்கள்,” “ஆளுநர்கள்,” and “அரசர்கள்” preserve the source’s institutional and judicial sense well. “யூதத் தொழுகைக்கூடங்கள்” gives συναγωγαί its needed historical-religious specificity without adding interpretive detail. “சாட்சியாக” suitably renders μαρτύριον; the footnote preserves the possible ‘against them’ nuance.
  issues:
  - severity: low
    issue: The opening imperative is stylistically stiff.
    rationale: “உங்களைக் குறித்து எச்சரிக்கையாயிருங்கள்” is understandable, but “உங்களைக் குறித்து விழிப்பாயிருங்கள்” more naturally conveys the ongoing vigilance of βλέπετε while retaining the reflexive focus.
  - severity: medium
    issue: “தொழுகைக்கூடங்கள்” is too generic for συναγωγαί.
    rationale: The Greek specifically refers to synagogues. Adding “யூதத்” makes the historical referent clear in Tamil and avoids a generic or potentially misleading reading of prayer halls.
  - severity: low
    issue: The first alternative in the footnote does not materially differ from the main rendering.
    rationale: “அவர்களுக்கான ஒரு சாட்சியாக” is not a useful distinct alternative to “அவர்களுக்கு ஒரு சாட்சியாக.” The note should instead succinctly explain that the phrase can be understood as testimony directed to them and may, in context, imply testimony against them.
  revised_text: ஆனால், நீங்கள் உங்களைக் குறித்து விழிப்பாயிருங்கள். அவர்கள் உங்களை மன்றங்களிடம் ஒப்புக்கொடுப்பார்கள்; யூதத் தொழுகைக்கூடங்களில் நீங்கள் அடிக்கப்படுவீர்கள்; என் நிமித்தமாக ஆளுநர்களுக்கும் அரசர்களுக்கும் முன்பாக நிறுத்தப்படுவீர்கள்—அவர்களுக்கு ஒரு சாட்சியாக.[a]
