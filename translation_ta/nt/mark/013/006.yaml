  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: ta
  text: பலர் என் பெயரில் வந்து, ‘நான்தான் அவர்’[a] என்று சொல்லி, பலரை வழிதவறச் செய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நானே.’ கிரேக்கத்தில் பயனிலை வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் சார்ந்த பன்மை அடைமொழி; ‘பலர்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐλεύσονται
  choice: வருவார்கள்
  rationale: ἔρχομαι என்பதன் எதிர்கால வடிவத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயரையும் அதனுடன் தொடர்புடைய அதிகாரம் அல்லது அடையாளத்தையும் உரிமைகோரிக்கொண்டு செயல்படுவதைச் சுட்டும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: λέγοντες
  choice: என்று சொல்லி
  rationale: அவர்கள் வரும்போது கூறும் கூற்றை, மேலதிக விளக்கம் சேர்க்காமல் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὅτι Ἐγώ εἰμι
  choice: ‘நானே அவர்’
  rationale: சூழலில் உள்ள அடையாள உரிமைகோரலை இயல்பான தமிழில் வெளிப்படுத்துகிறது. இருப்பினும், கிரேக்கத்தில் ‘அவர்’ என்பதற்கான வெளிப்படையான சொல் இல்லாததால் சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πολλοὺς
  choice: பலரை
  rationale: வினையின் மனித நேர்செயப்படுபொருளை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: πλανήσουσιν
  choice: வழிதவறச் செய்வார்கள்
  rationale: ஒருவரை உண்மையான வழியிலிருந்து விலகச் செய்வது என்ற πλανάω வினையின் உருவகத் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பொய்யான உரிமைகோருவோரின் சூழலில் Ἐγώ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: ‘நானே அவர்’
  alternative: ‘நான் இருக்கிறேன்’
  rationale: உடனடிச் சூழலில், இயேசுவின் பெயரில் வருபவர்கள் அவருக்குரிய அடையாளத்தைத் தங்களுக்கு உரியதாகக் கூறுவதை ‘நானே அவர்’ தெளிவாக உணர்த்துகிறது. அதேவேளையில், கிரேக்கத்தில் பயனிலை வெளிப்படையாக இல்லாததால் அந்தத் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் பெயரில்’ என்ற பரிச்சயமான வேதாகம மரபுத்தொடர் தக்கவைக்கப்பட்டுள்ளது; ‘வழிதவறச் செய்வார்கள்’ என்பது மூலத்தின் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
