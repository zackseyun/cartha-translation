  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: ta
  text: மேலும், நற்செய்தி முதலில் எல்லா மக்களினங்களுக்கும் அறிவிக்கப்பட வேண்டும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுவிசேஷம்.’ ‘நற்செய்தி’ என்பதற்கான கிரேக்கச் சொல் εὐαγγέλιον என்பதன் நேரடிப் பொருள் ‘நல்ல செய்தி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எல்லா மக்களினங்களிடையிலும்’; ἔθνη என்ற கிரேக்கச் சொல் சில சூழல்களில் ‘யூதரல்லாத மக்கள்’ என்றும் பொருள்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: இது முந்தைய உரையுடன் தொடர்ச்சியை ஏற்படுத்துகிறது; தமிழில் இயல்பான இணைப்பாக ‘மேலும்’ அமைகிறது.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: எல்லா மக்களினங்களுக்கும்
  rationale: εἰς என்பது அறிவிப்பின் திசை அல்லது பரப்பைக் குறிக்கிறது. ἔθνη என்பது இங்கு உலகளாவிய இன-மக்கள் பரப்பைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது; அதை ‘யூதரல்லாதவர்கள்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: πρῶτον
  choice: முதலில்
  rationale: நிகழ வேண்டியவற்றின் கால வரிசையில் முன்னுரிமையை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: δεῖ தெரிவிக்கும் அவசியத்தைத் தக்கவைக்கிறது; அந்த அவசியத்தின் மூலத்தை வசனம் வெளிப்படையாகக் கூறாததால் கூடுதல் இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: κηρυχθῆναι
  choice: அறிவிக்கப்பட
  rationale: பொதுவாகவும் வெளிப்படையாகவும் ஒரு செய்தியைப் பிரகடனம் செய்வதைக் குறிக்கும் செயப்படுபொருள் வடிவத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் ‘நல்ல செய்தி’ என்ற பொருளை, தமிழில் பரவலாக அறியப்படும் இயல்பான வேதாகமச் சொல்லான ‘நற்செய்தி’ தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ἔθνη என்பதன் பரப்பு
  choice: எல்லா மக்களினங்களுக்கும்
  alternative: எல்லா நாடுகளுக்கும்; யூதரல்லாத மக்கள் அனைவருக்கும்
  rationale: இச்சூழலில் உள்ள உலகளாவிய பரப்பை ‘மக்களினங்கள்’ தக்கவைக்கிறது. அதேவேளையில், ἔθνη சில சூழல்களில் யூதரல்லாத மக்களைக் குறிக்கக்கூடும் என்ற பொருள் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: δεῖ என்பதன் வலிமை
  choice: அறிவிக்கப்பட வேண்டும்
  alternative: அறிவிக்கப்படுவது அவசியம்
  rationale: தேவை அல்லது கட்டாய அவசியத்தைத் தெளிவாகத் தக்கவைக்கிறது; இது தெய்வீக அவசியமா என்பதை வசனத்திற்குள் விளக்கிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தி’ பொதுவாக அறியப்படும் சொல்லாக வைக்கப்பட்டு, அதன் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘மக்களினங்கள்’ என்பது அரசியல் நாடுகளை மட்டும் அல்லாமல் இன-மக்கள் குழுக்களையும் உள்ளடக்கும் பரப்பைத் தக்கவைக்கிறது.
