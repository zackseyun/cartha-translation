source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: ta
  text: ஆண்டவர் அந்த நாட்களைக் குறைத்திருக்காவிட்டால், எந்த மனிதரும்[a] காப்பாற்றப்பட்டிருக்க மாட்டார்கள். ஆனால், ஆண்டவர் தேர்ந்தெடுத்த தம் தேர்ந்தெடுக்கப்பட்டவர்களுக்காக அவர் அந்த நாட்களைக் குறைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எந்த மாம்சமும் இல்லை.” இங்கு இது மனிதர் அனைவரையும் குறிக்கும் வேதாகம மொழிவழக்கு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: குறைத்திருக்காவிட்டால் / குறைத்தார்
  rationale: κολοβόω என்பதன் ‘குறுகச் செய்தல், குறைத்தல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. கிரேக்கத்தில் இரு இடங்களிலும் ஒரே வினைச்சொல் வருவதால், தமிழிலும் ‘குறைத்தல்’ இரு இடங்களிலும் நிலைநிறுத்தப்பட்டுள்ளது; முதலாவது எதிர்நிகழ்வு நிபந்தனைக்கேற்ப வினைவடிவம் மாறுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: குறிப்பிட்ட தெய்வீகக் குறிப்பாளரைச் சுட்டும் κύριος என்பதற்கான இயல்பான, கண்ணியமான தமிழ் வேதாகமச் சொல்.
- source_word: τὰς ἡμέρας
  choice: அந்த நாட்களை
  rationale: முன்னதாக விவரிக்கப்பட்ட துன்பக் காலத்தின் நாட்களைச் சுட்டுகிறது. தமிழ் உரையில் சுட்டுத் தொடர்பை இயல்பாக வெளிப்படுத்த ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது; காலத்தை மேலும் விளக்கி வரையறுக்கவில்லை.
- source_word: οὐκ ἂν ἐσώθη
  choice: காப்பாற்றப்பட்டிருக்காது
  rationale: ἄν உடன் வரும் எதிர்நிகழ்வு விளைவைத் துல்லியமாகக் காட்டுகிறது. சூழலில் மனித உயிர் அழிவிலிருந்து காக்கப்படுவதே உடனடிப் பொருளாக இருந்தாலும், σῴζω என்பதன் ‘காப்பாற்று’ என்ற பரந்த சொல்லைத் தக்கவைக்கிறது.
- source_word: πᾶσα σάρξ
  choice: ஒரு மாம்சம்கூட
  rationale: மறுப்புடன் சேர்ந்த πᾶσα σάρξ, ‘எந்த மனிதரும் இல்லை’ என்ற பொருளுடைய வேதாகம மொழிவழக்கு. ‘மாம்சம்’ என்ற மூல உருவகத்தை முதன்மை உரையில் தக்கவைத்து, அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: தேர்ந்தெடுக்கப்பட்டோருக்காக
  rationale: διά + accusative இங்கு அவர்களின் நிமித்தம் அல்லது நலனுக்காகச் செய்யப்பட்ட செயலைக் குறிக்கிறது. ‘-க்காக’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκλεκτούς
  choice: தேர்ந்தெடுக்கப்பட்டோர்
  rationale: இறைவனால் தேர்ந்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் சொல்லை நவீனத் தமிழில் புரியுமாறு தருகிறது; தனிநபர் அல்லது குழுத் தேர்தல் குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
- source_word: οὓς ἐξελέξατο
  choice: தாம் தேர்ந்தெடுத்தவர்களாகிய
  rationale: ἐκλεκτούς மற்றும் ἐξελέξατο ஆகிய உறவுடைய சொற்களின் திட்டமிட்ட மீளுரையைத் தமிழிலும் இயன்றவரைத் தக்கவைக்கிறது. ‘தாம்’ என்பதால் ஆண்டவரே வினையின் எழுவாய் என்பது தெளிவாகிறது.
theological_decisions:
- issue: இச்சூழலில் ‘காப்பாற்றப்படுதல்’ என்பதன் பொருள்
  choice: துன்பக் காலத்தில் மனித உயிர் அழியாமல் காப்பாற்றப்படுவது உடனடிப் பொருள்; எனினும் ‘காப்பாற்று’ என்ற பரந்த வினைச்சொல் தக்கவைக்கப்படுகிறது.
  alternative: இதை நித்திய அல்லது ஆவிக்குரிய இரட்சிப்பை மட்டும் குறிக்கும் வாசகமாக மொழிபெயர்த்தல்.
  rationale: நாட்கள் குறைக்கப்படாவிட்டால் மனிதர்கள் அழிந்திருப்பார்கள் என்பதே சூழல். ஆகவே உடல் உயிர் பாதுகாப்பு முன்னிலையில் உள்ளது; அதே நேரத்தில், மூல வினையின் பரந்த பொருளைச் சுருக்காமல் இருப்பது இறையியல் கருத்தை உரைக்குள் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- issue: ‘தேர்ந்தெடுக்கப்பட்டோர்’ யார் என்பது
  choice: அவர்களுக்காக நாட்கள் குறைக்கப்படுகின்றன என்றும், ஆண்டவர் அவர்களைத் தேர்ந்தெடுத்தார் என்றும் மட்டும் உரை கூறும் அளவில் விடப்பட்டுள்ளது.
  alternative: தேர்வு முற்றிலும் குழுவுக்குரியது அல்லது முற்றிலும் தனிநபர் முன்நியமனத்துக்குரியது என்று வெளிப்படையாக வரையறுத்தல்.
  rationale: இவ்வசனம் தேர்ந்தெடுக்கப்பட்ட மக்களைத் தெளிவாகக் குறிப்பிடுகிறது; ஆனால் தேர்தலின் இயல்பைப் பற்றிய விரிவான கோட்பாட்டு விவாதங்களைத் தீர்ப்பதில்லை. மொழிபெயர்ப்பு அந்தத் திறந்த நிலையையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒரு மாம்சம்கூட’ என்பது திட்டமிட்டு தக்கவைக்கப்பட்ட வேதாகம மொழிவழக்கு; அதன் மனிதகுலத்தைக் குறிக்கும் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘தாம் தேர்ந்தெடுத்தவர்களாகிய தேர்ந்தெடுக்கப்பட்டோர்’ என்ற சிறிதளவு மீளுரை, மூலத்தில் ἐκλεκτούς / ἐξελέξατο என வரும் சொல்விளையாட்டை வெளிப்படுத்துகிறது.
