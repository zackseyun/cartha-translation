source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: ta
  text: வீட்டின் மொட்டைமாடியில்[a] இருப்பவர் கீழே இறங்க வேண்டாம்; தன் வீட்டிலிருந்து எதையாவது எடுப்பதற்காக வீட்டுக்குள் செல்லவும் வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டுக் கூரையில்.” இங்குள்ள கிரேக்கச் சொல், மக்கள் பயன்படுத்தக்கூடிய இடமாகவும் இருந்த வீட்டின் தட்டையான கூரைப் பகுதியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: வீட்டின் மொட்டைமாடியில் இருப்பவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கத் தொடரை ஒரு பொதுவான நபரைக் குறிக்கும் இயல்பான தமிழில் வழங்குகிறது; இடத்தின் கட்டடப் பின்னணியையும் காக்கிறது.
- source_word: δώματος
  choice: மொட்டைமாடி
  rationale: யூதேய வீடுகளின் அணுகக்கூடிய தட்டையான கூரைப் பகுதியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: μὴ καταβάτω
  choice: கீழே இறங்க வேண்டாம்
  rationale: மூன்றாம் நபர் தடை ஏவலை இயல்பான, தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μηδὲ εἰσελθάτω
  choice: வீட்டுக்குள் செல்லவும் வேண்டாம்
  rationale: μηδέ இணைக்கும் இரண்டாவது தடையைத் தெளிவாகக் காத்து, εἰσέρχομαι என்பதன் உள்ளே செல்லும் இயக்கத்தை இயல்பாக வழங்குகிறது.
- source_word: τι ἆραι
  choice: எதையாவது எடுப்பதற்காக
  rationale: குறிப்பிடப்படாத எந்தப் பொருளையும் எடுக்கும் நோக்கத்தைக் காட்டும் இறந்தகாலமற்ற வினையெச்சத் தொடரின் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: தன் வீட்டிலிருந்து
  rationale: ἐκ என்பதிலுள்ள உள்ளிருந்து வெளியே எடுக்கும் கருத்தையும், எழுவாயையே திரும்பச் சுட்டும் αὐτοῦ என்பதையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பொதுப் பொருளுடைய ஆண்பால் ஒருமை நபர்ச் சுட்டு
  choice: தன் வீட்டிலிருந்து
  alternative: அவர்களுடைய வீட்டிலிருந்து
  rationale: கிரேக்கத்தின் ஒருமையைப் பாதுகாக்கிறது; அதே நேரத்தில் தமிழின் ‘தன்’ என்பது தேவையில்லாமல் பாலினத்தை முன்னிறுத்தாமல் எழுவாயோடு தெளிவாக இணைகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘மொட்டைமாடி’ பண்பாட்டுச் சூழலை உடனடியாக உணர்த்துகிறது; மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
