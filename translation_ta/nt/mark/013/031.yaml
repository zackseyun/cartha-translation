source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ta
  text: வானமும் பூமியும் ஒழிந்துபோகும்; ஆனால் என் வார்த்தைகள் நிச்சயமாக ஒழிந்துபோகாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: வானமும் பூமியும்
  rationale: இது படைக்கப்பட்ட முழு உலகத்தையும் குறிக்கும் நிலைபெற்ற இணைச்சொல். இச்சூழலில் οὐρανός என்பதை வெறும் ‘வான்வெளி’ என்று குறுக்காமல் ‘வானம்’ என்றும், γῆ என்பதை ஒரு குறிப்பிட்ட ‘நிலம்’ என்று கொள்ளாமல் ‘பூமி’ என்றும் மொழிபெயர்க்கிறது.
- source_word: παρελεύσονται
  choice: ஒழிந்துபோகும்
  rationale: παρέρχομαι இங்கு முடிவுறுதல் அல்லது இல்லாமற்போதல் என்ற காலமுடிவுக்குரிய பொருளைக் கொண்டுள்ளது. ‘ஒழிந்துபோகும்’ என்பது அதன் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: வானமும் பூமியும் நிலையற்றவை என்பதற்கும் இயேசுவின் வார்த்தைகள் நிலைத்திருப்பதற்கும் இடையிலான தெளிவான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: οἱ λόγοι μου
  choice: என் வார்த்தைகள்
  rationale: இது இயேசு கூறிய சொற்கள் அல்லது அறிவிப்புகளைக் குறிக்கிறது; ‘என் வார்த்தைகள்’ நேரடியும் இயல்பானதுமான தமிழ் நடை.
- source_word: οὐ μὴ παρελεύσονται
  choice: நிச்சயமாக ஒழிந்துபோகாது
  rationale: οὐ μή என்பதுடன் வரும் எதிர்கால வினைச்சொல் மிக வலியுறுத்தப்பட்ட மறுப்பைத் தருகிறது. ‘நிச்சயமாக ... ஒழிந்துபோகாது’ என்பது அந்த வலியுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் வார்த்தைகள் ஒழிந்துபோகாது என்ற கூற்றிலுள்ள வலியுறுத்தல்
  choice: ‘நிச்சயமாக ஒழிந்துபோகாது’ என்று வெளிப்படையான வலியுறுத்தலுடன் மொழிபெயர்த்தல்
  alternative: ‘ஒருபோதும் ஒழிந்துபோகாது’
  rationale: படைக்கப்பட்ட வானமும் பூமியும் ஒழிந்துபோவதற்கும் இயேசுவின் வார்த்தைகள் நிலைத்திருப்பதற்கும் உள்ள முரண்பாட்டை இவ்வசனம் வலுவாகக் காட்டுகிறது. οὐ μή என்பதன் உறுதியான மறுப்பைத் தமிழில் கேட்கத்தக்கவாறு மொழிபெயர்க்கிறது; அதற்கு அப்பாற்பட்ட சமயக்கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. கிரேக்கத்தில் இருமுறை வரும் παρέρχομαι என்பதற்கு இரு இடங்களிலும் ‘ஒழிந்துபோகும்’ என்ற ஒரே சொல்லாக்கம் பயன்படுத்தப்பட்டு, வசனத்தின் நேரடியான எதிர்மறை ஒப்புமை பாதுகாக்கப்பட்டுள்ளது.
