review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately identifies the buildings, the emphatic negation, and the prediction of demolition. However, its wording separates the two tightly connected Greek clauses as “nothing will be left …; everything will be torn down,” which slightly weakens the source’s explicit relative-clause formulation: no stone will remain upon another that is not demolished.'
  naturalness: The draft is generally clear modern Tamil. A more direct formulation using “ஒரு கல்லின்மேல் மற்றொரு கல் விடப்பட்டிருக்காது; இடிக்கப்படாத கல் ஒன்றும் இருக்காது” is both idiomatic and preserves the Greek construction without the somewhat abstract “இருக்கும்படி எதுவும் விடப்படாது.”
  terminology: “கட்டடங்கள்” appropriately retains the generic wording of οἰκοδομάς, while “பிரமாண்டமான” suitably conveys the size/impressiveness of μεγάλας. “இடிக்கப்படாத/இடிக்கப்படும்” naturally represents καταλυθῇ in this architectural context. The temple-complex clarification properly remains a footnote.
  issues:
  - severity: medium
    issue: The final clause is recast as an independent assertion, “அனைத்தும் இடித்துத் தள்ளப்படும்.”
    rationale: Greek has a relative clause qualifying “stone” (ὃς οὐ μὴ καταλυθῇ), not simply a separate statement that everything will be demolished. The draft conveys the broad sense but does not preserve the stated stone-by-stone formulation as closely as Tamil can.
