source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: ta
  text: இயேசு அவனிடம், “இந்தப் பிரமாண்டமான கட்டடங்களைப்[a] பார்க்கிறாயா? இங்கே ஒரு கல்லின்மேல் மற்றொரு கல்[b] விடப்பட்டிருக்காது; இடிக்கப்படாத கல் ஒன்றும் இருக்காது[c]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்தின் இந்தப் பிரமாண்டமான கட்டடங்களை.’ சூழல் ஆலய வளாகத்தைக் குறிக்கிறது; ஆனால் கிரேக்க மூலத்தில் ‘கட்டடங்கள்’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரு கல்லின்மேல் மற்றொரு கல்’ என்பது முழுமையான அழிவைக் குறிக்கும் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அழிக்கப்படாத’ அல்லது ‘தகர்க்கப்படாத.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: பார்க்கிறாயா?
  rationale: நிகழ்கால வினைச்சொல் இங்கு நேரடிக் கேள்வியாகப் பயன்படுகிறது. ‘பார்க்கிறாயா?’ என்பது அதன் கேள்வித் தன்மையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: μεγάλας οἰκοδομάς
  choice: பிரமாண்டமான கட்டடங்கள்
  rationale: μεγάλας என்பது அளவையும் கம்பீரத்தையும் குறிக்கக்கூடும்; ‘பிரமாண்டமான’ இரண்டையும் தக்கவைக்கிறது. οἰκοδομάς என்பதற்கு சூழலில் ஆலயக் கட்டடங்கள் குறிக்கப்பட்டாலும், மூலத்தில் உள்ள பொதுவான ‘கட்டடங்கள்’ என்பதே முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: οὐ μὴ ἀφεθῇ
  choice: எதுவும் விடப்படாது
  rationale: οὐ μή உடனான வினைவடிவம் வலியுறுத்தப்பட்ட எதிர்கால மறுப்பைக் காட்டுகிறது. தமிழில் இயல்பான மறுப்பு வாக்கியத்துடன் ‘எதுவும்’ சேர்ப்பது அந்த முழுமையான மறுப்பைத் தெளிவாக்குகிறது.
- source_word: λίθος ἐπὶ λίθον
  choice: ஒரு கல்லின்மேல் மற்றொரு கல்
  rationale: முழுமையான அழிவைக் காட்டும் மூலத்தின் தெளிவான காட்சிப்படிமத்தை இது இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: καταλυθῇ
  choice: இடித்துத் தள்ளப்படும்
  rationale: கட்டடத்தைப் பிரித்து வீழ்த்துதல் அல்லது அழித்தல் என்ற பொருளை இச்சூழலில் உயிரோட்டமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: இயேசு அவனிடம் ... என்று சொன்னார்
  rationale: தமிழ் மேற்கோள் அமைப்புக்கு ஏற்ற சொல்வரிசையில், மூலத்தின் எளிய உரையாடல் அறிமுகம் கூடுதல் விளக்கமின்றித் தரப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவின் முன்னறிவிப்பு ஆலய வளாகத்தின் கட்டடங்களைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘கட்டடங்கள்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘ஆலயத்தின் பிரமாண்டமான கட்டடங்கள்’
  rationale: உடனடிச் சூழல் ஆலய வளாகத்தைக் குறித்தாலும், கிரேக்க மூலத்தில் ‘ஆலயம்’ என்ற பெயர்ச்சொல் இவ்வசனத்தில் இல்லை. ஆகவே சூழல் தகவலை அடிக்குறிப்பில் அளித்து, மூலத்தின் பொதுவான சொல்லை முதன்மை உரையில் தக்கவைத்துள்ளது.
- issue: ‘ஒரு கல்லின்மேல் மற்றொரு கல்’ என்ற கூற்றின் வலிமை
  choice: முழுமையான இடிப்பைக் குறிக்கும் வலியுறுத்தப்பட்ட தீர்க்கதரிசனமாக மொழிபெயர்த்தல்
  alternative: சில கற்கள்கூட எஞ்சாது என்று கட்டடவியல் துல்லியக் கூற்றாக மட்டும் வாசித்தல்
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பும் தொடரும் இடித்துத் தள்ளுதல் பற்றிய சார்பு வாக்கியமும் முழுமையான அழிவை வலியுறுத்துகின்றன; அதன் சொற்படிமத்தையும் மொழிநடை வலிமையையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரமாண்டமான’ என்பது கட்டடங்களின் அளவையும் வியப்பூட்டும் தோற்றத்தையும் வெளிப்படுத்துகிறது. கிரேக்க வாக்கியத்தின் நீளமான சார்பு அமைப்பு தமிழில் தெளிவுக்காக அரைப்புள்ளியுடன் இரண்டு தொடர்புடைய கூறுகளாக அமைக்கப்பட்டுள்ளது; முழுமையான அழிவு என்ற கருத்து மாற்றப்படவில்லை.
