source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: ta
  text: 'அத்திமரத்திலிருந்து இந்த உவமையைக் கற்றுக்கொள்ளுங்கள்: அதன் கிளை ஏற்கெனவே மென்மையாகி, இலைகள் துளிர்விடும்போது, கோடைக்காலம் அருகில் இருக்கிறது என்று அறிந்துகொள்கிறீர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உவமை’ என்பதற்கு ‘பாடம்’ அல்லது ‘எடுத்துக்காட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: அத்திமரத்திலிருந்து
  rationale: ἀπό உடன் வரும் வேற்றுமை வடிவம் கற்றுக்கொள்வதற்கான மூலத்தைச் சுட்டுகிறது. δέ இங்கு மெலிதான தொடர்புச் சொல்; தமிழில் தனியாக மொழிபெயர்க்காமல் இயல்பான வாக்கியத் தொடரால் அதன் பணி வெளிப்படுகிறது.
- source_word: μάθετε
  choice: கற்றுக்கொள்ளுங்கள்
  rationale: μανθάνω என்பதன் இறந்தகால ஏவல் வடிவம் அறிவுரையைப் பெற்றுக்கொள்ளும்படி அழைக்கிறது; நவீன தமிழில் ‘கற்றுக்கொள்ளுங்கள்’ நேரடியும் இயல்பானதுமாகும்.
- source_word: τὴν παραβολήν
  choice: இந்த உவமையை
  rationale: παραβολή ஓர் ஒப்புமை வழியான போதனையைக் குறிக்கிறது. நற்செய்தி நூல்களின் வழக்கமான சொல்லான ‘உவமை’ சொல் தொடர்ச்சியைக் காக்கிறது; தமிழ் இயல்புக்காக சூழலில் தெளிவாக உள்ள சுட்டுப்பொருள் ‘இந்த’ என வெளிப்படுத்தப்படுகிறது.
- source_word: ὅταν
  choice: …போது
  rationale: ὅταν உடன் வரும் subjunctive பொதுவான கால நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் ‘…போது’ இதை இயல்பாகத் தருகிறது.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: அதன் கிளை மென்மையாகி
  rationale: ἁπαλός புதிய வளர்ச்சியின் மென்மையைச் சுட்டுகிறது. ἤδη குறிக்கும் நிலை அடைந்திருப்பது தமிழின் வினையெச்சத் தொடரில் இயல்பாக உட்பொதிகிறது; ‘ஏற்கெனவே’ எனச் சேர்ப்பது இங்கு தமிழில் தேவையற்ற வலியுறுத்தலாகத் தோன்றலாம்.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: இலைகள் துளிர்க்கும்போது
  rationale: ἐκφύω முளைத்தல் அல்லது வெளிப்படுதல் என்பதைக் குறிக்கிறது; மரத்தின் புதிய இலை வளர்ச்சிக்கு ‘இலைகள் துளிர்க்கும்’ என்பது இயல்பான தமிழ்.
- source_word: γινώσκετε
  choice: அறிந்துகொள்கிறீர்கள்
  rationale: இது இச்சூழலில் ஏவல் அல்ல, நிகழ்காலக் குறிப்பு வடிவம்; அடையாளத்திலிருந்து மக்கள் உணர்ந்து அறிவதை ‘அறிந்துகொள்கிறீர்கள்’ துல்லியமாகக் காட்டுகிறது.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: கோடைக்காலம் நெருங்கிவிட்டது
  rationale: ἐγγύς கால நெருக்கத்தையும் θέρος கோடைக்காலத்தையும் குறிக்கின்றன. ‘நெருங்கிவிட்டது’ அறிகுறியால் இப்போது தெளிவாகியுள்ள அண்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இந்தச் சூழலில் παραβολή என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உவமை’
  alternative: ‘பாடம்’ அல்லது ‘எடுத்துக்காட்டு’
  rationale: ‘உவமை’ நற்செய்தி நூல்களின் முக்கியச் சொல்லைத் தக்கவைத்துக் கொண்டு, அத்திமரத்திலிருந்து பெறப்படும் ஒப்புமை வழிப் பாடத்தையும் சூழல் மூலம் உணர்த்துகிறது; கூடுதல் உருவக விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் மரியாதையான நடை. கிரேக்க வாக்கியத்தின் உவமை, பொதுவான கால நிபந்தனை, மற்றும் கூற்றாக உள்ள γινώσκετε ஆகியவை காக்கப்பட்டுள்ளன.
