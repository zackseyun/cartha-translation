source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: ta
  text: ஏனெனில், பொய் மேசியாக்களும்[a] பொய்த் தீர்க்கதரிசிகளும் தோன்றி, அடையாளங்களையும் அற்புதங்களையும் செய்து, தேர்ந்தெடுக்கப்பட்டவர்களை, கூடுமானால், வழிதவறச் செய்வதற்காக முயல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்க் கிறிஸ்துக்கள்.” கிரேக்கச் சொல் கிறிஸ்தோஸ் (Christos) என்பதிலிருந்து உருவானது; இங்கு அது “மேசியா” என்ற பட்டத்தைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: தோன்றி
  rationale: இங்கு எதிர்காலச் செயலற்ற வடிவம் ஆட்கள் எழும்பி வெளிப்படுவதைக் குறிக்கும் மரபுத்தொடராக உள்ளது. ‘தோன்றி’ என்பது அவர்களுக்குப் பின்னால் தெய்வீகச் செயற்பாடு இருப்பதாக உணர்த்தாமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணவிளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ψευδόχριστοι
  choice: பொய் மேசியாக்கள்
  rationale: Χριστός இங்கு பெயராக அல்ல, ‘மேசியா’ என்ற பட்டமாகப் பயன்படுகிறது; கூட்டுச்சொல்லின் பொருளையும் யூத மேசியா எதிர்பார்ப்பின் பின்னணியையும் இவ்வடிவம் காக்கிறது.
- source_word: ψευδοπροφῆται
  choice: பொய்த் தீர்க்கதரிசிகள்
  rationale: கிரேக்கக் கூட்டுப்பெயரின் நேரடியான, தமிழ் வேதாகம வழக்கிலும் தெளிவான இணைச்சொல்.
- source_word: δώσουσιν
  choice: செய்வார்கள்
  rationale: σημεῖα καὶ τέρατα என்பவற்றுடன் தமிழில் ‘அடையாளங்களையும் அற்புதங்களையும் செய்வார்கள்’ என்பதே இயல்பான இணைவு; சொற்சொல்லான ‘கொடுப்பார்கள்’ இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: σημεῖα καὶ τέρατα
  choice: அடையாளங்களையும் அற்புதங்களையும்
  rationale: இரட்டைச் சொற்றொடரின் தனித்தனி கூறுகளையும் அதன் வேதாகம ஒலிநயத்தையும் காக்கிறது; மூலத்தில் இல்லாத ‘அற்புதமான’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: வழிதவறச் செய்வதற்காக
  rationale: இலக்கை அல்லது நோக்கத்தைத் தெரிவிக்கும் கிரேக்கக் கட்டமைப்பையும், உண்மையிலிருந்து ஒருவரை விலக்குதல் என்ற ἀποπλανάω வின் உருவகத்தையும் காக்கிறது.
- source_word: εἰ δυνατόν
  choice: கூடுமானால்
  rationale: சுருக்கமான நிபந்தனைத் தொடரை, அது நிறைவேற இயலுமா இயலாதா என்பதை முன்கூட்டியே தீர்மானிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: τοὺς ἐκλεκτούς
  choice: தேர்ந்துகொள்ளப்பட்டவர்களை
  rationale: தெய்வவியல் முக்கியத்துவமுள்ள ‘தேர்ந்தெடுக்கப்பட்டோர்’ என்ற பொருளைக் காக்கிறது; எந்த ஒரு பிரிவின் முன்னியல்பையும் இதில் சேர்க்கவில்லை.
theological_decisions:
- issue: ψευδόχριστοι என்பதில் Χριστός பட்டத்தின் மொழிபெயர்ப்பு
  choice: பொய் மேசியாக்கள்
  alternative: பொய்க் கிறிஸ்துக்கள்
  rationale: இக்கூட்டுச்சொல்லில் Χριστός தெளிவாக ‘மேசியா’ என்ற பட்டப் பொருளில் உள்ளது. ஆகவே ‘மேசியாக்கள்’ என்பது பொருளையும் வரலாற்றுப் பின்னணியையும் தெளிவாகக் காக்கிறது.
- issue: εἰ δυνατόν என்பது தேர்ந்துகொள்ளப்பட்டவர்கள் வழிதவற முடியுமா என்பதைத் தீர்மானிக்கிறதா
  choice: கூடுமானால்
  alternative: அது கூடுமாயிருந்தால்
  rationale: கிரேக்கம் ஒரு நிபந்தனையை முன்வைக்கிறது; ஆனால் அது உண்மையில் சாத்தியமா என்பதை வெளிப்படையாகத் தீர்க்கவில்லை. ‘கூடுமானால்’ அந்தத் தெய்வவியல் இறுக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: εἰ δυνατόν தொடரின் தொடர்பும் இடமும்
  choice: ‘தேர்ந்துகொள்ளப்பட்டவர்களை வழிதவறச் செய்வதற்காக’ என்பதற்கு முன் அமைத்தல்
  alternative: ‘வழிதவறச் செய்வதற்காக—கூடுமானால்—தேர்ந்துகொள்ளப்பட்டவர்களை’
  rationale: தமிழில் இயல்பான ஓட்டத்திற்காக நிபந்தனைத் தொடர் சற்றே முன்னே வைக்கப்பட்டது. அது ஏமாற்றுவோரின் நோக்கத்தைக் கட்டுப்படுத்துகிறது என்ற கிரேக்கப் பொருள் காக்கப்படுகிறது; மாற்று சொல்வரிசை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான எச்சரிக்கை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பொய்த் தீர்க்கதரிசிகள்’, ‘அடையாளங்கள்’, ‘அற்புதங்கள்’, ‘தேர்ந்துகொள்ளப்பட்டவர்கள்’ போன்ற பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய ஓட்டம் இயல்பாக இருக்க கிரேக்கச் சொல்வரிசை அளவோடு மறுசீரமைக்கப்பட்டுள்ளது.
