  terminology: “ஒப்புவிக்க” suitably conveys παραδιδόντες in a juridical/persecution setting without narrowing it to betrayal. “பரிசுத்த ஆவியானவர்” is standard modern Tamil Christian usage. The lexical footnote for λαλέω is useful and accurately stated.
