id: MRK.13.11
reference: Mark 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: ta
  text: அவர்கள் உங்களை அழைத்துச் சென்று ஒப்புவிக்கும்போது, என்ன பேச வேண்டும் என்று முன்கூட்டியே கவலைப்படாதீர்கள். அந்த நேரத்தில் உங்களுக்கு எது கொடுக்கப்படுகிறதோ, அதையே பேசுங்கள்[a]. ஏனெனில் பேசுவது நீங்கள் அல்ல; பரிசுத்த ஆவியானவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்ன சொல்ல வேண்டும்’ என்றும் ‘அதையே சொல்லுங்கள்’ என்றும் இயல்பாக மொழிபெயர்க்கலாம். கிரேக்கத்தில் இரு இடங்களிலும் λαλέω (‘பேசு/சொல்’) என்பதன் வடிவங்களே வருவதால், இங்கு ‘பேச’ என்ற சொல் மீட்டுரைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅταν
  choice: அவர்கள் ... ஒப்புவிக்கும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழ்நிலையைத் தொடர்ச்சியான உரையில் இயல்பாக அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘மேலும்’ சேர்க்காமல் தொடர்பு காக்கப்படுகிறது.
- source_word: ἄγωσιν ... παραδιδόντες
  choice: அழைத்துச் சென்று ஒப்புவிக்கும்போது
  rationale: அதிகாரிகளிடம் கொண்டுசெல்லப்பட்டு ஒப்படைக்கப்படும் ஒரே தொடர்ச்சியான நிகழ்வை இயல்பான தமிழில் காட்டுகிறது; παραδίδωμι என்பதைக் குறுகிய ‘காட்டிக்கொடுத்தல்’ என்ற பொருளுக்குள் அடைக்கவில்லை.
- source_word: μὴ προμεριμνᾶτε
  choice: முன்கூட்டியே கவலைப்படாதீர்கள்
  rationale: προ- என்பதன் முன்கூட்டிய கால உணர்வையும், μεριμνάω என்பதன் கவலை அல்லது பதற்ற உணர்வையும் தெளிவாகக் காக்கிறது.
- source_word: τί λαλήσητε ... τοῦτο λαλεῖτε
  choice: என்ன பேச வேண்டும் ... அதையே பேசுங்கள்
  rationale: λαλέω என்ற ஒரே வினைச்சொல் இரு இடங்களிலும் வருவதை ‘பேச’ என்று மீட்டுரைத்து, τοῦτο என்பதன் வலியுறுத்தலை ‘அதையே’ என்று வெளிப்படுத்துகிறது.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: உங்களுக்கு எது கொடுக்கப்படுகிறதோ
  rationale: கொடுப்பவர் யார் என்பதை வெளிப்படையாகச் சேர்க்காமல் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் திறந்த நிபந்தனை உணர்வையும் காக்கிறது.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: அந்த நேரத்தில்
  rationale: ὥρα இங்கு குறிக்கும் தீர்மானமான சந்தர்ப்பத்தை நவீனத் தமிழில் இயல்பாகத் தருகிறது; ‘அந்த மணிநேரத்தில்’ என்பது தேவையற்ற சொல்லுக்குச் சொல் வடிவமாகிவிடும்.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: ஏனெனில் பேசுவது நீங்கள் அல்ல
  rationale: ὑμεῖς மீதுள்ள வலியுறுத்தலையும் அடுத்த எதிர்மறை ஒப்பீட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவரே
  rationale: நவீனத் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் தெளிவான, மரியாதைக்குரிய பெயராக்கம்; ‘-ஏ’ கிரேக்கத்தின் ‘நீங்கள் அல்ல, மாறாக...’ என்ற வலியுறுத்தலைக் காட்டுகிறது.
theological_decisions:
- issue: துன்புறுத்தலின்போது பேசுவதில் சீடர்களுக்கும் பரிசுத்த ஆவியானவருக்கும் உள்ள செயற்பாடு
  choice: சீடர்கள் பேசும்படி கட்டளையிடப்படுகிறார்கள்; எனினும் அந்தத் தருணத்தில் பேசுவதன் அடிப்படைச் செயற்பாடு பரிசுத்த ஆவியானவருக்குரியது என்று உரை கூறும் இரு அம்சங்களும் காக்கப்பட்டன.
  alternative: சீடர்கள் முற்றிலும் செயலற்ற கருவிகள் என்ற இயந்திரக் கட்டளையிடல் வாசிப்பு; அல்லது பரிசுத்த ஆவியானவர் என்பது பொதுவான தெய்வீகத் தூண்டுதல் மட்டுமே என்ற பலவீனமான வாசிப்பு.
  rationale: ‘உங்களுக்குக் கொடுக்கப்படுவது’ என்ற செயப்பாட்டு அமைப்பையும், ‘நீங்கள் அல்ல; பரிசுத்த ஆவியானவரே’ என்ற எதிர்மறை ஒப்பீட்டையும் அப்படியே வைத்ததால், தெய்வீகச் செயற்பாடும் மனிதர்கள் உண்மையாகப் பேசுவதும் இடையிலான உரையின் பதற்றம் தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. தேவையற்ற பழஞ்சொற்கள் தவிர்க்கப்பட்டன; கிரேக்கத்தின் மீட்டுரை, செயப்பாட்டு அமைப்பு, வலியுறுத்தல் ஆகியவை இயன்றவரை காக்கப்பட்டன.
