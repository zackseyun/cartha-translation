  verdict: revise
  source_fidelity: 'The verse is rendered faithfully: the coercive leading and handing over, the prohibition against advance anxiety, the unspecified passive provision, the decisive time, and the contrast between the disciples and the Holy Spirit are all retained. The passive in “உங்களுக்கு எது கொடுக்கப்படுகிறதோ” appropriately leaves the giver unstated.'
