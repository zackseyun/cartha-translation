  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: ta
  text: 'நான் உங்களுக்குச் சொல்வதை, எல்லாருக்கும் சொல்கிறேன்: விழிப்புடன் இருங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழித்திருங்கள்” அல்லது “கவனமாய் இருங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: சொல்வதை
  rationale: நடுநிலை ஒருமை உறவுப்பெயர் இங்கு பொருள்பெயராகப் பயன்படுகிறது. தமிழில் λέγω என்பதோடு இணைத்து ‘சொல்வதை’ என வழங்குவது ‘எதைச் சொல்கிறேனோ அதை’ என்பதன் இயல்பான, சுருக்கமான வடிவம்.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான தொடரிணைப்பாக உள்ளது. தமிழில் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையற்ற வலிமையைக் கொடுக்கலாம்; வாக்கியத் தொடர்ச்சியால் அதன் பணி இயல்பாக வெளிப்படுகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் பன்மை வேற்றுமை வடிவம்; உடனிருந்த சீடர்களை நோக்கிய உரையைத் தெளிவாகக் குறிக்கிறது.
- source_word: λέγω ... λέγω
  choice: சொல்வதை ... சொல்கிறேன்
  rationale: கிரேக்கத்தில் உள்ள சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் தக்கவைத்து, முதலில் ‘உங்களுக்கு’, பின்னர் ‘எல்லாருக்கும்’ என விரியும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: πᾶσιν
  choice: எல்லாருக்கும்
  rationale: சுருக்கமான, பரந்த உள்ளடக்கத்தைத் தரும் இயல்பான நவீனத் தமிழ்; ‘மக்கள்’ போன்ற மூலத்தில் இல்லாத பெயர்ச்சொல் சேர்க்கப்படவில்லை.
- source_word: γρηγορεῖτε
  choice: விழிப்புடன் இருங்கள்
  rationale: நிகழ்காலக் கட்டளைப் பன்மை தொடர்ந்த விழிப்புணர்வைக் கோருகிறது. தமிழில் இது உடல் ரீதியாகத் தூங்காமல் இருப்பதையும் சூழலுக்கேற்ற எச்சரிக்கையையும் உள்ளடக்கக்கூடிய இயல்பான சொற்றொடர்.
theological_decisions:
- issue: இயேசுவின் அறிவுறுத்தலின் வரம்பு
  choice: சீடர்களிடம் கூறப்பட்டது ‘எல்லாருக்கும்’ விரிவுபடுத்தப்படுகிறது.
  alternative: கதைச் சூழலில் உடனிருந்த சீடர்களுக்கு மட்டுமே பொருந்துவதாகக் கொள்ளுதல்.
  rationale: கிரேக்கம் ‘உங்களுக்கு’ என்பதையும் ‘எல்லாருக்கும்’ என்பதையும் வெளிப்படையாக வேறுபடுத்துகிறது. மொழிபெயர்ப்பு இந்தப் பொதுவான விரிவைத் தக்கவைக்கிறது; ‘எல்லார்’ யார் என்பதை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான நேரடி உரை. ‘விழிப்புடன் இருங்கள்’ என்பது பன்மைக் கட்டளையையும் தொடரும் விழிப்பின் கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
