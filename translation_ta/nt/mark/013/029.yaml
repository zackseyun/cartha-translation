review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents οὕτως καὶ ὑμεῖς, the future-contingent force of ὅταν ἴδητε, plural ταῦτα, the imperative γινώσκετε, and the plural θύραις. It appropriately retains the unstated Greek subject of ἐγγύς ἐστιν as an impersonal Tamil ‘அது’ and preserves the personal alternative in a footnote.
  naturalness: 'The wording is generally clear modern Tamil. A small revision improves idiomatic flow: ‘என்று அறிந்துகொள்ளுங்கள்’ is more natural than the nominalized ‘என்பதை அறிந்துகொள்ளுங்கள்’ after a full reported clause, and commas avoid the somewhat intrusive English-style dashes around ‘வாசல்களருகே.’'
  terminology: ‘அப்படியே நீங்களும்,’ ‘அறிந்துகொள்ளுங்கள்,’ and ‘வாசல்களருகே’ are suitable for a dignified modern-standard Tamil Scripture register. The footnote correctly uses ‘எழுவாய்’ for the grammatically implicit subject and does not resolve the referent doctrinally.
  issues:
