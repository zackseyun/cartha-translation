revisions:
- from: அப்படியே நீங்களும், இவை நிகழ்வதைப் பார்க்கும்போது, அது அருகில்—வாசல்களருகேயே—இருக்கிறது[a] என்பதை அறிந்துகொள்ளுங்கள்.
  to: அப்படியே நீங்களும், இவை நிகழ்வதைக் காணும்போது, அது அருகில், வாசல்களருகே இருக்கிறது என்று அறிந்துகொள்ளுங்கள்.[a]
  rationale: The revision is stylistic only. It retains the plural ‘இவை’ and ‘வாசல்கள்,’ the inferential command, and the source text’s deliberate ambiguity regarding what—or who—is near. The footnote remains anchored to the implicit-subject clause and presents ‘அவர்’ only as an alternative.
