    issue: The main clause uses ‘என்பதை அறிந்துகொள்ளுங்கள்’ after a complete finite clause.
    rationale: Although understandable, ‘... இருக்கிறது என்று அறிந்துகொள்ளுங்கள்’ is smoother and more idiomatic in modern Tamil while preserving the Greek imperative and content clause.
  - severity: low
    issue: Em dashes enclosing ‘வாசல்களருகேயே’ are less natural in this Tamil sentence.
    rationale: Simple comma apposition preserves the Greek’s paired expressions (‘near, at the doors’) without importing English punctuation style or altering emphasis.
