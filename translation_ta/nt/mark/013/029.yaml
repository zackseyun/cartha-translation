source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: ta
  text: அப்படியே நீங்களும், இவை நிகழ்வதைக் காணும்போது, அது அருகில், வாசல்களருகே இருக்கிறது என்று அறிந்துகொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அருகில், வாசல்களருகே இருக்கிறார்.” கிரேக்கத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: அப்படியே நீங்களும்
  rationale: οὕτως முந்தைய அத்திமர உவமையுடன் இவ்வாக்கியத்தை இணைக்கிறது; καὶ ὑμεῖς சீடர்களையும் அதற்கொத்த பார்வையாளர்களாக வலியுறுத்துகிறது. ‘அப்படியே நீங்களும்’ என்பது இந்தத் தொடர்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὅταν ἴδητε
  choice: பார்க்கும்போது
  rationale: ὅταν உடன் வரும் இறந்தகால வினைமுற்று சார்ந்த subjunctive எதிர்காலத்தில் நிகழக்கூடிய சூழலைக் குறிக்கிறது. இங்கு ‘பார்க்கும்போது’ என்பது இயல்பாகவும் முன்னறிவிப்பின் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ταῦτα γινόμενα
  choice: இவை நிகழ்வதை
  rationale: ταῦτα என்பதன் பன்மையை ‘இவை’ காக்கிறது; γινόμενα நிகழ்வுகள் நடந்தேறுவதைக் குறிக்கிறது. ‘நிகழ்வதை’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: இது நிகழ்கால கட்டளை வடிவம்; காணும் அடையாளங்களிலிருந்து சரியான முடிவை உணருமாறு கூறுகிறது. ‘அறிந்துகொள்ளுங்கள்’ அந்தக் கட்டளை மற்றும் உய்த்துணரும் பொருள் இரண்டையும் தருகிறது.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: அது அருகில் இருக்கிறது
  rationale: கிரேக்கத்தில் ἐστιν என்பதற்கான எழுவாய் வெளிப்படையாக இல்லை. தமிழ் வாக்கியத்தில் பொதுவாக எதிர்நோக்கப்படும் நிகழ்வு அல்லது நிறைவேற்றத்தைச் சுட்ட ‘அது’ சேர்க்கப்பட்டுள்ளது; தனிப்பட்ட ஆண் எழுவாயான ‘அவர்’ என்பதும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπὶ θύραις
  choice: வாசல்களருகேயே
  rationale: θύραις என்பதன் பன்மையை ‘வாசல்கள்’ காக்கிறது. ‘-அருகேயே’ என்பது மிக நெருக்கமாக இருப்பதைக் காட்டும் கிரேக்கச் சொல்லாட்சியின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐστιν (‘இருக்கிறது’) என்பதன் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் பொதுவான நிகழ்வு அல்லது நிறைவேற்றத்தைக் குறிக்கும் ‘அது’ பயன்படுத்தப்பட்டது.
  alternative: ‘அவர் அருகில் இருக்கிறார்’ என்று தனிப்பட்ட எழுவாயுடன் மொழிபெயர்க்கலாம்.
  rationale: கிரேக்க உரை எழுவாயை வெளிப்படையாகக் கூறவில்லை. உடனடியான சூழலில் அடையாளங்கள் முன்னறிவிக்கப்பட்ட நிறைவேற்றம் நெருங்கியிருப்பதைச் சுட்டலாம்; அதேவேளை பலர் இதை மனிதகுமாரனைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள். ஒரு குறிப்பிட்ட இறையியல் அடையாளத்தை உரையில் கட்டாயப்படுத்தாமல், மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய உவமையுடனான தொடர்பு, பன்மை ‘வாசல்கள்,’ கட்டளைத் தொனி, மற்றும் மறைமுக எழுவாயின் இறையியல் தெளிவின்மை ஆகியவை காக்கப்பட்டுள்ளன.
