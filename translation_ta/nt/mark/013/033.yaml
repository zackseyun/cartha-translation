  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: ta
  text: எச்சரிக்கையாக இருங்கள்; விழித்திருங்கள். ஏனெனில், அந்த நேரம்[a] எப்போது என்று உங்களுக்குத் தெரியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நியமிக்கப்பட்ட நேரம்’ அல்லது ‘காலக்கட்டம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் καιρός பெரும்பாலும் தீர்மானகரமான அல்லது நியமிக்கப்பட்ட ஒரு நேரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: இங்கு பார்ப்பதைக் குறிக்காமல், ஆபத்தை உணர்ந்து கவனமாக இருக்கும்படி கூறும் பன்மை ஏவல்; அடுத்துவரும் ἀγρυπνεῖτε என்பதிலிருந்து வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀγρυπνεῖτε
  choice: விழித்திருங்கள்
  rationale: விழித்திருத்தல் என்ற உருவகத்தையும் தொடர்ந்து கண்காணிக்கும் விழிப்புணர்வையும் சுருக்கமாகத் தரும் பன்மை ஏவல்.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாது
  rationale: அறியாமையைக் குறிக்கும் எதிர்மறை வினையைத் தேவையற்ற விரிவாக்கமின்றி நேரடியாக மொழிபெயர்க்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைகளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: πότε
  choice: எப்போது
  rationale: காலத்தைப் பற்றிய கேள்விப்பொருளை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: ὁ καιρός
  choice: அந்த நேரம்
  rationale: καιρός குறிக்கும் குறிப்பிட்ட, தீர்மானகரமான காலப்புள்ளியை உணர்த்துகிறது; ‘நியமிக்கப்பட்ட நேரம்’ என்று பிரதான உரையில் மிகுதியாக விளக்குவதைத் தவிர்க்கிறது.
- source_word: ἐστιν
  choice: என்று
  rationale: தமிழின் மறைமுகக் கேள்வி அமைப்பில் ‘எப்போது என்று தெரியாது’ என்பதே இயல்பான வடிவம்; கிரேக்க இணைப்புவினையின் பணி இதில் உள்ளடங்குகிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் καιρός என்பதன் நுண்பொருள்
  choice: அந்த நேரம்
  alternative: நியமிக்கப்பட்ட நேரம்; காலக்கட்டம்
  rationale: இச்சொல் ஒரு தீர்மானகரமான அல்லது நியமிக்கப்பட்ட தருணத்தைக் குறிக்கக்கூடும். பிரதான உரை அதன் குறிப்புத்தன்மையைப் பாதுகாத்தாலும், அது நியமிக்கப்பட்டது என்று வெளிப்படையாகச் சேர்க்காமல் கிரேக்கத்தின் பொருள் பரப்பைத் திறந்துவைக்கிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. இரு ஏவல்களின் வேறுபாடு ‘எச்சரிக்கையாக இருங்கள்; விழித்திருங்கள்’ என்று பாதுகாக்கப்பட்டுள்ளது.
