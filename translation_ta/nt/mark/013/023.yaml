  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: ta
  text: ஆனால் நீங்கள் எச்சரிக்கையாக இருங்கள்[a]; எல்லாவற்றையும் உங்களுக்கு முன்கூட்டியே சொல்லியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘விழிப்புடன் இருங்கள்’ அல்லது ‘கவனமாக இருங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘எல்லாவற்றையும் உங்களுக்கு முன்னதாகவே கூறியுள்ளேன்’ அல்லது ‘எல்லாவற்றையும் குறித்து உங்களை முன்கூட்டியே எச்சரித்திருக்கிறேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: வெளிப்படையாக இடம்பெற்றுள்ள பன்மை இரண்டாம் நபர் பதிலிடுபெயர், முந்திய கருத்தோடு உள்ள வேறுபாட்டையும் சீடர்கள்மீதான வலியுறுத்தலையும் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்திய எச்சரிக்கையிலிருந்து சீடர்களின் பொறுப்பை வலியுறுத்தும் மாறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: நிகழ்காலப் பன்மை கட்டளை வடிவம் தொடர்ந்து விழிப்புடன் இருக்குமாறு எச்சரிக்கிறது; வெறும் ‘பாருங்கள்’ என்பதைவிட இச்சூழலில் இந்தப் பொருள் இயல்பானது.
- source_word: προείρηκα
  choice: முன்கூட்டியே சொல்லியிருக்கிறேன்
  rationale: முன்பே சொல்லப்பட்டு இப்போதும் பொருத்தமுடையதாக இருக்கும் செய்தியை நிறைவுக்கால வடிவம் குறிக்கிறது; πρό- முன்னதாகச் சொல்லுதலைத் தெளிவாக்குகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: பேசுதல் வினையின் மறைமுகச் செயப்படுபொருளான பன்மை இரண்டாம் நபரை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மை வடிவத்தின் விரிவான பொருளை இயல்பான தமிழில் தருகிறது; அதன் சூழல்சார் வரம்பை மொழிபெயர்ப்பிலேயே குறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் எச்சரிப்பும் முன்கூட்டிய அறிவிப்பின் பரப்பும்
  choice: ‘எல்லாவற்றையும்’ என்று மொழிபெயர்த்து, இயேசு முன்கூட்டியே தெரிவித்ததன் முழுமையான ஒலியைப் பாதுகாத்தல்
  alternative: ‘இவை அனைத்தையும்’ என்று கூறி உடனடியான முந்திய எச்சரிக்கைகளுக்கு மட்டும் வெளிப்படையாக வரையறுத்தல்
  rationale: πάντα விரிவாக உள்ளது; அது எல்லா எதிர்கால விவரங்களையும் முற்றிலும் தெரிவித்தார் என்ற கூற்றா, அல்லது இச்சூழலுக்குத் தேவையான அனைத்தையுமா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், சூழல் தீர்மானிக்க விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எச்சரிக்கையாக இருங்கள்’ அவசரத்தையும் தொடர்ச்சியான விழிப்பையும் தருகிறது; ‘சொல்லியிருக்கிறேன்’ நிறைவுக்காலத்தின் தற்போதைய பொருத்தத்தைப் பாதுகாக்கிறது.
