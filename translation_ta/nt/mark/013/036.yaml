  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: ta
  text: அவர் திடீரென்று வந்து, நீங்கள் தூங்கிக்கொண்டிருப்பதைக் காண நேராதபடி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: திடீரென்று
  rationale: எதிர்பாராத, திடீர் வருகையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: καθεύδοντας
  choice: தூங்கிக்கொண்டிருப்பதை
  rationale: தொடர்ந்து கொண்டிருக்கும் நிலையைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: μὴ ... εὕρῃ
  choice: காணாதபடி விழிப்புடன் இருங்கள்
  rationale: கிரேக்கத்தில் இது முந்தைய வசனத்தின் ‘விழிப்புடன் இருங்கள்’ என்ற கட்டளையைச் சார்ந்த நோக்க/எச்சரிக்கைத் துணைவாக்கியம். தமிழில் தனி வசனமாக முழுமையாகவும் தெளிவாகவும் இருக்க, அந்த மறைமுகக் கட்டளை வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவர்’ என்பவரின் அடையாளம்
  choice: அவர்
  alternative: எஜமான்
  rationale: கிரேக்க மூலத்தில் இவ்வசனத்தில் கர்த்தா வெளிப்படையாக இல்லை; முந்தைய சூழலிலிருந்து பெறப்படும் ஆண்பால் ஒருமை எழுவாயை ‘அவர்’ என்று வைத்ததால் தேவையற்ற விளக்கச் சேர்க்கை தவிர்க்கப்படுகிறது.
- issue: தூக்கம் நேரடியா அல்லது உருவகமா
  choice: தூங்கிக்கொண்டிருப்பது
  alternative: ஆவிக்குரிய அலட்சியத்தில் இருப்பது
  rationale: மூலத்தின் உருவகச் சொல்லை அப்படியே தக்கவைத்து, அதன் பொருளை ஒரே விளக்கத்துக்குள் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன, எளிதில் புரியும், மரியாதையான தமிழ். வசனம் கிரேக்கத்தில் முந்தைய கட்டளையைச் சார்ந்த துணைவாக்கியம் என்பதால், தனியாக வாசிக்கத் தேவையான ‘விழிப்புடன் இருங்கள்’ சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது; சொற்றொடரின் எச்சரிக்கைத் தன்மை பாதுகாக்கப்பட்டுள்ளது.
