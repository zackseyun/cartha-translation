  naturalness: ‘அவர் திடீரென்று வந்து, நீங்கள் தூங்கிக்கொண்டிருப்பதைக் காண நேராதபடி’ என்பது நவீனத் தமிழில் இயல்பான எச்சரிக்கைத் துணைவாக்கியமாக உள்ளது. இது மூலத்தில் உள்ள முன்வசனத்தைச் சார்ந்த தன்மையையும் காக்கிறது.
