    issue: ‘அப்படியே’ சேர்க்கப்பட்டுள்ளது.
    rationale: πατὴρ τέκνον என்ற இரண்டாம் உட்பிரிவில் ‘likewise/as such’ என்ற சொல்லோ வலியுறுத்தலோ இல்லை. வினையின் மறைமுக மீளுருவாக்கம் மட்டும் போதுமானது.
