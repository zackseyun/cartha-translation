review_pass:
  verdict: revise
  source_fidelity: 'கருத்து முழுவதும் மூலத்துடன் ஒத்துள்ளது: குடும்ப உறுப்பினர்கள் ஒருவரை ஒருவர் மரணத்திற்குக் கையளிப்பதும், பிள்ளைகள் பெற்றோருக்கு எதிராக எழுந்து அவர்களை மரணத்திற்கு உட்படுத்துவதும் தெளிவாக உள்ளது. ஆனால் ‘அப்படியே’ என்பதற்கு கிரேக்கத்தில் இணையான சொல் இல்லை; அதை நீக்குவது நல்லது. ‘சாவுக்கு’ என்பதற்குப் பதில் ‘மரணத்திற்கு’ என்பது மூலத்தின் தீவிரத்திற்கும் நடைக்கும் நெருக்கமானது.'
  naturalness: ‘தந்தையும் ... ஒப்புக்கொடுப்பார்’ என்ற மரியாதைப் பன்மை வினை, பொதுவான ஒருமை ‘சகோதரன் ... ஒப்புக்கொடுப்பான்’ என்பதோடு இணையாக இல்லை. ‘ஒப்படைப்பான்’ என்ற நவீனத் தரநிலைச் சொல் இயல்பானதும் தெளிவானதும். இறுதியில் ‘மரணத்திற்கு உட்படுத்துவார்கள்’ என்பது ‘சாகடிப்பார்கள்’ என்பதைக் காட்டிலும் கண்ணியமான பொதுநடையில் ‘put to death’ என்ற பொருளைச் சரிவரத் தருகிறது.
  terminology: சகோதரன், தந்தை, பிள்ளை, பெற்றோர் ஆகியவை கிரேக்கத்தின் பாலின மற்றும் எண்ணுக் குறிப்புகளைத் தகுந்தவாறு காக்கின்றன. παραδώσει என்பதற்கு ‘ஒப்படைப்பான்’ முதன்மை உரையில் நேரடியான பொருளைத் தருகிறது; ‘காட்டிக்கொடுப்பான்’ அடிக்குறிப்பில் சூழல்சார் மாற்றாகத் தக்கது.
  issues:
