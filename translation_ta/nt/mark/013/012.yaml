source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: ta
  text: சகோதரன் தன் சகோதரனை மரணத்திற்கு ஒப்படைப்பான்[a]; தந்தை தன் பிள்ளையை ஒப்படைப்பான். பிள்ளைகள் பெற்றோருக்கு எதிராக எழுந்து, அவர்களை மரணத்திற்கு உட்படுத்துவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காட்டிக்கொடுப்பான்.’ கிரேக்க வினைச்சொல் ‘ஒப்படை,’ ‘கையளி,’ அல்லது இச்சூழலில் ‘காட்டிக்கொடு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களைக் கொன்றுவிடுவார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ஒப்புக்கொடுப்பான் / ஒப்புக்கொடுப்பார்
  rationale: அதிகாரிகளிடமோ மரணத்திற்கோ ஒருவரை ஒப்படைக்கும் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘துரோகம் செய்வான்’ என்ற சூழல்சார் உட்பொருளை முதன்மை உரையில் மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: சகோதரன் தன் சகோதரனை
  rationale: கிரேக்கத்தின் ஆண்பால் குடும்பச் சொற்களையும் கடுமையான மறுமொழியையும் தக்கவைத்து, இயல்பான தமிழுக்காக ‘தன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: εἰς θάνατον
  choice: சாவுக்கு
  rationale: மரணமே ஒப்புக்கொடுத்தலின் முடிவு அல்லது நோக்கம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πατὴρ τέκνον
  choice: தந்தையும் தன் பிள்ளையை
  rationale: πατήρ என்பதற்கு ‘தந்தை’ என்றும், பாலினத்தால் வரையறுக்கப்படாத τέκνον என்பதற்கு ‘பிள்ளை’ என்றும் மொழிபெயர்க்கிறது; கிரேக்கத்தில் விடுபட்டுள்ள வினை தமிழில் தெளிவுக்காக மீண்டும் உணர்த்தப்பட்டுள்ளது.
- source_word: ἐπαναστήσονται
  choice: எதிராக எழும்பி
  rationale: பகைமையுடன் எதிர்த்து எழுவதைக் காட்டும் கிரேக்க உருவகத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: தாய் தந்தை இருவரையும் குறிக்கும் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: θανατώσουσιν αὐτούς
  choice: அவர்களைச் சாகடிப்பார்கள்
  rationale: அவர்களின் மரணத்தைச் செயற்படுத்துவார்கள் என்ற வினையின் வலிமையை இயல்பான தமிழில் தருகிறது; வெறும் எதிர்ப்பாக மெலிதாக்கவில்லை.
theological_decisions:
- issue: குடும்ப உறவுச் சொற்களின் பாலினத் துல்லியம்
  choice: ἀδελφός, πατήρ ஆகியவற்றை ‘சகோதரன்’, ‘தந்தை’ என்றும், τέκνον, γονεῖς ஆகிய பரந்த சொற்களை ‘பிள்ளை’, ‘பெற்றோர்’ என்றும் வழங்குதல்
  alternative: முதல் இரண்டு சொற்களையும் பாலினப் பொதுமைப்படுத்தி ‘உடன்பிறந்தவர்’, ‘பெற்றவர்’ என வழங்குதல்
  rationale: மூலத்தில் குறிப்பாக உள்ள ஆண்பால் வடிவங்களைப் பாதுகாக்கிறது; அதேவேளையில் மூலமே பரந்த பொருளில் பயன்படுத்தும் சொற்களைத் தேவையின்றி ஆண்பாலாக்கவில்லை.
- issue: παραδίδωμι என்பதிலுள்ள ஒப்படைத்தல் மற்றும் துரோகம் என்ற சூழல்சார் பதற்றம்
  choice: முதன்மை உரையில் ‘ஒப்புக்கொடுப்பான்’; அடிக்குறிப்பில் ‘காட்டிக்கொடுப்பான்’
  alternative: முதன்மை உரையிலேயே ‘காட்டிக்கொடுப்பான்’
  rationale: நேரடியான ஒப்படைத்தலை முதன்மைப்படுத்தி, குடும்பத் துரோகத்தின் சூழல்சார் நிழற்பொருளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் இரு உட்பிரிவுகளின் இணை அமைப்பும் குடும்பத்துக்குள் நிகழும் துரோகத்தின் அதிர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன.
