revisions:
- from: சகோதரன் தன் சகோதரனைச் சாவுக்கு ஒப்புக்கொடுப்பான்[a]; தந்தையும் தன் பிள்ளையை அப்படியே ஒப்புக்கொடுப்பார். பிள்ளைகள் பெற்றோருக்கு எதிராக எழும்பி, அவர்களைச் சாகடிப்பார்கள்[b].
  to: சகோதரன் தன் சகோதரனை மரணத்திற்கு ஒப்படைப்பான்[a]; தந்தை தன் பிள்ளையை ஒப்படைப்பான். பிள்ளைகள் பெற்றோருக்கு எதிராக எழுந்து, அவர்களை மரணத்திற்கு உட்படுத்துவார்கள்[b].
  rationale: மூலத்தின் இணை அமைப்பையும் குடும்ப உறவுச் சொற்களின் துல்லியத்தையும் காத்துக்கொண்டு, மூலத்தில் இல்லாத ‘அப்படியே’ நீக்கப்பட்டது. ‘ஒப்படைப்பான்’ மற்றும் ‘மரணத்திற்கு’ மூலம் παραδώσει ... εἰς θάνατον-இன் நேரடியான பொருள் தரப்பட்டுள்ளது. இறுதிப் பிரிவில் θανατώσουσιν என்பதன் வலிமையைப் பாதுகாக்கும், கண்ணியமான நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் உரிய கிரேக்க வினைச்சொற்களிலேயே தொடர்கின்றன.
