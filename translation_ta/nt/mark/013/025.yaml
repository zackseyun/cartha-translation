id: MRK.13.25
reference: Mark 13:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: ta
  text: வானத்திலிருந்து[a] நட்சத்திரங்கள் விழுந்துகொண்டிருக்கும்; வானங்களில் உள்ள வல்லமைகள்[b] அசைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானவெளியிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க οὐρανός சூழலுக்கேற்ப ‘வானம்,’ ‘வானவெளி,’ அல்லது ‘பரலோகம்’ என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வானங்களில் உள்ள வல்லமைகள்’ என்பது விண்ணுலக வல்லமைகள், பேரண்ட ஆற்றல்கள், அல்லது வானங்களின் அமைப்புகளைக் குறிக்கலாம்; கிரேக்கச் சொற்றொடர் இதைவிடக் குறிப்பாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: நட்சத்திரங்கள்
  rationale: வானியல் சார்ந்த வழக்கமான பொருளை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἔσονται ... πίπτοντες
  choice: விழுந்துகொண்டிருக்கும்
  rationale: எதிர்கால εἰμί உடன் நிகழ்காலப் பெயரெச்சம் சேர்ந்துள்ள அமைப்பின் தொடர்ச்சியான அல்லது காட்சித் தெளிவுள்ள எதிர்காலச் செயலைத் தக்கவைக்கிறது; வெறுமனே ‘விழும்’ என்பதைக் காட்டிலும் அதன் கூறுநிலையை நன்றாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பதன் ‘வானம்/பரலோகம்’ என்ற பொருள் நெகிழ்வைத் தமிழின் ‘வானம்’ இயல்பாகத் தாங்குகிறது; சூழலில் நட்சத்திரங்கள் குறிக்கப்படுவதால் இது தெளிவாகவும் உயர்ந்த பேரண்ட நடையுடனும் உள்ளது.
- source_word: δυνάμεις
  choice: வல்லமைகள்
  rationale: விண்ணுலக உயிர்கள், பேரண்ட ஆற்றல்கள், அல்லது வானங்களின் அமைப்புகள் ஆகியவற்றில் ஒன்றாகக் குறுக்காமல், மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: வானங்களில் உள்ள
  rationale: τοῖς οὐρανοῖς என்ற பன்மையைத் தக்கவைத்து, கூற்றின் பேரண்ட அளவையும் பிரதிபலிக்கிறது.
- source_word: σαλευθήσονται
  choice: அசைக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் ‘குலுக்கப்படுதல்/நிலைதடுமாறச் செய்யப்படுதல்’ என்ற அடிப்படைப் பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘வானங்களில் உள்ள வல்லமைகள்’ என்பதன் குறிப்பு
  choice: அவை விண்ணுலக உயிர்களா, பேரண்ட ஆற்றல்களா, வானியல் அமைப்புகளா என்று குறிப்பிடாமல் பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விண்ணுலக அதிகாரங்கள்’ அல்லது ‘வானங்களின் ஆற்றல்கள்’ என்று குறிப்பான பொருளில் மொழிபெயர்த்தல்.
  rationale: கிரேக்கச் சொற்றொடர் பலவிதமாகப் புரிந்துகொள்ளக்கூடியது; வெளிப்படுத்தல் சார்ந்த இச்சூழலில் மூல உரை தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் அதேவேளையில் வெளிப்படுத்தல் உரைக்குரிய கண்ணியமான பேரண்ட நடையைப் பேணுகிறது. ‘விழுந்துகொண்டிருக்கும்’ என்பது தொடர்ச்சியான எதிர்காலக் காட்சியை வெளிப்படுத்துகிறது; ‘வல்லமைகள்’ திட்டமிட்டு விளக்கத் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
