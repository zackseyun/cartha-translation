source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: ta
  text: ஆனால், அந்த நாளையோ நேரத்தையோ குறித்து ஒருவருக்கும் தெரியாது—பரலோகத்தில் உள்ள தூதர்களுக்குக்கூட தெரியாது; மகனுக்கும் தெரியாது[a]; தந்தைக்கு மட்டுமே தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகனுக்கும் தெரியாது’ என்பதை மகன் மனிதராக வந்த பணியையோ அவரது மனித இயல்பையோ குறித்ததாகச் சில விளக்கவுரையாளர்கள் புரிந்துகொள்கிறார்கள். அந்த விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், இந்த மொழிபெயர்ப்பு கிரேக்க உரையின் சொற்களை அப்படியே காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ஆனால், … குறித்து
  rationale: περί உடன் வரும் மரபுவேற்றுமை பேசுபொருளை அறிமுகப்படுத்துகிறது; δέ முந்தைய கருத்திலிருந்து மென்மையான மாற்றத்தையோ முரண்பாட்டையோ குறிக்கிறது. தமிழில் ‘ஆனால், … குறித்து’ இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: அந்த நாளையோ வேளையையோ
  rationale: ἡμέρα என்பது ‘நாள்’; ὥρα இங்கு குறிப்பிட்ட நேரம் அல்லது வேளையைக் குறிக்கிறது. ‘வேளை’ என்பது ‘மணிநேரம்’ என்பதைவிட இச்சூழலில் இயல்பானதும் தேவையற்ற துல்லியத்தைத் தவிர்ப்பதும் ஆகும். ‘-ஓ … -ஓ’ அமைப்பு இரு மாற்றுகளையும் தெளிவாகக் காக்கிறது.
- source_word: οὐδεὶς οἶδεν
  choice: ஒருவருக்கும் தெரியாது
  rationale: οὐδείς முழுமையான மறுப்பைக் குறிக்கிறது; οἶδα வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்காலப் பொருளில் ‘அறிதல்’ என வருகிறது. தமிழில் ‘ஒருவருக்கும் தெரியாது’ இயல்பான தற்போதைய நிலையைத் தெரிவிக்கிறது.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: பரலோகத்தில் உள்ள தூதர்களுக்குக்கூட தெரியாது
  rationale: οὐδέ வலியுறுத்தப்பட்ட தொடர்மறுப்பைத் தருவதால் ‘-க்குக்கூட’ அதன் ‘அவர்களுக்கும்கூட இல்லை’ என்ற உச்சநிலையை வெளிப்படுத்துகிறது. ἐν οὐρανῷ இடத்தைக் குறிக்கும் வகையில் தூதர்களை விவரிக்கிறது.
- source_word: οὐδὲ ὁ υἱός
  choice: மகனுக்கும் தெரியாது
  rationale: மீண்டும் வரும் οὐδέ மறுப்புப் பட்டியலைத் தொடர்கிறது. ὁ υἱός என்ற கிறிஸ்துவியல் பட்டம் விளக்கவுரையின்றி ‘மகன்’ என்று நேரடியாக வைக்கப்பட்டுள்ளது.
- source_word: εἰ μὴ ὁ πατήρ
  choice: தந்தைக்கு மட்டுமே தெரியும்
  rationale: மறுப்புக்குப் பின் வரும் εἰ μή ஒரே விதிவிலக்கைக் குறிக்கிறது. ‘மட்டுமே’ அந்தத் தனித்த விலக்கையும் பிரத்தியேகத்தையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: அந்த நாளையோ வேளையையோ மகன் அறியவில்லை என்ற கிறிஸ்துவியல் கூற்று
  choice: ‘மகனுக்கும் தெரியாது’ என்ற கிரேக்க வாசகத்தை மென்மைப்படுத்தாமலும் விளக்கச் சேர்க்காமலும் நேரடியாக வைத்தல்
  alternative: ‘மனித இயல்பில் மகனுக்கும் தெரியாது’ அல்லது ‘மனிதராக இருந்தபோது மகனுக்கும் தெரியாது’ போன்ற விளக்கத் தகுதிகளை மூலவசனத்துக்குள் சேர்த்தல்
  rationale: οὐδὲ ὁ υἱός என்று கிரேக்க உரை வெளிப்படையாகக் கூறுகிறது. அதன் உண்மையான இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்காமல் பாதுகாக்க வேண்டும்; சாத்தியமான கிறிஸ்துவியல் ஒருங்கிணைப்பு அடிக்குறிப்பில் மட்டும் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வேளை’ என்பது இச்சூழலில் ὥρα-வின் நேரப்பொருளை ‘மணிநேரம்’ என அளவுக்கு மீறிக் குறிப்பாக்காமல் தருகிறது. நீள்கோடு பொதுமறுப்புக்குப் பின் வரும் வலியுறுத்தப்பட்ட பட்டியலைத் தெளிவாக்குகிறது.
