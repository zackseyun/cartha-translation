  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: ta
  text: '“உறுதியாக உங்களுக்குச் சொல்கிறேன்: இவையெல்லாம் நிகழும்வரை இந்தத் தலைமுறை நிச்சயமாக மறைந்துபோகாது[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த மக்கள்’ அல்லது ‘இந்த இனம்’ என்றும் மொழிபெயர்க்கலாம்; γενεά என்ற கிரேக்கச் சொல் விரிவான பொருள்களையும் ஏற்கக்கூடும். எனினும், இங்கு ‘தலைமுறை’ என்பதே மிகவும் இயல்பான மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: ‘நிச்சயமாக மறைந்துபோகாது’ என்பது கிரேக்கத்தில் உள்ள வலியுறுத்தப்பட்ட மறுப்பை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உறுதியாக
  rationale: ஒரு கூற்றை ஆணித்தரமாகவும் அதிகாரத்தோடும் அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், நவீன தமிழில் இயல்பாக அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியாகக் கேட்போரிடம் கூறும் கிரேக்கச் சொற்றொடரின் பொருளையும் நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐ μὴ παρέλθῃ
  choice: நிச்சயமாக மறைந்துபோகாது
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக ... ஆகாது’ எனத் தெளிவாகக் காட்டுகிறது; παρέρχομαι இங்கு ஒரு தலைமுறை காலப்போக்கில் இல்லாமற்போவதைக் குறிக்கிறது.
- source_word: ἡ γενεὰ αὕτη
  choice: இந்தத் தலைமுறை
  rationale: உடனடிச் சூழலில் γενεά என்பதன் மிக இயல்பான காலம்சார் பொருளைக் காக்கிறது; விவாதத்திற்குரிய விளக்கத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: μέχρις οὗ
  choice: நிகழும்வரை
  rationale: ஒரு கால எல்லையைச் சுட்டும் ‘வரை’ அமைப்பு தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ταῦτα πάντα
  choice: இவையெல்லாம்
  rationale: ‘இந்த எல்லா காரியங்களும்’ என்ற பன்மை மற்றும் முழுமையின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γένηται
  choice: நிகழும்
  rationale: குறிப்பிடப்பட்ட சம்பவங்கள் நடந்தேறுவதைக் குறிக்கும் γίνομαι என்பதற்கு நவீன தமிழில் தெளிவான இணை.
theological_decisions:
- issue: இறுதிக்கால உரையில் ‘இந்தத் தலைமுறை’ (ἡ γενεὰ αὕτη) என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘இந்தத் தலைமுறை’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இந்த மக்கள்’ அல்லது ‘இந்த இனம்’; அடையாளங்களைக் காணும் எதிர்காலத் தலைமுறை
  rationale: கிரேக்கச் சொற்றொடரின் மிக இயல்பான வாசிப்பு ‘இந்தத் தலைமுறை’ என்பதே. இது விளக்கவியலில் பெரிதும் விவாதிக்கப்படுவதால், குறிப்பிட்ட ஓர் இறுதிக்காலக் கோட்பாட்டைத் தேர்ந்தெடுக்காமல் மூலத்தின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. ‘உறுதியாக’ மற்றும் ‘நிச்சயமாக ... ஆகாது’ ஆகியவை மூலத்தின் ஆணித்தரத்தையும் வலியுறுத்தப்பட்ட மறுப்பையும் தெளிவாகக் காக்கின்றன; ‘இந்தத் தலைமுறை’ என்ற விவாதத்திற்குரிய சொற்றொடர் விளக்கத்தால் மென்மையாக்கப்படவில்லை.
