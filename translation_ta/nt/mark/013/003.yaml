  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: ta
  text: 'அவர் ஆலயத்திற்கு[a] எதிரே ஒலிவ மலையில் அமர்ந்திருந்தபோது, பேதுருவும் யாக்கோபும் யோவானும் அந்திரேயாவும் அவரிடம் தனியாகக் கேட்டுக்கொண்டிருந்தார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் உள்ள ἱερόν என்ற சொல், உட்புறப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: அவர் … அமர்ந்திருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த சூழ்நிலைச் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லுடன் கூடிய genitive absolute அமைப்பை இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலையில்
  rationale: இங்கு εἰς, நிலையைச் சுட்டும் சூழலில் இடப்பொருளில் வருகிறது; ‘ஒலிவ மலையில்’ என்பது இயல்பான புவியியல் குறிப்பு.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: ஆலயத்திற்கு எதிரே
  rationale: κατέναντι என்பது எதிரே அல்லது நேருக்கு நேர் இருப்பதைக் குறிக்கிறது. ἱερόν முழு ஆலய வளாகத்தைக் குறிக்கக்கூடும்; வாசிப்பில் இயல்பாக இருக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டு, நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπηρώτα
  choice: கேட்டார்கள்
  rationale: கிரேக்க இறந்தகால imperfect வடிவம் நடந்துகொண்டிருந்த அல்லது தொடங்கிய விசாரணையைச் சுட்டலாம். தமிழில் அடுத்த வசனத்தில் நேரடிக் கேள்வி வருவதால், ‘கேட்டார்கள்’ என்பது செயலை தேவையற்ற தொடர்ச்சி அல்லது மீளச்செயல் உணர்வின்றி இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: மற்றவர்களிடமிருந்து விலகித் தனிப்பட்ட முறையில் கேட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: பேதுருவும் யாக்கோபும் யோவானும் அந்திரேயாவும்
  rationale: பெயர்கள் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; ஒவ்வொரு பெயருடனும் ‘உம்’ சேர்ப்பது கிரேக்கத்தின் தொடர்ச்சியான καί இணைப்புகளை இயல்பான தமிழில் பிரதிபலிக்கிறது.
