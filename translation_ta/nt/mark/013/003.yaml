  naturalness: The sentence is clear and uses an appropriate modern standard Tamil biblical register. The revised imperfect construction remains natural in this narrative context and suitably introduces the direct question in the following verse.
  terminology: «ஒலிவ மலை», «ஆலயம்», and the established Tamil forms of the disciples’ names are suitable. The footnote correctly distinguishes ἱερόν, the temple complex, from the inner sanctuary; its anchor is correctly placed after «ஆலயம்».
