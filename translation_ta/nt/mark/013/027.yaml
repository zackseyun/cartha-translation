source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: ta
  text: அப்போது அவர் தேவதூதர்களை அனுப்பி, தேர்ந்தெடுக்கப்பட்டவர்களை[a] நான்கு காற்றுகளிலிருந்தும்[b], பூமியின் எல்லைமுதல் வானத்தின் எல்லைவரைக்கும்[c] ஒன்றுகூட்டுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “தேர்ந்துகொள்ளப்பட்டவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நான்கு காற்றுகள்” என்பது எல்லாத் திசைகளையும் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: இறுதித் தொடரை விளக்கமாக, “பூமியின் கடைக்கோடியிலிருந்து வானத்தின் கடைக்கோடிவரை” அல்லது “வானத்தின் ஒரு எல்லையிலிருந்து மறு எல்லைவரை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முடிவுக்கால உரையில் நிகழ்வுகளின் காலவரிசையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀποστελεῖ
  choice: அனுப்பி
  rationale: எதிர்காலத்தில் தூதர்களை அனுப்பும் செயலைக் குறிக்கிறது; தொடர்ந்துவரும் ஒன்றுகூட்டும் செயலுடன் தமிழ் வினையெச்சத்தால் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: ἀγγέλους
  choice: தேவதூதர்களை
  rationale: இந்த வெளிப்பாட்டுக் காட்சி சார்ந்த சூழலில் மனிதச் செய்தியாளர்கள் அல்ல, வானுலகத் தூதர்களே குறிக்கப்படுகின்றனர்.
- source_word: ἐπισυνάξει
  choice: ஒன்றுகூட்டுவார்
  rationale: சிதறியிருப்பவர்களை ஒரே இடத்தில் சேர்த்தல் என்ற வினையின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκλεκτούς
  choice: தேர்ந்தெடுக்கப்பட்டவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடை, தேர்ந்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. பின்னாளின் குறிப்பிட்ட இறையியல் சொல்லாட்சியைத் திணிக்காமல் மூலப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: நான்கு காற்றுகளிலிருந்தும்
  rationale: எல்லாத் திசைகளிலிருந்தும் என்பதைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: ἀπ’ ἄκρου γῆς
  choice: பூமியின் எல்லைமுதல்
  rationale: ἄκρον என்பதன் எல்லை அல்லது கடைக்கோடி என்ற இடவியல் கருத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: வானத்தின் எல்லைவரைக்கும்
  rationale: முந்தைய தொடருக்கு இணையான அமைப்பைப் பாதுகாத்து, முழுப் பரப்பையும் குறிக்கும் இருமுனை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: καὶ τότε ... καὶ
  choice: அப்போது ... அனுப்பி ... ஒன்றுகூட்டுவார்
  rationale: தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக தொடக்க இணைப்புச் சொல் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; இரு செயல்களின் தொடர்ச்சியும் வினையெச்ச அமைப்பால் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் ἐκλεκτούς என்பதன் மொழிபெயர்ப்பு
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  alternative: தெரிந்துகொள்ளப்பட்டவர்கள்; தேர்ந்தவர்கள்
  rationale: இவர்கள் யாரால், எவ்வகையில் தேர்ந்தெடுக்கப்பட்டனர் என்பதை இந்த வசனம் விரிவாக விளக்கவில்லை. ஆகவே குறிப்பிட்ட பிற்காலக் கோட்பாட்டு அமைப்பைச் சேர்க்காமல், மூலத்தின் இறையியல் நிறையையும் திறந்த தன்மையையும் காக்கிறது.
- issue: ஒன்றுகூட்டுதலின் பரப்பைக் குறிக்கும் உருவகம்
  choice: நான்கு காற்றுகளிலிருந்தும், பூமியின் எல்லைமுதல் வானத்தின் எல்லைவரைக்கும்
  alternative: நான்கு திசைகளிலிருந்தும்; பூமியின் ஒரு கடைக்கோடியிலிருந்து வானத்தின் மறுகடைக்கோடிவரை; வானத்தின் ஒரு எல்லையிலிருந்து மறு எல்லைவரை
  rationale: கிரேக்க உரை திசைகளைக் குறிக்கும் மரபுத்தொடரையும் முழுப் பரப்பைக் குறிக்கும் இருமுனை உருவகத்தையும் இணைக்கிறது. மொழிபெயர்ப்பு அதை வழக்கமான ஒரு விளக்கவுரையாகச் சுருக்காமல் பாதுகாக்கிறது.
- issue: οὐρανός என்பதன் இடவியல் பொருள்
  choice: வானம்
  alternative: ஆகாயம்; பரலோகம்
  rationale: இங்கு சொல் இடவியல் எல்லையைச் சுட்டுகிறது; கடவுளின் வாசஸ்தலத்தைப் பற்றிய தனிப்பட்ட கோட்பாட்டை வெளிப்படையாகக் கூறுவதில்லை. ‘வானம்’ இந்தத் திறந்த தன்மையை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தேவதூதர்கள்’ என்பது சூழலுக்கேற்ற தெளிவைத் தருகிறது. ‘நான்கு காற்றுகள்’ மற்றும் ‘பூமியின் எல்லைமுதல் வானத்தின் எல்லைவரை’ ஆகிய சற்று அபூர்வமான உருவகங்கள் மூலத்தின் வெளிப்பாட்டுக் காட்சித் தன்மையைப் பாதுகாக்க நோக்கமுடன் வைக்கப்பட்டுள்ளன.
