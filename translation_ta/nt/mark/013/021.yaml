id: MRK.13.21
reference: Mark 13:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: ta
  text: அப்போது யாராவது உங்களிடம், “இதோ, மேசியா[a] இங்கே இருக்கிறார்!” என்றோ, “இதோ, அங்கே இருக்கிறார்!” என்றோ சொன்னால், அதை நம்பாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.”
    reason: χριστός என்பதற்கான மரபான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: καὶ τότε
  choice: அப்போது
  rationale: முந்தைய உரையோடு உள்ள தொடர்பையும் அடுத்த காலக்கட்டத்தையும் இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காட்டுகிறது; தனியாக ‘மேலும்’ சேர்ப்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: யாராவது உங்களிடம் … சொன்னால்
  rationale: பொதுவான நிபந்தனையையும் τις என்பதன் குறிப்பற்ற தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இடைச்சொல்லின் வலிமையை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: அருகிலுள்ள இடத்தைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இங்கு பெயராக அல்லாமல், எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்ற மீட்பரைக் குறிக்கும் பட்டமாகப் பயன்படுகிறது; ‘மேசியா’ அந்தப் பட்டத்தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: ὧδε என்பதற்கு எதிரான தொலைவிடக் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: μὴ πιστεύετε
  choice: அதை நம்பாதீர்கள்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் எச்சரிக்கை அந்தக் கூற்றை ஏற்க வேண்டாம் என்பதாகும்; ‘அதை’ என்பது பேசிய நபரை மட்டுமே குறுக்காமல் கூற்றைக் குறிக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: கட்டுருபுடன் வரும் இச்சொல் இங்கு இயேசுவின் பெயர்போன்ற பயன்பாடாக இல்லாமல், பொய்யான இறுதிக்கால உரிமைகோரலின் பட்டமாக உள்ளது. ஆகவே ‘மேசியா’ பட்டத்தன்மையையும் யூத எதிர்பார்ப்பின் பின்னணியையும் காக்கிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், உரையாடலுக்கேற்ற நேரடியான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் இரு கூற்றுகளிலும் உள்ள கிரேக்க கவன ஈர்ப்பைத் தக்கவைக்கிறது.
