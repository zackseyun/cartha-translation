source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: ta
  text: இது, தன் வீட்டை விட்டுப் பயணமாகச் சென்ற ஒரு மனிதன் தன் அடிமைகளுக்கு[a] அதிகாரத்தையும், ஒவ்வொருவருக்கும் அவரவர் வேலையையும் கொடுத்து, விழித்திருக்கும்படி வாயிற்காப்பாளருக்குக் கட்டளையிட்டதைப் போன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேலையாட்கள்.” கிரேக்கச் சொல் எஜமானின் அதிகாரத்திற்குக் கீழிருந்த இல்லத்து அடிமைகளைக் குறிக்கிறது.
    reason: δοῦλοι என்பதன் சமூக நிலையைத் தெளிவுபடுத்தி, வழக்கமான மாற்று மொழிபெயர்ப்பையும் வழங்குகிறது.
lexical_decisions:
- source_word: ὡς
  choice: இது … போன்றது
  rationale: முந்தைய அறிவுறுத்தலுடன் இந்த ஒப்புமையை இயல்பான தமிழில் இணைக்கிறது; கிரேக்கத்தில் மறைமுகமாக உள்ள ஒப்புமைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπος ἀπόδημος
  choice: வெளியூர் செல்லும் ஒரு மனிதன்
  rationale: ἀπόδημος என்பது ஒருவர் தன் ஊர் அல்லது வீட்டைவிட்டு வெளியே இருப்பதைக் குறிக்கிறது. ‘வெளியூர் செல்லும்’ என்பது அவரது பயணத்தையும் வீட்டிலிருந்து அகன்றிருப்பதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: தன் வீட்டை விட்டுவிட்டு
  rationale: இறந்தகால வினையெச்சத்தின் தொடர்ச்சியையும் οἰκία என்பதன் நேரடியான ‘வீடு’ என்ற பொருளையும் காக்கிறது.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: தன் அடிமைகளுக்கு அதிகாரம் கொடுத்து
  rationale: δίδωμι என்பதற்கு ‘கொடுத்து’ என்றும் ἐξουσία என்பதற்கு அதன் அடிப்படைப் பொருளான ‘அதிகாரம்’ என்றும் மொழிபெயர்க்கிறது. இல்லத் தலைவனின் ஆளுகைக்குக் கீழிருந்தவர்களைக் குறிக்கும் δοῦλοι என்பதற்கு ‘அடிமைகள்’ பயன்படுத்தப்படுகிறது.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ஒவ்வொருவருக்கும் அவரவர் வேலையைக் கொடுத்து
  rationale: கிரேக்கத் தொடரின் சுருக்கமான அமைப்பையும், ஒவ்வொருவருக்கும் தனித்தனி வேலை அளிக்கப்பட்டதையும் பாதுகாக்கிறது; ‘பொறுப்பு’ போன்ற விளக்கச் சொற்களைச் சேர்க்கவில்லை.
- source_word: τῷ θυρωρῷ
  choice: வாயிற்காப்பாளருக்கு
  rationale: கதவை அல்லது வாயிலைக் காக்கும் நபரை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: விழித்திருக்கும்படி … கட்டளையிட்டு
  rationale: ἐντέλλομαι என்பதன் அதிகாரமிக்க கட்டளையையும் γρηγορέω என்பதன் நேரடியான ‘விழித்திரு’ என்ற உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: இல்லச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலையாட்கள்
  rationale: இந்த உவமையில் எஜமானின் அதிகாரத்திற்குக் கீழிருந்த பிணைக்கப்பட்ட இல்லப் பணியாளர்களே குறிக்கப்படுகின்றனர். ஆகவே சமூக உறவை மென்மையாக்காமல் ‘அடிமைகள்’ என்று தரப்படுகிறது; பொதுவாகப் பயன்படும் ‘வேலையாட்கள்’ அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
- issue: γρηγορέω என்பதிலுள்ள நேரடி மற்றும் உருவகப் பொருள்
  choice: விழித்திருக்க
  alternative: விழிப்புடன் இருக்க
  rationale: இந்த அதிகாரம் முழுவதும் தொடரும் விழித்திருத்தல் என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; அதிலுள்ள எச்சரிக்கையாயிருத்தல் என்ற உட்பொருளைத் தனியாகச் சேர்த்து விளக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அதிகாரம்,’ ‘கட்டளையிட்டது’ ஆகிய சொற்கள் மூலத்தின் அதிகாரத் தன்மையைக் காக்கின்றன; ‘வாயிற்காப்பாளர்’ தெளிவானதும் இயல்பானதும் ஆகும்.
