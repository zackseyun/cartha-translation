source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: ta
  text: நீங்கள் போர்களையும் போர்களைப் பற்றிய செய்திகளையும்[a] கேள்விப்படும்போது, கலங்காதிருங்கள். இவை நிகழ வேண்டும்; ஆனால் இன்னும் முடிவு வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போர்களைப் பற்றிய வதந்திகளையும்.’ கிரேக்கச் சொல் போர்களைப் பற்றிக் கேள்விப்படும் செய்திகள், தகவல்கள் அல்லது வதந்திகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால் ... போது
  rationale: ὅταν எதிர்காலச் சூழலில் ‘எப்போது/போது’ என்ற காலப் பொருளைத் தருகிறது; δέ மென்மையான இணைப்பாக இருந்தாலும், முந்தைய கருத்திலிருந்து நிகழும் திருப்பத்தை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
- source_word: ἀκούσητε
  choice: நீங்கள் கேள்விப்படும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் தோற்றமுடைய துணைவினை இங்கு எதிர்காலச் சூழ்நிலையைச் சுட்டுகிறது. போர்களைப் பற்றிய தகவல் செவியுறுவதை ‘கேள்விப்படுதல்’ இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πολέμους
  choice: போர்களை
  rationale: πόλεμος என்பதற்கான நேரடியான, வழக்கமான பன்மை மொழிபெயர்ப்பு.
- source_word: ἀκοὰς πολέμων
  choice: போர்களைப் பற்றிய செய்திகள்
  rationale: ἀκοή இங்கு கேள்விப்படும் செய்தி, அறிக்கை அல்லது வதந்தியைக் குறிக்கலாம். ‘செய்திகள்’ என்பது உறுதிப்படுத்தப்படாத தகவல் என்ற கருத்தைத் தேவையின்றி புகுத்தாமல் அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: μὴ θροεῖσθε
  choice: கலங்காதிருங்கள்
  rationale: θροέομαι குறிக்கும் மனக்குழப்பம், திகில் அல்லது பதற்றத்தை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: δεῖ γενέσθαι
  choice: இவை நிகழ வேண்டும்
  rationale: δεῖ என்பதன் கட்டாயத்தையும் γενέσθαι என்பதன் ‘நிகழ்தல்’ பொருளையும் காக்கிறது. ‘இவை’ என்பது சூழலில் கூறப்பட்ட போர்களையும் அவற்றைப் பற்றிய செய்திகளையும் சுட்டுகிறது.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: ஆனாலும் முடிவு இன்னும் வரவில்லை
  rationale: οὔπω என்பதன் ‘இன்னும் இல்லை’ என்ற வலியுறுத்தலைக் காக்கிறது; தமிழில் ‘முடிவு வருதல்’ இயல்பான வெளிப்பாடு. ἀλλά-வின் வேறுபாட்டை ‘ஆனாலும்’ காட்டுகிறது.
theological_decisions:
- issue: δεῖ γενέσθαι என்பதில் உள்ள இறுதிக்கால அவசியம்
  choice: ‘நிகழ வேண்டும்’ என்று மொழிபெயர்த்து அவசியத்தின் வலிமையைப் பேணுதல்
  alternative: ‘நிகழ வேண்டியிருக்கிறது’ அல்லது ‘நிகழ்வது அவசியம்’
  rationale: வசனம் அவசியத்தைத் தெரிவிக்கிறது; ஆனால் அது எவ்வாறு அல்லது எந்த இறுதிக்கால அமைப்பில் நிறைவேறும் என்பதை விளக்கவில்லை. எனவே குறிப்பிட்ட கோட்பாட்டு முறையைப் புகுத்தாமல் மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேள்விப்படும்போது,’ ‘கலங்காதிருங்கள்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையில் இயல்பாக உள்ளன; அதேவேளையில் மூலத்தின் எச்சரிக்கைத் தொனியும் இறுதிக்காலத் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
