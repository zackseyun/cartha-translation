  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: ta
  text: அந்த நாட்களில் கர்ப்பமாக இருப்பவர்களுக்கும் குழந்தைகளுக்குப் பாலூட்டுகிறவர்களுக்கும் ஐயோ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ!
  rationale: வரவிருக்கும் துயரைக் குறித்த புலம்பலும் எச்சரிப்பும் கலந்த தீர்க்கதரிசன வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது முந்தைய எச்சரிப்பிலிருந்து மென்மையான தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் வாக்கிய ஓட்டமும் சொல் வரிசையும் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துவதால், ‘ஆனால்’ என்பது தேவையற்ற வலுவான எதிர்மறையை உருவாக்கக்கூடும்.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: கர்ப்பமாக இருப்பவர்களுக்கு
  rationale: ‘கருப்பையில் கொண்டிருப்பவர்கள்’ என்ற கிரேக்க மரபுத்தொடரின் பொருளைத் தெளிவான, நவீன தமிழில் தருகிறது; பெண்பால் பன்மைச் சுட்டையும் சூழலில் தெளிவாகவே உள்ளது.
- source_word: θηλαζούσαις
  choice: குழந்தைகளுக்குப் பாலூட்டுகிறவர்களுக்கு
  rationale: கிரேக்கத்தில் மறைமுகமாக உள்ள பாலூட்டப்படும் குழந்தையை இயல்பான தமிழுக்காக வெளிப்படையாக்கி, அந்நாட்களில் எதிர்கொள்ளப்படும் சிரமத்தைத் தெளிவுபடுத்துகிறது.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: சுற்றியுள்ள உரையுடன் காலத் தொடர்பை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வசனத்தின் புலம்பல்-எச்சரிக்கைத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. தேவையற்ற ஆங்கில அடிக்குறிப்புகள் சேர்க்கப்படவில்லை; தமிழ்ச் சொற்றொடர்கள் பொருளைத் தெளிவாகவே தருகின்றன.
