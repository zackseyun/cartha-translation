base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: ta
  text: ஆனால், பாழாக்குதலின் அருவருப்பு நிற்கக்கூடாத இடத்தில் நிற்பதை நீங்கள் காணும்போது—வாசிப்பவர் புரிந்துகொள்ளட்டும்[a]—அப்போது யூதேயாவில் இருப்பவர்கள் மலைகளுக்குத் தப்பியோடட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் நிற்கக்கூடாத இடத்தில் நிற்பதை” என்றும் மொழிபெயர்க்கலாம். ‘நிற்பது’ என்பதற்கான கிரேக்கச் சொல் ஆண்பால் வடிவில் இருப்பதால், ‘அருவருப்பு’ என்பதன் பின்னால் ஒரு நபர் குறிக்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “பாழாக்குதலின் அருவருப்பு” என்பது தானியேல் நூலின் மொழியை எதிரொலிக்கிறது; தானி. 9:27; 11:31; 12:11 பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ஆனால் ... காணும்போது
  rationale: ὅταν குறிக்கும் கால நிபந்தனையை ‘காணும்போது’ இயல்பாகத் தருகிறது; δέ முந்தைய எச்சரிக்கையிலிருந்து தொடரும் மென்மையான மாறுதலை ‘ஆனால்’ குறிக்கிறது.
- source_word: ἴδητε
  choice: நீங்கள் காணும்போது
  rationale: ὁράω என்பதன் இரண்டாம் நபர் பன்மை வடிவத்தையும் கால உட்பிரிவின் இயல்பையும் தெளிவாகக் காக்கிறது.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: பாழாக்குதலின் அருவருப்பு
  rationale: தானியேல் நூலின் இறுதிக்கால மொழியை நினைவூட்டும் மூலமொழிக்கு நெருக்கமான சொல்லிணைவு. அது ஒரு பொருளா, செயலா, நபரா என்பதையும், பாழாக்குதலோடு உள்ள உறவின் துல்லிய இயல்பையும் மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἑστηκότα
  choice: நிற்பதை
  rationale: ἵστημι என்பதன் perfect participle, முன்பு நிறுத்தப்பட்டதன் விளைவாக தற்போது நிற்கும் நிலையைக் காட்டுகிறது; ‘நிற்பதை’ அதன் காட்சித் தெளிவைக் காக்கிறது.
- source_word: ὅπου οὐ δεῖ
  choice: நிற்கக்கூடாத இடத்தில்
  rationale: δεῖ இங்கு தகுதி அல்லது முறையைச் சார்ந்த கட்டாயத்தை மறுக்கும் பொருளில் வருகிறது; தமிழில் இச்சொற்றொடர் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: வாசிப்பவர் புரிந்துகொள்ளட்டும்
  rationale: வாசகரை நேரடியாக விழிப்புணர்த்தும் இடைச்செருகல் exhortation-ஐ அதன் கட்டளைத் தொனியுடன் காக்கிறது.
- source_word: τότε ... φευγέτωσαν
  choice: '... தப்பியோடட்டும்'
  rationale: τότε குறிக்கும் விளைவு தமிழின் வாக்கிய அமைப்பில் ‘காணும்போது’ என்பதற்குப் பின்வரும் முதன்மை கட்டளையால் வெளிப்படுகிறது; மூன்றாம் நபர் பன்மை நிகழ்காலக் கட்டளையின் அவசரத்தை ‘தப்பியோடட்டும்’ காக்கிறது.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: யூதேயாவில் இருப்பவர்கள்
  rationale: குறிப்பிட்ட நிலப்பகுதியையும் அங்கு இருப்பவர்களையும் நேரடியாகக் குறிக்கிறது.
- source_word: εἰς τὰ ὄρη
  choice: மலைகளுக்கு
  rationale: ὄρη என்பதன் பன்மையையும் தப்பிச் செல்ல வேண்டிய திசையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: τὸ βδέλυγμα τῆς ἐρημώσεως என்ற தானியேல் சார்ந்த சொற்றொடரின் குறிப்பு
  choice: ‘பாழாக்குதலின் அருவருப்பு’ என்று மூலமொழிக்கு நெருக்கமாக வைத்து, அதன் வரலாற்றுக் குறிப்பை முதன்மை உரையில் அடையாளப்படுத்தாமல் விடுதல்
  alternative: ‘பாழாக்கும் அருவருப்பு’ அல்லது ‘பாழாக்குதலை ஏற்படுத்தும் அருவருப்பு’
  rationale: இச்சொற்றொடர் அருவருப்பான பொருள், செயல் அல்லது நபரைக் குறிக்கலாம். காரண உறவைத் திட்டவட்டமாக்காமல் அதன் தீர்க்கதரிசன ஒலியையும் பொருள் நெருக்கடியையும் காக்கிறது.
- issue: நபுஞ்சகப் பெயர்ச்சொல்லுடன் வரும் ஆண்பால் participle ἑστηκότα
  choice: முதன்மை உரையில் வெளிப்படையான ‘அருவருப்பு’ என்பதையே இலக்கணப் பொருளாக வைத்து, ஆண்பால் நபரைக் குறிக்கக்கூடிய சாத்தியத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘அவன் நிற்கக்கூடாத இடத்தில் நிற்பதை’
  rationale: கிரேக்க ஆண்பால் participle, அந்த அருவருப்பின் பின்னால் ஒரு நபர் இருப்பதை அல்லது அது நபராக்கப்படுவதைச் சுட்டக்கூடும். ஆனால் அது உறுதியானதல்ல; ஆகவே உரை வாசிப்புக்கு இயல்பாக இருந்து, உண்மையான ambiguity அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் தீர்க்கதரிசன உரைக்கு ஏற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘பாழாக்குதலின் அருவருப்பு’ சற்றே உயர்ந்த நடையாக இருந்தாலும், தானியேல் சார்ந்த நிலையான இறுதிக்காலச் சொல்லிணைவின் ambiguity-ஐ காக்கத் தேர்ந்தெடுக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
