source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: ta
  text: அப்போது, மனுஷகுமாரன் மிகுந்த வல்லமையோடும் மகிமையோடும் மேகங்களில் வருவதை அவர்கள் காண்பார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேகங்களோடு வருவதை.’ கிரேக்கத்தில் ‘மேகங்களில்’ என்று உள்ளது; மாற்று மொழிபெயர்ப்பு தானியேல் 7:13-ன் எதிரொலியைத் தெளிவாக வெளிக்கொணர்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: அவர்கள் காண்பார்கள்
  rationale: ὁράω என்பதன் எதிர்கால வடிவம் இங்கு நேரடியான ‘காண்பார்கள்’ என்ற பொருளைத் தருகிறது; நிகழ்வின் வெளிப்படையான, கண்ணுக்குப் புலப்படும் தன்மையை விளக்கச் சேர்க்காமல் காக்கிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனுஷகுமாரன்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்றுள்ள இந்தப் பட்டப்பெயர், கிரேக்கச் சொற்றொடரையும் தானியேல் 7 உடனான தொடர்பையும் அறியத்தக்க வகையில் காக்கிறது.
- source_word: ἐρχόμενον
  choice: வருவதை
  rationale: நிகழ்காலப் பங்கேற்புவினை ‘மனுஷகுமாரன்’ என்பதைக் குறிப்பதால், இயல்பான தமிழ் வாக்கிய அமைப்பில் ‘வருவதை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; ‘வந்தடைவதை’ என்பதைக் காட்டிலும் மூலத்தின் இயக்கத்தையும் இறுதிக்கால மொழிநடையையும் நன்றாகப் பாதுகாக்கிறது.
- source_word: ἐν νεφέλαις
  choice: மேகங்களில்
  rationale: ἐν என்பதன் அடிப்படை இடப்பொருளையும், பன்மையான νεφέλαις என்பதையும் நேரடியாகக் காக்கிறது. தமிழில் ‘மேகங்களில்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: மிகுந்த வல்லமையோடும்
  rationale: μετά உடனிருப்பைச் சுட்டுகிறது; δύναμις πολλή என்பதற்கு ‘மிகுந்த வல்லமை’ என்பது கண்ணியமான, வேதாகமச் சூழலுக்கு ஏற்ற நவீனத் தமிழ் வடிவம்.
- source_word: καὶ δόξης
  choice: மகிமையோடும்
  rationale: δόξα இங்கு வெளிப்படும் மாட்சியைக் குறிக்கிறது. ‘மகிமை’ என்பது வேதாகம இடைநூல் தொடர்பைத் தக்கவைக்கும் நிலைபெற்ற தமிழ்ச் சொல்; இணை அமைப்புக்காக ‘-ஓடும்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிக்காலப் பட்டப்பெயரும் மேக உருவகமும்
  choice: ‘மனுஷகுமாரன்’ என்ற பட்டப்பெயரையும் ‘மேகங்களில் வருதல்’ என்ற உருவகத்தையும் விளக்க விரிவாக்கமின்றி தக்கவைத்தல்
  alternative: ‘மனிதகுமாரன்’ அல்லது ‘மனிதர்’ என இயக்கமுறையில் மொழிபெயர்த்து, தானியேல் 7:13 குறித்த சுட்டை முதன்மை உரையிலேயே வெளிப்படையாக விளக்குதல்
  rationale: இவ்வசனம் தானியேல் 7:13-ஐ வலுவாக எதிரொலித்தாலும், மொழிபெயர்ப்பு அந்தச் சுட்டை விளக்கமாக மாற்றாமல் பாதுகாக்க வேண்டும். இதனால் கிறிஸ்துவியல் மற்றும் இறுதிக்காலத் தத்துவம் சார்ந்த மூலத்தின் செறிவும் பதற்றமும் நிலைக்கின்றன.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனுஷகுமாரன்,’ ‘வல்லமை,’ ‘மகிமை’ ஆகிய நிலைபெற்ற சொற்கள் இடைநூல் தொடர்பையும் பட்டப்பெயரின் தன்மையையும் காக்கின்றன.
