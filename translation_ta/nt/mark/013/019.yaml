id: MRK.13.19
reference: Mark 13:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: ta
  text: ஏனெனில், கடவுள் படைத்த படைப்பின் தொடக்கத்திலிருந்து இன்றுவரை ஏற்பட்டிராத அளவுக்குக் கடும் துன்பம் அந்த நாட்களில் இருக்கும்[a]; அத்தகைய துன்பம் இனி ஒருபோதும் ஏற்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் படைத்த படைப்பின் தொடக்கத்திலிருந்து இன்றுவரை இருந்திராத அத்தகைய கடும் துன்பம் அந்த நாட்களில் இருக்கும்; இனியும் ஒருபோதும் இருக்காது.”
    reason: οἵα ... τοιαύτη மற்றும் γένηται ஆகியவற்றின் வடிவத்தை இன்னும் நெருக்கமாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: θλῖψις
  choice: கடும் துன்பம்
  rationale: இச்சொல் மிகக் கடுமையான நெருக்கடியையும் வேதனையையும் குறிக்கிறது. பொதுவாகப் புரியும் நவீன தமிழில் அதன் தீவிரத்தைத் தெளிவாகக் காட்ட ‘கடும் துன்பம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ஏற்பட்டிராத அளவுக்கு
  rationale: வரவிருக்கும் துன்பம் இதுவரை நிகழ்ந்த எதனுடனும் ஒப்பிட முடியாதது என்பதைக் கிரேக்க ஒப்பீட்டுத் தொடர் வலியுறுத்துகிறது; தமிழில் இயல்பாகவும் தீவிரம் குன்றாமலும் இவ்வாறு தரப்பட்டது.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: படைப்பின் தொடக்கத்திலிருந்து
  rationale: κτίσις என்பதன் படைப்பு சார்ந்த பொருளையும் தொடக்கத்திலிருந்து வரும் கால எல்லையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: கடவுள் படைத்த
  rationale: படைப்பைச் செய்தவர் கடவுள் என்று கிரேக்கம் வெளிப்படையாகக் கூறுவதால், தமிழிலும் அந்த உறவுப்பெயர் வாக்கியத்தின் கருத்து விடப்படவில்லை.
- source_word: ἕως τοῦ νῦν
  choice: இன்றுவரை
  rationale: கிரேக்கத்தின் கால வரம்பை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: οὐ μὴ γένηται
  choice: இனி ஒருபோதும் ஏற்படாது
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட எதிர்கால மறுப்பை ‘ஒருபோதும் ... ஏற்படாது’ எனத் தெளிவாகக் காட்டுகிறது; ‘இனி’ என்பது எதிர்கால நோக்கை உணர்த்துகிறது, ஆனால் மூலத்தில் இல்லாத ‘மீண்டும்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: கடும் துன்பம் அந்த நாட்களில் இருக்கும்
  rationale: சுருக்கமான கிரேக்கப் பயனிலையைத் தமிழில் இயல்பாக வெளிப்படுத்தி, அந்த நாட்கள் கடும் துன்பத்தின் காலமாக இருக்கும் என்ற பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘படைப்பு’ என்ற சொல்லின் பரப்பு
  choice: ‘கடவுள் படைத்த படைப்பின் தொடக்கம்’ என்ற உலகளாவிய படைப்புச் சொல்லாட்சி தக்கவைக்கப்பட்டது.
  alternative: ‘உலகம் தோன்றியதிலிருந்து’ என்று மொழிபெயர்த்தல்.
  rationale: மூலத்தில் κτίσις மற்றும் κτίζω ஆகிய இரண்டும் இடம்பெற்று, கடவுள் படைத்தவர் எனக் குறிப்பிடப்படுகிறார். ஆகவே இதை உள்ளூர் அல்லது உடன்படிக்கை சார்ந்த தொடக்கமாகக் குறுக்காமல், உரையின் படைப்புச் சொல்லாட்சியே பாதுகாக்கப்பட்டது.
- issue: இறுதி மறுப்பில் ‘மீண்டும்’ சேர்த்தல்
  choice: ‘இனி ஒருபோதும் ஏற்படாது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மீண்டும் ஒருபோதும் ஏற்படாது’ என்று மொழிபெயர்த்தல்.
  rationale: οὐ μὴ γένηται எதிர்கால நிகழ்வை வலுவாக மறுக்கிறது; ‘மீண்டும்’ என்பது சூழலில் ஊகிக்கப்படலாம் என்றாலும் கிரேக்கத்தில் வெளிப்படையாக இல்லை. எனவே அதைச் சேர்க்காமல் வலியுறுத்தலைப் பாதுகாத்தது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையின் கண்ணியமும் தீர்க்கதரிசனத் தீவிரமும் நிலைக்குமாறும் மொழிநடை அமைக்கப்பட்டது. ‘உபத்திரவம்’ என்பதற்குப் பதிலாகப் பரவலாகப் புரியும் ‘கடும் துன்பம்’ பயன்படுத்தப்பட்டது; மூலத்தின் ‘கடவுள் படைத்த படைப்பு’ என்ற ஓரளவு மீளுரைப்பான அமைப்பு கருத்தளவில் பாதுகாக்கப்பட்டது.
