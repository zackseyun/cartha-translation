  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன: அந்த நாட்களின் கடும் துன்பம், படைப்பின் தொடக்கத்திலிருந்து இன்றுவரையான முன்னுதாரணமின்மை, கடவுள் படைத்த படைப்பு என்ற வெளிப்படையான குறிப்பு, மற்றும் எதிர்காலத்தை வலுவாக மறுக்கும் οὐ μὴ γένηται ஆகியவை சரியாக வெளிப்படுகின்றன. ‘இனி ஒருபோதும் ஏற்படாது’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத ‘மீண்டும்’ என்பதைச் சேர்க்காமல் வலிமையான எதிர்கால மறுப்பைத் தருகிறது.'
  naturalness: ‘ஏற்பட்டிராத அளவுக்குக் கடும் துன்பம் அந்த நாட்களில் இருக்கும்’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘கடும் துன்பம்’ பொதுவாசகருக்குப் புரியும், உரிய தீவிரமுள்ள சொல். வாக்கியத்தின் இரு பகுதிகளும் வாசிப்பில் நன்றாக இணைகின்றன.
  terminology: θλῖψις என்பதற்கு ‘கடும் துன்பம்’ பொருத்தமான, சமயச் சொற்களால் தேவையின்றி கட்டுப்படாத மொழிபெயர்ப்பாகும். κτίσις/κτίζω ஆகியவற்றுக்கான ‘கடவுள் படைத்த படைப்பின் தொடக்கம்’ மூலத்தின் படைப்புச் சொல்லாட்சியையும் வெளிப்படையான கடவுள்-குறிப்பையும் காக்கிறது.
