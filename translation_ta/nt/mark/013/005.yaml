source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: ta
  text: 'அப்போது இயேசு அவர்களிடம் சொல்லத் தொடங்கினார்: “யாரும் உங்களை வழிதவறச் செய்யாதபடி எச்சரிக்கையாக இருங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: அப்போது
  rationale: δέ என்பது மென்மையான இணைப்புச்சொல். இங்கு எதிர்மறை முரண்பாட்டை மிகைப்படுத்தாமல் நிகழ்வின் தொடர்ச்சியைக் காட்ட ‘அப்போது’ இயல்பாக உள்ளது.
- source_word: ἤρξατο λέγειν
  choice: சொல்லத் தொடங்கினார்
  rationale: கிரேக்கத் தொடரின் தொடக்க அம்சத்தைத் தெளிவாகப் பாதுகாக்கிறது; ‘பதிலளித்து’ என்பது இவ்வசனத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: சூழலில் சீடர்களைக் குறித்தாலும், மூலத்தில் உள்ள சுட்டுப்பெயரை மட்டுமே பிரதிபலித்து விளக்கப் பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
- source_word: Βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: தொடர்ந்து விழிப்புடன் இருக்கும்படி கூறும் நிகழ்காலக் கட்டளையின் எச்சரிக்கை வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: யாரும் உங்களை வழிதவறச் செய்யாதபடி
  rationale: μή உடன் வரும் துணைவினை எச்சரித்து தடுக்க வேண்டிய சாத்தியத்தைக் குறிக்கிறது. ‘வழிதவறச் செய்ய’ என்பது ஏமாற்றப்படுவதையும் சரியான பாதையிலிருந்து விலக்கப்படுவதையும் உள்ளடக்கும் πλανάω வினையின் விரிந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πλανήσῃ என்ற எச்சரிக்கையின் தன்மை
  choice: ஏமாற்றத்தின் மூலம் சரியான வழியிலிருந்து விலக்கப்படுவதற்கு எதிரான எச்சரிக்கை
  alternative: அறிவுசார் ஏமாற்றத்திற்கு மட்டும் எதிரான எச்சரிக்கை
  rationale: πλανάω என்பது பொய்யை நம்பச் செய்வதை மட்டுமல்லாமல் வழியிலிருந்து விலகச் செய்வதையும் குறிக்கலாம். ‘வழிதவறச் செய்ய’ என்ற மொழிபெயர்ப்பு எந்தக் கோட்பாட்டு விளக்கத்தையும் கூடுதலாகச் சேர்க்காமல் இந்த விரிந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மூலத்தின் சுருக்கமும் நேரடியான எச்சரிக்கைத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
