source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: ta
  text: அவர்கள், நாட்டுப்புறத்திலிருந்து[b] வந்துகொண்டிருந்த சிரேனேவைச் சேர்ந்த சீமோன் என்ற வழிப்போக்கர் ஒருவரை—அலெக்சாந்தருக்கும் ரூபுவுக்கும் தந்தையானவரை—இயேசுவின் சிலுவையை[c]ச் சுமக்கும்படி கட்டாயப்படுத்தினர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டாயப்படுத்தினர்’ என மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல், அதிகாரத்தால் ஒருவரைக் கட்டாயச் சேவைக்கு உட்படுத்துவதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: ‘நாட்டுப்புறத்திலிருந்து’ என்பதற்கு ‘வயலிலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சிலர் இதை இன்னும் குறிப்பாக ‘சிலுவையின் குறுக்குமரம்’ என்று புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்க உரையில் ‘சிலுவை’ என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: கட்டாயப்படுத்தினார்கள்
  rationale: இச்சொல் வெறும் வேண்டுகோளை அல்ல, அதிகாரத்தால் ஒருவரைக் கட்டாயச் சேவைக்கு உட்படுத்துவதைச் சுட்டுகிறது.
- source_word: παράγοντά τινα
  choice: வழியே சென்றுகொண்டிருந்த ஒருவரான
  rationale: παράγοντα என்பது வழியாகச் சென்றுகொண்டிருந்த ஒருவரைக் குறிக்கிறது; τινα தரும் குறிப்பிடப்படாத தன்மையை ‘ஒருவரான’ தக்கவைக்கிறது.
- source_word: Σίμωνα Κυρηναῖον
  choice: சிரேனே ஊரைச் சேர்ந்த சீமோன்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, புவியியல் அடையாளம் நவீன தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: நாட்டுப்புறத்திலிருந்து வந்துகொண்டிருந்தார்
  rationale: ἀγρός என்பதற்கு வயல், பண்ணை, நாட்டுப்புறம் ஆகிய பொருள்கள் இருக்கலாம். நகருக்கு வெளியிலிருந்து வந்தார் என்ற பரந்த பொருளை இத்தேர்வு இயல்பாகத் தருகிறது; குறிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: அலெக்சாந்தர், ரூபு ஆகியோரின் தந்தையான அவரை
  rationale: சீமோனை அடையாளப்படுத்தும் மூலமொழியின் இடைச்செருகல் தகவல் விளக்கமின்றி நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἵνα ἄρῃ
  choice: சுமக்கும்படி
  rationale: ἵνα உடன் வரும் வினை நோக்கத்தைக் காட்டுகிறது; கட்டாயப்படுத்துதல் என்ற வினையுடன் ‘சுமக்கும்படி’ இயல்பான தமிழாக உள்ளது.
- source_word: σταυρὸν
  choice: சிலுவை
  rationale: மூலச்சொல் பொதுவாக ‘சிலுவை’ எனப் பொருள்படுகிறது; வரலாற்று ஊகத்தின் அடிப்படையில் ‘குறுக்குமரம்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: αὐτοῦ
  choice: இயேசுவின்
  rationale: சூழலில் சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது. தமிழில் தெளிவற்ற ‘அவருடைய’ என்பதைக் காட்டிலும் ‘இயேசுவின்’ என்பது குறிப்பைத் தெளிவாகவும் பொருளை மாற்றாமலும் தருகிறது.
theological_decisions:
- issue: சீமோன் மீது செலுத்தப்பட்ட கட்டாயத்தின் தன்மை
  choice: அதிகாரத்தால் அவர் சிலுவையைச் சுமக்கக் கட்டாயப்படுத்தப்பட்டார்.
  alternative: அவர் வெறுமனே கேட்டுக்கொள்ளப்பட்டார் அல்லது விருப்பத்துடன் சேர்த்துக்கொள்ளப்பட்டார்.
  rationale: ἀγγαρεύω என்பது கட்டாயச் சேவை அல்லது அதிகாரபூர்வப் பணியமர்த்தலைக் குறிக்கிறது; அதன் வலிமையை மொழிபெயர்ப்பு மென்மையாக்கக் கூடாது.
- issue: சீமோன் சுமந்த பொருளின் குறிப்புத்தன்மை
  choice: ‘சிலுவை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘சிலுவையின் குறுக்குமரம்’ என்று குறிப்பாக்குதல்.
  rationale: வரலாற்று மறுகட்டமைப்புகளில் குறுக்குமரம் எனக் கருதப்பட்டாலும், கிரேக்க உரை σταυρός என்ற பொதுச் சொல்லையே பயன்படுத்துகிறது; ஆகவே மூலத்தைவிடக் குறுகிய பொருள் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நீண்ட இடைச்செருகலை தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளது. அடிக்குறிப்பு [b] முதல் வாக்கியத்தில் உரிய சொல்லுக்குப் பின் வர வேண்டியதால் வெளியீட்டு வடிவில் ‘நாட்டுப்புறத்திலிருந்து[b]’ என அமைப்பது சிறந்தது.
