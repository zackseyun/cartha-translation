revisions:
- from: வழியே சென்றுகொண்டிருந்த ஒருவரான சிரேனே ஊரைச் சேர்ந்த சீமோன் நாட்டுப்புறத்திலிருந்து வந்துகொண்டிருந்தார். அலெக்சாந்தர், ரூபு ஆகியோரின் தந்தையான அவரை, இயேசுவின் சிலுவையை[c]ச் சுமக்கும்படி அவர்கள் கட்டாயப்படுத்தினார்கள்[a]. [b]
  to: அவர்கள், நாட்டுப்புறத்திலிருந்து[b] வந்துகொண்டிருந்த சிரேனேவைச் சேர்ந்த சீமோன் என்ற வழிப்போக்கர் ஒருவரை—அலெக்சாந்தருக்கும் ரூபுவுக்கும் தந்தையானவரை—இயேசுவின் சிலுவையை[c]ச் சுமக்கும்படி கட்டாயப்படுத்தினர்[a].
  rationale: '[b] குறியீடு அதன் உரிய சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது. வாக்கியம் மறுவரிசைப்படுத்தப்பட்டு, παράγοντά τινα, ἐρχόμενον ἀπ’ ἀγροῦ, மற்றும் τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου ஆகிய மூலத் தொடர்புகள் தெளிவாக இணைக்கப்பட்டுள்ளன. ‘இயேசுவின் சிலுவை’ என்பது சூழலில் தெளிவான αὐτοῦ-வின் குறிப்பைத் தமிழில் தவறாக சீமோனுக்குச் செல்லாமல் காக்கும் பாதுகாப்பான வெளிப்படுத்தலாகும்.'
