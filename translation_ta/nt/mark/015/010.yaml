  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: ta
  text: ஏனெனில், தலைமை ஆசாரியர்கள் பொறாமையால் அவரை ஒப்படைத்திருந்தார்கள் என்பதை அவன் அறிந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொறாமையின் காரணமாக’ அல்லது ‘பொறாமை உணர்வினால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: அவன் அறிந்திருந்தான்
  rationale: இறந்தகாலத்தில் நிலைத்திருந்த பிலாத்துவின் அறிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: அவன் அறிந்திருந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: διὰ φθόνον
  choice: பொறாமையினால்தான்
  rationale: διά + குற்றுவேற்றுமை காரணத்தைக் குறிக்கிறது; φθόνος என்பதற்கு இச்சூழலில் ‘பொறாமை’ இயல்பான இணை.
- source_word: παραδεδώκεισαν
  choice: ஒப்படைத்திருந்தார்கள்
  rationale: பிலாத்துவின் அறிதலுக்கு முன்னரே முடிந்த செயலைக் குறிக்கும் முற்றிறந்தகாலத் தன்மையையும், சட்டரீதியான ஒப்படைப்புச் சூழலையும் காக்கிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள்; தமிழில் மரியாதை ஒருமை இயல்பானது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: ஒரே தலைமைக் குருவை அல்லாமல் முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மையைத் துல்லியமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தலைமை ஆசாரியர்களுக்குக் கூறப்படும் உள்நோக்கம்
  choice: அவர்கள் இயேசுவைப் பொறாமையினால் ஒப்படைத்தார்கள் என்று பிலாத்து அறிந்திருந்ததாக மொழிபெயர்த்தல்
  alternative: ‘போறாமை/போட்டி உணர்வு காரணமாக’ என்று மொழிபெயர்த்தல்
  rationale: φθόνος குறிக்கும் பொறாமையை நேரடியாகக் காக்கிறது; பிலாத்துவின் மதிப்பீட்டை மேலதிக இறையியல் விளக்கமின்றி அப்படியே முன்வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அவனுக்கு’ என்பதற்குப் பதிலாக ‘தன்னிடம்’ சேர்க்கப்பட்டது; கிரேக்கத்தில் மறைமுகப் பொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் ஒப்படைப்பு பிலாத்துவிடமே என்பதைக் தமிழில் இயல்பாகத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
