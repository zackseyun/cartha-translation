source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: ta
  text: அவர்கள் அவரைக் கேலி செய்த பிறகு, அவரிடமிருந்து அந்த ஊதா நிற ஆடையை[a] கழற்றி, அவருடைய சொந்த ஆடைகளை அவருக்கு உடுத்தினார்கள். பின்பு அவரைச் சிலுவையில் அறைவதற்காக[b] வெளியே அழைத்துச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஊதா நிற அங்கி,” “அந்த ஊதா நிற மேலங்கி.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “அந்த ஊதா நிறமானதை” என்று உள்ளது; ஆடை என்பது சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரைச் சிலுவையில் அறையும்படி.” கிரேக்கத்தில் இது நோக்கத்தைக் காட்டும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: கேலி செய்த
  rationale: இச்சொல் இகழ்ச்சியோடு பரிகசிப்பதைக் குறிக்கிறது. “கேலி செய்த” என்பது நவீனத் தமிழில் இயல்பாகவும், நிகழ்ச்சியின் கடுமையைத் தணிக்காமலும் உள்ளது.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: அவரிடமிருந்து அந்த ஊதா நிற ஆடையை கழற்றி
  rationale: ἐκδύω ஒருவருக்கு அணிவிக்கப்பட்ட ஆடையைக் கழற்றுவதைக் குறிக்கிறது. πορφύρα இங்கு சூழலின்படி ஊதா நிற ஆடையைக் குறிக்கிறது; கிரேக்கம் ஆடை வகையைத் தனியாகக் குறிப்பிடவில்லை.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: அவருடைய சொந்த ஆடைகளை அவருக்கு உடுத்தினார்கள்
  rationale: τὰ ἱμάτια என்பது ஆடைகளையும், τὰ ἴδια என்பது அவை அவருக்குச் சொந்தமானவை என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξάγουσιν
  choice: வெளியே அழைத்துச் சென்றார்கள்
  rationale: இது கிரேக்கக் கதையாடலில் வரும் வரலாற்று நிகழ்காலம். தமிழில் கடந்தகால நிகழ்வுகளின் தொடரை இயல்பாக எடுத்துரைக்க இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது; “வெளியே” என்பது ἐξ- கூறைத் தக்கவைக்கிறது.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: அவரைச் சிலுவையில் அறைவதற்காக
  rationale: ἵνα உடன் வரும் வினை இங்கு நோக்கத்தைக் குறிக்கிறது. “-வதற்காக” என்ற அமைப்பு அந்த நோக்கத்தை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் அவமதிப்பும் சிலுவை மரணத்துக்கு அழைத்துச் செல்லப்படுதலும்
  choice: கேலி, ஊதா ஆடை அகற்றப்படுதல், அவரது சொந்த ஆடைகள் அணிவிக்கப்படுதல், சிலுவையில் அறையும் நோக்கத்துடன் வெளியே அழைத்துச் செல்லப்படுதல் ஆகியவற்றை நேரடியான வரலாற்றுக் கதையாக மொழிபெயர்த்தல்
  alternative: ஊதா ஆடையை அரச ஆடை என்று விளக்கமாக மொழிபெயர்த்தல் அல்லது நிகழ்வுக்கு மேலதிக இறையியல் பொருள் சேர்த்தல்
  rationale: மூலவசனம் நிகழ்வுகளைச் சுருக்கமாகவும் நேரடியாகவும் விவரிக்கிறது. “அரச ஆடை” என்பது சூழலிலிருந்து பெறக்கூடிய விளக்கம் என்றாலும், அதை முதன்மை உரையில் சேர்ப்பது மூலத்தின் சொற்களை மீறிச் செல்லும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நிகழ்ச்சியின் கண்ணியமான, தீவிரமான தொனியைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “ஊதா நிற ஆடை” என்பது பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்களைத் தவிர்க்கிறது; “சிலுவையில் அறை” என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் துல்லியமான சொற்றொடர்.
