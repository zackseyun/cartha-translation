language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: ta
  text: தொலைவிலிருந்து[a] பார்த்துக்கொண்டிருந்த பெண்களும் இருந்தார்கள். அவர்களில் மகதலேனா மரியாளும், இளைய யாக்கோபுக்கும்[b] யோசேக்கும்[c] தாயான மரியாளும், சலோமேயும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூரத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சிறிய யாக்கோபு’ அல்லது ‘குறைவான யாக்கோபு’ என்றும் பொருள் கொள்ளலாம்; கிரேக்க அடைமொழி வயது, உடலளவு அல்லது முக்கியத்துவம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பது தெளிவில்லை.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள கிரேக்கப் பெயர் ‘யோசே’; இது ‘யோசேப்பு’ என்பதிலிருந்து வேறுபட்ட பெயர் வடிவம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: அங்கே இருந்தார்கள்
  rationale: δέ-யைத் தனியாக வலியுறுத்தாமல், καί-யின் சேர்க்கைப் பொருளை ‘-உம்’ விகுதிகள் வழியாக இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது; imperfect இங்கு பின்னணிக் காட்சியை விவரிக்கிறது.
- source_word: γυναῖκες
  choice: பெண்கள்
  rationale: இச்சூழலில் γυνή என்பதன் பன்மைக்கு நேரான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀπὸ μακρόθεν
  choice: தொலைவில் இருந்து
  rationale: இடைவெளி விட்டு நின்று பார்த்ததைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; ‘தூரத்திலிருந்து’ என்பதும் சாத்தியம்.
- source_word: θεωροῦσαι
  choice: பார்த்துக்கொண்டிருந்த
  rationale: தொடர்ந்து கவனித்துக்கொண்டிருந்த செயலை நிகழ்காலப் பங்கேற்பு வடிவம் உணர்த்துவதால், நீடித்த பார்வையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν αἷς
  choice: அவர்களில்
  rationale: முன்னர் குறிப்பிடப்பட்ட பெண்களின் பெரிய குழுவுக்குள் பெயரிடப்பட்ட பெண்கள் இருந்தார்கள் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: மகதலேனா மரியாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான பெயர் வடிவத்தைப் பயன்படுத்தி, மகதலா ஊருடன் தொடர்புடைய அடையாளத்தைக் காக்கிறது.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: இளைய யாக்கோபுக்கும் யோசேக்கும் தாயான மரியாள்
  rationale: μήτηρ இரண்டு பெயர்களையும் ஆளுவதைக் ‘இருவருக்கும் தாயான’ உறவாகத் தெளிவுபடுத்துகிறது; τοῦ μικροῦ என்பதன் சாத்தியமான நுணுக்கத்தை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: Ἰακώβου
  choice: யாக்கோபு
  rationale: Ἰάκωβος என்ற பெயரின் மூலவடிவத்துக்கு நெருக்கமான, தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பு; ஆங்கில மரபின் ‘James’ வடிவத்தை இடைமொழியாகப் பின்பற்றவில்லை.
- source_word: τοῦ μικροῦ
  choice: இளைய
  rationale: ஒருவரை வேறுபடுத்திக் காட்டும் அடைமொழியாக நவீனத் தமிழில் இயல்பாக உள்ளது; ஆனால் வயது, உடலளவு அல்லது முக்கியத்துவம் ஆகியவற்றில் எது குறிக்கப்படுகிறது என்பதை மூலவாசகம் தீர்மானிக்காததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰωσῆτος
  choice: யோசே
  rationale: Ἰωσῆς என்ற தனித்த கிரேக்கப் பெயர் வடிவத்தை ‘யோசேப்பு’ என்று ஒத்திசைக்காமல் காக்கிறது.
- source_word: Σαλώμη
  choice: சலோமே
  rationale: கிரேக்கப் பெயரின் நிலையான, தெளிவான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: τοῦ μικροῦ என்பதன் பொருள் மற்றும் யாக்கோபின் அடையாளம்
  choice: முதன்மை உரையில் ‘இளைய யாக்கோபு’ என்று வழங்கி, சரியான ஒப்பீட்டு நுணுக்கத்தைத் தீர்மானிக்காமல் அடிக்குறிப்பில் மாற்றுகளைச் சுட்டுதல்
  alternative: ‘சிறிய யாக்கோபு’ அல்லது ‘குறைந்தவர் யாக்கோபு’
  rationale: இந்த அடைமொழி யாக்கோபை வேறுபடுத்திக் காட்டுகிறது; அது வயதையா, உடலளவையா, முக்கியத்துவத்தையா குறிக்கிறது என்று வசனம் விளக்கவில்லை. ஆகவே எந்த அடையாளத்தையோ கோட்பாட்டையோ மொழிபெயர்ப்பு திணிக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. ‘பார்த்துக்கொண்டிருந்த’ என்பது தொடர்ச்சியான காட்சியை இயல்பாகக் காட்டுகிறது. பெயர்கள் மூலக் கிரேக்க வடிவங்களுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; மரபுச் சார்ந்த அடையாளப்படுத்தல்கள் சேர்க்கப்படவில்லை.
