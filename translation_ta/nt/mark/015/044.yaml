source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: ta
  text: ஆனால், அவர் ஏற்கெனவே இறந்துவிட்டாரா என்று பிலாத்து வியந்தான். நூற்றுவர் தலைவனை வரவழைத்து, அவர் இறந்து சில நேரம் ஆகியிருந்ததா[a] என்று அவனிடம் கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஏற்கெனவே இறந்துவிட்டாரா.”
    reason: πάλαι என்பதைக் சூழலுக்கு ஏற்ப கால இடைவெளியைத் துல்லியமாகக் குறிப்பிடாமல் ‘ஏற்கெனவே’ என்றும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: வியந்தான்
  rationale: இயேசு இவ்வளவு விரைவில் இறந்துவிட்டார் என்ற செய்தியைக் கேட்ட பிலாத்தின் வியப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰ ἤδη τέθνηκεν
  choice: அவர் அதற்குள் இறந்துவிட்டாரா என்று
  rationale: εἰ-ஐ மறைமுகக் கேள்வியாகவும், ἤδη-யை எதிர்பார்த்ததைவிட விரைவாக நிகழ்ந்ததைக் குறிக்கும் ‘அதற்குள்’ எனவும் மொழிபெயர்க்கிறது. τέθνηκεν என்பதன் நிறைவுற்ற மரணநிலையை ‘இறந்துவிட்டாரா’ வெளிப்படுத்துகிறது.
- source_word: προσκαλεσάμενος
  choice: வரவழைத்து
  rationale: பிலாத்து நூற்றுவர் தலைவனைத் தன்னிடம் அழைத்து விசாரித்த தொடர் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κεντυρίωνα
  choice: நூற்றுவர் தலைவன்
  rationale: ரோமப் படையின் centurion என்ற வரலாற்றுச் சிறப்புடைய பதவிக்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: ἐπηρώτησεν αὐτόν
  choice: அவனிடம் கேட்டான்
  rationale: கிரேக்கத்தின் நேரடியான ‘அவனிடம் கேட்டான்/விசாரித்தான்’ என்ற பொருளை இயல்பான கதைநடைத் தமிழில் தருகிறது.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: அவர் இறந்து சிறிது நேரம் ஆகியிருந்ததா
  rationale: πάλαι இங்கு வெகுகாலத்துக்கு முன்பு என்பதை அல்ல, இறந்து ஏற்கெனவே ஓரளவு நேரம் கடந்திருந்ததா என்ற விசாரணையைக் குறிக்கிறது. முதல் கூறிலுள்ள ἤδη-யிலிருந்து இதன் காலநேர நுணுக்கத்தையும் வேறுபடுத்துகிறது.
