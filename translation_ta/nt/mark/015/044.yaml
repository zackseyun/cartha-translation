translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கு ‘அவர்’ என்றும், பிலாத்தும் நூற்றுவர் தலைவனும் குறித்த கதைநடையில் வழக்கமான ஆண்பால் ஒருமை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. ἤδη மற்றும் πάλαι ஆகிய இரு காலக் குறிப்புகளின் வேறுபாடு முடிந்தவரை பாதுகாக்கப்பட்டுள்ளது.
