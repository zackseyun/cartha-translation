revisions:
- from: ஆனால் அவர் அதற்குள் இறந்துவிட்டாரா என்று பிலாத்து வியந்தான். நூற்றுவர் தலைவனை வரவழைத்து, அவர் இறந்து சிறிது நேரம் ஆகியிருந்ததா[a] என்று அவனிடம் கேட்டான்.
  to: ஆனால், அவர் ஏற்கெனவே இறந்துவிட்டாரா என்று பிலாத்து வியந்தான். நூற்றுவர் தலைவனை வரவழைத்து, அவர் இறந்து சில நேரம் ஆகியிருந்ததா[a] என்று அவனிடம் கேட்டான்.
  rationale: The revision directly renders ἤδη as “ஏற்கெனவே” and changes “சிறிது நேரம்” to the non-quantifying “சில நேரம்,” thereby retaining the distinction between ἤδη and πάλαι while avoiding an unwarranted claim about the length of the interval. The footnote remains correctly anchored and presents a viable contextual alternative.
