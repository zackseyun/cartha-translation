translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் எளிமையாகவும், நீதிமன்ற விசாரணைச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அதற்கு மேல்’ என்பது οὐκέτι-யின் காலச்சார்ந்த நுணுக்கத்தையும், ‘அதனால்’ என்பது ὥστε-யின் விளைவு உறவையும் பாதுகாக்கின்றன.
