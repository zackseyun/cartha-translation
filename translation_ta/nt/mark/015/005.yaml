  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: ta
  text: ஆனால் இயேசு இனி எதற்கும் பதில் சொல்லவில்லை[a]. அதனால் பிலாத்து வியப்படைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் இயேசு இனி எந்த மறுமொழியும் அளிக்கவில்லை; அதன் விளைவாகப் பிலாத்து வியந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் இயேசு பதிலளிக்காததைக் குறித்த பிலாத்துவின் கேள்விக்கும் இங்கு தொடரும் மௌனத்திற்கும் இடையிலான மென்மையான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: οὐκέτι
  choice: அதற்கு மேல்
  rationale: முன்பு பதில் கூறிய நிலையிலிருந்து இப்போது பதில் கூறுவது நின்றுவிட்டது என்ற காலச்சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: οὐδὲν
  choice: எதுவும்
  rationale: எதிர்மறை வினையுடன் சேர்ந்து, இயேசுவின் பதில் முற்றிலும் இல்லாததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀπεκρίθη
  choice: பதில் சொல்லவில்லை
  rationale: விசாரணைச் சூழலில் ἀποκρίνομαι என்பதன் நேரடியான பொருளை எளிமையாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὥστε
  choice: அதனால்
  rationale: இயேசுவின் மௌனத்தின் விளைவாகப் பிலாத்து வியந்தார் என்ற விளைவு உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: θαυμάζειν
  choice: வியப்படைந்தார்
  rationale: பிலாத்துவின் ஆச்சரியத்தை இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது; தேவையற்ற நீடித்த செயல் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: Πιλᾶτον
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
