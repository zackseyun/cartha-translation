  source_fidelity: முக்கிய வினைச்சொற்களான διαμερίζονται, βάλλοντες κλῆρον, τίς τί ἄρῃ ஆகியவற்றின் பொருள் சரியாகப் பிரதிபலிக்கப்படுகிறது. ஆனால் σταυροῦσιν என்பது நிகழ்கால வினை; “அறைந்து” என்பது வினையெச்சமாக இருப்பதால் மூலத்தின் வரலாற்று நிகழ்காலத்தைத் தனித்து வெளிப்படுத்தவில்லை. அதை “சிலுவையில் அறைகிறார்கள்” என மாற்றுவது மூல வடிவுக்கும் வழங்கப்பட்ட மொழிபெயர்ப்புக் கொள்கைக்கும் ஏற்றது.
  naturalness: மொழிநடை நவீன பொதுத்தமிழிலும் கண்ணியமான நிகழ்வுரை நடையிலும் உள்ளது. தனித்த வினைச்சொற்களுடன் இணைச் செயல்களைத் தருவது வாசிப்பைத் தெளிவாக்குகிறது. “சீட்டுப் போடுகிறார்கள்” என்பது சீட்டால் பங்கீட்டை நிர்ணயிக்கும் பொருளில் இயல்பாகப் புரிகிறது.
  terminology: “சிலுவையில் அறைகிறார்கள்,” “உடைகள்,” “பங்கிட்டுக்கொள்கிறார்கள்,” “சீட்டுப் போடுகிறார்கள்” ஆகியவை பொருத்தமானவை. “அவற்றுக்காக” என்பது ἐπ’ αὐτά என்பதற்குச் சொற்பொருளில் சற்று விரிவானது என்றாலும், பொருட்களான உடைகளுக்காகச் சீட்டிடுதலைத் தெளிவாகக் குறிக்கிறது; அடிக்குறிப்பில் “அவற்றின்மேல்” என்ற நெருக்கமான மாற்று சரியாக உள்ளது.
