source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: ta
  text: அவர்கள் அவரைச் சிலுவையில் அறைகிறார்கள்; அவருடைய உடைகளைத் தங்களுக்குள் பங்கிட்டுக்கொள்கிறார்கள்; யார் எதை எடுத்துக்கொள்வது என்பதைத் தீர்மானிக்க அவற்றுக்காகச் சீட்டுப் போடுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யார் எதை எடுத்துக்கொள்வார் என்று பார்க்க, அவற்றின்மேல் சீட்டுப் போடுகிறார்கள்.”
    reason: ἐπ’ αὐτὰ τίς τί ἄρῃ என்ற தொடரின் அமைப்பை இன்னும் நெருக்கமாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: σταυροῦσιν
  choice: சிலுவையில் அறைந்து
  rationale: மாற்குவின் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்கால வினைமுற்றுடன் தொடரச் செய்கிறது; செயல் முறையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διαμερίζονται
  choice: தங்களுக்குள் பங்கிட்டுக்கொள்கிறார்கள்
  rationale: உடைகளைப் பலரிடையே பகிர்ந்துகொள்ளும் பொருளையும், நடுவினை வடிவின் பரஸ்பரப் பயனையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἱμάτια
  choice: உடைகள்
  rationale: ஆடைகளைக் குறிக்கும் தெளிவான, நவீனத் தமிழ்ச் சொல்; மிகப் பேச்சுவழக்காகவோ பழமையாகவோ இல்லை.
- source_word: βάλλοντες κλῆρον
  choice: சீட்டுப் போடுகிறார்கள்
  rationale: ஒவ்வொருவருக்குரிய பங்கைத் தற்செயல் முறையில் தீர்மானிப்பதைக் குறிக்கும், தமிழில் நன்கு புரியும் வழக்குச் சொற்றொடர்.
- source_word: ἐπ’ αὐτὰ
  choice: அவற்றுக்காக
  rationale: சீட்டுப் போடப்பட்ட பொருட்கள் முன் கூறப்பட்ட உடைகளே என்பதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: τίς τί ἄρῃ
  choice: யார் எதை எடுத்துக்கொள்வது என்பதைத் தீர்மானிக்க
  rationale: τίς τί என்பதிலுள்ள ‘யார்—எது’ என்ற பகிர்வு உறவைத் தெளிவாகக் காத்து, நோக்கம் அல்லது முடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாடுகளின் நிகழ்வுரையில் வரலாற்று நிகழ்காலம்
  choice: “அறைந்து … பங்கிட்டுக்கொள்கிறார்கள் … சீட்டுப் போடுகிறார்கள்” என்று நிகழ்காலத்தைத் தக்கவைத்தல்
  alternative: “அறைந்தார்கள் … பங்கிட்டுக்கொண்டார்கள் … சீட்டுப் போட்டார்கள்” என்று இறந்தகாலத்தில் மொழிபெயர்த்தல்
  rationale: கிரேக்க மூலத்தில் உள்ள நிகழ்காலம் மாற்குவின் நிகழ்வுரைக்கு அளிக்கும் உயிரோட்டத்தை இது பாதுகாக்கிறது; கூடுதல் இறையியல் விளக்கம் எதையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான நிகழ்வுரை நடையில் அமைக்கப்பட்டுள்ளது. மாற்குவின் வரலாற்று நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது; “உடைகள்,” “பங்கிட்டுக்கொள்கிறார்கள்,” “சீட்டுப் போடுகிறார்கள்” என்பவை சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் சொற்கள்.
