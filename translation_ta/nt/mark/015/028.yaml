  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: ta
  text: மேலும்[a], “அவர் சட்டமீறியவர்களோடு சேர்த்து எண்ணப்பட்டார்” என்று கூறும் வேதவாக்கு நிறைவேறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் (நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்ட்டிக்கஸ், வத்திக்கானஸ் உட்பட) மற்றும் தொடக்ககால காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை மரபிலும் இலத்தீன் மரபிலும் உள்ளது. ஏசாயா 53:12-ஐ மேற்கோள் காட்டும் லூக்கா 22:37-க்கு ஒத்திசைக்கப் பிற்கால எழுத்தர்கள் இதைச் சேர்த்திருக்கலாம்.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω (ἐπληρώθη)
  choice: நிறைவேறியது
  rationale: தீர்க்கதரிசன வேதவாக்கு நிகழ்வில் நனவானதைச் சுட்டும் செயலப்பாட்டு வடிவத்திற்கு இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἄνομος (ἀνόμων)
  choice: சட்டத்தை மீறியவர்கள்
  rationale: சொல்லின் அடிப்படைப் பொருளான ‘சட்டமற்றவர்கள்/சட்டத்தை மீறுவோர்’ என்பதை நவீனத் தமிழில் தெளிவாகத் தருகிறது; ‘குற்றவாளிகள்’ எனக் குறுக்கி விளக்குவதைத் தவிர்க்கிறது.
- source_word: λογίζομαι (ἐλογίσθη)
  choice: ஒருவராக எண்ணப்பட்டார்
  rationale: அவர்களுடன் ஒரே வகையைச் சேர்ந்தவராகக் கணக்கிடப்பட்டார் என்ற செயலப்பாட்டு பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γραφή
  choice: வேதவாக்கு
  rationale: இங்கு மேற்கோள் காட்டப்படும் அதிகாரமிக்க எழுதப்பட்ட வேதப்பகுதியைக் குறிக்கிறது; தமிழில் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க சொல்.
theological_decisions:
- issue: μετὰ ἀνόμων என்பதன் வகைப்படுத்தும் பொருள்
  choice: சட்டத்தை மீறியவர்களோடு ஒருவராக
  alternative: குற்றவாளிகளில் ஒருவராக
  rationale: கிரேக்கத்தின் ‘அவர்களுடன்’ என்ற உறவையும், λογίζομαι குறிக்கும் வகைப்படுத்தலையும் காக்கிறது; அவர் உண்மையில் சட்டமீறியவர் என்று உரை கூறுவதாகத் தவறாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தில் வாக்கியம் ‘மற்றும்’ எனத் தொடங்கினாலும், தமிழில் முந்தைய நிகழ்வுடன் இயல்பாக இணைக்க ‘அப்போது’ பயன்படுத்தப்பட்டது; அடிக்குறி குறியீடு அதனுடன் இணைக்கப்பட்டுள்ளது.
