  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரைத்தோரியம்’ என்ற வரலாற்றுச் சொல் மூலத்தின் தனித்தன்மைக்காகத் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ரோமப் படை அமைப்பின் துல்லிய எண்ணிக்கையை வசனம் கட்டாயப்படுத்தாததால் அது சேர்க்கப்படவில்லை.
