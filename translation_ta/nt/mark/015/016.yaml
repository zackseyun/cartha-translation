source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: ta
  text: பின்பு படைவீரர்கள் அவரை முற்றத்திற்குள் கொண்டு சென்றார்கள்; அது பிரைத்தோரியம்[a]. அவர்கள் முழுப் படைப்பிரிவையும் ஒன்றுகூட்டினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரைத்தோரியம்’ என்பது ரோம ஆளுநரின் தலைமையகம் அல்லது அதிகாரப்பூர்வ இருப்பிடம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘படைப்பிரிவு’ என்பது ரோம அதிகாரத்தின்கீழ் ஒன்றுகூட்டப்பட்ட படைவீரர்களைக் குறிக்கிறது. இதற்கான கிரேக்கச் சொல் பொதுவாக ஒரு ரோமப் படைக்குழுவைக் குறிக்கும்.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: பின்பு
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்ச்சியின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது; ‘பின்பு’ நவீனத் தமிழில் இயல்பான கதைத் தொடர்ச்சியைத் தருகிறது.
- source_word: στρατιῶται
  choice: படைவீரர்கள்
  rationale: தனிப்பட்ட ரோமப் படையினரைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியக்கூடிய சொல்.
- source_word: ἀπήγαγον
  choice: அழைத்துச் சென்றார்கள்
  rationale: ஒருவரைத் தம்முடன் ஓர் இடத்திற்குக் கொண்டுசெல்வதைக் குறிக்கும் ἀπάγω என்பதன் சூழல்சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔσω τῆς αὐλῆς
  choice: முற்றத்திற்குள்
  rationale: ἔσω என்பதன் உள்ளிடத் திசையையும் αὐλή என்பதன் ‘முற்றம்’ என்ற பொருளையும் தேவையின்றி அரண்மனை என்று விரிவுபடுத்தாமல் காக்கிறது.
- source_word: ὅ ἐστιν πραιτώριον
  choice: அது பிரைத்தோரியம்[a]
  rationale: ரோம நிர்வாகச் சூழலுக்குரிய வரலாற்றுச் சொல்லைப் பெயரெழுத்தாக்கமாகத் தக்கவைத்து, அதன் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: συγκαλοῦσιν
  choice: ஒன்றுகூட்டினார்கள்
  rationale: அனைவரையும் அழைத்து ஒரே குழுவாகச் சேர்த்தல் என்ற கூட்டுச்சொல்லின் கருத்தை இயல்பாகத் தருகிறது. கிரேக்கத்தின் வரலாற்று நிகழ்காலம் தமிழ்க் கதைநடையின் இயல்புக்காக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὅλην τὴν σπεῖραν
  choice: படைப்பிரிவு முழுவதையும்
  rationale: σπεῖρα குறிக்கும் ரோமப் படைப் பிரிவைத் தொழில்நுட்பச் சொல்லால் வாசிப்பைச் சிரமப்படுத்தாமல் தெரிவிக்கிறது; ‘முழுவதையும்’ என்பது ὅλην என்பதைத் தெளிவாகக் காக்கிறது.
