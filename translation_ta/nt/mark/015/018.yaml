  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: ta
  text: அவர்கள், “யூதர்களின்[b] அரசரே, வாழ்க!” என்று அவருக்கு வணக்கம் செலுத்தத்[a] தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அவரை வாழ்த்த.” கிரேக்க வினைச்சொல் சாதாரணமாக ஒருவரை வாழ்த்துவதைக் குறிக்கலாம்; ஆனால் இங்கே அது கேலியாகச் செலுத்தப்பட்ட முறையான மரியாதை வணக்கத்தின் தொனியைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “யூதேயர்களின்.” இச்சொல் யூத மக்களையோ யூதேயாவைச் சேர்ந்தவர்களையோ குறிக்கலாம்; இயேசுவின் பாடுபாட்டு நிகழ்வில் வரும் இந்தப் பட்டப்பெயருக்கு வழக்கமான பொருள் என்பதால் “யூதர்களின்” என்பது பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: தமிழில் இயல்பான தொடக்கத்திற்காக இணைப்புச் சொல் தனியே மொழிபெயர்க்கப்படாமல், முந்தைய நிகழ்வுடன் தொடரும் வாக்கிய அமைப்பில் விடப்பட்டுள்ளது; வசனத்தின் தொடர்ச்சிப் பொருள் மாறவில்லை.
- source_word: ἤρξαντο
