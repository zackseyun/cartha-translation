  rationale: தொடர்ந்து நடந்த கேலிச் செயலின் ஆரம்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀσπάζεσθαι αὐτόν
  choice: அவருக்கு வணக்கம் செலுத்த
  rationale: வினைச்சொல்லின் பொதுவான ‘வாழ்த்து/வணக்கம் கூறு’ என்ற பொருளையும், இச்சூழலில் படைவீரர்கள் நடித்துக் காட்டும் முறையான கேலி வணக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χαῖρε
  choice: வாழ்க
  rationale: இது இங்கே சாதாரண நல்வாழ்த்தல்ல; அரசருக்குச் செலுத்துவது போன்ற கேலியான ஆரவார வாழ்த்து. ‘வாழ்க’ அந்த அரச மரியாதைத் தொனியையும் இருண்முரணையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: யூதர்களின் அரசரே
  rationale: விளிவேற்றுமையை ‘அரசரே’ தக்கவைக்கிறது; இப்பாடுபாட்டு நிகழ்வின் பட்டப்பெயரில் Ἰουδαίων என்பதற்கு வழக்கமான ‘யூதர்களின்’ என்பதே பொருத்தமானது.
theological_decisions:
- issue: இயேசுவுக்குச் செலுத்தப்படும் கேலியான அரச வாழ்த்தின் இருண்முரணையும் அரசத் தன்மையையும் தக்கவைத்தல்
  choice: “யூதர்களின் அரசரே, வாழ்க!” என்ற முறையான அரச வாழ்த்தைப் போன்ற சொற்றொடர்
  alternative: “யூதர்களின் அரசரே, வணக்கம்!”
  rationale: ‘வாழ்க’ என்பது சாதாரண வரவேற்பைக் காட்டிலும் அரசரைப் போற்றுவது போன்ற தொனியைத் தருகிறது; அதே நேரத்தில் படைவீரர்களின் கேலியை விளக்கமாகச் சேர்க்காமல் வாசகர் உணரும்படி மூலத்தின் இறுக்கத்தைப் பாதுகாக்கிறது.
- issue: Ἰουδαίων என்பதன் மக்கள்/புவியியல் தெளிவின்மை
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இந்தப் பாடுபாட்டு பட்டப்பெயர்ச் சூழலில் ‘யூதர்களின் அரசர்’ என்பது நிலைபெற்ற இயல்பான பொருள்; இருப்பினும் புவியியல் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ராஜா’ என்பதற்குப் பதிலாகத் தரமான பொதுப்பயன்பாட்டுச் சொல்லான ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது. சொற்றொடரின் கேலித் தொனி விளக்கமாக மூலவசனத்துக்குள் சேர்க்கப்படாமல், அரச வாழ்த்தின் வடிவிலேயே உணர்த்தப்பட்டுள்ளது.
