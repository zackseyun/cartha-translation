  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: ta
  text: ஆனால் பிலாத்து மறுபடியும் அவரிடம், “நீர் பதில் ஒன்றும் சொல்லமாட்டீரா? பாருங்கள், உமக்கு எதிராக அவர்கள் எத்தனை குற்றச்சாட்டுகளைச் சுமத்துகிறார்கள்!” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் மென்மையான முரண்பாட்டைக் காட்டும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: பிலாத்து மீண்டும் கேட்டதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπηρώτα
  choice: கேட்டார்
  rationale: இறந்தகால நிறைவுறா வடிவம் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த கேள்வியைக் குறிக்கலாம்; πάλιν உடன் ‘மறுபடியும் ... கேட்டார்’ என்பது தமிழில் இயல்பாக அந்த நுணுக்கத்தைத் தருகிறது.
- source_word: λέγων
  choice: என்று
  rationale: கிரேக்க மொழியின் உரையறிமுகப் பங்கேற்பு வடிவத்தை நவீன தமிழின் இயல்பான நேரடி உரை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: நீர் பதில் ஒன்றும் சொல்லவில்லையா?
  rationale: இயேசுவின் மௌனத்தை வலியுறுத்தும் எதிர்மறைக் கேள்வியின் அழுத்தத்தைப் பாதுகாக்கிறது; பிலாத்து இயேசுவிடம் பேசுவதற்கு மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἴδε
  choice: பாரும்
  rationale: கவனத்தை ஈர்க்கும் ஒருமை ஏவலைத் தெளிவாகக் காட்டுகிறது; ‘இதோ’ எனும் பழமையான தொனியைத் தவிர்க்கிறது.
- source_word: πόσα
  choice: எத்தனை குற்றச்சாட்டுகளை
  rationale: சொற்பொருளில் ‘எத்தனை காரியங்களை’ என்றாலும், நீதித்துறைச் சூழலும் κατηγοροῦσιν என்பதும் குற்றச்சாட்டுகளையே குறிக்கின்றன; தமிழில் மறைந்துள்ள பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σου
  choice: உமக்கு எதிராக
  rationale: κατηγορέω உடன் வரும் ஆளைக் குறிக்கும் மரபை இயல்பான தமிழில் ‘எதிராக’ என வழங்குகிறது.
- source_word: κατηγοροῦσιν
  choice: கூறுகிறார்கள்
  rationale: ‘குற்றச்சாட்டுகளைக் கூறுகிறார்கள்’ என்ற முழுச் சொற்றொடர் தற்போது நடைபெறும் குற்றஞ்சாட்டுதலை நீதித்துறைச் சூழலில் தெளிவாகத் தருகிறது.
