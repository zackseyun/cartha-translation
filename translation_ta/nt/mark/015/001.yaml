id: MRK.15.1
reference: Mark 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: ta
  text: உடனடியாக, அதிகாலையில், தலைமை ஆசாரியர்கள் மூப்பர்களுடனும் மறைநூல் அறிஞர்களுடனும் முழு ஆளும் மன்றத்துடனும்[a] ஆலோசனை நடத்தினர். பின்னர் அவர்கள் இயேசுவைக் கட்டிவைத்து, அழைத்துச் சென்று, பிலாத்துவிடம் ஒப்படைத்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழு சன்ஹெட்ரினுடனும்.” கிரேக்கச் சொல் யூதர்களின் ஆளும் மன்றத்தைக் குறிக்கிறது.
    reason: συνέδριον என்பதற்கான வரலாற்றில் பரவலாக அறியப்படும் மாற்றுப் பெயரான ‘சன்ஹெட்ரின்’ என்பதைக் காக்கிறது.
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனடியாக
  rationale: மாற்குவின் விவரிப்பில் காணப்படும் செயலின் அவசரத்தையும் தாமதமின்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρωῒ
  choice: அதிகாலையிலேயே
  rationale: நாளின் தொடக்கத்திலேயே நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; -ஏ என்பது காலத்தின் உடனடித்தன்மையையும் வலியுறுத்துகிறது.
- source_word: συμβούλιον ποιήσαντες
  choice: ஆலோசனை நடத்தினார்கள்
  rationale: சொற்றொடரின் deliberative force-ஐ இயல்பான தமிழில் தருகிறது; வெறுமனே ஒரு திட்டம் தீட்டினார்கள் என்று குறுக்காமல், முறையான கலந்தாலோசனையைக் குறிக்கிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே பதவியில் இருந்த பல தலைமைக்குருக்கள் என்று தவறாக உணர்த்தாமல், முன்னணி குருத்துவ அதிகாரிகளைக் குறிக்கிறது.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: வயதான ஆண்கள் என்ற பொதுப்பொருளை விட, இச்சூழலில் அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கிறது.
- source_word: γραμματέων
  choice: வேத அறிஞர்கள்
  rationale: எழுத்தர்களின் வேதவிளக்கம் மற்றும் சட்ட நிபுணத்துவப் பங்கை சாதாரண நவீன வாசகருக்குப் புரியும் வகையில் தெரிவிக்கிறது.
- source_word: ὅλον τὸ συνέδριον
  choice: ஆட்சிமன்றம் முழுவதும்
  rationale: யூத ஆளும் அவையைக் குறிக்கும் நிறுவனப் பெயரை ஒலிபெயர்க்காமல் அதன் செயலையும் முழுமையையும் தெரிவிக்கிறது.
- source_word: δήσαντες
  choice: கட்டி
  rationale: இயேசுவை அழைத்துச் செல்வதற்கு முன் கட்டுப்படுத்திய நேரடியான செயலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀπήνεγκαν
  choice: அழைத்துக்கொண்டுபோய்
  rationale: காவலின்கீழ் அவரை அங்கிருந்து கொண்டு சென்றதைக் குறிக்கிறது; தூக்கிச் சென்றார்கள் என்ற தேவையற்ற உடல்சார் பொருளைத் தவிர்க்கிறது.
- source_word: παρέδωκαν
  choice: ஒப்படைத்தார்கள்
  rationale: ரோம ஆளுநரிடம் காவல் மற்றும் அதிகாரப் பொறுப்பை முறையாக மாற்றிய செயலைத் தெளிவாகக் காட்டுகிறது; இவ்வசனத்தில் சொல்லப்படாத மேலதிக இறையியல் பொருளைச் சேர்ப்பதில்லை.
- source_word: Πιλάτῳ
  choice: பிலாத்துவிடம்
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவத்தையும் கிரேக்க வேற்றுமையின் பெறுநர் பொருளையும் தருகிறது.
theological_decisions:
- issue: συνέδριον என்பதன் நிறுவனம் சார்ந்த குறிப்பு
  choice: ஆட்சிமன்றம் முழுவதும்
  alternative: சனகெரிம் முழுவதும்
  rationale: முதன்மை உரை நிறுவனத்தின் பொருளை நவீன வாசகருக்குத் தெளிவாக்குகிறது. வரலாற்றில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: பாடுவரலாற்றில் παρέδωκαν என்பதன் வலிமை
  choice: ஒப்படைத்தார்கள்
  alternative: கையளித்தார்கள்
  rationale: பிலாத்துவின் அதிகாரத்திற்கும் காவலுக்கும் இயேசுவை மாற்றியதை இயல்பாக வெளிப்படுத்துகிறது; இவ்விடத்தில் மூலச்சொல் வெளிப்படையாகக் கூறாத கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் நிகழ்வுவரிசை தெளிவாக இருக்க இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘உடனடியாக’ மற்றும் ‘அதிகாலையிலேயே’ ஆகிய இரு காலக் குறிப்புகளும் பாதுகாக்கப்பட்டுள்ளன.
