revisions:
- from: அதிகாலையிலேயே, தலைமைக் குருக்கள் மூப்பர்களோடும் வேத அறிஞர்களோடும் ஆட்சிமன்றம் முழுவதோடும்[a] உடனடியாக ஆலோசனை நடத்தினார்கள். பின்பு அவர்கள் இயேசுவைக் கட்டி, அழைத்துக்கொண்டுபோய், பிலாத்துவிடம் ஒப்படைத்தார்கள்.
