source:
  edition: SBLGNT
  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: ta
  text: 'அவர்மீது சுமத்தப்பட்ட குற்றச்சாட்டைக் குறிப்பிட்ட எழுத்து இவ்வாறு எழுதப்பட்டிருந்தது: “யூதர்களின் அரசர்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின் அரசர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: எழுதப்பட்டிருந்தது
  rationale: எழுத்தில் வைக்கப்பட்ட அறிவிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதே வேர்ச்சொல்லை மீண்டும் பயன்படுத்தும் கிரேக்க அமைப்பை தமிழில் செயற்கையாகப் பிரதிபலிக்காமல் கருத்தைத் தெளிவாகக் கூறுகிறது.
- source_word: αἰτία
  choice: அவர்மீது சுமத்தப்பட்ட குற்றச்சாட்டு
  rationale: நீதித்துறைச் சூழலில் அவருக்கு எதிராக அறிவிக்கப்பட்ட குற்றத்தைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπιγεγραμμένη
  choice: எழுதப்பட்டிருந்தது
  rationale: ἦν உடன் வரும் நிறைவுநிலைப் பெயரெச்சம், அந்த வாசகம் எழுதப்பட்ட நிலையில் இருந்ததைச் சுட்டுகிறது; தமிழ் இறந்தகால நிறைவுநிலை இதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: βασιλεὺς
  choice: அரசர்
  rationale: அரசப் பட்டத்தை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: Ἰουδαίων
  choice: யூதர்களின்
  rationale: நற்செய்திகளின் பாடுபாட்டு நிகழ்வில் காணப்படும் வழக்கமான இன-மத மக்கள் பெயரைப் பாதுகாக்கிறது; புவியியல் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: சிலுவைத் தலைப்பில் Ἰουδαίων என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இது இயேசுவோடு தொடர்புபடுத்தப்பட்ட ரோம அரசியல் குற்றச்சாட்டு அல்லது பட்டத்தை அறிக்கையிடுகிறது. வழக்கமான மக்கள்-குழுப் பொருளை முதன்மை உரை பாதுகாக்கிறது; சில சூழல்களில் சாத்தியமான புவியியல் பொருளை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. கிரேக்க வாக்கியத்தின் தகவல் வரிசை பெரும்பாலும் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கம் சேர்க்கப்படவில்லை.
