  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: ta
  text: 'ஆறாம் மணி வந்தபோது[b], ஒன்பதாம் மணிவரை நிலம் முழுவதும்[a] இருள் சூழ்ந்தது.


    [a] அல்லது, “பூமி முழுவதும்.” கிரேக்கச் சொல் “நிலம்” அல்லது “பூமி” என இரு பொருள்களையும் குறிக்கலாம்.


    [b] அதாவது, ஏறக்குறைய நண்பகல் பன்னிரண்டு மணி முதல் பிற்பகல் மூன்று மணி வரை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமி முழுவதும்.” கிரேக்கச் சொல் “நிலம்” அல்லது “பூமி” என இரு பொருள்களையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அதாவது, ஏறக்குறைய நண்பகல் பன்னிரண்டு மணி முதல் பிற்பகல் மூன்று மணி வரை.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: ஆறாம் மணி வந்தபோது
  rationale: காலத்தைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான தமிழில் தருகிறது. மூலத்தின் மணிநேரக் கணக்கை முதன்மை உரையில் பாதுகாத்து, நவீன நேர விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: σκότος
  choice: இருள்
  rationale: இச்சொல்லின் நேரடியான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: ἐγένετο
  choice: சூழ்ந்தது
  rationale: ‘நிலம் முழுவதும் இருள் சூழ்ந்தது’ என்பது நிகழ்வு ஏற்பட்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொற்சொல்லான ‘உண்டாயிற்று’ என்பதைவிட இச்சூழலில் வாசிப்புக்கு இயல்பானது.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: நிலம் முழுவதும்
  rationale: γῆ என்பதன் ‘நிலம்/பூமி’ என்ற பொருள் விரிவை அளவுக்கு மீறிக் குறுக்காமல் தருகிறது. உலகம் முழுவதையும் திட்டவட்டமாகக் குறிக்காமல், ‘பூமி முழுவதும்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἕως ὥρας ἐνάτης
  choice: ஒன்பதாம் மணிவரை
  rationale: மூலத்தின் நேரக் குறிப்பை ஆறாம் மணியுடன் ஒத்த முறையில் பாதுகாக்கிறது; நவீன நேர மாற்றம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: சிலுவை மரணத்தின்போதான இருள் தொடர்பில் γῆ என்பதன் பரப்பு
  choice: நிலம்
  alternative: பூமி
  rationale: γῆ என்ற கிரேக்கச் சொல் ‘நிலம்’ என்றும் ‘பூமி’ என்றும் பொருள்படலாம். முதன்மை உரையில் ‘நிலம்’ என்பது இருள் உலகக் கோளம் முழுவதையும் மூடியதாகத் திட்டவட்டமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது; உண்மையான சொற்பொருள் தெளிவின்மையை ‘பூமி’ என்ற மாற்று வாசகத்துடன் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியக்கூடிய இயல்பான மற்றும் கண்ணியமான நடை. பண்டைய நேரக் கணக்கை முதன்மை உரையில் வைத்துக் கொண்டு அதன் நவீன நேர இணை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
