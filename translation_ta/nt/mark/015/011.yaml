translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பரபாவையே’ என்ற ஏகார அழுத்தம் μᾶλλον என்பதன் முன்னுரிமைப் பொருளை வெளிப்படுத்துகிறது; மூலத்தில் இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘இயேசுவுக்குப் பதிலாக’ என்ற சொற்றொடர் பிரதான உரையில் சேர்க்கப்படவில்லை. இரு அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
