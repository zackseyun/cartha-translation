base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: ta
  text: ஆனால் தலைமைக் குருக்கள், பிலாத்து அவர்களுக்குப் பரபாவையே விடுதலை செய்யும்படி கூட்டத்தினரைத் தூண்டிவிட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூட்டத்தினரைக் கிளர்த்தினார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல், ஒரு கூட்டத்தை விரும்பிய செயலைச் செய்யும்படி எழுப்புதல் அல்லது தூண்டுதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மாறாக’ அல்லது ‘முன்னுரிமையாக’ என்றும் மொழிபெயர்க்கலாம். சூழலில் மறைமுகமாகக் குறிப்பிடப்படும் மற்றொரு தேர்வுக்குப் பதிலாகப் பரபா விடுதலை செய்யப்பட வேண்டும் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ஆனால்
  rationale: δέ இங்கு முந்தைய நிகழ்வுடன் மென்மையான முரண்பாட்டைக் காட்டுகிறது; அதனால் இயல்பான தமிழில் ‘ஆனால்’ பொருத்தமாக உள்ளது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: எருசலேமின் முதன்மை ஆசாரியத் தலைவர்களைக் குறிக்கும் பன்மைச் சொல்லுக்கு தெளிவான, சமகாலத் தமிழ் வடிவம்.
- source_word: ἀνέσεισαν
  choice: தூண்டிவிட்டார்கள்
  rationale: ஒரு கூட்டத்தை விரும்பிய செயலுக்கு எழுப்புதல் அல்லது தூண்டுதல் என்ற வினையின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸν ὄχλον
  choice: கூட்டத்தினரை
  rationale: ὄχλος என்பது இங்கு ஒன்றுகூடிய மக்களைக் குறிக்கிறது; வினையின் செயப்படுபொருளாக மனிதர்களைக் காட்ட ‘கூட்டத்தினரை’ இயல்பானது.
- source_word: ἵνα
  choice: செய்யுமாறு
  rationale: தலைமைக் குருக்கள் கூட்டத்தைத் தூண்டிய நோக்கத்தையும் அவர்கள் கோர வேண்டிய செயலையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: μᾶλλον
  choice: பரபாவையே
  rationale: μᾶλλον காட்டும் முன்னுரிமை அல்லது ‘மற்றவருக்குப் பதிலாக’ என்ற ஒப்பீட்டு வலிமையை ஏகார அழுத்தம் இயல்பாக வெளிப்படுத்துகிறது; ஒப்பிடப்படும் இயேசுவின் பெயரை இந்த வசனத்தில் சேர்க்கவில்லை.
- source_word: τὸν Βαραββᾶν
  choice: பரபா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: ἀπολύσῃ
  choice: விடுதலை செய்யுமாறு
  rationale: ἵνα-வுடன் வரும் இறந்தகாலத் தற்சார்பு வினை இங்கு நோக்கப்பட்ட விளைவைக் குறிக்கிறது; பிலாத்து மறைமுக எழுவாய் என்பதைத் தமிழ் அமைப்பு காக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: விடுதலையின் பயனாளிகள் அல்லது பெறுநர்கள் கூட்டத்தினர் என்பதைக் காட்டும் தத்திவை நேரடியாகத் தெரிவிக்கிறது.
