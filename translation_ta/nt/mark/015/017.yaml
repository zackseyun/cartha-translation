  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: ta
  text: அவர்கள் அவருக்கு ஊதா நிறத் துணியை[a] அணிவித்தார்கள்; முட்களால் ஒரு கிரீடத்தைப் பின்னி, அதை அவருக்குச் சூட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருக்கு ஊதா நிற ஆடையை அணிவித்தார்கள்.’ கிரேக்கச் சொல் ஊதா நிறத் துணியையோ ஆடையையோ குறிக்கலாம்; இவ்வசனத்தில் ஆடையின் குறிப்பிட்ட வகை சொல்லப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: அணிவித்தார்கள்
  rationale: ஒருவருக்கு ஆடை அணிவிக்கும் செயலை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: πορφύραν
  choice: ஊதா நிற ஆடையை
  rationale: இச்சொல் ஊதா நிறத் துணியையோ ஆடையையோ குறிக்கலாம். தமிழில் இயல்பாகப் பொருள் விளங்க ‘ஆடை’ சேர்க்கப்பட்டுள்ளது; குறிப்பிட்ட வகையான ‘அங்கி’ என்று வரையறுக்கப்படவில்லை.
- source_word: περιτιθέασιν
  choice: அதை அவருக்குச் சூட்டினார்கள்
  rationale: கிரீடத்தை ஒருவர்மேல், குறிப்பாகத் தலையில், வைப்பதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘சூட்டினார்கள்’; ‘அதை’ என்பது பின்னப்பட்ட கிரீடத்தைக் தெளிவாகச் சுட்டுகிறது.
- source_word: πλέξαντες
  choice: பின்னி
  rationale: முட்களை ஒன்றோடொன்று பின்னி கிரீடமாக்கிய முன்செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀκάνθινον
  choice: முட்களால்
  rationale: அது முட்களால் செய்யப்பட்டதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: στέφανον
  choice: கிரீடம்
  rationale: στέφανος என்பதற்கு வளையம் அல்லது மாலை என்ற பொருளும் இருக்கலாம்; ஆனால் இங்கு ஊதா ஆடையுடன் இணைந்த அரசர்போன்ற கேலி நிகழ்வில் ‘கிரீடம்’ பொருத்தமானது.
theological_decisions:
- issue: இயேசுவை அரசராகக் கேலி செய்யும் காட்சி
  choice: στέφανος என்பதற்கு ‘கிரீடம்’
  alternative: வளையம் / மாலை
  rationale: ஊதா ஆடையும் முட்களால் செய்யப்பட்ட தலை அணியும் அரச அடையாளங்களைப் பகடியாகப் பயன்படுத்துகின்றன. ‘கிரீடம்’ இந்தக் கதைசார் கேலியைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கொள்கை விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஊதா நிற ஆடை’ என்பது புரிதலுக்காக ஆடைப் பொருளை வெளிப்படுத்துகிறது; மூலத்தில் அதன் குறிப்பிட்ட வகை தெளிவாக இல்லாததால் அடிக்குறிப்பு மூலம் மாற்றுப் பொருள் பாதுகாக்கப்பட்டுள்ளது.
