source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: ta
  text: பிலாத்து அவரிடம், “நீ யூதர்களின் அரசனா?” என்று கேட்டான்.[a] அதற்கு அவர், “நீரே சொல்கிறீர்” என்று பதிலளித்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதேயர்களின் அரசனா?’ என்றும் மொழிபெயர்க்கலாம். இங்கே ‘யூதர்களின் அரசன்’ என்பது பிலாத்துவின் முன் வைக்கப்பட்ட வழக்கமான அரசியல் குற்றச்சாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நீர் சொல்கிறீர்’ அல்லது இன்னும் வெளிப்படையாக, ‘அப்படிச் சொல்வது நீர்தான்’ என்றும் மொழிபெயர்க்கலாம். இயேசுவின் பதில் மிகவும் சுருக்கமானது; அதில் ஓரளவு இருபொருள் தன்மை உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: கேட்டான்
  rationale: இந்த வினைச்சொல் ‘கேட்டான்’ அல்லது ‘வினவினான்’ என்று பொருள்படும். விசாரணையின் கடுமையை மூலச்சொல் வெளிப்படையாக வலியுறுத்தாததால், இயல்பான ‘கேட்டான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Σὺ εἶ
  choice: நீ … அரசனா?
  rationale: கிரேக்கத்தில் வலியுறுத்தப்பட்டுள்ள இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல்லைத் தமிழில் ‘நீ’ என்று வெளிப்படுத்தி, கேள்வி வடிவம் இயல்பாக அமைக்கப்பட்டது.
- source_word: βασιλεὺς
  choice: அரசன்
  rationale: அரசுரிமையையும் பிலாத்துவிடம் முன்வைக்கப்பட்ட அரசியல் குற்றச்சாட்டையும் துல்லியமாகக் காட்டுகிறது; பொதுவான ‘ஆட்சியாளர்’ என்பதைக் காட்டிலும் இது பொருத்தமானது.
- source_word: Ἰουδαίων
  choice: யூதர்களின்
  rationale: இந்தச் சூழலில் ‘யூதர்களின் அரசன்’ என்பது பிலாத்துவின் முன் வைக்கப்பட்ட வழக்கமான அரசியல் குற்றச்சாட்டைச் சுட்டும் நிலைபெற்ற சொற்றொடர். ‘யூதேயர்களின்’ என்பதும் சொல்லியல் ரீதியாகச் சாத்தியம்.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: அதற்கு அவர் … என்று பதிலளித்தார்
  rationale: கிரேக்கப் பங்கேற்புவினை மற்றும் வரலாற்று நிகழ்காலத்தைச் சொல்லுக்குச் சொல் பின்பற்றாமல், அவற்றின் நிகழ்வுறவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Σὺ λέγεις
  choice: நீரே சொல்கிறீர்
  rationale: மூலத்தின் சுருக்கத்தையும் மறைமுகத்தன்மையையும் காக்கிறது. ‘ஆம்’ அல்லது ‘அப்படியே’ என்பதைச் சேர்க்காமல், அந்தச் சொல்லாக்கம் பிலாத்துவுடையது என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: Σὺ λέγεις என்ற இயேசுவின் பதிலின் வலிமை
  choice: முழுமையான உறுதிப்படுத்தலாகவோ மறுப்பாகவோ மாற்றாமல், ‘நீரே சொல்கிறீர்’ என்று கட்டுப்படுத்தப்பட்டதும் ஓரளவு இருபொருளுடையதுமான பதிலாக மொழிபெயர்த்தல்
  alternative: ‘ஆம், நீர் சொல்வது சரிதான்’ என்ற நேரடியான உறுதிப்படுத்தல்; அல்லது ‘நீர் சொல்கிறீர்’ என்ற இன்னும் சொல்லுக்குச் சொல் வடிவம்
  rationale: கிரேக்கத்தில் ‘ஆம்’ இல்லை. பதில் அந்தப் பட்டத்தை மறுப்பதுமில்லை; பிலாத்துவின் சொல்லாக்கத்தை எந்த விளக்கமும் இன்றி முழுமையாக ஏற்றுக்கொள்வதுமில்லை. ஆகவே மூலத்திலுள்ள இறையியல் பதற்றம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பிலாத்து இயேசுவிடம் பேசும்போது மூலத்தின் ஒருமையை ‘நீ’ காக்கிறது; இயேசுவின் பதிலில் ‘நீரே’ என்பது தமிழில் கண்ணியமான ஒருமை அழைப்பாக இருந்து, ‘நீங்களே’ என்ற இலக்கணப் பன்மையைத் தவிர்க்கிறது. ‘அதற்கு’ என்பது மீண்டும் ‘அவனிடம்’ என்று சொல்வதால் ஏற்படும் கனத்தைத் தவிர்த்து உரையாடல் தொடர்பைத் தெளிவாக்குகிறது.
