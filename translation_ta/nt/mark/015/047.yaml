  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: ta
  text: மகதலேனா மரியாளும் யோசேயின் தாயாகிய மரியாளும்[a] அவர் எங்கே வைக்கப்பட்டிருந்தார் என்பதைக் கவனித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “யோசேயின் மரியாள்.” கிரேக்க வாசகம் இந்த மரியாளை யோசேயுடனான உறவால் அடையாளப்படுத்துகிறது; அந்த உறவைக் குறிக்கும் சொல்லை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: -உம் … -உம்
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் முந்தைய அடக்க நிகழ்வைத் தொடர்ந்து சொல்கிறது. தமிழில் இரு பெயர்களையும் இணைக்கும் ‘-உம் … -உம்’ அமைப்பே இயல்பான தொடர்ச்சியை அளிக்கிறது; தனியாக ‘மேலும்’ சேர்ப்பது தேவையில்லை.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: மகதலேனா மரியாள்
  rationale: மரியாளை அடையாளப்படுத்தும் வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவம்; கிரேக்க அடைமொழியின் அடையாளப்படுத்தும் செயலையும் காக்கிறது.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: யோசேயின் தாயாகிய மரியாள்
  rationale: மாற்கு நூலின் சூழலில் இந்த உறவு தாய்–மகன் உறவாகப் புரிகிறது; இயல்பான தமிழுக்காக ‘தாயாகிய’ என்பது வெளிப்படுத்தப்படுகிறது. எனினும் கிரேக்கம் உறவை மட்டும் நேரடியாகக் குறிப்பதால் மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐθεώρουν
  choice: கவனித்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடந்த செயலைக் குறிக்கும் imperfect வடிவத்தைத் தமிழ் தொடர்நிலை வினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ποῦ
  choice: எங்கே
  rationale: இடத்தை விசாரிக்கும்/சுட்டும் ποῦ என்பதன் நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: τέθειται
  choice: வைக்கப்பட்டிருந்தார்
  rationale: τίθημι என்பதன் perfect passive வடிவம், வைக்கப்பட்ட செயலும் அதன் விளைவாக அங்கே இருந்த நிலையும் சேர்ந்த கருத்தைத் தருகிறது. ‘வைக்கப்பட்டிருந்தார்’ அந்த நிறைவுற்ற செயல் மற்றும் தொடரும் நிலையை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: செயப்பாட்டு வினையின் வெளிப்படையாகச் சொல்லப்படாத எழுவாய்
  choice: ‘அவர்’ என்று வெளிப்படுத்தப்பட்டது
  alternative: ‘உடல்’ அல்லது ‘அது’ என்று குறிப்பிடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் சூழலால் தெளிவாக இருப்பதால் விடப்பட்டுள்ளது; குறிக்கப்படுபவர் இயேசு. தமிழில் தெளிவுக்காக மரியாதைப் பன்மை வடிவமான ‘அவர்’ பயன்படுத்தப்படுவது, அவரை வெறும் உடலாகப் பொருள்படுத்துவதைத் தவிர்க்கிறது.
- issue: Ἰωσῆτος என்ற உடைமை வேற்றுமையின் உறவு
  choice: ‘யோசேயின் தாயாகிய’ என்று சூழல்சார் உறவு வெளிப்படுத்தப்பட்டது
  alternative: ‘யோசேயின் மரியாள்’ என்று உறவைத் திறந்த நிலையில் விடுதல்
  rationale: மாற்கு 15:40 மற்றும் இங்குள்ள அடையாளப்படுத்தும் நடை தாய் உறவை வலுவாகச் சுட்டுகிறது. இருப்பினும் கிரேக்க வடிவம் தானாகவே ‘தாய்’ என்ற சொல்லைக் கொண்டிருக்காததால் அந்த மொழியியல் திறந்தநிலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. ‘கவனித்துக்கொண்டிருந்தார்கள்’ தொடர்ச்சியான பார்வையைக் காட்டுகிறது; ‘வைக்கப்பட்டிருந்தார்’ நிறைவுற்ற அடக்கச் செயலின் விளைவுநிலையைப் பாதுகாக்கிறது. பெயர்கள் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவங்களில் தரப்பட்டுள்ளன.
