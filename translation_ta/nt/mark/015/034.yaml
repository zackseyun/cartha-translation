id: MRK.15.34
reference: Mark 15:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: ta
  text: 'ஒன்பதாம் மணி நேரத்தில் இயேசு உரத்த குரலில் கூக்குரலிட்டு, “எலோயி, எலோயி, லெமா சபக்தானி?”[a] என்றார். இதன் மொழிபெயர்ப்பு: “என் கடவுளே, என் கடவுளே,[b] எதற்காக[c] என்னைக் கைவிட்டீர்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளிலும் பல மொழிபெயர்ப்பு மரபுகளிலும் ‘லெமா சபக்தானி’ என்பதற்குப் பதிலாக ‘லாமா சபக்தானி’ என்ற வடிவம் காணப்படுகிறது.
    reason: textual_variant
  - marker: b
    text: இயேசுவின் இந்த வார்த்தைகள் சங்கீதம் 22:1-ஐ எதிரொலிக்கின்றன.
    reason: cross_reference
  - marker: c
    text: 'அல்லது: ‘ஏன் என்னைக் கைவிட்டீர்?’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: ஒன்பதாம் மணி வேளையில்
  rationale: மாற்குவின் காலக் கணிப்பு முறையை அப்படியே தக்கவைக்கிறது; ‘பிற்பகல் மூன்று மணிக்கு’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: உரத்த குரலில் கூக்குரலிட்டு
  rationale: வினைச்சொல்லின் வலிமையையும் φωνῇ μεγάλῃ குறிக்கும் உரத்த ஒலியையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: எலோயி, எலோயி, லெமா சபக்தானி
  rationale: மாற்கு முதலில் இயேசுவின் செமித்திய மொழிக் கூற்றை ஒலிபெயர்த்து, பின்னர் அதன் பொருளைத் தரும் அமைப்பைப் பாதுகாக்கிறது; SBLGNT வாசகமான λεμά அடிப்படையில் ‘லெமா’ பயன்படுத்தப்பட்டது.
- source_word: μεθερμηνευόμενον
  choice: இதன் மொழிபெயர்ப்பு
  rationale: செமித்திய கூற்றுக்குக் கிரேக்கத்தில் தரப்பட்ட மொழிபெயர்ப்பு விளக்கத்தைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: Ὁ θεός μου ὁ θεός μου
  choice: என் கடவுளே, என் கடவுளே
  rationale: நேரடி அழைப்பையும் இருமுறை கூறப்படும் வேதனையின் வலிமையையும் பாதுகாக்கிறது.
- source_word: εἰς τί
  choice: எதற்காக
  rationale: சொற்றொடரின் ‘எந்தக் காரணத்திற்காக’ என்ற நுணுக்கத்தைத் தக்கவைக்கிறது; இயல்பான ‘ஏன்’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: ἐγκατέλιπές με
  choice: என்னைக் கைவிட்டீர்
  rationale: கைவிடப்பட்ட நிலையைத் தெளிவாகக் கூறுகிறது; தமிழில் கடவுளை நேரடியாக அழைக்கும் சூழலுக்கேற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவின் கூக்குரலுக்கும் சங்கீதம் 22:1-க்கும் உள்ள தொடர்பு
  choice: கைவிடப்பட்டதைக் குறித்த நேரடிக் கூக்குரலை எந்த விளக்கத்தாலும் மென்மைப்படுத்தாமல் தக்கவைத்து, சங்கீதத் தொடர்பை அடிக்குறிப்பில் சுட்டிக்காட்டுதல்
  alternative: முதன்மை உரையிலேயே இது சங்கீத மேற்கோள் என்று விளக்குதல் அல்லது கைவிடப்பட்டதன் பொருளை இறையியல் விளக்கத்தால் வரையறுத்தல்
  rationale: வசனம் வெளிப்படுத்தும் வேதனையையும் இறையியல் பதற்றத்தையும் அப்படியே பாதுகாக்கிறது; குமாரனுக்கும் பிதாவுக்கும் உள்ள உறவைப் பற்றிய குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- issue: இயேசுவின் செமித்திய மொழிக் கூற்றை வழங்குதல்
  choice: ஒலிபெயர்க்கப்பட்ட கூற்றையும் அதைத் தொடர்ந்து அதன் தமிழ்ப் பொருளையும் வழங்குதல்
  alternative: தமிழ்ப் பொருளை மட்டும் தருதல் அல்லது மத்தேயுவின் ‘ஏலி, ஏலி’ வடிவத்துடன் ஒத்திசைத்தல்
  rationale: மாற்குவின் தனித்துவமான இருநிலை வழங்கலைப் பின்பற்றி, வேறு நற்செய்தியுடன் ஒத்திசைப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கடவுளே’ மற்றும் ‘கைவிட்டீர்’ ஆகியவை நேரடி அழைப்பின் மரியாதையையும் வசனத்தின் தீவிரத்தையும் தக்கவைக்கின்றன; பழமையான அல்லது குறிப்பிட்ட சபைமரபுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
