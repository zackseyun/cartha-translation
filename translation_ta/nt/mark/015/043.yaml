id: MRK.15.43
reference: Mark 15:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: ta
  text: அரிமத்தியாவைச் சேர்ந்த யோசேப்பு மதிப்புக்குரிய[a] ஆலோசனைச் சங்க உறுப்பினர்; அவரும் தேவனுடைய அரசாட்சிக்காகக் காத்திருந்தவர். அவர் வந்து, துணிந்து[b] பிலாத்துவிடம் சென்று, இயேசுவின் உடலைக் கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முக்கியமான’ அல்லது ‘கண்ணியமான’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘துணிந்த பின்பு’ அல்லது ‘துணிவுடன்’ என்றும் மொழிபெயர்க்கலாம்; பிலாத்துவை அணுகியதில் யோசேப்பு காட்டிய துணிவை கிரேக்கம் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: அவர் வந்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் வருகையை வினையெச்சமாக இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் உள்ள இயக்கக் குறிப்பை நீக்கவில்லை.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: அரிமத்தியாவைச் சேர்ந்த
  rationale: யோசேப்பின் ஊர்த் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εὐσχήμων
  choice: மதிப்புக்குரிய
  rationale: சமூக மதிப்பும் கண்ணியமான நிலையுமாகிய சொற்பொருளை நவீனத் தமிழில் எளிதாக எடுத்துரைக்கிறது.
- source_word: βουλευτής
  choice: ஆலோசனைச் சங்க உறுப்பினர்
  rationale: கிரேக்கம் குறிப்பிடும் சங்க உறுப்பினர் என்ற பொதுவான பொருளைப் பேணுகிறது; மூலத்தில் நேரடியாக இல்லாத ‘சனகெரிப்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: ὃς καὶ αὐτὸς
  choice: அவரும்
  rationale: καὶ αὐτός என்பதன் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἦν προσδεχόμενος
  choice: காத்திருந்தவர்
  rationale: தொடர்ந்து எதிர்நோக்கியிருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: தேவனுடைய அரசாட்சி
  rationale: βασιλεία என்பதன் ஆட்சி அல்லது அரசாளுதல் சார்ந்த கருத்தை முன்னிறுத்துகிறது; தமிழில் புரிந்துகொள்ளக்கூடிய வேதாகம நடையைப் பேணுகிறது.
- source_word: τολμήσας
  choice: துணிந்து
  rationale: பிலாத்துவை அணுகுவதற்கு வேண்டிய துணிவை வினையடையாகத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: பிலாத்துவிடம் சென்று
  rationale: பிலாத்துவின் முன்னிலைக்குச் சென்ற இயக்கத்தை இயல்பான தமிழில் தருகிறது; ‘உள்ளே சென்றார்’ எனச் சொல்வதால் தமிழில் ஏற்படும் தேவையற்ற இடவியல் வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ
  choice: இயேசுவின் உடலைக் கேட்டார்
  rationale: யோசேப்பு இயேசுவின் உடலைத் தம்மிடம் ஒப்படைக்குமாறு கோரியதைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: βουλευτής குறிப்பிடும் சங்கத்தின் அடையாளம்
  choice: ஆலோசனைச் சங்க உறுப்பினர்
  alternative: சனகெரிப் சங்க உறுப்பினர்
  rationale: சூழலில் யூத ஆலோசனைச் சங்கம் கருதப்பட்டிருக்கலாம்; ஆனாலும் கிரேக்கச் சொல் அந்தச் சங்கத்தைப் பெயரிட்டு குறிப்பிடாததால் பிரதான உரை அதைவிடத் துல்லியமாகச் சொல்லவில்லை.
- issue: βασιλεία τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: தேவனுடைய அரசாட்சி
  alternative: தேவனுடைய ராஜ்யம்
  rationale: ‘அரசாட்சி’ என்பது ஆட்சி செய்தல் மற்றும் ஆளுகை ஆகிய பொருள்களையும் திறந்தவையாக வைத்திருக்கிறது; இதை வெறும் நிலப்பரப்பாகக் குறுக்கவில்லை.
- issue: τολμήσας என்பதன் வலிமை
  choice: துணிந்து
  alternative: தைரியமடைந்து
  rationale: யோசேப்பின் செயலில் இருந்த ஆபத்துணர்வையும் துணிவையும் இயல்பான தமிழில் பேணுகிறது; அவர் முன்பு பயந்திருந்தார் என்று தேவையின்றி ஊகிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், யோசேப்பின் வருகை, நிலை, எதிர்பார்ப்பு, துணிவு, கோரிக்கை ஆகிய அனைத்து கூறுகளும் பேணப்பட்டுள்ளன.
