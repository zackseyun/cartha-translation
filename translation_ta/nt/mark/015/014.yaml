source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: ta
  text: ஆனால் பிலாத்து அவர்களிடம், “ஏன், அவன் என்ன தீமை செய்தான்?”[a] என்று கேட்டுக்கொண்டிருந்தான். அவர்களோ இன்னும் அதிகமாகக் கூக்குரலிட்டு, “அவனைச் சிலுவையில் அறையுங்கள்!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன், அவன் என்ன தவறு செய்தான்?”
    reason: γάρ கொண்ட வினாவைத் தக்கவைத்தபடி, κακόν என்பதற்கு மென்மையான சொற்பொருள் மாற்றாக ‘தவறு’ என்பதைக் காட்டுகிறது.
lexical_decisions:
- source_word: ἔλεγεν
  choice: கேட்டுக்கொண்டிருந்தான்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த பேச்சைக் காட்டக்கூடும். இங்கு கேள்வி உரையாக இருப்பதால், தமிழில் இயல்பாக ‘கேட்டுக்கொண்டிருந்தான்’ என்று தரப்பட்டுள்ளது.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: இவன் அப்படி என்ன தீமை செய்தான்?
  rationale: γάρ இங்கு முந்தைய கோரிக்கைக்கான காரணத்தை எதிர்கேள்வியாகக் கேட்கிறது. ‘அப்படி என்ன’ என்பது அதன் வாதத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; κακόν என்பதன் அறநெறி வலிமையை ‘தீமை’ காக்கிறது.
- source_word: περισσῶς
  choice: இன்னும் அதிகமாக
  rationale: கூட்டத்தின் எதிர்வினை மேலும் தீவிரமடைந்ததை இந்தச் சொற்றொடர் காட்டுகிறது; வெறும் ஒலியளவை மட்டும் குறிப்பதாகக் கட்டுப்படுத்தவில்லை.
- source_word: ἔκραξαν
  choice: கூக்குரலிட்டார்கள்
  rationale: κράζω குறிக்கும் உரத்த பொதுக் கூச்சலை இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: Σταύρωσον αὐτόν
  choice: அவனைச் சிலுவையில் அறையுங்கள்!
  rationale: பிலாத்தை நேரடியாக நோக்கி விடுக்கப்பட்ட கட்டளையைத் தமிழில் மரியாதைப் பன்மை வினைமுற்றுடன் இயல்பாகக் காட்டுகிறது; செயலை காரணவினையாக மாற்றாமல் நேரடித்தன்மையைக் காக்கிறது.
- source_word: δὲ
  choice: ஆனால் / அவர்களோ
  rationale: இரு கூற்றுகளுக்கிடையேயுள்ள மாறுபாட்டை முதல் இடத்தில் ‘ஆனால்’ என்றும், அடுத்த இடத்தில் இயல்பான தமிழ் எதிர்நிலைக் கட்டமைப்பான ‘அவர்களோ’ என்றும் வெளிப்படுத்துகிறது.
- source_word: Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பிலாத்தின் கேள்வியில் κακόν என்பதன் அறநெறி வலிமை
  choice: ‘தீமை’ என்று மொழிபெயர்த்தல்
  alternative: ‘தவறு’ என்று மொழிபெயர்த்தல்
  rationale: சட்ட மற்றும் அறநெறிக் குற்றச்சாட்டின் வலிமையை ‘தீமை’ தெளிவாகக் காக்கிறது; அதேவேளையில் கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேசமயம் கண்ணியமான நடை. பிலாத்தின் தொடர்ந்த கேள்வியும் கூட்டத்தின் அதிகரித்த கூக்குரலும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
