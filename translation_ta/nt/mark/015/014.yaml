revisions:
- from: ஆனால் பிலாத்து அவர்களிடம், “இவன் அப்படி என்ன தீமை செய்தான்?”[a] என்று கேட்டுக்கொண்டிருந்தான். அவர்களோ இன்னும் அதிகமாக, “அவனைச் சிலுவையில் அறையுங்கள்!” என்று கூக்குரலிட்டார்கள்.
  to: ஆனால் பிலாத்து அவர்களிடம், “ஏன், அவன் என்ன தீமை செய்தான்?”[a] என்று கேட்டுக்கொண்டிருந்தான். அவர்களோ இன்னும் அதிகமாகக் கூக்குரலிட்டு, “அவனைச் சிலுவையில் அறையுங்கள்!” என்றார்கள்.
  rationale: முதன்மை உரையில் γάρ-இன் வாதரீதியான கேள்வித்தன்மையைத் தெளிவாகக் காக்க ‘ஏன்’ சேர்க்கப்பட்டது; κακόν-இன் வலிமை ‘தீமை’ எனத் தக்கவைக்கப்பட்டது. கூட்டத்தின் பதிலில் περισσῶς-இன் தீவிரம் ‘இன்னும் அதிகமாகக்’ எனவும், κράζω-இன் உரத்த பொதுக்கூச்சல் ‘கூக்குரலிட்டு’ எனவும் காக்கப்பட்டுள்ளது. பொருள் அல்லது இறையியல் விளக்கத்தில் எந்த மாற்றமும் செய்யப்படவில்லை.
