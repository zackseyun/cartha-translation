id: MRK.15.3
reference: Mark 15:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κατηγόρουν αὐτοῦ οἱ ἀρχιερεῖς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/003.yaml
  text: And the chief priests were accusing him of many things[a].
translation:
  language: ta
  text: மேலும் தலைமை ஆசாரியர்கள் பல காரியங்களைக் குறித்து அவர்மீது குற்றஞ்சாட்டிக்கொண்டிருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் முறைப்படியாக, “அவர்மீது பல குற்றச்சாட்டுகளைச் சுமத்திக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய நிகழ்வுடன் இவ்வாக்கியத்தை இணைக்கும் எளிய தொடர்ச்சிச் சொல்; மாற்குவின் இணைநிலை கதைநடையை இயல்பான தமிழில் காக்கிறது.
- source_word: κατηγόρουν
  choice: குற்றஞ்சாட்டிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடைபெற்ற செயலைக் குறிக்கும் கிரேக்க முற்றுப்பெறா வினையின் பொருளை வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ
  choice: அவர்மீது
  rationale: κατηγορέω என்பதுடன் வரும் ஆறாம் வேற்றுமை, குற்றஞ்சாட்டப்பட்ட நபரைக் குறிக்கிறது; தமிழில் ‘அவர்மீது’ என்பது அந்த உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: ஒரே தலைமைக் குருவைப் பன்மைப்படுத்தாமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் வழக்கமான தமிழ் சொற்றொடர்.
- source_word: πολλά
  choice: பல காரியங்களைக் குறித்து
  rationale: எந்தக் குறிப்பிட்ட குற்றச்சாட்டுகளையும் உரை சொல்லாததால், பல்வேறு விஷயங்களைப் பற்றிய குற்றச்சாட்டுகள் என்ற பரந்த பொருளைக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான குற்றஞ்சாட்டுதலை ‘கொண்டிருந்தார்கள்’ என்பதன் மூலம் தெளிவுபடுத்தி, மூலத்தின் சட்டரீதியான தன்மையை அளவுக்கு மீறிக் குறிப்பாக்காமல் வைத்துள்ளது.
