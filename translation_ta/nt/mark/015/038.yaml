  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: ta
  text: ஆலயத்தின்[b] திரை[a] மேலிருந்து கீழ்வரை இரண்டாகக் கிழிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்தின் மறைப்புத் திரை.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல் இங்கு ஆலயத்தின் உட்புறப் புனித இடத்தை இன்னும் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: திரை
  rationale: ஆலயத்துக்குள் தொங்கியிருந்த மறைப்புத் திரையைக் குறிக்கிறது. ‘திரை’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, பொருளின் அடையாள அர்த்தத்தை மொழிபெயர்ப்பிலேயே விளக்காமல் அதன் காட்சித் தன்மையைப் பாதுகாக்கிறது.
- source_word: ναοῦ
  choice: ஆலயத்தின்
  rationale: ναός என்பது விரிந்த ஆலய வளாகத்தைவிட ஆலயத்தின் புனிதக் கட்டடத்தை, இன்னும் குறிப்பாக அதன் உட்பகுதியைக் குறிக்கக்கூடும். முதன்மை உரையில் இயல்பான ‘ஆலயம்’ பயன்படுத்தப்பட்டு, இந்தக் குறிப்பான சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐσχίσθη
  choice: கிழிந்தது
  rationale: σχίζω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம்; திரை கிழிக்கப்படுதலுக்கு உட்பட்டதை இது தெரிவிக்கிறது. தமிழில் ‘கிழிந்தது’ இயல்பான வடிவமாக இருப்பதோடு, செய்பவர் யார் என்பதை வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: εἰς δύο
  choice: இரண்டாக
  rationale: இரு பகுதிகளாகப் பிரிந்ததைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: மேலிருந்து கீழ்வரை
  rationale: கிழிதலின் திசையையும் முழு நீளத்தையும் கிரேக்கத்தின் இடவியல் வலியுறுத்தலுடன் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை)
  rationale: தமிழ் கதைநடையில் முந்தைய நிகழ்வைத் தொடர்ந்து வரும் இந்த வாக்கியத்துக்கு தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்க்காமல் தொடர்வது இயல்பானது; ‘அப்போது’ என்றால் கிரேக்கத்தில் வெளிப்படையாக இல்லாத காலநுட்பத்தைச் சேர்க்கக்கூடும்.
theological_decisions:
- issue: ஆலயத் திரை கிழிந்ததன் சாத்தியமான அடையாளப் பொருள்
  choice: நிகழ்வை மட்டும் விவரித்து, அதன் அடையாளப் பொருளை முதன்மை உரையில் விளக்கவில்லை.
  alternative: இது கடவுளிடம் செல்லும் வழி திறந்ததையோ ஆலய அமைப்பின் மீதான தீர்ப்பையோ குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே விளக்குதல்.
  rationale: இந்த வசனம் நிகழ்வைப் பதிவு செய்கிறது; அதன் இறையியல் பொருளை வெளிப்படையாகத் தரவில்லை. ஆகவே பல்வேறு விளக்கங்களுக்கு இடமளிக்கும் மூல உரையின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயத்தின் திரை’ என்பது சாதாரண வாசகர்களுக்குத் தெளிவாக உள்ளது; மூலத்தின் சாத்தியமான குறிப்பான பொருள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
