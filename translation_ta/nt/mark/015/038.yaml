  source_fidelity: மூல கிரேக்கத்தின் καταπέτασμα, ναοῦ, ἐσχίσθη, εἰς δύο, மற்றும் ἀπ’ ἄνωθεν ἕως κάτω ஆகிய கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘கிழிந்தது’ செயப்பாட்டு நிகழ்வைச் செய்பவரைக் குறிப்பிடாமல் காக்கிறது; அடையாளப் பொருள் சேர்க்கப்படவில்லை.
  naturalness: ‘ஆலயத்தின் திரை மேலிருந்து கீழ்வரை இரண்டாகக் கிழிந்தது’ என்பது நவீன நிலையான தமிழில் தெளிவான, சுருக்கமான, கண்ணியமான கதைநடையாக உள்ளது. கிரேக்க καὶ-க்கு தனி இணைப்புச்சொல் விடப்பட்டிருப்பது தமிழ் நடைமுறையில் இயல்பானது; பொருள் இழப்பு இல்லை.
  terminology: ‘திரை’ என்பது καταπέτασμα-க்கு இயல்பான முதன்மைச் சொல்லாகும்; ‘மறைப்புத் திரை’ என்ற மாற்று அடிக்குறிப்பு பயனுள்ளது. ναός-இன் ஆலய உட்புறப் புனித இடம் என்ற குறிப்பான சாத்தியத்தை அடிக்குறிப்பு உரிய முறையில் காக்கிறது; எந்தக் குறிப்பிட்ட இறையியல் விளக்கமும் திணிக்கப்படவில்லை.
