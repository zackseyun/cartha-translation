  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: ta
  text: “இஸ்ரவேலின் அரசரான மேசியா[a], இப்போது சிலுவையிலிருந்து இறங்கி வரட்டும்; நாங்கள் கண்டு நம்பும்படி.” அவருடன் சிலுவையில் அறையப்பட்டவர்களும் அவரை இகழ்ந்துகொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கச் சொல்லான Χριστός இங்கு அரசராக அபிஷேகம் செய்யப்பட்டவர் என்ற பொருளைக் கொண்ட பட்டமாக வருகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவரைப் பழித்துக்கொண்டிருந்தார்கள்” அல்லது “அவரை அவமதித்துக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இங்கு இது இயேசுவின் பெயர்போல் அல்லாமல், அரசராக அபிஷேகம் செய்யப்பட்டவர் என்ற யூத எதிர்பார்ப்பை ஏளனமாகச் சுட்டும் பட்டமாக வருகிறது; எனவே ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: இஸ்ரவேலின் அரசரான
  rationale: மேசியாவை விளக்கும் பட்டத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இயேசுவின் அரசுரிமையை நோக்கிய ஏளனத்தையும் காக்கிறது.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: இப்போது சிலுவையிலிருந்து இறங்கி வரட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவிலுள்ள ஏளனச் சவாலையும், νῦν என்பதின் உடனடித் தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: அப்போது நாங்கள் பார்த்து நம்புவோம்
  rationale: பார்த்தால் நம்புவோம் என்று சவால் விடும் நோக்கம்/விளைவு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பார்த்து நம்புதல்’ என்ற இரு வினைகளும் காக்கப்பட்டுள்ளன.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: அவருடன் சிலுவையில் அறையப்பட்டவர்களும்
  rationale: உடன் சிலுவையில் அறையப்பட்ட மற்றவர்களைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு பங்கேற்பின் பொருளையும் καί என்பதின் ‘-உம்’ இணைப்பையும் காக்கிறது.
- source_word: ὠνείδιζον αὐτόν
  choice: அவரை இகழ்ந்துகொண்டிருந்தார்கள்
  rationale: இகழ்ச்சி அல்லது பழிப்பைக் குறிக்கும் வினையின் பொருளையும், தொடர்ந்து நடந்த செயலைக் காட்டும் இறந்தகால imperfect வடிவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏளனச் சூழலில் Χριστός என்ற பட்டத்தை மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός என்பது பெயர்போல் அல்லாமல் ‘இஸ்ரவேலின் அரசர்’ என்பதுடன் இணைந்த அரச-அபிஷேகப் பட்டமாகப் பயன்படுத்தப்படுகிறது. ‘மேசியா’ அந்தச் சூழல்சார் பொருளைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஏளனச் சவாலின் தொனியும் தொடர்ச்சியான இகழ்ச்சியும் காக்கப்பட்டுள்ளன. மூல ஆங்கில அடுக்கில் [b] குறி ‘சிலுவை’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு ὠνείδιζον என்பதற்கான சொல் மாற்றுகளை விளக்குவதால் தமிழில் அது ‘இகழ்ந்துகொண்டிருந்தார்கள்’ என்பதற்குப் பின் சரியாக இடப்பட்டுள்ளது.
