translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியுமாறு இயல்பானதும் கண்ணியமானதும் தீவிரமானதும் ஆன நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடிக் கட்டளையின் வலிமை பேணப்பட்டுள்ளது.
