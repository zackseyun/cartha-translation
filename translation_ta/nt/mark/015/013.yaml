translation:
  language: ta
  text: 'ஆனால் அவர்கள் மீண்டும் உரக்கக் கூச்சலிட்டார்கள்: “அவனைச் சிலுவையில் அறை!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: அவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மைச் சுட்டு உருபு, முன்பே குறிப்பிடப்பட்டிருந்தவர்களைக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மைப் பெயர்ப்பதிலி பயன்படுத்தப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பிலாத்துவின் முந்தைய கேள்விக்கு எதிரான பதிலைச் சுட்டும் மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: அவர்களுடைய கூக்குரல் திரும்ப நிகழ்ந்ததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔκραξαν
  choice: உரக்கக் கத்தினார்கள்
  rationale: κράζω குறிக்கும் வலிமையான, உரத்த கூக்குரலை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Σταύρωσον
  choice: சிலுவையில் அறையும்
  rationale: இது பிலாத்துவை நோக்கிய இரண்டாம் நபர் ஒருமை நேரடிக் கட்டளை. ‘சிலுவையில் அறையச் செய்’ என்று மறைமுகமாக்காமல், கிரேக்கத்தின் நேரடித் தன்மையைப் பேணுகிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள் பெயர்ப்பதிலியாக உள்ளது.
