source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: ta
  text: கூட்டத்தினரைத் திருப்திப்படுத்த[a] விரும்பிய பிலாத்து, அவர்களுக்காகப் பரபாசை விடுதலை செய்தான்; இயேசுவைச் சாட்டையால் அடிக்கச் செய்தபின், அவரைச் சிலுவையில் அறையப்படுவதற்காக ஒப்படைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூட்டத்தினரை மகிழ்விக்க.” சொல்லுக்கு சொல், “கூட்டத்தினருக்குப் போதுமானதைச் செய்ய.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: விரும்பிய
  rationale: பிலாத்துவின் விருப்பத்தையோ நோக்கத்தையோ இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அளவுக்கு மீறிய திட்டமிடலைக் குறிப்பதில்லை.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: கூட்டத்தினரைத் திருப்திப்படுத்த
  rationale: சொல்லுக்கு சொல் பொருள் ‘கூட்டத்தினருக்குப் போதுமானதைச் செய்ய’ என்பதாக இருந்தாலும், இச்சூழலில் அவர்களுடைய கோரிக்கையை நிறைவேற்றி அவர்களைத் திருப்திப்படுத்துவதை இந்த மரபுத்தொடர் குறிக்கிறது.
- source_word: ἀπέλυσεν
  choice: விடுதலை செய்தான்
  rationale: நீதித்துறைச் சூழலில் ஒரு கைதியை விடுவிப்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: விடுதலைத் தீர்மானம் கூட்டத்தினரின் கோரிக்கைக்கிணங்க அவர்களுக்காகச் செய்யப்பட்டதை நேரடியாகக் காட்டுகிறது.
- source_word: παρέδωκεν
  choice: ஒப்படைத்தான்
  rationale: இயேசுவை மற்றவர்களின் அதிகாரத்திற்குள் ஒப்படைத்தார் என்ற பாடுகளின் நிகழ்வுரைக்குரிய வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: φραγελλώσας
  choice: சாட்டையால் அடிக்கச் செய்தபின்
  rationale: முதன்மை வினைக்கு முன்பு நிகழ்ந்த செயலைத் தெளிவாக்குகிறது. ஆளுநரான பிலாத்து தானே அடித்தான் என்று கூறாமல், அடிக்க உத்தரவிட்ட சூழ்நிலைப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα σταυρωθῇ
  choice: சிலுவையில் அறையப்படும்படி
  rationale: ஒப்படைத்ததன் நோக்கத்தையும் எதிர்பார்க்கப்பட்ட முடிவையும் தமிழில் இயல்பாகக் காட்டுகிறது; கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் தக்கவைக்கிறது.
- source_word: Βαραββᾶν
  choice: பரபாஸ்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்ற பெயரெழுத்தாக்கம்; வேற்றுமைத் தொடர்பு வாக்கிய அமைப்பால் தெளிவாகிறது.
theological_decisions:
- issue: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι என்பதில் பிலாத்துவின் நோக்கம்
  choice: கூட்டத்தினரின் கோரிக்கையை நிறைவேற்றி அவர்களைத் திருப்திப்படுத்த பிலாத்து செயல்பட்டான்
  alternative: கூட்டத்தினரை மகிழ்விக்க அல்லது அவர்களுக்குப் போதுமானதைச் செய்ய பிலாத்து செயல்பட்டான்
  rationale: இது நன்மை செய்வதைக் காட்டிலும் அரசியல் ரீதியாகக் கூட்டத்தினரை இணங்கச் செய்வதைக் குறிக்கிறது. ‘திருப்திப்படுத்த’ என்பது அந்த அறநெறி அழுத்தத்தைத் தணிக்காமல், கிரேக்க மரபுத்தொடரின் சூழ்நிலைப் பொருளைத் தெளிவாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சாட்டையால் அடிக்கச் செய்தபின்’ என்பது ரோம ஆளுநரின் உத்தரவுப்பூர்வச் செயலை இயல்பாகக் காட்டுகிறது; ‘சிலுவையில் அறையப்படும்படி’ என்பது மூலத்தின் செயலப்பாட்டு நோக்கக் கட்டமைப்பைத் தக்கவைக்கிறது.
