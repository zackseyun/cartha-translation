  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: ta
  text: பண்டிகையின்போது, மக்கள் கேட்டுக்கொண்ட[a] கைதி ஒருவனை அவர் அவர்களுக்காக விடுதலை செய்வது வழக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மக்கள் கோரிய” என்றும் மொழிபெயர்க்கலாம்.
    reason: παρῃτοῦντο என்பதற்கு ‘கேட்டுக்கொண்ட’ அல்லது சற்றே முறையான ‘கோரிய’ என்ற பொருள் வரலாம்.
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: பண்டிகையின்போது
  rationale: κατά + வேற்றுமை உருபு இங்கு காலத்தைக் குறிக்கிறது; ἑορτή என்பது சூழலில் பஸ்கா பண்டிகை. δέ-யின் மென்மையான இணைப்புப் பொருளைத் தமிழில் தனிச் சொல் சேர்க்காமல் வாக்கிய ஓட்டத்தில் இயல்பாகக் காட்டுகிறது.
- source_word: ἀπέλυεν
  choice: விடுதலை செய்வது வழக்கம்
  rationale: இறந்தகால imperfect வடிவம் ஒருமுறை நடந்த செயலை அல்ல, தொடர்ந்து கடைப்பிடிக்கப்பட்ட வழக்கத்தைக் குறிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்காக
  rationale: விடுதலையால் பயன் பெறும் மக்களைக் குறிக்கும் dative பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἕνα δέσμιον
  choice: கைதி ஒருவனை
  rationale: ἕνα என்பதிலுள்ள ‘ஒருவர்’ என்ற எண்ணிக்கையை வெளிப்படையாகத் தக்கவைக்கிறது; நீதிமன்றச் சூழலில் δέσμιος என்பதற்கு ‘கைதி’ இயல்பானது.
- source_word: ὃν παρῃτοῦντο
  choice: மக்கள் கேட்டுக்கொண்ட
  rationale: παραιτέομαι இங்கு ஒருவரை விடுவிக்கும்படி கேட்டுக்கொள்வதைக் குறிக்கிறது. கிரேக்கப் பிரதிப்பெயரின் பன்மையைத் தெளிவுபடுத்தச் சூழலுக்கேற்ற ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
