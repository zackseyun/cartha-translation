source:
  edition: SBLGNT
  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: ta
  text: பரபா என்று அழைக்கப்பட்டவன், கலகத்தில் கொலை செய்திருந்த கலகக்காரர்களோடு கட்டப்பட்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிளர்ச்சிக்காரர்களோடு’ / ‘கிளர்ச்சியில்’ என்றும் மொழிபெயர்க்கலாம். எழுச்சியில் ஈடுபட்டவர்களையும் அந்த எழுச்சியையும் குறிக்க கிரேக்கத்தில் தொடர்புடைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: இருந்தான்
  rationale: δέ இங்கு மென்மையான தொடரிணைப்பாக உள்ளது; தமிழில் தனியே ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்க்காமல், இயல்பான கதைத் தொடரில் ἦν என்பதைக் ‘இருந்தான்’ என மொழிபெயர்த்தது.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: பரபா என்று அழைக்கப்பட்டவன்
  rationale: அடைமொழிப் பெயரெச்சத் தொடரின் அடையாளப்படுத்தும் பொருளை, இழிவான குறிப்புணர்வு ஏதும் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: μετὰ τῶν στασιαστῶν
  choice: கலகக்காரர்களோடு
  rationale: στασιασταί என்பது எழுச்சி அல்லது கலகத்தில் ஈடுபட்டவர்களைக் குறிக்கிறது. ‘கலகக்காரர்கள்’ பொதுவாசகருக்குத் தெளிவாகவும் στάσις உடனான சொற்பொருள் தொடர்பைக் காக்கவும் செய்கிறது.
- source_word: δεδεμένος
  choice: கட்டப்பட்டிருந்தான்
  rationale: δέω என்பதன் நிறைவேற்றப்பட்ட செயப்பாட்டு நிலையை நேரடியாகக் காக்கிறது; சூழலில் காவலில் வைக்கப்பட்டிருப்பது உட்பொருளாக இருந்தாலும், ‘சிறையில் இருந்தான்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: οἵτινες
  choice: (கலகக்காரர்கள்) ... செய்திருந்த
  rationale: சார்புப்பெயரின் விளக்கத் தொடர்பைத் தமிழில் பெயரெச்சத் தொடராக இயல்பாக அமைத்துள்ளது.
- source_word: ἐν τῇ στάσει
  choice: கலகத்தில்
  rationale: στάσις இங்கு அரசியல் அல்லது சமூக எழுச்சியைக் குறிக்கிறது; ‘கலகம்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது. ‘கிளர்ச்சி’ என்பதும் சாத்தியமான மாற்று.
- source_word: φόνον πεποιήκεισαν
  choice: கொலை செய்திருந்த
  rationale: முன்னரே நிறைவேறிய செயலை ‘செய்திருந்த’ என்பதால் காட்டி, φόνος என்பதன் கொலைப் பொருளைப் பாதுகாக்கிறது.
