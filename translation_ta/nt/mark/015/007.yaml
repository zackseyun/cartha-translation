translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் சொற்பொருள் தொடர்பைக் காட்ட ‘கலகக்காரர்கள்—கலகம்’ என்ற இணை பயன்படுத்தப்பட்டது; காவல் சூழலை விளக்கமாக விரிவுபடுத்தாமல் ‘கட்டப்பட்டிருந்தான்’ என மூலத்திற்கு நெருக்கமாக வைக்கப்பட்டது.
