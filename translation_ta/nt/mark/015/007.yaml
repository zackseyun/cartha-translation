  terminology: «கலகக்காரர்கள்—கலகம்» என்ற இணை στασιασταί / στάσις இடையிலான சொல்லுறவை நன்றாகப் பாதுகாக்கிறது. «கட்டப்பட்டிருந்தான்» என்பது சூழலைத் தேவையின்றி விரிவுபடுத்தாமல் δεδεμένος-ஐ நெருக்கமாகத் தருகிறது. அடிக்குறிப்பு «கிளர்ச்சி» என்ற பொருத்தமான மாற்றை வழங்குகிறது.
