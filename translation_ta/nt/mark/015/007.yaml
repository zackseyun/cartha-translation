  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாக உள்ளன: பரபா அடையாளப்படுத்தப்படுகிறார்; அவர் கலகக்காரர்களோடு கட்டப்பட்டிருந்தார்; அந்தக் கலகக்காரர்கள் கலகத்தில் கொலை செய்திருந்தனர். δεδεμένος என்பதன் தொடர்நிலையும், φόνον πεποιήκεισαν என்பதன் முன்நிறைவு உணர்வும் முறையாகக் காக்கப்பட்டுள்ளன.'
