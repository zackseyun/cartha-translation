    issue: அπεκρίθη αὐτοῖς λέγων is rendered as “என்று கேட்டான்.”
    rationale: “கேட்டான்” communicates the interrogative form but omits the source text’s statement that Pilate answered/replied to them. “அவர்களுக்குப் பதிலளித்து … என்றான்” preserves both the responsive action and the direct-question form.
