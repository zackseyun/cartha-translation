  naturalness: 'The proposed revision uses clear, modern standard Tamil and makes the embedded question’s subject and scope natural: the listeners are being asked whether they want Pilate to release the prisoner.'
  terminology: “யூதர்களின் அரசன்” is an appropriate conventional rendering of τὸν βασιλέα τῶν Ἰουδαίων in this Passion-title. “விடுதலை செய்ய” accurately reflects the judicial sense of ἀπολύσω. The lexical alternative “யூதேயர்களின்” is retained in a concise footnote.
  issues:
