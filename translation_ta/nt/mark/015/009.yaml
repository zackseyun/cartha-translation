revisions:
- from: ஆனால் பிலாத்து அவர்களிடம், “யூதர்களின் அரசனை நான் உங்களுக்கு விடுதலை செய்ய வேண்டுமென்று விரும்புகிறீர்களா?” என்று கேட்டான்.[a]
  to: ஆனால் பிலாத்து அவர்களுக்குப் பதிலளித்து, “நான் யூதர்களின் அரசனை உங்களுக்காக விடுதலை செய்ய வேண்டுமென்று நீங்கள் விரும்புகிறீர்களா?” என்றான்.[a]
