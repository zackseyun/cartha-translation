id: MRK.15.9
reference: Mark 15:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: ta
  text: ஆனால் பிலாத்து அவர்களுக்குப் பதிலளித்து, “நான் யூதர்களின் அரசனை உங்களுக்காக விடுதலை செய்ய வேண்டுமென்று நீங்கள் விரும்புகிறீர்களா?” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயர்களின் அரசன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் Ἰουδαίων என்பது “யூதர்கள்” அல்லது “யூதேயர்கள்” என்று பொருள்படலாம். ஆனால் பாடுகளின் நிகழ்வில் இது நிலையான பட்டமாக வருவதால், “யூதர்களின் அரசன்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள மென்மையான எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: அவர்களிடம் … என்று கேட்டான்
  rationale: இங்கு பதிலுரையாகச் சொல்லப்பட்டவை கேள்வி வடிவில் இருப்பதால், கிரேக்கத் தொடரின் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; αὐτοῖς என்பதும் ‘அவர்களிடம்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: Θέλετε
  choice: விரும்புகிறீர்களா
  rationale: விருப்பம் அல்லது எண்ணத்தைச் சுட்டும் θέλω என்பதற்கான தெளிவான, மரியாதையான நவீனத் தமிழ்.
- source_word: ἀπολύσω ὑμῖν
  choice: நான் உங்களுக்கு விடுதலை செய்ய
  rationale: சிறைக்கைதியை அதிகாரபூர்வமாக விடுவிக்கும் நீதித்துறைச் சூழலை ‘விடுதலை செய்ய’ தெளிவாகக் காட்டுகிறது; ὑμῖν ‘உங்களுக்கு’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: யூதர்களின் அரசனை
  rationale: மாற்கு விவரிக்கும் பாடுகளின் நிகழ்வில் நிலையான அரசியல் பட்டமாக வரும் சொற்றொடரைத் தமிழில் வழக்கமான முறையில் தருகிறது.
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων என்ற பட்டத்தின் பொருள்
  choice: யூதர்களின் அரசன்
  alternative: யூதேயர்களின் அரசன்
  rationale: Ἰουδαίων என்பது ‘யூதர்கள்’ அல்லது ‘யூதேயர்கள்’ என்று பொருள்படலாம். எனினும், இந்தப் பாடுகளின் நிகழ்வில் இது நிலையான அரசியல் பட்டமாக இருப்பதால் ‘யூதர்களின் அரசன்’ என்பது சூழலுக்கும் தமிழ் வழக்குக்கும் பொருத்தமானது; பட்டத்திலுள்ள அரசியல் மற்றும் பரிகாசத் தொனி விளக்கமின்றி தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசன்’ என்பது βασιλεύς என்பதற்கான நேரடியான தமிழ்ச் சொல்; நேரடி உரையின் கேள்வித்தன்மை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
