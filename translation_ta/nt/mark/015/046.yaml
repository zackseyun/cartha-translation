translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்ச்சி காக்கப்பட்டாலும், வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. மூலத்தில் யோசேப்பைக் குறிக்கும் எழுவாய் முந்தைய வசனத்திலிருந்து தொடர்கிறது; இவ்வசனத்தில் இயல்பாக ‘அவர்’ என்று தரப்பட்டுள்ளது.
