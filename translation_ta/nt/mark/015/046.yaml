  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: ta
  text: அவர் ஒரு லினன் துணியை[a] வாங்கி, இயேசுவை இறக்கி, அந்த லினன் துணியால் அவரைச் சுற்றி, பாறையைக் குடைந்து உருவாக்கப்பட்டிருந்த ஒரு கல்லறையில்[b] அவரைக் கிடத்தினார். பின்பு கல்லறையின் நுழைவாயிலுக்கு[c] எதிராக ஒரு கல்லை உருட்டிவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நார்த்துணி,’ ‘மெல்லிய துணி,’ அல்லது ‘அடக்கத் துணி’ என்றும் மொழிபெயர்க்கலாம் (σινδών).
    reason: lexical_alternative
  - marker: b
    text: ‘பாறையில் வெட்டப்பட்டிருந்த ஒரு கல்லறை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘கல்லறையின் கதவுக்கு’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் θύρα, ‘கதவு’ அல்லது ‘நுழைவாயில்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: மெல்லிய நார்த்துணி / அந்தத் துணி
  rationale: σινδών என்பது உடலைச் சுற்றப் பயன்படும் மெல்லிய துணியைக் குறிக்கிறது; சூழலில் அடக்கத்துக்கான பயன்பாடு தெளிவாக இருந்தாலும், ‘அடக்கத் துணி’ என்று பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: καθελών
  choice: இயேசுவை இறக்கி
  rationale: சிலுவையிலிருந்து உடலை இறக்கிய செயலைச் சூழல் காட்டுகிறது. தமிழில் சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க ‘அவரை’ என்பதற்குப் பதிலாக ‘இயேசுவை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐνείλησεν
  choice: அந்தத் துணியால் அவரைச் சுற்றி
  rationale: வினைச்சொல் சுற்றுதல் அல்லது பொதிதலைக் குறிக்கிறது. ‘சுற்றி’ என்பது தேவையற்ற அடக்கச் சடங்கு விவரங்களைச் சேர்க்காமல் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: ἔθηκεν
  choice: அவரைக் கிடத்தினார்
  rationale: அடக்கச் சூழலில் τίθημι என்பதற்கு ‘கிடத்தினார்’ என்பது இயல்பும் கண்ணியமும் கொண்ட தமிழ் நடை.
- source_word: μνημείῳ / μνημείου
  choice: கல்லறை / கல்லறையின்
  rationale: இங்கு μνημεῖον என்பது பாறையில் வெட்டப்பட்ட அடக்க இடத்தைக் குறிக்கிறது; ‘கல்லறை’ என்பது நவீனத் தமிழில் தெளிவான பொதுவழக்கு.
- source_word: λελατομημένον ἐκ πέτρας
  choice: பாறையில் வெட்டப்பட்டிருந்த
  rationale: முற்றுப்பெற்ற நிலையை perfect passive participle உணர்த்துகிறது; ‘வெட்டப்பட்டிருந்த’ அதைத் தக்கவைக்கிறது. πέτρα என்பதற்கு ‘பாறை’ பொருத்தமானது.
- source_word: προσεκύλισεν
  choice: உருட்டிவைத்தார்
  rationale: கல்லை நுழைவாயிலுக்கு எதிராக உருட்டிக் கொண்டு வந்து மூடிய செயலைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: கல்லறையின் நுழைவாயிலுக்கு எதிராக
  rationale: θύρα என்பது கதவு அல்லது நுழைவாயிலைக் குறிக்கலாம். பாறைக் கல்லறைச் சூழலில் ‘நுழைவாயில்’ நவீன வாசகருக்குத் தெளிவானது; ἐπίயின் திசை/எதிர்நிலை ‘எதிராக’ என்பதால் வெளிப்படுகிறது.
- source_word: ἀγοράσας
  choice: வாங்கி
  rationale: முதன்மைச் செயல்களுக்கு முன் துணி வாங்கப்பட்டதை வினையெச்சத் தொடர் இயல்பாகக் காட்டுகிறது.
