base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: ta
  text: 'அவ்வழியாகச் சென்றவர்கள் தங்கள் தலைகளை அசைத்து, அவரை இகழ்ந்து பேசிக்கொண்டிருந்தார்கள்: “ஆகா! திருக்கோவிலை[a] இடிக்கிறவனே, மூன்று நாட்களில் கட்டுகிறவனே,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் குறிப்பாக, “ஆலயத்தின் உள்சந்நிதியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: அவ்வழியாகக் கடந்துபோனவர்கள்
  rationale: சிலுவை இருந்த இடத்தைக் கடந்து சென்றவர்களை இந்நிகழ்காலச் சூழலில் இயல்பாகக் குறிக்கிறது; பங்கேற்புச் சொல்லின் தொடர்நிலைச் செயலும் வெளிப்படுகிறது.
- source_word: ἐβλασφήμουν
  choice: பழித்துப் பேசினார்கள்
  rationale: இங்கு இயேசுவை நோக்கிய இழிவான, அவமதிப்பான பேச்சைக் குறிக்கிறது. ‘தூஷித்தார்கள்’ என்பதைக் காட்டிலும் இது சாதாரண வாசகர்களுக்குத் தெளிவாகவும், குறுகிய தொழில்நுட்ப இறையியல் பொருளைத் திணிக்காமலும் உள்ளது.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: தங்கள் தலைகளை அசைத்து
  rationale: இகழ்ச்சியை வெளிப்படுத்தும் சைகையைத் தமிழில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: Οὐὰ
  choice: ஆகா!
  rationale: இச்சூழலில் இரங்கலை அல்ல, கேலியும் ஏளனமும் நிறைந்த வியப்பொலியை வெளிப்படுத்துகிறது.
- source_word: ὁ καταλύων
  choice: இடித்துவிட்டு
  rationale: திருக்கோவில் கட்டடத்தை அழிப்பதைக் குறிக்கும் καταλύω என்பதற்கு இயல்பான தமிழ்; அடுத்த பங்கேற்புச் சொல்லுடன் இணைந்து நேரடி ஏளன அழைப்பாக அமைகிறது.
- source_word: ναὸν
  choice: திருக்கோவிலை
  rationale: ναός என்பது குறிப்பாக ஆலயத்தின் புனிதக் கட்டடத்தைக் குறிக்கலாம். தமிழில் ‘திருக்கோவில்’ தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது; அதன் குறிப்பான ‘திருத்தலம்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: மூன்று நாட்களில் கட்டுகிறவனே
  rationale: கிரேக்க வினைச்சொல் நேரடியாக ‘கட்டு’ என்றே பொருள்படும். இடிக்கப்பட்டதை மீண்டும் கட்டுதல் சூழலால் உணரப்படலாம்; ஆனால் அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: திருக்கோவில் பற்றிய கூற்றின் குறிப்பு
  choice: வழிப்போக்கர்களின் குற்றச்சாட்டு/கேலியை மாற்கு விவரிக்கும் கதைக் கோணத்தின்படியே நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘திருக்கோவில்’ என்பது இயேசுவின் உடலைக் குறிக்கிறது என்று முதன்மை உரையிலேயே விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் கேலி செய்பவர்களின் சொற்களை அளிக்கிறது. வேறு நற்செய்தியில் தரப்படும் உருவக விளக்கத்தை இங்கு புகுத்தாமல், மாற்கு உரையின் இறையியல் பதற்றத்தையும் மறைமுகத்தன்மையையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘ஆகா!’ மற்றும் ‘கட்டுகிறவனே’ என்பவை கேலியான நேரடி அழைப்பின் வலிமையைத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
