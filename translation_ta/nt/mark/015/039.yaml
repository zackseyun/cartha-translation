source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: ta
  text: அவருக்கு எதிரே நின்றுகொண்டிருந்த, நூறு வீரர்களுக்குத் தலைவரான படை அதிகாரி, அவர் இவ்வாறு கடைசி மூச்சை விட்டதைக் கண்டு, “உண்மையாகவே இந்த மனிதர் தேவனுடைய மகனாக இருந்தார்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த மனிதர் தேவனுடைய ஒரு மகனாக இருந்தார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடரை பண்புசார் பொருளிலோ வரையறையற்ற பொருளிலோ புரிந்துகொள்ள முடியும்; ஆனால் மாற்கு நற்செய்தியின் சூழலில் அது “தேவனுடைய மகன்” என்ற பட்டப்பெயரின் வலிமையைக் கொண்டிருக்க வாய்ப்பு அதிகம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: கண்டு
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் காலச்சார்பை தமிழில் இயல்பான வினையெச்சமாகத் தருகிறது; δέ இங்கு மென்மையான இணைப்புச்சொல் என்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: κεντυρίων
  choice: நூற்றுவர் படைத்தலைவன்
  rationale: ரோமப் படையின் centurion பதவியை, பழமையான ‘நூற்றுக்கதிபதி’ என்பதற்குப் பதிலாக நவீன வாசகருக்குப் புரியும் வகையில் துல்லியமாகக் குறிக்கிறது.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: அவருக்கு எதிரே நின்றுகொண்டிருந்த
  rationale: ஏற்கெனவே அங்கு நின்றிருந்த நிலையை παρεστηκώς குறிக்கிறது; ἐξ ἐναντίας என்பதன் இடஞ்சார்ந்த ‘எதிரே’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: அவர் இவ்வாறு கடைசி மூச்சை விட்டதை
  rationale: ἐκπνέω என்பதன் மூச்சுவிடுதல் சார்ந்த உயிரோட்டமான உருவகத்தையும், இறந்தார் என்ற சூழற்பொருளையும் ‘கடைசி மூச்சை விட்டார்’ இயல்பாகத் தருகிறது; οὕτως ‘இவ்வாறு’ என வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: Ἀληθῶς
  choice: உண்மையாகவே
  rationale: நூற்றுவர் படைத்தலைவனின் உறுதியான, ஆழ்ந்த அறிவிப்புத் தொனியைத் தக்கவைக்கிறது.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: இந்த மனிதர்
  rationale: இயேசுவைக் குறிக்கும் ἄνθρωπος என்பதன் மனித அடையாளத்தை நேரடியாகத் தருகிறது; நவீன மரியாதை நடைக்கு ‘மனிதர்’ பொருந்துகிறது.
- source_word: υἱὸς θεοῦ
  choice: தேவனுடைய மகன்
  rationale: மாற்கு நற்செய்தியின் சூழலில் இது முக்கியமான கிறிஸ்தியல் பட்டப்பெயரின் வலிமையைத் தருகிறது. கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு உருபு இல்லாததால் ஏற்படும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: εἰμί என்பதன் நிறைவுறாத இறந்தகால வடிவத்தை நிகழ்காலமாக மாற்றாமல் நேரடியாக இறந்தகாலத்தில் தருகிறது.
theological_decisions:
- issue: υἱὸς θεοῦ என்பதன் பொருள் வலிமை
  choice: தேவனுடைய மகன்
  alternative: தேவனுடைய ஒரு மகன்
  rationale: மாற்கு நற்செய்தியின் கதையோட்டத்தில் ‘தேவனுடைய மகன்’ முக்கியமான கிறிஸ்தியல் அடையாளமாகச் செயல்படுகிறது. அதேவேளை, உருபில்லாத கிரேக்கத் தொடரை பண்புசார் அல்லது வரையறையற்ற பொருளில் புரிந்துகொள்ள இயலும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது; முதன்மை உரை அதைச் சத்தமின்றி தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நூற்றுக்கதிபதி’ போன்ற இன்றைய சாதாரண வாசகருக்கு அரிதான சொல்லுக்குப் பதிலாக ‘நூற்றுவர் படைத்தலைவன்’ தேர்ந்தெடுக்கப்பட்டது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், படைத்தலைவனின் பேச்சை அறிமுகப்படுத்தும் வினை கதைநடைக்கேற்ற ஒருமையில் வைக்கப்பட்டுள்ளது.
