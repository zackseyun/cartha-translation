  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: ta
  text: அது மூன்றாம் மணி நேரமாக இருந்தது[a]; அவர்கள் அவரைச் சிலுவையில் அறைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யூதர்களின் வழக்கமான நேரக் கணக்கின்படி, இது காலை சுமார் ஒன்பது மணி.
    reason: பண்டைய நேரக் கணக்கை நவீன வாசகருக்கு விளக்குகிறது.
lexical_decisions:
- source_word: Ἦν
  choice: மணி நேரம்
  rationale: εἰμί என்பதன் இறந்தகால வடிவம் இங்கு நேரத்தைச் சுட்டும் சொல்லாட்சியில் வருகிறது; தமிழில் தனியாக ‘இருந்தது’ என்று கூறுவதைவிட ‘மூன்றாம் மணி நேரம்’ என்ற நேரக் கூற்று இயல்பாக அமைகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் கதை நகர்வை மெதுவாக இணைக்கிறது. ‘அப்போது’ இயல்பான தமிழ் நடையில் அந்த முன்னேற்றத்தை வெளிப்படுத்துகிறது; புதிய நிகழ்காலப் பொருளைச் சேர்ப்பதில்லை.
- source_word: ὥρα τρίτη
  choice: மூன்றாம் மணி நேரம்
  rationale: பண்டைய நேரக் குறிப்பை அப்படியே பாதுகாக்கும் முறையான மொழிபெயர்ப்பு. இன்றைய கணக்கில் அதன் தோராயமான நேரம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐσταύρωσαν
  choice: சிலுவையில் அறைந்தார்கள்
  rationale: சிலுவையில் அறைந்து கொல்லும் செயலைத் தெளிவாகவும் தமிழில் வழக்கமான வேதாகமச் சொல்லாட்சியிலும் குறிக்கிறது; தேவையற்ற விரிவுரையைத் தவிர்க்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்; தமிழில் மரியாதைப் பன்மையான ‘அவரை’ இயல்பானது.
theological_decisions:
- issue: காலவரிசையுடன் தொடர்புடைய நேரக் குறிப்பின் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘மூன்றாம் மணி நேரம்’ என்று பண்டைய நேரக் குறிப்பைத் தக்கவைத்தல்
  alternative: ‘காலை சுமார் ஒன்பது மணி’ என்று முதன்மை உரையிலேயே மாற்றிக் கூறுதல்
  rationale: மூல வசனம் பண்டைய நேரக் குறிப்பைக் கொடுக்கிறதே தவிர அதை நவீன கடிகார நேரமாக மாற்றி விளக்கவில்லை. நேரடியான வடிவத்தைத் தக்கவைப்பது குறிப்பிட்ட காலவரிசை ஒத்திசைவு விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல், உரையிலுள்ள சாத்தியமான பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை. ‘மூன்றாம் மணி நேரம்’ என்ற மூலப் பண்பாட்டு வடிவம் பாதுகாக்கப்பட்டு, நவீன நேர விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
