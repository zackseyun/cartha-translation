base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: ta
  text: அவரோடு இரண்டு கொள்ளையர்களையும் சிலுவையில் அறைகிறார்கள்; ஒருவனை அவருடைய வலப்பக்கத்தில், ஒருவனை அவருடைய இடப்பக்கத்தில்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: அவரோடு சேர்த்து
  rationale: σύν + வேற்றுமைத் தொகை உடனிருப்பதைக் குறிக்கிறது. இங்கு மற்ற இருவரும் இயேசுவோடு சேர்ந்து சிலுவையில் அறையப்பட்டனர் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σταυροῦσιν
  choice: சிலுவையில் அறைகிறார்கள்
  rationale: இது நிகழ்காலச் செயப்படுவினை, மூன்றாம் நபர் பன்மை. மாற்குவின் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்காலத்தால் காக்கிறது.
- source_word: δύο λῃστάς
  choice: இரண்டு கொள்ளையர்களை
  rationale: λῃστής என்பது கொள்ளையன், வழிப்பறிக்காரன் அல்லது ஆயுதமேந்திய கள்வன் எனப் பொருள்படலாம். வசனமே அரசியல் கிளர்ச்சியாளர் என்ற குறிப்பை உறுதிப்படுத்தாததால், பரந்தும் பொதுவாகப் புரியக்கூடியதுமான ‘கொள்ளையர்கள்’ முதன்மைப் பாடத்தில் பயன்படுத்தப்படுகிறது.
- source_word: ἕνα ἐκ δεξιῶν
  choice: ஒருவனை அவருடைய வலப்பக்கத்திலும்
  rationale: ἐκ δεξιῶν என்ற இடவியல் மரபுத்தொடர் வலது பக்கத்தில் இருப்பதைக் குறிக்கிறது. αὐτοῦ இணையான இரு இடக்குறிப்புகளுக்கும் பொருந்துவதை ‘அவருடைய’ தெளிவாக்குகிறது.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: ஒருவனை அவருடைய இடப்பக்கத்திலும்
  rationale: εὐώνυμος இங்கு வலப்பக்கத்திற்கு எதிரான இடப்பக்கத்தைக் குறிக்கும் மரியாதை வழக்குச் சொல். தமிழில் நேரடியான இடவியல் பொருள் இயல்பாக வழங்கப்படுகிறது.
theological_decisions:
- issue: சிலுவை நிகழ்வில் λῃσταί என்பதன் பொருள்
  choice: கொள்ளையர்கள்
  alternative: வழிப்பறிக்காரர்கள்; அரசியல் நிழற்பொருள் இருந்தால் கிளர்ச்சியாளர்கள்
  rationale: இச்சொல் வன்முறைக் கொள்ளையர்களையோ ஆயுதமேந்திய கள்வர்களையோ குறிக்கலாம்; சில சூழல்களில் கிளர்ச்சிச் செயலோடும் தொடர்புடையதாக இருக்கலாம். இந்த வசனம் மட்டும் அரசியல் பொருளைக் கட்டாயப்படுத்தாததால் முதன்மைப் பாடம் பொதுவான பொருளைக் கொண்டுள்ளது; சாத்தியமான நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மாற்குவின் வரலாற்று நிகழ்காலம் காக்கப்பட்டுள்ளது. தமிழில் வாக்கியத்தின் இரு இணைப் பகுதிகளும் தெளிவாக இருக்க ‘அறைகிறார்கள்’ இறுதியில் மீண்டும் வழங்கப்பட்டுள்ளது.
