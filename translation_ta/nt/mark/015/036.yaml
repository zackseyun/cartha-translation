source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: ta
  text: அப்போது ஒருவன் ஓடிப்போய், ஒரு கடற்பஞ்சைப் புளிப்பு திராட்சை மதுவால் நிரப்பி, அதை ஒரு நாணலில் பொருத்தி, அவருக்குக் குடிக்கக் கொடுத்துக்கொண்டிருந்தான். அவன், “அவரை விட்டுவிடுங்கள்[a]. எலியா வந்து அவரைக் கீழே இறக்குகிறாரா என்று பார்ப்போம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொறுங்கள். எலியா வந்து அவரைக் கீழே இறக்குகிறாரா என்று பார்ப்போம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: ஓடிப்போய்
  rationale: இறந்தகால வினையெச்சம் அடுத்தடுத்த செயல்களின் தொடக்கத்தைக் குறிக்கிறது; தமிழில் ‘ஓடிப்போய்’ இயல்பாக அந்த நிகழ்வொழுங்கைக் காட்டுகிறது.
- source_word: τις καὶ
  choice: ஒருவன்
  rationale: τις குறிப்பிடப்படாத ஓர் ஆணைக் குறிக்கிறது. καί-க்கு இங்கு தனியாக ‘கூட’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பற்றதாகவும் பொருளை மிகைப்படுத்துவதாகவும் இருக்கும்.
- source_word: γεμίσας σπόγγον ὄξους
  choice: ஒரு கடற்பஞ்சைப் புளித்த திராட்சை மதுவால் நிரப்பி
  rationale: ὄξος என்பது நவீன சமையல் வினிகர் மட்டுமல்ல; புளிப்பான, மலிவான திராட்சை மதுப் பானத்தைக் குறிக்கிறது. ‘கடற்பஞ்சு’ σπόγγος என்பதன் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: περιθεὶς καλάμῳ
  choice: அதை ஒரு கோலில் பொருத்தி
  rationale: κάλαμος நாணல் அல்லது நாணற்கோலைக் குறிக்கலாம்; இச்சூழலில் பஞ்சை உயர்த்தப் பயன்பட்ட பொருளை இயல்பான தமிழில் ‘கோல்’ எனக் கொள்வது தெளிவு. περιτίθημι-யின் செயல் ‘பொருத்தி’ என்பதால் நன்றாக வெளிப்படுகிறது.
- source_word: ἐπότιζεν αὐτόν
  choice: அவருக்குக் குடிக்கக் கொடுத்தான்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் செயலை நிகழ்வில் விரித்துக் காட்டினாலும், தமிழில் இங்கு எளிய இறந்தகாலம் இயல்பாகவும் முழுச் செயலையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: Ἄφετε
  choice: அவரை விட்டுவிடுங்கள்
  rationale: ἀφίημι இங்கு தலையிடாமல் விடும்படி கூறும் பன்மை ஏவலைக் கொண்டுள்ளது. ‘பொறுங்கள்’ என்ற இடைநிறுத்தப் பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: எலியா வந்து ... இறக்குகிறாரா என்று பார்ப்போம்
  rationale: ἴδωμεν மற்றும் εἰ சேர்ந்து எதிர்பார்க்கப்படும் நிகழ்வு நடக்கிறதா எனக் காண்பதைச் சொல்கின்றன. நிகழ்கால ἔρχεται-ன் உடனடித் தன்மை ‘வந்து ... இறக்குகிறாரா’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: καθελεῖν αὐτόν
  choice: அவரைக் கீழே இறக்க
  rationale: சிலுவையில் உயர்த்தப்பட்டிருந்த இயேசுவை அதிலிருந்து கீழிறக்குவதை καθαιρέω இங்கு குறிக்கிறது.
theological_decisions:
- issue: Ἄφετε என்று பேசியவனின் நோக்கம்
  choice: மற்றவர்கள் இயேசுவை அப்போதைக்கு விட்டுவிடும்படி கூறியதாக முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: “பொறுங்கள்” அல்லது “நிறுத்துங்கள்” என்று மொழிபெயர்க்கலாம்.
  rationale: சொல்லின் நேரடிப் பொருள் ‘விட்டுவிடுங்கள்’; ஆனால் இச்சூழலில் ‘பொறுங்கள்’ என்ற இடைநிறுத்தக் கட்டளையாகவும் அமையலாம். தெளிவின்மையைத் தீர்த்துவிடாமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டது. ὄξος என்பதற்கு தவறாக நவீன சமையல் வினிகர் என்ற எண்ணம் வராதபடி ‘புளித்த திராட்சை மது’ எனத் தெளிவாக்கப்பட்டது.
