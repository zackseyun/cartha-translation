  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: ta
  text: சிலுவையிலிருந்து இறங்கி, உன்னையே காப்பாற்றிக்கொள்[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் வடிவநெருக்கமாக: “உன்னையே காப்பாற்றிக்கொள்; சிலுவையிலிருந்து கீழே இறங்கு!” அல்லது “சிலுவையிலிருந்து இறங்கிய பின் உன்னையே காப்பாற்றிக்கொள்!”'
    reason: καταβάς என்ற செயவெச்சம் முதன்மைக் கட்டளையுடன் எவ்வாறு தொடர்புபடுகிறது என்பதில் உள்ள மொழிபெயர்ப்பு மாற்றுகளைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: σῶσον
  choice: காப்பாற்றிக்கொள்
  rationale: இது இரண்டாம் நபர் ஒருமை ஏவல்வினை. இகழ்ச்சியான கட்டளையின் தொனியையும், ‘காப்பாற்றுதல்’ என்ற இரட்சிப்பு சார்ந்த சொல்லிணைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: σεαυτόν
  choice: உன்னையே
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லின் நேரடிப் பொருளைத் தருவதோடு, கேலி நிறைந்த ‘உன்னையே’ என்ற அழுத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: καταβάς
  choice: இறங்கி
  rationale: இறந்தகாலச் செயவெச்சமாக உள்ள இச்சொல், முதன்மைக் கட்டளையுடன் தொடர்புடைய உடன்நிகழ் அல்லது வழிமுறை சார்ந்த செயலைக் குறிக்கலாம். ‘இறங்கி’ என்பது அந்தச் சுருக்கமான தொடர்பை இயல்பாகத் தக்கவைக்கிறது; அதைத் தெளிவாகக் காரணம் அல்லது வழிமுறை என்று மட்டும் வரையறுப்பதில்லை.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: சிலுவையிலிருந்து
  rationale: சிலுவையைவிட்டு கீழே வரும் இயக்கத்தைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: καταβάς என்ற செயவெச்சத்திற்கும் σῶσον என்ற கட்டளைக்கும் உள்ள தொடர்பு
  choice: ‘சிலுவையிலிருந்து இறங்கி, உன்னையே காப்பாற்றிக்கொள்’ என்று செயவெச்சத் தொடர்புடன் மொழிபெயர்த்தல்
  alternative: ‘உன்னையே காப்பாற்றிக்கொள்; சிலுவையிலிருந்து கீழே இறங்கு!’ அல்லது ‘சிலுவையிலிருந்து இறங்கிய பின் உன்னையே காப்பாற்றிக்கொள்!’
  rationale: கிரேக்கத்தில் கட்டளையும் செயவெச்சமும் சுருக்கமாக இணைக்கப்பட்டுள்ளன. தமிழ் வாக்கிய ஒழுங்குக்கு ஏற்றவாறு செயவெச்சத்தை முதலில் வைத்து, இறங்குதல் வழிமுறையா, உடன்நிகழ் செயலா, முன்னிகழ் செயலா என்ற இலக்கணத் தெளிவின்மையை இயன்றவரைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதனைச் சூழலில் சொல்லப்படும் இகழ்ச்சிக் கட்டளையின் கூர்மையைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘உன்னையே’ என்பது தற்சுட்டு அழுத்தத்தை வெளிப்படுத்துகிறது.
