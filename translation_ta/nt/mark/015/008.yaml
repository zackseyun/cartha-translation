  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை. முதன்மை உரையில் கிரேக்கத்தின் சுருக்கமான சொல்லமைப்பைத் தெளிவுபடுத்த தேவையான மறைபொருள் மட்டும் வெளிப்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு அதிகச் சொற்சார்பான வடிவத்தைப் பாதுகாக்கிறது.
