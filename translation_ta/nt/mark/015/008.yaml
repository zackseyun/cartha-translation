  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: ta
  text: மக்கள் கூட்டம் மேலே வந்து, அவர் தங்களுக்காக வழக்கமாகச் செய்து வந்ததைச் செய்யும்படி அவரிடம் கேட்கத் தொடங்கியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொற்சார்பாக: “மக்கள் கூட்டம் மேலே வந்து, அவர் தங்களுக்காக வழக்கமாகச் செய்து வந்ததை வேண்டத் தொடங்கியது.”'
    reason: மூலத்தில் ‘அவரிடம்’ மற்றும் இரண்டாவது ‘செய்யும்படி’ வெளிப்படையாக இல்லை; அவை சூழலிலிருந்து தெளிவாகின்றன. இந்த மாற்று வடிவம் καθώς ἐποίει αὐτοῖς என்பதைக் கூட்டம் வேண்டிய வழக்கமான செயலாகத் தெளிவாகக் காட்டுகிறது.
lexical_decisions:
- source_word: ἀναβὰς
  choice: மேலே வந்து
  rationale: இறந்தகால வினையெச்சமான ἀναβὰς, கூட்டம் பிலாத்துவிடம் அணுகிச் சென்ற நகர்வைக் குறிக்கிறது. ‘மேலே வந்து’ என்பது அதன் திசை உணர்வையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: ὁ ὄχλος
  choice: மக்கள் கூட்டம்
  rationale: ὄχλος என்பது திரண்டிருந்த மக்களைக் குறிக்கிறது; ‘மக்கள் கூட்டம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: கேட்கத் தொடங்கியது
  rationale: ἄρχομαι + infinitive கட்டமைப்பு தொடக்கத்தைக் குறிக்கிறது; αἰτεῖσθαι இங்கு வேண்டுதல் அல்லது கோருதல் என்ற பொருளுடையது. ‘கேட்கத் தொடங்கியது’ இரண்டையும் இயல்பாகத் தருகிறது.
- source_word: καθὼς
  choice: வழக்கமாக ... செய்துவந்ததை
  rationale: καθὼς அடிப்படையில் ‘எப்படியோ/அவ்வாறே’ என்ற ஒப்புமையைக் குறிக்கிறது. இங்கு வழக்கமான செயலைச் சுட்டும் ἐποίει உடன் வருவதால், தமிழில் ‘வழக்கமாக ... செய்துவந்ததை’ என்று சொல்வது பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἐποίει
  choice: செய்துவந்ததை
  rationale: இறந்தகாலத் தொடர்ச்சிவடிவம் வழக்கமாக மீண்டும் செய்யப்பட்ட செயலைக் குறிக்கிறது; ‘செய்துவந்ததை’ அந்த வழக்கத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: தங்களுக்குச்
  rationale: இந்த இடத்தில் வேற்றுமை வடிவம் பயனடைவோரைக் குறிக்கிறது. கூட்டத்தை நோக்கிப் பின்னுறும் மரியாதைத் தற்சுட்டாக ‘தங்களுக்குச்’ இயல்பாக அமைகிறது.
