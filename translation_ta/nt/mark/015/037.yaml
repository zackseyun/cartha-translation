  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: ta
  text: ஆனால் இயேசு உரத்த குரலெழுப்பி[a], தமது கடைசி மூச்சை விட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெருங்குரல் எழுப்பி’ அல்லது ‘உரத்த கூக்குரலிட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘இறந்தார்’; கிரேக்கத்தில் சொற்பொருள், ‘மூச்சை வெளியே விட்டார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: இது மென்மையான இணைப்புச் சொல். இங்கு முந்தைய நிகழ்வுடன் உள்ள கதைநடைத் திருப்பையும் மெல்லிய முரண்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀφεὶς
  choice: எழுப்பி
  rationale: ἀφίημι என்ற வினையின் இறந்தகால வினையெச்சம், φωνή என்பதுடன் சேர்ந்து ஒரு குரலை வெளிப்படுத்துதல் அல்லது எழுப்புதல் என்ற மரபுத்தொடர் பொருளைத் தருகிறது.
- source_word: φωνὴν μεγάλην
  choice: உரத்த குரல்
  rationale: φωνή என்பதற்கு குரல், ஒலி, கூக்குரல் ஆகிய பொருள்கள் உண்டு; μεγάλην இங்கு ஒலியின் வலிமையைக் குறிப்பதால் ‘உரத்த’ என்பது இயல்பான தமிழ் இணை.
- source_word: ἐξέπνευσεν
  choice: தமது கடைசி மூச்சை விட்டார்
  rationale: ἐκπνέω என்பது சொற்பொருளில் மூச்சை வெளியே விடுவதையும், இங்கு மரபுத்தொடராக இறப்பதையும் குறிக்கிறது. இந்தத் தெரிவு உடல்சார்ந்த மூச்சுப் படிமத்தையும் நிகழ்வின் கண்ணியத்தையும் காக்கிறது.
- source_word: ὁ δὲ Ἰησοῦς
  choice: ஆனால் இயேசு
  rationale: பெயருக்கு முன் வரும் கிரேக்கச் சுட்டிடைச்சொல் தமிழில் தனியாக மொழிபெயர்க்கப்பட வேண்டியதில்லை; δέ மட்டும் ‘ஆனால்’ என்று வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் இறப்பை கூடுதல் இறையியல் கருத்தைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: தமது கடைசி மூச்சை விட்டார்
  alternative: இறந்தார்; தமது ஆவியை ஒப்புவித்தார்
  rationale: இந்த வசனம் இயேசுவின் மரணத்தைச் சுருக்கமான கதைநடைச் சொற்களில் கூறுகிறது. ‘கடைசி மூச்சை விட்டார்’ என்பது கிரேக்க வினையின் மூச்சுப் படிமத்தைக் காக்கிறது. ‘தமது ஆவியை ஒப்புவித்தார்’ என்பது வேறு நற்செய்தி நூல்களின் சொற்களை இங்கு கொண்டுவந்து உரையை ஒத்திசைக்கும் அபாயம் உள்ளதால் ஏற்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உரத்த குரலெழுப்பி’ என்பது மூலத்தின் தீவிரத்தைத் தக்கவைக்கிறது; ‘தமது’ என்ற மரியாதைப் பன்மை இயேசுவைக் குறிக்கும் தமிழ் வழக்குடன் பொருந்துகிறது.
