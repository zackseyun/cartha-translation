source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: ta
  text: அவ்வாறே முதன்மை ஆசாரியர்களும் மறைநூல் அறிஞர்களோடு தங்களுக்குள் கேலி செய்தபடி[a], “மற்றவர்களைக் காப்பாற்றினான்; தன்னைக் காப்பாற்ற முடியாது” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைநூல் அறிஞர்களோடு ஒருவருக்கொருவர் கேலியாகப் பேசிக்கொண்டு.” கிரேக்கச் சொற்றொடர், முதன்மை ஆசாரியர்கள் ஒருவரோடொருவர் பேசுவதையும் மறைநூல் அறிஞர்கள் அவர்களுடன் சேர்ந்திருந்ததையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: முந்தையவர்களின் கேலிக்கு இணையாக இவர்கள் செய்ததைக் காட்டும் ஒப்பீட்டுத் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: முதன்மை ஆசாரியர்கள்
  rationale: ஒரே நேரத்தில் பல தலைமை ஆசாரியர்கள் பதவியில் இருந்தனர் என்ற தவறான எண்ணத்தைத் தவிர்த்து, முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கிறது.
- source_word: ἐμπαίζοντες
  choice: கேலி செய்தபடி
  rationale: இகழ்ச்சியும் பரிகாசமும் கலந்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πρὸς ἀλλήλους
  choice: தங்களுக்குள்
  rationale: அவர்கள் ஒருவரையொருவர் கேலி செய்தார்கள் என்று அல்லாமல், ஒருவரோடொருவர் இகழ்ச்சியாகப் பேசினார்கள் என்ற பரஸ்பரச் செயல்பாட்டைச் சூழலுக்கேற்ப காட்டுகிறது.
- source_word: μετὰ τῶν γραμματέων
  choice: மறைநூல் அறிஞர்களோடு
  rationale: γραμματεῖς என்போர் வேதநூல்களில் தேர்ச்சி பெற்ற மத அறிஞர்கள்; நவீன வாசகர்களுக்குத் தெளிவான பணிப்பெயர்.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத காலத்தின் நீடித்த அல்லது மீண்டும் மீண்டும் நடந்த பேச்சுச் செயலைப் பாதுகாக்கிறது.
- source_word: Ἄλλους ἔσωσεν
  choice: மற்றவர்களைக் காப்பாற்றினான்
  rationale: ἄλλους என்பதையும் σῴζω என்பதன் காப்பாற்றுதல்/மீட்டல் பரப்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: தன்னைக் காப்பாற்றிக்கொள்ள முடியவில்லை
  rationale: திறனின்மையைச் சுட்டும் கேலியை இயல்பான தமிழில் தெரிவித்து, முந்தைய σῴζω உடனான சொல் மீளுருவாக்கத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இரு இடங்களிலும் σῴζω என்பதைக் ஒரே வேர்ச்சொல்லால் மொழிபெயர்த்தல்
  choice: காப்பாற்றினான் ... காப்பாற்றிக்கொள்ள
  alternative: மீட்டான் ... மீட்டுக்கொள்ள
  rationale: கிரேக்கத்தின் சொல் மீளுருவாக்கத்தையும் கேலியில் உள்ள இறையியல் முரணையும் பாதுகாக்கிறது; அதேவேளையில் பொருளை ஒரு குறிப்பிட்ட கோட்பாட்டுச் சார்பில் சுருக்கவில்லை.
- issue: οὐ δύναται என்பதன் காலநிலைத் தமிழ் வெளிப்பாடு
  choice: முடியவில்லை
  alternative: முடியாது
  rationale: சிலுவையில் நிலவும் அந்தச் சூழலில் அவர்களால் கூறப்பட்ட திறனின்மைக் கேலியாக இயல்பாக அமைகிறது; இயேசுவின் உண்மையான திறனை மொழிபெயர்ப்பாளர் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘முதன்மை ஆசாரியர்கள்’ மற்றும் ‘மறைநூல் அறிஞர்கள்’ என்பவை வரலாற்றுப் பணிகளைக் குழப்பமின்றி எடுத்துரைக்கின்றன; கேலிக் கூற்றின் சொல் மீளுருவாக்கமும் முரண்பாடும் காக்கப்பட்டுள்ளன.
