  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: ta
  text: மாலை நேரம் ஏற்கெனவே வந்துவிட்டபோது[a], அது ஆயத்த நாள்[b]—அதாவது, ஓய்வுநாளுக்கு முந்தின நாள்[c]—என்பதால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏற்கெனவே மாலையாகிவிட்டபோது.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கில் ‘ஆயத்தம்’; ஓய்வுநாளுக்கு முன் ஆயத்தம் செய்யும் நாளைக் குறிக்கும் சொல்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘ஓய்வுநாளின் முன்தினம்’; மரபுப்படி இது வெள்ளிக்கிழமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: மாலை நேரம் ஏற்கெனவே வந்துவிட்டபோது
  rationale: மரபுத்தொடரின் காலச் சூழலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ἤδη என்பதன் ‘ஏற்கெனவே’ என்ற பொருளையும் காக்கிறது.
- source_word: παρασκευή
  choice: ஆயத்த நாள்
  rationale: இங்கு பொதுவான ஆயத்தத்தை அல்லாமல் ஓய்வுநாளுக்கு முன்பான அறியப்பட்ட நாளைக் குறிக்கும் காலண்டர் சார்ந்த சொல்லாக வருகிறது.
- source_word: προσάββατον
  choice: ஓய்வுநாளுக்கு முந்தின நாள்
  rationale: சொல்லின் எளிய பொருளைத் தெளிவாகக் கொடுக்கிறது; ‘வெள்ளிக்கிழமை’ எனக் குறிப்பாக்கி விளக்குவதைத் தவிர்க்கிறது.
- source_word: ἐπεὶ
  choice: ஆக இருந்ததால்
  rationale: கதைப்போக்கில் வரும் காரண-விளக்க உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὅ ἐστιν
  choice: அதாவது
  rationale: παρασκευή என்ற சொல்லை வாசகருக்காக விளக்கும் சூத்திரத்தைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: Καὶ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இவ்வசனம் முந்தைய நிகழ்வைத் தொடர்ந்து அடுத்த செயலுக்கான காலச் சூழலை அமைக்கிறது; தமிழில் தனியான ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது செயற்கையாக இருக்கும் என்பதால் தொடர்ச்சி வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
