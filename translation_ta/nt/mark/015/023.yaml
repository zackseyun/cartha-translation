  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: ta
  text: வெள்ளைப்போளம் கலந்த திராட்சரசத்தை அவருக்குக் கொடுத்துக்கொண்டிருந்தார்கள்[a]; ஆனால் அவரோ அதை எடுத்துக்கொள்ளவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளைப்போளம் கலந்த திராட்சரசத்தை அவருக்கு வழங்கினார்கள்.”
    reason: ἐδίδουν என்பது நீடித்த அல்லது மீள்மீள நிகழ்ந்த கடந்தகாலச் செயலைக் குறிக்கிறது. தமிழில் எளிய இறந்தகால வினையும் சூழலுக்கு ஏற்ற மாற்றாக இருக்கலாம்.
  - marker: b
    text: 'கிரேக்கத்தில், இயேசுவை மீண்டும் சுட்டும் சொல்லுடன் எதிர்ச் சாயலான இணைப்பு உள்ளது: “ஆனால் அவரோ அதை எடுத்துக்கொள்ளவில்லை.”'
    reason: ὃς δέ இங்கு இயேசுவை மீளச் சுட்டுகிறது; οὐκ ἔλαβεν என்பதற்கு நேரடியாக “எடுத்துக்கொள்ளவில்லை” என்று பொருள்.
lexical_decisions:
- source_word: ἐδίδουν
  choice: கொடுக்க முயன்றார்கள்
  rationale: இறந்தகாலத் தொடர்வினை வடிவம் நடைபெற்று வந்த அல்லது முயற்சிக்கப்பட்ட செயலைக் குறிக்கலாம். இயேசு அதை ஏற்கவில்லை என்ற அடுத்த கூற்றுடன் சேர்த்து வாசிக்கையில், தமிழில் ‘கொடுக்க முயன்றார்கள்’ என்பது அந்த முயற்சியைக் இயல்பாக வெளிப்படுத்துகிறது; ‘கொடுத்துக்கொண்டிருந்தார்கள்’ என்பது அவர் உண்மையில் பெற்றுக்கொண்டார் என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: ἐσμυρνισμένον οἶνον
  choice: வெள்ளைப்போளம் கலந்த திராட்சரசம்
  rationale: σμυρνίζω என்பது வெள்ளைப்போளத்தைக் கலந்து தயாரிப்பதைக் குறிக்கிறது. ‘வெள்ளைப்போளம் கலந்த திராட்சரசம்’ என்பது பொருளையும் கலப்புச் செயலையும் தெளிவாகத் தருகிறது.
- source_word: ὃς δὲ
  choice: ஆனால் அவர்
  rationale: ὃς என்பது வடிவில் உறவுப்பெயராக இருந்தாலும், இங்கு இயேசுவை மீண்டும் சுட்டும் தொடரமைப்பாக வருகிறது; δέ-யின் மென்மையான எதிர்மறைத் திருப்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔλαβεν
  choice: அதை ஏற்றுக்கொள்ளவில்லை
  rationale: λαμβάνω என்பதற்கு ‘எடுத்துக்கொள்/பெற்றுக்கொள்/ஏற்றுக்கொள்’ என்ற பொருள்கள் உண்டு. வழங்கப்பட்ட பானத்தை இயேசு மறுத்த சூழலில் ‘ஏற்றுக்கொள்ளவில்லை’ இயல்பான தமிழ்; மூலத்தில் விடுபட்டுள்ள செயப்படுபொருளைத் தமிழில் ‘அதை’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு அந்தப் பானத்தை ஏற்காததற்கான காரணம்
  choice: அவர் அதை ஏற்றுக்கொள்ளவில்லை என்று மட்டும் விளக்கமாக மொழிபெயர்த்தல்
  alternative: வலியை மங்கச் செய்யும் போதைப்பானத்தை அவர் மறுத்தார் என்று காரணத்தைச் சேர்த்தல்
  rationale: கிரேக்க வசனம் பானம் வழங்கப்பட்டதையும் அவர் அதை ஏற்காததையும் மட்டுமே கூறுகிறது. மறுப்புக்கான காரணத்தையோ பானத்தின் நோக்கத்தையோ மொழிபெயர்ப்பில் சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திராட்சரசம்’ பொதுவான வேதாகமச் சொல்லாட்சியுடன் ஒத்திருந்தும் தெளிவாக உள்ளது; ‘வெள்ளைப்போளம்’ myrrh என்பதற்கான நிலைபெற்ற தமிழ் பெயர். வசனம் காரண விளக்கமின்றி சுருக்கமாக வைக்கப்பட்டுள்ளது.
