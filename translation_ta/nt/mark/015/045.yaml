  register: நவீனத் தரத் தமிழில் கண்ணியமான வரலாற்று நடையைக் காக்கிறது. ‘அவர்’ என்பது சூழலில் பிலாத்துவைக் குறிக்கிறது. மூலத்தில் உள்ள πτῶμα என்பதன் தெளிவான ‘சடலம்’ என்ற பொருள் முதன்மை உரையிலேயே வைக்கப்பட்டுள்ளது.
