revisions:
- from: நூற்றுக்குத் தலைவனிடமிருந்து இதை உறுதிப்படுத்திக்கொண்ட பின்பு, அவர் சடலத்தை யோசேப்பிடம் ஒப்படைத்தார்.
  to: நூற்றுவர் தலைவனிடமிருந்து அறிந்த பிறகு, அவர் சடலத்தை யோசேப்புக்கு வழங்கினார்.
  rationale: The revision removes the added demonstrative and confirmation nuance, preserves the source’s unspecified content of what Pilate learned, and uses a verb that naturally conveys the official granting action in this context.
