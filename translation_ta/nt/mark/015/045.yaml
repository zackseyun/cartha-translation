  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: ta
  text: நூற்றுவர் தலைவனிடமிருந்து அறிந்த பிறகு, அவர் சடலத்தை யோசேப்புக்கு வழங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς ἀπὸ τοῦ κεντυρίωνος
  choice: நூற்றுக்குத் தலைவனிடமிருந்து இதை உறுதிப்படுத்திக்கொண்ட பின்பு
  rationale: γνοὺς என்பது முதன்மைச் செயலுக்கு முந்திய சூழ்நிலைச் செயலைக் குறிக்கிறது. முந்தைய வசனத்தில் பிலாத்து இயேசு ஏற்கெனவே இறந்துவிட்டாரா என்று விசாரித்த சூழலில், நூற்றுக்குத் தலைவனிடமிருந்து செய்தியை அறிந்து உறுதிப்படுத்திக்கொண்டார் என்ற பொருள் இயல்பாக வெளிப்படுகிறது. ‘இதை’ என்பது தமிழில் தேவையான மறைசுட்டு; கிரேக்கத்தில் தனி நேரடிச் செயப்படுபொருள் இல்லை.
- source_word: κεντυρίωνος
  choice: நூற்றுக்குத் தலைவன்
  rationale: ரோமப் படையின் centurion என்ற வரலாற்றுப் பதவியைத் துல்லியமாகவும் தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான முறையிலும் குறிக்கிறது.
- source_word: ἐδωρήσατο
  choice: ஒப்படைத்தார்
  rationale: இங்கு யோசேப்புக்கு சடலத்தை எடுத்துச் செல்ல அதிகாரபூர்வமாக அனுமதித்து வழங்கிய செயலைக் குறிக்கிறது. வெறும் ‘கொடுத்தார்’ என்பதைவிட சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: πτῶμα
  choice: சடலத்தை
  rationale: πτῶμα என்பது இறந்த உடலைத் தெளிவாகக் குறிக்கிறது. தமிழில் ‘சடலம்’ இயல்பானதும் கண்ணியமானதும் மூலத்தின் வெளிப்படையான பொருளையும் காக்கும் சொல்லாகும்.
- source_word: τῷ Ἰωσήφ
  choice: யோசேப்பிடம்
  rationale: பெறுபவரைக் குறிக்கும் கிரேக்க நான்காம் வேற்றுமையை, ‘ஒப்படைத்தார்’ என்ற தமிழ் வினையுடன் இயல்பாக இணைக்கிறது.
