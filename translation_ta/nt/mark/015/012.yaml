  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: ta
  text: பிலாத்து மீண்டும் அவர்களிடம், “அப்படியானால், நீங்கள் யூதர்களின் ராஜா எனச் சொல்கிறவரை நான் என்ன செய்ய வேண்டும் என்று விரும்புகிறீர்கள்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: நடந்துகொண்டிருக்கும் உரையாடலில் பிலாத்து மறுபடியும் பேசுவதை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: அவர்களிடம் ... என்று கேட்டான்
  rationale: பதிலளித்துப் பேசுதல் என்ற கிரேக்கக் கதைநடை அமைப்பைத் தமிழில் இயல்பான நேரடி உரை அறிமுகமாக வழங்குகிறது; கேள்வி வடிவத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: Τί οὖν
  choice: அப்படியானால் ... என்ன
  rationale: οὖν முந்தைய கோரிக்கையிலிருந்து வரும் தொடர்ச்சியையும் முடிவுறுத்தும் தொடர்பையும் காட்டுகிறது.
- source_word: θέλετε
  choice: விரும்புகிறீர்கள்
  rationale: இச்சூழலில் கூட்டத்தாரின் விருப்பத்தையோ அவர்கள் கோரும் நடவடிக்கையையோ குறிக்கும் சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: ποιήσω
  choice: நான் ... செய்ய வேண்டுமென்று
  rationale: θέλετε என்பதோடு வரும் அஓரிஸ்ட் சப்ஜங்க்டிவின் கருத்தைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὃν λέγετε
  choice: நீங்கள் ... என்று சொல்கிறவனை
  rationale: அந்தப் பட்டம் கூட்டத்தார் கூறுவது என்பதைப் பாதுகாக்கிறது; அவர்கள் அந்த நபரை அப்படியே அழைக்கிறார்கள் என்ற பொருளைச் சேர்க்காமல், λέγετε என்பதன் நேரடியான ‘சொல்கிறீர்கள்’ என்ற வலிமையையும் தக்கவைக்கிறது.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ‘யூதர்களின் ராஜா’
  rationale: பாடுகளின் நிகழ்வுரையில் வரும் அரசியல் பட்டத்தை வழக்கமான, எளிதில் புரியும் தமிழில் வழங்குகிறது; மேற்கோள் குறிகள் இங்கு அது கூட்டத்தாரின் சொல் என்பதைத் தெளிவுபடுத்துகின்றன.
theological_decisions:
- issue: பிலாத்தின் சொற்கள் இயேசுவின் அரசத்துவத்தை ஒப்புக்கொள்கிறதா, அல்லது கூட்டத்தாரின் designation-ஐ மட்டும் பிரதிபலிக்கிறதா
  choice: “நீங்கள் ‘யூதர்களின் ராஜா’ என்று சொல்கிறவனை” என்று மொழிபெயர்த்து, அந்தப் பட்டத்தை கூட்டத்தாரின் கூற்றுக்குள் வைத்தல்
  alternative: “யூதர்களின் ராஜாவை நான் என்ன செய்ய வேண்டும்?”
  rationale: ὃν λέγετε என்பது ‘நீங்கள்’ கூறுவதை வலியுறுத்தி பிலாத்தின் சொல்லில் ஓர் இடைவெளியை உருவாக்குகிறது. ஆகவே பிலாத்து தனிப்பட்ட முறையில் அந்தப் பட்டத்தை ஒப்புக்கொண்டதாகவோ மறுத்ததாகவோ மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’ என்பது இச்சூழலின் பரிச்சயமான அரசியல் பட்டமாக வைக்கப்பட்டுள்ளது; தேவையற்ற சமயக்குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
