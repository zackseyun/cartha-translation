  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: ta
  text: அவர்கள் அவரைக் கொல்கொதா எனும் இடத்துக்குக் கொண்டுவந்தார்கள். அது “மண்டையோட்டின் இடம்” என்று மொழிபெயர்க்கப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: கொண்டுவந்தார்கள்
  rationale: கதைநடையில் வரும் கிரேக்க நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலமாக வழங்குகிறது. அவரை உடலால் சுமந்தார்கள் என்று தேவையின்றிக் குறிப்பாக்காமல், ஓர் இடத்துக்குக் கொண்டு சென்ற இயக்கத்தைத் தெளிவாகச் சொல்கிறது.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: கொல்கொதா எனும் இடத்துக்கு
  rationale: ἐπί உடன் வரும் வேற்றுமை உருபு இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது. τόπος என்பதையும் இடப்பெயரையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது; “எனும்” என்பது இங்கு பெயரையும் இடத்தையும் இணைக்கும் இயல்பான அடையாளத் தொடராகப் பயன்படுகிறது.
- source_word: Γολγοθᾶν
  choice: கொல்கொதா
  rationale: இடப்பெயரை மொழிபெயர்க்காமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: μεθερμηνευόμενον
  choice: மொழிபெயர்க்கப்படுகிறது
  rationale: ஒரு மொழியிலுள்ள பெயருக்கு மற்றொரு மொழியில் விளக்கம் தரப்படுவதைத் தெளிவாகக் காட்டுகிறது; வெறுமனே “பொருள்” என்று சொல்வதைவிட மூலச் சொல்லின் மொழிபெயர்ப்பு சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: Κρανίου Τόπος
  choice: மண்டையோட்டு இடம்
  rationale: கிரேக்க மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பான தமிழிலும் வழங்குகிறது. “ஒரு” அல்லது குறிப்பிட்ட “அந்த” மண்டையோடு என்று கட்டாயப்படுத்தாமல், மூலத்தில் உள்ள குறிப்புத்தன்மை சார்ந்த திறந்தநிலையைப் பாதுகாக்கிறது.
