  source_fidelity: முதல் வாக்கியம் φέρουσιν αὐτόν மற்றும் இலக்கை நோக்கிய ἐπὶ ... τόπον ஆகியவற்றைத் துல்லியமாகத் தருகிறது; தமிழில் இறந்தகாலக் கதைநடை இயல்பானது. Γολγοθᾶν என்பதற்கான ‘கொல்கொதா’ ஒலிபெயர்ப்பும் பொருத்தமானது. ஆனால் Κρανίου Τόπος என்பதிலுள்ள வெளிப்படையான வேற்றுமைத் தொடர்பை ‘மண்டையோட்டின் இடம்’ எனத் தருவது ‘மண்டையோட்டு இடம்’ என்பதைக் காட்டிலும் தெளிவானதும் மூல வடிவத்துக்கு நெருக்கமானதும் ஆகும்.
  naturalness: ‘அவர்கள் அவரைக் ... கொண்டுவந்தார்கள்’ மற்றும் ‘அது ... என்று மொழிபெயர்க்கப்படுகிறது’ ஆகியவை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளன. ‘மண்டையோட்டின் இடம்’ என்பது இயல்பான பெயர்ச்சொல் தொடராகும்.
  terminology: ‘மண்டையோடு’ என்பது κρανίον என்பதற்குப் பொருத்தமான சொல். முதன்மை உரையில் ‘ஒரு’ அல்லது ‘அந்த’ என்பதைச் சேர்க்காமல் இருப்பதால் கிரேக்கத்தின் article-இல்லாத திறந்தநிலை காக்கப்படுகிறது. அடிக்குறிப்பில் ‘குறிப்புச் சுட்டி’ என்பதற்குப் பதிலாக ‘உறுப்புச்சொல்’ என்பது கிரேக்க article-ஐத் துல்லியமாகக் குறிக்கிறது.
