  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழின் இயல்புக்கேற்ப இறந்தகாலமாக்கப்பட்டுள்ளது; பெயரின் விளக்கம் மட்டும் மூலத்தின் நிகழ்கால வடிவத்துக்கு இணையாக நிகழ்காலச் செயப்பாட்டு வடிவில் வைக்கப்பட்டுள்ளது.
