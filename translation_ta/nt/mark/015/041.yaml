source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: ta
  text: அவர் கலிலேயாவில் இருந்தபோது, இந்தப் பெண்கள் அவரைப் பின்பற்றியும் அவருக்குப் பணிவிடை செய்தும் வந்தார்கள்[a]. அவருடன் எருசலேமுக்கு ஏறிவந்த[b] வேறு பல பெண்களும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குச் சேவை செய்தார்கள்.” கிரேக்க வினைச்சொல் நடைமுறைப் பணிவிடையையோ ஆதரவையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவருடன் எருசலேமுக்கு ஏறிவந்தவர்கள்.” எருசலேமுக்குச் செல்வதை ‘ஏறுதல்’ என்று கூறும் வழக்கமான வேதாகமச் சொல்லாட்சியை இது பிரதிபலிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: இந்தப் பெண்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெண்களைச் சுட்டும் உறவுப்பெயரை, தமிழில் இயல்பான தனி வாக்கியமாக அமைப்பதற்காக இவ்வாறு மொழிபெயர்க்கிறது.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: அவர் கலிலேயாவில் இருந்தபோது
  rationale: கிரேக்கத்தின் நேரக் கிளவியையும் இடக் குறிப்பையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἠκολούθουν
  choice: பின்பற்றி ... செய்துவந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் வழக்கமாகத் தொடர்ந்து நிகழ்ந்த செயலைக் குறிப்பதால், ‘செய்துவந்தார்கள்’ என்ற அமைப்பு அதன் தொடர்ச்சியான இயல்பை வெளிப்படுத்துகிறது.
- source_word: διηκόνουν αὐτῷ
  choice: அவருக்குப் பணிவிடை செய்துவந்தார்கள்
  rationale: நடைமுறை உதவி, பராமரிப்பு, ஆதரவு ஆகியவற்றை உள்ளடக்கக்கூடிய διακονέω என்பதன் பரந்த பொருளை, குறிப்பிட்ட திருச்சபைப் பதவியைக் குறிக்காமல் தெரிவிக்கிறது.
- source_word: ἄλλαι πολλαὶ
  choice: வேறு பல பெண்களும்
  rationale: பெண்பால் பன்மையைத் தமிழில் தெளிவாகக் கூறுவதுடன், καί என்பதன் சேர்க்கைப் பொருளையும் ‘உம்’ வெளிப்படுத்துகிறது.
- source_word: αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα
  choice: அவருடன் எருசலேமுக்கு ஏறிவந்த
  rationale: எருசலேமுக்குச் செல்வதை ‘ஏறுதல்’ எனக் கூறும் வேதாகம வழக்கைத் தக்கவைத்து, συναναβαίνω என்பதிலுள்ள ‘உடன்’ என்ற பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: διηκόνουν குறிக்கும் பெண்களின் சேவையின் தன்மை
  choice: அவருக்குப் பணிவிடை செய்துவந்தார்கள்
  alternative: அவருக்குச் சேவை செய்துவந்தார்கள்
  rationale: இந்தச் சொல் நடைமுறைப் பராமரிப்பு அல்லது ஆதரவைச் சுட்டலாம். ‘பணிவிடை’ அதன் தனிப்பட்ட உதவிப் பொருளைத் தக்கவைக்கிறது; அதேவேளையில் அதை வீட்டு வேலைக்கோ, பிற்காலத் திருச்சபைப் பதவிக்கோ மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. முற்றுப்பெறாத இறந்தகாலத்தின் வழக்கமான தொடர்ச்சியை ‘செய்துவந்தார்கள்’ வெளிப்படுத்துகிறது. இரண்டு அடிக்குறிப்பு குறிகளும் உரையில் அவற்றுக்குரிய இடங்களில் சேர்க்கப்பட்டுள்ளன.
