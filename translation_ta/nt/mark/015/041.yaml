  to: அவர் கலிலேயாவில் இருந்தபோது, இந்தப் பெண்கள் அவரைப் பின்பற்றியும் அவருக்குப் பணிவிடை செய்தும் வந்தார்கள்[a]. அவருடன் எருசலேமுக்கு ஏறிவந்த[b] வேறு பல பெண்களும் இருந்தார்கள்.
