  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: ta
  text: அங்கே நின்றுகொண்டிருந்தவர்களில் சிலர் அதைக் கேட்டு, “இதோ, இவன் எலியாவைக் கூப்பிடுகிறான்[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவன் எலியாவை வரும்படி அழைக்கிறான்.”
    reason: φωνεῖ என்பதற்கு ஒருவரைப் பெயரிட்டு அழைப்பது அல்லது அவரை வரும்படி அழைப்பது என்ற நுண்பொருள் இருக்கலாம்.
lexical_decisions:
- source_word: καί
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: தமிழில் வசனத்தின் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது தேவையற்றதாகவும் கூடுதல் காலநுணுக்கம் தருவதாகவும் இருக்கும்; தொடர்ச்சியான நிகழ்வாக இயல்பான வாக்கிய அமைப்பே இணைப்பை உணர்த்துகிறது.
- source_word: τινες τῶν παρεστηκότων
  choice: அங்கே நின்றுகொண்டிருந்தவர்களில் சிலர்
  rationale: காட்சியிடத்தில் நின்றிருந்த குறிப்பற்ற ஒரு பகுதியினரைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; παρεστηκότων என்பதன் இடச்சார்ந்த பொருளும் காக்கப்படுகிறது.
- source_word: ἀκούσαντες
  choice: அதைக் கேட்டு
  rationale: முதலில் கேட்டதும் பின்னர் பேசினதும் ஆகிய காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; ‘அது’ என்பது முந்தைய வசனத்திலுள்ள இயேசுவின் கூக்குரலைச் சூழலிலிருந்து குறிக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகாலச் செயலின் தொடர்ச்சியான அல்லது நீடித்த தன்மையைத் தமிழில் வெளிப்படுத்துகிறது; கட்டாயமாகப் பலமுறை சொன்னார்கள் என்று மிகைப்படுத்தவில்லை.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கட்டளையின் செயல்பாட்டை இயல்பான, மரியாதை அல்லது எண்ணிக்கை சாராத தமிழில் தருகிறது.
- source_word: Ἠλίαν
  choice: எலியாவை
  rationale: தீர்க்கதரிசியின் பெயருக்கான வழக்கமான தமிழ் வடிவம்.
- source_word: φωνεῖ
  choice: கூப்பிடுகிறான்
  rationale: நிகழ்காலச் செயலை இயல்பாகக் காட்டுகிறது; நேரடிச் செயப்படுபொருளோடு வரும் கிரேக்கச் சொல்லின் மேற்பரப்புப் பொருளைப் பேணுகிறது.
theological_decisions:
- issue: அங்கே நின்றவர்கள் இயேசுவின் கூக்குரலை எலியாவை நோக்கிய அழைப்பாகத் தவறாகப் புரிந்துகொண்டதை வெளிப்படையாக விளக்க வேண்டுமா
  choice: “இவன் எலியாவைக் கூப்பிடுகிறான்” என்ற அவர்களுடைய கூற்றை விளக்கச் சேர்க்காமல் அப்படியே வைத்தல்
  alternative: “இவன் எலியாவைக் கூப்பிட்டு அழைக்கிறான்”
  rationale: கிரேக்க உரை அவர்களுடைய கூற்றை மட்டுமே பதிவு செய்கிறது; அது தவறான புரிதல் என்று கதைசொல்லி இவ்வசனத்தில் நேரடியாக விளக்கவில்லை. சூழலிலுள்ள இறையியல் மற்றும் கதைநடைச் சிக்கலை மொழிபெயர்ப்பு தானாகத் தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்பது பேச்சின் உடனடி கவன ஈர்ப்பைப் பேணுகிறது; ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்பது ἔλεγον என்பதன் முற்றுப்பெறாத அம்சத்தை இயல்பாகக் காட்டுகிறது.
