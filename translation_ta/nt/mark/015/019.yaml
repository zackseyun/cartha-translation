  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: ta
  text: அவர்கள் ஒரு நாணற்கோலால் அவருடைய தலையில் திரும்பத் திரும்ப அடித்துக்கொண்டும், அவர்மேல் துப்பிக்கொண்டும் இருந்தார்கள். மேலும், அவர்கள் மண்டியிட்டு அவரை வணங்கிக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு முன் பணிந்தார்கள்,” அல்லது “அவரை வழிபட்டார்கள்.” கிரேக்க வினை ஒருவருக்கு முன் பணிவது, மரியாதை செலுத்துவது, அல்லது வழிபடுவது ஆகியவற்றைக் குறிக்கலாம். இங்கு வீரர்கள் அரசருக்குரிய மரியாதையை கேலியாக நடித்துக் காட்டுகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: திரும்பத் திரும்ப அடித்து
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் மீண்டும் மீண்டும் நடந்த செயலைக் காட்டுகிறது. இயல்பான தமிழில் அதன் தொடர்ச்சியை இது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: அவருடைய தலையில்
  rationale: கிரேக்க மொழியின் உடைமைத் தொடர்பை இயல்பான தமிழில் தருகிறது; அடித்தல் என்ற வினையுடன் ‘தலையில்’ என்பது பொருத்தமான வேற்றுமை வடிவம்.
- source_word: καλάμῳ
  choice: ஒரு நாணற்கோலால்
  rationale: κάλαμος என்பது நாணல் அல்லது நாணலால் ஆன கோலைக் குறிக்கலாம். இச்சூழலில் அடிக்கப் பயன்படுத்தப்பட்ட பொருளையும் முந்தைய கேலி அரசச்சின்னத்துடனான தொடர்பையும் ‘நாணற்கோல்’ காக்கிறது.
- source_word: ἐνέπτυον αὐτῷ
  choice: அவர்மேல் துப்பிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த அல்லது மீள்நிகழ்ந்த செயலை ‘துப்பிக்கொண்டிருந்தார்கள்’ இயல்பாகக் காட்டுகிறது.
- source_word: τιθέντες τὰ γόνατα
  choice: மண்டியிட்டு
  rationale: சொல்லுக்குச் சொல் ‘முழங்கால்களை வைத்துக்கொண்டு’ என்ற பொருளுடைய கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருள்.
- source_word: προσεκύνουν αὐτῷ
  choice: அவரை வணங்கினார்கள்
  rationale: προσκυνέω உடலால் பணிதல், மரியாதை செலுத்துதல், அல்லது வழிபடுதல் ஆகிய பொருட்களை ஏற்கலாம். ‘வணங்கினார்கள்’ என்பது இங்குள்ள கேலிச் சூழலுக்கு இயல்பாக இருப்பதோடு சொல்லின் பரந்த பொருள் வாய்ப்பையும் முற்றிலும் மூடிவிடாது.
theological_decisions:
- issue: கேலி செய்யும் சூழலில் προσκυνέω என்பதன் பொருள்
  choice: அவரை வணங்கினார்கள்
  alternative: அவருக்கு முன் பணிந்தார்கள்; அவரை வழிபட்டார்கள்
  rationale: வீரர்கள் அரச மரியாதையைப் போலியாகச் செய்வதே உடனடிச் சூழல். ‘வணங்கினார்கள்’ என்பது அந்தச் செயலை இயல்பாகத் தருகிறது; அவர்கள் உண்மையான பக்தியுடன் வழிபட்டதாகத் தீர்மானிக்காது. கிரேக்க வினையின் ‘வழிபடுதல்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தொடர்ச்சியான கொடுமையை வினை வடிவங்கள் வெளிப்படுத்துகின்றன; ‘வணங்கினார்கள்’ என்பதில் உள்ள சொற்பொருள் மற்றும் இறையியல் நெருக்கடி அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
