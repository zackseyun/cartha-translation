source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: ta
  text: யோவான் அவரிடம், “ஆசிரியரே, ஒருவர் உமது பெயரில் பேய்களை விரட்டுவதைக் கண்டோம்; அவர் எங்களைப் பின்பற்றாததால், அவரைத் தடுக்க முயன்றோம்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் தடுத்துக்கொண்டிருந்தோம்.” கிரேக்க வினை வடிவம் தொடர்ச்சியான, மீண்டும் மீண்டும் நடந்த, அல்லது முயற்சித்த செயலைக் குறிக்கலாம்; ஆகவே பிரதான உரையில் “தடுக்க முயன்றோம்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: யோவான் அவரிடம் … என்றார்
  rationale: கிரேக்கத்தின் இயல்பான கதைநடைச் சொல்லாடலைத் தமிழில் இயல்பாகத் தருகிறது; αὐτῷ என்பதும் ‘அவரிடம்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பித்து வழிநடத்துபவர் என்ற பொருளைத் தெளிவாகவும் மரியாதையான அழைப்பாகவும் தருகிறது.
- source_word: εἴδομέν τινα
  choice: ஒருவர் … கண்டோம்
  rationale: τινα குறிப்பிடப்படாத ஒருவரைக் குறிக்கிறது; தேவையின்றி வேறு அடையாளத்தைச் சேர்க்காமல் உள்ளது.
- source_word: ἐν τῷ ὀνόματί σου
  choice: உமது பெயரில்
  rationale: இயேசுவின் பெயரையும் அதிகாரத்தையும் சார்ந்து செயல்படுவதைக் குறிக்கும் மூலமொழி மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: பேய்களை விரட்டுவதை
  rationale: ἐκβάλλω என்பதன் வெளியேற்றும் செயற்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: அவரைத் தடுக்க முயன்றோம்
  rationale: இறந்தகாலத் தொடர்வினையான ἐκωλύομεν தொடர்ந்த அல்லது முயற்சிக்கப்பட்ட செயலைக் குறிக்கக்கூடும்; பிரதான உரை முயற்சியின் நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: அவர் எங்களைப் பின்பற்றாததால்
  rationale: ἡμῖν என்பதைக் குறிப்பாக ‘எங்களை’ என்று தருகிறது; அதை ‘உம்மை’ என்றோ ‘எங்கள் குழுவில் இல்லை’ என்றோ விளக்கி மாற்றவில்லை.
theological_decisions:
- issue: இறுதி உட்பிரிவில் அந்த மனிதர் யாரைப் பின்பற்றவில்லை என்பது
  choice: எங்களைப் பின்பற்றாததால்
  alternative: உம்மைப் பின்பற்றாததால் / எங்களில் ஒருவராக இல்லாததால்
  rationale: கிரேக்க உரை வெளிப்படையாக ἡμῖν, ‘எங்களை/எங்களுக்கு,’ என்று கூறுகிறது. சீடர்களின் குழு அடையாளத்தை மையப்படுத்தும் யோவானின் சொல்லுக்கும் அடுத்த வசனத்தில் இயேசு அளிக்கும் திருத்தத்துக்கும் இடையிலான பதற்றத்தை இது பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதைக்கு ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; சீடர்களைக் குறிக்கும் ‘எங்களை’ தெளிவாகத் தக்கவைத்துள்ளது.
