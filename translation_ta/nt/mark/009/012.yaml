source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “எலியா முதலில் வந்து எல்லாவற்றையும் சீர்படுத்துகிறார் என்பது உண்மை. மேலும், மானிடமகனைக் குறித்து, அவர் பல துன்பங்களை அனுபவிக்கவும் இகழப்படவும்[a] வேண்டும் என்று எப்படி எழுதப்பட்டிருக்கிறது?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவமதிக்கப்படவும்,” “மதிப்பற்றவராகக் கருதப்படவும்.” கிரேக்க வினைச்சொல் ஒருவரை ஒரு பொருட்டாக மதிக்காமல் நடத்துதல் என்ற பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: கதைநடையில் இயல்பான தமிழ்ச் சொல்வரிசையைப் பயன்படுத்தி, எளிய உரையாடல் வினையின் பொருளைப் பாதுகாக்கிறது.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἐλθὼν πρῶτον
  choice: முதலில் வந்து
  rationale: முதன்மை வினைக்கு முன்னதாக நிகழும் வருகையையும் πρῶτον என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀποκαθιστάνει πάντα
  choice: எல்லாவற்றையும் மீண்டும் சீர்படுத்துகிறார்
  rationale: மீட்டமைத்தல் அல்லது உரிய நிலைக்குக் கொண்டுவருதல் என்ற வினையின் பொருளையும், πάντα என்பதன் விரிவான பொருளையும் பாதுகாக்கிறது.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மானிடமகன் … என்று அவரைக் குறித்து எப்படி எழுதப்பட்டிருக்கிறது?
  rationale: γέγραπται என்பதன் வேதவாக்கியச் சூத்திரத்தையும், ἐπί என்பதன் ‘குறித்து’ என்ற பொருளையும், கேள்வி வடிவத்தையும் தக்கவைக்கிறது.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: நற்செய்தி நூல்களில் இறையியல் முக்கியத்துவம் வாய்ந்த பட்டத்தை விளக்கவுரையாக மாற்றாமல் மொழிபெயர்க்கிறது.
- source_word: πολλὰ πάθῃ
  choice: பல பாடுகள் படவும்
  rationale: πολλά என்பதன் பன்மை வலியுறுத்தலையும் πάσχω என்பதன் துன்ப அனுபவத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐξουδενηθῇ
  choice: இகழப்படவும்
  rationale: ஒருவரை மதிப்பற்றவராகக் கருதி அவமதித்தல் என்ற செயலற்ற வினையின் மையப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; விரிவான நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: எலியாவின் சீர்படுத்தும் பணிக்கும் மானிடமகனின் பாடுகளுக்கும் இடையிலான தொடர்பு
  choice: இரண்டாம் கூற்றை உண்மையான வினாவாகவே வைத்து, சீர்படுத்துதலுக்கும் பாடுபடுதலுக்கும் இடையிலான பதற்றத்தை விளக்கிச் சமப்படுத்தாமல் விடுதல்
  alternative: ‘அப்படியானால் எப்படி...?’ என்று எதிர்மறைத் தொடர்பை வெளிப்படையாகச் சேர்த்தல் அல்லது இதை விளக்கக் கூற்றாக மாற்றுதல்
  rationale: மூல கிரேக்கம் πῶς என்ற வினாவை முன்வைக்கிறது; அந்த வினாவின் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக் கூடாது.
- issue: ‘மானிடமகன்’ என்ற பட்டத்தின் குறிப்பு
  choice: மானிடமகன்
  alternative: மேசியா அல்லது இயேசு என்று விளக்கி விரிவாக்குதல்
  rationale: மூலத்தின் பட்டத்தையே தக்கவைத்து, அதன் மேசியா மற்றும் மறைவெளிப்பாட்டு சார்ந்த பொருளை வாசகருக்காக முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கேள்வியின் இயல்பான தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
