  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: ta
  text: உப்பு நல்லது; ஆனால் உப்பு தன் உப்புத்தன்மையை இழந்துவிட்டால்[a], எதைக் கொண்டு அதற்குச் சுவையூட்டுவீர்கள்? உங்களுக்குள் உப்பு இருக்கட்டும்[b]; ஒருவரோடு ஒருவர் சமாதானமாக இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “உப்பு உப்புத்தன்மையற்றதாகிவிட்டால்” அல்லது “சுவையற்றதாகிவிட்டால்.”'
    reason: lexical_alternative
  - marker: b
    text: “உங்களுக்குள் உப்பு இருக்கட்டும்” என்பது கிரேக்க மூலத்தின் உருவகத்தை அப்படியே வைத்திருக்கிறது. இது தூய்மை, ஞானம், உடன்படிக்கை உண்மைத்தன்மை அல்லது பாதுகாக்கும் செல்வாக்கு ஆகியவற்றைக் குறிக்கலாம்; ஆனால் வசனம் எந்த ஒரு பொருளையும் வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: நல்லது
  rationale: உப்பைப் பொதுவாக நேர்மறையாக மதிப்பிடும் சொல்லாக இருப்பதால், பழமொழித் தன்மையைப் பாதுகாக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἅλας / ἅλα
  choice: உப்பு
  rationale: இரு இடங்களிலும் உருவகத்தை விளக்கமாக மாற்றாமல், ஒரே சொல்லால் நிலையாக மொழிபெயர்க்கிறது.
- source_word: ἄναλον γένηται
  choice: தன் உப்புத்தன்மையை இழந்துவிட்டால்
  rationale: ‘உப்பில்லாததாக ஆகுதல்’ என்ற மாற்றநிலையை நவீன தமிழில் இயல்பாக வெளிப்படுத்தி, உப்பு என்ற சொல்லோட்டத்தையும் காக்கிறது.
- source_word: ἐν τίνι
  choice: எதைக் கொண்டு
  rationale: வழி அல்லது கருவியை வினவும் கிரேக்கத் தொடருக்கான இயல்பான தமிழ் வடிவம்.
- source_word: ἀρτύσετε
  choice: சுவையூட்டுவீர்கள்
  rationale: சமையல் உருவகத்தைப் பாதுகாக்கிறது; ‘மீண்டும் உப்பாக்குதல்’ என்று பொருளை விரிவுபடுத்துவதில்லை.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: உங்களுக்குள் உப்பு இருக்கட்டும்
  rationale: தமிழில் இயல்பான கட்டளை வடிவில், ‘உப்பு’ உருவகத்தையும் ἐν ἑαυτοῖς என்பதன் உள்ளார்ந்த நோக்கையும் பாதுகாக்கிறது.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: ஒருவரோடு ஒருவர் சமாதானமாக இருங்கள்
  rationale: தொடர்ந்த உறவுநிலையைக் குறிக்கும் கட்டளையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இறுதிக் கட்டளையில் ‘உப்பு’ என்பதன் உருவகப் பொருள்
  choice: ‘உங்களுக்குள் உப்பு இருக்கட்டும்’ என்று உருவகத்தை அப்படியே வைத்தல்
  alternative: தூய்மை, ஞானம், உடன்படிக்கை உண்மைத்தன்மை, அல்லது பாதுகாக்கும் செல்வாக்கு என்று வெளிப்படையாக விளக்குதல்
  rationale: வசனம் உருவகத்தின் ஒரே பொருளைத் தெளிவாகக் குறிப்பிடாததால், குறிப்பிட்ட இறையியல் விளக்கத்தை முதன்மை உரையில் திணிக்காமல் அதன் உண்மையான பன்முகத் தன்மையைப் பாதுகாக்கிறது.
- issue: εἰρηνεύετε என்ற கட்டளையின் நடை
  choice: ‘சமாதானமாக இருங்கள்’
  alternative: ‘சமாதானமாக வாழுங்கள்’
  rationale: இரண்டும் சாத்தியமானவை; ‘இருங்கள்’ என்பது கிரேக்கக் கட்டளையை நேரடியாகத் தருவதோடு, தமிழிலும் தொடரும் உறவுநிலையை இயல்பாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. சுருக்கமான பழமொழித் தொனியும் ‘உப்பு’ உருவகத்தின் தெளிவுபடுத்தப்படாத தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
