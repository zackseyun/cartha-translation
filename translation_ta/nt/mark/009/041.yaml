source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் மெசியாவுக்குரியவர்கள் என்ற பெயரின் காரணமாக[a] உங்களுக்குக் குடிக்க ஒரு குவளை தண்ணீர் கொடுப்பவர் எவரும் தமக்குரிய வெகுமதியை நிச்சயமாக இழக்கமாட்டார் என்று உறுதியாக உங்களுக்குச் சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் மெசியாவுக்குரியவர்கள் என்பதால்.”
    reason: ἐν ὀνόματι ὅτι χριστοῦ ἐστε என்பது இலக்கண ரீதியாகக் கடினமான தொடர். முதன்மை உரை ‘பெயர்’ கூறைத் தக்கவைக்கிறது; மாற்று வாசிப்பு ὅτι-யின் இயல்பான காரணப் பொருளைக் காட்டுகிறது.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: ஏனெனில், ... எவரும்
  rationale: γάρ முந்தைய போதனையுடனான தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது; indefinite relative construction தமிழில் இயல்பாக ‘எவரும்’ என அமைக்கப்பட்டது.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: உங்களுக்கு ஒரு குவளை தண்ணீரைக் குடிக்கக் கொடுக்கிறவர்
  rationale: ποτίζω என்பதன் ‘குடிக்கக் கொடு’ என்ற செயற்பொருளையும், ποτήριον ὕδατος என்பதன் எளிய படிமத்தையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: நீங்கள் மெசியாவுக்குரியவர்கள் என்ற பெயரால்
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘என்’ என்பதைச் சேர்க்காமல், ἐν ὀνόματι என்பதையும் ὅτι χριστοῦ ἐστε என்பதையும் நெருக்கமாக இணைத்துக் காட்டுகிறது. Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உறுதியாக உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் ஆணித்தரமான அறிவிப்பு வடிவத்தின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: நிச்சயமாக இழக்கமாட்டார்
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக ... மாட்டார்’ என்ற வடிவில் காக்கிறது.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: தமக்குரிய கைம்மாறு
  rationale: μισθός என்பதன் இச்சூழலுக்குரிய recompense/reward பொருளைத் தருகிறது; subject-ஐ மதிப்புமிக்க ஒருமை வடிவில் தொடர ‘தமக்குரிய’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: Χριστός என்பதைக் பட்டமாக மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: χριστοῦ ἐστε என்ற உடைமைத் தொடர்பில் Χριστός இயேசுவின் பட்டமாகச் செயல்படுகிறது; ‘மெசியா’ அந்த பட்டத்தின் பொருளைத் தெளிவாகக் காக்கிறது.
- issue: ἐν ὀνόματι ὅτι என்பதன் தொடர்பு
  choice: நீங்கள் மெசியாவுக்குரியவர்கள் என்ற பெயரால்
  alternative: நீங்கள் மெசியாவுக்குரியவர்கள் என்பதால்
  rationale: முதன்மை உரை ἐν ὀνόματι என்ற ‘பெயர்’ கூறை வெளிப்படையாகக் காக்கிறது; ὅτι-ஐ காரணப் பொருளில் புரிந்துகொள்ளும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது. மூலத்தில் இல்லாத ‘என் பெயரால்’ என்பது சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘குவளை’, ‘குடிக்கக் கொடுக்கிறவர்’, ‘கைம்மாறு’ ஆகியவை எளிதில் புரியும் சொற்களாகவும் மூலப் படிமத்துக்கு நெருக்கமாகவும் உள்ளன; பாலினத்தைத் தேவையின்றி வெளிப்படுத்தாத மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
