source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: ta
  text: ஆறு நாட்களுக்குப் பிறகு[a], இயேசு பேதுருவையும் யாக்கோபையும் யோவானையும் தம்முடன் அழைத்துக்கொண்டு, அவர்களைத் தனியாக, வேறு எவருமின்றி[b], உயரமான ஒரு மலைக்கு ஏற்றிச் செல்கிறார். அவர்கள் கண்முன்னே அவர் உருமாறினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆறு நாட்கள் கழித்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தனியாக, அவர்கள் மட்டுமே.” மற்றவர்களிடமிருந்து பிரிக்கப்பட்டதை வலியுறுத்தும் இரண்டு சொற்றொடர்களைக் கிரேக்கம் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மாற்றமடைந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: ஆறு நாட்களுக்குப் பிறகு
  rationale: μετά உடன் வரும் காலக் குறிப்பு, முந்தைய நிகழ்விலிருந்து ஆறு நாட்கள் கடந்த பின்பான நேரத்தைக் குறிக்கிறது. இந்தத் தேர்வு கிரேக்கச் சொல்லமைப்பையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: παραλαμβάνει
  choice: தம்முடன் அழைத்துக்கொண்டு
  rationale: இயேசு பெயரிடப்பட்ட மூன்று சீடர்களைத் தம்மோடு அழைத்துச் செல்வதைத் தெளிவுபடுத்துகிறது. மாற்குவின் உயிரோட்டமுள்ள வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாக வைத்திருக்கிறது.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: உயரமான ஒரு மலைமேல் கூட்டிச் செல்கிறார்
  rationale: ἀναφέρει குறிக்கும் மேல்நோக்கிய அழைத்துச் செல்லுதலையும், εἰς குறிக்கும் இலக்கை நோக்கிய நகர்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατ’ ἰδίαν μόνους
  choice: அவர்கள் மட்டும் தனியாக
  rationale: κατ’ ἰδίαν என்பதன் தனிப்பட்ட பிரிவையும் μόνους என்பதன் ‘அவர்கள் மட்டுமே’ என்ற வலியுறுத்தலையும் இரண்டையும் தக்கவைக்கிறது.
- source_word: μετεμορφώθη
  choice: உருமாறினார்
  rationale: காணக்கூடிய மாற்றத்தைக் குறிக்கும் வினையை, மாற்றத்தின் இயல்பு அல்லது காரணத்தை மேலதிகமாக விளக்காமல், இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἔμπροσθεν αὐτῶν
  choice: அவர்கள் கண்முன்னே
  rationale: இந்த மாற்றம் சீடர்களின் முன்னிலையில், அவர்கள் காணும்படி நிகழ்ந்தது என்ற பொருளை இயல்பாக எடுத்துரைக்கிறது.
theological_decisions:
- issue: கிறிஸ்துவைப் பற்றிய சூழலில் μετεμορφώθη என்பதன் மொழிபெயர்ப்பு
  choice: உருமாறினார்
  alternative: மாற்றமடைந்தார்
  rationale: ‘உருமாறினார்’ என்பது வெளிப்பட்ட மாற்றத்தைத் தெளிவாகக் குறிக்கிறது; ஆனால் அந்த மாற்றத்தின் உள்ளார்ந்த இயல்பையோ செயலாற்றியவரையோ உரை சொல்லாத அளவுக்கு மேல் நிர்ணயிப்பதில்லை. ‘மாற்றமடைந்தார்’ என்பது சொற்பொருளுக்கு ஏற்ற மாற்று.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் உயிரோட்டமும் காக்கப்பட்டுள்ளன. முதல் இரு கிரேக்க வினைகளின் வரலாற்று நிகழ்காலம் தமிழிலும் நிகழ்காலமாகவும், இறுதி வினையின் இறந்தகாலம் இறந்தகாலமாகவும் தரப்பட்டுள்ளது. ‘அவர்கள் மட்டும் தனியாக’ என்பது தமிழில் ஓரளவு வலியுறுத்தலாக ஒலித்தாலும், மூலத்தின் இரட்டைப் பிரிப்பு வலியுறுத்தலை நோக்கத்துடன் காக்கிறது.
