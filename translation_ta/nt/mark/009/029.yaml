source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இந்த வகை, ஜெபத்தினாலன்றி வேறு எதனாலும் வெளியேற முடியாது” என்று சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பிற்காலக் கையெழுத்துப் பிரதிகள் சில, “ஜெபத்தினாலும் உபவாசத்தினாலும்” என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: இந்த வகை
  rationale: γένος என்பது இங்கு ஒரு வகையையோ பிரிவையையோ குறிக்கிறது. உடனடி சூழலில் அசுத்த ஆவி குறிக்கப்பட்டாலும், கிரேக்க உரையில் ‘ஆவி’ மீண்டும் வெளிப்படையாக இடம்பெறாததால் அதைச் சேர்க்காமல் சுருக்கமான மூல வடிவம் காக்கப்படுகிறது.
- source_word: ἐν οὐδενὶ
  choice: வேறு எதனாலும்
  rationale: ἐν உடன் οὐδενί இங்கு வழி அல்லது கருவியைக் குறிக்கும் மரபுத்தொடராக உள்ளது. எதிர்மறை வாக்கியத்தில் ‘வேறு எதனாலும்’ என்பது இயல்பான தமிழில் எந்த மற்ற வழியும் பயனளிக்காது என்ற பொருளைத் தருகிறது.
- source_word: δύναται ἐξελθεῖν
  choice: வெளியேற முடியாது
  rationale: δύναται மற்றும் ἐξελθεῖν ஆகியவை இயலாமையை வெளிப்படுத்துகின்றன. அசுத்த ஆவி ஒருவரிடமிருந்து நீங்குவதைச் சூழல் காட்டுவதால் ‘வெளியேற’ இயல்பாகப் பொருந்துகிறது.
- source_word: εἰ μὴ
  choice: அன்றி
  rationale: εἰ μὴ ஒரே விதிவிலக்கை அறிமுகப்படுத்துகிறது. ‘ஜெபத்தினாலன்றி’ என்பது முன்னுள்ள எதிர்மறைக் கட்டமைப்புடன் இயல்பாக இணைகிறது.
- source_word: ἐν προσευχῇ
  choice: ஜெபத்தினால்
  rationale: இச்சொற்றொடர் வழி அல்லது கருவியைக் குறிக்கிறது. ‘ஜெபத்தினால்’ என்பது அந்தக் கருவிப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘உபவாசமும்’ என்பதைச் சேர்ப்பதா
  choice: முதன்மை உரையில் ‘ஜெபம்’ மட்டும்
  alternative: ‘ஜெபமும் உபவாசமும்’
  rationale: வழங்கப்பட்ட SBLGNT கிரேக்க உரையில் προσευχῇ (‘ஜெபம்’) மட்டுமே உள்ளது. பிற்காலக் கையெழுத்துப் பிரதிகள் சிலவற்றில் ‘உபவாசமும்’ சேர்க்கப்பட்டுள்ளது. ஆகவே மூல உரையின் வாசகம் முதன்மை உரையில் வைக்கப்பட்டு, நீண்ட வாசகம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்ட மொழிபெயர்ப்பு. ‘இந்த வகை’ என்று கூறி மூலத்தின் சுருக்கத்தையும், ‘வேறு எதனாலும் … அன்றி’ என்று கூறி வழி/கருவி சார்ந்த பொருளையும் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முழு வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
