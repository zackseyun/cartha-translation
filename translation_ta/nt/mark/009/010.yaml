source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: ta
  text: அவர்கள் அந்தக் கூற்றைத் தங்களுக்குள்ளேயே வைத்துக்கொண்டு[a], “இறந்தவர்களிடமிருந்து உயிர்த்தெழுவது” என்பது என்ன என்று கலந்துரையாடினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த வார்த்தையை’ அல்லது ‘அந்தச் சொல்லை.’
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொல்லுக்குச் சொல், ‘இறந்தவர்களின் நடுவிலிருந்து உயிர்த்தெழுவது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: அந்தக் கூற்றை
  rationale: இங்கு λόγος என்பது தனிப்பட்ட ஒரு ‘சொல்’ அல்ல; முந்தைய வசனத்தில் இயேசு கூறிய அறிவுறுத்தலைக் குறிக்கிறது. ‘அந்தக் கூற்று’ என்பது அதன் குறிப்பிட்ட தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐκράτησαν
  choice: வைத்துக்கொண்டு
  rationale: κρατέω என்பதன் அடிப்படைப் பொருள் ‘பிடித்திருத்தல்/வைத்திருத்தல்.’ πρὸς ἑαυτούς என்பதுடன் சேர்ந்து, அவர்கள் அந்தக் கூற்றைத் தங்கள் வட்டத்துக்குள்ளேயே வைத்திருந்தார்கள் என்ற பொருளைத் தருகிறது.
- source_word: πρὸς ἑαυτοὺς
  choice: தங்களுக்குள்ளேயே
  rationale: அவர்கள் இதை வெளியே சொல்லாமல் தங்கள் நடுவில் வைத்துக்கொண்டதையும், அதைப் பற்றித் தங்களிடையே பேசியதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συζητοῦντες
  choice: விவாதித்தார்கள்
  rationale: இந்த வினைச்சொல் ஒன்றைப் பற்றி சேர்ந்து ஆராய்ந்து பேசுவதைக் குறிக்கிறது. ‘விவாதித்தார்கள்’ என்பது பகைமையான வாக்குவாதத்தை அவசியமாக உணர்த்தாமல், அவர்களுடைய தீவிரமான கலந்துரையாடலைத் தெரிவிக்கிறது.
- source_word: τί ἐστιν
  choice: என்றால் என்ன
  rationale: சொல்லுக்குச் சொல் ‘அது என்ன’ என்றாலும், இங்கு சீடர்கள் அந்தச் சொற்றொடரின் பொருளை ஆராய்கிறார்கள்; ‘என்றால் என்ன’ என்பது அதனைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: இறந்தவர்களிடமிருந்து உயிர்த்தெழுவது
  rationale: ἐκ νεκρῶν என்பதிலுள்ள ‘இறந்தவர்களின் நடுவிலிருந்து’ என்ற நுட்பத்தை ‘இறந்தவர்களிடமிருந்து’ காக்கிறது; ἀναστῆναι என்பதன் உயிர்த்தெழுதல் பொருளையும் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: சீடர்கள் விவாதிக்கும் உயிர்த்தெழுதல் மொழி
  choice: இறந்தவர்களிடமிருந்து உயிர்த்தெழுவது
  alternative: இறந்தோரிலிருந்து எழுந்திருப்பது
  rationale: சீடர்கள் இயேசுவின் வார்த்தையின் பொருளைப் புரிந்துகொள்ளாமல் விவாதித்த நிலையை வசனம் அப்படியே விடுகிறது. மொழிபெயர்ப்பு பின்னாளைய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், ἐκ νεκρῶν என்பதன் தனித்த நுட்பத்தையும் உயிர்த்தெழுதல் குறித்த பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி உரை வடிவம் சீடர்கள் ஆராய்ந்த குறிப்பிட்ட சொற்றொடரைத் தெளிவாக்குகிறது.
