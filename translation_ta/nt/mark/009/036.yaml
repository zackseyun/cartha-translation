  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: ta
  text: 'அவர் ஒரு குழந்தையை எடுத்து, அதை அவர்கள் நடுவில் நிறுத்தி[a], அதை அணைத்துக்கொண்டு[b] அவர்களிடம் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களிடையே வைத்தார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் நேரடியாக ‘நிற்கச் செய்தார்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அதைத் தம் கைகளில் எடுத்துக்கொண்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒருவரைத் தம் கைகளில் எடுத்துக்கொள்வதையோ அணைத்துக்கொள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: எடுத்து
  rationale: இறந்தகால வினையெச்சம் முதலில் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘எடுத்து’ என்பது கூடுதல் நோக்கத்தையோ குழந்தை வந்த விதத்தையோ சேர்க்காமல் செயல்வரிசையை இயல்பாகத் தருகிறது.
- source_word: παιδίον
  choice: ஒரு குழந்தையை
  rationale: இச்சொல் இளம் குழந்தையைக் குறிக்கலாம்; ஆனால் இவ்விடத்தில் ‘சிறு’ என்ற பொருள்நிழலைக் கட்டாயப்படுத்தாமல் ‘குழந்தை’ என மொழிபெயர்ப்பது துல்லியமும் இயல்பும் ஆகும்.
- source_word: ἔστησεν
  choice: நிறுத்தி
  rationale: ἵστημι இங்கு பிறவினைப் பொருளில் ‘நிற்கச் செய்தல்’ எனப் பொருள்படுகிறது. ‘நிறுத்தி’ என்பது அந்த உடல்சார்ந்த செயலைத் தெளிவாகக் காக்கிறது.
- source_word: ἐν μέσῳ αὐτῶν
  choice: அவர்கள் நடுவில்
  rationale: குழுவினரின் மையத்தில் அல்லது அவர்களிடையே இருந்த இடநிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐναγκαλισάμενος
  choice: தம் கைகளில் அணைத்துக்கொண்டு
  rationale: கைகளுக்குள் எடுத்துக்கொள்ளுதல் அல்லது அணைத்துக்கொள்ளுதல் என்ற இரு நெருங்கிய பொருள்களையும் இத்தொடர் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் சொன்னார்
  rationale: λέγω மற்றும் அதன் மறைமுகச் செயப்படுபொருளை நேரடியாகவும் நடுநிலையாகவும் வழங்குகிறது.
