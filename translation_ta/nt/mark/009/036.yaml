  register: நவீன நிலையான தமிழில், மரியாதையான ‘அவர்/தம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் தொடர் வினையெச்ச அமைப்பு இயல்பான தமிழ்ச் செயல்வரிசையாகப் பேணப்பட்டுள்ளது; குழந்தையின் பாலினம் மூலத்தில் உறுதியாகக் குறிப்பிடப்படாததால் பாலினச் சுட்டுப்பெயர் தவிர்க்கப்பட்டுள்ளது.
