source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: ta
  text: அவர் வீட்டுக்குள் சென்ற பின்பு, அவருடைய சீடர்கள் அவரிடம் தனியாக, “எங்களால் ஏன் அதை[a] வெளியேற்ற முடியவில்லை?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை.” சுட்டுப்பெயர் சிறுவனைக் குறித்தால் இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் கிரேக்கச் சுட்டுப்பெயர் நடுநிலைப் பாலில் இருப்பதால், அது அசுத்த ஆவியைக் குறிப்பது அதிக இயல்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: அவர் வீட்டுக்குள் சென்றபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையுடன் அமைந்த genitive absolute, முதன்மை வினைக்கு நேரப் பின்னணியை அளிக்கிறது. ‘சென்றபோது’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς οἶκον
  choice: வீட்டுக்குள்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு உருபு இல்லாவிட்டாலும், கதைச்சூழலில் குறிப்பிட்ட வீட்டைக் குறிக்கும் இயல்பான தமிழாக்கம் இது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: μαθηταί என்பதன் கற்றல், பின்பற்றுதல், உறவு ஆகிய பொருள்களை நற்செய்தி சூழலில் ‘சீடர்கள்’ துல்லியமாகத் தருகிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: மற்றவர்களிடமிருந்து விலகி தனிப்பட்ட முறையில் கேட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπηρώτων
  choice: கேட்டார்கள்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் கேள்வி கேட்டுக் கொண்டிருந்த செயலைக் காட்டலாம்; தமிழில் இச்சூழலில் ‘கேட்டார்கள்’ இயல்பாக உள்ளது, தேவையற்ற தொடர்ச்சிப் பொருளை மிகைப்படுத்தாது.
- source_word: Ὅτι
  choice: ஏன்
  rationale: இங்கு காரணம் கேட்கும் வினாச்சொல்லாகச் செயல்படுவதால் ‘ஏன்’ என்பது நேரான, இயல்பான இணை.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: எங்களால் ... முடியவில்லை
  rationale: வலியுறுத்தப்பட்ட ἡμεῖς மற்றும் இயலாமையைக் குறிக்கும் δύναμαι ஆகிய இரண்டையும் தமிழின் ‘எங்களால் ... முடியவில்லை’ என்ற அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: ἐκβαλεῖν
  choice: வெளியேற்ற
  rationale: பேய் அல்லது அசுத்த ஆவியை ஒருவரிடமிருந்து அகற்றும் இச்சூழலில், ‘வெளியேற்ற’ என்பது துல்லியமும் பொதுவாகப் புரிந்துகொள்ளத்தக்கதுமான சொல்.
- source_word: αὐτό
  choice: அதை
  rationale: இடைப்பால் ஒருமைச் சுட்டுப்பெயர் அசுத்த ஆவியை இயல்பாகச் சுட்டுகிறது; அதனால் ‘அதை’ தேர்ந்தெடுக்கப்பட்டது. சுட்டுப்பொருளின் மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதி αὐτό என்ற சுட்டுப்பெயரின் சுட்டுப்பொருள்
  choice: அசுத்த ஆவி அல்லது பேயைக் குறிக்கும் வகையில் ‘அதை’
  alternative: பாதிக்கப்பட்ட சிறுவனைக் குறிக்கும் வகையில் ‘அவனை’
  rationale: கிரேக்க இடைப்பால் ஒருமை வடிவம் ஆண்பால் சிறுவனைவிட அசுத்த ஆவியைச் சுட்டுவது இயல்பானது; மேலும் ‘வெளியேற்ற’ என்ற வினையின் உடனடிச் சூழலும் இதை ஆதரிக்கிறது. எனினும் சுட்டுப்பொருளில் உள்ள சாத்தியமான தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சீடர்கள்’ போன்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், வாக்கிய அமைப்பு இயல்பான நடப்புத் தமிழில் உள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘அதை’ என்ற சொல்லுக்குப் பின் அல்லாமல் வசன முடிவில் வைக்கப்பட்டுள்ளது; இருப்பினும் அதன் தொடர்பு தெளிவாக உள்ளது.
