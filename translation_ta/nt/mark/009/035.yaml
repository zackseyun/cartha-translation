  source_fidelity: 'மூலத்தின் செயல்வரிசையும் காலங்களும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: καθίσας என்பதற்கு ‘உட்கார்ந்து’, ἐφώνησεν என்பதற்கு ‘அழைத்து’, வரலாற்று நிகழ்கால λέγει என்பதற்கு ‘கூறுகிறார்’ பொருத்தமாக உள்ளன. πρῶτος/ἔσχατος எதிர்மறை இணையும், πάντων என்பதன் இரு பரப்புகளும் ‘அனைவரிலும் ... அனைவருக்கும்’ எனக் காக்கப்பட்டுள்ளன. διάκονος என்பதன் பொதுவான ‘பிறருக்குச் சேவை செய்பவர்’ பொருளும் சரியாக வெளிப்படுகிறது.'
  naturalness: வாசகம் நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘முதன்மையானவராக’, ‘கடைசியானவராக’, ‘பணிவிடை செய்பவராக’ ஆகிய வடிவங்கள் இச்சூழலின் நிலை/பங்கு முரணைத் தெளிவாகத் தருகின்றன.
  terminology: ‘பன்னிருவர்’ பன்னிரு சீடர்களைக் குறிக்கும் நிலையான சொல்லாகப் பொருந்துகிறது. ‘பணிவிடை செய்பவர்’ பின்னாளைய சபைப் பதவியைத் திணிக்காமல் διάκονος என்பதன் சேவைப் பொருளை வழங்குகிறது.
