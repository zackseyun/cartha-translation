id: MRK.9.35
reference: Mark 9:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: ta
  text: 'அவர் உட்கார்ந்து, பன்னிருவரையும் அழைத்து அவர்களிடம் கூறுகிறார்: “யாராவது முதன்மையானவராக இருக்க விரும்பினால், அவர் அனைவரிலும் கடைசியானவராகவும் அனைவருக்கும் பணிவிடை செய்பவராகவும் இருப்பார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: உட்கார்ந்து
  rationale: போதிக்கும்போது அமர்ந்துகொள்ளும் செயலை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: கிரேக்க நிகழ்காலத்தின் கதைநடை உயிரோட்டத்தைப் பாதுகாக்க நிகழ்காலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: πρῶτος
  choice: முதன்மையானவர்
  rationale: வரிசையில் முதல் என்பதைக் கடந்த, அந்தச் சூழலில் நாடப்படும் உயர்நிலை அல்லது முக்கியத்துவத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: ἔσχατος
  choice: கடைசியானவர்
  rationale: πρῶτος என்பதற்கு எதிரான நிலையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: διάκονος
  choice: பணிவிடை செய்பவர்
  rationale: பிறருக்குச் சேவை செய்பவர் என்ற பொதுவான பொருளைத் தருகிறது; பின்னாளைய சபைப் பதவிப் பொருளைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: ἔσται என்பதன் எதிர்கால வடிவமும் கூற்றின் வலிமையும்
  choice: இருப்பார்
  alternative: இருக்க வேண்டும்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள எதிர்காலக் கூற்றைப் பாதுகாக்கிறது; அதை நேரடியான கட்டளையாக மாற்றவில்லை.
- issue: πάντων என்பதன் இருமுறை பயன்பாடு
  choice: அனைவரிலும் ... அனைவருக்கும்
  alternative: எல்லாரிலும் ... எல்லாருடைய
  rationale: முதல் பயன்பாட்டில் ஒப்பீட்டையும் இரண்டாவது பயன்பாட்டில் சேவை பெறுவோரையும் தெளிவாகக் காட்டி, ‘அனைவர்’ என்ற பரப்பை இரு இடங்களிலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. மூலத்தின் வரலாற்று நிகழ்காலமான ‘கூறுகிறார்’ பாதுகாக்கப்பட்டுள்ளது; வாக்கியத்தின் முரண்பாட்டுத் தீவிரமும் மங்கச் செய்யப்படவில்லை.
