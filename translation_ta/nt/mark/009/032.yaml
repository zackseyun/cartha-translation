  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: ta
  text: ஆனால் அவர்கள் அந்தக் கூற்றைப்[a] புரிந்துகொள்ளவில்லை; அவரிடம் கேட்கவும் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சொன்னதை.” கிரேக்க ῥῆμα என்பது பேசப்பட்ட சொல், கூற்று அல்லது செய்தியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ஆனால் அவர்கள்
  rationale: δέ, இயேசு முன்பு கூறியதற்கும் சீடர்களின் புரியாமைக்கும் இடையிலான மிதமான முரண்பாட்டைக் காட்டுகிறது; சூழலில் οἱ என்பது சீடர்களைக் குறிக்கும் மறைமுக எழுவாயாக இருப்பதால் ‘அவர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἠγνόουν
  choice: புரிந்துகொள்ளவில்லை
  rationale: ἀγνοέω இங்கு அறியாமையை மட்டும் அல்லாமல், இயேசு கூறியதன் பொருளை உணரத் தவறியதைக் குறிக்கிறது. இறந்தகாலத்தில் நீடித்த மனநிலையைத் தமிழ் இயல்பாக இவ்வாறு தெரிவிக்கிறது.
- source_word: τὸ ῥῆμα
  choice: அந்தக் கூற்று
  rationale: ῥῆμα என்பது இங்கு இயேசு சற்று முன்பு வாய்மொழியாகச் சொன்ன செய்தியைக் குறிக்கிறது. ‘கூற்று’ என்பது முன்னறிவிப்பின் முழு உள்ளடக்கத்தையும் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்; ‘சொல்’ அல்லது ‘சொன்னது’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ἐφοβοῦντο
  choice: பயந்தார்கள்
  rationale: φοβέομαι என்பதன் முற்றுப்பெறாத இறந்தகால வடிவம் அப்போது நிலவிய பயத்தைச் சுட்டுகிறது; ‘பயந்தார்கள்’ என்பது தமிழில் இயல்பான, தெளிவான வடிவம்.
- source_word: αὐτὸν
  choice: அவரிடம்
  rationale: இது இயேசுவைக் குறிக்கிறது. ἐπερωτάω என்ற வினையுடன் தமிழில் கேள்வி கேட்கப்படும் நபரை ‘அவரிடம்’ என்று குறிப்பது இயல்பு.
- source_word: ἐπερωτῆσαι
  choice: கேட்க
  rationale: ἐπερωτάω என்பதற்கு இங்கு கேள்வி கேட்பது அல்லது விசாரிப்பது என்று பொருள்; ‘கேட்க’ என்பது பொதுவான, இயல்பான தமிழ்.
