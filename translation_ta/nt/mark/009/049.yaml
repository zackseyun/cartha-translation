  text: Πᾶς γὰρ πυρὶ ⸀ἁλισθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: ta
  text: ஏனெனில், ஒவ்வொருவரும் நெருப்பால் உப்பிடப்படுவார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வொருவரும் நெருப்பால் சுவையூட்டப்படுவார்.’ இந்த உருவகம் நியாயத்தீர்ப்பு, தூய்மைப்படுத்துதல், அல்லது பலியிடுதல் சார்ந்த மொழியை நினைவூட்டலாம்; லேவியர் 2:13-ஐ ஒப்பிடுக.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகள், ‘ஒவ்வொரு பலியும் உப்பால் உப்பிடப்படும்’ என்று சேர்க்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: ஒவ்வொருவரும்
  rationale: இது ஆண்பால் ஒருமை எழுவாயாகப் பெயர்ச்சொல் தன்மையில் பயன்படுத்தப்பட்டுள்ளது. சூழலில் மனிதர்களையே குறிப்பதால், ‘எல்லாம்’ என்பதற்குப் பதிலாக ‘ஒவ்வொருவரும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிப்புக்கான விளக்கக் காரணத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: πυρὶ
  choice: நெருப்பால்
  rationale: வேற்றுமை உருபு கருவி அல்லது தொடர்பை உணர்த்தக்கூடும். ‘நெருப்பால்’ என்பது தமிழில் இயல்பாக இருந்து, உப்பிடுதலுடன் நெருப்பை நேரடியாக இணைக்கிறது; உருவகத்தின் பொருளை மேலும் விளக்கித் தீர்மானிப்பதில்லை.
- source_word: ἁλισθήσεται
  choice: உப்பிடப்படுவார்
  rationale: ἁλίζω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் நேரடியாக ‘உப்பிடப்படுதல்’ அல்லது ‘சுவையூட்டப்படுதல்’ என்று பொருள்படும். அரிதான ‘நெருப்பால் உப்பிடப்படுதல்’ என்ற வலுவான உருவகத்தை உரைமாற்றமின்றிக் காக்க ‘உப்பிடப்படுவார்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ‘நெருப்பால் உப்பிடப்படுதல்’ என்ற உருவகத்தின் பொருள்
  choice: இது நியாயத்தீர்ப்பு, தூய்மைப்படுத்துதல், பலியிடுதல், அல்லது சீடத்துவச் சோதனை ஆகியவற்றில் எதைக் குறிப்பதாகும் என்பதை முதன்மை உரை தீர்மானிக்காமல், மூல உருவகத்தை அப்படியே வைத்திருக்கிறது.
  alternative: ‘ஒவ்வொருவரும் நெருப்பினால் நியாயந்தீர்க்கப்படுவார்,’ ‘ஒவ்வொருவரும் நெருப்பினால் தூய்மைப்படுத்தப்படுவார்,’ அல்லது ‘உப்பிடப்பட்ட பலியைப்போல் ஒவ்வொருவரும் அர்ப்பணிக்கப்படுவார்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க வாசகம் சுருக்கமாகவும் பல குறிப்புகளை உள்ளடக்கக்கூடியதாகவும் உள்ளது. உடனடிச் சூழல் ஒன்றோடொன்று தொடர்புடைய பல விளக்கங்களுக்கு இடமளிப்பதால், எந்த ஒரு இறையியல் விளக்கத்தையும் முதன்மை உரைக்குள் சேர்க்காமல் அதன் பதற்றமும் தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நெருப்பால் உப்பிடப்படுவார்’ என்பது தமிழில் வழக்கத்திற்கு மாறான உருவகமாக இருந்தாலும், மூலத்தின் திட்டமிட்ட வியப்பூட்டும் சொல்லிணைப்பைப் பாதுகாக்கிறது.
