id: MRK.9.24
reference: Mark 9:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: ta
  text: உடனே அந்தப் பிள்ளையின்[a] தந்தை உரக்கக் கூவி, “நான் நம்புகிறேன்; என் நம்பிக்கையின்மையில் எனக்கு உதவுங்கள்[b]!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சிறுவனின்.” παιδίον என்ற கிரேக்கச் சொல் சூழலுக்கேற்ப “பிள்ளை” அல்லது “சிறுவன்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “என் நம்பிக்கைக் குறைவில் எனக்கு உதவுங்கள்.” ἀπιστία என்ற கிரேக்கச் சொல் அவநம்பிக்கையையோ நம்பிக்கைக் குறைவையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: உடனே
  rationale: தந்தையின் பதில் தாமதமின்றி வந்ததையும் மாற்குவின் உரையில் காணப்படும் அவசர உணர்வையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κράξας
  choice: உரக்கக் கூவி
  rationale: உரத்த குரலையும் உணர்ச்சிமிகுந்த அவசரத்தையும் வெளிப்படுத்துகிறது; வெறும் ‘சொன்னார்’ என்பதைக் காட்டிலும் மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: அந்தப் பிள்ளையின் தந்தை
  rationale: παιδίον என்பதன் ‘பிள்ளை/சிறுவன்’ என்ற பொருள் வரம்பை தேவையின்றிக் குறுக்காமல், கிரேக்க மரபுத்தொடரையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἔλεγεν
  choice: என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் கிரேக்க இறந்தகால வினையை இயல்பான தமிழ் மேற்கோள் அமைப்பில் வழங்குகிறது.
- source_word: Πιστεύω
  choice: நான் நம்புகிறேன்
  rationale: உடனடியான சூழலில் இயேசுவை நம்புவதைக் குறிக்கிறது; πίστις சொல்லுக்குடும்பத்துடனான தொடர்பையும் தெளிவாக வைத்திருக்கிறது.
- source_word: βοήθει
  choice: உதவுங்கள்
  rationale: நேரடியான, அவசரமான வேண்டுகோளை இயல்பான மரியாதைத் தமிழில் தெரிவிக்கிறது.
- source_word: μου τῇ ἀπιστίᾳ
  choice: என் நம்பிக்கையின்மையில் எனக்கு
  rationale: ἀπιστία குறிக்கும் அவநம்பிக்கை அல்லது குறைவான நம்பிக்கை என்ற பொருள் பரப்பைத் தக்கவைத்து, நம்பிக்கையின்மைக்கே உதவுமாறு கேட்பதாகத் தமிழில் தவறாகப் புரியாதபடி செய்கிறது.
theological_decisions:
- issue: Πιστεύω என்பதற்கும் ἀπιστίᾳ என்பதற்கும் இடையிலான பதற்றம்
  choice: “நான் நம்புகிறேன்; என் நம்பிக்கையின்மையில் எனக்கு உதவுங்கள்” என்று முரண்பாட்டுத் தோற்றத்தைத் தக்கவைத்தல்
  alternative: “நான் நம்புகிறேன்; என் நம்பிக்கைக் குறைவு நீங்க உதவுங்கள்”
  rationale: தந்தையிடம் உண்மையான நம்பிக்கையும் இன்னும் நீங்காத நம்பிக்கையின்மையும் ஒரே நேரத்தில் இருப்பதை உரை வெளிப்படுத்துகிறது. அதை விளக்கி சமரசப்படுத்தாமல், வேண்டுகோளின் இறையியல் மற்றும் உணர்ச்சி சார்ந்த பதற்றம் கேட்குமாறு விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உரக்கக் கூவி’ உணர்ச்சி மற்றும் ஒலிவலிமையைப் பாதுகாக்கிறது; ‘உதவுங்கள்’ இயல்பான மரியாதை வேண்டுகோளாக உள்ளது. மூலத்தில் உள்ள நம்பிக்கை–நம்பிக்கையின்மை பதற்றம் விளக்கித் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
