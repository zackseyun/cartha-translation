source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: ta
  text: “இப்படிப்பட்ட குழந்தைகளில் ஒருவரை[a] என் பெயரால் ஏற்றுக்கொள்கிறவர்[b] என்னை ஏற்றுக்கொள்கிறார். என்னை ஏற்றுக்கொள்கிறவர் என்னை அல்ல, என்னை அனுப்பியவரையே ஏற்றுக்கொள்கிறார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்படிப்பட்ட ஒரு குழந்தையை.” கிரேக்கத்தில் சொல்லுக்கு சொல், “இப்படிப்பட்ட குழந்தைகளில் ஒருவரை” என்று உள்ளது; இது குறிப்பாக ‘இந்தக் குழந்தைகள்’ என்பதைவிட, இந்த வகையைச் சேர்ந்த ஒரு குழந்தையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த வசனம் முழுவதிலும் “ஏற்றுக்கொள்கிறார்” என்பதற்குப் பதிலாக “வரவேற்கிறார்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ஒவ்வொரு கூறிலும் ஒரே வினைச்சொல்லே திரும்ப வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: ஏற்றுக்கொள்கிறவர்
  rationale: ἄν உடன் வரும் தொடர்புப்பெயர் பொதுவான, வரையறுக்கப்படாத நிபந்தனையைச் சுட்டுகிறது. தமிழில் ‘எவர் ... அவர்’ எனக் கடினமாக அமைப்பதைவிட, ‘...கிறவர்’ என்ற அமைப்பு இயல்பாக அதே பொதுப்பொருளைத் தருகிறது.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: இப்படிப்பட்ட சிறுபிள்ளைகளில் ஒருவரை
  rationale: ἓν ... παιδίων என்பதன் பகுதிப்பொருளையும், τοιούτων என்பதன் ‘இப்படிப்பட்ட/இந்த வகையான’ என்ற பண்புப்பொருளையும் காக்கிறது. சூழலில் ஒரு சிறுபிள்ளையை நபராக வரவேற்பதால், இயல்பான தமிழுக்காக ‘ஒருவரை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δέξηται / δέχεται / δέχηται
  choice: ஏற்றுக்கொள்கிறவர் / ஏற்றுக்கொள்கிறார்
  rationale: δέχομαι என்பது ஏற்றுக்கொள், வரவேல் ஆகிய பொருள்களை உடையது. வசனத்தின் ஒவ்வொரு கூறிலும் ஒரே தமிழ்ச் சொல்லைத் திரும்பப் பயன்படுத்தி, சிறுபிள்ளை–இயேசு–அனுப்பியவர் என்ற தொடர்பை வெளிப்படையாகக் காக்கிறது.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரால்
  rationale: இயேசுவின் பெயரை முன்னிட்டு, அவருடனான தொடர்பின் அடிப்படையில் ஏற்றுக்கொள்வதைச் சுருக்கமாகவும் இறையியல் ஒலிநயத்துடனும் தெரிவிக்கிறது.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: என்னை அல்ல ... ஏற்றுக்கொள்கிறார்
  rationale: οὐκ ... ἀλλά என்ற வலுவான முரண்பாட்டை ‘என்னை மட்டுமல்ல’ என்று விளக்கிப் போக்காமல் அப்படியே காக்கிறது; தமிழில் எதிர்மறைத் தொடர் தெளிவாக அமைய வினைச்சொல் இறுதியில் வருகிறது.
- source_word: τὸν ἀποστείλαντά με
  choice: என்னை அனுப்பியவரையே
  rationale: பெயராக்கப்பட்ட கிரேக்கப் பங்கேற்புவினையை இயல்பான தமிழில் ‘அனுப்பியவர்’ என வழங்குகிறது. ‘-ஏ’ வலியுறுத்தல் ἀλλά உருவாக்கும் இறுதி எதிர்மாற்றைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘என்னை அல்ல, என்னை அனுப்பியவரையே’ என்ற இறுதி முரண்பாட்டின் வலிமை
  choice: மூலத்தின் நேரடியான முரண்பாட்டைத் தக்கவைத்தல்
  alternative: ‘என்னை மட்டுமல்ல, என்னை அனுப்பியவரையும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கம் ‘என்னை அல்ல, ஆனால் என்னை அனுப்பியவரை’ என்றே கூறுகிறது. ‘மட்டுமல்ல ... அவரையும்’ என்பது உட்கருத்தை விளக்கினாலும், மூலத்தின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் மென்மையாக்கிவிடும். ஆகவே அதை முதன்மை உரையில் தீர்த்துவிடாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சிறுபிள்ளை’ என்பது παιδίον என்பதன் குழந்தைப் பொருளைத் தெளிவாக்குகிறது; ‘ஒருவர்’ குழந்தையை மரியாதையுடன் நபராகக் குறிப்பிடுகிறது. ஒரே வினைச்சொல்லின் மறுமொழியும் இறுதி முரண்பாடும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
