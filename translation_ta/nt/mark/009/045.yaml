  terminology: ‘கெஹென்னா’ என்ற ஒலிபெயர்ப்பு γέεννα-வின் தனித்த வரலாற்று மற்றும் தீர்ப்பு சார்ந்த குறிப்பைத் தக்கவைக்கிறது. அடிக்குறிப்பில் ‘நரகம்’ மாற்றுவழியாகவும் இன்னோம் பள்ளத்தாக்குத் தொடர்பும் பொருத்தமாகத் தரப்பட்டுள்ளன. ‘மேலானது’ καλόν ἐστίν என்பதன் ஒப்பீட்டுப் பொருளை நன்றாகக் கொடுக்கிறது.
