id: MRK.9.45
reference: Mark 9:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: ta
  text: உன் கால் உன்னை இடறச் செய்தால், அதை வெட்டிப்போடு. இரண்டு கால்களுடன் கெஹென்னாவுக்குள்[a] எறியப்படுவதைவிட, கால் ஊனமுற்ற நிலையில் வாழ்வுக்குள் நுழைவது உனக்கு மேலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நரகத்துக்குள்.” கெஹென்னா என்ற கிரேக்கச் சொல் இன்னோம் பள்ளத்தாக்கையும், அதனுடன் தொடர்புடைய இறைத் தீர்ப்பையும் நினைவூட்டுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: இடறச் செய்தால்
  rationale: பாவம் செய்யத் தூண்டுதல் அல்லது வீழ்ச்சிக்கு வழிவகுத்தல் என்ற பொருளை உள்ளடக்கிக்கொண்டே, கிரேக்கச் சொல்லிலுள்ள ‘இடறுதல்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀπόκοψον
  choice: வெட்டிப்போடு
  rationale: வலிமையான இறந்தகால ஏவல் வடிவத்தின் நேரடியான, அதிர்ச்சியூட்டும் கட்டளையை மென்மையாக்காமல் வெளிப்படுத்துகிறது.
- source_word: καλόν ἐστίν
  choice: மேலானது
  rationale: ἢ என்பதுடன் வரும் ஒப்பீட்டுக் கட்டமைப்பில் ‘நல்லது’ என்பதைவிட ‘மேலானது’ என்பது இயல்பான பொருளைத் தருகிறது.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: வாழ்வுக்குள் நுழைவது
  rationale: முடிவுக்கால வாழ்வைக் குறிக்கும் உருவகத்தைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘நித்திய’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: χωλὸν
  choice: கால் ஊனமுற்ற நிலையில்
  rationale: நடக்க இயலாமை அல்லது காலில் ஏற்பட்ட ஊனம் என்ற குறிப்பான பொருளை மரியாதையான, இயல்பான நவீன தமிழில் தருகிறது.
- source_word: βληθῆναι
  choice: எறியப்படுவது
  rationale: βάλλω என்பதன் செயப்பாட்டு infinitive வடிவத்திலுள்ள வலுவான இயக்கத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: γέενναν
  choice: கெஹென்னா
  rationale: இன்னோம் பள்ளத்தாக்கையும் இறைத் தீர்ப்பையும் நினைவூட்டும் குறிப்பான கிரேக்கப் பெயரைப் பாதுகாக்கிறது; பொதுவான விளக்கமான ‘நரகம்’ என்பதை முதன்மை உரையில் பதிலீடு செய்யவில்லை.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: இரண்டு கால்களுடன்
  rationale: ஒரு கால் இல்லாத நிலைக்கு எதிராக இரு கால்களும் இருப்பதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தீர்ப்பின் சூழலில் γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலச்சொல் மறுமையைக் குறிக்கும் பொதுச்சொல் அல்ல; வரலாற்று மற்றும் இறுதித் தீர்ப்பு சார்ந்த தொடர்புகளைக் கொண்ட குறிப்பான பெயர். ஆகவே முதன்மை உரையில் ஒலிபெயர்ப்பு வைக்கப்பட்டு, மரபான விளக்கச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இடறச் செய்தால்’ என்பது மூல உருவகத்தைப் பாதுகாக்கிறது; ‘வெட்டிப்போடு’ கட்டளையின் தீவிரத்தைத் தணிக்கவில்லை. ‘கால் ஊனமுற்ற நிலையில்’ என்பது χωλός என்பதைக் களங்கப்படுத்தாத இயல்பான மொழியில் தருகிறது.
