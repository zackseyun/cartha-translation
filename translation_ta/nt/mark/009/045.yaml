  source_fidelity: மூலத்தின் உருவகமான σκανδαλίζῃ-யை ‘உன்னை இடறச் செய்தால்’ எனப் பாதுகாக்கிறது. ἀπόκοψον-இன் வலுவான கட்டளை, ‘வாழ்வுக்குள் நுழைதல்,’ χωλός-இன் கால்சார்ந்த ஊனநிலை, இரு கால்களுடன் எறியப்படுதல், மற்றும் γέεννα ஆகிய அனைத்தும் பொருளுக்கும் வாக்கிய உறவுகளுக்கும் உண்மையாக உள்ளன. ‘நித்திய’ போன்ற மூலத்தில் இல்லாத விரிவாக்கம் சேர்க்கப்படவில்லை.
