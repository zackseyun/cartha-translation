id: MRK.9.47
reference: Mark 9:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: ta
  text: உன் கண் உன்னை இடறச் செய்தால், அதை எறிந்துவிடு. இரண்டு கண்களுடன் கெஹென்னாவுக்குள்[a] எறியப்படுவதைவிட, ஒற்றைக் கண்ணுடன் கடவுளின் அரசாட்சிக்குள் நுழைவது உனக்கு நல்லது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நரகம்.” கிரேக்கத்தில் “கெஹென்னா” என்று உள்ளது. இப்பெயர் இன்னோம் பள்ளத்தாக்கில் வேரூன்றியது; இறுதிக்காலத் தீர்ப்பைக் குறிக்கவும் பயன்படுத்தப்பட்டது.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: இடறச் செய்தால்
  rationale: ‘இடறச் செய்தல்’ என்பது கிரேக்கச் சொல்லிலுள்ள உருவகத்தைத் தக்கவைக்கிறது; அதேவேளையில், அதை ‘பாவம் செய்யச் செய்தல்’ என்று மட்டும் குறுக்கிவிடாமல் இச்சூழலின் ஒழுக்க மற்றும் ஆன்மிக எச்சரிக்கையையும் இயல்பாக உணர்த்துகிறது.
- source_word: ἔκβαλε
  choice: எறிந்துவிடு
  rationale: ἐκβάλλω என்பதன் ‘வெளியே எறிதல்’ என்ற வலிமையான கட்டளையை இயல்பான நவீன தமிழில் தருகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘பிடுங்கு’ என்ற செயலைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: καλόν
  choice: உனக்கு நல்லது
  rationale: καλόν என்பதன் அடிப்படைப் பொருளான ‘நல்லது’ என்பதைத் தக்கவைத்து, ἢ (‘விட’) அமைப்புடன் தமிழில் ஒப்பீட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μονόφθαλμον
  choice: ஒற்றைக் கண்ணுடன்
  rationale: ‘ஒரே ஒரு கண் உடையவனாக’ என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; வசனத்தின் உடல்சார்ந்த தீவிரமான உருவகத்தையும் காக்கிறது.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சி
  rationale: βασιλεία என்பதிலுள்ள ஆட்சி/அரசுரிமை சார்ந்த பரப்பைத் தக்கவைத்து, τοῦ θεοῦ என்பதை வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: βληθῆναι
  choice: எறியப்படுவது
  rationale: βάλλω என்பதன் செயலப்பாட்டு வலிமையையும் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: γέενναν
  choice: கெஹென்னா
  rationale: கிரேக்கத்தில் உள்ள குறிப்பிட்ட தீர்ப்புச் சொல்லைப் பொதுவான ‘நரகம்’ என்ற சொல்லுக்குள் கரைக்காமல், அதன் வரலாற்று மற்றும் இறுதிக்காலத் தீர்ப்பு சார்ந்த தனித்தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தீர்ப்புச் சூழலில் γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலவசனம் பாதாளத்தையோ தண்டனையையோ குறிக்கும் பொதுச் சொல்லைப் பயன்படுத்தாமல் γέεννα என்ற குறிப்பிட்ட சொல்லைப் பயன்படுத்துகிறது. எனவே பிரதான உரையில் அதை ஒலிபெயர்த்து, வாசகர்களுக்குப் பரிச்சயமான ‘நரகம்’ என்பதை அடிக்குறிப்பில் மாற்றாகத் தருவது வேறுபட்ட வேதாகமத் தீர்ப்பு மொழியை ஒன்றாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இடறச் செய்தால்’ என்ற சொற்றொடர் மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; ‘எறிந்துவிடு’ என்பது கிரேக்கத்தில் இல்லாத ‘பிடுங்கு’ என்ற கூடுதல் கருத்தைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு அதன் உள்ளடக்கத்துக்கேற்றபடி ‘கெஹென்னா’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
