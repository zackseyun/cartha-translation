source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: ta
  text: அந்த ஆவி கூக்குரலிட்டு, அவனைக் கடுமையாக வலிப்புக்குள்ளாக்கிவிட்டு[a] வெளியேறியது. அவன் இறந்தவனைப் போல் ஆனான்; அதனால் பலர், “அவன் இறந்துவிட்டான்” என்று சொல்லிக்கொண்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைக் கடுமையான வலிப்புக்குள்ளாக்கிவிட்டு.”
    reason: lexical_alternative
  - marker: b
    text: அவன் இறந்துவிட்டான் என்பது பலருடைய கூற்று; உரையாளர் அவன் “இறந்தவனைப் போல்” ஆனதாகவே கூறுகிறார்.
    reason: theological_clarification
lexical_decisions:
- source_word: κράξας
  choice: கூக்குரலிட்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இயல்பான தமிழ் வினையெச்சமாகத் தருகிறது; குரலின் தன்மையை ‘அலறல்’ அல்லது ‘கீச்சிடல்’ என்று தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
- source_word: πολλὰ σπαράξας
  choice: அவனை மிகக் கடுமையாக வலிக்கச் செய்துவிட்டு
  rationale: பேயோட்டும் இச்சூழலில் σπαράσσω என்பது உடலைக் கிழிப்பதை அல்ல, கடுமையான வலிப்பு அல்லது துடிப்பை உண்டாக்குவதைக் குறிக்கிறது. πολλὰ இங்கு தீவிரத்தை உணர்த்துகிறது; ‘அவனை’ என்பது சூழலிலிருந்து தெளிவாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἐξῆλθεν
  choice: வெளியேறியது
  rationale: மறைமுக எழுவாய் முன்சூழலில் குறிப்பிடப்பட்ட ஆவி என்பதால், தமிழ் மொழியில் இயல்பாக ‘அந்த ஆவி ... வெளியேறியது’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: அவன் இறந்தவனைப்போல் ஆனான்
  rationale: ὡσεὶ என்ற ஒப்பீட்டைத் தக்கவைத்து, உண்மையில் இறந்தான் என்று உரையாளர் உறுதிப்படுத்தாதபடி தோற்றத்தையும் நிலையையும் வெளிப்படுத்துகிறது.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: அதனால் பலர் ... என்று சொல்லிக்கொண்டிருந்தார்கள்
  rationale: விளைவை இயல்பாகக் காட்டுகிறது. τοὺς πολλούς என்பதற்கு ‘பலர்’ எனவும், நிகழ்ந்துகொண்டிருந்த கூட்டத்தின் எதிர்வினையை λέγειν என்பதற்கு ‘சொல்லிக்கொண்டிருந்தார்கள்’ எனவும் தருகிறது.
- source_word: ὅτι ἀπέθανεν
  choice: “அவன் இறந்துவிட்டான்”
  rationale: கூட்டத்தாரின் முடிவை இயல்பான நேர்கூற்றாகத் தருகிறது. இறப்பு நிகழ்ந்துவிட்டதாக அவர்கள் கருதியதை நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சிறுவன் உண்மையில் இறந்தானா, அல்லது இறந்தவனைப்போல் தோன்றினானா?
  choice: உரையாளர் அவன் ‘இறந்தவனைப்போல்’ ஆனதாகக் கூறுகிறார்; அவன் இறந்துவிட்டதாகக் கூறுவது கூட்டத்தாரின் கருத்து.
  alternative: அவன் தற்காலிகமாக உண்மையில் இறந்தான்; அல்லது அவன் இறந்தாரா என்பதை வசனம் முற்றிலும் தீர்மானிக்காமல் விடுகிறது.
  rationale: ὡσεὶ (‘போல்/என்பதுபோல்’) என்ற ஒப்பீடும், இறந்தான் என்பது பலருடைய கூற்றாக அமைந்திருப்பதும், உண்மையான மரணத்தை உரையாளர் நேரடியாக உறுதிப்படுத்தவில்லை என்பதைக் காட்டுகின்றன. மொழிபெயர்ப்பு இந்த வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘வலிக்கச் செய்துவிட்டு’ என்பது இச்சூழலில் உடல் வலிப்பை இயல்பாகக் குறிக்கிறது; ‘இறந்தவனைப்போல்’ என்பது மூலத்தின் ஒப்பீட்டையும் அதன் தீர்க்கப்படாத பதற்றத்தையும் காக்கிறது.
