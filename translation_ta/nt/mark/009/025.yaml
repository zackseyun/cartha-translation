source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: ta
  text: 'மக்கள் கூட்டம் வேகமாகத் திரண்டு வருவதை இயேசு கண்டபோது[a], அவர் அந்த அசுத்த ஆவியைக் கடிந்துகொண்டு அதனிடம், “பேச இயலாததும் கேட்க இயலாததுமான ஆவியே, நான் உனக்குக் கட்டளையிடுகிறேன்: இவனைவிட்டு வெளியேறு; இனி ஒருபோதும் இவனுக்குள் நுழையாதே” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்கள் கூட்டம் ஓடிவந்து ஒன்றுகூடுவதை.’ கிரேக்க வினைச்சொல் மக்கள் விரைவாக ஒரே இடத்தில் கூடிவருவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: இயேசு கண்டபோது
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கான காலச் சூழலைக் காட்டுகிறது. δέ இங்கு மென்மையான கதைத் தொடர்பாக இருப்பதால், தமிழில் தேவையற்ற எதிர்மறைத் திருப்பை உருவாக்கும் ‘ஆனால்’ சேர்க்கப்படவில்லை.
- source_word: ἐπισυντρέχει ὄχλος
  choice: மக்கள் கூட்டம் வேகமாகத் திரண்டு வருவதை
  rationale: ἐπισυντρέχω மக்கள் பல திசைகளிலிருந்து விரைவாக ஒன்றுகூடுவதை உணர்த்துகிறது; நிகழ்ந்துகொண்டிருந்த செயலைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டு
  rationale: ἐπιτιμάω அதிகாரத்துடன் கண்டித்தல் அல்லது அதட்டுதல் என்ற வலிமையைக் கொண்டது; நற்செய்தி நூல்களின் பேயோட்டும் சூழலில் ‘கடிந்துகொண்டு’ அந்த வலிமையை இயல்பாகத் தருகிறது.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: அந்த அசுத்த ஆவியை
  rationale: ‘அசுத்த ஆவி’ என்பது ἀκάθαρτος என்பதன் சடங்கு மற்றும் ஒழுக்க அசுத்தத் தொடர்புகளைப் பாதுகாக்கிறது; அதை வெறும் நோயாக மாற்றவில்லை.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: பேச இயலாததும் கேட்க இயலாததுமான ஆவியே
  rationale: ἄλαλος மற்றும் κωφός ஆகிய இரு தனித்த பண்புகளையும் ஒன்றாக்காமல் வைத்திருக்கிறது. நவீன தமிழில் புரிந்துகொள்ள எளிதான, இழிவுபடுத்தாத சொல்லமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: நான் உனக்குக் கட்டளையிடுகிறேன்
  rationale: ἐπιτάσσω அதிகாரமிக்க நேரடிக் கட்டளையைக் குறிக்கிறது. தமிழில் வெளிப்படையாக வரும் ‘நான்’ என்பது மூலத்தின் ἐγώ வலியுறுத்தலை இயல்பாகச் சுமக்கிறது.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: இவனைவிட்டு வெளியேறு
  rationale: கட்டளை வினையின் உடனடியான வலிமையையும், ஆவி அந்த மனிதனிடமிருந்து பிரிந்து செல்ல வேண்டும் என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: இனி ஒருபோதும் இவனுக்குள் நுழையாதே
  rationale: μηκέτι எதிர்காலத்தில் மீண்டும் நுழைவதைத் தீர்மானமாகத் தடைசெய்கிறது; ‘இனி ஒருபோதும்’ அதன் முழுமையான தடையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: அசுத்த ஆவியும் இயேசுவின் அதிகாரமும்
  choice: πνεῦμα ἀκάθαρτον என்பதை ‘அசுத்த ஆவி’ என்றும், இயேசுவின் சொற்களை ‘கடிந்துகொண்டு’ மற்றும் ‘கட்டளையிடுகிறேன்’ என்ற அதிகார மொழியிலும் மொழிபெயர்த்தல்
  alternative: ‘தீய ஆவி’ அல்லது ‘அவர் அதனிடம் கடுமையாகப் பேசினார்’
  rationale: மூல உரை நேரடியாக அழைக்கப்பட்டு இயேசுவின் கட்டளைக்குக் கீழ்ப்படும் தனிப்பட்ட ஆவியைச் சித்தரிக்கிறது. மொழிபெயர்ப்பு இதை நோய் பற்றிய பொதுவான மொழியாக மென்மைப்படுத்தாமலும், உரைக்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்காமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. நேரடி பேச்சில் ஆவியை ஒருமையில் ‘உனக்கு’ என்று அழைப்பது மூலத்தின் நேரடி முகவரியைப் பாதுகாக்கிறது; ‘இவன்’ என்பது சூழலில் உள்ள சிறுவனை இயல்பாகச் சுட்டுகிறது.
