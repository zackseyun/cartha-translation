source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் தொடர்ந்து சொன்னார்: “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இங்கே நிற்கிறவர்களில் சிலர், தேவனுடைய ராஜ்யம் வல்லமையுடன் வந்திருப்பதைக் காணும்வரை, நிச்சயமாக மரணத்தைச் சுவைக்கமாட்டார்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மரணத்தைச் சுவைத்தல்” என்பது ‘மரணத்தை அனுபவித்தல்’ அல்லது ‘இறத்தல்’ என்று பொருள்படும் மரபுத்தொடர். “தேவனுடைய ராஜ்யம் வல்லமையுடன் வந்திருப்பது” எந்த நிகழ்வைக் குறிக்கிறது என்பதை இவ்வசனம் குறிப்பிடவில்லை.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து சொன்னார்
  rationale: இறந்தகால முற்றுப்பெறா வினையின் தொடர்நிலைத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: வாக்கின் உறுதியையும் தீவிரத்தையும் காட்டும் அறிமுகச் சூத்திரத்தை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: இங்கே நிற்கிறவர்களில் சிலர்
  rationale: அங்கிருந்தவர்களில் ஒரு பகுதியினரைக் குறிக்கும் பகுதிப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: நிச்சயமாக மரணத்தைச் சுவைக்கமாட்டார்கள்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும், ‘மரணத்தைச் சுவைத்தல்’ என்ற மூல உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἕως ἂν ἴδωσιν
  choice: காணும்வரை
  rationale: எதிர்கால வரம்பைக் குறிக்கும் காலத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: இறைவனுடைய அரசு
  rationale: βασιλεία என்பதன் அரசாட்சி/அரசு பரப்பைத் தாங்கும், பொதுவாகப் புரியும் கண்ணியமான தமிழ் சொற்றொடர்.
- source_word: ἐληλυθυῖαν
  choice: வந்திருப்பதை
  rationale: வருகை நிகழ்ந்து அதன் விளைவு நிலைத்திருப்பதைக் குறிக்கும் நிறைவு வினையெச்சத்தின் பொருளைத் தமிழில் பாதுகாக்கிறது.
- source_word: ἐν δυνάμει
  choice: வல்லமையுடன்
  rationale: வெளிப்படும் தெய்வீக வல்லமையைச் சுட்டுகிறது; நிகழ்வின் தன்மையை மேலதிகமாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: ‘இறைவனுடைய அரசு வல்லமையுடன் வந்திருப்பது’ எந்த நிகழ்வைக் குறிக்கிறது?
  choice: எந்த ஒரு நிகழ்வுடனும் மொழிபெயர்ப்பில் அடையாளப்படுத்தாமல் விடப்பட்டுள்ளது.
  alternative: மறுரூபமாதல், உயிர்த்தெழுதல்/உயர்த்தப்படுதல், பெந்தெகொஸ்தே, எருசலேமின் நியாயத்தீர்ப்பு, அல்லது அரசின் இறுதி நிறைவு என்று குறிப்பாக்குதல்.
  rationale: கிரேக்க வாசகம் குறிப்பிட்ட நிகழ்வை வெளிப்படையாகச் சொல்லவில்லை; ஆகவே அதன் பொருளியல் திறப்பும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் வலியுறுத்தப்பட்ட மறுப்பு, மரணச் சுவை உருவகம், நிறைவு நிலை, மற்றும் நிகழ்வைக் குறிப்பிடாத இறையியல் திறப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
