- from: 'அவர் அவர்களிடம் தொடர்ந்து சொன்னார்: “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இங்கே நிற்கிறவர்களில் சிலர், இறைவனுடைய அரசு வல்லமையுடன் வந்திருப்பதைக் காணும்வரை, நிச்சயமாக மரணத்தைச் சுவைக்கமாட்டார்கள்.[a]”'
  to: 'அவர் அவர்களிடம் தொடர்ந்து சொன்னார்: “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இங்கே நிற்கிறவர்களில் சிலர், தேவனுடைய ராஜ்யம் வல்லமையுடன் வந்திருப்பதைக் காணும்வரை, நிச்சயமாக மரணத்தைச் சுவைக்கமாட்டார்கள்.[a]”'
  rationale: “தேவனுடைய ராஜ்யம்” replaces “இறைவனுடைய அரசு” for a more accurate and idiomatic rendering of βασιλεία τοῦ θεοῦ. All other wording is retained because it faithfully preserves the Greek aspect, emphatic negation, idiom, and deliberate ambiguity concerning the kingdom’s coming in power.
