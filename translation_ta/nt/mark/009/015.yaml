  to: உடனே, கூட்டத்தினர் அனைவரும் அவரைக் கண்டதும் பெரிதும் திகைத்துப்போனார்கள்[a]; அவரிடம் ஓடிவந்து அவரை வாழ்த்தினார்கள்.
