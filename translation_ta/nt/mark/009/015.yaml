id: MRK.9.15
reference: Mark 9:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: ta
  text: உடனே, கூட்டத்தினர் அனைவரும் அவரைக் கண்டதும் பெரிதும் திகைத்துப்போனார்கள்[a]; அவரிடம் ஓடிவந்து அவரை வாழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் ஆச்சரியமடைந்தார்கள்,” “பெரிதும் மலைத்துப்போனார்கள்,” அல்லது “கலக்கமடைந்தார்கள்.” சூழலைப் பொறுத்து, கிரேக்க வினைச்சொல் தீவிரமான வியப்பு, திகைப்பு அல்லது கலக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் வேகமான கதைநடையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டத்தினர் அனைவரும்
  rationale: கூட்டம் முழுவதையும் குறிக்கும் பொருளைப் பாதுகாப்பதோடு, தொடர்ந்து வரும் பன்மை வினைகளுடன் தமிழில் இயல்பாகப் பொருந்துகிறது.
- source_word: ἰδόντες αὐτόν
  choice: அவரைக் கண்டதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மைச் செயலுக்கான உடனடி காலச் சூழலையும் தூண்டுதலையும் காட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἐξεθαμβήθησαν
  choice: பெரிதும் திகைத்துப்போனார்கள்
  rationale: வியப்பு, திடுக்கிடல், கலக்கம் ஆகியவற்றை உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் தீவிரத்தை, காரணத்தை ஊகிக்காமல் வெளிப்படுத்துகிறது.
- source_word: προστρέχοντες
  choice: அவரிடம் ஓடிவந்து
  rationale: இயேசுவை நோக்கி அவர்கள் ஆர்வத்துடன் ஓடிவந்த இயக்கத்தை உயிரோட்டமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἠσπάζοντο αὐτόν
  choice: அவரை வாழ்த்தினார்கள்
  rationale: ἀσπάζομαι என்பதன் பொதுவான, நடுநிலையான வாழ்த்துதல் அல்லது வரவேற்றல் என்ற பொருளை இச்சூழலில் தருகிறது.
theological_decisions:
- issue: ἐξεθαμβήθησαν என்பதில் கூட்டத்தினரின் எதிர்வினையின் தன்மை
  choice: தீவிரமான திகைப்பு அல்லது வியப்பு
  alternative: அவர்கள் அச்சமடைந்தார்கள்; அல்லது மோசேயை நினைவூட்டும் ஒளிவீசும் தோற்றத்தால் வியந்தார்கள்
  rationale: அவர்கள் இயேசுவைக் கண்டபோது தீவிரமாக எதிர்வினையாற்றி, பின்னர் அவரிடம் ஓடிவந்து வாழ்த்தினார்கள் என்று மட்டுமே வசனம் கூறுகிறது. காரணமாக அச்சத்தையோ அற்புத ஒளிவீச்சையோ உரை குறிப்பிடாததால் அவற்றை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் கண்ணியமான வேதாகமக் கதைநடையுடனும் மொழிபெயர்க்கப்பட்டது. “மக்கள் கூட்டத்தினர் அனைவரும்” என்பது கிரேக்கத்தின் முழுமையையும் பன்மைச் செயல்களையும் இயல்பாக இணைக்கிறது; “திகைத்துப்போனார்கள்” என்பது உணர்ச்சியின் தீவிரத்தைப் பாதுகாத்து அதன் காரணத்தைத் தீர்மானிக்காமல் விடுகிறது.
