source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: ta
  text: 'அப்போது மேகம் ஒன்று வந்து அவர்கள்மேல் நிழலிட்டது. அந்த மேகத்திலிருந்து ஒரு குரல் வந்தது: “இவர் என் அன்புக்குரிய மகன்; இவருக்குச் செவிகொடுங்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர் சொல்வதைக் கேளுங்கள்.” இக்கட்டளை வெறுமனே ஒலியைக் கேட்பதை அல்ல, கவனமாகக் கேட்டு ஏற்றுக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: மேகம் ஒன்று வந்து
  rationale: γίνομαι இங்கு மேகத்தின் திடீர் வருகை அல்லது தோற்றத்தை நிகழ்வாகக் குறிக்கிறது. ‘வந்து’ என்பது இயல்பான தமிழில் அந்த நிகழ்வுத்தன்மையைத் தக்கவைக்கிறது; ‘மேகம் உண்டாயிற்று’ என்ற சொற்சொறான ஆனால் இயல்பற்ற நடையைத் தவிர்க்கிறது.
- source_word: νεφέλη
  choice: மேகம்
  rationale: மூலச்சொல்லின் நேரான பொருள். சூழலில் இறைப் பிரசன்னத்தை நினைவூட்டினாலும், அந்த விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: அவர்கள்மேல் நிழலிட்டது
  rationale: ἐπισκιάζω என்பதன் நிழலிடுதல் அல்லது சூழ்ந்துகொள்ளுதல் என்ற உருவகத்தைத் தக்கவைக்கும் இயல்பான தமிழ். ‘அவர்கள்மேல்’ என்பது தத்திவின் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: அந்த மேகத்திலிருந்து ஒரு குரல்
  rationale: φωνή இங்கு கருத்துள்ள வானக உரையைக் குறிக்கிறது; ஆகவே ‘குரல்’ பொருத்தமானது. ἐκ என்பதன் உள்ளிருந்து வெளிவரும் திசையை ‘மேகத்திலிருந்து’ காட்டுகிறது.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: என் அன்புக்குரிய மகன்
  rationale: ‘அன்புக்குரிய’ என்பது ἀγαπητός என்பதன் நேசத்திற்குரியவர் என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘அன்பு மகன்’ என்பதில் உருவாகக்கூடிய ‘அன்புள்ள மகன்’ என்ற வேறு புரிதலைத் தவிர்க்கிறது.
- source_word: ἀκούετε αὐτοῦ
  choice: இவருக்குச் செவிகொடுங்கள்
  rationale: ἀκούω இங்குக் கவனமாகக் கேட்டு ஏற்றுக்கொள்ளும் கட்டளையைக் குறிக்கிறது. ‘செவிகொடுங்கள்’ வெறும் ஒலி கேட்டலைவிட வலிமையானது; அதே நேரத்தில் மூலத்தில் நேரடியாக இல்லாத ‘கீழ்ப்படியுங்கள்’ என்று பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் அடையாளத்தை அறிவிக்கும் இறைக் குரல்
  choice: “இவர் என் அன்புக்குரிய மகன்” என்ற நேரடி அறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: விளக்கமாக ‘இவர் நான் நேசிக்கும் என் மகன்’ என்று விரித்துரைத்தல்.
  rationale: கிரேக்க உரை இயேசுவை தேவனுடைய மகனாக நேரடியாக அறிவிக்கிறது. மொழிபெயர்ப்பு அந்தக் கிறிஸ்துவியல் வலிமையைத் தக்கவைத்து, உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ἀκούετε αὐτοῦ என்பதன் கட்டளை வலிமை
  choice: “இவருக்குச் செவிகொடுங்கள்”
  alternative: “இவர் சொல்வதைக் கேளுங்கள்” அல்லது “இவருக்குக் கீழ்ப்படியுங்கள்”
  rationale: இந்தக் கட்டளை கவனத்துடன் கேட்டு அதற்குச் செவிசாய்ப்பதை உள்ளடக்குகிறது. ‘செவிகொடுங்கள்’ இரு அம்சங்களையும் திறந்தவாறு தக்கவைக்கிறது; ‘கீழ்ப்படியுங்கள்’ மட்டும் என்று பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போது’ நிகழ்வின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. ஒரே வசனத்தில் மேகத்தைக் குறிக்கும் தொடர்பு தெளிவாக இருக்க ‘அந்த மேகம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
