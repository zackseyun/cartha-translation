  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ta
  text: அங்கே[a] அவர்களுடைய புழு சாவதில்லை; நெருப்பும் அணைவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில்—நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்ட்டிக்கஸ், வாட்டிக்கானஸ் பிரதிகள் உட்பட—மற்றும் தொடக்ககால காப்டிக் மொழிபெயர்ப்புகளில் காணப்படவில்லை. ஆனால் பைசாந்தியப் பெரும்பான்மைக் கையெழுத்து மரபிலும் லத்தீன் உரைமரபிலும் உள்ளது. வசனம் 48-இலும் வசனம் 44-இலும் உள்ள அதே சொற்களை நகலெழுத்தர் பின்னாளில் இங்கே சேர்த்திருக்க வாய்ப்புள்ளது.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: புழு
  rationale: அழுகும் பொருளைத் தின்னும் புழு அல்லது புழுப்பூச்சியைக் குறிக்கிறது. ஏசாயா 66:24 உடனான தொடர்பையும் தமிழில் இயல்பாகத் தக்கவைக்க ‘புழு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τελευτᾷ
  choice: சாவதில்லை
  rationale: τελευτάω என்பது ‘முடிவுக்கு வருதல்’ அல்லது ‘சாதல்’ என்று பொருள்படும். உயிருள்ள புழுவைக் குறிக்கும் இச்சூழலில், தொடரும் நிகழ்கால மறுப்பை இயல்பாக வெளிப்படுத்த ‘சாவதில்லை’ பயன்படுத்தப்பட்டது.
- source_word: σβέννυται
  choice: அணைவதில்லை
  rationale: σβέννυμι என்பது நெருப்பு அணைக்கப்படுதல் அல்லது அணைந்துபோதலைக் குறிக்கிறது. தமிழில் நெருப்பைப் பற்றி இயல்பாகவும் வலிமையாகவும் சொல்ல ‘அணைவதில்லை’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் தொடரும் மறுப்பும் இதனால் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: முடிவில்லாத நியாயத்தீர்ப்பைச் சுட்டும் உருவக மொழி
  choice: ‘புழு சாவதில்லை; நெருப்பும் அணைவதில்லை’ என்று மூல உருவகத்தை விளக்கமின்றித் தக்கவைத்தல்
  alternative: இந்த உருவகங்கள் குறிக்கும் தண்டனையின் தன்மையை மொழிபெயர்ப்பிலேயே விரிவாக விளக்குதல்
  rationale: வசனம் ஏசாயா 66:24-இன் உருவக மொழியைப் பயன்படுத்துகிறது; அதன் துல்லியமான இறையியல் விளைவை மொழிபெயர்ப்பு ஒருதலைப்பட்சமாகத் தீர்மானிக்காமல், மூலத்தின் வலிமையையும் பதற்றத்தையும் தக்கவைக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘அக்கினி’, ‘அவிவதில்லை’ போன்ற பழமையான வழிபாட்டு நடைக்குப் பதிலாக ‘நெருப்பு’, ‘அணைவதில்லை’ என்ற தற்போதைய இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டன. ‘அங்கே’ என்பது ὅπου என்பதன் இடத்தைக் குறிக்கும் தொடர்பைச் சுருக்கமாக வெளிப்படுத்துகிறது.
