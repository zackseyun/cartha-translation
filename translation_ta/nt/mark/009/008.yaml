  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: ta
  text: அவர்கள் திடீரென்று சுற்றிலும் பார்த்தபோது, தங்களுடன் இருந்த இயேசுவைத் தவிர வேறு யாரையும் இனி காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: திடீரென்று
  rationale: எதிர்பாராத உடனடி மாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: περιβλεψάμενοι
  choice: சுற்றிலும் பார்த்தபோது
  rationale: சுற்றிப் பார்த்தல் என்ற பொருளை இயல்பான தமிழ்ச் சார்பு வினை அமைப்பில் தருகிறது.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: வேறு யாரையும் காணவில்லை
  rationale: ‘இனி/அதற்குமேல் ஒருவரையும் காணவில்லை’ என்ற கருத்தைச் சூழலுக்கேற்ற தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: தங்களுடன் இயேசு மட்டும் இருக்கக் கண்டார்கள்
  rationale: விதிவிலக்கையும் ‘இயேசு மட்டும்’ என்ற வலியுறுத்தலையும், அவர் அவர்களுடன் இருந்தார் என்பதையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இயேசு மட்டும்’ என்ற வலியுறுத்தல்
  choice: இயேசு மட்டும்
  alternative: இயேசுவைத் தவிர
  rationale: μόνον என்பதன் வெளிப்படையான வலியுறுத்தலைப் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான நடையில், கிரேக்கச் சொற்றொடரின் திடீர் மாற்றமும் இயேசு மட்டுமே அவர்களுடன் இருந்தார் என்ற மையமும் காக்கப்பட்டுள்ளன.
