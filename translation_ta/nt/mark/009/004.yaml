  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: ta
  text: எலியா மோசேயுடன் அவர்களுக்குத் தோன்றினார்; அவர்கள் இருவரும் இயேசுவுடன் உரையாடிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: தோன்றினார்
  rationale: ὁράω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு ‘காணப்பட்டார்’ என்ற பொருளில் வந்து, இயல்பான தமிழில் ‘தோன்றினார்’ என வழங்கப்படுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: எலியா யாருக்குத் தோன்றினார் என்பதைக் காட்டும் வேற்றுமை உருபின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: σὺν Μωϋσεῖ
  choice: மோசேயுடன்
  rationale: σύν உடனிருப்பைக் குறிக்கிறது; ‘மோசேயுடன்’ என்பது சுருக்கமான, துல்லியமான தமிழ்.
- source_word: συλλαλοῦντες
  choice: உரையாடிக்கொண்டிருந்தார்கள்
  rationale: ஒருவருடன் ஒருவர் பேசிக்கொண்டிருக்கும் பரஸ்பரச் செயலைச் συλλαλέω குறிக்கிறது; தொடர்ந்துகொண்டிருந்த செயலைப் பங்கேற்பு வடிவமும் ἦσαν என்பதும் வெளிப்படுத்துகின்றன.
- source_word: τῷ Ἰησοῦ
  choice: இயேசுவுடன்
  rationale: συλλαλέω குறிக்கும் பரஸ்பர உரையாடலை தமிழில் ‘இயேசுவுடன்’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மறுரூப நிகழ்வில் எலியாவும் மோசேயும் தோன்றியதன் தன்மை
  choice: எலியா மோசேயுடன் தோன்றி இயேசுவுடன் உரையாடியதாக வசனத்தை நேரடியாக வழங்குதல்
  alternative: இது வெறும் காட்சித் தோற்றம் அல்லது அடையாளப் பிரதிநிதித்துவம் என்று விளக்குதல்
  rationale: கிரேக்கக் கதை அவர்களைத் தோன்றி இயேசுவுடன் உரையாடுபவர்களாக முன்வைக்கிறது. மொழிபெயர்ப்பு இதை வலுவிழக்கச் செய்யாமலும், உரையில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் இருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘பேசிக்கொண்டிருந்தார்கள்’ என்பதைக் காட்டிலும் பரஸ்பர உரையாடல் நுணுக்கத்தைத் தெளிவாகக் காக்க ‘உரையாடிக்கொண்டிருந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது. மூல வசனத்தில் இல்லாத அடிக்குறிப்பு சேர்க்கப்படவில்லை.
