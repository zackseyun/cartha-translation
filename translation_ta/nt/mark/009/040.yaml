  source_fidelity: மூலக் கிரேக்கத்தின் பொதுப்பொருள் தரும் ὃς, விளக்கத் தொடர்புடைய γάρ, ‘நமக்கு எதிராக’ (καθ’ ἡμῶν), மற்றும் எதிரிணையான ‘நம் பக்கம்’ (ὑπὲρ ἡμῶν) ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. முதல் நபர் பன்மைச் சுட்டு விரிவுபடுத்தப்படவில்லை.
  naturalness: “ஏனெனில், நமக்கு எதிராக இல்லாதவர் நம் பக்கம் இருக்கிறார்” என்பது நவீனத் தரத் தமிழில் தெளிவான, இயல்பான, சுருக்கமான எதிரிணை வாக்கியமாக உள்ளது. ‘இருக்கிறார்’ மனிதரைக் குறிக்கும் மரியாதை ஒருமைக்கு ஏற்றது.
  terminology: ‘நமக்கு எதிராக’ மற்றும் ‘நம் பக்கம்’ ஆகியவை மூலத்தின் எதிர்ப்பும் ஆதரவும் என்ற தொடர்பியல் மொழியை இயல்பாக வெளிப்படுத்துகின்றன. அடிக்குறிப்பு ὑπὲρ ἡμῶν-ன் ‘நமக்காக/நமது சார்பாக’ என்ற மாற்றுச் சாயலையும் சரியாகக் குறிக்கிறது.
