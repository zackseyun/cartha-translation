  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: ta
  text: ஏனெனில், நமக்கு எதிராக இல்லாதவர் நம் பக்கம் இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்காக இருக்கிறார்.” ὑπὲρ ἡμῶν என்ற கிரேக்கச் சொற்றொடர் “நமக்காக,” “நமது சார்பாக,” அல்லது “நம் பக்கம்” என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: இல்லாதவர்
  rationale: ὃς இங்கு பொதுவான, பெயர்ச்சொல் தன்மையுள்ள தொடர்புப்பெயராக வருகிறது. தமிழில் எதிர்மறை வினையெச்சத்துடன் ‘இல்லாதவர்’ என அமைப்பது ‘யார்...அவர்’ என்ற கனமான வடிவைத் தவிர்த்து பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த விளக்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: οὐκ ἔστιν
  choice: இல்லாதவர்
  rationale: எதிர்மறை இணைப்புவினை தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: καθ’ ἡμῶν
  choice: நமக்கு எதிராக
  rationale: κατά + மரபுவேற்றுமை இங்கு எதிர்ப்பு என்ற பொருளைத் தருகிறது; ‘நமக்கு எதிராக’ அதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நம் பக்கம்
  rationale: ὑπέρ + மரபுவேற்றுமை ‘ஆதரவாக / சார்பாக / பக்கத்தில்’ என்ற பொருளைக் கொள்ளலாம். எதிர்மறையான ‘நமக்கு எதிராக’ என்பதற்குச் சமநிலையான இயல்பான தமிழாக ‘நம் பக்கம்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐστιν
  choice: இருக்கிறார்
  rationale: மனிதரைக் குறிக்கும் எழுவாய்க்கேற்ற மரியாதை ஒருமை நிகழ்கால இணைப்புவினையாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘நமக்கு எதிராக / நம் பக்கம்’ என்பதன் தொடர்பியல் எல்லை
  choice: முதல் நபர் பன்மையான ‘நமக்கு’ மற்றும் ‘நம்’ என்பதை அப்படியே தக்கவைத்தல்
  alternative: ‘நமது பணிக்கு எதிராக இல்லாதவர் நம் பக்கம் இருக்கிறார்’ அல்லது ‘கடவுளுக்கு எதிராக இல்லாதவர் கடவுளின் பக்கம் இருக்கிறார்’
  rationale: கிரேக்கம் வெளிப்படையாக முதல் நபர் பன்மையைப் பயன்படுத்துகிறது. ‘நமது பணி’ அல்லது ‘கடவுள்’ என்று விரிவுபடுத்தாமல் இருப்பது வசனத்தின் சூழல்சார் மற்றும் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். மூலத்தின் சுருக்கமான எதிரிணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
