id: MRK.9.43
reference: Mark 9:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: ta
  text: உன் கை உன்னை இடறச் செய்தால்[a], அதை வெட்டிவிடு. இரண்டு கைகளுடன் கெஹென்னாவுக்குள்[b]—அணைக்க முடியாத நெருப்புக்குள்—போவதைவிட, ஒரு கையின்றி வாழ்வுக்குள் நுழைவது உனக்கு மேலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உன்னைப் பாவம் செய்யத் தூண்டினால்.” கிரேக்க வினைச்சொல் ஒருவரை இடறச் செய்தல், விழச் செய்தல், அல்லது பாவம் செய்யத் தூண்டுதல் என்று பொருள்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: கெஹென்னா என்பது தெய்வீகத் தீர்ப்புடன் தொடர்புடைய ஓர் இடப்பெயரின் கிரேக்க வடிவம்; மரபாக “நரகம்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: இடறவைத்தால்
  rationale: இடறுதல் என்ற மூல உருவகத்தைத் தக்கவைக்கிறது; அதேவேளையில் இச்சூழலில் பாவத்துக்குள் விழச் செய்வதையும் உள்ளடக்க முடிகிறது.
- source_word: ἀπόκοψον
  choice: வெட்டிப்போடு
  rationale: வலிமையான கட்டளையையும் அதிர்ச்சியூட்டும் உடல் சார்ந்த படிமத்தையும் மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: καλόν
  choice: மேலானது
  rationale: ἢ என்பதுடன் வரும் ஒப்பீட்டுக் கட்டமைப்பில் ‘நல்லது’ என்பதைக் காட்டிலும் ‘மேலானது’ என்பது இயல்பான தமிழில் ஒப்பீட்டுப் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: κυλλόν
  choice: கை ஊனமுற்றவனாய்
  rationale: ஒரு உறுப்பை இழந்த அல்லது சிதைவுற்ற நிலையைக் குறிக்கும் சொல்லின் பொருளையும், கை வெட்டப்படுவது குறித்த உடனடிச் சூழலையும் தக்கவைக்கிறது.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: வாழ்வுக்குள் நுழைவது
  rationale: ‘வாழ்வு’ என்பதற்குள் நுழைதல் என்ற இறுதிக்கால நம்பிக்கையைக் குறிக்கும் மூல மொழியின் சொல்லமைப்பையும் மேன்மையான தொனியையும் காக்கிறது.
- source_word: ἀπελθεῖν
  choice: செல்வதை
  rationale: வாழ்வுக்குள் ‘நுழைவது’ என்பதற்கு எதிராக கெஹென்னாவுக்குச் செல்லும் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γέενναν
  choice: கெஹென்னா
  rationale: பொதுவான இறையியல் சொல்லாக மாற்றாமல், தெய்வீகத் தீர்ப்புடன் தொடர்புடைய குறிப்பிட்ட கிரேக்க இடப்பெயரைத் தக்கவைக்கிறது.
- source_word: ἄσβεστον
  choice: அணைக்க முடியாத
  rationale: அணைக்கப்படாத அல்லது அணைக்க இயலாத நெருப்பு என்ற கிரேக்கச் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: இரண்டு கைகளுடன்
  rationale: ஒரு கை ஊனமுற்ற நிலைக்கும் இரு கைகளும் உள்ள நிலைக்கும் இடையிலான மூல உரையின் தெளிவான முரண்பாட்டைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: தீர்ப்பைக் குறிக்கும் γέεννα என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: குறிப்பிட்ட யூத இடப்பெயரும் அதனுடன் தொடர்புடைய தீர்ப்புப் படிமமும் அழியாமல் இருக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; பரிச்சயமான இறையியல் இணைச்சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: கையை வெட்டிப்போடுதல் என்ற எச்சரிக்கையின் வலிமை
  choice: உடல் சார்ந்த நேரடி மொழியை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: பாவத்தைத் தவிர்த்துவிடு என்று பொதுவாக விளக்கிப் பராபரப்புரை செய்தல்
  rationale: மூல வசனம் பாவம் மற்றும் தீர்ப்பின் தீவிரத்தை அதிர்ச்சியூட்டும் உடல் படிமத்தால் வலியுறுத்துகிறது; அதன் நோக்கத்தை விளக்கத்தின் மூலம் முன்கூட்டியே குறுக்காமல் அந்தச் சொல்லாட்சியே பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இடறவைத்தால்’ என்ற உருவகமும், ‘வெட்டிப்போடு’ என்ற கடுமையான கட்டளையும், ‘வாழ்வுக்குள் நுழைவது’ என்ற இறுதிக்கால மொழிநடையும் தக்கவைக்கப்பட்டுள்ளன. கெஹென்னா ஒலிபெயர்க்கப்பட்டு அதன் மரபுவழி இணைச்சொல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
