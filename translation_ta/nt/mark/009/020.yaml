reference: Mark 9:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: ta
  text: அவர்கள் அவனை அவரிடம் கொண்டுவந்தார்கள். அவரைக் கண்டதும், அந்த ஆவி உடனே அவனைக் கடுமையான வலிப்புறச் செய்தது; அவன் தரையில் விழுந்து, நுரை தள்ளியபடி புரண்டுகொண்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: கொண்டுவந்தார்கள்
  rationale: φέρω என்பதன் இறந்தகால வடிவம் இங்கு சிறுவனை இயேசுவிடம் கொண்டுவருவதைக் குறிக்கிறது; நவீனத் தமிழில் இது இயல்பான தெரிவு.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: πρός + வேற்றுமை உருபு ஒருவரை நோக்கிய இயக்கத்தைக் காட்டுகிறது; சூழலில் மரியாதை ஒருமையான ‘அவர்’ இயேசுவைக் குறிக்கிறது.
- source_word: ἰδὼν αὐτόν
  choice: அந்த ஆவி அவரைக் கண்டவுடனே
  rationale: இறந்தகாலப் பங்கேற்பு இங்கு காலத் தொடர்புடையதாக உள்ளது; εὐθύς உடன் இணைத்து ‘கண்டவுடனே’ என மொழிபெயர்ப்பது உடனடித் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα
  choice: அந்த ஆவி
  rationale: இந்த வசனம் ‘ஆவி’ என்று மட்டுமே கூறுகிறது. தமிழில் ஏற்கெனவே அறிமுகமான குறிப்பிட்ட ஆவியைக் காட்ட ‘அந்த’ பயன்படுத்தப்படுகிறது; ‘அசுத்த’ அல்லது ‘பேய்’ என்று விரிவாக்கப்படவில்லை.
- source_word: εὐθὺς
  choice: உடனடியாக
  rationale: மாற்குவின் நடையில் முக்கியமான உடனடித்தன்மையை வெளிப்படையாகப் பாதுகாக்கிறது; ‘கண்டவுடனே’ என்பதுடன் சிறிது வலியுறுத்தல் தோன்றினாலும், மூலத்தின் தனி வினையடையை விட்டுவிடாமல் காக்கிறது.
- source_word: συνεσπάραξεν
  choice: கடுமையாக வலிப்புறச் செய்தது
  rationale: வன்மையான தசை வலிப்பு அல்லது வலிப்புத் தாக்கத்தை ஏற்படுத்தியது என்பதே வினையின் பொருள்; சாதாரண வாசகருக்கு தெளிவாகவும் காரணச் செயலைக் காக்கும் விதமாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: அவன் தரையில் விழுந்து
  rationale: பங்கேற்பின் தொடர்ச்சியை இயல்பான தமிழ் இணைவினை வடிவில் தருகிறது; விழுந்தது சிறுவனே என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐκυλίετο
  choice: புரண்டுகொண்டிருந்தான்
  rationale: இறந்தகாலத் தொடர்நிலை தொடர்ந்து அல்லது மீண்டும் நிகழ்ந்த அசைவைக் காட்டுகிறது; ‘புரண்டுகொண்டிருந்தான்’ அந்த நீடித்த செயலைக் காக்கிறது.
- source_word: ἀφρίζων
  choice: நுரை தள்ளியபடி
  rationale: நுரை வந்துகொண்டிருந்த நிலையை இயல்பான தமிழில் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வாயில்’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: πνεῦμα என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘அந்த ஆவி’ என்று மொழிபெயர்த்தல்
  alternative: ‘அசுத்த ஆவி’ அல்லது ‘பேய்’
  rationale: பரந்த சூழல் அது அசுத்த ஆவி என்பதைத் தெளிவாக்கினாலும், இவ்வசனத்தின் கிரேக்கம் τὸ πνεῦμα என்று மட்டுமே கூறுகிறது. ஆகவே விளக்கச் சொல்லைச் சேர்க்காமல் மூலத்தின் சொல் அளவும் இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கண்ணியமும் உள்ள எளிய கதைநடை. இயேசுவைக் குறிக்கும் சுட்டுப்பெயர் மரியாதை ஒருமையில் உள்ளது; சிறுவனை சாதாரண ஆண்பால் ஒருமையில் குறிப்பிடுகிறது. தேவையற்ற மருத்துவச் சொற்களும், மூலத்தில் இல்லாத விளக்க விரிவாக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
