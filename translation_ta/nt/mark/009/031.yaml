reference: Mark 9:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: ta
  text: ஏனெனில், அவர் தம் சீடர்களுக்குக் கற்பித்துக்கொண்டிருந்தார்; அவர்களிடம், “மனிதகுமாரன் மனிதர்களின் கைகளில்[a] ஒப்புவிக்கப்படுகிறார். அவர்கள் அவரைக் கொல்வார்கள்; அவர் கொல்லப்பட்டபின், மூன்று நாட்களுக்குப் பிறகு[b] உயிர்த்தெழுவார்” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதர்களின் அதிகாரத்தில் ஒப்புவிக்கப்படுகிறார்” என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் சொல்லுக்குச் சொல், “மனிதர்களின் கைகளில்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: வேறு இடங்களில் “மூன்றாம் நாளில்” என்ற சொற்றொடரும் பயன்படுத்தப்படுகிறது; ஆனால் இங்கு கிரேக்கத்தில் “மூன்று நாட்களுக்குப் பிறகு” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: இறந்தகால முற்றுப்பெறாத வினை, தொடர்ந்து நடைபெற்ற பின்னணிச் செயலைக் காட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுக்கான விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: தம் சீடர்களுக்கு
  rationale: மத்தேதை என்ற உறவு மற்றும் பயிற்சி சார்ந்த பொருளை இயல்பான நற்செய்தி வழக்கில் தருகிறது.
- source_word: ἔλεγεν αὐτοῖς
  choice: அவர்களிடம் … என்று சொல்லிக்கொண்டிருந்தார்
  rationale: முறையாகத் தொடர்ந்து கூறிவந்த போதனையை இறந்தகால முற்றுப்பெறாத வடிவில் பிரதிபலிக்கிறது.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற தன்னடையாளப் பெயரையும் அதன் வேதாகம எதிரொலிகளையும் விளக்கவுரையாக்காமல் பாதுகாக்கிறது.
- source_word: παραδίδοται
  choice: ஒப்புவிக்கப்படுகிறார்
  rationale: நிகழ்காலச் செயலற்ற வடிவையும் குறிப்பிடப்படாத செயற்பாட்டாளரையும் பாதுகாக்கிறது; ‘காட்டிக்கொடுக்கப்படுகிறார்’ என்று பொருளை துரோகம் என்பதற்குள் குறுக்கவில்லை.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: மனிதர்களின் கைகளில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் வருதல் என்ற மூலமொழியின் உருவகத்தைத் தக்கவைத்து, ‘மனிதகுமாரன்—மனிதர்கள்’ என்ற சொல் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: அவர்கள் அவரைக் கொன்றுவிடுவார்கள்
  rationale: எதிர்காலப் பன்மை வினையின் நேரடியான பொருளையும் குறிப்பிடப்படாத மனிதச் செயற்பாட்டாளர்களையும் தருகிறது.
- source_word: ἀποκτανθεὶς
  choice: அவர் கொல்லப்பட்டபின்
  rationale: செயலற்ற இறந்தகால வினையெச்சம், உயிர்த்தெழுதலுக்கு முன் நிகழும் கொலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: மூன்று நாட்களுக்குப் பிறகு
  rationale: μετά + வேற்றுமை வடிவின் இயல்பான ‘பிறகு’ என்ற பொருளை மற்ற இடங்களின் சொற்றொடருடன் ஒத்திசைக்காமல் பாதுகாக்கிறது.
- source_word: ἀναστήσεται
  choice: உயிர்த்தெழுவார்
  rationale: எதிர்கால நடுவினை வடிவை இயல்பான தன்வினைப் பொருளில் தருகிறது; ‘உயிர்த்தெழுப்பப்படுவார்’ என்ற செயலற்ற வடிவை இங்கு இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: παραδίδοται என்பதன் செயற்பாட்டாளரும் பொருள் அகலமும்
  choice: ஒப்புவிக்கப்படுகிறார்
  alternative: காட்டிக்கொடுக்கப்படுகிறார்
  rationale: கிரேக்கச் செயலற்ற வினை செயற்பாட்டாளரைச் சொல்லாமல் விடுகிறது; மனிதத் துரோகம், கைது, தெய்வ அனுமதி ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் இறையியல் நெருக்கடியைப் பாதுகாக்கிறது.
- issue: ἀνθρώπων மற்றும் ‘மனிதகுமாரன்’ இடையிலான சொல் தொடர்பு
  choice: மனிதர்களின் கைகளில்
  alternative: மனிதக் கைகளில்
  rationale: மனிதகுமாரனுக்கும் அவரை அதிகாரத்திற்குள் கொண்டுவரும் மனிதர்களுக்கும் இடையிலான வெளிப்படையான சொல்லியல் எதிர்நிலையைத் தக்கவைக்கிறது.
- issue: ἀναστήσεται என்பதன் குரல்
  choice: உயிர்த்தெழுவார்
  alternative: உயிர்த்தெழுப்பப்படுவார்
  rationale: இவ்விடத்தின் எதிர்கால நடுவினை வடிவைத் தக்கவைத்து, வேறு உயிர்த்தெழுதல் கூற்றுகளிலுள்ள செயலற்ற இலக்கணத்தை இங்கு கொண்டுவரவில்லை.
- issue: μετὰ τρεῖς ἡμέρας என்ற காலச் சொற்றொடர்
  choice: மூன்று நாட்களுக்குப் பிறகு
  alternative: மூன்றாம் நாளில்
  rationale: மற்ற இடங்களில் வரும் ‘மூன்றாம் நாளில்’ என்பதுடன் அமைதியாக ஒத்திசைக்காமல், இவ்வசனத்தின் சொற்றொடரை நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான இறந்தகாலச் செயல்களுக்கு ‘கொண்டிருந்தார்’ வடிவம் வைக்கப்பட்டுள்ளது. மூலத்தின் மீளுரையான ‘கொல்வார்கள்—கொல்லப்பட்டபின்’ அமைப்பு மற்றும் ‘மூன்று நாட்களுக்குப் பிறகு’ என்ற காலக்குறிப்பு வாசிப்புக்கு இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் பாதுகாக்கப்பட்டுள்ளன.
