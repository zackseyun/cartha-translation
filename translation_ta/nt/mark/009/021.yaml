language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: ta
  text: அவர் அவனுடைய தந்தையிடம், “இவனுக்கு இது ஏற்பட்டு எவ்வளவு காலமாகிறது?” என்று கேட்டார். அவனுடைய தந்தை, “சிறுவயதிலிருந்தே” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: கேட்டார்
  rationale: இங்கு ἐπερωτάω என்பது நேரடியான கேள்வியை அறிமுகப்படுத்துகிறது; கூடுதல் தீவிரத்தையோ முறையான விசாரணைத் தொனியையோ சேர்க்காமல் ‘கேட்டார்’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: τὸν πατέρα αὐτοῦ
  choice: அவனுடைய தந்தையிடம்
  rationale: சூழலில் αὐτοῦ என்பது பாதிக்கப்பட்ட சிறுவனைக் குறிக்கிறது. ‘அவனுடைய தந்தையிடம்’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: எவ்வளவு காலம் ஆகிறது?
  rationale: இந்தக் கிரேக்கச் சொற்றொடர் தொடக்கத்திலிருந்து இப்போதுவரையிலான கால அளவைக் கேட்கிறது; நவீன தமிழில் ‘எவ்வளவு காலம் ஆகிறது?’ என்பது அந்த நீடிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: இப்படி இவனுக்கு ஏற்பட்டு
  rationale: γέγονεν என்ற நிறைவுக்கால வடிவம் கடந்த காலத்தில் தொடங்கி தற்போதும் நிலவும் அல்லது தொடர்ந்து நிகழும் நிலையைக் குறிக்கிறது. ‘இப்படி இவனுக்கு ஏற்பட்டு’ என்பது τοῦτο-வின் பொதுவான சுட்டுதலையும் தொடரும் நிலையின் உணர்வையும் பாதுகாக்கிறது.
- source_word: ὁ δὲ εἶπεν
  choice: அதற்கு அவர் … என்றார்
  rationale: δέ இங்கு உரையாடலின் அடுத்த கட்டத்தைச் சுட்டுகிறது. தமிழில் ‘அதற்கு அவர்’ என்பது பதிலை இயல்பாக இணைக்கிறது; தேவையற்ற எதிர்மறை முரணைச் சேர்ப்பதில்லை.
- source_word: Ἐκ παιδιόθεν
  choice: சிறுவயதிலிருந்தே
  rationale: ἐκ உடன் παιδιόθεν ஆரம்பப் புள்ளியைச் சுட்டி, அந்த நிலை சிறுவயதிலிருந்து தொடர்வதை உணர்த்துகிறது. ‘சிறுவயதிலிருந்தே’ நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
