revisions:
- from: அவர் அவனுடைய தந்தையிடம், “இப்படி இவனுக்கு ஏற்பட்டு எவ்வளவு காலம் ஆகிறது?” என்று கேட்டார். அதற்கு அவர், “சிறுவயதிலிருந்தே” என்றார்.
  to: அவர் அவனுடைய தந்தையிடம், “இவனுக்கு இது ஏற்பட்டு எவ்வளவு காலமாகிறது?” என்று கேட்டார். அவனுடைய தந்தை, “சிறுவயதிலிருந்தே” என்றார்.
  rationale: 'The revision retains the Greek perfect’s present-reaching condition through ‘ஏற்பட்டு எவ்வளவு காலமாகிறது,’ renders τοῦτο without specifying an unstated manner, and makes the father’s reply clear in natural Tamil. No footnote is required: ‘சிறுவயதிலிருந்தே’ directly and idiomatically expresses Ἐκ παιδιόθεν.'
  reviewer_model: gpt-5.6-terra
