translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கும் தந்தைக்கும் ஒரே மரியாதை வினைமுற்று வந்தாலும், ‘அதற்கு’ என்ற உரையாடல் இணைப்பும் சூழலும் பேச்சாளரைத் தெளிவுபடுத்துகின்றன. மூலத்தில் தனியான உரைவேறுபாடு அல்லது விளக்கக் குறிப்பைத் தேவைப்படுத்தும் மெய்யியல் சிக்கல் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
