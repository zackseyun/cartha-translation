translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் மரியாதைமிக்கதுமான கதைநடை பயன்படுத்தப்பட்டது. கிரேக்கப் பிரதிப்பெயரின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது; வினையின் சாத்தியமான வாக்குவாத நுண்ணுணர்வு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
