  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் ஒருவரோடு ஒருவர் எதைப் பற்றி விவாதித்துக்கொண்டிருக்கிறீர்கள்[a]?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஒருவரோடு ஒருவர் எதைப் பற்றி வாக்குவாதம் செய்துகொண்டிருக்கிறீர்கள்?” சூழலைப் பொறுத்து இந்த வினை விவாதத்தையோ வாக்குவாதத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: கேட்டார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் இயல்பான கதைநடை வினையாக இருப்பதால், நவீனத் தமிழில் ‘கேட்டார்’ என்பது பொருத்தமானது.
- source_word: αὐτούς
  choice: அவர்களிடம்
  rationale: கிரேக்கப் பிரதிப்பெயர் பன்மையைக் குறிக்கிறது; இந்த வசனத்திற்குள் அதன் குறிப்பு இன்னாரென்று வெளிப்படையாகச் சொல்லப்படாததால், குறிப்பிட்ட குழுவைச் சேர்க்காமல் ‘அவர்களிடம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: Τί
  choice: எதைப் பற்றி
  rationale: இங்கு கேள்வி கலந்துரையாடலின் காரணத்தைவிட அதன் பொருள் அல்லது தலைப்பைக் கேட்கிறது; தமிழில் ‘எதைப் பற்றி’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: συζητεῖτε
  choice: விவாதித்துக்கொண்டிருக்கிறீர்கள்
  rationale: இந்த வினை கலந்துரையாடல், விவாதம் அல்லது வாக்குவாதம் ஆகிய நுண்ணுணர்வுகளைச் சூழலின்படி தரக்கூடும். ‘விவாதித்துக்கொண்டிருக்கிறீர்கள்’ என்பது பகைமையான தொனியை கட்டாயப்படுத்தாமல் அதன் விரிந்த பொருளைத் தக்கவைக்கிறது.
- source_word: πρὸς αὑτούς
  choice: ஒருவரோடு ஒருவர்
  rationale: குழுவினரிடையே பரஸ்பரமாக நடைபெறும் உரையாடலைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘ஒருவரோடு ஒருவர்’ பயன்படுத்தப்பட்டது.
- source_word: καὶ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: கிரேக்க καί முந்தைய நிகழ்வுடன் இச்செயலை இணைக்கிறது. தனி வசனமாக இயல்பான தமிழில் வாக்கியத் தொடர்ச்சியே அந்த இணைப்பைத் தருவதால், செயற்கையாக ‘மேலும்’ அல்லது காலநுணுக்கம் சேர்க்கும் ‘பின்பு’ சேர்க்கப்படவில்லை.
