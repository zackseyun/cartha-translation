source:
  edition: SBLGNT
  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ καὶ τὸ πῦρ οὐ σβέννυται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: ta
  text: அங்கே அவர்களுடைய புழு சாவதில்லை[a][b]; நெருப்பும் அணைக்கப்படுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பிணப்புழு முடிவடைவதில்லை; நெருப்பும் அணைந்துபோவதில்லை.”
    reason: σκώληξ என்பதற்கு சூழலில் ‘பிணப்புழு’ என்றும், τελευτᾷ என்பதற்கு ‘முடிவடைகிறது’ என்றும் பொருள் கொள்ளக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
  - marker: b
    text: இந்த வரி ஏசாயா 66:24-ஐ எதிரொலிக்கிறது.
    reason: மூலவாக்கியத்தின் பழைய ஏற்பாட்டு மேற்கோள்/எதிரொலியை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ὅπου
  choice: அங்கே
  rationale: முந்தைய சூழலில் கூறப்பட்ட இடத்தைச் சுட்டும் உறவிட வினையடையாக இயல்பாகவும் சுருக்கமாகவும் அமைகிறது.
- source_word: ὁ σκώληξ αὐτῶν
  choice: அவர்களுடைய புழு
  rationale: σκώληξ என்பதன் பரந்த, நேரடியான பொருளையும் αὐτῶν என்பதன் உடைமைத் தொடர்பையும் காக்கிறது; ‘பிணப்புழு’ என்று குறிப்பாக்காமல் ஏசாயா 66:24-ன் படிமத்தையும் தக்கவைக்கிறது.
- source_word: οὐ τελευτᾷ
  choice: சாவதில்லை
  rationale: புழுவை எழுவாயாகக் கொண்டபோது τελευτάω என்பதற்கு இயல்பான பொருத்தம்; முடிவடையாமை என்ற மாற்றுப் பொருள் சாத்தியமிருந்தாலும் படிமத்தின் கூர்மையைப் பாதுகாக்கிறது.
- source_word: τὸ πῦρ
  choice: நெருப்பு
  rationale: மூலப்பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: οὐ σβέννυται
  choice: அணைக்கப்படுவதில்லை
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் நெருப்பு அணைக்கப்படாத தொடர்நிலையையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புப் படிமத்தின் தன்மை
  choice: புழு, நெருப்பு என்ற உருவகங்களை விளக்கவுரை சேர்க்காமல் அப்படியே வைத்தல்
  alternative: இதை முடிவில்லாத உணர்வுள்ள வேதனை, மாற்றமுடியாத அழிவு, அல்லது அவமானம் மற்றும் தீட்டின் உருவகம் என்று மொழிபெயர்ப்பிலேயே தீர்மானித்தல்
  rationale: வசனம் ஏசாயா 66:24-ஐ எதிரொலிக்கும் தீவிரமான நியாயத்தீர்ப்புப் படிமத்தைத் தருகிறது; ஆனால் விரிவான கோட்பாட்டு விவாதங்களில் எந்த ஓர் விளக்கத்தையும் மொழிபெயர்ப்பு கட்டாயப்படுத்தக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த நடை. ‘சாவதில்லை’ என்பது தெளிவான அன்றாடச் சொல்; ‘அணைக்கப்படுவதில்லை’ செயப்பாட்டு அமைப்பைக் காக்கிறது. இறையியல் விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் தீவிரத்தையும் தெளிவின்மையையும் தக்கவைத்துள்ளது.
