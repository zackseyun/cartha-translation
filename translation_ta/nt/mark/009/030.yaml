source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: ta
  text: அவர்கள் அங்கிருந்து புறப்பட்டு, கலிலேயா வழியாகச் சென்றுகொண்டிருந்தார்கள்[a]. யாரும் அறிந்துகொள்வதை அவர் விரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கலிலேயா வழியாகப் பயணம் செய்துகொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்து நடைபெற்ற இயக்கத்தை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: யாரும் எதை அறியக்கூடாது என்பதை கிரேக்க மூலம் சொல்லவில்லை. சூழலில், இயேசு அங்கு இருந்ததையோ அவர் சென்ற வழியையோ இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: அவர்கள் அங்கிருந்து புறப்பட்டு
  rationale: καί + ἐκεῖθεν முந்தைய நிகழ்வுடன் தொடர்ச்சியையும் அந்த இடத்திலிருந்து நகர்வதையும் குறிக்கிறது; ἐξελθόντες புறப்படுதலை வெளிப்படையாகக் காட்டுகிறது.
- source_word: παρεπορεύοντο
  choice: சென்றுகொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்து நடைபெற்ற பயணத்தைச் சுட்டுகிறது; தமிழில் ‘சென்றுகொண்டிருந்தார்கள்’ அந்த நீடித்த இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς Γαλιλαίας
  choice: கலிலேயா வழியாக
  rationale: διά + உரிமை வேற்றுமை ஒரு பகுதியினூடாகச் செல்லும் இயக்கத்தைக் குறிக்கிறது; ‘வழியாக’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: οὐκ ἤθελεν
  choice: அவர் விரும்பவில்லை
  rationale: θέλω இங்கு விருப்பம் அல்லது சித்தத்தைச் சுட்டுகிறது; மரியாதை ஒருமையான ‘அவர்’ சூழலில் இயேசுவைக் குறிக்கிறது.
- source_word: ἵνα τις γνοῖ
  choice: யாரும் அறிந்துகொள்வதை
  rationale: யாரும் அறியாதிருக்க வேண்டும் என்ற நோக்கத்தை இச்சொற்றொடர் காட்டுகிறது. எதை அறியக்கூடாது என்பதைக் கிரேக்கம் வெளிப்படையாகக் கூறாததால் தமிழிலும் செயப்படுபொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἤθελεν என்பதன் மறைமுக எழுவாய்
  choice: இயேசுவைக் குறிக்கும் ‘அவர்’
  alternative: எழுவாயை மறைத்தல் அல்லது குழுவைக் குறித்தல்
  rationale: ஒருமை வினைச்சொல்லும் கதையின் சூழலும் இயேசுவையே இயல்பான எழுவாயாகக் காட்டுகின்றன.
- issue: γνοῖ என்பதன் சொல்லப்படாத செயப்படுபொருள்
  choice: எதை அறியக்கூடாது என்பதை மூலத்தைப் போலவே சொல்லாமல் விடுதல்
  alternative: அவருடைய இருப்பிடத்தையோ பயண வழியையோ அறியக்கூடாது என்று வெளிப்படையாகக் கூறுதல்
  rationale: சூழல் இயேசுவின் இருப்பையோ கலிலேயா வழியான பயணத்தையோ சுட்டலாம்; ஆனால் கிரேக்க மூலத்தில் அது திட்டவட்டமாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தொடர்ச்சியான இயக்கம் வினை வடிவத்தில் காக்கப்பட்டு, இறுதி வாக்கியத்தின் சொல்லப்படாத செயப்படுபொருள் திட்டவட்டமாக நிரப்பப்படவில்லை.
