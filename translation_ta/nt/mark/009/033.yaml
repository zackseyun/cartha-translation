id: MRK.9.33
reference: Mark 9:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: ta
  text: அவர்கள் கப்பர்நகூமுக்கு வந்தார்கள். அவர் அந்த வீட்டில் இருந்தபோது, “வழியில் எதைப் பற்றிப் பேசிக்கொண்டிருந்தீர்கள்[a]?” என்று அவர்களிடம் கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழியில் எதைப் பற்றி வாக்குவாதம் செய்துகொண்டிருந்தீர்கள்?” இந்த வினை பேசுதல், விவாதித்தல் அல்லது வாக்குவாதம் செய்தல் ஆகியவற்றைக் குறிக்கலாம். அடுத்த வசனத்தின்படி, தங்களுள் யார் மிகப் பெரியவர் என்பதே அவர்களுடைய பேச்சின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: இறந்தகாலப் பன்மை வினை கப்பர்நகூமுக்கு அவர்கள் வந்து சேர்ந்ததை இயல்பாகக் குறிக்கிறது.
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: கிரேக்க இடப்பெயரின் ஒலிப்பைத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: அவர் வீட்டில் இருந்தபோது
  rationale: தனிப்பட்ட அந்த வீட்டுக்குள் இயேசு இருந்த காலச்சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; வீடு அவருக்குச் சொந்தமானது என்று தேவையின்றி விளக்கவில்லை.
- source_word: ἐπηρώτα
  choice: கேட்டார்
  rationale: கிரேக்க முற்றுப்பெறா இறந்தகாலத்தின் பின்னணி அல்லது தொடர்நிலையைத் தமிழ் கதைநடையில் கட்டாயமாக முற்போக்கு வடிவில் கூறாமல், இயல்பான எளிய இறந்தகாலத்தால் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணச் சூழலில் கிரேக்கத் தொடருக்கான நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: διελογίζεσθε
  choice: பேசிக்கொண்டிருந்தீர்கள்
  rationale: இந்த வினை கலந்துரையாடல், விவாதம் அல்லது வாக்குவாதம் ஆகிய நுணுக்கங்களைக் கொள்ள முடியும். முதன்மை உரை அதன் பரந்த பொருளைத் தக்கவைக்கிறது; கூர்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பன்மை எழுவாயிலிருந்து ஒருமை எழுவாய்க்கு மாறுதல்
  choice: முதலில் சீடர்கள் உட்பட்ட குழுவை ‘அவர்கள்’ என்றும், பின்னர் கேள்வி கேட்ட இயேசுவை ‘அவர்’ என்றும் வெளிப்படையாகக் காட்டுதல்
  alternative: ‘அவர்கள் வந்தார்கள்; வீட்டிற்குள் சென்றபின் இயேசு அவர்களிடம் கேட்டார்’ என்று இயேசுவின் பெயரைச் சேர்த்தல்
  rationale: கிரேக்கத்தில் ஒருமை எழுவாய் சூழலால் இயேசுவைக் குறிக்கிறது. பெயரை மூலத்தில் இல்லாமல் சேர்க்காமல், தமிழில் மரியாதை ஒருமையான ‘அவர்’ மூலம் தெளிவு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர் வீட்டில்’ என்பது உடைமையைக் குறிக்காதபடி, ‘அவர் வீட்டில் இருந்தபோது’ என்ற முழுத் தொடரில் இயேசு வீட்டினுள் இருந்த சூழலாக வாசிக்கப்பட வேண்டும்.
