source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: ta
  text: அவர்கள் மலையிலிருந்து இறங்கி வந்துகொண்டிருந்தபோது, தாங்கள் கண்டவற்றை மானிடமகன் இறந்தோரிடமிருந்து உயிர்த்தெழும்வரை யாரிடமும் சொல்லக் கூடாது என்று அவர் அவர்களுக்குக் கட்டளையிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச்சொல், “மானிடமகன் இறந்தோரிடமிருந்து உயிர்த்தெழும் காலத்திலன்றி.”
    reason: alternative_reading
lexical_decisions:
- source_word: καταβαινόντων
  choice: இறங்கி வந்துகொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியையும், பிரதான நிகழ்வுடன் அது ஒரே நேரத்தில் நடந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὄρους
  choice: மலை
  rationale: ὄρος என்பதன் இயல்பான பொருள் ‘மலை’; உருமாற்ற நிகழ்ச்சியின் கதைச்சூழலுக்கும் இது பொருந்துகிறது.
- source_word: διεστείλατο
  choice: கட்டளையிட்டார்
  rationale: வலுவான அறிவுறுத்தல் அல்லது ஆணை என்ற வினையின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἵνα μηδενὶ … διηγήσωνται
  choice: யாரிடமும் சொல்லக் கூடாது என்று
  rationale: கட்டளையின் உள்ளடக்கத்தையும் μηδενί என்பதன் முழுமையான எதிர்மறையையும் நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἃ εἶδον
  choice: தாங்கள் கண்டவற்றை
  rationale: சீடர்கள் ஏற்கெனவே கண்ட காட்சிகளைக் குறிக்கும் பன்மைத் தொடர்புப்பெயரின் பொருளைப் பாதுகாக்கிறது.
- source_word: εἰ μὴ ὅταν
  choice: காலத்திலன்றி
  rationale: ‘அந்த நேரம் வரும்வரை’ என்று மட்டும் பொருளாக்காமல், கிரேக்கத்தின் ‘அந்த நேரத்திலன்றி’ என்ற விதிவிலக்கு வடிவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் சிறப்புப் பெயரையும் அதன் வேதாகம எதிரொலியையும் பொதுவான மனிதனைக் குறிக்கும் சொற்றொடராகத் தட்டையாக்காமல் பாதுகாக்கிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிடமிருந்து
  rationale: ஒரு மரணநிலையிலிருந்து என்பதைக் காட்டிலும், இறந்தவர்களின் நடுவிலிருந்து எழுதல் என்ற ἐκ + பன்மைச் சொல்லின் நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: ἀναστῇ
  choice: உயிர்த்தெழும்
  rationale: ὅταν உடன் வரும் இறந்தகால துணைவினை வடிவம், கட்டளை வழங்கப்பட்ட நேரத்துக்கு எதிர்காலத்தில் நடைபெறும் நிகழ்வைக் குறிக்கிறது; தமிழின் ‘உயிர்த்தெழும் காலத்தில்’ இதை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்பதன் மொழிபெயர்ப்பு
  choice: மானிடமகன்
  alternative: மனிதகுமாரன்
  rationale: ‘மானிடமகன்’ என்பது மூலத்தின் கூட்டு வடிவத்தையும் பட்டப்பெயர்த் தன்மையையும் காக்கிறது; அதேவேளை நவீன தமிழில் புரிந்துகொள்ளத்தக்கதாக உள்ளது. எந்தக் குறிப்பிட்ட கிறிஸ்தவப் பிரிவின் விளக்கத்தையும் இதில் சேர்க்கவில்லை.
- issue: εἰ μὴ ὅταν என்பதன் கால–விதிவிலக்கு வலிமை
  choice: உயிர்த்தெழும் காலத்திலன்றி
  alternative: உயிர்த்தெழும்வரை
  rationale: மூலத்தில் உள்ள ‘அப்போது தவிர’ என்ற வடிவை முதன்மை உரையில் பாதுகாக்கிறது. அதன் நடைமுறைப் பொருள் ‘அதுவரை’ என்பதற்கு நெருக்கமானது என்பதை அடிக்குறிப்பு விளக்குகிறது; இவ்வாறு மூலத்தின் உண்மையான பதற்றம் அமைதியாக நீக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதைநடையின் தெளிவும் காக்கப்பட்டுள்ளன. ‘கட்டளையிட்டார்’ ஆணையின் வலிமையைக் காட்டுகிறது. ‘இறந்தோரிடமிருந்து’ என்பது ἐκ νεκρῶν என்பதன் பன்மை நுட்பத்தை முதன்மை உரையிலேயே பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
