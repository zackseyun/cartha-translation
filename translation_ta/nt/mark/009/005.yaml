source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ta
  text: 'பேதுரு இயேசுவிடம் மறுமொழியாகச் சொன்னார்: “ரபீ, நாம் இங்கே இருப்பது நல்லது. மூன்று தற்காலிகத் தங்குமிடங்களை[a] அமைப்போம்: உமக்கு ஒன்று, மோசேக்கு ஒன்று, எலியாவுக்கு ஒன்று.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கூடாரங்கள்” அல்லது “குடில்கள்.” கிரேக்கச் சொல் தற்காலிகத் தங்குமிடங்களைக் குறிக்கிறது; இவ்வசனம் அவற்றுக்குப் பண்டிகை அல்லது வழிபாட்டுத் தொடர்பு இருப்பதாக வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: மறுமொழியாக
  rationale: வெளிப்படையான கேள்வி இல்லாவிட்டாலும், கிரேக்கக் கதைநடையில் வழக்கமான இந்தப் பங்கேற்புவினை முந்தைய நிகழ்வுக்குப் பேதுரு காட்டிய எதிர்வினையைக் குறிக்கிறது; ‘மறுமொழியாக’ என்பது அந்தத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது. இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலம் பயன்படுத்தப்படுகிறது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: செமித்தியப் பின்னணியையும் மரியாதையான அழைப்பின் தனித்துவத்தையும் காக்கும் ஒலிபெயர்ப்பு; ‘போதகரே’ என்பது சாத்தியமான பொருள் என்றாலும் சற்று விளக்கமான மொழிபெயர்ப்பு.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: நாம் இங்கே இருப்பது நல்லது
  rationale: பேதுருவின் மதிப்பீட்டை மிகைப்படுத்தாமல், கிரேக்கத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ποιήσωμεν
  choice: அமைப்போம்
  rationale: முதலாம் நபர் பன்மை ஏவல் பொருளுடைய துணைவினை வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘கட்டுவோம்’ என்பதைவிட அடிப்படை வினையின் பரந்த பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: σκηνάς
  choice: குடில்கள்
  rationale: தற்காலிகத் தங்குமிடங்களைக் குறிக்கும் தெளிவான, தொழில்நுட்பமற்ற தமிழ் சொல். ‘கூடாரங்கள்’ என்ற மாற்று சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: உமக்கு ஒன்று, மோசேக்கு ஒன்று, எலியாவுக்கு ஒன்று
  rationale: μίαν என்ற சொல்லின் மும்முறை பகிர்ந்தளிக்கும் அமைப்பையும் இணையான வாக்கிய வடிவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: σκηνάς என்பதன் பண்டிகை அல்லது வழிபாட்டுக்குரிய சாத்தியமான தொடர்புகள்
  choice: முதன்மை உரையில் நடுநிலையான ‘குடில்கள்’
  alternative: ‘கூடாரங்கள்’ அல்லது வழிபாட்டுச் சாயல் கொண்ட ‘திருக்கூடாரங்கள்’
  rationale: இந்த வசனம் இவற்றைக் கூடாரப் பண்டிகையுடனோ திருக்கூடார இறையியலுடனோ வெளிப்படையாக இணைக்கவில்லை. எனவே உரை கூறுவதைவிட வலுவான இறையியல் தொடர்பைச் சேர்க்காமல், மாற்றுச் சொல்லை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதையை வெளிப்படுத்த ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘குடில்களை’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
