source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: ta
  text: அவர் அவர்களுக்குப் பதிலளித்து, “நம்பிக்கையில்லாத தலைமுறையே,[a] நான் எதுவரை உங்களோடு இருப்பேன்? எதுவரை உங்களைச் சகித்துக்கொள்வேன்?[b] அவனை என்னிடம் கொண்டுவாருங்கள்” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசமற்ற தலைமுறையே.” ἄπιστος என்ற கிரேக்கச் சொல் ‘நம்பிக்கையில்லாத’ அல்லது ‘விசுவாசமற்ற’ என்ற பொருளில் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எதுவரை உங்களைப் பொறுத்துக்கொள்வேன்?” அல்லது “எதுவரை உங்களைத் தாங்கிக்கொள்வேன்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς
  choice: அவர் அவர்களுக்குப் பதிலளித்து
  rationale: பேச்சுக்கு முன்னுரையாக வரும் கிரேக்கப் பங்கேற்புவினையையும் அதன் மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: λέγει
  choice: என்று சொல்கிறார்
  rationale: மாற்குவின் உயிரோட்டமுள்ள வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாகப் பேணுகிறது.
- source_word: γενεὰ ἄπιστος
  choice: நம்பிக்கையில்லாத தலைமுறையே
  rationale: சூழலில் வெளிப்படும் நம்பாமையைத் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் ἄπιστος என்பதிலுள்ள ‘விசுவாசமற்ற’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἕως πότε
  choice: எதுவரை
  rationale: கால அளவைப் பற்றிய வேதனையுடனான கேள்வியைச் செம்மையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: நான் எதுவரை உங்களோடு இருப்பேன்?
  rationale: πρός இங்கு தொடர்ந்த உடனிருப்பைச் சுட்டுவதால் ‘உங்களோடு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἀνέξομαι ὑμῶν
  choice: எதுவரை உங்களைச் சகித்துக்கொள்வேன்?
  rationale: பொறுத்துக்கொள்ளுதல் அல்லது தாங்குதல் என்ற வினையின் வலிமையையும் இயேசுவின் மனவேதனையையும் தற்போதைய தமிழில் தெளிவாகத் தருகிறது.
- source_word: φέρετε αὐτὸν πρός με
  choice: அவனை என்னிடம் கொண்டுவாருங்கள்
  rationale: கட்டளைப் பன்மையையும் இயேசுவை நோக்கிய திசையையும் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἄπιστος என்பதன் பொருள்
  choice: நம்பிக்கையில்லாத
  alternative: விசுவாசமற்ற
  rationale: உடனடிச் சூழலில் தேவனுடைய வல்லமையை நம்பாத நிலை முன்னிலையாகிறது. ஆனால் இந்தச் சொல் நம்பகத்தன்மை அல்லது விசுவாசம் இல்லாமையையும் குறிக்கக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: ἀνέξομαι என்பதிலுள்ள தொனி
  choice: சகித்துக்கொள்வேன்
  alternative: பொறுத்துக்கொள்வேன் / தாங்கிக்கொள்வேன்
  rationale: இயேசுவின் கடுமையான வருத்தத்தை மென்மையாக்காமல், அதே வேளையில் தேவையற்ற பேச்சுவழக்குத் தொனியைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எதுவரை’ என்ற வடிவம் மீளுரையைப் பேணி, இயேசுவின் வேதனையையும் கண்டனத்தையும் வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடுகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
