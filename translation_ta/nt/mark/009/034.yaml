base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: ta
  text: ஆனால் அவர்கள் பேசாமல் இருந்தார்கள்; ஏனெனில் வழியில் தங்களுக்குள் யார் பெரியவர்[a] என்று வாதிட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “யார் மிகப் பெரியவர்.” கிரேக்கச் சொல் நேரடியாக ஒப்பீட்டு வடிவில், “பெரியவர்” என்று உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: பேசாமல் இருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்ச்சியைக் காட்டும் வினைவடிவம், இயேசுவின் கேள்விக்கு அவர்கள் தொடர்ந்து பதில் சொல்லாமல் இருந்ததைக் குறிக்கிறது. ‘பேசாமல் இருந்தார்கள்’ என்பது இதை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: διελέχθησαν
  choice: வாதிட்டிருந்தார்கள்
  rationale: சீடர்களிடையே நிலைமையைப் பற்றிய போட்டி சூழல் இருப்பதால், நடுநிலையான ‘பேசிக்கொண்டார்கள்’ என்பதைக் காட்டிலும் ‘வாதிட்டிருந்தார்கள்’ பொருத்தமானது. அவர்களுடைய மௌனத்திற்கு முன்பு நடந்த செயல் என்பதால் முன் இறந்தகால உணர்வு தரப்பட்டுள்ளது.
- source_word: πρὸς ἀλλήλους
  choice: தங்களுக்குள்
  rationale: பரஸ்பரமாக அவர்களுக்கிடையே நடந்த உரையாடலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணித்துக்கொண்டிருந்த பாதையில் நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τίς μείζων
  choice: யார் பெரியவர்
  rationale: மூலத்திலுள்ள ஒப்பீட்டு μείζων என்பதைக் ‘மிகப் பெரியவர்’ என்ற வெளிப்படையான உயர்நிலையாக்காமல் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: οἱ δὲ
  choice: ஆனால் அவர்கள்
  rationale: முந்தைய கேள்விக்கும் சீடர்களின் பதிலின்மைக்கும் இடையிலான மென்மையான முரண்பாட்டை δέ குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: அவர்கள் ஏன் பேசாமல் இருந்தார்கள் என்பதற்கான காரணத்தை γάρ அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: ஒப்பீட்டு μείζων என்பதா, உயர்நிலைப் பொருளா
  choice: யார் பெரியவர்
  alternative: யார் மிகப் பெரியவர்
  rationale: கிரேக்கத்தில் உயர்நிலை வடிவம் அல்ல, ஒப்பீட்டு வடிவமே உள்ளது. சீடர்களின் நிலைப் போட்டியைத் தெளிவாகச் சொல்லியபடியே, மூலத்தின் வடிவத்தை தேவையின்றி தீவிரப்படுத்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான நடையுடன், வேதாகம உரைக்கு ஏற்ற கண்ணியமான தொனி. ‘தங்களுக்குள்’ மற்றும் ‘வழியில்’ ஆகியவை பேசுபயன்பாட்டுக்கும் எழுத்துநடைக்கும் ஏற்ற சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
