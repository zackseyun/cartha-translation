source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: ta
  text: ஆனால் இயேசு அவனிடம், “『உம்மால் முடியுமானால்』 என்பதா?[a] நம்புகிறவருக்கு[b] எல்லாம் சாத்தியம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லான வடிவில், “அந்த ‘உம்மால் முடியுமானால்’ என்பதா?” தந்தை முந்தைய வசனத்தில் கூறிய சொற்களை இயேசு எதிரொலித்து அவற்றுக்குச் சவால் விடுக்கிறார்.
    reason: lexical_alternative
  - marker: b
    text: “நம்புகிறவர்” என்பதை “விசுவாசிக்கிறவர்” அல்லது “நம்பிக்கை வைக்கிறவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: 『உம்மால் முடியுமானால்』 என்பதா?
  rationale: Τὸ என்ற நடுநிலைச் சுட்டுப்பெயரெச்சம், தந்தை முன்பு கூறிய சொற்றொடரை இயேசு அப்படியே எடுத்துக்காட்டிப் பதிலளிப்பதைக் குறிக்கிறது. கேள்வி வடிவம் அந்தச் சொற்களை அவர் சவாலாக எதிர்கொள்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δύνῃ
  choice: உம்மால் முடியுமானால்
  rationale: δύναμαι என்பதன் அடிப்படைப் பொருள் ‘முடியும்/ஆற்றல் உடையிருத்தல்.’ இயேசுவை நேரடியாக விளிக்கும் இச்சூழலில் மரியாதையான ஒருமை வடிவமான ‘உம்மால்’ பொருத்தமானது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: நடுநிலைப் பன்மையான πάντα இங்கு முழுமையைக் குறிக்கிறது; ‘எல்லாம்’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: δυνατὰ
  choice: சாத்தியம்
  rationale: இந்தப் பயனிலையில் δυνατά என்பது ‘செய்ய இயலும்’ அல்லது ‘நிகழக்கூடும்’ என்ற பொருளில் ‘சாத்தியம்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: τῷ πιστεύοντι
  choice: நம்புகிறவருக்கு
  rationale: நிகழ்காலப் பெயரெச்சம் பொதுவாக நம்புகிற ஒருவரைக் குறிக்கிறது. ‘நம்புகிறவர்’ என்பது பாலினத்தை முன்னிறுத்தாமல் ஒருமைப் பொதுப்பொருளையும் பெயரெச்சத் தன்மையையும் காக்கிறது.
- source_word: πιστεύοντι
  choice: நம்புகிற
  rationale: πιστεύω என்பதற்கு இச்சூழலில் ‘நம்புதல்’ நேரடியான இயல்பான இணை. ‘விசுவாசமுள்ள’ என்ற அடையாளப் பெயரைவிட, மூலத்தின் வினைச்செயல் தன்மையை இது நன்றாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘எல்லாம் சாத்தியம்’ என்பதன் வரம்பு
  choice: மூலத்தில் உள்ள முழுமையான ஒலியுடைய கூற்றை விளக்கக் கட்டுப்பாடுகள் சேர்க்காமல் வைத்தல்
  alternative: ‘கடவுளால், நம்புகிறவருக்கு எல்லாம் சாத்தியம்’ அல்லது ‘கடவுளுடைய வல்லமையின் எல்லைக்குள் எல்லாம் சாத்தியம்’ என்று விளக்கிச் சேர்த்தல்
  rationale: இவ்வசனத்தின் கிரேக்க உரையில் ‘கடவுளால்’ என்ற சொற்கள் வெளிப்படையாக இல்லை. பரந்த வேதாகமச் சூழல் இதை மனிதனின் தன்னிச்சையான ஆற்றலாகப் புரிந்துகொள்வதைத் தடுத்தாலும், இங்குள்ள கூற்றின் வலிமையையும் இறையியல் இழுவிசையையும் காக்க மொழிபெயர்ப்பில் கூடுதல் வரம்பு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நேரடிப் பேச்சு நடையிலும் வடிவமைக்கப்பட்டது. இயேசுவை நோக்கிய ஒருமை மரியாதையை ‘உம்மால்’ காக்கிறது; பொதுவான ஒருமை நபரை ‘நம்புகிறவர்’ என பாலினத்தை முன்னிறுத்தாமல் வழங்குகிறது. மேற்கோளுக்குள் மேற்கோளைத் தெளிவுபடுத்த 『 』 குறிகள் பயன்படுத்தப்பட்டுள்ளன.
