source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: ta
  text: என்மீது நம்பிக்கை வைக்கிற இந்தச் சிறியவர்களில் ஒருவரை யாராவது இடறச் செய்தால், அவருடைய கழுத்தைச் சுற்றி கழுதையால் இயக்கப்படும் பெரிய திரிகைக்கல்[a] கட்டப்பட்டு, அவர் கடலில் எறியப்படுவது அவருக்கு மேலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கழுதையால் இயக்கப்படும் பெரிய திரிகைக்கல்.
    reason: μύλος ὀνικός என்பது கையால் பயன்படுத்தப்படும் சிறிய திரிகைக்கல்லுக்கு மாறாக, கழுதையால் இயக்கப்படும் பெரிய திரிகைக்கல்லைக் குறிக்கிறது.
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: இடறச் செய்தால்
  rationale: பாவம் செய்யவைத்தல் அல்லது விசுவாசத்திலிருந்து விழச்செய்தல் ஆகிய தீவிரமான பொருள்களை உள்ளடக்கக்கூடிய மூலமொழியின் இடறல் உருவகத்தை இது தக்கவைக்கிறது.
- source_word: μικρῶν τούτων
  choice: இந்தச் சிறியவர்களில்
  rationale: இது குழந்தைகளை மட்டுமே குறிக்கிறது என்று வரையறுக்காமல், சிறியவர்களாக அல்லது பலவீனமானவர்களாகக் கருதப்படும் சீடர்களையும் உள்ளடக்கும் பரப்பைத் தக்கவைக்கிறது.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: என்மீது நம்பிக்கை வைக்கிற
  rationale: இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: அவருக்கு நல்லது
  rationale: கடுமையான எச்சரிக்கையின் ஒப்பீட்டுப் பொருளைத் தமிழில் இயல்பாகத் தருகிறது; பின்னணியில் உள்ள மாற்று விளைவைக் காட்டும் வலிமையைச் சூழல் வழங்குகிறது.
- source_word: μύλος ὀνικός
  choice: கழுதையால் சுற்றப்படும் பெரிய திரிகைக்கல்
  rationale: கையால் இயக்கப்படும் சிறிய திரிகைக்கல்லுக்கு மாறாக, கழுதையால் இயக்கப்படும் பெரிய ஆலையுருளைக் கல்லைத் தெளிவாகக் குறிக்கிறது.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: கழுத்தைச் சுற்றிக் ... கட்டப்பட்டு
  rationale: கழுத்தைச் சுற்றி அந்தக் கல் வைக்கப்படும் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: கடலில் எறியப்படுவது
  rationale: கிரேக்க நிறைவுவினையின் விளைவுநிலையைத் தமிழில் தெளிவான செயப்பாட்டு வடிவில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: ‘இந்தச் சிறியவர்கள்’ என்பதன் குறிப்பு
  choice: நம்பிக்கை வைக்கும் சிறிய அல்லது பலவீனமானவர்களையும் உள்ளடக்கும் பரந்த சொற்றொடர்
  alternative: குழந்தைகள் மட்டும்; அல்லது தாழ்மையான சீடர்கள் பொதுவாக
  rationale: ‘என்மீது நம்பிக்கை வைக்கிற’ என்ற தொடர் வயதை மட்டும் குறிக்கவில்லை. குழந்தைகள் இதில் அடங்கலாம்; ஆனால் மொழிபெயர்ப்பு குறிப்பை அவர்களுக்குள் மட்டும் சுருக்கவில்லை.
- issue: σκανδαλίζω என்பதன் ஆன்மீக வலிமை
  choice: ‘இடறச் செய்தல்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘பாவம் செய்யச் செய்தல்’ அல்லது ‘விசுவாசத்திலிருந்து விழச்செய்தல்’
  rationale: மூலச்சொல் பாவத்தில் விழுதல், விசுவாசத்திலிருந்து விலகுதல் போன்ற பல தொடர்புடைய விளைவுகளைக் குறிக்க முடியும்; அவற்றில் ஒன்றை மட்டும் மொழிபெயர்ப்பில் நிர்ணயிக்காமல் உருவகம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified மற்றும் நேரடியான நடை. ‘திரிகைக்கல்’ என்ற பரவலாக அறியப்படும் வேதாகமச் சொல், ‘கழுதையால் சுற்றப்படும் பெரிய’ என்ற விளக்கத்துடன் பயன்படுத்தப்பட்டுள்ளது.
