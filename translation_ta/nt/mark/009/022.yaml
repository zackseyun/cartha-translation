  to: அது அவனை அழிப்பதற்காகப் பலமுறை நெருப்பிற்குள்ளும் தண்ணீருக்குள்ளும் வீசியிருக்கிறது.[a] ஆனால் உங்களால் ஏதாவது செய்ய முடிந்தால், எங்கள்மேல் பரிவுகொண்டு எங்களுக்கு உதவுங்கள்.[b]
