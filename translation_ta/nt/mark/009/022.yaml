  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: ta
  text: அது அவனை அழிப்பதற்காகப் பலமுறை நெருப்பிற்குள்ளும் தண்ணீருக்குள்ளும் வீசியிருக்கிறது.[a] ஆனால் உங்களால் ஏதாவது செய்ய முடிந்தால், எங்கள்மேல் பரிவுகொண்டு எங்களுக்கு உதவுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘தண்ணீர்களில்’ என்று பன்மை வடிவம் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எங்கள்மேல் மனமிரங்கி எங்களுக்கு உதவுங்கள்’ அல்லது ‘எங்கள்மேல் இரக்கங்கொண்டு எங்களுக்கு உதவுங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: பலமுறை
  rationale: மீண்டும் மீண்டும் நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἔβαλεν
  choice: தள்ளியிருக்கிறது
  rationale: பலமுறை நடந்த கடந்தகாலச் செயலின் விளைவு தற்போதைய நிலைவரை தொடர்புடையதாக இருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: நெருப்பிலும் தண்ணீரிலும்
  rationale: இரண்டு இடங்களையும் இணையாகக் காட்டுகிறது; கிரேக்கத்தில் ὕδατα பன்மையாக இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது, ஏனெனில் ‘தண்ணீர்களில்’ என்பது இச்சூழலில் இயல்பான தமிழ் அல்ல.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: அவனை அழிப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα அமைப்பையும் ἀπόλλυμι என்பதன் அழிவுக்குரிய விரிவான பொருளையும் காக்கிறது; அதை ‘கொல்வதற்காக’ என்று குறுக்கவில்லை.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: ஆனால் உங்களால் ஏதாவது செய்ய முடிந்தால்
  rationale: τι என்பதைக் ‘ஏதாவது’ என்று வெளிப்படையாகக் காத்து, தந்தையின் தயக்கத்தையும் இயேசுவின் ஆற்றலைப் பற்றிய அவரது நிச்சயமின்மையையும் மென்மைப்படுத்தாமல் தருகிறது.
- source_word: βοήθησον ἡμῖν
  choice: எங்களுக்கு உதவுங்கள்
  rationale: உடனடி உதவிக்கான நேரடியான வேண்டுகோளை மரியாதையான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: எங்கள்மேல் பரிவுகொண்டு
  rationale: ஆழ்ந்த இரக்கத்தைக் குறிக்கும் வினையெச்சத்தின் உணர்ச்சிவலிமையையும் ‘எங்கள்மேல்’ என்ற தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: இயேசுவால் செய்ய முடியுமா என்பதைக் குறித்த தந்தையின் தயக்கம்
  choice: உங்களால் ஏதாவது செய்ய முடிந்தால்
  alternative: உங்களால் முடிந்தால்
  rationale: கிரேக்கத்தில் உள்ள τι (‘ஏதாவது’) என்பதையும் நிபந்தனையின் தயக்கமான தொனியையும் அப்படியே காக்கிறது; அதை அதிக நம்பிக்கையுள்ள அறிக்கையாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய வேண்டுகோளில் ‘உங்கள்/உதவுங்கள்’ என்ற இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
