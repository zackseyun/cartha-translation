source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: ta
  text: அவர்கள் சீடர்களிடம் வந்தபோது, சீடர்களைச் சுற்றிப் பெருந்திரளான மக்கள் இருப்பதையும், மறைநூல் அறிஞர்கள் அவர்களோடு வாக்குவாதம் செய்துகொண்டிருப்பதையும்[a] கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களோடு விவாதித்துக்கொண்டிருப்பதையும்.” கிரேக்க வினைச்சொல் கலந்துரையாடலையோ விவாதத்தையோ குறிக்கலாம்; ஆனால் இச்சூழலில் அது வாக்குவாதத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: அவர்கள் சீடர்களிடம் வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையான ἐλθόντες, முதன்மை வினையான εἶδον-க்கு முன் நிகழும் செயலைக் குறிக்கிறது. தமிழில் இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது; πρός நபர்களை நோக்கிய நகர்வைக் குறிப்பதால் ‘சீடர்களிடம்’ என வழங்கப்பட்டுள்ளது.
- source_word: εἶδον
  choice: கண்டார்கள்
  rationale: ὁράω என்பதன் எளிய இறந்தகாலக் கதைநடைப் பயன்பாடு. தேவையற்ற விரிவாக்கமின்றி நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὄχλον πολὺν
  choice: பெருந்திரளான மக்கள்
  rationale: ὄχλος மக்கள்கூட்டத்தையும் πολύς அதன் பெரிய அளவையும் குறிக்கின்றன. ‘பெருந்திரளான மக்கள்’ என்பது இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: περὶ αὐτούς
  choice: சீடர்களைச் சுற்றி
  rationale: περί இங்கு இடஞ்சார்ந்த முறையில் ‘சுற்றிலும்’ என்பதைக் குறிக்கிறது. αὐτούς என்பதன் முன்னிடத்தைத் தெளிவுபடுத்த தமிழில் ‘சீடர்களை’ மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: இச்சொல் யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சிபெற்ற எழுத்தறிஞர்களைக் குறிக்கிறது. மரபுவழி ‘வேதபாரகர்’ என்பதைவிட ‘வேத அறிஞர்கள்’ நவீன வாசகர்களுக்குத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: அவர்களோடு வாக்குவாதம் செய்துகொண்டிருப்பதையும்
  rationale: συζητέω கலந்துரையாடல் முதல் சர்ச்சைக்குரிய வாதம் வரை பொருள்கொள்ளலாம். இச்சூழலின் மோதல் தன்மையை ‘வாக்குவாதம்’ வெளிப்படுத்துகிறது; தொடர்ச்சியான செயலை ‘செய்துகொண்டிருப்பது’ காட்டுகிறது. αὐτούς என்பது சீடர்களைக் குறிக்கிறது.
