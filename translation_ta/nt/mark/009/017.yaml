source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: ta
  text: 'கூட்டத்திலிருந்த ஒருவர் அவருக்குப் பதிலளித்தார்: “போதகரே, பேசாத ஆவியைக் கொண்டிருக்கும் என் மகனை உங்களிடம் கொண்டுவந்தேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மகனைப் பேச முடியாதவனாக்கும் ஒரு ஆவியைக் கொண்டிருக்கும்.”
    reason: ‘பேசாத’ என்பது இலக்கணப்படி ‘ஆவி’யைத் தழுவுகிறது; ஆனால் நிகழ்ச்சிச் சூழலில் அந்த ஆவி மகனுக்குப் பேச இயலாமையை உண்டாக்குகிறது என்ற பொருளும் உள்ளது.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: பதிலுரைக்கும் செயலைக் குறிக்கும் வழக்கமான கதைநடைச் சொல்; தேவையற்ற விரிவாக்கமின்றி கிரேக்க நற்செய்தி மரபைத் தக்கவைக்கிறது.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: கூட்டத்திலிருந்த ஒருவர்
  rationale: கூட்டத்தைச் சேர்ந்த அடையாளம் குறிப்பிடப்படாத ஒருவரை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘ஒரு மனிதர்’ என்பதைச் சேர்க்கவில்லை.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை மரியாதையுடன் அழைக்கும் இயல்பான தமிழ் விளிப்பெயர்; ‘எஜமானே’ என்பதில் தோன்றக்கூடிய கூடுதல் அதிகாரப் பொருளைத் தவிர்க்கிறது.
- source_word: ἤνεγκα
  choice: கொண்டுவந்தேன்
  rationale: இறந்தகால ஒருமுறைச் செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: υἱόν
  choice: என் மகனை
  rationale: வயதை ஊகிக்காமல், மூலத்தில் முன்னிலைப்படுத்தப்பட்ட தந்தை–மகன் உறவைப் பாதுகாக்கிறது.
- source_word: πρὸς σέ
  choice: உங்களிடம்
  rationale: கொண்டுவருதல் என்ற வினையுடன் πρός என்பதன் திசை/அணுகல் பொருளை நவீன மரியாதைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἔχοντα
  choice: ஆவியுள்ள
  rationale: ‘என் மகன்’ என்பதைத் தழுவும் கிரேக்கப் பெயரெச்சக் கட்டமைப்பைச் சுருக்கமான தமிழ் பெயரெச்ச வடிவில் பிரதிபலிக்கிறது; காரணப்பொருளை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: πνεῦμα ἄλαλον
  choice: பேசாத ஓர் ஆவி
  rationale: ἄλαλον என்பது இலக்கணப்படி ‘ஆவி’ என்பதையே தழுவுவதைக் காக்கிறது; அந்த ஆவி மகனைப் பேச முடியாதவனாக்குகிறது என்ற சூழல்சார் புரிதலை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: பேயோட்டும் நிகழ்வில் πνεῦμα என்பதன் பொருள்
  choice: ஆவி
  alternative: தீய ஆவி / பேய்
  rationale: சூழல் தீய அல்லது பேய்த்தன்மையுள்ள ஆவியைச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்க உரை ‘ஆவி’ என்று மட்டுமே கூறுகிறது. ஆகவே முதன்மை உரையில் ‘தீய’ அல்லது ‘பேய்’ என்பதைச் சேர்க்காமல் மூலத்தின் வெளிப்பாட்டையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: ἄλαλον யாருடைய பேசாமையைக் குறிக்கிறது
  choice: இலக்கணப்படி பேசாதது ஆவி என முதன்மை உரையில் வைத்தல்
  alternative: மகனைப் பேச முடியாதவனாக்கும் ஆவி
  rationale: ἄλαλον என்பது πνεῦμα என்பதுடன் இலக்கண ஒத்திசைவு கொண்டது. ஆயினும் நிகழ்ச்சிச் சூழலில் அதன் விளைவு மகனின் பேச இயலாமை என்பதும் சாத்தியம்; அதனை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதைக்கு ‘உங்களிடம்’ பயன்படுத்தப்பட்டது. ‘ஊமை’ போன்ற நபரை முத்திரையிடக்கூடிய சொல்லுக்குப் பதிலாக ‘பேசாத’ எனத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
