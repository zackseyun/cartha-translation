id: MRK.9.18
reference: Mark 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: ta
  text: அது அவனை எங்கே பிடித்தாலும், அவனைத் தரையில் வீழ்த்துகிறது; அவன் நுரைத்து, பற்களை அரைத்து, உடல் விறைத்துப்போகிறான்[a]. அதை வெளியேற்றும்படி உம்முடைய சீடர்களிடம் சொன்னேன்; ஆனால் அவர்களால் முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலர்கிறான்,” “வாடிப்போகிறான்,” அல்லது “மெலிந்துபோகிறான்.” கிரேக்கச் சொல்லின் நேரடிப் பொருள் “உலர்கிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: எங்கே ... பிடித்துக்கொண்டாலும்
  rationale: இது வரையறுக்கப்படாத இடம் அல்லது மீண்டும் நிகழும் சூழலைக் குறிக்கிறது. ‘எங்கே ... ஆனாலும்’ என்ற அமைப்பு கிரேக்கத்தின் ‘wherever’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: καταλάβῃ
  choice: பிடித்துக்கொண்டாலும்
  rationale: தீய ஆவி சிறுவனை வலுக்கட்டாயமாக ஆட்கொள்வதைச் சுட்டும் வகையில், ‘பிடித்துக்கொள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ῥήσσει
  choice: தரையில் வீழ்த்துகிறது
  rationale: இச்சூழலில் சிறுவனை வன்மையாகக் கீழே தள்ளும் செயலைக் குறிக்கிறது. ‘கிழிக்கிறது’ என்பது உடலில் காயம் ஏற்படுத்துவதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: ἀφρίζει
  choice: வாயில் நுரை தள்ளி
  rationale: கிரேக்க வினைச்சொல் ‘நுரைக்கிறான்’ என்று பொருள்படும். நவீன தமிழில் உடல் அறிகுறியைத் தெளிவாகவும் இயல்பாகவும் கூற ‘வாயில் நுரை தள்ளி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τρίζει τοὺς ὀδόντας
  choice: பற்களைக் கடித்து
  rationale: பற்களை அரைக்கும் அல்லது நறநறவென்று கடிக்கும் உடல் அறிகுறியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ξηραίνεται
  choice: உடல் விறைத்துப்போகிறான்
  rationale: இந்த அறிகுறித் தொடரில் உடல் இறுகி விறைப்பதைக் குறிக்கும் சூழல்சார் புரிதல் முதன்மை உரையில் தரப்பட்டுள்ளது. சொல்லின் நேரடிப் பொருளான ‘உலர்ந்துபோகிறான்’ உள்ளிட்ட சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: εἶπα
  choice: சொன்னேன்
  rationale: சீடர்களிடம் விடுக்கப்பட்ட வேண்டுகோள் அல்லது அறிவுறுத்தலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐκβάλωσιν
  choice: துரத்திவிடும்படி
  rationale: தீய ஆவியை ஒருவரிடமிருந்து வெளியேற்றுவதைக் குறிக்கும் பேயோட்டுதல் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ἴσχυσαν
  choice: அவர்களால் முடியவில்லை
  rationale: அவர்களுக்கு அதைச் செய்யும் ஆற்றல் அல்லது திறன் இல்லாதிருந்ததை, காரணத்தை மேலதிகமாக விளக்காமல், இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐκβάλωσιν என்பதன் பொருளாகிய αὐτό என்ற பிரதிப்பெயரின் சுட்டுப்பொருள்
  choice: சிறுவனைத் துன்புறுத்தும் தீய ஆவியையே ‘அதை’ என்பது குறிக்கிறது.
  alternative: ‘அதை’ என்பது பொதுவாக அவனது துன்பத்தைக் குறிக்கலாம்.
  rationale: உடனடி கதைச்சூழல் சிறுவனைப் பிடித்து வாட்டும் ஆவியையும், அதை வெளியேற்ற சீடர்கள் முயன்றதையும் பற்றியது. ‘அதைத் துரத்திவிட’ என்பது கிரேக்கப் பிரதிப்பெயரையும் பேயோட்டுதல் சூழலையும் பாதுகாக்கிறது.
- issue: ξηραίνεται என்பதன் துல்லியமான நுண்பொருள்
  choice: சூழலுக்கு ஏற்ப ‘உடல் விறைத்துப்போகிறான்’ என்று முதன்மை உரையில் தரப்பட்டுள்ளது.
  alternative: ‘உலர்ந்துபோகிறான்,’ ‘வாடிப்போகிறான்,’ அல்லது ‘மெலிந்துபோகிறான்.’
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘உலர்தல்/வாடுதல்’ என்றாலும், வலிப்பின் அறிகுறித் தொடரில் இது உடல் விறைப்பதைக் குறிக்கலாம். உண்மையான சொற்பொருள் ஐயத்தை மறைக்காமல் அடிக்குறிப்பு தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிப் பேசுவதால் ‘உம்முடைய’ என்ற மரியாதை வடிவம் வைக்கப்பட்டுள்ளது. உடல் அறிகுறிகள் தெளிவான தொடராக அமைக்கப்பட்டுள்ளன; ξηραίνεται என்பதிலுள்ள பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
