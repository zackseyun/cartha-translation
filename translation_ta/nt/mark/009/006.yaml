  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: ta
  text: ஏனெனில், என்ன பதில் சொல்வது என்று அவனுக்குத் தெரியவில்லை[a]; ஏனெனில், அவர்கள் திகிலடைந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறுமொழியாக என்ன சொல்வது.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, நிலையை முன்னிறுத்தி, ‘அவர்கள் திகிலடைந்திருந்தார்கள்.’ கிரேக்கத்தில் அவர்கள் அந்த நிலையை அடைந்தார்கள் என்ற நுணுக்கம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: தெரியவில்லை
  rationale: οἶδα அறிவையோ விழிப்புணர்வையோ குறிக்கிறது; οὐ என்பதுடன் தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘தெரியவில்லை’ என்று வருகிறது.
- source_word: τί ἀποκριθῇ
  choice: என்ன பதில் சொல்வது
  rationale: ἀποκρίνομαι வெறுமனே பேசுவதைக் காட்டாமல் பதிலளிப்பதைக் குறிக்கிறது. τί உடன் வரும் ஆலோசனைப் பொருளை ‘என்ன பதில் சொல்வது’ இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔκφοβοι
  choice: திகிலடைந்தார்கள்
  rationale: ἔκφοβος சாதாரண பயத்தைவிடக் கடுமையான அச்சத்தைக் குறிக்கிறது; ‘திகிலடைந்தார்கள்’ அந்த வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐγένοντο
  choice: அடைந்தார்கள்
  rationale: γίνομαι ஒரு நிலைக்குள் வந்ததைச் சுட்டுகிறது. ‘திகிலடைந்தார்கள்’ என்பதிலுள்ள ‘அடைந்தார்கள்’ அந்த மாற்றத்தைத் தக்கவைக்கிறது.
- source_word: γὰρ ... γὰρ
  choice: ஏனெனில் ... ஏனெனில்
  rationale: இரண்டு γάρ சொற்களும் விளக்கக் காரணங்களை அறிமுகப்படுத்துகின்றன. இரண்டையும் மொழிபெயர்ப்பது கிரேக்க உரையின் தொடரமைப்பையும் காரணச் சங்கிலியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பன்மை வாக்கியத்தின் எழுவாய்
  choice: அவர்கள் திகிலடைந்தார்கள்
  alternative: அவன் திகிலடைந்தான்
  rationale: ἔκφοβοι என்ற பெயரடைவும் ἐγένοντο என்ற வினையும் பன்மையில் உள்ளன. சூழலில் இது பேதுருவையும் அவனுடன் இருந்தவர்களையும் குறிக்கிறது; ஒருமையாக மாற்றுவதற்கு இலக்கண ஆதாரம் இல்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும்படியும், அதே நேரத்தில் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. மீண்டும் வரும் γάρ இருமுறையும் ‘ஏனெனில்’ என்று வைக்கப்பட்டு மூலத்தின் விளக்கத் தொடரமைப்பு பாதுகாக்கப்பட்டுள்ளது.
