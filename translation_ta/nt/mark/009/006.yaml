  source_fidelity: 'The Tamil accurately represents οὐ γὰρ ᾔδει τί ἀποκριθῇ: “அவனுக்குத் தெரியவில்லை” conveys the imperfective/contextual sense of not knowing, and “என்ன பதில் சொல்வது” retains the deliberative sense and the reply-specific force of ἀποκριθῇ. “அவர்கள் திகிலடைந்தார்கள்” correctly preserves the plural subject and conveys both the intensified fear of ἔκφοβοι and the entry into that state indicated by ἐγένοντο. Both explanatory γάρ clauses are represented.'
