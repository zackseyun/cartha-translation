source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “எலியா முதலில் வர வேண்டும் என்று மறைநூல் அறிஞர்கள் ஏன் சொல்கிறார்கள்?[a]” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எலியா முதலில் வர வேண்டும் என்று மறைநூல் அறிஞர்கள் சொல்வது எப்படி?”
    reason: Ὅτι இச்சூழலில் “ஏன்” என்றும் “எப்படி அப்படிச் சொல்கிறார்கள்?” என்றும் புரிந்துகொள்ளப்படக்கூடிய மொழியியல் மாற்றுவாய்ப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், அவர்கள் கேட்ட செயல் தொடர்ந்து நடைபெற்றதைச் சுட்டுகிறது; கிரேக்க இறந்தகாலத் தொடர்நிலையின் இயல்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: கேள்வியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இப்பெயரெச்சத்தை, தமிழின் இயல்பான நேர்கூற்று அமைப்பில் “என்று” என இணைத்துள்ளது.
- source_word: Ὅτι
  choice: ஏன்
  rationale: இங்கு ὅτι கேள்வியை அறிமுகப்படுத்தி, “ஏன்/எப்படி அப்படிச் சொல்கிறார்கள்?” என்ற பொருளைத் தருகிறது. முதன்மை உரையில் இயல்பான “ஏன்” பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: யூத மறைநூல்களையும் சட்டத்தையும் ஆய்ந்து கற்பித்த வரலாற்றுப் பணியை, பழமையான தொழிற்பெயரைப் பயன்படுத்தாமல் நவீன வாசகர்களுக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἠλίαν
  choice: எலியா
  rationale: இப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: δεῖ
  choice: வர வேண்டும்
  rationale: δεῖ வெளிப்படுத்தும் அவசியத்தை “வேண்டும்” நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ἐλθεῖν
  choice: வர
  rationale: தீர்க்கதரிசனச் சூழலில் “வருதல்” என்பதே நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: πρῶτον
  choice: முதலில்
  rationale: கால வரிசையில் முன்னுரிமையைக் குறிக்கும் கிரேக்கச் சொல்லை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ὅτι அறிமுகப்படுத்தும் சீடர்களின் கேள்வியின் வலிமை
  choice: மறைநூல் அறிஞர்களின் கூற்றுக்கான காரணத்தை விசாரிக்கும் நேரடியான “ஏன்” கேள்வியாக வழங்கப்பட்டது.
  alternative: “எலியா முதலில் வர வேண்டும் என்று மறைநூல் அறிஞர்கள் சொல்வது எப்படி?”
  rationale: இவ்விடத்தில் ὅτι சொற்பொருளான “என்று” என்பதைவிட, “ஏன்” அல்லது “எப்படி அப்படிச் சொல்கிறார்கள்?” என்ற கேள்வித் தன்மையைக் கொண்டுள்ளது. முதன்மை உரை தெளிவைக் கொடுக்கிறது; அடிக்குறிப்பு உண்மையான மொழியியல் மாற்றுவாய்ப்பைப் பாதுகாக்கிறது.
- issue: எலியாவின் வருகையின் இயல்பு
  choice: “எலியா முதலில் வர வேண்டும்” என்று மட்டுமே கூறப்பட்டது.
  alternative: “எலியா மீண்டும் முதலில் வர வேண்டும்” அல்லது “மேசியாவுக்கு முன் எலியா வர வேண்டும்”
  rationale: கிரேக்க உரை “மீண்டும்” என்றோ, யாருக்கு முன் என்றோ இவ்வசனத்தில் வெளிப்படையாகக் கூறவில்லை. எனவே சூழல்சார்ந்த விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. “வேதபாரகர்” போன்ற இன்றைய பொதுவாசகருக்குப் பழமையாகத் தோன்றக்கூடிய சொல்லுக்கு மாற்றாக “மறைநூல் அறிஞர்கள்” பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் “சொல்லி கேட்டார்கள்” என்ற அமைப்பு தமிழில் செயற்கையாக ஒலிக்காதபடி நேர்கூற்று + “என்று கேட்டுக்கொண்டிருந்தார்கள்” என இயல்பாக்கப்பட்டுள்ளது.
