  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: ta
  text: ஆனால் இயேசு அவனுடைய கையைப் பிடித்து, அவனை எழுப்பினார்[a]; அவன் எழுந்து நின்றான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனைத் தூக்கி நிறுத்தினார்.’ ‘எழுப்பினார்’ என்பதற்கான கிரேக்க வினைச்சொல் தூக்கத்திலிருந்தோ மரணத்திலிருந்தோ எழுப்புவதைக் குறிக்கும் சூழல்களிலும் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவன் எழுந்தான்’ அல்லது ‘அவன் எழுந்து நின்றான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சிறுவன் இறந்துவிட்டான் என்று மக்கள் கூறியதற்கும் இங்கு இயேசு செயல்படுவதற்கும் இடையிலான மென்மையான எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κρατήσας
  choice: பிடித்து
  rationale: இயேசு சிறுவனுடைய கையை உடல்ரீதியாகப் பற்றிக்கொண்ட செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘இறுகப் பற்றிக்கொண்டு’ என்பது மூலத்தில் இல்லாத வன்மையைச் சேர்க்கக்கூடும்.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: அவனுடைய கையை
  rationale: χείρ என்பதன் குறிப்பான பொருளாகிய ‘கை’ என்பதைக் காத்து, κρατέω உடன் வரும் வேற்றுமை அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἤγειρεν
  choice: அவனை எழுப்பினார்
  rationale: தரையிலிருந்த சிறுவனை இயேசு எழும்பச் செய்தார் என்ற உடனடிப் பொருளைத் தருகிறது; அதேவேளையில், தூக்கத்திலிருந்தோ மரணத்திலிருந்தோ எழுப்புவதற்கும் பயன்படும் வினைச்சொல்லின் விரிவான ஒலிப்பையும் முற்றிலும் நீக்கவில்லை.
- source_word: ἀνέστη
  choice: அவன் எழுந்து நின்றான்
  rationale: இயேசு எழுப்பியதன் விளைவாகச் சிறுவன் எழுந்து நிற்கும் நிறைவுற்ற அசைவைத் தெளிவான நவீன தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ἤγειρεν / ἀνέστη என்ற சொற்களில் இருக்கக்கூடிய உயிர்த்தெழுதல் சார்ந்த ஒலிப்பு
  choice: சூழலுக்கேற்ற சாதாரண உடல் எழுச்சியை முதன்மைப்படுத்தி, ‘எழுப்பினார்’ / ‘எழுந்து நின்றான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தூக்கி நிறுத்தினார்; அவன் நின்றான்’ என்று உயிர்த்தெழுதல் சார்ந்த எந்த ஒலிப்பையும் தவிர்த்தல், அல்லது ‘எழுப்பினார்; அவன் எழுந்தான்’ என்று சொல் ஒற்றுமையை மேலும் முன்னிறுத்தல்
  rationale: இங்கு சிறுவன் பேய் நீக்கப்பட்ட பின் தரையிலிருந்து எழுவதுதான் நேரடிச் சூழல்; மரித்தோரிலிருந்து உயிர்த்தெழுதல் வெளிப்படையாகக் கூறப்படவில்லை. ஆனாலும் இந்தக் கிரேக்க வினைச்சொற்கள் பிற இடங்களில் தூக்கத்திலிருந்தும் மரணத்திலிருந்தும் எழுவதைக் குறிக்கலாம். ஆகவே சூழலின் இயல்பான பொருளைக் காத்தபடியே அந்தச் சொற்பொருள் ஒலிப்பை முற்றிலும் அழிக்காத வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எழுந்தருளினார்’ போன்ற உயர்திணை அல்லது பழமையான சமயநடை தவிர்க்கப்பட்டது. இரண்டு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் வினைச்சொற்களுக்கு உடனடியாகப் பின்னர் வைக்கப்பட்டுள்ளன.
