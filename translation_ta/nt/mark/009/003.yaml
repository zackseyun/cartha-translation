source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: ta
  text: அவருடைய ஆடைகள் பளபளப்பாகவும் மிகவும் வெண்மையாகவும் ஆயின; பூமியில் எந்தத் துணி வெளுப்பவராலும் அவ்வளவு வெண்மையாக்க முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணியைச் சுத்தம் செய்து வெளுப்பவர்.” பழைய பயன்பாட்டில் இத்தொழிலாளர் “fuller” என அழைக்கப்பட்டார்.
    reason: γναφεύς என்பதற்கான தொழில்சார் lexical alternative-ஐக் குறிக்கிறது.
lexical_decisions:
- source_word: ἱμάτια
  choice: ஆடைகள்
  rationale: பொதுவாக உடைகளைக் குறிக்கும் சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது; குறிப்பிட்ட வகை மேலங்கியைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: ἐγένετο
  choice: ஆயின
  rationale: தோற்றமாற்றக் காட்சியில் ஏற்பட்ட நிலைமாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: στίλβοντα
  choice: பளபளத்து
  rationale: பிரகாசமாக மின்னும் காட்சித்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உரையில் இல்லாத இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: λευκὰ λίαν
  choice: மிகவும் வெண்மையாயின
  rationale: வெண்மை என்ற அடிப்படை நிறப்பொருளையும் λίαν தரும் வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: γναφεύς
  choice: துணி வெளுப்பவர்
  rationale: துணியைச் சுத்தப்படுத்தி வெண்மையாக்கும் தொழிலை இன்றைய வாசகர் புரிந்துகொள்ளும் வகையில் கூறுகிறது; தெளிவற்ற மரபுத் தொழிற்பெயரைத் தவிர்க்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: மனித உலகில் உள்ள திறனுடன் செய்யப்படும் ஒப்பீட்டைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: எவராலும் வெளுக்க முடியாத அளவுக்கு
  rationale: அத்தகைய அளவு வெண்மையாக்கும் திறன் யாருக்கும் இல்லை என்ற ஒப்பீட்டுப் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: உருமாற்றத்தின்போது ஆடைகளில் காணப்பட்ட விளைவு
  choice: ஆடைகள் இயற்கைக்கு அப்பாற்பட்ட விதத்தில் பளபளத்து மிக வெண்மையானதாக ஆன காட்சியை மட்டும் விவரித்தல்
  alternative: “மகிமையால் ஒளிவீசின” போன்ற விளக்கவுரை சார்ந்த சொற்களைச் சேர்த்தல்
  rationale: இந்த வசனம் ஆடைகளின் கண்ணுக்குப் புலப்பட்ட தோற்றத்தை விவரிக்கிறது; அதன் இறையியல் பொருளை வெளிப்படையாக விளக்கவில்லை. ஆகவே உரையில் இல்லாத கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் தீவிரமான காட்சித்தன்மையைப் பாதுகாக்க “பளபளத்து” மற்றும் “மிகவும் வெண்மையாயின” பயன்படுத்தப்பட்டுள்ளன; தொழில்நுட்பமான அல்லது காலாவதியான தொழிற்பெயருக்குப் பதிலாக “துணி வெளுப்பவர்” எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
