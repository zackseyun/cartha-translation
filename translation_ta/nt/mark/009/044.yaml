translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் மொழிபெயர்க்கப்பட்டது. ‘அவர்களுடைய புழு’ என்ற நேரடி உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது; அரைப்புள்ளி இரு இணை உருவகங்களையும் தெளிவாகப் பிரிக்கிறது.
