  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ta
  text: அங்கே[a] அவர்களுடைய புழு சாவதில்லை; நெருப்பும் அணைவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் (நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்டிகஸ், வத்திக்கானஸ் உட்பட) மற்றும் பழங்கால காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் ஐந்தாம் நூற்றாண்டைச் சேர்ந்த அலெக்சாந்திரினஸ் பிரதியிலும், லத்தீன் மரபிலும், பிற்கால பைசாந்தியப் பெரும்பான்மைப் பிரதிகளிலும் உள்ளது. 48ஆம் வசனத்திலுள்ள அதே சொற்றொடரைத் திரும்பக் கூறும் வகையில், இது பிற்காலத்தில் எழுத்தரால் சேர்க்கப்பட்டிருக்க வாய்ப்பு அதிகம்.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: புழு
  rationale: அழுகும் பொருளைத் தின்னும் புழு அல்லது புழுப்பூச்சியைக் குறிக்கிறது. ஏசாயா 66:24-இன் உருவகத்துடன் உள்ள தொடர்பையும் கிரேக்கச் சொல்லின் நேரடியான பொருளையும் ‘புழு’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: τελευτᾷ
  choice: சாவதில்லை
  rationale: τελευτάω என்பது முடிவுக்கு வருதல் அல்லது இறத்தல் என்று பொருள்படும். உயிரினமான புழுவைப் பற்றிய இச்சூழலில் ‘சாவதில்லை’ என்பது இயல்பான, தெளிவான மொழிபெயர்ப்பு.
- source_word: σβέννυται
  choice: அணைவதில்லை
  rationale: இது அணைக்கப்படுதல் அல்லது அணைந்துபோதல் என்ற பொருளுடைய நிகழ்காலச் செயப்பாட்டு வடிவம். தமிழில் நெருப்பைப் பற்றிப் பேசும்போது ‘அணைவதில்லை’ என்பது செயப்பாட்டு அர்த்தத்தை இயல்பாக வெளிப்படுத்தி, தொடர்ச்சியான நிலையையும் காக்கிறது.
