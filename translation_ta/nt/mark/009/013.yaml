  verdict: revise
  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: எதிர்மறைத் தொடர்பு, எலியாவின் நிறைவுற்ற வருகை, மக்கள் தங்கள் விருப்பம்போல் செய்த செயல், மேலும் அவரைக் குறித்த எழுத்தின் ஒப்புமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் தற்போதைய தமிழில் ‘அவரைக் குறித்து எழுதப்பட்டிருக்கிறபடியே’ என்ற கூறு, கிரேக்கத்தில் இறுதியில் வரும் ‘அவரைப் பற்றி எழுதப்பட்டிருக்கிறபடியே’ என்பதற்கு முன் நகர்த்தப்பட்டுள்ளது. பொருள் பெரிதாக மாறாவிட்டாலும், உகந்த-சமமான மொழிபெயர்ப்பில் மூலத்தின் முன்னேற்றத்தைப் பின்பற்றுவது சிறந்தது.'
  naturalness: ‘தாங்கள் விரும்பியதையெல்லாம் அவருக்குச் செய்தார்கள்’ என்பது புரிந்துகொள்ளத்தக்கது; ஆனால் ‘அவருக்குத் தாங்கள் விரும்பியதையெல்லாம் செய்தார்கள்’ என அமைத்தால் நவீனத் தமிழில் வாக்கிய ஓட்டம் இயல்பாகும். இறுதியில் ‘அவரைக் குறித்து எழுதப்பட்டிருக்கிறபடியே’ வருவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
