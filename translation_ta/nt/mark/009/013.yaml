source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எலியாவும் வந்துவிட்டார்[a]. அவர்கள் அவருக்குத் தாங்கள் விரும்பியதையெல்லாம் செய்தார்கள், அவரைக் குறித்து எழுதப்பட்டிருக்கிறபடியே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, திருமுழுக்கு யோவானின் ஆளுமையிலும் பணியிலும் எலியா ஏற்கெனவே வந்துவிட்டார்; மாற்கு 9:11–12-ஐப் பார்க்கவும்; மத்தேயு 11:14; 17:12–13-ஐ ஒப்பிடவும்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: சீடர்களின் எதிர்பார்ப்புக்கு மாறான இயேசுவின் கூற்றை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: தனிப்பட்ட நேரடி உரையையும் பன்மை முன்னிலையையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: எலியாவும் வந்துவிட்டார்
  rationale: καὶ என்பதன் ‘-உம்’ பொருளையும், ἐλήλυθεν என்னும் நிறைவுற்ற வருகையின் தற்போதைய பொருத்தத்தையும் ‘வந்துவிட்டார்’ வெளிப்படுத்துகிறது.
- source_word: ἐποίησαν αὐτῷ
  choice: அவருக்குச் செய்தார்கள்
  rationale: ποιέω + வேற்றுமை உருபின் திறந்த பொருளை அடுத்துள்ள ‘விரும்பியதையெல்லாம்’ என்ற தொடருடன் சேர்த்து, தேவையற்ற விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ὅσα ἤθελον
  choice: தாங்கள் விரும்பியதையெல்லாம்
  rationale: கட்டுப்பாடற்ற அளவைக் குறிக்கும் ὅσα என்பதையும் அவர்கள் விருப்பத்தின்படி நடந்ததையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டிருக்கிறபடியே
  rationale: வேத எழுத்தைக் குறிக்கும் நிலையான நிறைவு வினைச்சொல் வடிவையும் ஒப்பீட்டுத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: ἐπ’ αὐτόν
  choice: அவரைக் குறித்து
  rationale: γράφω உடன் வரும் ἐπί + குற்றுவேற்றுமைக்கு இங்கு இயல்பான ‘அவரைப் பற்றி/அவரைக் குறித்து’ என்ற பொருளை அளிக்கிறது; ‘அவருக்கு எதிராக’ என்ற சாத்தியத்தைச் சூழல் குறைவாக ஆதரிக்கிறது.
theological_decisions:
- issue: இந்தக் கூற்றில் எலியாவின் அடையாளம்
  choice: முதன்மை உரையில் ‘எலியா’ என்ற பெயரையே வைத்து, அடையாளத்தை விளக்கிச் சேர்க்காமல் விடுதல்.
  alternative: இங்கு எலியா என்பது திருமுழுக்கு யோவானின் ஆளுமையையும் பணியையும் குறிக்கிறது என்று முதன்மை உரையிலேயே வெளிப்படையாகக் கூறுதல்.
  rationale: கிரேக்க மூலவசனம் எலியாவை மட்டுமே பெயரிடுகிறது. சூழலில் இது திருமுழுக்கு யோவானைக் குறிக்கிறது என்று புரிந்துகொள்ளப்பட்டாலும், அந்தத் தொடர்பு விளக்கக் குறிப்பில் தரப்படுவது பொருத்தம்; வசனத்தின் உள்ளேயே இறையியல் பதற்றத்தைத் தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசிக்கான மரியாதைப் பன்மை தமிழின் இயல்புக்கு ஏற்ப பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத அடையாள விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
