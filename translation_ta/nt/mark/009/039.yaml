source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: ta
  text: ஆனால் இயேசு, “அவனைத் தடுக்காதீர்கள். ஏனெனில், என் பெயரில் வல்ல செயல்[a] ஒன்றைச் செய்யும் எவரும் விரைவிலேயே என்னைப் பழித்துப் பேச[b] முடியாது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்புதம்” அல்லது “வல்லமையின் செயல்”; கிரேக்கத்தில், “வல்லமை/வல்ல செயல்” (δύναμιν).
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைப் பற்றி தீமையாகப் பேச” அல்லது “என்னை அவதூறாகப் பேச”; கிரேக்கத்தில், “என்னைப் பற்றி தீமையாகப் பேச.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: தடுக்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை இங்கு தடை விதிக்கும் பொருளுடையது. சீடர்கள் அந்த மனிதனின் செயலை நிறுத்த முயன்ற சூழலில் ‘தடுக்காதீர்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: δύναμιν
  choice: வல்ல செயல்
  rationale: δύναμις என்பதன் அடிப்படைப் பொருளான வல்லமைக்கும், நற்செய்தி நூல்களில் அது குறிக்கும் அசாதாரண வல்ல செயலுக்கும் இடையிலுள்ள தொடர்பை இது காக்கிறது; ‘அற்புதம்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயரைச் சொல்லி அல்லது அவரது அதிகாரத்தின் அடிப்படையில் செயற்படுவதைக் குறிக்கும் இச்சொற்றொடருக்கு இது தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: ταχὺ
  choice: விரைவிலேயே
  rationale: இது பேசும் முறையின் வேகத்தை அல்ல, வல்ல செயலைச் செய்ததற்கு அடுத்த குறுகிய காலத்திற்குள் அவ்வாறு பேசுவதைக் குறிக்கிறது.
- source_word: κακολογῆσαί
  choice: என்னைக் குறித்து தீமையாகப் பேச
  rationale: வினைச்சொல்லின் நேரடிப் பொருளான ஒருவரைப் பற்றி மோசமாக அல்லது பழித்துப் பேசுதல் என்பதை இது காக்கிறது; ‘அவதூறு கூறுதல்’ அல்லது ‘சபித்தல்’ போன்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: எவனும் ... முடியாது
  rationale: கிரேக்கத்தின் ‘அப்படிப்பட்டவர் ஒருவரும் இல்லை’ என்ற முழுமையான மறுப்பை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: δυνήσεται
  choice: முடியாது
  rationale: எதிர்காலத்தில் அவ்வாறு செய்யக்கூடிய திறன் அல்லது சாத்தியத்தை மறுக்கும் δυνήσεται என்பதன் பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இயேசுவின் பெயரில் செய்யப்படும் செயலின் தன்மை
  choice: δύναμιν என்பதை ‘வல்ல செயல்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அற்புதம்’ அல்லது ‘வல்லமையின் செயல்’
  rationale: மூலச்சொல்லின் வல்லமை/வல்ல செயல் என்ற பொருள் வரம்பைக் காத்து, நவீன வாசகர் ‘அற்புதம்’ என்பதற்கு அளிக்கக்கூடிய குறுகிய வரையறையைத் திணிக்காமல் விடுகிறது.
- issue: இயேசுவோடு அந்த மனிதனுக்குள்ள தொடர்பு
  choice: அவன் இயேசுவின் பெயரில் வல்ல செயல் செய்கிறான் என்றும், விரைவில் இயேசுவைக் குறித்து தீமையாகப் பேச முடியாது என்றும் மட்டும் கூறுதல்
  alternative: அவனை முழுமையான சீடன் என்றோ, வெறும் வாய்ப்பைப் பயன்படுத்துபவன் என்றோ விளக்கிப் பராபரித்தல்
  rationale: வசனம் கூறும் வரம்புக்குள் மொழிபெயர்ப்பு நிற்கிறது; அவனுடைய சீடத்துவம் அல்லது கோட்பாட்டு நிலை குறித்து மூலத்தில் இல்லாத தீர்ப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வல்ல செயல்’ வேதாகமச் சூழலுக்கு ஏற்ற உயர்நடையைக் கொண்டிருந்தாலும் எளிதில் புரியும். அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
