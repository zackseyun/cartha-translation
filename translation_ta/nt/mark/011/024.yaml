source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: ta
  text: 'ஆகவே, நான் உங்களுக்குச் சொல்கிறேன்: நீங்கள் ஜெபித்து கேட்பவை எவையாயினும்[b], அவற்றைப் பெற்றுக்கொண்டீர்கள் என்று நம்புங்கள்[a]; அவை உங்களுக்குக் கிடைக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளின் வாசகம் அல்லது அதற்கான புரிதல், ‘பெற்றுக்கொண்டீர்கள்’ என்பதற்குப் பதிலாக ‘பெற்றுக்கொள்கிறீர்கள்’ என்று மொழிபெயர்க்கப்படலாம். இங்கு பின்பற்றப்பட்டுள்ள கிரேக்க வாசகம் நிறைவுற்ற செயலைக் குறிக்கும் ‘பெற்றுக்கொண்டீர்கள்’ என்பதாகும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நீங்கள் ஜெபித்து எவற்றையெல்லாம் கேட்கிறீர்களோ’.
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட விசுவாசத்தைப் பற்றிய போதனையிலிருந்து இந்த முடிவுரை தொடர்வதை இயல்பாகக் காட்டுகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான, அதிகாரமுள்ள உரையாடல் வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πάντα ὅσα
  choice: எவையாயினும்
  rationale: கிரேக்கச் சொற்றொடரின் விரிவான, அனைத்தையும் உள்ளடக்கும் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: ஜெபித்து கேட்பவை
  rationale: ‘ஜெபித்தல்’ மற்றும் ‘கேட்டல்’ ஆகிய இரு வினைகளையும் வெளிப்படையாக வைத்துக்கொண்டு, தமிழில் இயல்பான தொடர்பை உருவாக்குகிறது.
- source_word: πιστεύετε
  choice: நம்புங்கள்
  rationale: பின்வரும் ὅτι உட்பிரிவின் உள்ளடக்கத்தை உண்மையென ஏற்கும்படி கூறும் கட்டளையை நேரடியாகத் தருகிறது.
- source_word: ἐλάβετε
  choice: பெற்றுக்கொண்டீர்கள்
  rationale: அறிவிப்புப் பிரதியில் உள்ள இறந்தகாலச் செயற்பாட்டின் நிறைவுணர்வைத் தக்கவைத்து, கேட்கப்பட்டவை ஏற்கெனவே பெறப்பட்டதாக நம்புமாறு கூறும் திட்டமிட்ட காலமுறை முரணை பாதுகாக்கிறது.
- source_word: ἔσται ὑμῖν
  choice: அவை உங்களுக்குக் கிடைக்கும்
  rationale: கேட்கப்பட்ட பலவற்றைக் குறிக்கும் ‘அவை’ என்ற பன்மையைத் தக்கவைத்து, எதிர்கால வாக்குறுதியை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: விசுவாசத்துக்கும் ஜெபத்திற்கான பதிலின் காலநிலைக்கும் இடையிலான தொடர்பு
  choice: ‘பெற்றுக்கொண்டீர்கள் என்று நம்புங்கள்; அவை உங்களுக்குக் கிடைக்கும்’ என்ற நிறைவுற்ற செயல்–எதிர்கால விளைவு வரிசையைத் தக்கவைத்தல்
  alternative: ‘பெற்றுக்கொள்கிறீர்கள் என்று நம்புங்கள்; அவை உங்களுக்குக் கிடைக்கும்’
  rationale: இங்கு பயன்படுத்தப்பட்டுள்ள ἐλάβετε இறந்தகால வடிவம். அதை நிகழ்காலமாகச் சீராக்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் திட்டமிட்ட காலமுறை முரணையும் பாதுகாக்கிறது; அதேவேளையில் ஜெபத்தைப் பற்றிய குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்துவதில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபித்து கேட்பவை’ என்பது இரண்டு கிரேக்க வினைகளையும் சுருக்காமல் இயல்பாக இணைக்கிறது. ‘பெற்றுக்கொண்டீர்கள்’ மற்றும் ‘கிடைக்கும்’ ஆகியவற்றுக்கிடையிலான காலமுறை அழுத்தம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
