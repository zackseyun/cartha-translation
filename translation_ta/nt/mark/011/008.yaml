translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் இரண்டு குழுக்களையும் இணையான அமைப்பில் வைத்து, στιβάδας என்பதன் பரந்த பொருளை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
