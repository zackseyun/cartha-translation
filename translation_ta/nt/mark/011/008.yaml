  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: ta
  text: பலர் தங்கள் மேலாடைகளைச் சாலையில் விரித்தார்கள்; வேறு சிலர் வயல்களில் வெட்டிய இலைதழைகளை[a] விரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இலைகளுள்ள கிளைகளை.” கிரேக்கச் சொல் வெட்டப்பட்ட தழைகள் அல்லது இலைகளுள்ள கிளைகளின் தொகுப்பைக் குறிக்கலாம்; குறிப்பாகப் பனைக்கிளைகளை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: எண்ணிக்கையை மிகைப்படுத்தாமல், கிரேக்கச் சொல்லின் இயல்பான பொருளை நேரடியாகத் தருகிறது.
- source_word: ἱμάτια
  choice: மேலாடைகள்
  rationale: இந்தச் சூழலில் சாலையில் விரிக்கப்பட்டவை வெளிப்புற ஆடைகள்; ‘மேலாடைகள்’ என்பது நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: ἔστρωσαν
  choice: விரித்தார்கள்
  rationale: ஆடைகளையும் வெட்டிக்கொண்டுவந்த தழைகளையும் தரையில் பரப்புவதை இயல்பாகக் குறிக்கிறது.
- source_word: εἰς τὴν ὁδόν
  choice: சாலையில்
  rationale: சாலையின் மேற்பரப்பில் அவற்றை விரித்தார்கள் என்ற இடப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄλλοι δὲ
  choice: வேறு சிலர்
  rationale: δέ காட்டும் மென்மையான வேறுபாட்டை மிகைப்படுத்தாமல், மற்றொரு குழுவைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: στιβάδας
  choice: இலைதழைகளை
  rationale: இந்தச் சொல் வெட்டப்பட்ட தாவரத் தழைகள் அல்லது இலைகளுள்ள கிளைகளின் தொகுப்பைக் குறிக்கலாம்; குறிப்பாகப் பனைக்கிளைகள் என்று உரையில் இல்லை.
- source_word: κόψαντες ἐκ τῶν ἀγρῶν
  choice: வயல்களிலிருந்து வெட்டிக்கொண்டுவந்த
  rationale: முதலில் வயல்களில் வெட்டி, பின்னர் சாலையில் விரித்த செயல் வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
