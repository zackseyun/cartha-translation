  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: ta
  text: சீடர்கள் இயேசு சொன்னபடியே அவர்களிடம் சொன்னார்கள்; அவர்கள் சீடர்களைப் போகவிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை அனுமதித்தார்கள்” அல்லது “அவர்களை விடுவித்தார்கள்.” இதற்கான கிரேக்க வினைச்சொல் அனுமதித்தல், விடுவித்தல், போகவிடுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம். இங்கு, அங்கு நின்றவர்கள் சீடர்கள் கழுதைக்குட்டியைக் கொண்டுபோவதை இனி தடுக்கவில்லை என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: சீடர்கள்
  rationale: கிரேக்கக் கட்டுரை பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, முந்தைய சூழலில் குறிப்பிடப்பட்ட சீடர்களைக் குறிக்கிறது. தமிழில் தெளிவுக்காக அந்தக் குறிப்பு வெளிப்படையாகச் சொல்லப்படுகிறது; δέ-யின் எளிய கதைத் தொடர்ச்சி தனியாக வலியுறுத்தப்படவில்லை.
- source_word: εἶπαν αὐτοῖς
  choice: அவர்களிடம் சொன்னார்கள்
  rationale: λέγω இங்கு சாதாரணமாகப் பேசுதல் அல்லது சொல்லுதல் என்ற பொருளில் வருகிறது; αὐτοῖς என்பது அங்கு நின்றவர்களைக் குறிக்கிறது.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: இயேசு சொன்னபடியே
  rationale: καθώς, இயேசு முன்பே அறிவுறுத்தியதற்கேற்ப சீடர்கள் சொன்னார்கள் என்ற சரியான ஒத்திசைவை வெளிப்படுத்துகிறது. இயல்பான தமிழில் ‘சொன்னபடியே’ முன் நிகழ்ந்த பேச்சையும் தெளிவாக உணர்த்துகிறது.
- source_word: ἀφῆκαν αὐτούς
  choice: அவர்கள் சீடர்களைப் போகவிட்டார்கள்
  rationale: ἀφίημι இச்சூழலில் தடுக்காமல் அனுமதித்தல் அல்லது போகவிடுதல் என்று பொருள்படுகிறது. பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்க αὐτούς குறிக்கும் சீடர்கள் வெளிப்படையாகக் குறிப்பிடப்படுகிறார்கள்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் பல பிரதிப்பெயர்களால் தமிழில் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க, சூழலால் உறுதியாகத் தெரியும் இடங்களில் ‘சீடர்கள்’ என்று வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
