id: MRK.11.27
reference: Mark 11:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: ta
  text: அவர்கள் மீண்டும் எருசலேமுக்கு வந்தார்கள். அவர் ஆலய வளாகத்தில்[a] நடந்துகொண்டிருந்தபோது, தலைமைக் குருக்களும் மறைநூல் அறிஞர்களும் மூப்பர்களும் அவரிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயத்தில்’ அல்லது ‘ஆலயச் சுற்றுப்பகுதியில்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் உள் திருத்தலத்தை மட்டும் அல்லாமல் பரந்த ஆலயத் தொகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: வந்தார்கள்
  rationale: கிரேக்கத்தில் இது வரலாற்று நிகழ்காலமாக இருந்தாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: எருசலேமுக்கு மறுபடியும் வந்ததைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உள் திருத்தலத்தை மட்டும் அல்லாமல் பரந்த ஆலயத் தொகுதியைக் குறிக்கிறது; ‘ஆலய வளாகம்’ அந்த இடவியல் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: περιπατοῦντος αὐτοῦ
  choice: அவர் … நடந்துகொண்டிருந்தபோது
  rationale: தொடர்ந்து நிகழ்ந்துகொண்டிருந்த பின்னணிச் செயலைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: பன்மையில் இது பிரதான ஆசாரியர் ஒருவரை மட்டும் அல்லாமல் முன்னணி குருத்துவ அதிகாரிகளைக் குறிக்கிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: எழுத்தர்களாகவும் புனித நூல்கள் மற்றும் சட்ட மரபுகளில் தேர்ச்சி பெற்றவர்களாகவும் இருந்த அங்கீகரிக்கப்பட்ட குழுவை, பழமையான ‘வேதபாரகர்’ என்பதைக் காட்டிலும் நவீன வாசகர்களுக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இங்கு வயதான ஆண்களைப் பொதுவாக அல்லாமல் அங்கீகரிக்கப்பட்ட யூதத் தலைவர்களைக் குறிக்கும் நிறுவனப் பொருளைப் பாதுகாக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: இயேசுவை நோக்கி வந்து அணுகியதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἱερόν என்பதன் இடவியல் பொருள்
  choice: ஆலய வளாகத்தில்
  alternative: ஆலயத்தில்; ஆலயச் சுற்றுப்பகுதியில்
  rationale: இச்சொல் உள் திருத்தலத்தை மட்டும் குறிக்கும் ναός என்பதிலிருந்து வேறுபட்டு, பொதுமக்கள் செல்லக்கூடிய பரந்த ஆலயத் தொகுதியைக் குறிக்கக்கூடும். ஆகவே குறிப்பிட்ட உள் பரிசுத்த இடத்திற்குள் இயேசு இருந்ததாகத் தவறாக உணர்த்தாமல், மூலத்தின் பரந்த இடவியல் பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கதைநடையின் இயல்புக்காக வரலாற்று நிகழ்காலம் இறந்தகாலமாக வழங்கப்பட்டுள்ளது; அதிகாரக் குழுக்களின் நிறுவனப் பொருள் தெளிவாக வைக்கப்பட்டுள்ளது.
