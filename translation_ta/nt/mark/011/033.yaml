translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைமரபுக்கு ஏற்ப இறந்தகாலமாக்கப்பட்டுள்ளது; ஆனால் இறுதி வாக்கியத்தின் நிகழ்காலச் செயல் காக்கப்பட்டுள்ளது.
