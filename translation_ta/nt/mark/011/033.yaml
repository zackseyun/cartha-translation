language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: ta
  text: அவர்கள் இயேசுவுக்குப் பதிலளித்து, “எங்களுக்குத் தெரியாது” என்றார்கள். இயேசு அவர்களிடம், “நானும் எந்த அதிகாரத்தால்[a] இவற்றைச் செய்கிறேன் என்று உங்களுக்குச் சொல்லமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த அதிகாரத்தோடு.”
    reason: ἐν ποίᾳ ἐξουσίᾳ என்பதிலுள்ள முன்னிடைச் சொல்லின் சாத்தியமான சொற்சார் மாற்று.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: பதிலளித்து
  rationale: பதில் உரையை அறிமுகப்படுத்தும் கிரேக்க இறந்தகாலப் பெயரெச்சத்தின் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: λέγουσιν / λέγει / λέγω
  choice: என்றார்கள் / என்றார் / சொல்லமாட்டேன்
  rationale: கிரேக்கத்தின் வரலாற்று நிகழ்காலத்தை தமிழில் அப்படியே வைத்தால் செயற்கையாக ஒலிக்கும் என்பதால், கதைநடைக்கு இயல்பான இறந்தகாலம் பயன்படுத்தப்பட்டது. இறுதி λέγω, மறைமுகக் கேள்வியுடன் வருவதால் “சொல்லமாட்டேன்” என வழங்கப்பட்டது.
- source_word: Οὐκ οἴδαμεν
  choice: எங்களுக்குத் தெரியாது
  rationale: தற்போதைய அறியாமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Οὐδὲ ἐγὼ
  choice: அப்படியானால், நானும் … சொல்லமாட்டேன்
  rationale: அவர்களுடைய பதிலுக்கு எதிரொலியாக வரும் மறுப்பைத் தமிழில் தெளிவாக இணைக்கிறது; “நானும்” என்ற சொல் கிரேக்கத்தின் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: இயேசுவின் செயல்களுக்கான அதிகார அடிப்படை அல்லது உரிமையைத் தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: ஆலயத்தில் இயேசு செய்த அண்மைய செயல்களையும் போதனையையும் சுட்டும் கிரேக்கப் பன்மையைப் பாதுகாக்கிறது.
- source_word: ποιῶ
  choice: செய்கிறேன்
  rationale: கிரேக்க நிகழ்காலத்தை இயல்பான தமிழ் நிகழ்காலமாக வழங்குகிறது.
