  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: ta
  text: 'முன்னே சென்றவர்களும் பின்தொடர்ந்து சென்றவர்களும் தொடர்ந்து முழக்கமிட்டார்கள்: “ஓசன்னா![b] ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வாழ்த்து சங்கீதம் 118:26-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: b
    text: “ஓசன்னா” என்பது “தயவுசெய்து காப்பாற்றும்” அல்லது “இப்போதே காப்பாற்றும்” என்பதுபோன்ற பொருளுடைய எபிரெய/அரமேய வழிபாட்டு முழக்கம்; இங்கு அது புகழ் முழக்கமாகவும் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: முன்னே சென்றவர்கள்
  rationale: இயேசுவுக்கும் ஊர்வலத்துக்கும் முன்னால் சென்றுகொண்டிருந்த கூட்டத்தைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பெயரெச்சம்; தமிழில் இயல்பாகச் செயலை வெளிப்படுத்துகிறது.
- source_word: οἱ ἀκολουθοῦντες
  choice: பின்னே வந்தவர்கள்
  rationale: முன்னே சென்றவர்களுக்கு இணையாக, இயேசுவுக்குப் பின்னால் வந்துகொண்டிருந்தவர்களைக் குறிக்கிறது; தமிழ் நடையில் இயல்பான இணை அமைப்பைத் தருகிறது.
- source_word: ἔκραζον
  choice: தொடர்ந்து முழக்கமிட்டார்கள்
  rationale: இறந்தகாலத் தொடர்வினை வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் எழுப்பப்பட்ட பொதுமுழக்கத்தைக் காட்டுகிறது.
- source_word: Ὡσαννά
  choice: ஓசன்னா
  rationale: எபிரெய/அரமேய வழிபாட்டு முழக்கத்தின் ஒலிபெயர்ப்பு; வேண்டுதலும் புகழ் முழக்கமும் கலந்த அதன் முதலாம் நூற்றாண்டுப் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: Εὐλογημένος
  choice: ஆசீர்வதிக்கப்பட்டவர்
  rationale: சங்கீதம் 118:26-ஐ எதிரொலிக்கும் வாழ்த்துச் சூத்திரத்தின் செயப்பாட்டு பொருளைப் பாதுகாக்கிறது.
- source_word: ὁ ἐρχόμενος
  choice: வருகிறவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பெயரெச்சத்தை இயல்பான தமிழில் தருகிறது; ‘மேசியா’ போன்ற விளக்கத் தலைப்பைச் சேர்க்கவில்லை.
- source_word: ἐν ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: ஆண்டவரின் அதிகாரத்தின்கீழ் அல்லது அவரைப் பிரதிநிதித்துவப்படுத்தி வருதல் என்ற வேதாகம மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான கண்ணியமான, நிலையான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: முழக்கத்தில் மேசியா அடையாளத்தை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்ப்பதா
  choice: “ஆண்டவரின் பெயரில் வருகிறவர்” என்ற மேற்கோள் சார்ந்த சொற்றொடரை அப்படியே தக்கவைத்தல்
  alternative: “ஆண்டவரின் பெயரில் வருகிற மேசியா” என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: சூழலில் மேசியா சார்ந்த முக்கியத்துவம் இருந்தாலும், கிரேக்க வாசகம் இங்கு ‘மேசியா’ அல்லது ‘அரசர்’ என்ற பட்டத்தைச் சேர்க்கவில்லை. சங்கீத எதிரொலியையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. கிரேக்க இறந்தகாலத் தொடர்வினையின் நீடித்த தன்மையை ‘தொடர்ந்து’ என்பதால் வெளிப்படுத்துகிறது. சங்கீத மேற்கோளின் மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறிகள் அவை விளக்கும் கூறுகளோடு இணைக்கப்பட்டுள்ளன.
