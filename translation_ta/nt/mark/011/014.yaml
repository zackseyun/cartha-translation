source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: ta
  text: அவர் பதிலளித்து, அதனிடம், “இனிமேல் ஒருபோதும் உன்னிடமிருந்து யாரும் கனி உண்ணாதிருக்கட்டும்”[b] என்றார்.[a] அவருடைய சீடர்கள் இதைக் கேட்டுக்கொண்டிருந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “பதிலளித்து, அவர் அதனிடம் சொன்னார்.” முன்னதாக யாரும் பேசியதாகக் குறிப்பிடப்படாத இடங்களிலும் “பதிலளித்து” என்பது கிரேக்கக் கதைநடையில் வழக்கமாக வரும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இனிமேல் யாரும் உன்னிடமிருந்து என்றென்றும் கனி உண்ணாதிருக்கட்டும்.” “என்றென்றும்” என்பதற்கான கிரேக்கம் சொற்சொல்லாக “யுகத்திற்குள்” என்று உள்ளது.
    reason: alternative_reading
  - marker: c
    text: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தை “அவருடைய சீடர்கள் இதைக் கேட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: பதிலளித்து
  rationale: முன்னதாக வெளிப்படையான பேச்சு எதுவும் இல்லாவிட்டாலும், கிரேக்கக் கதைநடையில் வரும் ‘பதிலளித்து’ என்ற மரபுத்தொடரின் வடிவத்தையும் அதன் சற்றே அசாதாரணமான நயத்தையும் காக்கிறது.
- source_word: αὐτῇ
  choice: அதற்கு
  rationale: கிரேக்கத்தில் ‘அத்திமரம்’ பெண்பால் சொல்லாக இருப்பதால் சுட்டுப்பெயரும் பெண்பாலில் உள்ளது; தமிழில் மரத்தை இயல்பாக அஃறிணையில் குறிப்பிடுவதால் ‘அதற்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: இனி என்றென்றும்
  rationale: ‘இனி இல்லை’ என்ற நிறுத்தத்தையும் ‘என்றென்றும்’ என்ற கால நீட்சியையும் சேர்த்து, கிரேக்கத்தின் வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ σοῦ
  choice: உன்னிடமிருந்து
  rationale: இயேசு மரத்தை நேரடியாக ஒருமையில் முன்னிலைப்படுத்திப் பேசுவதைத் தமிழிலும் காக்கிறது.
- source_word: μηδεὶς
  choice: யாரும்
  rationale: எதிர்மறை வினையுடன் இயல்பாக இணைந்து ‘ஒருவரும் இல்லை’ என்ற பொருளைக் கொடுக்கிறது.
- source_word: καρπὸν
  choice: கனி
  rationale: பொதுவான பொருளில் வரும் ஒருமைச் சொல்லை, மரத்தின் விளைச்சலைக் குறிக்கும் இயல்பான தமிழ் வேதாகம நடையில் வழங்குகிறது.
- source_word: φάγοι
  choice: உண்ணாதிருக்கட்டும்
  rationale: இது சாதாரண எதிர்காலக் கூற்று அல்ல; விருப்பம் அல்லது சாப அறிவிப்பை வெளிப்படுத்தும் optative வடிவம். ‘உண்ணாதிருக்கட்டும்’ அந்த உந்துதல் பொருளைக் காக்கிறது.
- source_word: ἤκουον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: கிரேக்க imperfect வடிவத்தின் தொடர்நிலைத் தன்மையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: உடைமையுறவைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
theological_decisions:
- issue: அத்திமரத்திடம் இயேசு கூறியதன் தன்மை
  choice: “யாரும் கனி உண்ணாதிருக்கட்டும்” எனச் சாபம் அல்லது நியாயத்தீர்ப்பு அறிவிக்கும் விருப்பவாக்கியமாக மொழிபெயர்த்தல்
  alternative: “யாரும் இனி கனி உண்ணமாட்டார்கள்” என வெறும் எதிர்கால முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: φάγοι என்பது எதிர்கால indicative அல்ல, விருப்பம் அல்லது சாப அறிவிப்பைக் குறிக்கும் optative. ஆகவே உரையின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் அதன் இலக்கண வலிமை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடியதாயும் அதேவேளை கண்ணியமான வேதாகம நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘கனி’, ‘உண்ணாதிருக்கட்டும்’ ஆகியவை அறிவிப்பின் சீரிய தன்மையைத் தக்கவைக்கின்றன; அடிக்குறிப்புகள் கிரேக்கக் கதைமரபையும் கால/வினைநிலை மாற்றுகளையும் வெளிப்படையாகக் காட்டுகின்றன.
