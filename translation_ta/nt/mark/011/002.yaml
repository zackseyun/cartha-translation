id: MRK.11.2
reference: Mark 11:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உங்களுக்கு எதிரே இருக்கும் கிராமத்துக்குப் போங்கள். நீங்கள் அதற்குள் நுழைந்த உடனே, இதுவரை எந்த மனிதரும் அதன்மேல் அமர்ந்திராத ஒரு குட்டி விலங்கு[a] கட்டப்பட்டிருப்பதைக் காண்பீர்கள். அதை அவிழ்த்துக் கொண்டுவாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அதன்மேல் மனிதர்களில் ஒருவரும் இதுவரை அமர்ந்ததில்லை.” எந்த மனிதரும் அதன்மேல் ஏறி அமர்ந்ததில்லை என்பதை மூலவாக்கியம் வெளிப்படையாகக் குறிப்பிடுகிறது.'
    reason: literal_rendering
lexical_decisions:
- source_word: Ὑπάγετε
  choice: போங்கள்
  rationale: இடம்பெயரச் சொல்லும் கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: κώμην
  choice: கிராமம்
  rationale: நகரத்தைவிடச் சிறிய குடியிருப்பைக் குறிக்கும் κώμη என்பதற்கான தெளிவான பொதுத்தமிழ்ச் சொல்.
- source_word: τὴν κατέναντι ὑμῶν
  choice: உங்களுக்கு எதிரே இருக்கும்
  rationale: சீடர்கள் இருக்கும் இடத்திற்கு எதிர்ப்புறத்தில் அமைந்த கிராமத்தைக் குறிக்கிறது; தமிழில் இடத்தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: நீங்கள் அதற்குள் நுழைந்த உடனே
  rationale: பங்கேற்புவினை அமைப்பையும் εὐθύς என்பதன் உடனடி காலப்பொருளையும் இயல்பான தமிழ்வாக்கியமாகத் தருகிறது.
- source_word: εὑρήσετε
  choice: காண்பீர்கள்
  rationale: எதிர்கால முன்னறிவிப்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πῶλον
  choice: குட்டி
  rationale: πῶλος என்பது தனியாகப் பார்க்கும்போது ஓர் இளம் விலங்கைக் குறிக்கிறது; மூலச்சொல்லில் வெளிப்படையாக இல்லாத விலங்கு இனத்தை முதன்மை உரையில் சேர்க்காமல் அதன் பொதுப் பொருளைப் பாதுகாக்கிறது. சூழலில் இது இயேசு ஏறிச் செல்லும் கழுதைக்குட்டி என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: δεδεμένον
  choice: கட்டப்பட்டிருப்பதை
  rationale: முழுமைச் செயப்பாட்டு பங்கேற்புவினை, குட்டி கட்டப்பட்ட நிலையிலிருப்பதைத் தெரிவிக்கிறது.
- source_word: ἐφ’ ὃν οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: இதுவரை எந்த மனிதரும் அமர்ந்திராத
  rationale: οὔπω என்பதன் ‘இதுவரை இல்லை’ என்ற பொருளையும் ἀνθρώπων என்பதன் வெளிப்படையான மனிதக் குறிப்பையும் பாதுகாக்கிறது; தமிழில் ‘அதன்மேல்’ என்பது பெயரெச்சத் தொடர்பால் இயல்பாகப் புரிகிறது.
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: அதை அவிழ்த்துக் கொண்டுவாருங்கள்
  rationale: கட்டப்பட்ட விலங்கை விடுவித்து தங்களிடம் கொண்டு வருமாறு கூறும் இரு கட்டளைகளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; φέρετε என்பதை ‘ஓட்டிவாருங்கள்’ அல்லது ‘இழுத்துவாருங்கள்’ என்று தேவையின்றிக் குறுக்கவில்லை.
theological_decisions:
- issue: πῶλον என்பதன் விலங்கு இனம்
  choice: முதன்மை உரையில் ‘குட்டி’ என்று மொழிபெயர்த்து, சூழலில் கழுதைக்குட்டி என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘கழுதைக்குட்டி’ என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: மாற்கு பயன்படுத்தும் πῶλος இளம் விலங்கைக் குறிக்குமே தவிர, இச்சொல் தனியாக விலங்கு இனத்தை வெளிப்படையாகச் சொல்லவில்லை. வெற்றிப் பவனி சூழல் கழுதைக்குட்டியைச் சுட்டினாலும், மூலத்தின் சொற்பொருள் விரிவை முதன்மை உரையில் பாதுகாப்பது உண்மையான மொழியியல் நுட்பத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர் அவர்களிடம் … என்றார்’ என்ற அமைப்பு தமிழில் மேற்கோள் உரையை இயல்பாகச் சுற்றிவைக்கிறது. ‘அவிழ்த்துக் கொண்டுவாருங்கள்’ என்பது கட்டப்பட்ட விலங்கை விடுவித்துப் பேசுகிறவரிடம் கொண்டு வருதல் என்ற தொடர்ச்சியைச் சீராக வெளிப்படுத்துகிறது.
