revisions:
- from: அவர்கள் எருசலேமுக்கு வந்தார்கள். அவர் ஆலயத்துக்குள்[a] நுழைந்து, ஆலயத்தில் விற்றுக்கொண்டும் வாங்கிக்கொண்டும் இருந்தவர்களை வெளியே துரத்தத் தொடங்கினார். நாணயம் மாற்றுகிறவர்களின் மேசைகளையும் புறாக்களை விற்பவர்களின் இருக்கைகளையும் கவிழ்த்துப்போட்டார்.
  to: அவர்கள் எருசலேமுக்கு வந்தார்கள். அவர் ஆலயத்திற்குள்[a] நுழைந்து, ஆலயத்தில் விற்பவர்களையும் வாங்குபவர்களையும் வெளியே துரத்தத் தொடங்கினார்; நாணய மாற்றுவோரின் மேசைகளையும் புறாக்களை விற்போரின் இருக்கைகளையும் கவிழ்த்தார்.
  rationale: The revision explicitly preserves the Greek parallelism between sellers and buyers, avoiding the possible implication that the same people performed both actions. It also uses the concise modern expression “நாணய மாற்றுவோர்.” The footnote continues to preserve the spatial scope of ἱερόν without overloading the main text.
