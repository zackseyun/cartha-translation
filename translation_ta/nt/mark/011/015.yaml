  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: ta
  text: அவர்கள் எருசலேமுக்கு வந்தார்கள். அவர் ஆலயத்திற்குள்[a] நுழைந்து, ஆலயத்தில் விற்பவர்களையும் வாங்குபவர்களையும் வெளியே துரத்தத் தொடங்கினார்; நாணய மாற்றுவோரின் மேசைகளையும் புறாக்களை விற்போரின் இருக்கைகளையும் கவிழ்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலய வளாகத்திற்குள்’ அல்லது ‘ஆலயப் பிராகாரங்களுக்குள்’; இங்குள்ள கிரேக்கச் சொல் உள் பரிசுத்த இடத்தை மட்டும் அல்ல, விரிவான ஆலய வளாகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: வந்தார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இயல்பான இறந்தகாலம் நிகழ்வுகளின் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: εἰσελθὼν
  choice: நுழைந்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழும் செயலைத் தமிழ் வினையெச்சம் இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: ஆலயம் / ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் விரிவான ஆலய வளாகத்தைக் குறிக்கிறது. பழக்கமான சுருக்கமான சொல்லை முதன்மை உரையில் வைத்து, அதன் பரந்த பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἤρξατο ἐκβάλλειν
  choice: வெளியே துரத்தத் தொடங்கினார்
  rationale: செயல் தொடங்கியதை ἤρξατο தெளிவாகக் குறிக்கிறது; ἐκβάλλειν என்பதன் வலிமையை ‘வெளியே துரத்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: விற்றுக்கொண்டும் வாங்கிக்கொண்டும் இருந்தவர்களை
  rationale: தொடர்ந்து நடைபெற்ற செயலையும் விற்போர்–வாங்குவோர் என்ற இணை அமைப்பையும் காக்கிறது.
- source_word: κολλυβιστῶν
  choice: நாணயம் மாற்றுகிறவர்கள்
  rationale: ஆலயப் பகுதியில் நாணயங்களை மாற்றிக் கொடுத்தவர்களை நவீன வாசகர்களுக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: καθέδρας
  choice: இருக்கைகள்
  rationale: நாற்காலி அல்லது நீளிருக்கை என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் பொதுவான பொருளைக் காக்கிறது.
- source_word: περιστερὰς
  choice: புறாக்கள்
  rationale: பலியிடும் சூழலுக்கு ஏற்றதும் தமிழில் இயல்பானதும் ஆன பெயர்.
- source_word: κατέστρεψεν
  choice: கவிழ்த்துப்போட்டார்
  rationale: மேசைகளையும் இருக்கைகளையும் தலைகீழாக்கிய வலிமையான செயலைத் தெளிவாகவும் உயிரோட்டமாகவும் காட்டுகிறது.
theological_decisions:
- issue: ஆலயத்தைச் சுத்திகரிக்கும் நிகழ்வில் ἱερόν என்பதன் இடவெல்லை
  choice: முதன்மை உரையில் ‘ஆலயம்’ என்று மொழிபெயர்த்து, அது விரிவான ஆலய வளாகத்தைக் குறிப்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘ஆலய வளாகம்’ அல்லது ‘ஆலயப் பிராகாரங்கள்’ என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கும் ναός அல்ல; முழு ஆலய வளாகத்தையும் குறிக்கும். பழக்கமான ‘ஆலயம்’ வாசிப்பின் இயல்பைக் காக்கிறது; அடிக்குறிப்பு தவறான இடப்புரிதலைத் தடுக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் செயல் வரிசையும் விற்போர்–வாங்குவோர் இணை அமைப்பும் காக்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
