  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: ta
  text: அவர்கள் அந்தக் கழுதைக்குட்டியை இயேசுவிடம் கொண்டுவந்து, தங்கள் மேலாடைகளை அதன்மேல் போட்டு, அவர் அதன்மேல் அமர்ந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: கழுதைக்குட்டி
  rationale: πῶλος என்பதற்கு பொதுவாக ‘இளங்கன்று/குட்டி’ என்று பொருள் வரலாம்; இச்சூழலிலும் முந்தைய வசனத்திலும் குறிப்பிடப்படும் விலங்கு கழுதை என்பதால் இயல்பாகவும் தெளிவாகவும் ‘கழுதைக்குட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπιβάλλουσιν
  choice: போட்டு
  rationale: வினைச்சொல் மேலே இடுதல் அல்லது எறிந்து போடுதல் என்ற செயலைக் குறிக்கிறது. தமிழில் ‘அதன்மேல் போட்டு’ என்பது செயலை இயல்பாகத் தெரிவிக்கிறது; தேவையற்ற வன்மையைக் குறிக்கும் ‘எறிந்து’ தவிர்க்கப்பட்டது.
- source_word: ἱμάτια
  choice: மேலாடைகள்
  rationale: ἱμάτια இங்கு அவர்கள் அணிந்திருந்த வெளிப்புற ஆடைகளைக் குறிக்கிறது; ‘மேலாடைகள்’ என்பது நவீன வாசகருக்குத் தெளிவான சமமான சொல்.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: அவர் அதன்மேல் அமர்ந்தார்
  rationale: ஆண்பால் ஒருமை எழுவாய் இயேசுவைக் குறிக்கிறது; αὐτόν கழுதைக்குட்டியைக் குறிக்கிறது. மூலத்தின் எளிய தொடரமைப்பு பாதுகாக்கப்பட்டது.
