  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: ta
  text: இயேசு அவர்களுக்குப் பதிலளித்து, “கடவுள்மீது விசுவாசம் வையுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “கடவுளுடைய விசுவாசத்தை உடையவர்களாயிருங்கள்.” இதை “கடவுளின் உண்மைத்தன்மை” அல்லது “கடவுளிடமிருந்து வரும் விசுவாசம்” என்றும் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: பதிலளித்து
  rationale: இந்தப் பங்கேற்புவினை பொதுவாகப் பேச்சுப் பதிலை அறிமுகப்படுத்துகிறது; தமிழில் அடுத்துள்ள முதன்மை வினையோடு இயல்பாக இணைகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது; ἀποκριθεὶς என்பதுடன் சேர்ந்து ஒரே பேச்சுச் செயலாக அமைகிறது.
- source_word: Ἔχετε
  choice: வையுங்கள்
  rationale: தமிழில் ‘விசுவாசம் வையுங்கள்’ என்பது தொடர்ந்த மனநிலையை வேண்டுகின்ற இயல்பான கட்டளைத் தொடர்; வெறும் ‘உடையவர்களாயிருங்கள்’ என்பதைவிட தெளிவாக உள்ளது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இச்சூழலில் கடவுளை நோக்கிய நம்பிக்கையைச் சுட்டும் மரபான, புரிந்துகொள்ளத்தக்க சொல்; ‘நம்பிக்கை’ என்பதும் சாத்தியம், ஆனால் πίστις என்பதன் சமயச் சூழலை ‘விசுவாசம்’ நன்கு தக்கவைக்கிறது.
- source_word: θεοῦ
  choice: கடவுள்மீது
  rationale: சூழலில் சீடர்கள் கடவுளில் விசுவாசம் வைக்கும்படி இயேசு அறிவுறுத்துவதால், நோக்குப் பொருள் சார்ந்த இடைவேற்றுமைப் பொருள் முதன்மை உரையில் இயல்பாக வெளிப்படுத்தப்படுகிறது; கிரேக்கத்தின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: πίστιν θεοῦ என்பதில் உள்ள தெளிவற்ற பிறப்புவேற்றுமை உறவு
  choice: கடவுள்மீது விசுவாசம்
  alternative: ‘கடவுளுடைய விசுவாசம்’; ‘கடவுளின் உண்மைத்தன்மை’; ‘கடவுளிடமிருந்து வரும் விசுவாசம்’
  rationale: வாடிப்போன அத்திமரத்தைத் தொடர்ந்து, ஜெபத்தையும் விசுவாசிப்பதையும் பற்றிய போதனைக்கு முன்னதாக வரும் அறிவுறுத்தல் என்பதால், கடவுளை நோக்கிய விசுவாசம் என்பது சூழலுக்கு மிகவும் பொருந்துகிறது. எனினும் πίστιν θεοῦ என்ற கிரேக்கத் தொடர் இலக்கணரீதியாகப் பலவாறு புரிந்துகொள்ளப்படக்கூடியதால், அந்த இறையியல் பதற்றம் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளியதும் கண்ணியமானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’ என்பது θεός என்பதற்கான பொதுவான, பிரிவுசார்பற்ற தேர்வு. மூலத்தின் பிறப்புவேற்றுமைத் தெளிவின்மை முதன்மை உரையில் இயல்பான பொருளாலும் அடிக்குறிப்பில் மாற்றுச் சாத்தியங்களாலும் பாதுகாக்கப்பட்டுள்ளது.
