  source_fidelity: முதன்மை உரை καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς என்பதையும் Ἔχετε πίστιν θεοῦ என்பதையும் துல்லியமாகவும் இயல்பாகவும் தருகிறது. πίστιν θεοῦ-வின் நோக்குப்பொருள் வாசிப்பு (‘கடவுள்மீது விசுவாசம்’) சூழலுக்கு ஏற்றது; பிற சாத்தியங்கள் அடிக்குறிப்பில் இருக்க வேண்டும்.
  naturalness: ‘இயேசு அவர்களுக்குப் பதிலளித்து ... என்றார்’ மற்றும் ‘கடவுள்மீது விசுவாசம் வையுங்கள்’ நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடையாக உள்ளன. அடிக்குறிப்பில் மட்டும் ‘இன்னும் சொல்லுக்குச் சொல்’ இயல்பற்றது; மேலும் ‘உண்மைத்தன்மையைப் பற்றிக்கொள்ளுங்கள்’ மூலத்தின் ‘have’ கட்டளையைத் தேவையின்றி ‘hold fast’ என மாற்றுகிறது.
