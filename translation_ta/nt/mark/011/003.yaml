id: MRK.11.3
reference: Mark 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: ta
  text: யாராவது உங்களிடம், ‘நீங்கள் ஏன் இப்படிச் செய்கிறீர்கள்?’ என்று கேட்டால், ‘ஆண்டவருக்கு[a] இது தேவை; அவர் அதை உடனே இங்கே திருப்பி அனுப்புவார்[b]’ என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எஜமானுக்கு இது தேவை.’ கிரேக்க κύριος என்பதற்கு ‘ஆண்டவர்’ அல்லது ‘எஜமான்’ என்று பொருள் வரலாம்; இங்கு நற்செய்தியின் சூழலுக்கு ஏற்ப ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அவர் அதை உடனே இங்கே திருப்பி அனுப்புகிறார்.’ கிரேக்கத்தில் ἀποστέλλει என்பது நிகழ்கால வடிவம்; இங்கு அது அடுத்து நிகழப்போகும் செயலை உயிரோட்டமாகக் கூறுவதாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: யாராவது உங்களிடம் … என்று கேட்டால்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்காலத்தில் நிகழக்கூடிய திறந்த நிபந்தனையைக் காட்டுகிறது. கேள்வி தொடர்வதால், தமிழில் இயல்பான ‘கேட்டால்’ பயன்படுத்தப்பட்டது.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: நீங்கள் ஏன் இப்படிச் செய்கிறீர்கள்?
  rationale: சொல்லுக்குச் சொல் ‘என்ன செய்கிறீர்கள்?’ எனலாம்; ஆனால் இச்சூழலில் τί என்பது அவர்களுடைய செயலைக் கேள்விக்குள்ளாக்கும் ‘ஏன்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: εἴπατε
  choice: சொல்லுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: Ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் பட்டப்பெயர் சார்ந்த வலிமையைப் பாதுகாக்கிறது; மாற்கு நற்செய்தியின் சூழலில் இது இயேசுவைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: அவருக்கு இது தேவை
  rationale: சொற்றொடரின் பொருள் ‘அதற்கான தேவை அவருக்கு உள்ளது.’ தமிழில் ‘அவருக்கு இது தேவை’ தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘இது’ முந்தைய வசனத்திலுள்ள கழுதைக்குட்டியைக் குறிக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவில் அடிக்கடி வரும் உடனடித் தன்மையையும் வேகத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀποστέλλει
  choice: அனுப்புவார்
  rationale: வடிவத்தில் நிகழ்காலமாக இருந்தாலும், இச்சூழலில் அடுத்து நிகழப்போகும் செயலைக் குறிக்கும் உயிரோட்டமான அல்லது எதிர்காலப் பொருளுடைய நிகழ்காலமாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: πάλιν
  choice: திருப்பி
  rationale: அதே பொருளை மீண்டும் இவ்விடத்துக்கு அனுப்புவதைக் குறிக்கும் πάλιν என்பதற்கு தமிழில் ‘திருப்பி’ இயல்பான இணை.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைச் சுட்டும் வினையடையின் நேரடியான தமிழ் இணை.
theological_decisions:
- issue: κύριος என்பதன் குறிப்பு மற்றும் வலிமை
  choice: இயேசுவைக் குறிக்கும் பட்டப்பெயராக ‘ஆண்டவர்’
  alternative: உரிமையாளர் அல்லது எஜமானர் என்ற பொதுவான பொருளில் ‘எஜமான்’
  rationale: மாற்குவின் கதையோட்டத்தில் கட்டளையிடுபவர் இயேசு; ஆகவே வெறும் உலகியலான உரிமையாளர் என்ற பொருளுக்குக் குறைக்காமல் பட்டப்பெயரின் வலிமை பாதுகாக்கப்படுகிறது. இருப்பினும் சொல்லின் பொதுவான ‘எஜமான்’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀποστέλλει என்பதன் காலப் பொருள்
  choice: எதிர்காலப் பொருளில் ‘அனுப்புவார்’
  alternative: வடிவத்துக்கு நெருக்கமாக நிகழ்காலத்தில் ‘அனுப்புகிறார்’
  rationale: விளக்கத்தைச் சொன்னபின் நிகழவிருக்கும் செயலை இவ்வினை குறிக்கிறது. மூலத்தின் நிகழ்கால வடிவம் உயிரோட்டமான அல்லது எதிர்காலப் பொருளுடைய நிகழ்காலமாக இருக்கக்கூடும்; அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘ஆண்டவர்’ மரியாதைப் பட்டப்பெயராக இருப்பதால் அதைத் தொடர்ந்து வரும் மறைமுக எழுவாய்க்கு ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் எளிமையும் கட்டளையின் உடனடித் தன்மையும் காக்கப்பட்டுள்ளன.
