source:
  edition: SBLGNT
  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: ta
  text: அங்கே நின்றுகொண்டிருந்தவர்களில் சிலர் அவர்களிடம், “அந்தக் குட்டியை[a] அவிழ்த்துக்கொண்டு என்ன செய்கிறீர்கள்?” என்று கேட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அந்தக் கழுதைக்குட்டியை.” πῶλος என்ற கிரேக்கச் சொல் ஓர் இளம் விலங்கைக் குறிக்கலாம்; இந்தச் சூழலில் அது ஒரு கழுதைக்குட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: சிலர்
  rationale: அங்கே இருந்தவர்களில் குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கும் பன்மைச் சொல்; ‘சிலர்’ அதன் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: அங்கே நின்றுகொண்டிருந்தவர்களில்
  rationale: ἐκεῖ என்பதன் இடப்பொருளையும், substantival participle குறிக்கும் அங்கே நின்றிருந்த மக்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔλεγον αὐτοῖς
  choice: அவர்களிடம் … என்று கேட்டனர்
  rationale: நேரடியாகத் தொடர்ந்து வரும் வினாவைத் தமிழில் இயல்பாக அறிமுகப்படுத்த ‘கேட்டனர்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்க imperfect இங்கு பின்னணியில் நிகழ்ந்த பேச்சைக் காட்டுகிறது; தமிழில் ‘கேட்டுக்கொண்டிருந்தனர்’ என்பது தேவையற்ற தொடர்ச்சி அல்லது மீளுரையை உணர்த்தக்கூடும்.
- source_word: Τί ποιεῖτε
  choice: என்ன செய்கிறீர்கள்?
  rationale: வினாவின் நேரடியான ‘என்ன’ என்ற பொருளையும் நிகழ்காலச் செயலையும் காக்கிறது; மூலத்தில் இல்லாத ‘ஏன்’ சேர்க்கப்படவில்லை.
- source_word: λύοντες
  choice: அவிழ்த்துக்கொண்டு
  rationale: கட்டப்பட்டிருந்த விலங்கின் கட்டை அவிழ்க்கும் செயலைத் தெளிவாகக் குறிக்கிறது; participle-இன் ஒரேநேரச் செயற்பாட்டை தமிழ் இணைவினை வடிவம் எடுத்துரைக்கிறது.
- source_word: τὸν πῶλον
  choice: அந்தக் குட்டியை
  rationale: πῶλος பொதுவாக இளம் விலங்கைக் குறிக்கக்கூடியதால், உரையில் ‘கழுதை’ என்று வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சொற்பொருள் அகலத்தை ‘குட்டி’ காக்கிறது. கிரேக்க definite article சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட குட்டியைக் குறிப்பதால் ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
