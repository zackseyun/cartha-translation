  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘போதெல்லாம்’ மற்றும் ‘வழக்கம்’ ஆகியவை சேர்ந்து மூலத்தின் திரும்ப நிகழும் செயற்பொருளைத் தெளிவாக்குகின்றன.
