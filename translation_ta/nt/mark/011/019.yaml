  text: And whenever evening came, they would go out of the city.
translation:
  language: ta
  text: மாலை வந்தபோதெல்லாம், அவர்கள் நகரத்தை விட்டு வெளியே செல்வது வழக்கம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: வந்தபோதெல்லாம்
  rationale: இணைந்து வரும் இறந்தகாலத் தொடர்நிலை வினையுடன், ஒரே நிகழ்வை அல்லாமல் வழக்கமாகத் திரும்பத் திரும்ப நடந்த செயலைக் குறிக்கிறது.
- source_word: ὀψὲ ἐγένετο
  choice: மாலை வந்த
  rationale: ‘தாமதமானது/மாலையானது’ என்ற மூலமொழி மரபுத்தொடரை இயல்பான நவீனத் தமிழில் காலப்பொருள் மாறாமல் தருகிறது.
- source_word: ἐξεπορεύοντο
  choice: வெளியே செல்வது வழக்கம்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் இங்கு வழக்கமாக மீண்டும் நடந்த செயலைச் சுட்டுவதால், அந்த நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔξω τῆς πόλεως
  choice: நகரத்தைவிட்டு வெளியே
  rationale: வினையில் உள்ள வெளியேறும் இயக்கத்தையும், நகரின் எல்லைக்கு வெளியே சென்றதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πόλεως
  choice: நகரம்
  rationale: சூழலில் எருசலேம் என்பது தெளிவாயிருந்தாலும், கிரேக்க உரை அதன் பெயரைச் சொல்லாமல் ‘நகரம்’ என்றே கூறுவதால் அதையே பாதுகாக்கிறது.
