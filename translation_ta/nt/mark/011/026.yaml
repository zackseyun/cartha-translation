revisions:
- from: ஆனால்[a] நீங்கள் மன்னிக்காவிட்டால், பரலோகங்களில் இருக்கிற உங்கள் தந்தையும் உங்கள் குற்றங்களை மன்னிக்கமாட்டார்.
  to: ஆனால்[a] நீங்கள் மன்னிக்காவிட்டால், வானங்களில் இருக்கிற உங்கள் தந்தையும் உங்கள் மீறுதல்களை மன்னிக்கமாட்டார்.
  rationale: 'The revision makes two safe lexical and stylistic improvements: it uses ‘வானங்களில்’ for the Greek plural phrase ἐν τοῖς οὐρανοῖς in natural modern Tamil, and ‘மீறுதல்கள்’ for παράπτωματα to retain the sense of trespasses/transgressions. The textual-critical footnote is retained in meaning and its description of later scribes is made more idiomatic. No theological interpretation has been added.'
