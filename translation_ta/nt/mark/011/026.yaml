source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: ta
  text: ஆனால்[a] நீங்கள் மன்னிக்காவிட்டால், வானங்களில் இருக்கிற உங்கள் தந்தையும் உங்கள் மீறுதல்களை மன்னிக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் (நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்டிகஸ், வத்திக்கானஸ் உட்பட) மற்றும் தொடக்ககால காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை மரபிலும், இலத்தீன் மரபிலும், பெரும்பாலான சிரிய மொழிச் சாட்சிகளிலும் உள்ளது. மத்தேயு 6:15-இல் உள்ள இயேசுவின் வார்த்தைகளுடன் ஒத்துப்போகும்படி பிற்கால நகலெடுப்பாளர்கள் இதைச் சேர்த்திருக்க வாய்ப்புள்ளது.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: மன்னி
  rationale: மனிதர்களுக்கிடையிலான குற்றங்களையும் கடவுளின் மன்னிப்பையும் குறிக்கும் இச்சூழலில், தார்மிகக் குற்றப்பொறுப்பை நீக்குவதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: παράπτωμα
  choice: குற்றங்கள்
  rationale: தவறான அடி அல்லது சரியான வழியிலிருந்து விலகுதல் என்ற நுண்பொருளைத் தாங்குகிறது; பொதுவான ‘பாவங்கள்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பாகவும் வேறுபாட்டைக் காக்கும் வகையிலும் உள்ளது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில்
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவத்தைப் பாதுகாக்கிறது; தமிழில் கண்ணியமான வேதாகம நடைக்கும் பொருந்துகிறது.
theological_decisions:
- issue: மனிதர்கள் பிறரை மன்னிப்பதற்கும் தந்தை அவர்களை மன்னிப்பதற்கும் இடையிலான தொடர்பு
  choice: மூலத்தில் உள்ள நிபந்தனைத் தொடர்பை அப்படியே வைத்தல்
  alternative: மன்னிப்பு நற்செயலால் சம்பாதிக்கப்படுகிறது அல்லது உண்மையான விசுவாசத்தின் சான்று என்று விளக்கிச் சேர்த்தல்
  rationale: வசனம் தொடர்பை வலியுறுத்துகிறது; அதன் துல்லியமான இறையியல் இயல்பை இங்கே விளக்கித் தீர்மானிப்பதில்லை. எனவே பதற்றமும் சுருக்கமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘தந்தை’ என்பது πατήρ என்பதைக் நேரடியாகக் காட்டுகிறது; ‘பரலோகங்களில்’ என்பது மூலத்தின் பன்மையைப் பாதுகாக்கிறது.
