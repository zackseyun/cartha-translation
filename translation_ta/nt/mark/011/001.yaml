source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: ta
  text: அவர்கள் எருசலேமை நெருங்கி, ஒலிவ மலையின் அருகே உள்ள பெத்பகே, பெத்தானியா ஆகிய ஊர்களுக்கு வந்தபோது[a], அவர் தம் சீடர்களில் இருவரை அனுப்புகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க இடவியல் சொற்களை இன்னும் நேரடியாக, ‘எருசலேமுக்கு அருகே வந்து, பெத்பகேக்கும் பெத்தானியாவுக்கும், ஒலிவ மலையை நோக்கி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மாற்கு கதை சொல்லும்போது கடந்த நிகழ்வுகளுக்கு நிகழ்கால வினையை அடிக்கடி பயன்படுத்துகிறார். எனவே ‘அனுப்பினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: நெருங்கி
  rationale: நிகழ்கால வடிவிலுள்ள கிரேக்கச் சொல்லின் இயக்கப் பொருளை இயல்பான தமிழ் கதைநடையில் தருகிறது; காலச் சூழலை ‘வந்தபோது’ தெளிவாக்குகிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமை
  rationale: ἐγγίζω என்பதுடன் இலக்காக அணுகப்படும் இடத்தைத் தமிழில் நேரடி வேற்றுமையால் இயல்பாகக் குறிக்கிறது.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: பெத்பகே, பெத்தானியா ஆகிய ஊர்களுக்கு வந்தபோது
  rationale: இரண்டாவது εἰς குறிக்கும் இடவியல் இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இவை ஊர்ப்பெயர்கள் என்பதையும் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலையின் அருகே உள்ள
  rationale: πρός இங்கு குறிக்கும் இடவியல் அண்மை அல்லது திசைநோக்கை மிகைப்படுத்தாமல், ஊர்களுக்கும் மலைக்கும் உள்ள தொடர்பை இயல்பாகத் தருகிறது.
- source_word: ἀποστέλλει
  choice: அனுப்புகிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, காட்சியின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: தம் சீடர்களில் இருவரை
  rationale: பகுதிப்பொருள் அமைப்பையும் இயேசுவுக்குரிய சீடர்கள் என்ற உறவையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: Βηθφαγὴ
  choice: பெத்பகே
  rationale: ஊர்ப்பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Βηθανίαν
  choice: பெத்தானியா
  rationale: ஊர்ப்பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலை
  rationale: இடப்பெயரின் தெளிவான, வழக்கிலுள்ள தமிழ் வடிவம்.
