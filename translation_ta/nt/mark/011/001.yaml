  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் பிரதான உரையில் தக்கவைக்கப்பட்டு, கால மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது; சிக்கலான கிரேக்க இடவியல் தொடர் தமிழில் வாசிக்கத்தக்க வகையில் அமைக்கப்பட்டாலும் அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
