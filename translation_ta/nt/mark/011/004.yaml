  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: ta
  text: அவர்கள் புறப்பட்டுப் போய், வெளியே தெருவோரத்தில் ஒரு கதவின் அருகே கட்டப்பட்டிருந்த ஒரு இளம் விலங்கைக் கண்டார்கள்[a]; அதை அவிழ்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளியே, தெருவில் ஒரு கதவின் அருகே.” கிரேக்கச் சொற்றொடரில் இடம் சார்ந்த வலியுறுத்தலைச் சற்றே வேறுபடுத்திப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: புறப்பட்டுப் போய்
  rationale: இயேசு அறிவுறுத்திய இடத்திலிருந்து அவர்கள் சென்றதைக் குறிக்கும் புறப்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὗρον
  choice: கண்டார்கள்
  rationale: கதைநடையில் εὑρίσκω என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: πῶλον
  choice: கழுதைக்குட்டி
  rationale: πῶλος பொதுவாக இளம் சவாரி விலங்கைக் குறிக்கலாம்; உடனடியான சூழலும் முந்தைய வசனமும் இது கழுதைக்குட்டி என்பதைத் தெளிவுபடுத்துவதால், நவீனத் தமிழில் இயல்பாக இவ்வாறு வழங்கப்படுகிறது.
- source_word: δεδεμένον
  choice: கட்டப்பட்டிருந்த
  rationale: முற்றுப்பெற்ற செயப்பாட்டு எச்சம், குட்டி ஏற்கெனவே கட்டப்பட்ட நிலையில் இருந்ததைச் சுட்டுகிறது.
- source_word: πρὸς θύραν
  choice: ஒரு கதவுக்கருகே
  rationale: πρός இங்கு கதவுக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; ‘கதவுக்கருகே’ தெளிவான இயல்பான தமிழ்.
- source_word: ἔξω
  choice: வெளியே
  rationale: அது உட்புறத்தில் அல்லாமல் வெளிப்புறத்தில் இருந்ததை நேரடியாகக் காட்டுகிறது.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: தெருவோரத்தில்
  rationale: ἄμφοδον என்பது தெரு, சந்து அல்லது திறந்த பாதையைக் குறிக்கிறது; ἐπί + உரிமை வேற்றுமை இங்கு அந்த இடம் தெருவை ஒட்டி இருப்பதைக் காட்டுவதாகப் புரிந்துகொள்ளலாம்.
- source_word: λύουσιν αὐτόν
  choice: அதை அவிழ்த்தார்கள்
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக வழங்குகிறது; கட்டப்பட்ட விலங்கைக் கட்டிலிருந்து விடுவிக்கும் செயலை ‘அவிழ்த்தார்கள்’ இயல்பாகக் குறிக்கிறது.
