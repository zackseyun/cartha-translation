source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: ta
  text: அவர் அவர்களுக்குக் கற்பித்துக்கொண்டே, “என் வீடு எல்லா தேச மக்களுக்கும்[a] ஜெப வீடு என்று அழைக்கப்படும் என்று எழுதப்பட்டிருக்கிறதல்லவா? ஆனால் நீங்களோ அதை கொள்ளையர்களின் குகையாக்கிவிட்டீர்கள்[b]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எல்லா மக்களுக்கும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “எல்லா தேசங்களுக்கும்” என்று உள்ளது; இது ஏசாயா 56:7-ஐ எதிரொலித்து, ஆலயம் இஸ்ரவேலுக்கு அப்பாற்பட்டவர்களையும் வரவேற்க வேண்டிய இடம் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கொள்ளையர்களின் குகை” என்பது எரேமியா 7:11-ஐ எதிரொலிக்கிறது. “கொள்ளையர்கள்” என்பதற்கான கிரேக்கச் சொல் சில சூழல்களில் “வழிப்பறிக்காரர்கள்” அல்லது “ஆயுதக் கொள்ளையர்கள்” என்றும் பொருள்படலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: கற்பித்துக்கொண்டே … கூறினார்
  rationale: முற்றுப்பெறாத இறந்தகால வினைகளின் தொடர்ச்சியான நிகழ்வை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; இயேசு ஆலயத்தில் தொடர்ந்து கற்பித்த நிகழ்வோட்டத்தையும் காக்கிறது.
- source_word: Οὐ γέγραπται
  choice: எழுதப்பட்டிருக்கிறதல்லவா?
  rationale: வேதவாக்கின் நிலையான எழுத்து அதிகாரத்தைச் சுட்டும் நிறைவுற்ற செயப்பாட்டு வடிவத்தையும், எதிர்மறைக் கேள்வியின் வலியுறுத்தலையும் காக்கிறது.
- source_word: Ὁ οἶκός μου
  choice: என் வீடு
  rationale: ‘ஆலயம்’ என்று விளக்கிப் பொருள்கூறாமல், ஏசாயா 56:7 மேற்கோளின் நேரடியான ‘வீடு’ உருவகத்தைக் காக்கிறது.
- source_word: οἶκος προσευχῆς
  choice: ஜெப வீடு
  rationale: நவீனத் தமிழில் எளிதில் புரியும் வகையில் ஜெபத்திற்குரிய வீட்டைக் குறிக்கிறது; மூலத்தின் பெயர்ச்சொல் அமைப்பையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: எல்லா தேசத்தாருக்கும்
  rationale: ἔθνη என்பதன் ‘தேசங்கள்/புறதேசத்தார்’ சார்ந்த பரப்பைத் தக்கவைத்து, தேவனுடைய வீட்டின் அனைவரையும் உள்ளடக்கும் நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ὑμεῖς δὲ
  choice: ஆனால் நீங்களோ
  rationale: வலியுறுத்தப்பட்ட ‘நீங்கள்’ என்ற முன்னிலைச் சொல்லையும், தேவனுடைய நோக்கத்திற்கும் அவர்களுடைய செயலுக்கும் இடையிலான கூர்மையான முரண்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: πεποιήκατε
  choice: ஆக்கிவிட்டீர்கள்
  rationale: முன்னர் செய்யப்பட்ட செயல் இப்போது விளைவுற்ற நிலையில் இருப்பதைக் காட்டும் கிரேக்க நிறைவுக்காலத்தின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: σπήλαιον λῃστῶν
  choice: கொள்ளையர்களின் குகை
  rationale: எரேமியா 7:11-இன் தீர்க்கதரிசன எதிரொலியைக் காக்கிறது; λῃσταί என்பதை தேவையின்றி அரசியல் கிளர்ச்சியாளர்கள் என்று குறுக்காமல், கொள்ளையர்கள் என மொழிபெயர்க்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசன மேற்கோளின் உலகளாவிய பரப்பு
  choice: எல்லா தேசத்தாருக்கும்
  alternative: எல்லா மக்களுக்கும்; எல்லா தேசத்தாராலும்
  rationale: இது ἔθνη என்பதையும் ஏசாயா 56:7-இன் பரந்த வரவேற்பையும் காக்கிறது; ஆலயம் இஸ்ரவேலுக்கு அப்பாற்பட்டோருக்குமுரியது என்ற உரையின் வலியுறுத்தலை எந்தப் பிற்கால இறையியல் அமைப்பிற்குள்ளும் அடைக்கவில்லை.
- issue: λῃστῶν என்பதன் குற்றச்சாட்டு வலிமை
  choice: கொள்ளையர்கள்
  alternative: வழிப்பறிக்காரர்கள்; ஆயுதக் கொள்ளையர்கள்; கிளர்ச்சியாளர்கள்
  rationale: இச்சூழலில் எரேமியா 7:11 மேற்கோள் பொருளை வழிநடத்துகிறது. ‘கொள்ளையர்கள்’ என்பது தீர்க்கதரிசன எதிரொலியைத் தெளிவாகக் காக்கிறது; உரை வெளிப்படையாகச் சொல்லாத அரசியல் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும், அதேவேளை வேத மேற்கோளுக்குரிய கண்ணியத்தைப் பேணும் நடை. ‘ஜெபம்’, ‘தேசத்தார்’, ‘கொள்ளையர்களின் குகை’ ஆகியவை பரவலாக அறியப்படும் சொற்களாக இருப்பதால் வைத்துக்கொள்ளப்பட்டன.
