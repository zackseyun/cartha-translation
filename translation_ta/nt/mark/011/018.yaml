source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: ta
  text: தலைமைக் குருக்களும் மறைநூல் அறிஞர்களும் இதைக் கேள்விப்பட்டார்கள். அவரை எப்படி அழித்துவிடலாம்[a] என்று அவர்கள் வழி தேடிக்கொண்டிருந்தார்கள். ஏனெனில் அவர்கள் அவருக்குப் பயந்தார்கள்; மக்கள் கூட்டம் முழுவதும் அவரது போதனையால் வியப்பில் ஆழ்ந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லலாம்” அல்லது “மரணத்திற்கு ஆளாக்கலாம்.” கிரேக்க வினைச்சொல் பரந்த பொருளில் “அழித்தல்” என்றும் பொருள்படலாம்; ஆனால் இச்சூழல் உயிரைப் பறிக்கும் நோக்கைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: இதைக் கேள்விப்பட்டார்கள்
  rationale: வினைச்சொல் ‘கேட்டார்கள்’ அல்லது ‘அறிந்துகொண்டார்கள்’ எனப் பொருள்படலாம். முந்தைய ஆலய நிகழ்வுகளைச் சுட்டும் செயப்படுபொருளைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: எருசலேமின் முதன்மை ஆசாரியத் தலைவர்களைக் குறிக்கும் குழுப்பெயர். ஒரே தலைமை ஆசாரியர் பதவியைப் பலர் வகித்ததாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: யூத மறைநூல்களிலும் சட்டத்திலும் தேர்ச்சி பெற்ற அறிஞர் வகுப்பைக் குறிக்கிறது; நவீன வாசகருக்கு ‘எழுத்தர்கள்’ என்பதைக் காட்டிலும் இது தெளிவானது.
- source_word: ἐζήτουν
  choice: வழிதேடிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை, அவர்கள் தொடர்ந்து வழி தேடிய அல்லது முயன்ற செயலைக் காட்டுகிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: அவர்கள் நோக்கத்தை நிறைவேற்றுவதற்கான முறை அல்லது வழியைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀπολέσωσιν
  choice: அழித்துவிடலாம்
  rationale: ἀπόλλυμι என்பது பொதுவாக ‘அழித்தல்’ என்றும் சூழலின்படி ‘கொல்லுதல்’ என்றும் பொருள்படும். மூலச்சொல்லின் பரந்த பொருளை முதன்மை உரை தக்கவைக்கிறது; இச்சூழலில் உயிரைப் பறிக்கும் நோக்கம் இருப்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐφοβοῦντο
  choice: அவருக்குப் பயந்தார்கள்
  rationale: இயேசுவையும் அவரது செல்வாக்கையும் குறித்து தலைவர்கள் தொடர்ந்து கொண்டிருந்த அச்சத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: கூட்டத்தில் சிலர் மட்டுமல்லாமல் பொதுவாக அனைவரும் பாதிக்கப்பட்டனர் என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: ἐξεπλήσσετο
  choice: வியப்படைந்திருந்தது
  rationale: வலுவான வியப்பையும் தொடர்ந்த நிலையையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: அவரது போதனையைக் கேட்டு
  rationale: அவரது போதனையே கூட்டத்தின் வியப்புக்கான காரணம் அல்லது சந்தர்ப்பம் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀπολέσωσιν என்பதில் தலைவர்களின் நோக்கத்தின் வரம்பு
  choice: ‘அழித்துவிடலாம்’ என்று பரந்த பொருளுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கொல்லலாம்’ அல்லது ‘மரணத்துக்குள்ளாக்கலாம்’
  rationale: உடனடிச் சூழல் உயிரைப் பறிக்கும் சதியைக் காட்டினாலும், கிரேக்க வினைச்சொல் அதைவிடப் பரந்த ‘அழித்தல்’ என்ற பொருளையும் கொண்டுள்ளது. ஆகவே முதன்மை உரை அந்தப் பரப்பைத் தக்கவைத்து, சூழலில் உள்ள கொலைநோக்கை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்நிலைச் செயல்களைத் தெரிவிக்க ‘வழிதேடிக்கொண்டிருந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
