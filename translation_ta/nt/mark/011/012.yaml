  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: ta
  text: மறுநாள், அவர்கள் பெத்தானியாவிலிருந்து புறப்பட்டபோது, அவருக்குப் பசித்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: மறுநாள்
  rationale: καί கதையின் தொடர்ச்சியை இணைக்கிறது. தமிழில் காலக் குறிப்புடன் வாக்கியத்தை இயல்பாகத் தொடங்குவதால் தனியே ‘மேலும்’ அல்லது ‘அப்போது’ சேர்க்காமல் அதன் தொடர்ச்சிப் பணி வெளிப்படுகிறது.
- source_word: τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: இது அடுத்த நாளைக் குறிக்கும் காலவினையடைப் பயன்பாடு. ‘மறுநாள்’ சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: ἐξελθόντων αὐτῶν
  choice: அவர்கள் ... புறப்பட்டபோது
  rationale: இறந்தகாலப் பன்மை genitive absolute அமைப்பின் காலத் தொடர்பையும் பன்மையையும் காக்கிறது. ‘புறப்பட்டபோது’ என்பது ஒரு இடத்திலிருந்து வெளியேறுவதை இயல்பாகச் சொல்கிறது; செயல் முற்றிலும் முடிந்த பின்னரா அல்லது வெளியேறும் சமயத்திலா என்ற நுண்ணிய வேறுபாட்டை தேவையின்றி மிகைப்படுத்தாது.
- source_word: ἀπὸ Βηθανίας
  choice: பெத்தானியாவிலிருந்து
  rationale: ἀπό குறிக்கும் இடத்திலிருந்து விலகிச் செல்லும் பொருளை ‘-இலிருந்து’ நேராக வெளிப்படுத்துகிறது. Βηθανία தமிழில் வழக்கமான இடப்பெயர் வடிவமான ‘பெத்தானியா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: ἐπείνασεν
  choice: அவருக்குப் பசித்தது
  rationale: πεινάω வினையின் இறந்தகாலத்தை நவீனத் தமிழின் இயல்பான அனுபவக் கட்டமைப்பில் தருகிறது. இது பசி ஏற்பட்டதைச் சொல்லக்கூடியதாயிருந்தாலும் ‘பசியானார்’ போன்ற செயற்கையான வடிவத்தையோ ‘பசிக்கத் தொடங்கியது’ போன்ற மிகத் தெளிவாக்கத்தையோ தவிர்க்கிறது.
theological_decisions:
- issue: ἐπείνασεν என்பதன் மறைமுக ஒருமைப் பொருள்
  choice: பெயரைச் சேர்க்காமல் ‘அவருக்கு’ என்று இயேசுவைக் குறித்தல்
  alternative: தெளிவுக்காக ‘இயேசுவுக்குப் பசித்தது’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லை; சூழலில் அது இயேசுவைக் குறிக்கிறது. ‘அவருக்கு’ என்பது மூலத்தின் சுருக்கத்தைக் காத்து, மரியாதையான தமிழில் தெளிவாக உள்ளது. பசியை உண்மையான மனித அனுபவமாக நேரடியாகக் கூறுவதையும் மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிய, கண்ணியமான கதைநடை. மூலத்தின் பன்மை ‘அவர்கள்’ மற்றும் மறைமுக ஒருமை ‘அவருக்கு’ காக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை.
