source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: ta
  text: யோவானின் திருமுழுக்கு வானத்திலிருந்து[a] வந்ததா, மனிதர்களிடமிருந்து[b] வந்ததா? எனக்குப் பதில் சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து.” கிரேக்கத்தில் “வானத்திலிருந்து” என்று உள்ளது; இது தெய்வீகத் தோற்றத்தையோ அதிகாரத்தையோ குறிக்கும் யூத மரியாதை வழக்கு.
    reason: lexical_alternative
  - marker: b
    text: “மனிதர்களிடமிருந்து” என்பது வெறும் மனிதத் தோற்றம் அல்லது மனித அதிகாரத்திலிருந்து வந்தது என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: யோவானின் திருமுழுக்கு
  rationale: யோவானோடு தொடர்புடைய திருமுழுக்கை இயல்பான உடைமைத் தொடரால் குறிக்கிறது; கிரேக்கச் சொல்லின் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: தெய்வீகத் தோற்றம் அல்லது அதிகாரத்தைக் குறிக்கும் யூத மரியாதை வழக்கை விளக்கிப் பதிலிடாமல், மூலத்தின் உருவகத்தையே பாதுகாக்கிறது.
- source_word: ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: ἀνθρώπων என்பது பொதுவாக மனிதர்களைக் குறிக்கிறது. பாலின வரம்பின்றி மனிதத் தோற்றம் அல்லது அதிகாரம் என்ற எதிர்மறை ஒப்பீட்டைத் தெளிவாகத் தருகிறது.
- source_word: ἀποκρίθητέ μοι
  choice: எனக்குப் பதில் சொல்லுங்கள்
  rationale: பலரிடம் நேரடியாகப் பதில் கோரும் இறந்தகாலக் கட்டளை வினையின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἦν ἢ
  choice: வந்ததா ... வந்ததா?
  rationale: கிரேக்கத்தில் ‘இருந்ததா’ என்ற வடிவம் இருந்தாலும், தோற்றத்தைக் குறிக்கும் ‘எங்கிருந்து’ என்ற தொடருடன் தமிழில் ‘வந்ததா’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: ‘வானத்திலிருந்து’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வானத்திலிருந்து’ என்ற மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘கடவுளிடமிருந்து’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இச்சொற்றொடர் கடவுளிடமிருந்து வரும் தோற்றத்தையோ அதிகாரத்தையோ சுட்டுகிறது. ஆனால் அதை நேரடியாக ‘கடவுளிடமிருந்து’ என்று மாற்றாமல் இருப்பது மூலத்தின் மரியாதை வழக்கையும் இயேசுவின் கேள்வியிலுள்ள சொல்லாட்சியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘திருமுழுக்கு’ என்பது βάπτισμα என்பதற்கான தெளிவான திருவிவிலியச் சொல். கேள்வியின் கூர்மையும் நேரடியாகப் பதில் கோரும் தொனியும் தக்கவைக்கப்பட்டுள்ளன.
