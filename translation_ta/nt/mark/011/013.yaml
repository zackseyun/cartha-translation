reference: Mark 11:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: ta
  text: தொலைவிலிருந்து இலைகளுடன் இருந்த ஓர் அத்திமரத்தை அவர் கண்டு, அதில் ஏதாவது கிடைக்குமோ என்று பார்க்க அதனிடம் சென்றார். ஆனால் அதன் அருகில் வந்தபோது, இலைகளைத் தவிர வேறொன்றும் அவர் காணவில்லை; ஏனெனில், அத்திப்பழங்களுக்கான காலம் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது அத்திப்பழங்களுக்கான நேரம் அல்ல.”
    reason: καιρός என்பதற்கு ‘காலம்’ என்பதோடு ‘நேரம்’ என்றும் பொருள் கொள்ளக்கூடிய சொல்லியல் மாற்று.
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டு
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் சூழ்நிலை மற்றும் காலத் தொடர்பை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: συκῆν
  choice: ஓர் அத்திமரத்தை
  rationale: சொல்லின் வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: ἀπὸ μακρόθεν
  choice: தொலைவில்
  rationale: இடத்தொலைவைக் காட்டும் இயல்பான நவீனத் தமிழ்.
- source_word: ἔχουσαν φύλλα
  choice: இலைகளுடன் இருந்த
  rationale: மரத்தில் இலைகள் இருந்ததை நேரடியாகவும் இயல்பாகவும் கூறுகிறது; ‘தழைத்திருந்த’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: அதில் ஏதாவது கிடைக்குமோ என்று பார்க்க அதனிடம் சென்றார்
  rationale: εἰ ἄρα என்பதிலுள்ள எதிர்பார்ப்போடு கலந்த ஐயத்தை ‘கிடைக்குமோ’ காக்கிறது; நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: அவர் அதன் அருகில் சென்றபோது
  rationale: மரத்தை அணுகியதையும் பங்கேற்பு வடிவத்தின் காலத் தொடர்பையும் தெளிவாகத் தருகிறது.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: இலைகளைத் தவிர வேறொன்றும் காணவில்லை
  rationale: εἰ μὴ என்பதன் விலக்குப் பொருளைத் துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: ஏனெனில், அது அத்திப்பழக் காலம் அல்ல
  rationale: καιρός என்பதற்கு இச்சூழலில் பொருத்தமான ‘காலம்’ என்பதைத் தேர்ந்தெடுத்து, உரையிலுள்ள பதற்றத்தை விளக்கிச் சமரசப்படுத்தாமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: அத்திப்பழக் காலத்தைப் பற்றிய விளக்கக் கூற்றின் பொருள்
  choice: ‘ஏனெனில், அது அத்திப்பழக் காலம் அல்ல’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: வேளாண்மைச் சூழலைச் சேர்த்து, ஏன் பழம் எதிர்பார்க்கப்பட்டது என்பதை விளக்குதல்
  rationale: இயேசு பழத்தைத் தேடுவதற்கும் அது அத்திப்பழக் காலம் அல்ல என்ற உரையாளரின் குறிப்புக்கும் இடையிலுள்ள பதற்றத்தை மூல உரை போலவே வைத்திருக்கிறது; மொழிபெயர்ப்பு அதைத் தீர்க்க முயலவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கிடைக்குமோ’ என்பது மூலத்தின் ஐயத்தைக் காக்கிறது; வேளாண்மை அல்லது இறையியல் விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
