  source_fidelity: மூல கிரேக்கத்தின் முற்றுப்பெறாத இறந்தகாலமான ἔλεγον, ‘என்று கேட்டுக்கொண்டிருந்தார்கள்’ எனத் தொடர்ச்சியான கேள்வியாகப் பொருத்தமாகத் தரப்பட்டுள்ளது. இரண்டு கேள்விகளும், ‘எந்த அதிகாரத்தால்’ என்ற அதிகாரத்தின் அடிப்படை பற்றிய சவாலும், ‘யார் உமக்குக் கொடுத்தவர்’ என்ற வழங்குநரைப் பற்றிய சவாலும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன. ἵνα ταῦτα ποιῇς என்பதன் நோக்கத் தொடர்பு ‘இவற்றைச் செய்வதற்கான’ என இயல்பாக வெளிப்படுகிறது.
