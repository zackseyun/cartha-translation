source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “எந்த அதிகாரத்தால் இவற்றைச் செய்கிறீர்? அல்லது இவற்றைச் செய்வதற்கான இந்த அதிகாரத்தை உமக்குக் கொடுத்தவர் யார்?” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்துகொண்டிருந்த பேச்சைச் சுட்டுகிறது. கேள்வியின் உள்ளடக்கத்தை முன்னிட்டு, இயல்பான தமிழில் ‘கேட்டுக்கொண்டிருந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: ἐν + வேற்றுமை உருபு இங்கு செயலை மேற்கொள்வதற்கான அதிகார அடிப்படையைக் கேட்கிறது; ‘எந்த அதிகாரத்தால்’ என்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: அதிகாரம்
  rationale: இச்சூழலில் இந்தச் சொல் ஒரு செயலைச் செய்வதற்கான உரிமை அல்லது அங்கீகரிக்கப்பட்ட அதிகாரத்தைக் குறிக்கிறது; ‘அதிகாரம்’ இரு இடங்களிலும் ஒரே சொல்லாகத் தக்கவைக்கப்பட்டது.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: இவற்றைச் செய்கிறீர் / இவற்றைச் செய்வதற்கான
  rationale: பன்மையான ταῦτα, இயேசுவின் அண்மைய செயல்களைப் பொதுவாகச் சுட்டுவதால் ‘இவற்றை’ எனப் பாதுகாக்கப்பட்டது.
- source_word: ἢ
  choice: அல்லது
  rationale: இரண்டாவது கேள்வி முதற்கேள்வியின் மாற்று வடிவமாக முன்வைக்கப்படுவதால் ‘அல்லது’ பொருத்தமானது.
- source_word: τίς σοι ἔδωκεν
  choice: உமக்குக் கொடுத்தவர் யார்
  rationale: கிரேக்க இறந்தகால வினை இயல்பான தமிழ் நேரடிக் கேள்வியாக மொழிபெயர்க்கப்பட்டது; மரியாதை ஒருமை சூழலுக்கு ஏற்றவாறு பயன்படுத்தப்பட்டது.
- source_word: ἵνα ταῦτα ποιῇς
  choice: இவற்றைச் செய்வதற்கான
  rationale: ἵνα உடன் வரும் வினை இங்கு கொடுக்கப்பட்ட அதிகாரத்தின் நோக்கத்தைச் சுட்டுகிறது; தமிழில் பெயரெச்சத் தொடராக அமைப்பது இயல்பானதும் பொருள் குன்றாததும் ஆகும்.
theological_decisions:
- issue: இயேசுவின் அதிகாரத்தின் மூலம்
  choice: தலைவர்களின் சவாலை நடுநிலையாகக் கேள்வி வடிவிலேயே வைத்தல்
  alternative: சூழலின் அடிப்படையில் ‘தெய்வீக அதிகாரம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இந்த வசனம் அதிகாரத்தின் மூலத்தைத் தீர்மானித்து அறிவிக்காமல், எதிர்ப்பாளர்களின் கேள்வியை மட்டும் பதிவு செய்கிறது. ஆகவே இறையியல் முடிவு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டது. ‘நீர்/உமக்கு’ சார்ந்த மரியாதை ஒருமை வினை மற்றும் பெயர்ச்சொல் வடிவங்கள் கையாளப்பட்டுள்ளன. அசல் உரையின் இரு நெருக்கமான கேள்விகளும் அதன் அதிகாரச் சவாலும் பாதுகாக்கப்பட்டுள்ளன.
