source:
  edition: SBLGNT
  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: ta
  text: அதிகாலையில் அவர்கள் அவ்வழியே சென்றுகொண்டிருந்தபோது, அந்த அத்திமரம் வேர்களிலிருந்தே பட்டுப்போயிருந்ததைக்[a] கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேர்களிலிருந்தே காய்ந்துபோயிருந்ததை.”
    reason: ἐξηραμμένην என்பதற்கு ‘பட்டுப்போன’ என்றும் ‘காய்ந்துபோன’ என்றும் இச்சூழலில் பொருள் கொள்ளலாம்; மாற்று மொழிபெயர்ப்பு மூலத்தின் உலர்ந்த நிலையை இன்னும் நேரடியாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: அவர்கள் அவ்வழியே சென்றுகொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினை, பிரதான வினையுடன் ஒரே நேரத்தில் நடைபெற்ற பின்னணி நிகழ்வைக் குறிக்கிறது. ‘சென்றுகொண்டிருந்தபோது’ என்பது அந்தத் தொடர்ச்சியையும் காலத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πρωῒ
  choice: அதிகாலையில்
  rationale: இச்சொல் காலை வேளையை, குறிப்பாக அதன் தொடக்க நேரத்தை, குறிக்கிறது. ‘அதிகாலையில்’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: εἶδον
  choice: கண்டார்கள்
  rationale: இது நேரடியான பார்வைப் புலன் வினை. ‘கண்டார்கள்’ என்பது கூடுதல் விளக்கம் சேர்க்காமல் மூலத்தின் பொருளைத் தருகிறது.
- source_word: συκῆν
  choice: அந்த அத்திமரம்
  rationale: இக்கதைச் சூழலில் συκῆ என்பது முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட அத்திமரத்தைக் குறிக்கிறது; எனவே ‘அந்த அத்திமரம்’ இயல்பான தமிழாக்கம்.
- source_word: ἐξηραμμένην
  choice: பட்டுப்போயிருந்ததை
  rationale: நிகழ்ந்து முடிந்த செயலில் இருந்து தொடரும் மரத்தின் நிலையை நிறைவுநிலைப் பங்கேற்புவினை காட்டுகிறது. ஒரு மரத்தைப் பற்றிய இயல்பான நவீனத் தமிழில் ‘பட்டுப்போயிருந்தது’ அந்த விளைவு நிலையைக் காட்டுகிறது.
- source_word: ἐκ ῥιζῶν
  choice: வேர்களிலிருந்தே
  rationale: மரம் பட்டுப்போனது வேர்களிலிருந்து தொடங்கியதையோ வேர்கள் வரை முழுமையாகப் பரவியதையோ இச்சொற்றொடர் சுட்டலாம். ‘வேர்களிலிருந்தே’ மூலத்தின் உருவகத்தையும் வலியுறுத்தலையும் காக்கிறது; எந்த ஒரு விளக்கத்தையும் மிகையாகத் தீர்மானிப்பதில்லை.
