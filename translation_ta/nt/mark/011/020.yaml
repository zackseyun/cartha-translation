translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. பின்னணி நிகழ்வின் தொடர்ச்சியை ‘சென்றுகொண்டிருந்தபோது’ என்றும், நிறைவுற்ற செயலின் விளைவு நிலையை ‘பட்டுப்போயிருந்ததை’ என்றும் வெளிப்படுத்துகிறது.
