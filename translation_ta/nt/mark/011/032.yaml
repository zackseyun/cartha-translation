base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: ta
  text: ஆனால், ‘மனிதர்களிடமிருந்து’ என்று சொன்னால்?”—அவர்கள் மக்கள் கூட்டத்துக்கு அஞ்சினார்கள்; ஏனெனில் யோவான் உண்மையிலேயே ஒரு தீர்க்கதரிசி என்று அனைவரும் கருதினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: கிரேக்க வாசகத்தை, “அனைவரும் யோவானை உண்மையில் ஒரு தீர்க்கதரிசியாகக் கருதினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: ஆனால், … என்று சொன்னால்?
  rationale: அவர்களுடைய உள்ளார்ந்த ஆலோசனையில் முன்வைக்கப்படும் மாற்று விடையை எதிர்மறைத் தொடர்போடும் இயல்பான தமிழ் நிபந்தனை வாக்கியத்தோடும் காட்டுகிறது.
- source_word: Ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து வந்தது
  rationale: யோவானின் திருமுழுக்கின் மூலம் மனிதரிடமா என்பதைக் குறிக்கும் மூலக் கருத்தைத் தெளிவாக்க ‘வந்தது’ சேர்க்கப்பட்டுள்ளது; தெய்வீக மூலத்திற்கு எதிரான மனித மூலத்தை இது குறிக்கிறது.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: அவர்கள் மக்கள் கூட்டத்துக்குப் பயந்தார்கள்
  rationale: இச்சூழலில் ὄχλος கூடியிருந்த மக்கள் கூட்டத்தைக் குறிக்கிறது; imperfect வினையின் சூழ்நிலை சார்ந்த தொடர்ந்த அச்சத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἅπαντες γὰρ εἶχον
  choice: ஏனெனில் … அனைவரும் கருதினார்கள்
  rationale: γὰρ அச்சத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; இங்கு ἔχω ஒருவரைப் பற்றிய உறுதியான கருத்தைக் கொண்டிருப்பதைக் குறிக்கிறது.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: உண்மையிலேயே ஒரு தீர்க்கதரிசி என்று
  rationale: ὄντως என்பதன் வலியுறுத்தலைக் காத்து, யோவானின் தீர்க்கதரிசி நிலையைப் பற்றிய மக்களின் உறுதியான மதிப்பீடாக வாக்கியத்தை அமைக்கிறது.
theological_decisions:
- issue: Ἐξ ἀνθρώπων என்பதில் யோவானின் திருமுழுக்கின் மூலம்
  choice: மனிதர்களிடமிருந்து வந்தது
  alternative: மனித மூலத்திலிருந்து வந்தது
  rationale: மனித மற்றும் தெய்வீக மூலம் ஆகியவற்றுக்கிடையிலான எதிர்மறையைப் பாதுகாக்கிறது; ஆனால் ‘மனித மூலத்திலிருந்து’ என்ற விளக்கமான வாசிப்பை முதன்மை உரையில் திணிக்கவில்லை.
- issue: ὄντως ὅτι προφήτης ἦν என்பதன் வலியுறுத்தலும் பார்வைநிலையும்
  choice: யோவான் உண்மையிலேயே ஒரு தீர்க்கதரிசி என்று அனைவரும் கருதினார்கள்
  alternative: அனைவரும் யோவானை உண்மையில் ஒரு தீர்க்கதரிசியாகக் கருதினார்கள்
  rationale: இது உரையாசிரியரின் தனிப்பட்ட புதிய உறுதிப்படுத்தலாக அல்லாமல், யோவானைப் பற்றிய மக்களின் உறுதியான நம்பிக்கையாகவே கூற்றை வைத்திருக்கிறது; அதேவேளையில் ὄντως என்பதன் வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தீர்க்கதரிசி’ என்பது பொதுவாக அறியப்பட்ட வேதாகமச் சொல். கேள்விக்குள் தடைபடும் ஆலோசனையையும் அதைத் தொடர்ந்து வரும் கதைசொல்லியின் விளக்கத்தையும் நீள்கோடு தெளிவுபடுத்துகிறது.
