source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: ta
  text: '“உறுதியாக உங்களுக்குச் சொல்கிறேன்: ஒருவன் இந்த மலையிடம், ‘தூக்கப்பட்டுக் கடலில் எறியப்படு’ என்று சொல்லி, தன் உள்ளத்தில் சந்தேகப்படாமல்[a], தான் சொல்வது நடக்கிறது[b] என்று நம்பினால், அவனுக்கு அது அப்படியே ஆகும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தடுமாறாமல்’ அல்லது ‘தனக்குள் இருபட்ட மனமில்லாமல்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் சந்தேகத்தோடு உள்ளார்ந்த பிளவையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘தான் சொல்வது நிகழ்கிறது’ அல்லது ‘நிறைவேறுகிறது’ என்றும் மொழிபெயர்க்கலாம். அடுத்து எதிர்கால விளைவு கூறப்பட்டாலும், இங்கு கிரேக்கத்தில் நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உறுதியாக உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் கூற்றை அறிமுகப்படுத்தும் வலியுறுத்தல் சூத்திரத்தை இயல்பான நவீனத் தமிழில், அதன் உறுதியையும் நேரடி அழைப்பையும் காத்து வழங்குகிறது.
- source_word: ὃς ἂν εἴπῃ
  choice: ஒருவன் ... சொல்லி ... நம்பினால்
  rationale: ἄν உடன் வரும் இறந்தகாலத் துணைவினை பொதுவான நிபந்தனையைக் குறிக்கிறது. தமிழில் நிபந்தனை வாக்கிய அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῷ ὄρει τούτῳ
  choice: இந்த மலையைப் பார்த்து
  rationale: ὄρος என்பதற்கு ‘மலை’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டு, τούτῳ என்பதன் அண்மைச் சுட்டும் காக்கப்படுகிறது. தமிழில் உயிரற்ற ஒன்றிடம் பேசுவதை ‘பார்த்து’ என அமைப்பது இயல்பானது.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: தூக்கப்பட்டுக் கடலில் எறியப்படு
  rationale: இரண்டு வினைகளின் செயலப்பாட்டு ஏவல் வடிவமும், மலையை அதன் இடத்திலிருந்து தூக்கிக் கடலில் எறியும் தெளிவான உருவகமும் காக்கப்படுகின்றன.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: தன் உள்ளத்தில் சந்தேகப்படாமல்
  rationale: இச்சூழலில் διακρίνω உள்ளார்ந்த சந்தேகம் அல்லது தடுமாற்றத்தைக் குறிக்கிறது. καρδία என்பதைக் கருத்து, மனவுறுதி ஆகியவற்றின் உள்ளார்ந்த மையமாக ‘உள்ளம்’ இயல்பாகக் குறிக்கிறது.
- source_word: πιστεύῃ
  choice: நம்பினால்
  rationale: நிபந்தனை அமைப்புக்குள் πιστεύω என்பதன் அடிப்படைப் பொருளான நம்புதலை நேரடியாக வழங்குகிறது.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: தான் சொல்வது நடக்கிறது
  rationale: γίνεται என்பதன் நிகழ்கால வடிவத்தை எதிர்காலமாக மாற்றாமல் ‘நடக்கிறது’ என்று காக்கிறது; λαλεῖ இச்சூழலில் இயல்பாக ‘சொல்வது’ என வழங்கப்படுகிறது.
- source_word: ἔσται αὐτῷ
  choice: அவனுக்கு அது அப்படியே ஆகும்
  rationale: எது அல்லது எந்த முறையில் கிடைக்கும் என்று கிரேக்கம் விளக்காத திறந்த முடிவை அதிகமாகக் குறிப்பாக்காமல் காக்கிறது.
theological_decisions:
- issue: நம்பிக்கையுடன் கூறப்படுவதைக் குறித்த வாக்குறுதியின் தன்மை
  choice: வசனத்தின் நிபந்தனையையும் அதன் வலிமையான மலை உருவகத்தையும் நேரடியாகக் காத்தல்
  alternative: இதை வெறும் மிகைப்படுத்தல் என்று மென்மையாக்குதல் அல்லது எந்த வரம்பும் இல்லாத வாக்குறுதியாக விரிவாக்குதல்
  rationale: மூல வசனம் பிற்கால இறையியல் வரையறைகளையோ விதிவிலக்குகளையோ கூறவில்லை. ஆகவே அதன் வலிமையையும் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் விடுகிறது.
- issue: αὐτοῦ / αὐτῷ என்பவற்றின் ஆண்பால் ஒருமை வடிவம்
  choice: ஒருவன் / தன் / அவன்
  alternative: யாராவது / அவர்கள்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவப் பொதுப்பொருளுள்ள ஆண்பால் ஒருமையைத் தமிழிலும் ஒருமையாகக் காக்கிறது; இது கூற்றின் பயன்பாட்டை ஆண்களுக்கு மட்டும் கட்டுப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் கூற்றுக்குரிய கண்ணியமான, உறுதியான தொனியுடனும் அமைக்கப்பட்டுள்ளது. நேரடி பேச்சின் தீவிரமான உருவகம் மற்றும் மூலத்தின் நிகழ்கால–எதிர்கால வேறுபாடு காக்கப்பட்டுள்ளன.
