  text: Εὐλογημένη ἡ ἐρχομένη ⸀βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: ta
  text: நம் தந்தையான தாவீதின் வருகிற அரசாட்சி ஆசீர்வதிக்கப்பட்டதாக இருக்கட்டும்! உன்னதங்களில் ஓசன்னா![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓசன்னா” என்பது “தயவுசெய்து காப்பாற்றுங்கள்” அல்லது “இப்போதே காப்பாற்றுங்கள்” என்ற வேண்டுதலைப் பிரதிபலிக்கலாம்; ஆனால் இங்கே அது வழிபாட்டுப் புகழாரவாரமாகச் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: ஆசீர்வதிக்கப்பட்டது
  rationale: வழிபாட்டு வாழ்த்தொலியின் தன்மையையும் ‘பேறுபெற்றது/போற்றப்பட்டது’ என்ற பொருள் நிழலையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: வருகின்ற … அரசாட்சி
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் ‘வந்து கொண்டிருக்கும்/வரும்’ வலிமையைத் தக்கவைத்து, ‘வரவிருக்கும்’ என்று எதிர்காலத்தை மிகையாக உறுதிப்படுத்தாமல் மொழிபெயர்க்கிறது.
- source_word: βασιλεία
  choice: அரசாட்சி
  rationale: இங்கு தாவீதோடு தொடர்புடைய ராஜரீதியான ஆட்சியையும் அரசையும் குறிக்கக்கூடிய கிரேக்கச் சொல்லின் பொருள் பரப்பை, நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: நம் தந்தை தாவீதின்
  rationale: தாவீதை மூதாதையாக மதித்துக் குறிப்பிடும் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: Ὡσαννὰ
  choice: ஓசன்னா
  rationale: புதிய ஏற்பாட்டுக் காலத்தில் நிலைபெற்ற வழிபாட்டு ஆரவாரச் சொல்லாக இருப்பதால் ஒலிபெயர்ப்பு முதன்மை உரையில் வைக்கப்படுகிறது; அதன் மூல வேண்டுதல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τοῖς ὑψίστοις
  choice: உன்னதங்களில்
  rationale: மிக உயர்ந்த பரலோகப் பகுதிகளைக் குறிக்கக்கூடிய கிரேக்க மரபுத்தொடரை விளக்கவுரை சேர்க்காமல் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: தாவீதின் அரசாட்சியைப் பற்றிய ஆரவாரத்தின் தன்மை
  choice: ‘வருகின்ற நம் தந்தை தாவீதின் அரசாட்சி’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘வருகின்ற நம் தந்தை தாவீதின் மேசிய அரசாட்சி’
  rationale: சூழல் மேசிய எதிர்பார்ப்பை உணர்த்தினாலும், கிரேக்க உரை ‘மேசிய’ என்று வெளிப்படையாகச் சொல்லவில்லை. ஆகவே அந்த இறையியல் தொடர்பை உரைக்குள் சேர்க்காமல், மூலத்தின் பதற்றமும் குறிப்புணர்வும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. ‘ராஜ்யம்’ என்பதற்குப் பதிலாக ‘அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டு, ஆளுகை மற்றும் அரசுரிமை ஆகிய இரு நிழல்களும் காக்கப்பட்டுள்ளன.
