source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: ta
  text: அவர்கள் தங்களுக்குள், “நாம் என்ன சொல்வது? ‘வானத்திலிருந்து’[a] என்று சொன்னால், ‘அப்படியானால் நீங்கள் ஏன் அவரை நம்பவில்லை?’ என்று அவர் சொல்வார்” என ஆலோசித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானத்திலிருந்து” என்பது “கடவுளிடமிருந்து” அல்லது “தெய்வீக மூலத்திலிருந்து” என்று பொருள்படும் யூத மரியாதை வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: ஆலோசித்தார்கள்
  rationale: குழுவினர் தொடர்ந்து பரஸ்பரம் யோசித்து விவாதித்ததைக் குறிக்கும் வினை; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள குழு ஆலோசனையை வெளிப்படுத்துகிறது.
- source_word: πρὸς ἑαυτοὺς
  choice: தங்களுக்குள்
  rationale: தனித்தனி மனச்சிந்தனையை அல்ல, குழுவினருக்கிடையிலான உரையாடலைக் குறிக்கிறது.
- source_word: λέγοντες
  choice: மேற்கோள் உரையை ‘என’ என்பதன் மூலம் ஆலோசித்தார்கள் என்பதோடு இணைத்தல்
  rationale: தனியாக ‘சொல்லிக்கொண்டு’ என மொழிபெயர்ப்பதைவிட, தமிழின் இயல்பான வாக்கிய அமைப்பில் ஆலோசனையின் உள்ளடக்கத்தை நேரடியாக அறிமுகப்படுத்துகிறது.
- source_word: Τί εἴπωμεν;
  choice: நாம் என்ன சொல்வது?
  rationale: எத்தகைய பதிலை அளிப்பது என்ற ஆலோசனைத் தொனியை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐὰν εἴπωμεν
  choice: என்று சொன்னால்
  rationale: கிரேக்கத்தின் நிபந்தனை அமைப்பை எளிய, இயல்பான தமிழில் காக்கிறது.
- source_word: Ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: மூலத்தின் உருவகச் சொல்லாட்சியை விளக்கமாக மாற்றாமல் அப்படியே காக்கிறது; அதன் தெய்வீக மூலத்தைக் குறிக்கும் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐρεῖ
  choice: அவர் சொல்வார்
  rationale: λέγω என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; தொடர்ந்து வரும் மேற்கோளே கேள்வி வடிவில் உள்ளது.
- source_word: Διὰ τί οὖν
  choice: அப்படியானால் ஏன்
  rationale: அவர்களின் கற்பனைப் பதிலிலிருந்து வரும் தர்க்கரீதியான விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: நீங்கள் ஏன் அவரை நம்பவில்லை?
  rationale: தத்திவ வேற்றுமையுடன் வரும் πιστεύω, யோவானையும் அவரது சாட்சியையும் நம்பி ஏற்றுக்கொள்வதைக் குறிக்கிறது; ‘அவர்மேல் விசுவாசம் வைக்கவில்லை’ என்ற வேறுபட்ட இறையியல் நுணுக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோவானின் திருமுழுக்கு அல்லது அதிகாரத்தின் மூலத்தைக் குறிக்கும் ‘வானத்திலிருந்து’ என்ற சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘வானத்திலிருந்து’ என்பதைத் தக்கவைத்தல்
  alternative: கடவுளிடமிருந்து
  rationale: இது தெய்வீக மூலத்தையோ அதிகாரத்தையோ குறிக்கும் யூத மரியாதை வழக்கு. ‘கடவுளிடமிருந்து’ என்று நேரடியாக மாற்றுவது மூலத்தின் உருவகத்தையும் உரையாடலின் சொல்லாட்சியையும் தட்டையாக்கும்; எனவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் பங்கேற்பு அமைப்பு தமிழில் இயல்பான நேரடி மேற்கோள் மற்றும் ‘என ஆலோசித்தார்கள்’ என்ற அமைப்பாக மறுசீரமைக்கப்பட்டுள்ளது.
