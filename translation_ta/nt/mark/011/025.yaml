source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: ta
  text: நீங்கள் நின்று ஜெபிக்கும்போதெல்லாம், யார்மீதாவது உங்களுக்கு ஏதேனும் குறை இருந்தால், அவரை மன்னியுங்கள்; பரலோகங்களில் இருக்கும் உங்கள் தந்தையும் உங்கள் மீறுதல்களை மன்னிக்கும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: நின்று ஜெபிக்கும்போதெல்லாம்
  rationale: நிற்கும் உடல் நிலையையும், அதே நேரத்தில் நடைபெறும் ஜெபத்தையும் இயல்பான தமிழில் காக்கிறது; இதை வெறுமனே ‘ஜெபிக்கும்போது’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: ἀφίετε
  choice: மன்னித்துவிடுங்கள்
  rationale: மனக்குறையை விட்டுவிடுதல் என்ற நுணுக்கத்துடன், மனித உறவுச் சூழலில் தெளிவாகப் புரியும் மன்னிப்பைக் குறிக்கிறது.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: யார்மீதாவது உங்களுக்கு ஏதேனும் குறை இருந்தால்
  rationale: τι / τινος என்பவற்றின் வரையறையற்ற பரப்பைத் தக்கவைத்து, ஒருவருக்கு எதிரான குறை அல்லது மனக்குறையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில் இருக்கும் உங்கள் தந்தை
  rationale: மூலத்தின் οὐρανοῖς என்ற பன்மை வடிவைத் தக்கவைக்கிறது; வழக்கமான ஒருமை வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀφῇ
  choice: மன்னிப்பார்
  rationale: ἵνα கூறும் நோக்கம்/விளைவு தொடர்பை முந்தைய கட்டளையோடு ‘அப்போது’ இணைக்கிறது; தமிழில் இயல்பில்லாத சொல்லுக்குச் சொல் துணைவினை வடிவத்தைத் தவிர்க்கிறது.
- source_word: παραπτώματα
  choice: மீறுதல்கள்
  rationale: தவறான அடியெடுத்து வைத்தல், வரம்பு மீறல், குற்றம் ஆகிய பொருள் வட்டத்தை வெளிப்படுத்தி, பொதுவான ‘பாவங்கள்’ என்பதிலிருந்து மூலச் சொல்லின் வேறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: மனிதர் பிறரை மன்னிப்பதற்கும் தந்தை அவர்களை மன்னிப்பதற்கும் இடையிலான நிபந்தனை சார்ந்த தொடர்பு
  choice: ‘மன்னித்துவிடுங்கள். அப்போது ... தந்தையும் ... மன்னிப்பார்’ என்று நேரடித் தொடர்புடன் மொழிபெயர்க்கப்பட்டது.
  alternative: பிறரை மன்னிப்பது ஏற்கெனவே கிடைத்த இறைமன்னிப்பின் வெறும் அடையாளம் என்று விளக்கிச் சொல்வது.
  rationale: ἵνα ... ἀφῇ பிறரை மன்னிப்பதையும் தந்தையின் மன்னிப்பையும் உண்மையாக இணைக்கிறது. விரிவான கோட்பாட்டு அமைப்பால் அந்தத் தளராத பதற்றத்தை நீக்காமல் வசனம் கூறும் தொடர்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தந்தை’ என்பது இயல்பான குடும்பச் சொல்லாகவும், ‘பரலோகங்கள்’ என்பது மூலத்தின் பன்மையை வெளிப்படுத்தும் சமயச் சூழலுக்கு ஏற்ற சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளது.
