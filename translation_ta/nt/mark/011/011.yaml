source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: ta
  text: அவர் எருசலேமுக்குள், ஆலய வளாகத்திற்குள் நுழைந்தார்.[a] எல்லாவற்றையும் சுற்றிப் பார்த்த பின்பு, நேரம் ஏற்கெனவே மிகவும் ஆகிவிட்டதால்,[b] அவர் பன்னிருவருடன்[c] பெத்தானியாவுக்குப் புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆலயப் பகுதிகள்” அல்லது சுருக்கமாக “ஆலயம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலயத்தின் விரிந்த வளாகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நேரம் ஏற்கெனவே தாமதமாகிவிட்டதால்” அல்லது “நாளில் ஏற்கெனவே மிகவும் ஆகிவிட்டதால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, இயேசுவின் பன்னிரு சீடர்கள்.
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: வந்து ... நுழைந்தார்
  rationale: எருசலேமுக்குள் வருவதையும் ஆலய வளாகத்திற்குள் நுழைவதையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; ஒரே கிரேக்க வினைச்சொல் இரு εἰς சொற்றொடர்களுடனும் தொடர்புபடுவதால் தமிழில் இயக்கம் விரித்துரைக்கப்படுகிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: இடப்பெயரின் தமிழில் வழக்கமான வடிவம்.
- source_word: τὸ ἱερόν
  choice: ஆலய வளாகம்
  rationale: ἱερόν என்பது உட்புறப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் விரிந்த ஆலயப் பகுதிகளைக் குறிக்கிறது; எனவே ναός என்பதிலிருந்து வேறுபாடு காக்கப்படுகிறது.
- source_word: περιβλεψάμενος
  choice: சுற்றிப் பார்த்த பின்பு
  rationale: சுற்றிலும் பார்வையிட்ட செயலும், அதைத் தொடர்ந்து அவர் புறப்பட்ட நிகழ்வும் இயல்பான தமிழில் வெளிப்படுகின்றன.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: இயேசு கவனித்தவற்றின் முழுமையை மேலதிக விவரமின்றி காக்கிறது.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: நேரம் ஏற்கெனவே கடந்திருந்ததால்
  rationale: இந்நேரச் சூழலைக் குறிக்கும் genitive absolute தொடரின் கால மற்றும் காரணத் தொடர்பைத் தக்கவைக்கிறது; நாளில் நேரம் மிகவும் ஆகிவிட்டது என்பதே பொருள்.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: அங்கிருந்து வெளியேறி பெத்தானியாவை நோக்கிச் சென்ற இயக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: Βηθανίαν
  choice: பெத்தானியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: μετὰ τῶν δώδεκα
  choice: பன்னிருவருடன்
  rationale: கிரேக்கத்தில் உள்ள எண்ணைக் குழுவின் பெயராக மிகைப்படுத்தாமல், இயேசுவின் பன்னிரு சீடர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: τὸ ἱερόν என்பதன் இடவியல் குறிப்பு
  choice: ஆலய வளாகம்
  alternative: ஆலயம்
  rationale: இது உட்புறத் திருத்தலத்தைக் குறிக்கும் ναός அல்ல; பொதுமக்கள் செல்லக்கூடிய விரிந்த ஆலயப் பகுதியைக் குறிக்கும் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: οἱ δώδεκα என்பதைக் குழுப் பெயராகக் காட்டுதல்
  choice: பன்னிருவர்
  alternative: பன்னிரு சீடர்கள்
  rationale: மூலத்தில் ‘சீடர்கள்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. ‘பன்னிருவர்’ என்பது அந்த அடையாளம் தெரியும் வகையில் மூலத்தின் சுருக்கத்தைக் காக்கிறது; அடிக்குறிப்பு குறிப்பை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. இடவியல் துல்லியத்திற்காக ‘ஆலய வளாகம்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியைத் தக்கவைத்தபடியே, தமிழின் இயல்பான இயக்க வரிசைக்காக முதல் பகுதி சற்றே விரிக்கப்பட்டுள்ளது.
