revisions:
- from: அவர் எருசலேமுக்குள் வந்து, ஆலய வளாகத்திற்குள் நுழைந்தார்.[a] எல்லாவற்றையும் சுற்றிப் பார்த்த பின்பு, நேரம் ஏற்கெனவே கடந்திருந்ததால்,[b] பன்னிருவருடன்[c] பெத்தானியாவுக்குப் புறப்பட்டுச் சென்றார்.
  to: அவர் எருசலேமுக்குள், ஆலய வளாகத்திற்குள் நுழைந்தார்.[a] எல்லாவற்றையும் சுற்றிப் பார்த்த பின்பு, நேரம் ஏற்கெனவே மிகவும் ஆகிவிட்டதால்,[b] அவர் பன்னிருவருடன்[c] பெத்தானியாவுக்குப் புறப்பட்டுச் சென்றார்.
  rationale: The revision corrects the late-hour expression to reflect the Greek more precisely and simplifies the entry clause so that one act of entering governs both Jerusalem and the temple precincts. The revised footnote b is recast as a genuine alternative rather than an explanatory restatement. No doctrinal interpretation is added.
