source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “நான் உங்களிடம் ஒரு கேள்வி கேட்பேன்.[a] எனக்குப் பதில் சொல்லுங்கள்; நீங்கள் பதில் சொன்னால், இவற்றை எந்த அதிகாரத்தால் செய்கிறேன் என்று உங்களுக்குச் சொல்வேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு காரியத்தைக் கேட்பேன்’ அல்லது, சொல்லுக்குச் சொல், ‘ஒரு சொல்லைக் கேட்பேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அதற்கு
  rationale: முந்தைய வசனத்தில் தலைவர்கள் கேட்ட கேள்விக்கு இயேசு பதிலளிக்கும் திருப்பத்தை இயல்பான தமிழில் குறிக்கிறது; எதிர்மறை வேறுபாட்டை அளவுக்கு மீறி வலுப்படுத்தவில்லை.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் … என்றார்
  rationale: கிரேக்கக் கதையாடல் வடிவத்தை இயல்பான தமிழ் நேர்கூற்று அமைப்பில் வழங்குகிறது.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: நானும் உங்களிடம் … கேட்கிறேன்
  rationale: வடிவத்தில் எதிர்காலமாயிருந்தாலும், இங்கு உடனடியாக முன்வைக்கப்படும் எதிர்க்கேள்வியை இயல்பான தமிழில் நிகழ்காலத்தால் கூறுகிறது. ‘நானும்’ என்பது அவர்கள் கேட்டதற்கு பதிலாக இயேசுவும் கேட்பதை வெளிப்படுத்துகிறது.
- source_word: ἕνα λόγον
  choice: ஒரு கேள்வி
  rationale: λόγος என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், பதில் கோரும் இச்சூழலில் ‘கேள்வி’ என்பதே கருத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀποκρίθητέ μοι
  choice: எனக்குப் பதில் சொல்லுங்கள்
  rationale: நேரடியான கட்டளையின் வலிமையை மரியாதைப் பன்மையுடன் இயல்பான தமிழில் காக்கிறது.
- source_word: καὶ ἐρῶ ὑμῖν
  choice: அப்போது … உங்களுக்குச் சொல்வேன்
  rationale: அவர்கள் பதிலளித்த பின் இயேசு தெரிவிப்பார் என்ற தொடர்ச்சியான தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; வெளிப்படையான நிபந்தனையை மூலத்தில் இல்லாதபடி சேர்க்கவில்லை.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: செயல்களுக்கான உரிமை, அங்கீகாரம், அதிகார அடிப்படை ஆகியவற்றை உள்ளடக்கும் சூழலுக்கேற்ற தமிழ் வடிவம்.
- source_word: ταῦτα ποιῶ
  choice: இவற்றை … செய்கிறேன்
  rationale: விவாதத்திற்குள்ளான இயேசுவின் செயல்களைச் சுட்டும் நிகழ்காலத்தை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: இச்சூழலில் ἐξουσία என்பதன் தன்மை
  choice: அதிகாரம்
  alternative: உரிமை; வல்லமை
  rationale: ஆலயத் தலைவர்களுடனான இவ்விவாதத்தில் இயேசு செயல்படுவதற்கான நியாயமான அதிகாரமே மையக் கேள்வி. ‘அதிகாரம்’ என்பது இதை வெறும் திறனாகவோ வல்லமையாகவோ குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேர்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடரிணைப்பு தமிழில் இயல்பாகப் பிரிக்கப்பட்டு, கட்டளை மற்றும் அதனைத் தொடரும் வாக்குறுதி தெளிவாக்கப்பட்டுள்ளன.
