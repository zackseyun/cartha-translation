  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: ta
  text: ஆலய வளாகத்தின் வழியாக[a] யாரும் எந்தப் பொருளையும்[b] சுமந்து செல்ல அவர் அனுமதிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயப் பிரகாரங்களின் வழியாக.’ கிரேக்கச் சொல் உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எந்தப் பாத்திரத்தையும்’ அல்லது ‘எந்தக் கருவியையும்.’ கிரேக்கச் சொல் பரந்த பொருளுடையது; எடுத்துச் செல்லப்பட்ட பொருள் எந்த வகையைச் சேர்ந்தது என்று அது குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: அனுமதிக்கவில்லை
  rationale: ἀφίημι என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம், அந்த நேரத்தில் இயேசு இதைத் தொடர்ந்து தடுத்துக்கொண்டிருந்ததை உணர்த்துகிறது. தமிழில் இயல்பான ‘அனுமதிக்கவில்லை’ என்பது சூழலுடன் சேர்ந்து இந்தத் தொடர்ச்சியான தடையை வெளிப்படுத்துகிறது.
- source_word: ἵνα τις διενέγκῃ
  choice: யாரும் … சுமந்து செல்ல
  rationale: ἤφιεν என்பதற்குப் பின் வரும் ἵνα மற்றும் வினையெச்ச வடிவம், அவர் எதை நிகழ அனுமதிக்கவில்லை என்பதைக் குறிக்கிறது. தமிழில் ‘யாரும் … சுமந்து செல்ல … அனுமதிக்கவில்லை’ என்பது இயல்பான அமைப்பு.
- source_word: διενέγκῃ
  choice: சுமந்து செல்ல
  rationale: διαφέρω இங்கு ஓர் இடத்தின் வழியாக ஒன்றை எடுத்துச் செல்வதைக் குறிக்கிறது. ‘சுமந்து செல்ல’ என்பது எடுத்துச் செல்லும் செயலைத் தெளிவாகக் காட்டுகிறது; ‘வழியாக’ அதன் திசைநுட்பத்தைப் பாதுகாக்கிறது.
- source_word: σκεῦος
  choice: எந்தப் பொருளையும்
  rationale: σκεῦος என்பது பாத்திரம், கருவி அல்லது பிற பொருள் எனப் பரந்த பொருளுடைய சொல். சூழல் குறிப்பிடாத பொருளின் வகையை தேவையின்றிக் குறுக்காமல் ‘பொருள்’ அதன் பரப்பைத் தக்கவைக்கிறது.
- source_word: διὰ τοῦ ἱεροῦ
  choice: ஆலய வளாகத்தின் வழியாக
  rationale: ἱερόν என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலயத்தின் விரிந்த வளாகத்தைக் குறிக்கிறது. ‘ஆலய வளாகம்’ இந்த வேறுபாட்டை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: எருசலேம் ஆலயத்தைக் குறிக்கும் ἱερόν என்ற சொல்லின் எல்லை
  choice: உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் விரிந்த ஆலய வளாகத்தைக் குறிக்கும் வகையில் ‘ஆலய வளாகம்’
  alternative: ‘ஆலயம்’ அல்லது ‘ஆலயப் பிரகாரங்கள்’
  rationale: இது கோட்பாட்டுச் சர்ச்சையைத் தீர்ப்பதற்கான தேர்வு அல்ல; நிகழ்வு நடந்த இடத்தைத் துல்லியமாகக் காட்டும் மொழிபெயர்ப்பு. ἱερόν என்பதையும் உட்புறத் திருத்தலத்தைக் குறிக்கும் ναός என்பதையும் ஒன்றாக்காமல் இந்தத் தேர்வு வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆலய வளாகம்’ இடத்தின் பரப்பைத் தெளிவுபடுத்துகிறது; ‘பொருள்’ என்பது σκεῦος என்பதன் திட்டமிட்ட பொதுத்தன்மையைப் பாதுகாக்கிறது.
