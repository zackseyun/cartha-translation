  source_fidelity: மூலத்தின் καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ என்ற அமைப்பும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அனுமதிக்கவில்லை’ என்பது ἤφιεν-ன் தொடர்நிலைத் தடுப்பை சூழலுக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது; ‘யாரும் எந்தப் பொருளையும் சுமந்து செல்ல’ என்பது τις, διενέγκῃ, σκεῦος ஆகியவற்றின் வரம்பற்ற தன்மையையும் எடுத்துச் செல்லுதல்/வழியாகச் செல்லுதல் என்ற நுட்பத்தையும் காக்கிறது.
  naturalness: ‘ஆலய வளாகத்தின் வழியாக … அவர் அனுமதிக்கவில்லை’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான, வாசிக்க இயல்பான வாக்கியமாக உள்ளது. சொல் வரிசையும் மறுப்பின் நோக்கமும் குழப்பமின்றி உள்ளன.
  terminology: ‘ஆலய வளாகம்’ என்பது ἱερόν என்பதன் விரிவான ஆலய-முற்ற/வளாகக் குறிப்பை நன்றாக வெளிப்படுத்துகிறது; அதை உட்புறப் பரிசுத்தஸ்தலமாகக் குறுக்குவதில்லை. ‘பொருள்’ σκεῦος என்பதன் பரந்த பொருளைத் தேவையின்றி வரையறுக்காமல் பாதுகாக்கிறது. அடிக்குறிப்புகள் மாற்று வாசகங்களையும் சொற்பொருள் எல்லையையும் சரியாக விளக்குகின்றன.
