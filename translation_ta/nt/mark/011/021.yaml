  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நேரடி உரையில் மரியாதை விகுதிகள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
