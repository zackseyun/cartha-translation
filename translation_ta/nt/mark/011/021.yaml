source:
  edition: SBLGNT
  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: ta
  text: பேதுரு அதை நினைவுகூர்ந்து அவரிடம், “ரபீ, பாருங்கள்! நீங்கள் சபித்த அத்திமரம் பட்டுப்போயிருக்கிறது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலர்ந்துபோயிருக்கிறது.” கிரேக்க வினைச்சொல் உலர்வதையோ பட்டுப்போவதையோ குறிக்கலாம்; அதன் நிறைவுக்கால வடிவம் தற்போது நீடிக்கும் விளைவை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: அதை நினைவுகூர்ந்து
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் பொருளையும், முந்தைய நிகழ்வை பேதுரு நினைவுகூர்ந்தபின் பேசுகிறார் என்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலம் நிகழ்வை உயிரோட்டமாக்குகிறது; ஆயினும் தமிழ் கதைநடையில் நேரடி உரைக்குப் பின் ‘என்றார்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: கிரேக்கத்தின் பிரதிப்பெயரைப் பேணுகிறது; சூழலில் அது இயேசுவைக் குறிக்கிறது என்பதை தேவையின்றி வெளிப்படையாக்கவில்லை.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: யூதச் சூழலையும் மூலத்தில் உள்ள அழைப்புப் பட்டத்தையும் பேணும் ஒலிபெயர்ப்பு; ‘போதகரே’ என்ற பொருள் மொழிபெயர்ப்பைவிட மூல வடிவத்துக்கு நெருக்கமானது.
- source_word: ἴδε
  choice: பாருங்கள்!
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் கட்டளை வடிவத்தை நவீன, மரியாதையான தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συκῆ
  choice: அத்திமரம்
  rationale: சூழலில் பழத்தை அல்ல, மரத்தையே குறிக்கிறது; தமிழில் நிலைபெற்ற தெளிவான சொல்.
- source_word: κατηράσω
  choice: நீங்கள் சபித்த
  rationale: இரண்டாம் நபர் ஒருமை இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது; தமிழின் மரியாதைப் பன்மை இயேசுவை நோக்கிய உரைக்கு ஏற்றது.
- source_word: ἐξήρανται
  choice: பட்டுப்போயிருக்கிறது
  rationale: மரம் வாடி உலர்ந்த நிலையை இயல்பான தமிழில் குறிக்கிறது; கிரேக்க நிறைவுக்காலம் காட்டும் முடிந்த செயலும் அதன் தற்போதைய விளைவும் ‘போயிருக்கிறது’ என்பதில் வெளிப்படுகின்றன.
