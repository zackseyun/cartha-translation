reference: Mark 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: ta
  text: அவர் மக்கள் கூட்டத்தைவிட்டு ஒரு வீட்டுக்குள் சென்றபோது, அவருடைய சீடர்கள் அந்த உவமையைப் பற்றி அவரிடம் கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தக் கூற்றை” அல்லது “அந்த எடுத்துக்காட்டை” என்றும் மொழிபெயர்க்கலாம். இதற்கான கிரேக்கச் சொல் παραβολή (பரபோலே).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழ் உரைநடையில் வாக்கியத் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது தேவையற்றதாக இருப்பதால், மார்க்குவின் தொடர்ச்சியான கதைநடையை இயல்பான காலவாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது.
- source_word: ὅτε
  choice: சென்றபோது
  rationale: சீடர்கள் கேட்ட நிகழ்வுக்கான காலச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: ஒரு வீட்டுக்குள் சென்றபோது
  rationale: οἶκον என்பதற்கு முன் சுட்டிடைச்சொல் இல்லாததால் ‘அந்த வீடு’ என்பதற்குப் பதில் ‘ஒரு வீடு’ என மொழிபெயர்க்கப்பட்டது; εἰσῆλθεν என்பதன் உள்ளே செல்லும் பொருள் ‘வீட்டுக்குள் சென்றார்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: மக்கள் கூட்டத்தைவிட்டு
  rationale: வீட்டுக்குள் சென்றதன் மூலம் கூட்டத்திலிருந்து விலகிய சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπηρώτων
  choice: கேட்டார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ச்சியாக அல்லது மீண்டும் கேட்டதைக் குறிக்கக்கூடும்; ஆனால் குறிப்பிட்ட வலியுறுத்தல் இல்லாமல் தமிழ் கதைநடையில் எளிய இறந்தகாலம் இயல்பானது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: கிரேக்க உடைமைத் தொடர்பையும் சீடர்களின் தெளிவான எழுவாயையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: τὴν παραβολήν
  choice: அந்த உவமை
  rationale: παραβολή என்பதன் வழக்கமான பொருளை நேரடியாகத் தருகிறது; முன்பு கூறப்பட்ட உருவகப் போதனையைக் குறிப்பதால் ‘அந்த’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இந்தச் சூழலில் παραβολή என்பது விரிவாக உருவகக் கூற்று அல்லது சொல் என்றும் புரிந்துகொள்ளப்படலாம்
  choice: அந்த உவமை
  alternative: அந்தக் கூற்று; அந்த எடுத்துக்காட்டு
  rationale: ‘உவமை’ என்பது கிரேக்கச் சொல்லின் வழக்கமான வகைப்பாட்டைப் பாதுகாக்கிறது; இயேசுவின் முந்தைய வார்த்தையின் தன்மையை மொழிபெயர்ப்பிலேயே குறுக்கி முடிவுசெய்யாமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் கூட்டத்தைவிட்டு’ என்பது பிரிவைத் தெளிவாக்குகிறது; ‘ஒரு வீட்டுக்குள்’ என்பது கிரேக்கத்தில் சுட்டிடைச்சொல் இல்லாததைக் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘உவமை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
