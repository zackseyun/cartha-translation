  source_fidelity: மூலக் கிரேக்கத்தின் கால அமைப்பு, ‘ஒரு வீடு’ என்ற குறிப்பற்ற தன்மை, கூட்டத்திலிருந்து விலகிய சூழல், சீடர்கள் கேட்ட செயல், மற்றும் τὴν παραβολήν என்பதன் குறிப்புத்தன்மை ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ἐπηρώτων என்பதன் முற்றுப்பெறாத இறந்தகால நுணுக்கத்தைத் தமிழ் கதைநடைக்கேற்ற எளிய இறந்தகாலமாகத் தருவது பாதுகாப்பானது.
