id: MRK.7.29
reference: Mark 7:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: ta
  text: அவர் அவளிடம், “இந்த வார்த்தையின் காரணமாக[a] போ; உன் மகளைவிட்டுப் பேய் வெளியேறிவிட்டது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் கூற்றின் காரணமாக, போ; உன் மகளைவிட்டுப் பேய் வெளியேறிவிட்டது.”
    reason: λόγος என்பதை இங்கு ‘வார்த்தை’ என்றும், சூழலில் அந்தப் பெண் கூறிய ‘கூற்று’ என்றும் மொழிபெயர்க்க முடியும்.
  - marker: b
    text: சில பழமையான கையெழுத்துப்பிரதிகளில், “உன் மகளைவிட்டுப் பேய் வெளியேறிவிட்டது” என்ற சொற்கள் இடம்பெறவில்லை.
    reason: SBLGNT இந்தச் சொற்றொடரை அடைப்புக்குறிக்குள் தருகிறது; இது உரைப்பாடச் சந்தேகத்தைக் குறிக்கிறது.
lexical_decisions:
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: நீ சொன்ன இந்த வார்த்தையின் காரணமாக
  rationale: διά + ஏவல் வேற்றுமை இங்கு காரணத்தை (‘காரணமாக’) குறிக்கிறது; λόγος அந்தப் பெண் முன்பு சொன்ன பதிலைக் குறிக்கிறது. தமிழில் தொடர்பு தெளிவாகவும் இயல்பாகவும் இருக்க ‘நீ சொன்ன’ என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது; ஒருமையான ‘வார்த்தை’ பாதுகாக்கப்பட்டுள்ளது.
- source_word: ὕπαγε
  choice: போ
  rationale: இங்கு ὑπάγω கட்டளை வடிவில் அனுப்பிவைப்பதைச் சுருக்கமாகக் குறிக்கிறது. ‘போ’ என்பது நேரடியான, இயல்பான நவீனத் தமிழ்.
- source_word: ἐξελήλυθεν
  choice: வெளியேறிவிட்டது
  rationale: கிரேக்க நிறைவுக்காலம் முடிவுற்ற செயலும் அதன் தொடரும் விளைவும் இருப்பதைக் காட்டுகிறது. ‘வெளியேறிவிட்டது’ என்பது பேய் வெளியேறியதையும் இனி மகளிடம் இல்லை என்பதையும் இயல்பாக உணர்த்துகிறது.
- source_word: ἐκ τῆς θυγατρός σου
  choice: உன் மகளைவிட்டு
  rationale: ἐκ என்பது பேய் யாரிடமிருந்து வெளியேறியது என்பதைக் குறிக்கிறது. ‘உன் மகளைவிட்டு’ தமிழில் இயல்பாக இருந்து, மூலத்தின் வெளியேறும் உருவகத்தையும் காக்கிறது.
- source_word: τὸ δαιμόνιον
  choice: பேய்
  rationale: δαιμόνιον என்பதற்கான நேரடியான, பொதுவாகப் புரியும் நவீனத் தமிழ்ச் சொல் ‘பேய்’. அருகிலுள்ள வசனத்தின் வேறு சொல்லாட்சியான ‘அசுத்த ஆவி’ இங்கு இறக்குமதி செய்யப்படவில்லை.
- source_word: καὶ εἶπεν αὐτῇ
  choice: அவர் அவளிடம் … என்றார்
  rationale: தமிழ் உரையாடல் அமைப்புக்கேற்ப சொல்லும் வினை வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது. தொடர்ச்சியைக் குறிக்கும் καί, தமிழில் தேவையற்ற இணைப்புச் சொல்லைச் சேர்க்காமல் இயல்பான கதைத் தொடரால் வெளிப்படுகிறது.
theological_decisions:
- issue: பேயை வெளியேற்றும் மொழியின் இயற்கைக்கு அப்பாற்பட்ட பொருளை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: உன் மகளைவிட்டுப் பேய் வெளியேறிவிட்டது
  alternative: தீய ஆவி உன் மகளைவிட்டுப் போய்விட்டது
  rationale: மூலம் δαιμόνιον என்று வெளிப்படையாகக் குறிப்பிட்டு, அது மகளிடமிருந்து வெளியேறியதாகக் கூறுகிறது. ஆகவே இதை நோயாகவோ உருவகமான தீய தாக்கமாகவோ மாற்றாமல், தனிப்பட்ட பேயைக் குறிக்கும் மொழி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையான கதைநடை. இயேசுவின் கட்டளை சுருக்கமாக வைக்கப்பட்டுள்ளது; நிறைவுற்று தொடரும் விளைவு ‘வெளியேறிவிட்டது’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது.
