source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: ta
  text: ஏனெனில், அது அவனுடைய இதயத்துக்குள் செல்லாமல் வயிற்றுக்குள் சென்று, கழிப்பிடத்திற்குச் செல்கிறது.” —இவ்வாறு அவர் எல்லா உணவுகளையும் தூய்மையாக்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கடைசிச் சொற்றொடரை மாற்குவின் விளக்கக் குறிப்பாக அல்லாமல் செரிமானச் செயல்முறையோடு இணைத்து, “...கழிப்பிடத்திற்குச் சென்று, எல்லா உணவுகளையும் உடலிலிருந்து வெளியேற்றுகிறது” என மொழிபெயர்க்கலாம்.
    reason: கிரேக்கத்தில் கடைசி ஆண்பால் ஒருமை வினையெச்சம் எதனோடு தொடர்புபடுகிறது என்பது இலக்கண ரீதியாக விவாதத்துக்குரியது. பிரதான உரை அதை மாற்குவின் விளக்கக் குறிப்பாக எடுத்துக்கொள்கிறது; மாற்று உடலியக்க வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: καρδίαν
  choice: இதயம்
  rationale: உள்ளான மனிதனுக்கும் செரிமான உறுப்புக்கும் இடையிலான மூலமொழியின் வேறுபாட்டைப் பாதுகாக்க நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: κοιλίαν
  choice: வயிறு
  rationale: இந்தச் செரிமானச் சூழலில் நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀφεδρῶνα
  choice: கழிப்பிடம்
  rationale: கழிவு வெளியேற்றப்படும் இடத்தைத் தெளிவாகவும் கண்ணியமான நடையிலும் குறிக்கிறது; நவீன கழிவுநீர் அமைப்பைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: καθαρίζων
  choice: தூய்மையாக்குகிறார்
  rationale: நிகழ்கால வினையெச்சத்தின் செயற்பாட்டு அர்த்தத்தைப் பாதுகாக்கிறது. தமிழில் எழுவாயை வெளிப்படையாகச் சேர்க்காமல் விடுவதால், இது இயேசுவின் போதனை குறித்த மாற்குவின் விளக்கமாக வாசிக்கப்படலாம்; அதேவேளை மூலத்தின் சுருக்கமான அமைப்பும் நிலைக்கிறது.
- source_word: βρώματα
  choice: எல்லா உணவுகளையும்
  rationale: கிரேக்கப் பன்மையைப் பிரதிபலித்து, பல்வேறு உணவு வகைகள் குறித்த விவாதத்துக்கு ஏற்றவாறு உள்ளது.
- source_word: αὐτοῦ
  choice: அவனுடைய
  rationale: பேச்சில் குறிப்பிடப்படும் ஒருவரைச் சுட்டும் ஒருமை உருபை நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: செல்லாமல் ... சென்று ... வெளியேறுகிறது
  rationale: உள்ளே செல்வதற்கும் வெளியேறுவதற்கும் இடையிலான இயக்க வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: καθαρίζων πάντα τὰ βρώματα என்பதன் தொடர்பும் பொருளும்
  choice: 'மாற்குவின் விளக்கக் குறிப்பாக: “இவ்வாறு எல்லா உணவுகளையும் தூய்மையாக்குகிறார்”'
  alternative: 'செரிமானச் செயல்முறையைச் சுட்டுவதாக: உணவு உடலிலிருந்து வெளியேற்றப்பட்டுத் தூய்மைப்படுத்தப்படுகிறது'
  rationale: ஆண்பால் ஒருமை வினையெச்சம் இயேசுவின் சொல்லின் விளைவைச் சுருக்கிக் கூறும் உரையாசிரியரின் குறிப்பாகப் புரிந்துகொள்ளப்படலாம். எனினும், அதை முந்தைய செரிமானச் செயலோடு இணைப்பதும் இலக்கண ரீதியாகச் சாத்தியம்; உணவுச் சட்டங்கள் தொடர்பான இறையியல் முக்கியத்துவம் உள்ளதால் அந்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உடலியல் செயலை மறைக்காமல், தேவையற்ற கடுமையோ வழக்கொழிந்த சொற்களோ தவிர்க்கப்பட்டுள்ளன.
