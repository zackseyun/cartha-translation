source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: ta
  text: அவர் அவளிடம், “முதலில் பிள்ளைகள் வயிறார உண்ணட்டும். பிள்ளைகளின் அப்பத்தை எடுத்து சிறிய நாய்களுக்கு[a] போடுவது நல்லதல்ல” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறிய நாய்கள்” என்பதற்கு “வீட்டு நாய்கள்” அல்லது வெறுமனே “நாய்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சிறுமைப் பொருளுள்ள சொல் பயன்படுத்தப்பட்டுள்ளது; அது சிறிய அல்லது வீட்டில் வளர்க்கப்படும் நாய்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்நிலைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἄφες
  choice: உண்ணட்டும்
  rationale: இங்கு ‘அனுமதி/விடுதல்’ என்ற கட்டளைப் பொருள், தொடரும் χορτασθῆναι உடன் தமிழில் இயல்பாக ‘உண்ணட்டும்’ என அமைகிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: பிள்ளைகளுக்குள்ள முன்னுரிமையைப் பாதுகாக்கிறது; பிறருக்கு பின்னர் கிடைக்கும் வாய்ப்பை மறுப்பதாக மாற்றவில்லை.
- source_word: χορτασθῆναι
  choice: வயிறார உண்ண
  rationale: வெறுமனே உணவளிக்கப்படுதல் அல்ல, திருப்தியடையும் அளவு உண்ணுதல் என்ற பொருளையும் உணவு உருவகத்தையும் காக்கிறது.
- source_word: τὰ τέκνα
  choice: பிள்ளைகள்
  rationale: பால் அல்லது வயதை மிகையாகக் குறிப்பாக்காமல் குடும்ப உருவகத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: καλόν ἐστιν
  choice: நல்லதல்ல
  rationale: καλόν என்பதன் நேரடியான ‘நல்லது/தகுந்தது’ என்ற மதிப்பீட்டைத் தக்கவைத்து, அதை ‘நியாயமல்ல’ என்று அதிகமாக விளக்கவில்லை.
- source_word: λαβεῖν
  choice: எடுத்து
  rationale: வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: ἄρτον
  choice: அப்பம்
  rationale: பொதுவான ‘உணவு’ என்று விரிவாக்காமல் வீட்டுச் சூழலிலுள்ள தெளிவான அப்ப உருவகத்தைப் பாதுகாக்கிறது.
- source_word: κυναρίοις
  choice: நாய்க்குட்டிகளுக்கு
  rationale: கிரேக்கச் சொல்லின் சிறுமைப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது; வீட்டில் வளர்க்கப்படும் சிறிய நாய்கள் என்ற சாத்தியத்தையும் குறிப்பில் தெரிவிக்கிறது.
- source_word: βαλεῖν
  choice: போடுவது
  rationale: ‘எறிவது’ என்பதைக் காட்டிலும் தமிழில் உணவை நாய்களுக்கு இடும் சூழலில் இயல்பாக உள்ளது; அதே வேளையில் கொடுத்தல் என்று மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: ‘பிள்ளைகள்’ மற்றும் ‘நாய்க்குட்டிகள்’ என்ற உருவகங்களின் குறிப்பு
  choice: உருவகத்தையே முதன்மை உரையில் வைத்தல்
  alternative: ‘பிள்ளைகள்’ என்பதை இஸ்ரவேலர்/யூதர் என்றும் ‘நாய்க்குட்டிகள்’ என்பதை பிற இனத்தார் என்றும் உரைக்குள்ளேயே விளக்குதல்
  rationale: கிரேக்க உரை குறிக்கப்படுவோரைக் நேரடியாகப் பெயரிடாமல் குடும்ப உருவகமாகவே பேசுகிறது; ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் வரலாற்று மற்றும் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
- issue: πρῶτον என்பதன் வரிசை மற்றும் முன்னுரிமை நுட்பம்
  choice: ‘முதலில்’ என்பதை வெளிப்படையாக வைத்தல்
  alternative: தமிழ் நடைக்காக அதை விடுதல் அல்லது நிரந்தர விலக்காக விளக்குதல்
  rationale: ‘முதலில்’ என்பது பிள்ளைகளுக்கான முன்னுரிமையைக் குறிக்கிறது; ஆனால் மற்றவர்கள் நிரந்தரமாக விலக்கப்படுகிறார்கள் என்று அவசியம் கூறாது. அந்தத் திறந்த இறையியல் இழுப்பை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வயிறார உண்ணட்டும்’ உணவு உருவகத்தையும் நிறைவாக உண்பதன் பொருளையும் காக்கிறது. ‘அப்பம்,’ ‘பிள்ளைகள்,’ ‘நாய்க்குட்டிகள்’ ஆகியவை உருவகத்தை விளக்கவுரையின்றி நேரடியாக வைத்துள்ளன.
