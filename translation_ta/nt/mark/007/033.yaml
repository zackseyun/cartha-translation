id: MRK.7.33
reference: Mark 7:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: ta
  text: அவர் அவனை மக்கள் கூட்டத்திலிருந்து தனியே[a] அழைத்துச் சென்று, தம் விரல்களை அவனுடைய காதுகளுக்குள் வைத்தார். பிறகு உமிழ்ந்து[b], அவனுடைய நாவைத் தொட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனிமையில்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க உரை, “உமிழ்ந்து, அவனுடைய நாவைத் தொட்டார்” என்று கூறுகிறது; இயேசு தமது உமிழ்நீரை அந்த மனிதனின் நாவில் பூசினார் என்று அது வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος
  choice: அழைத்துச் சென்று
  rationale: இந்தப் பங்கேற்புவினை, அவனை மற்றவர்களிடமிருந்து பிரித்து அழைத்துச் சென்றதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் செயலின் நோக்கை மிகைப்படுத்தாமலும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: மக்கள் கூட்டத்திலிருந்து
  rationale: ὄχλος என்பது இக்கதையமைப்பில் கூடியிருந்த மக்கள் கூட்டத்தைக் குறிக்கிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியே
  rationale: இந்தச் சொற்றொடர் மற்றவர்களிடமிருந்து விலகித் தனிப்பட்ட நிலையில் இருப்பதைக் குறிக்கிறது; ‘தனியே’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: ἔβαλεν
  choice: வைத்தார்
  rationale: βάλλω என்பதன் அடிப்படைப் பொருள் ‘எறிதல்’ என்றாலும், இவ்வுடல் செயலின் சூழலில் ‘வைத்தார்’ என்பதே இயல்பான பொருள்; வலுக்கட்டாயமான செயலை இது தேவையின்றி உணர்த்தாது.
- source_word: τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: தம் விரல்களை அவனுடைய காதுகளுக்குள்
  rationale: முதல் αὐτοῦ இயேசுவின் விரல்களையும் இரண்டாவது αὐτοῦ அந்த மனிதனின் காதுகளையும் குறிக்கிறது. ‘தம்’ மற்றும் ‘அவனுடைய’ என்று வேறுபடுத்துவது தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: πτύσας
  choice: பிறகு உமிழ்ந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் அல்லது அதனுடன் தொடர்பாக நிகழ்ந்த செயலைக் குறிக்கிறது. ‘பிறகு உமிழ்ந்து’ என்பது செயல்வரிசையை இயல்பாகக் காட்டுகிறது; உமிழ்நீர் எங்கே பட்டது என்பதைச் சேர்ப்பதில்லை.
- source_word: ἥψατο
  choice: தொட்டார்
  rationale: ἅπτομαι என்பதற்கு இச்சூழலில் ‘தொடுதல்’ என்பதே நேரான, பொருத்தமான பொருள்.
- source_word: τῆς γλώσσης αὐτοῦ
  choice: அவனுடைய நாவை
  rationale: ἅπτομαι உடன் வரும் இந்தச் சொல் தொடப்பட்ட உறுப்பைக் குறிக்கிறது; சூழலில் அது அந்த மனிதனுடைய நாவாகும்.
theological_decisions:
- issue: இயேசுவின் குணமாக்கும் செயல்களின் விவரிப்பு
  choice: உடல் சார்ந்த செயல்களை உரையில் உள்ளபடியே நேரடியாகக் கூறி, அவற்றின் அடையாளப் பொருள் அல்லது குணமாக்கும் முறை பற்றிய விளக்கத்தைச் சேர்க்கவில்லை.
  alternative: இயேசு உமிழ்நீரை அந்த மனிதனின் நாவில் பூசினார் என்று வெளிப்படையாகக் கூறுதல் அல்லது அந்தச் செயலுக்கு சடங்கு/மருத்துவப் பொருள் விளக்குதல்.
  rationale: கிரேக்க உரை இயேசு உமிழ்ந்து, அந்த மனிதனின் நாவைத் தொட்டார் என்று மட்டுமே கூறுகிறது. உமிழ்நீர் நாவில் பூசப்பட்டது என்றோ, இச்செயல்களின் பொருள் என்னவென்றோ அது வெளிப்படையாகக் கூறவில்லை; எனவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் வினைமுற்றுகள் மரியாதைப் பன்மையில் உள்ளன; ‘தம்’ மற்றும் ‘அவனுடைய’ என்ற சொற்கள் இரு நபர்களின் உடல் உறுப்புகளைத் தெளிவாக வேறுபடுத்துகின்றன.
