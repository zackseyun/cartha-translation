  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: ta
  text: இவ்வாறு, நீங்கள் வழிவழியாக வழங்கிய[b] உங்கள் மரபினால் கடவுளின் வார்த்தையைச் செல்லாதபடி செய்கிறீர்கள்.[a] இதேபோன்ற வேறு பலவற்றையும் செய்கிறீர்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செல்லுபடியாகாதபடி செய்கிறீர்கள்’ அல்லது ‘வீணாக்குகிறீர்கள்’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீங்கள் ஒப்படைத்த’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இவற்றைப் போன்ற பலவற்றையும்’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: செல்லாததாக்குகிறீர்கள்
  rationale: இச்சொல் ஒன்றின் அதிகாரத்தையோ விளைவையோ ரத்தாக்கி, அது செல்லாதபடி செய்வதைக் குறிக்கிறது. தமிழில் சட்டநடை மிகாமல் அந்த வலிமையை இச்சொல் தக்கவைக்கிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளின் வார்த்தை
  rationale: λόγος என்பதற்கு நேரடியான ‘வார்த்தை’ பயன்படுத்தப்பட்டுள்ளது; இச்சூழலில் அது கடவுளின் கட்டளை அல்லது போதனையைச் சுட்டுகிறது.
- source_word: τῇ παραδόσει ὑμῶν
  choice: உங்கள் மரபினால்
  rationale: 'இங்குள்ள வேற்றுமை உருபு கருவிப்பொருளைத் தருகிறது: அவர்களுடைய மரபே கடவுளின் வார்த்தையைச் செல்லாததாக்கும் வழிமுறையாக உள்ளது.'
- source_word: ᾗ παρεδώκατε
  choice: நீங்கள் வழிவழியாக வழங்கிய
  rationale: παραδίδωμι என்பது பிறரிடம் ஒப்படைத்தல் அல்லது தொடர்ந்து வழங்குதல் என்னும் பொருளுடையது. ‘வழிவழியாக வழங்கிய’ என்பது மரபு கடத்தப்பட்டதைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: இதேபோன்ற வேறு பலவற்றையும்
  rationale: கிரேக்கத்தில் உள்ள வலியுறுத்தலையும் ஓரளவு மீளுரையையும் இயல்பான தமிழில் சுருக்காமல் வெளிப்படுத்துகிறது.
- source_word: ποιεῖτε
  choice: செய்கிறீர்கள்
  rationale: நிகழ்கால வடிவம் தொடர்ந்து அல்லது வழக்கமாகச் செய்யப்படும் செயல்களை இங்கு குறிக்கிறது; தமிழ் சாதாரண நிகழ்காலம் அதைப் பொருத்தமாகக் காட்டுகிறது.
theological_decisions:
- issue: இயேசுவின் குற்றச்சாட்டில் ‘மரபு’ என்பதன் இயல்பு
  choice: மூலத்தில் உள்ளபடியே ‘உங்கள் மரபு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மனித மரபு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: இந்த வசனத்தில் ‘மனித’ என்ற அடைமொழி இல்லை. சூழல் இந்தக் குறிப்பிட்ட மரபு கடவுளின் வார்த்தைக்கு எதிராக நிற்பதைக் காட்டுவதால், மொழிபெயர்ப்பு கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மரபு’ என்ற சொல் நடுநிலையாக வைக்கப்பட்டு, அதற்கான எதிர்மறை மதிப்பீட்டை வசனத்தின் சூழலே வழங்க அனுமதிக்கப்பட்டுள்ளது.
