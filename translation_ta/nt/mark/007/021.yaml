id: MRK.7.21
reference: Mark 7:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: ta
  text: 'ஏனெனில், உள்ளேயிருந்து—மனிதர்களின்[a] இதயத்திலிருந்து—தீய எண்ணங்கள் வெளிவருகின்றன: பாலியல் ஒழுக்கக்கேடுகள்[b], திருட்டுகள், கொலைகள்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் மனிதர்களை பொதுவாகக் குறிக்கிறது; ஆண்களை மட்டும் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முறைகேடான பாலியல் செயல்கள்”; கிரேக்கத்தில் இச்சொல் பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: உள்ளேயிருந்து
  rationale: உள்புற மூலத்தைக் குறிக்கும் வினையடை; சுற்றியுள்ள பகுதியில் வரும் வெளிப்புறம்–உள்புறம் என்ற எதிர்மறை அமைப்பைப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையும் காரணத்தையும் அறிமுகப்படுத்துகிறது.
- source_word: καρδίας
  choice: இதயத்திலிருந்து
  rationale: மனிதரின் ஒழுக்க, சிந்தனை, விருப்ப மையத்தைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: ἀνθρώπων
  choice: மனிதர்களின்
  rationale: இங்கு ஆண் பாலினத்தவரை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் கிரேக்கப் பன்மைக்கு இயல்பான, துல்லியமான தமிழ்.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: தீய எண்ணங்கள்
  rationale: உள்ளத்தில் எழும் ஒழுக்கரீதியாகத் தீய சிந்தனைகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐκπορεύονται
  choice: வெளிவருகின்றன
  rationale: உள்ளேயிருந்து தோன்றி வெளியே வருதல் என்ற மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: πορνεῖαι
  choice: பாலியல் ஒழுக்கக்கேடுகள்
  rationale: குறிப்பிட்ட ஓர் பாலியல் குற்றமாகச் சுருக்காமல், முறைகேடான பாலியல் செயல்களை விரிவாகக் குறிக்கிறது; கிரேக்கப் பன்மையும் பாதுகாக்கப்படுகிறது.
- source_word: κλοπαί
  choice: திருட்டுகள்
  rationale: தீமைகளின் பட்டியலில் வரும் பன்மைச் செயல்களை இயல்பான தமிழில் தருகிறது.
- source_word: φόνοι
  choice: கொலைகள்
  rationale: பொதுவான ‘கொல்லுதல்கள்’ என்பதைவிட, தவறான அல்லது சட்டவிரோத உயிர்ப்பறிப்பின் ஒழுக்க வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀνθρώπων என்ற சொல் பொதுவாக மனிதகுலத்தைக் குறித்தல்
  choice: மனிதர்களின்
  alternative: ஆண்களின்
  rationale: இச்சூழலில் கிரேக்க இலக்கணப் பால் ஆண்களை மட்டும் வரையறுப்பதில்லை; எல்லா மனிதர்களையும் குறிக்கும் பொதுப்பயன்பாடு.
- issue: πορνεῖαι என்பதன் பொருள் மற்றும் பன்மை
  choice: பாலியல் ஒழுக்கக்கேடுகள்
  alternative: பாலியல் ஒழுக்கக்கேடு; வேசித்தனங்கள்
  rationale: மூலச்சொல் முறைகேடான பாலியல் செயல்களை விரிவாகக் குறிக்கிறது. அதைக் குறிப்பிட்ட ஒரு வகையாகச் சுருக்காமலும் அதன் பன்மையை இழக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதயம்’ என்ற வேதாகம மானிடவியல் உருவகம் பாதுகாக்கப்பட்டுள்ளது. இடைக்கோடுகள் ἔσωθεν மற்றும் ἐκ τῆς καρδίας ஆகிய இரண்டும் ஒரே உள்மூலத்தை வலியுறுத்துவதைத் தெளிவாக்குகின்றன; வசனம் தொடரும் பட்டியல் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
