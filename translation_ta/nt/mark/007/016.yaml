  yaml_path: translation/nt/mark/007/016.yaml
  text: If anyone has ears to hear, let him hear.
translation:
  language: ta
  text: யாருக்காவது கேட்பதற்குக் காதுகள் இருந்தால், அவர் கேட்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில்—நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்டிகஸ், வத்திக்கானஸ் பிரதிகள் உட்பட—மற்றும் பழைய காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை மரபிலும், லத்தீன் மரபிலும், பெரும்பாலான சிரியக் சாட்சிகளிலும் உள்ளது. மாற்கு 4:9, 4:23 ஆகிய இடங்களில் காணப்படும் இதே கூற்றைப் பின்பற்றி, பிற்காலத்தில் ஒரு நகலெழுத்தரால் இது சேர்க்கப்பட்டிருக்கலாம்.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: காதுகள்
  rationale: உடல் உறுப்பைக் குறிக்கும் சொல்லை நேரடியாகத் தக்கவைத்துள்ளோம்; இங்கு அது கவனமாகக் கேட்டு உணர்வதற்கான மனப்பாங்கை உருவகமாகக் குறிக்கிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை நிகழ்காலக் கட்டளை வடிவத்தின் வலியுறுத்தும் அழைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Εἴ τις ἔχει ὦτα ἀκούειν
  choice: கேட்பதற்குக் காதுகள் உள்ளவன்
  rationale: நிபந்தனைத் தொடரையும் நோக்கத்தைக் குறிக்கும் ἀκούειν என்பதையும் சுருக்கமான, இயல்பான தமிழ் சொற்றொடராக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க ஒருமை அமைப்பைப் பேணுவதற்காக ‘உள்ளவன்’ மற்றும் ‘கேட்கட்டும்’ என ஒருமையில் மொழிபெயர்க்கப்பட்டுள்ளது; இது ஆண்களுக்கு மட்டும் வரையறுக்கும் பொருளில் அல்ல, பொதுவான மனிதரைக் குறிக்கும் தமிழ்ப் பயன்பாடாகும்.
