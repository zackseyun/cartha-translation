  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: ta
  text: அவர் மீண்டும் தீருவின் பகுதியிலிருந்து புறப்பட்டு, சீதோன் வழியாகத் தெக்கப்போலி பகுதியின் நடுவே கலிலேயக் கடலுக்கு வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தெக்கப்போலி பகுதியின் வழியாக” என்றும் மொழிபெயர்க்கலாம். ἀνὰ μέσον என்ற கிரேக்கத் தொடர் “நடுவே,” “இடையே,” அல்லது “வழியாக” எனப் பொருள்படலாம்; இங்கு கூறப்படும் பயணப்பாதை புவியியல் அடிப்படையில் புரிந்துகொள்வதற்குக் கடினமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: கதைநிகழ்வில் மறுபடியும் தொடங்கும் பயணத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: தீருவின் பகுதியை விட்டு வெளியேறி
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் காட்டுகிறது; ὅρια இங்கு எல்லைக்கோட்டை அல்ல, ஒரு நிலப்பகுதியைக் குறிக்கிறது.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: சீதோன் வழியாகக் கலிலேயக் கடலுக்கு வந்து
  rationale: διά உடன் ஆறாம் வேற்றுமை ஓர் இடத்தின் வழியாகச் செல்லுதலைக் குறிக்கிறது; θάλασσα என்பதற்கும் வழக்கமான இடப்பெயருக்கும் ஏற்ப ‘கலிலேயக் கடல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: தெக்கப்போலி பகுதியின் நடுவே சென்றார்
  rationale: ἀνὰ μέσον என்பதன் இடஞ்சார்ந்த ‘நடுவே/இடையே’ என்ற வலிமையைப் பாதுகாக்கிறது. கிரேக்கத்தில் தனி இரண்டாவது வினை இல்லாவிட்டாலும், தமிழில் பயணப்பாதையைத் தெளிவாகவும் இயல்பாகவும் சொல்ல ‘சென்றார்’ சேர்க்கப்பட்டுள்ளது.
- source_word: Δεκαπόλεως
  choice: தெக்கப்போலி
  rationale: பத்து நகரங்களைக் கொண்டதாக அறியப்பட்ட பிராந்தியத்தின் மரபான கிரேக்கப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
