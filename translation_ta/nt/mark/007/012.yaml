  text: ⸀οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι τῷ ⸀πατρὶ ἢ τῇ ⸀μητρί,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: ta
  text: அவனைத் தன் தந்தைக்கோ தாய்க்கோ எதுவும் செய்ய நீங்கள் இனி அனுமதிப்பதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தந்தைக்கோ தாய்க்கோ உதவியாக எதுவும் செய்ய.” இந்தச் சூழலில், பரந்த பொருளுடைய கிரேக்கச் சொற்றொடர் நடைமுறை உதவியையும் பொருளாதார ஆதரவையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: இனி … இல்லை
  rationale: முன்பு இருந்த நிலை இப்போது தொடரவில்லை என்ற காலப்பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀφίετε
  choice: அனுமதிப்பதில்லை
  rationale: இங்கு ἀφίημι என்பதற்கு ‘மன்னித்தல்’ அல்லது ‘விட்டுவிடுதல்’ அல்ல, ‘செய்ய அனுமதித்தல்’ என்பதே சூழலுக்குரிய பொருள்.
- source_word: αὐτὸν
  choice: அவன்
  rationale: வினையெச்சத் தொடரின் கருத்தெழுவாயாக உள்ள ஆண்பால் ஒருமை நபரைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: οὐδὲν ποιῆσαι
  choice: எதுவும் செய்ய
  rationale: அனுமதி மறுக்கப்படும் கட்டமைப்பில், எந்தச் செயலையும் செய்ய விடுவதில்லை என்ற முழுமையான மறுப்பை இயல்பாகத் தருகிறது.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: தன் தந்தைக்கோ தாய்க்கோ
  rationale: வேற்றுமை உருபுகள் பெற்றோரின் நன்மைக்காகச் செய்வதைக் குறிக்கின்றன; சூழலில் அவர்கள் அந்த நபரின் சொந்தப் பெற்றோர் என்பதால் ‘தன்’ இயல்பாக உள்ளது. ‘-க்கோ … -க்கோ’ கிரேக்க ἢ-இன் மாற்றுத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: கொர்பான் சூழலில் உள்ள பொருளாதார உதவி என்ற நுணுக்கத்தை வசனத்திலேயே வெளிப்படையாக்க வேண்டுமா?
  choice: ‘எதுவும் செய்ய’ என்ற பரந்த சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘எந்த உதவியும் செய்ய’ அல்லது ‘பராமரிப்பதற்காக எதுவும் செய்ய’
  rationale: கிரேக்க மூலவாசகம் செயலைப் பொதுவாகக் குறிப்பிடுகிறது; சுற்றியுள்ள சூழல் நடைமுறை அல்லது பொருளாதார ஆதரவை உணர்த்தினாலும், இந்த வசனம் மட்டும் அதை வெளிப்படையாகக் குறுக்குவதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பரந்த பொருள் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழல் உணர்த்தும் உதவி/ஆதரவு நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
