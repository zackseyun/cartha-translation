id: MRK.7.8
reference: Mark 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: ta
  text: கடவுளுடைய கட்டளையை விட்டுவிட்டு, மனிதர்களுடைய பாரம்பரியத்தை உறுதியாகப் பற்றிக்கொள்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: முதன்மை வினைக்கு முன்னதாக அல்லது அதனுடன் தொடர்பாக நிகழும், கடவுளுடைய கட்டளையை ஒதுக்கிவைக்கும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கைவிட்டு’ என்பதைவிட தேவையற்ற தீவிரத்தைச் சேர்ப்பதில்லை.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: கடவுளுடைய கட்டளையை
  rationale: ἐντολή என்பதன் அதிகாரமிக்க இறைக் கட்டளை என்ற பொருளையும், τοῦ θεοῦ என்பதன் உடைமை/மூல உறவையும் தெளிவாகக் காக்கிறது.
- source_word: κρατεῖτε
  choice: உறுதியாகப் பற்றிக்கொள்கிறீர்கள்
  rationale: வெறுமனே பின்பற்றுவதல்லாமல், ஒன்றை இறுகப் பற்றிக்கொண்டு அதில் நிலைத்திருக்கும் κρατέω என்பதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: τὴν παράδοσιν
  choice: பாரம்பரியத்தை
  rationale: தலைமுறையாகக் கடத்தப்பட்ட நடைமுறை அல்லது மரபைக் குறிக்கும் παράδοσις என்பதற்கான தெளிவான நவீனத் தமிழ் இணை.
- source_word: τῶν ἀνθρώπων
  choice: மனிதர்களுடைய
  rationale: ἀνθρώπων இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்களை பொதுவாகக் குறிக்கிறது; கடவுளிடமிருந்து வருவது மற்றும் மனிதரிடமிருந்து வருவது ஆகியவற்றின் எதிர்மறை ஒப்பீட்டைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: இறைக் கட்டளைக்கும் மனிதப் பாரம்பரியத்திற்கும் இடையிலான எதிர்மறை ஒப்பீடு
  choice: “கடவுளுடைய கட்டளை” என்பதற்கு எதிராக “மனிதர்களுடைய பாரம்பரியம்” என்று நேரடியாக அமைத்தல்
  alternative: “மக்களின் பாரம்பரியம்” என்று மொழிபெயர்த்தல்
  rationale: இயேசுவின் கண்டனம் எல்லாப் பாரம்பரியத்தையும் பொதுவாக நிராகரிப்பதல்ல; கடவுளுடைய கட்டளையை ஒதுக்கிவிட்டு மனிதரிடமிருந்து வந்த பாரம்பரியத்தைப் பற்றிக்கொள்வதையே குறிக்கிறது. ‘மனிதர்களுடைய’ என்பது இந்த இறை/மனித எதிர்மறை ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதே நேரத்தில் கண்டனத்தின் கண்ணியமான மற்றும் வலிமையான தொனி காக்கப்பட்டுள்ளது.
