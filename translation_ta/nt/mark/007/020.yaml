base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: ta
  text: 'அவர் தொடர்ந்து கூறினார்: “மனிதனிடமிருந்து வெளியே வருவது எதுவோ, அதுவே மனிதனைத் தீட்டுப்படுத்துகிறது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதனை அசுத்தமாக்குகிறது.” கிரேக்க வினைச்சொல் ஒருவரைத் தீட்டுள்ளவராக அல்லது அசுத்தமானவராக ஆக்குவதைக் குறிக்கும் தூய்மை சார்ந்த சொல்லாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து கூறினார்
  rationale: இறந்தகாலத் தொடர்நிலைச் செயலைக் காட்டும் imperfect வடிவத்தின் தொடர்ச்சியான உரையாடல் நயத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: உரையின் தொடர்ச்சியால் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரைத்தொடர்பு இடைச்சொல். ‘தொடர்ந்து’ என்பதும் முந்தைய உரையுடன் உள்ள இணைப்பும் அதன் பணியைத் தமிழில் போதுமான அளவு வெளிப்படுத்துகின்றன; ‘ஆனால்’ என மொழிபெயர்ப்பது இல்லாத முரண்பாட்டை உருவாக்கும்.
- source_word: ὅτι
  choice: நேர்கூற்றை அறிமுகப்படுத்தும் இரட்டைக் குறிகள்
  rationale: பேச்சு வினைக்குப் பின் ὅτι நேர்கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோள் குறிகளுடன் நேர்கூற்றாக அமைப்பது இயல்பானது.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: மனிதனிடமிருந்து வெளியே வருவது எதுவோ
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு அமைப்பை இயல்பான தொடர்பியல் தமிழில் தருகிறது; ἐκ என்பதன் ‘உள்ளிருந்து/இடமிருந்து’ வரும் பொருளையும் காக்கிறது.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: மனிதனிடமிருந்து / மனிதனை
  rationale: இங்கு ἄνθρωπος பொதுவான பிரதிநிதித்துவப் பொருளில் உள்ளது. ஒருமையையும் இருமுறை வரும் சொல்லின் சொல்லாட்சிசார் இணைப்பையும் தமிழில் காக்கிறது.
- source_word: ἐκεῖνο
  choice: அதுவே
  rationale: வெளியே வருவது தான் மனிதனைத் தீட்டுப்படுத்துகிறது என்ற சுட்டிக்காட்டும் வலியுறுத்தலை ‘-வே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κοινοῖ
  choice: தீட்டுப்படுத்துகிறது
  rationale: இந்தச் சூழலில் κοινόω என்பதன் தூய்மை–தீட்டு சார்ந்த பொருளைச் சுருக்கமாகவும் தற்போதைய தமிழிலும் தெரிவிக்கிறது; ‘அசுத்தமாக்குகிறது’ என்பது அடிக்குறிப்பில் காக்கப்படும் பொருத்தமான மாற்று.
theological_decisions:
- issue: κοινόω என்பதிலுள்ள தூய்மை/தீட்டு மொழி
  choice: தீட்டுப்படுத்துகிறது
  alternative: அசுத்தமாக்குகிறது
  rationale: இச்சூழல் சடங்குத் தூய்மையையும் ஒழுக்கத் தீட்டையும் தொடுகிறது. ‘தீட்டுப்படுத்துகிறது’ மூலத்தின் தூய்மைச் சொல்லாட்சியைத் தக்கவைக்கிறது; மாற்று வாசகம் பொருளின் மற்றொரு இயல்பான தமிழ் வெளிப்பாடாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான உரைநடை. மூலத்தின் ஒருமை, சொல்லின் மறுபயன்பாடு, வலியுறுத்தல், தூய்மை சார்ந்த பொருள் ஆகியவை காக்கப்பட்டுள்ளன.
