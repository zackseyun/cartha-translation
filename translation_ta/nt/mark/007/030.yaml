source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: ta
  text: அவள் தன் வீட்டுக்குச் சென்றபோது, குழந்தை படுக்கையில் கிடப்பதையும்[a] பேய் வெளியேறியிருப்பதையும் கண்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “படுக்கையில் போடப்பட்டிருப்பதையும்.”
    reason: βεβλημένον என்பதன் செயப்பாட்டு வடிவத்தை இன்னும் நேரடியாகக் காட்டும் சொல் மாற்று; முதன்மை உரை சூழலில் குறிக்கப்படும் விளைவு-நிலையை இயல்பான தமிழில் தருகிறது.
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: அவள் தன் வீட்டுக்குச் சென்றபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘சென்றபோது’ இயல்பான தமிழில் அந்தக் காலத் தொடர்பைப் பாதுகாக்கிறது; αὐτῆς என்பதற்கு எழுவாயைச் சார்ந்த ‘தன்’ பொருத்தமானது.
- source_word: εὗρεν
  choice: கண்டாள்
  rationale: கதைநடையில் εὑρίσκω என்பது ஒருவரையோ ஒரு நிலையையோ சென்றடைந்து காண்பதைக் குறிக்கிறது; ‘கண்டாள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: παιδίον
  choice: குழந்தை
  rationale: இவ்வசனத்தில் உள்ள நடுநிலைச் சொல் பாலினத்தை வெளிப்படையாகக் குறிப்பிடாததால், சூழலில் மகள் என்பது தெரிந்தாலும் ‘குழந்தை’ எனவே மொழிபெயர்க்கப்படுகிறது.
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: படுக்கையில் கிடப்பதையும்
  rationale: βάλλω என்பதன் நிறைவுற்ற செயப்பாட்டு வடிவம் இங்கு குழந்தை படுக்கையில் இருந்த விளைவு-நிலையை விவரிக்கிறது. வன்முறையாக எறியப்பட்டாள் என்ற தேவையற்ற கருத்தைத் தவிர்த்து, ‘கிடப்பது’ இயல்பான தமிழில் அந்த நிலையைக் கூறுகிறது.
- source_word: δαιμόνιον
  choice: பேய்
  rationale: δαιμόνιον என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் இணை ‘பேய்.’ இவ்வசனத்தில் இல்லாத ‘அசுத்த ஆவி’ என்ற வேறு சொற்றொடர் இறக்குமதி செய்யப்படவில்லை.
- source_word: ἐξεληλυθός
  choice: வெளியேறியிருப்பதையும்
  rationale: ἐξέρχομαι என்பதன் நிறைவுற்ற பங்கேற்புவினை, பேய் வெளியேறிவிட்டதால் இப்போது அங்கு இல்லாத விளைவு-நிலையைச் சுட்டுகிறது. ‘வெளியேறியிருப்பது’ செயலும் அதன் தொடரும் விளைவும் இரண்டையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேய் நீங்கியதன் விளைவு-நிலை
  choice: பேய் வெளியேறியிருப்பதையும்
  alternative: பேய் போயிருப்பதையும்
  rationale: கிரேக்க நிறைவுற்ற வடிவம் பேய் வெளியேறிய செயல் நிறைவடைந்ததையும் அது இனி அங்கு இல்லாததையும் தெரிவிக்கிறது. ‘வெளியேறியிருப்பது’ இதைத் தெளிவாகச் சொல்கிறது; நிகழ்வின் முறையைப் பற்றிய கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான கதைநடை. இரு நிலைகளையும் ‘…பதையும் …பதையும் கண்டாள்’ என்ற இணையான அமைப்பில் வைத்து கிரேக்க வாக்கிய அமைப்பை இயல்பாகப் பாதுகாக்கிறது.
