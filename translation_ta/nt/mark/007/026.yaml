  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: ta
  text: அந்தப் பெண் ஒரு கிரேக்கப் பெண்[a], பிறப்பால் சீரோபொனீசியப் பெண்[b]. தன் மகளிடமிருந்து பேயை வெளியேற்றும்படி அவள் அவரிடம் தொடர்ந்து கேட்டுக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதரல்லாத பெண்.” கிரேக்க மூலத்தில் “கிரேக்கப் பெண்” என்றே உள்ளது; இச்சூழலில் அது யூதரல்லாதவள் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “பிறப்பு அல்லது தோற்றத்தின்படி சீரோபொனீசியப் பெண்”; அதாவது, சீரோபொனீசிய மரபைச் சேர்ந்தவள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: ஒரு கிரேக்கப் பெண்
  rationale: பெண்பால் வடிவிலுள்ள கிரேக்கச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது. இச்சூழலில் யூதரல்லாதவள் என்ற உட்பொருள் இருக்கக்கூடும்; ஆனால் அதை முதன்மை உரையில் மட்டும் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: பிறப்பால் சீரோபொனீசிய வம்சத்தைச் சேர்ந்தவள்
  rationale: அவளுடைய இன-புவியியல் தோற்றம் அல்லது மரபுவழிப் பின்னணியைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: ἠρώτα
  choice: தொடர்ந்து கேட்டுக்கொண்டிருந்தாள்
  rationale: நிறைவுறா இறந்தகால வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயற்பாட்டை வெளிப்படுத்துகிறது; மூல வினையில் இல்லாத உணர்ச்சித் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: ἵνα ... ἐκβάλῃ
  choice: வெளியேற்றும்படி
  rationale: அவளுடைய வேண்டுகோளின் உள்ளடக்கத்தை இயல்பான தமிழில் தெரிவிப்பதோடு, பேயோட்டும் சூழலில் ἐκβάλλω என்பதன் வலிமையையும் காக்கிறது.
- source_word: τὸ δαιμόνιον
  choice: பேயை
  rationale: δαιμόνιον என்பதற்கான நேரடியான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் இணை; இதை ‘அசுத்த ஆவி’ என்று மாற்றி அருகிலுள்ள வேறு சொல்லுடன் கலக்கவில்லை.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: தன் மகளிடமிருந்து
  rationale: ἐκ என்பதன் பிரித்தகற்றும் பொருளை இயல்பான தமிழில் தருகிறது; ‘தன்’ என்பது மகள் அந்தப் பெண்ணுடையவள் என்பதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: பெண்ணின் இன மற்றும் பண்பாட்டு அடையாளம்
  choice: ‘கிரேக்கப் பெண்’ என்றும் ‘பிறப்பால் சீரோபொனீசிய வம்சத்தைச் சேர்ந்தவள்’ என்றும் இரு அடையாளங்களும் தனித்தனியாக வைக்கப்பட்டுள்ளன.
  alternative: ‘யூதரல்லாதவள்; சீரோபொனீசியப் பிறப்பைச் சேர்ந்தவள்’
  rationale: மூல உரை தரும் இரு அடையாள அடுக்குகளையும் ஒன்றாகக் கலக்காமல் காக்கிறது. ‘கிரேக்கர்’ என்பது இச்சூழலில் யூதரல்லாதவர் என்பதைக் குறிக்கக்கூடும் என்றாலும், அந்த விளக்கத்தை அடிக்குறிப்பில் வைத்துள்ளது.
- issue: மகளின் துன்பத்தின் தன்மை
  choice: ‘பேயை வெளியேற்ற’
  alternative: ‘தீய ஆவியை அகற்ற’
  rationale: மூலத்தில் உள்ள δαιμόνιον என்ற குறிப்பிட்ட சொல்லையும் அதன் இயற்கைக்கு அப்பாற்பட்ட கூற்றையும் மென்மைப்படுத்தாமலும் மறுபொருளாக்காமலும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘அவர்’ என்பது சூழலில் இயேசுவைக் குறிக்கிறது. δέ-க்கு தனியான ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ சேர்க்காமல், தமிழ் வாக்கியத் தொடர்ச்சியே அதன் மென்மையான உரையாடல் மாற்றத்தை ஏந்துகிறது.
