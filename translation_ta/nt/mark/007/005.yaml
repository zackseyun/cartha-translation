id: MRK.7.5
reference: Mark 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: ta
  text: பரிசேயர்களும் மறைநூல் அறிஞர்களும் அவரிடம், “உம்முடைய சீடர்கள் மூப்பர்களின் மரபின்படி நடக்காமல், தீட்டுப்பட்ட கைகளால்[a] அப்பம் சாப்பிடுவது ஏன்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “பொதுவான கைகளால்”; இங்கு இது சடங்குமுறைப்படி தீட்டுப்பட்ட கைகளைக் குறிக்கிறது.'
    reason: κοιναῖς என்பதன் நேர்ப்பொருளையும் இச்சூழலில் அதன் சடங்குமுறைப் பொருளையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: கேட்டார்கள்
  rationale: வரலாற்று நிகழ்வைச் சொல்லும் நிகழ்கால வினையை, இயல்பான தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக மொழிபெயர்க்கிறது; தொடர்ச்சியாகவோ மீண்டும் மீண்டுமோ கேட்டார்கள் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: யூத மறைநூல்களிலும் சட்டத்திலும் தேர்ச்சிபெற்ற அங்கீகரிக்கப்பட்ட அறிஞர் வகுப்பை நவீன வாசகர்களுக்குத் தெளிவாகக் குறிக்கிறது; வெறும் நகலெழுத்தாளர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் இணை.
- source_word: περιπατοῦσιν
  choice: நடக்காமல்
  rationale: ‘நடத்தையை அமைத்துக்கொள்’ என்ற உருவகப் பொருளைச் சூழலில் புரியத்தக்க வகையில் வைத்திருக்கிறது; ‘மரபின்படி நட’ என்பது தமிழிலும் இயல்பான சொல்லாட்சி.
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: மூப்பர்களின் மரபின்படி
  rationale: κατά என்பதன் நெறிக்கேற்ப அல்லது இணங்க என்ற பொருளையும், முந்தைய அதிகாரிகளோடு தொடர்புடைய மரபைக் குறிக்கும் உருபுத் தொடர்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: κοιναῖς χερσὶν
  choice: தீட்டுப்பட்ட கைகளால்
  rationale: κοινός இங்கு உடல் அழுக்கை அல்ல, சடங்குமுறை சார்ந்த தீட்டுநிலையைக் குறிக்கிறது. ‘தீட்டுப்பட்ட’ என்பது அந்தப் பொருளைத் தெளிவாகச் சொல்கிறது; அடிப்படையான ‘பொதுவான’ என்ற சொல்லை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: τὸν ἄρτον
  choice: அப்பம்
  rationale: உணவு முழுவதையும் குறிக்கக்கூடியதாக இருந்தாலும், மூலத்தில் உள்ள ஒருமை ‘அப்பம்’ என்பதைக் குறிப்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: κοινός குறிக்கும் சடங்குமுறை நிலை
  choice: தீட்டுப்பட்ட
  alternative: அசுத்தமான; பொதுவான
  rationale: விவாதம் உடல் சுத்தம் அல்லது ஒழுக்கத் தீமை பற்றியது அல்ல; பரிசேய மரபின்படியான சடங்குமுறைத் தீட்டைப் பற்றியது. எனவே பின்னைய கோட்பாட்டு முடிவுகளை முன்கூட்டியே புகுத்தாமல் அந்தச் சூழலைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உம்முடைய’ பயன்படுத்தப்பட்டுள்ளது. ‘மரபின்படி நடக்க’ என்ற தமிழ் வழக்கு கிரேக்க உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
