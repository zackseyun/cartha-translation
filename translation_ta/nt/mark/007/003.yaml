source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: ta
  text: ஏனெனில், பரிசேயர்களும் யூதர்கள் அனைவரும் மூப்பர்களின் மரபைப் பின்பற்றி, தங்கள் கைகளை ஒரு குறிப்பிட்ட முறையில்[a] கழுவாவிட்டால் சாப்பிடுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “முஷ்டியால்”; ஒருவேளை “மணிக்கட்டு வரை” அல்லது “நன்றாக” என்றும் பொருள்படலாம். கிரேக்கச் சொல்லின் பொருளை உறுதியாகக் கூறுவது கடினம்; வழக்கத்திலிருந்த சடங்குசார் கை கழுவும் ஒரு முறையை இது குறித்திருக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் இடைச்செருகல் என்பதைக் காட்டுகிறது; தமிழில் இயல்பான விளக்க இணைப்பாக அமைகிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூத சமயக் குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: யூதர்கள் அனைவரும்
  rationale: மூலத்தின் விரிவான பொதுமைப்படுத்தலைச் சுருக்காமல் காக்கிறது; இது ஒவ்வொரு தனிநபரையும் பற்றிய கணிதத் துல்லியமான கூற்றாக அல்லாமல், விளக்க நோக்கிலான பொதுக் கூற்றாகப் புரிந்துகொள்ளப்பட வேண்டும்.
- source_word: ἐὰν μὴ
  choice: கழுவாவிட்டால்
  rationale: நிபந்தனையுடன் கூடிய எதிர்மறைப் பொருளை இயல்பான தமிழ் வினை வடிவில் தருகிறது.
- source_word: πυγμῇ
  choice: ஒரு குறிப்பிட்ட முறையில்
  rationale: இந்தச் சொல் கடினமும் விவாதத்திற்குரியதும் ஆகும்; சடங்குசார் கை கழுவுதலின் முறை அல்லது அளவைக் குறிப்பதாக இருக்கலாம். பிரதான உரையில் சர்ச்சைக்குரிய ஒரு விளக்கத்தைத் தீர்மானமாக்காமல், அடிக்குறிப்பில் மாற்றுப் பொருள்கள் தரப்படுகின்றன.
- source_word: νίψωνται τὰς χεῖρας
  choice: தங்கள் கைகளை ... கழுவாவிட்டால்
  rationale: νίπτω உடலின் ஒரு பகுதியைக் கழுவுவதைக் குறிக்கிறது; இங்கு கைகள் வெளிப்படையாகக் குறிப்பிடப்படுகின்றன.
- source_word: οὐκ ἐσθίουσιν
  choice: சாப்பிடுவதில்லை
  rationale: வழக்கமான தொடர்ச்சியான நடைமுறையைக் குறிக்கும் நிகழ்காலத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κρατοῦντες
  choice: கடைப்பிடித்து
  rationale: மரபை உறுதியாகப் பின்பற்றுதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: முன்னோர்களின் மரபை
  rationale: இங்கு πρεσβύτεροι என்பது மரபை வழங்கிய முந்தைய தலைமுறை மத மூப்பர்களைக் குறிக்கிறது; இயல்பான தமிழில் ‘முன்னோர்கள்’ அந்தத் தொடர்பைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘யூதர்கள் அனைவரும்’ என்பதன் வரம்பும் வலிமையும்
  choice: மாற்கு தரும் விரிவான பொதுக் கூற்றை ‘யூதர்கள் அனைவரும்’ என்று தக்கவைத்தல்
  alternative: ‘பல யூதர்கள்’ அல்லது ‘யூதேயர்கள் அனைவரும்’
  rationale: கிரேக்க உரை πάντες என வெளிப்படையாக ‘அனைவரும்’ என்று கூறுகிறது. அதை ‘பலர்’ என மென்மைப்படுத்துவது மூலத்தைத் தாண்டிய விளக்கமாகும்; அதேவேளை, இது ஒவ்வொரு யூத நபரையும் விதிவிலக்கின்றி குறிக்கும் புள்ளிவிவரக் கூற்றாக அல்ல, மாற்குவின் விளக்கப் பொதுமைப்படுத்தலாகும்.
- issue: πυγμῇ என்பதன் பொருள்
  choice: பிரதான உரையில் ‘ஒரு குறிப்பிட்ட முறையில்’ என்று கூறி, உறுதியின்மையை அடிக்குறிப்பில் காத்தல்
  alternative: ‘முஷ்டியால்,’ ‘மணிக்கட்டு வரை,’ அல்லது ‘நன்றாக’
  rationale: சொல்லின் சரியான பொருள் விவாதத்திற்குரியது. ‘முஷ்டியால்’ என்பது வடிவரீதியாக நெருக்கமானதாக இருந்தாலும் தமிழில் தவறான காட்சியைத் தரலாம்; ‘மணிக்கட்டு வரை’ மற்றும் ‘நன்றாக’ என்பவை சாத்தியமான விளக்கங்கள் மட்டுமே. ஆகவே மூலத்தின் உண்மையான தெளிவின்மையைத் தீர்க்காமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கச் சொல்லான πυγμῇ-இன் தெளிவின்மை பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது; யூத நடைமுறையை இழிவுபடுத்தும் அல்லது சமயப் பிரிவுசார் விளக்கத்தைச் சேர்க்கும் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
