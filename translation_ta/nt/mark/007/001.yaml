translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், எருசலேமிலிருந்து வந்தவர்கள் இரு குழுவினரும் என்பதில் தெளிவின்மை ஏற்படாதவாறு இடத்தொடர் முன்வைக்கப்பட்டது. தேவையற்ற விளக்கவுரை அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
