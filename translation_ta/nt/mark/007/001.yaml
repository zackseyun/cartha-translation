  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: ta
  text: எருசலேமிலிருந்து வந்த பரிசேயர்களும், அங்கிருந்து வந்த மறைநூல் அறிஞர்களில் சிலரும் அவரிடம் கூடிவருகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: -உம்... -உம்
  rationale: முந்தைய நிகழ்வோடு தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட, பெயர்ச்சொல் இணைப்பில் ‘-உம்’ பயன்படுத்தப்பட்டது.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: அவரிடம் கூடிவருகிறார்கள்
  rationale: ‘அவரை நோக்கி/அவரிடம் ஒன்றுகூடுதல்’ என்ற வினை மற்றும் முன்னிடைச்சொல் இணைந்த பொருளை இயல்பான தமிழில் தருகிறது; மார்க்குவின் நிகழ்காலக் கதைநடையும் காக்கப்படுகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூதக் குழுவுக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: τινες τῶν γραμματέων
  choice: வேத அறிஞர்களில் சிலர்
  rationale: τινες + பகுதிப் பொருள் கொண்ட மரபுத்தொடரை ‘...இல் சிலர்’ என்று துல்லியமாகத் தருகிறது. γραμματεῖς என்போர் இச்சூழலில் வேதச்சட்டத்தில் தேர்ச்சி பெற்ற அறிஞர்கள் என்பதைக் சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: எருசலேமிலிருந்து வந்த
  rationale: முதன்மை வினைக்கு முன்பாக நிகழ்ந்த வருகையை இயல்பான தமிழ் பெயரெச்சத் தொடரால் தருகிறது.
