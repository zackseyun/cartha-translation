revisions:
- from: 'அவர்கள் செவிடராகவும் பேசுவதில் சிரமம் உள்ளவராகவும் இருந்த ஒரு மனிதரை[a] இயேசுவிடம் கொண்டுவந்து, அவர்மேல் தமது கையை வைக்கும்படி அவரை மன்றாடினார்கள்.


    [a] இன்னும் சொல்லுக்குச் சொல்: “செவிடரும் பேசுவதில் சிரமப்பட்டவருமான ஒருவரை.”'
  to: அவர்கள் செவிடாகவும் பேசுவதில் சிரமமுள்ளவராகவும் இருந்த ஒரு மனிதரை இயேசுவிடம் கொண்டு வந்தார்கள். அவர்மேல் தம் கையை வைக்கும்படி இயேசுவை மன்றாடினார்கள்.[a]
  rationale: The revision retains the source's description of one man as both deaf and having difficulty speaking, preserves the urgency of the request and the singular “hand,” and clarifies in Tamil that Jesus is the one asked to place his hand on the man. The footnote has been made grammatically smoother while retaining the more closely coordinated lexical expression.
