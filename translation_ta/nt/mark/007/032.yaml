source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: ta
  text: அவர்கள் செவிடாகவும் பேசுவதில் சிரமமுள்ளவராகவும் இருந்த ஒரு மனிதரை இயேசுவிடம் கொண்டு வந்தார்கள். அவர்மேல் தம் கையை வைக்கும்படி இயேசுவை மன்றாடினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்: “செவிடனும் பேசுவதில் சிரமமுள்ளவனுமான ஒருவரை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: கொண்டுவந்து
  rationale: மாற்கு வரலாற்று நிகழ்காலத்தை அடிக்கடி பயன்படுத்துகிறார்; இயல்பான தமிழ் கதைநடையில் இங்கு இறந்தகாலத் தொடர் பொருத்தமானது.
- source_word: αὐτῷ
  choice: இயேசுவிடம்
  rationale: கிரேக்கப் பிரதிப்பெயரின் சுட்டுப்பொருள் இயேசு. தனி வசனமாகவும் தெளிவாக இருக்க பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டது.
- source_word: κωφόν
  choice: செவிடராக ... இருந்த ஒரு மனிதரை
  rationale: κωφός இங்கு கேளாமையைக் குறிக்கிறது; அடுத்து வரும் μογιλάλον பேச்சுக் குறைபாட்டைத் தனியாகக் குறிப்பிடுவதால் ‘ஊமை’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: μογιλάλον
  choice: பேசுவதில் சிரமம் உள்ளவராக
  rationale: இந்த அரிய சொல் முற்றிலும் பேச இயலாத நிலையைக் காட்டாமல், சிரமத்தோடு அல்லது தடையோடு பேசுவதைச் சுட்டுகிறது.
- source_word: παρακαλοῦσιν
  choice: மன்றாடினார்கள்
  rationale: குணமாக்க வேண்டிய இந்தச் சூழலில் இது சாதாரண வேண்டுகோளைவிட வலியுறுத்தப்பட்ட வேண்டுதலைக் குறிக்கிறது.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: அவர்மேல் தமது கையை வைக்கும்படி
  rationale: வேண்டுகோளின் உள்ளடக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; τὴν χεῖρα என்பதன் ஒருமையை ‘கையை’ என்று காக்கிறது.
theological_decisions:
- issue: அந்த மனிதரின் குறைபாட்டின் தன்மை
  choice: அவர் செவிடராகவும் பேசுவதில் சிரமம் உள்ளவராகவும் இருந்தார்.
  alternative: அவர் செவிடரும் ஊமையுமாக இருந்தார்.
  rationale: κωφός மற்றும் μογιλάλος ஆகிய தனித்தனி சொற்கள் கேளாமையையும் பேச்சுச் சிரமத்தையும் குறிக்கின்றன. ‘ஊமை’ என்பது μογιλάλος கூறுவதைவிட அதிகமான முழுமையான பேச இயலாமையை உணர்த்தும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; குறைபாட்டை மிகைப்படுத்தாமல் மூலத்தின் வேறுபாடு காக்கப்பட்டுள்ளது.
