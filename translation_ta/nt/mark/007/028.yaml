id: MRK.7.28
reference: Mark 7:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: ta
  text: ஆனால் அவள் அவருக்குப் பதிலளித்து, “ஆண்டவரே[a], மேசைக்குக் கீழே இருக்கும் சிறு நாய்களும்கூட[b] பிள்ளைகளின் துணுக்குகளிலிருந்து தின்னுகின்றன” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்க κύριε என்பது “ஆண்டவரே” என்ற தலைப்பாகவும் மரியாதையான அழைப்பாகவும் பயன்படலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கச் சொல் சிறிய நாய்களையோ வீட்டில் வளர்க்கப்படும் நாய்களையோ குறிக்கலாம்; “சிறு நாய்கள்” என்பது அதன் சிறுமைப் பொருள் நுணுக்கத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει
  choice: பதிலளித்து … என்றாள்
  rationale: கிரேக்கத்தில் இறந்தகால வினையைத் தொடர்ந்து வரும் வரலாற்று நிகழ்காலத்தை, இயல்பான தமிழ் கதைநடைக்கேற்ப ஒருங்கிணைத்து இறந்தகாலத்தில் வழங்குகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதன் வழக்கமான வேதாகமத் தலைப்பு அர்த்தத்தைப் பாதுகாக்கிறது; மரியாதை அழைப்பான ‘ஐயா’ என்பதும் சூழலில் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ
  choice: கூட
  rationale: சிறு நாய்களுக்கும் உணவில் ஒரு பங்கு கிடைக்கிறது என்ற பெண்ணின் சேர்க்கைமிக்க, வாதநயமான பதிலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κυνάρια
  choice: சிறு நாய்கள்
  rationale: κυνάριον என்பதிலுள்ள சிறுமைப் பொருளைப் பாதுகாக்கிறது; ‘நாய்க்குட்டிகள்’ என்று மொழிபெயர்த்து அவற்றின் வயதைத் தேவையின்றி குறிப்பதையும் தவிர்க்கிறது.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: மேசைக்குக் கீழே இருக்கும்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐσθίουσιν
  choice: தின்கின்றன
  rationale: உவமையில் வழக்கமாக நிகழ்வதைக் குறிக்கும் நிகழ்காலத்தைப் பாதுகாக்கிறது.
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: பிள்ளைகளுக்குரிய துணுக்குகளில் சிலவற்றை
  rationale: ψιχία என்பதன் ‘சிறு துணுக்குகள்’ என்ற பொருளையும் ἀπό என்பதன் பகுதி சார்ந்த நுணுக்கத்தையும் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘உணவு’ அல்லது ‘கீழே விழும்’ போன்ற தகவல்களைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: பெண் இயேசுவை κύριε என்று அழைப்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: κύριε என்பது ‘ஆண்டவரே’ என்ற தலைப்பாகவும் மரியாதையான ‘ஐயா’ என்ற அழைப்பாகவும் அமையலாம். முதன்மை உரை வழக்கமான தலைப்பு மொழிபெயர்ப்பை வைத்துக்கொண்டு, சூழலில் உள்ள உண்மையான இருபொருள் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. பெண்ணின் பணிவான ஆனால் கூர்மையான பதிலின் வாதநயம் ‘கூட’ என்பதன் மூலம் பாதுகாக்கப்பட்டுள்ளது.
