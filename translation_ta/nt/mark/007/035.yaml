source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: ta
  text: அவருடைய செவிகள் திறக்கப்பட்டன[a]; அவருடைய நாவின் கட்டு அவிழ்க்கப்பட்டது[b]; அவர் தெளிவாகப் பேசினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய கேள்வித்திறன் மீட்கப்பட்டது.” கிரேக்கச் சொல் செவிகளையோ கேட்கும் திறனையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவருடைய நாவின் கட்டு அவிழ்க்கப்பட்டது”; அதாவது, அவருடைய பேச்சுக் குறைபாடு நீங்கியது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சரியாகப் பேசினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: திறக்கப்பட்டன
  rationale: ἀνοίγω என்பதன் இறந்தகாலச் செயப்பாட்டு பன்மை வடிவத்தைப் பிரதிபலிக்கிறது; செவித்திறன் உடனடியாக மீட்கப்பட்டதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αἱ ἀκοαί
  choice: அவருடைய செவிகள்
  rationale: ἀκοαί என்பது ‘செவிகள்’ அல்லது ‘கேட்கும் திறன்’ என்று பொருள்படலாம். பன்மை வடிவத்தையும் குணமாக்குதல் நிகழ்வின் உடல்சார்ந்த படிமத்தையும் ‘செவிகள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐλύθη
  choice: அவிழ்க்கப்பட்டது
  rationale: λύω என்பதன் செயப்பாட்டு வடிவத்தையும், ஒரு கட்டு தளர்த்தப்படும் படிமத்தையும் நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: அவருடைய நாவின் கட்டு
  rationale: δεσμός என்பதன் ‘கட்டு/பிணைப்பு’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘பேச்சுக் குறைபாடு’ என விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: ἐλάλει
  choice: அவர் பேசினார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்ச்சிச் சாயலைத் தமிழில் மிகைப்படுத்தாமல், மீட்கப்பட்ட பேச்சுத் திறனை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὀρθῶς
  choice: தெளிவாக
  rationale: இச்சூழலில் ὀρθῶς என்பது சரியான, புரியத்தக்க பேச்சைக் குறிக்கிறது. ‘தெளிவாக’ என்பது இலக்கண அல்லது ஒழுக்கத் தீர்ப்புச் சாயல் இல்லாமல் குணமடைந்த பேச்சைத் தெரிவிக்கிறது.
theological_decisions:
- issue: பேச்சு குணமாக்கப்பட்டதைச் சொல்லும் உருவகத்தை அப்படியே வைப்பதா அல்லது விளக்கமாக மொழிபெயர்ப்பதா
  choice: ‘அவருடைய நாவின் கட்டு அவிழ்க்கப்பட்டது’ என்ற உருவகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘அவருடைய பேச்சுக் குறைபாடு நீங்கியது’ அல்லது ‘அவருடைய நா விடுவிக்கப்பட்டது’
  rationale: கிரேக்க உரை மருத்துவ விளக்கச் சொல்லைப் பயன்படுத்தாமல், கட்டு அவிழ்க்கப்படும் தெளிவான உருவகத்தைப் பயன்படுத்துகிறது. அந்த உருவகத்தைப் பாதுகாப்பது அற்புத குணமாக்குதலை விளக்குகிறது; அதேவேளை மூல உரை கூறுவதைக் கடந்த விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான வாக்கியக் கூறுகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன; ‘நாவின் கட்டு’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
