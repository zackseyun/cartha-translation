source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: ta
  text: 'ஆனால் அவர் அவர்களிடம், “வெளிவேடக்காரர்களாகிய உங்களைக் குறித்து ஏசாயா நன்றாகவே இறைவாக்கு உரைத்தார். எழுதப்பட்டிருப்பதுபோல: ‘இந்த மக்கள்[a] தங்கள் உதடுகளால் என்னை மதிக்கிறார்கள்; ஆனால் அவர்களுடைய இதயமோ என்னைவிட்டு வெகுதொலைவில் இருக்கிறது’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘மக்கள்’ என்பதும் அதனுடன் வரும் வினையும் இலக்கணப்படி ஒருமையில் உள்ளன; ‘இதயம்’ என்பதும் ஒருமையே. தமிழில் ஒரு மக்கள் கூட்டத்தைக் குறிக்கப் பன்மை வடிவம் இயல்பாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: கூட்டுப்பெயரின் இலக்கண எண் மற்றும் தமிழின் இயல்பான பயன்பாட்டை விளக்குதல்
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உரையாடலிலிருந்து இயேசுவின் மறுமொழிக்குத் திரும்பும்போது தோன்றும் மிதமான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: கிரேக்கத்தின் வழக்கமான உரையாடல் அமைப்பையும் தமிழின் இயல்பான மேற்கோள் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: Καλῶς
  choice: நன்றாகவே
  rationale: ஏசாயாவின் இறைவாக்கு இவர்களுக்கு மிகவும் பொருத்தமாக இருப்பதை வலியுறுத்துகிறது; ‘சரியாக’ என்று மட்டும் கூறி துல்லியத்தின் கருத்தை அதிகமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐπροφήτευσεν
  choice: இறைவாக்கு உரைத்தார்
  rationale: தீர்க்கதரிசியின் அதிகாரபூர்வமான உரையைத் தெளிவாகக் குறிக்கும் தற்போதைய கண்ணியமான தமிழ்.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: περί உடன் வரும் உருபின் ‘உங்களைப் பற்றியதாக’ என்ற தொடர்புப் பொருளை நேரடியாகத் தருகிறது.
- source_word: τῶν ὑποκριτῶν
  choice: வெளிவேடக்காரர்களாகிய
  rationale: கிரேக்கச் சொல் குறிக்கும் உள்ளார்ந்த உண்மைக்கு மாறாக வெளியில் வேறு தோற்றம் காட்டுபவர்களைச் சுட்டுகிறது; வெறும் பொதுவான ‘கபடக்காரர்கள்’ என்பதைக் காட்டிலும் அந்தப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: ὡς γέγραπται ὅτι
  choice: 'எழுதப்பட்டிருப்பதுபோல:'
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் கிரேக்கச் சூத்திரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: Οὗτος ὁ λαὸς
  choice: இந்த மக்கள்
  rationale: சுட்டுச் சொல்லையும் கூட்டாகக் குறிக்கப்படும் மக்களையும் பாதுகாத்து, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: தங்கள் உதடுகளால் என்னை மதிக்கிறார்கள்
  rationale: ‘உதடுகள்’ என்ற உடல் உறுப்புப் படிமத்தையும் τιμάω என்பதன் ‘மதித்தல்/கனப்படுத்துதல்’ பொருளையும் எளிய நவீன தமிழில் காக்கிறது.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ஆனால் அவர்களுடைய இதயமோ
  rationale: δὲ-யின் முரண்பாட்டை ‘ஆனால்’ என்றும், வலியுறுத்தலை ‘இதயமோ’ என்றும் காட்டுகிறது; ஒரே ‘இதயம்’ என்ற கூட்டுப் படிமத்தையும் காக்கிறது.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: என்னைவிட்டு வெகுதொலைவில் இருக்கிறது
  rationale: வெறும் இடவியல் தூரத்தை மட்டும் அல்லாமல் உறவு சார்ந்த தூரத்தையும் உள்ளடக்கும் மூலமொழியின் திறந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஏசாயா 29:13-ஐ இயேசு தம்மை எதிர்கொண்டவர்களுக்கு நேரடியாகப் பொருத்துதல்
  choice: ‘வெளிவேடக்காரர்களாகிய உங்களைக் குறித்து’ என்றும் ‘இந்த மக்கள்’ என்றும் நேரடியான கண்டனத்தைத் தக்கவைத்தல்
  alternative: கண்டனத்தைப் பொதுமைப்படுத்தி அல்லது மென்மைப்படுத்திச் சொல்வது
  rationale: மூலவசனத்தில் இயேசு ஏசாயாவின் வார்த்தைகளைத் தம் கேட்போர்மீது நேரடியாகப் பொருத்துகிறார்; மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தக் கூடாது.
- issue: ‘இதயம்’ என்பதன் பொருள்
  choice: ‘இதயம்’ என்ற உருவகத்தை விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘உள்ளம்’, ‘மனநிலை’ அல்லது ‘உள்ளார்ந்த பக்தி’ என்று பொருளைத் தீர்மானித்துப் பரிமாற்றுதல்
  rationale: καρδία உள்ளார்ந்த நபர், எண்ணம், விருப்பம் ஆகியவற்றை உள்ளடக்கக்கூடும்; குறிப்பிட்ட ஓர் இறையியல் விளக்கமாகச் சுருக்காமல் மூலத்தின் உருவகத்தையும் விரிவையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை வேத மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கு உரைத்தார்’ தீர்க்கதரிசனச் செயலைத் தெளிவாகக் காட்டுகிறது; ‘வெளிவேடக்காரர்கள்’ மூலச்சொல்லின் பாசாங்குத் தன்மையைப் பாதுகாக்கிறது. மேற்கோளுக்குள் உள்ள ஒருமை ‘இதயம்’ கூட்டத்தின் ஒருங்கிணைந்த உள்ளார்ந்த நிலையைத் தீர்மானிக்காமல் தக்கவைக்கிறது.
