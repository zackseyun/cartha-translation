source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் தொடர்ந்து சொன்னார்: “உங்கள் மரபைக் கடைப்பிடிப்பதற்காகக் கடவுளின் கட்டளையை எவ்வளவு நேர்த்தியாக ஒதுக்கிவிடுகிறீர்கள்![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் மரபைக் கடைப்பிடிப்பதற்காகக் கடவுளின் கட்டளையை ஒதுக்கிவிடுவதில் நீங்கள் நன்றாகவே செயல்படுகிறீர்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கு கிரேக்கச் சொல் பாராட்டாக அல்ல, ஏளனமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து சொன்னார்
  rationale: முற்றுப்பெறாத இறந்தகால வினைவடிவத்தின் தொடர்ச்சி அல்லது மீள நிகழும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Καλῶς
  choice: எவ்வளவு நேர்த்தியாக
  rationale: இங்கு வரும் ஏளனத் தொனியை வெளிப்படுத்துகிறது; இது உண்மையான பாராட்டு என்று தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: ἀθετεῖτε
  choice: ஒதுக்கிவிடுகிறீர்கள்
  rationale: கடவுளின் கட்டளையை வேண்டுமென்றே புறந்தள்ளும் செயலைத் தெளிவாகக் காட்டுகிறது; அதேவேளை ‘நிராகரிக்கிறீர்கள்’ என்பதைவிட மூலச்சொல்லின் உருவகத்துக்கு நெருக்கமாக உள்ளது.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: கடவுளின் கட்டளையை
  rationale: தெய்வீக அதிகாரத்தின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἵνα
  choice: கடைப்பிடிப்பதற்காக
  rationale: ἵνα-வின் நோக்கப் பொருளைப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: παράδοσιν ὑμῶν
  choice: உங்கள் மரபை
  rationale: மனிதர்களால் வழிவழியாகக் கொடுக்கப்பட்ட நடைமுறை என்ற சூழல்சார் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: τηρήσητε
  choice: கடைப்பிடிப்பதற்காக
  rationale: மரபைப் பேணுதல் அல்லது அனுசரித்தல் என்ற பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றிலுள்ள தொனி
  choice: பாராட்டாக அல்ல, ஏளனமான கண்டனமாக மொழிபெயர்த்தல்
  alternative: “உங்கள் மரபைக் கடைப்பிடிப்பதற்காகக் கடவுளின் கட்டளையை ஒதுக்கிவிடுவது நல்லதே” என்ற சொற்படியான வடிவம்
  rationale: சூழலில் இயேசு மனித மரபைக் கடவுளின் கட்டளைக்கு மேலாக வைப்பதைக் கண்டிக்கிறார். Καλῶς ஏளனமாகப் பயன்படுத்தப்பட்டுள்ளதால், அந்தத் தொனியைத் தமிழிலும் காப்பது பொருத்தம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. “எவ்வளவு நேர்த்தியாக” என்பது கண்டனத்தின் ஏளனத் தொனியை இயல்பாக உணர்த்துகிறது; வியப்புக்குறி அந்தத் தொனியை மேலும் தெளிவாக்குகிறது.
