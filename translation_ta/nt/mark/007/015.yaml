source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: ta
  text: ஒரு மனிதனுக்கு வெளியிலிருந்து அவனுக்குள் செல்லும் எதுவும் அவனைத் தீட்டுப்படுத்த[a] முடியாது; மாறாக, அந்த மனிதனிடமிருந்து வெளியே வருபவையே அவனைத் தீட்டுப்படுத்துகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீட்டுப்படுத்து” என்பதற்கு “அசுத்தமாக்கு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் தூய்மை சார்ந்த தீட்டைக் குறிக்கிறது; சூழலில் ஒழுக்கக் களங்கத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: எதுவும்
  rationale: முற்றிலுமான மறுப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: ஒரு மனிதனுக்கு வெளியே இருந்து
  rationale: வெளிப்புற மூலத்தைக் காட்டுவதோடு, பின்னர் வரும் ‘மனிதனிடமிருந்து வெளியே’ என்ற எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: ஒரு மனிதன் / அந்த மனிதன் / அவன்
  rationale: ἄνθρωπος இங்கு மனிதரைப் பொதுவாகக் குறிக்கிறது; தமிழில் ஒருமை வடிவும் வசனத்தின் சொல்லாட்சித் தொடர்பும் காக்கப்படுகின்றன.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: அவனுக்குள் செல்லும்
  rationale: உட்புகும் இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δύναται
  choice: முடியாது
  rationale: οὐδέν உடனான கட்டமைப்பில் திறன் மறுப்பைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: κοινῶσαι / κοινοῦντα
  choice: தீட்டுப்படுத்த / தீட்டுப்படுத்துகின்றன
  rationale: தூய்மை–தீட்டு சூழலைக் காக்கிறது; அதேவேளை ஒழுக்கக் களங்கம் என்ற விரிந்த நுண்ணுணர்வையும் முற்றிலும் இழக்காது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: வெறும் எதிர்மறையைவிட இயேசுவின் திருத்தும் வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: அந்த மனிதனிடமிருந்து வெளியே வருபவையே
  rationale: நடுநிலைப் பன்மையை ‘வருபவை’ எனக் காட்டி, ἐκ என்பதையும் வலியுறுத்தும் அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: தூய்மை விவாதத்தில் κοινόω என்பதன் பொருள்
  choice: தீட்டுப்படுத்து
  alternative: அசுத்தமாக்கு
  rationale: இங்கு சடங்குசார் தூய்மையும் அடுத்த வசனங்களில் வெளிப்படும் ஒழுக்கக் களங்கமும் தொடர்புடையவை. ‘தீட்டுப்படுத்து’ தூய்மைச் சூழலை நேரடியாகக் காட்டுகிறது; ‘அசுத்தமாக்கு’ என்பதும் சாத்தியமான மாற்று.
- issue: ἄνθρωπος என்பதன் பொதுப்பொருள்
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஒருமை வடிவையும் திரும்பத் திரும்ப வரும் சொல்லாட்சியையும் காக்கிறது; இங்கு ‘மனிதன்’ ஆணை மட்டும் அல்ல, மனிதரைப் பொதுவாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உள்ளே செல்லும் / வெளியே வருபவை’ என்ற மூலத்தின் எதிரிணை காக்கப்பட்டுள்ளது. ‘மனிதன்’ பொதுமனிதப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
