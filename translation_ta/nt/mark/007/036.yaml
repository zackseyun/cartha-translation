  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: ta
  text: இதை யாரிடமும் சொல்ல வேண்டாம் என்று அவர் அவர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார். ஆனால், அவர் அவர்களுக்குக் கட்டளையிட்ட அளவுக்கு, அவர்கள் அதைவிடவும் அதிகமாக இதைப் பறைசாற்றினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களுக்குக் கட்டளையிட்ட அளவுக்கு, அவர்கள் மேலும் மேலும் இதைப் பறைசாற்றினார்கள்”; அல்லது, “அவர் அவர்களுக்குக் கட்டளையிட்ட அளவுக்கு, அவர்கள் எல்லாவற்றையும் விட அதிகமாக இதைப் பறைசாற்றினார்கள்.”
    reason: ὅσον ... μᾶλλον περισσότερον என்ற ஒப்பீட்டு அமைப்பும் இரட்டை வலியுறுத்தலும் தமிழில் ஒன்றுக்கு மேற்பட்ட இயல்பான வடிவங்களில் தரப்படலாம்.
lexical_decisions:
- source_word: διεστείλατο
  choice: கண்டிப்பாகக் கட்டளையிட்டார்
  rationale: διαστέλλομαι என்பதன் நடுவினை வடிவம் உறுதியான கட்டளை அல்லது கண்டிப்பான அறிவுறுத்தலைக் குறிக்கிறது. ‘கண்டிப்பாகக் கட்டளையிட்டார்’ என்பது அதன் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: இதை யாரிடமும் சொல்ல வேண்டாம் என்று
  rationale: இது கட்டளையின் உள்ளடக்கத்தைத் தெரிவிக்கிறது. நிகழ்ந்ததைப் பிறரிடம் தெரிவிக்க வேண்டாம் என்பதே சூழல்; தெளிவுக்காக மறைமுகமாக உள்ள செயப்படுபொருள் ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὅσον ... διεστέλλετο
  choice: அவர் அவர்களுக்கு எவ்வளவு கட்டளையிட்டுக்கொண்டிருந்தாரோ
  rationale: ὅσον என்பதும் இறந்தகாலத் தொடர்வினை வடிவமும் மீண்டும் மீண்டும் அல்லது தொடர்ந்து கட்டளையிட்டதையும் ஒப்பீட்டு அமைப்பையும் காட்டுகின்றன. ‘கட்டளையிட்டுக்கொண்டிருந்தாரோ’ என்பது அந்தத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: μᾶλλον περισσότερον
  choice: அவ்வளவுக்கு இன்னும் அதிகமாக
  rationale: இரண்டு வலியுறுத்தும் வினையுரிச்சொற்களும் அதிகரித்த அளவைச் சுட்டுகின்றன. ‘அவ்வளவுக்கு இன்னும் அதிகமாக’ என்பது அந்த வலியுறுத்தலையும் முந்திய ஒப்பீட்டு அமைப்பையும் இயல்பாகக் காக்கிறது.
- source_word: ἐκήρυσσον
  choice: இதைக் பறைசாற்றினார்கள்
  rationale: κηρύσσω பொதுவெளியில் அறிவிப்பதைக் குறிக்கிறது. ‘பறைசாற்றினார்கள்’ என்பது வெறும் கூறுதலைவிட அதன் வெளிப்படையான, பரவலான அறிவித்தல் பொருளைச் சிறப்பாகத் தருகிறது; ‘இதை’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவின் மௌனக் கட்டளையின் நோக்கமும் வலிமையும்
  choice: அவர் உண்மையாகவே யாரிடமும் சொல்ல வேண்டாம் என்று உறுதியான கட்டளை கொடுத்ததாக நேரடியாக மொழிபெயர்க்கப்பட்டது; அதன் காரணம் விளக்கப்படவில்லை.
  alternative: மெசியாவைப் பற்றிய இரகசிய நோக்கத்தை மொழிபெயர்ப்பிலேயே விளக்குவது, அல்லது ‘கடுமையாக எச்சரித்தார்’ என்று இன்னும் வலுவாக உரைப்பது.
  rationale: வசனம் கட்டளையையும் அதற்கு மாறாக மக்கள் இன்னும் அதிகமாகப் பறைசாற்றியதையும் பதற்றத்துடன் அருகருகே வைக்கிறது. மூலத்தில் சொல்லப்படாத இறையியல் நோக்கத்தைச் சேர்க்காமல் அந்தப் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுநிலைத் தமிழில், dignified ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. ‘பறைசாற்றினார்கள்’ என்பது பொதுவெளியில் பரப்பியறிவித்தல் என்ற பொருளைத் தருகிறது; சமயப் பிரசங்கம் என்ற குறுகிய தொழில்நுட்பப் பொருளைத் தவிர்க்கிறது. கட்டளையின் வலிமை காக்கப்பட்டாலும் அதன் நோக்கம் விளக்கமாகச் சேர்க்கப்படவில்லை.
