source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: ta
  text: 'சந்தையிலிருந்து வந்தபின், தங்களைக் கழுவிக்கொள்ளாவிட்டால்[a] அவர்கள் சாப்பிடுவதில்லை. மேலும், கடைப்பிடிப்பதற்காக அவர்கள் பெற்றுக்கொண்ட வேறு பலவும் உள்ளன: கிண்ணங்கள், குடங்கள், செம்புப் பாத்திரங்கள், உணவருந்தும் சாய்வுப் படுக்கைகள்[b] ஆகியவற்றைக் கழுவுதல்—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூழ்கிக் கழுவிக்கொள்ளாவிட்டால்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் பொதுவாக ‘திருமுழுக்கு அளித்தல்’ அல்லது ‘மூழ்கடித்தல்’ தொடர்பான சொல்லாகும்; ஆனால் இச்சூழலில் அது தூய்மை மரபின்படியான கழுவுதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘உணவருந்தும் சாய்வுப் படுக்கைகள்’ என்பது இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: சந்தை
  rationale: ἀγορά என்பது பொதுமக்கள் கூடும் சந்தைப்பகுதியைக் குறிக்கிறது; இச்சூழலில் இயல்பான நவீனத் தமிழ் இணைச்சொல் ‘சந்தை’.
- source_word: βαπτίσωνται
  choice: தங்களைக் கழுவிக்கொள்ளாவிட்டால்
  rationale: இடைவினைத் தன்மையையும் சடங்குத் தூய்மைச் சூழலையும் வெளிப்படுத்துகிறது. ‘திருமுழுக்குப் பெறுதல்’ என்ற கிறிஸ்தவச் சடங்கு சார்ந்த பொருளைத் தவிர்க்கிறது; முழுவதுமாக மூழ்குதல் மட்டுமே முறை என்று உரை சொல்லாததால் அதையும் முதன்மை மொழிபெயர்ப்பில் திணிக்கவில்லை.
- source_word: παρέλαβον κρατεῖν
  choice: கடைப்பிடிப்பதற்காகப் பெற்றுக்கொண்ட
  rationale: παρέλαβον என்பதிலுள்ள ‘பெற்றுக்கொண்ட’ என்ற கருத்தையும் κρατεῖν என்பதிலுள்ள தொடர்ந்து பற்றிக் கடைப்பிடிக்கும் கருத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἄλλα πολλά
  choice: வேறு பல பழக்கங்களும்
  rationale: கிரேக்கத்தில் சொற்றொடர் பரந்ததாக இருந்தாலும், இங்கு முன்பினுள்ள மரபுசார் நடைமுறைகளைச் சுட்டுவதால் ‘பழக்கங்கள்’ இயல்பாகப் பொருந்துகிறது; ‘சடங்குகள்’ என மிகக் குறுகலாக வரையறுக்கவில்லை.
- source_word: βαπτισμοὺς
  choice: கழுவுதல்
  rationale: பாத்திரங்கள் முதலியவற்றுக்கான சடங்குமுறை கழுவுதல்களைச் சுட்டுகிறது. தமிழில் பன்மைப் பட்டியலுக்குப் பின் வரும் செயற்பெயர் இயல்பாக ஒருமை வடிவில் அமைகிறது.
- source_word: ποτηρίων
  choice: கிண்ணங்கள்
  rationale: குடிப்பதற்குப் பயன்படும் பாத்திரங்களைச் சுட்டும் தெளிவான பொதுத்தமிழ்ச் சொல்.
- source_word: ξεστῶν
  choice: குடங்கள்
  rationale: ξέστης என்பது குடம் அல்லது கூஜா போன்ற ஒரு பாத்திரம்; துல்லியத்தை மீறி அதன் வடிவை நிர்ணயிக்காமல் ‘குடங்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: χαλκίων
  choice: செம்புப் பாத்திரங்கள்
  rationale: χαλκίον என்பது செம்பு அல்லது செம்புக் கலப்பு உலோகத்தால் செய்யப்பட்ட பொருளைக் குறிக்கிறது; ‘செம்புப் பாத்திரங்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: κλινῶν
  choice: உணவருந்தும் சாய்விருக்கைகள்
  rationale: κλίνη என்பது படுக்கை அல்லது சாய்ந்து அமரும் இருக்கையைக் குறிக்கலாம்; உணவுச் சூழலில் சாய்ந்து உணவருந்தப் பயன்படுத்திய இருக்கைகளை இச்சொல் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: சடங்குத் தூய்மைச் சூழலில் βαπτίσωνται / βαπτισμοὺς என்பவற்றின் பொருள்
  choice: ‘தங்களைக் கழுவிக்கொள்ளுதல்’ / ‘கழுவுதல்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தங்களை மூழ்கச் செய்தல்’ / ‘மூழ்குதல்கள்’ அல்லது ‘திருமுழுக்கு’ சார்ந்த சொற்கள்
  rationale: இவ்வசனம் பரிசேயரின் தூய்மை மரபுகளைப் பற்றியது; கிறிஸ்தவத் திருமுழுக்கைப் பற்றியது அல்ல. ‘கழுவுதல்’ என்பது சூழலைப் பாதுகாத்து, கழுவும் முறை குறித்து மூலத்தில் எஞ்சும் தெளிவின்மையையும் தேவையின்றித் தீர்க்காமல் விடுகிறது.
- issue: κλινῶν என்ற வாசகத்தின் உரைநிலை
  choice: முதன்மை உரையில் ‘உணவருந்தும் சாய்விருக்கைகள்’ என்பதை வைத்துக் கொண்டு உரைவேறுபாட்டைக் குறிப்பில் தெரிவிப்பது
  alternative: சில கையெழுத்துப் பிரதிகளைப் பின்பற்றி இச்சொற்றொடரை நீக்குவது
  rationale: SBLGNT முதன்மை உரையில் இச்சொல் இடம்பெறுகிறது; ஆனால் முக்கியமான கையெழுத்துப் பிரதிகளின் வேறுபாடு வாசகருக்குத் தெரிவிக்கப்பட வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியல் இயல்பாக ஓடுமாறு அமைக்கப்பட்டதுடன், வசனத்தின் முடிவிலுள்ள தொடர்ச்சிக் கோடு அடுத்த கருத்தோடு இணையும் மூலவாக்கிய அமைப்பை நினைவுறுத்தும் வகையில் பாதுகாக்கப்பட்டுள்ளது.
