  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: ta
  text: இந்தத் தீய காரியங்கள் அனைத்தும் உள்ளிருந்து வெளிவந்து மனிதனைத் தீட்டுப்படுத்துகின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: இந்தத் தீயவை அனைத்தும்
  rationale: πάντα + ταῦτα என்ற வலியுறுத்தலையும், பெயர்ச்சொல்லாகச் செயல்படும் பன்மை πονηρά என்பதையும் இயல்பான தமிழில் காக்கிறது; முந்தைய வசனங்களில் பட்டியலிடப்பட்ட தீயவற்றை இது சுட்டுகிறது.
- source_word: ἔσωθεν
  choice: உள்ளிருந்து
  rationale: தீட்டின் தோற்றம் வெளிப்புறத்தில் அல்ல, மனிதனின் உள்ளே என்பதைக் குறிக்கும் இடம்சார் மற்றும் ஒழுக்கம்சார் எதிர்மறையைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐκπορεύεται
  choice: வெளிவந்து
  rationale: உள்ளார்ந்த மூலத்திலிருந்து வெளியே வரும் இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கிரேக்கத்தில் நடுநிலைப் பன்மை எழுவாயுடன் வினை ஒருமையில் இருந்தாலும், தமிழில் பொருளுக்கேற்ற பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: κοινοῖ
  choice: தீட்டுப்படுத்துகின்றன
  rationale: மாற்கு 7-இன் தூய்மை–தீட்டு சூழலில் κοινόω என்பது ‘பொதுவாக்குதல்’ என்பதை அல்ல, ஒருவரைத் தீட்டுள்ளவராக்குவதைக் குறிக்கிறது; ‘தீட்டுப்படுத்துதல்’ சடங்குசார் மற்றும் ஒழுக்கம்சார் நிழற்பொருள்களைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: τὸν ἄνθρωπον
  choice: மனிதனை
  rationale: ஒரு மனிதரைப் பிரதிநிதியாகக் கொண்டு பொதுவாக மனிதரைச் சுட்டும் கிரேக்க ஒருமையைத் தமிழின் இயல்பான பொதுப்பொருள் சொல்லான ‘மனிதன்’ மூலம் காக்கிறது; இங்கு ஆணை மட்டும் குறிக்கும் தேவையற்ற வரையறை ஏற்படாது.
theological_decisions:
- issue: κοινοῖ என்பதிலுள்ள தூய்மை மற்றும் ஒழுக்கத் தீட்டு சார்ந்த பொருள்
  choice: தீட்டுப்படுத்துகின்றன
  alternative: அசுத்தமாக்குகின்றன
  rationale: சுற்றியுள்ள பகுதியில் உணவு, தூய்மை, மனித உள்ளம் ஆகியவை இணைந்து பேசப்படுவதால், சொல்லை வெறும் சடங்குசார் அசுத்தமாகவோ வெறும் ஒழுக்கக் கேடாகவோ மட்டுப்படுத்தாமல் ‘தீட்டு’ என்ற சூழல்சார் சொல்லால் இரு பரிமாணங்களும் காக்கப்படுகின்றன.
- issue: τὸν ἄνθρωπον என்ற ஒருமையின் பொதுமனிதப் பயன்பாடு
  choice: மனிதனை
  alternative: ஒரு மனிதரை
  rationale: கிரேக்கத்தின் ஒருமையையும் பொதுவான மனிதக் குறிப்பையும் ‘மனிதனை’ இயல்பாகத் தருகிறது; குறிப்பிட்ட ஓர் ஆணை மட்டும் குறிக்காதபடியும், ‘மனிதகுலம்’ என்று கூட்டுப்பொருளாக்காதபடியும் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடையமைப்பு. ‘இந்தத் தீயவை அனைத்தும்’ மூலத்தின் சுட்டும் மற்றும் முழுமைப்படுத்தும் வலியுறுத்தலைக் காக்கிறது; ‘உள்ளிருந்து வெளிவந்து’ என்ற இணைப்பு மூலத்தின் உள்ளம்–வெளி எதிர்மறையை தெளிவாக வெளிப்படுத்துகிறது.
