  source_fidelity: The translation accurately represents the observation ('they saw'), the partitive expression ('some of his disciples'), the content clause, the ongoing eating, and the food. ‘தீட்டான கைகளால்’ appropriately conveys κοινός in its Jewish ritual-purity setting, while Mark’s explanatory gloss, ‘அதாவது, கழுவாத கைகளால்,’ is retained. The continuing dash is appropriate because the Greek sentence continues into the following verse.
  naturalness: The Tamil is clear, modern, and suitably dignified. ‘அவருடைய சீடர்களில் சிலர் … சாப்பிடுவதை அவர்கள் கண்டார்கள்’ is a natural Tamil clause order, and ‘அப்பம்’ is an established biblical-register rendering for bread here.
  terminology: ‘தீட்டான’ is preferable to a purely hygiene-oriented expression because the context concerns ritual impurity. The footnote responsibly preserves the literal sense ‘பொதுவான’ and notes ‘அசுத்தமான’ as an alternative without obscuring the main-text meaning.
