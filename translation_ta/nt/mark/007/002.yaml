  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: ta
  text: அவருடைய சீடர்களில் சிலர் தீட்டான[a] கைகளால்—அதாவது, கழுவாத கைகளால்—அப்பம் சாப்பிடுவதை அவர்கள் கண்டார்கள்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீட்டான கைகளால்’ என்பதற்கான கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல் ‘பொதுவான கைகளால்’ எனப் பொருள்படும். இங்கு அது வெறும் உடல் அழுக்கை அல்ல, சடங்குமுறைத் தீட்டைக் குறிக்கிறது. ‘அசுத்தமான கைகளால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: கொய்னைஸ் கெர்சின் (κοιναῖς χερσίν) என்ற சொற்றொடரின் சொற்பொருளையும் சடங்குமுறைத் தூய்மை சார்ந்த நுணுக்கத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἰδόντες
  choice: அவர்கள் கண்டார்கள்
  rationale: இறந்தகால வினையெச்சத்தைத் தமிழில் இயல்பான முற்றுவினையாக வழங்குகிறது; எழுவாய் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பரிசேயர்களும் வேத அறிஞர்களில் சிலரும் ஆவர்.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் சிலர்
  rationale: τινάς உடன் வரும் பகுதிப் பொருள் வேற்றுமையை இயல்பான தமிழில் ‘சீடர்களில் சிலர்’ என்று துல்லியமாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: …சாப்பிடுவதை
  rationale: அவர்கள் கண்டதன் உள்ளடக்கத்தைத் தமிழ் ‘என்பதை/…வதை’ அமைப்பால் இயல்பாக வெளிப்படுத்துகிறது; காரணப் பொருளை அளிக்கவில்லை.
- source_word: κοιναῖς χερσίν
  choice: தீட்டான கைகளால்
  rationale: κοινός என்பதன் அடிப்படைப் பொருள் ‘பொதுவான’ என்றாலும், இங்குள்ள யூதத் தூய்மைச் சூழலில் சடங்குமுறைத் தீட்டைக் குறிக்கிறது. ‘தீட்டான’ என்பது வெறும் அழுக்கைக் காட்டாமல் அந்தச் சூழலைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: அதாவது, கழுவாத கைகளால்
  rationale: மாற்கு தரும் விளக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது; தமிழில் தொடர்பு வெளிப்படுவதற்காக ‘கைகளால்’ மீண்டும் இடம்பெறுகிறது.
- source_word: ἐσθίουσιν
  choice: சாப்பிடுவதை
  rationale: கவனிக்கப்பட்ட செயலை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τοὺς ἄρτους
  choice: அப்பம்
  rationale: பன்மை வடிவம் இருந்தாலும் இச்சூழலில் உணவாகிய அப்பத்தை மொத்தப் பொருளில் குறிக்கிறது; ‘அப்பங்கள்’ என்பது தமிழில் தேவையற்ற வகையில் தனித்தனி அப்பங்களை வலியுறுத்தும்.
theological_decisions:
- issue: κοινός என்பதிலுள்ள தூய்மை/தீட்டு நுணுக்கம்
  choice: முதன்மை உரையில் ‘தீட்டான’ என்று மொழிபெயர்த்து, ‘பொதுவான’ என்ற சொற்பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘பொதுவான கைகளால்’ அல்லது ‘அசுத்தமான கைகளால்’
  rationale: இங்கு உடல் அழுக்கு மட்டும் அல்ல, சடங்குமுறைத் தூய்மை பற்றிய கருத்தே பின்னணியாக உள்ளது. ‘தீட்டான’ என்பது தமிழில் அந்தக் கருத்தை இயல்பாகத் தருகிறது; ‘அசுத்தமான’ என்பது சுகாதார அழுக்காகத் தவறாகப் புரியப்படலாம். அதேவேளை மூலத்தின் தனித்துவமான ‘common’ மொழி அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூல வசனம் அடுத்த வசனத்தோடு தொடரும் இடைநிறுத்தப்பட்ட அமைப்பைக் கொண்டதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
