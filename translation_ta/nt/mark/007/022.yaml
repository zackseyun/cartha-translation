source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: ta
  text: விபசாரச் செயல்கள், பேராசைகள், தீய செயல்கள், வஞ்சகம், வெட்கங்கெட்ட நடத்தை, தீய கண்[a], பழிப்புரை[b], அகந்தை, மதியீனம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘தீய கண்’; இது பொறாமையான, பிறருக்கு நன்மை கிடைப்பதை விரும்பாத, அல்லது தீங்கு நினைக்கும் மனப்பான்மையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘தூஷணம்’; கிரேக்கச் சொல் மனிதர்களுக்கு எதிரான பழிப்புரையையோ கடவுளுக்கு எதிரான தேவதூஷணத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: விபசாரச் செயல்கள்
  rationale: கிரேக்கப் பன்மையை இயல்பான தமிழில் வெளிப்படுத்தி, மீண்டும் மீண்டும் நிகழும் விபசாரச் செயல்களையும் குறிக்கிறது.
- source_word: πλεονεξίαι
  choice: பேராசைகள்
  rationale: மேலும் மேலும் பெறவும் பிறரைச் சுரண்டவும் தூண்டும் பிடிவாதமான ஆசையைப் பன்மையில் வெளிப்படுத்துகிறது.
- source_word: πονηρίαι
  choice: தீய செயல்கள்
  rationale: கிரேக்கப் பன்மையையும் பலவகையான ஒழுக்கத் தீமைகளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: δόλος
  choice: வஞ்சகம்
  rationale: வேண்டுமென்றே ஏமாற்றும் தன்மையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἀσέλγεια
  choice: வெட்கங்கெட்ட நடத்தை
  rationale: பாலியல் பொருள் உட்பட, வெட்கமின்றிக் கட்டுப்பாடில்லாமல் நடக்கும் பரந்த பொருளைத் தேவையின்றிக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: ὀφθαλμὸς πονηρός
  choice: தீய பார்வை
  rationale: ‘தீய கண்’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காத்து, அதன் பொறாமை அல்லது பிறருக்குத் தீங்கு நினைக்கும் மனப்பான்மை என்ற இடியப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: βλασφημία
  choice: பழிப்புரை
  rationale: மனிதர்களுக்கு எதிரான அவதூறு அல்லது இழிவான பேச்சைக் குறிக்கும் பரந்த சூழற்பொருளை வழங்குகிறது; கடவுளுக்கு எதிரான தூஷணம் என்ற பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὑπερηφανία
  choice: அகந்தை
  rationale: தன்னை உயர்த்திக்கொள்ளும் செருக்கை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἀφροσύνη
  choice: மதியீனம்
  rationale: அறிவுத்திறன் குறைவை மட்டும் அல்லாமல் ஒழுக்க மற்றும் நடைமுறை விவேகமின்மையையும் குறிக்கிறது.
theological_decisions:
- issue: βλασφημία என்பதன் மனிதருக்கு எதிரான பழிப்புரை / கடவுளுக்கு எதிரான தூஷணம் என்ற பொருள் வரம்பு
  choice: பழிப்புரை
  alternative: தூஷணம் அல்லது தேவதூஷணம்
  rationale: சுற்றியுள்ளவை பொதுவான ஒழுக்கத் தீமைகளாக இருப்பதால் ‘பழிப்புரை’ முதன்மை உரையில் இயல்பாகப் பொருந்துகிறது. ஆயினும் கிரேக்கச் சொல் கடவுளுக்கு எதிரான தூஷணத்தையும் குறிக்கக்கூடும் என்பதால் அந்த இறையியல் சாத்தியம் அடிக்குறிப்பில் நீக்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் சுருக்கமான ஓட்டத்தையும் கண்ணியமான வேதாகம நடையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கப் பன்மைகள் தமிழில் இயல்பாகத் தெரிவிக்கப்படும் இடங்களில் வெளிப்படையாகக் காக்கப்பட்டுள்ளன; உருவகமும் பொருள் இருமையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
