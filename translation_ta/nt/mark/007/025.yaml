source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: ta
  text: ஆனால், சிறு மகளுக்கு அசுத்த ஆவி[b] பிடித்திருந்த ஒரு பெண், அவரைப் பற்றிக் கேள்விப்பட்டவுடனே[c] வந்து அவருடைய காலடியில் விழுந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘தீட்டான ஆவி’; மரபாக இது பேயைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: இதனை, ‘ஆனால் உடனே, சிறு மகளுக்கு அசுத்த ஆவி பிடித்திருந்த ஒரு பெண் அவரைப் பற்றிக் கேள்விப்பட்டு வந்து அவருடைய காலடியில் விழுந்தாள்’ என்றும் அமைக்கலாம்.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள மென்மையான மாறுபாட்டையும் தொடர்ச்சியையும் காட்டுகிறது.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: அவரைப் பற்றிக் கேள்விப்பட்டவுடனே
  rationale: இயேசுவைப் பற்றிய செய்தியைக் கேட்டதும் அவள் உடனடியாகச் செயல்பட்டாள் என்ற மாற்குவின் வேகமான நடையை இயல்பான தமிழில் தருகிறது; தொடரமைப்பில் உள்ள சாத்தியமான வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: கட்டுரையில்லாத γυνή இங்கு புதிதாக அறிமுகமாகும் ஒருவரைக் குறிக்கிறது.
- source_word: θυγάτριον
  choice: சிறு மகள்
  rationale: θυγάτριον என்பது ‘மகள்’ என்பதன் சிறுமை அல்லது அன்புநயம் காட்டும் வடிவம்; உறவையும் அந்த நயத்தையும் தமிழில் வைத்திருக்கிறது.
- source_word: πνεῦμα ἀκάθαρτον
  choice: அசுத்த ஆவி
  rationale: மாற்கு தொடர்ந்து பயன்படுத்தும் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது; ‘பேய்’ என்று மொழிபெயர்ப்பது கூடுதல் விளக்கமாகிவிடும்.
- source_word: ἐλθοῦσα
  choice: வந்து
  rationale: பங்கேற்புவினையை நிகழ்வுகளின் இயல்பான தொடராகத் தமிழில் அளிக்கிறது.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: அவருடைய காலடியில் விழுந்தாள்
  rationale: அவசர வேண்டுதலையும் தாழ்மையையும் காட்டும் உடல் செயலை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον என்பதன் மொழிபெயர்ப்பு
  choice: அசுத்த ஆவி
  alternative: தீட்டான ஆவி; பேய்
  rationale: மாற்குவின் தனிச்சொல்லாட்சியையும் அதன் அசுத்தம் சார்ந்த கருத்துநயத்தையும் பாதுகாக்கிறது. ‘பேய்’ என்பது பொருளில் தொடர்புடையதாயினும், மூலச் சொல்லைவிட விளக்கமான மொழிபெயர்ப்பு.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சிறு மகளை உடைய ஒரு பெண்’ என்பது மூலத்தின் உறவுக்கூற்றை வெளிப்படையாக வைத்திருக்கிறது; ‘தாய்’ என்பது பொருளில் தெளிவாக இருந்தாலும் மூலத்தில் இல்லாத பெயர்ச்சொல் என்பதால் சேர்க்கப்படவில்லை.
