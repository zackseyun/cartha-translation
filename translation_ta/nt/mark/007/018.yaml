source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்களும்கூட இவ்வளவு புரிதலற்றவர்களாக இருக்கிறீர்களா? வெளியிலிருந்து மனிதனுக்குள் செல்லும் எதுவும் அவனைத் தீட்டுப்படுத்த[a] முடியாது என்பதைப் புரிந்துகொள்ளவில்லையா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தூய்மையற்றவராக்க.” இச்சூழலில் கிரேக்க வினைச்சொல் சடங்குத் தூய்மை சார்ந்த பொருளையும் கொண்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கக் கதையாடலில் நிகழ்கால வடிவம் பயன்படுத்தப்பட்டாலும், தமிழில் இயல்பான இறந்தகாலக் கதையாடலாக மொழிபெயர்க்கப்பட்டது.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: நீங்களும்கூட இப்படி
  rationale: οὕτως என்பதன் ‘இப்படி’ என்ற சுட்டுப்பொருளையும், καὶ ὑμεῖς என்பதன் வலியுறுத்தப்பட்ட ‘நீங்களும்கூட’ என்ற பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀσύνετοί
  choice: புரிந்துகொள்ளாமல்
  rationale: இச்சூழலில் அறிவு அல்லது பகுத்துணர்வு இல்லாமையைக் குறிக்கிறது; அடுத்துவரும் νοεῖτε உடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: νοεῖτε
  choice: புரிந்துகொள்ளவில்லையா
  rationale: கேள்வி வடிவத்தையும் அறிவால் உணர்தல் என்ற பொருளையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: வெளியிலிருந்து ... செல்லும் எதுவும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வடிவத்தைத் தமிழில் இயல்பான பொதுமை உறவுத்தொடராக வழங்குகிறது; ἔξωθεν என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: εἰς τὸν ἄνθρωπον
  choice: மனிதனுக்குள்
  rationale: εἰς என்பதன் உள்நோக்கிய இயக்கத்தையும், ἄνθρωπος என்பதன் இங்கு பொதுவான மனிதரைக் குறிக்கும் ஒருமை வடிவத்தையும் காக்கிறது.
- source_word: κοινῶσαι
  choice: தீட்டுப்படுத்த
  rationale: உணவுத் தூய்மை பற்றிய இச்சூழலில் ஒருவரைத் தூய்மையற்றவராக்குதல் என்ற சடங்குத் தூய்மை சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κοινόω என்பதிலுள்ள தூய்மைச் சொற்பொருள்
  choice: தீட்டுப்படுத்த
  alternative: தூய்மையற்றவனாக்க
  rationale: இச்சொல் பொதுவான ஒழுக்கச் சீரழிவை மட்டும் குறிக்காமல், இப்பகுதியில் சடங்குத் தூய்மை குறித்த கருத்தையும் சுமக்கிறது. முதன்மை உரை இயல்பாக இருக்க ‘தீட்டுப்படுத்த’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ἀσύνετοι–νοεῖτε இடையிலான ‘புரிந்துகொள்’ சொற்பொருள் தொடர்பு தமிழிலும் திட்டமிட்டு காக்கப்பட்டுள்ளது.
