source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: ta
  text: அவர் வானத்தை நோக்கிப் பார்த்து, பெருமூச்சுவிட்டு[a], அவனிடம், “எப்பத்தா,”[b] அதாவது, “திறக்கப்படுவாயாக,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முனகி”; இச்சொல் ஆழ்ந்த பெருமூச்சையோ முனகலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எப்பத்தா” என்பது அரமேயச் சொல்; அதற்கு “திறக்கப்படுவாயாக” என்று பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: வானத்தை அண்ணாந்து பார்த்து
  rationale: மேல்நோக்கிய பார்வையையும் அதன் இலக்காகிய வானத்தையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐστέναξεν
  choice: பெருமூச்சுவிட்டு
  rationale: இந்த வினை ஆழ்ந்த மூச்சுவிடுதல் அல்லது முனகுதல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம்; இச்சூழலில் இயல்பான தமிழாக ‘பெருமூச்சுவிட்டு’ தேர்ந்தெடுக்கப்பட்டது, மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: λέγει αὐτῷ
  choice: அவனிடம் … என்றார்
  rationale: வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலத்தில் தருகிறது; αὐτῷ என்பதன் தனிப்பட்ட முகவரியையும் காக்கிறது.
- source_word: Εφφαθα
  choice: எப்பத்தா
  rationale: மாற்கு பாதுகாத்துள்ள அரமேய ஒலிவடிவத்தைத் தமிழில் ஒலிபெயர்த்து, மூல உரையின் தனித்தன்மையைக் காக்கிறது.
- source_word: Διανοίχθητι
  choice: திறக்கப்படுவாயாக
  rationale: ஒருமை அசைநிலை கட்டளையின் வடிவத்தையும், மாற்கு தரும் நேரடி விளக்கத்தையும் முடிந்தவரை காக்கிறது.
theological_decisions:
- issue: αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: ‘அவனிடம்’—கேளாத மனிதனிடம் இயேசு பேசுகிறார்
  alternative: அவனுடைய காதுகள் அல்லது பேச்சுறுப்புகளிடம் மறைமுகமாகப் பேசுகிறார்
  rationale: கிரேக்க மொழியின் வேற்றுமை வடிவம் இயல்பாக அந்த மனிதனையே சுட்டுகிறது. கட்டளை அவனுடைய தடைப்பட்ட புலன்களை நோக்கியதாகப் புரிந்துகொள்ளப்படலாம் என்றாலும், மொழிபெயர்ப்பு தனிப்பட்ட முகவரியை மாற்றிப் பரிமாற்றவில்லை.
- issue: ‘திறக்கப்படுவாயாக’ என்ற கட்டளையின் மறைமுக இலக்கு
  choice: மூலத்தில் உள்ளபடி மனிதனுக்கான ஒருமை கட்டளையாக வைத்தல்
  alternative: ‘காதுகளே, திறவுங்கள்’ என்று உறுப்புகளை வெளிப்படையாகச் சேர்த்தல்
  rationale: மூல உரை உறுப்புகளை வெளிப்படையாகக் குறிப்பிடவில்லை; ஆகவே விளக்கத்தை உரைக்குள் சேர்க்காமல் அதன் பொருள் நெருக்கடியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அண்ணாந்து பார்த்து’ மேல்நோக்கிய செயலை இயல்பாகத் தெரிவிக்கிறது; ‘திறக்கப்படுவாயாக’ மூலத்தின் அசைநிலை கட்டளையைப் பாதுகாக்கச் சற்றே உயர்ந்த நடையில் வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் அவற்றுக்குரிய இடங்களில் இணைக்கப்பட்டுள்ளன.
