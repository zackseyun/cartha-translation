  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: ta
  text: ஆனால், மனிதக் கட்டளைகளைப் போதனைகளாகக் கற்பித்து, அவர்கள் வீணாக என்னை வழிபடுகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάτην
  choice: வீணாக
  rationale: ‘பயனின்றி, எந்த நோக்கமும் நிறைவேறாமல்’ என்ற வினையடைப் பொருளை இயல்பாகவும் தீர்க்கதரிசன மேற்கோளின் கண்டன வலிமையுடனும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உதட்டளவிலான மதிப்புக்கும் இதயத்தின் தொலைவுக்கும் இங்குள்ள வழிபாட்டுக்கும் இடையேயான முரண்பாட்டைக் காட்டுகிறது.
- source_word: σέβονταί με
  choice: என்னை வழிபடுகிறார்கள்
  rationale: தெய்வத்தை நோக்கிய வணக்கத்தைக் குறிக்கும் σέβομαι என்பதையும் அதன் நேரடிச் செயப்படுபொருளான με என்பதையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: διδάσκοντες
  choice: போதித்து
  rationale: நிகழ்காலப் பங்கேற்புவினை, அவர்களுடைய வீணான வழிபாடு எவ்வாறு அமைகிறது என்பதைக் காட்டுகிறது; தமிழ் வினையெச்சம் அந்த உறவை இயல்பாகப் பாதுகாக்கிறது.
- source_word: διδασκαλίας
  choice: போதனைகளாக
  rationale: மனிதக் கட்டளைகள் அதிகாரமிக்க போதனைகளாக முன்வைக்கப்படுகின்றன என்ற apposition போன்ற உறவைத் தெளிவுபடுத்துகிறது.
- source_word: ἐντάλματα ἀνθρώπων
  choice: மனிதர்களின் கட்டளைகளை
  rationale: கட்டளைகளின் மூலம் மனிதர்கள் என்பதைக் காட்டுகிறது; இங்கு பாலின வேறுபாடு அல்ல, தெய்வீக மூலத்துக்கும் மனித மூலத்துக்கும் இடையேயான வேறுபாடே கருத்து.
theological_decisions:
- issue: மனிதக் கட்டளைகளுக்கும் போதனைகளுக்கும் இடையேயான சுருக்கமான கிரேக்கத் தொடர்பு
  choice: மனிதர்களின் கட்டளைகளைப் போதனைகளாகப் போதித்து
  alternative: மனிதர்களின் கட்டளைகளாகிய போதனைகளைப் போதித்து
  rationale: மனிதர்களிடமிருந்து வந்த கட்டளைகள் அதிகாரமிக்க போதனைகளின் நிலையில் கற்பிக்கப்படுகின்றன என்ற கண்டனத்தை முதன்மை வாசகம் இயல்பான தமிழில் தெரிவிக்கிறது. மாற்று வாசகம் கிரேக்கச் சொற்களின் இணைப்பை வேறுவிதமாகப் பிரதிபலிக்கிறது; மூலத்தின் சுருக்கத்தால் ஏற்படும் இந்த நுண்ணிய இருமையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டது. ‘வீணாக’ மற்றும் ‘வழிபடுகிறார்கள்’ ஆகியவை வேதாகமச் சூழலின் வலிமையைத் தக்கவைத்தபடியே இயல்பாக ஒலிக்கின்றன.
