revisions:
- from: ஆனால் நீங்களோ, ஒருவன் தன் தந்தையிடமோ தாயிடமோ, “என்னிடமிருந்து உங்களுக்கு உதவியாகக் கிடைக்கக்கூடியது ‘கொர்பான்’[a] (அதாவது, ‘காணிக்கை’[b])” என்று சொன்னால்—
  to: 'ஆனால், நீங்கள் இவ்வாறு சொல்கிறீர்கள்: “ஒருவன் தன் தந்தையிடமோ தாயிடமோ, ‘என்னிடமிருந்து உங்களுக்குக் கிடைக்கக்கூடியது கொர்பான்[a] (அதாவது, கொடை[b])’ என்று சொன்னால்—”'
  rationale: The revision explicitly translates ὑμεῖς δὲ λέγετε as ‘ஆனால், நீங்கள் இவ்வாறு சொல்கிறீர்கள்,’ then preserves the conditional quotation. It places the prospective benefit immediately before ‘கொர்பான்,’ clarifying the intended declaration without adding a verb absent from the source. ‘கொடை’ renders Δῶρον directly, while the contextual alternative remains in a footnote. The terminal dash is retained because the syntax and consequence continue in Mark 7:12.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the key elements of the Greek, including the contrastive ‘you,’ the conditional case, the parental addressees, the loanword Κορβᾶν, Mark’s explanatory gloss, and the unfinished syntax carried into v. 12. However, it omits an explicit equivalent for λέγετε (‘you say’) in the governing clause. Its word order also makes the quoted declaration less clear than the Greek: the support that the parent might receive is what is declared ‘Corban.’'
  naturalness: 'The current opening, ‘ஆனால் நீங்களோ, ஒருவன் ... சொன்னால்,’ is not a complete or natural Tamil representation of ‘But you say: If a person says ...’. Supplying ‘இவ்வாறு சொல்கிறீர்கள்’ makes the discourse structure clear. The revised nested quotation is natural in modern standard Tamil and preserves the fact that the saying continues into the next verse.'
  terminology: ‘கொர்பான்’ appropriately preserves the Semitic loanword. For Mark’s gloss Δῶρον, ‘கொடை’ is the closer unmarked equivalent of ‘gift’; ‘காணிக்கை’ is retained as a legitimate contextual alternative in the note. This avoids making Mark’s brief gloss more cultically specific than the Greek wording itself.
  issues:
  - severity: high
    issue: The governing verb λέγετε is absent from the Tamil main text.
    rationale: ‘ஆனால் நீங்களோ, ஒருவன் ... சொன்னால்’ presents only the conditional clause and does not say what ‘you’ do. The Greek explicitly has ‘But you say,’ followed by the conditional quotation.
  - severity: medium
    issue: The relationship of ‘Corban’ to the prospective benefit is unclear in the current word order.
    rationale: The Greek quotation declares that whatever benefit the parent might receive from the speaker is ‘Corban.’ Reordering the Tamil phrase makes this declaration intelligible while retaining the Greek’s ellipsis and the dash that marks continuation into v. 12.
  - severity: low
    issue: ‘காணிக்கை’ is slightly more specific than Mark’s gloss Δῶρον.
    rationale: Δῶρον is directly ‘gift’; although ‘offering’ is contextually possible, ‘கொடை’ better represents the brief lexical gloss in the main text. ‘காணிக்கை’ can be retained as a footnoted alternative.
  revised_text: 'ஆனால், நீங்கள் இவ்வாறு சொல்கிறீர்கள்: “ஒருவன் தன் தந்தையிடமோ தாயிடமோ, ‘என்னிடமிருந்து உங்களுக்குக் கிடைக்கக்கூடியது கொர்பான்[a] (அதாவது, கொடை[b])’ என்று சொன்னால்—”'
