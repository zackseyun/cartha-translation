id: MRK.7.11
reference: Mark 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: ta
  text: 'ஆனால், நீங்கள் இவ்வாறு சொல்கிறீர்கள்: “ஒருவன் தன் தந்தையிடமோ தாயிடமோ, ‘என்னிடமிருந்து உங்களுக்குக் கிடைக்கக்கூடியது கொர்பான்[a] (அதாவது, கொடை[b])’ என்று சொன்னால்—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொர்பான்’ என்பது கடவுளுக்குக் காணிக்கையாக அர்ப்பணிக்கப்பட்ட ஒன்றைக் குறிக்கும் சொல்; இவ்வாறு அர்ப்பணிக்கப்பட்டது குடும்பத்தின் வழக்கமான பயன்பாட்டுக்குக் கொடுக்கப்படாமல் வைக்கப்பட்டது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘காணிக்கை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: ஆனால் நீங்களோ ... சொன்னால்
  rationale: δὲ முன்னுள்ள இறைக் கட்டளைக்கும் மனித மரபுக்கும் இடையிலான முரண்பாட்டைக் குறிக்கிறது; வலியுறுத்தப்பட்ட ὑμεῖς என்பதைக் ‘நீங்களோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: ஒருவன் ... சொன்னால்
  rationale: ἐὰν உடன் வரும் இறந்தகாலத் துணைவினை நிபந்தனையான நிகழ்வைக் குறிக்கிறது. ἄνθρωπος இங்கு பொதுப்படையான தனிநபரைக் குறிப்பதால் ‘ஒருவன்’ இயல்பாகவும் மூலத்தின் ஒருமையையும் காத்தும் அமைகிறது.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: தன் தந்தையிடமோ தாயிடமோ
  rationale: இரு பெற்றோரில் யாரை நோக்கிச் சொல்லப்படுகிறது என்பதையும், கிரேக்கத்தின் மாற்றுத் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: Κορβᾶν
  choice: கொர்பான்
  rationale: கிரேக்க மூலமே செமித்திய சமயச் சொல்லை ஒலிபெயர்த்து, பின்னர் அதற்கு விளக்கம் தருகிறது. அதே அமைப்பைத் தமிழிலும் காக்க இந்தச் சொல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: ὅ ἐστιν Δῶρον
  choice: அதாவது, ‘காணிக்கை’
  rationale: δῶρον என்பதற்கு ‘கொடை’ அல்லது ‘காணிக்கை’ என்று பொருள் கொள்ளலாம். கடவுளுக்கென்று அர்ப்பணிக்கப்பட்ட பொருளைக் குறிக்கும் இச்சூழலில் ‘காணிக்கை’ இயல்பானது; மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: என்னிடமிருந்து உங்களுக்கு உதவியாகக் கிடைக்கக்கூடியது
  rationale: ὠφεληθῇς என்பதிலுள்ள உதவி அல்லது பயன் பெறுதல் என்ற பரந்த பொருளை இது காக்கிறது; பெற்றோருக்குக் கிடைக்க வேண்டிய ஆதரவு பொருளாதார உதவியாக மட்டுமே அதிகமாகக் குறிப்பாக்கப்படவில்லை. தமிழ் இயல்புக்காக தொடர்புப் பகுதி ‘கொர்பான்’ என்பதற்கு முன் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கொர்பான் என்ற அர்ப்பணிப்பு வாய்பாட்டை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘கொர்பான்’ என்ற ஒலிபெயர்ப்பை வைத்திருந்து, ‘அதாவது, காணிக்கை’ என்று விளக்குதல்
  alternative: முதன்மை உரையிலேயே ‘கடவுளுக்கென்று அர்ப்பணிக்கப்பட்ட காணிக்கை’ என்று விரித்துரைத்தல்
  rationale: மூல கிரேக்கம் அந்நியச் சொல்லை அப்படியே வைத்துப் பின்னர் குறுகிய விளக்கம் அளிக்கிறது. அதே பதற்றத்தையும் வரலாற்றுச் சிறப்பையும் காக்க ஒலிபெயர்ப்பு வைக்கப்படுகிறது; அதன் நடைமுறைப் பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. பெற்றோரை நேரடியாக அழைக்கும் சொல்லில் ‘உங்களுக்கு’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் வாக்கிய அமைப்பு அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
