revisions:
- from: அங்கிருந்து அவர் எழுந்து, தீரு பகுதிக்குப் புறப்பட்டுச் சென்றார்.[a] ஒரு வீட்டுக்குள் நுழைந்த பின்பு, தான் அங்கே இருப்பது யாருக்கும் தெரியக் கூடாது என்று விரும்பினார்;[b] ஆனாலும் அவர் மறைந்திருக்க முடியவில்லை.[c]
  to: அங்கிருந்து அவர் எழுந்து புறப்பட்டு, தீருவின் பகுதிகளுக்குச் சென்றார்.[a] ஒரு வீட்டுக்குள் நுழைந்த பின்பு, தான் அங்கே இருப்பது யாருக்கும் தெரியக் கூடாது என்று விரும்பினார்;[b] ஆனாலும் அவர் மறைந்திருக்க முடியவில்லை.[c]
  rationale: The revision makes the Tyre phrase idiomatic Tamil and more closely aligned with the plural, district/territory sense of τὰ ὅρια. It also removes an unnecessarily political nuance from footnote a. The translation otherwise preserves the source’s implicit object and the sense that Jesus could not escape notice.
