translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் செயல்வரிசையும், வெளிப்படையாகச் சொல்லப்படாத செயப்படுபொருளும், λανθάνω என்பதிலுள்ள ‘கவனிக்கப்படாமல் இருத்தல்’ என்ற நுணுக்கமும் உரை மற்றும் அடிக்குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
