  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ta
  text: அங்கிருந்து அவர் எழுந்து புறப்பட்டு, தீருவின் பகுதிகளுக்குச் சென்றார்.[a] ஒரு வீட்டுக்குள் நுழைந்த பின்பு, தான் அங்கே இருப்பது யாருக்கும் தெரியக் கூடாது என்று விரும்பினார்;[b] ஆனாலும் அவர் மறைந்திருக்க முடியவில்லை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீருவின் நிலப்பகுதிக்கு” அல்லது “தீருவைச் சேர்ந்த எல்லைப் பகுதிக்கு.” கிரேக்கச் சொல் வெறும் எல்லைக் கோட்டை மட்டுமல்லாமல் தீருவுடன் தொடர்புடைய பகுதியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொற்சார்ந்த மொழிபெயர்ப்பு: “யாரும் அறியக் கூடாது என்று விரும்பினார்.” கிரேக்கத்தில் அறியப்பட வேண்டியது என்ன என்பது வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது அவர் அங்கே இருப்பதையோ அவரது இருப்பிடத்தையோ குறிக்கிறது.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர் பிறரது கவனத்திலிருந்து தப்ப முடியவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: அங்கிருந்து
  rationale: Ἐκεῖθεν முந்தைய இடத்திலிருந்து புறப்படுவதைக் குறிக்கிறது; δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைத் தருவதால் தமிழில் தனிச் சொல்லாக வெளிப்படுத்தப்படவில்லை.
- source_word: ἀναστὰς ἀπῆλθεν
  choice: எழுந்து… புறப்பட்டுச் சென்றார்
  rationale: ἀναστὰς அடுத்த செயலை அறிமுகப்படுத்தும் கதைநடைப் பங்கேற்பு வினை; ἀπῆλθεν ஓர் இடத்தைவிட்டுப் புறப்படுவதையும் வேறோர் இடத்திற்குச் செல்வதையும் குறிக்கிறது.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: தீரு பகுதிக்கு
  rationale: ὅρια என்பது எல்லைக் கோடுகளை மட்டும் அல்லாமல் ஒரு நகரத்துடன் தொடர்புடைய பகுதி அல்லது ஆட்சிப்பரப்பையும் குறிக்கலாம்; இங்கு இயல்பான தமிழில் ‘பகுதி’ பொருத்தமானது.
- source_word: εἰσελθὼν εἰς οἰκίαν
  choice: ஒரு வீட்டுக்குள் நுழைந்த பின்பு
  rationale: பங்கேற்பு வினை காலவரிசையைச் சுட்டுகிறது; οἰκίαν குறிப்பிட்ட சுட்டியின்றி இருப்பதால் ‘ஒரு வீடு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: தான் அங்கே இருப்பது யாருக்கும் தெரியக் கூடாது என்று விரும்பினார்
  rationale: கிரேக்கத்தில் ‘அறிய’ என்பதன் செயப்படுபொருள் வெளிப்படையாக இல்லை; சூழலில் அது இயேசுவின் இருப்பிடம் அல்லது அங்கிருப்பதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க இதை வெளிப்படுத்தியபோதும் அடிக்குறிப்பில் சொற்சார்ந்த அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: οὐκ ἠδυνήθη λαθεῖν
  choice: அவர் மறைந்திருக்க முடியவில்லை
  rationale: λανθάνω கவனிக்கப்படாமல் இருத்தல் அல்லது பிறருக்குத் தெரியாமல் இருத்தல் என்ற பொருளுடையது; ‘மறைந்திருக்க முடியவில்லை’ நோக்கத்திற்கும் நிகழ்ந்த விளைவிற்கும் இடையிலான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
