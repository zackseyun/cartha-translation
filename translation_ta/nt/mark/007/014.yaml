  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: ta
  text: அவர் மீண்டும் மக்கள் கூட்டத்தைத் தம்மிடம் அழைத்து, “நீங்கள் எல்லாரும் எனக்குச் செவிகொடுங்கள்; புரிந்துகொள்ளுங்கள்” என்று அவர்களிடம் சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: மக்கள் கூட்டத்தைத் தம் அருகே வருமாறு அழைத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: இச்சொல் SBLGNT உரையில் இருப்பதையும், முந்தைய அழைப்பைத் தொடர்ந்து மீண்டும் அழைத்ததையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது விரிவாக நடைபெறும் கூறலைப் பாதுகாக்கிறது; எளிய ‘சொன்னார்’ என்று சுருக்கவில்லை.
- source_word: Ἀκούσατέ μου
  choice: எனக்குச் செவிகொடுத்து
  rationale: கேட்பதோடு கவனமாக ஏற்றுக்கொள்ள வேண்டும் என்ற கட்டளையின் இயல்பான தமிழ் வெளிப்பாடு.
- source_word: σύνετε
  choice: புரிந்துகொள்ளுங்கள்
  rationale: கேட்ட செய்தியின் பொருளை உணருமாறு விடுக்கப்பட்ட பன்மைக் கட்டளையைத் தெளிவாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் சுட்டுப்பெயரில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘நீங்கள் எல்லாரும்’ என்பது πάντες என்பதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
