source:
  edition: SBLGNT
  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: ta
  text: அவர்கள் அளவுகடந்து வியந்தார்கள்[a], “அவர் எல்லாவற்றையும் நன்றாகச் செய்திருக்கிறார். காது கேளாதவர்களைக் கேட்கச் செய்கிறார்; பேச முடியாதவர்களைப் பேசச் செய்கிறார்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகவும் வியந்தார்கள்” அல்லது “அளவுக்கு மிகுதியாக வியந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் அவர்களுடைய வியப்பின் அசாதாரண தீவிரத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்தச் சொற்கள் ஏசாயா 35:5–6-ல் காணப்படும் கடவுளின் மீட்பு பற்றிய மொழியை நினைவூட்டுகின்றன; அங்கே செவிடரின் காதுகள் திறக்கப்படுவதும் பேச இயலாதவரின் நாவு பாடுவதும் கூறப்படுகின்றன. “எல்லாவற்றையும் நன்றாகச் செய்திருக்கிறார்” என்ற கூற்றும் கடவுளுடைய செயல்களை மதிப்பிடும் வேதாகம மொழியை எதிரொலிக்கக்கூடும்.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς ἐξεπλήσσοντο
  choice: அளவுகடந்து வியந்துபோய்
  rationale: மிகத் தீவிரமான வியப்பையும், தொடர்ந்து நிலவிய வியப்பின் நிலையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: அவர் எல்லாவற்றையும் நன்றாகச் செய்திருக்கிறார்
  rationale: πάντα என்பதன் முழுமையான பரப்பையும், πεποίηκεν என்ற நிறைவுற்ற வினையின் தற்போதைய பொருத்தத்தையும் காக்கிறது; அதேவேளையில் தமிழில் இயல்பாக உள்ளது.
- source_word: τοὺς κωφοὺς ποιεῖ ἀκούειν
  choice: காது கேளாதவர்களைக் கேட்கவும் ... செய்கிறார்
  rationale: ποιεῖ உடன் வரும் வினையெச்சத்தின் காரணவினைப் பொருளை நேரடியாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀλάλους λαλεῖν
  choice: பேச முடியாதவர்களைப் பேசவும்
  rationale: ἄλαλος குறிக்கும் பேச இயலாத நிலையை மரியாதையான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழில் தருகிறது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: கூட்டத்தாரின் வியப்பைத் தொடர்ந்து அவர்கள் கூறிய சொற்களை இயல்பான தமிழ் நேர்கூற்றாக அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: ஏசாயா 35:5–6 பற்றிய சாத்தியமான சுட்டும், ‘எல்லாவற்றையும் நன்றாகச் செய்திருக்கிறார்’ என்பதில் படைப்பைப் பற்றிய வேதாகம மொழியின் எதிரொலியும்
  choice: மூல உரையின் நேரடியான கூற்றை முதன்மை உரையில் நெருக்கமாகக் காத்து, சாத்தியமான வேதாகம எதிரொலியை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: அந்தச் சுட்டுகளை முதன்மை உரையிலேயே வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரை அந்தத் தொடர்புகளை நேரடியாக விளக்கவில்லை. ஆகவே அவற்றை உறுதியான விளக்கமாக முதன்மை உரைக்குள் சேர்க்காமல், வாசகர் கவனிக்க உதவும் வகையில் அடிக்குறிப்பில் தருவது உரையின் இறையியல் நுட்பத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உடல் குறைபாடுகளை இழிவுபடுத்தாத வகையில் ‘காது கேளாதவர்கள்’, ‘பேச முடியாதவர்கள்’ என்ற மரியாதையான சொற்றொடர்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
