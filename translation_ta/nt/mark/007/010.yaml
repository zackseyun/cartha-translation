id: MRK.7.10
reference: Mark 7:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ta
  text: ஏனெனில் மோசே, “உன் தந்தையையும் உன் தாயையும் மதித்து நட” என்றும், “தந்தையையோ தாயையையோ பழித்துப் பேசுகிறவன்[a] நிச்சயமாக மரணமடைய வேண்டும்[b]” என்றும் கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சபிக்கிறவன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் தீயவிதமாகப் பேசுதல், பழித்தல் அல்லது சபித்தல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கொல்லப்பட வேண்டும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில், சொல்லுக்குச் சொல், “மரணத்தால் மரணமடைய வேண்டும்” என்ற சட்டரீதியான வலியுறுத்தல் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: இயேசுவின் முந்தைய கூற்றுக்கு மோசேயின் வார்த்தைகள் விளக்க ஆதாரமாக வருவதை வெளிப்படுத்துகிறது.
- source_word: εἶπεν
  choice: கூறினார்
  rationale: மேற்கோள்களை அறிமுகப்படுத்தும் இயல்பான, மரியாதையான தமிழ் வினைச்சொல்; தமிழின் இயல்பான வாக்கிய அமைப்புக்காக இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: Τίμα
  choice: மதித்து நட
  rationale: கட்டளையின் நீடித்த ஒழுக்கப் பொருளையும் பெற்றோருக்கு உரிய கனத்தைக் காட்டும் செயல்முறையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: உன் தந்தையையும் உன் தாயையும்
  rationale: மூலத்தில் இரு உறவுகளும் தனித்தனியாகக் குறிப்பிடப்படுவதைப் பாதுகாக்கிறது.
- source_word: Ὁ κακολογῶν
  choice: பழித்துப் பேசுகிறவன்
  rationale: ஒருவரைப் பற்றி தீயவிதமாகப் பேசுதல், நிந்தித்தல், சபித்தல் ஆகிய பொருள் வரம்பை மிகையாகச் சுருக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πατέρα ἢ μητέρα
  choice: தந்தையையோ தாயையையோ
  rationale: மூலத்தின் மாற்றுத் தொடர்பைத் துல்லியமாகக் காட்டுகிறது; இல்லாத உடைமைப் பெயரைச் சேர்க்கவில்லை.
- source_word: θανάτῳ τελευτάτω
  choice: நிச்சயமாக மரணமடைய வேண்டும்
  rationale: உறுதியும் சட்டரீதியான கட்டாயமும் கொண்ட மூலத்தின் வலியுறுத்தல் மரபை, தண்டனையை நிறைவேற்றும் முறையை மிகையாகக் குறிப்பாக்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: θανάτῳ τελευτάτω என்ற சட்டத் தண்டனைச் சூத்திரத்தை மொழிபெயர்த்தல்
  choice: நிச்சயமாக மரணமடைய வேண்டும்
  alternative: கொல்லப்பட வேண்டும்
  rationale: மூல கிரேக்கம் மரணத்தின் உறுதியையும் கட்டாயத்தையும் நேரடியாகக் கூறுகிறது; செயப்படுவினை வடிவில் தண்டனை நிறைவேற்றப்படுவதை வெளிப்படையாகக் குறிப்பிடவில்லை. இருப்பினும் சட்டச் சூழலில் ‘கொல்லப்பட வேண்டும்’ என்பது சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளை மொழியின் கனத்தையும் சட்டச் சூத்திரத்தின் வலிமையையும் காத்தபடி, தமிழில் இயல்பாக அமைய மேற்கோள் வினைச்சொல் வாக்கியத்தின் இறுதிக்கு நகர்த்தப்பட்டுள்ளது.
