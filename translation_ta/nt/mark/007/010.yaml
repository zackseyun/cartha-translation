  source_fidelity: மூல கிரேக்கத்தின் γὰρ-இன் விளக்கத் தொடர்பு “ஏனெனில்” என்பதால் காக்கப்படுகிறது. மோசே பெயர், இரு மேற்கோள்கள், பெற்றோர் இருவரின் வெளிப்படையான குறிப்பு, ἢ-இன் மாற்றுத் தொடர்பு, மற்றும் κακολογῶν-இன் பொதுமை அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன. “நிச்சயமாக மரணமடைய வேண்டும்” என்பது θανάτῳ τελευτάτω என்ற சட்டப்பூர்வ, உறுதியான மரணச் சூத்திரத்தை மரணத்தை ஏற்படுத்தும் முறையைத் தேவையின்றி நிர்ணயிக்காமல் வெளிப்படுத்துகிறது.
