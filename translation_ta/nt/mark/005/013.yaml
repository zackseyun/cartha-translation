  to: அவர் அவற்றுக்கு அனுமதி அளித்தார். அப்போது அசுத்த ஆவிகள் வெளியேறி, பன்றிகளுக்குள் புகுந்தன. அந்த மந்தை—ஏறக்குறைய இரண்டாயிரம் பன்றிகள்—செங்குத்தான சரிவில்[a] கீழே கடலுக்குள்[b] பாய்ந்தது; அவை கடலில் மூழ்கி இறந்தன.
  rationale: திருத்தம் ἐπνίγοντο குறிக்கும் மூழ்கி இறந்த விளைவை வெளிப்படுத்துகிறது; மேலும் எண்ணிக்கையை இடைக்கோடுகளில் வைத்து, மந்தையின் ஒருமைச் செயலும் பன்றிகளின் பன்மை முடிவும் தமிழில் இயல்பாகத் தொடருமாறு அமைக்கிறது. மூலத்தின் ‘கடல்,’ தோராய எண்ணிக்கை, அசுத்த ஆவிகள், மற்றும் சுட்டுப்பெயரின் சுருக்கம் பாதுகாக்கப்பட்டுள்ளன.
