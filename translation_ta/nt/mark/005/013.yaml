source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: ta
  text: அவர் அவற்றுக்கு அனுமதி அளித்தார். அப்போது அசுத்த ஆவிகள் வெளியேறி, பன்றிகளுக்குள் புகுந்தன. அந்த மந்தை—ஏறக்குறைய இரண்டாயிரம் பன்றிகள்—செங்குத்தான சரிவில்[a] கீழே கடலுக்குள்[b] பாய்ந்தது; அவை கடலில் மூழ்கி இறந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செங்குத்தான கரையில்’ அல்லது ‘பாறைச் சரிவில்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் கடுமையான சரிவையோ பாறை விளிம்பையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘கடல்.’ இது கலிலேயக் கடலைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: அவர் அவற்றுக்கு அனுமதி அளித்தார்
  rationale: ἐπιτρέπω என்பதன் அனுமதி கொடுத்தல் என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது; αὐτοῖς என்பதன் சுட்டுப்பெயர் வடிவமும் தக்கவைக்கப்படுகிறது.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: அசுத்த ஆவிகள்
  rationale: மாற்கு பயன்படுத்தும் ஆன்மிக ஆளுமைகளைக் குறிக்கும் சொற்றொடரைத் தக்கவைத்து, ἀκάθαρτα என்பதிலுள்ள அசுத்தம் என்ற கருத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: வெளியேறி, பன்றிகளுக்குள் புகுந்தன
  rationale: ஆவிகள் வெளியேறியதையும் பின்னர் பன்றிகளுக்குள் சென்றதையும் தமிழில் இயல்பான நிகழ்வுத் தொடராகக் காட்டுகிறது.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: அந்த மந்தை ... கீழே பாய்ந்து
  rationale: ὁρμάω குறிக்கும் திடீர், வேகமான இயக்கத்தை மிகைப்படுத்தாமல் ‘பாய்ந்து’ என வழங்குகிறது; கூட்டுப்பெயரான மந்தை ஒருமையாக வைக்கப்படுகிறது.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: செங்குத்தான சரிவில் கீழே
  rationale: κρημνός செங்குத்தான சரிவு, கரை அல்லது பாறை விளிம்பைக் குறிக்கக்கூடும்; முழுமையாக நேரான பாறைக்குன்று என்ற பொருளைத் திணிக்காமல் நிலத்தின் கடுமையான இறக்கத்தைத் தெரிவிக்கிறது.
- source_word: εἰς τὴν θάλασσαν
  choice: கடலுக்குள்
  rationale: கலிலேயக் கடல் புவியியல் ரீதியில் ஏரியாக இருந்தாலும், மூலத்தின் θάλασσα என்ற சொல்லை ‘கடல்’ எனத் தக்கவைக்கிறது.
- source_word: ὡς δισχίλιοι
  choice: ஏறக்குறைய இரண்டாயிரம் பன்றிகளைக் கொண்ட
  rationale: ὡς எண்ணிக்கையின் தோராயத் தன்மையைக் காட்டுவதால் ‘ஏறக்குறைய’ பயன்படுத்தப்படுகிறது; தமிழில் எண்ணிக்கை எதைக் குறிக்கிறது என்பது தெளிவாக இருக்க ‘பன்றிகள்’ சேர்க்கப்படுகிறது.
- source_word: ἐπνίγοντο
  choice: அவை கடலில் மூழ்கின
  rationale: இறந்துபோன முடிவை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது; கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தின் நிகழ்ந்துகொண்டிருந்த தன்மையை செயற்கையாக மிகைப்படுத்தவில்லை.
theological_decisions:
- issue: ‘அவற்றுக்கு’ என்பதன் சுட்டுப்பொருள்
  choice: முந்தைய சூழலில் வேண்டிக்கொண்ட அசுத்த ஆவிகளைக் குறிக்கிறது
  alternative: ‘அந்த ஆவிகளுக்கு’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: உடனடி சூழல் சுட்டுப்பொருளைத் தெளிவாக்குகிறது; இருப்பினும் மூலத்தில் உள்ள சுட்டுப்பெயரை விரிவாக்காமல் தக்கவைக்கிறது.
- issue: ‘அசுத்த ஆவிகள்’ என்பதன் இயல்பு
  choice: தனிப்பட்ட செயற்பாடு கொண்ட ஆன்மிக ஆளுமைகளாக மொழிபெயர்த்தல்
  alternative: ஆளுமையற்ற ‘தீய சக்திகள்’ என்று மொழிபெயர்த்தல்
  rationale: πνεύματα வெளியேறி, புகுகின்ற செயற்பாட்டாளர்களாக உரையில் வருகின்றன; ‘ஆவிகள்’ என்பது அந்த மொழியையும் இறையியல் பதற்றத்தையும் கூடுதல் ஊகமின்றித் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அனுமதி அளித்தார்,’ ‘அசுத்த ஆவிகள்,’ ‘மந்தை,’ ‘செங்குத்தான சரிவு’ ஆகியவை துல்லியத்தையும் பொதுவாசகர் புரிதலையும் சமநிலைப்படுத்துகின்றன.
