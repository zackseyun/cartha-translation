  source_fidelity: The Tamil accurately renders the total exclusion (οὐδένα), the exception clause (εἰ μὴ), accompaniment with Jesus (μετ’ αὐτοῦ συνακολουθῆσαι), and the identifying phrase for John as James’s brother. “தம்முடன் வர” is a natural contextual rendering of accompanying/following with him.
