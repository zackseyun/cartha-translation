id: MRK.5.37
reference: Mark 5:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: ta
  text: அவர் பேதுருவையும் யாக்கோபையும் யாக்கோபின் சகோதரனான யோவானையும் தவிர வேறு யாரையும் தம்முடன் வர அனுமதிக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: அனுமதிக்கவில்லை
  rationale: வினையெச்சத்துடன் வரும் ἀφίημι இங்கு ‘அனுமதி அளித்தல்’ என்று பொருள்படுகிறது; எதிர்மறையுடன் ‘அனுமதிக்கவில்லை’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: οὐδένα
  choice: வேறு யாரையும்
  rationale: εἰ μὴ அறிமுகப்படுத்தும் விதிவிலக்குடன் இணைந்து, குறிப்பிட்ட மூவரைத் தவிர மற்ற அனைவரும் விலக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μετ’ αὐτοῦ
  choice: தம்முடன்
  rationale: இது இயேசுவைக் குறிப்பதால் மரியாதைப் பிரதிபெயரான ‘தம்’ பயன்படுத்தப்பட்டுள்ளது; உடன்செல்லும் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: συνακολουθῆσαι
  choice: வர
  rationale: μετ’ αὐτοῦ என்பதுடன் சேர்ந்து ‘தம்முடன் வர’ என்பது ‘உடன் பின்தொடர்ந்து செல்ல’ என்ற கருத்தை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: இங்கு நிபந்தனையைக் காட்டாமல் விதிவிலக்கைக் காட்டுவதால் ‘தவிர’ பொருத்தமானது.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: பேதுருவையும் யாக்கோபையும் ... யோவானையும்
  rationale: பெயர்கள் வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவங்களில் தரப்பட்டுள்ளன; மீண்டும் வரும் καὶ-இன் ஒருங்கிணைப்பு ஒவ்வொரு பெயருடனும் ‘-ஐயும்’ மூலம் பிரதிபலிக்கப்படுகிறது.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: யாக்கோபின் சகோதரனான
  rationale: இந்த அடையாளப்படுத்தும் இணைப்புரை எந்த யோவான் என்பதைத் தெளிவுபடுத்துகிறது; மூலத்தின் உறவுமுறையை நேரடியாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தம்முடன் வர’ என்பது கிரேக்கத்தில் உள்ள உடன்செல்லும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; தேவையற்ற சொற்பெருக்கம் தவிர்க்கப்பட்டுள்ளது.
