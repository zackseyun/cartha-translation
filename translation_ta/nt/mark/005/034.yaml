id: MRK.5.34
reference: Mark 5:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: ta
  text: ஆனால் அவர் அவளிடம், “மகளே, உன் விசுவாசம் உன்னைக் காப்பாற்றியிருக்கிறது.[a] சமாதானத்துடன் போ; உன் வாதையிலிருந்து நலம்பெற்றவளாய் இரு.[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை நலமாக்கியிருக்கிறது” அல்லது “உன்னைக் குணமாக்கியிருக்கிறது.” கிரேக்க வினைச்சொல் மீட்பு, இரட்சிப்பு அல்லது குணமடைதலைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நலமாயிரு” அல்லது “முழு நலம்பெற்றவளாய் இரு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: மகளே
  rationale: நேரடி அழைப்பையும், இயேசுவின் கனிவையும் குடும்ப உறவுச் சாயலையும், மூலத்தில் இல்லாத ‘என்’ என்பதைச் சேர்க்காமல் காக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு அந்தப் பெண் இயேசுவின்மீது வைத்த நம்பிக்கையைக் குறிக்கிறது; முக்கிய இறையியல் சொல்லின் தொடர்ச்சியையும் காக்கிறது.
- source_word: σέσωκέν
  choice: காப்பாற்றியிருக்கிறது
  rationale: σῴζω என்பதன் மீட்பு, இரட்சிப்பு, குணமடைதல் ஆகிய பரந்த பொருள் வாய்ப்புகளை முற்றிலும் உடல் குணமாகுதலாகச் சுருக்காமல் வைத்திருக்கிறது; நிறைவுற்ற செயலின் தொடரும் விளைவை ‘இருக்கிறது’ வெளிப்படுத்துகிறது.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: சமாதானத்துடன் போ
  rationale: புறப்படுவதற்கான கட்டளையையும் சமாதான நிலையில் செல்வதையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἴσθι ὑγιὴς
  choice: நலமாயிரு
  rationale: இது நிகழ்வைக் குறிக்கும் ‘குணமடை’ என்பதைக் காட்டிலும், ἴσθι உடன் வரும் உடல் நலமுள்ள நிலையில் இருத்தலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: μάστιγός
  choice: வாதை
  rationale: சாட்டை அல்லது கொடிய தாக்குதல் என்ற உருவக வலிமையைக் கொண்டே, சூழலில் அவளை வருத்திய கடுமையான உடல் பாதிப்பைக் குறிக்கும் இயல்பான சொல்லாக அமைகிறது.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: சூழலில் இயேசுவின்மீது வைத்த நம்பிக்கையே முன்னிலையில் இருந்தாலும், ‘விசுவாசம்’ என்ற தேர்வு முக்கிய இறையியல் சொல்லின் பரப்பையும் தொடர்ச்சியையும் காக்கிறது.
- issue: σῴζω என்பதற்கும் உடல் குணமடைதலுக்கும் உள்ள உறவு
  choice: காப்பாற்றியிருக்கிறது
  alternative: குணமாக்கியிருக்கிறது / நலமாக்கியிருக்கிறது
  rationale: அடுத்ததாக உடல் நலத்தைத் தனியே கூறுவதால், σῴζω-வை ‘குணமாக்கியது’ என்று மட்டும் சுருக்காமல் மீட்பு மற்றும் குணமடைதல் இடையிலான உண்மையான பொருள் நெருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘மகளே’ என்ற கனிவான நேரடி அழைப்பு காக்கப்பட்டுள்ளது; ‘காப்பாற்றியிருக்கிறது’ மற்றும் ‘நலமாயிரு’ என்பவை மூலத்திலுள்ள இரு வேறு கிரேக்க வெளிப்பாடுகளின் வேறுபாட்டைத் தெளிவாக வைத்திருக்கின்றன.
