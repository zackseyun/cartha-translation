- from: ஆனால் அவர் அவளிடம், “மகளே, உன் விசுவாசம் உன்னைக் காப்பாற்றியிருக்கிறது.[a] சமாதானத்துடன் போ; உன் வாதையிலிருந்து விடுபட்டு நலமாயிரு.[b]” என்றார்.
  to: ஆனால் அவர் அவளிடம், “மகளே, உன் விசுவாசம் உன்னைக் காப்பாற்றியிருக்கிறது.[a] சமாதானத்துடன் போ; உன் வாதையிலிருந்து நலம்பெற்றவளாய் இரு.[b]” என்றார்.
