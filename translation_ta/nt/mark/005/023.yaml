  naturalness: 'A safe correction is needed: «நீர் ... வையும்» is not a grammatical or natural modern Tamil honorific imperative. «நீர் வந்து ... வையுங்கள்» is clear, idiomatic, and preserves the request. «சிறுமகள்» has a more suitable Bible-register dignity than the colloquial «சின்ன மகள்».'
