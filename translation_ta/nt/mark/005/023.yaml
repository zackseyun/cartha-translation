reference: Mark 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: ta
  text: அவர், “என் சிறுமகள் மரணத் தருவாயில் இருக்கிறாள். அவள் காப்பாற்றப்பட்டு[a] உயிர்வாழும்படி, நீர் வந்து அவள்மேல் உமது கைகளை வையுங்கள்” என்று சொல்லி, அவரை மிகவும் மன்றாடினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குணமடைந்து” அல்லது “நலம்பெற்று.” கிரேக்க வினைச்சொல் காப்பாற்றுதல், மீட்டல், அல்லது குணமாக்குதல் என்று பொருள்படலாம்; இங்கு உடனடிச் சூழல் உடல் குணமடைதலைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ
  choice: மன்றாடினார்
  rationale: இந்த அவசரமான வேண்டுகோளின் சூழலில், சாதாரணமாகக் கேட்டுக்கொள்வதைவிட ஆழ்ந்த கெஞ்சுதலைக் குறிக்கிறது.
- source_word: πολλὰ
  choice: மிகவும்
  rationale: παρακαλεῖ என்பதன் தீவிரத்தை வலுப்படுத்துகிறது; மீண்டும் மீண்டும் என்பதைக் கட்டாயப்படுத்தாமல் அதன் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θυγάτριόν
  choice: சின்ன மகள்
  rationale: கிரேக்கச் சொல்லின் சிறுமை/அன்பு நுணுக்கத்தையும் மகளின் இளமையையும் எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐσχάτως ἔχει
  choice: சாகும் தருவாயில் இருக்கிறாள்
  rationale: அவள் மரணத்திற்கு மிக அருகில் இருக்கும் இறுதிக்கட்ட நிலையையும் வேண்டுகோளின் அவசரத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐλθὼν
  choice: வந்து
  rationale: மூலத்தின் வினையெச்ச அமைப்பை இயல்பான தமிழ் தொடர்வினை அமைப்பில் பேணுகிறது.
- source_word: ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: அவள்மேல் உமது கைகளை வையும்
  rationale: இரு கைகளைக் குறிக்கும் பன்மையையும் குணமாக்குதலுடன் தொடர்புடைய தொடுதலையும் நேரடியாகப் பேணுகிறது.
- source_word: σωθῇ
  choice: காப்பாற்றப்பட்டு
  rationale: σῴζω என்பதன் காப்பாற்றுதல், மீட்டல், குணமாக்குதல் ஆகிய பரந்த பொருள் வளத்தை முதன்மை உரையில் சுருக்காமல் பேணுகிறது; உடனடிச் சூழலில் குணமடைதல் என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ζήσῃ
  choice: உயிர்வாழும்படி
  rationale: σωθῇ என்பதன் விளைவாக அவள் தொடர்ந்து உயிருடன் இருப்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: குணமாக்கும் சூழலில் σωθῇ என்பதன் மொழிபெயர்ப்பு
  choice: காப்பாற்றப்பட்டு
  alternative: குணமடைந்து; நலம்பெற்று
  rationale: இந்த வினை உடல் குணமடைதலையும் காப்பாற்றப்படுதல்/மீட்கப்படுதல் என்ற பரந்த கருத்தையும் குறிக்க முடியும். முதன்மை உரை அந்தச் சொற்பொருள் இறுக்கத்தைப் பேணுகிறது; உடல்நலச் சூழலுக்குரிய மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வேண்டுகோளின் தீவிரத்திற்காக ‘மிகவும் மன்றாடினார்’ என்றும், மரண நெருக்கத்திற்காக ‘சாகும் தருவாயில்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை வடிவமான ‘நீர்/உமது/வையும்’ இயேசுவிடம் நேரடியாகப் பேசும் தொனியை இயல்பாகக் காட்டுகிறது.
