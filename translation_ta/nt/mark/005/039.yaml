source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: ta
  text: அவர் உள்ளே சென்று, அவர்களிடம், “நீங்கள் ஏன் அமளி செய்து அழுகிறீர்கள்? குழந்தை இறந்துவிடவில்லை; தூங்கிக்கொண்டிருக்கிறது” என்று சொல்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குழந்தை இறக்கவில்லை; தூங்குகிறது.” வரவிருக்கும் உயிர்த்தெழுப்புதலை முன்னிட்டு, இயேசு மரணத்தை ‘தூக்கம்’ என்று உருவகமாகக் குறிப்பிட்டிருக்கலாம்.
    reason: மூல வினைகளின் காலம் மற்றும் ‘தூக்கம்’ என்ற சொல்லின் சாத்தியமான உருவகப் பயன்பாட்டைத் தெரிவிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: உள்ளே சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கும் இறந்தகால வினையெச்சத்தை, இயல்பான நவீனத் தமிழில் அதன் தொடர்பைப் பேணும் வகையில் மொழிபெயர்க்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தை இறந்தகாலமாக மாற்றாமல் காக்கிறது.
- source_word: Τί
  choice: ஏன்
  rationale: இங்குள்ள கேள்வி இடைச்சொல் காரணத்தை வினவும் கண்டனத் தொனியைக் கொண்டிருப்பதால், தமிழில் ‘ஏன்’ இயல்பாக அதன் பொருளைத் தருகிறது.
- source_word: θορυβεῖσθε
  choice: அமளி செய்து
  rationale: துக்க நிகழ்வில் எழும் இரைச்சலான குழப்பத்தைக் குறிக்கிறது; ‘அமளி’ என்பது பொது மக்களுக்குப் புரியும் இயல்பான சொல்லாகும்.
- source_word: κλαίετε
  choice: அழுகிறீர்கள்
  rationale: அழுகையைக் குறிப்பிடும் நேரடியான, இயல்பான, கண்ணியமான தமிழ் வடிவம்; சடங்குமுறையிலான புலம்பலை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: παιδίον
  choice: குழந்தை
  rationale: சூழலில் பெண் குழந்தை என்பது தெரிந்தாலும், இவ்வசனத்தின் பொதுப்பாலான மூலச்சொல்லை நேரடியாகப் பேணுகிறது.
- source_word: οὐκ ἀπέθανεν
  choice: இறந்துவிடவில்லை
  rationale: இறப்பு நிகழ்ந்துவிட்டது என்பதை மறுக்கும் இறந்தகால வினையின் நிறைவுத் தன்மையையும் அதன் தற்போதைய பொருத்தத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθεύδει
  choice: தூங்கிக்கொண்டிருக்கிறது
  rationale: நிகழ்காலத் தொடர்ச்சியை இயல்பாகத் தருவதோடு, இயேசு பயன்படுத்தும் ‘தூக்கம்’ என்ற உருவக மொழியை விளக்கமாக மாற்றாமல் பேணுகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்று மரணத்தைச் சொல்லாட்சிப்படி மறுக்கிறதா, அல்லது மரணத்தைத் தூக்கமாக உருவகிக்கிறதா என்பது
  choice: ‘குழந்தை இறந்துவிடவில்லை; தூங்கிக்கொண்டிருக்கிறது’ என்ற கூற்றை விளக்கச் சேர்க்கையின்றி முதன்மை உரையில் வைத்தல்
  alternative: ‘குழந்தை நிரந்தரமாக இறந்துவிடவில்லை; தூங்குவது போலவே இருக்கிறது’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை மறுப்பையும் தூக்க உருவகத்தையும் தீர்க்கப்படாத பதற்றத்துடன் முன்வைக்கிறது. வரவிருக்கும் உயிர்த்தெழுப்புதலின் ஒளியில் இதை விளங்கிக்கொள்ளலாம் என்றாலும், மொழிபெயர்ப்பு அந்த விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் இறையியல் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சொல்கிறார்’ என்ற நிகழ்காலம் மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைப் பேணுகிறது; ‘அமளி’ இரைச்சலான துக்கக் குழப்பத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
