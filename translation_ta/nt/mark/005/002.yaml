  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: ta
  text: அவர் படகிலிருந்து இறங்கியதும், அசுத்த ஆவியுடன் இருந்த[a] ஒரு மனிதன் உடனே கல்லறைகளிலிருந்து வந்து அவரை எதிர்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசுத்த ஆவி பிடித்தவன்.” கிரேக்கில் இன்னும் சொற்சொல்லாக, “அசுத்த ஆவியுடன்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: அவர் … இறங்கியதும்
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லுடன் அமைந்த தனிநிலை வேற்றுமைத்தொடரை இயல்பான தமிழ்க் காலவாக்கியமாக மொழிபெயர்க்கிறது; படகிலிருந்து வெளியே வரும் செயலை ‘இறங்குதல்’ தெளிவாகக் கூறுகிறது.
- source_word: πλοίου
  choice: படகு
  rationale: கலிலேயக் கடல் நிகழ்வுச் சூழலில் πλοῖον என்பதற்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் விறுவிறுப்பான கதைநடையைப் பாதுகாக்கும் தெளிவான இணைச்சொல்.
- source_word: ὑπήντησεν αὐτῷ
  choice: வந்து … அவரை எதிர்கொண்டான்
  rationale: ὑπαντάω என்பதன் ‘சந்திக்க வருதல்/எதிர்கொள்ளுதல்’ என்ற இயக்கத்தையும், கல்லறைகளிலிருந்து அவன் வந்ததையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ἐκ τῶν μνημείων
  choice: கல்லறைகளிலிருந்து
  rationale: μνημεῖον இச்சூழலில் அடக்கக் கல்லறையைக் குறிக்கிறது; பன்மையையும் மூலத்தின் ἐκ எனும் புறப்பாட்டுக் கருத்தையும் காக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: சூழலும் இலக்கண ஆண்பால் ஒருமையும் குறிப்பிட்ட ஓர் ஆணைக் காட்டுவதால் பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: அசுத்த ஆவியுடன் இருந்த
  rationale: கிரேக்கத் தொடரின் ‘அசுத்த ஆவியுடன்/அசுத்த ஆவியில்’ என்ற வடிவத்துக்கு நெருக்கமாக இருந்து, ‘ஆவி பிடித்த’ என்ற விளக்கமான கருத்தை முதன்மை உரையில் சேர்க்காமல் தவிர்க்கிறது.
theological_decisions:
- issue: பேய்சார் துன்பநிலையைக் குறிக்கும் மொழிநடை
  choice: அசுத்த ஆவியுடன் இருந்த
  alternative: அசுத்த ஆவி பிடித்த
  rationale: மூலம் நேரடியாக ἐν (‘இல்/உடன்’) என்ற கட்டமைப்பைப் பயன்படுத்துகிறது. ஆகவே உறவின் தன்மையை ‘பிடித்த’ என்று முன்கூட்டியே வரையறுக்காமல், மூலத்தின் பொருளியல் இறுக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ இயேசுவைக் குறிக்கும் மரியாதை ஒருமையாகவும், ‘மனிதன்/எதிர்கொண்டான்’ அந்த ஆணைக் குறிக்கும் இயல்பான ஆண்பால் ஒருமையாகவும் உள்ளன.
