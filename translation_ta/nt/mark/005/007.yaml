source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: ta
  text: 'அவன் உரத்த குரலில் கத்தி, “இயேசுவே, உன்னதமான கடவுளின் மகனே, எனக்கும் உமக்கும் என்ன சம்பந்தம்?[a] கடவுளின் பேரில் உம்மை ஆணையிடுகிறேன்: என்னை வதைக்காதீர்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “எனக்கும் உமக்கும் என்ன?” இது விலகல், மோதல் அல்லது தலையிடாமையை வெளிப்படுத்தும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: உரத்த குரலில் கத்தி
  rationale: வலிமையான கூக்குரலையும், முதன்மை வினைக்கு முன் நிகழும் இறந்தகாலப் பங்கேற்பு வினையின் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγει
  choice: என்றான்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாகவும் தெளிவாகவும் உள்ளது; நிகழ்வின் உயிரோட்டம் ‘கத்தி’ என்பதால் தக்கவைக்கப்படுகிறது.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: உமக்கும் எனக்கும் என்ன தொடர்பு?
  rationale: இது சொற்பொருள் கேள்வி மட்டுமல்ல; விலகல், எதிர்ப்பு அல்லது தலையிடாமை கோரும் செமித்திய மரபுத்தொடர். தமிழ் வாசகருக்கு இயல்பாக அந்தக் கருத்தைத் தெரிவிக்கிறது.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: உன்னதமான கடவுளின் மகனே
  rationale: மகன் என்ற பட்டத்தையும் ὕψιστος என்ற தெய்வீக அடைமொழியையும் வெளிப்படையாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் காக்கிறது.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: கடவுள்மேல் ஆணையிட்டு உம்மிடம் மன்றாடுகிறேன்
  rationale: ὁρκίζω என்பதிலுள்ள ஆணை அல்லது சத்தியத்தின் வலிமையையும், இச்சூழலில் அதற்குள்ள மன்றாட்டுத் தன்மையையும் ஒன்றாகத் தெரிவிக்கிறது; அரிய அல்லது செயற்கையான தமிழைத் தவிர்க்கிறது.
- source_word: μή με βασανίσῃς
  choice: என்னை வதைக்காதீர்
  rationale: βασανίζω குறிக்கும் கடுமையான வேதனைப்படுத்துதலை இயல்பாகத் தருகிறது; வேதனையின் முறையைத் தேவையின்றி குறிப்பாக்கவில்லை.
theological_decisions:
- issue: தீய ஆவி இயேசுவின் அடையாளத்தை ஒப்புக்கொள்ளுதல்
  choice: உன்னதமான கடவுளின் மகனே
  alternative: உன்னத கடவுளின் மகனே
  rationale: வசனத்திலுள்ள கிறிஸ்துவைப் பற்றிய பட்டத்தை குறைக்காமலும், பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் வெளிப்படையாகக் காக்கிறது.
- issue: தீய ஆவி கடவுளைக் கொண்டு இயேசுவிடம் வேண்டுவதில் உள்ள ὁρκίζω என்பதன் வலிமை
  choice: கடவுள்மேல் ஆணையிட்டு உம்மிடம் மன்றாடுகிறேன்
  alternative: கடவுளை முன்னிட்டு உம்மை ஆணையிடுகிறேன்
  rationale: தீய ஆவி கடவுளை முன்னிறுத்தி இயேசுவிடம் பேசுவதிலுள்ள வியப்பூட்டும் இறையியல் பதற்றத்தை வெறும் சாதாரண வேண்டுகோளாக மாற்றாமல் காக்கிறது; அதேவேளை சூழலின் மன்றாட்டுத் தன்மையையும் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது; இது கிரேக்கத்தில் இல்லாத கூடுதல் கிறிஸ்துவியல் கருத்தைச் சேர்ப்பதற்காக அல்ல, இயல்பான தமிழ் உரையாடல் மரபுக்காக மட்டுமே. ‘கடவுள்’ என்பது θεός என்பதற்கான பரவலாகப் புரியும் நவீனத் தமிழ் சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
