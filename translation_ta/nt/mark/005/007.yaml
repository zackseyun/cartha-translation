- from: அவன் உரத்த குரலில் கத்தி, “இயேசுவே, உன்னதமான கடவுளின் மகனே, உமக்கும் எனக்கும் என்ன தொடர்பு?[a] கடவுள்மேல் ஆணையிட்டு உம்மிடம் மன்றாடுகிறேன்:[b] என்னை வதைக்காதீர்” என்றான்.
  to: 'அவன் உரத்த குரலில் கத்தி, “இயேசுவே, உன்னதமான கடவுளின் மகனே, எனக்கும் உமக்கும் என்ன சம்பந்தம்?[a] கடவுளின் பேரில் உம்மை ஆணையிடுகிறேன்: என்னை வதைக்காதீர்” என்றான்.'
  rationale: 'The revision restores the source construction’s direct, solemn force: the speaker adjures Jesus by God and then asks not to be tormented. It also makes the Tamil dissociation idiom slightly more concise. Footnote b retains the contextual ‘implore’ possibility without placing that interpretive blend in the primary text.'
