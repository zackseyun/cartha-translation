language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: ta
  text: உடனே இயேசு, தம்மிடமிருந்து வல்லமை வெளியேறியதைத் தமக்குள் உணர்ந்து, கூட்டத்தினிடையே திரும்பி, “என் உடைகளைத் தொட்டது யார்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் விரைவான கதைநகர்வை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: தமக்குள் உணர்ந்து
  rationale: இயேசுவின் உள்ளார்ந்த, தெளிவான அறிதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν
  choice: தம்மிடமிருந்து வல்லமை வெளியேறியதை
  rationale: வல்லமை உண்மையாக அவரிடமிருந்து புறப்பட்டதாகக் கூறும் கிரேக்கச் சொல்லமைப்பை, அதன் செயல்முறையை விளக்கிச் சேர்க்காமல் காக்கிறது.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: கூட்டத்தினிடையே திரும்பி
  rationale: கூட்டத்தின் மத்தியில் இயேசு உடலால் திரும்பிய செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔλεγεν
  choice: என்று கேட்டார்
  rationale: வடிவில் ‘சொன்னார்’ என்றாலும் நேரடி உரை ஒரு கேள்வி என்பதால் தமிழில் ‘கேட்டார்’ என்பது இயல்பான உரையாடல் அறிமுகம்.
- source_word: Τίς μου ἥψατο τῶν ἱματίων;
  choice: என் உடைகளைத் தொட்டது யார்?
  rationale: ἱμάτια என்பதன் பன்மையையும் ἅπτομαι என்பதன் பொதுவான ‘தொடு’ பொருளையும் காக்கிறது; ‘உடைகள்’ நவீனத் தமிழில் தெளிவானது.
theological_decisions:
- issue: இயேசுவிடமிருந்து வல்லமை வெளியேறியதை அவர் உணர்ந்தார் என்ற விவரிப்பு
  choice: வல்லமை தம்மிடமிருந்து வெளியேறியதை இயேசு உணர்ந்ததாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘குணமாக்கும் வல்லமை’ என்று விளக்கமாகச் சேர்த்தல் அல்லது அதை வெறும் உள்ளுணர்வாகத் தளர்த்துதல்
  rationale: மூலவாக்கியம் வல்லமை வெளியேறியதாக நேரடியாகக் கூறுகிறது; ‘குணமாக்கும்’ என்ற விளக்கத்தைச் சேர்க்காமலும் நிகழ்வை உருவகமாக்காமலும் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடிய, கண்ணியமான நடையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத அடிக்குறிப்பு சேர்க்கப்படவில்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு அதன் குறியீடும் உரையும் ஒன்றுக்கொன்று பொருந்தாததால் பின்பற்றப்படவில்லை.
