source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: ta
  text: தொலைவிலிருந்து இயேசுவைக் கண்டு, அவன் ஓடி அவர்முன் பணிந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை வழிபட்டான்”; அல்லது, “அவருக்கு மரியாதை செலுத்தினான்.” கிரேக்க வினைச்சொல் சூழலைப் பொறுத்து வழிபடுவதையோ, முன் விழுந்து பணிவதையோ, மரியாதை செலுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டதும்
  rationale: ὁράω என்பதன் இறந்தகாலப் பங்கேற்புவினை இங்கு முதன்மைச் செயலுக்கு முன் நிகழ்ந்ததைச் சுட்டுகிறது. ‘கண்டதும்’ என்பது அந்த நிகழ்வுத் தொடரையும் உடனடித் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀπὸ μακρόθεν
  choice: தொலைவிலிருந்து
  rationale: இது இடத்தால் உள்ள தூரத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔδραμεν
  choice: ஓடிவந்து
  rationale: τρέχω என்பதன் அடிப்படைப் பொருளான ஓடுதலைக் காக்கிறது; அடுத்த செயலை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாக இணைக்க ‘வந்து’ சேர்க்கப்பட்டுள்ளது, ஆனால் கூடுதல் தீவிரம் சேர்க்கப்படவில்லை.
- source_word: προσεκύνησεν αὐτόν
  choice: அவர்முன் பணிந்தான்
  rationale: προσκυνέω வழிபடுதல், மரியாதை செலுத்துதல், அல்லது முன் விழுந்து பணிதல் ஆகிய பொருள் நிழல்களைக் கொள்ளலாம். ‘அவர்முன் பணிந்தான்’ காணக்கூடிய செயலைத் தெரிவித்து, அது முழுமையான வழிபாடா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: καὶ
  choice: —
  rationale: வசனத் தொடக்க இணைப்பைத் தமிழில் தனி ‘மற்றும்’ எனக் கொடுப்பது இயல்பற்றதாக இருக்கும்; வாக்கியத்தின் தொடர்ச்சியான அமைப்பிலேயே மார்க்குவின் கதை ஓட்டம் வெளிப்படுகிறது.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவை
  rationale: நேரடி செயப்படுபொருளாக இயேசுவின் பெயர் தமிழின் ‘ஐ’ வேற்றுமை உருபுடன் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: προσεκύνησεν என்பது இயேசுவை வெளிப்படையாக ‘வழிபட்டான்’ என்று மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: முதன்மை உரையில் ‘அவர்முன் பணிந்தான்’
  alternative: ‘அவரை வழிபட்டான்’ அல்லது ‘அவருக்கு மரியாதை செலுத்தினான்’
  rationale: மூல வினைச்சொல் வழிபாட்டையும் பணிந்து வணங்குதல் அல்லது மரியாதை செலுத்துதல் போன்ற செயல்களையும் குறிக்கக்கூடும். இச்சூழலில் ‘வழிபட்டான்’ என்று மட்டும் கொடுத்தால் மூலத்தில் உள்ள பொருள் விரிவை முன்கூட்டியே குறுக்கிவிடும்; ஆகவே காணக்கூடிய செயல் முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மரியாதை ஒருமையைப் பயன்படுத்தி இயேசுவை ‘அவர்’ என்று குறிப்பிடுகிறது. மூலத்தின் செயல் வரிசை ‘கண்டதும், ஓடிவந்து… பணிந்தான்’ எனத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
