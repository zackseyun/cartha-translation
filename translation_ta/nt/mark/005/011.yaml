  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: ta
  text: அங்கே மலையருகே[a] ஒரு பெரிய பன்றிக்கூட்டம் மேய்ந்துகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மலையோரத்தில்.’ கிரேக்கச் சொற்றொடர் மலையின் அருகில் அல்லது அதன் பக்கத்தில் இருந்த இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: இருந்தது
  rationale: ἦν இருப்பைக் குறிக்கிறது; δέ மென்மையான கதைத் தொடர்ச்சி இணைப்பாக இருப்பதால், இயல்பான தமிழில் தனிச் சொல்லாக வெளிப்படுத்தப்படாமல் வாக்கிய ஓட்டத்தில் உணர்த்தப்படுகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் வினையடை; நவீனத் தமிழில் நேரடியான, இயல்பான இணைச்சொல்.
- source_word: πρὸς τῷ ὄρει
  choice: மலையருகே
  rationale: இங்கு πρός + வேற்றுமை வடிவம் மலையின் அருகாமை அல்லது பக்கத்திலுள்ள இடத்தைக் குறிக்கிறது; தேவையற்ற துல்லியத்தைச் சேர்க்காமல் இதை இயல்பாகத் தருகிறது.
- source_word: ἀγέλη χοίρων
  choice: பன்றிக்கூட்டம்
  rationale: ἀγέλη விலங்குகளின் கூட்டத்தைக் குறிக்கிறது; χοίρων அந்தக் கூட்டம் பன்றிகளால் ஆனது என்பதைத் தெரிவிக்கிறது. தமிழில் இவை இயல்பாக ஒரே கூட்டுச்சொல்லால் வழங்கப்படுகின்றன.
- source_word: μεγάλη
  choice: பெரிய
  rationale: கூட்டத்தின் அளவு அல்லது எண்ணிக்கை மிகுதியை இயல்பாகக் குறிக்கிறது.
- source_word: βοσκομένη
  choice: மேய்ந்துகொண்டிருந்தது
  rationale: நிகழ்ந்துகொண்டிருந்த உணவுண்ணும் செயலைத் தொடர்நிலை வடிவில் காட்டுகிறது; கால்நடைக் கூட்டத்தைப் பற்றிய சூழலில் இது இயல்பான தமிழ்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பன்றிக்கூட்டம்’ என்பது ‘பன்றிகளின் கூட்டம்’ என்பதைக் காட்டிலும் இயல்பான சுருக்கமான வடிவம்; மூலத்தின் பொருள் முழுமையாகப் பாதுகாக்கப்படுகிறது.
