    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்…
  rationale: கிரேக்க இணைப்புச்சொல் தொடரும் கதைநடையை இணைக்கிறது. தனித்த வசனமாக இயல்பான தமிழில் தேவையற்ற ‘மேலும்’ என்பதைக் கூட்டாமல், வாக்கியத் தொடர்ச்சியால் அதன் பணியை வெளிப்படுத்துகிறது.
- source_word: περιεβλέπετο
  choice: சுற்றிலும் பார்த்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து சுற்றிலும் நோக்கிய செயலைக் காட்டுகிறது; ‘பார்த்துக்கொண்டிருந்தார்’ அதன் நீடித்த தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: ἰδεῖν
  choice: காண
  rationale: இங்கு இது நோக்கத்தைக் குறிக்கும் வினையெச்சமாக உள்ளது; ‘காண’ என்பது நேரடியும் இயல்பானதும் ஆகும்.
- source_word: τὴν … ποιήσασαν
  choice: செய்தவளை
  rationale: பெண்பால் சுட்டும் பெயரெச்சத்தைத் தமிழின் ‘வள்’ பெண்பால் விகுதி துல்லியமாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘பெண்’ என்ற பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
- source_word: τοῦτο
  choice: இதை
  rationale: முந்தைய நிகழ்வைச் சுட்டும் demonstrative pronoun-ஐச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
