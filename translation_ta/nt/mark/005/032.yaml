  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையான கதைநடைப் பாணியிலும் வடிவமைக்கப்பட்டது. நீடித்த செயல் ‘பார்த்துக்கொண்டிருந்தார்’ என்பதால் வெளிப்படுகிறது; பெண்பால் குறிப்பு ‘செய்தவள்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
