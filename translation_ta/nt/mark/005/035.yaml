source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: ta
  text: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே, தொழுகைக்கூடத் தலைவரின் வீட்டிலிருந்து[a] சிலர் வந்து, “உங்கள் மகள் இறந்துவிட்டாள். ஆசிரியரை இனியும் ஏன் தொந்தரவு செய்கிறீர்கள்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘தொழுகைக்கூடத் தலைவரிடமிருந்து.’ சூழலில் இது அவரது வீட்டிலிருந்து வந்தவர்களைக் குறிக்கிறது.'
    reason: மூலத்தின் சுருக்கமான சொற்றொடரையும் மொழிபெயர்ப்பில் வெளிப்படுத்தப்பட்ட சூழல்சார் பொருளையும் காட்டுதல்.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: முதன்மை நிகழ்வுடன் ஒரே நேரத்தில் தொடர்ந்த செயலைக் குறிக்கும் genitive absolute அமைப்பையும் ἔτι என்பதன் ‘இன்னும்’ என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔρχονται
  choice: சிலர் வந்து
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலத் தொடராக வழங்குகிறது. பன்மை வினைச்சொல் குறிப்பிடும் நபர்களைத் தமிழில் வெளிப்படையாகக் காட்ட ‘சிலர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: யூதத் தொழுகைக்கூடத் தலைவரின் வீட்டிலிருந்து
  rationale: சூழலில் தலைவர் இயேசுவுடன் இருப்பதால், இந்தச் சுருக்கமான கிரேக்கச் சொற்றொடர் அவரது வீட்டார் அல்லது வீட்டிலிருந்து வந்தவர்களைக் குறிக்கிறது. ‘வீட்டிலிருந்து’ என்பது இலக்கு மொழியில் தவறான புரிதலைத் தவிர்க்கும் சூழல்சார் வெளிப்படுத்தல்; அடிச்சொல் வடிவம் குறிப்பில் தரப்படுகிறது.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: உங்கள் மகள் இறந்துவிட்டாள்
  rationale: ἀπέθανεν குறிக்கும் நிறைவுற்ற மரணத்தையும் அதன் உடனடி தற்போதைய விளைவையும் ‘இறந்துவிட்டாள்’ இயல்பாகத் தெரிவிக்கிறது; மரியாதை ஒருமையாக ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τί ἔτι σκύλλεις
  choice: இனியும் ஏன் தொந்தரவு செய்கிறீர்கள்?
  rationale: τί ἔτι என்பதன் ‘இனிமேலும் ஏன்?’ என்ற கேள்வியையும், இச்சூழலில் σκύλλω என்பதன் ஒருவர்மீது சிரமத்தைச் சுமத்துதல் அல்லது தொந்தரவு செய்தல் என்ற பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: τὸν διδάσκαλον
  choice: போதகரை
  rationale: διδάσκαλος என்பதன் கற்பிப்பவர் என்ற பொருளை மதச்சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; பெயரான ‘இயேசு’ என்று விரிவாக்காமல் பேசியவர்களின் பட்டத்தையே காக்கிறது.
theological_decisions:
- issue: ‘போதகர்’ யாரைக் குறிக்கிறது என்பதைக் கையாளுதல்
  choice: கிரேக்கத்தில் உள்ள பட்டத்தைப் போலவே ‘போதகர்’ என்று மொழிபெயர்த்து, ‘இயேசு’ என்று பெயரைச் சேர்க்கவில்லை.
  alternative: ‘இயேசுவை’ அல்லது ‘ஆண்டவரை’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: பேசுகிறவர்கள் இயேசுவைப் பற்றிப் பயன்படுத்தும் பட்டத்தை மூல உரை அப்படியே வைக்கிறது. பெயரையோ அதிகமான அதிகாரம் அல்லது கிறிஸ்தவ அறிக்கையைக் குறிக்கும் பட்டத்தையோ சேர்ப்பது, உரையில் வெளிப்படையாக இல்லாத கிறிஸ்தியல் நுணுக்கத்தை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யூதத் தொழுகைக்கூடம்’ என்பது ‘ஜெப ஆலயம்’ போன்ற சபைச்சார் சொல்லைவிட முதல் நூற்றாண்டு யூதச் சூழலைத் தெளிவுபடுத்துகிறது. உரையாடலில் யவீருவைக் குறிக்கும் ஒருமைக்கு மரியாதைப் பன்மை வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
