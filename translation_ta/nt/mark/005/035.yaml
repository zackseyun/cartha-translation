revisions:
- from: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே, யூதத் தொழுகைக்கூடத் தலைவரின் வீட்டிலிருந்து[a] சிலர் வந்து, “உங்கள் மகள் இறந்துவிட்டாள். போதகரை இனியும் ஏன் தொந்தரவு செய்கிறீர்கள்?” என்றார்கள்.
  to: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே, தொழுகைக்கூடத் தலைவரின் வீட்டிலிருந்து[a] சிலர் வந்து, “உங்கள் மகள் இறந்துவிட்டாள். ஆசிரியரை இனியும் ஏன் தொந்தரவு செய்கிறீர்கள்?” என்றார்கள்.
