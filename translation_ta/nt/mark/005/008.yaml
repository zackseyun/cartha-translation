  terminology: ‘அசுத்த ஆவி’ faithfully retains the Gospel’s specific expression ‘unclean spirit’ without interpretive substitution. The respectful verb for Jesus is suitable. The footnote responsibly retains the possible ambiguity of αὐτῷ without making a doctrinal claim.
