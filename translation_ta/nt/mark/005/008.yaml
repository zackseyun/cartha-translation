  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: ta
  text: ஏனெனில் அவர் அவனிடம்[a], “அசுத்த ஆவியே, மனிதனைவிட்டு வெளியே வா” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனிடம்’ என்பதற்கு ‘அதனிடம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பிரதிப்பெயர் மனிதனையோ அசுத்த ஆவியையோ குறிக்கக்கூடியது; தொடர்ந்து வரும் சொற்கள் அசுத்த ஆவியை நேரடியாக விளித்துக் கட்டளையிடுகின்றன.
    reason: referent_ambiguity
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: இறந்தகால நிறைவுறா வினை வடிவம், கடந்த காலத்தில் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது. ‘சொன்னார்’ என்பதைவிட ‘சொல்லிக்கொண்டிருந்தார்’ அந்தத் தொடர்ச்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கப் பின்னணியை γάρ வழங்குகிறது; ‘ஏனெனில்’ அதன் இணைப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: கதைச் சூழலில் ஆவி பிடித்திருந்த மனிதனை உடனடி உரையாடல் சார்பாகக் குறிக்கிறது; கட்டளை அவனுக்குள் இருந்த அசுத்த ஆவியை நோக்கியது.
- source_word: Ἔξελθε
  choice: வெளியே வா
  rationale: இது நேரடியான ஒருமை கட்டளை. மனிதனுக்குள் இருந்து வெளியேறுமாறு ஆவிக்குக் கட்டளையிடும் சூழலில் ‘வெளியே வா’ இயல்பான தமிழாகும்.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: அசுத்த ஆவியே
  rationale: கிரேக்கத்தில் உருபுடன் எழுவாய் வடிவில் இருந்தாலும், இங்கு அது நேரடி விளியாகச் செயல்படுகிறது. தமிழ் விளி உருபான ‘-ஏ’ இதைத் தெளிவாகக் காட்டுகிறது; ‘தீய ஆவி’ என்று பொருள் விரிவாக்கப்படவில்லை.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: இந்த மனிதனைவிட்டு
  rationale: ἐκ என்பது உள்ளிருந்து வெளியேறும் இயக்கத்தைக் குறிக்கிறது. குறிப்பிட்ட மனிதனைச் சூழல் சுட்டுவதால் ‘இந்த மனிதனைவிட்டு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: பேயோட்டும் சூழலில் πνεῦμα ἀκάθαρτον என்பதன் மொழிபெயர்ப்பு
  choice: அசுத்த ஆவி
  alternative: தீய ஆவி
  rationale: மூலத்தில் ‘அசுத்த ஆவி’ என்றே உள்ளது; ‘தீய ஆவி’ என்பது விளக்க விரிவாக்கமாகி, அசுத்தம் சார்ந்த மூலச் சொல்லின் நுண்பொருளை மறைக்கக்கூடும்.
- issue: கட்டளையின் நேரடி பெறுநர்
  choice: ‘அசுத்த ஆவியே’ என்ற நேரடி விளி
  alternative: ‘அசுத்த ஆவி வெளியே வரட்டும்’ என்ற மறைமுகக் கூற்று
  rationale: τὸ πνεῦμα τὸ ἀκάθαρτον வடிவத்தில் எழுவாய்போல் தோன்றினாலும், கட்டளைக்குப் பின் நேரடி விளியாகச் செயல்படுகிறது; ஆகவே தமிழிலும் நேரடி அழைப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. இயேசுவைக் குறிக்கும் வினையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘அசுத்த ஆவி’ என்ற மூலத்திற்கு நெருக்கமான வழக்குச் சொல் தக்கவைக்கப்பட்டுள்ளது.
