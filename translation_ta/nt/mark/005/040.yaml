source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: ta
  text: அவர்கள் அவரைப் பார்த்து ஏளனமாகச் சிரித்துக்கொண்டிருந்தார்கள்[a]. அவரோ, எல்லாரையும் வெளியே அனுப்பிவிட்டு, குழந்தையின் தந்தையையும் தாயையும் தம்முடன் இருந்தவர்களையும்[b] அழைத்துக்கொண்டு, குழந்தை இருந்த இடத்திற்குள் செல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் கேலி செய்துகொண்டிருந்தார்கள்.” கிரேக்க வினைச்சொல் இகழ்ச்சியாகச் சிரிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவருடன் வந்திருந்த சீடர்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: ஏளனமாகச் சிரித்துக்கொண்டிருந்தார்கள்
  rationale: வினைச்சொல் இகழ்ச்சியான சிரிப்பைக் குறிக்க முடியும்; இறந்தகாலத் தொடர்நிலை வடிவம் கிரேக்க முற்றுப்பெறா இறந்தகாலத்தின் நீடித்த செயல் நயத்தை வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ
  choice: அவரைப் பார்த்து
  rationale: καταγελάω என்பதுடன் வரும் கிரேக்க வேற்றுமை ‘அவரைப் பார்த்து/அவரைக் குறித்து சிரித்தல்’ என்ற பொருளைத் தருகிறது; இது இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: ἐκβαλὼν πάντας
  choice: எல்லாரையும் வெளியே அனுப்பிவிட்டு
  rationale: முதன்மைச் செயல்களுக்கு முன் கூட்டத்தை வெளியேற்றியதைக் குறிக்கிறது. ‘துரத்திவிட்டு’ என்பது தேவையற்ற கடுமையையோ பேயோட்டும் சொல்லாட்சியையோ உணர்த்தக்கூடும்.
- source_word: παραλαμβάνει
  choice: அழைத்துக்கொண்டு
  rationale: தேர்ந்தெடுக்கப்பட்டவர்களைத் தம்முடன் கூட்டிச் செல்வதே சூழலின் பொருள். நிகழ்கால வடிவம் மாற்குவின் வரலாற்று நிகழ்காலக் கதைநயத்தைப் பேணுகிறது.
- source_word: παιδίου / παιδίον
  choice: குழந்தை
  rationale: சூழலில் யவீருவின் மகள் என்று தெரிந்தாலும், இவ்வசனத்தில் உள்ள நடுநிலைப் பொருளுடைய παιδίον என்பதைக் கூடுதல் குறிப்பின்றி பிரதிபலிக்கிறது.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: தம்முடன் இருந்தவர்களை
  rationale: இயேசுவுடன் வந்திருந்தவர்களைக் குறிக்கும் கிரேக்கச் சொற்றொடரை முதன்மை உரையில் அவர்களின் அடையாளத்தை மிகையாகக் குறிப்பிடாமல் வெளிப்படுத்துகிறது.
- source_word: εἰσπορεύεται
  choice: இடத்திற்குள் செல்கிறார்
  rationale: குழந்தை இருந்த அறை அல்லது இடத்திற்குள் நுழைவதைக் குறிக்கிறது; நிகழ்காலம் கிரேக்க வரலாற்று நிகழ்காலத்தைப் பேணுகிறது.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: குழந்தை இருந்த இடம்
  rationale: கிரேக்கம் இருப்பிடத்தை மட்டுமே கூறுகிறது; ‘படுத்திருந்த’ என்று உரையில் இல்லாத உடல்நிலையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கதைசொல்லலில் காலமும் உயிரோட்டமும்
  choice: 'முதன்மை வினைகளை வரலாற்று நிகழ்காலத்தில் வழங்குதல்: ‘அழைத்துக்கொண்டு ... செல்கிறார்’'
  alternative: 'எல்லாவற்றையும் இறந்தகாலமாக வழங்குதல்: ‘அழைத்துக்கொண்டு ... சென்றார்’'
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலம் காட்சியின் உயிரோட்டத்தைத் தருகிறது; நவீன தமிழிலும் இவ்வகைக் கதைசொல்லல் இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரோ’ என்பது αὐτός δέ-யின் எதிர்மறைத் திருப்பத்தையும் வலியுறுத்தலையும் வெளிப்படுத்துகிறது; ‘தம்முடன்’ என்பது எழுவாயாகிய இயேசுவையே தெளிவாகச் சுட்டுகிறது.
