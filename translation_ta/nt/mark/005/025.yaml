  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: ta
  text: மேலும், பன்னிரண்டு ஆண்டுகளாக இரத்தப்போக்கால் அவதிப்பட்டு வந்த ஒரு பெண் இருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தக் கசிவால்” அல்லது “தொடர்ந்த இரத்தப்போக்கால்.”
    reason: ῥύσις αἵματος என்ற சொற்றொடருக்குச் சாத்தியமான இயல்பான தமிழாக்கங்களைப் பதிவு செய்யும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: καὶ
  choice: அங்கே ... இருந்தாள்
  rationale: கிரேக்கத்தில் இது வழக்கமான கதைத் தொடரிணைப்பு. முந்தைய நிகழ்வோடு தொடர்பைத் தக்கவைத்தபடியே, தமிழில் புதிய பாத்திரத்தை இயல்பாக அறிமுகப்படுத்த ‘அங்கே ... இருந்தாள்’ என்ற அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: முதன்முறையாக அறிமுகமாகும் நபரைத் தமிழில் இயல்பாகக் குறிக்க ‘ஒரு பெண்’ பொருத்தமானது.
- source_word: οὖσα
  choice: அவதிப்பட்டுவந்த
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘இருந்தவள்’ என்பதாக இருந்தாலும், இங்கு நீடித்த உடல்நிலையையும் பன்னிரண்டு ஆண்டுகள் என்ற கால அளவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ῥύσει αἵματος
  choice: இரத்தப்போக்கால்
  rationale: இந்தச் சொற்றொடர் இரத்தம் தொடர்ந்து வெளியேறும் உடல்நிலையைக் குறிக்கிறது. ‘இரத்தப்போக்கு’ என்பது நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: δώδεκα ἔτη
  choice: பன்னிரண்டு ஆண்டுகளாக
  rationale: கால நீட்சியைக் குறிக்கும் கிரேக்க வேற்றுமையின் பொருளைத் தமிழில் ‘ஆண்டுகளாக’ தெளிவாகத் தெரிவிக்கிறது.
