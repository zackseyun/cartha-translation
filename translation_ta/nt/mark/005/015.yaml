id: MRK.5.15
reference: Mark 5:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: ta
  text: அவர்கள் இயேசுவிடம் வந்து, பேய் பிடித்திருந்த அந்த மனிதன்—லேகியோன்[a] எனப்பட்ட பேய்க்கூட்டம் பிடித்திருந்தவன்—உடையணிந்து, தெளிந்த மனதுடன் உட்கார்ந்திருப்பதைக் கண்டார்கள்; அவர்கள் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லேகியோன்” என்பது ஒரு ரோமப் படையணியைக் குறிக்கும் சொல்; இங்கே முந்தைய வசனத்தில் பேய்கள் தங்களுக்குக் கூறிய பெயரையோ, அவற்றின் பெருந்திரளையோ குறிக்கலாம்.
    reason: பெயர்போன்ற வாசிப்புக்கும் படையணி என்ற அடிப்படைப் பொருளுக்கும் இடையிலான உண்மையான நுணுக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἔρχονται
  choice: வந்து
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தமிழின் இயல்பான கதைநடையில் இறந்தகாலத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: θεωροῦσιν
  choice: கண்டார்கள்
  rationale: இது கவனித்துப் பார்ப்பதைக் குறிக்கும் மற்றொரு வரலாற்று நிகழ்காலம்; காட்சியை இயல்பாகத் தெரிவிக்க ‘கண்டார்கள்’ பொருத்தமானது.
- source_word: δαιμονιζόμενον
  choice: பேய் பிடித்திருந்த அந்த மனிதன்
  rationale: சூழலில் ஏற்கெனவே அறிமுகமான மனிதனையும் அவனுடைய உண்மையான பேய் ஆட்கொள்ளுதலையும் தெளிவாகக் குறிக்கிறது; தற்போதைய மீட்சியைக் கருத்தில் கொண்டு ‘பிடித்திருந்த’ என இறந்த நிலை காட்டப்படுகிறது.
- source_word: καθήμενον
  choice: உட்கார்ந்திருப்பதை
  rationale: அவர்கள் கண்டபோது அவன் இருந்த கண்கூடான நிலையைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: ἱματισμένον
  choice: உடையணிந்து
  rationale: முன்னைய நிர்வாண நிலைக்கு மாறாக, இப்போது ஆடை அணிந்திருந்த மீட்கப்பட்ட நிலையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: σωφρονοῦντα
  choice: தெளிந்த மனதுடன்
  rationale: மனத் தெளிவும் தன்னடக்கமும் மீண்டிருந்ததை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; மருத்துவ நோயறிதலாகச் சுருக்கவில்லை.
- source_word: ἐσχηκότα
  choice: தன்னுள் கொண்டிருந்தவன்
  rationale: முன்னர் அவனை அடையாளப்படுத்திய நிலையைக் குறிக்கும் கிரேக்க நிறைவுக்காலப் பங்கேற்பெயரின் பின்னோக்கிய தன்மையை ‘இருந்த’ தெளிவாக்குகிறது.
- source_word: λεγιῶνα
  choice: அந்த லேகியோனை
  rationale: முந்தைய வசனத்தில் பேய்கள் தங்களை அழைத்துக்கொண்ட ‘லேகியோன்’ என்ற அடையாளத்தைக் குறிக்கிறது; எண்ணற்ற பேய்களின் கூட்டத்தையும் பெயர்போன்ற பயன்பாட்டையும் தக்கவைக்க ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: ἐφοβήθησαν
  choice: பயந்தார்கள்
  rationale: அவர்கள் அடைந்த அச்சத்தை மிகைப்படுத்தாமல் இயல்பான எளிய இறந்தகாலத்தில் தெரிவிக்கிறது.
theological_decisions:
- issue: பேய் ஆட்கொள்ளுதலின் விளக்கம்
  choice: பேய் பிடித்திருந்த அந்த மனிதன்
  alternative: பேயால் ஆட்கொள்ளப்பட்டிருந்த மனிதன்
  rationale: உரை கூறும் அமானுஷ்ய ஆட்கொள்ளுதலை வெறும் மனநோயாக மாற்றாமல் தக்கவைக்கிறது; அதே நேரத்தில் சாதாரண வாசகர்களுக்குப் புரியும் மொழியைப் பயன்படுத்துகிறது.
- issue: λεγιών என்பது பெயரா அல்லது விளக்கப் designation-ஆ
  choice: லேகியோன்
  alternative: படையணி
  rationale: சூழலில் இது பேய்களின் முந்தைய சுயஅடையாளத்தைத் திரும்பச் சுட்டுகிறது. பெயர்போன்ற தன்மையை ஒலிபெயர்ப்பு தக்கவைக்கிறது; அதன் ரோமப் படையணி சார்ந்த அடிப்படைப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: ἐσχηκότα குறிக்கும் காலநிலை
  choice: கொண்டிருந்தவன்
  alternative: கொண்டவன்
  rationale: அந்த நிலை பார்ப்பதற்கு முன் இருந்தது, இப்போது நீங்கியுள்ளது என்பதைத் தமிழ் வாசகருக்குத் தெளிவாக்குகிறது; கிரேக்க நிறைவுக்காலத்தின் தொடர்ந்த அடையாளப் பொருத்தமும் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. வரலாற்று நிகழ்காலங்கள் தமிழில் இயல்பான இறந்தகாலத் தொடராக வழங்கப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘அங்கே’ சேர்க்கப்படவில்லை. ‘லேகியோன்’ பெயர்போன்ற ஒலிபெயர்ப்பாக வைக்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
