source:
  edition: SBLGNT
  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: ta
  text: அவன் இரவும் பகலும் இடைவிடாமல் கல்லறைகளிலும் மலைகளிலும் கூக்குரலிட்டுக்கொண்டும், கற்களால் தன்னையே கீறிக்கொண்டும் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் கூக்குரலிட்டுக்கொண்டும், கற்களால் தன்னையே வெட்டிக் காயப்படுத்திக்கொண்டும் இருந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: இரவும் பகலும் இடைவிடாமல்
  rationale: διά + genitive கொண்ட இத்தொடர் முழுக் காலப்பரப்பிலும் தொடரும் செயலைக் குறிக்கிறது; இந்தத் தமிழ் அமைப்பு காலத்தையும் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μνήμασιν
  choice: கல்லறைகளில்
  rationale: μνῆμα என்பது அடக்கம் செய்யப்பட்ட இடம் அல்லது கல்லறையைக் குறிக்கிறது; பாறையில் வெட்டப்பட்ட அடக்க இடங்களையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ்ச் சொல் இது.
- source_word: ὄρεσιν
  choice: மலைகளில்
  rationale: ὄρος என்பதன் நேரடியான பொருள் ‘மலை’; நிலப்பரப்பை ‘குன்றுகள்’ என மென்மையாக்காமல் மூலத்தின் சொல்லாட்சியைப் பேணுகிறது.
- source_word: ἦν κράζων
  choice: கூக்குரலிட்டுக்கொண்டும் ... இருந்தான்
  rationale: இறந்தகாலத்தில் நீடித்த செயலைக் காட்டும் சுற்றுவினை அமைப்பைத் தமிழில் தொடர்ச்சியான செயல்வடிவத்தால் வெளிப்படுத்துகிறது.
- source_word: κατακόπτων ἑαυτὸν
  choice: தன்னையே கீறிக்கொண்டும்
  rationale: κατακόπτω அடித்தல் அல்லது வெட்டிக் காயப்படுத்துதல் என்ற வலுவான பொருளைக் கொண்டது. கற்களை கருவியாகப் பயன்படுத்தும் சூழலில் ‘கீறிக்கொண்டு’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; செயலின் தீவிரம் பற்றிய மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λίθοις
  choice: கற்களால்
  rationale: இங்குள்ள வேற்றுமை கருவிப்பொருளைக் குறிக்கிறது; ‘கற்களால்’ என்பது அதற்கான சுருக்கமான இயல்பான தமிழ் வடிவம்.
