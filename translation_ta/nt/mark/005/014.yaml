translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்கு எளிதில் புரியும், மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியை அரைப்புள்ளி மூலம் காத்து, தேவையற்ற சமய மரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
