source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: ta
  text: அவற்றை மேய்த்துக்கொண்டிருந்தவர்கள் தப்பி ஓடி, நகரத்திலும் நாட்டுப்புறப் பகுதிகளிலும்[a] அதைத் தெரிவித்தார்கள்; நடந்தது என்னவென்று பார்க்க மக்கள் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயல்வெளிகளிலும்.” இவ்வாறு மொழிபெயர்ப்பது கிரேக்கச் சொல்லுக்கு இன்னும் நேரடியானது; ஆனால் இங்கு அது நகரத்தைச் சுற்றியுள்ள நாட்டுப்புறப் பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: மேய்த்துக்கொண்டிருந்தவர்கள்
  rationale: பன்றிக் கூட்டத்தைப் பராமரித்து மேய்த்தவர்களைக் குறிக்கும் பங்கேற்புவினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτούς
  choice: அவற்றை
  rationale: முந்தைய வசனத்திலுள்ள பன்றிகளைக் குறிக்கும் கிரேக்கப் பதிலிடுபெயரைத் தமிழிலும் பதிலிடுபெயராகவே வைத்திருக்கிறது.
- source_word: ἔφυγον
  choice: தப்பி ஓடி
  rationale: திடீரென அங்கிருந்து ஓடிப்போனதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπήγγειλαν
  choice: அதைத் தெரிவித்தார்கள்
  rationale: நிகழ்ந்ததைச் செய்தியாக எடுத்துரைத்தார்கள் என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: εἰς τὴν πόλιν
  choice: நகரத்தில்
  rationale: அவர்கள் செய்தியை அறிவித்த இடத்தைக் குறிக்கும் வகையில் கிரேக்க முன்னிடைச்சொல்லை இயல்பான தமிழில் இடப்பொருளாக வழங்குகிறது.
- source_word: εἰς τοὺς ἀγρούς
  choice: நாட்டுப்புறப் பகுதிகளில்
  rationale: நகரத்திற்கு வெளியேயுள்ள கிராமிய சுற்றுப்புறங்களைக் குறிக்கும் சூழல்சார் பொருளை இயல்பாகத் தெரிவிக்கிறது; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦλθον
  choice: மக்கள் வந்தார்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத பன்மை எழுவாயை, செய்தியைக் கேட்ட நகர மற்றும் நாட்டுப்புற மக்களாகச் சூழலுக்கு ஏற்ப தெளிவுபடுத்துகிறது.
- source_word: ἰδεῖν
  choice: பார்க்க
  rationale: வருவதன் நோக்கத்தை இயல்பான தமிழ் நோக்கவினையெச்சத்தால் தெரிவிக்கிறது.
- source_word: τί ἐστιν τὸ γεγονός
  choice: நடந்தது என்னவென்று
  rationale: நிகழ்ந்து முடிந்த சம்பவத்தைப் பற்றிய கிரேக்கக் கேள்வித்தொடரை இயல்பான தமிழில் வழங்குகிறது.
