  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: ta
  text: அவருடைய சீடர்கள் அவரிடம், “மக்கள் கூட்டம் உங்களை நெருக்கிக் கொண்டிருப்பதைப் பார்க்கிறீர்களே; ஆனால், ‘என்னைத் தொட்டது யார்?’ என்று சொல்கிறீர்களே!” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால முற்றுப்பெறா வினை வடிவம், சீடர்கள் தொடர்ந்து அல்லது மீண்டும் மீண்டும் சொல்லியதைச் சுட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: இயேசுவோடு கற்றல் மற்றும் பின்பற்றுதல் சார்ந்த உறவைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ்ச் சொல்.
- source_word: Βλέπεις
  choice: பார்க்கிறீர்களே
  rationale: நிகழ்கால வினையைப் பாதுகாப்பதோடு, கண்முன் தெளிவாக உள்ள நிலையைச் சீடர்கள் சுட்டிக்காட்டும் தொனியையும் தமிழ் வாக்கிய இறுதி உருபு வெளிப்படுத்துகிறது.
- source_word: ὄχλον
  choice: மக்கள் கூட்டம்
  rationale: சூழ்ந்திருந்த பெருந்திரளைக் குறிக்கும் தெளிவான நவீனத் தமிழ் நடை.
- source_word: συνθλίβοντά
  choice: சுற்றி நெருக்கிக்கொண்டிருப்பதை
  rationale: கூட்டம் இயேசுவைச் சுற்றி உடலளவில் அழுத்தும் அளவுக்கு நெருங்கியிருந்ததை இயல்பாகத் தெரிவிக்கிறது; ‘நசுக்குவது’ என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: λέγεις
  choice: சொல்கிறீர்களே
  rationale: மூலத்தின் ‘சொல்கிறாய்’ என்ற நேரடி வினையைப் பாதுகாத்து, சீடர்களின் வியப்பையும் மறைமுக எதிர்ப்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: Τίς μου ἥψατο
  choice: என்னைத் தொட்டது யார்?
  rationale: சற்றுமுன் நிகழ்ந்த குறிப்பிட்ட தொடுதலைப் பற்றிய கேள்வியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: μου
  choice: என்னை
  rationale: ἅπτομαι உடன் வரும் கிரேக்க உருபைத் தமிழில் இயல்பான செயப்படுபொருள் வடிவில் வழங்குகிறது.
