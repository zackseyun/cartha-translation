source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: ta
  text: அவர் படகில் ஏறிக்கொண்டிருந்தபோது, பேய்பிடித்திருந்த மனிதன், தான் அவரோடு இருக்க வேண்டுமென்று அவரிடம் தொடர்ந்து கெஞ்சினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: அவர் … ஏறிக்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் காலநுட்பத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: πλοῖον
  choice: படகு
  rationale: கலிலேயக் கடல் சூழலில் இயல்பான நவீனத் தமிழ் சொல்; ‘கப்பல்’ என்பதன் அளவுப் பொருளைத் தவிர்க்கிறது.
- source_word: παρεκάλει
  choice: தொடர்ந்து கெஞ்சினான்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைவும் வேண்டுகோளின் தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: ὁ δαιμονισθείς
  choice: பேய்பிடித்திருந்த மனிதன்
  rationale: முன்னர் பேயின் ஆளுகைக்கு உட்பட்டு இப்போது விடுவிக்கப்பட்ட மனிதனையே குறிக்கிறது; தமிழில் தெளிவாகவும் வழக்காகவும் உள்ளது.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: தான் அவரோடு இருக்க வேண்டுமென்று
  rationale: வேண்டுகோளின் உள்ளடக்கத்தையும் ‘அவரோடு இருத்தல்’ என்ற தனிப்பட்ட உறவுநிலையையும் காக்கிறது.
theological_decisions:
- issue: δαιμονισθείς என்பதன் மொழிபெயர்ப்பு
  choice: பேய்பிடித்திருந்த
  alternative: பேய்களின் ஆளுகையில் இருந்த
  rationale: நற்செய்தி நிகழ்வில் சொல்லப்படும் உண்மையான பேயாதிக்கத்தை இயல்பான பொதுத்தமிழில் வெளிப்படுத்துகிறது; அதை வெறும் நோயாகவோ உருவகமாகவோ மாற்றவில்லை. ‘இருந்த’ என்ற வடிவம் அவர் ஏற்கெனவே விடுவிக்கப்பட்ட கதைச்சூழலையும் உணர்த்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அவர்’ இயேசுவைக் குறிக்கும் மரியாதை ஒருமையாகவும், ‘தான்’ வேண்டிக்கொண்ட மனிதனைத் தெளிவாகச் சுட்டும் தற்சுட்டுப் பெயராகவும் பயன்படுத்தப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு அதன் குறியீட்டுடன் பொருந்தாததால், கிரேக்க மூலத்தில் தேவையான மொழிபெயர்ப்பு மாற்றாக அமையாத அந்தக் குறிப்பைச் சேர்க்கவில்லை.
