- from: அதைப் பார்த்தவர்கள், பேய் பிடித்திருந்த அந்த மனிதனுக்கு எப்படி இது நடந்தது என்பதையும் பன்றிகளைப் பற்றியும் அவர்களுக்கு விவரித்துச் சொன்னார்கள்.
