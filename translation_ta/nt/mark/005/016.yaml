reference: Mark 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: ta
  text: அதைப் பார்த்தவர்கள், பேய் பிடித்திருந்த அந்த மனிதனுக்கு இது எப்படி நடந்தது என்பதையும் பன்றிகளைப் பற்றியும் அவர்களிடம் விவரித்துச் சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσαντο
  choice: விவரித்துச் சொன்னார்கள்
  rationale: இந்த வினைச்சொல் நிகழ்ந்ததை எடுத்துரைப்பதையோ விரிவாக விவரிப்பதையோ குறிக்கிறது. ‘விவரித்துச் சொன்னார்கள்’ என்பது அதன் விவரிப்பு நுணுக்கத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: οἱ ἰδόντες
  choice: அதைப் பார்த்தவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்தப் பங்கேற்புவினை நிகழ்வைக் கண்டவர்களைக் குறிக்கிறது. சூழலில் குறிக்கப்படும் நிகழ்வை ‘அதை’ தெளிவாகச் சுட்டுகிறது.
- source_word: πῶς ἐγένετο
  choice: எப்படி இது நடந்தது
  rationale: πῶς என்பது நிகழ்ந்த விதத்தையோ போக்கையோ முன்னிறுத்துகிறது. ‘எப்படி இது நடந்தது’ என்பது ‘என்ன நடந்தது’ என்று சுருக்காமல் அந்த நுணுக்கத்தைப் பேணுகிறது.
- source_word: τῷ δαιμονιζομένῳ
  choice: பேய் பிடித்திருந்த அந்த மனிதனுக்கு
  rationale: இது பேயின் ஆளுகைக்குட்பட்ட ஒருவரைக் குறிக்கிறது. ‘பேய் பிடித்திருந்த அந்த மனிதன்’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, அவரை வெறும் அடையாளச்சொல்லாக மாற்றாமல் தனிநபராகக் குறிப்பிடுகிறது.
- source_word: περὶ τῶν χοίρων
  choice: பன்றிகளைப் பற்றியும்
  rationale: περί உடன் வரும் மரபுவழி வேற்றுமை ‘பற்றி’ அல்லது ‘குறித்து’ என்ற பொருளைத் தருகிறது; χοίρων என்பதற்கு நவீனத் தமிழில் நேரடியான சொல் ‘பன்றிகள்’.
theological_decisions:
- issue: δαιμονιζομένῳ என்பதில் கூறப்படும் பேய் சார்ந்த துன்புறுத்தலின் தன்மை
  choice: பேய் பிடித்திருந்த அந்த மனிதன்
  alternative: பேயால் ஆட்கொள்ளப்பட்டிருந்த மனிதன்
  rationale: மாற்குவின் கதை உலகில் கூறப்படும் உண்மையான பேய் சார்ந்த ஆளுகையை மொழிபெயர்ப்பு மறைக்கவில்லை. அதேவேளையில், மூலத்தில் இல்லாத அளவீடுகளையோ கோட்பாட்டு விளக்கங்களையோ சேர்க்காமல் இயல்பான தமிழ் வழக்கைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாய் இருந்தாலும் மரியாதையும் வேதாகமக் கதைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் καὶ...καὶ இணைப்புகள் ‘என்பதையும்...பற்றியும்’ என்ற அமைப்பில் பிரதிபலிக்கப்படுகின்றன.
