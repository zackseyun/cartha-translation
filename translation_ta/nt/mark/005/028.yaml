  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: ta
  text: ஏனெனில், “அவருடைய உடைகளையாவது நான் தொட்டால், குணமடைவேன்[a]” என்று அவள் சொல்லிக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “நான் காப்பாற்றப்படுவேன்.” இவ்வினைச்சொல் “காப்பாற்றப்படுதல்,” “குணமடைதல்,” அல்லது “நலம்பெறுதல்” என்று பொருள்படலாம்; இங்கே உடல் குணமடைவதையே சூழல் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தாள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது மீண்டும் நிகழ்ந்த சொல்லுதலைக் குறிக்கும் முற்றுப்பெறாத வினைநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அவள் இதைச் சத்தமாகச் சொன்னாளா அல்லது தனக்குள் சொல்லிக்கொண்டாளா என்பதைத் தேவையின்றித் தீர்மானிக்கவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய செயலுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: நேர்க் கூற்றைக் குறிக்கும் மேற்கோள் குறிகள்
  rationale: அவள் சொல்லிக்கொண்டிருந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேர்க் கூற்றாக அமைப்பது இயல்பானது.
- source_word: ἐὰν
  choice: தொட்டால்
  rationale: நிபந்தனையைத் தமிழின் இயல்பான ‘-ஆல்’ விகுதி மூலம் வெளிப்படுத்துகிறது.
- source_word: ἅψωμαι
  choice: நான் தொட்டால்
  rationale: இச்சூழலில் ἅπτω என்பதன் நடுவினை வடிவம் சாதாரணமாக ‘தொடு’ என்று பொருள்படுகிறது.
- source_word: κἂν
  choice: உடைகளையாவது
  rationale: ‘அவற்றையாவது மட்டும்’ என்ற குறைந்தபட்ச எதிர்பார்ப்பின் வலியுறுத்தலை ‘-ஆவது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: அவருடைய உடைகள்
  rationale: ἱμάτια பன்மையில் பொதுவாக ஆடைகள் அல்லது உடைகளைக் குறிக்கிறது; குறிப்பிட்ட மேலாடை என்று தேவையின்றிக் குறுக்கவில்லை. ‘உடைகள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: σωθήσομαι
  choice: குணமடைவேன்
  rationale: உடனடிச் சூழல் இரத்தப்போக்கிலிருந்து உடல் குணமடைவதைப் பற்றியது. இருப்பினும், ‘காப்பாற்றப்படுதல்’ என்ற விரிவான பொருளையும் கொண்டுள்ள மூலச்சொல்லின் பொருள் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: குணமாக்கும் நிகழ்வில் σωθήσομαι என்பதன் பொருள்
  choice: குணமடைவேன்
  alternative: காப்பாற்றப்படுவேன்; நலம்பெறுவேன்
  rationale: பெண்ணின் உடல் நோயிலிருந்து விடுபடும் எதிர்பார்ப்பே உடனடிச் சூழலின் தெளிவான பொருள். அதேவேளையில், σῴζω என்பதில் குணமடைதலும் காப்பாற்றப்படுதலும் ஒன்றோடொன்று தொடர்புடைய பொருள் நிழல்களாக இருப்பதால், அந்த இறையியல் பதற்றத்தை அழிக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முற்றுப்பெறாத வினைநிலையும், ‘உடைகளையாவது’ என்பதில் உள்ள குறைந்தபட்ச வலியுறுத்தலும், σωθήσομαι என்பதன் பொருள் விரிவும் பாதுகாக்கப்பட்டுள்ளன.
