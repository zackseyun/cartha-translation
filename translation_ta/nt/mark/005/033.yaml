id: MRK.5.33
reference: Mark 5:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: ta
  text: அந்தப் பெண்ணோ, அஞ்சியவளாகவும் நடுங்கியவளாகவும்[a], தனக்கு என்ன நடந்தது என்பதை அறிந்து, வந்து அவர் முன் விழுந்து[b], அவரிடம் முழு உண்மையையும் சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயந்து நடுங்கியவளாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் முன்பாக விழுந்து” அல்லது “அவர் முன் பணிந்து விழுந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: -ஓ
  rationale: முந்தைய நிகழ்விலிருந்து பெண்ணின் பதிலுக்கு மெல்லிய மாறுபாட்டையும் கதை நகர்வையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: கதையில் முன்பே அறிமுகப்படுத்தப்பட்ட குறிப்பிட்ட பெண்ணைச் சுட்டுகிறது.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: அஞ்சியவளாகவும் நடுங்கியவளாகவும்
  rationale: இரு பங்கேற்பு வினைவடிவங்களின் உயிரோட்டத்தையும் அவளுடைய உணர்ச்சி மற்றும் உடல் நிலையையும் காக்கிறது.
- source_word: εἰδυῖα
  choice: அறிந்து
  rationale: கிரேக்கப் பங்கேற்பு வினைவடிவத்தின் சூழ்நிலைத் தொடர்பைக் காக்கிறது; அதை வெளிப்படையாகக் காரணத் தொடர்பாக மாற்றவில்லை.
- source_word: ὃ γέγονεν αὐτῇ
  choice: தனக்கு என்ன நடந்தது என்பதை
  rationale: அவள் அனுபவித்த குணமடைதல் நிகழ்வைக் குறிக்கும் இயல்பான தமிழ்; αὐτῇ என்பதன் தன்னிலைத் தொடர்பையும் தெளிவாக்குகிறது.
- source_word: ἦλθεν
  choice: வந்து
  rationale: எளிய கதை நகர்வை கூடுதல் விளக்கமின்றி இயல்பாகத் தருகிறது.
- source_word: προσέπεσεν αὐτῷ
  choice: அவர் முன் விழுந்து
  rationale: இயேசுவின் முன்னிலையில் விழுந்த செயலைக் காட்டுகிறது; துல்லியமான உடல் நிலை அல்லது வழிபாடு என்ற வலுவான கருத்தைச் சேர்க்கவில்லை.
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் ... சொன்னாள்
  rationale: பின்வரும் செய்திப் பொருளோடு இயல்பான நவீனத் தமிழாக அமைகிறது.
- source_word: πᾶσαν τὴν ἀλήθειαν
  choice: முழு உண்மையையும்
  rationale: எதையும் மறைக்காமல் அனைத்தையும் தெரிவித்தாள் என்ற πᾶσαν என்பதன் வலியுறுத்தலை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: προσέπεσεν αὐτῷ என்பதில் இயேசுவின் முன் கொண்ட உடல் நிலை
  choice: அவர் முன் விழுந்து
  alternative: அவர் காலடியில் விழுந்து / அவர் முன் நெடுஞ்சாண்கிடையாக விழுந்து
  rationale: வினைச்சொல் மரியாதை, அச்சம் அல்லது வேண்டுதல் காரணமாக ஒருவரின் முன் விழுவதைக் குறிக்கலாம். மூலவசனம் வெளிப்படையாகச் சொல்லாத வழிபாட்டு நோக்கத்தையோ குறிப்பிட்ட உடல் நிலையையோ மொழிபெயர்ப்பு தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கிரேக்கப் பங்கேற்பு வினைவடிவங்களின் தொடர்ச்சி தமிழில் ‘அறிந்து, வந்து, ... விழுந்து’ என்ற இயல்பான வினையெச்சத் தொடரால் பிரதிபலிக்கப்படுகிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் பொருந்தாத இடங்களில் இருந்ததால், தமிழில் அவை உரிய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
