  source_fidelity: 'The Tamil accurately represents the Greek sequence and sense: the γυναί is appropriately definite in context; φοβηθεῖσα καὶ τρέμουσα is retained as a paired expression; εἰδυῖα and ὃ γέγονεν αὐτῇ are faithfully conveyed without making the participle explicitly causal; and προσέπεσεν αὐτῷ is rendered without adding a claim of worship or a more precise posture than the source states. “முழு உண்மையையும்” adequately conveys πᾶσαν τὴν ἀλήθειαν.'
  naturalness: The sentence is clear, grammatical modern standard Tamil. The serial participial construction—“அறிந்து, வந்து ... விழுந்து”—is natural in narrative prose and mirrors the progression of the Greek without awkward literalism.
  terminology: “அந்தப் பெண்,” “அஞ்சியவளாகவும் நடுங்கியவளாகவும்,” and “அவர் முன் விழுந்து” suit a respectful biblical register while remaining accessible. The footnote alternatives are natural and do not overstate the posture.
