- from: ஆனால் இயேசு, பேசப்பட்டுக்கொண்டிருந்த செய்தியைக் கேட்டுவிட்டு,[a] ஜெபக்கூடத் தலைவரிடம், “பயப்படாதே; நம்பிக்கை மட்டும் வை”[b] என்கிறார்.
  to: ஆனால் இயேசு, சொல்லப்பட்டுக்கொண்டிருந்ததைக் கேட்டு,[a] ஜெபக்கூடத் தலைவரிடம், “பயப்படாதே; நம்பிக்கை மட்டும் வை”[b] என்கிறார்.
