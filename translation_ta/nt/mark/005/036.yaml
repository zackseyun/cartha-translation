source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: ta
  text: ஆனால் இயேசு, சொல்லப்பட்டுக்கொண்டிருந்ததைக் கேட்டு,[a] ஜெபக்கூடத் தலைவரிடம், “பயப்படாதே; நம்பிக்கை மட்டும் வை”[b] என்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சொல்லப்பட்டதைப் பொருட்படுத்தாமல்.” παρακούσας என்ற கிரேக்கச் சொல், அந்தச் செய்தியைக் கேட்பதையோ அதை ஏற்க மறுத்துப் பொருட்படுத்தாமல் இருப்பதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மட்டும் நம்பு,” “தொடர்ந்து நம்பு,” அல்லது “நம்பியிரு.” கிரேக்க வினைச்சொல் πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: கேட்டுவிட்டு
  rationale: இங்கு இயேசு அப்போது சொல்லப்பட்ட செய்தியைக் கேட்டு உடனே ஜெபக்கூடத் தலைவரிடம் பேசுகிறார் என்பதே கதை ஓட்டத்திற்கு இயல்பாகப் பொருந்துகிறது. இச்சொல்லுக்கு ‘பொருட்படுத்தாமல்’ என்ற பொருளும் இருக்கக்கூடும்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὸν λόγον λαλούμενον
  choice: பேசப்பட்டுக்கொண்டிருந்த செய்தி
  rationale: λόγος இச்சூழலில் யவீருக்கு இப்போதுதான் தெரிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது. தொடர்நிலைப் பெயரெச்சத்தின் காலநிலையை ‘பேசப்பட்டுக்கொண்டிருந்த’ என்பதும், சூழல்சார் பொருளை ‘செய்தி’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: λέγει
  choice: என்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்கால வடிவில் பாதுகாக்கிறது.
- source_word: ἀρχισυναγώγῳ
  choice: ஜெபக்கூடத் தலைவர்
  rationale: யூத ஜெபக்கூடத்தை மேற்பார்வையிடும் அல்லது வழிநடத்தும் பொறுப்பாளரைக் குறிக்கும் பதவிப்பெயரை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: Μὴ φοβοῦ
  choice: பயப்படாதே
  rationale: தடை கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: μόνον
  choice: மட்டும்
  rationale: இயேசு கோரும் பதிலை வரையறுக்கும் μόνον என்பதன் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: πίστευε
  choice: நம்பிக்கை வை
  rationale: இச்சூழலில் நம்புதல் அல்லது நம்பியிருத்தல் என்ற கட்டளையைத் தெளிவான நவீனத் தமிழில் தருகிறது; ‘நம்பு’ என்ற நேரடி மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: παρακούσας என்பதன் பொருள்
  choice: இயேசு சொல்லப்பட்டுக்கொண்டிருந்த செய்தியைக் கேட்டார்
  alternative: இயேசு சொல்லப்பட்ட செய்தியைப் பொருட்படுத்தவில்லை
  rationale: இரு பொருள்களும் மொழியியல் அடிப்படையில் சாத்தியம். அடுத்து அவர் அந்தச் செய்தியைப் பெற்றவரிடம் நேரடியாகப் பேசுவதால் ‘கேட்டார்’ என்பது கதை ஓட்டத்திற்கு இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πίστευε என்ற கட்டளையின் பொருள் நிழல்
  choice: நம்பிக்கை மட்டும் வை
  alternative: நம்பு மட்டும் / தொடர்ந்து நம்பு / நம்பியிரு
  rationale: நிகழ்காலக் கட்டளை தொடர்ச்சியான நம்பிக்கையை உணர்த்தக்கூடும். முதன்மை வாசகம் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; சாத்தியமான சொற்பொருள் மாற்றுகள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மாற்குவின் வரலாற்று நிகழ்காலம் ‘என்கிறார்’ என்று பாதுகாக்கப்பட்டுள்ளது. ஜெபக்கூடம் என்பது இங்கு யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தைக் குறிக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
