  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: ta
  text: பல மருத்துவர்களால் மிகுந்த துன்பம் அனுபவித்து[a], தன்னிடமிருந்த அனைத்தையும் செலவழித்தும்[b], எந்தப் பயனும் அடையாமல், மாறாக மேலும் மோசமாகியிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பல மருத்துவர்களிடம் இருந்து” அல்லது “பல மருத்துவர்களின் கைகளில்” என்றும் மொழிபெயர்க்கலாம். மருத்துவர்களின் செயற்பாட்டையோ, அவர்களுடைய சிகிச்சைகளுக்கு அவள் உட்பட்டிருந்ததையோ கிரேக்கம் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவளிடமிருந்து வந்த அனைத்தையும்”; அதாவது, அவளிடம் இருந்த எல்லாவற்றையும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: மிகுந்த துன்பத்தை அனுபவித்து
  rationale: πάσχω என்பதன் அனுபவம் சார்ந்த பொருளையும், முதன்மை வினைக்கு முன் நிகழ்ந்த சூழலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையின் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: பல மருத்துவர்களிடம் சிகிச்சை பெற்று
  rationale: ὑπό + பிறப்புவேற்றுமை மருத்துவர்களின் செயற்பாடு அல்லது அவர்களுடைய சிகிச்சைக்கு உட்பட்ட நிலையைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்க ‘சிகிச்சை பெற்று’ என்று வெளிப்படையாக்கப்பட்டுள்ளது; காரணம் முழுவதும் மருத்துவர்கள்மீது சுமத்தப்படவில்லை.
- source_word: δαπανήσασα
  choice: செலவழித்தும்
  rationale: முன்னர் நிகழ்ந்த செயலைக் குறிக்கும் பங்கேற்புவினையைத் தருவதோடு, பணம் செலவிட்டும் பலன் கிடைக்காத முரண்பாட்டைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: தன்னிடமிருந்த அனைத்தையும்
  rationale: அவளிடம் இருந்த அல்லது அவளுக்குச் சொந்தமான அனைத்தையும் குறிக்கும் கிரேக்க மரபுத்தொடரின் முழுமையைப் பாதுகாக்கிறது.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: எந்தப் பயனும் அடையாமல்
  rationale: ὠφελέω என்பதன் செயப்பாட்டு வடிவம் அவளுக்கு உதவியோ பயனோ கிடைக்கவில்லை என்பதைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἀλλὰ μᾶλλον
  choice: மாறாக
  rationale: பலன் கிடைக்காததைக் காட்டிலும் எதிர்மாறான விளைவு ஏற்பட்டது என்ற வலுவான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: இன்னும் மோசமான நிலைக்குச் சென்றிருந்தாள்
  rationale: சொல்லாட்சியின் ‘மோசமான நிலைக்குள் சென்றாள்’ என்ற இயக்க உருவகத்தையும், உடல்நிலை தொடர்ந்து சீர்கெட்ட பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
