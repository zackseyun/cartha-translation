language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ta
  text: அவர் அவனை அனுமதிக்கவில்லை. மாறாக, அவனிடம், “உன் வீட்டிற்கு, உன்னைச் சேர்ந்தவர்களிடம்[a] போய், ஆண்டவர்[b] உனக்குச் செய்த அனைத்தையும், உனக்கு இரக்கம் காட்டியதையும் அவர்களிடம் அறிவி” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘உன்னுடையவர்களிடம்.’ இது குடும்பத்தார் மட்டுமல்லாமல் உறவினர் மற்றும் நெருங்கியவர்களையும் பரந்த விதத்தில் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவர்’ என்பது இங்கு குறிப்பாகக் கடவுளைக் குறிக்கிறது என்று சிலர் புரிந்துகொள்கிறார்கள். வேறு சிலர், கடவுளின் இரக்கத்திற்கும் இயேசுவின் சொந்த அதிகாரத்திற்கும் செயலுக்கும் உள்ள தொடர்பை மாற்கு திட்டமிட்டே திறந்த நிலையில் வைக்கிறார் என்று கருதுகிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: அனுமதிக்கவில்லை
  rationale: இச்சூழலில் ἀφίημι என்பது ‘மன்னித்தல்’ அல்லது ‘விட்டுவிடுதல்’ அல்ல, அனுமதி அளித்தல் என்ற பொருளில் வருகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கம் வரலாற்று நிகழ்காலத்தைப் பயன்படுத்தினாலும், நவீன தமிழ் கதைநடையில் கடந்தகால வடிவம் இயல்பாக உள்ளது.
- source_word: Ὕπαγε
  choice: போய்
  rationale: ஒரு குறிப்பிட்ட இடத்திற்குச் செல்லும்படியான கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὸν οἶκόν σου
  choice: உன் வீட்டிற்கு
  rationale: οἶκος இங்கு ஒருவருடைய வீடு அல்லது குடும்பச் சூழலைக் குறிக்கிறது; ‘உன் வீட்டிற்கு’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: πρὸς τοὺς σούς
  choice: உன்னைச் சேர்ந்தவர்களிடம்
  rationale: சொல்லுக்குச் சொல் ‘உனக்குரியவர்களிடம்/உன்னுடையவர்களிடம்’ எனப் பொருள்படும் இச்சொற்றொடர் குடும்பத்தார், உறவினர், நெருங்கியவர்கள் ஆகியோரை உள்ளடக்கக்கூடும். தேர்ந்த வடிவம் அந்தப் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: ἀπάγγειλον
  choice: அறிவி
  rationale: ἀπαγγέλλω என்பது ஒருவரிடம் செய்தியை எடுத்துரைத்தல் அல்லது நடந்ததைத் தெரிவித்தல். ‘அறிவி’ இங்கு கண்ணியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὅσα
  choice: செய்த அனைத்தையும்
  rationale: ὅσα செய்த காரியங்களின் முழு அளவையும் உள்ளடக்கத்தையும் குறிக்கிறது; ‘அனைத்தையும்’ என்பது தமிழில் தெளிவாக இதைப் பிரதிபலிக்கிறது.
- source_word: ὁ κύριός σοι
  choice: ஆண்டவர் உனக்குச் செய்த
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது. σοι என்பதை வினையோடு இணைத்து ‘உனக்குச் செய்த’ எனக் கொள்வது இயல்பானதும் இச்சூழலுக்கு ஏற்றதும் ஆகும்.
- source_word: ἠλέησέν σε
  choice: உனக்கு இரக்கம் காட்டியதையும்
  rationale: ἐλεάω இரக்கம் அல்லது கருணை காட்டுவதைச் சுட்டுகிறது; ‘இரக்கம் காட்டினார்’ அதன் வினை வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசு செய்த செயல்களைப் பற்றிய சூழலில் κύριος என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: கடவுள்
  rationale: ‘ஆண்டவர்’ என்பது κύριος என்பதன் நேரடியான வழக்கமான மொழிபெயர்ப்பு. இங்கு அது கடவுளைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்; அதே நேரத்தில், ஆண்டவரின் இரக்கத்திற்கும் இயேசுவின் சொந்த அதிகாரமுள்ள செயலுக்கும் இடையேயான தொடர்பையும் மாற்கு வாசகரின் கவனத்தில் வைத்திருக்கலாம். ‘கடவுள்’ என்று பிரதான உரையில் மாற்றி இந்த இறையியல் நெருக்கத்தைத் தீர்மானித்துவிடாமல் மொழிபெயர்ப்பு அதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்னைச் சேர்ந்தவர்கள்’ என்ற சொற்றொடர் குடும்பம் என்று மட்டும் குறுக்காமல் மூலத்தின் பரந்த குறிப்பைத் தக்கவைக்கிறது; ‘ஆண்டவர்’ என்ற வடிவம் மூலத்தில் உள்ள இறையியல் நெருக்கத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
