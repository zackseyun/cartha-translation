  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: ta
  text: இயேசு அவருடன் சென்றார். ஒரு பெரும் கூட்டம் அவரைப் பின்தொடர்ந்து கொண்டிருந்தது; அவரை நெருக்கிக்கொண்டிருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்மீது அழுத்திக்கொண்டிருந்தது’ அல்லது ‘அவரைச் சுற்றி நெருக்கிக்கொண்டிருந்தது.’ கூட்டம் இயேசுவை உடலளவில் அழுத்தி நெருக்கியதை கிரேக்க வினைச்சொல் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: சென்றார்
  rationale: இங்கு இயேசு யவீருவுடன் செல்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘புறப்பட்டுச் சென்றார்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: μετ’ αὐτοῦ
  choice: அவருடன்
  rationale: மரியாதை ஒருமையைப் பயன்படுத்தும் இயல்பான தமிழில் உடன்செல்லுதலைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἠκολούθει
  choice: பின்தொடர்ந்து
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலைச் செயலை, அடுத்துள்ள ‘நெருக்கிக்கொண்டிருந்தார்கள்’ என்பதோடு இணைத்து இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὄχλος πολύς
  choice: பெருந்திரளான மக்கள்
  rationale: கூட்டத்தின் பெருமளவைத் தெரிவிப்பதோடு, தமிழில் மனிதப் பன்மை வினைமுற்றுடன் இயல்பாக அமைகிறது.
- source_word: συνέθλιβον
  choice: சுற்றி நெருக்கிக்கொண்டிருந்தார்கள்
  rationale: கூட்டத்தினர் இயேசுவைச் சுற்றி உடலளவில் அழுத்தி நெருக்கிய தொடர்ச்சியான செயலை வெளிப்படுத்துகிறது; காயப்படுத்தும் அளவிற்கு ‘நசுக்கினார்கள்’ என்று மிகைப்படுத்தவில்லை.
- source_word: αὐτόν
  choice: அவரை
  rationale: இந்தப் பதிலிப்பெயர் இயேசுவைக் குறிக்கிறது; மரியாதை ஒருமையாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
