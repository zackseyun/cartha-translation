  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: ta
  text: அவன் அவரிடம், அவற்றை அந்தப் பகுதிக்கு வெளியே அனுப்பிவிட வேண்டாம் என்று மீண்டும் மீண்டும் கெஞ்சினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அவரிடம், அவற்றை அந்த நிலப்பரப்புக்கு வெளியே அனுப்பிவிட வேண்டாம் என்று பலமுறை மன்றாடினான்.”
    reason: παρεκάλει, πολλὰ, χώρα ஆகியவற்றுக்கான பொருத்தமான மாற்றுச் சொற்களைத் தருகிறது.
lexical_decisions:
- source_word: παρεκάλει
  choice: கெஞ்சினான்
  rationale: பேய் ஓட்டப்படும் இச்சூழலில் παρακαλέω என்பது சாதாரணமாகக் கேட்டுக்கொள்வதைவிட அவசரமும் தீவிரமும் கொண்ட மன்றாட்டைக் குறிக்கிறது. ‘கெஞ்சினான்’ என்பது இதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: πολλὰ
  choice: மீண்டும் மீண்டும்
  rationale: வினையடைப் பயன்பாட்டில் உள்ள πολλὰ, மன்றாட்டு தொடர்ச்சியாக அல்லது பலமுறை செய்யப்பட்டதை வலுப்படுத்துகிறது. ‘மீண்டும் மீண்டும்’ என்பது இந்தத் தொடர்நிகழ்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα μὴ
  choice: வேண்டாம் என்று
  rationale: மன்றாட்டின் உள்ளடக்கமாகிய எதிர்மறைக் கோரிக்கையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτὰ
  choice: அவற்றை
  rationale: இது நடுநிலைப் பன்மைச் சுட்டுப்பெயர்; அசுத்த ஆவிகள் அல்லது பேய்கள் பலவற்றைக் குறிக்கிறது. எனவே கிரேக்கத்தின் பன்மை காக்கப்படுகிறது.
- source_word: ἀποστείλῃ
  choice: அனுப்பிவிட
  rationale: ἀποστέλλω இங்கு ‘அனுப்புதல்/அகற்றியனுப்புதல்’ என்ற நேரடியான பொருளைக் கொண்டது. ‘விரட்டுதல்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத வலுக்கட்டாய நிழற்பொருளைச் சேர்க்கலாம்.
- source_word: ἔξω τῆς χώρας
  choice: அந்தப் பகுதியைவிட்டு வெளியே
  rationale: χώρα இங்கு நவீன தேசிய நாட்டை அல்ல, உள்ளூர் பகுதி அல்லது நிலப்பரப்பைக் குறிக்கிறது. இத்தொடர் அந்தப் புவியியல் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ஒருமை வினைச்சொற்களின் எழுவாய்க்கும் பன்மைச் சுட்டுப்பெயருக்கும் இடையிலான எண் மாற்றம்
  choice: பேசுபவனை ஒருமையில் ‘அவன்’ என்றும் அனுப்பப்பட வேண்டிய பேய்களைப் பன்மையில் ‘அவற்றை’ என்றும் மொழிபெயர்த்தல்
  alternative: எண் மாற்றத்தைச் சீராக்கி அனைத்தையும் கூட்டாகப் பன்மையில் மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை ஒரு பேச்சாளனுக்கும் அவன் சார்பாகப் பேசும் பல பேய்களுக்கும் இடையிலான பதற்றத்தைத் தக்கவைக்கிறது. மொழிபெயர்ப்பு அதை இணக்கப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் மறைமுகப் பெயருக்கு மரியாதைப் பன்மையான ‘அவரிடம்’ பயன்படுத்தப்பட்டாலும், கிரேக்கத்தில் உள்ள ஒருமைப் பேச்சாளர்—பன்மைப் பேய்கள் என்ற வேறுபாடு ‘அவன்/அவற்றை’ மூலம் தெளிவாகக் காக்கப்பட்டுள்ளது.
