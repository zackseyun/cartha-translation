id: MRK.5.41
reference: Mark 5:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: ta
  text: 'அவர் குழந்தையின் கையைப் பிடித்துக்கொண்டு, அவளிடம், “தலித்தா கூம்”[a] என்று சொல்கிறார். அதன் மொழிபெயர்ப்பு: “சிறுமியே, நான் உனக்குச் சொல்கிறேன், எழுந்திரு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரமேயச் சொற்றொடரின் பாரம்பரிய இலத்தீன் எழுத்து வடிவம் சில ஆங்கில மொழிபெயர்ப்புகளில் “Talitha cum” எனக் காணப்படுகிறது. இங்குள்ள கிரேக்க உரை κουμ என வாசிப்பதால், அது தமிழில் “கூம்” என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: குழந்தையின் கையைப் பிடித்துக்கொண்டு
  rationale: κρατέω உடன் வரும் உருபமைப்பு கையைப் பற்றிக்கொள்ளும் செயலைக் குறிக்கிறது. ‘பிடித்துக்கொண்டு’ என்பது உடல் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; παιδίον என்பதற்கு இங்கே ‘குழந்தை’ என்று மொழிபெயர்ப்பதால் பின்னர் வரும் கொράσιον என்பதன் பெண்பால் குறிப்பும் அன்பான அழைப்பும் தனியே வெளிப்படுகின்றன.
- source_word: λέγει αὐτῇ
  choice: அவளிடம் ... சொல்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைப் பேணுவதற்காக நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘அவளிடம்’ என்பது உரையின் இலக்கை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ταλιθα κουμ
  choice: தலித்தா கூம்
  rationale: கிரேக்க மூலத்தில் பாதுகாக்கப்பட்டுள்ள அரமேயச் சொற்றொடர் ஒலிபெயர்க்கப்பட்டுள்ளது; அதைத் தொடர்ந்து மாற்கு தாமே தரும் மொழிபெயர்ப்பும் வைக்கப்பட்டுள்ளது. κουμ என்பதற்கு ‘கூம்’ நேரடியான தமிழ் ஒலிபெயர்ப்பு.
- source_word: μεθερμηνευόμενον
  choice: அதன் மொழிபெயர்ப்பு
  rationale: இந்தச் சொல் அரமேய உரை மொழிபெயர்த்து விளக்கப்படுவதை வெளிப்படையாகக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்துக்கு ஏற்றவாறு பெயர்ச்சொல் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: Τὸ κοράσιον
  choice: சிறுமியே
  rationale: κοράσιον இளம் பெண் குழந்தையைக் குறிக்கும் சிறுமைப் பொருளுள்ள சொல். நேரடி அழைப்பைத் தமிழில் இயல்பாகக் காட்ட அழைப்புவேற்றுமையான ‘சிறுமியே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: σοὶ λέγω
  choice: நான் உனக்குச் சொல்கிறேன்
  rationale: கிரேக்கத்தில் வலியுறுத்தப்பட்டுள்ள ‘உனக்கு’ என்ற குறிப்பை விடாமல், நேரடியும் கண்ணியமுமான தமிழில் மொழிபெயர்க்கிறது.
- source_word: ἔγειρε
  choice: எழுந்திரு
  rationale: ἐγείρω என்பதன் கட்டளை வடிவம் இச்சூழலில் எழுந்திருக்கும்படி கூறுகிறது. ‘எழுந்திரு’ என்பது நவீன தமிழில் தெளிவான, நேரடியான கட்டளை.
theological_decisions:
- issue: இயேசுவின் அரமேயச் சொற்களை முதன்மை உரையில் வைத்திருத்தல்
  choice: ‘தலித்தா கூம்’ என்பதை ஒலிபெயர்த்து வைத்து, மாற்கு தரும் மொழிபெயர்ப்பையும் உடனே வழங்குதல்
  alternative: அரமேயச் சொற்றொடரை விடுத்து, ‘சிறுமியே, நான் உனக்குச் சொல்கிறேன், எழுந்திரு’ என்பதை மட்டும் வழங்குதல்
  rationale: மூல உரையே இயேசுவின் அரமேயச் சொற்றொடரைப் பாதுகாத்து, பின்னர் அதன் பொருளை விளக்குகிறது. இரண்டையும் வைத்திருப்பது உரையின் வரலாற்று மற்றும் இலக்கிய அமைப்பைப் பேணுகிறது; எந்தத் தனிப்பட்ட கோட்பாட்டு விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: ἔγειρε என்பதிலுள்ள ‘எழுதல்’ மற்றும் ‘விழித்தெழுதல்’ சார்ந்த பொருள் பரப்பு
  choice: இந்நிகழ்ச்சியின் உடனடி கட்டளையாக ‘எழுந்திரு’
  alternative: ‘விழித்தெழு’ அல்லது ‘உயிர்த்தெழு’
  rationale: சொல்லுக்கு பல சூழல்களில் விழித்தெழுதல் அல்லது உயிர்த்தெழுதல் சார்ந்த பொருள் இருக்கலாம். ஆனால் இங்கு சிறுமி உடனே எழுந்து நடப்பதே அடுத்த நிகழ்வு என்பதால் ‘எழுந்திரு’ இயல்பானது; அதேவேளை சொல்லின் விரிந்த வேதாகமத் தொடர்புகளை விளக்கமாகத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலம் ‘சொல்கிறார்’ என்று பேணப்பட்டுள்ளது. நேரடி உரையில் ‘சிறுமியே’ மற்றும் ‘எழுந்திரு’ இயல்பான ஒருமை அழைப்பும் கட்டளையும் தருகின்றன.
