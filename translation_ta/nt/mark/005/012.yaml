id: MRK.5.12
reference: Mark 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: ta
  text: 'அவை அவரிடம் கெஞ்சிக் கேட்டன: “நாங்கள் அவற்றுக்குள் புகும்படி, எங்களைப் பன்றிகளுக்குள் அனுப்புங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: கெஞ்சிக் கேட்டன
  rationale: இச்சூழலில் παρακαλέω தீவிரமான வேண்டுதலைக் குறிக்கிறது. ‘கேட்டன’ என்பதைவிட ‘கெஞ்சிக் கேட்டன’ கிரேக்கச் சொல்லின் வலிமையையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: αὐτὸν
  choice: அவரிடம்
  rationale: இப்பெயர்ப்புப் பெயர் இயேசுவைக் குறிக்கிறது; தமிழில் வேண்டுகோள் வைக்கப்படும் நபரை ‘அவரிடம்’ என்று குறிப்பிடுவது இயல்பானது.
- source_word: λέγοντες
  choice: 'கேட்டன:'
  rationale: பேச்சின் உள்ளடக்கத்தைத் தொடர்ந்து வரும் நேரடிக் கூற்றாக அமைத்ததால், கிரேக்கப் பங்கேற்பு வினையின் செயலை ‘கேட்டன’ என்பதிலும் இரட்டைப்புள்ளியிலும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Πέμψον
  choice: அனுப்பும்
  rationale: πέμπω என்பதன் நேரடிப் பொருள் ‘அனுப்பு’. சூழலில் அனுமதி கோருதல் உட்பொருளாக இருந்தாலும், அதை விளக்கமாகச் சேர்க்காமல் மூலத்தின் கட்டளை வடிவம் காக்கப்பட்டுள்ளது.
- source_word: ἡμᾶς
  choice: எங்களை
  rationale: முதலாம் நபர் பன்மை செயப்படுபொருளை நேரடியாகக் குறிக்கிறது.
- source_word: εἰς τοὺς χοίρους
  choice: பன்றிகளுக்குள்
  rationale: χοῖρος என்பது பன்றியைக் குறிக்கிறது; பன்மையும் εἰς தரும் ‘உள்ளே’ என்ற திசைப் பொருளும் காக்கப்பட்டுள்ளன.
- source_word: ἵνα
  choice: புகும்படி
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்க உறவு தமிழில் ‘-படி’ என்ற அமைப்பால் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுகிறது.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: நாங்கள் அவற்றுக்குள் புகும்படி
  rationale: εἰσέρχομαι என்பதன் ‘உள்ளே நுழைதல்’ என்ற பொருளை ‘புகு’ தெளிவாகக் காட்டுகிறது; αὐτούς பன்றிகளைக் குறிப்பதால் அஃறிணைப் பன்மையான ‘அவற்றுக்குள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பேசுபவர்கள் இயேசுவிடம் வைக்கும் வேண்டுகோளின் தன்மை
  choice: அவை இயேசுவின் அதிகாரத்துக்கு உட்பட்டவையாக அவரிடம் கெஞ்சி, பன்றிகளுக்குள் செல்லத் தங்களை அனுப்புமாறு வேண்டுகின்றன.
  alternative: அவை தங்கள் இடமாற்றத்தை மட்டும் வலியுறுத்தாமல் கேட்டதாக மென்மையாக மொழிபெயர்த்தல்.
  rationale: ‘கெஞ்சிக் கேட்டன’ மற்றும் ‘அனுப்பும்’ என்பவை கதையில் வெளிப்படும் அதிகார உறவைப் பிரதிபலிக்கின்றன; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் எதையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகமக் கதையாடலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. முன்சூழலில் குறிப்பிடப்பட்ட அசுத்த ஆவிகளைச் சுட்ட ‘அவை’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘பன்றிக் கூட்டம்’ என்ற கருத்து சேர்க்கப்படவில்லை.
