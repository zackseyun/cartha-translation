  source_fidelity: மூல கிரேக்கத்தின் நிறைவுறா இறந்தகாலமான ἐπηρώτα-வின் தொடர்ச்சிப் பாங்கு ‘கேட்டுக்கொண்டிருந்தார்’ என்பதில் நன்றாகக் காக்கப்பட்டுள்ளது. பெயரைக் கேட்கும் வினா இயல்பாகவும் துல்லியமாகவும் உள்ளது. Λεγιὼν பெயராகவே எழுத்துப்பெயர்க்கப்பட்டுள்ளது; ‘என் பெயர்’ என்ற ஒருமையும் ‘நாங்கள் பலர்’ என்ற பன்மையும் மூலத்தில் உள்ள பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கின்றன. λέγει என்ற வரலாற்று நிகழ்காலம் தமிழ்க் கதைநடைக்கேற்ற இறந்தகாலத்தில் தரப்பட்டுள்ளது; இது பொருளிழப்பை ஏற்படுத்தவில்லை.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அவர்’ மற்றும் ‘அவன்’ பயன்பாடு சூழலுக்கேற்றது. ‘அதற்கு அவன்’ என்பது நேரடியான ‘அவனிடம் சொல்கிறான்’ என்பதிலிருந்து ஓரளவு சுருக்கமான பதிலுரை வடிவமாக இருந்தாலும், தமிழில் இயல்பானது; பொருளும் உரையாடல் தொடர்பும் தெளிவாக உள்ளன.
  terminology: ‘லெகியோன்’ பெயரின் எழுத்துப்பெயர்ப்பாகச் செயல்படுகிறது. அடிக்குறிப்பு இலத்தீன் இராணுவப் பின்னணியையும் ரோமப் படையின் பெரிய பிரிவையும் தகுந்த அளவில் விளக்குகிறது; இது பெயர் என்றும் பலரை உணர்த்தும் சொல்லாகவும் இச்சூழலில் இயங்குவதைச் சரியாகக் குறிப்பிடுகிறது.
