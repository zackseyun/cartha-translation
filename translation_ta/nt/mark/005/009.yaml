source:
  edition: SBLGNT
  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: ta
  text: அவர் அவனிடம், “உன் பெயர் என்ன?” என்று கேட்டுக்கொண்டிருந்தார். அதற்கு அவன், “என் பெயர் லெகியோன்[a]; ஏனெனில் நாங்கள் பலர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லெகியோன்” என்பது கிரேக்கத்தில் ஏற்றுக்கொள்ளப்பட்ட இலத்தீன் இராணுவச் சொல்; அது ரோமப் படையின் ஒரு பெரும் பிரிவைக் குறிக்கும். இங்கு அது பேய் கூறும் பெயராக இருந்து, பெரும் எண்ணிக்கையையும் உணர்த்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: கேட்டுக்கொண்டிருந்தார்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்ச்சியான அல்லது மீள நிகழ்ந்த செயற்பாங்கைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Τί ὄνομά σοι
  choice: உன் பெயர் என்ன?
  rationale: ὄνομα + நான்காம் வேற்றுமைப் பிரதிப்பெயரால் அமைந்த கிரேக்க மரபுத்தொடரின் நேரடியும் இயல்புமான நவீனத் தமிழ் வடிவம்.
- source_word: λέγει αὐτῷ
  choice: அதற்கு அவன் … என்றான்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் கதை உயிர்ப்பைத் தமிழில் சொற்சொல்லாகப் பின்பற்றுவது இயல்பற்றதாக இருப்பதால், உரையாடல் ஓட்டத்திற்கேற்ற இறந்தகால வடிவம் பயன்படுத்தப்பட்டுள்ளது; αὐτῷ என்பதன் தொடர்பை ‘அதற்கு’ காட்டுகிறது.
- source_word: Λεγιὼν
  choice: லெகியோன்
  rationale: இங்கு இது மொழிபெயர்க்கப்பட வேண்டிய பொதுப்பெயராக அல்லாமல், பேசுபவன் கூறும் பெயர் அல்லது அடையாளப்பெயராக வருகிறது; கிரேக்க ஒலிவடிவத்திற்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: ὄνομά μοι
  choice: என் பெயர்
  rationale: கிரேக்கப் பெயர்ச்சொல் வாக்கியத்தின் இயல்பான தமிழ் இணை; சுயஅடையாளப்படுத்தலைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ὅτι πολλοί ἐσμεν
  choice: ஏனெனில் நாங்கள் பலர்
  rationale: ὅτι பெயருக்கான காரணத்தைத் தருகிறது; ‘நாங்கள்’ என்ற பன்மையையும் πολλοί என்பதன் ‘பலர்’ என்ற பொருளையும் அப்படியே காக்கிறது.
theological_decisions:
- issue: பேசுபவனின் தன்மைச் சுட்டலில் ஒருமையிலிருந்து பன்மைக்கு மாறுதல்
  choice: ‘என் பெயர்’ என்ற ஒருமையையும் ‘நாங்கள் பலர்’ என்ற பன்மையையும் மாற்றாமல் வைத்தல்
  alternative: ‘எங்கள் பெயர் லெகியோன்’ என்று ஒருமை–பன்மை இழுபறியைச் சீராக்குதல்
  rationale: கிரேக்க உரை ஒருமையான சுயஅடையாளத்திலிருந்து பன்மையான விளக்கத்திற்குத் திட்டவட்டமாக மாறுகிறது. ஒரே மனிதன் வழியாகப் பேசும் பல பேய்களின் எண்ணிக்கையை உணர்த்தும் இந்தத் தெய்வியல் மற்றும் நாடகத் தன்மையுள்ள இழுபறியை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ இயேசுவுக்கான மரியாதை ஒருமையையும், ‘அவன்’ பேய் பிடித்த மனிதன் வழியாகப் பதிலளிக்கும் பேச்சாளரையும் வேறுபடுத்துகிறது. மூலத்தின் தொடர்ச்சியான கேள்விச் செயற்பாங்கும் ஒருமை–பன்மை மாற்றமும் பாதுகாக்கப்பட்டுள்ளன.
