  source_fidelity: The draft accurately represents the historical presents ἔρχονται and θεωρεῖ as நிகழ்காலம், identifies the singular subject as Jesus from context, and conveys θόρυβον together with the two participial descriptions of mourners. “உரக்கப் புலம்பிக்கொண்டும்” suitably expresses ἀλαλάζοντας πολλά without overstating a ritual or doctrinal detail.
