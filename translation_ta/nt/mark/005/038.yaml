id: MRK.5.38
reference: Mark 5:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: ta
  text: அவர்கள் ஜெபக்கூடத் தலைவரின் வீட்டிற்கு வருகிறார்கள். அங்கே அவர் அமளியையும்[a], அழுதுகொண்டும் உரக்கப் புலம்பிக்கொண்டும் இருந்தவர்களையும் காண்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூச்சலும் குழப்பமும்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: வருகிறார்கள்
  rationale: கதை நிகழ்வை நேரில் காண்பதுபோல் எடுத்துரைக்கும் கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாக வைத்திருக்கிறது.
- source_word: οἶκον
  choice: வீட்டிற்கு
  rationale: οἶκος என்பதன் நேரடியான, இயல்பான தமிழ் இணைச்சொல் ‘வீடு’.
- source_word: ἀρχισυναγώγου
  choice: ஜெபக்கூடத் தலைவர்
  rationale: யூத ஜெபக்கூடத்தை வழிநடத்திய அல்லது நிர்வகித்த பொறுப்பாளரைக் குறிக்கும் பதவிப்பெயரை, பழமையான ஆட்சிச் சொற்கள் இன்றி தெளிவாகத் தருகிறது.
- source_word: θεωρεῖ
  choice: காண்கிறார்
  rationale: ஒரு காட்சியை உற்றுக் காண்பதைக் குறிக்கும் வினையை இயல்பான தமிழில் தருகிறது; ஒருமை எழுவாய் சூழலில் இயேசுவைக் குறிக்கிறது.
- source_word: θόρυβον
  choice: அமளி
  rationale: வெறும் ஒலியை மட்டுமல்லாமல், துக்கம் அனுசரிக்கும் இடத்திலிருந்த கூச்சலும் பரபரப்பும் கலந்த குழப்பத்தைக் குறிக்கிறது.
- source_word: κλαίοντας
  choice: அழுதுகொண்டிருந்தவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் பங்கேற்பு வினையை, செயலில் ஈடுபட்ட மக்களைக் குறிக்கும் இயல்பான தமிழாகத் தருகிறது.
- source_word: ἀλαλάζοντας
  choice: புலம்பிக்கொண்டிருந்தவர்கள்
  rationale: துக்கத்தில் எழுப்பப்படும் உரத்த அழுகுரல் அல்லது புலம்பலைச் சூழலுக்கேற்ற வகையில் வெளிப்படுத்துகிறது.
- source_word: πολλά
  choice: உரக்க
  rationale: ἀλαλάζοντας என்பதை வலுப்படுத்தும் வினையடைப் பயன்பாட்டை, இயல்பான தமிழில் அந்தப் புலம்பலின் மிகுந்த ஒலியைக் காட்டுமாறு தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் வரலாற்று நிகழ்காலம் தக்கவைக்கப்பட்டுள்ளது; ‘அவர்’ என்ற ஒருமைச் சுட்டுப்பெயர் சூழலில் இயேசுவைக் குறிக்கிறது.
