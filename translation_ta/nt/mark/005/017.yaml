translation_notes:
  register: நவீன தரநிலைத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான கதைநடை. வேண்டுகோளின் தீவிரமும், அவர்கள் இயேசு தங்கள் பகுதியை விட்டு அகல வேண்டும் எனக் கேட்டதுமாகிய மூலத்தின் பொருள் பாதுகாக்கப்பட்டுள்ளது.
