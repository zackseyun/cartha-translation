  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: ta
  text: அவர்கள் தங்கள் பகுதியைவிட்டு அவர் போய்விடும்படி அவரிடம் கெஞ்சத் தொடங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் பிரதேசத்திலிருந்து அவர் புறப்பட்டுப் போகும்படி அவரை வற்புறுத்தத் தொடங்கினார்கள்.”
    reason: παρακαλεῖν என்பதற்கு இச்சூழலில் ‘கெஞ்ச’ அல்லது ‘வற்புறுத்த’ என்றும், ὅρια என்பதற்கு ‘பகுதி’ அல்லது ‘பிரதேசம்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: καὶ
  choice: அப்போது
  rationale: முந்தைய நிகழ்வுடன் வசனத்தை இயல்பாக இணைக்கிறது. καί அடிப்படையில் இணைப்புச் சொல் என்றாலும், தொடர்ச்சியான தமிழ் கதைநடையில் ‘அப்போது’ இயல்பாக உள்ளது; இது வலுவான புதிய காலக் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: ἤρξαντο
  choice: தொடங்கினார்கள்
  rationale: இன்ஃபினிட்டிவுடன் வரும் ἄρχω என்பதன் தொடக்கநிலைப் பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: παρακαλεῖν
  choice: கெஞ்ச
  rationale: இச்சூழலில் வேண்டுகோளின் தீவிரத்தை ‘கெஞ்ச’ தெளிவாக வெளிப்படுத்துகிறது; ‘வற்புறுத்த’ என்பதும் சாத்தியம், ஆனால் அது வேண்டுதலைவிட அழுத்தத்தை முன்னிறுத்தக்கூடும்.
- source_word: αὐτὸν
  choice: அவரிடம்
  rationale: இது இயேசுவைக் குறிக்கிறது. ‘கெஞ்சுதல்’ என்ற தமிழ் வினையுடன் வேண்டுகோள் செலுத்தப்படும் நபரை ‘அவரிடம்’ எனக் குறிப்பது இயல்பானது.
- source_word: ἀπελθεῖν
  choice: போய்விடும்படி
  rationale: அவர்களுடைய வேண்டுகோளின் உள்ளடக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இடத்தைவிட்டு அகல்வது என்ற பொருளும் தெளிவாக உள்ளது.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: தங்களுடைய பகுதியைவிட்டு
  rationale: ὅρια என்பதன் சொற்பொருள் ‘எல்லைகள்’ என்றாலும், இங்கு அது அவற்றுக்குள் உள்ள நிலப்பகுதி அல்லது பிரதேசத்தைக் குறிக்கிறது. ‘பகுதி’ என்பது சாதாரண வாசகருக்குத் தெளிவான இயல்பான தேர்வு.
