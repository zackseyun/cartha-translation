  text: καὶ διεστείλατο αὐτοῖς πολλὰ ἵνα μηδεὶς γνοῖ τοῦτο, καὶ εἶπεν δοθῆναι αὐτῇ φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: ta
  text: இதை யாரும் அறிந்துகொள்ளக் கூடாது என்று அவர் அவர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார்[a]. மேலும், அவளுக்குச் சாப்பிட ஏதாவது கொடுக்கும்படி சொன்னார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர் அவர்களுக்கு மீண்டும் மீண்டும் கடுமையாகக் கட்டளையிட்டார்’ அல்லது ‘மிக உறுதியாக அறிவுறுத்தினார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரில் கட்டளையை வலுப்படுத்தும், சொல்லுக்குச் சொல் ‘பலவற்றை/மிகுதியாக’ என்று பொருள்படும் சொல் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவளுக்குச் சாப்பிடக் கொடுக்கப்படும்படி சொன்னார்.’ இங்கு சாப்பிடுவதற்கான உணவு மறைமுகமாகக் குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο … πολλὰ
  choice: கண்டிப்பாகக் கட்டளையிட்டார்
  rationale: διαστέλλομαι என்பது வலுவான கட்டளை அல்லது எச்சரிக்கையைக் குறிக்கிறது; πολλὰ இங்கு அந்தக் கட்டளையின் தீவிரத்தை வலுப்படுத்துகிறது. இந்தத் தமிழ் வடிவம் மூலத்தின் வலிமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: அங்கு இருந்தவர்களைக் குறிக்கும் மறைமுகச் செயப்படுபொருள்; தமிழில் ‘அவர்களுக்குக் கட்டளையிட்டார்’ என்பது இயல்பான அமைப்பு.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: இதை யாரும் அறிந்துகொள்ளக் கூடாது என்று
  rationale: ἵνα உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் கட்டளையின் நோக்கத்தைத் தெரிவிக்கிறது. ‘அறிந்துகொள்ள’ என்பது γινώσκω-வின் இச்சூழலிலுள்ள ‘தெரிந்துகொள்ளுதல்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: மூலத்தில் உள்ள பொதுவான ‘சொன்னார்’ என்ற பொருளை நேரடியாக வைத்துக்கொண்டு, தொடர்ந்து வரும் infinitive அமைப்பின் கட்டளைத் தன்மையைத் தமிழ் வாக்கிய அமைப்பு வெளிப்படுத்துகிறது.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: அவளுக்குச் சாப்பிட ஏதாவது கொடுக்கும்படி
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அவளுக்குச் சாப்பிடக் கொடுக்கப்பட’ என்பதாக இருந்தாலும், உணவைக் குறிக்கும் மறைமுகப் பொருளை ‘ஏதாவது’ என்று வெளிப்படுத்துவது இயல்பான நவீன தமிழை அளிக்கிறது; மூலத்தின் passive வடிவம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளையின் வரம்பும் மாற்கு நற்செய்தியிலுள்ள மறைவுக் கருப்பொருளும்
  choice: இந்த நிகழ்வை யாரும் அறிந்துகொள்ளக் கூடாது என்ற வலுவான கட்டளையாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: இது உடனிருந்த குடும்பத்தாருக்கும் சாட்சிகளுக்கும் மட்டும் உரிய கட்டளை என்று விளக்குவது, அல்லது மாற்குவின் விரிவான ‘மெசியா மறைவு’ கருப்பொருளை மொழிபெயர்ப்பிலேயே சேர்ப்பது.
  rationale: வசனம் கட்டளையிடப்பட்டவர்களையும் ‘யாரும்’ என்பதையும் மட்டும் கூறுகிறது; அதன் விரிவான இறையியல் காரணத்தை விளக்கவில்லை. ஆகவே அந்தத் தீர்க்கப்படாத பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘கண்டிப்பாகக் கட்டளையிட்டார்’ என்பது மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது; இரண்டாம் வாக்கியம் இயல்பான தமிழ் வழக்கிற்காக செய்பாட்டு அமைப்பில் தரப்பட்டு, மூலத்தின் passive வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
