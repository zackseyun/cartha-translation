lexical_decisions:
- source_word: Καὶ
  choice: அவர்கள்… வந்தார்கள்
  rationale: கிரேக்க இணைப்புச்சொல் தொடர்ச்சியான கதைநடையைச் சுட்டுகிறது; தமிழில் தனி வசனமாக இயல்பாக ஒலிக்க, அதைச் செயற்கையாக ‘மேலும்’ என மொழிபெயர்க்காமல் வாக்கியத் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: இறந்தகாலப் பன்மை வினை; முந்தைய சூழலில் இயேசுவையும் அவருடன் இருந்தவர்களையும் குறிக்கும் பன்மையை அப்படியே காக்கிறது.
- source_word: εἰς τὸ πέραν
  choice: மறுகரைக்கு
  rationale: நீர்நிலையின் எதிர்ப்பக்கத்தைச் சுட்டும் கிரேக்கச் சொற்றொடருக்கு இயல்பான, சுருக்கமான தமிழ்.
- source_word: τῆς θαλάσσης
  choice: கடலின்
  rationale: குறிப்பது கலிலேயக் கடல் எனப்படும் ஏரியாக இருந்தாலும், மூலத்தின் ‘கடல்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: εἰς τὴν χώραν
  choice: பகுதிக்கு
  rationale: χώρα இங்கு நவீன நாடு என்ற பொருளில் அல்லாமல் ஒரு நிலப்பகுதி அல்லது வட்டாரத்தைக் குறிக்கிறது.
- source_word: Γερασηνῶν
  choice: கெரசேனர்
  rationale: SBLGNT-இன் இன/இடப்பெயர்ச்சார்ந்த பன்மைப் பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்த்து வழங்குகிறது.
theological_decisions:
- issue: பேய் பிடித்த மனிதனைப் பற்றிய நிகழ்வில் காணப்படும் இடப்பெயர் சார்ந்த பாடவேறுபாடு
  choice: கெரசேனர்
  alternative: கதரேனர்; கெர்கெசேனர்
  rationale: SBLGNT மூலப்பாடம் Γερασηνῶν என வாசிக்கிறது. முக்கிய கையெழுத்துப் பிரதிகளில் வேறு இடப்பெயர்கள் இருப்பதால், முதன்மைப் பாடம்正文த்தில் வைக்கப்பட்டு மாற்றுப் பாடங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான கதைநடை. மூலத்தின் பன்மை, திசை, ‘கடல்’ என்ற சொல்லாட்சி, இடப்பெயர் பாடவேறுபாடு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
