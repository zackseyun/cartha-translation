  source_fidelity: மூலத்தின் பன்மை வினை, கடலின் எதிர்ப்பக்கம், χώρα என்பதன் வட்டாரப் பொருள், மற்றும் SBLGNT-இன் Γερασηνῶν வாசிப்பு ஆகியவை வரைவில் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் «கெரசேனர் பகுதிக்கு» என்பதில் உடைமை/தொடர்புறவு இணைப்பு இல்லாததால், τὴν χώραν τῶν Γερασηνῶν (‘கெரசேனரின் பகுதி’) என்ற அமைப்பு தமிழில் தெளிவாக வெளிப்படவில்லை.
