source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: ta
  text: அவன் புறப்பட்டுப் போய், இயேசு தனக்குச் செய்த அனைத்தையும்[a] தெக்கப்போலி பகுதியில் அறிவிக்கத் தொடங்கினான். எல்லாரும் வியப்படைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு தனக்கு எவ்வளவு செய்தார் என்பதை.”
    reason: ὅσα என்பது செய்யப்பட்ட அனைத்தையும் அல்லது அதன் அளவு/பெருமையையும் முன்னிறுத்தக்கூடும் என்ற சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: புறப்பட்டுப் போய்
  rationale: அந்த இடத்திலிருந்து அகன்று சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἤρξατο κηρύσσειν
  choice: அறிவிக்கத் தொடங்கினான்
  rationale: ἤρξατο என்பதன் தொடக்கநிலையையும், κηρύσσειν என்பதன் பொதுவெளியில் அறிவித்தல் என்ற பரந்த பொருளையும் காக்கிறது; முறையான பிரசங்கச் சூழலைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: ἐν τῇ Δεκαπόλει
  choice: தெக்கப்போலி பகுதியில்
  rationale: ἐν என்பதன் ‘இல்’ என்ற இடப்பொருளைத் தக்கவைத்து, பத்து நகரங்கள் அடங்கிய நிலப்பகுதியைக் குறிக்கும் பெயரைத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ὅσα
  choice: அனைத்தையும்
  rationale: இயேசு செய்தவற்றின் முழுத் தொகுப்பைக் குறிக்கும் இயல்பான தமிழ். அளவு அல்லது பெருமையை முன்னிறுத்தும் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐποίησεν αὐτῷ
  choice: தனக்குச் செய்த
  rationale: இங்கு αὐτῷ என்பது அவனுடைய நலனுக்காக இயேசு செய்ததைக் குறிக்கிறது; தமிழில் ‘தனக்குச் செய்த’ என்பது சூழலுக்கு ஏற்ற இயல்பான வடிவம்.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: மனிதர்களைக் குறிக்கும் πάντες என்பதற்கான நேரடியும் இயல்புமான கூட்டுப்பொருள் வடிவம்.
- source_word: ἐθαύμαζον
  choice: வியப்படைந்தார்கள்
  rationale: மக்களின் வியப்பை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் சூழலில் நீடித்த அல்லது மீண்டும் மீண்டும் ஏற்பட்ட வியப்பை உணர்த்தலாம்.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
theological_decisions:
- issue: அந்த மனிதனின் அறிவிப்பு இயேசுவின் அடையாளத்தை எவ்வாறு சுட்டுகிறது
  choice: இயேசு தனக்குச் செய்ததை அவன் அறிவித்தான் என்று உரை கூறும் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: இயேசுவின் தெய்வீக அதிகாரத்தை வெளிப்படையாக விளக்கும் இறையியல் விரிவாக்கம்.
  rationale: வசனம் இயேசுவின் வல்லமையை மறைமுகமாக உணர்த்தினாலும், தனியான கோட்பாட்டு முடிவை வெளிப்படையாகக் கூறவில்லை; ஆகவே கதையின் இறையியல் அழுத்தம் விளக்கச் சேர்க்கையின்றி காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் கொண்ட நடை. ‘அறிவிக்க’ என்பது முறையான பிரசங்கச் சூழலைச் சேர்க்காமல் பொதுவெளிப் பிரகடனத்தைத் தெரிவிக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
