source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: ta
  text: உடனே அவளுடைய இரத்தப்போக்கின் ஊற்று வற்றிப்போனது[a]. அந்த வாதையிலிருந்து[b] தான் குணமடைந்துவிட்டதை அவள் தன் உடலில் அறிந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய இரத்தத்தின் ஊற்று வற்றிப்போனது.” கிரேக்கச் சொல் ஓர் ஊற்று அல்லது மூலத்தைக் குறிக்கும் உயிரோட்டமான படிமத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “வாதை” என்பதற்கான கிரேக்கச் சொல் நேரடியாக “சாட்டை” என்றும், உருவகமாகக் கொடிய துன்பம் அல்லது பீடை என்றும் பொருள்படும். இங்கே அது அவளுடைய வேதனைமிக்க உடல்நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரையில் நிகழ்வின் உடனடித்தன்மையையும் கதைநடையின் வேகத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐξηράνθη
  choice: வற்றிப்போனது
  rationale: ξηραίνω என்பதன் ‘உலர்தல்/வற்றுதல்’ என்ற உயிரோட்டமான படிமத்தைத் தக்கவைத்து, இரத்தப்போக்கு நின்றதைச் சூழலுக்கேற்ற தமிழில் தெரிவிக்கிறது.
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: அவளுடைய இரத்தத்தின் ஊற்று
  rationale: πηγή என்பதன் நேரடியான ‘ஊற்று/மூலம்’ என்ற படிமத்தைப் பாதுகாக்கிறது; வெறுமனே ‘இரத்தப்போக்கு’ என்று மொழிபெயர்ப்பதைவிட மூல உரையின் உருவகத்தை நெருக்கமாகக் கொண்டுள்ளது.
- source_word: ἔγνω τῷ σώματι
  choice: தன் உடலில் அவள் அறிந்தாள்
  rationale: ἔγνω என்பதன் ‘அறிந்தாள்’ என்ற அறிவுணர்வையும், τῷ σώματι குறிக்கும் உடல்சார்ந்த உணர்வையும் இரண்டையும் காக்கிறது; ‘உணர்ந்தாள்’ என்று மட்டும் கூறி அறிவுணர்வைச் சுருக்கவில்லை.
- source_word: ἴαται
  choice: குணமடைந்துவிட்டதை
  rationale: நிறைவுற்ற குணமாக்குதலையும் அதன் தொடரும் விளைவையும் கிரேக்க perfect வடிவத்துக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τῆς μάστιγος
  choice: அந்த வாதையிலிருந்து
  rationale: μάστιξ என்பதன் நேரடி ‘சாட்டை’ என்ற பொருளுக்குப் பதிலாக இச்சூழலில் குறிக்கப்படும் கொடிய உடல் துன்பத்தை ‘வாதை’ எனத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: குணமடைதலின் தன்மை
  choice: இரத்தப்போக்கு உண்மையாகவும் உடனடியாகவும் நின்றதையும், அதை அவள் தன் உடலில் அறிந்ததையும் இரு தனித்த கூறுகளாக மொழிபெயர்த்தல்
  alternative: அவள் குணமடைந்ததாக வெறுமனே உணர்ந்தாள் என்று அகநிலை அனுபவமாக மட்டும் மொழிபெயர்த்தல்
  rationale: மூல உரை உடலில் நிகழ்ந்த மாற்றத்தையும் அதைப் பற்றிய பெண்ணின் உடல்சார்ந்த அறிவையும் இணைத்துக் கூறுகிறது; குணமாக்குதலின் செயல்முறை அல்லது காரணம் குறித்து உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரத்தத்தின் ஊற்று’ என்ற சற்றே அசாதாரணமான சொல்லாட்சி மூல கிரேக்கத்தின் தெளிவான படிமத்தைப் பாதுகாக்க நோக்கத்துடன் வைக்கப்பட்டு, அடிக்குறிப்பில் இயல்பான மாற்று வழங்கப்பட்டுள்ளது. ‘வாதை’ என்பது ‘சாட்டை’ என்ற நேரடிப் பொருளைத் தவிர்த்து, இச்சூழலின் கடுமையான நோய்த்துன்பத்தை சமயப் பிரிவுசார் விளக்கமின்றி வெளிப்படுத்துகிறது.
