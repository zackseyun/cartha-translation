id: MRK.5.21
reference: Mark 5:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: ta
  text: இயேசு படகில் மீண்டும் மறுகரைக்குக் கடந்து சென்றபின், பெரும் மக்கள் கூட்டம் அவரைச் சுற்றிக் கூடியது. அவர் கடலோரத்தில்[a] இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது கலிலேயா கடலைக் குறிக்கிறது; உண்மையில் இது ஓர் ஏரி என்றாலும், நற்செய்தி நூல்களில் வழக்கமாக ‘கடல்’ என்று அழைக்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: கடந்து சென்றபின்
  rationale: இறந்தகாலப் பங்கேற்புவினையுடன் அமைந்த தனிநிலை உருபுத்தொடர், முதலில் நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் காலவரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ πλοίῳ
  choice: படகில்
  rationale: மூலத்தின் முன்னிடைச்சொல் தொடரைச் சுருக்கமின்றித் தக்கவைக்கிறது; கலிலேயக் கடல் நிகழ்வுக்கு நவீனத் தமிழில் ‘படகு’ இயல்பான சொல்.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் மறுபடியும் நிகழ்ந்ததை நேரடியாகத் தெரிவிக்கிறது.
- source_word: εἰς τὸ πέραν
  choice: மறுகரைக்கு
  rationale: ஏரியைக் கடந்து எதிர்ப்புறக் கரைக்குச் சென்றதைச் சூழலுக்கேற்ற இயல்பான தமிழில் குறிக்கிறது.
- source_word: συνήχθη
  choice: கூடினார்கள்
  rationale: கிரேக்கத்தில் வினை செயல்பாட்டு வடிவில் இல்லாவிட்டாலும், கூட்டம் ஒன்றுகூடிய நிகழ்வைத் தமிழில் இயல்பாகச் செயப்படுபொருள் குன்றிய வினையாக அளிக்கிறது.
- source_word: ὄχλος πολὺς
  choice: பெருந்திரளான மக்கள்
  rationale: கூட்டத்தின் அளவைத் தெளிவாகவும், சாதாரண வாசகருக்கு இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπ’ αὐτόν
  choice: அவரைச் சுற்றி
  rationale: மக்கள் இயேசுவை நோக்கி வந்து அவரைச் சூழ்ந்து கூடிய இடவுணர்வை இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: παρὰ τὴν θάλασσαν
  choice: கடலின் அருகே
  rationale: கரையோரத்தில், கடலுக்குப் பக்கத்தில் இருந்த இடத்தைக் குறிக்கும் மூலத்தின் பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: θάλασσαν
  choice: கடல்
  rationale: நீர்நிலை புவியியல் வகையில் ஏரியாக இருந்தாலும், மூல கிரேக்கச் சொல்லான ‘கடல்’ என்பதைக் பிரதான உரையில் தக்கவைத்து விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
