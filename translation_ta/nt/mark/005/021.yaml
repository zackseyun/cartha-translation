translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. காலவரிசை, படகுப் பயணம், மறுகரை, கூட்டம் இயேசுவைச் சூழ்தல், கடலருகிலான இடம் ஆகிய மூல விவரங்கள் தக்கவைக்கப்பட்டுள்ளன.
