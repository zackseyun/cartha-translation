id: MRK.5.22
reference: Mark 5:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: ta
  text: யூத வழிபாட்டுக்கூடத் தலைவர்களில் ஒருவரான யவீரு வந்து, இயேசுவைக் கண்டதும் அவருடைய காலடியில் விழுந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் காட்சியை உயிரோட்டமாக்கும் நிகழ்கால வினைகள் பயன்படுத்தப்பட்டுள்ளன: “வருகிறார் … விழுகிறார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: அங்கே வந்து
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தை, இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலத் தொடர்வினையாக மொழிபெயர்க்கிறது. சூழலில் வருகையின் இடம் தெளிவாக இருப்பதால் ‘அங்கே’ இயல்பான இணைப்பை வழங்குகிறது.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: யூத வழிபாட்டுக்கூடத் தலைவர்களில் ஒருவர்
  rationale: பகுதிப்பொருள் அமைப்பான ‘தலைவர்களில் ஒருவர்’ என்பதையும், ἀρχισυνάγωγος குறிக்கும் வழிபாட்டுக்கூட நிர்வாகத் தலைமைப் பொறுப்பையும் தெளிவாகப் பாதுகாக்கிறது. ‘யூத’ என்பது இன்றைய வாசகர்களுக்கு ‘வழிபாட்டுக்கூடம்’ எதைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: ὀνόματι Ἰάϊρος
  choice: யவீரு
  rationale: பெயரைக் குறிக்கும் கிரேக்க மரபுத்தொடர் தமிழில் ‘ஒருவரான யவீரு’ என்ற இயல்பான அடையாள அமைப்பில் வழங்கப்படுகிறது; ‘யவீரு’ என்பது தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἰδὼν αὐτὸν
  choice: இயேசுவைக் கண்டதும்
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் காலத் தொடர்பையும் உடன்தொடரும் செயலையும் இயல்பான தமிழில் காட்டுகிறது. சூழலில் αὐτόν இயேசுவைக் குறிப்பதால் பெயர் வெளிப்படையாக வழங்கப்படுகிறது.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: அவருடைய காலடியில் விழுந்தார்
  rationale: உடலால் ஒருவரின் காலடியில் விழும் செயலை இயல்பாகவும் மரியாதைநிலைக்கு ஏற்றவாறும் தருகிறது; வழிபாடு என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் காலடியில் விழுந்த செயலின் பொருள்
  choice: அவருடைய காலடியில் விழுந்தார்
  alternative: அவரை வழிபட்டார்
  rationale: கிரேக்கம் உடல்செயலை மட்டுமே நேரடியாக விவரிக்கிறது. அது மரியாதை, வேண்டுதல் அல்லது துயரமிகு அவசரத்தை வெளிப்படுத்தலாம்; ‘வழிபட்டார்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத இறையியல் முடிவைச் சேர்த்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபக்கூடம்’ அல்லது ஒலிபெயர்க்கப்பட்ட ‘சினகோகு’ என்பவற்றைவிட ‘யூத வழிபாட்டுக்கூடம்’ சாதாரண வாசகருக்கு உடனடியாகத் தெளிவாக இருக்கும். வரலாற்று நிகழ்காலம் முதன்மை உரையில் இயல்பான தமிழ் இறந்தகாலமாக வழங்கப்பட்டு, அதன் உயிரோட்டமான மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
