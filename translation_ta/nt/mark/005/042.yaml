  source_fidelity: மூலத்தின் இரு εὐθύς சொற்களும் “உடனே” எனத் துல்லியமாகக் காக்கப்பட்டுள்ளன. ἀνέστη, κοράσιον, வயது விளக்கம், மற்றும் ἐξέστησαν ἐκστάσει μεγάλῃ என்ற தீவிர வியப்பு வெளிப்பாடு ஆகியவை பொருத்தமாக மொழிபெயர்க்கப்பட்டுள்ளன. “நடக்கத் தொடங்கினாள்” என்பது περιεπάτει என்ற தொடர்நிலைச் செயலைக் கதைநடைக்கு இயல்பாக வழங்குகிறது; சூழலில் அது உடனடியாகத் தொடங்கிய நடையையும் நன்கு உணர்த்துகிறது.
  naturalness: உரை நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதையான கதைநடையுடனும் உள்ளது. “அந்தச் சிறுமி எழுந்து நடக்கத் தொடங்கினாள்” மற்றும் “பெரும் வியப்பில் திகைத்துப்போனார்கள்” ஆகியவை வாசிப்பிற்கு இயல்பானவை.
  terminology: “சிறுமி,” “எழுந்து,” “நடக்கத் தொடங்கினாள்,” “பெரும் வியப்பு,” “திகைத்துப்போனார்கள்” ஆகிய தெரிவுகள் மூலத்தின் பொருளைச் சுமத்தாமல் சரியாக வழங்குகின்றன. “உயிர்த்தெழுந்து” போன்ற கூடுதல் இறையியல் வலியுறுத்தலைத் தவிர்த்திருப்பது பொருத்தமானது.
