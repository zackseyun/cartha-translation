language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: ta
  text: உடனே அந்தச் சிறுமி எழுந்து நடக்கத் தொடங்கினாள்[a]; ஏனெனில் அவளுக்குப் பன்னிரண்டு வயது. உடனே அவர்கள் பெரும் வியப்பில் திகைத்துப்போனார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எழுந்து நின்றாள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மிகுந்த வியப்பால் வியந்துபோனார்கள்” எனச் சொற்சொல்லாக மொழிபெயர்க்கலாம். தீவிரமான வியப்பை வலியுறுத்த கிரேக்கத்தில் தொடர்புடைய வினையும் பெயர்ச்சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் வேகமான கதைநடையை இயல்பான நவீனத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: ἀνέστη
  choice: எழுந்து
  rationale: சிறுமி இயேசுவின் கட்டளைக்குப் பின் உடலோடு எழுந்த செயலைக் குறிக்கிறது; உயிர்த்தெழுதல் சார்ந்த இறையியல் பொருளை தேவையின்றி வலுப்படுத்தாமல், வினையின் இயல்பான பொருளைக் காக்கிறது.
- source_word: τὸ κοράσιον
  choice: அந்தச் சிறுமி
  rationale: குறிப்பிட்ட பெண் குழந்தையை இயல்பாகச் சுட்டுகிறது; அடுத்த கூற்றில் அவளுடைய வயது தெளிவாகக் கொடுக்கப்படுவதால் கூடுதல் வயது விளக்கம் தேவையில்லை.
- source_word: περιεπάτει
  choice: நடக்கத் தொடங்கினாள்
  rationale: இறந்தகாலத் தொடர்நிலை வினை உணர்த்தும், எழுந்தபின் தொடங்கி தொடர்ந்த நடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: ஏனெனில் அவளுக்குப் பன்னிரண்டு வயது
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும், வயதைக் கூறும் இயல்பான தமிழ் வழக்கையும் காக்கிறது.
- source_word: ἐξέστησαν
  choice: திகைத்துப்போனார்கள்
  rationale: சாதாரண வியப்பைவிட ஆழமாக உலுக்கிய திகைப்பைத் தெரிவிக்கிறது; இன்றைய தமிழில் தவறான பொருள் தரக்கூடிய ‘பரவசம்’ போன்ற சொல்லைத் தவிர்க்கிறது.
- source_word: ἐκστάσει μεγάλῃ
  choice: பெரும் வியப்பில்
  rationale: அவர்களை ஆட்கொண்ட தீவிரமான வியப்பு நிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀνέστη என்பதில் உயிர்த்தெழுதல் சார்ந்த நுண்ணுணர்வு இருக்கக்கூடிய சாத்தியம்
  choice: எழுந்து
  alternative: உயிர்த்தெழுந்து
  rationale: சூழல் சிறுமி உயிர்பெற்றதைத் தெளிவாக்கினாலும், இவ்வினை தனியாக ‘எழுதல்’ அல்லது ‘எழுந்து நிற்றல்’ என்றும் பொருள்படும். ஆகவே மூலமொழி கூறுவதைவிட அதிகமான கோட்பாட்டுச் சுமையைச் சேர்க்காமல் அதன் உண்மையான பொருள் அகலத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘அந்தச் சிறுமி,’ ‘நடக்கத் தொடங்கினாள்,’ ‘பெரும் வியப்பில் திகைத்துப்போனார்கள்’ ஆகியவை இயல்பான கதைநடையையும் மூலத்தின் தீவிரத்தையும் காக்கின்றன; இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
