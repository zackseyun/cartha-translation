  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: ta
  text: இயேசுவைப் பற்றிக் கேள்விப்பட்ட அவள், கூட்டத்திற்குள் அவருக்குப் பின்னால் வந்து, அவருடைய ஆடையைத் தொட்டாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆடை” என்பதை “மேலங்கி” அல்லது “உடை” என்றும் மொழிபெயர்க்கலாம். ἱμάτιον என்ற கிரேக்கச் சொல் பொதுவாக ஓர் ஆடையைக் குறிக்கிறது; அது பெரும்பாலும் மேலாடையாக இருக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: கேள்விப்பட்ட
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் பெண்பால் ஒருமையையும், முதன்மைச் செயலுக்கு முன்பு அவள் கேள்விப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: இயேசுவைப் பற்றி
  rationale: περί உடன் வரும் மரபுவழிப் பொருளான ‘பற்றி/குறித்து’ என்பதை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἐλθοῦσα
  choice: வந்து
  rationale: முதன்மை வினைக்கு வழிவகுக்கும் பங்கேற்பு வினைத் தொடரைத் தமிழின் இயல்பான வினையெச்ச வடிவில் காக்கிறது.
- source_word: ἐν τῷ ὄχλῳ
  choice: கூட்டத்திற்குள்
  rationale: கூட்டத்தின் நடுவே அவள் நகர்ந்து வந்த சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὄπισθεν
  choice: அவருக்குப் பின்னால்
  rationale: அவள் இயேசுவின் பின்புறத்திலிருந்து அணுகிய இடநிலையைச் சூழலிலிருந்து தெளிவுபடுத்துகிறது.
- source_word: ἥψατο
  choice: தொட்டாள்
  rationale: இச்சூழலில் ἅπτω என்பதன் இயல்பான பொருளை வழங்கி, பிடித்துக்கொண்டாள் போன்ற தேவையற்ற வலிமையையோ நீடிப்பையோ சேர்க்கவில்லை.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: அவருடைய ஆடையை
  rationale: ἱμάτιον குறிக்கும் ஒரு ஆடை, பெரும்பாலும் மேலாடை, என்ற பரந்த பொருளைக் காக்கிறது; குறிப்பிட்ட நவீன உடை வகையைத் திணிக்கவில்லை.
