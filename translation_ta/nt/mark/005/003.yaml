  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இரட்டை மறுப்பு தமிழில் இயல்பான ‘யாராலும் முடியவில்லை’ என்றும், οὐδέ-யின் வலியுறுத்தல் ‘சங்கிலியால்கூட’ என்றும் வழங்கப்பட்டுள்ளது.
