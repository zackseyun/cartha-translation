source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: ta
  text: அவன் கல்லறைகளுக்கிடையே குடியிருந்தான்[a]. அவனைச் சங்கிலியால்கூட கட்டிவைக்க இனி யாராலும் முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “கல்லறைகளில் குடியிருந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: குடியிருந்தான்
  rationale: ‘குடியிருப்பைக் கொண்டிருந்தான்’ என்பது தமிழில் செயற்கையாக ஒலிக்கும். இந்தக் கிரேக்கச் சொற்றொடர் ஒருவன் வழக்கமாக வாழ்ந்த இடத்தைக் குறிக்கிறது; ‘குடியிருந்தான்’ அதன் தொடர்ச்சியான வாழ்வையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τοῖς μνήμασιν
  choice: கல்லறைகளுக்கிடையே
  rationale: μνῆμα என்பது கல்லறை அல்லது அடக்க இடத்தைக் குறிக்கிறது. ‘கல்லறைகளுக்கிடையே’ என்பது அந்தப் பகுதியிலேயே அவன் வாழ்ந்ததை இயல்பாகக் கூறுகிறது; எப்போதும் ஒரு கல்லறையின் உள்ளேயே இருந்தான் என்று தேவையின்றிக் குறிப்பதில்லை.
- source_word: οὐδὲ ἁλύσει
  choice: சங்கிலியால்கூட
  rationale: 'ἅλυσις ஒருமையில் உள்ளது. ‘-கூட’ என்பது οὐδέ தரும் வலியுறுத்தலைப் பாதுகாக்கிறது: சங்கிலியைப் பயன்படுத்தினாலும் அவனைக் கட்டிவைக்க முடியவில்லை.'
- source_word: οὐκέτι
  choice: இனி
  rationale: முன்பு சாத்தியமாக இருந்த நிலை இப்போது முடிந்துவிட்டதை οὐκέτι குறிக்கிறது. ‘இனி’ என்பது இந்த மாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐδύνατο
  choice: முடியவில்லை
  rationale: δύναμαι இங்கு கடந்தகாலத்தில் தொடர்ந்த இயலாமையைக் குறிக்கிறது; ‘முடியவில்லை’ அதற்கான இயல்பான தமிழ் இணை.
- source_word: δῆσαι
  choice: கட்டிவைக்க
  rationale: δέω என்பது உடல்ரீதியாகக் கட்டுவதைக் குறிக்கிறது. சங்கிலி பற்றிய சூழலில் ‘கட்டிவைக்க’ என்பது வெறும் பொதுவான ‘அடக்க’ என்பதைவிடத் துல்லியமானது.
