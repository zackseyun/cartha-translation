  source_fidelity: தமிழ் உரை κατοίκησιν εἶχεν என்பதன் வழக்கமான வசிப்பிடக் கருத்தை ‘குடியிருந்தான்’ என இயல்பாகத் தருகிறது. ἐν τοῖς μνήμασιν என்பதற்கு ‘கல்லறைகளுக்கிடையே’ பொருத்தமானது; அடக்க இடங்களின் பகுதியில் வாழ்ந்தான் என்பதைக் குறிக்கிறது; அவன் எப்போதும் ஒரு கல்லறைக்குள் இருந்தான் என்று அளவுக்கு மீறிக் கூறவில்லை. οὐκέτι, οὐδέ ἁλύσει, மற்றும் δῆσαι ஆகியவற்றின் பொருள்கள் முறையே ‘இனி’, ‘சங்கிலியால்கூட’, ‘கட்டிவைக்க’ என்பவற்றில் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கதைநடைக்கு ஏற்றவாறும் உள்ளது. ‘அவனைச் சங்கிலியால்கூட கட்டிவைக்க இனி யாராலும் முடியவில்லை’ என்பது இயல்பான வாக்கிய அமைப்பு; வலியுறுத்தலும் தொடர்ச்சியான இயலாமையும் தெளிவாகின்றன.
  terminology: ‘கல்லறைகள்’ μνήματα-க்கு சூழலுக்கு ஏற்ற பொதுவான சொல். ‘சங்கிலி’ ἅλυσις-க்கு துல்லியமானது; ஒருமைச் சொல்லாகவே உள்ளது. ‘கட்டிவைக்க’ உடல்ரீதியான பிணைப்பைச் சரியாக வெளிப்படுத்துகிறது. இறையியல் சார்ந்த சிறப்புச் சொற்கள் இவ்வசனத்தில் இல்லை.
