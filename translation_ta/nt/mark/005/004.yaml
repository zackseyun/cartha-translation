id: MRK.5.4
reference: Mark 5:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: ta
  text: ஏனெனில், அவன் பலமுறை கால்விலங்குகளாலும் சங்கிலிகளாலும் கட்டப்பட்டிருந்தும், அவன் சங்கிலிகளைப் பிய்த்து, கால்விலங்குகளைத் துண்டுதுண்டாக நொறுக்கிவிட்டிருந்ததால், அவனை அடக்க யாருக்கும் வலிமை இருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பழக்கிக் கட்டுப்பாட்டுக்குள் கொண்டுவர.’ கிரேக்க வினைச்சொல் விலங்கைப் பழக்குவதையும், பரந்த பொருளில் ஒருவரை அடக்கிக் கட்டுப்பாட்டுக்குள் கொண்டுவருவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: ஏனெனில், அவன்
  rationale: διά உடன் வரும் articular infinitive முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πολλάκις
  choice: பலமுறை
  rationale: மீண்டும் மீண்டும் நிகழ்ந்ததைக் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: πέδαις / τὰς πέδας
  choice: கால்விலங்குகள் / கால்விலங்குகளை
  rationale: πέδη என்பது பொதுவான சங்கிலியை அல்ல, குறிப்பாகக் கால்களைப் பிணைக்கும் விலங்கைக் குறிக்கிறது; ἅλυσις என்பதிலிருந்து வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: சங்கிலிகளாலும் / சங்கிலிகளை
  rationale: ἅλυσις என்பதன் பொதுவான பொருள் ‘சங்கிலி’; கால்விலங்குகளிலிருந்து தனித்த கட்டுப்பாட்டுக் கருவியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δεδέσθαι
  choice: கட்டப்பட்டிருந்தான்
  rationale: Perfect infinitive, முன்பு பலமுறை கட்டப்பட்டதன் விளைவான நிலையைச் சுட்டுகிறது; தமிழில் ‘கட்டப்பட்டிருந்தான்’ இதைத் தெளிவாகத் தருகிறது.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: அவன் ... பிய்த்தெறிந்து
  rationale: διασπάω வன்மையாகப் பிரித்தல் அல்லது பிய்த்தல் என்ற தீவிரத்தை உடையது; செயப்பாட்டு கிரேக்க அமைப்பு இயல்பான தமிழுக்காகச் செய்வினையாக மாற்றப்பட்டாலும், அவனே செய்பவன் என்பது பாதுகாக்கப்படுகிறது.
- source_word: συντετρῖφθαι
  choice: துண்டுதுண்டாக நொறுக்கிவிட்டான்
  rationale: συντρίβω நொறுக்குதல் அல்லது சிதைத்தல் என்ற தீவிரப் பொருளைக் கொண்டது; ‘துண்டுதுண்டாக’ அதன் வலிமையை வாசிக்க எளிய தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐδεὶς ἴσχυεν
  choice: யாருக்கும் போதிய வலிமை இருக்கவில்லை
  rationale: ἰσχύω வெறும் இயலாமையைவிட வலிமை அல்லது ஆற்றலை வலியுறுத்துகிறது; இந்தத் தமிழ் வடிவம் அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: δαμάσαι
  choice: அடக்குவதற்கு
  rationale: δαμάζω என்பதற்கு ‘பழக்குதல்’ என்றும், பரந்த பொருளில் ‘அடக்கிக் கட்டுப்பாட்டுக்குள் கொண்டுவருதல்’ என்றும் பொருள் உண்டு; இச்சூழலில் ‘அடக்குதல்’ இயல்பாகவும் மிகை விளக்கம் இன்றியும் உள்ளது.
theological_decisions:
- issue: அந்த மனிதனின் நிலைக்கும் அசாதாரண வலிமைக்கும் உரிய காரணம்
  choice: அவனைக் கட்டுப்படுத்த முடியாத நிலையை மட்டும் வருணனையாகக் கூறுதல்
  alternative: இந்த வசனத்திலேயே அவனுடைய வலிமையைப் பேய்களின் ஆற்றல் என்று வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க வசனம் அவனைப் பலமுறை கட்டியும் கட்டுப்படுத்த முடியாததைச் சொல்கிறது; அந்த வலிமையின் காரணத்தை இவ்வசனத்துக்குள் கூடுதலாகச் சேர்ப்பதில்லை. சுற்றியுள்ள கதை தரும் இறையியல் சூழலை வாசகர் உணர இடமளிக்கப்படுகிறது.
- issue: δαμάσαι என்பதிலுள்ள பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘அடக்குவதற்கு’ என்று வைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் காட்டுதல்
  alternative: ‘பழக்குவதற்கு’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: ‘அடக்குதல்’ மனிதனை வலுக்கட்டாயமாகக் கட்டுப்பாட்டுக்குள் கொண்டுவரும் இச்சூழலுக்கு ஏற்றது; அதேவேளை கிரேக்கச் சொல்லின் ‘பழக்குதல்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள கால்விலங்கு–சங்கிலி வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. நீண்ட காரணவாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘ஆனால்’ என்பது கட்டப்பட்டிருந்த நிலையையும் அவன் அவற்றை முறித்ததையும் இணைக்கும் இயல்பான முரண்பாட்டுச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
