  naturalness: வரைவு பொதுவாக இயல்பான நவீனத் தமிழில் உள்ளது. இருப்பினும், ‘ஏனெனில்’ தொடங்கிய பின் மூன்று தனி வாக்கியங்களாகப் பிரித்திருப்பது முழுக் காரண அமைப்பைச் சற்றே தளர்த்துகிறது. ஒரே காரண வாக்கியமாக அமைத்தல் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் இருக்கும்.
