reference: Mark 8:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: ta
  text: அவர் மக்கள் கூட்டத்தினரைத் தரையில் அமரும்படி[a] அறிவுறுத்தினார். பின்பு, அந்த ஏழு அப்பங்களை எடுத்து, நன்றி செலுத்தி, அவற்றைப் பிட்டு, மக்கள் கூட்டத்தினர் முன் வைப்பதற்காக[b] தம் சீடர்களுக்குக் கொடுத்துக்கொண்டிருந்தார்; அவர்களும் அவற்றை மக்கள் கூட்டத்தினர் முன் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணவுக்காகச் சாய்ந்து அமரும்படி.” கிரேக்க வினைச்சொல் உணவு உண்பதற்காகச் சாய்ந்து அமர்வதை இன்னும் குறிப்பாக உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிமாறுவதற்காக.” கிரேக்கச் சொல் நேரடியாக “முன் வைப்பது” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: அறிவுறுத்தினார்
  rationale: கட்டளையிடுதல் அல்லது அதிகாரத்துடன் அறிவுறுத்துதல் என்ற பொருளைத் தருகிறது. இயல்பான தமிழ் கதைநடைக்காக வரலாற்று நிகழ்காலம் இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀναπεσεῖν
  choice: பந்தியிருக்கும்படி
  rationale: உணவு உண்பதற்காகச் சாய்ந்து அமர்வதைக் குறிக்கும் கிரேக்கச் சொல்லின் சூழல்சார் பொருளை இது காக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: தரையில்
  rationale: இச்சூழலில் γῆ என்பது மக்கள் அமரும் நிலப்பரப்பைக் குறிக்கிறது.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: அந்த ஏழு அப்பங்களை எடுத்து
  rationale: உணவளிக்கும் இச்சூழலில் ἄρτοι அப்பங்களைக் குறிக்கிறது; தமிழ் தொடர்ச்சிக்காக சுட்டுப்பெயரடை சேர்க்கப்பட்டுள்ளது.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்தி
  rationale: மூலத்தில் நன்றி யாருக்குச் செலுத்தப்பட்டது என்பது வெளிப்படையாகக் கூறப்படாததால் எந்தச் செயப்படுபொருளும் சேர்க்கப்படவில்லை.
- source_word: ἔκλασεν
  choice: அவற்றைப் பிட்டு
  rationale: முன்னர் கூறப்பட்ட அப்பங்களே மறைமுகச் செயப்படுபொருள்; தமிழில் தெளிவுக்காக அவை வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: ἐδίδου
  choice: கொடுத்துக்கொண்டிருந்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை வடிவம் தொடர்ந்து அல்லது மீண்டும் மீண்டும் கொடுத்த செயலை உணர்த்துகிறது.
- source_word: ἵνα παρατιθῶσιν
  choice: மக்கள் முன் வைப்பதற்காக
  rationale: உணவை ஒருவர்முன் வைப்பது என்ற παρατίθημι சொல்லின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: παρέθηκαν
  choice: அவற்றை மக்கள் முன் வைத்தார்கள்
  rationale: சீடர்கள் செய்த நிறைவுற்ற செயலைக் காட்டுவதோடு முந்தைய παρατίθημι வடிவத்துடனான சொல் ஒற்றுமையையும் காக்கிறது.
- source_word: ὄχλος
  choice: மக்கள் கூட்டம்
  rationale: நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் பெருந்திரளான மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: நிகழ்வின் வரிசையும் திருவிருந்து சார்ந்த எதிரொலியும்
  choice: εὐχαριστήσας என்பது கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் “நன்றி செலுத்தி” என நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: திருவிருந்து சார்ந்த பொருளை வெளிப்படையாக உணர்த்தும் சொற்றொடரைப் பயன்படுத்துதல்
  rationale: இங்கு பொதுவான உணவுச் சூழலுக்குரிய மொழி பயன்படுத்தப்பட்டுள்ளது. அது பிற்கால கிறிஸ்தவ நடைமுறையை நினைவூட்டக்கூடும்; எனினும் இவ்வசனம் தனியாக திருவருட்சாதனம் குறித்த போதனையை வெளிப்படையாக வழங்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “பந்தியிருக்க” என்பது உணவுக்காக அமரும் நுட்பத்தைத் தக்கவைக்கிறது; அதன் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
