source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: ta
  text: பரிசேயர்கள் வெளியே வந்து, அவரோடு வாதிடத் தொடங்கினார்கள்; அவரைச் சோதிக்கும் நோக்கில், அவரிடம் வானத்திலிருந்து ஓர் அடையாளத்தைக் கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகாயத்திலிருந்து ஓர் அடையாளம்.” இச்சொற்றொடர் இங்கு பெரும்பாலும் பரலோகத்திலிருந்து, அதாவது கடவுளிடமிருந்து, வரும் அடையாளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: வெளியே வந்து
  rationale: ἐξέρχομαι என்பதன் இறந்தகாலச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; அவர்கள் எங்கிருந்து வந்தார்கள் என்பதை மூலத்தைவிடக் கூடுதலாகக் குறிப்பிடவில்லை.
- source_word: ἤρξαντο συζητεῖν
  choice: வாதிடத் தொடங்கினார்கள்
  rationale: ἤρξαντο என்பதன் தொடக்கப் பொருளையும், அவரைச் சோதிக்கும் பகைமையான சூழலில் συζητέω கொண்டுள்ள விவாதம் அல்லது வாதம் என்ற வலிமையையும் காக்கிறது.
- source_word: αὐτῷ
  choice: அவரோடு
  rationale: συζητεῖν என்பதுடன் வரும் தத்திவேற்றுமையை இயல்பான தமிழில் ‘அவரோடு’ என வழங்குகிறது; மூலத்தில் இல்லாத இயேசுவின் பெயரைச் சேர்க்கவில்லை.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: அவரிடம் கேட்டார்கள்
  rationale: அவர்கள் அவரிடமிருந்து ஒன்றைப் பெற நாடியதைத் தெளிவான நவீன தமிழில் கூறுகிறது. ‘கோரினார்கள்’ என்பதைவிட இது பகைமையின் அளவை மிகைப்படுத்தாது.
- source_word: σημεῖον
  choice: ஓர் அடையாளம்
  rationale: அற்புதச் செயலையே மட்டும் அல்லாமல், சான்றாக அல்லது அங்கீகாரமாக விளங்கும் நிகழ்வையும் σημεῖον குறிக்க முடிவதால் ‘அடையாளம்’ பொருத்தமானது.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து வரும்
  rationale: ἀπό குறிக்கும் தோற்றுவாயைப் பாதுகாக்கிறது. ‘வானம்’ என்பது வானம்/பரலோகம் என்ற இயல்பான இருபொருள் வாய்ப்பைத் தக்கவைக்கிறது; தெய்வீகத் தோற்றுவாய் என்ற சாத்தியம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: πειράζοντες αὐτόν
  choice: அவரைச் சோதிப்பதற்காக
  rationale: இங்கு πειράζω பாவத்திற்கு ஆசைகாட்டுவதைவிட பகைமையான சோதனையை குறிக்கிறது. நோக்கத்தைக் குறிக்கும் தமிழ் அமைப்பு அந்தச் சூழலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘வானத்திலிருந்து’ கேட்கப்பட்ட அடையாளத்தின் பொருள்
  choice: தெய்வீகத் தோற்றுவாய் அல்லது கடவுளின் அங்கீகாரம் கொண்ட அடையாளம் என்பதே முதன்மையான வாசிப்பு; எனினும் பிரதான உரை ‘வானத்திலிருந்து’ என்ற சொல்லை வைத்திருக்கிறது.
  alternative: கண்ணுக்குத் தெரியும் ஆகாயத்திலிருந்து தோன்றும் அடையாளம்
  rationale: நற்செய்தி நூல்களின் யூதச் சூழலில் இச்சொற்றொடர் பொதுவாக கடவுளிடமிருந்து வரும் உறுதிப்படுத்தும் அடையாளத்தைச் சுட்டுகிறது. ஆனால் οὐρανός என்பதன் ‘வானம்/ஆகாயம்’ என்ற சொற்பொருள் சாத்தியத்தை முற்றிலும் நீக்காமல் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘வாதிடத் தொடங்கினார்கள்’ பகைமையான விவாதத்தை இயல்பாக வெளிப்படுத்துகிறது; பங்கேற்பெயர் அமைப்புகள் தமிழில் தெளிவான வாக்கியங்களாக மாற்றப்பட்டுள்ளன.
