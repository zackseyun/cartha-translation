  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: ta
  text: அவர் நிமிர்ந்து பார்த்து[a], “மக்களைப் பார்க்கிறேன்; ஏனெனில், அவர்கள் மரங்களைப்போல் நடமாடுவதைப் பார்க்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் பார்வையைப் பெற்று”.
    reason: ἀναβλέπω என்ற கிரேக்க வினை ‘நிமிர்ந்து பார்’ என்றும் ‘மீண்டும் பார்வை பெறு’ என்றும் பொருள்படலாம்; இச்சூழலில் இரு நிழற்பொருள்களும் கவனத்திற்குரியவை.
lexical_decisions:
- source_word: ἀναβλέψας
  choice: நிமிர்ந்து பார்த்து
  rationale: இந்தச் சூழலில் மேலே அல்லது எதிரே பார்ப்பதைக் குறிக்கும் இயல்பான தமிழ்; அதே வினை ‘மீண்டும் பார்வை பெற்ற பின்’ என்றும் பொருள்படக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τοὺς ἀνθρώπους
  choice: மக்களை
  rationale: பொதுவாகக் காணப்படும் மனிதர்களைக் குறிக்கும் இயல்பான, உள்ளடக்கமான தமிழ் சொல்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: SBLGNT உரையின் காரணவிளக்கத் தொடர்பை வெளிப்படையாகப் பாதுகாக்கிறது; வாக்கியத்தின் அசாதாரணமான தர்க்க ஓட்டத்தை மென்மைப்படுத்தி மாற்றவில்லை.
- source_word: ὡς δένδρα
  choice: மரங்களைப்போல்
  rationale: அவரது முழுமையடையாத பார்வையில் மனிதர்கள் மரங்களைப் போல் தோன்றிய ஒப்புமையை நேரடியாகக் காக்கிறது.
- source_word: ὁρῶ περιπατοῦντας
  choice: அவர்கள் … நடமாடுவதைப் பார்க்கிறேன்
  rationale: περιπατοῦντας என்பது மக்களைக் குறிக்கும் ஆண்பால் பன்மை வடிவம்; ஆகவே நடமாடுபவர்கள் மக்களே என்பதைத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: குணமடைதல் படிப்படியாக நிகழும் காட்சியின் மொழி
  choice: பார்வை இன்னும் தெளிவடையாத நிலையில் அவர் கண்டதை அப்படியே விவரிக்கும் மொழி
  alternative: இந்தக் கூற்றை உருவக அல்லது ஆன்மிகப் பார்வையாக விளக்குதல்
  rationale: வசனத்தின் நேரடி நிகழ்வியல் பொருளை மட்டும் மொழிபெயர்த்து, உரையில் வெளிப்படையாக இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் மீளுரையான ‘பார்க்கிறேன்’ இரு இடங்களிலும் காக்கப்பட்டு, முழுமையடையாத பார்வையின் அனுபவம் வெளிப்படுத்தப்பட்டுள்ளது.
