  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: ta
  text: அவர் அவர்களிடம்[a], “உங்களுக்கு இன்னும் புரியவில்லையா?” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களிடம்’ என்பது சூழலில் இயேசுவின் சீடர்களைக் குறிக்கிறது; ஆனால் இந்த வசனத்தின் கிரேக்க உரையில் ‘சீடர்கள்’ என்ற பெயர்ச்சொல் இல்லை.
    reason: implicit_referent
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: எளிய இணைப்பைத் தக்கவைக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத காலத் தொடர்ச்சியைச் சேர்ப்பதில்லை.
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: λέγω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவத்தின் தொடரும் அல்லது மீளும் இயல்பைத் தமிழில் பிரதிபலிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இந்த வசனத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாததால், சூழலிலிருந்து ‘சீடர்கள்’ என்பதை உரைக்குள் சேர்க்காமல் பன்மைச் சுட்டுப்பெயரை நேரடியாக வழங்குகிறது.
- source_word: Οὔπω
  choice: இன்னும் ... வில்லையா
  rationale: ‘இன்னும் இல்லை/இதுவரை இல்லை’ என்ற பொருளை இயல்பான தமிழ் எதிர்மறைக் கேள்வி அமைப்பில் தெரிவிக்கிறது.
- source_word: συνίετε
  choice: உங்களுக்குப் புரியவில்லையா
  rationale: வெறும் பார்வை அல்லது உணர்தலை அல்லாமல் மனத்தால் விளங்கிக்கொள்வதைக் குறிக்கிறது; இரண்டாம் நபர் பன்மையும் தமிழில் தெளிவாகிறது.
theological_decisions:
- issue: இயேசுவின் கேள்விக்கு ‘இதை’ அல்லது ‘அதை’ போன்ற செயப்படுபொருளைச் சேர்க்கலாமா என்பது
  choice: செயப்படுபொருளை வெளிப்படையாகச் சேர்க்காமல், ‘உங்களுக்கு இன்னும் புரியவில்லையா?’ என்று வழங்குதல்
  alternative: ‘இது உங்களுக்கு இன்னும் புரியவில்லையா?’
  rationale: கிரேக்க மூலத்தில் புரிந்துகொள்ள வேண்டிய பொருள் சொல்லப்படாமல் விடப்பட்டுள்ளது. அதை அப்படியே விடுவது கேள்வியின் விரிந்த கண்டிப்பு வலிமையையும் பொருள் திறப்பையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் மரியாதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சொல்லிக்கொண்டிருந்தார்’ என்பது சற்றே முறையானதாக இருந்தாலும், கிரேக்க இறந்தகாலத் தொடர்நிலையைப் பாதுகாக்கிறது.
