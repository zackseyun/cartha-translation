source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: ta
  text: உடனே அவர் தம் சீடர்களுடன் படகில் ஏறி, தல்மனூத்தா பகுதிக்குச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘தல்மனூத்தாவின் பகுதிகளுக்கு.’ கிரேக்கத்தில் ‘பகுதிகள்’ என்ற பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது; அது தல்மனூத்தாவைச் சுற்றியுள்ள வட்டாரத்தைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரையாடல் ஓட்டத்துக்குரிய உடனடித் தன்மையை இயல்பான நவீனத் தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: ἐμβὰς
  choice: படகில் ஏறி
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையின் தொடர்பைத் தமிழின் இயல்பான வினையெச்ச வடிவில் தருகிறது.
- source_word: πλοῖον
  choice: படகு
  rationale: கலிலேயக் கடல் சூழலில் அளவுக்கு மிகப் பெரிய கப்பலைக் குறிக்காமல், பொருத்தமான நீர்வாகனத்தைக் குறிக்கும் இயல்பான சொல்.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: தம் சீடர்களுடன்
  rationale: உடன்செல்லுதலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; ‘தம்’ என்பது எழுவாயாகிய இயேசுவையே திரும்பச் சுட்டுகிறது.
- source_word: ἦλθεν
  choice: சென்றார்
  rationale: கதைசொல்லியின் வெளிப்புறப் பார்வையில் ஒரு இலக்கை நோக்கிய நகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ μέρη
  choice: பகுதி
  rationale: கிரேக்கத்தின் பன்மை வடிவம் ஓர் இடத்தைச் சுற்றியுள்ள வட்டாரம் அல்லது பிரதேசத்தை மொழிவழக்காகக் குறிக்கிறது; தமிழ் ஒருமை ‘பகுதி’ அந்தப் புவியியல் பொருளை இயல்பாக வழங்குகிறது.
- source_word: Δαλμανουθά
  choice: தல்மனூத்தா
  rationale: கிரேக்க இடப்பெயரின் ஒலியை நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் உடனடித் தன்மையும், படகில் ஏறிய பின் சென்ற செயல்வரிசையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய ‘தல்மனூத்தா பகுதி’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
