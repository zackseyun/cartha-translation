  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: ta
  text: ஆனால் அவர் திரும்பி, தம் சீடர்களைப் பார்த்து, பேதுருவைக் கடிந்துகொண்டு, “என் பின்னால் போ, சாத்தானே! ஏனெனில், நீ கடவுளுக்குரியவற்றை மனதில் கொள்ளாமல், மனிதர்களுக்குரியவற்றை[a] மனதில் கொள்கிறாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மனிதக் காரியங்கள் அல்லது மனித அக்கறைகள்.
    reason: τὰ τῶν ἀνθρώπων மனிதர்களை பொதுவாகக் குறிக்கும் பரந்த சொற்றொடர்; மாற்று இயல்பான வெளிப்பாடுகளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: திரும்பி
  rationale: இயேசு உடலளவில் திசைதிரும்பியதை இயல்பான தமிழில் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἰδὼν
  choice: பார்த்து
  rationale: சீடர்களைக் கண்ணுற்றதைத் தெரிவித்து, பங்கேற்புச் சொற்களின் நிகழ்வுவரிசையையும் இயல்பாகப் பேணுகிறது.
- source_word: μαθητὰς
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் இயேசுவின் μαθηταί என்போருக்கான நிலையான, புரிந்துகொள்ள எளிய தமிழ் சொல்.
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டு
  rationale: ἐπιτιμάω குறிக்கும் கடுமையான வாய்மொழிக் கண்டனத்தின் வலிமையைப் பேணுகிறது.
- source_word: καὶ λέγει
  choice: என்றார்
  rationale: வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலக் கதைநடைக்கு மாற்றுகிறது; உரையின் பொருள் மாறவில்லை.
- source_word: Ὕπαγε ὀπίσω μου
  choice: என் பின்னால் போ
  rationale: கட்டளையின் நேரடி வலிமையையும், முன்னிருந்து தடுப்பவனாக அல்லாமல் பின்னால் செல்லவேண்டும் என்ற இடம்சார்ந்த உருவகத்தையும் பேணுகிறது.
- source_word: Σατανᾶ
  choice: சாத்தானே
  rationale: விளிவேற்றுமையில் உள்ள தனிப்பட்ட பெயர் அல்லது பட்டத்தைத் தமிழில் வழக்கமான ஒலிபெயர்ப்புடன் தருகிறது.
- source_word: φρονεῖς
  choice: மனதில் கொள்கிறாய்
  rationale: வெறும் சிந்தித்தலைவிட மனப்போக்கு, நாட்டம், அக்கறை ஆகியவற்றையும் உள்ளடக்கும் φρονέω என்பதைக் கேட்பதற்கு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ τοῦ θεοῦ
  choice: கடவுளுக்குரியவற்றை
  rationale: ‘கடவுளுடைய காரியங்கள்/அக்கறைகள்’ என்ற பரந்த பொருளை ஓர் குறிப்பிட்ட விளக்கமாகச் சுருக்காமல் பேணுகிறது.
- source_word: τὰ τῶν ἀνθρώπων
  choice: மனிதர்களுக்குரியவற்றையே
  rationale: ἀνθρώπων இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; ‘-ஏ’ எதிர்மறை-மாறுபாட்டின் அழுத்தத்தைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘சாத்தானே’ என்று அழைக்கப்படுபவர் யார்?
  choice: இயேசு பேதுருவையே நேரடியாகக் கடிந்து ‘சாத்தானே’ என்று அழைக்கிறார்; அதற்கு மேலான விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
  alternative: பேதுருவுக்குப் பின்னால் நிற்கும் சாத்தானை இயேசு அழைக்கிறார்; அல்லது ‘சாத்தான்’ என்பது தனிப்பட்ட ஆளைக் குறிக்காமல் ‘எதிரி’ என்று மட்டும் பொருள்படும்.
  rationale: ἐπετίμησεν Πέτρῳ என்பதில் கடிந்துகொள்ளப்படுபவர் பேதுரு; அதைத் தொடர்ந்து வரும் விளி அவரையே நேரடியாக நோக்குகிறது. பேதுரு சொன்னது சாத்தானிய எதிர்ப்புடன் எவ்வாறு தொடர்புடையது என்பதை வசனம் விளக்காததால், அந்த இறையியல் அழுத்தம் தீர்க்கப்படாமல் விடப்படுகிறது.
- issue: ἀνθρώπων என்பதன் பொதுப்பொருள்
  choice: மனிதர்களுக்குரியவை
  alternative: ஆண்களுக்குரியவை; மக்களுக்குரியவை
  rationale: கிரேக்கச் சொல் இங்கு பாலின வேறுபாடின்றி மனிதர்களைப் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் ‘மனிதர்கள்’ மூலத்தின் பொதுப்பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘என் பின்னால் போ’ என்ற நேரடியான கட்டளையும் ‘சாத்தானே’ என்ற கடுமையான அழைப்பும் மென்மைப்படுத்தப்படவில்லை. ‘கடவுளுக்குரியவை / மனிதர்களுக்குரியவை’ என்ற இணை அமைப்பு மூலத்தின் திட்டமிட்ட எதிர்மறை ஒப்புமையைப் பேணுகிறது.
