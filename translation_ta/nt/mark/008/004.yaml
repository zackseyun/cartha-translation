source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: ta
  text: 'அவருடைய சீடர்கள் அவருக்குப் பதிலளித்தார்கள்: “இந்த வெறிச்சோடிய இடத்தில் இந்த மக்களைத் திருப்திப்படுத்துவதற்கு ஒருவருக்கு அப்பம் எங்கிருந்து கிடைக்கும்?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வெறிச்சோடிய இடத்தில் இந்த மக்களுக்கு அப்பம் கொடுத்து யாரால் திருப்திப்படுத்த முடியும்?”
    reason: Πόθεν என்பதன் ‘எங்கிருந்து’ என்ற மூல/ஆதாரக் கேள்வியை முதன்மை உரை காக்கிறது; தமிழில் இயல்பான நடைமுறை-சாத்தியக் கேள்வியாக அமைக்கும் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: பதிலளித்தார்கள்
  rationale: கதைநடையில் வந்துள்ள பதிலுரைக்கும் வினையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: நேர்கூற்றைக் குறிக்கும் மேற்கோள் குறிகள் மற்றும் ‘என்று’
  rationale: பேச்சை அறிமுகப்படுத்தும் ὅτι தமிழில் தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல், நேர்கூற்று அமைப்பில் மேற்கோள் குறிகளாலும் ‘என்று’ என்பதாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: Πόθεν
  choice: யாரால் முடியும்
  rationale: சொல்லளவில் ‘எங்கிருந்து’ என்று பொருள்பட்டாலும், இங்கு அளிப்பதற்கான வழி அல்லது ஆதாரம் இல்லை என்ற கேள்வியை இயல்பான தமிழில் தெரிவிக்கிறது; ‘எங்கிருந்து’ என்ற வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τούτους
  choice: இவர்களுக்கு
  rationale: கூட்டத்தைக் குறிக்கும் பன்மைப் பெயர்ச்சுட்டை பாலினத்தைத் தேவையின்றிக் குறுக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δυνήσεταί τις
  choice: யாரால் முடியும்
  rationale: τις என்பதன் குறிப்பிடப்படாத நபரையும் δύναμαι என்பதன் இயலாமை சார்ந்த கேள்வியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடைச் சொல்லின் நேரான தமிழ் இணை.
- source_word: χορτάσαι
  choice: திருப்தியாக்க
  rationale: வெறுமனே உணவளிப்பதைவிட வயிறார உண்ணச் செய்து நிறைவடையச் செய்வது என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: ἄρτων
  choice: அப்பம் கொடுத்து
  rationale: ἄρτος என்பதன் உணவுப் பொருள் குறிப்பை ‘அப்பம்’ எனத் தெளிவாகக் காக்கிறது; வினையுடன் இணையும் தமிழ் அமைப்புக்காக ‘கொடுத்து’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐπ’ ἐρημίας
  choice: இந்தப் பாழான இடத்தில்
  rationale: மக்கள் வசிப்பிடமற்ற, உணவு கிடைக்காத தனிமையான பகுதியைக் குறிக்கும் சொற்றொடரை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
