  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாழான இடம்’ என்பது வெறிச்சோடிய பகுதியைக் குறிக்கிறது; ‘வனாந்தரம்’ போன்ற சமயவழக்குச் சொல்லைத் தவிர்க்கிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
