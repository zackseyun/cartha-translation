  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: ta
  text: அவரைப் பற்றி யாரிடமும் சொல்லக் கூடாது என்று அவர்களைக் கண்டிப்புடன் எச்சரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கடிந்துகொண்டார்”; அல்லது, “அவர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: கண்டிப்புடன் எச்சரித்தார்
  rationale: இச்சொல் பொதுவாகக் ‘கடிந்துகொள்’ என்ற பொருளையும் தருகிறது; ஆனால் இங்கு இயேசு சீடர்கள் தகவலை வெளியிடக் கூடாது என்று வலியுறுத்திக் கட்டளையிடுகிறார். ‘கண்டிப்புடன் எச்சரித்தார்’ என்பது அந்த வலிமையையும் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: உடனடி சூழலில் இயேசு பேசிக்கொண்டிருந்த சீடர்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: யாரிடமும் சொல்லக் கூடாது என்று
  rationale: கட்டளை அல்லது எச்சரிப்பைத் தொடர்ந்து வரும் ἵνα மற்றும் இறந்தகாலமல்லாத வாய்ப்பாட்டு வினை இங்கு தடை உத்தரவின் உள்ளடக்கத்தைத் தெரிவிக்கின்றன. தமிழில் ‘சொல்லக் கூடாது என்று’ என்பது இயல்பான வடிவம்.
- source_word: μηδενὶ
  choice: யாரிடமும்
  rationale: ‘ஒருவரிடமும் இல்லை’ என்ற பொருளைத் தரும் எதிர்மறை மறைமுகப் பொருள்; எதிர்மறை வினையுடன் ‘யாரிடமும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: λέγωσιν
  choice: சொல்ல
  rationale: ஒருவரைப் பற்றிய தகவலை மற்றவர்களிடம் தெரிவிப்பது இங்கு நோக்கம்; ஆகவே ‘சொல்ல’ என்பது பொருத்தமான இயல்பான இணைச்சொல்.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றி
  rationale: περί + பிறப்புவேற்றுமை ‘அவரைப் பற்றி/அவரைக் குறித்து’ எனப் பொருள்படும்; ‘அவரைப் பற்றி’ என்பது நடப்பு நிலையான தமிழில் இயல்பானது.
theological_decisions:
- issue: இயேசுவின் தடை உத்தரவின் வலிமையும் அவரது அடையாளத்தை மறைவாக வைத்திருக்கும் கதையாடல் பதற்றமும்
  choice: அவரைப் பற்றி யாரிடமும் சொல்லக் கூடாது என்று சீடர்களைக் கண்டிப்புடன் எச்சரித்ததாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களைக் கடிந்துகொண்டார்’ அல்லது ‘அவர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார்’
  rationale: வசனம் வலிமையான தடையைத் தெளிவாகக் காட்டுகிறது; ஆனால் அந்தத் தடைக்கான காரணத்தைப் பற்றிய எந்தத் தத்துவக் கோட்பாட்டையும் மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை. ‘கண்டிப்புடன் எச்சரித்தார்’ என்பது உத்தரவின் தீவிரத்தைப் பேணுகிறது; ‘கடிந்துகொண்டார்’ என்று மட்டும் கூறுவதால் உருவாகக்கூடிய தனிப்பட்ட குற்றச்சாட்டு என்ற எண்ணத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதே நேரத்தில் கண்ணியமும் கட்டளையின் வலிமையும் கொண்ட நடை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
