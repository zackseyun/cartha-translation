id: MRK.8.15
reference: Mark 8:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: ta
  text: 'அவர் மீண்டும் மீண்டும் அவர்களை எச்சரித்தார்: “கவனியுங்கள்; பரிசேயர்களின் புளிப்புமாவையும்[a] ஏரோதின் புளிப்புமாவையும் குறித்து எச்சரிக்கையாக இருங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“புளிப்புமா” என்பது மாவை முழுவதும் புளிக்கச் செய்யும் பொருளைக் குறிக்கிறது. இங்கு அது ஊடுருவிப் பரவும் செல்வாக்குக்கான உருவகம்; அந்தச் செல்வாக்கு என்ன என்பதை இவ்வசனம் துல்லியமாக விளக்கவில்லை. ஒப்பிடுக: மத் 16:6, 12; லூக் 12:1.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: தொடர்ந்து எச்சரித்துச் சொன்னார்
  rationale: இறந்தகால முற்றுப்பெறா வினைவடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட அறிவுறுத்தலைக் குறிக்கிறது. சூழலில் அது எச்சரிக்கையின் வலிமையையும் கொண்டிருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: Ὁρᾶτε, βλέπετε
  choice: கவனமாக இருங்கள்! … விழிப்புடன் இருங்கள்
  rationale: இரண்டு கட்டளை வினைகளும் ஒன்றுக்கொன்று நெருக்கமான பொருளில் வலியுறுத்தலை உருவாக்குகின்றன. அவற்றை ஒன்றாகச் சுருக்காமல், இயல்பான தமிழில் இரட்டை எச்சரிக்கையாகத் தக்கவைக்கிறது.
- source_word: ἀπὸ
  choice: குறித்து
  rationale: எச்சரிக்கை வினையுடன் வரும் ἀπό, இங்கு ஒன்றிலிருந்து விலகிக் காத்துக்கொள்வதைக் குறிக்கிறது. தமிழில் ‘குறித்து விழிப்புடன் இருங்கள்’ என்பது இயல்பாக அந்த எச்சரிக்கைப் பொருளைத் தெரிவிக்கிறது.
- source_word: ζύμης
  choice: புளிப்புமா
  rationale: மாவை முழுவதும் புளிக்கச் செய்யும் பொருளைக் குறிக்கும் மூலச்சொல்லின் நேரடியான உருவகத்தை இது தக்கவைக்கிறது; ‘போதனை,’ ‘பாசாங்குத்தனம்,’ அல்லது ‘தீய செல்வாக்கு’ என்று விளக்கிப் பொருளை முன்கூட்டியே முடிவுசெய்யவில்லை.
- source_word: τῶν Φαρισαίων
  choice: பரிசேயர்களின்
  rationale: குழுவின் பெயரையும் அதன் உடைமை/தொடர்பு வேற்றுமையையும் நேரடியாகக் காட்டும் நிலையான தமிழ் வடிவம்.
- source_word: Ἡρῴδου
  choice: ஏரோதின்
  rationale: கிரேக்க உரை ஏரோதையே நேரடியாகப் பெயரிட்டு, பரிசேயர்களுக்கு இணையான மரபுத்தொடரில் அமைக்கிறது; ‘ஏரோதியர்கள்’ அல்லது ‘ஏரோதின் குடும்பம்’ என விரிவுபடுத்தப்படவில்லை.
theological_decisions:
- issue: ‘புளிப்புமா’ என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் விளக்காமல் அப்படியே தக்கவைத்தல்
  alternative: போதனை / பாசாங்குத்தனம் / கெடுக்கும் செல்வாக்கு
  rationale: இணையான நற்செய்திப் பகுதிகள் எதிர்மறையாக ஊடுருவிப் பரவும் செல்வாக்கைச் சுட்டினாலும், மாற்கு 8:15 அந்தச் செல்வாக்கின் துல்லியமான தன்மையைச் சொல்லவில்லை. எனவே வசனத்தின் பொருள் திறந்த நிலையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கவனமாக இருங்கள்’ மற்றும் ‘விழிப்புடன் இருங்கள்’ என்ற இரட்டைச் சொற்றொடர் கிரேக்கத்தின் வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது. ‘புளிப்புமா’ என்ற வேதாகம உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை.
