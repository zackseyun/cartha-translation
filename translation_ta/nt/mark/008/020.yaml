id: MRK.8.20
reference: Mark 8:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: ta
  text: “மேலும், அந்த ஏழு அப்பங்களை நான்காயிரம் பேருக்குப் பகிர்ந்தபோது, உடைந்த துண்டுகளால் நிரம்பிய எத்தனை பெரிய கூடைகளை[a] நீங்கள் எடுத்தீர்கள்?” என்று கேட்டார். அவர்கள் அவரிடம், “ஏழு” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘பெரிய கூடை’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் σπυρίς; இது மாற்கு 8:19-இல் வரும் சிறிய கூடைக்கான சொல்லிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: மேலும், … பகிர்ந்தபோது
  rationale: முந்தைய அப்பப் பெருக்கத்தைத் தொடர்ந்து இரண்டாவது நிகழ்வை ஒப்பிடும் இணைப்பையும் காலப் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς ἑπτὰ
  choice: அந்த ஏழு அப்பங்களை
  rationale: கிரேக்கத்தில் ‘அந்த ஏழு’ என்று மட்டும் சுருக்கமாக இருந்தாலும், மாற்கு 8:5–6 சூழலில் அப்பங்களே குறிக்கப்படுகின்றன; தமிழில் தெளிவுக்காக ‘அப்பங்களை’ சேர்க்கப்பட்டுள்ளது.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: நான்காயிரம் பேருக்கு
  rationale: உணவளிக்கப்பட்ட மக்களுடனான பயன்/தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πόσων σπυρίδων
  choice: எத்தனை பெரிய கூடைகளை
  rationale: σπυρίς என்பது மாற்கு 8:19-இல் வரும் சிறிய கூடைச் சொல்லிலிருந்து வேறுபடும் பெரிய கூடையைக் குறிக்கிறது.
- source_word: πληρώματα κλασμάτων
  choice: மீதியான துண்டுகள் நிறைந்த
  rationale: அப்பத்திலிருந்து மீந்த உடைந்த துண்டுகளால் கூடைகள் நிரம்பியிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἤρατε
  choice: நீங்கள் எடுத்தீர்கள்
  rationale: மீதிகளைச் சேகரித்து எடுத்ததைக் குறிக்கும் αἴρω என்பதன் சூழல்சார் பொருளைத் தருகிறது.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலக் கதைநடையில் வழங்குகிறது.
- source_word: Ἑπτά
  choice: ஏழு
  rationale: இயேசுவின் கேள்விக்கான நேரடியான எண்ணிக்கைப் பதில்.
