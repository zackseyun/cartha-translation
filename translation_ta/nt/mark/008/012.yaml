id: MRK.8.12
reference: Mark 8:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: ta
  text: 'அவர் தம் ஆவியில் ஆழமாகப் பெருமூச்சுவிட்டு, “இந்தத் தலைமுறை ஏன் ஓர் அடையாளத்தைத் தேடுகிறது? உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இந்தத் தலைமுறைக்கு எந்த அடையாளமும் கொடுக்கப்படாது[a]” என்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “இந்தத் தலைமுறைக்கு ஓர் அடையாளம் கொடுக்கப்படுமானால் …” கிரேக்கத்தில் இது வலுவான மறுப்பைக் குறிக்கும் சத்திய உறுதிமொழிப் பாணியாகும்; அதாவது, எந்த அடையாளமும் கொடுக்கப்படாது.
    reason: மூலமொழியின் நிறைவுபெறாத நிபந்தனை வடிவத்தையும் அதன் வலுவான மறுப்புப் பொருளையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἀναστενάξας
  choice: ஆழமாகப் பெருமூச்சுவிட்டு
  rationale: வினைச்சொல்லில் உள்ள தீவிரமான பெருமூச்சு அல்லது உள்ளக் குமுறலின் உணர்வை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; அளவுக்கு மீறிய நாடகத்தன்மையைச் சேர்ப்பதில்லை.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: தம் ஆவியில்
  rationale: கிரேக்கத்தின் ஆவியைக் குறிக்கும் மானுடவியல் சொல்லாட்சியைப் பாதுகாக்கிறது; அதை வெறுமனே ‘மனதிற்குள்’ என்று உளவியல் உணர்வாக மட்டுப்படுத்தவில்லை.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் இது வரலாற்று நிகழ்காலம். தமிழ்க் கதைநடையில் இயல்பாகவும் கண்ணியமாகவும் அமைய இறந்தகாலம் பயன்படுத்தப்பட்டது; உரையின் உயிரோட்டம் நேரடி மேற்கோளால் தக்கவைக்கப்படுகிறது.
- source_word: Τί
  choice: ஏன்
  rationale: இச்சூழலில் τί என்பது வினையுடன் சேர்ந்து காரணத்தை வினவும் ‘ஏன்’ என்ற பொருளைத் தருகிறது.
- source_word: γενεὰ
  choice: தலைமுறை
  rationale: கூட்டுத்தன்மையையும் காலத்தொடர்பையும் பாதுகாக்கும் நேரான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ζητεῖ
  choice: தேடுகிறது
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருளைப் பாதுகாக்கிறது. ‘கோருகிறது’ அல்லது ‘வற்புறுத்திக் கேட்கிறது’ என்பது சூழலில் காணப்படும் மோதல் தன்மையைச் சொல்லுக்குள் அளவுக்கு மீறி சேர்த்துவிடும்.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: சான்றுறுதியாக அமையும் வல்ல செயலைக் குறிக்கும் இறையியல் நுட்பத்தைப் பாதுகாக்கிறது; ‘அற்புத அடையாளம்’ போன்ற விளக்கச் சொல்லை மூலத்தில் இல்லாமல் சேர்ப்பதில்லை.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உரையில் வரும் இச்சூத்திரத்தின் உறுதியான, ஆணித்தரமான தன்மையைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: இந்தத் தலைமுறைக்கு எந்த அடையாளமும் கொடுக்கப்படாது
  rationale: இது நிறைவுபெறாமல் விடப்பட்ட செமித்தியப் பாணி ஆணைமொழியாகச் செயல்பட்டு வலுவான மறுப்பைக் குறிக்கிறது. சொல்லுக்குச் சொல் ‘ஓர் அடையாளம் கொடுக்கப்பட்டால்’ என்பது தமிழில் பொருளை மறைத்துவிடும்.
theological_decisions:
- issue: ἀμὴν λέγω ὑμῖν என்பதற்குப் பின் வரும் ஆணைமொழி போன்ற εἰ வாக்கியத்தை மொழிபெயர்த்தல்
  choice: வலியுறுத்தப்பட்ட மறுப்பாக, ‘இந்தத் தலைமுறைக்கு எந்த அடையாளமும் கொடுக்கப்படாது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: சொல்லமைப்பை மிக நெருக்கமாகப் பின்பற்றி, ‘இந்தத் தலைமுறைக்கு ஓர் அடையாளம் கொடுக்கப்பட்டால்...’ என்று நிறைவுபெறாத நிபந்தனை வாக்கியமாகத் தருதல்.
  rationale: கிரேக்கத்தில் வாக்கியம் உண்மையான நிபந்தனையை முன்வைக்காமல், சொல்லப்படாத சாபவாக்கியத்தை உள்ளடக்கிய ஆணைமொழியாக வலுவான மறுப்பைத் தெரிவிக்கிறது. பிரதான உரையில் மறுப்பை வெளிப்படையாகக் கூறுவது அதன் நோக்கத்தைத் தெளிவாக்குகிறது; மூல வடிவத்தின் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தம் ஆவியில்’ என்பது மூலத்தின் மானுடவியல் சொல்லாட்சியைப் பாதுகாக்கிறது. தமிழ்க் கதைநடையின் இயல்புக்காக வரலாற்று நிகழ்காலம் இறந்தகாலமாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு மறுப்பு வாக்கியத்தோடு நேரடியாக இணைக்கப்பட்டுள்ளது.
