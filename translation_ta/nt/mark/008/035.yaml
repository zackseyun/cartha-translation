source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: ta
  text: ஏனெனில், தன் உயிரை[a]க் காப்பாற்றிக்கொள்ள விரும்புகிறவர் அதை இழந்துவிடுவார்; ஆனால் எனக்காகவும் நற்செய்திக்காகவும் தன் உயிரை இழக்கிறவர் அதைக் காப்பாற்றிக்கொள்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் முழுவதிலும் ‘ஆத்துமா’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் சூழலைப் பொறுத்து ‘உயிர்’ அல்லது ‘ஆத்துமா’ என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: உயிர்
  rationale: இந்தச் சீடத்துவச் சூழலில், ஒருவர் காத்துக்கொள்ள முயலும் வாழ்வையும் இயேசுவுக்காக இழக்கும் வாழ்வையும் குறிக்கும் முரண்பாட்டை ‘உயிர்’ இயல்பாக வெளிப்படுத்துகிறது. ‘ஆத்துமா’ என்ற பொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: σῶσαι / σώσει
  choice: காப்பாற்றிக்கொள்ள / காப்பாற்றிக்கொள்வார்
  rationale: ἀπόλλυμι என்பதற்கு எதிராக அமைந்துள்ள ஒரே வினைத் தொடர்பையும், தன் உயிரைக் காக்க முயல்வது மற்றும் இறுதியில் அதைக் காப்பது என்ற முரண்பாட்டையும் தக்கவைக்கிறது.
- source_word: ἀπολέσει / ἀπολέσει
  choice: இழந்துவிடுவார் / இழக்கிறவர்
  rationale: ψυχήயுடன் வரும் ἀπόλλυμι இங்கு ‘அழித்தல்’ என்பதைவிட உயிரை ‘இழத்தல்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: எனக்காகவும் நற்செய்திக்காகவும்
  rationale: ἕνεκεν காட்டும் காரணம் அல்லது நோக்கத்தை இரு இணைச் சொற்களுடனும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: மாற்குவில் முக்கியமான இச்சொல்லின் நேரடியான பொருளையும் இன்றைய தமிழ் வாசகர்களுக்கான தெளிவையும் காக்கிறது.
- source_word: ὃς ... ὃς
  choice: விரும்புகிறவர் ... இழக்கிறவர்
  rationale: திறந்த, பொதுவான நிபந்தனையை நவீனத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பால் தெரிவிக்கிறது.
theological_decisions:
- issue: ψυχή என்பதன் மனிதவியல் பொருள்
  choice: முதன்மை உரையில் ‘உயிர்’
  alternative: ‘ஆத்துமா’
  rationale: உடனடிச் சூழல் தன்னலமறுப்பு மற்றும் இயேசுவுக்காக உயிரை இழப்பதைப் பற்றியது. ‘உயிர்’ அந்த முரண்பாட்டைத் தெளிவாகத் தருகிறது; ‘ஆத்துமா’ என்று மட்டும் மொழிபெயர்ப்பது உடலற்ற ஓர் அம்சமாகப் பொருளை தேவையின்றிக் குறுக்கக்கூடும். எனினும் மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: பொதுப்படையான ஆண்பால் ஒருமை
  choice: தமிழில் பொதுப்படையான மரியாதை ஒருமையான ‘வர்’ வடிவம்
  alternative: வெளிப்படையான ஆண்பால் வடிவம்
  rationale: கிரேக்க வடிவம் இலக்கண ரீதியில் ஆண்பால் ஒருமையாக இருந்தாலும் கூற்று யாவருக்கும் பொதுவானது. தமிழின் ‘வர்’ அமைப்பு எண்ணை மாற்றாமல் அந்தப் பொதுப்படையான பொருளை இயல்பாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கிற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘காப்பாற்றிக்கொள்ள’ என்ற வடிவம் ஒருவரின் சொந்த உயிரைக் குறிக்கும் reflexive நுணுக்கத்தைத் தருகிறது; ‘நற்செய்தி’ என்பது வெளிப்படையான, நிலைபெற்ற தமிழ் சமமான சொல்.
