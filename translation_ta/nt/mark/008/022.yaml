translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. மாற்குவின் குறுகிய நிகழ்வுத் தொடரைத் தக்கவைத்தபடி, தமிழில் செய்பவர் தெளிவாக இருக்க φέρουσιν மற்றும் παρακαλοῦσιν ஆகியவற்றின் மறைந்த பன்மை எழுவாயை ‘சிலர்’ என வெளிப்படுத்துகிறது.
