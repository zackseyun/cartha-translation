source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ta
  text: ஏனெனில், விபசாரமானதும் பாவமுள்ளதுமான இந்தத் தலைமுறையில் என்னைப் பற்றியும் என் வார்த்தைகளைப் பற்றியும் எவன் வெட்கப்படுகிறானோ, அவனைக் குறித்து மனிதகுமாரனும் பரிசுத்த தூதர்களோடு தமது தந்தையின் மகிமையில் வரும்போது வெட்கப்படுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விபசாரமானதும் பாவமுள்ளதுமான’ என்பதற்கு ‘உண்மையற்றதும் பாவமுள்ளதுமான’ என்றும் பொருள் கொள்ளலாம். கிரேக்கம், உடன்படிக்கை உண்மையின்மையைக் குறிக்கும் தீர்க்கதரிசன உருவகமாக ‘விபசாரமான’ என்ற வெளிப்படையான சொல்லைப் பயன்படுத்துவதால் அது முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: வெட்கப்படுகிறானோ / வெட்கப்படுவார்
  rationale: ஒருவரையோ அவரது வார்த்தைகளையோ குறித்து வெட்கப்படுதல் என்ற நேரடியான பொருளையும், மனிதனின் தற்போதைய பதிலுக்கும் மனிதகுமாரனின் வருங்காலப் பதிலுக்கும் இடையிலான பரஸ்பரத் தொடர்பையும் காக்கிறது.
- source_word: τοὺς ἐμοὺς λόγους
  choice: என் வார்த்தைகள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாக்கிறது; ‘செய்தி’ என்று ஒருமைப்படுத்தி விளக்குவதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானதும் தமிழில் இயல்பானதும் ஆகும்.
- source_word: γενεᾷ
  choice: தலைமுறை
  rationale: தற்போதைய சமூகத்தையும் காலத்தையும் குறிக்கும் கிரேக்கச் சொல்லின் வழக்கமான பொருளைத் தருகிறது; ‘காலம்’ என்பது தேவையற்ற கருத்தாக்கமாகிவிடும்.
- source_word: μοιχαλίδι
  choice: விபசாரம் நிறைந்த
  rationale: உடன்படிக்கை அல்லது ஆன்மீக உண்மையின்மையைக் குறிக்கும் தீர்க்கதரிசன உருவகத்தின் வெளிப்படையான விபசார மொழியைப் பாதுகாக்கிறது. ‘விபசாரத் தலைமுறை’ என்பதைவிட இவ்வமைப்பு நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: ἁμαρτωλῷ
  choice: பாவம் நிறைந்த
  rationale: நேரடியான பெயரடைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘பொல்லாத’ என்பது மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கக்கூடும்.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: தானியேல் நூல் சார்ந்த மற்றும் கிறிஸ்தியல் எதிரொலிகளை உடைய நிலைபெற்ற வேதாகமப் பட்டத்தைப் பாதுகாக்கிறது; ‘நான்’ அல்லது ‘மேசியா’ என்று மாற்றவில்லை.
- source_word: δόξῃ
  choice: மகிமை
  rationale: தெய்வீக கனத்தையும் ஒளிவீச்சையும் மதிப்பையும் உள்ளடக்கும் நிலைபெற்ற வேதாகமச் சொல்.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: பரிசுத்த தூதர்களோடு
  rationale: கிரேக்கப் பெயரடை அமைப்பை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘அவருடைய’ என்ற உடைமைச்சொல்லைச் சேர்க்கவில்லை.
- source_word: ὃς γὰρ ἐὰν
  choice: ஏனெனில் ... எவன் ... ஓ
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் பொதுவான நிபந்தனையின் வலிமையையும் தமிழின் தொடர்பெச்ச நிபந்தனை அமைப்பில் காக்கிறது.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: இந்தத் தலைமுறையில்
  rationale: வெட்கப்படுதல் வெளிப்படும் சமூக-ஒழுக்கச் சூழலை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: μοιχαλίδι என்பதன் உருவக வலிமை
  choice: முதன்மை உரையில் ‘விபசாரம் நிறைந்த’ என்று வெளிப்படையான தீர்க்கதரிசன உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உண்மையற்ற’ அல்லது ‘துரோகமான’ தலைமுறை
  rationale: கிரேக்கம் விபசாரத்தைக் குறிக்கும் தெளிவான சொல்லைப் பயன்படுத்துகிறது; அதை பொதுவான உண்மையின்மையாக மாற்றுவது உடன்படிக்கைத் துரோகத்தின் வேதாகம எதிரொலியை மங்கச் செய்யும்.
- issue: ‘மனிதகுமாரன்’ என்பவரின் குறிப்பு
  choice: தனித்த கிறிஸ்தியல் பட்டமாக ‘மனிதகுமாரன்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘நான்’ அல்லது ‘மேசியா’
  rationale: மூல உரையின் முடிவுகால மற்றும் தானியேல் நூல் சார்ந்த குறிப்பை மாற்றாமல் காக்கிறது; இயேசுவுக்கும் இப்பட்டத்துக்கும் உள்ள தொடர்பை மொழிபெயர்ப்பில் விளக்கித் தீர்மானிக்கவில்லை.
- issue: αὐτόν என்ற ஒருமை ஆண்பால் சுட்டுப்பெயர்
  choice: ‘அவனைக் குறித்து’
  alternative: ‘அவர்களைக் குறித்து’
  rationale: பொதுவான நிபந்தனையில் வரும் கிரேக்க ஒருமை ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது; தமிழின் ‘எவன் ... அவன்’ அமைப்பு இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- issue: τοῦ πατρὸς αὐτοῦ என்பதிலுள்ள உடைமைத் தொடர்பு
  choice: ‘தமது தந்தையின் மகிமையில்’
  alternative: ‘அவருடைய பிதாவின் மகிமையில்’
  rationale: ‘தமது’ என்பது வாக்கியத்தின் எழுவாயான மனிதகுமாரனைத் தெளிவாகச் சுட்டுகிறது. ‘தந்தை’ நவீனத் தமிழில் இயல்பானது; மூலத்தின் உறவுச் சொல்லைப் பாதுகாக்கிறது.
