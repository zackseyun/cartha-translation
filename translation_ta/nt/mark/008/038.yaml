  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுமக்களுக்கு விளங்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்’, ‘மகிமை’, ‘பரிசுத்த’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் அவற்றின் கருத்தியல் எதிரொலிக்காகத் தக்கவைக்கப்பட்டுள்ளன; பழமையான வினைமுற்றுகளும் தேவையற்ற சமயக்குழு சார்ந்த சொற்களும் தவிர்க்கப்பட்டுள்ளன.
