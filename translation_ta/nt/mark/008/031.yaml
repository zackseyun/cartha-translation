id: MRK.8.31
reference: Mark 8:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: ta
  text: மேலும், மனிதகுமாரன் பல பாடுகளை அனுபவிக்கவும், மூப்பர்களாலும் முதன்மை ஆசாரியர்களாலும் வேத அறிஞர்களாலும் நிராகரிக்கப்படவும், கொல்லப்படவும், மூன்று நாட்களுக்குப் பிறகு உயிர்த்தெழவும் வேண்டும் என்று அவர் அவர்களுக்குக் கற்பிக்கத் தொடங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: கற்பிக்கத் தொடங்கினார்
  rationale: இறந்தகாலத்தில் தொடங்கிய செயலைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தெய்வீகத் திட்டத்துடன் தொடர்புடைய வலுவான அவசியத்தைத் தக்கவைக்கிறது; அந்த அவசியத்தின் தன்மையை மொழிபெயர்ப்பிலேயே மேலதிகமாக விளக்கவில்லை.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: நற்செய்தி நூல்களில் வரும் பட்டப்பெயரையும் அதன் வேதாகம இடைஉரைத் தொடர்புகளையும் பாதுகாக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: πολλὰ παθεῖν
  choice: பல பாடுகளை அனுபவிக்க
  rationale: πολλά என்பதன் பன்மைத் தன்மையையும் πάσχω குறிக்கும் துன்ப அனுபவத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀποδοκιμασθῆναι
  choice: நிராகரிக்கப்பட
  rationale: ஆய்ந்து ஏற்காத அதிகாரப்பூர்வ மறுப்பைக் குறிக்கும் வினையின் மையப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: மூப்பர்களால்
  rationale: வயதானவர்களைப் பொதுவாக அல்ல, அங்கீகரிக்கப்பட்ட யூதத் தலைமைக்குழுவைச் சுட்டும் வரலாற்றுச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: τῶν ἀρχιερέων
  choice: முதன்மை ஆசாரியர்களால்
  rationale: பன்மையில் வரும் தலைமை ஆசாரிய வகுப்பைச் சுட்டுகிறது; பல தலைமைக்குருக்கள் இருந்ததாகத் தவறாக உணர்த்துவதைத் தவிர்க்கிறது.
- source_word: τῶν γραμματέων
  choice: வேத அறிஞர்களால்
  rationale: இவர்கள் வெறும் எழுத்தர்களல்ல, வேதச் சட்டத்தில் தேர்ச்சி பெற்ற அறிஞர்கள் என்பதைக் சாதாரண நவீனத் தமிழ் வாசகருக்கு இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀποκτανθῆναι
  choice: கொல்லப்பட
  rationale: கிரேக்கச் செயலப்பாட்டு வினையின் நேரடியான, வலுவான பொருளைப் பாதுகாக்கிறது.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: மூன்று நாட்களுக்குப் பிறகு
  rationale: μετά உடன் குற்றுவினை வேற்றுமை தரும் இயல்பான ‘பிறகு’ என்ற பொருளைத் துல்லியமாகக் காட்டுகிறது; இணை இடங்களோடு ஒத்திசைக்கவில்லை.
- source_word: ἀναστῆναι
  choice: உயிர்த்தெழ
  rationale: இங்கு தன்னிலைச் செயற்பாட்டில் வரும் உயிர்த்தெழுதலை இயல்பான தமிழ் வேதாகமச் சொல்லாட்சியில் தருகிறது; செயலப்பாட்டு ‘எழுப்பப்பட’ என்று மாற்றவில்லை.
theological_decisions:
- issue: δεῖ குறிக்கும் பாடு, நிராகரிப்பு, மரணம், உயிர்த்தெழுதல் ஆகியவற்றின் அவசியம்
  choice: வேண்டும்
  alternative: அவசியம்
  rationale: வலுவான இறைத் திட்ட அவசியத்தைப் பாதுகாக்கிறது; அதன் இறையியல் செயல்முறையை வசனத்திற்குள் விரிவாக நிர்ணயிப்பதில்லை.
- issue: μετὰ τρεῖς ἡμέρας என்ற காலக் குறிப்பு
  choice: மூன்று நாட்களுக்குப் பிறகு
  alternative: மூன்றாம் நாளில்
  rationale: மாற்குவின் கிரேக்கச் சொற்றொடரை அப்படியே பாதுகாக்கிறது; பிற நற்செய்தி நூல்களின் ‘மூன்றாம் நாளில்’ என்ற வடிவத்தோடு அமைதியாக ஒத்திசைப்பதைத் தவிர்க்கிறது.
- issue: ἀναστῆναι என்பதன் வினைக்குரல்
  choice: உயிர்த்தெழ
  alternative: உயிருடன் எழுப்பப்பட
  rationale: கிரேக்கத்தில் உள்ள செயற்பாட்டு/தன்னிலை வடிவத்தைப் பாதுகாத்து, இறையியல் நோக்கில் செயலப்பாட்டு வடிவத்தை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். கிரேக்கத் தொடரின் நீளமான பட்டியலைத் தமிழில் இயல்பாக இணைத்துள்ளோம். மூலத்தில் இல்லாத அடிக்குறிப்பைச் சேர்க்கவில்லை; வழங்கப்பட்ட ஆங்கில [a] குறி அதன் உரையில் ‘பல பாடுகள்’ என்பதற்குப் பின் தவறாக அமைந்திருந்ததால் தமிழில் எடுத்துக்கொள்ளப்படவில்லை.
