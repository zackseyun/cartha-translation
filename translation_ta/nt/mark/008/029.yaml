source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஆனால் நீங்கள், நான் யார் என்று சொல்கிறீர்கள்?” என்று கேட்டார். பேதுரு அவரிடம், “நீரே மேசியா[a]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.”
    reason: χριστός என்பதற்கான மரபான மாற்று மொழியாக்கம்.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: கேட்டார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் கேள்வி எழுப்பும் நிகழ்வைப் பின்னணிப்படுத்துகிறது. தமிழில் ‘கேட்டுக்கொண்டிருந்தார்’ என்பது தேவையற்ற நீடிப்பை உணர்த்தக்கூடும்; இயல்பான கதைநடையில் ‘கேட்டார்’ என்பதே பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: Ὑμεῖς δὲ
  choice: ஆனால் நீங்கள்
  rationale: δέ முந்தைய கருத்துடன் உள்ள வேறுபாட்டைக் குறிக்கிறது; வெளிப்படையாக வரும் Ὑμεῖς சீடர்களை வலியுறுத்துகிறது. ‘ஆனால் நீங்கள்’ இரண்டையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τίνα με λέγετε εἶναι
  choice: நான் யார் என்று சொல்கிறீர்கள்
  rationale: கிரேக்க மொழியின் வேற்றுமை உருபு–வினையெச்ச அமைப்பை இயல்பான தமிழ் மறைமுகக் கூற்று வடிவில் வழங்குகிறது.
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: அவரிடம் ... பதிலளித்தார்
  rationale: வினையெச்சமும் வரலாற்று நிகழ்கால வினையும் இணைந்து பேதுருவின் பதிலை அறிமுகப்படுத்துகின்றன. தமிழ் கதைநடையில் இறந்தகால வினை இயல்பானது; αὐτῷ என்பதும் ‘அவரிடம்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: Σὺ εἶ
  choice: நீர்
  rationale: வெளிப்படையான Σὺ தரும் நேரடியான வலியுறுத்தலைத் தமிழ் மரியாதை ஒருமையான ‘நீர்’ இயல்பாகத் தக்கவைக்கிறது; ‘இருக்கிறீர்’ என்பதைச் சேர்க்காமல் பெயர்ப் பயனிலை வாக்கியமாக அமைப்பது தமிழில் இயல்பானது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: χριστός இங்கு தனிப்பெயராக அல்ல, அபிஷேகம் செய்யப்பட்ட எதிர்பார்க்கப்பட்ட அரசரைச் சுட்டும் பட்டமாக வருகிறது. ‘மேசியா’ யூதப் பின்னணியையும் பட்டத்தின் பொருளையும் வாசகருக்குத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்வாக்கியத்தில் பேதுரு இயேசுவின் அடையாளத்தை ஒரு பட்டத்தின் மூலம் அறிக்கையிடுகிறார். பெயரைப் போல வாசிக்கப்படக்கூடிய ‘கிறிஸ்து’ என்பதற்குப் பதிலாக, யூத மேசியா எதிர்பார்ப்பை வெளிப்படுத்தும் ‘மேசியா’ முதன்மை உரையில் வைக்கப்படுகிறது; மரபான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் ‘நீர்’ என்றும் அவரைக் குறிக்க ‘அவர்’ என்றும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் வலியுறுத்தலும் கேள்வி–பதில் அமைப்பும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
