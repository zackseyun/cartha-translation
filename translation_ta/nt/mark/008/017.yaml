source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: ta
  text: இதையறிந்த இயேசு அவர்களிடம், “உங்களிடம் அப்பங்கள் இல்லை என்று ஏன் பேசிக்கொண்டிருக்கிறீர்கள்? இன்னும் உணரவும் புரிந்துகொள்ளவும் இல்லையா? உங்கள் உள்ளம் கடினப்பட்டிருக்கிறதா?” என்று கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: இதை அறிந்த
  rationale: முந்தைய சூழலில் சீடர்கள் அப்பம் இல்லாததைப் பற்றிப் பேசுவதை இயேசு அறிந்தார் என்பதே மறைமுகப் பொருள். ‘இதை’ என்பது அந்தச் சூழலை இயல்பாகச் சுட்டுகிறது.
- source_word: διαλογίζεσθε
  choice: விவாதித்துக்கொண்டிருக்கிறீர்கள்
  rationale: சீடர்கள் தங்களுக்குள் ஆலோசித்துப் பேசிக்கொண்டிருந்த செயலைக் குறிக்கிறது; தொடர்நிலையும் பரஸ்பர உரையாடலும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: ἄρτους
  choice: அப்பங்கள்
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, சூழலில் குறிப்பிடப்படும் உணவான அப்பங்களைக் குறிக்கிறது.
- source_word: νοεῖτε
  choice: உணர
  rationale: மனதால் கவனித்து உணரும் பொருளைத் தருகிறது; தொடர்ந்து வரும் συνίετε என்பதிலிருந்து ஓரளவு வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: συνίετε
  choice: புரிந்துகொள்ள
  rationale: ஒன்றின் பொருளையும் முக்கியத்துவத்தையும் அறிந்து கொள்வதைக் குறிக்கிறது; νοεῖτε உடன் வரும் சொற்பொருள் இணையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: πεπωρωμένην
  choice: கடினப்பட்டுப் போயிருக்கிறதா
  rationale: நிறைவுற்ற செயப்பாட்டு வடிவம் குறிக்கும் தொடரும் கடின நிலையைக் காட்டுகிறது; உணர்வற்ற ஆன்மிக மந்தநிலை என்ற உருவகத்தையும் தக்கவைக்கிறது.
- source_word: καρδίαν
  choice: உள்ளம்
  rationale: இங்கு வெறும் உணர்ச்சியைக் காட்டாமல் சிந்தனை, புரிதல், உள்ளார்ந்த பதிலளிப்பு ஆகியவற்றின் மையத்தைக் குறிக்கிறது. நவீன தமிழில் ‘உள்ளம்’ இந்த உருவகத்தை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இறுதிக் கேள்வியில் சீடர்களின் உள்ளார்ந்த நிலையை மொழிபெயர்த்தல்
  choice: உங்கள் உள்ளம் கடினப்பட்டுப் போயிருக்கிறதா?
  alternative: உங்கள் உள்ளத்தைக் கடினப்பட்ட நிலையில் வைத்திருக்கிறீர்களா?
  rationale: ἔχετε + பொருள் + நிறைவுற்ற செயப்பாட்டு வினையெச்சம் என்ற கிரேக்க அமைப்பு நிலைத்திருக்கும் ஒரு நிலையைச் சுட்டுகிறது. சொற்சொல்லான மாற்று தமிழில் இயல்பற்றதோடு சீடர்கள் திட்டமிட்டு தங்கள் உள்ளத்தைக் கடினப்படுத்தினர் என்ற கூடுதல் கருத்தையும் ஏற்படுத்தலாம். தேர்ந்த வடிவம் கடிந்துரைக்கும் கேள்வியையும் நிலையின் தீவிரத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான மூன்று கேள்விகளும் பாதுகாக்கப்பட்டுள்ளன; ‘உணர’ மற்றும் ‘புரிந்துகொள்ள’ என்பவற்றால் இரு கிரேக்க வினைகளின் வேறுபாடு ஓரளவு தக்கவைக்கப்பட்டுள்ளது.
