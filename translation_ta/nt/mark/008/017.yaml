revisions:
- from: இதை அறிந்த இயேசு அவர்களிடம், “அப்பங்கள் இல்லை என்பதைப் பற்றி ஏன் விவாதித்துக்கொண்டிருக்கிறீர்கள்? இன்னும் உணராமலும் புரிந்துகொள்ளாமலும் இருக்கிறீர்களா? உங்கள் உள்ளம் கடினப்பட்டுப் போயிருக்கிறதா?” என்று கேட்டார்.
  to: இதையறிந்த இயேசு அவர்களிடம், “உங்களிடம் அப்பங்கள் இல்லை என்று ஏன் பேசிக்கொண்டிருக்கிறீர்கள்? இன்னும் உணரவும் புரிந்துகொள்ளவும் இல்லையா? உங்கள் உள்ளம் கடினப்பட்டிருக்கிறதா?” என்று கூறினார்.
  rationale: The revision corrects the missing possessive force in the bread clause, uses a more source-proximate speech attribution, and makes minor idiomatic refinements. It preserves the Greek’s three questions, the distinction between νοεῖτε and συνίετε, and the non-agentive sense of the perfect passive πεπωρωμένην.
  reviewer_model: gpt-5.6-terra
