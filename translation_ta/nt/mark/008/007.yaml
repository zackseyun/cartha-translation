  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: ta
  text: அவர்களிடம் சில சிறிய மீன்களும் இருந்தன. அவற்றை ஆசீர்வதித்த பின்பு, இவற்றையும் பரிமாறும்படி அவர் சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: சிறிய மீன்கள்
  rationale: ἰχθύδια என்பது சிறிய அளவைக் குறிக்கும் வடிவம்; எனவே பொதுவான ‘மீன்கள்’ என்பதைக் காட்டிலும் ‘சிறிய மீன்கள்’ மூலத்தின் நுட்பத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὀλίγα
  choice: சில
  rationale: எண்ணக்கூடிய பொருட்களின் குறைந்த எண்ணிக்கையை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: εὐλογήσας
  choice: ஆசீர்வதித்த பின்பு
  rationale: இறந்தகாலப் பங்கேற்பு வினை, அடுத்த செயலில் முன்னதாக நிகழ்ந்ததைச் சுட்டுகிறது; ‘ஆசீர்வதித்த’ என்பது εὐλογέω என்பதற்கு நேரான இணை.
- source_word: αὐτά
  choice: அவற்றை
  rationale: பன்மைச் சுட்டுப்பெயர் முன்பு கூறப்பட்ட சிறிய மீன்களைக் குறிக்கிறது.
- source_word: καὶ ταῦτα
  choice: இவற்றையும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் ταῦτα என்பதன் சுட்டுவலியுறுத்தலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: παρατιθέναι
  choice: பரிமாறும்படி
  rationale: உணவுச் சூழலில் παρατίθημι என்பது உணவை முன்வைத்தல் அல்லது பரிமாறுதல் என்று பொருள்படும்; ‘பரிமாறும்படி’ கட்டளையின் செயற்பாட்டு வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: εἶπεν
  choice: அவர் சொன்னார்
  rationale: εἶπεν என்பதன் அடிப்படைப் பொருளான ‘சொன்னார்’ என்பதைப் பாதுகாக்கிறது; அறிவுறுத்தல் என்பது தொடர்ந்து வரும் வினையெச்சத் தொடரால் தெளிவாகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் மறைமுகமாக உள்ள செய்பவரை ‘சீடர்கள்’ என்று வெளிப்படையாகச் சேர்க்காமல், ‘பரிமாறும்படி அவர் சொன்னார்’ என அத்தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
