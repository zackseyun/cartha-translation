id: MRK.8.26
reference: Mark 8:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: ta
  text: அவர் அவனை அவனுடைய வீட்டுக்கு[a] அனுப்பி, “அந்தக் கிராமத்துக்குள்கூடப் போகாதே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “கிராமத்தில் யாரிடமும் சொல்லாதே” என்பதும் சேர்க்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பி
  rationale: இங்கு இயேசு அந்த மனிதனைத் திருப்பி அனுப்புவதைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்தில் பின்னர் வரும் பேச்சுவினையுடன் இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: εἰς οἶκον αὐτοῦ
  choice: அவனுடைய வீட்டுக்கு
  rationale: அவனுக்குச் சொந்தமான வாழ்விடத்தை நோக்கிய இலக்கை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: λέγων
  choice: என்றார்
  rationale: பேச்சை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்புவினையின் செயல்பாட்டை இயல்பான தமிழ் நேரடி உரை அமைப்பில் தருகிறது.
- source_word: Μηδὲ
  choice: கூட ... போகாதே
  rationale: வெறும் இணைப்பு மறுப்பாக அல்லாமல், கிராமத்திற்குள் செல்வதையே வலியுறுத்தி மறுக்கும் μηδέ என்பதன் அழுத்தத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κώμην
  choice: கிராமம்
  rationale: κώμη குறிக்கும் சிறிய குடியிருப்புக்கு நேரான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: εἰσέλθῃς
  choice: போகாதே
  rationale: εἰς τὴν κώμην என்பதுடன் சேர்ந்து ‘கிராமத்துக்குள் செல்லாதே’ என்ற திசை சார்ந்த தடையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நுழையாதே’ என்பதைவிட உரையாடலில் இயல்பானது.
theological_decisions:
- issue: கிராமத்தைப் பற்றிய இயேசுவின் தடையின் வரம்பு
  choice: கிராமத்துக்குள் செல்ல வேண்டாம் என்ற கட்டளையை மட்டும் முதன்மை உரையில் தருதல்
  alternative: சில கையெழுத்துப் பிரதிகளின்படி, கிராமத்தில் யாரிடமும் சொல்ல வேண்டாம் என்பதையும் சேர்த்தல்
  rationale: SBLGNT முதன்மை உரையில் கிராமத்துக்குள் செல்லக்கூடாது என்ற தடை மட்டுமே உள்ளது. நீளமான வேறுபாட்டு வாசகத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் பதிவு செய்வது மூல உரையின் சான்றை மதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘அந்தக் கிராமத்துக்குள்கூடப் போகாதே’ என்பது μηδέ என்பதன் வலியுறுத்தலையும் εἰς என்பதன் உள்ள்நோக்கிய திசையையும் இயல்பாகத் தக்கவைக்கிறது.
