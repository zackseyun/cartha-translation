  naturalness: The sentence is natural modern standard Tamil. “கிராமத்துக்குள்கூடப் போகாதே” is idiomatic and clearly expresses the prohibition against going into the village.
  terminology: “வீட்டுக்கு,” “கிராமம்,” and “போகாதே” are clear, appropriately dignified, and suitable for a modern Tamil Bible. The textual-variant footnote faithfully reflects the longer reading without placing it in the main text.
