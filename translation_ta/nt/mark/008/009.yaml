  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: ta
  text: 'ஏறக்குறைய நான்காயிரம் பேர் இருந்தனர். அவர் அவர்களை அனுப்பிவிட்டார்.[a]


    [a] அல்லது, “கூட்டத்தைக் கலைத்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூட்டத்தைக் கலைத்தார்.”
    reason: ἀπολύω என்பதன் இச்சூழல்சார் மாற்றுப் பொருளான ‘கூட்டத்தைக் கலைத்தல்/விடைபெறச் செய்து அனுப்புதல்’ என்பதைக் காக்கிறது.
lexical_decisions:
- source_word: ἦσαν
  choice: இருந்தார்கள்
  rationale: இங்கு εἰμί கூட்டத்தின் எண்ணிக்கையைச் சுட்டும் இருப்புப் பொருளில் வருகிறது; தமிழில் மனிதர்களைக் குறிக்கும் இயல்பான பன்மை வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: பின்பு
  rationale: δέ மென்மையான உரையாடல் இணைப்பாக உள்ளது. சூழலில் அடுத்த நிகழ்வை இயல்பாகத் தொடர்வதற்காக ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது; இது வலுவான முரண்பாட்டை உருவாக்காது.
- source_word: ὡς
  choice: ஏறக்குறைய
  rationale: எண்ணுக்கு முன் வரும் ὡς தோராயத்தைக் குறிக்கிறது; ‘ஏறக்குறைய’ நவீன தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τετρακισχίλιοι
  choice: நான்காயிரம் பேர்
  rationale: ஆண்பால் பன்மை எண்ணுச் சொல் மக்களைக் குறிக்கிறது; தமிழில் மனிதர்களின் எண்ணிக்கை என்பதைத் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπέλυσεν
  choice: அனுப்பிவிட்டார்
  rationale: இந்தச் சூழலில் ἀπολύω கூட்டத்தை விடைபெறச் செய்து அனுப்புவதைக் குறிக்கிறது. ‘அனுப்பிவிட்டார்’ என்பது இயல்பான தமிழ்; ‘கலைந்து போகச் செய்தார்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: முன்னர் குறிப்பிடப்பட்ட மக்களைக் குறிக்கும் பன்மைப் பெயர்ப்பதிலியாக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
