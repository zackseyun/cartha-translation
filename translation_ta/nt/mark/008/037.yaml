    text: அல்லது, “தம் ஆன்மாவுக்கு” அல்லது “தனக்கே”; இங்குள்ள கிரேக்கச் சொல் சூழலுக்கு ஏற்ப “உயிர்,” “தன் முழு இருப்பு,” அல்லது “ஆன்மா” என்று பொருள்படும்.
