lexical_decisions:
- source_word: τί γὰρ
  choice: ஏனெனில் ... எதை
  rationale: τί கேள்விக்குரிய ‘எதை’ என்பதையும், γάρ முந்தைய கூற்றை விளக்கும் தொடர்பை ‘ஏனெனில்’ என்பதாலும் வெளிப்படுத்துகிறது.
- source_word: δοῖ
  choice: கொடுக்க முடியும்
  rationale: இறந்தகால வினைமுற்றுத் தோற்றமுடைய subjunctive இங்கு நடைமுறைச் சாத்தியத்தை வினவும் வாதக்கேள்வியாக வருகிறது; ‘கொடுக்க முடியும்’ என்பது நவீனத் தமிழில் அதன் வலிமையை இயல்பாகத் தருகிறது.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: இங்கு ஆண்பால் ஒருமை வடிவம் பொதுவாக எந்த மனிதரையும் குறிக்கிறது; ‘ஒருவர்’ அந்தப் பொதுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀντάλλαγμα
  choice: ஈடாக
  rationale: பதிலாக அல்லது பரிமாற்றமாகக் கொடுக்கப்படும் ஒன்றைக் குறிக்கும் சொல்லை, ‘கொடு’ என்ற வினையுடன் இயல்பாக இணையும் ‘ஈடாக’ வெளிப்படுத்துகிறது.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: தன் உயிருக்கு
  rationale: ψυχή இச்சூழலில் ஒருவரின் உயிரையும் முழுத் தன்னையும் அடுக்குப்பொருளாகக் கொண்டுள்ளது. ‘உயிர்’ உடனடியான சூழலோடு பொருந்தும் தெளிவான முதன்மை மொழிபெயர்ப்பு; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: இரட்சிப்பு சார்ந்த கூற்றில் ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆன்மா; தன்னையே
  rationale: மாற்கு 8:35–37 சூழலில் இச்சொல் இவ்வுலக உயிரைக் குறிப்பதோடு ஒருவரின் முழுத் தன்மையையும் உள்ளடக்குகிறது. ‘உயிர்’ சூழலின் தொடர்ச்சியையும் வாசிப்பின் இயல்பையும் காக்கிறது; ‘ஆன்மா’ மற்றும் ‘தன்னையே’ என்ற சாத்தியங்களை அடிக்குறிப்பு பாதுகாப்பதால் பொருளின் இறையியல் ஆழம் ஒரே விளக்கமாகச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட வாதக்கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ போன்ற பழைய அல்லது குறிப்பிட்ட சமய வழக்குச் சொல்லுக்குப் பதிலாக, மாற்று வாசிப்பில் பொதுவாகப் புரியும் ‘ஆன்மா’ பயன்படுத்தப்பட்டுள்ளது.
