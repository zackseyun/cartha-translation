source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: ta
  text: அவர் இந்தச் செய்தியை வெளிப்படையாக[a] பேசிக்கொண்டிருந்தார். பேதுரு அவரைத் தனியே அழைத்துக்கொண்டு, அவரைக் கண்டிக்கத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெளிவாக’ அல்லது ‘துணிவாக.’ கிரேக்கச் சொல் ஒளிவுமறைவற்ற, நேரடியான பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: மறைக்காமலும் ஒளிவுமறைவில்லாமலும் நேரடியாகப் பேசுவதை இச்சொல் குறிக்கிறது. இச்சூழலில் துணிச்சலைவிட பேச்சின் வெளிப்படைத்தன்மையும் தெளிவுமே முன்னிலையில் உள்ளன.
- source_word: τὸν λόγον
  choice: இந்தச் செய்தியை
  rationale: இது முந்தைய வசனத்தில் இயேசு கூறிய துன்பம், மரணம், உயிர்த்தெழுதல் பற்றிய அறிவிப்பைக் குறிக்கிறது. சொற்சொல்லான ‘அந்த வார்த்தையை’ என்பதைவிட ‘இந்தச் செய்தியை’ நவீன தமிழில் இயல்பாகவும் தொடர்பைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐλάλει
  choice: பேசிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவத்தின் தொடர்நிலைத் தன்மையைத் தமிழில் வெளிப்படுத்துகிறது; மீண்டும் மீண்டும் பேசினார் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: προσλαβόμενος
  choice: தனியே அழைத்துச் சென்று
  rationale: பேதுரு இயேசுவை மற்றவர்களிடமிருந்து ஒதுக்கித் தனியாகப் பேச அழைத்துச் சென்றார் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: அவரைக் கண்டிக்கத் தொடங்கினார்
  rationale: ἤρξατο உடன் வரும் வினையெச்சக் கட்டமைப்பின் ‘தொடங்கினார்’ என்ற பொருளையும், ἐπιτιμάω என்பதன் வலுவான கடிந்துகொள்ளுதல் அல்லது கண்டித்தல் என்ற பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவின் துன்ப அறிவிப்புடன் தொடர்புடைய παρρησίᾳ என்பதன் வலிமை
  choice: வெளிப்படையாக
  alternative: தெளிவாக; துணிவாக
  rationale: இயேசு எதையும் மறைக்காமல் நேரடியாகச் சொன்னார் என்பதே இங்கு முதன்மை. இது பேதுருவின் உடனடி எதிர்வினைக்கான கதைநடைப் பின்னணியைப் பாதுகாக்கிறது; இயேசுவின் துணிச்சலை மட்டும் வலியுறுத்தும் கூடுதல் விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; இயல்பானதாயும் கண்ணியமானதாயும் அமைந்த நடை. ‘இந்தச் செய்தி’ முந்தைய வசனத்தின் அறிவிப்பைச் சுட்டுகிறது. ‘பேசிக்கொண்டிருந்தார்’ என்பது கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்நிலையைப் பாதுகாக்கிறது.
