revisions:
- from: அவர் இந்தச் செய்தியை வெளிப்படையாக[a] பேசிக்கொண்டிருந்தார். அப்போது பேதுரு அவரைத் தனியே அழைத்துச் சென்று, அவரைக் கண்டிக்கத் தொடங்கினார்.
  to: அவர் இந்தச் செய்தியை வெளிப்படையாக[a] பேசிக்கொண்டிருந்தார். பேதுரு அவரைத் தனியே அழைத்துக்கொண்டு, அவரைக் கண்டிக்கத் தொடங்கினார்.
