source:
  edition: SBLGNT
  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: ta
  text: பின்பு அவர் மீண்டும் தமது கைகளை அவனுடைய கண்கள்மேல் வைத்தார்[a]. அவன் தெளிவாகப் பார்த்தான்; அவனுடைய பார்வை மீட்கப்பட்டது[b]; அவன் எல்லாவற்றையும் தெள்ளத் தெளிவாகப் பார்த்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், இதைத் தொடர்ந்து வரும் சொற்கள், “அவன் உற்றுப் பார்த்தான்; அவனுடைய பார்வை மீட்கப்பட்டது; எல்லாவற்றையும் தெளிவாகக் கண்டான்” என மொழிபெயர்க்கக்கூடிய வடிவில் உள்ளன.
    reason: textual_variant
  - marker: b
    text: அல்லது, “அவன் எல்லாவற்றையும் தெளிவாகப் பார்க்க முடிந்தது.” இறுதிக் கூற்றில் இறந்தகாலத் தொடர்நிலை வினையும் தெளிவான பார்வையைக் குறிக்கும் வினையடையும் இணைந்துள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: பின்பு … மீண்டும்
  rationale: εἶτα குறிக்கும் நிகழ்வின் தொடர்ச்சியையும் πάλιν குறிக்கும் மறுமுறையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: தமது கைகளை அவனுடைய கண்கள்மேல் வைத்தார்
  rationale: கைகளின் பன்மையையும் குணமாக்கும் நிகழ்விலுள்ள நேரடியான உடல் செயலையும் வெளிப்படையாகக் காக்கிறது; இயேசுவைக் குறிக்கும் மரியாதை ஒருமைக்கு ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: διέβλεψεν
  choice: அவன் தெளிவாகப் பார்த்தான்
  rationale: διαβλέπω இங்கு தெளிவாகப் பார்க்கத் தொடங்கிய நிறைவான நிகழ்வைக் குறிக்கிறது; வேறு கையெழுத்துப் பிரதிகளின் ‘உற்றுப் பார்த்தான்’ என்ற வாசகத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: ἀπεκατέστη
  choice: அவனுடைய பார்வை மீட்கப்பட்டது
  rationale: முந்தைய அல்லது உரிய நிலைக்குத் திரும்பியதைக் குறிக்கும் ἀποκαθίστημι என்பதன் பொருளை, சூழலில் பார்வையோடு இயல்பாக இணைத்து, காரணத்தை மிகையாக விளக்காமல் தருகிறது.
- source_word: ἐνέβλεπεν
  choice: பார்த்துக்கொண்டிருந்தான்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் நீடிக்கும் அல்லது விளைவாகத் தொடரும் அம்சத்தைத் தமிழின் ‘-க்கொண்டிருந்தான்’ வடிவம் காக்கிறது.
- source_word: τηλαυγῶς
  choice: தெள்ளத் தெளிவாக
  rationale: தெளிவாகவும் வேறுபடுத்தியும் காணும் பொருளை இயல்பான தமிழில் வலியுறுத்துகிறது; தொலைவிலிருந்து காணுதல் என்ற சாத்திய நுண்பொருளை உறுதியானதாக மாற்றவில்லை.
- source_word: ἅπαντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மை இங்கு முழுமையைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இரண்டு கட்டங்களாக நிகழும் குணமாக்குதலின் கதைச் சித்தரிப்பு
  choice: செயல்களின் தொடரையும், தெளிவாகப் பார்த்தல், பார்வை மீட்கப்படுதல், தொடர்ந்து பார்த்துக்கொண்டிருத்தல் ஆகிய முன்னேற்றத்தையும் காத்தல்
  alternative: எல்லா வினைகளையும் வேறுபாடில்லாத முடிவுற்ற இறந்தகாலச் செயல்களாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரையில் தொடர்ச்சியான வினைகள் உள்ளன; அவற்றில் ἐνέβλεπεν இறந்தகாலத் தொடர்நிலையில் உள்ளது. இதைக் காப்பது நிகழ்வை ஒரே கணத்தில் முடிந்த செயலாகச் சமப்படுத்தாமல், உரையின் கதை மற்றும் இறையியல் அழுத்தத்தை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடையில் அமைந்துள்ளது. இயேசுவைக் குறிக்க மரியாதை ஒருமையும், குணமடைந்த மனிதரைக் குறிக்க இயல்பான ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. கிரேக்க வினைகளின் நிகழ்வுத் தொடரைத் தமிழ் வாசகனுக்குப் புரியும் வகையில் அரைப்புள்ளிகளால் பிரித்துள்ளோம்.
