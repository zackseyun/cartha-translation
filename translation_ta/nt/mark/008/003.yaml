source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: ta
  text: “நான் அவர்களைப் பசியோடு அவரவர் வீட்டுக்கு அனுப்பிவிட்டால், அவர்கள் வழியிலேயே சோர்ந்து விழுந்துவிடுவார்கள்[a]. மேலும், அவர்களில் சிலர் வெகுதொலைவிலிருந்து வந்திருக்கிறார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழியில் தளர்ந்துவிடுவார்கள்.” கிரேக்க வினைச்சொல், ஒருவர் மிகவும் பலவீனமடைந்து அல்லது களைப்படைந்து தொடர்ந்து செல்ல முடியாத நிலையை அடைவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: அனுப்பிவிட்டால்
  rationale: இந்த உணவளிக்கும் நிகழ்வில் கூட்டத்தினரை விடுவித்து அனுப்புவதைக் குறிக்கிறது; அடிமைத்தனத்திலிருந்து விடுவித்தல் போன்ற வேறு பொருள்களைத் தவிர்க்கிறது.
- source_word: νήστεις
  choice: பசியோடு
  rationale: சமய நோன்பை அல்ல, உணவு உண்ணாமல் இருப்பதால் ஏற்பட்ட உடல் நிலையை இங்கு குறிக்கிறது. ‘பசியோடு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: εἰς οἶκον αὐτῶν
  choice: அவரவர் வீட்டுக்கு
  rationale: ஒவ்வொருவரும் தமது வீட்டுக்குச் செல்வதான பகிர்ந்தளிக்கும் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκλυθήσονται
  choice: சோர்ந்து விழுந்துவிடுவார்கள்
  rationale: வழியில் தொடர்ந்து செல்ல முடியாத அளவுக்கு உடல் வலுவிழப்பதைத் தெரிவிக்கிறது; வெறும் களைப்பைக் காட்டிலும் மூலச்சொல்லின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியிலேயே
  rationale: பயணத்தின் நடுவில் இது நிகழும் என்பதை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: καί τινες αὐτῶν
  choice: அவர்களில் சிலர்
  rationale: கூட்டத்தில் ஒரு பகுதியினரை நேரடியாகக் குறிக்கிறது. தமிழில் புதிய வாக்கியத் தொடக்கம் போதுமான இணைப்பை அளிப்பதால் καί தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படவில்லை.
- source_word: ἀπὸ μακρόθεν
  choice: வெகுதொலைவிலிருந்து
  rationale: அவர்கள் பயணம் செய்து வந்த நீண்ட தொலைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἥκασιν
  choice: வந்திருக்கிறார்கள்
  rationale: வெகுதொலைவிலிருந்து வந்து இப்போது அங்கு இருப்பதைச் சுட்டும் கிரேக்க நிறைவுநிலை வடிவத்தின் தற்போதைய விளைவைப் பாதுகாக்கிறது.
