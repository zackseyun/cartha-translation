  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: ta
  text: அவர்கள் அப்பங்களை எடுத்துக்கொண்டு வர மறந்துவிட்டார்கள்[a]. படகில் அவர்களுடன் ஒரே ஒரு அப்பத்தைத் தவிர வேறு அப்பம் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “அப்பம் எடுத்துக்கொண்டு வர மறந்துவிட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். ἄρτους என்பது பன்மை வடிவமாக இருந்தாலும், இங்கு பொதுவாக அப்ப உணவையோ பயண உணவுப் பொருட்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: மறந்துவிட்டார்கள்
  rationale: இறந்தகாலக் கதைச்சூழலில், முன்பே நிகழ்ந்த மறதியால் இப்போது உணவு இல்லாத நிலை ஏற்பட்டிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: λαβεῖν
  choice: எடுத்துக்கொள்ள
  rationale: பயணத்திற்காகத் தங்களுடன் கொண்டுவருதல் என்ற சூழல்சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄρτους
  choice: அப்பங்களை
  rationale: மூலத்தின் பன்மையைப் பாதுகாக்கிறது; இங்கு தனித்தனி அப்பங்களையோ பொதுவாக அப்ப உணவையோ குறிக்கக்கூடிய நெகிழ்வும் நீடிக்கிறது.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: ஒரே ஓர் அப்பத்தைத் தவிர
  rationale: εἰ μή என்பதன் விலக்குப் பொருளையும் ἕνα என்பதன் எண்ணிக்கையையும் தெளிவாகக் காக்கிறது.
- source_word: οὐκ εἶχον
  choice: வேறு அப்பம் இல்லை
  rationale: முந்தைய விலக்குச் சொற்றொடருடன் இயல்பாக இணைந்து, அந்த ஓர் அப்பத்தைத் தவிர கூடுதல் அப்பம் எதுவும் இல்லை என்பதைத் தெரிவிக்கிறது.
- source_word: μεθ’ ἑαυτῶν
  choice: அவர்களிடம்
  rationale: தங்களுடன் வைத்திருந்தார்கள் என்ற பொருளுக்கான சுருக்கமான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐν τῷ πλοίῳ
  choice: படகில்
  rationale: ἐν என்பதையும் கதை நிகழும் இடத்தையும் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
