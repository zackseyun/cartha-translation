  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள ἄρτους என்ற பன்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொதுப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
