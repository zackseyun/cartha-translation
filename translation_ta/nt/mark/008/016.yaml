  text: καὶ διελογίζοντο πρὸς ⸀ἀλλήλους ὅτι ἄρτους οὐκ ⸀ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: ta
  text: அவர்கள் தங்களிடம் அப்பங்கள் இல்லை என்று தங்களுக்குள் பேசிக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான ஒருமைப் பயன்பாட்டில், ‘தங்களிடம் அப்பம் இல்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடந்த பரஸ்பர ஆலோசனையை இறந்தகாலத் தொடர்நிலை வடிவில் இயல்பாக வெளிப்படுத்துகிறது; ‘யோசித்துக்கொண்டிருந்தார்கள்’ என்பது உள்ளார்ந்த சிந்தனை எனத் தவறாகப் புரியக்கூடும்.
- source_word: πρὸς ἀλλήλους
  choice: தங்களுக்குள்
  rationale: சீடர்கள் ஒருவரோடொருவர் நடத்திய பரஸ்பர உரையாடலை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இங்கு காரணத்தை அல்ல, அவர்கள் பேசியதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἄρτους
  choice: அப்பங்கள்
  rationale: மூலத்தின் பன்மையையும் உடனடி சூழலில் எண்ணப்படும் அப்பங்களுடனான தொடர்பையும் காக்கிறது.
- source_word: οὐκ ἔχουσιν
  choice: தங்களிடம் ... இல்லை
  rationale: கிரேக்கத்தில் நிகழ்காலமாக இருந்தாலும் மறைமுகக் கூற்றுக்குள் வரும் உடைமையின்மையைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; தனியான காலப் பின்னகர்த்தல் தமிழில் தேவையில்லை.
