source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: ta
  text: அவர் பார்வையற்ற அந்த மனிதனின் கையைப் பிடித்து, அவனை கிராமத்துக்கு வெளியே அழைத்துச் சென்றார். பின்பு அவனுடைய கண்களின்மேல்[a] உமிழ்ந்து, அவன்மேல் தம் கைகளை வைத்து, “நீ ஏதாவது பார்க்கிறாயா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “அவனுடைய கண்களுக்குள் உமிழ்ந்து.”
    reason: εἰς என்பதன் நேரடியான திசைப்பொருளைச் சுட்டும் சொல்லாட்சி மாற்று.
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: பார்வையற்ற அந்த மனிதனின் கையைப் பிடித்து
  rationale: கையைப் பற்றிக்கொள்வதைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் தெளிவான உடல் செயலை இயல்பான நவீன தமிழில் தருகிறது; substantival τυφλοῦ என்பதை மரியாதையான பொதுவழக்கில் ‘பார்வையற்ற அந்த மனிதன்’ என வெளிப்படுத்துகிறது.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: அவனை கிராமத்துக்கு வெளியே அழைத்துச் சென்றார்
  rationale: ἐκφέρω என்பதன் வெளியே கொண்டுசெல்லும் திசைப்பொருளையும், கையைப் பிடித்து வழிநடத்தும் இச்சூழலையும் இயல்பாகப் பாதுகாக்கிறது; κώμη என்பதற்கு ‘கிராமம்’ பொருத்தமானது.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: அவனுடைய கண்கள்மேல் உமிழ்ந்து
  rationale: உமிழும் உடல் செயலை மென்மைப்படுத்தாமல் தக்கவைக்கிறது. εἰς என்பதன் சொல்லாட்சி ‘கண்களுக்குள்’ என்றும் புரியக்கூடியதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: அவன்மேல் தம் கைகளை வைத்து
  rationale: கைகளால் தொடும் செயலை நேரடியாகத் தருகிறது; பிற்காலச் சடங்கு சார்ந்த பொருளை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: ἐπηρώτα αὐτόν
  choice: என்று கேட்டார்
  rationale: இறந்தகால imperfect வடிவத்தைத் தமிழ் நிகழ்வுரையின் இயல்புக்கு ஏற்ற எளிய வினையாகத் தருகிறது; தொடர்ச்சியாகக் கேட்டார் என்ற பொருளைத் தேவையின்றித் திணிக்கவில்லை.
- source_word: Εἴ τι βλέπεις;
  choice: உனக்கு ஏதாவது தெரிகிறதா?
  rationale: பார்வை உண்டா என விசாரிக்கும் நேரடிக் கேள்வியாகவும், indefinite τι என்பதன் உறுதியற்ற தன்மையை ‘ஏதாவது’ என்பதாலும் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: குணமாக்கும் செயல்களின் உடல்சார்ந்த நேரடித்தன்மை
  choice: கண்கள்மேல் உமிழ்வதையும் கைகளை வைப்பதையும் வெளிப்படையாகத் தக்கவைத்தல்
  alternative: உடல்சார்ந்த விவரங்களை மென்மைப்படுத்திய பொழிப்புரை
  rationale: மூலவசனம் வியப்பூட்டக்கூடிய தொட்டுணரத்தக்க செயல்களின் வரிசையை விவரிக்கிறது; அதை மொழிபெயர்ப்பு மறைக்கக் கூடாது.
- issue: கைகளை வைப்பதன் சடங்கு சார்ந்த உட்பொருள்
  choice: எளிய உடல் செயல் என ‘அவன்மேல் தம் கைகளை வைத்து’ என்று மொழிபெயர்த்தல்
  alternative: முறைப்படியான சமயச் சடங்காக விளக்குதல்
  rationale: இச்சூழலில் இது இயேசுவின் குணமாக்கும் தொடுதலை விவரிக்கிறது; வசனம் கோராத பிற்கால திருச்சபை சார்ந்த பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவுக்கு மரியாதைப் பன்மையும், மற்ற நபரைக் குறிக்க இயல்பான ஒருமை வடிவமும் பயன்படுத்தப்பட்டுள்ளன. ‘பார்வையற்ற அந்த மனிதன்’ என்பது மூலத்தின் substantival adjective-ஐ மனிதரை இழிவுபடுத்தாத நடையில் தருகிறது.
