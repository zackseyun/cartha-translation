translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரண்டு இணை நிகழ்வுகள் தமிழில் தெளிவுக்காக இரு வாக்கியங்களாக வழங்கப்பட்டுள்ளன. அடிக்குறிப்புக் குறி அது விளக்கும் ‘கூடைகள்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
