  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: ta
  text: அவர்கள் சாப்பிட்டுத் திருப்தியடைந்தார்கள். அவர்கள் மீதியாக இருந்த துண்டுகளை ஏழு கூடைகள் நிறையச் சேகரித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: எளிய இறந்தகால நிகழ்வை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது; மூலத்தில் இல்லாத வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: ἐχορτάσθησαν
  choice: திருப்தியடைந்தார்கள்
  rationale: போதுமான அளவு உண்டு நிறைவடைந்தார்கள் என்ற பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἦραν
  choice: சேகரித்தார்கள்
  rationale: மீதியான உணவுத் துண்டுகளை எடுத்துச் சேர்த்த சூழலில், αἴρω என்பதன் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: περισσεύματα κλασμάτων
  choice: மீதியாக இருந்த துண்டுகள்
  rationale: மீதமிருந்த மிகுதியையும் உடைக்கப்பட்ட உணவுத் துண்டுகளையும் தெளிவாகக் காட்டுகிறது; தேவையின்றி அவை அப்பத்துண்டுகள் என்று குறிப்பாக்கவில்லை.
- source_word: ἑπτὰ σπυρίδας
  choice: ஏழு கூடைகள் நிறைய
  rationale: கிரேக்க எண்ணிக்கையையும் கூடைகளின் அளவாகச் சேகரிக்கப்பட்ட பொருளையும் இயல்பான தமிழில் தருகிறது; σπυρίς என்ற குறிப்பிட்ட கூடைச் சொல்லின் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
