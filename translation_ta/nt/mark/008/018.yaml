  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: ta
  text: கண்கள் இருந்தும் நீங்கள் காணவில்லையா? காதுகள் இருந்தும் நீங்கள் கேட்கவில்லையா? மேலும், நீங்கள் நினைவுகூரவில்லையா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: கண்கள் இருந்தும்
  rationale: கிரேக்கப் பங்கேற்புவினை அமைப்பு சூழலில் விட்டுக்கொடுப்பு பொருளைக் கொண்டுள்ளது. தமிழில் ‘இருந்தும்’ என்பது இயல்பாகவும் கேள்வியின் கண்டனத் தொனியைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: βλέπετε
  choice: நீங்கள் காணவில்லையா
  rationale: அடிப்படைப் பொருளான ‘காணுதல்’ தக்கவைக்கப்படுகிறது; சூழல் அதன் உள்ளுணர்வு சார்ந்த ஆழ்ந்த பொருளை உணர்த்த அனுமதிக்கப்படுகிறது.
- source_word: ὦτα ἔχοντες
  choice: காதுகள் இருந்தும்
  rationale: முந்தைய இணை அமைப்புடன் ஒத்திசைவைக் காக்கிறது; தமிழில் இயல்பான விட்டுக்கொடுப்பு வடிவமாக உள்ளது.
- source_word: ἀκούετε
  choice: நீங்கள் கேட்கவில்லையா
  rationale: ‘கேட்குதல்’ என்ற நேரடியான சொற்பொருளைக் காக்கிறது; ‘புரிந்துகொள்ளுதல்’ அல்லது ‘செவிசாய்த்தல்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: μνημονεύετε
  choice: நினைவுகூரவில்லையா
  rationale: முன்னர் நடந்தவற்றை மனத்தில் மீட்டெடுத்தலைக் குறிக்கும் கிரேக்க வினைக்கு dignified, தெளிவான நவீனத் தமிழ் இணை.
- source_word: καὶ
  choice: இன்னும்
  rationale: இறுதிக் கேள்வியில் καὶ-யின் சேர்க்கை/தொடர்ச்சி வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முதல் இரண்டு இணைக் கேள்விகளுக்கு இடையில் தனியான ‘மற்றும்’ தேவைப்படாமல் தொடரமைப்பு காக்கப்படுகிறது.
- source_word: οὐ / οὐκ
  choice: -வில்லையா
  rationale: எதிர்மறை வினாவைத் தமிழில் இயல்பாக உருவாக்கும் வினைமுற்று; மூன்று வினாக்களின் கண்டனத் தொனியையும் காக்கிறது.
theological_decisions:
- issue: காணுதல், கேட்குதல் ஆகியவற்றின் புலன்சார் பொருளா அல்லது உருவகப் பொருளா
  choice: முதன்மை உரையில் ‘காண’ மற்றும் ‘கேட்க’ என்ற நேரடியான புலன்சார் வினைகளை வைத்தல்
  alternative: ‘உணர்ந்துகொள்ள’ மற்றும் ‘புரிந்துகொள்ள’ என்று உருவகப் பொருளை வெளிப்படையாக்குதல்
  rationale: கிரேக்கம் சாதாரண புலன்சார் வினைகளையே பயன்படுத்துகிறது; சூழலில் அவை ஆன்மீக உணர்வின்மையைச் சுட்டலாம். நேரடி சொற்களை வைத்திருப்பது தீர்க்கதரிசன மொழியின் எதிரொலியையும் உண்மையான பொருள் அடுக்கையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். இணையான மூன்று கண்டனக் கேள்விகளின் ஓட்டம் காக்கப்பட்டுள்ளது; ‘இருந்தும்’ என்பது கிரேக்கப் பங்கேற்புவினையின் சூழல்சார் விட்டுக்கொடுப்பு வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
