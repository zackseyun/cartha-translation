id: MRK.8.5
reference: Mark 8:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτα αὐτούς· Πόσους ἔχετε ἄρτους; οἱ δὲ εἶπαν· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உங்களிடம் எத்தனை அப்பங்கள் இருக்கின்றன?” என்று கேட்டார். அவர்கள், “ஏழு” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: அவர்
  rationale: கிரேக்க καί எளிய கதைத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் முந்தைய வாக்கியத்துடன் இயல்பாகத் தொடர்வதால் தனியாக ‘மேலும்’ அல்லது ‘பின்பு’ சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: ἠρώτα αὐτούς
  choice: அவர் அவர்களிடம் ... என்று கேட்டார்
  rationale: ἐρωτάω என்பதன் இறந்தகால நீடிப்பு வடிவம் இச்சூழலில் நிகழ்ந்த கேள்வியை இயல்பான தமிழ் கதைநடையில் ‘கேட்டார்’ எனத் தருகிறது; αὐτούς என்பது ‘அவர்களிடம்’ எனக் கேள்வியின் நோக்குக் குழுவைக் குறிக்கிறது.
- source_word: Πόσους ἔχετε ἄρτους
  choice: உங்களிடம் எத்தனை அப்பங்கள் இருக்கின்றன?
  rationale: எண்ணக்கூடிய ἄρτους என்பதால் பன்மையான ‘அப்பங்கள்’ பயன்படுத்தப்பட்டுள்ளது; ἔχετε என்பது இயல்பான தமிழில் ‘உங்களிடம் ... இருக்கின்றன’ என வழங்கப்பட்டுள்ளது.
- source_word: οἱ δὲ εἶπαν
  choice: அவர்கள் ... என்றார்கள்
  rationale: δέ பதிலைத் தொடங்கும் மென்மையான தொடர்ச்சியைக் குறிக்கிறது; தனிக் கூட்டுச்சொல் சேர்க்காமல் வாக்கிய மாற்றத்தின் மூலம் அது இயல்பாக வெளிப்படுகிறது. εἶπαν என்பதற்கு நேரடியாக ‘என்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἑπτά
  choice: ஏழு
  rationale: எண்ணிக்கைச் சொல்லான நேரடியான பதில் அப்படியே தரப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, மரியாதைமிக்க கதைநடை. ‘அப்பங்கள்’ என்பது எண்ணக்கூடிய தனித்தனி ரொட்டிகளைச் சுட்டும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
