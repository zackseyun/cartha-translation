  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: ta
  text: அவர்களை விட்டுவிட்டு, அவர் மீண்டும் படகில் ஏறி, அக்கரைக்குச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை விட்டுவிட்டு, அவர் படகில் ஏறி மறுபடியும் அக்கரைக்குப் புறப்பட்டுச் சென்றார்.” πάλιν என்ற சொல் ‘மீண்டும் படகில் ஏறி’ என்பதற்குப் பதிலாக ‘மறுபடியும் சென்றார்’ என்ற வினையோடு தொடர்புபடுத்தப்படலாம்.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: விட்டுவிட்டு
  rationale: இறந்தகால வினையெச்சம், அங்கிருந்தவர்களை விட்டுப் புறப்பட்டதைக் குறிக்கிறது; தமிழில் முதன்மை வினையோடு இயல்பாக இணைகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: உடனடி சூழலில் பரிசேயர்களைக் குறிக்கும் நேரடி சுட்டுப்பெயர்.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: πάλιν என்பதன் அடிப்படை மறுநிகழ்வு உணர்வைப் பாதுகாக்கிறது. இது படகில் ஏறுவதோடு தொடரமைப்பில் இணைந்தாலும், அதன் துல்லியமான தொடர்பில் சிறிய தெளிவின்மை உள்ளது.
- source_word: ἐμβὰς
  choice: படகில் ஏறி
  rationale: வினையெச்சம் ‘உள்ளே சென்று/ஏறி’ எனப் பொருள்படும்; மாற்கு 8:10 மற்றும் பயணச் சூழலிலிருந்து ‘படகு’ என்பதைக் குறிப்பிடுவது நியாயமானதும் தமிழில் தெளிவானதும் ஆகும்.
- source_word: ἀπῆλθεν
  choice: சென்றார்
  rationale: புறப்பட்டுச் சென்ற செயலை இலக்கைக் குறிக்கும் அடுத்த சொற்றொடருடன் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὸ πέραν
  choice: அக்கரைக்கு
  rationale: கடல் அல்லது ஏரியின் மறுபக்கத்தைச் சுட்டும் மாற்குவின் வழக்கமான பயணச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அக்கரை’ என்பது நீர்நிலையின் மறுபக்கத்தைக் குறிக்கும் இயல்பான சொல். மூலத்தில் வெளிப்படையாக இல்லாத ‘படகு’ உடனடி சூழலின் அடிப்படையில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
