  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: ta
  text: “இந்த மக்கள் கூட்டத்தின்மீது எனக்கு இரக்கம் உண்டாகிறது; ஏனெனில் இவர்கள் ஏற்கெனவே மூன்று நாட்களாக என்னுடன் தங்கியிருக்கிறார்கள், இவர்களுக்கு உண்பதற்கு ஒன்றுமில்லை.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: நான் பரிவு கொள்கிறேன்
  rationale: ஆழ்ந்த இரக்கத்தையும் உள்ளார்ந்த பரிவையும் குறிக்கும் நிகழ்கால வினையை, இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὸν ὄχλον
  choice: இந்த மக்கள் கூட்டத்தின்மேல்
  rationale: பரிவின் பொருளாகிய கூட்டத்தைக் குறிக்கிறது; ὄχλος என்பதற்கு ‘மக்கள் கூட்டம்’ தெளிவான பொதுத் தமிழ் வழக்கு.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இயேசுவின் பரிவுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: ஏற்கெனவே மூன்று நாட்களாக
  rationale: ἤδη என்பதன் ‘இந்நேரத்திற்குள்’ என்ற வலியுறுத்தலையும், மூன்று நாட்கள் நீடித்த கால அளவையும் இயல்பான தமிழில் தருகிறது.
- source_word: προσμένουσίν μοι
  choice: என்னுடன் தங்கியிருக்கிறார்கள்
  rationale: ஒருவருடன் தொடர்ந்து இருந்து வருதல் என்ற προσμένω வினையின் கருத்தையும், μοι என்பதன் உறவுசார் பொருளையும் பாதுகாக்கிறது.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: இவர்களுக்கு உண்பதற்கு ஒன்றுமில்லை
  rationale: உண்பதற்கான உணவு அவர்களிடம் இல்லை என்ற கட்டமைப்பின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நிகழ்காலப் பரிவும், காரணத் தொடர்பும், மூன்று நாட்கள் நீடித்திருக்கும் நிலையுமாகிய அம்சங்கள் பாதுகாக்கப்பட்டுள்ளன.
