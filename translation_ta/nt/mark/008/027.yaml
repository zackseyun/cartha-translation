  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: ta
  text: 'இயேசு தம் சீடர்களுடன் பிலிப்பு செசரியாவின் கிராமங்களுக்குப் புறப்பட்டுச் சென்றார். வழியில் அவர் தம் சீடர்களிடம் இவ்வாறு கேட்டுக்கொண்டிருந்தார்: “நான் யார் என்று மக்கள்[a] சொல்கிறார்கள்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இன்னும் சொல்லுக்குச் சொல், “மனிதர்கள்”; இங்கு அது ஆண்களை மட்டும் அல்லாமல் மக்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: இயேசுவும் சீடர்களும் இணைந்த எழுவாயாகத் தமிழில் இயல்பாக அமைவதால் பன்மை வினை பயன்படுத்தப்பட்டது; ἐξέρχομαι என்பதன் வெளியே சென்று பயணத்தைத் தொடங்கும் இயக்கப் பொருளை ‘புறப்பட்டுச் சென்றார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κώμας
  choice: கிராமங்கள்
  rationale: κώμη என்பது பொதுவாகப் பெரிய நகரத்தைக் காட்டிலும் கிராமம் அல்லது சிறிய ஊரைக் குறிக்கிறது; ‘கிராமங்கள்’ அதன் வழக்கமான பொருளைத் தக்கவைக்கிறது.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: பிலிப்புச் செசரியா
  rationale: இது இடப்பெயராக அடையாளம் காணப்படும் வகையில் தமிழின் வழக்கமான பெயரெழுத்தாக்க வரிசையில் வழங்கப்பட்டுள்ளது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணத்தின்போது நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கும் நவீனத் தமிழ் நடை; மாற்குவின் பயணச் சூழலையும் காக்கிறது.
- source_word: ἐπηρώτα
  choice: கேட்டார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தைத் தமிழில் ‘கேட்டுக்கொண்டிருந்தார்’ எனக் கடுமையாகப் பின்பற்றினால் ஒரே கேள்வி மீண்டும் மீண்டும் கேட்கப்பட்டதாகத் தவறாகத் தோன்றலாம். இங்கு அறிமுகப்படுத்தப்படும் கேள்வியை இயல்பான தமிழ் கதைநடையில் ‘கேட்டார்’ என வழங்குகிறது.
- source_word: λέγων αὐτοῖς
  choice: அவர்களிடம் … என்று கேட்டார்
  rationale: கிரேக்கப் பங்கேற்புவினைத் தொடரைச் சொல்லுக்குச் சொல் நகலெடுக்காமல், தமிழ் மேற்கோள் அமைப்பான ‘… என்று கேட்டார்’ என்பதில் அதன் முழுப் பொருளும் இயல்பாக வெளிப்படுகிறது.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: நான் யார் என்று மக்கள் சொல்கிறார்கள்?
  rationale: τίνα … εἶναι அடையாளத்தைப் பற்றிய கேள்வி. ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் பொதுமக்களைக் குறிப்பதால் ‘மக்கள்’ துல்லியமானதும் இயல்பானதும் ஆகும்.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: அவருடைய சீடர்கள் / தம் சீடர்கள்
  rationale: இரு இடங்களிலும் உள்ள αὐτοῦ என்ற உடைமைப் பொருள் வெளிப்படையாகக் காக்கப்பட்டுள்ளது; இரண்டாவது இடத்தில் எழுவாய் இயேசு என்பதால் இயல்பான தற்சுட்டு வடிவமான ‘தம்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இயேசுவின் கேள்வியில் பொதுப்பொருளில் வரும் ἄνθρωποι
  choice: மக்கள்
  alternative: மனிதர்கள்; ஆண்கள்
  rationale: இலக்கண வடிவம் ஆண்பாலாக இருந்தாலும் இச்சூழலில் சொல் பொதுமக்களைக் குறிக்கிறது. ‘மக்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் எண்ணத்தைத் தவிர்த்து மூலத்தின் நோக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கிய ஓட்டம் தமிழுக்கு இயல்பான மேற்கோள் அமைப்பாக மாற்றப்பட்டாலும் இடம், பயணம், சீடருடனான உறவு, கேள்வியின் அடையாள மையம் ஆகியவை காக்கப்பட்டுள்ளன.
