source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: ta
  text: “நான் ஐந்து அப்பங்களை ஐயாயிரம் பேருக்காக[a] பிட்டபோது, அப்பத் துண்டுகள்[b] நிறைந்த எத்தனை கூடைகளை நீங்கள் எடுத்தீர்கள்[c]?” என்று கேட்டார். அவர்கள் அவரிடம், “பன்னிரண்டு” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘அந்த ஐயாயிரம் பேருக்காக’ அல்லது ‘அவர்களுக்கு.’ சூழலைப் பொறுத்து, ‘ஐயாயிரம் ஆண்களுக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘மீதியான துண்டுகள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பிட்ட அப்பங்களிலிருந்து மீந்த துண்டுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘சேகரித்து எடுத்தீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: பிட்டபோது
  rationale: கடந்தகால நிகழ்வை நினைவூட்டும் காலத் துணைவாக்கியத்தை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἔκλασα
  choice: பிட்டேன் / பிட்டபோது
  rationale: κλάω என்பது அப்பத்தைப் பிய்த்தல் அல்லது பிட்டல் என்பதைக் குறிக்கிறது; உணவுச் சூழலில் ‘பிட்டல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τοὺς πέντε ἄρτους
  choice: ஐந்து அப்பங்களை
  rationale: எண்ணக்கூடிய அப்பங்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: ஐயாயிரம் பேருக்காக
  rationale: அந்தக் கூட்டத்தாருக்காக அப்பம் பிட்டுக் கொடுக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது; உடனடி கிரேக்க வாசகத்தைவிட பாலினத்தை அதிகமாகக் குறிப்பதில்லை.
- source_word: κοφίνους
  choice: கூடைகளை
  rationale: κόφινος என்பதன் பொதுவான பொருளான எடுத்துச் செல்லக்கூடிய கூடையைத் தெளிவாகக் குறிக்கிறது.
- source_word: κλασμάτων πλήρεις
  choice: அப்பத் துண்டுகள் நிறைந்த
  rationale: பிடப்பட்ட அப்பங்களிலிருந்து மீந்த துண்டுகளே இங்கு குறிக்கப்படுகின்றன என்பதைச் சூழலுக்கு ஏற்றவாறு தெளிவாக்குகிறது.
- source_word: ἤρατε
  choice: எடுத்தீர்கள்
  rationale: αἴρω என்பதன் அடிப்படைச் செயலைப் பாதுகாக்கிறது; சூழலில் இது மீந்த துண்டுகளைச் சேகரித்து எடுத்ததைக் குறிக்கிறது.
- source_word: λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: கிரேக்கத்தின் வரலாற்று நிகழ்காலத்தை நவீனத் தமிழ் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்குகிறது.
- source_word: Δώδεκα
  choice: பன்னிரண்டு
  rationale: கேள்விக்கான நேரடியான எண்ணியல் பதில்; ‘கூடைகள்’ என்பதை மீண்டும் சேர்க்கத் தேவையில்லை.
theological_decisions:
- issue: πεντακισχιλίους என்பதன் பிரதிநிதித்துவப் பொருள்
  choice: ஐயாயிரம் பேர்
  alternative: ஐயாயிரம் ஆண்கள்
  rationale: ஆண்பால் பன்மை வடிவம் ஆண்களைக் குறிக்கக்கூடியதாயினும், இவ்வசனத்தில் அது அறியப்பட்ட கூட்டத்தைக் குறிக்கும் வழக்கமான பெயராக வருகிறது. ஆகவே உடனடி வாசகம் கோராத பாலினக் குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நேரடி உரையாடல் நடையிலும் வடிவமைக்கப்பட்டது. ‘அப்பம்,’ ‘கூடை’ போன்ற பரவலாகப் புரியும் வேதாகமச் சூழல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
