source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: ta
  text: அவர் மக்கள் கூட்டத்தையும் தம் சீடர்களையும் தம்மிடம் அழைத்து, அவர்களிடம், “யாராவது என் பின்னே வர விரும்பினால், அவர் தன்னையே மறுதலித்து, தன் சிலுவையை எடுத்துக்கொண்டு[a], என்னைப் பின்பற்றட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் சிலுவையை எடுத்துக்கொண்டு” என்பது சிலுவையின் நேரடியான உருவகத்தைக் காக்கிறது; அதை வெறுமனே ஒரு சுமையைத் தாங்குவது என்று பொருள்கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: இச்சொல் மக்களைத் தன்னிடம் அழைத்துச் சேர்த்ததைக் குறிக்கிறது. இறந்தகாலப் பங்கேற்புவினையின் செயல் முதன்மை வினைக்கு முன் நிகழ்வதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: மக்கள் கூட்டத்தையும் தம் சீடர்களையும்
  rationale: கூட்டமும் சீடர்களும் இயேசுவால் அழைக்கப்பட்டு உரையைக் கேட்பவர்களாக இருப்பதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Εἴ τις θέλει
  choice: யாராவது ... விரும்பினால்
  rationale: திறந்த, பொதுவான நிபந்தனை அழைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: என் பின்னே வர
  rationale: சீடத்துவத்தைச் சுட்டும் உருவகத்தை நேரடியாகக் காக்கிறது; வசனத்தின் இறுதியிலுள்ள ἀκολουθείτω என்பதற்கான ‘பின்பற்றட்டும்’ என்பதிலிருந்து சொற்றொடரை வேறுபடுத்துகிறது.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: அவர் தன்னையே மறுதலித்து
  rationale: தன்னை வெறுமனே கட்டுப்படுத்துவது என்ற குறுகிய பொருளுக்கு மாற்றாமல், தன்மீது உரிமை கோருவதைத் துறக்கும் வலுவான அழைப்பைக் காக்கிறது. ‘தன்னையே’ என்பது மறுதலிப்பின் பொருளை வலியுறுத்துகிறது.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: தன் சிலுவையை எடுத்துக்கொண்டு
  rationale: αἴρω என்பதன் செயற்பாட்டையும் தனிப்பட்ட உடைமைக்குறிப்பையும் காக்கிறது; சிலுவை உருவகத்தை ‘சுமை’ என்று குறுக்கிப் பொழிப்புரை செய்யவில்லை.
- source_word: ἀκολουθείτω μοι
  choice: என்னைப் பின்பற்றட்டும்
  rationale: நிகழ்கால மூன்றாம் நபர் கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது; தொடர்ச்சியான சீடத்துவம் சூழலால் உணரப்படுகிறது.
theological_decisions:
- issue: சீடத்துவக் கட்டளைகளின் வலிமை
  choice: பொதுவான நிபந்தனை அழைப்பைத் தொடர்ந்து கட்டளை வலிமையுள்ள ‘மறுதலித்து ... எடுத்துக்கொண்டு ... பின்பற்றட்டும்’ என்ற அமைப்பு
  alternative: ‘மறுதலிக்க வேண்டும், எடுத்துக்கொள்ள வேண்டும், பின்பற்ற வேண்டும்’ என்று ஒவ்வொரு கூறிலும் ‘வேண்டும்’ பயன்படுத்துதல்
  rationale: கிரேக்கத்தில் நிபந்தனை வாக்கியத்தைத் தொடர்ந்து மூன்றாம் நபர் கட்டளைகள் வருகின்றன. தேர்ந்தெடுக்கப்பட்ட தமிழ் அமைப்பு திறந்த அழைப்பையும் அதனுடன் இணைந்த கட்டாயமான கோரிக்கையையும் சமநிலையாகக் காக்கிறது.
- issue: σταυρός என்பதன் பொருள்
  choice: சிலுவை
  alternative: சுமை அல்லது பொதுவான துன்பம்
  rationale: உருவகம் வரலாற்றுச் சிலுவையை அடிப்படையாகக் கொண்டது. அதை ‘சுமை’ அல்லது ‘துன்பம்’ என்று மாற்றுவது மூலத்தின் தீவிரத்தையும் பொருள் விரிவையும் தேவையின்றிக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அவர்’ என்ற மரியாதை ஒருமை, பாலினத்தைக் குறிப்பாக முன்னிறுத்தாமல் τις என்பதன் பொதுவான தன்மையைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது. ‘மறுதலித்து’ என்பது வேதாகமப் பயன்பாட்டில் அறியப்பட்டிருந்தாலும் இன்றைய வாசகருக்கும் புரியக்கூடிய வலிமையான சொல்லாக இருப்பதால் காக்கப்பட்டுள்ளது.
