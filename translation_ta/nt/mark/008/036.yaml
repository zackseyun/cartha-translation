id: MRK.8.36
reference: Mark 8:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: ta
  text: ஏனெனில், ஒருவர் உலகம் முழுவதையும் ஆதாயமாகப் பெற்றுக்கொண்டு, தன் உயிரை இழந்துவிட்டால், அதனால் அவருக்கு என்ன பயன்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் ஆத்துமாவை.’ ψυχή என்ற கிரேக்கச் சொல் சூழலுக்கு ஏற்ப ‘உயிர்,’ ‘ஆத்துமா,’ அல்லது ‘தன்னையே’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: ஏனெனில், … என்ன பயன்?
  rationale: γάρ முந்தைய போதனையுடன் இந்த வினாவை இணைக்கிறது; τί இதை வலியுறுத்தும் சொல்லாட்சிக் கேள்வியாக அமைக்கிறது. தமிழில் ‘ஏனெனில்’ மற்றும் ‘என்ன பயன்?’ ஆகியவை இரண்டையும் இயல்பாகப் பாதுகாக்கின்றன.
- source_word: ὠφελεῖ
  choice: அதனால் அவருக்கு என்ன பயன்
  rationale: ὠφελέω என்பது பயனளித்தல் அல்லது இலாபம் தருதல் என்று பொருள்படும். ‘என்ன பயன்’ என்பது தமிழில் இயல்பான சொல்லாட்சிக் கேள்வியாகவும், ஆதாயம்–இழப்பு உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἄνθρωπον
  choice: ஒருவர்
  rationale: ἄνθρωπος இங்கு ஒரு குறிப்பிட்ட ஆணை அல்ல, பொதுவாக எந்த மனிதரையும் குறிக்கிறது. ‘ஒருவர்’ அந்தப் பொதுப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κερδῆσαι
  choice: ஆதாயமாகப் பெற்றுக்கொண்டு
  rationale: κερδαίνω என்பதன் ஆதாயம் பெறுதல் என்ற பொருளையும், ζημιωθῆναι உடனான பொருளாதார உருவக முரணையும் இது பாதுகாக்கிறது.
- source_word: τὸν κόσμον ὅλον
  choice: உலகம் முழுவதையும்
  rationale: κόσμος இங்கு உலகை அதன் முழுமையான பரப்பில் குறிக்கிறது; ὅλον அந்த முழுமையை வலியுறுத்துகிறது.
- source_word: ζημιωθῆναι
  choice: இழந்துவிட்டால்
  rationale: ζημιόω என்பதன் செயலப்பாட்டு வடிவம் இழப்பை அடைதல் அல்லது ஒன்றைப் பறிகொடுத்தல் என்று பொருள்படும். ‘இழந்துவிட்டால்’ ஆதாயம்–இழப்பு முரணைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: தன் உயிரை
  rationale: ψυχή என்பது சூழலுக்கு ஏற்ப உயிர், ஆத்துமா, அல்லது தன்னையே குறிக்கலாம். மாற்கு 8:35–37 இல் ஒருவருடைய உயிரைக் காப்பாற்றுதல் அல்லது இழத்தல் பற்றிய உடனடிச் சூழலுக்கு ‘உயிர்’ நன்கு பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சீடத்துவத்தைப் பற்றிய கூற்றில் ψυχή என்பதன் ‘உயிர்’/‘ஆத்துமா’ தெளிவின்மை
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: மாற்கு 8:35 இன் உடனடிச் சூழலில் ψυχή என்பது இயேசுவுக்காகவும் நற்செய்திக்காகவும் ஒருவர் காப்பாற்றவோ இழக்கவோ கூடிய உயிரைக் குறிக்கிறது. ‘உயிர்’ என்பது அந்தச் சூழலின் முரண்பாட்டைத் தெளிவாக வைத்திருக்கிறது; அதேவேளையில், சொல்லின் பாரம்பரியமும் இறையியல் முக்கியத்துவமும் வாய்ந்த ‘ஆத்துமா’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒருவர்’ என்பது பாலினத்தைச் சுட்டாத பொதுமனிதக் குறிப்பாகப் பயன்படுத்தப்பட்டுள்ளது; ஆகவே அதற்குத் தனி பண்பாட்டுக் குறிப்பு தேவையில்லை. ஆதாயம்–இழப்பு என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
