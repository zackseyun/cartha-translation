  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: ta
  text: 'அந்த நாட்களில்[a], மீண்டும் பெரும் மக்கள் கூட்டம் இருந்தபோது, அவர்களுக்குச் சாப்பிட எதுவும் இல்லாத நிலையில், அவர் தம் சீடர்களை அழைத்து அவர்களிடம் சொல்கிறார்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீண்டும் பெரும் மக்கள் கூட்டம் இருந்த அந்த நாட்களில்’ என்றும் இத்தொடரை அமைக்கலாம். கிரேக்கத்தில் பின்னணிச் சூழலைக் குறிக்கும் genitive absolute அமைப்பு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘அவர்களிடம் சொல்கிறார்’ என்று நிகழ்காலம் உள்ளது. கடந்த நிகழ்வுகளை விவரிக்கும்போதும் மாற்கு இத்தகைய வரலாற்று நிகழ்காலத்தை அடிக்கடி பயன்படுத்துகிறார்; தமிழில் இதை ‘அவர்களிடம் சொன்னார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: கதை நிகழும் காலப்பின்னணியை இயல்பான நவீனத் தமிழில் குறிக்கும் வழக்கமான காலத் தொடர்.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: மாற்கு விவரிக்கும் இதேபோன்ற சூழ்நிலை மறுபடியும் நிகழ்வதை நேரடியாகக் காட்டுகிறது.
- source_word: πολλοῦ ὄχλου ὄντος
  choice: பெருந்திரளான மக்கள் கூடியிருந்தபோது
  rationale: Genitive absolute அமைப்பின் பின்னணிச் சூழலை இயல்பான தமிழில் தருவதோடு, πολλοῦ குறிக்கும் பெரும் எண்ணிக்கையையும் காக்கிறது.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: அவர்கள் சாப்பிடுவதற்கு எதுவும் இல்லாததால்
  rationale: உணவு இல்லாத நிலை அந்த மக்கள் கூட்டத்துக்குரியது என்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: προσκαλεσάμενος
  choice: அழைத்து
  rationale: தம்மிடம் வரும்படி அழைத்தல் என்ற பொருளைச் சூழலில் இயல்பாகக் காட்டுகிறது; மூலத்தில் தனியாக இல்லாத கூடுதல் சொற்றொடரைச் சேர்க்கவில்லை.
- source_word: τοὺς μαθητάς
  choice: தம் சீடர்களை
  rationale: குறிப்பிடப்படுபவர்கள் இயேசுவின் சீடர்கள் என்பது சூழலால் தெளிவு; ‘தம்’ என்பது தமிழில் இயல்பான உடைமைத் தொடர்பைத் தருகிறது.
- source_word: λέγει αὐτοῖς
  choice: அவர்களிடம் சொல்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, αὐτοῖς என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலம்
  choice: ‘சொல்கிறார்’ என்று நிகழ்காலத்தைத் தக்கவைத்தல்
  alternative: ‘சொன்னார்’ என்று இறந்தகாலமாக்குதல்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; மூல உரையின் உயிரோட்டமான கதைநடையைப் பாதுகாக்கும் மொழிபெயர்ப்புத் தீர்மானம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் பின்னணித் தொடர்பு தமிழிலும் காக்கப்பட்டுள்ளது; தொடரும் இயேசுவின் உரைக்காக இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
