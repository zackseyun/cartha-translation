  - severity: low
    issue: The footnote inaccurately characterizes the Greek ellipsis as merely omitting “சொல்கிறார்கள்” and “நீர்.”
    rationale: The later Greek clauses are compressed nominal identifications; the implied reporting and identification sense is supplied from the construction and preceding context. The note should describe this without implying that a specific present-tense verb occurs in the Greek.
