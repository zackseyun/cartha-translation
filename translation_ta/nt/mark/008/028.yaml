base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “சிலர் திருமுழுக்கு கொடுத்த யோவான் என்றும், மற்ற சிலர் எலியா என்றும், இன்னும் சிலர் தீர்க்கதரிசிகளில் ஒருவர் என்றும் சொல்கிறார்கள்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “அவர்கள் அவரிடம், ‘திருமுழுக்கு கொடுத்த யோவான்; மற்ற சிலர் எலியா; இன்னும் சிலர் தீர்க்கதரிசிகளில் ஒருவர்’ என்றார்கள்.” கிரேக்கத்தில் பிந்தைய கூறுகளில் அறிக்கையிடும் வினையும், இயேசுவை அடையாளப்படுத்தும் பொருளும் வெளிப்படையாகக் கூறப்படவில்லை; அவை சூழலிலிருந்து புரிந்துகொள்ளப்படுகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: அவர்கள்
  rationale: முந்தைய சூழலில் உள்ள சீடர்களையே இது குறிக்கிறது. δέ-யின் மென்மையான தொடர்ச்சி உணர்வு தமிழில் தனியே இணைப்புச் சொல் சேர்க்காமலேயே இயல்பாகப் புரிகிறது.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: λέγω வினையின் வினைமுற்றும் வினையெச்சமும் சேர்ந்துள்ள கிரேக்கச் சொல்லமைப்பை தமிழின் இயல்பான நேர்க்கூற்று அமைப்பில் தருகிறது. மேற்கோளுக்குள் வரும் ‘சொல்கிறார்கள்’ என்பது மக்கள் கூறுவதைச் சுட்டுவதால், மூலத்தின் கூறுதல் சார்ந்த இரட்டிப்பு ஓரளவு தக்கவைக்கப்படுகிறது.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: திருமுழுக்கு கொடுத்த யோவான்
  rationale: βαπτιστής என்பது திருமுழுக்கு கொடுப்பவரைக் குறிக்கும் செயற்பெயர். தமிழில் வரலாற்று நபரைத் தெளிவாக அடையாளப்படுத்தும், புரிந்துகொள்ள எளிய வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἄλλοι … ἄλλοι δὲ
  choice: வேறு சிலர் … இன்னும் சிலரோ
  rationale: வெவ்வேறு மக்கள் குழுக்கள் வெவ்வேறு அடையாளங்களைச் சொன்னார்கள் என்ற பகிர்வையும், இறுதிக் குழுவின் மெல்லிய வேறுபாட்டையும் ‘-ரோ’ மூலம் வெளிப்படுத்துகிறது.
- source_word: Ἠλίαν
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: தீர்க்கதரிசிகளில் ஒருவர் என்றும்
  rationale: மூலத்தில் விடுபட்டுள்ள ‘சொல்கிறார்கள்/நீர்’ போன்ற கூறுகளை மிகையாக விரிவாக்காமல், பட்டியல் வடிவின் சுருக்கத்தைத் தமிழில் காக்கிறது.
- source_word: προφητῶν
  choice: தீர்க்கதரிசிகள்
  rationale: இஸ்ரவேலின் இறைத்தூதுப் பணியாளர்களைக் குறிக்கும் προφήτης என்பதற்கான தெளிவான, நிலைபெற்ற தமிழ் சொல்.
theological_decisions:
- issue: இயேசுவைப் பற்றிய மக்களின் அடையாளக் கருத்துகளை வெளிப்படுத்துதல்
  choice: ‘நீர் …’ என்பதை ஒவ்வொரு கூறிலும் சேர்க்காமல், யோவான், எலியா, தீர்க்கதரிசிகளில் ஒருவர் என்ற சுருக்கமான அடையாளப் பட்டியலாகத் தரப்பட்டது.
  alternative: “நீர் திருமுழுக்கு கொடுத்த யோவான் என்றும், நீர் எலியா என்றும், நீர் தீர்க்கதரிசிகளில் ஒருவர் என்றும்…” என்று முழுமையாக விரித்துரைக்கலாம்.
  rationale: கிரேக்கத்தில் வாக்கியத்தின் பிந்தைய பகுதிகள் விடுபட்ட கூறுகளுடன் சுருக்கமாக உள்ளன. அவற்றை நிரப்பி ஒரு குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல், மக்களிடையே நிலவிய பல்வேறு கருத்துகளே மையமாகத் தொடரும்படி மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. மூலத்தின் சுருக்கமான, விடுபட்ட வாக்கிய அமைப்பு இயன்றவரை காக்கப்பட்டு, தெளிவுக்குத் தேவையான குறைந்தளவு சொற்களே சேர்க்கப்பட்டுள்ளன.
