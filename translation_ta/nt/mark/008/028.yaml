  naturalness: The sentence is generally natural modern standard Tamil. “சிலர் ... மற்ற சிலர் ... இன்னும் சிலர்” gives the three public opinions a clearer, more balanced Tamil expression than beginning directly with the name and then introducing “வேறு சிலர்.”
