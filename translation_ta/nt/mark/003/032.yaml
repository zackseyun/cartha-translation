source:
  edition: SBLGNT
  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: ta
  text: அவரைச் சுற்றி ஒரு கூட்டம் உட்கார்ந்திருந்தது. அவர்கள் அவரிடம், “இதோ, உங்கள் தாயும் சகோதரர்களும் வெளியே உங்களைத் தேடிக்கொண்டிருக்கிறார்கள்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை நாடுகிறார்கள்.” கிரேக்க வினைச்சொல் ‘தேடுதல்’ அல்லது ‘நாடுதல்’ என்று பொருள்படலாம்; இங்கே அவர்கள் அவரைக் கண்டுபிடிக்க அல்லது அவரைச் சந்திக்க முயல்வதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: உட்கார்ந்திருந்தது
  rationale: இறந்தகாலத்தில் தொடர்ந்து நிலவிய காட்சியைச் சுட்டும் imperfect வினைவடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ αὐτὸν ὄχλος
  choice: அவரைச் சுற்றி ஒரு கூட்டம்
  rationale: περί என்பதன் இடம்சார்ந்த பொருளான ‘சுற்றிலும்’ என்ற காட்சியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: λέγουσιν
  choice: அவர்கள் ... என்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழின் இயல்பான இறந்தகாலக் கதைநடையில் வழங்குகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையைப் பழமையான நடையின்றிப் பாதுகாக்கிறது.
- source_word: μήτηρ
  choice: தாய்
  rationale: இது நேரடியான உறவுமுறைச் சொல்.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: ஆண்பால் பன்மையில் உள்ள வழக்கமான உறவுமுறைச் சொல்லை விளக்கவிரிவாக்கமின்றி நேரடியாக வழங்குகிறது.
- source_word: ἔξω
  choice: வெளியே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; சூழலுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: ζητοῦσίν σε
  choice: உங்களைத் தேடிக்கொண்டிருக்கிறார்கள்
  rationale: ζητέω என்பதன் இச்சூழலுக்குரிய ‘தேடுதல்’ என்ற பொருளையும் நடைபெற்று வரும் செயல் நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘சகோதரர்கள்’ என்போரின் உறவுமுறை
  choice: ἀδελφοί என்பதை ‘சகோதரர்கள்’ என்று விளக்கவிரிவாக்கமின்றி மொழிபெயர்த்தல்
  alternative: ‘நெருங்கிய ஆண் உறவினர்கள்’ அல்லது ‘உடன்பிறந்தவர்கள்’
  rationale: வசனம் வழக்கமான உறவுமுறைச் சொல்லையே பயன்படுத்துகிறது; அந்த உறவின் தன்மையைப் பற்றிய இறையியல் முடிவை அது விளக்கவில்லை. எனவே எந்தச் சமயப்பிரிவின் விளக்கத்தையும் மொழிபெயர்ப்புக்குள் சேர்க்காமல் மூலத்தின் நேரடிப் பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உங்கள்/உங்களை’ பயன்படுத்தப்பட்டுள்ளது; ‘இதோ’ என்பது Ἰδοὺ-வின் கவன ஈர்ப்பு வலிமையை இயல்பாகக் காக்கிறது.
