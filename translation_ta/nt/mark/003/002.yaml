  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: ta
  text: அவர்கள் அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்; அவர் ஓய்வுநாளில்[a] அவனைக் குணமாக்குவாரா என்று பார்த்து, அவர்மேல் குற்றம் சுமத்துவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்வுநாட்களில்.” கிரேக்கத்தில் “ஓய்வுநாட்கள்” என்ற பன்மை வடிவம் உள்ளது; அது ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடராகவும் பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலையை imperfect வடிவம் காட்டுகிறது; மேலும், சூழலில் உள்ள எச்சரிக்கையான, பகைமை நோக்கமுள்ள கண்காணிப்பையும் ‘கூர்ந்து’ வெளிப்படுத்துகிறது.
- source_word: εἰ
  choice: குணமாக்குவாரா என்று
  rationale: கவனித்தல் என்ற வினைக்குப் பின் வரும் மறைமுகக் கேள்வியை இயல்பான தமிழில் ‘-ஆ என்று’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், கொய்னே கிரேக்கத்தில் அது ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடராக அமையலாம். நவீன தமிழில் ஒருமை இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது; வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θεραπεύσει
  choice: குணமாக்குவாரா
  rationale: இறந்தகால முதன்மை வினைக்குப் பின் வரும் மறைமுகக் கேள்வியில் உள்ள எதிர்காலக் குறிப்பைத் தமிழ் கேள்வி வடிவம் இயல்பாகத் தக்கவைக்கிறது. இயேசுவைக் குறிக்க மரியாதைப் பால் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα
  choice: -வதற்காக
  rationale: அவர்களுடைய நோக்கத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் நோக்கத் தொடர்.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: அவர்மேல் குற்றம் சுமத்த
  rationale: சட்ட நடவடிக்கையை அளவுக்கு மீறி வலுப்படுத்தாமல், குற்றஞ்சாட்டும் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கவனித்தவர்களின் நோக்கம்
  choice: இயேசுவின்மேல் குற்றம் சுமத்துவதற்கான பகைமை நோக்கமுள்ள கண்காணிப்பு
  alternative: அவர்மீது வழக்குத் தொடருவதற்கான முறையான சட்டக் கண்காணிப்பு
  rationale: κατηγορέω நீதிமன்றச் சூழலிலும் பயன்படலாம்; ஆனால் இவ்வசனம் முறையான வழக்கு நடவடிக்கையைச் சொல்லவில்லை. ஆகவே மூலத்தில் உள்ள அளவையே மொழிபெயர்ப்பு காக்கிறது.
- issue: ஓய்வுநாள் என்பதன் எண் வடிவம்
  choice: முதன்மை உரையில் இயல்பான தமிழ் ஒருமை
  alternative: கிரேக்க வடிவத்தை நேரடியாகப் பின்பற்றி ‘ஓய்வுநாட்களில்’
  rationale: கிரேக்கப் பன்மை இங்கு ஒரே ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடராகச் செயல்படலாம். இயல்பான தமிழ் ஒருமையைப் பயன்படுத்தி, உண்மையான வடிவ வேறுபாட்டை அடிக்குறிப்பில் குறிப்பிடுவது பொருளையும் மூலச் சான்றையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. இயேசுவுக்கு மரியாதைப் பால் (‘அவர்’), குணமாக்கப்படவிருந்த மனிதருக்கு இயல்பான ஆண்பால் ஒருமை (‘அவன்’) பயன்படுத்தப்பட்டதால் இரண்டு பிரதிப்பெயர்களும் தெளிவாக வேறுபடுகின்றன.
