- from: அவர்கள் அவர்மேல் குற்றம் சுமத்துவதற்காக, ஓய்வுநாளில்[a] அவர் அவனைக் குணமாக்குவாரா என்று அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்.
  to: அவர்கள் அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்; அவர் ஓய்வுநாளில்[a] அவனைக் குணமாக்குவாரா என்று பார்த்து, அவர்மேல் குற்றம் சுமத்துவதற்காக.
  rationale: 'பிரதிப்பெயர் தெளிவுக்காகவும் இயல்பான தமிழ் வாக்கிய ஓட்டத்திற்காகவும் சொல்வரிசை திருத்தப்பட்டுள்ளது. எனினும், பரிந்துரைக்கப்பட்ட அரைப்புள்ளி-தொடர் மூலத்தின் ஒரே வாக்கிய அமைப்பை விட தமிழில் சற்றுக் கடினமாக இருக்கலாம். ஆகவே இறுதி முழுமையான, இயல்பான திருத்தமாக இதையே பயன்படுத்த வேண்டும்: “அவர்கள், அவர் ஓய்வுநாளில்[a] அவனைக் குணமாக்குவாரா என்று, அவர்மேல் குற்றம் சுமத்துவதற்காக அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்.” இது மூலத்தின் கண்காணிப்பு–மறைமுகக் கேள்வி–நோக்கம் என்ற உறவைத் தக்கவைத்து, தொடக்கப் பிரதிப்பெயர் தெளிவின்மையை நீக்குகிறது.'
