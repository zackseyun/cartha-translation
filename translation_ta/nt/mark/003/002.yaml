  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் காக்கப்பட்டுள்ளன: தொடர்ச்சியான கூர்மையான கண்காணிப்பு (παρετήρουν), மறைமுகக் கேள்வி (εἰ), ஓய்வுநாளில் குணமாக்குதல், மற்றும் குற்றஞ்சாட்டும் நோக்கம் (ἵνα κατηγορήσωσιν αὐτοῦ). இருப்பினும், தற்போதைய சொல்வரிசையில் தொடக்கத்தில் வரும் “அவர்மேல்” என்பதன் குறிப்பு, பின்னரே வரும் “அவர்” என்பதால் ஒரு கணம் தெளிவற்றதாகிறது.'
