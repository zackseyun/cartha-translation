id: MRK.3.8
reference: Mark 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: ta
  text: எருசலேமிலிருந்தும், இதுமேயாவிலிருந்தும், யோர்தானுக்கு அக்கரையிலிருந்தும்[a], தீரு, சீதோனைச் சுற்றியுள்ள பகுதிகளிலிருந்தும்[b] பெருந்திரளான மக்கள், அவர் செய்துகொண்டிருந்தவற்றைக்[c] கேள்விப்பட்டு அவரிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோர்தானுக்கு அப்பாலுள்ள பகுதியிலிருந்தும்.’ கிரேக்கச் சொற்றொடர் யோர்தான் ஆற்றின் மறுபக்கப் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீரு, சீதோன் வட்டாரத்திலிருந்தும்.’ கிரேக்கத்தில் ‘தீரு, சீதோனைச் சுற்றி’ என்று உள்ளது; இது அந்த நகரங்களை மட்டுமல்ல, அவற்றைச் சுற்றியுள்ள பகுதியையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவர் செய்துகொண்டிருந்த எல்லாவற்றையும்.’ கிரேக்க உறவுப்பெயர் முழுமையான பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: எருசலேமிலிருந்தும்
  rationale: ἀπό உடன் வரும் வேற்றுமை உருபு புறப்பட்ட இடம் அல்லது தோற்றுவாயைக் குறிக்கிறது; எருசலேம் என்பது தமிழில் வழக்கமான இடப்பெயர் வடிவம்.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: இதுமேயாவிலிருந்தும்
  rationale: இதுமேயா என்ற பிரதேசத்திலிருந்து மக்கள் வந்தார்கள் என்ற புவியியல் மூலப்பொருளைப் பேணுகிறது.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தானுக்கு அக்கரையிலிருந்தும்
  rationale: πέραν என்பது யோர்தான் ஆற்றின் மறுபக்கப் பகுதியைக் குறிக்கிறது. பட்டியலில் முன்புள்ள ἀπό-வின் பொருள் இங்கும் தொடர்வதால் ‘இலிருந்தும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: தீரு, சீதோனைச் சுற்றியுள்ள பகுதிகளிலிருந்தும்
  rationale: περί இங்கு நகரங்களை மட்டும் அல்ல, அவற்றைச் சுற்றியுள்ள நிலப்பகுதியைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘பகுதிகள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πλῆθος πολύ
  choice: பெருந்திரளான மக்கள்
  rationale: மிக அதிக எண்ணிக்கையிலான மக்கள் கூட்டத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀκούοντες
  choice: கேள்விப்பட்டு
  rationale: முக்கிய வினையுடன் இணைந்த பங்கேற்பு வினையின் கால அல்லது காரணத் தொடர்பை அளவுக்கு மீறி வரையறுக்காமல், தமிழில் இயல்பாக இணைக்கிறது.
- source_word: ὅσα ἐποίει
  choice: அவர் செய்துகொண்டிருந்தவற்றை
  rationale: ὅσα பல செயல்களையோ அவர் செய்த அனைத்தையோ குறிக்கலாம்; இறந்தகாலத் தொடர்ச்சியை ἐποίει காட்டுவதால் ‘செய்துகொண்டிருந்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἦλθον πρὸς αὐτόν
  choice: அவரிடம் வந்தார்கள்
  rationale: ஒரு நபரை நோக்கி வந்து சேர்வதைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: καὶ ... καὶ ... καὶ
  choice: …இலிருந்தும் …இலிருந்தும் …இலிருந்தும்
  rationale: கிரேக்கத்தில் மீண்டும் மீண்டும் வரும் καί உருவாக்கும் அடுக்குமுறையை, தமிழின் இணைப்புப் பின்னொட்டு ‘-உம்’ மூலம் இயல்பாகப் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர் καί-களின் அடுக்குமுறை ‘-இலிருந்தும்’ என்ற இணைப்பால் பேணப்பட்டுள்ளது; புவியியல் பெயர்கள் வழக்கமான தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன.
