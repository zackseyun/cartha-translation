id: MRK.3.35
reference: Mark 3:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: ta
  text: ஏனெனில், கடவுளின் திருவுளத்தை நிறைவேற்றுகிற எவரும், அவரே எனக்குச் சகோதரனும் சகோதரியும் தாயும் ஆவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: நிறைவேற்றுகிற எவரும்
  rationale: ὃς உடன் ἄν மற்றும் இறந்தகால subjunctive சேர்ந்து பொதுவான, வரையறையற்ற நிபந்தனையைத் தெரிவிக்கிறது. தமிழில் ‘எவரும்’ இதை இயல்பாகக் காட்டுகிறது; ποιέω என்பதன் ‘செய்தல்/நிறைவேற்றுதல்’ பொருள், ‘திருவுளம்’ என்பதுடன் ‘நிறைவேற்றுகிற’ என இயல்பாக வருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் இணைப்புச் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: கடவுளின் திருவுளம்
  rationale: θέλημα என்பது இங்கு கடவுளின் நோக்கம் அல்லது விருப்பத்தைக் குறிக்கிறது. ‘திருவுளம்’ நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய, மரியாதைமிக்க வேதாகம வழக்கு; சாதாரண ‘விருப்பம்’ என்பதைக் காட்டிலும் இச்சூழலுக்கு ஏற்றது.
- source_word: οὗτος
  choice: அவரே
  rationale: οὗτος வலியுறுத்தும் சுட்டுப்பெயர். ‘அவரே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் காட்டுவதோடு, தொடர்ந்து வரும் ஆண்-பெண் உறவுமுறைச் சொற்களுக்கு முன் ஆண் பாலுக்குள் மட்டும் பொருளைக் கட்டுப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: என் சகோதரரும் சகோதரியும் தாயும்
  rationale: மூன்று தெளிவான உறவுமுறைச் சொற்களையும், திரும்பத் திரும்ப வரும் καί-யின் சேர்க்கை வலிமையையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: ἐστίν
  choice: இருக்கிறார்
  rationale: ஒருமை எழுவாய்க்கு ஏற்ற எளிய இணைப்பு வினை; ‘அவரே’ என்ற மரியாதை ஒருமையுடன் தமிழில் இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: ஆண் இலக்கண வடிவமுள்ள ஒருமை எழுவாயும் இருபால் உறவுமுறைச் சொற்களும்
  choice: அவரே
  alternative: அவனே / அந்த நபரே
  rationale: கிரேக்கத் தொடர்புப்பெயர் இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், பயனிலைகள் ‘சகோதரன், சகோதரி, தாய்’ என்று இருபாலரையும் வெளிப்படையாகக் குறிப்பிடுகின்றன. ‘அவரே’ ஒருமையையும் வலியுறுத்தலையும் காக்கிறது; தவறாக ஆண்களுக்கு மட்டும் உரியதாக ஒலிப்பதைத் தவிர்க்கிறது.
- issue: இயேசுவின் குடும்ப உறவு மொழியின் தன்மை
  choice: சகோதரர், சகோதரி, தாய் என்ற குறிப்பிட்ட உறவுமுறைச் சொற்களை அப்படியே வைத்தல்
  alternative: குடும்பத்தினர் / உறவினர்
  rationale: கடவுளின் திருவுளத்தை நிறைவேற்றுவதன் அடிப்படையில் குடும்பச் சார்பை இயேசு மறுவரையறை செய்கிறார். பொதுப்படுத்தப்பட்ட ஒரு சொல்லுக்குப் பதிலாக மூன்று சொற்களையும் வைத்திருப்பது வசனத்தின் உருவக மற்றும் சொல்லாட்சிச் செறிவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘கடவுளின் திருவுளம்’ பரிச்சயமான வேதாகமச் சொற்றொடராக இருப்பினும் பழமையானதாக இல்லை. ‘அவரே’ என்பது οὗτος-ன் வலியுறுத்தலை இயல்பாக எடுத்துரைக்கிறது.
