id: MRK.3.21
reference: Mark 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: ta
  text: அவரைச் சேர்ந்தவர்கள்[a] கேள்விப்பட்டபோது, அவரைப் பிடிக்கப் புறப்பட்டார்கள். ஏனெனில், “அவர் தன்னிலை இழந்துவிட்டார்[b]” என்று அவர்கள் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய குடும்பத்தார்” அல்லது “அவருக்கு நெருக்கமானவர்கள்.” கிரேக்க மரபுத்தொடர் இயேசுவின் வீட்டாரையோ அவரைச் சேர்ந்த நெருங்கிய வட்டத்தாரையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர் புத்தி தடுமாறிவிட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: அவருடையவர்கள்
  rationale: இது இயேசுவின் குடும்பத்தாரையோ அவரைச் சேர்ந்த நெருங்கிய வட்டத்தாரையோ குறிக்கக்கூடிய கிரேக்க மரபுத்தொடர். “அவருடையவர்கள்” என்பது உறவுமுறையை அளவுக்கு மீறிக் குறிப்பாக்காமல் அந்தத் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀκούσαντες
  choice: இதைக் கேள்விப்பட்டு
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; அவர்கள் கேட்டதைத் தொடர்ந்து புறப்பட்டார்கள் என்ற நிகழ்வொழுங்கையும் காக்கிறது.
- source_word: ἐξῆλθον
  choice: புறப்பட்டார்கள்
  rationale: இங்கு அவர்கள் இருந்த இடத்திலிருந்து செயல்படச் சென்றதைக் காட்டும் இயல்பான கதைநடைச் சொல். “வெளியே சென்றார்கள்” என்ற சொற்சார்ந்த மொழிபெயர்ப்பைவிட சூழலுக்கு ஏற்றது.
- source_word: κρατῆσαι
  choice: அவரைப் பிடிக்க
  rationale: வலுவாகக் கைப்பற்றுதல் அல்லது பிடித்துக்கொள்ளுதல் என்ற பொருளைக் காக்கிறது; “கட்டுப்படுத்த” அல்லது “கைதுசெய்ய” என்று நோக்கத்தை மிகையாக விளக்கவில்லை.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξέστη
  choice: தன்னிலை இழந்துவிட்டார்
  rationale: ஒருவர் இயல்பான மனநிலையில் இல்லை என்ற குற்றச்சாட்டைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; மருத்துவ நோயறிதல் போன்ற மிகைக்குறிப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: οἱ παρ’ αὐτοῦ என்பவர்களின் அடையாளம்
  choice: முதன்மை உரையில் “அவருடையவர்கள்” என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: “அவருடைய குடும்பத்தார்” அல்லது “அவருக்கு நெருக்கமானவர்கள்”
  rationale: பின்வரும் சூழல் இயேசுவின் குடும்பத்தாரைச் சுட்டக்கூடும்; ஆனால் கிரேக்கத் தொடர் நேரடியான உறவுமுறைச் சொல்லைப் பயன்படுத்தவில்லை. எனவே மூலத்தில் உள்ள தெளிவின்மையை முதன்மை உரை காக்கிறது; குறிப்பான வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தெளிவின்மையும் குற்றச்சாட்டின் தீவிரமும் காக்கப்பட்டுள்ளன; தேவையற்ற மருத்துவ அல்லது சட்டப் பொருள் சேர்க்கப்படவில்லை.
