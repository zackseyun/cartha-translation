source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: ta
  text: ஆனால், வலிமையானவனின்[b] வீட்டுக்குள் நுழைந்து அவனுடைய பொருட்களைக்[a] கொள்ளையிட யாராலும் முடியாது; முதலில் அந்த வலிமையானவனைக் கட்டிப்போட்டால் மட்டுமே முடியும். அதன் பிறகு அவனுடைய வீட்டைக் கொள்ளையிடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய உடைமைகளை’; இன்னும் சொற்சார்பாக, ‘அவனுடைய பாத்திரங்கள் அல்லது பொருள்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘வலிமையானவன்’ என்பது சாத்தானை வெல்வதை விளக்கும் இயேசுவின் உருவகத்தின் ஒரு பகுதி; முதன்மை உரை அந்த விளக்கத்தை வெளிப்படையாகச் சேர்க்காமல் உருவகத்தைக் காக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய குற்றச்சாட்டுக்கும் இயேசுவின் மறுப்புக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οὐδεὶς δύναται
  choice: யாராலும் முடியாது
  rationale: இயலாமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: வலிமையானவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள பெயரடையைத் தமிழில் இயல்பாகத் தருவதோடு உருவகத்தையும் அதன் மறுபடியான பயன்பாட்டையும் காக்கிறது.
- source_word: τὰ σκεύη αὐτοῦ
  choice: அவனுடைய பொருட்கள்
  rationale: σκεύη என்பதன் அடிப்படைப் பொருளான பாத்திரங்கள் அல்லது உபகரணங்கள் என்பதைச் சூழலுக்கேற்ப வீட்டிலுள்ள உடைமைகள் என்ற பரந்த பொருளில் இயல்பாகத் தருகிறது.
- source_word: διαρπάσαι / διαρπάσει
  choice: கொள்ளையிட / கொள்ளையிடுவான்
  rationale: வலுக்கட்டாயமாகப் பறித்துச் செல்லும் செயலைக் குறிக்கும் வினையின் தீவிரத்தையும் வீட்டைக் கொள்ளையிடும் உருவகத்தையும் காக்கிறது.
- source_word: ἐὰν μὴ πρῶτον ... δήσῃ
  choice: முதலில் ... கட்டிப்போட்டால் மட்டுமே
  rationale: முதலில் செய்யப்பட வேண்டிய அவசியமான நிபந்தனையையும் செயல் வரிசையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καὶ τότε
  choice: அதன் பிறகு
  rationale: வலிமையானவனைக் கட்டிப்போட்ட பின்னரே கொள்ளையிடுதல் நிகழும் என்ற கால வரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: அவன் அவனுடைய வீட்டைக் கொள்ளையிடுவான்
  rationale: எதிர்கால வினையையும் மீண்டும் வரும் ‘வீடு’ என்ற உருவகத்தையும் பாதுகாக்கிறது; இரு ‘அவன்’ குறிப்புகளின் வேறுபாட்டைச் சூழல் தீர்மானிக்குமாறு கிரேக்கத்தின் அமைப்பை நெருக்கமாக வைத்திருக்கிறது.
theological_decisions:
- issue: இயேசுவின் சாத்தானைப் பற்றிய வாதத்தில் ‘வலிமையானவன்’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் உருவகத்தையே வைத்திருத்தல்
  alternative: ‘வலிமையானவன்’ என்பதை நேரடியாகச் ‘சாத்தான்’ என்று விளக்கி மொழிபெயர்த்தல்
  rationale: சூழலில் இவ்வுருவகம் சாத்தானை இயேசு மேற்கொள்வதைக் குறிப்பதாக இருந்தாலும், கிரேக்க உரை அதை உருவகமாகவே அளிக்கிறது. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் அதன் இறையியல் அழுத்தத்தையும் உருவக வடிவத்தையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கட்டிப்போடுதல்’, ‘கொள்ளையிடுதல்’ ஆகிய சொற்கள் வீட்டுக்குள் புகுந்து கொள்ளையிடும் உயிரோட்டமான உருவகத்தைத் தக்கவைக்கின்றன. கிரேக்கத்தில் இரு வேறு நபர்களைக் குறிக்கும் உரிச்சொற்கள் ஒரே வடிவில் இருப்பதால் இறுதி வாக்கியத்தின் இயல்பான தெளிவின்மை திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது.
