  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: ta
  text: எருசலேமிலிருந்து இறங்கி வந்த வேத அறிஞர்கள், “பெயல்செபூல்[a] இவனைப் பிடித்திருக்கிறது[b]” என்றும், “பேய்களின் தலைவனால்[c] இவன் பேய்களை ஓட்டுகிறான்” என்றும் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் Βεελζεβούλ; பாரம்பரியமாக “பெயல்செபூப்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “இவனிடம் பெயல்செபூல் இருக்கிறது.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பேய்களின் ஆட்சியாளனால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: இவர்கள் வெறும் எழுத்து நகலெடுப்பவர்கள் அல்லாமல் யூத வேதத்திலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்ற அங்கீகரிக்கப்பட்ட அறிஞர்கள் என்பதைக் காலத்திற்கேற்ற தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: எருசலேமிலிருந்து இறங்கி வந்த
  rationale: எருசலேமிலிருந்து புறப்பட்டதைச் சொல்வதோடு, καταβάντες என்பதிலுள்ள கீழ்நோக்கிய திசைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வடிவம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் கூறப்பட்ட குற்றச்சாட்டைக் காட்டுவதால், அந்த அம்சத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Βεελζεβοὺλ
  choice: பெயல்செபூல்
  rationale: SBLGNT கிரேக்க வடிவத்தை நேரடியாக ஒலிபெயர்க்கிறது; பாரம்பரிய மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔχει
  choice: இருக்கிறது
  rationale: கிரேக்கத்தில் உள்ள ‘கொண்டிருக்கிறான்/உள்ளது’ என்ற சுருக்கமான மொழிநடையைப் பாதுகாக்கிறது; பேய்ப்பிடித்திருப்பதாக வெளிப்படையாக விளக்கும் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: பேய்களின் தலைவனால்
  rationale: ἐν இங்கு கருவி அல்லது செயலாற்றும் ஆற்றலைக் குறிப்பதால் ‘-னால்’ இயல்பான தமிழ் வடிவமாகும்; ἄρχων என்பதன் அதிகாரப் பொருளை ‘தலைவன்’ தெளிவாகத் தருகிறது.
- source_word: δαιμονίων / δαιμόνια
  choice: பேய்கள்
  rationale: δαιμόνιον என்பதற்கு நேரான, பொதுவாகப் புரியும் தமிழ் சொல்; வேறு கிரேக்கச் சொற்றொடரான ‘அசுத்த ஆவிகள்’ என்பதை இங்கு புகுத்தவில்லை.
- source_word: ἐκβάλλει
  choice: ஓட்டுகிறான்
  rationale: பேய்களை வெளியேற்றும் செயலை நவீன இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: Βεελζεβοὺλ ἔχει என்ற குற்றச்சாட்டின் பொருள்
  choice: இவனிடம் பெயல்செபூல் இருக்கிறது
  alternative: இவனைப் பெயல்செபூல் பிடித்திருக்கிறது
  rationale: முதன்மை உரை கிரேக்கத்தின் சுருக்கத்தையும் அதன் உள்நோக்கிலுள்ள தெளிவின்மையையும் காக்கிறது. பேய்ப்பிடித்திருப்பது அல்லது அதன் கட்டுப்பாட்டில் இருப்பது என்ற சூழல்சார் விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: ἐν τῷ ἄρχοντι என்பதிலுள்ள ἐν-ன் செயல்பாடு
  choice: பேய்களின் தலைவனால்
  alternative: பேய்களின் தலைவனுடைய வல்லமையால்
  rationale: கருவிப் பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘வல்லமை’ என்பது பொருளில் மறைமுகமாக இருந்தாலும் மூலத்தில் தனிச் சொல்லாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: ἄρχων என்பதன் மொழிபெயர்ப்பு
  choice: தலைவன்
  alternative: ஆட்சியாளன்
  rationale: இரண்டும் அதிகாரத்தைக் குறிக்கலாம்; ‘தலைவன்’ சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது, ‘ஆட்சியாளன்’ என்பதும் சாத்தியமான நுண்பொருளாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேதபாரகர்’ போன்ற இன்றைய பேச்சில் அரிதான மரபுச் சொல்லுக்குப் பதிலாக ‘வேத அறிஞர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. தொடர்ச்சியான குற்றச்சாட்டை ‘சொல்லிக்கொண்டிருந்தார்கள்’ காட்டுகிறது; மூலத்தின் இரு ὅτι கூறுகளும் ‘என்றும் … என்றும்’ என்ற இணை அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
