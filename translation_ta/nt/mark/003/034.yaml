  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: ta
  text: அவர் தம்மைச் சுற்றி வட்டமாக அமர்ந்திருந்தவர்களைச் சுற்றிலும் பார்வையிட்டு, “இதோ, என் தாயும் என் சகோதரர்களும் இவர்களே![a]” என்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகள்.” கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது; ஆனால் இயேசுவைச் சுற்றியிருந்த விரிவான குழுவில் பெண்களும் இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: சுற்றிப் பார்த்து
  rationale: இயேசு தம்மைச் சுற்றியிருந்தவர்கள்மீது பார்வையைத் திருப்பிப் பார்த்த திட்டவட்டமான செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: தம்மைச் சுற்றி வட்டமாக அமர்ந்திருந்தவர்களை
  rationale: περὶ αὐτόν, κύκλῳ, καθημένους ஆகியவற்றின் சுற்றியிருத்தல், வட்ட அமைப்பு, அமர்ந்திருத்தல் என்ற மூன்று கூறுகளையும் காக்கிறது.
- source_word: λέγει
  choice: என்கிறார்
  rationale: மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தை இறந்தகாலமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை நேரடியாக முன்னிலையிலுள்ளவர்களிடம் திருப்பும் சுட்டுச் சொல்லின் வலிமையை இயல்பாகக் காக்கிறது.
- source_word: μήτηρ
  choice: தாய்
  rationale: சொல்லின் வழக்கமான நேரடியான பொருள்.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; இங்கு அது பெண்களையும் உள்ளடக்கிய விரிவான உறவுக் குழுவைக் குறிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பெண்களும் இருந்திருக்கக்கூடிய சீடர் வட்டத்தில் ἀδελφοί என்ற பாலினம் குறித்த குடும்பச் சொல்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / உடன்பிறந்தவர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தைத் தெளிவாக வைத்துக்கொண்டு, சுற்றியிருந்த விரிவான குழுவில் பெண்களும் அடங்கியிருக்கலாம் என்ற உண்மையான பொருள் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; இயல்பானதாயும் கண்ணியமானதாயும் உள்ளது. ‘இதோ’ என்பது Ἴδε என்பதன் சுட்டும் வலிமையைப் பாதுகாக்கிறது. வரலாற்று நிகழ்காலம் ‘என்கிறார்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
