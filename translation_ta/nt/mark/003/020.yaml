  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: ta
  text: அவர் ஒரு வீட்டுக்குள் வருகிறார்[a]. மறுபடியும் கூட்டம் கூடுகிறது. அதனால் அவர்களால் அப்பம் உண்ணக்கூட முடியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டிற்கு வருகிறார்.” கிரேக்கத்தில் சொற்பட “ஒரு வீட்டுக்குள்” என்று உள்ளது; ஆனால் இச்சொற்றொடர் மரபாக வீட்டிற்குத் திரும்புவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
