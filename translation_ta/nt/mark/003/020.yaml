  rationale: ὥστε குறிக்கும் விளைவைத் தெளிவாகக் காட்டுகிறது. αὐτούς என்பதன் பன்மையை ‘அவர்களால்’ எனக் காக்கிறது; அவர்கள் யார் என்பதை வசனத்துக்குள் கூடுதலாக விளக்கவில்லை.
- source_word: μηδὲ ἄρτον φαγεῖν
