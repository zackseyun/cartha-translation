- from: அப்போது அவருடைய தாயும் சகோதரர்களும் வந்தார்கள். அவர்கள் வெளியே நின்றுகொண்டு, அவரை அழைக்கும்படி அவரிடம் ஆள் அனுப்பினார்கள்.
  to: அப்போது அவருடைய தாயும் சகோதரர்களும் வந்தார்கள். அவர்கள் வெளியே நின்றுகொண்டு, அவரை அழைக்கும்படி அவரிடம் செய்தி அனுப்பினார்கள்[a][b].
  rationale: The revision removes the unsupported explicit reference to sending a person and uses the contextually natural Tamil expression “செய்தி அனுப்பினார்கள்.” It preserves the source’s family terminology and the purpose of the message. Footnote anchors have been added at the relevant clause to document the lexical alternatives in the audit trail.
