    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported explicit reference to sending a person and uses the contextually natural Tamil expression “செய்தி அனுப்பினார்கள்.” It preserves the source’s family terminology and the purpose of the message. Footnote anchors have been added at the relevant clause to document the lexical alternatives in the audit trail.
