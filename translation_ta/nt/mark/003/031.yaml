review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the narrative sequence, the mother and brothers, and their position outside. However, “அவரிடம் ஆள் அனுப்பினார்கள்” explicitly supplies a person/messenger, whereas ἀπέστειλαν πρὸς αὐτόν leaves the object unstated. In context it naturally conveys sending word/message, but does not require stating that they sent a person.
  naturalness: “வெளியே நின்றுகொண்டு” is natural modern Tamil. Replacing “ஆள் அனுப்பினார்கள்” with “செய்தி அனுப்பினார்கள்” is both more idiomatic in this context and avoids the unnecessary colloquial/concrete addition of “ஆள்.”
  terminology: “தாயும் சகோதரர்களும்” preserves the unqualified wording of μήτηρ and ἀδελφοί without imposing a view of the brothers’ precise familial relationship. “அவரை அழைக்கும்படி” appropriately represents the purposive force of καλοῦντες αὐτόν without adding that Jesus was brought somewhere.
  issues:
  - severity: medium
    issue: “ஆள் அனுப்பினார்கள்” adds an explicit messenger/person.
    rationale: The Greek says that they ‘sent to him,’ with the context supporting ‘sent word/a message’; it does not explicitly identify the thing sent as a person. “செய்தி அனுப்பினார்கள்” retains the contextual idiom without adding that detail.
  - severity: low
    issue: No Tamil footnote anchors or footnotes are supplied for the audit-trail lexical alternatives.
    rationale: The supplied English audit trail includes alternatives for the idiom ‘sent word’ and for ‘calling.’ Retaining corresponding Tamil anchors makes those alternatives transparent and keeps the translation package aligned with the requested footnote review.
  revised_text: அப்போது அவருடைய தாயும் சகோதரர்களும் வந்தார்கள். அவர்கள் வெளியே நின்றுகொண்டு, அவரை அழைக்கும்படி அவரிடம் செய்தி அனுப்பினார்கள்[a][b].
