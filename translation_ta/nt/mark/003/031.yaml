source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: ta
  text: அப்போது அவருடைய தாயும் சகோதரர்களும் வந்தார்கள். அவர்கள் வெளியே நின்றுகொண்டு, அவரை அழைக்கும்படி அவரிடம் செய்தி அனுப்பினார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரிடம் ஒரு செய்தியை அனுப்பினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரை அழைத்தார்கள்” அல்லது “அவரை வருமாறு அழைத்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: அப்போது
  rationale: கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்தும் இணைப்பாக இருப்பதால், நவீன தமிழில் இயல்பான ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: ἔρχονται
  choice: வந்தார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடையில் இயல்பாக இறந்தகாலத்தில் தரப்பட்டது.
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: அவருடைய தாயும் சகோதரர்களும்
  rationale: உறவுமுறைகளை விளக்கவோ குறுக்கவோ செய்யாமல் மூலத்தின் நேரடியான பொருள் காக்கப்பட்டது.
- source_word: ἔξω στήκοντες
  choice: வெளியே நின்றுகொண்டு
  rationale: அவர்கள் இருந்த இடத்தையும் தொடர்ந்த நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: அவரிடம் ஆள் அனுப்பினார்கள்
  rationale: யாரோ ஒருவரை அவரிடம் அனுப்பினர் என்பது சூழலில் உட்கிடக்கும் பொருள்; தமிழில் வாக்கியம் முழுமையாகவும் இயல்பாகவும் இருக்க ‘ஆள்’ வெளிப்படையாகச் சொல்லப்பட்டது.
- source_word: καλοῦντες αὐτόν
  choice: அவரை அழைக்கும்படி
  rationale: அனுப்பப்பட்டவரின் நோக்கம் அவரை அழைப்பது என்பதைத் தெளிவாகக் காட்டுகிறது; ‘வரவழைக்க’ அல்லது ‘அழைத்துவர’ என்று கூறி மூலத்தில் இல்லாத இயக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘அவருடைய சகோதரர்கள்’ என்பவர்களின் துல்லியமான உறவுமுறை
  choice: சகோதரர்கள்
  alternative: உடன்பிறந்த சகோதரர்கள்; உறவினர்கள்
  rationale: ἀδελφοί என்பதன் இயல்பான பொருளை மட்டும் மொழிபெயர்த்து, அவர்கள் உயிரியல் உடன்பிறந்தவர்களா அல்லது விரிவான குடும்ப உறவினர்களா என்ற மரபுசார் விவாதத்தை வசனத்துக்குள் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகப் புரியும், அதேவேளை கண்ணியமான கதைநடை. ‘ஆள் அனுப்பினார்கள்’ என்பது பேச்சுவழக்குச் சாயல் மிகாமல் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
