lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: எதிர்ப்பு அல்லது அழுத்தத்திலிருந்து பின்வாங்கிச் செல்லும் நுண்பொருளையும், ஓரிடத்திலிருந்து சென்றுவிடுதல் என்ற அடிப்படைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: தமது சீடர்களுடன்
  rationale: நற்செய்தி நூல்களின் சூழலில் μαθηταί என்பது வெறும் மாணவர்களை அல்ல, இயேசுவைப் பின்பற்றிக் கற்றுக்கொள்பவர்களைக் குறிக்கிறது; ‘சீடர்கள்’ என்பது நிலைபெற்ற, பொருத்தமான தமிழ் வழக்கு.
- source_word: πρὸς τὴν θάλασσαν
  choice: கடலை நோக்கி
  rationale: πρός இங்கு கடலின் திசையை நோக்கிய நகர்வைக் குறிக்கலாம்; சென்றடைந்ததைத் தேவையின்றி உறுதிப்படுத்தாமல் மூலத்தின் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது. θάλασσα என்பதற்கான நேரடி பொருளான ‘கடல்’ தக்கவைக்கப்படுகிறது.
- source_word: πολὺ πλῆθος
  choice: பெருந்திரளான மக்கள்
  rationale: மிகப் பெரிய மக்கள் கூட்டத்தை நவீன, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἠκολούθησεν
  choice: அவரைப் பின்தொடர்ந்தார்கள்
  rationale: இங்கு கூட்டத்தினர் இயேசு சென்ற வழியில் அவருக்குப் பின்னால் சென்றனர் என்பதைக் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து
  rationale: கூட்டத்தினரின் புறப்பட்ட இடம் அல்லது பிறப்பிடப் பகுதியைக் குறிக்கும் ἀπό-வின் பொருளை நேரடியாக வழங்குகிறது.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: யூதேயாவிலிருந்தும்
  rationale: அடுத்த வசனத்தில் தொடரும் இடப்பட்டியலின் நிறைவுறாத அமைப்பைத் தமிழிலும் தக்கவைக்கிறது.
