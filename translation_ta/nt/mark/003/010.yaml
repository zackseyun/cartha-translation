- source_word: ἐπιπίπτειν αὐτῷ
  choice: அவர்மீது முண்டியடித்துக்கொண்டு வந்தார்கள்
  rationale: சொல்லின் அடிப்படைப் பொருளான ‘மேல் விழுதல்’ என்பதிலுள்ள உடல் அழுத்தத்தையும், கூட்டம் அவரை நோக்கி நெருக்கி வந்த சூழலையும் இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: அவரைத் தொடுவதற்காக
