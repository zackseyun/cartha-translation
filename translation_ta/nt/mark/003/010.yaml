  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ta
  text: ஏனெனில், அவர் பலரைக் குணமாக்கியிருந்தார். அதனால், கடும் பாதிப்புகளால் வாடிய அனைவரும் அவரைத் தொடுவதற்காக அவர்மீது முண்டியடித்துக்கொண்டு வந்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்மீது வந்து விழுந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மக்கள் அவரை நோக்கி வலுக்கட்டாயமாக நெருங்கியதை மிகவும் வலிமையாகச் சொல்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கடும் நோய்களால் வாடிய” அல்லது “வாதைகளைக் கொண்டிருந்த” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லின் நேரடிப் பொருள் “சாட்டையடிகள்”; இங்கு அது கடுமையாகத் துன்புறுத்தும் பாதிப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
