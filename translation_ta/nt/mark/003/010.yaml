- source_word: εἶχον μάστιγας
  choice: கடும் பாதிப்புகளால் வாடிய
  rationale: μάστιξ என்பதன் நேரடியான ‘சாட்டை/சாட்டையடி’ உருவகத்தில் உள்ள கடுமையைக் காத்து, அதை மருத்துவ நோய்களுக்கு மட்டும் தேவையின்றிக் குறுக்காமல் துன்புறுத்தும் பாதிப்புகளாக இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: μάστιγας குறிக்கும் துன்பத்தின் தன்மை
  choice: கடும் பாதிப்புகளால் வாடிய
  alternative: கடும் நோய்களால் வாடிய / வாதைகளைக் கொண்டிருந்த
  rationale: குணமாக்கும் சூழல் உடல்நலப் பாதிப்புகளைச் சுட்டினாலும், கிரேக்கச் சொல் வெறும் மருத்துவப் பெயரைவிட விரிவும் தீவிரமும் உடையது. ஆகவே நோயாக மட்டும் குறுக்காமல் பாதிப்பின் கடுமையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘முண்டியடித்துக்கொண்டு’ என்பது கூட்டத்தின் உடல் அழுத்தத்தையும் அவசரத்தையும் இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்புகள் கிரேக்கத்தின் நேரடியான வலிமையையும் μάστιγας என்பதன் பொருள் விரிவையும் காக்கின்றன.
