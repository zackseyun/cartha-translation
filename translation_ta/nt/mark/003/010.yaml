  rationale: மக்கள் இப்போது அவரை நோக்கி முண்டியடிப்பதற்குக் காரணமான முந்தைய குணமாக்கும் செயலைத் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: ὥστε
