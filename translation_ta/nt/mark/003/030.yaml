  text: ὅτι ἔλεγον· Πνεῦμα ἀκάθαρτον ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/030.yaml
  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: ta
  text: ஏனெனில், “இவனுக்கு ஓர் அசுத்த ஆவி இருக்கிறது”[a] என்று அவர்கள் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இயல்பான சொல்லாக்கத்தில், “இவனை ஓர் அசுத்த ஆவி பிடித்திருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கடுமையான தீர்ப்புக்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துவதால், காரணப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வினை, அவர்கள் இதை ஒருமுறை மட்டும் சொன்னதல்லாமல் தொடர்ந்து அல்லது திரும்பத் திரும்பச் சொல்லிவந்ததை வெளிப்படுத்துகிறது.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: ஓர் அசுத்த ஆவி
  rationale: நற்செய்தி நூல்களில் பேய்சார் ஆவியைக் குறிக்கும் நிலையான சொற்றொடரின் நேரடிப் பொருளையும், ἀκάθαρτος என்பதன் ‘அசுத்தம்’ என்ற சொல்லிணைப்பையும் காக்கிறது.
- source_word: ἔχει
  choice: இருக்கிறது
  rationale: கிரேக்கத்தில் உள்ள ‘கொண்டிருக்கிறான்/அவனுக்கு இருக்கிறது’ என்ற நேரடியான கருத்தைத் தக்கவைத்து, முதன்மை உரையில் ‘பிடித்திருக்கிறது’ என விளக்கி விரிவாக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிராகச் சுமத்தப்பட்ட குற்றச்சாட்டின் தன்மை
  choice: “இவனுக்கு ஓர் அசுத்த ஆவி இருக்கிறது” என்ற நேரடிக் குற்றச்சாட்டைத் தக்கவைத்தல்
  alternative: “இவனை ஓர் அசுத்த ஆவி பிடித்திருக்கிறது”
  rationale: எதிரிகளின் அதிர்ச்சியூட்டும் குற்றச்சாட்டை மூலத்தின் நேரடி வடிவிலேயே இது காக்கிறது; அவர்களுடைய கூற்றை மென்மைப்படுத்தவோ, பேய்ப்பிடித்தல் என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவோ இல்லை. இயல்பான தமிழ்ச் சொல்லாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்பது தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சை உணர்த்துகிறது; ‘இவனுக்கு’ என்பது எதிரிகளின் நேரடிக் கூற்றின் கூர்மையை இயல்பாகக் காக்கிறது.
