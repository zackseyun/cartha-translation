source:
  edition: SBLGNT
  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: ta
  text: அவர் பன்னிருவரை நியமித்தார்; சீமோனுக்கு “பேதுரு”[a] என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேதுரு” என்பதற்கு “பாறை” என்று பொருள்.
    reason: பெயரின் கிரேக்கச் சொற்பொருளைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ἐποίησεν
  choice: நியமித்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘உருவாக்கினார்’ என்றாலும், இங்கு இயேசு பன்னிருவரை ஒரு குறிப்பிட்ட குழுவாக ஏற்படுத்திய செயலைக் குறிக்கிறது. எனவே ‘நியமித்தார்’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: τοὺς δώδεκα
  choice: பன்னிருவரை
  rationale: இது இயேசுவால் தேர்ந்தெடுக்கப்பட்ட அறியப்பட்ட பன்னிருவர் குழுவைக் குறிக்கிறது. ‘பன்னிருவரை’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐπέθηκεν ὄνομα
  choice: பெயரிட்டார்
  rationale: சொல்லுக்கு சொல் ‘பெயரை வைத்தார்’ என்று பொருள்படும் கிரேக்க மரபுத்தொடரை, பெயர் சூட்டும் செயலைத் தெளிவாகக் காட்டும் இயல்பான தமிழில் ‘பெயரிட்டார்’ என்று மொழிபெயர்த்துள்ளோம்.
- source_word: Σίμωνι
  choice: சீமோனுக்கு
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளது; கிரேக்க வேற்றுமை உருபின் பொருள் ‘-க்கு’ மூலம் காட்டப்பட்டுள்ளது.
- source_word: Πέτρον
  choice: பேதுரு
  rationale: இங்கு இது சீமோனுக்குக் கொடுக்கப்பட்ட தனிப்பெயராகச் செயல்படுவதால், அதன் பொருளை முதன்மை உரையில் மொழிபெயர்க்காமல் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது. பெயரின் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசு பன்னிருவரிடம் செய்த செயலை மொழிபெயர்த்தல்
  choice: பன்னிருவரை நியமித்தார்
  alternative: பன்னிருவரை உருவாக்கினார் / பன்னிருவராக ஏற்படுத்தினார்
  rationale: இந்த இடம் பன்னிருவரை ஒரு குறிப்பிட்ட குழுவாக அமைத்ததைச் சொல்கிறது. ‘நியமித்தார்’ அந்த அதிகாரப்பூர்வத் தன்மையைத் தெரிவிக்கிறது; அதே நேரத்தில் பிற்காலத் திருச்சபைப் பதவியியல் கருத்துகளை உரைக்குள் சேர்ப்பதில்லை.
- issue: Πέτρον என்ற பெயரைக் கையாளுதல்
  choice: பேதுரு
  alternative: பாறை
  rationale: Πέτρος இங்கு தனிப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் சொற்பொருள் முதன்மை உரையை மாற்றாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சித் தன்மை காக்கப்பட்டாலும், தமிழில் இயல்பாக வாசிக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
