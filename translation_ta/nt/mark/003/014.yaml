lexical_decisions:
- source_word: ἐποίησεν
  choice: நியமித்தார்
  rationale: இந்த இடத்தில் வினைச்சொல்லின் நேரடிப் பொருள் ‘செய்தார்’ என்றாலும், பன்னிருவரைக் குறிப்பிட்ட ஒரு குழுவாக ஏற்படுத்திய செயலை இது குறிக்கிறது. ஆகவே ‘நியமித்தார்’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: δώδεκα
  choice: பன்னிருவரை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாமல் ‘பன்னிரண்டு’ என்று மட்டும் உள்ளது. தமிழில் மனிதர்களைக் குறிக்கும் உயர்திணை வடிவமான ‘பன்னிருவரை’ அந்தச் சுருக்கத்தை இயல்பாகப் பாதுகாக்கிறது; ‘அந்தப் பன்னிருவர்’ என்று இல்லாத சுட்டுத்தன்மையைச் சேர்க்கவில்லை.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: அவர்கள் தம்மோடு இருப்பதற்காகவும்
  rationale: ἵνα உடன் வரும் subjunctive இங்கு நோக்கத்தைத் தெரிவிக்கிறது. ‘இருப்பதற்காக’ என்பது அந்த நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘தம்மோடு’ என்பது இயேசுவையே திரும்பச் சுட்டுகிறது.
- source_word: ἀποστέλλῃ
  choice: அவர்களை அனுப்புவதற்காகவும்
  rationale: இந்த வினை அனுப்புதலைக் குறிக்கிறது; சூழலில் பணிக்காக அனுப்பும் நிழற்பொருள் இருந்தாலும், ‘அனுப்பினார்’ என்பதே ‘அப்போஸ்தலர்’ என்ற பட்டத்தை மூலவாசகம் இல்லாத இடத்தில் சேர்க்காமல் பொருளைப் பாதுகாக்கிறது.
- source_word: κηρύσσειν
  choice: பிரசங்கிக்க
  rationale: இந்தச் சொல் பொதுவெளியில் செய்தியை அறிவிப்பதைக் குறிக்கிறது. நற்செய்தி நூலின் சூழலில் ‘பிரசங்கிக்க’ என்பது சுருக்கமான, வழக்கமான தமிழ்; ‘அறிவிக்க’ என்பதும் சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: முதன்மை வாசகத்தில் ‘அப்போஸ்தலர்கள்’ என்ற பட்டத்தைச் சேர்ப்பதா
  choice: முதன்மை வாசகத்தில் அந்தப் பட்டத்தைச் சேர்க்கவில்லை.
