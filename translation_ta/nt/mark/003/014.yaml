  rationale: கொடுக்கப்பட்ட SBLGNT மூலவாசகத்தில் இந்த நீண்ட வாசகம் இல்லை. ஆகவே பட்டத்தை முதன்மை வாசகத்தில் இறக்குமதி செய்யாமல், முக்கியமான கையெழுத்துப் பிரதி வேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ மற்றும் தற்சுட்டான ‘தம்மோடு’ பயன்படுத்தப்பட்டுள்ளன. இரண்டு ἵνα நோக்கக் கூறுகளும் இணையான ‘இருப்பதற்காகவும் ... அனுப்புவதற்காகவும்’ என்ற அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
