id: MRK.3.5
reference: Mark 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: ta
  text: அவர் கோபத்துடன் அவர்களைச் சுற்றிலும் பார்த்து, அவர்களுடைய இதயங்கள் கடினமாயிருந்ததால்[a] வருந்தியபடி, அந்த மனிதரிடம், “உன் கையை நீட்டு” என்று சொல்கிறார். அவன் அதை நீட்டினான்; அவனுடைய கை பழைய நிலைக்குத் திரும்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘அவர்களுடைய இதயம்’ என்று ‘இதயம்’ ஒருமையில் உள்ளது; இது கூட்டுப்பொருளில் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: மூலமொழியின் கூட்டொருமை வடிவத்தையும் இயல்பான தமிழ் பன்மைக்கு உள்ள மாற்று வாய்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: அவர்களைச் சுற்றிலும் பார்த்து
  rationale: சுற்றியிருந்த குழுவினர் ஒவ்வொருவரையும் நோக்கிப் பார்த்ததை இயல்பான தமிழில் தெரிவிக்கிறது; முதன்மை வினைக்கு முன் நிகழும் பங்கேற்புவினைத் தொடரையும் காக்கிறது.
- source_word: μετ’ ὀργῆς
  choice: கோபத்துடன்
  rationale: μετά + வேற்றுமை உருபு இங்கு செயல் நிகழும் விதத்தைக் குறிக்கிறது. இயேசுவின் கோபத்தை மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: συλλυπούμενος
  choice: வருந்தியபடி
  rationale: வலி அல்லது துயரம் அடைந்த நிலையைக் குறிக்கும் பங்கேற்புவினையை இயல்பான தமிழில் தருகிறது; கோபமும் வருத்தமும் ஒருங்கே இருப்பதையும் காக்கிறது.
- source_word: ἐπὶ τῇ πωρώσει
  choice: கடினமாயிருந்ததால்
  rationale: வருத்தத்திற்கான காரணத்தைத் தெளிவாகத் தருகிறது. πώρωσις என்பதிலுள்ள கடினப்படுதல் அல்லது உணர்வின்மை என்ற உருவகத்தின் மையத்தைப் பாதுகாக்கிறது.
- source_word: τῆς καρδίας αὐτῶν
  choice: அவர்களுடைய இதயங்கள்
  rationale: கிரேக்கத்தில் ‘இதயம்’ ஒருமையில் இருந்தாலும் பன்மைச் சுட்டுப்பெயருடன் வந்து கூட்டுப்பொருளைக் கொண்டுள்ளது. இயல்பான தமிழுக்காகப் பன்மை பயன்படுத்தப்பட்டு, மூலத்தின் ஒருமை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைத் தமிழிலும் காக்கிறது.
- source_word: τῷ ἀνθρώπῳ
  choice: அந்த மனிதரிடம்
  rationale: சூழலில் குறிப்பிடப்பட்ட குறிப்பிட்ட ஆண் நபரைத் தெளிவாகவும் மரியாதையான நவீன தமிழிலும் குறிக்கிறது.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: உன் கையை நீட்டு
  rationale: கட்டளையின் நேரடித்தன்மையையும் ἐκτείνω என்பதன் உடல்சார் இயக்கத்தையும் இயல்பாகத் தருகிறது.
- source_word: ἐξέτεινεν
  choice: அவன் அதை நீட்டினான்
  rationale: கட்டளையில் வந்த வினையை மீண்டும் பயன்படுத்தி மூலத்தின் சொல் எதிரொலியைக் காக்கிறது; ‘அதை’ என்பது கையைத் தெளிவாகச் சுட்டுகிறது.
- source_word: ἀπεκατεστάθη
  choice: பழைய நிலைக்குத் திரும்பியது
  rationale: ஒரு பொருள் முன்பிருந்த சரியான நிலைக்கு மீட்டமைக்கப்பட்டதைச் சுட்டும் வினையின் பொருளை இயல்பான தமிழில் தருகிறது; ‘குணமானது’ என்ற குறுகிய மருத்துவப் பொருளை மட்டும் திணிக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் கோபமும் வருத்தமும்
  choice: ‘கோபத்துடன்’ என்றும் ‘வருந்தியபடி’ என்றும் இரு உணர்வுகளையும் நேரடியாக மொழிபெயர்த்தல்
  alternative: கோபத்தை ‘நியாயமான வெறுப்பு’ என விளக்கமாக்குதல் அல்லது வருத்தத்தை மட்டும் முன்னிறுத்துதல்
  rationale: மூலவசனம் இரு உணர்வுகளையும் ஒரே நேரத்தில் முன்வைக்கிறது. அவற்றில் ஒன்றை மென்மைப்படுத்தாமலும், கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் உள்ள பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ‘அவர்களுடைய இதயம்’ என்ற கூட்டொருமை
  choice: முதன்மை உரையில் இயல்பான பன்மையான ‘அவர்களுடைய இதயங்கள்’; மூலத்தின் ஒருமையை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அவர்களுடைய இதயம்’ என்று சொல்லுருவை அப்படியே வைத்தல்
  rationale: கிரேக்க ஒருமை கூட்டுப்பொருளாகப் புரிந்துகொள்ளத்தக்கது. தமிழில் பன்மை இயல்பாக இருந்தாலும், மூல வடிவத்தின் உண்மையான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மாற்குவின் வரலாற்று நிகழ்காலம் ‘சொல்கிறார்’ எனப் பாதுகாக்கப்பட்டுள்ளது. முதன்மை வாக்கியத்தின் பங்கேற்புவினை அமைப்பு தமிழில் கனமாகாமல் இருக்க ‘பார்த்து … வருந்தியபடி’ என அமைக்கப்பட்டுள்ளது.
