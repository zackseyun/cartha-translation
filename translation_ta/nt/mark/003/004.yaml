  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஓய்வுநாளில்[a] நன்மை செய்வதா, தீங்கு செய்வதா; ஓர் உயிரைக் காப்பதா, கொல்வதா—எது சட்டப்படி அனுமதிக்கப்பட்டது?” என்று கேட்டார். அவர்களோ மௌனமாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் இது ‘ஓய்வுநாட்களில்’ என்ற பன்மை வடிவில் உள்ளது; இங்கு அது ‘ஓய்வுநாளில்’ என்ற பொருளில் வரும் வழக்குச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்பட்டது
  rationale: ஓய்வுநாள் கடைப்பிடிப்பு குறித்த சட்ட-அறநெறி விவாதத்தில், எது அனுமதிக்கப்பட்டது என்பதைக் கேட்கும் சொல்லின் சட்டப்பூர்வ நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், அது இங்கு ஒரு குறிப்பிட்ட ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொல்லாட்சி. தமிழில் ஒருமை இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் உள்ளது; வடிவியல் தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀγαθοποιῆσαι
  choice: நன்மை செய்வதா
  rationale: நல்லதும் பயனளிப்பதுமான செயலைச் செய்வது என்ற நேரடியான வினைப் பொருளைப் பேணுகிறது.
- source_word: κακοποιῆσαι
  choice: தீமை செய்வதா
  rationale: ἀγαθοποιῆσαι என்பதற்கு நேரான அறநெறி எதிர்மறையாக அமைகிறது; தீங்கு விளைவிப்பது என்ற சூழல்சார் பொருளையும் உள்ளடக்குகிறது.
- source_word: ψυχὴν σῶσαι
  choice: ஓர் உயிரைக் காப்பதா
  rationale: கொல்வதற்கு எதிராக இங்கு ψυχή என்பது உடலற்ற ஆன்மாவை அல்ல, ஒருவரின் உயிரைக் குறிக்கிறது.
- source_word: ἀποκτεῖναι
  choice: கொல்வதா
  rationale: சொல்லின் அடிப்படைப் பொருளைத் தருகிறது; ‘கொலை செய்வது’ என்று மொழிபெயர்த்து மூலத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது அறநெறி நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: ἐσιώπων
  choice: மௌனமாக இருந்தார்கள்
  rationale: கேள்விக்குப் பதிலளிக்காமல் தொடர்ந்து அமைதியாக இருந்ததை இறந்தகாலத் தொடர்நிலைக்கு ஏற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஓய்வுநாள் சட்டம் குறித்த கேள்வியின் சொல்லாட்சி
  choice: ‘எது சட்டப்படி அனுமதிக்கப்பட்டது?’ என்று இரு முரண்பட்ட செயலிணைகளையும் ஒரே சட்ட-அறநெறிக் கேள்விக்குள் வைத்தல்
  alternative: முதலாவது செயல் மட்டுமே சட்டப்படி அனுமதிக்கப்பட்டதா என்று கேட்பதாக வெளிப்படுத்தல்
  rationale: கிரேக்க வாக்கியம் நன்மை/தீமை மற்றும் உயிரைக் காத்தல்/கொல்லுதல் ஆகிய கூர்மையான எதிர்மறைகளைத் திறந்த கேள்வியாக முன்வைக்கிறது. பதிலை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சொல்லாமல் அதன் சொல்லாட்சித் தீவிரத்தையும் இறையியல் அழுத்தத்தையும் பேணுகிறது.
- issue: τοῖς σάββασιν என்ற பன்மை வடிவம்
  choice: முதன்மை உரையில் இயல்பான ஒருமையான ‘ஓய்வுநாளில்’
  alternative: ‘ஓய்வுநாட்களில்’
  rationale: பன்மை வடிவம் கொய்னே கிரேக்கத்தில் ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொல்லாட்சியாகப் பயன்படுகிறது; இச்சம்பவத்தின் குறிப்பிட்ட நாளைத் தமிழில் பன்மையாகக் கூறுவது பல நாட்களைப் பற்றிய பொதுக் கேள்வி என்ற தவறான எண்ணத்தை ஏற்படுத்தலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இணையான எதிர்மறை வினாக்களை அரைப்புள்ளி மற்றும் நீள்கோடு கொண்டு தெளிவுபடுத்தி, இயேசுவின் கேள்வியின் கூர்மையைப் பேணியுள்ளது.
