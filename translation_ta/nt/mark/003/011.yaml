source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: ta
  text: அசுத்த ஆவிகள் அவரைக் காணும்போதெல்லாம், அவருக்கு முன்பாக விழுந்தன[a]; “நீர் இறைவனின் மகன்” என்று உரக்கக் கத்தின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருக்கு முன்பாகத் தம்மைத் தரையில் வீழ்த்தின.’ கிரேக்க வினைச்சொல் ஒருவருக்கு முன் பணிவாக அல்லது மன்றாட்டோடு விழுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: அசுத்த ஆவிகள்
  rationale: ἀκάθαρτα என்பதன் அசுத்தம் என்ற நேரடிப் பொருளையும், நற்செய்தி நூல்களில் நிலைபெற்ற சொற்பயன்பாட்டையும் காக்கிறது; ‘தீய ஆவிகள்’ என்பது பொருளை விளக்கி விரிவாக்கிவிடும்.
- source_word: ὅταν
  choice: காணும்போதெல்லாம்
  rationale: ὅταν என்பதும் அதைத் தொடரும் நிறைவுறா இறந்தகால வினைகளும் நிகழ்வு மீண்டும் மீண்டும் நடந்ததைக் காட்டுகின்றன; ‘போதெல்லாம்’ அந்தத் தொடர்நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐθεώρουν
  choice: காணும்
  rationale: இச்சூழலில் θεωρέω என்பது அவரைக் கண்டதைக் குறிக்கிறது; ‘உற்றுப்பார்த்தன’ போன்ற சொல் மூலத்தில் இல்லாத நீடித்த கவனிப்பை வலியுறுத்தக்கூடும்.
- source_word: προσέπιπτον αὐτῷ
  choice: அவருக்கு முன்பாக விழுந்து
  rationale: இது இயேசுவுக்கு முன் தரையில் விழும் உடல்செயலைத் தெளிவாகக் காட்டுகிறது; அதை ‘வழிபட்டன’ என்று மொழிபெயர்த்து அதன் நோக்கத்தை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: ἔκραζον λέγοντα
  choice: என்று உரக்கக் கத்தின
  rationale: κράζω என்பதன் வலிமையான குரலை ‘உரக்கக் கத்தின’ இயல்பாக வெளிப்படுத்துகிறது; λέγοντα மேற்கோள் உரையுடன் ‘என்று’ வழியாக இணைக்கப்படுகிறது.
- source_word: Σὺ εἶ
  choice: நீர்
  rationale: வெளிப்படையாக இடம்பெறும் Σὺ எழுவாயைத் தமிழில் மரியாதை ஒருமையான ‘நீர்’ மூலம் இயல்பாகவும் வலியுறுத்தலுடனும் தருகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: இறைவனின் மகன்
  rationale: மூலத்தின் உறவையும் அடையாளவாசகத் தன்மையையும் நேரடியாகக் காக்கிறது; இயேசுவை நோக்கிய உரையில் தெய்வத்தைச் சுட்ட ‘இறைவன்’ நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
theological_decisions:
- issue: அசுத்த ஆவிகள் இயேசுவுக்கு முன் விழுந்த செயல் வழிபாடா அல்லது பணிவைக் காட்டும் வீழ்ச்சியா?
  choice: ‘அவருக்கு முன்பாக விழுந்து’ என்று உடல்செயலாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவரை வழிபட்டு’ அல்லது ‘அவரை வணங்கி’
  rationale: προσπίπτω பணிவு, மன்றாட்டு அல்லது கட்டாய அடக்கத்தைச் சுட்டலாம். இங்கு வழிபாடு என்று உரை வெளிப்படையாகக் கூறாததால், அதன் இறையியல் பொருளைத் தீர்மானிக்காமல் மூலத்தின் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ὁ υἱὸς τοῦ θεοῦ என்பதன் கிறிஸ்துவியல் அடையாளவாசக வலிமை
  choice: ‘இறைவனின் மகன்’
  alternative: ‘இறைவனுக்கு மகன்’ அல்லது அடையாளவாசக வலிமை குறைந்த வேறு உரை
  rationale: கிரேக்கத்தின் வரையறைச் சுட்டும் உடைமைத் தொடர்பும் பாதுகாக்கப்பட்டு, அசுத்த ஆவிகள் இயேசுவின் அடையாளத்தை அறிவிப்பது தெளிவாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நற்செய்தி நடை. மூலத்தின் தொடர்நிகழ்வு ‘போதெல்லாம்’ மூலம் காக்கப்பட்டுள்ளது. தேவையற்ற வடமொழிச் சிக்கலும் மிகை விளக்கமும் தவிர்க்கப்பட்டுள்ளன.
