revisions:
- from: ஆனால் பரிசுத்த ஆவியானவருக்கு எதிராகத் தூஷணம் செய்கிறவன் என்றென்றும் மன்னிப்புப் பெறமாட்டான்[a]; மாறாக, அவன் நித்திய பாவத்திற்குக் குற்றவாளியாக இருக்கிறான்[b][c].
  to: ஆனால், பரிசுத்த ஆவிக்கு எதிராகத் தூஷணம் செய்கிற எவனுக்கும் என்றென்றும் மன்னிப்பு இல்லை[a]; மாறாக, அவன் நித்திய பாவத்திற்குக் குற்றவாளியாக இருக்கிறான்[b][c].
