source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: ta
  text: ஆனால், பரிசுத்த ஆவிக்கு எதிராகத் தூஷணம் செய்கிற எவனுக்கும் என்றென்றும் மன்னிப்பு இல்லை[a]; மாறாக, அவன் நித்திய பாவத்திற்குக் குற்றவாளியாக இருக்கிறான்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘யுகத்திற்குள் மன்னிப்பு இல்லை’; அதாவது, ‘ஒருபோதும் மன்னிப்பு இல்லை’ அல்லது ‘என்றென்றும் மன்னிப்பு இல்லை.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நித்திய பாவத்திற்குப் பொறுப்புக்குட்பட்டவனாக இருக்கிறான்.’
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் ‘நித்திய பாவம்’ என்பதற்குப் பதிலாக ‘நித்திய நியாயத்தீர்ப்பு’ அல்லது ‘நித்திய தண்டனை’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: ஆனால் ... செய்கிறவன்
  rationale: ὃς உடன் ἄν வருவது பொதுவான, வரையறுக்கப்படாத நபரைக் குறிக்கிறது; தமிழில் ‘செய்கிறவன்’ என்பது இயல்பாக அந்தப் பொருளைத் தருகிறது. δέ முந்தைய கூற்றுடன் மிதமான முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: βλασφημήσῃ
  choice: தூஷணம் செய்கிறவன்
  rationale: βλασφημέω என்பதன் மத மற்றும் இறையியல் கனத்தை ‘தூஷணம் செய்’ தக்கவைக்கிறது; பொதுவான நிபந்தனைப் பொருள் தமிழின் நிகழ்கால வடிவில் இயல்பாகத் தரப்படுகிறது.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவருக்கு எதிராக
  rationale: εἰς இங்கு தூஷணத்தின் இலக்கைச் சுட்டுகிறது. தமிழில் ‘எதிராக’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. ஆவியானவரைக் குறிக்கும் மரியாதைமிக்க வழக்காக ‘ஆவியானவர்’ பயன்படுத்தப்பட்டது.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: என்றென்றும் மன்னிப்புப் பெறமாட்டான்
  rationale: ἄφεσις என்பது மன்னிப்பு அல்லது விடுதலை. எதிர்மறைச் சூழலில் εἰς τὸν αἰῶνα ‘என்றென்றும் இல்லை/ஒருபோதும் இல்லை’ என்ற பொருளைத் தருகிறது. தமிழில் ‘என்றென்றும் மன்னிப்புப் பெறமாட்டான்’ என்பது இயல்பாகவும் வலிமையாகவும் உள்ளது; சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: ἀλλά வலுவான எதிர்மாற்றத்தைக் குறிக்கிறது; முதல் கூற்றுக்குப் பதிலான நிலையை ‘மாறாக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔνοχός ἐστιν
  choice: குற்றவாளியாக இருக்கிறான்
  rationale: ἔνοχος என்பது குற்றமுடையவன் அல்லது ஒன்றிற்குப் பொறுப்புக்குட்பட்டவன் என்ற இரு நிழற்பொருள்களையும் கொண்டுள்ளது. ‘குற்றவாளியாக இருக்கிறான்’ பிரதான பொருளை இயல்பாகத் தருகிறது; மாற்று நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: αἰωνίου ἁμαρτήματος
  choice: நித்திய பாவத்திற்கு
  rationale: வழங்கப்பட்ட SBLGNT உரையில் ἁμαρτήματος என்பது ‘பாவம்’; αἰωνίου என்பது ‘நித்திய’. ἔνοχος உடனான தமிழ்ச் சொற்றொடரில் ‘நித்திய பாவத்திற்குக் குற்றவாளி’ இயல்பான இணைவு. வேறுபட்ட கையெழுத்துப் பிரதிகளின் வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மன்னிக்கப்படாத குற்றத்தின் இயல்பு
  choice: ‘பரிசுத்த ஆவியானவருக்கு எதிராகத் தூஷணம் செய்கிறவன்’ என்ற வசனத்தின் நேரடி சொல்லாக்கமே தக்கவைக்கப்பட்டது.
  alternative: ஆவியானவரின் சாட்சியை வேண்டுமென்றே தொடர்ந்து நிராகரிப்பவன்; அல்லது ஆவியின் செயலைப் பேயின் வல்லமை என்று கூறுபவன்.
  rationale: உடனடியான சூழல் இந்தக் கூற்றை விளக்க உதவினாலும், இந்த வசனம் குற்றத்தை நேரடியாகப் பரிசுத்த ஆவியானவருக்கு எதிரான தூஷணம் என்றே கூறுகிறது. மொழிபெயர்ப்புக்குள் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இறையியல் அழுத்தம் பாதுகாக்கப்பட்டது.
- issue: வசன முடிவிலுள்ள உரை வேறுபாடு
  choice: SBLGNT வாசகத்தின்படி ‘நித்திய பாவம்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: நித்திய நியாயத்தீர்ப்பு; நித்திய தண்டனை.
  rationale: கொடுக்கப்பட்ட மூல உரை αἰωνίου ἁμαρτήματος (‘நித்திய பாவம்’) என்று வாசிக்கிறது. ஆகவே பிரதான உரை அதைப் பின்பற்றுகிறது; அறியப்பட்ட மாற்று வாசகம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தூஷணம்’, ‘பரிசுத்த ஆவியானவர்’, ‘நித்திய பாவம்’ ஆகிய சொற்கள் வசனத்தின் மத மற்றும் இறையியல் கனத்தைப் பாதுகாக்கின்றன. கிரேக்கத்தின் உண்மையான சட்டவியல் நிழற்பொருளும் உரை வேறுபாடும் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
