  text: and to have authority to cast out demons[a].
translation:
  language: ta
  text: மேலும், பேய்களை விரட்டும் அதிகாரம் கொண்டிருக்கவும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய்களை வெளியேற்றும் அதிகாரம் கொண்டிருக்கவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் உள்ள இயேசுவின் நியமன நோக்கங்களோடு இந்த இறுதிக் கூறை இயல்பாக இணைக்கிறது.
- source_word: ἔχειν
  choice: பெற்றிருக்கவும்
  rationale: இயேசு பன்னிருவருக்கு அளிக்கும் நியமனச் சூழலில், அதிகாரம் அவர்களிடம் இருப்பதையும் அது வழங்கப்பட்டதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: வெறும் ஆற்றலைவிட, செயல்படுவதற்கான வழங்கப்பட்ட உரிமையையும் அதிகாரத்தையும் குறிக்கிறது.
- source_word: ἐκβάλλειν
  choice: விரட்ட
  rationale: பேய்களை வெளியேறச் செய்வதைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது; ‘வெளியேற்ற’ என்பதும் சாத்தியம்.
- source_word: τὰ δαιμόνια
  choice: பேய்களை
  rationale: மூலத்தில் உள்ள δαιμόνια என்பதற்கான நேரடியான தமிழ் இணை; அருகிலுள்ள பகுதிகளின் ‘அசுத்த ஆவிகள்’ என்ற வேறு சொல்லாட்சியை இங்கு இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: சீடர்களின் நியமனத்தில் ἐξουσία என்பதன் இயல்பு
  choice: அதிகாரம்
  alternative: வல்லமை
  rationale: இயேசுவால் வழங்கப்பட்டு செயல்படுத்தப்படும் அதிகாரத்தை முன்னிறுத்துகிறது; அதே நேரத்தில் பேய்களை விரட்டும் அசாதாரண செயலின் வல்லமையை மறுப்பதில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். இது மாற்கு 3:14-ல் தொடங்கும் தொடரின் இறுதிக் கூறாக இருப்பதால், ‘மேலும்’ மற்றும் ‘-வும்’ மூலம் முந்தைய நோக்கக் கூறுகளுடன் இணைக்கப்பட்டுள்ளது; முடிவில் உள்ள கோடு வசனம் தனித்து முழு வாக்கியம் அல்ல என்பதை உணர்த்துகிறது.
