  terminology: ‘யாக்கோபு,’ ‘யோவான்,’ ‘செபெதேயு,’ மற்றும் ‘போவனெர்கேஸ்’ ஆகிய பெயர்வடிவங்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. ‘இடியின் மகன்கள்’ என்பது Υἱοὶ Βροντῆς என்பதன் நேரடியான, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு.
