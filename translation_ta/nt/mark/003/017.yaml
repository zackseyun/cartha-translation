  source_fidelity: மூலக் கிரேக்கத்தின் பெயர்கள், உறவுமுறைகள், மற்றும் விளக்க அடைப்புக்குறிச் சொற்றொடர் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ἐπέθηκεν αὐτοῖς ὀνόματα என்பதற்கு ‘அவர்கள் இருவருக்கும் … என்ற பெயரை அவர் சூட்டினார்’ என்பது சூழலுக்கு ஏற்ற இயல்பான மொழிபெயர்ப்பு. பன்மை ὀνόματα பற்றிய தகவலும் அடிக்குறிப்பில் சரியாகப் பதிவு செய்யப்பட்டுள்ளது.
