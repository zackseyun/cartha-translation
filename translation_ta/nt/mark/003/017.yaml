id: MRK.3.17
reference: Mark 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: ta
  text: செபெதேயுவின் மகன் யாக்கோபையும், யாக்கோபின் சகோதரன் யோவானையும் (அவர்கள் இருவருக்கும் “போவனெர்கேஸ்” என்ற பெயரை[a] அவர் சூட்டினார்; அதற்கு “இடியின் மகன்கள்” என்று பொருள்),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘பெயர்கள்’ என்று பன்மையில் உள்ளது; இரு சகோதரர்களுக்கும் பொதுவாகச் சூட்டப்பட்ட ஒரே விளக்கப் பெயரை அது கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: யாக்கோபு
  rationale: Ἰάκωβος என்ற பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம்; வேற்றுமை உருபுடன் ‘யாக்கோபையும்’ என வருகிறது.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: செபெதேயுவின் மகன்
  rationale: கிரேக்க மொழியின் article + genitive அமைப்பில் உள்ள தந்தை–மகன் உறவைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: Ἰωάννην
  choice: யோவான்
  rationale: Ἰωάννης என்ற பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வடிவம்.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: யாக்கோபின் சகோதரன்
  rationale: இங்கு ἀδελφός உடன்பிறந்த சகோதர உறவைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: அவர்கள் இருவருக்கும் … என்ற பெயரை அவர் சூட்டினார்
  rationale: பெயர் சூட்டுதல் என்ற சூழலில் ἐπιτίθημι என்பதன் இயல்பான தமிழ் இணை ‘சூட்டினார்’. αὐτοῖς இருவரையும் குறிப்பதைத் தெளிவுபடுத்த ‘அவர்கள் இருவருக்கும்’ என மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் ὀνόματα பன்மையாக இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: Βοανηργές
  choice: போவனெர்கேஸ்
  rationale: உரையில் அந்நியமொழிப் பெயரும் அதன் விளக்கமும் இரண்டும் இருப்பதால், பெயர் ஒலிபெயர்க்கப்பட்டு அடுத்ததாக அதன் பொருள் தரப்படுகிறது.
- source_word: ὅ ἐστιν
  choice: அதற்கு … என்று பொருள்
  rationale: பெயரின் மொழிபெயர்ப்பை அறிமுகப்படுத்தும் கிரேக்க விளக்கச் சொற்றொடரை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Υἱοὶ Βροντῆς
  choice: இடியின் மகன்கள்
  rationale: உருவகத் தன்மையும் வலிமையும் கொண்ட மூலச் சொற்றொடரை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: யாக்கோபுக்கும் யோவானுக்கும் தரப்பட்ட விளக்கப் பெயரை மொழிபெயர்த்தல்
  choice: ‘போவனெர்கேஸ்’ என்ற ஒலிபெயர்ப்பையும் ‘இடியின் மகன்கள்’ என்ற பொருளையும் சேர்த்தே வைத்தல்
  alternative: ஒலிபெயர்ப்பை நீக்கி, ‘இடியின் மகன்கள்’ என்பதை மட்டும் தருதல்
  rationale: மூல உரையே அந்நியமொழி வடிவத்தையும் அதன் பொருள் விளக்கத்தையும் வழங்குகிறது. இரண்டையும் பாதுகாப்பது உரையின் மொழியியல் தன்மையைச் சுருக்காமல் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையில் அமைக்கப்பட்டது. இது முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘பெயரை’ என்ற சொல்லுக்குப் பின்பு வைக்கப்பட்டுள்ளது.
