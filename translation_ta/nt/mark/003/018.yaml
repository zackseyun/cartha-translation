source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: ta
  text: அந்திரேயா, பிலிப்பு, பர்த்தலோமேயு, மத்தேயு, தோமா, அல்பேயுவின் மகன் யாக்கோபு, ததேயு, கனானேயன்[a] சீமோன் ஆகியோரையும் நியமித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘கனானேயன்.’ இது கானான் நாட்டைச் சேர்ந்தவர் என்பதைக் குறிக்காமல், ‘தீவிரப்பற்றாளர்’ என்று பொருள்படும் அரமேயச் சொல்லைப் பிரதிபலிப்பதாக இருக்கலாம்; லூக்கா 6:15-ஐப் பார்க்கவும்.
    reason: மூலச் சொல்லின் வடிவத்தையும் அதன் சாத்தியமான பொருளையும் வேறுபடுத்திக் காட்டும் சொற்பொருள் விளக்கம்.
lexical_decisions:
- source_word: καὶ
  choice: ஆகியோரையும்
  rationale: கிரேக்கப் பட்டியலில் மீண்டும் மீண்டும் வரும் καὶ என்பதன் இணைப்புப் பண்பையும், முந்தைய வசனத்துடன் தொடரும் பொருளையும் இயல்பான தமிழில் ஒரே பட்டியல் முடிவாக வெளிப்படுத்துகிறது.
- source_word: Ἀνδρέαν
  choice: அந்திரேயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: Φίλιππον
  choice: பிலிப்பு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: Βαρθολομαῖον
  choice: பர்த்தொலொமேயு
  rationale: கிரேக்கப் பெயருக்கு நெருக்கமானதும் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்டதுமான வடிவம்.
- source_word: Μαθθαῖον
  choice: மத்தேயு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: Θωμᾶν
  choice: தோமா
  rationale: தமிழில் பாரம்பரியமாகவும் பரவலாகவும் அறியப்படும் பெயர் வடிவம்.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: அல்பேயுவின் மகன் யாக்கோபு
  rationale: ὁ τοῦ Ἁλφαίου என்ற தந்தைவழி அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Θαδδαῖον
  choice: ததேயு
  rationale: தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவம்.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: கனானேயன் என அழைக்கப்பட்ட சீமோன்
  rationale: மாற்குவின் Καναναῖος என்ற வடிவத்தை நேரடியாகப் பாதுகாத்து, அதை கானான் நாட்டைச் சேர்ந்தவர் என்ற இனவழிப் பெயராகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க அடிக்குறிப்பை இணைக்கிறது.
theological_decisions:
- issue: சீமோனுக்கான Καναναῖος என்ற அடைமொழியின் பொருள்
  choice: மூல வடிவத்தை ‘கனானேயன்’ என்று ஒலிபெயர்த்து, சாத்தியமான ‘தீவிரப்பற்றாளர்’ பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘தீவிரப்பற்றாளரான சீமோன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: Κανανaῖος என்பது அரமேயப் பின்னணியில் ‘தீவிரப்பற்றாளர்’ என்று பொருள்பட வாய்ப்புள்ளது; லூக்கா 6:15-இன் ζηλωτής அதற்கு ஆதரவளிக்கிறது. எனினும் மாற்குவின் தனித்த கிரேக்க வடிவத்தை முதன்மை உரையில் காக்குவது உண்மையான சொற்பொருள் சிக்கலை மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டது. இந்த வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சி என்பதால், தமிழில் முழுமையான வாசிப்பிற்காக ‘நியமித்தார்’ என்ற முன்சூழல் வினை மீட்டுக் கூறப்பட்டது.
