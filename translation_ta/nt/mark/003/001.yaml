  register: நவீனத் தரத் தமிழில் எளிய, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இரண்டு இணை வாக்கியங்கள் தமிழில் இயல்பாக இரண்டு வாக்கியங்களாகத் தரப்பட்டுள்ளன. மரியாதைப் பன்மை வினைமுற்றுகள் இயேசுவுக்கும் அறிமுகப்படுத்தப்படும் மனிதருக்கும் இயல்பான தமிழ் வழக்கின்படி பயன்படுத்தப்பட்டுள்ளன.
