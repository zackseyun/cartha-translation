  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: ta
  text: அவர் மீண்டும் ஒரு ஜெப ஆலயத்துக்குள் சென்றார்.[a] கை சூம்பிப்போன ஒரு மனிதர் அங்கே இருந்தார்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, உடனுள்ள சூழலில் ஏற்கெனவே அறியப்பட்ட குறிப்பிட்ட ஜெப ஆலயத்தை மாற்கு கருதியிருந்தால், “அந்த ஜெப ஆலயத்துக்குள்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “கை சுருங்கிப்போன” அல்லது “கை வற்றிப்போன.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அங்கே சூம்பிப்போன கையுள்ள ஒரு மனிதர் இருந்தார்.”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: சென்றார்
  rationale: εἰς என்பதோடு வரும் இயக்கத்தின் பொருளை ‘ஜெபக்கூடத்துக்குள் சென்றார்’ என்று இயல்பான தமிழில் தெரிவிக்கிறது; ‘நுழைந்தார்’ என்பதைக் காட்டிலும் கதைநடையில் இயல்பாக உள்ளது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு நிகழ்ந்த செயல் மறுபடியும் நிகழ்வதை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: εἰς συναγωγήν
  choice: ஒரு ஜெபக்கூடத்துக்குள்
  rationale: εἰς என்பதன் இயக்கப் பொருளை ‘-க்குள்’ காக்கிறது. συναγωγήν என்பதில் கிரேக்கக் குறிப்புச் சுட்டு இல்லாததால் ‘ஒரு’ என மொழிபெயர்க்கப்பட்டுள்ளது; குறிப்பிட்ட ஜெபக்கூடத்தைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ἦν ἐκεῖ
  choice: அங்கே இருந்தார்
  rationale: ἐκεῖ என்பதன் இடப்பொருளையும் ἦν என்பதன் இருப்புப் பொருளையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆண் நபரை அறிமுகப்படுத்துகிறது. ‘மனிதர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மதிப்புடனும் உள்ளது.
- source_word: ἐξηραμμένην
  choice: சூம்பிப்போன
  rationale: ξηραίνω என்பதன் நிறைவுற்ற பங்கேற்புவினை, கை வற்றி அல்லது செயலிழந்து சுருங்கிய நிலைக்கு வந்திருப்பதையும் அந்த நிலை தொடர்வதையும் குறிக்கிறது. ‘சூம்பிப்போன’ என்பது தமிழில் இந்த உடல் நிலையைக் குறிக்கும் இயல்பான சொல்.
- source_word: ἔχων τὴν χεῖρα
  choice: கை சூம்பிப்போன
  rationale: கிரேக்கத்தின் ‘சூம்பிப்போன கையை உடையவர்’ என்ற அமைப்பை மரத்துப் போன நடையின்றி, இயல்பான தமிழ்ப் பெயரெச்சத் தொடராக மாற்றுகிறது.
