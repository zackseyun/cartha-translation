  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: ta
  text: '“உண்மையாக உங்களுக்குச் சொல்கிறேன்: மனிதர்களின் மகன்களுக்கு[a] எல்லாப் பாவங்களும், அவர்கள் எவ்வகையான இறைநிந்தனைகளைச் செய்தாலும் அவையும், மன்னிக்கப்படும்;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக, “மனிதர்களின் மகன்களுக்கு”; இது மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கும் சொற்றொடர்.
    reason: மூலச் சொற்றொடரின் நேரடி வடிவத்தையும் அதன் உள்ளடக்கிய பொதுப்பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் ஆணித்தரமான அறிமுகக் கூற்றை நவீனத் தமிழில் இயல்பாகவும் மாண்புடனும் வெளிப்படுத்துகிறது; ‘ஆமென்’ என ஒலிபெயர்ப்பதைவிட இதன் உரையாடல் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: πάντα ἀφεθήσεται
  choice: எல்லாப் பாவங்களும் மன்னிக்கப்படும் … அவையும் மன்னிக்கப்படும்
  rationale: πάντα என்பதன் விரிவான அளவையும் ἀφεθήσεται என்ற எதிர்காலச் செயப்பாட்டு வடிவத்தின் மன்னிப்பு அர்த்தத்தையும் காக்கிறது. தமிழில் தெளிவுக்காக வினை இரண்டாம் கூறிலும் மீளக் கூறப்பட்டுள்ளது.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: மனித மக்களுக்கு
  rationale: கிரேக்கத்தின் செமித்தியப் பாணியிலான சொற்றொடரை ஓரளவு வடிவோடு காக்கும் அதே நேரத்தில், தமிழில் மனிதகுலத்தைக் குறிக்கும் பொதுப்பொருளையும் தருகிறது. நேரடியான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τὰ ἁμαρτήματα
  choice: பாவங்கள்
  rationale: இங்கு தனித்தனியான பாவச் செயல்களைக் குறிக்கும் பொதுவான பன்மைச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: αἱ βλασφημίαι … βλασφημήσωσιν
  choice: எவ்வகையான இறைநிந்தனைகளைக் கூறினாலும்
  rationale: ἐάν உடனான துணைநிலையின் வரையறுக்கப்படாத விரிவை ‘எவ்வகையான … கூறினாலும்’ வெளிப்படுத்துகிறது. உடனுள்ள பரிசுத்த ஆவியைப் பற்றிய சூழலில் βλασφημία என்பதன் சமயத் தீவிரத்தை ‘இறைநிந்தனை’ காக்கிறது.
theological_decisions:
- issue: அடுத்த வசனத்தில் வரும் பரிசுத்த ஆவிக்கு எதிரான இறைநிந்தனை பற்றிய எச்சரிக்கையுடன் இவ்வசனத்தின் மன்னிப்பு அறிவிப்புக்கு உள்ள தொடர்பு
  choice: இவ்வசனம் கூறும் மன்னிப்பின் விரிவை எந்த மறைமுக விதிவிலக்கும் சேர்க்காமல் அப்படியே மொழிபெயர்த்தல்
  alternative: அடுத்த வசனத்தின் விதிவிலக்கை இவ்வசனத்திலேயே உட்பொருளாகச் சேர்த்தல்
  rationale: இவ்வசனம் முதலில் மன்னிப்பின் பரந்த அளவை அறிவிக்கிறது; அடுத்த வசனமே விதிவிலக்கைச் சொல்கிறது. அந்த வரிசையையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்த்துவிடக் கூடாது.
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων என்ற பொதுவான ஆண்பால் வடிவம்
  choice: முதன்மை உரையில் ‘மனித மக்கள்’ என்று வடிவத்தையும் பொதுமனிதப் பொருளையும் இணைத்துக் காட்டி, அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘மனிதர்கள்’ அல்லது ‘மக்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: மூலத்தின் ‘மகன்கள்’ கூறை முற்றிலும் மறைக்காமல், நவீனத் தமிழில் இச்சொற்றொடர் ஆண்களை மட்டும் குறிக்கவில்லை என்பதையும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மாண்பான நடை. ஆணித்தரமான தொடக்கமும் மன்னிப்பின் பரந்த அறிவிப்பும் காக்கப்பட்டுள்ளன. வசன முடிவிலுள்ள நிறுத்தக்குறி, அடுத்த வசனத்துடன் தொடரும் வாக்கிய ஓட்டத்தைத் துண்டிக்காமல் மேற்கோளுக்குள் நிறைவு தருகிறது.
