source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: ta
  text: பரிசேயர்கள் வெளியே வந்தவுடன், ஏரோதியர்களோடு சேர்ந்து அவருக்கு எதிராக ஆலோசனை செய்தார்கள்; அவரை எப்படித் அழித்துவிடலாம் என்பதே அவர்களுடைய நோக்கமாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சூழலில், “அவரைக் கொல்லலாம்” அல்லது “அவரை மரணத்துக்கு உட்படுத்தலாம்” என்றும் வெளிப்படையாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: வெளியே போனதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. முந்தைய ஜெபக்கூடச் சூழலிலிருந்து அவர்கள் வெளியேறியதையும் தமிழில் இயல்பான கதைநடையில் தெரிவிக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் கதைநடையில் காணப்படும் அவசரத்தையும் உடனடித்தன்மையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ஏரோதியர்களோடு சேர்ந்து
  rationale: μετά என்பதன் கூட்டுறவுப் பொருளைத் தெளிவாகத் தருகிறது. Ἡρῳδιανοί என்ற குழுப்பெயர் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: συμβούλιον ἐδίδουν
  choice: திட்டமிடத் தொடங்கினார்கள்
  rationale: συμβούλιον διδόναι என்பது ஆலோசித்து முடிவெடுப்பதைக் குறிக்கும் மரபுத்தொடர். பகைமை நோக்கமுள்ள இச்சூழலில் ‘திட்டமிட’ என்பது சூழற்பொருளைத் தெளிவாக்குகிறது; தொடர்நிலை இறந்தகாலமான ἐδίδουν செயலின் தொடக்கத்தையும் தொடர்ச்சியையும் சுட்டுவதால் ‘தொடங்கினார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: κατ’ αὐτοῦ
  choice: அவருக்கு எதிராக
  rationale: κατά இங்கு வெறும் ‘அவரைக் குறித்து’ என்பதல்ல, பகைமை சார்ந்த எதிர்ப்பைக் குறிக்கிறது.
- source_word: ὅπως
  choice: எப்படி
  rationale: பின்வரும் நோக்கத்தைத் தமிழின் இயல்பான ‘எப்படி …லாம் என்று’ என்ற ஆலோசனை அமைப்பில் தருகிறது; இதனால் நோக்கமும் செயல்முறையைப் பற்றிய கலந்தாலோசனையும் ஒன்றாக வெளிப்படுகின்றன.
- source_word: ἀπολέσωσιν
  choice: அவரை அழித்துவிடலாம்
  rationale: ἀπόλλυμι என்பதன் ‘அழித்தல்/ஒழித்தல்’ என்ற பரந்த பொருளை முதன்மை உரையில் காக்கிறது. இச்சூழலில் கொலை நோக்கம் வலுவாக இருந்தாலும், அதை மட்டும் முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தெளிவாக்குகிறது.
theological_decisions:
- issue: தலைவர்களின் நோக்கம் கொலை செய்வதே என்று முதன்மை உரையில் வெளிப்படையாகக் கூற வேண்டுமா?
  choice: பரந்த பொருளுடைய ‘அவரை அழித்துவிடலாம்’ என்பதை முதன்மை உரையில் வைத்தல்.
  alternative: ‘அவரைக் கொல்லலாம்’ அல்லது ‘அவரைக் கொலை செய்யலாம்’.
  rationale: ἀπόλλυμι என்பது அழித்தல், ஒழித்தல், உயிரைப் போக்குதல் ஆகிய பொருட்களைச் சூழலுக்கேற்ப ஏற்கக்கூடியது. இங்கு உயிரைப் போக்கும் நோக்கம் தெளிவாகச் சுட்டப்பட்டாலும், கிரேக்கச் சொல்லின் பரப்பை முதன்மை உரை காக்கிறது; அதிக வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசேயர்கள்’, ‘ஏரோதியர்கள்’ ஆகியவை பரவலாக அறியப்பட்ட குழுப்பெயர்களின் தமிழ் வடிவங்கள். கிரேக்கத்தின் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், உடனடித்தன்மை, கூட்டுச் சதி, பகைமை நோக்கம் ஆகியவை தெளிவாகத் தெரியுமாறு தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
