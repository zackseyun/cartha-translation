  to: பரிசேயர்கள் வெளியே வந்தவுடன், ஏரோதியர்களோடு சேர்ந்து அவருக்கு எதிராக ஆலோசனை செய்தார்கள்; அவரை எப்படித் அழித்துவிடலாம் என்பதே அவர்களுடைய நோக்கமாக இருந்தது.[a]
