source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: ta
  text: அவர் மலையின்மேல் ஏறி, அவர் தாமே விரும்பியவர்களைத் தம்மிடம் அழைத்தார்; அவர்கள் அவரிடம் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: ஏறி
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடைக்கு ஏற்ற வினையெச்சமாக்குகிறது; மேல்நோக்கிய இயக்கத்தையும் காக்கிறது.
- source_word: εἰς τὸ ὄρος
  choice: மலையின்மேல்
  rationale: ἀναβαίνει என்பதுடன் இணைந்து மலையின்மேல் ஏறிச் சென்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: προσκαλεῖται
  choice: தம்மிடம் அழைத்தார்
  rationale: மத்திய வினையின் தனிப்பட்ட ஈடுபாட்டையும், அழைக்கப்பட்டவர்கள் இயேசுவிடம் வருமாறு அழைக்கப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὓς ἤθελεν αὐτός
  choice: தாம் விரும்பியவர்களை
  rationale: θέλω என்பதற்கு இயல்பான ‘விரும்பிய’ என்பதையும், வெளிப்படையாக உள்ள αὐτός-இன் வலியுறுத்தலை மரியாதைத் தற்சுட்டுப்பெயரான ‘தாம்’ மூலமும் காக்கிறது.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: அவர்கள் அவரிடம் சென்றார்கள்
  rationale: ἀπέρχομαι என்பதன் ‘செல்’ என்ற இயக்கத்தைத் தெளிவாகக் காத்து, πρὸς αὐτόν குறிக்கும் இலக்கையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அழைக்கப்பட்டவர்களை இயேசு தாமே விரும்பித் தேர்ந்தெடுத்தார் என்ற வலியுறுத்தல்
  choice: தாம் விரும்பியவர்களை
  alternative: அவர் விரும்பியவர்களை
  rationale: αὐτός இயேசுவின் சொந்த முன்முயற்சியை வலியுறுத்துகிறது. ‘தாம்’ அந்த வலியுறுத்தலைக் காக்கிறது; ஆனால் இவ்வசனத்திற்கு அப்பாற்பட்ட ஒரு குறிப்பிட்ட தேர்ந்தெடுத்தல் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான கதைநடை. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் வரலாற்று நிகழ்காலம் தமிழில் இயல்பான இறந்தகாலத் தொடராக வழங்கப்பட்டுள்ளது.
