source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: ta
  text: 'அவர் அவர்களைத் தம்மிடம் அழைத்து, உவமைகளால் அவர்களிடம் பேசினார்: “சாத்தான் சாத்தானை எப்படி விரட்ட முடியும்?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: அவர்களைத் தம்மிடம் அழைத்து
  rationale: இறந்தகால வினையெச்சம், இயேசு முதலில் அவர்களைத் தம்மிடம் அழைத்த பின்பு பேசிய நிகழ்வின் வரிசையைக் காட்டுகிறது; நடுத்தர வினை வடிவத்தின் இயல்பான பொருளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளால்
  rationale: சினாப்டிக் நற்செய்திகளில் παραβολή பொதுவாக ஒப்புமை அல்லது எடுத்துக்காட்டுச் சொல்லைக் குறிக்கிறது. பன்மையின் கருத்தைத் தக்கவைத்து, பேசும் முறையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἔλεγεν
  choice: பேசினார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை வடிவம் நீடித்த உரையைக் காட்டலாம். ஆனால் இவ்விடத்தில் இயல்பான தமிழ் கதைநடையில் ‘பேசினார்’ அந்த உரையாடலைத் தெளிவாகக் குறிக்கிறது; தொடர்ச்சியைச் செயற்கையாக மிகைப்படுத்தவில்லை.
- source_word: Πῶς δύναται
  choice: எப்படி … முடியும்?
  rationale: சாத்தியத்தைக் கேள்விக்குள்ளாக்கும் வினாவை இயல்பான நவீன தமிழில் சொல்லி, அதன் சொல்லாட்சிசார் வினா வலிமையைப் பாதுகாக்கிறது.
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: பெயர்/பட்டத்தைத் தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவத்தில் வழங்குகிறது; எழுவாய் மற்றும் செயப்படுபொருள் ஆகிய இரு இடங்களிலும் அதே வடிவம் இயல்பாக அமைகிறது.
- source_word: ἐκβάλλειν
  choice: விரட்ட
  rationale: மாற்கு நற்செய்தியின் பேயோட்டும் சூழலில் ἐκβάλλω என்பது வெளியேற்றுதல் அல்லது விரட்டுதல் என்பதைக் குறிக்கிறது. ‘விரட்ட’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் அந்தச் செயலைக் காட்டுகிறது.
theological_decisions:
- issue: சாத்தான் தனக்கு எதிராகச் செயல்படுவது பற்றிய இயேசுவின் கேள்வியின் வலிமை
  choice: “சாத்தான் சாத்தானை எப்படி விரட்ட முடியும்?” என்ற இயலாமையை உணர்த்தும் சொல்லாட்சிசார் வினா
  alternative: “சாத்தானால் சாத்தானை விரட்ட இயலுமா?”
  rationale: கிரேக்கம் சாத்தியத்தைப் பற்றிக் கேட்கிறது. சூழலில் குற்றச்சாட்டின் முரண்பாட்டை இயேசு வெளிப்படுத்துகிறார்; ஆனால் அந்த விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் வினாவின் வலிமையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் இயல்பான, கண்ணியமான கதைநடை. ‘தம்மிடம்’ என்பது இயேசுவையே திரும்பச் சுட்டும் மரியாதைமிக்க வடிவம். அடிக்குறிப்புகள் தேவையில்லை.
