  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: ta
  text: மேலும், ஒரு வீடு தனக்குள்ளேயே பிளவுபட்டால்[a], அந்த வீடு நிலைத்து நிற்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு’ என்பதற்குப் பதிலாக ‘குடும்பம்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் ‘நிலைத்து நிற்க’ என்ற உடனடியான உருவகம் ‘வீடு’ என்பதற்குச் சாதகமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: வீடு
  rationale: οἰκία என்பதன் முதன்மையான பொருள் ‘வீடு’. ‘நிலைத்து நிற்க’ என்ற உருவகம் கட்டடத்தையும் அதனுடன் தொடர்புடைய சமூக ஒற்றுமையையும் சுட்டுவதால், தமிழிலும் ‘வீடு’ இயல்பாக உள்ளது; ‘குடும்பம்’ என்பதும் சாத்தியம்.
- source_word: ἐφ’ ἑαυτὴν
  choice: தனக்கு எதிராகத் தானே
  rationale: இந்தச் சொற்றொடர் உள்ளார்ந்த எதிர்ப்பைக் குறிக்கிறது. ‘தனக்கு எதிராகத் தானே’ என்பது அந்தத் தற்சுட்டுப் பொருளையும் உள்பிளவையும் தெளிவாகத் தருகிறது.
- source_word: μερισθῇ
  choice: பிளவுபட்டால்
  rationale: இறந்தகாலப் passive subjunctive வடிவம் ἐὰν உடன் பொதுவான நிபந்தனையைத் தெரிவிக்கிறது. ‘பிளவுபட்டால்’ என்பது செயப்பாட்டு நுணுக்கத்தையும் உள்முறிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δυνήσεται
  choice: முடியாது
  rationale: οὐ உடன் வரும் எதிர்கால இயல்திறனை, தமிழில் ‘முடியாது’ சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: σταθῆναι
  choice: நிலைத்து நிற்க
  rationale: இது சொற்பொருளில் நிற்பதையும் உருவகமாகத் தொடர்ந்து நிலைப்பதையும் குறிக்கலாம். ‘நிலைத்து நிற்க’ இரு நுணுக்கங்களையும் தமிழில் தக்கவைக்கிறது.
- source_word: ἡ οἰκία ἐκείνη
  choice: அந்த வீடு
  rationale: ἐκείνη தரும் சுட்டு வலியுறுத்தலை ‘அந்த’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: καὶ ἐὰν
  choice: ஒரு … -ஆல்
  rationale: καί முந்தைய எடுத்துக்காட்டுடன் இதை இணைக்கிறது; தனி வசனத் தமிழில் நிபந்தனைத் தொடரை ‘ஒரு … பிளவுபட்டால்’ என்று தொடங்குவது இயல்பானது. தொடர்ச்சிச் சூழலில் இதன் இணைப்பு கருத்தால் தக்கவைக்கப்படுகிறது.
