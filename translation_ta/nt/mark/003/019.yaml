  edition: SBLGNT
  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: ta
  text: அவரைக் காட்டிக்கொடுத்த யூதாஸ் இஸ்கரியோத்தையும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை ஒப்படைத்தான்” அல்லது “அவரைப் பிடித்துக்கொடுத்தான்.” கிரேக்க வினை பொதுவாக ஒருவரை மற்றவர்களிடம் ஒப்படைப்பதைக் குறிக்கலாம்; இங்கு யூதாஸ் இயேசுவுக்குச் செய்த செயல் துரோகமாக இருப்பதால் “காட்டிக்கொடுத்தான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ Ἰούδαν
  choice: யூதாஸ் … ஐயும்
  rationale: καί பட்டியலின் முந்தைய பெயர்களோடு இறுதிப் பெயரை இணைக்கிறது; Ἰούδαν வேற்றுமை வடிவத்தைத் தமிழில் ‘-ஐயும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰσκαριώθ
  choice: இஸ்கரியோத்து
  rationale: சூழலில் சொற்பிறப்பு உறுதியற்ற பெயரடை/அடைப்பெயராக இருப்பதால், ஊகப் பொருள் கொடுக்காமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὃς καὶ
  choice: இவன்தான்
  rationale: யூதாஸைச் சுட்டும் உறவுப்பெயரையும், தொடர்ந்து வரும் அடையாளச் செயலுக்கு καί தரும் வலியுறுத்தலையும் இயல்பான தமிழில் இணைத்து வெளிப்படுத்துகிறது.
- source_word: παρέδωκεν
  choice: காட்டிக்கொடுத்தான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘ஒப்படைத்தான்’ என்பதாக இருக்கலாம்; ஆனால் யூதாஸ் இயேசுவிடம் செய்த செயலைக் குறிக்கும் இச்சூழலில் ‘காட்டிக்கொடுத்தான்’ என்பது துரோகத்தின் உட்பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள்; தமிழின் மரியாதை ஒருமைக்கு ஏற்ப ‘அவரை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: யூதாஸ் இயேசுவிடம் செய்த செயலைக் குறிக்கும் παραδίδωμι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுத்தான்
  alternative: ஒப்படைத்தான் / பிடித்துக்கொடுத்தான்
  rationale: கிரேக்க வினை தனித்து ‘ஒப்படைத்தல்’ என்று பொருள்பட முடியும். இங்கு யூதாஸ் செய்பவனாக இருப்பதால் துரோகச் சூழல் தெளிவாக உள்ளது; ‘காட்டிக்கொடுத்தான்’ அந்தக் கதையியல் மற்றும் அறநெறி நிறையைத் தமிழில் தெரிவிக்கிறது. அதேவேளையில், வினையின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் இலக்கணத் தொடர்ச்சியை ‘-ஐயும்’ மூலம் காத்து, பின்னுள்ள விளக்கத்தை நீண்ட கோட்டால் தெளிவுபடுத்துகிறது. மொழிநடை இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமாக வைக்கப்பட்டுள்ளது.
