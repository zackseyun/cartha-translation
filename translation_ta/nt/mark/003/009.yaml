  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: ta
  text: மக்கள் கூட்டம் தம்மை நெருக்காதபடி[a], தமக்காக ஒரு சிறிய படகு ஆயத்தமாக இருக்க வேண்டும் என்று அவர் தமது சீடர்களிடம் சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை அழுத்தாதபடி.” கிரேக்க வினை அழுத்துதல், நெருக்குதல், அல்லது அழுத்தத்தால் நசுக்குதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: மறைமுகக் கூற்றுடன் இயல்பாக அமையும் நவீனத் தமிழ் வினை; மூலத்தின் எளிய சொற்பொருளையும் காக்கிறது.
- source_word: μαθηταῖς
  choice: சீடர்களிடம்
  rationale: நற்செய்தி நூல்களில் ஆசிரியரைப் பின்பற்றிக் கற்கிறவர்களைக் குறிக்கும் நிலையான, பொருத்தமான தமிழ் சொல்.
- source_word: πλοιάριον
  choice: ஒரு சிறிய படகு
  rationale: πλοιάριον என்பதிலுள்ள சிறுமை நுணுக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: προσκαρτερῇ
  choice: ஆயத்தமாக இருக்க வேண்டும்
  rationale: படகு தொடர்ந்து உடனடிப் பயன்பாட்டுக்குத் தயாராக இருக்க வேண்டும் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: αὐτῷ
  choice: தமக்காக
  rationale: இயேசுவின் பயன்பாட்டுக்காகப் படகு தயாராக இருப்பதைத் தமிழில் இயல்பாகக் குறிக்கிறது; எழுவாயைத் திரும்பக் குறிக்கும் மரியாதைத் தற்சுட்டுப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: διὰ τὸν ὄχλον
  choice: மக்கள் கூட்டத்தினால்
  rationale: διά + வேற்றுமை வடிவம் இங்கு காரணத்தைக் குறிப்பதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: θλίβωσιν
  choice: நெருக்கிவிடாதபடி
  rationale: மக்கள் உடல்ரீதியாக அழுத்தி நெருக்குவதை இயல்பாகக் குறிக்கிறது; வினையின் அழுத்துதல் அல்லது நசுக்குதல் என்ற பொருள் வரம்பை அடிக்குறிப்பு காக்கிறது.
