  source_fidelity: மூல கிரேக்கத்தின் «πολλὰ ἐπετίμα» என்பதிலுள்ள மீள்முறை/வலியுறுத்தல் நன்கு «பலமுறை கடுமையாக எச்சரித்தார்» எனத் தரப்பட்டுள்ளது. «αὐτοῖς» உடனடியான சூழலில் உள்ள அசுத்த ஆவிகளையே குறிக்கிறது; தமிழில் வினையின் செயப்படுபொருளாக «அவர்களைப்» என்பது இயல்பான மாற்றம். «ἵνα μὴ αὐτὸν φανερὸν ποιήσωσιν» என்பதன் ‘அவரை வெளிப்படையாக அறியச் செய்யாதிருத்தல்’ என்னும் பொருளை «தம்மை வெளிப்படுத்த வேண்டாம்» துல்லியமாகக் காக்கிறது.
  naturalness: வாக்கியம் நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. «தம்மை» என்பது வாக்கிய எழுவாயான அவரையே திரும்பச் சுட்டுவதால் தெளிவாக உள்ளது; «அவர்களைப் பலமுறை கடுமையாக எச்சரித்தார்» என்ற சொல் வரிசையும் இயல்பானது.
  terminology: «கடுமையாக எச்சரித்தார்» ἐπετίμα என்பதன் வலுவான தடையிடும் தொனியைப் பொருத்தமாகத் தருகிறது; தேவையற்ற வகையில் ‘கடிந்துகொண்டார்’ அல்லது குறிப்பிட்ட அடையாள அறிக்கையைச் சேர்ப்பதில்லை. «வெளிப்படுத்த» மற்றும் அடிக்குறியில் உள்ள «அறியப்படுத்த», «பகிரங்கப்படுத்த» ஆகியவை φανερὸν ποιέω-வின் பொருள் எல்லைக்குள் உள்ளன.
