  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: ta
  text: தம்மை வெளிப்படுத்த வேண்டாம் என்று அவர் அவர்களைப் பலமுறை கடுமையாக எச்சரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்மை அறியப்படுத்த வேண்டாம்,” “தம்மைப் பகிரங்கப்படுத்த வேண்டாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: பலமுறை
  rationale: ἐπετίμα என்பதுடன் வினையடையாக வந்து, எச்சரிக்கை மீண்டும் மீண்டும் அல்லது வலியுறுத்திச் சொல்லப்பட்டதைக் குறிக்கிறது. நவீனத் தமிழில் ‘பலமுறை’ என்பது இயல்பாக உள்ளது.
- source_word: ἐπετίμα
  choice: கடுமையாக எச்சரித்தார்
  rationale: அசுத்த ஆவிகளுக்குக் கொடுக்கப்பட்ட வலுவான தடையுத்தரவின் தன்மையை இது தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘கடிந்துகொண்டார்’ என்பதைக் காட்டிலும் இச்சூழலில் எச்சரிக்கை/கட்டளை அம்சத்தை நன்கு தருகிறது.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: உடனடியான முன்சூழலில் குறிப்பிடப்பட்ட அசுத்த ஆவிகளைக் குறிக்கும் பன்மைப் பிரதிப்பெயர்.
- source_word: ἵνα μὴ
  choice: வேண்டாம் என்று
  rationale: எச்சரிக்கையின் உள்ளடக்கமாகிய தடையை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: தம்மை வெளிப்படுத்த
  rationale: φανερὸν ποιέω என்பதன் ‘அறியப்படச் செய்தல்/வெளிப்படச் செய்தல்’ என்ற பொருளைத் தருகிறது. ‘தம்மை’ என்பது வாக்கியத்தின் எழுவாயாகிய இயேசுவையே திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: அசுத்த ஆவிகளுக்கு இயேசு கொடுத்த கட்டளையின் தன்மை
  choice: இயேசுவை வெளிப்படுத்த வேண்டாம் என்ற தடையாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: அவர் தேவனுடைய மகன் என்பதை வெளிப்படுத்த வேண்டாம் என்று குறிப்பாக விரிவாக்குதல்; அல்லது அடையாள வெளிப்பாட்டை வலியுறுத்தாத பொதுவான மௌனக் கட்டளையாகக் கொடுத்தல்.
  rationale: உடனடியான சூழல் இயேசுவின் அடையாளம் வெளிப்படுவதைச் சுட்டினாலும், இவ்வசனம் ‘அவரை வெளிப்படுத்துதல்’ என்பதற்கு மேல் எதையும் வெளிப்படையாகச் சொல்லவில்லை. ஆகவே கிறிஸ்துவியல் விளக்கம் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பலமுறை’ மீளச்செயலைக் காட்டுகிறது; ‘கடுமையாக எச்சரித்தார்’ மூலத்தின் வலுவான கட்டளைத் தொனியைப் பாதுகாக்கிறது. அடிக்குறி குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
