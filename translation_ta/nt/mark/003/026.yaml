  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: ta
  text: சாத்தான் தனக்கு எதிராகத் தானே எழுந்து, தனக்குள்ளேயே பிளவுபட்டிருந்தால், அவனால் நிலைத்திருக்க முடியாது; ஆனால் அவனுக்கு முடிவு உண்டு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: தமிழில் வழக்கமாகப் பயன்படும் இப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: தனக்கு எதிராகத் தானே எழுந்து
  rationale: இங்கு ἀνέστη என்பது வெறுமனே எழுந்து நிற்பதை அல்ல, எதிர்த்து எழுவதைக் குறிக்கிறது; ἐφ’ ἑαυτόν அந்த எதிர்ப்பு அவனுக்கே எதிரானது என்பதைத் தெரிவிக்கிறது.
- source_word: ἐμερίσθη
  choice: தனக்குள்ளேயே பிளவுபட்டிருந்தால்
  rationale: செயப்பாட்டு வடிவம் சாத்தானுடைய ஆட்சிக்குள் ஏற்பட்ட உட்பிளவையும் அதன் விளைவான நிலையையும் காட்டுகிறது.
- source_word: οὐ δύναται στῆναι
  choice: அவனால் நிலைத்திருக்க முடியாது
  rationale: στῆναι என்பதன் உருவகப் பொருளான தொடர்ந்து நிலைபெற்றிருத்தல் அல்லது நீடித்திருத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλὰ τέλος ἔχει
  choice: மாறாக, அவனுக்கு முடிவு வந்துவிட்டது
  rationale: சொல்லர்த்தமாக ‘முடிவை உடையவன்’ என்றிருந்தாலும், பிரிவுற்ற சாத்தானின் ஆட்சி இனி நீடிக்காது என்ற சூழல்சார் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சாத்தானின் முடிவைப் பற்றிய கூற்றின் தன்மை
  choice: இதை இயேசுவின் நிபந்தனை சார்ந்த தர்க்கத்தின் விளைவாக மொழிபெயர்த்தல்
  alternative: சாத்தானின் இறுதிக்காலத் தோல்வியைப் பற்றிய தனித்த, முழுமையான அறிவிப்பாக விரிவுபடுத்துதல்
  rationale: இந்த வசனம் சாத்தான் தனக்கு எதிராகப் பிளவுபட்டால் அவனுடைய ஆட்சி நிலைக்க முடியாது என்ற தர்க்கத்தை முன்வைக்கிறது. உடனடிச் சூழல் கூறுவதைவிட அதிகமான இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நிலைத்திருக்க’ என்பது சூழலின் உருவகத் தன்மையைப் பாதுகாக்கிறது; ‘தனக்குள்ளேயே’ உட்பிளவைத் தெளிவுபடுத்துகிறது.
