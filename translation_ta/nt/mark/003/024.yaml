review_pass:
  verdict: revise
  source_fidelity: The conditional form, the internal-opposition sense of ἐφ’ ἑαυτὴν, the passive division, and the inability expressed by οὐ δύναται are all retained. The repeated reference to ‘that kingdom’ is also preserved.
  naturalness: The draft is clear, but ‘தனக்கு எதிராகத் தானே பிளவுபட்டால்’ is somewhat overemphatic and less idiomatic than necessary in modern standard Tamil. ‘தனக்கு எதிராகப் பிளவுபட்டால்’ naturally conveys the reflexive ‘against itself.’ Separating ‘நிலைத்து நிற்க’ is standard orthography and improves readability.
  terminology: ‘ராஜ்யம்’ is an appropriate established term for βασιλεία in this political-social analogy. No doctrinal expansion is introduced.
  issues:
  - severity: low
    issue: Reflexive expression is overly emphatic
    rationale: The Greek reflexive establishes that the kingdom is opposed to itself, but does not require the Tamil intensifier ‘தானே.’ Removing it preserves the meaning with more natural phrasing.
  - severity: low
    issue: Compound verb spacing
    rationale: ‘நிலைத்து நிற்க’ is the clearer standard written form for the metaphorical sense of remaining established.
  revised_text: ஒரு ராஜ்யம் தனக்கு எதிராகப் பிளவுபட்டால், அந்த ராஜ்யம் நிலைத்து நிற்க முடியாது.
  revised_footnotes: []
  revision_rationale: The revision makes only stylistic and orthographic adjustments. It retains the source’s conditional proverb, internal conflict, and the metaphor of a kingdom’s inability to stand, without adding interpretive or theological content.
