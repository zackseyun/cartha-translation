id: MRK.3.24
reference: Mark 3:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: ta
  text: ஒரு ராஜ்யம் தனக்கு எதிராகப் பிளவுபட்டால், அந்த ராஜ்யம் நிலைத்து நிற்க முடியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (தனி மொழிபெயர்ப்பு வாக்கியத்தில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது முந்தைய வாதத்துடன் இணைக்கும் தொடுப்புச்சொல். தனி வசனமாக இயல்பான நவீன தமிழில் ‘மேலும்’ என்று தொடங்குவது தேவையற்றதாகத் தோன்றுவதால், கருத்துத் தொடர்பை வாக்கிய ஓட்டமே தாங்குகிறது.
- source_word: ἐὰν
  choice: -ஆல்
  rationale: உபநிபந்தனையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; இங்கு பொதுவான கோட்பாட்டைச் சொல்லும் நிபந்தனை வடிவத்திற்குப் பொருந்துகிறது.
- source_word: βασιλεία
  choice: ராஜ்யம்
  rationale: இங்கு ஆட்சி என்ற அருவமான பொருளைவிட, ஓர் அரசியல்-சமூக அமைப்பாகிய நாட்டுருவகமே முன்னிலையில் உள்ளது. ‘ராஜ்யம்’ வேதாகமத் தமிழில் பரிச்சயமானதும் நவீன வாசகருக்குப் புரியக்கூடியதுமாகும்.
- source_word: ἐφ’ ἑαυτὴν
  choice: தனக்கு எதிராகத் தானே
  rationale: உள்ளார்ந்த எதிர்ப்பைத் துல்லியமாக வெளிப்படுத்துகிறது; கிரேக்கத்தின் தற்சுட்டுப் பொருளையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: μερισθῇ
  choice: பிளவுபட்டால்
  rationale: μερίζω என்பதன் செயப்பாட்டு நிபந்தனைப் பொருளைக் காக்கிறது; பிரிவுக்குக் காரணமானவர் யார் என்பதை உரை கூறாததால் அதைப் புகுத்தவில்லை.
- source_word: οὐ δύναται
  choice: முடியாது
  rationale: இயலாமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: σταθῆναι
  choice: நிலைத்துநிற்க
  rationale: ‘நிற்றல்’ என்ற உருவகத்தையும் தொடர்ந்து நிலைபெற்றிருத்தல் என்ற சூழற்பொருளையும் ஒருங்கே காக்கிறது.
- source_word: ἡ βασιλεία ἐκείνη
  choice: அந்த ராஜ்யம்
  rationale: பெயர்ச்சொல்லை மீண்டும் கூறும் கிரேக்க அமைப்பையும் சுட்டுச் சொல்லின் சொல்லாட்சிச் செறிவையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: கூற்றின் தன்மை
  choice: இயேசுவின் வாதத்தில் இடம்பெறும் பொதுக் கோட்பாடாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: எல்லா அரசியல் அமைப்புகளுக்கும் பொருந்தும் விரிவான சமூக-அரசியல் பழமொழியாக விளக்குவது.
  rationale: இந்த வசனம் இயேசுவின் மறுப்புவாதத்தில் ஓர் ஒப்புமையாகச் செயல்படுகிறது. உரை கூறாத சாத்தான் குறித்தோ அரசியல் அமைப்புகள் குறித்தோ விரிவான கோட்பாடு எதுவும் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும், கண்ணியமான நடையுடன், கிரேக்க வாக்கியத்தின் நிபந்தனை அமைப்பும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை.
