  text: καὶ λέγει τῷ ἀνθρώπῳ τῷ ⸂τὴν χεῖρα ἔχοντι ξηράν⸃· ⸀Ἔγειρε εἰς τὸ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: ta
  text: அவர் கை சூம்பிய அந்த மனிதரிடம், “எழுந்து நடுவே வா” என்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்காலத்தால் தக்கவைக்கிறது.
- source_word: ἀνθρώπῳ
  choice: மனிதரிடம்
  rationale: சூழலில் குறிப்பிட்ட ஓர் ஆணைக் குறிக்கிறது; மரியாதையான நவீனத் தமிழ் நடைக்கு ‘மனிதரிடம்’ இயல்பானது.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: கை சூம்பியிருந்த
  rationale: கையின் செயலிழந்த, உலர்ந்து சுருங்கிய நிலையை மிகைப்படுத்தாமல் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: Ἔγειρε
  choice: எழுந்து
  rationale: ἐγείρω என்ற கட்டளையின் ‘எழு/எழுந்திரு’ என்ற நேரடியான பொருளைத் தருகிறது; அடுத்துள்ள நகர்வுடன் இயல்பாக இணைகிறது.
- source_word: εἰς τὸ μέσον
  choice: நடுவே வா
  rationale: ‘நடுவிற்குள்’ என்ற இடநகர்வை இயல்பான தமிழ்க் கட்டளையாகத் தருகிறது; வெறுமனே எழுந்து நிற்பதைவிட மையத்துக்கு வருவதை வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் கதைநடை. கிரேக்க வரலாற்று நிகழ்காலம் தக்கவைக்கப்பட்டுள்ளது. வசனத்தின் தொடக்கத்தில் உள்ள καί, தமிழ் தொடர்கதையோட்டத்துக்கு இயல்பாக ‘அப்போது’ என வழங்கப்பட்டுள்ளது.
