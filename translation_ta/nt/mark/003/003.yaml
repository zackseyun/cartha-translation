revisions:
- from: அப்போது அவர், கை சூம்பியிருந்த அந்த மனிதரிடம், “எழுந்து நடுவே வா” என்கிறார்.
  to: அவர் கை சூம்பிய அந்த மனிதரிடம், “எழுந்து நடுவே வா” என்கிறார்.
  rationale: Removed the added temporal sense of “அப்போது” while preserving the historical present, the affected hand, and the command to move into the middle. The revised wording remains natural modern Tamil and closely reflects the Greek.
