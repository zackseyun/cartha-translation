  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலம் ‘கேட்கிறார்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது; கிரேக்கத்தின் இயல்பற்ற சொற்சொல் அமைப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
