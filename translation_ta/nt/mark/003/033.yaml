  text: καὶ ⸂ἀποκριθεὶς αὐτοῖς λέγει⸃· Τίς ἐστιν ἡ μήτηρ μου ⸀ἢ οἱ ἀδελφοί ⸀μου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: ta
  text: அவர்களுக்குப் பதிலளித்து[a], அவர், “என் தாயும் என் சகோதரர்களும் யார்?” என்று கேட்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்சொல்லாக, “அவர்களுக்குப் பதிலளித்து, அவர் சொல்கிறார்” என்று உள்ளது; இதில் வினையெச்சமும் வரலாற்று நிகழ்காலமும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொற்றொடரின் வடிவம், “என் தாய் யார், அல்லது என் சகோதரர்கள் [யார்]?” என்பதற்கு நெருக்கமானது. ஒருமை வினைச்சொல் முதலில் வரும் “தாய்” என்பதுடன் உடன்படுகிறது.
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: மறுமொழியாக
  rationale: இது ἀποκρίνομαι என்பதன் வினையெச்ச வடிவம். தமிழில் இயல்பாக இருக்கும்படியும், அடுத்து வரும் நிகழ்காலச் சொல்லுடன் அதன் தொடர்பு வெளிப்படும்படியும் ‘மறுமொழியாக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இது இயேசுவின் மறுமொழி யாரை நோக்கியது என்பதைச் சுட்டும் பன்மை வேற்றுமைப் பெயர்ச்சொல்.
- source_word: λέγει
  choice: கேட்கிறார்
  rationale: λέγει என்பதன் அடிப்படைப் பொருள் ‘சொல்கிறார்’ என்றாலும், இங்கு நேரடியாக ஒரு கேள்வி வருவதால் தமிழில் ‘என்று கேட்கிறார்’ என்பது இயல்பானது. கிரேக்கத்தின் வரலாற்று நிகழ்காலமும் நிகழ்கால வடிவில் பாதுகாக்கப்படுகிறது.
- source_word: Τίς
  choice: யார்
  rationale: ஒருவரின் அடையாளத்தை வினவும் நேரடியான, இயல்பான தமிழ் வினாப்பெயர்.
- source_word: μήτηρ
  choice: தாய்
  rationale: குடும்ப உறவைக் குறிக்கும் தரமான, கண்ணியமான நவீனத் தமிழ் சொல்.
- source_word: ἢ
  choice: -உம் … -உம்
  rationale: கிரேக்கத்தில் ‘அல்லது’ உள்ளது; ஆனால் ஒரே கேள்விக்குள் இரு உறவுக் குழுக்களையும் இணைத்துக் கேட்கும் தமிழின் இயல்பான அமைப்பாக இணைப்பும்மை பயன்படுத்தப்பட்டுள்ளது. மூல அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: இச்சொல் இலக்கண ரீதியாக ஆண்பால் பன்மை; உடனடிச் சூழலிலும் இயேசுவின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது. ஆகவே ‘சகோதர சகோதரிகள்’ அல்லது ‘உடன்பிறந்தவர்கள்’ என்று விரிவாக்கப்படவில்லை.
theological_decisions:
- issue: ἀδελφοί என்ற குடும்ப உறவுச் சொல்லின் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / உடன்பிறந்தவர்கள்
  rationale: ஆண்பால் பன்மையை அப்படியே பாதுகாப்பது மூலத்தின் குறிப்பைத் துல்லியமாகக் காட்டுகிறது; இயேசுவின் குடும்பத்தைப் பற்றிய எந்தச் சமயப்பிரிவு சார்ந்த விளக்கத்தையும் மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை.
- issue: தாய் மற்றும் சகோதரர்கள் பற்றிய கேள்வியின் இலக்கண அமைப்பு
  choice: என் தாயும் என் சகோதரர்களும் யார்?
  alternative: என் தாய் யார், அல்லது என் சகோதரர்கள் யார்?
  rationale: கிரேக்கத்தில் வினைச்சொல் முதலில் வரும் ஒருமைப் பெயர்ச்சொல்லுடன் உடன்பட்டு ஒருமையில் உள்ளது; ἢ இரண்டாவது உறுப்பை அறிமுகப்படுத்துகிறது. அதைச் சொற்சொல்லாகத் தமிழில் மீட்டால் செயற்கையாக ஒலிக்கும். இயல்பான பன்மைக் கேள்வி கருத்தைத் தெளிவாகத் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
