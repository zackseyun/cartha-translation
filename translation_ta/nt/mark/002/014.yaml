id: MRK.2.14
reference: Mark 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: ta
  text: அவர் அவ்வழியே சென்றுகொண்டிருந்தபோது, வரி வசூல் சாவடியில்[a] அமர்ந்திருந்த அல்பேயுவின் மகன் லேவியைக் கண்டார். அவரிடம், “என்னைப் பின்பற்று” என்று கூறுகிறார். லேவி எழுந்து அவரைப் பின்பற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுங்க வசூல் சாவடியில்.” கிரேக்கச் சொல் வரிகளோ சுங்கக் கட்டணங்களோ வசூலிக்கப்பட்ட இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: அவர் அவ்வழியே சென்றுகொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த பின்னணிச் செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் நிறைவுறாத தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் இறந்தகால வடிவை நேரடியாக மொழிபெயர்க்கிறது; ‘கவனித்தார்’ என்ற கூடுதல் விளக்கநுட்பத்தைச் சேர்க்கவில்லை.
- source_word: Λευὶν
  choice: லேவியை
  rationale: தனிப்பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: அல்பேயுவின் மகன்
  rationale: கிரேக்க உரையில் மறைமுகமாக உள்ள தந்தை–மகன் உறவைத் தமிழில் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: καθήμενον
  choice: அமர்ந்திருந்த
  rationale: இயேசு அவரைக் கண்ட சமயத்தில் லேவியின் தொடர்ந்த நிலையை இயல்பாகக் குறிக்கிறது.
- source_word: ἐπὶ τὸ τελώνιον
  choice: வரி வசூல் சாவடியில்
  rationale: τελώνιον என்பது வரி அல்லது சுங்கக் கட்டணம் வசூலிக்கப்பட்ட இடத்தைக் குறிக்கிறது; ‘சாவடி’ என்பது இடத்தின் தன்மையைத் தெளிவாகக் காட்டும் தற்போதைய தமிழ் சொல்.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, காட்சியின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்று
  rationale: கட்டளையை நேரடியாக வழங்கி, மூலத்தில் இல்லாத ‘வா’ போன்ற சொல்லைச் சேர்க்காமல் தொடர்ந்த சீடத்துவ அழைப்பையும் தக்கவைக்கிறது.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் வரிசைப்படுத்துகிறது.
- source_word: ἠκολούθησεν αὐτῷ
  choice: அவரைப் பின்பற்றினார்
  rationale: இயேசுவின் கட்டளைக்கும் லேவியின் பதிலுக்கும் இடையிலான சொல்லியல் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மாற்குவின் வரலாற்று நிகழ்காலம்
  choice: λέγει என்பதை ‘கூறுகிறார்’ என்று நிகழ்காலத்தில் வைத்தல்
  alternative: சுற்றியுள்ள இறந்தகால வினைகளோடு ஒத்திசைத்து ‘கூறினார்’ என மொழிபெயர்த்தல்
  rationale: இது கோட்பாட்டைத் தீர்மானிக்கும் விஷயம் அல்ல; மூலத்தின் கதைசொல்லும் உயிரோட்டத்தையும் அதன் காலமாற்றத்தையும் பாதுகாக்கும் தேர்வு.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் மட்டும் மூலத்தின் கதைநடையைப் பாதுகாப்பதற்காகத் திட்டமிட்டு வைக்கப்பட்டுள்ளது.
