source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: ta
  text: யாரும் புதிய திராட்சரசத்தைப் பழைய தோற்பைகளில் ஊற்றி வைப்பதில்லை. அப்படி வைத்தால், திராட்சரசம் தோற்பைகளைக் கிழித்துவிடும்; திராட்சரசம் வீணாகும்[a], தோற்பைகளும் பாழாகும். மாறாக, புதிய திராட்சரசம் புதுத் தோற்பைகளுக்கு உரியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சரசம் இழக்கப்படும்.”
    reason: ἀπόλλυται என்பதற்கு இச்சூழலில் ‘வீணாகும்,’ ‘இழக்கப்படும்’ ஆகிய இரு பொருள் நிழல்களும் இருக்கலாம்.
  - marker: b
    text: கிரேக்கத்தில், “புதிய தோற்பைகள்.” இங்குள்ள καινούς என்பது பழையவற்றுக்கு மாறாகப் புதிய அல்லது பயன்படுத்தப்படாத நிலையில் உள்ள தோற்பைகளைக் குறிக்கிறது.
    reason: καινούς என்பதன் தரநிலை சார்ந்த நுணுக்கத்தை விளக்குகிறது; தமிழில் νέον மற்றும் καινούς இரண்டிற்கும் இயல்பாக ‘புதிய’ பயன்படுத்தப்படுகிறது.
lexical_decisions:
- source_word: βάλλει
  choice: ஊற்றி வைப்பதில்லை
  rationale: திரவத்தைத் தோற்பைகளில் இடும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்க வினை பொதுவான ‘இடுதல்’ என்ற பொருளுடையதாயினும், இச்சூழலில் ‘ஊற்றி வைப்பது’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: οἶνον νέον
  choice: புதிய திராட்சரசம்
  rationale: அண்மையில் தயாரிக்கப்பட்டு இன்னும் நொதித்துக்கொண்டிருக்கும் திராட்சரசம் என்ற உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἀσκούς
  choice: தோற்பைகள்
  rationale: திராட்சரசத்தை வைக்கப் பயன்படுத்தப்பட்ட விலங்குத்தோல் பைகளைச் சுருக்கமாகவும் வரலாற்றுப் படிமத்தைப் பாதுகாக்கும் வகையிலும் குறிக்கிறது.
- source_word: παλαιούς
  choice: பழைய
  rationale: சொல்லின் நேரடிப் பொருளைக் காத்து, இறுதியிலுள்ள καινούς என்பதுடனான எதிர்மறை ஒப்புமையை வெளிப்படுத்துகிறது; ‘தேய்ந்துபோன’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: ῥήξει
  choice: கிழித்துவிடும்
  rationale: நொதிப்பினால் உண்டாகும் அழுத்தம் பழைய தோற்பைகளைப் பிளக்கும் விளைவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπόλλυται
  choice: வீணாகும்
  rationale: திராட்சரசம் பயன்படுத்த முடியாமல் இழக்கப்படுவதை நவீன தமிழில் தெளிவாகச் சொல்கிறது; ‘அழிந்துபோகும்’ என்பதைக் காட்டிலும் இச்சூழலுக்கு இயல்பானது.
- source_word: καινούς
  choice: புதுத்
  rationale: καινός குறிக்கும் புதிய அல்லது பயன்படுத்தப்படாத தரநிலையைத் தெரிவிக்கிறது. தமிழில் νέος மற்றும் καινός இரண்டிற்கும் ‘புதிய’ இயல்பானதால், வேறுபாட்டின் நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: மாறாக, புதிய திராட்சரசம் புதுத் தோற்பைகளுக்கே உரியது
  rationale: கிரேக்கத்தில் வினைச்சொல் விடுபட்டுள்ள சுருக்கமான பழமொழி நடையைப் பாதுகாத்து, வெளிப்படையாக இல்லாத கட்டளை அல்லது கடமைப் பொருளைச் சேர்க்காமல் பொதுக் கோட்பாடாக வழங்குகிறது.
theological_decisions:
- issue: இறுதியில் வினைச்சொல் விடுபட்டுள்ள சொற்றொடரின் தன்மை
  choice: ‘புதிய திராட்சரசம் புதுத் தோற்பைகளுக்கே உரியது’ என்ற பொதுக் கோட்பாடாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘புதிய திராட்சரசத்தைப் புதுத் தோற்பைகளில் ஊற்றி வைக்க வேண்டும்’ அல்லது ‘ஒருவர் புதிய திராட்சரசத்தைப் புதுத் தோற்பைகளில் ஊற்றி வைப்பார்.’
  rationale: மூல கிரேக்க இறுதித் தொடரில் வெளிப்படையான வினைச்சொல் இல்லை. ஆகவே கட்டளை அல்லது கடமைப் பொருளைச் சேர்க்காமல் அதன் சுருக்கமான பழமொழித் தன்மையும் உண்மையான இலக்கணத் திறப்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட பழமொழி நடை பயன்படுத்தப்பட்டுள்ளது. ‘தோற்பைகள்’ என்ற சொல் வரலாற்றுப் படிமத்தைப் பாதுகாக்கிறது. தொடக்கத்தில் உள்ள ‘யாரும் ... இல்லை’ அமைப்பும், நடுவிலுள்ள விளைவு வரிசையும், இறுதியிலுள்ள சுருக்கமான எதிர்மறை ஒப்புமையும் மூலத்தின் அமைப்புக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
