id: MRK.2.17
reference: Mark 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ta
  text: 'இயேசு அதைக் கேட்டபோது அவர்களிடம் கூறுகிறார்: “வலிமையுள்ளவர்களுக்கு[a] மருத்துவர் தேவையில்லை; நோயுற்றவர்களுக்கே மருத்துவர் தேவை. நீதிமான்களை[b] அழைக்க அல்ல, பாவிகளையே அழைக்க நான் வந்தேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோக்கியமானவர்களுக்கு” அல்லது “நலமாக இருப்பவர்களுக்கு”; கிரேக்கச் சொல் வலிமையாக அல்லது நலமாக இருப்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சூழலில், “நீதிமான்கள்” என்பது நீதிமான்களாகக் கருதப்படுகிறவர்களையோ தங்களை நீதிமான்களாகக் கருதுகிறவர்களையோ நையாண்டியாகக் குறிக்கலாம்; கிரேக்க உரை நேரடியாக “நீதிமான்கள்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: இயேசு அதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்பெயரை இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக்குகிறது. கிரேக்கத்தில் மறைந்துள்ள செயப்படுபொருள் உடனடிச் சூழலிலிருந்து ‘அதை’ என வழங்கப்படுகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, நிகழ்ச்சியின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: οἱ ἰσχύοντες
  choice: வலிமையுள்ளவர்கள்
  rationale: ‘வலிமையுடையவர்களாக/நலமாக இருப்பவர்கள்’ என்ற அடிப்படைச் சொல்லுணர்வைப் பாதுகாக்கிறது; மருத்துவ உருவகத்தில் ‘ஆரோக்கியமானவர்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἰατροῦ
  choice: மருத்துவர்
  rationale: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ள மருத்துவச் சொல்.
- source_word: οἱ κακῶς ἔχοντες
  choice: நோயுற்றவர்கள்
  rationale: சொல்லுக்கு சொல் ‘மோசமான நிலையில் இருப்பவர்கள்’ என்றாலும், மருத்துவச் சூழலில் நோயுற்றவர்களைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: καλέσαι
  choice: அழைக்க
  rationale: அழைப்பு, வரவழைப்பு ஆகிய பரந்த பொருளைத் தக்கவைத்து, சீடத்துவ அழைப்பை அளவுக்கு மீறி விளக்குவதில்லை.
- source_word: δικαίους
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடையின் அறநெறி மற்றும் சமய வகைப்பாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἁμαρτωλούς
  choice: பாவிகள்
  rationale: நற்செய்திச் சூழலில் நிலையான அறநெறி-சமயப் பெயர்ப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நீதிமான்கள்’ என்பது நேர்பொருளா அல்லது மறைமுக நையாண்டியா
  choice: முதன்மை உரையில் ‘நீதிமான்கள்’ என நேரடியாக வைக்கப்பட்டது
  alternative: ‘தங்களை நீதிமான்களாகக் கருதுகிறவர்கள்’
  rationale: சூழலில் நையாண்டிப் பொருள் கேட்கக்கூடும்; ஆனால் கிரேக்க உரை ‘நீதிமான்கள்’ என்றே கூறுவதால், அந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் மாற்று வாசிப்பு சுட்டப்படுகிறது.
- issue: ἰσχύοντες என்பதன் மருத்துவ உருவகப் பொருள்
  choice: வலிமையுள்ளவர்கள்
  alternative: ஆரோக்கியமானவர்கள் / நலமாக இருப்பவர்கள்
  rationale: மூலச் சொல்லின் வலிமை அல்லது நலநிலை என்ற பரப்பை முதன்மை உரை பாதுகாக்கிறது; மருத்துவச் சூழல் தரும் இயல்பான பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ‘அழைக்க’ என்ற வினையின் நோக்கம்
  choice: அழைக்க
  alternative: வரவழைக்க / அழைப்புவிடுக்க
  rationale: மனந்திரும்புதலை வெளிப்படையாகச் சேர்க்கும் சில உரைமரபுகளைப் பின்பற்றாமல், SBLGNT உரையில் உள்ள பொதுவான அழைப்புச் சொல்லை மட்டும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. மாற்குவின் வரலாற்று நிகழ்காலம் ‘கூறுகிறார்’ எனத் தக்கவைக்கப்பட்டது. பழமையான ‘வைத்தியன்’ என்பதற்குப் பதில் இயல்பான ‘மருத்துவர்’ பயன்படுத்தப்பட்டது; உண்மையான சொற்பொருள் மற்றும் இறையியல் தெளிவின்மை அடிக்குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டது.
