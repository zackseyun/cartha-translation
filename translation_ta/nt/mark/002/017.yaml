review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the historical present in λέγει (‘கூறுகிறார்’), preserves the implicit object of ἀκούσας appropriately as ‘அதைக்,’ and retains the literal ‘வலிமையுள்ளவர்கள்’ with a suitable lexical footnote. The final contrast is clearer and closer in Tamil when both infinitival objects are expressed within the single purpose clause: Jesus came not to call the righteous but sinners.'
  naturalness: The Tamil is modern and dignified. Repeating ‘மருத்துவர்’ in the second half of the medical proverb avoids a slightly abrupt elliptical ‘தேவை’ and reads naturally. Recasting the final sentence as one contrastive purpose statement is smoother and avoids dividing one Greek construction into two independent Tamil assertions.
  terminology: ‘மருத்துவர்,’ ‘நீதிமான்கள்,’ and ‘பாவிகள்’ are appropriate established terms in modern standard Tamil. The footnotes responsibly preserve both the lexical range of ἰσχύοντες and the possible contextual irony of δικαίους without imposing either reading on the main text.
  issues:
  - severity: low
    issue: 'The final Greek contrast is split into two Tamil clauses: ‘நீதிமான்களை அழைக்க நான் வரவில்லை; பாவிகளையே அழைக்க வந்தேன்.’'
    rationale: This is substantively understandable, but a single contrastive purpose construction more directly reflects οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ἁμαρτωλούς and is more idiomatic Tamil.
  - severity: low
    issue: The second member of the physician saying leaves ‘மருத்துவர்’ implicit.
    rationale: The Greek likewise leaves the noun implicit, but explicitly repeating it in Tamil improves immediate clarity without adding meaning.
