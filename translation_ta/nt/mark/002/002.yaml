source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: ta
  text: 'பலர் ஒன்றுகூடினர்; அதனால் வாசலருகில்கூட இடமில்லாமல் போனது. அவர் அவர்களிடம் வார்த்தையை[a] பேசிக்கொண்டிருந்தார்.


    [a] “செய்தியை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கில் “வார்த்தை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செய்தியை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கில் “வார்த்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: ஒன்றுகூடினார்கள்
  rationale: இறந்தகாலச் செயலும் மக்கள் ஒரே இடத்தில் கூடிவந்த பொருளும் இயல்பான நவீனத் தமிழில் வெளிப்படுகின்றன. கிரேக்கச் செயலப்பாட்டு வடிவத்தைத் தமிழில் சொற்சொல்லாகப் பின்பற்றுவது செயற்கையாக இருக்கும்.
- source_word: πολλοὶ
  choice: மக்கள் பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை மனிதர்களைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘மக்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ὥστε
  choice: அதனால்
  rationale: மக்கள் கூடிவந்ததன் விளைவாக இடம் இல்லாமல் போனது என்ற விளைவு உறவை இயல்பாகக் காட்டுகிறது.
- source_word: μηκέτι χωρεῖν
  choice: இடமில்லாமல் போனது
  rationale: முன்பு இருந்த இடம் முழுவதும் நிரம்பிவிட்டது என்ற μηκέτι மற்றும் χωρεῖν ஆகியவற்றின் கூட்டு உணர்வைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: வாசலருகில்கூட
  rationale: வாசலை நோக்கிய அல்லது வாசலுக்கு அருகிலுள்ள பகுதியில்கூட இடமில்லை என்ற கிரேக்க மரபுத்தொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐλάλει
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: இம்பர்ஃபெக்ட் வினையின் தொடர்ச்சியான செயற்பாட்டை ‘கொண்டிருந்தார்’ வடிவம் வெளிப்படுத்துகிறது; ‘பிரசங்கித்தார்’ என்பதுபோன்ற கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
- source_word: τὸν λόγον
  choice: வார்த்தையை
  rationale: λόγος என்பதன் நேரடியான சொல் தொடர்பைத் தக்கவைத்துக் கொண்டு, அது இயேசு அறிவித்த செய்தியைக் குறிக்கலாம் என்ற பொருள் திறந்தநிலையில் விடப்படுகிறது.
theological_decisions:
- issue: இயேசு சொன்ன τὸν λόγον என்பதன் பொருள்
  choice: வார்த்தையை
  alternative: செய்தியை; இறைவார்த்தையை
  rationale: மூலத்தில் உள்ள λόγος என்ற சொல்லை வெளிப்படையாகப் பிரதிபலிக்கிறது. ‘செய்தி’ என்பது பொருத்தமான பொருள் மாற்று என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ‘இறைவார்த்தை’ என்பது இந்த வசனத்தில் வெளிப்படையாக இல்லாத ‘இறை’ என்ற குறிப்பைச் சேர்க்கும் என்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடை. தொடர்ச்சியான செயலைத் தமிழின் ‘சொல்லிக்கொண்டிருந்தார்’ வடிவம் காக்கிறது; தேவையற்ற சமயத் தனிச்சொற்கள் சேர்க்கப்படவில்லை.
