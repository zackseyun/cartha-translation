  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: ta
  text: ஆனால், மறைநூல் அறிஞர்களில் சிலர் அங்கே உட்கார்ந்துகொண்டு, தங்கள் இதயங்களில் இவ்வாறு சிந்தித்துக்கொண்டிருந்தார்கள்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுக்குள் சிந்தித்துக்கொண்டிருந்தார்கள்,” அல்லது “தங்கள் மனங்களில் ஆராய்ந்துகொண்டிருந்தார்கள்.” கிரேக்க மூலத்தில் சொல்லுக்குச் சொல், “தங்கள் இதயங்களில்” என்று உள்ளது; இது உள்ளார்ந்த சிந்தனையைக் குறிக்கும் வேதாகமச் சொல்வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ஆனால் ... இருந்தார்கள்
  rationale: δέ இங்கு காட்சியின் கவனத்தை வேறொரு குழுவினரின் உள்ளார்ந்த எதிர்வினைக்குத் திருப்பும் மிதமான முரண்பாட்டைக் காட்டுகிறது; ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τινες τῶν γραμματέων
  choice: மறைநூல் அறிஞர்களில் சிலர்
  rationale: τινες உடன் வரும் பகுதி-முழுமை வேற்றுமை உருபு, அந்தக் குழுவில் சிலரை மட்டும் குறிக்கிறது. γραμματεῖς என்போர் இச்சூழலில் மறைநூலை நகலெடுப்பவர்கள் மட்டுமல்ல, அதை அறிந்து விளக்கிய அறிஞர்களும் ஆவர்.
- source_word: ἐκεῖ καθήμενοι
  choice: அங்கே உட்கார்ந்துகொண்டு
  rationale: இடத்தையும் அப்போது தொடர்ந்திருந்த உடல் நிலையையும் இயல்பான தமிழ் நடையில் காக்கிறது.
- source_word: διαλογιζόμενοι
  choice: சிந்தித்துக்கொண்டிருந்தார்கள்
  rationale: இந்த நடுவினை வடிவம் உள்ளார்ந்த ஆலோசனை அல்லது காரணமாய்ச் சிந்தித்தலைக் குறிக்கிறது. அடுத்த வசனத்தில் அதன் உள்ளடக்கம் தரப்படுவதால், இயல்பான தமிழில் ‘சிந்தித்துக்கொண்டிருந்தார்கள்’ பொருத்தமானது.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: தங்கள் இதயங்களில்
  rationale: உள்ளார்ந்த சிந்தனையின் இடமாக ‘இதயம்’ என்பதைக் காட்டும் வேதாகமச் சொல்வழக்கை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: καρδίαις குறிக்கும் மனித உள்ளத்தின் சொல்வழக்கு
  choice: தங்கள் இதயங்களில்
  alternative: தங்களுக்குள் / தங்கள் மனங்களில்
  rationale: மூலத்தின் மனிதவியல் படிமத்தைப் பாதுகாத்து, இதயம் மற்றும் மனம் பற்றிய நவீன பிரிவை உரைக்குள் திணிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மறைநூல் அறிஞர்கள்’ என்பது வரலாற்றுச் செயல்பாட்டைத் தெளிவாக்குகிறது; ‘இதயங்களில்’ என்பது மூலப் படிமத்தைக் காக்கிறது. அடுத்த வசனத்தில் சிந்தனையின் சொற்கள் வருவதால் ‘இவ்வாறு’ மற்றும் இரட்டைப்புள்ளி பயன்படுத்தப்பட்டுள்ளன.
