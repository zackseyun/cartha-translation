id: MRK.2.12
reference: Mark 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: ta
  text: அவன் எழுந்து, உடனே படுக்கைப் பாயை எடுத்துக்கொண்டு, எல்லாருக்கும் முன்பாக வெளியே சென்றான். அதனால் எல்லாரும் திகைத்துப்போய், “இப்படிப்பட்ட ஒன்றை நாங்கள் ஒருபோதும் கண்டதில்லை”[a] என்று சொல்லி, கடவுளை மகிமைப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இவ்வாறு நாங்கள் ஒருபோதும் கண்டதில்லை.” இந்தக் கிரேக்கச் சொல்லாட்சி, இப்படிப்பட்ட ஒன்று அவர்களுக்கு இதுவரை நிகழ்ந்திராதது என்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: அவன் எழுந்து
  rationale: இங்கு முடக்குவாதமுற்ற மனிதன் இயேசுவின் கட்டளைக்குக் கீழ்ப்படிந்து உடலளவில் எழுவதையே உடனடி சூழல் குறிக்கிறது. கிரேக்க வடிவத்தின் உயிர்த்தெழுதல் சார்ந்த சாத்தியமான ஒலிப்பைத் தமிழில் தேவையின்றி முன்னிறுத்தாமல், இயல்பாக மொழிபெயர்க்கிறது.
- source_word: εὐθύς
  choice: உடனே
  rationale: மாற்குவின் வேகமான கதைநடையையும் செயல் உடனடியாக நிகழ்ந்ததையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἄρας τὸν κράβαττον
  choice: படுக்கைப் பாயை எடுத்துக்கொண்டு
  rationale: κράβαττος என்பது முழுமையான கட்டிலைவிட எளிய படுக்கைப் பாய் அல்லது மெத்தையைக் குறிக்கிறது; எடுத்துக்கொண்டு என்பது அதைத் தூக்கிச் சுமந்து சென்ற செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔμπροσθεν πάντων
  choice: எல்லாருக்கும் முன்பாக
  rationale: குணமாக்குதல் அனைவரும் காணும் வகையில் வெளிப்படையாக நிகழ்ந்தது என்ற பொருளைப் பேணுகிறது.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: அதனால் எல்லாரும் திகைத்துப்போய்
  rationale: ἐξίστημι குறிக்கும் ஆழ்ந்த வியப்பையும் திகைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δοξάζειν τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்தினார்கள்
  rationale: δοξάζω என்பதன் கடவுளுக்குரிய மகிமையை ஒப்புக்கொண்டு வெளிப்படுத்தும் பொருளைப் பேணும் வழக்கமான வேதாகமத் தமிழ்.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: இப்படிப்பட்ட ஒன்றை நாங்கள் ஒருபோதும் கண்டதில்லை
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், அவர்கள் இதுவரை இப்படியொரு நிகழ்வைக் கண்டதே இல்லை என்ற கிரேக்க மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ἠγέρθη என்பதில் இருக்கக்கூடிய உயிர்த்தெழுதல் சார்ந்த ஒலிப்பு
  choice: உடனடி குணமாக்குதல் சூழலுக்கேற்ப ‘அவன் எழுந்து’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: அவன் எழுப்பப்பட்டான்
  rationale: ἐγείρω வேறு சூழல்களில் உயிர்த்தெழுதலைக் குறிக்கக்கூடும். ஆனால் இங்கு குணமடைந்த மனிதன் எழுந்து தனது பாயை எடுத்துச் செல்கிறான்; ஆகவே உயிர்த்தெழுதல் கருத்தை வசனத்திற்குள் தேவையின்றி கொண்டு வராமல், உடலளவில் எழுந்த செயலைத் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘படுக்கைப் பாய்’ எளிய உறங்கும் படுக்கையைத் துல்லியமாகக் குறிக்கிறது; ‘திகைத்துப்போய்’ கூட்டத்தின் தீவிர வியப்பைப் பேணுகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் இறுதி மேற்கோளுக்குப் பின் வைக்கப்பட்டுள்ளது.
