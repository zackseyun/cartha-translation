source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: ta
  text: உடனே இயேசு, அவர்கள் தங்களுக்குள் இவ்வாறு சிந்தித்துக்கொண்டிருப்பதைத் தம் ஆவியில் உணர்ந்து[a], அவர்களிடம், “நீங்கள் ஏன் உங்கள் இதயங்களில் இவற்றைக் குறித்து சிந்திக்கிறீர்கள்?” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் ஆவியில் அறிந்து,” அல்லது “தமக்குள் கண்டுணர்ந்து.” இயேசு இதை எந்த விதத்தில் உணர்ந்தார் என்பதை கிரேக்க வாசகம் வெளிப்படையாக வரையறுப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் விரைவான கதைநடையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ἐπιγνοὺς
  choice: உணர்ந்து
  rationale: தெளிவாக அறிதல் அல்லது கண்டுணர்தல் என்ற பொருளைத் தருகிறது; இயேசு அறிந்த விதத்தைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: தமது ஆவியில்
  rationale: கிரேக்கச் சொல்லமைப்பை நெருக்கமாகப் பிரதிபலித்து, இது உள்ளார்ந்த மனித ஆவியைக் குறிக்கிறதா அல்லது ஆவிக்குரிய உணர்தலைக் குறிக்கிறதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: அவர்களுடைய சிந்தனையின் விதத்தைக் குறிக்கும் இயல்பான, தெளிவான தமிழ் வடிவம்.
- source_word: διαλογίζονται / διαλογίζεσθε
  choice: சிந்தித்துக்கொண்டிருப்பதை / சிந்திக்கிறீர்கள்
  rationale: இங்கு பேச்சுவழி விவாதத்தைவிட உள்ளார்ந்த சிந்தனை முன்னிலைப்படுவதால், அறிவுசார் பரிசீலனையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἑαυτοῖς
  choice: தங்களுக்குள்
  rationale: அவர்கள் வெளிப்படையாகப் பேசாமல் தங்களுக்குள் எண்ணியதைச் சூழலுக்கேற்ற வகையில் தெரிவிக்கிறது.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: நீங்கள் ஏன் ... இவற்றைக் குறித்து சிந்திக்கிறீர்கள்?
  rationale: இக்கேள்வியில் τί காரணத்தை விசாரிப்பதால், தமிழில் இயல்பாக ‘ஏன்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ταῦτα என்பது ‘இவற்றைக் குறித்து’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் இதயங்களில்
  rationale: எண்ணங்களும் நோக்கங்களும் அடங்கிய உள்ளான மனிதரைச் சுட்டும் வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தமது ஆவியில் உணர்ந்து’ என்பதில் இயேசுவின் அறிவின் இயல்பு
  choice: அவர்கள் உள்ளார்ந்து சிந்தித்ததை இயேசு உணர்ந்தார் என்று கூறி, ‘தமது ஆவியில்’ என்ற சொற்றொடரைத் தக்கவைத்தல்.
  alternative: இதைத் தெய்வீக சர்வஞானத்தின் வெளிப்பாடு என்று மட்டும் அல்லது மனித உள்ளுணர்வு என்று மட்டும் தெளிவுபடுத்துதல்.
  rationale: வசனம் இயேசு அவர்களுடைய உள்ளார்ந்த சிந்தனையை அறிந்தார் என்பதைத் தெளிவுபடுத்துகிறது; ஆனால் அந்த அறிவின் துல்லியமான செயல்முறையை கிரேக்கம் வரையறுப்பதில்லை. எனவே இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயங்களில்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டுள்ளது; ‘தமது ஆவியில்’ என்பது மூலத்தின் இறையியல் தெளிவின்மையைப் பாதுகாக்கிறது.
