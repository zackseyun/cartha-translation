  to: 'ஆனால், மானிடமகனுக்கு[a] பூமியில் பாவங்களை மன்னிக்க அதிகாரம் உண்டு என்பதை நீங்கள் அறிந்துகொள்ளும்படி— என்று பக்கவாதத்தால் முடங்கியவரிடம்[b] அவர் சொல்கிறார்:'
