id: MRK.2.10
reference: Mark 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: ta
  text: 'ஆனால், மானிடமகனுக்கு[a] பூமியில் பாவங்களை மன்னிக்க அதிகாரம் உண்டு என்பதை நீங்கள் அறிந்துகொள்ளும்படி— என்று பக்கவாதத்தால் முடங்கியவரிடம்[b] அவர் சொல்கிறார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மனித மைந்தன்.” “மானிடமகன்” என்ற கிரேக்கப் பட்டப்பெயர் மனிதத்தன்மையைக் குறிக்கும் சொல்வழக்குப் பொருளையும் தானியேல் 7-ஐச் சுட்டும் எதிரொலியையும் ஒருங்கே கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “பக்கவாதமுற்றவரிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: ஆனால் … அறிந்துகொள்ளும்படி
  rationale: δέ குறிக்கும் மென்மையான மாறுபாட்டை “ஆனால்” என்றும், ἵνα குறிக்கும் நோக்கத்தை “அறிந்துகொள்ளும்படி” என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰδῆτε
  choice: நீங்கள் அறிந்துகொள்ள
  rationale: வரவிருக்கும் செயலின் மூலம் ஒன்றை உறுதியாக அறியச் செய்வதே இங்குள்ள பொருள்; பன்மை இரண்டாம் நபரும் காக்கப்பட்டுள்ளது.
- source_word: ἐξουσίαν ἔχει
  choice: அதிகாரம் உண்டு
  rationale: வெறும் ஆற்றலைவிட, பாவங்களை மன்னிப்பதற்கான உரிமையையும் அதிகாரத்தையும் ἐξουσία குறிக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் இப்பட்டப்பெயரின் மனிதத்தன்மை சார்ந்த இயல்பான பொருளையும் தானியேல் 7-ஐ நினைவூட்டக்கூடிய தன்மையையும் தீர்த்துவிடாமல் காக்கும் சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: விண்ணுலகுக்கு மாறான இவ்வுலகத் தளத்தில் அதிகாரம் செயல்படுவதை இயல்பாகக் குறிக்கிறது.
- source_word: ἀφιέναι ἁμαρτίας
  choice: பாவங்களை மன்னிக்க
  rationale: இச்சூழலில் ἀφίημι என்பது பாவங்களை விடுவித்தல் அல்லது நீக்குதல் என்ற பொருளில் “மன்னிக்க” எனத் தெளிவாக வழங்கப்படுகிறது.
- source_word: λέγει τῷ παραλυτικῷ
  choice: பக்கவாதத்தால் முடங்கியவரிடம் அவர் சொல்கிறார்
  rationale: παραλυτικός என்பதைக் குறைசொல்லாத, சாதாரண வாசகருக்கு உடனே புரியும் நபர்-மைய மொழியில் தருகிறது; λέγει என்பதன் வரலாற்று நிகழ்காலமும் “சொல்கிறார்” எனக் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற இயேசுவின் பட்டப்பெயர்
  choice: மானிடமகன்
  alternative: மனித மைந்தன்
  rationale: மனிதத்தன்மையைச் சுட்டும் சொல்வழக்குப் பொருள், மேசியா சார்ந்த அதிகாரம், தானியேல் 7 சார்ந்த எதிரொலி ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானித்து விடாமல் பட்டப்பெயரின் அடுக்குகளைப் பாதுகாக்கிறது.
- issue: பாவங்களை மன்னிப்பது தொடர்பான ἐξουσία என்பதன் பொருள்
  choice: அதிகாரம்
  alternative: வல்லமை
  rationale: இங்கு வெறும் செயல் திறன் அல்ல, பாவங்களை மன்னிப்பதற்கான உரிமையும் அதிகாரபூர்வமான தகுதியுமே வலியுறுத்தப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இடைநிறுத்தத்தை நீண்ட கோடும், அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றுக்கான தொடர்ச்சியை இறுதி முக்காற்புள்ளியும் காக்கின்றன. நபரை நோயால் மட்டும் அடையாளப்படுத்தாமல் “பக்கவாதத்தால் முடங்கியவர்” என்ற நபர்-மையச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
