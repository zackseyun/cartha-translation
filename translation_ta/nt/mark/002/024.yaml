source:
  edition: SBLGNT
  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: ta
  text: பரிசேயர்கள் அவரிடம், “இதோ, ஓய்வுநாளில் அனுமதிக்கப்படாததை இவர்கள் ஏன் செய்கிறார்கள்?” என்று கேட்டுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதோ, ஓய்வுநாளில் அனுமதிக்கப்படாத எந்தச் செயலை இவர்கள் செய்கிறார்கள்?” கிரேக்கத்தில் τί என்பதை “என்ன” என்றும் புரிந்துகொள்ளலாம்; எனினும் சூழலில் “ஏன்” என்பதே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் வசனத் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ எனச் சேர்ப்பது இயல்பற்றதாகவோ கிரேக்கத்தில் இல்லாத காலநுட்பத்தைச் சேர்ப்பதாகவோ அமையும்; தொடர்ச்சியை வாக்கிய அமைப்பே காட்டுகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான வழக்கமான, நவீனத் தமிழ் வடிவம்.
- source_word: ἔλεγον αὐτῷ
  choice: அவரிடம் … என்று கேட்டுக்கொண்டிருந்தார்கள்
  rationale: ἔλεγον என்பதன் இறந்தகாலத் தொடர்நிலை/மீள்நிகழ்வு இயல்பை ‘கேட்டுக்கொண்டிருந்தார்கள்’ காட்டுகிறது. வடிவில் ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்றாலும், கேள்வியாக அமைந்த நேரடி உரைக்கு ‘கேட்டுக்கொண்டிருந்தார்கள்’ இயல்பான தமிழ்.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கட்டளையின் வலிமையை கண்ணியமான, வழக்கிலுள்ள தமிழில் தருகிறது.
- source_word: τί
  choice: ஏன்
  rationale: குற்றச்சாட்டு நிறைந்த இச்சூழலில் τί காரணவினாவாக, ‘ஏன்’ என்ற பொருளில் இயங்குகிறது; ‘என்ன’ என்ற இலக்கணச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ποιοῦσιν
  choice: இவர்கள் … செய்கிறார்கள்
  rationale: நேரடி உரையிலுள்ள நிகழ்காலச் செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கப் பன்மை இங்கு யூதப் பயன்பாட்டின் அடிப்படையில் ஒரு ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொற்றொடர்; தமிழில் ஒருமை இயல்பானது.
- source_word: ὃ οὐκ ἔξεστιν
  choice: அனுமதிக்கப்படாததை
  rationale: செயல் அனுமதிக்கப்பட்டதா என்ற சட்ட-சமயக் குற்றச்சாட்டைத் தெளிவாகக் காட்டுகிறது; அது எந்தச் சட்டம் அல்லது விளக்கமுறை என்பதைத் தீர்மானித்து விடவில்லை.
theological_decisions:
- issue: பரிசேயர்களின் குற்றச்சாட்டின் அடிப்படை
  choice: ‘அனுமதிக்கப்படாததை’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘சட்டத்திற்குப் புறம்பானதை’ அல்லது ‘திருச்சட்டத்திற்கு எதிரானதை’
  rationale: οὐκ ἔξεστιν அனுமதி/சட்டப்பூர்வத்தன்மையை மட்டும் கூறுகிறது. இது வேதாகமச் சட்டமா, பரிசேய மரபா, அல்லது வேறு சமயச் சட்ட விளக்கமா என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’ மரபான வேதாகமச் சொல்லாக இருந்தாலும் இன்றைய வாசகருக்கும் தெளிவானது. பிரதான உரையில் காரணவினா இயல்பாகத் தரப்பட்டு, மூலத்தின் உண்மையான இலக்கண மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
