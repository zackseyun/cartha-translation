source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: ta
  text: பரிசேயர்களைச் சேர்ந்த வேத அறிஞர்கள்[a], அவர் பாவிகளோடும் வரிவசூலிப்பவர்களோடும் சாப்பிட்டுக்கொண்டிருப்பதைக் கண்டு, அவருடைய சீடர்களிடம், “அவர் ஏன் வரிவசூலிப்பவர்களோடும் பாவிகளோடும் சாப்பிடுகிறார்?” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசேயர்களின் வேத அறிஞர்கள்”; அல்லது, “பரிசேயர்களாகிய வேத அறிஞர்கள்.” கிரேக்கச் சொற்றொடர் இவர்களுக்கும் பரிசேயர்களுக்கும் உள்ள தொடர்பைச் சுட்டுகிறது; அது சார்பைக் குறிக்கிறதா அல்லது அடையாளத்தைக் குறிக்கிறதா என்பது மொழிபெயர்ப்பில் நுணுக்க வேறுபாடு உடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில், வேத எழுத்துகளிலும் அவற்றின் சட்ட விளக்கத்திலும் தேர்ச்சி பெற்ற அங்கீகரிக்கப்பட்ட நிபுணர்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘வேத அறிஞர்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τῶν Φαρισαίων
  choice: பரிசேயரைச் சேர்ந்த
  rationale: இந்தப் பிறப்புப்பொருள் அமைப்பு பரிசேயர்களுடனான தொடர்பையோ குழுச் சார்பையோ குறிக்கிறது; எல்லா அறிஞர்களும் தனிப்பட்ட முறையில் பரிசேயர்களே என்று தேவையின்றி முடிவுசெய்யாமல் அந்தத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἰδόντες
  choice: கண்டு
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் சூழ்நிலை/காலப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅτι ἐσθίει
  choice: சாப்பிட்டுக்கொண்டிருப்பதை
  rationale: ἐσθίει என்பதின் தொடர்நிலை அம்சத்தையும் நிகழ்ந்துகொண்டிருந்த காட்சியையும் தமிழ் தொடர்நிலை வடிவம் வெளிப்படுத்துகிறது.
- source_word: μετά
  choice: ஓடும்
  rationale: உடனிருப்பு மற்றும் ஒரே பந்தியில் உண்பதைக் குறிக்கும் எளிய தமிழ் இணைவு; சமூகப் பொருளை முதன்மை உரையில் விரிவுபடுத்தாமல் விடுகிறது.
- source_word: ἁμαρτωλῶν
  choice: பாவிகள்
  rationale: அசல் உரையிலுள்ள சமூக-சமய முத்திரையின் கடுமையை மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: τελωνῶν
  choice: வரிவசூலிப்பவர்கள்
  rationale: சுங்கம் அல்லது வருவாய் வசூலித்த சமூக ரீதியாக இகழப்பட்ட குழுவை நவீன வாசகர்களுக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: ἔλεγον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: சூழலில் இது சீடர்களிடம் முன்வைக்கப்பட்ட கேள்வி; தொடர்நிலை வடிவம் கிரேக்க இறந்தகாலத் தொடர்நிலை அம்சத்தைப் பாதுகாக்கிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: அவருடைய சீடர்களிடம்
  rationale: ஆசிரியர்-சீடர் உறவைத் துல்லியமாகப் பாதுகாக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: Ὅτι
  choice: ஏன்
  rationale: இங்குள்ள கேள்வி/குறைசொல்லும் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐσθίει
  choice: சாப்பிடுகிறார்
  rationale: நேரடி கேள்வியில் இயல்பான நிகழ்கால வடிவம்; அவருடைய வழக்கமான பந்தி உறவைக் குறித்த எதிர்ப்பையும் தாங்குகிறது.
theological_decisions:
- issue: ஒரே பந்தியில் உண்பதன் சமூக-சமய முக்கியத்துவம்
  choice: ‘பாவிகளோடும் வரிவசூலிப்பவர்களோடும் சாப்பிடுகிறார்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘வரிவசூலிப்பவர்களோடும் பாவிகளோடும் உணவைப் பகிர்ந்துகொள்கிறார்’ என்று உடனுறவை வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்கம் சாதாரணமாக ‘அவர்களோடு உண்கிறார்’ என்று கூறி, அதிலுள்ள சமூக மற்றும் சமயப் பதற்றத்தைச் சூழலே உணர்த்தச் செய்கிறது. முதன்மை உரையில் விளக்கத்தைச் சேர்க்காமல் அதையே பாதுகாக்கிறது.
- issue: τῶν Φαρισαίων என்பதன் தொடர்பு
  choice: ‘பரிசேயரைச் சேர்ந்த வேத அறிஞர்கள்’
  alternative: ‘பரிசேயர்களாயிருந்த வேத அறிஞர்கள்’
  rationale: பிறப்புப்பொருள் அமைப்பு affiliation/association எனும் உண்மையான நுணுக்கத்தைத் தக்கவைக்கிறது; அவர்களின் தனிப்பட்ட அடையாளத்தை அளவுக்கு மீறி நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சாப்பிடு’ என்பது அன்றாடத் தெளிவைத் தருவதோடு கிரேக்கத்தின் சாதாரண ἐσθίω வினைக்கு நெருக்கமாக உள்ளது. ‘வேத அறிஞர்கள்’ என்பது தொழில்நுட்பமான ‘மறைநூல் அறிஞர்கள்’ அல்லது தெளிவற்ற ‘எழுத்தர்கள்’ என்பவற்றைவிட பொதுவாசகருக்கு எளிதில் புரியும்.
