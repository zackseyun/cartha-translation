source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: ta
  text: ஆனால், மணமகன் அவர்களிடமிருந்து எடுத்துக்கொள்ளப்படும் நாட்கள் வரும்; அப்போது, அந்த நாளில்[a] அவர்கள் நோன்பிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொற்றொடர் ஒருமையில், “அந்த நாளில்” என்று உள்ளது; “அந்த நாட்களில்” என்று பன்மையில் இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ஆனால், ... நாட்கள் வரும்
  rationale: δέ முந்தைய வசனத்தின் தற்போதைய நிலைக்கு எதிர்மாறான மாற்றத்தைக் குறிப்பதால் “ஆனால்” என மொழிபெயர்க்கப்பட்டது. “நாட்கள் வரும்” என்பது மூலத்தின் பன்மையையும் வரவிருக்கும் காலத்தைக் குறிக்கும் சொல்லாட்சியையும் காக்கிறது.
- source_word: ὅταν
  choice: -ப்படும்
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சம்பவத்தை அறிமுகப்படுத்தும் ὅταν, தமிழில் “எப்போது” என்பதை தனியே சேர்க்காமல், “எடுத்துக்கொள்ளப்படும் நாட்கள்” என்ற இயல்பான தொடர்பெயர் அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து எடுத்துக்கொள்ளப்படும்
  rationale: செயப்படுபொருள் வடிவத்தையும் பிரிவையும் காக்கிறது; செய்பவர் யார் என்பதையோ, இது எவ்விதத்தில் நிகழும் என்பதையோ மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ὁ νυμφίος
  choice: மணமகன்
  rationale: திருமண உருவகத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் காக்கும் வழக்கமான சொல்.
- source_word: καὶ τότε
  choice: அப்போது
  rationale: மணமகன் எடுத்துக்கொள்ளப்பட்ட பிறகு நோன்பு ஏற்படும் என்ற நிகழ்வுகளின் வரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: νηστεύσουσιν
  choice: அவர்கள் நோன்பிருப்பார்கள்
  rationale: νηστεύω குறிக்கும் சமயச் செயலின் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: கிரேக்கத்தில் உள்ள ஒருமையைத் துல்லியமாகக் காத்து, தமிழில் இயல்பான காலக் குறிப்பாக அமைகிறது.
theological_decisions:
- issue: இயேசுவை மணமகனாகக் குறிக்கும் உருவகம்
  choice: “மணமகன்” என்ற உருவகத்தை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: “நான் அவர்களிடமிருந்து எடுத்துக்கொள்ளப்படும்போது” என்று வெளிப்படையாக மாற்றுதல்
  rationale: சூழலில் இயேசு தம்மையே குறிக்கிறார் என்றாலும், கிரேக்க உரை நேரடியான தன்மைக் குறிப்புக்குப் பதிலாக மணமகன் உருவகத்தையே பயன்படுத்துகிறது; அதன் இலக்கிய மற்றும் இறையியல் வலிமை காக்கப்படுகிறது.
- issue: மணமகன் எடுத்துக்கொள்ளப்படுவதன் தன்மை
  choice: செய்பவரையும் நிகழும் முறையையும் குறிப்பிடாமல் செயப்படுபொருள் வடிவத்தை வைத்தல்
  alternative: “மரணத்தில் எடுத்துக்கொள்ளப்படும்போது” அல்லது “வலுக்கட்டாயமாகப் பறிக்கப்படும்போது” என்று விளக்குதல்
  rationale: இது இயேசுவின் மரணத்தை முன்னறிவிப்பதாகப் புரிந்துகொள்ளப்படலாம்; ஆயினும் இவ்வசனம் செய்பவரையோ நிகழும் முறையையோ வெளிப்படையாகக் கூறாததால் அந்தத் திறந்த நிலை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் தொடக்கத்தில் வரும் “நாட்கள்” என்ற பன்மைக்கும் முடிவில் வரும் “அந்த நாளில்” என்ற ஒருமைக்கும் இடையிலான குறிப்பிடத்தக்க வேறுபாடு திட்டமிட்டே காக்கப்பட்டுள்ளது.
