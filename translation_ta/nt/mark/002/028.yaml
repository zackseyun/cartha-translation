  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: ta
  text: ஆகவே, மனுஷகுமாரன் ஓய்வுநாளுக்குக்கூட ஆண்டவராக இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனவே மனுஷகுமாரன் ஓய்வுநாளின் ஆண்டவரும் ஆவார்.” கிரேக்க இணைப்புச்சொல்லை “மேலும்” அல்லது “கூட” என்றும் மொழிபெயர்க்கலாம்; இங்கு “கூட” என்பது அவருடைய அதிகாரத்தின் விரிவை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான, தெளிவான தமிழில் காட்டுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இங்கு அதிகாரத்தையும் ஆளுகையையும் குறிக்கிறது; மனுஷகுமாரனைப் பற்றிய வலிமையான கிறிஸ்துவியல் கூற்றையும் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனுஷகுமாரன்
  rationale: நற்செய்தி நூல்களில் இயேசுவின் நிலைபெற்ற பட்டப்பெயராக இருப்பதால், அதன் வேதாகமத் தொடர்புகளையும் கிறிஸ்துவியல் நுட்பத்தையும் காக்கும் மரபான தமிழ் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: καὶ
  choice: -க்கும்
  rationale: இணைப்பு உருபான καί இங்கு ‘கூட/மேலும்’ என்ற ஏறுநிலை வலியுறுத்தலைக் கொண்டிருக்கலாம்; ‘ஓய்வுநாளுக்கும்’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σαββάτου
  choice: ஓய்வுநாள்
  rationale: சப்பாத்தைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ள எளிய தமிழ் வேதாகமச் சொல்; உடனடியான ஓய்வுநாள் விவாதச் சூழலுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: ஓய்வுநாள்மீது மனுஷகுமாரனுக்குள்ள அதிகாரத்தைப் பற்றிய கூற்றின் கிறிஸ்துவியல் வலிமை
  choice: மனுஷகுமாரன் ஓய்வுநாளுக்கும் ‘ஆண்டவர்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஓய்வுநாளைப் பொறுத்தவரை அதிகாரம் உடையவர்’ என்று மென்மையாக மொழிபெயர்த்தல்.
  rationale: κύριος என்பது வெறும் வரையறுக்கப்பட்ட அனுமதியை அல்ல, ஆண்டவருக்குரிய அதிகாரத்தை இயல்பாகக் குறிக்கிறது; மூலத்தின் வலிமையை கூடுதல் கோட்பாட்டு விளக்கமின்றிக் காக்கிறது.
- issue: ‘மனுஷகுமாரன்’ என்பதன் குறிப்பு
  choice: இயேசுவின் பட்டப்பெயராக ‘மனுஷகுமாரன்’ தக்கவைக்கப்பட்டது.
  alternative: ‘மனிதர்’ அல்லது ‘மனிதகுமாரன்’ எனப் பொதுப்பொருளில் விளக்குதல்.
  rationale: மாற்கு நற்செய்தியில் இச்சொற்றொடர் இயேசுவின் சுயக்குறிப்புப் பட்டமாகச் செயல்பட்டு, அதன் சாத்தியமான தானியேல் நூல் எதிரொலியையும் இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘மனுஷகுமாரன்’, ‘ஆண்டவர்’, ‘ஓய்வுநாள்’ ஆகிய நிலைபெற்ற சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
