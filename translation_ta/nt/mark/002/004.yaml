source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: ta
  text: கூட்டத்தினால் முடக்குவாதம் உள்ளவரை இயேசுவிடம் கொண்டுவர முடியாமல்[a], அவர் இருந்த இடத்துக்கு மேலிருந்த கூரையை அகற்றினார்கள். அதைத் தோண்டித் திறந்தபின், முடக்குவாதம் உள்ளவர் படுத்திருந்த பாயைக் கீழே இறக்குகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சார்ந்து, “அவரை அவரிடம் கொண்டுவர”; “அவரை” என்பது முடக்குவாதம் உள்ளவரையும், “அவரிடம்” என்பது இயேசுவையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கீழே இறக்கினார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கதைசொல்லலில் இங்கே கடந்தகால நிகழ்வை உயிரோட்டமாகக் காட்ட நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: historical_present
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: கொண்டுவர முடியாமல்
  rationale: கிரேக்கப் பங்கேற்புவினை அடுத்த செயலுக்கான சூழலையும் காரணத்தையும் காட்டுகிறது; தமிழில் ‘முடியாமல்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προσενέγκαι αὐτῷ
  choice: முடக்குவாதமுற்றவரை இயேசுவிடம் கொண்டுவர
  rationale: கிரேக்கத்தில் இரு ஆண்பால் சுட்டுப்பெயர்களும் உள்ளன. தமிழில் குழப்பம் வராமல், சூழலில் தெளிவாக உள்ள இரு நபர்களையும் பெயரிட்டு மொழிபெயர்க்கப்பட்டுள்ளது; சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: διὰ τὸν ὄχλον
  choice: கூட்டத்தினால்
  rationale: διά + வேற்றுமை வடிவம் இங்கு காரணத்தைக் குறிக்கிறது; ‘கூட்டத்தினால்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: கூரையைப் பிரித்தெடுத்தார்கள்
  rationale: அரிய வினைச்சொல் கூரையின் மூடுபகுதியை அகற்றுதல் அல்லது திறத்தலைக் குறிக்கிறது. ‘பிரித்தெடுத்தார்கள்’ கூரை முழுவதையும் அழித்தார்கள் என்று மிகைப்படுத்தாமல் செயலைக் காட்டுகிறது.
- source_word: ὅπου ἦν
  choice: அவர் இருந்த இடத்துக்கு மேலே
  rationale: மூலத்தில் ‘அவர் இருந்த இடத்தில்/எங்கே இருந்தாரோ அங்கே’ என்ற சுருக்கமான இடக்குறிப்பு உள்ளது. கூரை பற்றிய சூழலுக்கேற்ற செங்குத்தான தொடர்பை தமிழில் இயல்பாக வெளிப்படுத்த ‘மேலே’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐξορύξαντες
  choice: அதைக் தோண்டித் திறந்தபின்
  rationale: கூரை அமைப்பைத் தோண்டி அல்லது உடைத்து ஒரு திறப்பை உண்டாக்கிய செயலைக் குறிக்கிறது; பயன்படுத்தப்பட்ட பொருளை ஊகிக்காமல் செயலைத் தெளிவாக்குகிறது.
- source_word: χαλῶσι
  choice: கீழே இறக்குகிறார்கள்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, காட்சியின் உடனடித்தன்மையைத் தர நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: κράβαττον
  choice: பாய்
  rationale: இது பெரிய கட்டிலைக் காட்டிலும் எளிய படுப்புப் பாய் அல்லது மெத்தையைச் சுட்டுகிறது; ‘பாய்’ சாதாரண வாசகருக்கு தெளிவானதும் சூழலுக்கு ஏற்றதுமாகும்.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: முடக்குவாதமுற்றவர் படுத்திருந்த
  rationale: உறவுப்பெயர் தொடர் பாயை விவரிப்பதாக இயல்பாக எடுத்துக்கொள்ளப்பட்டுள்ளது. substantival adjective தமிழில் மரியாதையான நபர்மையுடன் ‘முடக்குவாதமுற்றவர்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: προσενέγκαι αὐτῷ என்பதில் உள்ள இரு αὐτός சுட்டுப்பெயர்களின் குறிப்பிடுபவர்கள்
  choice: முடக்குவாதமுற்றவரை இயேசுவிடம்
  alternative: அவரை அவரிடம்
  rationale: சூழலில் முதல் சுட்டுப்பெயர் முடக்குவாதமுற்றவரையும் இரண்டாவது இயேசுவையும் குறிக்கிறது. தமிழில் ‘அவரை அவரிடம்’ தேவையற்ற குழப்பத்தை உருவாக்குவதால் குறிப்பிடுபவர்கள் வெளிப்படையாகத் தரப்பட்டனர்; மூலத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையானாலும் கண்ணியமான கதைநடை. ‘முடக்குவாதமுற்றவர்’ என்பது நபரை நோயுடன் சமமாக்காமல் மூலச் சொல்லின் பொருளைக் காக்கிறது. கிரேக்க மூலத்தில் அடுத்தடுத்து வரும் இறந்தகால வினைகளுக்குப் பின் உள்ள வரலாற்று நிகழ்காலம் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
