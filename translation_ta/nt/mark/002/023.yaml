source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: ta
  text: ஓய்வுநாளில் அவர் தானிய வயல்களின்[a] வழியாகச் சென்றுகொண்டிருந்தார். அவருடைய சீடர்கள் கதிர்களைப்[b] பறித்துக்கொண்டே வழியே முன்னேறத்[c] தொடங்கினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விளைந்து நின்ற தானியங்களின் ஊடாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தானியத் தலைகளை.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “வழியை உண்டாக்கத் தொடங்கினர்”; இங்கு அவர்கள் கதிர்களைப் பறித்துக்கொண்டே வயலினூடே முன்னேறிச் சென்றதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ஒரு ... நாளில்
  rationale: நிகழ்வை அறிமுகப்படுத்தும் கிரேக்கக் கதைச்சொல்லல் சூத்திரத்தை, நவீன தமிழில் இயல்பான காலச் சூழல் அறிமுகமாக வழங்குகிறது; தனியாக ‘நிகழ்ந்தது’ என்று மொழிபெயர்த்தால் வசனம் செயற்கையாக ஒலிக்கும்.
- source_word: ἐν τοῖς σάββασιν
  choice: ஒரு ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், கொய்னே வழக்கில் இது ஒரு குறிப்பிட்ட ஓய்வுநாளைக் குறிக்க முடியும். தமிழில் ஒருமை சூழலுக்கு இயல்பானது.
- source_word: παραπορεύεσθαι
  choice: வழியாகச் சென்றுகொண்டிருந்தார்
  rationale: நடந்துகொண்டிருந்த இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: διὰ τῶν σπορίμων
  choice: தானிய வயல்களின் வழியாக
  rationale: σπόριμος விதைக்கப்பட்ட அல்லது தானியம் விளையும் நிலத்தைக் குறிக்கிறது. ‘தானிய வயல்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவான நவீனத் தமிழ்.
- source_word: ἤρξαντο
  choice: தொடங்கினார்கள்
  rationale: தொடக்கத்தைக் குறிக்கும் ἄρχομαι என்பதன் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: ὁδὸν ποιεῖν
  choice: தங்கள் வழியில் செல்ல
  rationale: சொல்லுக்குச் சொல் ‘வழியை உண்டாக்க’ என்பதற்குப் பதிலாக, இச்சூழலில் சீடர்கள் வயலினூடே முன்னேறிச் சென்றனர் என்ற இடியம்சார் பொருளை வழங்குகிறது; ‘தங்கள்’ என்பது தமிழில் தேவையான இயல்பைத் தருகிறது, தனித்த உடைமை வலியுறுத்தலை அல்ல.
- source_word: τίλλοντες
  choice: பறித்துக்கொண்டே
  rationale: கதிர்களை கையால் பிடுங்குதல் அல்லது பறித்தல் என்ற செயலைக் குறிக்கிறது; தொடர்ச்சியாகச் செல்லும்போதே செய்த செயல் என்பதையும் ‘-க்கொண்டே’ வெளிப்படுத்துகிறது.
- source_word: τοὺς στάχυας
  choice: கதிர்களை
  rationale: στάχυς என்பதற்கு தமிழில் ‘கதிர்’ என்பது துல்லியமும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான சொல்.
- source_word: αὐτὸν
  choice: அவர்
  rationale: ἐγένετο என்பதற்குப் பின் கிரேக்கத்தில் வேற்றுமை அமைப்பு காரணமாகச் செயப்படுபொருள் வடிவம் வந்தாலும், தமிழில் உட்பொருள் வாக்கியத்தின் எழுவாயாக ‘அவர்’ இயல்பாக அமைகிறது.
theological_decisions:
- issue: ஓய்வுநாள் குறிப்பு
  choice: ஒரு ஓய்வுநாளில்
  alternative: ஓய்வுநாட்களில்
  rationale: கிரேக்கப் பன்மை வடிவம் இச்சூழலில் ஒருமைப் பொருளில் வழக்காகப் பயன்படுத்தப்பட்டுள்ளது. இது மொழியியல் முடிவு; ஓய்வுநாள் விவாதத்தின் இறையியல் பொருளை மாற்றுவதில்லை.
- issue: ὁδὸν ποιεῖν என்பதன் பொருளும் ஓய்வுநாள் சர்ச்சையும்
  choice: தங்கள் வழியில் செல்ல
  alternative: வழியை உண்டாக்க
  rationale: இடியம்சார் மொழிபெயர்ப்பு, சீடர்கள் சாலை அமைத்ததாகவோ முறையாகப் பாதை வெட்டியதாகவோ மிகைப்படுத்தாமல், கதிர்களைப் பறித்துக்கொண்டே வயலினூடே சென்றதைத் தெரிவிக்கிறது. சொல்லடிப் பொருளின் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’, ‘தானிய வயல்கள்’, ‘கதிர்கள்’ ஆகியவை பொதுவாசகருக்குப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன. கிரேக்க இடியத்தின் சொல்லடிப் பொருள் முதன்மை உரையைச் சுமையாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
