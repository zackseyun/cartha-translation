review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, repetition, indefinite interval, and present-tense content of the report are substantially retained. However, «வந்தபோது» is less precise than εἰσελθών (‘entered’), and explicitly supplying «மக்கள்» converts the Greek impersonal passive report into an identified human subject. The phrase ἐν οἴκῳ does not explicitly identify the house as Jesus’ own; a non-possessive main rendering best preserves this ambiguity.
  naturalness: The draft is clear modern standard Tamil. The revised impersonal plural «கேள்விப்பட்டார்கள்» is idiomatic Tamil and avoids adding an explicit subject. «கப்பர்நகூமுக்குள் நுழைந்தபோது» naturally conveys entry into the town.
  terminology: «கப்பர்நகூம்» is an acceptable established Tamil transliteration. «ஒரு வீட்டில்» avoids implying ownership, while the footnote transparently records the contextually possible sense ‘at his home.’
  issues:
  - severity: medium
    issue: «வந்தபோது» weakens the entry sense of εἰσελθών.
    rationale: The Greek participle denotes entering, not merely coming or arriving. «நுழைந்தபோது» retains the lexical action without making the Tamil unnatural.
  - severity: low
    issue: «மக்கள்» is an added explicit subject for ἠκούσθη.
    rationale: The Greek uses an impersonal passive, ‘it was heard/reported.’ Tamil can naturally use an unspecified plural verb, preserving the unexpressed agent.
  - severity: medium
    issue: The current main wording and footnote do not most clearly preserve the non-possessive ambiguity of ἐν οἴκῳ.
    rationale: The Greek does not state that the house belonged to Jesus. Rendering the main text as «ஒரு வீட்டில்» keeps the location general; ‘at his home’ is retained as a possible contextual alternative in a footnote.
  revised_text: சில நாட்களுக்குப் பிறகு, அவர் மீண்டும் கப்பர்நகூமுக்குள் நுழைந்தபோது, அவர் ஒரு வீட்டில்[a] இருக்கிறார் என்று கேள்விப்பட்டார்கள்.
  revised_footnotes:
