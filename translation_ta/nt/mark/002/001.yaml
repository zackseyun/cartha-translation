    text: அல்லது, “தம் வீட்டில்.”
    reason: ἐν οἴκῳ என்பது பொதுவாக ஒரு வீட்டில் இருப்பதைக் குறிக்கலாம்; சூழலுக்கு ஏற்ப ‘தம் வீட்டில்’ என்றும் புரிந்துகொள்ளப்படலாம்.
  revision_rationale: The revision more closely represents εἰσελθών with «நுழைந்தபோது», retains the impersonal force of ἠκούσθη through an unspecified plural Tamil report, and avoids assigning ownership to the house. The footnote preserves the idiomatic ‘at home’ possibility reflected in the English audit trail without presenting it as explicit in the Greek.
