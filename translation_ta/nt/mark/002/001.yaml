id: MRK.2.1
reference: Mark 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: ta
  text: சில நாட்களுக்குப் பிறகு, அவர் மீண்டும் கப்பர்நகூமுக்குள் நுழைந்தபோது, அவர் ஒரு வீட்டில்[a] இருக்கிறார் என்று கேள்விப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் வீட்டில்.”
    reason: ἐν οἴκῳ என்பது பொதுவாக ஒரு வீட்டில் இருப்பதைக் குறிக்கலாம்; சூழலுக்கு ஏற்ப ‘தம் வீட்டில்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: வந்தபோது
  rationale: முதன்மை வினைக்கு முன்னுள்ள இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் காலத்தைக் குறிக்கும் தொடராக வழங்குகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: திரும்ப வருதல் அல்லது மறுபடியும் நிகழ்தல் என்ற வழக்கமான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: கிரேக்கப் பெயரின் ஒலியை நவீன தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: δι’ ἡμερῶν
  choice: சில நாட்களுக்குப் பிறகு
  rationale: எத்தனை நாட்கள் என்று வரையறுக்காமல், நாட்கள் கடந்த பின்பு என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἠκούσθη
  choice: மக்கள் கேள்விப்பட்டார்கள்
  rationale: கிரேக்கத்தில் உள்ள செயப்பாட்டு அறிக்கை அமைப்பை, குறிப்பிட்ட நபர்களை அடையாளப்படுத்தாமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἐν οἴκῳ
  choice: வீட்டில்
  rationale: இது ‘தம் வீட்டில்’ என்றும் பொதுவாக ‘ஒரு வீட்டில்’ என்றும் புரிந்துகொள்ளப்படலாம்; தமிழில் ‘வீட்டில்’ என்பது இவ்விரு சாத்தியங்களையும் ஓரளவு திறந்துவைக்கிறது, மேலும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐστίν
  choice: இருக்கிறார்
  rationale: கடந்தகால அறிக்கை வினைக்குள் கிரேக்கம் நிகழ்காலத்தை வைத்திருப்பதைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: ἐν οἴκῳ என்பது இயேசு தங்கியிருந்த சொந்த/வழக்கமான இடத்தைக் குறிக்கிறதா, அல்லது பொதுவாக ஒரு வீட்டைக் குறிக்கிறதா?
  choice: வீட்டில்
  alternative: ஒரு வீட்டில்
  rationale: சூழலில் ‘வீட்டில்’ என்பது இயல்பானது; ஆயினும் கிரேக்கச் சொற்றொடர் அந்த வீடு அவருடையது என்று வெளிப்படையாகக் கூறாததால், பொதுவான இடப்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்’ என்பது கிரேக்கச் செயப்பாட்டு வினையின் குறிப்பிடப்படாத கேட்போரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட குழுவைச் சேர்ப்பதில்லை.
