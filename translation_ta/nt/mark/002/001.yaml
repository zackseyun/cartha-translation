revisions:
- from: சில நாட்களுக்குப் பிறகு அவர் மீண்டும் கப்பர்நகூமுக்கு வந்தபோது, அவர் வீட்டில்[a] இருக்கிறார் என்று மக்கள் கேள்விப்பட்டார்கள்.
  to: சில நாட்களுக்குப் பிறகு, அவர் மீண்டும் கப்பர்நகூமுக்குள் நுழைந்தபோது, அவர் ஒரு வீட்டில்[a] இருக்கிறார் என்று கேள்விப்பட்டார்கள்.
  rationale: The revision more closely represents εἰσελθών with «நுழைந்தபோது», retains the impersonal force of ἠκούσθη through an unspecified plural Tamil report, and avoids assigning ownership to the house. The footnote preserves the idiomatic ‘at home’ possibility reflected in the English audit trail without presenting it as explicit in the Greek.
