  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: ta
  text: இவன் ஏன் இப்படிப் பேசுகிறான்?[a] இவன் தேவதூஷணம் செய்கிறான்! ஒரே கடவுளைத் தவிர, பாவங்களை மன்னிக்க வேறு யாரால் முடியும்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் நெருக்கமாக, ‘இவன் என்ன இப்படி பேசுகிறான்?’ எனலாம். இங்குள்ள கிரேக்க வழக்கு, ‘இவன் ஏன் இப்படிப் பேசுகிறான்?’ என்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒருவராகிய கடவுளைத் தவிர.’
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... λαλεῖ
  choice: ஏன் ... பேசுகிறான்?
  rationale: இங்கு Τί என்பது பேசப்பட்ட சொற்களின் உள்ளடக்கத்தைக் கேட்பதல்ல; இவ்வாறு பேசுவதற்கான காரணத்தைக் கேள்விக்குள்ளாக்கும் கிரேக்க வழக்கு. எனவே இயல்பான தமிழில் ‘ஏன்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: οὗτος
  choice: இவன்
  rationale: இயேசுவைச் சற்றே விலக்கிப் பேசும் சுட்டுப்பெயரின் தொனியை ‘இவன்’ இயல்பாகக் காட்டுகிறது; அதே நேரத்தில் மூலத்தில் இருப்பதைவிட அதிக இகழ்ச்சியைச் சேர்ப்பதில்லை.
- source_word: οὕτως
  choice: இப்படி
  rationale: இயேசு பேசிய விதத்தையும் அவர் கூறியவற்றின் தன்மையையும் குறிக்கும் οὕτως என்பதற்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: βλασφημεῖ
  choice: தேவதூஷணம் பேசுகிறான்
  rationale: இயேசுவின் கூற்றுக்கு எதிராக மறைநூல் அறிஞர்கள் முன்வைக்கும் கடுமையான சமயக் குற்றச்சாட்டைத் தக்கவைக்கிறது. ‘கடவுளை நிந்திக்கிறான்’ என்பது வெறும் வசைபாடுதலாகக் குறுகிவிடக்கூடும்.
- source_word: τίς δύναται
  choice: வேறு யாரால் ... முடியும்?
  rationale: திறனையும் அதிகாரத்தையும் பற்றிய வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வேறு’ என்பது விதிவிலக்குக் கட்டமைப்பைத் தெளிவாக்குகிறது.
- source_word: ἀφιέναι ἁμαρτίας
  choice: பாவங்களை மன்னிக்க
  rationale: இந்தச் சூழலில் ἀφίημι என்பது பாவங்களை விடுவிப்பது, அதாவது மன்னிப்பது என்ற நிலைபெற்ற பொருளைக் கொண்டுள்ளது.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: கடவுள் ஒருவரைத் தவிர
  rationale: விதிவிலக்கையும் கடவுளுக்கே உரிய தனித்த அதிகாரத்தையும் இயல்பான தமிழில் காக்கிறது; கிரேக்கத்தின் ‘ஒருவர்/ஒரே’ என்ற அழுத்தமும் முற்றிலும் மறையவில்லை.
theological_decisions:
- issue: οὗτος என்பதில் இகழ்ச்சியின் அளவு
  choice: இவன்
  alternative: இந்த ஆள் / இவன் போன்றவன்
  rationale: பேசுபவர்களின் விலகிய, எதிர்ப்பான தொனியைப் பாதுகாக்கிறது; ஆனால் மூலத்தில் தெளிவாக இல்லாத அளவுக்கு இகழ்ச்சியைத் தீவிரப்படுத்துவதில்லை.
- issue: βλασφημεῖ என்ற குற்றச்சாட்டின் வலிமை
  choice: இவன் தேவதூஷணம் பேசுகிறான்!
  alternative: இவன் கடவுளை நிந்திக்கிறான்! / இது தேவதூஷணம்!
  rationale: பாவங்களை மன்னிக்கும் அதிகாரத்தை இயேசு உரிமைகோரியதாக அவர்கள் கருதி முன்வைக்கும் இறையியல் குற்றச்சாட்டை அப்படியே தருகிறது; அந்தக் குற்றச்சாட்டு சரியா என்பதை மொழிபெயர்ப்பே தீர்மானிப்பதில்லை.
- issue: εἰ μὴ εἷς ὁ θεός என்பதன் அமைப்பு
  choice: கடவுள் ஒருவரைத் தவிர
  alternative: ஒரே கடவுளைத் தவிர / கடவுளைத் தவிர வேறு ஒருவராலும்
  rationale: ‘கடவுள் மட்டுமே’ என்ற பிரத்தியேகப் பொருளையும் ‘ஒருவராகிய கடவுள்’ என்று புரிந்துகொள்ளக்கூடிய மூல அமைப்பையும் முடிந்தவரை ஒன்றாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான வினா அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘தேவதூஷணம்’ என்பது இச்சூழலின் குறிப்பான சமயக் குற்றச்சாட்டைத் துல்லியமாகக் காக்கும் மரியாதைமிக்க சொல். வாக்கியத்தின் எதிர்ப்புத் தொனியும் கிறிஸ்துவியல் பதற்றமும் விளக்கிச் சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
