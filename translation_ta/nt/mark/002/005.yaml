  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: ta
  text: இயேசு அவர்களுடைய நம்பிக்கையைக் கண்டு, முடக்குவாதமுற்ற அந்த மனிதரிடம், “பிள்ளையே[a], உன் பாவங்கள் மன்னிக்கப்படுகின்றன” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகனே’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல்லான τέκνον, ‘பிள்ளை’ என்று பொருள்படும் அன்பான அழைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டு
  rationale: ὁράω என்பதன் பங்கேற்பு வினை வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டி, முதன்மை வினையுடன் அதன் தொடர்பைப் பாதுகாக்கிறது.
- source_word: πίστιν
  choice: நம்பிக்கையை
  rationale: இங்கு அந்த மனிதரை இயேசுவிடம் கொண்டுவந்த குழுவினரின் வெளிப்படையான நம்புதலையும் சார்ந்திருத்தலையும் குறிக்கிறது; பொதுமக்களுக்கு இயல்பான தமிழில் இதை ‘நம்பிக்கை’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: பன்மை உரிமைப்பெயரைப் பாதுகாத்து, அந்த நம்பிக்கை அங்கிருந்த குழுவினருடையது என்பதைத் தெரிவிக்கிறது; அந்த மனிதரும் இதில் அடங்குகிறாரா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்காலத்தால் பாதுகாக்கிறது.
- source_word: παραλυτικῷ
  choice: உடல் செயலிழந்த அந்த மனிதரிடம்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட இச்சொல் முடக்கமுற்ற ஒருவரைக் குறிக்கிறது. ‘உடல் செயலிழந்த’ என்பது குறிப்பிட்ட மருத்துவக் காரணத்தை ஊகிக்காமல், இன்றைய வாசகருக்குப் புரியும் மரியாதையான சொல்லாக்கம்.
- source_word: Τέκνον
  choice: குழந்தையே
  rationale: அன்பும் பரிவும் நிறைந்த அழைப்பை வெளிப்படுத்துகிறது; கிரேக்கச் சொல் தானாகவே கோரும் அளவைவிட ஆண்பால் குறிப்பை அதிகமாகச் சேர்க்காமல் இருக்கிறது.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: உன் பாவங்கள் மன்னிக்கப்படுகின்றன
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் நேரடியான அறிவிப்பின் வலிமையையும் பாதுகாக்கிறது; மன்னிப்பைச் செய்பவர் யார் என்பதை கிரேக்கத்தைப் போலவே வெளிப்படையாகக் கூறாமல் விடுகிறது.
- source_word: ἁμαρτίαι
  choice: பாவங்கள்
  rationale: வழக்கமான பொருத்தமான தமிழ்ச் சொல்; கிரேக்கத்தின் பன்மை வடிவமும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் மன்னிப்பு அறிவிப்பின் இயல்பு
  choice: ‘உன் பாவங்கள் மன்னிக்கப்படுகின்றன’ என்ற நேரடி நிகழ்காலச் செயப்பாட்டு அறிவிப்பு
  alternative: ‘உன் பாவங்கள் மன்னிக்கப்பட்டுவிட்டன’ அல்லது ‘உன் பாவங்கள் மன்னிக்கப்படுகின்றன’ என்பதைத் தொடர்ச்சியான செயலாக விளக்குதல்
  rationale: கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவம் மன்னிப்பை தற்போதைய உண்மையாக அறிவிக்கிறது. அதன் நிகழும் முறை, துல்லியமான காலநிலை, அல்லது செய்பவர் குறித்து வசனம் கூறாத விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
