  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையைப் பயன்படுத்துகிறது. கிரேக்க முற்றுப்பெறாத இறந்தகால வினைகளின் தொடர்நிலை இரு இடங்களிலும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது; கடலோர இடவியல் பற்றிய மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
