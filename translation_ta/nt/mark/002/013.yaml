  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: ta
  text: அவர் மீண்டும் கடலோரத்திற்குச் சென்றார்.[a] மக்கள் கூட்டம் முழுவதும் அவரிடம் வந்துகொண்டிருந்தது;[b][c] அவர் அவர்களுக்குக் கற்பித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடலருகே.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்கள் கூட்டமெல்லாம்.’
    reason: lexical_alternative
  - marker: c
    text: ‘வந்துகொண்டிருந்தது,’ ‘கற்பித்துக்கொண்டிருந்தார்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க வினைச்சொல் வடிவங்கள், கடந்த காலத்தில் தொடர்ந்து நடந்த செயல்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: புறப்பட்டார்
  rationale: ἐξέρχομαι என்பதன் இங்கு வரும் இறந்தகால வடிவம், ஒருவர் இருந்த இடத்திலிருந்து வெளியே சென்றதைச் சுட்டுகிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘புறப்பட்டார்’ இதைத் தெரிவிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு நடந்த செயல் மறுபடியும் நிகழ்வதை πάλιν குறிக்கிறது; ‘மீண்டும்’ என்பது இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: παρὰ τὴν θάλασσαν
  choice: கடலோரமாக
  rationale: Accusative-உடன் வரும் παρά இங்கு கடலின் ஓரத்தை ஒட்டிய இடத்தையோ நகர்வையோ குறிக்கலாம். ‘கடலோரமாக’ அந்த இடவியல் நுணுக்கத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: πᾶς ὁ + ஒருமைத் தொகுப்புப்பெயர், கூட்டம் முழுவதையும் குறிக்கிறது. ‘மக்கள் கூட்டம் முழுவதும்’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἤρχετο
  choice: வந்துகொண்டிருந்தது
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் கடந்த காலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கக்கூடும். ‘வந்துகொண்டிருந்தது’ அந்த அம்சத்தை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: πρός இங்கு ஒருவரை நோக்கிய நகர்வைக் குறிக்கிறது; ‘அவரிடம்’ என்பது இயல்பான தமிழ் வழக்கு.
- source_word: ἐδίδασκεν
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்த போதனைச் செயலைச் சுட்டுகிறது. ‘கற்பித்துக்கொண்டிருந்தார்’ அதன் தொடர்நிலையைத் தக்கவைக்கிறது.
- source_word: αὐτούς
  choice: அவர்களுக்கு
  rationale: இந்தப் பன்மைப் பெயர்ச்சுட்டு முன்னர் குறிப்பிடப்பட்ட மக்கள் கூட்டத்தினரைக் குறிக்கிறது; தமிழில் பெறுபவரைக் குறிக்கும் ‘அவர்களுக்கு’ இயல்பானது.
