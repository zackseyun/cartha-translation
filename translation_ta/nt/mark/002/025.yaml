source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “தாவீதுக்குத் தேவை ஏற்பட்டபோதும், அவரும் அவருடன் இருந்தவர்களும் பசியாயிருந்தபோதும், அவர் என்ன செய்தார் என்பதை நீங்கள் ஒருபோதும் வாசித்ததில்லையா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: தேவை ஏற்பட்டபோது
  rationale: தேவை அல்லது நெருக்கடி ஏற்பட்ட நிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; அதன் பொருளை உணவு மட்டும் எனக் குறுக்கவில்லை.
- source_word: ἐπείνασεν
  choice: பசியடைந்து
  rationale: தாவீதின் பசியைத் தனித்த செயல்வினையாகப் பாதுகாக்கிறது; முந்தைய ‘தேவை’ என்பதுடன் ஒன்றாக்கவில்லை.
- source_word: οἱ μετ’ αὐτοῦ
  choice: தன்னுடன் இருந்தவர்கள்
  rationale: உடனிருந்தவர்களைக் குறிக்கும் மூலத்தின் பொதுவான சொல்லை, அவர்கள் யார் என்று மேலதிகமாக வரையறுக்காமல் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ‘அவர்’ யார் என்பது முந்தைய சூழலால் அறியப்படுவதால், இவ்வசனத்திலும் பெயரைச் சேர்க்கவில்லை.
