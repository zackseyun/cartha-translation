source:
  edition: SBLGNT
  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: ta
  text: '“நான் உனக்குச் சொல்கிறேன்: எழுந்திரு; உன் படுக்கைப் பாயை[a] எடுத்துக்கொண்டு, உன் வீட்டுக்குப் போ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படுக்கையை.” கிரேக்கச் சொல் எளிய படுக்கும் பாய் அல்லது எடுத்துச் செல்லக்கூடிய படுக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வீடு திரும்பிப் போ.” கிரேக்கத்தில் நேரடியாக, “உன் வீட்டுக்குப் போ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ
  choice: உனக்கு
  rationale: வாக்கியத்தின் தொடக்கத்தில் வந்துள்ள வலியுறுத்தப்பட்ட ஒருமை முன்னிலைப் பெயரை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: λέγω
  choice: சொல்கிறேன்
  rationale: நிகழ்கால முதல்நபர் வினையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்த்து, அதிகாரமுள்ள நேரடி உரையின் தொனியைப் பாதுகாக்கிறது.
- source_word: ἔγειρε
  choice: எழுந்திரு
  rationale: முடக்குவாதமுற்ற மனிதனுக்குக் கொடுக்கப்படும் நேரடியான கட்டளையைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἆρον
  choice: எடுத்துக்கொண்டு
  rationale: பாயைத் தூக்கி உடன் எடுத்துச் செல்லும் செயலையும் அடுத்த கட்டளையுடன் அதன் இயல்பான தொடர்பையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: κράβαττόν
  choice: படுக்கைப் பாய்
  rationale: இச்சொல் எளிய, எடுத்துச் செல்லக்கூடிய படுக்கும் பாய் அல்லது படுக்கையைக் குறிக்கிறது; ‘படுக்கைப் பாய்’ என்பது முழு கட்டில் என்ற தவறான எண்ணத்தைத் தவிர்த்து பொருளைத் தெளிவாக்குகிறது.
- source_word: ὕπαγε
  choice: போ
  rationale: இங்கு இடம்பெறும் எளிய நேரடிக் கட்டளைக்கு இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: εἰς τὸν οἶκόν σου
  choice: உன் வீட்டுக்கு
  rationale: εἰς என்பதன் திசைநோக்கிய பொருளையும் οἶκος என்பதன் ‘வீடு’ என்ற நேரடிப் பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் குணமாக்கும் கட்டளையின் தொனியும் வலிமையும்
  choice: “நான் உனக்குச் சொல்கிறேன்” என்பதைத் தொடர்ந்து உடனடியாக நிறைவேற்ற வேண்டிய நேரடியான கட்டளைகள்
  alternative: மரபான உயர்நடைச் சொற்களுடன் ‘எழும்பி, உன் படுக்கையை எடுத்துக்கொண்டு, இல்லத்திற்குச் செல்’ என மொழிபெயர்த்தல்
  rationale: மூலவசனம் இயேசுவின் உடனடியான அதிகாரத்தை வெளிப்படுத்துகிறது. நவீன, தெளிவான கட்டளை வடிவங்கள் அந்த வலிமையைப் பாதுகாக்கின்றன; அதேவேளை கூடுதல் இறையியல் விளக்கத்தைப் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மூலத்தில் உள்ள தனிப்பட்ட நேரடி அழைப்பும் தொடர்ச்சியான கட்டளைகளும் பாதுகாக்கப்பட்டுள்ளன.
