reference: Mark 2:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “மணமகன் அவர்களோடு இருக்கும்போது, திருமணக் கொண்டாட்டத்தில் கலந்துகொள்கிறவர்கள் நோன்பிருக்க முடியாதல்லவா? அவர்கள் மணமகனைத் தங்களோடு கொண்டிருக்கும் வரையில், நோன்பிருக்க முடியாது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: நோன்பிருக்க முடியுமா?
  rationale: μή உடன் வரும் இந்தக் கேள்வி ‘முடியாது’ என்ற பதிலை எதிர்பார்க்கும் வினாவாகும். தமிழில் எதிர்மறைப் பதிலை எதிர்பார்க்கும் இயல்பான சொல்லமைப்பாக இதை வழங்குகிறது; அடுத்த வாக்கியம் அதன் பொருளைத் தெளிவாக்குகிறது.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: திருமணக் கொண்டாட்டத்தில் கலந்துகொள்கிறவர்கள்
  rationale: சொல்லுக்கு சொல் ‘மணவறையின் மகன்கள்’ என்று வரும் இச்சொற்றொடர், திருமணக் கொண்டாட்டத்தில் பங்கேற்பவர்களைக் குறிக்கும் மரபுத்தொடர். ‘விருந்தினர்கள்’ என்பது பொருந்தினாலும், மணமகனின் தோழர்களையும் பிற பங்கேற்பாளர்களையும் உள்ளடக்கும் வகையில் இந்த விரிவான இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐν ᾧ ... ἐστιν
  choice: இருக்கும்போது
  rationale: இங்கு கட்டமைப்பு இடத்தைக் காட்டுவதைவிட காலத்தைக் காட்டுகிறது; தமிழில் ‘இருக்கும்போது’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: மணமகன்
  rationale: மூலத்தின் உருவகத்தை விளக்கமாக விரித்துரைக்காமல் அப்படியே காக்கும் தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: μετ’ αὐτῶν
  choice: தங்களோடு
  rationale: μετά இங்கு உடனிருப்பதைக் குறிக்கிறது. கேட்பவர்களை நோக்கிய இயேசுவின் நேரடிப் பேச்சில் ‘தங்களோடு’ இயல்பாக உள்ளது.
- source_word: ὅσον χρόνον
  choice: இருக்கும் காலமெல்லாம்
  rationale: குறிப்பிட்ட நிலை நீடிக்கும் முழுக் காலத்தையும் குறிக்கும் கிரேக்கச் சொற்றொடரின் காலவளவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: மணமகன் தங்களோடு இருக்கும்
  rationale: கிரேக்கத்தில் ‘அவர்கள் மணமகனைத் தங்களோடு கொண்டிருக்கிறார்கள்’ என்று இருந்தாலும், அதைச் சொல்லுக்கு சொல் தமிழாக்குவது இயல்பற்றது. உடனிருப்பதன் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: இயேசு அவர்களிடம் ... என்றார்
  rationale: கிரேக்கக் கதைநடையின் அறிமுகத்தை நவீனத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வழங்குகிறது.
theological_decisions:
- issue: இயேசுவை மணமகனாகக் காட்டும் உருவகம்
  choice: ‘மணமகன்’ என்ற உருவகத்தை விளக்கச் சேர்க்கைகள் இன்றி தக்கவைத்தல்
  alternative: இது இயேசுவின் மேசிய அடையாளத்தைக் குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்குதல்
  rationale: வசனம் இயேசுவை மணமகன் உருவகத்தோடு தொடர்புபடுத்துகிறது; அதன் இறையியல் விளைவுகளை வாசகருக்காக மொழிபெயர்ப்பே முடிவுசெய்யாமல், மூலத்திலுள்ள உருவகமும் அதன் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நோன்பிருக்க’ என்பது சமயச் சூழலில் இயல்பானதும் சுருக்கமானதும். மூலத்தின் வினா–விடை வலிமையும் ‘மணமகன்’ உருவகமும் காக்கப்பட்டுள்ளன.
