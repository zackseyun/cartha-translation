  source_fidelity: மூலத்தின் திருமண-விருந்து உருவகமும், நோன்பிருக்க முடியாதென்ற முடிவும் சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் οἱ υἱοὶ τοῦ νυμφῶνος மூன்றாம் நபராக இருப்பதால், அவர்களைக் குறிக்கும் μετ’ αὐτῶν-ஐ ‘தங்களோடு’ என இரண்டாம் நபர் மரியாதைப் பன்மையில் மொழிபெயர்ப்பது பொருத்தமல்ல. மேலும் முதல் வினாவின் μή எதிர்மறைப் பதிலை எதிர்பார்க்கும் வலிமையைத் தெளிவாகக் காட்டலாம். இரண்டாம் வாக்கியத்தில் ἔχουσιν (‘கொண்டிருக்கிறார்கள்’) என்பதையும் இயல்பாகத் தக்கவைக்க முடியும்.
  naturalness: ‘திருமணக் கொண்டாட்டத்தில் கலந்துகொள்கிறவர்கள்’ நவீனத் தமிழில் தெளிவானது. ‘அவர்களோடு’ என்பது சுட்டுப்பொருளோடு ஒத்திசைவானது; ‘முடியாதல்லவா?’ என்பது இச்சூழலின் வினாவிற்கு இயல்பான வலிமையைத் தருகிறது. ‘மணமகனைத் தங்களோடு கொண்டிருக்கும் வரையில்’ என்பதற்குப் பதிலாக ‘மணமகனைத் தங்களோடு வைத்திருக்கும் வரையில்’ என்றும் சொல்லலாம்; ஆனால் ‘கொண்டிருக்கும்’ மூலத்தின் உடனிருப்பையும் possession-ஐயும் நன்றாகக் காக்கிறது.
