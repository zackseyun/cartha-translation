id: MRK.2.18
reference: Mark 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: ta
  text: யோவானின் சீடர்களும் பரிசேயர்களும் நோன்பிருந்துகொண்டிருந்தார்கள். அவரிடம் வந்து[a], “யோவானின் சீடர்களும் பரிசேயர்களின் சீடர்களும் நோன்பிருக்கிறார்கள்; ஆனால் உம்முடைய சீடர்கள் ஏன் நோன்பிருப்பதில்லை?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘வந்து சொல்கிறார்கள்’ என்பதன் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; அல்லது, “அவர்கள் வந்து அவரிடம் கேட்டார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: நோன்பிருந்துகொண்டிருந்தார்கள்
  rationale: இறந்தகால εἰμί வினையுடன் நிகழ்காலப் பெயரெச்சம் சேர்ந்த இந்த அமைப்பு, கடந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது. தமிழில் ‘நோன்பிருந்துகொண்டிருந்தார்கள்’ அந்தத் தொடர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: யோவானின் சீடர்கள்
  rationale: உடைமை அல்லது தொடர்பைக் காட்டும் பிறப்புவேற்றுமையை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கு தமிழில் நிலைபெற்றுள்ள வழக்கமான வடிவம்.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: வந்து ... கேட்டார்கள்
  rationale: மாற்குவின் வரலாற்று நிகழ்காலத்தை தமிழில் இயல்பான கடந்தகாலக் கதைநடையில் வழங்குகிறது. நேரடி உரை கேள்வியாக இருப்பதால் λέγουσιν என்பதற்கு ‘கேட்டார்கள்’ என்பது சூழலுக்கேற்ற இயல்பான சமம்.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் கிரேக்கத் தொடரின் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: பரிசேயர்களின் சீடர்கள்
  rationale: பிறப்புவேற்றுமை காட்டும் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது; பரிசேயர்களையும் அவர்களுடைய சீடர்களையும் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
- source_word: νηστεύουσιν
  choice: நோன்பிருக்கிறார்கள்
  rationale: இங்கு நிகழ்காலம் வழக்கமான நடைமுறையையோ நடைபெறும் செயலையோ குறிக்கலாம்; தமிழ் வடிவம் தேவையின்றி அதில் ஒன்றை மட்டும் கட்டாயப்படுத்துவதில்லை.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: ஆனால் உம்முடைய சீடர்கள்
  rationale: δέ காட்டும் முரண்பாட்டையும் σοί காட்டும் உடைமைத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது. இயேசுவை நோக்கிய உரையில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἔρχονται καὶ λέγουσιν என்பதன் சொல்லப்படாத எழுவாயின் அடையாளம்
  choice: முதன்மை உரையில் ‘சிலர்’ என்று பொதுவாக வழங்கப்பட்டது.
  alternative: முந்தைய ‘யோவானின் சீடர்களும் பரிசேயர்களும்’ என்பதையே ‘அவர்கள்’ என்று எழுவாயாகக் கொள்ளலாம்; அல்லது எழுவாயை முற்றிலும் சொல்லாமல் மொழிபெயர்க்கலாம்.
  rationale: கிரேக்கத்தில் ‘வந்து சொல்கிறார்கள்’ என்பதற்கான எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழ் வாக்கியத்துக்கு இயல்பான எழுவாய் தேவைப்படுவதால் குறிப்பிட்ட குழுவை அடையாளப்படுத்தாத ‘சிலர்’ பயன்படுத்தப்பட்டு, மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நோன்பிரு’ என்ற வழக்கமான சமயச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. கதையின் முதல் வாக்கியத்தில் தொடர்ச்சியான கடந்தகாலச் செயல் காக்கப்பட்டுள்ளது; கேள்வியில் இயல்பான நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையில் மரியாதை ஒருமையான ‘உம்முடைய’ இடம்பெறுகிறது.
