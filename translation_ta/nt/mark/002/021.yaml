  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ta
  text: இன்னும் சுருக்கப்படாத துணியாலான ஒட்டுத்துண்டை யாரும் பழைய ஆடையின்மேல் தைத்துவைப்பதில்லை.[a] அப்படிச் செய்தால்,[b] கிழிசலை நிரப்பும் புதிய ஒட்டுத்துண்டு பழைய ஆடையிலிருந்து இழுத்துப் பிரியும்; கிழிசல் இன்னும் மோசமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பதப்படுத்தப்படாத துணி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், சுருங்கச் செய்யும் பதப்படுத்தும் முறைக்கு இன்னும் உட்படுத்தப்படாத துணியைக் குறிக்கிறது; அதை ஒட்டுத்துண்டாகப் பயன்படுத்தினால் பின்னர் அது சுருங்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘இல்லையென்றால், அதை நிரப்புவது அதிலிருந்து—புதியது பழையதிலிருந்து—எடுத்துவிடும்.’ புதிய ஒட்டுத்துண்டு பழைய ஆடையிலிருந்து இழுத்துப் பிரிந்து, கிழிசலை மோசமாக்கும் என்பதே பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: ஒட்டுத்துண்டு
  rationale: கிழிந்த ஆடையைச் செப்பனிட அதன்மேல் வைத்துத் தைக்கப்படும் துண்டை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ῥάκους ἀγνάφου
  choice: இன்னும் சுருக்கப்படாத துணி
  rationale: பதப்படுத்தப்படாததால் பின்னர் சுருங்கக்கூடிய துணி என்பதே சூழலில் முக்கியம்; ‘இன்னும்’ என்பது அந்தச் செயல்முறை நிறைவடையாததைத் தெரிவிக்கிறது.
- source_word: ἐπιράπτει
  choice: தைத்துவைப்பதில்லை
  rationale: துண்டை ஆடையின்மேல் தைத்து இணைக்கும் செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: ἱμάτιον παλαιόν
  choice: பழைய ஆடை
  rationale: குறிப்பிட்ட ஓர் ஆடை வகையைத் தேவையின்றி வரையறுக்காமல் ἱμάτιον என்பதன் பொதுவான பொருளைப் பேணுகிறது.
- source_word: εἰ δὲ μή
  choice: அப்படிச் செய்தால்
  rationale: முந்தைய மறுப்புக்கு மாறாக அந்தச் செயல் செய்யப்பட்டால் ஏற்படும் விளைவைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: αἴρει
  choice: இழுத்துப் பிரியும்
  rationale: புதிய துண்டு பழைய ஆடையிலிருந்து விலகி, கிழிசலைப் பெரிதாக்கும் சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
- source_word: τὸ πλήρωμα
  choice: அதை நிரப்பும் ... துண்டு
  rationale: கிழிந்த பகுதியை நிரப்புவதற்குப் பயன்படுத்தப்படும் ஒட்டுத்துண்டு என்ற இவ்விடத்திற்குரிய பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: புதிய துண்டு பழைய ஆடையிலிருந்து
  rationale: கிரேக்கத்தின் ‘புதியது—பழையதிலிருந்து’ என்ற முரணைத் தெளிவான தமிழ் பெயர்ச்சொற்களுடன் பேணுகிறது.
- source_word: χεῖρον σχίσμα γίνεται
  choice: கிழிசல் இன்னும் மோசமாகும்
  rationale: ஏற்கெனவே உள்ள கிழிசல் இதனால் பெரிதாகவோ கடுமையாகவோ ஆகும் விளைவை இயல்பான தமிழில் தருகிறது.
