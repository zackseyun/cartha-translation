id: MRK.2.15
reference: Mark 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ta
  text: 'இவ்வாறு நிகழ்ந்தது: அவர் அவருடைய வீட்டில்[a] உணவுக்கு அமர்ந்திருந்தபோது, வரி வசூலிப்பவர்களும் பாவிகளும் பலர் இயேசுவோடும் அவருடைய சீடர்களோடும் உணவுக்கு அமர்ந்திருந்தார்கள். ஏனெனில், அவர்கள் பலராய் இருந்தார்கள்; அவர்கள் அவரைப் பின்பற்றிக்கொண்டிருந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘லேவியின் வீட்டில்’; சிலர் இதை ‘இயேசுவின் வீட்டில்’ என்று புரிந்துகொள்கிறார்கள். கிரேக்க உரை ‘அவருடைய வீட்டில்’ என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: இருந்தபோது
  rationale: மாற்குவின் வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான கடந்தகாலக் கதைநடையாக அளிக்கிறது; தனியே ‘நிகழ்ந்தது’ என்று மொழிபெயர்த்தால் வாக்கியம் செயற்கையாகும்.
- source_word: κατακεῖσθαι
  choice: உணவுக்கு அமர்ந்திருந்த
  rationale: பண்டைய உணவுண்ணும் சாய்ந்திருக்கும் நிலையைக் குறிக்கிறது. நவீன தமிழில் ‘உணவுக்கு அமர்ந்திருந்த’ என்பது வெறுமனே படுத்திருந்தார் என்ற தவறான பொருளைத் தவிர்த்து உணவுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: தமது வீட்டில்
  rationale: கிரேக்கச் சொற்றொடரிலுள்ள உடைமைச் சுட்டைத் தக்கவைக்கிறது; வீடு லேவியுடையதா இயேசுவுடையதா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: τελῶναι
  choice: வரி வசூலிப்பவர்கள்
  rationale: அரசு வருவாயை வசூலித்தவர்களை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கும் இயல்பான சொல்.
- source_word: ἁμαρτωλοὶ
  choice: பாவிகள்
  rationale: மூலத்தின் நேரடியான, சமூக-சமய அடையாளச்சொல்லை விளக்கிச் சீராக்காமல் தக்கவைக்கிறது.
- source_word: συνανέκειντο
  choice: உணவுக்கு அமர்ந்திருந்தார்கள்
  rationale: இயேசுவுடனான கூட்டு உணவையும் உணவு நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μαθηταῖς
  choice: சீடர்களோடும்
  rationale: μαθητής என்பதற்கான நிலையான புதிய ஏற்பாட்டுத் தமிழ்; கற்றலும் பின்பற்றுதலும் கொண்ட உறவைத் தக்கவைக்கிறது.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: ஏனெனில், அவர்கள் பலர் இருந்தார்கள்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும் ‘பலர்’ என்ற வலியுறுத்தலையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: ἠκολούθουν αὐτῷ
  choice: அவர்கள் அவரைப் பின்பற்றி வந்தார்கள்
  rationale: முற்றுப்பெறாத காலத்தின் தொடர்ச்சியான அல்லது வழக்கமான பின்பற்றுதலை ‘வந்தார்கள்’ மூலம் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: αὐτοῦ (‘அவருடைய/தமது’) குறிக்கும் வீட்டின் உரிமையாளர்
  choice: முதன்மை உரையில் ‘தமது வீட்டில்’ என்று உரிமையாளரைப் பெயரிட்டு நிர்ணயிக்காமல் விடப்பட்டது.
  alternative: ‘லேவியின் வீட்டில்’ அல்லது ‘இயேசுவின் வீட்டில்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: உடனடி கிரேக்கத் தொடரில் αὐτοῦ என்பதன் முன்சுட்டு தெளிவாக நிர்ணயிக்கப்படவில்லை. பலர் அதை லேவியின் வீடாகவும் சிலர் இயேசுவின் வீடாகவும் புரிந்துகொள்கிறார்கள்; ஆகவே மூலத்தின் உண்மையான இருபொருள் வாய்ப்பு தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பண்டைய உணவு முறையைச் சொற்சொல்லாக ‘சாய்ந்திருந்தார்’ என வழங்காமல், சாதாரண வாசகருக்குப் புரியும் ‘உணவுக்கு அமர்ந்திருந்தார்’ என மொழியாக்கப்பட்டுள்ளது. ‘தமது’ என்பதன் இயல்பான தமிழ் பயன்பாடு ஒரே வாக்கியத்தில் இயேசுவை நோக்கிச் செல்லும் அபாயம் இருப்பதால், அடிக்குறிப்பு மூலத்தின் முன்சுட்டுத் தெளிவின்மையை வெளிப்படையாகக் காக்கிறது.
