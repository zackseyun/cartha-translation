id: MRK.2.26
reference: Mark 2:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: ta
  text: தலைமை ஆசாரியரான அபியத்தாரின் காலத்தில்[a] தாவீது எவ்வாறு இறைவனின் இல்லத்திற்குள் சென்று, ஆசாரியர்கள் தவிர வேறு யாரும் சாப்பிட அனுமதிக்கப்படாத இறைமுன் வைக்கப்பட்ட அப்பங்களை[b] சாப்பிட்டு, தன்னுடன் இருந்தவர்களுக்கும் கொடுத்ததை நீங்கள் வாசித்ததில்லையா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அபியத்தார் தலைமை ஆசாரியராக இருந்தபோது.” இந்தச் சொற்றொடர், தலைமை ஆசாரியரான அபியத்தாருடன் தொடர்புடைய காலத்தை அல்லது அந்த நிகழ்வின் கதைச்சூழலை இன்னும் பரந்த விதத்தில் குறிக்கவும் கூடும்.
    reason: alternative_reading
  - marker: b
    text: “இறைமுன் வைக்கப்பட்ட அப்பங்கள்” என்பது பரிசுத்த இடத்தில் இறைவனுக்கு முன்பாக வைக்கப்பட்ட அர்ப்பணிக்கப்பட்ட அப்பங்களைக் குறிக்கிறது; மரபாக இது “சமுகத்து அப்பம்” எனப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: எவ்வாறு ... என்பதை
  rationale: முந்தைய வசனத்தில் தொடங்கிய கேள்விக்குள் தாவீது செய்த செயலை விவரிக்கும் இயல்பான தமிழ் அமைப்பு; தனியே ‘எப்படி’ என்று மொழிபெயர்ப்பதைவிட இங்கு தமிழில் தெளிவாக அமைகிறது.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: இறைவனின் இல்லத்திற்குள் சென்று
  rationale: நுழைதலையும் புனித இடத்தையும் நேரடியாகக் காக்கிறது; ‘இறைவன்’ என்பது நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் உடையது.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: தலைமை ஆசாரியரான அபியத்தாரின் காலத்தில்
  rationale: ἐπί + genitive என்பதன் காலப்பொருளைக் காக்கிறது; அபியத்தாரின் பதவிக்காலம் என்ற மிகக் குறுகிய காலவரையறையை மொழிபெயர்ப்பிலேயே கட்டாயப்படுத்தவில்லை.
- source_word: ἄρτους τῆς προθέσεως
  choice: இறைமுன் வைக்கப்பட்ட அப்பங்கள்
  rationale: பரிசுத்த இடத்தில் இறைவனுக்கு முன்பாக வைக்கப்பட்ட அர்ப்பணிக்கப்பட்ட அப்பங்கள் என்ற வழிபாட்டுச் சொல்லின் பொருளை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ἔφαγεν
  choice: சாப்பிட்டு
  rationale: கதைநடை இறந்தகாலச் செயலை இயல்பான தமிழ் வினையெச்சத் தொடரில் தருகிறது.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: ஆசாரியர்கள் தவிர வேறு யாரும் சாப்பிட அனுமதிக்கப்படாத
  rationale: ἔξεστιν என்பதன் அனுமதி/சட்டத்தகுதி சார்ந்த பொருளையும், ஆசாரியர்களுக்கான விதிவிலக்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: தன்னுடன் இருந்தவர்களுக்கும் கொடுத்ததை
  rationale: உடன் இருந்தவர்களைக் குறிக்கும் கிரேக்கப் பங்கேற்புத் தொடரை நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது; கொடுத்த பொருள் முன் குறிப்பிடப்பட்ட அப்பங்கள் என்பதால் தமிழில் மீண்டும் சேர்க்கத் தேவையில்லை.
theological_decisions:
- issue: அபியத்தார் குறித்த காலச்சொற்றொடரும் 1 சாமுவேல் 21 நிகழ்வுடனான தொடர்பும்
  choice: முதன்மை உரையில் ‘தலைமை ஆசாரியரான அபியத்தாரின் காலத்தில்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அபியத்தார் தலைமை ஆசாரியராக இருந்தபோது’ அல்லது ‘தலைமை ஆசாரியர் அபியத்தாருடன் தொடர்புடைய நிகழ்வுப் பகுதியில்’
  rationale: கிரேக்கச் சொற்றொடர் பரந்த கால அல்லது நிகழ்வுச் சூழலைக் குறிக்கக்கூடும். ஆகவே 1 சாமுவேல் 21-உடனான காலவரிசைச் சிக்கலை மொழிபெயர்ப்பில் மறைத்தோ தீர்த்தோ விடாமல், உண்மையான தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தில் தொடங்கிய கேள்வியின் தொடராக இருப்பதால், தமிழில் முழுமையான கேள்வியாக இயல்பாக்க ‘தாவீது’ மற்றும் ‘நீங்கள் வாசித்ததில்லையா?’ என்பவை சூழலிலிருந்து வெளிப்படையாக வழங்கப்பட்டுள்ளன. ‘ஆசாரியர்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; வழிபாட்டுச் சிறப்புச் சொல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
