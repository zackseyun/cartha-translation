id: MRK.2.9
reference: Mark 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: ta
  text: முடக்குவாதத்தால் பாதிக்கப்பட்ட மனிதனிடம், ‘உன் பாவங்கள் மன்னிக்கப்படுகின்றன[a]’ என்று சொல்வதா, அல்லது ‘எழுந்து, உன் படுக்கைப் பாயை எடுத்துக்கொண்டு நட’ என்று சொல்வதா—எது எளிது?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன.” மன்னிக்கப்பட்டதன் விளைவாக இப்போது நிலவும் நிலையைக் கிரேக்க வினைச்சொல் வலியுறுத்துவதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: எது எளிது?
  rationale: ஒப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τῷ παραλυτικῷ
  choice: முடக்குவாதத்தால் பாதிக்கப்பட்ட மனிதனிடம்
  rationale: பக்கவாதம் அல்லது உடலின் ஒரு பகுதி மட்டும் செயலிழத்தல் என்று மிகக் குறிப்பாகக் கூறாமல், உடல் இயக்க முடக்கத்தால் பாதிக்கப்பட்ட நபரை மரியாதையுடனும் தெளிவாகவும் குறிக்கிறது.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: உன் பாவங்கள் மன்னிக்கப்படுகின்றன
  rationale: நிகழ்காலச் செயலற்ற வினை வடிவத்தின் அறிவிப்புத் தன்மையையும், மன்னிப்பின் செயற்பாட்டாளரை வெளிப்படையாகச் சேர்க்காத மூலமொழி அமைப்பையும் காக்கிறது.
- source_word: Ἔγειρε
  choice: எழுந்து
  rationale: கட்டளையின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἆρον
  choice: எடுத்துக்கொண்டு
  rationale: படுக்கைப் பாயைத் தூக்கி எடுத்துச் செல்லும் செயலைச் சூழலுக்கேற்ற வகையில் தெரிவிக்கிறது.
- source_word: τὸν κράβαττόν σου
  choice: உன் படுக்கைப் பாயை
  rationale: κράβαττος குறிக்கும் எளிய, எடுத்துச் செல்லக்கூடிய படுக்கும் விரிப்பைத் தெளிவாகக் காட்டுகிறது; நவீன கனமான கட்டிலைக் குறிக்கும் தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: περιπάτει
  choice: நட
  rationale: குணமடைந்தவர் நடக்க வேண்டும் என்ற கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: மன்னிப்பு அறிவிப்பின் காலம் மற்றும் நிலை
  choice: உன் பாவங்கள் மன்னிக்கப்படுகின்றன
  alternative: உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன
  rationale: இயேசு கூறும் அறிவிப்பையும் காணக்கூடிய குணமாக்கும் கட்டளையையும் ஒப்பிடும் கதையின் பதற்றத்தைப் பாதுகாக்கிறது. மன்னிப்பு முன்பே நிறைவேறிய செயல் என்று காலத்தை மிகையாகத் தீர்மானிக்காமலும், மன்னிப்பைச் செய்பவர் யார் என்பதை மூலவாக்கியத்தைவிட வெளிப்படையாகக் கூறாமலும் உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கேள்வி அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘முடக்குவாதத்தால் பாதிக்கப்பட்ட மனிதன்’ என்பது நபரை நோய்நிலையோடு முழுமையாக அடையாளப்படுத்துவதைத் தவிர்க்கிறது. நேரடி உரையின் கூர்மையும் இரு சொல்லாட்சிகளுக்கிடையிலான ஒப்பீடும் காக்கப்பட்டுள்ளன.
