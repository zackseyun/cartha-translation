source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் தொடர்ந்து சொல்லிவந்தார்: “ஓய்வுநாள் மனிதனுக்காக[a] உண்டானது; மனிதன் ஓய்வுநாளுக்காக உண்டாகவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “மனிதன்” என்பது ஓர் ஆணை மட்டும் குறிக்காமல், மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது; “மனிதகுலத்துக்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து சொல்லிவந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வினை வடிவத்தின் நீடித்த அல்லது மீண்டும் நிகழ்ந்த பேச்சு நுணுக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ σάββατον
  choice: ஓய்வுநாள்
  rationale: யூதர்களின் சப்தா நாளையும் அதன் அமைப்பையும் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வேதாகமச் சொல்.
- source_word: διὰ τὸν ἄνθρωπον
  choice: மனிதனுக்காக
  rationale: διά உடன் வரும் வேற்றுமை வடிவம் நோக்கம் அல்லது நன்மையைக் குறிக்கிறது. ஒருமையில் உள்ள ἄνθρωπος இங்கு மனிதர்கள் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
- source_word: ἐγένετο
  choice: உண்டானது
  rationale: ‘உண்டாகுதல்/தோன்றுதல்’ என்ற γίνομαι வினையின் பொருளைப் பாதுகாத்து, வெளிப்படையாகக் கூறப்படாத செய்பவரை மொழிபெயர்ப்பில் சேர்க்காமல் விடுகிறது.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: மனிதன் ஓய்வுநாளுக்காக உண்டாகவில்லை
  rationale: முந்தைய வாக்கியத்தின் வினையை இயல்பாக நிரப்பி, நோக்கத்தை எதிர்மறையாக ஒப்பிடும் கிரேக்கச் சொல்லாட்சியின் சமச்சீரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பொதுமைப் பொருளில் பயன்படுத்தப்பட்ட ஒருமை ἄνθρωπος
  choice: முதன்மை உரையில் ‘மனிதன்’; அடிக்குறிப்பில் அதன் அனைவரையும் உள்ளடக்கும் பொருள்
  alternative: மனிதகுலம் / மனிதர்கள்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையையும் இரு அரைவாக்கியங்களின் சொல்லாட்சி ஒற்றுமையையும் காக்கிறது; அதே நேரத்தில் இது ஆண்களை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἐγένετο என்பதில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாமை
  choice: ‘உண்டானது’ என்று செய்பவரைக் குறிப்பிடாமல் மொழிபெயர்த்தல்
  alternative: ‘ஏற்படுத்தப்பட்டது’ / ‘படைக்கப்பட்டது’
  rationale: தேவன் இதை ஏற்படுத்தினார் என்ற சூழல்சார்ந்த புரிதலை மறுக்காமல், மூலத்தில் வெளிப்படையாக இல்லாத செய்பவரையோ படைப்புச் சொல்லையோ உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தொடர்ந்து சொல்லிவந்தார்’ என்பது ἔλεγεν என்பதன் தொடர்நிலை நுணுக்கத்தை வெளிப்படுத்துகிறது; மேற்கோளில் உள்ள சுருக்கமான எதிர்மறை இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
