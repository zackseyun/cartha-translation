  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: ta
  text: மேலும், அவர்கள் நால்வரால் தூக்கிச் செல்லப்பட்ட முடக்குவாதம் உள்ள ஒருவரை அவரிடம் கொண்டு வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான்கு ஆண்களால்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘நால்வரால்’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அப்போது
  rationale: முந்தைய நிகழ்வுடன் இந்நிகழ்வை இணைக்கும் கதைத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது; இது கடுமையான காலவரிசையைச் சேர்க்காமல் இணைப்புச் செயல்பாட்டைத் தருகிறது.
- source_word: ἔρχονται
  choice: சிலர் ... கொண்டுவந்தார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை வாசிக்க இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது. கிரேக்கப் பன்மை வினையின் வெளிப்படாத எழுவாயைத் தமிழில் இயல்பாகக் காட்ட ‘சிலர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: φέροντες πρὸς αὐτὸν
  choice: அவரிடம் கொண்டுவந்தார்கள்
  rationale: ஒருவரை அவரை நோக்கிக் கொண்டுவரும் இயக்கத்தை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; αὐτόν என்பதிலுள்ள சுட்டுப்பெயரின் வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: παραλυτικὸν
  choice: முடக்குவாதமுற்ற ஒருவரை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையின் பொருளை, அந்த நபரை அவரது நிலையுடன் மட்டுமே அடையாளப்படுத்தாமல், தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: αἰρόμενον
  choice: தூக்கிவரப்பட்ட
  rationale: அந்த நபரை மற்றவர்கள் உடலால் சுமந்து வந்தார்கள் என்ற செயப்பாட்டு வினையெச்சப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑπὸ τεσσάρων
  choice: நால்வரால்
  rationale: கிரேக்கத்தில் உள்ள ‘நான்கு பேரால்’ என்ற சுருக்கத்தைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆண்கள்’ என்பதைக் முதன்மை உரையில் சேர்க்கவில்லை.
