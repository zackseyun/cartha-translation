  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ta
  text: எந்த இடத்தில் உங்களை ஏற்றுக்கொள்ளாமலும் உங்களுக்குச் செவிகொடுக்காமலும் இருக்கிறார்களோ, அங்கிருந்து புறப்படும்போது, அவர்களுக்குச் சாட்சியாக[a] உங்கள் கால்களில் படிந்திருக்கும் தூசியை உதறிவிடுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிரான சாட்சியாக.” கிரேக்கத்தில் “அவர்களுக்கு/அவர்களுக்கான சாட்சியாக” என்பதே நேரடியான பொருள்; ஆனால் செய்தியை நிராகரிப்பதன் சூழலில் இது அவர்களுக்கு எதிரான சாட்சியையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: கால்களில் படிந்த தூசியை உதறிவிடுவது, நிராகரிப்பவர்களிடமிருந்து தங்களைப் பிரித்துக்கொள்வதையும் அவர்களுக்கு எச்சரிக்கை விடுப்பதையும் குறிக்கும் அடையாளச் செயலாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: எந்த இடத்தினர் ... இருக்கிறார்களோ
  rationale: இந்தக் கிரேக்க அமைப்பு பொதுவான, வரையறுக்கப்படாத இடத்தைக் குறிக்கிறது. அடுத்துவரும் பன்மை வினையான ἀκούσωσιν காரணமாக, தமிழில் இயல்பாக மனிதர்களைக் குறிக்கும் ‘இடத்தினர்’ பயன்படுத்தப்பட்டது.
- source_word: μὴ δέξηται ὑμᾶς
  choice: உங்களை ஏற்றுக்கொள்ளாமலும்
  rationale: δέχομαι இங்கு தூதர்களை வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘ஏற்றுக்கொள்ளுதல்’ அதன் சமூக மற்றும் செய்தி சார்ந்த பொருள் பரப்பைத் திறந்தவாறே வைக்கிறது.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: உங்களுக்குச் செவிகொடுக்காமலும்
  rationale: ἀκούω இங்கு வெறுமனே ஒலி கேட்பதைவிட கவனித்துக் கேட்பதைக் குறிக்கிறது. ‘செவிகொடு’ என்பது கீழ்ப்படிதலை அளவுக்கு மீறி வலியுறுத்தாமல் அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: அங்கிருந்து புறப்படும்போது
  rationale: சூழ்நிலைப் பங்கேற்பு வினையின் காலத் தொடர்பையும் செயல்களின் வரிசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκτινάξατε
  choice: உதறிவிடுங்கள்
  rationale: ஒட்டியுள்ள தூசியை அசைத்து அகற்றும் செயலை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: உங்கள் கால்களுக்குக் கீழே இருக்கும் தூசியை
  rationale: ὑποκάτω என்பதன் ‘கீழே’ என்ற இடப்பொருளையும் கிரேக்கச் சொற்றொடரின் வெளிப்படையான படிமத்தையும் பாதுகாக்கிறது.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: அவர்களுக்கு எதிரான சாட்சியாக
  rationale: சொல்லமைப்பின்படி ‘அவர்களுக்குச் சாட்சியாக’ எனலாம்; நிராகரிப்பின் சூழலில் அந்தச் சாட்சி எச்சரிக்கை அல்லது எதிர்ச் சாட்சியாகச் செயல்படுவதால் முதன்மை உரையில் ‘எதிரான’ எனத் தரப்பட்டு, உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தூசியை உதறும் செயலின் சாட்சிப் பொருள்
  choice: நிராகரிப்பவர்களுக்கு எதிரான சாட்சி
  alternative: அவர்களுக்குச் சாட்சி; அவர்களுக்கான சாட்சி
  rationale: εἰς μαρτύριον αὐτοῖς என்ற சொற்றொடரில் αὐτοῖς நேரடியாக ‘அவர்களுக்கு’ என்று பொருள்படும்; ஆனால் நிராகரிப்புக்குப் பதிலாகச் செய்யப்படும் குறியீட்டுச் செயல் என்பதால் சூழல் எதிர்மறையான சாட்சியைச் சுட்டுகிறது. முதன்மை உரை சூழற்பொருளைத் தருகிறது; அடிக்குறிப்பு இலக்கண ரீதியிலான மாற்றைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘செவிகொடுக்க’ மற்றும் ‘உதறிவிடுங்கள்’ ஆகியவை இயல்பான நடையைப் பேணுகின்றன; கிரேக்கத்தின் சாட்சிப் பொருளிலுள்ள தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
