  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: ta
  text: அவர்களிடம் விடைபெற்றுவிட்டு[a], அவர் ஜெபிப்பதற்காக மலைக்குச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடம் பிரியாவிடை கூறிவிட்டு.”
    reason: ἀποταξάμενος என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: விடைபெற்றுவிட்டு
  rationale: ἀποτάσσομαι என்ற மத்திய வினை வடிவம் இங்கு ஒருவரிடம் விடைபெறுதல் அல்லது பிரியாவிடை கூறுதல் என்ற பொருளைத் தருகிறது. “விடைபெற்றுவிட்டு” என்பது இயல்பான நவீனத் தமிழில் அந்தச் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பன்மை வேற்றுமைச் சுட்டுப்பெயர் முன் சூழலில் குறிப்பிடப்பட்டவர்களைக் குறிக்கிறது; தமிழில் “விடைபெறு” என்பதுடன் “அவர்களிடம்” இயல்பாக அமைகிறது.
- source_word: ἀπῆλθεν
  choice: சென்றார்
  rationale: ἀπέρχομαι புறப்பட்டுச் செல்வதைக் குறிக்கிறது. முந்தைய “விடைபெற்றுவிட்டு” என்பதே பிரிந்து சென்ற கருத்தைத் தருவதால், தமிழில் “சென்றார்” என்பது இயல்பாகவும் போதுமானதாகவும் உள்ளது.
- source_word: εἰς τὸ ὄρος
  choice: மலைக்கு
  rationale: ὄρος என்பதன் நேரடியான பொருள் மலை அல்லது மலைப்பகுதி. குறிப்புச் சுட்டுடன் இருப்பதைத் தமிழில் கட்டாயமாகத் தனியே குறிக்க வேண்டியதில்லை; “மலைக்கு” என்பது குறிப்பிட்ட அந்த இடத்தை இயல்பாகக் காட்டுகிறது.
- source_word: προσεύξασθαι
  choice: ஜெபிப்பதற்காக
  rationale: இறந்தகால மத்திய infinitive இங்கு நோக்கத்தைக் குறிக்கிறது. “ஜெபிப்பதற்காக” என்பது அவர் மலைக்குச் சென்ற நோக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: —
  rationale: கிரேக்கத்தில் இது கதைத் தொடரைக் குறிக்கும் எளிய இணைப்புச்சொல். தனி வசனமாகத் தமிழில் “மேலும்” அல்லது “பின்பு” என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கக்கூடும்; தொடர்ச்சி வாக்கிய அமைப்பிலேயே வெளிப்படுகிறது.
theological_decisions:
- issue: “மலை” என்பதன் குறிப்பு
  choice: எந்த அடையாள அல்லது இறையியல் பொருளையும் சேர்க்காமல், உறுதியான இடக் குறிப்பாக “மலை” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “ஒரு மலை” என்று பொதுமைப்படுத்துதல் அல்லது சிறப்பு வெளிப்பாட்டின் இடமாக விளக்குதல்.
  rationale: கிரேக்க மூலத்தில் குறிப்புச் சுட்டு இருந்தாலும், அந்த மலைக்கு அடையாளப் பொருள் எதுவும் இவ்வசனத்தில் விளக்கப்படவில்லை. தமிழில் “மலைக்கு” என்பது சூழலில் அறியப்பட்ட இடத்தை இயல்பாகக் குறிக்கிறது; உரையில் இல்லாத இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. “விடைபெற்றுவிட்டு” பேச்சுவழக்காகத் தாழாமல் இயல்பாக உள்ளது; “ஜெபிப்பதற்காக” கிறிஸ்தவத் தமிழ் வாசகர்களுக்குப் பரிச்சயமானதும் தெளிவானதும் ஆகும்.
