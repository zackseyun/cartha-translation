source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: ta
  text: ஏனெனில், ஏரோது தானே ஆட்களை அனுப்பி யோவானைக் கைது செய்து, அவரைக் கட்டிச் சிறையில் வைத்தான்; ஏரோதின் சகோதரனாகிய பிலிப்புவின் மனைவி ஏரோதியாளை அவன் திருமணம் செய்திருந்ததால் இவ்வாறு செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் சொல்லுக்குச் சொல்: “அனுப்பி யோவானைப் பிடித்தான்.” அதாவது, ஏரோது ஆட்களை அனுப்பி யோவானைக் கைதுசெய்ய வைத்தான்.'
    reason: மூலத்தின் சுருக்கமான முகவாண்மைக் கட்டமைப்பையும் சொற்சார்ந்த மாற்றையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: ஏனெனில், ஏரோது தானே
  rationale: γὰρ முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; Αὐτός தரும் வலியுறுத்தலை இயல்பான தமிழில் ‘தானே’ காக்கிறது.
- source_word: ἀποστείλας ἐκράτησεν
  choice: ஆட்களை அனுப்பி ... கைதுசெய்து
  rationale: ἀποστείλας என்பதற்கு வெளிப்படையான கருமம் இல்லாவிட்டாலும், ஏரோது ஆட்களை அனுப்பி அதிகாரபூர்வமாக யோவானைப் பிடிக்கச் செய்த முகவாண்மை தமிழில் தெளிவாகிறது; ἐκράτησεν இச்சூழலில் காவலில் எடுத்தலைக் குறிக்கிறது.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: சிறையில் கட்டிவைத்திருந்தான்
  rationale: δέω என்பதன் நேரடியான ‘கட்டு’ உணர்வையும் φυλακή என்பதன் சிறைச்சூழலையும் காக்கிறது; சங்கிலி என்று மூலத்தில் இல்லாத விவரம் சேர்க்கப்படவில்லை.
- source_word: διὰ Ἡρῳδιάδα
  choice: அவள் நிமித்தமே
  rationale: διά + accusative காரணத்தைக் குறிக்கிறது. பெயரை முன்னரே குறிப்பிட்டபின் ‘அவள் நிமித்தமே’ என்பது இயல்பாகவும் காரண வலியுறுத்தலுடனும் உள்ளது.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: ஏரோதின் சகோதரனாகிய பிலிப்புவின் மனைவி
  rationale: γυνή இங்கு ‘மனைவி’ எனப் பொருள்படுகிறது; αὐτοῦ யாரைக் குறிக்கிறது என்பதை தமிழில் தெளிவுபடுத்த ‘ஏரோதின்’ எனத் திரும்பக் கூறப்பட்டுள்ளது.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: ஏரோது திருமணம் செய்திருந்ததால்
  rationale: γαμέω என்பதற்கு ‘திருமணம் செய்’ என்பது இயல்பான இணை. இத்திருமணம் கைது நடவடிக்கைக்கு முன்பிருந்த நிலை என்பதால் தமிழில் இறந்தகால நிறைவு உணர்வு தரப்பட்டுள்ளது.
theological_decisions:
- issue: ஏரோதின் திருமணத்தின் ஒழுக்க அல்லது நியாயப்பிரமாண நிலை
  choice: இந்த வசனத்தில் நிகழ்வின் காரணம் மட்டும் விவரிக்கப்படுகிறது; சட்டவிரோதம் என்ற மதிப்பீடு சேர்க்கப்படவில்லை.
  alternative: திருமணம் முறைகேடானது என்று வசனத்திலேயே வெளிப்படையாகச் சொல்லுதல்.
  rationale: அடுத்தடுத்த சூழல் அந்த ஒழுக்க மற்றும் சட்டச் சிக்கலை விளக்குகிறது; இவ்வாக்கியம் தானாக அத்தகைய மதிப்பீட்டை வெளிப்படையாகக் கூறவில்லை.
- issue: ஏரோது நேரடியாகக் கைது செய்தாரா அல்லது ஆட்கள் மூலம் செய்தாரா
  choice: ‘ஆட்களை அனுப்பி’ என்று முகவாண்மையைத் தெளிவுபடுத்துதல்.
  alternative: ‘அனுப்பி யோவானைப் பிடித்தான்’ என்று முகவர்களை மறைமுகமாக மட்டும் விடுதல்.
  rationale: அரசனான ஏரோது அனுப்பியதன் மூலம் கைது நடவடிக்கையை மேற்கொண்டான் என்ற இயல்பான வரலாற்றுச் சூழலைத் தமிழ் தெளிவாக வெளிப்படுத்துகிறது; இதை அடிக்குறிப்பும் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘கைதுசெய்து’, ‘சிறையில் கட்டிவைத்திருந்தான்’ என்பவை சட்ட மற்றும் உடற்கட்டுப்பாட்டு கருத்துகளை வேறுபடுத்திக் காட்டுகின்றன. இருமுறை வரும் காரண அமைப்பு தமிழில் குழப்பமில்லாமல் இருக்க வாக்கியம் இரண்டாகப் பிரிக்கப்பட்டுள்ளது.
