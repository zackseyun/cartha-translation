  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: ta
  text: அவர்கள் புறப்பட்டுச் சென்று, மக்கள் மனந்திரும்ப வேண்டும் என்று அறிவித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘அவர்கள் மனந்திரும்ப வேண்டும்’; இங்குள்ள ‘அவர்கள்’ என்பது அவர்களுடைய அறிவிப்பைக் கேட்டவர்களைக் குறிக்கிறது.
    reason: மறைந்துள்ள பன்மை எழுவாயைக் கொண்ட கிரேக்க வடிவத்தின் சொற்சொல் மாற்றையும் அதன் குறிப்பையும் பதிவு செய்வதற்கு.
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: கிரேக்கத்தில் இது எளிய தொடரிணைப்பு. தமிழில் வாக்கியத் தொடக்கத்தில் தனியாக ‘மேலும்’ அல்லது ‘பின்பு’ சேர்ப்பது இயல்பற்றதாகவோ தேவையற்ற காலநுட்பத்தைச் சேர்ப்பதாகவோ இருக்கும்; தொடர்ச்சியான உரைநடையே இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ἐξελθόντες
  choice: புறப்பட்டுச் சென்று
  rationale: சீடர்கள் வெளியே சென்று பணியைத் தொடங்கியதை இயல்பான தமிழ் வினையெச்சத் தொடராகத் தருகிறது; கிரேக்க இறந்தகால வினையெச்சத்துக்கும் முதன்மை வினைக்கும் உள்ள வரிசையையும் காக்கிறது.
- source_word: ἐκήρυξαν
  choice: அறிவித்தார்கள்
  rationale: κηρύσσω என்பதன் பொதுவெளியில் அதிகாரப்பூர்வமாக அறிவிக்கும் பொருளைத் தருகிறது; உடனடிச் சூழலில் இல்லாத பிற்காலச் சபைசார் நுண்ணுணர்வை ‘பிரசங்கித்தார்கள்’ என்பதுபோல் தேவையின்றி ஏற்றுவதில்லை.
- source_word: ἵνα
  choice: வேண்டும் என்று
  rationale: இங்கு அறிவிப்பின் உள்ளடக்கமாக எதிர்பார்க்கப்படும் பதிலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μετανοῶσιν
  choice: மனந்திரும்ப
  rationale: μετανοέω என்பதன் மனப்பாங்கும் வாழ்க்கைத் திசையும் மாறி கடவுளிடம் திரும்பும் நிறைவான நற்செய்தி நூல் பொருளைச் சுருக்கமாகவும் மரபாகவும் தருகிறது; வெறும் எண்ணமாற்றமாகக் குறுக்குவதில்லை.
theological_decisions:
- issue: μετανοῶσιν என்ற பன்மை வினையின் மறைந்துள்ள எழுவாயை வெளிப்படையாகக் காட்டுவதா
  choice: மக்கள் மனந்திரும்ப வேண்டும்
  alternative: அவர்கள் மனந்திரும்ப வேண்டும்
  rationale: கிரேக்கத்தில் மறைந்துள்ள எழுவாய் சீடர்களை அல்ல, அவர்களுடைய அறிவிப்பைக் கேட்டவர்களைக் குறிக்கிறது. தமிழில் ‘அவர்கள்’ என்பது சீடர்களையே குறிக்கிறதுபோல் குழப்பம் தரக்கூடும்; ‘மக்கள்’ என்பது எந்தக் கோட்பாட்டுச் சேர்க்கையும் இன்றி குறிக்கப்பட்ட கேட்போரைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனந்திரும்ப’ என்பது பொதுவாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொல்லாக இருப்பதுடன், வெறும் அறிவுசார் எண்ணமாற்றத்தைவிட மூலச்சொல்லின் விரிவான அழைப்பைக் காக்கிறது.
