source:
  edition: SBLGNT
  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: ta
  text: அவர்களுடைய நம்பாமையால் அவர் வியந்தார்[a]. அவர் சுற்றுவட்டாரக் கிராமங்களுக்குச் சென்று போதித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய நம்பாமையைக் கண்டு அவர் ஆச்சரியப்பட்டார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் கிராமங்களிடையே சுற்றிச் சென்று போதித்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: வியப்படைந்தார்
  rationale: θαυμάζω என்பதன் வியப்பு அல்லது ஆச்சரியம் என்ற நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. இறந்தகாலத் தொடர்நிலையைத் தமிழில் வற்புறுத்திக் கூறுவது செயற்கையாக இருப்பதால், சூழலுக்கு இயல்பான இறந்தகால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: அவர்கள் நம்பாததால்
  rationale: διά + accusative இங்கு காரணத்தைக் குறிக்கிறது. ἀπιστίαவை வெறும் நம்பிக்கைத் தளர்ச்சியாக மென்மைப்படுத்தாமல், அவர்கள் நம்பாத நிலையாகத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: περιῆγεν
  choice: சென்று ... போதித்துவந்தார்
  rationale: περιάγωவின் imperfect வடிவம் இடமிருந்து இடம் தொடர்ந்து சென்ற செயலைக் குறிக்கிறது. ‘போதித்துவந்தார்’ என்ற தொடர்நிலை வடிவம் பயணத்துடன் நடைபெற்ற தொடர்ச்சியான ஊழியத்தை இயல்பாகக் காட்டுகிறது.
- source_word: τὰς κώμας
  choice: கிராமங்களுக்கு
  rationale: κώμη என்பதற்கான தெளிவான, பொதுவாகப் புரியும் நவீனத் தமிழ் சொல் ‘கிராமம்’.
- source_word: κύκλῳ
  choice: சுற்றிலுமிருந்த
  rationale: சுற்றுப்புறத்தில் இருந்த கிராமங்களையோ சுற்றிவரும் பயணத்தையோ குறிக்கக்கூடிய adverbial பொருளை இயல்பான தமிழில் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: διδάσκων
  choice: போதித்துவந்தார்
  rationale: முதன்மை வினையுடன் ஒரே நேரத்தில் நடைபெற்ற போதித்தல் செயலைத் தமிழின் இயல்பான தொடர்நிலை வினையால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு அவர்களுடைய நம்பாமையைக் கண்டு வியந்ததாகக் கூறும் உரையின் இறையியல் பதற்றம்
  choice: அவர்கள் நம்பாததால் அவர் வியப்படைந்தார்.
  alternative: அவர்கள் நம்பாததைக் கண்டு அவர் ஆச்சரியப்பட்டார்.
  rationale: இயேசுவின் வியப்பைத் தணிக்கவோ, அதற்கான இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவோ செய்யாமல், மூல உரை கூறுவதை நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதே நேரத்தில் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவிசுவாசம்’ என்ற சமயவழக்குச் சொல்லுக்குப் பதிலாக இயல்பான ‘நம்பாததால்’ தேர்ந்தெடுக்கப்பட்டது; κύκλῳ என்பதிலுள்ள சுற்றுப்புறம்/சுற்றுப்பயணம் என்ற நுண் இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
