  source_fidelity: முதன்மையான சிக்கல் பிரதிப்பெயரின் குறிப்பில் உள்ளது. φανερὸν ... τὸ ὄνομα αὐτοῦ என்பதில் αὐτοῦ என்பது ஏரோதுவை அல்ல, முந்தைய சூழலில் வரும் இயேசுவைக் குறிக்கிறது. வரைவு, ஏரோது உடனடியாக முன்னிலையில் இருப்பதால், “அவருடைய பெயர்” என்பதை ஏரோதுவின் பெயராக வாசிக்கச் செய்கிறது. இயேசுவின் பெயரை வெளிப்படையாகக் குறிப்பிடுவது தமிழில் தேவையான தெளிவாக்கம்; மூலத்தின் பொருளை மாற்றாது. ἐγήγερται-யின் செயப்பாட்டு நிறைவுநிலை, δυνάμεις-இன் திறந்த பொருள், மற்றும் ἐν αὐτῷ-இன் நேரடியான உறவு மற்றபடி நன்றாகப் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: நடை பொதுவாக நவீன தரத் தமிழுக்கு ஏற்றது. “பரவலாக அறியப்பட்டிருந்தது” என்பது “எல்லாருக்கும் தெரியவந்திருந்தது” என்பதைவிட φανερόν ἐγένετο-வின் ‘பொதுவாக/வெளிப்படையாக அறியப்பட்டது’ என்ற கருத்தை அளவுக்கு மீறாமல் இயல்பாகத் தருகிறது. “இதன் காரணமாக” என்பது διὰ τοῦτο-வின் காரணத் தொடர்பை “-தான்” என்ற கூடுதல் வலியுறுத்தல் இன்றி தருகிறது.
  terminology: “அரசன் ஏரோது,” “திருமுழுக்கு அளிக்கும் யோவான்,” “எழுப்பப்பட்டிருக்கிறார்,” மற்றும் “வல்லமைகள்” ஆகிய தேர்வுகள் மூலத்திற்கும் திட்டத்தின் சொற்களஞ்சிய அணுகுமுறைக்கும் பொருந்துகின்றன. மரபுவழி “திருமுழுக்கு யோவான்” மற்றும் செயப்பாட்டை விடக் குறைவாகத் துல்லியமான “உயிர்த்தெழுந்திருக்கிறார்” ஆகியவை அடிக்குறிப்புகளில் சரியாகக் கொடுக்கப்பட்டுள்ளன.
