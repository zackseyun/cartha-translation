id: MRK.6.14
reference: Mark 6:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: ta
  text: அரசன் ஏரோது இதைக் கேள்விப்பட்டான்; ஏனெனில் இயேசுவின் பெயர் பரவலாக அறியப்பட்டிருந்தது. மக்கள், “திருமுழுக்கு அளிக்கும் யோவான்[a] இறந்தோரிலிருந்து எழுப்பப்பட்டிருக்கிறார்[b]. இதன் காரணமாக இந்த வல்லமைகள்[c] அவரில் செயல்படுகின்றன” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “திருமுழுக்கு யோவான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இறந்தோரிலிருந்து உயிர்த்தெழுந்திருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை செயப்பாட்டு வடிவில், “எழுப்பப்பட்டிருக்கிறார்” என்று உள்ளது.
    reason: alternative_reading
  - marker: c
    text: “அற்புத வல்லமைகள்” அல்லது “வல்ல செயல்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: அரசன் ஏரோது
  rationale: βασιλεύς என்பதன் நேர்பொருளான ‘அரசன்’ என்பதையும் தமிழின் இயல்பான பெயரமைப்பையும் பயன்படுத்துகிறது.
- source_word: ἤκουσεν
  choice: இதைக் கேள்விப்பட்டான்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய நிகழ்வுகளைச் சுட்டும் ‘இதை’ தமிழ் நடையில் இயல்பாகத் தருகிறது.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: ஏனெனில், அவருடைய பெயர் எல்லாருக்கும் தெரியவந்திருந்தது
  rationale: ‘அவருடைய பெயர் வெளிப்படையானது’ என்ற கிரேக்கச் சொல்லமைப்பை, பெயர் அல்லது புகழ் பரவலாக அறியப்பட்டதைக் குறிக்கும் இயல்பான தமிழில் தருகிறது; பிரதிப்பெயரைப் பெயர்ச்சொல்லாக மாற்றாமல் காக்கிறது.
- source_word: ἔλεγον
  choice: மக்கள் ... சொல்லிக்கொண்டிருந்தார்கள்
  rationale: எழுவாய் குறிப்பிடப்படாத பன்மை வினையை ‘மக்கள்’ எனத் தமிழ் இயல்பில் வெளிப்படுத்தி, தொடர்ந்த செயலை ‘சொல்லிக்கொண்டிருந்தார்கள்’ எனக் காட்டுகிறது.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: திருமுழுக்கு அளிக்கும் யோவான்
  rationale: ὁ βαπτίζων என்பது பட்டப்பெயரைக் காட்டிலும் ‘திருமுழுக்கு அளிப்பவர்’ என்ற வினைச்செயல் பொருளைக் கொண்ட பங்கேற்புப் பெயர்; அதை தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து எழுப்பப்பட்டிருக்கிறார்
  rationale: ἐγείρω என்பதன் நிறைவுநிலைச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, உயிர்த்தெழுதல் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: διὰ τοῦτο
  choice: அதனால்தான்
  rationale: முந்தைய கூற்றை அடுத்த கூற்றுக்கான காரணமாக இணைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐνεργοῦσιν
  choice: செயல்படுகின்றன
  rationale: நிகழ்காலத்தில் தொடர்ந்து இயங்குவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: αἱ δυνάμεις
  choice: இந்த வல்லமைகள்
  rationale: δύναμις என்பதன் பன்மையையும் அதன் ‘வல்லமை/அற்புதச் செயல்’ என்ற பொருள் விரிவையும் முதன்மை உரையில் மிகையாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ἐν என்பதன் நேரடியான ‘அவரில்’ என்ற உறவைப் பாதுகாக்கிறது; ‘அவர் மூலமாக’ எனக் கருவிப்பொருளாக விளக்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் ἐγήγερται என்பதன் செயப்பாட்டு வடிவம்
  choice: எழுப்பப்பட்டிருக்கிறார்
  alternative: உயிர்த்தெழுந்திருக்கிறார்
  rationale: கிரேக்க வினை வெளிப்படையாகச் செயப்பாட்டு வடிவில் இருப்பதால் அதை முதன்மை உரையில் காக்கிறது; செய்பவர் யார் என்பதை உரை கூறாத நிலையையும் மாற்றவில்லை.
- issue: Ἰωάννης ὁ βαπτίζων என்பதைக் பட்டப்பெயராகவா வினைச்செயல் பெயராகவா தருவது
  choice: திருமுழுக்கு அளிக்கும் யோவான்
  alternative: திருமுழுக்கு யோவான்
  rationale: கிரேக்கப் பங்கேற்புப் பெயரின் வினைச்செயல் வலிமையை முதன்மை உரையில் வெளிப்படுத்துகிறது; பரிச்சயமான மரபுவழிப் பட்டப்பெயரை அடிக்குறிப்பில் தருகிறது.
- issue: αἱ δυνάμεις என்பது வல்லமைகளையா அற்புதச் செயல்களையா குறிக்கிறது
  choice: வல்லமைகள்
  alternative: அற்புத வல்லமைகள் அல்லது வல்ல செயல்கள்
  rationale: கிரேக்கப் பன்மைப் பெயர்ச்சொல்லின் பொருள் பரப்பை முதன்மை உரையில் திறந்தவாறே வைத்து, சாத்தியமான சூழல் பொருள்களை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘திருமுழுக்கு அளிக்கும்’ என்பது செயல் பொருளை வெளிப்படுத்துகிறது; ‘வல்லமைகள்’ மற்றும் ‘அவரில்’ ஆகியவை கிரேக்கத்தின் பொருள் திறப்பை மிகையாக விளக்காமல் காக்கின்றன.
