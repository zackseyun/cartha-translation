  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: ta
  text: அவர்கள் நூறு நூறாகவும் ஐம்பது ஐம்பதாகவும் குழு குழுவாகச் சாய்ந்து அமர்ந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ப்பொருளில், “தோட்டப் பாத்திகள், தோட்டப் பாத்திகள்”; ஒழுங்கான வரிசைகள் அல்லது பிரிவுகள் போல அமைந்த குழுக்களைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: சாய்ந்து அமர்ந்தார்கள்
  rationale: விருந்துண்ணும் சூழலில் உணவுக்காக இடம்பிடித்துச் சாய்ந்து அமர்வதை இந்த வினை குறிக்கிறது. வெறும் ‘அமர்ந்தார்கள்’ என்பதைவிட மூலத்தின் உணவுப் பந்தி நுணுக்கத்தை இது காக்கிறது.
- source_word: πρασιαὶ πρασιαὶ
  choice: குழுக்களாக
  rationale: πρασιά என்பதன் நேர்ப்பொருள் தோட்டப் பாத்தி; இங்கு ஒழுங்காகப் பிரிக்கப்பட்ட கூட்டங்களை உருவகமாகக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘குழுக்களாக’ என மொழிபெயர்த்து, மூல உருவகத்தை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: κατὰ ἑκατὸν
  choice: நூறு நூறாக
  rationale: κατά எண்களுடன் பகிர்வுத் தன்மையைக் குறிக்கிறது. தமிழில் ‘நூறு நூறாக’ என்பது ஒவ்வொரு குழுவிலும் நூறு பேர் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κατὰ πεντήκοντα
  choice: ஐம்பது ஐம்பதாக
  rationale: முந்தைய தொடருக்கு இணையாக, ஒவ்வொரு குழுவிலும் ஐம்பது பேர் என்ற பகிர்வுப் பொருளை ‘ஐம்பது ஐம்பதாக’ காக்கிறது.
theological_decisions: []
