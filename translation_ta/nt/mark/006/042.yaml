  text: And they all ate and were satisfied.
translation:
  language: ta
  text: அவர்கள் எல்லாரும் சாப்பிட்டுத் திருப்தியடைந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: ἐσθίω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவமான இது, சாதாரணமாக உண்பதைக் குறிக்கிறது. நவீனத் தமிழில் ‘சாப்பிட்டார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; தேவையில்லாமல் ‘உணவை’ என்ற செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: சூழலில் உள்ள முழுக் கூட்டத்தையும் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டிலான பன்மை வடிவம். ‘அவர்கள் எல்லாரும்’ என்பது மறைந்துள்ள எழுவாயைத் தெளிவாக்கி, அனைவரையும் உள்ளடக்கும் பொருளைப் பேணுகிறது.
- source_word: ἐχορτάσθησαν
  choice: திருப்தியடைந்தார்கள்
  rationale: χορτάζω என்பதன் இந்த வடிவம், போதுமான அளவு உண்டு நிறைவடைந்ததைக் குறிக்கிறது. ‘திருப்தியடைந்தார்கள்’ என்பது வெறும் மனநிறைவு அல்லாமல், இவ்வுணவுச் சூழலில் வயிறார உண்ட நிறைவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: καὶ ... καὶ
  choice: -உம் ... -த்து ...
  rationale: முதல் καί தொடரின் தொடக்க இணைப்பாக உள்ளது; தமிழில் தனியாக ‘மேலும்’ என்று தொடங்குவதைவிட முந்தைய நிகழ்வுடன் ‘-உம்’ மூலமும், அடுத்த செயலை வினையெச்சமான ‘சாப்பிட்டுத்’ மூலமும் இணைப்பது இயல்பான தொடர் நடையைத் தருகிறது. இரு செயல்களுக்கிடையேயான நேரடியான இணைப்பு பேணப்பட்டுள்ளது.
