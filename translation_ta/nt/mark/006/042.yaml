translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், இயல்பான, கண்ணியமான நடை. மூலத்தின் சுருக்கமும் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலும் பேணப்பட்டுள்ளன.
