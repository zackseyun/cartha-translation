translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களே’ என்பதில் மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின் நேரடியாக வைக்கப்பட்டுள்ளன.
