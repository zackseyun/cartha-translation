source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களுக்குப் பதிலளித்து, “நீங்களே அவர்களுக்குச் சாப்பிட ஏதாவது கொடுங்கள்” என்றார். அதற்கு அவர்கள், “நாங்கள் போய் இருநூறு தினாரி செலவில்[a] அப்பங்களை[b] வாங்கி, அவர்களுக்குச் சாப்பிடக் கொடுக்க வேண்டுமா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தினாரி என்பது பொதுவாக ஒரு தொழிலாளியின் அல்லது படைவீரனின் ஒரு நாள் கூலியாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: கிரேக்கச் சொல் ἄρτους என்பதற்கு ‘அப்பங்கள்’ அல்லது ‘ரொட்டி’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்து ... என்றார்
  rationale: கிரேக்கத்தின் ‘பதிலளித்து சொன்னார்’ என்ற இரட்டை வினை அமைப்பைத் தமிழில் இயல்பாகவும் அதன் பதில் கூறும் தன்மையைத் தெளிவாகவும் வழங்குகிறது.
- source_word: Δότε
  choice: கொடுங்கள்
  rationale: δίδωμι என்பதன் நேரடியான கட்டளைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்களே
  rationale: வினையுடன் வெளிப்படையாக வந்துள்ள வலியுறுத்தப்பட்ட பிரதிப்பெயரின் அழுத்தத்தைத் தமிழில் ‘-ஏ’ மூலம் காட்டுகிறது.
- source_word: φαγεῖν
  choice: சாப்பிட ஏதாவது
  rationale: ‘உண்ணும்படி கொடுங்கள்’ என்பதைக் காட்டிலும் நவீன பொதுத் தமிழில் இயல்பாக இருந்து, கொடுக்கப்படுவது உணவு என்பதைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: நாங்கள் போய் ... வாங்க ... வேண்டுமா?
  rationale: இது ஆலோசனை/எதிர்வினா நயமுள்ள subjunctive கேள்வி; ‘போய் வாங்க வேண்டுமா?’ என்பது அதன் நயத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: δηναρίων διακοσίων
  choice: இருநூறு தினாரிக்கு
  rationale: விலையைக் குறிக்கும் genitive அமைப்பைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: ἄρτους
  choice: அப்பங்களை
  rationale: பன்மை வடிவத்தைப் பாதுகாத்து, அக்காலச் சூழலில் தனித்தனி அப்பங்களையோ ரொட்டிகளையோ குறிக்கக்கூடிய சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: அவர்களுக்குச் சாப்பிடக் கொடுக்க
  rationale: இயேசுவின் கட்டளையிலுள்ள ‘கொடு’ என்ற வினையுடன் உள்ள சொல் ஒற்றுமையைத் தக்கவைத்து, ‘உணவளிக்க’ என்று சுருக்குவதைத் தவிர்க்கிறது.
