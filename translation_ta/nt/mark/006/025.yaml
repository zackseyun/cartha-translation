source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: ta
  text: அவள் உடனே அரசனிடம் விரைந்து உள்ளே சென்று, “திருமுழுக்கு அளிப்பவரான யோவானின் தலையை நீர் இப்போதே ஒரு தட்டில் எனக்குக் கொடுக்க வேண்டும் என்று விரும்புகிறேன்” என்று கேட்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: உள்ளே சென்று
  rationale: அரசன் இருந்த இடத்திற்குள் அவள் சென்றதை இயல்பான தமிழில் கூறுகிறது; வினையெச்ச வடிவம் தொடர்ச்சியான நிகழ்வோட்டத்தையும் காக்கிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரையில் காணப்படும் உடனடித் தன்மையையும் கதையின் வேகத்தையும் தெளிவாகக் காக்கிறது.
- source_word: μετὰ σπουδῆς
  choice: விரைந்து
  rationale: விரைவையும் அவசரத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மகிழ்ச்சியான ஆர்வம் இருந்ததாகத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: βασιλέα
  choice: அரசனிடம்
  rationale: ஏரோது வரலாற்றில் குறுநில ஆட்சியாளராக இருந்தாலும், மூலவசனம் βασιλεύς என்று கூறுவதால் அதை அப்படியே மொழிபெயர்க்கிறது.
- source_word: ᾐτήσατο
  choice: கேட்டாள்
  rationale: αἰτέω என்பதன் வேண்டுகோள் வைக்கும் பொருளை நேரடியாகத் தருகிறது; கோரிக்கையின் கடுமை மேற்கோள் பேச்சிலிருந்தே வெளிப்படுகிறது.
- source_word: Θέλω
  choice: விரும்புகிறேன்
  rationale: அவளுடைய தெளிவான விருப்பத்தை வெளிப்படுத்துகிறது; அதை கட்டளையாக மாற்றாமல் மூலத்தின் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: ἵνα ... δῷς μοι
  choice: நீர் எனக்குக் கொடுக்க வேண்டும் என்று
  rationale: அவள் விரும்பிய காரியத்தின் உள்ளடக்கத்தை இயல்பான தமிழில் தருகிறது. அரசனை நேரடியாக அழைப்பதால் மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐξαυτῆς
  choice: இப்போதே
  rationale: செயல் தாமதமின்றி அக்கணமே நடைபெற வேண்டும் என்ற வலியுறுத்தலைக் காக்கிறது; முன் வரும் εὐθὺς என்பதிலிருந்து இதைத் தனியே மொழிபெயர்க்கிறது.
- source_word: ἐπὶ πίνακι
  choice: ஒரு தட்டில் வைத்து
  rationale: விருந்துச் சூழலில் πίναξ குறிக்கும் பரிமாறும் தட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὴν κεφαλήν
  choice: தலையை
  rationale: கதையின் கொடூரமான குறிப்பை மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: திருமுழுக்காளரான யோவானின்
  rationale: βαπτιστής என்பதை ஒரு மரபுப் பெயராக மட்டும் ஒலிபெயர்க்காமல், திருமுழுக்கு அளிப்பவர் என்ற அதன் விளக்கப் பொருளுடன் தருகிறது.
theological_decisions:
- issue: Ἰωάννου τοῦ βαπτιστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: திருமுழுக்காளரான யோவான்
  alternative: ஸ்நானகனான யோவான்
  rationale: βαπτιστής என்பது யோவானின் பணியை விவரிக்கும் பட்டம். தேர்ந்தெடுக்கப்பட்ட வடிவம் அதன் பொருளை நவீன தமிழில் வெளிப்படுத்துகிறது; மரபு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உடனே’ மற்றும் ‘இப்போதே’ ஆகிய இரண்டும் முறையே εὐθὺς, ἐξαυτῆς என்பவற்றின் தனித்தனி உடனடித் தன்மையைப் பாதுகாக்கின்றன. அரசனை நோக்கிய நேரடி உரையில் ‘நீர்’ என்பது மரியாதை ஒருமையாக அமைந்துள்ளது.
