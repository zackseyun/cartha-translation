revisions:
- from: அவர்கள் பல பேய்களை வெளியேற்றிவந்தார்கள்; நோயுற்ற பலருக்கு எண்ணெய்[a] பூசி, அவர்களைக் குணமாக்கிவந்தார்கள்.
  to: அவர்கள் பல தீய ஆவிகளை வெளியேற்றினார்கள்; பல நோயாளிகளுக்கு எண்ணெய்[a] பூசி, அவர்களைக் குணமாக்கினார்கள்.
  rationale: The revision replaces a potentially misleading modern Tamil term for demons with ‘தீய ஆவிகள்’ and removes marked -வந்தார்கள் auxiliaries that are not required to represent the Greek imperfect in Tamil. It retains the source’s straightforward coordination of exorcism, oil application, and healing, without implying a mechanism for the oil or a doctrinal conclusion.
