id: MRK.6.13
reference: Mark 6:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: ta
  text: அவர்கள் பல தீய ஆவிகளை வெளியேற்றினார்கள்; பல நோயாளிகளுக்கு எண்ணெய்[a] பூசி, அவர்களைக் குணமாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒலிவ எண்ணெய்.”
    reason: ἔλαιον என்பது பொதுவாக ‘எண்ணெய்’ என்று பொருள்படும்; பண்டைய மத்தியதரைக் கடல் சூழலில் அது ஒலிவ எண்ணெயைக் குறிக்கவும் முடியும்.
lexical_decisions:
- source_word: δαιμόνια
  choice: பேய்கள்
  rationale: δαιμόνιον என்பது தீய ஆவிகளைக் குறிக்கிறது. அருகிலுள்ள வசனங்களில் வரும் ‘அசுத்த ஆவிகள்’ என்ற வேறு சொல்லாட்சியை இங்கு புகுத்தாமல், தமிழில் நேரடியாகவும் இயல்பாகவும் உள்ள ‘பேய்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πολλὰ / πολλούς
  choice: பல / பலருக்கு
  rationale: இரு இடங்களிலும் πολύς அளவைக் குறிக்கிறது. பேய்களுக்கும் நோயுற்ற மக்களுக்கும் பொருந்துமாறு தமிழில் இயல்பான வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐξέβαλλον
  choice: வெளியேற்றிவந்தார்கள்
  rationale: இறந்தகால முற்றுப்பெறாத வினை வடிவம் தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் நடந்த செயலைச் சுட்டுகிறது; ‘-வந்தார்கள்’ அதைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἤλειφον
  choice: எண்ணெய் பூசி
  rationale: ἀλείφω என்பது பூசுதல் அல்லது தடவுதல் எனப் பொருள்படும். எண்ணெயுடன் வரும் இச்சூழலில் ‘எண்ணெய் பூசி’ இயல்பாக உள்ளது; இதைத் தொடர்ந்து வரும் தொடர்வினை வடிவம் நிகழ்வின் மீள்நடைத் தன்மையையும் தாங்குகிறது.
- source_word: ἐλαίῳ
  choice: எண்ணெய்
  rationale: ἔλαιον பொதுவாக எண்ணெயையும், பண்டைய மத்தியதரைக் கடல் சூழலில் பெரும்பாலும் ஒலிவ எண்ணெயையும் குறிக்கும். மூலத்தின் பொதுவான சொல்லை முதன்மை உரை காக்கிறது; குறிப்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀρρώστους
  choice: நோயுற்றவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ἄρρωστος நோயுற்ற மக்களைக் குறிக்கிறது. வேற்றுமை உருபுடன் ‘நோயுற்ற பலருக்கு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἐθεράπευον
  choice: குணமாக்கிவந்தார்கள்
  rationale: θεραπεύω இங்கு குணமாக்குதல் எனப் பொருள்படும். ‘-வந்தார்கள்’ என்ற வடிவம் தொடர்ந்து அல்லது பலமுறை நடந்த செயலைக் காக்கிறது.
- source_word: καὶ
  choice: ; / மற்றும் வினைத்தொடர் இணைப்பு
  rationale: மீண்டும் வரும் καί செயல்களை எளிய தொடராக இணைக்கிறது. தமிழில் மிகைத் திருப்பம் வராமல் அரைப்புள்ளியும் ‘பூசி’ என்ற வினையெச்ச இணைப்பும் அதே தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: எண்ணெய் பூசுதலுக்கும் குணமாக்குதலுக்கும் இடையிலான தொடர்பு
  choice: சீடர்கள் எண்ணெய் பூசியதும் குணமாக்கியதும் வரலாற்றுச் செயல்களாக மட்டும் விவரிக்கப்படுகின்றன.
  alternative: எண்ணெயே குணமாக்கியது என்றோ, அது எந்தப் பங்கும் இல்லாத வெறும் அடையாளம் என்றோ வெளிப்படையாகக் கூறுதல்.
  rationale: எண்ணெய் பூசுதலின் இறையியல் செயல்முறையை வசனம் விளக்கவில்லை. ஆகவே பிற்காலச் சடங்கு அல்லது கோட்பாட்டு முடிவைச் சேர்க்காமல், மூலத்தில் உள்ள செயல்களின் தொடர்பும் தீர்க்கப்படாத இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வெளியேற்றிவந்தார்கள்’ மற்றும் ‘குணமாக்கிவந்தார்கள்’ ஆகிய வடிவங்கள் கிரேக்க இறந்தகால முற்றுப்பெறாத வினைகளின் தொடர்ச்சி அல்லது மீள்நடைத் தன்மையைத் தெளிவாகக் காக்கின்றன.
