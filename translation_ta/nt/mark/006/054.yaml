  edition: SBLGNT
  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: ta
  text: அவர்கள் படகிலிருந்து இறங்கியதும், அங்கிருந்த மக்கள் உடனே அவரை அடையாளம் கண்டுகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: ‘அவர்கள் படகிலிருந்து இறங்கியதும், உடனே அவரை அடையாளம் கண்டுகொண்டு…’ கிரேக்கத்தில் ‘அடையாளம் கண்டவர்கள்’ யார் என்பது வெளிப்படையாகக் கூறப்படவில்லை; சூழல் அவர்களை அந்தப் பகுதி மக்கள் என்று காட்டுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: அவர்கள் படகிலிருந்து இறங்கியதும்
  rationale: மரபுத்தொடரான genitive absolute அமைப்பை, செயல் முடிந்த உடனேயே அடுத்த நிகழ்வு நடந்ததை இயல்பாக உணர்த்தும் கால வாக்கியமாகத் தமிழில் மொழிபெயர்க்கிறது.
- source_word: πλοίου
  choice: படகு
  rationale: கலிலேயக் கடல் சூழலில் πλοῖον என்பது பொதுவாகச் சிறிய படகு அல்லது மீன்பிடிப் படகைக் குறிக்கிறது; நவீனத் தமிழில் ‘படகு’ இயல்பான இணைச்சொல்.
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் நடையில் மீண்டும் மீண்டும் வரும் உடனடித் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐπιγνόντες
  choice: அடையாளம் கண்டுகொண்டார்கள்
  rationale: இங்கு ἐπιγινώσκω என்பது இயேசுவைப் பார்த்து அவர் யார் என்று அறிந்துகொண்டதைக் குறிக்கிறது; ‘அடையாளம் கண்டுகொண்டார்கள்’ அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் இந்தப் பதிலிப்பெயர் இயேசுவைக் குறிக்கிறது; மரியாதையான தமிழ் வழக்கில் ‘அவரை’ பொருத்தமானது.
- source_word: implicit subject of ἐπιγνόντες
  choice: அங்கிருந்த மக்கள்
  rationale: கிரேக்கத்தில் ἐπιγνόντες என்பதன் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. ஆனால் அதன் nominative plural வடிவம் genitive absolute-இல் உள்ள αὐτῶν என்பதுடன் இயல்பாக இணைவதில்லை; அடுத்த வசனமும் அந்தப் பகுதி மக்களையே சுட்டுகிறது. ஆகவே தமிழில் தவறான தொடர்பைத் தவிர்க்க ‘அங்கிருந்த மக்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவை அடையாளம் கண்டவர்கள் யார்?
  choice: அங்கிருந்த மக்கள் அவரை அடையாளம் கண்டுகொண்டார்கள்
  alternative: ‘அவர்கள் அவரை அடையாளம் கண்டுகொண்டார்கள்’ என்று எழுவாயைத் தெளிவுபடுத்தாமல் விடுதல்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; தொடரியல் மற்றும் சூழல் சார்ந்த தீர்மானம். கிரேக்கப் பங்கேற்புவினையின் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், அடுத்த வசனத்தில் அந்தப் பகுதி மக்கள் ஓடிச் செல்வது அவர்களே இயேசுவை அடையாளம் கண்டவர்கள் என்பதைத் தெளிவாக்குகிறது. இருப்பினும் மூலத்தின் மறைமுகத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கியதும்’ மற்றும் ‘உடனே’ ஆகியவை நிகழ்வுகளின் நெருக்கத்தையும் மாற்குவின் வேகமான நடையையும் காக்கின்றன.
