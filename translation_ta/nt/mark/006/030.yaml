source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: ta
  text: அப்போஸ்தலர்கள் இயேசுவிடம் ஒன்றுகூடி, தாங்கள் செய்தவை, கற்பித்தவை அனைத்தையும் அவரிடம் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: ஒன்றுகூடி
  rationale: கதையோட்டத்தில் வரும் நிகழ்கால வினை வரலாற்று நிகழ்காலமாகச் செயல்படுகிறது; தமிழில் இறந்தகால நிகழ்வோடு இயல்பாக இணையும் வினையெச்சம் கூட்டாக வந்து சேர்ந்ததைக் காட்டுகிறது.
- source_word: οἱ ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: இங்கு பணிக்காக அனுப்பப்பட்ட பன்னிருவரைக் குறிக்கும் நிலைபெற்ற வேதாகமப் பதவிப்பெயரைத் தக்கவைக்கிறது.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: இயேசுவிடம்
  rationale: πρός உடன் வரும் வேற்றுமை இயேசுவை நோக்கி வந்து அவரிடம் கூடுவதைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பான வெளிப்பாடு.
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: பணியிலிருந்து திரும்பியவர்கள் தாங்கள் செய்தவற்றை அவரிடம் அறிக்கையிடும் பொருளை தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: தாங்கள் செய்தவை, கற்பித்தவை அனைத்தையும்
  rationale: πάντα என்பதன் முழுமையையும், செய்ததும் கற்பித்ததும் என்ற இணையான இரு கூறுகளையும் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ἀπόστολοι என்ற குழுப் பெயரின் பொருள்
  choice: அப்போஸ்தலர்கள்
  alternative: தூதுவர்கள் / அனுப்பப்பட்டவர்கள்
  rationale: மாற்குவில் பணிக்காக அனுப்பப்பட்ட பன்னிருவருக்கான அடையாளப் பெயராக இது வருகிறது; பொதுவான ‘தூதுவர்கள்’ என்று மொழிபெயர்த்தால் அந்தச் சூழல்சார் பங்கு மறைந்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. ‘செய்தவை, கற்பித்தவை அனைத்தையும்’ என்பது கிரேக்கத்தின் இணையான இரு ὅσα கூறுகளையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
