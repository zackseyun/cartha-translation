revisions:
- from: ஏனெனில், ஏரோது யோவானுக்குப் பயந்தான்; அவர் நீதியும் பரிசுத்தமும் உள்ளவர் என்பதை அறிந்திருந்ததால், அவரைப் பாதுகாத்துவந்தான். அவர் பேசுவதை ஏரோது கேட்டபோது, மிகவும் குழம்பிப்போனான்[a]; ஆனாலும் அவர் பேசுவதை விருப்பத்துடன் கேட்டுவந்தான்.
  to: ஏனெனில், ஏரோது யோவானுக்குப் பயந்தான்; யோவான் நீதிமானும் பரிசுத்தமானவரும் என்பதை அறிந்திருந்ததால், அவரைப் பாதுகாத்துவந்தான். யோவானைக் கேட்டபோது, அவன் மிகவும் திகைத்தான்[a]; ஆனாலும் அவரை மகிழ்ச்சியுடன் கேட்டுவந்தான்.
  rationale: The revision retains the critical-text reading and the ambiguity/tension of Herod's response. It uses more natural Tamil predicates for John's character, keeps the protective nuance of συνετήρει, and renders ἠπόρει with a less resultative expression. The footnote remains anchored to the disputed clause and updates its quoted wording to match the revised text.
