id: MRK.6.20
reference: Mark 6:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: ta
  text: ஏனெனில், ஏரோது யோவானுக்குப் பயந்தான்; யோவான் நீதிமானும் பரிசுத்தமானவரும் என்பதை அறிந்திருந்ததால், அவரைப் பாதுகாத்துவந்தான். யோவானைக் கேட்டபோது, அவன் மிகவும் திகைத்தான்[a]; ஆனாலும் அவரை மகிழ்ச்சியுடன் கேட்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “மிகவும் திகைத்தான்” என்பதற்குப் பதிலாக “பல காரியங்களைச் செய்தான்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: பயந்தான்
  rationale: தொடர்ந்து நிலவிய அச்சத்தையும் யோவானின் குணத்தால் ஏற்பட்ட மரியாதை கலந்த மனநிலையையும் சூழல் உணர்த்த இடமளிக்கிறது; ‘மதித்தான்’ என்று மென்மைப்படுத்தவில்லை.
- source_word: εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον
  choice: அவர் நீதியும் பரிசுத்தமும் உள்ளவர் என்பதை அறிந்திருந்ததால்
  rationale: காரணப் பொருளுடைய பங்கேற்பு வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; δίκαιον மற்றும் ἅγιον ஆகிய இரு தனித்த பண்புகளையும் காக்கிறது.
- source_word: συνετήρει αὐτόν
  choice: அவரைப் பாதுகாத்துவந்தான்
  rationale: இச்சூழலில் யோவானுக்குத் தீங்கு நேராதபடி ஏரோது காத்தான் என்ற பாதுகாப்புப் பொருள் இயல்பானது; இறந்தகாலத் தொடர்நிலையையும் காட்டுகிறது.
- source_word: ἀκούσας αὐτοῦ
  choice: அவர் பேசுவதை ஏரோது கேட்டபோது
  rationale: ஒருவரைக் கேட்டல் என்ற கிரேக்க மரபுத்தொடரின் பொருளைத் தமிழில் தெளிவுபடுத்த ‘பேசுவதை’ சேர்க்கிறது; காலத் தொடர்பையும் காக்கிறது.
- source_word: πολλὰ ἠπόρει
  choice: மிகவும் குழம்பிப்போனான்
  rationale: ἠπόρει என்பதன் திகைப்பு அல்லது என்ன செய்வதென்று தெரியாத நிலையை இயல்பான நவீன தமிழில் தருகிறது; πολλά வலியுறுத்தலாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: ஆனாலும் அவர் பேசுவதை விருப்பத்துடன் கேட்டுவந்தான்
  rationale: ἡδέως என்பதன் மனமுவந்த அல்லது விருப்பமான கேட்டலைக் காட்டுகிறது; முந்தைய குழப்பத்துடனான பதற்றத்தை ‘ஆனாலும்’ வெளிப்படுத்துகிறது; தொடர்ச்சியான செயலை ‘கேட்டுவந்தான்’ காட்டுகிறது.
theological_decisions:
- issue: யோவானைக் கேட்டபின் ஏரோதின் எதிர்வினை குறித்த பாட வேறுபாடு
  choice: 'SBLGNT வாசகமான ἠπόρει: ‘மிகவும் குழம்பிப்போனான்’'
  alternative: 'ἐποίει: ‘பல காரியங்களைச் செய்தான்’'
  rationale: வழங்கப்பட்ட மூலப் பதிப்பு ἠπόρει என்று வாசிக்கிறது. இது ஏரோதின் குழப்பத்தையும், இருந்தும் அவர் யோவானை விருப்பத்துடன் கேட்டதையும் உள்ள பதற்றத்தோடு காக்கிறது. பொருளை முக்கியமாக மாற்றும் மாற்றுப் பாடம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. யோவானைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், அரசனான ஏரோதுக்கு கதைநடை ஒருமை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க இறந்தகாலத் தொடர்நிலையை தேவையான இடங்களில் ‘-வந்தான்’ வடிவம் வெளிப்படுத்துகிறது.
