  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: ta
  text: மிகவும் துயரமடைந்த ராஜா, தான் செய்த சத்தியங்களினாலும் விருந்தில் சாய்ந்து அமர்ந்திருந்தவர்களினாலும்[a] அவளை மறுக்க[b] விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருந்தினர்களினாலும்.” கிரேக்கச் சொல், உணவின்போது வழக்கமான முறையில் சாய்ந்து அமர்ந்திருந்தவர்களை நேரடியாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளை நிராகரிக்க.” இங்கு அவளுடைய வேண்டுகோளை ஏற்காமல், அவளுக்கு அளித்த வாக்குறுதியை ஒதுக்கிவிட அவன் விரும்பவில்லை என்பது கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: மிகவும் துயரமடைந்தான்
  rationale: ஆழமான மனத்துயரைக் குறிக்கும் சொல்லின் தீவிரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: γενόμενος
  choice: துயரமடைந்தான்
  rationale: நிலைமாற்றத்தைக் குறிக்கும் பங்கேற்புவினையின் பொருளைத் தமிழில் இறந்தகால வினையாக இயல்பாகக் கொண்டுவருகிறது.
- source_word: ὁ βασιλεὺς
  choice: ராஜா
  rationale: மாற்கு ஏரோதைக் குறிப்பிடப் பயன்படுத்தும் கிரேக்கச் சொல்லை நேரடியாகவும் பொதுவாகப் புரியும் வகையிலும் மொழிபெயர்க்கிறது.
- source_word: διὰ τοὺς ὅρκους
  choice: தான் செய்த சத்தியங்களினிமித்தம்
  rationale: διά இங்கு காரணத்தைக் குறிக்கிறது; சத்தியங்கள் ராஜா செய்தவையே என்பதைச் சூழலிலிருந்து இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: τοὺς ἀνακειμένους
  choice: விருந்தில் சாய்ந்து அமர்ந்திருந்தவர்கள்
  rationale: உணவின்போது சாய்ந்த நிலையில் அமர்ந்திருந்தவர்களைக் குறிக்கும் கிரேக்கச் சொல்லின் விருந்து சார்ந்த காட்சியைப் பாதுகாக்கிறது.
- source_word: οὐκ ἠθέλησεν
  choice: விரும்பவில்லை
  rationale: இயலாமையை அல்ல, மனவிருப்பமின்மையைச் சுட்டும் θέλω என்பதன் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀθετῆσαι αὐτήν
  choice: அவளை மறுக்க
  rationale: அவளையோ அவளுடைய கோரிக்கையையோ ஏற்காமல் ஒதுக்கிவிடுதல் என்ற சூழல்சார் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: γενόμενος என்ற பங்கேற்புவினைக்கும் முதன்மை வினைக்கும் இடையிலான உறவு
  choice: முதல் கருத்தைத் தனி வாக்கியமாக்கி, ‘ஆனாலும்’ மூலம் மறைமுகமான எதிர்மறைத் தொடர்பைக் காட்டுதல்
  alternative: ‘ராஜா மிகவும் துயரமடைந்து’ என்று தொடர்ச்சியான ஒரே வாக்கியமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் இணைப்புச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், ராஜாவின் துயரத்திற்கும் அவன் அவளை மறுக்க விரும்பாததற்கும் இடையே சூழல் உணர்த்தும் முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது; அவனுடைய செயலை நியாயப்படுத்தும் மேலதிக விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சத்தியங்கள்,’ ‘விருந்தில் சாய்ந்து அமர்ந்திருந்தவர்கள்,’ ‘அவளை மறுக்க’ ஆகிய சொற்றொடர்கள் மூலத்தின் காரண உறவையும் விருந்து நடைபெறும் சூழலையும் ராஜாவின் மனவிருப்பத்தையும் காக்கின்றன.
