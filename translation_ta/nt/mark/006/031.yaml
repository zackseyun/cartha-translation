translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. நேரடி உரையில் மரியாதைப் பன்மை அல்லாமல் சீடர்களைக் குறிக்கும் இயல்பான பன்மை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் கூறுகளுக்குப் பின் வைக்கப்பட்டுள்ளன.
