source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் மட்டும் தனியாக ஒதுக்குப்புறமான ஓர் இடத்துக்கு வாருங்கள்[a]; சற்று ஓய்வெடுங்கள்” என்றார். ஏனெனில், வருகிறவர்களும் போகிறவர்களும் பலராக இருந்ததால், அவர்கள் உண்பதற்குக்கூட நேரம் கிடைக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒதுக்குப்புறமான ஓர் இடம்” என்பதற்கு “தனிமையான ஓர் இடம்” அல்லது “குடியிருப்பில்லாத ஓர் இடம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நவீன அர்த்தத்தில் ஒரு மணற்பாலையை அவசியமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “உண்பதற்குக்கூட வாய்ப்பு கிடைக்கவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: Δεῦτε
  choice: வந்து
  rationale: இது அழைப்பைக் குறிக்கும் கட்டளை; இயேசுவுடன் வேறோர் இடத்துக்குச் செல்லும் அழைப்பைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: நீங்கள் மட்டும் தனியாக
  rationale: வலியுறுத்தும் பிரதிப்பெயர்களும் ‘தனியே’ என்ற சொற்றொடரும் சீடர்கள் மற்றவர்களிடமிருந்து விலகிச் செல்வதை வலியுறுத்துகின்றன; மூலத்தின் இரட்டை வலியுறுத்தலை இத்தொடர் காக்கிறது.
- source_word: ἔρημον τόπον
  choice: மக்கள் நடமாட்டமில்லாத ஓர் இடம்
  rationale: ἔρημος என்பது நவீன அர்த்தத்தில் மணற்பாலை என்பதை அவசியமாகக் குறிக்காமல், தனிமையான அல்லது குடியிருப்பில்லாத இடத்தைக் குறிக்கிறது.
- source_word: ἀναπαύσασθε
  choice: ஓய்வெடுங்கள்
  rationale: வேலையை நிறுத்தி உடல் வலிமையை மீட்டுக்கொள்வதைக் குறிக்கும் நடுத்தரக் கட்டளைக்கு இயல்பான நவீனத் தமிழ்.
- source_word: ὀλίγον
  choice: சற்று
  rationale: குறுகிய காலத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες
  choice: வருகிறவர்களும் போகிறவர்களும்
  rationale: மக்களின் தொடர்ச்சியான வருகை, புறப்பாடு ஆகியவற்றை நிகழ்நிலைப் பெயரெச்ச வடிவில் நெருக்கமாகக் காக்கிறது.
- source_word: πολλοί
  choice: பலராக
  rationale: மக்களின் அதிக எண்ணிக்கையைத் தெளிவாகக் குறிக்கிறது.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: உண்பதற்குக்கூட நேரம் கிடைக்கவில்லை
  rationale: εὐκαιρέω குறிக்கும் நேரம் அல்லது வாய்ப்பு கிடைத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; οὐδέ என்பதன் வலியுறுத்தலை ‘கூட’ காக்கிறது.
