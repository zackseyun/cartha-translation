revisions:
- from: அங்கே அவர் எந்த வல்லமையான செயலையும் செய்ய இயலவில்லை[a]. ஆனால் நோயுற்ற சிலர்மேல் தம் கைகளை வைத்து அவர்களைக் குணமாக்கினார்.
  to: சில நோயாளிகள்மேல் தம் கைகளை வைத்து அவர்களைக் குணமாக்கியதைத் தவிர, அங்கே அவர் எந்த வல்லமைமிக்க செயலையும் செய்ய இயலவில்லை[a].
  rationale: The revision retains the source’s unsoftened statement of inability and its limited healing exception, while replacing a general contrast marker with an explicit exception construction. It also uses more idiomatic modern Tamil for ‘a few sick people’ and preserves the footnote’s explanation of Markan δύναμις.
