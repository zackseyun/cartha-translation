id: MRK.6.5
reference: Mark 6:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: ta
  text: சில நோயாளிகள்மேல் தம் கைகளை வைத்து அவர்களைக் குணமாக்கியதைத் தவிர, அங்கே அவர் எந்த வல்லமைமிக்க செயலையும் செய்ய இயலவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்த அற்புதத்தையும்’ அல்லது ‘வல்லமையின் எந்த செயலையும்’; கிரேக்கத்தில் சொற்சொல்லாக, ‘எந்த வல்லமையையும்’ என்று உள்ளது. மாற்கு நற்செய்தியில் இது அற்புதச் செயல்களைக் குறிக்கப் பயன்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: செய்ய இயலவில்லை
  rationale: மறுப்புடன் வரும் δύναμαι என்பதன் நேரடியான இயலாமைப் பொருளைப் பாதுகாக்கிறது; அதை வெறும் விருப்பமின்மையாக மென்மைப்படுத்தவில்லை.
- source_word: ποιῆσαι
  choice: செய்ய
  rationale: ποιέω என்பதன் பரந்த, இயல்பான பொருளைத் தக்கவைத்து, δύναμιν உடனான கிரேக்கச் சொல்லாட்சியை தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οὐδεμίαν δύναμιν
  choice: எந்த வல்லமையான செயலையும்
  rationale: மாற்குவில் அற்புதச் செயலைக் குறிக்கும் δύναμις என்பதன் ‘வல்லமை’ தொடர்பைத் தக்கவைக்கிறது; ‘அற்புதம்’ என்பது சாத்தியமான ஆனால் சற்றே விளக்கவுரையான மாற்று.
- source_word: εἰ μὴ
  choice: ஆனால்
  rationale: முந்தைய முழுமையான மறுப்புக்குப் பின்வரும் விதிவிலக்கை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: ὀλίγοις ἀρρώστοις
  choice: நோயுற்ற சிலர்மேல்
  rationale: எண்ணிக்கையின் குறைவையும் நோயுற்ற நிலையையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: தம் கைகளை வைத்து
  rationale: கைகளை உடல்மேல் வைக்கும் நிகழ் செயலைத் தெளிவாகப் பாதுகாக்கிறது; ‘தம்’ என்பது இயேசுவின் கைகளைக் குறிக்கும் மரியாதையான இயல்பான தமிழ்.
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: θεραπεύω என்பதன் நோய்நீக்கும் பொருளை நவீன பொதுத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: οὐκ ἐδύνατο என்பது இயேசுவுக்கு ஓர் இயலாமையைச் சுட்டுவதாகத் தோன்றும் இறையியல் பதற்றம்
  choice: ‘அவர் ... செய்ய இயலவில்லை’ என்ற நேரடிப் பொருளைத் தக்கவைத்தல்
  alternative: ‘அவர் செய்ய விரும்பவில்லை’ அல்லது வெறுமனே ‘செய்யவில்லை’
  rationale: கிரேக்க உரை மறுப்புடன் δύναμαι என்பதைத் தெளிவாகப் பயன்படுத்துகிறது. காரணத்தை மொழிபெயர்ப்பிலேயே இறையியல் ரீதியாகத் தீர்க்காமல், உரையின் உண்மையான பதற்றத்தைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வல்லமையான செயல்’ என்பது மூலத்தின் δύναμις தொடர்பைப் பாதுகாக்கிறது; ‘செய்ய இயலவில்லை’ என்பது உரையின் இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் வழங்குகிறது.
