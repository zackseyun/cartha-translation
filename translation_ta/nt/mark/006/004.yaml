theological_decisions:
- issue: தீர்க்கதரிசிக்குக் கிடைக்கும் மதிப்பைப் பற்றிய இயேசுவின் பழமொழியின் பொருள் வரம்பு
  choice: இயேசு தமக்குப் பொருத்திக் கூறும் பொதுவான தீர்க்கதரிசிப் பழமொழியாகவே மொழிபெயர்க்கப்பட்டுள்ளது; அவருடைய அடையாளத்தைப் பற்றிய கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
  alternative: இயேசு தம்மை நிராகரிக்கப்பட்ட மேசியா என்று வெளிப்படையாக அடையாளப்படுத்துகிறார் என விரித்துரைத்தல், அல்லது பொதுவாக அவிசுவாசத்தைப் பற்றிய கூற்றாக மாற்றுதல்.
  rationale: கிரேக்க வசனம் பழக்கமான சூழல்களில் தீர்க்கதரிசி மதிப்புப் பெறாததை மட்டுமே கூறுகிறது. சூழல் இதை இயேசுவுக்குப் பொருத்தினாலும், மொழிபெயர்ப்பு வசனம் சொல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்கக் கூடாது.
