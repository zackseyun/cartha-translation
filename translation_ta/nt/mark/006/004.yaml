  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் பழமொழி வடிவிலுள்ள மறுப்பு–விதிவிலக்கு அமைப்பு ‘தவிர வேறெங்கும் … இருப்பதில்லை’ எனப் பாதுகாக்கப்பட்டுள்ளது.
