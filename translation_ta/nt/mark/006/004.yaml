base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “ஒரு தீர்க்கதரிசி தன் சொந்த ஊரிலும்[a], தன் உறவினர்களிடையிலும்[b], தன் வீட்டாரிடையிலும்[c] தவிர வேறெங்கும் மதிப்பில்லாதவராக இருப்பதில்லை” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சொந்த இடம்’ அல்லது ‘தாயகம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒருவரின் பூர்வீக இடத்தைக் குறிக்கிறது; இங்கு நாசரேத் சூழலுக்கு ‘சொந்த ஊர்’ பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சொந்தக்காரர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் உறவினர்களையோ ஒரே உறவுக் குழுவைச் சேர்ந்தவர்களையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘வீட்டிலும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கட்டடமான வீட்டையோ அதில் உள்ள குடும்பத்தாரையோ குறிக்கலாம்; ‘உறவினர்கள்’ என்பதிலிருந்து வேறுபடுத்த இங்கு ‘வீட்டார்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
