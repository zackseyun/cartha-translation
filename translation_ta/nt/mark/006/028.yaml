revisions:
- from: அவன் அவருடைய தலையை ஒரு பரிமாறும் தட்டில் வைத்து கொண்டுவந்து, அதை அந்தப் பெண்ணிடம் கொடுத்தான்; அந்தப் பெண் அதைத் தன் தாயிடம் கொடுத்தாள்.
  to: அவன் அவருடைய தலையை ஒரு தட்டில் வைத்து கொண்டு வந்து, அதை அந்தச் சிறுமியிடம் கொடுத்தான்; அந்தச் சிறுமி அதைத் தன் தாயிடம் கொடுத்தாள்.
  rationale: The revision retains the Greek narrative sequence and repeated verb while rendering κοράσιον more precisely as ‘சிறுமி.’ It uses a natural Tamil verbal sequence and supplies a lexical note for πίναξ anchored to ‘தட்டில்,’ the relevant source expression.
