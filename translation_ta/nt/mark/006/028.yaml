translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க மூலத்தில் உள்ள தொடர்ச்சியான ‘கொடுத்தான்/கொடுத்தாள்’ என்ற கதைநடை மீளுரு பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையின் footnote marker, அதன் இடம் πίνακι அல்லாமல் ‘girl’ என்பதற்குப் பின் தவறாக அமைந்திருந்ததால், மூலச் சொல் இங்கு போதுமான தெளிவுடன் ‘பரிமாறும் தட்டு’ என வழங்கப்பட்டு அடிக்குறிப்பு சேர்க்கப்படவில்லை.
