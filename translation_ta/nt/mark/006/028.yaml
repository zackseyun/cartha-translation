source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: ta
  text: அவன் அவருடைய தலையை ஒரு தட்டில் வைத்து கொண்டு வந்து, அதை அந்தச் சிறுமியிடம் கொடுத்தான்; அந்தச் சிறுமி அதைத் தன் தாயிடம் கொடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκεν
  choice: வைத்து கொண்டுவந்து
  rationale: φέρω என்ற வினையின் இறந்தகால வடிவம் இங்கு துண்டிக்கப்பட்ட தலையை விருந்து நடைபெறும் இடத்துக்குக் கொண்டுவரும் உடல்சார்ந்த செயலைக் குறிக்கிறது. ἐπὶ πίνακι என்பதோடு இயல்பாக இணைவதற்காக ‘வைத்து கொண்டுவந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κεφαλὴν αὐτοῦ
  choice: அவருடைய தலையை
  rationale: முந்தைய சூழலில் சுட்டப்படுபவர் யோவான். தமிழில் மரியாதையுடனும் இயல்பாகவும் ஆண்பால் ஒருமைப் பெயர்ச்சுட்டை வெளிப்படுத்த ‘அவருடைய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπὶ πίνακι
  choice: ஒரு பரிமாறும் தட்டில்
  rationale: πίναξ என்பது உணவு பரிமாறப் பயன்படும் அகன்ற தட்டு அல்லது பாத்திரத்தைக் குறிக்கலாம். விருந்துச் சூழலைத் தெளிவுபடுத்தும் இயல்பான நவீனத் தமிழாக ‘பரிமாறும் தட்டு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: ἔδωκεν
  choice: கொடுத்தான் / கொடுத்தாள்
  rationale: δίδωμι என்பதன் நேரடியான பொருள் ‘கொடு’. கிரேக்கத்தில் இரு உட்பிரிவுகளிலும் வரும் வினைமீளுருவை தமிழிலும் காத்து, எழுவாயின் பாலுக்கேற்ப வினைமுற்று அமைக்கப்பட்டுள்ளது.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: அந்தப் பெண் / அந்தப் பெண்ணிடம்
  rationale: κοράσιον இளம் வயதுடைய பெண்ணைக் குறிக்கிறது. ‘பெண்’ என்பது நவீனத் தமிழில் இயல்பானது; முன்னரே அறிமுகமான நபர் என்பதைக் காட்ட ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: τῇ μητρὶ αὐτῆς
  choice: தன் தாயிடம்
  rationale: αὐτῆς அந்தப் பெண்ணையே சுட்டுகிறது. வாக்கியத்தின் எழுவாயோடு உடைமை உறவைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘தன் தாயிடம்’ பயன்படுத்தப்பட்டுள்ளது.
