translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. அரைப்புள்ளி, படகின் இருப்பிடத்துக்கும் இயேசுவின் இருப்பிடத்துக்கும் இடையிலான மாறுபாட்டைத் தெளிவாக்குகிறது. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘மாலை’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு ἐπὶ τῆς γῆς என்பதைக் குறிக்கிறது; ஆகவே தமிழில் அது ‘நிலத்தில்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
