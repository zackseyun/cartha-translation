source:
  edition: SBLGNT
  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: ta
  text: மாலை நேரமானபோது, படகு கடலின் நடுவில் இருந்தது; அவரோ தனியாக நிலத்தில்[a] இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கரையில்.’ கிரேக்க மூலத்தில் ‘நிலத்தில்’ என்று உள்ளது; இது கடலில் இருந்த படகின் இருப்பிடத்துடன் அவரது இருப்பிடத்தை வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: மாலை நேரமானபோது
  rationale: இந்தத் தனித்த வேற்றுமைத் தொடர் காலச் சூழலைக் குறிக்கிறது. மாலை வந்துவிட்ட நிலையை இயல்பான நவீனத் தமிழில் இவ்வாறு தெரிவிக்கிறது.
- source_word: πλοῖον
  choice: படகு
  rationale: கலிலேயச் சூழலில் குறிப்பிடப்படுவது பெரிய கப்பல் அல்ல; ‘படகு’ என்பது பொருத்தமான, இயல்பான சொல்.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: கடலின் நடுவில்
  rationale: கரையிலிருந்து விலகிக் கடலின் நடுப்பகுதியில் இருந்த இடத்தைக் கிரேக்கத் தொடருக்கு நெருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: θάλασσα
  choice: கடல்
  rationale: புவியியல் அடிப்படையில் இது ஓர் ஏரியாக இருந்தாலும், மூல உரை ‘கடல்’ என்ற சொல்லையே பயன்படுத்துவதால் அதைப் பாதுகாக்கிறது.
- source_word: αὐτὸς μόνος
  choice: அவரோ தனியாக
  rationale: இயேசு மற்றவர்களிடமிருந்து பிரிந்து தனியே இருந்ததைத் தெரிவிக்கிறது; ‘அவரோ’ என்பது படகின் இருப்பிடத்துடன் காணப்படும் மாறுபாட்டையும் இயல்பாக எடுத்துக்காட்டுகிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: நிலத்தில்
  rationale: படகு கடலில் இருந்ததற்கு மாறாக இயேசு நிலத்தில் இருந்தார் என்ற மூல உரையின் நேரடியான இட வேறுபாட்டைப் பாதுகாக்கிறது.
