  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: ta
  text: அவர் அவர்களுக்குக் எல்லாரையும் குழு குழுவாகப் பசும்புல்லின்மேல் சாய்ந்து அமர வைக்கும்படி கட்டளையிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέταξεν
  choice: கட்டளையிட்டார்
  rationale: ἐπιτάσσω அதிகாரத்தோடு ஆணையிடுவதைக் குறிக்கிறது; ‘சொன்னார்’ என்பதைவிட ‘கட்டளையிட்டார்’ மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இந்தப் பன்மைச் சுட்டுப்பெயர் சூழலில் சீடர்களைக் குறித்தாலும், மூலத்தில் ‘சீடர்கள்’ என்று வெளிப்படையாக இல்லை; ஆகவே சுட்டுப்பெயரே தக்கவைக்கப்படுகிறது.
- source_word: ἀνακλῖναι πάντας
  choice: எல்லாரையும் … சாய்ந்து அமர வைக்கும்படி
  rationale: இலக்கணப்படி கட்டளையைப் பெற்றவர்கள் ‘அவர்கள்’ (αὐτοῖς); அவர்கள் அமர வைக்க வேண்டியவர்கள் ‘எல்லாரும்’ (πάντας). உணவுக்காகச் சாய்ந்து அமரும் நுணுக்கத்தையும் செயப்படுபொருள் வேறுபாட்டையும் இச்சொற்றொடர் காக்கிறது.
- source_word: συμπόσια συμπόσια
  choice: குழு குழுவாக
  rationale: இருமுறை வரும் கிரேக்கச் சொற்றொடரின் பகிர்ந்தமைக்கும் பொருளையும் ஒழுங்குபடுத்தப்பட்ட தனித்தனி உணவுக் குழுக்களையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: பசும்புல்லின்மேல்
  rationale: χλωρός என்பதன் ‘பசுமையான/புதிய’ பொருளையும் χόρτος என்பதன் ‘புல்’ பொருளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் தெளிவும் காக்கப்பட்டுள்ளன. ‘அவர்களிடம்’ மற்றும் ‘எல்லாரையும்’ என்று வேறுபடுத்தியிருப்பது, கட்டளையைப் பெற்ற சீடர்களையும் அமர வைக்கப்பட வேண்டிய மக்களையும் கிரேக்க இலக்கணத்தின்படி தெளிவாகப் பிரிக்கிறது.
