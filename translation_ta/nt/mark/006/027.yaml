  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: ta
  text: உடனே அரசன் மரணதண்டனையை நிறைவேற்றும் காவலன் ஒருவனை[a] அனுப்பி, யோவானுடைய தலையைக் கொண்டுவரும்படி கட்டளையிட்டான். அவன் போய் சிறையில் யோவானின் தலையைத் துண்டித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மெய்க்காவலன்’ அல்லது ‘காவற்படை வீரன்.’ கிரேக்கத்தில், ஆட்சியாளரின் காவற்படையைச் சேர்ந்த ஒருவரைக் குறிக்கும் இலத்தீன் கடன்சொல் (spekoulatōr) உள்ளது; இங்கு அவர் மரணதண்டனையை நிறைவேற்றுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் நடையில் காணப்படும் உடனடியான செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: βασιλεὺς
  choice: அரசன்
  rationale: ஏரோது வரலாற்றுப்படி குறுநில ஆட்சியாளனாக இருந்தாலும், மூல உரை பயன்படுத்தும் ‘அரசன்’ என்ற கதைசார் அடையாளத்தை அப்படியே காக்கிறது.
- source_word: σπεκουλάτορα
  choice: மரணதண்டனையை நிறைவேற்றும் காவலன்
  rationale: இது ஆட்சியாளரின் காவற்படையைச் சேர்ந்த ஒருவரைக் குறிக்கும் இலத்தீன் கடன்சொல்; இச்சூழலில் அவர் மரணதண்டனையை நிறைவேற்றுவதால், பதவியையும் செயலையும் தெளிவாகக் காட்டும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: கொண்டுவரும்படி கட்டளையிட்டான்
  rationale: கிரேக்க வினையெச்சக் கட்டமைப்பின் கட்டளை வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: யோவானுடைய தலையை
  rationale: கிரேக்கத்தில் பிரதிப்பெயர் இருந்தாலும், தமிழில் ‘அவனுடைய’ என்பது அனுப்பப்பட்ட காவலனைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும்; சூழலில் தெளிவாக உள்ள யோவானின் பெயரை வெளிப்படுத்துவது பொருளை மாற்றாமல் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: ἀπεκεφάλισεν
  choice: தலையை வெட்டினான்
  rationale: தலை துண்டித்து கொல்லும் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கும் பொதுவான தமிழ் நடை.
- source_word: ἐν τῇ φυλακῇ
  choice: சிறையில்
  rationale: ஏற்கெனவே கதையில் குறிப்பிடப்பட்ட சிறையைக் குறிக்கும் இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
