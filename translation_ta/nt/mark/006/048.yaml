source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: ta
  text: அவர்கள் துடுப்பு வலித்துத் துன்பப்படுவதை கண்டு—ஏனெனில் காற்று அவர்களுக்கு எதிராக இருந்தது—இரவின் நான்காம் காவல்வேளையில் சுமார்[a] அவர் கடலின்மேல் நடந்து[b] அவர்களிடம் வருகிறார். அவர்களைக் கடந்து செல்ல அவர் எண்ணியிருந்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ரோமர் காலக்கணிப்பின்படி, ‘இரவின் நான்காம் காவல்வேளை’ என்பது ஏறத்தாழ அதிகாலை 3 மணிமுதல் 6 மணிவரையிலான நேரம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘தண்ணீரின்மேல் நடந்து.’ கிரேக்கத்தில் ‘கடலின்மேல்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்களைக் கடந்து செல்ல அவர் எண்ணியிருந்தார்’ என்பது அவர்களைத் தாண்டிச் செல்ல அவர் நினைத்தார் என்று மட்டும் பொருள்படலாம். ஆனால் தேவன் ‘கடந்து சென்று’ தம்மை வெளிப்படுத்தும் பழைய ஏற்பாட்டுக் காட்சிகளையும் இது எதிரொலிக்கக்கூடும் (எடுத்துக்காட்டாக, யாத் 33:19, 22; 34:6; 1 இரா 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டு
  rationale: இறந்தகால வினையெச்சத்தின் இயல்பான தமிழாக்கம்; முதன்மை நிகழ்வோடு அதன் காலத் தொடர்பை மிகையாக விளக்காமல் காக்கிறது.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: துடுப்பு வலிப்பதில் மிகவும் வருந்துவதைக்
  rationale: βασανίζω என்பதன் கடுமையான துன்புறுத்தல்/வருத்தம் என்ற வலிமையைத் தக்கவைத்தும், இங்கு படகைச் செலுத்த அவர்கள் மேற்கொண்ட கடின முயற்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐναντίος αὐτοῖς
  choice: அவர்களுக்கு எதிராக
  rationale: காற்றின் எதிர்ப்பை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: இரவின் நான்காம் காவல்வேளையளவில்
  rationale: பண்டைய காலக்கணிப்பு முறையை முதன்மை உரையில் பாதுகாக்கிறது; περὶ என்பதற்கான தோராயப் பொருளை ‘அளவில்’ தெரிவிக்கிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: மாற்குவின் உயிரோட்டமுள்ள வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: கடலின்மேல் நடந்து
  rationale: θάλασσα என்பதைக் ‘கடல்’ என நேரடியாக மொழிபெயர்த்து, ἐπί குறிக்கும் மேற்பரப்பிலான நடையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: அவர்களைக் கடந்து செல்ல அவர் எண்ணியிருந்தார்
  rationale: θέλω + infinitive குறிக்கும் நோக்கத்தை வெளிப்படுத்துகிறது; சாதாரணமாகக் கடந்து செல்வதா அல்லது வெளிப்பாட்டை நினைவூட்டும் ‘கடந்து செல்லுதல்’ ஆகிறதா என்ற பொருள் திறந்தே வைக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவர்களைக் கடந்து செல்ல அவர் எண்ணியிருந்தார்’ என்பதன் பொருள்
  choice: எந்த விளக்க விரிவாக்கமும் இல்லாமல் நேரடியான சொற்றொடரை முதன்மை உரையில் வைத்தல்
  alternative: அவர் அவர்களைத் தாண்டிச் செல்ல நினைத்தார்; அல்லது பழைய ஏற்பாட்டின் இறை வெளிப்பாட்டை நினைவூட்டும் வகையில் அவர்களைக் கடந்து செல்ல எண்ணினார்
  rationale: கிரேக்க உரை நோக்கத்தை மேலதிகமாக விளக்கவில்லை. யாத்திராகமம் 33–34 மற்றும் 1 இராஜாக்கள் 19 போன்ற இறை வெளிப்பாட்டுக் காட்சிகளின் எதிரொலி இருக்கக்கூடும்; ஆனால் அதை முதன்மை உரையில் உறுதிப்படுத்தாமல் பொருளியல் மற்றும் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை. ‘துடுப்பு வலித்தல்,’ ‘காவல்வேளை’ போன்ற சூழலுக்கேற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வரலாற்று நிகழ்காலமும் மூலத்தின் பொருள் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
