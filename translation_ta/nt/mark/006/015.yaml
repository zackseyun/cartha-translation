id: MRK.6.15
reference: Mark 6:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ta
  text: ஆனால் வேறு சிலர், “இவர் எலியா” என்றும், இன்னும் சிலர், “இவர் ஒரு இறைவாக்கினர்[a], இறைவாக்கினர்களில் ஒருவரைப் போன்றவர்” என்றும் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சாத்தியம் குறைவாக, குறிப்பிட்ட இறுதிக்கால நபரைக் குறித்தால், “அந்த இறைவாக்கினர்” என்றும் மொழிபெயர்க்கலாம். ஆனால் தொடர்ந்து “இறைவாக்கினர்களில் ஒருவரைப் போன்றவர்” என்று வருவதால், கிரேக்கம் இங்கு இயல்பாக “ஒரு இறைவாக்கினர்” என்றே பொருள்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: ஆனால் வேறு சிலர்
  rationale: ἄλλοι வேறொரு குழுவைக் குறிக்கிறது; δέ மென்மையான மாறுபாட்டையும் உரையாடலின் தொடர்ச்சியையும் காட்டுகிறது. “ஆனால் வேறு சிலர்” என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்வினையான ἔλεγον, அப்போது தொடர்ந்து அல்லது மீண்டும் மீண்டும் கூறப்பட்ட கருத்துகளைக் குறிக்கிறது.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “இவர் எலியா”
  rationale: பேசப்படுகிற இயேசுவை மரியாதையான இயல்பான தமிழில் “இவர்” என்று சுட்டுகிறது; Ἠλίας என்ற பெயர் வழக்கமான தமிழ்ப் பெயர்ப்பான “எலியா” என வழங்கப்படுகிறது.
- source_word: προφήτης
  choice: ஒரு இறைவாக்கினர்
  rationale: பெயர்ச்சொல்லுக்கு முன் சுட்டுக்குறிப்புச் சொல் இல்லாததும், அதைத் தொடர்ந்து வரும் ஒப்பீடும், குறிப்பிட்ட ஒரே இறுதிக்கால நபருக்கான பட்டத்தைவிட பொதுவான இறைவாக்கினரை இங்கு குறிக்கின்றன. “இறைவாக்கினர்” என்பது நவீன, கண்ணியமான தமிழ்.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: இறைவாக்கினர்களில் ஒருவரைப் போன்றவர்
  rationale: ὡς இங்கு ஒப்பீட்டைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அந்த ஒப்பீட்டையும் “ஒருவர்” என்ற எண்ணத்தையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: προφήτης என்பது பொதுவாக “ஒரு இறைவாக்கினர்” என்று பொருள்படுகிறதா, அல்லது எதிர்பார்க்கப்பட்ட குறிப்பிட்ட நபரான “அந்த இறைவாக்கினர்” என்ற பட்டத்தைக் குறிக்கிறதா?
  choice: ஒரு இறைவாக்கினர்
  alternative: அந்த இறைவாக்கினர்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு முன் சுட்டுக்குறிப்புச் சொல் இல்லை; மேலும், “இறைவாக்கினர்களில் ஒருவரைப் போன்றவர்” என்ற உடனடியான விளக்கம் பொதுவான அடையாளப்படுத்தலையே வலுவாக ஆதரிக்கிறது. இருப்பினும் குறிப்பிட்ட இறுதிக்கால நபரைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “தீர்க்கதரிசி” என்பதற்குப் பதிலாக, காலத்திற்கேற்றதும் முன்னறிவிப்பை மட்டும் உணர்த்தாததுமான “இறைவாக்கினர்” தேர்ந்தெடுக்கப்பட்டுள்ளது; எந்தச் சமயப்பிரிவுக்கே உரிய சொற்பயன்பாடும் நோக்கத்துடன் சேர்க்கப்படவில்லை.
