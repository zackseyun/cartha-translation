source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: ta
  text: அவர் கரையில் இறங்கியபோது[a], பெரிய மக்கள் கூட்டத்தைக் கண்டார். அவர்கள் மேய்ப்பன் இல்லாத ஆடுகளைப் போல இருந்ததால்[b], அவர்கள்மேல் இரக்கம் கொண்டார். அவர் அவர்களுக்குப் பல விஷயங்களைக் கற்பிக்கத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘வெளியே வந்தபோது.’ முந்தைய சூழலில் அவர் படகிலிருந்து கரையில் இறங்கியது குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: '‘மேய்ப்பன் இல்லாத ஆடுகள்’ என்ற உருவகம், உண்மையுள்ள தலைமை இல்லாத மக்களைக் குறிக்கும் வேதாகம மொழியை எதிரொலிக்கிறது; ஒப்பிடுக: எண் 27:17; 1 இரா 22:17; எசே 34:5.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: கரையில் இறங்கியபோது
  rationale: இதன் நேரடிப் பொருள் ‘வெளியே வந்தபோது’ என்பதாகும். ஆனால் முந்தைய வசனங்களில் படகுப் பயணம் குறிப்பிடப்படுவதால், இங்கு படகிலிருந்து கரையில் இறங்கியதையே சூழல் குறிக்கிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் இறந்தகால வடிவை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: πολὺν ὄχλον
  choice: பெருந்திரளான மக்கள் கூட்டம்
  rationale: ὄχλος என்பது மக்கள் கூட்டத்தையும், πολύς அதன் பெரும் அளவையும் குறிக்கிறது. இந்தத் தேர்வு நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: அவர்கள்மீது பரிவு கொண்டார்
  rationale: இந்த வினை ஆழமான இரக்கத்தையும் பரிவையும் குறிக்கிறது. ‘பரிவு கொண்டார்’ என்பது உணர்வின் ஆழத்தை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: இருந்ததால்
  rationale: இயேசுவின் பரிவுக்கான காரணத்தை வெளிப்படுத்தும் காரணத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: மேய்ப்பன் இல்லாத ஆடுகளைப் போல
  rationale: மூலத்தின் உருவகத்தை விளக்கி விரிவாக்காமல் அப்படியே தக்கவைக்கிறது.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: அவர்களுக்குப் பலவற்றைக் கற்பிக்கத் தொடங்கினார்
  rationale: தொடங்குதலைக் குறிக்கும் கட்டமைப்பையும், πολλά என்பதன் ‘பல விஷயங்கள்’ என்ற உள்ளடக்கப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மேய்ப்பன் இல்லாத ஆடுகள் என்ற உருவகம்
  choice: ‘மேய்ப்பன் இல்லாத ஆடுகளைப் போல’ என்ற உருவகத்தை முதன்மை உரையில் விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘உண்மையான ஆன்மிகத் தலைமை இல்லாத மக்களைப் போல’ என்று விளக்கி மொழிபெயர்த்தல்
  rationale: இது தேவமக்களுக்கும் அவர்களது தலைவர்களுக்கும் உரிய பழைய ஏற்பாட்டு மேய்ப்பர் உருவகத்தை எதிரொலிக்கலாம். ஆனால் அதன் இறையியல் உட்பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், மூல உருவகத்தையும் அதன் அழுத்தத்தையும் பாதுகாப்பது சிறந்தது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பரிவு கொண்டார்’ என்பது அளவுக்கு மீறிய விளக்கமின்றி ஆழ்ந்த இரக்கத்தை வெளிப்படுத்துகிறது. மூலத்தின் மேய்ப்பர் உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
