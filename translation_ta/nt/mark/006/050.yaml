source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: ta
  text: அவர்கள் எல்லாரும் அவரைக் கண்டு கலங்கினார்கள். ஆனால் அவர் உடனே அவர்களிடம் பேசி, “துணிவுகொள்ளுங்கள்; நான்தான்[a]; பயப்படாதீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “நான் இருக்கிறேன்.” இச்சொற்றொடர் இங்கே “நான்தான்” என்ற சுய அடையாளப்படுத்தலாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: ἐγώ εἰμι என்பதன் சொற்பொருளையும் அதன் சாத்தியமான இறையியல் எதிரொலியையும் வாசகருக்குத் தெரியப்படுத்தி, மூலத்தின் பொருள் பதற்றத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: கலங்கினார்கள்
  rationale: பயம், அதிர்ச்சி, உள்ளக் குழப்பம் ஆகியவற்றை உள்ளடக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: Θαρσεῖτε
  choice: துணிவுகொள்ளுங்கள்
  rationale: அச்சத்தை எதிர்கொள்ளத் தைரியம் கொள்ளுமாறு கூறும் பன்மை கட்டளையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐγώ εἰμι
  choice: நான்தான்
  rationale: இச்சூழலில் இயல்பான சுய அடையாளப்படுத்தலைத் தருகிறது; அதேவேளையில் கிரேக்கச் சொற்றொடரின் சொற்பொருள் மற்றும் சாத்தியமான ஆழ்ந்த எதிரொலியை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: பன்மையில் வழங்கப்பட்ட எதிர்மறைக் கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ἐγώ εἰμι என்பதன் சுய அடையாளப் பொருளுக்கும் சாத்தியமான தெய்வீக எதிரொலிக்கும் இடையிலான பதற்றம்
  choice: முதன்மை உரையில் “நான்தான்” என்றும் அடிக்குறிப்பில் சொற்பொருளைத் தெரிவிப்பதும்
  alternative: “நான் இருக்கிறேன்”
  rationale: “நான் இருக்கிறேன்” என்பது தமிழில் இச்சூழலில் இயல்பற்றதாகவும் வெறும் இருப்பை மட்டும் வலியுறுத்துவதாகவும் கேட்கலாம். “நான்தான்” உடனடி சூழலின் பொருளை இயல்பாக அளிக்கிறது; அடிக்குறிப்பு மூலமொழியின் திறந்த தன்மையை மறைக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலமான λέγει, தமிழ்க் கதைநடைக்கு ஏற்ற இறந்தகால “என்றார்” என வழங்கப்பட்டுள்ளது; “அவர்களிடம் பேசி” என்பது ἐλάλησεν μετ’ αὐτῶν என்பதைக் காக்கிறது.
