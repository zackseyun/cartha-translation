  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: ta
  text: சாதகமான ஒரு நாள் வந்தபோது[a], ஏரோது தன் பிறந்தநாளில் தன்னுடைய உயரதிகாரிகளுக்கும், படைத்தளபதிகளுக்கும், கலிலேயாவின் முக்கியமானவர்களுக்கும் விருந்து கொடுத்தான்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாய்ப்பான ஒரு நாள் வந்தபோது” அல்லது “ஏற்ற ஒரு நாள் வந்தபோது.” கிரேக்கச் சொல் பொருத்தமான அல்லது சாதகமான வாய்ப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “இரவு உணவைச் செய்தான்” அல்லது “இரவு விருந்தை ஏற்பாடு செய்தான்.” இங்கு சிறப்பு விருந்து என்று பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கலிலேயாவின் முதன்மையானவர்கள்.” இச்சொற்றொடர் அப்பகுதியின் செல்வாக்குமிக்க ஆண் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: அதற்கேற்ற ஒரு நாள் வந்தது
  rationale: εὔκαιρος என்பது ஏற்ற, வாய்ப்பான நேரத்தைக் குறிக்கிறது; முந்தைய சூழலில் எதிர்பார்க்கப்பட்ட வாய்ப்பு கிடைத்தது என்ற அச்சமூட்டும் கதையோட்டத்தையும் ‘அதற்கேற்ற’ தக்கவைக்கிறது.
- source_word: ὅτε
  choice: — (அடுத்த வாக்கியம் அந்த நாளின் நிகழ்வை விளக்குகிறது)
  rationale: கிரேக்கத்தில் ὅτε அந்த ஏற்ற நாள் எது என்பதை ஏரோதின் பிறந்தநாள் விருந்தால் குறிப்பாக்குகிறது. தமிழில் இருமுறை ‘போது’ என்று கூறுவதைத் தவிர்த்து, இரண்டாவது வாக்கியமாக இயல்பாக அமைக்கப்பட்டது.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: தன் பிறந்தநாளன்று
  rationale: γενέσια பிறந்தநாள் அனுசரிப்பைக் குறிக்கிறது; இத்தமிழ் வடிவம் நிகழ்ந்த சந்தர்ப்பத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: δεῖπνον ἐποίησεν
  choice: விருந்து அளித்தான்
  rationale: சொல்லுக்குச் சொல் ‘இரவு உணவைச் செய்தான்’ என்பதற்குப் பதிலாக, சிறப்பு விருந்தை ஏற்பாடு செய்து வழங்கினான் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: தன்னுடைய உயரதிகாரிகளுக்கு
  rationale: μεγιστᾶνες என்பது ஆட்சியாளருடன் தொடர்புடைய உயர் பதவியினரைக் குறிக்கிறது; ‘உயரதிகாரிகள்’ நவீன வாசகருக்கு தெளிவானதும் தேவையற்ற சமூகப் பட்டத்தை இறக்குமதி செய்யாததும் ஆகும்.
- source_word: τοῖς χιλιάρχοις
  choice: படைத்தளபதிகளுக்கு
  rationale: χιλίαρχοι என்பது சொல்லியல்பில் ஆயிரம் பேருக்குத் தலைமை வகிப்பவர்களைச் சுட்டினாலும், இங்கு மூத்த இராணுவத் தளபதிகளைக் குறிக்கிறது.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: கலிலேயாவின் முதன்மையான மனிதர்களுக்கு
  rationale: πρῶτοι என்பது அப்பகுதியின் முக்கியமான, உயர்நிலையில் இருந்தவர்களைக் குறிக்கிறது; ஆண்பால் குறிப்பு மறைக்கப்படாமல் ‘மனிதர்கள்’ மூலம் வெளிப்படுத்தப்படுகிறது.
- source_word: Καὶ
  choice: —
  rationale: இவ்வசனம் தனித்து வழங்கப்படும் தமிழில் தொடக்க ‘மற்றும்’ இயல்பில்லாததால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; தொடர்ச்சியை ‘அதற்கேற்ற’ முந்தைய சூழலோடு இணைக்கிறது.
- source_word: Ἡρῴδης
  choice: ஏரோது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்ப்பெயர்ப்பு.
