revisions:
- from: உடனே அவர் தம் சீடர்களைப் படகில் ஏறி, பெத்சாயிதாவை நோக்கி[a] மறுகரைக்குத் தமக்கு முன்னே போகும்படி கட்டாயப்படுத்தினார்; அவர் தாமே மக்கள் கூட்டத்தை அனுப்பிவிடும்வரை அவர்கள் அவ்வாறு போக வேண்டியிருந்தது.
  to: உடனே, அவர் தாமே மக்கள் கூட்டத்தை அனுப்பிவிடும் வரை, தம் சீடர்களைப் படகில் ஏறி பெத்சாயிதாவை நோக்கி[a] மறுகரைக்குத் தமக்கு முன்னே செல்லும்படி கட்டாயப்படுத்தினார்.
  rationale: The revision removes the unsupported explanatory clause and keeps the temporal limit attached to Jesus' action. It retains the Greek directional ambiguity concerning Bethsaida through the existing footnote, preserves the emphatic “அவர் தாமே,” and uses fluent contemporary Tamil without resolving more than the source resolves.
