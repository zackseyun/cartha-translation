translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் புரியும்படி அரைப்புள்ளி மற்றும் விளக்கமான இரண்டாம் கூறு பயன்படுத்தப்பட்டுள்ளன; ‘அவர் தாமே’ என்ற வடிவம் மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
