source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: ta
  text: உடனே, அவர் தாமே மக்கள் கூட்டத்தை அனுப்பிவிடும் வரை, தம் சீடர்களைப் படகில் ஏறி பெத்சாயிதாவை நோக்கி[a] மறுகரைக்குத் தமக்கு முன்னே செல்லும்படி கட்டாயப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்சாயிதாவுக்கு.” கிரேக்க முன்னிடைச்சொல் பொதுவாகத் திசையை (“நோக்கி”) அல்லது இன்னும் குறிப்பாகச் சென்றடைய வேண்டிய இடத்தை (“க்கு”) குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: மாற்குவின் உரையாடல் ஓட்டத்தில் காணப்படும் உடனடித் தன்மையையும் வேகத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἠνάγκασεν
  choice: கட்டாயப்படுத்தினார்
  rationale: வலுவான அழுத்தம் அல்லது அவசியத்தின் பேரில் ஒருவரைச் செயல்படச் செய்வதைக் குறிக்கும் வினையின் வலிமையைப் பாதுகாக்கிறது; உடல் வன்முறையை அவசியமாக உணர்த்துவதில்லை.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: தம் சீடர்களை
  rationale: ஆசிரியர்–சீடர் உறவைத் துல்லியமாகக் காக்கிறது; ‘தம்’ என்பது சீடர்கள் இயேசுவுக்குரியவர்கள் என்பதை இயல்பாகக் காட்டுகிறது.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: படகில் ஏறி
  rationale: படகுக்குள் சென்று பயணத்தைத் தொடங்கும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: προάγειν
  choice: தமக்கு முன்னே போகும்படி
  rationale: சீடர்கள் இயேசுவுக்கு முன்பாகப் புறப்பட்டுச் செல்ல வேண்டும் என்ற தொடர்புச் சார்ந்த பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: εἰς τὸ πέραν
  choice: மறுகரைக்கு
  rationale: ஏரியின் எதிர்ப்புறக் கரையைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: πρὸς Βηθσαϊδάν
  choice: பெத்சாயிதாவை நோக்கி
  rationale: πρός என்பதிலுள்ள திசைநோக்கிய பொருளைப் பாதுகாத்து, அவர்கள் அந்த இடத்தை அடைந்தார்கள் என்று தேவையின்றி உறுதிப்படுத்தாமல் விடுகிறது.
- source_word: ἕως
  choice: அனுப்பிவிடும்வரை
  rationale: இயேசுவின் செயல் நிறைவடையும் வரையிலான கால எல்லையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: αὐτὸς
  choice: அவர் தாமே
  rationale: கூட்டத்தை அனுப்பிவைக்கும் பணியை இயேசுவே செய்தார் என்பதிலுள்ள வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἀπολύει τὸν ὄχλον
  choice: மக்கள் கூட்டத்தை அனுப்பிவிடும்வரை
  rationale: கூட்டத்தை அங்கிருந்து செல்லச் செய்வதே இங்குள்ள பொருள். தமிழ் வினையெச்ச அமைப்பு கிரேக்க நிகழ்கால வடிவத்தைத் தேவையற்ற காலமாற்றமின்றி இயல்பாக எடுத்துரைக்கிறது.
