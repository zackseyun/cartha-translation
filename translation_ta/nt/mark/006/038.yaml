source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உங்களிடம் எத்தனை அப்பங்கள் இருக்கின்றன? போய்ப் பாருங்கள்.” என்றார். அவர்கள் அறிந்துகொண்டு, “ஐந்து அப்பங்கள், இரண்டு மீன்கள்.” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: அப்பங்கள்
  rationale: அக்காலத்தின் பொதுவான ரொட்டித் துண்டுகள் அல்லது அப்பங்களைக் குறிக்கும் பன்மையை, தமிழில் இயல்பாகவும் மரபாகவும் வழங்குகிறது.
- source_word: ὑπάγετε ἴδετε
  choice: போய்ப் பாருங்கள்
  rationale: இரண்டு கட்டளைகளின் நேரடியான இயக்கத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: γνόντες
  choice: பார்த்துத் தெரிந்துகொண்டு
  rationale: வெறுமனே பார்த்தல் அல்லாமல், விசாரித்து எண்ணிக்கையை அறிந்தார்கள் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: ἰχθύας
  choice: மீன்கள்
  rationale: பொதுவான ‘மீன்’ என்ற சொல்லின் பன்மையை நேரடியாக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான உரைநடை. கிரேக்க வரலாற்று நிகழ்காலமான λέγει/λέγουσιν, தொடர்ச்சியான கதைநடைக்கு இயல்பாக இறந்தகாலத்தில் ‘என்றார்/என்றார்கள்’ என வழங்கப்பட்டுள்ளது; உள்ளடக்கத்தில் கால வேறுபாடு ஏற்படுத்தப்படவில்லை.
