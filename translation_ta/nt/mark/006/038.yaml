- from: அவர் அவர்களிடம், “உங்களிடம் எத்தனை அப்பங்கள் இருக்கின்றன? போய்ப் பாருங்கள்” என்றார். அவர்கள் பார்த்துத் தெரிந்துகொண்டு, “ஐந்து அப்பங்களும் இரண்டு மீன்களும் இருக்கின்றன” என்றார்கள்.
  to: அவர் அவர்களிடம், “உங்களிடம் எத்தனை அப்பங்கள் இருக்கின்றன? போய்ப் பாருங்கள்.” என்றார். அவர்கள் அறிந்துகொண்டு, “ஐந்து அப்பங்கள், இரண்டு மீன்கள்.” என்றார்கள்.
