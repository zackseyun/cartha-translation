source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் கூறிக்கொண்டிருந்தார்: “நீங்கள் எந்த வீட்டிற்குள் சென்றாலும், அங்கிருந்து[a] புறப்படும்வரை அங்கேயே தங்கியிருங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அந்த இடத்தைவிட்டுப் புறப்படும்வரை.” கிரேக்கத்தில் சொற்சார்ந்து, “அங்கிருந்து வெளியேறும்வரை” என்று உள்ளது. சூழலில் இது அந்தப் பகுதியைவிட்டுப் புறப்படுதலைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவத்தின் தொடர்ச்சி அல்லது மீள்நிகழ்வுத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ὅπου ἐὰν
  choice: எங்கே ... சென்றாலும்
  rationale: குறிப்பிடப்படாத எந்த இடத்தையும் குறிக்கும் ‘wherever’ என்ற பொருளை இயல்பான நிபந்தனைத் தொடரால் தருகிறது.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ஒரு வீட்டிற்குள் சென்றாலும்
  rationale: εἰς என்பதன் உள்ளே செல்லும் திசைப்பொருளைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: οἰκίαν
  choice: ஒரு வீடு
  rationale: இங்கு தங்குமிடமாகிய வீட்டையே முதன்மையாகக் குறிக்கிறது; ‘குடும்பம்’ என்ற விரிவான பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: ἐκεῖ μένετε
  choice: அங்கேயே தங்கியிருங்கள்
  rationale: μένω என்பதன் ‘தொடர்ந்து இரு/தங்கு’ என்ற பொருளைத் தருகிறது; ‘-யே’ ஒரே வீட்டில் தங்க வேண்டும் என்ற அறிவுறுத்தலின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: அந்த இடத்தைவிட்டுப் புறப்படும்வரை
  rationale: ἐκεῖθεν என்பதன் ‘அங்கிருந்து’ என்ற பொருளை, ஊர் அல்லது பணியிடத்தைவிட்டுப் புறப்படுதல் எனச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; அடிக்குறிப்பில் சொற்சார்ந்த மாற்று பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: 'ἐκεῖθεν என்பதன் எல்லை: வீடா அல்லது அந்தப் பகுதி/இடமா?'
  choice: சீடர்கள் அந்த இடத்தைவிட்டுப் புறப்படும் வரை அதே வீட்டில் தங்க வேண்டும்.
  alternative: அவர்கள் அந்த வீட்டிலிருந்து வெளியே செல்லும் வரை அங்கே தங்க வேண்டும்; அல்லது ‘அங்கிருந்து புறப்படும்வரை’ எனத் தெளிவுபடுத்தாமல் விடலாம்.
  rationale: பணிப்பயணத்தில் தங்கும் முறையைப் பற்றிய சூழல், நல்ல வசதிக்காக வீடு மாறாமல் அந்தப் பகுதியில் இருக்கும் காலமெல்லாம் ஒரே வீட்டில் தங்க வேண்டும் என்பதைக் காட்டுகிறது. எனினும் கிரேக்கச் சொற்றொடரின் சொற்சார்ந்த வடிவம் ஓரளவு திறந்ததாக இருப்பதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். தொடர்ச்சியான உரையைக் காட்ட ‘சொல்லிக்கொண்டிருந்தார்’ பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் பன்மை மரியாதை/அறிவுறுத்தல் தொனிக்காக ‘தங்கியிருங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
