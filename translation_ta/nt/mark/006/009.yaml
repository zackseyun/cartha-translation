  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அங்கி’ என்பது χιτών என்பதன் வரலாற்றுச் சூழலைப் பேணுவதோடு சாதாரண வாசகருக்கும் புரியக்கூடியதாக உள்ளது.
