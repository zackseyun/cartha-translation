  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: ta
  text: ஆனால், செருப்புகளை அணிந்திருங்கள்; இரண்டு அங்கிகளை அணிந்துகொள்ளாதீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டு அங்கிகளை அணிந்திருக்காதீர்கள்.’ கிரேக்க வினைச்சொல்லை ஆடை அணிந்துகொள்ளும் செயலாகவும், அணிந்திருக்கும் நிலையாகவும் மொழிபெயர்க்கலாம்; முதன்மைப் பாடம் செயல்வினைப் பொருளை நெருக்கமாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய பயண அறிவுறுத்தல்களுடன் உள்ள மாறுபாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: ὑποδεδεμένους
  choice: அணிந்திருக்க வேண்டும்
  rationale: ὑποδέομαι என்பதன் நிறைவுநிலைப் பெயரெச்ச வடிவம் செருப்பு அணிந்த நிலையில் இருப்பதைச் சுட்டுகிறது; சூழலில் இது கட்டளையின் பொருளை ஏற்கிறது.
- source_word: σανδάλια
  choice: செருப்புகளை
  rationale: பண்டைய காலத்தில் காலில் கட்டி அணிந்த திறந்தவகை பாதணியைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: μὴ ἐνδύσησθε
  choice: அணிந்துகொள்ளாதீர்கள்
  rationale: μή உடன் வரும் இறந்தகாலத் தன்மை கொண்ட நடுவினைத் துணைவினை வடிவம், தமக்குத் தாமே ஆடையை அணிந்துகொள்ளும் செயலைத் தடைசெய்கிறது.
- source_word: δύο
  choice: இரண்டு
  rationale: எண்ணை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: χιτῶνας
  choice: அங்கிகளை
  rationale: உடலுக்கு அருகில் அணியப்பட்ட அடிப்படை ஆடையைக் குறிக்கிறது; ‘சட்டைகள்’ என்பது காலப்பொருத்தமற்றதாக இருக்கலாம், ‘ஆடைகள்’ என்பது அளவுக்கு மீறிப் பொதுவானது.
