  source_fidelity: The draft accurately represents γάρ, the disciples' failure to understand in relation to the loaves, the adversative contrast, and the enduring metaphorical condition expressed by πεπωρωμένη. The singular collective sense of ἡ καρδία is also retained. No doctrinal cause for the hardening is introduced.
  naturalness: The phrase “அப்பங்களைப் பற்றியதை அவர்கள் புரிந்துகொள்ளவில்லை” is structurally awkward in modern standard Tamil, since “பற்றியதை” leaves an unnecessarily elliptical nominal object. “அப்பங்களைப் பற்றி அவர்கள் புரிந்துகொள்ளவில்லை” is idiomatic and preserves the source's open-ended wording.
  terminology: “அப்பங்கள்,” “உள்ளம்,” and “கடினப்பட்டிருந்தது” are suitable in a dignified modern Tamil biblical register. “உள்ளம்” appropriately conveys the biblical sense of καρδία without restricting it to emotion alone. The alternative footnotes preserve, rather than resolve, the relevant lexical nuances.
  issues:
