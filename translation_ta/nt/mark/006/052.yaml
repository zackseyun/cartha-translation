  text: οὐ γὰρ συνῆκαν ἐπὶ τοῖς ἄρτοις, ⸂ἀλλ’ ἦν⸃ αὐτῶν ἡ καρδία πεπωρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: ta
  text: ஏனெனில், அப்பங்களைப் பற்றி அவர்கள் புரிந்துகொள்ளவில்லை[a]; அவர்களுடைய உள்ளமோ கடினப்பட்டிருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்பங்களின் முக்கியத்துவத்தை அவர்கள் உணரவில்லை.”
    reason: ἐπὶ τοῖς ἄρτοις என்பது அப்பங்களைப் பற்றிய நிகழ்வின் பொருள் அல்லது முக்கியத்துவத்தைக் குறிக்கலாம்.
  - marker: b
    text: அல்லது, “அவர்களுடைய உள்ளம் உணர்வற்றுப் போயிருந்தது.”
    reason: πεπωρωμένη என்பது கடினப்படுதல் அல்லது மரத்துப்போய் உணர்விழத்தல் என்ற உருவகப் பொருளைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: συνῆκαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: சிந்தனையாலும் உள்ளுணர்வாலும் பொருளைப் புரிந்துகொள்ளத் தவறியதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: அப்பங்களைப் பற்றியதை
  rationale: அப்பங்கள் சம்பந்தமாக சீடர்கள் புரிந்துகொள்ள வேண்டியிருந்தது என்ன என்பதைத் திறந்த நிலையில் வைக்கிறது; அவை குறித்த நிகழ்வின் முக்கியத்துவம் என்ற பொருளையும் சூழல் அனுமதிக்கிறது.
- source_word: ἄρτοις
  choice: அப்பங்கள்
  rationale: பொதுவாக அப்பம் என்பதைக் காட்டிலும், முந்தைய உணவளிப்பு நிகழ்வில் பயன்படுத்தப்பட்ட குறிப்பிட்ட பல அப்பங்களைக் கிரேக்கப் பன்மைக்கு ஏற்பச் சுட்டுகிறது.
- source_word: ἀλλ’ ἦν
  choice: உள்ளமோ … இருந்தது
  rationale: தமிழின் எதிர்மறை ஒப்பீட்டு ‘-ஓ’ அமைப்பின் மூலம் முந்தைய கூற்றுடன் உள்ள முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτῶν ἡ καρδία
  choice: அவர்களுடைய உள்ளம்
  rationale: கிரேக்கத்தில் உள்ள ஒருமைக் கூட்டு வடிவத்தைத் தக்கவைத்தபடி, புரிதலும் மனப்பாங்கும் அடங்கிய அகநிலையை நவீனத் தமிழில் ‘உள்ளம்’ இயல்பாகக் குறிக்கிறது.
- source_word: πεπωρωμένη
  choice: கடினப்பட்டிருந்தது
  rationale: முடிவுற்ற கடினநிலை தொடர்ந்து இருந்ததைப் பிரதிபலிக்கிறது; ஆன்மீக உணர்வின்மையைச் சொன்னாலும் அதற்கான காரணத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
theological_decisions:
- issue: πεπωρωμένη என்பதில் சீடர்களின் உள்ளநிலையும் அதற்கான காரணமும்
  choice: அவர்களுடைய உள்ளம் கடினப்பட்டிருந்தது
  alternative: அவர்களுடைய உள்ளம் உணர்வற்றுப் போயிருந்தது
  rationale: மூலத்தின் கடினப்படுதல் உருவகத்தைத் தக்கவைத்து, இது இறைவனால் நிகழ்த்தப்பட்ட நீதித்தீர்ப்பா அல்லது சீடர்களின் சொந்த உணர்வின்மையா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘உள்ளம்’ என்ற ஒருமையைப் பயன்படுத்தி கிரேக்கத்தின் கூட்டு ஒருமையைப் பாதுகாக்கிறது; ‘உள்ளங்களோ’ என இயல்பாக்கவில்லை. காரணத்தைக் குறிக்கும் γάρ என்பதற்கு ‘ஏனெனில்’ பயன்படுத்தப்பட்டுள்ளது.
