source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: ta
  text: அவர் பன்னிருவரையும் தம்மிடம் அழைத்து[c], அவர்களை இரண்டிரண்டு பேராக[a] அனுப்பத் தொடங்கினார்; அசுத்த ஆவிகள்மேல் அவர்களுக்கு அதிகாரம்[b] கொடுத்துவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டு பேராக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அசுத்த ஆவிகள்மேல் வல்லமை.’
    reason: alternative_reading
  - marker: c
    text: 'கிரேக்கத்தில் இங்குள்ள முதல் வினை வரலாற்று நிகழ்காலத்தில் உள்ளது: ‘அவர் பன்னிருவரையும் தம்மிடம் அழைக்கிறார்; அவர்களை … அனுப்பத் தொடங்கினார்.’'
    reason: source_aspect
lexical_decisions:
- source_word: προσκαλεῖται
  choice: தம்மிடம் அழைத்து
  rationale: இது மாற்கு பயன்படுத்தும் வரலாற்று நிகழ்காலம். தமிழில் அடுத்துள்ள இறந்தகால வினையுடன் இயல்பாக இணைவதற்காக வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது; நடுநிலை வினையின் தம்மிடம் அழைக்கும் நுணுக்கமும் வெளிப்படுகிறது.
- source_word: τοὺς δώδεκα
  choice: பன்னிருவரையும்
  rationale: சூழலில் இது இயேசு தேர்ந்தெடுத்த குறிப்பிட்ட பன்னிருவரைக் குறிக்கும் நிலைபெற்ற குழுப்பெயர்; ‘சீடர்கள்’ என்ற சொல்லை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: அனுப்பத் தொடங்கினார்
  rationale: ἄρχομαι + வினையெச்சக் கட்டமைப்பின் தொடக்க அம்சத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: δύο δύο
  choice: இரண்டிரண்டு பேராக
  rationale: கிரேக்கத்தின் பகிர்முறைத் திருப்புரையைத் தமிழிலும் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐδίδου
  choice: கொடுத்துவந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்ச்சியான அல்லது உடனிகழும் செயல் அம்சத்தைப் பாதுகாக்கிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: வெறும் ஆற்றலைவிட, இயேசுவால் வழங்கப்பட்ட செயலுரிமையையும் அதிகாரத்தையும் இச்சொல் தெளிவாகக் காட்டுகிறது.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: அசுத்த ஆவிகள்மேல்
  rationale: மாற்குவின் சொற்பயன்பாட்டை நேரடியாகப் பாதுகாக்கிறது; விளக்கமாக ‘பேய்கள்’ என்று குறுக்கவில்லை.
theological_decisions:
- issue: அசுத்த ஆவிகள் தொடர்பாகப் பன்னிருவருக்கு வழங்கப்பட்ட ἐξουσίαν என்பதன் இயல்பு
  choice: அசுத்த ஆவிகள்மேல் வழங்கப்பட்ட அதிகாரம்
  alternative: அசுத்த ஆவிகள்மேல் வல்லமை
  rationale: இங்கு இயேசு பன்னிருவருக்குச் செயல்படுவதற்கான அதிகாரத்தை வழங்குகிறார். ‘அதிகாரம்’ என்பது வெறும் சக்தியைவிட வழங்கப்பட்ட உரிமை மற்றும் ஆளுகை என்ற உறவுசார் நுணுக்கத்தைச் சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அழைத்து … தொடங்கினார்’ என்பது தமிழில் இயல்பான கால ஒத்திசைவை அளிக்கிறது; கிரேக்க வரலாற்று நிகழ்காலம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘கொடுத்துவந்தார்’ என்பது ἐδίδου என்பதன் தொடர்ச்சியைக் காட்டுகிறது.
