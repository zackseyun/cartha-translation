id: MRK.6.2
reference: Mark 6:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: ta
  text: ஓய்வுநாள் வந்தபோது, அவர் தொழுகைக்கூடத்தில் கற்பிக்கத் தொடங்கினார். அவரைக் கேட்ட பலர் வியப்படைந்து, “இவனுக்கு இவை எங்கிருந்து வந்தன? இவனுக்குக் கொடுக்கப்பட்ட இந்த ஞானம் என்ன? இவனுடைய கைகளின் வழியாக இத்தகைய வல்ல செயல்கள் எவ்வாறு நிகழ்கின்றன?” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: ஓய்வுநாள் வந்தபோது
  rationale: இது காலச் சூழலைக் குறிக்கும் genitive absolute அமைப்பு. ‘வந்தபோது’ என்பது அதன் கால நுட்பத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἤρξατο διδάσκειν
  choice: கற்பிக்கத் தொடங்கினார்
  rationale: ἄρχομαι + infinitive என்ற தொடக்கநிலைப் பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: συναγωγῇ
  choice: தொழுகைக்கூடத்தில்
  rationale: இச்சூழலில் யூதர்களின் வழிபாட்டு மற்றும் போதனை இடத்தைக் குறிக்கிறது; பொதுவாசகர்களுக்குப் புரியும் நிலையான தமிழ் சொல்.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: அவருக்குச் செவிகொடுத்த பலர்
  rationale: கேட்டுக்கொண்டிருந்த பலரை இயல்பான தமிழில் குறிக்கிறது; ‘செவிகொடுத்த’ என்பது கவனித்துக் கேட்டனர் என்ற சூழலை வெளிப்படுத்துகிறது.
- source_word: ἐξεπλήσσοντο
  choice: வியப்படைந்து
  rationale: வலுவான ஆச்சரியத்தைத் தெரிவிக்கிறது; தொடர்ந்த எதிர்வினை பின்னுள்ள உரையோடு இணைக்கப்பட்டுள்ளது.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: இவனுக்கு இவையெல்லாம் எங்கிருந்து வந்தன?
  rationale: Πόθεν என்பதன் தோற்றம் அல்லது மூலம் குறித்த கேள்வியைப் பாதுகாக்கிறது. ‘இவனுக்கு’ என்பது τούτῳ என்பதன் சற்றே விலகிய தொனியையும் வெளிப்படுத்துகிறது.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: இவனுக்குக் கொடுக்கப்பட்ட இந்த ஞானம் என்ன?
  rationale: கொடுக்கப்பட்ட ஞானம் என்ற passive வடிவத்தையும் கேள்வி/வியப்புத் தொனியையும் தெளிவாகக் காக்கிறது.
- source_word: δυνάμεις
  choice: வல்ல செயல்கள்
  rationale: இங்கு இது வெறும் அரூபமான ‘வல்லமைகள்’ அல்ல, வல்லமையை வெளிப்படுத்தும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘வல்ல செயல்கள்’ என்பது ‘அற்புதங்கள்’ என்று பொருளை முழுமையாகத் தீர்மானிக்காமல் கிரேக்கத்தின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: இவனுடைய கைகளின் வழியாக ... நிகழ்கின்றன
  rationale: διά + genitive என்பதன் கருவியியல் பொருளையும் ‘கைகளின் வழியாக’ என்ற மூலப்படிமத்தையும், γινόμεναι என்பதன் ‘நிகழ்தல்’ உணர்வையும் காக்கிறது.
theological_decisions:
- issue: δυνάμεις என்பதன் இயல்பு
  choice: வல்ல செயல்கள்
  alternative: அற்புதங்கள்; வல்லமைகள்
  rationale: மாற்கு நூலின் சூழலில் இச்சொல் அசாதாரண வல்லமைச் செயல்களைக் குறிக்கிறது. ‘வல்ல செயல்கள்’ என்பது அற்புதச் செயல்களின் சாத்தியத்தைத் தெளிவாக வைத்திருக்கிறது; அதேவேளை கிரேக்கச் சொல்லை விளக்கவுரையாகச் சுருக்கிவிடாமல் காக்கிறது.
- issue: τούτῳ என்பதன் தொனி
  choice: இவனுக்கு
  alternative: அவருக்கு; இந்த மனிதனுக்கு
  rationale: சொந்த ஊராரின் விலகிய அல்லது இகழ்வுக் கலந்த தொனியை ‘இவன்’ இயல்பாக வெளிப்படுத்துகிறது; ஆனால் வெளிப்படையான இகழ்ச்சியை மேலதிகமாகச் சேர்ப்பதில்லை.
- issue: இறுதிக் கூறின் கேள்வி/வியப்புத் தன்மை
  choice: நிகழ்கின்றனவே!
  alternative: நிகழ்கின்றன?
  rationale: கிரேக்க வாக்கியம் கேள்வியையும் வியப்பையும் ஒன்றாக ஏந்துகிறது. தமிழில் ‘-வே’ மற்றும் வியப்புக்குறி அந்த வியப்பை இயல்பாக வெளிப்படுத்துகின்றன; செயல்களின் மூலத்தைப் பற்றிய முன் கேள்வியுடனான தொடர்பும் தொடர்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் கதைநடை ஓட்டமும் காக்கப்பட்டுள்ளன. கூட்டத்தின் நேரடி பேச்சில் உள்ள விலகிய தொனியை வெளிப்படுத்த ‘இவன்’ பயன்படுத்தப்பட்டுள்ளது; இயேசுவைக் குறிக்கும் கதைசொல்லியின் மொழியில் மரியாதை வடிவம் தொடர்கிறது.
