  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: ta
  text: அவர்களை அனுப்பிவிடுங்கள்[a]; அவர்கள் சுற்றியுள்ள வயல்வெளிகளுக்கும் கிராமங்களுக்கும் போய், தங்களுக்குச் சாப்பிட ஏதாவது வாங்கிக்கொள்ளட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “அவர்களைப் போக அனுமதியுங்கள்; அவர்கள் சுற்றியுள்ள வயல்வெளிகளுக்கும் கிராமங்களுக்கும் போய், தாங்கள் சாப்பிட ஏதாவது வாங்கிக்கொள்ளட்டும்.”'
    reason: ἀπόλυσον என்பதன் ‘அனுப்பிவிடு/போக அனுமதி கொடு’ என்ற பொருள் வரம்பையும், கிரேக்க வாக்கியத்தின் பங்கேற்புவினை அமைப்பையும் காட்டும் மொழிபெயர்ப்பு மாற்று.
lexical_decisions:
- source_word: ἀπόλυσον
  choice: அவர்களை அனுப்பிவிடுங்கள்
  rationale: இச்சூழலில் ἀπολύω என்பது மக்களை அங்கிருந்து அனுப்பிவிடும்படி கூறுவதைக் குறிக்கிறது. இயேசுவிடம் பேசப்படுவதால், கிரேக்க ஒருமை ஏவலைத் தமிழில் இயல்பான மரியாதைப் பன்மையால் மொழிபெயர்த்துள்ளது.
- source_word: ἵνα
  choice: அவர்கள் … வாங்கிக்கொள்ளட்டும்
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கத்தைத் தமிழில் இயல்பாகத் தெரிவிக்க ஏவல்-அனுமதி வடிவம் பயன்படுத்தப்பட்டுள்ளது; முந்தைய கட்டளையின் நோக்கம் இதனால் தெளிவாகிறது.
- source_word: ἀπελθόντες
  choice: போய்
  rationale: இறந்தகால வினையெச்சத்தின் முன்னிகழ்வுத் தொடர்பைத் தமிழ் வினையெச்சமான ‘போய்’ இயல்பாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: சுற்றியுள்ள வயல்வெளிகளுக்கும் கிராமங்களுக்கும்
  rationale: κύκλῳ என்பது சுற்றியுள்ள இடங்களைக் குறிக்கிறது. ἀγροί என்பதன் வயல்கள் அல்லது நாட்டுப்புறப் பகுதிகள் என்ற பொருள் வரம்பை ‘வயல்வெளிகள்’ காக்கிறது; κῶμαι என்பதற்கு ‘கிராமங்கள்’ நேரான இணை.
- source_word: ἀγοράσωσιν
  choice: வாங்கிக்கொள்ளட்டும்
  rationale: விலைகொடுத்து உணவைப் பெறுதல் என்ற வழக்கமான பொருளைத் தெளிவாகக் கூறுகிறது; ‘-க்கொள்’ வடிவம் ἑαυτοῖς தரும் தங்களுக்கான பயன் நுணுக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἑαυτοῖς
  choice: தங்களுக்கு
  rationale: தற்சுட்டுப் பயனிலைப் பொருளை நேரடியாகக் காக்கிறது; மக்கள் தங்களுக்காகவே உணவு வாங்க வேண்டும் என்பது தெளிவாகிறது.
- source_word: τί φάγωσιν
  choice: சாப்பிட ஏதாவது
  rationale: இச்சூழலில் τί கொண்டுள்ள வரையறையற்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; சொற்சொல்லான ‘எதைச் சாப்பிடுவார்களோ’ என்பதைவிட உணவைக் குறிக்கும் கருத்து தெளிவாக உள்ளது.
