base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: ta
  text: அவள் வெளியே போய் தன் தாயிடம், “நான் என்ன கேட்க வேண்டும்?” என்றாள். அவளோ, “திருமுழுக்கு கொடுப்பவரான யோவானின் தலையை” என்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழக்கில், “திருமுழுக்கு யோவானின் தலையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: வெளியே போய்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தின் வரிசையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: Τί αἰτήσωμαι
  choice: நான் என்ன கேட்க வேண்டும்?
  rationale: ஆலோசனை அல்லது முடிவெடுத்தலை வெளிப்படுத்தும் இறந்தகால நடுவினை விருப்பவினையின் நுணுக்கத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: μητρὶ αὐτῆς
  choice: தன் தாயிடம்
  rationale: எழுவாய் அவளே என்பதால், αὐτῆς என்பதன் உடைமைத் தொடர்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘தன்’ காட்டுகிறது.
- source_word: κεφαλήν
  choice: தலையை
  rationale: கோரப்பட்ட பொருளை மறைக்கவோ மென்மைப்படுத்தவோ செய்யாமல் நேரடியாக மொழிபெயர்க்கிறது; வேற்றுமை உருபு கிரேக்க வேற்றுமையையும் தொடரின் விடுபட்ட வினையையும் பிரதிபலிக்கிறது.
- source_word: τοῦ βαπτίζοντος
  choice: திருமுழுக்கு கொடுப்பவரான
  rationale: யோவானை அவரது அடையாளமான செயல் மூலம் குறிப்பிடும் பெயராக்கப்பட்ட நிகழ்காலப் பெயரெச்சத்தின் பொருளைத் தெளிவாகத் தருகிறது; பிற்காலப் பிரிவுசார் பெயர்போல் ஒலிக்காமல் தவிர்க்கிறது.
theological_decisions:
- issue: யோவானுக்கான βαπτίζων என்ற அடைமொழி
  choice: திருமுழுக்கு கொடுப்பவரான யோவான்
  alternative: திருமுழுக்கு யோவான்
  rationale: கிரேக்கப் பெயரெச்சத்தின் செயற்பொருளை வெளிப்படையாக மொழிபெயர்த்து, யோவானை அவர் செய்த செயலால் அடையாளப்படுத்துகிறது. தமிழில் நிலைபெற்ற சுருக்கமான மரபுவழக்கை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தாயின் பதிலில் கிரேக்கத்தில் வினை விடுபட்டு குற்றுவேற்றுமைத் தொடர் மட்டும் இருப்பதால், தமிழிலும் “கேள்” என்று சேர்க்காமல் அந்தச் சுருக்கமும் கொடூரமான நேரடித்தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
