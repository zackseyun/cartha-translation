id: MRK.6.1
reference: Mark 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: ta
  text: அவர் அங்கிருந்து புறப்பட்டுத் தமது சொந்த ஊருக்கு வந்தார்[a]. அவருடைய சீடர்களும் அவரைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது சொந்த ஊருக்கு வருகிறார்; அவருடைய சீடர்களும் அவரைப் பின்தொடர்கிறார்கள்.” கதையை உயிரோட்டமாகச் சொல்ல கிரேக்கத்தில் இங்கு நிகழ்கால வினைகள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: புறப்பட்டு
  rationale: முந்தைய இடத்திலிருந்து வெளியேறிச் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் ‘விட்டுச் சென்றார்’ என்பதைக் காட்டிலும் இயக்கத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் கிரேக்க இடவினையுரிச்சொல்லின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: ἔρχεται
  choice: வந்தார்
  rationale: கிரேக்கத்தில் நிகழ்கால வடிவம் கதையை உயிரோட்டமாகச் சொல்லப் பயன்படுத்தப்பட்டுள்ளது. நவீன தமிழ் கதைநடையில் இறந்தகாலமான ‘வந்தார்’ இயல்பாக உள்ளது; மூலத்தின் நிகழ்கால வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πατρίδα
  choice: சொந்த ஊர்
  rationale: இந்தச் சூழலில் இயேசுவின் சொந்தப் பகுதி அல்லது ஊரைக் குறிக்கிறது; தேசம் என்ற பரந்த பொருளை விட ‘சொந்த ஊர்’ சூழலுக்குப் பொருத்தமானது.
- source_word: ἀκολουθοῦσιν
  choice: பின்தொடர்ந்தார்கள்
  rationale: சீடர்கள் அவருடன் சென்றதையும் அவரைப் பின்பற்றியதையும் வெளிப்படுத்தும் வழக்கமான வேதாகமத் தமிழ்ச் சொல்; கிரேக்க நிகழ்காலம் தமிழ் கதைநடைக்கேற்ப இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: கற்பவர்களாகவும் ஒருவரைப் பின்பற்றுகிறவர்களாகவும் உள்ள உறவைத் தக்கவைக்கும், நவீன தமிழில் நிலைபெற்ற சொல்.
theological_decisions:
- issue: ἔρχεται, ἀκολουθοῦσιν ஆகிய வரலாற்று நிகழ்கால வடிவங்களின் மொழிபெயர்ப்பு
  choice: தமிழ் கதைநடைக்கேற்ப ‘வந்தார்’, ‘பின்தொடர்ந்தார்கள்’ என்று இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வருகிறார்; பின்தொடர்கிறார்கள்’ என்று கிரேக்க நிகழ்காலத்தைத் தக்கவைத்தல்.
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல, கதைநடை சார்ந்த மொழிபெயர்ப்புத் தீர்மானம். இயல்பான நவீன தமிழுக்காக இறந்தகாலம் பயன்படுத்தப்பட்டாலும், மூலத்தின் உயிரோட்டமான நிகழ்கால வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவர்/தமது’ என்ற மரியாதை வடிவங்களும், சீடத்துவப் பொருளைத் தக்கவைக்கும் ‘பின்தொடர்ந்தார்கள்’ என்பதும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
