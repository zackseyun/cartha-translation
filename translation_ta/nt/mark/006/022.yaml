id: MRK.6.22
reference: Mark 6:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: ta
  text: ஏரோதியாளின் மகள்[a] உள்ளே வந்து நடனமாடி, ஏரோதுக்கும் அவருடன் பந்தியில் சாய்ந்து அமர்ந்திருந்தவர்களுக்கும்[b] மகிழ்ச்சி அளித்தபோது, அரசன் அந்தச் சிறுமியிடம், “உனக்கு என்ன வேண்டுமானாலும் என்னிடம் கேள்; அதை உனக்குத் தருவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள் அல்லது உரைமரபுகள் இவ்விடத்தை ‘அவனுடைய மகள் ஏரோதியாள்’ என்று புரிந்துகொள்கின்றன. இங்கு பின்பற்றப்படும் கிரேக்க வாசகம் ‘ஏரோதியாளின் மகள்’ என்று கூறுகிறது.
    reason: textual_variant
  - marker: b
    text: அதாவது, அவருடன் விருந்துண்டவர்கள்; அக்கால விருந்துகளில் மேசையருகே சாய்ந்து அமர்ந்து உண்பது வழக்கமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: உள்ளே வந்து
  rationale: இறந்தகாலப் பெயரெச்சம் காலத்தைக் குறிக்கும் வகையில் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது; விருந்து நடைபெற்ற இடத்திற்குள் வந்த இயக்கமும் காக்கப்படுகிறது.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ஏரோதியாளின் மகள்
  rationale: இங்கு பின்பற்றப்படும் கிரேக்க வாசகம் அந்தப் பெண்ணை ஏரோதியாளின் மகளாக அடையாளப்படுத்துகிறது. உரை வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ὀρχησαμένης
  choice: நடனமாடி
  rationale: செயல்களின் தொடரை இயல்பான தமிழில் தெரிவிக்கும் அதேவேளையில், கிரேக்கச் சொல்லின் நேரடிப் பொருளைக் காக்கிறது.
- source_word: ἀρεσάσης
  choice: மகிழ்ச்சி அளித்தபோது
  rationale: ἀρέσκω என்பதன் ‘மகிழ்வித்தல்/பிரியமாயிருத்தல்’ என்ற பொருளை மிகைப்படுத்தாமல் தெளிவாகத் தருகிறது.
- source_word: τοῖς συνανακειμένοις
  choice: அவருடன் பந்தியில் சாய்ந்து அமர்ந்திருந்தவர்களுக்கும்
  rationale: விருந்தில் உடன் உண்பவர்கள் மேசையருகே சாய்ந்த நிலையில் இருந்த பண்டைய வழக்கத்தின் தெளிவான காட்சியைப் பாதுகாக்கிறது.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: அரசன் ... என்றான்
  rationale: ஏரோது அந்திப்பாவின் வரலாற்றுத் தொழில்நுட்பப் பட்டத்தை மாற்றிப் புகுத்தாமல், மாற்குவின் βασιλεύς என்ற சொல்லையே நேரடியாகப் பின்பற்றுகிறது.
- source_word: τῷ κορασίῳ
  choice: அந்தச் சிறுமியிடம்
  rationale: κοράσιον என்பதன் பெண் குழந்தை அல்லது இளம் பெண் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Αἴτησόν με
  choice: என்னிடம் கேள்
  rationale: கோரிக்கை வைப்பதைக் குறிக்கும் கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὃ ἐὰν θέλῃς
  choice: உனக்கு என்ன வேண்டுமானாலும்
  rationale: எதை வேண்டினாலும் கேட்கலாம் என்ற வரம்பற்ற தேர்வின் பொருளைப் பாதுகாக்கிறது.
- source_word: δώσω σοι
  choice: அதை உனக்குத் தருவேன்
  rationale: முந்தைய ‘என்ன வேண்டுமானாலும்’ என்பதைக் குறிக்கும் ‘அதை’ தமிழில் இயல்பான நிறைவுக்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஏரோது அந்திப்பாவைக் குறிக்கும் βασιλεύς சொல்லின் மொழிபெயர்ப்பு
  choice: அரசன்
  alternative: நாற்பங்கின் ஆட்சியாளர் / ஆட்சியாளர்
  rationale: வரலாற்று ரீதியாக ஏரோது அந்திப்பா நாற்பங்கின் ஆட்சியாளராக இருந்தாலும், மாற்கு பயன்படுத்தும் ‘அரசன்’ என்ற சொல்லை மொழிபெயர்ப்பு காக்கிறது; வெளிப்புற வரலாற்றுத் தகவலால் மூல உரை திருத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘பந்தியில் சாய்ந்து அமர்ந்திருந்தவர்கள்’ என்பது பண்டைய விருந்து முறையின் காட்சியைப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. உரை வேறுபாட்டுக் குறி தொடர்புடைய ‘மகள்’ என்பதற்குப் பின்னும், பண்பாட்டு விளக்கக் குறி விருந்து விருந்தினர்களைக் குறிக்கும் சொற்றொடருக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
