translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் தொடர் இணைப்புகள் தமிழுக்கு இயல்பான வினையெச்சத் தொடராக மாற்றப்பட்டுள்ளன; கடல்சார் வினையின் குறிப்பான பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
