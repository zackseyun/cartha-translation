  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: ta
  text: அவர்கள் கடந்து சென்று, நிலத்தை[a] அடைந்தபின் கெனேசரேத்துக்கு வந்து, அங்கே படகைக் கரையோரம் நிறுத்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கரையை அடைந்தபின்’; கிரேக்கத்தில் ‘நிலம்’ என்று உள்ளது. படகிலிருந்து நிலத்தை அல்லது கரையை அடைந்ததையே இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அங்கே படகை நங்கூரமிட்டார்கள்’ அல்லது ‘அங்கே கரைசேர்ந்தார்கள்’; இங்கு வரும் வினைச்சொல், படகைக் கரைக்கு அல்லது நிறுத்துமிடத்துக்குக் கொண்டுவந்து நிறுத்துவதைக் குறிக்கும் கடல்சார் சொல்லாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: கடந்து சென்று
  rationale: இறந்தகால வினையெச்சம், தொடர்ந்து வரும் முதன்மைச் செயலுக்கு முன்பு கடந்து சென்றதைச் ச இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: கெனேசரேத்து நிலப்பகுதியை அடைந்து
  rationale: γῆ என்பதன் அடிப்படைப் பொருளான ‘நிலம்’ என்பதையும், படகுப் பயணத்தின் முடிவில் அந்தப் பகுதியை அடைந்த சூழலையும் காக்கிறது.
- source_word: Γεννησαρὲτ
  choice: கெனேசரேத்து
  rationale: இடப்பெயர் நவீனத் தமிழின் ஒலிப்பெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது; அடுத்துள்ள ‘நிலப்பகுதி’ என்பதுடன் இயல்பாக இணைய ‘கெனேசரேத்து’ என்ற சாரியைப் பெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσωρμίσθησαν
  choice: அங்கே படகைக் கரையோரம் நிறுத்தினார்கள்
  rationale: படகைக் கரையருகே கொண்டு வந்து நிலைநிறுத்தும் கடல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘அங்கே’ என்பது இலக்கிடத்தைத் தமிழில் தெளிவுபடுத்தும் சூழல்சார் சேர்க்கை.
- source_word: καί
  choice: தொடர்ச்சியான வாக்கிய அமைப்பு
  rationale: கிரேக்க மொழியின் எளிய இணைப்புகள் தமிழில் தனித்தனியாக ‘மற்றும்’ என்று மொழிபெயர்க்கப்படாமல், வினையெச்சங்களாலும் தொடர்ச்சியான வாக்கிய அமைப்பாலும் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
