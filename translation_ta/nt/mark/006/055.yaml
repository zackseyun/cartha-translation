base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: ta
  text: அவர்கள் அந்தப் பகுதி முழுவதும் விரைந்து ஓடி, அவர் எங்கே இருக்கிறார் என்று கேள்விப்பட்டார்களோ அங்கே நோயுற்றவர்களைப் படுக்கைப் பாய்களில் சுமந்துகொண்டு போகத் தொடங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூக்குப்படுக்கைகளில்’ அல்லது ‘கட்டில்களில்’; கிரேக்கச் சொல் எளிதில் எடுத்துச் செல்லக்கூடிய சாதாரணப் படுக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: முழுவதும் விரைந்து ஓடி
  rationale: இச்சொல் ஓர் இடப்பரப்பு முழுவதும் அவசரமாகச் சென்று திரிந்ததை உணர்த்துகிறது; ‘விரைந்து ஓடி’ என்பது வேகத்தையும், ‘முழுவதும்’ என்பது பரவலான இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: அந்தப் பகுதி முழுவதும்
  rationale: χώρα இங்கு நவீன அரசியல் நாடு என்பதைக் காட்டாமல் சுற்றியுள்ள நிலப்பகுதி அல்லது வட்டாரத்தைக் குறிக்கிறது.
- source_word: ἤρξαντο ... περιφέρειν
  choice: சுமந்துகொண்டு போகத் தொடங்கினார்கள்
  rationale: ἤρξαντο செயல் தொடங்கியதைக் குறிக்கிறது; περιφέρειν நோயுற்றவர்களை இடம்விட்டு இடம் உடல்ரீதியாகச் சுமந்து கொண்டுபோனதைச் சுட்டுகிறது.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: படுக்கைப் பாய்களில்
  rationale: κράβαττος எளிதில் எடுத்துச் செல்லக்கூடிய சாதாரணப் பாய், மெத்தைப்பலகை அல்லது கட்டிலைக் குறிக்கலாம். ‘படுக்கைப் பாய்’ எளிய எடுத்துச் செல்லத்தக்க படுக்கை என்ற மையக் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς κακῶς ἔχοντας
  choice: நோயுற்றவர்களை
  rationale: சொல்லுக்குச் சொல் ‘மோசமான நிலையில் இருப்பவர்கள்’ என்றாலும், இது நோயுற்றவர்களைக் குறிக்கும் வழக்குச் சொற்றொடர்.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: அவர் எங்கே இருக்கிறார் என்று கேள்விப்பட்டார்களோ அங்கே
  rationale: ὅπου சூழலில் இலக்கிடத்தைக் காட்டுகிறது; ὅτι மறைமுகமாகக் கேள்விப்பட்ட செய்தியை அறிமுகப்படுத்துகிறது. அவர் இருப்பதாகத் தகவல் கிடைத்த எந்த இடத்திற்கும் அவர்கள் சென்றனர் என்ற பொருள் இயல்பாகப் பாதுகாக்கப்படுகிறது.
