source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: ta
  text: ஏனெனில் யோவான் ஏரோதிடம், “உன் சகோதரனுடைய மனைவியை நீ வைத்துக்கொள்வது சட்டப்படி அனுமதிக்கப்பட்டதல்ல[a]” என்று தொடர்ந்து சொல்லிவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சகோதரனுடைய மனைவியை வைத்துக்கொள்ள உனக்கு அனுமதி இல்லை.”
    reason: ἔξεστιν என்பதன் ‘சட்டப்படி உரியது’ மற்றும் ‘அனுமதிக்கப்பட்டது’ ஆகிய நெருங்கிய பொருள் வாய்ப்புகளைப் பேணும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து ... சொல்லிவந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ந்து அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கிறது; தமிழில் ‘தொடர்ந்து ... சொல்லிவந்தார்’ அதன் நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: Ἡρῴδῃ
  choice: ஏரோதிடம்
  rationale: பெயரை நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தருகிறது; வேற்றுமை உருபு உரையாடலின் இலக்கைச் சுட்டுகிறது.
- source_word: Οὐκ ἔξεστίν σοι
  choice: நீ ... சட்டப்படி அனுமதிக்கப்பட்டதல்ல
  rationale: ἔξεστιν என்பதிலுள்ள சட்டம் மற்றும் ஒழுக்கம் சார்ந்த அனுமதி என்ற வலிமையைப் பேணுகிறது; வெறும் ‘சரியல்ல’ என்பதைவிட மூலத்திற்கு நெருக்கமானது.
- source_word: ἔχειν
  choice: வைத்துக்கொள்வது
  rationale: திருமண உறவின் சூழலில் ‘உடையவனாக இருத்தல்/தன்னிடம் வைத்திருத்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘திருமணம் செய்துகொள்வது’ என மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: γυναῖκα
  choice: மனைவியை
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள் இருக்கலாம்; ‘உன் சகோதரனுடைய’ என்ற உடைமைத் தொடர் இங்கு திருமணப் பொருளைத் தெளிவாக்குகிறது.
- source_word: τοῦ ἀδελφοῦ σου
  choice: உன் சகோதரனுடைய
  rationale: குற்றச்சாட்டின் மையமான குடும்ப உறவைத் துல்லியமாகப் பேணும் இயல்பான தமிழ் உடைமைத் தொடர்.
theological_decisions:
- issue: யோவானின் கண்டனத்தின் சட்ட-ஒழுக்க இயல்பு
  choice: ‘சட்டப்படி அனுமதிக்கப்பட்டதல்ல’ என்று மொழிபெயர்த்தல்
  alternative: ‘உனக்கு அனுமதி இல்லை’ அல்லது ‘அது சரியல்ல’ என்று மொழிபெயர்த்தல்
  rationale: ἔξεστιν அனுமதிக்கப்பட்டது அல்லது சட்டபூர்வமானது என்பதைக் குறிக்கிறது. பின்னணியில் தோராவின் திருமணத் தடைகள் இருக்கக்கூடும்; ஆனால் வசனம் அவற்றை வெளிப்படையாக மேற்கோள் காட்டாததால், அந்தச் சட்ட-ஒழுக்க வலிமையை மட்டும் பேணி கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சொல்லிவந்தார்’ தொடர்ச்சியைப் பேணுகிறது; ‘சட்டப்படி அனுமதிக்கப்பட்டதல்ல’ தீர்க்கதரிசனக் கண்டனத்தின் சட்ட-ஒழுக்க வலிமையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
