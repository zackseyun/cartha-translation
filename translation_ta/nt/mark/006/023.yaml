source:
  edition: SBLGNT
  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: ta
  text: அவன் அவளிடம் சத்தியம் செய்து, “நீ என்னிடம் எதைக் கேட்டாலும் அதை உனக்குக் கொடுப்பேன்—என் ராஜ்யத்தின் பாதிவரை” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤμοσεν
  choice: ஆணையிட்டு
  rationale: ὀμνύω என்பதன் இறந்தகால வடிவம் உறுதியான ஆணை செய்வதைக் குறிக்கிறது. ‘ஆணையிட்டு’ என்பது அதன் தீவிரத்தைக் காத்து, இன்றைய தமிழில் இயல்பாக உள்ளது.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: பெண்பால் ஒருமை வேற்றுமை வடிவம் சூழலில் அந்தப் பெண்ணைக் குறிக்கிறது; நேரடியாக அவளிடம் கூறியதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: Ὅ τι ἐάν
  choice: எதைக் ... ஆனாலும்
  rationale: இந்தத் தொடர்புச் சொற்றொடர் வரையறுக்கப்படாத, திறந்த நிபந்தனையைக் காட்டுகிறது. தமிழில் ‘எதைக் கேட்டாலும்’ அதன் பரந்த பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: με αἰτήσῃς
  choice: நீ என்னிடம் ... கேட்டாலும்
  rationale: αἰτέω என்பது கேட்பது அல்லது கோருவது. இங்கு நேரடிப் பேச்சில் ‘என்னிடம் கேட்டாலும்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: δώσω σοι
  choice: அதை உனக்குக் கொடுப்பேன்
  rationale: எதிர்கால வினையும் மறைமுகச் செயப்படுபொருளும் வாக்குறுதியின் வலிமையுடன் வெளிப்படுகின்றன. தமிழின் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἕως ἡμίσους
  choice: பாதிவரைகூட
  rationale: ἕως இங்கு காலத்தையல்ல, அளவின் உச்சவரம்பைக் குறிக்கிறது. ‘பாதிவரைகூட’ அந்த எல்லையையும் மிகைப்படுத்தப்பட்ட தாராளத்தையும் வெளிப்படுத்துகிறது.
- source_word: τῆς βασιλείας μου
  choice: என் அரசின்
  rationale: βασιλεία என்பது ஆட்சி, அரசுரிமை, அல்லது ஆளுகைக்குட்பட்ட அரசு/நாடு எனப் பொருள்படலாம். இங்குள்ள அரசவைக் கூற்றில் ‘என் அரசு’ என்பது குறிப்பிட்ட இறையியல் பொருளை ஏற்றாமல் தேவையான பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஏரோதின் பேச்சில் βασιλεία என்பதன் பொருள்
  choice: அரசு
  alternative: ஆட்சி / அரசதிகாரம்
  rationale: சொல் ஆளப்படும் பகுதியையோ அரசாட்சி செலுத்துதலையோ குறிக்கலாம். இச்சூழலில் ‘என் அரசின் பாதி’ என்பது மரபான அரசவைக் கூற்றை இயல்பாகத் தெரிவிக்கிறது; அதேவேளை இதற்கு இறையியல் சார்ந்த தொழில்நுட்பப் பொருளைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடிப் பேச்சு நடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜ்யம்’ என்பதற்குப் பதிலாக நவீன ‘அரசு’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் மிகைப்படுத்தப்பட்ட அரசவைக் கூற்று அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
