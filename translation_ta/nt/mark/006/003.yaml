source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ta
  text: “இவன் தச்சன் அல்லவா? மரியாளின் மகனும், யாக்கோபு, யோசே[a], யூதா, சீமோன் ஆகியோரின் சகோதரனும் இவன்தானே? இவனுடைய சகோதரிகளும் இங்கே நம்மோடு இருக்கிறார்கள் அல்லவா?” அவரால் இடறலடைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோசே’ என்பதற்கு ‘யோசேப்பு’ என்றும் மொழிபெயர்க்கலாம்; இங்கு கிரேக்கத்தில் தனித்த பெயர்வடிவம் உள்ளது.
    reason: பெயர்வடிவ மாற்று
  - marker: b
    text: ‘அவரால் இடறலடைந்தார்கள்’ என்பதை ‘அவரை ஏற்றுக்கொள்ள முடியாமல் போனார்கள்’ அல்லது ‘அவர்மேல் மனவருத்தம் கொண்டார்கள்’ என்றும் பொருள்கொள்ளலாம். ‘சகோதரன்’, ‘சகோதரிகள்’ என்பவை வழக்கமாக உடன்பிறப்புகளைக் குறிக்கும்; சில கிறிஸ்தவ மரபுகள் இங்கே அவற்றை நெருங்கிய உறவினர்கள் அல்லது ஒன்றுவிட்ட உடன்பிறப்புகள் எனப் புரிந்துகொள்கின்றன.
    reason: சொற்பொருள் மற்றும் மாற்று உறவுமுறை வாசிப்பு
lexical_decisions:
- source_word: τέκτων
  choice: தச்சன்
  rationale: இச்சொல் பொதுவாகக் கைவினைஞர் அல்லது கட்டடத் தொழிலாளர் என்ற பரந்த பொருளையும் தரக்கூடும்; ஆயினும் இச்சூழலில் மரபாகவும் இயல்பாகவும் புரியக்கூடிய ‘தச்சன்’ என்பதே தெளிவான தேர்வு.
- source_word: υἱὸς τῆς Μαρίας
  choice: மரியாளின் மகன்
  rationale: ஊரார் இயேசுவை அவரது தாயின் வழியாக அடையாளப்படுத்தும் கிரேக்கத்தின் குறியிடத்தக்க சொற்றொடரை நேரடியாகப் பாதுகாக்கிறது; அதன் சமூக நுட்பத்தை விளக்கிச் சேர்க்கவில்லை.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: சகோதரன் / சகோதரிகள்
  rationale: கிரேக்கச் சொற்களின் வழக்கமான நேரடிப் பொருள் இது. உறவின் துல்லிய இயல்பைப் பற்றிய மரபுவேறுபாட்டை முதன்மை உரை தீர்மானிக்காமல் விடுகிறது.
- source_word: Ἰωσῆτος
  choice: யோசே
  rationale: மூலத்தில் உள்ள தனித்த கிரேக்கப் பெயர்வடிவத்தை ‘யோசேப்பு’ என்று இயல்பாக்காமல் ஒலிபெயர்க்கிறது.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: இங்கே நம்மோடு இருக்கிறார்கள்
  rationale: பேசுவோருடனான உள்ளூர் மற்றும் சமூக அண்மையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: அவரைக் குறித்து இடறலடைந்தார்கள்
  rationale: இங்கு உடல்ரீதியான இடறல் அல்ல, இயேசுவை ஏற்க முடியாமல் அவரால் தடுமாறி எதிர்மறையாகப் பிரதிசெய்ததைக் குறிக்கிறது. ‘இடறலடைந்தார்கள்’ என்பது உருவகத் தன்மையையும் இறையியல் ஒலியையும் பாதுகாக்கிறது; அடிக்குறிப்பு இயல்பான மாற்றுச் சொல்லாக்கத்தைத் தருகிறது.
theological_decisions:
- issue: இயேசுவின் ‘சகோதரன்’, ‘சகோதரிகள்’ என்போரின் உறவுமுறை
  choice: முதன்மை உரையில் வழக்கமான ‘சகோதரன்’, ‘சகோதரிகள்’ என்ற சொற்களை வைத்திருத்தல்
  alternative: நெருங்கிய உறவினர்கள் அல்லது ஒன்றுவிட்ட சகோதரர்/சகோதரிகள் எனப் புரிந்துகொள்ளுதல்
  rationale: ἀδελφός, ἀδελφή ஆகியவற்றின் சாதாரண பொருள் சகோதர உறவே. ஆனால் அவர்கள் ஒரே தாயின் பிள்ளைகளா, ஒன்றுவிட்ட உடன்பிறப்புகளா, அல்லது பரந்த உறவினர்களா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், மரபுகளில் உள்ள வேறுபாட்டை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: ‘மரியாளின் மகன்’ என்ற அடையாளத்தின் சமூகத் தொனி
  choice: விளக்கமின்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: இழிவான அல்லது சந்தேகத் தொனியுள்ள அழைப்பாக வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழலில் இச்சொற்றொடருக்கு சமூகக் கூர்மை இருக்கலாம்; ஆனால் மூல உரை அதை வெளிப்படையாக விளக்காததால், தமிழிலும் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: σκανδαλίζω என்பதன் உருவக மற்றும் இறையியல் வலிமை
  choice: ‘இடறலடைந்தார்கள்’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘அவர்மேல் மனவருத்தம் கொண்டார்கள்’ அல்லது ‘அவரை ஏற்றுக்கொள்ள மறுத்தார்கள்’
  rationale: மாற்றுச் சொல்லாக்கங்கள் சூழ்நிலைப் பொருளைத் தெளிவாக்கினாலும், மூலத்தின் இடறல் உருவகத்தைச் சுருக்கிவிடும். முதன்மை உரை அந்தத் திணறலையும் எதிர்மறைப் பிரதிசெயலையும் ஒன்றாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். ஊராரின் தொடர்ச்சியான கேள்விகளை இயல்பாகச் சொல்ல ‘என்று சொல்லி’ சேர்க்கப்பட்டுள்ளது; இது உரையாடல் வடிவைத் தெளிவுபடுத்தும் தமிழ்ச் சொற்றொடர். ‘இவன்’ என்பது ஊராரின் நேரடி, பரிச்சயமான பேச்சுத் தொனியைப் பாதுகாக்கிறது; இறுதி விவரிப்பில் கதைசொல்லியின் மரியாதைநிலை ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
