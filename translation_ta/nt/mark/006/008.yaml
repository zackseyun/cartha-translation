  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடரின் கட்டளைத் தன்மையும், ‘கோலை மட்டும்’ என்ற வலியுறுத்தலும், அப்பம்–பை–காசு என வரும் பட்டியல் அமைப்பும் காக்கப்பட்டுள்ளன.
