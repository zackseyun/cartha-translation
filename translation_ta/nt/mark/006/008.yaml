reference: Mark 6:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: ta
  text: அவர் அவர்களிடம், பயணத்திற்காக ஒரு கோலை மட்டும் தவிர வேறெதையும் எடுத்துச் செல்ல வேண்டாம் என்று கட்டளையிட்டார்—அப்பமும் வேண்டாம், பையும்[a] வேண்டாம், இடுப்புக் கச்சையில் செப்புக் காசும்[b] வேண்டாம்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உணவுப் பொருட்களை வைத்துச் செல்லும் பயணப் பை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் ‘செப்பு’; இங்கு செப்பு நாணயங்களை, அதாவது பணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: கட்டளையிட்டார்
  rationale: இச்சொல் அதிகாரத்துடன் ஓர் அறிவுறுத்தலை வழங்குவதைக் குறிக்கிறது. பயணத்திற்கான இக்குறிப்புகள் விருப்ப ஆலோசனைகள் அல்ல என்பதைத் தெளிவாகக் காட்ட ‘கட்டளையிட்டார்’ பொருத்தமானது.
- source_word: μηδὲν αἴρωσιν
  choice: வேறெதையும் எடுத்துச் செல்ல வேண்டாம்
  rationale: பயணத்துக்குத் தேவையான பொருட்களைத் தம்முடன் எடுத்துச் செல்வதே இங்கு கருத்து. கோல் மட்டும் விதிவிலக்கு என்பதால் ‘வேறெதையும்’ என்று இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: εἰς ὁδὸν
  choice: பயணத்திற்காக
  rationale: சொல்லுக்குச் சொல் ‘வழிக்காக’ என்பதைக் காட்டிலும், பயண ஏற்பாட்டைக் குறிக்கும் இச்சூழலில் ‘பயணத்திற்காக’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: ஒரு கோலை மட்டும் தவிர
  rationale: ῥάβδος என்பது பயணத்தில் பயன்படுத்தும் கோலைக் குறிக்கிறது; μόνον தரும் வலியுறுத்தலை ‘மட்டும்’ காக்கிறது.
- source_word: ἄρτον
  choice: அப்பம்
  rationale: பொதுவாக ‘உணவு’ என்று விரிவாக்காமல், கிரேக்கத்தில் உள்ள குறிப்பான ‘அப்பம்’ என்ற பொருள் காக்கப்பட்டுள்ளது.
- source_word: πήραν
  choice: பை
  rationale: பயண உணவுப் பொருட்களை வைத்துச் செல்லும் பையை இச்சொல் குறிக்கலாம். பிரதான உரையில் சுருக்கமான ‘பை’ பயன்படுத்தப்பட்டு, அதன் குறிப்பான பயன்பாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ζώνην
  choice: இடுப்புக் கச்சை
  rationale: பணத்தை வைத்துக்கொள்ளக்கூடிய இடுப்பில் கட்டும் கச்சையை இச்சொல் குறிக்கிறது. ‘இடுப்புக் கச்சை’ நவீன வாசகருக்கு உடனடியாகப் புரியும்.
- source_word: χαλκόν
  choice: செப்புக் காசு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘செப்பு’; இங்கு அது செப்பால் செய்யப்பட்ட நாணயத்தை, அதாவது பணத்தைக் குறிக்கிறது. தமிழில் வெறும் ‘செப்பு’ என்பதைக் காட்டிலும் ‘செப்புக் காசு’ சூழற்பொருளைத் தெளிவாகத் தருவதோடு மூலச் சொல்லின் உருவகத்தையும் காக்கிறது.
