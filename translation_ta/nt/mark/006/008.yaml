  source_fidelity: மூலக் கிரேக்கத்தின் கட்டளை அமைப்பு, பயணத்திற்கான எதையும் எடுத்துச் செல்லக்கூடாது என்ற தடை, கோல் மட்டும் விதிவிலக்கு, அப்பம்–பை–இடுப்புக் கச்சையில் செப்புக் காசு என்ற பட்டியல் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. χαλκόν என்பதன் நாணயப் பயன்பாட்டை ‘செப்புக் காசு’ இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு அதன் சொல்லுக்குச் சொல் பொருளையும் தெரிவிக்கிறது.
  naturalness: நடை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘ஒரு கோலை மட்டும் தவிர வேறெதையும்’ என்பது மூலத்தின் விதிவிலக்கு மற்றும் வலியுறுத்தலை இயல்பாகத் தருகிறது. பட்டியலின் மறுப்புத் தொடர் வாசிக்கச் சீராக உள்ளது.
  terminology: ‘கட்டளையிட்டார்,’ ‘அப்பம்,’ ‘பை,’ ‘இடுப்புக் கச்சை,’ ‘செப்புக் காசு’ ஆகிய தேர்வுகள் சூழலுக்கும் பதிவுக்கும் பொருத்தமானவை. பெயர்கள் அல்லது இறையியல் சொற்கள் தொடர்பான சிக்கல் இவ்வசனத்தில் இல்லை. அடிக்குறிப்பு அடையாளங்கள் உரிய சொற்களுடன் இணைக்கப்பட்டுள்ளன.
