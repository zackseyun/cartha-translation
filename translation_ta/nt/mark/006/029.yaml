  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: ta
  text: அவருடைய சீடர்கள் கேள்விப்பட்டு வந்து, அவருடைய உடலை[a] எடுத்துக்கொண்டு ஒரு கல்லறையில் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான கிரேக்கச் சொல் குறிப்பாக இறந்த உடலை, அதாவது ‘சடலத்தை,’ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: இச்சூழலில் இறந்தகாலப் பங்கேற்புவினை காலத் தொடர்பைக் காட்டுகிறது. முந்தைய நிகழ்வைச் சுட்டும் மறைமுகச் செயப்படுபொருளை ‘இதை’ என வெளிப்படுத்துவது தமிழில் இயல்பாக உள்ளது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: μαθηταί என்பதன் வழக்கமான உறவுசார் பொருளை ‘சீடர்கள்’ துல்லியமாகக் காக்கிறது; சூழலில் ‘அவருடைய’ என்பது திருமுழுக்கு யோவானைக் குறிக்கிறது.
- source_word: ἦλθον
  choice: வந்து
  rationale: ἔρχομαι என்பதன் வருகைப் பொருளைத் தக்கவைத்து, அடுத்த செயலோடு இயல்பான தமிழ் வினையெச்சத்தால் இணைக்கிறது.
- source_word: ἦραν
  choice: எடுத்துச் சென்று
  rationale: αἴρω இங்கு உடலை எடுத்துத் தூக்கி அங்கிருந்து கொண்டு செல்வதைக் குறிக்கிறது; ‘எடுத்துச் சென்று’ அந்தச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πτῶμα
  choice: உடலை
  rationale: πτῶμα குறிப்பாக இறந்த உடலைக் குறிக்கிறது. முதன்மை உரையில் கண்ணியமான, இயல்பான ‘உடல்’ பயன்படுத்தப்பட்டு, அதன் துல்லியமான பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἔθηκαν
  choice: வைத்தார்கள்
  rationale: τίθημι என்பதற்கு அடக்கச் சூழலில் ‘வைத்தார்கள்’ என்பது தெளிவான, இயல்பான தமிழ் நடை.
- source_word: ἐν μνημείῳ
  choice: ஒரு கல்லறையில்
  rationale: μνημεῖον இங்கு உடல் வைக்கப்படும் அடக்க இடத்தைக் குறிக்கிறது; ‘கல்லறை’ புதிய ஏற்பாட்டுச் சூழலுக்கு ஏற்ற பொதுவான தமிழ் சொல்.
theological_decisions:
- issue: ‘அவருடைய சீடர்கள்’ என்பதில் ‘அவர்’ யாரைக் குறிக்கிறது?
  choice: திருமுழுக்கு யோவானின் சீடர்கள்
  alternative: இயேசுவின் சீடர்கள்
  rationale: உடனடி உரைச்சூழலில் கொல்லப்பட்ட திருமுழுக்கு யோவானே முன்னிலை நபர்; அவருடைய உடலை எடுத்துச் சென்று அடக்கம் செய்தவர்கள் அவருடைய சீடர்கள்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் செயல்வரிசை—கேள்விப்படுதல், வருதல், உடலை எடுத்துச் செல்லுதல், கல்லறையில் வைத்தல்—தெளிவாகக் காக்கப்பட்டுள்ளது.
