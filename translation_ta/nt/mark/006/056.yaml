source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: ta
  text: அவர் எங்கெல்லாம் கிராமங்களுக்கோ நகரங்களுக்கோ நாட்டுப்புறப் பகுதிகளுக்கோ சென்றாரோ, அங்கெல்லாம் நோயுற்றவர்களைச் சந்தைவெளிகளில் படுக்கவைத்து, அவருடைய ஆடையின் ஓரத்தையாவது[a] தொடுவதற்கு அவரிடம் கெஞ்சினார்கள். அவரைத் தொட்டவர்கள் அனைவரும் நலமடைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆடையின் ஓரம்” என்பதற்கு “ஆடையின் கீழ்விளிம்பு” அல்லது “ஆடையின் குஞ்சம்” என்றும் பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “காப்பாற்றப்பட்டார்கள்” அல்லது “மீட்கப்பட்டார்கள்”; இச்சூழலில் அது நோயிலிருந்து நலமடைந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: எங்கெல்லாம் ... அங்கெல்லாம்
  rationale: எந்த இடத்திற்குச் சென்றாலும் என்ற பொதுப்படுத்தும் பொருளையும், நிகழ்வு மீண்டும் மீண்டும் நடந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσεπορεύετο
  choice: சென்றாரோ
  rationale: இடங்களுக்குள் சென்றார் என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; தொடர்ச்சியாக நிகழ்ந்த செயலை ‘எங்கெல்லாம் ... அங்கெல்லாம்’ என்ற அமைப்பு காட்டுகிறது.
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: கிராமங்களுக்கோ நகரங்களுக்கோ நாட்டுப்புறப் பகுதிகளுக்கோ
  rationale: ἀγρούς என்பதை தனித்தனி வயல்கள் என்று குறுக்காமல், இப்பட்டியலில் பொருந்தும் ஊரக அல்லது திறந்த நாட்டுப்புறப் பகுதிகள் என்ற பரந்த பொருளில் தருகிறது.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: சந்தைவெளிகளில்
  rationale: ἀγορά என்பது சந்தையையும் பொதுமக்கள் கூடும் திறந்த வெளி அல்லது சதுக்கத்தையும் குறிக்கலாம்; ‘சந்தைவெளி’ இரு கூறுகளையும் தெளிவாகக் கொண்டுள்ளது.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: நோயுற்றவர்களை ... படுக்கவைத்து
  rationale: பல இடங்களில் வழக்கமாக நடந்த செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; நோயுற்றவர்களை அங்கே கிடத்தினார்கள் என்பதையும் தெளிவுபடுத்துகிறது.
- source_word: παρεκάλουν αὐτόν
  choice: அவரிடம் கெஞ்சினார்கள்
  rationale: வெறும் வேண்டுகோளைவிட தீவிரமான மன்றாட்டை παρακαλέω இச்சூழலில் குறிக்கிறது.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: ஓரத்தையாவது தொட அனுமதிக்கும்படி
  rationale: κἄν குறிக்கும் குறைந்தபட்ச வேண்டுகோளை ‘-ஆவது’ இயல்பாக வெளிப்படுத்துகிறது. அனுமதி என்ற கருத்து வேண்டுகோளில் மறைமுகமாக இருப்பதால் தமிழில் வாக்கியத்தை இயல்பாக்குகிறது.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: அவருடைய ஆடையின் ஓரம்
  rationale: κράσπεδον என்பது ஆடையின் ஓரம், கீழ்விளிம்பு, அல்லது தொங்கல் எனப் பொருள்படலாம். முதன்மை உரையில் மிகையாகக் குறிப்பாக்காமல் ‘ஓரம்’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὅσοι ἂν ἥψαντο αὐτοῦ
  choice: அவரைத் தொட்டவர்கள் அனைவரும்
  rationale: αὐτοῦ என்பது இலக்கணப்படி ‘அவரை’ என்பதைக் குறிக்கிறது. முந்தைய சொற்றொடர் அவரது ஆடையின் ஓரத்தைத் தொடுவதைச் சொன்னாலும், மூல உரையின் நேரடி குறிப்பை மாற்றாமல் வைத்திருக்கிறது.
- source_word: ἐσῴζοντο
  choice: நலமடைந்தார்கள்
  rationale: σῴζω என்பதன் பரந்த பொருள் ‘காப்பாற்று/மீட்டு’; இங்கு நோயுற்றவர்கள் உடல்நலம் பெறுவது உடனடிச் சூழல். ‘நலமடைந்தார்கள்’ அந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது; பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: σῴζω என்பதன் மீட்பு மற்றும் குணமடைதல் சார்ந்த பொருள்
  choice: நலமடைந்தார்கள்
  alternative: காப்பாற்றப்பட்டார்கள் / மீட்கப்பட்டார்கள்
  rationale: உடனடிச் சூழல் நோயுற்றவர்களின் உடல் நலமடைதலை முன்னிறுத்துகிறது. அதேவேளையில், மூல வினையின் பரந்த ‘காப்பாற்றப்படுதல்’ பொருளை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: இறுதி αὐτοῦ எதைக் குறிக்கிறது
  choice: அவரைத் தொட்டவர்கள்
  alternative: அவருடைய ஆடையின் ஓரத்தைத் தொட்டவர்கள்
  rationale: முந்தைய கருத்தால் ஆடையைத் தொடுதல் உணரப்பட்டாலும், கிரேக்க உரை இறுதியில் ‘அவரை’ என்று ஆண்பால் பிரதிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அதனை முதன்மை உரையில் நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘எங்கெல்லாம் ... அங்கெல்லாம்’ என்ற அமைப்பு கிரேக்க உரையின் பொதுப்படுத்தும் மற்றும் மீள்நிகழ்வைக் காட்டும் தன்மையைப் பாதுகாக்கிறது. ‘சந்தைவெளி’ என்பது பழமையான சந்தைச் சதுக்கத்தின் பொதுப் பயன்பாட்டைத் தெளிவாக உணர்த்துகிறது.
