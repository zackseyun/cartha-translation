source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: ta
  text: ஆனால், ஏரோது இதைக் கேட்டபோது, “நான் தலைவெட்டிக் கொன்ற யோவான்தான் உயிர்த்தெழுப்பப்பட்டான்[b]” என்று சொன்னான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சொல்லிக்கொண்டிருந்தான்” அல்லது “திரும்பத் திரும்பச் சொன்னான்.” கிரேக்க வினைச்சொல் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த செயலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உயிர்த்தெழுந்தான்” அல்லது “உயிர்த்தெழுந்திருக்கிறான்.” கிரேக்க வினைச்சொல் செயலப்பாட்டு வடிவில் உள்ளது; முதன்மை மொழிபெயர்ப்பு அந்த வினைக்குரலைப் பேணுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினைச்சொல்லின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதையில் ஏரோதின் எதிர்வினைக்குத் திரும்பும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἔλεγεν
  choice: சொன்னான்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது திரும்பத் திரும்ப நிகழ்ந்த பேச்சைக் குறிக்கக்கூடும்; இங்கு இயல்பான தமிழ் கதைநடைக்காக எளிய வடிவம் பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: நான் தலைவெட்டிக் கொன்ற யோவான்
  rationale: மூலத்தின் நேரடிப் பொருளையும் ஏரோதின் தனிப்பட்ட பொறுப்பையும் தெளிவாகப் பேணுகிறது.
- source_word: οὗτος
  choice: யோவான்தான்
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘தான்’ விகுதி இயல்பாகக் கொண்டுவருகிறது.
- source_word: ἠγέρθη
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கிறான்
  rationale: இறந்தவரிடமிருந்து எழுப்பப்பட்டதைக் குறிக்கும் கிரேக்கச் செயலப்பாட்டு வடிவத்தையும், அதன் தற்போதைய விளைவையும் பேணுகிறது.
theological_decisions:
- issue: ἠγέρθη என்ற உயிர்த்தெழுதல் சொல்லின் வினைக்குரல்
  choice: உயிர்த்தெழுப்பப்பட்டிருக்கிறான்
  alternative: உயிர்த்தெழுந்திருக்கிறான் / உயிரோடு எழுந்திருக்கிறான்
  rationale: கிரேக்க வினை செயலப்பாட்டு வடிவில் இருப்பதால், யோவான் எழுப்பப்பட்டான் என்ற வடிவம் பேணப்படுகிறது; யார் எழுப்பினார் என்பதை உரை வெளிப்படையாகச் சொல்லாததால் அது சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘தலைவெட்டிக் கொன்ற’ என்பது ἀποκεφαλίζω என்பதன் குறிப்பான பொருளைப் பேணுகிறது; ‘தான்’ என்பது οὗτος என்பதன் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
