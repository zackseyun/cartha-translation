  yaml_path: translation/nt/mark/006/043.yaml
  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: ta
  text: அவர்கள் உடைந்த துண்டுகளைப் பன்னிரண்டு கூடை நிறையவும் மீன்களிலிருந்தும் சேகரித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடைந்த துண்டுகள் நிறைந்த பன்னிரண்டு கூடைகளை.’ கிரேக்கத் தொடர் ‘உடைந்த துண்டுகள்,’ ‘பன்னிரண்டு கூடைகள்,’ அவற்றை நிரப்பிய அளவு ஆகிய கருத்துகளை இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: சேகரித்தார்கள்
  rationale: இங்கு αἴρω, உணவளித்த பின் மீதியானவற்றை எடுத்துச் சேர்ப்பதைக் குறிக்கிறது; ‘சேகரித்தார்கள்’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: κλάσματα
  choice: உடைந்த துண்டுகள்
  rationale: κλάσματα என்பது உடைக்கப்பட்ட அல்லது உடைந்து எஞ்சிய துண்டுகளைக் குறிக்கிறது; அப்பத்தை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சொல்லாட்சியைப் பேணுகிறது.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: பன்னிரண்டு கூடை நிறைய
  rationale: இந்தக் கிரேக்கத் தொடர் பன்னிரண்டு கூடைகளையும் அவற்றை நிரப்பிய அளவையும் இணைக்கிறது; தமிழில் ‘பன்னிரண்டு கூடை நிறைய’ என்பது அளவையும் நிறைவையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: κοφίνων
  choice: கூடை
  rationale: κόφινος என்பதற்கான தெளிவான பொதுச் சொல் ‘கூடை’; குறிப்பிட்ட அளவு அல்லது வடிவத்தைச் சேர்ப்பது மூலத்தை மீறிவிடும்.
- source_word: πληρώματα
  choice: நிறைய
  rationale: πλήρωμα இங்கு கூடைகளை நிரப்பிய முழு அளவு அல்லது உள்ளடக்கத்தைக் குறிக்கிறது; ‘நிறைய’ என்ற அளவுச் சொல் தமிழில் இதைச் சுருக்கமாகப் பேணுகிறது.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: மீன்களிலிருந்தும்
  rationale: ἀπό மூலத்திலிருந்து கிடைத்த பகுதி என்ற நுண்பொருளைத் தருகிறது. ‘மீன்களிலிருந்தும்’ என்பது ‘சில’ என்பதை வெளிப்படையாகச் சேர்க்காமல், மீனின் மீதிகளும் சேகரிக்கப்பட்டன என்பதை இயல்பாகச் சொல்கிறது.
