translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கிரேக்கத் தொடரின் அமைப்பால் ‘பன்னிரண்டு கூடை நிறைய’ மற்றும் ‘நிறைந்த பன்னிரண்டு கூடைகள்’ ஆகிய இரு புரிதல்களுக்கும் இடமிருப்பதால், மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. இறுதியில் ‘சேகரித்தார்கள்’ மீண்டும் சொல்லப்படுவது தமிழில் முழுமையான வாக்கியமாக இருக்கவும், καί மற்றும் ἀπό அளிக்கும் இணைப்பு/மூலப் பொருளைப் பேணவும் உதவுகிறது.
