  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. மூலத்தின் தொடர்ச்சியான விரோதம், கொல்லும் விருப்பம், அதற்கான இயலாமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன; அடிக்குறி குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
