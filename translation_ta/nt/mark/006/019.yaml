  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: ta
  text: ஆனால், ஏரோதியாள் அவர்மேல் பகை கொண்டிருந்தாள்[a]; அவரைக் கொல்ல விரும்பினாள். ஆனால் அவளால் முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மேல் மனக்கசப்பை வளர்த்துக்கொண்டிருந்தாள்.” இந்தக் கிரேக்க மரபுத்தொடர் தொடர்ந்து நீடித்த விரோதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள முரண்பாட்டைச் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: Ἡρῳδιὰς
  choice: ஏரோதியாள்
  rationale: தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: ἐνεῖχεν αὐτῷ
  choice: அவர்மேல் பகை வைத்திருந்தாள்
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் நீடித்த விரோதத்தையும் மனக்கசப்பையும் குறிக்கிறது; குறைநிறை வினைக்காலத்தின் தொடர்ச்சியான நிலையையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: ἤθελεν
  choice: விரும்பினாள்
  rationale: θέλω என்பதன் நோக்கம் அல்லது ஆசையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: அவரைக் கொல்ல
  rationale: சட்ட அல்லது அறநெறி சார்ந்த கூடுதல் பொருளைச் சேர்க்காமல் ἀποκτείνω என்பதன் நேரடிப் பொருளைத் தருகிறது.
- source_word: καὶ οὐκ ἠδύνατο
  choice: ஆனால் அவளால் முடியவில்லை
  rationale: καὶ இங்கு எதிர்மறையான திருப்பத்தை அறிமுகப்படுத்துகிறது; குறைநிறை வினைக்காலத்தில் கூறப்படும் இயலாமையைத் தெளிவாக வெளிப்படுத்துகிறது.
