translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘மாலை’ என்ற நேரக் குறிப்பைச் சேர்க்காமல், இரு காலக் கூற்றுகளின் மறுபயன்பாடு காக்கப்பட்டுள்ளது.
