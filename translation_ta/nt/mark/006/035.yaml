id: MRK.6.35
reference: Mark 6:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: ta
  text: நேரம் ஏற்கெனவே மிகவும் ஆகிவிட்டபோது[a], அவருடைய சீடர்கள் அவரிடம் வந்து, “இது மக்கள் வசிக்காத இடம்[b]; நேரமும் ஏற்கெனவே மிகவும் ஆகிவிட்டது” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “ஏற்கெனவே நீண்ட நேரம் ஆகியிருந்தபோது.”
    reason: கிரேக்கத்தின் காலத்தைக் குறிக்கும் மரபுத்தொடரின் நேரடி வடிவத்தைப் பதிவு செய்கிறது.
  - marker: b
    text: அல்லது, “இது ஓர் ஒதுக்குப்புறமான இடம்.”
    reason: ἔρημος என்பது குடியிருப்பில்லாத அல்லது தனிமையான இடத்தையும் குறிக்கலாம்.
lexical_decisions:
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: நேரம் அதற்குள் முன்னேறிவிட்டதை இரு இடங்களிலும் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: ὥρας πολλῆς γενομένης
  choice: நேரம் ஏற்கெனவே வெகுவாகக் கடந்துவிட்டபோது
  rationale: நாள் நேரம் மிகவும் முன்னேறிவிட்டதைச் சுட்டும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; மாலை என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: προσελθόντες αὐτῷ
  choice: அவரிடம் வந்து
  rationale: சீடர்கள் இயேசுவை அணுகியதைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: கிரேக்க உடைமைத் தொடர்பை வழக்கமான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: ἔλεγον
  choice: கூறினார்கள்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் உரையாடலை அறிமுகப்படுத்தும் இடத்தில் தமிழில் இயல்பாக எளிய இறந்தகாலத்தால் மொழிபெயர்க்கப்படுகிறது; ‘கூறிக்கொண்டிருந்தார்கள்’ என்பது தேவையற்ற தொடர்ச்சி அல்லது மீளுரைப்பை உணர்த்தக்கூடும்.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: இது மக்கள் வசிக்காத இடம்
  rationale: ἔρημος என்பதன் இச்சூழலுக்குரிய ‘குடியிருப்பில்லாத/தனிமையான’ பொருளைத் தெளிவாகத் தருகிறது; உணர்ச்சிசார் ‘பாழடைந்த’ என்ற பொருளைத் தவிர்க்கிறது.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: நேரமும் ஏற்கெனவே வெகுவாகக் கடந்துவிட்டது
  rationale: நேரம் மிகவும் முன்னேறிவிட்டது என்ற சீடர்களின் கூற்றை இயல்பாகத் தருவதோடு, முதல் காலக் குறிப்பின் மறுபயன்பாட்டையும் காக்கிறது.
