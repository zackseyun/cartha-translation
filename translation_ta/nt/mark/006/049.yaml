source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: ta
  text: ஆனால், அவர் கடலின்மேல் நடந்துகொண்டிருப்பதை அவர்கள் கண்டபோது, அவரைப் பேய்[a] என்று நினைத்துக் கூக்குரலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேயுருவத் தோற்றம்’ அல்லது ‘நிழலுருவம்.’ கிரேக்கச் சொல் φάντασμα, பேய் போன்ற ஒரு தோற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ஆனால், … அவர்கள்
  rationale: δέ இங்கு சீடர்களின் எதிர்வினைக்குத் திரும்பும் மென்மையான முரண்பாட்டு/தொடர்ச்சி இணைப்பாக உள்ளது; substantival article சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட சீடர்களைக் குறிக்கிறது.
- source_word: ἰδόντες αὐτόν
  choice: அவர் … இருப்பதை அவர்கள் கண்டபோது
  rationale: Aorist participle இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டது; αὐτόν இயேசுவைக் குறிக்கிறது.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: கடலின்மேல் நடந்துகொண்டிருப்பதை
  rationale: ἐπί + genitive இச்சூழலில் நீர்ப்பரப்பின்மேல் நடப்பதைக் குறிக்கிறது. θάλασσα என்பதற்கான நேரடியான ‘கடல்’ என்பதும் நிகழ்வின் வியப்பையும் காக்கிறது; நிகழ்ந்துகொண்டிருந்த செயலைத் தமிழ் தொடர்நிலை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔδοξαν
  choice: நினைத்து
  rationale: δοκέω இங்கு தவறாக எண்ணுதல் அல்லது கருதுதல் என்ற பொருளில் வருகிறது; ‘நினைத்து’ என்பது இயல்பான, மிகைப்படுத்தாத தமிழ் இணைப்பு.
- source_word: ὅτι φάντασμά ἐστιν
  choice: அவரைப் பேய் என்று
  rationale: φάντασμα என்பது பேயுருவத் தோற்றம், ஆவி போன்ற தோற்றம், அல்லது நிழலுருவம் என்பதைக் குறிக்கலாம். சாதாரண வாசகருக்குத் தெளிவான ‘பேய்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; தமிழில் நேரடி மேற்கோள் அல்லாத இந்த எண்ணத்தை ‘அவரைப் பேய் என்று’ என இயல்பாகச் சொல்லலாம்.
- source_word: καὶ ἀνέκραξαν
  choice: கூக்குரலிட்டார்கள்
  rationale: ἀνακράζω உரத்த, திடீர் கூச்சலைக் குறிக்கிறது. ‘கூக்குரலிட்டார்கள்’ அதன் தீவிரத்தைக் காக்கிறது; பயத்தால் ‘அலறினார்கள்’ என்று காரணத்தை அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: இயேசு நீரின்மேல் செய்த செயல்
  choice: கடலின்மேல் நடந்துகொண்டிருப்பதை
  alternative: கடலோரமாக நடந்துகொண்டிருப்பதை
  rationale: ἐπὶ τῆς θαλάσσης என்பது இக்கதைச் சூழலில் கடலின் நீர்ப்பரப்பின்மேல் நடப்பதையே இயல்பாகக் குறிக்கிறது; கடலோரமாக நடப்பதாக மாற்றுவது நிகழ்வின் நேரடிப் பொருளை மங்கச் செய்யும்.
- issue: φάντασμα என்பதன் இயல்பு
  choice: பேய்
  alternative: பேயுருவத் தோற்றம் / நிழலுருவம்
  rationale: சொல் தோன்றியதன் உண்மையான இயல்பை உறுதிப்படுத்தாமல், சீடர்கள் கண்டதாக எண்ணிய ஓர் அமானுஷ்யத் தோற்றத்தைக் குறிக்கிறது. ‘பேய்’ தெளிவான முதன்மைத் தேர்வு; விரிவான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் மரியாதையான கதைநடையிலும் வடிவமைக்கப்பட்டது. ‘கூக்குரலிட்டார்கள்’ என்பது உரத்த எதிர்வினையை வெளிப்படுத்துகிறது; பயம் என்ற காரணத்தை இவ்வசனத்திலேயே வெளிப்படையாகச் சேர்க்கவில்லை. அடிக்குறி அது விளக்கும் ‘பேய்’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டது.
