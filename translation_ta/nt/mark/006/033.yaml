base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: ta
  text: பலர் அவர்கள் போவதைக் கண்டு, அவர்களை அடையாளம் கண்டார்கள். அவர்கள் எல்லாப் பட்டணங்களிலிருந்தும்[b] கால்நடையாக[a] அங்கே ஒருசேர ஓடி, அவர்களுக்கு முன்பே சென்றடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கால்நடையாக” என்பதை “தரைவழியாக” என்றும் மொழிபெயர்க்கலாம்; இது படகுப் பயணத்துடன் உள்ள வேறுபாட்டை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பட்டணங்கள்” என்பதற்கான கிரேக்கச் சொல் சூழலைப் பொறுத்து “நகரங்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: பார்த்து
  rationale: கதைத் தொடரில் சாதாரணமாகக் காண்பதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ὑπάγοντας
  choice: போவதை
  rationale: பயணத்தின் முறையை இங்கே தேவையின்றி மீண்டும் குறிப்பிடாமல், நடந்துகொண்டிருந்த செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐπέγνωσαν
  choice: அடையாளம் கண்டுகொண்டார்கள்
  rationale: இச்சூழலில் புதிதாக அறிந்துகொள்வதை அல்ல, அவர்கள் யார் என்று அடையாளம் காண்பதைக் குறிக்கிறது.
- source_word: πολλοί
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் கிரேக்கப் பெயரடையின் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: πεζῇ
  choice: கால்நடையாக
  rationale: படகுப் பயணத்துக்கு மாறாக, நடந்து தரைவழியாகச் சென்றதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: எல்லாப் பட்டணங்களிலிருந்தும்
  rationale: πᾶς என்பதன் முழுமையையும் காத்து, கலிலேயச் சூழலில் πόλις என்பதற்கு நகரம் என்பதைக் காட்டிலும் அளவில் நடுநிலையான சொல்லைப் பயன்படுத்துகிறது.
- source_word: συνέδραμον
  choice: ஒருசேர ஓடி
  rationale: συντρέχω என்பதில் உள்ள ஓடுதலையும் பல இடங்களிலிருந்து ஒன்றுகூடி வருதலையும் காக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய கிரேக்க வினையடைக்கான நேரடியான, இயல்பான இணை.
- source_word: προῆλθον αὐτούς
  choice: அவர்களுக்கு முன்பே சென்றடைந்தார்கள்
  rationale: அவர்களை முந்திச் சென்று அந்த இடத்தை அடைந்தார்கள் என்ற ஒப்பீட்டுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
