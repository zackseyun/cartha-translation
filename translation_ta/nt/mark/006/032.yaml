  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: ta
  text: அவர்கள் படகில் ஓர் ஆளரவமற்ற[a] இடத்திற்குத் தனியாகப் போனார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் நடமாட்டமற்ற இடம்” அல்லது “வனாந்தரமான இடம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மற்றவர்களிடமிருந்து ஒதுங்கி” அல்லது “தனிப்பட்ட முறையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: தமிழில் முந்தைய நிகழ்வுடன் இயல்பாகத் தொடரும் விதத்தில் பொருள் வெளிப்படுகிறது; வசனத் தொடக்கத்தில் ‘மேலும்’ எனக் கட்டாயமாக மொழிபெயர்ப்பது இயல்பற்றதாக இருக்கும்.
- source_word: ἀπῆλθον
  choice: போனார்கள்
  rationale: முந்தைய இடத்திலிருந்து அவர்கள் சென்றதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ πλοίῳ
  choice: படகில் ஏறி
  rationale: சொல்லுக்கு நேர் வடிவம் ‘படகில்’ என்றாலும், இலக்கை நோக்கிச் சென்ற பயண முறையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் கூற ‘படகில் ஏறி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς ἔρημον τόπον
  choice: ஓர் ஆளரவமற்ற இடத்திற்கு
  rationale: ἔρημος இங்கு பாலைவனம் என்று கட்டாயப்படுத்தாமல், மக்கள் இல்லாத அல்லது ஒதுக்கமான இடத்தைக் குறிக்கிறது; ‘ஆளரவமற்ற’ அந்தப் பொருள்வீச்சை இயல்பாகக் காக்கிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: குழுவினர் மற்றவர்களிடமிருந்து தனியே சென்றனர் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அவர்கள் ஒருவரிடமிருந்து ஒருவர் பிரிந்தனர் என்று கூறவில்லை.
