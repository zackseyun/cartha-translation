  naturalness: «அவர்கள் படகில் ஓர் ஆளரவமற்ற இடத்திற்குத் தனியாகப் போனார்கள்» என்பது நவீன நிலையான தமிழில் இயல்பான, தெளிவான கதைநடையாக உள்ளது. «தனியாக» இங்கு குழுவாக மற்றவர்களிடமிருந்து ஒதுங்கிச் சென்ற பொருளில் இயல்பாகப் புரிகிறது.
  terminology: «ஆளரவமற்ற இடம்» ἔρημος τόπος என்பதன் மக்கள் இல்லாத/ஒதுக்கமான பொருளை பாலைவனம் என்று மிகைப்படுத்தாமல் காக்கிறது. «தனியாக» κατ’ ἰδίαν என்பதன் ‘தனியே/ஒதுங்கி’ என்ற நுணுக்கத்தைத் தருகிறது.
