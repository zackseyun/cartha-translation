  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: ta
  text: அப்பங்களை[a] உண்ட ஆண்கள்[b] ஐயாயிரம் பேர் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அப்பத்தை.’ கிரேக்கச் சொல் இரு பொருள்களையும் தரலாம்; இங்கு அது உணவளிப்பு நிகழ்வில் கூறப்பட்ட குறிப்பிட்ட அப்பங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘ஆண்கள்’ என்பது பொதுவாக மக்களைக் குறிக்காமல், குறிப்பாக வயதுவந்த ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: இருந்தார்கள்
  rationale: இங்கு εἰμί வினையின் இறந்தகாலத் தொடர்நிலை வடிவம் எண்ணிக்கையை எளிய இணைப்பாகக் கூறுகிறது; ‘இருந்தார்கள்’ என்பது எண்ணப்பட்டார்கள் என்ற கூடுதல் நுணுக்கத்தைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: οἱ φαγόντες
  choice: உண்ட
  rationale: பெயர்ச்சொல்லாக்கப்பட்ட இறந்தகாலப் பங்கேற்பு வடிவம், உணவு உண்டவர்களை முடிந்த செயல் மூலம் அடையாளப்படுத்துகிறது. தமிழில் ‘உண்ட’ என்பது இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοὺς ἄρτους
  choice: அப்பங்களை
  rationale: ἄρτος என்பது ‘அப்பம்’ அல்லது பொதுவாக ‘ரொட்டி/உணவாகிய அப்பம்’ எனப் பொருள்படலாம்; இங்கு பன்மை வடிவம் உணவளிப்பு நிகழ்வில் பகிரப்பட்ட குறிப்பிட்ட அப்பங்களைக் குறிக்கிறது.
- source_word: πεντακισχίλιοι
  choice: ஐயாயிரம்
  rationale: மூலத்தின் எண்ணிக்கையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: ἀνήρ என்பது பொதுவாக மனிதர்களைக் குறிக்கும் சொல் அல்ல; குறிப்பாக ஆண்களைக் குறிக்கிறது. ஆகவே பாலினக் குறிப்பைத் தெளிவாகப் பாதுகாக்க ‘ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: எண்ணப்பட்டவர்களைக் குறிக்கும் பாலினச் சிறப்புடைய சொல்
  choice: ἄνδρες என்பதை முதன்மை உரையில் ‘ஆண்கள்’ என வழங்குதல்
  alternative: மக்கள்
  rationale: கிரேக்க மூலத்தில் பொதுவான ‘மக்கள்’ என்ற பொருளுடைய சொல் அல்லாமல், ஆண்களைக் குறிப்பாகக் குறிக்கும் ἀνήρ பயன்படுத்தப்பட்டுள்ளது. எண்ணிக்கை எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பதை மொழிபெயர்ப்பு முன்கூட்டியே பொதுமைப்படுத்தாமல், மூலத்தின் பாலினச் சிறப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ட’ என்பது சுருக்கமான வேதாகம நடையைத் தக்கவைத்தாலும் இன்றைய தமிழிலும் தெளிவாக உள்ளது; ‘பேர்’ எண்ணிக்கைக் கூறலை இயல்பாக்குகிறது.
