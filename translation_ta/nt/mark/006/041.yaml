source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: ta
  text: அவர் அந்த ஐந்து அப்பங்களையும் இரண்டு மீன்களையும் எடுத்துக்கொண்டு, வானத்தை நோக்கி மேல்நோக்கிப் பார்த்து, ஆசீர்வாதம் கூறினார்.[a] பின்பு அப்பங்களைப் பிட்டு, மக்கள் முன் வைக்கும்படி[b] அவற்றைத் தம் சீடர்களிடம் கொடுத்துக்கொண்டிருந்தார். இரண்டு மீன்களையும் அனைவருக்கும் பங்கிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றி செலுத்தினார்.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “ஆசீர்வதித்தார்”; உணவு உண்ணும் சூழலில் அது நன்றி செலுத்துவதோடு பொருளில் நெருங்கியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அவர்கள்முன் வைக்கும்படி”; இங்கு “அவர்கள்” என்பது மக்களைக் குறிக்கிறது.
    reason: referent_clarification
lexical_decisions:
- source_word: λαβὼν
  choice: எடுத்துக்கொண்டு
  rationale: இறந்தகால வினையெச்சம் அடுத்தடுத்த செயல்களின் தொடக்கத்தைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் தொடர்ச்சியைப் பேணியும் உள்ளது.
- source_word: ἄρτους
  choice: அப்பங்கள்
  rationale: எண்ணப்பட்ட ஐந்து தனித்தனி அப்பங்களைக் குறிப்பதால், பொதுவான ‘உணவு’ அல்லது ‘ரொட்டி’ என்பதைக் காட்டிலும் ‘அப்பங்கள்’ இச்சூழலுக்கு ஏற்றது.
- source_word: ἰχθύας
  choice: மீன்கள்
  rationale: எண்ணப்பட்ட இரண்டு மீன்களைக் குறிக்கும் நேரடியான தமிழ் இணை.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: வானத்தை நோக்கி அண்ணாந்து பார்த்து
  rationale: மேல்நோக்கிய பார்வையையும் வானத்தை நோக்கிய திசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐλόγησεν
  choice: ஆசீர்வாதம் கூறினார்
  rationale: கிரேக்க வினைச்சொல்லின் ‘ஆசீர்வதித்தல்/ஆசீர்வாதம் கூறுதல்’ என்ற நேரடியான பொருளைப் பேணுகிறது; வெளிப்படையாக இல்லாத ஒரு செயப்படுபொருளைத் தமிழில் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: κατέκλασεν
  choice: அப்பங்களைப் பிட்டு
  rationale: அப்பத்தைப் பகிர்வதற்காகப் பிய்க்கும் உறுதியான செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐδίδου
  choice: கொடுத்துக்கொண்டிருந்தார்
  rationale: நிறைவுறா இறந்தகாலத்தின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பகிர்ந்தளித்தலை வெளிப்படுத்துகிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: αὐτοῦ என்ற உடைமைச் சுட்டைத் தெளிவாகப் பேணுகிறது; ‘தம்’ என்பது எழுவாயான இயேசுவையே சுட்டுகிறது.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: மக்கள்முன் வைக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα அமைப்பையும், உணவை ஒருவர்முன் வைக்கும் παρατίθημι என்பதன் concrete imagery-யையும் பேணுகிறது; சூழலில் αὐτοῖς என்பது மக்களைக் குறிக்கிறது.
- source_word: ἐμέρισεν πᾶσιν
  choice: எல்லாருக்கும் பங்கிட்டார்
  rationale: மீன்களைப் பிரித்து அனைவருக்கும் அளித்த விநியோகச் செயலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: உணவுச் சூழலில் εὐλόγησεν என்பதன் மொழிபெயர்ப்பு
  choice: ஆசீர்வாதம் கூறினார்
  alternative: நன்றி செலுத்தினார்
  rationale: மூலத்தில் εὐλογέω உள்ளது; εὐχαριστέω இல்லை. உணவுச் சூழலில் நன்றி செலுத்துதல் என்ற பொருள் நெருக்கமாக இருக்கலாம் என்றாலும், ‘ஆசீர்வாதம் கூறினார்’ என்பது மூலச் சொல்லைத் தெளிவாகப் பிரதிபலித்து, ஆசீர்வாதம் யார்மீது அல்லது எதன்மீது கூறப்பட்டது என்பதை மொழிபெயர்ப்பு தன்னிச்சையாக முடிவுசெய்யாமல் விடுகிறது.
- issue: αὐτοῖς என்பதன் குறிப்பு
  choice: மக்கள்முன்
  alternative: அவர்கள்முன்
  rationale: இலக்கண வடிவம் சுட்டுப்பெயராக இருந்தாலும், கதைச்சூழலில் சீடர்கள் உணவை முன்வைக்க வேண்டியவர்கள் மக்கள். தமிழில் ‘அவர்கள்முன்’ என்பது சீடர்களையே குறிக்கிறதெனத் தவறாகப் புரிய வாய்ப்புள்ளதால், சூழலால் உறுதியாகும் குறிப்பைத் தெளிவாக்குகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அப்பங்கள்’, ‘ஆசீர்வாதம் கூறினார்’, ‘பங்கிட்டார்’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. தொடர்ச்சியான பகிர்ந்தளிப்பை ‘கொடுத்துக்கொண்டிருந்தார்’ வெளிப்படுத்துகிறது.
