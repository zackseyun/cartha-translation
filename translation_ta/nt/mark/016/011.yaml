id: MRK.16.11
reference: Mark 16:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: ta
  text: அவர் உயிரோடு இருக்கிறார்[a] என்றும், அவள் அவரைக் கண்டாள்[b] என்றும் அவர்கள் கேள்விப்பட்டபோது, அவர்கள் நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், ‘அவர் வாழ்கிறார்.’ கிரேக்கத்தில் நிகழ்கால வினை உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவர் அவளால் காணப்பட்டார்.’
    reason: voice_and_lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: அவர்கள்
  rationale: καί + ἐκεῖνοι முந்தைய வசனத்தில் குறிப்பிடப்பட்ட குழுவையே தொடர்ந்து சுட்டுகிறது. தமிழில் இயல்பான தொடர்ச்சிக்காக ‘அவர்கள்’ என மொழிபெயர்க்கப்பட்டது; தேவையற்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: ἀκούσαντες
  choice: கேள்விப்பட்டபோது
  rationale: இங்குள்ள இறந்தகாலப் பங்கேற்புவினை காலத் தொடர்பைக் காட்டுகிறது. ‘கேள்விப்பட்டபோது’ நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: என்றும் … என்றும்
  rationale: கேள்விப்பட்ட செய்தியின் இரு உள்ளடக்கங்களையும் தமிழில் தெளிவாக இணைக்க ‘என்றும் … என்றும்’ பயன்படுத்தப்பட்டது.
- source_word: ζῇ
  choice: உயிரோடு இருக்கிறார்
  rationale: நிகழ்கால வினை இயேசு உயிருடன் இருப்பதைத் தெரிவிக்கிறது. தமிழில் நிகழ்காலத்தைப் பாதுகாத்து, உயிர்த்தெழுதலுக்குப் பிந்தைய தொடரும் உயிர்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐθεάθη ὑπ’ αὐτῆς
  choice: அவள் அவரைக் கண்டாள்
  rationale: கிரேக்கத்தில் ‘அவர் அவளால் காணப்பட்டார்’ என்ற செயப்பாட்டு அமைப்பு உள்ளது. அந்தப் பொருளை மாற்றாமல், இயல்பான நவீன தமிழுக்காக செய்வினை அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: ἠπίστησαν
  choice: நம்பவில்லை
  rationale: அறிக்கையை அவர்கள் நம்பாததை நேரடியாகக் கூறுகிறது; ‘நம்ப மறுத்தார்கள்’ என்று நோக்கமுள்ள மறுப்பை அதிகமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவின் உயிர்நிலையை நிகழ்காலத்தில் கூறுதல்
  choice: உயிரோடு இருக்கிறார்
  alternative: உயிருடன் இருந்தார்
  rationale: ζῇ என்பது நிகழ்கால வினை. ஆகவே கடந்தகாலக் கேள்விப்படுதலுக்குள் இருந்தாலும், இயேசு உயிரோடு இருப்பதாகச் செய்தி கூறிய நிகழ்காலத் தன்மை பாதுகாக்கப்பட்டது.
- issue: மரியா இயேசுவைக் கண்டதைச் செயப்பாட்டு அல்லது செய்வினை வடிவில் கூறுதல்
  choice: அவள் அவரைக் கண்டாள்
  alternative: அவர் அவளால் காணப்பட்டார்
  rationale: செய்வினை வடிவம் தமிழில் இயல்பானது; கிரேக்கச் செயப்பாட்டு வடிவத்தின் பார்வை வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ‘அவர் அவளுக்குத் தோன்றினார்’ என்பது சாத்தியமான விளக்கமாக இருந்தாலும், கிரேக்க வடிவம் அதை கட்டாயப்படுத்தாததால் முதன்மை உரையில் எடுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் அமைந்த நடை. கிரேக்க நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது. இயல்பான தமிழுக்காக ἐθεάθη ὑπ’ αὐτῆς என்பதன் செயப்பாட்டு அமைப்பு செய்வினையாக மாற்றப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
