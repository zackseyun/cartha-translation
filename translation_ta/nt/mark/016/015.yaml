source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உலகம் முழுவதும் சென்று, முழுப் படைப்பிற்கும்[a] நற்செய்தியை[b] அறிவியுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படைக்கப்பட்ட ஒவ்வொன்றுக்கும்.” கிரேக்கச் சொற்றொடர் மொத்தப் படைப்பைக் குறிக்கலாம் அல்லது படைக்கப்பட்ட ஒவ்வொன்றையும் தனித்தனியாகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “சுவிசேஷத்தை.” கிரேக்கச் சொல்லின் நேரடிப் பொருள் “நற்செய்தி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: சென்று
  rationale: முதன்மைக் கட்டளையான κηρύξατε என்பதற்கு முன்வரும் இறந்தகாலப் பங்கேற்பு வடிவம் இங்கு அதனுடன் இணைந்த கட்டளைச் செயலாக உள்ளது. தமிழில் ‘சென்று ... அறிவியுங்கள்’ என்பது இயல்பாகவும் கட்டளையின் வலிமையைத் தக்கவைத்தும் அமைகிறது.
- source_word: κόσμον ἅπαντα
  choice: உலகம் முழுவதும்
  rationale: κόσμος இங்கு பணியின் பரப்பாகிய உலகைக் குறிக்கிறது; ἅπαντα அதன் முழுமையை வலியுறுத்துகிறது. ‘உலகம் முழுவதும்’ என்பது இயல்பான நவீனத் தமிழில் உலகளாவிய பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: κηρύξατε
  choice: அறிவியுங்கள்
  rationale: κηρύσσω அதிகாரப்பூர்வமாகவும் பொதுவெளியிலும் செய்தியை அறிவிப்பதைக் குறிக்கிறது. ‘அறிவியுங்கள்’ என்பது திருச்சபைச் சொல்வழக்குக்குள் மட்டும் சுருக்காமல், பொதுவாகப் பிரகடனம் செய்யும் பொருளை எளிய தமிழில் தருகிறது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தியை
  rationale: εὐαγγέλιον என்பதன் நேரடிப் பொருள் ‘நல்ல செய்தி’. ‘நற்செய்தி’ என்பது அதன் பொருளைத் தெளிவாகத் தருவதோடு, நவீனத் தமிழில் நிலைபெற்ற கிறிஸ்தவச் சொல்லாகவும் உள்ளது.
- source_word: πάσῃ τῇ κτίσει
  choice: படைப்பு அனைத்திற்கும்
  rationale: κτίσις என்பது ‘படைப்பு’ அல்லது ‘படைக்கப்பட்ட உயிர்/படைப்பு’ என்று பொருள்படலாம். ‘படைப்பு அனைத்திற்கும்’ என்பது கிரேக்கத்தின் விரிந்த, மொத்தமான பரப்பைத் தக்கவைத்து, அதை மனிதர்கள் மட்டுமே என்று மொழிபெயர்ப்பிலேயே குறுக்குவதைக் தவிர்க்கிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: இது இயல்பான தமிழ் கதைநடை அமைப்பு. கிரேக்கத்தின் எளிய உரையாடல் அறிமுகத்தை கூடுதல் விளக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: πάσῃ τῇ κτίσει என்ற சொற்றொடரில் பணியின் பரப்பு
  choice: படைப்பு அனைத்திற்கும்
  alternative: படைக்கப்பட்ட ஒவ்வொன்றுக்கும்
  rationale: இந்தக் கிரேக்கச் சொற்றொடரை மொத்தமாகவும் அண்டமளாவியதாகவும் அல்லது பகிர்ந்தளிக்கும் வகையில் ‘ஒவ்வொரு படைப்புக்கும்’ என்றும் புரிந்துகொள்ளலாம். முதன்மை மொழிபெயர்ப்பு அதன் விரிந்த பரப்பைப் பாதுகாக்கிறது; அடிக்குறிப்பு மாற்று சாத்தியத்தை வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சென்று ... அறிவியுங்கள்’ இயல்பான தமிழ் தொடராகவும், ‘படைப்பு அனைத்திற்கும்’ மூலத்தின் திட்டமிட்ட விரிவையும் தெளிவின்மையையும் தக்கவைக்கும் வகையிலும் அமைந்துள்ளது.
