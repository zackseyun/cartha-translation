  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: ta
  text: ஆகவே, ஆண்டவராகிய இயேசு[a] அவர்களிடம் பேசிய பின்பு, வானத்திற்கு எடுத்துக்கொள்ளப்பட்டார்; கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘இயேசு’ என்ற பெயர் இல்லை; அவற்றில் ‘ஆண்டவர்’ என்று மட்டும் உள்ளது.
    reason: SBLGNT உரையில் Ἰησοῦς அருகிலுள்ள உரைவேறுபாட்டு குறியை வெளிப்படுத்துகிறது.
  - marker: b
    text: 9–20ஆம் வசனங்கள் சில மிகப் பழமையான முக்கியக் கையெழுத்துப் பிரதிகளில் இல்லை. வேறு பல பழமையான பிரதிகளிலும் ஆரம்பகால மொழிபெயர்ப்புகளிலும் இவை காணப்படுகின்றன; சில பிரதிகளில் மாறுபட்ட முடிவுகள் உள்ளன.
    reason: மாற்கு நற்செய்தியின் நீண்ட முடிவைப் பற்றிய குறிப்பிடத்தக்க மூலஉரைச் சான்றை வாசகரிடம் மறைக்காமல் சுருக்கமாகத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: μὲν οὖν
  choice: ஆகவே
  rationale: இந்தத் துகள்களின் இணைப்பு முந்தைய நிகழ்விலிருந்து முடிவுரைக்கும் தொடர்ச்சிக்கு மாறுவதைச் சுட்டுகிறது. ‘ஆகவே’ அதன் தொடர்பையும் முடிவுறுத்தும் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: κύριος Ἰησοῦς
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος என்பதன் கிறிஸ்துவியல் பட்டப்பெயர் ‘ஆண்டவர்’ என்று காக்கப்படுகிறது; ‘ஆகிய’ என்பது பட்டப்பெயரையும் இயற்பெயரையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: அவர்களிடம் பேசிய பின்பு
  rationale: μετά + பெயர்ச்சொல் தன்மையுடைய வினையெச்சம் கால வரிசையில் ‘பின்பு’ என்பதைக் குறிக்கிறது. αὐτοῖς இங்கு பேச்சின் பெறுநர்களைக் காட்டுவதால் ‘அவர்களிடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀνελήμφθη
  choice: எடுத்துக்கொள்ளப்பட்டு
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவம் காக்கப்படுகிறது. அடுத்துள்ள இலக்கு தொடருடன் சேர்ந்து, இயேசு மேலே எடுத்துக்கொள்ளப்பட்ட நிகழ்வை இது தெரிவிக்கிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்துக்கு
  rationale: εἰς + வேற்றுமை வடிவம் இயக்கத்தின் இலக்கைக் குறிக்கிறது. இச்சூழலில் οὐρανός கடவுளுடைய வாசஸ்தலமான வானத்தைக் குறிக்கிறது; ‘வானத்துக்கு’ எளிமையான, நேரடியான தமிழ்.
- source_word: ἐκάθισεν
  choice: அமர்ந்தார்
  rationale: இருக்கும் நிலையில் அமர்ந்த செயலை இயல்பாகக் குறிக்கிறது. தமிழில் ‘உட்கார்ந்தார்’ என்பதைக் காட்டிலும் இங்கு ‘அமர்ந்தார்’ கண்ணியமானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: கடவுளின் வலப்பக்கத்தில்
  rationale: ἐκ δεξιῶν என்பது சொற்படியாக ‘வலப்பக்கத்திலிருந்து’ அல்ல; உயர்வும் அதிகாரமும் குறிக்கும் நிலையான இடவழக்கு. ஆகவே தமிழிலும் இடத்தைக் குறிக்கும் இயல்பான வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: விண்ணேற்றத்தையும் உயர்த்தப்பட்ட நிலையையும் கோட்பாட்டு மிகைப்பின்றி மொழிபெயர்த்தல்
  choice: வானத்துக்கு எடுத்துக்கொள்ளப்பட்டு, கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்
  alternative: விண்ணேற்றப்பட்டு, கடவுளின் வலதுபாரிசத்தில் வீற்றிருந்தார்
  rationale: தேர்ந்த வடிவம் கிரேக்கத்தின் செயப்பாட்டு வினையையும் இலக்கையும் தனித்தனியாகக் காக்கிறது; ‘வீற்றிருந்தார்’ போன்ற கூடுதல் அரசாட்சிச் சாயலை வினைக்குள் சேர்க்காமல், உயர்த்தப்பட்ட நிலையை வேதாகம இடவழக்கின் மூலமே வெளிப்படுத்துகிறது.
- issue: κύριος என்பதை கிறிஸ்துவியல் பட்டப்பெயராக வழங்குதல்
  choice: ஆண்டவராகிய இயேசு
  alternative: எஜமானாகிய இயேசு
  rationale: ‘ஆண்டவர்’ என்பது இச்சூழலில் κύριος என்பதன் கிறிஸ்துவியல் கனத்தையும் புதிய ஏற்பாட்டுப் பயன்பாட்டையும் காக்கிறது; ‘எஜமான்’ வெறும் சமூக உறவை மட்டுமே முன்னிறுத்தக்கூடும்.
- issue: மாற்கு 16:9–20 பகுதியின் உரைவரலாற்றை வெளிப்படையாகக் குறிப்பிடுதல்
  choice: வசன முடிவில் உரைவேறுபாட்டு அடிக்குறிப்பு
  alternative: அடிக்குறிப்பின்றி பிரதான உரையை மட்டும் அச்சிடுதல்
  rationale: இப்பகுதி சில மிகப் பழமையான முக்கியக் கையெழுத்துப் பிரதிகளில் இல்லாதது குறிப்பிடத்தக்க மூலஉரைச் சான்றாகும். பிரதான உரையை நீக்காமலும் அதன் பழமையான பரவலை மறுக்காமலும் வாசகருக்குத் தகவல் அளிக்கப்படுகிறது.
