  register: நடை நவீன பொதுத்தமிழாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது. ‘ஆண்டவர்’, ‘கடவுள்’, ‘அமர்ந்தார்’ ஆகியவை பரவலாகப் புரியும் சொற்கள். கடினமான ‘வலதுபாரிசம்’ தவிர்க்கப்பட்டு ‘வலப்பக்கம்’ பயன்படுத்தப்பட்டுள்ளது; செயப்பாட்டு அமைப்பும் நிகழ்வுகளின் வரிசையும் மூலத்துக்கு நெருக்கமாகக் காக்கப்பட்டுள்ளன.
