id: MRK.16.6
reference: Mark 16:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: ta
  text: 'ஆனால் அவர் அவர்களிடம் கூறுகிறார்: “பதறாதீர்கள். சிலுவையில் அறையப்பட்ட நாசரேயனாகிய[a] இயேசுவைத் தேடுகிறீர்கள். அவர் உயிர்த்தெழுப்பப்பட்டார்[b]; அவர் இங்கே இல்லை. பாருங்கள்—அவர்கள் அவரை வைத்த இடம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாசரேத்தைச் சேர்ந்த.” கிரேக்கத்தில் நாசரேத் என்ற ஊர்ப்பெயரிலிருந்து உருவான ஓர் அடையாளப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, “அவர் உயிர்த்தெழுந்தார்.” கிரேக்க வினை செயப்பாட்டு வடிவில் உள்ளது: “அவர் உயிர்த்தெழுப்பப்பட்டார்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: பதறாதீர்கள்
  rationale: இச்சொல் வெறும் வியப்பை அல்ல, கடுமையான மனக்கலக்கத்தையும் அச்சத்தையும் குறிக்கிறது; ‘பதறாதீர்கள்’ என்பது இயல்பான நவீனத் தமிழில் அந்த வலிமையைத் தருகிறது.
- source_word: Ναζαρηνὸν
  choice: நாசரேயனாகிய
  rationale: நாசரேத்திலிருந்து உருவான கிரேக்க அடைமொழியை வெறும் ஊர்ச் சுட்டாக மாற்றாமல், இயேசுவுக்கான அடையாளப் பெயராகப் பாதுகாக்கிறது.
- source_word: ἐσταυρωμένον
  choice: சிலுவையில் அறையப்பட்ட
  rationale: நிறைவுபெற்ற சிலுவை மரண நிகழ்வையும் அதன் தொடரும் முக்கியத்துவத்தையும் இயல்பான தமிழ் உறவெச்ச வடிவில் வெளிப்படுத்துகிறது.
- source_word: ἠγέρθη
  choice: அவர் உயிர்த்தெழுப்பப்பட்டார்
  rationale: கிரேக்க வினையின் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, செயலைச் செய்தவர் யார் என்று உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல் விடுகிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொல்லுக்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: குறிப்பிட்ட இடத்தின்மேல் கவனத்தைத் திருப்பும் கட்டளையின் வலிமையைத் தெளிவாகவும் நவீனமாகவும் தருகிறது.
- source_word: τόπος
  choice: இடம்
  rationale: கல்லறையில் இயேசுவை வைத்த குறிப்பிட்ட இடத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἔθηκαν
  choice: அவர்கள் அவரை வைத்த
  rationale: இயேசுவை அடக்கத்திற்காக அங்கே வைத்தவர்களைக் குறிக்கும் பன்மைச் செயலை எளிமையாகப் பாதுகாக்கிறது.
- source_word: ζητεῖτε
  choice: தேடுகிறீர்கள்
  rationale: நிகழ்ந்துகொண்டிருக்கும் தேடலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγει αὐταῖς
  choice: அவர் அவர்களிடம் கூறுகிறார்
  rationale: மாற்குவின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தை நிகழ்கால வினையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் செயப்பாட்டு வடிவம்
  choice: அவர் உயிர்த்தெழுப்பப்பட்டார்
  alternative: அவர் உயிர்த்தெழுந்தார்
  rationale: ἠγέρθη என்பது இலக்கணப்படி செயப்பாட்டு வடிவம். அதைப் பாதுகாப்பது உயிர்த்தெழுதல் அறிவிப்பைத் தெளிவாகச் சொல்லுவதோடு, மறைமுகமாகக் குறிக்கப்படும் தெய்வச் செயலை விளக்கமாகச் சேர்க்காமல் அதன் உரைநயத் திணறலை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மாற்குவின் வரலாற்று நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது; ‘பாருங்கள்—’ என்ற அமைப்பு மூலத்தின் திடீர் கவன ஈர்ப்பையும் அடுத்துவரும் பெயர்ச்சொல் துணுக்கையும் தக்கவைக்கிறது.
