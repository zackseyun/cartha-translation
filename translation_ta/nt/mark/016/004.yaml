  source_fidelity: மூலத்தின் வினையெச்சத் தொடர்பு (ἀναβλέψασαι), கதைநடை நிகழ்காலத்தின் தமிழாக்கம் (θεωροῦσιν), மற்றும் நிறைவுக்காலச் செயலின் தொடரும் நிலை (ἀποκεκύλισται) ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. γάρ-ன் விளக்கத் தொடர்பும் μέγας σφόδρα-ன் வலியுறுத்தலும் முறையாகத் தரப்பட்டுள்ளன.
  naturalness: “அவர்கள் நிமிர்ந்து பார்த்தபோது” மற்றும் “கல் உருட்டித் தள்ளப்பட்டிருந்ததைக் கண்டார்கள்” என்பவை நவீன நிலையான தமிழில் இயல்பான, தெளிவான கதைநடை. நிறுத்தற்குறிகளும் வாசக ஓட்டமும் பொருத்தமானவை.
  terminology: “கல்,” “உருட்டித் தள்ளப்பட்டிருந்தது,” “மிகப் பெரியதாக” ஆகிய சொல் தேர்வுகள் சூழலுக்கும் மூலத்திற்கும் ஏற்றவை. தேவையற்ற விளக்கச் சேர்க்கையோ கோட்பாட்டு நிறமோ இல்லை.
