source:
  edition: SBLGNT
  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: ta
  text: அவர்கள் நிமிர்ந்து பார்த்தபோது, கல் உருட்டித் தள்ளப்பட்டிருந்ததைக் கண்டார்கள்[a]; ஏனெனில் அந்தக் கல் மிகப் பெரியதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கல் உருட்டித் தள்ளப்பட்ட நிலையில் இருப்பதை அவர்கள் கவனித்தார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுக்கால வினை, அவர்கள் பார்த்தபோது கல் ஏற்கெனவே உருட்டித் தள்ளப்பட்ட நிலையில் இருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: நிமிர்ந்து பார்த்தபோது
  rationale: பெண்கள் தங்கள் பார்வையை உயர்த்திக் கல்லறையை நோக்கியதைக் குறிக்கும் இறந்தகால வினையெச்சத்தை, இயல்பான நவீனத் தமிழில் காலத் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: θεωροῦσιν
  choice: கண்டார்கள்
  rationale: கதையாடல் சூழலில் பார்வையால் உணர்ந்ததை இயல்பாகத் தெரிவிக்கிறது; கிரேக்க வரலாற்று நிகழ்காலம் தமிழில் இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀποκεκύλισται
  choice: உருட்டித் தள்ளப்பட்டிருந்தது
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் நிலையும் அடங்கிய கிரேக்க நிறைவுக்காலச் செயல்பாட்டு வடிவத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: ὁ λίθος
  choice: கல்
  rationale: கல்லறையை மூடிய கல்லைச் சூழல் தெளிவுபடுத்துவதால், மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: ஏனெனில் அந்தக் கல் மிகப் பெரியதாக இருந்தது
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் σφόδρα என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினையெச்சத் தொடர்பு, நிறைவுக்காலத்தின் விளைவு நிலை, γάρ என்பதன் விளக்கத் தன்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
