  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: ta
  text: வாரத்தின் முதல் நாளில்[a], அதிகாலையிலேயே, சூரியன் உதித்திருந்தபோது[c], அவர்கள் கல்லறைக்கு வருகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘ஓய்வுநாட்களில் ஒன்றில்’; இது ‘வாரத்தின் முதல் நாளில்’ என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: மாற்கு இங்கே ‘வருகிறார்கள்’ என்ற வரலாற்று நிகழ்காலத்தைப் பயன்படுத்துகிறார்; தமிழில் இதை ‘வந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
