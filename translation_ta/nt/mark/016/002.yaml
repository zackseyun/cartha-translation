- source_word: ἐπὶ τὸ μνημεῖον
  choice: கல்லறைக்கு
  rationale: இந்த அடக்கச் சூழலில் μνημεῖον என்பது அடக்கம் செய்யப்பட்ட கல்லறையைக் குறிக்கிறது; ἐπί உடன் வரும் வேற்றுமை உருபு அதை நோக்கிய இயக்கத்தைத் தெரிவிக்கிறது.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: சூரியன் உதித்திருந்தபோது
  rationale: இந்த genitive absolute அவர்கள் வந்த நேரத்தின் சூழ்நிலையைத் தெரிவிக்கிறது. ‘உதித்திருந்தபோது’ நிறைவுற்ற செயலைக் காட்டுகிறது; கிரேக்கத்தில் இல்லாத வலுவான ‘பிறகு’ என்ற வரிசை நுணுக்கத்தைச் சேர்க்காது.
