base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: ta
  text: அவர்கள் பாம்புகளைத் தூக்கி எடுப்பார்கள்; மரணத்தை விளைவிக்கக்கூடிய எதையாவது குடித்தாலும், அது அவர்களுக்கு நிச்சயமாகத் தீங்கு செய்யாது. நோயாளிகள் மேல் கைகளை வைப்பார்கள்; அந்த நோயாளிகள் நலமடைவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழமையான கையெழுத்துப் பிரதிகளில் மாற்கு 16:9–20 இல்லை; இந்த வசனம் மாற்கு நூலின் நீண்ட முடிவில் இடம்பெறுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ὄφεις
  choice: பாம்புகள்
  rationale: நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள பொதுப்பெயர்; ‘சர்ப்பங்கள்’ என்பதைக் காட்டிலும் நடப்பு வழக்குக்கு ஏற்றது.
- source_word: ἀροῦσιν
  choice: தூக்கி எடுப்பார்கள்
  rationale: αἴρω என்பதன் ‘எடுத்தல்/தூக்குதல்’ என்ற உடல்சார் செயலை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; எவ்வாறு அல்லது ஏன் எடுப்பார்கள் என்பதைச் சேர்க்கவில்லை.
- source_word: κἂν
  choice: குடித்தாலும்
  rationale: καὶ ἐάν என்பதன் நிபந்தனைக்கும் concessive நுணுக்கத்திற்கும் தமிழின் ‘-ஆலும்’ வடிவம் இயல்பாகப் பொருந்துகிறது.
- source_word: θανάσιμόν τι
  choice: சாவை உண்டாக்கக்கூடிய எதையாவது
  rationale: ‘நஞ்சு’ என்று மட்டும் குறுக்காமல், மரணத்தை விளைவிக்கக்கூடிய எதையும் குறிக்கும் கிரேக்கத் தொடரின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: οὐ μὴ ... βλάψῃ
  choice: நிச்சயமாகத் தீங்கு செய்யாது
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக ... செய்யாது’ என வெளிப்படுத்தி, βλάπτω என்பதன் பரந்த தீங்கு என்ற பொருளையும் காக்கிறது.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: நோயாளிகள்மேல் கைகளை வைப்பார்கள்
  rationale: கிரேக்கச் சொல்லமைப்பைத் தெளிவாகவும் தமிழில் நிலைபெற்ற வேதாகமச் சொற்றொடராகவும் தருகிறது.
- source_word: καλῶς ἕξουσιν
  choice: அவர்கள் நலமடைவார்கள்
  rationale: சொல்லர்த்தமாக ‘நலமாக இருப்பார்கள்’; நோயுற்றவர்களைப் பற்றிய சூழலில் ‘நலமடைவார்கள்’ என்பது விளைவைக் கூறும் இயல்பான தமிழ்.
theological_decisions:
- issue: வாக்குறுதியளிக்கப்பட்ட பாதுகாப்பும் குணமடைதலும் எத்தகையவை?
  choice: விசுவாசிகளோடு தொடரும் அடையாளங்களாக வசனம் கூறும் செயல்களையும் விளைவுகளையும் நேரடியாக மொழிபெயர்த்தல்
  alternative: இவை எல்லாக் காலங்களிலும் எல்லா விசுவாசிகளுக்கும் கட்டாயமாக நிகழும் எனவோ, அப்போஸ்தலர் காலத்திற்கே உரியவை எனவோ, முற்றிலும் குறியீடானவை எனவோ விளக்குதல்
  rationale: கிரேக்கம் எதிர்காலச் செயல்களையும் அவற்றின் விளைவுகளையும் நேரடியாகக் கூறுகிறது. காலவரம்பு அல்லது எல்லாருக்கும் பொருந்தும் விதம் குறித்து மொழிபெயர்ப்பு கூடுதல் கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: மாற்கு 16:9–20 பகுதியின் மூலப்பிரதி நிலை
  choice: கொடுக்கப்பட்ட SBLGNT வசனத்தை மொழிபெயர்த்து, நீண்ட முடிவின் உரைவேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: வசனத்தை விடுதல் அல்லது முதன்மை உரையில் அடைப்புக்குறிக்குள் இடுதல்
  rationale: வழங்கப்பட்ட கிரேக்க உரையை மொழிபெயர்ப்பது பணியின் நோக்கம்; அதேவேளை, சில பழமையான கையெழுத்துப் பிரதிகளில் இப்பகுதி இல்லாத முக்கியமான உரைச்சான்றை வாசகரிடமிருந்து மறைக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘சர்ப்பங்கள்’ போன்ற பழமையான சொல்லைத் தவிர்த்து ‘பாம்புகள்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறியீடு வசனத்தின் முடிவில் வைக்கப்பட்டுள்ளது; அது முழு வசனமும் சேர்ந்துள்ள நீண்ட முடிவின் உரைநிலையைச் சுட்டுகிறது.
