source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: ta
  text: பின்பு[a], பதினொருவரும் உணவு உண்ணச் சாய்ந்திருந்தபோது[b], இயேசு அவர்களுக்குத் தோன்றினார். உயிர்த்தெழுப்பப்பட்டிருந்த அவரைக் கண்டவர்களை அவர்கள் நம்பாததால், அவர்களுடைய நம்பாமையையும் இதயக் கடினத்தையும் அவர் கண்டித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்குப் பிறகு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் சாய்ந்திருந்தபோது.” உணவு உண்ணும்போது சாய்ந்திருப்பது அக்கால வழக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: Ὕστερον
  choice: பின்பு
  rationale: அடுத்ததாக நிகழ்ந்த தோற்றத்தைச் சுட்டும் கால வினையடை; இயல்பான நவீனத் தமிழில் நிகழ்வுகளின் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνακειμένοις
  choice: உணவு உண்ணச் சாய்ந்திருந்தபோது
  rationale: அக்காலத்தில் உணவருந்தும்போது மேசையருகே சாய்ந்திருக்கும் வழக்கமான உடல் நிலையை நவீன வாசகர்களுக்குத் தெளிவாக்குகிறது.
- source_word: τοῖς ἕνδεκα
  choice: பதினொருவரும்
  rationale: யூதாஸ் இல்லாத நிலையில் மீதமிருந்த சீடர் குழுவைக் குறிக்கிறது; αὐτοῖς உடன் சேர்ந்துள்ள குறிப்பிட்ட குழுவின் வலியுறுத்தலைத் தமிழின் சூழல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐφανερώθη
  choice: தோன்றினார்
  rationale: உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சிகளில் இயல்பானதும் துல்லியமானதுமான தமிழ் சொல்.
- source_word: ὠνείδισεν
  choice: கண்டித்தார்
  rationale: கடுமையான குற்றஞ்சாட்டுதலைத் தெளிவாகச் சொல்கிறது; பழமையான அல்லது மிகைநடையைக் தவிர்க்கிறது.
- source_word: ἀπιστίαν
  choice: நம்பிக்கையின்மை
  rationale: கொடுக்கப்பட்ட சாட்சியை நம்பத் தவறிய அல்லது மறுத்த நிலையைக் குறிக்கும் பெயர்ச்சொல் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: σκληροκαρδίαν
  choice: இருதயக் கடினம்
  rationale: எதிர்த்து நிற்கும் உள்ளார்ந்த மனநிலையைக் குறிக்கும் வேதாகம உருவகத்தையும் அதன் இறையியல் ஒலியையும் பாதுகாக்கிறது.
- source_word: θεασαμένοις
  choice: கண்டவர்களை
  rationale: உயிருடன் எழுப்பப்பட்ட இயேசுவைக் கண்கூடாகக் கண்ட சாட்சிகளைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: ἐγηγερμένον
  choice: உயிருடன் எழுப்பப்பட்டிருந்த
  rationale: ἐγείρω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சத்தைப் பாதுகாக்கிறது; செயலை நேரடியாகச் செய்பவர் யார் என்று உரை கூறாத நிலையையும் மாற்றாமல் வைக்கிறது.
- source_word: οὐκ ἐπίστευσαν
  choice: அவர்கள் நம்பாததால்
  rationale: இயேசு தோன்றுவதற்கு முன்பு அவர்கள் சாட்சிகளின் செய்தியை ஏற்காததே கண்டிப்புக்கான காரணம் என்பதை ὅτι உடன் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ἐγηγερμένον என்பதிலுள்ள உயிர்த்தெழுதல் மொழி
  choice: உயிருடன் எழுப்பப்பட்டிருந்த
  alternative: உயிருடன் எழுந்திருந்த
  rationale: கிரேக்கச் சொல்லின் நிறைவுற்ற செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, செயலைச் செய்தவர் யார் என்பதை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- issue: σκληροκαρδία என்பதன் உருவக வலிமை
  choice: இருதயக் கடினம்
  alternative: பிடிவாதம்
  rationale: ஆவிக்குரிய எதிர்ப்பைக் குறிக்கும் மூல உருவகத்தையும் அதன் வேதாகமத் தொடர்புகளையும் பாதுகாக்கிறது; விளக்கமாக மட்டும் இருக்கும் மாற்றுச் சொல்லால் அதன் வலிமையைத் தட்டையாக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. உணவருந்தும் பண்டைய உடல் நிலை முதன்மை உரையில் சுருக்கமாகத் தெளிவாக்கப்பட்டு, பண்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. உயிர்த்தெழுதல் குறித்த செயப்பாட்டு வடிவமும் ‘இருதயக் கடினம்’ என்ற வேதாகம உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
