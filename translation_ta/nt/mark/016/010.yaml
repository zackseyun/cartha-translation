  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: ta
  text: அவள் போய், அவரோடு இருந்தவர்களிடம் இதை அறிவித்தாள்; அவர்கள் துக்கங்கொண்டு அழுதுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: அவள்
  rationale: இந்தச் சுட்டுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மகதலேனா மரியாளைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக ‘அவள்’ என்று வழங்கப்படுகிறது.
- source_word: πορευθεῖσα
  choice: போய்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவம். ‘போய் … அறிவித்தாள்’ என்பது நிகழ்வுகளின் வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: ἀπήγγειλεν
  choice: இதை அறிவித்தாள்
  rationale: வினைச்சொல் ஒரு செய்தியைத் தெரிவிப்பதைக் குறிக்கிறது. கிரேக்கத்தில் நேரடி செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் கூறப்பட்ட உயிர்த்தெழுந்த இயேசுவின் தோற்றத்தைக் குறிக்கச் சூழலிலிருந்து ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: அவரோடு இருந்தவர்களிடம்
  rationale: இயேசுவுடன் இருந்தவர்களாகிய குழுவை இச்சொற்றொடர் அடையாளப்படுத்துகிறது. ‘அவரோடு இருந்தவர்கள்’ என்பது பொருளைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: அவர்கள் துக்கப்பட்டு அழுதுகொண்டிருந்தார்கள்
  rationale: இரு நிகழ்காலப் பங்கேற்புகளும் அந்த மனிதர்களின் அப்போதைய நிலையை விவரிக்கின்றன. ‘துக்கப்பட்டு’ இழப்பினால் ஏற்பட்ட ஆழ்ந்த வருத்தத்தையும், ‘அழுதுகொண்டிருந்தார்கள்’ தொடர்ந்த அழுகையையும் வெளிப்படுத்துகின்றன.
