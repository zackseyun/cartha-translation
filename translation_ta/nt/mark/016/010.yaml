  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் செயல்வரிசையும் துக்கம்–அழுகை என்ற இணைந்த உணர்வுச் சித்திரமும் பாதுகாக்கப்பட்டுள்ளன.
