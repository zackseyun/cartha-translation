source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: ta
  text: அவர்களோ புறப்பட்டுச் சென்று எங்கும் அறிவித்தார்கள். ஆண்டவர் அவர்களுடன் சேர்ந்து செயல்பட்டு, கூடவே நிகழ்ந்த அடையாளங்களின் மூலம் செய்தியை[a] உறுதிப்படுத்தினார்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வார்த்தையை.” இங்குள்ள கிரேக்கச் சொல் λόγος, அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கூடவே நிகழ்ந்த அடையாளங்கள்” என்பதை “பின்தொடர்ந்த அடையாளங்கள்” என்றும் மொழிபெயர்க்கலாம். அவை செய்தியையா அறிவித்தவர்களையா பின்தொடர்ந்தன என்பதை கிரேக்கத் தொடர் வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: c
    text: மாற்கு 16:9–20 மிகப் பழமையான சில கிரேக்கக் கையெழுத்துப் பிரதிகளில் இல்லை; வேறு சில பிரதிகளில் மாற்கு நற்செய்திக்கு மாறுபட்ட முடிவுகள் காணப்படுகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: அவர்களோ
  rationale: ἐκεῖνοι முன்பு குறிப்பிடப்பட்ட சீடர்களைக் குறிக்கிறது; δέ இங்கு வலுவான முரண்பாட்டைவிட கதையின் தொடர்ச்சியையும் ஓரளவு தலைப்புமாற்றத்தையும் காட்டுகிறது.
- source_word: ἐξελθόντες
  choice: புறப்பட்டுச் சென்று
  rationale: முதன்மை வினையுடன் இணைந்த முன்னிகழ்வை இயல்பான தமிழ் நடையில் தெரிவிக்கிறது.
- source_word: ἐκήρυξαν
  choice: அறிவித்தார்கள்
  rationale: κηρύσσω என்பதன் பொதுவெளியில் பிரகடனப்படுத்தும் பொருளை, குறுகிய சமயத் தொழில்சொல்லாக இல்லாமல் எளிய நவீன தமிழில் தருகிறது.
- source_word: πανταχοῦ
  choice: எங்கும்
  rationale: இடமெங்கும் என்ற வினையடைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான மரியாதைத் தலைப்பு; உடனடி சூழலில் உயிர்த்தெழுந்த இயேசுவைக் குறிக்கிறது.
- source_word: συνεργοῦντος
  choice: அவர்களுடன் சேர்ந்து செயல்பட்டு
  rationale: συν- கூறு உணர்த்தும் இணைந்த செயலைத் தெளிவாகப் பாதுகாக்கிறது; சீடர்களின் செயலுக்கு ஆண்டவர் துணைநின்றார் என்ற தொடரமைப்பையும் காட்டுகிறது.
- source_word: τὸν λόγον
  choice: செய்தியை
  rationale: இங்கு λόγος தனிப்பட்ட ஒரு சொல்லை அல்ல, அறிவிக்கப்பட்ட செய்தியைச் சுட்டுகிறது; ‘வார்த்தையை’ என்பது சாத்தியமான நேரடி மாற்றாக அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: βεβαιοῦντος
  choice: உறுதிப்படுத்தினார்
  rationale: அறிவிக்கப்பட்ட செய்தி உண்மையானது என்பதை அடையாளங்கள் மூலம் மெய்ப்பிக்கும் பொருளைத் தருகிறது.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: கூடவே நிகழ்ந்த அடையாளங்களின் மூலம்
  rationale: διά என்பதன் கருவிப் பொருளையும், ἐπακολουθούντων என்பதிலுள்ள ‘பின்தொடர்தல்/உடன்நிகழ்தல்’ என்ற பொருள் வரம்பையும் இயல்பான தமிழில் தருகிறது; அடையாளங்கள் செய்தியையா அறிவித்தவர்களையா தொடர்ந்தன என்பதை முதன்மை உரை தேவையின்றித் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவர் யார்?
  choice: முந்தைய வசனத்தின் உடனடி சூழலின்படி உயிர்த்தெழுந்த இயேசுவைக் குறிக்கும் தலைப்பாக ‘ஆண்டவர்’ என்பதையே வைத்தல்.
  alternative: பொதுவாக தேவனைக் குறித்தல்.
  rationale: மாற்கு 16:19-ல் ‘ஆண்டவர்’ இயேசுவைக் குறிக்கிறது. பெயரை உரைக்குள் சேர்க்காமல் மூலத்தின் தலைப்பையும் சூழல் தொடர்பையும் பாதுகாக்கிறது.
- issue: அடையாளங்களின் பங்கு
  choice: அவை அறிவிக்கப்பட்ட செய்தியை உறுதிப்படுத்த ஆண்டவர் பயன்படுத்திய வழியாகக் காட்டுதல்.
  alternative: உறுதிப்படுத்தும் செயலுடன் நேரடித் தொடர்பின்றி, அவை அறிவிப்பாளர்களுக்குப் பின் நிகழ்ந்தன என்று மட்டும் வாசித்தல்.
  rationale: βεβαιοῦντος ... διὰ என்ற தொடரமைப்பு, செய்தியை உறுதிப்படுத்துவதற்கான கருவியாக அடையாளங்களை இணைக்கிறது. அவை பிற்காலத்தில் தொடர வேண்டுமா என்பதுபோன்ற கேள்விகளை வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையும் கண்ணியமும் கொண்ட உரைநடை. ‘பிரசங்கித்தார்கள்’ என்பதற்குப் பதில் பரந்த பொதுஅறிவிப்பைக் குறிக்கும் ‘அறிவித்தார்கள்’ பயன்படுத்தப்பட்டது. கிரேக்கத்தின் நீண்ட வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக வழங்கப்பட்டது.
