source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: ta
  text: அவர்கள் வெளியே வந்து கல்லறையை விட்டு ஓடிப்போனார்கள்[a]. ஏனெனில், நடுக்கமும் திகைப்பும் அவர்களைப் பிடித்திருந்தன. அவர்கள் பயந்திருந்ததால் யாரிடமும் எதுவும் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில கையெழுத்துப் பிரதிகள் ‘குறுகிய முடிவு’ என்று அழைக்கப்படும் பின்வரும் பகுதியைச் சேர்க்கின்றன: “தங்களுக்குக் கட்டளையிடப்பட்ட அனைத்தையும் பேதுருவைச் சுற்றியிருந்தவர்களிடம் அவர்கள் சுருக்கமாக அறிவித்தார்கள். இவற்றுக்குப் பிறகு, இயேசுவே அவர்கள் மூலமாகக் கிழக்கிலிருந்து மேற்குவரை நித்திய மீட்பின் புனிதமும் அழிவற்றதுமான அறிவிப்பை அனுப்பினார். ஆமென்.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: அவர்கள் வெளியே வந்து
  rationale: பெண்பால் பன்மை இறந்தகாலப் பெயரெச்சத்தை இயல்பான தமிழில் காலத் தொடர்ச்சியைக் காட்டும் வினையெச்சமாக மொழிபெயர்க்கிறது.
- source_word: ἔφυγον
  choice: ஓடிப்போனார்கள்
  rationale: φεύγω என்பதன் விரைந்து அகன்றுசெல்லும் வலிமையைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்.
- source_word: μνημείου
  choice: கல்லறை
  rationale: உயிர்த்தெழுதல் நிகழ்வின் சூழலில் μνημεῖον என்பதற்குரிய துல்லியமான, வழக்கமான தமிழ் சொல்.
- source_word: εἶχεν αὐτὰς
  choice: அவர்களைப் பிடித்திருந்தன
  rationale: நடுக்கமும் திகைப்பும் அவர்களை ஆட்கொண்டிருந்தன என்ற கிரேக்க மரபுத்தொடரின் தீவிரத்தையும், தொடர்ந்த நிலையையும் பாதுகாக்கிறது.
- source_word: τρόμος
  choice: நடுக்கம்
  rationale: உடல் நடுங்குதலை நேரடியாகக் குறிக்கிறது; பின்னர் வரும் பயத்துடன் தேவையற்ற பொருள் மீளலைத் தவிர்க்கிறது.
- source_word: ἔκστασις
  choice: திகைப்பு
  rationale: இச்சூழலில் அதிர்ச்சியால் நிலைகுலைந்து வியக்கும் நிலையைக் குறிக்கிறது; நவீன தமிழில் தவறாகப் புரியக்கூடிய பரவசம் என்ற சொல்லைத் தவிர்க்கிறது.
- source_word: οὐδενὶ οὐδὲν
  choice: யாரிடமும் எதுவும் சொல்லவில்லை
  rationale: கிரேக்கத்தின் வலியுறுத்தப்பட்ட முழுமையான மறுப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐφοβοῦντο
  choice: அவர்கள் பயந்திருந்ததால்
  rationale: முற்றுப்பெறாத இறந்தகாலம் காட்டும் தொடர்ந்த பயநிலையையும், இறுதி γάρ காட்டும் காரணத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மாற்கு 16:8-க்குப் பின்வரும் குறுகிய முடிவின் உரைநிலை
  choice: இரட்டை அடைப்புக்குறிக்குள் உள்ள குறுகிய முடிவை முதன்மை வசன உரையில் சேர்க்காமல், உரை வேறுபாடாக அடிக்குறிப்பில் வழங்குதல்
  alternative: குறுகிய முடிவை முதன்மை உரையில் சேர்த்தல் அல்லது இரு முடிவுகளையும் முதன்மை உரையில் அச்சிடுதல்
  rationale: SBLGNT இந்தப் பகுதியை இரட்டை அடைப்புக்குறிக்குள் காட்டுகிறது; இது நிறுவப்பட்ட முதன்மை உரையின் பகுதியாகக் கருதப்படவில்லை. அதேவேளை கையெழுத்துப் பிரதிகளின் சான்றை வெளிப்படையாகப் பாதுகாக்க அடிக்குறிப்பில் முழுமையாக வழங்கப்படுகிறது.
- issue: வசனத்தின் இறுதி γάρ
  choice: தமிழில் காரண வாக்கிய அமைப்பாக ‘பயந்திருந்ததால்’ என்று வழங்குதல்
  alternative: ‘ஏனெனில் அவர்கள் பயந்திருந்தார்கள்’ என்று தனி இறுதி வாக்கியமாக வழங்குதல்
  rationale: கிரேக்கத்தின் காரணத் தொடர்பையும் திடீர் முடிவையும் பொருளில் பாதுகாக்கிறது; ஆனால் தமிழில் இயல்பற்ற இறுதி இணைப்புச்சொல்லைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமும் தீவிரமும் காக்கப்பட்டுள்ளன; இறுதி γάρ-இன் காரணத் தொடர்பு தமிழின் இயல்பான வாக்கிய அமைப்பில் தரப்பட்டுள்ளது.
