  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: ta
  text: 'விசுவாசித்தவர்களோடு இந்த அடையாளங்கள் வரும்[a]: என் பெயரில் பிசாசுகளைத் துரத்துவார்கள்; புதிய மொழிகளில்[b] பேசுவார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பின்தொடரும்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல், இந்த அடையாளங்கள் விசுவாசித்தவர்களோடு இணைந்து வருவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் நேர்ச்சொல்லாக ‘நாவுகள்’ என்பதையும், ‘மொழிகள்’ என்பதையும் குறிக்கலாம். இங்கு எத்தகைய பேச்சு குறிக்கப்படுகிறது என்பதை வசனம் மேலும் வரையறுக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: அற்புதச் செயல்கள் சான்றளிக்கும் அடையாளங்களாக இருப்பதைக் குறிக்கும் கிரேக்கச் சொல்லின் பொருளை இது காக்கிறது; ‘அற்புதங்கள்’ என்பது அதன் சான்றுத் தன்மையை முழுமையாக வெளிப்படுத்தாது.
- source_word: τοῖς πιστεύσασιν
  choice: விசுவாசித்தவர்களுடன்
  rationale: இறந்தகால வினையெச்சத்தின் நிறைவுற்ற செயல் நுணுக்கத்தை ‘விசுவாசித்தவர்கள்’ வெளிப்படுத்துகிறது; அதேவேளையில் இங்கு அந்தச் சொல் ஒரு பொதுவான குழுவைக் குறிக்கிறது.
- source_word: ταῦτα παρακολουθήσει
  choice: இந்த அடையாளங்கள் கூடவே வரும்
  rationale: ταῦτα என்பதன் நேரடியான சுட்டுப்பொருளையும், παρακολουθέω குறிக்கும் பின்தொடர்தல் அல்லது உடன்செல்லுதல் என்ற தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயரையும் அதிகாரத்தையும் சார்ந்து செயற்படுவதைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: δαιμόνια ἐκβαλοῦσιν
  choice: பிசாசுகளைத் துரத்துவார்கள்
  rationale: δαιμόνια என்பதை தொடர்புடைய வேறொரு கிரேக்கச் சொல்லான ‘அசுத்த ஆவிகள்’ என்று மாற்றாமல் நேரடியாகக் காட்டுகிறது; ἐκβάλλω என்பதன் வெளியேற்றும் வலிமையை ‘துரத்துவார்கள்’ தெரிவிக்கிறது.
- source_word: γλώσσαις λαλήσουσιν καιναῖς
  choice: புதிய மொழிகளில் பேசுவார்கள்
  rationale: γλῶσσα என்பது ‘நாவு’ என்றும் ‘மொழி’ என்றும் பொருள்படலாம். நவீன தமிழில் ‘மொழிகளில் பேசுதல்’ இயல்பானது; ‘புதிய’ என்பது καινός குறிக்கும் புதிய தன்மையை மேலதிக விளக்கமின்றிக் காக்கிறது. நிகழ்வின் துல்லிய இயல்பு அடிக்குறிப்பில் திறந்தவாறு வைக்கப்படுகிறது.
theological_decisions:
- issue: ‘புதிய மொழிகளில் பேசுவார்கள்’ என்பதில் γλώσσαις குறிக்கும் நிகழ்வின் இயல்பு
  choice: முதன்மை உரையில் ‘மொழிகளில்’ என்று மொழிபெயர்த்து, அந்த மொழிகள் எத்தகையவை என்பதை வரையறுக்காமல் விடுதல்
  alternative: ‘புதிய நாவுகளில்’ அல்லது குறிப்பாக ‘மனித மொழிகளில்’/‘பரவசப் பேச்சில்’ என்று மொழிபெயர்த்தல்
  rationale: γλῶσσα மொழியைக் குறிக்கக்கூடும்; ஆனால் இவ்வசனம் இது அறியப்பட்ட மனித மொழிகளா அல்லது வேறுவகை உரையாடலா என்பதைத் துல்லியமாக விளக்கவில்லை. எனவே எந்தக் கோட்பாட்டு விளக்கத்தையும் உரைக்குள் சேர்க்காமல், சொற்பொருள் வாய்ப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடவே வரும்’ என்பது இயல்பான தமிழில் உடனிருக்கும் கருத்தைத் தருகிறது; ‘புதிய மொழிகளில்’ என்பது பழமையான ‘பாஷைகளில்’ என்பதைக் காட்டிலும் தற்போதைய பயன்பாட்டுக்கு ஏற்றது.
