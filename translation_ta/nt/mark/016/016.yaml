  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: ta
  text: நம்பி திருமுழுக்கு பெற்றவர் இரட்சிக்கப்படுவார்[a]; ஆனால் நம்பாதவர் குற்றவாளி எனத் தீர்ப்பிடப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இயல்பான நடையில்: “நம்பி திருமுழுக்கு பெறுபவர் இரட்சிக்கப்படுவார்; ஆனால் நம்பாதவர் குற்றவாளி எனத் தீர்ப்பிடப்படுவார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: நம்பிக்கை கொண்டு … பெற்றவர்
  rationale: இறந்தகால வினையெச்சத்துடன் கூடிய substantival அமைப்பு, எதிர்கால விளைவுக்கு முன்பான செயலைக் குறிக்கிறது. தமிழில் ஒருமை பொதுப்பொருளை இயல்பாகத் தக்கவைக்க ‘நம்பிக்கை கொண்டு … பெற்றவர்’ என வழங்கப்பட்டுள்ளது.
- source_word: βαπτισθεὶς
  choice: திருமுழுக்குப் பெற்றவர்
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செயலைத் தாமே செய்ததாக அல்ல, அதைப் பெற்றதாகக் காட்டுகிறது.
- source_word: σωθήσεται
  choice: மீட்கப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, இச்சூழலின் இரட்சிப்பு சார்ந்த பொருளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ δὲ ἀπιστήσας
  choice: ஆனால் நம்ப மறுத்தவர்
  rationale: ἀπιστέω என்பது இங்கு πιστεύω-வுக்கான எதிர்மறை மாறுபாடு. ‘நம்பாதவர்’ என்பதைக் காட்டிலும் இறந்தகால வினையெச்சத்தின் நிறைவு/மறுப்பு நுணுக்கத்தை ‘நம்ப மறுத்தவர்’ ஓரளவு தெளிவாகக் காட்டுகிறது.
- source_word: κατακριθήσεται
  choice: தண்டனைத் தீர்ப்புக்கு உள்ளாவார்
  rationale: குற்றத்தீர்ப்பும் அதன் பாதக விளைவும் அடங்கிய எதிர்காலச் செயப்பாட்டு பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: καὶ
  choice: -உம் / கொண்டு
  rationale: இரு வினையெச்சங்களையும் நேரடியாக இணைக்கும் καὶ-யைத் தமிழின் இயல்பான தொடரமைப்பில் வெளிப்படுத்துகிறது; இரண்டையும் ஒரே நபரின் விவரிப்பாகத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: நேர்மறை மற்றும் எதிர்மறை முடிவுகளுக்கிடையிலான முரண்பாட்டைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: நம்பிக்கை, திருமுழுக்கு, மீட்பு ஆகியவற்றின் தொடர்பு
  choice: நம்பிக்கை கொண்டதையும் திருமுழுக்குப் பெற்றதையும் மீட்கப்படுகிற நபரின் இணைந்த விவரிப்பாக நேரடியாக மொழிபெயர்த்தல்
  alternative: திருமுழுக்கை மீட்பின் வெளிப்படையான கருவிக் காரணமாக வலுப்படுத்துதல், அல்லது வசனத்தில் அது வெறும் துணைச் செய்தி எனத் தளர்த்துதல்
  rationale: கிரேக்கம் இரு வினையெச்சங்களையும் இணைக்கிறது; ஆனால் இரண்டாம் பகுதியில் திருமுழுக்குப் பெறாதவர் அல்ல, நம்ப மறுத்தவரே தண்டனைத் தீர்ப்பைப் பெறுவார் என்கிறது. ஆகவே வசனத்தின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் தீர்த்துவிடாமல் அப்படியே தக்கவைக்கிறது.
- issue: ஆண்பால் ஒருமை வடிவத்தின் பொதுப்பொருள்
  choice: ‘பெற்றவர் / மறுத்தவர்’ என்ற பொதுப்பொருள் கொண்ட மரியாதை ஒருமையைப் பயன்படுத்துதல்
  alternative: பன்மையாக மாற்றுதல் அல்லது ‘எவர்’ என்ற நிபந்தனைத் தொடரைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது; இது ஆண்களுக்கு மட்டும் உரியதாகத் தவறாக உணர்த்தாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘திருமுழுக்கு’ என்பது βαπτίζω-வின் முழுக்குதல் சார்ந்த வடிவத்தைத் தெளிவாகக் காட்டுகிறது. மூலத்தின் ஒருமை அமைப்பும் இரு பகுதிகளின் கூர்மையான முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
