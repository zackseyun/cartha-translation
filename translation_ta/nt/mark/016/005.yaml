source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: ta
  text: அவர்கள் கல்லறைக்குள் நுழைந்தபோது, வலப்பக்கத்தில் வெள்ளை அங்கி அணிந்தபடி உட்கார்ந்திருந்த ஓர் இளைஞனைக்[a] கண்டார்கள்; அவர்கள் மிகுந்த அதிர்ச்சியடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘ஒரு வானதூதன்.’ மாற்கு இங்கே அவரை ‘ஓர் இளைஞன்’ என்று வருணிக்கிறார்; எனினும் விரிவான சூழலும் இணை நிகழ்வுரைகளும் அவர் வானதூதர் என்பதைச் சுட்டுகின்றன.
    reason: முதன்மை உரையில் νεανίσκος என்பதன் வருணனைப் பொருளைத் தக்கவைத்துக்கொண்டு, இணை விவரணைகளின் அடிப்படையிலான மாற்று அடையாளப் புரிதலைக் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: அவர்கள் கல்லறைக்குள் நுழைந்தபோது
  rationale: பெண்பால் பன்மை இறந்தகால வினையெச்சம் சூழலில் அந்தப் பெண்களைக் குறிக்கிறது. முதன்மை வினையுடன் உள்ள காலத் தொடர்பை இயல்பான நவீனத் தமிழில் ‘நுழைந்தபோது’ என வெளிப்படுத்துகிறது.
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: அடக்கம் செய்யப்பட்ட இடத்தை உயிர்த்தெழுதல் நிகழ்வின் சூழலில் தெளிவாகவும் வழக்கமாகவும் குறிக்கும் சொல்.
- source_word: νεανίσκον
  choice: ஓர் இளைஞன்
  rationale: கிரேக்கச் சொல் நேரடியாக ஓர் இளம் ஆணைக் குறிக்கிறது. இவ்வசனமே அவரை வெளிப்படையாக வானதூதர் என்று அடையாளப்படுத்தாததால் வருணனை அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: καθήμενον
  choice: உட்கார்ந்திருந்த
  rationale: அந்த இளைஞனின் நிலையைக் குறிக்கும் நிகழ்கால வினையெச்சத்தை இயல்பான தமிழில் கூறுகிறது.
- source_word: ἐν τοῖς δεξιοῖς
  choice: வலப்பக்கத்தில்
  rationale: கல்லறைக்குள் அவர் இருந்த இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: வெள்ளை அங்கி அணிந்து
  rationale: அங்கி அணிந்த நிலையில் இருந்ததைத் தெரிவிக்கும் நிறைவுநிலை வினையெச்சத்தையும் அதன் வெள்ளை நிறத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: στολή
  choice: அங்கி
  rationale: தனித்துவமான நீண்ட மேலாடையைக் குறிக்கும் சொல்லுக்கு வாசகர்களுக்குப் புரியும் கண்ணியமான தமிழ் இணை.
- source_word: ἐξεθαμβήθησαν
  choice: மிகவும் திகிலடைந்தார்கள்
  rationale: வெறும் வியப்பைவிட வலுவான அதிர்ச்சி மற்றும் அச்ச உணர்வை வினைச்சொல் தெரிவிக்கிறது; ‘மிகவும் திகிலடைந்தார்கள்’ அதன் தீவிரத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: νεανίσκος என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘ஓர் இளைஞன்’ என்று வருணனை அடிப்படையில் மொழிபெயர்த்தல்
  alternative: ‘ஒரு வானதூதர்’ என்று அடையாளப்படுத்தல்
  rationale: வெள்ளை அங்கியும் இணை உயிர்த்தெழுதல் விவரங்களும் வானதூதரைக் குறிப்பதாகப் புரிந்துகொள்ள இடமளித்தாலும், மாற்கு 16:5 நேரடியாக νεανίσκος (‘இளைஞன்’) என்றே கூறுகிறது. ஆகவே மாற்குவின் சொல்வடிவமும் உரையில் உள்ள மறைபொருள் வாய்ப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. தொடர் வாக்கியத்தின் ஓட்டம் அரைப்புள்ளியால் தெளிவுபடுத்தப்பட்டுள்ளது.
