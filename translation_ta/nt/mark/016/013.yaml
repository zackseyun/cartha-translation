source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: ta
  text: அவர்கள் போய், மீதமுள்ளவர்களிடம்[a] அதைத் தெரிவித்தார்கள். ஆனால், மீதமுள்ளவர்களும் அவர்களை நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்றவர்களிடம்.”
    reason: λοιποί என்பது குழுவில் மீதமுள்ளவர்களைக் குறிக்கலாம்; பொதுவான மாற்று மொழிபெயர்ப்பாக ‘மற்றவர்கள்’ என்பதும் இயலும்.
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: அவர்களும்
  rationale: καί + ἐκεῖνοι என்பதன் ‘அவர்களும்/அந்த நபர்களும்’ என்ற இணைப்பு வலிமையை இயல்பான தமிழில் தருகிறது; சூழலில் குறிப்பிடப்பட்ட இருவரை இது சுட்டுகிறது, ஆனால் மூலத்தில் இல்லாத ‘ஆண்கள்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἀπελθόντες
  choice: போய்
  rationale: முதன்மை வினைக்கு முன் நடந்த புறப்படுதலைத் தமிழ் வினையெச்ச வடிவம் இயல்பாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: ἀπήγγειλαν
  choice: அதைத் தெரிவித்தார்கள்
  rationale: ἀπαγγέλλω என்பதன் செய்தியை அறிவித்தல் அல்லது அறிக்கை செய்தல் என்ற பொருளை ‘தெரிவித்தார்கள்’ தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத பொருள், முந்தைய நிகழ்வைச் சுட்டும் ‘அதை’ எனச் சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: τοῖς λοιποῖς
  choice: மீதியிருந்தவர்களிடம்
  rationale: λοιπός இங்கு அந்தக் குழுவில் எஞ்சியிருந்த மற்றவர்களைக் குறிக்கிறது. ‘மீதியிருந்தவர்கள்’ என்பது ‘the rest’ என்ற குழு சார்ந்த நுணுக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: οὐδὲ
  choice: ஆனால் ... உம் ... இல்லை
  rationale: முந்தைய நம்பாமையுடன் இதையும் இணைக்கும் ‘அவர்களும் ... நம்பவில்லை’ என்ற கூட்டல் வலிமையையும், கதையின் எதிர்மறைத் திருப்பை ‘ஆனால்’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: ἐκείνοις
  choice: அவர்களை
  rationale: தகவல் தெரிவித்த இருவரை வினையின் பொருளாகச் சுட்டுகிறது. தமிழில் ‘நம்பு’ என்பதுடன் இயல்பாக வரும் ஐ வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπίστευσαν
  choice: நம்பவில்லை
  rationale: இந்தக் கதைச் சூழலில் πιστεύω என்பது சொல்லப்பட்ட சாட்சியை ஏற்றுக்கொள்வதைக் குறிக்கிறது; ‘நம்பவில்லை’ இதைத் தெளிவாகக் கூறுகிறது, தனிப்பட்ட சார்பை வலியுறுத்தும் வேறு பொருளைத் திணிக்கவில்லை.
theological_decisions:
- issue: சாட்சியை ஏற்றுக்கொள்வது என்ற கதைச் சூழலில் πιστεύω-வை மொழிபெயர்த்தல்
  choice: நம்பவில்லை
  alternative: நம்பிக்கை வைக்கவில்லை
  rationale: இங்கு வினை, அவர்கள் கூறிய செய்தியை மற்றவர்கள் ஏற்றுக்கொள்ளாததைக் குறிக்கிறது. ‘நம்பவில்லை’ என்பது நேரடியும் இயல்புமானது; ‘நம்பிக்கை வைக்கவில்லை’ என்பது தனிநபர்மீது சார்ந்திருத்தல் என்ற தேவையற்ற இறையியல் நுணுக்கத்தை உருவாக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு குழுக்களையும் தெளிவுபடுத்த இரண்டாம் வாக்கியத்தில் ‘மீதியிருந்தவர்கள்’ மீண்டும் சொல்லப்பட்டுள்ளது; இதனால் தமிழ்ச் சுட்டுப்பெயர் குழப்பம் தவிர்க்கப்படுகிறது.
