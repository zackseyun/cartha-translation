source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: ta
  text: ஓய்வுநாள் முடிந்தபின்பு, மகதலேனா மரியாளும், யாக்கோபின் தாயாகிய மரியாளும்[a], சலோமியும் அவரிடம் சென்று அவரை நறுமணப் பொருட்களால் பூசுவதற்காக அவற்றை வாங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்படியாக, “யாக்கோபினுடைய மரியாள்.” யாக்கோபுடன் அவருக்கிருந்த உறவு இங்கே வெளிப்படையாகக் கூறப்படவில்லை; பொதுவாக அவர் யாக்கோபின் தாய் என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: ஓய்வுநாள் முடிந்தபின்பு
  rationale: முதன்மைச் செயலுக்கு முன் ஓய்வுநாள் கடந்துவிட்டதைச் சுட்டும் காலப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: மகதலேனா மரியாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவத்தைப் பேணி, ஊர்சார் அடையாளத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: யாக்கோபின் தாயாகிய மரியாள்[a]
  rationale: கிரேக்கத்தில் உறவு வெளிப்படையாகக் கூறப்படாத நீக்கவாக்கியம் உள்ளது. சூழலும் நற்செய்தி மரபுப் பயன்பாடும் ‘தாய்’ என்பதை ஆதரிப்பதால் உரையில் இயல்பாக வழங்கி, உள்ளார்ந்த தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்கிறது.
- source_word: Σαλώμη
  choice: சலோமி
  rationale: பெயரின் வழக்கமான, எளிதில் அறியத்தக்க தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἠγόρασαν
  choice: வாங்கினார்கள்
  rationale: எளிய இறந்தகாலக் கதைநடையை இயல்பான தமிழில் தருகிறது.
- source_word: ἀρώματα
  choice: நறுமணப் பொருட்கள்
  rationale: அடக்க ஆயத்தத்தில் பயன்படுத்தப்பட்ட மணமுள்ள பொருட்களைத் தெளிவாகக் குறிக்கிறது; ‘மசாலாப் பொருட்கள்’ எனும் சமையல் சார்ந்த தவறான உணர்வைத் தவிர்க்கிறது.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: அவரிடம் சென்று நறுமணப் பொருட்களைப் பூசுவதற்காக
  rationale: ἵνα என்பதன் நோக்கப் பொருளையும், முதலில் சென்று பின்னர் பூசும் செயல்வரிசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλείψωσιν
  choice: பூசுவதற்காக
  rationale: உடலில் மணப்பொருளைத் தடவுதல் அல்லது பூசுதல் என்ற நேரடிப் பொருளைத் தருகிறது; தேவையற்ற சடங்கு அல்லது கோட்பாட்டு நுணுக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: Μαρία ἡ τοῦ Ἰακώβου என்பதில் விடுபட்டுள்ள உறவைக் குறிப்பிடுதல்
  choice: யாக்கோபின் தாயாகிய மரியாள்
  alternative: யாக்கோபுக்குரிய மரியாள் / யாக்கோபுடன் தொடர்புடைய மரியாள்
  rationale: கிரேக்கச் சொற்றொடர் சொற்படியாக உறவின் வகையை நிர்ணயிக்கவில்லை. ஆயினும் மாற்கு நற்செய்தியின் அடையாளப்படுத்தும் பயன்பாடும் பாரம்பரியப் புரிதலும் ‘தாய்’ என்பதை வலுவாக ஆதரிக்கின்றன. உரை வாசிப்பிற்கு தேவையான தெளிவு வழங்கப்பட்டாலும், மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நறுமணப் பொருட்கள்’ என்பது அடக்கச் சூழலைத் தெளிவுபடுத்துகிறது. கிரேக்கத்தில் உள்ள உறவுசார் தெளிவின்மை உரையை இயல்பற்றதாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
