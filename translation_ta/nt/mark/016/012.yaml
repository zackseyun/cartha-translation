source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, அவர்களில் இருவர் நாட்டுப்புறப் பகுதிக்கு[b] நடந்து சென்றுகொண்டிருந்தபோது, அவர் வேறொரு உருவத்தில்[a] அவர்களுக்குத் தோன்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மாறுபட்ட தோற்றத்தில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு வயலுக்கு.’ இச்சூழலில் ἀγρός என்பது நாட்டுப்புறப் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: μετά + வேற்றுமை உருபு காட்டும் காலத் தொடரை இயல்பான தமிழில் காக்கிறது; δέ இங்கு உரையைத் தொடர்ந்து நகர்த்துவதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: அவர்களில் இருவர்
  rationale: ஒரு பெரிய குழுவிலிருந்து இருவர் என்பதைக் குறிக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: περιπατοῦσιν … πορευομένοις
  choice: நடந்து சென்றுகொண்டிருந்தபோது
  rationale: இரு நிகழ்காலப் பெயரெச்சங்களிலும் உள்ள நடப்பதும் நோக்கமுள்ள பயணமும் ஒரே இயல்பான தொடரில் வெளிப்படுகின்றன; தேவையற்ற சொல் மறுபடிதலைத் தவிர்க்கிறது.
- source_word: ἐφανερώθη
  choice: அவர்களுக்குத் தோன்றினார்
  rationale: இச்சூழலில் φανερόω என்பதன் செயப்பாட்டு வடிவம் உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சியளிப்பை இடியோமாட்டிக்காகக் குறிக்கிறது; ‘தோன்றினார்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: வேறொரு உருவத்தில்
  rationale: ἑτέρα குறிக்கும் வேறுபாட்டையும் μορφή குறிக்கும் உருவம் அல்லது வெளித்தோற்றத்தையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: εἰς ἀγρόν
  choice: நாட்டுப்புறப் பகுதிக்கு
  rationale: ἀγρός என்பது தனிப்பட்ட ஒரு வயலைக் குறிக்கலாம்; ஆனால் இச்சூழலில் ஊருக்கு வெளியேயுள்ள நாட்டுப்புறத்தை இலக்காகக் குறிப்பதே அதிகம் பொருந்துகிறது.
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇ என்பதில் உயிர்த்தெழுந்த இயேசுவின் தோற்றத்தின் இயல்பு
  choice: வேறொரு உருவத்தில் என்று விளக்கமின்றி வருணித்தல்
  alternative: மாறுபட்ட தோற்றத்தில்
  rationale: வேறுபாடு இயேசுவின் வெளித்தோற்றத்திலா, காண்போரின் உணர்தலிலா, அல்லது வேறொரு விதமான அடையாளங்காணுதலிலா என்பதை வசனம் விளக்கவில்லை. ஆகவே அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நடந்து சென்றுகொண்டிருந்தபோது’ என்பது மூலத்திலுள்ள நடப்பதும் பயணம் செய்வதும் ஆகிய இணைந்த கருத்துகளை இயல்பாகத் தருகிறது; ‘வேறொரு உருவத்தில்’ என்ற சொற்றொடர் வசனத்தின் இறையியல் தெளிவின்மையைத் தக்கவைக்கிறது.
