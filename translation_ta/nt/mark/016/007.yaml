  verdict: approve
  source_fidelity: கிரேக்கத்தின் கட்டளைத் தொடர் (‘போய் ... சொல்லுங்கள்’), பெறுநர்களாக சீடர்களும் பேதுருவும் தனித்தனியாகக் குறிப்பிடப்படுதல், கலிலேயாவுக்கு முன்னதாகச் செல்லுதல், அங்கே காண்பது, மற்றும் முன்பு கூறியதோடு ஒத்துப்போதல் ஆகிய அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அவர் உங்களிடம் சொன்னபடியே’ என்பதைத் தமிழில் முன்னிலைப்படுத்தியிருப்பது பொருளை மாற்றவில்லை.
  naturalness: நவீனத் தரத் தமிழில் நடை இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘நீங்கள் போய் ... சொல்லுங்கள்’ என்பது பன்மை ஏவலுக்கான வழக்கமான, கண்ணியமான வடிவம். நேரடி மேற்கோள் மற்றும் ‘என்று சொல்லுங்கள்’ அமைப்பும் வாசிப்புக்கு ஏற்றது.
  terminology: ‘சீடர்கள்,’ ‘பேதுரு,’ ‘கலிலேயா’ ஆகிய பெயர்களும் சொற்களும் நிலையான நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. ‘உங்களுக்கு முன்னே ... போகிறார்’ என்பது Προάγει என்பதன் முன்னதாகச் செல்லும் கருத்தைத் தக்கவைக்கிறது; விளக்கவுரையாக விரிவுபடுத்தவில்லை.
