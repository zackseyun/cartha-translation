id: MRK.16.7
reference: Mark 16:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: ta
  text: ஆனால் நீங்கள் போய், அவருடைய சீடர்களிடமும் பேதுருவிடமும்[a], “அவர் உங்களுக்கு முன்னே கலிலேயாவுக்குப் போகிறார்[b]. அவர் உங்களிடம் சொன்னபடியே, அங்கே அவரைக் காண்பீர்கள்” என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய சீடர்கள்’ என்பதற்குப் பின் பேதுரு தனியாகப் பெயரிடப்படுகிறார். இது அவர் இயேசுவை மறுதலித்த பின்பு மீண்டும் ஏற்றுக்கொள்ளப்படுவதைச் சுட்டக்கூடும்; எனினும், கிரேக்க உரை ‘குறிப்பாகப் பேதுருவிடம்’ என்று வெளிப்படையாகச் சொல்லவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘கலிலேயாவுக்குள் போகிறார்.’ இங்குள்ள கிரேக்க முன்னிடைச்சொல் இலக்கை ‘கலிலேயாவுக்கு’ என்றும், உள்ளே செல்லுதலை ‘கலிலேயாவுக்குள்’ என்றும் மொழிபெயர்க்க இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய சூழலிலிருந்து கட்டளைக்குத் திரும்பும் வலுவான எதிர்மறை மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ὑπάγετε
  choice: நீங்கள் போய்
  rationale: பன்மை ஏவலைத் தெளிவாகக் காட்டுகிறது; அடுத்து வரும் ‘சொல்லுங்கள்’ என்பதுடன் இயல்பான தமிழ் வினையெச்சத் தொடராக அமைகிறது.
- source_word: εἴπατε
  choice: சொல்லுங்கள்
  rationale: செய்தியை சீடர்களுக்கும் பேதுருவுக்கும் தெரிவிக்கும்படியான பன்மை ஏவலை மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: அவருடைய சீடர்களிடமும் பேதுருவிடமும்
  rationale: இரு பெறுநர்களையும் καί மூலம் இணைக்கும் கிரேக்க அமைப்பைப் பேணி, பேதுருவைத் தனியாகப் பெயரிடுகிறது.
- source_word: Προάγει ὑμᾶς
  choice: அவர் உங்களுக்கு முன்னே ... போகிறார்
  rationale: இயேசு அவர்களுக்குமுன் செல்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறுமனே ‘முன்னிலை வகிக்கிறார்’ என்று பொருளை மாற்றவில்லை.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்குப்
  rationale: εἰς இச்சூழலில் இலக்கைச் சுட்டுகிறது. ‘கலிலேயாவுக்கு’ என்பது நவீன தமிழில் இயல்பானது; ‘கலிலேயாவுக்குள்’ என்ற நுணுக்கமும் சாத்தியம்.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: அங்கே அவரைக் காண்பீர்கள்
  rationale: கலிலேயாவைக் குறிக்கும் இடவினையையும் எதிர்காலக் காட்சியையும் நேரடியாகப் பேணுகிறது.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: அவர் உங்களிடம் சொன்னபடியே
  rationale: இயேசு முன்பு கூறியதற்கும் இப்போது அறிவிக்கப்படுவதற்கும் உள்ள ஒத்திசைவை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ‘அவருடைய சீடர்கள்’ என்பதற்குப் பின் பேதுரு தனியாகக் குறிப்பிடப்படுதல்
  choice: ‘அவருடைய சீடர்களிடமும் பேதுருவிடமும்’ என்ற நேரடியான இணைப்பைப் பேணுதல்
  alternative: ‘அவருடைய சீடர்களிடம், குறிப்பாகப் பேதுருவிடம்’ அல்லது ‘பேதுரு உட்பட அவருடைய சீடர்களிடம்’
  rationale: கிரேக்கம் பேதுருவைத் தனியாகப் பெயரிடுகிறது; ஆனால் ‘குறிப்பாக’ என்றோ ‘உட்பட’ என்றோ வெளிப்படையாகச் சொல்லவில்லை. மறுதலிப்புக்குப் பிந்தைய அவரது மீட்பை இது சுட்டக்கூடும்; அதை முதன்மை உரையில் உறுதிப்படுத்தாமல் உரையின் இறையியல் மற்றும் கதைநடை அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பன்மை ஏவலை இயல்பாக்க ‘போய் ... சொல்லுங்கள்’ என்ற வினையெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது. நேரடி மேற்கோள் செய்தியின் எல்லையைத் தெளிவாக்குகிறது.
