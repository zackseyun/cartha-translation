  source_fidelity: மூலக் கிரேக்கத்தின் தொடர்நிலை இறந்தகாலமான ἔλεγον, பரஸ்பரப் பொருளுடைய πρὸς ἑαυτάς, எதிர்கால வினாவான ἀποκυλίσει, மற்றும் பயனாளியைக் குறிக்கும் ἡμῖν ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. “உருட்டி அகற்றுவார்” என்பது கல்லை உருட்டி விலக்குவதைக் காக்கிறது; “நுழைவாயிலிலிருந்து” என்பதும் ἐκ τῆς θύρας-க்கு பொருத்தமானது.
