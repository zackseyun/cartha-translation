  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: ta
  text: அவர்கள் ஒருவருக்கொருவர், “கல்லறையின் நுழைவாயிலிலிருந்து அந்தக் கல்லை நமக்காக யார் உருட்டி அகற்றுவார்?” என்று பேசிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம், அப்போது தொடர்ந்துகொண்டிருந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த உரையாடலைக் காட்டுகிறது.
- source_word: πρὸς ἑαυτάς
  choice: ஒருவருக்கொருவர்
  rationale: சொல்லுக்குச் சொல் 'தங்களுக்குள்' என்றாலும், பன்மைச் சூழலில் பெண்கள் பரஸ்பரம் பேசிக்கொண்டதைக் குறிக்கிறது; இத்தமிழ் வடிவம் இயல்பாக உள்ளது.
- source_word: Τίς
  choice: யார்
  rationale: செயலைச் செய்யக்கூடிய நபரைப் பற்றிய நேரடியான வினா.
- source_word: ἀποκυλίσει
  choice: உருட்டி அகற்றுவார்
  rationale: ஒரு பொருளை அதன் இடத்திலிருந்து உருட்டி விலக்குவதைக் குறிப்பாக உணர்த்தும் வினையின் தெளிவான, இயல்பான தமிழ் இணை.
- source_word: ἡμῖν
  choice: நமக்காக
  rationale: இந்த இடத்தில் நான்காம் வேற்றுமை பெண்களின் நன்மைக்காக அல்லது அவர்கள் சார்பாகச் செயலைச் செய்வதைக் குறிக்கிறது.
- source_word: τὸν λίθον
  choice: அந்தக் கல்லை
  rationale: குறிப்பிட்ட கல்லைக் குறிக்கும் சுட்டுத்தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத 'பெரிய' என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἐκ τῆς θύρας
  choice: நுழைவாயிலிலிருந்து
  rationale: θύρα என்பதற்கு 'கதவு' அல்லது 'நுழைவாயில்' என்று பொருள் வரலாம்; கல்லறையின் திறப்பைக் குறிக்கும் இச்சூழலில் 'நுழைவாயில்' தெளிவானது.
- source_word: τοῦ μνημείου
  choice: கல்லறையின்
  rationale: அடக்கம் செய்யப்பட்ட குகை அல்லது கல்லறையை இச்சூழலில் இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
