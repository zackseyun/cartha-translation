  register: நவீன பொதுத்தமிழில், மரியாதையும் இயல்பும் கொண்ட உரை. தொடர்நிலையைக் காட்ட 'பேசிக்கொண்டிருந்தார்கள்' பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பொருளியல் தெளிவின்மையை மாற்றும் தேவையில்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
