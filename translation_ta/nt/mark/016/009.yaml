source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: ta
  text: வாரத்தின் முதல் நாளில் அதிகாலையில் அவர் உயிர்த்தெழுந்த பின்பு[a], முதலில் மகதலேனா மரியாளுக்குத் தோன்றினார்; அவளிடமிருந்து அவர் ஏழு பேய்களைத் துரத்தியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்கு 16:9–20 சில பழமையான கையெழுத்துப் பிரதிகளில் இல்லை; வேறு பிரதிகளில் இவ்வசனங்கள் இடம்பெறுகின்றன, சிலவற்றில் வேறுபாடுகளுடன் காணப்படுகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: அவர் உயிர்த்தெழுந்த பின்பு
  rationale: இறந்தோரிலிருந்து எழுதலைச் சூழல் குறிப்பதால் ‘உயிர்த்தெழுந்த’ என்றும், முதன்மை வினைக்கு முன்னான நிகழ்வை இறந்தகால வினையெச்சம் குறிப்பதால் ‘பின்பு’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான உரையோட்ட இணைப்புச்சொல். தமிழில் தனியாக ‘ஆனால்’ அல்லது ‘இப்போது’ என்று சேர்ப்பது தேவையற்ற எதிர்மறை அல்லது காலநுணுக்கத்தை உண்டாக்கும்.
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: வாரத்தின் முதல் நாளன்று அதிகாலையில்
  rationale: πρωῒ என்பது அதிகாலையையும், πρώτῃ σαββάτου என்ற யூத-கிரேக்க மரபுத்தொடர் வாரத்தின் முதல் நாளையும் குறிக்கிறது.
- source_word: ἐφάνη
  choice: தோன்றினார்
  rationale: உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சியளித்தலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: தோற்றங்களின் வரிசையில் முதல் நபர் என்பதைச் சுட்டும் வினையடைப் பொருளைப் பாதுகாக்கிறது.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: மகதலேனா மரியாளுக்கு
  rationale: பெயரும் ஊரடையாளமும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட வடிவில் தரப்பட்டுள்ளன; வேற்றுமை உருபு தோன்றிய நபரைச் சுட்டுகிறது.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: அவளிடமிருந்து அவர் … துரத்தியிருந்தார்
  rationale: παρά வெளியேற்றப்பட்ட இடம் அல்லது நபரைச் சுட்டுகிறது; முற்கடந்தகால வடிவம் தோன்றுவதற்கு முன்பே நடந்த செயலைக் காட்டுவதால் ‘துரத்தியிருந்தார்’ எனத் தரப்பட்டது.
- source_word: ἑπτὰ δαιμόνια
  choice: ஏழு பேய்கள்
  rationale: நற்செய்தி நூல்களின் பேயோட்டும் சூழலில் δαιμόνια என்பதற்கான இயல்பான நவீனத் தமிழ் இணைச்சொல்; எண்ணிக்கை அப்படியே பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: மாற்கு 16:9 நீண்ட முடிவுப் பகுதியைச் சேர்ந்ததன் உரை விமர்சன நிலை
  choice: கொடுக்கப்பட்டுள்ள கிரேக்க உரையின்படி வசனத்தை மொழிபெயர்த்து, 16:9–20 பற்றிய கையெழுத்துப் பிரதிச் சிக்கலை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சில பழமையான கையெழுத்துப் பிரதிகளைப் பின்பற்றி 16:9–20ஐ முதன்மை உரையிலிருந்து விடுதல்
  rationale: SBLGNT இவ்வசனத்தை இரட்டை அடைப்புக்குறிக்குள் வழங்கி அதன் உரைநிலை சர்ச்சைக்குரியது என்பதைச் சுட்டுகிறது. ஆகவே வசனம் மொழிபெயர்க்கப்படுகிறது; ஆனால் முக்கியமான சான்று வேறுபாடு மறைக்கப்படாமல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்த்தெழுந்த’, ‘தோன்றினார்’, ‘பேய்கள்’ ஆகியவை மூலத்தின் கருத்தைத் தெளிவாகக் காக்கும் பரவலான சொற்கள். கிரேக்க δὲ-க்கு தேவையற்ற தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை.
