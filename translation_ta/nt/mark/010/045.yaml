id: MRK.10.45
reference: Mark 10:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ta
  text: ஏனெனில், மானிட மகன்கூட பணிவிடை பெற வரவில்லை; மாறாக, பணிவிடை செய்யவும் பலருக்குப் பதிலாகத் தமது உயிரை மீட்புவிலையாகக் கொடுக்கவும் வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலருக்காகத் தமது உயிரை மீட்புவிலையாகக் கொடுக்க.” இங்கு “பதிலாக” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க முன்னிடைச்சொல் பரிமாற்றம் அல்லது பதிலீடு என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில், ...கூட
  rationale: γάρ முந்தைய போதனைக்கு காரணவிளக்கம் தருகிறது; καί வலியுறுத்தும் ‘கூட’ என்பதால் வெளிப்படுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இது இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் நிலைபெற்ற பட்டப்பெயர்; அதன் வேதாகம இடையிணைப்பையும் பட்டப்பெயரின் தன்மையையும் காக்கிறது.
- source_word: διακονηθῆναι / διακονῆσαι
  choice: பணிவிடை பெற / பணிவிடை செய்ய
  rationale: செயப்பாட்டு–செய்வினை முரணை ஒரே தமிழ்ச் சொல்லின் வேரைக் கொண்டு தெளிவாகப் பேணுகிறது.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: தமது உயிரை
  rationale: இச்சூழலில் ψυχή என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதை மட்டும் அல்லாமல், மரணத்திற்குக் கொடுக்கப்படும் உயிரையே குறிக்கிறது.
- source_word: λύτρον
  choice: மீட்புவிலை
  rationale: விடுதலை பெறுவதற்காகக் கொடுக்கப்படும் விலை என்ற λύτρον என்பதன் பொருளைச் சுருக்கமாகவும் இறையியல் பொருளை மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: ἀντὶ πολλῶν
  choice: பலருக்குப் பதிலாக
  rationale: ἀντί இங்கு பரிமாற்றம் அல்லது பதிலீட்டைக் குறிக்கும் வலுவான பொருளைக் கொண்டிருப்பதால், பொதுவான ‘பலருக்காக’ என்பதைவிட ‘பலருக்குப் பதிலாக’ மூலத்தின் நுணுக்கத்தைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: மீட்புவிலை கூற்றில் ἀντί என்பதன் வலிமை
  choice: பலருக்குப் பதிலாக
  alternative: பலருக்காக
  rationale: ἀντί என்பதன் இயல்பான பதிலீட்டு அல்லது பரிமாற்றப் பொருளை முதன்மை உரையில் வெளிப்படையாக வைத்திருக்கிறது; அதேவேளை தமிழில் வழக்கமான, ஆனால் குறைவாகத் துல்லியமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘பலர்’ என்பதன் அளவு
  choice: பலர்
  alternative: அனைவர்
  rationale: πολλῶν என்பதை அதன் இயல்பான அளவுச் சொல்லாகவே மொழிபெயர்த்து, இவ்வசனம் மட்டும் தீர்மானிக்காத இறையியல் கேள்வியை விளக்கவுரையால் தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பணிவிடை பெற / பணிவிடை செய்ய’ என்ற இணைச்சொல் மூலத்தின் சொல்லாட்சி முரணைக் காக்கிறது. மரியாதை ஒருமைக்காக ‘தமது’, ‘வந்தார்’ பயன்படுத்தப்பட்டுள்ளன.
