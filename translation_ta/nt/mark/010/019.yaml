source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: ta
  text: 'கட்டளைகள் உனக்குத் தெரியுமே: கொலை செய்யாதே[a]; விபசாரம் செய்யாதே; திருடாதே; பொய்ச் சாட்சி சொல்லாதே; பிறருக்கு உரியதைப் பறிக்காதே[b]; உன் தந்தையையும் தாயையும் மதித்து நட.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிரைக் கொல்லாதே.” இங்குள்ள கிரேக்க வினை பொதுவாகக் கொல்வதைக் காட்டிலும் குறிப்பாகக் கொலை செய்வதைக் குறிக்கிறது; ஆகவே “கொலை செய்யாதே” என்பதே முதன்மையாகத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பிறருக்கு உரியதைப் பறிக்காதே” என்பதை “பிறருக்கு உரியதை மறுக்காதே” அல்லது “பிறருக்குரியதைத் தராமல் பிடித்துவைக்காதே” என்றும் மொழிபெயர்க்கலாம். இச்சொல் ஒருவருக்கு உரியதை அவரிடமிருந்து பறிப்பதையோ, அவருக்குச் சேரவேண்டியதைத் தராமல் இருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς οἶδας
  choice: கட்டளைகள் உனக்குத் தெரியுமே
  rationale: οἶδας நிகழ்காலப் பொருளில் ‘தெரியும்’ என்பதைக் குறிக்கிறது; வாக்கியச் சூழலில் ‘தெரியுமே’ என்பது இயல்பான உரையாடல் நடையையும் நினைவூட்டும் தொனியையும் தருகிறது.
- source_word: Μὴ φονεύσῃς
  choice: கொலை செய்யாதே
  rationale: φονεύω பொதுவான உயிர்க்கொலையைவிட அநியாயமான மனிதக் கொலையைக் குறிப்பதால் ‘கொலை செய்யாதே’ துல்லியமானது.
- source_word: Μὴ μοιχεύσῃς
  choice: விபசாரம் செய்யாதே
  rationale: μοιχεύω திருமண உறவை மீறும் பாலியல் துரோகத்தைக் குறிக்கும் வழக்கமான அறநெறிச் சொல்.
- source_word: Μὴ κλέψῃς
  choice: திருடாதே
  rationale: κλέπτω என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: பொய்ச் சாட்சி சொல்லாதே
  rationale: ψευδομαρτυρέω-வின் சட்ட மற்றும் சாட்சியச் சூழலைப் பாதுகாக்கிறது; பொதுவான ‘பொய் சொல்லாதே’ என்பதைவிடத் துல்லியமானது.
- source_word: Μὴ ἀποστερήσῃς
  choice: பிறருக்குரியதை மோசடியாகப் பறித்துக்கொள்ளாதே
  rationale: ἀποστερέω என்பது ஒருவருக்கு உரியதை மறுத்தல், பிடித்துவைத்தல் அல்லது சுரண்டிப் பறித்தல் என்ற பரப்பைக் கொண்டது; தமிழ் வாசகருக்கு அந்தப் பொருளைத் தெளிவாக வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: Τίμα
  choice: மதித்து நட
  rationale: τιμάω வெறும் மனப்பாங்கான மரியாதையை மட்டுமல்ல, நடத்தையில் வெளிப்படும் கனத்தையும் கடமையையும் குறிக்கிறது.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: உன் தந்தையையும் தாயையும்
  rationale: இரு பெற்றோரையும் தனித்தனியாகக் குறிப்பிடும் கிரேக்க அமைப்பை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பத்துக் கட்டளைகளின் மேற்கோள்/நினைவூட்டலுக்கான நடை
  choice: அடையாளம் காணத்தக்க கட்டளை நடையையும் கிரேக்கச் சொற்களின் துல்லியத்தையும் இணைத்தல்
  alternative: மரபுவழி தமிழ் கட்டளைச் சொற்றொடர்களை மாற்றமின்றிப் பயன்படுத்துதல் அல்லது சுதந்திரமாகப் பொழிப்புரை செய்தல்
  rationale: இந்த வசனம் கட்டளைகளின் பட்டியலாக இருப்பதால் கட்டளைத் தொனி காக்கப்படுகிறது. அதேவேளை φονεύω மற்றும் ἀποστερέω ஆகியவற்றின் குறிப்பான பொருள் பொதுப்படுத்தப்படவில்லை.
- issue: ἀποστερέω என்பதன் பொருள் பரப்பு
  choice: ஒருவருக்கு உரியதை மோசடியாகப் பறித்துக்கொள்ளுதல்
  alternative: ஏமாற்றாதே; வஞ்சிக்காதே; உரியதை மறுக்காதே; கொள்ளையடிக்காதே
  rationale: இந்த வினை பிறருக்கு உரியதைத் தராமல் பிடித்துவைத்தல், பறித்தல் அல்லது சுரண்டுதல் ஆகியவற்றை உள்ளடக்கலாம். முதன்மை உரை பொருளை இயல்பாகத் தெளிவாக்குகிறது; அடிக்குறிப்பு மாற்றுப் பொருள் நிழல்களைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குத் தெளிவான அதேவேளை வேதாகமக் கட்டளைகளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தெரியுமே’ உரையாடலின் இயல்பான நினைவூட்டும் தொனியை வழங்குகிறது; கட்டளைகள் ஒருமை முன்னிலையிலேயே வைக்கப்பட்டுள்ளன.
