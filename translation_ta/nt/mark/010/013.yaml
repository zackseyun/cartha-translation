    reason: lexical_alternative
  revision_rationale: The revision joins the purpose clause naturally to the ongoing act of bringing. It also makes explicit that the disciples rebuked those who were bringing the children, the most coherent referent of αὐτοῖς in this context, avoiding a misleading Tamil pronoun antecedent. The footnote continues to preserve the broader lexical range of παιδία.
