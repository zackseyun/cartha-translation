revisions:
- from: சிலர் குழந்தைகளை[a] அவரிடம் கொண்டுவந்துகொண்டிருந்தார்கள்; அவர் அவர்களைத் தொடவேண்டும் என்பதற்காக அப்படிச் செய்தார்கள். ஆனால் சீடர்கள் அவர்களைக் கண்டித்தார்கள்.
  to: சிலர் குழந்தைகளை[a] அவர் தொடுவதற்காக அவரிடம் கொண்டுவந்துகொண்டிருந்தார்கள்; ஆனால் சீடர்கள் குழந்தைகளைக் கொண்டுவந்தவர்களைக் கண்டித்தார்கள்.
  rationale: The revision joins the purpose clause naturally to the ongoing act of bringing. It also makes explicit that the disciples rebuked those who were bringing the children, the most coherent referent of αὐτοῖς in this context, avoiding a misleading Tamil pronoun antecedent. The footnote continues to preserve the broader lexical range of παιδία.
  reviewer_model: gpt-5.6-terra
