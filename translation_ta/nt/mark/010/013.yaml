source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: ta
  text: சிலர் குழந்தைகளை[a] அவர் தொடுவதற்காக அவரிடம் கொண்டுவந்துகொண்டிருந்தார்கள்; ஆனால் சீடர்கள் குழந்தைகளைக் கொண்டுவந்தவர்களைக் கண்டித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறு குழந்தைகளை.” παιδία என்ற கிரேக்கச் சொல் பொதுவாகக் குழந்தைகளைக் குறிக்கலாம்; சிறு குழந்தைகளையும் அது உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: கொண்டுவந்துகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டும் கிரேக்க imperfect வினையின் கூறைத் தக்கவைக்கிறது. ‘அவரிடம் கொண்டு வந்தார்கள்’ என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παιδία
  choice: குழந்தைகளை
  rationale: பல்வேறு வயதிலுள்ள குழந்தைகளைக் குறிக்கக்கூடிய பொதுவான சொல்லாக இருப்பதால், நவீனத் தமிழில் இயல்பானதும் அளவுக்கு மீறிக் குறுகாததுமான மொழிபெயர்ப்பு.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: அவர் அவர்களைத் தொடவேண்டும் என்பதற்காக
  rationale: ἵνα உடன் வரும் subjunctive நோக்கத்தை வெளிப்படுத்துகிறது. ‘தொட’ என்பது ἅπτομαι என்பதன் நேரடியான பொருளைத் தக்கவைத்து, இணை நிகழ்ச்சிகளிலிருந்து ‘கைகளை வைக்க’ என்பதை இங்கு சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐπετίμησαν
  choice: கண்டித்தார்கள்
  rationale: கடுமையாகக் கடிந்துகொள்ளுதல் அல்லது கண்டித்தல் என்ற வலிமையை, மிகப் பேச்சுவழக்காகவோ மிக இலக்கியமாகவோ இல்லாமல் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: கிரேக்கத்தின் சுட்டுப்பெயர் வடிவத்தைத் தக்கவைக்கிறது. சூழலில் இது குழந்தைகளைக் கொண்டுவந்தவர்களையே மிக இயல்பாகக் குறிக்கிறது; அதே நேரத்தில் மூலத்தில் உள்ள சுட்டுப்பெயர் வடிவத்தை விளக்கவுரையாக விரித்தெழுதவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: குழந்தைகளைக் கொண்டுவந்தவர்களின் செயலுக்கும் சீடர்களின் எதிர்வினைக்கும் இடையிலான மென்மையான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: சீடர்கள் யாரைக் கண்டித்தார்கள்?
  choice: குழந்தைகளைக் கொண்டுவந்தவர்களை
  alternative: குழந்தைகளை
  rationale: προσέφερον என்பதன் வெளிப்படையாகச் சொல்லப்படாத எழுவாயே αὐτοῖς என்பதற்கான மிகப் பொருத்தமான முன்னிலைச் சுட்டாகும். அடுத்த வசனத்தின் நிகழ்வோட்டமும், குழந்தைகள் வருவதைத் தடுத்த சீடர்களின் நடத்தைக்கு இயேசு எதிர்வினையாற்றுவதும் இதற்கு ஆதரவாக உள்ளன. இருப்பினும், மொழிபெயர்ப்பில் மூலத்தின் சுட்டுப்பெயர் வடிவம் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. imperfect கூறைத் தக்கவைக்க ‘கொண்டுவந்துகொண்டிருந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது. சுட்டுப்பெயரின் வடிவம் பாதுகாக்கப்பட்டாலும், தமிழ் வாக்கிய ஓட்டத்தில் அதன் இயல்பான குறிப்பு குழந்தைகளைக் கொண்டுவந்தவர்களாகப் புரிகிறது.
