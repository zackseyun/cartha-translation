  rationale: 'திருத்தம் மூலத்தின் நீதித்துறை மற்றும் வரலாற்றுச் சூழலை அதிகத் துல்லியமாகக் காட்டுகிறது: ἀρχιερεῖς-க்கு யூத ஆலயச் சூழலுக்கேற்ற “தலைமை ஆசாரியர்கள்” பயன்படுத்தப்பட்டுள்ளது; τοῖς ἔθνεσιν-க்கு நிகழ்வுச் சூழலைப் பிரதிபலிக்கும் “யூதரல்லாதவர்கள்” பயன்படுத்தப்பட்டு, “தேசங்கள்” என்ற பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. παραδίδωμι வினைச்சொல்லின் இரு நிகழ்வுகளும் ஒரே தமிழ்ச் சொல்வேரால் தொடர்ந்தும் காட்டப்படுகின்றன.'
