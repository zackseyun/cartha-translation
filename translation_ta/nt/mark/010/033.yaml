id: MRK.10.33
reference: Mark 10:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: ta
  text: “இதோ, நாம் எருசலேமுக்கு ஏறிச் செல்கிறோம். மனிதகுமாரன் தலைமை ஆசாரியர்களிடமும் மறைநூல் அறிஞர்களிடமும் ஒப்புக்கொடுக்கப்படுவார்[a]. அவர்கள் அவருக்கு மரண தண்டனை விதித்து, யூதரல்லாதவர்களிடம்[b] அவரை ஒப்புக்கொடுப்பார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதிகாரத்தில் ஒப்படைக்கப்படுவார்” என்றும் மொழிபெயர்க்கலாம். இதே கிரேக்க வினைச்சொல்தான் வசனத்தின் இறுதியிலும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தேசங்களிடம்.” இச்சூழலில் யூதரல்லாதவர்களைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: நேரடி மேற்கோளைத் தொடங்கும் நிறுத்தக்குறியால் வெளிப்படுத்தப்பட்டது
  rationale: இங்கு ὅτι முந்தைய வசனத்திலுள்ள சொல்லும் வினையைத் தொடர்ந்து இயேசுவின் கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோள் குறியே இதை இயல்பாக வெளிப்படுத்துவதால் காரணப் பொருள் சேர்க்கப்படவில்லை.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கேட்போரின் கவனத்தை ஈர்க்கும் வலியுறுத்தலைக் கண்ணியமான, இன்றைய தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀναβαίνομεν
  choice: ஏறிச் செல்கிறோம்
  rationale: எருசலேமை நோக்கிய இயக்கத்தையும் அங்கு மேலே செல்லும் புவியியல் மற்றும் வழக்குச் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் தனிச்சிறப்பான சுயக்குறிப்பையும் அதன் வேதாகமத் தொடர்புகளையும் விளக்கவுரையாக்காமல் பாதுகாக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: ஒப்புக்கொடுக்கப்படுவார் / ஒப்புக்கொடுப்பார்கள்
  rationale: ஒருவரை மற்றவர்களின் அதிகாரத்திற்குள் ஒப்படைக்கும் பொருளைத் தருகிறது; இரண்டு இடங்களிலும் ஒரே கிரேக்க வினைச்சொல் வருவதையும் தமிழில் ஒரே சொல்வேரால் காட்டுகிறது. ‘காட்டிக்கொடுக்கப்படுவார்’ என்று மொழிபெயர்த்து துரோகத்தின் கருத்தை முன்கூட்டியே குறுக்கவில்லை.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: தலைமைக் குருமாரிடம்
  rationale: ஒரே தலைமைக் குருவை அல்ல, முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς γραμματεῦσιν
  choice: திருச்சட்ட அறிஞர்களிடம்
  rationale: அக்கால யூதத் திருச்சட்டத்தை நகலெடுத்து விளக்கிய அறிஞர்களைக் குறிக்கும் சொல்லை, ‘வேதபாரகர்’ போன்ற பழமையான சொல்லைப் பயன்படுத்தாமல் நவீன வாசகருக்குப் புரியுமாறு தருகிறது.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: அவர்கள் அவருக்கு மரணத் தீர்ப்பு அளித்து
  rationale: சட்டரீதியான குற்றத்தீர்ப்பையும் அதன் தண்டனையாக மரணத்தை விதிப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடம்
  rationale: இச்சூழலில் யூதத் தலைவர்களிடமிருந்து யூதரல்லாத அதிகாரிகளிடம் ஒப்புக்கொடுக்கப்படுவதைச் சுட்டுகிறது; ‘தேசங்கள்’ என்ற அருவமான பொருளைத் தவிர்த்தும் மூலத்தின் இன வேறுபாட்டைப் பாதுகாத்தும் உள்ளது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்பதன் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனிதர்
  rationale: மூலத்தின் சொற்றொடரையும் தானியேல் நூலுடனான எதிரொலியையும் கிறிஸ்துவியல் சுயக்குறிப்பையும் சுருக்காமல் பாதுகாக்கிறது.
- issue: τοῖς ἔθνεσιν என்பதன் சூழல்சார் பொருள்
  choice: பிற இனத்தார்
  alternative: தேசங்கள்
  rationale: பாடுபடும் நிகழ்வுகளின் உடனடிச் சூழலில் யூதத் தலைவர்களிடமிருந்து யூதரல்லாத ஆட்சியாளர்களுக்கான மாற்றத்தைக் குறிக்கிறது; இதற்கு அப்பாற்பட்ட இறையியல் முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல், ‘ஏறிச் செல்கிறோம்’ என்ற திசைநுட்பம், ஒரே கிரேக்க வினைச்சொல்லின் இருமுறை பயன்பாடு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ‘வேதபாரகர்’ போன்ற பழமையான சொல் தவிர்க்கப்பட்டு ‘திருச்சட்ட அறிஞர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
