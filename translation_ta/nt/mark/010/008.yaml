  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: ta
  text: அவர்கள் இருவரும் ஒரே மாம்சமாவார்கள்.[a] ஆகவே, அவர்கள் இனி இருவர் அல்ல; ஒரே மாம்சம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்-நேரடியாக: “அவர்கள் இருவரும் ஒரே மாம்சமாக இருப்பார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ஆவார்கள்
  rationale: εἰμί என்பதன் எதிர்கால வடிவமாக இருந்தாலும், εἰς + வேற்றுமைத் தொகையுடன் இங்கு ஒரு விளைவுநிலையைச் சுட்டுகிறது. அதனால் இயல்பான தமிழில் ‘ஆவார்கள்’ என்பது இணைவின் விளைவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οἱ δύο
  choice: அந்த இருவரும்
  rationale: கட்டுருபுடன் வரும் எண்ணைத் தெளிவாகப் பிரதிபலித்து, ஆதியாகம மேற்கோளிலும் அடுத்துவரும் எதிர்மறை ஒப்பீட்டிலும் வலியுறுத்தப்படும் இருமையைப் பாதுகாக்கிறது.
- source_word: εἰς σάρκα μίαν
  choice: ஒரே மாம்சமாவார்கள்
  rationale: εἰς குறிக்கும் விளைவுநிலையை ‘ஆவார்கள்’ மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதேவேளையில் ‘ஒரே மாம்சம்’ என்ற வேதாகமத் தொடர்புடைய சொற்றொடரைத் தக்கவைக்கிறது.
- source_word: σάρκα / σάρξ
  choice: மாம்சம்
  rationale: இங்கு சொல் நேரடியான மற்றும் திருமண உறவுசார் பொருளில் வருகிறது; ‘உடல்’ என்று மாற்றுவது பொருளைச் சுருக்கக்கூடும். ‘மாம்சம்’ ஆதியாகமத்துடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் விளைவு அல்லது முடிவை dignified modern Tamil-இல் தெளிவாக இணைக்கிறது.
- source_word: οὐκέτι
  choice: இனி
  rationale: முந்தைய நிலை தொடராது என்பதைக் குறுகிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλὰ μία σάρξ
  choice: அல்ல; ஒரே மாம்சம்
  rationale: ‘இருவர்’ என்பதற்கும் ‘ஒரே மாம்சம்’ என்பதற்கும் இடையிலான மைய எதிர்மறை ஒப்பீட்டை அப்படியே காக்கிறது.
theological_decisions:
- issue: இயேசு மேற்கோள் காட்டும் ‘ஒரே மாம்சம்’ என்பதன் பொருள்
  choice: ‘ஒரே மாம்சம்’ என்ற திருமண உறவுசார் வேதாகமச் சொற்றொடரை விளக்க விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: ‘ஒரே உடல்’, ‘ஒரே நபர்’ அல்லது ‘பாலுறவில் ஒன்றுபட்டவர்கள்’ என்று விளக்குதல்
  rationale: இந்தச் சொற்றொடர் வேதாகமச் சூழலில் விரிவான திருமண, உறவு மற்றும் மனிதவியல் அர்த்தங்களைத் தாங்குகிறது; இவ்வசனம் அதை ஒரே குறுகிய பொருளாக வரையறுக்கவில்லை. மூலச் சொற்றொடரைத் தக்கவைப்பது அந்த அர்த்தவிரிவையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒரே மாம்சம்’ என்பது அன்றாடச் சொல்லாடலைவிட வேதாகமப் பயன்பாட்டை நினைவூட்டினாலும், மூலத்தின் ஆதியாகமத் தொடர்பையும் திறந்த அர்த்தவிரிவையும் பாதுகாப்பதற்காகத் தக்கவைக்கப்பட்டுள்ளது.
