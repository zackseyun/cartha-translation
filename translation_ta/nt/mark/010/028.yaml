  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: ta
  text: 'பேதுரு அவரிடம் சொல்லத் தொடங்கினார்: “இதோ, நாங்கள் எல்லாவற்றையும் விட்டுவிட்டு உம்மைப் பின்பற்றியிருக்கிறோம்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: சொல்லத் தொடங்கினார்
  rationale: துணை வினை அமைப்பை இயல்பான நவீனத் தமிழில் நேர்த்தியாகக் காட்டுகிறது; தொடர்ந்து வரும் நேரடி கூற்றுக்கும் பொருந்துகிறது.
- source_word: ὁ Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: மூலத்தின் பிரதிப்பெயரைத் தக்கவைத்து, சூழலில் இயேசுவைக் குறிப்பது தெளிவாக இருக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: வெளிப்படையாக உள்ள பிரதிப்பெயர் பேதுருவின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: ἀφήκαμεν πάντα
  choice: எல்லாவற்றையும் விட்டுவிட்டு
  rationale: முழுமையான துறப்பைக் குறிக்கும் கூற்றை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἠκολουθήκαμέν σοι
  choice: உம்மைப் பின்பற்றியிருக்கிறோம்
  rationale: கிரேக்க நிறைவுக்காலத்தின் கடந்த செயலும் தொடரும் நிலையும் தமிழின் நிறைவு வடிவால் வெளிப்படுகின்றன; மரியாதை ஒருமை இயேசுவை நோக்கிய உரைக்கு ஏற்றது.
theological_decisions:
- issue: சீடத்துவத்திற்காக அனைத்தையும் விட்டதாகப் பேதுரு கூறுவது
  choice: அவரது கூற்றை உள்ளபடியே நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அனைத்தையும் துறந்தோம்’ என்று தீவிரப்படுத்துதல் அல்லது இயேசுவின் அடுத்த பதிலை முன்கூட்டியே விளக்கும் வகையில் மாற்றியுரைத்தல்
  rationale: இது பேதுருவின் வலியுறுத்தப்பட்ட கூற்று; உரையாளர் அதை ஆதரிப்பதாகவோ மறுப்பதாகவோ வசனம் கூறவில்லை. அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நடையுடன், இயேசுவை நோக்கிய உரையில் ‘உம்’ மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
