  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: ta
  text: அவர்கள் எரிகோவுக்கு வந்தார்கள்.[a] அவர் எரிகோவிலிருந்து தமது சீடர்களுடனும் பெருந்திரளான மக்கள் கூட்டத்துடனும் புறப்பட்டுச் சென்றபோது, திமேயுவின் மகனான பர்திமேயு என்னும் பார்வையற்ற பிச்சைக்காரர் சாலையோரத்தில் அமர்ந்திருந்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், ‘வருகிறார்கள்’ என்று வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது; இயல்பான தமிழ் கதைநடைக்காக இங்கு இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘சாலையின் பக்கத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: வந்தார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது. தமிழ் கதைநடையில் நிகழ்வுகளின் தொடரை இயல்பாகக் காட்ட இறந்தகாலம் பயன்படுத்தப்பட்டது.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: அவர் ... புறப்பட்டுச் சென்றபோது
  rationale: ஒரே நேரத்தில் நடக்கும் செயலைக் குறிக்கும் கிரேக்கப் பங்கேற்பு அமைப்பையும், எரிகோவிலிருந்து வெளியே செல்லும் இயக்கத்தையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: ὄχλου ἱκανοῦ
  choice: பெருந்திரளான மக்கள் கூட்டம்
  rationale: ἱκανός இங்கு கூட்டத்தின் கணிசமான அளவைக் குறிக்கிறது; இத்தமிழாக்கம் மிகைப்படுத்தாமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: திமேயுவின் மகனான பர்திமேயு
  rationale: மூலத்தில் உள்ள தனிப்பெயரையும் அதை விளக்கும் தந்தைவழி அடையாளத்தையும் இரண்டையும் தக்கவைக்கிறது.
- source_word: τυφλὸς προσαίτης
  choice: பார்வையற்ற பிச்சைக்காரர்
  rationale: இரு கிரேக்கச் சொற்களின் நேரடியான பொருளைத் தெளிவான, தற்போதைய தமிழில் தருகிறது.
- source_word: παρὰ τὴν ὁδόν
  choice: சாலையோரத்தில்
  rationale: சாலைக்குப் பக்கத்தில் இருந்த இடநிலையை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: Ἰεριχώ
  choice: எரிகோ
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
theological_decisions:
- issue: பர்திமேயுவின் கதை அடையாளம்
  choice: ‘பர்திமேயு’ என்ற பெயரையும் ‘திமேயுவின் மகன்’ என்ற விளக்கத்தையும் முதன்மை உரையில் தக்கவைத்தல்
  alternative: பெயரை மட்டும் அல்லது அதன் விளக்கத்தை மட்டும் வழங்குதல்
  rationale: மூலவசனம் இரண்டையும் வழங்குகிறது. இரண்டையும் தக்கவைப்பது மாற்குவின் விளக்கமான கதை விவரத்தைக் குறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. இயேசுவைக் குறிக்கும் ஒருமை மரியாதை வடிவங்களும், பர்திமேயுவைக் குறிக்கும் மனித மரியாதை வடிவமும் பயன்படுத்தப்பட்டுள்ளன. வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கச் சீரமைக்கப்பட்டாலும், மூலத்தின் நிகழ்வுவரிசையும் அடையாள விவரங்களும் தக்கவைக்கப்பட்டுள்ளன.
