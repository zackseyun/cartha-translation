revisions:
- from: அதற்கு அவர் அவர்களிடம், “மோசே உங்களுக்கு என்ன கட்டளையிட்டார்?” என்று கேட்டார்.
  to: அவர் அவர்களுக்குப் பதிலளித்து, “மோசே உங்களுக்கு என்ன கட்டளையிட்டார்?” என்றார்.
  rationale: This revision retains the direct question, Mosaic attribution, authoritative sense of 'command,' and the recipient-oriented 'you.' It also explicitly conveys that Jesus spoke in reply, without importing any explanation about Mosaic law or divine mediation.
