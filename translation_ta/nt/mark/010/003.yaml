id: MRK.10.3
reference: Mark 10:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: ta
  text: அவர் அவர்களுக்குப் பதிலளித்து, “மோசே உங்களுக்கு என்ன கட்டளையிட்டார்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: அதற்கு
  rationale: முந்தைய சோதனைக் கேள்விக்கான பதில்திருப்பை இயல்பாகக் காட்டுகிறது; δέ-யின் மென்மையான இணைப்பையும் சூழலிலுள்ள சிறு எதிர்மாற்றத்தையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: ἀποκριθεὶς εἶπεν
  choice: என்று கேட்டார்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து சொன்னார்’ என்ற இரட்டைச் சொல்லாட்சியைத் தமிழில் இயல்பான ஒரே வினையாக வழங்குகிறது; அவர் பதிலாக ஒரு கேள்வியைக் கேட்டார் என்பது மேற்கோளின் வடிவத்திலிருந்தும் ‘அதற்கு’ என்பதிலிருந்தும் தெளிவாகிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பேச்சு நோக்கப்பட்டவர்களை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: Τί
  choice: என்ன
  rationale: மோசே கொடுத்த கட்டளையின் உள்ளடக்கத்தை நேரடியாகக் கேட்கும் வினாப்பெயராக இயல்பாக அமைகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: கட்டளையைப் பெற்றவர்களைக் குறிக்கும் கிரேக்க வேற்றுமைப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐνετείλατο
  choice: கட்டளையிட்டார்
  rationale: அதிகாரபூர்வமான கட்டளை அல்லது அறிவுறுத்தல் என்ற சட்டச்சூழல் சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்; மூலத்தில் பெயரிடப்பட்ட மனித இடைத்தரகரையே அப்படியே வைத்திருக்கிறது.
theological_decisions:
- issue: இயேசுவின் பதிலில் மோசேயின் அதிகாரம் குறித்த குறிப்பு
  choice: மூலத்தைப் போலவே ‘மோசே’ என்ற பெயரை மட்டும் வைத்தல்
  alternative: ‘மோசேயின் சட்டம்’ அல்லது ‘மோசே வழியாகக் கடவுள்’ என்று விரிவாக்குதல்
  rationale: கிரேக்க உரை மோசேயை நேரடியாகப் பெயரிடுகிறது; ‘சட்டம்’ அல்லது ‘கடவுள் மூலமாக’ என்ற விளக்கத்தைச் சேர்க்கவில்லை. ஆகவே உரையில் இல்லாத இறையியல் விளக்கத்தை இறக்குமதி செய்யாமல் இயேசுவின் கேள்வி அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குத் தெளிவான, இயல்பான, கண்ணியமான உரை. நேரடி மேற்கோளும் சட்டச்சூழலின் அதிகாரத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
