id: MRK.10.44
reference: Mark 10:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: ta
  text: உங்களில் எவன் முதன்மையானவனாக இருக்க விரும்புகிறானோ, அவன் எல்லாருக்கும் அடிமையாக இருப்பான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாருக்கும் ஊழியனாக.” கிரேக்கத்தில் இங்கு வரும் δοῦλος (doulos) என்ற சொல், முந்தைய வசனத்தில் ‘ஊழியன்’ என்பதற்குப் பயன்படுத்தப்பட்ட சொல்லைவிட வலிமையானது; அந்த வேறுபாட்டைப் பாதுகாக்க இங்கு ‘அடிமை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: எவன் … விரும்புகிறானோ
  rationale: ἄν உடன் வரும் தொடர்புப்பெயரும் துணைவினை வடிவமும் பொதுவான, வரையறுக்கப்படாத நிபந்தனையைச் சுட்டுகின்றன. ‘எவன் … விரும்புகிறானோ’ என்பது விருப்பத்தையும் ‘யாராயினும்’ என்ற விரிவையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: இங்கு இடத்தைக் காட்டுவதைவிட சீடர் குழுவினரிடையிலான தரநிலையைக் குறிக்கிறது; ‘உங்களில்’ என்பது இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πρῶτος
  choice: முதன்மையானவன்
  rationale: πρῶτος இங்கு வரிசையில் முதல் இடத்தை மட்டுமல்ல, தரம் அல்லது முக்கியத்துவத்தில் முதலிடத்தையும் குறிக்கிறது. ‘முதன்மையானவன்’ இந்த சமூகத் தரச் சூழலைத் தெளிவாக்குகிறது.
- source_word: ἔσται
  choice: இருப்பான்
  rationale: எதிர்கால வடிவத்தை நேரடியாகப் பாதுகாக்கிறது. சூழலில் அறிவுறுத்தல் சார்ந்த வலிமை இருந்தாலும், அதை ‘இருக்க வேண்டும்’ என்று வெளிப்படையாக மாற்றாமல் மூலத்தின் வடிவத்தை நிலைநிறுத்துகிறது.
- source_word: πάντων
  choice: எல்லாருக்கும்
  rationale: δοῦλος என்பதுடன் வரும் பிறப்புவேற்றுமை அனைவருக்கும் கீழ்ப்பட்ட உறவைச் சுட்டுகிறது. தமிழில் ‘எல்லாருக்கும் அடிமை’ என்பது அந்த உறவையும் உலகளாவிய விரிவையும் இயல்பாகத் தருகிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: முந்தைய வசனத்தின் διάκονος என்பதைக் காட்டிலும் δοῦλος வலிமையான, கீழ்நிலை மற்றும் கட்டுப்பட்ட நிலையைக் குறிக்கிறது. ‘அடிமை’ அந்த தீவிரப்படுத்தப்பட்ட முரண்பாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சீடத்துவக் கூற்றில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: ஊழியன் / பணியாளர்
  rationale: மாற்கு 10:43-இல் வரும் διάκονος என்பதிலிருந்து வேறுபட்டு, இவ்வசனத்தில் δοῦλος இன்னும் தீவிரமான தாழ்நிலையைக் காட்டுகிறது. இரண்டையும் ஒரே ‘ஊழியன்’ சொல்லால் சமப்படுத்தாமல், இயேசுவின் சமூகப் பெருமைக்கெதிரான கூற்றின் வலிமையை ‘அடிமை’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘முதன்மையானவன்’ சமூகத் தரத்தில் முதலிடம் என்ற பொருளைத் தருகிறது; ‘அடிமை’ என்பது மூலத்தில் உள்ள தீவிரமான தாழ்த்துதலை மறைக்காமல் வைக்கிறது.
