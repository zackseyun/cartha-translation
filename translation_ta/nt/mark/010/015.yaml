id: MRK.10.15
reference: Mark 10:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ta
  text: '“உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: கடவுளுடைய அரசாட்சியை ஒரு குழந்தையைப்போல்[a] ஏற்றுக்கொள்ளாத எவரும் அதற்குள் நிச்சயமாக நுழையமாட்டார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு குழந்தையாக’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் குழந்தைக்குரிய தாழ்மை, நம்பிக்கை அல்லது சார்ந்திருக்கும் நிலையைச் சுட்டலாம்; ஆனால் எந்தக் குறிப்பிட்ட நுண்பொருள் நோக்கத்தில் உள்ளது என்பதை கிரேக்க உரை தெரிவிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: ஒரு கூற்றை உறுதியும் அதிகாரமும் உடையதாக அறிமுகப்படுத்தும் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்கத்தின் நேரடியான சொல்லமைப்பைப் பொருள் மாறாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ὃς ἂν
  choice: எவரும்
  rationale: இந்தச் சொற்றொடரின் வரையறுக்கப்படாத, பொதுவான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: μὴ δέξηται
  choice: ஏற்றுக்கொள்ளாத
  rationale: δέχομαι என்பதிலுள்ள பெற்றுக்கொள்ளுதல் அல்லது ஏற்றுக்கொள்ளுதல் என்ற பொருளை, ‘அரசாட்சி’ என்னும் எழுவாயுடன் இயல்பாக இணைக்கிறது; அதைச் சாதித்துப் பெறுவது என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசாட்சி
  rationale: கடவுளின் ஆட்சிசெயல் மற்றும் அவரது ஆட்சிக்குட்பட்ட நிலை ஆகிய இரு பரிமாணங்களையும் அளவுக்கு மீறிக் குறுக்காமல் தக்கவைக்கிறது.
- source_word: ὡς παιδίον
  choice: ஒரு குழந்தையைப்போல்
  rationale: ὡς குறிக்கும் ஒப்புமையை இயல்பாகத் தருகிறது; குழந்தையின் எந்தப் பண்பு குறிப்பிடப்படுகிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: நிச்சயமாக நுழையமாட்டார்
  rationale: οὐ μή அமைப்பிலுள்ள வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτήν
  choice: அதற்குள்
  rationale: முன்னர் சொல்லப்பட்ட கடவுளுடைய அரசாட்சியையே சுட்டி, εἰς என்பதின் ‘உள்ளே’ என்ற இயக்கப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளுடைய அரசாட்சியை ‘ஒரு குழந்தையைப்போல்’ ஏற்றுக்கொள்வதன் பொருள்
  choice: குழந்தையுடனான ஒப்புமையை அப்படியே வைத்து, குறிப்பிட்ட எந்தப் பண்பையும் உரையில் சேர்க்கவில்லை.
  alternative: தாழ்மையோடு, நம்பிக்கையோடு அல்லது சார்ந்திருக்கும் மனநிலையோடு ஏற்றுக்கொள்வது என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: கிரேக்க உரை ஒப்புமையை மட்டுமே கூறுகிறது; குழந்தையின் எந்தப் பண்பு நோக்கத்தில் உள்ளது என்பதை விளக்கவில்லை. ஆகவே உண்மையான விளக்கத் திறப்பையும் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ராஜ்யம்’ என்பதற்குப் பதிலாக இயல்பான ‘அரசாட்சி’ பயன்படுத்தப்பட்டு, ஆட்சி மற்றும் ஆட்சிக்குட்பட்ட நிலை ஆகிய இரு பொருள் பரப்புகளும் தக்கவைக்கப்பட்டுள்ளன.
