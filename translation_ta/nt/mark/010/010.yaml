reference: Mark 10:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: ta
  text: மேலும், அவர்கள் வீட்டில் இருந்தபோது, சீடர்கள் இதைக் குறித்து அவரிடம் மீண்டும் கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: பிறகு
  rationale: முந்தைய பொது உரையாடலிலிருந்து வீட்டில் நிகழும் அடுத்த காட்சிக்கு இயல்பாக இணைக்கும் கதைத் தொடர்புச்சொல்; கிரேக்க இணைப்பின் ஓட்டத்தைப் பேணுகிறது.
- source_word: εἰς τὴν οἰκίαν
  choice: அவர்கள் … வீட்டில் இருந்தபோது
  rationale: சொல்லுக்குச் சொல் ‘வீட்டுக்குள்’ என்றாலும், இங்கு தனிப்பட்ட வீட்டுச் சூழலுக்குத் திரும்பியிருப்பதைக் குறிக்கிறது. தமிழில் சூழ்நிலையை இயல்பாகச் சொல்ல ‘வீட்டில் இருந்தபோது’ பயன்படுத்தப்பட்டது; ‘அவர்கள்’ என்பது கிரேக்கத்தில் உள்ளடங்கிய சூழ்நிலைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: இதன் இடம் காரணமாக வீட்டில் மீண்டும் இருந்ததையோ மீண்டும் கேட்டதையோ குறிக்கக்கூடும். முதன்மை உரை இதை வீட்டுச் சூழலுடன் இணைக்கிறது; மற்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: குறிப்பிட்ட, ஏற்கெனவே அறிமுகமான இயேசுவின் சீடர் குழுவைக் குறிக்கிறது; ‘அவருடைய’ என்பதை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: περὶ τούτου
  choice: இதைக் குறித்து
  rationale: முந்தைய வசனங்களில் பேசப்பட்ட விவாகரத்து பற்றிய காரியத்தைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐπηρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த அல்லது மீள நிகழ்ந்த செயலைக் காட்டும் கிரேக்க imperfect வினையின் இயல்பைத் தமிழில் வெளிப்படுத்துகிறது; ‘கேட்கத் தொடங்கினார்கள்’ என்ற தொடக்கநிலைக் கருத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: αὐτόν
  choice: அவரிடம்
  rationale: இயேசுவைக் குறிக்கும் நேரடி பொருள் சுட்டுப்பெயர்; ‘கேள்’ வினையுடன் இயல்பான தமிழில் ‘அவரிடம்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: πάλιν (‘மீண்டும்’) எந்தச் சொற்றொடருடன் இணைகிறது என்பது
  choice: மீண்டும் வீட்டில் இருந்தபோது
  alternative: சீடர்கள் இதைக் குறித்து அவரிடம் மீண்டும் கேட்டுக்கொண்டிருந்தார்கள்
  rationale: கிரேக்கச் சொல் வரிசை இரு இணைப்புகளுக்கும் இடமளிக்கிறது. முதன்மை உரை அருகிலுள்ள வீட்டுச் சொற்றொடருடன் இணைக்கிறது; கேள்வி மீண்டும் கேட்கப்பட்டது என்ற வாசிப்பை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது. இவ்வேறுபாடு நேரடியான கோட்பாட்டுச் சிக்கலை உருவாக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான கேள்விச் செயலை ‘கேட்டுக்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கேட்கத் தொடங்கினார்கள்’ தவிர்க்கப்பட்டுள்ளது.
