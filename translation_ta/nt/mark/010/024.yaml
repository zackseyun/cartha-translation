  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: ta
  text: 'அவருடைய வார்த்தைகளால் சீடர்கள் திகைத்தார்கள். இயேசு மீண்டும் அவர்களுக்குப் பதிலளித்துக் கூறினார்: “பிள்ளைகளே, கடவுளுடைய அரசாட்சிக்குள் நுழைவது எவ்வளவு கடினம்![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிள்ளைகளே, செல்வத்தை நம்பியிருப்பவர்கள் கடவுளுடைய அரசாட்சிக்குள் நுழைவது எவ்வளவு கடினம்!” என்று சில கையெழுத்துப் பிரதிகள் வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: திகைத்தார்கள்
  rationale: சீடர்களின் வலுவான வியப்பையும் மனக்கலக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த எதிர்வினையைச் சுட்டினாலும், தமிழில் இச்சூழலில் எளிய இறந்தகாலம் இயல்பாக அதனைத் தெரிவிக்கிறது.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: அவருடைய வார்த்தைகளைக் கேட்டு
  rationale: அவருடைய வார்த்தைகளே அவர்களின் திகைப்புக்குக் காரணம் என்பதை இயல்பான தமிழில் கூறுகிறது. ‘கேட்டு’ என்பது உரையாடல் சூழலால் தெளிவாகக் கிடைக்கும் பொருள்; காரணத்தையும் கேள்வியுணர்வையும் அளவுக்கு மீறாமல் இணைக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: இயேசு தொடர்ந்து மறுமுறை பேசுவதை எளிமையாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: ἀποκριθεὶς λέγει
  choice: அவர்களிடம் … கூறினார்
  rationale: இரு கிரேக்க வினைகளும் சேர்ந்துள்ள வழக்கமான கதைநடைச் சொற்றொடரைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், அவர்களின் எதிர்வினைக்கு இயேசு பதிலளித்த உரையாடல் ஓட்டத்தை இயல்பான தமிழில் தருகிறது.
- source_word: Τέκνα
  choice: பிள்ளைகளே
  rationale: அன்பும் நெருக்கமும் கொண்ட நேரடி அழைப்பைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘என்’ என்பதைக் கூட்டவில்லை.
- source_word: πῶς δύσκολόν ἐστιν
  choice: எவ்வளவு கடினம்
  rationale: πῶς தரும் வியப்பையும் வலியுறுத்தலையும் தமிழின் இயல்பான வியப்புத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: கடவுளுடைய அரசாட்சிக்குள் நுழைவது
  rationale: ‘நுழைதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. ‘அரசாட்சி’ என்பது கடவுளின் ஆளுகையையும் அவரது ஆட்சிக்குரிய தளத்தையும் தேவையின்றிக் குறுக்காமல் எடுத்துரைக்கிறது.
theological_decisions:
- issue: ‘செல்வத்தை நம்பியிருப்பவர்கள்’ என்ற நீண்ட வாசகத்தை முதன்மை உரையில் சேர்ப்பதா
  choice: SBLGNT-இன் குறுகிய வாசகத்தைப் பின்பற்றி, ‘கடவுளுடைய அரசாட்சிக்குள் நுழைவது எவ்வளவு கடினம்’ என்று முதன்மை உரையில் தரப்பட்டது.
  alternative: ‘பிள்ளைகளே, செல்வத்தை நம்பியிருப்பவர்கள் கடவுளுடைய அரசாட்சிக்குள் நுழைவது எவ்வளவு கடினம்!’
  rationale: கொடுக்கப்பட்ட கிரேக்க மூல உரை குறுகிய வாசகத்தையே கொண்டுள்ளது. நீண்ட வாசகம் கூற்றின் பொருளைச் செல்வத்தை நம்புகிறவர்களுக்கெனக் குறுக்குவதால், அந்த விளக்கத்தை முதன்மை உரைக்குள் இறக்காமல் முக்கியமான பாடவேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவனுடைய ராஜ்யம்’ போன்ற மரபுவழிச் சமயப் பேச்சுக்கு மாற்றாக ‘கடவுளுடைய அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டுள்ளது; இது மூலத்தின் ஆட்சி/ஆட்சித்தளம் சார்ந்த பொருள் விரிவைத் தக்கவைக்கிறது.
