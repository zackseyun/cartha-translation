id: MRK.10.37
reference: Mark 10:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “உமது மகிமையில் எங்களில் ஒருவர் உமது வலப்பக்கத்திலும் மற்றொருவர் இடப்பக்கத்திலும் அமரும்படி எங்களுக்கு அருளும்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: எங்களுக்கு அருளும்
  rationale: சொல்லர்த்தமான ‘எங்களுக்குக் கொடும்’ என்பதைக் காட்டிலும், ஓர் உயர்ந்த வேண்டுகோளின் சூழலில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது; கோரிக்கையின் வலிமையையும் தக்கவைக்கிறது.
- source_word: εἷς ... καὶ εἷς
  choice: எங்களில் ஒருவர் ... மற்றொருவர்
  rationale: பேசுகிற இருவரில் ஒவ்வொருவரையும் குறிக்கிறது என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: வலப்பக்கத்திலும் ... இடப்பக்கத்திலும்
  rationale: மரியாதை மற்றும் அதிகாரத்துக்குரிய இடங்களைக் குறிக்கும் மூலமொழியின் இடவியல் சொற்றொடரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν τῇ δόξῃ σου
  choice: உமது மகிமையில்
  rationale: δόξα என்பதன் ‘மகிமை’ என்ற பரந்த இறையியல் பொருளையும், அந்த மகிமையின் வெளிப்பாடு அல்லது ஆட்சிநிலையைப் பற்றிய இயல்பான தெளிவின்மையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘உமது மகிமையில்’ என்பது மகிமையான ஆட்சியா, எதிர்கால மகிமையா, அல்லது மகிமையின் நிலையா?
  choice: உமது மகிமையில்
  alternative: உமது மகிமையான ஆட்சியில்
  rationale: மூலத்தில் ‘ஆட்சி’ அல்லது ‘ராஜ்யம்’ என்ற சொல் இல்லை. எனவே குறிப்பிட்ட இறையியல் விளக்கத்தை உரைக்குள் சேர்க்காமல், மூலத்தின் விரிவையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நேரடி உரை. இயேசுவை நோக்கிய உரையில் ‘உமது’, ‘அருளும்’ பயன்படுத்தப்பட்டுள்ளன; மொழி வழிபாட்டு நடையில் மிகப் பழமையானதாக இல்லாமல், சாதாரண வாசகருக்கும் புரியும் வகையில் அமைந்துள்ளது.
