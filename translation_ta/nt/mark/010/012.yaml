id: MRK.10.12
reference: Mark 10:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: ta
  text: மேலும், அவள் தன் கணவனை விவாகரத்து செய்துவிட்டு[a] வேறொருவனைத் திருமணம் செய்தால், அவள் விபசாரம் செய்கிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “தன் கணவனை அனுப்பிவிட்டு.” இந்தத் திருமணச் சூழலில் இதன் பொருள் “விவாகரத்து செய்துவிட்டு” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட இணையான நிலைமையுடன் இக்கூற்றை இயல்பாக இணைக்கிறது.
- source_word: ἐὰν
  choice: செய்தால்
  rationale: நிபந்தனையைத் தமிழில் இயல்பான வினைமுற்று வடிவில் தெரிவிக்கிறது.
- source_word: αὐτὴ
  choice: அவள்
  rationale: கிரேக்க மூலத்தின் வெளிப்படையான பெண்பால் எழுவாயைப் பாதுகாக்கிறது.
- source_word: ἀπολύσασα
  choice: விவாகரத்து செய்துவிட்டு
  rationale: சொல்லுக்கு பொதுவாக ‘அனுப்பிவிடுதல்’ என்ற பொருள் இருந்தாலும், இத்திருமணச் சூழலில் திருமண உறவை முறித்தல் என்பதே கருத்து; முன்நிகழ்வையும் அடுத்த திருமணத்தையும் இயல்பாக இணைக்க ‘செய்துவிட்டு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: தன் கணவனை
  rationale: ἀνήρ என்பதன் திருமணச் சூழலுக்குரிய பொருள் ‘கணவன்’; αὐτῆς என்பதைத் தமிழில் எழுவாயை நோக்கிச் சுட்டும் இயல்பான ‘தன்’ என்பதால் வழங்குகிறது.
- source_word: γαμήσῃ ἄλλον
  choice: வேறொருவனைத் திருமணம் செய்தால்
  rationale: ἄλλον ஆண்பால் வடிவில் இருப்பதை ‘வேறொருவனை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: μοιχᾶται
  choice: விபசாரம் செய்கிறாள்
  rationale: நிகழ்கால வினையின் நேரடியான ஒழுக்கவியல் கூற்றை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: கூற்றின் பாலினக் குறிப்பைத் தக்கவைத்தல்
  choice: ‘அவள் ... தன் கணவனை ... வேறொருவனை’ என்று பெண்பால் எழுவாயையும் ஆண்பால் பொருளையும் வெளிப்படையாகக் கூறுதல்
  alternative: ‘ஒருவர் தன் துணையை விவாகரத்து செய்து வேறொருவரைத் திருமணம் செய்தால்’ என்று பாலின நடுநிலையாக்குதல்
  rationale: மூலத்தில் αὐτὴ, τὸν ἄνδρα αὐτῆς, ἄλλον என பாலினம் குறிப்பாக உள்ளது; இது முந்தைய வசனத்திலுள்ள ஆணைப் பற்றிய கூற்றுக்கு திட்டமிட்ட இணையாகவும் அமைகிறது.
- issue: ἀπολύω என்பதை சொற்சொல்லாகவா, திருமணச் சட்டப் பொருளிலா மொழிபெயர்ப்பது
  choice: ‘விவாகரத்து செய்துவிட்டு’
  alternative: ‘தன் கணவனை அனுப்பிவிட்டு’
  rationale: இச்சூழலில் திருமண உறவை முறிப்பதே கருத்து. ‘விவாகரத்து’ அந்தச் சூழற்பொருளைத் தெளிவாகச் சொல்கிறது; அடிக்குறிப்பு சொற்சொல் மாற்றைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘விவாகரத்து’ என்பது இன்றைய வழக்கில் தெளிவான திருமணச் சட்டச் சொல்; ‘விபசாரம் செய்கிறாள்’ மூலத்தின் நேரடியான தீர்ப்பை மென்மைப்படுத்தாமல் வழங்குகிறது.
