id: MRK.10.29
reference: Mark 10:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: ta
  text: 'இயேசு சொன்னார்: “உண்மையாக உங்களுக்குச் சொல்கிறேன்: வீட்டையோ சகோதரர்களையோ சகோதரிகளையோ தாயையோ தந்தையையோ[a] பிள்ளைகளையோ வயல்களையோ என் பொருட்டும் நற்செய்தியின் பொருட்டும் விட்டுவந்தவர் எவரும்,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘தாயையோ தந்தையையோ’ என்ற சொற்கள் இடம்பெறவில்லை.
    reason: SBLGNT brackets μητέρα ἢ πατέρα, indicating that the inclusion of this phrase is textually uncertain.
lexical_decisions:
- source_word: ἔφη
  choice: சொன்னார்
  rationale: இயேசுவின் உரையை எளிமையாக அறிமுகப்படுத்தும் வினை; மூலத்தில் இல்லாத ‘பதிலளித்தார்’ அல்லது ‘அறிவித்தார்’ என்ற கூடுதல் நுண்ணுணர்வைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: Ἀμὴν
  choice: உண்மையாக
  rationale: ஒற்றை ἀμήν ஒரு முக்கியமான அறிவிப்பைத் தொடங்கும் உறுதிப்பாட்டு வடிவம். ‘ஆமென்’ என்று ஒலிபெயர்ப்பதைவிட இங்கு அதன் செயல்பாட்டை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடித்தன்மையையும் உரையின் ஆழ்ந்த உறுதிப்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐδείς ἐστιν ὃς
  choice: ஒருவர்கூட
  rationale: கிரேக்கத்தின் உலகளாவிய எதிர்மறைக் கருத்தைத் தமிழில் தொடரும் வாக்கிய அமைப்புக்கேற்ற எதிர்மறைத் தொடர்புச் சொல்லாகக் காட்டுகிறது. முழு எதிர்மறைப் பயன் அடுத்த வசனத்தில் நிறைவடைகிறது.
- source_word: ἀφῆκεν
  choice: விட்டுவந்த
  rationale: சீடத்துவத்திற்காக உறவுகளையோ உடைமைகளையோ விட்டுச் சென்ற செயலைக் குறிக்கிறது; ‘கைவிட்ட’ என்பதில் ஏற்படக்கூடிய பொறுப்பை முற்றிலும் துறந்தார் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: οἰκίαν
  choice: வீட்டை
  rationale: குடியிருப்பு அல்லது சொத்தைச் சுட்டும் நேரடியான, இயல்பான இணைச்சொல்.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: சகோதரர்களை / சகோதரிகளை
  rationale: மூலத்தில் ஆண் மற்றும் பெண் உடன்பிறந்தோர் தனித்தனியாகக் குறிப்பிடப்படுவதைப் பாதுகாக்கிறது.
- source_word: μητέρα / πατέρα
  choice: தாயை / தந்தையை
  rationale: குடும்ப உறவுகளுக்கான நேரடியான, கண்ணியமான தமிழ் இணைகள்.
- source_word: τέκνα
  choice: பிள்ளைகளை
  rationale: பாலின வேறுபாடின்றி சந்ததியைக் குறிக்கும் τέκνα என்பதற்கான இயல்பான பொதுச்சொல்.
- source_word: ἀγρούς
  choice: வயல்களை
  rationale: பயிரிடப்படும் நிலப்பரப்புகளைக் குறிக்கும் konkrete sense-ஐப் பாதுகாக்கும் நேரடியான தமிழ் சொல்.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: என் பொருட்டும் நற்செய்தியின் பொருட்டும்
  rationale: இரண்டு காரணங்களையும் இணையாகவும் தனித்தனியாகவும் முன்வைக்கும் மூல அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: குடும்பத்தையும் உடைமைகளையும் விட்டுச் செல்வதை அளவுக்கு மீறிக் கடுமையாக்காமல் மொழிபெயர்த்தல்
  choice: விட்டுவந்த
  alternative: கைவிட்ட / துறந்த
  rationale: வசனம் சீடத்துவத்தின் விலையை வலியுறுத்தினாலும், குடும்பப் பொறுப்புகளை ஒழுக்கரீதியாக முற்றிலும் நிராகரிப்பதாக வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தின் பதற்றத்தைத் தீர்த்துவிடாமலும் அதைவிடக் கடுமையான கருத்தைச் சேர்க்காமலும் ‘விட்டுவந்த’ பயன்படுத்தப்பட்டது.
- issue: 29ஆம் வசனத்தில் தொடங்கி 30ஆம் வசனத்தில் நிறைவடையும் எதிர்மறை வாக்கிய அமைப்பு
  choice: விட்டுவந்த ஒருவர்கூட,”
  alternative: விட்டுவந்த எவரும் இல்லை
  rationale: οὐδείς ... ἐὰν μὴ என்ற வாக்கியம் அடுத்த வசனத்தில் மட்டுமே நிறைவடைகிறது. ‘எவரும் இல்லை’ என்று இங்கே முடித்தால் அடுத்த வசனத்துடனான இலக்கணத் தொடர்பு தமிழில் சிதையும்; ‘ஒருவர்கூட’ என்பது எதிர்மறை எதிர்பார்ப்பை வைத்துக்கொண்டு தொடர்ச்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமை, கண்ணியம், வாய்மொழிப் புரிதல் ஆகியவை சமநிலைப்படுத்தப்பட்டுள்ளன. பட்டியலின் மீளும் ‘-யோ’ அமைப்பு கிரேக்கத்தின் ἢ தொடரை இயல்பாக பிரதிபலிக்கிறது. வசனம் 30ஆம் வசனத்தில் தொடரும் நிறைவுறாத வாக்கியமாகவே வைக்கப்பட்டுள்ளது.
