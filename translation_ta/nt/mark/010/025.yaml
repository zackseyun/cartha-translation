- from: ஒரு செல்வந்தன் கடவுளின் அரசாட்சிக்குள் நுழைவதைவிட, ஓர் ஒட்டகம் ஊசியின் கண் வழியாகச் செல்வது எளிது.[a][b][c]
  to: ஒரு செல்வந்தன் கடவுளின் ராஜ்யத்துக்குள் நுழைவதைவிட, ஓர் ஒட்டகம் ஊசியின் கண் வழியாகச் செல்வது எளிது.[a][b][c]
