  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: ta
  text: ஒரு செல்வந்தன் கடவுளின் ராஜ்யத்துக்குள் நுழைவதைவிட, ஓர் ஒட்டகம் ஊசியின் கண் வழியாகச் செல்வது எளிது.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக: “ஓர் ஊசியின் கண் வழியாக.”'
    reason: lexical_alternative
  - marker: b
    text: “ஒட்டகம்” என்பதற்குப் பதிலாக “கயிறு” என்று சிலர் முன்மொழிந்துள்ளனர்; ஆனால் இங்குள்ள கிரேக்க மூலபாடத்தில் “ஒட்டகம்” என்றே உள்ளது.
    reason: alternative_reading
  - marker: c
    text: “ஒரு செல்வந்தன்” என்பது கிரேக்கத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பிரதிபலிக்கிறது; இக்கூற்று பொதுவாகச் செல்வந்தர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: எளிது
  rationale: ஒப்பீட்டுச் சொல்லின் பொருள் ‘மேலும் எளிதானது’; ‘...விட ... எளிது’ என்ற தமிழ் அமைப்பு ஒப்பீட்டையும் மிகைப்படுத்திய கூற்றின் வலிமையையும் இயல்பாகக் காக்கிறது.
- source_word: κάμηλον
  choice: ஓர் ஒட்டகம்
  rationale: கிரேக்க மூலத்தில் உள்ள κάμηλος என்பதன் நேரடிப் பொருள் ‘ஒட்டகம்’; ‘கயிறு’ என்ற முன்மொழிவுக்கு இம்மூலபாடம் ஆதரவளிக்கவில்லை.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: ஊசியின் கண் வழியாக
  rationale: இது தைக்கும் ஊசியிலுள்ள சிறிய துளையைக் குறிக்கிறது. ‘ஊசியின் கண்’ என்பது தமிழில் புரியக்கூடியதும் உருவகத்தைத் துல்லியமாகக் காப்பதும் ஆகும்.
- source_word: διελθεῖν
  choice: செல்வது
  rationale: διέρχομαι என்ற வினையின் ‘வழியாகச் செல்லுதல்/கடத்தல்’ என்ற பொருளை, ‘வழியாக’ என்பதுடன் சேர்ந்து இயல்பான தமிழில் தருகிறது.
- source_word: πλούσιον
  choice: ஒரு செல்வந்தன்
  rationale: ஆண்பால் ஒருமையில் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள கிரேக்கப் பெயரடையைப் பிரதிபலிக்கிறது; கூற்று அந்த ஒருவரை மட்டுமல்ல, பொதுவாகச் செல்வந்தரைப் பிரதிநிதித்துவப்படுத்துகிறது.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சிக்குள்
  rationale: βασιλεία என்பது ஆட்சி அல்லது அரசாட்சியை முன்னிறுத்துகிறது; ‘கடவுளின் அரசாட்சி’ என்பது நிலப்பரப்பை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தவிர்த்து, மாற்கு நற்செய்தியின் மையச் சொல்லாட்சியைத் தெளிவாகத் தருகிறது.
- source_word: εἰσελθεῖν
  choice: நுழைவது
  rationale: εἰσέρχομαι என்பதன் ‘உள்ளே நுழைதல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: ஒட்டகம்–ஊசிக்கண் உருவகத்தின் விளக்கம்
  choice: ஒட்டகமும் உண்மையான தைக்கும் ஊசியின் கண்ணும் கொண்ட கடுமையான மிகைப்படுத்திய உருவகத்தை அப்படியே வைத்தல்
  alternative: எருசலேமிலிருந்ததாகக் கூறப்படும் ‘ஊசிக்கண் வாசல்’ அல்லது ‘ஒட்டகம்’ என்பதற்குப் பதிலாக ‘கயிறு’ என்று கொள்ளுதல்
  rationale: கிரேக்க மூலவாசகம் மிகத் தீவிரமான, நடைமுறையில் இயலாமையை உணர்த்தும் உருவகத்தையே தருகிறது. பிற்கால விளக்கங்களைக் கொண்டுவந்து அதன் கூர்மையைத் தணிக்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
- issue: βασιλεία τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் அரசாட்சி
  alternative: தேவனுடைய ராஜ்யம் / கடவுளின் ராஜ்யம்
  rationale: βασιλεία என்பதில் கடவுளின் ஆட்சி என்ற இயக்கமுள்ள கருத்து அடங்குகிறது. ‘அரசாட்சி’ நவீன பொதுத்தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளை வசனம் அதற்குள் ‘நுழைவது’ என்ற மூல உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒட்டகம்—ஊசிக்கண்’ என்ற அதிர்ச்சியூட்டும் மிகைப்படுத்தல் மென்மையாக்கப்படவில்லை. ஒப்பீடு தமிழின் இயல்பான ‘...விட ... எளிது’ அமைப்பில் தரப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
