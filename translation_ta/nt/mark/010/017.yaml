source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: ta
  text: அவர் சாலையில் செல்லப் புறப்பட்டுக்கொண்டிருந்தபோது,[a] ஒரு மனிதன் ஓடிவந்து, அவர் முன் முழங்காலிட்டு, அவரிடம், “நல்ல ஆசிரியரே, நித்திய வாழ்வை வாரிசாகப் பெற நான் என்ன செய்ய வேண்டும்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் பயணத்தைத் தொடங்கிக்கொண்டிருந்தபோது.” இந்தக் கிரேக்கத் தொடர் சாலையில் செல்லப் புறப்படுவதையோ பயணத்தைத் தொடங்குவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: அவர் புறப்பட்டுச் சாலைக்குச் சென்றுகொண்டிருந்தபோது
  rationale: முதன்மை நிகழ்வுடன் ஒரே நேரத்தில் நடைபெறும் பின்னணிச் செயலைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது. εἰς ὁδόν என்பது சாலைக்குச் செல்வதையோ பயணத்தைத் தொடங்குவதையோ குறிக்கக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: προσδραμὼν
  choice: ஓடிவந்து
  rationale: அந்த மனிதன் விரைவாகவும் அவசர உணர்வுடனும் அணுகிய காட்சித் தெளிவைப் பாதுகாக்கிறது.
- source_word: εἷς
  choice: ஒரு மனிதன்
  rationale: ஆண்பால் ஒருமையில் தனிநபரை அறிமுகப்படுத்தும் சொல்லைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: γονυπετήσας αὐτόν
  choice: அவர்முன் முழங்காலிட்டு
  rationale: மரியாதையோ வேண்டுதலோ காட்டும் முழங்காலிடும் செயலை மிகைப்படுத்தாமல் தெளிவாகக் கூறுகிறது.
- source_word: ἐπηρώτα αὐτόν
  choice: அவரிடம் ... என்று கேட்டான்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினையின் நிகழ்வைத் தமிழ் கதைநடையில் இயல்பான முறையில் தருகிறது.
- source_word: Διδάσκαλε ἀγαθέ
  choice: நல்ல போதகரே
  rationale: διδάσκαλος என்பதைக் ‘போதகர்’ என்றும் ἀγαθός என்பதைக் ‘நல்ல’ என்றும் நேரடியாகக் காத்து, அடுத்த வசனத்துடன் உள்ள சொற்பிணைப்பைப் பாதுகாக்கிறது.
- source_word: τί ποιήσω
  choice: நான் என்ன செய்ய வேண்டும்?
  rationale: தேவையான செயல் என்ன என்று கேட்கும் ஆலோசனைநிலை வினாவின் நடைமுறை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: பெற
  rationale: நோக்குறவைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வினையெச்ச அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நிலைவாழ்வு
  rationale: முடிவில்லாத வாழ்வையும் புதிய காலத்துக்குரிய வாழ்வையும் சுமக்கும் மரபுற்ற, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்லாக்கம்.
- source_word: κληρονομήσω
  choice: உரிமையாகப் பெற
  rationale: வெறுமனே ‘பெறுதல்’ என்று தட்டையாக்காமல், வாரிசாக அல்லது பங்குரிமையாகப் பெறும் κληρονομέω என்பதன் கருத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவை அந்த மனிதன் அழைக்கும் முறை
  choice: நல்ல போதகரே
  alternative: நல்ல ஆண்டவரே
  rationale: மூலத்தில் διδάσκαλε உள்ளது; κύριε இல்லை. ஆகவே மூலத்தில் இல்லாத வலிமையான பட்டத்தைச் சேர்க்காமல், அடுத்த வசனத்தில் ‘நல்லவர்’ குறித்து வரும் பதிலுக்கான முக்கிய சொற்பிணைப்பையும் காக்கிறது.
- issue: εἷς என்பதன் பாலின வெளிப்பாடு
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: ஆண்பால் ஒருமை வடிவமும் கதைச்சூழலும் ‘மனிதன்’ என்பதை ஆதரிக்கின்றன; பாலினத் தகவலை தேவையின்றி மறைக்கவில்லை.
- issue: κληρονομήσω என்பதிலுள்ள உரிமை/வாரிசுத்தன்மை
  choice: உரிமையாகப் பெற
  alternative: பெற
  rationale: நிலைவாழ்வு மனிதச் செயலால் சம்பாதிக்கப்படுகிறது என்று தீர்மானிக்காமலும், கேள்வியாளனின் சொற்களில் உள்ள ‘சுதந்தரித்தல்/வாரிசாகப் பெறுதல்’ என்ற இறையியல் பதற்றத்தை அழிக்காமலும் மூலக் கருத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமைக்காக இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்கள் ‘அவர்/அவரிடம்’ எனவும், புதிதாக அறிமுகமாகும் மனிதன் ‘கேட்டான்’ எனவும் தரப்பட்டுள்ளன. அடிக்குறி [a] உரிய இடத்தில் முதன்மை உரையிலேயே சேர்க்கப்பட்டுள்ளது.
