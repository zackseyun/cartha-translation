id: MRK.10.51
reference: Mark 10:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: ta
  text: இயேசு அவனுக்குப் பதிலளித்து, “நான் உனக்காக என்ன செய்ய வேண்டும் என்று விரும்புகிறாய்?” என்று கேட்டார். அதற்கு அந்தப் பார்வையற்ற மனிதன், “ரப்பூனி[a], நான் மீண்டும் பார்வை பெற வேண்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ரப்பூனி” என்பது “என் போதகரே” அல்லது “என் ஆசிரியரே” என்று பொருள்படும் அரமேய அழைப்புச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: பதிலளித்து
  rationale: கிரேக்கத்தில் உள்ள வினையெச்ச அமைப்பை இயல்பான தமிழில் வினையெச்சமாகவே வைத்திருக்கிறது; அதைத் தொடர்ந்து வரும் εἶπεν என்பதன் உரையாடல் செயலையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Τί σοι θέλεις ποιήσω
  choice: நான் உனக்கு என்ன செய்ய வேண்டும் என்று நீ விரும்புகிறாய்?
  rationale: σοι என்பதிலுள்ள ‘உனக்கு’ என்ற பொருளையும் θέλεις என்பதிலுள்ள விருப்பத்தின் கருத்தையும் விடாமல், கேள்வியைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: τυφλὸς
  choice: அந்தப் பார்வையற்ற மனிதன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள கிரேக்கப் பெயரடையைத் தமிழில் ஒருவரைக் குறிக்கும் இயல்பான, மரியாதையான சொல்லாக்கமாக வழங்குகிறது.
- source_word: Ραββουνι
  choice: ரப்பூனி
  rationale: கிரேக்க மூலமே செமித்திய அழைப்புச் சொல்லை ஒலிபெயர்த்திருப்பதால், அதன் வரலாற்றுத் தனித்தன்மையைப் பாதுகாக்க தமிழிலும் ஒலிபெயர்க்கப்பட்டுள்ளது; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἵνα ἀναβλέψω
  choice: நான் மீண்டும் பார்வை பெற வேண்டும்
  rationale: குணமாக்கும் இந்தச் சூழலில் ἀναβλέπω என்பது ‘மீண்டும் பார்வை பெறுதல்’ என்று பொருள்படும். இயேசுவின் கேள்விக்கான விருப்பப் பதிலாக ἵνα கூறை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ραββουνι என்ற அழைப்புப் பட்டத்தை மொழிபெயர்ப்பதா அல்லது ஒலிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘ரப்பூனி’ என்று வைத்து, பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘என் போதகரே’ அல்லது ‘என் தலைவரே’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை வழக்கமான கிரேக்கப் பட்டத்தைப் பயன்படுத்தாமல் செமித்திய அழைப்பை ஒலிபெயர்த்தே வைத்துள்ளது. அதே மூலமொழித் தன்மையைத் தமிழிலும் காக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு, வாசகர் புரிதலுக்காக பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘குருடன்’ என்பதற்குப் பதிலாக நபரை முன்னிறுத்தும் ‘பார்வையற்ற மனிதன்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘ரப்பூனி’ என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
