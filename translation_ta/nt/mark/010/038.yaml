source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களிடம், “நீங்கள் என்ன கேட்கிறீர்கள் என்பதை அறியவில்லை. நான் குடிக்கும் கிண்ணத்தை உங்களால் குடிக்க முடியுமா[a]? அல்லது நான் திருமுழுக்கு பெறுகிற திருமுழுக்கைப் பெற உங்களால் முடியுமா[b]?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிண்ணம்’ என்பது ஒருவருக்கு நியமிக்கப்பட்ட பங்கை அல்லது அனுபவத்தைச் சுட்டும் வேதாகம உருவகம்; இங்கு அது குறிப்பாக இயேசுவுக்கு வரவிருக்கும் துன்பத்தைச் சுட்டுகிறது.
    reason: cross_reference
  - marker: b
    text: வேறு வகையில், “நான் எதிர்கொள்ளும் திருமுழுக்கை நீங்களும் எதிர்கொள்ள முடியுமா?” கிரேக்கத்தில் ‘திருமுழுக்கு’ என்பதற்கான பெயர்ச்சொல்லும் வினைச்சொல்லும் வலியுறுத்துவதற்காக மீண்டும் மீண்டும் வருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: நீங்கள் என்ன கேட்கிறீர்கள் என்பது உங்களுக்குத் தெரியவில்லை
  rationale: οἶδα என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காக்கிறது; அதேவேளையில், அவர்களுடைய வேண்டுகோளின் உட்பொருளை அவர்கள் உணரவில்லை என்ற சூழல்சார் நிழற்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δύνασθε
  choice: உங்களால் ... முடியுமா?
  rationale: திறன் அல்லது ஆற்றலைக் குறிக்கும் δύναμαι என்பதற்கு நவீனத் தமிழில் இயல்பான கேள்வி வடிவம்.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: நான் குடிக்கும் கிண்ணத்திலிருந்து ... குடிக்க
  rationale: கிண்ணம் என்ற உருவகத்தை விளக்கிப் பொருளுரைக்காமல் காக்கிறது. தமிழில் ‘கிண்ணத்தைக் குடித்தல்’ இயல்பற்றதால், பாத்திரத்தில் உள்ளதை அருந்தும் பொருளில் ‘கிண்ணத்திலிருந்து குடித்தல்’ என மொழியாக்கப்பட்டுள்ளது.
- source_word: ἢ
  choice: அல்லது
  rationale: SBLGNT உரையிலுள்ள பிரிநிலை இணைப்பை அப்படியே காக்கிறது; இணைப்பை ‘மற்றும்’ என்று மாற்றி இணைநிகழ்வாகத் தீர்மானிக்கவில்லை.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: நான் பெறும் திருமுழுக்கை உங்களால் பெற
  rationale: βάπτισμα என்பதற்கு நிலைபெற்ற தமிழ்ச் சொல் ‘திருமுழுக்கு’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே சொற்குடும்ப மறுபயன்பாட்டை ‘பெறும்/பெற’ என்ற மீளுரையால் ஓரளவு காத்து, தமிழில் கடினமாக ஒலிக்கும் ‘திருமுழுக்கால் திருமுழுக்கப்படுதல்’ வடிவம் தவிர்க்கப்பட்டுள்ளது.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ஆனால் இயேசு அவர்களிடம் ... என்றார்
  rationale: δέ இங்கு முந்தைய வேண்டுகோளுக்கு எதிரான திருத்தும் திருப்பத்தைக் குறிக்கிறது; ‘ஆனால்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கிண்ணம்’ மற்றும் ‘திருமுழுக்கு’ ஆகிய உருவகங்கள்
  choice: இரண்டு உருவகங்களையும் முதன்மை உரையில் தக்கவைத்து, துன்பம் அல்லது மரணம் என்று நேரடியாக விளக்காமல் விடுதல்
  alternative: ‘நான் அனுபவிக்கும் துன்பத்தை உங்களால் அனுபவிக்க முடியுமா?’ என்று பொருளுரைத்தல்
  rationale: இவ்வுருவகங்கள் இயேசுவுக்கு வரவிருக்கும் துன்பத்தைச் சுட்டுகின்றன; ஆயினும் வசனம் அவற்றை முழுமையாக விளக்குவதில்லை. உருவகங்களைத் தக்கவைப்பது உரையின் இறையியல் ஆழத்தையும் திட்டமிட்ட மறைபொருளையும் காக்கிறது.
- issue: βαπτίζομαι என்ற நடப்பு/செயற்பாட்டு வடிவத்தின் காலநிலை
  choice: ‘நான் பெறும்’ என்று நிகழ்கால வடிவில் மொழிபெயர்த்தல்
  alternative: ‘நான் பெறப்போகும்’ என்று எதிர்காலத்தை வெளிப்படையாக்குதல்
  rationale: வரவிருக்கும் பாடுகளைச் சூழல் சுட்டினாலும், கிரேக்கம் நிகழ்கால வடிவைப் பயன்படுத்துகிறது. எதிர்காலத்தைச் சேர்க்காமல் மூலத்தின் காலநிலைத் தெளிவின்மையை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிண்ணம்’ மற்றும் ‘திருமுழுக்கு’ என்ற வேதாகம உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; இயல்பான தமிழுக்காக முதல் உருவகம் ‘கிண்ணத்திலிருந்து குடித்தல்’ என்றும், இரண்டாவது ‘திருமுழுக்கைப் பெறுதல்’ என்றும் அமைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
