translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நேர்கூற்று நடை. ‘கடைப்பிடித்து வந்திருக்கிறேன்’ என்பது நீடித்த வாழ்க்கை நடத்தையை இயல்பாகக் காட்டுகிறது; பேச்சாளரின் கூற்றை உரை உறுதிப்படுத்துவதாகவோ மறுப்பதாகவோ மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
