  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: ta
  text: அவன் அவரிடம், “போதகரே, இவை எல்லாவற்றையும் என் இளமை முதல் கடைப்பிடித்து வந்திருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: என்றான்
  rationale: இது உரையைக் குறிக்கும் இயல்பான கதைநடை வினைச்சொல்; தமிழில் நேர்கூற்றுக்குப் பின் வரும் ‘என்றான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: διδάσκαλος என்பது கற்பிப்பவரைக் குறிக்கிறது. மரியாதை விளியைப் பாதுகாக்க ‘போதகரே’ பயன்படுத்தப்பட்டுள்ளது; ‘எஜமானரே’ என்பது மூலச்சொல்லில் இல்லாத அதிகாரப் பொருளை வலுப்படுத்தக்கூடும்.
- source_word: ταῦτα πάντα
  choice: இவை எல்லாவற்றையும்
  rationale: முன்பு குறிப்பிடப்பட்ட கட்டளைகள் அனைத்தையும் சுட்டும் செயப்படுபொருளாகத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐφυλαξάμην
  choice: கடைப்பிடித்து வந்திருக்கிறேன்
  rationale: கட்டளைகளைப் பற்றிய சூழலில் φυλάσσω என்பதன் ‘கடைப்பிடி’ என்ற பொருளைத் தருகிறது; இளமை தொடங்கி தற்போதுவரையிலான நடத்தையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ νεότητός μου
  choice: என் இளமை முதல்
  rationale: ἐκ உடன் வரும் காலத் தொடக்கப் பொருளைப் பாதுகாக்கிறது; νεότης என்பதைக் ‘குழந்தைப் பருவம்’ என்று மிகக் குறிப்பாக மாற்றாமல் ‘இளமை’ என வழங்குகிறது.
- source_word: ὁ δὲ
  choice: அவன்
  rationale: δέ இங்கு மென்மையான கதைநடை இணைப்பாக உள்ளது. தமிழில் தனியே ‘ஆனால்’ அல்லது ‘அப்பொழுது’ சேர்ப்பது தேவையற்ற எதிர்மறையையோ கால வலியுறுத்தலையோ உருவாக்கலாம்; வாக்கியத் தொடரில் ‘அவன்’ போதுமானது.
