  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களிடம், “உங்கள் இருதயக் கடினத்தினால்[c] அவர்[a] உங்களுக்காக இந்தக் கட்டளையை[b] எழுதினார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மோசே.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘ஆணையை’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கடின இருதயத்தினால்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: உரையாடலில் பரிசேயர்கள் மோசேயைச் சுட்டிக்காட்டியதற்கு இயேசு அளிக்கும் பதிலின் மென்மையான எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: Πρὸς
  choice: …இனால்தான்
  rationale: இங்கு πρός மற்றும் வேற்றுமை உருபு அவர்களுடைய நிலையை முன்னிட்டு அல்லது அதனால் இந்தக் கட்டளை எழுதப்பட்டது என்ற காரணத் தொடர்பைக் காட்டுகின்றன; தமிழில் இயல்பாக காரணத்தைத் தெரிவிக்கிறது.
- source_word: σκληροκαρδίαν
  choice: இருதயக் கடினம்
  rationale: கிரேக்கச் சொல்லிலுள்ள இருதயம்–கடினம் என்ற வேதாகம உருவகத்தைத் தக்கவைத்து, வெறும் ‘பிடிவாதம்’ என்று பொருளைச் சுருக்காமல் வழங்குகிறது.
- source_word: ἔγραψεν
  choice: அவர் … எழுதிக் கொடுத்தார்
  rationale: கிரேக்கத்தில் எழுவாய் பெயரால் மீண்டும் குறிப்பிடப்படாமல் ஒருமையில் மறைமுகமாக உள்ளது; முந்தைய வசனத்தின் மோசேயைக் குறிக்கும் ‘அவர்’ அதைத் தக்கவைக்கிறது. ‘எழுதிக் கொடுத்தார்’ என்பது ὑμῖν என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐντολήν
  choice: கட்டளை
  rationale: அதிகாரப்பூர்வமான ஆணையைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் மோசேயின் சட்டச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: ταύτην
  choice: இந்த
  rationale: விவாதிக்கப்படும் குறிப்பிட்ட கட்டளையைச் சுட்டும் அண்மைச் சுட்டுப்பெயரடையை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘எழுதினார்’ என்பதன் எழுவாயாக மோசேயின் பெயரை வெளிப்படையாகச் சேர்ப்பதா
  choice: முந்தைய வசனத்திலுள்ள மோசேயைக் குறிக்கும் ‘அவர்’ என்பதைப் பயன்படுத்துதல்
  alternative: ‘மோசே … எழுதிக் கொடுத்தார்’ என்று பெயரை வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க மூலத்தில் இவ்வசனத்தில் மோசேயின் பெயர் மீண்டும் வரவில்லை. மறைமுக எழுவாயை ‘அவர்’ எனத் தக்கவைப்பது உரையோட்டத்தையும் மூலத்தின் வெளிப்பாட்டளவையும் பாதுகாக்கிறது.
- issue: σκληροκαρδίαν என்பதிலுள்ள வேதாகம-இறையியல் உருவகத்தை எவ்வாறு காப்பது
  choice: ‘இருதயக் கடினம்’
  alternative: ‘கடின இருதயம்’ அல்லது ‘பிடிவாதம்’
  rationale: ‘இருதயக் கடினம்’ என்பது மூலத்தின் உடல்-மன உருவகத்தைத் தக்கவைக்கிறது; ‘பிடிவாதம்’ என மாற்றுவது அதன் பொருள் பரப்பையும் இறையியல் அழுத்தத்தையும் குறைக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இருதயம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது. கிரேக்கச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், மேற்கோளை முன்வைத்து பின்னர் ‘என்றார்’ என முடிக்கும் இயல்பான தமிழ் உரையாடல் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
