id: MRK.10.9
reference: Mark 10:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: ta
  text: ஆகவே, கடவுள் ஒன்றாக இணைத்ததை எந்த மனிதரும் பிரிக்கக் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: இணைத்ததை
  rationale: உறவுப்பெயரின் நடுநிலை ஒருமை வடிவம், முந்தைய வசனத்தில் கூறப்பட்ட திருமண ஒன்றிப்பை மொத்தமாகச் சுட்டுகிறது. தமிழில் வினையெச்சத்துடன் அமைந்த ‘இணைத்ததை’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் திருமணத்தைப் பற்றிக் கூறப்பட்டதிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: வாக்கியத்தின் எழுவாயை நவீனத் தரமான தமிழில் நேரடியாகத் தருகிறது.
- source_word: συνέζευξεν
  choice: ஒன்றாக இணைத்ததை
  rationale: συζεύγνυμι என்பதிலுள்ள இரண்டை ஒன்றாகப் பிணைக்கும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. இறந்தகாலத் தெய்வீகச் செயலை ‘இணைத்த’ காக்கிறது; ‘ஒன்றாக’ என்பது கூட்டு/பிணைப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπος
  choice: எந்த மனிதரும்
  rationale: ἄνθρωπος இங்கு பாலினத்தால் வரையறுக்கப்படாத பொதுப்பொருளில் உள்ளது. தடை வாக்கியத்தில் ‘எந்த மனிதரும்’ என்பது ‘ஒருவர்கூட’ என்ற பொதுவான ஒருமை வலிமையை இயல்பாகத் தருகிறது.
- source_word: μὴ χωριζέτω
  choice: பிரிக்கக் கூடாது
  rationale: μή உடன் வரும் நிகழ்கால மூன்றாம் நபர் கட்டளை வடிவத்தின் தடையைக் காலத்திற்கேற்ற தெளிவான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: திருமண ஒன்றிப்பில் கடவுளின் செயலும் மனிதத் தலையீட்டுக்கான தடையும்
  choice: ‘கடவுள் ஒன்றாக இணைத்ததை எந்த மனிதரும் பிரிக்கக் கூடாது’
  alternative: ‘கடவுள் இணைத்ததை மனிதன் பிரிக்காதிருக்கட்டும்’
  rationale: கிரேக்கத்தின் கடவுள்–மனிதர் எதிர்நிலையையும் கட்டளையின் வலிமையையும் காக்கிறது. அதே நேரத்தில் ἄνθρωπος என்பதைக் குறிப்பாக ஆணுக்கு மட்டும் உரியதாகத் தவறாகப் புரிந்துகொள்ளாதவாறு அதன் பொதுமனிதப் பொருளைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். சொற்சொற் கடினத்தன்மையைத் தவிர்த்து, மூலத்தின் தர்க்க முடிவு, தெய்வீகச் செயல், பொதுவான மனிதத் தடை ஆகியவை காக்கப்பட்டுள்ளன.
