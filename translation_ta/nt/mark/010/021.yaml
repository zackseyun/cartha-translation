reference: Mark 10:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ta
  text: இயேசு அவனை உற்றுநோக்கி, அவனை நேசித்து, அவனிடம், “உனக்கு ஒன்று குறைவாக இருக்கிறது. நீ போய், உன்னிடம் இருப்பவற்றை[a] விற்று ஏழைகளுக்குக் கொடு; பரலோகத்தில் உனக்குப் பொக்கிஷம் கிடைக்கும்; வா, என்னைப் பின்பற்று” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னிடம் உள்ள அனைத்தையும்.” ὅσα ἔχεις என்ற கிரேக்கச் சொற்றொடரை “உன்னிடம் இருப்பவற்றை” என்றும் “உன்னிடம் உள்ள அனைத்தையும்” என்றும் மொழிபெயர்க்கலாம்; சூழல் அவனுடைய உடைமைகள் முழுவதையும் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: உற்றுப் பார்த்து
  rationale: இது அவனை நோக்கிச் செலுத்தப்பட்ட கவனமான பார்வையைக் குறிக்கிறது; கிரேக்கச் சொல்லின் வலிமையை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἠγάπησεν αὐτόν
  choice: அவனிடம் அன்புகூர்ந்து
  rationale: இயேசு அவன்மீது கொண்ட உண்மையான அன்பை நேரடியாகக் கூறுகிறது; அதை வெறும் கனிவாகக் குறைக்கவோ பிற்கால இறையியல் பொருளை ஏற்றவோ இல்லை.
- source_word: Ἕν σε ὑστερεῖ
  choice: உனக்கு ஒன்று குறைவாக இருக்கிறது
  rationale: நடுநிலை ஒருமையான Ἕν என்பதையும், தற்போது உள்ள குறையைச் சுட்டும் ὑστερεῖ என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὅσα ἔχεις
  choice: உன்னிடம் இருப்பவற்றை
  rationale: அவனுடைய உடைமைகளைச் சுட்டும் கிரேக்க உறவுத்தொடரை இயல்பாகத் தருகிறது; சூழலில் இது முழுமையான பரப்பைக் கொண்டுள்ளது. மாற்று வெளிப்பாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: δὸς τοῖς πτωχοῖς
  choice: ஏழைகளுக்குக் கொடு
  rationale: πτωχοῖς குறிக்கும் ஏழை மக்களை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: பரலோகத்தில் உனக்குப் பொக்கிஷம்
  rationale: வானுலகில் இருக்கும் பொக்கிஷம் அல்லது வெகுமதி என்ற உருவகத்தை விளக்கிப் பரவலாக்காமல் பாதுகாக்கிறது.
- source_word: δεῦρο ἀκολούθει μοι
  choice: பின்பு வந்து என்னைப் பின்பற்று
  rationale: δεῦρο என்பதன் வருகைக்கான அழைப்பையும் ἀκολούθει என்பதன் சீடத்துவ அழைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது; தொடர்ச்சியான பின்பற்றுதல் சூழலிலேயே வெளிப்படுகிறது.
theological_decisions:
- issue: அந்த மனிதன்மீது இயேசு கொண்ட அன்பின் பொருள்
  choice: 'உண்மையான அன்பாக நேரடியாக மொழிபெயர்க்கப்பட்டது: “அவனிடம் அன்புகூர்ந்து.”'
  alternative: வெறும் வெளிப்புறக் கனிவாகவோ, தொழில்நுட்பமான உடன்படிக்கை/தேர்ந்தெடுக்கும் அன்பாகவோ விளக்குதல்.
  rationale: ἠγάπησεν αὐτόν என்று வசனம் வெளிப்படையாகக் கூறுகிறது. அதன் உணர்ச்சி மற்றும் இறையியல் இழுவிசையை மொழிபெயர்ப்பு குறைக்கவோ ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் அடைக்கவோ கூடாது.
- issue: உடைமைகள் குறித்த கட்டளையின் பரப்பு
  choice: “உன்னிடம் இருப்பவற்றை” என்று மொழிபெயர்த்து, சூழலில் முழு உடைமைகளையும் உள்ளடக்கும் வலிமையைப் பாதுகாத்தல்.
  alternative: விளக்கமாக “உனக்குச் சொந்தமான எல்லாவற்றையும்” என்று விரிவாக்குதல் அல்லது பொதுவான தாராள மனப்பான்மைக்கான அழைப்பாக மென்மைப்படுத்துதல்.
  rationale: ὅσα ἔχεις என்பது சூழலில் அவனுடைய உடைமைகளை முழுமையாகச் சுட்டுகிறது. தமிழ் வாசகம் கட்டளையின் வலிமையைத் தக்கவைத்து, சொற்றொடரின் இயல்பான பரப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைக் கொண்டுள்ளது. இயேசுவைப் பற்றிய உரையில் மரியாதைப் பன்மை வினைமுற்றும், அந்த மனிதனிடம் கூறப்படும் நேரடி கட்டளைகளில் ஒருமை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன.
