  to: இயேசு அவனை உற்றுநோக்கி, அவனை நேசித்து, அவனிடம், “உனக்கு ஒன்று குறைவாக இருக்கிறது. நீ போய், உன்னிடம் இருப்பவற்றை[a] விற்று ஏழைகளுக்குக் கொடு; பரலோகத்தில் உனக்குப் பொக்கிஷம் கிடைக்கும்; வா, என்னைப் பின்பற்று” என்று கூறினார்.
  rationale: The revision corrects the object relation of Jesus' love, removes temporal additions that exceed the Greek coordination, and uses a direct idiomatic Tamil invitation for δεῦρο. It otherwise retains the draft's faithful wording and the footnoted lexical ambiguity concerning ὅσα ἔχεις.
