translation_notes:
  register: நவீனத் தரத் தமிழில், எளிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமையான ‘நீர்/உம்மிடம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நேரடியான, ஓரளவு துணிச்சலான கோரிக்கை மென்மைப்படுத்தப்படவில்லை.
