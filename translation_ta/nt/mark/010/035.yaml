review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the approach to Jesus, the identification of James and John as Zebedee's sons, their address as teacher, and the force of their sweeping request. However, “மக்களான” is less exact than “மகன்களான” for υἱοί, which specifically means sons.
  naturalness: The narrative is generally natural modern Tamil. “அதை நீர் எங்களுக்குச் செய்ய வேண்டும் என்று விரும்புகிறோம்” is understandable but somewhat heavy; a modest recasting gives a more idiomatic direct request while retaining its demanding tone.
  terminology: “போதகரே” is an appropriate modern Tamil rendering of Διδάσκαλε. The respectful singular forms “உம்மிடம்/நீர்” are consistent and suitable. “செபெதேயுவின் மகன்களான” accurately preserves the kinship term.
  issues:
  - severity: low
    issue: “மக்களான” is used for οἱ υἱοὶ.
    rationale: மக்கள் can mean children or people generally, whereas Greek υἱοί explicitly identifies James and John as sons. “மகன்களான” is more precise.
  - severity: low
    issue: The final request is slightly stiff in Tamil.
    rationale: Recasting it as “நாங்கள் உம்மிடம் எதைக் கேட்டாலும், அதை நீர் எங்களுக்காகச் செய்ய வேண்டும் என்று விரும்புகிறோம்” retains the Greek’s broad ‘whatever,’ the request directed to Jesus, and the direct force of θέλομεν.
