source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: ta
  text: செபெதேயுவின் மகன்களான யாக்கோபும் யோவானும் அவரிடம் வந்தார்கள்[a]. அவர்கள் அவரிடம், “போதகரே, நாங்கள் உம்மிடம் எதைக் கேட்டாலும், அதை நீர் எங்களுக்காகச் செய்ய வேண்டும் என்று விரும்புகிறோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை அணுகினார்கள்.” கிரேக்க வினைச்சொல் இயேசுவை நோக்கிச் செல்லும் அசைவை இன்னும் நேரடியாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται
  choice: அவரிடம் வந்தார்கள்
  rationale: இவ்வினைச்சொல் இயேசுவை நோக்கிச் செல்லும் அசைவைக் குறிக்கிறது. வரலாற்று நிகழ்காலத்தைத் தமிழ்க் கதைநடைக்கு இயல்பான இறந்தகாலத்தில் மொழிபெயர்த்துள்ளோம்; ‘அணுகினார்கள்’ என்பது சாத்தியமான நேரடி மாற்று.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: செபெதேயுவின் மக்களான
  rationale: யாக்கோபையும் யோவானையும் அடையாளப்படுத்தும் கிரேக்க மொழியின் விளக்கத் தொடரைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: λέγοντες αὐτῷ
  choice: அவர்கள் அவரிடம் ... என்றார்கள்
  rationale: கிரேக்கப் பங்கேற்புவினையை இயல்பான தமிழ்க் கதைநடையில் முற்றுவினையாக மாற்றுகிறது; ‘அவரிடம்’ என்பதால் பேச்சின் இலக்கும் பாதுகாக்கப்படுகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரைக் குறிக்கும் அழைப்புமுறையைத் துல்லியமாகவும் தமிழ்க் கிறிஸ்தவ வாசகர்களுக்குப் புரியும் இயல்பான வடிவிலும் தருகிறது.
- source_word: θέλομεν
  choice: விரும்புகிறோம்
  rationale: கோரிக்கையின் நேரடியான விருப்பத்தை வெளிப்படுத்துகிறது; இதை அதிக மரியாதையான வேண்டுகோளாக மென்மைப்படுத்தவில்லை.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: நாங்கள் உம்மிடம் எதைக் கேட்டாலும்
  rationale: ὃ ἐάν தரும் வரையறுக்கப்படாத ‘எதுவானாலும்’ என்ற பொருளையும், இயேசுவிடம் கேட்பதையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ποιήσῃς ἡμῖν
  choice: அதை நீர் எங்களுக்குச் செய்ய வேண்டும்
  rationale: ποιέω என்பதன் பொதுவான ‘செய்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘அருள வேண்டும்’ அல்லது ‘கொடுக்க வேண்டும்’ என்று உட்கருத்தை மிகையாக விளக்கவில்லை.
