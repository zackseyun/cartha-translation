revisions:
- from: அவர் அமைதியாக இருக்கும்படி பலர் அவரைக் கடிந்துகொண்டிருந்தார்கள். ஆனால் அவரோ இன்னும் அதிகமாக, “தாவீதின் மகனே[a], என்மேல் இரக்கம் காட்டும்!” என்று கூக்குரலிட்டுக்கொண்டிருந்தார்.
  to: அவர் அமைதியாக இருக்கும்படி பலர் அவரைக் கடிந்துகொண்டிருந்தார்கள். ஆனால் அவரோ மேலும் மேலும், “தாவீதின் மகனே[a], என்மேல் இரக்கம் காட்டும்!” என்று கூக்குரலிட்டுக்கொண்டிருந்தார்.
