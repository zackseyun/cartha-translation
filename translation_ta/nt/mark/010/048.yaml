source:
  edition: SBLGNT
  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ta
  text: அவர் அமைதியாக இருக்கும்படி பலர் அவரைக் கடிந்துகொண்டிருந்தார்கள். ஆனால் அவரோ மேலும் மேலும், “தாவீதின் மகனே[a], என்மேல் இரக்கம் காட்டும்!” என்று கூக்குரலிட்டுக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின் மகன்” என்பது அரசருக்குரிய மேசியப் பட்டம். இதன் பொருளை “மேசியா” என்றும் வெளிப்படுத்தலாம்; ஆனால் இங்கே கிரேக்க மூலத்தின் சொல் வடிவமே பாதுகாக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: கடிந்துகொண்டிருந்தார்கள்
  rationale: வினைச்சொல்லின் வலிமையையும், இறந்தகால நிறைவுறா வடிவம் சுட்டும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நடந்த செயலையும் வெளிப்படுத்துகிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘கூட்டத்தினர்’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: ἵνα σιωπήσῃ
  choice: அவர் அமைதியாக இருக்கும்படி
  rationale: அவரைக் கடிந்துகொண்டதன் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πολλῷ μᾶλλον
  choice: இன்னும் அதிகமாக
  rationale: ஒப்பீட்டு வலியுறுத்தலைப் பாதுகாக்கிறது; கிரேக்கம் வெளிப்படையாகக் கூறாத ‘இன்னும் உரத்த குரலில்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ἔκραζεν
  choice: கூக்குரலிட்டுக்கொண்டிருந்தார்
  rationale: அவசரமும் வலிமையும் நிறைந்த அழைப்பையும், தொடர்ந்த செயலைக் குறிக்கும் இறந்தகால நிறைவுறா வடிவத்தையும் வெளிப்படுத்துகிறது.
- source_word: Υἱὲ Δαυίδ
  choice: தாவீதின் மகனே
  rationale: அரச-மேசியப் பொருள் கொண்ட பட்டத்தை அதன் நேரடி சொல் வடிவிலேயே பாதுகாக்கிறது.
- source_word: ἐλέησόν με
  choice: என்மேல் இரக்கம் காட்டும்
  rationale: உதவி வேண்டி முன்வைக்கப்படும் நேரடியான, தீவிரமான விண்ணப்பத்தை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ‘தாவீதின் மகன்’ என்ற பட்டத்தின் மேசியப் பொருள்
  choice: பட்டத்தை ‘தாவீதின் மகனே’ என்று அப்படியே வைத்தல்
  alternative: ‘மேசியாவே’ என்று அதன் பொருளை விளக்கி மொழிபெயர்த்தல்
  rationale: கிரேக்க மூலம் Υἱὲ Δαυίδ என்ற பட்டத்தையே பயன்படுத்துகிறது. அதை விளக்கச் சொல்லால் மாற்றாமல் மொழிபெயர்ப்பது மூலச் சொல் வடிவத்தையும் அதன் அரச-மேசிய ஒலிப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதே நேரத்தில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு இறந்தகால நிறைவுறா வினைகளின் தொடர்ச்சித் தன்மை ‘கடிந்துகொண்டிருந்தார்கள்’, ‘கூக்குரலிட்டுக்கொண்டிருந்தார்’ என்பவற்றால் பாதுகாக்கப்பட்டுள்ளது.
