  source_fidelity: 'திருத்தம் தேவை: வரைவு μαστιγώσουσιν (‘சாட்டையால் அடிப்பார்கள்’) மற்றும் ἀποκτενοῦσιν (‘கொல்வார்கள்’) என்ற இரு தொடர்ச்சியான வினைகளை ‘சாட்டையால் அடித்துக் கொல்வார்கள்’ என ஒரே கூட்டுவினையாக இணைக்கிறது. இதனால் சாட்டையடி கொலையின் முறையாகக் குறிப்பிடப்படுகிறது; மூலத்தில் உள்ள தனித்தனி செயல்கள் தெளிவிழக்கின்றன.'
  naturalness: ‘அவரை ஏளனம் செய்வார்கள்; அவர்மேல் துப்புவார்கள்; அவரைச் சாட்டையால் அடிப்பார்கள்; அவரைக் கொல்வார்கள்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘உயிர்த்தெழுவார்’ கண்ணியமான, பொதுவழக்கில் புரியக்கூடிய சொல்.
  terminology: ‘ஏளனம் செய்வார்கள்,’ ‘அவர்மேல் துப்புவார்கள்,’ ‘சாட்டையால் அடிப்பார்கள்,’ ‘கொல்வார்கள்,’ ‘மூன்று நாட்களுக்குப் பிறகு,’ ‘உயிர்த்தெழுவார்’ ஆகியவை முறையே கிரேக்கத்தின் பொருளையும் வரிசையையும் பாதுகாக்கின்றன. ἀναστήσεται-க்கு செயப்பாட்டு வடிவத்தைத் திணிக்காமல் ‘உயிர்த்தெழுவார்’ எனத் தருவது பொருத்தம்.
