source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: ta
  text: அவர்கள் அவரை ஏளனம் செய்வார்கள்; அவர்மேல் துப்புவார்கள்; அவரைச் சாட்டையால் அடிப்பார்கள்; அவரைக் கொல்வார்கள். மூன்று நாட்களுக்குப் பிறகு[a] அவர் உயிர்த்தெழுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மூன்று நாட்களில்.’ மாற்குவின் கிரேக்க வாசகம் ‘மூன்று நாட்களுக்குப் பிறகு’ என்று உள்ளது; வேறு பகுதிகள் இதே காலத்தைக் ‘மூன்றாம் நாளில்’ என்று குறிப்பிடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: ஏளனம் செய்வார்கள்
  rationale: இச்சொல் இகழ்ச்சியுடன் கேலி செய்வதைக் குறிக்கிறது. ‘ஏளனம் செய்வார்கள்’ என்பது பகைமையும் அவமதிப்பும் கலந்த செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: அவர்மேல் துப்புவார்கள்
  rationale: இந்தக் கட்டமைப்பு அவரை நோக்கி அவமதிக்கும் விதத்தில் துப்புவதைக் குறிக்கிறது. ‘அவர்மேல் துப்புவார்கள்’ என்பது செயல் அவர்மீது நிகழ்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μαστιγώσουσιν
  choice: சாட்டையால் அடிப்பார்கள்
  rationale: இவ்வினை நீதித்தண்டனையாகச் சாட்டையால் அடிப்பதைக் குறிக்கிறது. ‘சாட்டையால் அடிப்பார்கள்’ என்பது பழமையான அல்லது அரிதான சொல்லைப் பயன்படுத்தாமல் செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: ἀποκτενοῦσιν
  choice: கொல்வார்கள்
  rationale: கிரேக்க வினை நேரடியாகக் ‘கொல்லுதல்’ என்று பொருள்படுகிறது. சட்டரீதியான தண்டனை அல்லது ஒழுக்க மதிப்பீடு போன்ற கூடுதல் நுணுக்கங்களைச் சேர்க்காமல் ‘கொல்வார்கள்’ அதன் எளிய பொருளைப் பாதுகாக்கிறது.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: மூன்று நாட்களுக்குப் பிறகு
  rationale: வேற்றுமை உருபுடன் வரும் μετά இங்கு வழக்கமாக ‘பிறகு’ என்று பொருள்படும். இணை நிகழ்வுரைகளோடு ஒத்திசைக்காமல் மாற்குவின் சொற்றொடர் நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἀναστήσεται
  choice: உயிர்த்தெழுவார்
  rationale: எதிர்கால இடைநிலை வடிவம் இங்கு தன்வினைப் பொருளில் எழுவதைக் குறிக்கிறது. உயிர்த்தெழுதலைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ் சொல்லாக இது அமைகிறது; ‘மீண்டும்’ என்ற பொருள் மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த வினைவடிவம்
  choice: அவர் உயிர்த்தெழுவார்
  alternative: அவர் உயிர்ப்பிக்கப்படுவார்; அவர் மீண்டும் உயிர்த்தெழுவார்
  rationale: ἀναστήσεται என்பது எதிர்கால இடைநிலை வடிவம்; எனவே தன்வினையாக ‘உயிர்த்தெழுவார்’ என்பது பொருத்தமானது. ‘உயிர்ப்பிக்கப்படுவார்’ என்பது மூல வடிவத்தில் இல்லாத செயப்பாட்டு நுணுக்கத்தை முன்வைக்கும்; ‘மீண்டும்’ என்பதும் வெளிப்படையாக இல்லை. இவ்வாறு பிற புதிய ஏற்பாட்டுப் பகுதிகளின் மொழியை இங்கு திணிக்காமல், இவ்வசனத்தின் சொல்வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான கொடுமைகளைத் தெளிவுபடுத்த அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன. காலக் குறிப்பின் உண்மையான சொற்றொடர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, தொடர்புடைய மாற்று வெளிப்பாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
