  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: ta
  text: அவர்கள் மிகவும் வியப்படைந்து, “அப்படியானால் யார் இரட்சிக்கப்பட முடியும்?” என்று ஒருவருக்கொருவர் கூறினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: அவர்கள்
  rationale: முந்தைய சூழலில் உள்ள சீடர்களைக் குறிக்கிறது. δέ குறிக்கும் தொடர்ச்சியைத் தமிழில் தனிச் சொல் சேர்க்காமல் இயல்பான வாக்கியத் தொடரால் வெளிப்படுத்தலாம்.
- source_word: περισσῶς
  choice: இன்னும் மிகுந்த
  rationale: இது அவர்களுடைய வியப்பின் தீவிரம் அதிகரித்ததை வலியுறுத்துகிறது; சூழலுக்கு ஏற்றவாறு ‘all the more’ என்ற நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: ἐξεπλήσσοντο
  choice: வியப்படைந்து
  rationale: வலுவான அதிர்ச்சி கலந்த வியப்பைக் குறிக்கிறது. தொடர்ந்த அல்லது வெளிப்பட்டுக் கொண்டிருந்த எதிர்வினை, இணை வினையெச்ச அமைப்பிலும் பிரதான வினையிலும் இயல்பாக வெளிப்படுகிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: சொல்லப்பட்டவை ஒரு கேள்வியாக இருப்பதால், தமிழில் ‘கேட்டார்கள்’ என்பது இயல்பானது; பேசுதல் வியப்புடன் நிகழ்ந்ததையும் அமைப்பு காட்டுகிறது.
- source_word: πρὸς ἑαυτούς
  choice: ஒருவருக்கொருவர்
  rationale: பன்மை உரையாடல் சூழலில் பரஸ்பரமாகப் பேசுவதே முதன்மையான பொருள். ‘தங்களுக்குள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Καὶ
  choice: அப்படியானால்
  rationale: இங்கு καί முந்தைய கூற்றிலிருந்து எழும் முடிவு அல்லது விளைவைக் குறிக்கிறது; தமிழ் கேள்வியில் ‘அப்படியானால்’ அந்தத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τίς
  choice: யார்
  rationale: எந்த மனிதர் மீட்கப்பட இயலும் என்ற பொதுவான வினாவை நேரடியாகக் காட்டுகிறது.
- source_word: δύναται
  choice: முடியும்
  rationale: திறன் அல்லது சாத்தியத்தைக் குறிக்கும் வினையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: σωθῆναι
  choice: மீட்கப்பட
  rationale: தேவனுடைய இரட்சிக்கும் செயலால் விடுவிக்கப்படுதல் என்ற வேதாகமப் பொருளைத் தக்கவைக்கிறது; வெறும் உடனடி ஆபத்திலிருந்து தப்புதல் எனக் குறுக்குவதில்லை.
theological_decisions:
- issue: சூழலில் σωθῆναι என்பதன் இரட்சிப்பு சார்ந்த பொருள்
  choice: மீட்கப்பட
  alternative: இரட்சிக்கப்பட / காப்பாற்றப்பட
  rationale: தேவனுடைய அரசில் நுழைவது குறித்த சுற்றியுள்ள உரையாடலில், இது தற்காலிக ஆபத்திலிருந்து காப்பாற்றப்படுவதைவிட விரிவான இரட்சிப்பு நுணுக்கம் உடையது. ‘மீட்கப்பட’ என்பது அந்த நிறையைத் தக்கவைத்து, இன்றைய பொதுவாசகருக்கும் புரியும் சொல்லாக உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியும், ஆனால் கண்ணியமான நடை. கேள்வியின் வியப்பும் இயலாமை உணர்வும் காக்கப்பட்டுள்ளன.
