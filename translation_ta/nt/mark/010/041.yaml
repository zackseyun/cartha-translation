  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: ta
  text: அதைக் கேட்ட பத்துப் பேரும், யாக்கோபின்மீதும் யோவான்மீதும்[a] சினங்கொள்ளத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாக்கோபையும் யோவானையும் குறித்து’ அல்லது ‘யாக்கோபு, யோவான் காரணமாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க முன்னிடைச்சொல், அவர்களே சினத்தின் இலக்கு என்பதையோ அவர்களே அதற்கான காரணம் என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -உம்
  rationale: கிரேக்க இணைப்புச்சொல்லின் தொடர்ச்சியைத் தமிழில் எழுவாயோடு இணையும் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκούσαντες
  choice: அதைக் கேட்ட
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தை இயல்பான தமிழில் தருகிறது; சூழலால் புரிந்துகொள்ளப்படும் செயப்படுபொருள் ‘அதை’ என வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: οἱ δέκα
  choice: பத்துப் பேர்
  rationale: மூலத்தின் ‘பத்துப் பேர்’ என்பதையே காக்கிறது; ‘மற்ற சீடர்கள்’ போன்ற சூழல் விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἤρξαντο
  choice: தொடங்கினார்கள்
  rationale: அவர்களுடைய எதிர்வினை அப்போது ஆரம்பமானது என்ற வினையின் தொடக்கநிலையைப் பாதுகாக்கிறது.
- source_word: ἀγανακτεῖν
  choice: சினங்கொள்ள
  rationale: வெறும் வருத்தத்தைவிட வலுவான கோபத்தையும் அதிருப்தியையும் குறிக்கும்; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: யாக்கோபின்மீதும் யோவான்மீதும்
  rationale: சினம் அந்த இருவரை நோக்கியது என்ற சூழலுக்கு ஏற்ற இயல்பான தமிழ் வடிவம்; περί அவர்களைச் சினத்தின் பொருளாகவோ காரணமாகவோ குறிக்கக்கூடிய நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰακώβου
  choice: யாக்கோபு
  rationale: Ἰάκωβος என்ற பெயருக்கான வழக்கமான தமிழ் வேதாகமப் பெயர்ப்பு.
- source_word: Ἰωάννου
  choice: யோவான்
  rationale: Ἰωάννης என்ற பெயருக்கான வழக்கமான தமிழ் வேதாகமப் பெயர்ப்பு.
