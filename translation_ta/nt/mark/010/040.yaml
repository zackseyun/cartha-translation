source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: ta
  text: ஆனால் என் வலப்பக்கத்திலோ இடப்பக்கத்திலோ அமர இடமளிப்பது எனக்குரியது அல்ல[a]; மாறாக, அது யாருக்காக ஆயத்தம் செய்யப்பட்டிருக்கிறதோ அவர்களுக்கே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை வழங்குவது எனக்குரியது அல்ல.”
    reason: οὐκ ἔστιν ἐμὸν δοῦναι என்பதற்கு நெருக்கமான மாற்று; ‘இடமளிப்பது’ என்பதற்குப் பதிலாக மூலத்தின் பொதுவான ‘கொடுப்பது/வழங்குவது’ என்ற வினையைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: அமர
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் கிரேக்க வினையெச்சத்தைத் தமிழில் இயல்பான நோக்க வினையெச்சமாக மொழிபெயர்க்கிறது; அமர்தல் என்ற செயற்பொருளைத் தக்கவைக்கிறது.
- source_word: ἐκ δεξιῶν μου
  choice: என் வலப்பக்கத்தில்
  rationale: ஒருவரின் வலது புறத்திலுள்ள நிலையைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கை’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἢ ἐξ εὐωνύμων
  choice: அல்லது இடப்பக்கத்தில்
  rationale: வலப்பக்கம் என்பதற்கு இணையான அமைப்பில் இடது புறத்தைக் குறிக்கிறது. ‘-லோ ... -லோ’ என்ற தமிழ் இணைப்பு மாற்றுத் தேர்வின் சமநிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: இடமளிப்பது எனக்குரியது அல்ல
  rationale: ‘கொடுப்பது எனக்குரியது அல்ல’ என்ற மூலத்தின் கருத்தைத் தக்கவைக்கிறது. தமிழில் அமர்வதோடு ‘கொடு’ என்பதை இயல்பாக இணைக்க ‘இடமளிப்பது’ பயன்படுத்தப்பட்டுள்ளது; அதிகாரத்தின் தன்மையை மேலதிகமாக விளக்கவில்லை.
- source_word: ἀλλ’ οἷς
  choice: அவர்களுக்கே உரியது
  rationale: கிரேக்கத்தில் முந்தைய வாக்கியத்திலிருந்து பொருள் நிரப்பப்படும் சுருக்கமான அமைப்பைத் தமிழில் தெளிவான வாக்கியமாக்குகிறது; ‘-க்கே’ எதிர்மறை வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: ἡτοίμασται
  choice: ஆயத்தம் செய்யப்பட்டிருக்கிறது
  rationale: நிறைவேற்றப்பட்ட ஆயத்தத்தின் தொடரும் விளைவை கிரேக்க நிறைவு காலச் செயப்பாட்டு வடிவத்துக்கு ஏற்றபடி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்று அவரது அதிகாரத்தை முற்றிலும் மறுக்கிறதா அல்லது உடனடி சூழலில் மட்டும் வரையறுக்கிறதா
  choice: ‘எனக்குரியது அல்ல’ என்று எந்த விளக்கத் தகுதியும் சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தந்தையின் விருப்பத்திற்கு அப்பாற்பட்டு நான் வழங்குவதற்குரியது அல்ல’
  rationale: கிரேக்க வாசகம் வரம்பைச் சொல்கிறது; ஆனால் அதற்கான இறையியல் விளக்கத்தை இவ்வசனத்திலேயே கூறவில்லை. தந்தையின் விருப்பம் பற்றிய விளக்கத்தைச் சேர்ப்பது மூலத்தில் இல்லாத இணக்கப்படுத்தலாகிவிடும்; ஆகவே உரையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ἀλλ’ οἷς என்ற சுருக்கமான தொடரில் விடுபட்டுள்ள கருத்தை எவ்வாறு நிரப்புவது
  choice: ‘அவர்களுக்கே உரியது’ என்று தமிழில் வாக்கியத்தை நிறைவு செய்தல்
  alternative: ‘அவர்களுக்கே வழங்கப்படும்’
  rationale: ‘வழங்கப்படும்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத எதிர்காலச் செயப்பாட்டைச் சேர்க்கும். ‘உரியது’ என்பது ஆயத்தம் செய்யப்பட்டவர்களுக்கான தனிப்பட்ட ஒதுக்கீட்டை இயல்பாகக் காட்டி, யார் ஆயத்தப்படுத்தினார் என்பதையும் கூறாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘வலப்பக்கத்திலோ இடப்பக்கத்திலோ’ என்ற இணை அமைப்பு மூலத்தின் சமநிலையைப் பேணுகிறது. ‘ஆயத்தம்’ என்பது வேதாகமச் சூழலுக்கு ஏற்ற, இன்னும் பரவலாகப் புரியக்கூடிய சொல்லாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
