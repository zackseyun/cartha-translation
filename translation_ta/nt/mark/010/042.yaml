reference: Mark 10:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: ta
  text: இயேசு அவர்களைத் தம்மிடம் அழைத்து அவர்களிடம், “பிற இனத்தாரை[a] ஆளுகிறவர்களாகக் கருதப்படுபவர்கள்[b] அவர்களை அடக்கி ஆளுகிறார்கள்; அவர்களுள் உயர்ந்தவர்கள் அவர்கள்மேல் அதிகாரம் செலுத்துகிறார்கள் என்பது உங்களுக்குத் தெரியும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆளுகிறவர்களாகத் தோன்றுபவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: நடுவினை வடிவம், இயேசு அவர்களைத் தம்மிடம் வருமாறு அழைத்தார் என்ற உறவுசார்ந்த நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது; கிரேக்கப் பங்கேற்புவினையின் முன்ன நிகழ்வும் காக்கப்படுகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதால் உரையின் செயல்பாட்டைச் சீராகத் தருகிறது.
- source_word: Οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα இங்கு நிகழ்காலப் பொருளுள்ள நிலையான அறிவைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் நேரடியும் இயல்பானதும் ஆகும்.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: ஆளுகிறவர்களாகக் கருதப்படுபவர்கள்
  rationale: δοκοῦντες என்பதில் உள்ள ‘அவ்வாறு மதிக்கப்படுதல்/கருதப்படுதல்’ என்ற பொதுமதிப்பின் நுணுக்கத்தைப் பாதுகாக்கிறது; அவர்களது ஆட்சி உண்மையல்ல என்று தேவையின்றி மறுப்பதில்லை.
- source_word: τῶν ἐθνῶν
  choice: பிற இனத்தாரை
  rationale: யூதப் பின்னணியில் ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்க முடியும். ‘பிற இனத்தார்’ என்பது நவீன தமிழில் புரியக்கூடியதாக இருந்து அந்த வேறுபாட்டைக் காக்கிறது; ‘நாடுகளை’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κατακυριεύουσιν
  choice: அடக்கி ஆளுகிறார்கள்
  rationale: வெறுமனே ஆள்வதைவிட மேலாதிக்கத்துடன் கட்டுப்படுத்தும் எதிர்மறை வலிமையை இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: அவர்களுடைய முக்கியமானவர்கள்
  rationale: சமூகத்தில் உயர்நிலையிலும் அதிகாரத்திலும் உள்ளவர்களைக் குறிக்கிறது; கிரேக்கத்தில் இல்லாத குறிப்பிட்ட அரசுப் பதவியைச் சேர்க்காமல் பொருளை இயல்பாகத் தருகிறது.
- source_word: κατεξουσιάζουσιν
  choice: அதிகாரம் செலுத்துகிறார்கள்
  rationale: அதிகாரத்தை மற்றவர்கள்மேல் பிரயோகிப்பது என்ற அடிப்படைப் பொருளைக் காக்கிறது; முந்தைய ‘அடக்கி ஆளுகிறார்கள்’ என்பதுடன் உள்ள சொல்வேறுபாட்டையும் அழிக்கவில்லை.
theological_decisions:
- issue: τῶν ἐθνῶν என்பதன் குறிப்பு
  choice: பிற இனத்தார்
  alternative: நாடுகள்
  rationale: மாற்கு நற்செய்தியின் யூதப் பின்னணியில் இது யூதரல்லாத மக்களைச் சுட்டுவது இயல்பானது. இருப்பினும் ‘நாடுகள்’ என்ற பரந்த சொற்பொருள் உண்மையான மாற்றாக அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: δοκοῦντες என்பதன் பொருள் வலிமை
  choice: கருதப்படுபவர்கள்
  alternative: தோன்றுபவர்கள்
  rationale: இந்த இடத்தில் ஆட்சியாளர்களின் அதிகாரமே வெறும் தோற்றம் என்று தீர்மானிக்காமல், அவர்கள் பொதுவாக ஆட்சியாளர்களாக மதிக்கப்படுகிறார்கள் என்ற பொருளை முதன்மைப்படுத்துகிறது; கிரேக்கத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அதிகாரத்தைத் தவறாகப் பயன்படுத்தும் இரு கிரேக்க வினைகளின் வேறுபாட்டைக் காக்க ‘அடக்கி ஆளுகிறார்கள்’ மற்றும் ‘அதிகாரம் செலுத்துகிறார்கள்’ என்று வேறுபடுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் உள்ளன.
