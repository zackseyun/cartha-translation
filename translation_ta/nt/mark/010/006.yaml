  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: ta
  text: ஆனால், படைப்பின் தொடக்கத்திலிருந்து, “அவர்களை ஆணாகவும் பெண்ணாகவும் அவர் உண்டாக்கினார்.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களை ஆணாகவும் பெண்ணாகவும் அவர் படைத்தார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘உண்டாக்கினார்’; ‘படைத்தார்’ என்பது ஆதியாகமப் பின்னணியை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆணாகவும் பெண்ணாகவும் அவர்களை அவர் உண்டாக்கினார்’ என்பது கிரேக்கச் சொல் வரிசையை இன்னும் நெருக்கமாகப் பின்பற்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: ஆனால், படைப்பின் தொடக்கத்திலிருந்தே
  rationale: ἀπό காலத்தின் தொடக்கப் புள்ளியைக் குறிக்கிறது; δέ முந்தைய விவாகரத்து அனுமதியோடு உள்ள முரண்பாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. ‘படைப்பின் தொடக்கம்’ என்பது ἀρχῆς κτίσεως என்பதன் இயல்பான தமிழ் வடிவம்.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ஆணாகவும் பெண்ணாகவும்
  rationale: ஆதியாகம மேற்கோளின் ஆண்–பெண் பால்வேறுபாட்டைத் துல்லியமாகத் தக்கவைக்கிறது; ‘ஆணையும் பெண்ணையும்’ என்பதைக் காட்டிலும் அசல் மொழியின் பெயரடைத் தன்மையை நன்கு வெளிப்படுத்துகிறது.
- source_word: ἐποίησεν
  choice: உண்டாக்கினார்
  rationale: ποιέω என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு.’ படைப்பு பின்னணி இருந்தாலும், κτίζω என்பதுபோல் நேரடியாக ‘படைத்தார்’ என்று இல்லாத சொல்வேறுபாட்டை இது காக்கிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: மனிதர்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயரை இயல்பான, மரியாதைமிக்க நவீன தமிழில் வெளிப்படுத்துகிறது; அசலில் இல்லாத ‘இருவரையும்’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ஆதியாகம மேற்கோளிலுள்ள பாலினச் சொற்கள்
  choice: ஆணாகவும் பெண்ணாகவும்
  alternative: ஆணும் பெண்ணுமாக / ஆணையும் பெண்ணையும்
  rationale: ἄρσεν καὶ θῆλυ என்பதிலுள்ள படைப்புசார் ஆண்–பெண் இணையைப் பாதுகாக்கிறது; அதை சமூக அல்லது உறவுப் பங்குகளாக மாற்றுவதில்லை.
- issue: வினையின் மறைமுக இறைச் செய்பவர்
  choice: அவர் உண்டாக்கினார்
  alternative: கடவுள் அவர்களை உண்டாக்கினார்
  rationale: கிரேக்கத்தில் எழுவாய் பெயர்ச்சொல் வெளிப்படையாக இல்லை. தமிழ் வினை அமைப்புக்காக ‘அவர்’ பயன்படுத்தப்படுவது சூழலில் தெளிவாக இருக்கிறது; ‘கடவுள்’ என்று பெயரிட்டு அசலில் இல்லாத விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. மேற்கோள் குறிகள் ஆதியாகமச் சான்றைத் தெளிவுபடுத்துகின்றன; ‘ஆனால்’ முந்தைய வசனங்களுடனான கருத்து மாறுபாட்டை வெளிப்படுத்துகிறது.
