source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: ta
  text: அவர்கள் எருசலேமுக்கு ஏறிச் செல்லும் வழியில்[a] இருந்தார்கள். இயேசு அவர்களுக்கு முன்னால் சென்றுகொண்டிருந்தார். அவர்கள் திகைத்தார்கள்; பின்தொடர்ந்து வந்தவர்களோ பயந்தார்கள். இயேசு மீண்டும் பன்னிருவரையும் தனியே அழைத்துக்கொண்டு[b], தமக்கு நிகழவிருந்தவற்றை அவர்களிடம் சொல்லத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதையில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தம்முடன் அழைத்துக்கொண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: செல்லும் வழியில்
  rationale: பயணத்தின் நேரடியான சூழலை இயல்பான தமிழில் காட்டுகிறது; ‘பாதையில்’ என்பதும் சாத்தியம்.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு ஏறிச் செல்லும்
  rationale: எருசலேமை நோக்கிய உயர்நிலப் பயணத்தையும் பாரம்பரியமான ‘ஏறிச் செல்லுதல்’ என்ற பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: προάγων αὐτούς
  choice: அவர்களுக்கு முன்னால் சென்றுகொண்டிருந்தார்
  rationale: இயேசு குழுவின் முன்புறம் சென்றார் என்பதைக் ‘வழிநடத்தினார்’ என்ற கூடுதல் விளக்கமின்றி நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐθαμβοῦντο
  choice: திகைத்தார்கள்
  rationale: வலுவான வியப்பையும் குழப்பத்தையும் இயல்பாக வெளிப்படுத்துகிறது; அச்சம் என்ற அடுத்த வினையிலிருந்து வேறுபடுத்துகிறது.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: பின்தொடர்ந்து வந்தவர்களோ
  rationale: யார் என்று அளவுக்கு மீறி குறிப்பாக்காமல் கிரேக்கப் பெயரெச்சத் தொடரின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐφοβοῦντο
  choice: பயந்தார்கள்
  rationale: அச்சத்தைக் குறிக்கும் வினையை நேரடியாகவும் எளிமையாகவும் வழங்குகிறது.
- source_word: παραλαβὼν πάλιν τοὺς δώδεκα
  choice: மீண்டும் பன்னிருவரையும் தனியே அழைத்துக்கொண்டு
  rationale: சூழலில் பன்னிருவருக்கான தனிப்பட்ட அறிவுறுத்தலை இயல்பான தமிழில் காட்டுகிறது; ‘தனியே’ என்பது சூழல்சார் வெளிப்படுத்தல் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: அவர்களிடம் சொல்லத் தொடங்கினார்
  rationale: தொடக்கநிலையைக் குறிக்கும் ἤρξατο என்பதையும் மறைமுகப் பொருளைப் பெறும் இயல்பான தமிழ் தொடரையும் பாதுகாக்கிறது.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: தமக்கு நிகழவிருந்தவற்றை
  rationale: விரைவில் அல்லது பின்னர் நிகழப்போகும் சம்பவங்களைக் குறிக்கிறது; விதியால் நிர்ணயிக்கப்பட்டவை என்ற வலுவான கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கதையில் இரு குழுக்களின் உணர்ச்சிகளுக்கிடையிலான வேறுபாடு
  choice: ἐθαμβοῦντο என்பதை ‘திகைத்தார்கள்’ என்றும் ἐφοβοῦντο என்பதை ‘பயந்தார்கள்’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: இரண்டையும் பொதுவான வியப்பு அல்லது அச்சமாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் இரு வேறு வினைகள் உள்ளதால், கதையின் உணர்ச்சிசார் பதற்றத்தையும் குழுக்களுக்கிடையிலான வேறுபாட்டையும் ஒரே உணர்வாகச் சீராக்காமல் பாதுகாக்கிறது.
- issue: παραλαμβάνω என்பதன் சூழல்சார் பொருள்
  choice: ‘தனியே அழைத்துக்கொண்டு’
  alternative: ‘தம்முடன் அழைத்துக்கொண்டு’
  rationale: தனிப்பட்ட அறிவுறுத்தல் என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும், கிரேக்க வினை தனியே ‘தனியாகப் பிரித்தார்’ என்று கட்டாயப்படுத்தாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எருசலேமுக்கு ஏறிச் செல்லும்’ என்பது நிலவியல் மற்றும் வேதாகமப் பயண வழக்கைத் தக்கவைக்கிறது. முதல் வாக்கியத்தில் மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலக் குறிப்பு சேர்க்கப்படவில்லை.
