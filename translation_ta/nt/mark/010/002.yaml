  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: ta
  text: அவர்கள் அவரைச் சோதிப்பதற்காக, ஒரு மனிதன் தன் மனைவியை விவாகரத்து செய்வது சட்டப்படி அனுமதிக்கப்பட்டதா என்று அவரிடம் கேட்டுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கணவன் தன் மனைவியை விவாகரத்து செய்வது சட்டப்படி அனுமதிக்கப்பட்டதா?”
    reason: ἀνήρ என்பதற்கு இச்சூழலில் ‘மனிதன்’ அல்லது ‘கணவன்’ என இருவகையாகப் பொருள் கொள்ள முடியும்.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து அல்லது மீண்டும் கேட்கப்பட்ட செயலைக் குறிக்கிறது; தமிழ் தொடர்நிலை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்பட்டதா
  rationale: இங்கு கேள்வி வெறும் சாத்தியத்தைப் பற்றியது அல்ல; சட்டம் அல்லது ஏற்றுக்கொள்ளப்பட்ட விதிமுறை அனுமதிக்கிறதா என்பதே கருத்து.
- source_word: ἀνδρὶ
  choice: ஒரு மனிதன்
  rationale: ἀνήρ என்பதன் ‘மனிதன்’ என்ற பொதுவான ஒருமை வடிவத்தைப் பாதுகாக்கிறது; திருமணச் சூழலை ‘தன் மனைவி’ தெளிவுபடுத்துகிறது.
- source_word: γυναῖκα
  choice: தன் மனைவியை
  rationale: விவாகரத்துச் சூழலில் γυνή என்பது ‘மனைவி’ என்று பொருள்படுகிறது; தமிழில் உரிய உறவை இயல்பாகக் காட்ட ‘தன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπολῦσαι
  choice: விவாகரத்து செய்வது
  rationale: திருமணச் சட்டச் சூழலில் இவ்வினைச்சொல்லின் வழக்குப் பொருள் ‘விவாகரத்து செய்வது’; ‘அனுப்பிவிடுவது’ என்பது கருத்தை மறைக்கக்கூடும்.
- source_word: πειράζοντες
  choice: சோதிக்கும் நோக்கத்தில்
  rationale: அவர்களுடைய கேள்வியின் நோக்கம் இயேசுவைச் சோதிப்பது என்பதை வெளிப்படுத்துகிறது; ‘சிக்கவைக்க’ என்பது மூலத்தைவிட அதிக விளக்கமாகிவிடும்.
- source_word: Καὶ
  choice: அவர்கள்
  rationale: தொடக்க இணைப்புச் சொல் தமிழின் தொடர்ச்சியான உரைநடையில் வெளிப்படையாக மொழிபெயர்க்கப்படாமல் இயல்பாக விடப்பட்டுள்ளது; வாக்கியத் தொடர்பு சூழலால் நிலைக்கிறது.
theological_decisions:
- issue: திருமணச் சட்டக் கேள்வியில் ἀνδρὶ என்பதன் பொருள்
  choice: ஒரு மனிதன்
  alternative: ஒரு கணவன்
  rationale: ‘மனிதன்’ என்பது கிரேக்கச் சொல்லின் வடிவத்தையும் பொதுப்படுத்தப்பட்ட சட்டக் கேள்வியின் தன்மையையும் பாதுகாக்கிறது; ‘தன் மனைவி’ திருமண உறவைத் தெளிவாக்குகிறது.
- issue: γυναῖκα உடன் வெளிப்படையான உடைமைச்சொல் இல்லாமை
  choice: தன் மனைவியை
  alternative: ஒரு மனைவியை
  rationale: கிரேக்கத்தில் உடைமைச்சொல் இல்லாவிட்டாலும், தமிழில் ‘ஒரு மனிதன் ஒரு மனைவியை விவாகரத்து செய்வது’ என்பது பிறருடைய மனைவியையும் குறிக்கக்கூடிய இயல்பற்ற தெளிவின்மையை உருவாக்கும். ‘தன்’ என்பது திருமணச் சட்டச் சூழலில் உட்பொருளாக உள்ள உறவை மட்டுமே வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்களுக்கு விளங்கும் வகையிலும் சட்ட விவாதத்தின் கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சட்டப்படி அனுமதிக்கப்பட்டதா’ என்பது ἔξεστιν என்பதன் சட்ட/அனுமதி நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
