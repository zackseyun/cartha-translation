  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: ta
  text: இயேசு நின்று[a], “அவனை அழையுங்கள்” என்றார். அவர்கள் அந்தப் பார்வையற்ற மனிதனை அழைத்து, “தைரியமாக இரு; எழுந்திரு; அவர் உன்னை அழைக்கிறார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “நின்று”; இச்சூழலில், “நடப்பதை நிறுத்தி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: நின்று
  rationale: ἵστημι என்ற வினையின் இறந்தகால வினையெச்சம் நேரடியாக ‘நின்று’ எனப் பொருள்படும்; இந்நிகழ்வில் இயேசு நடந்துசெல்வதை நிறுத்தியதையும் இயல்பாகக் குறிக்கிறது.
- source_word: Φωνήσατε αὐτόν
  choice: அவனை அழையுங்கள்
  rationale: φωνέω இங்கு ஒருவரைத் தம்மிடம் வரும்படி அழைப்பதைக் குறிக்கிறது. ‘அழையுங்கள்’ நேரடியான கட்டளையாகவும் தொடர்ந்துவரும் அதே வினைச்சொல்லுடன் ஒத்திசைவாகவும் உள்ளது.
- source_word: φωνοῦσι
  choice: அழைத்து
  rationale: இயேசுவின் கட்டளையில் வந்த φωνέω என்பதன் சொல் மீளுருவை ‘அழை’ என்ற ஒரே தமிழ் வினையால் காக்கிறது; பின்னர் அவர்கள் சொன்ன வார்த்தைகளோடும் இயல்பாக இணைகிறது.
- source_word: τὸν τυφλὸν
  choice: பார்வையற்ற அந்த மனிதனை
  rationale: τυφλός இங்கு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஆண்பால் அடைமொழி. நவீனத் தமிழில் மரியாதையுடனும் தெளிவுடனும் இயங்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Θάρσει
  choice: தைரியமாயிரு
  rationale: இந்த ஒருமை ஏவல் ஆறுதலும் ஊக்கமும் அளிக்கிறது. ‘தைரியமாயிரு’ அதன் நேரடியான வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἔγειρε
  choice: எழுந்திரு
  rationale: ἔγειρε இங்கு உடனடியாக எழும்பும்படி கூறும் ஒருமை ஏவல். ‘எழுந்திரு’ இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: φωνεῖ σε
  choice: அவர் உன்னை அழைக்கிறார்
  rationale: நிகழ்கால வினை இயேசுவின் அழைப்பு இப்போது நிகழ்வதை உணர்த்துகிறது. மரியாதை ஒருமையான ‘அவர்’ இயேசுவைக் குறிப்பிடும் இயல்பான தமிழ் நடை.
