translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க மூலத்தில் மீண்டும் வரும் φωνέω என்பதற்கு இரு இடங்களிலும் ‘அழை’ என்ற வேர்ச்சொல் காக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் இடம் மாறியிருந்ததால், கிரேக்கச் சொற்களுக்கு ஏற்ப [a] στὰς என்பதற்கும் [b] Θάρσει என்பதற்கும் சரியாக இணைக்கப்பட்டுள்ளன.
