source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ta
  text: ஆனால் இயேசு இதைக் கண்டபோது, கடும் அதிருப்தி அடைந்து அவர்களிடம், “பிள்ளைகளை என்னிடம் வரவிடுங்கள்; அவர்களைத் தடுக்காதீர்கள். ஏனெனில், கடவுளின் அரசு இப்படிப்பட்டவர்களுக்கு உரியது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “ஏனெனில், கடவுளின் அரசு இப்படிப்பட்டவர்களுடையது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: ஆனால் இயேசு இதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை இயேசுவின் எதிர்வினைக்கான சூழலைக் காட்டுகிறது; முந்தைய வசனத்தில் சீடர்கள் செய்ததையே ‘இதை’ என்பது இயல்பாகச் சுட்டுகிறது. δὲ இங்குள்ள மென்மையான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: ἠγανάκτησεν
  choice: கடும் அதிருப்தியடைந்து
  rationale: இந்த வினை வலுவான வெறுப்பையும் நியாயமான சினத்தையும் குறிக்கிறது. ‘கடும் அதிருப்தி’ அதன் தீவிரத்தைத் தக்கவைத்தாலும், கட்டுப்பாடற்ற கோபம் என்ற மிகைப்பைத் தவிர்க்கிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... என்றார்
  rationale: தமிழில் இயல்பான, மரியாதையான நேர்கூற்றுத் தொடர்.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: பிள்ளைகளை என்னிடம் வரவிடுங்கள்
  rationale: Ἄφετε இங்கு அனுமதித்தல் என்ற பொருளுடைய கட்டளை; தமிழ் வாக்கிய அமைப்பில் ‘வரவிடுங்கள்’ அதை நேர்த்தியாகத் தெரிவிக்கிறது.
- source_word: μὴ κωλύετε αὐτά
  choice: அவர்களைத் தடுக்காதீர்கள்
  rationale: κωλύω அணுகுவதைத் தடுத்தல் அல்லது இடையூறு செய்தல் எனப் பொருள்படும்; நிகழும் தடையை நிறுத்தும்படியான கட்டளையையும் இச்சொற்றொடர் இயல்பாகக் கொண்டுள்ளது.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: ஏனெனில், இப்படிப்பட்டவர்களுக்கே ... உரியது
  rationale: τοιούτων என்பது அங்கிருந்த குறிப்பிட்ட பிள்ளைகளை மட்டும் அல்லாமல், அவர்களைப் போன்றவர்களையும் பிரதிநிதித்துவமாகச் சுட்டுகிறது. ‘உரியது’ என்பது கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ‘-க்கே’ அதன் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளின் அரசு
  rationale: βασιλεία ஆட்சி/அரசாட்சி மற்றும் அரசு ஆகிய பரப்பைக் கொண்டது. ‘கடவுளின் அரசு’ தமிழில் தெளிவாகவும் நிறுவப்பட்ட வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறும் உள்ளது; இடத்தை மட்டும் குறிக்கும் ‘ராஜ்யம்’ என்ற புரிதலைத் தவிர்க்க உதவுகிறது.
theological_decisions:
- issue: ‘τῶν ... τοιούτων ἐστὶν ἡ βασιλεία’ என்பதன் பொருள்
  choice: கடவுளின் அரசு இப்பிள்ளைகளைப் போன்றவர்களுக்கு உரியது என்று பிரதிநிதித்துவப் பொருளில் மொழிபெயர்த்தல்
  alternative: ‘இப்படிப்பட்டவர்களால் கடவுளின் அரசு ஆனது’ அல்லது அங்கிருந்த பிள்ளைகளுக்கு மட்டும் அரசு உரியது என்று மொழிபெயர்த்தல்
  rationale: τοιούτων இயல்பாக ‘இவ்வகையினர்’ என்பதைக் குறிக்கிறது. பிள்ளைகளின் குற்றமின்மை, தானியக்க மீட்பு போன்றவற்றை வசனம் வெளிப்படையாகக் கூறாததால் அவற்றை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: ἐστὶν உடன் வரும் உரிமை/சேர்க்கைத் தொடர்பு
  choice: ‘உரியது’ என்று பொருள் வெளிப்படுத்தி, சொல்லுக்கு நெருக்கமான வடிவை அடிக்குறிப்பில் தருதல்
  alternative: ‘இப்படிப்பட்டவர்களுடையதே கடவுளின் அரசு’
  rationale: ‘உரியது’ நவீன தமிழில் இயல்பாக உள்ளது; இருப்பினும் கிரேக்கத்தின் சுருக்கமான ‘இத்தகையோருடையது’ அமைப்பு தரும் திறந்த தன்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிள்ளைகள்,’ ‘தடுக்காதீர்கள்,’ ‘கடவுளின் அரசு’ ஆகியவை இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன. இயேசுவின் உணர்ச்சியின் தீவிரம் தக்கவைக்கப்பட்டாலும் மிகைப்படுத்தப்படவில்லை; வசனம் கூறாத குழந்தை இயல்பு அல்லது மீட்பியல் கோட்பாடு சேர்க்கப்படவில்லை.
