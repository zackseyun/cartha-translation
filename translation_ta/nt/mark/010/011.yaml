id: MRK.10.11
reference: Mark 10:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “தன் மனைவியை விவாகரத்து செய்துவிட்டு வேறொரு பெண்ணைத் திருமணம் செய்துகொள்கிறவன், அவளுக்கு எதிராக விபசாரம் செய்கிறான்” என்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்கிறார்
  rationale: மாற்கு அடிக்கடி பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைத் தக்கவைத்தபடியே, நவீன தமிழில் இயல்பான நிகழ்கால உரையாடல் அறிமுகமாக அமைக்கப்பட்டுள்ளது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: கிரேக்க வேற்றுமை வடிவத்தின் மறைமுகப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: Ὃς ἂν
  choice: …கிறவன்
  rationale: நிபந்தனையுடன் கூடிய பொதுப்படையான குறிப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; சூழலில் மனைவியுடைய ஆணே குறிக்கப்படுகிறார்.
- source_word: ἀπολύσῃ
  choice: விவாகரத்து செய்துவிட்டு
  rationale: திருமணச் சூழலில் ἀπολύω என்பது வெறுமனே அனுப்பிவிடுதலை அல்ல, மணமுறிவைக் குறிக்கிறது; அடுத்த செயலுடனான தொடர்ச்சியும் ‘செய்துவிட்டு’ என்பதால் தெளிவாகிறது.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை
  rationale: γυνή என்பதற்கு ‘பெண்’ என்றும் ‘மனைவி’ என்றும் பொருள் உண்டு; உடைமைத் தொடர்பும் விவாகரத்துச் சூழலும் இங்கே ‘மனைவி’ என்பதைத் தேவைப்படுத்துகின்றன. எழுவாயைத் திரும்பச் சுட்ட ‘தன்’ இயல்பானது.
- source_word: γαμήσῃ ἄλλην
  choice: வேறொரு பெண்ணைத் திருமணம் செய்துகொள்கிறவன்
  rationale: ἄλλην என்பது பெண்பால் வடிவில் பெயர்ச்சொல் விடுபட்டுப் பயன்படுகிறது; தமிழில் பொருளை இயல்பாகவும் தெளிவாகவும் சொல்ல ‘வேறொரு பெண்ணை’ என விரித்துரைக்கப்பட்டுள்ளது.
- source_word: μοιχᾶται
  choice: விபசாரம் செய்கிறான்
  rationale: திருமணத் துரோகத்தைக் குறிக்கும் கிரேக்க வினையின் வழக்கமான, தெளிவான தமிழ் வடிவம்.
- source_word: ἐπ’ αὐτήν
  choice: அவளுக்கு எதிராக
  rationale: முதல் மனைவிக்கு இழைக்கப்படும் தவறு என்ற திசை/எதிர்ப்பு நுணுக்கத்தை அழிக்காமல் காக்கிறது.
theological_decisions:
- issue: ἐπ’ αὐτήν என்பது மனைவிக்கு இழைக்கப்படும் தவறை வலியுறுத்துகிறதா என்பது
  choice: ‘அவளுக்கு எதிராக விபசாரம் செய்கிறான்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விபசாரம் செய்கிறான்’ அல்லது ‘வேறொரு பெண்ணுடன் விபசாரம் செய்கிறான்’
  rationale: கிரேக்க மூலத்தில் உள்ள ἐπ’ αὐτήν என்பதை விடாமல் மொழிபெயர்ப்பதால், இச்செயல் முதல் மனைவிக்கு எதிரான குற்றமாகவும் இருப்பது தக்கவைக்கப்படுகிறது.
- issue: Ὃς ἂν என்ற பொதுப்படையான ஆண்பால் ஒருமை அமைப்பு
  choice: சூழலால் ஆண் தெளிவாகத் தெரியும் வகையில் ‘…கிறவன்’ என அமைக்கப்பட்டது.
  alternative: ‘எவர் … செய்கிறாரோ அவர்’
  rationale: இது பொதுவான நிபந்தனை வாக்கியம் என்ற தன்மையைப் பாதுகாக்கிறது; அதேவேளையில் ‘தன் மனைவி’ என்ற உடனடி சூழல் குறிக்கப்படும் நபர் கணவன் என்பதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விவாகரத்து’ சமகாலத்தில் தெளிவான சட்ட-உறவுச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. வரலாற்று நிகழ்காலமும் ‘அவளுக்கு எதிராக’ என்ற மூலத்தின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
