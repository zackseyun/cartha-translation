revisions:
- from: இயேசு அவர்களை உற்றுப் பார்த்து, “மனிதர்களால் இது இயலாதது; ஆனால் கடவுளால் இயலாதது அல்ல. ஏனெனில் கடவுளால் எல்லாம் இயலும்” என்றார்.
  to: இயேசு அவர்களை உற்றுப் பார்த்து, “மனிதர்களால் இது இயலாதது; ஆனால் கடவுளால் அல்ல. ஏனெனில் கடவுளால் எல்லாம் இயலும்” என்றார்.
  rationale: The revision preserves the source’s elliptical contrast—“impossible with humans, but not with God”—without adding interpretation. It improves Tamil flow by avoiding a redundant double-negative and retains the explicit explanatory force of γάρ (“ஏனெனில்”).
