id: MRK.10.27
reference: Mark 10:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: ta
  text: இயேசு அவர்களை உற்றுப் பார்த்து, “மனிதர்களால் இது இயலாதது; ஆனால் கடவுளால் அல்ல. ஏனெனில் கடவுளால் எல்லாம் இயலும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: உற்றுப் பார்த்து
  rationale: சாதாரணமாகப் பார்ப்பதைக் காட்டிலும் கூர்ந்து அல்லது நேராகப் பார்ப்பதைச் சுட்டும் வினையின் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Παρὰ ἀνθρώποις
  choice: மனிதர்களால்
  rationale: மனிதர்களின் தரப்பில் அல்லது ஆற்றலுக்குள் என்பதைக் குறிக்கும் παρά + dative அமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: ἀδύνατον
  choice: இயலாதது
  rationale: சூழலில் மறைமுகமாக உள்ள ‘இது’ என்பதோடு இணைந்து, சாத்தியமின்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παρὰ θεῷ / παρὰ τῷ θεῷ
  choice: கடவுளால் / கடவுளால்
  rationale: இரு இடங்களிலும் கடவுளுடைய வல்லமையையும் அவரிடம் உள்ள சாத்தியத்தையும் ஒரே இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: ‘அனைத்தும்’ என்ற முழுமையான பொருளை பொதுவான, கண்ணியமான நடையில் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முன்னுள்ள ‘கடவுளால் இயலாதது அல்ல’ என்ற கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ‘எல்லாம் இயலும்’ என்பதன் வரம்பு
  choice: கடவுளால் எல்லாம் இயலும்
  alternative: கடவுள் எதையும் செய்ய வல்லவர்
  rationale: மூலத்தின் பொதுவான, வலிமையான கூற்றை அதன் சூழலியல் பதற்றத்துடன் அப்படியே வைத்திருக்கிறது; விளக்கவுரை சேர்த்து அதன் வரம்பை மறைமுகமாக நிர்ணயிக்கவில்லை.
- issue: மனித இயலாமையும் கடவுளுடைய வல்லமையும் இடையிலான எதிர்மறை ஒப்பீடு
  choice: மனிதர்களால் இது இயலாதது; ஆனால் கடவுளால் இயலாதது அல்ல
  alternative: மனிதருக்கு முடியாது; கடவுளுக்கோ முடியும்
  rationale: ἀλλ’ οὐ என்ற ‘ஆனால் ... அல்ல’ வடிவத்தைப் பாதுகாத்து, மூலத்தின் சொல்லாட்சியையும் இறையியல் வலியுறுத்தலையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் கண்ணியமாகவும் அமைந்த நடை. ‘உற்றுப் பார்த்து’ என்பது காட்சியின் தீவிரத்தைத் தருகிறது; ‘மனிதர்களால்/கடவுளால்’ என்ற இணையான அமைப்பு வசனத்தின் எதிர்மறை ஒப்பீட்டைத் தெளிவாக்குகிறது.
