  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: ta
  text: அவனோ, அந்த வார்த்தையினால்[b] முகம் வாடி[a], துயரத்தோடு அங்கிருந்து சென்றான்; ஏனெனில் அவனுக்கு ஏராளமான சொத்துகள்[c] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனமுடைந்து” அல்லது “முகம் இருண்டு.” கிரேக்கச் சொல் முகத்தில் வெளிப்படையாகத் தோன்றிய வாட்டத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்தச் சொல்லைக் கேட்டு” அல்லது “அந்தச் சொல்லின் காரணமாக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மிகுந்த உடைமைகள்” அல்லது “ஏராளமான உடைமைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: முகம் வாடி
  rationale: இந்த இறந்தகால வினையெச்சம் அவனுடைய உள்ளத் துயரம் முகத்தில் வெளிப்படையாகத் தோன்றியதைக் குறிக்கிறது. ‘முகம் வாடி’ என்பது காணக்கூடிய இருண்ட முகபாவனையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் ‘மனமுடைந்து’ என்பது அந்த வெளிப்புற நுட்பத்தை இழக்கக்கூடும்.
- source_word: ἐπὶ τῷ λόγῳ
  choice: அந்த வார்த்தையைக் கேட்டதும்
  rationale: இச்சொற்றொடர் அந்த வார்த்தையே அவனுடைய எதிர்வினைக்குக் காரணமாகவோ சந்தர்ப்பமாகவோ இருந்ததைக் காட்டுகிறது. தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்த ‘கேட்டதும்’ சேர்க்கப்பட்டுள்ளது; λόγῳ என்பதன் ஒருமை ‘அந்த வார்த்தை’ என்று பாதுகாக்கப்படுகிறது.
- source_word: ἀπῆλθεν
  choice: அங்கிருந்து சென்றான்
  rationale: கதையில் அவன் விலகிச் சென்ற நகர்வை இயல்பான தமிழில் இது தெரிவிக்கிறது. ‘புறப்பட்டுப் போனான்’ என்பதைக் காட்டிலும் நடுநிலையான நடை.
- source_word: λυπούμενος
  choice: துயரத்தோடு
  rationale: அவன் செல்லும்போதும் நீடித்திருந்த வருத்தத்தை நிகழ்கால வினையெச்சம் சுட்டுகிறது. ‘துயரத்தோடு’ அந்தத் தொடரும் உணர்வையும் அதன் கனத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: κτήματα πολλά
  choice: ஏராளமான சொத்துகள்
  rationale: κτήματα என்பது உடைமைகள் அல்லது சொத்துகளைக் குறிக்கிறது; πολλά அவற்றின் மிகுதியைக் காட்டுகிறது. ‘ஏராளமான சொத்துகள்’ என்பது எண்ணிக்கை அல்லது பரந்த அளவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἦν γὰρ ἔχων
  choice: ஏனெனில் அவனுக்கு ... இருந்தன
  rationale: இந்தச் சுற்றுவழி வினையமைப்பு அவன் சொத்துகளை உடையவனாக இருந்த தொடர்நிலையைச் சுட்டுகிறது. தமிழில் ‘அவனுக்கு ... இருந்தன’ என்பது அதற்கான இயல்பான உருமாற்றம்.
theological_decisions:
- issue: இயேசுவின் வார்த்தைக்கு அந்த மனிதன் காட்டிய உணர்ச்சிபூர்வமான எதிர்வினையின் தன்மை
  choice: முகத்தில் வெளிப்பட்ட வாட்டத்தையும் தொடர்ந்து இருந்த துயரத்தையும் மட்டும் உரை கூறும் அளவில் மொழிபெயர்த்தல்
  alternative: அவன் கோபமடைந்தான் அல்லது வெறுமனே ஏமாற்றமடைந்தான் என்று விளக்குதல்
  rationale: கிரேக்க உரை உணர்ச்சித் துயரத்தையும் முகம் இருண்டதையும் காட்டுகிறது; ஆனால் கோபத்தையோ வெளிப்படையான கலகத்தையோ கூறவில்லை. ஆகவே ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் கதையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘முகம் வாடி’ என்ற வழக்கமான சொற்றொடர் மூலத்தின் காணக்கூடிய முகமாற்றத்தைப் பாதுகாக்கிறது. வாக்கிய ஒழுங்கு தமிழ் கதையாடல் இயல்புக்கேற்ப அமைக்கப்பட்டாலும், காரணத் தொடர்பும் நீடித்த துயரமும் சொத்துகளின் மிகுதியும் காக்கப்பட்டுள்ளன.
