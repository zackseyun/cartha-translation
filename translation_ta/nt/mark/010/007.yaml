lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: இதன் காரணமாக
  rationale: முன்னுள்ள கூற்றை அடிப்படையாகக் காட்டும் காரணத் தொடரை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: καταλείψει
  choice: விட்டு
  rationale: பெற்றோருடனான உறவை முறித்துக்கொள்வது என்ற கடுமையான பொருளைத் திணிக்காமல், அவர்களுடைய குடும்பச் சூழலை விட்டு நீங்கும் நேரடியான பொருளைத் தருகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: ἄνθρωπος பொதுவாக மனிதரைக் குறிக்கக்கூடியதாயினும், இங்கு ‘தன் மனைவி’ என்ற திருமணச் சூழல் ஆண் தரப்பைக் குறிப்பாக்குகிறது.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: தன் தகப்பனையும் தாயையும்
  rationale: இரு பெற்றோரையும் இணைநிலைப் பொருள்களாகத் தெளிவாகக் காட்டுகிறது; ‘தன்’ என்பது தமிழில் இருவருக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: προσκολληθήσεται
  choice: இணைந்திருப்பான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் திருமணத்தில் ஏற்படும் நெருக்கமான, தொடர்ச்சியான பற்றுறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பற்றிக்கொள்வான்’ என்ற சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியுடன்
  rationale: திருமணச் சூழலில் γυνή என்பதற்கு ‘மனைவி’ தெளிவான பொருள்; தமிழில் ‘இணைந்திரு’ என்பதுடன் ‘உடன்’ இயல்பான வேற்றுமைத் தொடர்பைத் தருகிறது.
theological_decisions:
- issue: திருமண மேற்கோளில் பாலினத்தைக் குறிப்பாக்கும் மொழி
  choice: ஒரு மனிதன் ... தன் மனைவி
  alternative: ஒருவர் ... தன் வாழ்க்கைத்துணை
  rationale: சூழல் ஆண் தரப்பையும் அவனுடைய மனைவியையும் குறிப்பாக முன்வைப்பதால், மூலத்தில் உள்ள ஆண்-பெண் குறிப்பை பாலினப் பொதுமைப்படுத்தலால் நீக்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தகப்பன்’ என்பது வாசகர்களுக்குப் பரிச்சயமான உயர்நடைச் சொல்; வாக்கியம் தேவையற்ற பழமையாக்கமின்றி சுருக்கமாக வைக்கப்பட்டுள்ளது.
