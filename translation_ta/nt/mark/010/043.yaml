  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: ta
  text: ஆனால் உங்களிடையே அப்படியல்ல[a]. மாறாக, உங்களிடையே பெரியவராக ஆக விரும்புகிற எவரும் உங்களுக்குச் சேவை செய்பவராக இருப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் உங்களிடையே இது இவ்வாறில்லை.”
    reason: lexical_alternative
  - marker: b
    text: '“இருப்பார்” என்ற எதிர்கால வினை, இச்சூழலில் “இருக்க வேண்டும்” என்ற பொருளையும் தரலாம்: உங்களிடையே பெரியவராக ஆக விரும்புகிற எவரும் உங்களுக்குச் சேவை செய்பவராக இருக்க வேண்டும்.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: ஆனால் உங்களிடையே அப்படி இல்லை
  rationale: δέ-யின் எதிர்மறை மாறுபாட்டை ‘ஆனால்’ என்றும், οὐχ οὕτως-ஐ இயல்பான நவீனத் தமிழில் ‘அப்படி இல்லை’ என்றும் வழங்குகிறது; சமூகச் சூழலை ἐν ὑμῖν என்பதற்கான ‘உங்களிடையே’ காக்கிறது.
- source_word: ἀλλ’
  choice: மாறாக
  rationale: உலக அதிகார முறைக்கும் இயேசு எடுத்துரைக்கும் முறைக்கும் இடையிலான வலுவான எதிர்மாற்றைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὃς ἂν θέλῃ
  choice: விரும்புகிறவர் எவரோ
  rationale: ἄν உடன் வரும் சார்புநிலை வினையின் பொதுவான, வரையறையற்ற நிபந்தனைப் பொருளையும் θέλω-வின் விருப்பப் பொருளையும் காக்கிறது.
- source_word: μέγας γενέσθαι
  choice: பெரியவராக ஆக
  rationale: γενέσθαι-யின் ‘ஆகுதல்’ என்ற மாற்றநிலைப் பொருளைத் தக்கவைத்து, μέγας குறிக்கும் சமூக மேன்மையை ‘பெரியவர்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: இரு இடங்களிலும் சமூகத்திற்குள் என்ற பொருளை ஒரேவிதமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔσται ὑμῶν διάκονος
  choice: அவர் உங்களுக்குப் பணிசெய்பவராக இருப்பார்
  rationale: διάκονος இங்கு திருச்சபைப் பதவியைக் குறிக்காமல் சேவை செய்பவரைக் குறிக்கிறது. ‘பணிசெய்பவர்’ தாழ்மையான சேவையைத் தெளிவுபடுத்தி, ‘பணியாளர்’ என்பதன் சம்பள வேலை சார்ந்த நிழற்பொருளைத் தவிர்க்கிறது; ‘இருப்பார்’ எதிர்கால வடிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἔσται என்ற எதிர்கால வினையின் அறிவுறுத்தும் வலிமை
  choice: பணிசெய்பவராக இருப்பார்
  alternative: பணிசெய்பவராக இருக்க வேண்டும்
  rationale: சூழலில் எதிர்கால வினை கட்டாயம் அல்லது அறிவுறுத்தல் சார்ந்த வலிமை பெறலாம். முதன்மை உரை கிரேக்க எதிர்கால வடிவைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: διάκονος என்பதன் பொருள்
  choice: பணிசெய்பவர்
  alternative: ஊழியர்
  rationale: இங்கு பின்னாளைய திருச்சபைப் பதவியைக் குறிக்கும் சொல்லை இறக்குமதி செய்யாமல், சமூகத்திற்குள் தாழ்மையுடன் சேவை செய்பவர் என்ற பொருளை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆண்பால் ஒருமையைத் திணிக்காமல், கிரேக்கத்தின் பொதுப்பொருளை ‘எவரோ, அவர்’ என வழங்கியுள்ளது. ‘ஊழியக்காரன்’ போன்ற பழைய திருச்சபை வழக்கையும், ‘பணியாளர்’ என்பதன் வேலைவாய்ப்பு நிழற்பொருளையும் தவிர்த்து ‘பணிசெய்பவர்’ பயன்படுத்தப்பட்டுள்ளது.
