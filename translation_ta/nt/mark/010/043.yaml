review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the contrast (δέ/ἀλλά), the repeated communal phrase ἐν ὑμῖν, the ingressive sense of γενέσθαι ('become'), and διάκονος as a servant rather than a church office. The future ἔσται is suitably retained, with its possible directive force noted in the footnote.
  naturalness: ‘விரும்புகிறவர் எவரோ’ is not idiomatic modern standard Tamil in this generalizing construction. ‘விரும்புகிற எவரும்’ is natural and precisely conveys ὃς ἂν. ‘உங்களிடையே அப்படியல்ல’ is also a more fluent Tamil rendering than ‘உங்களிடையே அப்படி இல்லை.’ ‘சேவை செய்பவர்’ is straightforward contemporary wording.
  terminology: ‘சேவை செய்பவர்’ appropriately renders διάκονος here without suggesting a later ecclesiastical office or an employment role. ‘பெரியவராக ஆக’ preserves the becoming sense of γενέσθαι and the contextual status sense of μέγας.
  issues:
  - severity: low
    issue: Indefinite relative construction is awkward
    rationale: ‘விரும்புகிறவர் எவரோ’ sounds marked and can suggest a particular unidentified person, whereas Greek ὃς ἂν is a generalizing ‘whoever.’ ‘விரும்புகிற எவரும்’ gives the required general sense naturally.
  - severity: low
    issue: Opening negative-manner expression can be more idiomatic
    rationale: ‘உங்களிடையே அப்படியல்ல’ is a concise, natural Tamil equivalent of οὐχ οὕτως ... ἐστιν ἐν ὑμῖν, without changing meaning.
