revisions:
- from: ஆனால் உங்களிடையே அப்படி இல்லை[a]. மாறாக, உங்களிடையே பெரியவராக ஆக விரும்புகிறவர் எவரோ, அவர் உங்களுக்குப் பணிசெய்பவராக இருப்பார்[b].
  to: ஆனால் உங்களிடையே அப்படியல்ல[a]. மாறாக, உங்களிடையே பெரியவராக ஆக விரும்புகிற எவரும் உங்களுக்குச் சேவை செய்பவராக இருப்பார்[b].
  rationale: 'The revision improves modern Tamil idiom while retaining every relevant source-text feature: the adversative contrast, the indefinite/general condition, becoming great, the repeated ‘among you,’ and the future-form conclusion. The footnote anchors remain correctly placed and preserve the stated alternatives.'
