source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: ta
  text: எவரும் இப்பொழுது இந்தக் காலத்தில் நூறுமடங்கு வீடுகளையும் சகோதரர்களையும் சகோதரிகளையும் தாய்மார்களையும் பிள்ளைகளையும் வயல்களையும், துன்புறுத்தல்களுடனும், வரவிருக்கும் யுகத்தில் நித்திய வாழ்வையும் பெறாமல் இருப்பதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβῃ
  choice: பெறாமலும் போகமாட்டார்
  rationale: முந்தைய வசனத்தில் தொடங்கும் ‘ஒருவரும் இல்லை ... பெறாமல்’ என்ற எதிர்மறை வாக்கிய அமைப்பை இயல்பான தமிழில் தொடர்கிறது; இங்கு கொடுக்கப்படும் கைம்மாறைப் ‘பெறுதல்’ என்பதே பொருத்தமானது.
- source_word: ἑκατονταπλασίονα
  choice: நூறுமடங்காக
  rationale: அளவின் மிகுதியை நேரடியாகத் தெரிவித்து, பட்டியலிலுள்ள அனைத்துக்கும் பொருந்தும் வகையில் வினையோடு இணைக்கப்பட்டுள்ளது.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: இப்பொழுது இந்தக் காலத்தில்
  rationale: தற்போதைய காலத்தையும் வரவிருக்கும் காலத்தையும் மூலத்தில் உள்ளபடி தெளிவாக எதிரெதிராக நிறுத்துகிறது.
- source_word: οἰκίας ... ἀγρούς
  choice: வீடுகளையும் ... வயல்களையும்
  rationale: மூலத்தின் தெளிவான பன்மைப் பட்டியலையும் அதன் பொருள்சார்ந்த, குடும்பச்சார்ந்த கூறுகளையும் காக்கிறது.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: சகோதரர்களையும் சகோதரிகளையும்
  rationale: கிரேக்கத்தில் ஆண், பெண் உடன்பிறப்புகள் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
- source_word: μητέρας καὶ τέκνα
  choice: தாய்மார்களையும் பிள்ளைகளையும்
  rationale: இரு சொற்களின் பன்மையையும் குடும்ப உறவுகளைக் குறிக்கும் நேரடிப் பொருளையும் தக்கவைக்கிறது.
- source_word: μετὰ διωγμῶν
  choice: துன்புறுத்தல்களோடுகூட
  rationale: இப்போதைய மிகுதியான கைம்மாறுடன் துன்புறுத்தல்களும் தொடரும் என்ற முக்கியமான அழுத்தத்தை வெளிப்படையாகக் காக்கிறது.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: வரவிருக்கும் காலத்தில்
  rationale: αἰών என்பதைக் காலம் அல்லது யுகம் என்ற பொருளில் எடுத்து, தற்போதைய காலத்தோடு உள்ள இறுதிக்கால எதிர்மறைப்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: இறுதிக்காலத்துக்குரிய முடிவில்லா வாழ்வைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: தற்போதைய காலத்தில் வாக்களிக்கப்படும் நூறுமடங்கு கைம்மாற்றின் இயல்பு
  choice: வீடுகள், உறவுகள், வயல்கள் ஆகியவற்றை உண்மையான தற்போதைய கைம்மாறாக நேரடியாக மொழிபெயர்த்து, ‘துன்புறுத்தல்களோடுகூட’ என்பதையும் வலியுறுத்திக் காத்தல்
  alternative: இதை முழுவதும் உருவகமான ஆன்மிக ஆசீர்வாதமாக்குதல், அல்லது துன்பமற்ற பொருளாதார வளத்தின் வாக்குறுதியாக்குதல்
  rationale: கிரேக்க உரை மிகுதியான தற்போதைய கைம்மாறையும் தொடரும் துன்புறுத்தல்களையும் ஒன்றாகவே வைக்கிறது; மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடக் கூடாது.
- issue: குடும்ப உறவுகளின் பாலின வேறுபாடு
  choice: ἀδελφοὺς மற்றும் ἀδελφὰς என்பவற்றை ‘சகோதரர்கள்’ மற்றும் ‘சகோதரிகள்’ என்று தனித்தனியாக வழங்குதல்
  alternative: இரண்டையும் பொதுவாக ‘உடன்பிறப்புகள்’ என்று ஒருங்கிணைத்தல்
  rationale: மூல உரையே ஆண், பெண் உறவுகளைத் தனித்தனியாகப் பட்டியலிடுகிறது.
- issue: இப்போதைய காலமும் வரவிருக்கும் காலமும்
  choice: இரண்டையும் தெளிவாக வேறுபடுத்தி, நித்திய வாழ்வை வரவிருக்கும் காலத்துடன் இணைத்தல்
  alternative: நித்திய வாழ்வை தற்போதைய கைம்மாற்றோடு மட்டும் கலந்து வாசிக்கச் செய்தல்
  rationale: வாக்கியத்தின் καὶ ... καὶ அமைப்பும் காலக் குறிப்புகளும் தற்போதைய கைம்மாற்றையும் வரவிருக்கும் காலத்தின் நித்திய வாழ்வையும் வேறுபடுத்துகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடருவதால், கிரேக்கத்தின் இரட்டை எதிர்மறை அமைப்பு தமிழில் இயல்பாக ‘பெறாமலும் ... பெறாமலும் போகமாட்டார்’ என வழங்கப்பட்டுள்ளது. இடைக்கோடுகள் ‘துன்புறுத்தல்களோடுகூட’ என்ற பதற்றமிக்க இடைச்சேர்க்கையைத் தெளிவுபடுத்துகின்றன.
