revisions:
- from: அவர் நாசரேயனாகிய இயேசு[a] என்று கேள்விப்பட்டபோது, “தாவீதின் மகனே, இயேசுவே, என்மேல் இரக்கம் காட்டும்!” என்று உரக்கக் கூப்பிடத் தொடங்கினார்.
  to: அது நாசரேயனாகிய இயேசு என்று அவர் கேள்விப்பட்டபோது, “தாவீதின் மகனே, இயேசுவே, என்மேல் இரக்கம் காட்டும்!” என்று உரக்கக் கூப்பிடத் தொடங்கினார்.
