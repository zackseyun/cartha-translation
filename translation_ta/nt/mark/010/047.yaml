id: MRK.10.47
reference: Mark 10:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: ta
  text: அது நாசரேயனாகிய இயேசு என்று அவர் கேள்விப்பட்டபோது, “தாவீதின் மகனே, இயேசுவே, என்மேல் இரக்கம் காட்டும்!” என்று உரக்கக் கூப்பிடத் தொடங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: கேள்விப்பட்டபோது
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்ததைக் காட்டும் இறந்தகாலப் பங்கேற்பை இயல்பான தமிழில் காலத் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: Ναζαρηνός
  choice: நாசரேயனாகிய
  rationale: ஊர்ப் பெயரை மட்டும் விளக்கும் வடிவமாக மாற்றாமல், கிரேக்கத்தில் உள்ள அடைமொழித் தன்மையைத் தக்கவைக்கிறது.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: என்று உரக்கக் கூப்பிடத் தொடங்கினார்
  rationale: தொடக்கநிலையைக் குறிக்கும் ἤρξατο என்பதையும், அவசரமான உரத்த அழைப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘கூப்பிட்டு சொல்ல’ என்ற செயற்கையான இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: Υἱὲ Δαυὶδ
  choice: தாவீதின் மகனே
  rationale: சொல்லுருவையும் அரச-மேசியா சார்ந்த பட்டப்பெயரின் ஒலிப்பையும் பாதுகாக்கிறது.
- source_word: ἐλέησόν με
  choice: என்மேல் இரக்கம் காட்டும்
  rationale: அவசர வேண்டுகோளின் கனத்தையும் கட்டளை வடிவையும் dignified modern Tamil-இல் தெளிவாகத் தருகிறது.
- source_word: Ἰησοῦ
  choice: இயேசுவே
  rationale: நேரடி அழைப்பைக் குறிக்கும் விளிவேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தாவீதின் மகன்’ என்பதன் மேசியா சார்ந்த பொருள்
  choice: ‘தாவீதின் மகனே’ என்ற பட்டப்பெயரை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: ‘தாவீதின் வழித்தோன்றலே’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: மாற்குவின் கதைச்சூழலில் இவ்வழைப்பு அரச-மேசியா முக்கியத்துவம் கொண்டது; அதை வெறும் வம்சவழிக் குறிப்பாகச் சுருக்கக் கூடாது.
- issue: Ναζαρηνός என்பதன் வடிவம்
  choice: ‘நாசரேயனாகிய’ என்று அடைமொழியாக மொழிபெயர்த்தல்
  alternative: ‘நாசரேத்தைச் சேர்ந்த’ அல்லது ‘நாசரேத் ஊரானாகிய’
  rationale: மூலத்தில் வெளிப்படையான புவியியல் சொற்றொடருக்குப் பதிலாக அடைமொழி உள்ளது; அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நேரடி அழைப்பில் ‘இயேசுவே’, ‘மகனே’ என்ற இயல்பான விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது; ‘நாசரேயன்’ என்ற குறைவாகப் பழக்கமான வடிவுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது.
