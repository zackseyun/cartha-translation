  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘தம்’ என்பது இயேசுவின் கைகளையே தெளிவாகக் குறிக்கிறது. வாக்கிய அமைப்பு தமிழின் இயல்பான செயல் வரிசையைப் பின்பற்றுகிறது.
