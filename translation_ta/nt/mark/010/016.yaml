  text: καὶ ἐναγκαλισάμενος αὐτὰ ⸂κατευλόγει τιθεὶς τὰς χεῖρας ἐπ’ αὐτά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: ta
  text: அவர் அவர்களைத் தம் கரங்களில் ஏந்திக்கொண்டு[a], அவர்கள்மேல் தம் கைகளை வைத்து, ஆசீர்வதித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அணைத்துக்கொண்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒருவரைத் தன் கரங்களுக்குள் எடுத்துக்கொள்வதைச் சிறப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க வினைச்சொல் இறந்தகாலத் தொடர்நிலை வடிவில் உள்ளது; எனவே ‘தொடர்ந்து’ அல்லது ‘மீண்டும் மீண்டும் ஆசீர்வதித்தார்’ என்ற நுட்பமும் இருக்கலாம். வினைச்சொல்லின் முன்னொட்டு வலியுறுத்தலையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: அணைத்துக்கொண்டு
  rationale: இந்த வினைச்சொல் ஒருவரைத் தன் கரங்களுக்குள் ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘அணைத்துக்கொண்டு’ என்பது இயல்பான நவீனத் தமிழில் அந்த அன்பான உடல் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κατευλόγει
  choice: ஆசீர்வதித்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது மீண்டும் நிகழ்ந்த செயலைச் சுட்டலாம்; வலுப்படுத்தப்பட்ட கூட்டு வினை அன்பார்ந்த அல்லது மனமார்ந்த ஆசீர்வாதத்தையும் உணர்த்தலாம். முதன்மை உரையில் இயல்பான ‘ஆசீர்வதித்தார்’ வைக்கப்பட்டு, இந்நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: அவர்கள்மேல் தம் கைகளை வைத்து
  rationale: ஆசீர்வதித்தபோது நிகழ்ந்த உடன் செயலை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது; பின்னாளைய சடங்கு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
- source_word: αὐτὰ ... αὐτά
  choice: அவர்களை ... அவர்கள்மேல் ... அவர்களை
  rationale: இப்பெயர்ப்பதிலிகள் முந்தைய சூழலில் குறிப்பிடப்பட்ட குழந்தைகளைக் குறிக்கின்றன. தமிழில் மனிதர்களைக் குறிக்கும் மரியாதையான பன்மை வடிவம் இயல்பாக உள்ளது.
- source_word: καὶ
  choice: அவர்
  rationale: தமிழ் உரைநடையில் வசனத் தொடக்க இணைப்பை வெளிப்படையாக மொழிபெயர்க்காமல், எழுவாயுடன் தொடங்குவது இயல்பான தொடர்ச்சியைத் தருகிறது; கிரேக்க இணைப்பில் தனியான கால அல்லது காரணப் பொருள் கட்டாயமில்லை.
theological_decisions:
- issue: குழந்தைகளிடம் இயேசு செய்த செயலின் தன்மை
  choice: அணைத்தல், கைகளை வைத்தல், ஆசீர்வதித்தல் ஆகிய வெளிப்படையான செயல்களை மட்டும் நேரடியாகக் கூறுதல்
  alternative: இதை ஒரு குறிப்பிட்ட சடங்காகவோ திருவருட்சாதனச் செயலாகவோ விளக்குதல்
  rationale: மூலவசனம் அன்பான வரவேற்பையும் ஆசீர்வாதத்தையும் விவரிக்கிறது; பின்னாளைய சமய அல்லது சடங்கு வகைப்பாடுகளை அது வெளிப்படையாகக் கூறவில்லை.
