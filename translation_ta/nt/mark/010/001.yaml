id: MRK.10.1
reference: Mark 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: ta
  text: அவர் அங்கிருந்து புறப்பட்டு, யூதேயாவின் பகுதிகளுக்கும் யோர்தான் ஆற்றுக்கு அப்பாலுள்ள பகுதிகளுக்கும் வந்தார்.[a] மக்கள் கூட்டங்கள் மீண்டும் அவரிடம் கூடிவந்தன; அவர் தமது வழக்கத்தின்படி மீண்டும் அவர்களுக்குப் போதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத் தொடரை, ‘யூதேயாவின் பகுதிகளுக்கும் யோர்தான் ஆற்றுக்கு அப்பாலுள்ள பகுதிகளுக்கும்’ என்று இரண்டு இடக்குறிப்புகளாகவோ, ‘யோர்தான் ஆற்றுக்கு அப்பாலுள்ள யூதேயாப் பகுதிகளுக்கு’ என்று ஒரே இடக்குறிப்பாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν ἀναστὰς
  choice: அங்கிருந்து புறப்பட்டு
  rationale: இங்கு ἀναστὰς என்பது உயிர்த்தெழுதலைக் குறிக்காமல், இருந்த இடத்திலிருந்து எழுந்து புறப்படுவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் அமைய இரு சொற்களும் ஒருங்கிணைத்து மொழிபெயர்க்கப்பட்டன.
- source_word: ἔρχεται
  choice: வந்தார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ்க் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதால் ‘வந்தார்’ என வழங்கப்பட்டது.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: யூதேயாவின் பகுதிகள்
  rationale: ὅρια என்பது எல்லைக் கோடுகளை மட்டுமல்லாமல் நிலப்பகுதிகளையும் குறிக்கலாம்; பயணச் சூழலில் ‘பகுதிகள்’ என்பது பொருத்தமானது.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தான் ஆற்றுக்கு அக்கரை
  rationale: யோர்தான் ஆற்றின் மறுபக்கத்திலுள்ள நிலப்பகுதியைக் குறிக்கும் இயல்பான தமிழ் வழக்கு. ‘ஆறு’ என்பது இடப்பெயரைத் தெளிவுபடுத்துகிறது.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: மக்கள் கூட்டங்கள் ... அவரிடம் கூடிவந்தன
  rationale: வினைச்சொல் அடிப்படையில் ஒன்றாகச் செல்வதைச் சுட்டினாலும், இச்சூழலில் கூட்டங்கள் இயேசுவை நோக்கி வந்து கூடுவதையே குறிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: மாற்கு பயன்படுத்திய மறுபடியும் நிகழ்தலைக் காட்டும் சொல், வசனத்தில் வரும் இரு இடங்களிலும் பாதுகாக்கப்பட்டது.
- source_word: ὡς εἰώθει
  choice: தமது வழக்கத்தின்படி
  rationale: வழக்கமாகத் தொடர்ந்து செய்துவந்த செயலைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἐδίδασκεν αὐτούς
  choice: அவர்களுக்குப் போதித்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை இங்கு வழக்கமான அல்லது தொடர்ந்து நடந்த போதனையைக் குறிக்கிறது; முந்திய ‘வழக்கத்தின்படி’ என்பதுடன் சேர்ந்து அந்த நுணுக்கம் வெளிப்படுகிறது.
theological_decisions:
- issue: யூதேயாவும் யோர்தானுக்கு அக்கரையும் குறித்த புவியியல் தொடரின் அமைப்பு
  choice: இரண்டு இணைக்கப்பட்ட இடக்குறிப்புகள்போல் முதன்மை உரையில் வழங்கி, இலக்கண மாற்றுவாய்ப்பை அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: ‘யோர்தானுக்கு அக்கரையிலுள்ள யூதேயாவின் பகுதிகள்’ என்று ஒரே நிலப்பகுதியாகப் புரிந்துகொள்ளுதல்
  rationale: καὶ πέραν τοῦ Ἰορδάνου என்ற சுருக்கமான கிரேக்கத் தொடர் இரண்டாவது இடக்குறிப்பாகவோ, யூதேயாவின் பகுதியை விளக்கும் தொடராகவோ புரிந்துகொள்ளப்படலாம். எந்த ஒரு புரிதலையும் இறுதியாகத் தீர்மானிக்காமல் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டது.
- issue: மாற்குவின் வரலாற்று நிகழ்காலம்
  choice: தமிழில் இயல்பான இறந்தகாலமான ‘வந்தார்’
  alternative: கிரேக்க வடிவை நேரடியாகப் பின்பற்றி ‘வருகிறார்’
  rationale: இது கோட்பாட்டு வேறுபாடு அல்ல. தமிழ் கதைநடையின் இயல்பை காக்கும் அதேவேளையில் நிகழ்வின் பொருள் மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘புறப்பட்டு’, ‘கூடிவந்தன’, ‘வழக்கத்தின்படி’ ஆகியவை மூலத்தின் இயக்கம், திரளுதல், வழக்கமான செயல் ஆகிய நுணுக்கங்களை இயல்பாக வெளிப்படுத்துகின்றன.
