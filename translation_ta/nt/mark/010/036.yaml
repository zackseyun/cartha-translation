  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நான் உங்களுக்காக என்ன செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறீர்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: அவர்
  rationale: கிரேக்கத்தில் இது முந்தைய உரையாடலைத் தொடர்ந்து, ஏற்கெனவே அறியப்பட்ட இயேசுவை எழுவாயாகக் குறிக்கும் இயல்பான கதைநடை அமைப்பு. தமிழில் தனியாக ‘ஆனால்’ அல்லது ‘பின்பு’ சேர்ப்பது தேவையற்ற எதிர்மறை அல்லது காலநிலை வலியுறுத்தலை உருவாக்கலாம்.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... என்று கேட்டார்
  rationale: εἶπεν என்பதன் அடிப்படைப் பொருள் ‘சொன்னார்’ என்றாலும், தொடர்ந்து வருவது நேரடியான கேள்வி என்பதால் நவீனத் தமிழில் ‘கேட்டார்’ என்பது இயல்பான உரையாடல் வடிவம்; பேசுதல் என்ற நிகழ்வை மாற்றாமல் கேள்வியின் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: Τί θέλετε
  choice: என்ன ... விரும்புகிறீர்கள்?
  rationale: Τί என்பது ‘என்ன’, θέλετε என்பது அவர்களின் விருப்பத்தை நேரடியாகக் கேட்கிறது. ‘விரும்புகிறீர்கள்’ என்பது dignified modern Tamil; ‘வேண்டும் என நினைக்கிறீர்கள்’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: ποιήσω ὑμῖν
  choice: நான் உங்களுக்கு என்ன செய்ய வேண்டுமென்று
  rationale: ποιήσω என்பது விரும்பப்படும் செயலைக் குறிக்கும் aorist subjunctive; ὑμῖν இங்கு பயனாளரைக் குறிக்கும் வேற்றுமையாக ‘உங்களுக்கு’ என்று மொழிபெயர்க்கப்படுகிறது. ‘செய்ய’ என்பது சூழலில் ποιέωவின் இயல்பான பொருள்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேரடியான உரையாடல் இயல்பும் காக்கப்பட்டுள்ளன. கிரேக்க δέ-க்கு தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை; தமிழ்க் கதைநடையில் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
