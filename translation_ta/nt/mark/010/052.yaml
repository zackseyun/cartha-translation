source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: ta
  text: இயேசு அவனிடம், “போ; உன் விசுவாசம்[a] உன்னை மீட்டிருக்கிறது[b],” என்றார். உடனே அவன் பார்வை பெற்று, வழியில்[c] அவரைப் பின்தொடர்ந்து சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பிக்கை.’ இங்கு இயேசுவை நம்பிச் சார்ந்திருப்பது பொருள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உன்னை நலமாக்கியது’ அல்லது ‘உன்னைக் குணமாக்கியது.’ கிரேக்க வினைச்சொல் குணமடைதலையும், மீட்பையும், இரட்சிப்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘சாலையில்.’ ‘வழியில்’ என்பது பயணப் பாதையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: போ
  rationale: புறப்பட்டுச் செல்லும்படி கூறும் நேரடியான கட்டளை; கிரேக்கத்தில் இல்லாத ‘உன் வழியே’ போன்ற உடைமை நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு இயேசுவின்மீது அவன் வைத்திருந்த நம்பிக்கையைக் குறிக்கிறது. திட்டத்தின் முக்கியச் சொல்லைத் தக்கவைத்தபடியே ‘நம்பிக்கை’ என்ற இயல்பான மாற்றை அடிக்குறிப்பில் தருகிறது.
- source_word: σέσωκέν
  choice: மீட்டது
  rationale: σῴζω என்பதன் மீட்பு, நலம்பெறுதல், இரட்சிப்பு ஆகிய பரப்பை முடிந்தவரை திறந்துவைக்கிறது; உடல் குணமடைதல் மட்டுமே என்று பொருளைக் குறுக்கவில்லை.
- source_word: εὐθύς
  choice: உடனே
  rationale: மாற்குவின் வேகமான கதைநடையையும் நிகழ்வின் உடனடித்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνέβλεψεν
  choice: பார்வை பெற்றான்
  rationale: பார்வையற்ற மனிதன் காணத் தொடங்கியதை இயல்பாகச் சொல்கிறது; அவனுக்கு முன்பு பார்வை இருந்தது என்பதைத் தேவையின்றி உறுதிப்படுத்துவதில்லை.
- source_word: ἠκολούθει
  choice: பின்தொடர்ந்து சென்றான்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணப் பாதையையும் சீடத்துவ ‘வழி’ என்ற சாத்தியமான எதிரொலியையும் ஒரே நேரத்தில் திறந்துவைக்கும் இயல்பான தமிழ்.
- source_word: καὶ ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வசனத் தொடக்கத்தில் தேவையற்ற இணைப்புச் சொல்லைச் சேர்க்காமல் கதைத் தொடர்ச்சியை இயல்பாக வழங்குகிறது; καί-யின் தொடர் உறவு சூழலால் தெளிவாகிறது.
theological_decisions:
- issue: இயேசுவின் அறிவிப்பில் σῴζω என்பதன் பொருள்
  choice: ‘உன்னை மீட்டது’ என்று பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உன்னைக் குணமாக்கியது’ அல்லது ‘உன்னை இரட்சித்தது’
  rationale: அடுத்த வாக்கியம் உடல் பார்வை கிடைத்ததைத் தெளிவாக்கினாலும், கிரேக்க வினைச்சொல் குணமடைதல், மீட்பு, இரட்சிப்பு ஆகியவற்றை உள்ளடக்கக்கூடும். எனவே ஒரு பொருளுக்கு மட்டும் அதைச் சுருக்காமல் மூலத்தின் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
- issue: πίστις என்பதன் உறவுசார் பொருள்
  choice: முதன்மை உரையில் ‘விசுவாசம்’ பயன்படுத்தப்பட்டு, ‘நம்பிக்கை’ அடிக்குறிப்பில் தரப்பட்டது.
  alternative: முதன்மை உரையில் ‘நம்பிக்கை’
  rationale: இந்தச் சூழலில் அந்த மனிதன் இயேசுவை நம்பிச் சார்ந்திருப்பதே கருத்து. இருப்பினும் முக்கிய இறையியல் சொல்லின் தொடர்ச்சியைப் பாதுகாக்க ‘விசுவாசம்’ முதன்மை உரையில் வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பின்தொடர்ந்து சென்றான்’ என்பது தொடர்ந்த செயலை இயல்பாகக் காட்டுகிறது. ‘வழியில்’ மற்றும் ‘மீட்டது’ ஆகியவை மூலத்தில் உள்ள உண்மையான பொருள் அகலத்தையும் இறையியல் எதிரொலியையும் தேவையின்றி தீர்மானிக்காமல் காக்கின்றன.
