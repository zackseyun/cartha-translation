  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “எங்களால் முடியும்”[a] என்றார்கள். ஆனால் இயேசு அவர்களிடம், “நான் குடிக்கும் கிண்ணத்தை நீங்களும் குடிப்பீர்கள்; நான் பெறும் திருமுழுக்கை நீங்களும் பெறுவீர்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களால் செய்ய முடியும்.”
    reason: lexical_alternative
  - marker: b
    text: “கிண்ணம்,” “திருமுழுக்கு” ஆகியவை இயேசு எதிர்கொள்ளவிருக்கும் துன்பத்தையும் அவருக்குக் குறித்த அனுபவத்தையும் குறிக்கும் உருவகங்கள்; அவருடைய சீடர்களும் அவற்றில் பங்குபெறுவார்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: எங்களால் முடியும்
  rationale: தற்போதைய ஆற்றல் அல்லது இயலுமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சீடர்களின் உறுதியான பதிலையும் காக்கிறது.
- source_word: ποτήριον
  choice: கிண்ணம்
  rationale: துன்பம் அல்லது ஒருவருக்கு நியமிக்கப்பட்ட அனுபவம் என்பதைக் குறிக்கும் உருவகத்தை விளக்கிப் பதிலீடு செய்யாமல் அப்படியே காக்கிறது.
- source_word: πίνω / πίεσθε
  choice: நான் குடிக்கும் / நீங்களும் குடிப்பீர்கள்
  rationale: கிரேக்கத்தில் உள்ள நிகழ்கால–எதிர்கால இணைப்பையும், இயேசுவின் அனுபவத்தில் சீடர்களும் பங்குகொள்வார்கள் என்ற உருவகத்தையும் காக்கிறது.
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: βάπτισμα என்பதற்கான வழக்கமான தமிழ் வேதாகமச் சொல்லைப் பயன்படுத்தி, மூழ்கடிக்கும் அனுபவம் என்ற உருவகத் தொடர்பையும் காக்கிறது.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: நான் பெறும் / நீங்களும் பெறுவீர்கள்
  rationale: ‘திருமுழுக்கு’ என்ற பெயர்ச்சொல்லுடன் இயல்பான தமிழில் இணைகிறது. கிரேக்கத்தின் செயப்பாட்டு வடிவத்தை தமிழ் வாக்கியநடைக்கு ஏற்றவாறு வெளிப்படுத்துகிறது; உருவகத்தை விளக்கமாக மாற்றவில்லை.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ஆனால் இயேசு அவர்களிடம்
  rationale: 'δέ குறிக்கும் மென்மையான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது: சீடர்களின் தன்னம்பிக்கையான பதிலைத் தொடர்ந்து இயேசு கூறும் திருத்தும் தன்மையுள்ள அறிவிப்பு வருகிறது.'
theological_decisions:
- issue: கிண்ணம் மற்றும் திருமுழுக்கு ஆகிய உருவகங்கள்
  choice: இரு உருவகங்களையும் முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: அவற்றை நேரடியாக ‘துன்பம்’, ‘மரணம்’ அல்லது ‘வேதனை’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை விளக்கச் சொற்களைப் பயன்படுத்தாமல் உருவகங்களையே தருகிறது. அவை இயேசு எதிர்கொள்ளவிருக்கும் துன்பத்தையும் விதியையும் சுட்டினாலும், அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தெரிவிப்பது உரையின் இறையியல் செறிவைக் காக்கிறது.
- issue: βάπτισμα என்பதற்கும் சடங்கான திருமுழுக்கிற்கும் உள்ள தொடர்பு
  choice: ‘திருமுழுக்கு’ என்ற சொல்லைக் காத்து, இச்சூழலில் அது உருவகமாக இருப்பதை அடிக்குறிப்பில் தெளிவுபடுத்தல்
  alternative: சடங்கு சார்ந்த பொருள் தோன்றாதவாறு ‘மூழ்கடிக்கும் துன்பம்’ அல்லது ‘கடும் சோதனை’ என்று மொழிபெயர்த்தல்
  rationale: மூலச்சொல்லின் வடிவத்தையும் வேதாகமங்களுக்கு இடையிலான ஒலிப்பையும் காப்பது அவசியம்; அதேவேளை உடனடிச் சூழல் இதை இயேசுவின் துன்பத்தைக் குறிக்கும் உருவகமாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கிண்ணம்’ மற்றும் ‘திருமுழுக்கு’ ஆகிய வேதாகம உருவகங்கள் விளக்கிப் பதிலீடு செய்யப்படாமல் காக்கப்பட்டுள்ளன; ‘நான் பெறும் திருமுழுக்கு’ என்பது சொல்லுக்குச் சொல் கடினத்தன்மையைத் தவிர்த்து தமிழில் இயல்பாக அமைகிறது.
