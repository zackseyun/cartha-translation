  edition: SBLGNT
  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: ta
  text: அதற்கு அவர்கள், “மணவிலக்குச் சான்றிதழை[a] எழுதவும் அவளை அனுப்பிவிடவும்[b] மோசே அனுமதித்தார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மணவிலக்குப் பத்திரத்தை.’ கிரேக்கச் சொற்றொடர் மணவிலக்கை உறுதிப்படுத்தும் எழுத்துப்பூர்வமான சட்ட ஆவணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவளை மணவிலக்கு செய்ய.’ சொல்லர்த்தமாக, ‘அனுப்பிவிட’; கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை, ஆனால் இங்கு மணவிலக்கின் சூழலால் ‘அவளை’ என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: அதற்கு அவர்கள் … என்றார்கள்
  rationale: οἱ என்பது முன்பு குறிப்பிடப்பட்ட பரிசேயர்களைக் குறிக்கிறது; δέ உரையாடலின் தொடர்ச்சியையோ மென்மையான எதிர்மாறுபாட்டையோ காட்டுகிறது. இயல்பான தமிழில் பதிலுரையின் தொடர்பை ‘அதற்கு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἐπέτρεψεν
  choice: அனுமதித்தார்
  rationale: ἐπιτρέπω என்பதன் அடிப்படைப் பொருள் அனுமதித்தல். இது கட்டளையிட்டார் என்று சொல்லாமல், அனுமதிக்கும் சட்டரீதியான நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: βιβλίον ἀποστασίου
  choice: மணவிலக்குச் சான்றிதழ்
  rationale: இது உபாகமம் 24:1-இல் குறிப்பிடப்படும் எழுத்துப்பூர்வமான சட்ட ஆவணத்தைக் குறிக்கிறது. ‘மணவிலக்குச் சான்றிதழ்’ என்பது அதன் சட்டத் தன்மையைத் தெளிவாகவும் நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: γράψαι
  choice: எழுதி
  rationale: γράφω என்பதன் நேரடியான பொருளான ‘எழுது’ என்பதையே இயல்பான தமிழ் வாக்கிய அமைப்பில் வினையெச்சமாக வழங்குகிறது.
- source_word: καὶ ἀπολῦσαι
  choice: அவளை அனுப்பிவிட
  rationale: ἀπολύω இங்கு மனைவியை மணவிலக்கு செய்து அனுப்புவதைக் குறிக்கிறது. ‘அனுப்பிவிட’ என்பது மூலத்தின் சொல்லுருவைப் பாதுகாக்கிறது; ‘அவளை’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும் சூழலால் தெளிவாகும் செயப்படுபொருளைத் தமிழில் இயல்புக்காகச் சேர்க்கிறது.
theological_decisions:
- issue: மணவிலக்குச் சட்டத்தில் மோசேயின் அறிவுறுத்தலின் தன்மை
  choice: மோசே மணவிலக்கை அனுமதித்தார்
  alternative: மோசே மணவிலக்குச் சான்றிதழை எழுதும்படி கட்டளையிட்டார்
  rationale: Ἐπέτρεψεν என்பது வெளிப்படையாக ‘அனுமதித்தார்’ என்று பொருள்படுகிறது. கடின இருதயத்தின் காரணமாக வழங்கப்பட்ட அனுமதிக்கும் படைப்பின் தொடக்கத்திலிருந்த இறைநோக்கத்திற்கும் இடையே அடுத்த வசனங்களில் வரும் வேறுபாட்டை இவ்வாசிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘அனுமதித்தார்’ என்பதன் மூலம் அனுமதிக்கும் கட்டளையிடுவதற்கும் உள்ள வேறுபாடு காக்கப்பட்டுள்ளது; ‘அனுப்பிவிட’ மூலத்தின் உருவகச் சொல்லாட்சியைத் தக்கவைக்கிறது.
