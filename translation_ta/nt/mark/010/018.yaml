source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: ta
  text: ஆனால் இயேசு அவனிடம், “நீ ஏன்[a] என்னை நல்லவர் என்று அழைக்கிறாய்? கடவுளாகிய ஒருவரைத் தவிர யாரும் நல்லவர் அல்ல” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “எதற்காக என்னை நல்லவர் என்கிறாய்?”
    reason: τί என்ற சொல்லின் வடிவத்தையும் λέγεις என்பதன் நேரடியான சொல்லாக்கத்தையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அழைப்புக்கு இயேசு அளிக்கும் பதிலில் உள்ள மென்மையான உரையாடல் திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: εἶπεν αὐτῷ
  choice: அவனிடம் ... என்றார்
  rationale: λέγω என்பதையும் அதன் மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: Τί
  choice: ஏன்
  rationale: τί என்பதன் அடிப்படைப் பொருள் ‘என்ன’ என்றாலும், இங்கு வினையுடன் சேர்ந்து காரணத்தை வினவும் சொல்லாக வருகிறது; ‘ஏன்’ என்பது இயல்பான தமிழ்.
- source_word: με λέγεις ἀγαθόν
  choice: என்னை நல்லவர் என்று அழைக்கிறாய்
  rationale: με என்ற நேரடிச் செயப்படுபொருளையும் ἀγαθόν என்ற பயனிலைப் பெயரடையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: நல்லவர் / நல்லவர்
  rationale: இரு இடங்களிலும் ஒரே அடிச்சொல்லைப் பயன்படுத்தி மூலத்தின் சொல் மறுபயன்பாட்டையும் வாதத்தின் வலிமையையும் காக்கிறது.
- source_word: οὐδεὶς
  choice: வேறு யாரும் ... அல்ல
  rationale: உலகளாவிய மறுப்பைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; விதிவிலக்கு முன்வருவதால் ‘வேறு’ இயல்பாகச் சேர்கிறது.
- source_word: εἰ μὴ εἷς
  choice: ஒரே ஒருவரைத் தவிர
  rationale: விதிவிலக்கையும் εἷς வலியுறுத்தும் தனித்தன்மையையும் பாதுகாக்கிறது.
- source_word: ὁ θεός
  choice: அவர் கடவுள்
  rationale: முன்னதாகக் குறிப்பிடப்பட்ட ‘ஒரே ஒருவர்’ யார் என்பதை இயல்பான தமிழில் அடையாளப்படுத்துகிறது; கிரேக்கத்தின் பொருளுக்கு மேலாக விளக்கம் சேர்க்கவில்லை.
theological_decisions:
- issue: நன்மையைப் பற்றிய இயேசுவின் கூற்றில் உள்ள கிறிஸ்துவியல் உட்குறிப்பு
  choice: இயேசுவின் தெய்வத்தன்மையை அவர் மறுப்பதாகவோ இவ்வாக்கியத்தில் வெளிப்படையாக அறிவிப்பதாகவோ மொழிபெயர்ப்பில் தீர்மானிக்காமல், கேள்வியையும் கூற்றையும் நேரடியாக வைத்திருத்தல்
  alternative: இயேசு தெய்வத்தன்மையை மறுக்கிறார் அல்லது நேரடியாக உரிமைகோருகிறார் எனக் குறிக்கும் விளக்கமொழிபெயர்ப்பு
  rationale: மூலவாக்கியம் மனிதனின் ‘நல்லவர்’ என்ற அழைப்பைச் சோதிக்கிறது; ஆனால் அதன் கிறிஸ்துவியல் விளைவை வெளிப்படையாகத் தீர்த்து வைக்கவில்லை. ஆகவே உள்ளார்ந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நல்லவர்’ என்ற மரியாதை ஒருமை, இயேசுவை நோக்கிப் பயன்படுத்தப்பட்ட சொல்லையும் பின்னர் கடவுளைப் பற்றிய கூற்றையும் இயல்பாக இணைக்கிறது. நீண்ட விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கமான வாத அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
