source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: ta
  text: 'இயேசு சுற்றிலும் பார்த்து, தம் சீடர்களிடம் கூறுகிறார்: “செல்வம்[a] உடையவர்கள் கடவுளுடைய அரசாட்சிக்குள் நுழைவது எவ்வளவு கடினமாக இருக்கும்!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவகையில்: “பணம்” அல்லது “உடைமைகள்.”'
    reason: χρήματα என்பதன் பொருள் பணத்தையோ பொருள் உடைமைகளையோ குறிக்கலாம் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: சுற்றிலும் பார்த்து
  rationale: சுற்றியிருந்தவர்களை நோக்கிப் பார்த்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயல் என்பதை உணர்த்துகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மாற்கு பயன்படுத்தும் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: Πῶς δυσκόλως
  choice: எவ்வளவு கடினம்
  rationale: சொல்லின் வினையுரிச்சொல் வடிவத்தை இயந்திரமாகப் பின்பற்றாமல், கடுமையான சிரமத்தை வலியுறுத்தும் வியப்புத் தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: செல்வம் உடையவர்கள்
  rationale: ஒரு நிலையான சமூகப் பெயராக ‘செல்வந்தர்கள்’ என்று சுருக்காமல், பொருள்வளத்தை உடையவர்கள் என்ற பங்கேற்பு சொற்றொடரின் அமைப்பைப் பாதுகாக்கிறது.
- source_word: χρήματα
  choice: செல்வம்
  rationale: பணம் மட்டுமல்லாமல் பொருள் உடைமைகளையும் உள்ளடக்கக்கூடிய விரிவான பொருளைத் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசாட்சி
  rationale: βασιλεία என்பதிலுள்ள கடவுளின் ஆட்சி என்ற இயக்கமிக்க கருத்தைத் தெளிவாகத் தருகிறது; இடத்தைக் குறிக்கும் ‘உள்ளே’ என்ற மொழியுடனும் இயல்பாக அமைகிறது.
- source_word: εἰσελεύσονται
  choice: நுழைவது
  rationale: எதிர்கால வினையின் செயலைத் தமிழில் பொதுவான உண்மை அல்லது எதிர்நோக்கிய நிகழ்வு இரண்டிற்கும் இயல்பான தொழிற்பெயர் கட்டமைப்பில் வெளிப்படுத்துகிறது; சூழல் அதன் எதிர்நோக்கிய நோக்கைத் தக்கவைக்கிறது.
theological_decisions:
- issue: செல்வம் உடையவர்கள் கடவுளுடைய அரசாட்சிக்குள் நுழைவது முற்றிலும் இயலாததா, அல்லது மிகவும் கடினமானதா?
  choice: மிகவும் கடினம் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நடைமுறையில் இயலாது என்று பொருளைத் தீவிரப்படுத்துதல்.
  rationale: கிரேக்க δυσκόλως என்பது ‘சிரமத்துடன்’ அல்லது ‘கடினமாக’ என்பதைக் குறிக்கிறது; இயலாமையை நேரடியாகக் கூறவில்லை. ஆகவே வசனத்தின் இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: βασιλεία τοῦ θεοῦ என்பதை ‘கடவுளுடைய அரசாட்சி’ அல்லது ‘கடவுளுடைய ராஜ்யம்’ என்று மொழிபெயர்ப்பது
  choice: கடவுளுடைய அரசாட்சி
  alternative: கடவுளுடைய ராஜ்யம்
  rationale: ‘அரசாட்சி’ என்பது கடவுள் ஆளும் செயற்பாட்டையும் ஆட்சிக்குட்பட்ட நிலையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இதை வெறும் புவியியல் இடமாக மட்டும் கட்டுப்படுத்துவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மாற்குவின் வரலாற்று நிகழ்காலம் ‘கூறுகிறார்’ எனப் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘செல்வம்’ என்ற சொல்லோடு நேரடியாக இணைக்கப்பட்டுள்ளது.
