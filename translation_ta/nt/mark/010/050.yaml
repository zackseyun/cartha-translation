  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமும் கதைநடையின் வேகமும் காக்கப்பட்டுள்ளன. ‘உதறிவிட்டு’ மற்றும் ‘துள்ளியெழுந்து’ ஆகியவை கிரேக்கத்தின் திடீர், உயிரோட்டமான இயக்கத்தை வெளிப்படுத்துகின்றன.
