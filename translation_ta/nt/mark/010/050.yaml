  text: ὁ δὲ ἀποβαλὼν τὸ ἱμάτιον αὐτοῦ ⸀ἀναπηδήσας ἦλθεν πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: ta
  text: அவன் தன் மேலங்கியை உதறிவிட்டு[a], துள்ளியெழுந்து இயேசுவிடம் வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் ஆடையை ஒதுக்கிவிட்டு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: உதறிவிட்டு
  rationale: இறந்தகாலப் பங்கேற்புவினையான ἀποβάλλω, மேலங்கியைத் தீர்மானமாகவும் விரைவாகவும் விலக்கிப்போடும் செயலைக் குறிக்கிறது. ‘உதறிவிட்டு’ என்பது அந்தத் திடீர் செயலின் உயிரோட்டத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἱμάτιον
  choice: மேலங்கி
  rationale: ἱμάτιον பொதுவாக உடைகளுக்கு மேலாக அணியும் ஆடை அல்லது போர்வை போன்ற அங்கியைக் குறிக்கிறது. இச்சூழலில் ‘மேலங்கி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀναπηδήσας
  choice: துள்ளியெழுந்து
  rationale: ἀναπηδάω திடீரெனவும் ஆற்றலுடனும் எழும் இயக்கத்தைக் காட்டுகிறது. ‘துள்ளியெழுந்து’ அவனுடைய உடனடியான, ஆர்வமிக்க செயலைப் பாதுகாக்கிறது.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: இயேசுவிடம் வந்தான்
  rationale: ἔρχομαι என்பதுடன் πρός வருவது இயேசுவை நோக்கி நகர்ந்து அவரிடம் வருவதைக் குறிக்கிறது. ‘இயேசுவிடம் வந்தான்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: δὲ
  choice: வெளிப்படையான இணைப்புச்சொல் இன்றி
  rationale: δὲ இங்கு கதையை முன்ன நகர்த்தும் மென்மையான இணைப்புச்சொல். தமிழில் தனியாக ‘அவன்’ என்று தொடங்குவது இயல்பாக அதே தொடர்ச்சியை வெளிப்படுத்துகிறது; ‘ஆனால்’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத வலுவான முரண்பாடு தோன்றலாம்.
