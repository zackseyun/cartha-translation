id: MRK.10.31
reference: Mark 10:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ta
  text: ஆனால், முதலில் இருப்பவர்கள் பலர் கடைசியில் இருப்பார்கள்[a]; கடைசியில் இருப்பவர்கள் முதலில் இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வெளிப்படையாக, “முதல் நிலையில் இருக்கும் பலர் கடைசி நிலையில் இருப்பார்கள்; கடைசி நிலையில் இருப்பவர்கள் முதல் நிலையில் இருப்பார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டுள்ள இந்தப் பன்மை உரிச்சொல் எல்லாரையும் அல்ல, வரையறுக்கப்படாத ஒரு பெரிய எண்ணிக்கையினரைக் குறிக்கிறது; ‘பலர்’ என்பது இயல்பானவும் சுருக்கமானவும் உள்ள தமிழ் வடிவம்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தைத் தொடர்ந்து, இங்கு வரும் நிலைமாற்றக் கூற்றின் மென்மையான எதிர்மறைத் தொடர்பை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: ἔσονται
  choice: இருப்பார்கள்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை இயல்பான நவீனத் தமிழில் எளிய எதிர்கால இணைப்புவினையாக வழங்குகிறது.
- source_word: πρῶτοι
  choice: முதலில் இருப்பவர்கள்
  rationale: வரிசை அல்லது நிலையில் ‘முதல்’ என்பதைக் குறிக்கும் சொல்லை, மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாடாகத் தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; ‘முதன்மையானவர்கள்’ என்று மொழிபெயர்த்து சமூக முக்கியத்துவத்தை மட்டும் நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: ἔσχατοι
  choice: கடைசியில் இருப்பார்கள்
  rationale: πρῶτοι என்பதற்கு நேரெதிரான நிலையைப் பேணி, நிலைமாற்றக் கூற்றின் இணை அமைப்பைத் தக்கவைக்கிறது.
- source_word: οἱ ἔσχατοι
  choice: கடைசியில் இருப்பவர்கள்
  rationale: கட்டுரையுடன் பெயர்ச்சொல் போல வரும் சொற்றொடரை, ‘கடைசி நிலையில் உள்ளவர்கள்’ என்ற பொருளில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: ;
  rationale: கிரேக்கத்தில் καὶ இரு இணையான பகுதிகளை இணைக்கிறது. தமிழில் அரைப்புள்ளி அந்த இணைப்பையும் இருபகுதி சமநிலையையும் இயல்பாகக் காட்டுகிறது; அதன் கூட்டிணைப்பு பொருள் வாக்கிய அமைப்பிலேயே தெளிவாக உள்ளது.
theological_decisions:
- issue: நிலைமாற்றக் கூற்றின் தன்மை
  choice: இதை இறுதிக்கால நிலைமாற்றத்தின் பொதுவான, திறந்த கூற்றாகவே வைத்தல்
  alternative: ‘முதலில்’ மற்றும் ‘கடைசியில்’ இருப்பவர்களைப் பணக்காரர்–ஏழை, சீடர்–வெளியார், அல்லது இரட்சிக்கப்படுவோர்–இழக்கப்படுவோர் என்று குறிப்பாக அடையாளப்படுத்துதல்
  rationale: வசனம் ஒரு பரந்த முரண்பாட்டுக் கொள்கையைச் சொல்கிறது; ஆனால் சம்பந்தப்பட்ட பிரிவுகளை இவ்வசனத்திலேயே முழுமையாக வரையறுக்கவில்லை. மேலும், ‘பலர்’ என்பது ஒவ்வொருவருக்கும் விதிவிலக்கில்லாமல் பொருந்தும் முழுமையான விதி என்று கூறுவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முந்தினோர்/பிந்தினோர்’ போன்ற பழைய வடிவங்களும், குறிப்பிட்ட சமூக அல்லது ஆன்மிக அந்தஸ்தை முன்கூட்டியே தீர்மானிக்கும் சொற்களும் தவிர்க்கப்பட்டுள்ளன. கிரேக்கத்தின் சுருக்கமான இருபகுதி முரண்பாடும் ‘பலர்’ என்பதன் வரையறுக்கப்படாத பரப்பும் பாதுகாக்கப்பட்டுள்ளன.
