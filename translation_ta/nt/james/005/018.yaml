source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: ta
  text: அவர் மீண்டும் ஜெபித்தார்; வானம்[a] மழை தந்தது; நிலம் தன் விளைச்சலைக் கொடுத்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானம்’ என்பதற்கு, சூழலைப் பொறுத்து, ‘பரலோகம்’ என்றும் பொருள் இருக்கலாம். ஆனால் இங்கு மழையைப் பற்றியதால் ‘வானம்’ என்பதே பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமி தன் விளைச்சலை முளைக்கவிட்டது’ அல்லது ‘நிலம் தன் பயிரைத் தந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு செய்த செயல் மறுபடியும் நிகழ்ந்ததைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: προσηύξατο
  choice: ஜெபித்தார்
  rationale: προσεύχομαι என்பதன் எளிய பொருளைத் தருகிறது. 17ஆம் வசனத்திலுள்ள தீவிரத்தை இவ்வசனத்தில் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: ὁ οὐρανὸς
  choice: வானம்
  rationale: மழையைப் பற்றிய இச்சூழலில் காணக்கூடிய வானத்தையே குறிக்கிறது; இருப்பினும் மூலச்சொல்லுக்கு ‘பரலோகம்’ என்ற பொருளும் உண்டு.
- source_word: ὑετὸν ἔδωκεν
  choice: மழை தந்தது
  rationale: ‘மழையைக் கொடுத்தது’ என்ற மூலத்தின் உருவகத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது; ‘மழை பெய்தது’ என்று மாற்றி உருவகத்தை நீக்கவில்லை.
- source_word: ἡ γῆ
  choice: நிலம்
  rationale: இங்கு மழையால் பயிர் விளையும் வேளாண்மைச் சூழலுக்கு ‘நிலம்’ இயல்பாகப் பொருந்துகிறது; மூலச்சொல் ‘பூமி’ என்றும் பொருள்படலாம்.
- source_word: ἐβλάστησεν
  choice: விளைவித்தது
  rationale: முளைத்து வளர்ந்து பயன் தருவதைக் குறிக்கும் வினையை, καρπός உடனான இணைப்பில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν καρπὸν αὐτῆς
  choice: தன் விளைச்சலை
  rationale: இங்கு καρπός வேளாண்மைப் பயனை அல்லது அறுவடை விளைவைச் சுட்டுகிறது; ‘கனி’ என்பதைவிட ‘விளைச்சல்’ சூழலுக்கு தெளிவானது.
theological_decisions:
- issue: எலியாவின் ஜெபத்திற்குப் பின்வந்த இறைமறுமொழி
  choice: கடவுளின் செயலை விளக்கமாகச் சேர்க்காமல், வானம் மழை தந்தது என்றும் நிலம் விளைச்சலை விளைவித்தது என்றும் மூலத்தின் வெளிப்பாட்டைப் பாதுகாத்தல்.
  alternative: ‘கடவுள் மழையை அனுப்பினார்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: சூழல் இறைமறுமொழியைத் தெளிவாக உணர்த்தினாலும், இவ்வசனம் வானமும் நிலமும் செய்தவற்றையே இலக்கண எழுவாய்களாகக் கூறுகிறது. மொழிபெயர்ப்பு அந்த இறையியல் உட்பொருளை விளக்கவுரையாகச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘ஜெபித்தார்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாகப் புரியப்படும் சொல். ‘மழை தந்தது’ என்ற சொல்லாட்சி மூலத்தின் உருவகத்தைத் தக்கவைத்தும் தமிழில் இயல்பாகவும் உள்ளது.
