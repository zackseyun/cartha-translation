source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: ta
  text: பாவி ஒருவரை அவரது வழிதவறுதலிலிருந்து திருப்புகிறவர், அவரது ஆத்துமாவை மரணத்திலிருந்து காப்பாற்றுவார்; ஏராளமான பாவங்களை மூடுவார் என்பதை அறிந்துகொள்ளட்டும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரது உயிரை மரணத்திலிருந்து காப்பாற்றுவார்.” கிரேக்கச் சொல் “ஆத்துமா” அல்லது “உயிர்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவரது” என்பது திருப்பப்பட்ட பாவியைக் குறிக்கலாம்; சிலர் அது அவரைத் திருப்பியவரைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: அறிந்துகொள்ளட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὁ ἐπιστρέψας
  choice: திருப்புகிறவர்
  rationale: வழிதவறியவரை மீண்டும் சரியான வழிக்குக் கொண்டுவரும் பொருளைத் தருகிறது; சமயத் தொழில்நுட்பச் சொல்லைத் திணிக்கவில்லை.
- source_word: ἁμαρτωλὸν
  choice: பாவி ஒருவரை
  rationale: குறிப்பிட்ட ஒருவரை அல்லாமல் பொதுவகையாகக் கூறும் பெயர்ச்சொல்லின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: அவரது தவறான வழியிலிருந்து
  rationale: πλάνη என்பதிலுள்ள தவறு அல்லது வழிதவறுதல் என்ற கருத்தையும், ὁδός என்பதிலுள்ள வாழ்க்கைநெறி உருவகத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: σώσει
  choice: காப்பாற்றி
  rationale: σῴζω என்பதன் மீட்பு மற்றும் இரட்சிப்பு சார்ந்த நிறையைத் தக்கவைக்கிறது.
- source_word: ψυχὴν αὐτοῦ
  choice: அவரது ஆத்துமாவை
  rationale: ψυχή என்பதன் ‘ஆத்துமா’ என்ற முறையான பொருளைத் தக்கவைக்கிறது; ‘உயிர்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது. αὐτοῦ யாரைக் குறிக்கிறது என்ற தெளிவின்மையும் தமிழிலுள்ள ‘அவரது’ மூலம் நிலைக்கிறது.
- source_word: ἐκ θανάτου
  choice: மரணத்திலிருந்து
  rationale: உடல் மரணமா ஆன்மிக மரணமா என்று மூலவசனம் வரையறுக்காததால் பரந்த சொல்லையே தக்கவைக்கிறது.
- source_word: καλύψει
  choice: மூடுவார்
  rationale: பாவங்கள் மூடப்படுதல் என்ற வேதாகம உருவகத்தை விளக்கிச் சுருக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πλῆθος ἁμαρτιῶν
  choice: திரளான பாவங்களை
  rationale: பெரும் எண்ணிக்கையிலான பாவங்கள் என்ற கூட்டுப் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: ψυχὴν αὐτοῦ என்பதில் αὐτοῦ குறிக்கும் நபர்
  choice: முதன்மை உரையில் ‘அவரது’ என்று குறிக்கும் நபரைத் தீர்மானிக்காமல் விடுதல்
  alternative: அது திருப்பப்பட்ட பாவியையோ, அவரைத் திருப்பியவரையோ குறிக்கலாம்
  rationale: கிரேக்கப் பிரதிப்பெயரின் இலக்கணத் தெளிவின்மையை மொழிபெயர்ப்பில் அமைதியாகத் தீர்க்காமல் பாதுகாக்கிறது.
- issue: ψυχή மற்றும் θάνατος ஆகியவற்றின் பொருள் வரம்பு
  choice: ‘ஆத்துமா’ மற்றும் ‘மரணம்’ என்ற பரந்த சொற்களை வைத்திருத்தல்
  alternative: ‘உயிரை மரணத்திலிருந்து’ அல்லது குறிப்பாக ‘ஆன்மிக மரணத்திலிருந்து ஆத்துமாவை’
  rationale: வசனம் உயிர் காக்கப்படுதல், ஆன்மிக இரட்சிப்பு, அல்லது இரண்டையும் சுட்டக்கூடும்; ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாக அதைக் குறுக்கவில்லை.
- issue: καλύψει πλῆθος ἁμαρτιῶν என்பதிலுள்ள பாவங்களின் உரிமையாளர்
  choice: ‘திரளான பாவங்களை மூடுவார்’ என்று உரிமையாளரைச் சேர்க்காமல் விடுதல்
  alternative: பாவியின் பாவங்கள் அல்லது திருப்புகிறவரின் பாவங்கள்
  rationale: மூலவசனம் யாருடைய பாவங்கள் என்று வெளிப்படையாகக் குறிப்பிடாததால் அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆத்துமா’, ‘மரணம்’, ‘மூடுதல்’ ஆகிய சொற்கள் மூலத்தின் இறையியல் நிறையையும் உருவகத்தையும் தக்கவைக்கின்றன; அடிக்குறிப்புகள் உண்மையான சொற்பொருள் மற்றும் பிரதிப்பெயர் தெளிவின்மைகளைப் பதிவு செய்கின்றன.
