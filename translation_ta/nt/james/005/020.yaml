revisions:
- from: பாவி ஒருவரை அவரது தவறான வழியிலிருந்து திருப்புகிறவர், அவரது ஆத்துமாவை மரணத்திலிருந்து காப்பாற்றி, திரளான பாவங்களை மூடுவார் என்பதை அறிந்துகொள்ளட்டும்[a][b].
  to: பாவி ஒருவரை அவரது வழிதவறுதலிலிருந்து திருப்புகிறவர், அவரது ஆத்துமாவை மரணத்திலிருந்து காப்பாற்றுவார்; ஏராளமான பாவங்களை மூடுவார் என்பதை அறிந்துகொள்ளட்டும்[a][b].
  rationale: The revision preserves the Greek imperative and the ambiguity of αὐτοῦ while correcting the coordination of the two future verbs. It also uses more natural modern Tamil for the sinner’s wandering and for “a multitude of sins,” without specifying whose sins are covered or narrowing “death” to a particular theological sense.
