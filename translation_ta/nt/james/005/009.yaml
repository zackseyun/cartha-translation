id: JAS.5.9
reference: James 5:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: ta
  text: சகோதரர்களே[a], நீங்கள் நியாயந்தீர்க்கப்படாதபடி ஒருவருக்கு எதிராக ஒருவர் முணுமுணுக்காதீர்கள். இதோ, நீதிபதி கதவுகளுக்கு முன்பாக நிற்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது கிரேக்க ἀδελφοί (adelphoi) என்பதன் மொழிபெயர்ப்பு. சூழலின்படி இச்சொல் பெண்கள் உட்பட சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: முணுமுணுக்காதீர்கள்
  rationale: κατ’ ἀλλήλων என்பதுடன் வருவதால், இது வெறும் உள்ளார்ந்த பெருமூச்சைக் குறிக்காமல், சக விசுவாசிகளுக்கு எதிரான அதிருப்தியையும் குறைகூறலையும் குறிக்கிறது. ‘முணுமுணுக்காதீர்கள்’ இந்த உறவுசார் ஒழுக்க வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை விளிவடிவமாக இருந்தாலும், சூழலின்படி பெண்கள் உட்பட முழு விசுவாசக் குழுவையும் அழைக்க முடியும். மூல வடிவத்தைத் தக்கவைத்து, அதன் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: κατ’ ἀλλήλων
  choice: ஒருவருக்கு எதிராக ஒருவர்
  rationale: κατά உடன் வரும் ஆறாம் வேற்றுமை இங்கு மற்றவரை நோக்கிய எதிர்ப்பையோ பகைமையான மனப்பான்மையையோ காட்டுகிறது. இந்தத் தொடர்பியல் பதற்றத்தை மொழிபெயர்ப்பு தெளிவாகப் பாதுகாக்கிறது.
- source_word: κριθῆτε
  choice: நீங்கள் நியாயந்தீர்க்கப்படாதபடி
  rationale: κρίνω என்பதன் இறந்தகாலச் செயப்பாட்டு வாய்பாட்டு வடிவம் ‘தீர்ப்பளிக்கப்படுதல்’ என்ற பொருளைத் தருகிறது. ‘தண்டிக்கப்படுதல்’ என்று மொழிபெயர்ப்பது தீர்ப்பின் முடிவை அளவுக்கு மீறி முன்கூட்டியே நிர்ணயித்துவிடும்.
- source_word: κριτὴς
  choice: நீதிபதி
  rationale: இது இறுதிக்காலத் தெய்வீக நீதிபதியைக் குறிக்கிறது. ஆனால் அவர் யார் என்பதை மூலத்தைவிட அதிகமாகக் குறிப்பிடாமல், பட்டப்பெயரின் வலிமையைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: πρὸ τῶν θυρῶν
  choice: கதவுகளுக்கு முன்பாக
  rationale: மூலத்திலுள்ள பன்மை வடிவம் பாதுகாக்கப்படுகிறது. இந்தச் சொற்றொடர் துல்லியமான இடவிளக்கத்தைவிட நீதிபதியின் அண்மையையும் உடனடியான வருகையையும் உணர்த்துகிறது.
- source_word: ἕστηκεν
  choice: நிற்கிறார்
  rationale: நிறைவுக் கால வடிவம், வந்து நின்றதன் விளைவாக இப்போது அங்கே நிற்கும் நிலையைக் காட்டுகிறது. ‘நிற்கிறார்’ தற்போதைய ஆயத்த நிலையைக் காட்சிப்படுத்தும் இயல்பான தமிழ்.
theological_decisions:
- issue: ‘நீதிபதி’ என்பவரின் அடையாளம்
  choice: இறுதிக்காலத் தெய்வீக நீதிபதி; சூழலில் இயல்பாக ஆண்டவர்/கிறிஸ்துவைக் குறிக்கக்கூடும்
  alternative: பொதுவாக நீதிபதியாகிய கடவுள்
  rationale: யாக்கோபின் உடன்வரும் நீதித்தீர்ப்பு மொழி ஆண்டவரின் வருகையை எதிர்நோக்குகிறது. எனினும் கிரேக்கம் ‘நீதிபதி’ என்று மட்டுமே சொல்வதால், மொழிபெயர்ப்பு அவரை அதற்கு மேல் குறிப்பிட்டு அடையாளப்படுத்தாமல் உண்மையான இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘நியாயந்தீர்க்கப்படுதல்’ நீதித்தீர்ப்பு என்ற வேதாகமக் கருத்தைத் துல்லியமாக வைத்திருக்கிறது; ‘முணுமுணுத்தல்’ வெறும் பெருமூச்சு அல்லாமல் பிறருக்கு எதிரான அதிருப்திக் குறைகூறலை வெளிப்படுத்துகிறது. மூலத்தின் ‘கதவுகள்’ என்ற பன்மை திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது.
