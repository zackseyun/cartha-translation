  text: Ἀδελφοί ⸀μου, ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: ta
  text: என் சகோதரர்களே[a], உங்களில் ஒருவன் சத்தியத்திலிருந்து வழிதவறினால்[b], யாராவது அவனைத் திரும்பக் கொண்டுவந்தால்[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ஆண்பால் பன்மை அழைப்புமுறை இருந்தாலும், அது முழுச் சமூகத்தையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “சத்தியத்தை விட்டு வழிதவறினால்,” “சத்தியத்திலிருந்து வழிதவறச் செய்யப்படினால்,” அல்லது “ஏமாற்றப்பட்டுச் சத்தியத்திலிருந்து விலகினால்” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவனைத் திரும்பச் செய்தால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: உடைமைச் சொல்லையும் நேரடி அழைப்பையும் இயல்பான நவீன தமிழில் காக்கிறது. கிரேக்கப் பன்மை ஆண்பால் வடிவம் முழுச் சமூகத்தையும் உள்ளடக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: உங்களில் ஒருவன் ... போது
  rationale: τις என்பதன் ஒருமை, குறிப்பிடப்படாத நபர் என்ற பொருளை ‘ஒருவன்’ காக்கிறது. நிபந்தனையைத் தொடரும் ἐπιστρέψῃ உடன் இணைத்து தமிழில் இயல்பாக ‘...போது ... கொண்டுவந்தால்’ என அமைக்கப்பட்டுள்ளது.
- source_word: πλανηθῇ
  choice: வழிதவறிப்போகும்போது
  rationale: πλανάω என்ற வினையின் இச்சூழலுக்குரிய தவறான வழிக்குச் செல்லுதல் என்ற பொருளைத் தருகிறது; கிரேக்கப் passive வடிவம் ஏமாற்றப்படுதல் என்ற நிழற்பொருளையும் அனுமதிப்பதால் அதை அடிக்குறிப்பில் காக்கிறது.
- source_word: ἀπὸ τῆς ἀληθείας
  choice: சத்தியத்தைவிட்டு
  rationale: ἀπό குறிக்கும் விலகுதலையும் ἡ ἀλήθεια என்பதன் திட்டவட்டமான ‘சத்தியம்’ என்ற பொருளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; சுவிசேஷம் அல்லது கிறிஸ்தவ வாழ்க்கை என்று அளவுக்கு மீறி விளக்கவில்லை.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: வேறொருவன் அவனைத் திரும்பக் கொண்டுவந்தால்
  rationale: இரண்டாவது τις வேறு குறிப்பிடப்படாத ஒருவரைக் குறிக்கிறது. ἐπιστρέφω இங்கு வழிதவறியவரை மீளச் செய்தல் என்பதால் ‘திரும்பக் கொண்டுவருதல்’ இயல்பாக உள்ளது; ‘அவனை’ கிரேக்க ஒருமை ஆண்பால் சுட்டுப்பெயரைப் பேணுகிறது.
theological_decisions:
- issue: நேரடி அழைப்பிலும் சுட்டுப்பெயரிலும் உள்ள பாலின மொழி
  choice: முதன்மை உரையில் ‘சகோதரர்களே’, ‘ஒருவன்’, ‘அவனை’ என்ற ஆண்பால் வடிவங்களை வைத்தல்
  alternative: ‘சகோதர சகோதரிகளே’, ‘ஒருவர்’, ‘அவரை’
  rationale: கிரேக்கத்தில் ஆண்பால் வடிவங்கள் உள்ளன; அவை முழுச் சமூகத்தையும் உள்ளடக்கக்கூடும் என்ற பிரதிநிதித்துவப் பொருளை அடிக்குறிப்பு விளக்குகிறது. தமிழில் மரியாதை ஒருமை தேவையில்லாத இடத்தில் அது பொருளை மாற்றக்கூடும்.
- issue: πλανηθῇ என்பதன் செயப்பாட்டு வடிவமும் பொருள் நெகிழ்வும்
  choice: முதன்மை உரையில் ‘வழிதவறிப்போகும்போது’
  alternative: ‘சத்தியத்திலிருந்து வழிதவறச் செய்யப்படும்போது’ அல்லது ‘ஏமாற்றப்பட்டுச் சத்தியத்தைவிட்டு விலகும்போது’
  rationale: இச்சூழலில் நடுநிலை/உள்ளார்ந்த செயப்பாட்டு உணர்வுடன் ‘வழிதவறுதல்’ இயல்பாகப் புரிகிறது; இருந்தாலும் வெளிப்புற ஏமாற்றுதல் அல்லது வழிதவறச் செய்தல் என்ற உண்மையான சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- issue: ἐπιστρέψῃ என்பதில் செய்பவர் ஏற்படுத்தும் மீட்சி
  choice: ‘திரும்பக் கொண்டுவந்தால்’
  alternative: ‘திரும்பச் செய்தால்’ அல்லது ‘திருப்பினால்’
  rationale: வழியிலிருந்து விலகி மீண்டும் வருதல் என்ற உருவகத்தையும் மற்றொருவரின் செயலையும் இது தெளிவாகக் காட்டுகிறது; மனந்திரும்புதல் என்ற குறிப்பிட்ட இறையியல் சொல்லை கிரேக்கத்தைவிட அதிகமாக இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதவாக்கியத்துக்குரிய கண்ணியமும் கொண்ட நடை. ‘சத்தியம்’ என்பது பொதுவாகப் புரியும் திருச்சபைச் சொல்; மூலத்தில் இல்லாத குறிப்பிட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
