id: JAS.5.11
reference: James 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: ta
  text: இதோ, சகித்துநின்றவர்களைப் பேறுபெற்றவர்கள் என்று நாம் கூறுகிறோம். யோபின் சகிப்புத்தன்மையைப் பற்றிக் கேட்டிருக்கிறீர்கள்; ஆண்டவர் ஏற்படுத்திய முடிவையும் கண்டிருக்கிறீர்கள். ஏனெனில் ஆண்டவர் மிகுந்த பரிவும் இரக்கமும் உள்ளவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίζομεν
  choice: பேறுபெற்றவர்கள் என்று நாம் கூறுகிறோம்
  rationale: ஒருவரைப் பேறுபெற்றவர் என மதித்துக் கூறுதல் என்ற செயற்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπομείναντας / ὑπομονὴν
  choice: சகித்துநின்றவர்களை / சகிப்புத்தன்மையை
  rationale: சோதனையின் கீழ் நிலைத்திருத்தல் என்னும் பொதுவான கருத்தை இரு இடங்களிலும் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: τὸ τέλος κυρίου
  choice: ஆண்டவர் ஏற்படுத்திய முடிவு
  rationale: τέλος என்பதன் ‘இறுதி விளைவு/முடிவு’ என்ற பொருளைப் பாதுகாக்கிறது; அதை ‘நோக்கம்’ என்று விளக்கி இறையியல் தீர்மானம் செய்வதைத் தவிர்க்கிறது. ‘ஆண்டவருடைய முடிவு’ என்ற தமிழ்ச் சொற்றொடர் ஆண்டவருக்கே ஏற்பட்ட முடிவு எனத் தவறாகப் புரியக்கூடும் என்பதால் செயற்பாட்டு உறவு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: πολύσπλαγχνος
  choice: மிகுந்த பரிவு உள்ளவர்
  rationale: ஆழ்ந்த, பெருகிய கனிவையும் மனமிரக்கத்தையும் குறிக்கும் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: οἰκτίρμων
  choice: இரக்கம் உள்ளவர்
  rationale: இரங்கும் தன்மையை நேரடியாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸ τέλος κυρίου என்பதன் பொருள்
  choice: ஆண்டவர் ஏற்படுத்திய முடிவு
  alternative: ஆண்டவரின் நோக்கம்
  rationale: யோபின் துன்பத்தின் இறுதியில் ஆண்டவர் கொண்டுவந்த விளைவைச் சூழல் சுட்டுகிறது. ‘நோக்கம்’ என்பது சாத்தியமான விளக்கம் என்றாலும், மூலச்சொல்லின் உண்மையான பரப்பைச் சுருக்கிவிடும்.
- issue: κύριος என்பவரின் அடையாளம்
  choice: ஆண்டவர்
  alternative: யெகோவா / இயேசு
  rationale: இவ்வசனம் அடையாளத்தை வெளிப்படையாகத் தீர்மானிக்காததால், κύριος என்பதற்கான பொதுவான மரியாதைப் பெயரைப் பாதுகாத்து, குறிப்பிட்ட அடையாளத்தை உரைக்குள் இறக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்பது ἰδού-வின் உரையாடல் வலியுறுத்தலைப் பாதுகாக்கிறது; நீளமான கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
