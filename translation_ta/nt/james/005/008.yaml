source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: ta
  text: நீங்களும் பொறுமையாயிருங்கள்; உங்கள் இதயங்களை உறுதிப்படுத்துங்கள். ஏனெனில் ஆண்டவரின் வருகை[a] நெருங்கிவிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரின் உடனிருப்பு.” கிரேக்கச் சொல் “உடனிருப்பு” அல்லது “வருகை” என்று பொருள்படலாம்; இச்சூழலில் அது ஆண்டவரின் இறுதிக்கால வருகையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: பொறுமையாயிருங்கள்
  rationale: இது பன்மை ஏவல் வடிவம்; துன்பத்திலும் தூண்டுதலிலும் நீடிய பொறுமையுடன் நிலைத்திருப்பதைக் குறிக்கிறது. சூழலுக்கும் நவீன தமிழுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட எடுத்துக்காட்டோடு வாசகர்களை இணைக்கும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: στηρίξατε
  choice: உறுதிப்படுத்துங்கள்
  rationale: உறுதியாக்குதல் அல்லது நிலைநிறுத்துதல் என்ற பொருளுடைய பன்மை ஏவலை வெளிப்படுத்துகிறது; உள்ளார்ந்த மனவுறுதியை வளர்த்துக்கொள்ள வேண்டும் என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: τὰς καρδίας ὑμῶν
  choice: உங்கள் இதயங்களை
  rationale: மனவுறுதி, விருப்பம், உள்ளார்ந்த மனிதர் ஆகியவற்றை உள்ளடக்கும் வேதாகம உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய இரு கட்டளைகளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἡ παρουσία
  choice: வருகை
  rationale: இந்த இறுதிக்காலச் சூழலில் ஆண்டவரின் வருதல் அல்லது வந்து சேர்தல் என்பதே முதன்மைப் பொருள்; அதேவேளையில் ‘உடனிருப்பு’ என்ற சொல்லியல் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்ற பட்டத்திற்கான இயல்பான, மரியாதைமிக்க நவீனத் தமிழ் இணை; இங்கு இறுதிக்காலச் சூழலில் இயேசுவைக் குறிக்கிறது.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டது
  rationale: நெருக்கம் ஏற்பட்டுவிட்டதையும் அதன் விளைவு தற்போது தொடர்வதையும் உணர்த்தும் நிறைவுநிலை வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆண்டவரைக் குறித்த இறுதிக்காலக் கூற்றில் παρουσία என்பதன் பொருள்
  choice: ஆண்டவரின் வருகை
  alternative: ஆண்டவரின் உடனிருப்பு
  rationale: παρουσία என்பது சொல்லியல் ரீதியாக ‘உடனிருப்பு’ என்றும் பொருள்படலாம். ஆனால் யாக்கோபு 5:7–8-இன் எதிர்நோக்கும் சூழலில் ஆண்டவரின் வரவிருக்கும் இறுதிக்கால வருகையே முன்னிலையில் உள்ளது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டதால் உண்மையான சொல்லியல் விரிவு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதயங்கள்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டு, கட்டளைகளின் பன்மை வடிவமும் மூலத்தின் காரணத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
