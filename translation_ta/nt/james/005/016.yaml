id: JAS.5.16
reference: James 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: ta
  text: ஆகையால், நீங்கள் குணமடையும்படி ஒருவரிடம் ஒருவர் உங்கள் பாவங்களை அறிக்கையிட்டு, ஒருவருக்காக ஒருவர் வேண்டிக்கொள்ளுங்கள். நீதியுள்ள ஒருவரின் மன்றாட்டு செயல்படும்போது மிகுந்த வல்லமை கொண்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியுள்ள ஒருவரின் விண்ணப்பம் செயல்படும்போது பெரும் ஆற்றல் உடையது.”
    reason: δέησις மற்றும் ἐνεργουμένη ஆகியவற்றின் மாற்று சொற்பொருளையும் கடைசி வாக்கியத்தின் சாத்தியமான அமைப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: அறிக்கையிடுங்கள்
  rationale: பாவங்களை வெளிப்படையாக ஒப்புக்கொள்வதைக் குறிக்கிறது. பரஸ்பரச் சூழலில் இயல்பாக இருப்பதோடு, முறையான திருச்சடங்கு சார்ந்த பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய பகுதியில் வரும் ஜெபம், பாவம், மீட்பு ஆகியவற்றிலிருந்து பெறப்படும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀλλήλοις
  choice: ஒருவரிடம் ஒருவர்
  rationale: பரஸ்பரமாக அறிக்கையிட வேண்டும் என்ற கிரேக்கத் தொடரின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὰς ἁμαρτίας
  choice: உங்கள் பாவங்களை
  rationale: பரஸ்பரக் கட்டளையின் சூழலில் தமிழில் இயல்பாகத் தேவைப்படும் உடைமைச் சொல்லைச் சேர்த்து, ἁμαρτίας என்பதன் நேரடிப் பொருளைப் பேணுகிறது.
- source_word: εὔχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: இங்கு பிறருக்காகச் செய்யப்படும் ஜெபத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ἀλλήλων
  choice: ஒருவருக்காக ஒருவர்
  rationale: பிறரின் சார்பாகச் செய்யப்படும் பரிந்துரை ஜெபத்தையும் பரஸ்பரத் தன்மையையும் பேணுகிறது.
- source_word: ὅπως
  choice: நீங்கள் ...ும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἰαθῆτε
  choice: குணமடைய
  rationale: உடல் நலமடைதலை மட்டும் அல்லது ஆன்மிக மீட்சியை மட்டும் என்று குறுக்காமல், கிரேக்கச் சொல்லின் பரந்த ‘குணமடைதல்’ பொருளைப் பேணுகிறது.
- source_word: πολὺ ἰσχύει
  choice: மிகுந்த வல்லமை கொண்டது
  rationale: மன்றாட்டின் பெரும் ஆற்றல் அல்லது பயன்திறனை, அதன் விளைவை அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
- source_word: δέησις
  choice: மன்றாட்டு
  rationale: பொதுவான ‘ஜெபம்’ என்பதைவிட வேண்டுதல் அல்லது விண்ணப்பம் என்ற குறிப்பான நுண்பொருளைத் தமிழில் தருகிறது.
- source_word: δικαίου
  choice: நீதியுள்ள ஒருவரின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை அடைமொழியின் பொதுப்பொருளை பாலினம் சுட்டாமல் இயல்பாகத் தருகிறது.
- source_word: ἐνεργουμένη
  choice: செயல்படும்போது
  rationale: மன்றாட்டு செயலாற்றுகிறது என்ற நடுநிலை/செயப்பாட்டு நுண்பொருளை முழுமையாகத் தீர்மானிக்காமல், அது செயலிலிருக்கும் நிலையைப் பேணுகிறது.
theological_decisions:
- issue: இந்த வசனம் குருத்துவப் பணியாளரிடம் திருச்சடங்கு முறையில் பாவ அறிக்கை செய்வதைக் கட்டளையிடுகிறதா, அல்லது விசுவாசிகள் பரஸ்பரம் பாவங்களை அறிக்கையிடுவதைக் கூறுகிறதா?
  choice: ஒருவரிடம் ஒருவர் பரஸ்பரம் பாவங்களை அறிக்கையிடுதல்
  alternative: திருநிலைப்படுத்தப்பட்ட குருத்துவப் பணியாளர் வழியாகப் பாவ அறிக்கை செய்தல்
  rationale: ἀλλήλοις என்ற பரஸ்பரப் பெயர்ச்சொல், அழைக்கப்படும் சமூகத்தினர் ஒருவரிடம் ஒருவர் அறிக்கையிடுவதை நேரடியாகக் குறிக்கிறது. பிற திருச்சபைப் பயன்பாடுகளை மறுக்காமலும், அவற்றை வசனத்துக்குள் புகுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: ἰαθῆτε குறிப்பிடும் குணமடைதலின் எல்லை
  choice: உடல் அல்லது ஆன்மிகம் என்று குறுக்காமல் ‘குணமடைய’
  alternative: உடலில் மட்டும் குணமடைதல்; ஆன்மிகமாக மட்டும் குணமடைதல்
  rationale: யாக்கோபு 5-இன் உடனடிச் சூழலில் உடல்நோய் முக்கியமாக இருந்தாலும், பாவங்களின் குறிப்பு பொருள் எல்லையை விரிவாக்குகிறது. எனவே மூலத்தின் இறையியல் இழுவிசை பேணப்படுகிறது.
- issue: δικαίου என்பதன் பாலின வெளிப்பாடு
  choice: நீதியுள்ள ஒருவர்
  alternative: நீதிமான்
  rationale: கிரேக்க வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும், பழமொழித் தன்மையுள்ள இவ்வாக்கியத்தில் பொதுவான ஒரு நபரைக் குறிக்கிறது. ‘ஒருவர்’ என்பது அந்தப் பொதுப்பொருளைப் பாலினம் சுட்டாமல் துல்லியமாகத் தருகிறது.
- issue: ἐνεργουμένη என்பதன் நடுநிலை அல்லது செயப்பாட்டு நுண்பொருள்
  choice: செயல்படும்போது
  alternative: செயலாற்றும்போது; செயலூட்டப்படும்போது
  rationale: இப்பெயரெச்சத்தின் இலக்கணக் குரலும் தொடர்பும் விளக்கத்துக்குரியவை. தேவன் செயலூட்டுகிறார் என்ற மறைமுகச் செயப்பாட்டு வாசிப்பையோ, ஜெபமே தன்னால் செயலாற்றுகிறது என்ற வலுவான நடுநிலை வாசிப்பையோ மொழிபெயர்ப்பு கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அறிக்கையிடுங்கள்,’ ‘மன்றாட்டு,’ ‘வல்லமை’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற மரியாதையான சொற்களாக இருந்தாலும் பழமையான நடையை உருவாக்காதவாறு அமைக்கப்பட்டுள்ளன. [a] குறிப்பு அது சார்ந்த இறுதி வாக்கியத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
