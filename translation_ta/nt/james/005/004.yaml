revisions:
- from: இதோ, உங்கள் வயல்களை அறுவடை செய்த தொழிலாளர்களுக்குரிய கூலியை நீங்கள் கொடுக்காமல் வைத்திருக்கிறீர்கள்; அந்தக் கூலி கூக்குரலிடுகிறது. அறுவடை செய்தவர்களின் கூக்குரல்கள் சேனைகளின் ஆண்டவருடைய[a] செவிகளை எட்டியுள்ளன.
  to: இதோ, உங்கள் வயல்களை அறுவடை செய்த தொழிலாளர்களுக்குரிய, நீங்கள் கொடுக்காமல் வைத்திருக்கும் கூலி கூக்குரலிடுகிறது; அறுவடை செய்தவர்களின் கூக்குரல்கள் சேனைகளின் ஆண்டவரின்[a] செவிகளை எட்டியுள்ளன.
  rationale: The revision retains all of the draft’s lexical and theological choices while placing “நீங்கள் கொடுக்காமல் வைத்திருக்கும்” directly with “கூலி,” corresponding to the Greek participial qualification of the wage. It also makes the final possessive phrase more idiomatic Tamil without changing the source imagery or sense.
  reviewer_model: gpt-5.6-terra
