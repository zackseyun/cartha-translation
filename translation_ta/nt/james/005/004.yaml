    reason: alternative_reading
  revision_rationale: The revision retains all of the draft’s lexical and theological choices while placing “நீங்கள் கொடுக்காமல் வைத்திருக்கும்” directly with “கூலி,” corresponding to the Greek participial qualification of the wage. It also makes the final possessive phrase more idiomatic Tamil without changing the source imagery or sense.
