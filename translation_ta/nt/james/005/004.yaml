id: JAS.5.4
reference: James 5:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: ta
  text: இதோ, உங்கள் வயல்களை அறுவடை செய்த தொழிலாளர்களுக்குரிய, நீங்கள் கொடுக்காமல் வைத்திருக்கும் கூலி கூக்குரலிடுகிறது; அறுவடை செய்தவர்களின் கூக்குரல்கள் சேனைகளின் ஆண்டவரின்[a] செவிகளை எட்டியுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சபாவோத் ஆண்டவர்.” கிரேக்க உரை எபிரேயப் பட்டமான “சபாவோத்” என்பதை ஒலிபெயர்த்தே வைத்துள்ளது; அதற்கு “சேனைகள்” அல்லது “படைகள்” என்று பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் குற்றச்சாட்டை வலியுறுத்தும் இயல்பான வேதாகமத் தமிழ் சொல்.
- source_word: μισθὸς τῶν ἐργατῶν
  choice: தொழிலாளர்களுக்குரிய கூலி
  rationale: μισθός ஒருமையில் இருப்பதை ‘கூலி’ காக்கிறது; உரிமை/சம்பந்தத்தைத் தமிழில் தெளிவாகக் காட்ட ‘-க்குரிய’ பயன்படுத்தப்படுகிறது.
- source_word: ἀμησάντων τὰς χώρας ὑμῶν
  choice: உங்கள் வயல்களை அறுவடை செய்த
  rationale: ἀμάω என்பதன் அறுவடைச் சூழலை நவீன வாசகருக்குத் தெளிவாகக் கூறுகிறது; χώρας இங்கு பயிரிடப்பட்ட வயல்களைக் குறிக்கிறது.
- source_word: ὁ ἀφυστερημένος ἀφ’ ὑμῶν
  choice: நீங்கள் கொடுக்காமல் வைத்திருக்கிறீர்கள்
  rationale: கொடுப்பதற்குரிய கூலியைத் தடுத்து வைத்திருப்பதை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது; ‘மோசடி செய்தீர்கள்’ என காரணத்தை மிகையாக விளக்கவில்லை.
- source_word: κράζει
  choice: கூக்குரலிடுகிறது
  rationale: கூலியே நீதிக்காகக் குரலெழுப்புவதாக வரும் உயிரூட்டப்பட்ட உருவகத்தைப் பாதுகாக்கிறது; கிரேக்க ஒருமை வினைக்கும் ஒத்திருக்கிறது.
- source_word: βοαὶ τῶν θερισάντων
  choice: அறுவடை செய்தவர்களின் கூக்குரல்கள்
  rationale: அவசரமான உதவி அல்லது நீதிக்கான உரத்த முறையீட்டை ‘கூக்குரல்கள்’ வெளிப்படுத்துகிறது; θερίζω-வின் விவசாயப் பொருளை ‘அறுவடை செய்தவர்கள்’ தருகிறது.
- source_word: εἰς τὰ ὦτα ... εἰσεληλύθασιν
  choice: செவிகளை எட்டியுள்ளன
  rationale: செவிகளை நோக்கி வந்தடைந்துள்ளன என்ற உருவகத்தையும், நிறைவுற்ற செயல் தற்போது விளைவுடன் இருப்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Κυρίου Σαβαὼθ
  choice: சேனைகளின் ஆண்டவர்
  rationale: Σαβαώθ என்ற எபிரேயத் தெய்வீகப் பட்டத்தின் ‘படைகள்/சேனைகள்’ என்னும் பொருளை மொழிபெயர்த்து, κύριος என்பதை மரியாதையான ‘ஆண்டவர்’ என வழங்குகிறது.
theological_decisions:
- issue: Κυρίου Σαβαὼθ என்ற தெய்வீகப் பட்டத்தை வழங்குதல்
  choice: சேனைகளின் ஆண்டவர்
  alternative: சபாவோத் ஆண்டவர்
  rationale: இது கடவுளுக்கான பழைய ஏற்பாட்டுப் பின்னணியுள்ள பட்டம். பிரதான உரையில் அதன் பொருளைத் தமிழில் வழங்குவது புரிதலை மேம்படுத்துகிறது; கிரேக்கத்தில் பாதுகாக்கப்பட்ட எபிரேய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழும் பொதுப் புரிதலும் இணையும் கண்ணியமான நடை. ‘கூலி கூக்குரலிடுகிறது’ என்ற தீவிரமான உருவகம் மாற்றமின்றிக் காக்கப்பட்டது; நீளமான கிரேக்க வாக்கியம் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
