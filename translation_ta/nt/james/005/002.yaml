translation:
  language: ta
  text: உங்கள் செல்வம் அழுகிப்போயிருக்கிறது; உங்கள் உடைகள் அந்துப்பூச்சிகளால் அரிக்கப்பட்டிருக்கின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: செல்வம்
  rationale: திரட்டிவைக்கப்பட்ட பொருளாதார வளத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; இங்கு செல்வந்தர்களுக்கு எதிரான கண்டனத்திற்கும் பொருந்துகிறது.
- source_word: σέσηπεν
  choice: அழுகிப்போயிருக்கிறது
  rationale: அழுகியதன் விளைவாக இப்போது நிலவும் நிலையைக் கிரேக்க இறந்தகால நிறைவு வடிவம் உணர்த்துகிறது. இந்தத் தேர்வு நிகழ்ந்த அழிவையும் அதன் தற்போதைய விளைவையும் காக்கிறது.
- source_word: ἱμάτια
  choice: உடைகள்
  rationale: பலவகையான ஆடைகளையும் உள்ளடக்கும் தெளிவான, இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: σητόβρωτα
  choice: அந்துப்பூச்சிகளால் அரிக்கப்பட்டிருக்கின்றன
  rationale: பூச்சிகளால் உண்ணப்பட்ட ஆடைகள் என்ற தெளிவான காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γέγονεν
  choice: அரிக்கப்பட்டிருக்கின்றன
  rationale: உடைகள் அரிக்கப்பட்டு, அதன் விளைவான நிலையில் இப்போது இருப்பதைத் தமிழின் நிறைவு-நிலை அமைப்பால் வெளிப்படுத்துகிறது.
