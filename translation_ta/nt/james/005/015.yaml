id: JAS.5.15
reference: James 5:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: ta
  text: விசுவாசத்தின் ஜெபம்[a] நோயுற்றவரைக் காப்பாற்றும்[b]; ஆண்டவர் அவரை எழுப்புவார். அவர் பாவங்களைச் செய்திருந்தால்[c], அவை அவருக்கு மன்னிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத்தின் ஜெபம்’ என்பதை ‘கடவுள்மீது நம்பிக்கை கொண்ட ஜெபம்’ என்றும் புரிந்துகொள்ளலாம்; இங்கு ‘உண்மைத்தன்மையால் குறிக்கப்படும் ஜெபம்’ என்பது குறைந்த சாத்தியமுள்ள பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘குணமாக்கும்’ அல்லது ‘நலம்பெறச் செய்யும்’; கிரேக்கத்தில் ‘காப்பாற்றும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘அவர் பாவங்களைச் செய்திருந்தாலும்கூட.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: ஜெபம்
  rationale: முந்தைய வசனத்தில் மூப்பர்கள் நோயுற்றவருக்காக ஜெபிக்கும் சூழல் இருப்பதால், இங்கு εὐχή என்பது ‘நேர்த்திக்கடன்’ என்பதல்ல, ‘ஜெபம்’ என்பதைக் குறிக்கிறது.
- source_word: πίστεως
  choice: விசுவாசத்தின்
  rationale: மூலத்தின் மரபுத்தொடரைப் பாதுகாக்கும் வகையில் ‘விசுவாசத்தின் ஜெபம்’ என மொழிபெயர்க்கப்பட்டுள்ளது. இங்கு விசுவாசம் என்பது பெரும்பாலும் கடவுள்மீது நம்பிக்கை கொண்ட ஜெபத்தைக் குறிக்கிறது.
- source_word: σώσει
  choice: காப்பாற்றும்
  rationale: σῴζω என்பதன் அடிப்படைப் பொருளான ‘காப்பாற்றுதல்’ பாதுகாக்கப்படுகிறது; நோயைப் பற்றிய உடனடிச் சூழலில் இது குணமடைதல் அல்லது நலம்பெறுதல் என்ற பொருளையும் கொண்டுள்ளது.
- source_word: τὸν κάμνοντα
  choice: நோயுற்றவரை
  rationale: κάμνω என்பது களைத்துப்போதல் அல்லது நோயுற்றிருத்தல் என்று பொருள்படலாம். நோய், எண்ணெய் பூசுதல், எழுப்புதல் ஆகிய உடனடிச் சூழலால் ‘நோயுற்றவர்’ என்பது இயல்பான பொருள்.
- source_word: ἐγερεῖ
  choice: எழுப்புவார்
  rationale: ἐγείρω என்பதன் ‘எழுப்புதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் நோய்ப்படுக்கையிலிருந்து மீட்டெடுப்பதையும் குறிக்கலாம்.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டுத் தமிழ் வழக்கிலும் இங்குள்ள தெய்வீகச் செயல்பாட்டிலும் κύριος என்பதற்கு ‘ஆண்டவர்’ பொருத்தமானது.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: அவர் பாவங்கள் செய்திருந்தால்
  rationale: நிறைவேற்றப்பட்ட செயலையும் நிபந்தனையையும் தெளிவாகக் காட்டுகிறது; κἄν கொண்டுள்ள விட்டுக்கொடுக்கும் நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀφεθήσεται αὐτῷ
  choice: அவை அவருக்கு மன்னிக்கப்படும்
  rationale: பாவங்கள் மன்னிக்கப்படுவதைத் தெளிவாக்குவதோடு, தெய்வீகச் செயலை மறைமுகமாகக் காட்டும் மூலத்தின் செயல்பாட்டு வாய்ப்பாட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: σώσει என்பது உடல் குணமடைதலை மட்டும் குறிக்கிறதா, அல்லது பரந்த காப்பையும் மீட்பையும் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘காப்பாற்றும்’ என்று தரப்பட்டு, நோயின் சூழல் குணமடைதல் என்ற பொருளை உணர்த்துகிறது.
  alternative: ‘குணமாக்கும்’ அல்லது ‘நலம்பெறச் செய்யும்’
  rationale: இங்கு நோய் பற்றிப் பேசப்பட்டாலும், யாக்கோபு குறுகிய மருத்துவச் சொல்லுக்குப் பதிலாக σῴζω என்பதைப் பயன்படுத்துகிறார். ‘காப்பாற்றும்’ என்பது உடனடியான உடல் மீட்பையும் சொல்லின் பரந்த பொருளையும் தக்கவைக்கிறது.
- issue: இந்த வசனம் ஜெபத்தின் மூலம் தானாகவே, ஒவ்வொரு முறையும் உடல் குணமடைவதை உறுதி செய்கிறதா?
  choice: கிரேக்க எதிர்கால வினைச்சொற்களின் நேரடியான உறுதிப்பாட்டைச் சேர்த்துக் குறைக்காமலும் மிகைப்படுத்தாமலும் மொழிபெயர்த்தல்.
  alternative: ‘குணமாக்கக்கூடும்’ அல்லது ‘ஒவ்வொரு முறையும் நிச்சயமாகக் குணமாக்கும்’ போன்ற விளக்க உரைகள்
  rationale: மூலத்தின் உறுதியான மொழி பாதுகாக்கப்படுகிறது; அதேவேளை, எல்லா நோய்களுக்கும் தவறாமல் உடனடி குணம் கிடைக்கும் என்ற தனிப்பட்ட கோட்பாடு உரைக்குள் சேர்க்கப்படவில்லை.
- issue: எல்லா நோய்களும் தனிப்பட்ட பாவத்தால் உண்டாகின்றனவா?
  choice: 'பாவத்தைப் பற்றிய கூற்று நிபந்தனையாகவே வைக்கப்பட்டுள்ளது: ‘பாவங்கள் செய்திருந்தால்.’'
  alternative: எல்லா நோய்களுக்கும் தனிப்பட்ட பாவமே காரணம் என்று உணர்த்துதல்
  rationale: கிரேக்க உரை பாவத்தை சாத்தியமான ஒன்றாக முன்வைக்கிறது; எல்லா நோய்களுக்கும் அது காரணம் என்று கூறவில்லை. மொழிபெயர்ப்பு அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டுள்ளது. ‘விசுவாசத்தின் ஜெபம்,’ ‘ஆண்டவர்,’ ‘மன்னிக்கப்படும்’ ஆகியவை பரிச்சயமான கிறிஸ்தவச் சொற்களாக இருந்தாலும் எந்தச் சபைப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் சேர்க்கவில்லை. மூலத்தின் ‘காப்பாற்றும்’ மற்றும் ‘எழுப்புவார்’ என்ற பரந்த உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
