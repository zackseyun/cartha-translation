id: JAS.5.14
reference: James 5:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ta
  text: உங்களில் யாராவது நோயுற்றிருக்கிறாரா?[a] அவர் திருச்சபையின் மூப்பர்களை அழைக்கட்டும். அவர்கள் ஆண்டவரின் பெயரில் அவருக்கு எண்ணெய் பூசி[b], அவர்மேல் ஜெபிக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலவீனமாக இருக்கிறாரா?’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் பொதுவாகப் பலவீனத்தைக் குறிக்கக்கூடும்; ஆனால் இங்கு ஜெபம், எண்ணெய் பூசுதல், அடுத்த வசனத்தின் குணமடைதல் சார்ந்த சூழல் ஆகியவற்றால் நோய் என்பதே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எண்ணெய் பூசுதல் மருத்துவப் பயன்பாடாகவோ, அடையாளச் செயலாகவோ, இரண்டுமாகவோ புரிந்துகொள்ளப்படலாம்; அது எவ்வாறு செயல்படுகிறது என்பதை உரை குறிப்பிடவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: நோயுற்றிருக்கிறாரா
  rationale: வினைச்சொல் பொதுவாகப் பலவீனத்தையும் குறிக்கலாம். எனினும் மூப்பர்களை அழைத்தல், எண்ணெய் பூசுதல், ஜெபம், அடுத்த வசனத்தின் குணமடைதல் சார்ந்த சூழல் ஆகியவை இங்கு உடல்நோயை முதன்மையாகச் சுட்டுகின்றன.
- source_word: τις ἐν ὑμῖν
  choice: உங்களில் யாராவது
  rationale: சமூகத்திற்குள் உள்ள எந்த ஒருவரையும் பாலின வரையறையின்றிக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: προσκαλεσάσθω
  choice: அழைக்கட்டும்
  rationale: மூப்பர்களைத் தன்னிடம் வரும்படி அழைக்கும் மூன்றாம் நபர் ஒருமை கட்டளைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: திருச்சபையின் மூப்பர்களை
  rationale: இங்கு πρεσβύτεροι வெறுமனே வயதான ஆண்களை அல்ல, திருச்சபையின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: அவர்கள் அவர்மேல் ஜெபிக்கட்டும்
  rationale: பன்மைக் கட்டளையையும் ἐπί என்பதன் ‘மேல்’ என்ற இடம்சார் நுணுக்கத்தையும் காக்கிறது; அதை வெறுமனே ‘அவருக்காக’ என்று மாற்றவில்லை.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: அவருக்கு எண்ணெய் பூசி
  rationale: எண்ணெயைப் பயன்படுத்தும் செயலை இயல்பான தமிழில் கூறுகிறது; அது மருத்துவமா, அடையாளச் செயலா, இரண்டுமா என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: ஆண்டவரின் அதிகாரத்துடனும் அவரைச் சார்ந்தும் செய்யப்படும் செயலைக் குறிக்கும் வேதாகமச் சொற்றொடரின் வடிவத்தையும் இறையியல் ஒலியையும் காக்கிறது.
theological_decisions:
- issue: ἀσθενεῖ என்பதன் பொருள்
  choice: உடல்நோய் என்பதை முதன்மைப் பொருளாகக் கொண்டு ‘நோயுற்றிருக்கிறாரா’ என மொழிபெயர்த்தல்
  alternative: பலவீனமாக இருக்கிறாரா
  rationale: உடனடிச் சூழலிலுள்ள மூப்பர்கள், ஜெபம், எண்ணெய் பூசுதல், அடுத்த வசனத்தில் ஆண்டவர் எழுப்புதல் ஆகியவை உடல்நோயை வலுவாகச் சுட்டுகின்றன; பரந்த சொற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: எண்ணெய் பூசுதலின் செயல்பாடு
  choice: மருத்துவ, அடையாள அல்லது திருச்சடங்கு விளக்கத்தைத் தேர்ந்தெடுக்காமல் செயலை நடுநிலையாக மொழிபெயர்த்தல்
  alternative: மருத்துவப் பயன்பாடு மட்டும்; அடையாளச் செயல் மட்டும்; அல்லது திருச்சடங்கு மட்டும்
  rationale: கிரேக்க உரை செயலைக் கூறுகிறது; அதன் செயல்முறையையோ இறையியல் நிலைப்பாட்டையோ விளக்கவில்லை.
- issue: ἐν τῷ ὀνόματι τοῦ κυρίου என்பதன் தொடர்பு
  choice: ‘ஆண்டவரின் பெயரில் அவருக்கு எண்ணெய் பூசி’ என அருகிலுள்ள பங்கேற்பு வினையுடன் இணைத்தல்
  alternative: ஜெபம் உட்பட முழுச் செயலுக்கும் பொதுவாக இணைத்தல்
  rationale: கிரேக்கச் சொல் வரிசையில் இச்சொற்றொடர் ἀλείψαντες...ἐλαίῳ என்பதற்கு உடனடியாகப் பின்வருகிறது. இருப்பினும் மொத்தப் பணியும் ஆண்டவரைச் சார்ந்ததாகப் புரிந்துகொள்ளப்படுவதை உரை மறுப்பதில்லை.
- issue: பொதுப்பொருளுடைய ஒருமை நபரின் பாலினம்
  choice: ‘யாராவது’ என்பதற்குப் பின் மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தல்
  alternative: ஆண்பால் ‘அவன்’ அல்லது பன்மை ‘அவர்கள்’ மூலம் நபரைக் குறிப்பிடுதல்
  rationale: τις என்பதன் பொதுவான, பாலின வரையறையற்ற பயன்பாட்டை இயல்பான தமிழில் காக்கிறது; ‘அவர்’ நவீன மரியாதை ஒருமையாக இருப்பதால் தேவையற்ற ஆண்பால் வரையறையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சபை’, ‘மூப்பர்கள்’, ‘ஆண்டவர்’, ‘ஜெபம்’ ஆகியவை பரவலாகப் புரிந்துகொள்ளப்படும் கிறிஸ்தவச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. கிரேக்கத்தின் கட்டளைத் தொடர் ‘அழைக்கட்டும் / ஜெபிக்கட்டும்’ எனத் தெளிவாகக் காக்கப்பட்டுள்ளது.
