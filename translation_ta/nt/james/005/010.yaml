source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: ta
  text: சகோதரர்களே[a], துன்புறுதலுக்கும் பொறுமைக்கும் எடுத்துக்காட்டாக, ஆண்டவரின் பெயரில் பேசிய தீர்க்கதரிசிகளை எடுத்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது ஆண்பால் பன்மையான ἀδελφοί என்பதன் மொழிபெயர்ப்பு; இச்சூழலில் பெண்களும் உட்பட விசுவாசிகள் அனைவரையும் யாக்கோபு அழைப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: எடுத்துக்காட்டு
  rationale: பின்பற்றத்தக்க முன்மாதிரி அல்லது எடுத்துக்காட்டு என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: λάβετε
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: இறந்தகால ஏவல் வடிவத்தின் கட்டளைத் தன்மையைப் பேணி, ὑπόδειγμα என்பதுடன் சேர்ந்து ‘எடுத்துக்காட்டாக எடுத்துக்கொள்ளுங்கள்’ என்ற இயல்பான தமிழ்த் தொடரை உருவாக்குகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை விளிப்பை நேரடியாகப் பேணுகிறது; சூழலில் முழு விசுவாசக் கூட்டத்தையும் குறிக்கக்கூடிய உள்ளடக்கப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: κακοπαθίας
  choice: துன்பத்தைச் சகித்தல்
  rationale: துன்புறுதல் அல்லது இன்னலைத் தாங்குதல் என்ற கருத்தை வெளிப்படுத்துகிறது; இங்கு தீர்க்கதரிசிகள் எதிர்கொண்ட துன்பத்தையும் அதைத் தாங்கியதையும் இயல்பாகச் சொல்கிறது.
- source_word: μακροθυμίας
  choice: நீடிய பொறுமை
  rationale: μακροθυμία குறிக்கும் நீண்டகாலப் பொறுமையை சாதாரண ‘பொறுமை’ என்பதைக் காட்டிலும் தெளிவாகப் பேணுகிறது.
- source_word: τοὺς προφήτας
  choice: தீர்க்கதரிசிகளை
  rationale: யாக்கோபு முன்மாதிரிகளாகச் சுட்டும் நபர்களை நேரடியாகக் குறிக்கிறது.
- source_word: ἐλάλησαν
  choice: பேசிய
  rationale: மூல வினையின் எளிய ‘பேசுதல்’ பொருளைப் பேணுகிறது; ‘அறிவித்த’ போன்ற கூடுதல் முறையான நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: பிரதிநிதித்துவத்தையும் அதிகாரத்தையும் உணர்த்தும் வேதாகம மரபுத்தொடரை நேரடியாகவும் இயல்பாகவும் பேணுகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான கண்ணியமான, நவீனத் தமிழில் பரவலாகப் புரியக்கூடிய இணைச்சொல்.
theological_decisions:
- issue: சபையை நோக்கிய ἀδελφοί என்ற ஆண்பால் விளிப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’; அதன் உள்ளடக்கப் பயன்பாடு அடிக்குறிப்பில்
  alternative: ‘சகோதர சகோதரிகளே’ அல்லது ‘உடன்பிறப்புகளே’
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் வடிவத்தை மறைக்காமல் பேணுகிறது; அதே சமயம் இந்த நிருபச் சூழலில் பெண்களும் அடங்கிய முழு விசுவாசக் கூட்டம் குறிக்கப்படலாம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: தீர்க்கதரிசிகளுக்கும் ὑπόδειγμα என்பதற்கும் இடையிலான இலக்கண உறவு
  choice: தீர்க்கதரிசிகளைத் துன்பத்தைச் சகித்தலுக்கும் நீடிய பொறுமைக்கும் எடுத்துக்காட்டாக எடுத்துக்கொள்ளுதல்
  alternative: தீர்க்கதரிசிகளின் துன்பத்தையும் பொறுமையையும் எடுத்துக்காட்டாக எடுத்துக்கொள்ளுதல்
  rationale: மூலத்தில் ‘தீர்க்கதரிசிகள்’ என்பவர்களே λάβετε என்பதன் நேரடி பொருளாகவும் முன்மாதிரிகளாகவும் உள்ளனர்; இரண்டு உரிமைவேற்றுமைச் சொற்கள் அவர்கள் எந்த வகையில் எடுத்துக்காட்டுகள் என்பதைச் சுட்டுகின்றன.
- issue: κακοπαθία மற்றும் μακροθυμία ஆகியவற்றின் வேறுபாடு
  choice: ‘துன்பத்தைச் சகித்தல்’ மற்றும் ‘நீடிய பொறுமை’ என்று தனித்தனியாக மொழிபெயர்த்தல்
  alternative: ‘துன்பமும் பொறுமையும்’
  rationale: முதலாவது துன்ப அனுபவத்தையும் அதைத் தாங்குவதையும், இரண்டாவது நீண்ட பொறுமையையும் சுட்டும் வேறுபாட்டைத் தமிழில் இயன்றவரை பேணுகிறது; இரண்டையும் ஒன்றாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘தீர்க்கதரிசிகள்’, ‘ஆண்டவர்’ போன்ற பரிச்சயமான சொற்கள் வைக்கப்பட்டுள்ளன; செயற்கையான பழந்தமிழ் வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
