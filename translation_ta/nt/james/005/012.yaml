id: JAS.5.12
reference: James 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: ta
  text: ஆனால் எல்லாவற்றுக்கும் மேலாக, என் சகோதரர்களே,[a] வானத்தின் பேரிலோ, பூமியின் பேரிலோ ஆணையிடாதீர்கள்; வேறு எந்த ஆணையையும் செய்யாதீர்கள். மாறாக, உங்கள் ‘ஆம்’ என்பது ஆம் என்றும், உங்கள் ‘இல்லை’ என்பது இல்லை என்றும் இருக்கட்டும்; நீங்கள் நியாயத்தீர்ப்புக்குள் விழாதபடி.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதரர்களும் சகோதரிகளும்.” கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது; இது விசுவாசக் குழுமம் முழுவதையும் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நியாயத்தீர்ப்பு” என்பதை “தண்டனைத்தீர்ப்பு” என்றும் பொருள்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: எல்லாவற்றுக்கும் மேலாக
  rationale: அறிவுரையின் முதன்மையையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல் அமைப்பான ‘எல்லாவற்றுக்கும் முன்பாக’ என்பதைக் காட்டிலும் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது. இச்சொல் விசுவாசக் குழுமம் முழுவதையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: μὴ ὀμνύετε
  choice: ஆணையிடாதீர்கள்
  rationale: இங்கு தகாத சொற்களைப் பேசுதல் அல்ல, ஆணை செய்வதே பொருள் என்பதைத் தமிழில் குழப்பமின்றித் தெரிவிக்கிறது. μή உடனான நிகழ்காலக் கட்டளை பொதுவான தடையாக எடுத்துரைக்கப்படுகிறது.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: வானத்தின்மேலோ பூமியின்மேலோ வேறு எந்த ஆணையின்மேலோ
  rationale: மூன்று இணையான தடைகளையும் அவற்றின் விரிவான தன்மையையும் காக்கும் இயல்பான தமிழ் ஒருங்கிணைப்பு.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: மாறாக, உங்கள் ‘ஆம்’ ஆம் என்றும், உங்கள் ‘இல்லை’ இல்லை என்றும் இருக்கட்டும்
  rationale: δέ குறிக்கும் முரண்பாட்டை ‘மாறாக’ வெளிப்படுத்துகிறது; கிரேக்கத்தின் சுருக்கமான பழமொழித்தன்மையையும் நேர்மையான பேச்சுக்கான அழைப்பையும் பாதுகாக்கிறது.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: அப்போது நீங்கள் நியாயத்தீர்ப்புக்கு உள்ளாக மாட்டீர்கள்
  rationale: ἵνα μή கூறும் தடுப்பு நோக்கம் அல்லது விளைவை இயல்பான தமிழில் தெரிவிக்கிறது. ὑπὸ κρίσιν πέσητε என்பதின் உருவகத்தைச் சொல்லுக்குச் சொல் இறுக்கமாக மொழிபெயர்க்காமல், ‘நியாயத்தீர்ப்புக்கு உள்ளாகுதல்’ என்ற தெளிவான வழக்கைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: κρίσις என்பது பொதுவான ‘நியாயத்தீர்ப்பா’ அல்லது வலுவான ‘தண்டனைத்தீர்ப்பா’
  choice: நியாயத்தீர்ப்பு
  alternative: தண்டனைத்தீர்ப்பு
  rationale: κρίσις பொதுவாகத் தீர்ப்பைக் குறிக்க முடியும்; இறுதி கண்டனத்தையோ தண்டனைத் தீர்ப்பையோ கட்டாயமாகக் குறிப்பிடாது. ஆகவே மூலத்தில் இல்லாத குறுகிய கோட்பாட்டுப் பொருளைச் சேர்க்காமல் பரந்த சொல்லை முதன்மை உரையில் வைத்திருக்கிறது.
- issue: கலப்பின விசுவாசக் குழுமத்தை நோக்கிய ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: என் சகோதரர்களே
  alternative: என் சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது; அதேவேளை இது முழு விசுவாசக் குழுமத்தையும் உள்ளடக்கி அழைக்கும் பிரதிநிதித்துவப் பயன்பாடாக இருக்க வாய்ப்புள்ளது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுரைநடை பயன்படுத்தப்பட்டுள்ளது. ஆணை செய்வதையும் சாதாரணத் தகாத பேச்சையும் வேறுபடுத்த ‘ஆணையிடாதீர்கள்’ தேர்ந்தெடுக்கப்பட்டது. மேற்கோள் குறிகள் ‘ஆம்/இல்லை’ என்ற பழமொழித்தன்மையையும் உரைத் தெளிவையும் மேம்படுத்துகின்றன.
