source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: ta
  text: நீங்கள் பூமியில் ஆடம்பரமாக வாழ்ந்து, இன்பத்தில் திளைத்தீர்கள்; வெட்டுக்கொலை நாளில்[a] உங்கள் இதயங்களைக் கொழுக்கவைத்தீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெட்டுக்கொலை நாளுக்காக.’
    reason: alternative_reading
  - marker: b
    text: வெட்டுக்கொலைக்கு முன் விலங்குகள் கொழுக்கவைக்கப்படுவதை இந்த உருவகம் சுட்டுகிறது; வரவிருக்கும் தீர்ப்பையும் இது உணர்த்தக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: ஆடம்பரமாக வாழ்ந்து
  rationale: τρυφάω என்பது வெறும் மகிழ்ச்சியை அல்ல, செல்வச் செழிப்பில் இன்பத்தை நாடி வாழ்வதைக் குறிக்கிறது. ‘ஆடம்பரமாக வாழ்ந்து’ என்பது கண்டனத் தொனியையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: γῆ என்பதற்கு ‘நிலம்’ அல்லது ‘பூமி’ என்று பொருள் வரலாம்; இங்கு உலக வாழ்வை நோக்கிய விரிவான கண்டனத்திற்கு ‘பூமியில்’ பொருத்தமானது.
- source_word: ἐσπαταλήσατε
  choice: இன்பத்தில் திளைத்தீர்கள்
  rationale: σπαταλάω கட்டுப்பாடற்ற சுகபோக, தன்னின்ப வாழ்வை வலியுறுத்துகிறது. ‘இன்பத்தில் திளைத்தீர்கள்’ முதல் வினையின் கருத்தைத் தீவிரப்படுத்தி, தமிழில் இயல்பான கண்டனமாக அமைகிறது.
- source_word: ἐθρέψατε
  choice: கொழுக்கவைத்தீர்கள்
  rationale: τρέφω பொதுவாக ‘ஊட்டுதல்’ எனப் பொருள்பட்டாலும், வெட்டப்படவிருக்கும் விலங்கைக் கொழுக்கவைக்கும் உருவகம் இங்கு செயல்படுகிறது; எனவே ‘கொழுக்கவைத்தீர்கள்’ அந்தக் கடுமையான நையாண்டியைப் பாதுகாக்கிறது.
- source_word: τὰς καρδίας ὑμῶν
  choice: உங்கள் இதயங்களை
  rationale: மூலத்தின் மனித உள்ளார்ந்த மையத்தைக் குறிக்கும் உருவகத்தை விளக்கவுரையாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: வெட்டப்படும் நாளில்
  rationale: ἐν என்பதன் இயல்பான காலப்பொருளான ‘நாளில்’ என்பதையும், σφαγήயின் விலங்கு வெட்டப்படும் உருவகத்தையும் காக்கிறது; தீர்ப்பை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘வெட்டப்படும் நாள்’ என்ற உருவகத்தின் பொருள்
  choice: வரவிருக்கும் அழிவு அல்லது தீர்ப்பை உணர்த்தும் உருவகத்தை விளக்கமின்றி முதன்மை உரையில் வைத்தல்
  alternative: ‘நியாயத்தீர்ப்பு நாளுக்காக’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை தீர்ப்பை வலுவாக உணர்த்தினாலும் அதை நேரடியாகப் பெயரிடவில்லை. ஆகவே உருவகத்தின் தீவிரத்தையும் இறையியல் பதற்றத்தையும் அப்படியே பாதுகாக்கிறது.
- issue: ἐν என்பதன் கால அல்லது நோக்கப் பொருள்
  choice: ‘நாளில்’
  alternative: ‘நாளுக்காக’
  rationale: ‘நாளில்’ என்பது ἐν-க்கு மிக நேரான இணை; எனினும் கொழுக்கவைக்கப்படும் விலங்கு உருவகத்தால் நோக்கப் பொருளும் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்டனத்தின் கண்ணியமான கடுமை குறையாத வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘ஆடம்பரமாக வாழ்ந்து’ மற்றும் ‘இன்பத்தில் திளைத்தீர்கள்’ ஆகியவை ஒத்த கருத்துடைய இரண்டு கிரேக்க வினைகளின் படிப்படியான தீவிரத்தை வெளிப்படுத்துகின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
