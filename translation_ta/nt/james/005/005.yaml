  source_fidelity: முதல் இரு வினைகளும் (ἐτρυφήσατε, ἐσπαταλήσατε) செல்வச் சுகபோகத்திலும் தன்னின்பத்திலும் வாழ்ந்ததைக் கண்டிக்கும் தன்மையை நன்றாகத் தருகின்றன. ‘உங்கள் இதயங்களைக் கொழுக்கவைத்தீர்கள்’ என்பது ἐθρέψατε τὰς καρδίας ὑμῶν என்ற திட்டமிட்ட உருவகத்தைப் பாதுகாக்கிறது. ஆனால் σφαγή என்பது வெறுமனே யாரோ ‘வெட்டப்படுதல்’ அல்ல; ‘வெட்டுக்கொலை/slaughter’ என்ற நிகழ்வைக் குறிக்கிறது. ‘வெட்டப்படும் நாள்’ தமிழில் செயப்பாட்டு, குறித்தெழுவாயற்ற வாசிப்பை உருவாக்கி மூலத்தின் கடுமையான பெயர்ச்சொல் உருவகத்தைச் சற்றுத் தளர்த்துகிறது.
  naturalness: ‘ஆடம்பரமாக வாழ்ந்து, இன்பத்தில் திளைத்தீர்கள்’ நவீன தரத் தமிழில் இயல்பாகவும், இரண்டு தொடர்புடைய வினைகளின் வலியுறுத்தலையும் காக்கும் வகையிலும் உள்ளது. ‘வெட்டுக்கொலை நாளில்’ என்பது இச்சூழலில் ‘வெட்டப்படும் நாளில்’ என்பதைக் காட்டிலும் σφαγήயின் உருவக வலிமையைத் தெளிவாகக் கொண்டு வருகிறது. ‘இதயங்களைக் கொழுக்கவைத்தீர்கள்’ உருவகமாகக் கடினமாக ஒலிப்பது மூலத்திலுள்ள வேண்டுமென்றே அமைந்த கடினமான படிமத்துக்கு ஏற்றது.
