source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: ta
  text: எலியா நம்மைப் போன்ற இயல்புடைய ஒரு மனிதராக இருந்தார்[a]. மழை பெய்யக்கூடாது என்று அவர் தீவிரமாக மன்றாடினார்; நாட்டில் மூன்று ஆண்டுகளும் ஆறு மாதங்களும் மழை பெய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எலியா நம்மைப் போன்ற ஒரு மனிதராக இருந்தார்”; அல்லது, “எலியாவுக்கும் நமக்கும் ஒரேவிதமான உணர்ச்சிகளும் உந்துதல்களும் இருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தீர்க்கதரிசியின் பெயர் வடிவம்.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: எலியா ஆண் என்பதை மறைக்காமல், இங்கு வலியுறுத்தப்படும் அவரது சாதாரண மனிதத்தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: நம்மைப் போன்ற இயல்புடைய
  rationale: ஒரேவிதமான மனித இயல்பு அல்லது அனுபவ நிலையைச் சுட்டுகிறது; உணர்ச்சிகள் அல்லது ஆசைகள் என்பதற்கு மட்டும் பொருளைக் குறுக்காமல் காக்கிறது.
- source_word: προσευχῇ προσηύξατο
  choice: ஊக்கமாக மன்றாடினார்
  rationale: ஒரே வேர் கொண்ட பெயர்ச்சொல்–வினைச்சொல் அமைப்பின் வலியுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ μὴ βρέξαι
  choice: மழை பெய்யக் கூடாது என்று
  rationale: மன்றாட்டின் உள்ளடக்கம் அல்லது நோக்கத்தை தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: οὐκ ἔβρεξεν
  choice: மழை பெய்யவில்லை
  rationale: கிரேக்கத்தின் சூழலுக்கேற்ற இயல்பான தமிழ் வானிலைச் சொற்றொடர்.
- source_word: ἐπὶ τῆς γῆς
  choice: நாட்டில்
  rationale: எலியா நிகழ்வின் வறட்சிக்குள்ளான நிலப்பகுதியைச் சுட்டுகிறது; தேவையற்ற உலகளாவிய பொருளைத் தவிர்க்கிறது.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: மூன்று ஆண்டுகளும் ஆறு மாதங்களும்
  rationale: மழையின்மையின் கால அளவை இயல்பான தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ὁμοιοπαθὴς என்ற சொல்லால் எலியாவின் மனிதத்தன்மை எவ்வாறு சித்தரிக்கப்படுகிறது
  choice: வாசகர்களைப் போன்ற மனித இயல்பும் அனுபவ நிலையும் கொண்டவராக எலியா காட்டப்படுகிறார்.
  alternative: எலியாவுக்கு நம்மைப் போன்ற அதே உணர்ச்சிகள் அல்லது ஆசைகள் இருந்தன.
  rationale: சொல் மனித அனுபவத்தின் ஒற்றுமையை விரிவாகக் குறிக்க முடியும். அதை உணர்ச்சிகள் அல்லது ஆசைகள் என்பதற்கு மட்டும் குறுக்காமல், எலியாவின் தீர்க்கதரிசிப் பங்கைத் தாழ்த்தாமலும் வசனத்தின் ஊக்கமளிக்கும் அழுத்தத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஊக்கமாக மன்றாடினார்’ என்பது கிரேக்க வலியுறுத்தலை இயல்பாகக் காட்டுகிறது; ‘நாட்டில்’ என்பது கதையின் உள்ளூர் நிலப்பரப்பு சார்ந்த பொருளை முன்னிறுத்துகிறது.
