  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: ta
  text: உங்களில் யாராவது துன்பப்படுகிறாரா? அவர் ஜெபிக்கட்டும். யாராவது மனமகிழ்ச்சியோடு இருக்கிறாரா? அவர் துதித்துப் பாடட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சங்கீதம் பாடட்டும்”; கிரேக்க வினைச்சொல் குறிப்பாகச் சங்கீதங்களைப் பாடுவதையோ, விரிவாகத் துதித்துப் பாடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: துன்பப்படுகிறாரா
  rationale: κακοπαθέω என்பது இன்னல், துன்பம் அல்லது கடினமான சூழ்நிலையை அனுபவிப்பதைக் குறிக்கிறது. நோய் அல்லது துன்புறுத்தல் என்று பொருளைச் சுருக்காமல், தமிழில் இயல்பாகவும் விரிவாகவும் பொருளைத் தருகிறது.
- source_word: τις
  choice: யாராவது
  rationale: ஒருமையில் வரும் இந்த வரையறையற்ற சுட்டுப்பெயரின் பொதுப்பொருளை, பாலின வரையறையின்றி இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: கடிதத்தைப் பெறும் சமூகத்திற்குள் அந்த நபர் இருப்பதைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: προσευχέσθω
  choice: அவர் ஜெபிக்கட்டும்
  rationale: நிகழ்கால மூன்றாம் நபர் ஒருமை கட்டளையின் அறிவுறுத்தும் வலிமையையும், தனிநபரை நோக்கிய ஒருமையையும் காக்கிறது.
- source_word: εὐθυμεῖ
  choice: மகிழ்ச்சியாக இருக்கிறாரா
  rationale: εὐθυμέω குறிக்கும் நல்ல மனநிலை அல்லது உற்சாகமான உள்ளநிலையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ψαλλέτω
  choice: அவர் துதிப்பாடல் பாடட்டும்
  rationale: இச்சூழலில் கடவுளை நோக்கிப் பாடித் துதிப்பதைத் தெளிவாகத் தெரிவிக்கிறது; அதேவேளை, இந்த வினைச்சொல் குறிப்பாகச் சங்கீதம் பாடுவதையும் குறிக்கக்கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஒருமை அறிவுறுத்தல்கள்
  choice: “யாராவது … அவர் … கட்டும்” என்று ஒருமையைத் தக்கவைத்தல்
  alternative: பன்மையில் “அவர்கள் …ட்டும்” என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் τις என்பதோடு மூன்றாம் நபர் ஒருமை கட்டளைகள் வருகின்றன. தமிழ் “அவர்” பாலினத்தை வரையறுக்காமல் மரியாதையான ஒருமையைத் தக்கவைக்கிறது.
- issue: ψαλλέτω என்பதன் பொருள்
  choice: துதிப்பாடல் பாடட்டும்
  alternative: சங்கீதம் பாடட்டும்
  rationale: சொல் சங்கீதம் பாடுதல் என்ற குறிப்பான பொருளையும், பாடித் துதித்தல் என்ற விரிவான பொருளையும் ஏற்கக்கூடும். முதன்மை உரையில் இயல்பான விரிவான பொருள் தரப்பட்டு, குறிப்பான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது; இதனால் தேவையற்ற வழிபாட்டு முறைச் சுருக்கம் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி கேள்வி–அறிவுறுத்தல் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. “அவர்” என்பது பாலின வரையறையற்ற மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டு, மூலத்தின் ஒருமை அமைப்பு காக்கப்பட்டுள்ளது.
