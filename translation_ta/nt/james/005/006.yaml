  verdict: revise
  source_fidelity: குற்றஞ்சாட்டலின் நீதித்துறை வினை (κατεδικάσατε), சட்டவிரோதக் கொலையின் வலிமை (ἐφονεύσατε), மற்றும் ஒருமை ‘நீதிமான்’ (τὸν δίκαιον) ஆகியவை வரைவில் அடிப்படையில் சரியாகக் காக்கப்பட்டுள்ளன. ஆயினும் ‘குற்றவாளி என்று தீர்த்து’ என்பதற்குப் பதில் ‘குற்றவாளி எனத் தீர்ப்பளித்து’ என்பது καταδικάζω-வின் நீதிமன்றத் தீர்ப்பு என்ற வலிமையைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது. இறுதிக் கூற்றை அறிவிப்பாக வைப்பது, மூலத்தின் பிற்பட்ட நிறுத்தற்குறி சார்ந்த கேள்வி வாசிப்பை அடிக்குறிப்பில் காப்பதனால் ஏற்கத்தக்கது.
  naturalness: ‘குற்றவாளி எனத் தீர்ப்பளித்து’ நவீன பொதுத்தமிழில் அதிகம் இயல்பானதும் சுருக்கமானதும் ஆகும். ‘அவன்’ என்பது பிரதிநிதித்துவமான ஒருமைக்குப் பயன்படலாம்; ஆனால் ‘நீதிமான்’ என்ற உயர்ந்த பதிவுடன் ‘அவன்’ சற்றே ஒவ்வாமையாக உள்ளது. ‘அவர்’ மரியாதையானதாக இருந்தாலும் இயேசுவையே முதன்மையாகக் குறிக்கிறது என்ற தேவையற்ற சாயலை உருவாக்கலாம். ஆகவே இறுதி வாக்கியத்தில் வெளிப்படையான சுட்டுப்பெயரைத் தவிர்த்து, ‘உங்களை எதிர்த்து நிற்கவில்லை’ எனத் தருவது இயல்பாகவும் குறைவான விளக்கச்சாயலுடனும் உள்ளது.
  terminology: ‘நீதிமான்’ வேதாகம வழக்கிலும் நவீன வாசிப்பிலும் நிலைபெற்ற சொல்; அது ஆண்பால் ஒருமை வடிவத்தையும் பிரதிநிதித்துவச் சாத்தியத்தையும் காக்கிறது. ‘கொலை செய்தீர்கள்’ φονεύω-வின் அறநெறி வலிமையைப் போதுமான அளவு காக்கிறது. ‘எதிர்த்து நிற்கவில்லை’ ἀντιτάσσεται என்பதற்குச் சிறிது நேரடியான பொருத்தம் அளிக்கிறது.
