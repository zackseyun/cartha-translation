  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: ta
  text: நீதிமானைக் குற்றவாளி எனத் தீர்ப்பளித்து, கொலை செய்தீர்கள்.[a] உங்களை எதிர்த்து நிற்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதிமான்’ என்பது செல்வந்தர்களால் ஒடுக்கப்படும் நீதியுள்ள ஒருவரைப் பிரதிநிதித்துவமாகக் குறிக்கலாம். சிலர் இதை இயேசுவாகிய ‘நீதிமான்’ என்பதற்கான எதிரொலியாகவும் கருதுகின்றனர்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கப் பதிப்பின் நிறுத்தற்குறியின்படி, “அவர் உங்களை எதிர்த்து நிற்கவில்லையா?” என்றும் வாசிக்கலாம்.
    reason: punctuation_and_lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: குற்றவாளி என்று தீர்த்து
  rationale: καταδικάζω என்பதன் நீதித்துறை சார்ந்த ‘குற்றவாளி எனத் தீர்ப்பளித்தல்/கண்டனம் செய்தல்’ என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. இறந்தகால இரண்டாம் நபர் பன்மை வடிவமும் காக்கப்படுகிறது.
- source_word: ἐφονεύσατε
  choice: கொலை செய்தீர்கள்
  rationale: φονεύω என்பது வெறுமனே உயிரைப் போக்குவதைவிட அநீதியான கொலையின் அறச்சுமையைத் தாங்குகிறது; ஆகவே ‘கொன்றீர்கள்’ என்பதற்குப் பதில் ‘கொலை செய்தீர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸν δίκαιον
  choice: நீதிமானை
  rationale: ஆண்பால் ஒருமை பெயரடை பெயர்ச்சொல்லாகப் பயன்பட்டிருப்பதைச் சுருக்கமாகவும் மரியாதையான தமிழிலும் தருகிறது. இது உடனடியான சூழலில் ஒடுக்கப்பட்ட ஒரு நீதியுள்ள மனிதனைப் பிரதிநிதித்துவமாகக் குறிக்கலாம்; இயேசுவுக்கான பட்டம் என்று முதன்மை உரை முடிவுசெய்யவில்லை.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: அவன் உங்களை எதிர்க்கவில்லை
  rationale: ἀντιτάσσομαι என்பதன் ‘எதிர்த்து நிற்றல்’ என்ற பொருளை இயல்பாகத் தருகிறது. கிரேக்கப் பதிப்பில் கேள்விக்குறி இருந்தாலும், சூழலில் எதிர்ப்பின்றி துன்புறும் நீதிமானைப் பற்றிய கூற்றாகப் புரிந்துகொள்ளப்படும் வாசிப்பு முதன்மை உரையில் தரப்பட்டு, கேள்வி வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘நீதிமான்’ யாரைக் குறிக்கிறார்?
  choice: செல்வந்தர்களால் ஒடுக்கப்படும் நீதியுள்ள ஒருவரைப் பிரதிநிதித்துவமாகக் குறிக்கும் வகையில், குறிப்பிட்ட அடையாளமின்றி ‘நீதிமான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நீதிமான்’ என்பது இயேசுவைக் குறிக்கும் மறைமுகமான பட்டம்
  rationale: உடனடியான சூழல் செல்வந்த ஒடுக்குநர்களை பொதுவாகக் கண்டிக்கிறது; ஒருமை வடிவம் பிரதிநிதித்துவப் பொருளில் அமையலாம். அதேவேளை இயேசுவைக் குறிக்கும் எதிரொலி இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: இறுதி வாக்கியத்தின் தன்மை
  choice: ‘அவன் உங்களை எதிர்க்கவில்லை’ என்ற கூற்று
  alternative: ‘அவன் உங்களை எதிர்க்கவில்லையா?’ என்ற கேள்வி
  rationale: SBLGNT இதைக் கேள்வியாக நிறுத்தற்குறியிடுகிறது; எனினும் பண்டைய கையெழுத்துப் பிரதிகளின் நிறுத்தற்குறிகள் மூல ஆசிரியருடையவை அல்ல, மேலும் சூழலில் இது எதிர்ப்பின்மையைக் கூறும் வாக்கியமாகவும் பரவலாகப் புரிந்துகொள்ளப்படுகிறது. தெளிவான முதன்மை வாசிப்புடன் மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், குற்றச்சாட்டின் தீவிரமும் நீதித்துறைச் சாயலும் காக்கப்பட்டுள்ளன. ‘நீதிமான்’ என்பது வேதாகமப் பயன்பாட்டுடன் ஒத்த dignified சொல்; இருப்பினும் வாக்கிய அமைப்பு எளிமையாக வைக்கப்பட்டுள்ளது.
