id: JAS.5.3
reference: James 5:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: ta
  text: உங்கள் தங்கமும் வெள்ளியும் அரித்துப்போயிருக்கின்றன; அவற்றின் அரிப்பு[a] உங்களுக்கு எதிரான சான்றாக இருந்து, நெருப்பைப் போல[b] உங்கள் சதைகளைத் தின்னும். கடைசி நாட்களில் நீங்கள் செல்வத்தைக் குவித்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றின் துரு உங்களுக்கு எதிராகச் சாட்சி சொல்லும்’ என்றும் இன்னும் நேரடியாக மொழிபெயர்க்கலாம். இங்கு ‘அரிப்பு’, ‘சான்று’ என்பவை உலோகப் படிமத்தையும் நீதிமன்றப் பொருளையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘கடைசி நாட்களில் நீங்கள் நெருப்பைப் போல செல்வத்தைக் குவித்திருக்கிறீர்கள்’ என்றும் வாசிக்கலாம். சிலர் ‘நெருப்பைப் போல’ என்பதை முந்திய ‘சதைகளைத் தின்னும்’ என்பதோடு அல்லாமல், இறுதிக் கூற்றோடு இணைக்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: அரித்துப்போயிருக்கின்றன
  rationale: நிகழ்ந்து முடிந்த செயலின் தற்போதைய விளைவு நிலையை நிறைவேற்றுக் காலம் காட்டுகிறது. தங்கமும் வெள்ளியும் சொல்லியபடி ‘துருப்பிடிப்பதில்லை’ என்றாலும், உலோகங்கள் மங்கி அரிக்கப்படுவதை இந்த வினை பரந்த பொருளில் குறிக்கிறது.
- source_word: ὁ ἰὸς αὐτῶν
  choice: அவற்றின் அரிப்பு
  rationale: உலோகச் சூழலில் ἰός என்பது நஞ்சை அல்ல, அரிப்பினால் உண்டாகும் படிவத்தையோ விளைவையோ குறிக்கிறது. ‘அரிப்பு’ இயல்பான நவீனத் தமிழாகவும் உலோக உருவகத்திற்கு ஏற்றதாகவும் உள்ளது.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: உங்களுக்கு எதிரான சான்றாக இருந்து
  rationale: மொழித்தொடரின் நீதிமன்றச் சாயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் உள்ள எதிரான பொருளையும் தெளிவாக்குகிறது.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: உங்கள் சதைகளைத் தின்னும்
  rationale: கிரேக்கத்தின் அதிர்ச்சியூட்டும், உருவகமான உடல் அழிவுப் படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: σάρκας
  choice: சதைகளை
  rationale: பன்மை வடிவத்தையும் உடலைச் சார்ந்த அழிவின் நேரடியான படிமத்தையும் காக்கிறது; இங்கு ‘பாவ இயல்பு’ என்ற பொருள் இல்லை.
- source_word: ὡς πῦρ
  choice: நெருப்பைப் போல
  rationale: உடனே முந்திய ‘தின்னும்’ என்பதோடு இணைப்பது தொடரமைப்பிலும் பொருளிலும் இயல்பானது; அழிவுக்குரிய தீர்ப்பின் உவமையைப் பாதுகாக்கிறது.
- source_word: ἐθησαυρίσατε
  choice: செல்வத்தைக் குவித்திருக்கிறீர்கள்
  rationale: பொக்கிஷம் அல்லது செல்வத்தைச் சேமித்துக் குவித்தல் என்ற வினையின் கருத்தை இயல்பான தமிழில் தருகிறது; ‘பதுக்கிவைத்தீர்கள்’ என்று மொழிபெயர்த்து எதிர்மறை நுணுக்கத்தை அதிகமாகச் சேர்க்கவில்லை.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: கடைசி நாட்களில்
  rationale: கிரேக்க இறுதிக்கால மொழித்தொடரின் நேரடியான, தமிழில் அறியப்பட்ட வடிவம்; மூலத்தில் இல்லாத ‘இந்த’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ὡς πῦρ என்ற சொற்றொடர் வாக்கியத்தில் எதனுடன் இணைகிறது
  choice: முந்திய கூற்றுடன் இணைத்து, அரிப்பு ‘நெருப்பைப் போல’ சதைகளைத் தின்னும் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: பின்வரும் கூற்றுடன் இணைத்து, ‘கடைசி நாட்களில் நெருப்பைச் செல்வமாகக் குவித்திருக்கிறீர்கள்’ அல்லது ‘நெருப்பைப் போலக் குவித்திருக்கிறீர்கள்’ என வாசித்தல்.
  rationale: அருகிலுள்ள தொடரமைப்பும் கருத்தின் இயல்பும் ὡς πῦρ என்பதை φάγεται என்பதோடு இணைப்பதை ஆதரிக்கின்றன. எனினும், பழமையான நிறுத்தக்குறிகள் இல்லாததால் மாற்று இணைப்பு முற்றிலும் நீக்கப்பட முடியாது; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டது. தீர்ப்பின் கூர்மையான படிமத்தை மென்மைப்படுத்தாமல் ‘சதைகளைத் தின்னும்’ என்று வைத்துள்ளோம். ‘அரித்துப்போயிருக்கின்றன’ என்பது தங்கம், வெள்ளி ஆகிய இரண்டிற்கும் பொருந்தும் பரந்த உலோக அரிப்பு சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
