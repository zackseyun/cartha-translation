base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: ta
  text: செல்வந்தர்களே, இப்போது கேளுங்கள்! உங்கள்மேல் வருகிற துயரங்களைக் குறித்து[b] அழுங்கள், ஓலமிட்டுப் புலம்புங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கதறுங்கள்.” கிரேக்கப் பங்கேற்புவினை உரத்த, வெளிப்படையான புலம்பலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “துயரங்கள்” என்பதற்கு “பேரிடர்கள்” அல்லது “கடும் வேதனைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: இப்போது கேளுங்கள்
  rationale: கூர்மையான அழைப்பையும் கண்டனத்தைத் தொடங்கும் உரையாடல் அடையாளத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ πλούσιοι
  choice: செல்வந்தர்களே
  rationale: எழுவாய் வடிவம் இங்கு நேரடி விளியாகச் செயல்படுவதால், விளிவேற்றுமை அந்தத் திடீர் தீர்க்கதரிசனப் பாணியிலான அழைப்பைப் பாதுகாக்கிறது.
- source_word: κλαύσατε
  choice: அழுது
  rationale: வெளிப்படையாக அழும்படி விடுக்கும் கட்டளையைத் தெரிவிக்கிறது; தொடர்ந்து வரும் வினையுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: ὀλολύζοντες
  choice: ஓலமிட்டுப் புலம்புங்கள்
  rationale: உரத்த, வெளிப்படையான புலம்பலைக் குறிக்கும் பங்கேற்புவினையின் தீவிரத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ
  choice: -க்காக
  rationale: வருகிற துயரங்களே அழுகைக்கும் புலம்பலுக்கும் காரணம் அல்லது சந்தர்ப்பம் என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ταλαιπωρίαις
  choice: துயரங்கள்
  rationale: கடுமையான துன்பங்களையும் அவலநிலைகளையும் குறிக்கும் பரந்த பொருளை, எளிதில் புரியும் கண்ணியமான தமிழில் தருகிறது.
- source_word: ταῖς ἐπερχομέναις
  choice: உங்கள்மேல் வருகிற
  rationale: துயரங்கள் நெருங்கி வருவதைத் தெரிவிக்கிறது; கிரேக்கத்தில் இல்லாத அளவுக்கு உடனடித்தன்மையை வலியுறுத்தாமல், அவை அவர்கள்மேல் வருவதாக இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: செல்வந்தர்கள் என்ற அழைப்பின் தொனியும் சுட்டப்படுவோரும்
  choice: வருகிற துயரம் அல்லது நியாயத்தீர்ப்பை எதிர்கொள்ளும் செல்வந்தர்களை நோக்கிய தீர்க்கதரிசனப் பாணியிலான கண்டனமாக மொழிபெயர்க்கப்பட்டது; அவர்கள் விசுவாசிகளா அவிசுவாசிகளா என்பது குறிப்பிடப்படவில்லை.
  alternative: ஒடுக்குகிற அவிசுவாச நில உரிமையாளர்களை மட்டும் குறித்தல், அல்லது கிறிஸ்தவச் சமூகத்திலுள்ள செல்வந்த உறுப்பினர்களை மட்டும் குறித்தல்.
  rationale: இந்த வசனம் ‘செல்வந்தர்களே’ என்று நேரடியாக அழைத்து வருகிற துயரங்களை அறிவிக்கிறது; ஆனால் அவர்களின் உடன்படிக்கை அல்லது விசுவாச நிலையை இந்த வரியிலேயே வரையறுக்கவில்லை. எனவே அந்தத் தெளிவின்மையும் நியாயத்தீர்ப்புத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி விளியும் வலுவான கட்டளையும் தீர்க்கதரிசனக் கண்டனத் தொனியைப் பாதுகாக்கின்றன. அடிக்குறி குறியீடுகள் அவை விளக்கும் சொற்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
