id: JAS.5.7
reference: James 5:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: ta
  text: ஆகையால், சகோதரர்களே[a], ஆண்டவரின் வருகை[b] வரை பொறுமையாயிருங்கள். பாருங்கள், விவசாயி நிலத்தின் மதிப்புமிக்க விளைச்சலுக்காகக் காத்திருக்கிறார்; முன்பருவ மழையும் பின்பருவ மழையும் கிடைக்கும்வரை அதற்காகப் பொறுமையோடு இருக்கிறார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் பொருள்படலாம்; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது, ஆனால் இவ்வழைப்பு பெரும்பாலும் விசுவாசக் கூட்டம் முழுவதையும் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: ‘வருகை’ என்பதற்கான கிரேக்கச் சொல் ‘உடனிருப்பு’ என்றும் பொருள்படும்; இங்கே அது ஆண்டவரின் எதிர்கால வருகையைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: 'கிரேக்கத்தில் ‘முன்பருவத்தையும் பின்பருவத்தையும் பெறும்வரை’ என்று உள்ளது; ‘மழை’ என்பது சூழலிலிருந்து நிரப்பப்படுகிறது. ‘பெறும்வரை’ என்பதன் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை: இலக்கணப்படி அது விவசாயியாகப் புரிந்துகொள்ளப்படலாம்; கருத்தளவில் நிலம் அல்லது விளைச்சல் மழையைப் பெறுவதும் நினைக்கப்படலாம்.'
    reason: source_ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: பொறுமையாயிருங்கள் / பொறுமையோடு இருக்கிறார்
  rationale: கட்டளையையும் விவசாயியைப் பற்றிய தொடர்ச்சியான செயலைக் குறிக்கும் பங்கேற்பு வடிவத்தையும் இயல்பான நவீனத் தமிழில் தருவதோடு, ஒரே கிரேக்க வேர்ச்சொல்லின் மீளுரைப்பையும் காக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய பகுதிக்கும் இவ்வறிவுறுத்தலுக்கும் உள்ள முடிவுறு தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை முறையாகத் தக்கவைக்கிறது; இது முழு விசுவாசக் கூட்டத்தையும் குறிக்கக்கூடிய பயன்பாடு என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: παρουσίας τοῦ κυρίου
  choice: ஆண்டவரின் வருகை
  rationale: இச்சூழலில் எதிர்பார்க்கப்படும் ஆண்டவரின் வருகையை இயல்பாகக் குறிக்கிறது; ‘உடனிருப்பு’ என்ற அடிப்படைச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἰδοὺ
  choice: பாருங்கள்
  rationale: எடுத்துக்காட்டின்மீது கவனத்தைத் திருப்பும் அழைப்பின் வலிமையை நவீனத் தமிழில் காக்கிறது.
- source_word: ὁ γεωργὸς ἐκδέχεται
  choice: விவசாயி ... காத்திருக்கிறார்
  rationale: தொடர்ச்சியான எதிர்பார்ப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν τίμιον καρπὸν τῆς γῆς
  choice: நிலத்தின் மதிப்புமிக்க விளைச்சல்
  rationale: καρπός என்பதைக் குறிப்பிட்ட ஒரு பழவகையாகக் குறுக்காமல் வேளாண் சூழலுக்கேற்ற ‘விளைச்சல்’ எனவும், τίμιος என்பதைக் அதன் மதிப்பை உணர்த்தும் வகையில் மொழிபெயர்க்கிறது.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: முன்பருவ மழையும் பின்பருவ மழையும்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ‘மழை’ என்னும் பெயர்ச்சொல்லைச் சூழலும் வழக்கமான சொற்றொடரும் தெளிவுபடுத்துகின்றன; தமிழில் பொருள் புரிய அதை வெளிப்படையாகச் சேர்க்கிறது.
- source_word: ἕως λάβῃ
  choice: கிடைக்கும்வரை
  rationale: ‘பெறும்வரை’ என்று ஒரு குறிப்பிட்ட இலக்கண எழுவாயைத் திணிப்பதைத் தவிர்த்து, விவசாயி மழையைப் பெறுகிறாரா அல்லது நிலம்/விளைச்சல் மழையைப் பெறுகிறதா என்ற இயல்பான தொடர்புத் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀδελφοί என்ற பாலினக் குறியுள்ள அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: கிரேக்க ஆண்பால் பன்மையை முதன்மை உரையில் தக்கவைத்து, அந்த அழைப்பு முழு விசுவாசக் கூட்டத்தையும் உள்ளடக்கக்கூடியது என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: παρουσία τοῦ κυρίου
  choice: ஆண்டவரின் வருகை
  alternative: ஆண்டவரின் உடனிருப்பு
  rationale: யாக்கோபின் எதிர்காலத்தை நோக்கிய அறிவுறுத்தலில் ‘வருகை’ சூழலுக்கு மிகவும் இயல்பானது; இருப்பினும் παρουσία என்பதன் ‘உடனிருப்பு’ பொருளை முற்றிலும் மறைக்காமல் அடிக்குறிப்பில் தருகிறது.
- issue: ἕως λάβῃ என்பதன் மறைந்த எழுவாய்
  choice: மழைகள் கிடைக்கும்வரை என்ற எழுவாய்-நடுநிலை அமைப்பு
  alternative: விவசாயி அவற்றைப் பெறும்வரை / விளைச்சல் அவற்றைப் பெறும்வரை
  rationale: கிரேக்க வினை வடிவம் விவசாயியை இலக்கண எழுவாயாகத் தொடர அனுமதித்தாலும், பொருளில் நிலம் அல்லது பயிரும் நினைக்கப்படலாம்; தமிழில் ஒன்றை மட்டும் இறுதியாக நிர்ணயிக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்மாரி/பின்மாரி’ என்ற மரபுச் சொற்களுக்குப் பதிலாக சாதாரண வாசகர்களுக்கு உடனே புரியும் ‘முன்பருவ மழை/பின்பருவ மழை’ தேர்ந்தெடுக்கப்பட்டுள்ளது. வாக்கியத்தின் தொடக்கத்திலும் விவசாயி எடுத்துக்காட்டிலும் μακροθυμ- மீளுரை தமிழிலும் இயன்றவரை காக்கப்பட்டுள்ளது.
