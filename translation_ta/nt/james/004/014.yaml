source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: ta
  text: நாளை என்ன நடக்கும் என்று உங்களுக்குத் தெரியாது. உங்கள் வாழ்க்கை எப்படிப்பட்டது? அது சிறிது நேரம் தோன்றி, பின்னர் மறைந்துபோகும் மூடுபனி[a] போன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீராவி.”
    reason: ἀτμίς என்பதற்கான பொருத்தமான மற்றொரு சொற்பொருள்; ‘மூடுபனி’ மற்றும் ‘நீராவி’ இரண்டும் நிலையற்ற, விரைவில் மறையும் உருவகத்தை வெளிப்படுத்துகின்றன.
lexical_decisions:
- source_word: ἐπίστασθε
  choice: உங்களுக்குத் தெரியாது
  rationale: எதிர்காலத்தைப் பற்றிய மனித அறியாமையை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: τὸ τῆς αὔριον
  choice: நாளை என்ன நடக்கும்
  rationale: ‘நாளைக்குரியது’ என்ற கிரேக்க நீள்விடுபாட்டுத் தொடரின் பொருளைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: உங்கள் வாழ்க்கை எப்படிப்பட்டது?
  rationale: ποία வாழ்க்கையின் இயல்பு அல்லது தன்மையை வினவுவதால், வெறும் அடையாளத்தைவிட அதன் தன்மையைச் சுட்டும் இந்தக் கேள்வி பொருத்தமானது.
- source_word: ἀτμὶς
  choice: மூடுபனி
  rationale: சிறிது நேரம் புலப்பட்டுப் பின்னர் மறையும் உருவகத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘நீராவி’ என்பதும் சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸς ὀλίγον
  choice: சிறிது நேரம்
  rationale: குறுகிய கால அளவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: φαινομένη
  choice: தோன்றி
  rationale: தற்காலிகமாகப் புலப்படுவதைக் குறிக்கும் பங்கேற்புவினையின் உருவக வலிமையைப் பாதுகாக்கிறது.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: பின்னர் மறைந்துபோகும்
  rationale: நிகழ்வுகளின் வரிசையையும் முற்றிலும் கண்ணுக்குப் புலப்படாமல் போவதையும் சுருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: மனித வாழ்க்கையின் நிலையாமையைக் குறிக்கும் உருவகம்
  choice: வாழ்க்கையைச் சிறிது நேரம் தோன்றி மறையும் மூடுபனியுடன் ஒப்பிடும் உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘உங்கள் வாழ்க்கை நிலையற்றது’ என்று விளக்கவுரையாக மொழிபெயர்த்தல்
  rationale: எதிர்காலத் திட்டங்களைப் பற்றி பெருமைபாராட்டும் சூழலில் மனிதரின் வரம்பையும் வாழ்க்கையின் குறுகிய தன்மையையும் வசனம் வலியுறுத்துகிறது. கூடுதல் மரணம் அல்லது நியாயத்தீர்ப்புக் கோட்பாடுகளைப் புகுத்தாமல் மூலத்தின் இலக்கிய மற்றும் இறையியல் அழுத்தத்தை உருவகம் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டது. முதல் வாக்கியம் கிரேக்க நீள்விடுபாட்டை இயல்பான தமிழாக்குகிறது; இரண்டாவது கேள்வியின் சொல்லாட்சிச் சுருக்கமும் உருவகத்தின் தாக்கமும் பாதுகாக்கப்பட்டுள்ளன.
