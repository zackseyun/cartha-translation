  to: நாளை என்ன நடக்கும் என்று உங்களுக்குத் தெரியாது. உங்கள் வாழ்க்கை எப்படிப்பட்டது? அது சிறிது நேரம் தோன்றி, பின்னர் மறைந்துபோகும் மூடுபனி[a] போன்றது.
