source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: ta
  text: இப்போது கேளுங்கள், “இன்றோ நாளையோ இந்த நகரத்துக்குப்[a] போய், அங்கே ஓராண்டு தங்கி, வியாபாரம் செய்து, இலாபம் ஈட்டுவோம்” என்று சொல்கிறவர்களே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த நகரத்துக்கு” என்பதை, சூழலுக்கேற்ற இயல்பான முறையில் “இன்ன நகரத்துக்கு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில், பேசுகிறவர்களின் திட்டத்திலுள்ள ஒரு குறிப்பிட்ட நகரைச் சுட்டும் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: இப்போது கேளுங்கள்
  rationale: கண்டிப்பையோ எச்சரிப்பையோ தொடங்கும் கவன ஈர்ப்பு மரபுத்தொடர். நவீன தமிழில் நேரடியான அழைப்பின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ λέγοντες
  choice: என்று சொல்கிறவர்களே
  rationale: பெயர்ச்சொல் தன்மை பெற்ற பங்கேற்புவினை இங்கு விளிவேற்றுமையில் நேரடியாக அழைக்கிறது; தமிழ் விளிவிகுதி அந்த நேரடி கண்டிப்பைத் தக்கவைக்கிறது.
- source_word: Σήμερον ἢ αὔριον
  choice: இன்றோ நாளையோ
  rationale: ἢ பிரிநிலைப் பொருளுடையது; தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு ‘அல்லது’ என்ற மாற்றுத் தேர்வை இயல்பாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: πορευσόμεθα
  choice: போய்
  rationale: எளிய இடப்பெயர்ச்சியைக் குறிக்கும்; தொடர்ச்சியான திட்டத்தைத் தமிழில் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: இந்த நகரத்துக்குப்
  rationale: τήνδε குறிப்பிட்ட ஒரு நகரைச் சுட்டுகிறது. εἰς என்பதன் இலக்கை நவீன தமிழில் ‘-க்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: அங்கே ஓராண்டு தங்கி
  rationale: கால அளவுடன் வரும் ποιέω என்பதன் மரபுத்தொடர்ப் பொருள் ஒரு காலத்தை அங்கே கழிப்பதாகும். ‘தங்கி’ என்பது சூழலில் இயல்பான தமிழ்; வெறும் ‘செய்து’ என்ற சொல்லுக்குச் சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: ἐμπορευσόμεθα
  choice: வியாபாரம் செய்து
  rationale: வர்த்தக அல்லது வணிக நடவடிக்கையைத் தெளிவாகவும் பொதுமக்களுக்கு எளிதாகவும் தெரிவிக்கிறது.
- source_word: κερδήσομεν
  choice: இலாபம் ஈட்டுவோம்
  rationale: வணிகச் சூழலில் κερδαίνω நிதிசார் ஆதாயத்தைக் குறிக்கிறது; ‘இலாபம் ஈட்டுதல்’ அந்தப் பொருளைத் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: அகந்தையான திட்டமிடுபவர்களை நேரடியாகக் கண்டிக்கும் தொனி
  choice: ‘சொல்கிறவர்களே’ என்ற நேரடி அழைப்பு
  alternative: ‘என்று சொல்கிறவர்கள்’ என்ற மறைமுக வருணனை
  rationale: οἱ λέγοντες இங்கு விளிவேற்றுமைப் பயன்பாட்டுடன் கேட்போரை நேரடியாக எதிர்கொள்கிறது. அந்த அறிவுறுத்தல்/கண்டிப்பின் வலிமையை நேரடி அழைப்பு காக்கிறது; அடுத்த வசனத்தில் வெளிப்படும் விமர்சனத்தை இவ்வசனத்துக்குள் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. திட்டத்தின் தன்னம்பிக்கையான தொனியை எதிர்காலப் பன்மை வடிவமான ‘ஈட்டுவோம்’ தக்கவைக்கிறது; தொடர்ச்சியான செயல்கள் தமிழ் வினையெச்சங்களால் இயல்பாக இணைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு முழு மேற்கோள்/அழைப்புக்குப் பின் வைக்கப்பட்டுள்ளது.
