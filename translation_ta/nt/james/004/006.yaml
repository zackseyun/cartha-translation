id: JAS.4.6
reference: James 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: ta
  text: 'ஆனால், அவர் அதிகமான கிருபையை அளிக்கிறார். ஆகவே இவ்வாறு கூறப்படுகிறது: “கடவுள் தற்பெருமையுள்ளவர்களை எதிர்க்கிறார்; ஆனால் தாழ்மையுள்ளவர்களுக்குக் கிருபையை அளிக்கிறார்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகவே, அவர் கூறுகிறார்”; அல்லது “ஆகவே, வேதவாக்கியம் கூறுகிறது.” “கூறுகிறது” என்பதற்கான எழுவாயை கிரேக்க மொழி வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: இன்னும் அதிகமான
  rationale: μέγας என்பதன் ஒப்பீட்டு வடிவத்தைத் தெளிவாகப் பேணுகிறது; முன் சூழலோடு ஒப்பிடப்படும் கிருபையின் மிகுதியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δίδωσιν χάριν
  choice: கிருபையை அளிக்கிறார்
  rationale: வினை–செயப்படுபொருள் இணைப்பை நேரடியாக மொழிபெயர்த்து, வசனத்தில் மீண்டும் வரும் சொற்றொடரின் சொல்லாட்சிச் சீர்மையைப் பேணுகிறது.
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: λέγει
  choice: என்று சொல்லப்படுகிறது
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லை. தமிழின் செயப்பாட்டு வடிவம் ‘அவர்’ அல்லது ‘வேதவாக்கியம்’ என்று தேவையின்றிக் குறிப்பாக்காமல் மேற்கோள் சூத்திரத்தை இயல்பாகத் தருகிறது.
- source_word: ὑπερηφάνοις
  choice: பெருமையுள்ளவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையை மனிதர்களைக் குறிக்கும் வகையில் தெளிவாக மொழிபெயர்க்கிறது; அகந்தை அல்லது செருக்கு என்ற குறுகிய மனப்பான்மைச் சொல்லை மட்டும் திணிக்கவில்லை.
- source_word: ἀντιτάσσεται
  choice: எதிர்க்கிறார்
  rationale: செயல்மிக்க எதிர்நிலையை நவீன தமிழில் நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ταπεινοῖς
  choice: தாழ்மையுள்ளவர்களுக்குக்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையையும் அதன் நெறிசார் எதிர்மறை இணைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; சமூகத் தாழ்நிலையை மட்டும் குறிக்கும் வாசிப்பைத் தவிர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: வசனத்தின் தொடக்கத்திலும் மேற்கோளின் நடுவிலும் உள்ள முரண்பாட்டு வலிமையைப் பேணுகிறது.
theological_decisions:
- issue: λέγει என்பதன் மறைந்துள்ள எழுவாய்
  choice: என்று சொல்லப்படுகிறது
  alternative: என்று அவர் சொல்கிறார்; வேதவாக்கியம் சொல்கிறது
  rationale: கிரேக்க மூலத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைப் பேணி, பேசுபவர் கடவுளா அல்லது வேதவாக்கியமா என்பதை மொழிபெயர்ப்பிலேயே முடிவுசெய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கிருபை’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் சொல்லாக இருப்பதாலும், வசனத்தின் இரு இடங்களிலும் χάρις என்பதன் மீளுரையைத் துல்லியமாகப் பேணுவதாலும் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு மேற்கோள் சூத்திரத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
