  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: ta
  text: ஆகவே, கடவுளுக்குக் கீழ்ப்படியுங்கள்[a]. ஆனால் பிசாசை எதிர்த்து நில்லுங்கள்; அப்போது அவன் உங்களைவிட்டு ஓடிப்போவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு உங்களை உட்படுத்துங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: கீழ்ப்படியுங்கள்
  rationale: இறைவனுடைய அதிகாரத்துக்குத் தம்மை உட்படுத்திக்கொள்ளும் அழைப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கிரேக்கப் passive imperative இச்சூழலில் தன்னிலைப் பொருளுடன் வருவதால், மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: ὑποτάγητε என்பதன் dative complement-ஐ நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἀντίστητε
  choice: எதிர்த்து நில்லுங்கள்
  rationale: ஒருவருக்கு எதிராக உறுதியாக நிற்பது, எதிர்ப்பது ஆகிய இரு கூறுகளையும் காத்து, அறிவுரையின் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கடவுளுக்குக் கீழ்ப்படிவதற்கும் பிசாசை எதிர்ப்பதற்கும் இடையிலுள்ள மிதமான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: τῷ διαβόλῳ
  choice: பிசாசை
  rationale: இங்கு διάβολος குறிப்பிட்ட தனிப்பட்ட தீய எதிரியைக் குறிக்கும் நிலைபெற்ற தமிழ்ச் சொல்லாகும்.
- source_word: καὶ
  choice: அப்போது
  rationale: கிரேக்க καί கட்டளையைத் தொடர்ந்து வரும் விளைவை இணைக்கிறது; தமிழில் ‘அப்போது’ அந்த விளைவுறவை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: φεύξεται
  choice: ஓடிப்போவான்
  rationale: φεύγω குறிக்கும் விலகி ஓடுதலை இயல்பான தமிழில் தருகிறது; எழுவாய் முந்தைய ‘பிசாசு’ என்பதால் ஆண்பால் ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀφ’ ὑμῶν
  choice: உங்களைவிட்டு
  rationale: பேசப்படுகிறவர்களிடமிருந்து விலகிச் செல்லும் இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: διάβολος என்பதன் பொருள்
  choice: தனிப்பட்ட தீய எதிரியான ‘பிசாசு’
  alternative: பொதுவான ‘அவதூறுபவன்’ அல்லது ஆளற்ற தீய சக்தி
  rationale: இங்கு இச்சொல் குறிப்புச் சுட்டுடன் வந்து, எதிர்த்து நிற்கக்கூடியதும் ஓடிப்போகக்கூடியதுமான செயலாற்றும் நபராகச் சித்தரிக்கப்படுகிறது. ஆகவே அதன் தனிப்பட்ட எதிரி என்ற பொருள் காக்கப்படுகிறது; கூடுதல் சமயக்கோட்பாட்டு விவரம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. கட்டளைகளின் பன்மைத் தன்மையும் வசனத்தின் காரண–விளைவு ஓட்டமும் காக்கப்பட்டுள்ளன.
