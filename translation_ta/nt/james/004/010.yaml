id: JAS.4.10
reference: James 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: ta
  text: ஆண்டவருக்கு முன்பாக உங்களைத் தாழ்த்துங்கள்[a]; அவர் உங்களை உயர்த்துவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவரின் சந்நிதியில் உங்களைத் தாழ்த்துங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர் உங்களை மேன்மைப்படுத்துவார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: உங்களைத் தாழ்த்துங்கள்
  rationale: இது இறந்தகாலச் செயப்பாட்டு ஏவல் வடிவமாக இருந்தாலும், இச்சூழலில் தன்முகப் பொருளுடன் ஒரு விருப்பமான சுயத் தாழ்மைக்கான அழைப்பாக இயங்குகிறது. நவீனத் தமிழில் ‘உங்களைத் தாழ்த்துங்கள்’ இயல்பாகவும் நேரடியாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: இச்சொல் ‘முன்பாக’ அல்லது ‘சந்நிதியில்’ என்ற உறவு மற்றும் முன்னிலைப் பொருள்களைத் தருகிறது. ‘முன்பாக’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் வழக்கமான தமிழாக்கமான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது. இங்கே அது கடவுளையா இயேசு கிறிஸ்துவையா குறிக்கிறது என்பதைத் தமிழாக்கம் தேவையின்றித் தீர்மானிக்கவில்லை.
- source_word: ὑψώσει
  choice: உயர்த்துவார்
  rationale: இங்கே இச்சொல் தாழ்மைக்குப் பின்வரும் நிலை, மதிப்பு அல்லது கனத்தின் உயர்வை உருவகமாகக் குறிக்கிறது. ‘உயர்த்துவார்’ இந்த உருவகத்தையும் பொருள் அகலத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இது இரண்டாம் நபர் பன்மை நேரடிப் பொருள். ‘உங்களை’ அந்த நேரடி அழைப்பையும் பன்மைப் பொருளையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: மூலத்தில் உள்ளபடியே ‘ஆண்டவர்’ என்று பொதுவாக மொழிபெயர்த்து, அது கடவுளையா ஆண்டவராகிய இயேசுவையா குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்காமல் விடுதல்
  alternative: ‘கடவுள்’ அல்லது ‘ஆண்டவராகிய இயேசு’ என்று குறிப்பாக்குதல்
  rationale: யாக்கோபு கடிதத்தில் κύριος என்பது கடவுளையும் இயேசுவையும் குறிக்கக்கூடும். உடனடிச் சூழல் குறிப்பை மேலும் குறுக்க வேண்டிய கட்டாயத்தை ஏற்படுத்தாததால், மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நேரடி ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்நிதியில்’ என்பதைக் காட்டிலும் முதன்மை உரையில் ‘முன்பாக’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
