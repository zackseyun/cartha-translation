source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ta
  text: சகோதரர்களே,[a] ஒருவருக்கு எதிராக ஒருவர் பேசாதீர்கள்.[b] ஒரு சகோதரனுக்கு எதிராகப் பேசுகிறவனோ, தன் சகோதரனைத் தீர்ப்பிடுகிறவனோ, சட்டத்திற்கு எதிராகப் பேசி, சட்டத்தைத் தீர்ப்பிடுகிறான். நீ சட்டத்தைத் தீர்ப்பிட்டால், சட்டத்தின்படி நடக்கிறவனாக இல்லாமல், அதைத் தீர்ப்பிடுகிறவனாக இருக்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது கிரேக்கத்தில் ஆண்பால் பன்மை வடிவம்; இங்கு அது சகோதர சகோதரிகள் அடங்கிய விசுவாசச் சமூகம் முழுவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒருவரை ஒருவர் பழித்துப் பேசாதீர்கள்”; கிரேக்க வினை ஒருவருக்கு எதிராக அவரைப் பழிக்கும் வகையில் பேசுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: எதிராகப் பேசாதீர்கள் / எதிராகப் பேசுகிறவன் / எதிராகப் பேசி
  rationale: ஒருவரைப் பகைமையோடும் பழித்துரைக்கும் வகையிலும் பேசுதல் என்ற பொருளைத் தக்கவைக்கிறது; அதே வினையின் மறுமொழியையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது. ‘அவதூறு கூறுதல்’ என்பது பொருளைச் சட்டரீதியான அவதூறாகச் சுருக்கக்கூடும்.
- source_word: ἀλλήλων
  choice: ஒருவருக்கு எதிராக ஒருவர்
  rationale: பரஸ்பரச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பையும் சபைக் குடும்ப உருவகத்தையும் காக்கிறது; முழுச் சமூகத்தையும் குறிக்கக்கூடிய உள்ளடக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: ஒரு சகோதரனுக்கு / தன் சகோதரனை
  rationale: யாக்கோபில் வரும் குடும்ப உறவு உருவகத்தையும் ஒருமை வடிவத்தையும் பாதுகாக்கிறது.
- source_word: ἢ
  choice: –உம் … –உம்
  rationale: இங்கு இரு இணையான செயல்களைத் தொகுத்துக் கூறும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது; கிரேக்க ἢ-யை கடினமாக ‘அல்லது’ என்று அமைப்பதைவிட வாக்கியம் தெளிவாகிறது, இரு செயல்களின் வேறுபாடும் மறையவில்லை.
- source_word: κρίνων / κρίνει / κρίνεις / κριτής
  choice: தீர்ப்பிடுகிறவன் / தீர்ப்பிடுகிறான் / தீர்ப்பிட்டால் / தீர்ப்பிடுகிறவன்
  rationale: வினை மற்றும் பெயர்ச்சொல்லின் தொடர்ச்சியை ஒரே தமிழ் வேரால் வெளிப்படுத்துகிறது; ‘கண்டனம் செய்’ என்பதைக் காட்டிலும் பரந்த பொருளை வைத்திருக்கிறது.
- source_word: νόμου / νόμον
  choice: திருச்சட்டம்
  rationale: இது சாதாரண மனிதச் சட்டமல்ல, கடவுளுடைய அதிகாரமுள்ள நெறியைக் குறிக்கும் சூழலைச் சுருக்கமாக உணர்த்துகிறது; மோசேயின் சட்டம் அல்லது அரச கட்டளை என்று குறிப்பாக முடிவுசெய்யவில்லை.
- source_word: ποιητὴς νόμου
  choice: திருச்சட்டத்தின்படி நடக்கிறவன்
  rationale: ‘சட்டத்தைச் செய்கிறவன்’ என்ற இயல்பற்ற சொல்லுக்குப் பதிலாக, அதன் கட்டளைகளை நடைமுறைப்படுத்துகிறவன் என்ற கிரேக்கப் பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ἀδελφοί என்ற அழைப்பு யாரைக் குறிக்கிறது
  choice: முதன்மை உரையில் ‘சகோதரர்களே’; கலப்புப் பாலின விசுவாசச் சமூகத்தையும் குறிக்கலாம் என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சகோதர சகோதரிகளே / உடன்பிறந்தவர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் குடும்ப உருவகத்தையும் காக்கிறது; அதேவேளை சூழலில் உள்ளடக்கமான பயன்பாட்டை மறைக்கவில்லை.
- issue: νόμος என்பதன் குறிப்பிட்ட பொருள்
  choice: ‘திருச்சட்டம்’ என்று மொழிபெயர்த்து, அது எந்தச் சட்டம் என்பதை மேலும் குறுக்காமல் விடுதல்
  alternative: மோசேயின் சட்டம் / அரச சட்டம் / கடவுளின் சட்டம்
  rationale: யாக்கோபு முன்பு எடுத்துரைத்த இறைநெறி, குறிப்பாக அயலான்மீது அன்புகூரும் கட்டளை, பின்னணியில் இருக்கலாம்; ஆனால் இவ்வசனம் குறிப்பிட்ட அடையாளத்தை வெளிப்படையாக அளிக்காததால் அந்தத் தெளிவின்மை காக்கப்படுகிறது.
- issue: சகோதரனைத் தீர்ப்பிடுவது திருச்சட்டத்தைத் தீர்ப்பிடுவதாகும் என்ற வாதம்
  choice: மூலத்தில் உள்ள வலுவான இறையியல் பதற்றத்தை விளக்கிச் சீராக்காமல் நேரடியாக வைத்தல்
  alternative: சட்டத்தை மீறுகிறான் / சட்டத்தை அவமதிக்கிறான்
  rationale: கிரேக்க உரை ‘திருச்சட்டத்திற்கு எதிராகப் பேசுதல்’ மற்றும் ‘திருச்சட்டத்தைத் தீர்ப்பிடுதல்’ என்றே கூறுகிறது; அதன் தர்க்கத்தை மென்மையாக்குவது ஆசிரியரின் கூர்மையான எச்சரிக்கையை இழக்கச் செய்யும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் அறிவுறுத்தல் தொனியும் காக்கப்பட்டுள்ளன. ‘திருச்சட்டம்’ என்பது வேதாகமச் சூழலில் இயல்பான, உயர்வான சொல்; ‘தீர்ப்பிடு’ என்ற ஒரே சொல் மீண்டும் பயன்படுத்தப்பட்டு கிரேக்கத்தின் சொல் தொடர் தெளிவாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
