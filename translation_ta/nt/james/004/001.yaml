id: JAS.4.1
reference: James 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: ta
  text: போர்கள் எங்கிருந்து, சண்டைகள் எங்கிருந்து உங்களிடையே வருகின்றன?[a][b] உங்கள் உடல் உறுப்புகளில் போராடிக்கொண்டிருக்கும் உங்கள் இன்பங்களிலிருந்தல்லவா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போர்கள்… சண்டைகள்” என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பு; சமூகத்திற்குள் நிகழும் “மோதல்கள்… சச்சரவுகள்” என்றும் பொருள்படலாம். மூல கிரேக்கம் இராணுவச் சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “உங்களிடையே” என்பதற்கு “உங்களுக்குள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கம் வாசகர்களுக்கிடையிலான மோதலையோ அவர்களுக்குள் நிகழும் மோதலையோ குறிக்கக்கூடும்; முழு வசனமும் வெளிப்புறச் சண்டையை உள்ளார்ந்த இன்பங்களோடு இணைக்கிறது. மேலும், “எங்கிருந்து” என்பது மூலத்தில் “போர்கள்” மற்றும் “சண்டைகள்” ஆகிய இரண்டுடனும் தனித்தனியாக வருகிறது.
    reason: alternative_reading
  - marker: c
    text: “உடல் உறுப்புகள்” என்பது மூலச்சொல்லின் நேரடிப் பொருள்; அது உடலின் பாகங்களையோ, விரிவாக ஒருவருக்குள் செயல்படும் ஆற்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... πόθεν
  choice: எங்கிருந்து வருகின்றன
  rationale: மூலத்தில் தோற்றுவாயை வினவும் சொல் இருமுறை வருகிறது. தமிழில் போர்களும் சண்டைகளும் இணைந்த எழுவாயாக அமைவதால் ஒரே வினாவாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; அதன் மூலத் திரும்பக்கூறலை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: πόλεμοι
  choice: போர்கள்
  rationale: சமூகத்திற்குள் நிகழும் கடுமையான மோதல்களைக் குறிக்கும் இராணுவ உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: μάχαι
  choice: சண்டைகள்
  rationale: πόλεμοι என்பதிலிருந்து வேறுபட்ட, இயல்பான நவீனத் தமிழ்ச் சொல்லாக இருந்து இரண்டாவது இராணுவச் சொல்லையும் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: இங்கு சமூக உறுப்பினர்களுக்கிடையிலான வெளிப்புற மோதல் முதன்மையாகத் தெரிகிறது; அதேவேளை ‘உங்களுக்குள்’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: οὐκ ἐντεῦθεν, ἐκ
  choice: '...இலிருந்துதானே?'
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க மறுப்புவினாவைத் தமிழில் இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡδονῶν
  choice: இன்பவேட்கைகள்
  rationale: ἡδονή என்பதின் இன்பநுகர்ச்சி சார்ந்த பொருளையும், இங்கு மோதலின் செயற்படும் உள்மூலமாக அது வருவதையும் தமிழில் தெளிவாகக் காட்டுகிறது; வெறும் ‘இன்பங்கள்’ என்பது இங்கு அவையே போர் செய்வதாக இயல்பற்றதாக இருக்கும்.
- source_word: στρατευομένων
  choice: போர் செய்துகொண்டிருக்கும்
  rationale: நடந்துகொண்டிருக்கும் செயலைக் குறிக்கும் பங்கேற்புவினையின் தொடர்ச்சியையும் இராணுவ உருவகத்தையும் காக்கிறது.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: உங்கள் உடல் உறுப்புகளில்
  rationale: μέλη என்பதன் நேரடியான உடல்-உறுப்பு உருவகத்தைப் பாதுகாத்து, உடலுறுப்புகளையோ மனிதனுக்குள் செயல்படும் ஆற்றல்களையோ குறிக்கும் திறந்த பொருளை அடிக்குறிப்புடன் வைத்திருக்கிறது.
theological_decisions:
- issue: தொடக்க மோதல்கள் உள்ளார்ந்தவையா அல்லது சமூகத்தினருக்கிடையிலானவையா
  choice: முதல் ἐν ὑμῖν என்பதை ‘உங்களிடையே’ என்றும் இறுதியை ‘உங்கள் உடல் உறுப்புகளில்’ என்றும் மொழிபெயர்த்து, வெளிப்புறச் சண்டைக்கும் உள்ளார்ந்த இன்பவேட்கைகளுக்கும் உள்ள தொடர்பைக் காத்தல்
  alternative: முதல் சொற்றொடரை ‘உங்களுக்குள்’ என்றும், இறுதியை பொதுவாக ‘உங்களுக்குள்’ என்றும் மொழிபெயர்த்தல்
  rationale: யாக்கோபு சமூகத்தில் காணப்படும் சண்டைகளை மனிதருக்குள் போராடும் வேட்கைகளோடு இணைக்கிறார். இவற்றில் ஒன்றை மட்டும் தேர்ந்து மற்றொன்றை நீக்காமல் மூலத்தின் இறையியல் மற்றும் மனிதவியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘போர்கள்’, ‘சண்டைகள்’, ‘போர் செய்துகொண்டிருக்கும்’ என்ற சொற்கள் மூலத்தின் தொடர்ச்சியான இராணுவ உருவகத்தைப் பாதுகாக்கின்றன. வினா அமைப்பு தமிழில் இயல்பாக இருக்கச் சுருக்கப்பட்டாலும், மூலத்தின் இருமுறை வரும் ‘எங்கிருந்து’ அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
