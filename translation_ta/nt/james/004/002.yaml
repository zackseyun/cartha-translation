review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the force of ἐπιθυμεῖτε, φονεύετε, ζηλοῦτε, μάχεσθε, πολεμεῖτε, and leaves the addressee of αἰτεῖσθαι implicit. However, “நீங்கள் விரும்புவதை” supplies an object that is not expressed in the Greek; the verb ἐπιτυχεῖν can remain objectless in Tamil as well. Rendering both occurrences of οὐκ ἔχετε as “உங்களிடம் இல்லை” more directly reflects “you do not have” and preserves the deliberate repetition.
  naturalness: The revised wording is natural modern standard Tamil, retains the terse escalating clauses, and avoids unnecessary pronoun repetition. “போர் செய்கிறீர்கள்” remains clear and suitably stronger than “சண்டையிடுகிறீர்கள்.”
  terminology: “ஆசைப்படுகிறீர்கள்,” “கொலை செய்கிறீர்கள்,” and “பொறாமைப்படுகிறீர்கள்” appropriately preserve the strong desire, murder, and negative envy senses. The footnotes correctly retain the lexical qualification for desire and the implicit contextual object of asking.
  issues:
  - severity: medium
    issue: An unexpressed object is added to ἐπιτυχεῖν.
    rationale: “நீங்கள் விரும்புவதை அடைய முடியவில்லை” specifies ‘what you desire,’ whereas the Greek says only that the readers cannot attain/obtain. The sense is plausible from context but should remain implicit for optimal equivalence.
  - severity: low
    issue: The repeated rendering of οὐκ ἔχετε is less direct than necessary.
    rationale: “உங்களுக்குக் கிடைப்பதில்லை” shifts from possession (‘you do not have’) toward receiving/getting. “உங்களிடம் இல்லை” is more direct and preserves the repeated Greek wording.
