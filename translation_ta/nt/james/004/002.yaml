id: JAS.4.2
reference: James 4:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: ta
  text: நீங்கள் ஆசைப்படுகிறீர்கள்; ஆனால் உங்களிடம் இல்லை[a]. நீங்கள் கொலை செய்கிறீர்கள், பொறாமைப்படுகிறீர்கள்; ஆனால் அடைய முடியவில்லை. நீங்கள் சண்டையிடுகிறீர்கள், போர் செய்கிறீர்கள். நீங்கள் கேட்காததால் உங்களிடம் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆசைப்படுகிறீர்கள்’ என்பதற்கு ‘பேராசைப்படுகிறீர்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் வலுவான ஆசையைக் குறிக்கிறது, இச்சூழலில் அது பெரும்பாலும் தவறான ஆசையாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு யாரிடம் கேட்க வேண்டும் என்பது வெளிப்படையாகக் கூறப்படவில்லை; சுற்றியுள்ள சூழலின்படி தேவனிடம் கேட்பது உட்பொருளாக உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: ஆசைப்படுகிறீர்கள்
  rationale: வலுவான விருப்பத்தைக் குறிக்கிறது; இச்சூழலில் அது தவறான ஆசையாக இருந்தாலும், சொற்பொருளின் பரப்பைச் சுருக்காமல் ‘ஆசைப்படுகிறீர்கள்’ என வழங்கப்படுகிறது.
- source_word: φονεύετε
  choice: கொலை செய்கிறீர்கள்
  rationale: பொதுவாகக் கொல்வதைவிடக் குற்றத்தன்மையுள்ள கொலையைக் குறிக்கும் வலுவான வினை; கிரேக்கத்தின் கடுமையைப் பாதுகாக்கிறது.
- source_word: ζηλοῦτε
  choice: பொறாமைப்படுகிறீர்கள்
  rationale: இச்சூழலின் பகைமையும் நிறைவேறாத ஆசையும் எதிர்மறையான ‘பொறாமை’ பொருளை ஆதரிக்கின்றன.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: நீங்கள் விரும்புவதை அடைய முடியவில்லை
  rationale: ἐπιτυγχάνω இங்கு நாடிய ஒன்றைப் பெறுதல் அல்லது அடைதலைக் குறிக்கிறது; தமிழில் தேவையான மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μάχεσθε
  choice: சண்டையிடுகிறீர்கள்
  rationale: தகராறு அல்லது போராட்டத்தைச் சுட்டும் வினை; அடுத்த வலுவான πολεμεῖτε என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: πολεμεῖτε
  choice: போர் செய்கிறீர்கள்
  rationale: μάχεσθε என்பதைக் காட்டிலும் வலுவான போர்மொழியைப் பாதுகாக்கிறது.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: நீங்கள் கேட்காததால்
  rationale: διά உடனான பெயராக்கப்பட்ட வினையெச்சம் காரணத்தைக் குறிக்கிறது; கேட்கப்படுபவர் தேவன் என்பது சூழலில் மறைமுகமாக இருந்தாலும் கிரேக்கத்தில் வெளிப்படையாக இல்லை.
theological_decisions:
- issue: φονεύετε என்பதை உருவகமாக மென்மைப்படுத்த வேண்டுமா
  choice: முதன்மை உரையில் ‘கொலை செய்கிறீர்கள்’ என்ற வலுவான பொருளைத் தக்கவைத்தல்
  alternative: ‘கொல்கிறீர்கள்’ அல்லது உருவக விளக்கத்தை உரைக்குள் சேர்த்தல்
  rationale: வினைச்சொல்லின் கடுமையான சொற்பொருளைப் பாதுகாக்க வேண்டும்; இது மிகைப்படுத்தலா அல்லது உருவகமா என்பது விளக்கவுரைக்குரியது.
- issue: αἰτεῖσθαι என்பதற்குரிய மறைமுகப் பொருளாக தேவனை வெளிப்படையாகச் சேர்க்க வேண்டுமா
  choice: ‘நீங்கள் கேட்காததால்’ என்று பொருளை மறைமுகமாகவே வைத்தல்
  alternative: ‘நீங்கள் தேவனிடம் கேட்காததால்’
  rationale: அடுத்த வசனத்தோடு சேர்ந்த சூழல் தேவனைச் சுட்டுகிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரையில் தேவன் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்ச்சியான மோதல் மொழியும் ‘கொலை’ என்ற அதிர்ச்சியூட்டும் வலிமையும் மென்மைப்படுத்தப்படவில்லை; கேட்கப்படுபவர் தேவன் என்ற உட்பொருள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
