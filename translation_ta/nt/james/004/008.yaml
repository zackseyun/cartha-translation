id: JAS.4.8
reference: James 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: ta
  text: தேவனிடம் நெருங்கி வாருங்கள்; அவரும் உங்களிடம் நெருங்கி வருவார். பாவிகளே, உங்கள் கைகளைச் சுத்தமாக்குங்கள்; இருமனமுள்ளவர்களே[a], உங்கள் இதயங்களைத் தூய்மைப்படுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இரு ஆன்மா கொண்டவர்களே.” இது பற்றுறுதியிலோ உள்ளார்ந்த அர்ப்பணிப்பிலோ பிளவுபட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: நெருங்கி வாருங்கள்
  rationale: இது பன்மை முன்னிலை கட்டளை. தேவனை உறவு சார்ந்தும் ஆன்மிகமாகவும் அணுகும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்த வாக்கியத்திலுள்ள அதே வினைச்சொல்லுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: τῷ θεῷ
  choice: தேவனிடம்
  rationale: ἐγγίζω என்பதுடன் வரும் இலக்கைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἐγγιεῖ
  choice: அவரும் உங்களிடம் நெருங்கி வருவார்
  rationale: எழுவாய் முந்தைய தொடரிலுள்ள தேவன். எதிர்கால வினையாகவும், முதல் தொடரின் சொல்லிணைப்பை மீண்டும் ஒலிக்கச் செய்யும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καθαρίσατε
  choice: சுத்தமாக்குங்கள்
  rationale: கட்டளையின் நேரடியான வலிமையைக் காக்கிறது; சடங்கு சார்ந்த மற்றும் அறநெறி சார்ந்த தூய்மைப்படுத்தல் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது.
- source_word: χεῖρας
  choice: உங்கள் கைகளை
  rationale: கிரேக்கத்தில் உடைமைச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், நேரடி அழைப்பில் தமிழ் இயல்புக்காக ‘உங்கள்’ சேர்க்கப்பட்டுள்ளது. வெளிப்புற நடத்தையைக் குறிக்கக்கூடிய உடல் உருவகம் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: ἁμαρτωλοί
  choice: பாவிகளே
  rationale: பன்மை விளிவேற்றுமையின் நேரடியான கண்டிப்பைச் சுருக்கமின்றிக் காக்கிறது.
- source_word: ἁγνίσατε
  choice: தூய்மைப்படுத்துங்கள்
  rationale: καθαρίσατε என்பதிலிருந்து யாக்கோபு பயன்படுத்தும் சொல்வேறுபாட்டைக் காக்க, ‘சுத்தமாக்குங்கள்’ என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ளது; உள்ளார்ந்த பரிசுத்தப்படுத்தலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: καρδίας
  choice: உங்கள் இதயங்களை
  rationale: உள்ளார்ந்த மனிதர், நோக்கங்கள், பற்றுறுதி ஆகியவற்றைக் குறிக்கும் வேதாகம உருவகத்தைத் தக்கவைக்கிறது; தமிழ் இயல்புக்காக ‘உங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: δίψυχοι
  choice: இருமனமுள்ளவர்களே
  rationale: உள்ளார்ந்த பற்றுறுதி அல்லது விசுவாசத்தில் பிளவுபட்டவர்களை நவீன தமிழில் புரியும்படி குறிக்கிறது; கிரேக்கத்தின் சொற்சித்திரம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தூய்மைப்படுத்தும் கட்டளையின் உடல் உருவகமும் அறநெறிப் பொருளும்
  choice: ‘கைகள்’, ‘இதயங்கள்’ என்ற உருவகங்களை அப்படியே வைத்து, அவற்றை வெளிப்புறச் செயல்கள் மற்றும் உள்ளார்ந்த நோக்கங்கள் என்று உரைக்குள் விரித்துரைக்காமல் விடுதல்.
  alternative: ‘உங்கள் செயல்களைத் திருத்துங்கள்; உங்கள் உள்ளார்ந்த நோக்கங்களைத் தூய்மைப்படுத்துங்கள்’ என்று விளக்க மொழிபெயர்த்தல்.
  rationale: இந்த மொழி அறநெறி சார்ந்ததோடு சடங்கு தூய்மையின் எதிரொலியையும் கொண்டிருக்கலாம். உருவகத்தைத் தக்கவைப்பது அந்தப் பொருள் செறிவையும் இறையியல் பதற்றத்தையும் முன்கூட்டியே தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: δίψυχοι என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘இருமனமுள்ளவர்களே’ என்று மொழிபெயர்த்தல்.
  alternative: ‘இரு ஆன்மா கொண்டவர்களே’ அல்லது ‘பிளவுபட்ட பற்றுறுதியுள்ளவர்களே’ என்று மொழிபெயர்த்தல்.
  rationale: ‘இருமனமுள்ளவர்கள்’ என்பது சாதாரண வாசகருக்குப் புரியக்கூடியதாக இருந்து, உள்ளார்ந்த பற்றுறுதியின் பிளவை வெளிப்படுத்துகிறது. மூலத்தின் செறிவான ‘இரு ஆன்மா’ உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கட்டளைத் தொனியுடனும் மதிப்புமிக்க எளிய நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘சுத்தமாக்குங்கள்’ மற்றும் ‘தூய்மைப்படுத்துங்கள்’ என்பவற்றால் கிரேக்கச் சொல்வேறுபாடு காக்கப்பட்டுள்ளது; விளிவேற்றுமை அழைப்புகள் இயல்பான தமிழ்ச் சொல்லமைப்புக்காக தத்தம் கட்டளைக்கு முன் வைக்கப்பட்டுள்ளன.
