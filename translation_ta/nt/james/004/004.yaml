id: JAS.4.4
reference: James 4:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: ta
  text: விபசாரப் பெண்களே[a], உலகத்துடனான நட்பு[c] கடவுளுக்கு எதிரான பகைமை[b] என்பது உங்களுக்குத் தெரியாதா? ஆகையால், உலகத்தின் நண்பராக இருக்க விரும்புகிற எவரும் கடவுளுக்குப் பகைவராகத் தம்மை ஆக்கிக்கொள்கிறார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தச் சொல் நேரடியாக ‘விபசாரப் பெண்களே’ என்று பொருள்படும். தீர்க்கதரிசன நூல்களின் உடன்படிக்கை மொழியை எதிரொலிக்கும் வகையில், கடவுளுக்கு ஆன்மிக ரீதியில் உண்மையற்றிருப்பதை இது உருவகமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளுடனான பகைமை.’
    reason: alternative_reading
  - marker: c
    text: இங்கு ‘உலகம்’ என்பது படைப்புலகத்தையே குறிக்காமல், கடவுளுக்கு எதிராக நிற்கும் மனித ஒழுங்கைக் குறிக்கிறது.
    reason: cultural_note
  - marker: d
    text: அல்லது, ‘கடவுளுக்குப் பகைவராக ஆகிறார்.’
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: விபசாரப் பெண்களே
  rationale: பெண்பால் பன்மை விளிவேற்றை மென்மைப்படுத்தாமல் நேரடியாகக் காக்கிறது. இங்கு இது உடன்படிக்கை சார்ந்த ஆன்மிக உண்மையின்மையைக் குறிக்கும் உருவகமாக இருக்கலாம்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: எதிர்மறை வினாவின் கண்டிக்கும் சொல்லாற்றலை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: φιλία
  choice: நட்பு
  rationale: உறவு சார்ந்த பொருளைக் காப்பதுடன், பின்னர் வரும் φίλος என்பதோடு உள்ள சொற்பொருள் தொடர்பையும் நிலைநிறுத்துகிறது.
- source_word: κόσμου
  choice: உலகம்
  rationale: மூலத்தின் பரந்த சொல்லை விளக்கவுரையாக விரிவாக்காமல் காக்கிறது; இச்சூழலில் அதன் குறிப்பிட்ட பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: கடவுளுக்கு எதிரான பகைமை
  rationale: τοῦ θεοῦ என்பதை நோக்குப் பொருள் கொண்ட பிறப்புவேற்றுமையாகப் புரிந்து, கடவுளை நோக்கிய எதிர்ப்பைத் தெளிவாகத் தெரிவிக்கிறது; வேற்றுமையின் சாத்தியமான பரந்த உறவு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὃς ἐὰν οὖν
  choice: எவரும்
  rationale: நிபந்தனை சார்ந்த பொதுமைப்படுத்தும் பொருளை இயல்பான தமிழில் தருகிறது. முந்தைய கூற்றிலிருந்து வரும் முடிவை வசனங்களின் தொடர்ச்சியும் வாக்கிய அமைப்பும் வெளிப்படுத்துகின்றன.
- source_word: βουληθῇ
  choice: விரும்புகிற
  rationale: βούλομαι என்பதன் மனவிருப்பம் மற்றும் நோக்கமுள்ள தேர்வு ஆகியவற்றை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: உலகத்துக்கு நண்பராக இருக்க
  rationale: φιλία/φίλος ஆகியவற்றுக்கிடையிலான தொடர்பைக் காத்து, மூலத்தின் பெயர்ச்சொல் சார்ந்த வெளிப்பாட்டைத் தொடர்கிறது.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: கடவுளுக்குப் பகைவர்
  rationale: ‘உலகத்தின் நண்பர்’ என்பதற்கு எதிராக நிற்கும் உறவு சார்ந்த வலுவான சொல்லை நேரடியாகக் காக்கிறது.
- source_word: καθίσταται
  choice: தம்மை ஆக்கிக்கொள்கிறார்
  rationale: தேர்ந்தெடுத்த இணைப்பின் விளைவாக ஒருவர் அந்த நிலைக்கு வருவதையும் அதிலுள்ள ஒழுக்கப் பொறுப்பையும் வெளிப்படுத்துகிறது; ‘ஆகிறார்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: μοιχαλίδες என்பதன் உருவகப் பொருள்
  choice: முதன்மை உரையில் ‘விபசாரப் பெண்களே’ என்ற நேரடியான சொல்லை வைத்தல்
  alternative: ‘உண்மையற்ற மக்களே’ அல்லது ‘விபசாரம் செய்கிறவர்களே’
  rationale: தீர்க்கதரிசன நூல்களில் காணப்படும் உடன்படிக்கை உண்மையின்மையின் பின்னணி இங்கு இருக்கக்கூடும். ஆயினும், மூலத்தின் கூர்மையான உருவகத்தையும் குறிக்கப்பட்ட பெண்பால் வடிவத்தையும் விளக்கவுரையால் மாற்றாமல் காப்பது பொருத்தமானது.
- issue: κόσμος என்பதன் சூழல்சார் பொருள்
  choice: முதன்மை உரையில் ‘உலகம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளுக்கு எதிரான உலக ஒழுங்கு’
  rationale: இங்கு படைப்புலகம் தானே அல்ல, கடவுளுக்கு எதிராக அமைந்த மனித மதிப்பீட்டு ஒழுங்கு குறிக்கப்படுகிறது. இருந்தாலும் மூலத்தின் சொல்லளவை உரையில் காத்து, விளக்கத்தை அடிக்குறிப்பில் தருவது தேவையற்ற பொருள் விரிவாக்கத்தைத் தவிர்க்கிறது.
- issue: ἔχθρα τοῦ θεοῦ என்பதில் பிறப்புவேற்றுமையின் தொடர்பு
  choice: ‘கடவுளுக்கு எதிரான பகைமை’ என்று நோக்குப் பொருளாக மொழிபெயர்த்தல்
  alternative: ‘கடவுளோடுள்ள பகைமை’
  rationale: உலகத்துடனான நட்பு கடவுளை நோக்கிய எதிர்ப்பாக அமைகிறது என்பது சூழலுக்கு நன்கு பொருந்துகிறது. அதேவேளை, கிரேக்கத் தொடரின் உறவுசார் பரந்த சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- issue: καθίσταται என்பதில் மனிதச் செயற்பாடும் நிலைமாற்றமும்
  choice: ‘தம்மை ஆக்கிக்கொள்கிறார்’
  alternative: ‘ஆகிறார்’
  rationale: உலகத்தின் நண்பராக இருக்க விரும்பும் தேர்வுக்கும் அதன் விளைவான பகைவர் நிலைக்கும் உள்ள தொடர்பை இத்தேர்வு வெளிப்படுத்துகிறது; வெறும் நிலைமாற்றத்தை வலியுறுத்தும் மாற்றும் மொழியியல் ரீதியாகச் சாத்தியம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்க மூலத்தின் நேரடியான கண்டிப்பு, ‘நட்பு/நண்பர்’ மற்றும் ‘பகைமை/பகைவர்’ என்ற இணைச் சொல் அமைப்பு, பெண்பால் அழைப்பின் கூர்மை ஆகியவை காக்கப்பட்டுள்ளன. ‘எவரும்/தம்மை/ஆகிறார்’ என்பது பொதுவான மனிதரைச் சுட்டும் மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
