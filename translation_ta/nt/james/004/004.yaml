revisions:
- from: விபசாரப் பெண்களே[a], உலகத்தோடான நட்பு கடவுளுக்கு எதிரான பகைமை[b] என்பது உங்களுக்குத் தெரியாதா? உலகத்துக்கு நண்பராக இருக்க விரும்புகிற எவரும்[c], கடவுளுக்குப் பகைவராகத் தம்மை ஆக்கிக்கொள்கிறார்[d].
  to: விபசாரப் பெண்களே[a], உலகத்துடனான நட்பு[c] கடவுளுக்கு எதிரான பகைமை[b] என்பது உங்களுக்குத் தெரியாதா? ஆகையால், உலகத்தின் நண்பராக இருக்க விரும்புகிற எவரும் கடவுளுக்குப் பகைவராகத் தம்மை ஆக்கிக்கொள்கிறார்[d].
  rationale: The revision restores the inferential force of οὖν with ‘ஆகையால்,’ changes the potentially directional ‘உலகத்துக்கு நண்பராக’ to ‘உலகத்தின் நண்பராக,’ and regularizes the reflexive construction. Footnote c is anchored directly to the first occurrence of ‘உலகம்,’ the word it explains. No doctrinal expansion has been added, and the metaphorical force and feminine form of μοιχαλίδες remain in the main text.
  reviewer_model: gpt-5.6-terra
