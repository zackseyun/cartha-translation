source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: ta
  text: சட்டமளிப்பவரும் நீதிபதியுமானவர் ஒருவரே. அவரே காப்பாற்றவும் அழிக்கவும் வல்லவர். ஆனால், உன் அடுத்தவரைத் தீர்ப்பிடுகிற நீ யார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: சட்டம் இயற்றுபவர்
  rationale: சட்டத்தை வழங்கி நிறுவும் அதிகாரமுள்ளவரைக் குறிக்கும் கிரேக்கச் சொல்லைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: κριτής / κρίνων
  choice: நீதிபதி / தீர்ப்பிடுகிற
  rationale: பெயர்ச்சொல்லில் நீதித்துறை அதிகாரத்தையும், வினையெச்சத் தொடரில் மற்றவர்மீது தீர்ப்பு கூறும் செயலைவும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: காப்பாற்றவும் அழிக்கவும்
  rationale: இரண்டு எதிர்மறைச் செயல்களையும் கிரேக்க மூலத்தின் வலிமையோடும் இறையியல் பதற்றத்தோடும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πλησίον
  choice: சக மனிதன்
  rationale: இங்கு வெறும் அருகில் குடியிருப்பவரை மட்டும் அல்லாமல், ஒருவர் தொடர்புகொள்ளும் மற்ற மனிதரைக் குறிக்கும் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சட்டம் இயற்றவும் தீர்ப்பிடவும் உள்ள தனித்துவ அதிகாரம்
  choice: “ஒருவரே” என்பதை வாக்கியத்தின் மைய வலியுறுத்தலாக வைத்தல்
  alternative: குறிப்பாக “தேவன் ஒருவரே” என்று பெயரைச் சேர்த்தல்
  rationale: மூலத்தில் கர்த்தர்/தேவன் என்ற பெயர் வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், ஒரே சட்டமளிப்பவரும் நீதிபதியும் என்ற மறைமுக இறைக் குறிப்பைப் பாதுகாக்கிறது.
- issue: இறுதி கேள்வியின் இலக்கணத் தொனி
  choice: “தீர்ப்பிடுகிற நீ யார்?”
  alternative: “தீர்ப்பிட நீ யார்?”
  rationale: கிரேக்கத்தில் உள்ள நிகழ்கால வினையெச்சமான ὁ κρίνων-ஐப் பாதுகாத்து, அந்த நபர் செய்துகொண்டிருக்கும் செயலை நேரடியாக எதிர்கொள்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். மூலத்தின் கடுமையான எதிரெதிர் அமைப்பும் இறுதி சொல்லாட்சிக் கேள்வியும் பாதுகாக்கப்பட்டுள்ளன.
