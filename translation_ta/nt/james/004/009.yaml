  source_fidelity: 'மூன்று aorist கட்டளைகளின் தீவிரமும் வரிசையும் காக்கப்பட்டுள்ளன: ταλαιπωρήσατε—«துயருறுங்கள்», πενθήσατε—«துக்கப்படுங்கள்», κλαύσατε—«அழுங்கள்». இறுதி இரு மூன்றாம்-நபர் கட்டளை அமைப்புகளும் «மாறட்டும்» எனத் துல்லியமாகத் தரப்பட்டுள்ளன. «துக்கமாகவும்» πένθος-இன் துயர/துக்கப் பொருளையும், «முகவாட்டமாகவும்» κατήφεια-வின் சோர்வுற்ற, கீழ்நோக்கிய மனநிலையையும் போதிய அளவு வெளிப்படுத்துகின்றன.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் வசனத்தின் கடுமையான அழைப்பு-தொனிக்கு ஏற்றவாறும் உள்ளது. «முகவாட்டம்» பொதுவாக முகத்தில் வெளிப்படும் சோர்வையும் குறிக்கக்கூடியது; ஆனால் இச்சூழலில் அது மனச்சோர்வு/வாட்டம் என்ற பொருளில் புரியக்கூடிய, சுருக்கமான தேர்வாக உள்ளது.
  terminology: «துயருறுங்கள் / துக்கப்படுங்கள் / அழுங்கள்» என்ற வேறுபட்ட மூன்று வினைச்சொற்கள் மூலத்தின் மும்மடங்கு அழைப்பை ஒன்றாக்காமல் காக்கின்றன. «முகவாட்டம்» என்பதற்கான மாற்றுவழியாக அடிக்குறிப்பில் «மனச்சோர்வு» கொடுக்கப்பட்டிருப்பது κατήφεια-வின் பொருள் எல்லையை வாசகருக்குத் தெளிவுபடுத்துகிறது.
