id: JAS.4.9
reference: James 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: ta
  text: துயருறுங்கள்[a]; துக்கப்படுங்கள்; அழுங்கள். உங்கள் சிரிப்பு துக்கமாகவும், உங்கள் மகிழ்ச்சி முகவாட்டமாகவும்[b] மாறட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவலப்படுங்கள்.” கிரேக்க வினை துயரம் அல்லது அவலநிலையில் இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மனச்சோர்வாகவும்.” கிரேக்கச் சொல் சோகத்தால் சோர்ந்த, உற்சாகமற்ற நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: துயருறுங்கள்
  rationale: துயரம் அல்லது அவலநிலைக்கு உள்ளாகி வருந்துவதைக் குறிக்கும் வலுவான இறந்தகாலக் கட்டளை. அடுத்து வரும் ‘துக்கப்படுங்கள்,’ ‘அழுங்கள்’ என்பவற்றோடு ஒன்றாக்கிவிடாமல், மும்மடங்கான அழைப்பின் முதல் கூறை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: πενθήσατε
  choice: துக்கப்படுங்கள்
  rationale: ஆழ்ந்த துயரத்தையும் மனந்திரும்புதலுக்குரிய வருத்தத்தையும் வெளிப்படுத்தும் வழக்கமான, நேரடியான சொல்.
- source_word: κλαύσατε
  choice: அழுங்கள்
  rationale: கண்ணீருடன் அழுவதைக் குறிக்கும் நேரடியான தமிழ் வினை; முந்தைய ‘துக்கப்படுங்கள்’ என்பதிலிருந்து செயலைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: ὁ γέλως ὑμῶν
  choice: உங்கள் சிரிப்பு
  rationale: கிரேக்கத்தின் concrete noun மற்றும் உடைமைத் தொடர்பை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: εἰς πένθος
  choice: துக்கமாக
  rationale: πενθέω என்பதுடன் உள்ள சொற்பொருள் தொடர்பைக் காத்து, சிரிப்பு துக்கமாக மாறும் நிலைமாற்றத்தை இயல்பான தமிழில் தருகிறது.
- source_word: μετατραπήτω
  choice: மாறட்டும்
  rationale: மூன்றாம் நபர் இறந்தகாலப் passive imperative-இன் கட்டளை வலிமையைத் தமிழ் அனுமதி/கட்டளை வடிவில் இயல்பாக வெளிப்படுத்துகிறது; மாற்றத்தின் காரணியை உரையில் இல்லாதபடி சேர்ப்பதில்லை.
- source_word: ἡ χαρὰ
  choice: உங்கள் மகிழ்ச்சி
  rationale: இரண்டாம் இணைக் கூறிலும் கிரேக்கத்தில் முன்பு வெளிப்படையாக வந்த ὑμῶν என்பதன் உடைமைப் பொருள் தொடர்வதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς κατήφειαν
  choice: முகவாட்டமாக
  rationale: கீழ்நோக்கிய, சோகமுற்ற, உற்சாகமற்ற நிலையைக் குறிக்கும் κατήφεια என்பதற்கு சுருக்கமான, இயல்பான தமிழ் இணை; சொற்சூழலின் வெளிப்படையான உணர்ச்சி எதிர்மறையையும் காக்கிறது.
theological_decisions:
- issue: மனந்திரும்புதலுக்கான அழைப்பின் உணர்ச்சி வலிமை
  choice: கட்டளைகளை மென்மைப்படுத்தாமல், துயரம், துக்கம், அழுகை ஆகியவற்றுக்கான வலுவான அழைப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை வெறும் தீவிரமாக அல்லது நிதானமாக நடந்துகொள்ளும் மெல்லிய அறிவுரையாக மொழிபெயர்த்தல்.
  rationale: யாக்கோபு 4:6–10 சூழலில் இக்கட்டளைகள் கடவுளுக்கு முன்பாகத் தாழ்மையுடன் மனந்திரும்ப அழைக்கின்றன. உரையில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்தக் கடுமை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியமான, கடுமையான தொனியுடனும் வடிவமைக்கப்பட்டது. மூன்று கட்டளைகளும் தனித்தனியாக வைக்கப்பட்டு அவற்றின் முன்னேற்றம் காக்கப்பட்டது; இணையான இரு இறுதி கூறுகளிலும் ‘உங்கள்’ இயல்பாக வெளிப்படுத்தப்பட்டது.
