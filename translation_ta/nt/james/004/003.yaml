  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: ta
  text: நீங்கள் கேட்கிறீர்கள், ஆனால் பெறுவதில்லை; ஏனெனில், உங்கள் இன்பங்களுக்காக[b] அதைச் செலவழிக்கும்படி தவறாக[a]க் கேட்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தவறாக’ என்பதற்கு ‘முறையற்ற விதத்தில்’ அல்லது ‘தவறான நோக்கத்துடன்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இன்பங்கள்’ என்பது தன்னலமான இன்ப ஆசைகள் அல்லது கட்டுப்பாடற்ற வேட்கைகள் என்ற பொருளையும் தரக்கூடும்; ‘உங்கள் இன்பங்களிலேயே செலவழிக்க’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: நீங்கள் கேட்கிறீர்கள்
  rationale: வேண்டுதல் அல்லது விண்ணப்பித்தல் என்ற பொருளை இயல்பாகத் தருகிறது. சூழல் இறைவனிடம் வேண்டுவதைக் குறிப்பதாக இருந்தாலும், மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: οὐ λαμβάνετε
  choice: பெற்றுக்கொள்வதில்லை
  rationale: கேட்பதற்கும் பெறுவதற்கும் இடையிலான தொடர்பைப் பாதுகாக்கும், நவீனத் தமிழில் இயல்பான சொற்றொடர்.
- source_word: διότι
  choice: ஏனெனில்
  rationale: பெற்றுக்கொள்ளாததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: κακῶς
  choice: தவறாக
  rationale: ‘மோசமாக’ அல்லது ‘தவறான நோக்கத்துடன்’ எனக் குறிக்கக்கூடிய விரிவான நெறிசார் பொருளைப் பாதுகாக்கிறது; நோக்கத்தை மட்டும் முன்னதாகக் குறுக்கவில்லை.
- source_word: αἰτεῖσθε
  choice: கேட்கிறீர்கள்
  rationale: மூலத்தின் மீளுரையைப் பாதுகாக்கிறது. இடை வினை வடிவத்தைத் தனியாக ‘உங்களுக்காகக் கேட்கிறீர்கள்’ என்று விரித்துரைக்க வேண்டிய கட்டாயம் இல்லை.
- source_word: ἵνα
  choice: …செலவழிக்கும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைத் தெரிவிக்கும் கிரேக்கத் தொடரின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: உங்கள் இன்பங்களுக்காக
  rationale: ἡδονή என்பதன் அடிப்படைப் பொருளான இன்பம் அல்லது இன்பநாட்டத்தை நேரடியாகக் காட்டுகிறது. சூழலின் எதிர்மறைத் தொனியைத் தக்கவைத்தாலும், முதன்மை உரையில் ‘கட்டுப்பாடற்ற ஆசைகள்’ என்று மிகையாக விளக்கவில்லை.
- source_word: δαπανήσητε
  choice: அதைச் செலவழிக்கும்படி
  rationale: δαπανάω என்பதன் நடுநிலையான ‘செலவிடுதல்’ என்ற பொருளைத் தருகிறது. தமிழில் வாக்கியம் தெளிவாக இருக்க, கிரேக்கத்தில் மறைமுகமாக உள்ள செலவிடப்படும் பொருளை ‘அதை’ எனக் குறிப்பிட்டுள்ளது; ‘வீணாக்குதல்’ என்ற கூடுதல் மதிப்பீட்டைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கேட்பது இறைவனிடம் செய்யப்படும் ஜெபம் என்பதை வெளிப்படையாகச் சேர்ப்பதா
  choice: செயப்படுபொருளை மறைமுகமாகவே வைத்து, ‘நீங்கள் கேட்கிறீர்கள்’ என மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் இறைவனிடம் கேட்கிறீர்கள்’
  rationale: சூழல் ஜெபத்தைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்க உரையில் ‘இறைவன்’ என்று வெளிப்படையாக இல்லை. ஆகவே மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல் அதன் மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: κακῶς என்பதைத் தவறான உள்நோக்கமாக மட்டும் விளக்குவதா
  choice: முதன்மை உரையில் ‘தவறாக’ என்று விரிவான பொருளுடன் தருதல்
  alternative: ‘தவறான நோக்கத்துடன்’
  rationale: κακῶς என்பது உள்நோக்கத்தை மட்டுமல்லாமல் தவறான விதத்தையும் குறிக்கலாம். அடுத்துள்ள நோக்கக் கூற்று அந்தத் தவறின் தன்மையை விளக்குவதால், முதன்மை உரை பொருளை முன்கூட்டியே குறுக்கவில்லை.
- issue: ἵνα என்பதில் நோக்கமா அல்லது விளைவா என்பதைத் தீர்மானித்துவிடுவதா
  choice: ‘செலவழிக்கும்படி’ என்று நோக்கம்/எதிர்பார்க்கப்பட்ட விளைவு இரண்டிற்கும் இடமளித்தல்
  alternative: ‘செலவழிக்க வேண்டும் என்ற நோக்கத்துடன்’
  rationale: இங்கு தவறான வேண்டுதலின் குறிக்கோள் வலுவாகத் தெரிந்தாலும், கிரேக்க ἵνα தொடரின் நோக்கம்-விளைவு நுணுக்கத்தை முற்றிலும் ஒரே வகையில் முடிவுசெய்யாமல் இயல்பான தமிழில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘ஆனாலும்’ எதிர்மறைத் திருப்பத்தை இயல்பாக்குகிறது; இரண்டு குறுகிய வாக்கியங்கள் மூலத்தின் காரணத் தொடர்பைத் தெளிவாக்குகின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
