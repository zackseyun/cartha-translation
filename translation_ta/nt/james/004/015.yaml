source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: ta
  text: மாறாக, நீங்கள் “ஆண்டவர் விரும்பினால், நாம் உயிரோடிருப்போம்; இதையோ அதையோ செய்வோம்” என்று சொல்ல வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக மொழிபெயர்த்தால், “நீங்கள் சொல்வதற்குப் பதிலாக.”
    reason: ἀντὶ τοῦ λέγειν ὑμᾶς என்ற கிரேக்கத் தொடரின் சொற்சொல் அமைப்பை வழங்குகிறது; முதன்மை உரை அதன் மறைமுகமான திருத்தும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: மாறாக, நீங்கள் … என்று சொல்ல வேண்டும்
  rationale: ‘ἀντὶ τοῦ + வினையெச்சம்’ என்பதன் சொற்சொல் அமைப்பு ‘நீங்கள் சொல்வதற்குப் பதிலாக’ என்பதாகும். முந்தைய வசனத்திலுள்ள தன்னம்பிக்கையான திட்டமிடலுக்கான திருத்தத்தை இயல்பான தமிழில் தெளிவுபடுத்த ‘மாறாக … சொல்ல வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: Ἐὰν
  choice: …னால்
  rationale: θελήσῃ என்ற நிபந்தனை வினையுடன் சேர்ந்துள்ள Ἐὰν-ஐ இயல்பான தமிழ் நிபந்தனை விகுதியான ‘…னால்’ வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதையும் இறையியல் நிறையும் கொண்ட இயல்பான தமிழ்ச் சொல் ‘ஆண்டவர்’. மூலத்தில் குறிப்பிடப்படாத குறிப்பிட்ட நபர் அடையாளம் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- source_word: θελήσῃ
  choice: விரும்பினால்
  rationale: இங்கு θέλω சித்தம் அல்லது விருப்பத்தைச் செயல்படுத்துவதைக் குறிக்கிறது. ‘விரும்பினால்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருந்து, ஆண்டவரின் சித்தத்தின்மீது மனித வாழ்வும் திட்டங்களும் சார்ந்திருப்பதை வெளிப்படுத்துகிறது.
- source_word: καὶ ζήσομεν
  choice: நாம் உயிரோடிருப்போம்
  rationale: ζάω இங்கு தொடர்ந்து உயிருடன் இருப்பதைக் குறிக்கிறது. ‘வாழ்வோம்’ என்பதற்கு வாழ்க்கை நடத்தும் முறை என்ற பொருளும் வரக்கூடும் என்பதால், உடல் வாழ்வின் தொடர்ச்சியைத் தெளிவாகக் காட்ட ‘உயிரோடிருப்போம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: καὶ ποιήσομεν
  choice: செய்வோம்
  rationale: ποιέω என்பதன் பரந்த, நேரடியான பொருளை ‘செய்வோம்’ இயல்பாகத் தருகிறது. இரண்டாம் καί-க்கு தனியே ‘மேலும்’ சேர்ப்பது தமிழில் தேவையற்ற வலியுறுத்தலாகத் தோன்றக்கூடும்; அரைப்புள்ளியால் வாழ்வதும் செய்வதும் இரண்டும் ஆண்டவரின் விருப்பத்திற்குட்பட்டவை என்பது காக்கப்படுகிறது.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: இதையோ அதையோ
  rationale: திட்டமிடப்பட்ட பல்வேறு செயல்களைப் பொதுவாகச் சுட்டும் இணையை இயல்பான தமிழில் ‘இதையோ அதையோ’ துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நிபந்தனை வாக்கியத்திலுள்ள ‘ஆண்டவர்’ யாரைக் குறிக்கிறார் என்பது
  choice: மூலத்தைப் போலவே ‘ஆண்டவர்’ என்று மட்டும் வழங்குதல்
  alternative: ‘தேவன்’ அல்லது ‘ஆண்டவராகிய இயேசு’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க மூலம் ὁ κύριος என்று மட்டுமே கூறுகிறது. வாழ்வும் மனிதத் திட்டங்களும் ஆண்டவரின் சித்தத்திற்கு உட்பட்டவை என்ற கருத்தைக் காக்கும் அதே நேரத்தில், இது பிதாவைக் குறிப்பாகக் குறிக்கிறதா அல்லது இயேசுவைக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: ஆண்டவரின் விருப்பம் எதற்கு நிபந்தனையாக உள்ளது என்பது
  choice: உயிரோடிருப்பதும் செயல்படுவதும் ஆகிய இரண்டையும் நிபந்தனையின் கீழ் வைத்தல்
  alternative: செயல்படுவதை மட்டும் நிபந்தனையின் கீழ் வாசித்தல்
  rationale: Ἐὰν ὁ κύριος θελήσῃ என்பதற்குப் பின் καὶ ζήσομεν καὶ ποιήσομεν என இணைக்கப்பட்ட இரண்டு எதிர்கால வினைகளும் வருகின்றன. ஆகவே தொடர்ந்து வாழ்வதும் திட்டங்களைச் செய்வதும் இரண்டுமே ஆண்டவரின் விருப்பத்தைச் சார்ந்தவை என வாக்கிய அமைப்பு காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘உயிரோடிருப்போம்’ என்பது வாழ்வின் தொடர்ச்சியைத் தெளிவுபடுத்துகிறது; ‘இதையோ அதையோ’ அன்றாடத் திட்டங்களின் பொதுவான தன்மையை இயல்பாகக் காக்கிறது. மேற்கோளுக்குள் அரைப்புள்ளி பயன்படுத்தப்பட்டதால் இரண்டு இணை எதிர்காலச் செயல்களும் தெளிவாகத் தனித்தும் ஒரே நிபந்தனையின் கீழும் நிற்கின்றன.
