  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: ta
  text: அல்லது, வேதவாக்கியம் வீணாகப் பேசுகிறது என்று நினைக்கிறீர்களா? ‘நமக்குள் குடியிருக்கச் செய்யப்பட்ட ஆவி பொறாமையோடு ஏங்குகிறது’ என்று அது கூறுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενῶς
  choice: வீணாக
  rationale: வேதவாக்கியம் பயனின்றியோ நோக்கமின்றியோ பேசுகிறதா என்ற வினாவின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ γραφὴ
  choice: வேதவாக்கியம்
  rationale: அதிகாரமுள்ள திருமறை எழுத்தைக் குறிக்கும் ஒருமை வடிவத்தின் தன்மையைப் பேணுகிறது.
- source_word: Πρὸς φθόνον
  choice: தீவிர உரிமையுணர்வோடு
  rationale: φθόνος என்பதன் பொறாமை அல்லது வைராக்கியம் சார்ந்த கடினமான பொருளை, பிரதான வாசிப்பில் ஆவியானவருக்குப் பாவத்தன்மையுள்ள பொறாமையைச் சுமத்தாமல், உரிமைகோரும் தீவிர ஏக்கமாகத் தெரிவிக்கிறது; இன்னொரு சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπιποθεῖ
  choice: ஏங்குகிறார்
  rationale: வலுவான வாஞ்சையையும் ஆழ்ந்த ஏக்கத்தையும் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: பிரதான வாசிப்பில் இது பரிசுத்த ஆவியானவரைக் குறிக்கிறது என்பதைக் காட்டுகிறது; மனித ஆவியைக் குறிக்கும் இலக்கணச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατῴκισεν
  choice: குடியிருக்கச் செய்த
  rationale: வெறுமனே ‘குடியிருக்கிறார்’ என்று அல்லாமல், கிரேக்க வினையின் காரணவினைப் பொருளையும் இறைச் செயலையும் பேணுகிறது.
- source_word: ἐν ἡμῖν
  choice: நமக்குள்
  rationale: கூட்டத்தின் நடுவிலான இருப்பைக் காட்டிலும் உள்ளுறைதலை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: நமக்குள் குடியிருக்கச் செய்யப்பட்ட பரிசுத்த ஆவியானவர்
  alternative: கடவுள் நமக்குள் குடியிருக்கச் செய்த மனித ஆவி
  rationale: இலக்கணம் இரு வாசிப்புகளையும் அனுமதிக்கிறது. ‘நமக்குள் குடியிருக்கச் செய்த’ என்பது புதிய ஏற்பாட்டின் இறை ஆவி உள்ளுறைதல் மொழியுடன் இயல்பாகப் பொருந்துவதால் பிரதான உரை பரிசுத்த ஆவியானவர் என்ற வாசிப்பை ஏற்கிறது; உண்மையான இறையியல் ஐயம் அடிக்குறிப்பில் விடப்படுகிறது.
- issue: φθόνος சார்ந்த சொல்லின் அறநிலை
  choice: தீவிர உரிமையுணர்வோடு
  alternative: பொறாமையோடு
  rationale: பிரதான வாசிப்பு பரிசுத்த ஆவியானவரைக் குறிப்பதால், நவீனத் தமிழில் பெரும்பாலும் தீய குணத்தைக் குறிக்கும் ‘பொறாமை’ என்பதை நேரடியாகச் சுமத்தாமல், நியாயமான உரிமைகோரும் ஏக்கத்தை வெளிப்படுத்துகிறது. கிரேக்கத்தின் கடினமான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆவியானவர்’ என்பது பிரதான பரிசுத்த ஆவி வாசிப்பைச் சுட்டுகிறது; ‘ஆவி’ என்ற மாற்று வடிவம் அடிக்குறிப்பில் மனித ஆவி வாசிப்பைத் திறந்துவைக்கிறது. ‘வைராக்கியம்’ என்ற சொல்லுக்கு நவீனத் தமிழில் துறவுணர்வு என்ற வேறு பொருள் வலுவாக இருப்பதால் அது தவிர்க்கப்பட்டது.
