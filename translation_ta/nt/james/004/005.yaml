  naturalness: ‘வேதவாக்கியம்’ கண்ணியமான, புரியக்கூடிய நடை. ஆனால் கேள்விக்குப் பின் வரும் வாக்கியத்தை வேதவாக்கியம் கூறும் மேற்கோளாகத் தெளிவுபடுத்துவது தமிழில் இயல்பாகவும் வாதத்தின் அமைப்புக்கு ஏற்பவும் இருக்கும். ‘பொறாமையோடு ஏங்குகிறது’ என்பது கடினமான கிரேக்கச் சொல்லாட்சியை நேரடியாகக் காக்கிறது; மாற்று விளக்கத்தை அடிக்குறிப்பு வழங்குகிறது.
  terminology: ‘வேதவாக்கியம்,’ ‘ஆவி,’ ‘குடியிருக்கச் செய்யப்பட்ட,’ ‘ஏங்குகிறது’ ஆகியவை பொருத்தமானவை. ‘தீவிர உரிமையுணர்வோடு’ என்பது விளக்கமான மொழிபெயர்ப்பு; τὸ πνεῦமத்தைப் பரிசுத்த ஆவியாக நிர்ணயிக்கும் பிரதான உரையில் மட்டும் அல்லாமல் அடிக்குறிப்பின் மாற்று வாய்ப்பாகத் தரப்பட வேண்டும்.
