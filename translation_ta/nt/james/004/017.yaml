id: JAS.4.17
reference: James 4:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: ta
  text: ஆகவே[a], நன்மை செய்ய வேண்டுமென்று அறிந்தும் அதைச் செய்யாதவனுக்கு அது பாவம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனவே, தான் செய்ய வேண்டிய நன்மையை அறிந்தும் அதைச் செய்யாதவனுக்கு அது பாவம்.”
    reason: οὖν என்பதற்கு ‘எனவே’ என்ற மாற்றும், καλὸν ποιεῖν என்பதில் உள்ள ஒழுக்கக் கடமையின் பொருளைச் சற்றே வெளிப்படையாகக் கூறும் மாற்று மொழியாக்கமும்.
lexical_decisions:
- source_word: εἰδότι
  choice: தெரிந்தும் ... செய்யாதவனுக்கு
  rationale: οἶδα என்பதன் ஒருமை வேற்றுமை உருபேற்ற வினையெச்சம் இங்கு ஒருவரைக் குறிக்கும் பெயர்ச்சொல் போல் செயல்படுகிறது. தமிழில் ‘தெரிந்தும் ... செய்யாதவனுக்கு’ என்பது ஒருமையையும் பொதுவான பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து வரும் முடிவைச் சுட்டும் ஊகத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: καλὸν ποιεῖν
  choice: நன்மை செய்ய
  rationale: καλόν இங்கு ஒழுக்கரீதியான நல்லதைப் பரந்த வகையில் குறிக்கிறது; ποιεῖν உடன் சேர்ந்து ‘நன்மை செய்ய’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: μὴ ποιοῦντι
  choice: அதைச் செய்யாதவனுக்கு
  rationale: அறிந்த நன்மையைச் செய்யத் தவறுவதை எதிர்மறையாகக் காட்டுகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளை ‘அதை’ எனச் சேர்ப்பது தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: ἁμαρτία
  choice: பாவம்
  rationale: உருபில்லாத பயனிலைப் பெயராக இருப்பதால், குறிப்பிட்ட ‘ஒரு பாவம்’ என்று குறுக்காமல் அந்தச் செயல் பாவத்தன்மை உடையது என்பதை ‘பாவம்’ நேரடியாகத் தெரிவிக்கிறது.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: 'இது தொடர்பு அல்லது சார்பு வேற்றுமையைக் குறிக்கிறது: அந்த நபரைப் பொறுத்தவரை அது பாவம். ஒருமை பொதுப்பொருளைத் தமிழ் வழக்கில் ‘அவனுக்கு’ காக்கிறது.'
- source_word: ἐστιν
  choice: அது ... பாவம்
  rationale: கிரேக்க இணைப்புவினையின் உறவை தமிழில் இயல்பான பெயர்ப் பயனிலை வாக்கியமாக வெளிப்படுத்துகிறது; ‘அது’ என்பது செய்யாமல் விடப்பட்ட செயலைக் குறிக்கிறது.
theological_decisions:
- issue: அறிந்த நன்மையைச் செய்யாமல் விடுவது பற்றிய கூற்றின் பரப்பு
  choice: அறிந்தே நன்மையைச் செய்யாமல் விடுவது பாவம் என்ற பொதுவான கூற்றாக மொழிபெயர்க்கப்பட்டது; அதேவேளை முந்தைய சூழலுடனான தொடர்பு ‘ஆகவே’ என்பதால் காக்கப்படுகிறது.
  alternative: இது முந்தைய வசனங்களில் உள்ள பெருமையான திட்டமிடுதலை மட்டுமே குறிக்கிறது என்று வரையறுப்பது; அல்லது எல்லா செய்யாமைப் பாவங்களுக்குமான முறையான கோட்பாடாக விரிவுபடுத்துவது.
  rationale: உடனடி சூழல் மனிதரின் தன்னம்பிக்கையான திட்டங்களைப் பற்றியது. ஆனால் வசனத்தின் சொற்கள் பொதுவான ஒழுக்க நெறிக் கூற்றாகவும் ஒலிக்கின்றன. மொழிபெயர்ப்பு இந்த இரு பரிமாணங்களையும் குறுக்கவோ கோட்பாட்டாக்கவோ செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நன்மை செய்ய’ என்பது வசனத்தின் பரந்த ஒழுக்கப் பொருளைக் காக்கிறது; ‘தெரிந்தும்’ என்பது அறிவுக்கும் செயலின்மைக்கும் உள்ள முரண்பாட்டை இயல்பாக வலியுறுத்துகிறது.
