revisions:
- from: ஆகவே[a], நன்மை செய்யத் தெரிந்தும் அதைச் செய்யாதவனுக்கு அது பாவம்.
  to: ஆகவே[a], நன்மை செய்ய வேண்டுமென்று அறிந்தும் அதைச் செய்யாதவனுக்கு அது பாவம்.
  rationale: The revision replaces an ability-oriented Tamil expression with one denoting knowledge of moral obligation. It preserves the verse’s inferential connection, generic singular form, broad ethical scope, and the assertion that knowingly failing to act is sin.
  reviewer_model: gpt-5.6-terra
