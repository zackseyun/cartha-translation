id: JAS.4.16
reference: James 4:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: ta
  text: ஆனால் இப்போதோ, நீங்கள் உங்கள் இறுமாப்பில்[a] பெருமை பேசுகிறீர்கள். இப்படிப் பெருமை பேசுவது எல்லாமே தீமையானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறுமாப்பான பாசாங்குகளில்,’ ‘வீண்பெருமைகளில்,’ அல்லது ‘ஆணவமான உரிமைகோரல்களில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவாக ஆணவமான தற்பெருமையைக் குறிக்கலாம்; இங்கே அது முந்தைய வசனங்களில் சொல்லப்பட்ட தன்னிச்சையான திட்டங்களைச் சிறப்பாகச் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆண்டவரைச் சார்ந்த பணிவான மனப்பான்மைக்கும் இப்போது நிலவும் உண்மை நிலைக்கும் இடையிலான முரண்பாட்டை δὲ உடன் வரும் νῦν வெளிப்படுத்துகிறது.
- source_word: καυχᾶσθε
  choice: பெருமை பேசுகிறீர்கள்
  rationale: தன்னை அல்லது தனது சாதனைகளையும் திட்டங்களையும் குறித்து பெருமையாகப் பேசுதல் என்ற வினையின் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: உங்கள் இறுமாப்பில்
  rationale: ἀλαζονεία குறிக்கும் ஆணவமான தன்னம்பிக்கை, வீண்பெருமை, தற்பெருமையான உரிமைகோரல் ஆகிய பொருள் வளத்தை ‘இறுமாப்பு’ சுருக்கமாகவும் இயல்பாகவும் தருகிறது. கிரேக்கப் பன்மையைத் தமிழில் இயல்பான பண்புச் சுருக்கப் பெயராக ஒருமையில் வழங்குகிறது; முந்தைய வசனங்களின் திட்டங்களையே மட்டும் மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: இப்படிப் பெருமை பேசுவது எல்லாமே
  rationale: πᾶσα என்பதன் பொதுமைப்படுத்தும் வலிமையையும் τοιαύτη என்பதன் ‘இந்த வகையான’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πονηρά
  choice: தீமையானது
  rationale: இது வெறும் மோசமான தரத்தைக் குறிக்காமல் ஒழுக்கரீதியான கண்டனத்தைத் தெரிவிப்பதால் ‘தீமையானது’ பொருத்தமானது.
theological_decisions:
- issue: கண்டிக்கப்படும் பெருமையின் தன்மை
  choice: ஆண்டவருக்குக் கீழ்ப்படிவதைப் பொருட்படுத்தாமல் மனிதத் திட்டங்களில் கொள்ளும் ஆணவமான தன்னம்பிக்கையை வசனம் கண்டிக்கிறது; அதே நேரத்தில் மொழிபெயர்ப்பு இதை வணிகத் திட்டங்களுக்கு மட்டும் கட்டுப்படுத்தவில்லை.
  alternative: எல்லா வகையான தன்னம்பிக்கையையும் பொதுவாகக் கண்டிப்பது; அல்லது வணிகத் திட்டங்களைப் பற்றிய பெருமையை மட்டுமே கண்டிப்பது.
  rationale: யாக்கோபு 4:13–15 தன்னிச்சையான எதிர்காலத் திட்டங்களைப் பற்றியது. எனினும் 4:16-இன் இறுதி வாக்கியம் அந்த வகைப் பெருமையைப் பொதுவாக ஒழுக்கரீதியில் மதிப்பிடுகிறது. ஆகவே உடனடிச் சூழலை அடிக்குறிப்பில் சுட்டிக்காட்டி, மூலத்தின் பரந்த சொல்லாட்சியை முதன்மை உரையில் காத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பெருமை பேசுகிறீர்கள்’ என்பது தெளிவான வழக்குச் சொற்றொடர்; ‘இறுமாப்பு’ மூலத்தின் ஒழுக்கரீதியான எதிர்மறைத் தொனியைக் காக்கிறது. கிரேக்கப் பன்மை தமிழில் இயல்புக்காக அருவ ஒருமையாக வழங்கப்பட்டுள்ளது.
