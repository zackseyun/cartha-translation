source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: ta
  text: என் சகோதரர்களே,[a] ஒருவன் தனக்கு விசுவாசம் உண்டென்று சொல்லியும், செயல்கள் இல்லாதவனாக இருந்தால், என்ன பயன்? அந்த விசுவாசம் அவனை இரட்சிக்க முடியுமா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் சகோதர சகோதரிகளே’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் ஆண்பால் பன்மையான ‘சகோதரர்களே’ என்பது விசுவாசச் சமூகத்தினரைப் பிரதிநிதித்துவமாக அழைக்கும் வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘இத்தகைய விசுவாசம் அவனை இரட்சிக்க முடியுமா?’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்கு சொல் ‘அந்த விசுவாசம்’ என்று உள்ளது; இது முன்பு கூறப்பட்ட, செயல்கள் இல்லாததாகச் சொல்லப்படும் விசுவாசத்தைப் பின்னோக்கிச் சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: என்ன பயன்?
  rationale: நடைமுறைப் பயன் அல்லது நன்மை என்ன என்ற சொல்லாட்சிக் கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்பைத் தக்கவைக்கிறது; இங்கு அது விசுவாசிகள் அடங்கிய சமூகத்தைப் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: ஒருவன் தனக்கு இருப்பதாகச் சொல்லும் நம்பிக்கையைக் குறிக்கும் இச்சூழலில் வழக்கமான இறையியல் சொல்லையும் தொடரின் சொல் இணைப்பையும் காக்கிறது.
- source_word: λέγῃ τις ἔχειν
  choice: ஒருவன் தனக்கு ... இருப்பதாகச் சொல்லியும்
  rationale: ‘இருப்பதாகக் கூறினால்’ என்ற விளக்கமான வலுப்படுத்தலைவிட, கிரேக்கத்தின் ‘இருப்பதாகச் சொல்கிறான்’ என்பதற்கு நெருக்கமாக உள்ளது.
- source_word: ἔργα
  choice: செயல்கள்
  rationale: வெளிப்படையான செய்கைகள் அல்லது நடைமுறைச் செயல்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது; யாக்கோபு 2-இன் விசுவாசம்–செயல்கள் தொடர்பையும் காக்கிறது.
- source_word: μὴ ἔχῃ
  choice: இல்லாதிருந்தால்
  rationale: செயல்களை உடையவனாக இல்லாத நிலையை நிபந்தனைத் தொடரில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μὴ δύναται
  choice: முடியுமா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியைச் சுட்டுகிறது; வெளிப்படையாக ‘முடியாது’ என்று மொழிபெயர்த்து வலுப்படுத்தவில்லை.
- source_word: ἡ πίστις
  choice: அந்த விசுவாசம்
  rationale: முன்னர் கூறப்பட்ட—செயல்கள் இல்லாததாக உரிமைகோரப்படும்—விசுவாசத்தையே சுட்டும் கிரேக்க உருபின் பின்னோக்குச் சுட்டலைத் தெளிவாக்குகிறது.
- source_word: σῶσαι αὐτόν
  choice: அவனை மீட்க
  rationale: σῴζω என்பதன் விடுவித்தல்/இரட்சித்தல் சார்ந்த வலிமையைத் தருகிறது; தமிழில் இயல்பாகவும் இறையியல் முடிவை மிகையாக முன்வைக்காமலும் உள்ளது.
theological_decisions:
- issue: விசுவாசத்துக்கும் செயல்களுக்கும் இடையிலான உறவு
  choice: செயல்கள் இல்லாமல் இருப்பதாக இங்கு விவரிக்கப்படும் ‘அந்த விசுவாசம்’ மீட்குமா என்று கேட்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விசுவாசம் அவனை மீட்க முடியுமா?’ என்று பொதுவான விசுவாசத்தையே கேள்விக்குட்படுத்துவது.
  rationale: ἡ πίστις முன்னர் குறிப்பிடப்பட்ட விசுவாசத்தைப் பின்னோக்கிச் சுட்டுகிறது. ‘அந்த விசுவாசம்’ என்பது யாக்கோபின் இறையியல் பதற்றத்தைத் தக்கவைத்து, எல்லா விசுவாசத்தையும் பொதுவாக மறுப்பதாக மிகைப்படுத்துவதைத் தவிர்க்கிறது.
- issue: பாலினத்தைச் சுட்டும் சமூக அழைப்பும் தனிப்பட்ட சுட்டுப்பெயரும்
  choice: ‘என் சகோதரர்களே’ மற்றும் ‘அவனை’ என மூலத்தின் ஆண்பால் வடிவங்கள் தக்கவைக்கப்பட்டன; சமூக அழைப்பின் விரிவான பயன்பாடு அடிக்குறிப்பில் கூறப்பட்டது.
  alternative: ‘சகோதர சகோதரிகளே’ மற்றும் பாலினப் பொதுமைப்படுத்தப்பட்ட பன்மை வடிவம்.
  rationale: மூலத்தின் இலக்கண வடிவத்தைப் பாதுகாத்தபடியே, ἀδελφοί முழு விசுவாசச் சமூகத்தையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பதை மறைக்காமல் குறிப்பு தருகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘விசுவாசம்’ இறையியல் சொல் தொடர்ச்சிக்காகவும், ‘செயல்கள்’ ἔργα என்பதன் நடைமுறை வெளிப்பாட்டிற்காகவும் பயன்படுத்தப்பட்டன. சொல்லாட்சிக் கேள்விகளின் சுருக்கமும் மூலத்தின் இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
