revisions:
- from: எனினும், “உன்னைப்போல உன் அயலாரிடமும் அன்புகூருவாயாக” என்ற வேதவாக்கின்படி அரசுக்குரிய சட்டத்தை[a] நீங்கள் நிறைவேற்றினால், நன்றாகச் செய்கிறீர்கள்.
  to: ஆயினும், “உன் அயலானை உன்னைப்போல அன்புகூருவாயாக” என்ற வேதவசனத்தின்படி அரசருக்குரிய சட்டத்தை[a] நீங்கள் நிறைவேற்றினால், நன்றாகச் செய்கிறீர்கள்.
  rationale: The revision corrects the grammatical relation in the Leviticus quotation and avoids a likely governmental sense of “அரசுக்குரிய.” It does not settle the debated nuance of βασιλικός; the note retains the lexical breadth without imposing a theological interpretation.
