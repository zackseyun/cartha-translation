id: JAS.2.8
reference: James 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: ta
  text: ஆயினும், “உன் அயலானை உன்னைப்போல அன்புகூருவாயாக” என்ற வேதவசனத்தின்படி அரசருக்குரிய சட்டத்தை[a] நீங்கள் நிறைவேற்றினால், நன்றாகச் செய்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில் “அரசருக்குரிய சட்டம்.” இது அரசரிடமிருந்து வரும் சட்டத்தையோ, தலைசிறந்த சட்டத்தையோ, இறையாட்சியுடன் தொடர்புடைய சட்டத்தையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: எனினும் ... நிறைவேற்றினால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளையும் μέντοι என்பதன் மென்மையான மாறுபாட்டு அல்லது தொடர்ச்சி நுணுக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: νόμον ... βασιλικὸν
  choice: அரசுக்குரிய சட்டத்தை
  rationale: βασιλικός என்பதன் அடிப்படைப் பொருளான ‘அரசுக்குரிய’ அல்லது ‘அரசருக்குரிய’ என்ற கருத்தைப் பேணுகிறது. இது சட்டத்தின் அரச மூலத்தையா, அதன் தலைசிறந்த நிலையையா, அல்லது இறையாட்சியுடனான தொடர்பையா குறிக்கிறது என்பதை முதன்மை உரை முடிவுசெய்யவில்லை.
- source_word: τελεῖτε
  choice: நீங்கள் நிறைவேற்றினால்
  rationale: τελέω இங்கு ஒரு கட்டளையைச் செயல்படுத்துதல் அல்லது நிறைவேற்றுதல் என்ற பொருளுடையது; ‘நிறைவேற்றுதல்’ அதன் முழுமை நுணுக்கத்தையும் நிபந்தனை வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: κατὰ τὴν γραφήν
  choice: என்ற வேதவாக்கின்படி
  rationale: குறிப்பிட்ட வேதவாக்குக்கு இணங்கச் செயல்படுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; γραφή ஒருமையில் இருப்பதும் மேற்கோளுடன் இணைக்கப்படுகிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூருவாயாக
  rationale: எதிர்கால வடிவில் அமைந்த கட்டளைத் தன்மையை, லேவியராகமம் 19:18 மேற்கோளுக்கேற்ற கண்ணியமான வேதநடைத் தமிழில் பேணுகிறது.
- source_word: τὸν πλησίον σου
  choice: உன் அயலாரிடம்
  rationale: πλησίον என்பதன் அறநெறிசார் ‘அடுத்திருப்பவர்/அயலார்’ பொருளைச் சுருக்கமாகவும் அறிமுகமான வேதாகமச் சொல்லாட்சியிலும் தருகிறது.
- source_word: ὡς σεαυτόν
  choice: உன்னைப்போல
  rationale: கிரேக்க ஒப்புமையின் சுருக்கத்தையும் இயல்பான தமிழையும் பேணுகிறது; மூலத்தில் இல்லாத விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
- source_word: καλῶς ποιεῖτε
  choice: நன்றாகச் செய்கிறீர்கள்
  rationale: செயல் சரியானது என்ற பாராட்டையும் நிகழ்காலத் தன்மையையும் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அரசுக்குரிய சட்டம்’ என்பதன் பொருள்
  choice: சட்டத்தை அரசுத் தன்மை கொண்டதாகக் குறிப்பிடும் விரிந்த சொல்லாட்சி; அதன் அரச மூலமா, உயர்ந்த நிலையா, இறையாட்சித் தொடர்பா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
  alternative: ‘அரசர் கொடுத்த சட்டம்’ அல்லது ‘தலைசிறந்த சட்டம்’ என்று ஒரு விளக்கத்தை மட்டும் தேர்ந்தெடுத்தல்.
  rationale: βασιλικός என்ற பெயரடை பல நெருக்கமான விளக்கங்களை அனுமதிக்கிறது. மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் கோட்பாட்டுரீதியாகத் திணிக்காமல், மூலத்தின் பொருள் விரிவையும் இறையியல் நெருக்கடியையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் கட்டளைத் தன்மைக்காக மட்டும் ‘அன்புகூருவாயாக’ என்ற உயர்நடை வடிவம் வைக்கப்பட்டுள்ளது; பிற இடங்களில் இயல்பான நடப்பு உரைநடை பின்பற்றப்பட்டுள்ளது.
