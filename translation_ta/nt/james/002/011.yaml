review_pass:
  verdict: revise
  source_fidelity: The rendering accurately preserves the two prohibitions, the contrastive conditional example, and the perfect-result force of γέγονας ('ஆகிவிட்டாய்'). However, 'திருச்சட்டம்' adds the qualifier 'holy/sacred,' which is not expressed by νόμος. The context identifies the law through the cited commandments, so the unexpanded 'சட்டம்' best preserves the Greek wording.
  naturalness: The Tamil is clear, dignified, and idiomatic. The quoted direct-singular prohibitions are natural in this proverbial-command form, and 'செய்யாமல் இருந்தும் ... செய்தால்' communicates the conditional contrast effectively.
  terminology: ‘விபசாரம்’ appropriately renders μοιχεύω, and ‘கொலை’ appropriately distinguishes φονεύω from killing in general. ‘சட்டத்தை மீறியவனாகிவிட்டாய்’ naturally conveys παραβάτης νόμου together with the resultant-state nuance of γέγονας, without adding a theological descriptor.
  issues:
  - severity: low
    issue: ‘திருச்சட்டத்தை’ expands νόμου.
    rationale: νόμος means ‘law’; although the referent is the divine/Mosaic law in context, the Greek does not contain an equivalent of ‘திரு-’. ‘சட்டத்தை’ retains the intended referent from context without adding a qualifier.
  revised_text: ஏனெனில், “விபசாரம் செய்யாதே” என்று சொன்னவரே, “கொலை செய்யாதே” என்றும் சொன்னார். நீ விபசாரம் செய்யாமல் இருந்தும் கொலை செய்தால், சட்டத்தை மீறியவனாகிவிட்டாய்.
