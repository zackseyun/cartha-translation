id: JAS.2.11
reference: James 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: ta
  text: ஏனெனில், “விபசாரம் செய்யாதே” என்று சொன்னவரே, “கொலை செய்யாதே” என்றும் சொன்னார். நீ விபசாரம் செய்யாமல் இருந்தும் கொலை செய்தால், சட்டத்தை மீறியவனாகிவிட்டாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: சொன்னவரே
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இப்பெயரெச்சத் தொடர் கட்டளைகளைக் கூறிய ஒரே நபரைச் சுட்டுகிறது. ‘-வரே’ என்பது அடுத்த கட்டளையையும் அதே நபரே கூறினார் என்ற வாத அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தேவன்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: Μὴ μοιχεύσῃς
  choice: விபசாரம் செய்யாதே
  rationale: μοιχεύω திருமண உறுதியை மீறும் பாலுறவைக் குறிக்கிறது. ‘விபசாரம்’ என்பது நவீனத் தமிழில் அறியப்பட்ட, வேதாகம நெறியியல் சூழலுக்கு ஏற்ற சொல்; μή உடனான தடை கட்டளையை ‘செய்யாதே’ நேரடியாகத் தருகிறது.
- source_word: καί
  choice: என்றும்
  rationale: அதே பேச்சாளர் இன்னொரு கட்டளையையும் கூறியதைத் தமிழில் இயல்பாக இணைத்து, ‘also’ என்ற சேர்க்கை வலியுறுத்தலைக் காக்கிறது.
- source_word: Μὴ φονεύσῃς
  choice: கொலை செய்யாதே
  rationale: φονεύω பொதுவான உயிர்கொல்லுதலைவிட சட்டவிரோதமான மனிதக் கொலையைக் குறிக்கிறது. ஆகவே பரந்த பொருளுடைய ‘கொல்லாதே’ என்பதற்குப் பதில் ‘கொலை செய்யாதே’ துல்லியமானது.
- source_word: εἰ δὲ
  choice: '... இருந்தும் ... செய்தால்'
  rationale: δὲ காட்டும் முரண்பாட்டையும் εἰ காட்டும் நிபந்தனையையும் தமிழின் இயல்பான நிபந்தனை அமைப்பில் ஒன்றிணைக்கிறது.
- source_word: οὐ μοιχεύεις φονεύεις δέ
  choice: விபசாரம் செய்யாமல் இருந்தும் கொலை செய்தால்
  rationale: நிகழ்கால வினைகள் பொதுவான நிபந்தனை எடுத்துக்காட்டாக மொழிபெயர்க்கப்படுகின்றன. ‘இருந்தும்’ இரு செயல்களுக்கிடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: γέγονας
  choice: ஆகிவிட்டாய்
  rationale: γίνομαι என்பதன் நிறைவுக்கால வடிவம் ஒரு நிலைக்கு வந்து தற்போது அதில் இருப்பதைக் காட்டுகிறது. ‘ஆகிவிட்டாய்’ அந்த விளைவு நிலையைச் சுருக்கமாகக் காக்கிறது.
- source_word: παραβάτης νόμου
  choice: திருச்சட்டத்தை மீறியவன்
  rationale: παραβάτης என்பது விதிக்கப்பட்ட எல்லை அல்லது கட்டளையை மீறுகிறவனைக் குறிக்கிறது. ‘மீறியவன்’ இயல்பான நவீனத் தமிழ்; νόμος இங்கு மேற்கோளிடப்பட்ட தெய்வீகச் சட்டத்தைக் குறிப்பதால் ‘திருச்சட்டம்’ அந்தச் சூழலைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: கட்டளைகளைக் கூறியவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘சொன்னவர்’ என்று மட்டும் வழங்கப்பட்டது.
  alternative: ‘தேவன் சொன்னார்’ என்று வெளிப்படையாக வழங்குதல்.
  rationale: சூழலில் பேசுபவர் தேவன் என்பது தெளிவாக இருந்தாலும், கிரேக்கம் ‘சொன்னவர்’ என்ற பெயர்ச்சொல் தன்மையுள்ள பெயரெச்சத்தையே கொண்டுள்ளது. ஆகவே மூலத்தில் இல்லாத பெயரைச் சேர்க்காமல் தனிப்பட்ட சுட்டுதலைக் காக்கிறது.
- issue: சட்டமீறலின் பரப்பு
  choice: ‘திருச்சட்டத்தை மீறியவன்’ என்று முழுச் சட்டத்தையும் சுட்டும் வகையில் வழங்கப்பட்டது.
  alternative: ‘அந்தக் கட்டளையை மீறியவன்’ என்று குறுகலாக வழங்குதல்.
  rationale: ஒரு கட்டளையை மீறினாலும் ஒருங்கிணைந்த சட்டத்தை மீறியவனாகிறான் என்பதே யாக்கோபின் வாதம். νόμου என்பதை ஒரு தனிக் கட்டளையாகக் குறுக்காமல் மொழிபெயர்ப்பது அந்த இறையியல்-நெறியியல் அழுத்தத்தைக் காக்கிறது.
translation_notes:
  register: நடை நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியத்தக்க தரத் தமிழாக வைக்கப்பட்டுள்ளது. கட்டளைகளில் நேரடி ஒருமை வடிவமான ‘செய்யாதே’ பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது இங்கு மனிதச் சட்டம் அல்ல, மேற்கோளிடப்பட்ட தெய்வீகச் சட்டம் என்பதை இயல்பாக உணர்த்துகிறது. அடிக்குறிப்புகள் தேவையில்லை.
