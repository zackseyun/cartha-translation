source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: ta
  text: என் சகோதரர்களே[a], நம் மகிமைமிக்க ஆண்டவர் இயேசு மேசியாவின் விசுவாசத்தைப் பாரபட்சத்தோடு கொண்டிருக்காதீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்றிருந்தாலும், இது விசுவாசச் சமூகத்தினர் அனைவரையும் நோக்கிய அழைப்பாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம் ஆண்டவர் இயேசு மேசியாவின்மேல் உள்ள விசுவாசத்தைப் பாரபட்சத்தோடு கொண்டிருக்காதீர்கள்.” கிரேக்கத் தொடர் “நம் ஆண்டவர் இயேசு மேசியாவின் விசுவாசம்” என்றும் புரிந்துகொள்ளப்படலாம். மேலும், “நம் ஆண்டவர் இயேசு மேசியா, மகிமையின் ஆண்டவர்” என்றும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவை நேரடியாகக் காக்கிறது; அதேவேளை இவ்வழைப்பு முழு விசுவாசச் சமூகத்தையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: μὴ ... ἔχετε
  choice: காட்டாதீர்கள்
  rationale: μή உடனான நிகழ்காலக் கட்டளை தடைப் பொருளுடையது. தமிழில் ‘பாரபட்சம் காட்டாதீர்கள்’ என்பது இயல்பாகவும் அறநெறி வலிமையுடனும் உள்ளது.
- source_word: ἐν προσωπολημψίαις
  choice: பாரபட்சம்
  rationale: προσωπολημψία குறிக்கும் ஆள் பார்த்துச் சலுகை காட்டுதலை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்கப் பன்மை தமிழில் இயல்பாக ஒருமைக் கருத்துப்பெயராக வழங்கப்படுகிறது.
- source_word: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவர் இயேசு மேசியாவின்மேல் வைத்திருக்கும் விசுவாசம்
  rationale: தமிழில் தெளிவும் இயல்பும் பெற, இத்தொடர் இயேசு மேசியாவின்மேல் வைக்கப்படும் விசுவாசம் என வழங்கப்படுகிறது; கிரேக்க மரபுத்தொடரின் வேறு சாத்தியமான உறவு குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: இங்கு ஆண்டவர் இயேசு என்ற சிறப்புமிக்க பட்டத் தொடரில் Χριστός பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: τῆς δόξης
  choice: மகிமையின் ஆண்டவராகிய
  rationale: δόξης என்பதை ஆண்டவர் இயேசு மேசியாவுடன் தொடர்புடைய ‘மகிமையின் ஆண்டவர்’ என்ற உயரிய வேதாகமச் சொல்லாட்சியாகக் காக்கிறது.
theological_decisions:
- issue: πίστις மற்றும் அதைத் தொடரும் உரிமைவேற்றுமைத் தொடரின் உறவு
  choice: ‘இயேசு மேசியாவின்மேல் வைத்திருக்கும் விசுவாசம்’ என்று முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ‘நம் ஆண்டவர் இயேசு மேசியாவின் விசுவாசம்’
  rationale: தமிழில் ‘மேல் வைத்திருக்கும் விசுவாசம்’ என்பது இயல்பான நோக்குநிலை வாசிப்பு. எனினும் கிரேக்க உரிமைவேற்றுமை வேறு விதமாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்று குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῆς δόξης என்பதன் தொடர்பு
  choice: ‘மகிமையின் ஆண்டவராகிய’ என்று இயேசு மேசியாவோடு இணைக்கப்பட்டது.
  alternative: ‘மகிமைமிக்க நம் ஆண்டவர் இயேசு மேசியா’
  rationale: மூலத்தின் ‘மகிமையின்’ என்ற உரிமைவேற்றுமைச் சொல்லாட்சியை இயன்றவரை காத்து, இயேசுவை ‘மகிமையின் ஆண்டவர்’ என அடையாளப்படுத்தும் உயரிய பொருளை வெளிப்படுத்துகிறது.
- issue: Ἀδελφοί என்பதன் பாலினமும் சமூக அளவும்
  choice: ‘சகோதரர்களே’
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது; கலந்த விசுவாசச் சமூகத்திற்கான பரந்த அழைப்பு குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாரபட்சம் காட்டாதீர்கள்’ என்ற இயல்பான தமிழ் வினைத்தொடர் மூலத்தின் தடையைத் தெளிவாகத் தருகிறது; ‘மகிமையின் ஆண்டவர்’ என்ற வேதாகம உயர்நடை மட்டும் திட்டமிட்டு காக்கப்பட்டுள்ளது.
