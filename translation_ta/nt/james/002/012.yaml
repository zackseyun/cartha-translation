revisions:
- from: விடுதலையின் சட்டத்தின் வழியாகத் தீர்ப்பிடப்படப் போகிறவர்களாக, அப்படியே பேசுங்கள்; அப்படியே செயல்படுங்கள்.
  to: விடுதலையின் சட்டத்தின் வழியாகத் தீர்ப்பிடப்படப் போகிறவர்களாக, இவ்வாறே பேசுங்கள்; இவ்வாறே செயல்படுங்கள்.
