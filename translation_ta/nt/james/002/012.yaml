review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the paired imperatives, the prospective passive sense of μέλλοντες κρίνεσθαι, and διά + genitive as ‘through.’ ‘விடுதலையின் சட்டம்’ preserves the deliberately compact genitive expression without interpretive expansion.
  naturalness: ‘அப்படியே’ can suggest ‘exactly the same’ in modern Tamil and is less idiomatic here without a stated antecedent. ‘இவ்வாறே’ is a more natural equivalent for the discourse-deictic force of οὕτως while retaining its repetition.
  terminology: ‘விடுதலையின் சட்டம்,’ ‘தீர்ப்பிடப்பட,’ ‘பேசுங்கள்,’ and ‘செயல்படுங்கள்’ are appropriate, clear, and suitably dignified modern-standard Tamil choices.
  issues:
  - severity: low
    issue: அப்படியே is slightly awkward for the repeated οὕτως.
    rationale: In this exhortation οὕτως means ‘thus/in this manner,’ not primarily ‘exactly so.’ Replacing it with ‘இவ்வாறே’ makes the Tamil idiomatic while preserving the twofold emphasis.
  revised_text: விடுதலையின் சட்டத்தின் வழியாகத் தீர்ப்பிடப்படப் போகிறவர்களாக, இவ்வாறே பேசுங்கள்; இவ்வாறே செயல்படுங்கள்.
  revised_footnotes: []
  revision_rationale: Only the repeated adverb has been adjusted for natural modern Tamil. The source’s parallel imperative structure, the ‘as those who are going to be judged’ construction, and the noncommittal ‘through the law of freedom’ relationship are retained.
