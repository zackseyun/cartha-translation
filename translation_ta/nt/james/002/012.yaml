base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: ta
  text: விடுதலையின் சட்டத்தின் வழியாகத் தீர்ப்பிடப்படப் போகிறவர்களாக, இவ்வாறே பேசுங்கள்; இவ்வாறே செயல்படுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: அப்படியே பேசுங்கள்; அப்படியே செயல்படுங்கள்
  rationale: இருமுறை வரும் οὕτως என்பதன் வலியுறுத்தலையும், தொடர்ச்சியான கட்டளை வடிவங்களையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: νόμου ἐλευθερίας
  choice: விடுதலையின் சட்டம்
  rationale: இது மூலத்தின் உரிச்சொல் சார்ந்த இணைப்பைத் திறந்தவாறே வைத்திருக்கிறது; சட்டம் விடுதலையைக் கொடுக்கிறதா அல்லது விடுதலையால் வகைப்படுத்தப்படுகிறதா என்பதை மொழிபெயர்ப்பில் அளவுக்கு மீறி விளக்கவில்லை.
- source_word: διὰ νόμου
  choice: சட்டத்தின் வழியாக
  rationale: διά + genitive என்பதன் வழிமுறை அல்லது இடைமுகப் பொருளைப் பாதுகாக்கிறது. ‘சட்டத்தின்படி’ அல்லது ‘சட்டத்தால்’ என்று பொருளைச் சுருக்கித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: μέλλοντες κρίνεσθαι
  choice: தீர்ப்பிடப்படப் போகிறவர்களாக
  rationale: μέλλω தரும் எதிர்நோக்கிய வருங்கால உணர்வையும், κρίνεσθαι என்பதன் செயப்பாட்டு வடிவத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விடுதலையின் சட்டத்துக்கும் தீர்ப்புக்கும் இடையிலான தொடர்பு
  choice: ‘சட்டத்தின் வழியாகத் தீர்ப்பிடப்பட’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘சட்டத்தால் தீர்ப்பிடப்பட’ அல்லது ‘சட்டத்தின்படி தீர்ப்பிடப்பட’
  rationale: மூலத்தில் உள்ள διά + genitive கட்டமைப்பின் பரப்பைத் தக்கவைத்து, சட்டம் தீர்ப்பின் செயற்பாட்டாளர் அல்லது வெறும் அளவுகோல் என்று தனியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசுங்கள் / செயல்படுங்கள்’ என்ற இணை அமைப்பு மூலத்தின் ஒத்திசைவைத் தக்கவைக்கிறது.
