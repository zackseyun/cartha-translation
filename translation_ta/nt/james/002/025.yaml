source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: ta
  text: அவ்வாறே, விலைமகளான ராகாபும் தூதர்களை[b] வரவேற்று, அவர்களை வேறொரு வழியாக அனுப்பிவைத்தபோது, செயல்களினால் நீதிமானாக்கப்படவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமான் என்று காட்டப்படவில்லையா?” அல்லது “நீதிமான் என்று அறிவிக்கப்படவில்லையா?” கிரேக்கத்தில் “நீதிமானாக்கப்படுதல்” என்ற சொல் உள்ளது; இங்குள்ள அதன் நுண்பொருளைப் பற்றிய இறையியல் விவாதத்தைத் தீர்க்காமல் முதன்மை உரை அந்தச் சொல்லைக் காக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “தூதர்கள்.” இங்கு ராகாப் ஏற்றுக்கொண்ட மனிதர்களே குறிக்கப்படுகிறார்கள் (யோசுவா 2); விண்ணுலகத் தூதர்கள் அல்ல.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: அவ்வாறே, ... உம்
  rationale: முந்தைய ஆபிரகாமின் எடுத்துக்காட்டுடன் ஒப்பிட்டு, ராகாபையும் இரண்டாவது எடுத்துக்காட்டாகச் சேர்க்கும் இணைப்பு மற்றும் சேர்க்கைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Ῥαὰβ
  choice: ராகாப்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்ப்பெயர்ப்பு.
- source_word: ἡ πόρνη
  choice: விபச்சாரியான
  rationale: πόρνη என்பதன் சமூக மற்றும் ஒழுக்கப் பொருளைத் தெளிவாகக் காட்டும், நவீன வாசகர்களுக்குப் புரியக்கூடிய சொல்.
- source_word: οὐκ ... ἐδικαιώθη
  choice: நீதிமானாக்கப்படவில்லையா?
  rationale: δικαιόω என்ற வினையின் இறையியல் பதற்றத்தையும் செயப்பாட்டு வடிவத்தையும் காக்கிறது; ‘நீதிமான் என்று காட்டப்படுதல்’ அல்லது ‘அறிவிக்கப்படுதல்’ என்று ஒருதலைப்பட்சமாக விளக்கவில்லை.
- source_word: ἐξ ἔργων
  choice: செயல்களினால்
  rationale: ἐκ இங்கு அடிப்படை அல்லது காரணத்தைக் குறிக்கிறது; யாக்கோபின் சுற்றியுள்ள வாதத்தோடு இணையும் சுருக்கமான தமிழ் வடிவம்.
- source_word: ὑποδεξαμένη
  choice: வரவேற்று
  rationale: வெறுமனே ஏற்றுக்கொண்டாள் என்பதைக் காட்டிலும் விருந்தோம்பலுடன் பெற்றுக்கொண்ட பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς ἀγγέλους
  choice: தூதர்களை
  rationale: ἄγγελος என்பதன் அடிப்படைப் பொருளான ‘தூதர்/செய்தியாளர்’ என்பதைக் காக்கிறது; சூழலில் இவர்கள் மனிதர்கள், விண்ணுலகத் தூதர்கள் அல்ல.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: அவர்களை வேறொரு வழியாக அனுப்பிவைத்தபோது
  rationale: ἐκβάλλω இங்கு வலுக்கட்டாயமாகத் துரத்துதல் அல்ல, வெளியே அனுப்புதல் எனப் பொருள்படும்; ἑτέρᾳ ὁδῷ என்பதன் வேறுபட்ட வழி என்ற கருத்தையும் காக்கிறது.
theological_decisions:
- issue: யாக்கோபு 2:25-இல் விசுவாசம், செயல்கள் ஆகியவற்றோடு தொடர்புடைய δικαιόω என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நீதிமானாக்கப்படுதல்’ என்று வைத்து, அதன் நுண்பொருளைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘நீதிமான் என்று காட்டப்படுதல்’ அல்லது ‘நீதிமான் என்று அறிவிக்கப்படுதல்’
  rationale: யாக்கோபின் சொற்பயன்பாட்டிலுள்ள இறையியல் பதற்றத்தை மொழிபெயர்ப்பு அமைதியாகத் தீர்க்கக்கூடாது. முதன்மைச் சொல் கிரேக்கத்துடனும் சுற்றியுள்ள வாதத்துடனும் உள்ள தொடர்பைக் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் வினாவடிவமும், ஆபிரகாமின் எடுத்துக்காட்டுடன் உள்ள ஒப்பீடும், நீதிமானாக்கப்படுதல் குறித்த உண்மையான இறையியல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
