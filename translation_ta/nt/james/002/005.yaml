source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ta
  text: 'என் அன்பான சகோதரர்களே[a], கேளுங்கள்: உலகத்தின் பார்வையில் ஏழைகளாய் இருப்பவர்களை[b] விசுவாசத்தில்[c] செல்வந்தர்களாகவும், அவர் தம்மை நேசிப்பவர்களுக்கு வாக்களித்த இராஜ்யத்தின் வாரிசுகளாகவும் கடவுள் தேர்ந்தெடுக்கவில்லையா?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று இருந்தாலும், இந்த அழைப்பு விசுவாசச் சமூகத்தினர் அனைவரையும் உள்ளடக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உலகத்தின் அளவுகோலின்படி ஏழைகளாய் இருப்பவர்களை.’
    reason: lexical_alternative
  - marker: c
    text: ‘விசுவாசம்’ என்பதை ‘நம்பிக்கை’ என்றும், இங்கு சாத்தியம் குறைவாக ‘உண்மைத்தன்மை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: கேளுங்கள்
  rationale: கவனம் செலுத்தும்படி அழைக்கும் இறந்தகால ஏவல் பன்மை; நவீன தமிழில் நேரடியான, இயல்பான அழைப்பாக அமைகிறது.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: என் அன்புக்குரிய சகோதரர்களே
  rationale: ἀδελφοί என்பதன் இலக்கண ஆண்பால் பன்மையையும் ἀγαπητοί என்பதன் அன்பான அழைப்பையும் தக்கவைக்கிறது; முழு விசுவாசச் சமூகத்தையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐχ ὁ θεὸς ἐξελέξατο
  choice: கடவுள் தேர்ந்தெடுக்கவில்லையா?
  rationale: உடன்பாட்டான பதிலை எதிர்பார்க்கும் கிரேக்க மறுப்புக் கேள்வியின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: உலகத்தின் பார்வையில் ஏழைகளாக இருப்பவர்களை
  rationale: τῷ κόσμῳ என்பதை உலகத்தின் மதிப்பீடு அல்லது அளவுகோல் என்ற பொருளில் தெளிவாக வெளிப்படுத்துகிறது; வெறுமனே உலகில் வாழும் ஏழைகள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: πλουσίους ἐν πίστει
  choice: விசுவாசத்தில் செல்வந்தர்களாக
  rationale: உலகியல் ஏழ்மைக்கு எதிராக நிறுத்தப்படும் ஆன்மீக வளத்தை வெளிப்படுத்துகிறது; πίστις என்பதற்கு இச்சூழலில் இயல்பான முதன்மைப் பொருளான ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது.
- source_word: κληρονόμους τῆς βασιλείας
  choice: அரசின் வாரிசுகளாக
  rationale: κληρονόμοι என்பதன் குடும்ப-சட்ட உருவகத்தையும் வரவிருக்கும் உரிமைப் பங்கையும் ‘வாரிசுகள்’ துல்லியமாகக் காக்கிறது.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: தம்மை நேசிக்கிறவர்களுக்கு அவர் வாக்களித்த
  rationale: வாக்குறுதியின் பெறுநர்களை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; நிகழ்காலப் பங்கேற்புச் சொல்லின் குணவியல்பான தொடர்ச்சியையும் ‘நேசிக்கிறவர்கள்’ காக்கிறது.
theological_decisions:
- issue: கடவுளின் தேர்ந்தெடுத்தல் என்பதை கோட்பாட்டு முறையில் மிகைவாசித்தல்
  choice: ἐξελέξατο என்பதை ‘தேர்ந்தெடுத்தார்’ என்ற எளிய பொருளிலேயே வழங்குதல்
  alternative: முன்குறித்தல் அல்லது இரட்சிப்புத் தேர்வு குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை வெளிப்படையாகச் சேர்த்துரைத்தல்
  rationale: இவ்வசனத்தின் உடனடிச் சூழல் ஏழைகளைப் பற்றிய கடவுளின் மதிப்பீட்டையும் பாரபட்சத்தின் முரண்பாட்டையும் எடுத்துரைக்கிறது; பின்னைய கோட்பாட்டு விவாதங்களை மொழிபெயர்ப்புக்குள் புகுத்தக் கூடாது.
- issue: ἀδελφοί என்பதன் உள்ளடக்கப் பரப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’ என்று வைத்து, முழுச் சமூகத்தையும் உள்ளடக்கக்கூடிய பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையிலேயே ‘சகோதர சகோதரிகளே’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை; அதேவேளையில் நிருப அழைப்பில் பெண்களையும் உள்ளடக்கிய முழுச் சபையைக் குறிக்கலாம். இரு அம்சங்களையும் இம்முறை காக்கிறது.
- issue: πίστις என்பதன் பொருள்
  choice: ‘விசுவாசம்’
  alternative: ‘நம்பிக்கை’ அல்லது, இங்கு சாத்தியம் குறைவாக, ‘உண்மைத்தன்மை’
  rationale: ‘விசுவாசத்தில் செல்வந்தர்கள்’ என்ற அமைப்பு கடவுள்மீதான விசுவாசத்தைக் குறிப்பதே இச்சூழலில் மிக இயல்பானது; பிற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: βασιλεία என்பதன் மொழிபெயர்ப்பு
  choice: ‘அரசு’
  alternative: ‘ராஜ்யம்’ அல்லது ‘ஆட்சி’
  rationale: ‘அரசு’ என்பது கடவுளின் அரசாட்சிக்குட்பட்ட ஆட்சிப் பரப்பையும் வாரிசுரிமை உருவகத்தையும் இயல்பாகத் தாங்கும் நவீன தமிழ்ச் சொல்; ‘ஆட்சி’ மட்டும் வாரிசுகளாக இருப்பது என்ற தொடரில் இயல்பாக அமையாது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. மறுப்புக் கேள்வியின் வலிமையும் ‘ஏழைகள்—செல்வந்தர்கள்’ என்ற திட்டமிட்ட முரண்பாடும் காக்கப்பட்டுள்ளன. ‘அரசு’ என்பது ‘ராஜ்யம்’ என்பதைக் காட்டிலும் தற்போதைய பொதுத் தமிழுக்கு ஏற்றதாகத் தேர்ந்தெடுக்கப்பட்டது.
