review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek syntax and force: ὁρᾶτε is a present plural indicative, ἐξ ἔργων and ἐκ πίστεως are rightly expressed as means/basis, and μόνον is correctly attached to faith. However, ‘நீதிமானாக்கப்படுகிறான்’ can suggest being made righteous rather than retaining the semantic breadth of δικαιοῦται (‘is justified/declared righteous/vindicated’). ‘நீதிமான் எனக் கருதப்படுகிறான்’ is a more standard Tamil rendering for the central term while the footnote retains the contextual alternatives.'
  naturalness: The sentence is generally natural, but ‘ஒரு மனிதன்’ is less idiomatic in a generic assertion in modern standard Tamil than ‘ஒருவர்’; the latter naturally conveys the representative singular without male-exclusive implications. ‘நீதியுள்ளவன் என மெய்ப்பிக்கப்படுகிறான்’ is understandable but stiff; ‘நீதிமான் என்று நிரூபிக்கப்படுகிறான்’ is clearer modern Tamil.
  terminology: ‘விசுவாசம்’ is appropriate as the established rendering of πίστις. ‘செயல்கள்’ suitably renders ἔργα in accessible modern Tamil. Revising the justification term to ‘நீதிமான் எனக் கருதப்படுகிறான்’ avoids an unwarranted causative nuance while preserving theological ambiguity. The generic-human footnote should correspond to the revised main-text wording.
  issues:
  - severity: medium
    issue: ‘நீதிமானாக்கப்படுகிறான்’ introduces a potentially causative sense.
    rationale: The passive δικαιοῦται centrally means ‘is justified/declared righteous’ and may contextually mean vindicated. Tamil ‘ஆக்கப்படுகிறான்’ can imply being made into a righteous person, which narrows or shifts the disputed sense.
  - severity: low
    issue: Generic ‘ஒரு மனிதன்’ is somewhat less natural than ‘ஒருவர்’.
    rationale: ‘ஒருவர்’ is ordinary modern Tamil for a representative singular human referent and preserves the generic scope of ἄνθρωπος without adding male-specific wording.
  - severity: low
    issue: The alternative ‘நீதியுள்ளவன் என மெய்ப்பிக்கப்படுகிறான்’ is stylistically awkward.
    rationale: ‘நீதிமான் என்று நிரூபிக்கப்படுகிறான்’ is more idiomatic while preserving the possible vindicatory reading.
