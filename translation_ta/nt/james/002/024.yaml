source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ta
  text: ஒருவர் செயல்களினால் நீதிமான் எனக் கருதப்படுகிறார்; விசுவாசத்தினால் மட்டும் அல்ல என்பதை நீங்கள் காண்கிறீர்கள்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதிமான் என்று காட்டப்படுகிறார்’ அல்லது ‘நீதிமான் என்று நிரூபிக்கப்படுகிறார்.’ பவுல் ‘நீதிமான் எனக் கருதப்படுதல்’ என்ற சொல்லைப் பயன்படுத்தும் விதத்துடன் இதன் தொடர்பு எவ்வாறு என்பதைப் பற்றிய விளக்கவியல் விவாதத்தைத் தீர்மானிக்காமல், யாக்கோபின் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கில் ‘ஒரு மனிதன்’; இங்கு பொதுவாக ஒரு மனிதரைக் குறிக்கும் பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: cultural_note
  - marker: c
    text: ‘விசுவாசம்’ என்பதற்கு ‘உண்மைத்தன்மை’ அல்லது ‘நம்பிக்கை’ என்றும் மொழிபெயர்க்கலாம்; எனினும் இம்மொழிபெயர்ப்பில் கிரேக்க πίστις (பிஸ்திஸ்) என்பதற்கான இயல்பான மொழிபெயர்ப்பு ‘விசுவாசம்’ ஆகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: நீங்கள் காண்கிறீர்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நிகழ்காலக் கூற்று. முந்தைய எடுத்துக்காட்டிலிருந்து வாசகர்கள் உணர்ந்துகொள்ளும் முடிவை நேரடியாகச் சுட்டுகிறது; கட்டளையாக மாற்றப்படவில்லை.
- source_word: ἐξ ἔργων
  choice: செயல்களினால்
  rationale: ἐξ இங்கு அடிப்படை அல்லது காரணவழியைக் குறிக்கிறது. ‘செயல்களினால்’ என்பது நவீன தமிழில் இயல்பாகவும் வாதத்தின் எதிர்மறை இணைப்பைத் தெளிவாகவும் தருகிறது.
- source_word: δικαιοῦται
  choice: நீதிமானாக்கப்படுகிறான்
  rationale: δικαιόω என்பதன் நீதியியல் மற்றும் இறையியல் நிறையைத் தக்கவைத்து, ‘நீதிமான் என்று காட்டப்படுகிறான்’ அல்லது ‘நீதியுள்ளவன் என மெய்ப்பிக்கப்படுகிறான்’ என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: கிரேக்கச் சொல்லின் ஒருமை மற்றும் பொதுப்பிரதிநிதித்துவப் பயன்பாட்டைத் தக்கவைக்கிறது. இது ஆண்களை மட்டும் குறிக்காது என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: πίστεως
  choice: விசுவாசத்தினால்
  rationale: πίστις என்பதற்கான நிலையான இறையியல் சொல்லாக ‘விசுவாசம்’ வைக்கப்படுகிறது; ‘நம்பிக்கை’ மற்றும் ‘உண்மைத்தன்மை’ ஆகிய சாத்தியமான பொருள்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
- source_word: μόνον
  choice: மட்டும் அல்ல
  rationale: μόνον வெளிப்படுத்தும் தனித்திருத்தலை இயல்பான தமிழில் ‘விசுவாசத்தினால் மட்டும் அல்ல’ என வழங்குகிறது.
theological_decisions:
- issue: δικαιοῦται என்பதன் பொருளும் நீதிமானாக்குதல் பற்றிய இறையியல் பதற்றமும்
  choice: முதன்மை உரையில் ‘நீதிமானாக்கப்படுகிறான்’ என்று தக்கவைத்தல்
  alternative: ‘நீதிமான் என்று காட்டப்படுகிறான்’ அல்லது ‘நீதியுள்ளவன் என மெய்ப்பிக்கப்படுகிறான்’
  rationale: யாக்கோபின் சொற்றொடரை வேறு புதிய ஏற்பாட்டு பயன்பாடுகளோடு முன்கூட்டியே ஒத்திசைத்து அதன் பொருளைத் தீர்மானிக்காமல், மூலத்தின் உண்மையான பல்பொருள் வாய்ப்பையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ἄνθρωπος என்பதன் பொதுப்பிரதிநிதித்துவப் பயன்பாடு
  choice: ‘ஒரு மனிதன்’
  alternative: ‘ஒருவர்’ அல்லது ‘ஒரு மனிதர்’
  rationale: மூலத்தின் இலக்கண ஒருமையையும் பிரதிநிதித்துவ வடிவத்தையும் தக்கவைக்கிறது; இதன் பொதுவான மனிதகுலப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘கிரியைகள்’ என்பதற்குப் பதிலாக இன்றைய வாசகர்களுக்கு நேரடியாகப் புரியும் ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘நீதிமானாக்கப்படுகிறான்’ மற்றும் ‘விசுவாசம்’ ஆகியவை கருத்தியல் தொடர்ச்சிக்காகத் தக்கவைக்கப்பட்டுள்ளன.
