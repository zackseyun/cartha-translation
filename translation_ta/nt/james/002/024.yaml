revisions:
- from: ஒரு மனிதன் செயல்களினால் நீதிமானாக்கப்படுகிறான், விசுவாசத்தினால் மட்டும் அல்ல என்பதை நீங்கள் காண்கிறீர்கள்[a][b][c].
  to: ஒருவர் செயல்களினால் நீதிமான் எனக் கருதப்படுகிறார்; விசுவாசத்தினால் மட்டும் அல்ல என்பதை நீங்கள் காண்கிறீர்கள்[a][b][c].
  rationale: This revision retains the Greek’s direct indicative appeal and its contrast between works and faith alone. It replaces a causative Tamil expression with a standard, semantically broader justification expression, without deciding whether James means forensic justification or public vindication. It also uses a more natural generic singular and aligns every footnote with the revised text.
  reviewer_model: gpt-5.6-terra
