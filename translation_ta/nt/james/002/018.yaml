source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: ta
  text: ஆனால் ஒருவன், “உன்னிடம் விசுவாசம் இருக்கிறது; என்னிடம் செயல்கள் இருக்கின்றன” என்று சொல்வான். செயல்கள் இல்லாமல்[a] உன் விசுவாசத்தை[c] எனக்குக் காட்டு; நானும் என் செயல்களால்[b] என் விசுவாசத்தை உனக்குக் காட்டுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “செயல்களைப் பிரித்து.” கிரேக்கச் சொற்றொடர் “செயல்கள் இல்லாமல்” அல்லது “செயல்களைப் பிரித்து” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “என் செயல்களிலிருந்து.” கிரேக்க முன்னிடைச்சொல் மூலத்தையோ வழிமுறையையோ குறிக்கலாம்; “என் செயல்களால்” என்பது செயல்கள் விசுவாசத்தைக் காணத்தக்கதாக்குகின்றன என்பதை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கம் πίστις; “நம்பிக்கை” என்றும், சில சூழல்களில் “விசுவாசத்தன்மை” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλ’
  choice: ஆனால்
  rationale: யாக்கோபின் வாதத்தில் எழும் எதிர்வாதத்தைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: ἐρεῖ τις
  choice: ஒருவன் ... என்று சொல்வான்
  rationale: எதிர்கால வினைமுற்றையும், கற்பனையான எதிர்வாதியை அறிமுகப்படுத்தும் உரையாடல் பாணியையும் காக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இப்பகுதியின் விசுவாசம்–செயல்கள் என்ற கருத்துத் தொடர்பைத் தொடர்ந்து காக்கும் நிறுவப்பட்ட தமிழ் வேதாகமச் சொல்; ‘நம்பிக்கை’ அல்லது ‘உண்மைத்தன்மை’ என்று தீர்மானித்து மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἔργα
  choice: செயல்கள்
  rationale: வெறும் சொற்பிரகடனத்திற்கு மாறாக வெளிப்படும் செயல்களை இயல்பான நவீன தமிழில் குறிக்கிறது; பகுதியெங்கும் உள்ள கருத்துத் தொடர்ச்சியையும் காக்கிறது.
- source_word: δεῖξόν μοι
  choice: எனக்குக் காட்டு
  rationale: நேரடியான கட்டளையையும் கண்கூடாக வெளிப்படுத்த வேண்டும் என்ற சவாலையும் இயல்பாகத் தருகிறது.
- source_word: χωρὶς τῶν ἔργων
  choice: செயல்கள் இல்லாமல்
  rationale: χωρίς என்பதின் ‘இல்லாமல்/தனியே’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: κἀγώ σοι δείξω
  choice: நானும் ... உனக்குக் காட்டுவேன்
  rationale: κἀγώ-வின் வலியுறுத்தலையும் இரு கூற்றுகளுக்கிடையேயான இணையான அமைப்பையும் காக்கிறது.
- source_word: ἐκ τῶν ἔργων μου
  choice: என் செயல்களால்
  rationale: ἐκ இங்கு மூலத்தையோ வழிமுறையையோ குறிக்கக்கூடும்; செயல்கள் விசுவாசத்தைக் காணத்தக்கதாக்கும் வழிமுறை என்ற சூழ்நிலைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τὴν πίστιν
  choice: என் விசுவாசத்தை
  rationale: மூலத்தின் மீளுரைப்பையும் ‘உன் விசுவாசம்/என் விசுவாசம்’ என்ற சொல்லிணை ஒற்றுமையையும் காக்கிறது.
theological_decisions:
- issue: விசுவாசம்–செயல்கள் விவாதத்தின் மையத்தில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; நம்பகத்தன்மை
  rationale: ‘விசுவாசம்’ என்பது இங்கு கூறிக்கொள்ளப்படும் நம்பிக்கைக்கும் அதை வெளிப்படுத்தும் செயல்களுக்கும் இடையேயான இறையியல் அழுத்தத்தைத் திறந்தவாறே வைக்கிறது; ‘நம்பகத்தன்மை’ என்பது அந்த அழுத்தத்தை முன்கூட்டியே தீர்த்துவிடக்கூடும்.
- issue: ἐκ τῶν ἔργων என்பது மூலமா அல்லது வழிமுறையா
  choice: என் செயல்களால்
  alternative: என் செயல்களிலிருந்து
  rationale: மூலத்தின் ἐκ இரு நிழற்பொருள்களையும் ஏற்கக்கூடியது. இச்சூழலில் செயல்கள் விசுவாசத்தை வெளிப்படுத்தும் வழிமுறையாக இருப்பதை ‘செயல்களால்’ இயல்பாகச் சொல்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் நேரடியும் கண்ணியமுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசம்’ என்ற நிறுவப்பட்ட இறையியல் சொல் கருத்துத் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளது; ‘செயல்கள்’ என்பது இன்றைய தமிழில் இயல்பாகவும் விரிவாகவும் புரியக்கூடியதாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது. மூலத்தின் வாத அமைப்பும் ‘உன்/என்’ என்ற இணைநிலையும் பாதுகாக்கப்பட்டுள்ளன.
