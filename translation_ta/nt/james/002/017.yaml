  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: ta
  text: அவ்வாறே, விசுவாசமும்[a] செயல்களைக் கொண்டிருக்காவிட்டால், தன்னிலேயே இறந்ததாய் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பிக்கை’; இச்சூழலில் குறைவான வாய்ப்பில், ‘விசுவாசத்தன்மை.’ கிரேக்கச் சொல் pistis இப்பொருள்களையும் தரக்கூடும்; ஆனால் இந்த வசனத்தில் யாக்கோபின் வாதத்துக்கு ‘விசுவாசம்’ என்பதே மிகப் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: அவ்வாறே
  rationale: முந்தைய எடுத்துக்காட்டிலிருந்து வரும் ஒப்புமையையும் முடிவையும் சுருக்கமாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: ἡ πίστις
  choice: விசுவாசம்
  rationale: யாக்கோபின் வாதத்தில் வெளிப்படையாகக் கூறப்படும் நம்பிக்கையைக் குறிக்கும் நிலையான வேதாகமச் சொல்; ‘நம்பிக்கை’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐὰν μὴ ἔχῃ ἔργα
  choice: செயல்கள் இல்லாவிட்டால்
  rationale: நிபந்தனைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ἔργα என்பதைக் குறிப்பிட்ட வகைச் செயல்களாகச் சுருக்காமல் பொதுவாக வைத்திருக்கிறது.
- source_word: νεκρά ἐστιν
  choice: இறந்ததாயிருக்கிறது
  rationale: மூலத்தின் வலுவான உருவகத்தையும் நிகழ்நிலைத் தீர்ப்பையும் காக்கிறது.
- source_word: καθ’ ἑαυτήν
  choice: தனியாக
  rationale: செயல்களிலிருந்து பிரிந்த நிலையில் விசுவாசம் இருப்பதைக் காட்டுகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: விசுவாசத்துக்கும் செயல்களுக்கும் இடையிலான உறவு
  choice: விசுவாசமும் செயல்கள் இல்லாவிட்டால், தனியாக இறந்ததாயிருக்கிறது
  alternative: செயல்களில்லாத விசுவாசம் தன்னிலேயே இறந்தது
  rationale: விசுவாசம் மற்றும் செயல்கள் குறித்த இறையியல் பதற்றத்தைத் தீர்த்து வைக்காமல், மூலத்தின் நிபந்தனை அமைப்பையும் ‘தனியாக’ என்ற தனிமைப்படுத்தும் கருத்தையும் காக்கிறது.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இச்சூழலில் சொல்லப்படும் விசுவாசமே யாக்கோபின் வாதத்துக்கு மிகப் பொருத்தமானது. பிற அகராதிசார் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘கிரியைகள்’ என்பதற்குப் பதில் இயல்பான ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது; அதேவேளை மூலத்தின் இறையியல் பதற்றம் மாற்றப்படவில்லை.
