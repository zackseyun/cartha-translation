- from: அவ்வாறே, விசுவாசமும்[a] செயல்கள் இல்லாவிட்டால், தனியாக இறந்ததாயிருக்கிறது.
  to: அவ்வாறே, விசுவாசமும்[a] செயல்களைக் கொண்டிருக்காவிட்டால், தன்னிலேயே இறந்ததாய் இருக்கிறது.
