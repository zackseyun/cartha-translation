id: JAS.2.20
reference: James 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: ta
  text: ஆனால், அறிவற்ற மனிதனே[a], செயல்கள் இல்லாத நம்பிக்கை பயனற்றது[b] என்பதை அறிந்துகொள்ள விரும்புகிறாயா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெறுமையான மனிதனே.’ கிரேக்கச் சொற்றொடரின் நேர்ப்பொருள் இதுவே; சூழலில் அது அறிவோ நியாயமான புரிதலோ இல்லாதவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செயலற்றது’ அல்லது ‘விளைவற்றது.’ கிரேக்கச் சொல் செயல்படாத அல்லது பலன் தராத நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: ஆனால், ... அறிந்துகொள்ள விரும்புகிறாயா?
  rationale: θέλω + இற infinitive விருப்பத்தை வெளிப்படுத்துகிறது; δέ இங்கு எதிர்மறைத் தொடர்ச்சியைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. தமிழின் இயல்பான வாக்கிய அமைப்புக்கேற்ப வினாப்பகுதி இறுதியில் வைக்கப்பட்டது.
- source_word: ὦ ἄνθρωπε κενέ
  choice: அறிவற்ற மனிதனே
  rationale: ἄνθρωπε என்பது ஒருமை விளிவேற்றுமையில் ‘மனிதனே’ என்று பொருள். κενέ என்பதன் நேர்ப்பொருள் ‘வெறுமையான’ என்றாலும், இச்சூழலில் உள்ளார்ந்த புரிதல் அல்லது நியாயமான சிந்தனை இல்லாதவரைக் குறிக்கிறது; இயல்பான தமிழில் அதன் சூழல்சார் தாக்கத்தை ‘அறிவற்ற’ தெளிவாகத் தருகிறது. நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: என்பதை
  rationale: அறிய வேண்டிய கருத்தின் உள்ளடக்கத்தை ὅτι அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதை’ அதனை இயல்பாகக் குறிக்கிறது.
- source_word: ἡ πίστις
  choice: நம்பிக்கை
  rationale: πίστις இங்கு செயல்களுடன் தொடர்புபடுத்தப்படும் நம்பிக்கையைக் குறிக்கிறது. ‘நம்பிக்கை’ என்பது தெளிவான, வழக்கமான, தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்க்காத தமிழ் சொல்.
- source_word: χωρὶς τῶν ἔργων
  choice: செயல்கள் இல்லாத
  rationale: χωρίς + மரபுவேற்றுமை ‘இல்லாமல்/தனியே’ என்ற பொருளைக் கொடுக்கிறது. ‘செயல்கள் இல்லாத’ என்பது நம்பிக்கையை நேரடியாக வரையறுத்து, தமிழில் இயல்பாக வாசிக்கிறது.
- source_word: ἀργή ἐστιν
  choice: பயனற்றது
  rationale: ἀργός என்பது செயல்படாத, விளைவு தராத, பயனற்ற நிலையைச் சுட்டுகிறது. இச்சூழலில் ‘பயனற்றது’ அதன் நடைமுறை விளைவின்மையைத் தெளிவாகத் தருகிறது; மேலும் நேரடியான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: யாக்கோபின் வாதத்தில் நம்பிக்கைக்கும் செயல்களுக்கும் உள்ள தொடர்பு
  choice: செயல்கள் இல்லாத நம்பிக்கையை ‘பயனற்றது’ என்று வசனம் கூறுவதுபோலவே மொழிபெயர்த்தல்
  alternative: அருகிலுள்ள வசனங்களின் சொற்களோடு ஒத்திசைத்து ‘இறந்தது’ என்று மொழிபெயர்த்தல், அல்லது அதன் தாக்கத்தைக் குறைத்து ‘செயலற்றது’ என்று மட்டும் தருதல்
  rationale: இவ்வசனத்தில் ἀργή உள்ளது; νεκρά இல்லை. ஆகவே அருகிலுள்ள வசனத்தின் ‘இறந்தது’ என்ற மொழியை இங்கே கொண்டுவராமலும், பிற்காலக் கோட்பாட்டு அமைப்பால் நம்பிக்கை–செயல்கள் உறவை விளக்காமலும், மூலத்தின் தனித்துவமான பதற்றமும் துல்லியமும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை ஆண் அழைப்பான ‘மனிதனே’ பாதுகாக்கப்பட்டுள்ளது. வாக்கிய அமைப்பு தமிழின் இயல்புக்கு ஏற்ப மாற்றப்பட்டாலும், மூலத்தின் வினா வடிவமும் கண்டிக்கும் தொனியும் காக்கப்பட்டுள்ளன.
