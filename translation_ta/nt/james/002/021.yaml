reference: James 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: ta
  text: நம் தந்தையான ஆபிரகாம், தன் மகன் ஈசாக்கைப் பலிபீடத்தின் மேல் அர்ப்பணித்தபோது, செயல்களினால் நீதிமானாக்கப்படவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதிமான் என்று காட்டப்படவில்லையா?’ அல்லது ‘நீதிமான் என உறுதிப்படுத்தப்படவில்லையா?’ சூழலைப் பொறுத்து, கிரேக்க வினைச்சொல் நீதிமான் என அறிவிப்பதையோ, நீதிமான் என்று வெளிப்படுத்திக் காட்டுவதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: நம் தந்தையாகிய
  rationale: கிரேக்கத்தின் குடும்ப உறவு உருவகத்தையும் உடன்படிக்கை சார்ந்த அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது; ‘நம் மூதாதை’ என்பதைவிட உறவுசார் வலிமை இதில் தெளிவாக உள்ளது.
- source_word: ἐξ ἔργων
  choice: செயல்களினால்
  rationale: ἐξ இங்கு மூலம் அல்லது அடிப்படையைக் குறிக்கிறது. ‘செயல்களினால்’ என்பது இயல்பான தமிழாகவும், இப்பகுதியின் இறையியல் சொற்றொடரையும் பாதுகாப்பதாகவும் உள்ளது.
- source_word: ἐδικαιώθη
  choice: நீதிமானாக்கப்படவில்லையா
  rationale: δικαιόω என்பதன் ‘நீதிமானாக அறிவித்தல்’, ‘நீதிமான் என்று காட்டுதல்’, ‘நியாயமானவர் என உறுதிப்படுத்துதல்’ ஆகிய சாத்தியங்களை ஒரே விளக்கமாகச் சுருக்காமல், நியாயப்படுத்துதல் குறித்த சொல் தொடர்பையும் இறையியல் பதற்றத்தையும் பாதுகாக்கும் மரபறிந்த தமிழ் வடிவம்.
- source_word: ἀνενέγκας
  choice: அர்ப்பணித்தபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இச்சூழலில் உள்ள பலியிடும் நுண்ணுணர்வையும் ‘பலிபீடத்தின்மேல்’ என்பதுடன் சேர்ந்து தெரிவிக்கிறது.
- source_word: θυσιαστήριον
  choice: பலிபீடம்
  rationale: பலியிடுவதற்கான பீடத்தைக் குறிக்கும் நிலையான, தெளிவான தமிழ் சொல்.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: நீதிமானாக்கப்படவில்லையா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவை இயல்பான தமிழ் எதிர்மறை வினா வடிவில் பாதுகாக்கிறது.
theological_decisions:
- issue: யாக்கோபு 2:21-ல் செயல்களுடன் தொடர்புபடுத்தப்படும் δικαιόω என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நீதிமானாக்கப்படுதல்’ என்று மொழிபெயர்த்து, நீதிமானாக்குதல் பற்றிய விரிவான விவாதத்துடனான சொல் தொடர்பையும் உரையின் இறையியல் பதற்றத்தையும் பாதுகாத்தல்.
  alternative: ‘நீதிமான் என்று காட்டப்படுதல்’ அல்லது ‘நியாயமானவர் என உறுதிப்படுத்தப்படுதல்.’
  rationale: இங்கு முழுக்க அறிவிப்புசார் பொருளையோ முழுக்க வெளிப்படுத்திக் காட்டும் பொருளையோ மொழிபெயர்ப்பிலேயே முடிவுசெய்வது உரையின் உண்மையான பொருள் அகலத்தைச் சுருக்கும். எனவே மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம் தந்தை’, ‘செயல்களினால்’, ‘நீதிமானாக்கப்படுதல்’, ‘பலிபீடம்’ ஆகியவை மூலத்தின் உறவுசார், இறையியல், பலியிடுதல் சார்ந்த சொல் இணைப்புகளைப் பாதுகாக்கின்றன.
