  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான கண்டன வினா நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாகுபாடு காட்டி’ என்பது உடனடி சமூகச் சூழலைத் தெளிவாக்குகிறது; கிரேக்கச் சொற்களின் மாற்றுப் பொருள்களும் உறவுநிலை அமைப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
