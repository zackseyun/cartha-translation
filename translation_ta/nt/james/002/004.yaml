  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: ta
  text: நீங்கள் உங்களிடையே பாகுபாடு காட்டி[a], தீய எண்ணங்களுடன் தீர்ப்பளிப்பவர்களாக ஆகவில்லையா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே வேறுபாடு செய்து.” இந்த வினைச்சொல் “பிரிந்துபட்டு” என்றும், வேறு சூழல்களில் “ஐயப்பட்டு” என்றும் பொருள்படலாம்; ஆனால் இங்குள்ள சூழல் பாரபட்சமான வேறுபாடு காட்டுவதையே சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “தீய எண்ணங்கள்/ஆலோசனைகளின் தீர்ப்பளிப்பவர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: பாகுபாடு காட்டி
  rationale: முந்தைய வசனங்களில் செல்வந்தரையும் ஏழையையும் வேறுபடுத்தி நடத்துவது பற்றிப் பேசப்படுவதால், இங்கு ‘பாகுபாடு காட்டுதல்’ என்பதே சூழலுக்கு மிகவும் பொருத்தமான பொருள். இந்த வினைச்சொல்லுக்கு வேறு இடங்களில் ‘ஐயப்படுதல்’ அல்லது ‘பிளவுபடுதல்’ என்ற பொருள்களும் இருக்கலாம்.
- source_word: ἐν ἑαυτοῖς
  choice: உங்களுக்குள்
  rationale: சபைக் கூடுகையில் ஒருவரை ஒருவர் நடத்தும் விதமே சூழல் என்பதால், சமூகத்தினரிடையே நிகழும் செயலை ‘உங்களுக்குள்’ இயல்பாக வெளிப்படுத்துகிறது; உள்ளார்ந்த முரண்பாட்டின் சாயலையும் முற்றிலும் நீக்குவதில்லை.
- source_word: ἐγένεσθε
  choice: ஆகவில்லையா
  rationale: முந்தைய பாகுபாட்டுச் செயலின் விளைவாக அவர்கள் ஒரு குறிப்பிட்ட வகையான நீதிபதிகளாக ஆனதை γίνομαι குறிக்கிறது. எதிர்மறை வினாவுடன் சேர்த்து தமிழில் கண்டிக்கும் சொல்லாற்றலைத் தக்கவைக்கிறது.
- source_word: κριταὶ
  choice: நீதிபதிகள்
  rationale: இச்சொல்லின் நேரடியான நீதித்துறை மற்றும் ஒழுக்கத் தீர்ப்பின் வலிமையை ‘நீதிபதிகள்’ தெளிவாகக் காக்கிறது.
- source_word: διαλογισμῶν πονηρῶν
  choice: தீய சிந்தனைகளைக் கொண்ட
  rationale: கிரேக்க உரையின் ‘தீய சிந்தனைகள்/ஆலோசனைகளின் நீதிபதிகள்’ என்ற உறவுநிலை அமைப்பை, தமிழில் இயல்பாகவும் அதன் சிந்தனை சார்ந்த பொருளைத் தக்கவைத்தும் வழங்குகிறது. ‘தீய நோக்கங்களைக் கொண்ட’ என்பது சற்றுக் குறுகிய விளக்கமாகிவிடும்.
- source_word: οὐ
  choice: ஆகவில்லையா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் கண்டன வினாவைத் தமிழில் எதிர்மறை வினாவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாரபட்சத்தின் சூழலில் διακρίνω என்பதன் பொருள்
  choice: விசுவாசிகளின் சமூகத்திற்குள் பாகுபாடு காட்டியதை வசனம் கண்டிக்கிறது.
