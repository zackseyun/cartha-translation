source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: ta
  text: ஆனால் நீங்கள் அந்த ஏழை மனிதனை அவமதித்தீர்கள்.[a] அந்தச் செல்வந்தர்களே உங்களை ஒடுக்கி, அவர்களே உங்களை நீதிமன்றங்களுக்கு இழுத்துச் செல்கிறார்கள் அல்லவா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழையானவரை”; இன்னும் பொதுவாக, “ஏழைகளை.” கிரேக்கத்தில் இது ஒருமையில் உள்ளது. முந்தைய வசனங்களில் சொல்லப்பட்ட குறிப்பிட்ட ஏழை மனிதனை இது எதிரொலிப்பதோடு, ஏழைகளைப் பொதுவாகவும் பிரதிநிதித்துவப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சட்ட நீதிமன்றங்களுக்கு” அல்லது “தீர்ப்பாயங்களுக்கு.” கிரேக்கச் சொல் நீதி விசாரணை நடைபெறும் நீதிமன்றங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: அவமதித்தீர்கள்
  rationale: ஒருவரை மதிப்பிழக்கச் செய்து இழிவாக நடத்துதல் என்ற பொருளையும், மரியாதை–அவமரியாதை பரிமாணத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν πτωχόν
  choice: அந்த ஏழை மனிதனை
  rationale: முந்தைய வசனங்களில் எடுத்துக்காட்டப்பட்ட குறிப்பிட்ட ஏழை மனிதரைக் குறிக்கும் ஒருமையையும் ஆண்பால் வடிவத்தையும் காக்கிறது; அதே நேரத்தில் அவர் ஏழைகளைப் பிரதிநிதித்துவப்படுத்துவதையும் தடுக்கவில்லை.
- source_word: οἱ πλούσιοι
  choice: செல்வந்தர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழியின் சமூக வகுப்புக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: καταδυναστεύουσιν
  choice: ஒடுக்குகிறவர்கள்
  rationale: அதிகாரத்தை ஒருவருக்கு எதிராகக் கடுமையாகப் பயன்படுத்தும் பொருளைத் தெளிவாகக் காட்டுகிறது; சுரண்டலின் குறிப்பிட்ட முறையைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: ἕλκουσιν
  choice: இழுத்துச் செல்கிறார்கள்
  rationale: வலுக்கட்டாயமாக அழைத்துச் செல்லும் கிரேக்கச் சொல்லின் உயிரோட்டத்தையும் பகைமையான சட்டச் சூழலையும் காக்கிறது.
- source_word: κριτήρια
  choice: நீதிமன்றங்களுக்கு
  rationale: இங்கு குறிக்கப்படும் நீதித்துறை மன்றங்களை நவீன தமிழில் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: καὶ αὐτοὶ
  choice: அவர்களே
  rationale: இந்தச் செயலைச் செய்பவர்கள் அந்தச் செல்வந்தர்களே என்ற வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: οὐχ ... ;
  choice: தானே? ... அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் சொல்லாட்சி வலிமையை இயல்பான தமிழ் வினா அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஒருமையிலுள்ள ‘ஏழை மனிதன்’ என்பதன் குறிப்பு
  choice: சபைக் கூடுகை எடுத்துக்காட்டில் வந்த ஒரு பிரதிநிதித்துவ ஏழை மனிதன்; விரிவாக ஏழைகளுக்கும் பொருந்துகிறது
  alternative: பொதுவாக ஏழைகள் அனைவரையும் குறிக்கும் தொகுப்பு ஒருமை
  rationale: யாக்கோபு 2:2–3 குறிப்பிட்ட ஏழை மனிதனை விவரிப்பதால் ஒருமையைத் தக்கவைப்பது உரையோட்டத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் அதன் பரந்த பிரதிநிதித்துவப் பொருளை முடக்குவதில்லை.
translation_notes:
  register: மரியாதையான, நவீன நிலையான தமிழ். மூலத்தின் எதிர்மறை மாறுபாடு, இரண்டு சொல்லாட்சிக் கேள்விகள், ‘அவர்களே’ என்ற வலியுறுத்தல், மற்றும் வலுக்கட்டாயத்தை உணர்த்தும் ‘இழுத்துச் செல்கிறார்கள்’ ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வரிசைப்படி அமைக்கப்பட்டுள்ளன.
