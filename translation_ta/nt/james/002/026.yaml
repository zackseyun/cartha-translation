  source_fidelity: மூல கிரேக்கத்தின் விளக்க இணைப்பான γάρ (‘ஏனெனில்’), ஒப்புமை அமைப்பு (ὥσπερ…οὕτως καὶ), ‘ஆவி/மூச்சு இல்லாத உடல்,’ மற்றும் ‘செயல்கள் இல்லாத விசுவாசம்’ ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. νεκρόν/νεκρά என்பதன் மீளுரைப்பும் ‘இறந்தது’ எனச் சீராக மொழிபெயர்க்கப்பட்டுள்ளது.
  naturalness: ‘ஏனெனில், ஆவி இல்லாத உடல் இறந்தது போலவே, செயல்கள் இல்லாத விசுவாசமும் இறந்தது’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. ‘போலவே…உம்’ அமைப்பு கிரேக்க ஒப்புமையைத் தெளிவாகத் தருகிறது.
