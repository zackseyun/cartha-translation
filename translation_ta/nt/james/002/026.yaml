id: JAS.2.26
reference: James 2:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: ta
  text: ஏனெனில், ஆவி[a] இல்லாத உடல் இறந்தது போலவே, செயல்கள் இல்லாத விசுவாசமும்[b] இறந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூச்சு’ என்றும் மொழிபெயர்க்கலாம். இதற்கான கிரேக்கச் சொல் ‘ஆவி’ அல்லது ‘மூச்சு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நம்பிக்கை’ அல்லது ‘விசுவாசத்தன்மை’ என்றும் பொருள்படலாம்; இங்கு முதன்மை உரையில் ‘விசுவாசம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ
  choice: போலவே
  rationale: ஒப்புமையின் முதல் பகுதியை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது; -வே என்பது அடுத்த பகுதியுடனான துல்லியமான ஒப்புமையை வலியுறுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கமாக இவ்வசனம் வருவதை வெளிப்படுத்தும் இணைப்புச் சொல்.
- source_word: τὸ σῶμα
  choice: உடல்
  rationale: மனிதரின் உடலைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: χωρὶς πνεύματος
  choice: ஆவி இல்லாத
  rationale: χωρίς என்பதன் ‘இல்லாமல்’ என்ற பொருளையும் πνεῦμα என்பதன் ‘ஆவி’ என்ற முதன்மையான பொருளையும் காக்கிறது; ‘மூச்சு’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: νεκρόν ἐστιν
  choice: இறந்தது
  rationale: உடலின் நிலையை நேரடியாகக் கூறி, மூலத்தின் வலிமையைக் காக்கிறது.
- source_word: οὕτως καὶ
  choice: போலவே … உம்
  rationale: தமிழின் ஒப்புமை அமைப்பில் ‘அதுபோலவே/அவ்வாறே … கூட’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ πίστις
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான நிலையான வேதாகமத் தமிழ் சொல்லைத் தக்கவைத்து, இச்சூழலின் இறையியல் விவாதத்தை உரையிலேயே தீர்த்துவிடாமல் மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: χωρὶς ἔργων
  choice: செயல்கள் இல்லாத
  rationale: ἔργα என்பதைக் பொதுவான செயல்களாக நேரடியாகக் கூறுவதோடு, யாக்கோபின் வாதத்தில் விசுவாசத்துடன் எதிரெதிராக நிறுத்தப்படும் செயல்களையும் தெளிவாகக் குறிக்கிறது.
- source_word: νεκρά ἐστιν
  choice: இறந்தது
  rationale: ஒப்புமையின் இரு பக்கங்களிலும் மீண்டும் வரும் νεκρός என்பதைக் ஒரே விதமாக மொழிபெயர்த்து சொல்லாட்சியின் தாக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒப்புமையில் πνεύματος என்பதன் பொருள்
  choice: ஆவி
  alternative: மூச்சு
  rationale: உடலுக்கு உயிரூட்டும் ஆவியைக் குறிக்கக்கூடிய கிரேக்கச் சொல்லின் பரந்த பொருளை ‘ஆவி’ காக்கிறது. உயிரற்ற உடலைக் குறிக்கும் இவ்வுருவகத்தில் ‘மூச்சு’ என்பதும் பொருந்தக்கூடியதால் அது அடிக்குறிப்பில் விடப்படுகிறது.
- issue: யாக்கோபு 2:26-இல் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை அல்லது விசுவாசத்தன்மை
  rationale: இப்பகுதியின் இறையியல் பதற்றத்தைச் செயற்கையாகத் தீர்க்காமல், வழக்கமான ‘விசுவாசம்’ என்பதை முதன்மை உரையில் வைத்திருக்கிறது; சொல்லின் பிற சாத்தியமான நுண்பொருள்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இறந்தது’ என்ற சொல்லின் இருமுறைப் பயன்பாடு மூலத்தின் இணையான சொல்லாட்சியையும் வாதத்தின் தாக்கத்தையும் காக்கிறது; இறையியல் விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
