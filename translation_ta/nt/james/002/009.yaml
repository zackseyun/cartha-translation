  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: ta
  text: ஆனால், நீங்கள் பாரபட்சம் காட்டினால்[a], பாவம் செய்கிறீர்கள்; சட்டத்தை மீறுபவர்களாக[c] சட்டத்தால் குற்றம் சாட்டப்படுகிறீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாரபட்சம் காட்டினால்’ என்பதற்கு ‘ஒருதலைப்பட்சமாக நடந்துகொண்டால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல், ஒருவரின் வெளித்தோற்றம் அல்லது சமூக நிலையை அடிப்படையாகக் கொண்டு அவரை மதிப்பிடுவதையோ நடத்துவதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘குற்றம் சாட்டப்படுகிறீர்கள்’ என்பதற்கு ‘உங்கள் குற்றம் வெளிப்படுத்தப்படுகிறது’ அல்லது ‘கண்டிக்கப்படுகிறீர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், ஒருவரின் தவறு வெளிச்சத்துக்குக் கொண்டுவரப்பட்டு அவர் குற்றமுடையவர் எனக் காட்டப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வரம்புமீறுகிறவர்கள்.’ இங்கு சட்டத்தின் எல்லையை மீறுகிறவர்கள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால், ... காட்டினால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளையும் δέ என்பதன் மென்மையான எதிர்மறைத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: προσωπολημπτεῖτε
  choice: நீங்கள் பாரபட்சம் காட்டினால்
  rationale: ஒருவரின் வெளித்தோற்றம் அல்லது சமூக நிலையை அடிப்படையாகக் கொண்டு வேறுபாடாக நடத்துவதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: பாவம் செய்கிறீர்கள்
  rationale: ‘பாவத்தைச் செய்கிறீர்கள்’ என்ற கிரேக்கச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; நிகழ்கால வினையின் தொடரும் நெறிப்பொறுப்பையும் காக்கிறது.
- source_word: ἐλεγχόμενοι
  choice: நிரூபிக்கப்படுகிறீர்கள்
  rationale: சட்டம் தவறை வெளிக்கொண்டு வந்து ஒருவரை மீறுகிறவர் என மெய்ப்பிப்பதைக் காட்டுகிறது; செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
- source_word: ὑπὸ τοῦ νόμου
  choice: சட்டத்தால்
  rationale: νόμος என்பதற்கு ‘மோசேயின் சட்டம்’ அல்லது ‘இறைச்சட்டம்’ என்ற கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்காமல், கிரேக்கத்தின் பரந்த குறிப்பைத் தக்கவைக்கிறது.
- source_word: ὡς παραβάται
  choice: சட்டத்தை மீறுகிறவர்கள் என்று
  rationale: παραβάται என்பதன் சட்ட அல்லது கட்டளை மீறல் சார்ந்த பொருளை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது; தமிழில் தேவையான செயப்படுபொருள் சூழலிலுள்ள ‘சட்டம்’ என்பதிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யாக்கோபின் அறவியல் வாதத்தில் νόμος என்பதன் வரம்பு
  choice: சட்டம்
  alternative: திருச்சட்டம்; இறைச்சட்டம்; மோசேயின் சட்டம்
  rationale: இவ்வசனம் பாரபட்சத்தைப் பாவமாக வெளிப்படுத்தும் அளவுகோலாகச் சட்டத்தை முன்வைக்கிறது. ஆனால் எந்த உடன்படிக்கை அல்லது இறையியல் அமைப்பை மட்டும் குறிக்கிறது என்று கிரேக்கம் இங்கே வெளிப்படையாக வரையறுக்காததால், மொழிபெயர்ப்பு அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: ἐλεγχόμενοι என்பதன் நீதித்துறை மற்றும் வெளிப்படுத்தும் நுணுக்கம்
  choice: சட்டத்தால் நிரூபிக்கப்படுகிறீர்கள்
  alternative: சட்டத்தால் குற்றம் சாட்டப்படுகிறீர்கள்; சட்டத்தால் கண்டிக்கப்படுகிறீர்கள்
  rationale: இச்சொல் தவறு வெளிப்படுத்தப்படுதல், கண்டிக்கப்படுதல், குற்றம் மெய்ப்பிக்கப்படுதல் ஆகிய தொடர்புடைய நுணுக்கங்களை உடையது. சூழலின் சட்டரீதியான தொனியை முன்னிறுத்தி ‘நிரூபிக்கப்படுகிறீர்கள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான தொழில்நுட்பச் சொல்லுக்குப் பதிலாக ‘சட்டம்’ பயன்படுத்தப்பட்டு, மூலத்தின் இறையியல் பரப்பு குறுக்கப்படாமல் காக்கப்பட்டுள்ளது.
