revisions:
- from: ஏனெனில், இரக்கம் காட்டாதவனுக்குத் தீர்ப்பு இரக்கமற்றதாக இருக்கும்; இரக்கமோ தீர்ப்பின்மேல் வெற்றி கொள்கிறது.[a]
  to: ஏனெனில், இரக்கம் காட்டாதவருக்கு இரக்கமற்ற தீர்ப்பு உண்டு; இரக்கமோ தீர்ப்பின்மேல் வெற்றி கொள்கிறது.[a]
  rationale: The revision preserves every major lexical and theological feature of the draft while making the first clause a more direct Tamil equivalent of the Greek gnomic present. It also uses an inclusive generic form for the articular participle. The final clause and its footnote preserve the source verb’s alternative ‘boast/exult over’ sense without forcing a doctrinal interpretation.
