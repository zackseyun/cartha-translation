id: JAS.2.13
reference: James 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: ta
  text: ஏனெனில், இரக்கம் காட்டாதவருக்கு இரக்கமற்ற தீர்ப்பு உண்டு; இரக்கமோ தீர்ப்பின்மேல் வெற்றி கொள்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரக்கம் தீர்ப்புக்கு எதிராகப் பெருமிதம் கொள்கிறது.” கிரேக்க வினைச்சொல் எதிராக அல்லது மேலாகப் பெருமிதம் கொள்வதைக் குறிக்கலாம்; இங்கு அதன் சொல்லாட்சிசார் வலிமை “வெற்றி கொள்கிறது” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: தீர்ப்பு
  rationale: இது வெறும் கருத்தையல்ல, நீதிசார்ந்த அல்லது இறை மதிப்பீட்டைக் குறிக்கிறது. வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது உள்ளார்ந்த முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἀνέλεος
  choice: இரக்கமற்றதாக
  rationale: தீர்ப்பின் தன்மையை விவரிக்கும் பெயரடை. ἔλεος என்பதுடன் உள்ள சொல் தொடர்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: இரக்கம் காட்டாதவனுக்கு
  rationale: ‘இரக்கம் செய்தல்’ என்ற மூலமொழி மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்; தீர்ப்பைப் பெறும் நபரையும் ஒழுக்கரீதியான பரஸ்பரத் தொடர்பையும் தெளிவாக்குகிறது.
- source_word: κατακαυχᾶται
  choice: வெற்றி கொள்கிறது
  rationale: வினைச்சொல்லின் அடிப்படைப் படிமத்தில் ‘எதிராகப் பெருமிதம் கொள்ளுதல்’ என்ற பொருள் இருந்தாலும், இச்சூழலில் மேலோங்கி வெல்லுதல் என்ற சொல்லாட்சிசார் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: பொதுவாகப் புரிந்துகொள்ளக்கூடிய, சூழலுக்குப் பொருத்தமான சொல்; வசனம் முழுவதிலும் மீண்டும் வரும் மூலச்சொல் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: κατακαυχᾶται ἔλεος κρίσεως என்ற இறுதி வாக்கியத்தின் இயல்பு
  choice: ‘இரக்கம் தீர்ப்பின்மேல் வெற்றி கொள்கிறது’ என்ற பொதுவான கோட்பாட்டு வாக்கியம்
  alternative: ‘இரக்கம் தீர்ப்புக்கு எதிராகப் பெருமிதம் கொள்கிறது’; அல்லது இரக்கமுள்ளவர் காட்டிய இரக்கம் தீர்ப்பின்போது மேலோங்குகிறது
  rationale: மூல வாக்கியம் சுருக்கமானதும் பல்வேறு தொடர்புகளைத் திறந்துவைப்பதுமாக உள்ளது. இது கடவுளின் இரக்கத்தையா, தீர்ப்பில் செயல்படும் இரக்கத்தையா, விசுவாசிகள் காட்டிய இரக்கத்தின் உறுதிப்படுத்தும் பங்கையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை; கிரியைகளால் பலன் சம்பாதிக்கும் கோட்பாட்டையும் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஏனெனில்’ காரணத் தொடர்பைப் பாதுகாக்கிறது; ‘இரக்கமோ’ இறுதி வாக்கியத்தின் வலியுறுத்தப்பட்ட முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
