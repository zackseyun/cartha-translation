  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: ta
  text: ஒரு சகோதரனோ சகோதரியோ போதிய ஆடையின்றி, அன்றாட உணவு இல்லாமல் இருந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: -இருந்தால்
  rationale: இது நிபந்தனையைக் குறிக்கிறது; தமிழில் இயல்பாக வாக்கியத்தின் முடிவில் இணைக்கப்படும் ‘இருந்தால்’ அந்தக் கற்பனை நிலையைத் தெளிவாகத் தருகிறது.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: ஒரு சகோதரனோ சகோதரியோ
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ஆண்பால்–பெண்பால் இணையைச் சுருக்காமல், இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: γυμνοὶ
  choice: போதிய உடையின்றி
  rationale: இச்சூழலில் முற்றிலும் நிர்வாணமாக இருப்பதைவிட தேவைக்குப் போதுமான ஆடை இல்லாத வறிய நிலையே அதிகம் சாத்தியம்; அதேவேளை சொற்பொருள் மாற்றை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὑπάρχωσιν
  choice: இருந்தால்
  rationale: இங்கு இவ்வினை நிலைமையைச் சுட்டும் இணைப்புவினையாகச் செயல்படுகிறது; நிபந்தனை அமைப்புடன் தமிழில் இயல்பாக ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: λειπόμενοι
  choice: குறைவுபட்டிருந்தால்
  rationale: தேவையான ஒன்று தொடர்ந்து கிடைக்காமல் இருக்கும் பற்றாக்குறை நிலையை வெளிப்படுத்துகிறது.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: அன்றாட உணவுக்கும்
  rationale: ἐφήμερος என்பது நாள்தோறும் தேவையானதை, τροφή உணவு அல்லது ஊட்டத்தை குறிக்கிறது; ‘அன்றாட உணவு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: ἀδελφὸς ἢ ἀδελφή என்பதன் சமூக வரம்பு
  choice: ‘சகோதரனோ சகோதரியோ’ என்ற குடும்ப உறவுச் சொல்லைத் தக்கவைத்தல்; சூழலில் இது சக விசுவாசிகளைக் குறிக்க வாய்ப்புள்ளது.
  alternative: தேவையிலுள்ள எந்த மனிதரையும் பொதுவாகக் குறிக்கும் சொற்றொடராக மொழிபெயர்த்தல்.
  rationale: யாக்கோபு பயன்படுத்தும் வெளிப்படையான உறவுமுறை மொழியை மொழிபெயர்ப்பு பாதுகாக்கிறது; அதன் வரம்பை மூலவசனம் கூறுவதற்கும் மேலாக விரிவுபடுத்தவோ குறுக்கவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை. இது அடுத்த வசனத்தில் தொடரும் நிபந்தனைத் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
