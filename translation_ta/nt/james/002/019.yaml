source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: ta
  text: கடவுள் ஒருவரே என்று நீ நம்புகிறாய்[a]; நன்றாகச் செய்கிறாய். பேய்களும்கூட நம்புகின்றன; திகிலால் நடுங்குகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே கடவுள்தான் இருக்கிறார்.” கிரேக்கச் சொற்றொடரை இருவிதமாகவும் மொழிபெயர்க்கலாம்; “கடவுள் ஒருவரே” என்பது அதன் சொல் அமைப்புக்கு நெருக்கமாக இருப்பதோடு, யூதர்களின் ஒரே கடவுள் விசுவாச அறிக்கையையும் எதிரொலிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நடுங்குகின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: நீ
  rationale: வெளிப்படையாக இடம்பெறும் ஒருமை இரண்டாம் நபர் சுட்டுப்பெயரை நேரடியாகப் பாதுகாக்கிறது; தமிழில் ‘நீ’ என்பதே தேவையான வலியுறுத்தலையும் தருகிறது.
- source_word: πιστεύεις / πιστεύουσιν
  choice: நம்புகிறாய் / நம்புகின்றன
  rationale: ὅτι அறிமுகப்படுத்தும் நம்பிக்கையின் உள்ளடக்கத்திற்கு ‘நம்பு’ இயல்பானது. மனிதனின் நம்பிக்கைக்கும் பேய்களின் நம்பிக்கைக்கும் ஒரே வினைச்சொல்லைப் பயன்படுத்தி, மூலத்தின் முக்கியமான சொல் மறுபயன்பாடு பாதுகாக்கப்படுகிறது.
- source_word: εἷς ἐστιν ὁ θεός
  choice: கடவுள் ஒருவரே
  rationale: கிரேக்கச் சொற்றொடரின் ‘கடவுள் ஒருவர்’ என்ற முன்வைப்பை இயல்பான தமிழில் தருகிறது; ஒரே கடவுள் என்ற யூத விசுவாச அறிக்கையின் எதிரொலியையும் பாதுகாக்கிறது.
- source_word: καλῶς ποιεῖς
  choice: நல்லதுதான்
  rationale: சுருக்கமான பாராட்டாகத் தோன்றிய பின் அடுத்த வாக்கியத்தால் கூர்மையடையும் யாக்கோபின் சொல்லாட்சியை இயல்பான, அளவான தமிழில் தருகிறது.
- source_word: καὶ τὰ δαιμόνια
  choice: பேய்களும்கூட
  rationale: καί என்பதன் உயர்த்திக் காட்டும் பொருளை ‘கூட’ வெளிப்படுத்துகிறது; δαιμόνια என்பதற்கு பொதுவாகப் புரியும் நேரடியான தமிழ் ‘பேய்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: φρίσσουσιν
  choice: திகிலால் நடுங்குகின்றன
  rationale: அச்சத்தினால் ஏற்படும் தீவிரமான உடல் எதிர்வினையை வெளிப்படுத்துகிறது; வெறும் அறிவுசார் ஒப்புதலைவிட பேய்களின் எதிர்வினை அதிகமானது என்ற வசனத்தின் தாக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: εἷς ἐστιν ὁ θεός என்ற ஒரே கடவுள் விசுவாச அறிக்கையின் மொழிபெயர்ப்பு
  choice: கடவுள் ஒருவரே
  alternative: ஒரே கடவுள்தான் இருக்கிறார்
  rationale: தேர்ந்தெடுக்கப்பட்ட வடிவம் கிரேக்க வாக்கிய அமைப்புக்கும் இஸ்ரவேலின் ஒரே கடவுள் அறிக்கையின் சாத்தியமான எதிரொலிக்கும் நெருக்கமாக உள்ளது. மாற்று வடிவமும் இலக்கணரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: மனித நம்பிக்கைக்கும் பேய்களின் நம்பிக்கைக்கும் இடையிலான ஒப்பீடு
  choice: பேய்களும்கூட நம்புகின்றன; திகிலால் நடுங்குகின்றன
  alternative: பேய்களும் நம்பி நடுங்குகின்றன
  rationale: ‘கூட’ என்பது καί என்பதன் உயர்த்திக் காட்டும் வலிமையை வெளிப்படுத்துகிறது. சரியான கருத்தை ஏற்றுக்கொள்வது மட்டும் போதாது என்ற வசனத்தின் இறையியல் பதற்றத்தை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், நேரடியும் கண்ணியமுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நல்லதுதான்’ என்பது அளவான பாராட்டாக இருந்து, அடுத்த வாக்கியத்தின் மறைமுகக் கண்டனத்தை இயல்பாகத் தீவிரப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
