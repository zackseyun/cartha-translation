source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: ta
  text: ஏனெனில், பொன் மோதிரங்கள் அணிந்து, பளபளப்பான ஆடை அணிந்த ஒரு மனிதன் உங்கள் கூடுகைக்குள் வந்தால், அழுக்கான ஆடை அணிந்த ஓர் ஏழை மனிதனும் வந்தால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγήν
  choice: கூடுகை
  rationale: இச்சூழலில் கூடியிருக்கும் மக்களின் கூட்டத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல். இது ஒரு முறைப்படுத்தப்பட்ட யூத வழிபாட்டு நிலையத்தை அவசியம் உணர்த்தாமல், συναγωγή என்பதன் ‘கூட்டம்/கூடுகை’ என்ற பொருளைத் தருகிறது; ‘ஜெபக்கூடம்’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀνὴρ
  choice: ஒரு மனிதன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் இருப்பதால், எடுத்துக்காட்டில் வரும் நபர் ஆண் என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: χρυσοδακτύλιος
  choice: பொன் மோதிரங்கள் அணிந்து
  rationale: விரல்களில் பொன்னால் அலங்கரிக்கப்பட்டிருப்பதைக் குறிக்கும் இந்த அடைமொழியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ஒரே மோதிரமா பல மோதிரங்களா என்பதைச் சொல் முற்றிலும் நிர்ணயிக்காதபோதிலும், செல்வச் செழிப்பைக் காட்டும் அணிகலன் என்ற காட்சி பாதுகாக்கப்படுகிறது.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: பளபளப்பான ஆடை உடுத்திய
  rationale: λαμπρός என்பதன் ஒளிரும்/பிரகாசமான காட்சிச் சாயலைப் பாதுகாத்து, கவர்ச்சிகரமான உயர்தர ஆடையையும் இயல்பாக உணர்த்துகிறது.
- source_word: πτωχὸς
  choice: ஓர் ஏழை மனிதன்
  rationale: முதல் மனிதனுக்கு இணையான ஆண்பால் ஒருமை அமைப்பையும், செல்வந்தருக்கும் ஏழைக்கும் இடையிலான வலுவான முரண்பாட்டையும் காக்கிறது.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: அழுக்கான ஆடை உடுத்திய
  rationale: ῥυπαρός என்பதன் அழுக்கு மற்றும் இழிவான தோற்றம் என்ற வலுவான பொருளை நேரடியாகத் தருகிறது; வெறும் ‘பழைய’ அல்லது ‘கந்தலான’ என்று பொருளை மாற்றவில்லை.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: வருகிறான் ... வருகிறான்
  rationale: தமிழில் ஒரு கூடுகைக்குள் ஒருவர் வந்துசேர்வதை இயல்பாகக் கூறுகிறது; இருமுறை வரும் கிரேக்க வினைச்சொல்லின் இணை அமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் பாரபட்சம் காட்டக்கூடாது என்று கூறியதற்கான விளக்க எடுத்துக்காட்டாக இவ்வசனம் வருவதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்தவச் சூழலிலுள்ள συναγωγή என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: கூடுகை
  alternative: ஜெபக்கூடம்
  rationale: இங்கு சபை நிர்வாகம் அல்லது தனிப்பட்ட நிறுவன அடையாளம் பற்றிய கொள்கைக் கூற்று இல்லை. ‘கூடுகை’ என்பது மக்கள் ஒன்றுகூடிய நிகழ்வைச் சூழலுக்கேற்ப தெரிவிக்கிறது; அதேவேளை, கிரேக்கச் சொல் நேரடியாக ‘ஜெபக்கூடம்’ என்றும் மொழிபெயர்க்கப்படலாம் என்பதால் அந்த உண்மையான lexical மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்திற்குச் செல்லும் நிபந்தனை எடுத்துக்காட்டு என்பதால், தமிழில் முழுமையற்றதாக விடாமல் ‘என்றும் வைத்துக்கொள்ளுங்கள்’ எனத் தொடர் அமைப்பு இயல்பாக்கப்பட்டுள்ளது; இதன் தர்க்க விளைவு அடுத்த வசனத்தில் தொடர்கிறது.
