id: JAS.2.23
reference: James 2:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: ta
  text: “ஆபிரகாம் கடவுளை நம்பினார்; அது அவருக்கு நீதியாகக் கணக்கிடப்பட்டது[a]” என்று கூறுகிற வேதவாக்கு இவ்வாறு நிறைவேறியது. மேலும், அவர் “கடவுளின் நண்பர்” என்று அழைக்கப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருடைய கணக்கில் நீதியாக வரவு வைக்கப்பட்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: λογίζομαι என்ற கிரேக்க வினைச்சொல்லின் கணக்குப் பதிவு அல்லது வரவு வைத்தல் சார்ந்த மாற்றுப் பொருளைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ἐπληρώθη
  choice: நிறைவேறியது
  rationale: வேதவாக்கைக் குறிக்கும் இறப்புவினை வடிவத்தின் இயல்பான தமிழ் மொழிபெயர்ப்பு. ஆபிரகாமின் செயலால் அந்த வேதவாக்கு நிறைவு பெற்றது என்ற யாக்கோபின் கருத்தைப் பாதுகாக்கிறது.
- source_word: ἡ γραφή ἡ λέγουσα
  choice: என்று கூறுகிற வேதவாக்கு
  rationale: γραφή இங்கு பொதுவான எழுத்தை அல்ல, மேற்கோள் காட்டப்படும் புனித வேதவாக்கைக் குறிக்கிறது; λέγουσα என்பதை இயல்பான தமிழ் மேற்கோள் அமைப்பில் இணைக்கிறது.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: ஆபிரகாம் கடவுளை நம்பினார்
  rationale: πιστεύω உடன் வரும் நான்காம் வேற்றுமை, கடவுள் கூறியதை உண்மையென ஏற்று அவரை நம்பியதைக் காட்டுகிறது. ‘கடவுள்மீது விசுவாசம் வைத்தார்’ என்பதைவிட இது மூலத்துக்கு நெருக்கமானது.
- source_word: ἐλογίσθη αὐτῷ
  choice: அது அவருக்கு ... கணக்கிடப்பட்டது
  rationale: λογίζομαι என்பதிலுள்ள கணக்கு அல்லது மதிப்பீட்டு நுணுக்கத்தைத் தெளிவாகக் காக்கிறது. ‘அது’ என்பது ஆபிரகாமின் நம்புதலைச் சுட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘விசுவாசம்’ என்ற பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
- source_word: εἰς δικαιοσύνην
  choice: நீதியாக
  rationale: ஆதியாகம மேற்கோளிலும் இப்பகுதியின் சூழலிலும் δικαιοσύνη குறிக்கும் நீதியான நிலையை இயல்பான தமிழில் தருகிறது; அதை சமூக ‘நியாயம்’ என்ற பொருளுக்குள் மாற்றவில்லை.
- source_word: φίλος θεοῦ
  choice: கடவுளின் நண்பர்
  rationale: உறவைக் குறிக்கும் இயல்பான, நேரடியான தமிழ்; இந்த உருபுத் தொடருக்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐκλήθη
  choice: அழைக்கப்பட்டார்
  rationale: καλέω என்ற இறப்புவினையின் பரந்த பொருளை அப்படியே காக்கிறது; பெயரிடப்பட்டாரா அல்லது அவ்வாறு அறியப்பட்டாரா என்பதைத் தேவையின்றித் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: யாக்கோபின் வாதத்தில் ஆபிரகாமின் நம்பிக்கைக்கும் செயல்களுக்கும் உள்ள உறவு
  choice: ஆபிரகாமின் கீழ்ப்படிதலுள்ள செயலில் வேதவாக்கு நிறைவேறியது என்ற கருத்தை மொழிபெயர்ப்பு காக்கிறது.
  alternative: செயல்களிலிருந்து முற்றிலும் பிரிக்கப்பட்ட நீதிமன்றத் தீர்ப்பு போன்ற வாசிப்பு; அல்லது நம்பிக்கையின் இடத்தைச் செயல்கள் எடுத்துக்கொண்டதாகக் காட்டும் வாசிப்பு.
  rationale: இந்த வசனம் ஆதியாகமம் 15:6-ஐ ஆபிரகாமின் பின்னைய கீழ்ப்படிதலோடு இணைக்கிறது. பரந்த நீதிமானாக்குதல் விவாதத்தைத் தீர்க்காமல், உரையிலுள்ள இறையியல் இழுவிசையை மொழிபெயர்ப்பு பாதுகாக்க வேண்டும்.
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: ஆபிரகாமைப் பற்றிய இந்த மேற்கோளில் ‘நீதி’ என்பது கடவுள்முன் நீதியான நிலை என்ற பொருளுக்கு ஏற்றது; ‘நியாயம்’ சமூக அல்லது சட்டநீதியை முதன்மையாக உணர்த்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மேற்கோள் முதலில் வருமாறு தமிழ் வாக்கிய ஒழுங்கு இயல்பாக்கப்பட்டுள்ளது. ‘கடவுள்’, ‘வேதவாக்கு’, ‘நீதி’ ஆகிய சொற்கள் தெளிவையும் வேதச் சூழலையும் காக்கின்றன; எந்தச் சமயப் பிரிவின் தனிப்பட்ட கோட்பாட்டு சொற்களும் சேர்க்கப்படவில்லை.
