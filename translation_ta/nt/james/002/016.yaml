source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: ta
  text: உங்களில் ஒருவர் அவர்களிடம், “சமாதானத்துடன் போங்கள்; சூடாக இருங்கள்; வயிறார உண்ணுங்கள்”[a] என்று சொல்லி, அவர்களுடைய உடலுக்குத் தேவையானவற்றைக் கொடுக்காமல் இருந்தால், அதனால் என்ன பயன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்குச் சொல்: “சூடுபெறுங்கள்; நிறைவடையுங்கள்.” கிரேக்க வினைவடிவங்களைச் செயப்பாட்டுப் பொருளிலோ இடைவினைப் பொருளிலோ புரிந்துகொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: உங்களில் ஒருவர் ... சொல்லியும்
  rationale: இது ஒரு கற்பனையான எடுத்துக்காட்டை அறிமுகப்படுத்துகிறது. ἐξ ὑμῶν என்பதன் பகுதி சார்ந்த பொருளை இயல்பான தமிழில் ‘உங்களில் ஒருவர்’ எனத் தருகிறது; தொடர்ந்து வரும் எதிர்மறைச் செயலுடன் இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: சமாதானத்துடன் போங்கள்
  rationale: வழியனுப்பும்போது கூறப்படும் வாழ்த்து அல்லது ஆசிமொழியின் பொருளையும், இச்சூழலில் அதன் முரண்நகைத் தாக்கத்தையும் காக்கிறது.
- source_word: θερμαίνεσθε
  choice: குளிர்காய்ந்து
  rationale: உடலை வெப்பமாக வைத்துக்கொள்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ். கிரேக்க வடிவத்தின் இடை/செயப்பாட்டு ambiguity-யை முதன்மை உரையில் அளவுக்கு மீறித் தீர்மானிக்காமல், மாற்று நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: χορτάζεσθε
  choice: வயிறார உண்ணுங்கள்
  rationale: உணவினால் நிறைவடைவதை சாதாரண வாசகர்களுக்குத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘ஊட்டப்படுங்கள்’ என்ற செயப்பாட்டு சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: அவர்களுடைய ... கொடுக்காவிட்டால்
  rationale: வாய்ச்சொல்லுக்கும் நடைமுறை உதவியின்மைக்கும் இடையிலான முரண்பாட்டை நிபந்தனைத் தொடரில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: அவர்களுடைய உடலுக்குத் தேவையானவற்றை
  rationale: ἐπιτήδεια குறிக்கும் அத்தியாவசியப் பொருட்களையும், τοῦ σώματος வலியுறுத்தும் உடல் சார்ந்த தேவையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τί ὄφελος;
  choice: அதனால் என்ன பயன்?
  rationale: நடைமுறை பலன் என்ன எனக் கேட்கும் கிரேக்கச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: θερμαίνεσθε மற்றும் χορτάζεσθε ஆகிய கட்டளை வடிவங்களின் இடை/செயப்பாட்டு பொருள்
  choice: ‘குளிர்காய்ந்து, வயிறார உண்ணுங்கள்’ என்று இயல்பான அறிவுறுத்தல்களாக மொழிபெயர்த்தல்
  alternative: ‘வெப்பமூட்டப்பட்டு, நிறைவடையுங்கள்’ அல்லது ‘உங்களை வெப்பமாக்கிக்கொண்டு, திருப்தியடையுங்கள்’
  rationale: யாக்கோபின் மையக் கருத்து, பொருள் உதவியற்ற நல்வாழ்த்துச் சொற்களின் பயனின்மையே; அவர்கள் தாமே தேவைகளை நிறைவேற்ற வேண்டுமா அல்லது பிறரால் நிறைவேற்றப்பட வேண்டுமா என்பதைத் துல்லியப்படுத்துவது அல்ல. முதன்மை உரை இயல்பானதாக வைக்கப்பட்டு, கிரேக்கக் குரல் ambiguity அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் அமைக்கப்பட்டது. ‘குளிர்காய்ந்து’ மற்றும் ‘வயிறார உண்ணுங்கள்’ இயல்பான பேச்சுவழக்கை ஒட்டினாலும் மரியாதைமிக்க பன்மைக் கட்டளை வடிவத்தைப் பேணுகின்றன; உண்மையான கிரேக்க ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
