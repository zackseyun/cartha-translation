  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: ta
  text: விசுவாசம் அவனுடைய செயல்களோடு இணைந்து செயல்பட்டதையும், அந்தச் செயல்களால் விசுவாசம் நிறைவுபெற்றதையும் நீ காண்கிறாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தச் செயல்களால் விசுவாசம் முழுமையாக்கப்பட்டது.” கிரேக்க வினைச்சொல் ஒன்று தன் நோக்கமான முடிவை அல்லது முதிர்ச்சியை அடைவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: நீ காண்கிறாய்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் இரண்டாம் நபர் ஒருமையைப் பாதுகாத்து, யாக்கோபின் நேரடியான வாத அழைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: யாக்கோபு 2-இன் விவாதத்திலும் தமிழ் வேதாகமப் பயன்பாட்டிலும் தெளிவாக அறியப்படும் வழக்கமான சொல்லாகும்; ‘நம்பிக்கை’ என்ற தொடர்புடைய நுணுக்கத்தைத் தீர்மானித்து விடாமல் மூலத்தின் கருத்தியல் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: συνήργει
  choice: இணைந்து செயல்பட்டது
  rationale: இறந்தகாலத்தில் தொடர்ந்த அல்லது உடனிகழ்ந்த செயலைக் குறிக்கும் imperfect வடிவத்தையும், σύν- என்பதிலுள்ள கூட்டுச் செயலின் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: அவனுடைய செயல்களோடு
  rationale: συνεργέω வினையோடு வரும் உடனிணைப்பை ‘-ஓடு’ இயல்பாகக் காட்டுகிறது. ‘செயல்கள்’ என்பது இங்கு மனிதன் செய்தவற்றைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐκ τῶν ἔργων
  choice: அந்தச் செயல்களால்
  rationale: ἐκ இச்சூழலில் மூலம் அல்லது சாதனத்தைக் குறிக்கிறது; ‘-ஆல்’ அதனை இயல்பாக வெளிப்படுத்துகிறது. ‘அந்த’ என்பது முன் குறிப்பிடப்பட்ட ஆபிரகாமின் செயல்களையே சுட்டுகிறது.
- source_word: ἐτελειώθη
  choice: நிறைவுபெற்றது
  rationale: τελειόω என்பதன் இலக்கு, முழுமை அல்லது முதிர்ச்சி அடைதல் என்ற கருத்தையும் அதன் passive வடிவத்தையும் சுருக்கமாகப் பாதுகாக்கிறது; ‘பரிபூரணமாக்கப்பட்டது’ என்பதால் எழக்கூடிய குறையற்ற தன்மை பற்றிய தேவையற்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: விசுவாசத்துக்கும் செயல்களுக்கும் இடையிலான உறவு
  choice: விசுவாசம் செயல்களோடு இணைந்து செயல்பட்டது என்றும், செயல்களால் நிறைவுபெற்றது என்றும் மூலத்தின் இரு கூற்றுகளையும் நேரடியாகப் பாதுகாத்தல்
  alternative: செயல்கள் மனிதர்களுக்கு முன் விசுவாசத்தை வெறுமனே நிரூபித்தன என்று விளக்குதல்; அல்லது விசுவாசமும் செயல்களும் இரட்சிப்புக்கான தனித்தனி காரணங்கள் என்று விளக்குதல்
  rationale: கிரேக்கம் கூட்டுச் செயலையும் நிறைவையும் கூறுகிறது; ஆனால் நியாயப்படுத்துதல் குறித்த முழுமையான கோட்பாட்டு விளக்கத்தை இவ்வசனத்திலேயே தரவில்லை. எனவே மொழிபெயர்ப்பு எந்த ஒரு சமயப்பிரிவின் விளக்கத்தையும் உட்புகுத்தவில்லை.
- issue: πίστις என்ற சொல்லின் நுணுக்கம்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; விசுவாசத்தன்மை
  rationale: இங்கு ஆபிரகாமின் நம்பும் மறுமொழியே விவாதத்தின் மையமாக உள்ளது. ‘விசுவாசம்’ அந்தப் பொருளை வழக்கமான இறையியல் சொல்லாட்சியுடன் தருகிறது; மாற்றுப் பொருளைத் தேர்ந்தெடுத்து விவாதத்தை முன்கூட்டியே தீர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இணைந்து செயல்பட்டது’ என்பது மூலத்தின் கூட்டுச் செயல் கருத்தை வெளிப்படையாக வைத்திருக்கிறது; ‘நிறைவுபெற்றது’ என்பது இயல்பாகவும் இறையியல் முடிவைத் திணிக்காமலும் உள்ளது. மூலத்தில் ஒரே πίστις இருமுறை வருவதால் தமிழிலும் ‘விசுவாசம்’ இருமுறை வைக்கப்பட்டுள்ளது.
