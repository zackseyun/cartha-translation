  text: οὐκ αὐτοὶ βλασφημοῦσιν τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: ta
  text: அவர்களே உங்கள்மேல் சூட்டப்பட்ட அந்த மாண்புமிக்க பெயரைத் தூற்றுகிறார்கள் அல்லவா?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நல்ல பெயரை’ அல்லது ‘அந்த மதிப்புக்குரிய பெயரை.’
    reason: lexical_alternative
  - marker: b
    text: மாற்றாக, ‘உங்கள்மேல் அழைக்கப்பட்ட [பெயர்]’ என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்றொடர் விசுவாசிகள் எந்தப் பெயரால் அடையாளம் காணப்படுகிறார்களோ அதைக் குறிக்கலாம்; உடன்படிக்கை அல்லது திருமுழுக்குடன் தொடர்புடைய மொழியை எதிரொலிக்கவும் கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: அவர்களே அல்லவா?
  rationale: οὐκ உடன் வரும் வலியுறுத்தலான αὐτοὶ, ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவாகவும் முன்பு குறிப்பிடப்பட்டவர்களையே வலியுறுத்துவதாகவும் உள்ளது. ‘அவர்களே அல்லவா?’ என்பது இதை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: βλασφημοῦσιν
  choice: தூற்றுகிறவர்கள்
  rationale: βλασφημέω என்பது அவதூறாக அல்லது இழிவாகப் பேசுவதைக் குறிக்கலாம்; இங்கு மதச் சிறப்புடைய பெயர் பொருளாக இருப்பதால், ‘தூற்று’ அதன் அவமதிக்கும் வலிமையைக் காக்கிறது.
- source_word: τὸ καλὸν ὄνομα
  choice: அந்த நன்மதிப்புக்குரிய பெயர்
  rationale: καλός இங்கு மதிப்புக்குரிய, மாண்புடைய, சிறந்த என்ற பொருளைக் கொண்டுள்ளது. ‘நல்ல பெயர்’ தமிழில் பெரும்பாலும் நற்பெயர் அல்லது புகழ் எனப் புரியக்கூடும்; ‘நன்மதிப்புக்குரிய பெயர்’ அந்தப் பெயருக்குரிய மாண்பைத் தெளிவாகக் காட்டுகிறது, ஆனால் அதன் உரியவர் யார் என்பதைத் தீர்மானித்து விடவில்லை.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: உங்கள்மேல் சூட்டப்பட்ட
  rationale: ἐπικαλέω + ἐπί என்ற அமைப்பு ஒருவர்மேல் ஒரு பெயர் அழைக்கப்படுதல் அல்லது சூட்டப்படுதல் என்ற அடையாளப்படுத்தும் சொற்றொடராகும். ‘உங்கள்மேல் சூட்டப்பட்ட’ என்பது தமிழில் இயல்பாக இருந்து, பெயர் அவர்களோடு இணைக்கப்பட்டதைக் காட்டுகிறது; ‘உங்கள்மேல் அழைக்கப்பட்ட’ என்ற நேரடியான வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘நன்மதிப்புக்குரிய பெயர்’ யாரைக் குறிக்கிறது?
  choice: விசுவாசிகளோடு இணைக்கப்பட்ட மாண்புடைய பெயர் என்ற பரந்த குறிப்பை அப்படியே வைத்தல்; சூழலில் அது இயேசு/ஆண்டவரின் பெயராக இருப்பதற்குச் சாத்தியம் அதிகம்.
  alternative: ‘கிறிஸ்துவின் பெயர்’ அல்லது ‘இயேசுவின் பெயர்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது கடவுளின் பெயர்/கிறிஸ்தவ அடையாளம் என்று விரிவாக எடுத்தல்.
  rationale: கிரேக்க வசனம் இங்கு இயேசுவை வெளிப்படையாகப் பெயரிடவில்லை; ஆயினும் யாக்கோபு 2:1-இல் வரும் ஆண்டவர் இயேசு கிறிஸ்துவைப் பற்றிய குறிப்பு இதற்கு வலுவான சூழலை அளிக்கிறது. ஆகவே முதன்மை உரை சாத்தியமான கிறிஸ்துவியல் குறிப்பை மறைக்காமலும், அதைத் தீர்மானமாகச் சேர்க்காமலும் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமத்துக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. வினாவின் வலியுறுத்தல் இறுதியில் ‘அவர்களே அல்லவா?’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. ‘பெயர்’ என்பதன் குறிப்பை முதன்மை உரையில் திட்டவட்டமாகத் தீர்மானிக்காமல் மூலத்தின் இறையியல் இடைவெளி காக்கப்பட்டுள்ளது.
