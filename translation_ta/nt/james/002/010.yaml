  source_fidelity: மூலக் கிரேக்கத்தின் பொதுவான நிபந்தனை (ὅστις), முழுச் சட்டத்தையும் கடைப்பிடித்தல், ஒரு விஷயத்தில் உருவகமாக ‘இடறுதல்,’ மற்றும் அதன் விளைவாக முழுச் சட்டத்தைப் பொறுத்த குற்றப்பொறுப்புக்கு ஆளாதல் ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. ‘முழுச் சட்டத்திற்கும் குற்றவாளியாகிவிட்டான்’ என்பது πάντων ἔνοχος என்பதன் சட்ட-ஒழுக்கப் பொருளைத் தருகிறது; ஒவ்வொரு கட்டளையையும் தனித்தனியாக மீறியதாக அதீதமாகக் கூறவில்லை.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘சட்டம் முழுவதையும் கடைப்பிடித்தாலும், ஒரே ஒரு காரியத்தில் இடறினால்’ என்ற எதிர்மறை நிபந்தனை அமைப்பு இயல்பானது. ‘ஒருவன்’ இங்கு வழக்கமான பொதுமைச் சொல்லாகச் செயல்படுகிறது.
  terminology: ‘சட்டம்,’ ‘கடைப்பிடித்தல்,’ ‘இடறுதல்,’ மற்றும் ‘குற்றவாளி’ ஆகியவை சூழலுக்கு ஏற்ற, வாசிக்க எளிய சொற்கள். ‘இடறுதல்’ மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் ஒழுக்கப் பொருளைத் தெளிவுபடுத்துகிறது. இரண்டாம் அடிக்குறிப்பு ‘முழுவதையும் பொறுத்தவரை’ என்ற பொறுப்பின் வரம்பைச் சரியாக விளக்குகிறது.
