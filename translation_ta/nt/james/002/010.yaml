source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: ta
  text: ஏனெனில், ஒருவன் சட்டம் முழுவதையும் கடைப்பிடித்தாலும், ஒரே ஒரு காரியத்தில் இடறினால், அவன் முழுச் சட்டத்திற்கும் குற்றவாளியாகிவிட்டான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே ஒரு காரியத்தில் தவறினால்’ அல்லது ‘அதன் ஒரு பகுதியை மீறினால்.’ கிரேக்க மொழியில் ‘ஒன்றில் இடறினால்’ என்று உள்ளது; இது ஒழுக்கத் தவறுக்கான ஓர் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முழுச் சட்டத்திற்கும் பொறுப்பாளியாகிவிட்டான்.’ சட்டத்தின் ஒரு பகுதியை மீறுவது, முழுச் சட்டத்தையும் பொறுத்தவரை ஒருவரைக் கணக்குக் கொடுக்க வேண்டியவராக்குகிறது என்பதே இச்சொற்றொடரின் பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: ஒருவன்
  rationale: பொதுவான நிபந்தனையை அறிமுகப்படுத்தும் வரையறையற்ற சுட்டுப்பெயர். பாலினத்தை வலியுறுத்தாமல், ‘யாராயிருந்தாலும்’ என்ற பொதுப்பொருளை இயல்பான தமிழ் நிபந்தனை வாக்கியத்தில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ இணைக்கிறது.
- source_word: ὅλον τὸν νόμον
  choice: சட்டம் முழுவதையும்
  rationale: ὅλον குறிப்பிடும் முழுமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘நியாயப்பிரமாணம்’ போன்ற பழைய வழக்கைத் தவிர்க்கிறது.
- source_word: τηρήσῃ
  choice: கடைப்பிடித்தாலும்
  rationale: கட்டளைகளையோ சட்டத்தையோ பின்பற்றி நடப்பதைக் குறிக்கும் τηρέω என்பதன் பொருளைத் தருகிறது; δὲ குறிக்கும் முரண்பாட்டையும் தமிழ் வாக்கிய அமைப்பில் இணைக்கிறது.
- source_word: πταίσῃ
  choice: இடறினால்
  rationale: πταίω என்பதிலுள்ள ‘இடறுதல்’ உருவகத்தைப் பாதுகாத்து, சூழலில் ஒழுக்கத் தவறைக் குறிக்கிறது.
- source_word: ἐν ἑνί
  choice: ஒரே ஒரு காரியத்தில்
  rationale: சட்டத்தின் ஒரு குறிப்பிட்ட விஷயத்தில் அல்லது அம்சத்தில் தவறுவதைத் தெளிவாகக் குறிக்கிறது; கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாததால் பொதுவான ‘காரியம்’ பயன்படுத்தப்படுகிறது.
- source_word: γέγονεν
  choice: ஆகிவிட்டான்
  rationale: நிகழ்ந்த தவறினால் உருவாகி நீடிக்கும் விளைவு நிலையை கிரேக்க நிறைவுக் காலத்திற்கேற்ப வெளிப்படுத்துகிறது.
- source_word: πάντων ἔνοχος
  choice: முழுச் சட்டத்திற்கும் குற்றவாளி
  rationale: சட்டத்தின் முழுமையோடு தொடர்புடைய குற்றப்பொறுப்பைத் தெளிவாக்குகிறது; ஒவ்வொரு கட்டளையையும் தனித்தனியாக மீறியதாகத் தேவையின்றி பொருள் விரிவுபடுத்தவில்லை.
theological_decisions:
- issue: ஒரு கட்டளையை மீறுவதால் முழுச் சட்டத்துடனான குற்றப்பொறுப்பு
  choice: ஒரு காரியத்தில் இடறுகிறவன் முழுச் சட்டத்திற்கும் குற்றவாளியாகிறான் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஒவ்வொரு கட்டளையையும் தனித்தனியாக மீறியதற்கு இணையான குற்றம் செய்தவன் என்று பொருள் கொள்ளுதல்.
  rationale: πάντων ἔνοχος என்பது முழுவதையும் பொறுத்தவரை குற்றப்பொறுப்புடையவன் என்பதைக் கூறுகிறது; எல்லாப் பாவங்களும் தீவிரத்தில் சமம் என்றோ, ஒவ்வொரு கட்டளையும் உண்மையில் மீறப்பட்டது என்றோ உரை வெளிப்படையாகக் கூறுவதில்லை. அந்த இறையியல் அழுத்தமும் வரம்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக இயல்பான ‘சட்டம்’ பயன்படுத்தப்பட்டது. ‘இடறுதல்’ என்ற மூல உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் ஒழுக்கப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
