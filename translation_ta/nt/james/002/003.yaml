source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: ta
  text: பளபளப்பான ஆடை[a] அணிந்திருப்பவனிடம் நீங்கள் தனிக் கவனம் செலுத்தி, “நீ இங்கே நல்ல இடத்தில் உட்கார்” என்றும், ஏழை மனிதனிடம், “நீ நில்; அல்லது அங்கே[b] என் கால்மனைக்குக் கீழே உட்கார்” என்றும் சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறப்பான ஆடை” அல்லது “பகட்டான ஆடை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “அல்லது அங்கே உட்கார்” என்ற சொற்றொடர் இல்லை; அச்சிடப்பட்ட கிரேக்க உரையில் அது உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: தனிக் கவனம் செலுத்தி
  rationale: இங்கு இச்சொல் வெறுமனே பார்ப்பதைக் குறிக்காமல், ஒருவரைக் குறிப்பாகக் கவனிப்பதைக் குறிக்கிறது. சூழலில் உள்ள பாரபட்சத்தை வெளிப்படுத்தும் அதே நேரத்தில், ‘பட்சபாதம் காட்டி’ என்று விளக்கத்தை நேரடியாக உரைக்குள் சேர்ப்பதை இது தவிர்க்கிறது.
- source_word: φοροῦντα
  choice: அணிந்திருப்பவனிடம்
  rationale: ஆடையை அணிந்திருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: பளபளப்பான ஆடை
  rationale: λαμπρός என்பதன் ஒளிரும் அல்லது கண்கவரும் தன்மையைப் பாதுகாக்கிறது; சூழலில் அது சிறப்பான, விலையுயர்ந்த ஆடையையும் உணர்த்தலாம்.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: நீ இங்கே நல்ல இடத்தில் உட்கார்
  rationale: கட்டளை வடிவத்தையும், அந்த மனிதனுக்குக் கொடுக்கப்படும் சாதகமான இருக்கையையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τῷ πτωχῷ
  choice: ஏழை மனிதனிடம்
  rationale: கட்டுரையுடன் வரும் ஆண்பால் ஒருமை அடைமொழி, காட்சியிலுள்ள குறிப்பிட்ட ஏழை ஆணைக் குறிக்கிறது.
- source_word: στῆθι
  choice: நீ நில்
  rationale: ἵστημι என்பதன் எளிய கட்டளைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἢ κάθου ἐκεῖ
  choice: அல்லது அங்கே உட்கார்
  rationale: மாற்றுக் கட்டளையையும் ἐκεῖ என்பதிலுள்ள இடைவிலக்கத்தையும் பாதுகாக்கிறது.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: என் கால்மணைக்குக் கீழே
  rationale: ὑπό என்பதன் ‘கீழே’ என்ற நேரடிப் பொருளையும், ஏழை மனிதனுக்கு அளிக்கப்படும் இழிவான இடத்தையும் தணிக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: சமூகப் பாரபட்சத்தைக் குறிக்கும் மொழி
  choice: செல்வந்தனுக்குக் கொடுக்கப்படும் சிறப்பிடத்தையும் ஏழைக்குக் கொடுக்கப்படும் இழிவான இடத்தையும் செயல்கள் மற்றும் நேரடிப் பேச்சின் வழியே காட்டுதல்
  alternative: முதன்மை உரையிலேயே ‘பட்சபாதம் காட்டி’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சூழல் பாரபட்சத்தைக் கண்டிக்கிறது; ஆனால் இந்த வசனம் அந்தப் பாரபட்சமான நடத்தையை நிகழ்வாக விவரிக்கிறது. ஆகவே இறையியல் முடிவை விளக்கச் சொல்லாக முன்கூட்டியே சேர்க்காமல், மூலத்தின் காட்சியைப் பாதுகாக்கிறது.
- issue: πτωχῷ என்பதன் பாலின வெளிப்பாடு
  choice: ஏழை மனிதன்
  alternative: ஏழை நபர்
  rationale: இங்கு கிரேக்க வடிவம் ஆண்பால் ஒருமையாக இருந்து, காட்சியிலுள்ள குறிப்பிட்ட ஆண் வருகையாளரைக் குறிக்கிறது; எனவே பாலினத்தைப் பொதுமைப்படுத்தவில்லை.
- issue: நேரடிப் பேச்சில் மரியாதை நிலை
  choice: இருவரிடமும் ‘நீ’ என்ற ஒருமை வடிவத்தைப் பயன்படுத்துதல்
  alternative: செல்வந்தனிடம் ‘நீங்கள்’ என்றும் ஏழையிடம் ‘நீ’ என்றும் வேறுபடுத்துதல்
  rationale: கிரேக்கத்தில் இருவரிடமும் ஒருமை Σὺ பயன்படுத்தப்படுகிறது. தமிழில் மரியாதைப் பெயர்ச்சொற்களின் வேறுபாட்டைச் சேர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத சமூக மொழிநிலையை இறக்குமதி செய்யும்; இடத்தின் வேறுபாடே பாரபட்சத்தைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய கூற்றின் நிபந்தனைத் தொடராக இருப்பதால் இறுதியில் ‘சொன்னால்’ என முடிக்கப்பட்டுள்ளது. ‘கால்மணை’ என்பது ὑποπόδιον என்பதற்கான சுருக்கமான, இயல்பான இணைச்சொல்; ‘கீழே’ என்ற திட்டமிட்ட சங்கடமான உருவகம் தணிக்கப்படவில்லை.
