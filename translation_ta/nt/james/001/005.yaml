id: JAS.1.5
reference: James 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: ta
  text: ஆனால், உங்களில் யாருக்காவது ஞானம் குறைவாக இருந்தால், எல்லாருக்கும் தாராளமாகக் கொடுத்து[a], குறைகூறாத கடவுளிடம் அவர் கேட்கட்டும்; அப்போது அது அவருக்குக் கொடுக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எளிமையாக” அல்லது “கபடமின்றி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: ஆனால், ... இருந்தால்
  rationale: δέ முந்தைய கருத்திலிருந்து மென்மையான தொடர்ச்சியையோ வேறுபாட்டையோ குறிக்கிறது; ‘ஆனால்’ அதன் இணைப்புச் சக்தியை இயல்பான தமிழில் காக்கிறது.
- source_word: τις ὑμῶν
  choice: உங்களில் யாருக்காவது
  rationale: τις என்பதும் பகுதிப்பொருள் மரபுத்தொடரான ὑμῶν என்பதும் சேர்ந்து சபையாரை நேரடியாக நோக்கும் ‘உங்களில் யாருக்காவது’ என்ற இயல்பான பொருளைத் தருகின்றன.
- source_word: λείπεται σοφίας
  choice: ஞானம் குறைவாக இருந்தால்
  rationale: λείπεται இங்கு ஒருவருக்கு ஒன்று போதாமலிருப்பதை அல்லது தேவைப்படுவதைச் சுட்டுகிறது. ‘ஞானம் குறைவாக’ என்பது கருத்தைத் தெளிவாகக் கூறுகிறது; ஞானத்தின் பொருளைச் சோதனைகளைத் தாங்குவதற்கான நடைமுறை ஞானம் என்று மொழிபெயர்ப்பிலேயே குறுக்கவில்லை.
- source_word: αἰτείτω παρὰ ... θεοῦ
  choice: கடவுளிடம் அவர் கேட்கட்டும்
  rationale: மூன்றாம் நபர் நிகழ்காலக் கட்டளையை ‘கேட்கட்டும்’ நேரடியாகக் காட்டுகிறது. παρά உடன் வரும் கேட்பதற்கான மூலத்தைத் தமிழில் இயல்பாக ‘கடவுளிடம்’ என வழங்குகிறது.
- source_word: πᾶσιν
  choice: எல்லாருக்கும்
  rationale: πᾶσιν என்பதன் பரந்த, வரையறுக்கப்படாத அளவைப் பாதுகாக்கிறது.
- source_word: ἁπλῶς
  choice: தாராளமாக
  rationale: கொடுப்பதைப் பற்றிய இச்சூழலில் ἁπλῶς என்பது தயக்கமின்றி அல்லது குறைவின்றித் தாராளமாகக் கொடுப்பதை மிக இயல்பாகக் குறிக்கிறது. சொல்லின் ‘எளிமையாக/கபடமின்றி’ என்ற அடிப்படை நிழற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: μὴ ὀνειδίζοντος
  choice: குறைகூறாத
  rationale: ὀνειδίζω என்பது பழித்தல், இகழ்தல், குற்றம் சுமத்துதல் ஆகிய பொருள்களைக் கொண்டது. விண்ணப்பிப்பவரைக் கடவுள் குறைகூறி அவமானப்படுத்துவதில்லை என்ற கருத்தை ‘குறைகூறாத’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δοθήσεται αὐτῷ
  choice: அப்போது அது அவருக்குக் கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் வாக்குறுதியை நேரடியாகக் காட்டுகிறது; ‘அது’ என்பது முன் குறிப்பிடப்பட்ட ஞானத்தைக் குறிக்கிறது.
theological_decisions:
- issue: தனிநபரைக் குறிக்கும் ஒருமை வடிவங்கள்
  choice: அவர் கேட்கட்டும் ... அவருக்குக் கொடுக்கப்படும்
  alternative: அந்த நபர் கேட்க வேண்டும் ... அந்த நபருக்குக் கொடுக்கப்படும்
  rationale: கிரேக்கத்தில் ஒருமை வடிவங்கள் பொதுவாக எந்த நபரையும் பிரதிநிதித்துவப்படுத்துகின்றன. தமிழின் ‘அவர்’ பாலைக் கட்டாயமாகக் குறிக்காமல் மரியாதையுடனும் இயல்பாகவும் அந்த ஒருமையைப் பாதுகாக்கிறது.
- issue: ἁπλῶς என்ற சொல்லில் கடவுளுடைய கொடையின் தன்மை
  choice: தாராளமாக
  alternative: எளிமையாக; கபடமின்றி
  rationale: சூழலில் கடவுள் ஞானத்தைக் குறைவின்றிக் கொடுப்பதே முதன்மையான கருத்தாகத் தெரிகிறது. எனினும் சொல்லின் நேர்மை அல்லது இருமனமின்மை சார்ந்த நிழற்பொருளை முற்றிலும் மறைக்காமல் அடிக்குறிப்பில் தருவது மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, தெளிவான நடையைப் பயன்படுத்துகிறது. ‘ஞானம்,’ ‘கடவுள்’ போன்ற பரவலாகப் புரியும் சொற்கள் வைக்கப்பட்டுள்ளன. கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைத் தமிழில் இயல்பான ‘அவர்’ மூலம் காக்கிறது.
