source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: ta
  text: ஏமாற்றப்படாதீர்கள், என் அன்புக்குரிய சகோதரர்களே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே.’ ‘சகோதரர்கள்’ என்பதற்கான கிரேக்கச் சொல், பெண்களையும் உள்ளடக்கிய சக விசுவாசிகள் அனைவரையும் கூட்டாகக் குறிப்பிடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: -ஆதீர்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவத்துடன் வரும் μή தடையைக் குறிக்கிறது. தமிழில் எதிர்மறைக் கட்டளை விகுதியான ‘-ஆதீர்கள்’ இதை இயல்பாக வெளிப்படுத்துகிறது; சூழல் உறுதிப்படுத்தாத தொடர்ச்சியையோ உடனடி நிறுத்தத்தையோ கூடுதலாகச் சேர்ப்பதில்லை.
- source_word: πλανᾶσθε
  choice: ஏமாந்துவிடாதீர்கள்
  rationale: இங்கு πλανάω என்பதன் இடை/செயப்பாட்டு வடிவம் தவறான நம்பிக்கைக்குள் வழிநடத்தப்படுவதையோ ஏமாற்றப்படுவதையோ குறிக்கிறது. ‘ஏமாந்துவிடாதீர்கள்’ என்பது நவீனத் தமிழில் இயல்பான எச்சரிக்கையாக இருந்து, ‘தவறான எண்ணத்திற்கு இடங்கொடுக்காதீர்கள்’ என்று விளக்கிச் சொல்லாமல் மூலத்தின் சுருக்கத்தையும் பொருளையும் காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: அழைப்புவேற்றுமையில் உள்ள ஆண்பால் பன்மையான ἀδελφοί என்பதன் நேரடிப் பொருளை ‘சகோதரர்களே’ காக்கிறது. இது கலந்த விசுவாசிகள் சமூகத்தையும் கூட்டாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: μου
  choice: என்
  rationale: உடைமைப் பெயர்ச்சொல்லான μου, பேசுபவரின் நெருக்கத்தையும் மேய்ப்பருக்குரிய பாசத்தையும் நேரடியாக வெளிப்படுத்துவதால் ‘என்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரிய
  rationale: ἀγαπητοί என்பது பாசமிக்க அழைப்பாகும். ‘அன்புக்குரிய’ என்பது நவீன, கண்ணியமான தமிழில் அதன் அன்பார்ந்த தொனியை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: கிறிஸ்தவச் சமூகத்திற்கான பாலினம் குறித்த அழைப்பு
  choice: முதன்மை உரையில் ἀδελφοί என்பதை ‘சகோதரர்களே’ என்று மொழிபெயர்த்து, அதன் உள்ளடக்கமான கூட்டுப்பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘சகோதர சகோதரிகளே’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க வடிவம் இலக்கணப்படி ஆண்பால் பன்மையாக இருந்தாலும், கலந்த விசுவாசிகள் சமூகத்தைப் பிரதிநிதித்துவமாக அழைக்கக்கூடும். முதன்மை உரை மூல வடிவத்தைக் காக்கிறது; அடிக்குறிப்பு பெண்களும் இதில் உள்ளடங்கலாம் என்பதைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான எச்சரிக்கையும் பாசமிக்க அழைப்பும் காக்கப்பட்டுள்ளன. ‘ஏமாந்துவிடாதீர்கள்’ பொதுவாசகர்களுக்கு இயல்பாகவும், ‘அன்புக்குரிய சகோதரர்களே’ கண்ணியமான திருவிவிலிய நடைக்கு ஏற்றதாகவும் உள்ளது.
