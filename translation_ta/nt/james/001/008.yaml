  terminology: Key terms are handled consistently and without undue theological narrowing. ‘இருமனமுள்ள’ naturally conveys divided inner allegiance rather than merely intellectual indecision, and ‘நிலையற்றவன்’ expresses unreliability/inconsistency without importing a moralistic sense. The footnote’s inclusive alternative is well phrased and correctly anchored.
