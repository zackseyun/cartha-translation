  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: ta
  text: இருமனமுள்ள மனிதன்[a], தன் வழிகளிலெல்லாம் நிலையற்றவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இருமனமுள்ள ஒருவர், தம் வழிகளிலெல்லாம் நிலையற்றவர்.’ கிரேக்கத்தில் ஆண்பால் ஒருமை பயன்படுத்தப்பட்டிருந்தாலும், அது இங்கு பொதுப்பொருளில் வருவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: மனிதன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் இருந்தாலும், முந்தைய வசனத்தில் விண்ணப்பிக்கிற எவரையும் பொதுவாகக் குறிக்கிறது. ‘மனிதன்’ என்பது மூலத்தின் இலக்கண வடிவத்தையும் அதன் பிரதிநிதித்துவப் பொருளையும் தக்கவைக்கிறது.
- source_word: δίψυχος
  choice: இருமனமுள்ள
  rationale: சொல்லளவில் ‘இரண்டு உள்ளங்கள்/ஆத்துமாக்கள் கொண்ட’ என்ற உருவகத்தைச் சுட்டினாலும், உள்ளார்ந்த பிளவையும் தளம்பும் பற்றுறுதியையும் இயல்பான தமிழில் ‘இருமனமுள்ள’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀκατάστατος
  choice: நிலையற்றவன்
  rationale: இச்சூழலில் உறுதியும் தொடர்ச்சியும் இல்லாத தன்மையை இது காட்டுகிறது. ‘அமைதியற்றவன்’ என்பது உணர்ச்சிக் கலக்கத்தை அதிகமாகச் சுட்டக்கூடும்; ‘ஒழுங்கற்றவன்’ என்பது மூலத்தில் இல்லாத ஒழுக்கத் தீர்ப்பை வலுப்படுத்தக்கூடும்.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: தன் வழிகளிலெல்லாம்
  rationale: ‘வழிகள்’ என்பது வாழ்க்கையின் போக்குகளையும் நடத்தையின் முழுப் பரப்பையும் குறிக்கும் கிரேக்க உருவகத்தைத் தக்கவைக்கிறது; ‘எல்லா நடத்தையிலும்’ என்பது பொருளை விளக்கினாலும் உருவகத்தை இழக்கிறது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை
  choice: முதன்மை உரையில் ‘மனிதன் … நிலையற்றவன்’ என்று ஆண்பால் ஒருமையைத் தக்கவைத்தல்
  alternative: ‘இருமனமுள்ள ஒருவர், தம் வழிகளிலெல்லாம் நிலையற்றவர்’
  rationale: மூலம் ஆண்பால் ஒருமையைப் பயன்படுத்தினாலும் அதன் நோக்கம் ஆண்களுக்கு மட்டும் வரையறுக்கப்பட்டதல்ல; முந்தைய வசனத்தில் கூறப்பட்ட விண்ணப்பிப்பவர் எவராயினும் அவரைப் பிரதிநிதித்துவமாகக் குறிக்கிறது. முதன்மை உரை மூலத்தின் வடிவத்தைத் தக்கவைத்து, அடிக்குறிப்பு அதன் பொதுப்பொருளைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையான வினைச்சொல் இல்லாததால் தமிழிலும் பெயர்ப் பயனிலை அமைப்பு தக்கவைக்கப்பட்டுள்ளது. ‘இருமனமுள்ள’ மற்றும் ‘வழிகள்’ என்ற சொற்கள் யாக்கோபின் உள்ளார்ந்த பிளவு மற்றும் வாழ்க்கைப் போக்கு ஆகிய உருவகங்களை இயல்பாகப் பாதுகாக்கின்றன.
