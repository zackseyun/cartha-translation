source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: ta
  text: ஏனெனில், ஒருவர் வார்த்தையைக் கேட்பவராக இருந்து, அதைச் செய்பவராக இல்லாவிட்டால், அவர் கண்ணாடியில் தனக்குப் பிறப்பிலிருந்தே உள்ள முகத்தைக்[a] கவனமாகப் பார்க்கும் ஒரு மனிதனைப் போன்றவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘தன் பிறப்பின் முகம்’; அதாவது, தான் பிறந்தபோது பெற்ற இயற்கையான முகம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: வார்த்தையைக் கேட்கிறவர்
  rationale: λόγος என்பதற்கு நேரடியான ‘வார்த்தை’ என்பதையும், ἀκροατής–ποιητής என்ற கேட்டல்–செய்தல் எதிரிணையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ποιητής
  choice: அதன்படி செய்கிறவர்
  rationale: தமிழில் ‘செய்பவர்’ மட்டும் என்றால் எதைச் செய்கிறார் என்பது தெளிவில்லாமல் போகலாம்; ‘அதன்படி’ என்பது வார்த்தையைச் செயல்படுத்தும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔοικεν
  choice: போன்றவர்
  rationale: நிகழ்கால ஒப்புமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνδρὶ
  choice: ஒரு மனிதன்
  rationale: மூலத்தில் உள்ள குறிப்பாக ஆண்பாலைக் குறிக்கும் ἀνήρ என்பதைக் காக்கிறது; ஒப்புமையின் பொதுப்பயன்பாடு சூழலிலிருந்து விளங்குகிறது.
- source_word: κατανοοῦντι
  choice: கவனமாகப் பார்க்கும்
  rationale: வெறுமனே பார்ப்பதைவிட உற்றுக் கவனிக்கும் பொருளைத் தரும் κατανοέω வின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: தான் பிறந்தபோது பெற்ற முகம்
  rationale: ‘அவனுடைய பிறப்பின் முகம்’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் இயல்பற்றது; பிறப்பிலிருந்து உள்ள இயற்கையான முகம் என்ற பொருளைச் சொல்லி, மூலத்தின் பிறப்பு சார்ந்த உருவகத்தையும் காக்கிறது.
- source_word: ἐν ἐσόπτρῳ
  choice: கண்ணாடியில்
  rationale: ἔσοπτρον என்பதற்கான தெளிவான, இன்றைய பொதுத் தமிழ் சொல்.
theological_decisions:
- issue: ἀνδρὶ என்பதில் உள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: ஒரு மனிதன்
  alternative: ஒரு நபர்
  rationale: மூலம் பொதுவான மனிதர் என்ற சொல்லுக்குப் பதிலாக ஆண்பாலைக் குறிப்பாகக் காட்டும் ἀνήρ என்பதைப் பயன்படுத்துவதால், அந்த வடிவம் மொழிபெயர்ப்பில் காக்கப்படுகிறது.
- issue: λόγος என்பதன் குறிப்பு
  choice: வார்த்தை
  alternative: செய்தி
  rationale: இந்த வசனத்தில் அது தேவனுடைய அறிவிக்கப்பட்ட வார்த்தையை இயல்பாகக் குறித்தாலும், மொழிபெயர்ப்பு அந்த விளக்கத்தை உரைக்குள் வெளிப்படையாகச் சேர்க்காமல் λόγος என்பதன் பரந்த சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட நடை. கேட்டல்–செய்தல் எதிரிணை தெளிவாக வைக்கப்பட்டுள்ளது; பிறப்பைச் சார்ந்த கிரேக்கச் சொற்றொடரின் தனித்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
