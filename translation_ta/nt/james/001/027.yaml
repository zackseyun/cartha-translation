source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: ta
  text: 'தந்தையாகிய கடவுளின் பார்வையில் தூயதும் மாசற்றதுமான சமய வாழ்வு இதுவே: துன்பத்தில் இருக்கும் அனாதைப் பிள்ளைகளையும் விதவைகளையும் அக்கறையுடன் கவனித்துக்கொள்வதும்[a], உலகத்தால் கறைபடாமல் தன்னைக் காத்துக்கொள்வதும்[b] ஆகும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துன்பத்தில் இருக்கும் அனாதைப் பிள்ளைகளையும் விதவைகளையும் சென்று பார்ப்பதும்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் அவர்களை நேரில் சென்று பார்ப்பதையும் செயலில் அக்கறை காட்டிப் பராமரிப்பதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘உலகம்’ என்பது கடவுளுக்கு எதிராக இருந்து அறநெறியில் சீர்கெட்ட ஒழுங்கைக் குறிக்கிறது; படைப்புலகத்தையே தீயது என்று குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: சமய வாழ்வு
  rationale: வெறும் நம்பிக்கையையோ நிறுவனச் சமயத்தையோ அல்லாமல், வெளிப்படும் வழிபாடு மற்றும் நடைமுறை இறைப்பற்றை இச்சொல் குறிக்கிறது; தமிழில் ‘சமய வாழ்வு’ அந்த வாழ்வியல் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: தூயதும் மாசற்றதுமான
  rationale: இரு சொற்களின் தூய்மை–தீட்டின்மை இணைப்பையும் அறநெறி மற்றும் வழிபாட்டுச் சார்ந்த நயத்தையும் காக்கிறது.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: தந்தையாகிய கடவுளின் பார்வையில்
  rationale: παρά + இடவேற்றுமை இங்கு கடவுளின் மதிப்பீட்டில் அல்லது முன்னிலையில் என்பதைக் குறிக்கிறது. θεῷ καὶ πατρὶ என்பவற்றை ஒரே நபருக்கான இணை வருணனையாக இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἐπισκέπτεσθαι
  choice: அக்கறையுடன் கவனித்துக்கொள்வது
  rationale: சாதாரணமாகச் சென்று பார்ப்பதைவிட நேரில் அணுகி உதவி செய்து பராமரிக்கும் செயற்பாட்டு அக்கறையைச் சூழல் உணர்த்துகிறது; சொல்லின் ‘சென்று பார்ப்பது’ என்ற நயத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: ὀρφανοὺς
  choice: திக்கற்ற பிள்ளைகள்
  rationale: பெற்றோர் அல்லது பாதுகாப்பை இழந்த சார்பற்ற பிள்ளைகள் என்ற சமூகப் பாதிப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: χήρας
  choice: விதவைகள்
  rationale: நேரடியான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: துன்பத்தில் இருக்கும்
  rationale: θλῖψις குறிக்கும் நெருக்கடி, வேதனை, ஒடுக்கம் ஆகிய தீவிரத்தை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: கறைபடாமல் தன்னைக் காத்துக்கொள்வது
  rationale: அறநெறி மாசு ஒட்டாதபடி விழிப்புடன் தன்னைப் பாதுகாக்கும் உருவகத்தையும் பொதுப்பொருள் கொண்ட தன்மைச் சுட்டையும் காக்கிறது.
- source_word: ἀπὸ τοῦ κόσμου
  choice: உலகத்தால்
  rationale: மூலத்தின் சுருக்கத்தையும் திட்டமிட்ட பொருள் விரிவையும் காக்கிறது; ‘உலகம்’ என்பதைக் படைப்புலகம் முழுவதுமாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: κόσμος என்பதன் அறநெறிச் சார்ந்த பொருள்
  choice: முதன்மை உரையில் ‘உலகம்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘உலகத்தின் சீர்கேடு’ அல்லது ‘கடவுளுக்கு எதிரான உலக ஒழுங்கு’ என்று விரித்துரைத்தல்
  rationale: இங்கு அறநெறி மாசுக்கு மூலமான கடவுளுக்கு எதிரான ஒழுங்கு குறிக்கப்பட்டாலும், அதை முதன்மை உரையிலேயே விரித்துச் சொல்வது மூலத்தைவிட அதிகமாக விளக்கிவிடும்; படைப்பையே தீயதாகக் காட்டும் வாசிப்பை அடிக்குறிப்பு தவிர்க்கிறது.
- issue: ἑαυτόν என்பதன் பொதுவான பயன்பாடு
  choice: ‘தன்னைக்’ என்று பாலினப் பொதுப்பொருளுடன் மொழிபெயர்த்தல்
  alternative: ஆண்பால் மட்டும் குறிக்கும் வடிவைப் பயன்படுத்துதல்
  rationale: கிரேக்க ஒருமை ஆண்பால் இலக்கண வடிவம் இங்கு எல்லாருக்கும் பொருந்தும் அறநெறிக் கோட்பாட்டைத் தெரிவிக்கிறது; தமிழ் இயல்பாகப் பொதுப்பொருளைக் காக்கிறது.
- issue: θρησκεία என்பதன் நோக்கம்
  choice: ‘சமய வாழ்வு’ என்று நடைமுறை இறைப்பற்றை முன்னிறுத்துதல்
  alternative: ‘மதம்’ அல்லது ‘வழிபாடு’
  rationale: இந்த வசனம் பெயரளவிலான சமய அமைப்பை வரையறுப்பதல்ல; இரக்கச் செயலும் தனிப்பட்ட தூய்மையும் வெளிப்படுத்தும் இறைப்பற்றைப் பேசுகிறது. அதேவேளை, அதை உள்ளார்ந்த விசுவாசமாக மட்டும் சுருக்காமல் வெளிப்புற நடைமுறையின் நயமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சமய வாழ்வு’ என்பது θρησκεία-வின் வெளிப்படும் இறைப்பற்று என்ற நயத்தைக் காக்கிறது. இணையான இரண்டு இறுதிச் செயல்களையும் ‘-வதும் … -வதும் ஆகும்’ என்ற அமைப்பு தெளிவாக இணைக்கிறது; எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
