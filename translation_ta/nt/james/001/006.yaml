id: JAS.1.6
reference: James 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: ta
  text: ஆனால், ஒருவர் விசுவாசத்தோடு[a] சிறிதும் சந்தேகப்படாமல் கேட்கட்டும். ஏனெனில், சந்தேகப்படுகிறவர் காற்றினால் அடித்துச் செல்லப்பட்டும் அலைக்கழிக்கப்பட்டும் இருக்கும் கடல் அலையைப் போன்றவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையுடன்.” இங்குள்ள கிரேக்கச் சொற்றொடர், தேவன்மீது நம்பிக்கை வைத்து அவரைச் சார்ந்திருக்கும் பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தும் வலிமையை இயல்பான தமிழில் காக்கிறது; முந்தைய வசனத்தில் தேவனிடத்தில் ஞானம் கேட்பதே சூழல்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வாக்குறுதியிலிருந்து, கேட்க வேண்டிய விதத்துக்குச் செல்லும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐν πίστει
  choice: விசுவாசத்தோடு[a]
  rationale: πίστις என்பதன் வழக்கமான இறையியல் தொடர்ச்சியைப் பேணுகிறது; இச்சூழலில் தேவன்மீது நம்பிக்கை வைத்து சார்ந்திருக்கும் நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μηδὲν διακρινόμενος
  choice: சிறிதும் சந்தேகப்படாதிருக்கட்டும்
  rationale: μηδέν என்பதன் முழுமையான மறுப்பையும், διακρίνομαι என்பதன் இச்சூழலுக்குரிய உளத் தயக்கம் அல்லது சந்தேகம் என்ற பொருளையும் தெளிவான தமிழில் தருகிறது.
- source_word: ὁ γὰρ διακρινόμενος
  choice: ஏனெனில், சந்தேகப்படுகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினையை பொதுவான ஒருவரைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது; காரணத்தைக் குறிக்கும் γάρ என்பதையும் வெளிப்படுத்துகிறது.
- source_word: ἔοικεν κλύδωνι θαλάσσης
  choice: கடல் அலையைப் போன்றவன்
  rationale: ஒப்புமையையும் கடலில் எழும் அலையின் தெளிவான உருவகத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: காற்றால் அடித்துச் செல்லப்பட்டு அலைக்கழிக்கப்படும்
  rationale: இரு செயல்பாடுகளையும் ஒன்றாக்காமல், காற்றின் உந்துதலையும் தொடர்ந்து நிலைகுலையச் செய்யப்படும் நிலையையும் உயிரோட்டமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வேண்டுதலின் சூழலில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்பிக்கையுடன் சார்ந்திருத்தல்
  rationale: முதன்மைப் பொருளாக ‘விசுவாசம்’ இறையியல் தொடர்ச்சியைப் பேணுகிறது. அதேவேளையில், இங்கு தேவன்மீது நம்பிக்கை வைத்து சார்ந்திருப்பது முக்கிய நுட்பமாக இருப்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: διακρίνομαι என்பதன் பொருள்
  choice: சந்தேகப்படுதல்
  alternative: தயங்குதல் / இருமனப்படுதல்
  rationale: இந்த வேண்டுதல் சார்ந்த சூழலிலும் அலை உருவகத்திலும் மன உறுதியின்மையும் சந்தேகமும் முன்னிலையில் உள்ளன; இருப்பினும் சொல்லின் விரிந்த நுட்பத்தை தேவையின்றி ஒரு குறிப்பிட்ட கோட்பாட்டாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘அவன்’ என்பது இங்கு குறிப்பிட்ட ஓர் ஆணை மட்டும் அல்லாமல், கேட்கும் எந்த ஒருவரையும் பொதுவாகக் குறிக்கிறது.
