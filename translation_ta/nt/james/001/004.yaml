source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: ta
  text: நீங்கள் முதிர்ச்சி பெற்றவர்களாகவும் முழுமை உடையவர்களாகவும், எதிலும் குறைவில்லாதவர்களாகவும் இருக்கும்படி, மனவுறுதி தன் நிறைவான செயலைச் செய்யட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் செயலை முழுமையாக நிறைவேற்றட்டும்.” இங்கு “நிறைவான,” “முதிர்ச்சி பெற்ற,” “முழுமை உடைய” என்று மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொற்கள், நோக்கப்பட்ட முடிவை அடைவதையும் எல்லாப் பகுதிகளிலும் முழுமையாக இருப்பதையும் வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: மனவுறுதி
  rationale: சோதனைகளின் கீழ் தளராமல் நிலைத்திருப்பதை இச்சொல் குறிக்கிறது. ‘மனவுறுதி’ என்பது செயலற்ற பொறுமையைவிட உறுதியுடன் தாங்கி நிலைத்திருக்கும் கருத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἔργον τέλειον
  choice: தன் நிறைவான செயல்
  rationale: ἔργον என்பதை ‘செயல்’ என்றும் τέλειον என்பதை நோக்கப்பட்ட முடிவை அடைந்த ‘நிறைவான’ என்றும் நேரடியாகப் பிரதிபலிக்கிறது; அதேவேளையில் தமிழில் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
- source_word: ἐχέτω
  choice: செய்யட்டும்
  rationale: மூன்றாம் நபர் ஏவல் வடிவத்தின் வலிமையைப் பாதுகாக்கிறது. கிரேக்கத்தின் ‘செயலைக் கொண்டிருக்கட்டும்’ என்ற சொற்சொல் அமைப்பு தமிழில் இயல்பற்றதால், செயல் முழுமையடைய அனுமதிக்க வேண்டும் என்ற பொருளை ‘செய்யட்டும்’ தெரிவிக்கிறது.
- source_word: ἵνα ἦτε
  choice: அப்போது ... இருப்பீர்கள்
  rationale: மனவுறுதியின் செயல் கொண்டுவரும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் நோக்கமும் விளைவும் இரண்டும் ஒலிக்கக்கூடிய நுணுக்கத்தை கடுமையாகப் பிரிக்கவில்லை.
- source_word: τέλειοι
  choice: முதிர்ச்சி பெற்றவர்கள்
  rationale: மனிதர்களைக் குறிக்கும்போது நோக்கப்பட்ட முதிர்ச்சியை அடைந்த நிலையை இச்சொல் குறிக்கலாம். பாவமற்ற பரிபூரணத்தைத் திணிக்காமல், வளர்ச்சியின் நிறைவைத் தெரிவிக்கிறது.
- source_word: ὁλόκληροι
  choice: முழுமை உடையவர்கள்
  rationale: ஒவ்வொரு பகுதியிலும் குறையில்லாத முழுமை அல்லது ஒருமைப்பாட்டை எடுத்துரைக்கிறது; τέλειοι என்பதற்குத் தேர்ந்தெடுக்கப்பட்ட ‘முதிர்ச்சி பெற்றவர்கள்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: எதிலும் குறைவுபடாமல்
  rationale: எந்த வகையிலும் பின்தங்கியோ குறைபட்டோ இராத விரிவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: முந்தைய வசனத்தின் கருத்தை எதிர்மறையாக மாற்றாமல் தொடர்ந்து வளர்ப்பதால், ‘ஆனால்’ என்பதைவிட ‘மேலும்’ பொருத்தமானது.
theological_decisions:
- issue: பரிசுத்தமாக்கல் சூழலில் τέλειοι என்பதன் பொருள்
  choice: முதிர்ச்சி பெற்றவர்கள்
  alternative: பரிபூரணமானவர்கள்
  rationale: யாக்கோபு மனவுறுதி உருவாக்கும் நோக்கப்பட்ட முதிர்ச்சியையும் முழுமையையும் விவரிக்கிறார். ‘முதிர்ச்சி பெற்றவர்கள்’ என்பது பாவமற்ற பரிபூரணம் என்ற குறிப்பிட்ட கோட்பாட்டை உரையில் திணிக்காமல் exhortation-இன் வலிமையைப் பாதுகாக்கிறது; அருகிலுள்ள ‘முழுமை உடையவர்கள்’ என்ற சொல்லும் மூலத்தின் முழுமைக் கருத்தைத் தொடர்ந்து வைத்திருக்கிறது.
- issue: ἵνα உட்பிரிவில் நோக்கமா விளைவா
  choice: நோக்கம் மற்றும் விளைவு இரண்டிற்கும் இடமளிக்கும் ‘அப்போது’
  alternative: ‘நீங்கள் ... இருக்கும்படி’ என்ற வெளிப்படையான நோக்க அமைப்பு
  rationale: ἵνα இங்கு நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் சுட்டலாம். இயல்பான தமிழ் தொடரில் ‘அப்போது’ இரண்டையும் முற்றிலும் பிரித்துத் தீர்மானிக்காமல் விளைவைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. ‘மனவுறுதி’ சோதனையில் நிலைத்திருக்கும் செயற்பாட்டைத் தெரிவிக்கிறது; ‘முதிர்ச்சி பெற்றவர்கள்’ மற்றும் ‘முழுமை உடையவர்கள்’ என்ற இணைச்சொற்கள் மூலத்திலுள்ள தொடர்புடையதாயினும் வேறுபட்ட கருத்துகளைப் பாதுகாக்கின்றன.
