  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: ta
  text: செல்வந்தனோ தன் தாழ்வில்[a]—ஏனெனில் அவன் புல்லின் பூவைப்போல்[b] கடந்துபோய்விடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'முந்தைய வசனத்திலிருந்து விடுபட்ட வினையை நிரப்பினால்: “செல்வந்தனோ தன் தாழ்வில் பெருமைபாராட்டட்டும்.”'
    reason: alternative_reading
  - marker: b
    text: “புல்லின் பூ” என்பது கிரேக்க உருவகத்தின் நேரடியான மொழிபெயர்ப்பு; பூக்கும் தாவரம்போல் செல்வந்தனும் விரைவில் கடந்துபோய்விடுவான் என்ற நிலையாமையை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: செல்வந்தனோ
  rationale: பெயரெச்சம் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டிருப்பதால் ‘செல்வந்தன்’ என்று ஒருமை ஆண்பாலில் மொழிபெயர்க்கப்பட்டது. ‘-ஓ’ முந்தைய வசனத்துடனான இணைப்பையும் வேறுபாட்டையும் இயல்பான தமிழில் உணர்த்துகிறது; தனியாக ‘ஆனால்’ சேர்த்து முரண்பாட்டை மிகைப்படுத்தவில்லை.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: தன் தாழ்வில்
  rationale: ταπείνωσις என்பது தாழ்ந்த நிலை, அவமானம், அல்லது தாழ்த்தப்படுதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘தன் தாழ்வில்’ என்பது இவற்றை ஓரளவு திறந்தவாறே வைத்து, தன்னடக்கம் என்ற நற்பண்பாக மட்டும் பொருளைக் குறுக்காமல் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: செல்வந்தனின் தாழ்வைப் பற்றிய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς ἄνθος χόρτου
  choice: புல்லின் பூவைப்போல்
  rationale: கிரேக்க உருவகத்தின் சொல் அமைப்பையும், பூத்திருந்தாலும் விரைவில் வாடிவிடும் தாவரத்தின் நிலையாமையையும் காக்கிறது. மூலத்தில் இல்லாத ‘வயல்’ என்பதைக் கொண்டுவரவில்லை.
- source_word: παρελεύσεται
  choice: கடந்துபோவான்
  rationale: எதிர்கால வினை வடிவத்தையும், செல்வமும் வாழ்வும் நிலைக்காமல் போகும் நிலையாமையையும் காக்கிறது. ‘இறந்துபோவான்’ என்று பொருளை மரணத்திற்கு மட்டும் குறுக்கவில்லை.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து புரிந்துகொள்ள வேண்டிய விடுபட்ட வினை
  choice: மூலத்தில் உள்ளபடியே ‘பெருமைபாராட்டட்டும்’ என்ற வினையை முதன்மை உரையில் சேர்க்காமல், சொற்றொடரின் விடுபட்ட அமைப்பைப் பாதுகாத்தல்.
  alternative: ‘செல்வந்தனோ தன் தாழ்வில் பெருமைபாராட்டட்டும்’ என்று வினையை வெளிப்படையாக நிரப்புதல்.
  rationale: கிரேக்கத்தில் இவ்வசனம் 9ஆம் வசனத்தின் கட்டளை வினையைச் சார்ந்துள்ளது; இவ்வசனத்திலேயே அந்த வினை மீண்டும் எழுதப்படவில்லை. அடிக்குறிப்பு வாசகருக்கு தொடர்பை விளக்குகிறது; முதன்மை உரையோ மூலத்தின் உண்மையான விடுபாட்டைக் காக்கிறது.
- issue: செல்வந்தனின் ‘தாழ்வு’ என்பதன் பொருள்
  choice: செல்வந்தன் தாழ்ந்த நிலைக்கு வருவதையும், அவனுடைய செல்வமும் வாழ்வும் நிலையற்றவை என்பதையும் முன்னிறுத்தும் திறந்த மொழிபெயர்ப்பு.
  alternative: இதனை அவன் விரும்பி ஏற்கும் தன்னடக்கம் என்ற நற்பண்பாக மட்டும் புரிந்துகொள்ளுதல்.
  rationale: ‘புல்லின் பூவைப்போல் கடந்துபோவான்’ என்ற காரணவாக்கியம், செல்வந்தனின் நிலையாமையையும் அவன் தாழ்த்தப்படுவதையும் சுட்டுகிறது. இருப்பினும் எந்த ஒரு முழுமையான கோட்பாட்டு விளக்கத்தையும் உரைக்குள் திணிக்காமல் ‘தாழ்வு’ என்ற பரந்த சொல்லே வைக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘செல்வந்தனோ’ என்பது முந்தைய வசனத்துடனான ஒப்புமை–வேறுபாட்டை இயல்பாகக் காட்டுகிறது. மூலத்தின் வினை விடுபாட்டை கோடு மூலம் வாசிக்கத்தக்கவாறு வைத்துள்ளோம்; விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
