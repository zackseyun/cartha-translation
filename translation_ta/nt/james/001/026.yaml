reference: James 1:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: ta
  text: ஒருவன் தான் மதப்பற்றுள்ளவன் என்று எண்ணிக்கொண்டு[a], தன் நாவுக்குக் கடிவாளமிடாமல்[b] தன் உள்ளத்தை ஏமாற்றிக்கொண்டால், அவனுடைய மதப்பற்று பயனற்றது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மதப்பற்றுள்ளவனாகத் தோன்றிக்கொண்டு.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூலத்தில், விலங்கைக் கட்டுப்படுத்தப் பயன்படுத்தும் கடிவாளத்தின் உருவகத்தோடு ‘தன் நாவுக்குக் கடிவாளமிடாமல்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வீணானது’ அல்லது ‘உதவாதது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: எண்ணிக்கொண்டு
  rationale: இங்கு ஒருவர் தன்னைப் பற்றிச் செய்துகொள்ளும் மதிப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘தோன்றுதல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: θρησκὸς / θρησκεία
  choice: மதப்பற்றுள்ளவன் / மதப்பற்று
  rationale: பெயரடை மற்றும் பெயர்ச்சொல்லுக்கு இடையிலுள்ள கிரேக்கச் சொல் தொடர்பைத் தமிழிலும் காக்கிறது; குறிப்பிட்ட ஒரு சமயப் பிரிவையோ வெறும் அகப் பக்தியையோ இதில் சேர்க்கவில்லை.
- source_word: χαλιναγωγῶν
  choice: கடிவாளமிடாமல்
  rationale: விலங்கைக் கட்டுப்படுத்தும் கடிவாளத்தின் உருவகத்தைப் பாதுகாக்கிறது; யாக்கோபு 3-இல் வரும் நாவைப் பற்றிய உருவகத்துடனான தொடர்பையும் காக்கிறது.
- source_word: γλῶσσαν αὐτοῦ
  choice: தன் நாவுக்கு
  rationale: ‘பேச்சு’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் உடல் உறுப்புச் சித்திரத்தைப் பாதுகாக்கிறது.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: தன் உள்ளத்தை ஏமாற்றிக்கொண்டால்
  rationale: καρδία குறிக்கும் அக மனிதனை இயல்பான நவீன தமிழில் ‘உள்ளம்’ என வழங்குகிறது; இச்சூழலில் தன்னையே ஏமாற்றிக்கொள்ளும் பொருளையும் தெளிவாக்குகிறது.
- source_word: τούτου
  choice: அவனுடைய
  rationale: முன்னர் விவரிக்கப்பட்ட ஒருவனைச் சுட்டும் கிரேக்கச் சுட்டுப்பெயரின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: μάταιος
  choice: பயனற்றது
  rationale: வெறுமை, வீண் தன்மை, நடைமுறை மதிப்பின்மை ஆகிய மதிப்பீட்டு வலிமையைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை
  choice: ஒருவன் … அவனுடைய
  alternative: ஒருவர் … அவருடைய
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பாதுகாக்கிறது; ‘ஒருவன்’ என்பது இங்கு பொதுவாக எந்த மனிதரையும் குறிக்கிறது.
- issue: θρησκός / θρησκεία என்பவற்றின் பொருள்
  choice: மதப்பற்றுள்ளவன் / மதப்பற்று
  alternative: பக்தியுள்ளவன் / பக்தி; சமய ஆசாரமுள்ளவன் / சமய ஆசாரம்
  rationale: வெளிப்படையான சமய அடையாளத்தையும் நடைமுறையையும் யாக்கோபு மதிப்பிடுகிறார். ‘மதப்பற்று’ என்பது இதை ஒரு குறிப்பிட்ட கோட்பாட்டு அல்லது பிரிவுசார் பொருளுக்குள் சுருக்காமல், இரு கிரேக்கச் சொற்களுக்கிடையிலான தொடர்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமத்திற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடிவாளமிடுதல்’ என்ற உயிருள்ள மூல உருவகம் காக்கப்பட்டுள்ளது; ‘மதப்பற்று’ என்ற மீள்பயன்பாடு θρησκός/θρησκεία சொல் தொடர்பைப் பிரதிபலிக்கிறது.
