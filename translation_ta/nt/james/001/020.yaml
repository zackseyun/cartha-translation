id: JAS.1.20
reference: James 1:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: ta
  text: ஏனெனில், மனிதரின் கோபம் கடவுளுடைய நீதியை நிறைவேற்றுவதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: மனிதனுடைய கோபம்
  rationale: ἀνήρ இங்கு பொதுவாக மனிதரைக் குறிக்கிறது; பாலினத்தைத் தேவையின்றி வரையறுக்காமல் இயல்பான தமிழில் பொருளைத் தருகிறது.
- source_word: δικαιοσύνην θεοῦ
  choice: கடவுளுடைய நீதி
  rationale: மூலத்தின் உரியுடைமைத் தொடர்பையும், அது கடவுள் கோரும் நீதி அல்லது கடவுளிடமிருந்து வரும் நீதி எனப் புரிந்துகொள்ளக்கூடிய உண்மையான பொருள் விரிவையும் பாதுகாக்கிறது.
- source_word: οὐκ ἐργάζεται
  choice: செயல்படுத்துவதில்லை
  rationale: ἐργάζομαι என்பதன் ‘உண்டாக்குதல்/நிறைவேற்றுதல்’ என்ற செயற்பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; மனிதக் கோபம் கடவுளுடைய நீதியை நிறைவேற்றாது என்பதே கருத்து.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: δικαιοσύνη θεοῦ என்பதன் பொருள்
  choice: கடவுளுடைய நீதி
  alternative: கடவுள் விரும்பும் நீதியான செயல் / கடவுள் அளிக்கும் நீதி
  rationale: உரியுடைமை அமைப்பு பலவிதமாகப் புரிந்துகொள்ளப்படலாம். அவற்றில் ஒன்றை மட்டும் உரைக்குள் திணிக்காமல் மூலத்தின் இறையியல் செறிவையும் ambiguity-யையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடை. ‘மனிதனுடைய’ என்பது பொதுமனிதரைக் குறிக்கிறது; ‘செயல்படுத்துவதில்லை’ என்பது வெறும் உணர்வு அல்ல, நீதியை நிறைவேற்ற இயலாமையைச் சுட்டுகிறது.
