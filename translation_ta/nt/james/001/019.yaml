id: JAS.1.19
reference: James 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: ta
  text: 'என் அன்புக்குரிய சகோதரர்களே[a], இதை அறிந்துகொள்ளுங்கள்[b]: ஒவ்வொருவரும்[c] கேட்பதில் விரைவாகவும், பேசுவதில் தாமதமாகவும், கோபப்படுவதில் தாமதமாகவும் இருக்கட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதர சகோதரிகளே’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘சகோதரர்கள்’ என்ற ஆண்பால் வடிவம் இருந்தாலும், இங்கு விசுவாசக் குழுமம் முழுவதும் அழைக்கப்படுவதாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘என் அன்புக்குரிய சகோதரர்களே, நீங்கள் இதை அறிந்திருக்கிறீர்கள்.’ தொடக்கத்திலுள்ள கிரேக்க வினைச்சொல்லை ஏவலாகவோ குறிப்பாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: நேரடியாக, ‘ஒவ்வொரு மனிதரும்’; கிரேக்க ஒருமை வடிவம் இங்கு பொதுப்பொருளில் ஒவ்வொருவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴστε
  choice: இதை அறிந்துகொள்ளுங்கள்
  rationale: இந்த வடிவத்தை ஏவலாகவும் (‘அறிந்துகொள்ளுங்கள்’), குறிப்பாகவும் (‘நீங்கள் அறிந்திருக்கிறீர்கள்’) புரிந்துகொள்ளலாம். தொடர்ந்து வரும் அறிவுறுத்தல்களோடு ஏவல் வாசிப்பு இயல்பாகப் பொருந்துகிறது. ‘இதை’ என்பது தமிழில் தொடரை இயல்பாக்கச் சேர்க்கப்பட்டது.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: என் அன்புக்குரிய சகோதரர்களே
  rationale: ἀδελφοί என்பது இலக்கணத்தில் ஆண்பால் பன்மை; விசுவாசக் குழுமம் முழுவதையும் அழைக்கும் சொல்லாகவும் பயன்படுகிறது. ‘அன்புக்குரிய’ என்பது ἀγαπητοί என்பதன் நேரான, கண்ணியமான மொழிபெயர்ப்பு.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: ஒவ்வொருவரும் ... இருக்கட்டும்
  rationale: ἔστω என்பது மூன்றாம் நபர் ஏவல். δέ இங்கு மென்மையான இணைப்புச் சொல் என்பதால் தனியே வலுவான எதிர்மறை இணைப்பாக மொழிபெயர்க்கப்படவில்லை. πᾶς ἄνθρωπος பொதுப்பொருளில் ஒவ்வொரு மனிதரையும் குறிக்கிறது; தமிழில் ‘ஒவ்வொருவரும்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: கேட்பதற்கு விரைவுள்ளவராக
  rationale: ἀκούω என்பதன் கேட்பது/செவிகொடுப்பது என்ற பொருளைத் தக்கவைத்து, அறிவுறுத்தலின் இணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: பேசுவதற்குத் தாமதமுள்ளவராக
  rationale: பேச முனைவதில் அவசரப்படாதிருத்தலைக் குறிக்கும் கிரேக்க அமைப்பை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: βραδὺς εἰς ὀργήν
  choice: கோபப்படுவதற்குத் தாமதமுள்ளவராக
  rationale: ὀργή என்பது இங்கு கோபத்தைக் குறிக்கிறது. ‘கோபப்படுவதற்குத் தாமதம்’ என்பது உணர்வின் தீவிரத்தைக் குறைப்பதல்ல, கோபத்திற்கு விரைந்து இடங்கொடாதிருப்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சகோதரர்கள் என்ற ஆண்பால் வடிவத்தின் பிரதிநிதித்துவப் பயன்பாடு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்தல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்கத்தில் ஆண்பால் பன்மை வடிவம் உள்ளது; அது கலந்த விசுவாசக் குழுமத்தையும் உள்ளடக்கக்கூடும். மூல வடிவம் முதன்மை உரையில் காக்கப்பட்டு, உள்ளடக்கிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: πᾶς ἄνθρωπος என்பதன் பொதுப்பொருள்
  choice: ஒவ்வொருவரும்
  alternative: ஒவ்வொரு மனிதனும்
  rationale: இங்கு ἄνθρωπος ஆண்களை மட்டும் குறிக்காமல் ஒவ்வொரு மனிதரையும் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் ‘ஒவ்வொருவரும்’ இந்தப் பொதுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- issue: Ἴστε என்பதன் இலக்கணப் பொருள்
  choice: 'ஏவல்: ‘அறிந்துகொள்ளுங்கள்’'
  alternative: 'குறிப்பு: ‘நீங்கள் அறிந்திருக்கிறீர்கள்’'
  rationale: இரு வாசிப்புகளும் இலக்கணரீதியாகச் சாத்தியம். தொடர்ந்து வரும் ஏவல்களுடன் ஏவல் வாசிப்பு நன்றாகப் பொருந்துவதால் அது முதன்மை உரையில் வைக்கப்படுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விரைவுள்ளவர்/தாமதமுள்ளவர்’ என்ற இணை அமைப்பு மூலத்தின் மூன்று பகுதி வாக்கிய ஒத்திசைவைப் பாதுகாக்கிறது; அதேவேளை ‘ஒவ்வொருவரும்’ என்பது இயல்பான தமிழில் பொதுப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
