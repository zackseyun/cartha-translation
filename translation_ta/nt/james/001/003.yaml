source:
  edition: SBLGNT
  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: ta
  text: ஏனெனில், உங்கள் விசுவாசத்தின் சோதனை[a] நிலைத்திருக்கும் தன்மையை[b] உருவாக்குகிறது என்பதை நீங்கள் அறிந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோதனையால் நிரூபிக்கப்பட்ட உங்கள் விசுவாசத்தின் உண்மைத்தன்மை.” கிரேக்கச் சொல் சோதிக்கும் நிகழ்முறையையோ, சோதனையால் வெளிப்படும் தரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சகிப்புத்தன்மை” அல்லது “விடாமுயற்சி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: ஏனெனில் ... நீங்கள் அறிந்திருக்கிறீர்கள்
  rationale: இது நிகழ்காலச் செயப்பாட்டு வினையெச்சமாக இருந்து, முந்தைய வசனத்தின் அறிவுறுத்தலுக்கான காரணத்தை உணர்த்துகிறது. தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ὅτι
  choice: என்று
  rationale: வாசகர்கள் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் இதற்கு இயல்பான இணைப்புச்சொல் ‘என்று’.
- source_word: τὸ δοκίμιον
  choice: சோதிக்கப்படுவது
  rationale: இச்சொல் சோதிக்கும் நிகழ்முறையையோ, சோதனையால் நிரூபிக்கப்பட்ட உண்மைத்தன்மையையோ குறிக்கலாம். உடனடிச் சூழலில் விசுவாசம் சோதிக்கப்படும் நிகழ்முறை முதன்மையாகத் தோன்றுவதால் இது முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: ὑμῶν τῆς πίστεως
  choice: உங்கள் விசுவாசம்
  rationale: இது வாசகர்களுடைய விசுவாசமே சோதனைக்கு உட்படுவதைக் குறிக்கிறது. πίστις என்பதற்கு இச்சூழலில் தெளிவான, வழக்கமான தமிழ் பதம் ‘விசுவாசம்’.
- source_word: κατεργάζεται
  choice: உருவாக்குகிறது
  rationale: சோதனை ஒரு விளைவை ஏற்படுத்துகிறது என்ற வினையின் காரண-விளைவு வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπομονήν
  choice: மனவுறுதி
  rationale: துன்பத்தின் கீழ் நிலைத்து நிற்கும் பண்பை இச்சொல் குறிக்கிறது. ‘மனவுறுதி’ சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழ்; நிலைத்திருத்தல், விடாமுயற்சி ஆகிய நுணுக்கங்களும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; நம்பிக்கைத்தன்மை
  rationale: யாக்கோபு 1:3-ல் வாசகர்களின் விசுவாசம் சோதிக்கப்படுவதே கருத்து. ‘நம்பிக்கைத்தன்மை’ என்று மொழிபெயர்ப்பதற்கான தெளிவான சூழல் அழுத்தம் இல்லாததால், பரவலாகப் புரிந்துகொள்ளப்படும் ‘விசுவாசம்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: δοκίμιον குறிக்கும் நிகழ்முறையா அல்லது விளைவா
  choice: விசுவாசம் சோதிக்கப்படுவது
  alternative: சோதனையால் நிரூபிக்கப்பட்ட உங்கள் விசுவாசத்தின் உண்மைத்தன்மை
  rationale: கிரேக்கச் சொல் இரு பொருள்களையும் ஏற்கக்கூடியது. சோதனைகள் பற்றிய உடனடிச் சூழல் நிகழ்முறைப் பொருளை ஆதரிக்கிறது; எனினும் விளைவுப் பொருள் நீக்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. முந்தைய வசனத்துடனான காரணத் தொடர்பை ‘ஏனெனில்’ தெளிவாக்குகிறது. கிரேக்க மூலத்திலுள்ள சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
