- from: ஏனெனில், உங்கள் விசுவாசம் சோதிக்கப்படுவது[a] மனவுறுதியை[b] உருவாக்குகிறது என்று நீங்கள் அறிந்திருக்கிறீர்கள்.
  to: ஏனெனில், உங்கள் விசுவாசத்தின் சோதனை[a] நிலைத்திருக்கும் தன்மையை[b] உருவாக்குகிறது என்பதை நீங்கள் அறிந்திருக்கிறீர்கள்.
  rationale: The revision replaces a term for mental resolve with wording that denotes steadfast endurance, and it recasts the testing expression as a noun phrase closer to τὸ δοκίμιον. The causal and content relations, the standard rendering of πίστις, and the lexical ambiguity of δοκίμιον are retained.
  reviewer_model: gpt-5.6-terra
