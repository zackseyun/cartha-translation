id: JAS.1.11
reference: James 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ta
  text: ஏனெனில், கடும் வெப்பத்துடன் சூரியன் உதித்து, புல்லை உலரச் செய்தது[a]; அதன் பூ உதிர்ந்தது, அதன் தோற்றப் பொலிவும் அழிந்தது. அவ்வாறே செல்வந்தனும் தன் செயல்பாடுகளின் நடுவில் வாடிப்போவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடும் வெப்பக் காற்றுடன்.” καύσων என்ற கிரேக்கச் சொல் எரிக்கும் வெப்பத்தையோ, சில சூழல்களில் அதனுடன் தொடர்புடைய சூடான காற்றையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் பயணங்களில்.” πορεία என்ற கிரேக்கச் சொல் நேரடியாகப் பயணங்களையோ, விரிந்த பொருளில் ஒருவரின் செயல்பாடுகள் அல்லது வாழ்க்கைநடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: உதித்து
  rationale: சூரியன் உதிப்பதை இயல்பான தமிழில் கூறுகிறது; கிரேக்க இறந்தகால வடிவம் பொதுவாக நிகழும் காட்சியை உயிரோட்டமாக முன்வைப்பதால், தமிழ் தொடர் வினையெச்ச அமைப்பு அடுத்த செயல்களுடன் இயல்பாக இணைக்கப்படுகிறது.
- source_word: σὺν τῷ καύσωνι
  choice: கடும் வெப்பத்துடன்
  rationale: καύσων என்பதன் எரிக்கும் வெப்பம் என்ற முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; சூடான காற்று என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: புல்லை உலரச் செய்கிறது
  rationale: வெப்பத்தால் தாவரம் உலர்வதைக் concrete ஆகக் காட்டுகிறது. இது பொதுவாக நிகழும் உவமைக் காட்சி என்பதால் தமிழில் நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: அதன் பூ உதிர்ந்து
  rationale: ἐκπίπτω குறிக்கும் கீழே விழுதல் அல்லது பிரிந்து விழுதல் என்ற உருவகத்தை இயல்பான தமிழில் ‘உதிர்ந்து’ என்பதால் தருகிறது.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: அதன் தோற்றப் பொலிவு
  rationale: εὐπρέπεια என்பதன் அழகு அல்லது பொலிவையும் πρόσωπον என்பதன் இச்சூழலுக்குரிய வெளித்தோற்றப் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀπώλετο
  choice: அழிந்துபோகிறது
  rationale: அழகு மறைந்து முற்றிலும் இல்லாமற்போவதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ πλούσιος
  choice: செல்வந்தன்
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமை பிரதிநிதி உருவத்தைப் பாதுகாக்கும் இயல்பான தமிழ் சொல்.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: தன் முயற்சிகளின் நடுவில்
  rationale: πορεία என்பதன் பயணங்கள் என்ற நேரடிப் பொருளை விட, இங்கு ஒருவரின் செயல்பாடுகள் மற்றும் முன்னெடுப்புகள் என்ற விரிந்த சூழற்பொருளை அளிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μαρανθήσεται
  choice: வாடிப்போவான்
  rationale: தாவர உவமையைத் தொடர்ந்து, எதிர்காலத்தில் தவிர்க்க முடியாமல் நேரும் சிதைவை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ὁ πλούσιος என்பதிலுள்ள பாலினக் குறிப்பு
  choice: செல்வந்தன்
  alternative: செல்வந்தர் / செல்வமுள்ளவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை பிரதிநிதியைத் தக்கவைக்கிறது; எச்சரிக்கை பெண்களுக்கு பொருந்தாது என்ற கருத்தை இதனால் உருவாக்க வேண்டியதில்லை.
- issue: πορείαις என்பதன் பொருள் வரம்பு
  choice: முயற்சிகள்
  alternative: பயணங்கள்
  rationale: செல்வந்தன் தன் வாழ்க்கைச் செயல்பாடுகளிலும் முன்னெடுப்புகளிலும் ஈடுபட்டிருக்கும்போதே வாடிப்போவான் என்ற விரிந்த எச்சரிக்கையைத் தருகிறது; மூலத்தின் நேரடிப் பயணப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. இயற்கைக் காட்சியின் தொடர் இயக்கத்தை இயல்பான தமிழ் வினையெச்சங்களால் வழங்கி, இறுதி எதிர்கால எச்சரிக்கையைத் தெளிவாக வைத்துள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
