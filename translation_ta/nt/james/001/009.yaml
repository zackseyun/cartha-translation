id: JAS.1.9
reference: James 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: ta
  text: ஆனால், தாழ்ந்த நிலையில் உள்ள சகோதரன்[a] தன் உயர்வில்[b] பெருமைகொள்ளட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாழ்ந்த நிலையில் உள்ள சகோதரனோ சகோதரியோ’ என்றும் பொருள்கொள்ளலாம். கிரேக்கத்தில் ‘சகோதரன்’ என்பது ஆண்பால் ஒருமையில் உள்ளது; இங்கு அது ஒரு சக விசுவாசியைப் பொதுப்படையாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘தன் உயர்ந்த நிலையில்.’ இது கடவுள்முன் தாழ்ந்த விசுவாசிக்குக் கிடைத்த கண்ணியமான நிலையைக் குறிக்கலாம்; தற்போதைய மற்றும் எதிர்கால நிலைமாற்றங்களின் சாயலும் இதில் இருக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: பெருமைகொள்ளட்டும்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தலைப் பாதுகாக்கிறது. ‘மகிழட்டும்’ என்பதைக் காட்டிலும் καυχάομαι என்பதன் ‘பெருமைகொள்/மேன்மை பாராட்டு’ என்ற வலிமையை இது தெளிவாக வெளிப்படுத்துகிறது; இங்கு அந்தப் பெருமையின் அடிப்படை ஒருவருடைய சொந்தச் சாதனை அல்ல, அவருக்குக் கிடைத்த உயர்வு.
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ காட்டும் மென்மையான மாறுபாட்டையும், 9–10ஆம் வசனங்களில் வரும் தாழ்ந்தவர்–செல்வர் இணைப்புக்கான மாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀδελφὸς
  choice: சகோதரன்
  rationale: கிரேக்க மூலத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது. யாக்கோபில் இது பொதுவாக விசுவாசச் சமூகத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; அதன் பிரதிநிதித்துவப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὁ ταπεινὸς
  choice: தாழ்ந்த நிலையில் உள்ள
  rationale: ταπεινός இங்கு தாழ்மையான குணத்தை மட்டுமல்லாமல் சமூக அல்லது பொருளாதாரத் தாழ்நிலையையும் குறிக்கக்கூடும். அடுத்த வசனத்திலுள்ள செல்வருடனான மாறுபாட்டைக் காக்கும் வகையில், வறுமையை மட்டும் குறிப்பதாக மிகைப்படுத்தாமல் இந்தச் சொற்றொடர் அமைந்துள்ளது.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: தன் உயர்வில்
  rationale: ὕψος என்பதன் ‘உயரம்/உயர்வு’ என்ற உருவக வலிமையையும் நிலைமாற்றத்தின் சாயலையும் காக்கிறது. இது தற்போதைய சமூக உயர்வா, கடவுள்முன் கிடைத்த கண்ணியமான நிலையா, அல்லது எதிர்கால உயர்வா என்பதை முதன்மை உரை குறுகலாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: தாழ்ந்த விசுவாசியின் ‘உயர்வு’ என்பதன் பொருள்
  choice: கடவுள்முன் கிடைத்த உயர்ந்த நிலை அல்லது கண்ணியத்தையும், தற்போதைய அல்லது எதிர்கால நிலைமாற்றத்தையும் உள்ளடக்கக்கூடிய திறந்த சொல்லாக்கமாக ‘தன் உயர்வில்’ என மொழிபெயர்த்தல்.
  alternative: தற்போதைய சமூக உயர்வு மட்டும்; கடவுள்முன் உள்ள ஆவிக்குரிய நிலை மட்டும்; எதிர்கால இறுதிக்கால உயர்வு மட்டும்.
  rationale: 9–10ஆம் வசனங்களின் தாழ்ந்தவர்–செல்வர் மாறுபாடு நிலைமாற்றத்தைச் சுட்டுகிறது. ஆனால் எந்த ஒரு கால அல்லது இறையியல் விளக்கத்திற்கும் மட்டும் இதை வரையறுக்காமல் மூலத்தின் பொருள் அகலமும் இறையியல் இழுவிசையும் பாதுகாக்கப்படுகின்றன.
- issue: ἀδελφός என்பதின் பாலின வெளிப்பாடு
  choice: முதன்மை உரையில் ஆண்பால் ஒருமையான ‘சகோதரன்’ என்பதை வைத்திருந்து, அதன் பிரதிநிதித்துவப் பயன்பாட்டை அடிக்குறிப்பில் தெரிவிப்பது.
  alternative: ‘சகோதரனோ சகோதரியோ’ அல்லது ‘சக விசுவாசி’ என்று முதன்மை உரையிலேயே பொதுப்படுத்துவது.
  rationale: மூலத்தின் இலக்கணப் பாலையும் எண்ணையும் முதன்மை உரை பாதுகாக்கிறது; அதே நேரத்தில், சூழலில் ஆண் அல்லது பெண் சக விசுவாசியைப் பொதுப்படையாகக் குறிக்கக்கூடிய வாய்ப்பு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாழ்ந்த நிலையில் உள்ள’ என்பது சமூகத் தாழ்நிலையையும் தாழ்மையையும் முற்றிலும் பிரிக்காமல் வைத்திருக்கிறது; ‘தன் உயர்வில்’ என்பது மூலத்திலுள்ள சுருக்கத்தையும் பொருள் திறப்பையும் பாதுகாக்கிறது.
