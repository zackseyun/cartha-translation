id: JAS.1.25
reference: James 1:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: ta
  text: ஆனால் நிறைவான சட்டத்தை—விடுதலையின் சட்டத்தை[a]—கூர்ந்து பார்த்து, அதில் நிலைத்திருப்பவர், மறந்துவிடும் கேட்பவராக இல்லாமல் செயலை நிறைவேற்றுகிறவராக இருப்பவர், தாம் செய்வதில் பேறுபெற்றவராக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விடுதலையின் நிறைவான சட்டத்தை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: கூர்ந்து பார்த்து
  rationale: இச்சொல் குனிந்து அல்லது நெருங்கிக் கவனமாகப் பார்ப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அதன் தீவிரத்தைக் காக்கவும் ‘கூர்ந்து பார்த்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: நிறைவான சட்டத்தை—விடுதலையின் சட்டத்தை
  rationale: τὸν τῆς ἐλευθερίας என்பது முன் வரும் νόμον τέλειον என்பதற்கு விளக்க இணைப்பாக உள்ளது. ‘சட்டம்’ என்பதை மீண்டும் கூறுவது அந்த அமைப்பைக் காக்கிறது; τέλειον என்பதற்கு ‘நிறைவான’ என்றும் ἐλευθερία என்பதற்கு ‘விடுதலை’ என்றும் தேர்ந்தெடுக்கப்பட்டது.
- source_word: παραμείνας
  choice: அதில் நிலைத்திருப்பவர்
  rationale: குறிப்பிடப்பட்ட சட்டத்தோடு தொடர்ந்து நிலைத்திருப்பதையும் விடாமுயற்சியையும் இச்சொல் உணர்த்துகிறது.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: கேட்டு மறந்துவிடுகிறவராக இல்லாமல்
  rationale: சொல்லுக்குச் சொல் ‘மறதியின் கேட்பவர்’ என்பது தமிழில் இயல்பற்றது. கேட்பதையும் பின்னர் மறப்பதையும் தெளிவாகக் காட்டும் வினைமுறைத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: ποιητὴς ἔργου
  choice: செயலைச் செய்கிறவராக
  rationale: ἔργου என்பது அருகிலுள்ள சூழலில் வரும் ‘வார்த்தை’ அல்ல, செயல்/வேலை என்பதைக் குறிப்பாகக் கூறுகிறது. சற்றே வலியுறுத்தலுள்ள கிரேக்கச் சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: μακάριος
  choice: பேறுபெற்றவராக
  rationale: வெறும் மனநிலையான ‘மகிழ்ச்சி’ என்பதைவிட, கடவுளிடமிருந்து கிடைக்கும் நல்வாழ்வையும் அருள்நிலையையும் குறிக்கும் மரபான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: தாம் செய்வதில்
  rationale: ποίησις என்பதன் செயற்பாட்டு அர்த்தத்தை இயல்பான தமிழில் தருவதோடு, முன் வரும் ‘செய்கிறவர்’ என்ற கருத்துடனான தொடர்பையும் காக்கிறது.
- source_word: ὁ ... οὗτος
  choice: '...வர் ... இருப்பார்'
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் குறிக்காமல் பொதுவான பிரதிநிதி ஒருமையாக உள்ளது. தமிழ் மரியாதை/பொதுமை ஒருமை பாலின வரம்பைச் சேர்க்காமல் அந்தச் சக்தியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘விடுதலையின் சட்டம்’ என்பதன் பொருள்
  choice: ‘விடுதலையின் சட்டம்’ என்ற சொற்றொடரை விளக்கித் தீர்மானிக்காமல் அப்படியே வைத்தல்
  alternative: ‘விடுதலை அளிக்கும் சட்டம்’ அல்லது குறிப்பாக நற்செய்தி/நிறைவேற்றப்பட்ட அறச்சட்டம் என்று விளக்குதல்
  rationale: கிரேக்கம் அந்தச் சட்டம் நற்செய்தியா, நிறைவேற்றப்பட்ட அறச்சட்டமா, அல்லது கடவுளின் வெளிப்படுத்தப்பட்ட போதனை முழுவதுமா என்பதைத் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே இறையியல் செறிவும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
- issue: பொதுவான ஆண்பால் ஒருமை
  choice: பாலினத்தைக் கட்டுப்படுத்தாத ‘வர்’ வடிவைப் பயன்படுத்துதல்
  alternative: ‘அவன்’ அல்லது ‘அந்த மனிதன்’ என ஆண்பாலுக்கு மட்டும் உரிய வடிவைப் பயன்படுத்துதல்
  rationale: இங்கு ஆண்பால் இலக்கண வடிவம் பொதுவான பிரதிநிதிப் பயன்பாடு; ஆண்களுக்கு மட்டும் உரிய பொருள் அல்ல.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘சட்டம்’ என்பது νόμος என்பதற்கான நேரடியான நவீனச் சொல்; ‘விடுதலை’ இறையியல் பொருளை முன்கூட்டியே குறுக்காமல் காக்கிறது. கிரேக்கத்தின் விளக்க இணைப்பு கோடுகளால் தெளிவுபடுத்தப்பட்டுள்ளது.
