- from: ஆனால் நிறைவான சட்டத்தை—விடுதலையின் சட்டத்தை[a]—கூர்ந்து பார்த்து, அதில் நிலைத்திருப்பவர், கேட்டு மறந்துவிடுகிறவராக இல்லாமல் செயலைச் செய்கிறவராக இருப்பதால், தாம் செய்வதில் பேறுபெற்றவராக இருப்பார்.
