id: JAS.1.18
reference: James 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: ta
  text: நாம் அவருடைய படைப்புகளில் ஒருவகை முதற்பலனாக[b] இருக்கும்படி, அவர் விரும்பியதால்[a] சத்தியத்தின் வார்த்தையால் நம்மைப் பெற்றெடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தமது சொந்த விருப்பத்தின்படி, சத்தியத்தின் வார்த்தையால் நம்மைப் பெற்றெடுத்தார்.”'
    reason: alternative_reading
  - marker: b
    text: “முதற்பலன்” என்பது அறுவடையில் முதலில் கிடைத்து, கடவுளுக்கென அர்ப்பணிக்கப்படும் பகுதியை நினைவூட்டுகிறது. இங்கே, கடவுள் படைத்தவற்றில் விசுவாசிகள் தொடக்கமான, அவருக்கென அர்ப்பணிக்கப்பட்ட ஒரு பகுதி என்று சித்தரிக்கப்படுகிறார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: அவர் விரும்பியதால்
  rationale: இறைவனுடைய விருப்பம் முதன்மை வினைக்குச் முன்னதாகவும் அதற்குக் காரணமாகவும் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எந்தக் குறிப்பிட்ட இறையியல் அமைப்பையும் இதில் சேர்க்கவில்லை.
- source_word: ἀπεκύησεν
  choice: நம்மைப் பெற்றெடுத்தார்
  rationale: ‘பெற்றெடுத்தல்’ என்ற பிறப்பு உருவகத்தைத் தக்கவைக்கிறது; 1:15-இல் ஆசை பாவத்தைப் பிறப்பிக்கிறது என்பதுடனான சொல் தொடர்பையும் பாதுகாக்கிறது.
- source_word: λόγῳ ἀληθείας
  choice: சத்தியத்தின் வார்த்தையால்
  rationale: λόγῳ என்பதன் கருவிப்பொருளை ‘-ஆல்’ காட்டுகிறது. ‘சத்தியத்தின் வார்த்தை’ என்பது உண்மையான நற்செய்தியைக் குறிக்கக்கூடிய வேதாகமச் சொற்றொடராகவும், கிரேக்கச் சொற்றொடரின் அமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: நாம் ... இருக்கும்படி
  rationale: இந்த அமைப்பிலுள்ள நோக்கம் அல்லது விளைவு ஆகிய இரண்டிற்கும் இடமளிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀπαρχήν
  choice: முதற்பலன்
  rationale: அறுவடையின் முதலாவதும் கடவுளுக்கென அர்ப்பணிக்கப்பட்டதுமான பகுதியைக் குறிக்கும் உருவகத்தையும் அதன் வேதாகமத் தொடர்புகளையும் பாதுகாக்கிறது.
- source_word: τινα
  choice: ஒருவகை
  rationale: விசுவாசிகள் நேரடியான வேளாண்மைப் முதற்பலன் அல்ல, ஒப்புமையான பொருளில் முதற்பலன் என்பதை உணர்த்தும் τινα-வின் தளர்த்திக் குறிப்பிடும் நுணுக்கத்தைத் தருகிறது.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: அவருடைய படைப்புகளில்
  rationale: κτίσματα என்பதன் பன்மையைப் பாதுகாத்து, அதை மனிதர்களுக்கு மட்டும் குறுக்காமல் கடவுள் படைத்த உயிர்கள் அல்லது பொருள்கள் அனைத்தையும் உள்ளடக்கக்கூடியதாக வைத்திருக்கிறது.
theological_decisions:
- issue: புதிய பிறப்பில் இறைவனுடைய முன்முயற்சி
  choice: ‘அவர் விரும்பியதால்’ என்று மொழிபெயர்த்து, அவரது விருப்பமே பெற்றெடுத்த செயலின் காரணம் என்பதை வெளிப்படுத்துதல்
  alternative: ‘தமது சொந்த விருப்பத்தின்படி’ அல்லது ஒரு குறிப்பிட்ட மறுபிறப்பு/முன்குறித்தல் கோட்பாட்டை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கம் இறைவனுடைய விருப்பம் செயலுக்கு முன்னதாகவும் காரணமாகவும் இருப்பதைக் காட்டுகிறது; ஆனால் முழுமையான ஒரு சமயப்பிரிவுச் சார்ந்த கோட்பாட்டை இவ்வசனம் தனியாக விவரிப்பதில்லை.
- issue: κτισμάτων என்பதன் பரப்பு
  choice: ‘அவருடைய படைப்புகளில்’ என்று பரந்த பொருளைத் தக்கவைத்தல்
  alternative: ‘அவர் படைத்த மனிதர்களில்’ என்று மனிதர்களுக்கு மட்டும் வரையறுத்தல்
  rationale: மூலச்சொல் படைக்கப்பட்டவற்றை பொதுவாகக் குறிக்கிறது; அதை மனிதர்களுக்கு மட்டும் வரையறுப்பது மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கும்.
- issue: εἰς τὸ εἶναι அமைப்பில் நோக்கமும் விளைவும்
  choice: ‘இருக்கும்படி’ என இரு நுணுக்கங்களுக்கும் இடமளித்தல்
  alternative: நோக்கத்தை மட்டும் கடுமையாக வலியுறுத்தும் அல்லது நிகழ்ந்த விளைவை மட்டும் கூறும் வடிவம்
  rationale: εἰς + articular infinitive நோக்கம்/விளைவு ஆகியவற்றின் நெருங்கிய தொடர்பை வெளிப்படுத்தலாம்; தமிழ் வடிவம் அந்தத் திறந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பெற்றெடுத்தார்’, ‘முதற்பலன்’ ஆகிய சொற்கள் மூலத்தின் முக்கிய உருவகங்களைத் தக்கவைக்கின்றன. ‘இப்படிச் செய்தார்’ என்பது நீண்ட நோக்கத் தொடரைத் தமிழில் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
