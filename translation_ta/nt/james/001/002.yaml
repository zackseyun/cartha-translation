source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: ta
  text: என் சகோதரர்களே[a], நீங்கள் பலவகையான சோதனைகளில்[b] சிக்கும்போதெல்லாம், அதை முழுமையான மகிழ்ச்சியாகக் கருதுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் சகோதர சகோதரிகளே’; ‘சகோதரர்கள்’ என்ற அழைப்பு விசுவாசக் குழு முழுவதையும் குறித்திருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கச் சொல் ‘சோதனைகள்,’ ‘பரிசோதனைகள்,’ அல்லது சில சூழல்களில் ‘தூண்டுதல்கள்’ என்றும் பொருள்படலாம். இங்கு விசுவாசத்தைச் சோதிக்கும் வெளிப்புறச் சோதனைகள் என்பதே பொருத்தமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: முழுமையான மகிழ்ச்சியாக
  rationale: இந்த வேற்றுமைத் தொடர் ἡγήσασθε என்பதன் பயனிலை நிரப்பியாக வந்து, சந்திக்கும் நிலையை முழுவதுமாக மகிழ்ச்சிக்குரியதாக மதிப்பிடுமாறு கூறுகிறது. ‘முழுமையான மகிழ்ச்சி’ என்பது ‘தூய மகிழ்ச்சி’ என்பதைவிட மூலத்தின் வடிவுக்கும் பொருளுக்கும் நெருக்கமானது.
- source_word: ἡγήσασθε
  choice: கருதுங்கள்
  rationale: ἡγέομαι என்பதன் இறந்தகால நடுவினை ஏவல் பன்மை வடிவம் இங்கு மனப்பூர்வமான மதிப்பீட்டைக் குறிக்கிறது. ‘கருதுங்கள்’ என்பது ஏவல் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது. இது விசுவாசக் குழுவிலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்கிய அழைப்பாக இருக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: ὅταν
  choice: போதெல்லாம்
  rationale: περιπέσητε என்ற வாய்ப்பாட்டு வினையுடன் சேர்ந்த ὅταν, குறிப்பிட்ட ஒரே நேரத்தை அல்லாமல் எப்போதெல்லாம் நிகழ்கிறதோ அப்போதெல்லாம் என்ற காலப் பொருளைத் தருகிறது.
- source_word: πειρασμοῖς
  choice: சோதனைகளில்
  rationale: இங்கு அடுத்த வசனத்தில் வரும் விசுவாசத்தின் பரிசோதனையைக் கருத்தில் கொண்டால், பாவத்துக்கு இழுக்கும் உள்தூண்டுதல்களைவிட விசுவாசத்தைச் சோதிக்கும் துன்ப அனுபவங்களே முதன்மைப் பொருள். இருப்பினும் கிரேக்கச் சொல்லின் பொருள் வரம்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: περιπέσητε
  choice: அகப்படும்போது
  rationale: வினைச்சொல் நேரடியாக ‘உள்ளே விழுதல்’ அல்லது எதிர்பாராமல் ஒன்றில் சிக்குதல் என்ற உயிரோட்டமான கருத்தைத் தருகிறது. ‘அகப்படுதல்’ தமிழில் இயல்பாக அந்தத் திடீர், விரும்பப்படாத சந்திப்பை வெளிப்படுத்துகிறது.
- source_word: ποικίλοις
  choice: பலவகையான
  rationale: சோதனைகள் ஒரே வகையானவை அல்ல, பல்வேறு தன்மையுடையவை என்பதை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: கடித அழைப்பில் ἀδελφοί என்பதன் உள்ளடக்கும் பொருள்
  choice: முதன்மை உரையில் ‘என் சகோதரர்களே’ என்று வைத்து, முழு விசுவாசக் குழுவையும் உள்ளடக்கக்கூடிய பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘என் சகோதர சகோதரிகளே’
  rationale: இது மூலத்தின் இலக்கண ஆண்பால் வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; அதேவேளையில் அந்த அழைப்பு பெண்களையும் உள்ளடக்கியிருக்கலாம் என்பதை மறைக்காமல் வெளிப்படுத்துகிறது.
- issue: ‘முழுமையான மகிழ்ச்சியாக’ என்பதன் கட்டளைப் பொருள்
  choice: சோதனைகளையே உள்ளார்ந்த நன்மை என அறிவிக்காமல், அவற்றில் அகப்படும் நிலையை முழுமையாக மகிழ்ச்சிக்குரியதாக மதிப்பிடுமாறு மொழிபெயர்த்தல்.
  alternative: ‘தூய மகிழ்ச்சியாகக் கருதுங்கள்’
  rationale: Πᾶσαν χαρὰν என்ற தொடர் மனப்பூர்வ மதிப்பீட்டைக் கோருகிறது; சோதனையின் வேதனையை மறுப்பதாகவோ ஒவ்வொரு சோதனையும் தன்னிலேயே நல்லது எனத் தீர்மானிப்பதாகவோ மேலதிக விளக்கத்தைச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. கிரேக்க வாக்கியத்தின் அழைப்பு, காலத்தின் வரையறையற்ற தன்மை, பலவகைச் சோதனைகள், மற்றும் மனப்பூர்வ மதிப்பீட்டுக்கான ஏவல் ஆகியவை இயல்பான தமிழ் சொல்வரிசையில் பாதுகாக்கப்பட்டுள்ளன.
