source:
  edition: SBLGNT
  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: ta
  text: ஏனெனில், அவன் தன்னை உற்றுப் பார்த்துவிட்டு, சென்றபின், அவன் எப்படிப்பட்டவன் என்பதை[a] உடனே மறந்துவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எப்படி இருந்தான் என்பதை.” கிரேக்கச் சொற்றொடர் அவன் எத்தகையவன், அல்லது எப்படிப்பட்டவன் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: உற்றுப் பார்த்துவிட்டு
  rationale: κατανοέω என்பது வெறுமனே பார்ப்பதைவிடக் கவனமாக நோக்குவதைக் குறிக்கலாம். கண்ணாடி உவமையில் “உற்றுப் பார்த்து” என்பது அந்தக் கவனமான பார்வையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய வசனத்திலுள்ள ஒப்புமைக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; “ஏனெனில்” அந்த விளக்கத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἑαυτὸν
  choice: தன்னை
  rationale: இது நேரடியான தற்சுட்டுப் பெயர். சூழலில் கண்ணாடியும் முகமும் இடம்பெற்றாலும், இந்த வசனத்தில் “முகம்” மீண்டும் சொல்லப்படாததால் “தன்னை” என்பதே மூலத்திற்கு நெருக்கமானது.
- source_word: ἀπελήλυθεν
  choice: அங்கிருந்து போனதும்
  rationale: வினைச்சொல்லின் perfect வடிவத்தில் நீங்கிச் சென்றதன் விளைவு உணர்த்தப்பட்டாலும், தொடர்ச்சியான நிகழ்வை இயல்பான தமிழில் “போனதும்” தெளிவாகக் காட்டுகிறது. “அங்கிருந்து” என்பது தமிழ் வாக்கியத்தில் பிரிவை இயல்பாக வெளிப்படுத்தும் சூழல்சார் நிறைவு.
- source_word: εὐθέως
  choice: உடனே
  rationale: εὐθέως குறிக்கும் தாமதமின்மையை “உடனே” சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπελάθετο
  choice: மறந்துவிட்டான்
  rationale: ἐπιλανθάνομαι நினைவில் வைத்திருக்காமல் போவதைக் குறிக்கிறது. “மறந்துவிட்டான்” நிகழ்ந்த மறதியையும் அதன் விளைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁποῖος ἦν
  choice: தான் எப்படிப்பட்டவன் என்பதை
  rationale: ὁποῖος அடையாளத்தை மட்டும் அல்லாமல் ஒருவரின் தன்மை அல்லது வகையைச் சுட்டுகிறது. “எப்படிப்பட்டவன்” அந்தப் பண்புசார் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கண்ணாடி உவமையிலுள்ள இலக்கண ஆண்பால் பொதுப்பொருள்
  choice: தான் எப்படிப்பட்டவன் என்பதை
  alternative: தான் எப்படிப்பட்டவர் என்பதை
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை இருந்தாலும், இது ஆண்களை மட்டும் குறிக்காமல் பொதுவான மனிதரை எடுத்துக்காட்டாகச் சொல்கிறது. முந்தைய வசனத்திலிருந்து வரும் ஒருமைச் சுட்டைத் தெளிவாக வைத்திருக்கத் தமிழில் “அவன்/எப்படிப்பட்டவன்” பயன்படுத்தப்படுகிறது; இதை ஆண்களுக்கு மட்டுமே வரையறுக்கும் கூற்றாகப் புரிந்துகொள்ளக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. “உற்றுப் பார்த்துவிட்டு” கண்ணாடி உவமையின் கவனமான நோக்குதலைத் தருகிறது; “எப்படிப்பட்டவன்” மூலத்தின் பண்புசார் தெளிவின்மையைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
