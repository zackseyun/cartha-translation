- from: ஒவ்வொரு நல்ல கொடையும் ஒவ்வொரு நிறைவான பரிசும் மேலிருந்து வருகிறது[a]; அது ஒளிகளின் தந்தையிடமிருந்து[b] இறங்கி வருகிறது. அவரிடம் மாறுபாடோ, திரும்புதலால் உண்டாகும் நிழலோ இல்லை[c].
  to: ஒவ்வொரு நல்ல கொடையும் ஒவ்வொரு நிறைவான பரிசும் மேலிருந்து, ஒளிகளின் தந்தையிடமிருந்து இறங்கி வருகிறது[a][b]. அவரிடம் மாறுபாடோ திரும்புதலின் நிழலோ இல்லை[c].
