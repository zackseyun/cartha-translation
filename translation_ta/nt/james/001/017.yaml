source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: ta
  text: ஒவ்வொரு நல்ல கொடையும் ஒவ்வொரு நிறைவான பரிசும் மேலிருந்து, ஒளிகளின் தந்தையிடமிருந்து இறங்கி வருகிறது[a][b]. அவரிடம் மாறுபாடோ திரும்புதலின் நிழலோ இல்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒவ்வொரு நல்ல கொடுத்தலும் ஒவ்வொரு நிறைவான கொடையும்’ என்றும் மொழிபெயர்க்கலாம். முதல் பெயர்ச்சொல் கொடுக்கும் செயலை வலியுறுத்தக்கூடும்; இரண்டாவது கொடுக்கப்பட்ட பொருளை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒளிகள்’ என்பது சூரியன், சந்திரன், நட்சத்திரங்கள் போன்ற விண்ணொளிகளைக் குறிக்கக்கூடும்.
    reason: imagery_clarification
  - marker: c
    text: ‘திரும்புதலால் உண்டாகும் நிழல்’ அல்லது ‘மாறிக்கொண்டிருக்கும் நிழல்’ என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்றொடர் விண்ணொளிகளின் இயக்கத்தோடு மாறும் நிழல்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον
  choice: ஒவ்வொரு நல்ல கொடையும் ஒவ்வொரு நிறைவான பரிசும்
  rationale: δόσις என்பது கொடுக்கும் செயலையோ கொடுக்கப்பட்ட கொடையையோ குறிக்கலாம்; δώρημα கொடுக்கப்பட்ட பொருளை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் இரு சொற்களின் வேறுபாடு ஓரளவு புலப்படவும் ‘கொடை’ மற்றும் ‘பரிசு’ பயன்படுத்தப்பட்டன. τέλειον என்பதற்கு முழுமை அல்லது குறைவற்ற நன்மை என்ற பொருளில் ‘நிறைவான’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: மேலிருந்து வருகிறது; ... இறங்கி வருகிறது
  rationale: ἄνωθεν என்பதன் ‘மேலிருந்து’ என்ற மூலக் குறிப்பு காக்கப்படுகிறது. நிகழ்காலப் பங்கேற்பான καταβαῖνον, அந்தப் பரிசு வரும் மூலத்தையும் இயக்கத்தையும் காட்டுவதால் ‘இறங்கி வருகிறது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: ஒளிகளின் தந்தையிடமிருந்து
  rationale: மூலத்தின் உருவகமான ‘ஒளிகளின் தந்தை’ விளக்க உரையாக மாற்றப்படாமல் அப்படியே காக்கப்படுகிறது; இது விண்ணிலுள்ள ஒளிகளைச் சுட்டக்கூடும்.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: அவரிடம் மாறுபாடோ ... இல்லை
  rationale: παρ’ ᾧ உறவு அல்லது முன்னிலையைச் சுட்டுவதால் ‘அவரிடம்’ எனவும், παραλλαγή மாற்றம் அல்லது வேறுபாட்டைக் குறைப்பதால் விண் ஒளிகளின் உருவகத்தோடு பொருந்தும் ‘மாறுபாடு’ எனவும் வழங்கப்பட்டது.
- source_word: τροπῆς ἀποσκίασμα
  choice: திரும்புதலால் உண்டாகும் நிழல்
  rationale: இந்தக் கடினமான சொற்றொடரில் τροπή திரும்புதல், சுழற்சி அல்லது மாற்றத்தைக் குறிக்கலாம்; ἀποσκίασμα நிழல் அல்லது நிழற்படிவத்தைக் குறிக்கிறது. காரணத் தொடர்பை தமிழில் தெளிவாக்கியபோதும், உருவகம் பிரதான உரையில் காக்கப்பட்டது.
theological_decisions:
- issue: ‘ஒளிகளின் தந்தை’ என்ற உருவகமும் கடவுளின் மாறாத தன்மையும்
  choice: உருவகத்தையும் மாறுபாடின்மை குறித்த கூற்றையும் பிரதான உரையில் விரிவான கோட்பாட்டு விளக்கமின்றிக் காத்தல்
  alternative: ‘விண்ணொளிகளைப் படைத்த தந்தை’ என்று வெளிப்படையாக விளக்குதல் அல்லது இறுதிக் கூறை ‘அவர் ஒருபோதும் மாறுவதில்லை’ என்று சுருக்குதல்
  rationale: கிரேக்க உரை கடவுளை நன்மையான கொடைகளின் மூலமாகக் கூறி, மாறும் ஒளிகளும் நிழல்களும் குறித்த உருவகத்தின் வழியாக அவரிடம் மாறுபாடு இல்லை என்கிறது. அந்த உருவகத் தொடர்பும் அதன் பொருள் நெருக்கடியும் மொழிபெயர்ப்பில் தீர்த்துவிடப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டது. ‘ஒளிகளின் தந்தை’ போன்ற மூல உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை; ‘கொடை/பரிசு’ என்ற சொல் வேறுபாடு கிரேக்க இணைச்சொற்களின் வேறுபாட்டை இயல்பான தமிழில் பிரதிபலிக்கிறது.
