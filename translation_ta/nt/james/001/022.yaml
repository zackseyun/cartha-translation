source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: ta
  text: ஆனால், வார்த்தையின்படி செயல்படுகிறவர்களாக இருங்கள்; உங்களையே ஏமாற்றிக்கொள்ளும் கேட்பவர்களாக மட்டும் இருக்காதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தவறான நியாயப்படுத்தலால் உங்களையே வழிதவறச் செய்துகொண்டு.”
    reason: παραλογιζόμενοι என்பது வெறும் ஏமாற்றத்தை மட்டுமல்லாமல், தவறான பகுத்தறிவு அல்லது நியாயப்படுத்தலால் தம்மைத் தவறுக்கு இட்டுச் செல்லும் நுணுக்கத்தையும் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: Γίνεσθε
  choice: இருங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து நிலவும் வாழ்க்கை முறைக்கான அழைப்பைத் தருகிறது. தமிழில் ‘இருங்கள்’ என்பது அந்தக் கட்டளை வலிமையையும் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து இங்குள்ள மென்மையான எதிர்மறைத் திருப்பை வெளிப்படுத்துகிறது.
- source_word: ποιηταὶ λόγου
  choice: அது சொல்வதைச் செய்கிறவர்கள்
  rationale: ‘வார்த்தையைச் செய்பவர்கள்’ என்பது தமிழில் இயல்பற்றதாக இருப்பதால், λόγου என்பதன் பொருள்/உள்ளடக்க உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀκροαταὶ μόνον
  choice: வார்த்தையைக் கேட்கிறவர்கள் மட்டும்
  rationale: ἀκροαταί என்பதையும் μόνον தரும் வரையறுக்கும் வலிமையையும் காத்து, செய்கிறவர்களோடு உள்ள நேரடியான வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: παραλογιζόμενοι ἑαυτούς
  choice: உங்களையே ஏமாற்றிக்கொள்ளாமல்
  rationale: தவறான நியாயப்படுத்தலால் ஒருவர் தம்மையே ஏமாற்றிக்கொள்ளும் கருத்தை இயல்பான தமிழில் தருகிறது. கிரேக்கப் பங்கேற்புவினையின் சூழ்நிலைத் தொடர்பு எதிர்மறை இணை அமைப்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யாக்கோபு 1:22-இல் λόγος என்பதன் பொருள்
  choice: வார்த்தை
  alternative: செய்தி; போதனை
  rationale: 1:21-இல் ‘உள்ளத்தில் பதியவைக்கப்பட்ட வார்த்தை’ என்பதுடன் உள்ள தொடர்ச்சியையும் வேதாகமச் செறிவையும் ‘வார்த்தை’ காக்கிறது; அதேவேளையில் அதை ஒரு குறுகிய கோட்பாட்டுப் பொருளாக வரையறுக்கவில்லை.
- issue: Γίνεσθε என்ற கட்டளையின் வலிமை
  choice: தொடர்ந்து வார்த்தையின்படி செய்கிறவர்களாக இருங்கள் என்ற அறிவுறுத்தல்
  alternative: செய்கிறவர்களாக ஆகுங்கள் என்ற தொடக்கநிலைப் பொருள்
  rationale: நிகழ்காலக் கட்டளை ஒரு தொடர்ச்சியான பழக்கத்தையோ வாழ்க்கை முறையையோ இயல்பாகக் குறிக்கிறது; ‘இருங்கள்’ இதைத் தமிழில் தெளிவாகத் தருகிறது.
- issue: παραλογιζόμενοι என்பதிலுள்ள தவறான பகுத்தறிவின் நுணுக்கம்
  choice: ஏமாற்றிக்கொள்ளுதல்
  alternative: தவறாக நியாயங்கற்பித்து தம்மைத் தவறுக்கு வழிநடத்துதல்
  rationale: முதன்மை உரையில் தெளிவான, இயல்பான சொல் பயன்படுத்தப்பட்டு, தவறான பகுத்தறிவின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘வார்த்தையைச் செய்பவர்கள்’ என்ற சொற்சொல் அமைப்பைத் தவிர்த்து, கேட்பது–செய்வது என்ற மூலத்தின் சொல்லாட்சிசார் எதிர்மறைத் தொடர்பு இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
