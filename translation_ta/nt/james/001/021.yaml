source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: ta
  text: ஆகையால், எல்லா அசுத்தத்தையும் வழிந்தோடும் தீமையையும்[a] அகற்றிவிட்டு, உங்களுக்குள் பதிக்கப்பட்ட வார்த்தையை[c] சாந்தத்தோடு[b] ஏற்றுக்கொள்ளுங்கள்; அது உங்கள் ஆத்துமாக்களை[d] இரட்சிக்க வல்லது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமையின் மிகுதியையும்”; அல்லது, “வன்மத்தின் மிகுதியையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மென்மையோடு”; அல்லது, “பணிவோடு.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உள்ளியல்பான வார்த்தையை”; பாரம்பரியமாக, “ஒட்டுக்கட்டப்பட்ட வார்த்தையை.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “உங்கள் உயிர்களை”; அல்லது, “உங்களையே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகையால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἀποθέμενοι
  choice: அகற்றிவிட்டு
  rationale: முதன்மைக் கட்டளையோடு தொடர்புடைய முன்னோடி அல்லது உடன்நிகழ் செயலைக் காட்டும் இறந்தகாலப் பங்கேற்புவினையின் வலிமையைத் தமிழில் இயல்பாகக் கொண்டுவருகிறது.
- source_word: πᾶσαν ῥυπαρίαν
  choice: எல்லா அசுத்தத்தையும்
  rationale: ῥυπαρίαவின் அழுக்கு என்ற உருவகத்தையும் அதன் ஒழுக்கநெறிசார் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: περισσείαν κακίας
  choice: பெருகிவழியும் தீமையையும்
  rationale: περισσεία காட்டும் மிகுதி அல்லது வழிந்தோடும் தன்மையையும், κακίαவின் விரிவான ‘தீமை’ என்ற பொருளையும் இணைக்கிறது; அதை ‘வன்மம்’ என்ற குறுகிய பொருளாக மட்டுப்படுத்தவில்லை.
- source_word: ἐν πραΰτητι
  choice: சாந்தத்தோடு
  rationale: பணிவும் எதிர்ப்பற்ற மென்மையும் கலந்த ஏற்றுக்கொள்ளும் மனநிலையை இயல்பான தமிழில் தருகிறது.
- source_word: δέξασθε
  choice: ஏற்றுக்கொள்ளுங்கள்
  rationale: செயல்மிக்க வரவேற்பைக் கோரும் கட்டளை வலிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὸν ἔμφυτον λόγον
  choice: உங்களுக்குள் பதிக்கப்பட்ட வார்த்தையை
  rationale: ἔμφυτος என்பதில் உள்ள ‘உள்ளே பதிக்கப்பட்டது/வளர்ந்தது’ என்ற கருத்தைப் பாதுகாக்கிறது; அதை ஒட்டுக்கட்டுதல் என்ற அரிதான உருவகத்தால் மறைக்கவில்லை. ‘உங்களுக்குள்’ என்பது பெறுநர்களிடம் அது பதிந்திருப்பதைத் தமிழில் தெளிவாக்குகிறது; யார் பதித்தார் என்பதை உரை தீர்மானிக்கவில்லை.
- source_word: τὸν δυνάμενον σῶσαι
  choice: இரட்சிக்க வல்லது
  rationale: வார்த்தைக்கு இரட்சிக்கும் வல்லமை உண்டு என்ற கூற்றை, அதன் செயல்முறையை மேலதிகமாக விளக்காமல் பாதுகாக்கிறது.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: உங்கள் ஆத்துமாக்களை
  rationale: ψυχή என்பதன் பாரம்பரியமான தனிநபரின் உள்மையான உயிர்/தன்னைச் சுட்டும் மதச்சார்ந்த நிறையைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: இரட்சிப்பு சூழலில் ψυχὰς ὑμῶν என்பதன் பொருள்
  choice: உங்கள் ஆத்துமாக்களை
  alternative: உங்கள் உயிர்களை; உங்களையே
  rationale: ‘ஆத்துமாக்கள்’ என்பது இரட்சிப்பு மொழியின் இறையியல் நிறையைப் பாதுகாக்கிறது. அதேவேளை ψυχή முழு நபரையோ உயிரையோ குறிக்கக்கூடும் என்பதால் அந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- issue: ἔμφυτον λόγον என்பதன் பொருள்
  choice: உங்களுக்குள் பதிக்கப்பட்ட வார்த்தை
  alternative: உள்ளியல்பான வார்த்தை; ஒட்டுப்பதிக்கப்பட்ட வார்த்தை
  rationale: வார்த்தை கடவுளால் பதிக்கப்பட்டதா அல்லது இப்போது கேட்போருக்குள் வேரூன்றியிருக்கிறதா என்பதைத் திட்டவட்டமாகத் தீர்மானிக்காமல் கிரேக்கத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தை’, ‘ஆத்துமா’, ‘இரட்சிக்க’ ஆகியவை இச்சூழலின் இறையியல் நிறையைப் பாதுகாக்கின்றன; அரிதான அல்லது மிகப் பழமையான சொற்றொடர்கள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
