reference: James 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: ta
  text: பின்பு ஆசை கருத்தரித்து, பாவத்தைப் பெற்றெடுக்கிறது; பாவமோ முழுமை அடைந்தபோது[a], மரணத்தைப் பிறப்பிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முதிர்ச்சி அடைந்தபோது’ அல்லது ‘முழுவளர்ச்சி அடைந்தபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: பின்பு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சோதனையிலிருந்து ஆசை, பாவம், மரணம் எனத் தொடரும் நிகழ்வரிசையை இயல்பாகக் குறிக்கிறது.
- source_word: ἐπιθυμία
  choice: தவறான ஆசை
  rationale: இச்சொல் இங்கு பொதுவாகவே தீயதை நாடும் ஆசையைக் குறிக்கிறது; வெறும் ‘ஆசை’ தமிழில் நல்ல அல்லது நடுநிலையான விருப்பமாகவும் புரியக்கூடும், ‘இச்சை’ பாலியல் பொருளுக்கு அளவுக்கு மீறிச் சுருங்கக்கூடும்.
- source_word: συλλαβοῦσα
  choice: கருத்தரித்து
  rationale: பெற்றெடுக்கும் உருவகத்துடன் நெருக்கமாக இணைந்துள்ள கருத்தரித்தல் படிமத்தையும், முதன்மை வினைக்கு முன்னதாக நிகழும் செயலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τίκτει
  choice: பெற்றெடுக்கிறது
  rationale: கருத்தரித்தல்–பிறப்பு உருவகத்தை நவீன தமிழில் தெளிவாகக் கொண்டுவருகிறது.
- source_word: ἁμαρτίαν
  choice: பாவத்தை
  rationale: ஒழுக்கத் தீமையைக் குறிக்கும் இச்சொல்லுக்கான நிலையான, சூழலுக்குப் பொருத்தமான தமிழாக்கம்.
- source_word: δὲ
  choice: பாவமோ
  rationale: கூர்மையான எதிர்மறையை உருவாக்காமல், அடுத்த கட்டத்திற்கு நகர்த்தும் δέ-யின் தொடர்ச்சியைத் தமிழின் தலைப்பு மாற்றும் ‘-ஓ’ வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀποτελεσθεῖσα
  choice: முழு வளர்ச்சி அடைந்தபோது
  rationale: நிறைவு அல்லது முதிர்ச்சி அடைதலைக் குறிக்கும் சொற்பொருளை, உயிர்ப்பிறப்பு–வளர்ச்சி உருவகத்திற்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: ἀποκύει
  choice: பிறப்பிக்கிறது
  rationale: இச்சொல்லிலும் உள்ள பிறப்பு உருவகத்தைப் பாதுகாக்கிறது; முன் வந்த ‘பெற்றெடுக்கிறது’ என்பதிலிருந்து சிறிது வேறுபடுத்தியும் கூறுகிறது.
- source_word: θάνατον
  choice: மரணத்தை
  rationale: மூலத்தில் உள்ளபடியே அதன் உடல், ஆன்மீக அல்லது நித்திய பரப்பைச் சுருக்காமல் நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ஆசை, பாவம், மரணம் ஆகியவற்றை இணைக்கும் உருவகம்
  choice: கருத்தரித்தல், பெற்றெடுத்தல், வளர்ச்சி, பிறப்பித்தல் ஆகிய ஆளுருவாக்கப்பட்ட பிறப்பு உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘ஆசை பாவத்திற்கு வழிவகுக்கிறது; பாவம் மரணத்திற்கு வழிவகுக்கிறது’ என்று வெறும் காரணத் தொடராக மாற்றுதல்
  rationale: வெறும் காரண விளக்கமாக மாற்றினால் மூலத்தின் வலிமையான பிறப்பு உருவகமும், சோதனை மரணமாக வளர்வதைக் காட்டும் தொடர்ச்சியும் தட்டையாகிவிடும்.
- issue: θάνατος என்பதன் பரப்பு
  choice: ‘மரணம்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘ஆன்மீக மரணம்’ அல்லது ‘நித்திய மரணம்’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை மரணத்தின் வகையை வரையறுக்கவில்லை; அந்தத் திறந்த, கனமான பொருளை மொழிபெயர்ப்பும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘தவறான ஆசை’ என்பது சூழலில் எதிர்மறையான ἐπιθυμία-வைத் தெளிவாக்குகிறது; அதேவேளை அதை பாலியல் ஆசையாக மட்டும் சுருக்கவில்லை. பிறப்பு உருவகம் முழுவதும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
