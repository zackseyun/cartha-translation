id: JAS.1.1
reference: James 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: ta
  text: 'கடவுளுக்கும் ஆண்டவராகிய இயேசு மெசியாவுக்கும்[a] அடிமையான[b] யாக்கோபு, சிதறி வாழும்[c] பன்னிரண்டு கோத்திரங்களுக்கு: வாழ்த்துகள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம். Χριστός என்ற கிரேக்கப் பட்டம் ‘மெசியா’ என்றும், பெயர்போல் பயன்படும் இடங்களில் ‘கிறிஸ்து’ என்றும் வழங்கப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘ஊழியர்’ என்றும் மொழிபெயர்க்கலாம். δοῦλος என்ற கிரேக்கச் சொல் ஓர் எஜமானுக்குச் சொந்தமானவரைக் குறிக்கிறது; அந்த வலுவான பொருளைப் பாதுகாக்க இங்கு ‘அடிமை’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, இஸ்ரவேல் நாட்டுக்கு வெளியே சிதறி வாழ்ந்த யூத மக்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: யாக்கோபு
  rationale: கிரேக்கப் பெயரின் வரலாற்று மற்றும் ஒலிவடிவத்துக்கு ஏற்ற, தமிழில் நிலைபெற்ற வேதாகமப் பெயர்; ஆங்கில மரபிலுள்ள ‘James’ என்பதைக் கடனாகப் பின்பற்றவில்லை.
- source_word: θεοῦ
  choice: கடவுள்
  rationale: δοῦλος என்பதுடன் தொடர்புடைய உடைமை வேற்றுமையை இயல்பான தமிழ் இணைப்பால் ‘கடவுளுக்கு ... அடிமையான’ எனக் காட்டுகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இயேசுவின் அதிகாரத்தைக் குறிக்கும் நிலைபெற்ற புதிய ஏற்பாட்டுப் பட்டத்தைப் பாதுகாக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பொருளை வெளிப்படையாகப் பாதுகாக்க ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; பெயர்போல் நிலைபெற்ற ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: எஜமானுக்குச் சொந்தமானவர் என்ற சொல்லின் வலுவான பொருளையும், கடவுளுக்கும் ஆண்டவர் இயேசு மெசியாவுக்கும் முழுமையாக உரியவர் என்ற சுயஅடையாளத்தையும் பாதுகாக்கிறது.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: பன்னிரண்டு கோத்திரங்களுக்கு
  rationale: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களைக் குறிக்கும் உடன்படிக்கைச் சொல்வழக்கை பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: διασπορᾷ
  choice: சிதறி வாழும்
  rationale: யூதர்கள் தங்கள் தாய்நாட்டுக்கு வெளியே பரவியிருப்பதைக் குறிக்கும் சொல்லை நவீனத் தமிழில் புரியும்படி தருகிறது; அதன் வரலாற்றுச் சிறப்புப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: χαίρειν
  choice: வாழ்த்துகள்
  rationale: கடிதத் தொடக்கத்தில் பயன்படும் மரபுவழி வாழ்த்துச் சொல்லாக இருப்பதால், சொற்பிறப்பியல் சார்ந்த ‘மகிழுங்கள்’ என்பதற்குப் பதில் அதன் சூழற்பொருள் தரப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστοῦ என்பதைக் பட்டமாகவா, பெயரின் பகுதியாகவா மொழிபெயர்ப்பது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவை அடையாளப்படுத்தும் பட்டத்தின் பொருள் இன்னும் உயிரோடு இருப்பதால் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது; தமிழில் நிலைபெற்ற பெயர்வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: யாக்கோபின் சுயஅடையாளத்தில் δοῦλος என்பதன் வலிமை
  choice: அடிமை
  alternative: ஊழியர்
  rationale: இச்சொல் வெறும் சேவை செய்வதைவிட எஜமானுக்குச் சொந்தமான நிலையைக் குறிக்கிறது. அந்தத் தத்துவார்த்த வலிமையைத் தளர்த்தாமல், வாசகர்களுக்குத் தெரிந்த சொல்லைத் தேர்ந்தெடுக்கிறது.
- issue: θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ என்பதில் உறவின் அமைப்பு
  choice: கடவுளுக்கும் ஆண்டவராகிய இயேசு மெசியாவுக்கும் அடிமையான
  alternative: கடவுளின் அடிமையும் ஆண்டவர் இயேசு மெசியாவின் அடிமையும் ஆன
  rationale: ஒரே δοῦλος இருவருடனும் தொடர்புடைய கிரேக்க அமைப்பைப் பாதுகாத்து, இயல்பான தமிழில் ஒரே சுயஅடையாளமாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கடிதத் தொடக்கத்தின் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘கோத்திரம்’, ‘ஆண்டவர்’, ‘மெசியா’ போன்ற வேதாகமச் சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டாலும், வாக்கிய அமைப்பு பொதுவாசகர்களுக்குப் புரியும் வகையில் எளிமைப்படுத்தப்பட்டுள்ளது.
