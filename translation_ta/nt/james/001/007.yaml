  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: ta
  text: ஏனெனில், அந்த மனிதன்[a] ஆண்டவரிடமிருந்து எதையும் பெறுவான் என்று நினைக்கக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நபர்.’ கிரேக்கத்தில் இது ஆண்பால் ஒருமையில் (‘அந்த மனிதன்’) உள்ளது; ஆனால் முந்தைய வசனத்தில் விவரிக்கப்படும் சந்தேகப்படும் தனிநபரைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: ஏனெனில் ... நினைக்க வேண்டாம்
  rationale: γάρ முந்தைய வசனத்தில் விவரிக்கப்பட்ட சந்தேகப்படுகிற மனிதனைப் பற்றிய விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்தத் தொடர்பைப் பேணுகிறது. μή உடன் வரும் மூன்றாம் நபர் கட்டளை வடிவத்தின் தடைப் பொருளை, நவீன தமிழில் இயல்பாக ‘நினைக்க வேண்டாம்’ தெரிவிக்கிறது.
- source_word: οἰέσθω
  choice: நினைக்க வேண்டாம்
  rationale: οἴομαι என்பதன் அடிப்படைப் பொருள் ‘நினை, கருது, எண்ணிக்கொள்.’ இங்கு ‘நினைக்க வேண்டாம்’ என்பது எச்சரிக்கையுடன் கூடிய தடைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: அந்த மனிதன்
  rationale: கிரேக்கச் சொற்றொடர் ஆண்பால் ஒருமையில் இருந்து, முந்தைய வசனத்தில் கூறப்பட்ட சந்தேகப்படுகிற தனிநபரைக் குறிக்கிறது. ‘அந்த மனிதன்’ மூலத்தின் இலக்கண வடிவத்தையும் உரையாடல் தொடர்பையும் பேணுகிறது; அதன் பிரதிநிதித்துவப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அந்த மனிதன் எதை நினைக்கக் கூடாது என்பதன் உள்ளடக்கத்தை ὅτι அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோள்/உள்ளடக்க வாக்கியத்தை இயல்பாக இணைக்கும் ‘என்று’ இதற்கு ஏற்றது.
- source_word: λήμψεταί
  choice: பெற்றுக்கொள்வான்
  rationale: λαμβάνω என்பதன் எதிர்கால வடிவம். ‘பெற்றுக்கொள்வான்’ என்பது வருங்காலப் பொருளையும், ஆண்டவரிடமிருந்து கிடைப்பது என்ற பெறுதல் கருத்தையும் தெளிவாகத் தருகிறது. ‘தான்’ என்பது நினைப்பவனே பெறுபவன் என்பதைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: τι
  choice: எதையாவது
  rationale: தடைச் சூழலில் τι என்பது வரையறுக்கப்படாத ‘எதையும்/எதையாவது’ என்ற விரிவான பொருளைக் கொண்டது. இங்கு ‘எதையாவது ... பெற்றுக்கொள்வான் என்று நினைக்க வேண்டாம்’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: παρὰ τοῦ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: παρά உடன் வரும் வேற்றுமை வடிவம் மூலத்தை, ‘இடமிருந்து,’ குறிக்கிறது. κύριος என்பதை அதன் குறிப்பிட்ட ஆளைக் கூடுதலாக விளக்காமல் வழக்கமான ‘ஆண்டவர்’ என்ற பட்டத்தால் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: τοῦ κυρίου என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: கடவுள்; ஆண்டவராகிய கடவுள்
  rationale: கிரேக்கம் κύριος என்ற பட்டத்தை மட்டுமே பயன்படுத்துகிறது; இந்த வசனம் குறிப்பிடுவதைவிடத் துல்லியமாக அடையாளப்படுத்தாமல் ‘ஆண்டவர்’ என்றே வைத்திருப்பது மூலத்தின் சொல்லாட்சியையும் சாத்தியமான குறிப்புத் திறப்பையும் பேணுகிறது.
- issue: ὁ ἄνθρωπος ἐκεῖνος என்பதிலுள்ள பாலின வடிவம்
  choice: அந்த மனிதன்
  alternative: அந்த நபர்
  rationale: கிரேக்கத்தில் இச்சொற்றொடர் ஆண்பால் ஒருமையில் உள்ளது; அதனால் மூலத்தின் வடிவத்தைப் பேணும் ‘அந்த மனிதன்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது. அது முந்தைய வசனத்தில் விவரிக்கப்பட்ட சந்தேகப்படுகிற தனிநபரைப் பிரதிநிதியாகக் குறிக்கிறது என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்றாம் நபர் கட்டளையின் தடைப் பொருள் ‘நினைக்க வேண்டாம்’ என இயல்பாக்கப்பட்டுள்ளது; ‘தான்’ என்பது நினைப்பவனுக்கும் பெறுபவனுக்கும் உள்ள ஒரே குறியீட்டைத் தெளிவாக்குகிறது.
