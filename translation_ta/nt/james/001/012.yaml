source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ta
  text: சோதனையை[a] மனஉறுதியுடன் தாங்குகிற மனிதன் பேறுபெற்றவன். ஏனெனில், சோதனையில் உண்மையானவன் என நிரூபிக்கப்பட்ட பின்பு, அவர் தம்மை நேசிக்கிறவர்களுக்கு வாக்களித்த வாழ்வின் கிரீடத்தை[b] அவன் பெற்றுக்கொள்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூண்டுதல்’ அல்லது ‘பரீட்சை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் துன்பத்தின் வழியாக வரும் சோதனையையும் பாவத்துக்கான தூண்டுதலையும் குறிக்கக்கூடும்; இங்கு சோதனையை நிலைத்துத் தாங்குவதே வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கிரீடம்’ என்பதற்கான கிரேக்கச் சொல் அரசரின் மணிமுடியை மட்டுமல்லாமல், வெற்றியாளருக்கு அளிக்கப்படும் வெற்றி மாலையையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: பேறுபெற்றவன்
  rationale: வெறும் மனநிலையான ‘மகிழ்ச்சி’ என்பதைக் காட்டிலும், கடவுளின் அருளுக்கும் அங்கீகாரத்துக்கும் உரிய நல்வாழ்வு என்ற வாழ்த்துரைத் தன்மையை இது காக்கிறது.
- source_word: ἀνὴρ
  choice: மனிதன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையாக இருந்தாலும் இங்கு பொதுவாக ஒருவரைக் குறிக்கிறது; நவீன தமிழில் ‘மனிதன்’ மூல வடிவையும் பிரதிநிதித்துவப் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: ὑπομένει
  choice: மனஉறுதியுடன் தாங்குகிற
  rationale: அழுத்தத்தின் கீழ் வெறுமனே சகிப்பது மட்டுமல்லாமல் நிலைத்திருக்கும் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πειρασμόν
  choice: சோதனையை
  rationale: இச்சூழலில் தாங்குதல், நிரூபிக்கப்படுதல், பலன் பெறுதல் ஆகியவை முன்னிலையாக இருப்பதால் ‘சோதனை’ பொருத்தமானது; பாவத்துக்கான தூண்டுதல் என்ற சாத்தியப் பொருளை அடிக்குறிப்பு காக்கிறது.
- source_word: δόκιμος γενόμενος
  choice: தகுதியுள்ளவன் என்று நிரூபிக்கப்பட்ட பின்பு
  rationale: சோதனையின் வழியாகச் சென்று ஏற்றுக்கொள்ளத்தக்கவன் அல்லது உண்மையானவன் என நிரூபிக்கப்படுவதையும், பங்கேற்புச் சொல்லின் காலத் தொடர்பையும் தெளிவாகத் தருகிறது.
- source_word: λήμψεται
  choice: பெற்றுக்கொள்வான்
  rationale: வாக்களிக்கப்பட்ட பலனை எதிர்காலத்தில் பெறுவான் என்ற இயல்பான தமிழாக்கம்.
- source_word: στέφανον
  choice: கிரீடத்தை
  rationale: பழக்கமான வேதாகமப் பயன்பாட்டைக் காக்கிறது; இது அரசரின் மணிமுடியை அவசியம் குறிக்காது என்ற பண்பாட்டு நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῆς ζωῆς
  choice: வாழ்வின்
  rationale: கிரேக்க உரையின் தொடர்புவேற்றுமையை விளக்கவுரை சேர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: ἐπηγγείλατο
  choice: அவர் வாக்களித்த
  rationale: இறந்தகால வினையின் இயல்பான தமிழ் வடிவம்; சூழல்படி மறைமுக எழுவாய் கடவுள் என்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: தம்மை நேசிக்கிறவர்களுக்கு
  rationale: வாக்குறுதியைப் பெறுவோர் அவரை வழக்கமாக நேசிப்பவர்கள் என்பதை நிகழ்காலப் பெயரெச்சம் இயல்பாகத் தெரிவிக்கிறது; ‘தம்மை’ என்பது வாக்குறுதி அளிப்பவரையே சுட்டுகிறது.
theological_decisions:
- issue: யாக்கோபு 1:12-இல் πειρασμός என்பதன் பொருள்
  choice: சோதனை
  alternative: தூண்டுதல் அல்லது பரீட்சை
  rationale: உடனடியான சூழலில் மனஉறுதியுடன் தாங்குதல், நிரூபிக்கப்படுதல், பலன் பெறுதல் ஆகியவை வலியுறுத்தப்படுகின்றன. ஆகவே முதன்மை உரையில் ‘சோதனை’ தேர்ந்தெடுக்கப்படுகிறது; இருப்பினும் பாவத்துக்கான தூண்டுதல் என்ற சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
- issue: ὃν ἐπηγγείλατο என்பதின் மறைமுக எழுவாய்
  choice: வாக்குறுதி அளித்தவர் கடவுள்; ‘அவர்’ என மொழிபெயர்த்தல்
  alternative: மறைமுக எழுவாயை வெளிப்படையாக அடையாளப்படுத்தாமல் விடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் பெயரால் குறிப்பிடப்படவில்லை என்றாலும், சூழலும் ‘தம்மை நேசிக்கிறவர்கள்’ என்ற சொற்றொடரும் கடவுளையே இயல்பாகச் சுட்டுகின்றன. தமிழில் முழுமையான வாக்கியத்திற்காக ‘அவர்’ தேவை; ‘கடவுள்’ என்று பெயரைச் சேர்க்காமல் மூலத்தின் மறைமுகத்தன்மை ஓரளவு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘பேறுபெற்றவன்’ வாழ்த்துரைத் தன்மையை காக்கிறது; ‘மனஉறுதியுடன் தாங்குகிற’ என்பது நிலைத்திருத்தலைத் தெளிவாக்குகிறது. இரு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
