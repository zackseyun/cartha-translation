source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: ta
  text: தீமைக்குத் தூண்டப்படுகிற எவரும், “நான் கடவுளால் தூண்டப்படுகிறேன்” என்று சொல்லக்கூடாது. ஏனெனில், கடவுள் தீமைகளால் கவரப்பட முடியாதவர்[a]; அவரே எவரையும் தீமைக்குத் தூண்டுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “கடவுள் தீமைகளால் தூண்டப்பட இயலாதவர்.” கிரேக்கத்தில் உள்ள அரிய சொல்லின் துல்லியமான நுணுக்கம் விவாதத்திற்குரியது; இச்சூழலில் கடவுள் தீய தூண்டுதலுக்கு உட்படாதவர் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: எவனும் ... சொல்ல வேண்டாம்
  rationale: எதிர்மறை வரையறையற்ற பெயர்ச்சொல்லையும் மூன்றாம் நபர் கட்டளை வினையையும் இயல்பான நவீனத் தமிழ்த் தடையாக வழங்குகிறது.
- source_word: πειραζόμενος
  choice: சோதிக்கப்படுகிற
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் தொடரும் தன்மையைப் பேணுகிறது; இச்சூழலில் பாவத்துக்குத் தூண்டும் சோதனையே குறிக்கப்படுகிறது.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: கடவுளால் நான் சோதிக்கப்படுகிறேன்
  rationale: ἀπό இங்கு மூலத்தையும் செயற்படுத்துபவரையும் குறிக்கிறது; செயப்பாட்டு வடிவம் தமிழிலும் பேணப்படுகிறது.
- source_word: ἀπείραστός ... κακῶν
  choice: தீமைகளால் சோதிக்கப்பட முடியாதவர்
  rationale: அரிய பெயரடையின் பொருளை இயல்பான தமிழில் விரித்துரைக்கிறது; κακῶν என்பதன் பன்மைத் தோற்றத்தை ‘தீமைகள்’ எனப் பேணுகிறது.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: அவரும் எவனையும் சோதிப்பதில்லை
  rationale: αὐτός தரும் வலியுறுத்தலை ‘அவரும்’ மூலம் சுருக்கமாக உணர்த்தி, οὐδένα என்பதைக் ‘எவனையும் ... இல்லை’ என்ற இயல்பான எதிர்மறை அமைப்பில் தருகிறது.
theological_decisions:
- issue: πειράζω என்ற சொல்லின் இவ்வசனத்திற்குரிய பொருள்
  choice: எல்லா இடங்களிலும் ‘சோதி/சோதிக்கப்படு’ என்று மொழிபெயர்த்து, சூழல் அதைத் தீமைக்கான தூண்டுதலாக வரையறுக்க அனுமதித்தல்
  alternative: ‘பாவம் செய்யத் தூண்டு/தூண்டப்படு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: தமிழில் ‘சோதனை’ என்பது பரிசோதனையையும் தீமைக்கான கவர்ச்சியையும் குறிக்கக்கூடும். ஒரே கிரேக்கச் சொல்லின் மீளுரைப்பைப் பேணுவதோடு, அடுத்த வசனங்களின் சூழல் இங்கு தீய தூண்டுதல் குறிக்கப்படுவதைத் தெளிவுபடுத்துகிறது; தேவன் வேறு பொருளில் சோதிப்பது பற்றிய வேதாகமப் பதற்றத்தையும் இது முன்கூட்டியே நீக்காது.
- issue: ἀπείραστός ἐστιν κακῶν என்பதன் பொருள்
  choice: ‘தீமைகளால் சோதிக்கப்பட முடியாதவர் கடவுள்’
  alternative: ‘கடவுள் தீமைகளில் அனுபவமற்றவர்’ அல்லது ‘தீமைகளால் கடவுளைச் சோதிக்கக் கூடாது’
  rationale: இலக்கண-சொற்பொருள் சிக்கலைக் குறிப்பில் வெளிப்படுத்தியபடி, அடுத்துள்ள ‘அவரும் எவனையும் சோதிப்பதில்லை’ என்ற கூற்றுடன் மிக இயல்பாக இணையும் பொருளை முதன்மை உரை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் மீண்டும் வரும் πειράζω சொல்லுக்கு ஒரே தமிழ்ச் சொல்வேரைப் பேணியதால் வசனத்தின் சொல்லியல் இணைப்பு நிலைக்கிறது.
