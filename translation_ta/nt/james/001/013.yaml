revisions:
- from: சோதிக்கப்படுகிற எவனும், “கடவுளால் நான் சோதிக்கப்படுகிறேன்” என்று சொல்ல வேண்டாம். ஏனெனில், தீமைகளால் சோதிக்கப்பட முடியாதவர் கடவுள்[a]; அவரும் எவனையும் சோதிப்பதில்லை.
  to: தீமைக்குத் தூண்டப்படுகிற எவரும், “நான் கடவுளால் தூண்டப்படுகிறேன்” என்று சொல்லக்கூடாது. ஏனெனில், கடவுள் தீமைகளால் கவரப்பட முடியாதவர்[a]; அவரே எவரையும் தீமைக்குத் தூண்டுவதில்லை.
