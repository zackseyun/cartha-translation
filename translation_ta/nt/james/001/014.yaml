review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies each person's own desire as the proximate source of temptation and retains the paired lure imagery. However, «கவர்ந்திழுக்கப்படும்போது» makes the two Greek present participles explicitly temporal (“when ...”), whereas they describe the person's accompanying condition in being tempted. The revision retains the participial coordination without adding that temporal relation.
  naturalness: The revised wording is idiomatic modern standard Tamil and reads as a single coherent sentence. «இழுத்துச் செல்லப்பட்டும் கவரப்பட்டும்» is preferable to the mixed construction ending in «-படும்போது».
  terminology: «சோதிக்கப்படுகிறார்» suitably renders πειράζεται in this immediate context, while allowing the surrounding context to specify temptation rather than a neutral trial. «தன் சொந்த ஆசை» preserves the emphatic possessive force of ἰδίας without unnecessarily imposing grammatical gender. The footnote appropriately notes that ஆசை is broader than sexual desire.
  issues:
  - severity: medium
    issue: The phrase «இழுத்துச் செல்லப்பட்டு, கவர்ந்திழுக்கப்படும்போது» introduces a temporal “when” relationship.
    rationale: ἐξελκόμενος καὶ δελεαζόμενος consists of coordinated present participles qualifying the individual who is tempted; the Greek does not state that temptation occurs only after or when these actions happen. Coordinated Tamil participial forms preserve the relation more closely.
  revised_text: ஆனால், ஒவ்வொருவரும் தன் சொந்த ஆசையால்[a] இழுத்துச் செல்லப்பட்டும் கவரப்பட்டும்[b] சோதிக்கப்படுகிறார்.
