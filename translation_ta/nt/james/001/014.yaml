source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: ta
  text: ஆனால், ஒவ்வொருவரும் தன் சொந்த ஆசையால்[a] இழுத்துச் செல்லப்பட்டும் கவரப்பட்டும்[b] சோதிக்கப்படுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் சொந்த பேராசையால்” அல்லது “தன் சொந்த இச்சையால்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பாலியல் ஆசையை மட்டும் அல்ல, பொதுவாக வலுவான விருப்பத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “இழுத்துச் செல்லப்பட்டும் கவரப்பட்டும்” என்ற இணைச்சொற்கள், இரையையோ மீனையையோ வலை அல்லது தூண்டிலுக்கு இழுத்துக் கவரும் காட்சியை நினைவூட்டுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: கிரேக்கச் சொல்லின் பகிர்ந்தளிக்கும் ஒருமை வலியுறுத்தலை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கடவுள் யாரையும் சோதிப்பதில்லை என்று கூறியதற்கும், இங்கு சோதனையின் உடனடி மூலத்தை விளக்குவதற்கும் இடையிலான மிதமான முரண்பாட்டைக் குறிக்கிறது.
- source_word: πειράζεται
  choice: சோதனைக்குள்ளாகிறார்
  rationale: இச்சூழலில் பாவத்துக்கு இட்டுச் செல்லும் சோதனையைக் குறிக்கிறது; அதேவேளை தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: தன்னுடைய ஆசையால்
  rationale: சோதனையின் உடனடி காரணம் அந்த நபருக்கே உரிய ஆசை என்பதையும் தனிப்பட்ட பொறுப்பையும் வெளிப்படுத்துகிறது.
- source_word: ἐπιθυμίας
  choice: ஆசை
  rationale: இந்தச் சொல் வலுவான விருப்பத்தைக் குறிக்கக்கூடும்; அதை பாலியல் இச்சைக்கு மட்டும் குறுக்காமல், சூழலுக்கேற்ற பரந்த பொருளைக் காக்கிறது.
- source_word: ἐξελκόμενος
  choice: இழுத்துச் செல்லப்பட்டு
  rationale: ஒருவரைத் தன் இடத்திலிருந்து வெளியே இழுக்கும் உருவகத்தைக் காக்கும் இயல்பான தமிழ்.
- source_word: δελεαζόμενος
  choice: கவர்ந்திழுக்கப்படும்போது
  rationale: இரை அல்லது மீனைத் தூண்டிலால் கவர்ந்து வலையில் சிக்கவைக்கும் உருவகப் பொருளை வாசிக்க இயல்பான முறையில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: சோதனையின் மூலம் கடவுளா அல்லது மனிதனுடைய சொந்த ஆசையா
  choice: சோதனையின் உடனடி மூலமாக ஒவ்வொருவருடைய சொந்த ஆசையையே வசனம் சுட்டுகிறது.
  alternative: இதை வெறும் வெளிப்புறச் சூழ்நிலைகளால் வரும் பொதுவான பரிசோதனை என்று மென்மையாக்குதல்.
  rationale: முந்தைய வசனம் கடவுள் யாரையும் சோதிப்பதில்லை என்று மறுக்கிறது; இவ்வசனம் ஒருவருடைய சொந்த ஆசையை உடனடி மூலமாகக் காட்டுகிறது. இதற்கு அப்பாற்பட்ட காரணவியல் கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: பிரதிநிதித்துவ ஒருமையின் பாலின வெளிப்பாடு
  choice: ஒவ்வொருவரும் தன்னுடைய
  alternative: அவனவன் தன் சொந்த
  rationale: கிரேக்கத்தின் தனிநபர் ஒருமை வலியுறுத்தலைக் காக்கிறது; அதே நேரத்தில் நவீனத் தமிழில் இலக்கணப்பாலைக் கட்டாயமாகச் சேர்க்காமல் இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் தனிநபர் பொறுப்பும் வேட்டை/மீன்பிடி உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
