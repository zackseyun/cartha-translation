revisions:
- from: ஆனால் ஒவ்வொருவரும் தன்னுடைய ஆசையால்[a] இழுத்துச் செல்லப்பட்டு, கவர்ந்திழுக்கப்படும்போது[b] சோதனைக்குள்ளாகிறார்.
  to: ஆனால், ஒவ்வொருவரும் தன் சொந்த ஆசையால்[a] இழுத்துச் செல்லப்பட்டும் கவரப்பட்டும்[b] சோதிக்கப்படுகிறார்.
  rationale: The revision removes the unwarranted temporal subordinate clause and renders both Greek participles as coordinated Tamil participial expressions. It preserves the contrast with God in the preceding verse, personal responsibility, and the hunting/fishing-like imagery, without narrowing ἐπιθυμία to sexual desire.
  reviewer_model: gpt-5.6-terra
