source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: ta
  text: ஏனெனில், காட்டு விலங்குகள், பறவைகள், ஊர்வன, கடல்வாழ் உயிரினங்கள் ஆகியவற்றின் ஒவ்வொரு வகையும் மனித இனத்தால்[a] அடக்கப்பட்டு வருகிறது; அடக்கப்பட்டும் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனித இயல்பினால்” அல்லது “மனிதகுலத்தால்.” τῇ φύσει τῇ ἀνθρωπίνῃ என்ற கிரேக்கச் சொற்றொடர் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கலாம்; அல்லது இன்னும் அருவமான முறையில் மனித இயல்பையோ மனிதத் துறையையோ குறிக்கலாம். முதன்மை உரை அதை மனித இனத்தைக் குறிக்கும் கூட்டுப்பொருளில் எடுத்துக்கொள்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: எல்லா வகைகளும்
  rationale: விலங்கினங்களின் பட்டியலில் φύσις என்பது ‘இயல்பு’ என்பதைவிட ‘வகை/இனம்’ என்ற பொருளில் வருகிறது. πᾶσα என்பதன் முழுமையையும் இயல்பான தமிழில் இது தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் γάρ என்பதன் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: θηρίων
  choice: காட்டு விலங்குகள்
  rationale: θηρίον என்பதிலுள்ள வனவிலங்கு அல்லது அடக்கப்படாத விலங்கு என்ற உணர்வை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: πετεινῶν
  choice: பறவைகள்
  rationale: பறக்கும் உயிரினங்களைக் குறிக்கும் சொல்லுக்கு இயல்பான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: ἑρπετῶν
  choice: ஊர்வன
  rationale: தரையில் ஊர்ந்து செல்லும் உயிரினங்களைக் குறிக்கும் கிரேக்கச் சொல்லின் பரந்த உயிரியல் வகையைத் தமிழில் பொருத்தமாகக் காட்டுகிறது.
- source_word: ἐναλίων
  choice: கடல்வாழ் உயிரினங்கள்
  rationale: கடலில் வாழ்பவற்றைக் குறிக்கும் substantival adjective-இன் பரந்த பொருளைக் காக்கிறது; ‘மீன்கள்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: δαμάζεται
  choice: அடக்கப்பட்டுவருகின்றன
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடரும் அல்லது பொதுவாக நடைபெறும் செயலுணர்வை வெளிப்படுத்துகிறது.
- source_word: δεδάμασται
  choice: அடக்கப்பட்டும் இருக்கின்றன
  rationale: நிறைவேற்றப்பட்ட செயலின் தற்போதைய விளைவுநிலையை உணர்த்தும் perfect passive வடிவத்தை முந்தைய நிகழ்கால வினையிலிருந்து வேறுபடுத்திக் காக்கிறது.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: மனித இனத்தால்
  rationale: இங்கு சொற்றொடரைத் தனிப்பட்ட ‘மனித இயல்பு’ என்பதற்குப் பதிலாக ஒட்டுமொத்த மனிதகுலத்தைக் குறிக்கும் செய்பவராக எடுத்துக்கொள்கிறது; தமிழில் ‘மனித இனம்’ இயல்பான கூட்டுப்பெயர்.
theological_decisions:
- issue: τῇ φύσει τῇ ἀνθρωπίνῃ என்பதன் பொருள்
  choice: மனித இனத்தால்
  alternative: மனித இயல்பினால் / மனிதகுலத்தால்
  rationale: சூழலில் பல விலங்கு வகைகளுக்கு எதிராக மனிதர்களை ஒரு கூட்டாக நிறுத்துவது முதன்மையான வாசிப்பு. இருப்பினும் கிரேக்கச் சொற்றொடரில் ‘மனித இயல்பு/மனிதத் தன்மை’ என்ற அருவமான வாசிப்புக்கும் இடமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் நிகழ்காலச் செயப்பாட்டு வினைக்கும் perfect செயப்பாட்டு வினைக்கும் இடையிலான சொற்பொழிவு வேறுபாடு இரண்டு தனித்த தமிழ் வினைத்தொடர்களால் காக்கப்பட்டுள்ளது; பட்டியல் தமிழின் இயல்பான பன்மை அமைப்பில் தரப்பட்டுள்ளது.
