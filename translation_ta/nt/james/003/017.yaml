reference: James 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ta
  text: ஆனால் மேலிருந்து வரும் ஞானம் முதலில் தூய்மையானதாகவும், பின்னர் சமாதானத்தை விரும்புவதாகவும், கனிவானதாகவும், நியாயத்திற்குச் செவிசாய்வதாகவும், இரக்கமும் நற்கனிகளும் நிறைந்ததாகவும், பாரபட்சமற்றதாகவும்[a], பாசாங்கற்றதாகவும் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிளவுபடாதது”; இங்குள்ள கிரேக்கச் சொல் “ஐயமற்றது” அல்லது “தயக்கமற்றது” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: மேலிருந்து வரும்
  rationale: ‘மேலிருந்து’ என்ற இடஞ்சார்ந்த உருவகத்தைப் பாதுகாக்கிறது; சூழலில் பூமிக்குரிய ஞானத்திற்கு எதிராக மேலிருந்து வரும் ஞானத்தைக் குறிக்கிறது, ‘பரலோகத்திலிருந்து’ என்று தேவைக்கு மீறி விளக்கவில்லை.
- source_word: σοφία
  choice: ஞானம்
  rationale: இச்சூழலில் விவரிக்கப்படும் ஞானத்தின் தன்மையைக் குறிக்கும் இயல்பான, நிலையான தமிழ் சொல்.
- source_word: πρῶτον μὲν
  choice: முதலாவது
  rationale: பண்புகளின் வரிசையில் முதல் மற்றும் முதன்மையான பண்பைக் குறிக்கும் கிரேக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἁγνή
  choice: தூய்மையானது
  rationale: ஒழுக்கத் தூய்மையையும் கலப்பற்ற நேர்மையையும் நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔπειτα
  choice: பின்பு
  rationale: முதல் பண்பைத் தொடர்ந்து வரும் பண்புகளைக் குறிக்கும் வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰρηνική
  choice: சமாதானத்தை விரும்புவது
  rationale: அமைதியான நிலையை மட்டும் அல்லாமல், சமாதானத்தை நாடும் மனப்பாங்கையும் வெளிப்படுத்துகிறது.
- source_word: ἐπιεικής
  choice: கனிவானது
  rationale: கடுமையின்றி நடந்துகொள்ளும் மென்மை, விட்டுக்கொடுக்கும் நியாயம், பரிவு ஆகிய அர்த்தநிழல்களை எளிய நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: εὐπειθής
  choice: நியாயத்திற்குச் செவிசாய்ப்பது
  rationale: பிடிவாதமின்றி சரியான காரணத்தைக் கேட்டு ஏற்கத் தயாராக இருப்பதைத் தெரிவிக்கிறது; எளிதில் ஏமாறுவதைக் குறிக்கவில்லை.
- source_word: μεστὴ ἐλέους
  choice: இரக்கம் நிறைந்தது
  rationale: μεστή குறிக்கும் நிறைவையும் ἔλεος குறிக்கும் இரக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: καρπῶν ἀγαθῶν
  choice: நற்கனிகள் நிறைந்தது
  rationale: கிரேக்கப் பன்மையையும், செயல்களில் தென்படும் நல்ல விளைவுகள் என்ற கனி உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἀδιάκριτος
  choice: பாரபட்சமற்றது
  rationale: யாக்கோபில் காணப்படும் பாரபட்சம் குறித்த அக்கறைக்கும் இங்குள்ள சமூக-ஒழுக்கப் பண்புகளின் பட்டியலுக்கும் நன்கு பொருந்துகிறது; சொல்லின் பிற சாத்திய அர்த்தங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἀνυπόκριτος
  choice: பாசாங்கற்றது
  rationale: வெளிவேடமோ போலித்தனமோ இல்லாத உண்மைத்தன்மையைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: ἀδιάκριτος என்பதன் பொருள்
  choice: பாரபட்சமற்றது
  alternative: பிளவுபடாதது; ஐயமற்றது அல்லது தயக்கமற்றது
  rationale: இச்சொல் பாரபட்சமின்மையையோ, பிளவுபடாத நிலைப்பாட்டையோ, ஐயம் அல்லது தயக்கமின்மையையோ குறிக்கக்கூடும். யாக்கோபு 2:1–4-இன் பாரபட்ச எதிர்ப்பும், 1:6–8 மற்றும் 4:8-இன் இருமனப்பான்மை எதிர்ப்பும் இரு பொருள் வாய்ப்புகளுக்கும் சூழல்சார் ஆதரவு தருகின்றன. இரக்கம், நற்கனிகள், பாசாங்கின்மை ஆகியவற்றுடன் அமைந்துள்ள இப்பட்டியலில் ‘பாரபட்சமற்றது’ இயல்பாகப் பொருந்துவதால் முதன்மை உரையில் அது தேர்ந்தெடுக்கப்பட்டது; தெளிவின்மையை மறைக்காமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பண்புகளின் வரிசையும் கனி உருவகமும் பாதுகாக்கப்பட்டுள்ளன. εὐπειθής என்பதற்கு அடிமைத்தனமான கீழ்ப்படிதலை உணர்த்தாமல், நியாயமானதை ஏற்கும் திறந்த மனப்பாங்கைச் சொல்லும் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ἀδιάκριτος என்பதன் மொழிபெயர்ப்புக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
