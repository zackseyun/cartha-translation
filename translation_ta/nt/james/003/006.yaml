id: JAS.3.6
reference: James 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ta
  text: நாவும் ஒரு நெருப்பு. அநீதியின் ஓர் உலகமாக நாவு நம் உடல் உறுப்புகளிடையே அமைந்துள்ளது; உடல் முழுவதையும் கறைப்படுத்தி, பிறப்பின் சக்கரத்தைத் தீப்பற்றச் செய்கிறது; கெஹென்னாவால் தீப்பற்ற வைக்கப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γλῶσσα
  choice: நாவு
  rationale: சூழலில் உடல் உறுப்பாகிய நாவு பற்றிய உருவகம் தொடர்ந்து வருவதால், பேச்சு என்ற ஆகுபெயர்ப் பொருளையும் உள்ளடக்கும்படி நேரடியான சொல்லைத் தேர்ந்தெடுத்தோம்.
- source_word: πῦρ
  choice: நெருப்புதான்
  rationale: நாவையும் நெருப்பையும் நேரடியாக இணைக்கும் உருவகத்தின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: κόσμος τῆς ἀδικίας
  choice: அநீதியின் ஓர் உலகம்
  rationale: தீமையால் நிறைந்தது என்று விளக்கி எளிமைப்படுத்தாமல், கிரேக்கத்தின் வியப்பூட்டும் விரிவான உருவகத்தையும் ἀδικία என்பதன் ஒழுக்கவியல் பரப்பையும் காக்கிறது.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: நம் உடல் உறுப்புகளிடையே அமைந்திருந்து
  rationale: நாவின் இடத்தையும் நிலைப்பாட்டையும் தமிழில் தெளிவாகச் சொல்லி, அடுத்துவரும் உடல் குறித்த குறிப்புடன் தொடர்பைத் தக்கவைக்கிறது.
- source_word: σπιλοῦσα
  choice: கறைப்படுத்துகிறது
  rationale: கறை ஏற்படுத்துதல் என்ற படிமத்தையும் ஒழுக்கத் தீட்டின் உட்பொருளையும் ஒருங்கே காக்கும் இயல்பான தமிழ்.
- source_word: ὅλον τὸ σῶμα
  choice: உடல் முழுவதையும்
  rationale: ὅλον என்பதன் முழுமைப்படுத்தும் வலிமையை நேரடியாகத் தருகிறது.
- source_word: φλογίζουσα
  choice: தீப்பற்றச் செய்கிறது
  rationale: நெருப்பு உருவகத்தைத் தொடர்ந்து காத்து, செயப்பாட்டு வினையின் காரணப்படுத்தும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: பிறப்பின் சக்கரம்
  rationale: விளக்கவுரை செய்து பொருளை முன்கூட்டியே முடிவுசெய்யாமல், கடினமான கிரேக்கச் சொற்றொடரின் சக்கர உருவகத்தையும் γένεσις என்பதன் அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: φλογιζομένη
  choice: தீப்பற்ற வைக்கப்படுகிறது
  rationale: நாவு மற்றவற்றைத் தீப்பற்றச் செய்தாலும், அதுவே வேறொரு மூலத்தால் தீப்பற்ற வைக்கப்படுகிறது என்ற செயப்பாட்டு எதிர்மறை இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τῆς γεέννης
  choice: கெஹென்னாவால்
  rationale: பிற்கால பொதுவான இறையியல் சொல்லுக்குள் இதை ஒடுக்காமல், கிரேக்கத்தின் குறிப்பிட்ட பெயரை ஒலிபெயர்த்து வரலாற்று மற்றும் கருத்தியல் தனித்தன்மையைக் காக்கிறது.
theological_decisions:
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலத்தில் உள்ள குறிப்பிட்ட சொல்லைத் தக்கவைத்து, அதனுடன் தொடர்புடைய பிற்கால இறையியல் கருத்துகளை மொழிபெயர்ப்பிலேயே முன்கூட்டியே சேர்ப்பதைத் தவிர்க்கிறது; வழக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τὸν τροχὸν τῆς γενέσεως என்பதன் பொருள்
  choice: பிறப்பின் சக்கரம்
  alternative: வாழ்க்கையின் போக்கு / வாழ்க்கைச் சுழற்சி
  rationale: வாழ்க்கை முழுவதையும் குறிக்கும் வாய்ப்பு இருந்தாலும், மூலத்தின் அரிய சக்கர உருவகத்தையும் அதன் உண்மையான விளக்கத் தெளிவின்மையையும் முதன்மை உரையில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளோம். மூலத்தின் தொடர்ச்சியான நெருப்பு உருவகமும், “அநீதியின் ஓர் உலகம்” மற்றும் “பிறப்பின் சக்கரம்” ஆகிய திட்டமிட்ட கடினமான சொற்றொடர்களும் எளிமைப்படுத்தப்படாமல் காக்கப்பட்டுள்ளன; தேவையான இயல்பான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
