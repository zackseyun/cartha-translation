- from: நாவும் நெருப்புதான். அநீதியின் ஓர் உலகமாகிய நாவு, நம் உடல் உறுப்புகளிடையே அமைந்திருந்து, உடல் முழுவதையும் கறைப்படுத்துகிறது[a]; பிறப்பின் சக்கரத்தையே[b] தீப்பற்றச் செய்கிறது; அதுவோ கெஹென்னாவால்[c] தீப்பற்ற வைக்கப்படுகிறது.
