  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: ta
  text: மேலும், நீதியின் கனி சமாதானத்தில் சமாதானத்தை ஏற்படுத்துகிறவர்களால் விதைக்கப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρπὸς
  choice: கனி
  rationale: ‘கனி’ என்பது விதைத்தல் என்ற உருவகத்தோடு இயல்பாகப் பொருந்துவதோடு, கிரேக்க ஒருமைச் சொல்லின் உருவகத்தையும் காக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல், முந்தைய கருத்துடன் மென்மையாக இணைக்கிறது; நவீன தமிழில் ‘மேலும்’ அந்தத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: δικαιοσύνης
  choice: நீதியின்
  rationale: δικαιοσύνη என்பதன் ஒழுக்கநெறி மற்றும் உறவு/சட்டம் சார்ந்த பொருள் பரப்பை ‘நீதி’ தக்கவைக்கிறது. இதை ஒரே குறிப்பிட்ட இறையியல் பொருளாகச் சுருக்காமல், ‘நீதியின் கனி’ என்ற கிரேக்கச் சொற்றொடரின் திறந்த தன்மையும் காக்கப்படுகிறது.
- source_word: ἐν εἰρήνῃ
  choice: சமாதானத்தில்
  rationale: விதைத்தல் நிகழும் முறை அல்லது சூழல் என்ற இரு சாத்தியங்களையும் தீர்மானிக்காமல், கிரேக்க முன்னிடைச் சொற்றொடரை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: σπείρεται
  choice: விதைக்கப்படுகிறது
  rationale: கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவை இயல்பான தமிழ் செயப்பாட்டு வடிவில் தருகிறது; விதைப்பு உருவகமும் காக்கப்படுகிறது.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: சமாதானத்தை உண்டாக்குகிறவர்களால்
  rationale: செயப்பாட்டு வினையோடு வரும் வேற்றுமையைச் செய்பவரைக் குறிக்கும் பொருளில் எடுத்துக்கொள்கிறது. ποιέω + εἰρήνην என்ற வெளிப்படையான வினைச்சொல் அமைப்பை ‘சமாதானத்தை உண்டாக்குகிறவர்கள்’ தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நீதியின் கனி’ என்பதன் துல்லியமான தொடர்பு
  choice: நீதியால் சிறப்பிக்கப்படும் கனி அல்லது விளைவு என்ற பொருளை அனுமதிக்கும் வகையில் சொற்றொடரை அப்படியே வைத்தல்
  alternative: நீதியே அறுவடையாக விளைகிறது; அல்லது கனி நீதியை உருவாக்குகிறது
  rationale: δικαιοσύνης என்ற உருபின் தொடர்பு விளக்கவுரைக்குரிய பல சாத்தியங்களை உடையது. பரலோக ஞானமும் சமாதானமான நடத்தையும் தரும் நீதியான விளைவு என்பது சூழலுக்குப் பொருந்தினாலும், மொழிபெயர்ப்பு அந்தத் தொடர்பைத் தேவையின்றி முடிவுசெய்யவில்லை.
- issue: τοῖς ποιοῦσιν εἰρήνην என்பதன் வேற்றுமைப் பொருள்
  choice: விதைப்பவர்களைக் குறிக்கும் வகையில் ‘சமாதானத்தை உண்டாக்குகிறவர்களால்’
  alternative: பயனடைவோரைக் குறிக்கும் வகையில் ‘சமாதானத்தை உண்டாக்குகிறவர்களுக்காக’
  rationale: செயப்பாட்டு வினையான σπείρεται உடன் செய்பவர் சார்ந்த பொருள் சூழலில் இயல்பாக உள்ளது; எனினும் கிரேக்க வேற்றுமையின் மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘நீதி,’ ‘சமாதானம்,’ ‘கனி,’ ‘விதைக்கப்படுகிறது’ ஆகிய சொற்கள் மூலத்தின் ஒழுக்கநெறி மற்றும் வேளாண்மை உருவகங்களை இயல்பாகக் காக்கின்றன.
