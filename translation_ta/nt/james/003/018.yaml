  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன: καρπός என்பதன் வேளாண் உருவகம், δικαιοσύνης என்பதன் திறந்த தொடர்பு, ἐν εἰρήνῃ என்பதன் சொற்றொடர், நிகழ்காலச் செயப்பாட்டு σπείρεται, மற்றும் τοῖς ποιοῦσιν εἰρήνην என்பதற்கான செய்பவர்சார் வாசிப்பு. ஆயினும் ‘சமாதானத்தை உண்டாக்குகிறவர்களால்’ என்பது புரிந்துகொள்ளத்தக்கதாயிருந்தாலும், நவீனத் தமிழில் ‘சமாதானத்தை ஏற்படுத்துகிறவர்களால்’ மிகவும் இயல்பானது; இது ποιέω + εἰρήνην என்பதன் பொருளை மாற்றாது.'
  naturalness: ‘சமாதானத்தில்’ என்பதற்குப் பின்வந்த காற்புள்ளி தேவையற்ற இடைவெளியை உருவாக்குகிறது. அதை நீக்குவதும், ‘உண்டாக்குகிற’ என்பதற்குப் பதில் ‘ஏற்படுத்துகிற’ என்பதைக் கொள்வதும் வாசிப்பை இயல்பாக்குகின்றன.
