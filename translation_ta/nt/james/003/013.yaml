source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: ta
  text: உங்களில் ஞானமும் புரிதலும் உள்ளவர் யார்? அவர் தமது செயல்களை நல்ல நடத்தையால், ஞானத்தின் சாந்தத்தோடு[a] காட்டட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானத்திலிருந்து வரும் மென்மையோடு.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “காட்டட்டும்” என்பது ஆண்பால் ஒருமை வடிவில் உள்ளது; சமூகத்தில் இத்தகைய எந்த நபரையும் அது பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: உங்களில் ஞானமும் புரிதலும் உள்ளவர் யார்?
  rationale: சமூகத்தினரிடையே இந்தப் பண்புகள் உள்ளவரை வினவும் சொல்லாட்சியை இயல்பான நவீனத் தமிழில் தருகிறது. σοφός என்பது நடைமுறை மற்றும் அறநெறி ஞானத்தையும், ἐπιστήμων என்பது புரிதல் அல்லது அறிவுத்திறனையும் குறிக்கிறது.
- source_word: δειξάτω
  choice: காட்டட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வினையின் வலிமையைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: நல்ல நடத்தையால்
  rationale: ἀναστροφή என்பது ஒருவரின் நடத்தை அல்லது வாழும் முறையைக் குறிக்கிறது; ἐκ இங்கு அந்தச் செயல்கள் நல்ல நடத்தையின் வாயிலாக வெளிப்படுவதைச் சுட்டுகிறது.
- source_word: τὰ ἔργα αὐτοῦ
  choice: தமது செயல்களை
  rationale: ἔργα என்பதற்கு இயல்பான 'செயல்கள்' பயன்படுத்தப்பட்டுள்ளது. 'தமது' என்பது ஒருமை நபரைக் குறித்துத் தமிழில் மரியாதையுடனும் தெளிவுடனும் அமைகிறது.
- source_word: ἐν πραΰτητι σοφίας
  choice: ஞானத்திற்குரிய சாந்தத்தோடு
  rationale: πραΰτης குறிக்கும் அடக்கமான மென்மை மற்றும் சாந்தத்தைப் பாதுகாக்கிறது. σοφίας என்ற உருபுத் தொடர்பை முற்றிலும் காரணத் தொடர்பாக முடிவுசெய்யாமல், ஞானத்தால் சிறப்பிக்கப்படும் சாந்தம் எனத் தருகிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் வடிவத்தின் பிரதிநிதித்துவப் பயன்பாடு
  choice: அவர் ... காட்டட்டும்
  alternative: அத்தகையவர்கள் ... காட்டட்டும்
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் இருந்தாலும், சமூகத்தில் இத்தகைய எவரையும் பிரதிநிதித்துவமாகக் குறிக்கலாம். தமிழ் 'அவர்' ஒருமையையும் மரியாதையையும் காத்து, தேவையற்ற பாலின வரையறையைச் சேர்க்காது; இதன் பிரதிநிதித்துவ வலிமை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: σοφίας என்ற பிறப்புவேற்றுமையின் தொடர்பு
  choice: ஞானத்திற்குரிய சாந்தத்தோடு
  alternative: ஞானத்திலிருந்து வரும் சாந்தத்தோடு
  rationale: இது ஞானத்தால் பண்புறும் சாந்தமா அல்லது ஞானத்திலிருந்து பிறக்கும் சாந்தமா என்பதில் உள்ள உண்மையான இலக்கணத் திறப்பை முதன்மை உரை முழுமையாகத் தீர்மானிக்காது; மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான அறிவுறுத்தல் நடை. 'சாந்தம்' அறநெறிசார் πραΰτης என்பதைக் குறிக்கிறது; பலவீனம் என்ற பொருளைத் தவிர்க்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
