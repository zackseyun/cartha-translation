    rationale: “க்குரிய” can mean ‘appropriate to’ or ‘belonging to,’ while the Greek tersely associates πραΰτης with σοφία. “ஞானத்தின் சாந்தம்” retains the source’s ambiguity between an attributive and source-related understanding more closely.
