id: JAS.3.8
reference: James 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: ta
  text: ஆனால் மனிதர்களில் எவராலும் நாவை அடக்க முடியாது. அது கட்டுக்கடங்காத தீமை[a]; மரணத்தை விளைவிக்கும் நஞ்சால் நிறைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கட்டுக்கடங்காத தீமை” என்பதற்கு “அமைதியற்ற தீமை” அல்லது “நிலையற்ற தீமை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: நாவை
  rationale: உடல் உறுப்பைக் குறிக்கும் சொல்லைத் தக்கவைத்து, மனிதப் பேச்சுக்கான யாக்கோபின் தொடர்ச்சியான உருவகத்தையும் பாதுகாக்கிறது.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: மனிதர்களில் எவராலும் ... முடியாது
  rationale: ἀνθρώπων என்பதை οὐδείς உடன் தொடர்புடைய பகுதிப் பிறப்புவேற்றுமையாக எடுத்துக்கொண்டு, இயல்பான தமிழில் ‘மனிதர்களில் எவரும் இல்லை’ என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: δαμάσαι δύναται
  choice: அடக்க முடியாது
  rationale: δαμάζω என்பதன் ‘பழக்கி அடக்குதல்/அடக்குதல்’ என்ற கருத்தையும், முந்தைய வசனத்தின் விலங்குகளை அடக்கும் சூழலுடனான தொடர்பையும் காக்கிறது.
- source_word: ἀκατάστατον
  choice: அமைதியற்ற
  rationale: நிலையின்மை, கட்டுப்பாடின்மை, ஓயாத அசைவு ஆகிய நுணுக்கங்களைச் சுமக்கும் சொல்லுக்கு இச்சூழலில் இயல்பான தமிழ் இணை; சொல்லின் பல்வேறு சாத்தியங்களை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: κακόν
  choice: தீமை
  rationale: வெறும் தீங்கைக் காட்டிலும் இங்குள்ள அறநெறிசார் அழிவுத்தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: மரணத்தை விளைவிக்கும் நஞ்சால் நிறைந்தது
  rationale: ‘மரணத்தைச் சுமக்கும் நஞ்சு’ என்ற கிரேக்கத்தின் வலிமையை இயல்பான, தெளிவான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: οὐδεὶς உடன் ἀνθρώπων என்பதன் மனிதகுலப் பொதுப்பொருள்
  choice: மனிதர்களில் எவராலும்
  alternative: எந்த மனிதராலும்
  rationale: இது ஆண்களை மட்டும் குறிக்காமல் மனிதர்களில் ஒருவராலும் முடியாது என்ற பகுதிப் பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; தமிழில் தேவையற்ற பாலினக் குறுக்கீட்டை ஏற்படுத்தவில்லை.
- issue: நாவை அடக்க இயலாமை குறித்த கூற்றின் வலிமை
  choice: முடியாது
  alternative: எளிதில் முடியாது
  rationale: மூலத்தில் தளர்த்தும் சொல் ஏதுமில்லை; ஆகவே மனிதத் திறனைப் பற்றிய முழுமையான எதிர்மறைக் கூற்றை அதன் இறையியல் பதற்றத்துடன் அப்படியே வைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குத் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘நாவு’ என்ற உருவகம் காக்கப்பட்டுள்ளது; ἀκατάστατον என்பதின் உண்மையான சொற்பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
