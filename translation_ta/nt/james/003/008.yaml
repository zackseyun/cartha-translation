revisions:
- from: ஆனால் நாவை மனிதர்களில் எவராலும் அடக்க முடியாது. அது அமைதியற்ற தீமை[a]; மரணத்தை விளைவிக்கும் நஞ்சால் நிறைந்தது.
  to: ஆனால் மனிதர்களில் எவராலும் நாவை அடக்க முடியாது. அது கட்டுக்கடங்காத தீமை[a]; மரணத்தை விளைவிக்கும் நஞ்சால் நிறைந்தது.
  rationale: The revision improves the modern Tamil idiom and renders ἀκατάστατον more accurately in context as ‘unruly.’ The footnote retains ‘restless’ and ‘unstable’ as legitimate lexical possibilities. No change is made to the source’s absolute negation, human-wide reference, tongue metaphor, or deadly-poison imagery.
  reviewer_model: gpt-5.6-terra
