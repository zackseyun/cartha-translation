source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: ta
  text: என் சகோதரர்களே,[a] நாம் இன்னும் பெரிய நியாயத்தீர்ப்பைப் பெறுவோம் என்பதை அறிந்தவர்களாய், உங்களில் பலர் போதகர்களாக ஆகாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது இங்கே சகோதரிகளையும் உள்ளடக்கிய முழுச் சமூகத்தையும் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: உங்களில் பலர் ... வேண்டாம்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் தடை/அறிவுரை வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இரண்டாம் நபர் பன்மையைத் தெளிவாக்க ‘உங்களில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: διδάσκαλοι
  choice: போதகர்கள்
  rationale: சபைச் சூழலில் கற்பிப்பவர்களைக் குறிக்கும் இயல்பான தமிழ்; மூலத்தில் இல்லாத தனிப்பட்ட அதிகாரப்பூர்வப் பதவியை கட்டாயப்படுத்தவில்லை.
- source_word: γίνεσθε
  choice: ஆக
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ என்ற இயக்கத்தைப் பேணி, ஏற்கெனவே இருப்பதைவிட போதகர் நிலையை ஏற்றுக்கொள்வதைச் சுட்டுகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: இலக்கண ரீதியிலான ஆண்பால் பன்மையை முதன்மை உரையில் பேணுகிறது; முழுச் சமூகத்தையும் உள்ளடக்கும் சாத்தியமான பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: εἰδότες
  choice: அறிந்திருக்கிறீர்களே
  rationale: பங்கேற்புவினையின் காரண/பின்னணி நுணுக்கத்தை இயல்பான தமிழில் காட்டுகிறது; அதன் தொடர்பை அளவுக்கு மீறி ஒரே விதமாக நிர்ணயிக்கவில்லை.
- source_word: μεῖζον
  choice: இன்னும் பெரிய
  rationale: ஒப்பீட்டு வலிமையை நேரடியாகப் பேணி, ‘கடுமையான’ என்று விளக்கி விரிவுபடுத்தாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: κρίμα
  choice: நியாயத்தீர்ப்பு
  rationale: தீர்ப்பு அல்லது மதிப்பீட்டைக் குறிக்கும் பரந்த பொருளைத் தக்கவைத்து, ‘தண்டனைத் தீர்ப்பு’ என இறுதி கண்டனத்தை முன்கூட்டியே நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: λημψόμεθα
  choice: நாம் ... பெறுவோம்
  rationale: முதல் நபர் பன்மையைப் பேணி, எழுத்தாளரும் கற்பிப்பவர்களோடு தன்னை இணைத்துக்கொள்வதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கலந்த விசுவாசச் சமூகத்தில் ἀδελφοί μου என்பதன் வரம்பு
  choice: முதன்மை உரையில் ‘என் சகோதரர்களே’ என்று வைத்து, உள்ளடக்கமான சாத்தியப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: என் சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண வடிவத்தைப் பேணுவதோடு, இச்சொல் முழு விசுவாசச் சமூகத்தையும் குறிக்கக்கூடும் என்பதையும் மறைக்காமல் காட்டுகிறது.
- issue: போதகர்களுக்கான எச்சரிக்கையில் κρίμα என்பதன் வலிமை
  choice: நியாயத்தீர்ப்பு
  alternative: தண்டனைத் தீர்ப்பு
  rationale: அதிகமான பொறுப்புக்கூறலை வசனம் எச்சரிக்கிறது; ஆனால் இறுதி ஆக்கினைத்தீர்ப்பைச் சொல் கட்டாயமாகக் குறிக்கவில்லை. பரந்த மொழிபெயர்ப்பு இறையியல் பதற்றத்தைப் பேணுகிறது.
- issue: μεῖζον κρίμα என்பதன் ஒப்பீடு
  choice: இன்னும் பெரிய நியாயத்தீர்ப்பு
  alternative: இன்னும் கடுமையான நியாயத்தீர்ப்பு
  rationale: μεῖζον என்பதன் அடிப்படை ஒப்பீட்டு அர்த்தத்தை அணுக்கமாகப் பேணி, அந்தத் தீர்ப்பு எவ்வகையில் ‘பெரியது’ என்பதை உரை சொல்லாத நிலையில் அதைத் தனியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான அறிவுரைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘போதகர்கள்’ என்பது சபைச் சூழலுக்கு ஏற்றதாக இருந்தாலும், மூலத்தில் இல்லாத ஒரு குறிப்பிட்ட திருச்சபைப் பதவியைச் சேர்க்காது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘சகோதரர்களே’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
