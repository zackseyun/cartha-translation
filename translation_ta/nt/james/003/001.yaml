- from: என் சகோதரர்களே,[a] உங்களில் பலர் போதகர்களாக ஆக வேண்டாம்; நாம் இன்னும் பெரிய நியாயத்தீர்ப்பைப் பெறுவோம் என்பதை அறிந்திருக்கிறீர்களே.
  to: என் சகோதரர்களே,[a] நாம் இன்னும் பெரிய நியாயத்தீர்ப்பைப் பெறுவோம் என்பதை அறிந்தவர்களாய், உங்களில் பலர் போதகர்களாக ஆகாதீர்கள்.
