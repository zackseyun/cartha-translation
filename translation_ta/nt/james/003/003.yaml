translation_notes:
  register: நவீன, பொதுவாகப் புரியக்கூடிய, கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடிவாள வாயிரும்பு’ என்ற துல்லியமான சொல் வாசகருக்குப் புதிதாக இருக்கலாம் என்பதால் பொதுவான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
