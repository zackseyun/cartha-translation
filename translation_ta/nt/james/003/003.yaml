id: JAS.3.3
reference: James 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: ta
  text: குதிரைகள் நமக்குக் கீழ்ப்படியும்படி அவற்றின் வாய்களில் கடிவாளத்தின் வாயிரும்புகளை[a] இடுகிறோம் என்றால், அவற்றின் முழு உடலையும் நாம் வழிநடத்துகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடிவாளங்களை’; இங்கு குதிரையின் வாயில் வைக்கப்படும் கடிவாளத்தின் இரும்புப் பகுதியே குறிப்பாகக் குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: என்றால்
  rationale: நிபந்தனைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. δέ-யின் மென்மையான உரைத்தொடர்பு இங்கு தனிச் சொல்லால் வலுக்கட்டாயமாகக் காட்டப்படவில்லை.
- source_word: χαλινοὺς
  choice: கடிவாள வாயிரும்புகளை
  rationale: குதிரையின் வாய்க்குள் வைக்கப்படும் கடிவாளத்தின் குறிப்பிட்ட பகுதியைச் சுட்டுகிறது; பொதுவான ‘கடிவாளம்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கும் சூழலுக்கும் துல்லியமானது.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: அவற்றின் வாய்களில் ... போடுகிறோம்
  rationale: εἰς உடன் வரும் βάλλομεν இங்கு வாய்க்குள் இடுதல் என்ற இயல்பான செயலைக் குறிக்கிறது; தமிழில் ‘வாய்களில் போடுகிறோம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: குதிரைகள் நமக்குக் கீழ்ப்படியும்படி
  rationale: நோக்கத்தைக் குறிக்கும் இக்கட்டமைப்பை ‘கீழ்ப்படியும்படி’ இயல்பாகப் பாதுகாக்கிறது; காரணத்தை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: அவற்றின் முழு உடலையும்
  rationale: பன்மையான குதிரைகள் ஒவ்வொன்றின் முழு உடலையும் பகிர்முறை ஒருமையில் இயல்பான தமிழில் காட்டுகிறது.
- source_word: μετάγομεν
  choice: வழிநடத்துகிறோம்
  rationale: சிறிய வாயிரும்பின் மூலம் குதிரையின் முழு உடலின் இயக்கத்தைத் திசைதிருப்பி நடத்துதல் என்ற கருத்தைப் பாதுகாக்கிறது.
