source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: ta
  text: அப்படியே, நாவும் சிறிய உடலுறுப்புதான்; ஆனாலும் அது பெரிய காரியங்களைப் பற்றிப் பெருமை பேசுகிறது. பாருங்கள், எவ்வளவு சிறிய நெருப்பு எவ்வளவு பெரிய காட்டைக் கொளுத்துகிறது![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “எவ்வளவு பெரிய நெருப்பு எவ்வளவு பெரிய காட்டைக் கொளுத்துகிறது!” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரை வியப்புக்குரிய பெரிய நெருப்பைக் குறிப்பதாக எடுத்துக்கொள்ள முடியும். ஆனால் நாவு ஒரு சிறிய உடலுறுப்பு என்ற உடனடியான ஒப்புமைக்கேற்ப, சிறிய காரணம் பெரிய விளைவை ஏற்படுத்துகிறது என்ற பொருளை முதன்மைப் பாடம் பின்பற்றுகிறது. மேலும், “காடு” என்பதற்கான கிரேக்கச் சொல் மரம், மரப்பொருள் அல்லது எரிபொருள் ஆகியவற்றையும் குறிக்கலாம்.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: நாவு
  rationale: உடலுறுப்பு என்ற நேரடியான உருவகத்தைத் தக்கவைக்கிறது; ‘பேச்சு’ என்று மொழிபெயர்ப்பது உருவகத்தின் பொருளை முன்கூட்டியே விளக்கிவிடும்.
- source_word: μικρὸν μέλος
  choice: சிறிய உடலுறுப்பு
  rationale: ‘உறுப்பு’ மட்டும் சில வாசகர்களுக்குத் தெளிவில்லாமல் இருக்கலாம்; ‘உடலுறுப்பு’ என்பது உடல்சார்ந்த உருவகத்தை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: μεγάλα αὐχεῖ
  choice: பெரிய காரியங்களைப் பற்றிப் பெருமை பேசுகிறது
  rationale: μεγάλα என்பதன் ‘பெரியவை/பெரிய காரியங்கள்’ என்ற கருத்தையும் αὐχεῖ என்பதன் பெருமைப் பேச்சையும் தக்கவைக்கிறது; வெறுமனே ‘மிகவும் பெருமை பேசுகிறது’ என்று அளவைக் குறிக்கும் வகையில் மாற்றவில்லை.
- source_word: Ἰδοὺ
  choice: பாருங்கள்
  rationale: எடுத்துக்காட்டின் மீது வாசகரின் கவனத்தைத் திருப்பும் வலிமையை, பழமையான நடையின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡλίκον πῦρ
  choice: எவ்வளவு சிறிய நெருப்பு
  rationale: சிறிய காரணம் பெரிய விளைவை உண்டாக்கும் உடனடியான ஒப்புமைக்கேற்ப ἡλίκον என்பதை அளவில் சிறியது எனப் புரிந்துகொள்கிறது; கிரேக்கச் சொற்றொடருக்கு வேறு விளக்கமும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡλίκην ὕλην
  choice: எவ்வளவு பெரிய காடு
  rationale: ὕλη என்பது காடு, மரப்பொருள் அல்லது எரிபொருளைக் குறிக்கக்கூடும்; நெருப்பு பரவும் காட்சியில் ‘காடு’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀνάπτει
  choice: கொளுத்திவிடுகிறது
  rationale: நெருப்பு ஒரு பெரிய காட்டைப் பற்றவைத்து எரியச் செய்யும் விளைவை உயிரோட்டமான, பொதுவாகப் புரியும் தமிழில் வெளிப்படுத்துகிறது.
