  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டது. ‘நாவு’ என்ற தெளிவான உடலுறுப்பு உருவகமும், சிறிய காரணம்–பெரிய விளைவு என்ற விகித வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. கிரேக்கத்தின் உண்மையான பொருள் இருமை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
