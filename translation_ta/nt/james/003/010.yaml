reference: James 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: ta
  text: ஒரே வாயிலிருந்து ஆசீர்வாதமும் சாபமும் வெளிவருகின்றன. என் சகோதரர்களே[a], இவை இப்படி நடக்கக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது. ஆனால் இச்சூழலில் யாக்கோபு விசுவாசிகள் அனைவரையும் அழைப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: ஒரே வாயிலிருந்து
  rationale: ஒரே மூலத்திலிருந்து முரண்பட்ட பேச்சுகள் வெளிப்படுகின்றன என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐξέρχεται
  choice: வெளிவருகின்றன
  rationale: கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும், ‘ஆசீர்வாதமும் சாபமும்’ என்ற இணைந்த எழுவாயைத் தமிழில் இயல்பாகப் பன்மையுடன் இணைக்கிறது; வாயிலிருந்து பேச்சு புறப்படுவதையும் தெளிவாகக் காட்டுகிறது.
- source_word: εὐλογία
  choice: ஆசீர்வாதம்
  rationale: வாயால் உரைக்கப்படும் நல்வாழ்த்தல் அல்லது ஆசீர்வதித்தலைக் குறிக்கிறது; ‘சாபம்’ என்பதுடனான நேரடியான எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: κατάρα
  choice: சாபம்
  rationale: தீங்கு வர வேண்டும் என்று வாயால் உரைக்கும் சாபத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐ χρή
  choice: நடக்கக்கூடாது
  rationale: இது முறையல்ல, தகாது என்ற வலுவான அறநெறித் தீர்ப்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்பை முதன்மை உரையில் வடிவத்துக்கு நெருக்கமாகக் காக்கிறது; சூழலில் முழு விசுவாசச் சமூகமும் குறிக்கப்படலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: இவை இப்படி நடக்கக்கூடாது
  rationale: ταῦτα என்ற பன்மையையும் οὕτως என்ற ‘இப்படி’ என்னும் கருத்தையும் காத்து, தமிழில் இயல்பான கண்டன வாக்கியமாக அமைக்கிறது.
theological_decisions:
- issue: ἀδελφοί μου என்பதிலுள்ள பாலினம் குறிக்கப்பட்ட குடும்ப அழைப்பு
  choice: என் சகோதரர்களே
  alternative: என் சகோதர சகோதரிகளே
  rationale: கிரேக்கச் சொல் இலக்கணரீதியாக ஆண்பால் பன்மை. அதனை முதன்மை உரையில் பிரதிபலிக்கிறோம்; ஆனால் யாக்கோபு முழு விசுவாசச் சமூகத்தையும் அழைப்பது சாத்தியமானதால் உள்ளடக்கமான வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையைப் பேணிய மொழிபெயர்ப்பு. ‘ஒரே வாய்’, ‘ஆசீர்வாதம்’, ‘சாபம்’ ஆகிய மைய உருவகங்களும் எதிர்மறை இணைப்பும் நேரடியாகக் காக்கப்பட்டுள்ளன.
