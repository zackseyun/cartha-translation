reference: James 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: ta
  text: இந்த ஞானம் மேலிருந்து இறங்கி வருவது அல்ல; மாறாக, இது பூமிக்குரியது, ஆவிக்குரியதல்ல[a], தீய ஆவிகளுக்குரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயல்பான உயிர்வாழ்வுக்குரியது.’ கிரேக்கப் பெயரடை, ஆவிக்குரியதற்கு மாறாக, இயல்பான உயிர்வாழ்வுக்கு மட்டும் உரியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: இந்த ஞானம்
  rationale: முந்தைய சூழலில் விவரிக்கப்பட்ட ஞானத்தைச் சுட்டிக்காட்டும் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄνωθεν
  choice: மேலிருந்து
  rationale: தெய்வீக மூலத்தைக் குறிக்கும் ஒலிப்பையும் யாக்கோபு 1:17 உடனான தொடர்பையும் காக்கிறது; ‘வானத்திலிருந்து’ என்பது சற்றுக் கூடுதல் விளக்கம்.
- source_word: κατερχομένη
  choice: இறங்கி வருவது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπίγειος
  choice: பூமிக்குரியது
  rationale: ‘மேலிருந்து’ என்பதற்கு எதிரான இடவியல் மற்றும் பண்பியல் வேறுபாட்டைத் துல்லியமாகக் காக்கிறது; ‘உலகத்துக்குரியது’ கூடுதல் நெறிசார் நுணுக்கத்தைச் சேர்க்கலாம்.
- source_word: ψυχική
  choice: ஆவிக்குரியதல்ல
  rationale: புதிய ஏற்பாட்டில் ஆவிக்குரியதுடன் காணப்படும் எதிர்மறை வேறுபாட்டை வாசகர்களுக்குத் தெளிவாகத் தருகிறது; மூலச்சொல்லின் ‘இயற்கை வாழ்வுக்குரியது’ என்ற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: δαιμονιώδης
  choice: பேய்களுக்குரியது
  rationale: பேய்களோடு தொடர்புடையது அல்லது அவற்றின் பண்பைக் கொண்டது என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘பேய்த்தனமானது’ என்பதைக் காட்டிலும் நேரடியானது.
theological_decisions:
- issue: ψυχική என்பதன் ஆவிக்குரிய/இயற்கை வாழ்வுக்குரிய எதிர்மறைத் தன்மை
  choice: ஆவிக்குரியதல்ல
  alternative: இயற்கை வாழ்வுக்குரியது
  rationale: சூழலில் மேலிருந்து வரும் ஞானத்துக்கு எதிரான எதிர்மறை மதிப்பீட்டை இது தெளிவாக்குகிறது; அதேவேளை, குறிப்பிட்ட ஓர் இறையியல் அமைப்பைத் திணிக்காமல் மூலச்சொல்லின் வேறு நுணுக்கத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன தரமான, dignified மற்றும் பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் மூன்று அடுக்கான பெயரடைத் தொடரும் ‘மேலிருந்து/பூமிக்குரியது’ என்ற எதிர்மறை அமைப்பும் காக்கப்பட்டுள்ளன.
