id: JAS.3.12
reference: James 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: ta
  text: என் சகோதரர்களே[a], அத்திமரம் ஒலிவப்பழங்களைக் கொடுக்க முடியுமா? அல்லது திராட்சைக்கொடி அத்திப்பழங்களைக் கொடுக்க முடியுமா? அவ்வாறே, உப்பான எதுவும் நன்னீரைக் கொடுக்க முடியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் சகோதர சகோதரிகளே.’ கிரேக்கத்தில் ஆண்பால் பன்மையான ‘சகோதரர்கள்’ என்ற சொல் உள்ளது; அது ஆண்களும் பெண்களும் அடங்கிய குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘உப்பானது இனிப்பான தண்ணீரைக் கொடுக்க முடியாது.’ இங்கு ‘இனிப்பான தண்ணீர்’ என்பது உப்புநீருக்கு எதிரான ‘நன்னீர்’ என்று பொருள்படும். கிரேக்க இறுதிக் கூற்று சுருக்கமாக இருப்பதால், முந்தைய வசனத்தின் ஊற்று உருவகத்தின்படி, ‘உப்பு ஊற்று நன்னீரைக் கொடுக்க முடியாது’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: என் சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை விளிவடிவத்தை நேரடியாகக் காக்கிறது; யாக்கோபின் பயன்பாட்டில் இது முழுச் சமூகத்தையும் நோக்கியிருக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: μὴ δύναται
  choice: கொடுக்க முடியுமா?
  rationale: μή தொடங்கும் வினா எதிர்மறையான பதிலை எதிர்பார்க்கிறது. தமிழில் இயல்பான வினாவடிவம் அந்த வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: συκῆ
  choice: அத்திமரம்
  rationale: இச்சொல் பழத்தை அல்ல, மரத்தைக் குறிக்கிறது.
- source_word: ἐλαίας ποιῆσαι
  choice: ஒலிவப்பழங்களைக் கொடுக்க
  rationale: ποιέω இங்கு பழத்தை விளைவிப்பதைக் குறிக்கிறது; மரம் பழம் ‘கொடுப்பது’ என்பது இயல்பான நவீன தமிழ்.
- source_word: ἄμπελος
  choice: திராட்சைக்கொடி
  rationale: குறிப்பிடப்பட்டுள்ள கொடியின் வகையைத் தெளிவாகக் கூறி வேளாண் உருவகத்தைக் காக்கிறது.
- source_word: σῦκα
  choice: அத்திப்பழங்கள்
  rationale: சொல்லின் நேரான பன்மைப் பொருள்.
- source_word: οὔτε ἁλυκὸν
  choice: அதுபோல, உப்பானது
  rationale: கிரேக்கத்தில் ἁλυκόν பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டுள்ள பெயரடை; ‘உப்பானது’ என மொழிபெயர்ப்பது தண்ணீரையோ ஊற்றையோ வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: நன்னீரைக் கொடுக்க
  rationale: γλυκύς என்பதன் சொற்பொருள் ‘இனிப்பானது’; ஆனால் உப்புநீருக்கு எதிரான நீர் உருவகத்தில் இயல்பான தமிழ்ப் பொருள் ‘நன்னீர்’.
theological_decisions:
- issue: இறுதிக் கூற்றின் விடுபட்ட எழுவாய்
  choice: ‘உப்பானது’ என்று மூலத்தின் பெயரடைசார் சுருக்கத்தைத் தக்கவைத்தல்
  alternative: ‘உப்பு ஊற்று’ அல்லது ‘உப்புநீர்’ என்று வெளிப்படையாக நிறைவு செய்தல்
  rationale: முந்தைய வசனத்தின் ஊற்று உருவகம் எழுவாயை விளக்கலாம்; ஆனால் இவ்வசனம் தானாக அதைக் குறிப்பாகச் சொல்லவில்லை. எனவே முதன்மை உரை உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஒலிவப்பழம்,’ ‘திராட்சைக்கொடி,’ ‘அத்திப்பழம்,’ ‘நன்னீர்’ ஆகியவை வேளாண் மற்றும் நீர் உருவகங்களை இயல்பாகத் தருகின்றன. இறுதிக் கூற்றில் மூலத்தின் நீள்வட்ட இலக்கணமும் விளக்கத் திறப்பும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
