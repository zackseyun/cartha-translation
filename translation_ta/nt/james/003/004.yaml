source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: ta
  text: 'கப்பல்களையும் பாருங்கள்: அவை அவ்வளவு பெரியவையாக இருந்தாலும், கடும் காற்றுகளால் உந்தப்பட்டாலும், செலுத்துகிறவரின் உந்துதல் எங்கு செல்ல விரும்புகிறதோ அங்கே மிகச் சிறிய சுக்கானால் திருப்பப்படுகின்றன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கப்பலைச் செலுத்துகிறவர் எங்கே போக விரும்புகிறாரோ அங்கே.” கிரேக்கத்தில் இன்னும் சொல்லுக்குச் சொல்லாக, “செலுத்துகிறவரின் உந்துதல் எங்கு விரும்புகிறதோ” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: கப்பல்களையும் பாருங்கள்
  rationale: ἰδοὺ என்பதன் கவனத்தை ஈர்க்கும் வலிமையையும், καί முந்தைய எடுத்துக்காட்டுடன் இதை இணைப்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τηλικαῦτα ὄντα
  choice: அவை அவ்வளவு பெரியவையாக ... இருந்தாலும்
  rationale: கப்பல்களின் குறிப்பிடத்தக்க பெருமைக்கும் மிகச் சிறிய சுக்கானுக்கும் உள்ள முரண்பாட்டைச் சூழலுக்கேற்ற விட்டுக்கொடுப்பு அமைப்பில் காட்டுகிறது.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: கடும் காற்றுகளால் தள்ளப்படுகிறவையாக
  rationale: σκληρός என்பதன் வலிமையை ‘கடும்’ என்றும், ἐλαύνω என்பதன் செயப்பாட்டு இயக்கத்தை ‘தள்ளப்படுகிற’ என்றும் காக்கிறது.
- source_word: μετάγεται
  choice: திருப்பப்படுகின்றன
  rationale: சுக்கானால் கப்பலின் திசை மாற்றப்படுவதைத் துல்லியமாகச் சொல்கிறது; தமிழில் ‘செலுத்தப்படுகின்றன’ என்று மீண்டும் கூறுவதைக் காட்டிலும் தெளிவானது.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: மிகச் சிறிய சுக்கானால்
  rationale: ἐλάχιστος இங்குள்ள தீவிர அளவையும், πηδάλιον என்பதற்கான வழக்கமான கடல்சார் தமிழ்ச் சொல்லையும் வெளிப்படுத்துகிறது.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: செலுத்துகிறவரின் நாட்டம் எங்கே செல்ல விரும்புகிறதோ, அங்கே
  rationale: சற்றே அசாதாரணமான கிரேக்க வடிவமான ‘செலுத்துகிறவரின் உந்துதல்/நாட்டம் விரும்புகிறது’ என்பதை முற்றிலும் மறைக்காமல், தமிழில் புரியத்தக்கவாறு ‘செல்ல’ என்பதை வெளிப்படையாகச் சேர்க்கிறது.
theological_decisions:
- issue: ὁρμή மற்றும் βούλεται இணைப்பின் மனித விருப்பத் தன்மை
  choice: செலுத்துகிறவரின் நாட்டம் எங்கே செல்ல விரும்புகிறதோ
  alternative: கப்பலைச் செலுத்துகிறவர் எங்கே போக விரும்புகிறாரோ
  rationale: எளிமைப்படுத்தப்பட்ட மாற்று இயல்பானதாக இருந்தாலும், மூலத்தில் விருப்பம் ‘செலுத்துகிறவர்’ என்பவரோடு நேரடியாக அல்லாமல் அவரது ὁρμή என்பதோடு இலக்கணரீதியாக இணைக்கப்பட்டுள்ளது. ‘நாட்டம்’ அந்த உள்ளார்ந்த முனைப்பைத் தக்கவைக்கிறது; இதிலிருந்து தனிப்பட்ட கோட்பாட்டுச் சுருக்கம் எதுவும் உருவாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘சுக்கான்’ என்ற பரவலாக அறியப்பட்ட கடல்சார் சொல்லைப் பயன்படுத்தி, மூலத்தின் உருவகத் துல்லியமும் ὁρμή–βούλεται இணைப்பிலுள்ள உண்மையான அசாதாரணத் தன்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
