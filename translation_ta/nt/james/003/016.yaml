id: JAS.3.16
reference: James 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: ta
  text: ஏனெனில், பொறாமையும் சுயநலப் போட்டியும் எங்கே இருக்கின்றனவோ, அங்கே ஒழுங்கின்மையும் எல்லா தீய காரியங்களும் உண்டாகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பொறாமை” என்பதற்கான கிரேக்கச் சொல் வேறு சூழல்களில் “ஆர்வம்” என்றும் பொருள்படலாம்; இங்கே அது எதிர்மறைப் பொருளில் வருகிறது. “எல்லா தீய காரியங்களும்” என்பதை “ஒவ்வொரு இழிவான காரியமும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ζῆλος என்பதன் சூழலுக்கு வெளியேயுள்ள சொற்பொருள் மாற்றையும், πᾶν φαῦλον πρᾶγμα என்பதற்கான நேரடியான மாற்று மொழிபெயர்ப்பையும் குறிக்கிறது.
lexical_decisions:
- source_word: ὅπου ... ἐκεῖ
  choice: எங்கே ... அங்கே
  rationale: மூலத்தின் இடத்தைக் குறிக்கும் தொடர்பமைப்பையும் பொதுவான நியமம் போன்ற வாக்கிய வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கத் தொடர்பை வெளிப்படையாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ζῆλος
  choice: பொறாமை
  rationale: 3:14–15-இன் எதிர்மறைச் சூழலில் இச்சொல் நற்பொருளான ஆர்வத்தைக் குறிக்காது; பிறரிடத்திலுள்ளதைப் பார்த்து எழும் பொறாமை அல்லது விரோதமான எரிச்சலைக் குறிக்கிறது.
- source_word: ἐριθεία
  choice: சுயநலப் போட்டி
  rationale: சுயநல முன்னேற்றத்திற்காகப் பிறரோடு போட்டியிட்டு பிளவை உண்டாக்கும் மனப்பான்மையை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἀκαταστασία
  choice: குழப்பம்
  rationale: சமூக உறவுகளில் ஏற்படும் ஒழுங்கின்மை, கலக்கம் ஆகியவற்றைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: πᾶν φαῦλον πρᾶγμα
  choice: எல்லாவிதமான தீய செயல்
  rationale: சொல்லுக்குச் சொல் அமைப்பின் ‘ஒவ்வொரு தீய காரியம்’ என்ற கடினத்தன்மையைத் தவிர்த்து, எல்லா வகையான ஒழுக்கக்கேடான செயல்களையும் குறிக்கும் மூலப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ζῆλος என்பதன் ஒழுக்கப் பொருள்
  choice: எதிர்மறையான ‘பொறாமை’
  alternative: நடுநிலை அல்லது நேர்மறையான ‘ஆர்வம்’; அல்லது ‘பொறாமை கலந்த எரிச்சல்’
  rationale: உடனடி சூழல் இதை உலகத்திற்குரிய, ஆன்மீகமற்ற ஞானத்தின் தீய பண்பாகக் காட்டுவதால் நேர்மறைப் பொருள் பொருந்தாது. எனினும் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- issue: πᾶν φαῦλον πρᾶγμα என்பதன் பரப்பு
  choice: எல்லாவிதமான தீய செயல்
  alternative: ஒவ்வொரு இழிவான காரியம்; எல்லா தீய காரியமும்
  rationale: இது ஒரு குறிப்பிட்ட பாவ வகையை மட்டும் சுட்டாமல், இத்தகைய மனப்பான்மையால் விளையும் பலவகைத் தீய நடத்தைகளைப் பொதுவாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எங்கே ... அங்கே’ என்ற மூலத்தின் வலியுறுத்தும் இணை அமைப்பு காக்கப்பட்டுள்ளது; ‘சுயநலப் போட்டி’ என்பது தனிப்பட்ட முன்னேற்றத்தையும் உறவுகளில் உண்டாகும் போட்டி/பிளவையும் இணைத்துக் காட்டுகிறது.
