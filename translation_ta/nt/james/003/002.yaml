id: JAS.3.2
reference: James 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: ta
  text: ஏனெனில், நாம் எல்லாரும் பலவிதங்களில் இடறுகிறோம். ஒருவர் தன் பேச்சில்[a] இடறாதிருந்தால், அவர் முதிர்ச்சி பெற்ற[b] மனிதர்[c]; தன் முழு உடலையும் கடிவாளமிட்டு அடக்கவும் வல்லவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘வார்த்தையில்’; அதாவது, அவர் பேசுவதில் அல்லது சொல்வதில்.'
    reason: lexical_alternative
  - marker: b
    text: ‘பரிபூரணமான’ அல்லது ‘முழுமையான’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க τέλειος இங்கு முற்றிலும் பாவமற்ற தன்மையைவிட ஒழுக்க முதிர்ச்சியைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் ‘மனிதன்/ஆண்’ (ἀνήρ) என்ற ஆண்பால் சொல் உள்ளது; இப்பொதுக் கூற்றில் அது பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: பலவிதங்களில்
  rationale: இது வினையடைப் பொருளில் வந்து, ‘பல காரியங்களை’ என்பதற்குப் பதிலாக ‘பல வகைகளில்/பல விதங்களில்’ என்ற விரிவான பொருளைத் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பை வெளிப்படுத்துகிறது.
- source_word: πταίομεν / πταίει
  choice: இடறுகிறோம் / இடறாதிருந்தால்
  rationale: உடலால் இடறுதல் என்ற உருவகத்தையும், ஒழுக்கத் தவறு என்ற சூழல்சார் பொருளையும் ஒன்றாகத் தக்கவைக்கிறது.
- source_word: ἅπαντες
  choice: நாம் எல்லாரும்
  rationale: எழுத்தாளர் தம்மையும் சேர்த்துக்கொள்ளும் வலியுறுத்தப்பட்ட, அனைவரையும் உள்ளடக்கும் சொற்றொடர்.
- source_word: εἴ τις
  choice: ஒருவர் ... இருந்தால்
  rationale: பொதுவான நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐν λόγῳ
  choice: தன் பேச்சில்
  rationale: λόγος இங்கு ஒருவர் பேசுவதையும் அவர் சொல்வதையும் குறிக்கிறது; ‘பேச்சில்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: οὗτος
  choice: அவர்
  rationale: தமிழில் முந்தைய ‘ஒருவர்’ என்பவரைத் தெளிவாகச் சுட்டும் மரியாதையான ஒருமைச் சுட்டுப்பெயர்; ‘இந்த ஒருவர்’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: τέλειος
  choice: முதிர்ச்சி பெற்ற
  rationale: இங்கு முழுமையான ஒழுக்க முதிர்ச்சியைச் சுட்டுகிறது; நவீனத் தமிழில் ‘பரிபூரணமான’ என்பது பாவமே இல்லாத நிலை என்று மிகையாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: ἀνήρ
  choice: மனிதர்
  rationale: மூலத்தில் ஆண்பால் ஒருமைச் சொல் இருந்தாலும், இப்பொதுக் கூற்றில் அது பிரதிநிதித்துவப் பயன்பாட்டைக் கொண்டுள்ளது; ‘மனிதர்’ மூலத்தின் மனிதக் குறியீட்டைத் தக்கவைத்து பயன்பாட்டை ஆண்களுக்கு மட்டும் குறுக்காது.
- source_word: δυνατὸς
  choice: வல்லவர்
  rationale: திறன் அல்லது ஆற்றலை நேரடியாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: χαλιναγωγῆσαι
  choice: கடிவாளமிட்டு அடக்க
  rationale: அடுத்த வசனங்களில் விரிவாகும் குதிரை–கடிவாள உருவகத்தைத் தக்கவைக்கிறது; ‘கட்டுப்படுத்த’ மட்டும் என்றால் அந்த உருவகம் மறைந்துவிடும்.
- source_word: καὶ
  choice: அடக்கவும்
  rationale: பேச்சைக் கட்டுப்படுத்துவதோடு முழு உடலையும் கட்டுப்படுத்தும் கூடுதல் திறனை ‘-வும்’ வெளிப்படுத்துகிறது.
- source_word: ὅλον τὸ σῶμα
  choice: தன் முழு உடலையும்
  rationale: ‘முழு உடல்’ என்ற பரப்பைத் தக்கவைத்து, தமிழில் அது அதே நபருடைய உடல் என்பதை இயல்பாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஒழுக்கச் சூழலில் τέλειος என்பதன் பொருள்
  choice: முதிர்ச்சி பெற்ற
  alternative: பரிபூரணமான / முழுமையான
  rationale: யாக்கோபின் பயன்பாட்டில் இது குணநலனின் முழுமையையும் முதிர்ச்சியையும் குறிக்கிறது. ‘நாம் எல்லாரும் இடறுகிறோம்’ என்ற உடனடிச் சூழல், முற்றிலும் பாவமற்ற தன்மையை இங்கு வலியுறுத்தவில்லை. ஆயினும் ‘முழுமையான’ என்ற பொருள் வாய்ப்பை அடிக்குறிப்பு தக்கவைக்கிறது.
- issue: ἀνήρ என்பதன் பிரதிநிதித்துவ ஆண்பால் பயன்பாடு
  choice: மனிதர்; பொதுப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது
  alternative: ஆண் / ஒருவர்
  rationale: மூலச்சொல் ஆண்பால் வடிவில் உள்ளது; ஆனால் εἴ τις அறிமுகப்படுத்தும் பொதுக் கூற்றில் அதை ஆண்களுக்கு மட்டும் கட்டுப்படுத்துவது பொருத்தமல்ல. ‘மனிதர்’ என்பது மனிதக் குறியீட்டைத் தக்கவைத்து பொதுப் பயன்பாட்டையும் தெரிவிக்கிறது.
translation_notes:
  register: நடை நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தரத்திலுள்ளது. ‘இடறு’ மற்றும் ‘கடிவாளமிட்டு அடக்கு’ ஆகியவை மூலத்தின் தொடர்ச்சியான உருவகங்களைப் பாதுகாக்கின்றன. ‘தன் பேச்சில்’ மற்றும் ‘தன் முழு உடலையும்’ என்பவை தமிழின் இயல்புக்காகச் சேர்க்கப்பட்ட தொடர்புச் சொற்கள்; மூலப் பொருளைச் சுருக்கவோ விரிவாக்கவோ செய்யவில்லை.
