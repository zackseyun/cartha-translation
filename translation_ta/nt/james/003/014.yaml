  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: ta
  text: ஆனால், உங்கள் இதயங்களில் கசப்பான பொறாமையும் சுயநல நோக்கமும் இருந்தால், பெருமை பேசாதீர்கள்; உண்மைக்கு எதிராகப் பொய் சொல்லாதீர்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கசப்பான ஆர்வம்’ அல்லது ‘கசப்பான பொறாமை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சுயநல நோக்கம்’ என்பதற்கு ‘போட்டி மனப்பான்மை’ அல்லது ‘குழுவாதம்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உண்மைக்கு முரணாகப் பொய் சொல்லாதீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: கசப்பான பொறாமை
  rationale: ζῆλος என்பது சூழலைப் பொறுத்து ஆர்வம், பொறாமை, எரிச்சல் ஆகிய பொருள்களைத் தரலாம். இங்கு ἐριθείαν என்பதுடன் இணைந்து எதிர்மறையாக வருவதால், பகைமையும் மனக்கசப்பும் கலந்த பொறாமை முதன்மையான பொருள்; πικρόν என்பதை ‘கசப்பான’ என்று நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐριθείαν
  choice: சுயநல நோக்கம்
  rationale: இச்சொல் தன்னை முன்னிறுத்தும் பேராவலையும் பிரிவினையை உருவாக்கும் போட்டி மனப்பான்மையையும் குறிக்கலாம். ‘சுயநல நோக்கம்’ உள்ளார்ந்த உந்துதலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; போட்டி அல்லது குழுவாதம் என்ற மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: உங்கள் இதயங்களில்
  rationale: கிரேக்கத்தில் ‘இதயம்’ ஒருமையிலும் ‘உங்கள்’ பன்மையிலும் உள்ள பகிர்வுக் கட்டமைப்பு ஒவ்வொருவரின் உள்ளத்தையும் குறிக்கிறது. குழுவை நோக்கிய உரையில் தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: μὴ κατακαυχᾶσθε
  choice: பெருமை பேசாதீர்கள்
  rationale: κατακαυχάομαι பெருமை பாராட்டுதல் அல்லது மற்றவர்களுக்கு எதிராகத் தன்னை உயர்த்துதல் என்ற கருத்தைக் கொண்டது. ‘பெருமை பேசாதீர்கள்’ சுருக்கமாகவும் இயல்பாகவும் கட்டளையின் வலிமையைத் தருகிறது.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: உண்மைக்கு எதிராகப் பொய் சொல்லாதீர்கள்
  rationale: ψεύδεσθε பொய் பேசுதலைக் குறிக்கிறது; κατά + ஆறாம் வேற்றுமை உண்மைக்கு எதிரான நிலைப்பாட்டைத் தருகிறது. இத்தேர்வு செயலும் எதிர்ப்புறவும் இரண்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: εἰ δὲ
  choice: ஆனால் ... இருந்தால்
  rationale: δέ முந்தைய பகுதியில் வருணிக்கப்பட்ட மேலிருந்து வரும் ஞானத்துக்கு எதிரான நிலையைச் சுட்டுகிறது. ‘ஆனால்’ அந்த முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘உண்மை’ என்பதன் பரப்பு
  choice: குறிப்பிட்ட கோட்பாடாகச் சுருக்காமல் ‘உண்மை’ என்று பொதுவாக வைத்தல்
  alternative: ‘நற்செய்தியின் உண்மை,’ ‘ஞானத்தின் உண்மையான வழி,’ அல்லது வெறும் நேர்மையான பேச்சு
  rationale: ἀλήθεια இங்கு இறைவனுடைய உண்மை, உண்மையான ஞானம், நடத்தையின் உண்மைத்தன்மை ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொல்லாக உள்ளது. ஒரு குறிப்பிட்ட கோட்பாட்டுக்கோ வெறும் வாய்மைக்கோ அதைச் சுருக்குவது மூலத்தின் இறையியல் பதற்றத்தைத் தணித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதயம்’ என்ற வேதாகமப் படிமம் பாதுகாக்கப்பட்டுள்ளது; பன்மை வடிவம் குழுவை நோக்கிய உரையைத் தெளிவாக்குகிறது. மூலத்தில் இல்லாத சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
