  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊற்றுக்கண்’ இயற்கை நீரூற்றின் வெளிவாயைப் படிமமிக்க விதத்தில் தெரிவிக்கிறது; முதன்மை உரையில் இயல்புக்காக ‘நீர்’ தெளிவாக்கப்பட்டுள்ளது.
