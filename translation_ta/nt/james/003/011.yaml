id: JAS.3.11
reference: James 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: ta
  text: ஒரு நீரூற்று, ஒரே திறப்பிலிருந்து இனிய நீரையும் கசப்பான நீரையும் பொங்கிவரச் செய்யுமா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “நீரூற்று ஒரே திறப்பிலிருந்து இனியதையும் கசப்பானதையும் பொங்கிவிடுகிறதா?”'
    reason: கிரேக்கத்தில் ‘நீர்’ வெளிப்படையாகக் குறிப்பிடப்படவில்லை; ‘இனியது’ மற்றும் ‘கசப்பானது’ பெயர்ச்சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. βρύει என்பது பொங்கி அல்லது ஊறி வெளிவருதலைக் குறிக்கிறது.
lexical_decisions:
- source_word: μήτι
  choice: சுரக்குமா?
  rationale: μήτι எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான வினா வடிவமே இங்கு அந்த மறைமுக எதிர்மறை எதிர்பார்ப்பைத் தெளிவாகத் தாங்குகிறது.
- source_word: ἡ πηγή ... ἐκ τῆς αὐτῆς ὀπῆς
  choice: ஒரே ஊற்றுக்கண்ணிலிருந்து
  rationale: πηγή என்பது இயற்கையான நீரூற்றைக் குறிக்கிறது; ὀπή அதன் திறப்பு அல்லது வெளிவரும் இடம். ‘ஊற்றுக்கண்’ என்பது இவ்விரண்டையும் சூழலுக்கு ஏற்ற இயல்பான தமிழ்ப் படிமமாக அளிக்கிறது; αὐτῆς என்பதன் ‘ஒரே’ என்ற வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: βρύει
  choice: சுரக்குமா
  rationale: βρύω என்பது பொங்கி அல்லது ஊறி வெளிவருதலைக் குறிக்கிறது. நீரூற்றைப் பற்றிய தமிழ்ச் சூழலில் ‘சுரத்தல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; மேலும் வினைச்சொல்லின் நிகழ்காலப் பொதுப்பண்பையும் தாங்குகிறது.
- source_word: τὸ γλυκὺ
  choice: இனிப்பான நீர்
  rationale: γλυκύ என்பதன் நேரடிப் பொருளான ‘இனிப்பு’ காக்கப்படுகிறது. பெயரடையாகப் பயன்படுத்தப்பட்ட கிரேக்கச் சொல்லின் மறைபொருளைத் தெளிவாக்க ‘நீர்’ சேர்க்கப்படுகிறது.
- source_word: τὸ πικρόν
  choice: கசப்பான நீர்
  rationale: πικρόν என்பதன் நேரடிப் பொருளான ‘கசப்பு’ காக்கப்படுகிறது. இணையான அமைப்புக்கும் தெளிவுக்கும் ‘நீர்’ சேர்க்கப்படுகிறது.
