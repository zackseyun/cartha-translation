revisions:
- from: அதே நாவினால் ஆண்டவரும் தந்தையுமானவரை[a] வாழ்த்துகிறோம்; அதே நாவினால் கடவுளின் சாயலின்படி உருவாக்கப்பட்ட மனிதர்களைச் சபிக்கிறோம்.
  to: அதே நாவினால் ஆண்டவரையும் தந்தையையும்[a] வாழ்த்துகிறோம்; அதே நாவினால் கடவுளின் சாயலின்படி உருவாக்கப்பட்ட மனிதர்களைச் சபிக்கிறோம்.
  rationale: The revision changes only the Lord/Father phrase so that the Tamil main text mirrors the Greek coordination without explicitly settling its appositional force. The footnote preserves the legitimate appositional understanding and explains the alternative without imposing it.
