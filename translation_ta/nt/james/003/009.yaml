id: JAS.3.9
reference: James 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: ta
  text: அதே நாவினால் ஆண்டவரையும் தந்தையையும்[a] வாழ்த்துகிறோம்; அதே நாவினால் கடவுளின் சாயலின்படி உருவாக்கப்பட்ட மனிதர்களைச் சபிக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “ஆண்டவரையும் தந்தையையும்.” இத்தொடரை “ஆண்டவர், அதாவது தந்தை” என்ற இணைப்பொருளிலும், கடவுளுக்கான இணைந்த இரு பெயர்களாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: அதே நாவினால்
  rationale: முந்தைய வசனத்தின் ‘நாவை’ இது குறிக்கிறது. தமிழில் கருவிப்பொருளை இயல்பாகத் தெரிவிக்க ‘நாவினால்’ என்றும், இரு செயல்களிலும் ஒரே நாவே பயன்படுத்தப்படுவதை வலியுறுத்த ‘அதே’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εὐλογοῦμεν
  choice: வாழ்த்துகிறோம்
  rationale: கடவுளை நோக்கிய நல்வார்த்தையையும் மக்களை நோக்கிய சாபத்தையும் எதிரெதிராக நிறுத்தும் மூலச்சொல்லின் பொருளை இது காக்கிறது; ‘துதிக்கிறோம்’ என்பது புகழ்ச்சியைத் தெளிவாக்கினாலும், ‘சபிக்கிறோம்’ என்பதுடனான சொல்லியல் எதிர்மறைத் தொடர்பை மங்கச் செய்யும்.
- source_word: τὸν κύριον καὶ πατέρα
  choice: ஆண்டவரும் தந்தையுமானவரை
  rationale: இரு பெயர்களும் ஒரே இறை நபரைச் சுட்டும் இயல்பான தமிழ் அமைப்பு இது. அதேவேளையில், கிரேக்கத் தொடரின் இலக்கண உறவைப் பற்றிய நுண்ணிய தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: καταρώμεθα
  choice: சபிக்கிறோம்
  rationale: εὐλογοῦμεν என்பதற்கு எதிராக நிற்கும் வலுவான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: τοὺς ἀνθρώπους
  choice: மனிதர்களை
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ அந்தப் பொதுப்பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: கடவுளின் சாயலின்படி
  rationale: படைப்புக் குறிப்பை எதிரொலிக்கும் வகையில் ‘likeness’ என்ற கருத்தை இயல்பான, மரியாதைக்குரிய தமிழில் வழங்குகிறது.
- source_word: γεγονότας
  choice: உருவாக்கப்பட்ட
  rationale: மனிதர்கள் கடவுளின் சாயலுக்கு ஏற்ப உண்டாக்கப்பட்டிருக்கும் விளைவு நிலையைத் தெரிவிக்கிறது; சூழலில் உட்கிடக்கும் இறைச் செயற்பாட்டையும் செயப்பாட்டு வடிவம் காக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவரும் தந்தையும்’ என்ற சொற்றொடரின் உறவு
  choice: ஆண்டவரும் தந்தையுமானவரை
  alternative: ஆண்டவரையும் தந்தையையும்
  rationale: சூழலில் இரண்டு தனித்தனி பொருட்களை அல்ல, ஆண்டவராகவும் தந்தையாகவும் அழைக்கப்படும் கடவுளையே குறிக்கும் வாசிப்பு இயல்பானது. இருப்பினும், கிரேக்க இணைப்பின் அமைப்பை மிகையாகத் தீர்மானிக்காமல் அதன் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀνθρώπους என்பதன் பொதுமனிதக் குறிப்பு
  choice: மனிதர்களை
  alternative: ஆண்களை
  rationale: இந்த வசனம் கடவுளின் சாயலின்படி உருவாக்கப்பட்ட மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ஆண் பாலினத்தவருக்கு மட்டும் இதை வரையறுப்பது மூலத்தின் நோக்கத்தைத் தவறாகக் குறுக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘அதே நாவினால்’ என்ற மீளுரைத்தல் ஆசீர்வதித்தலும் சபித்தலும் ஒரே உறுப்பிலிருந்து வருவதைக் கூர்மையாக வெளிப்படுத்துகிறது. ‘வாழ்த்துகிறோம்’–‘சபிக்கிறோம்’ என்ற எதிரிணை மூலத்தின் நெறியியல் அழுத்தத்தைப் பாதுகாக்கிறது.
