source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: ta
  text: பொழுது சாயத் தொடங்கியது. பன்னிருவரும் அவரிடம் வந்து, “மக்களை அனுப்பிவிடுங்கள்; அவர்கள் சுற்றியுள்ள கிராமங்களுக்கும் நாட்டுப்புறப் பகுதிகளுக்கும் போய், தங்குவதற்கு இடம் தேடி, உணவுப் பொருள்களைப் பெற்றுக்கொள்ளட்டும்[b]. ஏனெனில் நாம் இங்கே ஒதுக்குப்புறமான இடத்தில்[a] இருக்கிறோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறிச்சோடிய இடத்தில்.” கிரேக்கச் சொல் மக்கள் வசிக்காத அல்லது மிகக் குறைவாக வசிக்கும் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உணவைத் தேடிக்கொள்ளட்டும்.” கிரேக்கச் சொல் உணவு அல்லது உணவு இருப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: பகல் சாயத் தொடங்கியது
  rationale: κλίνειν என்பதன் ‘சாய்தல்’ என்ற உருவகத்தையும், நாள் மாலையை நோக்கிச் சென்ற காலக் குறிப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: பன்னிருவரும் அவரிடம் வந்து
  rationale: προσέρχομαι என்பதன் அணுகிவரும் பொருளை இயல்பாகத் தருகிறது; ‘பன்னிருவர்’ என்பது சீடர்களின் குழுவுக்கான அடையாளப் பெயராகவே வைக்கப்பட்டுள்ளது.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: மக்களை அனுப்பிவிடுங்கள்
  rationale: இச்சூழலில் ἀπολύω என்பது கூட்டத்தைக் கலைத்து அனுப்புவதைக் குறிக்கிறது. மரியாதையான ஒருமை ஏவலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα πορευθέντες
  choice: அவர்கள் ... போய் ... பெற்றுக்கொள்ளட்டும்
  rationale: ἵνα உடன் வரும் பங்கேற்புவினையின் நோக்கப் பொருளை, செயற்கையான சொல்லுக்குச் சொல் அமைப்பின்றி இயல்பான தமிழ் தொடராக வழங்குகிறது.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: சுற்றியுள்ள கிராமங்களுக்கும் நாட்டுப்புறங்களுக்கும்
  rationale: κύκλῳ என்பதன் சுற்றியுள்ள என்ற பொருளையும், κώμαι மற்றும் ἀγροί குறிக்கும் கிராமங்களையும் ஊருக்கு வெளியேயுள்ள நாட்டுப்புறப் பகுதிகளையும் காக்கிறது.
- source_word: καταλύσωσιν
  choice: தங்குவதற்கு இடம் தேடி
  rationale: இங்கு καταλύω என்பது வெறுமனே நிற்பதையல்ல, தங்கும் இடம் பெறுவதைக் குறிக்கிறது.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: உணவுப் பொருள்களைப் பெற்றுக்கொள்ளட்டும்
  rationale: ἐπισιτισμός என்பது உணவு அல்லது உணவு இருப்பைக் குறிக்கிறது; ‘உணவுப் பொருள்கள்’ அதன் வழங்கல் சார்ந்த பரந்த பொருளைக் காக்கிறது.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: ஏனெனில் நாம் இங்கே மக்கள் வசிக்காத இடத்தில் இருக்கிறோம்
  rationale: ὧδε என்பதற்கு ‘இங்கே’ என்று வெளிப்படையாகத் தரப்படுகிறது. ἔρημος குறிக்கும் குடியிருப்பில்லாத அல்லது மிகக் குறைவாக மக்கள் வசிக்கும் தன்மையை, தேவையற்ற வனாந்தர இறையியல் தொடர்பைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
