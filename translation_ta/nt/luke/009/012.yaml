translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க மூலத்தின் வரிசையையும் நோக்கத் தொடர்பையும் இயன்றவரை காத்து, தமிழில் இயல்பான வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் [a] குறி ‘பகல் சாய்தல்’ என்பதற்குப் பின் இருந்தாலும் அதன் அடிக்குறிப்பு ἔρημος பற்றியது; ஆகவே தமிழ் முதன்மை உரையில் [a] பொருத்தமான ‘மக்கள் வசிக்காத இடத்தில்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
