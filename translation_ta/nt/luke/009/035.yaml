  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: ta
  text: 'மேகத்திலிருந்து[a] ஒரு குரல் ஒலித்தது: “இவரே என் மகன், தேர்ந்தெடுக்கப்பட்டவர்; இவருக்குச் செவிகொடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘என் மகன், தேர்ந்தெடுக்கப்பட்டவர்’ என்பதற்குப் பதிலாக ‘என் அன்புக்குரிய மகன்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: ஒரு குரல் ஒலித்தது
  rationale: குரல் நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சொற்சொல்லான ‘ஒரு குரல் உண்டாயிற்று’ என்பதைவிட கதைநடைக்கு ஏற்றது.
- source_word: ἐκ τῆς νεφέλης
  choice: மேகத்திலிருந்து
  rationale: ἐκ குறிக்கும் தோற்றுவாயைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λέγουσα
  choice: 'ஒலித்தது: “…”'
  rationale: குரல் கூறிய உள்ளடக்கத்தை இரட்டைப்புள்ளியும் நேர்கூற்றும் இயல்பாக அறிமுகப்படுத்துகின்றன; ‘சொல்லிக்கொண்டு’ போன்ற செயற்கையான அமைப்பு தவிர்க்கப்படுகிறது.
- source_word: Οὗτός ἐστιν
  choice: இவரே
  rationale: அடையாளப்படுத்தும் வலியுறுத்தலை மரியாதைக்குரிய மனிதச் சுட்டுப்பெயருடன் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὁ υἱός μου
  choice: என் மகன்
  rationale: உடைமைத் தொடர்பையும் மகன்தன்மையையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἐκλελεγμένος
  choice: தேர்ந்தெடுக்கப்பட்டவர்
  rationale: ἐκλέγομαι என்பதன் நிறைவுற்ற செயலின் விளைவுநிலையையும் இறைத் தேர்வையும் பாதுகாக்கிறது; கிரேக்கத்தில் இல்லாத இரண்டாவது உடைமைச் சொல்லைச் சேர்க்கவில்லை.
- source_word: αὐτοῦ ἀκούετε
  choice: இவருக்குச் செவிகொடுங்கள்
  rationale: வெறுமனே ஒலி கேட்பதைவிட கவனித்துக் கேட்டு ஏற்க வேண்டும் என்ற கட்டளையின் வலிமையைத் தருகிறது; முன்னிலைப்படுத்தப்பட்ட αὐτοῦ-வின் வலியுறுத்தலும் ‘இவருக்கு’ என்பதால் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: வானத்திலிருந்து வரும் குரலில் மகனை விவரிக்கும் பாடவேறுபாடு
  choice: ἐκλελεγμένος என்பதற்கு ‘தேர்ந்தெடுக்கப்பட்டவர்’
  alternative: ἀγαπητός என்பதற்கு ‘அன்புக்குரிய மகன்’
  rationale: கொடுக்கப்பட்ட SBLGNT மூலப்பாடத்தைப் பின்பற்றி லூக்காவின் தனித்துவமான ‘தேர்ந்தெடுக்கப்பட்டவர்’ என்ற சொல்லை முதன்மைப் பாடத்தில் வைத்துள்ளது; இணை நற்செய்திகளின் பழக்கமான வாசகத்தோடு ஒத்திசைக்காமல் மாற்றுப் பாடத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவரே’ மற்றும் ‘இவருக்குச் செவிகொடுங்கள்’ என்பவை உரையின் அடையாளப்படுத்தும் மற்றும் கட்டளையிடும் வலியுறுத்தலை இயல்பாகத் தக்கவைக்கின்றன.
