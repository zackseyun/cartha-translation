  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: ta
  text: ஆனால் இயேசு, “கலப்பையில் கை வைத்து, பின்னால் பார்த்துக்கொண்டிருப்பவர் எவரும் தேவனுடைய ராஜ்யத்துக்கு ஏற்றவர் அல்ல[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏற்றவர்’ என்பதற்கு ‘பொருத்தமானவர்’ அல்லது ‘பயனுள்ளவர்’ என்றும் பொருள் கொள்ளலாம். ‘கலப்பையில் கை வைத்து’ என்பது உழவைத் தொடங்குவதற்காகக் கலப்பையைப் பற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ இங்கு முந்தைய கூற்றுக்குப் பதிலாக வரும் மென்மையான எதிர்மறைத் திருப்பத்தைக் குறிக்கிறது; ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Οὐδεὶς
  choice: எவரும் ... அல்ல
  rationale: எந்த நபருக்கும் விதிவிலக்கில்லை என்ற பொதுவான மறுப்பை, பாலினச் சுட்டில்லாமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: கலப்பையின்மேல் கையை வைத்துவிட்டு
  rationale: உழத் தொடங்குவதற்காகக் கலப்பையைப் பற்றும் ஆரம்பச் செயலை அசல் வேளாண் உருவகத்தோடு காக்கிறது; இறந்தகால வினையெச்சம் அடுத்த செயலில் முன்னதாக நிகழ்ந்ததை வெளிப்படுத்துகிறது.
- source_word: ἄροτρον
  choice: கலப்பை
  rationale: உழுவதற்குப் பயன்படும் கருவிக்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: பின்னால் பார்த்துக்கொண்டிருக்கும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது வழக்கமான செயலை வெளிப்படுத்தி, கவனம் பின்னோக்கித் திரும்பும் உருவகத்தையும் காக்கிறது.
- source_word: εὔθετός
  choice: தகுதியுள்ளவர்
  rationale: ஒரு நோக்கத்திற்கு ஏற்றவர் அல்லது பொருத்தமானவர் என்ற கருத்தைத் தருகிறது; ஒழுக்கத் தகுதி அல்லது இறுதி மீட்பு குறித்து அசல் கூறுவதைக் கடந்த முடிவைச் சேர்க்கவில்லை.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: தேவனுடைய அரசுக்கு
  rationale: εὔθετος என்பதுடன் வரும் நோக்க/தொடர்பு வேற்றுமையை ‘அரசுக்குத் தகுதியுள்ளவர்’ என்று இயல்பாகக் காட்டுகிறது; βασιλεία என்பதின் அரசாட்சி சார்ந்த பரப்பைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ என்பதன் உட்பொருள்
  choice: ‘தேவனுடைய அரசுக்குத் தகுதியுள்ளவர் அல்ல’ என்று, அந்த அரசின் கோரிக்கைகளுக்கு ஏற்றிருப்பதைப் பற்றிய எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேவனுடைய அரசுக்குள் நுழையத் தகுதியற்றவர்’ அல்லது ‘தேவனுடைய அரசின் பணிக்குப் பயனற்றவர்.’
  rationale: கிரேக்கச் சொல் ஏற்ற தன்மை அல்லது பொருத்தத்தைக் குறிக்கிறது. இது இறுதி மீட்பிலிருந்து விலக்கப்படுவதை மட்டுமே குறிக்கிறதா, அல்லது அரசின் பணிக்குப் பயனற்றதைக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், சீடத்துவத்தில் பிளவுபடாத பற்றுறுதியைக் கோரும் எச்சரிக்கையின் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வேளாண் உருவகம் அப்படியே காக்கப்பட்டுள்ளது; ‘பார்த்துக்கொண்டிருக்கும்’ என்பது தொடரும் பின்னோக்கிய கவனத்தைக் காட்டுகிறது.
