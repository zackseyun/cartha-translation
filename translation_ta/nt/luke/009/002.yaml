source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: ta
  text: தேவனுடைய அரசாட்சியை[a] அறிவிக்கவும் நோயுற்றவர்களைக் குணமாக்கவும் அவர் அவர்களை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய ஆட்சி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: இச்சொல் ஒருவரைப் பணிக்காக அனுப்புவதைக் குறிக்கிறது. சூழலில் பணி ஒப்படைத்து அனுப்பும் கருத்து தெளிவாக இருப்பதால், இயல்பான தமிழில் ‘அனுப்பினார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: κηρύσσειν
  choice: அறிவிக்க
  rationale: பொதுவாக வெளிப்படையாகப் பிரகடனம் செய்வதை இச்சொல் குறிக்கிறது. ‘அறிவிக்க’ என்பது திருச்சபைச் சார்ந்த குறுகிய பயன்பாட்டைத் தவிர்த்து, அதன் பொதுவான அறிவிப்பு வலிமையை இயல்பாகத் தருகிறது.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: தேவனுடைய அரசு
  rationale: βασιλεία என்பது அரசாட்சியின் ஆளுகையையும் அரசின் பரப்பையும் உள்ளடக்கக்கூடியது. ‘தேவனுடைய அரசு’ அந்த விரிவைத் தக்கவைக்கும் நிலையான, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு.
- source_word: ἰᾶσθαι
  choice: குணமாக்க
  rationale: உடல்நலத்தை மீட்டளித்தல் என்ற சூழல்சார் பொருளை ‘குணமாக்க’ இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: τοὺς ἀσθενεῖς
  choice: நோயுற்றவர்களை
  rationale: ἀσθενής பொதுவாக ‘பலவீனமானவர்’ என்றும் பொருள்படலாம்; ஆனால் குணமாக்குதல் பற்றிய இச்சூழலில் உடல்நோயுற்றவர்களையே குறிக்கிறது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் பொருள் பரப்பு
  choice: தேவனுடைய அரசு
  alternative: தேவனுடைய ஆட்சி
  rationale: இத்தொடர் தேவனுடைய ஆளுகையையும் அவரது அரசின் பரப்பையும் சுட்டக்கூடும். ‘அரசு’ இந்த இரு பரிமாணங்களையும் திறந்த நிலையில் வைத்திருக்கிறது; ‘ஆட்சி’ ஆளுகை என்ற அம்சத்தை அதிகம் வலியுறுத்துகிறது. உண்மையான சொற்பொருள் மாற்றை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, தெளிவான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நோக்கத்தைக் காட்டும் இரு இணை infinitive-களும் ‘அறிவிக்கவும் … குணமாக்கவும்’ என இணை அமைப்பில் தக்கவைக்கப்பட்டுள்ளன.
