- from: தேவனுடைய அரசை[a] அறிவிக்கவும் நோயுற்றவர்களைக் குணமாக்கவும் அவர் அவர்களை அனுப்பினார்.
  to: தேவனுடைய அரசாட்சியை[a] அறிவிக்கவும் நோயுற்றவர்களைக் குணமாக்கவும் அவர் அவர்களை அனுப்பினார்.
  rationale: The revision changes only the rendering of βασιλεία from ‘அரசு’ to ‘அரசாட்சி’ to avoid the modern governmental sense and to provide a clearer, natural Tamil equivalent. The coordinated infinitival purposes and all other wording are retained.
