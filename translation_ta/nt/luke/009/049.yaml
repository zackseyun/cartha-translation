id: LUK.9.49
reference: Luke 9:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: ta
  text: அப்போது யோவான் அவரிடம், “குருவே, ஒருவர் உமது பெயரால் பேய்களை விரட்டுவதைக் கண்டோம். அவர் எங்களோடு சேர்ந்து உம்மைப் பின்பற்றாததால், அவரைத் தடுக்க முயன்றோம்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: அப்போது யோவான் அவரிடம் ... என்றார்
  rationale: ἀποκριθείς என்பது சூழலில் முந்தைய உரைக்குப் பதிலளித்துப் பேசுவதைக் குறித்தாலும், தமிழில் இயல்பான கதைநடை தொடர்ச்சிக்காக ‘அப்போது ... என்றார்’ என வழங்கப்பட்டுள்ளது.
- source_word: Ἐπιστάτα
  choice: ஆண்டவரே
  rationale: லூக்காவில் சீடர்கள் இயேசுவை அழைக்கும் இச்சொல் அவரது அதிகாரத்தையும் தலைமை நிலையையும் உணர்த்துகிறது. நவீனத் தமிழில் மரியாதையும் அதிகார ஒப்புதலும் இயல்பாக வெளிப்பட ‘ஆண்டவரே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἴδομέν τινα
  choice: ஒருவர் ... கண்டோம்
  rationale: τινα குறிப்பிடப்படாத ஒருவரைக் குறிக்கிறது; ‘ஒருவர்’ என்பது இயல்பான, தேவையற்ற விவரம் சேர்க்காத தமிழ் இணை.
- source_word: ἐν τῷ ὀνόματί σου
  choice: உமது பெயரால்
  rationale: இயேசுவின் பெயரைச் சார்ந்து அல்லது அவரது அதிகாரத்தின் அடிப்படையில் செயல்படுவதைக் குறிக்கும் மொழிநடையை ‘உமது பெயரால்’ இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: பேய்களை விரட்டுவதைக்
  rationale: ἐκβάλλω இங்கு பேய்களை ஒருவரிடமிருந்து வெளியேற்றுவதைக் குறிக்கிறது. ‘பேய்களை விரட்டுதல்’ நவீனத் தமிழில் தெளிவான, வழக்கமான வேதாகமச் சொற்றொடர்.
- source_word: ἐκωλύομεν
  choice: தடுக்க முயன்றோம்
  rationale: இறந்தகால imperfect வடிவம் தொடர்ந்த அல்லது முயற்சிக்கப்பட்ட செயலைக் குறிக்கலாம். அடுத்த வசனத்தில் இயேசு ‘தடுக்காதீர்கள்’ என்று கூறுவதாலும், அவர்கள் வெற்றிகரமாகத் தடுத்துவிட்டதாக உறுதிப்படுத்தாமல் ‘முயன்றோம்’ என வழங்குவது பொருத்தமானது.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: அவர் எங்களோடு சேர்ந்து உம்மைப் பின்பற்றாததால்
  rationale: μεθ’ ἡμῶν என்பதிலுள்ள ‘எங்களோடு’ என்ற குழுச் சார்பு பாதுகாக்கப்படுகிறது. தமிழில் ‘எங்களோடு பின்பற்றுதல்’ இயல்பற்றதால், ἀκολουθεῖ என்பதன் சூழலில் மறைந்துள்ள இயேசுவை நோக்கிய செயப்படுபொருளை ‘உம்மைப்’ என வெளிப்படுத்தி, ‘சேர்ந்து’ என்பதன் மூலம் உடனிணைவு வலியுறுத்தப்படுகிறது.
theological_decisions:
- issue: அந்த நபரின் சீடத்துவ விசுவாசம் குறித்த தெளிவின்மை
  choice: அவர் எங்களோடு சேர்ந்து உம்மைப் பின்பற்றாததால்
  alternative: அவர் எங்களைப் பின்பற்றாததால்
  rationale: கிரேக்கத்தில் μεθ’ ἡμῶν என்பது ‘எங்களோடு’ என்று நேரடியாகக் கூறுகிறது; சீடர்களையே அவர் பின்பற்றவில்லை என்று சொல்லவில்லை. எனவே அவர் இயேசுவை நிராகரித்தார் எனத் தவறாக உணர்த்தாமல், சீடர்களின் குழுவோடு இணைந்து செல்லாததே குற்றச்சாட்டு என்ற இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘உமது/உம்மைப்’ என்ற மரியாதை ஒருமை இயேசுவை நோக்கிய அழைப்பில் தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு தேவைப்படாத வகையில் μεθ’ ἡμῶν என்பதன் நுணுக்கம் முதன்மை உரையிலேயே தெளிவாக்கப்பட்டுள்ளது.
