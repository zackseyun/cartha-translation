  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: ta
  text: அவர் இவற்றைச் சொல்லிக்கொண்டிருந்தபோது, ஒரு மேகம் தோன்றி அவர்களை மூடத் தொடங்கியது[a][b]. அவர்கள் அந்த மேகத்திற்குள் சென்றபோது பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மேகம் தோன்றி அவர்களை மூடியது.” கிரேக்க வினையைச் செயல் தொடங்கியதைக் குறிப்பாக வெளிப்படுத்தாமலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த மேகம், பழைய ஏற்பாட்டில் தேவன் தமது பிரசன்னத்தை வெளிப்படுத்திய நிகழ்வுகளை நினைவூட்டலாம்; ஆனால் இவ்வசனம் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரைப் பாதுகாத்து, பேதுரு முன்பு கூறிய சொற்களைக் குறிக்கிறது.
- source_word: αὐτοῦ λέγοντος
  choice: அவர் சொல்லிக்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருக்கும் சமகாலச் செயலைக் காட்டும் நிகழ்காலப் பெயரெச்சத்தையும் தனிநிலை வேற்றுமைத் தொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγένετο νεφέλη
  choice: ஒரு மேகம் தோன்றி
  rationale: மேகம் தோன்றியதையோ வந்து சேர்ந்ததையோ குறிக்கும் கிரேக்கத் தொடரை, அதன் தோற்றம் குறித்து மேலதிக விளக்கம் சேர்க்காமல் இயல்பாகக் கூறுகிறது.
- source_word: ἐπεσκίαζεν
  choice: மூடத் தொடங்கியது
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடக்க அல்லது முன்னேறும் நுணுக்கத்தை வெளிப்படுத்துகிறது; தமிழில் மேகம் அவர்களைச் சூழ்ந்து மூடிய காட்சியையும் இயல்பாகத் தருகிறது.
- source_word: ἐφοβήθησαν
  choice: பயந்தார்கள்
  rationale: பயம் ஏற்பட்டதை எளிய, இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: அவர்கள் ... சென்றபோது
  rationale: ἐν உடன் வரும் வினையெச்சத் தொடரின் சமகால நேரத்தொடர்பையும், αὐτούς என்பதை அந்தச் செயலின் எழுவாயாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν νεφέλην
  choice: அந்த மேகத்திற்குள்
  rationale: மேகத்தின் கீழ் மட்டுமல்லாமல் அதற்குள் செல்லும் இயக்கத்தை εἰς என்பதற்கேற்பத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மேகத்தின் இயல்பும் அதன் செயலும்
  choice: மேகம் தோன்றி அவர்களை மூடத் தொடங்கியதாக விவரிப்பதோடு நிறுத்தப்பட்டது.
  alternative: மேகத்தை வெளிப்படையாகத் தேவனுடைய மகிமையின் பிரசன்னம் அல்லது ‘மகிமை மேகம்’ என்று அடையாளப்படுத்துதல்.
  rationale: சூழல் பழைய ஏற்பாட்டில் தேவன் வெளிப்படும் காட்சிகளை நினைவூட்டினாலும், இவ்வசனம் மேகத்தை அவ்வாறு நேரடியாக அடையாளப்படுத்தவில்லை. எனவே குறிப்பை அடிக்குறிப்பில் மட்டும் சுட்டிக்காட்டி, மூல உரையின் இறையியல் நுட்பத்தைத் திறந்தவாறே வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. “இவற்றை” என்ற பன்மையும் “மேகத்திற்குள்” என்ற இடவியல் இயக்கமும் பாதுகாக்கப்பட்டுள்ளன; மேகத்தை இறைப் பிரசன்னம் என்று முதன்மை உரையில் விளக்கிச் சேர்க்கவில்லை.
