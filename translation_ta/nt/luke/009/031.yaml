source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: ta
  text: அவர்கள் மகிமையில் தோன்றி, அவர் எருசலேமில் நிறைவேற்றவிருந்த தமது புறப்பாட்டைப் பற்றிப் பேசிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δόξῃ
  choice: மகிமையில்
  rationale: மூலத்தின் சுருக்கமான சொற்றொடரையும் தெய்வீக ஒளிமிகு தோற்றத்தைக் குறிக்கும் பொருளையும் தக்கவைக்கிறது.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: அவருடைய புறப்பாட்டை
  rationale: ἔξοδος என்பதன் அடிப்படைப் பொருளான ‘புறப்பாடு’ என்பதைப் பாதுகாக்கிறது; இது இயேசுவின் மரணத்தை மட்டும் என்று குறுக்காமல், எருசலேமில் நிகழவிருந்த அவரது பிரிவின் பரந்த இறையியல் ஒலிப்பையும் தக்கவைக்கிறது.
- source_word: πληροῦν
  choice: நிறைவேற்ற
  rationale: ‘முடித்தல்’ அல்லது ‘நிகழ்த்துதல்’ என்பதைக் காட்டிலும், தீர்மானிக்கப்பட்ட நிகழ்வை நிறைவுக்குக் கொண்டுவருதல் என்ற மூலச்சொல்லின் வலிமையையும் இறையியல் பதற்றத்தையும் பிரதிபலிக்கிறது.
- source_word: ἤμελλεν
  choice: நிறைவேற்றவிருந்த
  rationale: விரைவில் அல்லது நிர்ணயிக்கப்பட்டபடி நிகழவிருந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘புறப்பாடு’ என்பதன் குறிப்பு
  choice: அவருடைய புறப்பாடு
  alternative: அவருடைய மரணம்
  rationale: மூலத்தில் உள்ள ἔξοδος என்ற உருவகச் சொல்லை நேரடியாகப் பாதுகாக்கிறது. ‘மரணம்’ என்று மட்டும் மொழிபெயர்ப்பது அதன் யாத்திராகமச் சாயலையும், மரணம்–உயிர்த்தெழுதல்–விண்ணேற்றம் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த குறிப்பையும் முன்கூட்டியே குறுக்கிவிடும்.
- issue: πληροῦν என்பதன் இறையியல் நுணுக்கம்
  choice: நிறைவேற்ற
  alternative: நிறைவு செய்ய / முடிக்க
  rationale: எருசலேமில் நிகழவிருந்தது வெறும் சம்பவமாக அல்லாமல், இயேசு நிறைவேற்றவிருந்த பணியாகச் சொல்லப்படும் மூலத்தின் செயற்பாட்டு மற்றும் நிறைவு சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. தொடர்புடைய ‘அவர்கள்’ என்பது முந்தைய வசனத்தில் வரும் மோசேயையும் எலியாவையும் குறிக்கிறது; வசன எல்லைக்குள் இயல்பாக இருக்கும்படி பிரதிப்பெயர் தக்கவைக்கப்பட்டுள்ளது.
