review_pass:
  verdict: revise
  source_fidelity: The address, the two characterizations of the generation, the open referent of ‘generation,’ and the singular command concerning the man’s son are preserved. However, ‘...பொறுத்துக்கொள்ள வேண்டும்?’ expresses obligation (‘must/should bear’) rather than the Greek future rhetorical question, ‘how long will I ... bear with you?’
  naturalness: The draft is generally clear modern standard Tamil. Recasting the question with the future form ‘பொறுத்துக்கொள்வேன்?’ is both more idiomatic in this rhetorical context and more faithful. ‘சீர்கெட்ட’ is a natural rendering of the figurative moral deviation in διεστραμμένη.
  terminology: ‘நம்பிக்கையற்ற’ is a defensible accessible equivalent for ἄπιστος in context, without forcing a narrower doctrinal formulation. ‘சீர்கெட்ட’ adequately conveys διεστραμμένη. No specialized theological term or footnote is required.
  issues:
  - severity: medium
    issue: ‘உங்களைப் பொறுத்துக்கொள்ள வேண்டும்?’ renders the question as necessity/obligation.
    rationale: The Greek has future indicatives (ἔσομαι, ἀνέξομαι), asking rhetorically how long Jesus will remain and bear with them. Tamil ‘வேண்டும்’ changes this to ‘how long must I bear with you?’
