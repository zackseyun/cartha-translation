source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: ta
  text: அதற்கு இயேசு, “நம்பிக்கையற்ற, சீர்கெட்ட தலைமுறையே! இன்னும் எவ்வளவு காலம் நான் உங்களோடு இருந்து உங்களைப் பொறுத்துக்கொள்வேன்? உன் மகனை இங்கே கொண்டுவா” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ ἄπιστος
  choice: நம்பிக்கையற்ற தலைமுறையே
  rationale: ἄπιστος என்பது இங்கு நம்பிக்கை அல்லது விசுவாசம் இல்லாத நிலையைக் குறிக்கிறது; இயல்பான நவீன தமிழில் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: διεστραμμένη
  choice: சீர்கெட்ட
  rationale: மூலச்சொல் வளைந்து அல்லது நெறிபிறழ்ந்து போன நிலையை உருவகமாகக் குறிக்கிறது. ‘சீர்கெட்ட’ என்பது அந்த ஒழுக்க மற்றும் ஆன்மிகப் பிறழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνέξομαι ὑμῶν
  choice: உங்களைப் பொறுத்துக்கொள்ள வேண்டும்
  rationale: ἀνέχομαι என்பதிலுள்ள சகித்துக்கொண்டு தாங்குதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: προσάγαγε ὧδε
  choice: இங்கே கொண்டுவா
  rationale: அருகில் அழைத்து அல்லது கொண்டு வருமாறு கூறும் கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் கண்டனம் யாரைக் குறிக்கிறது என்பதிலுள்ள பரப்பு
  choice: ‘தலைமுறையே’ என்ற பொதுவான அழைப்பை அப்படியே வைத்தல்
  alternative: சீடர்களையோ கூட்டத்தையோ மட்டும் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: γενεά பரந்த குழுவைச் சுட்டுகிறது; வசனம் குறிப்பிட்ட ஒரு குழுவுக்கே கண்டனத்தை வரையறுக்கவில்லை. எனவே மூலத்தின் திறந்த பரப்பு பாதுகாக்கப்படுகிறது.
- issue: ἄπιστος என்பதன் பொருள்
  choice: நம்பிக்கையற்ற
  alternative: விசுவாசமற்ற
  rationale: இரண்டும் சாத்தியம். ‘நம்பிக்கையற்ற’ என்பது பொதுவாசகருக்குப் புரியும் இயல்பான சொல்; அதே நேரத்தில் கடவுள்மீதான விசுவாசக் குறைவு என்ற சூழல்சார் பொருளையும் தாங்குகிறது.
translation_notes:
  register: மரியாதையும் வலிமையும் கொண்ட நவீன நிலையான தமிழ். இயேசுவின் வேதனை கலந்த கண்டனமும் நேரடியான கட்டளையும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
