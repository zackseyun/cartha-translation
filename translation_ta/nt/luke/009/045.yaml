language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: ta
  text: ஆனால், அவர்கள் இந்தச் சொல்லைப் புரிந்துகொள்ளவில்லை. அவர்கள் அதை உணராதபடி, அது அவர்களிடமிருந்து மறைக்கப்பட்டிருந்தது. இந்தச் சொல்லைக் குறித்து அவரிடம் கேட்க அவர்கள் பயந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγνόουν
  choice: புரிந்துகொள்ளவில்லை
  rationale: இயேசு கூறியதன் பொருளைச் சீடர்கள் அறியாமலிருந்ததைவிட, அதைப் புரிந்துகொள்ளத் தவறியதையே இச்சூழலில் வினைச்சொல் குறிக்கிறது.
- source_word: ῥῆμα
  choice: கூற்று
  rationale: இங்கு ῥῆμα என்பது இயேசு சற்று முன் கூறிய குறிப்பிட்ட செய்தியைக் குறிக்கிறது. ‘கூற்று’ என்பது பேச்சாக வெளிப்பட்ட கருத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: παρακεκαλυμμένον
  choice: மறைக்கப்பட்டிருந்தது
  rationale: ἦν என்பதுடன் வரும் நிறைவுநிலைச் செயல்பாட்டு வடிவம், அது மறைக்கப்பட்ட நிலையில் இருந்ததைக் காட்டுகிறது. தமிழிலும் செயப்படுபொருள் வடிவத்தை வைத்திருப்பதால் செய்பவர் யார் என்று சேர்த்துக் கூறப்படவில்லை.
- source_word: ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து
  rationale: ἀπό என்பதன் இயல்பான பொருளான ‘இருந்து’ என்பதைக் காத்து, அந்தக் கூற்று அவர்களிடமிருந்து மறைக்கப்பட்டிருந்ததைத் தெரிவிக்கிறது.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: அதை அவர்கள் உணராதபடி
  rationale: αἰσθάνομαι என்பதிலுள்ள உணர்தல் அல்லது புலப்படுதல் என்ற நுண்பொருளை ‘உணர’ காக்கிறது; முன் வரும் ἠγνόουν என்பதற்கான ‘புரிந்துகொள்ளவில்லை’ என்பதோடு இரு வினைகளையும் ஒன்றாக்கவில்லை.
- source_word: ἐφοβοῦντο
  choice: அவர்கள் பயந்தார்கள்
  rationale: கேட்பதைப் பற்றிய அவர்களுடைய தொடர்ந்த அச்சநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐρωτῆσαι
  choice: கேட்க
  rationale: விளக்கம் பெறுவதற்காக இயேசுவிடம் கேள்வி கேட்பதைக் குறிக்கும் எளிய, இயல்பான தமிழ்ச் சொல்.
theological_decisions:
- issue: மறைத்த செயலின் செய்பவர்
  choice: ‘அது அவர்களிடமிருந்து மறைக்கப்பட்டிருந்தது’ என்று செயப்படுபொருள் வடிவத்தில் மொழிபெயர்த்து, செய்பவரைக் குறிப்பிடவில்லை.
  alternative: ‘கடவுள் அதை அவர்களிடமிருந்து மறைத்தார்’ அல்லது ‘அது அவர்களுக்கு விளங்காமல் இருந்தது.’
  rationale: கிரேக்க மூலத்தில் மறைத்தவர் யார் என்பது கூறப்படவில்லை. செயப்படுபொருள் வடிவத்தைத் தக்கவைப்பது, இறைச் செயல்பாட்டை வெளிப்படையாகச் சேர்க்காமலும் அதற்கான சாத்தியத்தை நீக்காமலும் மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ἵνα μὴ என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த நுண்மை
  choice: ‘உணராதபடி’
  alternative: ‘அதனால் அவர்கள் அதை உணரவில்லை’
  rationale: ἵνα அமைப்பின் நோக்கம்/விளைவு சார்ந்த திறந்த நுண்மையை ‘-ஆதபடி’ காக்கிறது; காரணத்தை அல்லது செய்பவரின் நோக்கத்தைத் தெளிவாகத் தீர்மானித்து விடுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் மூன்று இணை வாக்கியங்களும் தெளிவுக்காகத் தனித்தனி வாக்கியங்களாக வழங்கப்பட்டன. ‘கூற்று’ என்ற சொல் இரு இடங்களிலும் ஒரேபோல வைக்கப்பட்டு ῥῆμα என்பதன் மீள்வருகை பாதுகாக்கப்பட்டது.
