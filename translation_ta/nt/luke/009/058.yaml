id: LUK.9.58
reference: Luke 9:58
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ta
  text: இயேசு அவனிடம், “நரிகளுக்கு வளைகள்[a] உள்ளன; வானத்துப் பறவைகளுக்குக்[b] கூடுகள் உள்ளன; ஆனால் மனிதகுமாரனுக்குத்[c] தன் தலையைச் சாய்க்க இடமில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வளைகள்’ என்பதற்கு ‘பொந்துகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘வானத்தின் பறவைகள்.’'
    reason: lexical_alternative
  - marker: c
    text: ‘மனிதகுமாரன்’ என்பது இயேசு தம்மைக் குறிக்கப் பயன்படுத்திய பெயர்; இது தானியேல் 7:13–14-ஐ எதிரொலிக்கக்கூடும்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: நரிகள்
  rationale: இது நரிகளைக் குறிக்கும் நேரடியான விலங்கினப் பெயர்; பொதுமைப்படுத்த வேண்டிய சூழல் காரணம் இல்லை.
- source_word: φωλεοὺς
  choice: வளைகள்
  rationale: விலங்குகள் தங்கும் பொந்துகள் அல்லது இருப்பிடங்களைக் குறிக்கிறது. நரிகளின் சூழலில் ‘வளைகள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: கிரேக்கத்தின் ‘வானத்தின் பறவைகள்’ என்ற வடிவத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: κατασκηνώσεις
  choice: கூடுகள்
  rationale: தங்கும் அல்லது குடியிருக்கும் இடங்களைக் குறிக்கும் சொல்; பறவைகளைப் பற்றிய இச்சூழலில் ‘கூடுகள்’ இயல்பான பொருத்தம்.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் அங்கீகரிக்கப்பட்ட பட்டப்பெயரை மொழிபெயர்த்துப் பாதுகாக்கிறது; அதன் சாத்தியமான தானியேல் நூல் எதிரொலியை விளக்கவுரையால் தீர்மானிப்பதில்லை.
- source_word: ποῦ
  choice: இடமில்லை
  rationale: οὐκ ἔχει ποῦ என்ற மறுப்பு அமைப்பு இயல்பாக ‘இடமில்லை’ என்று பொருள்படும்.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: தன் தலையைச் சாய்க்க
  rationale: தங்கவோ ஓய்வெடுக்கவோ இடம் இருப்பதைச் சுட்டும் கிரேக்க உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: விலங்குகளுக்குத் தங்குமிடம் இருப்பதற்கும் மனிதகுமாரனுக்கு அது இல்லாததற்கும் இடையிலான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: கிரேக்கக் கதைநடையின் நேரடியான பொருளைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வழங்குகிறது.
theological_decisions:
- issue: υἱὸς τοῦ ἀνθρώπου என்ற இயேசுவின் சுயக்குறிப்பை மொழிபெயர்த்தல்
  choice: மனிதகுமாரன்
  alternative: மனித மைந்தன் / மனிதரானவர்
  rationale: வரலாற்றாக அறியப்பட்ட பட்டப்பெயரைப் பாதுகாப்பதால் அதன் நேரடிப் பொருளும் சாத்தியமான மேசியா மற்றும் வெளிப்பாட்டு நூல் சார்ந்த எதிரொலியும் நிலைக்கின்றன; விளக்கமான மாற்றுச் சொல் மூலம் அதன் பொருள் முன்கூட்டியே தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வளைகள்’, ‘கூடுகள்’, ‘தலையைச் சாய்க்க’ ஆகியவை காட்சிப்படிமத்தைப் பாதுகாக்கும் இயல்பான சொற்கள். மேற்கோள் தமிழின் வழக்கமான வாக்கிய அமைப்பில் தரப்பட்டுள்ளது.
