source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: ta
  text: அவன் இன்னும் நெருங்கி வந்துகொண்டிருந்தபோதே, பேய் அவனைத் தரையில் வீழ்த்தி வலிப்பால் துடிக்கச் செய்தது. ஆனால் இயேசு அந்த அசுத்த ஆவியைக் கடிந்தார்; சிறுவனைக் குணமாக்கி, அவனை அவனுடைய தந்தையிடம் திருப்பிக் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை அவனுடைய தந்தையிடம் மீட்டளித்தார்.”
    reason: ἀποδίδωμι என்பதற்கு இச்சூழலில் பொருந்தும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: அவன் இன்னும் நெருங்கி வந்துகொண்டிருந்தபோதே
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையையும், ἔτι தரும் ‘இன்னும்’ என்ற தொடர்நிலையையும் இயல்பான தமிழில் காக்கிறது; δέ இங்கு மென்மையான கதைத் தொடர்ச்சியாக விடப்பட்டுள்ளது.
- source_word: ἔρρηξεν αὐτὸν
  choice: அவனைக் கீழே தள்ளி
  rationale: பேய் சிறுவனை வன்மையாகக் கீழே வீழ்த்திய செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸ δαιμόνιον
  choice: பேய்
  rationale: தனிப்பட்ட தீய ஆவிக்குரிய முகவரை நேரடியாகக் குறிக்கிறது; பின்னர் வரும் ‘அசுத்த ஆவி’ என்ற வேறுபட்ட சொற்றொடரையும் அப்படியே காக்கிறது.
- source_word: συνεσπάραξεν
  choice: வலிப்பால் துடிக்கச் செய்தது
  rationale: கடுமையான உடல் வலிப்பு அல்லது தசைத் துடிப்பை ஏற்படுத்தியதைக் சாதாரண வாசகருக்குத் தெளிவாகச் சொல்கிறது.
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டு
  rationale: இயேசுவின் அதிகாரமிக்க வாய்மொழிக் கண்டிப்பைக் குறிக்கும் நற்செய்தி நூல்களின் வழக்குச் சொல்லுக்கு ஏற்ற தமிழ்.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: அந்த அசுத்த ஆவியை
  rationale: ἀκάθαρτος என்பதிலுள்ள அசுத்தம் சார்ந்த கருத்தைத் தக்கவைத்து, முன் குறிப்பிடப்பட்ட பேயையே சுட்டும் உறவையும் ‘அந்த’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἰάσατο τὸν παῖδα
  choice: சிறுவனைக் குணமாக்கி
  rationale: ἰάομαι என்பதன் குணப்படுத்தும் பொருளையும், இச்சூழலில் παῖς குறிக்கும் இளம் ஆண் குழந்தையையும் தெளிவாக வழங்குகிறது.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: அவனை அவனுடைய தந்தையிடம் திரும்ப ஒப்படைத்தார்
  rationale: ἀποδίδωμι என்பதிலுள்ள திருப்பிக் கொடுத்தல் அல்லது மீட்டளித்தல் என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேய் பிடித்த துன்பத்தின் மொழிபெயர்ப்பு
  choice: δαιμόνιον என்பதை ‘பேய்’ என்றும் πνεῦμα ἀκάθαρτον என்பதை ‘அசுத்த ஆவி’ என்றும் தனிப்பட்ட ஆவிக்குரிய முகவரைக் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: ‘தீய சக்தி’ அல்லது மனநோய் சார்ந்த நிலை என்று பொதுமைப்படுத்துதல்
  rationale: கிரேக்க உரை செயல்படும் தனிப்பட்ட பேயையும் அதையே அசுத்த ஆவி என்றும் நேரடியாகச் சித்தரிக்கிறது. அதேவேளை இயேசு சிறுவனைக் குணமாக்கினார் என்றும் கூறுவதால், பேயை விரட்டுதல் மற்றும் குணமாக்குதல் ஆகிய இரு பரிமாணங்களும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘வலிப்பால் துடிக்கச் செய்தது’ என்பது συνεσπάραξεν குறிக்கும் கடுமையான உடல் வலிப்பை விளக்கமாகத் தருகிறது. அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய இறுதி சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
