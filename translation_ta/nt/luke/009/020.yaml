reference: Luke 9:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்களோ, நான் யார் என்று சொல்கிறீர்கள்?” என்று கேட்டார். பேதுரு பதிலளித்து, “கடவுளின் மெசியா[a],” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கடவுளின் கிறிஸ்து.”'
    reason: χριστός என்பதற்கான பாரம்பரிய ஒலிபெயர்ப்பு மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்களோ
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் அழுத்தத்துடனும் வரும் இரண்டாம் நபர் பன்மையை, முந்தைய கருத்துடன் உள்ள வேறுபாட்டையும் சேர்த்து இயல்பான தமிழில் காட்டுகிறது.
- source_word: τίνα με λέγετε εἶναι
  choice: நான் யார் என்று சொல்கிறீர்கள்
  rationale: λέγετε + εἶναι என்ற மறைமுகக் கூற்றுக் கட்டமைப்பைத் தெளிவான, இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ἀποκριθεὶς
  choice: மறுமொழியாக
  rationale: பின்வரும் εἶπεν உடன் இணைந்துள்ள பங்கேற்பு வடிவத்தை, தமிழில் தேவையற்ற மறுகூறல் இல்லாமல் ‘மறுமொழியாக … என்றார்’ என இயல்பாக வழங்குகிறது.
- source_word: χριστός
  choice: மெசியா
  rationale: இங்கு இது இயேசுவை அடையாளப்படுத்தும் பட்டமாக வருகிறது; ஆகவே பெயர்போல் ‘கிறிஸ்து’ என ஒலிபெயர்ப்பதைவிட பட்டத்தின் மெசியானிய பொருளை வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: உடைமை வேற்றுமைத் தொடர்பைச் சுருக்கமாகவும் நேரடியாகவும் பாதுகாக்கிறது.
- source_word: δέ
  choice: நீங்களோ என்பதிலுள்ள ‘-ஓ’
  rationale: கேள்வியில் δέ குறிக்கும் எதிர்மறை ஒப்பீட்டைத் தமிழின் இயல்பான தலைப்புமாற்று/வேறுபாட்டுக் கூறான ‘நீங்களோ’ வெளிப்படுத்துகிறது; முதல் δέ தனியே மொழிபெயர்க்கப்படவில்லை, ஏனெனில் தமிழில் அது உரையோட்டத்தைச் சுமையாக்கும்.
theological_decisions:
- issue: பேதுருவின் அறிக்கையில் χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு χριστός என்பது இஸ்ரவேலின் எதிர்பார்ப்புடன் தொடர்புடைய பட்டமாகப் பயன்படுத்தப்படுகிறது. அதனால் பட்டம் மொழிபெயர்க்கப்பட்டுள்ளது; பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. கேள்வி என்பதால் εἶπεν இயல்பான தமிழில் ‘கேட்டார்’ என வழங்கப்பட்டது; பேதுருவின் சுருக்கமான பதில் மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
