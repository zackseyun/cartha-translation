lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: தமிழில் தனித்த ‘மற்றும்’ கொண்டு தொடங்குவது இயல்பற்றதாக இருப்பதால், எளிய தொடர்ச்சியை வாக்கிய வரிசையே உணர்த்துகிறது; எழுவாய் வினைமுற்றில் மட்டும் மறைந்து போகாமல் தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: ἐπορεύθησαν
  choice: சென்றார்கள்
  rationale: πορεύομαι என்பதன் அடிப்படை இயக்கப் பொருளான ‘செல்/பயணம் செய்’ என்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் இல்லாத கூடுதல் நோக்கமோ காலநுட்பமோ சேர்க்கப்படவில்லை.
- source_word: εἰς
  choice: -க்கு
  rationale: இயக்கத்தின் இலக்கைச் சுட்டும் εἰς என்பதற்கு, ‘கிராமத்திற்குச்’ என்ற இலக்கு வேற்றுமை இயல்பான தமிழ் இணையாகும்.
- source_word: ἑτέραν
  choice: வேறொரு
  rationale: ἕτερος குறிக்கும் ‘மற்றொரு’ மற்றும் ‘வேறான’ ஆகிய இரு நிழற்பொருள்களையும் ‘வேறொரு’ சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: κώμην
  choice: கிராமம்
  rationale: κώμη என்பது பெரிய நகரத்தைவிடச் சிறிய ஊரகக் குடியிருப்பைக் குறிக்கிறது; ‘கிராமம்’ துல்லியமான நவீனத் தமிழ் சொல்.
