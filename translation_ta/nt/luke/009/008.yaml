  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: ta
  text: சிலர் எலியா தோன்றினார் என்றும், வேறு சிலர் முற்காலத் தீர்க்கதரிசிகளில் ஒருவர் உயிர்த்தெழுந்தார் என்றும் கூறினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: சிலர் ... வேறு சிலர் ... கூறினார்கள்
  rationale: கிரேக்கத்தில் முந்தைய வசனத்திலிருந்து தொடரும் செயப்படுவினை சார்ந்த சொல்லமைப்பு உள்ளது. தனி வசனமாகத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருக்க, செய்தியின் மூலத்தைக் குறிக்கும் அமைப்பு நேரடி கூற்றாக மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ ... δὲ
  choice: '... என்றும், வேறு சிலர் ... என்றும்'
  rationale: இவை கருத்துகளின் பட்டியலைத் தொடரும் மென்மையான இணைப்புகள்; தமிழில் ‘என்றும் ... என்றும்’ என்ற அமைப்பும் ‘வேறு சிலர்’ என்பதும் சேர்க்கை மற்றும் வேறுபாட்டை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἐφάνη
  choice: தோன்றியிருக்கிறார்
  rationale: φαίνω என்பதன் இச்செயப்பாட்டு வடிவம் இங்கு ‘காணும்படி தோன்றினார்’ என்ற பொருளைத் தருகிறது. நிறைவு பெற்றதாக அறிவிக்கப்பட்ட கருத்தைத் தமிழில் இயல்பாகக் காட்ட இவ்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: முற்காலத்துத் தீர்க்கதரிசி ஒருவர்
  rationale: τις தரும் உறுதியற்ற குறிப்பையும், τῶν ἀρχαίων தரும் முந்தைய காலத்தைச் சேர்ந்தவர் என்ற பொருளையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἀνέστη
  choice: உயிர்த்தெழுந்திருக்கிறார்
  rationale: இச்சூழலில் இறந்தவர்களில் இருந்து எழுதல் என்பதே இயல்பான பொருள். ‘உயிர்த்தெழுந்தார்’ என்பது அந்த உயிர்த்தெழுதல் நுணுக்கத்தைக் காக்கிறது; வெறுமனே மீண்டும் தோன்றினார் என்று மங்கலாக்கவில்லை.
theological_decisions:
- issue: முற்காலத் தீர்க்கதரிசியைப் பற்றிய மக்களின் கூற்றின் தன்மை
  choice: ‘உயிர்த்தெழுந்திருக்கிறார்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘மீண்டும் வந்திருக்கிறார்’ அல்லது ‘எழுப்பப்பட்டிருக்கிறார்’
  rationale: ἀνέστη நேரடியாக எழுந்திருத்தலைக் குறிக்கிறது; இச்சூழலில் மரணத்திலிருந்து உயிர்த்தெழுதல் பற்றிய மக்களின் கருத்தை வெளிப்படுத்துகிறது. மொழிபெயர்ப்பு அந்தக் கருத்தை ஆதரிக்காமலும், எந்தத் தீர்க்கதரிசி என்று தீர்மானிக்காமலும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடை பயன்படுத்தப்பட்டது. மூலத்தின் நீள்வாக்கியத் தொடர்பு தமிழில் இயல்பான ‘என்றும் ... என்றும் கூறினார்கள்’ அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
