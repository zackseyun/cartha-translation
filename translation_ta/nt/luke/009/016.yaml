- from: பின்பு அவர் அந்த ஐந்து அப்பங்களையும் இரண்டு மீன்களையும் எடுத்துக்கொண்டு, வானத்தை நோக்கிப் பார்த்து, அவற்றை ஆசீர்வதித்தார்[a]. அவற்றைப் பிட்டு, கூட்டத்தினருக்குப் பரிமாறும்படி சீடர்களிடம் தொடர்ந்து கொடுத்தார்.
  to: பின்பு அவர் அந்த ஐந்து அப்பங்களையும் இரண்டு மீன்களையும் எடுத்துக்கொண்டு, வானத்தை நோக்கிப் பார்த்து, அவற்றை ஆசீர்வதித்தார்[a]. அவற்றை உடைத்து, கூட்டத்தினர் முன் வைக்கும்படி சீடர்களுக்குத் தொடர்ந்து கொடுத்தார்.
  rationale: The revision corrects the Tamil recipient construction to reflect μαθηταῖς, renders παραθεῖναι more concretely as placing the food before the crowd, and substitutes a clearer modern verb for breaking. It retains the source’s plural food references, the direct object of ‘blessed,’ the narrative progression, and the imperfect’s ongoing distribution.
