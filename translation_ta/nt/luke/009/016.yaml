  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: ta
  text: பின்பு அவர் அந்த ஐந்து அப்பங்களையும் இரண்டு மீன்களையும் எடுத்துக்கொண்டு, வானத்தை நோக்கிப் பார்த்து, அவற்றை ஆசீர்வதித்தார்[a]. அவற்றை உடைத்து, கூட்டத்தினர் முன் வைக்கும்படி சீடர்களுக்குத் தொடர்ந்து கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றுக்காக அவர் நன்றி செலுத்தினார்” என்றும் பொருள் கொள்ளலாம். இங்கு வரும் கிரேக்க வினைச்சொல் நேரடியாக “ஆசீர்வதித்தார்” என்று பொருள்படும்; இணையான சில நிகழ்வுரைகளில் “நன்றி செலுத்தினார்” என்ற வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: எடுத்துக்கொண்டு
  rationale: முதன்மைச் செயல்களுக்கு முன் நிகழும் துணைச் செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: கதையின் அடுத்த கட்டத்துக்குச் செல்லும் மென்மையான இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἄρτους
  choice: அப்பங்கள்
  rationale: இச்சூழலில் தனித்தனி ரொட்டித் துண்டுகள் அல்லது சிறிய முழு அப்பங்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
- source_word: ἰχθύας
  choice: மீன்கள்
  rationale: மூலத்தின் பன்மை எண்ணிக்கையை நேரடியாகக் காட்டுகிறது.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: வானத்தை நோக்கிப் பார்த்து
  rationale: மேல்நோக்கிய பார்வையையும் ஜெபச் சூழலையும் மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐλόγησεν αὐτοὺς
  choice: அவற்றை ஆசீர்வதித்தார்
  rationale: εὐλογέω என்பதையும், அப்பங்களையும் மீன்களையும் சுட்டும் ஆண்பால் பன்மைச் சுட்டுப்பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κατέκλασεν
  choice: அவற்றைப் பிட்டு
  rationale: பகிர்ந்தளிப்பதற்காக உணவைப் பிட்ட செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐδίδου
  choice: தொடர்ந்து கொடுத்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் காட்டும் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த கொடுத்தலை வெளிப்படுத்துகிறது.
- source_word: μαθηταῖς
  choice: சீடர்களிடம்
  rationale: உடைமைப் பொருளைச் சேர்க்காமல் கிரேக்க உரையின் குறிப்பிட்ட சீடர்களைச் சுட்டுகிறது.
- source_word: παραθεῖναι
  choice: பரிமாறும்படி
  rationale: மக்களிடம் உணவை முன்வைத்து வழங்கும் நோக்கத்தை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ὄχλῳ
  choice: கூட்டத்தினருக்கு
  rationale: ὄχλος குறிக்கும் கூடியிருந்த மக்கள் திரளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஜெபச் சூழலில் οὐρανός என்பதன் பொருள்
  choice: வானம்
  alternative: ஆகாயம்
  rationale: தேவனை நோக்கிய மேல்நோக்குப் பார்வையின் மறைநயத்தைத் தக்கவைத்தபடியே, தமிழில் இயல்பானதும் மரியாதைக்குரியதுமான சொல்லை பயன்படுத்துகிறது.
- issue: εὐλόγησεν என்பதன் மொழிபெயர்ப்பு
  choice: ஆசீர்வதித்தார்
  alternative: நன்றி செலுத்தினார்
  rationale: இணை நிகழ்வுரைகளோடு ஒத்திசைக்க வேறு வினைச்சொல்லை புகுத்தாமல், லூக்கா பயன்படுத்திய εὐλογέω என்பதன் தனித்துவத்தையும் αὐτούς என்ற நேரடிச் செயப்படுபொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “தொடர்ந்து கொடுத்தார்” என்பது வினையின் தொடர்நிலையை வெளிப்படுத்துகிறது; “அவற்றை ஆசீர்வதித்தார்” என்பது மூலத்தின் உண்மையான இலக்கண மற்றும் இறையியல் இறுக்கத்தைத் தக்கவைக்கிறது.
