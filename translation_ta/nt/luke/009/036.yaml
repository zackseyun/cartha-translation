revisions:
- from: அந்தக் குரல் ஒலித்தபோது, இயேசு மட்டும் தனியாகக் காணப்பட்டார்.[a] சீடர்கள் அமைதியாக இருந்தார்கள்; தாங்கள் கண்டவற்றில் எதையும் அந்த நாட்களில் யாரிடமும் சொல்லவில்லை.
  to: அந்தக் குரல் எழுந்தபோது, இயேசு மட்டுமே காணப்பட்டார்.[a] அவர்கள் அமைதியாக இருந்தார்கள்; தாங்கள் கண்டவற்றில் எதையும் அந்த நாட்களில் யாரிடமும் சொல்லவில்லை.
  rationale: The revision removes the doubled expression “மட்டும் தனியாக” while retaining the Greek passive narrative formulation and the sense that Jesus alone was present/visible after the voice. “அந்தக் குரல் எழுந்தபோது” naturally represents the temporal force of ἐν τῷ γενέσθαι τὴν φωνήν without specifying more than the source does. The footnote continues to mark the legitimate contextual alternatives for εὑρέθη Ἰησοῦς μόνος.
