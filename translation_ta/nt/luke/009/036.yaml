source:
  edition: SBLGNT
  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: ta
  text: அந்தக் குரல் எழுந்தபோது, இயேசு மட்டுமே காணப்பட்டார்.[a] அவர்கள் அமைதியாக இருந்தார்கள்; தாங்கள் கண்டவற்றில் எதையும் அந்த நாட்களில் யாரிடமும் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு மட்டுமே எஞ்சியிருந்தார்” / “இயேசு தனியாகக் காணப்பட்டார்.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “இயேசு தனியாகக் காணப்பட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: அந்தக் குரல் ஒலித்தபோது
  rationale: ἐν + articular infinitive காலத்தைக் குறிக்கிறது. φωνή இச்சூழலில் பரலோகத்திலிருந்து வந்த உரைக்குரல்; தமிழில் குரல் ‘ஒலித்தபோது’ என்பது இயல்பாகவும் நிகழ்வின் காலத் தொடர்பைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: இயேசு மட்டும் தனியாகக் காணப்பட்டார்
  rationale: εὑρέθη என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் μόνος என்பதன் தனித்திருத்தலையும் நெருக்கமாகப் பாதுகாக்கிறது. ‘மட்டும் தனியாக’ என்பது மோசேயும் எலியாவும் இனி காணப்படாத காட்சியின் முடிவை விளக்காமல் விவரிக்கிறது.
- source_word: ἐσίγησαν
  choice: அமைதியாக இருந்தார்கள்
  rationale: σιγάω என்பது பேசாமல் இருத்தலைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் அடுத்துள்ள ‘சொல்லவில்லை’ என்பதுடன் தேவையற்ற மீளுரையைத் தவிர்க்கவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: யாரிடமும் சொல்லவில்லை
  rationale: ἀπαγγέλλω இங்கு கண்டதைத் தெரிவிப்பது அல்லது அறிக்கையிடுவது என்ற பொருள் கொண்டது; ‘சொல்லவில்லை’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: கிரேக்கத்தின் நேரடியான காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: தாங்கள் கண்டவற்றில் எதையும்
  rationale: οὐδέν உடனான பகுதியுறவு சார்புத் தொடரை ‘கண்டவற்றில் எதையும்’ எனத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; மறுப்பு ‘சொல்லவில்லை’ என்பதில் வெளிப்படுகிறது.
theological_decisions:
- issue: பரலோகக் குரலுக்குப் பிறகு இயேசு மட்டும் இருந்ததன் கதைசார் உட்பொருள்
  choice: ‘இயேசு மட்டும் தனியாகக் காணப்பட்டார்’ என்று விளக்கமின்றி விவரித்தல்
  alternative: ‘இயேசு மட்டுமே எஞ்சியிருந்தார்’ அல்லது ‘அவர்கள் இயேசுவை மட்டுமே கண்டார்கள்’
  rationale: வசனம் காட்சியின் முடிவை மட்டுமே கூறுகிறது; அதன் இறையியல் பொருளை வெளிப்படையாக விளக்கவில்லை. ஆகவே கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் கதைசார் கட்டுப்பாட்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சீடர்கள்’ என்பது கிரேக்கத்தின் αὐτοί என்ற சுட்டுப்பெயரின் சூழல்சார் குறிப்பைத் தெளிவுபடுத்துகிறது; புதிய பாத்திரத்தைச் சேர்ப்பதில்லை. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
