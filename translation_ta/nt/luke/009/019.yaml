reference: Luke 9:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: ta
  text: அவர்கள் பதிலளித்து, “திருமுழுக்கு கொடுக்கும் யோவான் என்று சிலர் சொல்கிறார்கள்; எலியா என்று வேறு சிலர் சொல்கிறார்கள்; பண்டைக்காலத் தீர்க்கதரிசி ஒருவர் எழுந்திருக்கிறார்[a] என்று இன்னும் சிலர் சொல்கிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை “உயிர்த்தெழுந்திருக்கிறார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: ἀνέστη என்ற கிரேக்க வினைச்சொல் இச்சூழலில் ‘எழுந்திருக்கிறார்’ என்பதோடு, மரித்தோரிலிருந்து உயிர்த்தெழுதல் என்ற சாத்திய ஒலிப்பையும் தரக்கூடும்.
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: மறுமொழியாக … என்றார்கள்
  rationale: பங்கேற்புவினை + முற்றுவினை அமைப்பின் மறுமொழி கூறும் பொருளை இயல்பான தமிழில் தருகிறது; தேவையற்ற சொல் இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: திருமுழுக்கு கொடுக்கும் யோவான்
  rationale: βαπτιστής என்பதன் அடையாளப்படுத்தும் பொருளை எளிய, சமகாலத் தமிழில் தருகிறது; ஒரு குறிப்பிட்ட சமய மரபின் வழக்குச் சொல்லை மட்டும் சார்ந்து நிற்கவில்லை.
- source_word: ἄλλοι δὲ … ἄλλοι δὲ
  choice: வேறு சிலரும் … இன்னும் சிலரும்
  rationale: மக்களிடையே இருந்த மாறுபட்ட கருத்துகளையும் கிரேக்கத்தின் மீளவரும் பட்டியல் அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἠλίαν
  choice: எலியா
  rationale: இந்தத் தீர்க்கதரிசியின் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வடிவம்.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: பண்டைக்காலத் தீர்க்கதரிசி ஒருவர்
  rationale: τις என்பதன் குறிப்பிடப்படாத தன்மையையும் τῶν ἀρχαίων என்பதன் பழங்கால மனிதர்களைக் குறிக்கும் பொருளையும் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: ἀνέστη
  choice: எழுந்திருக்கிறார்
  rationale: ‘எழுதல்’ மற்றும் மரித்தோரிலிருந்து ‘உயிர்த்தெழுதல்’ ஆகிய இரு சாத்திய ஒலிப்புகளையும் உடனடியாக ஒன்றாக முடிவுசெய்யாமல் காக்கிறது.
theological_decisions:
- issue: ἀνέστη என்பது உயிர்த்தெழுதலை வெளிப்படையாகக் குறிக்கிறதா
  choice: எழுந்திருக்கிறார்
  alternative: உயிர்த்தெழுந்திருக்கிறார்
  rationale: சூழல் மரித்த பழங்காலத் தீர்க்கதரிசி மீண்டும் தோன்றியதாக மக்கள் கருதியதைக் காட்டினாலும், கிரேக்க வினைச்சொல் வெறுமனே ‘எழுந்தார்/தோன்றினார்’ என்ற ஒலிப்பையும் தாங்குகிறது. ஆகவே பிரதான உரை அந்தத் தத்துவச் சாத்தியத்தை வலுக்கட்டாயமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. விடையின் பட்டியல் தன்மையைத் தெளிவாக்கத் தமிழில் இயல்பாகத் தேவைப்படும் “சிலரும்/வேறு சிலரும்/இன்னும் சிலரும்” சேர்க்கப்பட்டுள்ளது.
