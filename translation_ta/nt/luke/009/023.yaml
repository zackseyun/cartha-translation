source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: ta
  text: அவர் எல்லாரிடமும், “யாராவது என் பின்னே வர விரும்பினால், அவர் தன்னையே மறுக்கட்டும்; நாள்தோறும் தன் சிலுவையை எடுத்துக்கொள்ளட்டும்; என்னைப் பின்தொடரட்டும்” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், இயேசு சொல்லிக்கொண்டிருந்தார் என்ற கிரேக்க வினையின் imperfect அம்சத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πρὸς πάντας
  choice: எல்லாரிடமும்
  rationale: உரையின் கூட்டு நோக்கெல்லையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Εἴ τις θέλει
  choice: யாராவது ... விரும்பினால்
  rationale: τις என்பதன் வரையறுக்கப்படாத பொதுப்பொருளையும் θέλει என்பதன் விருப்பத்தையும் நவீன தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: என் பின்னே வர
  rationale: சீடத்துவத்தைக் குறிக்கும் உருவகத்தைத் தக்கவைத்து, பின்னர் வரும் ‘பின்தொடர்’ என்ற தனி வினையோடு இதை ஒன்றாக்காமல் வைத்திருக்கிறது.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: அவர் தன்னையே மறுத்து
  rationale: தன்னை மறுத்தல் என்ற வலுவான பொருளையும் மூன்றாம் நபர் கட்டளைத் தொடரையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀράτω
  choice: எடுத்துக்கொண்டு
  rationale: சிலுவையைத் தன் மீது ஏற்றுக்கொள்ளும் செயலைக் குறிக்கிறது; வெறுமனே சுமப்பதாக மட்டும் பொருளை மாற்றவில்லை.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: தன் சிலுவையை
  rationale: ‘சிலுவை’ என்ற நேரடிப் படிமத்தையும், எழுவாயைத் திரும்பச் சுட்டும் உடைமைப் பொருளையும் பாதுகாக்கிறது.
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ‘ஒவ்வொரு நாளும்’ என்ற லூக்காவின் தொடர்ச்சியான சீடத்துவ வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀκολουθείτω μοι
  choice: என்னைப் பின்தொடரட்டும்
  rationale: மூன்றாம் நபர் ஒருமைக் கட்டளையைத் தெளிவாகக் காட்டி, இயேசுவைப் பின்பற்றுதலை நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: சீடத்துவத்தில் ‘சிலுவை’ என்ற மொழியின் தன்மை
  choice: ‘சிலுவை’ என்ற நேரடிச் சொல்லைத் தக்கவைத்தல்
  alternative: துன்பம், சுமை அல்லது தியாகம் என்று விளக்கிப் பெயர்த்தல்
  rationale: σταυρός என்பது தெளிவான பொருளைக் குறிக்கும் சொல். அதன் உருவக, இறையியல் நிறைகளை மொழிபெயர்ப்பு ஒரே விளக்கமாகச் சுருக்கக்கூடாது.
- issue: கிரேக்க மூலத்தின் பொதுப்பொருளுடைய ஒருமை
  choice: ‘யாராவது ... அவர் ... தன்’ என்ற ஒருமைத் தொடரை வைத்தல்
  alternative: ‘யாரெல்லாம் ... அவர்கள் ... தங்கள்’ என்ற பன்மையாக மாற்றுதல்
  rationale: மூலம் வரையறுக்கப்படாத ஒருமையில் தொடங்கி, ஒருமைக் கட்டளைகளாலும் தற்சுட்டுப் பெயராலும் தொடர்கிறது. தமிழில் பாலைக் குறிப்பதில்லாத ‘அவர்’ இதைப் புரிந்துகொள்ளத்தக்க வகையில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் பின்னே வர’ மற்றும் ‘என்னைப் பின்தொடர்’ என்ற இரு வேறுபட்ட கிரேக்க வெளிப்பாடுகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
