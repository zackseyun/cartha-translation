id: LUK.9.57
reference: Luke 9:57
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: ta
  text: அவர்கள் வழியில் போய்க்கொண்டிருந்தபோது, ஒருவர் அவரிடம், “நீர் எங்கே சென்றாலும்[a] நான் உம்மைப் பின்பற்றுவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்பாக, “நீர் எங்கே புறப்பட்டுச் சென்றாலும்.”
    reason: ἀπέρχομαι என்பதன் ‘புறப்பட்டுச் செல்’ அல்லது ‘விட்டுச் செல்’ என்ற நுணுக்கமான மாற்றுப் பொருளைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: அவர்கள் போய்க்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையுடன் அமைந்த தனிநிலை உடைமை வேற்றுமைத் தொடர், அதே நேரத்தில் தொடர்ந்து நடைபெற்ற பயணத்தைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அந்த நேர உறவையும் தொடர்ச்சியையும் இயல்பாகக் காக்கிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணம் நடைபெறும் இடத்தை இயல்பான தமிழில் குறிக்கிறது; லூக்காவில் காணப்படும் பயணக் கருப்பொருளின் எதிரொலியையும் இழக்கவில்லை.
- source_word: εἶπέν τις
  choice: ஒருவர் ... என்றார்
  rationale: τις என்பது பாலினத்தைக் குறிப்பிடாத, அடையாளம் சொல்லப்படாத ஒருவரைக் குறிக்கிறது; ஆகவே மூலத்தில் இல்லாத ‘ஒரு மனிதர்’ என்பதைச் சேர்க்கவில்லை.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: பேசுதலைக் குறிக்கும் வினையுடன் πρός என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: Ἀκολουθήσω σοι
  choice: நான் உம்மைப் பின்பற்றுவேன்
  rationale: எதிர்கால வினை வடிவம் உறுதியான நோக்கத்தையோ வாக்குறுதியையோ வெளிப்படுத்துகிறது. ‘பின்பற்றுவேன்’ என்பது உடன் செல்லுதல் மற்றும் சீடத்துவம் ஆகிய இரு எதிரொலிகளையும் காக்கிறது.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: நீர் எங்கே சென்றாலும்
  rationale: ὅπου, ἐάν, மற்றும் துணைவினை அமைப்பு வரையறுக்கப்படாத ‘எங்கே ... ஆனாலும்’ என்ற பொருளைத் தருகிறது. ἀπέρχομαι என்பதிலுள்ள ‘புறப்பட்டுச் செல்’ என்ற நுணுக்கத்தை அடிக்குறிப்பு பதிவு செய்கிறது; முதன்மை உரையில் ‘சென்றாலும்’ இயல்பாக உள்ளது.
theological_decisions:
- issue: ἀκολουθέω என்பதில் உள்ள சீடத்துவப் பொருள்
  choice: ‘உம்மைப் பின்பற்றுவேன்’ என்று மொழிபெயர்க்கப்பட்டது; விளக்க விரிவாக்கம் சேர்க்கப்படவில்லை.
  alternative: ‘உமது சீடனாவேன்’
  rationale: லூக்காவின் சூழலில் இந்த வினை சீடத்துவத்தைக் குறித்தாலும், அது உடன்செல்லும் நேரடிப் பொருளையும் கொண்டுள்ளது. ‘பின்பற்றுவேன்’ இரண்டையும் காத்து, மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் ‘நீர்/உம்மை’ என்ற மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; τις என்பதற்கு பாலினம் சேர்க்காமல் ‘ஒருவர்’ என வழங்கப்பட்டுள்ளது.
