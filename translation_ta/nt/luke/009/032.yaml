  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: ta
  text: பேதுருவும் பேதுருவுடன் இருந்தவர்களும் தூக்கத்தால் கனத்திருந்தார்கள்; ஆனால் அவர்கள் முழுமையாக விழிப்படைந்தபோது[a], அவருடைய மகிமையையும் அவருடன் நின்றுகொண்டிருந்த அந்த இரு மனிதர்களையும் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழித்தெழுந்த பிறகு” அல்லது “முழுமையாக விழித்ததும்.” இங்கு வரும் கிரேக்க வினைச்சொல் அரிதானது; அவர்கள் தொடர்ந்து விழித்திருந்தார்கள் என்பதைவிட, முழு விழிப்புநிலைக்கு வந்ததை இது வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: தூக்கத்தால் கனத்திருந்தார்கள்
  rationale: தூக்கம் அவர்களை அழுத்தும் பாரமாக இருந்த நிலையைக் குறிக்கும் மூலமொழி உருவகத்தை, நவீன தமிழில் இயல்பாகவும் வெறும் ‘தூக்கமாக இருந்தார்கள்’ என்பதைக் காட்டிலும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: διαγρηγορήσαντες
  choice: முழுமையாக விழிப்படைந்தபோது
  rationale: அரிதாக வரும் இவ்வினைச்சொல், அவர்கள் தொடர்ந்து விழித்திருந்தார்கள் என்பதைக் காட்டிலும் தூக்க மயக்கத்திலிருந்து முழு விழிப்புநிலைக்கு வந்தார்கள் என்பதை இச்சூழலில் இயல்பாகக் குறிக்கிறது; இதன் சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: δόξα என்பதற்கான நிலையான வேதாகமத் தமிழ்ச் சொல்லாகிய ‘மகிமை’, காட்சியின் ஒளிமிகு மேன்மையையும் அதன் இறையியல் ஒலிப்பையும் அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: τοὺς δύο ἄνδρας
  choice: அந்த இருவரையும்
  rationale: சூழலில் ஏற்கெனவே அடையாளம் காணப்பட்ட மோசே, எலியா ஆகிய இரு ஆண்களைக் குறிக்கும் definite சொற்றொடரை, தமிழில் இயல்பாக ‘அந்த இருவர்’ என வழங்குகிறது.
- source_word: συνεστῶτας αὐτῷ
  choice: அவருடன் நின்றுகொண்டிருந்த
  rationale: இயேசுவுடன் அருகில் நின்றிருந்த காட்சிநிலையை participial வடிவில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: δὲ … δὲ
  choice: முதல் δὲ வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; இரண்டாவது ‘ஆனால்’
  rationale: முதல் δέ மென்மையான உரையாடல் நகர்வை மட்டும் குறிப்பதால் தமிழில் தனிச் சொல்லின்றியும் இயல்பாக அமைகிறது; இரண்டாவது δέ தூக்கத்தால் கனத்த நிலைக்கும் பின்னர் கண்ட காட்சிக்கும் உள்ள முரணை ‘ஆனால்’ என்று காட்டுகிறது.
theological_decisions:
- issue: மறுரூபக் காட்சியில் δόξα என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய மகிமை
  alternative: அவருடைய ஒளிமிகு மேன்மை / மாட்சிமை
  rationale: ‘மகிமை’ என்பது காணப்பட்ட வெளிப்பாட்டையும் வேதாகமம் முழுவதும் உள்ள இறையியல் தொடர்பையும் பாதுகாக்கிறது; அதேவேளை அந்த மகிமையின் இயல்பை மொழிபெயர்ப்பிலேயே கூடுதலாக வரையறுப்பதில்லை.
- issue: διαγρηγορήσαντες குறிக்கும் விழிப்புநிலை
  choice: அவர்கள் முழுமையாக விழிப்படைந்தபோது
  alternative: அவர்கள் விழித்திருந்ததால் / விழித்த பிறகு
  rationale: முந்தைய தூக்க அழுத்தத்துடன் இயல்பாகப் பொருந்தும் வகையில் முழு விழிப்புநிலைக்கு வந்ததை முதன்மை வாசிப்பாக அளிக்கிறது; அவர்கள் முழு நேரமும் விழித்தே இருந்தார்கள் என்று அமைதியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூக்கத்தால் கனத்திருந்தார்கள்’ என்பது மூல உருவகத்தை இயல்பாகத் தக்கவைக்கிறது; ‘அந்த இருவர்’ என்பது தேவையற்ற மொழிபெயர்ப்புச் செயற்கைத்தன்மையைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
