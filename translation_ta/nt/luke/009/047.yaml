  text: ஆனால் இயேசு, அவர்களுடைய உள்ளத்தில் இருந்த சிந்தனையை[a] அறிந்து, ஒரு குழந்தையைப் பிடித்து, தம் அருகில்[b] நிறுத்தினார்.
