lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்து
  rationale: இங்கு இந்த இறந்தகால வினையெச்சம் மனத்தால் உணர்வதையோ அறிந்திருப்பதையோ குறிக்கிறது. இயேசு அவர்களுடைய அக எண்ணத்தை அறிந்திருந்தார் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; அவர் அதை எவ்வாறு அறிந்தார் என்பதைக் கூடுதலாக விளக்கவில்லை.
- source_word: διαλογισμὸν
  choice: எண்ணப்போக்கை
  rationale: இந்தச் சொல் வெறும் தனி எண்ணத்தை மட்டுமல்லாமல், மனத்திற்குள் நடைபெறும் சிந்தனை அல்லது ஆராய்ச்சிப் போக்கையும் குறிக்கலாம். சீடர்களிடையே யார் பெரியவர் என்ற விவாதத்தின் அகநிலையை ‘எண்ணப்போக்கு’ நன்கு வெளிப்படுத்துகிறது.
- source_word: τῆς καρδίας αὐτῶν
  choice: அவர்களின் உள்ளங்களில்
  rationale: கிரேக்கத்தில் ‘அவர்களுடைய உள்ளத்தின்’ என்று ஒருமையில் இருந்தாலும், பன்மை நபர்களின் அகநிலையைக் குறிக்கும் இயல்பான நவீன தமிழுக்காக ‘உள்ளங்களில்’ என வழங்கப்பட்டுள்ளது. மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπιλαβόμενος
  choice: பிடித்து
  rationale: இந்த நடுநிலை வினையெச்சம் ஒருவரையோ ஒன்றையோ பற்றிக்கொள்வதை அல்லது பிடிப்பதைச் சுட்டுகிறது. ‘பிடித்து’ என்பது அந்தத் தெளிவான உடல்செயலைக் காக்கிறது; ‘அழைத்து’ என்று மொழிபெயர்த்து செயலை மென்மைப்படுத்தவில்லை.
- source_word: παιδίον
  choice: ஒரு குழந்தையை
  rationale: παιδίον ஒரு குழந்தையைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத வயது அல்லது சிறுமையை கூடுதலாக வலியுறுத்தாமல் பொதுவான சொல்லே பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔστησεν
  choice: நிறுத்தினார்
  rationale: ἵστημι என்பதன் இச்செயப்படுத்தும் வடிவம் ‘நிற்கச் செய்தார்’ என்பதைக் குறிக்கிறது. ‘நிறுத்தினார்’ என்பது நிற்கும் காட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: παρ’ ἑαυτῷ
  choice: தம் அருகில்
  rationale: இந்தச் சொற்றொடர் இயேசுவின் அருகில் அல்லது பக்கத்தில் என்பதைக் குறிக்கிறது. ‘தம் அருகில்’ என்பது இயேசுவையே சுட்டும் தற்சுட்டுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசு உள்ளார்ந்த எண்ணங்களை அறிந்தது
  choice: அவர்களின் அக எண்ணப்போக்கை இயேசு அறிந்தார் என்று மட்டும் உரை கூறுகிறது.
  alternative: அது தெய்வீக சர்வஞானத்தினாலோ கூரிய மனித உணர்திறனாலோ நிகழ்ந்தது என்று வெளிப்படையாக விளக்குதல்.
  rationale: லூக்கா இவ்வசனத்தில் இயேசு அதை எவ்வாறு அறிந்தார் என்று குறிப்பிடவில்லை. ஆகவே அவரது அறிவை உறுதிப்படுத்திக்கொண்டே, அதன் செயல்முறையை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
