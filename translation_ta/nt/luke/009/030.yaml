source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: ta
  text: இதோ, இரண்டு ஆண்கள் அவரோடு பேசிக்கொண்டிருந்தார்கள்; அவர்கள் மோசேயும் எலியாவும் ஆவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீரென கவனத்தை ஈர்த்து காட்சியை உயிரோட்டமாக முன்வைக்கும் லூக்காவின் உரைச்சுட்டியை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἄνδρες δύο
  choice: இரண்டு ஆண்கள்
  rationale: இங்கு மோசே, எலியா என்னும் அடையாளம் காணத்தக்க ஆண் நபர்களைக் குறிப்பதால், பாலினக் குறிப்பைத் தெளிவாகக் காக்கும் நேரான மொழிபெயர்ப்பு.
- source_word: συνελάλουν
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலையை உணர்த்தும் imperfect வினையின் நீடித்த செயற்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவரோடு
  rationale: συλλαλέω என்பதுடன் வரும் dative, ஒருவரோடு ஒருவர் உரையாடுவதைச் சுட்டுகிறது; ஆகவே ‘அவரிடம்’ என்பதைவிட ‘அவரோடு’ பரஸ்பர உரையாடலைச் சிறப்பாக வெளிப்படுத்துகிறது.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முன்னர் கூறப்பட்ட இரண்டு ஆண்களையும் தொடர்ந்து அடையாளப்படுத்தும் உறவுப்பெயர்ச்சொல்லை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: Ἠλίας
  choice: எலியா
  rationale: எபிரெயத் தீர்க்கதரிசியின் பெயருக்கான தமிழில் நிலைபெற்ற, வாசகர்களுக்கு பரிச்சயமான வடிவம்.
theological_decisions:
- issue: மறுரூபக் காட்சியில் தோன்றிய இருவரின் அடையாளம்
  choice: அந்த இரண்டு ஆண்கள் மோசேயும் எலியாவும் என உரை நேரடியாக அடையாளப்படுத்துகிறது.
  alternative: அவர்களின் அடையாளத்திற்குச் சின்னவியல் அல்லது இறுதிக்கால விளக்கம் சேர்த்தல்.
  rationale: மூலவுரை இவர்களை நேரடியாகப் பெயரிடுகிறது; அவர்களின் அடையாளத்தின் இறையியல் முக்கியத்துவத்தை விளக்கும் கூடுதல் பொருளை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைந்துள்ளது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘பேசிக்கொண்டிருந்தார்கள்’ தொடர்ச்சியான உரையாடலை வெளிப்படுத்துகிறது.
