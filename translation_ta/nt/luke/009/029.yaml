- from: அவர் ஜெபித்துக்கொண்டிருந்தபோது, அவருடைய முகத் தோற்றம் வேறுபட்டது[a]; அவருடைய உடை வெண்மையாக, மின்னலைப்போல் பளிச்சிட்டது[b].
  to: அவர் ஜெபித்துக்கொண்டிருந்தபோது, அவருடைய முகத் தோற்றம் வேறுபட்டதாக மாறியது[a]; அவருடைய உடை வெண்மையாக மின்னலைப்போல் பளிச்சிட்டது[b].
  rationale: The revision explicitly marks the change in the appearance of Jesus’ face, which is required by the Greek sense and the narrative context, while retaining the deliberately restrained idea that it became “different.” The clothing clause and its footnote preserve λευκός as “white” and ἐξαστράπτων as lightning-like flashing.
