source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: ta
  text: அவர் ஜெபித்துக்கொண்டிருந்தபோது, அவருடைய முகத் தோற்றம் வேறுபட்டதாக மாறியது[a]; அவருடைய உடை வெண்மையாக மின்னலைப்போல் பளிச்சிட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய முகத் தோற்றம் மாறியது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய உடை வெண்மையாகவும் கண்கூசும் ஒளியுடன் பிரகாசித்தது.” கிரேக்கப் பங்கேற்புவினை மின்னலைப் போன்ற பளிச்சிடுதலை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: அவர் ஜெபித்துக்கொண்டிருந்தபோது
  rationale: லூக்கா பயன்படுத்தும் இந்தத் தொடரமைப்பு, அவர் ஜெபித்துக்கொண்டிருந்த நேரத்தில் நிகழ்ந்ததை அறிமுகப்படுத்துகிறது. ‘அது நிகழ்ந்தது’ என்பதைத் தனியாகச் சேர்க்காமல், இயல்பான தமிழில் காலத் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: அவருடைய முகத் தோற்றம்
  rationale: εἶδος இங்கு காணக்கூடிய தோற்றத்தையும் πρόσωπον முகத்தையும் குறிக்கின்றன. ‘முகத் தோற்றம்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: ἕτερον
  choice: வேறுபட்டது
  rationale: ἕτερον என்பதன் நேரான பொருள் ‘வேறானது/வேறுபட்டது.’ இது உண்மையான காட்சிமாற்றத்தைக் குறிக்கிறது; ஆனால் மற்ற நற்செய்தி நூல்களின் வலுவான சொற்களை இங்கு புகுத்தாமல் லூக்காவின் கட்டுப்பட்ட சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: அவருடைய உடை
  rationale: ἱματισμός என்பது ஆடை அல்லது உடையைக் குறிக்கிறது. ஒருமைத் தொகுப்புப்பெயரான ‘உடை’ சாதாரண வாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: λευκὸς
  choice: வெண்மையாக
  rationale: λευκός என்பதன் அடிப்படை நிறப்பொருளை நேரடியாகத் தருகிறது. ஒளியின் தீவிரம் அடுத்த பங்கேற்புவினையால் தனியாக வெளிப்படுகிறது.
- source_word: ἐξαστράπτων
  choice: மின்னலைப்போல் பளிச்சிட்டது
  rationale: இந்தச் சொல் மின்னலை ஒத்த ஒளிப்பளிச்சை உணர்த்துகிறது. ‘பளிச்சிட்டது’ அந்தத் திடீரான பிரகாசத்தையும், ‘மின்னலைப்போல்’ அதன் உயிரோட்டமான உருவகத்தையும் பாதுகாக்கின்றன.
theological_decisions:
- issue: இயேசுவின் உருமாற்றத்தை விவரித்தல்
  choice: அவருடைய முகத் தோற்றம் காணக்கூடிய விதத்தில் வேறுபட்டதாகவும், உடை மின்னலைப்போல் பளிச்சிட்டதாகவும் லூக்காவின் சொந்தச் சொல்லாட்சியிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவருடைய முகம் ஒளிவீசியது’ அல்லது ‘அவருடைய முகம் மாற்றப்பட்டது’ என்று மொழிபெயர்த்தல்.
  rationale: வசனம் உண்மையான காட்சிமாற்றத்தை விவரிக்கிறது. எனினும், லூக்கா ‘முகம் ஒளிவீசியது’ என்று கூறவில்லை; ஆகவே இணை நற்செய்தி விவரங்களுடன் ஒத்திசைக்காமல் அவரது சொல்லாட்சியின் கட்டுப்பாடும் இறையியல் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபித்துக்கொண்டிருந்தபோது’ நிகழ்வின் காலத் தொடர்பை இயல்பாகத் தருகிறது; ‘மின்னலைப்போல் பளிச்சிட்டது’ மூலத்தின் உயிரோட்டமான காட்சியுருவைத் தக்கவைக்கிறது.
