source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களிடம் உண்மையாகச் சொல்கிறேன்: இங்கே நிற்பவர்களில் சிலர்[a], தேவனுடைய அரசாட்சியைக் காணும்வரை மரணத்தைச் சுவைக்கவே மாட்டார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இங்கே நிற்பவர்களில் சிலர்.”
    reason: lexical_alternative
  - marker: b
    text: “மரணத்தைச் சுவைத்தல்” என்பது “மரணத்தை அனுபவித்தல்” அல்லது “இறத்தல்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: ஆனால் நான் உங்களிடம் உண்மையாகச் சொல்கிறேன்
  rationale: δέ என்பதன் உரையாடல் மாற்றத்தை ‘ஆனால்’ காட்டுகிறது; ἀληθῶς என்பது இயல்பான தமிழில் வினையடையாக ‘உண்மையாக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: இங்கே நிற்பவர்களில் சிலர்
  rationale: பகுதிப்பொருள் தரும் மரபுத்தொடரை இயல்பான தமிழில் ‘…வர்களில் சிலர்’ எனத் தருகிறது; αὐτοῦ இங்கு இடச்சுட்டாக ‘இங்கே’ எனப் புரிந்துகொள்ளப்படுகிறது.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: மரணத்தைச் சுவைக்கவே மாட்டார்கள்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பை ‘-வே மாட்டார்கள்’ காட்டுகிறது; γεύομαι உருவகத்தை அழிக்காமல் ‘மரணத்தைச் சுவைத்தல்’ எனப் பாதுகாக்கிறது.
- source_word: ἕως ἂν ἴδωσιν
  choice: காணும்வரை
  rationale: எதிர்கால நோக்குடைய கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: தேவனுடைய அரசாட்சி
  rationale: βασιλεία என்பதில் உள்ள அரசாட்சி/அரசு சார்ந்த பரந்த பொருளை முடிந்தவரை காக்கிறது; வெறும் ஆட்சிச் செயல் என்று குறுக்கவில்லை.
theological_decisions:
- issue: ‘தேவனுடைய அரசாட்சியைக் காணுதல்’ எதைக் குறிக்கிறது?
  choice: எந்த நிகழ்வையும் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சொற்றொடர் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: மறுரூப நிகழ்வு, உயிர்த்தெழுதல்/விண்ணேற்றம், எருசலேமின் அழிவு, அல்லது திருச்சபையின் பரவல் என்று விளக்குதல்.
  rationale: வரலாற்றில் பல விளக்கங்கள் முன்வைக்கப்பட்டுள்ளன. குறிப்பிட்ட இறுதிக்கால விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல், மூலத்தில் உள்ள இறையியல் திறந்தநிலையை இது பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மரணத்தைச் சுவைத்தல்’ என்ற மூல உருவகம் பிரதான உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; வலியுறுத்தப்பட்ட மறுப்பு ‘-வே மாட்டார்கள்’ மூலம் இயல்பாகத் தரப்பட்டுள்ளது.
