source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: ta
  text: இந்தக் கூற்றுகளுக்குப் பிறகு[a], ஏறக்குறைய எட்டு நாட்கள் கழித்து[b], அவர் பேதுருவையும் யோவானையும் யாக்கோபையும் தம்முடன் அழைத்துக்கொண்டு, ஜெபிப்பதற்காக மலைமேல் ஏறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த வார்த்தைகளுக்குப் பிறகு.’ இங்குள்ள கிரேக்க λόγους என்பதற்கு ‘கூற்றுகள்’ அல்லது ‘வார்த்தைகள்’ என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘ஏறக்குறைய எட்டு நாட்கள்’; ὡσεὶ என்பது கால அளவு தோராயமானது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல் இயல்பான கதைத் தொடராக அமைத்தல்
  rationale: இந்தச் சொற்றொடர் இங்கு பெரும்பாலும் கதை நகர்வைக் குறிக்கிறது; வெளிப்படையான ‘இப்போது’ என்ற காலப்பொருளைச் சேர்க்காமல் தமிழில் இயல்பான வாக்கியத் தொடரால் அதன் பணியை வெளிப்படுத்தலாம்.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: இந்தக் கூற்றுகளுக்குப் பிறகு
  rationale: λόγους என்பது உடனடியாக முன்பு சொல்லப்பட்டவற்றைக் குறிக்கிறது. ‘கூற்றுகள்’ என்பது ‘வார்த்தைகள்’ என்ற மாற்றையும் விட இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது; மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: ஏறக்குறைய எட்டு நாட்கள் கழித்து
  rationale: ὡσεὶ கால அளவு தோராயமானது என்பதைத் தெளிவாகக் குறிக்கிறது; ‘ஏறக்குறைய’ அந்தத் துல்லியமின்மையைப் பாதுகாக்கிறது.
- source_word: παραλαβὼν
  choice: தம்முடன் அழைத்துக்கொண்டு
  rationale: இவ்வினையெச்சம் உடன் கூட்டிச் செல்வதைக் குறிக்கிறது. மரியாதை ஒருமையுடன் ‘தம்முடன் அழைத்துக்கொண்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: பேதுருவையும் யோவானையும் யாக்கோபையும்
  rationale: பெயர்கள் நிலைபெற்ற தமிழ் வடிவங்களில் தரப்பட்டுள்ளன; மீண்டும் வரும் καί-இன் பட்டியல் ஓசை ‘-யும்’ இணைப்பால் பாதுகாக்கப்படுகிறது.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: மலைமேல் ஏறினார்
  rationale: ἀνέβη மேலேறுதலைக் குறிக்கிறது; εἰς τὸ ὄρος உடன் சேர்ந்து மலையை நோக்கிய ஏற்ற இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது. கிரேக்க உரையின் குறிப்புச் சுட்டு குறிப்பிட்ட எந்த மலையென்று அவசியம் தீர்மானிக்கவில்லை.
- source_word: προσεύξασθαι
  choice: ஜெபிப்பதற்காக
  rationale: இறைவேண்டல் செய்யும் நோக்கத்தைக் காட்டும் இவ்வினையெச்சப் பொருளை ‘ஜெபிப்பதற்காக’ நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இணை நற்செய்திக் குறிப்புகளுடன் தொடர்புடைய காலக் கணக்கின் தோராயத்தன்மை
  choice: ஏறக்குறைய எட்டு நாட்கள்
  alternative: எட்டு நாட்கள்
  rationale: லூக்காவின் ὡσεὶ தோராயத்தன்மையை வெளிப்படையாகக் குறிக்கிறது. மற்ற நற்செய்திக் குறிப்புகளோடு ஒத்திசைக்க முயலாமலும் எண்ணைத் துல்லியமானதாக மாற்றாமலும் மூலத்தின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதை ஒருமை கையாளப்பட்டுள்ளது. ‘ஜெபம்’ என்பது பரவலாகப் புரியப்படும் திருவிவிலியத் தமிழ் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
