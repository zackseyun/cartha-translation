source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: ta
  text: எவரெல்லாம் உங்களை ஏற்றுக்கொள்ளவில்லையோ[a], அந்த ஊரிலிருந்து[b] வெளியேறும்போது, அவர்களுக்கு எதிரான சாட்சியாக உங்கள் கால்களில் உள்ள தூசியை உதறிவிடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களை வரவேற்காத எவரெல்லாம்.’ இங்கு வரும் வினைச்சொல், தூதர்களை வரவேற்பதையும் ஏற்றுக்கொள்வதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த நகரத்திலிருந்து.’ கிரேக்கச் சொல் சூழலுக்கு ஏற்ப ஓர் ஊரையோ நகரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: உங்களை ஏற்றுக்கொள்ளாதவர்கள் யாராக இருந்தாலும்
  rationale: ὅσοι ἄν என்பதன் பொதுமைப்படுத்தும், எண்ணிக்கையை வரையறுக்காத பொருளை ‘யாராக இருந்தாலும்’ வெளிப்படுத்துகிறது. δέχομαι என்பது தூதர்களை வரவேற்று ஏற்றுக்கொள்வது என்ற இரு நுணுக்கங்களையும் கொண்டுள்ளது; ‘ஏற்றுக்கொள்ளாதவர்கள்’ அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: அந்த ஊரைவிட்டு வெளியேறும்போது
  rationale: நிகழ்காலப் பங்கேற்புவினை முக்கிய கட்டளையோடு ஒரே காலத்தில் நிகழும் செயலைக் குறிக்கிறது. ‘வெளியேறும்போது’ இதை இயல்பான தமிழில் தருகிறது; ‘அந்த’ என்பது ἐκείνης-ஐப் பாதுகாக்கிறது.
- source_word: πόλις
  choice: ஊர்
  rationale: πόλις சூழலுக்கு ஏற்ப சிறிய ஊரையோ நகரத்தையோ குறிக்கலாம். நவீன தமிழில் ‘ஊர்’ அளவைத் தேவையின்றி வரையறுக்காமல் இந்தப் பணி சூழலுக்கு இயல்பாக அமைகிறது.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: உங்கள் கால்களில் படிந்த தூசியை
  rationale: கால்களில் இருந்த தூசி என்ற மூலப்படிமத்தை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; κονιορτός என்பதற்கு ‘தூசி’ நேரான பொருத்தம்.
- source_word: ἀποτινάσσετε
  choice: உதறிவிடுங்கள்
  rationale: வலுவாக அசைத்துத் தூசியை அகற்றும் அடையாளச் செயலை ‘உதறிவிடுங்கள்’ துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: அவர்களுக்கு எதிரான சாட்சியாக
  rationale: μαρτύριον என்பதன் சான்றளிக்கும் பொருளையும், இச்சூழலில் ἐπί உடன் வரும் எதிர்மறை அல்லது நீதித்துறை நுணுக்கத்தையும் இச்சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: கால்தூசியை உதறும் அடையாளச் செயலின் வலிமை
  choice: தூதர்களை ஏற்றுக்கொள்ளாதவர்களுக்கு எதிரான சாட்சியாக அந்தச் செயலை வழங்குதல்
  alternative: அவர்களுக்கு அளிக்கப்படும் நடுநிலையான அடையாளம்; அல்லது இறுதித் தண்டனையை வெளிப்படையாக அறிவித்தல்
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς என்பது வெறும் நடுநிலையான சைகையைவிட எச்சரிக்கை மற்றும் நீதித்துறை வலிமை கொண்டது. அதேவேளையில், இந்த வசனம் இறுதித் தண்டனையின் முழு தன்மையை விளக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தை விரிவுபடுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஊர்’ என்பது அளவைத் திணிக்காமல் இயல்பாக உள்ளது; ‘உதறிவிடுங்கள்’ அடையாளச் செயலின் உடல் இயக்கத்தையும் கட்டளையின் வலிமையையும் காக்கிறது.
