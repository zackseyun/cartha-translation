review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generalizing reference of ὅσοι ἄν, the rejection of the messengers, departure from that particular πόλις, the dust-shaking action, and its adverse testimonial force. A small revision makes the indefinite plural construction more idiomatic in Tamil and renders the dust phrase closer to the Greek without adding meaning.
  naturalness: ‘உங்களை ஏற்றுக்கொள்ளாதவர்கள் யாராக இருந்தாலும்’ is understandable but somewhat cumbersome, because the plural noun followed by ‘யாராக இருந்தாலும்’ is less natural than a Tamil distributive-relative construction. ‘எவரெல்லாம் ... இல்லையோ’ is fluent modern standard Tamil. ‘உங்கள் கால்களில் உள்ள தூசி’ is also more direct than ‘கால்களில் படிந்த தூசி,’ since the Greek does not specifically state that the dust is stuck to the feet.
  terminology: ‘ஏற்றுக்கொள்ளுதல்,’ ‘ஊர்,’ ‘தூசி,’ ‘உதறிவிடுங்கள்,’ and ‘எதிரான சாட்சியாக’ are appropriate, dignified, and theologically non-expansive. ‘சாட்சியாக’ preserves μαρτύριον without turning the action into an explicit declaration of final judgment.
  issues:
  - severity: low
    issue: The phrase ‘ஏற்றுக்கொள்ளாதவர்கள் யாராக இருந்தாலும்’ is syntactically heavy in Tamil.
    rationale: It represents the source sense, but ‘எவரெல்லாம் உங்களை ஏற்றுக்கொள்ளவில்லையோ’ more naturally expresses the open-ended plural/generalizing force of ὅσοι ἄν.
  - severity: low
    issue: ‘கால்களில் படிந்த தூசி’ slightly specifies the dust as adhering to the feet.
    rationale: The Greek says dust ‘from your feet’ but does not explicitly describe it as having become stuck. ‘கால்களில் உள்ள தூசி’ retains the physical image without that minor added specification.
