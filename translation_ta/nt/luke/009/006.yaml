id: LUK.9.6
reference: Luke 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: ta
  text: அவர்கள் புறப்பட்டு, கிராமம் கிராமமாகச் சென்று[a], எங்கும் நற்செய்தியை அறிவித்தும்[b] குணமளித்தும் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிராமங்களின் வழியாகச் சென்று.’ கிரேக்கச் சொற்றொடர் கிராமங்களிடையே தொடர்ந்து சென்றதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நற்செய்தியைப் பிரசங்கித்தும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: புறப்பட்டு
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து சீடர்கள் தங்கள் பணிக்காகப் புறப்பட்டதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி தொடர் வாக்கிய அமைப்பு
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனி இணைப்புச்சொல் சேர்க்காமலேயே அந்தத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: διήρχοντο
  choice: சென்று … வந்தார்கள்
  rationale: முற்றுறாத இறந்தகால வினை தொடர்ச்சியாக இடம்விட்டு இடம் சென்ற பணியைச் சுட்டுகிறது; ‘சென்று … வந்தார்கள்’ தமிழில் அந்த நீடித்த பயணத்தையும் செயலையும் இயல்பாகக் காட்டுகிறது.
- source_word: κατὰ τὰς κώμας
  choice: கிராமம் கிராமமாக
  rationale: κατά உடன் வரும் பன்மைச் சொற்றொடரின் பகிர்வுநிலைப் பொருளை, கிராமத்திலிருந்து கிராமத்திற்குச் சென்றதாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εὐαγγελιζόμενοι
  choice: நற்செய்தியை அறிவித்தும்
  rationale: சபைசார் தொழில்நுட்பச் சொல்லை அவசியமின்றி இறக்குமதி செய்யாமல், நல்ல செய்தியைப் பொதுவாக அறிவித்தல் என்ற பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: θεραπεύοντες
  choice: குணமளித்தும்
  rationale: உடல்நலக் குணப்படுத்துதலைக் குறிக்கும்; மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்காமல் தமிழில் இயல்பாக அமைகிறது.
- source_word: πανταχοῦ
  choice: எங்கும்
  rationale: அவர்களின் அறிவிப்பும் குணப்படுத்தும் பணியும் பரவலாக நடைபெற்றதை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: εὐαγγελιζόμενοι என்பதன் அப்போஸ்தலப் பணிசார் பொருள்
  choice: நற்செய்தியை அறிவித்தும்
  alternative: நற்செய்தியைப் பிரசங்கித்தும்
  rationale: இந்த இடத்தில் சீடர்கள் செய்த அறிவிப்பை அணுகத்தக்க மொழியில் தெரிவிக்கிறது; பிற்காலத்தில் வளர்ந்த தொழில்நுட்ப அல்லது பிரிவுசார் பொருளை உரைக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. தொடர்ச்சியான பயணத்தையும் அதனுடன் நடைபெற்ற அறிவிப்பு மற்றும் குணப்படுத்தும் பணிகளையும் ‘சென்று … வந்தார்கள்’ என்ற அமைப்பு ஒருங்கிணைக்கிறது.
