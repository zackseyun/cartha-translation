source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: ta
  text: ஏனெனில், ஒருவர் உலகம் முழுவதையும் பெற்றுக்கொண்டாலும், தன்னையே இழந்தாலும் அல்லது நஷ்டப்படுத்திக்கொண்டாலும், அவருக்கு என்ன பயன்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன்னையே’ என்பதற்கு ‘தன் உயிரையே’ அல்லது ‘தன் ஆன்மாவையே’ என்றும் பொருள் கொள்ளலாம். கிரேக்க மூலத்தில் வழக்கமாக ‘உயிர்’ அல்லது ‘ஆன்மா’ என்பதற்குப் பயன்படுத்தப்படும் சொல் அல்ல; ‘தன்னையே’ என்ற தற்சுட்டுப் பதிலிப்பெயரே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί … ὠφελεῖται
  choice: அவருக்கு என்ன பயன்?
  rationale: பயன் அல்லது நன்மை என்ன என்ற சொல்லாட்சிக் கேள்வியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கூற்றுக்கு இவ்வசனம் காரணவிளக்கம் தருவதைத் தக்கவைக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: இங்கு ἄνθρωπος பொதுவாக எந்த மனிதரையும் குறிக்கிறது; ‘ஒருவர்’ தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் வகையிலும் உள்ளது.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: உலகம் முழுவதையும் ஆதாயமாக்கிக்கொண்டாலும்
  rationale: உலகம் முழுவதையும் பெற்றுக்கொள்ளும் கற்பனைச் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘ஆதாயமாக்குதல்’ என்பது தொடர்ந்து வரும் பயன்–இழப்பு எதிர்மறையையும் தக்கவைக்கிறது.
- source_word: ἑαυτὸν
  choice: தன்னையே
  rationale: மூலத்தில் ‘ஆத்துமா’ அல்லது ‘உயிர்’ என்பதற்கான பெயர்ச்சொல் அல்ல, தற்சுட்டுப் பதிலிப்பெயரே உள்ளது; ஆகவே நபரின் முழுத் தன்மையைச் சுருக்காமல் மொழிபெயர்க்கப்படுகிறது.
- source_word: ἀπολέσας
  choice: இழந்துவிட்டால்
  rationale: ஒருவர் தன்னையே இழப்பதை இயல்பாகக் கூறுகிறது; அழிவின் விதத்தைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: ἢ ζημιωθείς
  choice: அல்லது இழப்புக்குள்ளாக்கிக்கொண்டால்
  rationale: ἢ என்பதன் மாற்றுத் தொடர்பையும், ζημιόω என்பதன் இழப்பை அனுபவித்தல் அல்லது நஷ்டமடைதல் என்ற தனி நிழற்பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ἑαυτόν மனிதரின் இறுதி நிலையை எவ்வாறு குறிக்கிறது
  choice: தன்னையே
  alternative: தன் உயிரை / தன் ஆத்துமாவை
  rationale: கிரேக்க மூலத்தில் ψυχή அல்ல, ἑαυτόν என்ற தற்சுட்டுப் பதிலிப்பெயர் உள்ளது. ‘தன்னையே’ என்பது உடலற்ற ஆத்துமாவை மட்டும் குறிக்கும் குறுகிய கோட்பாட்டு வாசிப்பைத் தவிர்த்து, மூலத்தின் பரந்த மனிதவியல் பொருளையும் பதற்றத்தையும் காக்கிறது.
- issue: ἀπολέσας மற்றும் ζημιωθείς ஆகியவற்றின் தொடர்பு
  choice: இழந்துவிட்டால் அல்லது இழப்புக்குள்ளாக்கிக்கொண்டால்
  alternative: அழித்துக்கொண்டால் அல்லது நாசமடைந்தால்
  rationale: மூலத்தில் உள்ள ‘அல்லது’ என்பதையும் இரு வினைகளின் நுட்ப வேறுபாட்டையும் காக்கிறது; அவற்றை ஒரே அழிவு கருத்தாக இணைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஏனெனில்’ முந்தைய வசனத்துடனான காரணத் தொடர்பைக் காக்கிறது. ‘தன்னையே’ மீது வலியுறுத்தல் வைக்கப்பட்டு, மூலத்தின் மனிதவியல் விரிவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
