language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: ta
  text: ஆனால் ஏரோது, “யோவானை நானே தலை வெட்டினேன்; ஆனால், இப்படிப்பட்டவற்றைக் குறித்து நான் கேள்விப்படும் இவர் யார்?” என்றான். அவரைக் காண அவன் தொடர்ந்து முயன்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் காண முயன்றுகொண்டிருந்தான்.” கிரேக்க முற்றாத இறந்தகால வினை, நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய செய்தியிலிருந்து ஏரோதின் எதிர்வினைக்குத் திருப்பத்தையும் மெல்லிய முரண்பாட்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ἡρῴδης
  choice: ஏரோது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: யோவானைத் தலைவெட்டிக் கொன்றது நான்தான்
  rationale: ἀπεκεφάλισα என்பதன் குறிப்பான பொருளாகிய தலைவெட்டுதலைத் தெளிவாகக் காக்கிறது; வெளிப்படையாக உள்ள ἐγὼ என்பதன் வலியுறுத்தலை ‘நான்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τίς δέ ἐστιν οὗτος
  choice: அப்படியானால் … அவர் யார்?
  rationale: ஏரோதின் குழப்பத்தையும் அடுத்த கேள்விக்கான மாறுதலையும் இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத அடையாள விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: யாரைக் குறித்து இப்படிப்பட்டவற்றைக் கேள்விப்படுகிறேனோ
  rationale: τοιαῦτα என்பதன் பொதுவான தன்மையைப் பாதுகாக்க ‘இப்படிப்பட்டவை’ என வழங்குகிறது; ‘செய்திகள்’ போன்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: அவரைக் காணத் தொடர்ந்து முயன்றான்
  rationale: ἐζήτει என்ற இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த முயற்சியைக் ‘தொடர்ந்து’ வெளிப்படுத்துகிறது; ἰδεῖν என்பதற்கு நேரடியான ‘காண’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யோவானைக் கொன்றது பற்றிய ஏரோதின் கூற்றும் இயேசுவைப் பற்றிய அவனுடைய கேள்வியும்
  choice: வரலாற்றுக் கூற்றையும் கேள்வியையும் மூலத்தில் உள்ள அளவிலேயே நேரடியாக வழங்குதல்
  alternative: யோவான் உயிர்த்தெழுந்திருக்கலாம் என்ற ஏரோதின் பயத்தை இவ்வசனத்திலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: முந்தைய சூழல் ஏரோதின் குழப்பத்தை எடுத்துரைத்தாலும், இவ்வசனம் அவன் யோவானைத் தலைவெட்டியதாகவும், தான் கேள்விப்படும் நபர் யார் என்று வினவியதாகவும் மட்டுமே கூறுகிறது. ஆகவே மறைமுகமான இறையியல் அல்லது கதைவிளக்க முடிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் அதேவேளையில் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நான்தான்’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘இப்படிப்பட்டவை’ என்பது மூலத்தின் திட்டமிடப்படாத பொதுத்தன்மையைப் பாதுகாக்கிறது.
