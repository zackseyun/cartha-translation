revisions:
- from: ஆனால் ஏரோது, “யோவானைத் தலைவெட்டிக் கொன்றது நான்தான். அப்படியானால், யாரைக் குறித்து இப்படிப்பட்டவற்றைக் கேள்விப்படுகிறேனோ, அவர் யார்?” என்று சொன்னான். மேலும், அவரைக் காணத் தொடர்ந்து முயன்றான்.[a]
  to: ஆனால் ஏரோது, “யோவானை நானே தலை வெட்டினேன்; ஆனால், இப்படிப்பட்டவற்றைக் குறித்து நான் கேள்விப்படும் இவர் யார்?” என்றான். அவரைக் காண அவன் தொடர்ந்து முயன்றான்.[a]
  rationale: The revision removes an unsupported inferential connective, retains the emphasis of ἐγώ with “நானே,” renders the direct question idiomatically without adding an identity interpretation, and preserves the imperfect’s ongoing/repeated force in both text and footnote.
