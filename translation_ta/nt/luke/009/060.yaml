  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: ta
  text: 'அவர் அவனிடம் கூறினார்: “இறந்தவர்கள் தங்கள் இறந்தவர்களை அடக்கம் செய்யட்டும்[a]; நீயோ போய், கடவுளின் அரசாட்சியை அறிவி.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் ‘இறந்தவர்கள்’ என்பது பெரும்பாலும் உருவகமாக—ஆவிக்குரிய பதிலுணர்வு இல்லாதவர்களைக்—குறிக்கலாம்; இரண்டாவது ‘இறந்தவர்கள்’ என்பது உடலளவில் இறந்தவர்களைக் குறிக்கிறது. கிரேக்கத்தில் இரு இடங்களிலும் ஒரே சொல் பயன்படுத்தப்பட்டுள்ளது; அந்தச் சொல்லாட்சியின் தாக்கத்தை மொழிபெயர்ப்பு அப்படியே காக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: விட்டுவிடு
  rationale: ἀφίημι என்பதன் இறந்தகால ஏவல் வடிவம், கேட்டுக்கொண்ட அடக்கக் கடமையிலிருந்து விலகுமாறு இங்கு கூர்மையான கட்டளையாக வருகிறது; ‘விட்டுவிடு’ அதன் வலிமையைக் காக்கிறது.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: இறந்தவர்கள் ... தங்களுடைய இறந்தவர்களை
  rationale: νεκρούς என்ற ஒரே சொல் இருமுறை வருவதால் உருவாகும் அதிர்ச்சியூட்டும் முரண்பாட்டைத் தமிழ் மொழிபெயர்ப்பும் காக்கிறது; முதல் பயன்பாட்டை விளக்கி மொழிபெயர்க்கவில்லை.
- source_word: θάψαι
  choice: அடக்கம் செய்ய
  rationale: தமிழில் இறந்தவரை புதைப்பது அல்லது உடலை அடக்கம் செய்வது என்ற பொருளை இயல்பாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
- source_word: ἑαυτῶν
  choice: தங்களுடைய
  rationale: தற்சுட்டுப் பெயரின் வலியுறுத்தலை வெறும் ‘அவர்களுடைய’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: ἀπελθὼν
  choice: போய்
  rationale: முதன்மை ஏவலுக்கு முன் வரும் இறந்தகால வினையெச்சத்தின் செயல்வரிசையை இயல்பான தமிழில் ‘போய்’ எனக் காட்டுகிறது.
- source_word: διάγγελλε
  choice: அறிவித்துக்கொண்டிரு
  rationale: நிகழ்கால ஏவல் குறிக்கும் தொடர்ச்சியான அல்லது வழக்கமான பொது அறிவிப்பை ‘அறிவித்துக்கொண்டிரு’ வெளிப்படுத்துகிறது.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: βασιλεία என்பது ஆளுகையையும் அரசாட்சியையும் உள்ளடக்கும்; ‘கடவுளுடைய அரசு’ நவீனத் தமிழில் இயல்பாக இருந்து, நிலைபெற்ற வேதாகமக் கருத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘இறந்தவர்கள்’ என்ற சொல்லின் முதல் மற்றும் இரண்டாம் பயன்பாடுகளின் பொருள்
  choice: இரு இடங்களிலும் ‘இறந்தவர்கள்’ என்றே வைத்து, உருவகப் பொருள் மற்றும் நேரடிப் பொருள் என்று முதன்மை உரையில் விளக்காமல் விடுதல்
  alternative: “ஆவிக்குரிய விதத்தில் இறந்தவர்கள் தங்களுடைய இறந்தவர்களை அடக்கம் செய்யட்டும்”
  rationale: கிரேக்கத்தில் இரு இடங்களிலும் அதே சொல் பயன்படுத்தப்பட்டு, இயேசுவின் கூற்று கூர்மையான முரண்பாட்டுடன் நிற்கிறது. முதல் பயன்பாடு ஆவிக்குரிய பதிலுணர்வு இல்லாதவர்களையும், இரண்டாவது உடலளவில் இறந்தவர்களையும் குறிக்கலாம்; ஆனால் அதைக் முதன்மை உரையில் வெளிப்படையாக்குவது மூலத்தின் உண்மையான விளக்கத் திணறலைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நீயோ’ என்பது σὺ δέ தரும் வலுவான எதிர்மறை ஒப்பீட்டை வெளிப்படுத்துகிறது; ‘போய்’ வினையெச்ச வரிசையையும், ‘அறிவித்துக்கொண்டிரு’ தொடர்ச்சியான ஏவலையும் காக்கின்றன.
