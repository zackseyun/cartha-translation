  to: 'அவர் அவனிடம் கூறினார்: “இறந்தவர்கள் தங்கள் இறந்தவர்களை அடக்கம் செய்யட்டும்[a]; நீயோ போய், கடவுளின் அரசாட்சியை அறிவி.”'
  rationale: மூலத்தின் திட்டமிட்ட ‘இறந்தவர்கள்’ என்ற முரண்பாட்டை முதன்மை உரையில் விளக்காமல் காத்துள்ளோம். அதே நேரத்தில், தமிழில் இயல்பற்றிருந்த “அடக்கம் செய்ய விட்டுவிடு” என்பதை ‘அடக்கம் செய்யட்டும்’ என மாற்றி, அவர்களை அந்தக் கடமையில் விட்டுவிடு என்ற கட்டளையைத் தெளிவுபடுத்தினோம். ‘கடவுளின் அரசாட்சி’ βασιλεία τοῦ θεοῦ-வின் நிலையான அரசுரிமை/ஆளுகைச் சொல்லாட்சியை நவீன தமிழில் தெளிவாகத் தருகிறது.
