  source_fidelity: முதன்மை உரை νεκρούς என்ற சொல்லின் இரட்டைப் பயன்பாட்டையும், ἑαυτῶν தரும் வலியுறுத்தலையும், σὺ δέ-யின் எதிர்நிலையையும் காக்கிறது. ஆனால் “அடக்கம் செய்ய விட்டுவிடு” என்ற அமைப்பு தமிழில் கட்டளையின் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தவில்லை. “அடக்கம் செய்யட்டும்” என்பது Ἄφες + infinitive-ன் ‘அவர்களை அதற்கு விட்டுவிடு’ என்ற பொருளைச் சரியாகத் தருகிறது.
  naturalness: “இறந்தவர்கள் தங்கள் இறந்தவர்களை அடக்கம் செய்யட்டும்” என்பது நவீன பொதுத்தமிழில் நேரடியானதும் இயல்பானதும் ஆகும். “போய் ... அறிவி” என்பது வினையெச்சம் மற்றும் ஏவல் வரிசையைச் சீராகக் காட்டுகிறது. “அறிவித்துக்கொண்டிரு” இலக்கணப்படி சாத்தியமானது; ஆனால் இங்கு தேவையற்ற தொடர்ச்சி-வலியுறுத்தலுடன் சற்றே செயற்கையாக ஒலிக்கிறது.
  terminology: “கடவுளுடைய அரசு” என்பது நவீன அரசாங்கம் என்ற பொருளைத் தூண்டக்கூடும். βασιλεία τοῦ θεοῦ என்பதற்கான நிலையான இறையியல் பொருளான கடவுளின் ஆட்சி/அரசாட்சியை “கடவுளின் அரசாட்சி” தெளிவாகக் குறிக்கிறது; இது குறிப்பிட்ட பிரிவினரின் விளக்கத்தைத் திணிப்பதில்லை.
