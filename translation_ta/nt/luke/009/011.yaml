base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: ta
  text: ஆனால், மக்கள் கூட்டங்கள் இதை அறிந்து அவரைப் பின்தொடர்ந்தன. அவர் அவர்களை வரவேற்று, கடவுளின் ஆட்சியைப் பற்றி அவர்களிடம் பேசிக்கொண்டிருந்தார்; சிகிச்சை[a] தேவைப்பட்டவர்களைக் குணமாக்கிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குணப்படுத்துதல்’ அல்லது ‘பராமரிப்பு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் θεραπεία என்பது ‘சிகிச்சை,’ ‘குணப்படுத்துதல்,’ அல்லது ‘பராமரிப்பு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: ஆனால் மக்கள் கூட்டத்தினர்
  rationale: δέ சூழலில் மென்மையான எதிர்மாற்றத்தைக் குறிக்கிறது; ὄχλοι என்பதன் பன்மைப் பொருளைத் தமிழில் இயல்பாக உணர்த்த ‘மக்கள் கூட்டத்தினர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: γνόντες
  choice: இதை அறிந்தபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலச்சூழல் பொருளை இயல்பான தமிழ் உட்பிரிவாகத் தருகிறது; ‘இது’ என்பது இயேசு சென்ற இடம் அல்லது அவர் புறப்பட்டுச் சென்ற செய்தியைக் குறிக்கும் சூழல் சுட்டு.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்தார்கள்
  rationale: உடல்ரீதியாகப் பின்னால் சென்ற செயலை நேரடியாகக் குறிக்கிறது; சீடத்துவப் பொருளைத் தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: ἀποδεξάμενος αὐτούς
  choice: அவர் அவர்களை வரவேற்று
  rationale: ἀποδέχομαι என்பதிலுள்ள சாதகமாக ஏற்றுக்கொள்ளுதல் மற்றும் வரவேற்பு நயத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐλάλει αὐτοῖς
  choice: அவர்களிடம் பேசிக்கொண்டிருந்தார்
  rationale: நடந்துகொண்டிருந்த செயலைக் குறிக்கும் imperfect வினையின் நீடித்த தன்மையை ‘பேசிக்கொண்டிருந்தார்’ காக்கிறது.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: கடவுளின் ஆட்சியைப் பற்றி
  rationale: βασιλεία என்பதன் அரசாளுதல்/ஆட்சி சார்ந்த மையப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; வெறும் இடப்பரப்பாகக் குறுக்கவில்லை.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: சிகிச்சை தேவைப்பட்டவர்களை
  rationale: θεραπεία என்பதற்கு இங்கு சிகிச்சை, பராமரிப்பு அல்லது குணமாக்குதல் என்ற பொருள் வரலாம்; ‘சிகிச்சை’ பெயர்ச்சொல் அமைப்பையும் அடுத்துள்ள குணமாக்கும் வினையிலிருந்து சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: ἰᾶτο
  choice: குணமாக்கிக்கொண்டிருந்தார்
  rationale: imperfect வடிவம் தொடர்ச்சியாக நடந்த குணமாக்கும் செயலைக் காட்டுவதால் நீடித்த செயற்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் ஆட்சி
  alternative: கடவுளின் அரசு / கடவுளுடைய ராஜ்யம்
  rationale: ‘ஆட்சி’ என்பது கடவுள் அரசாளும் செயற்பாட்டைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ். ‘அரசு’ நவீன அரசியல் அமைப்பைக் குறிக்கும் அபாயமுள்ளது; ‘ராஜ்யம்’ சில வாசகர்களுக்கு பழைய அல்லது குறிப்பிட்ட சமய வழக்காகத் தோன்றலாம்.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான இரண்டு imperfect வினைகளும் ‘பேசிக்கொண்டிருந்தார்,’ ‘குணமாக்கிக்கொண்டிருந்தார்’ என வெளிப்படுத்தப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் தவறான இடத்தில் தோன்றிய அடிக்குறிப்புக் குறி, அது விளக்கும் θεραπεία சார்ந்த ‘சிகிச்சை’ என்பதற்குப் பிறகு சரியாக வைக்கப்பட்டுள்ளது.
