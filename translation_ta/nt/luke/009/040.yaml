id: LUK.9.40
reference: Luke 9:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: ta
  text: அதை[a] வெளியேற்றும்படி உங்கள் சீடர்களிடம் கெஞ்சினேன்; ஆனால் அவர்களால் முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘அவனை’; இந்தப் பதிலிப்பெயர் ஆவிக்குப் பதிலாகச் சிறுவனைக் குறிப்பதாகக் கொள்ளப்பட்டால்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: கெஞ்சினேன்
  rationale: இச்சொல் சாதாரணமாகக் கேட்பதைவிட அவசரமும் உருக்கமும் நிறைந்த வேண்டுகோளைக் குறிக்கிறது; தந்தையின் மனநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν μαθητῶν σου
  choice: உங்கள் சீடர்களிடம்
  rationale: μαθητής என்பதற்கான நிலைபெற்ற நற்செய்தி நூல் சொல் ‘சீடர்’; ‘உங்கள்’ என்பது இயேசுவிடம் மரியாதையுடன் நேரடியாகப் பேசும் நவீனத் தமிழ் நடை.
- source_word: ἵνα ἐκβάλωσιν
  choice: வெளியேற்றும்படி
  rationale: ἵνα உடன் வரும் வினை வேண்டுகோளின் நோக்கத்தைக் காட்டுகிறது; ἐκβάλλω இச்சூழலில் தீய ஆவியை ஒருவரிடமிருந்து வெளியேற்றுவதைக் குறிக்கிறது.
- source_word: αὐτό
  choice: அதை
  rationale: நடுநிலை ஒருமைப் பதிலிப்பெயர் அருகிலுள்ள சூழலில் ஆவியைக் குறிப்பதே இயல்பானது. ஆயினும் சிறுவனைக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: οὐκ ἠδυνήθησαν
  choice: அவர்களால் முடியவில்லை
  rationale: சீடர்களுக்கு அதைச் செய்யும் ஆற்றல் அல்லது திறன் இல்லாதிருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பேயோட்டும் சூழலில் αὐτό எதைக் குறிக்கிறது
  choice: ஆவியைக் குறிப்பதாகக் கொண்டு ‘அதை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: சிறுவனைக் குறிப்பதாகக் கொண்டு ‘அவனை’ என்று மொழிபெயர்க்கலாம்.
  rationale: ἐκβάλλω பொதுவாக வெளியேற்றப்படும் பேய் அல்லது ஆவியையே செயப்படுபொருளாகக் கொள்கிறது; சுற்றியுள்ள பகுதியில் வரும் நடுநிலை πνεῦμα என்பதுடனும் αὐτό இயல்பாகப் பொருந்துகிறது. இருப்பினும் இலக்கண மற்றும் சூழல் சார்ந்த மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: இயல்பான, மரியாதையான நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கெஞ்சினேன்’ தந்தையின் அவசரத்தைத் தக்கவைக்கிறது; ‘வெளியேற்றும்படி’ பேயோட்டும் சூழலைத் தெளிவாகக் காட்டினாலும் தேவையற்ற விளக்கத்தைச் சேர்ப்பதில்லை.
