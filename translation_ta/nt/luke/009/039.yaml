reference: Luke 9:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: ta
  text: இதோ, ஓர் ஆவி அவனைப் பிடித்துக்கொள்கிறது[a]; திடீரென்று அவன் அலறுகிறான். அது அவனை நுரை தள்ளும்படி வலிப்பில் ஆழ்த்துகிறது; அவனை நசுக்கிக்கொண்டே மிகுந்த சிரமத்துடன்தான் அவனைவிட்டு விலகுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தீய ஆவி” அல்லது “ஒரு பிசாசு.” கிரேக்க மூலத்தில் இங்கு “ஓர் ஆவி” என்று மட்டுமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: தந்தையின் நேரடி, உயிரோட்டமான விளக்கத்தில் கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் சுட்டியை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: πνεῦμα
  choice: ஓர் ஆவி
  rationale: இவ்வசனத்தில் கிரேக்கம் ‘தீய’ என்ற அடைமொழியையோ ‘பேய்’ என்ற குறிப்பான பெயரையோ பயன்படுத்தாமல் πνεῦμα என்று மட்டும் கூறுவதால், அதே பொதுத்தன்மை தக்கவைக்கப்படுகிறது.
- source_word: λαμβάνει
  choice: பிடித்துக்கொள்கிறது
  rationale: திடீரென ஒருவரைத் தன் கட்டுப்பாட்டுக்குள் கொண்டுவரும் வலிமையான செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξαίφνης
  choice: உடனே
  rationale: நிகழ்வு திடீரெனத் தொடங்குவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κράζει
  choice: அவன் அலறுகிறான்
  rationale: கிரேக்கத்தில் புரிந்துகொள்ளப்படும் எழுவாய் சிறுவனே; ‘அது அவனை அலறச் செய்கிறது’ என்று காரணத்தை வெளிப்படையாகச் சேர்க்காமல் செயப்பாட்டு வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: σπαράσσει αὐτὸν μετὰ ἀφροῦ
  choice: அது அவனுக்கு வாயில் நுரைதள்ள வலிப்பு உண்டாக்குகிறது
  rationale: உடலைக் கடுமையாக வலிக்கச் செய்யும் செயலும் அதனுடன் வரும் நுரைத்தலும் சாதாரண வாசகருக்குத் தெளிவாக வெளிப்படுகின்றன; ‘வாயில்’ என்பது தமிழில் நுரைதள்ளுதல் குறிக்கும் இயல்பான உடல் இடத்தைத் தெளிவாக்குகிறது.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: மிகுந்த சிரமத்துடன்தான் அவனைவிட்டு விலகுகிறது
  rationale: ஆவி எளிதில் விலகுவதில்லை என்ற μόγις என்பதன் வலிமையைத் தக்கவைக்கிறது; இது ‘அரிதாக’ என்ற கால அளவுப் பொருளைத் திணிக்கவில்லை.
- source_word: συντρῖβον αὐτόν
  choice: அவனைக் கடுமையாக நொறுக்கி
  rationale: புறப்படும் செயலை ஒட்டிய கடும் சேதப்படுத்துதலை வலிமையாகக் காட்டுகிறது; குறிப்பிட்ட காயத்தை ஊகித்துச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: πνεῦμα என்பதை முதன்மை உரையில் வெளிப்படையாகப் பேய் அல்லது தீய ஆவி என்று அடையாளப்படுத்தலாமா?
  choice: ஓர் ஆவி
  alternative: ஒரு தீய ஆவி / ஒரு பேய்
  rationale: சுற்றுப்பின்னணி பகைமையான அமானுஷ்ய ஆற்றலைக் காட்டினாலும், இவ்வசனம் πνεῦμα என்று மட்டுமே கூறுகிறது. ஆகவே மூலத்தின் சொற்பொருள் அளவும் அதன் குறிப்பின்மையும் முதன்மை உரையில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குத் தெளிவான, கண்ணியமான நடை. நிகழ்கால வினைகள் தந்தையின் உயிரோட்டமான விவரிப்பைத் தக்கவைக்கின்றன. ‘இதோ’ வேதாகம நடைக்கு ஏற்றதாக இருந்தாலும் புரிந்துகொள்ள எளிதான கவனச் சுட்டியாகப் பயன்படுத்தப்பட்டுள்ளது.
