id: LUK.9.48
reference: Luke 9:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “என் பெயரில்[b] இந்தக் குழந்தையை ஏற்றுக்கொள்கிறவர்[a] என்னை ஏற்றுக்கொள்கிறார்; என்னை ஏற்றுக்கொள்கிறவர் என்னை அனுப்பியவரை ஏற்றுக்கொள்கிறார். ஏனெனில், உங்கள் எல்லாரிலும் மிகவும் தாழ்ந்தவராக இருப்பவரே பெரியவர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏற்றுக்கொள்கிறவர்’ என்பதற்கு ‘வரவேற்கிறவர்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் ஏற்றுக்கொள்ளுதல், விருந்தோம்பலுடன் வரவேற்றல் ஆகிய இரு பொருள்களையும் கொண்டிருக்கலாம். இந்த வசனம் முழுவதிலும் வரும் அதே வினைச்சொல்லுக்கும் இது பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் பெயரில்’ என்பது ‘என் பெயரின் அடிப்படையில்’ அல்லது ‘என் பெயரின் காரணமாக’ என்றும் பொருள்படலாம்; இயேசுவின் அதிகாரம் மற்றும் அவரிடத்திலான பற்றுறவுடன் தொடர்புபடுத்தி ஏற்றுக்கொள்வதை இது உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: ஏற்றுக்கொள்கிறவர் / ஏற்றுக்கொள்கிறார்
  rationale: δέχομαι என்பதில் ஒருவரை ஏற்றுக்கொள்ளுதல், வரவேற்றல் ஆகிய இரு நுணுக்கங்களும் உள்ளன. ஒரே வினையைத் தொடர்ந்து பயன்படுத்துவது மூலத்தின் கருத்துத் தொடர்பைப் பாதுகாக்கிறது; ‘ஏற்றுக்கொள்’ என்பது தமிழில் இயல்பாகவும் இரு நுணுக்கங்களுக்கும் இடமளிப்பதாகவும் உள்ளது.
- source_word: παιδίον
  choice: குழந்தை
  rationale: இச்சொல் பொதுவாகக் குழந்தையைக் குறிக்கிறது. சூழல் சிறு குழந்தையைச் சுட்டினாலும், மூலத்தில் உள்ளதைவிட அதிகமாக வலியுறுத்தாமல் ‘குழந்தை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயர், அதிகாரம் அல்லது அவருடனான தொடர்பின் அடிப்படையில் ஏற்றுக்கொள்வதை இச்சொற்றொடர் குறிக்கலாம். ‘என் பெயரில்’ அந்தப் பொருள் அகலத்தைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: τὸν ἀποστείλαντά με
  choice: என்னை அனுப்பியவர்
  rationale: பெயரெச்ச வடிவிலுள்ள கிரேக்கத் தொடர் நவீன தமிழில் இயல்பான உறவுநிலைத் தொடராக மொழிபெயர்க்கப்பட்டது; மூலத்தில் நேரடியாக இல்லாத ‘தந்தை’ அல்லது ‘கடவுள்’ என்ற பெயர் சேர்க்கப்படவில்லை.
- source_word: μικρότερος
  choice: மிகச் சிறியவர்
  rationale: இங்கு உடல் அளவு அல்லது வயதைவிடக் குழுவினுள் தாழ்ந்த நிலையைச் சுட்டுகிறது. ‘மிகச் சிறியவர்’ சமூக நிலையையும் இயேசு முன்வைக்கும் முரண்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: உங்கள் எல்லாரிலும்
  rationale: குழுவினரிடையேயான நிலையைக் குறிக்கும் பகிர்வு சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑπάρχων
  choice: இருப்பவர்
  rationale: மூலத்தின் பெயரெச்சப் பயன்பாடு தமிழில் இயல்பான உறவுநிலை வடிவில் தரப்பட்டுள்ளது.
- source_word: οὗτός ἐστιν μέγας
  choice: அவரே பெரியவர்
  rationale: οὗτος என்பதன் வலியுறுத்தலை ‘அவரே’ பாதுகாக்கிறது; ‘பெரியவர்’ என்பது μέγας என்பதன் நிலை மற்றும் மதிப்பு சார்ந்த பொருளைத் தருகிறது.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: ஏற்றுக்கொள்கிறவர் ... ஏற்றுக்கொள்கிறவர்
  rationale: பொதுவான நிபந்தனையைத் தமிழில் இயல்பாகக் காட்டும் அமைப்பு; எவருக்கும் பொருந்தும் தன்மையைச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: தமிழ் உரையாடல் அமைப்புக்கேற்ப மேற்கோள் வாக்கியத்தைச் சூழ்ந்து அமைக்கப்பட்டது; καί-ஐ தனியே ‘மேலும்’ எனச் சேர்ப்பது தமிழில் செயற்கையாக இருக்கும் என்பதால் தொடர்ச்சியை வாக்கிய ஒழுங்கே உணர்த்துகிறது.
theological_decisions:
- issue: ‘என்னை அனுப்பியவர்’ என்பவரின் அடையாளம்
  choice: மூலத்தைப் போலவே பெயரை வெளிப்படையாகக் கூறாமல் ‘என்னை அனுப்பியவர்’ என்று வைத்தல்
  alternative: ‘என்னை அனுப்பிய தந்தை’ அல்லது ‘என்னை அனுப்பிய கடவுள்’
  rationale: சூழலில் இது தந்தை/கடவுளைக் குறித்தாலும், கிரேக்கம் பெயரை நேரடியாகச் சொல்லவில்லை. இயேசு அனுப்பப்பட்டவர் என்ற உறவையும் கூற்றையும் விரிவாக்கமின்றிப் பாதுகாக்கிறது.
- issue: குழந்தையை ‘என் பெயரில்’ ஏற்றுக்கொள்வதன் பொருள்
  choice: இயேசுவின் பெயர், அதிகாரம் மற்றும் அவருடனான தொடர்பு ஆகியவற்றுக்கு இடமளிக்கும் சொற்றொடரைப் பாதுகாத்தல்
  alternative: ‘அந்தக் குழந்தை எனக்குரியது என்பதால்’ அல்லது ‘எனக்காக’
  rationale: கூற்றை வெறும் பொதுவான அன்பான நடத்தையாகக் குறுக்காமல், இயேசுவின் பிரதிநிதித்துவம் மற்றும் அதிகாரத்துடனான தொடர்பையும் திறந்தவையாக வைத்திருக்கிறது.
- issue: சிறுமைக்கும் பெருமைக்கும் இடையிலான முரண்பாடு
  choice: ‘உங்கள் எல்லாரிலும் மிகச் சிறியவராக இருப்பவர்—அவரே பெரியவர்’
  alternative: ‘உங்கள் எல்லாரிலும் இளையவர் பெரியவர்’
  rationale: μικρότερος இங்கு வயதை மட்டும் குறிக்க வேண்டியதில்லை; சமூகத் தாழ்மை அல்லது குறைந்த நிலை என்ற பொருளே சூழலுக்கு ஏற்றது. கோட்டுக்குறி மூலத்தின் வலியுறுத்தப்பட்ட முடிவை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; இயல்பான உரையாடல் நடை, ஆனால் வேதாகமப் பிரசுரத்திற்கேற்ற கண்ணியமான தொனி. மூலத்தில் மீண்டும் வரும் ‘ஏற்றுக்கொள்’ என்ற வினை கருத்துச் சங்கிலியைத் தெளிவுபடுத்துவதற்காகத் தமிழிலும் மீண்டும் பயன்படுத்தப்பட்டுள்ளது. ‘அவரே’ என்பது இறுதிக் கூற்றின் எதிர்மறைத் திருப்பையும் வலியுறுத்தலையும் காக்கிறது.
