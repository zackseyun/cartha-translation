translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. கிரேக்க வாக்கியத்தின் செயல் வரிசையும், ஆயத்தப்படுத்தப்படுவது எது என்று சொல்லப்படாத தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
