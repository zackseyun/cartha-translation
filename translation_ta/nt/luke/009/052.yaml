  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: ta
  text: அவர் தமக்கு முன்னதாகத் தூதுவர்களை அனுப்பினார்.[a] அவர்கள் சென்று, அவருக்காக ஆயத்தம் செய்ய, சமாரியர்களுடைய ஒரு கிராமத்திற்குள் நுழைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘அவருடைய முகத்திற்கு முன்பாக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு சமாரியக் கிராமத்திற்குள்.’ கிரேக்கத்தில் சொல்லுக்கு சொல், ‘சமாரியர்களுடைய ஒரு கிராமத்திற்குள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: ἀποστέλλω என்பதன் இறந்தகாலச் செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: ἀγγέλους
  choice: தூதுவர்களை
  rationale: இச்சூழலில் விண்ணுலகத் தூதர்கள் அல்ல, முன்னே அனுப்பப்பட்ட மனிதச் செய்தியாளர்கள் அல்லது ஏற்பாட்டாளர்களே குறிக்கப்படுகின்றனர்; ‘தூதுவர்கள்’ இந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: தமக்கு முன்னதாக
  rationale: சொல்லடியாக ‘அவருடைய முகத்துக்கு முன்பாக’ எனும் மரபுத்தொடர், பயணத்தில் அவருக்கு முன்னே சென்றதைக் குறிக்கிறது; ‘தமக்கு முன்னதாக’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: πορευθέντες
  choice: அவர்கள் போய்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைத் தமிழின் இயல்பான தொடர்வினை அமைப்பில் தருகிறது.
- source_word: εἰσῆλθον
  choice: நுழைந்தார்கள்
  rationale: கிராமத்திற்குள் சென்றதை மூலத்தின் இயக்கக் கருத்துக்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: κώμην Σαμαριτῶν
  choice: சமாரியர்களுடைய ஒரு கிராமம்
  rationale: ‘சமாரியர்களின் ஒரு கிராமம்’ என்ற கிரேக்க உரையின் உடைமை/தொடர்பு வடிவத்தைத் தக்கவைக்கிறது; ‘சமாரியக் கிராமம்’ என்பது இயல்பான சுருக்க மாற்று.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: அவருக்காக ஆயத்தம் செய்ய
  rationale: ὡς உடன் வரும் வினையெச்சம் இங்கு நோக்கத்தைக் குறிக்கிறது. எதை ஆயத்தம் செய்வது என்பதை மூலம் குறிப்பிடாததால் தமிழிலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
