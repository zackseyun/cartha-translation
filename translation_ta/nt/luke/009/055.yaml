  verdict: approve
  source_fidelity: 'முதன்மை உரை SBLGNT-இன் «στραφεὶς δὲ ἐπετίμησεν αὐτοῖς» என்பதைத் துல்லியமாகக் காட்டுகிறது: «திரும்பி» பங்கேற்புவினைச் செயலை, «ஆனால்» சூழலுக்கேற்ற மென்மையான எதிர்மாற்றத்தை, «அவர்களைக் கண்டித்தார்» ἐπετίμησεν αὐτοῖς என்பதைக் காட்டுகின்றன. மூலத்தில் இல்லாத நீண்ட வாசகம் முதன்மை உரையில் சேர்க்கப்படவில்லை.'
  naturalness: «ஆனால் அவர் திரும்பி, அவர்களைக் கண்டித்தார்» என்பது நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. நிறுத்தற்குறியும் அடிக்குறிப்பு இணைப்பும் சரியாக உள்ளன.
  terminology: «கண்டித்தார்» என்பது இச்சூழலில் ἐπιτιμάω-வின் வலுவான வாய்மொழிக் கண்டனத்தை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பில் «மனிதகுமாரன்» மற்றும் «ஆவி» ஆகிய சொற்கள் நிலையான வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. «எத்தகைய ஆவிக்குரியவர்கள்» என்பது நீண்ட பிற்கால வாசகத்தின் கருத்தைத் தேவையற்ற கோட்பாட்டு விளக்கமின்றி வழங்குகிறது.
