lexical_decisions:
- source_word: στραφεὶς
  choice: திரும்பி
  rationale: στρέφω என்பதன் இறந்தகாலப் பங்கேற்புவினை வடிவம்; சீடர்களை நோக்கி இயேசு திரும்பிய செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சீடர்கள் கேட்டதற்கு எதிர்மாறான இயேசுவின் பதிலைச் சுட்டும் மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐπετίμησεν
  choice: கண்டித்தார்
  rationale: கடுமையான வாய்மொழித் திருத்தம் அல்லது கண்டனத்தைக் குறிக்கும் ἐπιτιμάω என்பதற்கு இயல்பான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: சூழலில் யாக்கோபையும் யோவானையும் அல்லது அங்கிருந்த சீடர்களையும் குறிக்கும் பன்மைப் பெயர்ப்பதிலி; தமிழில் ‘கண்டித்தார்’ நேர்செயப்படுபொருளை ஏற்கிறது.
theological_decisions:
- issue: பிற்காலக் கையெழுத்துப் பிரதிகளில் காணப்படும் நீண்ட வாசகம்
  choice: 'SBLGNT-இல் உள்ள குறுகிய வாசகத்தை மட்டும் முதன்மை உரையில் மொழிபெயர்த்தல்: ‘ஆனால் அவர் திரும்பி, அவர்களைக் கண்டித்தார்.’'
  alternative: ‘ஆனால் அவர் திரும்பி, அவர்களைக் கண்டித்து, “நீங்கள் எத்தகைய ஆவிக்குரியவர்கள் என்பதை அறியவில்லை; ஏனெனில் மனிதகுமாரன் மக்களின் உயிர்களை அழிக்க வரவில்லை, காப்பாற்றவே வந்தார்” என்றார்.’
  rationale: வழங்கப்பட்ட மூல உரையில் குறுகிய வாசகம் மட்டுமே உள்ளது. மொழிபெயர்ப்பு வரலாற்றில் பரிச்சயமான நீண்ட வாசகத்தை முதன்மை உரைக்குள் சேர்க்காமல், முக்கியமான உரை வேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திரும்பி’ என்பது பங்கேற்புவினையின் தொடர்ச்சியை இயல்பாகக் காக்கிறது; ‘கண்டித்தார்’ என்பது தேவையற்ற விளக்கமின்றி வலுவான வாய்மொழித் திருத்தத்தைத் தெரிவிக்கிறது.
