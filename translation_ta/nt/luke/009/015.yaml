translation:
  language: ta
  text: அவர்கள் அப்படியே செய்து, எல்லாரையும் உணவுக்காக அமர வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “எல்லாரையும் அமர வைத்தார்கள்” அல்லது “எல்லாரையும் சாய்ந்து படுக்க வைத்தார்கள்.” கிரேக்க வினைச்சொல், உணவுக்காக மக்களை அமர வைப்பதையோ சாய்ந்து படுக்க வைப்பதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: வசனத்தின் தொடக்க இணைப்புச்சொல்லைத் தமிழில் தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பதைவிட, இயல்பான தொடர்கதையாடலில் எழுவாயுடன் தொடங்குவது தெளிவாக உள்ளது; முந்தைய வசனத்துடனான இணைப்பு சூழலால் வெளிப்படுகிறது.
- source_word: ἐποίησαν οὕτως
  choice: அப்படியே செய்து
  rationale: இயேசு முந்தைய வசனத்தில் கூறிய கட்டளையை அவர்கள் அதேபடி நிறைவேற்றியதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καὶ
  choice: செய்து
  rationale: இரண்டாவது செயலை முதல் செயலுடன் இணைக்கும் எளிய கதைத் தொடரைத் தமிழின் வினையெச்ச அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: κατέκλιναν
  choice: உணவுக்காக அமரச் செய்தார்கள்
  rationale: κατακλίνω என்பது உணவு அருந்துவதற்காக மக்களை அமர அல்லது சாய்ந்து படுக்க ஏற்பாடு செய்வதைக் குறிக்கும் காரணவினை. ‘அமரச் செய்தார்கள்’ காரணப் பொருளைப் பேணுகிறது; ‘உணவுக்காக’ என்பது இச்சூழலில் உள்ள விருந்து நிலையைத் தெளிவுபடுத்துகிறது.
- source_word: ἅπαντας
  choice: எல்லாரையும்
  rationale: ஆண்பால் பன்மை வேற்றுமை வடிவத்தின் முழுமைப் பொருளையும், வினையின் நேரடிச் செயப்படுபொருள் நிலையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் καὶ தனிச்சொல்லாக வெளிப்படுத்தப்படாமல் இயல்பான தமிழ் தொடரமைப்பில் தரப்பட்டுள்ளது. ‘அமரச் செய்தார்கள்’ இன்றைய வாசகருக்குத் தெளிவாக இருக்க, அடிப்படை கிரேக்கச் சொல்லின் உணவுக்கான சாய்ந்திருக்கும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
