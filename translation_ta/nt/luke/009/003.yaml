  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “பயணத்திற்காக எதையும் எடுத்துச் செல்லாதீர்கள்—கைத்தடியோ, பயணப் பையோ,[a] அப்பமோ, பணமோ[b] வேண்டாம்; ஆளுக்கு இரண்டு உள்ளங்கிகள் வைத்திருக்கவும் வேண்டாம்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயணியின் பை.”
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “வெள்ளி”; இங்கு பணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கச் சொற்றொடர் “ஆளுக்கு இரண்டு உள்ளங்கிகள்” அல்லது “தலா இரண்டு உள்ளங்கிகள்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: பயணத்திற்காக எதையும் எடுத்துச் செல்லாதீர்கள்
  rationale: பயணத்திற்கான ஆயத்தப் பொருட்களை எடுத்துச் செல்ல வேண்டாம் என்ற கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ῥάβδον
  choice: கைத்தடி
  rationale: பயணத்தின்போது துணையாகப் பயன்படுத்தும் தடியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: πήραν
  choice: பயணப் பை
  rationale: உணவு அல்லது பயணப் பொருட்களை வைத்துச் செல்லும் பை என்ற சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: ἄρτον
  choice: அப்பம்
  rationale: மூலத்தின் குறிப்பிட்ட உணவுப்பொருளை பொதுவான ‘உணவு’ என்று விரிவாக்காமல் காக்கிறது.
- source_word: ἀργύριον
  choice: பணம்
  rationale: சொல்லளவில் ‘வெள்ளி’ என்றாலும், இச்சூழலில் செலவுக்கான பணத்தையே குறிக்கிறது.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: ஆளுக்கு இரண்டு உள்ளங்கிகள் வைத்திருக்கவும் வேண்டாம்
  rationale: ἀνά என்பதன் பகிர்வுப் பொருளான ‘ஆளுக்கு’ என்பதையும், χιτών குறிக்கும் உடலோடு அணியும் அடிப்படை ஆடையையும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், நேரடியான கட்டளைத் தொனியையும் வரலாற்றுச் சூழலையும் காக்கும் கண்ணியமான நடை. பட்டியல் தமிழில் இயல்பாக அமைய ‘வேண்டாம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள பகிர்வுப் பொருள் ‘ஆளுக்கு’ என வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
