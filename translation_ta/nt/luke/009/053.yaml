source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: ta
  text: அவர்கள் அவரை ஏற்றுக்கொள்ளவில்லை[a]; ஏனெனில், அவர் எருசலேமை நோக்கிப் பயணம் செய்துகொண்டிருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை வரவேற்கவில்லை.’ இங்குள்ள வினைச்சொல் ஏற்றுக்கொள்வது, வரவேற்பது அல்லது பெற்றுக்கொள்வது என்று பொருள்படலாம்; இச்சூழலில் விருந்தோம்ப மறுத்ததைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவருடைய முகம் எருசலேமை நோக்கிச் சென்றுகொண்டிருந்தது.’ இந்தச் சொற்றொடர் எருசலேமை நோக்கிய உறுதியான திசை அல்லது நோக்கத்தையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: ஏற்றுக்கொள்ளவில்லை
  rationale: δέχομαι என்பது ஏற்றுக்கொள்வது, வரவேற்பது, பெற்றுக்கொள்வது ஆகிய பொருள்களைக் கொண்டது. பயணச் சூழலில் இது விருந்தோம்பி வரவேற்க மறுத்ததைக் குறிக்கலாம்; ‘ஏற்றுக்கொள்ளவில்லை’ மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: முதன்மை உரையில் ‘அவர்’ என இயல்பாக்கப்பட்டு, ‘அவருடைய முகம்’ என்ற நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது
  rationale: πρόσωπον என்பதன் நேரடிப் பொருள் ‘முகம்.’ ஆனால் இங்கு முகம் ஒரு இலக்கை நோக்கிச் செல்வதாகக் கூறும் செமித்தியப் பாணியிலான தொடர் தமிழில் நேரடியாக வந்தால் இயல்பற்றதாகும்.
- source_word: ἦν πορευόμενον
  choice: சென்றுகொண்டிருந்ததால்
  rationale: இந்தச் சுற்றுவழி வினையமைப்பு தொடர்ந்து நிகழ்ந்த பயணத்தை வெளிப்படுத்துகிறது. தீர்மானத்தைக் குறிக்கும் பொருள் சூழலில் ஒலித்தாலும், ‘தீர்மானித்திருந்தார்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்காமல் பயண இயக்கமே மொழிபெயர்க்கப்படுகிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமை நோக்கி
  rationale: εἰς இலக்கு அல்லது திசையைக் குறிக்கிறது. பயணச் சூழலில் ‘எருசலேமை நோக்கி’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: ὅτι
  choice: -தால்
  rationale: ὅτι மறுப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் காரணத்தைக் காட்டும் ‘-தால்’ விகுதி இயல்பாக இதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவருடைய முகம் எருசலேமை நோக்கிச் சென்றுகொண்டிருந்தது’ என்ற தொடரின் இடியோமச் செறிவு
  choice: முதன்மை உரையில் பயணத் திசையை இயல்பான தமிழில் கூறி, முகத்தைக் கொண்ட நேரடி வடிவத்தையும் உறுதியான நோக்கத்தின் சாத்தியத்தையும் அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: ‘அவருடைய முகம் எருசலேமை நோக்கிச் சென்றுகொண்டிருந்ததால்’ என்று நேரடியாக மொழிபெயர்த்தல் அல்லது ‘அவர் எருசலேமுக்குச் செல்லத் தீர்மானித்திருந்ததால்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: நேரடி வடிவம் தமிழில் இயல்பற்றது; ‘தீர்மானித்திருந்தார்’ என்பது உரையில் வெளிப்படையாக இல்லாத மனநிலையைத் தீர்மானமாக்கிவிடும். தேர்ந்த வடிவம் பயண இயக்கத்தை முன்னிறுத்தி, இடியோமத்தின் கூடுதல் செறிவை அடிக்குறிப்பில் திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. காரணத் தொடர் முதலில் வைக்கப்பட்டிருப்பது தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காகும்; மூலத்தின் பொருளுறவு மாற்றப்படவில்லை.
