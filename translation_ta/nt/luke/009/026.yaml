id: LUK.9.26
reference: Luke 9:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: ta
  text: ஏனெனில், யார் என்னைப் பற்றியும் என் வார்த்தைகளைப் பற்றியும் வெட்கப்படுகிறாரோ, மனிதகுமாரன் தம் மகிமையிலும் தந்தையின் மகிமையிலும் பரிசுத்த தூதர்களின் மகிமையிலும் வரும்போது, அவரைப் பற்றியும் வெட்கப்படுவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: ஏனெனில், யார் ... வெட்கப்படுகிறாரோ
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், ὃς ... ἄν என்பதன் பொதுவான நிபந்தனைப் பொருளை ‘யார் ... ஓ’ அமைப்பும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: வெட்கப்படுகிறாரோ / வெட்கப்படுவார்
  rationale: இரு இடங்களிலும் ஒரே வினையைப் பயன்படுத்தி, ஒருவரின் வெட்கத்திற்குப் பதிலாக மனிதகுமாரனும் அவரைக் குறித்து வெட்கப்படுவார் என்ற மூலத்தின் திட்டமிட்ட பரஸ்பர ஒத்திசைவைப் பாதுகாக்கிறது; ‘மறுதலிப்பார்’ போன்ற வலுவான விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: என்னைக் குறித்தும் என் வார்த்தைகளைக் குறித்தும்
  rationale: με மற்றும் λόγους ஆகிய இரு பொருட்களையும் தெளிவாக இணைக்கிறது. ‘வார்த்தைகள்’ என்பது λόγους என்பதற்கு நேரடியான, புரிந்துகொள்ளத்தக்க இணை.
- source_word: τοῦτον
  choice: அவரைக் குறித்தும்
  rationale: முன்னுள்ள பொதுப்பொருள் கொண்ட ‘யார்’ என்பதைக் குறிப்பாகத் திரும்பச் சுட்டுகிறது. தமிழில் ‘அவர்’ பொதுவான ஒருமை மரியாதை வடிவமாக இயல்பாக இருந்து, எச்சரிக்கையை ஆண்களுக்கு மட்டும் வரையறுப்பதாகத் தவறான எண்ணத்தை ஏற்படுத்தாது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இது நிலைபெற்ற வேதாகமத் தலைப்பாகவும், அதன் தானியேல் நூல் சார்ந்த ஒலிப்பையும் தலைப்புத் தன்மையையும் காக்கும் வடிவமாகவும் உள்ளது.
- source_word: ὅταν ἔλθῃ
  choice: வரும்போது
  rationale: ὅταν உடன் வரும் aorist subjunctive இங்குக் குறிக்கும் எதிர்கால நேரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: தமது மகிமையில்
  rationale: மனிதகுமாரனுக்குரிய மகிமையின் வெளிப்பாட்டில் அவர் வருவதைத் தெளிவுபடுத்துகிறது; மரியாதைத் தற்சுட்டான ‘தமது’ எழுவாயைத் தெளிவாகச் சுட்டுகிறது.
- source_word: καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: தந்தையின் மகிமையிலும் பரிசுத்த தூதர்களின் மகிமையிலும்
  rationale: தமிழில் ஒருங்கிணைப்பைத் தெளிவாக்க ‘மகிமை’ என்பதை நிரப்புகிறது; மூலத்தில் ஒருமுறை மட்டுமே வரும் δόξῃ அடுத்த இரு மரபுத்தொடர்களுக்கும் பொருந்துவதைப் பாதுகாக்கிறது.
- source_word: ἅγιοι ἄγγελοι
  choice: பரிசுத்த தூதர்கள்
  rationale: தூதர்களின் பரிசுத்தத் தன்மையை நேரடியாகவும் நிலைபெற்ற வேதாகம நடையிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: பொதுப்பொருள் கொண்ட ஆண்பால் ஒருமை அமைப்பைத் தமிழில் சுட்டுதல்
  choice: யார் ... அவரைக் குறித்து
  alternative: எவன் ... அவனைப் பற்றி
  rationale: கிரேக்க ஆண்பால் ஒருமை வடிவம் பிரதிநிதித்துவப் பொதுப்பொருளில் வருகிறது. தமிழில் ‘எவன் ... அவன்’ என்பது ஆண்களுக்கு மட்டுமே உரியதாகக் கேட்கக்கூடும்; ‘யார் ... அவர்’ ஒருமைச் சுட்டுதலைக் காத்தபடியே எச்சரிக்கையின் பொதுவான பரப்பை இயல்பாக வெளிப்படுத்துகிறது.
- issue: மனிதகுமாரன், தந்தை, பரிசுத்த தூதர்கள் ஆகியோருடன் தொடர்புடைய வருகையின் மகிமை
  choice: தமது மகிமையிலும் தந்தையின் மகிமையிலும் பரிசுத்த தூதர்களின் மகிமையிலும்
  alternative: தமது மகிமையிலும், தந்தை மற்றும் பரிசுத்த தூதர்களின் மகிமையிலும்
  rationale: மனிதகுமாரனின் சொந்த மகிமையையும் தந்தை மற்றும் பரிசுத்த தூதர்களுடன் தொடர்புடைய மகிமையையும் உரை கூறும் அளவிலேயே வைத்திருக்கிறது. இம்மகிமைகளின் துல்லியமான உறவைப் பற்றிய கூடுதல் இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்குப் புரியத்தக்கதாகவும், அதே நேரத்தில் கண்ணியமான வேதாகமத் தொனியுடனும் வைக்கப்பட்டுள்ளது. ‘மனிதகுமாரன்’, ‘மகிமை’, ‘பரிசுத்த தூதர்கள்’ ஆகிய நிலைபெற்ற சொற்கள் தலைப்புத் தன்மையையும் இறுதிக்காலச் சூழலையும் காக்கின்றன.
