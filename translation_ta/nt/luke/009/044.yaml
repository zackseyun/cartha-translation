source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: ta
  text: “இந்த வார்த்தைகளை உங்கள் காதுகளில் பதித்துக்கொள்ளுங்கள்; ஏனெனில் மானிடமகன் மனிதர்களின் கைகளில் ஒப்புவிக்கப்படவிருக்கிறார்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காட்டிக்கொடுக்கப்படவிருக்கிறார்.” கிரேக்க வினைச்சொல் ‘ஒப்புவிக்கப்படுதல்,’ ‘கையளிக்கப்படுதல்,’ அல்லது சில சூழல்களில் ‘காட்டிக்கொடுக்கப்படுதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: உங்கள் காதுகளில் பதித்துக்கொள்ளுங்கள்
  rationale: கேட்டவற்றைக் கவனமாக ஏற்றுத் தக்கவைத்துக்கொள்ள வேண்டும் என்ற கிரேக்க உருவகத்தின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது. வெளிப்படையாக வந்துள்ள ὑμεῖς-ன் வலியுறுத்தலை கட்டளையின் நேரடித் தன்மை போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகளை
  rationale: இயேசு உடனடியாகச் சொல்லவிருக்கும் குறிப்பிட்ட செய்தியைக் குறிக்கும் λόγους என்பதன் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: ὁ γὰρ
  choice: ஏனெனில்
  rationale: கவனமாகக் கேட்க வேண்டும் என்ற கட்டளைக்கான காரணத்தை γάρ அறிமுகப்படுத்துவதால், தமிழில் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் தனித்துவமான பட்டப்பெயரையும் தானியேல் நூலுடனான தொடர்பையும் விளக்கிச் சுருக்காமல் காக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: μέλλει
  choice: விருக்கிறார்
  rationale: நடக்கவிருக்கும் செயலைச் சுட்டும் μέλλει என்பதன் எதிர்நோக்கிய, அண்மித்த நிகழ்வுணர்வை இயல்பான தமிழில் தருகிறது; விதிநியமம் என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: παραδίδοσθαι
  choice: ஒப்புவிக்கப்பட
  rationale: மற்றவர்களின் அதிகாரத்திற்குள் கையளிக்கப்படுதல் என்ற பரந்த பொருளைக் காக்கிறது; யூதாசின் துரோகத்துக்கு மட்டும் பொருளை முன்கூட்டியே குறுக்குவதில்லை.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: மனிதர்களின் கைகளில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்புவிக்கப்படுதல் என்ற மூலமொழி உருவகத்தைத் தக்கவைக்கிறது. ἀνθρώπων இங்கு மனிதர்களை விரிவாகக் குறிக்கக்கூடியதால் பாலின வேறுபாடற்ற இயல்பான தமிழ் சொல்லான ‘மனிதர்கள்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற இயேசுவின் பட்டப்பெயர்
  choice: மானிடமகன்
  alternative: மனித மகன்
  rationale: ‘மானிடமகன்’ என்பது பட்டப்பெயரின் இலக்கிய மற்றும் இறையியல் ஒலிப்பையும் தானியேல் 7 உடனான சாத்தியமான தொடர்பையும் காக்கிறது.
- issue: παραδίδοσθαι என்பதன் பொருள் வரம்பு
  choice: ஒப்புவிக்கப்பட
  alternative: காட்டிக்கொடுக்கப்பட
  rationale: இச்செயலின் கர்த்தா குறிப்பிடப்படாத நிலையையும், இயேசு மனித அதிகாரத்திற்குள் கையளிக்கப்படுவார் என்ற பரந்த பொருளையும் காக்கிறது. ‘காட்டிக்கொடுக்கப்பட’ என்பது துரோகத்தை மட்டும் முன்னிறுத்தக்கூடும்.
- issue: ἀνθρώπων என்பதன் குறிப்பு
  choice: மனிதர்களின்
  alternative: ஆண்களின்
  rationale: இங்கு ἀνθρώπων மனித இனத்தை அல்லது மனித முகவர்களைப் பொதுவாகக் குறிக்க முடியும். தமிழ் ‘மனிதர்கள்’ அந்தப் பரப்பை இயல்பாகக் காத்து, மானிடமகனுக்கும் மனிதர்களுக்கும் இடையிலான எதிரெதிர் அமைப்பையும் விடாமல் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘காதுகளில் பதித்துக்கொள்ளுங்கள்’ என்ற சொற்றொடர் மூலத்தின் உயிருள்ள செவி உருவகத்தைத் தக்கவைத்தபடியே தமிழில் இயல்பாக ஒலிக்கிறது. ஒரே அடிக்குறி குறியீடு [a] பிரதான உரையிலும் அடிக்குறிப்பிலும் பொருந்துமாறு இடப்பட்டுள்ளது.
