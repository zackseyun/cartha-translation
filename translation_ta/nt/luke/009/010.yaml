  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: ta
  text: அப்போஸ்தலர்கள் திரும்பிவந்து, தாங்கள் செய்தவற்றையெல்லாம் அவரிடம் விவரித்துச் சொன்னார்கள். அவர் அவர்களைத் தம்முடன் அழைத்துக்கொண்டு, பெத்சாயிதா என்னும் ஊருக்கு ஒதுங்கிச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தனிப்பட்ட முறையில்,’ ‘தனியே,’ அல்லது ‘ஒதுக்கமாக.’ அவர் அப்போஸ்தலர்களைத் தம்முடன் அழைத்துச் சென்றதால், இது அவர் முற்றிலும் தனிமையில் சென்றார் என்பதைக் கட்டாயப்படுத்தாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: திரும்பிவந்து
