theological_decisions:
- issue: κατ’ ἰδίαν என்பது இயேசு முற்றிலும் தனியாக இருந்தார் என்று பொருள்படுமா?
  choice: ‘தனியாக’ என்று மொழிபெயர்த்து, அது கூட்டத்தாரிடமிருந்து தனியே விலகியதைக் குறிப்பதாக அடிக்குறிப்பில் விளக்கப்பட்டது.
  alternative: ‘தனிப்பட்ட முறையில்’ அல்லது ‘ஒதுக்கமாக’
  rationale: அவர் அப்போஸ்தலர்களைத் தம்முடன் அழைத்துச் சென்றார் என்று வசனமே கூறுவதால், முற்றிலும் ஆளில்லாத தனிமை எனப் பொருள் கொள்ளக் கூடாது. அதேவேளை, κατ’ ἰδίαν என்பதிலுள்ள பிறரிடமிருந்து தனியே செல்லும் கருத்தையும் அழிக்காமல் வைத்திருக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அப்போஸ்தலர்கள்’ போன்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டு, வாக்கிய அமைப்பு இயல்பான தமிழுக்கு ஏற்ப மாற்றப்பட்டது.
