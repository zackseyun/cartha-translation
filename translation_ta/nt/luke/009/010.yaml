- source_word: ὅσα ἐποίησαν
  choice: தாங்கள் செய்தவற்றையெல்லாம்
  rationale: ὅσα என்பதிலுள்ள ‘செய்த அனைத்தும்/எவையெல்லாமோ அவை’ என்ற பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παραλαβὼν αὐτούς
  choice: அவர்களைத் தம்முடன் அழைத்துக்கொண்டு
  rationale: அவர்களைத் துணையாக உடன் கூட்டிச் சென்றார் என்ற உறவுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: வெறுமனே புறப்பட்டுச் செல்வதைவிட, பொதுமக்களிடமிருந்து ஒதுங்கிச் செல்லும் நுண்பொருளைப் பாதுகாக்கிறது.
- source_word: κατ’ ἰδίαν
