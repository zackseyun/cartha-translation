theological_decisions:
- issue: இயேசுவின் கட்டளையிலும் சீடர்களின் பதிலிலும் உள்ள தொனி
  choice: ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்களே’ என்று காத்து, அதற்கு மேல் கண்டிப்பையோ கேலியையோ சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: கட்டளையை இன்னும் கடுமையாகவும், சீடர்களின் பதிலை எரிச்சலான எதிர்க்கேள்வியாகவும் அமைத்தல்
  rationale: மூலம் வலியுறுத்தப்பட்ட கட்டளையையும் நடைமுறைச் சிக்கலைச் சுட்டும் பதிலையும் தருகிறது; ஆனால் கூடுதல் உணர்ச்சித் தொனியைத் தெளிவாகக் குறிக்கவில்லை.
- issue: εἰ μήτι தொடரின் இலக்கணத் தொனி
  choice: முதன்மை உரையில் விதிவிலக்காக மொழிபெயர்த்து, சாத்தியம் அல்லது தயக்கம் கலந்த எதிர்க்கேள்வி வாசிப்பை அடிக்குறிப்பில் வைத்தல்
  alternative: ‘நாங்களே போய் வாங்க வேண்டுமோ?’ என்று முதன்மை உரையிலேயே வெளிப்படையான கேள்வியாக்குதல்
  rationale: கிரேக்கத் தொடர் விதிவிலக்கையும் ஓரளவு தயக்கமான அல்லது சொல்லாட்சிசார் எதிர்ப்பையும் அனுமதிக்கிறது; கேள்விக்குறி இல்லாத மூலத்தைத் தெளிவான கேள்வியாக மட்டும் முடிவுசெய்வதை இது தவிர்க்கிறது.
