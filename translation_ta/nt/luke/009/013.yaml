  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “நீங்களே அவர்களுக்கு உண்பதற்கு ஏதாவது கொடுங்கள்” என்றார். அதற்கு அவர்கள், “ஐந்து அப்பங்களும் இரண்டு மீன்களும் தவிர எங்களிடம் வேறு எதுவும் இல்லை; இந்த மக்கள் எல்லாருக்கும் உணவு வாங்க நாங்கள் போய்வந்தாலொழிய” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவேளை நாங்கள் போய் இந்த மக்கள் எல்லாருக்கும் உணவு வாங்கினாலொழிய.”
    reason: εἰ μήτι விதிவிலக்கை அறிமுகப்படுத்துகிறது; -τι அதன் சொல்லாட்சியில் ஓரளவு சாத்தியம் அல்லது தயக்க நுணுக்கத்தையும் தரக்கூடும்.
