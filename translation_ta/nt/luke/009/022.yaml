id: LUK.9.22
reference: Luke 9:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “மனிதகுமாரன் பல துன்பங்களை அனுபவிக்கவும், மூப்பர்களாலும் தலைமை ஆசாரியர்களாலும் மறைநூல் அறிஞர்களாலும் நிராகரிக்கப்படவும், கொல்லப்படவும், மூன்றாம் நாளில் எழுப்பப்படவும் வேண்டும்[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுமாரன் பல துன்பங்களை அனுபவிப்பது … அவசியம்.”
    reason: lexical_alternative
  - marker: b
    text: “எழுப்பப்படவும்” என்பது கிரேக்கத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; “எழவும்” என்பது மற்றொரு சாத்தியமான மொழிபெயர்ப்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: அவர் சொன்னார்
  rationale: முந்தைய நிகழ்வுடன் தொடர்புடைய இறந்தகால வினையெச்சம். தமிழில் இயல்பாகவும் தெளிவாகவும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்த வினைமுற்றாக மொழிபெயர்க்கப்பட்டது.
- source_word: Δεῖ
  choice: வேண்டும்
  rationale: வெறும் வசதியையல்ல, நிறைவேற வேண்டிய கட்டாயத்தை வெளிப்படுத்துகிறது. தமிழில் ‘வேண்டும்’ இயல்பாக இந்த அவசியத்தைத் தெரிவிக்கிறது; அதன் இறைத் திட்டம் சார்ந்த பின்னணியை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயகுறிப்புப் பட்டத்தையும் அதன் வேதாகம இடையிணைப்புகளையும் காக்கும் நிலையான தமிழ் வடிவம்.
- source_word: πολλὰ παθεῖν
  choice: பல பாடுகள் படவும்
  rationale: πολλά என்பதன் பன்மை விரிவையும் παθεῖν என்பதன் துன்புறுதல் பொருளையும் சுருக்காமல், இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἀποδοκιμασθῆναι
  choice: நிராகரிக்கப்படவும்
  rationale: ஆராய்ந்து ஏற்க மறுக்கும் அதிகாரபூர்வ நிராகரிப்பையும் கிரேக்கச் சொல்லின் செயப்பாட்டு வடிவையும் காக்கிறது.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: மூப்பர்களாலும் தலைமை ஆசாரியர்களாலும் மறைநூல் அறிஞர்களாலும்
  rationale: செயப்பாட்டு வினையுடன் ἀπό செய்பவர்களைக் குறிக்கிறது. மூன்று தலைமைக்குழுக்களையும் தனித்தனியாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட யூதத் தலைமைக்குழுவைக் குறிக்கும் நிறுவனச் சொல்லைத் தக்கவைக்கிறது.
- source_word: ἀρχιερέων
  choice: தலைமை ஆசாரியர்கள்
  rationale: ஒரே நேரத்தில் பல பிரதான ஆசாரியர்கள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, தலைமை ஆசாரிய வகுப்பைக் குறிக்கிறது.
- source_word: γραμματέων
  choice: மறைநூல் அறிஞர்கள்
  rationale: அக்காலத்தில் மறைநூல்களை நகலெடுத்து விளக்கிய அங்கீகரிக்கப்பட்ட குழுவை இன்றைய வாசகருக்குத் தெளிவாகக் காட்டுகிறது; ‘வேதபாரகர்’ என்ற பழமையான சொல்லின் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: ἀποκτανθῆναι
  choice: கொல்லப்படவும்
  rationale: செயப்பாட்டு வினையின் நேரடியான பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் வேற்றுமையை நேரடியாகவும் பரிச்சயமான உயிர்த்தெழுதல் வாய்பாட்டுக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: ἐγερθῆναι
  choice: எழுப்பப்படவும்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவைக் காத்து, செய்பவர் யார் என்பதை உரையில் வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் செயப்பாட்டு வடிவம்
  choice: எழுப்பப்படவும்
  alternative: எழுந்திருக்கவும்; உயிர்த்தெழவும்
  rationale: ἐγερθῆναι செயப்பாட்டு இறந்தகால வினையெச்சம். ‘எழுப்பப்படவும்’ என்பது மறைமுகமாக இறைச் செயலை உணர்த்தினாலும், உரை குறிப்பிடாத செய்பவரை வெளிப்படையாகச் சேர்ப்பதில்லை.
- issue: Δεῖ என்பதன் அவசியப் பொருள்
  choice: வேண்டும்
  alternative: வேண்டியது அவசியம்
  rationale: துன்பம், நிராகரிப்பு, மரணம், எழுப்பப்படுதல் ஆகியவை நிறைவேற வேண்டியவை என்ற வலிமையைத் தருகிறது. இறைத் திட்டத்தின் இயல்பை மேலதிகமாக விளக்கி உரையின் பதற்றத்தைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்ச்சியைத் தமிழ் இணை வினையெச்சங்களால் காத்து, தலைமைக்குழுக்களின் தனித்தன்மையும் உயிர்த்தெழுதல் வினையின் செயப்பாட்டு வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
