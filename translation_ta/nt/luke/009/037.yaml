  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: ta
  text: மறுநாள்[a], அவர்கள் மலையிலிருந்து இறங்கி வந்தபோது, ஒரு பெரிய மக்கள் கூட்டம் அவரைச் சந்தித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடுத்த நாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது இங்கு கதைநடையைத் தொடரும் இடைமாற்றுத் தொடராகச் செயல்படுகிறது. தமிழில் ‘மறுநாள்’ என்று இயல்பாகத் தொடங்குவதே இதன் தொடர்புச் செயல்பாட்டைச் சூழலில் போதுமான அளவு வெளிப்படுத்துகிறது; ‘அப்போது நிகழ்ந்ததாவது’ போன்ற வடிவம் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: மறுநாள்
  rationale: காலத்தைக் குறிக்கும் இந்தத் தொடர் ‘அடுத்த நாள்’ அல்லது ‘அதற்கு அடுத்த நாள்’ என்ற பொருள் தருகிறது. ‘மறுநாள்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: κατελθόντων αὐτῶν
  choice: அவர்கள் ... இறங்கி வந்தபோது
  rationale: முதன்மை நிகழ்வுக்கான சூழலைக் கொடுக்கும் genitive absolute அமைப்பை இயல்பான தமிழ்க் காலத் துணைவாக்கியமாக அளிக்கிறது. Aorist participle-இன் இறங்கிவந்த செயலை வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τοῦ ὄρους
  choice: மலையிலிருந்து
  rationale: ὄρος என்பதன் இச்சூழலுக்கேற்ற நேரடியான பொருள் ‘மலை’; ἀπό தொடக்க இடத்தைக் குறிக்கிறது.
- source_word: συνήντησεν αὐτῷ
  choice: அவரைச் சந்தித்தார்கள்
  rationale: வினைச்சொல் சந்தித்தல் அல்லது எதிர்கொண்டு வருதல் என்ற பொருள் தருகிறது. தமிழ் வாக்கியத்தில் ‘மக்கள்’ மரியாதைப் பன்மை வினையுடன் இயல்பாக அமைகிறது.
- source_word: ὄχλος πολύς
  choice: பெருந்திரளான மக்கள்
  rationale: ὄχλος மக்கள் கூட்டத்தையும் πολύς அதன் பெருமளவையும் குறிக்கிறது. ‘பெருந்திரளான மக்கள்’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
