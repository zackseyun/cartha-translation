  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: ta
  text: அவர்கள் அனைவரும் சாப்பிட்டுத் திருப்தியடைந்தார்கள். அவர்களுக்கு மீதியாக இருந்த உடைந்த துண்டுகள்[a] பன்னிரண்டு கூடைகள் நிறையச் சேகரிக்கப்பட்டன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடைந்த துண்டுகள்” என்பதற்குப் பதிலாக “துணுக்குகள்” என்றும் மொழிபெயர்க்கலாம் (κλασμάτων).
    reason: lexical_alternative
  - marker: b
    text: “சேகரிக்கப்பட்டன” என்பதற்குப் பதிலாக “எடுக்கப்பட்டன” என்றும் மொழிபெயர்க்கலாம் (ἤρθη).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: இறந்தகால நிகழ்வை இயல்பான நவீனத் தமிழில் நேரடியாகச் சொல்கிறது.
- source_word: ἐχορτάσθησαν
  choice: திருப்தியடைந்தார்கள்
  rationale: வயிறார உண்டு நிறைவடைந்ததை இயல்பாக வெளிப்படுத்துகிறது; வெறும் மனநிறைவை மட்டும் குறிக்காதபடி உணவு உண்ட சூழல் பொருளைத் தெளிவாக்குகிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: அங்கு இருந்த எல்லாரும் உண்டார்கள் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: τὸ περισσεῦσαν
  choice: மீதியாக இருந்த
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பங்கேற்புவினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இடவேற்றுமை போன்ற தத்திவுப் பயன்பாட்டை, அவர்கள் உண்டபின் அவர்களிடம் மீந்திருந்தது என்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தின் தொடர்பு ஓரளவு தெளிவற்றது.
- source_word: κλασμάτων
  choice: உடைந்த துண்டுகள்
  rationale: அப்பத்தைப் பிட்டு வழங்கியபின் மீந்த துண்டுகள் என்ற konkrete பொருளைப் பாதுகாக்கிறது.
- source_word: ἤρθη
  choice: சேகரிக்கப்பட்டன
  rationale: இச்சூழலில் சிதறியிருந்த மீதித் துண்டுகள் எடுத்து ஒன்றுசேர்க்கப்பட்டதைக் குறிக்கிறது; கிரேக்கத்தின் செயப்பாட்டு வடிவமும் தமிழில் பாதுகாக்கப்படுகிறது.
- source_word: κόφινοι δώδεκα
  choice: பன்னிரண்டு கூடைகள்
  rationale: கூடையின் பொருள் அல்லது வடிவம் குறித்து மூலத்தில் தேவைப்படாத கூடுதல் விவரத்தைச் சேர்க்காமல் எண்ணிக்கையையும் பொருளையும் தெளிவாகத் தருகிறது.
