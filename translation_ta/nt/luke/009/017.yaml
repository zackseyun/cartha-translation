translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. முதல் வாக்கியத்தின் இணை வினைகள் தமிழின் இயல்புக்கேற்ப இணைக்கப்பட்டுள்ளன. கடைசிப் பகுதியில் கிரேக்கத்தின் சுருக்கமான ‘பன்னிரண்டு கூடைகள்’ என்ற அளவுக் குறிப்பைத் தெளிவுபடுத்த ‘அவற்றின் அளவு’ சேர்க்கப்பட்டுள்ளது.
