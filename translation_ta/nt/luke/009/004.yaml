source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν οἰκίαν εἰσέλθητε, ἐκεῖ μένετε καὶ ἐκεῖθεν ἐξέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: ta
  text: நீங்கள் எந்த வீட்டுக்குள் நுழைந்தாலும், அங்கேயே தங்கியிருந்து, அங்கிருந்தே புறப்படுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: எந்த வீட்டுக்குள் ... ஆனாலும்
  rationale: ἣν ἂν தரும் பொதுவான, நிபந்தனைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκεῖ μένετε
  choice: அங்கேயே தங்கியிருந்து
  rationale: μένω என்பதன் ‘தொடர்ந்து தங்கியிரு’ என்ற பொருளையும் ἐκεῖ என்பதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: அங்கிருந்தே புறப்படுங்கள்
  rationale: ἐκεῖθεν என்பதன் ‘அந்த இடத்திலிருந்து’ என்ற திசைநிலைப் பொருளையும், ἐξέρχομαι என்பதன் சூழலுக்கேற்ற ‘புறப்படு’ என்ற பொருளையும் தருகிறது.
theological_decisions: []
translation_notes:
  register: இயல்பான, மரியாதையான நவீனத் தமிழ்; வசனத்தின் இணை அமைப்பையும் ‘அங்கே/அங்கிருந்து’ என்ற இடச் சுட்டுகளையும் தெளிவாகப் பேணுகிறது.
