  source_fidelity: 'Greek wording and sequence are preserved: the conditional-general expression εἰς ἣν ἂν οἰκίαν εἰσέλθητε is naturally rendered by “நீங்கள் எந்த வீட்டுக்குள் நுழைந்தாலும்”; ἐκεῖ μένετε by “அங்கேயே தங்கியிருந்து”; and ἐκεῖθεν ἐξέρχεσθε by “அங்கிருந்தே புறப்படுங்கள்.” The plural imperative and the contrast between remaining at the house and departing from it are clear.'
