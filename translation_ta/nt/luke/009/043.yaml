base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: ta
  text: 'அவர்கள் எல்லாரும் தேவனுடைய மகத்துவத்தைக்[a] கண்டு மலைத்துப்போனார்கள். ஆனால் அவர் செய்துகொண்டிருந்த எல்லாவற்றையும் கண்டு அனைவரும் வியந்துகொண்டிருந்தபோது, அவர் தம் சீடர்களிடம் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகத்துவம்’ என்பதற்கு ‘மாட்சிமை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பெருமை, மாண்பு அல்லது மாட்சிமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: மலைத்துப்போனார்கள்
  rationale: வலுவான வியப்பையும் தொடர்ந்து நிலவிய மனநிலையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; அடுத்துள்ள θαυμαζόντων என்பதற்கான ‘வியந்துகொண்டிருந்தபோது’ என்பதிலிருந்து வலிமையில் வேறுபடுகிறது.
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: எல்லாருடைய எதிர்வினையையும் வலியுறுத்தும் எழுவாயைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: தேவனுடைய மகத்துவத்தைக் கண்டு
  rationale: ἐπί + வேற்றுமை உருபு இங்கு வியப்பின் காரணம் அல்லது பொருளைக் குறிக்கிறது. μεγαλειότης என்பதன் greatness/grandeur/majesty என்ற பொருள் பரப்பை ‘மகத்துவம்’ இயல்பாகக் கடத்துகிறது.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: ஆனால் … அனைவரும் வியந்துகொண்டிருந்தபோது
  rationale: மூலத்தின் genitive absolute அமைப்பை காலச்சூழல் வாக்கியமாக இயல்பாக மாற்றுகிறது; imperfective தொடர்ச்சியையும் பாதுகாக்கிறது.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: அவர் செய்துகொண்டிருந்த எல்லாவற்றையும் கண்டு
  rationale: ἐποίει என்பதன் நிறைவுறாத, தொடர்ச்சியான செயற்பாட்டை ‘செய்துகொண்டிருந்த’ என்பதால் வெளிப்படுத்துகிறது; ἐπί குறிக்கும் வியப்பின் பொருள் ‘கண்டு’ மூலம் இயல்பாகச் சொல்லப்படுகிறது.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: அவர் தம் சீடர்களிடம் சொன்னார்
  rationale: நேரடியான கதைநடை அறிமுகமாகவும், αὐτοῦ என்பதைக் கண்ணியமான தற்சுட்டுப் பெயரடையான ‘தம்’ மூலம் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: οἷς ἐποίει மற்றும் εἶπεν என்பவற்றின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது இயேசுவைக் குறிக்கிறது
  alternative: முந்தைய ‘தேவனுடைய மகத்துவம்’ என்ற சொற்றொடரால் தேவனுடைய செயல்திறனுக்கே முதன்மை அளிப்பதாக வாசித்தல்
  rationale: உடனடி கதைச் சூழலில் செய்பவரும் பேசுபவரும் இயேசு. அதேவேளையில் நிகழ்ந்தவற்றில் வெளிப்பட்டது ‘தேவனுடைய மகத்துவம்’ என்று வசனம் கூறுவதால், தேவனையும் இயேசுவையும் ஒன்றாக்காமலும் அவர்களுக்கிடையிலான இறையியல் அழுத்தத்தை நீக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மலைத்துப்போனார்கள்’ மற்றும் ‘வியந்துகொண்டிருந்தபோது’ என்ற வேறுபாடு மூலத்திலுள்ள ἐκπλήσσομαι / θαυμάζω வலிமை வேறுபாட்டைப் பாதுகாக்கிறது.
