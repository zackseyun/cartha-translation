  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: ta
  text: ஆனால் அவர் அவர்களைக் கடுமையாக எச்சரித்து, இதை யாரிடமும் சொல்லக் கூடாது என்று கட்டளையிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களைக் கண்டித்து, இதை யாரிடமும் சொல்லக் கூடாது என்று கட்டளையிட்டார்.”
    reason: ἐπιτιμήσας என்பதற்கு ‘கடுமையாக எச்சரித்து’ என்றும் ‘கண்டித்து’ என்றும் பொருள் கொள்ள முடியும்; மாற்று மொழிபெயர்ப்பு அதன் கூர்மையான மற்றொரு சாத்தியத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: கடுமையாக எச்சரித்து
  rationale: ἐπιτιμάω இங்கு கண்டித்தல் அல்லது கடுமையாக எச்சரித்தல் என்ற வலிமையைக் கொண்டுள்ளது. சீடர்களைத் தவறுக்காக நேரடியாகக் கண்டித்தார் என்று இயல்பாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து, தொடர்ந்து வரும் தடை உத்தரவின் கடுமையை இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρήγγειλεν
  choice: கட்டளையிட்டார்
  rationale: παραγγέλλω அதிகாரப்பூர்வமான உத்தரவைக் குறிக்கிறது; நவீனத் தமிழில் அதன் வலிமையைத் தெளிவாகக் காட்டும் சொல் ‘கட்டளையிட்டார்’.
- source_word: μηδενὶ
  choice: யாரிடமும் ... கூடாது
  rationale: μηδενί என்பது சொல்லப்படுபவரைக் குறிக்கும் மறுப்புப் பொருளுள்ள வேற்றுமை வடிவம். தமிழில் ‘யாரிடமும் சொல்லக் கூடாது’ என்பது ‘ஒருவரிடமும் சொல்ல வேண்டாம்’ என்பதைக் காட்டும் இயல்பான அமைப்பு.
- source_word: λέγειν
  choice: சொல்ல
  rationale: λέγειν, μηδενί மற்றும் τοῦτο என்பவற்றுடன் வருவதால், ஒரு செய்தியை ஒருவரிடம் தெரிவிப்பது என்ற பொருள்; ‘சொல்ல’ என்பது இதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῦτο
  choice: இதை
  rationale: τοῦτο முந்தைய வசனத்தில் பேதுரு கூறிய அறிக்கையைச் சுட்டுகிறது. ‘இதை’ என்று மொழிபெயர்ப்பது அந்தச் சுட்டுதலைக் காத்து, அதன் பொருளை உரைக்குள்ளேயே விரிவுபடுத்தாமல் விடுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ முந்தைய அறிக்கைக்கும் இயேசுவின் எதிர்வினைக்கும் இடையிலான மிதமான எதிர்மறைத் திருப்பத்தைக் குறிக்கிறது; ‘ஆனால்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேதுருவின் அறிக்கைக்குப் பின் இயேசு விதித்த தடையின் வலிமை
  choice: இந்தக் கட்டத்தில் அதை யாரிடமும் வெளிப்படுத்தக் கூடாது என்ற வலுவான தடை
  alternative: அதைப் பற்றிக் குறிப்பிட வேண்டாம் என்ற மிதமான எச்சரிக்கை
  rationale: ἐπιτιμήσας மற்றும் παρήγγειλεν ஆகிய இரண்டும் சேர்ந்து இது சாதாரண வேண்டுகோள் அல்ல என்பதைக் காட்டுகின்றன. ஆனால் தடைக்கான காரணத்தை உரை இங்கு விளக்காததால், எந்த விரிவான இறையியல் கோட்பாட்டையும் மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘யாரிடமும் சொல்லக் கூடாது’ என்பது அதிகாரமுள்ள தடையை இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்புக் குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
