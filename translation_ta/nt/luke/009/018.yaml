language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: ta
  text: ஒரு சமயம், அவர் தனியாக[a] ஜெபித்துக்கொண்டிருந்தபோது, சீடர்கள் அவருடன் இருந்தார்கள். அவர் அவர்களிடம், “நான் யார் என்று மக்கள் கூட்டங்கள் சொல்கிறார்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தனிமையில்.’ κατὰ μόνας என்ற சொற்றொடர், வேறு யாரும் உடல்ரீதியாக அருகில் இல்லை என்பதை அவசியம் குறிக்காமல், ஒதுக்கமான நிலையில் இருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ஒரு சமயம்
  rationale: லூக்கா பயன்படுத்தும் நிகழ்வை அறிமுகப்படுத்தும் கதைநடைச் சூத்திரத்தை, நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: அவர் ... ஜெபித்துக்கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் பெயராக்கப்பட்ட infinitive சமகால நிகழ்வைக் குறிக்கிறது; தொடர்ந்துகொண்டிருந்த ஜெபச் செயலை இந்தத் தமிழ் வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατὰ μόνας
  choice: தனியாக
  rationale: இந்த மரபுத்தொடர் ‘தனியாக’ அல்லது ‘தனிமையில்’ என்று பொருள்படலாம். சுருக்கமான நேரடி பொருள் முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: சீடர்கள் அவருடன் இருந்தார்கள்
  rationale: சீடர்கள் அவரோடு இருந்தார்கள் என்ற எளிய உறவுநிலைப் பொருளை, அவர்கள் எவ்வளவு அருகில் இருந்தார்கள் என்பதை ஊகிக்காமல் பாதுகாக்கிறது.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: அவர் அவர்களிடம் ... என்று கேட்டார்
  rationale: தமிழில் இயல்பான நேரடி உரை அமைப்பு; λέγων என்பதன் உரையறிமுகப் பணியை ‘என்று’ ஏற்கிறது.
- source_word: Τίνα με ... εἶναι
  choice: நான் யார் என்று ... சொல்கிறார்கள்?
  rationale: கிரேக்க மறைமுகக் கேள்வி அமைப்பின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டத்தினர்
  rationale: ὄχλοι என்பதன் பன்மையையும் திரளான மக்கள் என்ற சமூகக் காட்சியையும் பாதுகாக்கிறது; பொதுவான ‘மக்கள்’ என்று தட்டையாக்கவில்லை.
theological_decisions:
- issue: இயேசு ‘தனியாக’ ஜெபித்ததற்கும் சீடர்கள் ‘அவருடன்’ இருந்ததற்கும் இடையிலான வெளிப்படையான இழுபறி
  choice: 'இரு கூற்றுகளையும் நேரடியாக வைத்தல்: அவர் தனியாக ஜெபித்துக்கொண்டிருந்தார்; சீடர்கள் அவருடன் இருந்தார்கள்.'
  alternative: ‘தனிமையில்’ என்று மட்டும் மொழிபெயர்த்து முரண்பாட்டுத் தோற்றத்தை மென்மையாக்குதல், அல்லது சீடர்கள் அருகில் இருந்தார்கள் என்று விளக்கிச் சேர்த்தல்.
  rationale: கிரேக்க உரை தனித்த ஜெபத்தையும் சீடர்களின் உடனிருப்பையும் ஒன்றாகக் கூறுகிறது. சீடர்கள் அருகில் மட்டுமே இருந்தார்கள் போன்ற விளக்கத்தைச் சேர்க்காமல், உரையின் உண்மையான நுணுக்கத்தையும் இழுபறியையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபித்துக்கொண்டிருந்தபோது’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் சமயச் சொல்லாட்சியாகவும், மூலத்தின் தொடர்நிலை அம்சத்தைத் தெளிவாகவும் காட்டுகிறது. முதன்மை உரையிலுள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
