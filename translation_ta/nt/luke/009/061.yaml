reference: Luke 9:61
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: ta
  text: மேலும் வேறொருவர், “ஆண்டவரே, நான் உம்மைப் பின்பற்றுவேன். ஆனால் முதலில் என் வீட்டில் உள்ளவர்களிடம் விடைபெற எனக்கு அனுமதி தாரும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: மேலும் வேறொருவர்
  rationale: இணைப்பையும், முன்பு பேசியவர்களிலிருந்து வேறுபட்ட இன்னொருவர் சேர்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀκολουθήσω σοι
  choice: நான் உம்மைப் பின்பற்றுவேன்
  rationale: எதிர்கால வினை வடிவம் பேச்சாளரின் வெளிப்படுத்தப்பட்ட நோக்கத்தைச் சுட்டுகிறது; மரியாதை ஒருமையான ‘உம்மை’ இயேசுவை நேரடியாக அழைக்கும் சூழலுக்கு ஏற்றது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பையும் சாத்தியமான இறையியல் நிறையையும் தாழ்த்தாமல் காக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: செயல்களின் முன்னுரிமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπίτρεψόν μοι
  choice: எனக்கு அனுமதி தாரும்
  rationale: அனுமதி கோரும் கட்டளை வடிவத்தின் பணிவான வேண்டுகோளை மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀποτάξασθαι
  choice: விடைபெற
  rationale: இச்சூழலில் ஒருவரிடமிருந்து பிரியும்போது விடை கூறுதல் அல்லது விடைபெறுதல் என்ற நடுநிலைப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: என் வீட்டில் உள்ளவர்களிடம்
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் தமிழில் இயல்பாக்கி, வீட்டில் இருப்பவர்கள் அல்லது வீட்டைச் சேர்ந்தவர்கள் என்ற குறிப்பு வரம்பை மிகையாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: ஐயா / போதகரே
  rationale: ‘ஆண்டவரே’ என்பது மரியாதையான நேரடி அழைப்பையும் இயேசுவைப் பற்றிய ஆழமான இறையியல் பொருள் இருக்கக்கூடிய சாத்தியத்தையும் ஒன்றாகக் காக்கிறது; ‘ஐயா’ என்று மொழிபெயர்த்து அந்தத் tension-ஐத் தாழ்த்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நேரடி உரை. மூலத்தில் உள்ள மரியாதை ஒருமையை ‘உம்/தாரும்’ வடிவங்கள் காக்கின்றன.
