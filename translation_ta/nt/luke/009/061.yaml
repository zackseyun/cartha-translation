  source_fidelity: 'தமிழ் உரை கிரேக்கத்தின் முக்கிய கூறுகளைத் துல்லியமாகக் காக்கிறது: δὲ καὶ ἕτερος-இன் இணைப்பு/கூடுதல் உணர்வு ‘மேலும் வேறொருவர்’ என்பதில் உள்ளது; எதிர்கால நோக்கமான ‘நான் உம்மைப் பின்பற்றுவேன்,’ மரியாதையான κύριε-க்கு ‘ஆண்டவரே,’ முன்னுரிமையான ‘முதலில்,’ அனுமதி வேண்டுகோள், மற்றும் விடைபெறுதல் அனைத்தும் முறையாகத் தரப்பட்டுள்ளன. ‘என் வீட்டில் உள்ளவர்களிடம்’ என்பது τοῖς εἰς τὸν οἶκόν μου என்ற சற்றே இயல்பில்லாத கிரேக்கக் குறிப்பைத் தேவையற்ற வகையில் ‘குடும்பத்தினர்’ எனக் குறுக்காமல் பாதுகாக்கிறது.'
  naturalness: நவீன தரத் தமிழில் வாக்கியம் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. ‘உம்மைப்,’ ‘தாரும்’ ஆகிய வடிவங்கள் நேரடி அழைப்பின் மரியாதைத் தொனியைச் சரியாகக் காக்கின்றன. மேற்கோளுக்குப் பின் ‘என்றார்’ அமைப்பும் தமிழுக்கு இயல்பானது.
  terminology: ‘ஆண்டவரே’ என்பது κύριε-க்கான நிறுவப்பட்ட, இறையியல் சாத்தியத்தைத் திறந்துவைக்கும் பொருத்தமான தெரிவாகும். ‘பின்பற்றுவேன்,’ ‘அனுமதி தாரும்,’ ‘விடைபெற’ ஆகியவை சூழலுக்கு ஏற்ற நடுநிலை மற்றும் துல்லியமான சொற்கள். தனிப் பாதக்குறிப்பு அவசியப்படுத்தும் அளவுக்கு மொழிபெயர்ப்பில் தீர்க்கப்படாத குழப்பமோ, வெளிப்படாத வாசிப்புவேறுபாடோ இல்லை.
