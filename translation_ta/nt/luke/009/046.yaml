  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: ta
  text: அப்போது, தங்களில் யார் மிகப் பெரியவராக இருக்கக்கூடும் என்பதைப் பற்றிய வாதம் அவர்களிடையே எழுந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களிடையே ஒரு சிந்தனை அல்லது கலந்துரையாடல் எழுந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: எழுந்தது
  rationale: சொல்லுக்குச் சொல் ‘நுழைந்தது’ என்றாலும், διαλογισμός என்பதுடன் நிகழ்வு தோன்றியதை இயல்பான தமிழில் ‘எழுந்தது’ எனத் தெரிவிக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: கதை நகர்வைக் குறிக்கும் மென்மையான இணைப்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διαλογισμὸς
  choice: வாதம்
  rationale: இச்சொல் சிந்தனை, கலந்துரையாடல், விவாதம் ஆகிய பொருள்களைக் கொள்ளலாம்; யார் பெரியவர் என்ற போட்டித்தன்மையுள்ள சூழலில் ‘வாதம்’ பொருத்தமானது, ஆனால் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐν αὐτοῖς
  choice: அவர்களிடையே
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுக்குள்’ என இருந்தாலும், குழுவினரிடையே நிகழ்ந்த ஒன்றை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τὸ τίς ἂν εἴη
  choice: யார் ... இருக்கக்கூடும் என்பதைப் பற்றி
  rationale: மறைமுகக் கேள்வியின் உள்ளடக்கத்தையும் ἄν உடன் வரும் வினைமுறையின் சாத்திய நுணுக்கத்தையும் காக்கிறது.
- source_word: μείζων
  choice: பெரியவராக
  rationale: கிரேக்கத்தில் ஒப்பீட்டுச் சொல் ‘பெரியவர்’ உள்ளது; குழுவுக்குள் உயர்ந்த நிலை அல்லது முக்கியத்துவத்தைக் குறிக்கும் பொருளைத் தமிழில் மிகை விளக்கமின்றி காக்கிறது.
- source_word: αὐτῶν
  choice: தங்களில்
  rationale: ஒப்பிடப்படும் வரையறுக்கப்பட்ட குழு அவர்களே என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: சீடர்களிடையே நிகழ்ந்ததன் தன்மை
  choice: வாதம்
  alternative: சிந்தனை அல்லது கலந்துரையாடல்
  rationale: யார் பெரியவர் என்ற போட்டித்தன்மையுள்ள கேள்வி பரஸ்பர வாதத்தைக் குறிப்பதாகத் தோன்றுகிறது; எனினும் διαλογισμός என்பதன் அகச் சிந்தனை அல்லது கலந்துரையாடல் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பெரியவர்’ என்பது உடல் அளவை அல்ல, அந்தக் குழுவில் உயர்ந்தவர் அல்லது முக்கியமானவர் என்ற சூழல்சார் பொருளைக் கொண்டது.
