id: LUK.9.50
reference: Luke 9:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: ta
  text: ஆனால் இயேசு அவனிடம், “அவனைத் தடுக்காதீர்கள்[a]. ஏனெனில், உங்களுக்கு எதிராக இல்லாதவர் உங்களுக்கு ஆதரவாக இருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைத் தடைசெய்யாதீர்கள்” அல்லது “அவனைச் செய்யவிடாமல் விலக்காதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: ஆனால் ... என்றார்
  rationale: δέ இங்கு முந்தைய வசனத்தில் கூறப்பட்ட எதிர்ப்புக்கான இயேசுவின் பதிலை மென்மையான மாறுபாட்டுடன் இணைக்கிறது. அதனால் இயல்பான நவீன தமிழில் ‘ஆனால்’ பொருத்தமாக உள்ளது.
- source_word: πρὸς αὐτόν
  choice: அவனிடம்
  rationale: மூலத்தில் பெயருக்குப் பதிலாக முந்தைய பேச்சாளரைக் குறிக்கும் ஒருமைப் பிரதிப்பெயர் உள்ளது; ‘அவனிடம்’ அதை அப்படியே காக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தனிப்பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: Μὴ κωλύετε
  choice: அவனைத் தடுக்காதீர்கள்
  rationale: κωλύω என்பது தடுத்தல், இடையூறு செய்தல், அல்லது செய்யவிடாமல் விலக்குதல் என்று பொருள்படலாம். இச்சூழலில் பெயர் குறிப்பிடப்படாத அந்த மனிதனின் செயலை நிறுத்த முயல வேண்டாம் என்பதே நடைமுறைப் பொருள். ‘தடுக்காதீர்கள்’ என்பது பன்மை ஏவலைக் காத்து தெளிவாக உள்ளது; பொருளாகிய ‘அவனை’ சூழலிலிருந்து வெளிப்படையாகச் சேர்ப்பது தமிழில் இயல்பானது.
- source_word: ὃς γὰρ
  choice: ஏனெனில் ... இல்லாதவர்
  rationale: ὃς உடனடி நபரையும் அதற்கு அப்பாற்பட்ட பொதுக் கோட்பாட்டையும் குறிக்கக்கூடும். தமிழில் ‘இல்லாதவர்’ என்ற பொதுமைப்படுத்தப்பட்ட அமைப்பு அந்த விரிவான வலிமையை இயல்பாக வெளிப்படுத்துகிறது; γάρ ‘ஏனெனில்’ எனக் காட்டப்பட்டுள்ளது.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: உங்களுக்கு எதிராக இல்லாதவர்
  rationale: κατά இங்கு எதிர்ப்பு அல்லது விரோத நிலைப்பாட்டைக் குறிக்கிறது. இரண்டாம் நபர் பன்மையின் பொருள் ‘உங்களுக்கு’ என்பதில் காக்கப்படுகிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்கு ஆதரவாக இருக்கிறார்
  rationale: ὑπέρ இங்கு ஆதரவு அல்லது ஒருவரின் சார்பான நிலைப்பாட்டைக் குறிக்கிறது. ‘ஆதரவாக’ என்பது ‘எதிராக’ என்பதுடனான எதிரிணையைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றின் வரம்பு
  choice: ‘உங்களுக்கு எதிராக இல்லாதவர்’ என்று பொதுவான கோட்பாடாக மொழிபெயர்த்தல்
  alternative: ‘உங்களுக்கு எதிராக இல்லாத அந்த நபர்’ என்று உடனடி நபருக்கு மட்டும் குறுக்குதல்
  rationale: உறவுப்பெயர் உடனடி நிகழ்விலுள்ள நபரைக் குறிக்கக்கூடியதாயிருந்தாலும், பொதுவான கோட்பாட்டையும் வெளிப்படுத்துகிறது. தேர்ந்தெடுத்த மொழியாக்கம் அந்த விரிவைத் தக்கவைக்கிறது; அதேவேளையில் கூடுதல் இறையியல் முடிவைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘தடுக்காதீர்கள்’ மற்றும் ‘உங்களுக்கு’ ஆகிய வடிவங்கள் சீடர்களாகிய பன்மை கேட்போரைக் குறிக்கின்றன. எதிர்/ஆதரவு என்ற இணை அமைப்பு கிரேக்கத்தின் கருத்து எதிரிணையை இயல்பாக வெளிப்படுத்துகிறது.
