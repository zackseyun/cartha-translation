  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: ta
  text: பன்னிருவரையும் ஒன்றாக அழைத்து[a], எல்லாப் பேய்களின்மேலும்[b] அதிகாரம் செலுத்துவதற்கும் நோய்களைக் குணமாக்குவதற்கும் அவர்களுக்கு வல்லமையையும் அதிகாரத்தையும் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பன்னிருவரையும் ஒன்றாக அழைத்த பின்பு.’
    reason: கிரேக்க இறந்தகால வினையெச்சத்தின் முன்னோடி கால உறவை இன்னும் வெளிப்படையாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: அல்லது, ‘ஒவ்வொரு பேயின்மேலும்.’
    reason: πάντα τὰ δαιμόνια என்பதை கூட்டுமுழுமையாகவோ பகிர்ந்தளிக்கும் பொருளிலோ தமிழாக்கலாம்.
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: ஒன்றாக அழைத்து
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன்னோடியான செயலைக் குறிக்கிறது; συν- என்ற முன்னொட்டின் கூட்டுப் பொருளை ‘ஒன்றாக’ வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கும் இணைப்புச்சொல். தமிழில் வினையெச்சத் தொடர் அந்தத் தொடர்ச்சியை இயல்பாகவே தருவதால் தனிச் சொல் சேர்க்கப்படவில்லை.
- source_word: τοὺς δώδεκα
  choice: பன்னிருவரை
  rationale: மூலத்தில் உள்ள ‘பன்னிருவர்’ என்பதையே வைத்துக் கொண்டு, ‘சீடர்கள்’ அல்லது ‘அப்போஸ்தலர்கள்’ என்று சேர்க்கவில்லை.
- source_word: ἔδωκεν
  choice: கொடுத்தார்
  rationale: δίδωμι என்பதற்கான நேரடியான, இயல்பான தமிழாக்கம்; இயேசுவைக் குறிக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: δύναμιν
  choice: வல்லமை
  rationale: செயலாற்றும் ஆற்றல் அல்லது சக்தி என்ற நுணுக்கத்தைத் தருகிறது; ἐξουσία என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: ஒப்படைக்கப்பட்ட உரிமை மற்றும் ஆளுகை அதிகாரம் என்ற பொருளைத் தருகிறது.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: எல்லாப் பேய்களின்மேலும்
  rationale: ἐπί இங்கு மேலான அதிகாரம் அல்லது ஆளுகையைக் குறிக்கிறது; πάντα τὰ δαιμόνια என்பதன் பன்மை மற்றும் முழுமை காக்கப்படுகின்றன.
- source_word: δαιμόνια
  choice: பேய்கள்
  rationale: ‘அசுத்த ஆவிகள்’ என்று விளக்கமாக மாற்றாமல், மூலச் சொல்லுக்கான நேரடியான பொதுத் தமிழ் இணை பயன்படுத்தப்பட்டுள்ளது.
- source_word: νόσους
  choice: நோய்கள்
  rationale: உடல் நோய் அல்லது பிணியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: θεραπεύειν
  choice: குணமாக்குவதற்கு
  rationale: இங்கு infinitive, கொடுக்கப்பட்ட வல்லமை மற்றும் அதிகாரத்தின் செயல் நோக்கத்தைத் தெரிவிக்கிறது.
theological_decisions:
- issue: δύναμις மற்றும் ἐξουσία இடையிலான வேறுபாடு
  choice: ‘வல்லமை’ மற்றும் ‘அதிகாரம்’ என்று தனித்தனியாக மொழிபெயர்க்கப்பட்டது
  alternative: இரண்டையும் ‘அதிகாரம்’ அல்லது ‘சக்தி’ என்ற ஒரே கருத்தாகச் சுருக்குதல்
  rationale: செயலாற்றும் ஆற்றலையும் அதைச் செய்வதற்கான ஒப்படைக்கப்பட்ட அதிகாரத்தையும் மூலவாக்கியம் வேறுபடுத்துகிறது; அந்த இறையியல் நெருக்கடியைச் சமப்படுத்தாமல் இரு சொற்களும் காக்கப்பட்டன.
- issue: ‘பன்னிருவர்’ யாரைக் குறிக்கிறது என்பது
  choice: ‘பன்னிருவர்’ என்றே வைக்கப்பட்டது
  alternative: ‘பன்னிரு சீடர்கள்’ அல்லது ‘பன்னிரு அப்போஸ்தலர்கள்’
  rationale: இந்த வசனத்தில் ‘சீடர்கள்’ அல்லது ‘அப்போஸ்தலர்கள்’ என்ற பெயர் வெளிப்படையாக இல்லை; அருகிலுள்ள சூழலிலிருந்து அந்தச் சொல்லைச் சேர்க்கவில்லை.
- issue: ἐπὶ πάντα τὰ δαιμόνια என்பதின் எண்ணிக்கை நுணுக்கம்
  choice: ‘எல்லாப் பேய்களின்மேலும்’
  alternative: ‘ஒவ்வொரு பேயின்மேலும்’
  rationale: பன்மை வடிவத்தின் கூட்டுமுழுமையை முதன்மை உரை இயல்பாக வெளிப்படுத்துகிறது; பகிர்ந்தளிக்கும் பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அவர்’ என்ற எழுவாய் முந்தைய சூழலிலிருந்து புரிவதால் ‘இயேசு’ என்று மூலத்தில் இல்லாத பெயர் சேர்க்கப்படவில்லை. கிரேக்க வாக்கியத்தின் இணைப்பை இயல்பான தமிழுக்காக இரு நோக்க வினைத்தொடர்களாக அமைத்தாலும், பேய்கள்மீதான அதிகாரமும் நோய்களைக் குணமாக்கும் ஆற்றலும் தனித்தனியாகக் காக்கப்பட்டன.
