  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: ta
  text: பின்னர் அவர் வேறொருவரிடம், “என்னைப் பின்பற்று” என்றார். அவரோ, “ஆண்டவரே, முதலில் போய் என் தந்தையை அடக்கம் செய்ய எனக்கு அனுமதி அளியுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதலில் சென்று என் தந்தையை அடக்கம் செய்ய என்னை அனுமதியுங்கள்.”
    reason: ἀπελθόντι πρῶτον என்பதன் செயல் வரிசையைச் சற்றே நேரடியாகக் காட்டும் மாற்றுச் சொற்றொடர்.
lexical_decisions:
- source_word: ἕτερον
  choice: வேறொருவரிடம்
  rationale: ἕτερος என்பது முன்பு குறிப்பிடப்பட்டவர்களிலிருந்து வேறான இன்னொரு நபரைக் குறிக்கிறது; ‘வேறொருவரிடம்’ என்பது இந்த வேறுபாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்று
  rationale: ἀκολουθέω என்பதன் நிகழ்காலக் கட்டளை வடிவத்தை இயல்பான தமிழ் கட்டளையாக வழங்குகிறது; தொடர்ச்சியைக் குறிப்பாகச் சேர்த்து மிகைவிளக்கம் செய்யவில்லை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதில் உள்ள மரியாதையையும் கிறிஸ்தவ அர்த்தச் சாத்தியத்தையும் காக்கிறது.
- source_word: ἐπίτρεψόν μοι
  choice: என்னை … அனுமதியுங்கள்
  rationale: அனுமதி கோரும் கட்டளை வடிவத்தை மரியாதையான, நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἀπελθόντι πρῶτον
  choice: நான் முதலில் போய்
  rationale: அடக்கம் செய்வதற்கு முன்னதாகப் போக அனுமதி கேட்கும் செயல் வரிசையை இயல்பான தமிழில் காட்டுகிறது; திரும்பி வருவதாக மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: θάψαι τὸν πατέρα μου
  choice: என் தந்தையை அடக்கம் செய்ய
  rationale: தந்தையை அடக்கம் செய்வது என்ற நேரடியான பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கி κύριε என்று அழைத்தல்
  choice: ஆண்டவரே
  alternative: ஐயா / போதகரே
  rationale: ‘ஆண்டவரே’ என்பது மரியாதையான நேரடி அழைப்பாகவும் கிறிஸ்துவைப் பற்றிய ஆழமான பட்டப்பெயராகவும் புரிந்துகொள்ளக்கூடிய பதற்றத்தைப் பாதுகாக்கிறது; வெறும் சமூக மரியாதையாக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்கத்தில் இல்லாத ‘சென்றுவிட்டு வர’ என்ற திரும்பிவருதல் கருத்து சேர்க்கப்படவில்லை. மூலத்தின் இணைப்புச் சொல்லான δέ, சூழலுக்கேற்ற ‘பின்பு’ மற்றும் ‘அதற்கு’ என்பவற்றால் இயல்பாக வழங்கப்பட்டுள்ளது.
