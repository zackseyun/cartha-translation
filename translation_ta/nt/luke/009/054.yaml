    issue: The main-text verb 'அழித்துப்போட' is colloquial in tone.
    rationale: It can convey the sense, but 'அழிக்க' is more neutral modern standard Tamil and preserves the fire-related sense of ἀναλῶσαι without added colloquial emphasis.
  - severity: low
    issue: The footnote labels a full idiomatic Tamil rendering as 'சொல்லுக்குச் சொல்'.
