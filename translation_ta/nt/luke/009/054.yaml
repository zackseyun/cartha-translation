id: LUK.9.54
reference: Luke 9:54
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: ta
  text: சீடர்களான யாக்கோபும் யோவானும் இதைக் கண்டபோது, “ஆண்டவரே, வானத்திலிருந்து நெருப்பு இறங்கி வந்து அவர்களை அழிக்கும்படி நாங்கள் சொல்ல வேண்டும் என்று விரும்புகிறீரா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: இதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையை இயல்பான தமிழில் காலத்தைக் குறிக்கும் தொடராக மொழிபெயர்த்துள்ளது. வெளிப்படையாக இல்லாத செயப்படுபொருளான ‘இதை’ முந்தைய வசனத்தில் கூறப்பட்ட சமாரியர்களின் மறுப்பைக் குறிக்கிறது.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: சீடர்களான யாக்கோபும் யோவானும்
  rationale: யாக்கோபும் யோவானும் எந்தச் சீடர்கள் என்பதை அடையாளப்படுத்தும் மூலமொழியின் அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வடிவம்.
- source_word: θέλεις
  choice: விரும்புகிறீரா
  rationale: இங்கு θέλω விருப்பம் அல்லது எண்ணத்தை வெளிப்படுத்துகிறது; மரியாதைப் பன்மை தமிழில் சூழலுக்கு ஏற்றது.
- source_word: εἴπωμεν
  choice: நாங்கள் சொல்ல வேண்டுமென்று
  rationale: மூலத்தில் கட்டளையிடுதல் எனும் தனி வினை இல்லாமல் λέγω உள்ளது. ஆகவே அதன் சொற்பொருளைத் தக்கவைத்து, பின்வரும் நிகழ்வின் காரணவியல் வலிமையைத் தமிழ் வாக்கிய அமைப்பு உணர்த்துகிறது.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து நெருப்பு இறங்கி வந்து
  rationale: தீர்ப்பைக் குறிக்கும் தெளிவான உருவகத்தையும் மூலத்தின் இயக்கத்தையும் இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
- source_word: ἀναλῶσαι
  choice: அழித்துப்போடும்படி
  rationale: ἀναλίσκω இங்கு நெருப்பால் முழுமையாக அழிப்பதைக் குறிக்கிறது. ‘அழித்துப்போடு’ என்பது நவீனத் தமிழில் இயல்பாகவும் தீவிரத்தைக் காக்கும் வகையிலும் உள்ளது.
- source_word: αὐτούς
  choice: இவர்களை
  rationale: அருகிலுள்ள உரையாடல் சூழலில் குறிப்பிடப்படும் சமாரிய ஊராரைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்.
theological_decisions:
- issue: ‘கண்டார்கள்’ என்பதன் மறைமுகச் செயப்படுபொருள்
  choice: ‘இதை’ என்று சேர்த்து, முந்தைய வசனத்தில் நிகழ்ந்த மறுப்புடன் இணைக்கப்பட்டது.
  alternative: ‘கண்டபோது’ என்று செயப்படுபொருள் இல்லாமல் விடுதல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழ் நடையில் ‘இதை’ என்பது கதைத் தொடர்பைத் தெளிவாக்குகிறது; புதிய தகவலைச் சேர்ப்பதில்லை.
- issue: சீடர்களின் முன்மொழிவில் εἴπωμεν என்பதன் வலிமை
  choice: ‘சொல்ல வேண்டுமென்று’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கட்டளையிட வேண்டுமென்று’ அல்லது ‘வரவழைக்க வேண்டுமென்று’
  rationale: மூலத்தில் λέγω (‘சொல்’) என்பதே உள்ளது; வலுவான கட்டளை வினை இல்லை. அதேவேளையில் நெருப்பு இறங்கி வரும்படி சொல்வது அதிகாரமுள்ள உத்தரவைக் குறிப்பதை அடிக்குறிப்பு தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘ஆண்டவரே’ என்ற மரியாதை அழைப்பும் ‘விரும்புகிறீரா’ என்ற மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் சற்று அசாதாரணமான ‘நெருப்பிடம் சொல்வது’ என்ற வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
