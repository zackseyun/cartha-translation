base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: ta
  text: தெத்ரார்க்கான ஏரோது, நடந்துகொண்டிருந்த எல்லாவற்றையும் பற்றிக் கேள்விப்பட்டான்; யோவான் இறந்தோரிலிருந்து எழுப்பப்பட்டார்[a] என்று சிலர் சொல்லிக்கொண்டிருந்ததால், அவன் குழப்பமடைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தோரிலிருந்து எழுந்தார்.” கிரேக்க வினை செயப்பாட்டு வடிவில் உள்ளது; சொல்லுக்குச் சொல், “எழுப்பப்பட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: கேள்விப்பட்டான்
  rationale: நிகழ்வுகளைப் பற்றிய செய்தி ஏரோதுக்குக் கிடைத்தது என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதையை மெதுவாக முன்னெடுக்கும் இணைப்பிடைச்சொல்; தமிழில் வசன அமைப்பும் சூழலும் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகின்றன. தேவையற்ற காலச்சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ὁ τετραάρχης
  choice: நான்கில் ஒரு பகுதியை ஆளும்
  rationale: τετραάρχης என்ற வரலாற்று அரசியல் பதவியின் அடிப்படைப் பொருளை, ‘ராஜா’ போன்ற பொதுப்பட்டமாக மாற்றாமல் சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: τὰ γινόμενα πάντα
  choice: நடந்துகொண்டிருந்த எல்லாவற்றையும்
  rationale: அப்போது தொடர்ந்து நிகழ்ந்துவந்த செயல்களைக் குறிக்கும் பங்கேற்புவினையின் நீடித்த தன்மையைப் பாதுகாக்கிறது.
- source_word: διηπόρει
  choice: குழப்பமடைந்தான்
  rationale: எதை நம்புவது என்று புரியாமல் திகைக்கும் அல்லது ஐயமுறும் மனநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: என்று சிலர் சொல்லிக்கொண்டிருந்ததால்
  rationale: காரணத் தொடர்பையும், சிலரிடையே அந்தக் கூற்று தொடர்ந்து சொல்லப்பட்டுவந்ததையும் இயல்பான தமிழ் செயப்பாட்டு அமைப்பில் தெரிவிக்கிறது.
- source_word: ἠγέρθη
  choice: எழுப்பப்பட்டார்
  rationale: கிரேக்க வினையின் செயப்பாட்டுவினை வடிவைப் பாதுகாக்கிறது; ‘எழுந்தார்’ என்று மாற்றி அதன் இலக்கணத் திறப்பைத் தீர்மானித்துவிடவில்லை.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: உயிர்த்தெழுதல் சார்ந்த இச்சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; பன்மை வடிவின் ‘இறந்தோர் நடுவிலிருந்து’ என்ற கருத்தையும் அடக்குகிறது.
theological_decisions:
- issue: யோவானைப் பற்றிய உயிர்த்தெழுதல் கூற்றின் வினைவடிவம்
  choice: இறந்தோரிலிருந்து எழுப்பப்பட்டார்
  alternative: இறந்தோரிலிருந்து எழுந்தார்
  rationale: ἠγέρθη என்பது இலக்கணப்படி செயப்பாட்டு வடிவம். ஆகவே யோவான் தாமாக எழுந்தார் என்று மாற்றாமல், அவர் எழுப்பப்பட்டார் என்ற மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுப் பதவியான τετραάρχης விளக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது. ஏரோதுக்கான சுட்டுப்பெயரில் இயல்பான கதைநடைப் பயன்பாடும், யோவானைக் குறிப்பிடும்போது மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளன.
