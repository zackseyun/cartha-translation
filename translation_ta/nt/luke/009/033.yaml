source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: ta
  text: 'அவர்கள் அவரைவிட்டுப் பிரிந்து செல்லும்போது, பேதுரு இயேசுவிடம், “தலைவரே, நாம் இங்கே இருப்பது நல்லது. மூன்று கூடாரங்களை[a] அமைப்போம்: ஒன்று உமக்கு, ஒன்று மோசேக்கு, ஒன்று எலியாவுக்கு” என்றான்—தான் என்ன சொல்கிறான் என்பதை அறியாமலே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடில்கள்,” “தற்காலிகத் தங்குமிடங்கள்,” அல்லது மரபாக “திருக்கூடாரங்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் தற்காலிகமான தங்குமிடங்களைக் குறிக்கிறது; அது வேதாகமத்தின் கூடாரப் பண்டிகைச் சித்திரத்தை எதிரொலிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: அவர்கள் அவரைவிட்டுப் பிரிந்து செல்லும்போது
  rationale: ἐγένετο ἐν τῷ + infinitive என்ற கிரேக்கக் கதைநடை அமைப்பைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், அதே நேரத்தில் நிகழ்ந்த செயலை இயல்பான தமிழில் காட்டுகிறது. αὐτούς என்பது மோசேயையும் எலியாவையும், αὐτοῦ என்பது இயேசுவையும் குறிக்கிறது.
- source_word: Ἐπιστάτα
  choice: தலைவரே
  rationale: லூக்கா தனித்துவமாகப் பயன்படுத்தும் ἐπιστάτης என்பது அதிகாரமுள்ள ஒருவரை மரியாதையுடன் அழைக்கும் சொல். “போதகரே” என்று மொழிபெயர்த்தால் διδάσκαλος என்பதோடு ஒன்றாக்கிவிடும்; “ஆண்டவரே” என்பது κύριος என்ற வேறு கிரேக்கச் சொல்லின் இறையியல் ஒலியை தேவையின்றி கொண்டுவரலாம். “தலைவரே” அதிகாரத்தையும் மரியாதையையும் காக்கிறது.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: நாம் இங்கே இருப்பது நல்லது
  rationale: καλόν என்பதன் நேரான மதிப்பீட்டுப் பொருளையும், தமிழில் இயல்பான பெயரெச்ச வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: ποιήσωμεν
  choice: அமைப்போம்
  rationale: முதல் நபர் பன்மை வேண்டுகோள்/முன்மொழிவு சார்ந்த aorist subjunctive-ஐ இயல்பான தமிழில் நேரடி முன்மொழிவாகக் காட்டுகிறது. “கட்டுவோம்” என்பதைக் காட்டிலும் ποιέω என்பதன் பரந்த பொருளுக்கு நெருக்கமானது.
- source_word: σκηνὰς
  choice: கூடாரங்களை
  rationale: தற்காலிகத் தங்குமிடம், குடில் அல்லது கூடாரம் என்ற பொருளைக் கொண்ட சொல்லை வாசகர்களுக்குப் புரியும் பொதுவான சொல்லால் தருகிறது; குறிப்பிட்ட பண்டிகை விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: தான் என்ன சொல்கிறான் என்பதை அறியாமலேயே இப்படிச் சொன்னான்
  rationale: பேதுரு பேசிக்கொண்டிருந்த அந்தத் தருணத்தில் அவரது புரிதலின்மையை நிகழ்கால λέγει-இன் நுணுக்கத்துடன் காட்டுகிறது. தமிழில் யார் அறியவில்லை என்பது தெளிவாக இருக்க “தான்” சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மறுரூப நிகழ்வில் σκηνάς என்பதற்கு கூடாரப் பண்டிகை அல்லது திருக்கூடாரத் தொடர்பு உள்ளதா
  choice: முதன்மை உரையில் “கூடாரங்களை” என்று மொழிபெயர்த்து, சாத்தியமான வேதாகமப் பண்டிகை எதிரொலியை அடிக்குறிப்பில் மட்டும் குறிப்பிடுதல்
  alternative: “குடில்களை,” “தற்காலிகத் தங்குமிடங்களை,” அல்லது மரபாக “திருக்கூடாரங்களை” என்று மொழிபெயர்த்தல்
  rationale: இவ்வசனம் அந்த அமைப்புகளை கூடாரப் பண்டிகையோ திருக்கூடார மரபோடு வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே முதன்மை உரை அந்தத் தொடர்பைத் தீர்மானமாக்காமல், உண்மையான சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க கதைநடையிலும் வடிவமைக்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதையை “உமக்கு” காக்கிறது. இறுதி விளக்கப் பகுதி பேதுருவின் புரிதலின்மையைத் தெளிவுபடுத்தினாலும், அதன் காரணத்தை ஊகித்து சேர்க்கவில்லை.
