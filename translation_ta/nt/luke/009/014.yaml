  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: ta
  text: ஏனெனில், அங்கே ஏறக்குறைய ஐயாயிரம் ஆண்கள்[a] இருந்தார்கள். அவர் தமது சீடர்களிடம், “இவர்களை ஏறக்குறைய ஐம்பது பேர் கொண்ட குழுக்களாக உணவருந்த அமரச் செய்யுங்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘ஆண்கள்’ என்று உள்ளது; இது பொதுவாக மக்களைக் குறிக்காமல் வயதுவந்த ஆண்களைக் குறிப்பாகக் குறிக்கிறது. இந்த வசனம் மொத்தக் கூட்டத்தின் எண்ணிக்கையைக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களை ஏறக்குறைய ஐம்பது பேர் கொண்ட குழுக்களாகச் சாய்ந்து அமரச் செய்யுங்கள்.’ கிரேக்க வினைச்சொல் உணவுக்காகச் சாய்ந்து அமர வைப்பதைக் குறிப்பாக உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: ஏறக்குறைய
  rationale: இரு இடங்களிலும் துல்லியமான எண்ணிக்கையல்ல, தோராயமான எண்ணிக்கை என்பதைக் காட்டுகிறது; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: ἀνήρ இங்கு பொதுவாக மக்களைக் குறிக்காமல், வயதுவந்த ஆண்களைத் தனிப்படக் குறிக்கிறது.
- source_word: πεντακισχίλιοι
  choice: ஐயாயிரம்
  rationale: ‘ஆண்கள்’ என்பதைத் தழுவும் நேரடியான எண்ணிக்கை.
- source_word: Κατακλίνατε
  choice: பந்திக்கு அமரச் செய்யுங்கள்
  rationale: உணவு உண்பதற்காகச் சாய்ந்து அல்லது அமர்ந்து கொள்ளச் செய்வதை வினைச்சொல் குறிக்கிறது. தமிழ்ச் சூழலில் ‘பந்திக்கு அமரச் செய்யுங்கள்’ என்பது உணவு வேளையின் நுணுக்கத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: κλισίας
  choice: குழுக்களில்
  rationale: ஒழுங்குபடுத்தப்பட்ட தனித்தனி குழுக்களைக் குறிக்கும் பன்மைச் சொல்லை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀνὰ πεντήκοντα
  choice: ஐம்பது ஐம்பது பேராக
  rationale: ἀνά என்பதன் பகிர்ந்தமைப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ὡσεὶ காரணமாக ‘ஏறக்குறைய’ சேர்க்கப்பட்டுள்ளது.
- source_word: γὰρ ... δὲ
  choice: ஏனெனில் ... அவர்
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. δέ-யின் மென்மையான தொடர்ச்சி தமிழில் தனியாக இணைப்புச்சொல் சேர்க்காமலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: தமது சீடர்களிடம்
  rationale: மூலத்தில் உள்ள உடைமைப் பொருளைக் காக்கிறது; எழுவாய் ‘அவர்’ என்பதால் ‘தமது’ இயல்பாக உள்ளது.
