translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பந்திக்கு அமர’ என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பல்ல; முதல் நூற்றாண்டின் சாய்ந்து உண்ணும் நடைமுறையைத் தமிழில் இயல்பாக உணர்த்துகிறது. துல்லியத்திற்காக மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
