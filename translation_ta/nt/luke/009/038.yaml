  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: ta
  text: இதோ, கூட்டத்திலிருந்த ஒரு மனிதர் உரக்கக் கூப்பிட்டு, “போதகரே, என் மகனைக் கவனிக்கும்படி உம்மை மன்றாடுகிறேன்; ஏனெனில், அவன் எனக்கு ஒரே பிள்ளை[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே மகன்.” கிரேக்கத்தில், “அவன் எனக்கு ஒரே ஒருவன்” என்று உள்ளது. இச்சூழலில் அவன் ஏற்கெனவே மகன் என்று குறிப்பிடப்பட்டிருப்பதால், “ஒரே பிள்ளை,” “ஒரே மகன்” ஆகிய இரண்டுமே சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: நிகழ்வின் மீது வாசகரின் கவனத்தைத் திருப்பும் கிரேக்க உரையாடல் குறியின் வலிமையைத் தமிழிலும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: ἀνὴρ
  choice: ஒரு மனிதர்
  rationale: இச்சொல் குறிப்பாக ஓர் ஆணைக் குறிக்கிறது; மரியாதையான நவீனத் தமிழில் ‘மனிதர்’ என்பது இயல்பாக உள்ளது.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: கூட்டத்திலிருந்த
  rationale: அவர் கூடியிருந்த மக்களில் ஒருவர் என்பதைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: ἐβόησεν λέγων
  choice: உரக்கக் கூப்பிட்டு … என்றார்
  rationale: குரலின் உரத்த தன்மையையும் அவசரமான வேண்டுதலையும் காட்டுவதோடு, கிரேக்கப் பங்கேற்புவினை அமைப்பை இயல்பான தமிழ் வாக்கியமாக மாற்றுகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரைக் குறிக்கும் Διδάσκαλος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் அழைப்புமுறை; ‘ஆண்டவரே’ போன்ற கூடுதல் இறையியல் பொருளைச் சேர்ப்பதில்லை.
- source_word: δέομαί σου
  choice: உம்மை மன்றாடுகிறேன்
  rationale: ஒரு சாதாரண வேண்டுகோளைவிட வலுவான, மனமுருகிய விண்ணப்பத்தை δέομαι வெளிப்படுத்துகிறது.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: கவனிக்கும்படி
  rationale: வெறுமனே பார்ப்பதைவிட அக்கறையுடன் கவனம் செலுத்தும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸν υἱόν μου
  choice: என் மகனை
  rationale: உறவையும் ஆண்பாலையும் நேரடியாகவும் தெளிவாகவும் தக்கவைக்கிறது.
- source_word: μονογενής μοί ἐστιν
  choice: அவன் எனக்கு ஒரே பிள்ளை
  rationale: இங்கு μονογενής என்பது தந்தைக்கு அவன் ஒரே குழந்தை என்ற தனித்தன்மையை வலியுறுத்தலாம்; உடைமைப் பொருளுடைய μοί என்பதை ‘எனக்கு’ என்று இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: μονογενής என்பது ‘ஒரே பிள்ளை’யா அல்லது ‘ஒரே மகன்’ஆ?
  choice: ஒரே பிள்ளை
  alternative: ஒரே மகன்
  rationale: முந்தைய சொற்றொடர் குழந்தையை ஏற்கெனவே ‘மகன்’ என்று அடையாளப்படுத்துகிறது. எனவே இங்கு தந்தையின் ஒரே குழந்தை என்ற பொருளை முதன்மை உரை காட்டுகிறது; ஆனால் ஆண்பால் சூழலால் ‘ஒரே மகன்’ என்பதும் மொழியியல் ரீதியில் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தந்தையின் அவசரமும் மரியாதையும் ‘உரக்கக் கூப்பிட்டு,’ ‘உம்மை மன்றாடுகிறேன்’ என்பவற்றால் தக்கவைக்கப்பட்டுள்ளன. ‘இதோ’ என்பதன் சற்றே இலக்கியமான தன்மை லூக்காவின் கவன ஈர்ப்பு நடையைப் பாதுகாக்கிறது.
