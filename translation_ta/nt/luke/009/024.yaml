  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: ta
  text: ஏனெனில், தன் உயிரைக்[a] காப்பாற்றிக்கொள்ள விரும்புகிற எவரும் அதை இழந்துவிடுவார்; ஆனால் எனக்காகத் தன் உயிரை இழக்கிறவர் அவரே அதைக் காப்பாற்றுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிர்” என்பதற்கான கிரேக்கச் சொல், சூழலுக்கேற்ப “ஆன்மா” அல்லது “தன்னை” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: ஏனெனில், ... விரும்புகிற எவரும்
  rationale: ὃς ... ἂν உடன் வரும் வினை வடிவம் பொதுவான நிபந்தனையைச் சுட்டுவதால் ‘எவரும்’ என மொழிபெயர்க்கப்பட்டது. γάρ முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என வெளிப்படுத்தப்பட்டது; θέλω இயல்பான நவீன தமிழில் ‘விரும்பு’ என வழங்கப்பட்டது.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: தன் உயிரை
  rationale: ψυχή என்பதற்கு சூழலின்படி உயிர், ஆன்மா, தன் இயல்பு/தன்னையே என்ற பொருள்கள் இருக்கலாம். இங்கு உயிரைக் காக்கவும் இழக்கவும் கூறப்படும் முரண்பாட்டுக் கூற்றில் ‘உயிர்’ உடனடிச் சூழலுக்கு மிகப் பொருத்தமானது. αὐτοῦ-வின் தற்சுட்டுப் பொருளை இயல்பான தமிழில் ‘தன்’ காட்டுகிறது.
- source_word: σῶσαι
  choice: காப்பாற்றிக்கொள்ள
  rationale: σῴζω இங்கு ஒருவருடைய உயிரைப் பாதுகாத்துக்கொள்ள முயல்வதைக் குறிக்கிறது. ‘காப்பாற்றிக்கொள்ள’ தற்சுட்டுப் பொருளைத் தெளிவாக்குவதோடு இறுதியிலுள்ள அதே வினையுடனான சொல்விளையாட்டையும் காக்கிறது.
- source_word: ἀπολέσει αὐτήν
  choice: அதை இழந்துவிடுவார்
  rationale: ἀπόλλυμι இங்கு ‘இழத்தல்’ என்ற பொருளில் வருகிறது. ‘அதை’ என்பது ψυχήν ஆகிய ‘உயிரை’ மீண்டும் சுட்டுகிறது; ‘இழந்துவிடுவார்’ எதிர்கால விளைவின் உறுதியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὃς δ’ ἂν ἀπολέσῃ
  choice: ஆனால் ... இழக்கிறவர்
  rationale: δέ எதிர்மாறான இரண்டாம் பகுதியை அறிமுகப்படுத்துவதால் ‘ஆனால்’ என வழங்கப்பட்டது. ἄν உடன் வரும் நிபந்தனைப் பொருள் பொதுவாக ‘இழக்கிறவர்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: ἕνεκεν ἐμοῦ
  choice: எனக்காக
  rationale: ἕνεκεν ἐμοῦ என்பது இயேசுவை முன்னிட்டு அல்லது அவரின் நிமித்தம் நிகழ்வதைச் சுட்டுகிறது. ‘எனக்காக’ தனிப்பட்ட சீடத்துவ நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: οὗτος σώσει αὐτήν
  choice: அதைக் காப்பாற்றுவார்
  rationale: οὗτος முன் விவரிக்கப்பட்ட நபரையே வலியுறுத்துகிறது; தமிழில் ‘இழக்கிறவர்’ என்ற எழுவாயும் வாக்கிய அமைப்பும் அந்தச் சுட்டை இயல்பாகத் தாங்குகின்றன. σώσει முதல் பகுதியில் உள்ள σῶσαι-யுடன் ஒரே வேர்ச்சொல் தொடர்பைக் கொண்டதால் ‘காப்பாற்று’ இரு இடங்களிலும் காக்கப்பட்டது.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆன்மா; தன்னையே
  rationale: உடனடிச் சூழல் தன்னை மறுத்தல், சீடத்துவம், உயிரைக் காக்க அல்லது இழக்க முயல்வது ஆகியவற்றைப் பற்றியது. ‘உயிர்’ கூற்றின் முரண்பாட்டுத் தாக்கத்தைத் தருகிறது; மனிதனின் உடலற்ற பகுதியை மட்டும் குறிக்கும் குறுகிய வாசிப்பைத் திணிக்காது. மற்ற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- issue: பொதுவான ஆண்பால் ஒருமை அமைப்பு
  choice: எவரும் ... இழக்கிறவர் ... காப்பாற்றுவார்
  alternative: எவன் ... அவன்
  rationale: கிரேக்கத்தில் இலக்கண ஆண்பால் ஒருமை பொதுப் பிரதிநிதித்துவப் பொருளில் வருகிறது. நவீனத் தமிழில் ‘எவரும்/வர்’ பாலின வரம்பைத் திணிக்காமல் ஒருமைச் சார்பையும் பொதுப் பொருளையும் மரியாதையான, இயல்பான நடையில் காக்கிறது.
- issue: காப்பாற்றுதல்–இழத்தல் என்ற இறையியல் முரண்பாடு
  choice: காப்பாற்றிக்கொள்ள ... இழந்துவிடுவார் / இழக்கிறவர் ... காப்பாற்றுவார்
  alternative: பாதுகாக்க ... இழப்பார் / துறக்கிறவர் ... மீட்படைவார்
  rationale: மூலத்தில் உள்ள σῴζω மற்றும் ἀπόλλυμι ஆகிய வினைகளின் நேரடியான எதிர்மறைத் தொடர்பு காக்கப்பட்டது. ‘துறத்தல்’ அல்லது ‘மீட்படைதல்’ என்று விளக்கி மொழிபெயர்ப்பது கூற்றில் உள்ள உண்மையான பதற்றத்தை முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எவரும்/வர்’ அமைப்பு பொதுப் பொருளை இயல்பாகக் காட்டுகிறது. முதல் மற்றும் கடைசிப் பகுதிகளில் ‘காப்பாற்று’ என்பதைக் காத்ததால் மூலத்தின் முரண்பாடும் சொல்லிணைப்பும் தெளிவாக உள்ளன.
