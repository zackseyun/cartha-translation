source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: ta
  text: அவர் எடுத்துக்கொள்ளப்படுவதற்கான நாட்கள் நிறைவடையும் வேளையில், அவர் எருசலேமுக்குப் போகத் தம் முகத்தை உறுதியாக நிலைநிறுத்தினார்[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் பரமேறுதல்.’ கிரேக்கத்தில் சொல்லுக்கு சொல், ‘அவர் எடுத்துக்கொள்ளப்படுதல்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘தம் முகத்தை உறுதியாக நிலைநிறுத்தினார்’ என்பது உறுதியான தீர்மானத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: தனி வார்த்தைகளாக மொழிபெயர்க்காமல் காலவாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது ஒரு கதைநடை மாற்றச் சூத்திரம். தமிழில் ‘அப்போது நிகழ்ந்தது’ என்று வெளிப்படையாகச் சேர்ப்பது இயல்பற்றதாக இருக்கும்; ‘...போது’ எனத் தொடங்கும் அமைப்பே நிகழ்வு முன்னேறுவதை இயல்பாகக் காட்டுகிறது.
- source_word: ἐν τῷ συμπληροῦσθαι
  choice: நிறைவேறிக்கொண்டிருந்தபோது
  rationale: நிகழ்கால இற infinitive-இன் தொடர்நிலை உணர்வையும், ἐν τῷ அமைப்பின் காலப்பொருளையும் காக்கிறது.
- source_word: τὰς ἡμέρας
  choice: நாட்கள்
  rationale: குறிப்பிட்ட காலப்பகுதி நிறைவை நோக்கிச் செல்வதை மூலத்தின் உருவகத்தோடு நேரடியாகக் காக்கிறது.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: அவர் எடுத்துக்கொள்ளப்படும்
  rationale: ἀνάλημψις என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்ளப்படுதல்’ என்பதை வைத்திருந்து, பரமேறுதலை மட்டும் குறிக்கும் வகையில் பொருளை முன்கூட்டியே சுருக்கவில்லை.
- source_word: καὶ αὐτὸς
  choice: அவர் (வினைமுற்றில் மறைமுகமாகத் தொடர்கிறது)
  rationale: αὐτός தரும் வலியுறுத்தலைத் தமிழில் தனியே ‘அவரே’ என்று இடுவது தேவையற்ற எதிர்மறை ஒப்பீட்டை உருவாக்கலாம்; அடுத்துள்ள உறுதியான செயல்வடிவம் அந்த வலியுறுத்தலைச் சுமக்கிறது.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: தம் முகத்தை உறுதியாக்கினார்
  rationale: உறுதியான தீர்மானத்தைக் குறிக்கும் மூல உருவகத்தை நீக்காமல், தமிழில் புரிந்துகொள்ளக்கூடிய வகையில் தருகிறது.
- source_word: τοῦ πορεύεσθαι
  choice: போக
  rationale: இங்கு நோக்கத்தைக் குறிக்கும் இயல்பான, எளிய தமிழாக்கம்.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: நகரத்தை நோக்கிய திசை அல்லது இலக்கைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἀναλήμψις என்பதன் பொருள் வரம்பு
  choice: ‘எடுத்துக்கொள்ளப்படும்’ என்று விரிவான பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பரமேறும்’ அல்லது ‘பரமேற்றம் அடையும்’
  rationale: இச்சொல் இயேசுவின் பரமேறுதலைக் குறிக்கலாம்; அதேவேளையில் மரணம், உயிர்த்தெழுதல், உயர்த்தப்படுதல் ஆகியவற்றை நோக்கிய மொத்த நகர்வையும் உள்ளடக்கக்கூடிய மொழித் தளர்வை மூலவாசகம் கொண்டுள்ளது. அந்த இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: τὸ πρόσωπον ἐστήρισεν என்ற மரபுத்தொடரின் வலிமை
  choice: ‘தம் முகத்தை உறுதியாக்கினார்’ என்ற உருவகம் காக்கப்பட்டது.
  alternative: ‘உறுதியாகத் தீர்மானித்தார்’
  rationale: இது இயேசுவின் திடமான நோக்கத்தை வெளிப்படுத்துவதோடு, மூலத்தின் தீர்க்கதரிசனத் தொனியுள்ள உருவகத்தையும் காக்கிறது; கூடுதல் கோட்பாட்டுப் பொருள் எதையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எடுத்துக்கொள்ளப்படும்’ மற்றும் ‘தம் முகத்தை உறுதியாக்கினார்’ ஆகிய சற்றே அசாதாரணமான வடிவங்கள் மூலத்தின் திட்டமிட்ட தெளிவின்மையையும் உருவகத்தையும் காக்கின்றன; அவற்றை அடிக்குறிப்புகள் விளக்குகின்றன.
