  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ta
  text: எங்களுடன் இருந்தவர்களில் சிலர் கல்லறைக்குச் சென்று, பெண்கள் சொன்னபடியே இருந்ததைக் கண்டார்கள்; ஆனால் அவரை அவர்கள் காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: சென்றனர்
  rationale: கல்லறையை நோக்கிய இயக்கத்தை எளிய நிகழ்வுரையாகத் தெரிவிக்கிறது; புறப்பட்டுச் சென்றனர் என்பது தேவையற்ற வலியுறுத்தலைச் சேர்க்கும்.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: எங்களுடன் இருந்தவர்களில் சிலர்
  rationale: பேசுகிறவர்களுடன் இருந்த குழுவிலிருந்து சிலரைச் சுட்டும் கிரேக்க அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: கல்லறைக்கு
  rationale: இச்சூழலில் இயேசு அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் சொல்.
- source_word: εὗρον
  choice: கண்டார்கள்
  rationale: εὗρον என்பதன் எளிய நிகழ்வுரைச் செயலைத் தருகிறது; தமிழில் ‘இருப்பதைக் கண்டார்கள்’ என்பது நிலைமை அறிக்கையுடன் இயல்பாக இணைகிறது.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: பெண்கள் சொன்னபடியே இருப்பதை
  rationale: பெண்கள் தெரிவித்த செய்திக்கும் அவர்கள் கண்ட நிலைமைக்கும் இருந்த ஒற்றுமையைத் தெளிவாகச் சொல்கிறது. καί-யின் சேர்க்கை அல்லது வலியுறுத்தல் தனியே மொழிபெயர்க்கப்படாவிட்டாலும் ‘சொன்னபடியே’ என்பதில் ஒப்புமை இயல்பாக வெளிப்படுகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் பிரதிப்பெயரைப் பிரதிப்பெயராகவே வைத்துப் பனுவல் தொடர்ச்சியைக் காக்கிறது; பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: பெண்களின் அறிக்கை உறுதிப்படுத்தப்பட்டதற்கும் இயேசுவைக் காணாததற்கும் இடையிலான மிதமான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: οὐκ εἶδον
  choice: அவர்கள் காணவில்லை
  rationale: ὁράω என்பதன் ‘காணுதல்’ என்ற பொருளைத் துல்லியமாகக் காக்கிறது; ‘கண்டுபிடிக்கவில்லை’ என்று மாற்றவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் நிகழ்வின் சொல்லாக்கம்
  choice: சென்றவர்கள் பெண்கள் தெரிவித்தபடியே கல்லறையின் நிலைமையைக் கண்டனர்; ஆனால் இயேசுவை அவர்கள் காணவில்லை என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இணை நிகழ்வுகளின் தகவல்களைச் சேர்த்து, அவர்கள் கண்டவற்றை விரிவாக விளக்குதல்.
  rationale: கிரேக்க உரை கூறும் உறுதிப்படுத்தலுக்கும் இயேசுவைக் காணாமைக்கும் இடையிலான வேறுபாட்டை மட்டும் காக்கிறது; பிற உயிர்த்தெழுதல் நிகழ்வுகளிலிருந்து ஒத்திசைவு விவரங்களை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நிகழ்வுரை. ‘கல்லறை’, ‘சொன்னபடியே’, ‘காணவில்லை’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் சொற்களாகவும் மூலத்தின் நேர்த்தியைப் பேணுபவையாகவும் உள்ளன.
