source:
  edition: SBLGNT
  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: ta
  text: அவர்கள் பார்வையில் இந்த வார்த்தைகள் அர்த்தமற்ற பேச்சைப்போல் தோன்றின[a]; அவர்கள் அந்தப் பெண்களை நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறும் கட்டுக்கதைபோல்” அல்லது “பிதற்றலைப்போல்.” λῆρος என்ற கிரேக்கச் சொல் பொருளற்றதாக அல்லது அபத்தமாகக் கருதப்படும் பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: தோன்றின
  rationale: ὡσεὶ λῆρος என்பதுடன் வரும் இக்கட்டமைப்பில், இது கண்ணுக்குத் தெரிவதைக் காட்டாமல் அவர்களுடைய மதிப்பீட்டைச் சுட்டுகிறது; ஆகவே ‘தோன்றின’ இயல்பானது.
- source_word: ἐνώπιον αὐτῶν
  choice: அவர்கள் பார்வையில்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்களுக்கு முன்பாக’ என்றாலும், இங்கு கருத்தை மதிப்பிடும் கோணத்தைக் குறிக்கிறது; ‘அவர்கள் பார்வையில்’ அந்த நோக்குநிலையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὡσεὶ λῆρος
  choice: அர்த்தமற்ற பேச்சைப்போல்
  rationale: ὡσεὶ என்பதின் ஒப்புமையையும், λῆρος குறிக்கும் பொருளற்ற அல்லது அபத்தமான பேச்சின் உணர்வையும் பாதுகாக்கிறது.
- source_word: τὰ ῥήματα ταῦτα
  choice: இந்த வார்த்தைகள்
  rationale: மூலத்தின் சுட்டுப்பெயர் அமைப்பை நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἠπίστουν
  choice: நம்பவில்லை
  rationale: இறந்தகாலத்தில் தொடர்ந்த அவநம்பிக்கையைச் சுட்டும் imperfect வடிவத்தை இயல்பான தமிழில் தருகிறது; ‘நம்ப மறுத்தார்கள்’ எனக் கூறுவது மூலத்தில் வெளிப்படையாக இல்லாத மனவுறுதியைச் சேர்த்துவிடும்.
- source_word: αὐταῖς
  choice: அந்தப் பெண்களை
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் உடனடி சூழலில் முன்பு குறிப்பிடப்பட்ட பெண்களைக் குறிக்கிறது. தமிழில் வெறும் ‘அவர்களை’ என்பது வேறு நபர்களைக் குறிக்கக்கூடியதால், குறிப்பைத் தெளிவுபடுத்துகிறது.
