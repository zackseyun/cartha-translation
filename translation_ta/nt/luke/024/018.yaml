source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: ta
  text: அவர்களில் கிளேயோப்பா என்னும் ஒருவர் அவருக்குப் பதிலளித்து, “எருசலேமில் அந்நியராகத் தங்கியிருப்பவர்களில், இந்த நாட்களில் அங்கே நடந்தவற்றை அறியாதவர் நீங்கள் மட்டும்தானா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: அவருக்குப் பதிலளித்து
  rationale: ἀποκριθεὶς நேரடிப் பேச்சை அறிமுகப்படுத்தும் ‘பதிலளித்து’ என்ற பொருளைத் தருகிறது; δέ-யின் மெலிந்த தொடர்ச்சி தமிழ்ச் சொற்றொடரின் ஓட்டத்திலேயே வெளிப்படுகிறது.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: அவர்களில் கிளேயோப்பா என்னும் ஒருவர்
  rationale: εἷς என்பது சூழலில் இரு சீடர்களில் ஒருவரைக் குறிக்கிறது; ὀνόματι என்பது ‘என்னும் பெயருடைய’ எனப் பொருள்படும். இயல்பான தமிழில் ‘அவர்களில் ... என்னும் ஒருவர்’ என்று தரப்பட்டுள்ளது.
- source_word: εἶπεν πρὸς αὐτόν
  choice: என்று கேட்டார்
  rationale: சொல்லுக்குச் சொல் ‘அவரிடம் சொன்னார்’ என்றாலும், கேள்வி வடிவிலான நேரடிப் பேச்சை இயல்பான தமிழில் ‘என்று கேட்டார்’ என்பது தெளிவாக அறிமுகப்படுத்துகிறது; αὐτόν-ன் தொடர்பு முன்புள்ள ‘அவருக்குப்’ என்பதில் காக்கப்படுகிறது.
- source_word: Σὺ μόνος
  choice: நீங்கள் மட்டும்தானா
  rationale: μόνος வலியுறுத்தும் தனித்தன்மையை ‘மட்டும்தானா’ இயல்பாகக் காட்டுகிறது. மரியாதை ஒருமையான ‘நீங்கள்’ உரையாடல் நடைக்கு ஏற்றது.
- source_word: παροικεῖς Ἰερουσαλήμ
  choice: எருசலேமில் அந்நியராகத் தங்கியிருப்பவர்களில்
  rationale: παροικέω என்பது ஓர் இடத்தில் வெளியாளாக அல்லது தற்காலிகக் குடியிருப்பாளராகத் தங்குவதைக் குறிக்கிறது. ‘அந்நியராகத் தங்கியிருப்பவர்’ என்ற மொழிபெயர்ப்பு அந்த வெளியாள் நுண்ணுணர்வை ‘வருகையாளர்’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: οὐκ ἔγνως
  choice: அறியாதவர்
  rationale: அண்மையில் நடந்தவற்றைப் பற்றித் தெரியாமல் இருப்பதைக் குறிக்கும் கேள்விச் சூழலுக்கு ‘அறியாதவர்’ இயல்பான நிகழ்நிலைப் பொருளைத் தருகிறது.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: அங்கே நடந்தவற்றை
  rationale: τὰ γενόμενα என்பது ‘நடந்தவை’; ἐν αὐτῇ என்பது எருசலேமை மீண்டும் சுட்டுவதால் இயல்பான தமிழில் ‘அங்கே’ எனத் தரப்பட்டுள்ளது.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: இந்த நாட்களில்
  rationale: மூலத்தின் காலச் சுட்டலை நெருக்கமாகவும் இயல்பாகவும் காக்கிறது.
