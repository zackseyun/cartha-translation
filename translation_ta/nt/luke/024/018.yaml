translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. παροικεῖς என்பதிலுள்ள வெளியாள்/தற்காலிகத் தங்கல் நுண்ணுணர்வு முதன்மை உரையிலேயே காக்கப்பட்டதால் அடிக்குறிப்பு தேவையில்லை. ‘அவர்களில்’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இருவரைத் தெளிவுபடுத்தும் சூழல்சார் சேர்க்கை.
