lexical_decisions:
- source_word: λέγοντας
  choice: என்று அவர்கள் சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இது நிகழ்காலப் பன்மைப் பங்கேற்புவினை. முந்தைய வசனத்தின் வாக்கியத்துடன் உள்ள தொடர்பைத் தமிழில் இயல்பாகத் தொடரச் செய்கிறது; பன்மை எழுவாயையும் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: நேர்கூற்றைக் குறிக்கும் மேற்கோள் குறிகள்
  rationale: ὅτι இங்கு கூறப்பட்ட செய்தியை அறிமுகப்படுத்துகிறது. தமிழில் நேர்கூற்றாக அமைப்பது இயல்பானது.
- source_word: ὄντως
  choice: உண்மையாகவே
  rationale: உயிர்த்தெழுதல் உண்மையில் நிகழ்ந்தது என்பதை வலியுறுத்தும் உறுதிப்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἠγέρθη
  choice: உயிருடன் எழுப்பப்பட்டார்
  rationale: ἐγείρω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். தமிழில் உயிர்த்தெழுதல் சூழலைத் தெளிவாக்கியபடியே கிரேக்கத்தின் செயப்பாட்டு குரலைப் பாதுகாக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவைக் குறிக்கும் கிறிஸ்துவியல் பட்டப்பெயராக κύριος வருகிறது; நவீனத் தமிழ் வேதாகம நடையில் 'ஆண்டவர்' இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: καὶ
  choice: ;
  rationale: இரண்டு நெருக்கமாக இணைந்த அறிவிப்புகளைத் தமிழில் இயல்பாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; தொடர்பின் கூட்டிணைவு நீடிக்கிறது.
- source_word: ὤφθη
  choice: தோன்றினார்
  rationale: ὁράω என்பதன் செயப்பாட்டு வடிவம் உயிர்த்தெழுந்தவரின் வெளிப்பாட்டைக் குறிக்கும் வழக்கில் உள்ளது. 'தோன்றினார்' என்பது தமிழில் இயல்பாக அதே நிகழ்வைச் சொல்கிறது; சொற்சொல்லான 'காணப்பட்டார்' இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: Σίμωνι
  choice: சீமோனுக்கு
  rationale: கிரேக்கத்தில் உள்ள தனிப்பெயரை மட்டும் வைத்திருக்கிறது; மூலத்தில் இல்லாத 'பேதுரு' என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் குரல்
  choice: உயிருடன் எழுப்பப்பட்டார்
  alternative: உயிர்த்தெழுந்தார்
  rationale: ἠγέρθη செயப்பாட்டு வடிவம் என்பதால், உயிர்த்தெழுதலின் செய்பவரை உரை வெளிப்படையாகக் குறிப்பிடாத நிலையையும் செயப்பாட்டு நுணுக்கத்தையும் பாதுகாக்கிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இந்த உயிர்த்தெழுதல் சூழலில் இது இயேசுவுக்கான பட்டப்பெயர். 'ஆண்டவர்' அதன் கிறிஸ்துவியல் கனத்தையும் தமிழின் கண்ணியமான வழக்கையும் தக்கவைக்கிறது.
- issue: ὤφθη என்பதன் வடிவமும் பொருளும்
  choice: தோன்றினார்
  alternative: காணப்பட்டார்
  rationale: வடிவில் செயப்பாட்டாக இருந்தாலும் உயிர்த்தெழுதல் தோற்றங்களைக் குறிக்கும் கிரேக்க வழக்கில் 'தோன்றினார்' இயல்பான பொருள். இந்த இடத்தில் கடினமான சொற்சொல் செயப்பாட்டைத் திணிக்காமல் பொருளைத் தக்கவைக்கிறது.
