    text: 'அல்லது: “ஆண்டவர் உண்மையாகவே உயிர்த்தெழுந்தார்” அல்லது “ஆண்டவர் மெய்யாகவே உயிர்த்தெழுப்பப்பட்டார்.” கிரேக்க வினை செயப்பாட்டு வடிவில் உள்ளது; முதன்மை உரை அந்த வடிவத்தைப் பாதுகாக்கிறது.'
