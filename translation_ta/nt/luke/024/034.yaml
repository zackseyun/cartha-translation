  register: நவீன, கண்ணியமான பொதுத்தமிழ். வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சி என்பதால் λέγοντας என்பதைத் தனித்த முழுவாக்கியமாக்காமல், இயல்பான தமிழ் மேற்கோள் அமைப்பில் பன்மை எழுவாயுடன் வழங்கப்பட்டுள்ளது.
