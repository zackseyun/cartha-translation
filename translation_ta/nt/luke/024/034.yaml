  language: ta
  text: “ஆண்டவர் உண்மையாகவே உயிர்த்தெழுப்பப்பட்டார்[a]; சீமோனுக்குத் தோன்றினார்!” என்று அவர்கள் சொல்லிக்கொண்டிருந்தார்கள்.
