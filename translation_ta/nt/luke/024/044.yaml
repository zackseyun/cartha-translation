id: LUK.24.44
reference: Luke 24:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: ta
  text: 'பின்பு அவர் அவர்களிடம் சொன்னார்: “நான் இன்னும் உங்களோடு இருந்தபோது உங்களிடம் சொன்ன என் வார்த்தைகள் இவையே: என்னைப் பற்றி[a] மோசேயின் சட்டத்திலும் இறைவாக்கினர்களிலும் திருப்பாடல்களிலும்[b] எழுதப்பட்டுள்ள அனைத்தும்[c] நிறைவேற வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக் குறித்து.”
    reason: lexical_alternative
  - marker: b
    text: “மோசேயின் சட்டம், இறைவாக்கினர்கள், திருப்பாடல்கள்” என்பது இஸ்ரவேலின் வேதநூல்களின் முக்கியப் பிரிவுகளைக் குறிக்கலாம். “திருப்பாடல்கள்” என்பது சங்கீதத் தொகுப்பை மட்டும் குறிக்கலாம்; அல்லது “எழுத்துகள்” எனப்படும் பிரிவை விரிவாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “எழுதப்பட்டுள்ள எல்லாக் காரியங்களும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: பின்பு அவர் அவர்களிடம் சொன்னார்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; ‘பின்பு’ என்பது முரண்பாட்டை மிகைப்படுத்தாமல் இயல்பான தமிழ்நடையைத் தருகிறது. πρός என்பதற்கு ‘அவர்களிடம்’ இயல்பான பேச்சுத் தமிழாகும்.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: என் வார்த்தைகள் இவையே
  rationale: λόγοι என்பதன் நேரடியான பொருளை ‘வார்த்தைகள்’ காக்கிறது; ‘இவையே’ என்ற அமைப்பு சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: உங்களிடம் சொன்ன
  rationale: λαλέω அடிப்படையில் ‘பேசு’ என்றாலும், ஒருவரிடம் கூறிய வார்த்தைகளைக் குறிக்கும் இச்சூழலில் ‘சொன்ன’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: நான் உங்களோடு இருந்தபோதே
  rationale: பங்கேற்புவினையின் காலப் பொருளையும் ἔτι என்பதன் ‘இன்னும்/அப்போதே’ நுண்ணுணர்வையும் ‘இருந்தபோதே’ சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δεῖ πληρωθῆναι
  choice: நிறைவேற வேண்டும்
  rationale: δεῖ குறிக்கும் அவசியத்தையும் πληρόω குறிக்கும் வேதவாக்கு நிறைவேற்றத்தையும் தெளிவாகக் காக்கிறது.
- source_word: πάντα τὰ γεγραμμένα
  choice: எழுதப்பட்டுள்ள அனைத்தும்
  rationale: πάντα என்பதன் முழுமையையும், γεγραμμένα என்ற நிறைவுற்ற செயலின் நிகழ் விளைவையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: மோசேயின் சட்டத்திலும் இறைவாக்கினர்களின் நூல்களிலும் திருப்பாடல்களிலும்
  rationale: மூன்று வேதப்பிரிவுகளைக் குறிக்கும் வாய்ப்பைத் தெளிவாக்க ‘நூல்கள்’ என்பது இறைவாக்கினர்களோடு மட்டும் சேர்க்கப்பட்டுள்ளது; ψαλμοῖς என்பதற்கு மதிப்புமிக்க, பரவலாகப் புரியும் ‘திருப்பாடல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: περὶ ἐμοῦ
  choice: என்னைப் பற்றி
  rationale: περί + genitive குறிக்கும் தொடர்பை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: வேதவாக்குகள் நிறைவேறுவதன் அவசியம்
  choice: ‘நிறைவேற வேண்டும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நிறைவேற இருந்தது’ அல்லது ‘உண்மையாக வேண்டும்’
  rationale: δεῖ தெய்வீக அவசியத்தின் வலிமையைத் தருகிறது; ஆனால் அந்த அவசியம் எவ்வாறு செயல்படுகிறது என்ற கோட்பாட்டை இவ்வசனம் விளக்காததால் மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
- issue: ‘மோசேயின் சட்டம், இறைவாக்கினர்கள், திருப்பாடல்கள்’ என்பவற்றின் அடையாளம்
  choice: வேதத்தின் பெயரிடப்பட்ட தொகுதிகளாக முதன்மை உரையில் வழங்கி, அவற்றின் சரியான எல்லையை அடிக்குறிப்பில் திறந்துவைத்தல்
  alternative: ‘திருப்பாடல்கள்’ என்பதை நேரடியாக ‘எழுத்துகள்’ என விரிவுபடுத்துதல் அல்லது மூன்றையும் பொதுவான நூல் வகைகளாக மட்டும் காட்டுதல்
  rationale: இந்தச் சொற்றொடர் இஸ்ரவேலின் வேதங்களின் முக்கியப் பிரிவுகளைச் சுட்டக்கூடும்; ஆயினும் ψαλμοῖς சங்கீதத் தொகுப்பை மட்டுமா அல்லது எழுத்துகள் பிரிவை விரிவாகவா குறிக்கிறது என்பது உறுதியாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: மொழிநடை நவீன, நிலையான, கண்ணியமான தமிழில் அமைக்கப்பட்டுள்ளது. ‘சட்டம்,’ ‘இறைவாக்கினர்கள்,’ ‘திருப்பாடல்கள்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதத் தொகுதிகள் என்ற சாத்தியத்தைத் தக்கவைக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
