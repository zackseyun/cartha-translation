source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: ta
  text: அவர்கள் போய்க்கொண்டிருந்த கிராமத்தை நெருங்கினார்கள். அவரோ மேலும் தூரம் செல்லப்போகிறவர்போல் நடந்துகொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் தொலைவுக்குப் போவதுபோல் பாவனை செய்தார்”; அல்லது, “மேலும் செல்லப்போவதுபோல் காட்டிக்கொண்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: நெருங்கினார்கள்
  rationale: ἐγγίζω என்பதன் இறந்தகால வினை வடிவம் ஓர் இடத்தை அணுகியதைச் சுட்டுகிறது; “நெருங்கினார்கள்” என்பது இயல்பான நவீனத் தமிழ்.
- source_word: κώμην
  choice: கிராமத்தை
  rationale: κώμη பொதுவாக நகரத்தைவிடச் சிறிய குடியிருப்பைக் குறிக்கிறது; “கிராமம்” அதன் வழக்கமான புதிய ஏற்பாட்டு பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: οὗ ἐπορεύοντο
  choice: தாங்கள் போய்க்கொண்டிருந்த
  rationale: உறவுநிலை வினையடை மற்றும் தொடர்நிலையைக் காட்டும் இறந்தகால வினை அவர்களுடைய பயண இலக்கையும் தொடரும் பயணத்தையும் தெரிவிக்கின்றன.
- source_word: προσεποιήσατο
  choice: போகிறவர்போல் நடந்துகொண்டார்
  rationale: προσποιέομαι இங்கு ஒரு செயலைச் செய்யப்போவதுபோன்ற தோற்றத்தைக் கொடுத்ததைக் குறிக்கிறது; இந்தத் தேர்வு வஞ்சனை என்ற வலுவான முடிவைத் திணிக்காமல் கதையின் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: πορρώτερον
  choice: இன்னும் தொலைவாக
  rationale: ஒப்பீட்டு வினையடை உடல்சார் பயணத்தில் மேலும் தொலைவுக்குச் செல்வதைக் குறிக்கிறது.
- source_word: πορεύεσθαι
  choice: போகிறவர்போல்
  rationale: προσεποιήσατο என்பதுடன் இணையும் வினையெச்சத்தின் வெளிப்படையான செயலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: இயேசுவின் செயலைக் குறிக்கும் προσεποιήσατο என்பதன் மொழிபெயர்ப்பு
  choice: இன்னும் தொலைவாகப் போகிறவர்போல் நடந்துகொண்டார்
  alternative: இன்னும் தொலைவாகப் போவதுபோல் பாவனை செய்தார்
  rationale: கிரேக்கச் சொல் அவர் தொடர்ந்து செல்லப்போவதுபோன்ற தோற்றத்தை அளித்ததாகக் கூறுகிறது. தேர்ந்த சொற்றொடர் ஏமாற்றினார் என்ற வலுவான இறையியல் தீர்ப்பைச் சேர்க்காமல் மூலத்தின் கதைசார் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை. “தாங்கள்” என்பது எழுவாயான சீடர்களையே திரும்பச் சுட்டுகிறது; “அவரோ” என்பது இயேசுவின் மாறுபட்ட செயலைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடரின் பின் வைக்கப்பட்டுள்ளது.
