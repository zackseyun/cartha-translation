revisions:
- from: அவர்கள் தாங்கள் போய்க்கொண்டிருந்த கிராமத்தை நெருங்கினார்கள். அவரோ இன்னும் தொலைவாகப் போகிறவர்போல் நடந்துகொண்டார்.[a]
  to: அவர்கள் போய்க்கொண்டிருந்த கிராமத்தை நெருங்கினார்கள். அவரோ மேலும் தூரம் செல்லப்போகிறவர்போல் நடந்துகொண்டார்.[a]
  rationale: The revision is limited to smoothing and clarifying the final clause. “மேலும் தூரம் செல்லப்போகிறவர்போல்” naturally conveys both the comparative adverb πορρώτερον (“farther”) and the infinitival action πορεύεσθαι (“to continue going”). The footnote preserves legitimate lexical alternatives for προσεποιήσατο without resolving the narrative action into a stronger claim than the Greek states.
