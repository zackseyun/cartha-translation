    text: அல்லது, ‘மரணத் தண்டனைத் தீர்ப்புக்கு’ அல்லது ‘மரணத்திற்குத் தீர்ப்பளிக்கப்படும்படி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரைச் சிலுவையில் அறையச் செய்தனர்.’ இது, மரணதண்டனையை ரோம அதிகாரிகள் நிறைவேற்றியிருந்தாலும் அதற்குத் தலைவர்கள் பொறுப்பானவர்கள் என்பதை வெளிப்படையாக்குகிறது.
    reason: lexical_alternative
  revision_rationale: The unsupported ‘சொன்னார்’ has been removed. ‘எவ்வாறு ... என்பதையும்’ restores the force of ὅπως τε and lets the verse remain a syntactic continuation of the preceding narration. The main text continues to reflect the Greek's direct active attribution (‘அறைந்தார்கள்’) without importing the mediated-agency nuance into the translation itself; that nuance is confined to the alternative footnote.
