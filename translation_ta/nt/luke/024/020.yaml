source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: ta
  text: மேலும், நம்முடைய தலைமைக் குருக்களும் ஆட்சியாளர்களும் அவரை மரணத் தீர்ப்புக்கு ஒப்புக்கொடுத்து, சிலுவையில் அறைந்தார்கள் என்பதையும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως τε
  choice: மேலும் … -தையும்
  rationale: முந்தைய வசனத்தில் தொடங்கிய விவரிப்பைத் தொடரும் இணைப்பையும், நிகழ்ந்த விதத்தை எடுத்துரைக்கும் தொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρέδωκαν
  choice: ஒப்புக்கொடுத்து
  rationale: அதிகாரிகளின் கையில் நீதித்தீர்ப்பிற்காக ஒப்படைத்த செயலைக் குறிக்கிறது; ‘காட்டிக்கொடுத்தனர்’ என்ற குறுகிய துரோகப் பொருளைத் தவிர்க்கிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: அக்கால யூத உயர்குருத்துவத் தலைமைக் குழுவைக் குறிக்கும் பன்மையைத் தெளிவாகவும் வழக்காகவும் தருகிறது.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: நம்முடைய ஆட்சியாளர்கள்
  rationale: ἄρχοντες என்பதிலுள்ள ஆட்சி மற்றும் அதிகாரப் பொருளையும், ἡμῶν என்பதிலுள்ள ‘நம்முடைய’ என்ற அடையாளப்படுத்தலையும் காக்கிறது.
- source_word: εἰς κρίμα θανάτου
  choice: மரணத் தீர்ப்புக்காக
  rationale: κρίμα என்பதன் நீதித்துறைச் சார்ந்த தீர்ப்பு/தண்டனைப் பொருளையும், அதன் விளைவான மரணத்தையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐσταύρωσαν
  choice: சிலுவையில் அறைந்தனர்
  rationale: செயப்படுபொருளுடன் வந்த நேரடி வினையையும் தலைவர்கள்மீது உரை சுமத்தும் பொறுப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவின் மரணதண்டனையில் தலைவர்களின் செயற்பாடு
  choice: அவரைச் சிலுவையில் அறைந்தனர்
  alternative: அவரைச் சிலுவையில் அறையச் செய்தனர்
  rationale: கிரேக்கத்தில் தலைமைக் குருக்களும் ஆட்சியாளர்களும் எழுவாயாக இருந்து செயப்பாட்டு அல்லாத வினை வருகிறது. ரோமர்கள் தண்டனையை நடைமுறைப்படுத்திய வரலாற்றுப் பின்னணி இருந்தாலும், மூலவுரை தலைவர்கள்மீது நேரடியாகச் சுமத்தும் பொறுப்பை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. சட்டப் பின்னணியை ‘மரணத் தீர்ப்பு’ என்பதாலும், மூலத்தின் நேரடி பொறுப்புச் சுமத்தலை ‘சிலுவையில் அறைந்தனர்’ என்பதாலும் காக்கிறது. ‘சொன்னார்’ என்ற சொல் மூலவசனத்தில் இல்லை; முன்வசனத் தொடரை முடிக்க அது தேவையற்ற சேர்க்கையாக இருப்பதால் இறுதி உரையில் தவிர்க்கப்பட வேண்டும்.
