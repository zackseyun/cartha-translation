revisions:
- from: மேலும், நம்முடைய தலைமைக் குருக்களும் ஆட்சியாளர்களும் அவரை மரணத் தீர்ப்புக்காக ஒப்புக்கொடுத்து, அவரைச் சிலுவையில் அறைந்ததையும் சொன்னார்[a][b].
  to: மேலும், நம்முடைய தலைமைக் குருக்களும் ஆட்சியாளர்களும் அவரை மரணத் தீர்ப்புக்கு ஒப்புக்கொடுத்து, சிலுவையில் அறைந்தார்கள் என்பதையும்.
  rationale: The unsupported ‘சொன்னார்’ has been removed. ‘எவ்வாறு ... என்பதையும்’ restores the force of ὅπως τε and lets the verse remain a syntactic continuation of the preceding narration. The main text continues to reflect the Greek's direct active attribution (‘அறைந்தார்கள்’) without importing the mediated-agency nuance into the translation itself; that nuance is confined to the alternative footnote.
