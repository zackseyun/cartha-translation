  text: You are witnesses of these things[a].
translation:
  language: ta
  text: இவற்றுக்கு நீங்கள் சாட்சிகள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவற்றின் சாட்சிகள் நீங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சுட்டுப்பெயர், இயேசு சற்றுமுன் கூறிய நிகழ்வுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: இரண்டாம் நபர் பன்மைச் சுட்டுப்பெயர் மூலத்தில் வெளிப்படையாக இடம்பெற்று வலியுறுத்தலைத் தருகிறது. எழுவாய் பொதுவாக விடப்படக்கூடிய தமிழில் ‘நீங்கள்’ என்பதை வெளிப்படையாகச் சொல்வது அந்த வலியுறுத்தலை இயல்பாகக் காக்கிறது; ‘நீங்களே’ என்பது தேவைக்கு அதிகமான தனிப்படுத்தலை ஏற்படுத்தக்கூடும்.
- source_word: ἐστε
  choice: சாட்சிகள்
  rationale: கிரேக்கத்தின் நிகழ்கால ‘இருக்கிறீர்கள்’ பொருள், தமிழின் இயல்பான பெயர்ப்பயனிலை வாக்கியத்தில் தனி வினைச்சொல் இல்லாமலேயே வெளிப்படுகிறது.
- source_word: μάρτυρες
  choice: சாட்சிகள்
  rationale: இங்கு தாங்கள் கண்டும் கேட்டும் அறிந்த நிகழ்வுகளைப் பற்றி சான்றுரைப்பவர்களைக் குறிக்கிறது. பிற்கால ‘இரத்தசாட்சி’ என்ற தொழில்நுட்பப் பொருளைச் சேர்க்காமல், சூழலுக்கேற்ற பொதுவான சொல் ‘சாட்சிகள்’ ஆகும்.
- source_word: τούτων
  choice: இவற்றுக்கு
  rationale: அருகில் இயேசு கூறிய துன்பம், உயிர்த்தெழுதல், அறிவிப்பு ஆகியவற்றை பன்மைச் சுட்டாகக் குறிக்கிறது. ‘இவற்றுக்கு’ என்பது μάρτυρες உடனான மரபுத்தொடரை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீடர்களின் μάρτυρες என்ற பங்கு
  choice: சற்றுமுன் கூறப்பட்ட நிகழ்வுகளுக்குச் சான்றுரைப்பவர்கள் என்று சீடர்களை அடையாளப்படுத்துதல்
  alternative: பிற்காலக் கிறிஸ்தவப் பயன்பாட்டிலுள்ள ‘இரத்தசாட்சிகள்’ என்ற கருத்தையும் இங்கு உட்பொருளாகக் கொள்ளுதல்
  rationale: உடனடி சூழலில் இயேசுவின் பாடுகள், உயிர்த்தெழுதல், அவற்றைச் சார்ந்த அறிவிப்பு ஆகியவற்றுக்குச் சாட்சி கூறுவதே கருத்து. பிற்காலத்தில் உருவான இரத்தசாட்சி சார்ந்த பொருளை இந்தச் சிறு வாக்கியத்தில் புகுத்தாமல் இருப்பது மூலச் சூழலைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, dignified பெயர்ப்பயனிலை வாக்கியம் பயன்படுத்தப்பட்டுள்ளது. வெளிப்படையான ‘நீங்கள்’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; வாசிப்பில் இயல்பைத் தக்கவைக்க ‘நீங்களே’ தவிர்க்கப்பட்டுள்ளது.
