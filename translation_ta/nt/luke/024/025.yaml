source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: ta
  text: அவர் அவர்களிடம், “அறிவில்லாதவர்களே,[a] தீர்க்கதரிசிகள் கூறிய அனைத்தையும் நம்புவதில் மனம் மந்தமானவர்களே![b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புரிந்துகொள்ளாதவர்களே” அல்லது “மதியற்றவர்களே.”
    reason: lexical_alternative
  - marker: b
    text: நேர்மொழியாக, “இதயத்தில் மந்தமானவர்கள்.” இங்கு “இதயம்” என்பது ஒருவர் நம்புவதற்கான உள்ளார்ந்த மனநிலையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Ὦ
  choice: — (விளி வடிவில் வெளிப்படுத்தப்பட்டது)
  rationale: கிரேக்க இடைச்சொல்லின் நேரடி அழைப்பும் கண்டிப்பின் வலிமையும் தமிழில் ‘அறிவில்லாதவர்களே’ என்ற விளி வடிவால் இயல்பாக வெளிப்படுகின்றன; தனியே ‘ஓ’ சேர்ப்பது இன்றைய தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: ἀνόητοι
  choice: அறிவில்லாதவர்களே
  rationale: இது வெறும் ஒழுக்கக்கேட்டை அல்ல, புரிந்துகொள்ளாமையையும் குறிக்கிறது. விளிப் பன்மை நேரடி கண்டிப்பைப் பாதுகாக்கிறது.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: இதயத்தில் மந்தமானவர்களே
  rationale: ‘இதயம்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, உள்ளார்ந்த புரிதலும் நம்பிக்கையும் தாமதிப்பதை வெளிப்படுத்துகிறது.
- source_word: τοῦ πιστεύειν
  choice: நம்புவதற்கு
  rationale: βραδεῖς என்பதுடன் சேர்ந்துள்ள வினையெச்சக் கருத்தை இயல்பான தமிழில் நோக்கம்/சார்பு வடிவில் தருகிறது.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: சொன்ன அனைத்தையும்
  rationale: தீர்க்கதரிசிகள் உரைத்த முழுச் சாட்சியையும் உள்ளடக்கும் விரிவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐλάλησαν
  choice: சொன்ன
  rationale: இறந்தகால கிரேக்க வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது; சூழலில் தீர்க்கதரிசிகளின் உரையைக் குறிக்கிறது.
- source_word: οἱ προφῆται
  choice: தீர்க்கதரிசிகள்
  rationale: வேதாகமத் தீர்க்கதரிசிகளையும் அவர்களுடைய சாட்சியையும் குறிக்கும் நிலையான, துல்லியமான தமிழ் சொல்.
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: தமிழ் கதைநடைக்கு இயல்பான சொல்வரிசை. வசனத் தொடக்க καί தனியாக மொழிபெயர்க்கப்படாவிட்டாலும், தொடர்ச்சியான கதை இணைப்பு சூழலால் தெளிவாகிறது; αὐτός-க்கு தேவையற்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இயேசுவின் கண்டிப்பின் இயல்பு
  choice: தீர்க்கதரிசிகளின் சாட்சியைப் புரிந்து நம்புவதில் உள்ள குறைபாட்டைச் சுட்டும் கண்டிப்பு
  alternative: முற்றிலும் ஒழுக்கரீதியான கண்டனம் அல்லது வெறும் அறிவுசார் தவறுபுரிதல்
  rationale: ἀνόητοι என்பதுடன் ‘இதயத்தில் மந்தமானவர்கள்’ மற்றும் ‘நம்புதல்’ இணைவதால், புரிதலும் உள்ளார்ந்த நம்பிக்கையும் இரண்டும் கருத்தில் உள்ளன. ‘இதயம்’ மற்றும் ‘நம்புதல்’ ஆகியவற்றை மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் ‘இதயம்’ உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘ஓ’ என்ற செயற்கையான விளிச்சொல்லுக்குப் பதிலாக தமிழ் விளி விகுதி பயன்படுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
