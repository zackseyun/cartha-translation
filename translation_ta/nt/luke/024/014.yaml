  source_fidelity: முதன்மை உரை உரையாடலின் தொடர்ச்சியான இறந்தகாலத்தையும் (ὡμίλουν), பரஸ்பரத் தன்மையையும் (πρὸς ἀλλήλους), ஏற்கெனவே நிகழ்ந்த எல்லா நிகழ்வுகளையும் (πάντων τῶν συμβεβηκότων τούτων) சரியாகக் குறிக்கிறது. ஆயினும் ‘நடந்திருந்த இவை அனைத்தையும்’ என்ற சொல் வரிசை நவீன தமிழில் இயல்பற்றது; ‘நடந்திருந்த’ என்பது இங்கு தேவையற்ற முன்னிறைவு நுட்பத்தையும் உணர்த்தலாம். கிரேக்க perfect participle-இன் நிறைவடைந்த நிகழ்வு பொருளுக்கு ‘நிகழ்ந்த’ போதுமானது.
