    reason: 'சொல்லாக்க மாற்று: ὡμίλουν என்பதற்கு ‘உரையாடிக்கொண்டிருந்தார்கள்’ என்றும், τῶν συμβεβηκότων τούτων என்பதற்கு ‘நிகழ்ந்த இந்த நிகழ்வுகள்’ என்றும் மொழிபெயர்க்கலாம்.'
