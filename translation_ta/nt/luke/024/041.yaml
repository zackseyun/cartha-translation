reference: Luke 24:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: ta
  text: அவர்கள் மகிழ்ச்சியினால் இன்னும் நம்ப முடியாமல் வியந்துகொண்டிருந்தபோது[a], அவர் அவர்களிடம், “சாப்பிடுவதற்கு இங்கே ஏதாவது இருக்கிறதா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மகிழ்ச்சியினால் இன்னும் நம்பாமல் ஆச்சரியப்பட்டுக்கொண்டிருந்தபோது.”
    reason: ἀπιστούντων என்பதை ‘நம்ப முடியாமல்’ என்ற சூழல்சார் நுணுக்கத்துடனோ, இன்னும் நேரடியாக ‘நம்பாமல்’ என்றோ மொழிபெயர்க்கலாம்; θαυμαζόντων என்பதற்கும் ‘வியந்து’ அல்லது ‘ஆச்சரியப்பட்டு’ என்பது சாத்தியம்.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: இன்னும் ... கொண்டிருந்தபோது
  rationale: ἔτι தொடரும் நிலையைக் குறிக்கிறது; δέ இங்கு மென்மையான தொடரிணைப்பாக இருப்பதால், தமிழில் தனியே வலியுறுத்தாமல் காலநிலைத் தொடரால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἀπιστούντων
  choice: நம்ப முடியாமல்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்நிலையையும், சூழலில் காணப்படும் தற்காலிகமான நம்ப இயலாமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; உறுதியான மறுப்பாக மாற்றவில்லை.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: மகிழ்ச்சியினால்
  rationale: ἀπό இங்கு காரணத்தைச் சுட்டுகிறது. அவர்களுடைய மகிழ்ச்சியே நிகழ்ந்ததை நம்ப இயலாத அளவுக்கு இருந்தது என்ற முரண்பாட்டை இந்தத் தேர்வு காக்கிறது.
- source_word: θαυμαζόντων
  choice: வியந்துகொண்டிருந்தபோது
  rationale: தொடர்ந்த வியப்பையும் ஆச்சரியத்தையும் குறிக்கும் பங்கேற்புச் சொல்லின் நிகழ்நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: Ἔχετέ
  choice: இருக்கிறதா
  rationale: உடமையைக் கேட்கும் கிரேக்க வினாவை, தமிழில் அந்த இடத்தில் உணவு கிடைப்பதை விசாரிக்கும் இயல்பான கேள்வியாக வழங்குகிறது.
- source_word: τι
  choice: ஏதாவது
  rationale: கேள்வியில் வரும் வரையறையற்ற சுட்டுப்பெயருக்கு இயல்பான தமிழ் இணை.
- source_word: βρώσιμον
  choice: சாப்பிடுவதற்கு
  rationale: ‘உண்ணத்தக்கது’ என்ற அடிப்படைப் பொருளை அன்றாட, தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνθάδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் வினையடையின் நேரான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவைப் பார்த்த சீடர்களின் எதிர்வினையின் தன்மை
  choice: மிகுந்த மகிழ்ச்சியால் அவர்கள் இன்னும் நம்ப முடியாமல் வியந்துகொண்டிருந்தனர்.
  alternative: அவர்கள் இன்னும் நம்பாமல் இருந்தனர்; இதை வெறும் சந்தேகம் அல்லது அவநம்பிக்கை எனப் புரிந்துகொள்ளலாம்.
  rationale: ἀπιστούντων ... ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων என்பது மகிழ்ச்சி, நம்ப இயலாமை, வியப்பு ஆகியவை ஒன்றாக இருந்த சிக்கலான உணர்ச்சிநிலையைச் சித்தரிக்கிறது. மொழிபெயர்ப்பு இதை கடினமான அவநம்பிக்கையாகவும் முழுமையான நம்பிக்கையாகவும் ஒருதலைப்பட்சமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நம்ப முடியாமல்’ என்பது மகிழ்ச்சியால் ஏற்பட்ட தற்காலிக நம்ப இயலாமையை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு மேலும் நேரடியான மாற்றைத் தருகிறது.
