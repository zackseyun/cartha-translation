  source_fidelity: 'மூலத்தின் தொடர்நிலையைக் காட்டும் இரண்டு நிகழ்காலப் பங்கேற்புச் சொற்களும் இயல்பாகக் காக்கப்பட்டுள்ளன: அவர்கள் மகிழ்ச்சியால் இன்னும் நம்ப இயலாமல், வியப்பில் இருந்தனர். “மகிழ்ச்சியினால்” ἀπὸ τῆς χαρᾶς என்பதன் காரணப் பொருளைச் சரியாகத் தருகிறது; “இங்கே ஏதாவது இருக்கிறதா?” Ἔχετέ τι βρώσιμον ἐνθάδε; என்பதன் திறந்த கேள்வியையும் இடக்குறிப்பையும் வெளிப்படுத்துகிறது.'
