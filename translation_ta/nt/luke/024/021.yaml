id: LUK.24.21
reference: Luke 24:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: ta
  text: ஆனால், இஸ்ரவேலை மீட்கப்போகிறவர் இவர்தான் என்று நாங்கள் நம்பிக்கையோடு எதிர்பார்த்திருந்தோம்.[a][b] அதுமட்டுமல்லாமல், இவை நிகழ்ந்து இன்று மூன்றாம் நாள் ஆகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவர்தான் இஸ்ரவேலை மீட்கவிருந்தவர் என்று நாங்கள் நம்பிக்கையோடு எதிர்பார்த்திருந்தோம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் கடந்தகால எதிர்பார்ப்பின் உள்ளடக்கத்திற்குள் ‘இருக்கிறார்’ என்ற நிகழ்கால வினை வடிவம் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘இஸ்ரவேலை மீட்க’ என்பது விரிவான மேசிய விடுதலை எதிர்பார்ப்பைக் குறிக்கலாம். அது அரசியல் விடுதலையா, ஆன்மிக இரட்சிப்பா, அல்லது இரண்டுமா என்பதை இவ்வசனம் குறிப்பாக வரையறுக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: ஆனால், ... நாங்கள்
  rationale: δέ தரும் முந்தைய கூற்றுடனான மாறுபாட்டையும், ἡμεῖς என்ற வலியுறுத்தப்பட்ட எழுவாயையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἠλπίζομεν
  choice: நம்பிக்கையோடு எதிர்பார்த்திருந்தோம்
  rationale: இறந்தகாலத்தில் தொடர்ந்திருந்த, இப்போது ஏமாற்றமடைந்த எதிர்பார்ப்பை imperfect வினைக்காலத்துக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι
  choice: இஸ்ரவேலை மீட்கப்போகிறவர் இவர்தான் என்று
  rationale: ἐστιν என்ற நிகழ்கால வடிவத்தைத் தமிழின் மேற்கோள்-உள்ளடக்க அமைப்பில் ‘இவர்தான்’ என்று காத்து, μέλλων என்பதன் எதிர்நோக்கிய செயலை ‘மீட்கப்போகிறவர்’ எனத் தருகிறது.
- source_word: λυτροῦσθαι
  choice: மீட்க
  rationale: விடுவித்தல், மீட்பு, உடன்படிக்கை சார்ந்த மேசிய எதிர்பார்ப்பு ஆகிய பரப்புகளைச் சுருக்காமல் காக்கும் சொல்.
- source_word: τὸν Ἰσραήλ
  choice: இஸ்ரவேலை
  rationale: உடன்படிக்கை மக்களை ஒருமொத்தமாகக் குறிக்கும் நேரடி பெயரைப் பாதுகாக்கிறது.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: இவை எல்லாவற்றுக்கும் மேலாக
  rationale: ஏற்கெனவே கூறியவற்றோடு மேலும் ஒரு மனச்சோர்வூட்டும் அம்சத்தைச் சேர்க்கும் கூட்டுத்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: இன்று மூன்றாம் நாள் ஆகிறது
  rationale: காலம் எட்டிய நிலையைச் சுட்டும் கிரேக்க வழக்கைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: இவை நிகழ்ந்து
  rationale: நிகழ்வுகளிலிருந்து காலம் கணக்கிடப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலை மீட்க’ என்பதிலுள்ள மேசிய எதிர்பார்ப்பின் தன்மை
  choice: மீட்பை அரசியல் விடுதலை அல்லது ஆன்மிக இரட்சிப்பு என்று குறிப்பிட்டுச் சுருக்காமல் ‘இஸ்ரவேலை மீட்க’ என வைத்தல்
  alternative: இஸ்ரவேலை அரசியல் ரீதியாக விடுவிக்க / இஸ்ரவேலை ஆன்மிகமாக இரட்சிக்க
  rationale: சொற்றொடர் விரிவான மேசிய விடுதலை எதிர்பார்ப்பைக் குறிக்க முடியும்; அதன் முறையை வசனம் வரையறுக்காததால் உள்ள இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ἠλπίζομεν என்பதற்குப் பின் வரும் ἐστιν + μέλλων இன் காலநிலை
  choice: ‘இவர்தான் ... மீட்கப்போகிறவர்’ என்று நம்பிக்கையின் உள்ளடக்கத்தில் நிகழ்கால/எதிர்நோக்கு உணர்வைக் காத்தல்
  alternative: ‘இவர்தான் ... மீட்கவிருந்தவர்’ என்று முழுவதும் இறந்தகாலத்துக்கு மாற்றுதல்
  rationale: கிரேக்கத்தில் கடந்தகால நம்பிக்கைக்குள் நிகழ்கால ἐστιν நிலைத்திருக்கிறது. தமிழ் மறைமுகக் கூற்றில் ‘இவர்தான்’ இதை இயல்பாகக் காக்கிறது; சூழல் ஏமாற்றத்தைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘நம்பிக்கையோடு எதிர்பார்த்திருந்தோம்’ என்பது தொடர்ந்த கடந்தகால நம்பிக்கையைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறிகள் தொடர்புடைய கூற்றுகளின் உடனேயே வைக்கப்பட்டுள்ளன.
