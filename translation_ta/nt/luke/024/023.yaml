source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: ta
  text: அவருடைய உடலைக் காணாமல், அவர்கள் வந்து, தேவதூதர்களின் தரிசனத்தையும் தாங்கள் கண்டதாகவும், அந்தத் தேவதூதர்கள் அவர் உயிரோடு இருக்கிறார் என்று கூறுவதாகவும் சொன்னார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'குறைவான வாய்ப்புள்ள மற்றொரு இலக்கணப் புரிதல்: “அவருடைய உடலைக் காணாமல், அவர்கள் வந்து, தேவதூதர்களின் தரிசனத்தையும் தாங்கள் கண்டதாகவும், அவர் உயிரோடு இருக்கிறார் என்று தாங்களே கூறுவதாகவும் சொன்னார்கள்.” இவ்வாறு எடுத்தால், “கூறுகிறவர்கள்” என்பது தேவதூதர்களை அல்ல, பெண்களைக் குறிக்கும்.'
    reason: alternative_reading
  - marker: b
    text: “தேவதூதர்களின் தரிசனத்தைக்கூடத் தாங்கள் கண்டதாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: காணாமல்
  rationale: இறந்தகாலப் பெண்பால் பன்மை வினையெச்சம் பெண்களைக் குறிக்கிறது; μή என்னும் மறுப்பையும் இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸ σῶμα αὐτοῦ
  choice: அவருடைய உடலை
  rationale: அடக்கம் மற்றும் உயிர்த்தெழுதல் பற்றிய சூழலில் σῶμα என்பதன் இயல்பான பொருள் ‘உடல்’.
- source_word: ἦλθον λέγουσαι
  choice: அவர்கள் வந்து ... சொன்னார்கள்
  rationale: ἦλθον என்பதன் நேர்ப்பொருளான ‘வந்தார்கள்’ பாதுகாக்கப்படுகிறது; λέγουσαι தமிழில் இயல்பாக முதன்மை வினையோடு இணைக்கப்படுகிறது.
- source_word: καὶ
  choice: -யும்
  rationale: காணாமல் போன உடலைப் பற்றிய செய்தியுடன் கூடுதலாகத் தரிசனச் செய்தியும் இருந்ததை, உயர்த்திக் காட்டும் καί-இன் வலிமையை இயல்பான தமிழ் இணைப்பும்மை வெளிப்படுத்துகிறது.
- source_word: ὀπτασίαν ἀγγέλων
  choice: தேவதூதர்களின் தரிசனம்
  rationale: ὀπτασία இயற்கைக்கு அப்பாற்பட்ட காட்சி அல்லது தரிசனத்தைக் குறிக்கிறது; ‘தரிசனம்’ dignified and current biblical Tamil while not over-explaining the phenomenon.
- source_word: ἑωρακέναι
  choice: தாங்கள் கண்டதாக
  rationale: λέγουσαι-க்குப் பின்வரும் மறைமுகக் கூற்றின் நிறைவுற்ற செயலை இயல்பான தமிழில் ‘கண்டதாக’ வெளிப்படுத்துகிறது.
- source_word: οἳ λέγουσιν
  choice: அந்தத் தேவதூதர்கள் ... கூறுகிறார்களாம்
  rationale: ஆண்பால் பன்மையான οἳ அருகிலுள்ள ἀγγέλων என்பதையே இயல்பாகக் குறிக்கிறது; நிகழ்கால λέγουσιν ‘கூறுகிறார்கள்’ எனப் பாதுகாக்கப்பட்டு, முழுக் கூற்றும் மறைமுகச் செய்தி என்பதால் ‘-ஆம்’ சேர்க்கப்படுகிறது.
- source_word: αὐτὸν ζῆν
  choice: அவர் உயிரோடு இருக்கிறார்
  rationale: கிரேக்க இறந்தெச்சக் கட்டமைப்பை தமிழில் இயல்பான உட்பொருள் வாக்கியமாக்குகிறது; ‘உயிரோடு இருக்கிறார்’ என்பது உயிர்த்தெழுதல் சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: οἳ λέγουσιν என்ற தொடர்புப்பெயரின் முன்னிலை
  choice: ‘கூறுகிறவர்கள்’ என்பது தேவதூதர்களைக் குறிக்கிறது.
  alternative: அது பெண்களைக் குறிக்கிறது என்று கொண்டு, ‘அவர் உயிரோடு இருப்பதாக அவர்களே கூறினார்கள்’ என மொழிபெயர்க்கலாம்.
  rationale: ஆண்பால் பன்மையான οἳ என்பதற்கு மிக அருகிலுள்ள, இலக்கணத்துக்கு இயைந்த முன்னிலை ἀγγέλων (‘தேவதூதர்கள்’); இது உடனடி கதைச்சூழலுக்கும் பொருந்துகிறது. குறைவான வாய்ப்புள்ள மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டது. ‘தேவதூதர்’, ‘தரிசனம்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள். கிரேக்கத்தின் நீண்ட மறைமுகக் கூற்றை தமிழில் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டது; இருப்பினும் செய்தியின் படிநிலையும் நிகழ்காலமான ‘கூறுகிறார்கள்’ என்பதும் காக்கப்பட்டன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
