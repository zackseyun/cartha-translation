- from: பின்பு அவர் அவர்களைப் பெத்தானியா வரை[a] அழைத்துச் சென்றார்; தம் கைகளை உயர்த்தி அவர்களை ஆசீர்வதித்தார்.
  to: பின்பு அவர் அவர்களை வெளியே அழைத்துச் சென்று பெத்தானியா வரை[a] வழிநடத்தினார்; தம் கைகளை உயர்த்தி அவர்களை ஆசீர்வதித்தார்.
