source:
  edition: SBLGNT
  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: ta
  text: பின்பு அவர் அவர்களை வெளியே அழைத்துச் சென்று பெத்தானியா வரை[a] வழிநடத்தினார்; தம் கைகளை உயர்த்தி அவர்களை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெத்தானியாவுக்கு’ அல்லது ‘பெத்தானியாவுக்கு அருகில்’; கிரேக்கச் சொற்றொடரைச் சொல் நெருக்கமாக மொழிபெயர்த்தால், ‘பெத்தானியாவை நோக்கி, அந்த இடம் வரையில்’ எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: அழைத்துச் சென்றார்
  rationale: ἐξάγω என்பது ஒருவரை வெளியே வழிநடத்திச் செல்வதையோ அழைத்துச் செல்வதையோ குறிக்கிறது. தமிழ் நடையில் ‘அழைத்துச் சென்றார்’ இயல்பாக இருந்து, வெளியே கொண்டுசெல்லும் திசைநோக்கிய பொருளைச் சூழல் தெளிவாக்குகிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: இங்கு δέ முரண்பாட்டைக் காட்டாமல் கதையின் அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘பின்பு’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἕως πρὸς Βηθανίαν
  choice: பெத்தானியா வரை
  rationale: ἕως πρός என்ற விரிவான சொற்றொடர் பெத்தானியாவின் திசையில் அதன் எல்லை அல்லது அண்மைப் பகுதி வரையிலான நகர்வைக் குறிக்கலாம். ‘பெத்தானியா வரை’ முதன்மைப் பொருளைத் தெளிவாக வழங்குகிறது; உள்ளார்ந்த இடவியல் நுட்பம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: Βηθανίαν
  choice: பெத்தானியா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: தம் கைகளை உயர்த்தி
  rationale: முதன்மை வினைக்கு முன்னதாக அல்லது அதனுடன் இணைந்து நிகழும் செயலை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது. ‘தம்’ என்பது எழுவாயாகிய இயேசுவையே தெளிவாகச் சுட்டுகிறது; ‘கைகள்’ என்ற பன்மையும் காக்கப்படுகிறது.
- source_word: εὐλόγησεν αὐτούς
  choice: அவர்களை ஆசீர்வதித்தார்
  rationale: εὐλογέω இங்கு சீடர்கள்மேல் ஆசீர்வாதம் வழங்கும் செயலைக் குறிக்கிறது. கூடுதல் சடங்கு அல்லது சமயப் பதவிசார் கருத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசு சீடர்களை ஆசீர்வதித்த செயலின் இயல்பு
  choice: ‘அவர்களை ஆசீர்வதித்தார்’ என்ற எளிய வினைத் தொடரைத் தக்கவைத்தல்
  alternative: ‘அவர்கள்மேல் ஆசீர்வாதம் கூறினார்’
  rationale: உயர்த்திய கைகளுடன் இயேசு செய்த ஆசீர்வாதச் செயலை மூலவாக்கியம் நேரடியாகக் கூறுகிறது. அதை ஒரு குறிப்பிட்ட பிற்காலச் சடங்காக விரிவாக்காமலும் வெறும் நல்வாழ்த்தாகக் குறுக்காமலும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’, ‘தம்’ ஆகிய வடிவங்கள் சூழலுக்கு ஏற்ற கண்ணியத்தைத் தருகின்றன; மூலத்தின் இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
