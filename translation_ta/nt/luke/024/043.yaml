  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: ta
  text: அதை எடுத்து, அவர்கள் முன்னிலையில் சாப்பிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘எடுத்து, சாப்பிட்டார்’ என்று மட்டுமே உள்ளது; செயப்படுபொருள் முந்தைய வசனத்தில் சொல்லப்பட்ட மீன் துண்டு என்பதால் இங்கே ‘அதை’ என்று பொருள் கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல் இன்றி)
  rationale: முந்தைய வசனத்துடன் உள்ள தொடர்ச்சியைத் தமிழில் வாக்கிய ஓட்டமே இயல்பாகக் காட்டுகிறது; ‘மேலும்’ அல்லது ‘பின்பு’ என்று சேர்ப்பது கிரேக்கத்தில் இல்லாத வலியுறுத்தலையோ காலவரிசையையோ ஏற்படுத்தலாம்.
- source_word: λαβὼν
  choice: எடுத்து
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முன்நிகழ் செயலை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது. அதன் பொருள் முந்தைய வசனத்திலுள்ள மீன் துண்டு என்பதால் ‘அதை’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: ἐνώπιον αὐτῶν
  choice: அவர்கள் முன்னிலையில்
  rationale: அவர் சாப்பிட்டதை அவர்கள் நேரில் காணும் விதத்தில் நிகழ்ந்தது என்ற பொருளைத் தெளிவாகவும் கண்ணியமான நவீன தமிழிலும் தருகிறது.
- source_word: ἔφαγεν
  choice: சாப்பிட்டார்
  rationale: நிறைவேறிய நிகழ்வை இயல்பான தமிழில் குறிக்கிறது; இயேசுவுக்குரிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. வினையின் மறைபொருள் ‘அதை’ ஏற்கெனவே முன்வினையுடன் சொல்லப்பட்டதால் மீண்டும் கூறப்படவில்லை.
theological_decisions:
- issue: கிரேக்கத்தில் வெளிப்படையாக இல்லாத நேரடிச் செயப்படுபொருளைத் தமிழில் குறிப்பிடலாமா
  choice: முந்தைய வசனத்திலிருந்து ‘அதை’ என்று ஒருமுறை வெளிப்படுத்தப்பட்டது
  alternative: எடுத்து, அவர்கள் முன்னிலையில் சாப்பிட்டார்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் சூழலிலிருந்து புரிகிறது. தமிழிலும் அதை முற்றிலும் விட முடியும்; எனினும் ‘அதை’ என்று ஒருமுறை குறிப்பிடுவது செயலைத் தெளிவாக்குகிறது, புதிய தகவலைச் சேர்ப்பதில்லை. உயிர்த்தெழுந்த இயேசு சீடர்களின் முன்னிலையில் உணவைச் சாப்பிட்டார் என்ற உரையின் சாட்சியத் தன்மையை மட்டும் காக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘அவர்கள் முன்னிலையில்’ என்பது ἐνώπιον αὐτῶν என்பதன் நேரில் காணத்தக்க நிகழ்வைக் காட்டுகிறது. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
