  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: ta
  text: அப்போது வேதவாக்கியங்களைப் புரிந்துகொள்ளும்படி அவர்களுடைய மனங்களை அவர் திறந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான, சுருக்கமான காலவினையடை.
- source_word: διήνοιξεν
  choice: திறந்தார்
  rationale: διανοίγω என்பதன் நேரடியான உருவகத்தைப் பேணுகிறது; வெறுமனே ‘புரிந்துகொள்ளச் செய்தார்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: αὐτῶν τὸν νοῦν
  choice: அவர்களுடைய மனதை
  rationale: νοῦς என்பது புரிந்துகொள்ளும் அல்லது உணரும் திறனைக் குறிக்கிறது. கிரேக்கத்தின் ஒருமை கூட்டுப்பொருளைத் தமிழிலும் இயல்பாகப் பேணி, ‘திறந்தார்’ என்ற உருவகத்துடன் இணைக்கிறது.
- source_word: τοῦ συνιέναι
  choice: புரிந்துகொள்ளும்படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கக்கூடிய articular infinitive-ஐ இயல்பான தமிழில் தருகிறது; இரண்டிற்கிடையிலான நுட்பமான தெளிவின்மையை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: τὰς γραφάς
  choice: வேதவாக்கியங்களை
  rationale: இச்சூழலில் γραφαί இஸ்ரவேலின் புனித எழுத்துகளைக் குறிக்கிறது; நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் ‘வேதவாக்கியங்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: இயேசு அவர்களுடைய புரிதலைத் திறந்த செயலின் இயல்பு
  choice: ‘அவர்களுடைய மனதை அவர் திறந்தார்’ என்ற நேரடி உருவகத்தைப் பேணுதல்
  alternative: ‘அவர்கள் புரிந்துகொள்ள அவர் உதவினார்’ அல்லது ‘வேதவாக்கியங்களை அவர்களுக்கு விளக்கினார்’
  rationale: கிரேக்கம் இயேசு அவர்களுடைய மனதைத் திறந்தார் என்று நேரடியாகக் கூறுகிறது. கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும், அதை வெறும் போதனை அல்லது விளக்கமாகக் குறைக்காமலும் அந்த இறையியல் கூற்றைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘மனதைத் திறந்தார்’ என்ற மூல உருவகம் பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முதன்மை உரையின் முடிவில் இடம்பெற்றுள்ளது.
