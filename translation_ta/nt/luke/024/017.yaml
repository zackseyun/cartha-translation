translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பேச்சுகள்’ மற்றும் ‘பரிமாறிக்கொள்ளும்’ என்பவை மூலத்தின் பரஸ்பர உரையாடல் நுணுக்கத்தைத் தக்கவைக்கின்றன. SBLGNT-இல் ἐστάθησαν அருகிலுள்ள உரைவேறுபாட்டு குறியீடு காரணமாக வெளியீட்டுத் தெளிவுக்காக அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
