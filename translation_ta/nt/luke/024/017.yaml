id: LUK.24.17
reference: Luke 24:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் நடந்துகொண்டிருக்கும்போது ஒருவரோடு ஒருவர் பேசிக்கொள்ளும் இந்த வார்த்தைகள் என்ன?” என்று சொன்னார். அவர்கள் சோகமான முகத்துடன் நின்றுவிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: அவர் அவர்களிடம் ... என்று கேட்டார்
  rationale: λέγω என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், நேரடியான கேள்வியை அறிமுகப்படுத்தும் இவ்விடத்தில் நவீனத் தமிழில் ‘என்று கேட்டார்’ என்பது இயல்பாகவும் பொருளை மிகைப்படுத்தாமலும் உள்ளது; δέ தனியே மொழிபெயர்க்கப்படாமல் கதை ஓட்டில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: இந்தப் பேச்சுகள் என்ன?
  rationale: λόγοι என்பதன் நேரடிப் பொருள் ‘வார்த்தைகள்’; ஆனால் இங்கு அவர்கள் பரிமாறிக்கொள்ளும் உரையாடல் அல்லது பேச்சுப் பொருளைக் குறிக்கிறது. ‘இந்தப் பேச்சுகள்’ என்பது பன்மையையும் சூழலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: ஒருவரோடு ஒருவர் பரிமாறிக்கொள்ளும்
  rationale: ἀντιβάλλω பரஸ்பரம் முன்னும் பின்னும் சொற்களைப் பரிமாறும் செயலைக் குறிக்கிறது. ‘பரிமாறிக்கொள்ளும்’ என்பது அந்த இருவழித் தன்மையைத் தக்கவைக்கிறது; ‘விவாதிக்கும்’ என மொழிபெயர்த்து கருத்து மோதலைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: περιπατοῦντες
  choice: நடந்துகொண்டே
  rationale: இந்த நிகழ்காலப் பங்கேற்புவினை, உரையாடலும் நடப்பதும் ஒரே நேரத்தில் நிகழ்வதைக் காட்டுகிறது. ‘நடந்துகொண்டே’ அதனைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐστάθησαν
  choice: அங்கேயே நின்றுவிட்டார்கள்
  rationale: இங்கு ἵστημι அவர்கள் நடப்பதை நிறுத்தி நின்றதைக் குறிக்கிறது. ‘நின்றுவிட்டார்கள்’ அந்த நிகழ்வுமாற்றத்தைக் காட்டுகிறது; ‘அங்கேயே’ என்பது தமிழில் நிறுத்தத்தின் உணர்வை இயல்பாக்குகிறது.
- source_word: σκυθρωποί
  choice: சோகமான முகத்துடன்
  rationale: σκυθρωπός வெறும் உள்ளார்ந்த சோகத்தை அல்லாமல் முகத்தில் தெரியும் சோகமான அல்லது வாட்டமான தோற்றத்தைக் குறிக்கிறது. ‘சோகமான முகத்துடன்’ அந்தக் காட்சிப்புல நுணுக்கத்தைக் காக்கிறது.
