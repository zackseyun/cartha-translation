revisions:
- from: அவர் அவர்களிடம், “நீங்கள் நடந்துகொண்டே ஒருவரோடு ஒருவர் பரிமாறிக்கொள்ளும் இந்தப் பேச்சுகள் என்ன?” என்று கேட்டார். அவர்கள் சோகமான முகத்துடன் அங்கேயே நின்றுவிட்டார்கள்.[a]
  to: அவர் அவர்களிடம், “நீங்கள் நடந்துகொண்டிருக்கும்போது ஒருவரோடு ஒருவர் பேசிக்கொள்ளும் இந்த வார்த்தைகள் என்ன?” என்று சொன்னார். அவர்கள் சோகமான முகத்துடன் நின்றுவிட்டார்கள்.
  rationale: 'The revision follows the SBLGNT text directly: εἶπεν is rendered ‘சொன்னார்’; λόγοι and ἀντιβάλλετε πρὸς ἀλλήλους are represented as ‘ஒருவரோடு ஒருவர் பேசிக்கொள்ளும் இந்த வார்த்தைகள்’; περιπατοῦντες is retained with ‘நடந்துகொண்டிருக்கும்போது’; and ἐστάθησαν σκυθρωποί is rendered ‘சோகமான முகத்துடன் நின்றுவிட்டார்கள்.’ The unsupported textual-variant footnote is removed.'
  reviewer_model: gpt-5.6-terra
