base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: ta
  text: “என் கைகளையும் கால்களையும் பாருங்கள்; நானேதான்.[a] என்னைத் தொட்டுப் பாருங்கள்.[b] நீங்கள் என்னிடம் சதையும் எலும்புகளும் இருப்பதைக் காண்பதுபோல், ஓர் ஆவிக்கு அவை இருப்பதில்லை.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கைகளையும் கால்களையும் பாருங்கள்; ஏனெனில் நானேதான்.” கிரேக்கத் தொடர் தனிப்பட்ட அடையாளத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “என்னைத் தொட்டு உணருங்கள்” அல்லது “என்னைத் தடவிப் பாருங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “ஒரு பேய்க்கு” என்றும் பொருள் கொள்ளலாம்; கிரேக்கச் சொல் நேரடியாக “ஆவி” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: பாருங்கள்
  rationale: உடனடியாகக் கண்ணால் பார்த்து உறுதிப்படுத்தும்படி கூறும் பன்மை கட்டளை. நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: என் கைகளையும் கால்களையும்
  rationale: உடல் சார்ந்த சொற்களை நேரடியாக மொழிபெயர்க்கிறது; உயிர்த்தெழுந்தவர் அதே இயேசுதான் என்பதை நேரில் உறுதிப்படுத்தும் சூழலைக் காக்கிறது.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: இது நானேதான் என்று தெரிந்துகொள்ளுங்கள்
  rationale: ἐγώ மற்றும் αὐτός தரும் தனிப்பட்ட அடையாள வலியுறுத்தலை ‘நானேதான்’ காக்கிறது. ‘தெரிந்துகொள்ளுங்கள்’ என்பது தமிழில் வாக்கியத் தொடர்பை இயல்பாக்குவதற்கான வெளிப்படுத்தப்பட்ட உட்பொருள்; ὅτι-யை காரணப்பொருளில் கொள்ளும் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ψηλαφήσατέ με
  choice: என்னைத் தொட்டுப் பாருங்கள்
  rationale: தொட்டு அல்லது கையால் உணர்ந்து சரிபார்ப்பதைக் குறிக்கிறது. ‘தொட்டுப் பாருங்கள்’ என்பது பார்வை மற்றும் தொடுதல் வழியான உறுதிப்படுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πνεῦμα
  choice: ஓர் ஆவி
  rationale: மூலச்சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது. சூழலில் உடலற்ற ஓர் உயிர்நிலையைச் சுட்டுகிறது; ‘பேய்’ என்ற பண்பாட்டுச் சுமையுள்ள சொல்லை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: σάρκα καὶ ὀστέα
  choice: சதையும் எலும்புகளும்
  rationale: இங்கு σάρξ உருவகமாக அல்லாமல் உடலின் சதையை நேரடியாகக் குறிக்கிறது. இணைச்சொற்கள் உயிர்த்தெழுந்த இயேசுவின் தொட்டுணரக்கூடிய உடல் உண்மையைத் தெளிவாகக் காக்கின்றன.
- source_word: θεωρεῖτε ἔχοντα
  choice: எனக்கு அவை இருப்பதை நீங்கள் பார்க்கிறீர்களே
  rationale: ἐμέ-ஐ விளக்கும் பங்கேற்பு வடிவத்தை தமிழில் இயல்பான சார்பு வாக்கியமாக்குகிறது. θεωρεῖτε-யின் நேரில் கவனித்துப் பார்ப்பதற்கான வலிமை ‘பார்க்கிறீர்கள்’ என்பதில் நிலைக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவின் உடல் உண்மையை மொழிபெயர்த்தல்
  choice: ‘ஆவிக்கு சதையும் எலும்புகளும் இருப்பதில்லை; ஆனால் எனக்கு அவை இருப்பதை நீங்கள் பார்க்கிறீர்களே’ என்று உடல் சார்ந்த மொழியைத் தெளிவாகத் தக்கவைத்தல்
  alternative: உடலுக்கும் ஆவிக்கும் இடையிலான வேறுபாட்டை மென்மையாக்கும் அல்லது விளக்கவுரை சேர்க்கும் மொழிபெயர்ப்பு
  rationale: பார்த்தல், தொடுதல், சதை, எலும்புகள் ஆகிய கிரேக்க உரையின் நேரடி சான்றுகளை மாற்றாமல் காக்கிறது. அதே நேரத்தில் உயிர்த்தெழுந்த உடலின் இயல்பைப் பற்றி வசனம் கூறாத கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ὅτι ἐγώ εἰμι αὐτός என்பதன் தொடர்பும் வலியுறுத்தலும்
  choice: ‘இது நானேதான் என்று தெரிந்துகொள்ளுங்கள்’ என அடையாளத்தை வலியுறுத்தும் உள்ளடக்கப் பொருள்
  alternative: ‘ஏனெனில் நானேதான்’ என ὅτι-யை காரணப்பொருளில் எடுத்தல்
  rationale: சீடர்கள் கைகளையும் கால்களையும் பார்த்து அவருடைய அடையாளத்தை உணர வேண்டும் என்பதே உடனடி சூழலுக்கு நன்றாகப் பொருந்துகிறது. இருப்பினும் காரணப்பொருள் இலக்கண ரீதியாகச் சாத்தியமுள்ளதால் அதை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், நேரடியானதும் கண்ணியமானதும் வாய்வழி வாசிப்புக்கு ஏற்றதுமாக அமைக்கப்பட்டுள்ளது. ‘நானேதான்’ அடையாள வலியுறுத்தலை இயல்பாகக் காக்கிறது. ‘சதை’ இங்கு உடல் சார்ந்த நேரடிப் பொருளில் பயன்படுத்தப்பட்டுள்ளது; ‘மாம்சம்’ என்ற சமய வழக்குச் சொல்லின் தேவையற்ற உருவகச் சுமை தவிர்க்கப்பட்டுள்ளது.
