language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: ta
  text: அவர்கள் பேசிக்கொண்டும் விவாதித்துக்கொண்டும் இருந்தபோது, இயேசு தாமே அவர்களை நெருங்கி அவர்களோடு சென்றுகொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களோடு பயணம் செய்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ὁμιλεῖν
  choice: அவர்கள் பேசிக்கொண்டும் ... இருந்தபோது
  rationale: ἐν + articular infinitive காலத்தைக் குறிக்கிறது. ἐγένετο என்பது லூக்காவின் நிகழ்வுமாற்றக் கதைநடைச் சூத்திரம்; தமிழில் தனியாக ‘நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட ‘இருந்தபோது’ என்ற இயல்பான காலவாக்கிய அமைப்பில் அதன் பண்பு வெளிப்படுகிறது.
- source_word: συζητεῖν
  choice: விவாதித்துக்கொண்டும்
  rationale: இந்த வினைச்சொல் கருத்துகளை ஆராய்ந்து பேசுவதையும் தீவிரமான வாதத்தையும் குறிக்கக்கூடும். ‘விவாதித்தல்’ அந்தத் தீவிரத்தைத் தக்கவைத்தாலும் பகைமையான சண்டையைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: αὐτὸς Ἰησοῦς
  choice: இயேசுவே
  rationale: αὐτός தரும் வலியுறுத்தலை இயல்பான தமிழில் ‘-வே’ என்னும் ஒட்டால் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἐγγίσας
  choice: அவர்களை நெருங்கி
  rationale: இது முதன்மை வினைக்கு முன்னதாக அல்லது அதனோடு சேர்ந்தே நிகழும் அணுகுதலைக் குறிக்கும் aorist participle. ‘நெருங்கி’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: συνεπορεύετο
  choice: அவர்களோடு நடந்துசென்றார்
  rationale: Imperfect வடிவம் தொடர்ந்த உடன்பயணத்தைச் சுட்டுகிறது. சூழல் கால்நடைப் பயணமாக இருப்பதால் ‘நடந்துசென்றார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; காலநீட்சி சூழலிலேயே வெளிப்படுகிறது.
- source_word: καὶ ... καὶ ... καὶ
  choice: -க்கொண்டும் ... -க்கொண்டும் ... நெருங்கி
  rationale: மீண்டும் வரும் καί இணைப்புகளை தமிழின் இணைநிலை வினையெச்சங்களால் இயல்பாகத் தருகிறது; மூலத்தின் தொடரோட்டமும் காக்கப்படுகிறது.
theological_decisions:
- issue: அணுகிவந்தவரின் அடையாளத்துக்கு உரை தரும் வலியுறுத்தல்
  choice: இயேசுவே
  alternative: இயேசு
  rationale: αὐτὸς Ἰησοῦς என்பது அணுகியவர் இயேசு தாமே என்பதை இலக்கணரீதியாக வலியுறுத்துகிறது. ‘இயேசுவே’ அந்த வலியுறுத்தலைக் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான கதைநடை. ‘இயேசுவே’ மூலத்தின் வலியுறுத்தலை இயல்பாகக் காக்கிறது. ‘விவாதித்துக்கொண்டும்’ தீவிரமான கலந்துரையாடல் என்ற சாத்தியத்தைத் திறந்தே வைக்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
