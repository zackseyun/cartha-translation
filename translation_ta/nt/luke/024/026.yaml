  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: ta
  text: மேசியா[a] இந்தப் பாடுகளை அனுபவிக்கவும் தமது மகிமைக்குள் நுழையவும் அவசியமாயிருக்கவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து.’ கிரேக்கத்தில் Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டம்; வேதவாக்கு நிறைவேறும் இச்சூழலில் அது ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: அவசியமாக இருக்கவில்லையா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் இயல்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்னர் பேசப்பட்ட துன்ப நிகழ்வுகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἔδει
  choice: அவசியமாக இருக்கவில்லையா
  rationale: வெறும் கட்டாயத்தைவிட, இறைத்திட்டம் மற்றும் வேதநிறைவேற்றத்துடன் தொடர்புடைய அவசியத்தை வெளிப்படுத்துகிறது; அதைக் கூடுதலாக விளக்கிச் சேர்ப்பதில்லை.
- source_word: παθεῖν
  choice: அனுபவித்து
  rationale: πάσχω என்பதன் துன்பத்தை அனுபவித்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘இவற்றை’ என்பது அந்த அனுபவத்தின் துன்பத் தன்மையைச் சூழலில் தெளிவாக்குகிறது.
- source_word: τὸν χριστὸν
  choice: மேசியா
  rationale: Χριστός இங்கு பெயராக அல்ல, வேதவாக்கு நிறைவேற்றச் சூழலில் அபிஷேகம் பெற்ற அரசரைச் சுட்டும் பட்டமாக வருகிறது.
- source_word: καὶ
  choice: -த்து
  rationale: ‘அனுபவித்து ... நுழைவது’ என்ற தமிழ் வினையெச்ச அமைப்பு இரு நிகழ்வுகளையும் இயல்பாக இணைக்கிறது; கிரேக்கத்தைவிட கூடுதலான காலவரிசைக் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: தமது மகிமைக்குள் நுழைவது
  rationale: εἰς என்பதன் உள்ளே நுழைதல் சார்ந்த இயக்கத்தையும் αὐτοῦ என்பதன் உடைமைப் பொருளையும் பாதுகாக்கிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: δόξα என்பதற்கு உயிர்த்தெழுதல் மற்றும் உயர்த்தப்படுதல் சூழலில் பொருத்தமான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: αὐτοῦ
  choice: தமது
  rationale: எழுவாயான மேசியாவையே திரும்பச் சுட்டும் மரியாதைத் தற்சுட்டுப் பெயர்; ‘அவருக்காக நியமிக்கப்பட்ட’ போன்ற விளக்கத்தை இறக்குமதி செய்யாது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் வேதவாக்கு நிறைவேற்றத்துடன் தொடர்புடைய பட்டமாகச் செயல்படுகிறது. ‘மேசியா’ அதன் பட்டப்பொருளை வாசகருக்குத் தெளிவாகப் பாதுகாக்கிறது; மாற்று வழக்கை அடிக்குறிப்பு பதிவு செய்கிறது.
- issue: ἔδει என்பதன் வலிமை
  choice: அவசியமாக இருக்கவில்லையா
  alternative: செய்ய வேண்டியிருக்கவில்லையா
  rationale: லூக்காவின் சூழலில் இது இறைத்திட்டம் மற்றும் வேதநிறைவேற்றத்தின் அவசியத்தை உணர்த்துகிறது. முதன்மை உரை அந்த வலிமையைத் தக்கவைக்கிறது; ஆனால் ‘தேவன் நியமித்தார்’ என்று வெளிப்படையாகச் சேர்த்து தெளிவின்மையைத் தீர்ப்பதில்லை.
- issue: αὐτοῦ உடைய மகிமையின் பொருள்
  choice: தமது மகிமை
  alternative: அவருக்குரிய மகிமை / அவருக்காக வைக்கப்பட்ட மகிமை
  rationale: கிரேக்க உடைமைப் பெயர்ச்சொல்லை நேரடியாகப் பாதுகாத்து, அது இயல்பாக அவருக்குச் சொந்தமான மகிமையா அல்லது அவருக்காக நியமிக்கப்பட்ட மகிமையா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘தமது’ என்பது மரியாதையையும் எழுவாயைத் திரும்பச் சுட்டும் தெளிவையும் தருகிறது. எதிர்மறை வினா, உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் மூலத்தின் வினாவலிமையைப் பாதுகாக்கிறது.
