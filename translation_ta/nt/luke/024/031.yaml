source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: ta
  text: அப்போது அவர்களுடைய கண்கள் திறக்கப்பட்டன; அவர்கள் அவரை அடையாளம் கண்டுகொண்டார்கள்; அவர் அவர்களுக்குக் கண்ணுக்குப் புலப்படாதவரானார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களுடைய பார்வையிலிருந்து மறைந்தார்”; அல்லது, “அவர் அவர்களிடமிருந்து மறைந்துபோனார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: திறக்கப்பட்டன
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பேணி, அவர்கள் தாங்களாகவே உணர்ந்தார்கள் என்பதற்குப் பதிலாக அவர்களுடைய உணர்வு திறக்கப்பட்டது என்ற பொருளைத் தருகிறது.
- source_word: οἱ ὀφθαλμοὶ
  choice: அவர்களுடைய கண்கள்
  rationale: கிரேக்கத்தின் எழுவாயை இயல்பான நவீனத் தமிழில் நேரடியாகக் கொடுக்கிறது; சூழலில் இது உட்பார்வை அல்லது உணர்திறன் திறக்கப்பட்டதையும் சுட்டுகிறது.
- source_word: ἐπέγνωσαν
  choice: அடையாளம் கண்டுகொண்டார்கள்
  rationale: முன்பு யார் என்று உணராத ஒருவரை இப்போது அடையாளம் கண்டார்கள் என்ற எம்மாவு நிகழ்ச்சிச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: ἄφαντος
  choice: பார்வையிலிருந்து மறைந்தார்
  rationale: ‘காணப்படாதவர்/கண்ணுக்குப் புலப்படாதவர் ஆனார்’ என்ற கருத்தை இயல்பான தமிழில் தெரிவித்து, அது எவ்வாறு நிகழ்ந்தது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: அவர்களுடைய பார்வையிலிருந்து மறைந்தார்
  rationale: அவர்களுக்குச் சம்பந்தமாக அவர் இனி காணப்படவில்லை என்ற ἀπό-வின் தொடர்புப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: கதை நகர்வைக் குறிக்கும் δέ-வை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு காணப்படாமல் போன நிகழ்வின் இயல்பு
  choice: அவர் அவர்களுடைய பார்வையிலிருந்து மறைந்தார்
  alternative: அவர் அவர்களுக்குக் கண்ணுக்குப் புலப்படாதவர் ஆனார்
  rationale: ἄφαντος ἐγένετο என்ற சொற்றொடர் அவர் இனி அவர்களால் காணப்படவில்லை என்பதைச் சொல்கிறது; அதன் செயல்முறையை விளக்கவில்லை. தேர்ந்த மொழிபெயர்ப்பு அந்த இறையியல் மர்மத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அடையாளம் கண்டுகொண்டார்கள்’ என்பது சூழலுக்கேற்ற இயல்பான தொடர். ‘பார்வையிலிருந்து மறைந்தார்’ என்பது நிகழ்வின் முறையை மிகுதியாக விளக்காமல் மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
