  source_fidelity: 'முதன்மைப் பாடம் SBLGNT-இன் οἱ δὲ ἐπέδωκαν αὐτῷ ἰχθύος ὀπτοῦ μέρος என்பதைத் துல்லியமாகப் பிரதிபலிக்கிறது: சீடர்கள் இயேசுவுக்கு வாட்டிய மீனின் ஒரு பகுதியைக் கொடுத்தனர். ஆனால் அடிக்குறிப்பில் உள்ள நீண்ட வாசகத்தின் ‘தேனடையிலிருந்து சிறிதும்’ என்பது கிரேக்கத்தின் பொருளை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கவில்லை; அது தேனடையிலிருந்து எடுக்கப்பட்ட சிறிது என்ற பொருளைத் தருகிறது, மூல வாசகம் தேனடையின் ஒரு பகுதியையும் சேர்த்துக் குறிப்பிடுகிறது.'
  naturalness: ‘அவர்கள் அவருக்கு வாட்டிய மீனின் ஒரு துண்டைக் கொடுத்தார்கள்’ என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘வாட்டிய மீன்’ ὀπτός என்பதற்குச் சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு. அடிக்குறிப்பை ‘தேனடையின் ஒரு பகுதியும்’ என மாற்றுவது மிகவும் இயல்பானது.
  terminology: ‘அவருக்கு’ மரியாதை ஒருமையைச் சரியாகக் காக்கிறது. ‘வாட்டிய’ எண்ணெயில் பொரித்தல் என்ற தவறான நுணுக்கத்தைத் தவிர்த்து ὀπτοῦ-வின் சுட்ட/வாட்டிச் சமைத்த பொருளைச் சரிவரக் காட்டுகிறது. ‘தேனடை’ என்பது honeycomb-க்கு நிலையான, புரியக்கூடிய சொல்.
