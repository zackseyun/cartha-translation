translation:
  language: ta
  text: அவர்கள் அவருக்கு வாட்டிய மீனின் ஒரு துண்டைக் கொடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பிற்காலக் கையெழுத்துப் பிரதிகள், “தேனடையின் ஒரு பகுதியும்” என்று கூடுதலாகக் கொண்டுள்ளன.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  choice: அவர்கள்
  rationale: οἱ என்பது முந்தைய சூழலில் கூடியிருந்த சீடர்களைக் குறிக்கும் பெயர்ச்சொல் சார்ந்த பயன்பாடு; δέ மென்மையான இணைப்புச்சொல். தமிழில் தனியாக இணைப்புச்சொல் சேர்க்காமல் தொடர்வது இயல்பாக உள்ளது.
- source_word: ἐπέδωκαν
  choice: கொடுத்தார்கள்
  rationale: ἐπιδίδωμι என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம்; இச்சூழலில் நேரடியாகக் கொடுத்தல் அல்லது கையில் அளித்தல் என்று பொருள். ‘கொடுத்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: மறைமுகச் செயப்படுபொருளான தத்திவைத் தமிழில் ‘அவருக்கு’ என்று இயல்பாகக் காட்டுகிறது; மரியாதை ஒருமை இயேசுவைக் குறிக்கும் வழக்கமான கண்ணியமான தமிழ் நடை.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: வாட்டிய மீனின் ஒரு துண்டு
  rationale: μέρος என்பது ‘துண்டு/பகுதி’ என்ற தலைமைப் பெயர்ச்சொல்; ἰχθύος ὀπτοῦ என்பது வாட்டிச் சமைக்கப்பட்ட மீனை விவரிக்கும் உடைமைத் தொடர். தமிழ் சொல் வரிசையில் ‘வாட்டிய மீனின் ஒரு துண்டு’ மூலத்தின் அமைப்பையும் பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: ὀπτοῦ
  choice: வாட்டிய
  rationale: ὀπτός என்பது நெருப்பில் அல்லது வெப்பத்தில் வாட்டி/சுட்டுச் சமைத்ததைச் சுட்டுகிறது. ‘வாட்டிய’ என்பது ‘சமைத்த’ என்பதைக் காட்டிலும் துல்லியமானதும், ‘பொரித்த’ என்று எண்ணெயில் சமைத்த பொருளைத் தவறாக உணர்த்தாததும் ஆகும்.
theological_decisions:
- issue: லூக்கா 24:42-இன் மூலபாட வடிவம்
  choice: SBLGNT மூலத்தில் உள்ள ‘வாட்டிய மீனின் ஒரு துண்டு’ என்பதை மட்டும் முதன்மைப் பாடமாக மொழிபெயர்த்தல்
  alternative: சில பிற்காலக் கையெழுத்துப் பிரதிகளில் ‘தேனடையிலிருந்து சிறிதும்’ என்ற கூடுதல் வாசகம் உள்ளது.
  rationale: கொடுக்கப்பட்ட விமர்சன மூலபாடம் μέρος என்பதுடன் முடிகிறது; நீண்ட வாசகம் அதில் இல்லை. ஆகவே முதன்மைப் பாடம் மூலத்தையே பின்பற்றுகிறது; கையெழுத்துப் பிரதிகளின் வேறுபாடு வெளிப்படைத்தன்மைக்காக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை. இயேசுவைக் குறிக்கும் ‘அவருக்கு’ மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது. உணவு தயாரிப்பு முறையைத் துல்லியமாகக் காட்ட ‘வாட்டிய’ தேர்ந்தெடுக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மைப் பாடத்தில் இடம்பெற்றுள்ளது.
