reference: Luke 24:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: ta
  text: இதோ, அவர்களில் இருவர் அதே நாளில் எருசலேமிலிருந்து அறுபது ஸ்தாதியம்[a] தொலைவிலிருந்த எம்மாவு என்னும் ஒரு கிராமத்துக்குப் போய்க்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஸ்தாதியம் என்பது பண்டைய காலத் தொலைவு அலகு. அறுபது ஸ்தாதியம் என்பது ஏறக்குறைய 11 கிலோமீட்டர்.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் லூக்காவின் கதைநடைச் சுட்டியை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; தொடக்கத்திலுள்ள καί தனியே ‘மற்றும்’ என மொழிபெயர்க்கப்பட்டால் தமிழ் நடையில் செயற்கையாக இருக்கும்.
- source_word: δύο ἐξ αὐτῶν
  choice: அவர்களில் இருவர்
  rationale: பகுதிப்பொருள் கொண்ட கிரேக்கத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அவர்கள் யார் என்பதை இவ்வசனத்துக்கு அப்பால் சென்று மிகையாகக் குறிப்பிடவில்லை.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: அதே நாளில்
  rationale: αὐτῇ தரும் வலியுறுத்தலை ‘அதே’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: ἦσαν πορευόμενοι
  choice: போய்க்கொண்டிருந்தார்கள்
  rationale: கடந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த பயணத்தை உணர்த்தும் சுற்றுவழி இறந்தகால அமைப்பின் நீடித்த செயற்பொருளைப் பாதுகாக்கிறது.
- source_word: εἰς κώμην
  choice: ஒரு கிராமத்துக்கு
  rationale: κώμη என்பதன் ஊர்வகைப் பொருளை ‘கிராமம்’ துல்லியமாகத் தருகிறது; இயக்கத்திற்கான இலக்கை ‘-க்கு’ இயல்பாகக் குறிக்கிறது.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: எருசலேமிலிருந்து அறுபது ஸ்தாதியம் தொலைவிலிருந்த
  rationale: மூலத்தின் பண்டைய தொலைவு அலகை முதன்மை உரையில் தக்கவைத்து, கிராமத்தின் எருசலேமிலிருந்த தொலைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: எம்மாவு என்னும்
  rationale: ‘அதன் பெயர் எம்மாவு’ என்ற வெளிப்படையான கிரேக்க அமைப்பின் பொருளைச் சுருக்கமான, இயல்பான தமிழ் பெயரடைத் தொடராக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற சற்றே உயர்நடைச் சொல் மூலத்தின் கவன ஈர்ப்பு வலிமைக்காகத் தக்கவைக்கப்பட்டது. பண்டைய அளவலகு முதன்மை உரையில் வைக்கப்பட்டு, இன்றைய மதிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
