lexical_decisions:
- source_word: καὶ
  choice: அப்போது
  rationale: எளிய கதைத் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; சூழலுக்கு அப்பாற்பட்ட வலுவான காலப் பொருளைச் சேர்ப்பதில்லை.
- source_word: ἐμνήσθησαν
  choice: அவர்களுக்கு நினைவுக்கு வந்தன
  rationale: இங்கு நடுத்தர/செயப்பாட்டு வடிவத்தில் உள்ள வினை செயல்பாட்டு பொருளில் வருகிறது. ‘நினைவுகூர்ந்தார்கள்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: τῶν ῥημάτων
  choice: வார்த்தைகள்
  rationale: ῥῆμα என்பது பேசப்பட்ட வார்த்தைகள் அல்லது சொல்லப்பட்டவற்றைக் குறிக்கிறது; ‘வார்த்தைகள்’ நேரடியானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: மூலத்தின் உரிய சுட்டுப்பெயர் வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது இயேசுவைக் குறிக்கிறது என்றாலும் பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
