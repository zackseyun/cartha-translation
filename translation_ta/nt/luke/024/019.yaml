translation:
  language: ta
  text: அவர் அவர்களிடம், “என்ன காரியங்கள்?” என்று கேட்டார். அவர்கள் அவரிடம், “நாசரேயரான இயேசுவைப் பற்றிய காரியங்கள்தாம்.[a] அவர் கடவுளின் முன்னிலையிலும் மக்கள் அனைவரின் முன்னிலையிலும் செயலிலும் சொல்லிலும் வல்லமைமிக்க ஒரு மனிதராகவும் தீர்க்கதரிசியாகவும் விளங்கியவர்[b],” என்றார்கள்.
