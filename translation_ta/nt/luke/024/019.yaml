lexical_decisions:
- source_word: Ποῖα
  choice: என்ன காரியங்கள்?
  rationale: பன்மை வினாப்பெயரின் பொருளைக் காக்கிறது; தமிழில் இயல்பாகவும் உரையாடலுக்கேற்றவாறும் உள்ளது.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: இயேசுவைப் பற்றிய காரியங்கள்
  rationale: περί அமைப்பை நேரடியாகப் பிரதிபலிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நிகழ்ந்தவை’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: Ναζαρηνοῦ
  choice: நாசரேயரான
  rationale: இது ஊர்ப்பெயரை மட்டும் கூறும் சொற்றொடராக மாற்றாமல், கிரேக்க அடைமொழியின் வடிவத்தைக் காக்கிறது; இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐγένετο
  choice: விளங்கியவர்
  rationale: இச்சூழலில் γίνομαι என்பதன் ‘ஆனார்/இருந்தார்’ என்ற இடைநிலையான பொருளை இயல்பான தமிழில் தருகிறது; இயேசு ஒரு கட்டத்தில் மனிதராக மாறினார் என்ற தவறான உட்பொருளைத் தவிர்க்கிறது.
- source_word: ἀνὴρ προφήτης
  choice: ஒரு மனிதராகவும் தீர்க்கதரிசியாகவும்
  rationale: இரு பெயர்ச்சொற்களையும் விடாமல் காக்கிறது; அவை ஒரே நபரை இணையாக விவரிப்பதையும் தெளிவாக்குகிறது.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: செயலிலும் சொல்லிலும் வல்லமைமிக்க
  rationale: செயல்–சொல் என்ற இணையைத் தக்கவைத்து, δυνατός என்பதன் வலிமை/ஆற்றல் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: கடவுளின் முன்னிலையிலும் மக்கள் அனைவரின் முன்னிலையிலும்
  rationale: தெய்வீக மற்றும் பொதுமக்கள் சாட்சியின் பரப்பைத் தெளிவாகக் காட்டி, ‘முன்பாக/பார்வையில்’ என்ற பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் ἀνὴρ என்பதைக் கையாளுதல்
  choice: ஒரு மனிதராகவும் தீர்க்கதரிசியாகவும்
  alternative: தீர்க்கதரிசியாக
  rationale: மூல கிரேக்கம் ἀνήρ என்பதை வெளிப்படையாகக் கொண்டிருப்பதால் ‘மனிதர்’ என்பதை நீக்கவில்லை. இது வசனத்தில் பேசுகிறவர்களின் கிறிஸ்துவைப் பற்றிய விவரிப்பை அப்படியே அளிக்கிறது.
- issue: ἐγένετο என்பதை ‘ஆனார்’ என்று நேரடியாக மொழிபெயர்ப்பதால் உருவாகக்கூடிய கிறிஸ்தியல் தவறுணர்வு
  choice: விளங்கியவர்
  alternative: ஆனவர் / இருந்தவர்
  rationale: கிரேக்க வினையின் பரப்பை முற்றிலும் ‘இருந்தார்’ என்று தட்டையாக்காமல், இச்சூழலில் ஒருவராக அறியப்பட்டு விளங்கினார் என்ற பொருளைத் தருகிறது; அவர் முன்பு மனிதர் அல்லாமல் பின்னர் மனிதரானார் என்ற தேவையற்ற கருத்தையும் உருவாக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘காரியங்கள்’, ‘முன்னிலை’, ‘வல்லமைமிக்க’ ஆகிய சொற்கள் ஓரளவு உயர்ந்த வேதாகம நடையைத் தக்கவைத்தாலும் அரிதான அல்லது பழமையான சொற்களைத் தவிர்க்கின்றன. வசனம் அடுத்த வசனத்திற்குத் தொடர்வதால் இறுதியில் மேற்கோளுக்குள் காற்புள்ளி வைக்கப்பட்டுள்ளது.
