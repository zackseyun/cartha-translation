  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: ta
  text: 'அவர் இங்கே இல்லை; மாறாக, உயிர்த்தெழுப்பப்பட்டார்.[a] அவர் இன்னும் கலிலேயாவில் இருந்தபோது உங்களிடம் எப்படிப் பேசினார் என்பதை நினைவுகூருங்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “உயிர்த்தெழுந்தார்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது: “உயிர்த்தெழுப்பப்பட்டார்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: அவர் இங்கே இல்லை
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், சூழல் இயேசுவையே குறிக்கிறது. தமிழில் இயல்பான தெளிவுக்காக ‘அவர்’ சேர்க்கப்பட்டது; ὧδε என்பதற்கு ‘இங்கே’ இயல்பான இடவியல் இணை.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய மறுப்புக்கும் அடுத்த உயிர்த்தெழுதல் அறிவிப்புக்கும் இடையிலான வலுவான எதிர்மறை மாறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἠγέρθη
  choice: உயிர்த்தெழுப்பப்பட்டார்
  rationale: ἐγείρω வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, உயிர்த்தெழுதலில் மறைமுகமாக உள்ள இறைச் செயல்பாட்டை வெளிப்படையாகத் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: μνήσθητε
  choice: நினைவுகூருங்கள்
  rationale: நேரடியான கட்டளையைக் கண்ணியமான, இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὡς
  choice: எப்படி
  rationale: இங்கு இயேசு பேசிய விதம் அல்லது அவர் கூறியவற்றை நினைவுக்குக் கொண்டுவரும் அறிமுகச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: ἐλάλησεν ὑμῖν
  choice: உங்களிடம் எப்படிப் பேசினார்
  rationale: λαλέω என்பதன் பொதுவான ‘பேசு’ பொருளைப் பாதுகாக்கிறது; ‘உங்களிடம்’ என்பது தொடர்பை இயல்பாகக் குறிக்கிறது.
- source_word: ἔτι ὢν
  choice: இருந்தபோதே
  rationale: ἔτι தரும் ‘இன்னும்/அப்போதும்’ என்ற காலநிலையை ‘போதே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: கலிலேயாவில்
  rationale: இடப்பொருளை நேரடியாகத் தரும் வழக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: ἠγέρθη என்ற உயிர்த்தெழுதல் வினையின் மொழிபெயர்ப்பு
  choice: உயிர்த்தெழுப்பப்பட்டார்
  alternative: உயிர்த்தெழுந்தார்
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தை முதன்மை உரையில் காக்கிறது. இதனால் உயிர்த்தெழுதலின் நிகழ்வையும் மறைமுக இறைச் செயலையும் தக்கவைத்து, வினையைத் தன்வினையாக மாற்றுவதைத் தவிர்க்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் செயப்பாட்டு வடிவமும் வசன முடிவில் அடுத்த வசனத்தை நோக்கிச் செல்லும் தொடர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன.
