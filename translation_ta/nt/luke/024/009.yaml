  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ta
  text: அவர்கள் கல்லறையிலிருந்து திரும்பி வந்து, இவை அனைத்தையும் பதினொருவரிடமும் மற்ற அனைவரிடமும் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: திரும்பி வந்து
  rationale: இறந்தகாலப் பெண்பால் பன்மை வினையெச்சத்தின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; முன் சூழலில் குறிப்பிடப்பட்ட பெண்களே இதன் எழுவாய்.
- source_word: μνημείου
  choice: கல்லறை
  rationale: இயேசு அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கும் μνημεῖον என்பதற்கு இச்சூழலில் துல்லியமும் வழக்குமுள்ள தமிழ் சொல்.
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: கேட்டறிந்த செய்தியை மற்றவர்களிடம் எடுத்துச் சொன்ன செயலை இயல்பான கதைநடைத் தமிழில் தருகிறது; பொதுமக்களுக்கான பிரகடனமாக மிகைப்படுத்துவதில்லை.
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: ταῦτα என்பதன் சுட்டுப்பொருளையும் πάντα என்பதன் முழுமையையும் இரண்டையும் காக்கிறது.
- source_word: τοῖς ἕνδεκα
  choice: பதினொருவரிடம்
  rationale: மூலத்தில் உள்ள மரபுவழிக் குழுப்பெயரை அப்படியே தருகிறது; இல்லாத ‘அப்போஸ்தலர்கள்’ என்ற பெயரைச் சேர்ப்பதில்லை.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: மற்ற அனைவரிடம்
  rationale: பதினொருவரைத் தவிர அங்கிருந்த மீதமுள்ள முழுக் குழுவையும் குறிக்கும் பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: பெண்பால் பன்மை வினையெச்சத்திற்கும் பன்மை வினைக்கும் உரிய எழுவாய்
  choice: முன் சூழலில் கல்லறைக்கு வந்த பெண்களைக் குறிக்கும் ‘அவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அந்தப் பெண்கள்’ என்று பெயர்ச்சொல்லை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்க இலக்கணம் எழுவாய் பெண்கள் என்பதைத் தெளிவாக்கினாலும், தமிழில் ‘அவர்கள்’ இயல்பாக முன்னர் குறிப்பிடப்பட்ட பெண்களைக் குறிக்கிறது; மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்கத் தேவையில்லை.
- issue: அப்போஸ்தலர் குழுவின் பெயரிடல்
  choice: ‘பதினொருவர்’ என்று மட்டும் தருதல்
  alternative: ‘பதினொரு அப்போஸ்தலர்கள்’
  rationale: மூல உரை ‘பதினொருவர்’ என்று மட்டுமே கூறுகிறது. ‘அப்போஸ்தலர்கள்’ என விரிவாக்குவது விளக்கமாக இருந்தாலும் மூலத்தில் இல்லாத சொல்லைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, எளிதில் புரியும் தமிழ். ‘திரும்பி வந்து’ என்பது வினையெச்சத் தொடர்பை இயல்பாகக் காக்கிறது; ‘பதினொருவரிடமும் மற்ற அனைவரிடமும்’ என்ற இணை அமைப்பு இரு பெறுநர் குழுக்களையும் தெளிவாக வேறுபடுத்துகிறது.
