  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: ta
  text: ஆனால், அவரை அடையாளம் கண்டுகொள்ளாதபடி அவர்களுடைய கண்கள் தடுக்கப்பட்டிருந்தன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை அடையாளம் கண்டுகொள்ளாமல் இருக்க அவர்களுடைய கண்கள் கட்டுப்படுத்தப்பட்டிருந்தன” அல்லது “அவரை அடையாளம் கண்டுகொள்வதிலிருந்து அவர்களுடைய கண்கள் தடுக்கப்பட்டிருந்தன.” கிரேக்க மூலத்தில் இதைச் செய்தவர் யார் என்பது குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: இயேசு அவர்களுடன் நடந்துவந்தும் அவர்கள் அவரை அடையாளம் காணாத முரண்பாட்டைச் சுட்டும் மென்மையான இணைப்பாக δέ இங்கு வருகிறது.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: அவர்களுடைய கண்கள்
  rationale: கிரேக்கத்தின் தெளிவான உடல் சார்ந்த உருவகத்தைச் சுருக்காமல் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐκρατοῦντο
  choice: தடுத்து வைக்கப்பட்டிருந்தன
  rationale: வெளிப்புறச் செயல் அல்லது விளைவால் பிடித்து நிறுத்தப்பட்ட நிலையை உணர்த்தும் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; செய்பவர் யார் என்பதைச் சேர்க்கவில்லை.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: அடையாளம் கண்டுகொள்ள முடியாதபடி
  rationale: இச்சூழலில் ἐπιγινώσκω பொதுவாக அறிதலை அல்ல, ஒருவரை அடையாளம் காணுதலைக் குறிக்கிறது. கிரேக்கக் கட்டமைப்பில் நோக்கம் அல்லது விளைவு என்ற நுட்பம் இரண்டிற்கும் இடமிருப்பதால் தமிழிலும் அதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் இயேசுவைக் குறிக்கும் நேரடியான ஒருமை ஆண்பால் செயப்படுபொருள்.
theological_decisions:
- issue: அவர்கள் இயேசுவை அடையாளம் காணாதபடி செய்தவர் யார்?
  choice: செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, செய்பவரைக் குறிப்பிடாமல் மொழிபெயர்த்தல்.
  alternative: “கடவுள் அவர்களுடைய கண்களைத் தடுத்தார்” என்று இறைச் செயலை வெளிப்படையாகக் கூறுதல்; அல்லது “அவர்களால் அவரை அடையாளம் காண முடியவில்லை” என்று வெறும் இயலாமையாக மாற்றுதல்.
  rationale: கிரேக்கத்தில் செய்பவர் குறிப்பிடப்படவில்லை. எனவே இறைச் செயலை வெளிப்படையாகச் சேர்க்காமலும், வெளிப்புறத் தடையின் நுட்பத்தை அகற்றாமலும் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. “அவர்களுடைய கண்கள்” என்ற உடல் சார்ந்த உருவகம் தக்கவைக்கப்பட்டு, “தடுத்து வைக்கப்பட்டிருந்தன” என்ற செயப்பாட்டு நடை மூலம் மூலத்தில் குறிப்பிடப்படாத செய்பவர் தமிழிலும் குறிப்பிடப்படாமல் விடப்பட்டுள்ளார்.
