base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: ta
  text: “அவர் வழியில்[b] நம்மோடு பேசிக்கொண்டிருந்தபோதும், மறைநூல்களை நமக்குத் திறந்து காட்டிக்கொண்டிருந்தபோதும்[c], நம் இதயம்[a] நமக்குள் எரிந்துகொண்டிருந்தது அல்லவா?” என்று அவர்கள் ஒருவருக்கொருவர் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘நம் இதயம்’ என்று ஒருமையில் உள்ளது; ‘நம் இதயங்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘சாலையில்.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘மறைநூல்களைத் திறந்துகொண்டிருந்தபோது’; அதாவது, அவற்றின் பொருளைத் தெளிவாக்கிக்கொண்டிருந்தபோது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரமாகப் பேசுவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Οὐχὶ
  choice: எரிந்துகொண்டிருக்கவில்லையா?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் சொல்லாற்றலைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἡ καρδία ἡμῶν
  choice: நம் இதயம்
  rationale: கிரேக்கத்தில் உள்ள ஒருமையைப் பாதுகாப்பதோடு, இருவரின் பகிரப்பட்ட உள்ளார்ந்த அனுபவத்தையும் வெளிப்படுத்துகிறது.
- source_word: καιομένη
  choice: எரிந்துகொண்டிருக்க
  rationale: உள்ளார்ந்த உணர்வு, ஆன்மிக எழுச்சி, அல்லது அறிவுத் தெளிவு என்று குறிப்பிட்டுத் தீர்மானிக்காமல், மூலத்தின் ‘எரிதல்’ உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἐν ἡμῖν
  choice: நமக்குள்
  rationale: உள்ளார்ந்த அனுபவத்தைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἐλάλει
  choice: பேசிக்கொண்டிருந்தபோதும்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலையின் நீடித்த செயலை வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணப் பாதையையும் பயணம் செய்துகொண்டிருந்த நிலையையும் இயல்பாகக் குறிக்கிறது; ‘சாலையில்’ என்பதும் சாத்தியம்.
- source_word: διήνοιγεν
  choice: திறந்து காட்டிக்கொண்டிருந்தபோதும்
  rationale: ‘திறத்தல்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, அதன் பொருளைப் புரியவைத்தல் என்ற சூழல்சார் உணர்வையும் தமிழில் தெரிவிக்கிறது.
- source_word: τὰς γραφάς
  choice: மறைநூல்களை
  rationale: இச்சூழலில் குறிப்பிடப்படும் புனித எழுத்துத் தொகுப்புகளை நவீன, கண்ணியமான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: ‘இதயம் எரிதல்’ என்ற உருவகத்தின் பொருள்
  choice: ‘நம் இதயம் நமக்குள் எரிந்துகொண்டிருக்கவில்லையா?’ என்று உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘நாம் உள்ளத்தில் ஆழமாக நெகிழவில்லையா?’ அல்லது ‘நமக்கு ஆன்மிக எழுச்சி ஏற்படவில்லையா?’
  rationale: இந்த அனுபவம் உணர்ச்சியா, ஆன்மிக எழுச்சியா, அறிவுத் தெளிவா என்பதை வசனம் தனித்துத் தீர்மானிக்கவில்லை; உருவகத்தைப் பாதுகாப்பது அந்தத் திறந்த பொருளையும் இறையியல் அழுத்தத்தையும் தக்கவைக்கிறது.
- issue: மறைநூல்களை ‘திறத்தல்’
  choice: விளக்குதல் என்று மட்டும் மாற்றாமல் ‘திறந்து காட்டுதல்’ என்ற உருவகத்தை வைத்தல்
  alternative: ‘மறைநூல்களின் பொருளை விளக்கிக்கொண்டிருந்தபோது’
  rationale: διανοίγω என்பதன் திறத்தல் உருவகத்தையும், கேட்போருக்கு அதன் பொருள் தெளிவாக்கப்பட்டதையும் ஒருங்கே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மறைநூல்கள்’ என்பது புனித எழுத்துகளைத் தெளிவாகக் குறிக்கிறது; ‘வேதவாக்கியங்கள்’ என்று மொழிபெயர்த்து தனித்தனி வசனங்கள் என்ற தவறான எண்ணத்தை ஏற்படுத்துவது தவிர்க்கப்பட்டுள்ளது. தொடர்ச்சியான செயல்களை உணர்த்த ‘பேசிக்கொண்டிருந்தபோதும்’, ‘திறந்து காட்டிக்கொண்டிருந்தபோதும்’, ‘எரிந்துகொண்டிருக்க’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
