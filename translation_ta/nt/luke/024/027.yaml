  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: ta
  text: அவர் மோசேயின் நூல்களிலிருந்தும் எல்லாத் தீர்க்கதரிசிகளின் நூல்களிலிருந்தும் தொடங்கி,[a] எல்லா வேதநூல்களிலும் தம்மைக் குறித்தவற்றை அவர்களுக்கு விளக்கிக் கூறினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோசேயின் நூல்கள்” மற்றும் “எல்லாத் தீர்க்கதரிசிகளின் நூல்கள்” என்பது மோசேயுடன் தொடர்புபடுத்தப்படும் வேதநூல்களையும் தீர்க்கதரிசன நூல்களையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “விளக்கிக் கூறினார்” என்பதற்கு “பொருள் விளக்கினார்” அல்லது “வியாக்கியானம் செய்தார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை விரிவாக விளக்குதல் அல்லது பொருளுரைத்தலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: மோசேயிலிருந்து தொடங்கி
  rationale: ἀπό குறிக்கும் தொடக்கப் புள்ளியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இங்கு ‘மோசே’ என்பது அவரோடு தொடர்புடைய வேதநூல்களைக் குறிக்கிறது.
- source_word: πάντων τῶν προφητῶν
  choice: தீர்க்கதரிசிகள் அனைவருடைய நூல்களையும்
  rationale: மோசேயின் நூல்களுடன் இணைந்த வேதப்பிரிவை இது குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது; பொதுவாகத் தீர்க்கதரிசி நபர்களை மட்டும் குறிப்பிடுவதாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: διερμήνευσεν
  choice: விளக்கிக் கூறினார்
  rationale: விரிவாகப் பொருள் விளக்குதல் அல்லது வியாக்கியானம் செய்தல் என்ற வினையின் பொருளை, சாதாரண வாசகருக்குப் புரியும் நவீன தமிழில் தருகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: இடப்பொருள் வேற்றுமையில் உள்ள மறைமுகச் செயப்படுபொருளை நேரடியாகக் காட்டுகிறது.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: வேதவசனங்கள் அனைத்திலும்
  rationale: γραφή இச்சூழலில் புனித வேத எழுத்துகளைக் குறிக்கிறது; πάσαις தரும் பரந்த அளவையும் காக்கிறது.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: தம்மைக் குறித்தவற்றை
  rationale: இயேசுவுடன் தொடர்புடைய செய்திகள், பகுதிகள் அல்லது கருப்பொருள்கள் என்ற பரந்த பொருளைப் பாதுகாக்கிறது; அவற்றைத் தீர்க்கதரிசனங்கள் என்று மட்டும் குறுக்குவதில்லை.
theological_decisions:
- issue: இயேசுவின் வேதவிளக்கத்தின் வரம்பு
  choice: வேதவசனங்கள் முழுவதிலும் தம்மைக் குறித்தவற்றை அவர் விளக்கினார் என்று பரந்த விதத்தில் மொழிபெயர்த்தல்
  alternative: நேரடியான மேசியா தீர்க்கதரிசனங்களை மட்டும் அவர் விளக்கினார் என்றோ, ஒவ்வொரு பழைய ஏற்பாட்டுப் பகுதியும் நேரடியாக அவரையே குறிக்கிறது என்றோ மொழிபெயர்த்தல்
  rationale: மூலவாக்கியம் கிறிஸ்துவை மையமாகக் கொண்ட பரந்த வேதவாசிப்பை ஆதரிக்கிறது; ஆனால் அதை ஒரே விளக்கவியல் வகைக்குள் கட்டுப்படுத்தவோ, ஒவ்வொரு தனிப்பகுதியைப் பற்றிய முழுமையான கூற்றாக மாற்றவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘வியாக்கியானம்’ பிரதான உரையில் தவிர்க்கப்பட்டு, பொதுவாசகருக்கு எளிய ‘விளக்கிக் கூறினார்’ பயன்படுத்தப்பட்டது. வேதப்பிரிவு சார்ந்த பொருள் அடிக்குறிப்பால் தெளிவாக்கப்பட்டது.
