base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: ta
  text: அவர்கள் இதைக் குறித்து குழப்பமடைந்திருந்தபோது, இதோ, மின்னலைப்போல் ஒளிவீசும் ஆடையுடன் இரண்டு ஆண்கள் அவர்களருகில் நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “மின்னலைப்போல் பளிச்சிடும் ஆடையில்.”'
    reason: ἀστραπτούσῃ என்பதன் மின்னல் போன்ற பளிச்சிடும் ஒளியை இன்னும் சொல்லுக்கு-சொல் நெருக்கமாக வெளிப்படுத்தும் மாற்று வடிவம்.
lexical_decisions:
- source_word: ἐγένετο
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல் காலவாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது லூக்கா பயன்படுத்தும் நிகழ்வை அறிமுகப்படுத்தும் வழக்கமான கதைச் சூத்திரம். தமிழில் ‘அது நிகழ்ந்தது’ என்று தனியே கூறுவது செயற்கையாக இருப்பதால், ‘...கொண்டிருந்தபோது’ என்ற இயல்பான அமைப்பில் அதன் கதைத் தொடர்ச்சி வெளிப்படுகிறது.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: அவர்கள் ... என்ன செய்வதென்று தெரியாமல் குழம்பிக்கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் articular infinitive காலப்பொருளைக் குறிக்கிறது. ἀπορέω வெறும் வியப்பை அல்ல, புரியாமல் வழிதெரியாது திகைக்கும் நிலையை உணர்த்துவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: περὶ τούτου
  choice: இதைக் குறித்து
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்ட காரியத்தைச் சுட்டும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீர் புதிய நிகழ்வின்மீது கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியின் உயிரோட்டத்தையும் தனித்தன்மையையும் காக்கிறது.
- source_word: ἄνδρες δύο
  choice: இரண்டு ஆண்கள்
  rationale: ἀνήρ இங்கு பொதுவாக ‘மனிதர்கள்’ என்பதைக் காட்டிலும் ஆண் மனிதர்களாகத் தோன்றியவர்களைக் குறிக்கிறது. வசனத்தில் உள்ள உடனடி கதைச் சித்தரிப்பை இது காக்கிறது.
- source_word: ἐπέστησαν αὐταῖς
  choice: அவர்களருகே வந்து நின்றார்கள்
  rationale: ἐφίστημι திடீரென அருகில் வந்து நிற்பதையோ அருகே இருப்பதையோ குறிக்கலாம். ‘தோன்றினார்கள்’ என்று விளக்கிவிடாமல் இடவியல் உணர்வையும் நிகழ்வின் இயக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: மின்னலைப்போல் ஒளிவீசிய ஆடை அணிந்த
  rationale: ἐσθής ஆடையையும் ἀστραπτούσῃ மின்னலைப்போன்ற ஒளிவீச்சையும் குறிக்கிறது. கிரேக்கத்தின் தெளிவான மின்னல் உருவகத்தை முதன்மை உரையிலேயே இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: இரண்டு நபர்களின் அடையாளம்
  choice: ‘இரண்டு ஆண்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இரண்டு தேவதூதர்கள்’
  rationale: சுற்றியுள்ள கதை அவர்கள் விண்ணுலகத் தூதர்கள் என்பதை உணர்த்தினாலும், இந்த வசனம் அவர்களை ἄνδρες δύο, ‘இரண்டு ஆண்கள்,’ என்றே அறிமுகப்படுத்துகிறது. அருகிலுள்ள வசனங்களின் விளக்கத்தை இவ்வசனத்துக்குள் புகுத்தாமல் மூலத்தின் உடனடி சித்தரிப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்ணியமான கதைநடையிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற வேதாகமக் கதைச் சுட்டி மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘என்ன செய்வதென்று தெரியாமல்’ என்பது ἀπορέω-வின் வழியறியாத குழப்பத்தைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
