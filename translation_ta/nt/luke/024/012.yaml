source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ta
  text: ஆனால் பேதுரு எழுந்து கல்லறைக்கு ஓடினார்; குனிந்து உள்ளே பார்த்த அவர், அடக்கத்துணிகள் மட்டுமே இருப்பதைக் காண்கிறார். நடந்ததை வியந்தபடி அவர் தன்னிடத்திற்குத் திரும்பிச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன்னிடத்திற்குத் திரும்பிச் சென்றார்” என்பதற்கு “தம் வீட்டிற்குச் சென்றார்” என்றும், “தனக்குள் வியந்தார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: πρὸς ἑαυτόν என்ற கிரேக்கத் தொடர் இடத்தைக் குறிக்கிறதா அல்லது உள்ளார்ந்த எதிர்வினையைக் குறிக்கிறதா என்பது முழுமையாகத் தெளிவில்லை; முதன்மை உரை தெளிவின்மையை முடிந்தவரை காக்கிறது.
lexical_decisions:
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: இச்சூழலில் இயேசுவின் உடல் வைக்கப்பட்ட பாறைக் கல்லறையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: παρακύψας
  choice: குனிந்து உள்ளே பார்த்தபோது
  rationale: கல்லறைக்குள் பார்ப்பதற்காக உடலைக் குனிந்த செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: βλέπει
  choice: காண்கிறார்
  rationale: கதை நடுவே வரும் வரலாற்று நிகழ்காலத்தை மூலத்தின் திடீர் நேரடித் தன்மையுடன் பாதுகாக்கிறது.
- source_word: ὀθόνια
  choice: துணித் துண்டுகள்
  rationale: பன்மை வடிவத்தையும், உடலைச் சுற்றப் பயன்படுத்தப்பட்ட மெல்லிய துணிகளைக் குறிக்கும் சொல்லின் பொதுவான பொருளையும் பாதுகாக்கிறது; ‘ஆடைகள்’ என்று தவறாக உணரப்படுவதைத் தவிர்க்கிறது.
- source_word: μόνα
  choice: மட்டும்
  rationale: கல்லறையில் துணிகள் மட்டுமே காணப்பட்டன என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: πρὸς αὑτόν
  choice: தம்மிடத்திற்குச் சென்றார்
  rationale: கிடைத்துள்ள கிரேக்க வாசகத்தின் சொல் அமைப்பையும் அதன் இயல்பான தெளிவின்மையையும் பாதுகாக்கிறது; ‘வீட்டிற்குச் சென்றார்’ அல்லது ‘தமக்குள் வியந்தார்’ என்று ஒரே விளக்கத்தைத் திணிக்கவில்லை.
- source_word: θαυμάζων
  choice: வியந்தபடி
  rationale: ஆச்சரியமும் திகைப்பும் கலந்த எதிர்வினையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பேதுருவின் எதிர்வினையின் தன்மை
  choice: நடந்ததை எண்ணி வியந்தபடி
  alternative: நடந்ததை நம்பியபடி
  rationale: θαυμάζων என்பது வியப்பைக் குறிக்கிறது; உயிர்த்தெழுதலை அவர் அச்சமயமே முழுமையாக நம்பினார் என்று வசனம் வெளிப்படையாகக் கூறவில்லை.
- issue: πρὸς αὑτόν என்பதன் பொருள்
  choice: தம்மிடத்திற்குச் சென்றார்
  alternative: வீட்டிற்குச் சென்றார் / தமக்குள் வியந்தார்
  rationale: இவ்வாசகம் இடத்தையோ உள்ளார்ந்த நிலையையோ குறிக்கலாம்; மூலத்தின் தெளிவின்மையை முதன்மை உரையில் பாதுகாத்து அடிக்குறிப்பில் மாற்றுப் பொருள்களைத் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் வினைக்கால மாறுபாடு—கடந்தகாலக் கதையாடலுக்குள் வரும் ‘காண்கிறார்’—நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது. கையெழுத்துப் பிரதிகளில் முழு வசனத்தின் இருப்பு குறித்த முக்கிய உரைவேறுபாடு உள்ளது; ஆனால் கொடுக்கப்பட்ட SBLGNT உரையை மொழிபெயர்ப்பதையே இவ்வரைவு மையமாகக் கொண்டுள்ளது.
