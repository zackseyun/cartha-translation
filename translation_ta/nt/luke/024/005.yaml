source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: ta
  text: பெண்கள் அச்சமடைந்து, முகங்களைத் தரைநோக்கித் தாழ்த்தியபோது, அவர்கள் பெண்களிடம், “உயிரோடிருக்கிறவரை இறந்தவர்களிடையே ஏன் தேடுகிறீர்கள்?[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொற்படையாக, “உயிரோடிருக்கிறவரை இறந்தவர்களுடன் என்ன தேடுகிறீர்கள்?” சூழலில் இதன் பொருள், “உயிரோடிருக்கிறவரை இறந்தவர்களிடையே ஏன் தேடுகிறீர்கள்?” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: அச்சமடைந்து
  rationale: ἔμφοβος என்பதன் தீவிரமான அச்ச உணர்வையும், γενομένων தரும் நிலைமாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: முகங்களைத் தரைநோக்கித் தாழ்த்தியபோது
  rationale: முகங்களை நிலத்தை நோக்கித் தாழ்த்திய உடல் அசைவைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: εἶπαν πρὸς αὐτάς
  choice: அவர்கள் அந்தப் பெண்களிடம் ... என்றார்கள்
  rationale: தமிழில் இரு தரப்பையும் ‘அவர்கள்’ என்று மட்டும் சொன்னால் தெளிவின்மை ஏற்படும்; சூழலில் αὐτάς பெண்களைக் குறிக்கிறது என்பதால் பொருளை வெளிப்படையாக்குகிறது.
- source_word: Τί ζητεῖτε
  choice: ஏன் தேடுகிறீர்கள்?
  rationale: τί என்பதன் அடிப்படை வடிவம் ‘என்ன’ என்றாலும், இங்கு தேடலின் பொருத்தத்தை வினவும் சூழல்சார் பொருள் ‘ஏன்’ என்பதாகும்; நிகழ்கால ζητεῖτε ‘தேடுகிறீர்கள்’ என வழங்கப்படுகிறது.
- source_word: τὸν ζῶντα
  choice: உயிரோடிருக்கிறவரை
  rationale: ஒருமை, ஆளைக் குறிக்கும் substantival participle-ஐக் காத்து, தமிழில் இயல்பாக ‘உயிரோடிருக்கிறவர்’ என வழங்குகிறது.
- source_word: μετὰ τῶν νεκρῶν
  choice: இறந்தவர்களிடையே
  rationale: μετά + genitive தரும் ‘உடன்/மத்தியில்’ என்ற பொருளில், உயிருள்ளவருக்கும் இறந்தவர்களுக்கும் உள்ள எதிர்மறையைச் சூழலுக்கு இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸν ζῶντα என்பதில் உயிர்த்தெழுதல் குறித்த உட்பொருள்
  choice: உயிரோடிருக்கிறவரை
  alternative: உயிருள்ளவரை
  rationale: இயேசு இறந்தவர்களுக்கு மாறாக உயிருடன் இருப்பதைச் சுட்டுகிறது; ஆனால் ‘உயிர்த்தெழுந்தவர்’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் காக்கிறது.
- issue: Τί ζητεῖτε என்பதன் வினா நயம்
  choice: ஏன் தேடுகிறீர்கள்?
  alternative: என்ன தேடுகிறீர்கள்?
  rationale: சூழலில் இது அவர்கள் தேடுவதன் பொருத்தத்தைச் சவாலிடும் வினா; எனினும் மூலத்தின் சொற்படையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அந்தப் பெண்களிடம்’ என்பது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கச் சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது; கேள்வியின் நேரடியான தாக்கமும் உயிருள்ளவர்/இறந்தவர்கள் என்ற எதிர்மறையும் காக்கப்பட்டுள்ளன.
