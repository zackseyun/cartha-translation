source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ta
  text: இதோ, என் தந்தை வாக்களித்ததை நான் உங்கள்மேல் அனுப்புகிறேன். ஆனால், உன்னதத்திலிருந்து வரும் வல்லமையை நீங்கள் அணிந்துகொள்ளும்வரை நகரத்திலேயே தங்கியிருங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: ἐξαποστέλλω
  choice: அனுப்புகிறேன்
  rationale: நிகழ்கால வடிவத்தையும் இயேசுவே செய்பவர் என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: என் தந்தை வாக்களித்ததை
  rationale: ‘என் தந்தையின் வாக்குத்தத்தம்’ என்ற பெயர்ச்சொல் அமைப்பின் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வாக்களிக்கப்பட்டது என்ன என்பதை வசனம் வெளிப்படையாகச் சொல்லாத தன்மையையும் காக்கிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்கள்மேல்
  rationale: ἐπί என்பதன் இடவியல் உருவகத்தையும் அருளப்படும் வல்லமை அவர்கள்மேல் வருவதையும் பாதுகாக்கிறது.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: நகரத்திலேயே தங்கியிருங்கள்
  rationale: καθίζω இங்கு நேரடியாக ‘உட்காருங்கள்’ என்பதற்குப் பதிலாக ‘தங்கியிருங்கள்’ என்ற பொருளில் வருகிறது; ‘-ஏ’ நகரத்தை விட்டு செல்லாத கட்டளையை இயல்பாக வலியுறுத்துகிறது.
- source_word: ἐνδύσησθε
  choice: அணிந்துகொள்ளும்வரை
  rationale: வல்லமை ஆடையைப்போல் ஒருவரை மூடும் கிரேக்க உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: ἐξ ὕψους δύναμιν
  choice: உன்னதத்திலிருந்து வரும் வல்லமையை
  rationale: ‘மேலிருந்து’ என்பதைக் காட்டிலும் ὕψος குறிக்கும் வானுலக/தெய்வீக உயரத்தை ‘உன்னதம்’ தெளிவாகக் காட்டுகிறது; ‘வரும்’ என்பது தமிழில் தொடர்பை இயல்பாக்கும் நிரப்பு.
theological_decisions:
- issue: ‘தந்தையின் வாக்குத்தத்தம்’ எதைக் குறிக்கிறது
  choice: வாக்களித்ததை என்று மட்டும் மொழிபெயர்த்து, பரிசுத்த ஆவியார் என வசனத்துக்குள் வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: ‘வாக்களிக்கப்பட்ட பரிசுத்த ஆவியாரை’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: உடனடி சூழல் அந்த அடையாளத்தை ஆதரித்தாலும், இவ்வசனத்தின் கிரேக்க உரை அதை நேரடியாகப் பெயரிடவில்லை; ஆகவே மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: வல்லமையை ‘அணிதல்’ என்ற உருவகம்
  choice: அணிந்துகொள்ளுதல் என்ற உருவகத்தைப் பாதுகாத்தல்.
  alternative: ‘வல்லமையால் நிரப்பப்படுதல்’ அல்லது ‘வல்லமை பெறுதல்’.
  rationale: மாற்று வடிவங்கள் பொருளை விளக்கினாலும், ἐνδύω என்பதன் தனித்துவமான ஆடை உருவகத்தையும் அதன் இறையியல் ஒலியையும் குறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘இதோ’, ‘தந்தை’, ‘வல்லமை’, ‘உன்னதம்’ ஆகியவை வேதாகமச் சூழலுக்கேற்றவையாகவும் பொதுவாசகருக்குப் புரியக்கூடியவையாகவும் உள்ளன.
