revisions:
- from: கல்லறையிலிருந்து கல் உருட்டி அகற்றப்பட்டிருப்பதை அவர்கள் கண்டார்கள்.
  to: அவர்கள் கல்லறையிலிருந்து கல் உருட்டி அகற்றப்பட்டிருந்ததைக் கண்டார்கள்.
  rationale: The revision retains the implied plural subject, the mild narrative progression without a forced connector, and the sense of removal from the tomb. It improves the Tamil passive construction and makes the Greek perfect’s resultant state explicit through “அகற்றப்பட்டிருந்தது,” while leaving the agent unspecified.
