  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: ta
  text: அவர்கள் கல்லறையிலிருந்து கல் உருட்டி அகற்றப்பட்டிருந்ததைக் கண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: அவர்கள் கண்டார்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வினையின் மூன்றாம் நபர் பன்மையை இயல்பான தமிழில் தருகிறது; எழுவாய் முந்தைய வசனத்திலுள்ள பெண்களைக் குறிக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சிக் குறியீடு. தமிழில் தனி இணைப்புச் சொல்லைச் சேர்க்காமல் தொடர்வது இயல்பாகவும் அதன் செயல்பாட்டுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: τὸν λίθον
  choice: கல்
  rationale: அடக்கக் குகையின் வாயிலை மூடிய கல்லைக் குறிக்கிறது. குறிப்புத்தன்மை தமிழ் வாக்கியச் சூழலிலும் சொல் வரிசையிலும் தெளிவாக உள்ளது.
- source_word: ἀποκεκυλισμένον
  choice: உருட்டி அகற்றப்பட்டிருப்பதை
  rationale: நிறைவுற்ற செயப்பாட்டு எச்சம், கல் உருட்டப்பட்டு அகன்ற நிலையில் இருந்ததைச் சொல்கிறது. ‘அகற்றப்பட்டிருப்பதை’ விளைவுநிலையையும் ‘உருட்டி’ இயக்கத்தையும் காக்கிறது.
- source_word: ἀπὸ τοῦ μνημείου
  choice: கல்லறையிலிருந்து
  rationale: நற்செய்தி நூல்களின் அடக்கச் சூழலில் μνημεῖον என்பது ‘கல்லறை’; ἀπό விலகியிருப்பதை ‘-இலிருந்து’ என இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: கிரேக்கத்தில் வெளிப்படையாக மீண்டும் சொல்லப்படாத எழுவாய்
  choice: அவர்கள் கண்டார்கள்
  alternative: கண்டார்கள்
  rationale: மூன்றாம் நபர் பன்மை வினை முந்தைய வசனத்திலுள்ள பெண்களைக் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக ‘அவர்கள்’ வெளிப்படையாகத் தரப்படுகிறது; இது புதிய இறையியல் தகவலைச் சேர்ப்பதில்லை.
- issue: ἀποκεκυλισμένον என்பதின் செயப்பாட்டு மற்றும் விளைவுநிலை
  choice: உருட்டி அகற்றப்பட்டிருப்பதை
  alternative: உருண்டு விலகியிருப்பதை
  rationale: கிரேக்க வடிவம் செயப்பாட்டை வெளிப்படுத்தினாலும் செயலைச் செய்தவர் யார் என்று கூறவில்லை. தமிழ் மொழிபெயர்ப்பு செயப்பாட்டைக் காத்து, செய்பவரை அடையாளப்படுத்தாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. மூலத்தின் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், நிறைவுற்ற செயப்பாட்டு வடிவத்தின் விளைவுநிலை பாதுகாக்கப்பட்டுள்ளது.
