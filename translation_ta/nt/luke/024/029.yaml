source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: ta
  text: அவர்கள் அவரை மிகவும் வற்புறுத்தி[a], “எங்களோடு தங்குங்கள்; ஏனெனில் மாலை நெருங்குகிறது, பொழுதும் ஏற்கெனவே சாய்ந்துவிட்டது[b]” என்றார்கள். அவர்களோடு தங்குவதற்கு அவர் உள்ளே சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அவரை விடாப்பிடியாக வேண்டிக்கொண்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “நாளும் ஏற்கெனவே முடிவை நெருங்கிவிட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: மிகவும் வற்புறுத்தி
  rationale: இங்கு நடுவினை வடிவம் உடல் வலுக்கட்டாயத்தைவிட தீவிரமான வேண்டுகோளையும் விடாப்பிடியான வற்புறுத்தலையும் குறிக்கிறது.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: எங்களோடு தங்கும்
  rationale: விருந்தோம்பல் சூழலில் μένω என்பது தொடர்ந்து அவர்களுடன் தங்குவதைக் குறிக்கிறது; ‘தங்கும்’ என்பது இயல்பான, மரியாதையுள்ள வேண்டுகோள் வடிவம்.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: ஏனெனில் மாலை நெருங்குகிறது
  rationale: πρὸς ἑσπέραν மாலை முழுமையாக வந்துவிட்டதைக் காட்டாமல், அது நெருங்குவதைச் சுட்டுகிறது.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: பொழுதும் ஏற்கெனவே சாய்ந்துவிட்டது
  rationale: κλίνω என்பதன் உருவகத்தை இயல்பான தமிழில் காத்து, பகற்பொழுது முடிவை நோக்கிச் சாய்ந்துவிட்ட நிலையைக் காட்டுகிறது.
- source_word: εἰσῆλθεν
  choice: உள்ளே சென்றார்
  rationale: வீடு அல்லது தங்குமிடத்துக்குள் சென்றதை இயல்பான கதைநடைத் தமிழில் தெரிவிக்கிறது.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: அவர்களோடு தங்குவதற்காக
  rationale: உருபேற்ற வினையெச்சம் இங்கு நோக்கத்தை வெளிப்படுத்துகிறது; σύν உடனிருப்பதைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தீவிர வற்புறுத்தல், மாலை நெருங்கும் காலநுணுக்கம், பொழுது சாயும் உருவகம் ஆகியவை காக்கப்பட்டுள்ளன.
