  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: ta
  text: ஆனால், வாரத்தின் முதல் நாளில்[a] மிக அதிகாலையில், அவர்கள் தயாரித்து வைத்திருந்த நறுமணப் பொருட்களை எடுத்துக்கொண்டு கல்லறைக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “ஓய்வுநாட்களின் முதல் நாளில்”; இது வாரத்தின் முதல் நாளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: ஆனால் வாரத்தின் முதல் நாளில்
  rationale: கிரேக்கத்தில் உள்ள செமித்திய-கொய்னே மரபுத்தொடர் வழக்கில் வாரத்தின் முதல் நாளைக் குறிக்கிறது. முந்தைய வசனத்தில் ஓய்வுநாள் குறிப்பிடப்பட்டிருப்பதால் δέ-யின் தொடர்ச்சி/மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὄρθρου βαθέως
  choice: விடியற்காலையிலேயே
  rationale: இந்தச் சொற்றொடர் விடியற்காலையின் மிகவும் தொடக்க நேரத்தை வலியுறுத்துகிறது. தமிழில் ‘விடியற்காலையிலேயே’ என்பது அந்த நேரவலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ἐπὶ τὸ μνῆμα
  choice: கல்லறைக்கு
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன் ἐπί இலக்கை நோக்கிய நகர்வைக் காட்டுகிறது; அடக்கச் சூழலில் μνῆμα என்பதற்குப் ‘கல்லறை’ இயல்பான தமிழ் சொல்.
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: இறந்தகால வினை அவர்கள் அங்கு வந்து சேர்ந்ததை எளிமையாக விவரிக்கிறது; தமிழ்க் கதைநடையில் ‘வந்தார்கள்’ இயல்பாக உள்ளது.
- source_word: φέρουσαι
  choice: எடுத்துக்கொண்டு
  rationale: முதன்மை வினையோடு ஒரே நேரத்தில் நடந்த செயலை இப்பெயரெச்சம் காட்டுகிறது; பொருட்களைக் கொண்டு வந்ததைத் தமிழில் ‘எடுத்துக்கொண்டு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: தாங்கள் ஆயத்தம் செய்திருந்த நறுமணப் பொருட்களை
  rationale: ἀρώματα என்பது அடக்கத்திற்குப் பயன்படுத்தப்பட்ட நறுமணமுள்ள பொருட்களைக் குறிக்கிறது. முன்பே ஆயத்தம் செய்யப்பட்ட செயலை ‘செய்திருந்த’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் நிகழ்வின் சூழலில் τῇ μιᾷ τῶν σαββάτων என்ற காலக் குறிப்பு
  choice: வாரத்தின் முதல் நாளில்
  alternative: ஓய்வுநாட்களில் முதலாவது நாளில்
  rationale: இது வழக்கமான காலக்குறிப்பு மரபுத்தொடராக இருப்பதால் அதன் பொருளைத் தமிழில் இயல்பாக வழங்குகிறது. சொற்சொல்லான மாற்று தமிழ் வாசகருக்கு தவறான நாட்காட்டி அல்லது பிரிவுசார் கருத்தை உணர்த்தக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விடியற்காலையிலேயே’ என்பது மிக அதிகாலையின் வலியுறுத்தலைக் கடினமான சொற்சொல் வடிவமின்றி காக்கிறது.
