id: LUK.24.38
reference: Luke 24:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் ஏன் கலங்கியிருக்கிறீர்கள்? உங்கள் இதயங்களில் ஏன் ஐயங்கள்[a] எழுகின்றன?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எண்ணங்கள்,” “சிந்தனைகள்.”
    reason: διαλογισμοὶ என்ற கிரேக்கச் சொல் சூழலில் ஐயங்களைக் குறிக்கக்கூடும்; அதேவேளை எண்ணங்கள் அல்லது சிந்தனைகள் என்ற பரந்த பொருளும் அதற்கு உண்டு.
lexical_decisions:
- source_word: Τί
  choice: ஏன்
  rationale: τί என்பதன் அடிப்படைப் பொருள் ‘என்ன’ என்றாலும், இங்கு εἰμί மற்றும் நிலையைச் சுட்டும் பெயரெச்சத்துடன் காரணத்தை வினவுவதால், இயல்பான தமிழில் ‘ஏன்’ என்பதே பொருத்தம்.
- source_word: τεταραγμένοι
  choice: கலங்கியிருக்கிறீர்கள்
  rationale: ταράσσω என்பதன் நிறைவுற்ற செயப்பாட்டு வடிவம், ஏற்பட்ட கலக்கத்தின் தொடரும் தற்போதைய நிலையைக் காட்டுகிறது; ‘கலங்கியிருக்கிறீர்கள்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διαλογισμοὶ
  choice: ஐயங்கள்
  rationale: இச்சொல் எண்ணங்கள், சிந்தனைகள், ஆராய்ச்சிகள் எனப் பரந்த பொருள் கொள்ளலாம். உயிர்த்தெழுந்த இயேசுவைக் கண்ட சீடர்களின் தயக்கமும் நம்பமுடியாமையும் இச்சூழலில் முன்னிலையில் இருப்பதால் ‘ஐயங்கள்’ பொருத்தமானது; சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀναβαίνουσιν
  choice: எழுகின்றன
  rationale: சொற்பொருளில் ‘மேலே வருகின்றன’ என்றாலும், உள்ளார்ந்த எண்ணச் செயல்பாட்டைக் குறிக்கும் இவ்விடத்தில் ‘எழுகின்றன’ என்பது துல்லியமும் இயல்பும் உடைய தமிழ் இணை.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: உங்கள் இதயங்களில்
  rationale: ஒருமை καρδίᾳ உடன் பன்மை ὑμῶν வருவது ஒவ்வொருவருக்கும் பகிர்ந்தளிக்கும் கிரேக்க அமைப்பு. தமிழில் குழுவிலுள்ள ஒவ்வொருவரையும் இயல்பாகக் குறிக்க ‘உங்கள் இதயங்களில்’ எனப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καρδία
  choice: இதயம்
  rationale: இங்கு ‘இதயம்’ உணர்ச்சியை மட்டும் அல்லாமல் எண்ணம், மனப்பாங்கு உள்ளிட்ட உள்ளார்ந்த மனிதரையும் குறிக்கிறது; ‘மனம்’ என்று மொழிபெயர்த்தால் பொருள் தேவையின்றிக் குறுகிவிடும்.
theological_decisions:
- issue: καρδία குறிக்கும் மனிதனின் உள்ளார்ந்த மையம்
  choice: இதயம்
  alternative: மனம் அல்லது உள்ளம்
  rationale: வேதாகமப் பயன்பாட்டில் இதயம் என்பது உணர்ச்சிகளோடு சிந்தனை மற்றும் மனப்பாங்கையும் உள்ளடக்குகிறது. ‘இதயம்’ என்பதைத் தக்கவைத்தல் மூலத்தின் மனிதவியல் உருவகத்தைப் பாதுகாக்கிறது.
- issue: διαλογισμοὶ என்பதன் சூழல்சார் எதிர்மறை நுட்பம்
  choice: ஐயங்கள்
  alternative: எண்ணங்கள் அல்லது சிந்தனைகள்
  rationale: உயிர்த்தெழுந்த இயேசுவின் தோற்றத்தைப் பற்றிய சீடர்களின் தயக்கத்தைச் சூழல் வலியுறுத்துவதால் ‘ஐயங்கள்’ தேர்ந்தெடுக்கப்பட்டது; எனினும் கிரேக்கச் சொல்லின் பரந்த பொருளை முடிவாக அடைத்துவிடாமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. இரண்டு காரண வினாக்களும் தனித்தனி வாக்கியங்களாக வழங்கப்பட்டுள்ளன. ‘கலங்கியிருக்கிறீர்கள்’ என்பது ஏற்பட்ட கலக்கத்தின் நீடிக்கும் நிலையையும், ‘இதயங்கள்’ என்பது மூலத்தின் உள்ளார்ந்த மனிதர் என்ற உருவகத்தையும் காக்கிறது.
