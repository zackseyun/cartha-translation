  source_fidelity: மூலக் கிரேக்கத்தின் இரண்டு காரணவினாக்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. «கலங்கியிருக்கிறீர்கள்» τεταραγμένοι என்பதன் தொடரும் கலக்கநிலையை நன்றாக வெளிப்படுத்துகிறது; «ஐயங்கள் ... எழுகின்றன» இச்சூழலில் διαλογισμοὶ ἀναβαίνουσιν என்பதற்குப் பொருத்தமான மொழிபெயர்ப்பு. «உங்கள் இதயங்களில்» என்பது பன்மைச் செவிமடுப்போருக்கான இயல்பான தமிழ் வடிவம்; கிரேக்க ஒருமை καρδίᾳ-யின் பகிர்ந்தளிக்கும் பயன்பாட்டுடன் முரண்படவில்லை.
  naturalness: நவீன பொதுத்தமிழிலும் மரியாதைமிக்க வேதாகம நடையிலும் வாசகம் இயல்பாக உள்ளது. இரண்டு வினாக்களைத் தனித்தனியாக அமைத்திருப்பது தெளிவானதும் பேச்சுநடைக்கு ஏற்றதுமாகும்.
  terminology: «இதயம்» καρδία-வின் வேதாகம உள்ளார்ந்த-மனிதர் உருவகத்தைப் பாதுகாக்கிறது. «ஐயங்கள்» சூழலுக்கேற்ற தேர்வு; மாற்றுச் சொற்களை அடிக்குறிப்பு வழங்குவதால் διαλογισμοὶ என்பதன் விரிவான பொருள்வாய்ப்பு தேவையின்றி மூடப்படவில்லை.
