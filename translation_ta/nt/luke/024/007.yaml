source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: ta
  text: “மனிதகுமாரன் பாவமுள்ள மனிதர்களின் கைகளில் ஒப்படைக்கப்பட்டு[a], சிலுவையில் அறையப்பட்டு, மூன்றாம் நாளில் உயிர்த்தெழ வேண்டும்[b]” என்று அவர் கூறியதை நினைவுகூருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “பாவமுள்ள மனிதர்களின் கைகளில் ஒப்புக்கொடுக்கப்பட்டு.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உயிர்த்தெழ வேண்டும்.” கிரேக்கத்தில் இங்குள்ள வினை செயவினை வடிவில் உள்ளது; “உயிர்த்தெழுப்பப்பட வேண்டும்” என்ற செயப்பாட்டு வடிவில் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: என்று அவர் சொன்னார்
  rationale: முந்தைய வசனத்தில் தொடங்கும் நினைவுகூரும் அழைப்போடு தொடர்புடைய நிகழ்காலப் பங்கேற்புவினை. தனி வசனமாகவும் இயல்பாகப் புரியும்படி தமிழில் வாக்கியமுற்ற வடிவில் தரப்பட்டுள்ளது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: நற்செய்தி நூல்களில் இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் அடையாளப் பெயரின் பரவலாக அறியப்பட்ட தமிழ் வடிவம்; அதன் வேதாகம இடைநூல் ஒலிப்பையும் காக்கிறது.
- source_word: ὅτι δεῖ
  choice: வேண்டும்
  rationale: இது வெறும் எதிர்கால முன்னறிவிப்பு அல்ல; நிறைவேற வேண்டிய கட்டாயத்தை வெளிப்படுத்துகிறது. ‘வேண்டும்’ அந்த வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: παραδοθῆναι
  choice: ஒப்படைக்கப்பட்டு
  rationale: ஒருவரை மற்றவர்களின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் செயப்பாட்டு வினை. ‘காட்டிக்கொடுக்கப்பட்டு’ என்பதைக் காட்டிலும் இது யூதாசின் துரோகச் செயலுக்கு மட்டும் பொருளைக் குறுக்காமல், பரந்த நிகழ்வைக் குறிக்கிறது.
- source_word: εἰς χεῖρας
  choice: கைகளில்
  rationale: மற்றவர்களின் அதிகாரத்திற்குள் கொடுக்கப்படுதல் என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: பாவிகளான மனிதர்கள்
  rationale: ‘மனிதர்கள்’ என்ற மூலச் சொல்லையும் அவர்களின் பாவத்தன்மையைச் சுட்டும் பெயரடையையும் வெளிப்படையாகக் காக்கிறது; இங்கு இயேசுவைக் கைது செய்து மரணத்திற்கு உட்படுத்தும் மனித முகவர்கள் குறிக்கப்படுகின்றனர்.
- source_word: σταυρωθῆναι
  choice: சிலுவையில் அறையப்பட்டு
  rationale: சிலுவைத் தண்டனையைத் துல்லியமாகவும் வழக்கமான தமிழிலும் குறிக்கிறது.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் மூலமொழி அமைப்பின் இயல்பான தமிழ் வடிவம்.
- source_word: ἀναστῆναι
  choice: உயிர்த்தெழ
  rationale: மூலத்தில் உள்ள செய்பாட்டு, தன்னிலை எழுச்சிப் பொருளைத் தமிழில் இயல்பாகக் காக்கிறது; ‘உயிர்த்தெழுப்பப்பட’ என்ற செயப்பாட்டு வடிவமாக மாற்றவில்லை.
theological_decisions:
- issue: இயேசுவின் பாடு குறித்த முன்னறிவிப்பில் δεῖ என்பதன் வலிமை
  choice: வேண்டும்—இறைத் திட்டத்தின்படி நிறைவேற வேண்டிய கட்டாயம்
  alternative: நடக்கும்—வெறும் எதிர்கால முன்னறிவிப்பு
  rationale: லூக்காவின் பயன்பாட்டில் δεῖ பொதுவாக இறைவனுடைய மீட்புத் திட்டத்தில் நிறைவேற வேண்டியதைக் குறிக்கிறது. ‘வேண்டும்’ அந்த இறையியல் வலிமையை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- issue: ἀναστῆναι என்பதன் வினை வடிவம்
  choice: உயிர்த்தெழ—செய்பாட்டு வடிவம்
  alternative: உயிர்த்தெழுப்பப்பட—செயப்பாட்டு வடிவம்
  rationale: இந்த இடத்திலுள்ள கிரேக்க வினை செய்பாட்டு வடிவில் உள்ளது. வேறு இடங்களின் செயப்பாட்டு உயிர்த்தெழுதல் மொழியை இங்கு இறக்குமதி செய்யாமல் மூலத்தின் இலக்கண நுணுக்கம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்’, ‘சிலுவையில் அறையப்பட்டு’, ‘உயிர்த்தெழ’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தெளிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன. வசனம் தனியாக வாசிக்கப்படும்போதும் முழு வாக்கியமாக இருக்க, பங்கேற்புவினை தமிழில் ‘என்று அவர் சொன்னார்’ என இயல்பாக்கப்பட்டுள்ளது.
