reference: Luke 24:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: ta
  text: அவர்கள் மகதலேனா மரியாளும், யோவன்னாளும், யாக்கோபின் தாய் மரியாளும்[a], அவர்களுடன் இருந்த மற்ற பெண்களும் ஆவார்கள். அவர்கள் இவற்றை அப்போஸ்தலர்களிடம் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்சொல்லாக, “யாக்கோபின் மரியாள்.” இது பெரும்பாலும் “யாக்கோபின் தாய் மரியாள்” என்று பொருள்படும்; “யாக்கோபின் மனைவி மரியாள்” என்றும் இருக்க வாய்ப்புள்ளது.
    reason: மூலமொழியில் உறவுமுறை வெளிப்படையாகக் கூறப்படாததால் மாற்றுப் புரிதலைக் காக்கிறது.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: அவர்கள் ... ஆகியோர்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பெண்களை இப்போது பெயரிட்டு அடையாளப்படுத்துகிறது; δέ-யின் மென்மையான உரைத் தொடர்ச்சியைத் தமிழில் கட்டாயமான தனிச்சொல்லாகச் சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: மகதலேனா மரியாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்; ஊர்சார் அடைமொழியையும் தனிப்பெயரையும் தெளிவாகக் காக்கிறது.
- source_word: Ἰωάννα
  choice: யோவன்னாள்
  rationale: பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Μαρία ἡ Ἰακώβου
  choice: யாக்கோபின் தாய் மரியாள்[a]
  rationale: கிரேக்கத்தில் உறவு வெளிப்படையாகச் சொல்லப்படாமல் ‘யாக்கோபினுடைய மரியாள்’ எனச் சுருக்கமாக உள்ளது. சூழல் மற்றும் பெயரிடும் மரபின் அடிப்படையில் ‘தாய்’ என்பது மிகச் சாத்தியமான, தமிழில் தெளிவான வாசிப்பு; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: அவர்களுடன் இருந்த மற்ற பெண்கள்
  rationale: பெண்பால் பன்மை வடிவத்தால் உள்ளடங்கிய ‘பெண்கள்’ என்பதைத் தமிழில் வெளிப்படையாகக் கூறி இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: நிறைவுறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயற்பாங்கை வெளிப்படுத்துகிறது.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: அப்போஸ்தலர்களிடம்
  rationale: இயேசுவின் அப்போஸ்தலக் குழுவைக் குறிக்கும் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ் திருச்சொல்.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்னர் விவரிக்கப்பட்ட நிகழ்வுகளையும் செய்தியையும் சுட்டும் பன்மையைத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் காக்கிறது.
theological_decisions:
- issue: Μαρία ἡ Ἰακώβου என்பதில் யாக்கோபுக்கும் மரியாளுக்கும் உள்ள உறவு
  choice: யாக்கோபின் தாய் மரியாள்
  alternative: யாக்கோபுக்குரிய மரியாள்; அல்லது யாக்கோபின் மனைவி மரியாள்
  rationale: கிரேக்க மூலத்தில் உறவுமுறை விடுபட்டுள்ளது. நற்செய்தி நூல்களின் பெயரிடும் வழக்கில் மகனைக் கொண்டு தாயை அடையாளப்படுத்துவது மிகவும் சாத்தியம்; எனினும் ‘மனைவி’ என்ற புரிதலும் இலக்கணரீதியாக முற்றிலும் விலக்கப்பட முடியாததால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பெயர்களுக்கு அறியப்பட்ட தமிழ் வேதாகம வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. இரண்டு கிரேக்க முதன்மை வாக்கியங்களின் அமைப்பும் இரண்டு தமிழ் வாக்கியங்களாகக் காக்கப்பட்டுள்ளது; ἔλεγον என்பதன் தொடர்ச்சிப் பண்பு ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்பதால் வெளிப்படுகிறது.
