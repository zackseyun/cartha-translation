  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: ta
  text: அவர் அவர்களிடம், “மேசியா துன்பப்படவும், மூன்றாம் நாளில் இறந்தோரிடமிருந்து உயிர்த்தெழவும் இவ்வாறு எழுதப்பட்டுள்ளது,” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: நிறைவுற்ற செயப்பாட்டு வடிவம், வேதத்தில் எழுதப்பட்டிருப்பது தொடர்ந்து நிலைத்திருப்பதைக் குறிக்கும் வழக்கமான வேதவாக்கிய அறிமுகமாக உள்ளது.
- source_word: παθεῖν
  choice: துன்பப்பட்டு
  rationale: இறந்தகால முடிவிலி வடிவத்தை அடுத்துள்ள ἀναστῆναι என்பதோடு இயல்பாக இணைக்கிறது; தனியாக ‘வேண்டும்’ என்பதை இச்சொல்லில் சேர்க்காமல், தமிழ் உள்ளடக்க வாக்கியத்தின் இறுதியில் ஒருமுறை தருகிறது.
- source_word: τὸν χριστόν
  choice: மேசியா
  rationale: கட்டுரையுடன் வரும் Χριστός இங்கு பெயரைப் போல அல்லாமல், அபிஷேகம் செய்யப்பட்டவர் என்ற யூத வேதப்பின்னணி கொண்ட பட்டமாகச் செயல்படுகிறது.
- source_word: ἀναστῆναι
  choice: உயிர்த்தெழ
  rationale: செய்வினை வடிவத்தையும் உயிர்த்தெழுதல் சார்ந்த பொருளையும் காக்கிறது; ‘உயிர்த்தெழுப்பப்பட’ என்ற செயப்பாட்டு பொருளை இறக்குமதி செய்யவில்லை.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிடமிருந்து
  rationale: ἐκ என்பதன் ‘இடையிலிருந்து/இருந்து’ என்ற உறவையும் νεκρῶν என்பதன் பன்மைத் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: எழுதப்பட்டுள்ள உள்ளடக்கம் அல்லது விதத்தை அறிமுகப்படுத்தும் சொல்லின் பொருளையும் சற்று உயர்ந்த வேதமொழி நடையையும் காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: எழுதப்பட்டுள்ளதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι-ஐ இயல்பான தமிழ் மேற்கோள் உருபால் தருகிறது.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு கட்டுரையுடன் வரும் சொல் பட்டமாகச் செயல்படுகிறது; ‘மேசியா’ என்பது அபிஷேகம் செய்யப்பட்ட அரசர் பற்றிய வேதப்பின்னணியைத் தெளிவாகக் காக்கிறது.
- issue: ἀναστῆναι என்ற உயிர்த்தெழுதல் வினையின் குரல்
  choice: உயிர்த்தெழ
  alternative: உயிர்த்தெழுப்பப்பட
  rationale: கிரேக்கத்தில் செய்வினை முடிவிலி இருப்பதால் அதையே முதன்மை உரையில் காக்கிறது; செயப்பாட்டு வடிவமாக மாற்றி வசனத்தில் இல்லாத இலக்கண நுணுக்கத்தைச் சேர்க்கவில்லை.
- issue: முடிவிலிகளின் கட்டமைப்பில் அவசியப் பொருள்
  choice: துன்பப்பட்டு... உயிர்த்தெழ வேண்டும் என்று
  alternative: துன்பப்படுவார்... உயிர்த்தெழுவார் என்று
  rationale: தமிழில் γέγραπται என்பதற்குப் பின் வரும் முடிவிலி உள்ளடக்கத்தைத் தெளிவாகக் காட்ட ‘வேண்டும்’ இயல்பாக உதவுகிறது. எனினும் இது தெய்வீக அவசியத்தை மிகைப்படுத்தாமல், எழுதப்பட்டிருந்த நிகழ்வின் நிர்ணயத்தைச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதநடை. கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், ‘என்று’ அமைப்பைத் தமிழுக்கு இயல்பாக வைத்துள்ளது; அதேவேளை மூலத்தின் செய்வினை உயிர்த்தெழுதல் வடிவமும் ‘இறந்தோரிடமிருந்து’ என்ற பன்மை நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
