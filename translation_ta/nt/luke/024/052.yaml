lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: கிரேக்க இணைப்புச்சொல் எளிய கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வசனத் தொடக்கத்தில் தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது இயல்பற்றதாகவோ கூடுதல் காலநுணுக்கம் தருவதாகவோ இருக்கும்; ஆகவே தொடர்ச்சி வாக்கிய அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: αὐτοὶ
  choice: அவர்கள்
  rationale: வெளிப்படையாக உள்ள பன்மைச் சுட்டுப்பெயர் தமிழில் இயல்பாக ‘அவர்கள்’ என்று மொழிபெயர்க்கப்படுகிறது; ‘அவர்களே’ என்பது சூழலில் தேவையற்ற அளவு வலியுறுத்தும்.
- source_word: προσκυνήσαντες αὐτόν
  choice: அவரைப் பணிந்து வணங்கிய பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. ‘பணிந்து வணங்குதல்’ என்பது προσκυνέω என்பதிலுள்ள உடல் பணிவையும் வழிபாட்டு வலிமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὑπέστρεψαν
  choice: திரும்பினார்கள்
  rationale: முந்தைய இடத்திற்குச் செல்வதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: εἰς Ἰερουσαλὴμ
  choice: எருசலேமுக்குத்
  rationale: நகரத்தை நோக்கிய இயக்கத்தைத் தமிழின் இலக்கு வேற்றுமை உருபுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: மிகுந்த மகிழ்ச்சியோடு
  rationale: χαρά என்ற மகிழ்ச்சியையும் μεγάλη தரும் தீவிரத்தையும் தெளிவான நவீன தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவை நோக்கிய προσκυνέω என்பதன் மொழியாக்கம்
  choice: அவரைப் பணிந்து வணங்கிய
  alternative: அவர் முன் பணிந்த / அவருக்கு மரியாதை செலுத்திய
  rationale: உயிர்த்தெழுதல் மற்றும் விண்ணேற்றச் சூழலில் இச்சொல் வெறும் மரியாதையைவிட வலிமையான வழிபாட்டு அர்த்தம் கொண்டிருக்கலாம்; அதேவேளை அதன் பணிந்து விழும் உடல்சார் நுணுக்கத்தையும் ‘பணிந்து வணங்கிய’ தக்கவைக்கிறது.
- issue: ⸂[προσκυνήσαντες αὐτόν]⸃ என்ற உரைவேறுபாடு
  choice: முதன்மை உரையில் சேர்த்து, அடிக்குறிப்பில் ஐயத்தைக் குறிப்பிடுதல்
  alternative: ‘அவரைப் பணிந்து வணங்கிய பின்பு’ என்பதை விடுதல்
  rationale: வழங்கப்பட்ட விமர்சன கிரேக்க உரையில் இச்சொற்றொடர் உள்ளபோதிலும் அதன் உரைநிலை ஐயத்திற்குரியதாகக் குறிக்கப்பட்டுள்ளது; எனவே அதை உரையில் வைத்துப் பிரதிகளின் வேறுபாட்டை வெளிப்படையாகப் பதிவு செய்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. προσκυνέω என்பதன் வழிபாடு மற்றும் பணிவு ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாகப் பாதுகாக்க ‘பணிந்து வணங்கிய’ பயன்படுத்தப்பட்டது.
