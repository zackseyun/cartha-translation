source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: ta
  text: 'இவ்வாறு நிகழ்ந்தது: அவர் அவர்களை ஆசீர்வதித்துக்கொண்டிருக்கையில், அவர் அவர்களைவிட்டுப் பிரிந்து, பரலோகத்திற்கு எடுத்துச் செல்லப்பட்டார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘பரலோகத்திற்கு எடுத்துச் செல்லப்பட்டார்’ என்ற சொற்கள் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: தனியாக மொழிபெயர்க்காமல், ‘…போது’ என்ற இயல்பான தமிழ் வாக்கிய அமைப்பில் அதன் நிகழ்வு-அறிமுகப் பணி வெளிப்படுத்தப்பட்டது
  rationale: லூக்காவின் நிகழ்வு-அறிமுகச் சூத்திரத்தைச் சொற்குச் சொல் ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இங்கு தமிழில் செயற்கையாக இருக்கும்; காலநிலைத் துணைவாக்கிய அமைப்பு அதன் உரையாடல் பணியை இயல்பாகத் தருகிறது.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: அவர் அவர்களை ஆசீர்வதித்துக்கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் articular infinitive ஒரே நேரத்தில் நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது; ‘ஆசீர்வதித்துக்கொண்டிருந்தபோது’ அதன் தொடர்ச்சியையும் சமகால நிகழ்வையும் தெளிவாகக் காட்டுகிறது.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: அவர்களைவிட்டுப் பிரிந்து
  rationale: διΐστημι இங்கு உடல் ரீதியான பிரிவை அல்லது விலகிச் செல்வதைக் குறிக்கிறது; ‘பிரிந்து’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀνεφέρετο
  choice: எடுத்துக்கொள்ளப்பட்டார்
  rationale: செயப்பாட்டு வடிவத்தையும் மேல்நோக்கிய எடுத்துச் செல்லப்படுதலையும் பாதுகாக்கிறது; செயலைச் செய்தவர் யார் என்பதை உரையில் இல்லாதவாறு வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: εἰς τὸν οὐρανόν
  choice: பரலோகத்துக்கு
  rationale: இச்சூழலில் οὐρανός வெறும் வானத்தை அல்ல, பரலோகத்தைக் குறிக்கிறது; ‘பரலோகத்துக்கு’ நவீனத் தமிழில் இயல்பான திசைநிலை வடிவம்.
theological_decisions:
- issue: அடைப்புக்குறியிடப்பட்ட καὶ ἀνεφέρετο εἰς τὸν οὐρανόν என்ற வாசகத்தின் உரைவேறுபாடு
  choice: முதன்மை உரையில் சேர்த்து, உரைவேறுபாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘பரலோகத்துக்கு எடுத்துக்கொள்ளப்பட்டார்’ என்ற சொற்றொடரை விடுதல்
  rationale: SBLGNT இச்சொற்றொடரை சந்தேகத்தைக் குறிக்கும் அடைப்புக்குறிகளுக்குள் தருகிறது. வழங்கப்பட்ட மூல உரையில் அது இருப்பதால் மொழிபெயர்க்கப்படுகிறது; ஆயினும் கையெழுத்துப் பிரதிகளின் முக்கிய வேறுபாடு மறைக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசீர்வதித்துக்கொண்டிருந்தபோது’ தொடர்ச்சியான செயலைத் தெளிவுபடுத்துகிறது; ‘எடுத்துக்கொள்ளப்பட்டார்’ செயப்பாட்டு நுணுக்கத்தையும் குறிப்பிடப்படாத செயற்படுத்துநரையும் பாதுகாக்கிறது.
