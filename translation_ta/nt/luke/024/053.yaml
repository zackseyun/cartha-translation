  text: And they were continually in the temple[a], blessing God.
translation:
  language: ta
  text: அவர்கள் எப்போதும் ஆலயத்தில் இருந்து, கடவுளைப் போற்றிக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளை வாழ்த்திக்கொண்டிருந்தார்கள்.” கிரேக்க வினைச்சொல்லுக்கு நேரடியாக “வாழ்த்துதல்” அல்லது “நல்வார்த்தை கூறுதல்” என்று பொருள்; கடவுளை நோக்கி வரும்போது அது அவரைப் போற்றுதல் என்ற கருத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: தமிழில் முந்தைய நிகழ்வின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்த தனி ‘மற்றும்’ தேவையில்லை; எழுவாயைத் தொடக்கத்தில் அமைப்பது இயல்பான நடை.
- source_word: ἦσαν
  choice: இருந்து ... கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் நீடித்த செயலைக் குறிக்கும் imperfect வடிவத்தின் தொடர்நிலையைத் தமிழ் வினை அமைப்பு வெளிப்படுத்துகிறது.
- source_word: διὰ παντός
  choice: எப்போதும்
  rationale: இந்த மரபுத்தொடர் தொடர்ச்சியான அல்லது வழக்கமான நிலைத்த செயல்பாட்டைக் குறிக்கிறது; ‘எப்போதும்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது; ‘ஆலயம்’ தமிழில் வழக்கமான விரிவான சொல்.
- source_word: εὐλογοῦντες
  choice: போற்றிக்கொண்டிருந்தார்கள்
  rationale: கடவுளை நோக்கிய εὐλογέω என்பது அவரை வாழ்த்துதல், நன்றியுடன் புகழ்ந்து பேசுதல் என்ற பொருளைத் தருகிறது; நவீன தமிழில் ‘கடவுளை ஆசீர்வதித்தல்’ தவறான எதிர்திசை உணர்வை ஏற்படுத்தக்கூடும் என்பதால் ‘போற்றுதல்’ இயல்பான பொருள்-நெருக்கமான தேர்வு.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: வினையின் நேரடிச் செயப்படுபொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: εὐλογοῦντες τὸν θεόν என்ற இறைவழிபாட்டு மொழியின் மொழிபெயர்ப்பு
  choice: கடவுளைப் போற்றிக்கொண்டிருந்தார்கள்
  alternative: கடவுளை வாழ்த்திக்கொண்டிருந்தார்கள் / கடவுளைப் புகழ்ந்துகொண்டிருந்தார்கள்
  rationale: மூல வினை αἰνέω (‘புகழ்தல்’) அல்ல, εὐλογέω (‘நல்வார்த்தை கூறுதல்/வாழ்த்துதல்’). ‘போற்றுதல்’ கடவுளைப் பற்றிப் புகழ்ந்து நன்றியுடன் பேசும் பொருளை இயல்பான தமிழில் தருகிறது; அடிக்குறிப்பு சொற்பொருளின் பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ஆலய வழிபாட்டு மொழிக்கு ஏற்ற வகையில் ‘போற்றுதல்’ பயன்படுத்தப்பட்டுள்ளது; இறையியல் சார்ந்த தனிப்பிரிவு வழக்குகள் தவிர்க்கப்பட்டுள்ளன.
