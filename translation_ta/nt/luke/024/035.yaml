  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: ta
  text: அவர்களே, வழியில் நடந்தவற்றையும், அப்பத்தைப் பிட்டபோது[b] அவர் தங்களுக்குத் தெரியவந்த விதத்தையும் விவரித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைத் தாங்கள் எப்படி அடையாளம் கண்டார்கள்.” கிரேக்கத்தில் செயப்பாட்டு வினை உள்ளது; அது அவர்கள் அவரை அடையாளம் கண்டதையோ, அவர் அவர்களுக்குத் தெரியப்படுத்தப்பட்டதையோ வலியுறுத்தலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அப்பம் பிட்டபோது.” கிரேக்கத் தொடரைப் பொதுவாகவும் புரிந்துகொள்ளலாம்; ஆனால் இங்கு முன்பு விவரிக்கப்பட்ட குறிப்பிட்ட உணவைக் குறிக்கும் வகையில் “அப்பத்தை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: அவர்களும்
  rationale: வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட பிரதிப்பெயரை, முன்பு பேசிக்கொண்டிருந்தவர்களோடு இவ்விருவரும் தங்கள் அனுபவத்தைப் பகிர்ந்தார்கள் என்ற சூழலோடு இயல்பாக இணைக்கிறது.
- source_word: ἐξηγοῦντο
  choice: விவரித்தார்கள்
  rationale: நிகழ்ந்தவற்றை எடுத்துரைத்தல் அல்லது வரிசையாகச் சொல்லுதல் என்ற பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; இறந்தகால வடிவம் கிரேக்க இறந்தகாலத் தொடர்நிலையின் சூழல்சார் கதையாடல் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: வழியில் நடந்தவற்றை
  rationale: கிரேக்கத்தில் மறைமுகமாக உள்ள ‘நிகழ்ந்தவை’ என்ற பொருளை இயல்பான தமிழுக்காக வெளிப்படையாக்குகிறது.
- source_word: ὡς
  choice: எப்படி
  rationale: அவர்கள் கூறிய செய்தியின் விதத்தையும் நிகழ்வையும் அறிமுகப்படுத்தும் கிரேக்கச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: ἐγνώσθη
  choice: அவர் தங்களுக்கு எப்படி அறியப்பட்டார்
  rationale: செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, சீடர்கள் அவரை அடையாளம் கண்டார்கள் என்பதற்கும் அவர் அவர்களுக்குத் தெரியப்படுத்தப்பட்டார் என்பதற்கும் இடையிலான நுட்பமான திறந்தநிலையைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: அப்பத்தைப் பிட்டபோது
  rationale: குறிப்பிட்ட உணவுச் சூழலையும் அப்பம் பிட்கும் செயலையும் தெளிவாகவும் இயல்பாகவும் தருகிறது; கிரேக்கப் பெயர்ச்சொல் தொடரை தமிழில் காலவினையெச்சத் தொடராக மொழிபெயர்ப்பது இயல்பானது.
theological_decisions:
- issue: ἐγνώσθη என்பது சீடர்களின் அடையாளம் காணுதலை மட்டும் குறிக்கிறதா, அல்லது அவர் அவர்களுக்குத் தெரியப்படுத்தப்பட்டார் என்ற செயப்பாட்டு நுட்பத்தையும் கொண்டுள்ளதா?
  choice: அவர் தங்களுக்கு எப்படி அறியப்பட்டார்
  alternative: அவரைத் தாங்கள் எப்படி அடையாளம் கண்டார்கள்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, மனித உணர்தலுக்கும் அவர்களுக்குக் கொடுக்கப்பட்ட வெளிப்பாட்டுக்கும் இடையிலான லூக்காவின் கதையாடல் நெருக்கடியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. “அறியப்பட்டார்” என்பது வழக்கமான பேச்சில் சற்றே உயர்ந்த நடையாக இருந்தாலும், மூலத்தின் செயப்பாட்டு வடிவத்தையும் அதன் திட்டமிட்ட தெளிவின்மையையும் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது.
