- from: அவர்களும், வழியில் நடந்தவற்றையும், அப்பத்தைப் பிட்டபோது[b] அவர் தங்களுக்கு எப்படி அறியப்பட்டார்[a] என்பதையும் விவரித்தார்கள்.
  to: அவர்களே, வழியில் நடந்தவற்றையும், அப்பத்தைப் பிட்டபோது[b] அவர் தங்களுக்குத் தெரியவந்த விதத்தையும் விவரித்தார்கள்[a].
