  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: ta
  text: அந்த நேரத்திலேயே அவர்கள் எழுந்து எருசலேமுக்குத் திரும்பினார்கள். ஒன்றுகூடியிருந்த பதினொருவரையும் அவர்களோடு இருந்தவர்களையும் கண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடியிருந்த.” கிரேக்கச் சொல், அவர்கள் கண்டபோது பதினொருவரும் அவர்களோடு இருந்தவர்களும் ஏற்கெனவே ஒன்றுகூடிய நிலையில் இருந்ததைக் குறிக்கிறது.
