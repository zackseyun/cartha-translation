lexical_decisions:
- source_word: ἀναστάντες
  choice: எழுந்து
  rationale: இறந்தோரிலிருந்து உயிர்த்தெழுதலைக் குறிக்காமல், முதன்மை வினைக்கு முன் அவர்கள் மேற்கொண்ட உடல்சார்ந்த செயலை இச்சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: அந்த நேரத்திலேயே
  rationale: குறிப்பிட்ட அதே நேரத்தையும் உடனடித்தன்மைக்கான அழுத்தத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὑπέστρεψαν
  choice: திரும்பினார்கள்
  rationale: முன்பு புறப்பட்ட இடமான எருசலேமுக்குத் திரும்பிச் சென்றதைக் குறிக்கும் இயல்பான பயணச் சொல்.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: εὗρον
  choice: கண்டார்கள்
  rationale: அவர்கள் சென்றடைந்தபோது அங்கிருந்தவர்களைக் கண்டார்கள் என்ற சாதாரண கதைநடைப் பொருளை வழங்குகிறது.
- source_word: ἠθροισμένους
  choice: ஒன்றுகூடியிருந்ததை
  rationale: முற்றுப்பெற்ற செயப்பாட்டு எச்சம், அவர்கள் கண்டபோது அந்த மக்கள் ஏற்கெனவே ஒன்றுகூடிய நிலையில் இருந்ததைச் சுட்டுகிறது.
- source_word: τοὺς ἕνδεκα
  choice: பதினொருவர்
  rationale: கிரேக்கத்தில் உள்ள குழுப் பெயரை நேரடியாகத் தருகிறது; மூலத்தில் இல்லாத ‘அப்போஸ்தலர்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: τοὺς σὺν αὐτοῖς
  choice: அவர்களோடு இருந்தவர்கள்
  rationale: பதினொருவருடன் இருந்த மற்றவர்களைக் குறிப்பிடுகிறது; அவர்களின் அடையாளத்தை ஊகித்துச் சேர்க்கவில்லை.
theological_decisions:
- issue: யூதாஸ் இல்லாத நிலையிலும், தோமா அப்போது இருந்தாரா என்ற கேள்வி எழும் நிலையிலும் ‘பதினொருவர்’ என்ற குறிப்பு
  choice: ‘பதினொருவர்’ என்ற குழுப் பெயரை அப்படியே வைத்தல்
  alternative: ‘பதினொரு அப்போஸ்தலர்கள்’ அல்லது ‘மீதமிருந்த சீடர்கள்’
  rationale: τοὺς ἕνδεκα என்பது லூக்கா பயன்படுத்தும் குழுக் குறிப்பு. சரியாக யார் அங்கு இருந்தார்கள் என்பதை ஒத்திசைத்து விளக்காமல், மூலத்தின் பதற்றத்தையும் சொல்லாட்சியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த நேரத்திலேயே’ என்பது காலத்திற்கான அழுத்தத்தைத் தக்கவைக்கிறது. இரண்டாவது வாக்கியத்தின் அமைப்பு, ‘ஒன்றுகூடியிருந்ததை’ என்பது பதினொருவருக்கும் அவர்களோடு இருந்தவர்களுக்கும் சேர்ந்து பொருந்துவதைத் தெளிவாக்குகிறது.
