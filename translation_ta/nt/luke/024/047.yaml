  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: ta
  text: மேலும், மனந்திரும்புதலும் பாவமன்னிப்பும் அவருடைய பெயரில் எல்லா நாடுகளிலும் அறிவிக்கப்பட வேண்டும்[b]—எருசலேமிலிருந்து தொடங்கி.
  philosophy: optimal-equivalence
