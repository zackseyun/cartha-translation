- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: அவருடைய பெயரில்
  rationale: இயேசுவின் அதிகாரத்தையும் அவரை அடிப்படையாகக் கொண்ட அறிவிப்பையும் குறிக்கும் கிரேக்கச் சொல்லாட்சிக்கு இயல்பான தமிழ் இணை.
- source_word: μετάνοιαν
  choice: மனந்திரும்புதல்
  rationale: வெறும் எண்ணமாற்றம் என்பதைக் காட்டிலும், மனமும் வாழ்க்கைத் திசையும் கடவுளை நோக்கித் திரும்புவதைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ்.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: பாவமன்னிப்பு
  rationale: ἄφεσις என்பதன் விடுவிப்பு/மன்னிப்பு நுணுக்கங்களில், பாவங்கள் குறித்த இச்சூழலுக்கு ‘பாவமன்னிப்பு’ துல்லியமும் இயல்பும் உடையது.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: எல்லா நாடுகளுக்கும்
  rationale: உலகளாவிய மக்கள் சமூகங்களைக் குறிக்கும் பரப்பைத் தக்கவைக்கிறது; யூதரல்லாதவர்களுக்கு மட்டும் என்று தேவையின்றிக் குறுக்கவில்லை.
