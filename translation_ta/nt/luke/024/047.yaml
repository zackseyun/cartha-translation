  choice: எருசலேமிலிருந்து தொடங்கி
  rationale: அறிவிப்பின் தொடக்க இடத்தையும் ἀπό என்பதன் ‘இலிருந்து’ என்ற திசைநுணுக்கத்தையும் இயல்பாகக் காக்கிறது.
theological_decisions:
