  choice: ‘பாவமன்னிப்புக்கான மனந்திரும்புதல்’ என்று நெருங்கிய தொடர்பைக் காட்டுதல்
  alternative: ‘மனந்திரும்புதலும் பாவமன்னிப்பும்’ என்று இரு இணையான கூறுகளாகக் காட்டுதல்
  rationale: கிரேக்கத்தில் இரு பெயர்ச்சொற்களையும் இணையான அறிவிப்புப் பொருள்களாகப் புரிந்துகொள்ள வாய்ப்புள்ளது; அதேவேளை அவற்றை நோக்கத் தொடர்பில் வாசிப்பதும் இயல்பானது. முதன்மை உரை தொடர்பைக் காட்டுகிறது; அடிக்குறிப்பு உண்மையான இலக்கண மாற்றுவாய்ப்பை பாதுகாக்கிறது.
- issue: ἔθνη என்பதன் பொருள்
  choice: ‘எல்லா நாடுகளுக்கும்’
  alternative: ‘யூதரல்லாத எல்லா மக்களுக்கும்’
  rationale: உயிர்த்தெழுதல்-பணிக்கட்டளைச் சூழலில் உலகளாவிய பரப்பே முன்னிலையில் உள்ளது; ‘நாடுகள்’ என்பது யூதரல்லாத மக்களை உள்ளடக்கினாலும் அவர்களுக்கே மட்டும் பொருளைச் சுருக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மனந்திரும்புதல்’, ‘பாவமன்னிப்பு’ ஆகிய பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டன. முதன்மை உரை இயல்பான தமிழ் ஓட்டத்தைக் கொண்டிருக்க, கிரேக்கத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
