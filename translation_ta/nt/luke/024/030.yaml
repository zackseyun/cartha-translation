source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: ta
  text: அவர் அவர்களோடு உணவுக்கு அமர்ந்தபோது[a], அப்பத்தை எடுத்து, அதை ஆசீர்வதித்து, பிட்டு, அவர்களுக்குக் கொடுக்கத் தொடங்கினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல், பண்டைய உணவுமுறையின்படி மேசையருகே சாய்ந்து படுத்திருப்பதை இன்னும் குறிப்பாகச் சுட்டுகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவர்களுக்குக் கொடுத்துக்கொண்டிருந்தார்.” கிரேக்க இறந்தகால வினைவடிவம் தொடர்ந்து நடந்த செயலைக் குறிக்கலாம்; “கொடுக்கத் தொடங்கினார்” என்பது இங்கு அந்தச் செயலின் தொடக்கத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: தமிழில் தனியாக மொழிபெயர்க்காமல் காலவாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்தப்பட்டது
  rationale: ἐγένετο இங்கு லூக்காவின் கதை நகர்த்தும் சூத்திரமாக உள்ளது. தமிழில் ‘அப்போது நடந்தது என்னவென்றால்’ என்று வெளிப்படையாக மொழிபெயர்ப்பது கனமாக இருக்கும்; ‘அவர்...போது’ என்ற அமைப்பு நிகழ்வின் முன்னேற்றத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: அவர் அவர்களோடு உணவுக்கு அமர்ந்தபோது
  rationale: ἐν + articular infinitive காலத்தைக் குறிக்கிறது. κατακλίνω பண்டைய உணவுமுறையில் சாய்ந்து படுத்திருப்பதைக் குறிப்பிட்டாலும், நவீன தமிழில் இயல்பாகப் புரிய ‘உணவுக்கு அமர்ந்தபோது’ என வழங்கி, பண்பாட்டு நுணுக்கத்தை அடிக்குறிப்பில் வைத்தோம்.
- source_word: λαβὼν τὸν ἄρτον
  choice: அப்பத்தை எடுத்து
  rationale: முன்னிலைச் செயலைத் தமிழில் இயல்பான வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது; குறிப்பிட்ட உணவிலிருந்த அப்பம் என்பதால் ‘அப்பத்தை’ பயன்படுத்தப்பட்டது.
- source_word: εὐλόγησεν
  choice: அதை ஆசீர்வதித்து
  rationale: εὐλογέω என்பதன் நேரடியான பொருளையும் உணவின்மேல் ஆசீர்வாதம் கூறும் செயற்பாட்டையும் தக்கவைக்கிறது; ‘நன்றி செலுத்தி’ என்பது இங்கு இல்லாத εὐχαριστέω நோக்கிச் சாயக்கூடும்.
- source_word: κλάσας
  choice: பிட்டு
  rationale: அப்பத்தைப் பங்கிடுவதற்காகப் பிய்த்த செயலைச் சுருக்கமான, இயல்பான தமிழில் காட்டுகிறது; அஓரிஸ்ட் வினையெச்சத்தின் முன்னுரிமைச் செயல் தொடர்ச்சியால் தெளிவாகிறது.
- source_word: ἐπεδίδου
  choice: அவர்களுக்குக் கொடுக்கத் தொடங்கினார்
  rationale: இம்பெர்ஃபெக்ட் வடிவம் தொடர்ந்துகொண்டிருந்த அல்லது தொடக்கநிலையிலிருந்த செயலைக் குறிக்கலாம். இந்தக் காட்சியின் நிகழ்வோட்டத்தில் பகிர்ந்தளித்தல் தொடங்குவதை ‘கொடுக்கத் தொடங்கினார்’ தெளிவாக வெளிப்படுத்துகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உணவுச் செயல்களில் காணப்படக்கூடிய திருவிருந்து/திருச்சடங்கு சார்ந்த ஒலிப்புகள்
  choice: வசனத்தில் உள்ள சாதாரண உணவு மொழியையும் செயல்களின் வரிசையையும் மட்டும் தக்கவைத்தல்
  alternative: இந்தச் செயலை வெளிப்படையாகத் திருவிருந்தாக அல்லது திருச்சடங்காக அடையாளப்படுத்தும் மொழியைப் பயன்படுத்துதல்
  rationale: ‘எடுத்து—ஆசீர்வதித்து—பிட்டு—கொடுத்தார்’ என்ற வரிசை முந்தைய உணவுக் காட்சிகளை நினைவூட்டலாம். ஆனால் இவ்வசனம் இதைத் திருச்சடங்கு என்று வெளிப்படையாகக் கூறாததால், எந்தச் சமயப்பிரிவு சார்ந்த விளக்கத்தையும் மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அப்பம்,’ ‘ஆசீர்வதித்து’ போன்ற வேதாகமச் சூழலில் பரவலாகப் புரியும் சொற்கள் தக்கவைக்கப்பட்டன; பண்டைய உணவுமுறையின் பண்பாட்டு விவரம் அடிக்குறிப்பில் விளக்கப்பட்டது.
