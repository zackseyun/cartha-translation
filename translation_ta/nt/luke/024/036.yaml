  text: While they were saying these things[a], he himself stood among them.
translation:
  language: ta
  text: அவர்கள் இந்த விஷயங்களைப் பேசிக்கொண்டிருந்தபோது, அவர் தாமே அவர்கள் நடுவில் நின்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
