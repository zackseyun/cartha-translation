lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: முன்பு சீடர்கள் விவரித்த பல செய்திகளைச் சுட்டும் நடுநிலைப் பன்மையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காக்கிறது.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: அவர்கள் ... பேசிக்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த பேச்சுடன் அடுத்த நிகழ்வு ஒரே நேரத்தில் நடந்ததை genitive absolute அமைப்பு காட்டுகிறது; ‘பேசிக்கொண்டிருந்தபோது’ அந்தத் தொடர்ச்சியையும் காலத் தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: αὐτὸς
  choice: அவர் தாமே
  rationale: வெளிப்படையாக இடம்பெறும் வலியுறுத்தும் பதிற்பெயரின் அழுத்தத்தை மரியாதையான நவீன தமிழில் காக்கிறது.
- source_word: ἔστη
  choice: வந்து நின்றார்
  rationale: ἵστημι வடிவின் மையப் பொருள் ‘நின்றார்’. திடீரெனக் குழுவின் நடுவில் நிலைகொண்ட நிகழ்வைத் தமிழில் இயல்பாகச் சொல்ல ‘வந்து’ பயன்படுத்தப்பட்டுள்ளது; இது அவர் தோன்றிய விதத்தை விளக்குவதில்லை.
- source_word: ἐν μέσῳ αὐτῶν
  choice: அவர்கள் நடுவில்
  rationale: குழுவின் மத்தியில் இருந்த நிலையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘அவர்களிடம், “உங்களுக்குச் சமாதானம் உண்டாகட்டும்” என்று கூறினார்’ என்ற நீண்ட வாசகத்தை முதன்மை உரையில் சேர்ப்பதா
  choice: வழங்கப்பட்ட SBLGNT மூல உரையைப் பின்பற்றி முதன்மை உரையில் சேர்க்கவில்லை.
  alternative: சில கையெழுத்துப் பிரதிகளின்படி, ‘அவர்களிடம், “உங்களுக்குச் சமாதானம் உண்டாகட்டும்” என்று கூறினார்’ என்று சேர்த்தல்.
  rationale: வழங்கப்பட்ட கிரேக்க மூல உரை ‘அவர்கள் நடுவில்’ என்பதுடன் முடிகிறது. குறிப்பிடத்தக்க மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; பரிச்சயமான மொழிபெயர்ப்புகளுடன் ஒத்திசைக்க அது முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘அவர் தாமே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
