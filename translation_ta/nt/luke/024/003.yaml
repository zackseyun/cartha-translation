  text: ⸂εἰσελθοῦσαι δὲ⸃ οὐχ εὗρον τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: ta
  text: ஆனால், அவர்கள் உள்ளே சென்றபோது, உடலைக் காணவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘ஆண்டவராகிய இயேசுவின் உடலை’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: அவர்கள் உள்ளே சென்றபோது
  rationale: இது இறந்தகாலச் செயப்பாட்டு வினையெச்சம், பெண்பால் பன்மை; முந்தைய வசனங்களில் குறிப்பிடப்பட்ட பெண்களைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் காலத் தொடர்பைத் தெளிவாகக் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதை நகர்வோடு மென்மையான முரண்பாட்டையும் குறிக்கிறது; கல்லறைக்கு வந்த பெண்கள் உள்ளே கண்ட எதிர்பாராத நிலையைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: οὐχ εὗρον
  choice: காணவில்லை
  rationale: ‘கண்டுபிடிக்கவில்லை’ என்பதைக் காட்டிலும் இக்காட்சிச் சூழலில் ‘காணவில்லை’ இயல்பாகவும், எளிய இறந்தகால மறுப்பின் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: τὸ σῶμα
  choice: அந்த உடலை
  rationale: σῶμα என்பதன் நேரடியான பொருள் ‘உடல்.’ முன் சூழலில் அறியப்பட்ட உடலைச் சுட்டுவதால் கிரேக்கத் திட்டவட்டச் சுட்டியை இயல்பான தமிழில் ‘அந்த’ என வெளிப்படுத்துகிறது; ‘சடலம்’ என்று மொழிபெயர்த்து கூடுதல் பொருள் நிறம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: அது யாருடைய உடல் என்பதை வெளிப்படையாகக் குறிப்பிடுவதா
  choice: அந்த உடலை
  alternative: ஆண்டவராகிய இயேசுவின் உடலை
  rationale: கொடுக்கப்பட்ட SBLGNT மூலவாசகம் ‘உடல்’ என்று மட்டுமே கூறுகிறது. சில கையெழுத்துப் பிரதிகளிலுள்ள நீண்ட வாசகத்தை முதன்மை உரைக்குள் சேர்க்காமல், உண்மையான உரை வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ்ச் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘உள்ளே’ என்பது கல்லறைக்குள் நுழைந்ததை இயல்பாக உணர்த்துகிறது; ‘அந்த உடல்’ என்பது சூழலில் ஏற்கெனவே அறியப்பட்ட உடலைச் சுட்டுகிறது.
