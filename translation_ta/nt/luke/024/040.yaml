source:
  edition: SBLGNT
  text: ⸂[καὶ τοῦτο εἰπὼν ⸀ἔδειξεν αὐτοῖς τὰς χεῖρας καὶ τοὺς πόδας.]⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: ta
  text: இதைச் சொன்னபின்,[a] அவர் தம் கைகளையும் கால்களையும் அவர்களுக்குக் காட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் இந்த வாக்கியம் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: இதைச் சொன்னபின்
  rationale: கிரேக்க இணைப்புச் சொல்லான καὶ தனியாக மொழிபெயர்க்கப்படாமல், தொடர்ந்து வரும் காலவினையெச்சத் தொடருடன் இயல்பான தமிழ் கதைநடையில் இணைக்கப்பட்டுள்ளது; நிகழ்வுகளின் தொடர்ச்சி காக்கப்படுகிறது.
- source_word: τοῦτο εἰπὼν
  choice: இதைச் சொன்னபின்
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘இதைச் சொன்னபின்’ என்பது அந்த வரிசையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔδειξεν
  choice: காட்டினார்
  rationale: δείκνυμι இங்கு பார்வைக்குக் காண்பித்தல் என்ற நேரடியான பொருளில் வருகிறது; ‘காட்டினார்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: இது காட்டப்பட்டவர்களைக் குறிக்கும் மறைமுகச் செயப்படுபொருள்; தமிழில் ‘அவர்களுக்குக் காட்டினார்’ என இயல்பாக அமைகிறது.
- source_word: τὰς χεῖρας
  choice: தம் கைகளை
  rationale: கிரேக்கத்தில் உறுப்புகளுடன் வரும் குறிப்புச் சுட்டு, சூழலில் இயேசுவின் சொந்தக் கைகளைக் குறிக்கிறது. எழுவாயையே திரும்பச் சுட்டும் மரியாதையான ‘தம்’ இதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοὺς πόδας
  choice: கால்களை
  rationale: πόδας என்பது உடல் உறுப்புகளான பாதங்கள்/கால்களைக் குறிக்கிறது. ‘கைகளையும் கால்களையும் காட்டினார்’ என்பது நவீனத் தமிழில் இயல்பான இணைச்சொற்றொடர்; உரிமை ‘தம்’ என்பதன் மூலம் இரண்டிற்கும் பொருந்துகிறது.
theological_decisions:
- issue: முழு வசனத்தின் மூலபாட நிலை
  choice: வசனம் முதன்மைப் பனுவலில் சேர்க்கப்பட்டு, பாடவேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
  alternative: சில கையெழுத்துப் பிரதிகளில் இந்த வாக்கியம் இல்லை.
  rationale: SBLGNT முழு வசனத்தையும் அடைப்புக்குறிக்குள் வழங்கி குறிப்பிடத்தக்க மூலபாட ஐயத்தைச் சுட்டுகிறது. கொடுக்கப்பட்ட மூலப்பாடத்தில் சொற்கள் இருப்பதால் அவை மொழிபெயர்க்கப்பட்டுள்ளன; அதேவேளையில் ஐயம் மறைக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் வினை மற்றும் தற்சுட்டுப் பெயர் மரியாதை வடிவில் அமைந்துள்ளன.
