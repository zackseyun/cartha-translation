  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: ta
  text: ஆனால், அவர்கள் திடுக்கிட்டுப் பயந்துபோனார்கள்; ஓர் ஆவியைக்[a] காண்கிறோம் என்று நினைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு பேயை.’ கிரேக்கச் சொல் πνεῦμα; இதன் நேரடியான பொருள் ‘ஆவி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: திடுக்கிட்டு
  rationale: திடீரென ஏற்பட்ட அதிர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அடுத்து வரும் பயத்தைக் குறிக்கும் சொல்லின் வலிமையையும் தனியே காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் இயேசு அவர்கள் நடுவில் நின்றதற்கும் இங்கு விவரிக்கப்படும் அவர்களுடைய எதிர்வினைக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ἔμφοβοι γενόμενοι
  choice: பயந்துபோய்
  rationale: அவர்கள் பயமடைந்த நிலைக்குள் சென்றதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐδόκουν
  choice: நினைத்தார்கள்
  rationale: அவர்கள் கொண்டிருந்த தவறான எண்ணம் அல்லது அனுமானத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πνεῦμα
  choice: ஓர் ஆவி
  rationale: கிரேக்கச் சொல்லின் நேரடியான பொருளைத் தக்கவைத்து, நாட்டுப்புறக் கருத்துகள் நிறைந்த வேறு சொல்லை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: θεωρεῖν
  choice: காண்பதாக
  rationale: அவர்கள் தங்கள் கண்முன் தொடர்ந்து கண்டுகொண்டிருந்ததாக எண்ணிய உணர்வை, தமிழில் இயல்பான துணைவினை அமைப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவின் தோற்றச் சூழலில் πνεῦμα என்பதன் மொழிபெயர்ப்பு
  choice: ஓர் ஆவி
  alternative: ஒரு பேய்
  rationale: ‘ஆவி’ என்பது πνεῦμα என்பதற்கு நெருக்கமான சொல். சீடர்கள் இயேசுவை உடலற்ற ஓர் இருப்பாகத் தவறாகக் கருதிய கதையியல் பதற்றத்தை இது காக்கிறது; பிந்தைய நாட்டுப்புறப் பேய்க் கருத்துகளை உரைக்குள் திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், இயல்பான, கண்ணியமான நடை. மூலத்தின் பங்கேற்புவினைத் தொடரை ‘திடுக்கிட்டுப் பயந்துபோய்’ எனச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
