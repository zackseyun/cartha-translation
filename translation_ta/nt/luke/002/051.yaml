  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: ta
  text: அவர் அவர்களுடன் இறங்கி நாசரேத்துக்கு வந்தார்; அவர்களுக்குத் தொடர்ந்து கீழ்ப்படிந்தார்.[a] அவருடைய தாய் இந்த வார்த்தைகள் அனைத்தையும்[b] தன் இதயத்தில் பாதுகாத்து வைத்திருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்குக் கீழ்ப்பட்டவராக இருந்தார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வாக்கிய அமைப்பு தொடர்ச்சியான கீழ்ப்படிதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வார்த்தைகள்” என்பதற்கான கிரேக்கச் சொல் பேசப்பட்ட வார்த்தைகள், கூற்றுகள் அல்லது குறிப்பிடப்பட்ட காரியங்களைக் குறிக்கலாம். எனவே “இந்தக் காரியங்கள் அனைத்தையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: இறங்கி
  rationale: எருசலேமிலிருந்து நாசரேத்துக்குச் செல்லும் நிலவியல் இயக்கத்தை இயல்பான தமிழில் உணர்த்துகிறது; ‘கீழே’ என்பதைத் தனியாகச் சேர்க்க வேண்டியதில்லை.
- source_word: μετ’ αὐτῶν
  choice: அவர்களுடன்
  rationale: எளிய உடன்செல்லுதலை நேரடியாகக் காட்டுகிறது.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: நாசரேத்துக்கு வந்து
  rationale: கதையின் இயக்கத்தை இயல்பான தமிழில் தொடர்கிறது.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: அவர்களுக்குத் தொடர்ந்து கீழ்ப்படிந்து நடந்தார்
  rationale: இறந்தகால வினையும் நிகழ்காலப் பெயரெச்சமும் சேர்ந்த கிரேக்க அமைப்பு காட்டும் தொடர்ச்சியான கீழ்ப்படிதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διετήρει
  choice: பாதுகாத்து வைத்திருந்தாள்
  rationale: கவனமாக நினைவில் வைத்துப் பேணுதல் என்ற பொருளையும், இறந்தகாலத்தில் தொடர்ந்த செயல் என்ற நுணுக்கத்தையும் தருகிறது.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: ῥήματα என்பதன் வெளிப்படையான ‘வார்த்தைகள்/கூற்றுகள்’ என்ற பொருளைப் பேணுகிறது; அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: தன் இதயத்தில்
  rationale: உள்ளார்ந்த நினைவும் சிந்தனையும் குறிக்கும் மூலமொழி உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவுக்கும் அவரது பூமிக்குரிய பெற்றோருக்கும் இடையிலான உறவு
  choice: அவர்களுக்குத் தொடர்ந்து கீழ்ப்படிந்து நடந்தார்
  alternative: அவர்களுக்குக் கீழ்ப்பட்டவராக இருந்தார்
  rationale: இயேசு மரியாளுக்கும் யோசேப்புக்கும் தொடர்ந்து கீழ்ப்படிந்ததை கிரேக்கம் நேரடியாகக் கூறுகிறது. அவரது அடையாளத்தைப் பற்றிய பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், அந்த இறையியல் பதற்றத்தை அப்படியே பேணுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’ என்ற வேதாகம உருவகம் பேணப்பட்டுள்ளது; தொடர்ச்சியான கீழ்ப்படிதல் இயல்பான வினைநடையில் வெளிப்படுத்தப்பட்டுள்ளது.
