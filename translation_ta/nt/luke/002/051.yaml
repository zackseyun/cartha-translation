revisions:
- from: அவர் அவர்களுடன் இறங்கி நாசரேத்துக்கு வந்து, அவர்களுக்குத் தொடர்ந்து கீழ்ப்படிந்து நடந்தார்.[a] அவருடைய தாய் இந்த வார்த்தைகள் அனைத்தையும்[b] தன் இதயத்தில் பாதுகாத்து வைத்திருந்தாள்.
  to: அவர் அவர்களுடன் இறங்கி நாசரேத்துக்கு வந்தார்; அவர்களுக்குத் தொடர்ந்து கீழ்ப்படிந்தார்.[a] அவருடைய தாய் இந்த வார்த்தைகள் அனைத்தையும்[b] தன் இதயத்தில் பாதுகாத்து வைத்திருந்தாள்.
