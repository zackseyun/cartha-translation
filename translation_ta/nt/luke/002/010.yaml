reference: Luke 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: ta
  text: அந்தத் தேவதூதன் அவர்களிடம், “பயப்படாதீர்கள்; ஏனெனில், இதோ, மக்கள் அனைவருக்கும் உண்டாகும் மிகுந்த மகிழ்ச்சியைத் தரும் நற்செய்தியை உங்களுக்கு அறிவிக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: அந்தத் தேவதூதன்
  rationale: கிரேக்கக் குறிப்புச் சுட்டு, முந்தைய சூழலில் அறிமுகப்படுத்தப்பட்ட தூதனையே சுட்டுகிறது; ‘அந்த’ என்பது அந்தத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: பன்மை முன்னிலையில் கூறப்படும் தடைக் கட்டளையை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலியுறுத்தலையும் புனிதமான தொனியையும் காக்கிறது.
- source_word: γὰρ
  choice: இதோ என்பதுடன் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்தும் தொடரமைப்பு
  rationale: கிரேக்கத்தில் γάρ, ஏன் பயப்பட வேண்டாம் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘ஏனெனில்’ சேர்ப்பது உரையைக் கடினமாக்குவதால், அடுத்த அறிவிப்பே காரணமாகத் தெளிவாக அமையும் வகையில் தொடரமைக்கப்பட்டுள்ளது.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: நற்செய்தியாக உங்களுக்கு அறிவிக்கிறேன்
  rationale: நல்ல செய்தியை அறிவித்தல் என்ற வினையின் அடிப்படைப் பொருளையும் ὑμῖν என்பதன் நேரடிப் பயனாளிகளையும் காக்கிறது; பின்னாளைய தொழில்நுட்ப சமயப் பொருளைத் தேவையின்றி திணிக்கவில்லை.
- source_word: χαρὰν μεγάλην
  choice: மிகுந்த மகிழ்ச்சி
  rationale: அளவில் பெரிதான மகிழ்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἥτις ἔσται
  choice: உண்டாகப்போகும்
  rationale: மகிழ்ச்சியைச் சுட்டும் தொடர்புச் சொல்லையும் எதிர்கால வினையையும் தமிழில் ஒரே இயல்பான பெயரெச்சத் தொடராக வெளிப்படுத்துகிறது.
- source_word: παντὶ τῷ λαῷ
  choice: மக்கள் அனைவருக்கும்
  rationale: λαός என்ற ஒருமைச் சமூகப் பெயரையும் ‘அனைவருக்கும்’ என்ற முழுமையையும் காக்கிறது. தமிழில் கிரேக்கக் குறிப்புச் சுட்டை அப்படியே வெளிப்படுத்துவது இயல்பற்றதால், மாற்று விரிவான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: παντὶ τῷ λαῷ என்பதன் வரம்பு
  choice: மக்கள் அனைவருக்கும்
  alternative: எல்லா மக்களுக்கும்
  rationale: கிரேக்கத்தில் உள்ள குறிப்புச் சுட்டுடன் கூடிய ஒருமை λαός, உடனடிச் சூழலில் ஒரு குறிப்பிட்ட மக்களைக்—சாத்தியமாக இஸ்ரவேலைக்—குறிக்கலாம். ‘மக்கள் அனைவருக்கும்’ என்பது அந்த வாய்ப்பை முற்றிலும் நீக்காமல் வைத்திருக்கிறது; ‘எல்லா மக்களுக்கும்’ என்ற உலகளாவிய வாசிப்பையும் அடிக்குறிப்பு பதிவு செய்கிறது. இதனால் லூக்காவின் விரிவான இரட்சிப்பு நோக்கை மறுக்காமலும், இந்த வசனம் மட்டும் கூறுவதை முன்கூட்டியே விரிவுபடுத்தாமலும் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் வலியுறுத்தலைக் காக்கிறது. நேரடி உரையின் தமிழ் நிறுத்தக்குறி மற்றும் வாக்கிய ஒழுங்கு இயல்பாக அமைக்கப்பட்டுள்ளன.
