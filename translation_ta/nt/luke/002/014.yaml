  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: ta
  text: '“உன்னதங்களில் கடவுளுக்கு மகிமை;

    பூமியில் கடவுளின் நல்விருப்பைப் பெற்ற மக்களிடையே[c] அமைதி.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை மேலும் இயல்பாக, “கடவுள் மகிழும் மக்களிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், “பூமியில் அமைதி; மனிதர்களிடையே நல்விருப்பு” என்று உள்ளது.
    reason: textual_variant
  - marker: c
    text: “மக்கள்” என்பது இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Δόξα
  choice: மகிமை
  rationale: இது கடவுளுக்குச் செலுத்தப்படும் மகிமையை அறிவிக்கும் வியப்புரையாக உள்ளது. ‘மகிமை’ என்பது வழிபாட்டு மற்றும் இறையியல் நிறையைத் தக்கவைக்கிறது.
- source_word: ἐν ὑψίστοις
  choice: உன்னதங்களில்
  rationale: மிக உயர்ந்த விண்ணுலகப் பகுதிகளைச் சுட்டும் பன்மை இடவுணர்வைச் சுருக்கமாகவும் மரபுக்கு இயைந்தவாறும் காக்கிறது.
- source_word: θεῷ
  choice: கடவுளுக்கு
  rationale: கிரேக்க வேற்றுமை உருபின் மகிமை செலுத்தப்படும் இலக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ γῆς
  choice: பூமியில்
  rationale: ‘உன்னதங்களில்’ என்பதற்கு எதிரான இடவியல் அமைப்பை நேரடியாகக் காக்கிறது.
- source_word: εἰρήνη
  choice: அமைதி
  rationale: தனிப்பட்ட மனநிம்மதியை மட்டும் அல்லாமல் விரிவான வேதாகமப் பொருளைக் கொண்ட சமாதான நிலையைக் குறிக்கக்கூடிய இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: ἐν ἀνθρώποις
  choice: மக்களிடையே
  rationale: ἄνθρωποι இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மக்களிடையே’ என்பது பாலினக் கட்டுப்பாட்டைத் தவிர்த்து அந்தப் பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: εὐδοκίας
  choice: நல்விருப்புக்குரிய
  rationale: வேற்றுமைத் தொகையைத் தமிழில் புரியத்தக்க அடைமொழியாக்கி, அந்த மக்கள் நல்விருப்பு அல்லது தயவின் பொருளாக இருப்பதைக் காட்டுகிறது; யாருடைய நல்விருப்பு என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: εὐδοκίας என்ற உருபுடைய வாசகத்தின் பொருள்
  choice: அமைதி நல்விருப்புக்குரிய மக்களிடையே இருப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுள் மகிழும் மக்களிடையே’ என்று பொருளை விரித்து மொழிபெயர்க்கலாம்.
  rationale: SBLGNT உரையில் εὐδοκίας என்பது உரிமை/சார்பு காட்டும் வடிவில் இருப்பதால், ‘நல்விருப்பு’ என்பதை தனியான மூன்றாவது அறிவிப்பாகக் கொள்ளாமல் ‘மக்கள்’ என்பதைக் குறிக்கும் வகையில் இணைக்கப்படுகிறது. அதே நேரம், கடவுளின் தேர்வு குறித்து முழுமையான கோட்பாட்டை வசனத்தில் இறக்கவில்லை.
- issue: εὐδοκία என்ற வேறுபட்ட பிரதிவாசகம்
  choice: முதன்மை உரையில் SBLGNT-இன் εὐδοκίας வாசகம் பின்பற்றப்பட்டது.
  alternative: சில கையெழுத்துப் பிரதிகளின்படி, ‘பூமியில் அமைதி; மனிதர்களிடையே நல்விருப்பு’ என்று வாசிக்கலாம்.
  rationale: அச்சிடப்பட்ட மூல உரை உருபுடைய εὐδοκίας என்பதை ஆதாரமாகக் கொண்டுள்ளது; பரவலாக அறியப்பட்ட மாற்றுப் பிரதிவாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டது. ‘உன்னதங்களில்’ மற்றும் ‘மகிமை’ ஆகியவை வசனத்தின் உயர்ந்த வழிபாட்டு ஓசையைத் தக்கவைக்கின்றன; ‘மக்களிடையே’ இயல்பான, பாலினப் பொதுமையான மொழியாக உள்ளது.
