  to: '“உன்னதங்களில் கடவுளுக்கு மகிமை;

    பூமியில் கடவுளின் நல்விருப்பைப் பெற்ற மக்களிடையே[c] அமைதி.”[a][b]'
  rationale: The revision replaces a Tamil phrase that implies human deservingness with wording that represents the genitive εὐδοκίας as divine favor received by the people. Naming God is warranted by the immediately preceding θεῷ and makes the required relation natural in Tamil; it does not impose a further doctrinal interpretation. The textual-variant and idiomatic-alternative footnotes are retained and adjusted only for natural Tamil punctuation and phrasing.
