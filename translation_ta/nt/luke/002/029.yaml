source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: ta
  text: எஜமானரே, இப்போது உமது வார்த்தையின்படி உமது அடிமையை[a] சமாதானத்துடன் விடுவிக்கிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது பணியாளனை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் δοῦλος என்பது ‘அடிமை’ அல்லது ‘பணியாளர்’ எனப் பொருள்படலாம்; இங்கு ‘எஜமானரே’ என்ற இணையான அழைப்பு உரிமை மற்றும் பணிவிடை உறவைத் தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சிமியோன் இவ்வாழ்விலிருந்து சமாதானத்துடன் புறப்படத் தயாராக இருப்பதே கருத்து. எனினும், கிரேக்க வினைச்சொல் இன்னும் நேரடியாக ‘விடுவிக்கிறீர்’ அல்லது ‘போக அனுமதிக்கிறீர்’ என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: இப்போது
  rationale: சிமியோனின் எதிர்பார்ப்பு தற்போது நிறைவேறுவதைக் குறிக்கும் இயல்பான நேரச்சொல்.
- source_word: ἀπολύεις
  choice: விடுவிக்கிறீர்
  rationale: இந்த நிகழ்கால வினைச்சொல் ‘விடுவித்தல்’ அல்லது ‘போக அனுமதித்தல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; மரணத்தை நேரடியாகச் சேர்க்கவில்லை.
- source_word: τὸν δοῦλόν σου
  choice: உமது அடிமையை
  rationale: δοῦλος சேவகர் அல்லது அடிமை எனப் பொருள்படலாம். அருகிலுள்ள δέσποτα என்ற அழைப்பு உரிமையாளர்–அடிமை உறவைத் தெளிவாக்குவதால் ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: δέσποτα
  choice: எஜமானரே
  rationale: δεσπότης அதிகாரமும் உரிமையும் உடைய எஜமானைக் குறிக்கிறது; δοῦλος என்பதுடன் உள்ள தொடர்பையும் இத்தேர்வு தக்கவைக்கிறது.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: உமது வார்த்தையின்படி
  rationale: κατά இங்கு ஒத்திசைவு அல்லது ஏற்பைக் குறிக்கிறது; ῥῆμα இறைவன் கூறிய வாக்குறுதியை நினைவூட்டும் ‘வார்த்தை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν εἰρήνῃ
  choice: சமாதானத்துடன்
  rationale: இறைவனின் வாக்குறுதி நிறைவேறிய நிலையில் அமைதியான புறப்படுதலைக் குறிக்கும் சொற்றொடரின் வேதாகமச் சாயலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சிமியோனின் கூற்று மரணத்தை வெளிப்படையாகக் குறிப்பிட வேண்டுமா
  choice: ‘விடுவிக்கிறீர்’ என்ற உருவகத்தைத் தக்கவைத்து, மரணத்தை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘இப்போது உமது அடிமையைச் சமாதானத்துடன் இறக்க அனுமதிக்கிறீர்.’
  rationale: சூழல் சிமியோன் இறப்பதற்குத் தயாராக இருப்பதை வலுவாக உணர்த்தினாலும், ἀπολύω நேரடியாக ‘இறக்கச் செய்தல்’ என்று பொருள்படாது. மூலத்தின் கவித்துவமான மறைபொருளும் இறையியல் அழுத்தமும் தக்கவைக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டது. ‘உமது’ மற்றும் ‘விடுவிக்கிறீர்’ ஆகிய வடிவங்கள் ஜெபத்திற்கேற்ற கண்ணியமான நடையை வழங்குகின்றன; ‘எஜமானரே’–‘அடிமை’ இணைப்பு மூலத்தின் உறவியல் வலிமையைப் பாதுகாக்கிறது.
