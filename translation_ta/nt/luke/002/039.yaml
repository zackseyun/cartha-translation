source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: ta
  text: கர்த்தருடைய சட்டத்தின்படி அனைத்தையும் அவர்கள் செய்து முடித்தபின்[a], கலிலேயாவுக்கு, தங்கள் சொந்த ஊரான[b] நாசரேத்துக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்த்தருடைய சட்டம் கோரிய அனைத்தையும் அவர்கள் செய்து முடித்தபின்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “நகரம்”; நாசரேத்து ஒரு சிறிய குடியிருப்பாக இருந்ததால் இங்கு “ஊர்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: நிறைவேற்றியபின்
  rationale: இறந்தகால வினையுடன் வரும் ὡς, முதலில் கூறப்பட்ட செயல்கள் முடிந்த பிறகு பிரதான செயல் நிகழ்ந்த காலத் தொடரை இங்கு குறிக்கிறது. தமிழில் ‘-பின்’ இயல்பாக அதை வெளிப்படுத்துகிறது; உடனடித்தன்மையை மிகைப்படுத்துவதில்லை.
- source_word: ἐτέλεσαν
  choice: நிறைவேற்றிய
  rationale: தேவையான செயல்களை முழுமையாகச் செய்து முடித்ததைக் குறிக்கிறது. ‘நிறைவேற்றிய’ என்பது சூழலில் சடங்கு சார்ந்த கடமைகளை முடித்த பொருளில் இயல்பாக உள்ளது; தீர்க்கதரிசன நிறைவேற்றம் என்ற கூடுதல் பொருளை உரை வற்புறுத்தவில்லை.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: கர்த்தருடைய திருச்சட்டத்தின்படி செய்ய வேண்டிய அனைத்தையும்
  rationale: கிரேக்கச் சொற்றொடர் கர்த்தரின் சட்டத்துக்கு ஏற்ப உள்ள அல்லது அதனால் விதிக்கப்பட்ட எல்லாவற்றையும் குறிக்கிறது. ‘செய்ய வேண்டிய’ என்பது தமிழில் தொடர்பைத் தெளிவாக்கும் அளவான விரிவாக்கம்.
- source_word: νόμον κυρίου
  choice: கர்த்தருடைய திருச்சட்டம்
  rationale: இது கடவுள் அளித்த வேதாகமச் சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ நவீனத் தமிழில் மரியாதையுடனும் தெளிவாகவும் ‘law’ என்பதைக் காட்டுகிறது.
- source_word: κυρίου
  choice: கர்த்தர்
  rationale: κύριος என்பதற்கான வழக்கமான வேதாகமத் தமிழாக்கம். இச்சூழலில் கடவுளைக் குறித்தாலும், மூலத்தில் உள்ள பொதுவான ‘Lord’ வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐπέστρεψαν
  choice: திரும்பிச் சென்றார்கள்
  rationale: பயணச் சூழலில் முந்தைய இடத்திற்குத் திரும்பிச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவிலுள்ள
  rationale: அவர்கள் கலிலேயாவுக்கு, குறிப்பாக அங்குள்ள நாசரேத்துக்குத் திரும்பினர் என்ற இரட்டை இலக்கைத் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: தங்கள் சொந்த ஊரான
  rationale: πόλις நகரம் அல்லது ஊர் என அளவுக்கேற்ப அமையலாம். நாசரேத்து சிறிய குடியிருப்பாக இருந்ததால் ‘ஊர்’ இயல்பானது; ἑαυτῶν-இன் வலியுறுத்தலை ‘தங்கள் சொந்த’ பாதுகாக்கிறது.
- source_word: Ναζαρέθ
  choice: நாசரேத்து
  rationale: இடப்பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
theological_decisions:
- issue: ‘கர்த்தருடைய திருச்சட்டம்’ என்பதில் ‘கர்த்தர்’ யாரைக் குறிக்கிறது?
  choice: வேதாகமத்தில் கொடுக்கப்பட்ட தெய்வீகச் சட்டத்தின் உரிமையாளரும் கொடுத்தவருமான கடவுளைக் குறிக்கிறது.
  alternative: இச்சூழலில் குறிப்பிடத்தக்க வேறு இறையியல் வாசிப்பு இல்லை.
  rationale: இது யூத வேதமரபில் நிலையான சொற்றொடர். குடும்பத்தார் சட்டத்துக்குக் கீழ்ப்படிந்ததை உரை கூறும் அளவிலேயே மொழிபெயர்ப்பு நிற்கிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்த்தர்’, ‘திருச்சட்டம்’ ஆகியவை வேதமரபின் ஒலியைப் பாதுகாக்கின்றன; ‘சொந்த ஊர்’ சாதாரண வாசகருக்குத் தெளிவாக உள்ளது. எல்லா அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
