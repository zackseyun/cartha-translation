  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: ta
  text: அவருடைய பெற்றோர் ஆண்டுதோறும் பஸ்கா பண்டிகைக்காக எருசலேமுக்குச் செல்வது வழக்கமாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: செல்வது வழக்கம்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நிகழ்ந்த வழக்கமான செயலைக் குறிக்கும் imperfect வினை வடிவத்தை, κατ’ ἔτος என்பதுடன் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: கிரேக்கப் பன்மைப் பெயர்ச்சொல்லின் நேரான, இயல்பான பொருள்; மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: κατ’ ἔτος
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வொரு ஆண்டும் நிகழ்ந்த செயல் என்ற பகிர்வுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக அறியப்பட்டுள்ள இடப்பெயர் வடிவம்.
- source_word: τῇ ἑορτῇ
  choice: பண்டிகைக்காக
  rationale: பயணத்தின் சந்தர்ப்பத்தையும் நோக்கத்தையும் இச்சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: τοῦ πάσχα
  choice: பஸ்கா
  rationale: யூதர்களின் குறிப்பிட்ட பண்டிகையைக் குறிக்கும் பெயரைத் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் குடும்ப உறுப்பினர்களைக் குறித்த சொல்
  choice: அவருடைய பெற்றோர்
  alternative: அவருடைய தந்தையும் தாயும்
  rationale: மூலம் பொதுவான குடும்ப உறவுச் சொல்லான γονεῖς என்பதையே பயன்படுத்துகிறது. அதை ‘பெற்றோர்’ என மொழிபெயர்ப்பது கன்னிப் பிறப்பைப் பற்றிய லூக்காவின் பிற கூற்றை மறுப்பதோ, இவ்வசனத்தில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதோ அல்ல; மூலத்தின் இயல்பான பதற்றத்தை அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘செல்வது வழக்கம்’ என்பது கிரேக்க imperfect-இன் வழக்கமாகத் திரும்பத் திரும்ப நிகழ்ந்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
