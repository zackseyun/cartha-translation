  rationale: 'மூலத்தில் இல்லாத பயணச் செயலும் ‘பெயர்’ என்னும் குறிப்பும் நீக்கப்பட்டன. முறையான பண்டைய திருமண நிச்சய உறவை இயல்பான தமிழில் தர ‘திருமண உறுதி செய்யப்பட்டிருந்த’ பயன்படுத்தப்பட்டது. மரியாளின் இரு வருணனைகளும் மூலத்தின் இணைத் தொடரமைப்பைத் தக்கவைத்துள்ளன. குறிப்பு அடையாளங்கள் முறையே திருமண உறுதி மற்றும் கர்ப்பநிலையுடன் இணைக்கப்பட வேண்டும்: ‘மரியாளோடு[a]’ மற்றும் ‘இருந்ததுமான[b]’.'
