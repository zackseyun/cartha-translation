  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: ta
  text: தனக்கு திருமண உறுதி செய்யப்பட்டிருந்ததும் கர்ப்பமாக இருந்ததுமான மரியாளோடு பதிவுசெய்துகொள்ள.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: பெயரைப் பதிவுசெய்ய
  rationale: மக்கள்தொகைக் கணக்கெடுப்பின் நிர்வாகச் சூழலில், பெயரைப் பதிவு செய்துகொள்வதற்கான நோக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: σὺν Μαριὰμ
  choice: மரியாளோடு
  rationale: உடனிருப்பைச் சுட்டும் σὺν என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: தனக்கு மணஒப்பந்தம் செய்யப்பட்டிருந்த
  rationale: பண்டைய யூதச் சமூகத்தில் சட்ட, சமூகப் பிணைப்புடைய முறையான திருமண நிச்சயத்தைத் தெரிவிக்கிறது; இன்றைய சாதாரண ‘நிச்சயதார்த்தம்’ என்பதைக் காட்டிலும் அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: οὔσῃ ἐγκύῳ
  choice: கர்ப்பமாக இருந்தாள்
  rationale: அச்சமயத்தில் மரியாளின் நிலையைக் கண்ணியமான, தெளிவான நவீன தமிழில் கூறுகிறது.
theological_decisions:
- issue: யோசேப்புடன் மரியாளுக்கு இருந்த உறவுநிலை
  choice: தனக்கு மணஒப்பந்தம் செய்யப்பட்டிருந்த
  alternative: தனக்கு நிச்சயிக்கப்பட்டிருந்த / அவனுடைய மனைவி
  rationale: கிரேக்கச் சொல் முறையான மணஒப்பந்தத்தைக் குறிக்கிறது. ‘மனைவி’ என்பது இவ்வாக்கியம் கூறுவதைவிட அதிகமான நிலையைச் சேர்க்கும்; ‘நிச்சயிக்கப்பட்டிருந்த’ என்பது பண்டைய சட்ட, சமூகப் பிணைப்பின் வலிமையைத் தெளிவாகக் காட்டாமல் போகலாம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான நடை. கொடுக்கப்பட்ட பகுதி தொடர்வினையெச்சத்துடன் தொடங்குவதால், தனி வசனமாக இயல்பாக அமைய ‘சென்றான்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; கருத்தின் மையம் பதிவு, உடனிருப்பு, மணஒப்பந்தம், கர்ப்பநிலை ஆகியவற்றில் நிலைத்துள்ளது.
