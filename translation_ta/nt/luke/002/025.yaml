id: LUK.2.25
reference: Luke 2:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: ta
  text: இதோ, எருசலேமில் சிமியோன் என்னும் பெயருடைய ஒரு மனிதர் இருந்தார். அவர் நீதிமானும் இறைபக்தியுள்ளவருமாக, இஸ்ரயேலின் ஆறுதலை எதிர்பார்த்துக் கொண்டிருந்தார்[a]. பரிசுத்த ஆவியானவர் அவர்மேல் இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இஸ்ரயேலுக்காக எதிர்பார்க்கப்பட்ட கடவுளின் ஆறுதலும் மறுசீரமைப்பும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிசுத்தமான ஓர் ஆவி அவர்மேல் இருந்தது” என்றும் இலக்கணரீதியாகப் புரிந்துகொள்ளலாம்; ஆனால் லூக்காவின் சூழலில் இது பரிசுத்த ஆவியைக் குறிப்பதே மிகவும் இயல்பானது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: லூக்கா ஒரு முக்கியமான நபரை உயிரோட்டமாக அறிமுகப்படுத்தப் பயன்படுத்தும் கவன ஈர்ப்புச் சொல்லை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: இங்கு குறிக்கப்படுபவர் சிமியோன் என்ற ஆண் என்பதால் மரியாதையுடனான பாலினத் துல்லியத்தைப் பேணுகிறது.
- source_word: ᾧ ὄνομα Συμεών
  choice: சிமியோன் என்னும் பெயருடைய
  rationale: கிரேக்க அடையாளப்படுத்தும் அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: δίκαιος
  choice: நீதிமான்
  rationale: ஒழுக்க மற்றும் உடன்படிக்கைச் சார்ந்த நேர்மையை உள்ளடக்கும் வேதாகமப் பொருளைத் தக்கவைக்கிறது.
- source_word: εὐλαβής
  choice: இறைபக்தியுள்ளவர்
  rationale: கடவுள்பால் பயபக்தியும் கவனமான பக்திநெறியும் கொண்டவர் என்ற கருத்தை இன்றைய தமிழில் தெளிவாகத் தருகிறது.
- source_word: προσδεχόμενος
  choice: எதிர்பார்த்துக் கொண்டிருந்தார்
  rationale: தொடர்ச்சியான, நம்பிக்கையுள்ள காத்திருப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: இஸ்ரயேலின் ஆறுதல்
  rationale: ஆறுதல், மீட்பு, மறுசீரமைப்பு ஆகிய நம்பிக்கைகளை உள்ளடக்கும் சொற்றொடரையும் கிரேக்க உரையின் உறவுநிலை அமைப்பையும் தக்கவைக்கிறது.
- source_word: πνεῦμα ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: கிரேக்கத்தில் முன்னொட்டு இல்லாவிட்டாலும், லூக்காவின் உடனடிச் சூழலும் பயன்பாடும் பரிசுத்த ஆவியையே இயல்பாகக் குறிக்கின்றன; தமிழில் வழக்கமான மரியாதைமிக்க தனிநபர் குறிப்பாக வழங்கப்பட்டுள்ளது.
- source_word: ἐπ’ αὐτόν
  choice: அவர்மேல் இருந்தார்
  rationale: ஆவியின் பிரசன்னம் அவர்மேல் இருந்தது என்ற வேதாகம மொழிநடையை கூடுதல் விளக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவர் அவர்மேல் இருந்தார்
  alternative: பரிசுத்தமான ஓர் ஆவி அவர்மேல் இருந்தது
  rationale: லூக்கா 2:26–27 உட்பட உடனடிச் சூழலில் இது பரிசுத்த ஆவியைக் குறிப்பதே மிகவும் இயல்பானது. எனினும் கிரேக்கத்தில் முன்னொட்டு இல்லாததால் இலக்கணரீதியாகச் சாத்தியமான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: παράκλησιν τοῦ Ἰσραήλ என்பதன் பொருள் பரப்பு
  choice: இஸ்ரயேலின் ஆறுதல்
  alternative: இஸ்ரயேலுக்கான ஆறுதலும் மறுசீரமைப்பும்
  rationale: மூலத்தின் சுருக்கமான உருவகச் சொல்லையும் அதன் வேதாகம எதிர்பார்ப்பையும் தக்கவைத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. “இதோ” என்ற கதைநடைச் சுட்டியும் “இஸ்ரயேலின் ஆறுதல்” என்ற செறிவான சொற்றொடரும் மூலத்தின் இலக்கிய மற்றும் இறையியல் ஒலியைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறிகள் உரையில் அவற்றுக்குரிய சொற்றொடர்களோடு பொருத்தமாக வைக்கப்பட்டுள்ளன.
