source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: ta
  text: அந்நாட்களில், மக்கள் வாழும் உலகம் முழுவதிலும் உள்ளோர் பதிவு செய்யப்பட வேண்டும் என்ற ஓர் ஆணை அகுஸ்து சீசரிடமிருந்து வெளியானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ரோம உலகம் முழுவதும்’ அல்லது ‘பேரரசு முழுவதும்.’ இந்தக் கிரேக்கச் சொல், ரோமப் பேரரசுச் சூழலில் கருதப்பட்ட மக்கள் வாழும் உலகத்தைப் பல நேரங்களில் குறிக்கிறது.
    reason: οἰκουμένη என்பதன் சூழல்சார் மாற்றுப் பொருளையும் அதன் பரப்பிலுள்ள தெளிவின்மையையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: அந்நாட்களில் … வெளியானது
  rationale: Ἐγένετο என்பது புதிய நிகழ்வை அறிமுகப்படுத்தும் கதைநடைச் சூத்திரம்; δὲ கதை நகர்வைக் குறிக்கிறது. தமிழில் தனியாக ‘இது நிகழ்ந்தது’ என்று சேர்ப்பதைவிட, முதன்மை வினையோடு இயல்பாக ஒருங்கிணைக்கப்பட்டது; δὲ-க்கு தேவையற்ற தனிச் சொல் சேர்க்கப்படவில்லை.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: அந்நாட்களில்
  rationale: கிரேக்க காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் தருகிறது.
- source_word: ἐξῆλθεν δόγμα
  choice: ஓர் ஆணை வெளியானது
  rationale: அதிகாரபூர்வமான கட்டளை பிறப்பிக்கப்பட்டு அறிவிக்கப்பட்டது என்ற பொருளைத் தெளிவாகத் தருகிறது; ‘வெளியானது’ ἐξῆλθεν என்பதன் இயக்க உருவகத்தையும் ஓரளவு காக்கிறது.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: அகுஸ்து சீசரிடமிருந்து
  rationale: παρά + உரிமை வேற்றுமை இங்கு மூலத்தைக் குறிக்கிறது; ஆகவே ‘மூலம்’ அல்லது செயப்பாட்டு ‘ஆல்’ என்பதற்குப் பதிலாக ‘இடமிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: ἀπογράφεσθαι
  choice: பதிவு செய்யப்பட வேண்டும்
  rationale: அதிகாரபூர்வப் பதிவைக் குறிக்கிறது. இவ்வசனம் தனியே வெளிப்படையாகச் சொல்லாத வரி விதிப்பு அல்லது மக்கள் தொகைக் கணக்கெடுப்பு போன்ற கூடுதல் குறிப்புகள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: மக்கள் வாழும் உலகம் முழுவதும்
  rationale: οἰκουμένη என்பதன் அடிப்படைப் பொருளான ‘குடியிருக்கும்/மக்கள் வாழும் உலகம்’ என்பதைக் காக்கிறது; இதை முதன்மை உரையிலேயே ‘ரோமப் பேரரசு’ என்று வரையறுத்துவிடாமல் அதன் சூழல்சார் பரப்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: οἰκουμένη என்பதன் பரப்பு
  choice: மக்கள் வாழும் உலகம் முழுவதும்
  alternative: ரோம உலகம் முழுவதும்; பேரரசு முழுவதும்
  rationale: இது முதன்மையாக வரலாற்று-சொற்பொருள் சார்ந்த தெளிவின்மை. கிரேக்கச் சொல்லின் பொதுப் பொருள் முதன்மை உரையில் காக்கப்பட்டு, ரோமப் பேரரசுச் சூழலுக்குரிய குறுகிய புரிதல் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமும் எளிமையும் இணைக்கப்பட்டுள்ளன. ‘அகுஸ்து சீசர்’ என்பது பெயர் மற்றும் பட்டத்தின் கிரேக்க வரிசையைப் பின்பற்றுகிறது. கதைநடைச் சூத்திரம் தமிழில் தேவையற்ற மறுபடியும் கூறலைத் தவிர்த்து இயல்பாக்கப்பட்டுள்ளது.
