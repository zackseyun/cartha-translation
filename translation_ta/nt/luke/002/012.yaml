source:
  edition: SBLGNT
  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: ta
  text: 'இதுவே உங்களுக்கு அடையாளம்: துணிகளால் சுற்றப்பட்டிருக்கும்[a] ஒரு பச்சிளம் குழந்தை தீவனத் தொட்டியில்[b] கிடப்பதை நீங்கள் காண்பீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துணிப்பட்டைகளில் சுற்றப்பட்டிருக்கும்.’
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரியமாக, ‘முன்னணை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: இங்கு மேய்ப்பர்கள் குழந்தையை அடையாளம் கண்டுகொள்ள உதவும் குறியீட்டை இச்சொல் குறிக்கிறது; அதிசயச் சான்று என்ற பொருளைத் தேவையின்றி சேர்க்காமல், இயல்பான தமிழில் ‘அடையாளம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εὑρήσετε
  choice: நீங்கள் காண்பீர்கள்
  rationale: εὑρίσκω என்பதன் எதிர்கால, இரண்டாம் நபர் பன்மை வடிவம். சூழலில் தேடிச் சென்று கண்டடைவதைக் குறிக்கும் இயல்பான தமிழ் நடை ‘காண்பீர்கள்’.
- source_word: βρέφος
  choice: ஒரு குழந்தை
  rationale: மிக இளம் குழந்தையை, குறிப்பாகப் பச்சிளம் குழந்தையை, βρέφος குறிக்கிறது. ‘குழந்தை’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: ἐσπαργανωμένον
  choice: துணிகளில் சுற்றப்பட்டு
  rationale: குழந்தையைத் துணிகளால் சுற்றியிருந்த நிலையைக் குறிக்கும் முடிவுற்ற செயப்பாட்டு வினையெச்சம். வாசகர்களுக்கு உடனடியாகப் புரியும் வகையில் செயலைத் தெளிவாகச் சொல்கிறது; துணிப்பட்டைகள் என்ற குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κείμενον
  choice: படுத்திருக்கும்
  rationale: குழந்தையின் அப்போதைய நிலையை κεῖμαι குறிக்கிறது. ‘படுத்திருக்கும்’ என்பது முன்பு யாரோ படுக்கவைத்த செயலை முன்னிறுத்தாமல், காணப்படும் நிலையைக் கூறுகிறது.
- source_word: φάτνῃ
  choice: தீவனத் தொட்டி
  rationale: φάτνη என்பது விலங்குகளுக்குத் தீவனம் வைக்கும் தொட்டியைக் குறிக்கும். நவீன தமிழ் வாசகருக்கு பொருளை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கும் சொற்றொடர் இது; பாரம்பரியச் சொல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: இதுவே உங்களுக்கு அடையாளம்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத சுருக்கமான கூறு. ‘இதுவே உங்களுக்கு அடையாளம்’ என்பது அதன் வலியுறுத்தலையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
theological_decisions:
- issue: மேய்ப்பர்களுக்குக் கொடுக்கப்பட்ட அடையாளத்தின் இயல்பு
  choice: குழந்தையை அடையாளம் கண்டுகொள்ள உதவும் குறிப்பாக வசனம் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இது தெய்வீக உறுதிப்பாட்டை வழங்கும் விரிவான இறையியல் அடையாளமாகவும் புரிந்துகொள்ளப்படலாம்.
  rationale: வசனத்தின் உடனடி கவனம், எதிர்பாராத சூழலில் இருக்கும் குழந்தையை மேய்ப்பர்கள் எவ்வாறு அறிந்துகொள்வார்கள் என்பதில் உள்ளது. ஆகவே ‘அடையாளம்’ என்ற சொல் விரிவாக்கமின்றி வைக்கப்பட்டு, கூடுதல் இறையியல் ஆழம் மறைமுகமாகத் திறந்தே விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, dignified பொதுத்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீவனத் தொட்டி’ வாசகருக்குப் பொருளை நேரடியாகத் தெரிவிக்கிறது; ‘முன்னணை’ என்ற பாரம்பரிய வேதாகமச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் அவை சார்ந்த சொற்றொடர்களுக்குப் பின் வசனத்தின் முடிவில் இணைக்கப்பட்டுள்ளன.
