lexical_decisions:
- source_word: ὃ
  choice: அதை
  rationale: முந்தைய வசனத்திலுள்ள ‘மீட்பு’ என்பதைக் குறிக்கும் இடைச்சொல்லைத் தமிழில் இயல்பாகத் தொடரும் சுட்டுப்பெயராக வழங்குகிறது.
- source_word: ἡτοίμασας
  choice: நீர் ஆயத்தப்படுத்தினீர்
  rationale: தேவனை நோக்கிக் கூறப்படும் இரண்டாம் நபர் ஒருமை இறந்தகால வினையைத் தெளிவாகவும் மரியாதையாகவும் தருகிறது.
- source_word: κατὰ πρόσωπον
  choice: கண்முன்பாக
  rationale: அனைவரும் காணும் விதத்தில் வெளிப்படையாக முன்வைக்கப்பட்டிருப்பதை உணர்த்தும் கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: πάντων τῶν λαῶν
  choice: எல்லா மக்களினங்களின்
  rationale: λαῶν என்பதன் பன்மையைப் பேணி, வேறுபட்ட மக்கள் குழுக்களையெல்லாம் உள்ளடக்கும் பரப்பைத் தெரிவிக்கிறது.
theological_decisions:
- issue: அடுத்த வசனத்துடன் தொடர்புபடும் λαῶν என்பதன் பரப்பு
  choice: எல்லா மக்களினங்களின்
  alternative: எல்லா நாடுகளின்; எல்லா மக்களின்
  rationale: பல மக்கள் குழுக்களைக் குறிக்கும் கிரேக்கப் பன்மையைப் பேணுகிறது; புறவினத்தாரையும் இஸ்ரவேலையும் அடுத்த வசனம் விளக்குவதற்கு இடமளித்து, இங்கே பொருளை முன்கூட்டியே குறுக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கண்முன்பாக’ என்பது கிரேக்க உருவகத்தை இயல்பாகத் தக்கவைக்கிறது; ‘மக்களினங்கள்’ என்பது பன்மையைத் தெளிவுபடுத்துகிறது.
