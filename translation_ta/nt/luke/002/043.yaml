source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: ta
  text: அந்த நாட்கள் முடிந்ததும், அவர்கள் திரும்பிச் செல்லும்போது, சிறுவனாகிய இயேசு எருசலேமில் தங்கினார்[a]. அவர் அங்கே தங்கியிருந்தது அவருடைய பெற்றோருக்குத் தெரியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பின்தங்கினார்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘அவருடைய பெற்றோர்.’ இங்கு லூக்கா பயன்படுத்தும் இயல்பான குடும்ப மொழி, நற்செய்தியின் முற்பகுதியில் கூறப்பட்ட கன்னிக் கருத்தரிப்பை மறுப்பதில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: அந்த நாட்கள் முடிந்தபின்
  rationale: முக்கிய நிகழ்வுக்கு முன் அந்த நாட்கள் நிறைவடைந்ததை இந்த மரபுத்தொடர் குறிக்கிறது. உடனடிச் சூழலில் இவை பண்டிகை நாட்கள் என்றாலும், கிரேக்கத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: அவர்கள் திரும்பிச் சென்றுகொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் வினையெச்ச அமைப்பு, இயேசு தங்கிய நிகழ்வு அவர்கள் திரும்பிச் சென்றுகொண்டிருந்த அதே நேரத்தில் நடந்ததைச் சுட்டுகிறது.
- source_word: ὑπέμεινεν
  choice: தங்கிவிட்டார்
  rationale: இச்சூழலில் ὑπομένω என்பதற்கு மற்றவர்கள் புறப்பட்ட பிறகும் ஓரிடத்தில் தங்கியிருத்தல் என்று பொருள். ‘தங்கிவிட்டார்’ என்பது இயல்பான நவீனத் தமிழ்; ‘பின்தங்கினார்’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ παῖς
  choice: சிறுவனாகிய இயேசு
  rationale: παῖς என்பதற்கு குழந்தை, சிறுவன், இளைஞன் போன்ற பொருள்கள் உண்டு. உடனடிச் சூழலில் இயேசுவுக்கு பன்னிரண்டு வயது என்பதால் ‘சிறுவன்’ வயதுக்குப் பொருத்தமானது.
- source_word: ἐν Ἰερουσαλήμ
  choice: எருசலேமிலேயே
  rationale: இடத்தைக் குறிக்கும் ἐν இயல்பாக ‘எருசலேமில்’ என்று மொழிபெயர்க்கப்படுகிறது; மற்றவர்கள் திரும்பிச் சென்ற நிலையில் இயேசு அங்கேயே இருந்தார் என்ற முரணை ‘-ஏ’ வலியுறுத்துகிறது.
- source_word: οὐκ ἔγνωσαν
  choice: இது ... தெரியவில்லை
  rationale: இங்கு γινώσκω ஒரு நிகழ்நிலையை அறிந்திருத்தல் அல்லது உணர்ந்திருத்தலைக் குறிக்கிறது. இயேசு தங்கிவிட்டது அவருடைய பெற்றோருக்குத் தெரியவில்லை என்பதைத் தமிழில் ‘இது’ தெளிவுபடுத்துகிறது.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: அவருடைய பெற்றோர்
  rationale: γονεῖς என்பதன் நேரடியான பொருள் ‘பெற்றோர்’. தேவையற்ற விரிவாக்கமோ இறையியல் ஒத்திசைவாக்கமோ இன்றி லூக்காவின் குடும்ப வழக்கை இது காக்கிறது.
theological_decisions:
- issue: மரியாளையும் யோசேப்பையும் இயேசுவின் γονεῖς என்று குறிப்பிடுதல்
  choice: அவருடைய பெற்றோர்
  alternative: அவருடைய தந்தையும் தாயும்
  rationale: கிரேக்க மூல உரை நேரடியாக ‘அவருடைய பெற்றோர்’ என்கிறது. லூக்கா முன்னதாகக் கூறிய கன்னிப் பிறப்பை மறுப்பதாக இதை மாற்றியமைக்காமல், அவரது இயல்பான குடும்ப மொழியையும் உரையில் உள்ள இறையியல் இழுவிசையையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையாடலுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; வாக்கிய ஓட்டம் இயல்பாக இருக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
