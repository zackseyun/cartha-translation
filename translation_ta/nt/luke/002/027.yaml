  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: ta
  text: அவர் பரிசுத்த ஆவியின் வழிநடத்துதலால் ஆலயத்திற்குள் வந்தார்[a]. சட்டத்தின் வழக்கப்படி அவருக்காகச் செய்வதற்காக, பெற்றோர்[b] குழந்தையான இயேசுவை ஆலயத்திற்குள் கொண்டுவந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘ஆவியில்’ என்று உள்ளது; ‘ஆவியால்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் லூக்கா பரிசுத்த ஆவியானவரைத் தொடர்ந்து குறிப்பிடுவதால், பரிசுத்த ஆவியின் வழிநடத்துதலே பொருளாக இருக்க வாய்ப்பு வலுவாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘பெற்றோர்’ என்றே உள்ளது. மரியாளையும் யோசேப்பையும் இயேசுவைக் கவனித்தவர்களாகக் குறித்து லூக்கா இங்கு சாதாரண குடும்ப மொழியைப் பயன்படுத்துகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: ஆவியில்
  rationale: இக்கிரேக்கச் சொற்றொடரின் முன்னிடைச்சொல் அமைப்பை நெருக்கமாகப் பேணுகிறது. உடனடிச் சூழலில் பரிசுத்த ஆவியானவர் மீண்டும் மீண்டும் குறிப்பிடப்படுவதால், சிமியோனின் மனநிலையை அல்ல, பரிசுத்த ஆவியானவரையே இது குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: ἱερόν
  choice: ஆலயம்
  rationale: ναός குறிக்கும் உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல், ஆலய வளாகத்தைக் குறிக்கும் பொதுவான சொல்லாக ἱερόν இங்கு வருகிறது. ‘ஆலயம்’ இயல்பானதும் போதுமான அகலமுள்ளதுமான தமிழாக்கம்.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: உள்ளே கொண்டுவந்தபோது
  rationale: ἐν உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் இங்கு காலத்தைக் குறிக்கிறது; தமிழில் ‘...கொண்டுவந்தபோது’ என்பது அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: இது கிரேக்கச் சொல்லின் நேரடியான, சாதாரண குடும்பப் பொருள். மரியாளையும் யோசேப்பையும் இயேசுவைப் பராமரித்த குடும்ப அலகாக லூக்கா விவரிப்பதை இது பிரதிபலிக்கிறது.
- source_word: παιδίον Ἰησοῦν
  choice: குழந்தை இயேசு
  rationale: παιδίον இச்சூழலில் குழந்தை அல்லது கைக்குழந்தையைக் குறிக்கிறது; பெயருடன் சேர்த்து ‘குழந்தை இயேசு’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: τοῦ ποιῆσαι αὐτοὺς
  choice: செய்வதற்காகப் பெற்றோர்
  rationale: பெயராக்கப்பட்ட வினையெச்சம் நோக்கத்தைக் குறிக்கிறது; அதன் புரிந்துகொள்ளப்பட்ட எழுவாய் பெற்றோரே. தமிழில் எழுவாயை நோக்கத் தொடருக்குப் பின் அமைப்பது கருத்தைத் தெளிவாக்குகிறது.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: சட்டத்தில் வழக்கமாக இருந்ததை
  rationale: εἰθισμένον என்பது வழக்கமாக அல்லது மரபுப்படி செய்யப்பட்டதைச் சுட்டுகிறது. இந்தத் தமிழாக்கம் சட்டத்துடன் தொடர்புடைய வழக்கமான கடமையை, பழைய சமய நடையைத் தவிர்த்து, தெளிவாகத் தெரிவிக்கிறது.
- source_word: περὶ αὐτοῦ
  choice: அவருக்காக
  rationale: περί உடன் வரும் மரபுவேற்றுமை இங்கு குழந்தையைச் சார்ந்த செயலைக் குறிக்கிறது; சடங்கு சார்ந்த இச்சூழலில் ‘அவருக்காக’ என்பது இயல்பான தமிழ்.
theological_decisions:
- issue: சிமியோனின் செயலுடன் தொடர்புடைய ‘ஆவி’ யார்?
  choice: பரிசுத்த ஆவியானவர்
  alternative: சிமியோனின் சொந்த ஆவி அல்லது உள்ளார்ந்த மனநிலை
  rationale: லூக்கா 2:25–27 உடனடிச் சூழலில் பரிசுத்த ஆவியானவரைப் பற்றிய தொடர்ச்சியான குறிப்புகள் உள்ளதால், இங்கும் அவரையே குறிப்பது வலுவாக ஆதரிக்கப்படுகிறது. அதேவேளை, ‘ஆவியில்’ என்பது கிரேக்கத்தின் வடிவத்தையும் அதன் நுட்பத்தையும் பேணுகிறது.
- issue: மரியாளையும் யோசேப்பையும் ‘பெற்றோர்’ என்று குறிப்பிடுதல்
  choice: γονεῖς என்பதை நேரடியாக ‘பெற்றோர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பாதுகாவலர்கள்’ அல்லது ‘யோசேப்பும் மரியாளும்’ என்று மாற்றுதல்
  rationale: உரையின் சாதாரண குடும்ப மொழியைத் தளர்த்தவோ விரிவாக்கவோ கூடாது. இது கன்னிப் பிறப்பை மறுக்கும் உயிரியல் கூற்றல்ல; இயேசுவைக் கவனித்த மனிதக் குடும்பத்தைப் பற்றிய லூக்காவின் கதைநடை விளக்கம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழைய திருச்சபைச் சொல்லுக்கு மாற்றாகச் சூழலில் தெளிவான ‘சட்டம்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கிய அமைப்பைக் கொண்டிருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
