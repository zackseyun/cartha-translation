- issue: ὅπως ἂν என்பதன் நோக்கம்–விளைவு உறவு
  choice: ‘இவ்வாறு’ என்று இரண்டையும் அனுமதிக்கும் தொடர்பு
  alternative: ‘இதற்காகவே’ என்று நோக்கத்தை மட்டும் வலியுறுத்துதல்
  rationale: இணைப்புச் சொல் நோக்கத்தையோ எதிர்பார்க்கப்பட்ட விளைவையோ குறிக்கலாம்; தமிழாக்கம் அந்த இறையியல் அழுத்தத்தைத் தேவையின்றி தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாளை நோக்கிய ஒருமை நேரடி உரையைக் காக்கும் வகையில் எழுதப்பட்டுள்ளது. ‘ஆத்துமா’ என்ற சமயத் தொழில்நுட்பச் சொல்லுக்குப் பதிலாக இச்சூழலில் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டுள்ளது; நடை கண்ணியமாகவும் பொதுவாசகர்களுக்குப் புரியத்தக்கதாகவும் வைக்கப்பட்டுள்ளது.
