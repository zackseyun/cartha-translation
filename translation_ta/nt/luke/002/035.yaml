  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: ta
  text: உன் சொந்த உள்ளத்தையும் ஒரு வாள் ஊடுருவிச் செல்லும்[a][b]; இதனால், பலருடைய இதயங்களில் உள்ள எண்ணங்கள் வெளிப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊடுருவிச் செல்லும்’ என்பதற்கு, ‘கடந்து செல்லும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் நேரடியாக ‘ஊடாகச் செல்லும்’ என்று பொருள்படும்; வாள் என்ற உருவகம் குத்திச் செல்லும் கருத்தை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வாள்’ என்பது மரியாள் அனுபவிக்கவிருந்த ஆழ்ந்த வேதனையைக் குறிக்கும் உருவகமாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: உன் சொந்த
  rationale: மரியாளை ஒருமையில் நேரடியாக அழைக்கும் சொற்களின் வலியுறுத்தலை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: ψυχή
  choice: உள்ளம்
  rationale: இங்கு உடல் உயிரை மட்டும் அல்லாமல் ஆழ்ந்த வேதனையை அனுபவிக்கும் அகமனிதரைச் சுட்டுகிறது; தமிழில் ‘உள்ளம்’ இயல்பாக அந்த உணர்வைத் தருகிறது.
- source_word: διελεύσεται
  choice: ஊடுருவிச் செல்லும்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘ஊடாகச் செல்லும்’ என்பதையும், வாள் உருவகத்தின் இயல்பான குத்திச் செல்லும் வலிமையையும் ஒருங்கே தருகிறது.
- source_word: ῥομφαία
  choice: வாள்
  rationale: பெரிய அல்லது வலிமையான வாளைக் குறிக்கக்கூடிய சொல்லுக்கு, இச்சூழலில் இயல்பானதும் போதுமானதும் ‘வாள்’ ஆகும்.
- source_word: ὅπως ἂν
  choice: இவ்வாறு
  rationale: முன் கூறிய நிகழ்வுக்கும் இதய எண்ணங்கள் வெளிப்படுவதற்கும் உள்ள நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பை, ஒன்றை மட்டும் கடுமையாகத் தீர்மானிக்காமல் காட்டுகிறது.
- source_word: ἀποκαλυφθῶσιν
  choice: வெளிப்படும்
  rationale: மறைந்திருந்தவை வெளிக்கொணரப்படுதல் என்ற செயல்பாட்டை இயல்பான தமிழில் தருகிறது; கிரேக்கச் செயலப்பாட்டு வடிவத்தின் கருத்து பாதுகாக்கப்படுகிறது.
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: பலருடைய இதயங்களிலுள்ள எண்ணங்கள்
  rationale: எண்ணங்கள் பல இதயங்களின் அகத்திலிருந்து எழுகின்றன என்ற மூலச்சொல்லின் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வாள் உருவகத்தின் குறிப்பான நிறைவேற்றம்
  choice: மரியாளுக்கு ஏற்படும் ஆழ்ந்த தனிப்பட்ட வேதனையாக உருவகத்தைத் திறந்த நிலையில் வைத்தல்
