reference: Luke 2:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: ta
  text: மேலும், ஆண்டவருடைய திருச்சட்டத்தில் சொல்லப்பட்டிருக்கிறபடி, “ஒரு ஜோடி காட்டுப்புறாக்களையோ இரண்டு புறாக்குஞ்சுகளையோ” பலியாகச் செலுத்துவதற்காகவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: பலியாகச் செலுத்துவதற்காக
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், θυσίαν உடன் வரும் இச்சூழலில் தமிழில் ‘பலியாகச் செலுத்து’ என்பது இயல்பாகவும் பலிசார் பொருளைத் தெளிவாகவும் தெரிவிக்கிறது. Articular infinitive நோக்கத்தைக் குறிக்கிறது.
- source_word: κατὰ τὸ εἰρημένον
  choice: சொல்லப்பட்டிருக்கிறபடி
  rationale: Perfect passive participle, முன்பு சொல்லப்பட்டதும் தொடர்ந்து அதிகாரபூர்வமாக நிலைத்திருப்பதுமான கருத்தைத் தருகிறது. ‘கட்டளையிடப்பட்டபடி’ என்று விளக்கமாக மாற்றாமல், மூலத்தின் ‘சொல்லுதல்’ என்ற கருத்து பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: ஆண்டவருடைய திருச்சட்டத்தில்
  rationale: νόμος இங்கு மோசேயின் சட்டமாகிய வேதப்பகுதியைக் குறிக்கிறது. நவீன தமிழில் ‘திருச்சட்டம்’ அதன் வேத, உடன்படிக்கை சார்ந்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது; κύριος ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ζεῦγος τρυγόνων
  choice: ஒரு ஜோடி காட்டுப்புறாக்கள்
  rationale: ζεῦγος என்பது இங்கு இரண்டு பறவைகள் சேர்ந்த ஒரு ஜோடியைக் குறிக்கிறது; τρυγών பொதுவான புறாவை அல்ல, குறிப்பாக turtledove வகையைச் சுட்டுவதால் ‘காட்டுப்புறா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: இரண்டு புறாக்குஞ்சுகள்
  rationale: νοσσός இளம் பறவையைக் குறிக்கிறது; περιστερά உடன் சேர்ந்து இயல்பான தமிழில் ‘புறாக்குஞ்சுகள்’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: திருச்சட்டத்தை வழங்கியவரைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: இங்கு κύριος தெய்வீகச் சட்டத்தின் ஆண்டவரைக் குறிக்கிறது. நவீன பொதுத்தமிழில் ‘ஆண்டவர்’ தெளிவாகவும் மரியாதையுடனும் உள்ளது; எந்த ஒரு பிரிவுசார் வழக்கையும் தேவையின்றி முன்னிறுத்துவதில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் articular infinitive முந்தைய வசனத்தின் முதன்மை வினையோடு இலக்கண ரீதியாக இணைந்திருப்பதால், இவ்வசனமும் ‘பலியாகச் செலுத்துவதற்காகவும்’ எனத் தொடர்வாக்கியமாகவே வைக்கப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘சென்றார்கள்’ போன்ற முதன்மை வினை சேர்க்கப்படவில்லை.
