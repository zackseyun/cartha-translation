  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: ta
  text: குரேனியு சிரியாவை ஆட்சி செய்துகொண்டிருந்தபோது இந்தப் பதிவு முதன்முறையாக நடைபெற்றது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குரேனியு சிரியாவை ஆட்சி செய்வதற்கு முன்பு இந்தப் பதிவு நடைபெற்றது.’ இங்கு ‘முதல்’ என்பதற்கான கிரேக்கச் சொல்லை ஒப்பீட்டுக் காலப் பொருளில் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘பதிவு’ என்பதற்குப் பதிலாக, ‘மக்கள் கணக்கெடுப்பு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அதிகாரப்பூர்வமாகப் பெயர்களைப் பதிவுசெய்வதைக் குறிக்கிறது; இது பெரும்பாலும் வரிவிதிப்புடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: இந்த
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அதிகாரப்பூர்வப் பதிவைக் குறிக்கும் சுட்டுப்பெயராக இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: ἀπογραφὴ
  choice: பதிவு
  rationale: அரசின் அதிகாரப்பூர்வப் பதிவுசெய்தலைக் குறிக்கிறது. வரிவிதிப்பு அல்லது மக்கள்தொகைக் கணக்கெடுப்புடன் தொடர்புடையதாக இருக்கலாம்; ஆனால் மூலச்சொல்லைவிடக் குறுகிய பொருளை முதன்மை உரையில் திணிக்காமல் ‘பதிவு’ எனத் தரப்பட்டுள்ளது.
- source_word: πρώτη
  choice: முதன்முறையாக
  rationale: மூலச்சொல்லின் இயல்பான வரிசை எண் சார்ந்த பொருளான ‘முதல்’ என்பதை, நிகழ்வுடன் இணையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγένετο
  choice: நடைபெற்றது
  rationale: ஒரு நிர்வாக நிகழ்வு நிகழ்ந்ததைக் குறிக்கும் γίνομαι என்பதற்கு இயல்பான தமிழாக்கம்.
- source_word: ἡγεμονεύοντος
  choice: ஆட்சி செய்துகொண்டிருந்தபோது
  rationale: ஒரே காலத்தில் நிலவிய சூழலைக் காட்டும் கிரேக்கப் பங்கேற்புவினையின் காலத் தொடர்பைப் பாதுகாக்கிறது; குறிப்பிட்ட அதிகாரப் பதவிப் பெயரைத் தேவையின்றித் திணிப்பதில்லை.
- source_word: τῆς Συρίας
  choice: சிரியாவை
  rationale: ஆட்சி செய்தல் என்ற தமிழ்வினையின் நேர்ச்செயப்படுபொருளாகப் புவியியல் பெயர் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: Κυρηνίου
  choice: குரேனியு
  rationale: கிரேக்கப் பெயரின் தொடக்க மெய்யொலியைப் பாதுகாக்கும் தெளிவான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: வரலாற்று மற்றும் தொடரியல் விவாதத்திற்குரிய πρώτη என்பதன் பொருள்
  choice: முதன்மை உரையில் வரிசை எண் சார்ந்த இயல்பான பொருளாக ‘முதன்முறையாக’ என்று மொழிபெயர்த்தல்.
  alternative: ‘குரேனியு சிரியாவை ஆட்சி செய்வதற்கு முன்பு இந்தப் பதிவு நடைபெற்றது.’
  rationale: πρώτη என்பதன் நேரடியான பொருள் ‘முதல்’ என்பதாகும். ‘முன்பு’ என்ற ஒப்பீட்டுக் காலப் பொருள் சிலரால் முன்வைக்கப்பட்டாலும் அது உறுதியானதல்ல; எனவே தெளிவின்மையை மறைக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. இதில் எந்தக் குறிப்பிட்ட கோட்பாட்டு நிலைப்பாடும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நிர்வாகப் பொருளைத் தெளிவாக வைத்திருக்க ‘பதிவு’ தேர்ந்தெடுக்கப்பட்டுள்ளது; விவாதத்திற்குரிய வரலாற்றுத் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
