base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: ta
  text: அவள் தன் முதற்பேறான மகனைப் பெற்றெடுத்தாள். அவரைத் துணிகளால் சுற்றி[a], விலங்குகளின் தீவனத் தொட்டியில்[b] கிடத்தினாள்; ஏனெனில் விருந்தினர் அறையில்[c] அவர்களுக்கு இடம் இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைச் சுவட்டுத் துணிகளால் சுற்றி.”
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரியமாக, “முன்னணை.” கிரேக்கச் சொல் விலங்குகளுக்குத் தீவனம் வைக்கும் இடத்தையோ தொட்டியையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: பாரம்பரியமாக, “விடுதி.” கிரேக்க κατάλυμα என்பது விருந்தினர் அறையையோ தங்குமிடத்தையோ குறிக்கலாம்; வணிக விடுதியைக் குறிக்க லூக்கா 10:34-இல் வேறு சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
