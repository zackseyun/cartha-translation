  rationale: பச்சிளங்குழந்தையைத் துணிகளால் சுற்றிய செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνέκλινεν
  choice: கிடத்தினாள்
  rationale: இச்சூழலில் குழந்தையைப் படுக்க வைத்ததைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: φάτνῃ
  choice: விலங்குகளின் தீவனத் தொட்டி
  rationale: விலங்குகளுக்குத் தீவனம் வைக்கும் இடம் அல்லது தொட்டி என்ற சொல்லின் தெளிவான பொருளை நவீன வாசகருக்குத் தருகிறது.
- source_word: τόπος
  choice: இடம்
  rationale: τόπος என்பதன் பரந்த இடம் அல்லது வசதி என்ற பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταλύματι
  choice: விருந்தினர் அறை
  rationale: இச்சொல் விருந்தினர் தங்கும் அறையையோ தங்குமிடத்தையோ குறிக்கலாம்; லூக்கா 22:11-இல் உள்ள பயன்பாட்டுக்கும் இது ஒத்திருக்கிறது.
theological_decisions:
- issue: κατάλυμα என்பது வணிக விடுதியைக் குறிக்கிறதா, வீட்டிலுள்ள விருந்தினர் அறையைக் குறிக்கிறதா
  choice: விருந்தினர் அறை
  alternative: விடுதி; தங்குமிடம்
  rationale: கிரேக்கச் சொல் வணிக விடுதியைக் கட்டாயமாகக் குறிக்கவில்லை. லூக்கா 10:34-இல் வணிக விடுதிக்கு வேறு சொல்லும், லூக்கா 22:11-இல் κατάλυμα என்பதற்கு விருந்தினர் அறை என்ற பயன்பாடும் காணப்படுவதால், பாரம்பரிய காட்சியைத் திணிக்காமல் ‘விருந்தினர் அறை’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘அவரை’ என்ற மரியாதைச் சுட்டுப்பெயர் தமிழ்க் கிறிஸ்தவ வாசிப்பு மரபில் இயல்பானதாக இருப்பதால் பயன்படுத்தப்பட்டது. பாரம்பரியச் சொற்கள் பிரதான உரையில் தெளிவை மறைக்காதவாறு மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
