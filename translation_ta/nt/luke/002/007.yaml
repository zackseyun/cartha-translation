- source_word: ἔτεκεν
  choice: பெற்றெடுத்தாள்
  rationale: குழந்தைப்பேற்றைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; மூலத்தின் நேரடியான பொருளைப் பேணுகிறது.
- source_word: πρωτότοκον
  choice: முதற்பேறான
