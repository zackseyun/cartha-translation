- from: அதன்பின், அவள் எண்பத்து நான்கு வயதுவரை விதவையாக இருந்தாள்.[a] அவள் ஆலயத்தைவிட்டு நீங்காமல்[b], இரவும் பகலும் நோன்புகளோடும் மன்றாட்டுகளோடும்[c] வழிபட்டுவந்தாள்.
