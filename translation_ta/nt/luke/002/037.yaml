id: LUK.2.37
reference: Luke 2:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: ta
  text: அவள் எண்பத்து நான்கு வயதுடைய விதவையாக இருந்தாள்.[a] அவள் ஆலயத்தை விட்டு நீங்காமல்,[b] இரவும் பகலும் நோன்புகளோடும் மன்றாட்டுகளோடும்[c] வழிபட்டுவந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் எண்பத்து நான்கு ஆண்டுகள் விதவையாக இருந்தாள்.” கிரேக்கத் தொடரை அன்னாளின் வயதாகவோ, அவள் விதவையாக இருந்த கால அளவாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: இங்குள்ள கிரேக்கச் சொல் ஆலயத்தின் உட்புறத் திருத்தலத்தை மட்டும் அல்ல, ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “வேண்டுதல்களோடும்” அல்லது “பிரார்த்தனைகளோடும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: விதவையாக
  rationale: கணவனை இழந்த பெண்ணைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; இங்கு அன்னாளின் வாழ்க்கை நிலையைக் குறிக்கிறது.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: எண்பத்து நான்கு வயதுவரை
  rationale: முதன்மை வாசிப்பாக அன்னாளின் வயதைக் குறிக்கிறது; கிரேக்கத் தொடரில் உள்ள விதவைக் கால அளவு என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: ஆலயத்தைவிட்டு நீங்காமல்
  rationale: இறந்தகாலத்தில் தொடர்ந்த வழக்கமான செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἱεροῦ
  choice: ஆலயம்
  rationale: ἱερόν என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் விரிந்த ஆலய வளாகத்தைக் குறிக்கிறது; பொதுவாசிப்புக்கு இயல்பான சொல்லை முதன்மை உரையில் வைத்து, துல்லியத்தை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: νηστείαις
  choice: நோன்புகளோடும்
  rationale: பன்மை வடிவத்தையும், திரும்பத் திரும்ப மேற்கொண்ட நோன்புப் பழக்கத்தையும் காக்கிறது.
- source_word: δεήσεσιν
  choice: மன்றாட்டுகளோடும்
  rationale: δέησις என்பதிலுள்ள இறைஞ்சுதல் அல்லது வேண்டுதல் என்ற நுண்பொருளை இயல்பாகத் தருகிறது.
- source_word: λατρεύουσα
  choice: வழிபட்டுவந்தாள்
  rationale: தொடர்ச்சியான இறைசார்ந்த வழிபாட்டுச் சேவையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: νύκτα καὶ ἡμέραν
  choice: இரவும் பகலும்
  rationale: கிரேக்கச் சொல் வரிசையையும் இடைவிடாத பக்தியைக் குறிக்கும் மரபுத்தொடரையும் காக்கும் இயல்பான தமிழ்.
theological_decisions:
- issue: இது அன்னாளின் வயதைக் குறிக்கிறதா, அவள் விதவையாக இருந்த காலத்தைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் அவள் எண்பத்து நான்கு வயதுவரை விதவையாக இருந்தாள் என மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அவள் எண்பத்து நான்கு ஆண்டுகள் விதவையாக இருந்தாள் என்றும் கிரேக்கத் தொடரைப் புரிந்துகொள்ளலாம்.
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல, இலக்கண மற்றும் விளக்கவியல் சார்ந்த தெளிவின்மை. கிரேக்கம் இரு வாசிப்புகளுக்கும் இடமளிப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. “நீங்காமல்” மற்றும் “வழிபட்டுவந்தாள்” ஆகியவை தொடர்ச்சியான வழக்கச் செயலை இயல்பாகத் தெரிவிக்கின்றன; மூலத்தில் உள்ள வயது/விதவைக் காலத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
