  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: ta
  text: 'ஆண்டவருடைய திருச்சட்டத்தில் எழுதப்பட்டுள்ளபடி: “கர்ப்பப்பையைத் திறக்கும் ஒவ்வோர் ஆண் குழந்தையும் ஆண்டவருக்குப் பரிசுத்தமானவன் என்று அழைக்கப்படுவான்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அதாவது, முதற்பிறந்த ஆண் குழந்தை ஆண்டவருக்குப் பரிசுத்தமானவனாகவும், அவருக்கென ஒதுக்கப்பட்டவனாகவும் கருதப்படுவான். காண்க: யாத்திராகமம் 13:2, 12.'
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: எழுதப்பட்டுள்ளபடி
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் நிலையான சூத்திரத்தையும், எழுதப்பட்டதன் நீடித்த அதிகாரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν νόμῳ κυρίου
  choice: ஆண்டவருடைய திருச்சட்டத்தில்
  rationale: இங்கு νόμος மோசேயின் சட்டத்தொகுப்பைக் குறிக்கிறது; ‘திருச்சட்டம்’ என்பது சாதாரண சட்டத்திலிருந்து அதை வேறுபடுத்தி, நவீன தமிழில் மரியாதையான வேதாகம நடையைத் தருகிறது.
- source_word: Πᾶν ἄρσεν
  choice: ஒவ்வோர் ஆணும்
  rationale: கிரேக்கத்தின் ஆண்பால் குறிப்பை நேரடியாகப் பாதுகாக்கிறது; சூழலில் இது ஆண் குழந்தையைக் குறித்தாலும், முதன்மை உரையில் ‘குழந்தை’ என்பதைச் சேர்க்கவில்லை.
- source_word: διανοῖγον μήτραν
  choice: கருப்பையைத் திறக்கும்
  rationale: முதற்பேறான ஆணைக் குறிக்கும் மூலமொழியின் உருவகச் சொற்றொடரை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: ἅγιον τῷ κυρίῳ
  choice: ஆண்டவருக்குப் பரிசுத்தமானவன்
  rationale: ἅγιον என்பதன் பரிசுத்தச் சொல்லாட்சியைத் தக்கவைத்து, அர்ப்பணிப்பு என்ற விளக்கத்தை முதன்மை உரைக்குள் புகுத்தவில்லை.
- source_word: κληθήσεται
  choice: என்று அழைக்கப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், ஒருவரின் நிலை அல்லது பெயரிடலைக் குறிக்கும் இயல்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் திருச்சட்ட மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: மொழிபெயர்க்கப்படும் கிரேக்க உரையில் κύριος உள்ளது. ‘ஆண்டவர்’ நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையாகவும் இருந்து, குறிப்பிட்ட சமயமரபின் தனிச்சொல்லாட்சியைத் தவிர்க்கிறது.
- issue: ἅγιον என்பதில் பரிசுத்தமா அல்லது அர்ப்பணிக்கப்பட்டதா
  choice: பரிசுத்தமானவன்
  alternative: அர்ப்பணிக்கப்பட்டவன் / தனியாகப் பிரிக்கப்பட்டவன்
  rationale: மூலத்தில் நேரடியாக உள்ள பரிசுத்தக் கருத்தை முதன்மை உரை தக்கவைக்கிறது; ஆண்டவருக்கென ஒதுக்கப்பட்ட நிலை என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதையான வேதாகம நடை. மேற்கோளின் சட்டநடைத் தன்மையைத் தக்கவைக்கிறது; அரிதான சொற்களையும் சமயப்பிரிவு சார்ந்த தனிச்சொல்லாட்சியையும் தவிர்க்கிறது.
