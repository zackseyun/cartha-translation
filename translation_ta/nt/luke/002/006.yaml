base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: ta
  text: அவர்கள் அங்கே இருந்தபோது, அவள் குழந்தையைப் பெற்றெடுப்பதற்கான நாட்கள் நிறைவடைந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் குழந்தையைப் பெற்றெடுப்பதற்கான நாட்கள் பூர்த்தியாயின.”
    reason: ἐπλήσθησαν என்பதன் ‘முழுமை அடைதல்/பூர்த்தியாதல்’ என்ற நெருங்கிய சொற்பொருள் மாற்றைத் தருகிறது.
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: (தனி சொற்றொடராக மொழிபெயர்க்காமல் நிகழ்வின் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது)
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் கதை நகர்வைக் குறிக்கிறது. தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ என்று சொல்வது தேவையற்ற இறுக்கத்தை உண்டாக்கும்; வாக்கியத்தின் இயல்பான தொடர்ச்சி அதன் பணியை நிறைவேற்றுகிறது.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: அவர்கள் அங்கே இருந்தபோது
  rationale: ἐν உடன் வரும் வினையெச்சக் கட்டமைப்பு ஒரே நேரத்தில் நிகழ்வதைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் அந்தக் காலத் தொடர்பை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐπλήσθησαν
  choice: நிறைவடைந்தன
  rationale: அந்தக் காலப்பகுதி முழுமையை அடைந்தது என்ற செயப்பாட்டு உணர்வை இது காக்கிறது; ‘நேரம் வந்தது’ என்று சுருக்கி மூலத்தின் நிறைவு மொழியை இழக்கவில்லை.
- source_word: αἱ ἡμέραι
  choice: நாட்கள்
  rationale: கிரேக்கத்தில் உள்ள பன்மைச் சொல்லை நேரடியாகக் காத்து, பிரசவத்திற்குரிய காலம் நிறைவடைந்தது என்ற மரபுத்தொடரின் பொருளையும் தமிழில் புரியத்தக்கவாறு தருகிறது.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: அவள் குழந்தையைப் பெற்றெடுப்பதற்கான
  rationale: அவளே பெற்றெடுக்கவிருந்தாள் என்பதையும் வினைச்செயலின் பொருளையும் தெளிவாகக் காக்கிறது. தமிழில் ‘பெற்றெடுப்பது’ என்பதற்குத் தேவையான செயப்படுபொருளாக ‘குழந்தையை’ வெளிப்படையாகச் சேர்ப்பது இயல்பானது.
theological_decisions:
- issue: ἐπλήσθησαν αἱ ἡμέραι என்பதில் இறைத் திட்டத்தின்படி குறிக்கப்பட்ட காலம் என்ற உட்குறிப்பு இருக்கக்கூடிய சாத்தியம்
  choice: நாட்கள் நிறைவடைந்தன
  alternative: அவள் பெற்றெடுக்கும் நேரம் வந்தது
  rationale: இந்த வசனம் முதன்மையாக கர்ப்பகாலம் முடிந்து பிரசவ நேரம் வந்ததைச் சொல்கிறது; அதேவேளையில் லூக்காவின் ‘நிறைவு’ மொழியில் இருக்கக்கூடிய நுட்பமான ஒலியையும் முற்றிலும் நீக்கவில்லை. வெளிப்படையாகக் கூறப்படாத இறையியல் கருத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு தெளிவான, மரியாதைமிக்க நடையுடன், கிரேக்கத்தின் ‘நாட்கள் நிறைவடைந்தன’ என்ற சொல்லமைப்பு முடிந்தவரை காக்கப்பட்டுள்ளது.
