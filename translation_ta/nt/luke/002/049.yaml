id: LUK.2.49
reference: Luke 2:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நீங்கள் ஏன் என்னைத் தேடிக்கொண்டிருந்தீர்கள்? நான் என் தந்தையின் வீட்டில்[a] இருக்க வேண்டும் என்பது உங்களுக்குத் தெரியாதா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தந்தைக்குரிய காரியங்களில் நான் இருக்க வேண்டும்.” கிரேக்கச் சொற்றொடரில் ஒரு சொல் விடுபட்டிருப்பதால், அது தந்தையின் வீட்டையோ தந்தைக்குரிய காரியங்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐζητεῖτέ
  choice: தேடிக்கொண்டிருந்தீர்கள்
  rationale: பெற்றோர் தொடர்ந்து தேடியதைச் சூழல் காட்டுவதால், இறந்தகாலத் தொடர்நிலையை இத்தேர்வு இயல்பாகக் கொண்டுவருகிறது.
- source_word: οὐκ ᾔδειτε
  choice: உங்களுக்குத் தெரியாதா?
  rationale: அறிவு அல்லது உணர்வைக் குறிக்கும் வினையை அதன் எதிர்மறை வினாவியல் வலிமையுடன் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: என் தந்தையின் வீட்டில்
  rationale: கிரேக்கச் சொற்றொடர் விடுபட்ட உறுப்பைக் கொண்டது; இயேசு ஆலயத்தில் கண்டுபிடிக்கப்பட்ட உடனடிச் சூழலில் ‘வீட்டில்’ என்பது சாத்தியமான முதன்மைப் பொருள். மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δεῖ
  choice: இருக்க வேண்டும்
  rationale: வெறும் விருப்பத்தை அல்லாமல் கட்டாயம் அல்லது தெய்வீக அவசியத்தைத் தெரிவிக்கிறது.
- source_word: εἶναί με
  choice: நான் ... இருக்க
  rationale: δεῖ என்பதுடன் வரும் குற்றுவினை எழுவாயையும் வினையையும் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πατρός μου
  choice: என் தந்தையின்
  rationale: இங்கு யோசேப்பை அல்ல, கடவுளைத் தம் தந்தையாக இயேசு குறிப்பிடும் உறவுமுறைக் கூற்றை விளக்கச் சொற்கள் சேர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν τοῖς τοῦ πατρός μου என்ற விடுபட்ட உறுப்புடைய சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘என் தந்தையின் வீட்டில்’
  alternative: ‘என் தந்தைக்குரிய காரியங்களில் ஈடுபட்டிருக்க’ அல்லது ‘என் தந்தைக்குரியவற்றில் இருக்க’
  rationale: ஆலயச் சூழல் ‘வீடு’ என்ற பொருளை வலுப்படுத்துகிறது; எனினும் கிரேக்கம் தந்தையின் காரியங்கள் அல்லது அக்கறைகள் என்ற பொருளையும் அனுமதிப்பதால் அந்த உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ‘என் தந்தை’ என்பவர் யார்
  choice: கடவுளைத் தந்தையாகக் குறிக்கும் உரை அப்படியே பாதுகாக்கப்பட்டது
  alternative: யோசேப்பைக் குறிக்கும் வாசிப்பு
  rationale: ஆலயச் சூழலும் யோசேப்பிடம் பேசப்படும் இந்தக் கூற்றின் எதிர்மறை வேறுபாடும் கடவுளையே சுட்டுகின்றன; மொழிபெயர்ப்பு இதற்கு மேலாகக் கோட்பாட்டு விளக்கம் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டது; ‘தேடிக்கொண்டிருந்தீர்கள்’ தொடர்ந்த தேடலை இயல்பாகக் காட்டுகிறது.
