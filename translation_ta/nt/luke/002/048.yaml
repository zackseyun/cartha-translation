source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: ta
  text: அவர்கள் அவரைக் கண்டபோது வியப்படைந்தார்கள். அவருடைய தாய் அவரிடம், “பிள்ளையே, ஏன் எங்களுக்கு இப்படிச் செய்தாய்? இதோ, உன் தந்தையும் நானும் மனவேதனையோடு உன்னைத் தேடிக்கொண்டிருந்தோம்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனவேதனையோடு” என்பதற்கான கிரேக்கச் சொல், மிகுந்த துயரம், வேதனை அல்லது மனக்கலக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: அவர்கள் அவரைக் கண்டபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐξεπλάγησαν
  choice: வியப்படைந்தார்கள்
  rationale: அவர்கள் அடைந்த வலுவான வியப்பை நவீன, பொதுவாகப் புரியும் தமிழில் தெரிவிக்கிறது.
- source_word: Τέκνον
  choice: பிள்ளையே
  rationale: தாய் அன்போடு அழைக்கும் விளிப்பாகும்; கிரேக்கச் சொல்லில் இல்லாத ‘என்’ என்ற உடைமையைச் சேர்க்காமல் அதன் பாசத்தையும் பொதுவான பொருளையும் காக்கிறது.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: ஏன் எங்களுக்கு இப்படிச் செய்தாய்?
  rationale: கிரேக்கக் கேள்வியின் குறைசொல்லும் உறவுசார் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: நேரடிப் பேச்சில் கவனத்தை வலியுறுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: ὁ πατήρ σου
  choice: உன் தந்தை
  rationale: கிரேக்கத்தில் உள்ள எளிய குடும்ப உறவுச் சொல்லை விளக்கச் சொல் சேர்க்காமல் அப்படியே காக்கிறது.
- source_word: ὀδυνώμενοι
  choice: மனவேதனையோடு
  rationale: தேடிக்கொண்டிருந்தபோது அனுபவித்த ஆழ்ந்த உணர்ச்சி வேதனையைத் தெளிவாகக் காட்டுகிறது; வெறும் கவலையாக அதன் வலிமையைக் குறைக்கவில்லை.
- source_word: ἐζητοῦμέν σε
  choice: உன்னைத் தேடிக்கொண்டிருந்தோம்
  rationale: முடிவுறா இறந்தகால வினையின் தொடர்ச்சியான தேடலை இயல்பான தமிழ் வினை வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றி யோசேப்பை ‘உன் தந்தை’ என்று மரியா குறிப்பிடுதல்
  choice: ‘உன் தந்தை’ என்ற மூலச் சொல்லை எந்தத் தகுதிச்சொல்லும் சேர்க்காமல் வைத்தல்
  alternative: ‘உன் உலகத் தந்தை’ அல்லது ‘உன்னை வளர்த்த தந்தை’
  rationale: மரியாவின் சொற்களை கிரேக்க உரை எளிமையாகவே தருகிறது. ‘உலகத்’ அல்லது ‘வளர்த்த’ என்று சேர்ப்பது மொழிபெயர்ப்பைவிட விளக்கமாகிவிடும்; அடுத்த வசனத்துடன் உள்ள இறையியல் பதற்றத்தையும் உரையாடலின் இயல்பையும் மூலப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், குடும்ப உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘பிள்ளையே’ என்பது தாயின் பாசமுள்ள அழைப்பாகவும், ‘மனவேதனையோடு’ என்பது கிரேக்கப் பங்கேற்பு வினையின் உணர்ச்சி வலிமையை வெளிப்படுத்துவதாகவும் தேர்ந்தெடுக்கப்பட்டன.
