source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: ta
  text: ஆண்டவருடைய வானதூதர் ஒருவர் அவர்களருகே நின்றார்[a]; ஆண்டவருடைய மகிமை அவர்களைச் சுற்றி ஒளிவீசியது; அவர்கள் மிகுந்த அச்சமடைந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களருகே நின்றார்’ என்பதற்கு ‘அவர்களிடம் வந்தார்,’ ‘அவர்களருகே வந்து நின்றார்,’ அல்லது ‘அவர்கள்முன் நின்றார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் அருகே நிற்பதையும் திடீரெனத் தோன்றுவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவர்கள் மிகுந்த அச்சத்தை அஞ்சினார்கள்.’ இது கடும் அச்சத்தை வெளிப்படுத்தும் கிரேக்க வலியுறுத்தல் மரபு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: ஆண்டவருடைய தூதர் ஒருவர்
  rationale: இக்கதைச் சூழலில் ἄγγελος என்பது மனிதத் தூதரை அல்ல, வானதூதரைக் குறிக்கிறது. கிரேக்கத்தில் திட்டவட்டச் சுட்டு இல்லாததால், தமிழில் இயல்பான வரையறையற்ற பொருளை ‘ஒருவர்’ வெளிப்படுத்துகிறது.
- source_word: ἐπέστη αὐτοῖς
  choice: திடீரென அவர்கள் அருகே வந்து நின்றார்
  rationale: ἐφίστημι என்பது அருகே நிற்பதையும் திடீரென வந்து தோன்றுவதையும் குறிக்கலாம். இந்த மொழிபெயர்ப்பு அதன் இடவியல் பொருளையும் திடீர் நிகழ்வையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δόξα κυρίου
  choice: ஆண்டவருடைய மகிமை
  rationale: δόξα என்பதன் தெய்வீக மகிமை மற்றும் ஒளிப்பிரகாசம் சார்ந்த பொருளை ‘மகிமை’ தக்கவைக்கிறது; ஒளி வீசுதல் அடுத்த வினையால் வெளிப்படுகிறது.
- source_word: περιέλαμψεν αὐτούς
  choice: அவர்களைச் சுற்றிலும் ஒளிவீசியது
  rationale: περιλάμπω என்பது ஒருவரைச் சுற்றி ஒளிவீசுதல் அல்லது ஒளியால் சூழ்தலைக் குறிக்கிறது. தேர்ந்த வடிவம் கிரேக்கப் படிமத்திற்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: அவர்கள் மிகவும் அஞ்சினார்கள்
  rationale: வினைச்சொல்லுடன் அதே வேருடைய பெயர்ச்சொல் வரும் கிரேக்க அமைப்பு அச்சத்தின் தீவிரத்தை வலியுறுத்துகிறது. அதைச் சொற்சொல்லாகப் பின்பற்றாமல், நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தீவிரத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κύριος என்ற தெய்வீகப் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இவ்வசனத்தில் κύριος இறைவனைக் குறிக்கிறது. ‘ஆண்டவர்’ என்பது தெய்வீகக் குறிப்பையும் புதிய ஏற்பாட்டுப் பயன்பாட்டின் இறையியல் நிறையையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘தூதர்’ என்பதுடன் மரியாதை ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடக்க καί கதைத் தொடர்ச்சியைச் சுட்டும் ‘அப்போது’ என வழங்கப்பட்டுள்ளது; இறுதி கிரேக்க மொழிமரபு இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டு அதன் சொல்லடிப் படிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
