source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: ta
  text: அந்த நேரத்திலேயே அங்கு வந்த அவள், கடவுளுக்கு நன்றி செலுத்திக்கொண்டிருந்தாள்[a]; எருசலேமின் மீட்புக்காகக் காத்திருந்த அனைவரிடமும் அவரைப் பற்றிப் பேசிக்கொண்டிருந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நன்றி செலுத்திக்கொண்டிருந்தாள்’ என்பதை ‘கடவுளைப் புகழ்ந்துகொண்டிருந்தாள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரைப் பற்றிப்’ என்பதில் உள்ள சுட்டுப்பெயர் சூழலில் குழந்தை இயேசுவை மிக இயல்பாகக் குறிக்கிறது; எனினும் கிரேக்கத்தில் இதற்கு மிக அருகிலுள்ள வெளிப்படையான பெயர்ச்சொல் ‘கடவுள்’ என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: அதே நேரத்தில்
  rationale: காலத்தைக் குறிக்கும் இத்தொடரில் αὐτῇ தரும் ‘அதே’ என்ற வலியுறுத்தலையும் நிகழ்வுகளின் உடனடி தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπιστᾶσα
  choice: அங்கு வந்த அவள்
  rationale: அன்னாள் அந்தக் காட்சியிடத்திற்கு அந்நேரத்தில் வந்து சேர்ந்ததை இயல்பாகக் காட்டுகிறது; அவர் எவ்வாறு வந்தார் என்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: ἀνθωμολογεῖτο
  choice: நன்றி செலுத்திக்கொண்டிருந்தாள்
  rationale: இறைவனை நோக்கிய நன்றியையோ புகழையோ குறிக்கக்கூடிய இச்சொல்லின் தொடர்ச்சித் தன்மையை இறந்தகாலத் தொடர்நிலை வடிவம் பாதுகாக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘தொடங்கினாள்’ என்பது சேர்க்கப்படவில்லை.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: இறைவனை நோக்கி நன்றி செலுத்துதல் என்ற இயல்பான நவீனத் தமிழ்ச் சொற்றொடர்.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: அவரைப் பற்றிப் பேசிக்கொண்டிருந்தாள்
  rationale: தொடர்ச்சியான செயலைத் தமிழின் தொடர்நிலை வடிவம் காட்டுகிறது. αὐτοῦ என்பதன் சுட்டுப் பொருளை விளக்கப்பெயரால் மாற்றாமல் ‘அவரை’ எனப் பாதுகாக்கிறது.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: காத்திருந்த அனைவரிடமும்
  rationale: προσδέχομαι என்பதில் உள்ள எதிர்பார்ப்போடு காத்திருக்கும் கருத்தை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: λύτρωσιν
  choice: மீட்பு
  rationale: விடுதலை, மீட்சி ஆகிய பரப்பைக் கொண்ட λύτρωσις என்பதன் இரட்சிப்புசார் ஆழத்தைப் பாதுகாக்கும் பொதுவாகப் புரியும் சொல்.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: நவீனத் தமிழ் வேதாகம நடையில் நிலைபெற்ற இடப்பெயர் வடிவம்.
theological_decisions:
- issue: ἐλάλει περὶ αὐτοῦ என்பதிலுள்ள αὐτοῦ யாரைக் குறிக்கிறது?
  choice: மூலத்தின் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை ‘அவரை’ என வைத்திருந்து, சூழலில் குழந்தை இயேசுவைக் குறிப்பதாக இயல்பாக வாசிக்க இடமளித்தல்.
  alternative: அருகிலுள்ள வெளிப்படையான பெயர்ச்சொல் ‘கடவுள்’ என்பதால், அது கடவுளைக் குறிக்கிறது என வாசித்தல்.
  rationale: கதையின் உடனடிச் சூழல் குழந்தை இயேசுவை மையப்படுத்தினாலும், கிரேக்க வாக்கியம் சுட்டுப்பொருளை பெயரிட்டு முடிவு செய்யவில்லை. ஆகவே பிரதான உரையில் தெளிவுபடுத்திப் பதிலீடு செய்யாமல் உண்மையான இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
- issue: λύτρωσιν Ἰερουσαλήμ என்பதன் பொருள்
  choice: ‘எருசலேமின் மீட்பு’ என விரிவாக்கமின்றி மொழிபெயர்த்தல்.
  alternative: ‘எருசலேமின் விடுதலை’ அல்லது அரசியல், ஆன்மிக, இறுதிக்கால மீட்பு என்று குறிப்பாக விளக்குதல்.
  rationale: இத்தொடர் எருசலேமோடு தொடர்புடைய கடவுளின் மீட்புச் செயலை அகலமாகக் குறிக்கலாம். அரசியல் அல்லது ஆன்மிகப் பொருளில் ஒன்றுக்கு மட்டும் சுருக்காமல் அதன் சமூக மற்றும் இறுதிக்கால ஒலிப்புகளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நன்றி செலுத்திக்கொண்டிருந்தாள்’, ‘பேசிக்கொண்டிருந்தாள்’ ஆகிய வடிவங்கள் இரண்டு குறைவினை வினைகளின் தொடர்ச்சித் தன்மையை வெளிப்படுத்துகின்றன. ‘அவரை’ என்ற மரியாதை ஒருமை, தமிழில் இயேசுவிற்கும் கடவுளிற்கும் பொருந்துவதால் மூலத்தின் சுட்டுப்பொருள் தெளிவின்மையை இயல்பாகப் பாதுகாக்கிறது.
