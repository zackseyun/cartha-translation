source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: ta
  text: தேவதூதர்கள் அவர்களைவிட்டு விண்ணகத்திற்குச் சென்றபோது, மேய்ப்பர்கள் ஒருவருக்கொருவர், “இப்போதே பெத்லகேம்வரை சென்று, ஆண்டவர் நமக்குத் தெரியப்படுத்திய நடந்த இந்தக் காரியத்தை[a] பார்ப்போம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நடந்த இந்தச் செய்தியை” அல்லது “நடந்த இந்த வார்த்தையை” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ῥῆμα ‘சொல்,’ ‘செய்தி,’ அல்லது ‘காரியம்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: தனி சொல்லாக மொழிபெயர்க்காமல், ‘சென்றபோது’ என்ற இயல்பான தமிழ் கதைத் தொடரில் அதன் உரையாடல் செயல்பாட்டை வெளிப்படுத்துதல்
  rationale: ‘அது நிகழ்ந்தது’ என்று சொற்சொல்லாகத் தொடங்குவது நவீன தமிழில் செயற்கையாக இருக்கும்; லூக்காவின் நிகழ்வை அறிமுகப்படுத்தும் சூத்திரம் காலவாக்கிய அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: அவர்களைவிட்டு விண்ணகத்திற்குச் சென்றபோது
  rationale: முதலில் முடிந்த தேவதூதர்களின் புறப்பாட்டையும், εἰς என்பதன் திசையையும் காக்கிறது. இச்சூழலில் οὐρανός வெறும் வானத்தைவிடத் தெய்வீக விண்ணகத்தைக் குறிக்கிறது.
- source_word: οἱ ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: நவீனத் தமிழில் வழக்கமானதும் தெளிவானதும் ஆன இணைச்சொல்.
- source_word: οἱ ποιμένες
  choice: மேய்ப்பர்கள்
  rationale: பேசுகிறவர்களைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ்.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: ஒருவருக்கொருவர் ... என்று சொன்னார்கள்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் இயல்பான தமிழ்; கிரேக்க இறந்தகாலத் தொடர்ச்சியை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: இப்போதே பெத்லகேம்வரை சென்று
  rationale: hortatory subjunctive-ஐ ‘பார்ப்போம்’ உடன் இணைத்து அழைப்பாக வெளிப்படுத்துகிறது; δὴ-யின் உடனடித் தூண்டுதலை ‘இப்போதே’ என்றும், ἕως-ஐ ‘வரை’ என்றும் காக்கிறது.
- source_word: ἴδωμεν
  choice: பார்ப்போம்
  rationale: கூட்டு அழைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்தும் தன்மை பன்மை வினைமுற்று.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: இந்த நிகழ்ந்த காரியத்தை
  rationale: ῥῆμα என்பதன் ‘சொல்/செய்தி/காரியம்’ பரப்பில், நிகழ்ந்த ஒன்றைக் குறிக்கும் சூழலுக்கு ‘காரியம்’ ஏற்றது; τὸ γεγονός-ன் நிகழ்ந்த தன்மையையும் வெளிப்படையாகக் காக்கிறது.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: ஆண்டவர் நமக்குத் தெரியப்படுத்தியிருக்கிற
  rationale: ἐγνώρισεν என்பதன் ‘அறியச் செய்தார்’ என்ற பொருளை, தொழில்நுட்பமான ‘வெளிப்படுத்தினார்’ என்பதைக் காட்டிலும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ὁ κύριος என்பவர் யார்
  choice: ‘ஆண்டவர்’ என்று மொழிபெயர்த்து, குறிப்பான ஆளடையாளத்தை மொழிபெயர்ப்பில் நிர்ணயிக்காமல் விடுதல்
  alternative: இங்கே நேரடியாக ‘தேவன்’ என்று மொழிபெயர்த்தல், அல்லது புதிதாகப் பிறந்த மெசியாவைக் குறிப்பதாக விளக்குதல்
  rationale: உடனடிச் சூழலில் செய்தியை அறியச் செய்தவர் தேவன் எனப் புரிந்துகொள்ளலாம்; ஆனால் κύριος என்ற மூலச் சொல்லை ‘ஆண்டவர்’ என்று வைத்திருப்பது லூக்காவின் இறையியல் ஒலிப்பையும் உண்மையான குறிப்புத் திறப்பையும் பாதுகாக்கிறது.
- issue: ῥῆμα என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘காரியம்’; அடிக்குறிப்பில் ‘செய்தி’ என்ற மாற்றுப் பொருள்
  alternative: ‘வார்த்தை’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: மேய்ப்பர்கள் நடந்த நிகழ்வைப் பார்க்கச் செல்கிறார்கள்; ஆயினும் ῥῆμα அறிவிக்கப்பட்ட செய்தியையும் குறிக்கக்கூடியதால் அந்தச் சொற்பொருள் பதற்றத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விண்ணகம்,’ ‘ஆண்டவர்’ போன்ற வழக்கமான வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; பழமையான ‘சம்பவித்தது,’ ‘பரஸ்பரம்’ போன்ற நடைகள் தவிர்க்கப்பட்டுள்ளன. ἕως என்பதன் வடிவத்தை ‘பெத்லகேம்வரை’ பாதுகாக்கிறது.
