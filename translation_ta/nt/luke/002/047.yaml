  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: ta
  text: அவரைக் கேட்டுக்கொண்டிருந்த அனைவரும் அவருடைய புரிதலையும் பதில்களையும் கண்டு வியந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரிதும் ஆச்சரியப்பட்டார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வலுவான வியப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: வியந்துபோனார்கள்
  rationale: இங்கு இந்த இறந்தகால வினை வடிவம் தொடர்ந்து ஏற்பட்ட வலுவான வியப்பைக் குறிக்கிறது. ‘வியந்துபோனார்கள்’ என்பது அதன் தீவிரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: (தனியே மொழிபெயர்க்கப்படவில்லை)
  rationale: இது மென்மையான கதைத் தொடர்புச்சொல். இவ்வசனம் தமிழில் இயல்பாகத் தொடருவதால் தனியான ‘மேலும்’ அல்லது ‘ஆனால்’ தேவையில்லை.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: அவர் சொன்னதைக் கேட்டுக்கொண்டிருந்த அனைவரும்
  rationale: நிகழ்ந்துகொண்டிருந்த கேட்புச் செயலை நிகழ்காலப் பங்கேற்புவினை சுட்டுகிறது; ‘கேட்டுக்கொண்டிருந்த’ அதைத் தெளிவாகக் காக்கிறது. αὐτοῦ இங்கு அவர் பேசுவதைக் கேட்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: ἐπὶ
  choice: கண்டு
  rationale: வியப்பிற்கான அடிப்படை அல்லது காரணத்தை இங்கு ἐπί குறிக்கிறது. தமிழில் ‘...கண்டு வியந்துபோனார்கள்’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συνέσει
  choice: புரிந்துகொள்ளும் திறன்
  rationale: σύνεσις என்பது புரிதல், உட்கருத்துணர்வு ஆகியவற்றைக் குறிக்கிறது. ‘புரிந்துகொள்ளும் திறன்’ சாதாரண வாசகருக்குத் தெளிவாகவும் இச்சூழலில் இயல்பாகவும் உள்ளது.
- source_word: ἀποκρίσεσιν αὐτοῦ
  choice: அவருடைய பதில்கள்
  rationale: ἀπόκρισις உரையாடல் சூழலில் அளிக்கப்படும் பதிலைக் குறிக்கிறது; பன்மை வடிவம் ‘பதில்கள்’ என்று காக்கப்பட்டுள்ளது.
