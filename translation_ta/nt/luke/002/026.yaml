source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: ta
  text: ஆண்டவருடைய மெசியாவை[a] காண்பதற்கு முன் அவர் மரணத்தைக் காணமாட்டார் என்று பரிசுத்த ஆவியால் அவருக்கு வெளிப்படுத்தப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழக்கில், “ஆண்டவருடைய கிறிஸ்து.”
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: வெளிப்படுத்தப்பட்டிருந்தது
  rationale: இறைவனிடமிருந்து ஒரு செய்தி அல்லது வெளிப்பாடு பெறப்பட்டதைச் சுட்டும் இறந்தகால வினை வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: பரிசுத்த ஆவியால்
  rationale: ὑπό + பிறப்புவேற்றுமை காட்டும் செயற்படுத்தும் நபரைத் தமிழின் ‘ஆல்’ உருபு தெளிவாகக் காட்டுகிறது.
- source_word: μὴ ἰδεῖν θάνατον
  choice: மரணத்தைக் காணமாட்டார்
  rationale: ‘இறக்கமாட்டார்’ என்று பொருளை மட்டும் கூறாமல், மூலத்தின் ‘மரணத்தைக் காணுதல்’ என்ற உருவகச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: காண்பதற்கு முன்
  rationale: மரணம் நிகழ்வதற்கு முன்னதாக மெசியாவைக் காண வேண்டும் என்ற காலவரிசையையும் எதிர்காலச் சூழலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸν χριστὸν κυρίου
  choice: ஆண்டவருடைய மெசியாவை
  rationale: Χριστός இங்கு பெயரைப்போல அல்லாமல் மெசியாவுக்குரிய பட்டமாக வருகிறது; κυρίου உடைமை அல்லது அனுப்புதலின் தொடர்பைக் காட்டுகிறது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: கிரேக்கப் பிறப்புவேற்றுமையின் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதை மெசியாவுக்குரிய பட்டமாக மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός ஒரு பெயர்போன்ற பயன்பாடு அல்ல; எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டம். ஆகவே பிரதான உரையில் ‘மெசியா’ பயன்படுத்தப்பட்டு, மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மரணத்தைக் காணுதல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; வாக்கியத்தின் தமிழ்ச் சொல் வரிசை இயல்பாக அமைக்கப்பட்டுள்ளது.
