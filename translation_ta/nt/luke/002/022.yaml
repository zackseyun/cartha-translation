  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: ta
  text: மோசேயின் சட்டத்தின்படி அவர்களுடைய[a] தூய்மைப்படுத்துதலின் நாட்கள் நிறைவடைந்தபோது, ஆண்டவர்முன் அவரை முன்னிறுத்துவதற்காக அவர்கள் அவரை எருசலேமுக்குக் கொண்டுசென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘அவர்களுடைய தூய்மைப்படுத்துதல்’ என்பதற்குப் பதிலாக ‘அவளுடைய தூய்மைப்படுத்துதல்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: நாட்கள் நிறைவடைந்தபோது
  rationale: காலப்பகுதி அதன் முழு அளவை எட்டியதைக் குறிக்கும் இறந்தகாலச் செயலப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான காலவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: καθαρισμοῦ
  choice: தூய்மைப்படுத்துதல்
  rationale: குழந்தைப்பேற்றுக்குப் பிந்தைய மோசேயின் திருச்சட்டச் சடங்கு சார்ந்த தூய்மைப்படுத்துதலைக் குறிக்கிறது; பொதுவான உடல் சுத்தம் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: கொடுக்கப்பட்ட SBLGNT மூலத்தில் உள்ள பன்மைப் பெயர்ச்சுட்டை அப்படியே காக்கிறது; சூழலை முன்னிட்டு ஒருமையாக மாற்றவில்லை.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: மோசேயின் திருச்சட்டத்தின்படி
  rationale: மோசேயின் சட்ட நியமத்துக்கு இணங்க நடந்ததைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: ἀνήγαγον
  choice: எருசலேமுக்குக் கொண்டுபோனார்கள்
  rationale: எருசலேமுக்குச் செல்லும் ஏற்றத் திசைநுட்பம் தமிழில் தனியே சொல்லப்படுவது இயல்பற்றதாக இருக்கக்கூடும்; ‘கொண்டுபோனார்கள்’ இயக்கத்தையும் செய்பவர்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: παραστῆσαι
  choice: முன்பாக அவரை நிறுத்துவதற்காக
  rationale: வழிபாட்டு மற்றும் சட்டச் சூழலில் ஒருவரை தேவனுடைய முன்னிலையில் சமர்ப்பித்து நிறுத்தும் கருத்தைக் காக்கிறது; ‘அர்ப்பணிக்க’ என்பதால் தோன்றக்கூடிய கூடுதல் பலியியல் நுட்பத்தைத் தவிர்க்கிறது.
- source_word: κυρίῳ
  choice: ஆண்டவருக்கு முன்பாக
  rationale: κύριος என்பதன் மரியாதைமிக்க இறைச்சுட்டை ‘ஆண்டவர்’ என வழங்கி, παρίστημι உடன் உள்ள தத்தியை இயல்பான தமிழில் ‘முன்பாக’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவர்களுடைய தூய்மைப்படுத்துதல்’ என்பதில் பெயர்ச்சுட்டின் எண்
  choice: முதன்மை உரையில் ‘அவர்களுடைய’ என்ற பன்மையை வைத்தல்
  alternative: ‘அவளுடைய தூய்மைப்படுத்துதல்’ என்ற ஒருமை வாசகம்
  rationale: கொடுக்கப்பட்ட கிரேக்க உரை αὐτῶν என்ற பன்மையைக் கொண்டுள்ளது. லேவியராகமப் பின்னணியையோ சில கையெழுத்துப் பிரதிகளின் வாசகத்தையோ வைத்து அதை அமைதியாக ஒருமையாக்காமல், மூல உரையின் பதற்றத்தை முதன்மை உரையில் காத்து மாற்று வாசகத்தைக் காலடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’, ‘தூய்மைப்படுத்துதல்’, ‘ஆண்டவர்’ ஆகிய சொற்கள் சட்ட-வழிபாட்டு சூழலைக் காக்கின்றன; உரையில் இல்லாத சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
