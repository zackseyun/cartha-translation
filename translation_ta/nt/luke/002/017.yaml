id: LUK.2.17
reference: Luke 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: ta
  text: அவர்கள் அதைப் பார்த்ததும், இந்தக் குழந்தையைப் பற்றித் தங்களுக்குச் சொல்லப்பட்டிருந்த செய்தியை[a] தெரியப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சொல்லை”; அல்லது, “கூற்றை.”
    reason: ῥῆμα என்பதற்கு இச்சூழலில் ‘செய்தி,’ ‘சொல்,’ அல்லது ‘கூற்று’ என்ற பொருள்கள் சாத்தியம்.
lexical_decisions:
- source_word: ἰδόντες
  choice: அவர்கள் அதைப் பார்த்ததும்
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. கிரேக்கத்தில் பார்க்கப்பட்ட பொருள் வெளிப்படையாகக் கூறப்படவில்லை; சூழலின் அடிப்படையில் இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதைநடையை முன்னெடுக்கும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தனி இணைப்புச்சொல் சேர்க்காமல் தொடர்ச்சியால் இதை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: ἐγνώρισαν
  choice: தெரியப்படுத்தினார்கள்
  rationale: γνωρίζω என்பதன் காரணவினைப் பொருளான ‘அறியச் செய்தல்’ அல்லது ‘தெரியப்படுத்துதல்’ என்பதைக் தெளிவாகவும் இயல்பாகவும் தருகிறது; முறைப்படியான பிரசங்கம் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: περὶ τοῦ ῥήματος
  choice: செய்தியை
  rationale: ῥῆμα என்பது சொல், கூற்று, அல்லது தெரிவிக்கப்பட்ட செய்தி எனப் பொருள்படலாம். இங்கு குழந்தையைப் பற்றி மேய்ப்பர்களுக்குச் சொல்லப்பட்ட உள்ளடக்கத்தைக் குறிப்பதால் ‘செய்தி’ தெளிவான நவீனத் தமிழாகும்; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: தங்களுக்குச் சொல்லப்பட்டிருந்த
  rationale: பெறுபாட்டு வினையெச்சத்தையும், அவர்கள் அதைத் தெரியப்படுத்துவதற்கு முன்பே அந்தச் செய்தி அவர்களுக்குச் சொல்லப்பட்டிருந்த காலத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: இந்தக் குழந்தையைப் பற்றி
  rationale: παιδίον இச்சூழலில் புதிதாகப் பிறந்த இயேசுவைக் குறிக்கிறது. ‘இந்தக் குழந்தை’ என்பது இயல்பானதும் துல்லியமானதும்; தேவையற்ற விளக்கத்தைச் சேர்க்காது.
theological_decisions:
- issue: தேவதூதரின் அறிவிப்புடன் தொடர்புடைய ῥῆμα என்பதன் மொழிபெயர்ப்பு
  choice: செய்தி
  alternative: சொல்; கூற்று
  rationale: இங்கு மேய்ப்பர்களிடம் குழந்தையைப் பற்றிச் சொல்லப்பட்ட உள்ளடக்கமே குறிக்கப்படுகிறது. ‘செய்தி’ இதைத் தெளிவாகத் தெரிவிக்கிறது; ‘சொல்’ அல்லது ‘கூற்று’ என்பதும் சொல்லியல் ரீதியாகச் சாத்தியம் என்பதால் அந்தப் பன்முகத்தன்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. ‘அதை’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சூழலின் அடிப்படையில் தமிழில் நிறைவு செய்கிறது. ‘தெரியப்படுத்தினார்கள்’ என்பது அறிவித்தலின் வலிமையைத் தருகிறது; ஆனால் முறையான பிரசங்கம் என்ற கருத்தைத் திணிக்கவில்லை.
