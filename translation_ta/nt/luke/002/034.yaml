id: LUK.2.34
reference: Luke 2:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: ta
  text: சிமியோன் அவர்களை ஆசீர்வதித்து, குழந்தையின் தாயான மரியாளிடம், “இதோ, இவர் இஸ்ரவேலில் பலர் விழுவதற்கும் எழுவதற்கும், எதிர்த்துப் பேசப்படும் ஓர் அடையாளமாக இருப்பதற்கும் நியமிக்கப்பட்டிருக்கிறார்.[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எதிர்த்துப் பேசப்படும்” என்பது “மறுக்கப்படும்” அல்லது “எதிர்ப்பு தெரிவிக்கப்படும்” என்றும் பொருள்படலாம்.
    reason: ἀντιλεγόμενον என்பதிலுள்ள வாய்மொழி மறுப்பும் விரிந்த எதிர்ப்பும் ஆகிய பொருள் வரம்பைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: ஆசீர்வதித்து
  rationale: இறைநம்பிக்கைச் சூழலில் இயல்பாகவும் துல்லியமாகவும் ‘blessed’ என்ற பொருளைத் தருகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் உரைநடைக் கண்ணியத்தையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: οὗτος
  choice: இவர்
  rationale: குழந்தை இயேசுவைச் சுட்டுவதால் மரியாதையுடைய நபர்ச் சுட்டுப்பெயர் இயல்பானது; ‘இந்தக் குழந்தை’ என விளக்கிப் பெருக்கவில்லை.
- source_word: κεῖται εἰς
  choice: நியமிக்கப்பட்டிருக்கிறார்
  rationale: இச்சூழலில் ஒருவருக்காக நிர்ணயிக்கப்பட்ட பங்கு அல்லது விளைவைச் சுட்டுகிறது; சொல்லுக்கு சொல் ‘வைக்கப்பட்டிருக்கிறார்’ என்பதைவிட தமிழில் இயல்பானது.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: விழுவதற்கும் எழுவதற்கும்
  rationale: இணையான உருவகச் சொற்களை அப்படியே காத்து, ‘ἀνάστασις’ என்பதிலுள்ள எழுதல்/உயிர்த்தெழுதல் சார்ந்த ஒலிப்பையும் முன்கூட்டியே ஒரே விளக்கமாக முடிவுசெய்யாமல் விடுகிறது.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: எதிர்த்துப் பேசப்படும் ஓர் அடையாளம்
  rationale: ἀντιλέγω என்பதன் வாய்மொழி எதிர்ப்பு/மறுப்பு நுணுக்கத்தை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ‘பலர் விழுவதற்கும் எழுவதற்கும்’ என்பது ஒரே மக்களின் வீழ்ச்சிக்குப் பிந்தைய எழுச்சியா, அல்லது வேறு வேறு மக்களின் இரு விளைவுகளா?
  choice: பலர் விழுவதற்கும் எழுவதற்கும்
  alternative: பலரின் வீழ்ச்சிக்கும் எழுச்சிக்கும்
  rationale: கிரேக்க உரை இரண்டையும் தெளிவாகப் பிரிக்கவில்லை. வினைச்செயல் வடிவிலான தமிழ், அந்த உண்மையான தெளிவின்மையையும் உருவகத் தீவிரத்தையும் காக்கிறது.
- issue: κεῖται என்பதில் தெய்வீக நியமனம் வெளிப்படையாக உள்ளதா?
  choice: நியமிக்கப்பட்டிருக்கிறார்
  alternative: வைக்கப்பட்டிருக்கிறார்
  rationale: சூழலின் நோக்கமுள்ள நியமிப்பை இயல்பான தமிழில் தெரிவிக்கிறது; ஆனால் யார் நியமித்தார் என்பதை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம உரைநடை. கிரேக்கச் சொல்லமைப்பின் தேவையற்ற கடினத்தன்மை தவிர்க்கப்பட்டாலும், ‘விழுதல்/எழுதல்’ என்ற உருவகமும் அதன் இறையியல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
