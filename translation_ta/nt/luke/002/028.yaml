source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: ta
  text: 'அவர் குழந்தையைத் தம் கைகளில் ஏந்தி, கடவுளைப் போற்றி, கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: ஏந்திக்கொண்டு
  rationale: δέχομαι என்பதன் அடிப்படைப் பொருள் ‘ஏற்றுக்கொள்/வரவேற்றுக்கொள்.’ ஆனால் ‘கைகளுக்குள்’ என்ற தொடருடன் இங்கு குழந்தையைத் தம் கைகளில் ஏந்திக்கொண்ட உடற்செயல் இயல்பாகக் குறிக்கப்படுகிறது.
- source_word: αὐτό
  choice: குழந்தையை
  rationale: இலக்கணத்தில் நடுநிலைப் பால் ஒருமையாக இருந்தாலும், இச்சுட்டுப்பெயர் குழந்தை இயேசுவைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயரை மட்டும் பயன்படுத்துவதைவிட, சூழலிலுள்ள ‘குழந்தை’ என்பதை மீண்டும் கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: εἰς τὰς ἀγκάλας
  choice: தம் கைகளில்
  rationale: ἀγκάλαι என்பது அணைப்பதற்கும் சுமப்பதற்கும் பயன்படும் இரு கைகளைக் குறிக்கிறது. கிரேக்கத்தில் உடைமைச் சுட்டு வெளிப்படையாக இல்லாவிட்டாலும், அவை சிமியோனுடைய கைகள் என்பது சூழலில் தெளிவு; மரியாதை ஒருமைக்கேற்ற ‘தம்’ பயன்படுத்தப்பட்டது.
- source_word: εὐλόγησεν τὸν θεόν
  choice: கடவுளை வாழ்த்தி
  rationale: εὐλογέω, கடவுளைச் செயப்படுபொருளாகக் கொள்ளும்போது, அவரை வாழ்த்துதல் அல்லது போற்றுதல் எனப் பொருள்படும். ‘வாழ்த்தி’ என்பது வினை வடிவத்தையும் வேதாகம நடையையும் காக்கிறது.
- source_word: καὶ εἶπεν
  choice: 'சொன்னார்:'
  rationale: அடுத்து நேரடிக் கூற்று வருவதால் தமிழில் இரட்டைப்புள்ளி இயல்பானது. முந்தைய வினைகளோடு ஒரே எழுவாயைத் தொடர்ச்சியாக இணைக்கும் வகையில் அமைக்கப்பட்டது.
- source_word: αὐτός
  choice: அவர்
  rationale: சிமியோனைக் குறிக்கும் எழுவாயைத் தமிழில் மரியாதை ஒருமையுடன் வெளிப்படுத்துகிறது; ‘அவரே’ என மொழிபெயர்ப்பது இச்சூழலில் வலியுறுத்தலை மிகைப்படுத்தக்கூடும்.
theological_decisions:
- issue: நடுநிலைப் பால் சுட்டுப்பெயர் αὐτό எதைக் குறிக்கிறது
  choice: அது குழந்தை இயேசுவைக் குறிப்பதாக ‘குழந்தையை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இலக்கணப் பாலைக் கடுமையாகப் பின்பற்றி ‘அதை’ என்று மொழிபெயர்த்தல்.
  rationale: சுட்டுப்பெயரின் இலக்கணப் பால் அதன் முன்னிலைச் சொல்லுடன் ஒத்துள்ளது; குறிக்கப்படும் நபர் குழந்தை இயேசு. ‘அதை’ என்பது தமிழில் உயிரற்ற பொருளைக் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஏந்திக்கொண்டு’ என்பது குழந்தையை கைகளில் எடுத்துக்கொண்ட செயலை இயல்பாகக் காட்டுகிறது; ‘வாழ்த்தி’ என்பது கடவுளை நோக்கிய εὐλόγησεν என்ற சொல்லின் வடிவத்தையும் பொருளையும் காக்கிறது.
