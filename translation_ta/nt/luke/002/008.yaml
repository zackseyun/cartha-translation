translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘வயல்வெளியிலேயே’ என்பது திறந்த வெளியில் இரவு தங்கிய நுணுக்கத்தையும், ‘காவல் காத்துக்கொண்டிருந்தார்கள்’ என்பது தொடர்ந்த இரவுக் காவலையும் இயல்பாக வெளிப்படுத்துகின்றன.
