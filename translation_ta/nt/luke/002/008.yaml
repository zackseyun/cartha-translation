id: LUK.2.8
reference: Luke 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: ta
  text: அதே பகுதியில் மேய்ப்பர்கள் வயல்வெளியிலேயே இரவு தங்கி[a], இரவில் தங்கள் மந்தையைக் காவல் காத்துக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியிலேயே தங்கியிருந்து’ அல்லது ‘திறந்த வெளியில் இரவைக் கழித்து’ என்றும் மொழிபெயர்க்கலாம். மேய்ப்பர்கள் இரவில் வயல்வெளியிலேயே தங்கியிருந்ததை கிரேக்க வினைச்சொல் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘தங்கள் மந்தையின்மேல் இரவின் காவல் வேளைகளைக் காத்துக்கொண்டிருந்தார்கள்.’ இது இரவுக் காவலை முறைவைத்து மேற்கொண்டதைச் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: மேய்ப்பர்கள்
  rationale: ஆடுகளை மேய்த்துப் பராமரிப்பவர்களைக் குறிக்கும் கிரேக்கச் சொல்லின் இயல்பான, துல்லியமான தமிழ் இணைச்சொல்.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: அதே பகுதியில்
  rationale: χώρα இங்கு முன்பு குறிப்பிடப்பட்ட இடத்தைச் சுற்றியுள்ள பகுதியைக் குறிக்கிறது; ‘பகுதி’ என்பது நவீனத் தமிழில் இயல்பாகவும் அளவுக்கு மீறிய பரப்பைக் குறிப்பதாக இல்லாமலும் உள்ளது.
- source_word: ἀγραυλοῦντες
  choice: வயல்வெளியிலேயே இரவு தங்கி
  rationale: இச்சொல் திறந்த வெளியில், குறிப்பாக வயல்வெளியில், இரவைக் கழிப்பதை வலியுறுத்துகிறது. ‘இரவைக் கழித்து’ என்பதைவிட ‘இரவு தங்கி’ சாதாரண வாசகர்களுக்கு இயல்பாக உள்ளது; ‘-இலேயே’ வெளியில் தங்கியிருந்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: இரவில் ... காவல் காத்துக்கொண்டிருந்தார்கள்
  rationale: கிரேக்கத்தின் ஒரே வேர்ச்சொல்லைக் கொண்ட வினை-பெயர் அமைப்பை சொல்லுக்குச் சொல் தமிழாக்குவது இயல்பற்றது. இத்தேர்வு இரவு நேரத்தில் தொடர்ந்து காவல் செய்த கருத்தைத் தெளிவாகத் தருகிறது; பன்மையான ‘காவல் வேளைகள்’ குறித்த நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: தங்கள் மந்தையைக்
  rationale: ποίμνη என்பது அவர்களுடைய பராமரிப்பிலிருந்த ஆடுகளின் கூட்டத்தை மொத்தமாகக் குறிக்கிறது. ‘மந்தை’ அந்தக் கூட்டுப்பொருளைப் பாதுகாக்கிறது; ‘காவல் காத்தல்’ என்பதுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: Καὶ ... ἦσαν
  choice: அதே பகுதியில் மேய்ப்பர்கள் ... இருந்தார்கள்
  rationale: கிரேக்கத்தில் இது புதிய காட்சியைத் தொடர்ச்சியாக அறிமுகப்படுத்தும் அமைப்பு. தமிழில் தனியாக ‘மேலும்’ சேர்ப்பது செயற்கையாக இருக்கும்; வாக்கியத்தின் தொடர்ச்சி மற்றும் இருப்புநிலை ‘இருந்தார்கள்’ என்ற வினைமுற்றில் இயல்பாக வெளிப்படுகின்றன.
