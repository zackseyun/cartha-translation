- from: பிற இனத்தாருக்கு வெளிப்பாட்டை அளிக்கும் ஒளியாகவும்[a], உமது மக்களாகிய இஸ்ரவேலுக்கு மகிமையாகவும் இருக்கிறார்.
  to: பிற இனத்தாருக்கு வெளிப்பாடு தரும் ஒளியாகவும்[a], உமது மக்களாகிய இஸ்ரவேலின் மகிமையாகவும் இருக்கிறார்.
  rationale: The revision keeps the draft’s sound contextual rendering of ἐθνῶν and its natural modern Tamil style. It adjusts the Israel clause to reflect more closely the Greek genitival/appositional phrase, while retaining the verse’s balanced ‘ஒளியாகவும் … மகிமையாகவும்’ structure. The footnote remains anchored to the Gentiles/nations term and preserves the lexical ambiguity.
