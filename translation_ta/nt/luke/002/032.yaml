id: LUK.2.32
reference: Luke 2:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: ta
  text: பிற இனத்தாருக்கு வெளிப்பாடு தரும் ஒளியாகவும்[a], உமது மக்களாகிய இஸ்ரவேலின் மகிமையாகவும் இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனங்களுக்கு வெளிப்பாடு தரும் ஒளியாகவும்.” கிரேக்கச் சொல் பொதுவாக “இனங்கள்” அல்லது “தேசங்கள்” என்று பொருள்படலாம்; இங்கே அது இஸ்ரவேலுக்கு மாறாகப் பிற இனத்தாரைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ஒளி
  rationale: குழந்தையைப் பற்றிய சிமியோனின் கவித்துவமான விளக்கத்தில், தமிழில் இயல்பாகவும் மூலத்தின் உருவகத்தை நேரடியாகவும் காக்கிறது.
- source_word: εἰς
  choice: அளிக்கும் / ஆக
  rationale: இங்கு நோக்கம் அல்லது விளைவைச் சுட்டும் εἰς என்பதன் பொருளை, ‘வெளிப்பாட்டை அளிக்கும் ஒளியாக’ என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἀποκάλυψιν
  choice: வெளிப்பாடு
  rationale: மறைந்திருந்தது வெளிப்படுத்தப்படுதல் அல்லது தெரியப்படுத்தப்படுதல் என்ற அடிப்படைப் பொருளையும் இறையியல் ஒலிநயத்தையும் காக்கிறது.
- source_word: ἐθνῶν
  choice: பிற இனத்தார்
  rationale: அடுத்துவரும் இஸ்ரவேலுடனான சூழல்சார் வேறுபாட்டைத் தெளிவாக்குகிறது; அதேவேளை கிரேக்கச் சொல்லின் ‘இனங்கள்/தேசங்கள்’ என்ற பரந்த பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: கனமும் ஒளிவீசும் மேன்மையும் என்ற பொருள்களையும் வேதாகம இறையியல் பயன்பாட்டையும் இயல்பாகக் காக்கிறது.
- source_word: λαοῦ σου Ἰσραήλ
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: இஸ்ரவேலே ‘உமது மக்கள்’ என்று அடையாளப்படுத்தும் இணைப்புப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: καὶ
  choice: -வும் … -வும்
  rationale: இரு இணையான கூறுகளையும் தமிழ் இணைப்பு அமைப்பில் சமநிலையுடன் இணைக்கிறது.
theological_decisions:
- issue: ἐθνῶν என்பதை இஸ்ரவேலுடன் தொடர்புபடுத்தி மொழிபெயர்த்தல்
  choice: பிற இனத்தார்
  alternative: இனங்கள் / தேசங்கள்
  rationale: வசனத்தில் ἐθνῶν என்பது ‘உமது மக்களாகிய இஸ்ரவேல்’ என்பதுடன் இணைத்துக் கூறப்படுவதால், யூதரல்லாத மக்களைச் சுட்டும் சூழல்சார் வேறுபாட்டை ‘பிற இனத்தார்’ தெளிவாகக் காட்டுகிறது. இருப்பினும், மூலச்சொல்லின் பொதுவான ‘இனங்கள்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சிமியோனின் கவித்துவ இணை அமைப்பைக் காக்க ‘-ஆகவும் … -ஆகவும்’ வடிவம் தேர்ந்தெடுக்கப்பட்டது. ‘உமது’ என்பது இறைவனை நோக்கிய மரியாதைமிக்க ஒருமை முன்னிலையைத் தெளிவாகக் காட்டுகிறது.
