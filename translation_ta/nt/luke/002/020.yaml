base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: ta
  text: மேய்ப்பர்கள் தங்களிடம் சொல்லப்பட்டபடியே தாங்கள் கேட்டதும் கண்டதுமான அனைத்திற்காகவும் கடவுளை மகிமைப்படுத்திப் புகழ்ந்துகொண்டே திரும்பிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: திரும்பிச் சென்றார்கள்
  rationale: முன்னிருந்த இடத்திற்கோ செயலிற்கோ மீண்டும் சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘திரும்பினார்கள்’ என்ற பொருளையும் காக்கிறது.
- source_word: οἱ ποιμένες
  choice: மேய்ப்பர்கள்
  rationale: இக்கதைச் சூழலில் ποιμήν என்பதற்கான வழக்கமான, தெளிவான தமிழாக்கம்.
- source_word: δοξάζοντες καὶ αἰνοῦντες
  choice: மகிமைப்படுத்திப் புகழ்ந்துகொண்டே
  rationale: இரு வேறுபட்டாலும் பொருளில் தொடர்புடைய பங்கேற்பு வினைகளையும் காக்கிறது; அவை திரும்பிச் சென்றபோது தொடர்ந்த செயலை ‘கொண்டே’ வெளிப்படுத்துகிறது.
- source_word: τὸν θεὸν
  choice: கடவுளை
  rationale: இரு பங்கேற்பு வினைகளுக்கும் நேரடிச் செயப்படுபொருளாக இயல்பாக அமைகிறது.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: அனைத்திற்காகவும்
  rationale: ἐπί இங்கு புகழ்ச்சிக்கான அடிப்படை அல்லது காரண நிகழ்வைக் குறிக்கிறது; ‘அனைத்திற்காகவும்’ அந்த உறவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἤκουσαν καὶ εἶδον
  choice: தாங்கள் கேட்டதும் கண்டதுமான
  rationale: இரு இறந்தகாலச் செயல்களையும் காத்து, அவை திரும்பிச் சென்று புகழ்வதற்கு முன் நிகழ்ந்தவை என்பதைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாக உணர்த்துகிறது.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: தங்களிடம் சொல்லப்பட்டபடியே
  rationale: செயப்பாட்டு வடிவத்தையும், பேசினவர் யார் என்பதை வெளிப்படையாகக் குறிப்பிடாத மூலத்தின் அமைப்பையும் காக்கிறது; καθώς என்பதன் ஒப்புமையையும் ‘படியே’ தெரிவிக்கிறது.
theological_decisions:
- issue: கேட்டதும் கண்டதும் தேவதூதரின் அறிவிப்போடு பொருந்தியதாக வெளிப்படையாகக் கூற வேண்டுமா
  choice: ‘தங்களிடம் சொல்லப்பட்டபடியே’ என்று பேசினவரைக் குறிப்பிடாமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேவதூதர் தங்களிடம் சொன்னபடியே’
  rationale: சூழல் தேவதூதரின் செய்தியைச் சுட்டினாலும், இவ்வசனத்தின் கிரேக்கச் செயப்பாட்டு வினை பேசினவரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தில் உள்ள மறைமுகத்தன்மை காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்புகள் தமிழிலும் ஒரே வாக்கியமாகத் தெளிவாக வைக்கப்பட்டுள்ளன.
