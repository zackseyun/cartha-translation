  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: ta
  text: பதிவுசெய்துகொள்வதற்காக[a] எல்லோரும், ஒவ்வொருவரும் தன் சொந்த நகரத்துக்குச் சென்றுகொண்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதிவு செய்ய” அல்லது “பதிவு செய்யப்பட.” இச்சொல் மக்கள்தொகைக் கணக்கெடுப்புடன் தொடர்புடைய அதிகாரப்பூர்வப் பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இந்தத் தொடர் ஒருமை ஆண்பால் இலக்கண வடிவில், எழுத்துப்படி “ஒவ்வொருவனும் தன்னுடைய சொந்த நகரத்துக்கு” என்று உள்ளது. தமிழில் “ஒவ்வொருவரும் தன்” என்பது அதே ஒருமைப் பகிர்வுப் பொருளை பாலினத்தைக் குறிப்பிடாமல் இயல்பாகத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: சென்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த நகர்வைச் சுட்டும் imperfect வடிவத்தின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάντες
  choice: எல்லோரும்
  rationale: ‘அனைவரும்’ என்ற முழுமையான பொருளையும், பின்னர் வரும் தனித்தனி பகிர்வையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀπογράφεσθαι
  choice: பதிவுசெய்யப்படுவதற்காக
  rationale: மக்கள்தொகைக் கணக்கெடுப்புடன் தொடர்புடைய அதிகாரப்பூர்வப் பதிவைக் குறிக்கிறது; கிரேக்க middle/passive வடிவத்தைத் தீர்மானமாகச் செய்பாட்டு வடிவமாக மாற்றாமல் காக்கிறது.
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: ஒவ்வொரு நபரும் தனித்தனியாகச் சென்றார் என்ற பகிர்வுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἑαυτοῦ
  choice: தன் சொந்த
  rationale: கிரேக்கத் தற்சுட்டுப் பெயரின் ‘தனக்கே உரிய’ என்ற வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது; தமிழ் வடிவம் பாலினத்தைக் குறிக்க வேண்டியதில்லை.
- source_word: πόλιν
  choice: நகரத்துக்கு
  rationale: πόλις என்பதன் வழக்கமான நேரடிப் பொருளைத் தருகிறது; ‘சொந்த ஊர்’ அல்லது ‘மூதாதையர் ஊர்’ போன்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἕκαστος ... ἑαυτοῦ என்ற ஒருமை ஆண்பால் பகிர்வு அமைப்பு
  choice: ஒவ்வொருவரும் தன் சொந்த நகரத்துக்கு
  alternative: ஒவ்வொருவரும் அவரவர் சொந்த நகரத்துக்கு
  rationale: ‘ஒவ்வொருவரும் ... தன்’ என்பது கிரேக்கத்தின் ஒருமைப் பகிர்வைத் தமிழில் இயல்பாகக் காக்கிறது. தமிழின் ‘தன்’ பாலினத்தைக் குறிக்காததால், மூலத்தின் இலக்கண ஆண்பாலை செயற்கையாகச் சேர்க்காமல் அதன் எண்ணையும் தற்சுட்டுப் பொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட வாக்கியத்தின் பகிர்வுப் பகுதியைத் தெளிவாக்க முற்றுப்புள்ளிக்குப் பதிலாக நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது; இது கிரேக்க வாக்கியத்தின் ஒருமைப்பாட்டைத் தக்கவைக்கிறது.
