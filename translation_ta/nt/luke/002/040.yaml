  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: ta
  text: குழந்தை வளர்ந்து, வலிமை பெற்று வந்தது; ஞானத்தால் நிரம்பி வந்தது. கடவுளுடைய அருள்[a] அந்தக் குழந்தையின்மேல் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய தயவு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: குழந்தை
  rationale: παιδίον என்பது இங்கு குழந்தையைக் குறிக்கிறது; உடனடி குழந்தைப் பருவச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது. δέ தமிழ் தொடர் நடையில் தனியாக மொழிபெயர்க்கப்படாமலேயே இணைப்பை உணர்த்துகிறது.
- source_word: ηὔξανεν
  choice: வளர்ந்து
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ச்சியான வளர்ச்சியைக் காட்டுகிறது; அடுத்த வினையுடன் இணைந்த தமிழ் அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκραταιοῦτο
  choice: வலிமை பெற்றுவந்தது
  rationale: முற்றுப்பெறாத கால வடிவம் படிப்படியாக வலிமை அடைந்துவருவதைக் குறிக்கிறது; 'பெற்றுவந்தது' அந்த முன்னேற்றத் தன்மையைப் பாதுகாக்கிறது.
- source_word: πληρούμενον σοφίᾳ
  choice: ஞானத்தால் நிரப்பப்பட்டுவந்தது
  rationale: நிகழ்காலப் பெயரெச்சம் வளர்ச்சியோடு இணைந்து தொடர்ந்த செயல் அல்லது நிலையைக் காட்டுகிறது. σοφίᾳ நிரப்பும் உள்ளடக்கத்தையோ கருவியையோ குறிக்கக்கூடிய வேற்றுமை ambiguity உடையது; 'ஞானத்தால்' தமிழில் இதை அளவுக்கு மீறித் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: χάρις θεοῦ
  choice: கடவுளுடைய அருள்
  rationale: χάρις என்பதற்கு அருள், தயவு, ஆதரவு ஆகிய பொருள் நிழல்கள் உள்ளன. 'அருள்' நவீனத் தமிழில் இயல்பானதும் வேதாகமப் பயன்பாட்டில் பரந்த பொருளுடையதும் ஆகும்; 'தயவு' செல்லத்தக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦν ἐπ’ αὐτό
  choice: அதன்மேல் இருந்தது
  rationale: ἐπί இங்கு ஒருவர்மேல் நிலைத்திருக்கும் இருப்பைக் குறிக்கிறது. குழந்தை என்ற அஃறிணைப் பெயருக்கேற்ற 'அதன்மேல்' மூலத்தின் சுட்டுப்பெயர் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: கிறிஸ்துவின் வளர்ச்சியை விவரிக்கும் சூழலில் χάρις θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய அருள்
  alternative: கடவுளுடைய தயவு
  rationale: மூலச் சொல்லின் அருள்/தயவு என்ற உண்மையான பொருள் பரப்பை 'அருள்' பாதுகாக்கிறது. குமாரனில் ஏதோ தெய்வீகக் குறை இருந்ததாகவோ அதைப் போக்க அருள் தேவைப்பட்டதாகவோ உரை கூறுவதில்லை; மனிதக் குழந்தையாக அவர் வளர்ந்த சூழலில் கடவுளுடைய அருள் அவர்மேல் இருந்ததாக மட்டுமே கூறுகிறது. 'தயவு' என்ற செல்லத்தக்க வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. கிரேக்க முற்றுப்பெறாத காலத்தின் தொடர்ச்சியை 'பெற்றுவந்தது/நிரப்பப்பட்டுவந்தது' என்பவை வெளிப்படுத்துகின்றன. மூலத்தின் இரண்டு இணை வாக்கியங்களையும் தெளிவுக்காக அரைப்புள்ளி மற்றும் முற்றுப்புள்ளியால் பிரித்துள்ளோம்.
