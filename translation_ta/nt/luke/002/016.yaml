  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: ta
  text: அவர்கள் விரைந்து வந்து, மரியாளையும் யோசேப்பையும், தீவனத் தொட்டியில்[a] படுத்திருந்த குழந்தையையும் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் கால்நடைகளுக்குத் தீவனம் வைக்கும் தொட்டியைக் குறிக்கிறது; இதை ‘முன்னணை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: வந்து
  rationale: முன்னதாக அறிவிக்கப்பட்ட இடத்தை நோக்கிய மேய்ப்பர்களின் நகர்வை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: σπεύσαντες
  choice: விரைந்து
  rationale: முதன்மை வினை நிகழ்ந்த விதத்தையும் அதிலிருந்த அவசரத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἀνεῦραν
  choice: கண்டார்கள்
  rationale: தேடிய பின் கண்டடைந்ததைக் குறிக்கும் கிரேக்க வினையின் பொருள் சூழலால் தெளிவாக இருப்பதால், இயல்பான தமிழ் சொல்லான ‘கண்டார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: மரியாளையும் யோசேப்பையும்
  rationale: பெயர்கள் வழக்கமான தமிழ் வேதாகமப் பெயர்ப்புமுறையில் தரப்பட்டு, τε...καί இணைப்பு ‘-ஐயும்...-ஐயும்’ என இயல்பாகக் காக்கப்பட்டது.
- source_word: τὸ βρέφος
  choice: குழந்தை
  rationale: பிறந்த மிக இளம் குழந்தையை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: κείμενον
  choice: படுத்திருந்த
  rationale: குழந்தை அங்கே வைக்கப்பட்ட செயலை அல்ல, அங்கே படுத்திருந்த நிலையைக் குறிப்பிடும் கிரேக்க நிகழ்காலப் பெயரெச்சத்தின் நிலைப்பொருளைக் காக்கிறது.
- source_word: ἐν τῇ φάτνῃ
  choice: தீவனத் தொட்டியில்
  rationale: φάτνη என்பது கால்நடைகளுக்குத் தீவனம் வைக்கும் தொட்டி அல்லது முன்னணையைக் குறிக்கலாம்; ‘தீவனத் தொட்டி’ நவீன வாசகருக்கு உடனடியாகப் புரியும் துல்லியமான சொற்றொடர்.
- source_word: καὶ ... καὶ ... καὶ
  choice: -யும் ... -யும் ... -யும்
  rationale: கிரேக்கத்தின் தொடர் இணைப்பைத் தமிழின் இயல்பான கூட்டிணைப்பு விகுதிகளால் பிரதிபலிக்கிறது.
