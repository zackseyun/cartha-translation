  source_fidelity: 'கிரேக்க மூலத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: σπεύσαντες என்பதன் அவசரமான முறை ‘விரைந்து’ எனவும், ἀνεῦραν என்பதன் நிறைவேறிய கண்டடைதல் ‘கண்டார்கள்’ எனவும், κείμενον என்பதன் நிலை ‘படுத்திருந்த’ எனவும் தரப்பட்டுள்ளது. மரியா, யோசேப்பு, குழந்தை என்ற மூன்று இணைக்கப்பட்ட கூறுகளும் தெளிவாக உள்ளன; φάτνη ‘தீவனத் தொட்டி’ எனச் சரியாக மொழிபெயர்க்கப்பட்டுள்ளது.'
