theological_decisions:
- issue: அன்னாளின் προφῆτις என்ற அடையாளம்
  choice: பெண் இறைவாக்கினர்
  alternative: சமயப் பற்றுள்ள பெண் அல்லது வெறும் மரியாதைப் பட்டம்
  rationale: மூலவசனம் பெண்பாலில் அமைந்த, இறைவாக்கினரைக் குறிக்கும் வழக்கமான சொல்லையே பயன்படுத்துகிறது. ஆகவே அந்தப் பணியை வலுவிழக்கச் செய்யாமல் வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- issue: அன்னாளின் வயது குறித்த மரபுத்தொடர்
  choice: வயது மிகவும் முதிர்ந்தவர்
  alternative: பல நாட்களில் முன்னேறியவர்
  rationale: கிரேக்க மரபுத்தொடர் முதுமையைக் குறிக்கிறது. தமிழில் அதன் பொருளை இயல்பாகத் தருவதுடன், மூல உருவகம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது; அடுத்த வசனத்தின் காலக் கணக்கை இவ்வசனத்திற்குள் கொண்டுவரவில்லை.
- issue: ἀπὸ τῆς παρθενίας αὐτῆς என்பதன் காலத் தொடர்பு
  choice: தமது கன்னிப்பருவத்திலிருந்து
  alternative: கன்னிப்பருவம் முடிந்தபின், அதாவது திருமணமானதிலிருந்து
  rationale: மூலத்தின் சுருக்கமான சொற்றொடரை முதன்மை உரையில் காத்து, அது திருமணத்தால் கன்னிப்பருவத்தை விட்ட காலத்திலிருந்து கணக்கிடப்படலாம் என்பதை அடிக்குறிப்பில் மட்டும் விளக்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசினி’ போன்ற பழமையான சொல்லுக்குப் பதிலாக பாலினத்தையும் பணியையும் தெளிவாகக் காட்டும் ‘பெண் இறைவாக்கினர்’ தேர்ந்தெடுக்கப்பட்டது. வசனம் தொடரும் கிரேக்க வாக்கியத்தின் ஒரு பகுதியாக இருந்தாலும், தனிவசன வாசிப்புக்கேற்ற தமிழ்ச் சொற்றொடர்களாக அமைக்கப்பட்டுள்ளது.
