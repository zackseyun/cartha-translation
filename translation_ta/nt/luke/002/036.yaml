  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: ta
  text: மேலும், பெனுவேலின் மகளும் ஆசேர் கோத்திரத்தைச் சேர்ந்தவருமான அன்னாள் என்ற பெண் இறைவாக்கினர் ஒருவர் இருந்தார். அவர் வயதில் மிகவும் முதிர்ந்தவர்.[a] தமது கன்னிப்பருவத்திலிருந்து கணவருடன் ஏழு ஆண்டுகள் வாழ்ந்திருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “பல நாட்களில் முன்னேறியவர்”; இது மிகவும் முதிர்ந்த வயதைக் குறிக்கும் கிரேக்க மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தமது கன்னிப்பருவம் முடிந்தபின் கணவருடன் ஏழு ஆண்டுகள் வாழ்ந்திருந்தார்”; அதாவது, கன்னிப்பருவத்தை விட்டு மணவாழ்க்கைக்குள் வந்ததிலிருந்து ஏழு ஆண்டுகள்.
    reason: lexical_alternative
