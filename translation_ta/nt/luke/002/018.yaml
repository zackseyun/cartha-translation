- from: இதைக் கேட்ட அனைவரும், மேய்ப்பர்கள் தங்களிடம் சொன்னவற்றைக் குறித்து வியந்தார்கள்.[a]
  to: இதைக் கேட்ட அனைவரும், மேய்ப்பர்கள் அவர்களிடம் சொன்னவற்றைக் குறித்து வியந்தார்கள்.[a]
  rationale: Changed only “தங்களிடம்” to “அவர்களிடம்” to ensure that the shepherds’ words are understood as addressed to the hearers, as required by πρὸς αὐτούς. No theological or interpretive clarification has been introduced.
