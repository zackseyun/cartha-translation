lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய நிகழ்வுடன் வசனத்தை இணைக்கும் எளிய தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தனியாகச் சொல் சேர்க்காமல் வாக்கிய ஓட்டத்தில் இணைப்பு உணர்த்தப்பட்டுள்ளது.
- source_word: πάντες οἱ ἀκούσαντες
  choice: இதைக் கேட்ட அனைவரும்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் இறந்தகாலப் பங்கேற்பை இயல்பான தமிழில் தருகிறது. ‘இதை’ என்பது சூழலிலிருந்து அறியப்படும் மேய்ப்பர்களின் செய்தியைக் குறிக்கிறது.
- source_word: ἐθαύμασαν
  choice: வியந்தார்கள்
  rationale: கேட்ட செய்தியால் ஏற்பட்ட ஆச்சரியத்தையும் வியப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; விசுவாசம் அல்லது அவிசுவாசம் என்று மேலதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: περὶ τῶν λαληθέντων
  choice: சொன்னவற்றைக் குறித்து
  rationale: περί உடன் வரும் தொடர்பு/பொருள் சார்ந்த அர்த்தத்தையும், பேசப்பட்டவற்றின் உள்ளடக்க மையத்தையும் காக்கிறது.
- source_word: ὑπὸ τῶν ποιμένων
  choice: மேய்ப்பர்கள்
  rationale: செயப்பாட்டு அமைப்பிலுள்ள செய்பவர்களைத் தமிழில் இயல்பான செயவினை அமைப்பாக மாற்றி, ποιμένες என்பதைக் ‘மேய்ப்பர்கள்’ என்று நேரடியாக வழங்குகிறது.
- source_word: πρὸς αὐτούς
  choice: தங்களிடம்
  rationale: பேச்சு கேட்பவர்களை நோக்கிச் சொல்லப்பட்டது என்பதை வெளிப்படுத்துகிறது; பிரதிப்பெயரின் சுட்டுதலை அளவுக்கு மீறித் தெளிவுபடுத்தவில்லை.
theological_decisions:
- issue: ἐθαύμασαν விவரிக்கும் எதிர்வினையின் தன்மை
  choice: கேட்டவர்கள் வியந்தார்கள் என்று மட்டும் கூறுதல்
  alternative: அவர்கள் விசுவாசித்தார்கள் அல்லது வெறும் ஆர்வத்துடன் எதிர்வினையாற்றினார்கள் என்று கூறுதல்
  rationale: θαυμάζω ஆச்சரியம் அல்லது வியப்பைக் குறிக்கிறது. அது இரட்சிக்கும் விசுவாசமாக மாறியதா, அல்லது அவிசுவாசமாக இருந்ததா என்பதை வசனம் குறிப்பிடாததால் அந்தத் திறந்தநிலையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கச் செயப்பாட்டு அமைப்பு தமிழின் இயல்புக்கேற்ப செயவினையாக மாற்றப்பட்டாலும், தகவலும் கருத்துத் திறந்தநிலையும் காக்கப்பட்டுள்ளன.
