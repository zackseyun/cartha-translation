- from: அவரைக் காணாததால்[a], அவரைத் தேடிக்கொண்டே எருசலேமுக்குத் திரும்பினார்கள்.
  to: அவரைக் காணாமல்[a], அவரைத் தேடிக்கொண்டு எருசலேமுக்குத் திரும்பினார்கள்.
  rationale: “காணாததால்” என்பதற்குப் பதிலாக “காணாமல்” பயன்படுத்தப்பட்டுள்ளது. இதனால் மூலத்தில் வெளிப்படையாக இல்லாத காரணத் தொடர்பு நீக்கப்பட்டு, கிரேக்கப் பங்கேற்பு அமைப்பின் சூழ்நிலை/உடனிகழ்வு நுட்பம் பாதுகாக்கப்படுகிறது. இரண்டாவது பங்கேற்பின் செயலில் தேடும் பொருள் “தேடிக்கொண்டு” என்பதில் தக்கவைக்கப்பட்டுள்ளது.
