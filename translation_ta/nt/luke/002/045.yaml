    reason: கிரேக்கப் பங்கேற்புச் சொல் காரணத்தைக் கட்டாயப்படுத்தாமல், கால அல்லது சூழ்நிலைத் தொடர்பைக் குறிக்கலாம்.
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: தமிழில் முந்தைய நிகழ்வுடன் தொடர்ச்சியை வினையெச்ச அமைப்பே இயல்பாகக் காட்டுகிறது; தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது தேவையற்றதாகவோ அதிக விளக்கமாகவோ இருக்கும்.
- source_word: μὴ εὑρόντες
  choice: அவரைக் காணாததால்
  rationale: μή உடன் வரும் இறந்தகாலப் பங்கேற்புச் சொல் சூழ்நிலைத் தொடர்பைக் காட்டுகிறது. ‘காணாததால்’ என்பது காரணத் தொனியையும் நிகழ்வுகளின் வரிசையையும் இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் உள்ள தொடர்பு காலச்சூழலாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπέστρεψαν
  choice: திரும்பினார்கள்
  rationale: ὑποστρέφω என்பதன் ‘திரும்புதல்’ என்ற பொருளை நேரடியாகவும் கண்ணியமான நவீன தமிழிலும் தருகிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: ஒரு நகரை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாக இலக்கு வேற்றுமை உருபான ‘-க்கு’ காட்டுகிறது.
- source_word: ἀναζητοῦντες
  choice: தேடிக்கொண்டே
  rationale: ἀναζητέω குறிக்கும் தீவிரமான, தொடர்ச்சியான தேடலை இணைநிகழ்வாக ‘தேடிக்கொண்டே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை, தமிழின் மரியாதை வழக்குக்கு ஏற்றவாறு ‘அவரை’ என வழங்குகிறது.
