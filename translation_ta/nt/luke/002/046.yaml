source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: ta
  text: மூன்று நாட்களுக்குப் பிறகு, அவர்கள் அவரை ஆலயத்தில்[a] கண்டார்கள். அவர் ஆசிரியர்களின் நடுவே அமர்ந்து, அவர்கள் சொல்வதைக் கேட்டுக்கொண்டும் அவர்களிடம் கேள்விகள் கேட்டுக்கொண்டும்[b] இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (ἱερόν), ஆலயத்தின் உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவர்களிடம் வினவிக்கொண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: வாக்கியத்தின் இயல்பான நிகழ்வுரை அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது லூக்கா பயன்படுத்தும் நிகழ்வை அறிமுகப்படுத்தும் மரபுத்தொடர். தமிழில் ‘அது நடந்தது’ என்று தனியே மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், தொடர்ந்த நிகழ்வுரை அமைப்பிலேயே அதன் செயல்பாடு வெளிப்படுத்தப்படுகிறது.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: மூன்று நாட்களுக்குப் பிறகு
  rationale: μετά + வேற்றுமை வடிவம் காலத்துக்குப் பிந்திய நிகழ்வைக் குறிக்கிறது; இந்தத் தேர்வு கிரேக்கச் சொல்லமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: εὗρον
  choice: கண்டார்கள்
  rationale: தேடியபின் ஒருவரைக் கண்டடையும் பொருளைச் சூழல் தெளிவாக்குகிறது; ‘கண்டார்கள்’ எளிய, நேரடியான நிகழ்வுரை.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கக்கூடும். வாசிப்புக்கு இயல்பான ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: καθεζόμενον
  choice: அமர்ந்து
  rationale: அவர்கள் இயேசுவைக் கண்டபோது அவர் இருந்த தொடர்ச்சியான உடல் நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: ஆசிரியர்களின் நடுவே
  rationale: διδάσκαλοι என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘திருச்சட்ட ஆசிரியர்கள்’ போன்ற கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: ἀκούοντα αὐτῶν
  choice: அவர்கள் சொல்வதைக் கேட்டுக்கொண்டும்
  rationale: வெறுமனே ஒலி கேட்பதைவிட கவனமாகச் செவிகொடுக்கும் செயலைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπερωτῶντα αὐτούς
  choice: அவர்களிடம் கேள்விகள் கேட்டுக்கொண்டும்
  rationale: ἐπερωτάω என்பதன் கேட்பது/வினவுவது என்ற பொருளை, எதிர்ப்போ விசாரணைத் தொனியோ தேவையின்றி சுமத்தாமல் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசிரியர்களோடு இயேசு கொண்டிருந்த உரையாடலின் தன்மை
  choice: ‘அவர்கள் சொல்வதைக் கேட்டுக்கொண்டும் அவர்களிடம் கேள்விகள் கேட்டுக்கொண்டும்’ என்று, கவனமாகக் கேட்பதையும் செயலில் பங்கேற்பதையும் இணைத்துக் காட்டுதல்
  alternative: ‘அவர்களை வினவிக்கொண்டும்’ என்று மொழிபெயர்த்தல்; இது சில வாசகர்களுக்கு சவால் விடுதல் அல்லது விசாரித்தல் என்ற வலுவான தொனியைத் தரக்கூடும்
  rationale: கிரேக்கம் இயேசுவின் ஞானத்தைக் குறைக்கவும் இல்லை, அவர் ஆசிரியர்களை எதிர்த்து விசாரித்தார் என்று கட்டாயப்படுத்தவும் இல்லை. ஆகவே பணிவும் அறிவார்ந்த பங்கேற்பும் இணைந்திருக்கும் உரையின் பதற்றம் தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தொடர்ச்சியான இரு பங்கேற்புச் செயல்களும் ‘கேட்டுக்கொண்டும்… கேட்டுக்கொண்டும் இருந்தார்’ என்ற இணை அமைப்பில் காக்கப்பட்டுள்ளன.
