  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: ta
  text: யோசேப்பும் கலிலேயாவிலுள்ள நாசரேத் என்னும் ஊரிலிருந்து யூதேயாவுக்கு, தாவீதின் நகரம் என்று அழைக்கப்படும் பெத்லகேமுக்கு ஏறிச் சென்றான்; அவன் தாவீதின் வீட்டையும் குடும்ப மரபையும் சேர்ந்தவனாக இருந்ததால்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின் வீட்டையும் குலத்தையும் சேர்ந்தவன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் மூதாதையர் வழித் தொடர்பைக் குறிக்கும் இரண்டு நெருங்கிய சொற்கள் பயன்படுத்தப்பட்டு, யோசேப்பின் தாவீதிய வம்சத் தொடர்பு வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
