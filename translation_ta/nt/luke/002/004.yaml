  rationale: யூதேயாவை நோக்கிய பயணத்தின் உயர்நோக்கிய புவியியல் நுட்பத்தையும் கிரேக்க மொழியின் பயணச் சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: δὲ καὶ
  choice: யோசேப்பும்
  rationale: δὲ தரும் மென்மையான கதைத் தொடர்ச்சியையும் καὶ தரும் ‘கூட/உம்’ பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: கலிலேயாவிலுள்ள நாசரேத் என்னும் ஊரிலிருந்து
  rationale: புறப்பட்ட பகுதியையும் குறிப்பிட்ட ஊரையும் தெளிவாகக் காட்டி, கிரேக்கத்தின் இரட்டை இடக் குறிப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: யூதேயாவுக்கு
  rationale: ரோமக் காலப் புவியியல் பிரதேசத்தைக் குறிக்கும் வழக்கமான தமிழ் பெயரைப் பயன்படுத்துகிறது.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: தாவீதின் நகரம் என்று அழைக்கப்படும் பெத்லகேமுக்கு
  rationale: பெத்லகேமை விளக்கும் உறவுத்தொடரையும் தாவீதுடனான முக்கியமான தொடர்பையும் காக்கிறது.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: ஏனெனில், அவன் ... சேர்ந்தவன்
  rationale: διά உடன் வரும் infinitive காரணத்தைக் குறிக்கிறது; தமிழில் தெளிவான காரண வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: ἐξ οἴκου
  choice: வீட்டைச் சேர்ந்தவன்
  rationale: οἶκος என்பதன் சாதாரண குடியிருப்பு பொருளை விட, இங்கு உள்ள அரச வம்சக் குடும்பப் பொருளை ‘வீடு’ என்ற வேதாகமச் சொல்லாட்சி தக்கவைக்கிறது.
- source_word: πατριᾶς
  choice: வம்சத்தைச் சேர்ந்தவன்
  rationale: மூதாதையர் வழியிலான குடும்ப மரபை நவீன வாசகர்களுக்குத் தெளிவாகக் கூறுகிறது; οἶκος உடன் வரும் இரண்டாவது மரபுச் சொல்லைத் தனியாகவும் காக்கிறது.
theological_decisions:
- issue: தாவீதின் வழிவந்தவர் என்பதைக் குறிக்கும் இரட்டைச் சொல்லாட்சி
  choice: தாவீதின் வீட்டையும் வம்சத்தையும் சேர்ந்தவன்
  alternative: தாவீதின் வீட்டையும் குலத்தையும் சேர்ந்தவன்
  rationale: οἴκου மற்றும் πατριᾶς என்ற இரு தொடர்புடைய சொற்களையும் ஒன்றாகச் சுருக்காமல் காக்கிறது. இதனால் யோசேப்பின் தாவீதிய மரபை லூக்கா வலியுறுத்துவது வெளிப்படுகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டுத் தீர்மானம் எதுவும் சேர்க்கப்படவில்லை.
