  terminology: ‘உமது’ appropriately marks respectful address to God. ‘மீட்பு’ is natural and does not overdefine σωτήριον as the personal title ‘மீட்பர்.’ The alternative is retained explicitly as an alternative, while the note correctly identifies ‘மீட்பு’ as the Greek wording.
