  text: ὅτι εἶδον οἱ ὀφθαλμοί μου τὸ σωτήριόν σου
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/030.yaml
  text: because my eyes have seen your salvation[a]
translation:
  language: ta
  text: ஏனெனில், என் கண்கள் உமது மீட்பைக் கண்டன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது மீட்பரை.’ கிரேக்க மூலத்தில் ‘உமது மீட்பு’ என்றே உள்ளது; ஆனால் சூழலில் கடவுளுடைய மீட்பு இயேசுவில் வெளிப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் சிமியோன் சமாதானத்துடன் விடுவிக்கப்படுவதற்கான காரணத்தை இது அறிமுகப்படுத்துகிறது; ஆகவே காரணப்பொருளைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணைப்புச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἶδον
  choice: கண்டன
  rationale: கிரேக்க இறந்தகால வினையைத் தமிழில் இயல்பான இறந்தகாலமாகத் தருகிறது; எழுவாயான ‘என் கண்கள்’ என்பதோடு எண்ணிலும் பாலும் இயைந்து, நிகழ்காலத் தொடர்பு சூழலிலிருந்து தெளிவாகிறது.
- source_word: οἱ ὀφθαλμοί μου
  choice: என் கண்கள்
  rationale: ‘நான்’ என்று எளிமைப்படுத்தாமல், கிரேக்கத்தில் உள்ள உடல்சார்ந்த உயிரோட்டமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: τὸ σωτήριόν σου
  choice: உமது மீட்பு
  rationale: σωτήριον நேரடியாக ‘மீட்பர்’ என்னும் நபர்பெயரை அல்ல, கடவுள் அருளும் மீட்பை அல்லது இரட்சிப்பைக் குறிக்கிறது. ‘மீட்பு’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, இயேசுவில் அந்த மீட்பு காணப்படுகிறது என்ற சூழல்சார்ந்த ஆழத்தையும் திறந்தவண்ணம் வைக்கிறது.
theological_decisions:
- issue: τὸ σωτήριόν σου என்பதை கருத்துப்பெயராக மொழிபெயர்ப்பதா, குழந்தை இயேசுவைக் கருத்தில் கொண்டு நபர்பெயராக மொழிபெயர்ப்பதா
  choice: உமது மீட்பு
  alternative: உமது மீட்பர்
  rationale: மூலத்தில் வழக்கமான நபர்பெயரான σωτήρ (‘மீட்பர்’) அல்ல, σωτήριον (‘மீட்பு/விடுதலை’) உள்ளது. எனவே மூலச் சொல்லை நிலைநிறுத்தி, கடவுளுடைய மீட்பு இயேசுவில் நேரில் உள்ளது என்பதை வாசகர் சூழலிலிருந்து உணர இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். கடவுளை நோக்கிய உரை என்பதால் ‘உமது’ பயன்படுத்தப்பட்டது. வசனத்தின் கவித்துவமான ‘என் கண்கள்’ என்ற வெளிப்பாடு பாதுகாக்கப்பட்டுள்ளது.
