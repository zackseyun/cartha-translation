language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: ta
  text: அவருடைய தந்தையும் தாயும் அவரைப் பற்றிச் சொல்லப்பட்டவற்றைக் கண்டு வியந்துகொண்டிருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில், “அவருடைய தந்தை” என்று உள்ளது. இங்கே அது கதைச் சூழலில் இயல்பான குடும்ப அல்லது சட்டரீதியான பொருளில் யோசேப்பைக் குறிக்கிறது. இயேசுவின் கன்னிக் கருத்தரிப்பைப் பற்றிய லூக்காவின் முந்தைய விவரத்தின் வெளிச்சத்தில் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்க, சில மொழிபெயர்ப்புகள் “யோசேப்பும் அவருடைய தாயும்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: அவருடைய தந்தை
  rationale: கிரேக்க மூலத்தின் நேரடியான சொல்லாக்கத்தைப் பாதுகாக்கிறது. கன்னிப் பிறப்பைப் பற்றிய முந்தைய விவரத்துடன் இசைவுபடுத்துவதற்காக ‘யோசேப்பு’ என்று மாற்றாமல், கதையின் குடும்ப மற்றும் சட்டச் சூழலில் உள்ள இயல்பான உறவுமுறையை அப்படியே வைக்கிறது.
- source_word: μήτηρ
  choice: தாய்
  rationale: μήτηρ என்பதற்கான இயல்பான நவீனத் தமிழ் இணை; ‘அவருடைய தந்தையும் தாயும்’ என்ற இணைப்பில் தெளிவாக அமைகிறது.
- source_word: θαυμάζοντες
  choice: வியந்துகொண்டிருந்தார்கள்
  rationale: ἦν என்பதுடன் சேர்ந்த நிகழ்காலப் பங்கேற்புவினை, இறந்தகாலத்தில் தொடர்ந்த நிலையைக் காட்டுகிறது. ‘வியந்துகொண்டிருந்தார்கள்’ அந்த நீடித்த செயற்பாட்டையும் வியப்புணர்வையும் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: சொல்லப்பட்டவற்றைக் குறித்து
  rationale: பன்மை வடிவிலுள்ள செயப்பாட்டு பங்கேற்புவினையை ‘சொல்லப்பட்டவை’ என்று பிரதிபலித்து, வியப்பிற்குரிய பேச்சின் உள்ளடக்கத்தைக் குறிக்கிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றி
  rationale: περί + பிறப்புவேற்றுமையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் கன்னிப் பிறப்பை உறுதிப்படுத்தும் சூழலில் யோசேப்பை ‘அவருடைய தந்தை’ என்று குறிப்பிடுதல்
  choice: மூலத்தின் சொல்லாக்கத்தின்படி ‘அவருடைய தந்தை’ என்று மொழிபெயர்த்து, குடும்ப/சட்டப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘யோசேப்பும் அவருடைய தாயும்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை தரும் இறையியல் பதற்றத்தைத் தீர்த்து மாற்றாமல் பாதுகாக்க வேண்டும். லூக்கா ஏற்கெனவே கூறிய கன்னிக் கருத்தரிப்பை மறுக்காமல், கதையின் இயல்பான குடும்ப அல்லது சட்டச் சூழலில் யோசேப்பை இயேசுவின் தந்தை என்று குறிப்பிட முடியும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வியந்துகொண்டிருந்தார்கள்’ என்பது தொடர்ந்த இறந்தகாலச் செயலை இயல்பாகக் காட்டுகிறது; மூலத்திலுள்ள ‘தந்தை’ என்ற சொல்லால் எழும் உண்மையான இறையியல் பதற்றம் முதன்மை உரையில் மாற்றப்படாமல், அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
