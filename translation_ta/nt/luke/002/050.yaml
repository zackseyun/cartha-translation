  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: ta
  text: அவர் அவர்களிடம் சொன்ன அந்தச் சொல்லை அவர்கள் புரிந்துகொள்ளவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வார்த்தையை,” “சொன்னதை,” அல்லது “விஷயத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: கிரேக்கத்தில் இது கதைநடையைத் தொடரும் பொதுவான இணைப்புச்சொல். தமிழில் இங்கு ‘மேலும்’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது முறையே தேவையற்ற வலியுறுத்தலையோ வெளிப்படையாக இல்லாத எதிர்மறைத் தொடர்பையோ உருவாக்கும்; இயல்பான தொடர்ச்சிக்காக அது தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: αὐτοὶ
  choice: அவர்கள்
  rationale: சூழலில் இது இயேசுவின் பெற்றோரைக் குறிக்கிறது. கிரேக்கத்தில் சுட்டுப்பெயர் வெளிப்படையாக இருந்தாலும், ‘அவர்களே’ என வலியுறுத்துவது தமிழில் மூலத்தைவிட அதிக அழுத்தம் தரக்கூடும்.
- source_word: οὐ συνῆκαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: συνίημι என்பதன் நேரான பொருள் புரிந்துகொள்வது அல்லது விளங்கிக்கொள்வது. பகுதியளவு புரிந்தனர் என்றோ ஏற்றுக்கொள்ளவில்லை என்றோ வசனம் கூறவில்லை.
- source_word: τὸ ῥῆμα
  choice: அந்தக் கூற்றை
  rationale: ῥῆμα இங்கு இயேசு சற்றுமுன் சொன்ன குறிப்பிட்ட உரையைக் குறிக்கிறது. ‘கூற்று’ என்பது சொல்லப்பட்ட கருத்தை இயல்பாகக் குறிக்கிறது; மூலச்சொல்லின் பரந்த பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: அவர் தங்களிடம் சொன்ன
  rationale: உறவுப்பெயரெச்ச அமைப்பை இயல்பான தமிழ் பெயரெச்சத் தொடராக மாற்றுகிறது. ‘தங்களிடம்’ என்பது அவர் யாரிடம் சொன்னார் என்பதைத் தெளிவாகக் காட்டுகிறது; ‘சொன்ன’ என்பது λαλέω-வின் இச்சூழலுக்கேற்ற இயல்பான வடிவம்.
theological_decisions:
- issue: இயேசுவின் பெற்றோரின் பதிலைச் சித்தரித்தல்
  choice: அவர்கள் இயேசுவின் கூற்றைப் புரிந்துகொள்ளவில்லை என்று நேராகக் கூறுதல்
  alternative: அவர்கள் முழுமையாகப் புரிந்துகொள்ளவில்லை / அவர்கள் அதை ஏற்றுக்கொள்ளவில்லை
  rationale: கிரேக்க உரை புரிதல் இல்லாமையையே கூறுகிறது; அது பகுதியளவான புரிதலையோ மறுப்பையோ குறிப்பிடவில்லை. இயேசுவின் அடையாளத்தையும் பணியையும் சுற்றியுள்ள கதைத் தளர்வை விளக்கிச் சமப்படுத்தாமல் மொழிபெயர்ப்பு அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்தக் கூற்று’ முந்தைய வசனத்தில் இயேசு சொன்ன குறிப்பிட்ட உரையைச் சுட்டுகிறது.
