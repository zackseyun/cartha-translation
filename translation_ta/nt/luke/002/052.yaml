revisions:
- from: இயேசு ஞானத்திலும் உடல் வளர்ச்சியிலும்[a] தொடர்ந்து முன்னேறினார்; கடவுளிடமும் மக்களிடமும்[b] மேன்மேலும் நன்மதிப்பைப் பெற்றார்.
  to: இயேசு ஞானத்திலும் உடல் வளர்ச்சியிலும்[a], கடவுளிடமும் மக்களிடமும்[b] நன்மதிப்பிலும் தொடர்ந்து வளர்ந்து வந்தார்.
  rationale: The revision preserves the straightforward statement of Jesus’ real, continuing human development while reflecting the Greek coordination more closely with one ongoing Tamil verbal expression. The ἡλικία note retains the relevant lexical ambiguity without adding an overly interpretive alternative.
