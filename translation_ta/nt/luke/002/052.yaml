id: LUK.2.52
reference: Luke 2:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: ta
  text: இயேசு ஞானத்திலும் உடல் வளர்ச்சியிலும்[a], கடவுளிடமும் மக்களிடமும்[b] நன்மதிப்பிலும் தொடர்ந்து வளர்ந்து வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடல் வளர்ச்சி” என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் “வயது” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மக்கள்” என்பதற்கான கிரேக்கச் சொல் பொதுவாக மனிதர்களைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: προέκοπτεν
  choice: தொடர்ந்து முன்னேறினார் / மேன்மேலும் … பெற்றார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை, காலப்போக்கில் தொடர்ந்த முன்னேற்றத்தைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க, அதன் பொருள் இணையான இரு கூறுகளிலும் பகிர்ந்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: σοφίᾳ
  choice: ஞானத்திலும்
  rationale: புரிந்துகொள்ளுதல், பகுத்தறிதல் ஆகியவற்றை உள்ளடக்கும் σοφία என்பதற்கான இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: ἡλικίᾳ
  choice: உடல் வளர்ச்சியிலும்
  rationale: ἡλικία என்பது வயதையோ உடல் உயரம்/வளர்ச்சியையோ குறிக்கலாம். இங்கு இயேசுவின் காணக்கூடிய மனித வளர்ச்சியை இயல்பாகச் சொல்வதற்காக ‘உடல் வளர்ச்சி’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மூலத்தின் பொருள் மயக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: χάριτι
  choice: நன்மதிப்பைப் பெற்றார்
  rationale: கடவுளிடமும் மக்களிடமும் என்ற உறவுச் சூழலில் χάρις என்பது அருள் என்ற கோட்பாட்டுச் சொல்லைவிட தயவு, அங்கீகாரம், நன்மதிப்பு ஆகிய பொருளைக் கொண்டுள்ளது. ‘நன்மதிப்பு’ நவீன தமிழில் இந்த உறவுசார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: παρὰ θεῷ
  choice: கடவுளிடம்
  rationale: παρά + dative இங்கு ஒருவருடனான உறவில் அல்லது அவருடைய பார்வையில் என்பதைக் குறிக்கிறது; ‘கடவுளிடம்’ என்பது தமிழில் இயல்பான இணை.
- source_word: ἀνθρώποις
  choice: மக்களிடம்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது. ‘மக்கள்’ இந்தப் பொதுப்பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் உண்மையான மனித வளர்ச்சியும் அதனால் எழும் கிறிஸ்தியல் இறுக்கமும்
  choice: இயேசு ஞானம், உடல் வளர்ச்சி, கடவுளிடமும் மக்களிடமும் பெற்ற நன்மதிப்பு ஆகியவற்றில் உண்மையாகவும் தொடர்ந்து முன்னேறினார் என்று வசனம் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இயேசுவின் வளர்ச்சியைத் தணித்தோ மறைத்தோ மொழிபெயர்த்து இறையியல் இறுக்கத்தைத் தவிர்ப்பது.
  rationale: கிரேக்க உரை இயேசு முன்னேறியதாகத் தெளிவாகக் கூறுகிறது. அவருடைய உண்மையான மனிதத்தன்மையைப் பற்றிய இந்தக் கூற்றை விளக்கித் தீர்க்காமலும் மென்மைப்படுத்தாமலும் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் ஒரே தொடர்வினை, தமிழில் இயல்பாக ஒலிக்க ‘தொடர்ந்து முன்னேறினார்’ மற்றும் ‘மேன்மேலும் நன்மதிப்பைப் பெற்றார்’ என இரு இணையான வினைத்தொடர்களாக வெளிப்படுத்தப்பட்டுள்ளது.
