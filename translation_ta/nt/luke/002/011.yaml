id: LUK.2.11
reference: Luke 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: ta
  text: ஏனெனில், இன்று தாவீதின் நகரத்தில் உங்களுக்காக ஒரு மீட்பர் பிறந்தார்; அவரே மெசியாவாகிய ஆண்டவர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “கிறிஸ்துவாகிய ஆண்டவர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் χριστὸς κύριος என்பதன் நேரடிப் பொருள் “மெசியா ஆண்டவர்”; பொதுவாக இது “மெசியாவாகிய ஆண்டவர்” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் அறிவிக்கப்பட்ட பெருமகிழ்ச்சிக்கான காரணத்தையும் உள்ளடக்கத்தையும் அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐτέχθη
  choice: பிறந்திருக்கிறார்
  rationale: நிகழ்ந்த பிறப்பைத் தற்போதைய நற்செய்தி அறிவிப்பாக இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்க இறந்தகால நிகழ்வின் வலிமையை மாற்றுவதில்லை.
- source_word: ὑμῖν
  choice: உங்களுக்காக
  rationale: வெறும் ‘உங்களிடம்’ என்பதைக் காட்டிலும், இந்தப் பிறப்பு கேட்போரின் நன்மைக்கானது என்ற பயனுறு வேற்றுமைப் பொருளை எடுத்துரைக்கிறது.
- source_word: σήμερον
  choice: இன்று
  rationale: நவீனத் தமிழில் நேரடியான காலக் குறிப்பு.
- source_word: σωτὴρ
  choice: மீட்பர்
  rationale: விடுவித்துக் காப்பவர் என்ற பொருளையும் இச்சூழலின் அரச-இறையியல் முக்கியத்துவத்தையும் இயல்பாகத் தருகிறது.
- source_word: ὅς ἐστιν
  choice: அவரே
  rationale: முன்னர் குறிப்பிடப்பட்ட மீட்பரைத் தொடர்ந்து வரும் இரு பட்டங்களால் அடையாளப்படுத்தும் கிரேக்க உறவுத்தொடரைச் சுருக்கமாகவும் வலியுறுத்தலுடனும் தருகிறது.
- source_word: χριστὸς
  choice: மெசியா
  rationale: இங்கு இது தனிப்பெயராக அல்லாமல் தாவீதுக்குரிய எதிர்பார்ப்புடன் தொடர்புடைய பட்டமாகச் செயல்படுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: அதிகாரத்தையும் வலுவான இறையியல் நிறையையும் காக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἐν πόλει Δαυίδ
  choice: தாவீதின் நகரத்தில்
  rationale: கிரேக்கச் சொற்றொடரை இயல்பாக வழங்கி, பெத்லகேமையும் தாவீதின் அரச மரபையும் சுட்டும் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: χριστὸς κύριος என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய ஆண்டவர்
  alternative: கிறிஸ்துவாகிய ஆண்டவர்; ஆண்டவரின் மெசியா
  rationale: கிரேக்கத்தில் ‘மெசியா’ மற்றும் ‘ஆண்டவர்’ என்ற இரு வேற்றுமையொத்த பட்டங்கள் மீட்பரை அடையாளப்படுத்துகின்றன. முதன்மைப் பாடம் இரண்டையும் நேரடியாகக் காக்கிறது. ‘ஆண்டவரின் மெசியா’ என்பது சாத்தியமான விளக்கவுரை என்றாலும், கிரேக்கத்தின் நேரடியான இணைப்பைவிட அதிகமாக உறவைத் தீர்மானிக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்த்தர்’ என்பதற்குப் பதிலாக இன்றைய பொதுத் தமிழில் இயல்பான ‘ஆண்டவர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘மெசியா’ பட்டமாகவே வைக்கப்பட்டுள்ளது.
