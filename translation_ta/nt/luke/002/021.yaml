  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: ta
  text: அவருக்கு விருத்தசேதனம் செய்ய எட்டு நாட்கள் நிறைவடைந்தபோது[a], அவருக்கு இயேசு என்று பெயரிட்டார்கள்[b]; கருப்பையில் அவர் கருத்தரிக்கப்படுவதற்கு முன்பே தேவதூதர் அறிவித்திருந்த பெயர் அதுவே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எட்டு நாட்கள் முடிந்தபோது.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அவருடைய பெயர் இயேசு என்று அழைக்கப்பட்டது.”'
    reason: lexical_alternative
  - marker: c
    text: அதாவது, அவர் மரியாவின் கருப்பையில் கருத்தரிக்கப்படுவதற்கு முன்பே.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: எட்டு நாட்கள் நிறைவடைந்தபோது
  rationale: கிரேக்கத்தின் நிறைவு குறிக்கும் இடைச்செயப்பாட்டு நயத்தைத் தக்கவைத்தபடியே இயல்பான நவீனத் தமிழில் காலக் குறிப்பைத் தருகிறது.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: அவருக்கு விருத்தசேதனம் செய்வதற்கான
  rationale: செயலின் நோக்கத்தையும் இயேசுவைக் குறிக்கும் சுட்டையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: அவருக்கு இயேசு என்று பெயரிட்டார்கள்
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘அவருடைய பெயர் இயேசு என்று அழைக்கப்பட்டது’ என்பதைவிட இயல்பான தமிழாகவும், கிரேக்கச் செயலற்ற வினையின் குறிப்பிடப்படாத செய்பவரைத் தீர்மானிக்காமல் பொதுப்பன்மை வடிவிலும் வழங்குகிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: புதிய ஏற்பாட்டுத் தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: தேவதூதர் சொல்லியிருந்த பெயர்
  rationale: பெயரைக் குறித்து தூதர் முன்பே அறிவித்ததை இயல்பாக வெளிப்படுத்துகிறது; ‘சூட்டிய பெயர்’ என்று கூறி தூதரையே பெயரிடும் செயலின் நேரடி செய்பவராக மிகைப்படுத்தவில்லை.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: அவர் கருப்பையில் கருத்தரிக்கப்படுவதற்கு முன்பே
  rationale: συλλαμβάνω என்பதன் இச்சூழலுக்குரிய ‘கருத்தரிக்கப்படுதல்’ பொருளையும் κοιλία என்பதன் ‘கருப்பை’ பொருளையும் தெளிவாகத் தருகிறது; மூலத்தில் இங்கு இல்லாத மரியாவின் பெயரை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் கருத்தரிப்பைப் பற்றிய இறுதிக் கூறு
  choice: அவர் கருப்பையில் கருத்தரிக்கப்படுவதற்கு முன்பே
  alternative: அவர் கருவில் உருவாவதற்கு முன்பே
  rationale: மனித கருத்தரிப்பு என்ற வரலாற்று நிகழ்வை கிரேக்கம் கூறும் அளவிலேயே வழங்குகிறது; பின்னாளைய கிறிஸ்தியல் சொற்களையோ விளக்கங்களையோ புகுத்தவில்லை.
- issue: பெயரை அறிவித்ததில் தேவதூதரின் பங்கு
  choice: தேவதூதர் சொல்லியிருந்த பெயர்
  alternative: தேவதூதர் சூட்டியிருந்த பெயர்
  rationale: κληθέν என்ற சொல்லின் பெயரிடுதல்/அழைத்தல் நயத்தை வைத்துக்கொண்டு, தேவதூதரின் அறிவிப்புக்கும் மனிதர்கள் பின்னர் பெயரிட்ட செயலுக்கும் இடையிலான வேறுபாட்டைத் தேவையின்றி அழிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது வேதாகமத் தமிழில் நிலைபெற்றுள்ள துல்லியமான சமய-பண்பாட்டுச் சொல்; இறுதிக் கூறு வாசிப்புத் தெளிவுக்காக தனி வாக்கியமாக அமைக்கப்பட்டுள்ளது.
