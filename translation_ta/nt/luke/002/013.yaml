  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: ta
  text: 'திடீரென்று அந்தத் தூதருடன் வானுலகப் படையின் பெருந்திரள் ஒன்று[a] தோன்றி, கடவுளைப் புகழ்ந்து கூறியது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானத்தின் படையின் பெருந்திரள்’ அல்லது ‘வானத்தின் படையைச் சேர்ந்த பெருந்திரள்.’
    reason: στρατιᾶς οὐρανίου என்பதன் ‘வானுலகப் படை / வானத்தின் படை’ என்ற மாற்று அமைப்புகளையும், πλῆθος என்ற கூட்டுப்பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἐξαίφνης
  choice: திடீரென்று
  rationale: நிகழ்வு எதிர்பாராதவிதமாக உடனே ஏற்பட்டதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐγένετο
  choice: இருந்தார்கள்
  rationale: இங்கு γίνομαι ஒரு பெருந்திரளின் திடீர் உடனிருப்பை அறிமுகப்படுத்தும் இருப்புநிலைக் கட்டமைப்பாக வருகிறது. ‘தோன்றினார்கள்’ என்று காட்சியளித்தலை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் பொதுவான பொருளைப் பேணுகிறது.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: அந்தத் தூதருடன்
  rationale: σύν குறிக்கும் உடனிருப்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; முன்பு குறிப்பிடப்பட்ட தூதர் என்பதால் ‘அந்தத்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πλῆθος
  choice: பெருந்திரளானோர்
  rationale: மிகப் பெரிய எண்ணிக்கையைச் சுட்டுகிறது. தொடர்ந்து வரும் பன்மை பங்கேற்புவினைகளுக்கும் ஆள்களைக் குறிக்கும் சூழலுக்கும் ஏற்றவாறு தமிழில் மனிதர் மரியாதைப் பன்மை வடிவில் தரப்பட்டுள்ளது.
- source_word: στρατιᾶς οὐρανίου
  choice: வானுலகப் படையின்
  rationale: στρατιά என்பதிலுள்ள படை சார்ந்த உருவகத்தையும் οὐράνιος என்பதிலுள்ள வானுலகத் தொடர்பையும் பேணுகிறது.
- source_word: αἰνούντων τὸν θεόν
  choice: அவர்கள் கடவுளைப் புகழ்ந்து
  rationale: பெருந்திரளில் உள்ளவர்களின் தொடர்ச்சியான செயலை இயல்பான தமிழில் தெரிவிக்கிறது; தெளிவுக்காக ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: καὶ λεγόντων
  choice: கூறினார்கள்
  rationale: அடுத்த வசனத்தில் வரும் புகழ்ச்சிச் சொற்களை அறிமுகப்படுத்துகிறது; தமிழில் முழுமையான, இயல்பான வாக்கிய அமைப்புக்காக finite verb பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: στρατιᾶς οὐρανίου என்பதன் மொழிபெயர்ப்பு
  choice: வானுலகப் படை
  alternative: வானத்தின் படை
  rationale: இந்தச் சொற்றொடர் ஒழுங்கமைந்த வானுலகக் கூட்டத்தையும் படை சார்ந்த நிழற்பொருளையும் கொண்டுள்ளது. இங்கு அவர்கள் போரிடாமல் கடவுளைப் புகழ்ந்தாலும், ‘படை’ என்ற மூல உருவகத்தை நீக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘வானுலகப் படை’ என்பது மூலத்தின் இராணுவ உருவகத்தைப் பேணுகிறது; ‘பெருந்திரளானோர்’ என்பது கிரேக்கப் பன்மை பங்கேற்புவினைகளின் ஆள்சுட்டும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
