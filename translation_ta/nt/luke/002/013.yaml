revisions:
- from: 'திடீரென்று அந்தத் தூதருடன் வானுலகப் படையின் பெருந்திரளானோர்[a] இருந்தார்கள்; அவர்கள் கடவுளைப் புகழ்ந்து கூறினார்கள்:'
  to: 'திடீரென்று அந்தத் தூதருடன் வானுலகப் படையின் பெருந்திரள் ஒன்று[a] தோன்றி, கடவுளைப் புகழ்ந்து கூறியது:'
  rationale: The revision replaces an unnatural plural-person rendering with a singular collective noun, matching πλῆθος. ‘தோன்றி’ is a natural Tamil narrative rendering of the sudden coming-to-be/presence expressed by ἐγένετο in this scene; it does not identify the manner of the appearance beyond the contextual event. The collective singular ‘பெருந்திரள்’ may naturally be followed by singular verbal forms in Tamil while retaining the sense of many heavenly beings.
