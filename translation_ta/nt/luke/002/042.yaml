translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இயேசுவைக் குறிக்கும் ஒருமைச் சுட்டுக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூல வசனம் அடுத்துவரும் உரையுடன் இலக்கணரீதியாகத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
