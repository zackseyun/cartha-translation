  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: ta
  text: அவருக்குப் பன்னிரண்டு வயதானபோது, பண்டிகையின்[b] வழக்கத்தின்படி அவர்கள் மேலே சென்றுகொண்டிருக்கையில்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலே சென்றபோது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயரெச்சம் நடந்துகொண்டிருந்த செயலைக் காட்டுவதால், மூல உரையின் தொடர்நிலையை முதன்மை உரை காக்கிறது.
