    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: அவருக்குப் பன்னிரண்டு வயதானபோது
  rationale: குறிப்பிட்ட வயதை அடைந்திருப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கிறது. ஒருமைச் சுட்டு முந்தைய சூழலில் இயேசுவைக் குறிக்கிறது.
- source_word: ἀναβαινόντων
  choice: மேலே சென்றுகொண்டிருக்கையில்
  rationale: எருசலேமுக்குச் செல்லும் ஏற்றத்தையும், முதன்மை நிகழ்வுடன் ஒரே நேரத்தில் நடந்துகொண்டிருந்த செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் தொடர்நிலையையும் காக்கிறது. இலக்கில் எருசலேம் என்பது முந்தைய வசனத்தால் தெளிவாக இருந்தாலும் இங்கே வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: αὐτῶν
  choice: அவர்கள்
  rationale: சூழலில் இயேசுவின் குடும்பத்தாரை, குறிப்பாக அவருடைய பெற்றோரைச் சுட்டும் பிரதிப்பெயரை மேலதிகமாகக் குறிப்பாக்காமல் காக்கிறது.
- source_word: κατὰ τὸ ἔθος
  choice: வழக்கத்தின்படி
  rationale: நிலையான நடைமுறைக்கு இணங்கச் செய்வது என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῆς ἑορτῆς
  choice: பண்டிகையின்
  rationale: சமயப் பண்டிகையைச் சுட்டுகிறது; முந்தைய வசனத்தில் இது பஸ்கா என அடையாளப்படுத்தப்பட்டுள்ளது.
- source_word: καὶ ὅτε
  choice: …வயதானபோது
  rationale: ὅτε-யின் காலத் தொடர்பை ‘போது’ மூலம் வெளிப்படுத்துகிறது. வசனம் தொடரும் வாக்கியத் துணுக்காக இருப்பதால் தொடக்க καί-க்கு தனியே ‘மேலும்’ என்று சேர்ப்பது தமிழில் இயல்பற்றதாக இருக்கும்; தொடர்ச்சி இறுதி காற்புள்ளியால் காக்கப்படுகிறது.
