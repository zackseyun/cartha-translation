source:
  edition: SBLGNT
  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: ta
  text: ஆனால், அவர் பயணக் கூட்டத்தில் இருப்பார் என்று எண்ணி, அவர்கள் ஒரு நாள் பயணம் செய்தார்கள். பிறகு தங்கள் உறவினர்களிடையிலும் தங்களுக்குத் தெரிந்தவர்களிடையிலும் அவரைத் தேடத் தொடங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேடிக்கொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் தேடுதல் தொடர்ந்து நடந்ததை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: இருப்பார் என்று எண்ணி
  rationale: மரியாவும் யோசேப்பும் இயேசு கூட்டத்தில் இருப்பதாகக் கொண்ட தற்காலிக ஊகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலிருந்து வரும் மென்மையான எதிர்மறைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: பயணக் கூட்டத்தினருடன் இருப்பார்
  rationale: συνοδία என்பது ஒன்றாகப் பயணம் செய்யும் கூட்டத்தைக் குறிக்கிறது; ‘பயணக் கூட்டம்’ நவீன வாசகருக்கு தெளிவானது.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: ஒரு நாள் பயணம் செய்தார்கள்
  rationale: ஒரு நாளுக்குரிய பயண நேரம் அல்லது தொலைவைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: ἀνεζήτουν
  choice: தேடத் தொடங்கினார்கள்
  rationale: இறந்தகாலத் தொடர்வினையின் தொடக்கத்தையும் நீடித்த தேடலையும் சூழலுக்கேற்றவாறு உணர்த்துகிறது; ‘தேடிக்கொண்டிருந்தார்கள்’ என்பதும் சாத்தியம்.
- source_word: συγγενεῦσιν
  choice: உறவினர்களிடையில்
  rationale: குடும்ப உறவுடையவர்களைப் பாலின வரையறையின்றி இயல்பாகக் குறிக்கிறது.
- source_word: γνωστοῖς
  choice: அறிமுகமானவர்களிடையில்
  rationale: நெருங்கிய நண்பர்கள் என்று கட்டுப்படுத்தாமல், அவர்களுக்குத் தெரிந்தவர்களைக் குறிக்கும் γνωστοῖς என்பதன் பரந்த பொருளைப் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘காரவன்’ போன்ற பண்பாட்டுச் சுமையுள்ள கடன்சொல்லுக்குப் பதிலாக ‘பயணக் கூட்டம்’ பயன்படுத்தப்பட்டது.
