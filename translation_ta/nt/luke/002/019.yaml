  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: ta
  text: ஆனால் மரியாள் இந்த வார்த்தைகளையெல்லாம் கவனமாகப் பாதுகாத்து வைத்துக்கொண்டிருந்தாள்; அவற்றைத் தன் உள்ளத்தில் ஒன்றோடொன்று தொடர்புபடுத்திச் சிந்தித்தாள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தக் காரியங்களையெல்லாம் கவனமாகப் பாதுகாத்து வைத்துக்கொண்டிருந்தாள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஒன்றோடொன்று தொடர்புபடுத்திச் சிந்தித்தாள்’ என்பது ‘ஒன்றோடொன்று ஒப்பிட்டுப் பார்த்தாள்’ அல்லது ‘ஆழ்ந்து சிந்தித்தாள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மற்றவர்கள் வெளிப்படுத்திய வியப்புக்கும் மரியாளின் உள்ளார்ந்த பதிலுக்கும் இடையிலான மென்மையான வேறுபாட்டைக் காட்டுகிறது.
- source_word: συνετήρει
  choice: பத்திரமாக வைத்துக்கொண்டு
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த செயலைக் காட்டுகிறது; வினைச்சொல் வெறுமனே நினைவில் வைத்திருப்பதைவிடக் கவனமாகப் பாதுகாத்து வைத்திருக்கும் பொருளையும் தருகிறது.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: இந்த வார்த்தைகளையெல்லாம்
  rationale: ῥήματα என்பது இச்சூழலில் மேய்ப்பர்கள் தெரிவித்த செய்தியையும் கூறப்பட்டவற்றையும் குறிக்கிறது; πάντα அதன் முழுமையைக் காட்டுகிறது.
- source_word: συμβάλλουσα
  choice: அவற்றை ஒன்றோடொன்று இணைத்துச் சிந்தித்துக்கொண்டிருந்தாள்
  rationale: இந்தப் பங்கேற்புவினை மனத்தில் பலவற்றை ஒன்றாகக் கொண்டுவந்து ஒப்பிட்டுச் சிந்திப்பதைக் குறிக்கலாம்; தமிழ் வாசகருக்கு அந்தப் படிமத்தையும் ஆழ்ந்த சிந்தனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: தன் உள்ளத்தில்
  rationale: சிந்தனை, நினைவு, உணர்வு ஆகியவற்றின் உள்மையைக் குறிக்கும் மூலமொழிப் படிமத்தை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: Μαρία
  choice: மரியாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் மரியாதைமிக்க பெயர் வடிவம்.
theological_decisions:
- issue: மரியாளின் பதிலின் இயல்பு
  choice: அவர் செய்தியை உள்ளத்தில் கவனமாகப் பாதுகாத்து, அதன் கூறுகளை இணைத்துச் சிந்தித்தார்.
  alternative: அவர் நிகழ்வுகளை வெறுமனே நினைவில் வைத்திருந்தார்; அல்லது அப்போதே அவற்றை முழுமையாகப் புரிந்துகொண்டார்.
  rationale: மூலவாக்கியம் கவனமான பாதுகாப்பையும் தொடர்ந்த சிந்தனையையும் காட்டுகிறது; ஆனால் முழுமையான புரிதலை உறுதிப்படுத்தவில்லை. எனவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘உள்ளம்’ என்ற சொல் மூலத்தின் ‘இதயம்’ படிமத்தைத் தமிழில் இயல்பாகத் தருகிறது. தொடர்நிலை வினைகள் συνετήρει என்பதன் நீடித்த தன்மையையும் συμβάλλουσα என்பதன் அதேகாலச் சிந்தனையையும் வெளிப்படுத்துகின்றன.
