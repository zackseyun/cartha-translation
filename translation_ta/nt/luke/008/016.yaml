  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ta
  text: யாரும் விளக்கை ஏற்றி, அதை ஒரு பாத்திரத்தால் மூடவோ கட்டிலின் கீழே வைக்கவோ மாட்டார்கள். மாறாக, உள்ளே வருகிறவர்கள் வெளிச்சத்தைக் காணும்படி அதை விளக்குத்தாங்கியின் மேல் வைப்பார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: விளக்கை
  rationale: முதல் நூற்றாண்டின் எண்ணெய் விளக்கைக் குறிக்கும் பொதுவான, இயல்பான தமிழ் சொல்.
- source_word: σκεύει
  choice: ஒரு பாத்திரத்தால்
  rationale: σκεῦος என்பது பலவகைப் பாத்திரம் அல்லது கொள்கலனைக் குறிக்கக்கூடும்; குறிப்பிட்ட வகையைச் சேர்க்காமல் மூலத்தின் பொதுத்தன்மையைப் பேணுகிறது.
- source_word: κλίνης
  choice: கட்டிலின்
  rationale: படுக்கவும் சாய்ந்திருக்கவும் பயன்படும் பொருளை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: λυχνίας
  choice: விளக்குத்தண்டின்மேல்
  rationale: விளக்கை உயரத்தில் வைக்கும் தாங்கியைத் தெளிவாகக் குறிக்கிறது; சாதாரண மேசை என்று மாற்றவில்லை.
- source_word: οἱ εἰσπορευόμενοι
  choice: உள்ளே வருகிறவர்கள்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான அல்லது பொதுவான கருத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: விளக்கும் வெளிச்சமும் உருவகமாக எதைக் குறிக்கின்றன என்பது
  choice: வசனத்தில் விளக்கம் சேர்க்காமல் உருவகத்தை அப்படியே வைத்தல்
  alternative: விளக்கை நற்செய்தி, சாட்சி அல்லது சீடர் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் உருவகத்தின் பொருளை நேரடியாக வரையறுக்கவில்லை; அதன் இறையியல் பதற்றத்தையும் சூழல் சார்ந்த திறந்த தன்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானவும் கண்ணியமானவும் உள்ள நடை. கிரேக்க δέ-ஐ செயற்கையான ‘இப்போது’ என மொழிபெயர்க்காமல், வாக்கியத்தின் எதிர்மறை–நேர்மறை மாறுபாட்டை ‘மாறாக’ என்பதால் வெளிப்படுத்தியது. பொதுவான ஒருமை எழுவாய்க்கு இயல்பான தமிழில் மரியாதை/பொதுநிலை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
