  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ta
  text: 'பேய்கள் அவனிடமிருந்து வெளியேறியிருந்த அந்த மனிதன், தம்முடன் இருக்கும்படி அவரிடம் மன்றாடிக்கொண்டிருந்தான். ஆனால் அவர் அவனை அனுப்பிவிட்டு, இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: மன்றாடிக்கொண்டிருந்தான்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் தொடர்ந்து அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட உருக்கமான வேண்டுதலைக் காட்டுகிறது; ‘மன்றாடிக்கொண்டிருந்தான்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἀνὴρ
  choice: அந்த மனிதன்
  rationale: முன்னரே குறிப்பிடப்பட்ட குறிப்பிட்ட ஆணைச் சுட்டுவதால், தமிழில் ‘அந்த மனிதன்’ இயல்பான குறிப்புநிலைத் தொடராக உள்ளது.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: பேய்கள் வெளியேறியிருந்த
  rationale: ἐξεληλύθει என்ற முற்றிறந்தகாலம், மன்றாடுவதற்கு முன்பே நிகழ்ந்து முடிந்த வெளியேற்றத்தைச் சுட்டுகிறது; ‘வெளியேறியிருந்த’ அந்த கால உறவைப் பாதுகாக்கிறது.
- source_word: τὰ δαιμόνια
  choice: பேய்கள்
  rationale: δαιμόνια என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்; உரையின் இயற்கைக்கு அப்பாற்பட்ட தனிப்பட்ட தீய ஆவிகளைக் குறிக்கும் கருத்தை மங்கச் செய்யாது.
- source_word: εἶναι σὺν αὐτῷ
  choice: தம்முடன் இருக்க அனுமதிக்குமாறு
  rationale: ‘அவருடன் இருக்க’ என்பதே அடிப்படை பொருள். வேண்டுதல் வினையுடன் இயல்பான தமிழாக்கத்திற்காக ‘அனுமதிக்குமாறு’ சேர்க்கப்பட்டுள்ளது; இது சூழலில் உள்ள வேண்டுகோளின் உட்பொருளை மட்டுமே வெளிப்படுத்துகிறது.
- source_word: ἀπέλυσεν αὐτὸν
  choice: அவனை அனுப்பிவிட்டு
  rationale: இங்கு கோரிக்கையை ஏற்காமல் வேறிடத்திற்குச் செல்லச் செய்வதே பொருள்; ‘அனுப்பிவிட்டு’ கதைநடையில் இயல்பாக உள்ளது.
- source_word: λέγων
  choice: இவ்வாறு கூறினார்
  rationale: அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்தும் நிகழ்காலப் பெயரெச்சத்தை, தமிழில் இயல்பான மேற்கோள் அறிமுகமாக வழங்குகிறது.
theological_decisions:
- issue: பிசாசு நீக்குதல் பற்றிய சூழலில் δαιμόνια என்பதன் மொழிபெயர்ப்பு
  choice: பேய்கள்
  alternative: தீய ஆவிகள்
  rationale: மூல உரை மனிதனிடமிருந்து வெளியேறிய தனிப்பட்ட இயற்கைக்கு அப்பாற்பட்ட சக்திகளை முன்வைக்கிறது. ‘பேய்கள்’ அதை நேரடியாகப் பாதுகாக்கிறது; ‘தீய ஆவிகள்’ என்பது சாத்தியமான மாற்று என்றாலும் சற்றுப் பொதுவானது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதைப் பன்மை (‘தம்முடன்’, ‘அவர்’) பயன்படுத்தப்பட்டுள்ளது. கிரேக்க δέ-யின் இணைப்பு/மாறுபாட்டு வலிமை ‘ஆனால்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத காலச்சுட்டான ‘இப்போது’ சேர்க்கப்படவில்லை.
