  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: ta
  text: அந்த நாட்களில் ஒரு நாள், அவர் தமது சீடர்களுடன் ஒரு படகில் ஏறினார். அவர்களிடம், “ஏரியின் மறுகரைக்குப் போவோம்”[a] என்றார். பின்பு அவர்கள் புறப்பட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏரியைக் கடந்து அக்கரைக்குப் போவோம்.”
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள கிரேக்க வினைச்சொல்லை “படகில் புறப்பட்டார்கள்” அல்லது “படகுப் பயணத்தைத் தொடங்கினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: அந்த நாட்களில் ஒரு நாள்
  rationale: லூக்கா பயன்படுத்தும் நிகழ்வை அறிமுகப்படுத்தும் தொடரைத் தமிழில் இயல்பான கதைநடை அமைப்பில் வெளிப்படுத்துகிறது; தனியாக ‘நடந்தது’ என்று மொழிபெயர்த்து செயற்கையான வாக்கியம் உருவாக்கப்படவில்லை.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: அந்த நாட்களில் ஒரு நாள்
  rationale: குறிப்பிட்ட ஒரு காலப்பகுதிக்குள் எந்த நாள் என்று வரையறுக்கப்படாத ஒரு நாளைக் குறிக்கும் பகுதியுரிமைப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: அவர் தமது சீடர்களுடன் ஒரு படகில் ஏறினார்
  rationale: இயேசுவும் அவருடைய சீடர்களும் படகில் ஏறியதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; αὐτός என்பதற்கு இங்கு தேவையற்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: εἶπεν πρὸς αὐτούς
  choice: அவர்களிடம் … என்றார்
  rationale: λέγω + πρός என்பதன் நேரடியான உரையாடல் பொருளை நவீனத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் தருகிறது.
- source_word: Διέλθωμεν
  choice: போவோம்
  rationale: முதல் நபர் பன்மைத் தூண்டல் பொருளை இயல்பாகக் காக்கிறது; இலக்கான ‘மறுகரை’ திசைநகர்வைத் தெளிவாக்குவதால் வினையில் மீண்டும் ‘கடந்து’ என்று கூறுவது கட்டாயமல்ல.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: ஏரியின் மறுகரைக்கு
  rationale: τὸ πέραν என்பதன் ‘மற்ற/எதிர் பக்கம்’ என்ற பொருளையும் λίμνη என்பதன் குறிப்பான ‘ஏரி’ என்ற பொருளையும் காக்கிறது.
- source_word: ἀνήχθησαν
  choice: அவர்கள் புறப்பட்டார்கள்
  rationale: கடற்பயணச் சூழலில் ‘படகைச் செலுத்திப் புறப்படுதல்’ என்ற வினையின் பொருளைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது; நீர்நிலை ஏரி என்பதால் ‘கடலுக்குப் புறப்பட்டார்கள்’ என்று தவறாகக் குறிப்பிடவில்லை.
