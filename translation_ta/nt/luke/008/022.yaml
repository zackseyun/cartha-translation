  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் பொருளுடன் பொருந்தாத இடங்களில் இருந்ததால், [a] கடந்து செல்வதற்கான மாற்று மொழிபெயர்ப்பின் பின்னரும் [b] ἀνήχθησαν என்பதன் பின்னரும் பொருத்தப்பட்டுள்ளன.
