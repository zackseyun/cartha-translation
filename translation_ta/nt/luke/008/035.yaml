id: LUK.8.35
reference: Luke 8:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: ta
  text: பின்பு, என்ன நடந்தது என்பதைப் பார்க்க மக்கள் வெளியே புறப்பட்டு, இயேசுவிடம் வந்தார்கள். பேய்கள் அவனைவிட்டு வெளியேறிய[a] அந்த மனிதன் உடை அணிந்தவனாகவும் தெளிந்த மனநிலையுடனும் இயேசுவின் காலடியில் உட்கார்ந்திருப்பதைக் கண்டார்கள்; அப்போது அவர்கள் பயந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘பேய்கள் வெளியேறின’ என்று பன்மை வினை உள்ளது. இங்கு பின்பற்றப்பட்டுள்ள அச்சுப் பதிப்பில் பன்மை எழுவாயுடன் ஒருமை வினை காணப்படுகிறது; பொருள் மாறுவதில்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν
  choice: பின்பு, ... பார்க்க மக்கள் வெளியே புறப்பட்டு
  rationale: இறந்தகால வினையும் நோக்கத்தைக் குறிக்கும் வினையெச்சமும் இயல்பான தமிழ் கதைநடையில் தரப்படுகின்றன. கிரேக்கத்தில் மறைந்திருக்கும் எழுவாய் சூழலிலிருந்து ‘மக்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὸ γεγονός
  choice: என்ன நடந்தது என்பதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் perfect participle, ஏற்கெனவே நிகழ்ந்த சம்பவத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: பேய்கள் வெளியேறிய அந்த மனிதன்
  rationale: அந்த மனிதனை அடையாளப்படுத்தும் உறவுத்தொடர் தமிழின் இயல்பான வரிசையில் அமைக்கப்பட்டுள்ளது; δαιμόνια என்பதன் தனிப்பட்ட அமானுஷ்யக் குறிப்பை ‘பேய்கள்’ காக்கிறது.
- source_word: ἱματισμένον
  choice: உடை அணிந்தவனாகவும்
  rationale: முந்தைய நிர்வாண நிலையுடன் உள்ள எதிர்மறை ஒப்புமையையும் இப்போது காணப்படும் மீட்கப்பட்ட நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: σωφρονοῦντα
  choice: தெளிந்த புத்தியுள்ளவனாகவும்
  rationale: மனத்தெளிவு, நிதானம், தன்னடக்கம் ஆகிய பொருள் வளத்தை மருத்துவச் சொற்பயன்பாட்டுக்குள் சுருக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: இயேசுவின் காலடியில்
  rationale: இயேசுவின் அருகில், அவருடைய காலடியில் அமர்ந்திருந்த நிலையை இயல்பாகக் குறிக்கிறது; சீடத்துவப் பொருளை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἐφοβήθησαν
  choice: அவர்கள் பயந்தார்கள்
  rationale: கூட்டத்தின் எதிர்வினையை நேரடியாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: δαιμόνια என்பதைக் குறிக்கும் சொல்
  choice: பேய்கள்
  alternative: தீய ஆவிகள்
  rationale: மூலச்சொல்லின் நேரடியான அமானுஷ்ய, தனிப்பட்ட செயற்பாட்டைக் காக்கிறது; நிகழ்வை வெறும் நோய் அல்லது உருவகமாக மாற்றவில்லை.
- issue: σωφρονοῦντα என்பதின் மீட்பு சார்ந்த நுணுக்கம்
  choice: தெளிந்த புத்தியுள்ளவனாக
  alternative: சுயநினைவுடன் / நிதானமான மனநிலையில்
  rationale: பேய்களின் ஒடுக்குதலுக்குப் பின் ஏற்பட்ட மனத்தெளிவையும் தன்னடக்கத்தையும் தெரிவிக்கிறது; நவீன மருத்துவ நோயறிதலை உரையில் இறக்குமதி செய்யவில்லை.
- issue: இயேசுவின் காலடியில் அமர்ந்திருப்பதன் சாத்தியமான பொருள்
  choice: இயேசுவின் காலடியில்
  alternative: இயேசுவின் பாதங்களுக்கு அருகில்
  rationale: உடல்நிலையை நேரடியாகக் காக்கிறது; பணிவு அல்லது சீடத்துவம் என்ற சாத்தியமான உட்பொருளை வாசகர் உணர இடமளிக்கிறது, ஆனால் அதைத் தீர்மானமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ஆங்கில ஆலோசனை உரையின் ‘what had happened’ குறியீட்டில் கொடுக்கப்பட்டிருந்த ‘of sound mind’ குறிப்பு அதனுடன் பொருந்தாததால் சேர்க்கப்படவில்லை; உண்மையான உரைவேறுபாடு மட்டும் [a] ஆகக் குறிக்கப்பட்டது.
