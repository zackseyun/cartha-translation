    rationale: Although understandable in context, ‘பேய்கள் அவனைவிட்டு வெளியேறிய மனிதன்’ explicitly preserves the source relation and avoids even a momentary syntactic ambiguity.
  - severity: low
    issue: The textual-variant footnote marker is placed at the end of the verse rather than at the verb/clause to which it pertains.
    rationale: Moving the marker immediately after ‘வெளியேறிய’ gives the reader a clear and accurate anchor.
