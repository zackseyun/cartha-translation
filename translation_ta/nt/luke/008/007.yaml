source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: ta
  text: வேறொரு விதை முட்செடிகளின் நடுவில்[a] விழுந்தது. அதனுடன் சேர்ந்து வளர்ந்த முட்செடிகள் அதை நெரித்துவிட்டன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்செடிகளுக்கு மத்தியில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முட்செடிகள் அதனுடன் சேர்ந்து வளர்ந்து, அதை நெரித்துவிட்டன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: வேறொரு விதை
  rationale: இது பால் அற்ற ஒருமை உரிச்சொல் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட வடிவம். முந்தைய வசனங்களின் சூழலில் குறிக்கப்படுவது விதை என்பதால், தமிழில் பொருள் தெளிவாக இருக்க ‘விதை’ சேர்க்கப்பட்டது.
- source_word: ἔπεσεν
  choice: விழுந்தது
  rationale: πίπτω என்ற வினையின் இறந்தகால நிகழ்வை எளிமையாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: முட்செடிகளின் நடுவில்
  rationale: முட்களுள்ள செடிகளின் மத்தியில் விதை விழுந்தது என்ற இடம்சார்ந்த பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: முட்செடிகள்
  rationale: ἄκανθα என்பது வெறும் முட்களை மட்டுமல்ல, முட்களுள்ள செடிகளையும் குறிக்கலாம். வேளாண் உவமையில் இயல்பாகப் புரிய ‘முட்செடிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: συμφυεῖσαι
  choice: அதனுடன் சேர்ந்து வளர்ந்த
  rationale: விதையுடன் ஒரே காலத்தில் அருகருகே வளர்ந்தன என்ற συμφύομαι என்பதன் கூட்டு வளர்ச்சி உணர்வைக் காக்கிறது.
- source_word: ἀπέπνιξαν
  choice: நெரித்துவிட்டன
  rationale: ἀποπνίγω என்பதிலுள்ள மூச்சுத்திணறச் செய்தல் அல்லது வளர முடியாதபடி நெரித்தல் என்ற உருவகத்தை, செடிகளைப் பற்றிய இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: αὐτό
  choice: அதை
  rationale: முன்பு மறைமுகமாகக் குறிப்பிடப்பட்டு தமிழில் வெளிப்படையாகச் சேர்க்கப்பட்ட ‘விதை’யையே இந்த ஒருமைப் பெயர்ப்பதிலி குறிக்கிறது.
