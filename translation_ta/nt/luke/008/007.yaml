translation_notes:
  register: எளிதில் புரியும் நவீன நிலையான தமிழும், உவமைக்கேற்ற கண்ணியமான நடையும் பயன்படுத்தப்பட்டுள்ளன. ‘நெரித்துவிட்டன’ என்பது மூலத்தின் மூச்சுத்திணறச் செய்யும் உருவகத்தைத் தக்கவைத்தபடி, முட்செடிகள் பயிரை வளர விடாமல் ஒடுக்குவதை இயல்பாகச் சொல்கிறது.
