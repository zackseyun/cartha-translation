  text: And they were laughing at him, because they knew that she had died.
translation:
  language: ta
  text: அவள் இறந்துவிட்டாள் என்று அவர்கள் அறிந்திருந்ததால், அவர்கள் அவரை ஏளனம் செய்து சிரித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: ஏளனமாகச் சிரித்துக்கொண்டிருந்தார்கள்
  rationale: வினையின் இகழ்ச்சிப் பொருளையும், முற்றுப்பெறாமல் தொடர்ந்த செயலைக் காட்டும் imperfect காலத்தின் இயல்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ
  choice: அவரைப் பார்த்து
  rationale: καταγελάω என்பதன் ஏளனத்துக்குள்ளான நபரைக் குறிக்கும் சார்புப்பெயரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இயேசுவுக்குரிய மரியாதைப் பன்மையும் காக்கப்படுகிறது.
- source_word: εἰδότες
  choice: அவர்கள் அறிந்திருந்ததால்
  rationale: இறந்துவிட்டாள் என்ற அறிவே அவர்களுடைய ஏளனச் சிரிப்புக்குக் காரணம் என்பதைப் பங்கேற்புவினையின் சூழல்சார் காரணப் பொருளுடன் தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அவர்கள் அறிந்திருந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாகத் தமிழில் இயல்பான தேர்வு.
- source_word: ἀπέθανεν
  choice: இறந்துவிட்டாள்
  rationale: இறப்பு நிகழ்ந்து முடிந்திருந்ததை அஓரிஸ்ட் வினையின் நிறைவுற்ற நிகழ்வுப் பொருளோடு தெரிவிக்கிறது; சூழலிலிருந்து பெண்பால் குறிப்பு தெளிவாகிறது.
theological_decisions:
- issue: கிரேக்கத்தில் வெளிப்படையான பெயர்ச்சொல் இல்லாத இடத்தில் இறந்தவர் யார் என்பதை எவ்வாறு குறிப்பிடுவது
  choice: அவள் இறந்துவிட்டாள்
  alternative: சிறுமி இறந்துவிட்டாள் / குழந்தை இறந்துவிட்டது
  rationale: மூலத்தில் பெயர்ச்சொல் சேர்க்கப்படவில்லை; முந்தைய சூழலில் பெண்பால் குறிப்பு தெளிவாக இருப்பதால், ‘அவள்’ என்று மட்டும் கூறுவது மூலத்தின் சுருக்கத்தையும் இயல்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. தொடர்ச்சியான ஏளனச் செயலை ‘சிரித்துக்கொண்டிருந்தார்கள்’ என்றும் அதன் இகழ்ச்சித் தன்மையை ‘ஏளனமாக’ என்றும் வெளிப்படுத்தப்பட்டுள்ளது.
