source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: ta
  text: அனைவரும் அவளுக்காக அழுது புலம்பிக்கொண்டிருந்தார்கள். ஆனால் அவர், “அழாதீர்கள்; ஏனெனில், அவள் இறந்துவிடவில்லை; மாறாக, தூங்கிக்கொண்டிருக்கிறாள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூங்குகிறாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: அழுது கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடந்த செயலைக் குறிக்கும் இறந்தகால வினை வடிவத்தின் நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: புலம்பியவர்களின் முழுமையான பரப்பைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐκόπτοντο αὐτήν
  choice: அவளுக்காக ... புலம்பிக்கொண்டிருந்தார்கள்
  rationale: துக்கச் சூழலில் இச்சொல் மாரடித்தல் போன்ற உடல் வெளிப்பாட்டையும் உட்கொள்ளக்கூடிய புலம்பலைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாகச் சொல்லப்படாத உடல் செயலை மிகைப்படுத்தாமல் தமிழில் பொருளைத் தருகிறது.
- source_word: Μὴ κλαίετε
  choice: அழாதீர்கள்
  rationale: நடந்துகொண்டிருக்கும் அழுகையை நிறுத்துமாறு கூறும் பொருளைச் சூழல் உணர்த்தினாலும், விளக்கத்தைச் சேர்க்காமல் இயல்பான தடை வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: οὐ γὰρ
  choice: அழாதீர்கள்; அவள் ... இல்லை
  rationale: γάρ தரும் காரண விளக்க உறவு தமிழில் அரைப்புள்ளியைத் தொடர்ந்து வரும் வாக்கியத்தால் இயல்பாகத் தெளிவாகிறது; செயற்கையான ‘ஏனெனில்’ தேவையில்லை.
- source_word: ἀπέθανεν
  choice: இறந்துவிடவில்லை
  rationale: இறத்தல் நிகழ்ந்து தற்போதைய இறந்த நிலை ஏற்பட்டதாகக் கூறுவதை மறுக்கும் நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθεύδει
  choice: தூங்கிக்கொண்டிருக்கிறாள்
  rationale: நிகழ்காலத் தொடர்ச்சியையும் இயேசு பயன்படுத்தும் ‘தூக்கம்’ என்ற உருவகத்தையும் பெயரடை வடிவமாகத் தட்டையாக்காமல் காக்கிறது.
theological_decisions:
- issue: சிறுமி ‘இறந்துவிடவில்லை, தூங்கிக்கொண்டிருக்கிறாள்’ என்ற இயேசுவின் கூற்று
  choice: இயேசு கூறிய முரண்பாட்டுத் தோற்றமுள்ள சொற்களை அப்படியே காத்து, ‘தூங்கிக்கொண்டிருக்கிறாள்’ என்ற உருவகத்தை முதன்மை உரையில் வைத்தல்.
  alternative: ‘அவள் நிரந்தரமாக இறக்கவில்லை’ அல்லது ‘உண்மையில் தூங்குகிறாள்’ என்று விளக்கித் தீர்த்தல்.
  rationale: மூல உரை சிறுமியின் நிலையை இயேசு தனித்த முறையில் விவரிக்கும் தெய்வவியல் பதற்றத்தைத் தக்கவைக்கிறது. பின்னர் நிகழவிருக்கும் மீட்டெழுப்புதலை மனதில் கொண்டு ‘தூக்கம்’ உருவகமாக அமையலாம்; ஆனால் முதன்மை உரை அதைப் பொருள் தீர்மானித்து விரிவாக்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அழுது புலம்பிக்கொண்டிருந்தார்கள்’ என்பது இரண்டு இணை வினைகளையும் நீடித்த செயலையும் காக்கிறது; ‘மாரடித்தார்கள்’ என்று கூறி மூலத்தை மிகுதியாகக் குறிப்பாக்கவில்லை.
