id: LUK.8.54
reference: Luke 8:54
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: ta
  text: அவரோ அவளுடைய கையைப் பிடித்து, “குழந்தையே[a], எழுந்திரு” என்று உரக்கக் கூப்பிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறுமியே, எழுந்திரு.” παῖς என்ற கிரேக்கச் சொல் “குழந்தை” என்றும், இச்சூழலில் “சிறுமி” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: அவரோ
  rationale: δέ குறிக்கும் மென்மையான எதிர்நிலையையும் கதைத் திருப்பத்தையும் ‘அவரோ’ இயல்பாக வெளிப்படுத்துகிறது; αὐτός தனியாக மிகைப்படுத்தப்படவில்லை.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: அவளுடைய கையைப் பிடித்து
  rationale: அவளுடைய கையை அவர் பற்றிக்கொண்ட உடல் செயல்பாட்டை இயல்பான நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἐφώνησεν λέγων
  choice: என்று உரக்கக் கூப்பிட்டார்
  rationale: φωνέω குறிக்கும் கேட்கக்கூடிய அழைப்பை ‘உரக்கக் கூப்பிட்டார்’ வெளிப்படுத்துகிறது; λέγων என்பதன் பணி நேர்கூற்றுடன் வரும் ‘என்று’ மூலம் இயல்பாக இணைக்கப்படுகிறது.
- source_word: Ἡ παῖς
  choice: குழந்தையே
  rationale: παῖς என்பது பொதுவாகக் ‘குழந்தை’ என்றும், இச்சூழலில் ‘சிறுமி’ என்றும் பொருள்படலாம். ‘குழந்தையே’ அதன் அன்பான அழைப்பையும் சொற்பொருள் அகலத்தையும் காக்கிறது.
- source_word: ἔγειρε
  choice: எழுந்திரு
  rationale: ἐγείρω என்பதன் நேரடியான கட்டளையை, பழமையான நடையின்றி இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசு யவீருவின் மகளை அழைக்கும் சொல்
  choice: குழந்தையே
  alternative: சிறுமியே
  rationale: παῖς பாலினப் பொதுப்பொருளில் ‘குழந்தை’ என்றும், சூழலின்படி ‘சிறுமி’ என்றும் அமையலாம். முதன்மை உரை அந்தச் சொல் தரும் உண்மையான பொருள் அகலத்தைக் காக்கிறது; அடிக்குறிப்பு சூழலுக்கேற்ற மாற்றைத் தருகிறது.
- issue: உயிர்த்தெழச் செய்யும் கட்டளையின் மொழிநடை
  choice: எழுந்திரு
  alternative: எழு
  rationale: கட்டளையை நேரடியாகவும் நவீனத் தமிழில் இயல்பாகவும் வைத்திருக்கிறது; அதற்கு தேவையற்ற சமயச் சிறப்புநடையைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேர்கூற்றின் இயல்புக்காக λέγων தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல் ‘என்று’ அமைப்பில் இணைக்கப்பட்டுள்ளது.
