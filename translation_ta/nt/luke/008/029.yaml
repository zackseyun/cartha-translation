id: LUK.8.29
reference: Luke 8:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: ta
  text: ஏனெனில், அந்த மனிதனைவிட்டு வெளியேறும்படி அசுத்த ஆவிக்கு அவர் கட்டளையிட்டிருந்தார். அது பலமுறை[a] அவனைப் பிடித்துக்கொண்டது; அவன் சங்கிலிகளாலும் கால் விலங்குகளாலும் கட்டப்பட்டு, காவலில் வைக்கப்பட்டிருந்தான்; அவன் கட்டுகளை முறித்துக்கொண்டு, அந்தப் பேயால் மக்கள் நடமாட்டமற்ற இடங்களுக்குள்[b] விரட்டப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீண்ட காலமாக’. கிரேக்கச் சொற்றொடர் நீண்ட கால அளவையும் குறிக்கலாம்; சூழல் மீண்டும் மீண்டும் நிகழ்ந்த சம்பவங்களையும் ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வனாந்தரங்களுக்குள்’. கிரேக்கத்தில் இது பன்மையில், சொற்பட ‘மக்கள் இல்லாத இடங்களுக்குள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: கட்டளையிட்டிருந்தார்
  rationale: விளக்கப் பின்னணியை அறிமுகப்படுத்தும் γάρ மற்றும் முன்பு தொடங்கிய கட்டளையின் சூழலைத் தமிழில் இயல்பாகக் காட்ட இறந்தகால முற்றுவினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: அசுத்த ஆவிக்கு
  rationale: புதிய ஏற்பாட்டின் வழக்கமான சொல்லாட்சியையும் தூய்மை–அசுத்தம் என்ற சொற்பொருள் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: அந்த மனிதனைவிட்டு வெளியேறும்படி
  rationale: ἀπό என்பதன் பிரிதல் பொருளையும் பேயோட்டும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: பலமுறை
  rationale: பன்மை வடிவமும் மீண்டும் மீண்டும் நிகழ்ந்த பிடித்தல் மற்றும் கட்டிவைத்தல் என்ற சூழலும் தொடர்ச்சியான நீண்ட காலத்தைவிட நிகழ்வுகளின் திரும்பத் திரும்ப நிகழ்தலை ஆதரிக்கின்றன; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: συνηρπάκει
  choice: பிடித்துக்கொண்டிருந்தது
  rationale: வன்மையாக ஆட்கொள்ளும் கருத்தைத் தருவதோடு, பின்னணி மற்றும் தொடர்ச்சித் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐδεσμεύετο
  choice: கட்டப்பட்டுக் ... வைக்கப்பட்டிருந்தாலும்
  rationale: மீண்டும் மீண்டும் கட்டுப்படுத்தப்பட்ட நிலையைத் தமிழில் காட்டுகிறது; சூழலில் உள்ள எதிர்மறை விளைவு ‘இருந்தாலும்’ மூலம் தெளிவாகிறது.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: சங்கிலிகளாலும் கால் விலங்குகளாலும்
  rationale: இரு வேறுபட்ட கட்டுப்பாட்டு சாதனங்களையும் வேறுபடுத்துகிறது; πέδαις என்பதன் கால்களைப் பிணைக்கும் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: φυλασσόμενος
  choice: காவலில் வைக்கப்பட்டிருந்தாலும்
  rationale: கட்டப்பட்டிருந்த சூழ்நிலையையும் மனிதர்களின் கண்காணிப்பையும் சுருக்கமான இயல்பான தமிழில் இணைக்கிறது.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: கட்டுகளை முறித்துக்கொண்டு
  rationale: δεσμά என்பது சங்கிலிகளை மட்டும் அல்லாமல் பொதுவான பிணைப்புகளைக் குறிக்கக்கூடும்; διαρρήσσω என்பதன் வலிமையான முறித்தலைப் பாதுகாக்கிறது.
- source_word: ἠλαύνετο
  choice: விரட்டப்பட்டான்
  rationale: செயப்பாட்டு வடிவத்தையும் அவனது விருப்பத்திற்கு மாறான வலுக்கட்டாய நகர்வையும் வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοῦ δαιμονίου
  choice: அந்தப் பேயால்
  rationale: தனிப்பட்ட பேய்ச் செயற்பாட்டை மென்மைப்படுத்தாமலும் உளவியல் உருவகமாக மாற்றாமலும் நேரடியாகத் தருகிறது.
- source_word: εἰς τὰς ἐρήμους
  choice: மக்கள் நடமாட்டமற்ற இடங்களுக்குள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாத்து, குறிப்பிட்ட பாலைவன நிலப்பரப்பைத் தேவையின்றி ஊகிக்காமல் குடியிருப்பற்ற இடங்கள் என்ற பொருளை இயல்பாக அளிக்கிறது.
theological_decisions:
- issue: பேய்ச் சொற்களின் மொழிபெயர்ப்பு
  choice: ἀκάθαρτον πνεῦμα என்பதை ‘அசுத்த ஆவி’ என்றும் δαιμόνιον என்பதை ‘பேய்’ என்றும் நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தீய ஆவி’ அல்லது நோய்/மனநிலை குறிக்கும் மறைமுக மொழிபெயர்ப்பு
  rationale: கதை தனிப்பட்ட ஆவிக்குரிய செயற்பாட்டை முன்வைக்கிறது. உரையின் கருத்தை மென்மைப்படுத்தவோ வெறும் உளவியல் நிகழ்வாக மாற்றவோ கூடாது; அதேவேளை உரை கூறுவதைக் கடந்த கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
- issue: καί மற்றும் பங்கேற்பு அமைப்பில் உள்ள மறைமுக எதிர்மறைத் தொடர்பு
  choice: ‘காவலில் வைக்கப்பட்டிருந்தாலும், கட்டுகளை முறித்துக்கொண்டு’
  alternative: ‘காவலில் வைக்கப்பட்டிருந்தான்; கட்டுகளை முறித்துக்கொண்டு’
  rationale: கிரேக்கத்தில் வெளிப்படையாக ‘ஆனால்’ இல்லை; எனினும் கட்டுப்படுத்தும் முயற்சி பலனளிக்காத சூழல் தமிழில் தெளிவாகவும் இயல்பாகவும் அமைய ‘இருந்தாலும்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பில் மேலும் நேரடியான இணைப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘கால் விலங்குகள்’, ‘காவலில்’, ‘மக்கள் நடமாட்டமற்ற இடங்கள்’ போன்ற தெளிவான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மரியாதைமிக்க வேதாகம நடையைப் பேணியபடியே பழமையான அல்லது குழப்பமான சொற்கள் தவிர்க்கப்பட்டன.
