source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: ta
  text: ஏனெனில், வெளிப்படாதபடி மறைந்திருப்பது எதுவும் இல்லை; அறியப்படாமலும் வெளிச்சத்துக்கு வராமலும் இருக்கும் இரகசியம் எதுவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “வெளிப்படாமல் இருக்கும் மறைபொருள் எதுவும் இல்லை; அறியப்படாமலும் வெளியில் வராமலும் இருக்கும் இரகசியம் எதுவும் இல்லை.” ‘அறியப்படாமலும்’ என்பதிலுள்ள மறுப்பு வலிமையானது.'
    reason: οὐ μὴ γνωσθῇ என்பதன் வலுவான மறுப்பையும், εἰς φανερὸν ἔλθῃ என்பதன் பொதுவெளியில் வெளிப்படுதல் என்ற கருத்தையும் பொருள் மாற்றமின்றி விளக்குகிறது.
lexical_decisions:
- source_word: κρυπτὸν
  choice: மறைந்திருப்பது
  rationale: மறைக்கப்பட்ட அல்லது கண்ணுக்குப் புலப்படாத ஒன்றைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் எதிர்வரும் வெளிப்பாட்டுடன் தெளிவான முரணாகவும் உள்ளது.
- source_word: φανερὸν γενήσεται
  choice: வெளிப்படையாகாதபடி
  rationale: 'γίνομαι குறிக்கும் நிலைமாற்றத்தைத் தமிழின் எதிர்மறை சார்பு அமைப்புக்குள் இயல்பாக வெளிப்படுத்துகிறது: மறைந்திருப்பது இறுதியில் வெளிப்படையாகும்.'
- source_word: ἀπόκρυφον
  choice: இரகசியமாக இருப்பது
  rationale: முதல் உட்பிரிவின் ‘மறைந்திருப்பது’ என்பதிலிருந்து சிறு சொல்வேறுபாட்டைக் காத்து, நெருங்கிய இணைப்பொருளையும் பாதுகாக்கிறது.
- source_word: οὐ μὴ γνωσθῇ
  choice: அறியப்படாமலும்
  rationale: வலுவான கிரேக்க மறுப்பை, ‘அறியப்படாமல் நிலைத்துவிடாது’ என்ற பொருள் தரும் இரட்டை எதிர்மறைத் தமிழ் அமைப்பில் இயல்பாகக் கொண்டுவருகிறது.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: வெளிச்சத்துக்கு வராமலும்
  rationale: பொதுவெளியில் வெளிப்படுதலைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு தெளிவான, தற்போதைய தமிழ் இணை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தப்படுதல் குறித்த கூற்றின் வரம்பு
  choice: மறைந்ததும் இரகசியமானதும் வெளிப்படும் என்ற பொதுவான கோட்பாடாக மொழிபெயர்க்கப்பட்டது.
  alternative: இறுதி நியாயத்தீர்ப்பில் நிகழும் வெளிப்பாடு மட்டும், அல்லது இயேசுவின் போதனை வெளிப்படுவது மட்டும் எனக் குறிப்பாக்குதல்.
  rationale: வசனம் காலத்தையோ குறிப்பிட்ட பயன்பாட்டையோ வெளிப்படையாக வரையறுக்கவில்லை; ஆகவே அதன் பரந்த பொருளும் இறையியல் இழுபறியும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; dignified ஆனால் பொதுவாசகருக்கு எளிதான நடை. கிரேக்கத்தின் இரட்டை எதிர்மறை சார்பு அமைப்பு தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது. ‘இரகசியம்’ என்பதற்குப் பதிலாக வாக்கிய ஓட்டத்திற்காக ‘இரகசியமாக இருப்பது’ பயன்படுத்தப்பட்டது.
