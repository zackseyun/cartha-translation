id: LUK.8.24
reference: Luke 8:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: ta
  text: அவர்கள் அவரிடம் வந்து, “தலைவரே, தலைவரே, நாம் அழிந்துபோகிறோம்!” என்று சொல்லி அவரை எழுப்பினார்கள். அவர் விழித்தெழுந்து, காற்றையும் நீரின் கொந்தளிப்பையும்[a] அதட்டினார்; அவை அடங்கின, அமைதி ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீறியெழும் அலைகளையும்.”
    reason: κλύδωνι τοῦ ὕδατος என்பதற்கு நீரின் கொந்தளிப்பு அல்லது சீறியெழும் அலைகள் என்ற நெருங்கிய பொருள்கள் இருக்கலாம்.
lexical_decisions:
- source_word: προσελθόντες
  choice: அவர்கள் அவரிடம் வந்து
  rationale: இயேசுவை நோக்கி அவர்கள் சென்றதையும், அதைத் தொடர்ந்து அவரை எழுப்பியதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διήγειραν
  choice: அவரை எழுப்பினார்கள்
  rationale: தூக்கத்திலிருந்த ஒருவரை விழிக்கச் செய்வதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Ἐπιστάτα
  choice: தலைவரே
  rationale: லூக்கா பயன்படுத்தும் இந்த மரியாதைமிகு அழைப்பு, இயேசுவின் அதிகாரத்தை உணர்த்துகிறது. ‘ஆண்டவரே’ என்பது κύριος என்பதோடு வேறுபாட்டை மறைக்கக்கூடும்; ‘போதகரே’ என்பது கற்பிக்கும் பணிக்கு மட்டும் பொருளைக் குறுக்கக்கூடும்.
- source_word: ἀπολλύμεθα
  choice: நாம் அழிந்துபோகிறோம்
  rationale: உடனடியாக நேரவிருக்கும் உயிராபத்தையும், நிகழ்ந்துகொண்டிருக்கும் நிலையின் தீவிரத்தையும் தக்கவைக்கிறது.
- source_word: διεγερθεὶς
  choice: அவர் விழித்தெழுந்து
  rationale: அவர் தூக்கத்திலிருந்து விழித்ததை இயல்பாகச் சொல்கிறது; அவர் தாமாக விழித்தாரா அல்லது அவர்கள் எழுப்பியதால் விழித்தாரா என்பதை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: ἐπετίμησεν
  choice: அதட்டினார்
  rationale: காற்றையும் நீரின் கொந்தளிப்பையும் நோக்கி இயேசு அதிகாரத்துடன் கடிந்துகட்டளையிட்ட வலிமையைத் தக்கவைக்கிறது.
- source_word: ἀνέμῳ
  choice: காற்றை
  rationale: மூலச்சொல்லின் நேரடியான பொருளை மேலதிக விளக்கமின்றி வழங்குகிறது.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: நீரின் கொந்தளிப்பை
  rationale: κλύδων என்பதிலுள்ள பொங்கி எழும், அலைமோதும் நீரின் இயக்கத்தைத் தக்கவைத்து, அதை வெறுமனே ‘அலைகள்’ என்று சுருக்கவில்லை.
- source_word: ἐπαύσαντο
  choice: அவை அடங்கின
  rationale: பன்மை வினைச்சொல்லைத் தக்கவைத்து, காற்றும் நீரின் கொந்தளிப்பும் இரண்டும் அடங்கியதைக் காட்டுகிறது.
- source_word: ἐγένετο γαλήνη
  choice: அமைதி ஏற்பட்டது
  rationale: புயல் அடங்கியதன் விளைவாக அமைதியான நிலை வந்ததை இயல்பான நவீன தமிழில் கூறுகிறது.
theological_decisions:
- issue: Ἐπιστάτα என்ற இயேசுவுக்கான அழைப்புப் பட்டம்
  choice: தலைவரே
  alternative: ஆண்டவரே; போதகரே
  rationale: அதிகாரத்தை ஏற்றுக்கொள்ளும் மரியாதைமிகு அழைப்பாக இதை வழங்குகிறது; κύριος என்ற வேறு கிரேக்கப் பட்டத்தோடு இதை ஒன்றாக்கவோ, கற்பித்தல் என்ற ஒரே பணிக்குள் பொருளைக் குறுக்கவோ இல்லை.
- issue: படைப்பின்மீது இயேசுவின் அதிகாரத்தை ἐπετίμησεν வெளிப்படுத்தும் விதம்
  choice: அதட்டினார்
  alternative: கட்டளையிட்டார்; கடிந்துகொண்டார்
  rationale: காற்றையும் நீரையும் இயேசு நேரடியாகவும் அதிகாரத்துடனும் கட்டுப்படுத்துவதைத் தக்கவைக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தை வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் தொடர்ச்சியான செயல்கள் காக்கப்பட்டுள்ளன; கிரேக்கப் பன்மையைத் தக்கவைக்க ‘அவை அடங்கின’ பயன்படுத்தப்பட்டது. அடிக்குறி குறியீடு அது விளக்கும் ‘நீரின் கொந்தளிப்பு’ என்பதற்குப் பின்பே இடப்பட்டுள்ளது.
