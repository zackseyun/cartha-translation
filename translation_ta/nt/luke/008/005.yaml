  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: ta
  text: விதைப்பவர் தம் விதையை விதைக்கப் புறப்பட்டார். அவர் விதைத்துக்கொண்டிருந்தபோது, சில விதைகள் பாதையோரத்தில் விழுந்தன; அவை மிதிக்கப்பட்டன, வானத்துப் பறவைகள் அவற்றைத் தின்றுவிட்டன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: புறப்பட்டார்
  rationale: விதைப்பதற்காக வெளியே சென்றார் என்ற இயக்கத்தையும் நோக்கத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ σπείρων
  choice: விதைப்பவர்
  rationale: பெயர்ச்சியாகச் செயல்படும் participle-ஐ சுருக்கமாகவும் மரியாதையான பொதுப்பால் வடிவிலும் தருகிறது.
- source_word: τοῦ σπεῖραι
  choice: விதைக்க
  rationale: இயக்க வினையைத் தொடர்ந்து வரும் நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸν σπόρον αὐτοῦ
  choice: தம் விதையை
  rationale: αὐτοῦ என்பதைக் கருத்தில் கொண்டு உரிமையைப் பாதுகாக்கிறது; ஒருமைத் தொகுப்புப்பெயரான ‘விதை’ தமிழிலும் இயல்பாக உள்ளது.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: அவர் விதைத்துக்கொண்டிருந்தபோது
  rationale: விதைத்தல் தொடர்ந்துகொண்டிருந்த அதே நேரத்தில் அடுத்த நிகழ்வு நடந்தது என்ற காலத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ὃ μὲν
  choice: சில விதைகள்
  rationale: விதையின் ஒரு பகுதியைக் குறிக்கும் பகிர்வு பொருளைத் தமிழில் தெளிவாக்குகிறது; பின்னர் வரும் பன்மைச் சுட்டுகளுடனும் இயல்பாக இணைகிறது.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: பாதையோரத்தில் விழுந்தன
  rationale: παρά + accusative இங்குக் குறிக்கும் பாதைக்கு அருகிலான இடத்தை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: κατεπατήθη
  choice: மிதிக்கப்பட்டன
  rationale: செயப்பாட்டு வடிவத்தையும் காலடியில் நசுக்கப்பட்ட பொருளையும் கூடுதல் விளக்கமின்றித் துல்லியமாகத் தருகிறது.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: οὐρανός என்பதன் ‘வானம்’ என்ற காட்சிப்படிமத்தை இயல்பான தமிழ் இணைப்பில் பாதுகாக்கிறது.
- source_word: κατέφαγεν αὐτό
  choice: அவற்றைத் தின்றுவிட்டன
  rationale: முழுமையாகத் தின்று தீர்த்த தீவிரத்தை ‘-விட்டன’ என்ற நிறைவுக் கூறு இயல்பாக வெளிப்படுத்துகிறது.
