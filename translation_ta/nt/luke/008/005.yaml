translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தில் விதை ஒருமைத் தொகுப்புப்பெயராக இருந்தாலும், விழுந்த பகுதியையும் அதைச் சார்ந்த வினைகளையும் தமிழில் இயல்பாக்க ‘சில விதைகள்/அவை/அவற்றை’ என்ற பன்மை பயன்படுத்தப்பட்டது. பொருளில் பாலினம் முக்கியமல்லாததால் ‘விதைப்பவர்’ பயன்படுத்தப்பட்டது.
