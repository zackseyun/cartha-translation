source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: ta
  text: அவர் இன்னும் பேசிக்கொண்டிருக்கையில், தொழுகைக்கூடத் தலைவரிடமிருந்து ஒருவர் வந்து, “உங்கள் மகள் இறந்துவிட்டாள்; ஆசிரியரை இனிமேல் தொந்தரவு செய்யாதீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆசிரியருக்கு இனிமேல் சிரமம் கொடுக்காதீர்கள்.”
    reason: σκύλλε என்பதற்கு ‘தொந்தரவு செய்’ அல்லது ‘சிரமம் கொடு’ என மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் பேசிக்கொண்டிருக்கையில்
  rationale: முதன்மைச் செயல் நடந்துகொண்டிருந்த அதே நேரத்தில் பேச்சும் தொடர்ந்ததை இத்தொடர் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ἔτι என்பதன் ‘இன்னும்’ என்ற கால வலிமையும் காக்கப்படுகிறது.
- source_word: ἔρχεταί τις
  choice: ஒருவர் வந்து
  rationale: வரலாற்று நிகழ்காலமான ἔρχεται தமிழ்க் கதைநடையில் இறந்தகாலத் தொடர்புடன் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; τις குறிப்பிடப்படாத ஒருவரைக் குறிக்கிறது.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: தொழுகைக்கூடத் தலைவரிடமிருந்து
  rationale: παρά + உரிமை வேற்றுமை இங்கு வந்தவரின் மூலத்தைச் சுட்டுகிறது. ἀρχισυνάγωγος என்பது தொழுகைக்கூடத்தை வழிநடத்திய அதிகாரியைக் குறிக்கிறது; ‘தலைவர்’ தெளிவான, தற்போதைய தமிழ்ச் சொல்.
- source_word: Τέθνηκεν
  choice: இறந்துவிட்டாள்
  rationale: கிரேக்க நிறைவுக் காலம் மரணம் நிகழ்ந்ததையும் அதன் விளைவான தற்போதைய நிலையையும் உணர்த்துகிறது; ‘இறந்துவிட்டாள்’ இரண்டையும் இயல்பாகக் கொண்டுவருகிறது.
- source_word: ἡ θυγάτηρ σου
  choice: உங்கள் மகள்
  rationale: மகளை நேரடியாகக் குறிக்கிறது. தமிழில் சமூக நிலையுள்ள ஒருவரை மரியாதையுடன் ஒருமையில் அழைக்கும் இயல்புக்கேற்ப ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μηκέτι σκύλλε
  choice: இனிமேல் தொந்தரவு செய்யாதீர்கள்
  rationale: μηκέτι இனிமேல் தொடர வேண்டாமென்ற பொருளையும், σκύλλε தொந்தரவு அல்லது சிரமம் கொடுத்தலைத் தவிர்க்கும்படியான வேண்டுகோளையும் வெளிப்படுத்துகின்றன.
- source_word: τὸν διδάσκαλον
  choice: போதகரை
  rationale: διδάσκαλος என்பதன் கற்பிப்பவர் என்ற சாதாரண பட்டப் பொருளை, இச்சமயச் சூழலில் இயல்பாகவும் கிறிஸ்துவைப் பற்றிய கூடுதல் பட்டப் பொருளைச் சேர்க்காமலும் ‘போதகர்’ தெரிவிக்கிறது.
theological_decisions:
- issue: ἀρχισυνάγωγος என்ற பதவிப்பெயரின் மொழிபெயர்ப்பு
  choice: தொழுகைக்கூடத் தலைவர்
  alternative: தொழுகைக்கூட ஆட்சியாளர்
  rationale: இது சமயக் கோட்பாட்டுப் பட்டமல்ல, ஒரு நிறுவனப் பொறுப்பைக் குறிக்கும் சொல். ‘தலைவர்’ இன்றைய வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- issue: διδάσκαλος என்பதன் மொழிபெயர்ப்பு
  choice: போதகர்
  alternative: ஆசிரியர்
  rationale: இங்கு மூலமொழி இயேசுவை சாதாரணமாக ‘கற்பிப்பவர்’ என்று குறிப்பிடுகிறது. ‘போதகர்’ இந்தச் சூழலுக்கு இயல்பாக இருந்து, ‘ஆண்டவர்’ போன்ற உயர்த்தப்பட்ட கிறிஸ்தவப் பட்டத்தைத் தேவையின்றிச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில், எளிமையாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. யவீரின் சமூகப் பொறுப்பைக் கருத்தில் கொண்டு மரியாதைப் பன்மையான ‘உங்கள்/செய்யாதீர்கள்’ பயன்படுத்தப்பட்டுள்ளது; இது மூலத்தின் இரண்டாம் நபர் ஒருமையைப் பொருளில் மாற்றுவதில்லை.
