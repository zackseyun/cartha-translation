  source_fidelity: மூலக் கிரேக்கத்திற்கு உரை நன்றாக ஒத்திருக்கிறது. Θυγάτηρ என்பதற்கு “மகளே” நேரடியானதும் கனிவானதுமாக உள்ளது. σέσωκέν என்பதற்கான “மீட்டது” உடல் குணமடைதல் என்ற உடனடி சூழலையும் அதைவிடப் பரந்த காப்பு/மீட்பு நுணுக்கத்தையும் தேவையற்ற வகையில் குறுக்காமல் தக்கவைக்கிறது. πορεύου εἰς εἰρήνην என்பதும் “சமாதானத்துடன் போ” எனத் துல்லியமாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
