language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: ta
  text: ஆனால் அவர் அவளிடம், “மகளே, உன் விசுவாசம் உன்னை மீட்டது[a]; சமாதானத்துடன் போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைக் குணமாக்கியது” அல்லது “உன்னை நலமாக்கியது.” கிரேக்க வினைச்சொல் குணமாக்குவதையும் காப்பாற்றுவதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: மகளே
  rationale: நேரடி அழைப்புமுறையைத் தக்கவைத்து, இயேசுவின் கனிவும் உறவுசார் நெருக்கமும் இயல்பான தமிழில் வெளிப்படச் செய்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இந்தச் சூழலில் இயேசுவின்மீது அவள் வைத்த நம்பிக்கையைக் குறிக்கிறது; அதேவேளையில் சொல்லின் இறையியல் ஆழத்தையும் தக்கவைக்கிறது.
- source_word: σέσωκέν
  choice: மீட்டது
  rationale: σῴζω என்பதன் குணமாக்குதல், காப்பாற்றுதல், இரட்சித்தல் ஆகிய பரந்த பொருள் வாய்ப்புகளை முற்றிலும் உடல்நலக் குணமாக்குதலாக மட்டும் சுருக்காமல் தக்கவைக்கிறது. இங்கு நிறைவுற்ற செயல் தற்போது தொடரும் விளைவைக் கொண்டிருப்பதை தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πορεύου
  choice: போ
  rationale: கட்டளையின் எளிமையையும் நேரடித்தன்மையையும் நவீன தமிழில் இயல்பாகக் கொடுக்கிறது.
- source_word: εἰς εἰρήνην
  choice: சமாதானத்துடன்
  rationale: பிரிவுச் சொல்லாகவும் ஆசீர்வாதமாகவும் உள்ள கிரேக்கச் சொற்றொடரின் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பெண்ணின் பயத்திற்கும் இயேசுவின் ஆறுதலான பதிலுக்கும் இடையிலுள்ள மென்மையான மாறுபாட்டைக் காட்டுகிறது.
theological_decisions:
- issue: குணமாக்குதல் சூழலில் σῴζω என்பதன் பொருள் எல்லை
  choice: முதன்மை உரையில் “மீட்டது”
  alternative: “குணமாக்கியது” அல்லது “நலமாக்கியது”
  rationale: உடல் குணமாக்குதல் இச்சூழலில் தெளிவாக இருந்தாலும், கிரேக்க வினைச்சொல் அதைவிடப் பரந்த காப்பு அல்லது மீட்புப் பொருளையும் கொண்டிருக்கலாம். “மீட்டது” அந்த இறையியல் பதற்றத்தைத் தக்கவைக்கிறது; குறுகிய மருத்துவப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “மகளே” என்ற அழைப்பு கனிவைத் தக்கவைக்கிறது; “சமாதானத்துடன் போ” இயல்பான ஆசீர்வாதப் பிரிவுச் சொல்லாக அமைக்கப்பட்டுள்ளது.
