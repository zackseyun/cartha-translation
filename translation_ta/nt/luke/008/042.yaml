  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காரணத் தொடர்பு, பன்மை, தோராயமான வயது, தொடர்ந்து நடைபெற்ற மரண நிலை ஆகியவை பாதுகாக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
