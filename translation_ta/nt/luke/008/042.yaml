source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: ta
  text: ஏனெனில், அவருக்குச் சுமார் பன்னிரண்டு வயதுடைய ஒரே மகள்[a] இருந்தாள்; அவள் உயிரிழக்கும் நிலையில் இருந்தாள். அவர் போய்க்கொண்டிருக்கையில், மக்கள் கூட்டங்கள் அவரை நெருக்கிக்கொண்டிருந்தன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றே ஒன்றான மகள்.”
    reason: lexical_alternative
  - marker: b
    text: “நெருக்கிக்கொண்டிருந்தன” என்பதற்கான கிரேக்க வினைச்சொல், கூட்டம் அவரை மூச்சுத்திணறச் செய்யும் அளவுக்கு மிக நெருக்கமாக அழுத்தியதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: ஒரே மகள்
  rationale: θυγάτηρ என்பதுடன் இது அவரது ஒரே மகள் என்ற குடும்ப உறவுச் சார்ந்த பொருளைத் தருகிறது; பிறப்பித்தல் குறித்த தனிப்பொருளை இங்கு சுமத்தவில்லை.
- source_word: ὡς ἐτῶν δώδεκα
  choice: சுமார் பன்னிரண்டு வயதுடைய
  rationale: ὡς எண்ணுடன் வருவதால் தோராயத்தைக் குறிக்கிறது; தமிழில் இயல்பாக வயதைக் குறிப்பதற்கான வடிவம்.
- source_word: ἀπέθνῃσκεν
  choice: இறந்துகொண்டிருந்தாள்
  rationale: இறந்துவிட்டாள் என்று முடிவுற்ற நிகழ்வாக அல்லாமல், imperfect காட்டும் தொடர்ந்து நடந்துகொண்டிருந்த மரண நிலையைக் காக்கிறது.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: அவர் போய்க்கொண்டிருக்கையில்
  rationale: articular infinitive குறிக்கும் ஒரே நேரத்தில் நிகழும் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இலக்கு இவ்வசனத்தில் வெளிப்படையாகச் சொல்லப்படாததால் சேர்க்கப்படவில்லை.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: συνέπνιγον
  choice: நெருக்கித் தள்ளிக்கொண்டிருந்தன
  rationale: கூட்டங்கள் அவரைச் சுற்றி மிக நெருக்கமாக அழுத்தியதை இயல்பான தமிழில் காட்டுகிறது; மூச்சுத்திணறச் செய்தன என்ற சாத்தியமான தீவிர உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள யவீருவின் வேண்டுகோளுக்கான காரணத்தை வெளிப்படுத்தும் தொடர்பைத் தக்கவைக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு ... இருந்தாள்
  rationale: உடைமைக்குரிய dative அமைப்பைத் தமிழின் இயல்பான உடைமை வாக்கிய வடிவில் வழங்குகிறது.
