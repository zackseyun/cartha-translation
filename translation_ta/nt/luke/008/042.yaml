- from: ஏனெனில், அவருக்குச் சுமார் பன்னிரண்டு வயதுடைய ஒரே மகள்[a] இருந்தாள்; அவள் இறந்துகொண்டிருந்தாள். அவர் போய்க்கொண்டிருக்கையில், மக்கள் கூட்டங்கள் அவரை நெருக்கித் தள்ளிக்கொண்டிருந்தன.[b]
  to: ஏனெனில், அவருக்குச் சுமார் பன்னிரண்டு வயதுடைய ஒரே மகள்[a] இருந்தாள்; அவள் உயிரிழக்கும் நிலையில் இருந்தாள். அவர் போய்க்கொண்டிருக்கையில், மக்கள் கூட்டங்கள் அவரை நெருக்கிக்கொண்டிருந்தன.[b]
