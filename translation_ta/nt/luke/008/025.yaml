  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உங்கள் விசுவாசம்[a] எங்கே?” என்றார். அவர்கள் பயந்து வியந்தார்கள்; ஒருவருக்கொருவர், “அப்படியானால் இவர் யார்? இவர் காற்றுகளுக்கும் தண்ணீருக்கும் கட்டளையிடுகிறார்; அவையும் இவருக்குக் கீழ்ப்படிகின்றன!” என்று சொல்லிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கை.” இயேசுவின் கேள்வியை, “உங்கள் நம்பிக்கை எங்கே?” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: எங்கே
  rationale: விசுவாசம் எங்கு உள்ளது அல்லது ஏன் வெளிப்படவில்லை என்ற நேரடியான கேள்வி வடிவத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு சீடர்கள் ஆபத்தின் நடுவில் இயேசுவை நம்புவதைக் குறித்தாலும், பரந்த பொருளையும் வழக்கமான வேதாகமச் சொல்லாட்சியையும் காக்க ‘விசுவாசம்’ பயன்படுத்தப்பட்டுள்ளது; ‘நம்பிக்கை’ என்பது பொருத்தமான சூழல்சார் மாற்று.
- source_word: φοβηθέντες
  choice: பயந்து
  rationale: பயம் அவர்களுடைய வியப்புடன் இணைந்த சூழ்நிலையை இயல்பான தமிழ் வினையெச்சத்தால் வெளிப்படுத்துகிறது.
- source_word: ἐθαύμασαν
  choice: வியப்படைந்து
  rationale: நிகழ்ந்ததைக் கண்டு ஏற்பட்ட ஆச்சரியத்தையும் பிரமிப்பையும் நவீன, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: அப்படியானால் இவர் யார்?
  rationale: ἄρα என்பதன் அனுமானத் தன்மையை ‘அப்படியானால்’ காக்கிறது; அற்புதத்திலிருந்து எழும் சீடர்களின் கேள்வியையும் நேரடியாகத் தருகிறது.
- source_word: ἐπιτάσσει
  choice: கட்டளையிடுகிறார்
  rationale: கண்டித்தல் என்று முந்தைய வசனத்தின் சொல்லை இறக்குமதி செய்யாமல், இங்குள்ள ‘கட்டளையிடுதல்’ என்ற நேரடிப் பொருளைக் காக்கிறது.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: காற்றுகளுக்கும் தண்ணீருக்கும்கூட
  rationale: கிரேக்கத்தில் உள்ள பன்மை ‘காற்றுகள்’ மற்றும் ஒருமை ‘தண்ணீர்’ ஆகியவற்றைக் காக்கிறது; ‘அலைகள்’ அல்லது ‘கடல்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: ὑπακούουσιν αὐτῷ
  choice: அவை இவருக்குக் கீழ்ப்படிகின்றன
  rationale: படைப்பு அவருடைய கட்டளைக்கு இணங்குவதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστις என்பது இச்சூழலில் ‘நம்பிக்கை/நம்புதல்’ என்ற நுண்பொருளைக் கொண்டிருக்கலாம்
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: ‘விசுவாசம்’ என்பது πίστις என்பதன் பரந்த மற்றும் நிலையான மொழிபெயர்ப்பு; சீடர்கள் இயேசுவை நம்புவதையே இங்கு குறிப்பாகச் சுட்டும் ‘நம்பிக்கை’ என்ற நுண்பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பயந்து வியப்படைந்து’ என்பது கிரேக்க வினையெச்சத் தொடர்பைக் காக்கிறது; ‘காற்றுகள்’ மற்றும் ‘தண்ணீர்’ என்பவை மூலத்தின் சொல் வேறுபாட்டைத் தக்கவைக்கின்றன.
