source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: ta
  text: “உன் வீட்டுக்குத் திரும்பிப் போய், கடவுள் உனக்குச் செய்த அனைத்தையும் சொல்.” அவன் புறப்பட்டுப் போய், இயேசு தனக்குச் செய்த அனைத்தையும் நகரமெங்கும் அறிவித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε εἰς τὸν οἶκόν σου
  choice: உன் வீட்டுக்குத் திரும்பிப் போய்
  rationale: ὑποστρέφω முன்பு இருந்த இடத்திற்குத் திரும்புவதைக் குறிக்கிறது; εἰς τὸν οἶκόν σου இங்கு செல்லும் இடமாக ‘உன் வீட்டை’க் குறிப்பிடுகிறது. இவ்விரண்டையும் இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: διηγοῦ
  choice: சொல்
  rationale: διηγέομαι நிகழ்ந்ததை எடுத்துரைப்பது அல்லது விவரிப்பது என்ற பொருளுடையது. கட்டளையில் ‘சொல்’ என்பது தெளிவான, இயல்பான தமிழ்; பின்னணியில் அனைத்தையும் எடுத்துச் சொல்லும் பொருள் தொடர்கிறது.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: கடவுள் உனக்குச் செய்த அனைத்தையும்
  rationale: ὅσα என்பதன் நேரடியான பரப்பை ‘அனைத்தையும்’ காக்கிறது. மூலத்தில் இல்லாத ‘பெரிய காரியங்கள்’ என்ற பெயரடையைச் சேர்க்காமல், சூழலின் வலிமையை வாசகருக்கே விட்டுவைக்கிறது.
- source_word: ἀπῆλθεν
  choice: புறப்பட்டுப் போய்
  rationale: ἀπέρχομαι அந்த இடத்திலிருந்து சென்றுவிடுவதைக் குறிக்கிறது; ‘புறப்பட்டுப் போய்’ அந்தப் பிரிவுணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: நகரமெங்கும்
  rationale: κατά + accusative இங்குள்ள பகிர்வுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κηρύσσων
  choice: அறிவித்தான்
  rationale: κηρύσσω பொதுவெளியில் பிரகடனப்படுத்துவதைச் சுட்டுகிறது. ‘அறிவித்தான்’ பொதுவாக எடுத்துரைத்த செயலைக் காட்டுகிறது; முறையான பிரசங்கச் சூழலை தேவையின்றி இறக்குமதி செய்யாது.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு தனக்குச் செய்த அனைத்தையும்
  rationale: முந்தைய ‘கடவுள் உனக்குச் செய்த அனைத்தையும்’ என்ற கூறுடன் உள்ள திட்டமிட்ட இணை அமைப்பைக் காக்கிறது; αὐτῷ என்பதை தமிழின் மறைமுக மேற்கோள் நடைப்படி ‘தனக்கு’ என வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளையில் ‘கடவுள்’ என்றும், மனிதனின் அறிவிப்பில் ‘இயேசு’ என்றும் வரும் இணை அமைப்பு
  choice: ‘கடவுள் உனக்குச் செய்த அனைத்தையும் / இயேசு தனக்குச் செய்த அனைத்தையும்’ என்று இரு பெயர்களையும் அப்படியே காத்தல்
  alternative: இரு இடங்களையும் ‘கடவுள்’ அல்லது ‘இயேசு’ என்று ஒரேபோல மாற்றுதல்; அல்லது ‘அதாவது, இயேசு’ என்று விளக்கம் சேர்த்தல்
  rationale: லூக்கா விளக்கமின்றி உருவாக்கும் இறையியல் நிறைந்த இணை அமைப்பையும் அதன் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளை கண்ணியமான வேதாகம உரைநடை. மூலத்தில் வெளிப்படையாக இல்லாத ‘பெரிய காரியங்கள்’ சேர்க்கப்படவில்லை. நேரடி உரையின் பின்னர் வரும் வினைச்சொற்கள் இயல்பான தமிழ் தொடர்வினை அமைப்பில் வழங்கப்பட்டுள்ளன.
