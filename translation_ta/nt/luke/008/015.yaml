id: LUK.8.15
reference: Luke 8:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: ta
  text: ஆனால் நல்ல மண்ணில் விழுந்த விதையோ—நல்லதும் நேர்மையானதுமான உள்ளத்தோடு வார்த்தையைக் கேட்டு, அதை உறுதியாகத் தக்கவைத்துக்கொண்டு, விடாமுயற்சியுடன் கனி கொடுப்பவர்களைக் குறிக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நேர்மையும் நன்மையும் கொண்ட உள்ளத்தோடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  choice: ஆனால் நல்ல மண்ணில் விழுந்த விதையோ
  rationale: கிரேக்கத்தில் விதை என்பது சூழலிலிருந்து புரிந்துகொள்ளப்படும் மறைநிலைப் பொருள். தமிழில் உவமையின் தொடர்பு தெளிவாக இருக்க ‘விதை’ என்றும், விதைக்கப்பட்ட நிலையைக் காட்ட ‘விழுந்த’ என்றும் இயல்பாக வழங்கப்பட்டது.
- source_word: καλῇ γῇ
  choice: நல்ல மண்
  rationale: இங்கு γῆ பயிர் வளரும் மண்ணைக் குறிக்கிறது; ‘நல்ல மண்’ வேளாண்மை உருவகத்தையும் முந்தைய மண் வகைகளுடனான வேறுபாட்டையும் காக்கிறது.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: …வர்களைக் குறிக்கிறது
  rationale: அடையாளப்படுத்தும் கிரேக்கக் கட்டமைப்பை நவீன தமிழில் இயல்பாகவும் உவமை விளக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: நல்லதும் நேர்மையானதுமான உள்ளத்தோடு
  rationale: καλός மற்றும் ἀγαθός ஆகிய இணையான நற்பண்புச் சொற்களின் இரட்டைக் குறிப்பைத் தமிழில் வேறுபடுத்திக் காக்கிறது. ‘உள்ளம்’ இங்கு உள்ளார்ந்த மனநிலையை இயல்பாகக் குறிக்கிறது.
- source_word: ἀκούσαντες τὸν λόγον
  choice: வார்த்தையைக் கேட்டு
  rationale: இறந்தகாலப் பங்கேற்பு முதலில் கேட்பதையும், பின்னர் பற்றிக்கொண்டு கனிகொடுப்பதையும் காட்டுகிறது. ‘வார்த்தை’ உவமை விளக்கத்தில் நிலைபெற்ற பொருளைக் காக்கிறது.
- source_word: κατέχουσιν
  choice: அதைப் பற்றிக்கொண்டு
  rationale: வார்த்தையை வெறுமனே வைத்திருப்பதை விட உறுதியாகத் தக்கவைத்திருக்கும் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: καρποφοροῦσιν
  choice: கனிகொடுப்பவர்கள்
  rationale: உவமையின் வேளாண்மை உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐν ὑπομονῇ
  choice: விடாமுயற்சியுடன்
  rationale: ὑπομονή குறிக்கும் நிலைத்த சகிப்பையும் தொடர்ந்து உறுதியாக இருப்பதையும் நவீன தமிழில் தெளிவாகக் கூறுகிறது; வெறும் செயலற்ற பொறுமையாகக் குறுக்கவில்லை.
theological_decisions:
- issue: வார்த்தையை ஏற்கும் உள்ளத்தின் ஒழுக்கப் பண்பு
  choice: நல்லதும் நேர்மையானதுமான உள்ளத்தோடு
  alternative: நேர்மையும் நன்மையும் கொண்ட உள்ளத்தோடு
  rationale: வசனம் உள்ளத்தின் நேர்மறையான பண்பைச் சொல்கிறது; அந்த உள்ளம் எவ்வாறு உருவாகிறது, அது இயல்பானதா அல்லது முன் நிகழும் இறைச்செயலின் விளைவா என்பதைக் குறிப்பிடவில்லை. மொழிபெயர்ப்பு அந்தத் தீர்க்கப்படாத இறையியல் பதற்றத்தை அப்படியே விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட அடையாளப்படுத்தும் வாக்கிய அமைப்பு தமிழில் இயல்பான ‘குறிக்கிறது’ கட்டமைப்பாக மாற்றப்பட்டது.
