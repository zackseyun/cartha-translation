source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: ta
  text: வழியோரத்தில் உள்ளவர்கள் வார்த்தையைக் கேட்டவர்கள். பின்னர் பிசாசு வந்து, அவர்கள் நம்பி இரட்சிக்கப்படாதபடி, அவர்களுடைய இதயத்திலிருந்து அந்த வார்த்தையை[a] எடுத்துவிடுகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘வார்த்தை’ என்பது இந்த உவமையில் அறிவிக்கப்படும் கடவுளுடைய செய்தியைக் குறிக்கிறது.
    reason: சூழலில் λόγος என்பதன் குறிப்பைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: வழியோரத்தில்
  rationale: παρά + accusative காட்டும் சாலையின் அருகிலுள்ள இடத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; உவமையின் காட்சியையும் காக்கிறது.
- source_word: ἀκούσαντες
  choice: வார்த்தையைக் கேட்டவர்கள்
  rationale: இறந்தகால வினையெச்சத்தின் பொருளைத் தமிழில் இயல்பாகப் பெயரெச்சத் தொடராக அளிக்கிறது; கேட்டதன் பொருளைச் சூழலிலுள்ள ‘வார்த்தை’ என்று வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: διάβολος
  choice: பிசாசு
  rationale: இங்கு ஒரு தனிப்பட்ட தீய ஆளைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: αἴρει
  choice: எடுத்துவிடுகிறான்
  rationale: இங்குள்ள ‘அகற்றுதல்/எடுத்துச் செல்லுதல்’ என்ற பொருளைத் தெரிவிக்கிறது; மூலத்தில் இல்லாத வன்முறையின் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τὸν λόγον
  choice: அந்த வார்த்தை
  rationale: λόγος என்பதன் வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது; சுட்டுப்பெயர் முன்னர் கேட்ட அதே வார்த்தையைக் குறிப்பிடுவதைத் தெளிவாக்குகிறது.
- source_word: καρδίας
  choice: இதயங்கள்
  rationale: சிந்தனை, விருப்பம், மறுமொழி ஆகியவற்றின் உள்மையத்தைக் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது; αὐτῶν என்பதற்கேற்ப பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: அவர்கள் நம்பி மீட்கப்படாதபடி
  rationale: பிசாசின் செயல் நோக்கும்/விளைவும் நம்புதலுக்கும் மீட்கப்படுதலுக்கும் உள்ள வரிசையும் சுருக்கமான இயல்பான தமிழில் பாதுகாக்கப்படுகின்றன.
- source_word: σωθῶσιν
  choice: மீட்கப்பட
  rationale: இலக்கணத்திலுள்ள passive வடிவத்தையும் லூக்காவின் இரட்சிப்பு சார்ந்த முழுப் பொருளையும் பொதுவாகப் புரியும் நவீனத் தமிழில் அளிக்கிறது.
theological_decisions:
- issue: நம்புதலுக்கும் மீட்புக்கும் உள்ள தொடர்பு
  choice: ‘அவர்கள் நம்பி மீட்கப்படாதபடி’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நம்பிக்கையின் தன்மை, நிலைத்திருத்தல், அல்லது மீட்பின் காரண ஒழுங்கை விளக்கும் விரிவான சமயவியல் மொழிபெயர்ப்புகள்.
  rationale: கிரேக்கம் வார்த்தை அகற்றப்படுவதன் நோக்கை நம்புதலும் மீட்கப்படுதலும் நிகழாமல் தடுப்பதாகக் கூறுகிறது. அவற்றின் தொடர்பைப் பற்றிய மரபுவாரியான விவாதத்தைத் தீர்மானிக்காமல் அந்த இறுக்கம் பாதுகாக்கப்படுகிறது.
- issue: ἵνα μή தொடரின் நோக்கம் அல்லது விளைவு
  choice: ‘…அப்படாதபடி’ என்ற நோக்குப் பொருள் கொண்ட தொடரால் வழங்கப்பட்டது.
  alternative: ‘அதனால் அவர்கள் நம்பாமலும் மீட்கப்படாமலும் போகிறார்கள்’ என்ற விளைவு மையமான வாசிப்பு.
  rationale: இச்சூழலில் பிசாசின் செயலைத் தொடர்ந்து வரும் ἵνα μή அவனுடைய தடுக்கும் நோக்கை இயல்பாக வெளிப்படுத்துகிறது; இருப்பினும் அதன் விளைவு சார்ந்த நிழற்பொருளை அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையான நடை. ‘இரட்சிக்கப்பட’ என்பதற்குப் பதிலாக எளிதில் புரியும் ‘மீட்கப்பட’ பயன்படுத்தப்பட்டது. மூலத்தின் உருவகமும் சமயவியல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
