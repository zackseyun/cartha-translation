reference: Luke 8:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: ta
  text: அப்போது இயேசு அவனிடம், “உன் பெயர் என்ன?” என்று கேட்டார். அதற்கு அவன், “லேகியோன்”[a] என்றான்; ஏனெனில் பல பேய்கள் அவனுக்குள் புகுந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லேகியோன்” என்பது ஒரு பெரிய ரோமப் படைப்பிரிவைக் குறிக்கும் இலத்தீன் சொல்லிலிருந்து வந்த பெயர்; இங்கு பல பேய்கள் அந்த மனிதனுக்குள் புகுந்திருந்ததை இப்பெயர் சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: கேட்டார்
  rationale: நேரடியான கேள்வியை அறிமுகப்படுத்தும் வினைச்சொல்; நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நேர்மையாகவும் உள்ளது.
- source_word: δὲ
  choice: அப்போது / அதற்கு
  rationale: கதை நகர்வையும் பதிலின் தொடர்ச்சியையும் தமிழில் இயல்பாகக் காட்ட, சூழலுக்கேற்ப இரண்டு இடங்களிலும் தொடரிணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: உன் பெயர் என்ன?
  rationale: கிரேக்க மொழியின் இயல்பான கேள்வித்தொடருக்கு இணையான தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: Λεγιών
  choice: லேகியோன்
  rationale: ரோமப் படைப்பிரிவைக் குறிக்கும் கடன்சொல் பெயராகப் பயன்படுத்தப்பட்டுள்ளதால் ஒலிபெயர்க்கப்பட்டது; அதன் பண்பாட்டுப் பின்னணி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: ‘லேகியோன்’ என்ற பெயருக்கான காரணத்தைத் தெளிவாகக் காட்டும் காரண இணைப்புச்சொல்.
- source_word: εἰσῆλθεν
  choice: புகுந்திருந்தன
  rationale: பேய்கள் பெயரைச் சொல்வதற்கு முன்பே அவனுக்குள் புகுந்திருந்தன என்ற காலத் தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δαιμόνια πολλὰ
  choice: பல பேய்கள்
  rationale: தீங்கு விளைவிக்கும் அமானுஷ்ய ஆவிக்குரிய உயிர்களைக் குறிக்கும் மூலச்சொல்லை சாதாரண வாசகர்களுக்குப் புரியும் நேரடியான தமிழில் வழங்குகிறது.
- source_word: εἰς αὐτόν
  choice: அவனுக்குள்
  rationale: வெறுமனே அவனில் இருந்தன என்பதைக் காட்டாமல், அவனுக்குள் புகும் திசை சார்ந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: δαιμόνια என்பதைக் கையாளுதல்
  choice: பேய்கள்
  alternative: தீய ஆவிகள்
  rationale: மூலவசனம் தனிப்பட்ட தீய ஆவிக்குரிய உயிர்கள் அந்த மனிதனுக்குள் புகுந்ததாகக் கூறுகிறது. ‘பேய்கள்’ என்பது அந்தக் கூற்றை மென்மைப்படுத்தாமல் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- issue: εἰσῆλθεν குறிக்கும் காலத் தொடர்பு
  choice: புகுந்திருந்தன
  alternative: புகுந்தன
  rationale: பேய்கள் புகுந்த நிகழ்வு ‘லேகியோன்’ என்ற பதிலுக்கான முன்னோடியான காரணம் என்பதை இறந்தகால நிறைவு வடிவம் தெளிவுபடுத்துகிறது; இது கோட்பாட்டு சேர்க்கை அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள முதல் அடிக்குறிப்பு அதன் குறியிடப்பட்ட இடத்துக்கும் உள்ளடக்கத்துக்கும் பொருந்தாததால் சேர்க்கப்படவில்லை; மூலக் கிரேக்கத்தின் தெளிவான காரணவாக்கியம் முதன்மை உரையிலேயே மொழிபெயர்க்கப்பட்டுள்ளது.
