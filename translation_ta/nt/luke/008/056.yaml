source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: ta
  text: அவளுடைய பெற்றோர் திகைத்துப்போனார்கள்.[a] ஆனால், நடந்ததை யாரிடமும் சொல்ல வேண்டாம் என்று அவர் அவர்களுக்குக் கட்டளையிட்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் வியந்துபோனார்கள்”; “நிலைதடுமாறிப்போனார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அறிவுறுத்தினார்.” மூலச்சொல் ‘கட்டளையிடுதல்,’ ‘ஆணையிடுதல்,’ அல்லது ‘அறிவுறுத்துதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: திகைத்துப்போனார்கள்
  rationale: வியப்பால் நிலைகுலைந்த தீவிரமான எதிர்வினையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘வியந்தார்கள்’ என்பதைவிட மூலச்சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: தாய் தந்தை இருவரையும் குறிக்கும் நேரடியான, இயல்பான தமிழ்ச் சொல்.
- source_word: παρήγγειλεν
  choice: கட்டளையிட்டார்
  rationale: இச்சூழலில் சொல்லப்பட்ட அறிவுறுத்தலின் அதிகாரமிக்க கட்டாயத் தன்மையைத் தெளிவாகப் பேணுகிறது.
- source_word: μηδενὶ
  choice: யாரிடமும் ... வேண்டாம்
  rationale: எவருக்கும் சொல்லக்கூடாது என்ற முழுமையான தடையை இயல்பான தமிழ் எதிர்மறை அமைப்பில் தெரிவிக்கிறது.
- source_word: εἰπεῖν
  choice: சொல்ல
  rationale: ஒருவரிடம் ஒரு செய்தியைத் தெரிவிப்பது என்ற பொருளை இச்சூழலில் இயல்பாகக் கொடுக்கிறது.
- source_word: τὸ γεγονός
  choice: நடந்ததை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிறைவேற்றுப் பங்கேற்புச் சொல்லை, நிகழ்ந்து முடிந்த சம்பவத்தைக் குறிக்கும் இயல்பான தமிழாக வழங்குகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பெற்றோரின் திகைப்புக்கும் இயேசுவின் அடுத்த கட்டளைக்கும் இடையிலான மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மேசியா பற்றிய இரகசியம் / இயேசுவின் கட்டளையின் எல்லை
  choice: நடந்ததை யாரிடமும் சொல்ல வேண்டாம் என்ற கட்டளையாக மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: இதை மேசியா பற்றிய இரகசியத்தோடு இணைந்த பொதுவான மௌனக் கட்டளையாகவோ, தற்காலிகமான அல்லது வரையறுக்கப்பட்ட அறிவுறுத்தலாகவோ விளக்குதல்
  rationale: கட்டளைக்கான காரணத்தையோ கால எல்லையையோ வசனம் கூறவில்லை. ஆகவே எந்த இறையியல் விளக்கத்தையும் மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூலத்தின் திறந்த தன்மை பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘திகைத்துப்போனார்கள்’ என்பது எதிர்வினையின் தீவிரத்தைப் பேணுகிறது; ‘கட்டளையிட்டார்’ என்பது παρήγγειλεν என்பதன் அதிகாரமிக்க உத்தரவை வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
