reference: Luke 8:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: ta
  text: அதன்பின், அவர் நகரம் நகரமாகவும் கிராமம் கிராமமாகவும் சென்று, கடவுளுடைய அரசு[a] குறித்து அறிவித்து நற்செய்தி கூறிவந்தார்; பன்னிருவரும் அவருடன் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளுடைய அரசு’ என்பதை ‘கடவுளுடைய ஆட்சி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: அதற்குச் சிறிது காலத்திற்குப் பிறகு
  rationale: இது அடுத்த நிகழ்வுக்கான லூக்காவின் காலத் தொடர் சூத்திரம். தமிழில் இயல்பற்ற ‘அது நிகழ்ந்தது’ என்பதைச் சேர்க்காமல், நிகழ்வுகளின் தொடர்ச்சியையும் குறுகிய இடைவெளியையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: διώδευεν
  choice: சென்று ... கூறிவந்தார்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது வழக்கமான செயற்பாட்டை ‘வந்தார்’ அமைப்பு வெளிப்படுத்துகிறது; பல இடங்களூடாகச் சென்றதையும் சூழல் தெளிவாக்குகிறது.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: நகரம் நகரமாகவும் கிராமம் கிராமமாகவும்
  rationale: κατά என்பதன் பகிர்வுப் பொருளையும், ஓரிடத்திலிருந்து மற்றோரிடத்துக்குத் தொடர்ந்து சென்றதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: κηρύσσων
  choice: அறிவித்து
  rationale: பொதுவாகப் பிரகடனம் செய்யும் பொருளைத் தருகிறது; இதனை அடுத்துள்ள εὐαγγελιζόμενος என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: εὐαγγελιζόμενος
  choice: நற்செய்தி கூறிவந்தார்
  rationale: நற்செய்தியை அறிவிக்கும் செயலைத் தெளிவாகக் கூறுகிறது; κηρύσσων உடன் ஒரே வினையாகக் கலக்காமல் அதன் தனிப்பொருளைப் பேணுகிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசைக் குறித்து
  rationale: βασιλεία என்பதில் உள்ள ஆட்சி மற்றும் ஆளுகைக்குட்பட்ட அரசு ஆகிய இரு பரிமாணங்களையும் முற்றிலும் ஒன்றாகக் குறுக்காமல் வைத்திருக்கிறது; ‘குறித்து’ என்பது அறிவித்தல் மற்றும் நற்செய்தி கூறுதல் இரண்டிற்கும் பொருளை இயல்பாக இணைக்கிறது.
- source_word: οἱ δώδεκα
  choice: பன்னிருவர்
  rationale: மூலத்தில் இல்லாத ‘சீடர்கள்’ அல்லது ‘அப்போஸ்தலர்கள்’ என்பதைச் சேர்க்காமல், அறியப்பட்ட குழுவின் பெயரைக் காக்கிறது.
- source_word: σὺν αὐτῷ
  choice: அவருடன் இருந்தார்கள்
  rationale: உடனிருத்தலையும் பயணத் தோழமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய அரசு
  alternative: கடவுளுடைய ஆட்சி
  rationale: ‘அரசு’ என்பது ஆளுகை, அரசுரிமை, ஆட்சிக்குட்பட்ட பரப்பு ஆகியவற்றின் பரந்த பொருளைத் திறந்துவைக்கிறது. ‘ஆட்சி’ என்ற மாற்று அதன் இயக்கமுள்ள அரசாளுதலைச் சிறப்பாகக் காட்டினாலும், பொருளை அந்த ஒரே பரிமாணமாகக் குறுக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒரே நீண்ட கிரேக்க வாக்கியத்தின் தொடர்ச்சியை அரைப்புள்ளி மூலம் காத்து, தமிழின் இயல்பான சொற்றொடர் அமைப்பைப் பயன்படுத்துகிறது. அடிக்குறி குறியீடு அது விளக்கும் கருத்துக்கு உடனடியாக அல்லாமல் வசன முடிவில் வைக்கப்பட்டுள்ளது; இருப்பினும் பிரதான உரையில் கட்டாயமாக இடம்பெறுகிறது.
