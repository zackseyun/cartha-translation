source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: ta
  text: 'ஆனால் அவர் அவர்களிடம் பதிலளித்துச் சொன்னார்: “என் தாயும் என் சகோதரர்களும்[a] இவர்களே—கடவுளுடைய வார்த்தையைக் கேட்டு அதன்படி செய்கிறவர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதர சகோதரிகளும்.” கிரேக்கத்தில் ‘சகோதரர்கள்’ என்று உள்ளது; எனினும் இக்கூற்றின் பயன்பாடு ஆண்களுக்கு மட்டும் வரையறுக்கப்பட்டிருக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: கிரேக்க மொழியில் உள்ள ‘பதிலளித்து சொன்னார்’ என்ற இரட்டை வினை அமைப்பைப் பாதுகாக்கிறது; அதேவேளையில் நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: என் தாயும் என் சகோதரர்களும்
  rationale: தாய் என்ற ஒருமையையும், இலக்கண ரீதியாக ஆண்பால் பன்மையில் உள்ள ἀδελφοί என்பதையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: οὗτοί εἰσιν οἱ
  choice: இவர்களே—… செய்கிறவர்கள்
  rationale: οὗτοί என்பதன் சுட்டும் வலியுறுத்தலை ‘இவர்களே’ என்பதன் மூலம் காத்து, அடுத்து வரும் பண்பை தமிழில் தெளிவாக விளக்குகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: λόγος என்பதன் ‘வார்த்தை/செய்தி’ பொருளையும், τοῦ θεοῦ என்ற உரிமைத் தொடர்பையும் காக்கும் மரபான, புரிந்துகொள்ளக்கூடிய மொழிபெயர்ப்பு.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: கேட்டு அதன்படி செய்கிறவர்கள்
  rationale: தொடர்ந்து அடையாளப்படுத்தும் நிகழ்காலப் பங்கேற்பு வினைகளின் பொருளைப் பாதுகாக்கிறது. தமிழில் ‘வார்த்தையைச் செய்வது’ இயல்பாக இல்லாததால், ποιοῦντες இங்கு கேட்ட வார்த்தைக்கு ஏற்ப செயல்படுவதைக் குறிக்கிறது என்பதை ‘அதன்படி’ தெளிவாக்குகிறது.
theological_decisions:
- issue: இயேசு மறுவரையறுக்கும் குடும்பத்தின் வரம்பு
  choice: கடவுளுடைய வார்த்தையைக் கேட்டு அதன்படி செய்கிறவர்களை இயேசு தம் குடும்பமாக அடையாளப்படுத்துகிறார்
  alternative: இயேசு தமது உயிரியல் குடும்பத்தை முற்றிலும் நிராகரிக்கிறார்
  rationale: வசனம் கடவுளுடைய வார்த்தைக்குப் பதிலளிப்பதன் அடிப்படையில் உறவின் வட்டத்தை விரிவுபடுத்துகிறது; ஆனால் தாய் மற்றும் உயிரியல் சகோதரர்களை நிராகரிப்பதாக நேரடியாகக் கூறவில்லை.
- issue: ἀδελφοί என்பதன் பாலினச் சுட்டு மற்றும் பயன்பாட்டு வரம்பு
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’ என்று ஆண்பால் வடிவத்தைப் பேணுதல்
  alternative: முதன்மை உரையிலேயே ‘சகோதர சகோதரிகள்’ அல்லது ‘உடன்பிறந்தவர்கள்’ என்று உள்ளடக்கமான வடிவத்தைப் பயன்படுத்துதல்
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மையில் இருந்து இயேசுவின் நேரடி ஆண் உறவினர்களை எதிரொலிக்கிறது. அதே நேரத்தில் கூற்றின் பயன்பாடு பெண்களை விலக்க வேண்டும் என்று உரை கட்டாயப்படுத்தாததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இவர்களே’ என்பது மூலத்தின் சுட்டும் வலியுறுத்தலைப் பேணுகிறது; நீள்கோடு அடுத்து வரும் விளக்கத்தை இயல்பாக இணைக்கிறது.
