id: LUK.8.41
reference: Luke 8:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: ta
  text: இதோ, யவீரு என்னும் பெயருடைய ஒருவர் வந்தார். அவர் தொழுகைக்கூடத்தின் தலைவராக இருந்தார். அவர் இயேசுவின் காலடியில் விழுந்து, தமது வீட்டிற்கு வரும்படி அவரை வேண்டிக்கொண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: அப்போது, இதோ
  rationale: கதையின் தொடர்ச்சியையும் திடீரென கவனம் ஈர்க்கும் ἰδού என்பதன் வலிமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀνὴρ ᾧ ὄνομα Ἰάϊρος
  choice: யவீரு என்னும் பெயருடைய ஒருவர்
  rationale: பெயரைக் குறிப்பிடும் கிரேக்க அமைப்பைத் தெளிவான நவீன தமிழில் தருகிறது; ἀνήρ இங்கு வயதுவந்த ஆணைக் குறித்தாலும் தமிழில் இயல்பாக ‘ஒருவர்’ போதுமானது.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: தொழுகைக்கூடத்தின் தலைவர்
  rationale: இது யூதச் சபைக்கூடத்தின் நிர்வாக அல்லது மதத் தலைமைப் பொறுப்பைக் குறிக்கிறது; ‘தொழுகைக்கூடம்’ சாதாரண வாசகருக்கு அதன் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: இயேசுவின் காலடியில் விழுந்து
  rationale: யவீருவின் பணிவையும் தீவிர வேண்டுதலையும் காட்டும் மூலத்தின் உடல் இயக்கத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: παρεκάλει
  choice: வேண்டிக்கொண்டார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் தீவிரமாகவும் மீண்டும் மீண்டும் வேண்டிய நுண்ணுணர்வைக் கொண்டது; ‘வேண்டிக்கொண்டார்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: தமது வீட்டிற்கு வரும்படி
  rationale: சொல்லுக்கு சொல் ‘தமது வீட்டிற்குள் நுழையும்படி’ என்பதைக் காட்டிலும் தமிழில் இயல்பாக உள்ளது; இலக்கு மற்றும் அழைப்பு தெளிவாகத் தக்கவைக்கப்படுகின்றன.
theological_decisions:
- issue: யவீருவின் பதவியின் தன்மை
  choice: தொழுகைக்கூடத்தின் தலைவர்
  alternative: ஜெப ஆலயத் தலைவர் / சினகோகின் அதிகாரி
  rationale: மூலம் அவரை ἄρχων என்று மட்டுமே குறிப்பிடுகிறது; ஆசாரியர் அல்லது ரபி போன்ற குறிப்பிட்ட சமயப் பதவியைச் சேர்க்காமல் தலைமைப் பொறுப்பை மட்டும் வெளிப்படுத்துகிறது.
- issue: இயேசுவின் காலடியில் விழுதல்
  choice: வழிபட்டார் என்று விளக்காமல் உடல் செயலை நேரடியாக மொழிபெயர்த்தல்
  alternative: இயேசுவை வணங்கினார்
  rationale: இச்செயல் பணிவு, மரியாதை, மன்றாட்டு ஆகியவற்றைக் காட்டலாம்; அதைத் தனிப்பட்ட இறையியல் விளக்கமாகத் தீர்மானிக்காமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியக்கூடியதுமான நடை. கிரேக்க வாக்கியத்தின் நீண்ட இணைப்புகளை வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரித்துள்ளோம்; தகவல் வரிசை பாதுகாக்கப்பட்டுள்ளது.
