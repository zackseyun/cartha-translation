  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: ta
  text: அப்போது அவருடைய தாயும் சகோதரர்களும்[b] அவரிடம் வந்தார்கள்; ஆனால் மக்கள் கூட்டத்தினால் அவரை அணுக முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைச் சந்திக்க” அல்லது “அவரிடம் சென்றடைய.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “சகோதரர்கள்.” சிலர் இதை விரிவான பொருளில் “உறவினர்கள்” என்று புரிந்துகொள்கிறார்கள்; ஆனால் மூல உரை “சகோதரர்கள்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ
  choice: அப்போது ... வந்தார்கள்
  rationale: δέ கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; παραγίνομαι இங்கு வருகையைக் குறிக்கிறது. கூட்டெழுவாய்க்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: ஒரு நபரை நோக்கிய வருகையை இயல்பான தமிழில் குறிக்கிறது; உரையில் இல்லாத நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: அவருடைய தாயும் சகோதரர்களும்
  rationale: உறவுமுறைச் சொற்களை நேரடியாகவும் இயல்பாகவும் தருகிறது; ἀδελφοί என்பதன் ஆண்பால் பன்மையை ‘சகோதரர்கள்’ எனப் பாதுகாக்கிறது.
- source_word: οὐκ ἠδύναντο
  choice: முடியவில்லை
  rationale: இறந்தகாலத் தொடர்நிலை இயலாமையைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: συντυχεῖν αὐτῷ
  choice: அவரை அணுக
  rationale: கூட்டம் தடையாக இருந்த சூழலில் அவரைச் சென்றடைவது அல்லது சந்திப்பது என்ற நடைமுறைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τὸν ὄχλον
  choice: மக்கள் கூட்டத்தினால்
  rationale: διά + accusative குறிக்கும் காரணத்தைத் தெளிவாக வெளிப்படுத்துகிறது; ὄχλος என்பதற்கு ‘மக்கள் கூட்டம்’ இயல்பான தமிழ்.
theological_decisions:
- issue: ‘அவருடைய சகோதரர்கள்’ என்பவர்களின் துல்லியமான உறவுமுறை
  choice: சகோதரர்கள்
  alternative: உறவினர்கள்; உடன்பிறந்தவர்கள்
  rationale: மூலத்தில் ἀδελφοί என்றே உள்ளது. அவர்கள் இயேசுவின் உடன்பிறந்தவர்களா, ஒன்றுவிட்ட சகோதரர்களா, அல்லது பிற உறவினர்களா என்ற கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘அணுக’ என்பது சுருக்கமாகவும் இயல்பாகவும் இருந்து, συντυχεῖν என்பதிலுள்ள ‘சந்திக்க/சென்றடைய’ என்ற பொருள் வரம்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
