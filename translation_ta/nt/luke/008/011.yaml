lexical_decisions:
- source_word: Ἔστιν
  choice: இதுதான்
  rationale: இணைப்புவினையின் அமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது; ‘பொருள்’ என்று விரிவாக்கி விளக்கவில்லை.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மெல்லிய உரைமாற்றத்தைக் குறிக்கிறது. தமிழில் இவ்விடத்தில் தனியான இணைப்புச்சொல் இல்லாமலேயே உவமையிலிருந்து அதன் விளக்கத்திற்கான மாறுதல் இயல்பாகத் தெரிகிறது.
- source_word: αὕτη ἡ παραβολή
  choice: இந்த உவமை இதுதான்
  rationale: கிரேக்கத்தின் முறையான அமைப்பையும் அதிலுள்ள சுருக்கத்தையும் காக்கிறது; ‘இந்த உவமையின் பொருள்’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் மூலத்தில் இல்லாத ‘பொருள்’ என்ற சொல்லைச் சேர்க்கும்.
- source_word: σπόρος
  choice: விதை
  rationale: ஒருமை வடிவத்தையும் விதைப்பவர் உவமையின் உருவகத்தையும் தெளிவாகக் காக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: λόγος
  choice: வார்த்தை
  rationale: இங்கு கடவுள் அறிவிக்கும் செய்தியைக் குறிக்கிறது. ‘வார்த்தை’ என்பது வேதாகமத் தொடர்புகளைப் பாதுகாக்கும்; அதே நேரத்தில் நவீனத் தமிழிலும் புரியும்.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: கிரேக்க உருபுடைமைத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்; ‘கடவுளிடமிருந்து வந்த’ என மூலத்தின் உறவை விளக்கமாக விரிவாக்கவில்லை.
theological_decisions:
- issue: παραβολή என்பதை ‘உவமை’ என்று மட்டும் மொழிபெயர்ப்பதா, அல்லது சூழலுக்கேற்ப ‘உவமையின் பொருள்/விளக்கம்’ என்று விரிவாக்குவதா
  choice: உவமை
  alternative: உவமையின் பொருள்
  rationale: இயேசு உவமையை விளக்கத் தொடங்குகிறார் என்பது சூழலில் தெளிவாக இருந்தாலும், கிரேக்க உரை ‘இந்த உவமை இதுதான்’ என்றே கூறுகிறது. ஆகவே விளக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டு, மூலத்தின் சுருக்கமும் உள்ளார்ந்த பதற்றமும் முதன்மை உரையில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இந்த உவமை இதுதான்’ என்பது தமிழில் சற்றுச் சுருக்கமான வெளிப்பாடாக இருந்தாலும், மூலத்தின் திட்டமிட்ட சொற்றொடரைக் காக்கிறது; விளக்கமான வாசிப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
