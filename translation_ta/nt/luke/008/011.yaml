  text: 'உவமை இதுதான்: விதை கடவுளின் வார்த்தை[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதுவே உவமையின் பொருள்.” கிரேக்கத்தில் இன்னும் சொற்சொல்லாக, “உவமை இதுதான்” என்று உள்ளது.
