id: LUK.8.51
reference: Luke 8:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: ta
  text: அவர் வீட்டுக்குள் வந்தபோது, பேதுருவையும் யோவானையும் யாக்கோபையும் சிறுமியின்[a] தந்தையையும் தாயையும் தவிர, வேறு யாரையும் தம்முடன் உள்ளே வர அனுமதிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குழந்தையின்.” கிரேக்கச் சொல் பொதுவாக “குழந்தை” என்றும் பொருள்படலாம்; இங்குள்ள சூழல் அந்தக் குழந்தை ஒரு சிறுமி என்பதைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: அவர் வீட்டுக்குள் வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் காலத் தொடர்பை இயல்பான தமிழில் “வந்தபோது” எனக் காட்டுகிறது; εἰς என்பதன் உள்ள்நோக்கிய இயக்கம் “வீட்டுக்குள்” என்பதால் தெளிவாகிறது.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: உள்ளே வர அனுமதிக்கவில்லை
  rationale: ἀφίημι இங்கு ‘அனுமதித்தல்’ என்று பொருள்படும். இறந்தகால மறுப்பையும் εἰσελθεῖν என்பதன் நுழைதல் பொருளையும் இச்சொற்றொடர் இயல்பாகத் தருகிறது.
- source_word: τινα σὺν αὐτῷ
  choice: வேறு யாரையும் தம்முடன்
  rationale: மறுப்பு அமைப்பில் τινα பொதுவாக ‘யாரையும்’ என்ற பொருளைக் கொடுக்கிறது. விலக்கப்பட்டவர்கள் முன்னரே பட்டியலிடப்படுவதால் “வேறு” என்பது தமிழில் எதிர்மறை விலக்கைத் தெளிவாக்குகிறது; “தம்முடன்” என்பது இயேசுவை மரியாதையுடன் சுட்டுகிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: எதிர்மறை வாக்கியத்துக்குப் பின் இது நிபந்தனையை அல்ல, விலக்கைக் குறிக்கிறது.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: பேதுருவையும் யோவானையும் யாக்கோபையும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மீண்டும் வரும் καὶ இணைப்புகள் “-யும்” வடிவில் தக்கவைக்கப்பட்டுள்ளன.
- source_word: τῆς παιδὸς
  choice: சிறுமியின்
  rationale: παῖς பொதுவாக ‘குழந்தை’ என்று பொருள்படலாம்; ஆனால் உடனடிச் சூழல் யவீருவின் மகளைச் சுட்டுவதால் “சிறுமி” இயல்பாகவும் துல்லியமாகவும் உள்ளது. மூலச்சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: தந்தையையும் தாயையும்
  rationale: இரு பெற்றோரும் தனித்தனியாகக் குறிப்பிடப்படுவதைத் தக்கவைத்து, தமிழில் இயல்பான இணைப்பு வடிவில் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: παῖς என்பதன் சூழல்சார் குறிப்புத்தன்மை
  choice: சிறுமியின் தந்தையையும் தாயையும்
  alternative: குழந்தையின் தந்தையையும் தாயையும்
  rationale: இந்த இடத்தின் உடனடிச் சூழல் குழந்தை யவீருவின் மகள் என்பதைத் தெளிவுபடுத்துகிறது. எனவே பாலினத்தைக் குறிப்பதான “சிறுமி” முதன்மை உரையில் ஏற்றது; ஆயினும் கிரேக்கச் சொல்லின் பொதுவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்ச்சியான இணைப்புகள் பெயர்தோறும் வரும் “-யும்” வழியாகப் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி அது விளக்கும் “சிறுமியின்” என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
