translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் நிகழ்வுகளின் வரிசையும் காக்கப்பட்டுள்ளன; சூழலில் தெளிவாக உள்ள பன்றிகள் மட்டும் தமிழில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன.
