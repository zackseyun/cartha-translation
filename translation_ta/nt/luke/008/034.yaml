id: LUK.8.34
reference: Luke 8:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: ta
  text: பன்றிகளை மேய்த்துக்கொண்டிருந்தவர்கள் நடந்ததைக்[a] கண்டபோது, ஓடிப்போய் நகரத்திலும் சுற்றியுள்ள கிராமப்புறங்களிலும்[b] அதை அறிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிகழ்ந்ததை.’
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘வயல்களிலும்’; இங்கு நகரத்தைச் சுற்றியுள்ள கிராமப்புறப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ βόσκοντες
  choice: பன்றிகளை மேய்த்துக்கொண்டிருந்தவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘மேய்த்துக்கொண்டிருந்தவர்கள்’ என்பதே; முந்தைய சூழலில் அவர்கள் மேய்த்தது பன்றிகள் என்பதால், தமிழில் குறிப்பு தெளிவாக இருக்க ‘பன்றிகளை’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὸ γεγονός
  choice: நடந்ததை
  rationale: முடிவுற்று நிகழ்ந்த சம்பவத்தைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἔφυγον
  choice: அங்கிருந்து ஓடிப்போய்
  rationale: φεύγω என்பதன் ‘தப்பி/ஓடிச் செல்லுதல்’ என்ற வலிமையைத் தருகிறது; ‘அங்கிருந்து’ என்பது தமிழில் இயக்கத்தை இயல்பாக்கும் சூழல்சார் வெளிப்பாடு.
- source_word: ἀπήγγειλαν
  choice: அதை அறிவித்தார்கள்
  rationale: நடந்த சம்பவத்தை மற்றவர்களிடம் தெரிவித்தார்கள் என்ற செய்தியறிவிப்பு பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς τὴν πόλιν
  choice: நகரத்திலும்
  rationale: அறிவிப்பு சென்றடைந்த இடத்தைத் தமிழில் இயல்பான இடவியல் வடிவில் தருகிறது.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: சுற்றுப்புறக் கிராமப்புறங்களிலும்
  rationale: ἀγροί என்பதன் நேரடிப் பொருள் ‘வயல்கள்’; ஆனால் ‘நகரம்’ என்பதுடன் அமைந்த எதிரிணை, சுற்றியுள்ள நாட்டுப்புறப் பகுதிகளைக் குறிக்கிறது.
