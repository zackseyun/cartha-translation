  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: ta
  text: அவர்கள் படகில் சென்று, கலிலேயாவுக்கு எதிரே அமைந்துள்ள கெரசேனியரின்[a] பகுதியை அடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளும் இணையான நற்செய்திப் பகுதிகளும் ‘கதரேனியர்’ அல்லது ‘கெர்கெசேனியர்’ என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: படகில் சென்று ... அடைந்தார்கள்
  rationale: நீர்வழியாக ஓர் இடத்திற்குச் சென்று சேர்வதை இந்த வினை குறிக்கிறது. தமிழில் இயல்பாகவும் வருகை/சேருகை நுணுக்கத்தையும் வெளிப்படுத்தவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது; κατά என்பதற்கு இங்கு கட்டாயமான தனித் திசைப்பொருள் சேர்க்கப்படவில்லை.
- source_word: χώραν
  choice: பகுதி
  rationale: இது நவீன தேசிய நாட்டைக் காட்டிலும் ஒரு நிலப்பரப்பையோ வட்டாரத்தையோ குறிக்கிறது; ஆகவே ‘பகுதி’ தெளிவான, இயல்பான தேர்வு.
- source_word: Γερασηνῶν
  choice: கெரசேனியரின்
  rationale: கிரேக்க இன/இடத்தொடர்புப் பெயரின் தமிழ் ஒலிபெயர்ப்பு. மூலப்பாடத்தின் வாசகம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: ἥτις ἐστὶν
  choice: அமைந்துள்ள
  rationale: முன்னர் கூறப்பட்ட பகுதியை விவரிக்கும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: ἀντιπέρα
  choice: எதிரே
  rationale: ‘எதிர்ப்புறத்தில்’ அல்லது ‘அக்கரையில்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Γαλιλαίας
  choice: கலிலேயா
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ஒத்த நற்செய்தி மரபில் இடப்பெயருக்கான பாடவேறுபாடு
  choice: கெரசேனியர்
  alternative: கதரேனியர் அல்லது கெர்கெசேனியர்
  rationale: SBLGNT முதன்மைப் பாடம் Γερασηνῶν என இருப்பதால் அதுவே பிரதான உரையில் பின்பற்றப்பட்டது. பிற கையெழுத்துப் பிரதிகளிலும் இணை நற்செய்திப் பகுதிகளிலும் காணப்படும் வேறு பெயர்கள் ஒத்திசைக்கப்படாமல் அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் புவியியல் விளக்கம் இயல்பான தமிழ் பெயரெச்சத் தொடராக அமைக்கப்பட்டுள்ளது.
