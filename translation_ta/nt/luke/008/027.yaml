id: LUK.8.27
reference: Luke 8:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: ta
  text: அவர் நிலத்தில் இறங்கியபோது[a], நகரத்தைச் சேர்ந்த, பிசாசுகள் இருந்த ஒரு மனிதன் அவரைச் சந்தித்தான்[b]. மேலும், வெகு காலமாக அவன் உடை அணிந்திருக்கவில்லை; அவன் ஒரு வீட்டில் தங்கவில்லை; மாறாக, கல்லறைகளிடையே தங்கியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான வழக்கில், “அவர் கரையில் இறங்கியபோது.” கிரேக்கத்தில் நேரடியாக, “அவர் நிலத்தின்மேல் வந்தபோது” என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிசாசுகள் பிடித்திருந்த.” கிரேக்கத்தில் நேரடியாக, “பிசாசுகளைக் கொண்டிருந்த” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: அவர் நிலத்தில் இறங்கியபோது
  rationale: இடைச்சொல் சார்ந்த வினையெச்சத் தொடர் இயேசுவின் செயலைக் காலச்சூழலாகக் காட்டுகிறது. ἐπὶ τὴν γῆν என்பதன் நேரடியான பொருளான ‘நிலத்தில்’ என்பதைக் காத்து, படகிலிருந்து இறங்கிய சூழலைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘இறங்கியபோது’ பயன்படுத்தப்பட்டது.
- source_word: ὑπήντησεν
  choice: அவரை எதிர்கொண்டான்
  rationale: வந்து சந்தித்தல் அல்லது எதிர்ப்படுதல் என்ற நேரடியான கதையோட்டப் பொருளை ‘எதிர்கொண்டான்’ இயல்பாக வெளிப்படுத்துகிறது; பகைமை நோக்கத்தை அவசியமாகச் சேர்ப்பதில்லை.
- source_word: ἀνήρ τις
  choice: ஒரு மனிதன்
  rationale: ἀνήρ ஆண் மனிதனைக் குறிக்கிறது; τις தரும் குறிப்பில்லாத தன்மையைத் தமிழின் ‘ஒரு’ போதுமான அளவு வெளிப்படுத்துகிறது. ‘ஒரு குறிப்பிட்ட மனிதன்’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: ἐκ τῆς πόλεως
  choice: நகரத்தைச் சேர்ந்த
  rationale: அந்த மனிதனின் ஊர் அல்லது நகரத் தொடர்பைக் குறிக்கும் தொடரை இயல்பான தமிழில் தெரிவிக்கிறது; அவன் அச்சமயம் நகரத்திலிருந்து வெளியே வந்தான் என்று தேவையின்றி பொருள் கொள்ளவில்லை.
- source_word: ἔχων δαιμόνια
  choice: பிசாசுகளைக் கொண்டிருந்த
  rationale: ‘பிசாசுகளை உடையவனாக இருந்த’ என்ற கிரேக்கச் சொல்லமைப்புக்கு நெருக்கமாக இருந்து, ‘பிசாசுகள் பிடித்திருந்த’ என்ற விளக்கமான மரபுத்தொடரை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: χρόνῳ ἱκανῷ
  choice: வெகு காலமாக
  rationale: கணிசமான நீண்ட கால அளவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: உடை அணிந்திருக்கவில்லை
  rationale: ἐνδύω என்பதன் ‘அணிதல்’ என்ற செயற்பொருளைக் காத்து, நீடித்த பின்னணிச் சூழலைத் தமிழில் நிறைவுற்ற நிலையாக வெளிப்படுத்துகிறது.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: வீட்டில் தங்காமல்
  rationale: μένω என்பதன் தங்குதல்/வசித்தல் வரம்பில் ‘தங்குதல்’ என்பதைத் தேர்ந்து, நிரந்தரக் குடியிருப்பு என்ற தேவையற்ற முடிவைத் தவிர்க்கிறது.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: கல்லறைகளிடையே தங்கிவந்தான்
  rationale: முந்தைய ‘வீட்டில் தங்கவில்லை’ என்பதோடு உள்ள எதிர்மறை வேறுபாட்டைக் காத்து, பாறைக் கல்லறைகள் உள்ளிட்ட அடக்க இடங்களின் நடுவே வழக்கமாகத் தங்கியிருந்ததைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: δαιμόνια என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: பிசாசுகள்
  alternative: அசுத்த ஆவிகள்
  rationale: இங்கு மூலச்சொல் δαιμόνια; πνεύματα ἀκάθαρτα அல்ல. ஆகவே வேறு நற்செய்திப் பகுதிகளில் வரும் தனித்த சொற்றொடருடன் இதை ஒன்றாக்காமல் நேரடி சொல்லிணை தேர்ந்தெடுக்கப்பட்டது.
- issue: ἔχων δαιμόνια என்பதை ‘பிசாசுகள் பிடித்திருந்த’ என்று மொழிபெயர்க்கலாமா
  choice: பிசாசுகளைக் கொண்டிருந்த
  alternative: பிசாசுகள் பிடித்திருந்த
  rationale: மூலம் நேரடியாக ‘பிசாசுகளைக் கொண்டிருந்த’ என்கிறது. பொதுவான விளக்க மரபுத்தொடர் அடிக்குறிப்பில் தரப்பட்டு, மூலத்தின் சொல்லமைப்பிலுள்ள இறையியல் நுணுக்கம் முதன்மை உரையில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையோட்ட நடை பயன்படுத்தப்பட்டது. ‘வெகு காலமாக’, ‘தங்கிவந்தான்’ ஆகியவை நீடித்த பின்னணிச் செயல்களை இயல்பாகக் காட்டுகின்றன; மூலத்தில் இல்லாத காரணவியல் அல்லது சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
