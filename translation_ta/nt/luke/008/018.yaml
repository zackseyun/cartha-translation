reference: Luke 8:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: ta
  text: ஆகவே, நீங்கள் எப்படிக் கேட்கிறீர்கள் என்பதைக் கவனித்துக்கொள்ளுங்கள். ஏனெனில், யாரிடம் இருக்கிறதோ அவருக்குக் கொடுக்கப்படும்; யாரிடம் இல்லையோ, தன்னிடம் இருப்பதாக அவர் நினைப்பதும்கூட[a] அவரிடமிருந்து எடுத்துக்கொள்ளப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னிடம் இருப்பதாகத் தோன்றுவதும்கூட.”
    reason: δοκεῖ என்பதற்கு ‘நினைக்கிறார்’ அல்லது ‘தோன்றுகிறது’ என்ற இரு இயல்பான பொருள்கள் இருப்பதால், மூலத்தின் உண்மையான சொற்பொருள் தெளிவின்மை பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: βλέπετε
  choice: கவனித்துக்கொள்ளுங்கள்
  rationale: இது பார்ப்பதைக் குறிக்கும் நேரடிப் பொருளில் அல்லாமல், எச்சரிக்கையுடன் கவனம் செலுத்தும்படி அழைக்கும் கட்டளை; நவீன தமிழில் இந்தச் சொல் அந்த வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட கேட்பதும் வெளிப்படுவதும் பற்றிய போதனையிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: πῶς ἀκούετε
  choice: நீங்கள் எப்படிக் கேட்கிறீர்கள்
  rationale: πῶς கேட்கும் முறையையும் மனப்பாங்கையும் வலியுறுத்துகிறது; ἀκούετε என்பதன் கேட்பது என்ற அடிப்படைப் பொருளையும் தமிழ் இயல்பையும் காக்கிறது.
- source_word: ὃς ἂν ... ἔχῃ
  choice: யாரிடம் இருக்கிறதோ
  rationale: ἄν உடன் வரும் subjunctive பொதுவான, வரையறுக்கப்படாத நிபந்தனையைத் தருகிறது; பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் தமிழில் பழமொழித் தன்மையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: δοθήσεται αὐτῷ
  choice: அவருக்குக் கொடுக்கப்படும்
  rationale: கிரேக்கத்தில் கொடுக்கப்படுவது எது என்பதற்கான வெளிப்படையான செயப்படுபொருள் இல்லை. ‘அதிகமாக’ என்று சேர்த்து உரையின் தெளிவின்மையைத் தீர்மானிக்காமல், மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: யாரிடம் இல்லையோ
  rationale: முதல் பொதுநிபந்தனைத் தொடரும் இணையான அமைப்பாகவும் அதன் எதிர்மறை முரணைக் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὃ δοκεῖ ἔχειν
  choice: தன்னிடம் இருப்பதாக அவர் நினைப்பது
  rationale: δοκέω என்பதற்கு ‘நினை’ என்றும் ‘தோன்று’ என்றும் பொருள் கொள்ளலாம். முதன்மை உரையில் நவீன தமிழுக்கு தெளிவான ‘நினைப்பது’ பயன்படுத்தப்பட்டு, உண்மையென்று கருதப்படும் உடைமை உறுதியற்றது என்ற கருத்து பாதுகாக்கப்படுகிறது; மற்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து எடுத்துக்கொள்ளப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் அகற்றப்படுதல் அல்லது பறிக்கப்படுதலைக் குறிக்கிறது; ‘எடுத்துக்கொள்ளப்படும்’ தெளிவான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: உடையவர் மற்றும் இல்லாதவர் பற்றிய முரண்பாடான பழமொழியின் பொருள்
  choice: இயேசுவின் வார்த்தையை எப்படிக் கேட்கிறார்கள் என்ற உடனடிச் சூழலோடு தொடர்புடைய திறந்த பழமொழியாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: இதை முன்தீர்மானம், தகுதி, பொருளாதாரச் செழிப்பு அல்லது ஒரு குறிப்பிட்ட உக்கிராணத்துவக் கோட்பாடு பற்றிய நேரடி கூற்றாக விளக்குவது.
  rationale: வசனம் கேட்பதற்கும் ஏற்றுக்கொள்ளும் மனப்பாங்கிற்கும் தொடர்பான ஒரு முரண்பாடான கொள்கையை முன்வைக்கிறது. மூல உரை தீர்மானிக்காத குறிப்பிட்ட இறையியல் அமைப்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘யார்/அவர்’ அமைப்பு கிரேக்கத்தின் பொதுப்பொருளுடைய ஒருமையை தமிழில் இயல்பாக வெளிப்படுத்துகிறது. கிரேக்கத்தில் இல்லாத ‘மேலும்’ அல்லது ‘அதிகமாக’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
