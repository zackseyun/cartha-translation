language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: ta
  text: பேய்கள் அந்த மனிதனைவிட்டு வெளியேறி, பன்றிகளுக்குள் புகுந்தன. அந்தப் பன்றிக்கூட்டம் செங்குத்தான சரிவின் வழியாக ஏரிக்குள் வேகமாகப் பாய்ந்து மூழ்கி இறந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντα
  choice: வெளியேறி
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் இயல்பான நிகழ்வுத் தொடராகக் கொடுக்கப்பட்டுள்ளது.
- source_word: τὰ δαιμόνια
  choice: பேய்கள்
  rationale: δαιμόνια என்பதன் குறிப்பான பொருளைத் தருகிறது; இதை வேறு கிரேக்கச் சொல்லான ‘அசுத்த ஆவிகள்’ என்று மாற்றவில்லை.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: அந்த மனிதனைவிட்டு
  rationale: முன்னர் குறிப்பிடப்பட்ட ஒரே மனிதனைச் சுட்டுகிறது; ἐξέρχομαι உடனான பிரிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: பன்றிகளுக்குள் புகுந்தன
  rationale: உள்ளே சென்ற இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: அந்தப் பன்றிக்கூட்டம் … வேகமாக இறங்கி
  rationale: ὥρμησεν குறிக்கும் திடீரான, வலுவான இயக்கத்தையும் ἀγέλη என்னும் ஒருமைக் கூட்டுப்பெயரையும் காக்கிறது.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: செங்குத்தான சரிவில்
  rationale: கீழ்நோக்கிய கடுமையான சரிவைக் குறிக்கிறது; முற்றிலும் நேரான பாறைக் குன்று என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: εἰς τὴν λίμνην
  choice: ஏரிக்குள்
  rationale: λίμνη என்பதன் வழக்கமான பொருள் ‘ஏரி’; ‘கடல்’ என்று மாற்றாமல் லூக்காவின் சொல் வேறுபாடு காக்கப்படுகிறது.
- source_word: ἀπεπνίγη
  choice: மூழ்கி இறந்தது
  rationale: நீரில் மூழ்கியதால் உயிரிழந்ததைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாக்குகிறது; ஒருமை வடிவம் பன்றிக்கூட்டத்துடன் ஒத்திசைக்கப்படுகிறது.
theological_decisions:
- issue: δαιμόνια என்பதன் மொழிபெயர்ப்பு
  choice: பேய்கள்
  alternative: அசுத்த ஆவிகள்
  rationale: இவ்வசனத்தில் உள்ள குறிப்பான கிரேக்கச் சொல்லையே மொழிபெயர்த்து, தொடர்புடைய வேறு சொல்லின் இறையியல் நுணுக்கத்தை இறக்குமதி செய்யவில்லை.
- issue: κρημνός குறிக்கும் நில அமைப்பின் தீவிரம்
  choice: செங்குத்தான சரிவு
  alternative: பாறைக் குன்று / படுகுன்று
  rationale: கடுமையான கீழிறக்கத்தைப் பாதுகாக்கிறது; அது கட்டாயமாக நேரான பாறை விளிம்பு என்று தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நிகழ்வின் வேகத்தை இயல்பாக வெளிப்படுத்த ‘உடனே’ சேர்க்கப்பட்டுள்ளது; முக்கியக் கிரேக்கச் சொல் வேறுபாடுகளும் கூட்டுப்பெயரின் ஒருமையும் காக்கப்பட்டுள்ளன.
