id: LUK.8.55
reference: Luke 8:55
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: ta
  text: அவளுடைய ஆவி திரும்பிவந்தது[a]. உடனே அவள் எழுந்தாள்; அவளுக்குச் சாப்பிட ஏதாவது கொடுக்கும்படி அவர் கட்டளையிட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய மூச்சு திரும்பிவந்தது.”
    reason: πνεῦμα என்பதற்கு இச்சூழலில் ‘ஆவி’ என்றும் ‘மூச்சு’ என்றும் பொருள் கொள்ள வாய்ப்புள்ளது.
  - marker: b
    text: அல்லது, “அவளுக்கு உணவு கொடுக்கும்படி.”
    reason: கிரேக்கத்தில் ‘கொடுக்கப்படுதல்’ மற்றும் ‘சாப்பிடுதல்’ ஆகிய இரு கருத்துகளும் உள்ளன; தமிழில் இதைச் சுருக்கமாகவும் இயல்பாகவும் கூறும் மாற்று வடிவம்.
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: திரும்பிவந்தது
  rationale: இங்கு ἐπιστρέφω என்பது சிறுமியின் உயிர்நிலை மீட்கப்பட்டதைச் சித்தரிக்கிறது. ‘திரும்பிவந்தது’ என்பது கூடுதல் விளக்கம் சேர்க்காமல் அதன் நேரடியான இயக்க உணர்வைப் பாதுகாக்கிறது.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: அவளுடைய ஆவி
  rationale: πνεῦμα என்பதற்கு ‘ஆவி’ அல்லது ‘மூச்சு’ என்ற பொருள் வரலாம். மரணத்திலிருந்து எழுப்பப்படும் இச்சூழலில் ‘ஆவி’ என்பது சொல்லின் விரிவான பொருளையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது; ‘மூச்சு’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀνέστη
  choice: அவள் எழுந்தாள்
  rationale: ἀνίστημι என்பதன் ‘எழுதல்’ என்ற இயல்பான உடல் செயலை நவீனத் தமிழில் தெளிவாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: அற்புதத்தைத் தொடர்ந்து நிகழ்ந்த செயல் காலதாமதமின்றி நடந்ததை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: διέταξεν
  choice: கட்டளையிட்டார்
  rationale: διατάσσω என்பது அதிகாரத்துடன் அறிவுறுத்துவதைக் குறிக்கிறது. ‘கட்டளையிட்டார்’ அதன் வலிமையைத் தக்கவைக்கிறது; தமிழ்ச் சூழலில் தேவையற்ற கடுமையையும் சேர்ப்பதில்லை.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: அவளுக்குச் சாப்பிட ஏதாவது கொடுக்கும்படி
  rationale: δοθῆναι மற்றும் φαγεῖν இரண்டையும் வெளிப்படையாகக் காட்டி, ‘அவளுக்குச் சாப்பிடுவதற்காக ஏதாவது கொடுக்கப்பட வேண்டும்’ என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: உயிர்த்தெழுப்பப்படும் சூழலில் πνεῦμα என்பதன் பொருள்
  choice: அவளுடைய ஆவி திரும்பிவந்தது
  alternative: அவளுடைய மூச்சு திரும்பிவந்தது
  rationale: ‘ஆவி’ என்பது πνεῦμα என்பதன் பொருள் வரம்பையும் மரணத்திலிருந்து மீளும் நிகழ்வின் இறையியல் அழுத்தத்தையும் குறுக்காமல் பாதுகாக்கிறது. அதேவேளை, ‘மூச்சு’ என்ற பொருளும் சொல்லியல் அடிப்படையில் சாத்தியமுள்ளதால் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நிகழ்வுகளின் உடனடித் தொடரைத் தெளிவாக்க முதல் வாக்கியத்துக்குப் பின் முற்றுப்புள்ளியும், எழுந்த செயலை உணவு குறித்த கட்டளையுடன் இணைக்க அரைப்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
