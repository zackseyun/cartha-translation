id: LUK.8.45
reference: Luke 8:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: ta
  text: இயேசு, “என்னைத் தொட்டவர் யார்?” என்று கேட்டார். எல்லோரும் அதை மறுத்துக்கொண்டிருந்தபோது, பேதுரு, “எஜமானே, மக்கள் கூட்டங்கள் உம்மைச் சூழ்ந்துகொண்டு அழுத்துகின்றன[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை நெருக்குகின்றன.”
    reason: συνέχω மற்றும் ἀποθλίβω ஆகிய வினைகளின் இணைந்த கருத்துக்கு சுருக்கமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἁψάμενός
  choice: தொட்டவர்
  rationale: இங்கு நடுவினை வடிவிலுள்ள ἅπτω உடல்ரீதியான தொடுதலைக் குறிக்கிறது. ‘தொட்டவர்’ என்பது தமிழில் இயல்பாகவும், பெயரெச்சத்துடன் அமைந்த கிரேக்கக் கேள்வியின் வடிவை நெருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀρνουμένων δὲ πάντων
  choice: எல்லோரும் அதை மறுத்துக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பெயரெச்சம் தொடர்ந்து நடந்த மறுத்தலைக் காட்டுகிறது; ‘மறுத்துக்கொண்டிருந்தபோது’ அந்த நீடித்த தன்மையைப் பாதுகாக்கிறது. ‘அதை’ என்பது முந்தைய கேள்வியிலிருந்து இயல்பாகப் பெறப்படுகிறது.
- source_word: Ἐπιστάτα
  choice: எஜமானே
  rationale: லூக்கா பயன்படுத்தும் இந்த மரியாதை அழைப்பு இயேசுவின் அதிகாரத்தை ஏற்றுக்கொள்வதைக் காட்டுகிறது. ‘எஜமானே’ என்பது κύριος என்பதற்குரிய வலுவான ‘ஆண்டவரே’ என்ற பட்டத்தை இங்கு இறக்குமதி செய்யாமல் மரியாதையையும் அதிகாரத்தையும் வெளிப்படுத்துகிறது.
- source_word: ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: கிரேக்கச் சொல்லின் பன்மையைப் பாதுகாத்து, பலர் இயேசுவைச் சூழ்ந்திருந்த காட்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: συνέχουσίν
  choice: உம்மைச் சூழ்ந்து
  rationale: சுற்றிலும் நின்று ஒருவரை இடுக்கிக்குள் கொண்டுவரும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀποθλίβουσιν
  choice: உம்மீது நெருக்கிக்கொண்டிருக்கின்றன
  rationale: கூட்டத்தினர் இயேசுவின்மீது தொடர்ந்து அழுத்திக்கொண்டிருந்ததைக் காட்டி, முந்தைய ‘சூழ்ந்து’ என்பதிலிருந்து இரண்டாவது வினையின் அழுத்தக் கருத்தை வேறுபடுத்துகிறது.
theological_decisions:
- issue: Ἐπιστάτα என்ற இயேசுவுக்கான அழைப்பின் மொழிபெயர்ப்பு
  choice: எஜமானே
  alternative: போதகரே; ஆண்டவரே
  rationale: Ἐπιστάτης என்பது அதிகாரத்தை ஏற்றுக்கொள்ளும் மரியாதை அழைப்பு; இது வெறுமனே கற்பித்தலை மட்டும் குறிக்கும் சொல் அல்ல. அதேவேளை, மூலத்தில் κύριος இல்லாததால் ‘ஆண்டவரே’ என்று மொழிபெயர்த்து இவ்விடத்தில் வெளிப்படையாக இல்லாத வலுவான கிறிஸ்தவியல் பட்டத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது; கூட்டத்தின் இரு செயல்களையும் தனித்தனியாக வைத்திருக்கிறது.
