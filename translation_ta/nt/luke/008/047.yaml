source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: ta
  text: அந்தப் பெண், தான் கவனத்திலிருந்து தப்பவில்லை என்பதை உணர்ந்தபோது,[a] நடுங்கியபடி வந்து, அவர் முன் விழுந்து,[b] அவள் ஏன் அவரைத் தொட்டாள் என்பதையும், எவ்வாறு உடனடியாகக் குணமடைந்தாள் என்பதையும் எல்லா மக்களின் முன்னிலையிலும் தெரிவித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தான் கவனிக்கப்படாமல் இருக்கவில்லை” அல்லது “தான் மறைந்திருக்கவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய பாதங்களில் விழுந்து.” கிரேக்க மூலத்தில் “அவர் முன் விழுந்து” என்றே உள்ளது; “பாதங்கள்” என்பது வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மைச் செயலுக்கான காலச் சூழலைக் காட்டுகிறது; நவீன தமிழில் ‘கண்டபோது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: οὐκ ἔλαθεν
  choice: தான் கவனிக்கப்படாமல் போகவில்லை
  rationale: λανθάνω என்பது ஒருவரின் கவனத்திலிருந்து தப்புதல் அல்லது மறைவாக இருத்தல் என்பதைக் குறிக்கிறது. அவள் செய்தது கண்டறியப்பட்டுவிட்டதை உணர்ந்தாள் என்ற கருத்தை இந்த மொழிபெயர்ப்பு, யாருடைய கவனம் என்பதைச் சேர்க்காமல், பாதுகாக்கிறது.
- source_word: τρέμουσα
  choice: நடுங்கியபடி
  rationale: அவளுடைய உடல் மற்றும் உணர்ச்சி நிலையைத் தெளிவாகக் காட்டுகிறது; அதை வெறும் உள்ளார்ந்த பயம் என்று மட்டும் விளக்கவில்லை.
- source_word: προσπεσοῦσα αὐτῷ
  choice: அவர் முன் விழுந்து
  rationale: வேண்டுதல் அல்லது மரியாதையுடன் ஒருவருக்கு முன்பாக விழுவதைக் குறிக்கும் சொற்றொடர். கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘பாதங்களில்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: δι’ ἣν αἰτίαν
  choice: எதற்காக
  rationale: ‘எந்தக் காரணத்திற்காக’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἥψατο αὐτοῦ
  choice: அவரைத் தொட்டாள்
  rationale: ἅπτομαι உடன் வரும் ஆறாம் வேற்றுமை இங்கு தொடுதலைக் குறிக்கிறது; ‘பற்றிக்கொண்டாள்’ என்ற வலுவான பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: ἀπήγγειλεν
  choice: அறிவித்தாள்
  rationale: எல்லாருக்கும் முன்பாக ஒரு செய்தியைத் தெரிவிக்கும் பொதுவான, சற்றே முறையான தொனியைப் பாதுகாக்கிறது.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: மக்கள் அனைவருக்கும் முன்பாக
  rationale: ‘எல்லா மக்களின் முன்னிலையில்’ என்ற கிரேக்கச் சொற்றொடரின் பொதுத்தன்மையையும் பொது நிகழ்வையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς ἰάθη
  choice: எப்படி ... குணமானாள்
  rationale: ὡς என்பதிலுள்ள ‘எப்படி’ என்ற தொடர்பையும், ἰάθη குறிக்கும் குணமடைந்த நிகழ்வையும் இயல்பான தமிழில் வழங்குகிறது; குணப்படுத்தியவர் யார் என்பதை உரை வெளிப்படையாகச் சொல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: குணமடைதல் தாமதமின்றி நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பெண்ணின் பொது அறிவிப்பின் தன்மை
  choice: அவள் நடுங்கியபடி வந்து, அவர் முன் விழுந்து, நடந்ததைப் பொதுவாக அறிவித்தாள் என விவரிப்பது
  alternative: அவள் மனந்திரும்பி அறிக்கையிட்டாள் அல்லது வெளிப்படையாக அவரை வழிபட்டாள் என மொழிபெயர்ப்பது
  rationale: இவ்வசனம் அவளுடைய நிலை, செயல், பொது அறிவிப்பு ஆகியவற்றை விவரிக்கிறது. அவளுடைய உடல்நிலை மரியாதையையோ வேண்டுதலையையோ உணர்த்தலாம்; ஆனால் மனந்திரும்புதல் அல்லது வழிபாடு என்று வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கவனிக்கப்படாமல் போகவில்லை’ என்பது மூலத்தின் எதிர்மறை வடிவத்தையும் உண்மையான பொருள் நுட்பத்தையும் பாதுகாக்கிறது; சற்றே இயல்புக் குறைவு இருப்பதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
