id: LUK.8.3
reference: Luke 8:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: ta
  text: ஏரோதின் நிர்வாகியான கூசாவின் மனைவி யோவன்னாவும், சூசன்னாவும், வேறு பல பெண்களும் தங்கள் உடைமைகளிலிருந்து[b] அவர்களுக்குச்[a] சேவை செய்துவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “அவருக்கு” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “தங்களுக்குச் சொந்தமானவற்றிலிருந்து” அல்லது “தங்களுடைய பொருள்வளத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: கூசாவின் மனைவி
  rationale: தனிப்பட்ட பெயரைத் தொடர்ந்து வரும் உறவுமுறைப் பயன்பாட்டில் γυνή என்பது இயல்பாக ‘மனைவி’ என்று பொருள்படுகிறது.
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: ஏரோதின் நிர்வாகி
  rationale: ἐπίτροπος என்பது ஒருவரின் அலுவல்கள் அல்லது சொத்துகளைப் பொறுப்பாக நிர்வகிப்பவரைக் குறிக்கிறது; ‘நிர்வாகி’ என்பது அரசவை அல்லது சொத்து நிர்வாகச் சூழலுக்கு இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἕτεραι πολλαί
  choice: வேறு பல பெண்கள்
  rationale: பெண்பால் பன்மை வடிவம் முன்பு குறிப்பிடப்பட்ட பெண்களைத் தொடர்வதால், தமிழில் குறிப்பைத் தெளிவாக்க ‘பெண்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: αἵτινες
  choice: —உம் … பணிவிடை செய்துவந்தார்கள்
  rationale: தொடர்புப்பெயரால் அறிமுகப்படுத்தப்படும் விளக்க வாக்கியம் தமிழில் பெயர்ப்பட்டியலுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: διηκόνουν
  choice: பணிவிடை செய்துவந்தார்கள்
  rationale: இறையியல் பதவிப் பொருளைத் திணிக்காமல், தொடர்ந்து செய்த சேவையை இந்தச் சொற்றொடர் தெரிவிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: கொடுக்கப்பட்ட SBLGNT உரையிலுள்ள பன்மை வடிவத்தைப் பின்பற்றி, இயேசுவையும் அவருடன் இருந்தவர்களையும் உள்ளடக்கும் பன்மை மொழிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: தங்களுக்குச் சொந்தமானவற்றிலிருந்து
  rationale: பெண்கள் தங்களிடம் இருந்த சொத்து அல்லது வளங்களிலிருந்து சேவை செய்தார்கள் என்ற மூலவாக்கியத்தின் பரந்த பொருளை இது பாதுகாக்கிறது.
theological_decisions:
- issue: αὐτοῖς என்பதன் எண் மற்றும் சுட்டுப்பொருள்
  choice: 'பன்மை: ‘அவர்களுக்கு’'
  alternative: 'ஒருமை: ‘அவருக்கு’, அதாவது இயேசுவுக்கு'
  rationale: கொடுக்கப்பட்ட கிரேக்க மூல உரை αὐτοῖς என்ற பன்மையை வாசிக்கிறது. சில கையெழுத்துப் பிரதிகளில் ஒருமை இருப்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது; முதன்மை உரை மூலப் பதிப்பின் பன்மையைப் பின்பற்றுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெண்களைச் சுட்டும் பன்மை தமிழில் வெளிப்படையாகத் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகில் வைக்கப்பட்டுள்ளன.
