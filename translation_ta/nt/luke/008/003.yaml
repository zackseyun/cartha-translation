- from: ஏரோதின் நிர்வாகியான கூசாவின் மனைவி யோவன்னாவும், சூசன்னாவும், வேறு பல பெண்களும் தங்களுக்குச் சொந்தமானவற்றிலிருந்து[b] அவர்களுக்குப்[a] பணிவிடை செய்துவந்தார்கள்.
