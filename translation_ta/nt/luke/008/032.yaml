language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: ta
  text: அங்கே மலையில்[c] பன்றிகளின் பெரிய மந்தை ஒன்று[a] மேய்ந்துகொண்டிருந்தது. அந்தப் பன்றிகளுக்குள் நுழையத் தங்களுக்கு அனுமதி அளிக்கும்படி அவர்கள்[b] அவரை மன்றாடினார்கள்; அவரும் அவர்களுக்கு அனுமதி அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அநேக பன்றிகளைக் கொண்ட ஒரு மந்தை’ அல்லது ‘கணிசமான ஒரு பன்றிமந்தை.’
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘அவர்கள்’ என்பது சுற்றியுள்ள வசனங்களில் குறிப்பிடப்படும் பேய்களை அல்லது அசுத்த ஆவிகளைக் குறிக்கிறது; சில மொழிபெயர்ப்புகள் இதை வெளிப்படையாகக் கூறுகின்றன.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘மலைச்சரிவில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: பன்றிகளின் பெரிய மந்தை ஒன்று
  rationale: ἀγέλη என்பது விலங்குகளின் கூட்டத்தைக் குறிக்கிறது; பன்றிகளைப் பற்றிய இச்சூழலில் ‘மந்தை’ இயல்பான தமிழ்ச் சொல். ἱκανῶν இங்கு எண்ணிக்கையில் பெரிதான மந்தையைக் குறிப்பதால் ‘பெரிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: βοσκομένη
  choice: மேய்ந்துகொண்டிருந்தது
  rationale: மந்தை அங்கு உணவு உண்டுகொண்டிருந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; பன்றிகள் புல் மட்டுமே மேய்ந்தன என்ற தேவையற்ற குறுக்கமான பொருளைச் சூழல் கட்டாயப்படுத்தவில்லை.
- source_word: ἐν τῷ ὄρει
  choice: மலையில்
  rationale: ὄρος என்பதன் நேரான பொருளைத் தக்கவைக்கிறது; நிலச்சரிவு அல்லது மலைச்சரிவு என கூடுதலாக விளக்கவில்லை.
- source_word: παρεκάλεσαν
  choice: மன்றாடினார்கள்
  rationale: வெறும் வேண்டுகோளைவிட வலியுறுத்திக் கெஞ்சும் தன்மையை இந்தச் சூழலில் வெளிப்படுத்துகிறது.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: அனுமதி அளிக்கும்படி / அனுமதி அளித்தார்
  rationale: வேண்டுகோளிலும் அதற்கான பதிலிலும் வரும் ஒரே கிரேக்க வேர்ச்சொல்லின் தொடர்பைத் தமிழிலும் ஒரே சொற்றொடரால் பாதுகாக்கிறது.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: அந்தப் பன்றிகளுக்குள் நுழைய
  rationale: ἐκείνους சுட்டும் பன்றிகளை வெளிப்படையாகக் குறிப்பதோடு, εἰς ... εἰσελθεῖν என்பதிலுள்ள ‘உள்ளே நுழைதல்’ என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δὲ கதைத் தொடரின் இணைப்பாகச் செயல்படுகிறது. தமிழில் வசனத்தை இயல்பாகத் தொடங்க தனியான ‘இப்போது’ அல்லது ‘ஆனால்’ தேவையில்லை.
theological_decisions:
- issue: ‘அவர்கள் அவரை மன்றாடினார்கள்’ என்பதில் பன்மை எழுவாயின் குறிப்பு
  choice: கிரேக்க மூலத்தைப் போல ‘அவர்கள்’ என்று மறைமுகமாகவே வைக்கப்பட்டது.
  alternative: ‘பேய்கள் அவரை மன்றாடின’ என்று எழுவாயை வெளிப்படையாக்குதல்.
  rationale: சுற்றியுள்ள வசனங்களில் எழுவாய் பேய்கள்/அசுத்த ஆவிகள் என்பது தெளிவாகிறது; ஆனால் இவ்வசனத்தில் பெயர்ச்சொல் மீண்டும் வராமல் பன்மை வினை மட்டுமே உள்ளது. ஆகவே மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அவர்’ என்ற மரியாதை ஒருமை இயேசுவைக் குறிக்கிறது; பேய்களைக் குறிக்கும் பன்மை எழுவாய் மூலத்தைப் போல வெளிப்படையாகப் பெயரிடப்படவில்லை.
