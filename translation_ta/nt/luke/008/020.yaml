source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: ta
  text: அப்போது அவரிடம், “உங்கள் தாயும் சகோதரர்களும்[a] உங்களைப் பார்க்க விரும்பி வெளியே நிற்கிறார்கள்” என்று தெரிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் ἀδελφοί என்ற சொல் விரிந்த பொருளில் எடுத்துக்கொள்ளப்பட்டால், “உறவினர்கள்”; கிரேக்கச் சொல் வழக்கமாக “சகோதரர்கள்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: தெரிவிக்கப்பட்டது
  rationale: ἀπαγγέλλω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்தி, செய்தி இயேசுவிடம் கொண்டுவரப்பட்டதைச் சுட்டுகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: கதையைத் தொடர்ந்து முன்னெடுக்கும் மென்மையான இணைப்பாக இங்கு δέ செயல்படுகிறது; தமிழில் ‘அப்போது’ இயல்பான நிகழ்வுத் தொடர்ச்சியை அளிக்கிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: செய்தி யாரிடம் தெரிவிக்கப்பட்டது என்ற மறைமுகச் செயப்படுபொருளைத் தெளிவாகக் காக்கிறது.
- source_word: μήτηρ
  choice: தாய்
  rationale: நவீனத் தமிழில் இயல்பும் கண்ணியமும் வாய்ந்த நேரடி இணைச்சொல்.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: ஆண்பால் பன்மையில் உள்ள கிரேக்கச் சொல்லின் வழக்கமான பொருள் ‘சகோதரர்கள்’; சூழல் மட்டும் தீர்மானிக்காத உறவுமுறை விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: ἑστήκασιν
  choice: நிற்கிறார்கள்
  rationale: நின்றதன் விளைவாகத் தொடரும் தற்போதைய நிலையைச் சுட்டும் நிறைவேற்றுக் கால வடிவத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔξω
  choice: வெளியே
  rationale: கிரேக்க இடவினையுரிச்சொல்லை நேரடியாக மொழிபெயர்க்கிறது; குறிப்பிடப்படாத கட்டடத்தையோ இடத்தையோ சேர்க்கவில்லை.
- source_word: ἰδεῖν
  choice: பார்க்க
  rationale: ὁράω வினையின் அடிப்படைப் பொருளைக் காக்கிறது; ‘சந்திக்க’ அல்லது ‘பேச’ என்று விரிவுபடுத்தவில்லை.
- source_word: θέλοντες
  choice: விரும்பி
  rationale: தாயும் சகோதரர்களும் வெளியே நிற்கும் அதே வேளையில் கொண்டிருந்த நோக்கத்தை இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: இயேசுவுடன் ‘சகோதரர்கள்’ கொண்ட உறவின் தன்மை
  choice: ἀδελφοί என்பதை ‘சகோதரர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: உறவினர்கள்
  rationale: இச்சொல்லின் வழக்கமான பொருளை முதன்மை உரை காக்கிறது. இயேசுவின் குடும்ப உறவுகளைப் பற்றிய இறையியல் விவாதத்தை இந்த வசனம் மட்டும் தீர்மானிக்காததால், ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள்’ என்பது நேரடி உரையில் இயல்பான மரியாதைப் பன்மை; கிரேக்கச் செயப்பாட்டு அமைப்பும் வசனத்தின் உறவுமுறைத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
