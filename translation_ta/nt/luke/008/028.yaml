source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: ta
  text: ஆனால் அவன் இயேசுவைக் கண்டதும் அலறி, அவர் முன் விழுந்து, உரத்த குரலில், “இயேசுவே, உன்னதமான கடவுளின் மகனே, உமக்கும் எனக்கும் என்ன தொடர்பு?[a] என்னை வேதனைப்படுத்த வேண்டாம் என்று உம்மை மன்றாடுகிறேன்.” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எனக்கும் உமக்கும் என்ன?”'
    reason: மூல மொழியிலுள்ள மரபுத்தொடரின் சொல்லமைப்புக்கு நெருக்கமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மைச் செயல்களுக்கு முந்திய சூழலைக் குறிக்கிறது. ‘கண்டதும்’ என்பது அந்தக் காலத்தொடர்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀνακράξας
  choice: அலறி
  rationale: திடீரென எழுப்பப்பட்ட உரத்த கூக்குரலைக் குறிக்கிறது. பின்னர் வரும் ‘உரத்த குரலில்’ என்பதுடன் ஒன்றாக்காமல், மூலத்தின் இரு தனித்த வெளிப்பாடுகளையும் காக்கிறது.
- source_word: προσέπεσεν αὐτῷ
  choice: அவர் முன் விழுந்து
  rationale: ஒருவருக்கு முன்பாக விழும் பணிவு அல்லது தீவிர வேண்டுதலின் நிலையைக் குறிக்கிறது; ‘காலடியில்’ என்று மூலத்தில் இல்லாத உடல் இடத்தைத் துல்லியப்படுத்தாமல் உள்ளது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: செயல் நிகழ்ந்த விதத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: உமக்கும் எனக்கும் என்ன தொடர்பு?
  rationale: விலகியிருக்க வேண்டுமென்ற எதிர்ப்பு அல்லது மறுப்பைத் தெரிவிக்கும் செமித்தியத் தாக்கமுள்ள மரபுத்தொடரை இயல்பான தமிழில் தருகிறது. அதன் சொல்லமைப்புக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: உன்னதமான கடவுளின் மகனே
  rationale: ‘மிக உயர்ந்த கடவுள்’ என்ற பட்டத்தின் பொருளையும் இயேசுவை நேரடியாக அழைக்கும் விளிவேற்றுமையையும் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: δέομαί σου
  choice: உம்மை மன்றாடுகிறேன்
  rationale: தீவிரமான வேண்டுதலைக் காட்டும் வினையை மரியாதையும் அவசரமும் கொண்ட இயல்பான தமிழில் வழங்குகிறது.
- source_word: μή με βασανίσῃς
  choice: என்னை வேதனைப்படுத்த வேண்டாம்
  rationale: βασανίζω குறிக்கும் கடுமையான துன்புறுத்தலை, உடல் சித்திரவதை என்று தேவையின்றிக் குறுக்காமல், இச்சூழலுக்கு ஏற்ற பரந்த சொல்லால் தெரிவிக்கிறது.
theological_decisions:
- issue: தீய ஆவி இயேசுவின் அடையாளத்தை ஒப்புக்கொள்வதை மொழிபெயர்த்தல்
  choice: இயேசுவே, உன்னதமான கடவுளின் மகனே
  alternative: இயேசுவே, மிக உயர்ந்தவராகிய கடவுளின் மகனே
  rationale: பேச்சில் உள்ள கிறிஸ்துவியல் அடையாளத்தை முழுமையாகக் காக்கிறது; அதை மென்மையாக்கவோ பிற்காலக் கோட்பாட்டு வாய்ப்பாட்டால் விரிவாக்கவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் ‘உம்’ மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘அலறி’ மற்றும் ‘உரத்த குரலில்’ ஆகிய இரண்டையும் வைத்திருப்பது மூலத்தின் நோக்கமுள்ள மீளுரைப்பைக் காக்கிறது.
