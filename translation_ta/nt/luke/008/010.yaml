id: LUK.8.10
reference: Luke 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “தேவனுடைய அரசாட்சியின் மறைபொருள்களை[a] அறிந்துகொள்ள உங்களுக்குக் கொடுக்கப்பட்டிருக்கிறது. மற்றவர்களுக்கோ உவமைகளில் சொல்லப்படுகிறது; அவர்கள் பார்த்தும் காணாதபடியும், கேட்டும் புரிந்துகொள்ளாதபடியும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இரகசியங்களை” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல், சிலருக்கு மறைக்கப்பட்டும் மற்றவர்களுக்கு வெளிப்படுத்தப்பட்டும் இருக்கும் தேவனுடைய அரசாட்சியைப் பற்றிய உண்மைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பார்த்தும் காணாதபடியும், கேட்டும் புரிந்துகொள்ளாதபடியும்” என்பது ஏசாயா 6:9–10-ஐ எதிரொலிக்கிறது. இதைத் தெய்வீக நோக்கமாகவோ, நீதித்தீர்ப்பான விளைவாகவோ, இரண்டுமாகவோ புரிந்துகொள்ளலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: கொடுக்கப்பட்டிருக்கிறது
  rationale: நிறைவுற்ற தெய்வீகச் செயலின் தொடரும் விளைவை உணர்த்தும் கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; கொடுப்பவர் யார் என்பதை மூலத்தைப் போலவே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: γνῶναι
  choice: அறிந்துகொள்ள
  rationale: γινώσκω என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; வசனத்தின் இறுதியில் வரும் συνιῶσιν என்பதற்கான ‘புரிந்துகொள்ள’ என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: μυστήρια
  choice: மறைபொருள்கள்
  rationale: முன்பு மறைக்கப்பட்டிருந்து வெளிப்படுத்தப்படும் தேவனுடைய அரசாட்சியைச் சார்ந்த உண்மைகள் என்ற வேதாகமப் பொருளைத் தக்கவைக்கிறது; வெறும் தனிப்பட்ட தகவல் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: βασιλείας τοῦ θεοῦ
  choice: தேவனுடைய அரசாட்சி
  rationale: தேவனுடைய ஆளுகையையும் அவரது ஆட்சிக்குரிய தளத்தையும் உள்ளடக்கக்கூடிய இயல்பான நவீனத் தமிழ்ச் சொற்றொடர்.
- source_word: τοῖς δὲ λοιποῖς
  choice: மற்றவர்களுக்கோ
  rationale: ‘மீதியுள்ளவர்கள்/மற்றவர்கள்’ என்ற லூக்காவின் சொற்பொருளைத் தருகிறது; மாற்குவின் இணைப் பகுதியில் உள்ள ‘வெளியே இருப்பவர்கள்’ என்ற வாசகத்தை இங்கு இறக்குமதி செய்யவில்லை.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளில் சொல்லப்படுகிறது
  rationale: தமிழில் முழுமையான வாக்கியமாக அமைய கிரேக்கத்தில் விடுபட்டுள்ள சொல்லும் கருத்தை மட்டும் நிரப்பி, உவமைகள் போதனையின் வடிவம் என்பதைக் காட்டுகிறது.
- source_word: ἵνα
  choice: …படிக்கும்
  rationale: நோக்கம் அல்லது விளைவு ஆகிய இரு நுட்பங்களையும் தாங்கக்கூடிய தமிழ்க் கட்டமைப்பு; ஒன்றை மட்டும் தீர்மானித்து விடவில்லை.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: பார்த்தும் காணாதபடிக்கும்
  rationale: மூலத்தின் ‘பார்/காண்’ என்ற மீள்வடிவத்தையும் ஏசாயா எதிரொலியையும் பாதுகாக்கிறது.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: கேட்டும் புரிந்துகொள்ளாதபடிக்கும்
  rationale: கேட்பதற்கும் உணர்ந்து புரிந்துகொள்வதற்கும் உள்ள வேறுபாட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἵνα தொடர் தெய்வீக நோக்கத்தையா, நீதித்தீர்ப்பான விளைவையா குறிக்கிறது?
  choice: “அவர்கள் … இருக்கும்படிக்கும்” என்ற நோக்கம்/விளைவு இரண்டையும் தாங்கும் அமைப்பு
  alternative: “அதன் விளைவாக” என்று விளைவை மட்டும் வலியுறுத்துதல் அல்லது “ஏனெனில்” என்று நோக்கத்தின் வலிமையைத் தணித்தல்
  rationale: உவமைகள், வெளிப்படுத்துதல், நீதித்தீர்ப்பு ஆகியவற்றுக்கிடையே கிரேக்க வாசகம் வைத்திருக்கும் இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்த்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தேவனுடைய அரசாட்சி’, ‘மறைபொருள்கள்’, ‘உவமைகள்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன; கிரேக்கத்தின் இறையியல் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டாலும் முதன்மை உரையில் மெலிதாக்கப்படவில்லை.
