source:
  edition: SBLGNT
  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: ta
  text: வேறொரு விதை பாறையின்மேல்[a] விழுந்தது. அது முளைத்தபின், ஈரமில்லாததால் வாடிப்போனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘பாறை’ என்பது ஒருமையில் உள்ளது; ‘பாறை நிறைந்த நிலம்’ என்று இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: வேறொரு விதை
  rationale: நடுநிலை ஒருமைச் சொல் இங்கு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, தொடரில் வரும் அடுத்த விதையைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘விதை’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: κατέπεσεν
  choice: விழுந்தது
  rationale: விதை கீழே விழுந்த நிகழ்வை இயல்பான நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐπὶ τὴν πέτραν
  choice: பாறையின்மேல்
  rationale: πέτρα என்பது ஒருமையில் ‘பாறை’ என்று உள்ளது; ‘பாறை நிறைந்த நிலம்’ என்ற விரிவான கருத்தைச் சேர்க்காமல் மூலத்தின் தெளிவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: φυὲν
  choice: முளைத்தபின்
  rationale: விதை முளைத்த நிகழ்வு வாடிப்போவதற்கு முன் நடந்ததை இந்த இறந்தகாலப் பெயரெச்சம் குறிக்கிறது; விதைச் சூழலில் ‘முளைத்தபின்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἐξηράνθη
  choice: வாடிப்போனது
  rationale: செடி ஈரம் இழந்து உலர்ந்ததை வேளாண்மைப் படிமத்துக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: இல்லாததால்
  rationale: διά உடன் வரும் பெயர்ச்சொல் தன்மையுடைய வினையெச்ச அமைப்பு காரணத்தைக் குறிக்கிறது; ‘இல்லாததால்’ அந்தக் காரண உறவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἰκμάδα
  choice: ஈரம்
  rationale: வளர்ச்சிக்குத் தேவையான moisture அல்லது dampness என்பதே இச்சொல்லின் பொருள். ‘ஈரம்’ பொதுவாகப் புரியும் இயல்பான தமிழ்ச் சொல்; ‘சாறு’ என்பது தேவையற்ற அளவு குறிப்பானதாகிவிடும்.
