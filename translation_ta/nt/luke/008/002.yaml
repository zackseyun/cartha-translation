language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: ta
  text: மேலும், தீய ஆவிகளிலிருந்தும் நோய்களிலிருந்தும் குணமாக்கப்பட்டிருந்த சில பெண்களும் இருந்தனர்; அவர்களில் மகதலேனா என்று அழைக்கப்பட்ட மரியாளும் இருந்தாள்; அவளிடமிருந்து ஏழு பேய்கள் வெளியேறியிருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘வெளியே வந்திருந்தன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: சில பெண்கள்
  rationale: τινες என்பது பெண்களில் பெயர் குறிப்பிடப்படாத ஓர் பகுதியைக் குறிக்கிறது. ‘சில பெண்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τεθεραπευμέναι
  choice: குணமாக்கப்பட்டிருந்த
  rationale: ἦσαν என்பதுடன் சேர்ந்த நிறைவுற்ற செயப்பாட்டு வினையெச்சம், முன்பே நிகழ்ந்து அதன் விளைவு தொடர்ந்த குணமாக்குதலைக் குறிக்கிறது.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: தீய ஆவிகளிலிருந்து
  rationale: πηονηρός என்பது ‘தீய’ எனப் பொருள்படும்; மூலத்தில் ‘அசுத்த’ என்பதற்கான ἀκάθαρτος இல்லை. ஆகவே ‘தீய ஆவிகள்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: καὶ ἀσθενειῶν
  choice: நோய்களிலிருந்து
  rationale: ἀσθένεια இங்கு உடல்சார்ந்த பலவீனம் அல்லது நோயைக் குறிக்கிறது. ‘நோய்கள்’ என்பது பொதுவாசகருக்குத் தெளிவான நடை.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: மகதலேனா என்று அழைக்கப்பட்ட
  rationale: καλουμένη மரியாளை ‘மகதலேனா’ என்ற அடையாளப் பெயரால் குறிப்பிடுகிறது. இந்த வடிவம் அந்த உறவை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀφ’ ἧς
  choice: அவளிடமிருந்து
  rationale: ἀπό பிரிவு அல்லது புறப்படுதலின் மூலத்தைக் குறிக்கிறது; ‘அவளிடமிருந்து’ இயல்பான தமிழாக்கம்.
- source_word: δαιμόνια ἑπτὰ
  choice: ஏழு பேய்கள்
  rationale: δαιμόνια என்பது முன்பு வரும் பொதுவான ‘ஆவிகள்’ என்பதைக் காட்டிலும் குறிப்பாகப் பேய்களைக் குறிக்கிறது; எண்ணிக்கையும் நேரடியாகக் காக்கப்பட்டுள்ளது.
- source_word: ἐξεληλύθει
  choice: வெளியேறியிருந்தன
  rationale: ἐξέρχομαι என்பதன் இறந்தகால நிறைவுற்ற வடிவம், கதையின் நிகழ்காலத்திற்கு முன்பே அவை வெளியேறிவிட்டதைக் காட்டுகிறது.
theological_decisions:
- issue: பேய்சார் துன்புறுத்தலைக் குறிக்கும் மொழி
  choice: ‘தீய ஆவிகள்’, ‘பேய்கள்’ என ஆள்தன்மையுள்ள ஆவிக்குரிய மொழி காக்கப்பட்டுள்ளது.
  alternative: உளவியல் அல்லது உடல் நோய்களுக்கு உருவகமான மொழியாக மட்டும் எடுத்துரைத்தல்
  rationale: கிரேக்கம் πνευμάτων πονηρῶν, δαιμόνια ஆகியவற்றை ἀσθενειῶν என்பதிலிருந்து வேறுபடுத்துகிறது. எனவே ஆவிக்குரிய துன்பமும் உடல்சார்ந்த நோயும் தொடர்புடையவையாக இருந்தாலும் வேறுபட்ட வகைகளாகவே மொழிபெயர்க்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வசனம் முந்தைய வசனத்தின் தொடர்ச்சியான ஒரு கூறாக இருந்தாலும், தனி வசனமாக வாசிக்கத் தெளிவாக இருக்க ‘அவரோடு இருந்தார்கள்’, ‘அவர்களில்’ ஆகிய இணைப்புச் சொற்கள் சேர்க்கப்பட்டுள்ளன.
