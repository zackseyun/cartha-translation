id: LUK.8.50
reference: Luke 8:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: ta
  text: ஆனால் இயேசு அதைக் கேட்டு, அவனிடம், “பயப்படாதே; நம்பிக்கை மட்டும் வை[a]; அவள் காப்பாற்றப்படுவாள்[b]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பு மட்டும்” அல்லது “நம்பிக்கையுடன் இரு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவள் குணமடைவாள்” அல்லது “அவள் நலம்பெறுவாள்.” இங்குள்ள கிரேக்க வினைச்சொல் காப்பாற்றுதல், மீட்டல் அல்லது குணப்படுத்துதல் என்று பொருள்படலாம்; இச்சூழலில் மரணத்திலிருந்து உயிருக்கும் முழுநலத்துக்கும் மீட்கப்படுவதையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: அதைக் கேட்டு
  rationale: முந்தைய செய்தியைக் கேட்டதைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவம். கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழலிலிருந்து தெளிவாக இருப்பதால் ‘அதை’ என்று இயல்பாகக் குறிப்பிடப்படுகிறது.
- source_word: ἀπεκρίθη αὐτῷ
  choice: அவனிடம் ... பதிலளித்தார்
  rationale: ἀποκρίνομαι என்பதோடு வரும் வேற்றுமை உருபின் பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: Μὴ φοβοῦ
  choice: பயப்படாதே
  rationale: μή உடன் வந்துள்ள நிகழ்காலக் கட்டளை வடிவத்தின் தடையைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: μόνον πίστευσον
  choice: நம்பிக்கை மட்டும் வை
  rationale: μόνον தரும் வலியுறுத்தலையும் πιστεύω என்பதிலுள்ள நம்புதல்/சார்ந்திருத்தல் நுணுக்கத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: σωθήσεται
  choice: அவள் காப்பாற்றப்படுவாள்
  rationale: σῴζω என்பதன் ‘காப்பாற்று’ என்ற பரந்த பொருளையும் கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் காக்கிறது; இச்சூழலில் உடல்நலம் மற்றும் உயிர் மீட்பும் இதில் அடங்குகின்றன.
theological_decisions:
- issue: இயேசுவின் கட்டளையில் πιστεύω என்பதை மொழிபெயர்த்தல்
  choice: நம்பிக்கை மட்டும் வை
  alternative: நம்பு மட்டும்; நம்பிக்கையுடன் இரு
  rationale: வெறும் அறிவுசார் ஒப்புதலாக மட்டுமே புரிந்துகொள்ளப்படாமல், நம்பிக்கையையும் சார்ந்திருத்தலையும் வெளிப்படுத்துகிறது. பிற நேரடியான வடிவங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: குணப்படுத்தல்/உயிர்மீட்பு சூழலில் σωθήσεται என்பதை மொழிபெயர்த்தல்
  choice: அவள் காப்பாற்றப்படுவாள்
  alternative: அவள் குணமடைவாள்; அவள் நலம்பெறுவாள்
  rationale: ‘காப்பாற்றுதல்’ என்ற கிரேக்கச் சொல்லின் பரந்த பொருளை முதன்மை உரையில் காக்கிறது; உடல்நல மீட்பு என்ற உடனடிச் சூழல் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசி’ போன்ற மரபுசார் சொல்லுக்குப் பதிலாக இயல்பான ‘நம்பிக்கை வை’ தேர்ந்தெடுக்கப்பட்டுள்ளது. இயேசுவுக்கு மரியாதைப் பன்மை வினைமுற்றும், யவீருக்கு சூழலுக்கேற்ற ஒருமைச் சுட்டும் பயன்படுத்தப்பட்டுள்ளன.
