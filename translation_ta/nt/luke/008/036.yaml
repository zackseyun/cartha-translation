source:
  edition: SBLGNT
  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: ta
  text: அதைப் பார்த்தவர்கள், பேய் பிடித்திருந்தவர் எவ்வாறு மீட்கப்பட்டார் என்பதை அவர்களுக்குத் தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய் பிடித்திருந்தவர் எவ்வாறு குணமாக்கப்பட்டார்” அல்லது “விடுவிக்கப்பட்டார்.” கிரேக்க வினைச்சொல் சூழலுக்கேற்ப காப்பாற்றுதல், குணமாக்குதல், விடுவித்தல் அல்லது மீட்டல் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: ἀπαγγέλλω என்பதன் அறிக்கை செய்தல் அல்லது சொல்லுதல் என்ற பொருளை, நேரில் கண்டவர்கள் நிகழ்ந்ததை எடுத்துரைக்கும் இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் சொற்றொடரின் இயல்பான தொடர்ச்சியே இதை வெளிப்படுத்துவதால் தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்றதாகும்.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: அறிக்கையைப் பெற்றவர்களைக் குறிக்கும் பன்மை வேற்றுமைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: οἱ ἰδόντες
  choice: அதைப் பார்த்தவர்கள்
  rationale: நிகழ்வை நேரில் கண்டவர்களைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையை இயல்பான நவீனத் தமிழில் வழங்குகிறது; ‘அதை’ என்பது முன் நிகழ்ந்த சம்பவத்தைக் குறிக்கிறது.
- source_word: πῶς
  choice: எவ்வாறு
  rationale: என்ன நிகழ்ந்தது என்பதோடு அது எவ்விதம் நிகழ்ந்தது என்ற நுணுக்கத்தையும் காக்கிறது.
- source_word: ἐσώθη
  choice: மீட்கப்பட்டார்
  rationale: σῴζω என்பதன் காப்பாற்றுதல், மீட்டல், குணமாக்குதல் ஆகிய பரந்த பொருள் வரம்பில், பேயின் பிடியிலிருந்து விடுவிக்கப்பட்ட இச்சூழலுக்கு ‘மீட்கப்பட்டார்’ பொருத்தமாகவும் பரந்த ஒலிப்பையும் காக்குமாறும் உள்ளது.
- source_word: ὁ δαιμονισθείς
  choice: பேய் பிடித்திருந்தவர்
  rationale: பேய் ஆட்கொண்டிருந்த நபரைத் தெளிவாகக் குறிக்கிறது; மூலத்தின் ஆண்பால் வடிவத்தைத் தமிழில் தேவையின்றி ‘மனிதன்’ என்று வலியுறுத்தாமல், மரியாதையான பொதுவழக்கில் வழங்குகிறது.
theological_decisions:
- issue: பேயோட்டல்/குணமாக்கல் சூழலில் ἐσώθη (σῴζω) என்பதன் மொழிபெயர்ப்பு
  choice: மீட்கப்பட்டார்
  alternative: குணமாக்கப்பட்டார்; விடுவிக்கப்பட்டார்; காப்பாற்றப்பட்டார்
  rationale: σῴζω என்பது காப்பாற்றுதல், மீட்டல், குணமாக்குதல், விடுவித்தல் ஆகிய பொருள்களைக் கொள்ளலாம். ‘மீட்கப்பட்டார்’ என்பது பேயின் ஆதிக்கத்திலிருந்து விடுதலையான சூழலை இயல்பாகத் தெரிவிப்பதோடு, சொல்லை வெறும் உடல் குணமாக்கலாகவோ தனிப்பட்ட ஆன்மிக இரட்சிப்பாகவோ குறுக்காமல் அதன் விரிவை ஓரளவு காக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான, இயல்பான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பேய் பிடித்திருந்தவர்’ என்பது பொதுமக்களுக்கு எளிதில் புரியும் சொற்றொடர்; ‘மீட்கப்பட்டார்’ மூலச்சொல்லின் சூழல்சார் மற்றும் இறையியல் பரப்பை முற்றிலும் சுருக்காமல் காக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
