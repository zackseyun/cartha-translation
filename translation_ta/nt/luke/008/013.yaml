  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: ta
  text: பாறையின்மேல் உள்ளவர்கள், கேட்கும்போது வார்த்தையை மகிழ்ச்சியுடன் ஏற்றுக்கொள்கிறார்கள். ஆனால் இவர்களுக்கு வேர் இல்லை; சில காலம் நம்புகிறார்கள்; சோதனைக் காலத்தில்[a] விலகிவிடுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத்தூண்டலின் காலத்தில்” அல்லது “துன்பச் சோதனை வரும்போது.” கிரேக்கச் சொல் சூழலுக்கேற்ப சோதனை, துன்பச் சோதனை அல்லது பாவத்தூண்டலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: பாறையின்மேல் விழுந்த விதைக்கு ஒப்பானவர்கள்
  rationale: உவமையின் விதைப்பு உருவகத்தைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது; அதேவேளையில் ஒருமையான πέτρα என்பதைக் ‘பாறை’ என்று பாதுகாக்கிறது.
- source_word: ἀκούσωσιν
  choice: கேட்கும்போது
  rationale: ὅταν உடன் வரும் பொதுவான காலநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியுடன்
  rationale: மூலத்தின் முன்னிடைச்சொல் அமைப்பையும் உணர்ச்சியின் வலிமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: δέχονται τὸν λόγον
  choice: வார்த்தையை ... ஏற்றுக்கொள்கிறார்கள்
  rationale: δέχομαι என்பதன் ஏற்றுக்கொள்ளுதல் கருத்தையும் λόγος என்பதற்கான பரவலாகப் புரியக்கூடிய வேதாகம வழக்கையும் காக்கிறது.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: இவர்களுக்கு வேர் இல்லை
  rationale: ஒருமையான ‘வேர்’ என்ற மூல உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πρὸς καιρὸν
  choice: சிறிது காலம்
  rationale: நம்பிக்கை நீடிப்பது வரையறுக்கப்பட்ட காலமே என்பதை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: πιστεύουσιν
  choice: நம்புகிறார்கள்
  rationale: நம்பிக்கையின் தன்மை குறித்து மூலத்தில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் πιστεύω என்பதற்கு நேரடியான இணையாக அமைகிறது.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: சோதனைக் காலத்தில்
  rationale: πειρασμός என்பதிலுள்ள சோதிப்பு, நெருக்கடி, பாவத்தூண்டல் ஆகிய சாத்தியங்களைக் குறுகச் செய்யாமல் பரந்த பொருளைத் தக்கவைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἀφίστανται
  choice: விலகிப்போகிறார்கள்
  rationale: முன்னர் கொண்டிருந்த நம்பிக்கையிலிருந்து பின்வாங்குவதைத் தெரிவிக்கிறது; ‘விசுவாசத் துரோகம் செய்கிறார்கள்’ போன்ற தொழில்நுட்ப அல்லது கோட்பாட்டுச் சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: πιστεύουσιν என்பது இரட்சிக்கும் உண்மையான விசுவாசத்தையா அல்லது மேலோட்டமான நம்பிக்கையையா குறிக்கிறது
  choice: நம்புகிறார்கள்
  alternative: நம்புவதுபோல் தோன்றுகிறார்கள் / உண்மையாக நம்பி பின்னர் விலகுகிறார்கள் / மேலோட்டமாக நம்புகிறார்கள்
  rationale: அவர்கள் சிறிது காலம் நம்பி பின்னர் விலகுவதாக வசனம் கூறுகிறது; அந்த நம்பிக்கையின் கோட்பாட்டுத் தன்மையை அது தீர்மானிக்கவில்லை. எனவே மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: πειρασμός என்பதன் பொருள்
  choice: சோதனை
  alternative: பாவத்தூண்டல் / துன்பச் சோதனை
  rationale: இச்சொல் சூழலுக்கேற்ப சோதிப்பு, துன்பம் அல்லது பாவத்தூண்டலைக் குறிக்கலாம். பிரதான உரையில் பரந்த ‘சோதனை’ பயன்படுத்தப்பட்டு, வேறு சாத்தியங்கள் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
