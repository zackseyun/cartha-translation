source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: ta
  text: அவள் அவருக்குப் பின்னாலிருந்து வந்து, அவருடைய ஆடையின் விளிம்பை[a] தொட்டாள்; உடனே அவளுடைய இரத்தப்போக்கு நின்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓரத்தை” அல்லது “தொங்கலை.”
    reason: கிரேக்க κράσπεδον என்பது ஆடையின் விளிம்பு அல்லது ஓரத்தைக் குறிக்கலாம்; யூத ஆடையுடன் தொடர்புடைய தொங்கலையும் குறிக்கலாம்.
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: அவருக்குப் பின்னால் வந்து
  rationale: இயேசுவை நோக்கிப் பின்னாலிருந்து வந்த அசைவையும், முதன்மைச் செயலுக்கு முன் நிகழ்ந்த துணைச் செயலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἥψατο
  choice: தொட்டாள்
  rationale: இச்சூழலில் வலுவாகப் பற்றிக்கொண்டாள் என்று மிகைப்படுத்தாமல், வழக்கமான ‘தொடு’ என்ற பொருளைத் தருகிறது.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: அவருடைய ஆடையின் விளிம்பை
  rationale: κράσπεδον என்பது ஆடையின் விளிம்பு, ஓரம், அல்லது தொங்கலைக் குறிக்கலாம். ‘விளிம்பு’ தேவையற்ற குறிப்புத்தன்மையைத் தவிர்த்து, பரந்த பொருளைத் தக்கவைக்கிறது; ἱμάτιον என்பதற்கு பொதுவான ‘ஆடை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: விளைவு தாமதமின்றி ஏற்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: அவளுடைய இரத்தப்போக்கு நின்றது
  rationale: தொடர்ந்து இருந்த இரத்தக்கசிவு முடிவடைந்ததைத் தெளிவான நவீன தமிழில் கூறுகிறது; கிரேக்கத்தின் ‘நின்றது’ என்ற உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: κράσπεδον என்பதில் யூத ஆடையின் தொங்கல் குறித்த சாத்தியமான நுணுக்கம்
  choice: முதன்மை உரையில் ‘விளிம்பு’
  alternative: ‘ஓரம்’ அல்லது ‘தொங்கல்’
  rationale: இச்சொல் பொதுவாக ஆடையின் ஓரத்தையோ, குறிப்பாக யூத ஆடையின் தொங்கலையோ குறிக்கலாம். வசனம் தானாகவே தோரா ஆடைத் தொங்கலை வெளிப்படையாகச் சுட்டவில்லை; ஆகவே முதன்மை உரை பரந்த பொருளைக் காக்கிறது, குறிப்பான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் வகையிலும், வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
