source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ta
  text: ஆனால் இயேசு, “யாரோ ஒருவர் என்னைத் தொட்டார்; ஏனெனில் என்னிடமிருந்து வல்லமை வெளியேறியதை நான் அறிந்தேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: யாரோ ஒருவர் என்னைத் தொட்டார்
  rationale: τις என்பதன் குறிப்பிடப்படாத நபர் என்ற பொருளையும், ἅπτομαι என்பதன் நேரடியான ‘தொடுதல்’ பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐγὼ γὰρ ἔγνων
  choice: ஏனெனில் ... நான் அறிந்தேன்
  rationale: γάρ காரணத்தைச் சுட்டுகிறது; ἔγνων என்பதன் எளிய அறிவுணர்வு பொருளை ‘அறிந்தேன்’ நேரடியாகப் பாதுகாக்கிறது. வலியுறுத்தப்பட்ட ἐγώ-வை ‘நான்’ வெளிப்படுத்துகிறது.
- source_word: δύναμιν ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: என்னிடமிருந்து வல்லமை வெளியேறியதை
  rationale: δύναμις என்பதற்கு சூழலுக்கேற்ற ‘வல்லமை’ என்றும், நிறைவுற்ற வெளியேற்றத்தைக் குறிக்கும் ἐξεληλυθυῖαν என்பதற்கு ‘வெளியேறியதை’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசு வல்லமை வெளியேறியதை எவ்வாறு உணர்ந்தார் என்பதன் மொழிபெயர்ப்பு
  choice: நான் அறிந்தேன்
  alternative: நான் உணர்ந்தேன்
  rationale: ἔγνων என்பதன் அடிப்படைப் பொருள் ‘அறிந்தேன்’; ‘உணர்ந்தேன்’ என்பது உணர்வுமுறையைத் தேவையின்றி குறிப்பிட்டுவிடக்கூடும். மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் ‘அறிந்தேன்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைந்த நேரடி நடை. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
