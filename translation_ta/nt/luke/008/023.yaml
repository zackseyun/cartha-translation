translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இறங்கிவந்தது’ என்பது மூலத்தின் காட்சிப்படிமத்தைக் காக்கிறது; ‘படகு தண்ணீரால் நிரம்பிக்கொண்டிருந்தது’ என்பது சூழலால் உணர்த்தப்படும் பொருளை இயல்பாக வெளிப்படுத்துகிறது, அதேவேளையில் கிரேக்கப் பன்மை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
