source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: ta
  text: அவர்கள் படகில் சென்றுகொண்டிருந்தபோது, அவர் தூங்கிவிட்டார். அப்போது ஏரியின்மேல் ஒரு காற்றுப்புயல் இறங்கிவந்தது. படகு தண்ணீரால் நிரம்பிக்கொண்டிருந்தது[a]; அவர்கள் ஆபத்தில் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அவர்கள் நிரம்பிக்கொண்டிருந்தார்கள்.” சூழலில், படகு தண்ணீரால் நிரம்பிக்கொண்டிருந்தது என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: அவர்கள் படகில் சென்றுகொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருக்கும் பின்னணி செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்துடன் கூடிய genitive absolute அமைப்பை இயல்பான தமிழில் தருகிறது; πλέω என்பதன் படகுப் பயணப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: ἀφύπνωσεν
  choice: அவர் தூங்கிவிட்டார்
  rationale: இறந்தகால வினையின் தொடக்கநிலைப் பொருளை, வெறுமனே ‘தூங்கினார்’ என்பதற்குப் பதிலாக, தூக்கம் வந்தடைந்த நிகழ்வாகத் தெளிவாகக் காட்டுகிறது. சூழலிலிருந்து இதன் எழுவாய் இயேசு.
- source_word: κατέβη
  choice: இறங்கிவந்தது
  rationale: புயல் மேலிருந்து ஏரியின்மேல் வந்தது என்ற மூலமொழிப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: λαῖλαψ ἀνέμου
  choice: ஒரு காற்றுப்புயல்
  rationale: காற்றால் உண்டான கடுமையான புயலைக் குறிக்கும் மூலச்சொற்றொடரின் வலியுறுத்தலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: εἰς τὴν λίμνην
  choice: ஏரியின்மேல்
  rationale: εἰς என்பதன் அடிப்படைப் பொருள் ‘உள்ளே/நோக்கி’ என்றாலும், வானிலை நிகழ்வு ஏரியின் மேல் இறங்கிவந்தது என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: συνεπληροῦντο
  choice: படகு தண்ணீரால் நிரம்பிக்கொண்டிருந்தது[a]
  rationale: தொடர்ந்து நடந்த செயலை imperfect வடிவுக்கு ஏற்பக் காட்டுகிறது. கிரேக்கத்தில் எழுவாய் பன்மையாக இருப்பதால் உள்ள சொல்லமைப்புச் சிக்கலை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது; சூழலில் படகு தண்ணீரால் நிரம்புவதே குறிக்கப்படுவதாக முதன்மை உரை தருகிறது.
- source_word: ἐκινδύνευον
  choice: அவர்கள் ஆபத்தில் இருந்தார்கள்
  rationale: தொடர்ந்துகொண்டிருந்த ஆபத்துநிலையை எளிய, நவீன, கண்ணியமான தமிழில் தருகிறது.
