  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: ta
  text: இயேசு திரும்பி வந்தபோது, மக்கள் கூட்டம் அவரை வரவேற்றது[a]. ஏனெனில், அவர்கள் எல்லாரும் அவருக்காகக் காத்துக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை ஏற்றுக்கொண்டது”; கிரேக்க வினைச்சொல் ஏற்றுக்கொள்வதையோ வரவேற்பதையோ குறிக்கலாம். இச்சூழலில் அதற்குச் சாதகமான பொருள் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரை எதிர்பார்த்துக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν τὸν Ἰησοῦν
  choice: இயேசு திரும்பி வந்தபோது
  rationale: ἐν + பெயரெச்சமுற்ற வினையெச்சக் கட்டமைப்பு காலத்தைக் குறிக்கும் உட்பிரிவாக இயல்பாக மொழிபெயர்க்கப்படுகிறது. ὑποστρέφειν என்பது ‘திரும்பி வருதல்’ என்று பொருள்படும். δέ இங்கு கதையின் முன்னேற்றத்தைக் குறிக்கும் மென்மையான இணைப்புச்சொல்; தமிழில் தனியாகச் சேர்க்காமல் வாக்கியத் தொடரால் அதன் பணி வெளிப்படுகிறது.
- source_word: ἀπεδέξατο
  choice: வரவேற்றது
  rationale: இச்சூழலில் இந்த வினை சாதகமாக ஏற்றுக்கொள்ளுதல் அல்லது வரவேற்றல் என்பதைக் குறிக்கிறது. ‘வரவேற்றது’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மகிழ்ச்சியுடன்’ என்ற கருத்து சேர்க்கப்படவில்லை.
- source_word: ὁ ὄχλος
  choice: மக்கள் கூட்டம்
  rationale: கூடியிருந்த திரளான மக்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர். கூட்டுப்பெயரின் ஒருமை இயல்பை ‘வரவேற்றது’ தக்கவைக்கிறது.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: ஏனெனில், அவர்கள் எல்லாரும் அவருக்காகக் காத்துக்கொண்டிருந்தார்கள்
  rationale: γάρ வரவேற்புக்கான காரணத்தை அளிக்கிறது. πάντες என்பதன் வலியுறுத்தல் ‘எல்லாரும்’ என்று வெளிப்படையாகத் தக்கவைக்கப்படுகிறது. προσδοκῶντες என்பதன் தொடர்நிலை ‘காத்துக்கொண்டிருந்தார்கள்’ என்பதால் இயல்பாக வெளிப்படுகிறது; ‘எதிர்பார்த்துக்கொண்டிருந்தார்கள்’ என்பதும் சாத்தியம்.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
