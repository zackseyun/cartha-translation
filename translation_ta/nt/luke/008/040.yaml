  terminology: “இயேசு” என்பது நிலைபெற்ற தமிழ் வேதாகமப் பெயர்வடிவம். “வரவேற்றது” ἀπεδέξατο என்பதன் சூழல்சார்ந்த சாதகமான பொருளைச் சரியாகத் தருகிறது; “ஏற்றுக்கொண்டது” என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. “எதிர்பார்த்துக்கொண்டிருந்தார்கள்” என்ற மாற்றும் προσδοκῶντες என்பதற்குச் செல்லுபடியாகும்.
