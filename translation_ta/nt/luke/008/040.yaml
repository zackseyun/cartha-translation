translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. காரணத்தைத் தெளிவுபடுத்த ‘ஏனெனில்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொற்பொருள் மாற்றுகளை அடிக்குறிப்புகள் பாதுகாக்கின்றன; அடிக்குறிப்பு குறிகள் அவை சார்ந்த சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
