source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: ta
  text: மற்றொரு விதை நல்ல மண்ணில்[a] விழுந்தது. அது வளர்ந்து, நூறு மடங்கு விளைச்சல் கொடுத்தது[b]. இவற்றைச் சொல்லும்போது அவர் உரத்த குரலில், “கேட்கக் காதுகள் உள்ளவர் கேட்கட்டும்!”[c] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நல்ல நிலத்தில்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லடிப்படையில், ‘நூறு மடங்கு கனி கொடுத்தது.’
    reason: lexical_alternative
  - marker: c
    text: 'மரபுவழி மொழிபெயர்ப்பு: ‘கேட்கக் காதுள்ளவன் கேட்கக்கடவன்.’'
    reason: traditional_rendering
lexical_decisions:
- source_word: ἕτερον
  choice: மற்றொரு விதை
  rationale: ἕτερον என்பது நடுநிலை ஒருமையாக இருந்து, உவமையின் சூழலில் மற்றொரு விதையைக் குறிக்கிறது. தமிழில் குறிக்கப்படும் பெயரை வெளிப்படையாகச் சேர்ப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γῆν τὴν ἀγαθήν
  choice: நல்ல மண்
  rationale: விவசாயச் சூழலில் γῆ என்பது பரந்த பொருளுள்ள ‘நிலம்’ என்பதைக் காட்டிலும் பயிர் வளரும் ‘மண்’ என்று மொழிபெயர்க்கப்படுவது தெளிவானது.
- source_word: φυὲν
  choice: அது வளர்ந்து
  rationale: φύω என்ற வினையின் இறந்தகால வினையெச்சம், விதை வளர்ந்ததைத் தொடர்ந்து விளைச்சல் உண்டான நிகழ்வரிசையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐποίησεν καρπὸν
  choice: விளைச்சல் கொடுத்தது
  rationale: சொல்லடிப்படையில் ‘கனி உண்டாக்கியது’ என்றாலும், விதைப்பும் மண்ணும் சார்ந்த இந்தச் சூழலில் ‘விளைச்சல் கொடுத்தது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἑκατονταπλασίονα
  choice: நூறு மடங்கு
  rationale: விளைச்சலின் பெருக்கைச் சுட்டும் இந்தப் பெயரடையின் அளவுப் பொருளை நேராகப் பாதுகாக்கிறது.
- source_word: ταῦτα λέγων
  choice: இவற்றைச் சொல்லும்போது
  rationale: நிகழ்கால வினையெச்சம், சொல்லுதலும் உரத்த குரலில் அழைத்துச் சொல்லுதலும் ஒரே நேரத்தில் நடந்ததைத் தெரிவிக்கிறது.
- source_word: ἐφώνει
  choice: உரத்த குரலில் … என்றார்
  rationale: φωνέω இங்கு வலியுறுத்திப் பொதுவாகக் கேட்கும்படி உரைத்ததைக் குறிக்கிறது; ‘கத்தினார்’ என்பதன் தேவையற்ற கடுமையைத் தவிர்த்து அதன் குரல்வலிமையை வெளிப்படுத்துகிறது.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: கேட்பதற்குக் காதுள்ளவர்
  rationale: பெயர்ச்சொல் போல் செயல்படும் ஒருமை வினையெச்சத்தின் பொதுமனிதப் பொருளை, ஆணுக்கு மட்டும் உரியதாக ஆக்காமல் ‘உள்ளவர்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை நிகழ்காலக் கட்டளையின் வலியுறுத்தும் அழைப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் அழைப்பிலுள்ள பொதுமனித ஒருமை
  choice: கேட்பதற்குக் காதுள்ளவர் கேட்கட்டும்
  alternative: கேட்பதற்குக் காதுள்ளவன் கேட்கட்டும்
  rationale: கிரேக்க வடிவம் இலக்கண ஒருமையாக இருந்தாலும் குறிப்பாக ஆணை மட்டும் குறிக்கவில்லை. ‘உள்ளவர்’ என்பது ஒருமைத் தன்மையையும் பொதுவான அழைப்பையும் காக்கிறது; தேவையற்ற பாலினக் குறிப்பைச் சேர்ப்பதில்லை.
- issue: ‘கேட்பது’ என்பதன் செவியுணர்வு மற்றும் கீழ்ப்படிதல் சார்ந்த திறந்த பொருள்
  choice: கேட்கட்டும்
  alternative: கவனித்துக் கேட்கட்டும்
  rationale: ἀκούω என்பதிலுள்ள செவிமடுத்தல், உணர்தல், ஏற்றுக்கொள்ளுதல் ஆகிய சாத்தியமான நிழற்பொருள்களை ‘கவனித்துக்’ என்று வெளிப்படையாகத் தீர்மானிக்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. ‘உரத்த குரலில்’ என்பது வலியுறுத்திய பொதுப்பிரகடனத்தைத் தெளிவாக்குகிறது. மேற்கோளின் இறுதியில் உள்ள வியப்புக்குறி, ἐφώνει மற்றும் கட்டளையின் தீவிரத்தை வெளிப்படுத்துகிறது; சொற்களஞ்சியம் எந்தச் சமயப்பிரிவு சார்ந்த தனிப்பட்ட வழக்கையும் சார்ந்ததல்ல.
