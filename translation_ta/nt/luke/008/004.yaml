  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: ta
  text: 'ஒரு பெரிய மக்கள் கூட்டம் கூடிவந்துகொண்டிருக்கையிலும், ஊர் ஊராக மக்கள் அவரிடம் வந்துகொண்டிருக்கையிலும், அவர் ஒரு உவமையின் மூலம் பேசினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιόντος
  choice: கூடிவந்துகொண்டிருக்க
  rationale: ὄχλου πολλοῦ என்பதுடன் அமைந்துள்ள இந்த நிகழ்காலப் பங்கேற்புவினை, மக்கள் தொடர்ந்து ஒன்றுகூடி வந்துகொண்டிருந்த செயலைக் காட்டுகிறது. தமிழ் தொடர்நிலை வடிவம் அந்த நிகழ்ந்துகொண்டிருந்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதைத்தொடர்ச்சியை மட்டும் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் ‘ஆனால்’ போன்ற தேவையற்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ὄχλου πολλοῦ
  choice: பெருந்திரளான மக்கள்
  rationale: ὄχλος மக்கள்கூட்டத்தையும் πολλοῦ அதன் பெரும் அளவையும் குறிக்கின்றன. ‘பெருந்திரளான மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: ஊர் ஊராகவும் மக்கள் ... வந்துகொண்டிருக்க
  rationale: κατὰ πόλιν என்பதன் பகிர்வுப் பொருளை ‘ஊர் ஊராக’ காக்கிறது; பங்கேற்புவினையின் தொடர்நிலையை ‘வந்துகொண்டிருக்க’ வெளிப்படுத்துகிறது. ‘வும்’ முன் கூறப்பட்ட கூட்டத்துடன் இந்தக் குழுவையும் இணைக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: πρός உடன் வேற்றுமை உருபு இங்கு இயேசுவை நோக்கிய வருகையைக் குறிக்கிறது; தமிழில் ‘அவரிடம்’ என்பது இயல்பான சமமான சொல்.
- source_word: εἶπεν
  choice: கூறினார்
  rationale: பின்வரும் உவமையின் உரையை அறிமுகப்படுத்துவதற்கு ‘கூறினார்’ இயல்பானதும் கண்ணியமானதுமான தமிழ் வினைச்சொல்.
- source_word: διὰ παραβολῆς
  choice: ஓர் உவமையின் மூலம்
  rationale: διά உடன் மரபுவேற்றுமை இங்கு வழிமுறை அல்லது கூறும் முறை ஆகிய இரண்டையும் குறிக்கக்கூடும். முதன்மை உரை வழிமுறைப் பொருளை நேரடியாகக் காட்டுகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
