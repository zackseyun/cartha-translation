source:
  edition: SBLGNT
  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: ta
  text: பின்பு அவருடைய சீடர்கள், இந்த உவமையின் பொருள் என்ன என்று அவரிடம் கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “இந்த உவமை என்னவாக இருக்கலாம்?”
    reason: மூல கிரேக்கத்தின் மறைமுகக் கேள்வி வடிவத்தையும் அதன் உண்மையான நுணுக்கத்தையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: கேட்டார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ச்சியான அல்லது மீண்டும் நிகழ்ந்த கேள்வியைக் குறிக்கக்கூடும்; இங்கு இயல்பான நவீன தமிழில் எளிய இறந்தகாலம் பொருத்தமானது.
- source_word: δὲ
  choice: பின்பு
  rationale: இது மென்மையான இணைப்புச் சொல்; எதிர்மறை வேறுபாட்டை வலியுறுத்தாமல் நிகழ்வின் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: உறவையும் கற்றுக்கொள்ளும் நிலையும் தக்கவைக்கும் இயல்பான நிலையான தமிழ் சொற்றொடர்.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: இந்த உவமையின் பொருள் என்ன
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இந்த உவமை என்னவாக இருக்கலாம்’ என்பதாக இருந்தாலும், சூழலில் சீடர்கள் அதன் விளக்கத்தையே கேட்கிறார்கள்; தமிழ் வாசகருக்கு அந்த நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: παραβολή
  choice: உவமை
  rationale: நற்செய்தி நூல்களின் சூழலில் உருவகக் கதை அல்லது ஒப்புமை வழிக் கற்பித்தலைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் சொல்.
- source_word: εἴη
  choice: பொருள் என்ன
  rationale: கடந்தகால முதன்மை வினைக்குப் பின்வரும் மறைமுகக் கேள்வியில் உள்ள optative வடிவத்தின் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
