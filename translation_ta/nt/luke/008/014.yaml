source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: ta
  text: முட்செடிகளுக்குள் விழுந்ததோ, கேட்டவர்களே. அவர்கள் தங்கள் வழியில் செல்லும்போது, கவலைகள்[a], செல்வம், வாழ்க்கையின் இன்பங்கள் ஆகியவற்றால் நெருக்கப்பட்டு, முதிர்ந்த கனியை விளைவிப்பதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கவலைகள்’ என்பதற்கு ‘மனக்கலக்கங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கனியை முதிர்ச்சிக்குக் கொண்டுவருவதில்லை’ அல்லது ‘முதிர்ச்சி அடையும் அளவுக்குக் கனிகொடுப்பதில்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: முட்செடிகளுக்குள் விழுந்ததோ
  rationale: பெயர்ச்சொல் இல்லாத ஒருமை நடுநிலைப் பங்கேற்பு வடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; சூழலில் விதை குறிக்கப்பட்டாலும், மூலத்தில் இல்லாத ‘விதை’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: கேட்டவர்களைக் குறிக்கிறது
  rationale: உவமையின் விளக்க நடைக்கு ஏற்ற இயல்பான தமிழாக்கம்; அவர்கள் கேட்டார்கள் என்பதைக் கூறுகிறது, ஆனால் மூலத்தில் இவ்வசனத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்க்கவில்லை.
- source_word: μεριμνῶν
  choice: கவலைகளாலும்
  rationale: μέριμνα என்பதன் கவலை, அக்கறை, மனக்கலக்கம் ஆகிய பரப்பில் இங்கு பொதுவாகவும் இயல்பாகவும் பொருந்துகிறது.
- source_word: πλούτου
  choice: செல்வத்தாலும்
  rationale: பொருளாதார வளத்தைக் குறிக்கும் சொல்லை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: ἡδονῶν τοῦ βίου
  choice: வாழ்க்கையின் ... இன்பங்களாலும்
  rationale: βίος குறிக்கும் இவ்வுலக வாழ்வையும் ἡδοναί குறிக்கும் இன்பங்களையும் இயல்பான உரிமைத்தொடரில் காக்கிறது.
- source_word: πορευόμενοι
  choice: அவர்கள் தங்கள் வழியில் செல்லும்போது
  rationale: தொடர்ந்து நிகழும் நகர்வு அல்லது வாழ்க்கைப் பயணத்தின் சாயலை, அதை முழுமையாக உருவகமாகத் தீர்மானிக்காமல் வெளிப்படுத்துகிறது.
- source_word: συμπνίγονται
  choice: நெருக்கப்பட்டு
  rationale: முட்செடிகள் பயிரை நெரித்து வளர்ச்சியைத் தடுக்கும் உருவகத்தைத் தமிழில் காக்கிறது; ‘மூச்சுத்திணறடிக்கப்பட்டு’ என்பதைக் காட்டிலும் தாவரச் சூழலில் இயல்பானது.
- source_word: οὐ τελεσφοροῦσιν
  choice: முதிர்ந்த கனியை விளைவிப்பதில்லை
  rationale: கனி தோன்றாதது மட்டுமல்ல, அது நிறைவான முதிர்ச்சியை அடையாததையும் குறிக்கும் τελεσφορέω என்பதன் வேளாண்மை உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: முட்செடி நிலத்தில் விதைக்கப்பட்டவர்களின் தோல்வியின் இயல்பு
  choice: நெருக்கப்பட்டு முதிர்ந்த கனியை விளைவிக்காதவர்கள் என்ற வேளாண்மை உருவகம் மட்டும் காக்கப்பட்டது.
  alternative: அவர்கள் மறுபிறப்பு அடையாதவர்கள்; அல்லது உண்மையான விசுவாசிகள் ஆனால் கனியற்றவர்கள்; அல்லது தொடங்கி பின்னர் விசுவாசத்தை இழந்தவர்கள் என்று வெளிப்படையாக வரையறுத்தல்.
  rationale: இவ்வசனம் கவலைகள், செல்வம், இன்பங்கள் ஆகியவற்றின் விளைவைக் கூறுகிறது; மனந்திரும்புதல், மறுபிறப்பு, நிலைத்திருத்தல் அல்லது பலன் இழத்தல் பற்றிய பிற்காலக் கோட்பாட்டு விவாதங்களைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் மரியாதைமிக்கதுமான நடை. வேளாண்மை உருவகமும் மூலத்தின் தொடர்ச்சியான செயற்பாட்டு நுணுக்கமும் காக்கப்பட்டுள்ளன.
