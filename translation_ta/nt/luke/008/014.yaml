revisions:
- from: முட்செடிகளுக்குள் விழுந்ததோ, கேட்டவர்களைக் குறிக்கிறது. அவர்கள் தங்கள் வழியில் செல்லும்போது, வாழ்க்கையின் கவலைகளாலும்[a] செல்வத்தாலும் இன்பங்களாலும் நெருக்கப்பட்டு, முதிர்ந்த கனியை விளைவிப்பதில்லை[b].
  to: முட்செடிகளுக்குள் விழுந்ததோ, கேட்டவர்களே. அவர்கள் தங்கள் வழியில் செல்லும்போது, கவலைகள்[a], செல்வம், வாழ்க்கையின் இன்பங்கள் ஆகியவற்றால் நெருக்கப்பட்டு, முதிர்ந்த கனியை விளைவிப்பதில்லை[b].
  rationale: The revision directly renders the Greek identification of the thorny-soil referent as the people who heard, while retaining the contextual neuter participial expression without adding “seed.” It also clarifies that “of life” belongs to “pleasures,” preserves the ongoing sense of “as they go,” and retains the metaphorical choking and failure to bring fruit to maturity. Footnote anchors remain attached to the terms they explain.
