source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: ta
  text: கெரசேனரின் சுற்றுவட்டாரத்தைச் சேர்ந்த மக்கள் கூட்டம் முழுவதும், தங்களிடமிருந்து விலகிச் செல்லும்படி அவரிடம் கேட்டுக்கொண்டது; ஏனெனில், மிகுந்த பயம் அவர்களை ஆட்கொண்டிருந்தது[a]. ஆனால் அவர் ஒரு படகில் ஏறி, திரும்பிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகுந்த பயம் அவர்களைப் பிடித்திருந்தது.”
    reason: συνείχοντο என்பதிலுள்ள பிடிக்கப்பட்ட அல்லது கட்டுப்படுத்தப்பட்ட நிலையை இன்னும் உருவகமிக்க முறையில் வழங்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: கேட்டுக்கொண்டது
  rationale: ἐρωτάω இங்கு ஒரு வேண்டுகோளைத் தெரிவிப்பதைக் குறிக்கிறது. ‘கேட்டுக்கொண்டது’ என்பது வேண்டுகோளின் தன்மையை இயல்பாகக் காட்டுகிறது; ‘கெஞ்சியது’ என்று கூறி அதன் தீவிரத்தை மிகைப்படுத்துவதில்லை.
- source_word: ἅπαν τὸ πλῆθος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: ἅπαν என்பதன் முழுமைப்படுத்தும் வலிமையையும், πλῆθος என்பதன் கூட்டுப் பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: கெரசேனரின் சுற்றுப்புறப் பகுதியிலிருந்து வந்த
  rationale: περίχωρος சுற்றியுள்ள பகுதியைக் குறிக்கிறது; τῶν Γερασηνῶν அந்தப் பகுதி கெரசேனருடன் தொடர்புடையது என்பதைக் காட்டுகிறது. கூட்டம் எங்கிருந்து வந்தது என்பதைத் தமிழில் தெளிவுபடுத்த ‘வந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: தங்களைவிட்டுப் போய்விடும்படி
  rationale: அவர்களிடமிருந்து விலகிச் செல்லுமாறு கேட்டதைத் தமிழின் இயல்பான மறைமுகக் கூற்று வடிவில் வழங்குகிறது.
- source_word: φόβῳ μεγάλῳ
  choice: மிகுந்த பயத்தால்
  rationale: μέγας என்பதன் தீவிரத்தையும், இங்கு காரணம் அல்லது நிலையைச் சுட்டும் வேற்றுமைப் பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: συνείχοντο
  choice: ஆட்கொள்ளப்பட்டிருந்தார்கள்
  rationale: συνέχω இங்கு ஒரு வலிமையான உணர்வின் பிடியில் இருப்பதைக் குறிக்கிறது. இந்தத் தேர்வு அச்சத்தின் தீவிரத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ஒரு படகில் ஏறி
  rationale: படகில் நுழைந்து பயணிக்கத் தொடங்கும் செயலை இயல்பாகக் குறிக்கிறது. கிரேக்கத்தில் குறிப்புச் சுட்டி இல்லாததால் ‘ஒரு படகு’ என வழங்கப்பட்டுள்ளது.
- source_word: ὑπέστρεψεν
  choice: திரும்பிச் சென்றார்
  rationale: ὑποστρέφω என்பதன் திரும்பிச் செல்லுதல் என்ற இயக்கப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவை விலகிச் செல்லும்படி கெரசேனப் பகுதி மக்கள் கேட்டதற்கான பயத்தின் தன்மை
  choice: மிகுந்த பயமே அவர்களுடைய வேண்டுகோளைத் தூண்டியது என்று மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அது தெய்வீக வல்லமையைக் கண்ட பக்தியுணர்வான அச்சம் என்றோ, பொருளாதார இழப்பு அல்லது சமூகக் கலக்கத்தால் ஏற்பட்ட எதிர்ப்புணர்வு என்றோ விளக்குவது.
  rationale: கிரேக்க வாசகம் பயத்தின் தன்மையையோ காரணத்தையோ மேலும் வரையறுக்கவில்லை. ஆகவே அதன் பக்தி, பகைமை அல்லது கலவையான தன்மையை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான விவிலியக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கெரசேனர்’ என்பது வழங்கப்பட்ட SBLGNT வாசகமான Γερασηνῶν என்பதன் ஒலிபெயர்ப்பு. கூட்டத்தை ஒருமைத் தொகுப்பாகக் காட்டும் முதல் வாக்கியத்திற்குப் பின்னர், அதன் உறுப்பினர்களைக் குறிக்க இயல்பான பன்மை பயன்படுத்தப்பட்டுள்ளது.
