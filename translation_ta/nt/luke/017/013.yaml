  naturalness: «குரலை உயர்த்தி» மற்றும் «எங்கள்மேல் இரக்கம் காட்டும்» நவீன தரத் தமிழில் இயல்பானவை. «தலைவரே» புரிந்துகொள்ளத்தக்கது; ஆனால் ἐπιστάτα என்ற மரியாதைமிக்க அதிகார அழைப்புக்கு «ஆசிரியரே» என்பது லூக்காவின் பயன்பாட்டிலும் தமிழின் நேரடி அழைப்பு நடையிலும் அதிக இயல்பானது.
  terminology: ἐπιστάτα என்பது κύριος அல்ல; எனவே «ஆண்டவரே» என்பதைத் தவிர்ப்பது சரி. ஆயினும் «தலைவரே» பொதுத் தலைமைப் பதவியைக் குறிப்பது போல் ஒலிக்கலாம். «ஆசிரியரே» என்பது இச்சொல்லின் அதிகாரம்/மேற்பார்வை சார்ந்த அழைப்பைத் தமிழில் இயல்பாகத் தருகிறது; இது «ஆண்டவர்» என்ற இறையியல் நிறைவைச் சேர்ப்பதில்லை. அடிக்குறிப்பில் கிரேக்கச் சொற்கள் தமிழ் எழுத்துப்பெயர்ப்புடன் தரப்பட வேண்டும்.
