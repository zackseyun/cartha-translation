source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: ta
  text: அவர்களும் குரலை உயர்த்தி[a], “இயேசுவே, ஆசிரியரே[b], எங்கள்மேல் இரக்கம் காட்டும்!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “குரலை உயர்த்தி.” அல்லது, “உரத்த குரலில் கூப்பிட்டு.”
    reason: lexical_alternative
  - marker: b
    text: “ஆசிரியரே” என்பது அதிகாரமுள்ள ஒருவரை அழைக்கும் கிரேக்கச் சொல்லான எபிஸ்தாதா (epistata) என்பதன் மொழிபெயர்ப்பு; இது வழக்கமாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படும் குரியோஸ் (kyrios) என்ற சொல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்களும்
  rationale: எளிய இணைப்பைத் தக்கவைத்து, முந்தைய நிகழ்வுடன் இயல்பாகத் தொடர்கிறது.
- source_word: αὐτοὶ
  choice: அவர்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள எழுவாயைத் தமிழில் இயல்பாகத் தருகிறது; தேவையில்லாமல் ‘அவர்களே’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: ἦραν φωνὴν
  choice: குரலை உயர்த்தி
  rationale: ‘குரலை உயர்த்தினார்கள்’ என்ற மூல உருவகத்தைப் பாதுகாத்து, உரத்த குரலில் அழைத்தார்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: கிரேக்கப் பங்கேற்பு வினையைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வழங்குகிறது.
- source_word: Ἰησοῦ
  choice: இயேசுவே
  rationale: தனிப்பெயரின் விளிவேற்றுமையைத் தமிழில் நேரடி அழைப்பாகத் தருகிறது.
- source_word: ἐπιστάτα
  choice: தலைவரே
  rationale: அதிகாரமும் வழிநடத்தும் நிலையும் உடையவரை அழைக்கும் சொல்லாக இங்கு வருகிறது; κύριος என்பதற்குரிய ‘ஆண்டவர்’ என்ற சொல்லுடன் இதைக் கலக்காமல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: ἐλέησον
  choice: இரக்கம் காட்டுங்கள்
  rationale: இரக்கத்துடன் உதவுமாறு வைக்கும் அவசர வேண்டுகோளை நவீன, மரியாதையான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἡμᾶς
  choice: எங்கள்மேல்
  rationale: ‘இரக்கம் காட்டுங்கள்’ என்பதுடன் இயல்பாக இணைந்து, வேண்டுகோளின் பொருளைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: இயேசுவுக்கான ἐπιστάτα என்ற அழைப்புப்பெயர்
  choice: தலைவரே
  alternative: ஆண்டவரே
  rationale: மூலத்தில் ἐπιστάτης உள்ளது; κύριος இல்லை. ஆகவே ‘ஆண்டவரே’ என்று மொழிபெயர்ப்பது மூலத்தின் சொல் வேறுபாட்டை மறைத்து, இச்சொல் தனியாகக் கூறாத கிறிஸ்துவியல் வலிமையைச் சேர்க்கக்கூடும். ‘தலைவரே’ என்பது அதிகாரமும் வழிநடத்துதலும் குறிக்கும் மரியாதையான அழைப்பாக அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘இரக்கம் காட்டுங்கள்’ என்பது இயல்பான மரியாதை வேண்டுகோள்; கிரேக்கத்தின் ஒருமை கட்டளையைத் தமிழின் மரியாதைப் பன்மை வழக்கில் வழங்குகிறது. மூலத்தில் ‘குரல்’ ஒருமையில் இருப்பதால் அதையே தமிழிலும் தக்கவைத்துள்ளது.
