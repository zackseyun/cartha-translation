id: LUK.17.10
reference: Luke 17:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: ta
  text: அவ்வாறே நீங்களும், உங்களுக்குக் கட்டளையிடப்பட்ட அனைத்தையும் செய்து முடித்தபின், ‘நாங்கள் பயனற்ற அடிமைகள்[a]; நாங்கள் செய்யக் கடமைப்பட்டதையே செய்திருக்கிறோம்[b]’ என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தகுதியற்ற அடிமைகள்.’ கிரேக்கப் பெயரடை ‘பயன் அளிக்காதவர்’ என்ற பொருளைக் குறிக்கலாம்; இச்சூழலில் வெகுமதிக்கு உரிமைகோர இயலாதவர் என்ற நுணுக்கத்தையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செய்வது எங்கள் கடமையாக இருந்ததையே செய்திருக்கிறோம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: அவ்வாறே நீங்களும்
  rationale: முந்தைய எஜமான்–அடிமை எடுத்துக்காட்டிலிருந்து சீடர்களுக்கான பயன்பாட்டை οὕτως καὶ தெளிவாக இணைக்கிறது.
- source_word: ὅταν ποιήσητε
  choice: செய்து முடித்தபின்
  rationale: இறந்தகால வினையெச்சத்துடன் வரும் ὅταν, அடுத்து சொல்ல வேண்டிய பதிலுக்கு முன் செயல் நிறைவடைந்திருப்பதைக் குறிக்கிறது.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: உங்களுக்குக் கட்டளையிடப்பட்ட அனைத்தையும்
  rationale: διατάσσω என்பதன் அதிகாரப்பூர்வமான கட்டளை உணர்வைத் தக்கவைக்கிறது.
- source_word: λέγετε
  choice: என்று சொல்லுங்கள்
  rationale: அறிவுறுத்தலை இயல்பான நவீனத் தமிழில் நேரடி கட்டளையாக வழங்குகிறது.
- source_word: Δοῦλοι
  choice: அடிமைகள்
  rationale: சுற்றியுள்ள எஜமான்–அடிமை எடுத்துக்காட்டில் கட்டுப்பட்ட சமூக நிலையே முக்கியமானதால், பொதுவான ‘ஊழியர்கள்’ என்பதைவிட ‘அடிமைகள்’ மூலச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀχρεῖοί
  choice: தகுதியற்ற
  rationale: இங்கு கீழ்ப்படிதல் தனிப்பட்ட சிறப்புரிமையையோ வெகுமதிக்கான உரிமைக்கோரிக்கையையோ உருவாக்காது என்பதைக் காட்டுகிறது; ‘பயனற்ற’ என்ற நேரடி மாற்றின் சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: நாங்கள் செய்யக் கடமைப்பட்டிருந்ததையே
  rationale: ὀφείλω வெளிப்படுத்தும் கடமை அல்லது கட்டுப்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πεποιήκαμεν
  choice: செய்திருக்கிறோம்
  rationale: நிறைவுற்று தற்போது பொருத்தமுள்ள செயலைக் குறிக்கும் கிரேக்க நிறைவுக்காலத்தின் உணர்வைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சீடத்துவ எடுத்துக்காட்டில் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: ஊழியர்கள் / பணியாளர்கள்
  rationale: உடனடி சூழல் எஜமான்–அடிமை உறவை அடிப்படையாகக் கொண்டது. எனவே ‘அடிமைகள்’ என்பது கட்டுப்பட்ட நிலையையும் எடுத்துக்காட்டின் சொல்லாட்சிச் செறிவையும் பாதுகாக்கிறது.
- issue: ἀχρεῖοι என்பதன் பொருள்
  choice: தகுதியற்ற
  alternative: பயனற்ற / ஒன்றுக்கும் உதவாத / வெகுமதிக்கு உரிமைகோர முடியாத
  rationale: இச்சொல் பயனின்மை என்ற பொருளைக் கொண்டிருக்கலாம்; ஆனால் இச்சூழலில் கீழ்ப்படிதலால் எஜமானிடம் கூடுதல் நன்மையையோ வெகுமதியையோ கோரும் உரிமை ஏற்படாது என்பதே மையம். ‘தகுதியற்ற’ என்பதை முதன்மை உரையில் வைத்து, அதன் கடினமான நேரடி சாத்தியத்தை அடிக்குறிப்பில் தருவது பொருள் இழப்பையும் தேவையற்ற மிகைப்படுத்தலையும் தவிர்க்கிறது.
- issue: கீழ்ப்படிதலும் தகுதிச்சிறப்பும்
  choice: செய்ய வேண்டிய கடமையை மட்டுமே செய்ததாக ஒப்புக்கொள்ளுதல்
  alternative: கீழ்ப்படிதல் தனிச்சிறப்பான வெகுமதிக்கான உரிமையை உருவாக்குகிறது
  rationale: ὀφείλω கடமையைச் சுட்டுகிறது; வசனம் கீழ்ப்படிதலின் மதிப்பை மறுப்பதல்ல, அது எஜமானை அடிமைக்குக் கடன்பட்டவராக்காது என்பதைக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்கதாயும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘அவ்வாறே’ முந்தைய எடுத்துக்காட்டுடனான தொடர்பைத் தக்கவைக்கிறது. மூலத்தின் எஜமான்–அடிமை சமூக உருவகத்தை மென்மைப்படுத்தாமல், ἀχρεῖοι என்பதிலுள்ள பொருள் நெருக்கடியை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
