source:
  edition: SBLGNT
  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: ta
  text: கட்டளையிடப்பட்டவற்றைச் செய்ததற்காக அவன் அந்த அடிமைக்கு நன்றி சொல்வானா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘அடிமை’ என்பதற்குப் பதிலாகச் சூழலுக்கு ஏற்ப ‘பணியாள்’ என்றும், ‘பிணைப்பிலுள்ள அடிமை’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: …சொல்வானா?
  rationale: μὴ உடன் வரும் இக்கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது. தமிழில் சூழலால் மறுப்புப் பதிலை உணர்த்தும் இயல்பான வினா வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔχει χάριν
  choice: நன்றி சொல்வானா
  rationale: ἔχειν χάριν τινί என்பது ஒருவருக்கு நன்றியுடையவனாக இருப்பதை அல்லது நன்றி தெரிவிப்பதைக் குறிக்கும் மரபுத்தொடர். ‘நன்றி சொல்வானா’ என்பது இயல்பான, சுருக்கமான தமிழ்.
- source_word: δούλῳ
  choice: அடிமைக்கு
  rationale: இங்கு எஜமானின் அதிகாரத்திற்குக் கீழ்ப்பட்டு கட்டளையை நிறைவேற்றக் கடமைப்பட்ட நிலை கருத்தின் மையமாக இருப்பதால், சமூக ஏற்றத்தாழ்வை மென்மைப்படுத்தாமல் ‘அடிமை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: …செய்ததற்காக
  rationale: ὅτι இங்கு நன்றி செலுத்துவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘செய்ததற்காக’ அந்தக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποίησεν
  choice: செய்த
  rationale: ποιέω இங்கு கொடுக்கப்பட்ட கட்டளையை நிறைவேற்றுவதைக் குறிக்கிறது; ‘செய்த’ என்பது எளிமையும் போதிய துல்லியமும் உடையது.
- source_word: τὰ διαταχθέντα
  choice: கட்டளையிடப்பட்டதை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைத் தமிழில் இயல்பாகத் தருவதோடு, மூலத்தின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: உவமையின் எஜமான்–அடிமைச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாள் / வேலைக்காரன்
  rationale: வசனத்தின் தர்க்கம், கட்டளைக்குக் கீழ்ப்பட்டு நடப்பது அந்த நபரின் கடமை என்ற நிலையையே சார்ந்துள்ளது. ‘அடிமை’ அதிகாரச் சமமின்மையையும் அக்காலச் சமூக நிதர்சனத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மறுப்புப் பதிலை எதிர்பார்க்கும் கிரேக்க வினா, தமிழில் சூழலால் அதே எதிர்பார்ப்பை உணர்த்தும் நேரடி வினாவாக வழங்கப்பட்டுள்ளது.
