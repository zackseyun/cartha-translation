id: LUK.17.7
reference: Luke 17:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: ta
  text: “உங்களில் யாராவது, உழுகிற அல்லது மந்தை மேய்க்கிற ஓர் அடிமையை[a] வைத்திருந்தால், அவன் வயலிலிருந்து வந்ததும் அவனிடம், ‘உடனே வந்து உணவு மேசையில் சாய்ந்து அமர்[b]’ என்று சொல்வாரா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமை’ என்பதற்கான கிரேக்கச் சொல் டூலோஸ்; சூழலைப் பொறுத்து இதை ‘வேலைக்காரன்’, ‘பணியாள்’ அல்லது ‘கட்டுண்ட பணியாளர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘உணவு மேசையில் சாய்ந்து அமர்’ என்பது பண்டைய காலத்தில் உணவருந்தும்போது சாய்ந்து அமரும் வழக்கைக் குறிக்கிறது; கருத்தளவில், ‘சாப்பிட அமர்’ என்று பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: அடிமை
  rationale: இச்சொல் கூலித் தொழிலாளியை அல்ல, எஜமானின் அதிகாரத்துக்குக் கட்டுப்பட்ட அடிமையைக் குறிக்கிறது. உவமையின் சமூக மற்றும் சொற்பொழிவியல் வலிமையை ‘அடிமை’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀροτριῶντα
  choice: உழுகிற
  rationale: நிலத்தை ஏரால் உழும் குறிப்பிட்ட வேளாண் பணியை இயல்பான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: ποιμαίνοντα
  choice: மந்தை மேய்க்கிற
  rationale: மேய்ப்பனாக மந்தையைப் பராமரிக்கும் செயலைக் குறிக்கிறது; கிரேக்கத்தில் விலங்கு வகை குறிப்பிடப்படாததால் ‘ஆடுகள்’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: அவன் வயலிலிருந்து வந்ததும்
  rationale: எஜமான் பேசுவதற்கு முன் அடிமை வயலிலிருந்து வந்திருப்பதைச் சுட்டும் காலத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐρεῖ αὐτῷ
  choice: அவனிடம் ... என்று சொல்வாரா
  rationale: எதிர்கால வினையையும், எதிர்மறையான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: Εὐθέως
  choice: உடனே
  rationale: கட்டளையின் உடனடித்தன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: παρελθὼν
  choice: வந்து
  rationale: ἀνάπεσε என்பதோடு இணைந்த துணைச்செயலாக, உணவிடத்துக்கு வருமாறு சொல்லும் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνάπεσε
  choice: உணவுப் பந்தியில் சாய்ந்து அமர்ந்துகொள்
  rationale: பண்டைய காலத்தில் உணவின்போது சாய்ந்து அமரும் வழக்கை வெளிப்படையாகப் பாதுகாக்கிறது; இது வெறுமனே ‘சாப்பிட உட்கார்’ என்பதைக் காட்டிலும் வரலாற்றுச் சூழலுக்கு நெருக்கமானது.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன்; பணியாள்; கட்டுண்ட பணியாளர்
  rationale: வசனத்தின் வாதம் எஜமானுக்கும் அடிமைக்கும் இடையிலான சமமற்ற அதிகார உறவைச் சார்ந்துள்ளது. ‘அடிமை’ அந்த சமூக வலிமையைப் பாதுகாக்கிறது; அதே நேரத்தில் பின்னாளைய தனிப்பட்ட இறையியல் கருத்துகள் எதையும் உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மந்தை மேய்க்கிற’ என்பது கிரேக்கத்தின் பொதுவான மேய்ப்புத் தொழிலைப் பாதுகாக்கிறது; ‘உணவுப் பந்தி’ வரலாற்று உணவுச் சூழலைத் தமிழில் இயல்பாகத் தருகிறது.
