id: LUK.17.27
reference: Luke 17:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: ta
  text: அவர்கள் உண்டுகொண்டும் குடித்துக்கொண்டும், திருமணம் செய்துகொண்டும் திருமணத்தில் கொடுக்கப்பட்டுக்கொண்டும் இருந்தார்கள்[a]; நோவா பேழைக்குள் நுழைந்த நாள்வரை அப்படியே இருந்தார்கள்; பெருவெள்ளம் வந்து அனைவரையும் அழித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சுருக்கமாக, “திருமணம் செய்துகொண்டும் திருமணத்தில் கொடுக்கப்பட்டுக்கொண்டும் இருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இரண்டு வேறுபட்ட வினைகள் உள்ளன: ஒன்று செய்வினை (“திருமணம் செய்துகொண்டார்கள்”); மற்றொன்று செயப்பாட்டு வினை (“திருமணத்தில் கொடுக்கப்பட்டார்கள்”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: சாப்பிட்டுக்கொண்டும் குடித்துக்கொண்டும் ... இருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது வழக்கமாக நடைபெற்ற செயல்களைக் குறிக்கும் imperfect வினைகளின் இயல்பைத் தமிழில் தொடர் வினையெச்சங்களும் ‘இருந்தார்கள்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἐγάμουν
  choice: திருமணம் செய்துகொண்டும்
  rationale: செய்வினை வடிவத்தையும், நடைபெற்று வந்த இயல்பான சமூகச் செயலையும் வெளிப்படுத்துகிறது; கிரேக்கம் தெளிவாகக் கூறாத பாலினத்தைத் தமிழ் மொழிபெயர்ப்பு தேவையின்றி வரையறுக்கவில்லை.
- source_word: ἐγαμίζοντο
  choice: திருமணம் செய்துகொடுக்கப்பட்டுக்கொண்டும்
  rationale: முந்தைய செய்வினையிலிருந்து வேறுபட்டுள்ள கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. இவ்வடிவம் ஒருவர் திருமணத்தில் கொடுக்கப்படுவதைக் குறிக்கிறது.
- source_word: ἄχρι ἧς ἡμέρας
  choice: நோவா பேழைக்குள் நுழைந்த நாள்வரை
  rationale: தொடர்ந்து நடந்த செயல்களுக்கு ஒரு கால எல்லையைத் தெளிவாகவும் இயல்பான தமிழிலும் குறிக்கிறது.
- source_word: κιβωτόν
  choice: பேழை
  rationale: நோவாவின் பெருவெள்ள நிகழ்வில் κιβωτός என்பதற்கான மரபான, பொருத்தமான தமிழ்ச் சொல்.
- source_word: κατακλυσμός
  choice: பெருவெள்ளம்
  rationale: ஆதியாகம நிகழ்வைக் குறிக்கும் தெளிவான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வழக்கு.
- source_word: ἀπώλεσεν πάντας
  choice: அவர்கள் அனைவரையும் அழித்தது
  rationale: πάντας குறிக்கும் மனிதர்களைத் தமிழில் வெளிப்படையாக்கி, ஒருவரும் விடுபடாத முழுமையையும் காக்கிறது.
theological_decisions:
- issue: இரண்டு திருமண வினைகளையும் தனித்தனியாக மொழிபெயர்த்தல்
  choice: திருமணம் செய்துகொண்டும் திருமணம் செய்துகொடுக்கப்பட்டுக்கொண்டும்
  alternative: திருமணம் செய்துகொண்டும் திருமணம் செய்துகொடுக்கப்பட்டும்
  rationale: கிரேக்கத்தில் ஒன்றுக்கொன்று வேறுபட்ட செய்வினை மற்றும் செயப்பாட்டு வினைகள் உள்ளன. அவற்றின் வேறுபாட்டைக் காப்பது, நியாயத்தீர்ப்புவரை இயல்பான சமூக வாழ்க்கை தொடர்ந்ததை மூலத்திற்கு நெருக்கமாக வெளிப்படுத்துகிறது; கூடுதல் கோட்பாட்டுப் பொருள் எதையும் புகுத்தவில்லை.
- issue: தொடக்க வினைத்தொடரின் aspect
  choice: தொடர் வினையெச்சங்கள் + ‘இருந்தார்கள்’
  alternative: ‘சாப்பிட்டார்கள், குடித்தார்கள்...’ என்ற எளிய இறந்தகாலம்
  rationale: imperfect வடிவங்கள் தொடர்ந்து அல்லது வழக்கமாக நடந்த செயல்களைச் சித்தரிக்கின்றன. தமிழ் தொடர் அமைப்பு, திடீரென வந்த அழிவுவரை அன்றாட வாழ்க்கை நடந்துகொண்டிருந்ததைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. imperfect வினைத்தொடர் தமிழில் இயல்பாக அமைய இரண்டாவது வாக்கியத்தில் ‘இப்படியே நடந்தது’ எனக் கால எல்லை தெளிவாக்கப்பட்டுள்ளது. ‘பேழை’ மற்றும் ‘பெருவெள்ளம்’ ஆகியவை வேதாகமச் சூழலில் பரிச்சயமான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
