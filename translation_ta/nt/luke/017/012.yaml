theological_decisions:
- issue: λεπροί குறிக்கும் நோயின் தன்மை
  choice: தொழுநோயுற்ற பத்து ஆண்கள்
  alternative: தொழுநோய் உள்ள பத்து ஆண்கள்; தோல் நோயுற்ற பத்து ஆண்கள்
  rationale: இச்சொல் பண்டைய உலகின் நோய்வகைப்பாட்டைச் சார்ந்தது; அதை நவீன மருத்துவத்தில் துல்லியமாக வரையறுக்கப்படும் Hansen நோயுடன் மட்டும் ஒப்பாக்கக் கூடாது. எனினும் வாசகர்களுக்குப் பழக்கமான ‘தொழுநோய்’ என்ற மரபான சொல்லை வைத்து, அதன் வரம்பை அடிக்குறிப்பில் தெளிவுபடுத்துவது வாசிப்புத் தெளிவையும் மூலநூல் எச்சரிக்கையையும் சமநிலைப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட வாக்கிய அமைப்பு தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், நிகழ்வுகளின் வரிசையும் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
