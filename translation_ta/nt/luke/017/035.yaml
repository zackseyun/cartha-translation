- from: இரண்டு பெண்கள் ஒரே இடத்தில் தானியம் அரைத்துக்கொண்டிருப்பார்கள்[a]; ஒருத்தி அழைத்துக்கொள்ளப்படுவாள்[b], மற்றவளோ விட்டுவிடப்படுவாள்.
  to: இரண்டு பெண்கள் ஒரே இடத்தில் அரைத்துக்கொண்டிருப்பார்கள்[a]; ஒருத்தி எடுத்துக்கொள்ளப்படுவாள்[b], மற்றவள் விடப்படுவாள்.
