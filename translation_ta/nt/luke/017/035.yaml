source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: ta
  text: இரண்டு பெண்கள் ஒரே இடத்தில் அரைத்துக்கொண்டிருப்பார்கள்[a]; ஒருத்தி எடுத்துக்கொள்ளப்படுவாள்[b], மற்றவள் விடப்படுவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றாக.” கிரேக்கச் சொற்றொடர் “ஒன்றாக” அல்லது “ஒரே இடத்தில்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எடுத்துக்கொள்ளப்படுவாள்” என்பது, அவள் மீட்புக்காகவா தீர்ப்புக்காகவா எடுத்துக்கொள்ளப்படுகிறாள் என்பதைத் தானாகக் குறிப்பிடுவதில்லை; இதன் பொருள் விரிவான சூழலின் அடிப்படையில் மட்டுமே புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο
  choice: இரண்டு பெண்கள் ... இருப்பார்கள்
  rationale: எதிர்காலக் காட்சியை இயல்பான தமிழில் தருகிறது; பெண்பால் பன்மை வினையெச்சமான ἀλήθουσαι காரணமாக ‘பெண்கள்’ வெளிப்படையாகச் சேர்க்கப்படுகிறது.
- source_word: ἀλήθουσαι
  choice: தானியம் அரைத்துக்கொண்டிருப்பார்கள்
  rationale: ἀλήθω அரைக்கும் செயலைக் குறிக்கிறது; சூழலில் அரைக்கப்படும் பொருள் தானியம் என்பதால், நவீன வாசகருக்குத் தெளிவாக ‘தானியம்’ சேர்க்கப்படுகிறது.
- source_word: ἐπὶ τὸ αὐτό
  choice: ஒரே இடத்தில்
  rationale: இந்தச் சொற்றொடர் ‘ஒன்றாக’ அல்லது ‘ஒரே இடத்தில்’ எனப் பொருள்படலாம். இடச்சார்ந்த அடிப்படைப் பொருளை முதன்மை உரை தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ μία
  choice: ஒருத்தி
  rationale: இரண்டு பெண்களில் ஒருவரை வேறுபடுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: παραλημφθήσεται
  choice: அழைத்துக்கொள்ளப்படுவாள்
  rationale: παραλαμβάνω என்பதன் ‘தன்னுடன் எடுத்துக்கொள்/அழைத்துக்கொள்’ என்ற தொடர்புணர்வைத் தக்கவைக்கிறது; அழைத்துக்கொள்ளப்படுவது மீட்புக்கா தீர்ப்புக்கா என்பதைச் சொல் தானாக நிர்ணயிப்பதில்லை.
- source_word: ἡ δὲ ἑτέρα
  choice: மற்றவளோ
  rationale: δέ காட்டும் எதிர்மறை ஒப்பீட்டையும், இரண்டாவது பெண்ணின் வேறுபாட்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀφεθήσεται
  choice: விட்டுவிடப்படுவாள்
  rationale: ἀφίημι என்பதன் இச்சூழலுக்குரிய ‘விடப்படுதல்’ பொருளை நேரடியாகத் தருகிறது; ‘கைவிடப்படுவாள்’ போன்ற கூடுதல் எதிர்மறை நிழற்பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: அழைத்துக்கொள்ளப்படுபவளும் விட்டுவிடப்படுபவளும் முறையே மீட்பையா தீர்ப்பையா அடைகிறார்கள் என்பது
  choice: இரு செயல்களையும் மதிப்பீடு செய்யாமல், ‘அழைத்துக்கொள்ளப்படுவாள் ... விட்டுவிடப்படுவாள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒருத்தி மீட்புக்காக எடுத்துக்கொள்ளப்படுவாள்’ அல்லது ‘ஒருத்தி தீர்ப்புக்காக எடுத்துக்கொள்ளப்படுவாள்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: வசனம் பிரித்தல் நிகழ்வை மட்டும் கூறுகிறது; அழைத்துக்கொள்ளப்படுதல் அல்லது விட்டுவிடப்படுதல் எதைக் குறிக்கிறது என்பதை வெளிப்படையாகத் தீர்மானிப்பதில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘ஒருத்தி/மற்றவளோ’ என்ற வடிவங்கள் பெண் குறிப்பு மற்றும் எதிர்மறை ஒப்பீட்டை இயல்பாகத் தருகின்றன. மூலத்தில் உள்ள பொருள் இருமை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
