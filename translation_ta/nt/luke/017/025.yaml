source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: ta
  text: ஆனால், முதலில் அவர் பல பாடுகளை அனுபவித்து, இந்தத் தலைமுறையினரால் நிராகரிக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: முதலில்
  rationale: கால வரிசையில் முன்னுரிமையைக் குறிக்கும் வினையடைப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மென்மையான முரண்பாட்டையும் கருத்துத் திருப்பத்தையும் வெளிப்படுத்துகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: லூக்காவில் காணப்படும் அவசியத்தின் வலிமையைத் தக்கவைக்கிறது; அது இறைத்திட்டத்தின்படி நிகழ்வதை விளக்க உரையாகச் சேர்க்கவில்லை.
- source_word: αὐτὸν
  choice: அவர்
  rationale: முந்தைய சூழலில் குறிப்பிடப்படும் மனுமகனை மரியாதையான, இயல்பான தமிழில் சுட்டுகிறது.
- source_word: πολλὰ παθεῖν
  choice: பல பாடுகளை அனுபவித்து
  rationale: πολλά என்பதன் பன்முகத் துன்பங்களையும் πάσχω என்பதன் பாடுபடும் பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀποδοκιμασθῆναι
  choice: புறக்கணிக்கப்பட
  rationale: ஆராய்ந்து ஏற்கத் தகாதவர் என நிராகரிக்கும் வினையின் வலிமையைத் தருகிறது; வெறும் கவனிக்காமையை மட்டும் குறிக்காமல் சூழலில் நிராகரிப்பை உணர்த்துகிறது.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையினரால்
  rationale: செயப்பாட்டு வினையுடன் ἀπό காட்டும் செயலாற்றுபவரைத் தமிழில் தெளிவாகக் குறிக்கிறது; γενεά என்பதன் சமகாலத் தலைமுறைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: மனுமகன் பாடுபடுவதுடன் தொடர்புடைய δεῖ என்பதன் வலிமை
  choice: “வேண்டும்” என்று மொழிபெயர்த்து அவசியத்தைப் பாதுகாத்தல்
  alternative: “அவசியமாயிருக்கிறது” அல்லது இதை வெளிப்படையாக இறைத்திட்டத்தின் நிறைவேற்றம் என விரித்துரைத்தல்
  rationale: லூக்காவில் δεῖ பெரும்பாலும் இறைநோக்குடன் தொடர்புடைய அவசியத்தைச் சுமக்கிறது. எனினும் இவ்வசனம் அதை வெளிப்படையாக விளக்காததால், மொழிபெயர்ப்பு “வேண்டும்” என்பதன் மூலம் அந்தத் தெய்வீக எடையை மறைமுகமாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. “இந்தத் தலைமுறையினரால்” என்பது கூட்டத்தைக் குறிப்பதால் பன்மை மனிதச் சுட்டைத் தெளிவாக்குகிறது.
