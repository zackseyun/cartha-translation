source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: ta
  text: ஏனெனில், வானத்தின் கீழுள்ள ஒரு பகுதியிலிருந்து வானத்தின் கீழுள்ள மறுபகுதிவரை மின்னல் மின்னி ஒளிவீசுவது போல[a], மனிதமகனும் தமது நாளில்[b] அப்படியே இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வழக்கமான தமிழில், ‘வானத்தின் ஒரு முனையிலிருந்து மறுமுனைவரை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘வானத்தின் கீழ்’ என்ற சொற்றொடர் இரு பகுதிகளிலும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவருக்குரிய நாளில்.’ இச்சொற்றொடர் மனிதமகனோடு தொடர்புடைய காலத்தைக் குறிக்கிறது; அதன் பொருள் இங்கே மேலும் குறுக்கி வரையறுக்கப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், ... போல
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் ὥσπερ என்பதன் ஒப்புமை அமைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: மின்னல் மின்னி
  rationale: பெயர்ச்சொல்லுக்கும் அதனுடன் தொடர்புடைய பங்கேற்பு வினைக்கும் இடையிலான சொல் ஒலிப்பையும் உயிரோட்டமான செயற்பாட்டையும் முடிந்தவரை காக்கிறது.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: வானத்தின் கீழுள்ள ஒரு பகுதியிலிருந்து வானத்தின் கீழுள்ள மறுபகுதிவரை
  rationale: மூலத்தில் இருமுறை வரும் ‘வானத்தின் கீழ்’ என்ற அமைப்பை வெளிப்படையாகத் தக்கவைத்து, தமிழில் புரியும்படி விடுபட்டுள்ள ‘பகுதி’ என்னும் கருத்தை நிறைவு செய்கிறது.
- source_word: λάμπει
  choice: ஒளிவீசுவது
  rationale: முன்னுள்ள ἀστράπτουσα என்பதிலிருந்து வேறுபட்ட வினையாக இதைக் காட்டி, மின்னுதல் மற்றும் ஒளிவீசுதல் ஆகிய இரண்டையும் தக்கவைக்கிறது.
- source_word: οὕτως ἔσται
  choice: அப்படியே இருப்பார்
  rationale: ஒப்புமையையும் எதிர்கால இருப்பைக் குறிக்கும் எளிய வாக்கியத்தையும், வெளிப்படுதல் அல்லது வருதல் என்று விரிவுபடுத்தாமல் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதமகன்
  rationale: இயேசுவின் பட்டப்பெயரை விளக்கவுரையாக மாற்றாமல், தெளிவான நேரடி தமிழில் வழங்குகிறது.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: தமது நாளில்
  rationale: αὐτοῦ என்பதன் உடைமைப் பொருளையும், அந்த நாள் மனிதமகனோடு தொடர்புடையது என்ற பரந்த குறிப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் ‘மனிதமகன் தமது நாளில்’ என்பதன் பொருள்
  choice: ‘தமது நாளில்’ என்று விரிவாக்கமின்றி வைத்தல்
  alternative: ‘அவர் வரும்போது’ அல்லது ‘நியாயத்தீர்ப்பு நாளில்’
  rationale: சூழல் இறுதிக்காலத்தைப் பற்றியதாக இருந்தாலும், கிரேக்கம் இங்கு ‘அவருடைய நாளில்’ என்று மட்டுமே கூறுகிறது. மேலும் குறிப்பிட்ட நிகழ்வை மொழிபெயர்ப்பில் சேர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமப் பட்டப்பெயரின் செறிவும் காக்கப்பட்டுள்ளன. மூலத்தின் மீளுரையும் ‘மின்னி/ஒளிவீசுவது’ என்ற இரு வேறு வினைகளும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
