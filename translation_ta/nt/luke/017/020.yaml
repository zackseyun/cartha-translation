id: LUK.17.20
reference: Luke 17:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: ta
  text: 'தேவனுடைய அரசு எப்போது வருகிறது என்று பரிசேயர்கள் அவரிடம் கேட்டபோது, அவர் அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “தேவனுடைய அரசு கவனிக்கத்தக்க வகையில் வருவதில்லை[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கவனிப்புடன்,” “கவனிக்கத்தக்க விதத்தில்,” அல்லது “கூர்ந்து கவனித்தல் மூலம்.”'
    reason: παρατήρησις என்பதற்கு கவனிப்பு, கூர்ந்து நோக்குதல், கண்காணித்தல் ஆகிய பொருள் வாய்ப்புகள் உள்ளன. முதன்மை வாசகம் வெளிப்படையான அடையாளங்களைச் சேர்க்காமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: பரிசேயர்கள் அவரிடம் கேட்டபோது
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தை இயல்பான தமிழ் காலவாக்கியமாக வழங்குகிறது; δέ-யின் மெலிதான உரைமாற்றத்தைச் சூழல் போதுமான அளவு காட்டுவதால் தனிச் சொல் சேர்க்கப்படவில்லை.
- source_word: πότε ἔρχεται
  choice: எப்போது வருகிறது
  rationale: நிகழ்கால வடிவத்தையும், வருகையின் நேரத்தைப் பற்றிய நேரடிக் கேள்வியையும் பாதுகாக்கிறது; தமிழில் எதிர்நோக்கிய வருகைக்கும் இவ்வடிவம் இயல்பானது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: தேவனுடைய அரசு
  rationale: βασιλεία என்பதன் ஆட்சி/அரசுரிமை மற்றும் அரசு என்ற பொருள் பரப்பைத் திறந்தவாறு வைக்கும், அறிமுகமான தமிழாக்கம்.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: அவர் அவர்களுக்குப் பதிலளித்துச் சொன்னார்
  rationale: மூலத்தில் உள்ள இரட்டை வினை அமைப்பைப் பொருத்தமான தமிழில் தக்கவைக்கிறது.
- source_word: Οὐκ ἔρχεται
  choice: வருவதில்லை
  rationale: அரசின் வருகை நிகழும் முறையைப் பற்றிய பொதுவான மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετὰ παρατηρήσεως
  choice: கவனித்தறியக்கூடிய அடையாளங்களுடன்
  rationale: παρατήρησις குறிக்கும் கவனிப்பு, கண்காணிப்பு, கூர்ந்து நோக்குதல் ஆகிய சாத்தியங்களைச் சுருக்கமாக வெளிப்படுத்துகிறது; வெளிப்புற அறிகுறிகளால் வருகையைத் தடமறியலாம் என்று மிகையாக உறுதிப்படுத்தாது.
theological_decisions:
- issue: தேவனுடைய அரசின் வருகையைப் பற்றிய இயேசுவின் மறுப்பின் பொருள்
  choice: அரசு கவனித்தறிந்து தடமறியக்கூடிய அடையாளங்களுடன் வருவதில்லை
  alternative: அரசை எந்த வகையிலும் காணவோ உணரவோ முடியாது; அல்லது இறுதிக்கால அடையாளங்கள் அனைத்தையும் இயேசு மறுக்கிறார்
  rationale: μετὰ παρατηρήσεως என்ற சொற்றொடரின் கண்காணிக்கத்தக்க வெளிப்பாடு என்ற நுணுக்கத்தைத் தக்கவைத்து, எல்லா உணர்தலையும் அல்லது எல்லா இறுதிக்கால அடையாளங்களையும் மறுப்பதாக வசனத்தை விரிவாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாட்சிக்காக “தேவனுடைய அரசு” பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
