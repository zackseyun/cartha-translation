revisions:
- from: 'தேவனுடைய அரசு எப்போது வருகிறது என்று பரிசேயர்கள் அவரிடம் கேட்டபோது, அவர் அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “தேவனுடைய அரசு கவனித்தறியக்கூடிய அடையாளங்களுடன் வருவதில்லை.[a]”'
  to: 'தேவனுடைய அரசு எப்போது வருகிறது என்று பரிசேயர்கள் அவரிடம் கேட்டபோது, அவர் அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “தேவனுடைய அரசு கவனிக்கத்தக்க வகையில் வருவதில்லை[a].”'
