  text: Remember Lot's wife[a][b].
translation:
  language: ta
  text: லோத்தின் மனைவியை நினைவில் கொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 19:26-ஐக் காண்க. சோதோம் அழிக்கப்பட்டபோது லோத்தின் மனைவி பின்னால் திரும்பிப் பார்த்த நிகழ்வை இது சுட்டிக்காட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: நினைவில் கொள்ளுங்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல், இரண்டாம் நபர் பன்மை. தமிழில் நேரடியான, இயல்பான எச்சரிக்கைத் தொனியைத் தரும் பன்மை மரியாதை ஏவலாக இது அமைகிறது; சூழலில் வெறும் நினைவுகூருதலைவிட அவளுக்கு நேர்ந்ததை மனதில் கொண்டு எச்சரிக்கையாக இருப்பதையும் உணர்த்துகிறது.
- source_word: τῆς γυναικὸς
  choice: மனைவியை
  rationale: γυνή என்பது ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படலாம். Λώτ என்ற பெயருடனான உடைமை உறவில் இங்கு ‘மனைவி’ என்பதே தெளிவான பொருள்.
- source_word: Λώτ
  choice: லோத்
  rationale: தனிப்பெயர் தமிழின் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபின்படி ‘லோத்’ என வழங்கப்படுகிறது; வேற்றுமை உருபுடன் ‘லோத்தின்’ ஆகிறது.
theological_decisions:
- issue: எச்சரிக்கையின் சுருக்கமான மறைசுட்டு
  choice: லோத்தின் மனைவியை நினைவில் கொள்ளுங்கள்.
  alternative: லோத்தினுடைய மனைவியை நினைவுகூருங்கள்.
  rationale: ஆதியாகமம் 19:26 நிகழ்வை இயேசு சுருக்கமாகச் சுட்டிக்காட்டி நேரடியாக எச்சரிக்கிறார். இயல்பான தமிழ் உடைமைத் தொடரையும் ஏவல் வலிமையையும் காக்கும் வகையில் முதன்மை வடிவம் தேர்ந்தெடுக்கப்பட்டது; மறைசுட்டை விளக்கி அதன் பொருளை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான, நேரடியான எச்சரிக்கை. மூலத்தின் சொற்சுருக்கமும் மறைசுட்டுத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
