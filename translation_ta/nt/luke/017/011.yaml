source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: ta
  text: அவர் எருசலேமுக்குப் போய்க்கொண்டிருந்தபோது, சமாரியாவுக்கும் கலிலேயாவுக்கும் இடையே சென்றுகொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமாரியாவுக்கும் கலிலேயாவுக்கும் நடுவே.’ கிரேக்கத் தொடரை, இரு மண்டலங்களுக்கு இடையே சென்றதாகவோ அல்லது அவற்றைப் பிரிக்கும் எல்லைப்பகுதி வழியாகச் சென்றதாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: …போது
  rationale: லூக்கா பயன்படுத்தும் நிகழ்வை அறிமுகப்படுத்தும் தொடரை, பழமையான அல்லது செயற்கையான ‘அது சம்பவித்தது’ என்ற நடையின்றி, தமிழில் இயல்பான காலச் சூழல் வாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ πορεύεσθαι
  choice: போய்க்கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் வினையெச்சப் பெயரின் உடன்நிகழ் காலப் பொருளையும் பயணம் தொடர்ந்து நடந்துகொண்டிருந்த நிலையையும் காட்டுகிறது.
- source_word: εἰς Ἰερουσαλήμ
  choice: எருசலேமுக்கு
  rationale: εἰς குறிக்கும் இலக்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: αὐτός
  choice: அவர்
  rationale: வெளிப்படையாக உள்ள கிரேக்கப் பிரதிப்பெயரை மரியாதையான நவீன தமிழ் நடையில் தருகிறது; இவ்விடத்தில் ‘அவரே’ என்று மிகைப்படுத்த வேண்டிய அளவு வலியுறுத்தல் இல்லை.
- source_word: διήρχετο
  choice: சென்றுகொண்டிருந்தார்
  rationale: குறையிறந்தகால வினையின் தொடர்ச்சியான பயணப் பொருளைப் பாதுகாக்கிறது; இடத்தொடரின் தெளிவின்மையை வினையிலேயே தேவையின்றித் தீர்மானிப்பதில்லை.
- source_word: διὰ μέσον
  choice: இடையிலுள்ள பகுதி வழியாக
  rationale: இரு பகுதிகளுக்கு நடுவே அல்லது அவற்றின் எல்லைப்பகுதி வழியே சென்றதாகப் புரிந்துகொள்ளக்கூடிய கிரேக்கத் தொடரை இயல்பான தமிழில் தருகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: சமாரியாவுக்கும் கலிலேயாவுக்கும்
  rationale: இடப்பெயர்களைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தந்து, கிரேக்க வரிசையையும் காக்கிறது.
