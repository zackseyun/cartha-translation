- from: “‘இதோ, இங்கே!’ என்றோ, ‘அங்கே!’ என்றோ அவர்கள் சொல்லமாட்டார்கள். ஏனெனில், இதோ, கடவுளுடைய அரசு உங்கள் நடுவில் இருக்கிறது[a].”
