id: LUK.17.21
reference: Luke 17:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: ta
  text: “‘இதோ, இங்கே!’ என்றோ, ‘அங்கே!’ என்றோ யாரும் சொல்லமாட்டார்கள். ஏனெனில், கடவுளுடைய அரசு உங்கள் நடுவிலேயே இருக்கிறது[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குள் இருக்கிறது.” ἐντὸς ὑμῶν என்ற கிரேக்கச் சொற்றொடர் உள்ளார்ந்த பொருளிலோ, “உங்களிடையே / உங்கள் நடுவில்” என்ற கூட்டுப்பொருளிலோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: அவர்கள் சொல்லமாட்டார்கள்
  rationale: முந்தைய வசனத்தின் மறுப்பைத் தொடரும் எதிர்காலச் சொல்லாக்கம்; தமிழில் இயல்பான வாக்கிய அமைப்புக்காக மறுப்பு வினையில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘இதோ, இங்கே!’ என்றோ, ‘அங்கே!’ என்றோ
  rationale: இரு இடச்சுட்டுகளின் இணை அமைப்பையும் மாற்றுத் தொடர்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἰδοὺ γὰρ
  choice: ஏனெனில், இதோ
  rationale: γὰρ-இன் விளக்கத் தொடர்பையும் ἰδού-வின் கவன ஈர்ப்பையும் தனித்தனியாகக் காக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: அரசாட்சி மற்றும் ராஜ்யம் ஆகிய இரு பரிமாணங்களையும் திறந்தவையாக வைத்துக்கொண்டு, நவீன பொதுத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἐντὸς ὑμῶν
  choice: உங்கள் நடுவில்
  rationale: பன்மை கேட்போரைக் குறிக்கும் சூழலில் ‘உங்களிடையே/உங்கள் நடுவில்’ என்ற கூட்டுப்பொருள் முதன்மையாகத் தெரிகிறது; உள்ளார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐστιν
  choice: இருக்கிறது
  rationale: எளிய நிகழ்கால இருப்பை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: ἐντὸς ὑμῶν என்பதன் பொருள்
  choice: உங்கள் நடுவில்
  alternative: உங்களுக்குள்
  rationale: இயேசு பன்மையான கேட்போரிடம் பேசுவதாலும், உடனடி சூழல் காணக்கூடிய இடச்சுட்டுகளைப் பற்றியதாலும் கூட்டாக ‘உங்கள் நடுவில்’ என்பது முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது. எனினும் உள்ளார்ந்த வாசிப்பும் கிரேக்கத்தில் சாத்தியமானதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ். இடச்சுட்டுகளின் வாய்மொழித் தன்மைக்காக ‘இதோ’ பயன்படுத்தப்பட்டது; விவாதத்திற்குரிய ἐντὸς ὑμῶν என்பதன் இரு சாத்தியங்களும் பாதுகாக்கப்பட்டுள்ளன.
