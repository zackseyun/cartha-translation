review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the future negation, the paired location claims, γάρ as an explanation, and the disputed ἐντὸς ὑμῶν. However, the second ἰδού is better represented by a natural Tamil attention marker integrated with the explanatory clause rather than the somewhat stiff sequence “ஏனெனில், இதோ,”.
  naturalness: “அவர்கள் சொல்லமாட்டார்கள்” is acceptable, but “யாரும் சொல்லமாட்டார்கள்” is more idiomatic in this negative, indefinite assertion and does not alter the sense. “ஏனெனில், இதோ,” is syntactically marked in modern standard Tamil; “ஏனெனில், கடவுளுடைய அரசு உங்கள் நடுவிலேயே இருக்கிறது” communicates the explanatory force naturally.
  terminology: “கடவுளுடைய அரசு” is a defensible modern rendering of ἡ βασιλεία τοῦ θεοῦ and should be retained. “உங்கள் நடுவிலேயே” expresses the present, locating emphasis without resolving the lexical ambiguity beyond the main-text choice. The footnote preserves the viable “within you” alternative and correctly identifies the Greek phrase.
  issues:
  - severity: low
    issue: The wording “ஏனெனில், இதோ,” is awkward in contemporary Tamil.
    rationale: Although it formally mirrors ἰδοὺ γάρ, Tamil normally conveys this deictic-emphatic force through clause emphasis. Retaining a literal “இதோ” after “ஏனெனில்” sounds translated rather than natural.
  - severity: low
    issue: The subject “அவர்கள்” is less natural than an indefinite negative subject in this context.
    rationale: Greek supplies a third-person plural verb, but Tamil idiom naturally uses “யாரும் சொல்லமாட்டார்கள்” for the claim that no one will make either location announcement.
  revised_text: “‘இதோ, இங்கே!’ என்றோ, ‘அங்கே!’ என்றோ யாரும் சொல்லமாட்டார்கள். ஏனெனில், கடவுளுடைய அரசு உங்கள் நடுவிலேயே இருக்கிறது[a].”
  revised_footnotes:
