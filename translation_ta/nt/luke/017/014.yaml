base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: ta
  text: அவர் அவர்களைக் கண்டு, “நீங்கள் போய், உங்களை ஆசாரியர்களிடம் காட்டுங்கள்[a]” என்றார். அவர்கள் போய்க்கொண்டிருந்தபோதே தூய்மையாக்கப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தோல் நோயிலிருந்து குணமடைந்தவர்களை ஆசாரியர்கள் பரிசோதிக்க வேண்டும் என்ற நியாயப்பிரமாணத்தின் ஏற்பாட்டை இக்கட்டளை பிரதிபலிக்கிறது; லேவியராகமம் 14-ஐப் பார்க்கவும்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “சுத்தமாக்கப்பட்டார்கள்.” கிரேக்க வினைச்சொல் உடல்சார் குணமடைதலையும் சடங்குசார் தூய்மை பெறுதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: அவர் அவர்களைக் கண்டு
  rationale: ὁράω என்பதன் இறந்தகால வினையெச்சம் εἶπεν என்பதுடன் தொடர்கிறது. αὐτοῖς மற்றும் சூழலிலிருந்து செயப்படுபொருளான ‘அவர்களை’ தமிழில் வெளிப்படையாகக் கூறுவது இயல்பானது.
- source_word: Πορευθέντες
  choice: நீங்கள் போய்
  rationale: அடுத்துவரும் கட்டளையான ἐπιδείξατε உடன் கட்டளைப் பொருளில் செயல்படும் வினையெச்சம். ‘போய் ... காட்டுங்கள்’ என்பது செயல்களின் வரிசையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: உங்களை ... காட்டுங்கள்
  rationale: ஆசாரியர்கள் மேற்கொள்ளும் பரிசோதனைச் சூழலில் நேரடியானதும் தெளிவானதுமான மொழிபெயர்ப்பு.
- source_word: τοῖς ἱερεῦσιν
  choice: ஆசாரியர்களிடம்
  rationale: நியாயப்பிரமாணத்தின்படி தூய்மையைப் பரிசோதிக்கும் ஆசாரியர்களைக் குறிக்கிறது; தமிழில் இலக்கை இயல்பாகக் காட்ட ‘-ிடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: அவர்கள் போய்க்கொண்டிருந்தபோதே
  rationale: அவர்கள் வழியில் சென்றுகொண்டிருந்த சமயத்திலேயே தூய்மையாக்குதல் நிகழ்ந்தது என்ற உடன்நிகழ்வை இக்கட்டமைப்பு காக்கிறது.
- source_word: ἐκαθαρίσθησαν
  choice: தூய்மையாக்கப்பட்டார்கள்
  rationale: καθαρίζω என்பதன் செயப்பாட்டு வடிவம். உடல் நோயிலிருந்து நீங்குதலையும் சடங்குசார் தூய்மை பெறுதலையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் பொருள் அகலத்தை இது காக்கிறது.
theological_decisions:
- issue: தோல் நோய் மற்றும் சடங்குசார் தூய்மைச் சூழலில் καθαρίζω-வை மொழிபெயர்த்தல்
  choice: தூய்மையாக்கப்பட்டார்கள்
  alternative: குணமாக்கப்பட்டார்கள்
  rationale: ‘குணமாக்கப்பட்டார்கள்’ உடல்நல மீட்பை மட்டும் முன்னிறுத்தக்கூடும். கிரேக்கச் சொல் உடல் மீட்போடு ஆசாரியர் உறுதிப்படுத்தும் சடங்குசார் தூய்மையையும் குறிக்கக்கூடியதால், ‘தூய்மையாக்கப்பட்டார்கள்’ அந்த இரட்டைச் சாத்தியத்தையும் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்கள்’ என்பது யூத ஆலய மற்றும் நியாயப்பிரமாணச் சூழலைத் தெளிவாகக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது.
