review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the rhetorical question, the commands, the temporal sequence, and the emphatic future addressed to the servant. However, «எனக்கான இரவு உணவை» over-specifies τί δειπνήσω. The Greek means, more literally, “what I may eat/dine on”; it need not identify the meal as an evening meal in Tamil. The revised wording retains the unspecified food/object.
  naturalness: The proposed revision is clear, modern standard Tamil and preserves the direct, formal register appropriate to the parable. «நான் உண்பதற்கு ஏதாவது ஆயத்தப்படுத்து» is more idiomatic than a literalized meal label while remaining suitably concise.
  terminology: «பணிவிடை செய்» appropriately conveys table service here without importing ecclesiastical senses. «உடையை இடுப்பில் கட்டிக்கொண்டு» adequately conveys the practical sense of περιζωσάμενος; the cultural note supplies the garment-related detail. No social-status noun is added beyond the Greek text.
  issues:
  - severity: medium
    issue: «எனக்கான இரவு உணவை» specifies an evening meal.
    rationale: τί δειπνήσω expresses what the speaker is to eat/dine on, but the Greek wording does not require Tamil «இரவு உணவு». “Prepare something for me to eat” preserves the object’s relative indefiniteness without a potentially misleading time-of-day specification.
  - severity: low
    issue: Footnote b refers generically to «மற்றவர்».
    rationale: 'The first-person Greek explicitly refers to the speaker: “until I eat and drink.” The note should retain that perspective and state the completed-action nuance without adding a generic participant.'
