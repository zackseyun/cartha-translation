reference: Luke 17:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: ta
  text: மாறாக, அவன் அவனிடம், ‘நான் உண்பதற்கு ஏதாவது ஆயத்தப்படுத்து; உன் உடையை இடுப்பில் கட்டிக்கொண்டு[a], நான் உண்டு குடித்து முடிக்கும்வரை[b] எனக்குப் பணிவிடை செய். அதற்குப் பிறகு நீ உண்டு குடிப்பாய்’ என்று சொல்லமாட்டானா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, வேலை செய்வதற்குத் தயாராக நீண்ட உடையை இடுப்பில் இழுத்துக் கட்டிக்கொள்; சொல்லர்த்தமாக, ‘இடுப்பைக் கட்டிக்கொண்டு.’
    reason: cultural_note
  - marker: b
    text: சொல்லர்த்தமாக, ‘நான் உண்டு குடிக்கும்வரை.’ கிரேக்கத்தில் இந்தச் செயல் முடிவடைந்த பின்னரே அவன் உண்பதும் குடிப்பதும் வரும் என்ற நுணுக்கம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: மாறாக, ... சொல்லமாட்டானா?
  rationale: ἀλλά முன்னுள்ள கருத்துக்கு மாறான வழக்கமான செயலை அறிமுகப்படுத்துகிறது; οὐχί நேர்மறையான பதிலை எதிர்பார்க்கும் வினாவாகத் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐρεῖ αὐτῷ
  choice: அவன் அவனிடம் ... என்று சொல்லமாட்டானா?
  rationale: எழுவாயையும் மறைமுகச் செயப்படுபொருளையும் கிரேக்கத்தைப் போலப் பெயர்ச்சொல் சேர்க்காமல் சுட்டுப்பெயர்களால் வைத்திருக்கிறது.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: எனக்கான இரவு உணவை ஆயத்தப்படுத்து
  rationale: δειπνάω இச்சூழலில் இரவு உணவு உண்பதைக் குறிக்கிறது; தமிழ் மொழியில் இயல்பாகவும் கட்டளையின் நேரடித் தன்மையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: περιζωσάμενος
  choice: உன் உடையை இடுப்பில் கட்டிக்கொண்டு
  rationale: வேலை செய்வதற்காக நீண்ட உடையை இடுப்பில் கட்டிக்கொள்ளும் பண்டைய நடைமுறையின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: διακόνει μοι
  choice: எனக்குப் பணிவிடை செய்
  rationale: இங்கு உணவு பரிமாறி ஒருவருக்குச் சேவை செய்வதே பொருள்; திருச்சபைச் சார்ந்த சிறப்புப் பொருளைச் சேர்க்காமல் சமூகப் பணியைத் தெரிவிக்கிறது.
- source_word: ἕως φάγω καὶ πίω
  choice: நான் உண்டு குடிக்கும்வரை
  rationale: ἕως உடன் வரும் அசைநிலை வினைகள் குறிக்கும் கால எல்லையை இயல்பான தமிழில் தருகிறது; செயல் முடிவடையும் நுணுக்கம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: அதற்குப் பிறகு நீ உண்டு குடிப்பாய்
  rationale: எதிர்கால வினைகளையும், வெளிப்படையாக வரும் σύ அளிக்கும் ‘நீ’ என்ற வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: உவமையில் சமூகப் பங்கைக் குறிக்கும் பெயர்ச்சொல்
  choice: இவ்வசனத்தில் உள்ள சுட்டுப்பெயர்களை மட்டும் பயன்படுத்தி, ‘வேலைக்காரன்’ அல்லது ‘அடிமை’ என்பதைச் சேர்க்கவில்லை.
  alternative: முந்தைய வசனத்தின் δοῦλος என்பதைக் கருத்தில் கொண்டு ‘வேலைக்காரன்’ அல்லது ‘அடிமை’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: இந்த வசனம் பெயர்ச்சொல்லைப் பயன்படுத்தாமல் αὐτῷ மற்றும் σύ ஆகியவற்றையே கொண்டுள்ளது. கட்டளைகளும் பணிவிடையும் உறவுநிலையைப் போதுமான அளவு வெளிப்படுத்துவதால், மூலத்தில் இல்லாத சொல்லைச் சேர்ப்பது தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆயத்தப்படுத்து’ மற்றும் ‘பணிவிடை செய்’ ஆகியவை உவமையின் வரலாற்றுச் சமூகச் சூழலுக்கு ஏற்ற முறையான நடையைத் தருகின்றன; பழமையான உடைமுறையை மட்டும் தெளிவாக்க அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
