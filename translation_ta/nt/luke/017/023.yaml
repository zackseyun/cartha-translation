id: LUK.17.23
reference: Luke 17:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: ta
  text: அவர்கள் உங்களிடம், “இதோ, அங்கே!” அல்லது “இதோ, இங்கே!” என்று சொல்வார்கள். நீங்கள் போகாதீர்கள்; பின்தொடரவும் வேண்டாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பின்தொடரவும் வேண்டாம்” என்பதற்கான செயப்படுபொருள் கிரேக்க மூலத்தில் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  choice: சொல்வார்கள்
  rationale: λέγω என்பதன் எதிர்கால வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது; தொடர்ந்து வரும் நேரடிக் கூற்றுக்கு ஏற்றது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து ஓர் இடத்தைச் சுட்டும் கிரேக்க இடைச்சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ἐκεῖ / ὧδε
  choice: அங்கே / இங்கே
  rationale: தொலைவையும் அருகாமையையும் குறிக்கும் சுருக்கமான எதிரிணையைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: μὴ ἀπέλθητε
  choice: நீங்கள் போகாதீர்கள்
  rationale: ἀπέρχομαι குறிக்கும் அங்கிருந்து செல்வதைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் இல்லாத ‘வெளியே’ என்ற கூறைச் சேர்க்கவில்லை.
- source_word: μηδὲ διώξητε
  choice: பின்தொடரவும் வேண்டாம்
  rationale: διώκω இங்கு குறிக்கும் ஒருவரையோ ஒரு கூற்றையோ தொடர்ந்து செல்வதை வெளிப்படுத்துகிறது; கிரேக்கத்தில் சொல்லப்படாத செயப்படுபொருளைத் தமிழிலும் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: διώξητε என்பதற்கான செயப்படுபொருள் குறிப்பிடப்படாதிருப்பது
  choice: செயப்படுபொருளைச் சேர்க்காமல் ‘பின்தொடரவும் வேண்டாம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர்களைப் பின்தொடராதீர்கள்’
  rationale: கிரேக்கம் யாரை அல்லது எதைப் பின்தொடரக்கூடாது என்று வெளிப்படையாகக் கூறவில்லை. தமிழில் செயப்படுபொருள் இல்லாமலேயே வாக்கியம் இயல்பாக இருப்பதால், மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்க முடிகிறது.
- issue: Ἰδοὺ ἐκεῖ· Ἰδοὺ ὧδε என்ற இணைச் சுட்டுரைகள்
  choice: “இதோ, அங்கே!” அல்லது “இதோ, இங்கே!”
  alternative: “அங்கே பாருங்கள்! இங்கே பாருங்கள்!”
  rationale: இரு சுட்டுரைகளின் சுருக்கத்தையும் உடனடித் தன்மையையும் காக்கிறது; அவை எதைப் பற்றிய கூற்றுகள் என்பதை வசனத்துக்குள் விளக்கிச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற இலக்கியத் தன்மையுள்ள ஆனால் இன்றும் புரியக்கூடிய சுட்டுச்சொல், மூலத்தின் சுருக்கத்தையும் வலியுறுத்தலையும் காக்கிறது.
