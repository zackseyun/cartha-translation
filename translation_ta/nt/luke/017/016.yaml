  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: ta
  text: அவன் அவருடைய காலடியில் முகங்குப்புற விழுந்து, அவருக்கு நன்றி செலுத்தினான். அவனோ ஒரு சமாரியன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν
  choice: விழுந்து
  rationale: πίπτω என்பதன் இறந்தகால நிகழ்வை நேரடியாகக் காட்டுகிறது; முகங்குப்புற என்ற தொடரே பணிவுடன் தரையில் வீழ்ந்த நிலையைத் தெளிவாக்குவதால், வினைச்சொல்லில் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἐπὶ πρόσωπον
  choice: முகங்குப்புற
  rationale: முகம் தரையை நோக்கிய பணிவான உடல்நிலையை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: அவருடைய காலடியில்
  rationale: παρά என்பதன் அருகாமைப் பொருளையும், இச்சூழலில் இயேசுவுக்கு முன்பாகத் தாழ்ந்து கிடந்த பணிவான நிலையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐχαριστῶν αὐτῷ
  choice: அவருக்கு நன்றி செலுத்தினான்
  rationale: நன்றி இயேசுவுக்கே செலுத்தப்பட்டது என்பதைத் தெளிவாக வைத்திருக்கிறது. கிரேக்கப் பங்கேற்புவினை தமிழில் தொடர்ச்சியான வினையமைப்பாக இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: Σαμαρίτης
  choice: சமாரியன்
  rationale: லூக்காவின் கதையில் சமூக மற்றும் சமய முக்கியத்துவம் கொண்ட இனக்குழு அடையாளத்திற்கான வழக்கமான தமிழ்ச் சொல்.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: அவன் ஒரு சமாரியன்
  rationale: αὐτός தரும் கவனக்குவிப்பை எளிய தனி வாக்கியத்தின் மூலம் வைத்திருக்கிறது; விளக்கவுரை சேர்க்காமல் அந்த அடையாளத்தின் எதிர்பாராத தன்மையை வாசகர் உணர இடமளிக்கிறது.
theological_decisions:
- issue: குணமடைந்த மனிதனின் அடையாளத்தின்மீது கதையின் வலியுறுத்தல்
  choice: அவன் ஒரு சமாரியன்
  alternative: அவனோ ஒரு சமாரியன்
  rationale: நன்றி தெரிவித்தவன் வெளிக்குழுவினராகக் கருதப்பட்ட சமாரியன் என்பதிலுள்ள சமூக மற்றும் இறையியல் அழுத்தத்தை எளிய கூற்றாகவே பாதுகாக்கிறது. ‘அவனோ’ என்பது எதிர்மறை ஒப்பீட்டை அதிகமாக வெளிப்படுத்தக்கூடும் என்பதால், மூலத்தின் அடக்கமான நடையைத் தக்கவைக்க எளிய வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; குணமடைந்த மனிதனை ‘அவன்’ எனக் குறிப்பதால் இருவரும் தெளிவாக வேறுபடுத்தப்படுகின்றனர்.
