reference: Luke 17:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: ta
  text: தன் உயிரைத் தக்கவைத்துக்கொள்ள முயல்கிறவர் அதை இழப்பார்; ஆனால் அதை இழக்கிறவர் அதை உயிரோடு வைத்திருப்பார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “அதை உயிரோடு காப்பார்” என்றும் மொழிபெயர்க்கலாம்; மரபாக, “அதைக் காப்பாற்றுவார்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வினை நேரடியாக உயிரோடு வைத்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: முயல்கிறவர்
  rationale: ζητέω இங்கு வெறும் விருப்பத்தை அல்ல, நோக்கத்துடன் மேற்கொள்ளும் முயற்சியைக் குறிக்கிறது.
- source_word: ψυχὴν
  choice: உயிரை
  rationale: இந்தச் சூழலில் ψυχή என்பது உடலிலிருந்து பிரிந்த ஆன்மாவை மட்டும் குறிக்காமல், ஒருவருடைய உயிரையோ வாழ்வையோ குறிக்கிறது.
- source_word: περιποιήσασθαι
  choice: தக்கவைத்துக்கொள்ள
  rationale: நடுநிலை வினைவடிவத்தின் தனக்காகப் பாதுகாத்துக்கொள்ளும் அல்லது உறுதிசெய்துகொள்ளும் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: இழப்பார் / இழக்கிறவர்
  rationale: இரு இடங்களிலும் ஒரே வேர்ச்சொல்லின் முரண்பாட்டுத் தன்மையைச் சீராகப் பேணுகிறது; ‘அழிப்பார்’ என்ற தேவையற்ற வலிமையையும் தவிர்க்கிறது.
- source_word: ζῳογονήσει
  choice: உயிரோடு காப்பார்
  rationale: வழக்கமான ‘ரட்சிப்பார்’ என்பதைவிட, உயிருடன் வைத்திருத்தல் அல்லது உயிரோடு காத்தல் என்ற கிரேக்க வினையின் நேரடியான பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: …கிறவர் …; ஆனால் …கிறவர் …
  rationale: பொதுவான நிபந்தனையையும் δέ தரும் எதிர்மறை மாறுபாட்டையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஆத்துமா’
  rationale: சூழல் ஒருவருடைய உயிரைத் தக்கவைத்தல் அல்லது இழத்தலைப் பற்றியது. ‘ஆத்துமா’ என்பது இங்கு அவசியமில்லாத உடல்–ஆத்துமா பிரிவை வாசகனுக்கு உணர்த்தக்கூடும்.
- issue: ζῳογονήσει என்பதன் மொழிபெயர்ப்பு
  choice: ‘உயிரோடு காப்பார்’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘காப்பாற்றுவார்’ அல்லது ‘ரட்சிப்பார்’
  rationale: இது வழக்கமான ‘ரட்சித்தல்’ வினை அல்ல; உயிரோடு வைத்திருத்தல் என்ற பொருளை உடையது. எனவே மூலத்தின் சொல்விளையாட்டையும் இறையியல் பதற்றத்தையும் விளக்கிவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதைப் பன்மை ஒருமை வடிவமான ‘வர்/பார்’ பொதுவான நபரைக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது. மொழிநடை சுருக்கமாகவும் கண்ணியமாகவும் வைக்கப்பட்டு, இயேசுவின் முரண்பாட்டுக் கூற்றின் கூர்மை பேணப்பட்டுள்ளது.
