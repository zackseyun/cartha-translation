base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: ta
  text: இரண்டு பேர்[a] வயலில் இருப்பார்கள்; ஒருவர் எடுத்துக்கொள்ளப்படுவார், மற்றவர் விடப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில்—நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்ட்டிக்கஸ், வத்திக்கானஸ் ஆகியவை உட்பட—மற்றும் பழைய காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் மேற்கத்திய உரைமரபில் (ஐந்தாம் நூற்றாண்டைச் சேர்ந்த கோடெக்ஸ் பீசே போன்றவற்றில்), பெரும்பான்மை பைசாந்திய உரைமரபில், இலத்தீன் வல்கேட்டிலும் உள்ளது. மத்தேயு 24:40-க்கு ஒத்துப்போகுமாறு பிற்காலப் பிரதியெழுத்தாளர்கள் இதைச் சேர்த்திருக்க வாய்ப்புள்ளது.
    reason: textual_critical
lexical_decisions:
- source_word: παραλαμβάνω
  choice: அழைத்துக்கொள்ளப்படுவார்
  rationale: இறுதிக்காலச் சூழலில், ஒருவரைத் தம்மோடு நெருங்கிய தொடர்புக்குள் எடுத்துக்கொள்வதை இச்சொல் குறிக்கலாம். வெறுமனே ‘எடுத்துக்கொள்ளப்படுவார்’ என்பதைக் காட்டிலும் ‘அழைத்துக்கொள்ளப்படுவார்’ என்பது தமிழில் இயல்பாகவும், எதிரிலுள்ள ‘விட்டுவைக்கப்படுவார்’ என்பதோடு தெளிவான வேறுபாட்டுடனும் உள்ளது; அதேவேளை யாரால், எதற்காக அழைத்துக்கொள்ளப்படுகிறார் என்பதை உரை கூறாததால் அதைச் சேர்க்கவில்லை.
- source_word: ἀφίημι
  choice: விட்டுவைக்கப்படுவார்
  rationale: இங்கு மற்றவர் அழைத்துக்கொள்ளப்படாமல் அங்கேயே விடப்படுவதை இது குறிக்கிறது. ‘கைவிடப்படுவார்’ என்பது எதிர்மறையான துறத்தலை மிகுதியாக உணர்த்தக்கூடும்; ஆகவே மூலத்தின் எதிர்நிலையைத் தக்கவைக்கும் நடுநிலையான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἕτερος
  choice: மற்றவர்
  rationale: முன்னர் குறிப்பிடப்பட்ட இருவரில் இரண்டாவது நபரைச் சுட்டுகிறது. நவீனத் தமிழில் ‘மற்றவர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δύο
  choice: இரண்டு பேர்
  rationale: கிரேக்கத்தில் எண் மட்டும் இருந்தாலும், அடுத்துள்ள ஆண்பால் ஒருமைச் சொற்கள் இரு மனிதர்களைக் குறிக்கின்றன. பாலினத்தைத் தேவையின்றி வெளிப்படையாகச் சேர்க்காமல் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: அழைத்துக்கொள்ளப்படுபவரின் மற்றும் விட்டுவைக்கப்படுபவரின் இறுதி நிலை
  choice: இருவரின் இறுதி நிலை நல்லதா தீயதா என்பதை மொழிபெயர்ப்பில் விளக்காமல் மூல உரையின் தெளிவின்மையைத் தக்கவைத்தல்
  alternative: அழைத்துக்கொள்ளப்படுபவர் இரட்சிக்கப்படுகிறார் அல்லது நியாயத்தீர்ப்புக்காக அகற்றப்படுகிறார் என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: வினைச்சொற்களும் உடனடிச் சூழலும் நிகழ்வைச் சொல்கின்றன; ஆனால் அதன் துல்லியமான இறையியல் மதிப்பீட்டை இவ்வசனம் மட்டும் தீர்மானமாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இரண்டு ஆண்கள்’ என்று பாலினத்தை வலியுறுத்தாமல் ‘இரண்டு பேர்’ பயன்படுத்தப்பட்டது. இணையான இரண்டு செயப்பாட்டு வினை வடிவங்கள் மூலத்தின் சமச்சீர் அமைப்பைத் தக்கவைக்கின்றன.
