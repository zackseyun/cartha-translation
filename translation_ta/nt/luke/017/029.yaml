revisions:
- from: ஆனால் லோத்து சோதோமைவிட்டு வெளியேறிய நாளில், வானத்திலிருந்து நெருப்பும் கந்தகமும் மழையாகப் பொழிந்து, அனைவரையும் அழித்தன.
  to: ஆனால் லோத்து சோதோமிலிருந்து வெளியேறிய நாளில், வானத்திலிருந்து நெருப்பும் கந்தகமும் மழையாகப் பொழிந்து அனைவரையும் அழித்தன.
  rationale: The revision changes only the expression for departure from Sodom, improving modern Tamil idiom while retaining the source meaning. “மழையாகப் பொழிந்து” preserves the rain imagery, and the plural reference to fire and sulfur avoids supplying an agent absent from the Greek.
