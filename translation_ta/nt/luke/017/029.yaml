id: LUK.17.29
reference: Luke 17:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: ta
  text: ஆனால் லோத்து சோதோமிலிருந்து வெளியேறிய நாளில், வானத்திலிருந்து நெருப்பும் கந்தகமும் மழையாகப் பொழிந்து அனைவரையும் அழித்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: ஆனால் ... நாளில்
  rationale: இந்தத் தற்காலச் சொற்றொடர் ‘அந்த நாளில்/எந்த நாளில்’ என்ற பொருளைத் தருகிறது; δέ முந்தைய ஒப்பீட்டுடன் உள்ள மெல்லிய முரண்பாட்டைத் தக்கவைக்க ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐξῆλθεν
  choice: வெளியேறிய
  rationale: ἐξέρχομαι என்பதன் நேரடியான இயக்கப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Λὼτ
  choice: லோத்து
  rationale: தமிழ் வேதாகம வழக்கில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: ἀπὸ Σοδόμων
  choice: சோதோமைவிட்டு
  rationale: ஒரு நகரத்திலிருந்து புறப்படுதலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கப் பெயரின் இலக்கணப் பன்மையைத் தமிழில் செயற்கையாகக் கொண்டுவரவில்லை.
- source_word: ἔβρεξεν
  choice: மழையாகப் பொழிந்து
  rationale: βρέχω என்பதன் மழைபொழிதல் உருவகத்தைத் தக்கவைக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத செய்பவரைச் சேர்க்கவில்லை.
- source_word: πῦρ καὶ θεῖον
  choice: நெருப்பும் கந்தகமும்
  rationale: θεῖον என்பதன் தெளிவான நவீனத் தமிழ்ப் பொருள் ‘கந்தகம்’; பழைய அல்லது தெளிவற்ற சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: ἀπ’ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός இங்கு மேலிருந்து வரும் தீர்ப்பைக் குறிக்கும் வேதாகமப் படிமத்தைத் தக்கவைக்கிறது; தமிழில் ‘வானம்’ என்பது இயல்பாகவும் தேவையற்ற விளக்கமின்றியும் உள்ளது.
- source_word: ἀπώλεσεν πάντας
  choice: அனைவரையும் அழித்தன
  rationale: πάντας என்பதன் மனிதப் பன்மைக் குறிப்பை ‘அனைவரையும்’ தெளிவாக வெளிப்படுத்துகிறது; ‘அழித்தன’ என்பது நெருப்பும் கந்தகமும் ஆகிய இணைந்த இலக்கண எழுவாயுடன் பொருந்துகிறது.
theological_decisions:
- issue: தீர்ப்புச் சூழலில் θεῖον என்பதன் மொழிபெயர்ப்பு
  choice: கந்தகம்
  alternative: எரிகந்தகம்
  rationale: ‘கந்தகம்’ மூலச்சொல்லின் நேரடியான, நவீனப் பொருளை வழங்கி தீர்ப்பின் படிமத்தை மாற்றாமல் காக்கிறது.
- issue: οὐρανός என்பதன் மொழிபெயர்ப்பு
  choice: வானம்
  alternative: பரலோகம்
  rationale: ‘வானம்’ என்பது இச்சூழலில் மேலிருந்து பொழிவதை இயல்பாகக் கூறுவதோடு, ‘பரலோகம்’ என மொழிபெயர்ப்பதால் உருவாகக்கூடிய தேவையற்ற இடவியல் அல்லது கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ஆதியாகமம் 19:24-இன் நெருப்பு–கந்தகப் படிமம் தக்கவைக்கப்பட்டது; மூலத்தில் இல்லாத செய்பவர் சேர்க்கப்படவில்லை.
