  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: ta
  text: அவர் அவனிடம், “எழுந்து போ; உன் விசுவாசம்[b] உன்னை மீட்டிருக்கிறது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னை நலமாக்கியிருக்கிறது” அல்லது “உன்னைக் குணமாக்கியிருக்கிறது” என்றும் மொழிபெயர்க்கலாம். இந்தக் கிரேக்க வினைச்சொல் மீட்பு, குணமாக்குதல் அல்லது இரட்சிப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நம்பிக்கை” என்றும் மொழிபெயர்க்கலாம். இந்தக் கிரேக்கச் சொல் விசுவாசம், நம்பிக்கை அல்லது உண்மைத்தன்மையைக் குறிக்கலாம்; இங்கு “விசுவாசம்” முதன்மைப் பொருளாகத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: அவர் அவனிடம் … என்றார்
  rationale: எளிய விவரிப்பு நடையில், இயேசு அந்த மனிதனிடம் நேரடியாகச் சொன்னதை இயல்பான தமிழில் தருகிறது.
- source_word: Ἀναστὰς
  choice: எழுந்து
  rationale: கிரேக்க இறந்தகாலப் பெயரெச்சம் அடுத்த கட்டளையோடு சேர்ந்து கட்டளைப் பொருளில் வருகிறது; “எழுந்து” என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: πορεύου
  choice: போ
  rationale: நிகழ்காலக் கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு இயேசுவின்மீது அந்த மனிதன் வைத்த நம்பிக்கையைக் குறிக்கிறது. “விசுவாசம்” முதன்மைத் தேர்வாக வைக்கப்பட்டு, “நம்பிக்கை” என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σέσωκέν
  choice: மீட்டிருக்கிறது
  rationale: σῴζω என்பதன் காப்பாற்றுதல், மீட்பு, குணமாக்குதல் ஆகிய பரந்த பொருள் எல்லையையும், நிறைவேறி தொடரும் விளைவைக் குறிக்கும் perfect வடிவத்தையும் இயன்றவரை காக்கிறது. உடல் நலமடைதல் மட்டுமே என்று பொருளைக் குறுக்காமல் இருக்கிறது.
- source_word: σε
  choice: உன்னை
  rationale: நேரடிச் செயப்படுபொருள் சுட்டுப்பெயரின் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: குணமாக்கல் சூழலில் σέσωκέν σε என்பதன் பொருள்
  choice: உன்னை மீட்டிருக்கிறது
  alternative: உன்னை நலமாக்கியிருக்கிறது; உன்னைக் குணமாக்கியிருக்கிறது; உன்னை இரட்சித்திருக்கிறது
  rationale: பத்துப் பேரும் உடலளவில் தூய்மையாக்கப்பட்டிருந்தபோதும், கடவுளை மகிமைப்படுத்தத் திரும்பிவந்த ஒருவரிடம் மட்டும் இந்தச் சொல் கூறப்படுகிறது. எனவே உடல் குணமடைதலை மட்டும் குறிப்பதாகச் சுருக்காமல், மீட்பு/இரட்சிப்பு சார்ந்த விரிந்த பொருளையும் கதையின் இறையியல் அழுத்தத்தையும் காக்க “மீட்டிருக்கிறது” தேர்ந்தெடுக்கப்பட்டது.
- issue: πίστις என்பதன் நுண்பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இந்தச் சூழலில் அந்த மனிதனின் நம்பிக்கையுள்ள பதில்செயல் முதன்மையாகத் தெரிகிறது. இருப்பினும் கிரேக்கச் சொல்லின் பொருள் எல்லையை முற்றிலும் ஒரே விளக்கத்துக்குள் அடைக்காமல் “நம்பிக்கை” அடிக்குறிப்பில் வைக்கப்படுகிறது; “உண்மைத்தன்மை” இங்கு சாத்தியம் குறைந்தது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான நேரடி உரை. “எழுந்து போ” பொதுவாகப் புரியும் இயல்பான கட்டளை. மூலத்தில் உள்ள மீட்பு–குணமாக்குதல் சார்ந்த பொருள் நெருக்கடியைத் தீர்த்துவிடாமல் அடிக்குறிப்பு மூலம் பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் பொருந்தாத இடங்களில் இருந்ததால், அவை தமிழில் உரிய சொற்களான “விசுவாசம்” மற்றும் “மீட்டிருக்கிறது” என்பவற்றோடு இணைக்கப்பட்டுள்ளன.
