id: LUK.17.22
reference: Luke 17:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: ta
  text: பின்பு அவர் சீடர்களிடம், “மனிதகுமாரனுடைய நாட்களில் ஒன்றைக் காண நீங்கள் ஏங்கும் நாட்கள் வரும்; நீங்கள் அதைக் காணமாட்டீர்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: பின்பு அவர் ... என்றார்
  rationale: δέ இங்கு மென்மையான நிகழ்வுத் தொடர்ச்சியைக் குறிக்கிறது; ‘பின்பு’ என்பது தேவையற்ற முரண்பாட்டை உருவாக்காமல் இயல்பான தமிழ் நடையைத் தருகிறது.
- source_word: πρὸς τοὺς μαθητάς
  choice: சீடர்களிடம்
  rationale: மூலத்தில் உடைமைச் சுட்டுப்பெயர் இல்லாததால் ‘தமது சீடர்களிடம்’ என்று சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἐλεύσονται ἡμέραι ὅτε
  choice: '... நாட்கள் வரும்'
  rationale: வருங்காலத்தில் ஒரு காலகட்டம் வருவதை அறிவிக்கும் கிரேக்க மொழிநடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπιθυμήσετε
  choice: நீங்கள் ஏங்கும்
  rationale: வலுவான விருப்பத்தையும் உணர்வுபூர்வமான எதிர்பார்ப்பையும் ‘ஏங்குதல்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μίαν τῶν ἡμερῶν
  choice: நாட்களில் ஒன்றை
  rationale: ஒரு பெரிய தொகுதியிலிருந்து ஒரு நாளைக் குறிக்கும் பகுதிப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரனுடைய
  rationale: இயேசுவின் பட்டப்பெயரையும் அதன் வேதாகமத் தொடர்புகளையும் பாதுகாக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: காண ...; ஆனால் நீங்கள் அதைக் காணமாட்டீர்கள்
  rationale: இரு காணுதல் வினைகளையும் பாதுகாக்கிறது; தமிழில் எதிர்பார்ப்புக்கும் நிறைவேறாமைக்கும் இடையிலுள்ள தெளிவான முரணை இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது. ‘அதை’ என்பது விரும்பப்படும் அந்த நாளைக் குறிக்கிறது.
theological_decisions:
- issue: ‘மனிதகுமாரனுடைய நாட்கள்’ என்பதன் பொருள்
  choice: மனிதகுமாரனுடன் தொடர்புடைய காலத்தைத் திறந்த பொருளுடன் வைத்திருத்தல்
  alternative: இயேசுவின் பூமியிலான ஊழிய நாட்கள் மட்டும், அல்லது அவரது வருங்கால வெளிப்பாட்டின் நாள் மட்டும் என்று வரையறுத்தல்
  rationale: சுற்றியுள்ள சூழல் எதிர்கால வெளிப்பாட்டை வலியுறுத்தினாலும், இச்சொற்றொடர் தனிப்பட்ட முறையில் அதன் எல்லையைத் துல்லியமாகக் குறுக்கவில்லை. எனவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற வேதாகமப் பட்டப்பெயர் பாதுகாக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கும்படி மாற்றப்பட்டாலும் மூலத்தின் வருங்கால ஏக்கமும் காண இயலாமையும் தக்கவைக்கப்பட்டுள்ளன.
