revisions:
- from: பின்பு அவர் சீடர்களிடம், “மனிதகுமாரனுடைய நாட்களில் ஒன்றை[a] காண நீங்கள் ஏங்கும் நாட்கள் வரும்; ஆனால் நீங்கள் அதைக் காணமாட்டீர்கள்” என்றார்.
  to: பின்பு அவர் சீடர்களிடம், “மனிதகுமாரனுடைய நாட்களில் ஒன்றைக் காண நீங்கள் ஏங்கும் நாட்கள் வரும்; நீங்கள் அதைக் காணமாட்டீர்கள்” என்றார்.
  rationale: The revision replaces the stronger adversative ‘ஆனால்’ with a simple coordinate continuation, matching καί without changing the sense. It also makes the explanatory footnote more idiomatic while continuing to preserve the source phrase’s deliberate interpretive openness.
