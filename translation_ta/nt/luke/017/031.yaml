reference: Luke 17:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: ta
  text: அந்த நாளில், வீட்டின் மொட்டைமாடியில்[b] இருப்பவர், அவருடைய உடைமைகள் வீட்டுக்குள் இருக்கையில், அவற்றை எடுத்துக்கொள்ளக் கீழே இறங்க வேண்டாம்; அதுபோல, வயலில் இருப்பவரும் பின்னால் உள்ளவற்றிடம்[a] திரும்பிப் போக வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பின்னால் உள்ளவற்றிடம்’ என்பதை ‘பின்னால் விடப்பட்டவற்றிடம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘மொட்டைமாடி’ என்பது அக்கால வீடுகளில் மக்கள் ஏறிச் சென்று பயன்படுத்தக்கூடிய தட்டையான கூரைப்பகுதியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரையும் சுட்டுப்பொருளின் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐπὶ τοῦ δώματος
  choice: வீட்டின் மொட்டைமாடியில்
  rationale: δώμα இச்சூழலில் அணுகிப் பயன்படுத்தக்கூடிய தட்டையான வீட்டுக்கூரையைக் குறிக்கிறது; ‘மொட்டைமாடி’ தமிழில் அந்தக் கலாசாரச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὰ σκεύη αὐτοῦ
  choice: தமது உடைமைகள்
  rationale: σκεύη என்பது பொருட்கள், உபகரணங்கள் அல்லது சொந்த உடைமைகளைக் குறிக்கலாம்; இங்கு எடுத்துச் செல்லக்கூடிய தனிப்பட்ட பொருட்களைப் பொதுவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: அவற்றை எடுத்துக்கொள்ளக் கீழே இறங்க வேண்டாம்
  rationale: மூன்றாம் நபர் தடை கட்டளையின் அவசரத்தையும், வீட்டிலுள்ள பொருட்களை மீட்க கீழிறங்கும் செயலையும் தெளிவாகத் தருகிறது.
- source_word: ὁ ἐν ἀγρῷ ὁμοίως
  choice: அதுபோல, வயலில் இருப்பவரும்
  rationale: இரண்டாவது நபருக்கான இணையான தடையைச் சுருக்கமாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: பின்னால் இருப்பவற்றுக்காகத் திரும்பிப் போக வேண்டாம்
  rationale: ἐπιστρέφω என்பதின் திரும்பிச் செல்லும் பொருளையும், τὰ ὀπίσω என்பதிலுள்ள பின்னால் விடப்பட்டவை என்ற பொருள் சாத்தியத்தையும் இயல்பான தமிழில் காக்கிறது; வெறும் ‘திரும்ப வேண்டாம்’ என்று சுருக்கவில்லை.
theological_decisions:
- issue: இறுதிக்கால அவசரத்தின் உருவகம்
  choice: கீழே இறங்காமலும் பின்னால் விடப்பட்டவற்றுக்காகத் திரும்பாமலும் இருக்க வேண்டிய குறிப்பான கட்டளைகளை அப்படியே வைத்தல்
  alternative: உடைமைகள்மீது பற்றுவைக்கக் கூடாது என்ற பொதுவான அறநெறிப் போதனையாக மாற்றிக் கூறுதல்
  rationale: வசனம் ‘அந்த நாளில்’ நிகழும் குறிப்பான சூழலை உயிரோட்டமாக வரைகிறது. அதை பொதுவான பற்றின்மை போதனையாக மாற்றுவது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் நடை. ‘மொட்டைமாடி’ கலாசாரப் பின்னணியை இயல்பாகத் தெரிவிக்கிறது. ‘தமது’ என்பது பாலினத்தைக் குறிப்பிடாமல் பிரதிநிதி நபரைச் சுட்டுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் வசன முடிவில் இடம்பெற்றுள்ளன.
