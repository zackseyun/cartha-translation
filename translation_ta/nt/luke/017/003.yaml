  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: ta
  text: உங்களைக் குறித்து எச்சரிக்கையாக இருங்கள். உங்கள் சகோதரன்[a] பாவம் செய்தால்[b], அவனைக் கண்டியுங்கள்; அவன் மனந்திரும்பினால், அவனை மன்னியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரன்” என்பது கிரேக்கத்தில் ஆண்பால் ஒருமைச் சொல்; இங்கு அது விரிந்த பொருளில் உடன்சீடரைக் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், “உங்கள் சகோதரன் உங்களுக்கு எதிராகப் பாவம் செய்தால், அவனைக் கண்டியுங்கள்” என்று உள்ளது.
    reason: textual_variant
