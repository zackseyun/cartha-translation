  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மரியாதைப் பன்மையான ‘உங்கள்/இருங்கள்/கண்டியுங்கள்’ வடிவங்கள் உரையின் நேரடி கட்டளைத் தொனியை இயல்பாகக் கொண்டுவருகின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
