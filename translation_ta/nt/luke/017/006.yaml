  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: κύριος என்பதற்கு «ஆண்டவர்», πίστις என்பதற்கு «நம்பிக்கை», ὡς κόκκον σινάπεως என்பதற்கு ஒப்புமையை மட்டும் காக்கும் «கடுகுவிதையைப் போன்ற», மற்றும் συκάμινος என்பதற்கு «மல்பெரி மரம்» ஆகியவை பொருத்தமானவை. «வேரோடு பிடுங்கப்பட்டுக் கடலில் நடப்படு» இரண்டு செயலற்ற ஏவல்களையும் கடலிலே நடப்படும் என்ற முரணான படிமத்தையும் காக்கிறது. «சொல்வீர்கள்; அது ... கீழ்ப்படியும்» என்பது கிரேக்க நிபந்தனை/சாத்திய விளைவைக் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதை வெளிப்படையான எதிர்மறை-உண்மை நிபந்தனையாக மாற்றவில்லை.'
