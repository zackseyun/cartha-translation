source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: ta
  text: 'ஆண்டவர் சொன்னார்: “உங்களுக்குக் கடுகுவிதையைப் போன்ற நம்பிக்கை இருந்தால், இந்த மல்பெரி மரத்திடம், ‘வேரோடு பிடுங்கப்பட்டுக் கடலில் நடப்படு’ என்று சொல்வீர்கள்; அது உங்களுக்குக் கீழ்ப்படியும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: லூக்காவின் கதைச்சூழலில் இயேசுவுக்கான மரியாதைமிக்க பட்டமாக வரும் κύριος என்பதற்கு இயல்பான தமிழ் இணை.
- source_word: πίστιν
  choice: நம்பிக்கை
  rationale: இங்கு நிலைத்த விசுவாசத்தன்மையைவிட கடவுள்மீது வைக்கும் நம்பிக்கையே முன்னிலையில் உள்ளது; நவீனத் தமிழில் ‘நம்பிக்கை’ தெளிவாக உள்ளது.
- source_word: ὡς κόκκον σινάπεως
  choice: கடுகுவிதையைப் போன்ற
  rationale: ὡς குறிக்கும் ஒப்புமையைப் பாதுகாக்கிறது; அதன் சிறுமையை மட்டும் வெளிப்படையாக விளக்கிச் சேர்ப்பதில்லை.
- source_word: συκαμίνῳ
  choice: மல்பெரி மரம்
  rationale: συκάμινος என்பது சைக்கமோர்-அத்தி மரம் அல்ல, மல்பெரி மரத்தைக் குறிக்கிறது; நவீன வாசகருக்குப் புரியும் பொதுப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐλέγετε ἂν
  choice: சொல்வீர்கள்
  rationale: நிபந்தனையுடன் வரும் சாத்திய விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἐκριζώθητι
  choice: வேரோடு பிடுங்கப்படு
  rationale: வேரிலிருந்து அகற்றப்படுதல் என்ற பொருளையும் கிரேக்கத்தின் செயப்பாட்டு ஏவல் வடிவையும் காக்கிறது.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: கடலில் நடப்படு
  rationale: கிரேக்கத்தின் முரண்பாடான, வலிமையான படிமத்தை விளக்கிச் சீராக்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: அது உங்களுக்குக் கீழ்ப்படியும்
  rationale: கட்டளைக்கு இணங்கும் பொருளைத் தெளிவாகக் காட்டி, மரம் மனிதர்போல் கீழ்ப்படிவதாகச் சொல்லும் உருவக வலிமையையும் காக்கிறது.
theological_decisions:
- issue: அற்புதம் குறித்த கூற்றில் πίστις என்பதன் பொருள்
  choice: நம்பிக்கை
  alternative: விசுவாசம்; விசுவாசத்தன்மை
  rationale: இந்தச் சூழல் முதன்மையாக கடவுள்மீது வைக்கும் நம்பிக்கையைப் பற்றியது; ஒழுக்கநிலைத்தன்மை அல்லது உடன்படிக்கை விசுவாசத்தன்மையைப் பற்றியது அல்ல. ‘நம்பிக்கை’ என்ற சொல் கருத்தை பொதுவாசகருக்கு இயல்பாகத் தெரிவிக்கிறது.
- issue: நிபந்தனை உண்மையற்றதாகக் கருதப்படுகிறதா என்பது
  choice: இருந்தால் … சொல்வீர்கள் … கீழ்ப்படியும்
  alternative: இருந்திருந்தால் … சொல்லியிருப்பீர்கள் … கீழ்ப்படிந்திருக்கும்
  rationale: εἰ ἔχετε என்பது நிகழ்காலக் குறிப்பு வடிவில் உள்ளது; ἄν உடன் வரும் வினைகள் சாத்திய அல்லது எதிர்நிலை நிழலைக் கொண்டுள்ளன. சீடர்களுக்கு நம்பிக்கையே இல்லை என்று உரை தீர்மானமாகச் சொல்வதுபோல் ஆக்காமல் அதன் நிபந்தனைத் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘மல்பெரி’ என்பது தாவரத்தைத் துல்லியமாக அடையாளப்படுத்தும் பரவலான நவீனப் பெயர்; ‘சைக்கமின்’ போன்ற தெளிவில்லாத ஒலிபெயர்ப்பு தவிர்க்கப்பட்டது.
