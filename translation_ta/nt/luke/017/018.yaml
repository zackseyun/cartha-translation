  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: ta
  text: திரும்பி வந்து கடவுளுக்கு மகிமை செலுத்த, இந்த அந்நியனைத் தவிர வேறு யாரும் காணப்படவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற இனத்தைச் சேர்ந்த இந்த மனிதனை” அல்லது “வேறு நாட்டைச் சேர்ந்த இந்த மனிதனை”; கிரேக்கச் சொல் வேறொரு மக்களைச் சேர்ந்தவரையும், இஸ்ரயேலுக்கு வெளியே உள்ளவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: யாரும் காணப்படவில்லையா?
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான வினாவாகத் தருகிறது; மூலத்தின் சொல்லாட்சியையும் கேள்வியின் வலியுறுத்தலையும் காக்கிறது.
- source_word: ὑποστρέψαντες
  choice: திரும்பி வந்து
  rationale: பங்கேற்பு வினைச்சொல் குறிக்கும், முதலில் திரும்பிவந்து பின்னர் மகிமை செலுத்தும் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δοῦναι δόξαν
  choice: மகிமை செலுத்த
  rationale: ‘மகிமை கொடுக்க’ என்ற மூல மரபுத்தொடரின் பொருளை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: இலக்கு அல்லது பெறுநரைக் குறிக்கும் வேற்றுமையைத் தெளிவாகக் காக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: விலக்கைக் குறிக்கும் இக்கட்டமைப்புக்கு சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: ἀλλογενής
  choice: வேறு இனத்தைச் சேர்ந்தவன்
  rationale: ‘வேறொரு மக்கள்/இனத்தைச் சேர்ந்தவர்’ என்ற சொல்லின் அடிப்படைப் பொருளையும் இஸ்ரயேலுக்கு வெளியானவர் என்ற சூழல்சார் நிலையையும் காக்கிறது; ‘அந்நியன்’ என்பதின் சாத்தியமான இழிவுத் தொனியைத் தவிர்க்கிறது.
- source_word: οὗτος
  choice: இவனை
  rationale: அருகுச் சுட்டின் வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: குணமடைந்தவரின் இன/மத வெளிப்புற நிலை
  choice: வேறு இனத்தைச் சேர்ந்த இவன்
  alternative: இந்த அந்நியன்; வேறு நாட்டைச் சேர்ந்த இவன்
  rationale: ஒரே ஒருவர் திரும்பிவந்தார் என்ற முரணையும் அவர் இஸ்ரயேலைச் சேர்ந்தவர் அல்ல என்ற கருத்தையும் வெளிப்படுத்துகிறது; சூழலில் அவர் சமாரியர் என்ற தகவலை இவ்வசனத்திற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். கேள்வியின் வியப்பும் கண்டனத் தொனியும் காக்கப்பட்டுள்ளன. ‘கடவுள்’ பொதுவாகப் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; ‘மகிமை செலுத்துதல்’ என்ற வேதாகம மரபுத்தொடர் இயல்பான தமிழில் வைக்கப்பட்டது.
