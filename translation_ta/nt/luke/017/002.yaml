source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: ta
  text: அவன் இந்தச் சிறியவர்களில் ஒருவரை இடறச் செய்வதைவிட, அவனுடைய கழுத்தைச் சுற்றி ஒரு திரிகைக்கல்[a] கட்டப்பட்டு, அவன் கடலில் எறியப்பட்டிருப்பது அவனுக்கு நல்லது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் குறிப்பாக, ‘பெரிய திரிகைக்கல்’ என்றும் பொருள்படலாம். கிரேக்கச் சொற்றொடர் திரிகையில் பயன்படுத்தப்பட்ட கனமான கல்லைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இந்தச் சிறியவர்களில் ஒருவரைப் பாவத்தில் விழச்செய்வதைவிட.’ கிரேக்க வினைச்சொல் ஒருவரைப் பாவத்திலோ ஆன்மீக அழிவிலோ விழச்செய்வதையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: அவனுக்கு நல்லது
  rationale: ஒரு விளைவு மற்றொன்றைவிட அவனுக்குச் சிறந்ததாக அல்லது விரும்பத்தக்கதாக இருக்கும் என்ற ஒப்பீட்டுப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: λίθος μυλικὸς
  choice: திரிகைக்கல்
  rationale: தானியத்தை அரைக்கும் திரிகையின் கல்லைக் குறிக்கும் சுருக்கமான, பொருள் தெளிவான தமிழ் இணைச்சொல்; அதன் பெரிய அல்லது கனமான தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: அவனுடைய கழுத்தைச் சுற்றிக் கட்டப்பட்டு
  rationale: கழுத்தைச் சுற்றி கல் வைக்கப்பட்டிருக்கும் விளைவு நிலையைக் காட்டும் கிரேக்க வடிவத்தைத் தமிழில் இயல்பான செயப்பாட்டு நடையில் தருகிறது.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: அவன் கடலில் எறியப்பட்டிருப்பது
  rationale: நிறைவேற்றப்பட்ட செயலின் விளைவு நிலையைக் காட்டும் கிரேக்க perfect passive வடிவைத் தக்கவைக்கிறது.
- source_word: σκανδαλίσῃ
  choice: பாவத்தில் விழச்செய்வது
  rationale: ஒருவரைப் பாவத்திற்கோ ஆன்மீக வீழ்ச்சிக்கோ இட்டுச் செல்லும் சூழல் பொருளைத் தெளிவாகத் தருகிறது; இடறச்செய்தல் என்ற உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: இந்தச் சிறியவர்களில் ஒருவரை
  rationale: வயதையோ சீடர் அடையாளத்தையோ தேவையின்றிக் குறிப்பாக்காமல், கிரேக்கத்தின் பொதுவான ‘சிறியவர்கள்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: ἢ ἵνα
  choice: விட
  rationale: இரு விளைவுகளுக்கிடையிலான ஒப்பீட்டை இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இந்தச் சிறியவர்கள்’ என்போரின் அடையாளம்
  choice: ‘இந்தச் சிறியவர்கள்’ என்று பொதுவாக மொழிபெயர்த்து, அவர்களை குழந்தைகள் அல்லது விசுவாசிகள் என்று மட்டும் வரையறுக்காமல் விடுதல்
  alternative: ‘இந்தக் குழந்தைகள்’ அல்லது ‘இந்தத் தாழ்மையான விசுவாசிகள்/சீடர்கள்’
  rationale: உடனடிச் சொற்றொடர் இவர்களை ‘சிறியவர்கள்’ என்பதற்கு மேல் வெளிப்படையாக அடையாளப்படுத்தவில்லை; ஆகவே விளக்கவுரையால் பொருளைச் சுருக்காமல் மூலத்தின் பரப்பையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: σκανδαλίζω என்பதிலுள்ள உருவகமும் ஆன்மீகப் பொருளும்
  choice: முதன்மை உரையில் ‘பாவத்தில் விழச்செய்வது’ என்று பொருளைத் தெளிவாக்கி, ‘இடறச்செய்வது’ என்ற உருவகத்தை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையில் ‘இடறச்செய்வது’
  rationale: தமிழில் ‘இடறச்செய்தல்’ வெறும் தடுமாற்றம் அல்லது மனவருத்தம் எனப் புரியக்கூடும்; சூழலில் உள்ள பாவ அல்லது ஆன்மீக வீழ்ச்சிப் பொருளை முதன்மை உரை தெளிவாக்குகிறது, அதேவேளை மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் ஒப்பீட்டு வாக்கிய அமைப்பும் நிறைவேற்றப்பட்ட செயல் விளைவு நிலையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன. ‘சிறியவர்கள்’ என்ற சொல் விளக்கவுரையால் குறுக்கப்படவில்லை.
