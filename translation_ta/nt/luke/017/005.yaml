  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: ta
  text: அப்போஸ்தலர்கள் ஆண்டவரிடம், “எங்கள் விசுவாசத்தைப் பெருக்குங்கள்[a]” என்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்கு விசுவாசத்தைச் சேர்த்தருளுங்கள்.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “சேர்” என்பதாகும்; இங்கு அது “பெருக்கு” என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “விசுவாசம்” என்பதை “நம்பிக்கை” என்றும் புரிந்துகொள்ளலாம்; சில சூழல்களில் இச்சொல் “விசுவாசத்தன்மை” என்றும் பொருள்படும், ஆனால் இங்கு அந்தப் பொருள் குறைவாகவே சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: தமிழ் உரைநடையில் வசனத் தொடக்கத்தில் ‘மேலும்/அப்பொழுது’ என்று சேர்ப்பது மூலத்தில் இல்லாத கருத்து நுட்பத்தை உருவாக்கலாம்; இயல்பான தொடர்ச்சியை வாக்கிய அமைப்பே காட்டுகிறது.
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த எளிய உரையாடலை இயல்பான தமிழ் நேர்கூற்று வடிவில் தெரிவிக்கிறது.
- source_word: οἱ ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: இயேசுவால் அனுப்பப்பட்ட அதிகாரப்பூர்வ சீடர்களைக் குறிக்கும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவரிடம்
  rationale: κύριος என்பதன் மரியாதை மற்றும் கிறிஸ்துவியல் நிறையைத் தக்கவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: Πρόσθες
  choice: பெருக்குங்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சேர்த்தல்’ என்றாலும், விசுவாசத்துடன் வரும் இச்சூழலில் அதன் அளவை அதிகரிக்கும்படி கேட்பதே இயல்பான பொருள்.
- source_word: ἡμῖν
  choice: எங்கள்
  rationale: ‘எங்களுக்கு’ என்ற தத்திவேற்றுமைப் பொருளை, ‘பெருக்குங்கள்’ என்பதுடன் இயல்பாக இணையும் தமிழ் உடைமை வடிவில் தருகிறது.
- source_word: πίστιν
  choice: விசுவாசத்தை
  rationale: இங்கு தேவன்மீது வைக்கும் நம்பிக்கையைக் குறிக்கும் நிலைபெற்ற தமிழ் இறையியல் சொல்; ‘நம்பிக்கை’ என்ற பொருள் நிழலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமானர்
  rationale: ‘ஆண்டவர்’ என்பது மரியாதையான அழைப்பையும் லூக்காவில் உள்ள கிறிஸ்துவியல் நிறையையும் தக்கவைக்கிறது; ‘எஜமானர்’ இங்கு பொருளை மிகக் குறுகலாக்கக்கூடும்.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: அப்போஸ்தலர்கள் தங்கள் விசுவாசம் அல்லது தேவன்மீது வைக்கும் நம்பிக்கை அதிகரிக்க வேண்டும் எனக் கேட்பதே சூழலுக்குப் பொருத்தமானது. ‘உண்மைத்தன்மை’ என்பது சொல்லின் சாத்தியமான பொருள் என்றாலும் இங்கு குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. மரியாதைப் பன்மை வினைமுற்றான ‘பெருக்குங்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கத்தையும் வேண்டுகோளின் நேரடித்தன்மையையும் காத்துள்ளது.
