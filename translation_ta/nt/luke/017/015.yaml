reference: Luke 17:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: ta
  text: ஆனால் அவர்களில் ஒருவர், தான் குணமடைந்ததைக் கண்டு, உரத்த குரலில் கடவுளை மகிமைப்படுத்திக்கொண்டே திரும்பி வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: ஆனால் அவர்களில் ஒருவர்
  rationale: எஞ்சிய ஒன்பது பேரின் செயலுடன் உள்ள மென்மையான கதைமாந்தர் முரண்பாட்டை δέ சுட்டுவதால் ‘ஆனால்’ இயல்பாகப் பொருந்துகிறது; பகுதிப்பொருளையும் ‘அவர்களில் ஒருவர்’ துல்லியமாகக் காக்கிறது.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: தான் குணமடைந்ததைக் கண்டு
  rationale: ἰδὼν என்ற இறந்தகால வினையெச்சத்தின் ஓட்டத்தையும், ἰάθη என்ற இறந்தகாலச் செயப்பாட்டு வடிவம் குறிக்கும் நிறைவேறிய குணப்படுத்துதலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑπέστρεψεν
  choice: திரும்பி வந்தார்
  rationale: சூழலில் இயேசுவிடம் மீண்டும் வருவதைக் குறிக்கும் ὑποστρέφω என்பதற்கு இயல்பான தமிழாக்கம்.
- source_word: μετὰ φωνῆς μεγάλης
  choice: உரத்த குரலில்
  rationale: சொல்லுக்கு சொல் ‘பெரிய குரலுடன்’ என்பதற்குப் பதிலாக, சத்தமாகக் கூறுதலைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: δοξάζων τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்திக்கொண்டே
  rationale: δοξάζω என்பதன் ‘மகிமைப்படுத்துதல்/மகிமை செலுத்துதல்’ என்ற தனித்துவமான பொருளைக் காக்கிறது; நிகழ்கால வினையெச்சம் பிரதானச் செயலுடன் தொடர்வதை ‘-க்கொண்டே’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸν θεόν என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளை
  alternative: தேவனை
  rationale: இங்கு θεός என்பதை எந்தக் கோட்பாட்டு விரிவாக்கமும் இன்றி, நவீன நிலையான தமிழில் பொதுவாகவும் கண்ணியமாகவும் ‘கடவுள்’ என வழங்குகிறது.
- issue: δοξάζων என்பதன் பொருள்
  choice: மகிமைப்படுத்திக்கொண்டே
  alternative: புகழ்ந்துகொண்டே
  rationale: ‘புகழ்தல்’ என்பது உட்பொருளாக இருந்தாலும், கிரேக்கச் சொல்லின் மகிமை சார்ந்த மொழியைத் தமிழில் காப்பது பொருத்தமானது; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ். கிரேக்க வாக்கியத்தின் வினையெச்ச ஓட்டம் இயல்பான தமிழில் காக்கப்பட்டுள்ளது; வெளியீட்டிற்கு அவசியமில்லாத சொற்பொருள் மாற்று அடிக்குறிப்பு சேர்க்கப்படவில்லை.
