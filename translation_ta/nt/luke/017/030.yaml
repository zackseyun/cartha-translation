  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: ta
  text: மனிதகுமாரன் வெளிப்படுத்தப்படும் நாளில் இதேபோலவே இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவ்வாறே” அல்லது “அதே விதமாக.” இந்தக் கிரேக்க மரபுத்தொடர் முந்தைய எடுத்துக்காட்டுகளைத் திரும்பச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: இதேபோலவே
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் முந்தைய எடுத்துக்காட்டுகளைச் சுட்டி, அவற்றில் நிகழ்ந்த அதே விதத்தை ஒப்பிடுகிறது. ‘இதேபோலவே’ என்பது அந்த ஒப்பீட்டு வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தைத் தமிழில் இயல்பாக ‘இருக்கும்’ என்று மொழிபெயர்த்து, எதிர்கால நோக்கைப் பாதுகாக்கிறது.
- source_word: ᾗ ἡμέρᾳ
  choice: நாளிலும்
  rationale: இது காலத்தைக் குறிக்கும் வேற்றுமை அமைப்பு. ‘நாளிலும்’ என்பது ‘அந்த நாளில்’ என்ற காலக் குறிப்பையும், முந்தைய நிகழ்வுகளுடனான ஒப்பீட்டையும் இயல்பாக இணைக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: நற்செய்தி நூல்களில் இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் நிலைபெற்ற பட்டத்தைப் பாதுகாக்கிறது; தானியேல் 7 உடனான மறைநூல் மற்றும் மேசியா சார்ந்த எதிரொலியையும் தக்கவைக்கிறது.
- source_word: ἀποκαλύπτεται
  choice: வெளிப்படுத்தப்படும்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவின் வெளிப்படுத்தப்படுதல் என்ற பொருளைக் காக்கிறது. வெறுமனே ‘வரும்’ அல்லது ‘தோன்றும்’ என்று மாற்றாமல், மனிதகுமாரனின் வெளிப்படையான வெளிப்பாட்டைச் சுட்டுகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற இறுதிக்காலப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனிதன் / மானிடமகன்
  rationale: ‘மனிதகுமாரன்’ என்பது தமிழ்க் கிறிஸ்தவ வாசிப்பில் அறியப்பட்ட பட்டமாக இருப்பதோடு, தானியேல் 7 மற்றும் நற்செய்தி நூல்களின் மேசியா சார்ந்த தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
- issue: இச்சூழலில் ἀποκαλύπτεται என்பதன் வலிமை
  choice: வெளிப்படுத்தப்படும்
  alternative: வரும் / தோன்றும்
  rationale: மூல வினைச்சொல் வருகையை மட்டும் அல்ல, மறைந்திருந்தது வெளிப்படுத்தப்படுவதைச் சொல்கிறது. ஆகவே ‘வரும்’ என்பது மூலத்தில் இல்லாத இயக்கக் கருத்தைச் சேர்க்கக்கூடும்; ‘வெளிப்படுத்தப்படும்’ செயப்பாட்டு வடிவத்தையும் இறுதிக்கால வெளிப்பாட்டின் கருத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற வேதாகமப் பட்டம் பாதுகாக்கப்பட்டுள்ளது; ‘இதேபோலவே இருக்கும்’ என்பது முந்தைய எடுத்துக்காட்டுகளுடனான தொடர்பையும் எதிர்கால நோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
