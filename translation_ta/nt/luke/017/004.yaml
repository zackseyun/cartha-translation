source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: ta
  text: அவன் ஒரு நாளில் ஏழு முறை உனக்கு எதிராகப் பாவம் செய்து, ஏழு முறையும் உன்னிடம் திரும்பி வந்து[a], “நான் மனந்திரும்புகிறேன்” என்று சொன்னால், நீ அவனை மன்னிக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பக்கம் திரும்பி.” இச்சூழலில் கிரேக்க வினைச்சொல் ‘திரும்பி வருதல்’ அல்லது ‘ஒருவரின் பக்கம் திரும்புதல்’ என்ற இரு நுண்பொருள்களையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இது எதிர்கால வினைவடிவில் உள்ளது; இங்கு அது கட்டளை அல்லது கடமையின் வலிமையைக் கொண்டுள்ளது. இதை “நீ அவனை மன்னிப்பாய்” என்றும் நெருக்கமாக மொழிபெயர்க்கலாம்.
    reason: grammatical_force
lexical_decisions:
- source_word: ἑπτάκις
  choice: ஏழு முறை
  rationale: இந்த வினையடைச் சொல் ‘ஏழு தடவை’ என்பதைக் குறிக்கிறது; மீண்டும் மீண்டும் நிகழும் செயலை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τῆς ἡμέρας
  choice: ஒரு நாளில்
  rationale: குறிப்பிட்ட கால எல்லைக்குள் நிகழ்வதைச் சுட்டும் கால மரபுத்தொடர். ‘ஒரு நாளில்’ என்பது இயல்பான தமிழ்; கிரேக்கத்தில் இல்லாத விசேஷ வலியுறுத்தலைச் சேர்க்கும் ‘ஒரே நாளில்’ தவிர்க்கப்பட்டது.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: உனக்கு எதிராகப் பாவம் செய்து
  rationale: εἰς σὲ இங்கு முகவருக்கு எதிராகச் செய்யப்படும் குற்றத்தைக் குறிக்கிறது; ‘உனக்கு எதிராக’ என்பது அதன் உறவுசார் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: உன்னிடம் திரும்பி வந்து
  rationale: ἐπιστρέφω என்பதற்கு ‘திரும்புதல்’ அல்லது ‘திரும்பி வருதல்’ என்று பொருள் கொள்ளலாம். மீண்டும் அணுகும் இச்சூழலில் ‘திரும்பி வந்து’ இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Μετανοῶ
  choice: நான் மனந்திரும்புகிறேன்
  rationale: இது வெறும் வருத்தத்தையோ மன்னிப்புக் கோருதலையோ அல்லாமல் மனப்போக்கின் ஒழுக்க மாற்றத்தைக் குறிக்கிறது. தமிழில் நிலைபெற்றதும் புரிந்துகொள்ளத்தக்கதுமான ‘மனந்திரும்புகிறேன்’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀφήσεις αὐτῷ
  choice: நீ அவனை மன்னிக்க வேண்டும்
  rationale: எதிர்கால வினைவடிவம் இக்கற்பித்தல் சூழலில் கட்டளை அல்லது கடமையின் வலிமையுடன் வருகிறது. நவீனத் தமிழில் ‘மன்னிக்க வேண்டும்’ அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀφήσεις என்ற எதிர்கால வடிவத்தின் வலிமை
  choice: கடமையை உணர்த்தும் ‘நீ அவனை மன்னிக்க வேண்டும்’
  alternative: எதிர்கால முன்னறிவிப்பாக ‘நீ அவனை மன்னிப்பாய்’
  rationale: சீடர்களுக்குக் கொடுக்கப்படும் அறிவுறுத்தல் சூழலில் இது சாதாரண முன்னறிவிப்பு அல்ல, கட்டளையின் வலிமையுள்ள எதிர்கால வடிவம். தமிழ் மொழிபெயர்ப்பு அந்த ஒழுக்கக் கடமையைத் தெளிவாக்குகிறது.
- issue: Μετανοῶ என்பதன் பொருள்
  choice: ‘நான் மனந்திரும்புகிறேன்’
  alternative: ‘நான் வருந்துகிறேன்’
  rationale: மூலச்சொல் வெறும் உணர்ச்சிவசப்பட்ட வருத்தத்தைவிட மனப்போக்கின் மாற்றத்தைக் குறிக்கிறது; ஆகவே அதன் இறையியல் மற்றும் ஒழுக்கப் பருமன் மெலிதாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் வடிவங்களைப் பயன்படுத்தி, இயேசுவின் நேரடியான அறிவுறுத்தல் தொனியைப் பாதுகாக்கிறது. ‘மனந்திரும்புகிறேன்’ என்ற நிலைபெற்ற வேதாகமச் சொல் பொதுவாசகர்களுக்கும் புரியும் வகையில் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
