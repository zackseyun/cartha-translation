source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: ta
  text: அதற்கு அவர்கள் அவரிடம், “ஆண்டவரே, எங்கே?” என்று கேட்டார்கள். அவர் அவர்களிடம், “உடல்[a] எங்கே இருக்கிறதோ, அங்கே பிணந்தின்னிப் பறவைகளும்[b] ஒன்றுகூடும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடல்” என்பதை “பிணம்” என்றும் மொழிபெயர்க்கலாம்; அது பிணந்தின்னிப் பறவைகள் பற்றிய உருவகத்தை இன்னும் வெளிப்படையாக்கும்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான கிரேக்கச் சொல் “கழுகுகள்” என்றும் பொருள்படலாம். ஆனால் ஓர் உடலைச் சுற்றிப் பறவைகள் கூடும் இச்சூழலில், பிணந்தின்னிப் பறவைகள் என்பதே பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: அதற்கு அவர்கள் … கேட்டார்கள்
  rationale: பதில் கூறுவதை அறிமுகப்படுத்தும் பங்கேற்புவினையை, நவீனத் தமிழில் இயல்பான உரையாடல் நடையில் ‘அதற்கு’ என வெளிப்படுத்துகிறது.
- source_word: λέγουσιν
  choice: கேட்டார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ்க் கதைநடையில் இறந்தகாலம் இயல்பானது; கேள்வி உரை என்பதால் ‘சொன்னார்கள்’ என்பதற்குப் பதில் ‘கேட்டார்கள்’ தெளிவாக உள்ளது.
- source_word: Ποῦ
  choice: எங்கே
  rationale: இடத்தைப் பற்றிய சுருக்கமான கேள்வியை நேரடியாகக் காட்டுகிறது; ‘எங்கே போகிறார்கள்?’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ்ச் சொல்.
- source_word: Ὅπου
  choice: எங்கே இருக்கிறதோ
  rationale: பழமொழி போன்ற பொதுவான அமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: முதன்மையான சொற்பொருளைத் தக்கவைக்கிறது; சூழல் இறந்த உடலைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: ἀετοὶ
  choice: பிணந்தின்னிக் கழுகுகள்
  rationale: உடலைச் சுற்றிக் கூடும் பறவைகள் என்ற சூழலில் கழுகினத்தைச் சேர்ந்த பிணந்தின்னிப் பறவைகளைக் குறிக்கும் பொருளை நவீன வாசகருக்குத் தெளிவாக்குகிறது; ‘கழுகுகள்’ என்ற மாற்றுப் பொருள் குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἐπισυναχθήσονται
  choice: ஒன்றுகூடும்
  rationale: கிரேக்க வடிவம் எதிர்காலச் செயப்பாட்டுவினையாக இருந்தாலும், பறவைகள் கூடுவதைத் தமிழில் செயப்பாட்டு வடிவில் கூறுவது செயற்கையாக இருக்கும்; ‘ஒன்றுகூடும்’ அதன் எதிர்கால, கூட்டுச் சார்ந்த பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பைக் குறிக்கும் உருவகத்தின் பொருள்
  choice: உருவகத்தை அதன் தெளிவின்மையோடு நேரடியாக மொழிபெயர்த்தல்
  alternative: இது இறுதி நியாயத்தீர்ப்பு, ரோமப் படையெடுப்பு, அல்லது தவிர்க்க முடியாத வெளிப்பாடு ஆகியவற்றில் ஒன்றைக் குறிப்பதாகத் தெளிவுபடுத்துதல்
  rationale: கிரேக்க உரை உருவகத்தின் குறிப்பிட்ட வரலாற்று அல்லது இறுதிக்காலப் பொருளை அடையாளப்படுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு எந்த ஒரு விளக்கத்தையும் உரைக்குள் புகுத்தாமல் அதன் இறையியல் இழுபறியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொற்றொடரின் உருவகத் தன்மையும் ‘எங்கே?’ என்ற கேள்வியின் சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
