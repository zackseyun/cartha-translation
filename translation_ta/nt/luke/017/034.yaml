id: LUK.17.34
reference: Luke 17:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: ta
  text: 'நான் உங்களுக்குச் சொல்கிறேன்: அந்த இரவில் ஒரே படுக்கையில் இருவர் இருப்பார்கள்; ஒருவர் எடுத்துக்கொள்ளப்படுவார்[a], மற்றவர் விடப்படுவார்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம்முடன் அழைத்துக்கொள்ளப்படுவார்.’ இங்கு παραλημφθήσεται என்ற வினை, எடுத்துக்கொள்ளப்படுவது மீட்புக்காகவா தீர்ப்புக்காகவா என்பதைத் தானாகவே குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பின்னால் விடப்படுவார்.’ மூலத்தில் வெளிப்படையாக இல்லாத பிற்கால இறுதிக்காலத் தொடர்புகளைப் புகுத்தாமல் இருக்க, முதன்மை உரையில் சுருக்கமாக ‘விடப்படுவார்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான வலியுறுத்தலுடன் கூடிய உரையாடல் தொடக்கத்தை, இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ταύτῃ τῇ νυκτί
  choice: அந்த இரவில்
  rationale: குறிப்பிட்ட, எதிர்நோக்கப்பட்ட ஓர் இரவைச் சுட்டும் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔσονται δύο
  choice: இருவர் இருப்பார்கள்
  rationale: எதிர்காலப் பொருளையும், இங்கு குறிப்பிடப்படுவோர் மனிதர்கள் என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: ஒரே படுக்கையில்
  rationale: κλίνη என்பது படுக்கை அல்லது சாய்விருக்கையைக் குறிக்கலாம்; இரவுச் சூழலில் ‘படுக்கை’ இயல்பானது. தமிழில் இருப்பிடத்தைக் குறிக்க ‘படுக்கையில்’ என்பதே இயல்பான நடை.
- source_word: ὁ εἷς
  choice: ஒருவர்
  rationale: இருவரில் ஒருவரைக் குறிக்கும் கிரேக்க இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: παραλημφθήσεται
  choice: எடுத்துக்கொள்ளப்படுவார்
  rationale: ‘தம்முடன் எடுத்துக்கொள்’ என்ற வினையின் செயப்பாட்டு எதிர்கால வடிவத்தைச் சுருக்கமாகத் தருகிறது; இது மீட்புக்காகவா தீர்ப்புக்காகவா என்று வசனம் கூறாததால் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ὁ ἕτερος
  choice: மற்றவர்
  rationale: முதல் நபருக்கு மாறாக இரண்டாவது நபரை இயல்பாகக் குறிக்கிறது.
- source_word: ἀφεθήσεται
  choice: விட்டுவிடப்படுவார்
  rationale: இச்சூழலில் ἀφίημι என்பதன் பொருள் ‘மன்னிக்கப்படுவார்’ அல்ல, ‘விடப்படுவார்’ என்பதாகும். ‘பின்னால்’ என்று சேர்க்காமல் இருப்பது பிற்கால இறுதிக்காலக் கருத்துகளை உரையில் புகுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: எடுத்துக்கொள்ளப்படுபவர் மீட்கப்படுகிறாரா அல்லது தீர்ப்புக்காகக் கொண்டு செல்லப்படுகிறாரா?
  choice: முதன்மை உரை நடுநிலையாக ‘எடுத்துக்கொள்ளப்படுவார்’ என்று கூறுகிறது.
  alternative: எடுத்துக்கொள்ளப்படுபவர் மீட்பைப் பெறுகிறார்; அல்லது அவர் தீர்ப்புக்காகக் கொண்டு செல்லப்படுகிறார்.
  rationale: இந்த வசனத்தில் உள்ள கிரேக்க வினைகள் மட்டும் எந்த விளக்கத்தையும் உறுதியாகத் தீர்மானிக்கவில்லை. ஆகவே ஒரு குறிப்பிட்ட இறுதிக்காலத் திட்டத்தை மொழிபெயர்ப்பில் புகுத்தாமல், மூலத்தின் இறையியல் இழுவிசை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த நடை. ‘எடுத்துக்கொள்ளப்படுவார்’ மற்றும் ‘விட்டுவிடப்படுவார்’ என்ற இணை அமைப்பு மூலத்தின் எதிர்மறை ஒப்புமையையும் திட்டமிட்ட தெளிவின்மையையும் காக்கிறது.
