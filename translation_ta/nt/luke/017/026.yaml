reference: Luke 17:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: ta
  text: நோவாவின் நாட்களில் நடந்ததுபோலவே, மனிதகுமாரனுடைய[a] நாட்களிலும் அப்படியே நடக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மனித மகன்.” கிரேக்கத்தில் உள்ள இந்தப் பட்டம் தானியேல் 7-ஐ எதிரொலிக்கக்கூடும்; அதன் நிலைபெற்ற மெசியா மற்றும் இறுதிக்காலத் தொடர்பைக் காக்க இங்கு “மனிதகுமாரன்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: நடந்ததுபோலவே
  rationale: ஒப்பீட்டின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் ‘போலவே’ வெளிப்படுத்துகிறது.
- source_word: ἐγένετο
  choice: நடந்தது
  rationale: நோவாவின் காலத்தில் நிகழ்ந்தவற்றைக் குறிக்கும் நிகழ்வுப்பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: நோவாவின் நாட்களில்
  rationale: கிரேக்கத்தின் வழக்கமான காலக் குறிப்பை நெருக்கமாகவும் தமிழில் தெளிவாகவும் பிரதிபலிக்கிறது.
- source_word: οὕτως
  choice: அப்படியே
  rationale: முன்னுள்ள ஒப்பீட்டுக்கேற்ற விளைவைச் சுட்டி, καθὼς…οὕτως என்ற இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἔσται
  choice: நடக்கும்
  rationale: எதிர்காலத்தில் அந்நிலை ஏற்படும் என்ற பொருளை இயல்பான தமிழில் தருகிறது; ஒப்பிடப்படுவது நிகழ்வுகள் என்பதையும் தெளிவாக்குகிறது.
- source_word: καὶ
  choice: -லும்
  rationale: ‘மனிதகுமாரனுடைய நாட்களிலும்’ என்ற இணைப்பில் ‘மேலும்/அதுபோலவும்’ என்னும் கிரேக்க καί-யின் விரிவாக்கப் பொருளை இயல்பாகக் கொண்டுவருகிறது.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரனுடைய
  rationale: நற்செய்தி நூல்களில் நிலைபெற்ற இயேசுவின் பட்டத்தைப் பாதுகாத்து, தானியேல் 7-இன் மெசியா மற்றும் இறுதிக்கால எதிரொலியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனித மகன்
  rationale: ‘மனிதகுமாரன்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற பட்டம்; சொற்றொடரின் வடிவத்தையும் தானியேல் 7 சார்ந்த கிறிஸ்துவியல் மற்றும் இறுதிக்காலத் தொடர்புகளையும் அதிகமாக விளக்கித் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘போலவே… அப்படியே’ என்ற அமைப்பு மூலத்தின் ஒப்பீட்டு இணைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
