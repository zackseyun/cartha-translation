  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. தொடர்ச்சியான imperfect வினைகளை “-க்கொண்டும் … இருந்தார்கள்” என்ற ஒருங்கிணைந்த அமைப்பு மூலம் காட்டுகிறது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
