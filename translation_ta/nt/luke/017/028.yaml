  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: ta
  text: 'அவ்வாறே[a], லோத்தின் நாட்களில் நடந்ததுபோலவே: மக்கள் சாப்பிட்டுக்கொண்டும், குடித்துக்கொண்டும், வாங்கிக்கொண்டும், விற்றுக்கொண்டும், நட்டுக்கொண்டும், கட்டிக்கொண்டும் இருந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதேபோல, லோத்தின் நாட்களில் நடந்ததுபோல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: முந்தைய எடுத்துக்காட்டுடன் லோத்தின் நாட்களை இணைக்கும் ஒப்புமை வினையடையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: καθὼς
  choice: போலவே
  rationale: ஒப்புமையை வெளிப்படையாகவும் வலியுறுத்தியும் காட்டுகிறது.
- source_word: ἐγένετο
  choice: நடந்தது
  rationale: γίνομαι என்பதன் நிகழ்வுசார் பொருளை அரங்கேறியது போன்ற செயற்கையான நடையின்றி இயல்பாகத் தருகிறது.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: லோத்தின் நாட்களில்
  rationale: லோத்துடன் தொடர்புடைய காலப்பகுதியைக் குறிக்கும் மூலமொழியின் காலவழக்கைத் தக்கவைக்கிறது.
- source_word: ἤσθιον
  choice: சாப்பிட்டுக்கொண்டும்
  rationale: இறந்தகால imperfect வடிவம் காட்டும் தொடர்ந்து நடைபெற்ற வழக்கமான செயலைத் தமிழின் தொடர்நிலை அமைப்பில் தருகிறது.
- source_word: ἔπινον
  choice: குடித்துக்கொண்டும்
  rationale: பட்டியலிலுள்ள தொடர்ச்சியான அன்றாடச் செயல்களின் ஒரேநிலை அமைப்பைப் பேணுகிறது.
- source_word: ἠγόραζον
  choice: வாங்கிக்கொண்டும்
  rationale: வழக்கமாக நடைபெற்ற வணிகச் செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπώλουν
  choice: விற்றுக்கொண்டும்
  rationale: வாங்குதல் என்பதுடன் இணைந்த சந்தைச் செயலைத் தொடர்நிலையில் தருகிறது.
- source_word: ἐφύτευον
  choice: நட்டுக்கொண்டும்
  rationale: φυτεύω என்பதன் வேளாண்மை சார்ந்த நேரடிப் பொருளையும் தொடர்ச்சியான செயலையும் தருகிறது.
- source_word: ᾠκοδόμουν
  choice: கட்டிக்கொண்டும்
  rationale: οἰκοδομέω என்பதன் நேரடியான கட்டுமானப் பொருளை இங்கு தக்கவைக்கிறது; உருவகப் பொருளைச் சேர்ப்பதில்லை.
