id: LUK.17.1
reference: Luke 17:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: ta
  text: பின்பு அவர் தம்முடைய சீடர்களிடம், “இடறச் செய்பவை[a] வராமல் இருப்பது இயலாதது. ஆனால் அவை எவர் மூலமாக வருகின்றனவோ, அவருக்கு ஐயோ!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குற்றங்கள்,’ ‘பாவத்தில் விழச் செய்யும் காரணங்கள்,’ அல்லது ‘பாவம் செய்யத் தூண்டுபவை.’ கிரேக்கச் சொல்லான σκάνδαλα, மக்களை ஒழுக்க ரீதியாகவோ ஆன்மீக ரீதியாகவோ இடறச் செய்பவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: பின்பு அவர் ... என்றார்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்பைக் குறிக்கிறது. ‘பின்பு’ என்பது தேவையற்ற முரண்பாட்டை உருவாக்காமல் இயல்பான தமிழில் நிகழ்வின் தொடர்ச்சியைத் தருகிறது.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: தம்முடைய சீடர்களிடம்
  rationale: αὐτοῦ என்பதிலுள்ள உடைமைப் பொருளை ‘தம்முடைய’ வெளிப்படுத்துகிறது; μαθηταί என்பதற்கு நிலையான, இயல்பான தமிழ் ‘சீடர்கள்’.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: இயலாதது
  rationale: ἀνένδεκτος குறிக்கும் ‘சாத்தியமற்றது’ என்ற வலிமையைச் சுருக்கமாகத் தருகிறது; அடுத்துள்ள எதிர்மறை வினையெச்ச அமைப்புடன் சேர்ந்து இவை வராமல் இருப்பது இயலாது என்ற தவிர்க்க முடியாத தன்மையை வெளிப்படுத்துகிறது.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: இடறச் செய்பவை வராமல் இருப்பது
  rationale: μή உடனான வினையெச்ச அமைப்பு, இயலாதது எது என்பதை—அவை வராமல் இருப்பதை—குறிக்கிறது. தமிழ் வாக்கிய அமைப்பு மூலத்தின் தர்க்க உறவைத் தெளிவாகக் காக்கிறது.
- source_word: σκάνδαλα
  choice: இடறச் செய்பவை
  rationale: σκάνδαλα என்பது ஒருவரை ஒழுக்க ரீதியாகவோ ஆன்மீக ரீதியாகவோ தடுமாறவைக்கும் பொறிகள் அல்லது காரணங்களைக் குறிக்கலாம். ‘இடறச் செய்பவை’ மூல உருவகத்தை ஓரளவு காத்து, ‘மனவருத்தங்கள்’ அல்லது ‘பாவத் தூண்டுதல்கள்’ என்ற ஒரே பொருளுக்குள் அதைச் சுருக்காமல் விடுகிறது.
- source_word: πλὴν οὐαὶ
  choice: ஆனால் ... அவருக்குக் கேடு!
  rationale: πλήν தவிர்க்க முடியாத நிலைமையிலிருந்து அதற்குக் காரணமானவர்மீதான எச்சரிக்கைத் தீர்ப்புக்கு உரையைத் திருப்புகிறது. οὐαί என்பதன் கடுமையான கண்டனத்தையும் அழிவு எச்சரிக்கையையும் ‘கேடு’ தெளிவாகத் தருகிறது.
- source_word: δι’ οὗ
  choice: யார் மூலம் ... அவருக்கு
  rationale: மூலத்திலுள்ள ஒருமை நபர் குறிப்பையும், அந்த நபர் வழியாக இடறல்கள் வருவதையும் இயல்பான தமிழில் காக்கிறது; தேவையற்ற பாலினக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: ἔρχεται
  choice: வருகின்றனவோ
  rationale: கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும், கருத்தளவில் τὰ σκάνδαλα என்பதையே சுட்டுகிறது. தமிழில் ‘அவை ... வருகின்றன’ என்பது இயல்பான எண்ணிசைவு.
theological_decisions:
- issue: ஒழுக்கப் போதனையில் σκάνδαλα என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘இடறச் செய்பவை’
  alternative: ‘குற்றங்கள்’, ‘பாவத்தில் விழச் செய்யும் காரணங்கள்’, அல்லது ‘பாவத் தூண்டுதல்கள்’
  rationale: இந்தச் சொல் வெறும் மனவருத்தத்தை மட்டும் குறிக்காமல், பிறரை ஒழுக்க அல்லது ஆன்மீக வீழ்ச்சிக்கு இட்டுச் செல்லும் பலவகைக் காரணங்களையும் உள்ளடக்குகிறது. தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு அந்தப் பரப்பையும் உருவகத்தையும் காக்கிறது.
- issue: δι’ οὗ என்பதிலுள்ள பிரதிநிதித்துவ ஒருமை
  choice: ‘யார் மூலம் ... அவருக்கு’
  alternative: ‘எவன் மூலம் ... அவனுக்கு’ அல்லது ‘எந்த நபர் மூலம் ... அந்த நபருக்கு’
  rationale: கிரேக்கத்தின் தனிநபர் பொறுப்பையும் ஒருமை வலிமையையும் காக்கிறது; அதேவேளை தமிழில் தேவையற்ற ஆண்பால் வரையறையைத் தவிர்க்கிறது.
- issue: οὐαί என்பதன் தீர்ப்பு சார்ந்த வலிமை
  choice: ‘அவருக்குக் கேடு!’
  alternative: ‘அவருக்கு ஐயோ!’
  rationale: ‘ஐயோ’ துயர வெளிப்பாடாக மட்டும் கேட்கக்கூடும். ‘கேடு’ வரவிருக்கும் துன்பத்தையும் கடுமையான எச்சரிக்கையையும் சாதாரண வாசகருக்குத் தெளிவாகக் காட்டுகிறது; இறுதித் தீர்ப்பின் முழு விவரத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இடறச் செய்பவை’ என்பது வேதாகம மரபில் அறிமுகமான இடறல் உருவகத்தையும் இன்றைய தமிழின் புரிதலையும் இணைக்கிறது. மேற்கோளுக்குள் இரண்டு வாக்கியங்களாகப் பிரித்தது தமிழில் எச்சரிக்கையின் திருப்பத்தையும் வலிமையையும் தெளிவாக்குகிறது.
