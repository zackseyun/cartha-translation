source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: ta
  text: 'அப்போது இயேசு பதிலளித்தார்: “அந்தப் பத்துப் பேர் தூய்மையாக்கப்படவில்லையா[a]? மற்ற ஒன்பது பேர் எங்கே?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “அந்தப் பத்துப் பேர் சுத்தமாக்கப்படவில்லையா?”'
    reason: καθαρίζω என்பதற்கு ‘தூய்மையாக்கு’ அல்லது ‘சுத்தமாக்கு’ என்று மொழிபெயர்க்கலாம்; இவை இரண்டும் இச்சூழலில் உள்ள தூய்மை சார்ந்த பொருளை வெளிப்படுத்துகின்றன.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: அதற்கு இயேசு … என்றார்
  rationale: கிரேக்கத்தில் இது பதிலுரையை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர். தமிழில் சொற்களை அப்படியே இரட்டிக்காமல், ‘அதற்கு … என்றார்’ என்பது அதன் பதிலுரைப் பொருளையும் இயல்பான நடையையும் காக்கிறது.
- source_word: Οὐχὶ
  choice: தூய்மையாக்கப்படவில்லையா?
  rationale: οὐχί உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. தமிழின் எதிர்மறை வினை வடிவம் அந்தச் சொல்லாட்சியின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ δέκα
  choice: அந்தப் பத்துப் பேரும்
  rationale: குறிப்பிட்ட உருபுடன் வரும் எண், முன் சூழலில் அறியப்பட்ட பத்துப் பேரைக் குறிக்கிறது. ‘அந்த’ என்பது அந்தக் குறிப்பைத் தெளிவாக்குகிறது; ‘பேரும்’ அவர்களில் எவரும் விலக்கப்படவில்லை என்ற வினாவின் இயல்பான தமிழ்ப் பொருளைத் தருகிறது.
- source_word: ἐκαθαρίσθησαν
  choice: தூய்மையாக்கப்பட்டனர்
  rationale: καθαρίζω என்பது ‘தூய்மையாக்குதல்/சுத்தமாக்குதல்’ என்று பொருள்படும். தொழுநோய் சூழலில் உடல் நலமடைதலோடு தூய்மை நிலையும் இதில் அடங்குவதால், ‘குணமாக்கப்பட்டனர்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பரப்பை இது நன்கு காக்கிறது.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: மற்ற ஒன்பது பேர் எங்கே?
  rationale: இங்கு δέ, திரும்பிவந்த ஒருவருக்கும் மீதமுள்ள ஒன்பது பேருக்கும் இடையிலான வேறுபாட்டைக் காட்டுகிறது. ‘மற்ற’ என்பது தமிழில் அந்த எதிர்மறை ஒப்பீட்டைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தொழுநோயாளர்கள் குறித்த சூழலில் καθαρίζω என்பதன் பொருள்
  choice: ‘தூய்மையாக்கப்படுதல்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘குணமாக்கப்படுதல்’ அல்லது ‘சுத்தமாக்கப்படுதல்’
  rationale: மூலச்சொல் வெறும் உடல் குணமடைதலை மட்டும் சொல்லாமல், தூய்மை நிலைக்குக் கொண்டுவரப்படுவதையும் குறிக்கக்கூடும். ‘தூய்மையாக்கப்படுதல்’ இந்தப் பொருள் பரப்பைப் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கேள்விகளின் சுருக்கமும் சொல்லாட்சியின் வலிமையும் காக்கப்பட்டுள்ளன.
