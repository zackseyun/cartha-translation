  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: ta
  text: ஆனால் பரிசேயர் அதைக் கண்டு, இயேசு உணவுக்கு முன் முதலில் சடங்குமுறைப்படி கழுவிக்கொள்ளவில்லை என்பதைக் கண்டு வியப்படைந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு உணவுக்கு முன் முதலில் கழுவிக்கொள்ளவில்லை என்பதைக் கண்டு.” இங்குள்ள கிரேக்க வினைச்சொல் பல இடங்களில் “திருமுழுக்கு பெறுதல்” என்ற பொருளிலும் வருகிறது; ஆனால் இச்சூழலில் பரிசேயரின் தூய்மை வழக்கத்தின்படியான சடங்குக் கழுவுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுக்கும் பரிசேயரின் எதிர்வினைக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: Φαρισαῖος
  choice: பரிசேயர்
  rationale: குழுவின் பெயருக்கான வழக்கமான, மரியாதை விகுதியுடன் கூடிய இயல்பான தமிழாக்கம்.
- source_word: ἰδὼν
  choice: அதைக் கண்டபோது
  rationale: முதன்மை வினைக்கு முந்திய சூழ்நிலையைத் தரும் இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பையும், சூழலில் மறைந்துள்ள செயப்படுபொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐθαύμασεν
  choice: வியப்படைந்தார்
  rationale: எதிர்பாராத செயலைக் கண்ட பரிசேயரின் ஆச்சரியமான எதிர்வினையை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: οὐ πρῶτον
  choice: முதலில் ... கழுவிக்கொள்ளாததை
  rationale: உண்பதற்கு முன் செய்யப்பட வேண்டும் என்று எதிர்பார்க்கப்பட்ட செயல் நிகழவில்லை என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐβαπτίσθη
  choice: சடங்குமுறைப்படி கழுவிக்கொள்ளாததை
  rationale: இங்கு கிறிஸ்தவத் திருமுழுக்கைக் குறிக்காமல், பரிசேயரின் தூய்மை வழக்கத்தோடு தொடர்புடைய சடங்குக் கழுவுதலைக் குறிக்கிறது; நடுவினை வடிவின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πρὸ τοῦ ἀρίστου
  choice: உணவுக்கு முன்
  rationale: ἄριστον என்பது காலை அல்லது நண்பகல் உணவைக் குறிக்கக்கூடும்; நேரத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல் பொதுவான பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பரிசேயரின் உணவுச் சூழலில் ἐβαπτίσθη என்பதன் பொருள்
  choice: உண்பதற்கு முன் சடங்குமுறைப்படி கழுவிக்கொள்ளுதல்
  alternative: திருமுழுக்குப் பெறுதல்; தன்னை மூழ்குவித்துக்கொள்ளுதல்
  rationale: உடனடியான சூழல் உணவுக்கு முன்பான பரிசேயத் தூய்மை வழக்கத்தைப் பற்றியது; கிறிஸ்தவத் திருமுழுக்கு பற்றியது அல்ல. முதன்மை உரையில் சடங்குத் தன்மையைச் சொல்வது வாசகருக்கு நோக்கப்பட்ட பொருளைத் தெளிவாக்குகிறது; அடிக்குறிப்பு வினையின் பரந்த பயன்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சடங்குச் சூழல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படுத்தப்பட்டுள்ளது.
