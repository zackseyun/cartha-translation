id: LUK.11.41
reference: Luke 11:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: ta
  text: ஆனால், உள்ளே இருப்பவற்றைத் தர்மமாகக் கொடுங்கள்[a]; இதோ, எல்லாம் உங்களுக்குத் தூய்மையாக இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடம் இருப்பவற்றைத் தர்மமாகக் கொடுங்கள்.” கிரேக்கச் சொற்றொடர் உள்ளே இருப்பவற்றையோ, ஒருவரிடம் கைவசம் உள்ள உடைமைகளையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் வெளிப்புறத் தூய்மையைப் பற்றிய பேச்சுக்கு எதிராக ஒரு திருத்தமான முரண்பாட்டை அறிமுகப்படுத்துகிறது.
- source_word: τὰ ἐνόντα
  choice: உள்ளே இருப்பவற்றை
  rationale: சொல்லுக்குச் சொல் பொருளையும், பாத்திரத்தின் வெளிப்புறம்–உட்புறம் என்ற உடனடிச் சூழலின் முரண்பாட்டையும் காக்கிறது. உடைமைகளைக் குறிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δότε
  choice: கொடுங்கள்
  rationale: கிரேக்கக் கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐλεημοσύνην
  choice: தர்மமாக
  rationale: தேவையுள்ளவர்களுக்கு இரக்கத்துடன் கொடுப்பதைக் குறிக்கும் சொல். ‘தர்மமாகக் கொடுங்கள்’ என்பது கிரேக்க வாக்கிய அமைப்பைப் பிரதிபலிக்கும் இயல்பான தமிழ்; மூலத்தில் நேரடியாக இல்லாத பெறுநரைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் விளைவை வலியுறுத்தும் சொல்லின் சொல்லாட்சிச் சக்தியைப் பாதுகாக்கிறது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: அனைத்தையும் உள்ளடக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: καθαρὰ
  choice: தூய்மையாக
  rationale: சடங்கு சார்ந்த தூய்மை குறித்த முந்தைய விவாதத்துடனான தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: உங்களைப் பொறுத்தவரையில் அல்லது உங்களுக்காக என்ற கிரேக்க வேற்றுமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὰ ἐνόντα என்பது உள்ளார்ந்த நிலையைச் சுட்டுகிறதா, கைவசமுள்ள உடைமைகளைச் சுட்டுகிறதா?
  choice: உள்ளே இருப்பவற்றை
  alternative: உங்களிடம் இருப்பவற்றை
  rationale: லூக்கா 11:39-இல் பாத்திரத்தின் வெளிப்புறமும் உட்புறமும் நேரடியாக முரண்படுத்தப்படுவதால், உள்ளார்ந்த பொருள் உடனடிச் சூழலுக்கு நன்றாகப் பொருந்துகிறது. எனினும், உடைமைகளைக் குறிக்கும் பொருளும் கிரேக்கச் சொற்றொடருக்கு சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இதோ’ என்ற சற்றே உயர்ந்த கவன ஈர்ப்புச் சொல் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; மையக் கிரேக்கச் சொற்றொடரின் உண்மையான இருபொருள் தன்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
