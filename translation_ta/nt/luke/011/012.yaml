  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: ta
  text: அல்லது, அவன் ஒரு முட்டையைக் கேட்டால், அவனுக்குத் தேளைக் கொடுப்பாரா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: அல்லது
  rationale: இயேசுவின் தொடர்ச்சியான ஒப்புமையில் அடுத்த மாற்று எடுத்துக்காட்டை அறிமுகப்படுத்துகிறது; καί-ஐ தனியே மொழிபெயர்க்காமல் இருப்பது இயல்பான தமிழைத் தருகிறது.
- source_word: αἰτήσει
  choice: கேட்டால்
  rationale: எதிர்காலக் குறிப்பு கொண்ட கிரேக்க வினை இங்கு நிபந்தனைத் தன்மையுள்ள வினாவாக வருகிறது; தமிழில் ‘கேட்டால்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: ᾠόν
  choice: ஒரு முட்டையை
  rationale: மூலச்சொல்லின் நேரடியான, பொதுவான பொருள்.
- source_word: ἐπιδώσει
  choice: கொடுப்பாரா
  rationale: கேட்டதற்குப் பதிலாக ஒன்றைக் கொடுப்பதைக் குறிக்கிறது; மரியாதை ஒருமை வடிவம் தந்தையைக் குறிக்கும் தமிழ்ச் சூழலுக்கு இயல்பாக உள்ளது.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: பெறுபவரைக் குறிக்கும் மறைமுக வேற்றுமைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: σκορπίον
  choice: தேள்
  rationale: மூலச்சொல்லின் வழக்கமான தமிழ் இணை; முட்டைக்கும் ஆபத்தான தேளுக்கும் இடையிலான கூர்மையான முரண்பாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தந்தை–பிள்ளை ஒப்புமையின் வினாவியல் வலிமை
  choice: விளக்கச் சேர்க்கையின்றி நேரடியான எதிர்பார்ப்புவினாவாக மொழிபெயர்த்தல்
  alternative: ‘அதற்குப் பதிலாக’ என்று சேர்த்து முரண்பாட்டை வெளிப்படையாக்குதல்
  rationale: கிரேக்கத்தில் முரண்பாடு உள்ளடக்கமாகவே உள்ளது. தமிழிலும் அது தெளிவாகப் புரிவதால், தந்தையின் நன்மையைப் பற்றிய கருத்தை விளக்கவுரையால் விரிவாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான பேச்சுநடை. தொடரின் தந்தை–மகன் சூழலைக் கருத்தில் கொண்டு ‘அவர்’ சார்ந்த மரியாதை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
