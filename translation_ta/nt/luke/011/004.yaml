reference: Luke 11:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: ta
  text: எங்கள் பாவங்களை எங்களுக்கு மன்னியும்; ஏனெனில் நாங்களே எங்களுக்குக் கடன்பட்டிருக்கும் ஒவ்வொருவரையும் மன்னிக்கிறோம். எங்களைச் சோதனைக்குள் கொண்டுவராதேயும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சோதனை’ என்பதற்கு ‘தீமைக்கான தூண்டுதல்’ அல்லது ‘பரீட்சை’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: மன்னியும்
  rationale: இறைவனிடம் வேண்டிக்கொள்ளும் சூழலில் ἀφίημι இயல்பாக ‘மன்னி’ என்று பொருள்படும். வேண்டுதலுக்குரிய மரியாதைமிக்க ஏவல் வடிவமாக ‘மன்னியும்’ பயன்படுத்தப்பட்டது.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: எங்கள் பாவங்களை
  rationale: மூலத்தில் இங்கு ἁμαρτίας என்பது வெளிப்படையாக ‘பாவங்கள்’ என்கிறது; ‘கடன்கள்’ என்று மாற்றாமல் அந்த வேறுபாடு காக்கப்பட்டது.
- source_word: καὶ γὰρ αὐτοὶ
  choice: ஏனெனில் ... நாங்களும்
  rationale: γὰρ தரும் காரணத் தொடர்பையும், αὐτοὶ தரும் வலியுறுத்தலையும், καί தரும் ‘கூட/உம்’ பொருளையும் இயல்பான தமிழில் இந்த அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἀφίομεν
  choice: மன்னிக்கிறோம்
  rationale: ἄφες என்பதுடனான வினைச்சொல் தொடர்பைக் காக்கவும், மனிதர்களுக்கிடையேயான சூழலில் இயல்பாக இருக்கவும் ‘மன்னிக்கிறோம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: எங்களுக்குக் கடன்பட்டிருக்கும் ஒவ்வொருவரையும்
  rationale: ὀφείλω என்பதிலுள்ள கடன் உருவகத்தைத் தெளிவாகக் காக்கிறது; முதல் கூறின் ‘பாவங்கள்’ என்பதையும் இக்கூறின் ‘கடன்பட்டிருப்பவர்’ என்பதையும் ஒன்றாக்கவில்லை.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς
  choice: எங்களை ... கொண்டுவராதேயும்
  rationale: εἰσφέρω என்பதன் அடிப்படைப் பொருள் ‘உள்ளே கொண்டுவருதல்.’ பாரம்பரியமான ‘வழிநடத்தாதேயும்’ என்பதைக் காட்டிலும் மூல வினைக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: πειρασμόν
  choice: சோதனை
  rationale: πειρασμός என்பது ‘சோதனை,’ ‘பரீட்சை,’ அல்லது தீமைக்கான ‘தூண்டுதல்’ எனப் பொருள்படலாம். தமிழில் ‘சோதனை’ இந்த விரிவான பொருள் வரம்பையும் சூழலின் இறையியல் பதற்றத்தையும் அதிகமாகக் காக்கிறது.
theological_decisions:
- issue: πειρασμός குறித்த இறுதி வேண்டுதலின் பொருள்
  choice: ‘எங்களைச் சோதனைக்குள் கொண்டுவராதேயும்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘எங்களைத் தீய தூண்டுதலுக்குள் கொண்டுவராதேயும்’ அல்லது ‘எங்களைச் சோதனைக்குள் வழிநடத்தாதேயும்’
  rationale: கடவுளுக்கும் சோதனைக்கும் உள்ள தொடர்பை விளக்கிச் சமன் செய்யாமல், கிரேக்க வாசகத்தின் நேரடியான வேண்டுதலையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது. πειρασμός என்பதன் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க ஜெப நடையைப் பயன்படுத்துகிறது. ‘மன்னியும்,’ ‘கொண்டுவராதேயும்’ ஆகியவை இறைவனை நேரடியாக விளிக்கும் dignified வேண்டுதல் வடிவங்கள். மூலத்தின் ‘பாவங்கள்’/‘கடன்பட்டிருப்பவர்கள்’ என்ற சொற்பொருள் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
