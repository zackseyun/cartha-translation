- from: எங்கள் பாவங்களை எங்களுக்கு மன்னியும்; ஏனெனில் எங்களுக்குக் கடன்பட்டிருக்கும் ஒவ்வொருவரையும் நாங்களும் மன்னிக்கிறோம். எங்களைச் சோதனைக்குள் கொண்டுவராதேயும்.[a]
  to: எங்கள் பாவங்களை எங்களுக்கு மன்னியும்; ஏனெனில் நாங்களே எங்களுக்குக் கடன்பட்டிருக்கும் ஒவ்வொருவரையும் மன்னிக்கிறோம். எங்களைச் சோதனைக்குள் கொண்டுவராதேயும்.[a]
