  source_fidelity: மூல கிரேக்கத்தின் காலநிலைத் தொடர்ச்சி (ஜெபித்துக்கொண்டிருந்தார்), குறிப்பிடப்படாத இடம், ஜெபத்தை நிறுத்திய பின்னரான நிகழ்வு, சீடர்களில் ஒருவரின் அடையாளமின்மை, மற்றும் யோவானின் சீடர்களுடனான ஒப்பீடு ஆகியவை துல்லியமாக வெளிப்பட்டுள்ளன. Καὶ ἐγένετο என்ற லூக்கா நிகழ்வுரைச் சூத்திரம் தனியாகச் சொல்லப்படாமல் இயல்பான தமிழ் கதைநடையில் உட்கொடுக்கப்பட்டுள்ளது; பொருள் இழப்பு இல்லை.
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது. “ஜெபிக்கக் கற்றுக்கொடுத்ததுபோல, எங்களுக்கும் கற்றுக்கொடுங்கள்” என்பது தமிழில் தெளிவான, தேவையற்ற மீளுரையற்ற அமைப்பு.
