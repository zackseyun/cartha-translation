id: LUK.11.1
reference: Luke 11:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: ta
  text: அவர் ஓரிடத்தில் ஜெபித்துக்கொண்டிருந்தார். அவர் ஜெபிப்பதை நிறுத்தியபோது, அவருடைய சீடர்களில் ஒருவர் அவரிடம், “ஆண்டவரே, யோவான் தன் சீடர்களுக்கு ஜெபிக்கக் கற்றுக்கொடுத்ததுபோல, எங்களுக்கும் கற்றுக்கொடுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: '[தனி சொற்றொடராக மொழிபெயர்க்காமல் இயல்பான நிகழ்வுரை அமைப்பில் வெளிப்படுத்தப்பட்டது]'
  rationale: லூக்காவின் நிகழ்வை அறிமுகப்படுத்தும் இச்சொற்றொடரின் செயல்பாட்டைத் தமிழில் செயற்கையான ‘அது நிகழ்ந்தது’ என்று கூறாமல், இயல்பான கதைநடை வாக்கியத் தொடக்கத்தால் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: அவர் ... ஜெபித்துக்கொண்டிருந்தார்
  rationale: ἐν உடனான articular infinitive மற்றும் நிகழ்காலப் பங்கேற்புச் சொல் காட்டும் ஒரேகாலத் தொடர்நிலையை ‘ஜெபித்துக்கொண்டிருந்தார்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν τόπῳ τινὶ
  choice: ஓரிடத்தில்
  rationale: குறிப்பிடப்படாத இடம் என்ற கிரேக்கச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὡς ἐπαύσατο
  choice: அவர் ஜெபிப்பதை நிறுத்தியபோது
  rationale: ἐπαύσατο என்பதன் ‘நிறுத்தினார்/ஓய்ந்தார்’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது; ‘முடித்தபோது’ என்று நோக்கநிறைவைச் சேர்க்கவில்லை.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் ஒருவர்
  rationale: பகுதிப்பொருள் அமைப்பையும் அடையாளம் குறிப்பிடப்படாத ஒருவரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் மரியாதைமிக்க அழைப்பையும் புதிய ஏற்பாட்டில் நிலைபெற்ற பட்டப்பெயர் சார்ந்த பரப்பையும் பாதுகாக்கிறது.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: எங்களுக்கும் கற்றுக்கொடுங்கள்
  rationale: முந்திய ‘ஜெபிக்க’ என்பதே கற்றுக்கொடுக்க வேண்டிய செயலைத் தெளிவாக்குவதால், தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது; καί-யின் இணைப்புப் பொருளை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: யோவான் தன் சீடர்களுக்கு ஜெபிக்கக் கற்றுக்கொடுத்ததுபோல
  rationale: καθώς என்பதன் ஒப்பீட்டையும் யோவான் தன் சீடர்களுக்குக் கற்பித்த செயலும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: இயேசுவை நோக்கி κύριος என்று அழைத்தல்
  choice: ஆண்டவரே
  alternative: போதகரே
  rationale: ‘ஆண்டவர்’ என்பது κύριος என்பதன் வழக்கமான தமிழ் வேதாகமச் சமமான சொல்லாக இருந்து, மரியாதைமிக்க நேரடி அழைப்பையும் கிறிஸ்துவியல் சாத்தியத்தையும் பாதுகாக்கிறது; உடனடிச் சூழலில் அதன் முழுத் தெய்வவியல் எடையை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் சொல். கிரேக்க நிகழ்வுரைச் சூத்திரத்தைச் சொற்குச் சொல் இறுக்கமாக்காமல், அதன் கதைநடைச் செயல்பாடு இயல்பான தமிழில் தரப்பட்டுள்ளது.
