revisions:
- from: நியாயத்தீர்ப்பின்போது இந்தத் தலைமுறையினரோடு நினிவே நகரத்து ஆண்கள் எழுந்து, இவர்களைக் கண்டனம் செய்வார்கள். ஏனெனில், யோனாவின் அறிவிப்பைக் கேட்டு அவர்கள் மனந்திரும்பினார்கள். இதோ, யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது.[a]
  to: நியாயத்தீர்ப்பின்போது இந்தத் தலைமுறையினரோடு நினிவே நகரத்தைச் சேர்ந்த ஆண்கள் எழுந்து, இந்தத் தலைமுறையைக் குற்றவாளி எனத் தீர்ப்பிடுவார்கள். ஏனெனில், அவர்கள் யோனாவின் அறிவிப்புக்குப் பதிலளித்து மனந்திரும்பினார்கள். இதோ, யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது.[a]
  rationale: The revision corrects two source-level issues while retaining the draft’s translation philosophy and its careful treatment of the neuter πλεῖον. It renders the Ninevites’ repentance as a response to Jonah’s proclamation and restores the judicial force of κατακρίνω. No disputed ambiguity has been resolved beyond what the Greek supports.
  reviewer_model: gpt-5.6-terra
