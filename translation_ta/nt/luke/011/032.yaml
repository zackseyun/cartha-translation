source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: ta
  text: நியாயத்தீர்ப்பின்போது இந்தத் தலைமுறையினரோடு நினிவே நகரத்தைச் சேர்ந்த ஆண்கள் எழுந்து, இந்தத் தலைமுறையைக் குற்றவாளி எனத் தீர்ப்பிடுவார்கள். ஏனெனில், அவர்கள் யோனாவின் அறிவிப்புக்குப் பதிலளித்து மனந்திரும்பினார்கள். இதோ, யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யோனாவைவிட மேலானவர் இங்கே இருக்கிறார்” அல்லது “யோனாவைவிட அதிகமானது இங்கே இருக்கிறது” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “மேலானது/அதிகமானது” என்பது இடைப்பால் வடிவில் உள்ளது. எனவே, இது ஓர் ஆளோடு செய்யப்படும் ஒப்பீட்டை மட்டும் அல்லாமல், இயேசுவிலும் அவரது பணியிலும் இங்கே வந்துள்ள மேலான நிஜத்தைப் பரந்த விதத்தில் சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: நினிவே நகரத்து ஆண்கள்
  rationale: ἄνδρες என்பதன் வெளிப்படையான ஆண்பால் பன்மையை ‘ஆண்கள்’ எனத் தக்கவைத்து, Νινευῖται என்பதை இயல்பான தமிழில் ‘நினிவே நகரத்து’ என வழங்குகிறது.
- source_word: ἀναστήσονται
  choice: எழுந்து
  rationale: எதிர்கால நியாயத்தீர்ப்பின் சூழலில் எழுதல் என்ற உயிர்ப்புள்ள படிமத்தைப் பேணுகிறது; ‘உயிர்த்தெழுவார்கள்’ என்று விளக்கத்தை மிகைப்படுத்தவில்லை.
- source_word: ἐν τῇ κρίσει
  choice: நியாயத்தீர்ப்பின்போது
  rationale: இறுதி நீதித்தீர்ப்பு நிகழ்வை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையினரோடு
  rationale: μετά என்பதன் உடனிருப்பு பொருளையும், ‘இந்தத் தலைமுறை’ என்ற நற்செய்திநூல் சொற்றொடரின் வரலாற்று-அறநெறி வலிமையையும் காக்கிறது.
- source_word: κατακρινοῦσιν αὐτήν
  choice: இவர்களைக் கண்டனம் செய்வார்கள்
  rationale: αὐτήν குறிக்கும் ‘இந்தத் தலைமுறையினர்’ தமிழில் மனிதர்களாக இயல்பாகச் சுட்டப்படுகின்றனர்; κατακρίνω என்பதன் கண்டனத் தீர்ப்பை வெறும் ‘தீர்ப்பிடுதல்’ என மெலிதாக்காமல் வழங்குகிறது.
- source_word: μετενόησαν
  choice: மனந்திரும்பினார்கள்
  rationale: தீர்க்கதரிசனச் சூழலில் உள்ள அறநெறி மற்றும் ஆன்மீகத் திருப்பத்தை இயல்பான வேதாகமத் தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: யோனாவின் அறிவிப்பைக் கேட்டு
  rationale: κήρυγμα என்பதைக் ‘அறிவிப்பு’ எனவும், εἰς குறிக்கும் அந்த அறிவிப்புக்கான மறுமொழியை ‘கேட்டு’ எனவும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் சொற்பொழிவுக் குறியின் கண்ணியமான, இயல்பான தமிழ் வடிவம்.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது
  rationale: πλεῖον என்பதன் இடைப்பால் வடிவத்துக்கு ஒத்த பரந்த பொருளை ‘மேலான ஒன்று’ எனப் பேணி, அதை ‘மேலானவர்’ என்ற தனிநபர் ஒப்பீடாக மட்டும் சுருக்கவில்லை.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ என்பதன் சுட்டுப்பொருளும் வலிமையும்
  choice: யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது
  alternative: யோனாவைவிட மேலானவர் இங்கே இருக்கிறார்; யோனாவைவிட அதிகமானது இங்கே இருக்கிறது
  rationale: கிரேக்கத்தில் πλεῖον இடைப்பால் வடிவில் உள்ளது. இயேசு கருத்தில் இருப்பது தெளிவாயினும், அவரது நபரை மட்டுமல்லாமல் அவரிலும் அவரது பணியிலும் வந்துள்ள மேலான நிஜத்தையும் இச்சொல் உள்ளடக்கக்கூடும். ஆகவே அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘மனந்திரும்பினார்கள்’, ‘நியாயத்தீர்ப்பு’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தெளிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன; πλεῖον என்பதிலுள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
