source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: ta
  text: 'அவர் இவற்றைச் சொல்லிக்கொண்டிருந்தபோது, இவ்வாறு நிகழ்ந்தது: கூட்டத்திலிருந்து ஒரு பெண் குரலை உயர்த்தி அவரிடம், “உம்மைச் சுமந்த கருப்பையும், நீர் பாலருந்திய மார்புகளும் பாக்கியமுள்ளவை!” என்றாள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: அவர் இவற்றைச் சொல்லிக்கொண்டிருந்தபோது
  rationale: ἐν τῷ உடன் வரும் நிகழ்காலத்தன்மையுள்ள infinitive, அதே நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது; Ἐγένετο δὲ என்பதன் நிகழ்வை அறிமுகப்படுத்தும் பணி வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: ஒரு பெண் குரலை உயர்த்தி
  rationale: ἐπαίρω φωνήν என்பது உரத்த குரலில் பேசுதல் அல்லது கூவிச் சொல்லுதல் என்ற மரபுத்தொடர். ‘ஒரு பெண்’ என்பது τις-ஐ இயல்பாகத் தருகிறது.
- source_word: ἐκ τοῦ ὄχλου
  choice: கூட்டத்திலிருந்த
  rationale: அந்தப் பெண் கூட்டத்திலிருந்து பேசினாள் என்ற மூலத்திலுள்ள உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Μακαρία
  choice: பேறுபெற்றவை
  rationale: வெறும் மனமகிழ்ச்சியைக் காட்டாமல், சிறப்பான நற்பேறு பெற்ற நிலையை வெளிப்படுத்துகிறது. கருப்பையும் மார்புகளும் இணைந்து வருவதால் தமிழில் பன்மை வினைப்பயனிலை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἡ κοιλία
  choice: கருப்பை
  rationale: தாய்மைச் சூழலில் κοιλία குறிப்பாகக் கருப்பையைக் குறிக்கிறது; ‘வயிறு’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: ἡ βαστάσασά σε
  choice: உம்மைச் சுமந்த
  rationale: கர்ப்பத்தில் தாங்கிச் சுமந்ததைக் குறிக்கும் βαστάζω என்பதன் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: நீர் பாலருந்திய மார்புகள்
  rationale: தாய்ப்பாலூட்டும் உருவகத்தை மறைக்காமல், கிரேக்கத் தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் தாயை வாழ்த்தும் Μακαρία என்பதன் மொழிபெயர்ப்பு
  choice: உம்மைச் சுமந்த கருப்பையும், நீர் பாலருந்திய மார்புகளும் பேறுபெற்றவை
  alternative: உம்மைச் சுமந்த கருப்பையும், நீர் பாலருந்திய மார்புகளும் பாக்கியமுள்ளவை
  rationale: ‘பேறுபெற்றவை’ என்பது அந்தப் பெண்ணின் உயர்வான வாழ்த்தைத் தக்கவைக்கிறது; அதேவேளையில், மூலவசனம் கூறுவதைக் குறைக்கவோ பிற்கால மரியியல் கோட்பாடுகளைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையுடனான ‘உம்மை/நீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. தாய்மை சார்ந்த உடற்கூறு மொழி மூலத்தைப் போலவே தெளிவாக வைக்கப்பட்டுள்ளது; தேவையற்ற பழமையான நடையும் சமயப்பிரிவு சார்ந்த சொற்களும் தவிர்க்கப்பட்டுள்ளன.
