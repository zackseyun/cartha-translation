  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: ta
  text: உலகம் தோன்றியதுமுதல் சிந்தப்பட்ட எல்லா இறைவாக்கினர்களின் இரத்தத்திற்கான கணக்கு இந்தத் தலைமுறையிடம் கேட்கப்படும்படி[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தத் தலைமுறையிடமிருந்து அந்த இரத்தத்திற்கான பொறுப்பு கேட்கப்படும்படி.” கிரேக்க வினைச்சொல், சிந்தப்பட்ட இரத்தத்திற்காக ஒருவரைப் பொறுப்புக்குள்ளாக்கும் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: கேட்கப்படும்படி
  rationale: முந்தைய கூற்றுடன் இணையும் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἐκζητηθῇ
  choice: கணக்குக் கேட்கப்படும்படி
  rationale: இங்கு வினைச்சொல் வெறுமனே தேடுவதைக் குறிக்காமல், சிந்தப்பட்ட இரத்தத்திற்காக நீதியின்படி பொறுப்புக் கோருவதைக் குறிக்கிறது.
- source_word: τὸ αἷμα
  choice: இரத்தத்திற்காகவும்
  rationale: கிரேக்கத்தின் ‘இரத்தம்’ என்ற உருவகத்தைத் தக்கவைத்தபடி, அதற்காகக் கணக்குக் கேட்கப்படும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάντων τῶν προφητῶν
  choice: எல்லா இறைவாக்கினர்களின்
  rationale: குற்றச்சாட்டின் முழுமையான பரப்பைக் காட்டும் πάντων என்பதையும், கடவுளின் செய்தியை அறிவிப்பவர்களைக் குறிக்கும் προφητῶν என்பதையும் தெளிவாக வழங்குகிறது.
- source_word: τὸ ἐκκεχυμένον
  choice: சிந்தப்பட்ட
  rationale: வன்முறையால் கொல்லப்பட்டவர்களின் இரத்தத்தைப் பற்றிய சூழலில் இயல்பான தமிழ் வழக்காகவும், நிறைவு பெற்ற செயலைக் குறிக்கும் கிரேக்கப் பெயரெச்சத்திற்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: உலகம் படைக்கப்பட்டதுமுதல்
  rationale: உலகத்தின் தொடக்கத்திலிருந்து என்ற காலக் கருத்தை நவீன வாசகர்களுக்குத் தெளிவான, வேதாகமப் பதிவுக்கு ஏற்ற தமிழில் தருகிறது.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையிடம்
  rationale: பொறுப்புக் கணக்கு யாரிடம் கேட்கப்படுகிறது என்பதை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: இறைவாக்கினர்களின் இரத்தத்திற்காக ‘கணக்குக் கேட்கப்படுதல்’ என்பதன் தன்மை
  choice: கடவுளுடைய தூதர்களைக் கொன்றதற்கான திரண்ட பொறுப்பு இந்தத் தலைமுறையிடம் நீதித் தீர்ப்பின் அடிப்படையில் கேட்கப்படுகிறது.
  alternative: இது நீதிசார் பொறுப்பை வலியுறுத்தாமல், வரலாற்றுத் தொடர்ச்சியை மட்டும் சுட்டும் சொல்லாட்சி.
  rationale: ἐκζητέω என்பதன் செயப்பாட்டு வடிவம், இரத்தம் சிந்தப்பட்ட சூழலில், பொறுப்புக் கணக்குக் கோரும் நீதிசார் பொருளைக் கொண்டுள்ளது. ஆனால் அந்தக் கூட்டு அல்லது தலைமுறை சார்ந்த பொறுப்பு எவ்வாறு செயல்படுகிறது என்பதை மொழிபெயர்ப்பு மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘இறைவாக்கினர்’ என்பது பொதுவாசகர்களுக்குப் புரியும் வகையில் προφήτης என்பதற்குப் பயன்படுத்தப்பட்டது. மூலத்தின் நோக்கம்/விளைவு சார்ந்த தொடரமைப்பைக் காக்க வசனம் காற்புள்ளியுடன் முடிகிறது.
