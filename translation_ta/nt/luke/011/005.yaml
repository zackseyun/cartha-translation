review_pass:
  verdict: revise
  source_fidelity: The draft retains the rhetorical future sequence, the midnight setting, the repeated term “friend,” and the request to borrow three loaves. However, “உங்களில் யாருக்கு ஒரு நண்பர் இருப்பாரோ, அவர்” can grammatically make “அவர்” refer to the friend rather than to the member of the audience. Recasting the first predicate as “ஒரு நண்பரைக் கொண்டிருப்பாரோ” makes the audience member unambiguously the subject of both following actions, without changing the rhetorical-future force.
  naturalness: The revised wording is natural modern standard Tamil while retaining the deliberately unfinished rhetorical-question construction that continues in the following verses. “அந்த நண்பரிடம்” is retained for clear reference, and “கடனாகக் கொடுங்கள்” naturally conveys the request to lend.
  terminology: “நண்பர்/நண்பரே” appropriately preserves the Greek lexical repetition. “அப்பங்கள்” is an established Bible-register rendering for ἄρτους and is understandable in modern Tamil. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: Ambiguous antecedent in “உங்களில் யாருக்கு ஒரு நண்பர் இருப்பாரோ, அவர்”.
    rationale: Because “ஒரு நண்பர்” is the immediately preceding singular human noun, “அவர்” may be read as referring to that friend, although the Greek subject of “will go” is the person among the hearers. “ஒரு நண்பரைக் கொண்டிருப்பாரோ” removes this syntactic ambiguity.
