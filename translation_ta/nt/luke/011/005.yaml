translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனங்களில் நிறைவுபெறும் சொல்லாட்சிக் கேள்வியின் தொடக்கம் என்பதால் இறுதியில் முடிவுக்குறி இடப்படவில்லை. ‘நண்பர்/நண்பரே’ மற்றும் ‘கொடுங்கள்’ ஆகிய மரியாதை வடிவங்கள் இயல்பான அயலார் உரையாடலைக் காட்டுகின்றன.
