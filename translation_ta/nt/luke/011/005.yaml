source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: ta
  text: பின்பு அவர் அவர்களிடம், “உங்களில் யாராவது ஒரு நண்பரைக் கொண்டிருப்பாரோ, அவர் நடுநிசியில் அந்த நண்பரிடம் சென்று, ‘நண்பரே, எனக்கு மூன்று அப்பங்களைக் கடனாகக் கொடுங்கள்’ என்று சொல்வாரோ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களில் யாருக்காவது ஒரு நண்பர் இருந்து, அவர் நடுநிசியில் அந்த நண்பரிடம் சென்று … சொன்னால்,” என்று நிகழ்காலத் தன்மையுடன் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லாட்சிக் கேள்விக்குள் எதிர்கால வினை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: கிரேக்க எதிர்கால வடிவங்களையும் தமிழில் இயல்பான நிபந்தனை அல்லது நிகழ்கால வடிவத்தையும் வாசகர் அறியச் செய்வதற்கான இலக்கண மாற்று.
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: உங்களில் யாருக்கு
  rationale: கேட்போரை நேரடியாக எதிர்கொள்ளும் கிரேக்க வினாவை இயல்பான தமிழில் தொடங்குகிறது; அடுத்துள்ள ‘ஒரு நண்பர் இருப்பாரோ’ என்பதோடு இணைந்து தொடரும் சொல்லாட்சியாக அமைகிறது.
- source_word: ἕξει
  choice: ஒரு நண்பர் இருப்பாரோ
  rationale: கிரேக்கத்தின் எதிர்கால வினை வடிவத்தைத் தமிழிலும் எதிர்கால வடிவில் தக்கவைக்கிறது; இது உண்மையான தகவல் விசாரணை அல்ல, எடுத்துக்காட்டை அறிமுகப்படுத்தும் சொல்லாட்சிக் கேள்வி.
- source_word: φίλον / Φίλε
  choice: நண்பர் / நண்பரே
  rationale: ஒரே மூலச்சொல்லின் மீளுரையைத் தமிழிலும் ஒரே சொல்லால் காக்கிறது. மரியாதைப் பன்மை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்கிறது.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: அந்த நண்பரிடம் சென்று
  rationale: இயக்கத்தையும் இலக்கையும் தெளிவாக வழங்குகிறது; பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்க ‘அந்த நண்பர்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: μεσονυκτίου
  choice: நடுநிசியில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க வடிவத்துக்கு நேரடியான, செம்மையான நவீனத் தமிழ் இணை.
- source_word: εἴπῃ αὐτῷ
  choice: என்று சொல்வாரோ
  rationale: சொல்லாட்சிக் கேள்வியின் தொடர்ச்சிக்கேற்ற எதிர்காலத் தமிழ் வடிவத்தைப் பயன்படுத்தி λέγω என்பதன் பொதுவான பொருளைக் காக்கிறது.
- source_word: χρῆσόν μοι
  choice: எனக்கு … கடனாகக் கொடுங்கள்
  rationale: தற்காலிகமாக வழங்குமாறு கேட்கும் பொருளைத் தெளிவாகக் காட்டுகிறது; தமிழ் உரையாடலில் இயல்பாக இருக்கிறது.
- source_word: τρεῖς ἄρτους
  choice: மூன்று அப்பங்கள்
  rationale: ἄρτοι என்பதன் எண்ணக்கூடிய அப்பத் துண்டுகள் அல்லது முழு அப்பங்கள் என்ற பொருளை, வேதாகமச் சூழலில் பரவலாகப் புரியப்படும் ‘அப்பங்கள்’ மூலம் வழங்குகிறது.
