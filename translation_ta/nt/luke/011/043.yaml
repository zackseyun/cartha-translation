  to: பரிசேயர்களே, உங்களுக்கு ஐயோ! ஏனெனில், ஜெப ஆலயங்களில் முதன்மை இருக்கைகளையும்[a] சந்தைத் திடல்களில் வாழ்த்துகளையும்[b] விரும்புகிறீர்கள்.
