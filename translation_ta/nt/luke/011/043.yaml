id: LUK.11.43
reference: Luke 11:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: ta
  text: பரிசேயர்களே, உங்களுக்கு ஐயோ! ஏனெனில், ஜெப ஆலயங்களில் முதன்மை இருக்கைகளையும்[a] சந்தைத் திடல்களில் வாழ்த்துகளையும்[b] விரும்புகிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிக உயர்ந்த இருக்கைகள்” அல்லது “மரியாதைக்குரிய இடங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பொதுவிடங்களில் சமூக மரியாதையையும் அங்கீகாரத்தையும் வெளிப்படுத்தும் வாழ்த்துகள்.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν τοῖς Φαρισαίοις
  choice: பரிசேயர்களே, உங்களுக்கு ஐயோ!
  rationale: οὐαί என்பதன் தீர்க்கதரிசனக் கண்டன வலிமையையும், பரிசேயர்களை நோக்கிய நேரடி அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: ஐயோ என்ற கண்டனத்திற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἀγαπᾶτε
  choice: விரும்புகிறீர்கள்
  rationale: இங்கு அன்பு செலுத்துதல் என்பதைக் காட்டிலும், சமூக மரியாதையையும் முக்கியத்துவத்தையும் நாடும் வலுவான விருப்பத்தைக் குறிக்கிறது.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: முதன்மையான இருக்கைகளை
  rationale: தொழுகைக்கூடத்தில் உயர்ந்த மரியாதை பெற்ற இடங்களைக் குறிக்கும் சொல்லின் உறுதியான இடவியல் மற்றும் சமூகப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: தொழுகைக்கூடங்களில்
  rationale: யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தை சாதாரண நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: τοὺς ἀσπασμοὺς
  choice: மரியாதையுடன் வரவேற்கப்படுவதையும்
  rationale: இச்சூழலில் வெறும் வாழ்த்துகளைவிட, பொதுவிடத்தில் கிடைக்கும் கௌரவமான அங்கீகாரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செயப்படுபொருள் சார்ந்த தமிழ் வடிவம் அவர்கள் அதை நாடியதைத் தெளிவாக்குகிறது.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: சந்தைவெளிகளில்
  rationale: ἀγορά என்பதன் வணிகமும் பொதுச் சமூக வாழ்வும் நடைபெற்ற திறந்த வெளியைக் குறிக்கும் பொருளைத் தருகிறது.
theological_decisions:
- issue: இயேசுவின் கண்டனத்தின் தன்மை
  choice: பொது மரியாதையை விரும்பிய பரிசேயர்களுக்கு எதிரான தீர்க்கதரிசனப் பாணியிலான ‘ஐயோ’ அறிவிப்பு
  alternative: முறையற்ற சமூக நடத்தையைப் பற்றிய வெறும் விமர்சனம்
  rationale: οὐαί என்பதும் அதைத் தொடர்ந்து தரப்படும் காரணமும், இதை வெறும் சமூக மரபு குறித்த குறையாக அல்லாமல் ஒழுக்க மற்றும் ஆன்மீகக் கண்டனமாகக் காட்டுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘உங்களுக்கு ஐயோ’ என்பது மூலத்தின் தீர்க்கதரிசனக் கண்டனத் தொனியைப் பாதுகாக்கிறது. அடிக்குறி குறிப்பான்கள் அவை விளக்கும் சொற்றொடர்களுக்குப் பிறகு வைக்கப்பட்டுள்ளன.
