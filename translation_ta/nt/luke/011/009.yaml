  source_fidelity: மூலக் கிரேக்கத்தின் இணைநடை அமைப்பும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. «நானும்» Κἀγώ-இன் இணைப்பையும் மென்மையான வலியுறுத்தலையும் தருகிறது; மூன்று நிகழ்கால ஏவல்களும் அவற்றைத் தொடர்ந்து வரும் எதிர்கால வாக்குறுதிகளும் சரியாக அமைந்துள்ளன. «உங்களுக்குக் கொடுக்கப்படும்», «உங்களுக்குத் திறக்கப்படும்» ஆகியவை மூலத்தில் குறிப்பிடப்படாத பொருளைச் சேர்க்காமல் எதிர்காலச் செயப்பாட்டைத் தக்கவைக்கின்றன.
  naturalness: உரை நவீனத் தரத் தமிழில் இயல்பாகவும் வாசிப்பதற்கு தெளிவாகவும் உள்ளது. «கேளுங்கள், தேடுங்கள், தட்டுங்கள்» மற்றும் «கண்டடைவீர்கள்» ஆகியவை சுருக்கமான, கண்ணியமான இணைநடையை உருவாக்குகின்றன.
