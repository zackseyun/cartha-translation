reference: Luke 11:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ta
  text: 'நானும் உங்களுக்குச் சொல்கிறேன்: கேளுங்கள்[a], உங்களுக்குக் கொடுக்கப்படும்; தேடுங்கள், கண்டடைவீர்கள்; தட்டுங்கள், உங்களுக்குத் திறக்கப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்க நிகழ்கால ஏவல் வடிவங்களை இன்னும் வெளிப்படையாகக் காட்டினால்: “தொடர்ந்து கேட்டுக்கொண்டிருங்கள் … தொடர்ந்து தேடிக்கொண்டிருங்கள் … தொடர்ந்து தட்டிக்கொண்டிருங்கள்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: நானும்
  rationale: καὶ ἐγώ என்பதன் சுருக்கவடிவம்; முந்தைய போதனையுடன் உள்ள தொடர்ச்சியையும் ‘நான்’ என்பதற்கான மிதமான வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: λέγω
  choice: சொல்கிறேன்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் நிகழ்கால வினை; நவீனத் தமிழில் நேரடியும் இயல்புமான வடிவம்.
- source_word: αἰτεῖτε
  choice: கேளுங்கள்
  rationale: கோருதல் என்ற பொருளைத் தெளிவாகத் தருகிறது. கிரேக்க நிகழ்கால ஏவலின் தொடர்ச்சியான நுணுக்கம் முதன்மை உரையில் கட்டாயமாக விரிவாக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δοθήσεται
  choice: உங்களுக்குக் கொடுக்கப்படும்
  rationale: எதிர்கால செயப்பாட்டு வடிவத்தையும் ὑμῖν என்ற பயனாளரைக் குறிக்கும் வேற்றுமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ζητεῖτε
  choice: தேடுங்கள்
  rationale: நேரடியான தேடலுக்கும் உருவகமான நாடுதலுக்கும் பொருந்தும் பரந்த அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: εὑρήσετε
  choice: கண்டடைவீர்கள்
  rationale: எதிர்கால வாக்குறுதியை இயல்பான தமிழில் வெளிப்படுத்தி, தேடுதலுக்குப் பதிலாகக் கிடைக்கும் கண்டுபிடிப்பைத் தெளிவாக்குகிறது.
- source_word: κρούετε
  choice: தட்டுங்கள்
  rationale: கதவைத் தட்டுதல் என்ற சூழல்சார் பொருளை, கிரேக்கத்தில் மறைமுகமாக உள்ள ‘கதவு’ என்பதை உரையில் சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: ἀνοιγήσεται
  choice: உங்களுக்குத் திறக்கப்படும்
  rationale: எதிர்கால செயப்பாட்டைத் தக்கவைத்து, திறக்கப்படுவது எது என்பதை கிரேக்கத்தைப் போலவே வெளிப்படையாகச் சொல்லாமல் விடுகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வாக்குறுதி கேட்போரையே நோக்கி இருப்பதைத் தெளிவுபடுத்துகிறது; தமிழின் இயல்புக்கேற்ப தேவையான இடங்களில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: αἰτεῖτε, ζητεῖτε, κρούετε ஆகிய நிகழ்கால ஏவல் வடிவங்களின் வினைநிலை நுணுக்கம்
  choice: முதன்மை உரையில் ‘கேளுங்கள், தேடுங்கள், தட்டுங்கள்’ என்ற எளிய ஏவல் வடிவங்கள்
  alternative: ‘தொடர்ந்து கேட்டுக்கொண்டிருங்கள், தேடிக்கொண்டிருங்கள், தட்டிக்கொண்டிருங்கள்’
  rationale: கிரேக்க நிகழ்கால ஏவல்கள் தொடர்ச்சியையோ மீளச்செயலையோ சுட்டக்கூடும்; ஆனால் அந்த நுணுக்கத்தை கட்டாயமான ஒரே பொருளாக முதன்மை உரையில் விரிவாக்குவது மிகை விளக்கமாகலாம். எனவே உண்மையான அம்சத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைப் பன்மை ஏவல் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூன்று கட்டளைகளும் அவற்றைத் தொடரும் மூன்று வாக்குறுதிகளும் இணைநடை அமைப்பில் வைக்கப்பட்டுள்ளன; மொழிநடை எளிமையாகவும் கண்ணியமாகவும் உள்ளது.
