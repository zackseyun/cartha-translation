source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ta
  text: ஆனால் நான் பெயல்செபூலால் பேய்களை விரட்டுகிறேன் என்றால், உங்கள் மகன்கள் யாரால்[a] அவற்றை விரட்டுகிறார்கள்? அதனால் அவர்களே உங்கள் நீதிபதிகளாக இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதனால்” அல்லது “எந்த வல்லமையால்.”
    reason: ἐν τίνι என்பது முகவரைக் குறிக்கும் ‘யாரால்’ என்றும், வழிமுறை அல்லது வல்லமையைக் குறிக்கும் ‘எதனால்/எந்த வல்லமையால்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால் ... என்றால்
  rationale: δέ இங்கு இயேசுவின் மறுப்புவாதத்திலுள்ள மென்மையான எதிர்மறைத் தொடர்பைக் காட்டுகிறது; εἰ நிபந்தனையைத் தமிழின் இயல்பான ‘என்றால்’ அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: வினைச்சொல்லிலேயே நபர் தெரிந்தாலும், மூலத்தில் வெளிப்படையாக உள்ள ἐγώ, இயேசுவுக்கும் எதிராளிகளின் ‘மகன்களுக்கும்’ இடையிலான வாத ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: ἐν Βεελζεβοὺλ
  choice: பெயல்செபூலால்
  rationale: ἐν இச்சூழலில் செயலை நிகழ்த்தும் முகவர் அல்லது வழிமுறையைக் குறிக்கிறது. ‘பெயல்செபூலின் வல்லமையால்’ என்பது மூலத்தைவிட விளக்கமாகிவிடும் என்பதால், பெயர் ஒலிபெயர்க்கப்பட்டு ‘-ஆல்’ உருபு பயன்படுத்தப்பட்டது.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: பேய்களை விரட்டுகிறேன்
  rationale: பேயோட்டும் சூழலில் ἐκβάλλω என்பது ‘விரட்டு/வெளியேற்று’ எனப் பொருள்படும். ‘பேய்களை விரட்டுகிறேன்’ என்பது சாதாரண வாசகருக்குப் புரியும் இயல்பான, நேரடியான தமிழ்.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: உங்கள் மகன்கள்
  rationale: υἱοί என்பதன் வெளிப்படையான பொருள் ‘மகன்கள்.’ ‘சீடர்கள்,’ ‘பின்பற்றுபவர்கள்,’ அல்லது ‘உங்கள் இனத்தார்’ என்று விளக்கித் தீர்மானிக்காமல், மூலத்தின் பொருள் இடைவெளி தக்கவைக்கப்படுகிறது.
- source_word: ἐν τίνι
  choice: யாரால்
  rationale: பெயல்செபூல் என்னும் தனிநபர் முகவருடன் செய்யப்படும் ஒப்பீட்டில், ‘யாரால்’ என்பது கேள்வியின் முகவர் சார்ந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வழிமுறை அல்லது வல்லமை குறித்த மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκβάλλουσιν
  choice: அவற்றை விரட்டுகிறார்கள்
  rationale: முந்தைய ἐκβάλλω என்பதுடன் சொல் ஒற்றுமை காக்கப்படுகிறது; ‘அவற்றை’ என்பது முன்பு சொல்லப்பட்ட பேய்களைக் குறிக்க இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: διὰ τοῦτο
  choice: அதனால்
  rationale: முந்தைய வினாவிலிருந்து வரும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: அவர்களே உங்கள் நீதிபதிகளாக இருப்பார்கள்
  rationale: αὐτοί தரும் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; κριταί என்பது ‘நீதிபதிகள்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘உங்கள் மகன்கள்’ என்பவர்களின் அடையாளம்
  choice: மூலத்தின் நேரடியான ‘உங்கள் மகன்கள்’ என்ற சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘உங்கள் சீடர்கள்,’ ‘உங்களைப் பின்பற்றுபவர்கள்,’ அல்லது ‘உங்கள் இனத்தார்’
  rationale: இவர்கள் இயேசுவின் எதிராளிகளுடன் தொடர்புடைய பேயோட்டிகளாக இருக்கலாம்; ஆனால் கிரேக்கம் அவர்களின் உறவை விளக்கித் தீர்மானிக்காமல் ‘உங்கள் மகன்கள்’ என்றே கூறுகிறது. அந்த விளக்கத் திறப்பும் வாதத்தின் இறுக்கமும் தக்கவைக்கப்படுகின்றன.
- issue: αὐτοί என்பதன் வலியுறுத்தல்
  choice: ‘அவர்களே’ என்று வெளிப்படையாகக் காட்டுதல்
  alternative: வலியுறுத்தலின்றி ‘அவர்கள்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தின் வெளிப்படையான வலியுறுத்தும் சுட்டுப்பெயரைத் தமிழ் இயல்பாக ‘-ஏ’ மூலம் எடுத்துரைக்க முடிவதால், அதை முதன்மை உரையிலேயே காப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘பெயல்செபூல்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டுள்ளது; ‘மகன்கள்’ என்ற மூல உருவகம் விளக்கித் தீர்க்கப்படவில்லை. αὐτοί என்பதன் வலியுறுத்தல் ‘அவர்களே’ என இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
