source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: ta
  text: 'மக்கள் கூட்டம் மேலும் மேலும் திரண்டு வந்தபோது, அவர் சொல்லத் தொடங்கினார்: “இந்தத் தலைமுறை தீய தலைமுறை.[a] இது ஓர் அடையாளத்தைத் தேடுகிறது; ஆனால் யோனாவின் அடையாளத்தைத் தவிர வேறு எந்த அடையாளமும் இதற்குக் கொடுக்கப்படாது.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீய தலைமுறை” என்பதை “பொல்லாத தலைமுறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யோனாவின் அடையாளம்” என்பது, யோனா தனது தீர்க்கதரிசனப் பணியால் ஓர் அடையாளமாக இருந்ததைக் குறிக்கலாம்; மற்ற நற்செய்திகளில் உள்ள இணையான பகுதிகளின் வெளிச்சத்தில், இயேசுவின் மரணம் மற்றும் உயிர்த்தெழுதலுடனான முன்நிழல் தொடர்பையும் நினைவூட்டலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: மேலும் மேலும் திரண்டு வந்தபோது
  rationale: மக்கள் தொடர்ந்து கூடிவந்த நிகழ்வையும், அது முதன்மை வினையுடன் ஒரே நேரத்தில் நடந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἤρξατο λέγειν
  choice: சொல்லத் தொடங்கினார்
  rationale: கிரேக்கத் தொடக்கநிலை வினைக்கட்டமைப்பின் பொருளை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: γενεά
  choice: தலைமுறை
  rationale: காலத்தாலும் ஒழுக்கநிலையாலும் ஒன்றாகக் குறிப்பிடப்படும் மக்கள் தொகுதியைத் திறந்த நிலையில் வைத்திருக்கும் வழக்கமான தமிழ் இணை.
- source_word: πονηρά
  choice: தீய
  rationale: ஒழுக்கரீதியான கண்டனத்தை மென்மைப்படுத்தாமல், நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது; ‘பொல்லாத’ என்பதும் சாத்தியம்.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: உறுதிப்படுத்தும் அற்புதச் செயல் என்ற சூழல்சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘அற்புத’ என்ற சொல்லை வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: ζητεῖ
  choice: தேடுகிறது
  rationale: வினையின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; கோரிக்கை அல்லது சவால் விடுக்கும் எதிர்மறை மனப்பாங்கைச் சூழலே உணர்த்த அனுமதிக்கிறது.
- source_word: δοθήσεται
  choice: கொடுக்கப்படாது
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் முந்தைய மறுப்பையும் தெளிவான தமிழில் பிரதிபலிக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர வேறு எந்த
  rationale: மறுப்புக்குப் பின் வரும் விதிவிலக்கைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: யோனாவின் அடையாளம்
  rationale: இறைமொழித் தொடர்பின் துல்லிய வகையைத் தீர்மானிக்காமல், கிரேக்க மரபுத்தொடரின் திட்டமிட்ட திறந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இந்தத் தலைமுறை’ என்பதன் மீதான இயேசுவின் கண்டனத்தின் பரப்பு
  choice: இயேசுவின் காலத்தவரைக் கூட்டாக மதிப்பிடும் விரிவான ஒழுக்கக் கண்டனமாக மொழிபெயர்க்கப்பட்டது.
  alternative: அங்கு இருந்த குறிப்பிட்ட எதிரிகளை மட்டுமே குறிக்கும் குறுகிய வாசிப்பு.
  rationale: ‘இந்தத் தலைமுறை தீய தலைமுறை’ என்ற மீளுரைத்தல் வலுவான கூட்டுக் கண்டனத்தைத் தருகிறது; கிரேக்கம் குறிப்பிடாத அளவுக்கு அதன் பரப்பைக் குறுக்கவில்லை.
- issue: ‘யோனாவின் அடையாளம்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் விளக்கப்படாத உடைமைத் தொடர்புள்ள சொற்றொடராகவே வைக்கப்பட்டது.
  alternative: யோனாவின் தீர்க்கதரிசனப் பணி அல்லது பிரசங்கத்தையே மட்டும் குறித்தல்; அல்லது இயேசுவின் மரணத்தையும் உயிர்த்தெழுதலையும் மட்டும் குறிக்கும் முன்நிழலாகத் தீர்மானித்தல்.
  rationale: லூக்காவின் உடனடிச் சூழல் யோனாவே ஒரு அடையாளமான விதத்தை விளக்குகிறது; மற்ற நற்செய்தி இணைப்புகள் மரணம்–உயிர்த்தெழுதல் சார்ந்த முன்நிழல் தொடர்பையும் நினைவூட்டலாம். முதன்மை உரை இந்தப் பொருள் நெருக்கடியைத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இது’ என்ற ஒருமைச் சுட்டுப்பெயர் ‘தலைமுறை’ என்ற ஒருமைப் பெயருடன் இலக்கண ஒத்திசைவைப் பேணுகிறது. வாக்கியத்தின் தீர்க்கதரிசனக் கண்டனத் தொனியும் ‘யோனாவின் அடையாளம்’ என்ற சொற்றொடரின் பொருள் திறந்த தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
