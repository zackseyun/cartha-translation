id: LUK.11.34
reference: Luke 11:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: ta
  text: உன் உடலின் விளக்கு உன் கண். உன் கண் நலமாக[a] இருந்தால், உன் உடல் முழுவதும் ஒளி நிறைந்திருக்கும். ஆனால் அது கெட்டதாக[b] இருந்தால், உன் உடலும் இருண்டிருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெளிவாக,” “குறைபாடின்றி”; பாரம்பரியமாக, “ஒருமையானதாக.” கிரேக்கச் சொல் பிளவுபடாத அல்லது குறைபாடற்ற நிலையைக் குறிக்கலாம்; இங்கு அது ‘கெட்ட’ கண்ணுக்கு எதிராக நிறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீயதாக.” கிரேக்கச் சொல் ‘கெட்ட’ அல்லது ‘தீய’ என்று பொருள்படலாம்; இங்கு அது கண்ணின் குறைபாட்டையும் ஒழுக்கரீதியாகத் திரிபடைந்த பார்வையையும் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: விளக்கு
  rationale: அருவமான ‘ஒளி’ என்பதற்குப் பதிலாக, ஒளி தரும் பொருளைக் குறிக்கும் மூலமொழியின் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: இங்கு உடல் சார்ந்த உருவகத்தின் வழியாக உள்ளார்ந்த பார்வையும் நிலையும் சித்தரிக்கப்படுகின்றன; ‘உடல்’ என்பது இயல்பான நேரடி இணைச்சொல்.
- source_word: ὀφθαλμός
  choice: கண்
  rationale: உடல் உறுப்பைக் குறிக்கும் நேரடிப் பொருளைத் தக்கவைக்கிறது; அதன்மூலம் உள்ளார்ந்த பார்வையைச் சுட்டும் உருவகம் அமைகிறது.
- source_word: ὅταν ... ᾖ / ἐπὰν δὲ ... ᾖ
  choice: இருந்தால் / ஆனால் ... இருந்தால்
  rationale: இரு தொடர்களும் பொதுவான நிபந்தனைப் பொருளில் இணையாக அமைந்துள்ளதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἁπλοῦς
  choice: நலமாக
  rationale: கண்ணைப் பற்றிய உருவகத்திலும் πονηρός என்பதற்கான எதிர்மறை இணைப்பிலும், நன்றாகச் செயல்படும் அல்லது குறைபாடற்ற நிலையை இயல்பாக உணர்த்துகிறது. சொல்லின் ‘ஒருமையான/பிளவுபடாத’ நுண்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὅλον τὸ σῶμά σου φωτεινόν
  choice: உன் உடல் முழுவதும் ஒளி நிறைந்திருக்கும்
  rationale: φωτεινός என்பதன் ‘ஒளிமிக்க, ஒளி நிறைந்த’ பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, இருளுடனான எதிரிணையைப் பாதுகாக்கிறது.
- source_word: πονηρός
  choice: கெட்டதாக
  rationale: உடல் குறைபாட்டையும் ஒழுக்கரீதியான தீமையையும் சுட்டக்கூடிய மூலச்சொல்லின் இருபொருள் வாய்ப்பை மிகையாகத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: σκοτεινόν
  choice: இருண்டிருக்கும்
  rationale: φωτεινός என்பதற்கு எதிரான ‘இருண்ட’ நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘உன் கண் ἁπλοῦς’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நலமாக’
  alternative: ‘தெளிவாக,’ ‘குறைபாடின்றி,’ அல்லது ‘ஒருமையானதாக’
  rationale: உடனடிச் சூழலில் கண் உடலின் விளக்காகச் செயல்படுவதும், உடல் ஒளிமிக்கதாகவோ இருண்டதாகவோ இருப்பதும் பேசப்படுவதால், செயல்திறன் சார்ந்த ‘நலமாக’ என்பது இன்றைய வாசகருக்கு உருவகத்தைத் தெளிவாக்குகிறது. அதேவேளையில், மூலச்சொல்லின் ஒருமை அல்லது பிளவின்மை சார்ந்த நுண்பொருளை அடிக்குறிப்பு திறந்தவாறு வைக்கிறது.
- issue: πονηρός என்பது உடல் குறைபாட்டையா ஒழுக்கத் தீமையையா குறிக்கிறது
  choice: ‘கெட்டதாக’ என்று இருபொருள் வாய்ப்புடன் மொழிபெயர்த்தல்
  alternative: ‘தீயதாக’ அல்லது ‘நோயுற்றதாக’
  rationale: ‘தீயதாக’ என்பது ஒழுக்கப் பொருளையும் ‘நோயுற்றதாக’ என்பது உடல் சார்ந்த பொருளையும் மட்டும் முன்னிறுத்தக்கூடும். ‘கெட்டதாக’ என்பது கண்ணின் குறைபட்ட செயல்பாட்டையும் ஒழுக்கரீதியாகத் திரிபடைந்த பார்வையையும் ஒருங்கே சுட்டும் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஒளி நிறைந்திருக்கும் / இருண்டிருக்கும்’ என்ற எதிரிணை மூலவாக்கியத்தின் உருவக அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
