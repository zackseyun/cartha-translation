source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: ta
  text: அவரோ, “ஆம், அதைவிட[a], கடவுளுடைய வார்த்தையைக் கேட்டு அதைக் கடைப்பிடிக்கிறவர்களே பேறுபெற்றவர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையாகவே”; அல்லது, “ஆம், மாறாக.” கிரேக்க இடைச்சொல் முந்தைய கூற்றை ஏற்றுக்கொண்டபடியே, வலியுறுத்தலை வேறொரு பக்கம் திருப்பக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: ஆம், அதைவிட
  rationale: இந்த இடைச்சொல் முந்தைய கூற்றை முற்றிலும் மறுக்காமல், அதை ஏற்றுக்கொண்டபடியே ஆசீர்வாதத்தின் ஆழமான அடிப்படையை நோக்கிக் கவனத்தைத் திருப்புகிறது. ‘ஆம், அதைவிட’ என்பது உறுதிப்படுத்துதலையும் திருப்பத்தையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனமகிழ்ச்சியையோ சூழ்நிலை சார்ந்த அதிர்ஷ்டத்தையோ அல்லாமல், கடவுளின் பார்வையில் கிடைக்கும் நல்வாழ்வையும் ஆசீர்வாத நிலையையும் குறிக்கிறது.
- source_word: οἱ ἀκούοντες
  choice: கேட்டு … கிறவர்கள்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல், கடவுளுடைய வார்த்தையைக் கேட்பதைத் தங்கள் தொடர்ந்த பண்பாகக் கொண்ட மக்களைக் குறிக்கிறது; தமிழில் இயல்பாக வினையெச்சத் தொடரில் வழங்கப்பட்டுள்ளது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: λόγος இங்கு கடவுளிடமிருந்து வரும் செய்தி அல்லது வெளிப்பாட்டைக் குறிக்கிறது. ‘வார்த்தை’ அதன் விரிந்த வேதாகமப் பொருளையும் மரபுசார் ஒலியையும் காக்கிறது.
- source_word: φυλάσσοντες
  choice: அதைக் கடைப்பிடிக்கிறவர்கள்
  rationale: φυλάσσω இங்கு வார்த்தையைப் பாதுகாத்து, அதன்படி நடப்பதைக் குறிக்கிறது. ‘கடைப்பிடிக்கிறவர்கள்’ கீழ்ப்படிதலோடு செயல்படுத்தும் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτὸς δὲ εἶπεν
  choice: அவரோ … என்றார்
  rationale: δὲ காட்டும் மென்மையான வேறுபாட்டை ‘அவரோ’ வெளிப்படுத்துகிறது; εἶπεν என்பதற்கு நேரான ‘என்றார்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பெண்ணின் வாழ்த்துக்கு இயேசு அளிக்கும் பதிலின் வலிமை
  choice: உடல் உறவையே மறுக்காமல், கடவுளுடைய வார்த்தையைக் கேட்டு கடைப்பிடிப்பதே உண்மையான பேற்றின் ஆழமான அடிப்படை என்று கவனத்தைத் திருப்புதல்
  alternative: பெண்ணின் கூற்றை முற்றிலும் மறுத்தல்; அல்லது எந்தத் திருத்தமும் இன்றி இன்னொரு பேற்றை மட்டும் சேர்த்தல்
  rationale: Μενοῦν உறுதிப்படுத்துதலையும் திருத்தி உயர்த்துதலையும் ஒருங்கே சுமக்கக்கூடும். ‘ஆம், அதைவிட’ என்பது இயேசு முந்தைய கூற்றை கடுமையாக நிராகரித்தார் என்று தீர்மானிக்காமலும், பதிலிலுள்ள திருப்பத்தை மறைக்காமலும் அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்’ என்பது ‘மகிழ்ச்சியானவர்கள்’ என்பதைவிட μακάριοι என்பதன் இறையியல் நிறையைச் சிறப்பாகக் காக்கிறது; ‘கடைப்பிடிக்கிறவர்கள்’ என்பது கேட்பதையும் நடைமுறை கீழ்ப்படிதலையும் இணைக்கிறது.
