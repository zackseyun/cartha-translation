translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழின் இயல்பான இறந்தகாலக் கதைநடையாக மாற்றப்பட்டுள்ளது. முந்தைய சூழலில் இயேசுவே சுட்டப்படுவதால், கடைசி வாக்கியத்தில் குழப்பத்தைத் தவிர்க்க ‘இயேசு’ என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது. உணவு எந்த நேரத்தில் நடந்தது என்பது மூலத்தில் உறுதியாக இல்லாததால் ‘உணவருந்த’ என்ற பொதுச் சொல் தேர்ந்தெடுக்கப்பட்டது.
