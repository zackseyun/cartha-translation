source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: ta
  text: அவர் பேசிக்கொண்டிருந்தபோது, ஒரு பரிசேயர் தம்முடன் உணவருந்தும்படி அவரைக் கேட்டார். இயேசு உள்ளே சென்று, உணவுக்காகச் சாய்ந்து அமர்ந்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அக்கால முறைப்படி விருந்துண்ண மேசையருகே சாய்ந்த நிலையில் அமர்ந்தார்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: அவர் பேசிக்கொண்டிருந்தபோது
  rationale: ἐν + articular infinitive ஒரே நேரத்தில் தொடரும் செயலைக் குறிக்கிறது; இத்தமிழாக்கம் அதன் காலப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐρωτᾷ
  choice: கேட்டார்
  rationale: இது நிகழ்கால வடிவிலுள்ள வரலாற்று நிகழ்காலம். நவீனத் தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது; அழைப்பின் பொருள் அடுத்துள்ள நோக்கவாக்கியத்தால் வெளிப்படுகிறது.
- source_word: Φαρισαῖος
  choice: ஒரு பரிசேயர்
  rationale: குழுவின் வழக்கமான தமிழ்ப் பெயரையும், கிரேக்கத்தில் குறிப்பிட்ட ஒருவரை முன்னதாக அடையாளப்படுத்தாத ஒருமையையும் பேணுகிறது.
- source_word: ὅπως ἀριστήσῃ
  choice: உணவருந்தும்படி
  rationale: ἀριστάω காலை அல்லது முற்பகல் உணவைக் குறிக்கக்கூடும்; ஆனால் நேரத்தை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் பொதுவான உணவழைப்பை இச்சொல் தெரிவிக்கிறது.
- source_word: παρ’ αὐτῷ
  choice: தம்முடன்
  rationale: ‘அவருடன்/அவரிடத்தில்’ என்ற கிரேக்கப் பொருளை நெருக்கமாகப் பேணுகிறது; வீடு என்று மூலத்தில் இல்லாத இடவிவரத்தைச் சேர்க்கவில்லை. ‘தம்முடன்’ என்பது பரிசேயரையே தெளிவாகச் சுட்டுகிறது.
- source_word: εἰσελθὼν
  choice: உள்ளே சென்று
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த துணைச்செயலை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: ἀνέπεσεν
  choice: உணவுக்காகச் சாய்ந்து அமர்ந்தார்
  rationale: முதல் நூற்றாண்டின் விருந்துகளில் உண்பவர்கள் சாய்ந்த நிலையில் அமர்ந்த வழக்கை வெளிப்படுத்துகிறது; சாதாரணமாக உட்கார்ந்தார் என்று மட்டும் மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
