translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. வீட்டுக்குள் இருந்து வரும் நேரடியான பதிலின் நெருக்கத்தைத் தக்கவைக்க ஒருமை ‘நீ’ வடிவம் பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தில் மறைந்துள்ள கொடுக்கப்படும் பொருள் தமிழிலும் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
