  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: ta
  text: அவன் உள்ளிருந்து பதிலளித்து, “எனக்குத் தொந்தரவு செய்யாதே.[a] கதவு ஏற்கெனவே மூடப்பட்டுவிட்டது;[b] என் பிள்ளைகள் என்னோடு படுக்கையில் இருக்கிறார்கள்.[c] நான் எழுந்து உனக்குக் கொடுக்க முடியாது” என்று கூறுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குச் சிரமம் உண்டாக்காதே” அல்லது “என்னைத் தொடர்ந்து தொந்தரவு செய்யாதே.” கிரேக்க மரபுத்தொடரின் சொல்லுக்கு சொல் பொருள், “எனக்குத் தொல்லைகளைக் கொடுக்காதே” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கதவு ஏற்கெனவே மூடியிருக்கிறது.” கிரேக்க நிறைவுநிலை வினை, கதவு மூடப்பட்ட செயலை அல்லது அதனால் ஏற்பட்டுள்ள தற்போதைய நிலையைக் கவனப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: “படுக்கையில்” என்பது அக்கால வீட்டுச் சூழலில் குடும்பத்தினர் பகிர்ந்து கொண்ட உறங்குமிடத்தைக் குறிக்கிறது; திருமண நெருக்கத்தைக் குறிப்பதல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν
  choice: அப்போது உள்ளே இருப்பவர்
  rationale: κἀκεῖνος கதையில் அடுத்த நபரின் பதிலைத் தொடர்கிறது; ἔσωθεν வெளியில் இருப்பவருக்கு மாறாக அவர் உள்ளே இருப்பதைக் குறிக்கிறது. இயல்பான தமிழுக்காக இரண்டும் ஒருங்கிணைக்கப்பட்டுள்ளன.
- source_word: ἀποκριθεὶς εἴπῃ
  choice: மறுமொழியாக … என்று சொல்லலாம்
  rationale: ἀποκριθείς εἴπῃ என்ற இரட்டைச் சொல்லாக்கத்தை இயல்பான தமிழில் ‘மறுமொழியாக … சொல்லலாம்’ என வழங்குகிறது. εἴπῃ என்பது இந்தக் கற்பனைச் சூழலில் நிகழக்கூடிய பதிலைச் சுட்டுவதால் ‘சொல்லலாம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Μή μοι κόπους πάρεχε
  choice: எனக்குத் தொந்தரவு கொடுக்காதே
  rationale: சொல்லுக்கு சொல் ‘தொல்லைகளை அளிக்காதே’ என்ற கிரேக்க மரபுத்தொடர், ஒருவருக்குச் சிரமம் அல்லது தொந்தரவு உண்டாக்காதே என்பதைக் குறிக்கிறது.
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: கதவு ஏற்கெனவே மூடப்பட்டுவிட்டது
  rationale: ἤδη என்பது ‘ஏற்கெனவே’; perfect வடிவமான κέκλεισται முடிக்கப்பட்ட செயலும் அதன் தற்போதைய விளைவும் ஆகிய இரண்டையும் உணர்த்துகிறது. ‘பூட்டப்பட்டுவிட்டது’ என்பது மூலத்தில் இல்லாத பூட்டைக் குறிப்பதால் தவிர்க்கப்பட்டுள்ளது.
- source_word: τὰ παιδία μου
  choice: என் பிள்ளைகள்
  rationale: παιδία இங்கு குடும்பத்திலுள்ள பிள்ளைகளைக் குறிக்கிறது; வயதை தேவையின்றி மிகத் துல்லியமாக்காமல் பொதுவான, கண்ணியமான தமிழ்ச் சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: என்னோடு படுக்கையில் இருக்கிறார்கள்
  rationale: குடும்பத்தினர் பகிர்ந்து கொண்ட உறங்குமிடத்தைச் சுட்டும் இயல்பான தமிழ்; சொற்றொடரின் இடவியல் பொருளைத் தக்கவைக்கிறது.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: நான் எழுந்து உனக்குக் கொடுக்க முடியாது
  rationale: ἀναστάς கொடுப்பதற்கு முன் தேவையான எழும் செயலைக் குறிக்கிறது. δοῦναί என்பதற்கான பொருள் சூழலில் புரிந்துகொள்ளப்படுவதால், கிரேக்கத்தில் இல்லாத ‘எதையும்’ என்பது முதன்மை உரையில் சேர்க்கப்படவில்லை.
