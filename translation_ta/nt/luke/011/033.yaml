  source_fidelity: மூலத்தின் எதிர்மறை–மாறுபாட்டு அமைப்பும் நோக்கக் கூறும் பெரும்பாலும் சரியாகத் தரப்பட்டுள்ளன. ஆனால் எதிர்மறைப் பொதுக்கூற்றுக்குப் பின்னர் வந்துள்ள “வைப்பார்” இலக்கண ரீதியாகவும் பொருள் ரீதியாகவும் ஒத்திசைவற்றது; அதனை பொதுவான நிகழ்காலப் பன்மை வினையாகச் சீரமைக்க வேண்டும்.
  naturalness: “மறைவான இடம்,” “உள்ளே வருகிறவர்கள்,” “ஒளியைக் காணும்படி” ஆகியவை இயல்பான நவீனத் தமிழ். ஒரே வாக்கியத்தில் “அல்லது” மற்றும் “மாறாக” என அமைத்தால் மூலத்தின் தர்க்கத் தொடர்பு தெளிவாகும். “விளக்குத்தாங்கி” நவீனப் பயன்பாட்டில் “lampstand” என்பதற்கு இயல்பானது.
