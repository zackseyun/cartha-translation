id: LUK.11.33
reference: Luke 11:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: ta
  text: யாரும் விளக்கை ஏற்றி, அதை மறைவான இடத்தில்[a] அல்லது கூடையின் கீழ்[b] வைப்பதில்லை; மாறாக, உள்ளே வருகிறவர்கள் ஒளியைக் காணும்படி அதை விளக்குத்தாங்கியின்மேல் வைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலவறையில்” அல்லது “இரகசியமான இடத்தில்.” κρύπτη என்ற கிரேக்கச் சொல் மறைவான இடத்தையும், நிலத்தடிச் சேமிப்பிடத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் μόδιος; இது தானியத்தை அளப்பதற்குப் பயன்படுத்தப்பட்ட ஓர் அளவுப் பாத்திரம். அல்லது, “அளவுப் பாத்திரம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: யாரும் … வைப்பதில்லை
  rationale: கிரேக்கத்தின் பொதுவான எதிர்மறைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: λύχνον
  choice: விளக்கை
  rationale: இது மெழுகுவர்த்தியைக் குறிப்பாகச் சுட்டாமல், எடுத்துச் செல்லக்கூடிய எண்ணெய் விளக்கைக் குறிக்கிறது.
- source_word: ἅψας
  choice: ஏற்றி
  rationale: முதன்மைச் செயலுக்கு முன் விளக்கு ஏற்றப்படுவதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εἰς κρύπτην
  choice: மறைவான இடத்தில்
  rationale: குறிப்பிட்ட கட்டடப் பகுதியைத் தேவையின்றி நிர்ணயிக்காமல், ஒளியை மறைத்து வைக்கும் கருத்தைத் தக்கவைக்கிறது.
- source_word: τίθησιν
  choice: வைப்பதில்லை / வைப்பார்
  rationale: இடுதல் என்ற எளிய செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இரண்டாம் பாதியில் கிரேக்கத்தில் விடுபட்டுள்ள வினை பொருளுக்கேற்ப நிரப்பப்பட்டுள்ளது.
- source_word: ὑπὸ τὸν μόδιον
  choice: கூடையின் கீழும்
  rationale: விளக்கை மூடும் பாத்திரத்தின் காட்சியை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது; அது ஓர் அளவுப் பாத்திரம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: விளக்குத்தண்டின்மேல்
  rationale: விளக்கை உயரத்தில் வைப்பதற்குரிய தண்டைத் துல்லியமாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: ἵνα
  choice: … காணும்படி
  rationale: கிரேக்கத்தின் நோக்கப் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: οἱ εἰσπορευόμενοι
  choice: உள்ளே வருகிறவர்கள்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான, பொதுவான குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ φέγγος
  choice: ஒளி
  rationale: விளக்கிலிருந்து வரும் வெளிச்சம் அல்லது பிரகாசம் என்ற concrete பொருளைத் தெளிவாகத் தருகிறது.
- source_word: βλέπωσιν
  choice: காணும்படி
  rationale: ἵνα உடன் வரும் நோக்கத்தைத் தமிழில் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: κρύπτη என்பதன் பொருள்
  choice: பொதுவான ‘மறைவான இடம்’
  alternative: நிலவறை; சேமிப்பு அறை; இரகசிய இடம்
  rationale: உவமையின் மையம் ஒளியை மறைப்பதில்தான் உள்ளது; குறிப்பிட்ட கட்டட அமைப்பை நிர்ணயிக்காமல் கிரேக்கத்தின் பொருள் விரிவை இது காக்கிறது.
- issue: μόδιος என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘கூடை’
  alternative: அளவுப் பாத்திரம்; தானிய அளவுப் பாத்திரம்; மரக்கால்
  rationale: விளக்கை மூடும் காட்சி நவீன வாசகருக்கு உடனே புரியும்படி ‘கூடை’ பயன்படுத்தப்பட்டுள்ளது; அதன் அளவைப் பாத்திரத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. மூலத்தில் ஒரே நீண்ட எதிர்மறை–மாறுபாட்டு அமைப்பாக உள்ள வாக்கியம் தமிழின் தெளிவுக்காகப் பிரிக்கப்பட்டுள்ளது; கருத்துச் சம்பந்தம் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
