id: LUK.11.2
reference: Luke 11:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: ta
  text: 'அவர் அவர்களிடம், “நீங்கள் ஜெபிக்கும்போது இவ்வாறு சொல்லுங்கள்: ‘தந்தையே[a], உமது பெயர் தூயதாக மதிக்கப்படுவதாக[b]. உமது அரசாட்சி வருவதாக.’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில ஆங்கில மொழிபெயர்ப்பு மரபுகளில், மத்தேயு 6:9-இன் இணைப்பகுதியின் தாக்கத்தால் “எங்கள் தந்தையே” என்று உள்ளது; ஆனால் இங்குள்ள கிரேக்க வாசகம் “தந்தையே” என்று மட்டுமே உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உமது பெயர் பரிசுத்தப்படுவதாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: நீங்கள் ஜெபிக்கும்போது
  rationale: Ὅταν உடன் வரும் நிகழ்கால துணைவினை பொதுவாக அல்லது வழக்கமாக நிகழும் சூழலைக் குறிக்கிறது; இச்சொற்றொடர் அதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: λέγετε
  choice: இவ்வாறு சொல்லுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தும் வலிமையை இயல்பாகக் காட்டுகிறது; தொடர்ந்து திரும்பத் திரும்பச் சொல்ல வேண்டும் என்ற தேவையற்ற பொருளைச் சேர்க்கவில்லை.
- source_word: Πάτερ
  choice: தந்தையே
  rationale: கிரேக்க மூலத்தில் உள்ள தனி அழைப்புமுறையைப் பிரதிபலிக்கிறது; மத்தேயு 6:9-ஐப் பின்பற்றி ‘எங்கள் தந்தையே’ என்று இணக்கப்படுத்தவில்லை.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: உமது பெயர் தூயதெனப் போற்றப்படுவதாக
  rationale: இறைவனுடைய பெயர் தூயதாக மதிக்கப்பட்டு போற்றப்பட வேண்டும் என்ற இறைவேண்டலையும், கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் தெளிவான தமிழில் எடுத்துரைக்கிறது; அந்தப் பெயர் முன்பு தூய்மையற்றிருந்தது என்ற பொருளைத் தவிர்க்கிறது.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: உமது அரசு வருவதாக
  rationale: இறைவேண்டலாக அமைந்த கிரேக்கக் கட்டளை வடிவத்தைப் பாதுகாக்கிறது. βασιλεία என்பது அரசாட்சி அல்லது ஆட்சியையும் குறிக்கக்கூடியதாயினும், ‘அரசு’ இங்கு சுருக்கமாகவும் இயல்பாகவும் அதன் இறையாட்சிசார் பரப்பைத் திறந்தவாறு வைக்கிறது.
theological_decisions:
- issue: கடவுளை Πάτερ என்று அழைத்தல்
  choice: தந்தையே
  alternative: எங்கள் தந்தையே
  rationale: கொடுக்கப்பட்ட SBLGNT மூலவாசகத்தில் Πάτερ மட்டுமே உள்ளது. மத்தேயுவின் இணைப்பகுதியையோ வழிபாட்டு மரபையோ கொண்டு ‘எங்கள்’ என்பதைச் சேர்க்கவில்லை.
- issue: ἁγιασθήτω τὸ ὄνομά σου என்பதன் பொருள்
  choice: உமது பெயர் தூயதெனப் போற்றப்படுவதாக
  alternative: உமது பெயர் பரிசுத்தப்படுவதாக
  rationale: கடவுளின் பெயர் இயல்பிலேயே தூயது என்பதை முன்கூட்டியே விளக்கித் தீர்க்காமல், மக்கள் அதைத் தூயதாக மதிக்க வேண்டும் என்ற வேண்டுதலைத் தெளிவாகத் தெரிவிக்கிறது; அதேவேளை கிரேக்கத்தின் செயலப்பாட்டு நுணுக்கத்தையும் காக்கிறது.
- issue: βασιλεία என்பதன் பரப்பு
  choice: அரசு
  alternative: ஆட்சி
  rationale: இச்சொல் ஆட்சிசெயல், அரசுரிமை, அரசு ஆகிய பொருட்களைத் தாங்கலாம். ‘அரசு’ நற்செய்தி நூல்களின் வருங்கால நிறைவேற்ற நுணுக்கத்தையும் இறைவனின் செயற்படும் ஆட்சியையும் ஒரே சொல்லில் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் ஜெபத்திற்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கிய உரையில் மரியாதை ஒருமை ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; மரபுவழி சொற்கள் தேவையான இடங்களில் மட்டும் வைக்கப்பட்டுள்ளன.
