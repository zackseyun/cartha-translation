source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ta
  text: ஏனெனில், கேட்கிற ஒவ்வொருவரும் பெற்றுக்கொள்கிறார்; தேடுகிறவர் கண்டடைகிறார்; தட்டுகிறவருக்குத் திறக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலில் மறைந்துள்ள பொருளை வெளிப்படையாகக் கூறினால், ‘தட்டுகிறவருக்குக் கதவு திறக்கப்படும்.’ கிரேக்கத்தில் திறக்கப்படுவது எது என்று குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் வினையெச்சத் தொடரோடு பகிர்ந்தளிக்கும் பொருளில் இருப்பதால், அனைவரையும் தனித்தனியாக உள்ளடக்கும் பொதுவான விரிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கமாக இவ்வசனம் வருவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ αἰτῶν
  choice: கேட்கிற
  rationale: நிகழ்கால வினையெச்சத்தின் பொதுவான, தொடர்ச்சியான செயற்பண்பை இயல்பான தமிழில் தருகிறது; இச்சூழலில் வேண்டிக் கேட்பதையும் குறிக்க முடியும்.
- source_word: λαμβάνει
  choice: பெற்றுக்கொள்கிறார்
  rationale: கேட்பதற்கு வரும் பதிலை dignified, current Tamil வழக்கில் நேரடியாகக் குறிக்கிறது.
- source_word: ὁ ζητῶν
  choice: தேடுகிறவர்
  rationale: தேடுதலை ஒருவரின் பொதுவான அல்லது தொடரும் செயலாகக் காட்டும் நிகழ்கால வினையெச்சப் பொருளைப் பேணுகிறது.
- source_word: εὑρίσκει
  choice: கண்டடைகிறார்
  rationale: தேடுதல்–கண்டடைதல் என்ற இணைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τῷ κρούοντι
  choice: தட்டுகிறவருக்கு
  rationale: செயப்பாட்டு வினைக்கு இணையும் கிரேக்க வேற்றுமைப் பொருளைத் தமிழின் நான்காம் வேற்றுமை இயல்பாகப் பேணுகிறது.
- source_word: ἀνοιγήσεται
  choice: திறக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பேணுவதோடு, கிரேக்கத்தைப் போலவே திறக்கப்படுவது எது என்பதை முதன்மை உரையில் குறிப்பிடாமல் விடுகிறது.
theological_decisions:
- issue: வாக்குறுதியின் அனைவரையும் உள்ளடக்கும் வரம்பும் வலிமையும்
  choice: எவ்விதக் கூடுதல் தகுதிநிபந்தனையும் சேர்க்காமல் பொதுவான, அனைவரையும் உள்ளடக்கும் கூற்றாக மொழிபெயர்த்தல்
  alternative: ‘சரியாகக் கேட்கிறவர்’ போன்ற விளக்கத் தகுதிகளைச் சேர்த்தல் அல்லது மிகைப்படுத்திக் கூறிய ஊக்கவுரையாக வெளிப்படுத்தல்
  rationale: கிரேக்கம் ஜெபத்தைப் பற்றிய சூழலில் நிபந்தனை கூறாத பொதுவான கூற்றை வழங்குகிறது. உரையில் இல்லாத இறையியல் நிபந்தனைகளைச் சேர்க்காமல் அதன் பதற்றத்தை மொழிபெயர்ப்பு பேண வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணையான கூறுகளின் ஓசையும் அமைப்பும் பேணப்பட்டுள்ளன. இறுதிக் கூறில் கிரேக்கத்தின் குறிப்பிடப்படாத எழுவாய்/பொருள் தமிழிலும் குறிப்பிடப்படாமல் வைக்கப்பட்டுள்ளது.
