base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: ta
  text: உங்களுக்கு ஐயோ! ஏனெனில், இறைவாக்கினர்களின் கல்லறைகளை[a] நீங்கள் கட்டுகிறீர்கள்; ஆனால் உங்கள் மூதாதையர்[b] அவர்களைக் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நினைவுக் கல்லறைகளை.’ கிரேக்கச் சொல் கல்லறைகளையோ கல்லறை நினைவுச் சின்னங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘தந்தையர்’; இங்கு முந்தைய தலைமுறையைச் சேர்ந்த மூதாதையரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: உங்களுக்கு ஐயோ!
  rationale: தீர்ப்பை அறிவிக்கும் தீர்க்கதரிசனக் கண்டனத்தின் வலிமையைத் தக்கவைக்கிறது; வெறும் வருத்தத்தை மட்டும் தெரிவிக்கும் சொல்லாக இதை மென்மைப்படுத்தவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள கண்டனத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οἰκοδομεῖτε
  choice: நீங்கள் கட்டுகிறீர்கள்
  rationale: கிரேக்க நிகழ்காலத்தின் தற்போதைய அல்லது வழக்கமான செயல் உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: τὰ μνημεῖα
  choice: கல்லறைகளை
  rationale: μνημεῖον என்பதன் அடக்கத்தலத்துடன் தொடர்புடைய முதன்மைப் பொருளை எளிய, இயல்பான தமிழில் தருகிறது; நினைவுச் சின்னக் கல்லறைகள் என்ற சாத்தியத்தைக் குறிப்பில் வைத்திருக்கிறது.
- source_word: τῶν προφητῶν
  choice: இறைவாக்கினர்களின்
  rationale: கல்லறைகள் இறைவாக்கினர்களுக்குரியவை அல்லது அவர்களோடு தொடர்புடையவை என்பதைக் காட்டும் உரிமைத் தொடர்பை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: ஆனால் உங்கள் மூதாதையர்
  rationale: δέ தரும் எதிர்நிலையை ‘ஆனால்’ வெளிப்படுத்துகிறது; இச்சூழலில் πατέρες என்பது முந்தைய தலைமுறையினரைக் குறிப்பதால் ‘மூதாதையர்’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: ἀπέκτειναν αὐτούς
  choice: அவர்களைக் கொன்றார்கள்
  rationale: வினையின் அடிப்படைப் பொருளை நேரடியாகத் தருகிறது; ‘கொலை செய்தார்கள்’ என்று சட்ட அல்லது ஒழுக்க நுணுக்கத்தை மூலத்தைவிட வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: கல்லறைகளைக் கட்டுபவர்களுக்கும் இறைவாக்கினர்களைக் கொன்ற மூதாதையருக்கும் இடையிலான மறைமுக உடந்தை அல்லது பாசாங்கை இவ்வசனத்திலேயே வெளிப்படையாக்கலாமா?
  choice: இரு செயல்களையும் எதிர்நிலையில் வைத்து, உட்கருத்தை விளக்கிச் சேர்க்காமல் விடுதல்.
  alternative: ‘உங்கள் மூதாதையர் கொன்ற இறைவாக்கினர்களுக்குக் கல்லறைகளைக் கட்டுகிறீர்கள்’ என்று தொடர்பை உறவுப்பெயரெச்சமாக அமைத்தல், அல்லது அவர்களுடைய செயலை நீங்கள் ஒப்புக்கொள்கிறீர்கள் என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: இவ்வசனம் கல்லறை கட்டுதலையும் மூதாதையர் கொன்றதையும் அடுத்தடுத்து வைக்கிறது; அதன் விளக்கம் அடுத்த வசனத்தில் விரிகிறது. ஆகவே இங்கு உள்ள இறையியல் மற்றும் சொல்லாட்சித் தளர்வைத் தீர்மானித்து விடாமல் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தீர்க்கதரிசனக் கண்டனத்துக்குரிய கண்ணியமும் வலிமையும் நிலைக்குமாறும் மொழியாக்கப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்பது மதப்பிரிவு சார்ந்த தனிச்சொல்லாக்கத்தைத் தவிர்த்து προφήτης என்பதைக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது.
