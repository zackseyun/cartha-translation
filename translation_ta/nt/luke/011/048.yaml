source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: ta
  text: ஆகவே, நீங்கள் உங்கள் முன்னோர்களின் செயல்களுக்குச் சாட்சிகளாக இருக்கிறீர்கள்; அவற்றை ஆமோதிக்கிறீர்கள். ஏனெனில், அவர்கள் தீர்க்கதரிசிகளைக் கொன்றார்கள்; நீங்களோ அவர்களுடைய கல்லறைகளைக் கட்டுகிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்டுள்ள தீர்க்கதரிசிகளின் கல்லறைகளைக் கட்டுகிறீர்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: ஆகவே
  rationale: முந்தைய வசனத்திலுள்ள குற்றச்சாட்டிலிருந்து எடுக்கப்படும் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: μάρτυρές ἐστε
  choice: சாட்சிகளாக இருந்து
  rationale: பெயர்ச்சொல் சார்ந்த கிரேக்க அமைப்பையும், தங்கள் செயல்களால் தாங்களே சாட்சிகளாக நிற்கிறார்கள் என்ற சூழல்சார் பொருளையும் காக்கிறது.
- source_word: συνευδοκεῖτε
  choice: ஆமோதிக்கிறீர்கள்
  rationale: வெறும் உடன்பாட்டை விட, முன்னோர்களின் செயல்களுக்கு வழங்கும் செயற்பூர்வமான ஒப்புதலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τοῖς ἔργοις
  choice: செயல்களை
  rationale: ஒழுக்கப் பொறுப்பு சார்ந்த குறிப்பிட்ட செயல்களை இயல்பாகக் குறிக்கிறது.
- source_word: τῶν πατέρων ὑμῶν
  choice: உங்கள் முன்னோர்களின்
  rationale: இங்கு முந்தைய தலைமுறையினரைச் சுட்டுவதால், தமிழில் இயல்பாகவும் உள்ளடக்கம் தெளிவாகவும் உள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: குற்றச்சாட்டுக்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்கத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: அவர்கள் தீர்க்கதரிசிகளைக் கொன்றார்கள்
  rationale: இரு αὐτοὺς வடிவங்களால் தமிழில் உருவாகக்கூடிய தெளிவின்மையை உடனடி சூழலான வசனம் 47 அடிப்படையில் நீக்குகிறது.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: நீங்களோ அவர்களுடைய கல்லறைகளைக் கட்டுகிறீர்கள்
  rationale: δὲ-யின் தலைமுறை எதிர்மறை ஒப்பீட்டை ‘நீங்களோ’ காக்கிறது; கட்டப்படும் பொருள் வசனம் 47-இலிருந்து இயல்பாக நிரப்பப்படுகிறது.
theological_decisions:
- issue: οἰκοδομεῖτε என்பதற்கான மறைமுகப் பொருளை முதன்மை உரையில் சேர்ப்பதா
  choice: ‘அவர்களுடைய கல்லறைகளைக் கட்டுகிறீர்கள்’ என்று உடனடி சூழலிலிருந்து பொருளை நிரப்புதல்
  alternative: ‘நீங்களோ கட்டுகிறீர்கள்’ என்று பொருளைக் கூறாமல் விடுதல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் இவ்வசனத்தில் மீண்டும் வராவிட்டாலும், முந்தைய வசனத்தில் தீர்க்கதரிசிகளின் கல்லறைகள் தெளிவாகக் குறிப்பிடப்படுகின்றன. தமிழில் வெறும் ‘கட்டுகிறீர்கள்’ என்பது இயல்பற்றதும் பொருள் முழுமையற்றதும் ஆகும்; சூழல்சார் நிரப்புதல் கருத்தை மாற்றாமல் வாசிப்பைத் தெளிவாக்குகிறது.
- issue: ‘சாட்சிகள்’ மற்றும் ‘ஆமோதிக்கிறீர்கள்’ இடையிலான தொடர்பு
  choice: இரண்டையும் ஒரே குற்றச்சாட்டின் இணைந்த கூறுகளாக வைத்தல்
  alternative: ‘சாட்சியளித்து ஆமோதிக்கிறீர்கள்’ என்று ஒரே செயலாகக் கலத்தல்
  rationale: καὶ இரு தனித்த இலக்கணக் கூறுகளை இணைக்கிறது; அவர்கள் சாட்சிகளாகவும் முன்னோர்களின் செயல்களை ஆமோதிப்பவர்களாகவும் உள்ளனர் என்ற பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். ‘முன்னோர்கள்’ என்பது இச்சூழலில் πατέρων என்பதன் தலைமுறை சார்ந்த பொருளை இயல்பாக வழங்குகிறது. ‘நீங்களோ’ என்பது கிரேக்கத்தின் வலியுறுத்தப்பட்ட ὑμεῖς δὲ எதிர்மறை ஒப்பீட்டைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
