revisions:
- from: அவர் பேச்சற்றவராக்கிய ஒரு பேயை விரட்டிக்கொண்டிருந்தார். அந்தப் பேய் வெளியேறியதும், பேச்சற்றிருந்தவர் பேசினார்; மக்கள் கூட்டங்கள் வியந்தன.[a]
  to: அவர் ஒருவரைப் பேச முடியாதபடி செய்த ஒரு பேயை விரட்டிக்கொண்டிருந்தார்.[a] அந்தப் பேய் வெளியேறியதும், பேச்சற்றிருந்தவர் பேசினார்; மக்கள் கூட்டத்தினர் வியந்தனர்.
  rationale: The revision retains the source’s exorcism claim, sequential narration, and contextual focus on restored speech. It improves Tamil syntax in the first clause, places the lexical note at its relevant expression, and uses a more natural personal expression for the crowds’ response. No doctrinal interpretation has been added.
