id: LUK.11.14
reference: Luke 11:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: ta
  text: அவர் ஒருவரைப் பேச முடியாதபடி செய்த ஒரு பேயை விரட்டிக்கொண்டிருந்தார்.[a] அந்தப் பேய் வெளியேறியதும், பேச்சற்றிருந்தவர் பேசினார்; மக்கள் கூட்டத்தினர் வியந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κωφός என்ற கிரேக்கச் சொல் ‘செவிடான’ அல்லது ‘பேச முடியாத’ என்று பொருள்படலாம். இங்கு பேய் வெளியேறியபின் அந்த நபர் பேசுவதால், ‘பேச முடியாதபடி’ என்பது சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: விரட்டிக்கொண்டிருந்தார்
  rationale: ἦν + நிகழ்காலப் பங்கேற்புவினை கடந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கிறது; ‘விரட்டிக்கொண்டிருந்தார்’ அதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δαιμόνιον
  choice: பேய்
  rationale: δαιμόνιον என்பது தீய ஆவிக்குரிய தனிப்பட்ட உயிரினத்தைக் குறிக்கிறது. தமிழில் வேதாகமப் பயன்பாட்டிலும் பொதுப் புரிதலிலும் ‘பேய்’ நேரடியான, இயல்பான சொல்; இவ்வசனத்தில் இல்லாத ‘அசுத்த ஆவி’ என்ற சொற்றொடரை இது இறக்குமதி செய்யாது.
- source_word: κωφόν
  choice: பேச்சற்றவராக்கிய
  rationale: κωφός ‘செவிடான’ அல்லது ‘பேச முடியாத’ என இருவகையாகப் பொருள்படலாம். பேய் வெளியேறியபின் அந்த நபர் பேசுகிறார் என்பதால், இங்கு பேச்சின்மையே மையம். முதல் κωφόν இலக்கணப்படி δαιμόνιον-ஐ விவரிப்பதால், பேயே பேச முடியாதது என்ற தவறான தமிழ் வாசிப்பைத் தவிர்த்து, அதன் விளைவாக நபர் பேச்சற்றிருந்தார் என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: அந்தப் பேய் வெளியேறியதும்
  rationale: கதைத் தொடரில் அடுத்த நிகழ்வைச் சுருக்கமாகக் காட்டி, பேய் வெளியேறியது பேசுதலுக்கு முன் நிறைவுற்றது என்ற கால உறவையும் காக்கிறது.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: λαλέω என்பதன் நேரடியான பொருள் ‘பேசுதல்’; மூலத்தில் வெளிப்படையாக இல்லாத ‘பேசத் தொடங்கினார்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὁ κωφός
  choice: பேச்சற்றிருந்தவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட κωφός பாதிக்கப்பட்ட நபரைக் குறிக்கிறது. ‘பேச்சற்றிருந்தவர்’ என்பது அவர் முன்பு இருந்த நிலையையும், இப்போது பேசுகிறார் என்பதையும் இயல்பாகத் தெளிவாக்குகிறது; பாலினத்தை தேவையின்றி சேர்ப்பதில்லை.
- source_word: ἐθαύμασαν
  choice: வியந்தன
  rationale: θαυμάζω குறிக்கும் ஆச்சரியத்தையும் வியப்பையும் ‘வியந்தன’ சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: மூலத்தின் பன்மையைத் தக்கவைத்து, நவீன தமிழில் தெளிவாக ஒலிக்கிறது.
theological_decisions:
- issue: துன்பத்தின் இயல்பும் பேயை விரட்டும் மொழியும்
  choice: உண்மையான ஒரு பேய் விரட்டப்பட்டதாகவும், அது வெளியேறியதும் பாதிக்கப்பட்டவர் பேசியதாகவும் உரையை மொழிபெயர்த்தல்
  alternative: இயற்கைக்கு அப்பாற்பட்ட கூறைத் தவிர்த்து வெறும் நோய் அல்லது மனநிலையாக விளக்குதல்
  rationale: மூலம் δαιμόνιον என்று வெளிப்படையாகக் கூறி, அது வெளியேறியதை நபர் பேசுவதற்கு முந்திய நிகழ்வாக விவரிக்கிறது. அந்தக் கூற்றைக் குறைக்காமலும் மேலதிக விளக்கம் சேர்க்காமலும் மொழிபெயர்ப்பு காக்கிறது.
- issue: κωφός என்பதிலுள்ள செவிடு/பேச்சற்ற ambiguity
  choice: சூழலின் அடிப்படையில் பிரதான உரையில் பேச்சின்மையைக் காட்டி, மாற்றுப் பொருளை அடிக்குறிப்பில் பதிவு செய்தல்
  alternative: பிரதான உரையில் ‘செவிடு’ என்று மொழிபெயர்த்தல்
  rationale: κωφός இரு பொருள்களையும் கொள்ளக்கூடும்; ஆனால் பேய் வெளியேறியபின் அவர் பேசினார் என்பதே உடனடிச் சூழல். எனவே ‘பேச்சற்ற’ என்பது இங்கு சிறப்பாகப் பொருந்துகிறது, அதேவேளை சொல் சார்ந்த உண்மையான ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘விரட்டிக்கொண்டிருந்தார்’ தொடர்ச்சியான கடந்தகாலச் செயலைக் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய கூற்றின் முடிவில் வைக்கப்பட்டுள்ளது.
