  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ta
  text: என்னோடு இல்லாதவர் எனக்கு எதிராக இருக்கிறார்[a]; என்னோடு கூட்டிச் சேர்க்காதவர் சிதறடிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு இல்லாத எவரும் எனக்கு எதிராக இருக்கிறார்; என்னோடு கூட்டிச் சேர்க்காத எவரும் சிதறடிக்கிறார்.”
    reason: பெயர்ச்சொல் போலப் பயன்படும் கிரேக்கப் பங்கேற்பு வடிவத்தைத் தமிழில் பொதுமைப்படுத்திக் கூறுவதற்கான மாற்று.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: இல்லாதவர்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் பொதுவான ஒருமைச் சுட்டை, பழமையான அல்லது பாலினத்தை முன்னிறுத்தும் நடையின்றி இயல்பான தமிழில் தருகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: உடனிருத்தல், தொடர்பு, சார்பு ஆகியவற்றைக் குறிக்கும் μετά + பிறப்புவேற்றுமையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: κατ’ ἐμοῦ
  choice: எனக்கு எதிராக
  rationale: எதிர்ப்பு என்ற பொருளைத் தெளிவாக வெளிப்படுத்தி, ‘என்னோடு’ என்பதற்கு எதிரான சொல்லமைப்பையும் காக்கிறது.
- source_word: συνάγων
  choice: சேர்க்காதவர்
  rationale: ஒன்றாகக் கூட்டுதல் என்ற அடிப்படைப் பொருளைக் காக்கிறது; கிரேக்கத்தில் செயப்படுபொருள் குறிப்பிடப்படாததால் தமிழிலும் அதை நிரப்பவில்லை.
- source_word: σκορπίζει
  choice: சிதறடிக்கிறார்
  rationale: சேர்ப்பதற்கு நேர்மாறான, வலுவான மற்றும் இயல்பான செயலை வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: ;
  rationale: இரு இணையான கூற்றுகளின் நெருங்கிய தொடர்பைத் தமிழில் இயல்பாகக் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; தனியான இணைப்புச்சொல் இல்லாமலும் கிரேக்கத்தின் நேரடி சொல்லாட்சி தெளிவாகத் தொடர்கிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய நடுநிலையின்மையின் வலிமை
  choice: இயேசுவோடு இல்லாதவர் அவருக்கு எதிராக இருப்பதாகக் கூற்றின் கூர்மையான இருமுனைத் தன்மை அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: ஆதரவளிக்காதவர் என்ற மென்மையான பொருளாக்கம் அல்லது பேயோட்டும் சூழலுக்கு மட்டும் இதைக் கட்டுப்படுத்தும் விளக்கம்.
  rationale: கிரேக்கக் கூற்று வடிவத்தில் முழுமையானதும் நேரடியானதும் ஆகும். பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் அதன் இறையியல் அழுத்தத்தைத் தணிக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடியான, கண்ணியமான பேச்சுநடை. பொதுவான ஒருமையை மரியாதை ஒருமை வடிவத்தில் வழங்குகிறது. ‘சேர்க்கிறார்—சிதறடிக்கிறார்’ என்ற எதிரிணை பாதுகாக்கப்பட்டுள்ளது.
