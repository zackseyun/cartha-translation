id: LUK.11.22
reference: Luke 11:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: ta
  text: ஆனால் அவனைவிட வலிமையான ஒருவர் அவனுக்கு எதிராக வந்து, அவனைத் தோற்கடித்தால்[a], அவன் நம்பியிருந்த அவனுடைய முழுக் கவசத்தையும்[b] எடுத்துக்கொண்டு, அவனுடைய கொள்ளைப்பொருளைப்[c] பங்கிட்டுக் கொடுக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை வென்றால்” அல்லது “அவனை மேற்கொண்டால்.”
    reason: lexical_alternative
  - marker: b
    text: “முழுக் கவசம்” என்பது போர்வீரரின் முழுமையான கவசத் தொகுப்பைக் குறிக்கும் சொல்லின் மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனுடைய போர்க் கொள்ளைப் பொருட்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: ஆனால் ... வந்தால்
  rationale: δέ முந்தைய சூழலுடன் உள்ள முரண்பாட்டைச் சுட்டுகிறது; ἐπάν நிபந்தனையுடன் கூடிய காலப்பொருளைத் தருவதால், தமிழில் இயல்பான ‘ஆனால் ... வந்தால்’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: அவனைவிட வலிமையான ஒருவர்
  rationale: ஒப்பீட்டுப் பெயரடை தனித்து பெயர்ச்சொல்லாக வந்துள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘மனிதன்’ என்பதைச் சேர்க்காமல், தமிழில் இயல்பாக ‘ஒருவர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπελθὼν
  choice: அவனுக்கு எதிராக வந்து
  rationale: ஒருவருக்கு எதிராக அல்லது அவர்மேல் வருதல் என்ற மோதல் சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; ‘தாக்கி’ என்று கூறி செயலை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: νικήσῃ αὐτόν
  choice: அவனை வென்று அடக்கினால்
  rationale: νικάω என்பதன் வெற்றிகொள்ளுதல் என்ற பொருளையும், தொடர்ந்து ஆயுதம் அகற்றப்படும் அளவுக்கு எதிரி அடக்கப்படுவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: அவனுடைய முழுக் கவசத்தையும்
  rationale: πανοπλία என்பது தனியொரு கவசத் துண்டை அல்ல, முழுமையான போர்க்கவசத் தொகுப்பைக் குறிக்கிறது.
- source_word: αἴρει
  choice: எடுத்துக்கொண்டு
  rationale: தோற்கடிக்கப்பட்டவனிடமிருந்து கவசத்தை அகற்றி எடுத்துக்கொள்ளும் சூழ்நிலைப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: அவன் நம்பியிருந்த
  rationale: அந்தக் கவசத்தின்மீது அவனுக்கு நீடித்த நம்பிக்கை இருந்தது என்பதை இறந்தகாலத் தொடர்நிலை அமைப்பு தெரிவிக்கிறது.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: அவனுடைய கொள்ளைப்பொருள்
  rationale: σκῦλα என்பது தோற்கடிக்கப்பட்டவரிடமிருந்து கைப்பற்றப்படும் போர்க் கொள்ளை அல்லது வெற்றிப்பொருட்களைக் குறிக்கிறது; ‘கொள்ளைப்பொருள்’ இச்சூழலில் தெளிவான நவீனத் தமிழ்.
- source_word: διαδίδωσιν
  choice: பங்கிட்டுக் கொடுக்கிறார்
  rationale: பொருட்களைப் பிரித்து மற்றவர்களுக்குப் பகிர்ந்தளித்தல் என்ற வினையின் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: வலிமையானவரை வெளிப்படையாக ‘வலிமையான மனிதன்’ என்று குறிப்பிட வேண்டுமா?
  choice: ‘அவனைவிட வலிமையான ஒருவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவனைவிட வலிமையான ஒரு மனிதன்’
  rationale: கிரேக்கத்தில் ‘மனிதன்’ என்ற பெயர்ச்சொல் இவ்வசனத்தில் இல்லை. முந்தைய வசனத்தின் உருவகம் சூழலில் தெளிவாக இருப்பதால், இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் மூலத்தின் வடிவம் பாதுகாக்கப்படுகிறது.
- issue: νικάω என்பதன் மோதல் சார்ந்த வலிமையை எவ்வாறு வழங்குவது?
  choice: ‘வென்று அடக்கினால்’
  alternative: ‘தோற்கடித்தால்’ அல்லது ‘வென்றால்’
  rationale: இது வெறும் கருத்தியல் வெற்றியல்ல; எதிரியின் கவசத்தை அகற்றவும் உடைமைகளைப் பகிரவும் வழிவகுக்கும் நடைமுறை அடக்குதல். அதே நேரத்தில், அந்த வலிமையானவர் யாரைக் குறிக்கிறார் என்ற இறையியல் விளக்கத்தை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உருவகத்தின் போர்ச் சூழலைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. ‘ஒருவர்’ என்பதற்கு மரியாதை ஒருமை வினை பயன்படுத்தப்பட்டாலும், தோற்கடிக்கப்படுபவரை ‘அவன்’ என்று குறிப்பதன் மூலம் இரு நபர்களும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளனர். எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்றொடர்களுக்குப் பின்பு இடப்பட்டுள்ளன.
