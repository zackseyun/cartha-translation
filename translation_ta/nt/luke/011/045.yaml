id: LUK.11.45
reference: Luke 11:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: ta
  text: அப்போது திருச்சட்ட வல்லுநர்களில்[a] ஒருவர் அவரிடம், “போதகரே, நீங்கள் இவற்றைச் சொல்வதால் எங்களையும் அவமதிக்கிறீர்கள்[b]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்ட அறிஞர்களில்.” கிரேக்கச் சொல் யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்றவர்களைக் குறிக்கிறது; நவீன தொழில்முறை வழக்கறிஞர்களை அவசியம் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்களையும் இழிவாக நடத்துகிறீர்கள்.” இந்த வினைச்சொல் வெறுமனே மனதைப் புண்படுத்துவதை அல்ல, அவமதிப்பதையோ இழிவுபடுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: பதிலளித்தார்
  rationale: ἀποκρίνομαι என்பதன் இறந்தகாலப் பெயரெச்சம் உரையாடலில் பதிலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான இறந்தகால வினையாக மாற்றப்பட்டுள்ளது.
- source_word: δέ
  choice: அப்போது
  rationale: δέ இங்கு வலுவான முரண்பாட்டை அல்ல, கதையின் அடுத்த நகர்வைக் குறிக்கிறது; ‘அப்போது’ அந்த மென்மையான தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τις τῶν νομικῶν
  choice: திருச்சட்ட வல்லுநர்களில் ஒருவர்
  rationale: νομικός என்பது நவீன நீதிமன்ற வழக்கறிஞரை அல்ல, யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்ற ஒருவரைக் குறிக்கிறது. ‘திருச்சட்ட வல்லுநர்’ அந்த வரலாற்றுச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: λέγει αὐτῷ
  choice: அவரிடம் … என்று
  rationale: λέγει வரலாற்று நிகழ்காலத்தில் இருந்தாலும், தமிழ் கதைநடையில் இயல்பாக இறந்தகாலச் சொல்லமைப்புக்குள் கொண்டுவரப்பட்டுள்ளது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: διδάσκαλος என்பது கற்பிப்பவரை மரியாதையுடன் அழைக்கும் சொல். ‘போதகரே’ என்பது இச்சூழலில் இயல்பான, கண்ணியமான விளிப்பு.
- source_word: ταῦτα λέγων
  choice: நீங்கள் இவற்றைச் சொல்வதால்
  rationale: பெயரெச்சத் தொடர், இயேசு இப்போதுதான் கூறியவற்றுக்கும் குற்றச்சாட்டுக்கும் உள்ள காரணத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: καὶ ἡμᾶς
  choice: எங்களையும்
  rationale: καί, முன்பு குறிப்பிடப்பட்டவர்களோடு திருச்சட்ட வல்லுநர்களையும் சேர்க்கிறது; ‘எங்களையும்’ அதன் கூட்டல் பொருளைப் பாதுகாக்கிறது.
- source_word: ὑβρίζεις
  choice: அவமதிக்கிறீர்கள்
  rationale: ὑβρίζω இங்கு வெறுமனே மனவருத்தம் ஏற்படுத்துவதைவிட, இழிவாக நடத்துதல் அல்லது அவமானப்படுத்துதல் என்ற வலுவான பொருளைக் கொண்டுள்ளது.
