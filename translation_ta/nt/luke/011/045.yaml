translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் இயல்பான மரியாதைப் பன்மையான ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக இயல்பாக்கப்பட்டுள்ளது.
