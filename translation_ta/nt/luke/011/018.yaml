id: LUK.11.18
reference: Luke 11:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: ta
  text: ஆனால் சாத்தானும் தனக்கே எதிராகப் பிளவுபட்டால், அவனுடைய அரசாட்சி எப்படி நிலைத்திருக்கும்? ஏனெனில், நான் பெயல்செபூலால்[a] பேய்களை விரட்டுகிறேன் என்று நீங்கள் சொல்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் பெயல்செபூல்; சில ஆங்கில மரபுகளில் பெயல்செபூப் என்று வழங்கப்படுகிறது.
    reason: SBLGNT-இல் உள்ள Βεελζεβούλ வடிவத்தையும், ஆங்கில மரபுகளில் காணப்படும் மாற்று வடிவத்தையும் சுட்டுதல்.
lexical_decisions:
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: கிரேக்கத்தில் உள்ள தனிப்பெயர்/பட்டப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἐφ’ ἑαυτὸν
  choice: தனக்கே எதிராக
  rationale: διαμερίζω என்பதுடன் இச்சொற்றொடர் உள்ளார்ந்த எதிர்ப்பையும் தன்னுள்ளேயான பிளவையும் குறிக்கிறது; ‘எதிராக’ என்பது அந்த உறவை இயல்பான தமிழில் தருகிறது.
- source_word: διεμερίσθη
  choice: பிளவுபட்டால்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவம் நிபந்தனை வாதத்தில் விளைவுநிலையைச் சுட்டுகிறது; தமிழில் பொதுநிலை நிபந்தனையாகக் கூறுவது வாதத்தின் இயல்பையும் சுருக்கத்தையும் காக்கிறது.
- source_word: πῶς σταθήσεται
  choice: எப்படி நிலைத்திருக்கும்?
  rationale: தொடர்ந்து நிற்றல் அல்லது நீடித்திருத்தல் என்ற உருவகத்தையும் எதிர்கால வினாவின் வலிமையையும் காக்கிறது.
- source_word: βασιλεία
  choice: அரசு
  rationale: இங்கு சாத்தானின் ஆளுகைக்குட்பட்ட அரசு அல்லது ஆதிக்கக் களத்தைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வினாவுக்கு எதிரிகளின் குற்றச்சாட்டை ஆதாரக் காரணமாக இணைக்கும் விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἐν Βεελζεβοὺλ
  choice: பெயெல்செபூலால்
  rationale: ἐν இங்கு முகமை அல்லது கருவித்தன்மையைக் குறிக்கிறது; ‘-ஆல்’ அதை கூடுதல் விளக்கத்தைச் சேர்க்காமல் சுருக்கமாகத் தருகிறது.
- source_word: Βεελζεβοὺλ
  choice: பெயெல்செபூல்
  rationale: SBLGNT-யின் Βεελζεβούλ வடிவத்தை நேரடியாகத் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: ἐκβάλλειν
  choice: விரட்டுகிறேன்
  rationale: பேய்களை ஒருவரிடமிருந்து வெளியேற்றும் செயலை இன்றைய தமிழில் இயல்பாகவும் வலிமையாகவும் குறிக்கிறது.
- source_word: τὰ δαιμόνια
  choice: பேய்களை
  rationale: δαιμόνια என்பதற்கான நேரடியான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் சொல்; ‘தீய ஆவிகள்’ என்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான குற்றச்சாட்டின் தன்மை
  choice: இயேசு பெயெல்செபூலால் பேய்களை விரட்டுவதாக அவர்கள் சொன்ன குற்றச்சாட்டை மட்டும் உரை கூறுகிறது.
  alternative: பெயெல்செபூலின் வல்லமையால் அல்லது அவனுடன் இணைந்து இயேசு பேய்களை விரட்டுவதாக விரிவாகக் கூறுதல்.
  rationale: ἐν என்பதன் முகமை/கருவித்தன்மை தமிழில் ‘-ஆல்’ எனத் தரப்படுகிறது; ஆனால் கிரேக்கம் வெளிப்படையாகச் சொல்லாத வல்லமை அல்லது கூட்டுறவு பற்றிய விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையின் வாதத் தன்மையும் மரியாதையான நடையும் காக்கப்படும் வகையிலும் மொழிபெயர்க்கப்பட்டது. அடிக்குறிப்பு குறி அது விளக்கும் ‘பெயெல்செபூல்’ என்பதற்குப் பின் வைக்கப்பட்டது.
