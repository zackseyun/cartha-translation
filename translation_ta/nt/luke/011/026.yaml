  source_fidelity: மூலக் கிரேக்கத்தின் நிகழ்வுவரிசை, ‘தன்னைவிடப் பொல்லாத’ என்ற ஒப்பீடு, ஏழு வேறு ஆவிகள், நுழைதல்/குடியிருத்தல், மற்றும் பின்னைய நிலை முந்தையதைவிட மோசமாதல் ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. πνεύματα என்பதற்கு மூலத்தில் இல்லாத ‘பேய்கள்’ அல்லது ‘அசுத்த ஆவிகள்’ என்ற குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை. κατοικεῖ என்ற ஒருமை வினையால் உருவாகும் உரைநிலைச் சிக்கல் அடிக்குறிப்பில் நேர்மையாகக் குறிக்கப்பட்டுள்ளது; தமிழின் இயல்பான பன்மை வினை பயன்பாடு பொருளைச் சிதைக்கவில்லை.
