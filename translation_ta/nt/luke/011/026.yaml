  terminology: ‘ஆவிகள்’ என்பது πνεύματα என்பதற்குச் சரியான, தேவையற்ற விளக்கத்தைச் சேர்க்காத தேர்வாகும். ‘பொல்லாத’ πονηρότερα என்பதன் தீய/தீங்கான பொருளைத் தக்கவைக்கிறது. ‘அந்த மனிதன்’ ἀνθρώπου என்பதன் குறிப்பிட்ட எடுத்துக்காட்டு-நபர் தன்மையைப் பொருத்தமாகக் காட்டுகிறது.
