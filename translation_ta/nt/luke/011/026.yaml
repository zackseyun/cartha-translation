id: LUK.11.26
reference: Luke 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: ta
  text: அப்போது அது போய், தன்னைவிடப் பொல்லாத வேறு ஏழு ஆவிகளைத் தன்னுடன் அழைத்துக்கொள்கிறது[a][b]. அவை உள்ளே நுழைந்து அங்கே குடியிருக்கின்றன[c]. அந்த மனிதனின் பிந்தைய நிலை முந்தைய நிலையைவிட மோசமாகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன்னைவிடத் தீய’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனத்தின் கிரேக்க உரை ‘ஆவிகள்’ என்றே கூறுகிறது; ‘பேய்கள்’ அல்லது ‘அசுத்த ஆவிகள்’ என்று வெளிப்படையாகக் கூறவில்லை. எனினும் சூழல் அவை தீயவை என்பதைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘உள்ளே நுழைந்து’ என்பது கிரேக்கத்தில் பன்மையில் உள்ளது; ஆனால் ‘குடியிருக்கிறது’ என்ற வினை ஒருமையில் உள்ளது. இங்கு ஆவிகளின் கூட்டத்தை ஒருமையாகக் கருதியிருக்கலாம், அல்லது முதலில் குறிப்பிடப்பட்ட ஆவியே வினையின் எழுவாயாக இருக்கலாம்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான கால இணைப்புச் சொல்.
- source_word: πορεύεται
  choice: போய்
  rationale: ஆவி அங்கிருந்து செல்வதைக் காட்டும் எளிய, இயல்பான இயக்க வினை.
- source_word: παραλαμβάνει
  choice: தன்னுடன் அழைத்துக்கொள்கிறது
  rationale: வெறுமனே எடுத்துக்கொள்வது அல்லாமல், தன்னோடு கூட்டிக்கொண்டு வருகிற பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἕτερα πνεύματα
  choice: வேறு ... ஆவிகளை
  rationale: ἕτερα என்பதன் ‘வேறு’ என்ற பொருளையும், πνεύματα என்பதில் இல்லாத ‘பேய்கள்’ அல்லது ‘அசுத்த ஆவிகள்’ என்ற குறிப்பைச் சேர்க்காமலும் மொழிபெயர்க்கிறது.
- source_word: πονηρότερα ἑαυτοῦ
  choice: தன்னைவிடப் பொல்லாத
  rationale: திரும்பிவரும் ஆவியோடு மற்ற ஆவிகளை ஒப்பிடும் ஒப்பீட்டு அமைப்பைப் பாதுகாக்கிறது; ‘பொல்லாத’ என்பது தீய தன்மையை இயல்பாகக் காட்டுகிறது.
- source_word: ἑπτά
  choice: ஏழு
  rationale: மூலத்தின் எண்ணை நேரடியாகத் தக்கவைக்கிறது.
- source_word: εἰσελθόντα
  choice: அவை உள்ளே நுழைந்து
  rationale: பன்மை ஆவிகளைக் குறிக்கும் பன்மை வினையெச்சத்தின் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: κατοικεῖ ἐκεῖ
  choice: அங்கே குடியிருக்கின்றன
  rationale: அந்த இடத்தில் நிலையாகத் தங்கும் பொருளை ‘குடியிருக்கின்றன’ வெளிப்படுத்துகிறது; கிரேக்கத்தில் வினை ஒருமையில் இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: τὰ ἔσχατα ... τῶν πρώτων
  choice: பிந்தைய நிலை முந்தைய நிலையைவிட
  rationale: ஒருவரின் பின்னர் ஏற்பட்ட நிலையை முன்பு இருந்த நிலையோடு ஒப்பிடும் கிரேக்க மரபுத்தொடரை தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: χείρονα
  choice: மோசமாகிறது
  rationale: நிலையின் தரம் முன்பைவிடக் கெடுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: πνεύματα என்பதை ‘பேய்கள்’ அல்லது ‘அசுத்த ஆவிகள்’ என்று வெளிப்படையாகக் குறிப்பிடலாமா
  choice: ஆவிகள்
  alternative: பேய்கள் / அசுத்த ஆவிகள்
  rationale: சூழல் இவை தீய ஆவிகள் என்பதைத் தெளிவாக்கினாலும், இவ்வசனத்தில் உள்ள பெயர்ச்சொல் ‘ஆவிகள்’ என்று மட்டுமே கூறுகிறது. மூலத்தில் இல்லாத குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: ἀνθρώπου என்பதன் பாலினக் குறிப்பு
  choice: அந்த மனிதனின்
  alternative: அந்த நபரின்
  rationale: இயேசுவின் எடுத்துக்காட்டில் குறிப்பிடப்படும் தனி மனிதரை மூலத்தின் ஆண்பால் வடிவத்துக்கு ஏற்ப மொழிபெயர்க்கிறது.
- issue: κατοικεῖ என்ற ஒருமை வினையை எவ்வாறு கையாளுவது
  choice: முதன்மை உரையில் ‘அவை ... குடியிருக்கின்றன’ என்று பொருள்சார் பன்மை
  alternative: ‘அது அங்கே குடியிருக்கிறது’ என்ற இலக்கண ஒருமை
  rationale: εἰσελθόντα என்பது ஆவிகளோடு பொருந்தும் பன்மை வடிவம்; தொடரின் இயல்பான பொருள் அவை நுழைந்து குடியிருப்பதாகும். ஆயினும் மூல உரையின் ஒருமை வினை ஏற்படுத்தும் இலக்கணத் tension-ஐ அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குடியிருக்கின்றன’ என்பது தற்காலிகமாகத் தங்குவதைக் காட்டாமல் κατοικεῖ என்பதன் நிலையான வசிப்புப் பொருளை வெளிப்படுத்துகிறது. ‘பிந்தைய நிலை / முந்தைய நிலை’ என்ற இணை, தேவையற்ற இறுதிக்காலத் தத்துவப் பொருளைச் சேர்க்காமல் கிரேக்க ஒப்பீட்டைத் தக்கவைக்கிறது.
