id: LUK.11.31
reference: Luke 11:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ta
  text: தென்னாட்டு அரசி நியாயத்தீர்ப்பின்போது இந்தத் தலைமுறையின் ஆண்களோடு எழுந்து, அவர்களைக் குற்றவாளிகளென்று தீர்ப்பாள்[a]. ஏனெனில், அவள் சாலொமோனின் ஞானத்தைக் கேட்கப் பூமியின் கடையெல்லைகளிலிருந்து வந்தாள். இதோ[b], சாலொமோனைவிடப் பெரியது இங்கே இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவர் பொதுவாகச் சேபாவின் அரசி என்று அடையாளப்படுத்தப்படுகிறார் (1 அரசர்கள் 10:1–13; 2 நாளாகமம் 9:1–12 பார்க்கவும்).
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘சாலொமோனைவிடப் பெரியவர்.’ கிரேக்கத்தில் இடைநிலைப் பாலினச் சொற்றொடர் உள்ளது; சொற்சொல்லாக, ‘சாலொமோனைவிடப் பெரியது.’ இது ஒரு நபரை நேரடியாக ஒப்பிடுவதைவிட விரிவான ஒன்றை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: தென்னாட்டு அரசி
  rationale: கிரேக்கத்தின் ‘தெற்கின் அரசி’ என்ற அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; சேபாவின் அரசி என்ற அடையாளத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἐγερθήσεται
  choice: எழுந்து
  rationale: நியாயத்தீர்ப்பில் எழுந்து நிற்பதையும், இறுதிக்கால உயிர்த்தெழுதல் சார்ந்த ஒலிப்பையும் மிகையாகத் தெளிவுபடுத்தாமல் காக்கிறது.
- source_word: ἐν τῇ κρίσει
  choice: நியாயத்தீர்ப்பின்போது
  rationale: குறிப்பிட்ட இறுதிக்காலத் தீர்ப்பைக் குறிக்கும் விதத்தில் இயல்பான தமிழில் வழங்குகிறது.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: ஆண்களோடு
  rationale: ἀνδρῶν என்பதன் குறிப்பான ஆண்பால் பொருளைத் தக்கவைக்கிறது.
- source_word: τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையின்
  rationale: இயேசுவின் காலத்தவரைக் குறிக்கும் γενεά என்பதற்கான இயல்பான, துல்லியமான தமிழ்.
- source_word: κατακρινεῖ αὐτούς
  choice: அவர்களைக் குற்றவாளிகளென்று தீர்ப்பாள்
  rationale: வெறுமனே தீர்ப்பளித்தல் அல்லாமல் குற்றத்தீர்ப்பு வழங்குதல் என்ற κατακρίνω-வின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: பூமியின் கடையெல்லைகளிலிருந்து
  rationale: மிகத் தொலைவான இடத்தைக் குறிக்கும் மொழிவழக்கின் விரிவான, உலகளாவிய உணர்வைப் பாதுகாக்கிறது.
- source_word: ἀκοῦσαι
  choice: கேட்க
  rationale: வந்ததன் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: சாலொமோனின் ஞானத்தை
  rationale: ஞானமே அவள் நாடிக் கேட்ட பொருள் என்பதைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் உடைமை அமைப்பு.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியின் கம்பீரமான வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: πλεῖον Σολομῶνος
  choice: சாலொமோனைவிடப் பெரியது
  rationale: πλεῖον என்ற இடைநிலைப் பாலின வடிவத்தை ‘பெரியவர்’ என்று ஆளாக்காமல் காக்கிறது; நபர் மட்டுமல்லாத விரிவான ஒப்பீட்டு வலிமைக்கும் இடமளிக்கிறது.
- source_word: ὧδε
  choice: இங்கே இருக்கிறது
  rationale: தற்போதைய இடத்திலுள்ள இருப்பை எளிமையாகவும் நேரடியாகவும் வழங்குகிறது.
theological_decisions:
- issue: அரசியைச் சேபாவின் அரசி என்று முதன்மை உரையில் அடையாளப்படுத்தலாமா
  choice: ‘தென்னாட்டு அரசி’ என்று கிரேக்கச் சொற்றொடரே தக்கவைக்கப்பட்டது
  alternative: சேபாவின் அரசி
  rationale: பழைய ஏற்பாட்டு சுட்டு வலுவானதாயினும், கிரேக்க உரை நேரடியாக ‘தெற்கின் அரசி’ என்றே கூறுகிறது; அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πλεῖον Σολομῶνος என்பதை ‘சாலொமோனைவிடப் பெரியவர்’ என்று ஆளாக்கலாமா
  choice: ‘சாலொமோனைவிடப் பெரியது’ என்று இடைநிலைப் பாலினத் தன்மை காக்கப்பட்டது
  alternative: சாலொமோனைவிடப் பெரியவர்
  rationale: கிரேக்க வடிவம் ஆண்பால் அல்ல, இடைநிலைப் பால். இயேசுவின் நபரை மட்டும் நேரடியாக ஒப்பிடுவதற்கும் அப்பாற்பட்ட செய்தி/ஆட்சி சார்ந்த பரந்த வலிமை இருக்கக்கூடிய பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: ἐγερθήσεται என்பதில் உயிர்த்தெழுதலை வெளிப்படையாகச் சொல்லலாமா
  choice: ‘எழுந்து’ என வழங்கப்பட்டது
  alternative: உயிரோடு எழுப்பப்பட்டு
  rationale: இறுதிக்காலச் சூழல் உயிர்த்தெழுதலை ஒலிக்கச் செய்யலாம்; அதேவேளை நீதிமன்றச் சூழலில் சாட்சியாக எழுந்து நிற்பதையும் குறிக்கலாம். இரு சாத்தியங்களும் திறந்தவையாக வைக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கம்பீரமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நியாயத்தீர்ப்பு,’ ‘தலைமுறை,’ ‘ஞானம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; செயற்கையான பழந்தமிழ் தவிர்க்கப்பட்டது.
