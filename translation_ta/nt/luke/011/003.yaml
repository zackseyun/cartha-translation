  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் சொற்தொடரையும் வலியுறுத்தலையும் நன்றாகக் காக்கிறது: ἐπιούσιον என்பதற்கு ‘அன்றாட,’ τὸ καθ’ ἡμέραν என்பதற்கு ‘ஒவ்வொரு நாளும்,’ δίδου என்பதற்கு தொடர்ச்சியான வேண்டுதலை ஏற்கக்கூடிய ‘தாரும்’ என வழங்கப்பட்டுள்ளது. எனினும் அடிக்குறிப்பில் ‘இயற்கைக்கு மேற்பட்ட’ என்பது ‘supersubstantial’ என்பதற்குச் சரியான இணை அல்ல; அது மூலச் சொல்லில் இல்லாத ‘supernatural’ பொருளைச் சுட்டுகிறது.'
  naturalness: ‘எங்கள் அன்றாட அப்பத்தை ஒவ்வொரு நாளும் எங்களுக்குத் தாரும்’ என்பது நவீனத் தரத் தமிழில் கண்ணியமான ஜெபநடையாகவும் இயல்பாகவும் உள்ளது. ‘அன்றாட’ மற்றும் ‘ஒவ்வொரு நாளும்’ ஆகிய இரட்டிப்பு, கிரேக்க மூலத்திலேயே உள்ள இரு தனித்த கூறுகளைத் தெரிவிப்பதால் ஏற்கத்தக்கது.
