  text: Give us each day our daily bread[a].
translation:
  language: ta
  text: எங்கள் அன்றாட அப்பத்தை ஒவ்வொரு நாளும் எங்களுக்குத் தாரும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வரவிருக்கும் நாளுக்கான அப்பம்,’ ‘எங்களுக்குத் தேவையான அப்பம்,’ அல்லது இங்கு சாத்தியம் குறைவாக, ‘மீப்பொருளான அப்பம்.’ இதற்குரிய கிரேக்கப் பெயரடை மிக அரிதானது; அதன் பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: அப்பத்தை
  rationale: இச்சொல் நேரடியாக ‘அப்பம்’ என்பதைக் குறிக்கிறது; இந்த வேண்டுதலில் அது அடிப்படை உணவையும் வாழ்வாதாரத்தையும் பிரதிநிதித்துவப்படுத்தக்கூடும். ‘உணவு’ என்று விரித்துரைக்காமல், மூலத்தின் concrete image and traditional force is preserved.
- source_word: ἡμῶν
  choice: எங்கள்
  rationale: ‘அப்பம்’ என்பதைக் குறிக்கும் இயல்பான உடைமை வடிவம்.
- source_word: ἐπιούσιον
  choice: அன்றாட
  rationale: மிக அரிதாக வரும், பொருள் குறித்து விவாதிக்கப்படும் பெயரடை இது. லூக்கா தொடர்ந்து பயன்படுத்தும் τὸ καθ’ ἡμέραν என்பதன் வெளிச்சத்தில், வழக்கமான தினசரி தேவையை ‘அன்றாட’ என்பது தெளிவாக வெளிப்படுத்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: δίδου
  choice: தாரும்
  rationale: நிகழ்காலக் கட்டளை தொடர்ச்சியான அல்லது வழக்கமான கொடுத்தலை உணர்த்தலாம். மரியாதையுடனான வேண்டுதலுக்கு ‘தாரும்’ இயல்பானது; தொடர்ச்சியின் நுட்பம் ‘ஒவ்வொரு நாளும்’ என்பதில் வெளிப்படுகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்குத்
  rationale: கட்டளை வினையின் மறைமுகச் செயப்படுபொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ καθ’ ἡμέραν
  choice: ஒவ்வொரு நாளும்
  rationale: திரும்பத் திரும்ப நாள்தோறும் கிடைக்கும் ஏற்பாட்டை வெளிப்படையாகக் குறிக்கிறது. ἐπιούσιον என்பதற்கு ‘அன்றாட’ என்று மொழிபெயர்த்திருந்தாலும், லூக்காவின் தனித்த வலியுறுத்தலை விடாமல் காக்கிறது.
theological_decisions:
- issue: கர்த்தருடைய ஜெபத்தில் ἐπιούσιον என்பதன் பொருள்
  choice: அன்றாட
  alternative: ‘வரவிருக்கும் நாளுக்கான,’ ‘எங்களுக்குத் தேவையான,’ அல்லது இங்கு சாத்தியம் குறைவாக ‘இயற்கைக்கு மேற்பட்ட’
  rationale: இந்தப் பெயரடையின் துல்லியமான பொருள் விவாதத்திற்குரியது. ஆயினும், லூக்காவின் τὸ καθ’ ἡμέραν (‘ஒவ்வொரு நாளும்’) என்பது சாதாரண தினசரி ஏற்பாட்டைச் சார்ந்த பொருளுக்கு ஆதரவளிக்கிறது. சடங்குசார் அல்லது மெய்யியல்சார் வாசிப்பை முதன்மை உரையில் திணிக்காமல், உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’ மூலத்தின் உருவகத்தையும் பாரம்பரிய ஒலியையும் காக்கிறது; ‘தாரும்’ மரியாதையான வேண்டுதலாக இயல்பாக உள்ளது.
