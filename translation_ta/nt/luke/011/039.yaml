source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: ta
  text: ஆனால் ஆண்டவர் அவனிடம், “இப்போது பரிசேயர்களான நீங்கள் கிண்ணத்திற்கும் தட்டிற்கும் வெளிப்புறத்தைச் சுத்தம் செய்கிறீர்கள்; ஆனால் உங்கள் உட்புறமோ பேராசையாலும் தீமையாலும் நிறைந்திருக்கிறது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இங்கு κύριος என்பது இயேசுவுக்கான புதிய ஏற்பாட்டின் வழக்கமான பட்டப்பெயர்; வெறும் மரியாதை அழைப்பாகக் குறுக்கப்படவில்லை.
- source_word: Νῦν
  choice: இப்போது
  rationale: கண்டனத்தைத் தொடங்கும் உரையாடல் குறியீட்டின் நேரடியான வலிமையைத் தக்கவைக்கிறது.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: பரிசேயர்களான நீங்கள்
  rationale: ὑμεῖς என்பதிலுள்ள வலியுறுத்தலை இயல்பான தமிழ் சொல்லமைப்பில் வெளிப்படுத்துகிறது.
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: கிண்ணத்திற்கும் தட்டிற்கும் வெளிப்புறத்தை
  rationale: பாத்திரங்களின் வெளிப்பக்கத்தைச் சுட்டும் உருவகத்தைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: καθαρίζετε
  choice: சுத்தம் செய்கிறீர்கள்
  rationale: நிகழ்காலத்தில் கூறப்படும் வழக்கமான செயலை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: ஆனால் உங்களுடைய உட்புறமோ
  rationale: ‘உள்ளம்’ அல்லது ‘இதயம்’ என்று உளவியல் உறுப்பைத் தீர்மானிக்காமல், வெளிப்புறம்–உட்புறம் என்ற மூல உருவகத்தையும் நேரடியான கண்டனத்தையும் காக்கிறது.
- source_word: ἁρπαγῆς
  choice: பேராசையாலும்
  rationale: சூறையாடி எடுத்துக்கொள்ளும் மனப்பாங்கைக் குறிக்கும் இச்சூழலின் ஒழுக்கக் கண்டனத்தை வாசிக்க எளிய தமிழில் தருகிறது; கொள்ளை அல்லது பறித்தல் என்ற தெளிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: πονηρίας
  choice: பொல்லாப்பாலும்
  rationale: பரவலான ஒழுக்கத் தீமையைக் குறிக்கும் சொல்லின் கடுமையைத் தக்கவைத்து, ‘பேராசை’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: γέμει
  choice: நிறைந்திருக்கிறது
  rationale: உட்புறம் இவ்விரு தீமைகளால் நிரம்பியிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘உட்புறம்’ என்பதன் உருவகக் குறிப்பு
  choice: ‘உங்களுடைய உட்புறம்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘உங்கள் உள்ளம்’ அல்லது ‘உங்கள் இதயம்’
  rationale: மூலம் வெளிப்புறத் தூய்மையையும் உள்ளார்ந்த ஒழுக்கச் சீர்கேட்டையும் எதிரெதிராக வைக்கிறது; குறிப்பிட்ட உளவியல் அல்லது ஆன்மீக உறுப்பை மொழிபெயர்ப்பில் சேர்ப்பது மூலத்தைவிட அதிகமாகத் தீர்மானித்துவிடும்.
- issue: ἁρπαγή என்பதன் ஒழுக்கப் பொருள்
  choice: முதன்மை உரையில் ‘பேராசை’; கொள்ளை சார்ந்த பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘கொள்ளை’, ‘சூறையாடல்’, அல்லது ‘பலவந்தமாகப் பறித்தல்’
  rationale: இங்கு ஒரு தனிப்பட்ட குற்றச்செயலை மட்டும் அல்லாமல் உள்ளார்ந்த கவரும் மனப்பாங்கையும் கண்டிக்கிறது. ‘பேராசை’ நவீன வாசகருக்கு அந்த உள்ளார்ந்த தீய நாட்டத்தைத் தெளிவாக்குகிறது; அடிக்குறிப்பு சொல்லின் செயல்சார்ந்த கடுமையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியக்கூடியதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘உட்புறம்’ சற்றே நேரடியான உருவக மொழியாக இருந்தாலும், மூலத்தின் வெளிப்புறம்–உட்புறம் எதிர்மறையைத் தீர்மானமின்றிக் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
