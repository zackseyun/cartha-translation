source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: ta
  text: 'நான் உங்களுக்குச் சொல்கிறேன்: அவன் அவனுடைய நண்பனாக இருப்பதற்காக எழுந்து அவனுக்கு எதையும் கொடுக்காவிட்டாலும்கூட, அவனுடைய வெட்கமற்ற விடாப்பிடியினிமித்தம் எழுந்து, அவனுக்குத் தேவையான அனைத்தையும் கொடுப்பான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய துணிவினிமித்தம்,” “அவனுடைய வெட்கமின்மையினிமித்தம்”; இன்னும் சொற்சொல்லாக, “அவனுடைய வெட்கமின்மையினிமித்தம்.”
    reason: ἀναίδεια என்ற கிரேக்கச் சொல்லின் பொருள் பரப்பையும் இச்சூழலில் உள்ள தெளிவின்மையையும் காட்டும் சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் நேரடியான அறிமுகக் கூற்றை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: எழுந்து அவனுக்கு எதையும் கொடுக்காவிட்டாலும்கூட
  rationale: εἰ καί என்பதன் விட்டுக்கொடுக்கும் நிபந்தனைத் தொனியைத் தக்கவைத்து, சூழலில் மறைமுகமாக உள்ள கொடுக்கப்படும் பொருளைத் தமிழில் ‘எதையும்’ என வெளிப்படுத்துகிறது.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: அவன் தன் நண்பன் என்பதற்காக
  rationale: φίλον αὐτοῦ குறிக்கும் தனிப்பட்ட நட்பு உறவை அருவமான ‘நட்பு’ என்று மாற்றாமல் நேரடியாகக் காட்டுகிறது; பிரதிப்பெயர் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: διά γε
  choice: ஆனாலும் ... நிமித்தம்
  rationale: நட்பு காரணமாகச் செய்யாதிருந்தாலும், அடுத்த காரணத்தால் செய்வான் என்ற வலியுறுத்தப்பட்ட முரணை வெளிப்படுத்துகிறது.
- source_word: ἀναίδειαν
  choice: வெட்கமற்ற விடாப்பிடி
  rationale: சொல்லின் அடிப்படையான ‘வெட்கமின்மை’ என்ற கூர்மையையும், இச்சூழலில் தொடர்ந்து கேட்டுக்கொண்டிருக்கும் வற்புறுத்தலையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: ἐγερθεὶς
  choice: எழுந்து
  rationale: இரவு நேர வீட்டுச் சூழலில் படுக்கையிலிருந்து எழுவதைக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: ὅσων χρῄζει
  choice: அவனுக்குத் தேவையான அனைத்தையும்
  rationale: தேவைப்படும் முழு அளவையும் பொருட்களையும் உள்ளடக்கும் உறவுப்பெயர்க் கட்டமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: உவமையில் ἀναίδεια என்பதன் பொருள்
  choice: கேட்பவனுடைய ‘வெட்கமற்ற விடாப்பிடி’
  alternative: துணிவு; அடங்காமை; வெட்கமின்மை
  rationale: சொல்லின் எதிர்மறையான சமூகத் தொனியை அழிக்காமலும், ஒழுக்கக்கேட்டை பாராட்டுவதாக வசனத்தை மாற்றாமலும், தொடர்ந்து வெட்கப்படாமல் கேட்பதே சூழலின் மையம் என்பதை மொழிபெயர்ப்பு காட்டுகிறது.
- issue: αὐτοῦ என்பது யாரைக் குறிக்கிறது
  choice: முதல் காரணத்தில் வீட்டுக்காரனின் நண்பனாக வந்தவனைவும், இரண்டாம் காரணத்தில் வந்தவனின் விடாப்பிடியையும் குறிக்கும்படி மொழிபெயர்த்தல்
  alternative: ἀναίδεια வீட்டுக்காரனுடைய கண்ணியத்தை அல்லது வெட்கமின்மையைக் குறிக்கிறது என எடுத்தல்
  rationale: இலக்கண ரீதியாக பிரதிப்பெயர் ஒரே வடிவில் இருப்பதால் ஓரளவு விவாதம் சாத்தியம்; உடனடி கதைநடையும் பாரம்பரியமான வாசிப்பும் வந்தவனின் விடாப்பிடியை ஆதரிக்கின்றன. மாற்றுச் சொல்லாக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளையில் மதிப்பும் கண்ணியமும் கொண்ட நடை. நீளமான கிரேக்க வாக்கியத்தின் நிபந்தனை–முரண் அமைப்பு தமிழில் காக்கப்பட்டுள்ளது. ‘விடாப்பிடி’ பேச்சுவழக்காகத் தாழாமல் பொதுவாகப் புரியும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
