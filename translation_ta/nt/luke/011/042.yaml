id: LUK.11.42
reference: Luke 11:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: ta
  text: ஆனால், பரிசேயர்களே, உங்களுக்கு ஐயோ! ஏனெனில் புதினா, அருதா[a], ஒவ்வொரு கீரை வகையிலிருந்தும் பத்தில் ஒரு பங்கைக் கொடுக்கிறீர்கள்; ஆனால் நீதியையும் கடவுளின் அன்பையும்[b] கடந்து செல்கிறீர்கள். இவற்றைச் செய்திருக்க வேண்டும்; அவற்றைப் புறக்கணிக்கவும் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அருதா என்பது கடுமையான மணமும் கசப்புச் சுவையும் கொண்ட ஒரு மூலிகைச் செடி.
    reason: πήγανον (rue) என்ற தாவரம் நவீனத் தமிழ் வாசகர்களில் பலருக்கு அறிமுகமில்லாமல் இருக்கலாம்.
  - marker: b
    text: “கடவுளின் அன்பு” என்பது கடவுளிடம் காட்டும் அன்பையோ கடவுள் காட்டும் அன்பையோ குறிக்கக்கூடும்.
    reason: τοῦ θεοῦ என்ற கிரேக்க உரிமை வேற்றுமையின் இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: οὐαὶ
  choice: ஐயோ!
  rationale: தீர்ப்பை அறிவிக்கும் எச்சரிக்கை மற்றும் புலம்பல் ஆகிய இரு நிழல்களையும் கொண்ட வழக்கமான, வலுவான தமிழ் வடிவம்.
- source_word: ἀποδεκατοῦτε
  choice: பத்தில் ஒரு பங்கைக் கொடுக்கிறீர்கள்
  rationale: ‘தசமபாகம் செலுத்துகிறீர்கள்’ என்பதைக் காட்டிலும் சாதாரண வாசகர்களுக்குத் தெளிவாக, பத்தில் ஒரு பங்கு கொடுக்கும் நடைமுறையை நேரடியாகச் சொல்கிறது.
- source_word: ἡδύοσμον
  choice: புதினா
  rationale: mint என்பதற்கான பரவலாக அறியப்பட்ட நவீனத் தமிழ் பெயர்.
- source_word: πήγανον
  choice: அருதா
  rationale: rue செடிக்கான நிலைபெற்ற வேதாகமத் தமிழ் பெயர்; அறிமுகமில்லாத தாவரம் என்பதால் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: πᾶν λάχανον
  choice: எல்லா வகைத் தோட்டக் கீரைகள்
  rationale: λάχανον என்பது இங்கு தோட்டத்தில் வளர்க்கப்படும் உண்ணத்தக்க மூலிகை/கீரை வகைகளைச் சுட்டுகிறது; ‘எல்லா’ என்ற πᾶν-இன் விரிவையும் காக்கிறது.
- source_word: παρέρχεσθε
  choice: கடந்து சென்றுவிடுகிறீர்கள்
  rationale: ‘புறக்கணிக்கிறீர்கள்’ என்று உட்பொருளை மட்டும் வழங்காமல், கிரேக்கச் சொல்லின் ‘கடந்து செல்லுதல்’ உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: κρίσιν
  choice: நீதி
  rationale: இச்சூழலில் சரியான, நியாயமான நடத்தை என்ற பொருள் பொருந்துகிறது; ‘தீர்ப்பு’ என்ற மாற்றுப் பொருளை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: παρεῖναι
  choice: விட்டுவிடாமல் இருந்திருக்க வேண்டும்
  rationale: செய்யாமல் விடுதல் அல்லது கவனிக்காமல் போதல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ என்ற மரபுத்தொடரின் தொடர்பு
  choice: கடவுளின் அன்பு[b]
  alternative: கடவுளிடம் காட்ட வேண்டிய அன்பு / கடவுள் காட்டும் அன்பு
  rationale: கிரேக்க உரையில் τοῦ θεοῦ என்பது கடவுளிடத்திலான அன்பையோ கடவுளுடைய அன்பையோ இலக்கண ரீதியாகக் குறிக்கலாம். பிரதான உரை உரிமைத் தொடர்பை அப்படியே வைத்துக் கொண்டு, அடிக்குறிப்பு இரு சாத்தியங்களையும் வெளிப்படுத்துகிறது.
- issue: ταῦτα மற்றும் κἀκεῖνα எவற்றைக் குறிக்கின்றன
  choice: ‘இவற்றை’ என்பது நீதியையும் கடவுளின் அன்பையும்; ‘அவற்றை’ என்பது பத்தில் ஒரு பங்கு கொடுப்பதையும் குறிக்கும் வகையில் வரிசையைப் பேணுதல்
  alternative: குறிப்புப் பெயர்களுக்குப் பதிலாக அவற்றின் பொருளைத் தெளிவாக மீண்டும் சொல்லுதல்
  rationale: இயேசு முக்கிய கடமைகளை வலியுறுத்தியபோதும் சிறிய கடைப்பிடிப்புகளை முற்றிலும் நிராகரிக்கவில்லை என்ற உரையின் பதற்றத்தையும் சுட்டுப்பெயர் அமைப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் சொற்களுடன் கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘பத்தில் ஒரு பங்கு’ என்பது தொழில்நுட்பமான ‘தசமபாகம்’ என்பதற்குப் பதிலாகத் தெளிவை அளிக்கிறது; ‘கடந்து சென்றுவிடுகிறீர்கள்’ என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
