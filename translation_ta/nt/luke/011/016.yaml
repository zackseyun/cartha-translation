source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: ta
  text: வேறு சிலரோ, அவரைச் சோதித்துக்கொண்டே, வானத்திலிருந்து ஓர் அடையாளத்தை[a] அவரிடம் கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானத்துக்குரிய ஓர் அடையாளத்தை.’
    reason: ἐξ οὐρανοῦ என்ற சொற்றொடரை மூலத்தைக் குறிப்பதாகவோ, அடையாளத்தின் வானத்துக்குரிய தன்மையைக் குறிப்பதாகவோ தமிழில் வெளிப்படுத்தக்கூடிய மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἕτεροι
  choice: வேறு சிலர்
  rationale: முந்தைய வசனத்தில் பேசியவர்களிலிருந்து வேறுபட்ட இன்னொரு குழுவை ἕτεροι குறிக்கிறது; நவீன தமிழில் ‘வேறு சிலர்’ என்பது இயல்பாக இந்த வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: -ரோ
  rationale: δέ குறிக்கும் மென்மையான எதிர்மறைத் தொடர்பை ‘சிலரோ’ என்ற வடிவம் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πειράζοντες
  choice: அவரைச் சோதித்துக்கொண்டே
  rationale: எதிர்மறையான நோக்கத்துடன் இயேசுவைச் சோதித்த செயலை இது குறிக்கிறது. தொடர்ச்சியையும் முதன்மை வினையுடன் ஒரே நேரத்தில் நடந்ததையும் ‘சோதித்துக்கொண்டே’ வெளிப்படுத்துகிறது.
- source_word: σημεῖον
  choice: ஓர் அடையாளம்
  rationale: σημεῖον என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; ‘அற்புத அடையாளம்’ என்று விளக்கத்தை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: அடையாளம் வரும் மூலத்தை நேரடியாகக் குறிக்கும் கிரேக்கச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐζήτουν
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இங்கு ‘கேட்டல்/கோருதல்’ என்ற பொருள் சூழலுக்குப் பொருந்துகிறது; imperfect வினையின் தொடர்ச்சியான அல்லது மீண்டும் நிகழ்ந்த செயலை இந்தத் தமிழ் வடிவம் காட்டுகிறது.
- source_word: παρ’ αὐτοῦ
  choice: அவரிடம்
  rationale: அவர்கள் அடையாளத்தைக் கேட்ட நபர் இயேசு என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வானத்திலிருந்து’ என்பதுடன் மூலத்தைக் குறிக்கும் இரு சொற்றொடர்கள் மோதாமல் அமைகிறது.
theological_decisions:
- issue: கேட்கப்பட்ட அடையாளத்தின் தன்மை
  choice: வானத்திலிருந்து ஓர் அடையாளம்
  alternative: வானத்துக்குரிய ஓர் அடையாளம்
  rationale: அடையாளத்தின் மூலம் அல்லது அங்கீகாரம் வானத்திலிருந்து வரவேண்டும் என்ற கருத்தை முதன்மை மொழிபெயர்ப்பு நேரடியாகத் தக்கவைக்கிறது; அது எப்படிப்பட்ட அடையாளம் என்பதை மேலதிகமாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சோதித்துக்கொண்டே’ மற்றும் ‘கேட்டுக்கொண்டிருந்தார்கள்’ ஆகியவை செயல்களின் தொடர்ச்சியை வெளிப்படுத்துகின்றன; ‘அடையாளம்’ என்பது விளக்கத்தைச் சேர்க்காமல் மூலச்சொல்லின் திறந்த பொருளைப் பாதுகாக்கிறது.
