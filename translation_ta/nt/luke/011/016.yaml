  source_fidelity: மூலத்தின் ἕτεροι δέ என்பதிலுள்ள வேறுபடுத்தும் தொடர்பை “வேறு சிலரோ” நன்றாகக் காட்டுகிறது. πειράζοντες-ஐ “அவரைச் சோதித்துக்கொண்டே” என்பதும், ἐζήτουν-இன் தொடர்ச்சியான செயலை “கேட்டுக்கொண்டிருந்தார்கள்” என்பதும் போதுமான அளவு பிரதிபலிக்கின்றன. “வானத்திலிருந்து ஓர் அடையாளத்தை அவரிடம்” என்பது ἐξ οὐρανοῦ மற்றும் παρ’ αὐτοῦ ஆகிய இரு வேறுபட்ட தொடர்புகளையும் இயல்பான தமிழில் காக்கிறது.
