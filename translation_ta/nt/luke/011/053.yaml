  source_fidelity: முதல் தொடரில் உள்ள கால-இடத் தொடர்பு (Κἀκεῖθεν ἐξελθόντος αὐτοῦ), எழுத்தறிஞர்கள் மற்றும் பரிசேயர்களின் தீவிரமான எதிர்ப்பு, பல பொருள்களைப் பற்றிய உரையாடலைத் தூண்டும் செயல் ஆகியவை வரைவு மொழிபெயர்ப்பில் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ἀποστοματίζειν என்பதன் அரிதான, விவாதத்துக்குரிய பொருளை “பதில்களை வரவழைக்க” என மொழிபெயர்ப்பது, மூலத்தில் வெளிப்படையாக இல்லாத ‘பதில்கள்’ என்ற கூறைச் சேர்க்கிறது. “பேசவைக்க” என்பது மூலத்தின் திறந்த தன்மையைச் சிறப்பாகப் பாதுகாக்கிறது.
