lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: அவர் அங்கிருந்து வெளியேறியபின்
  rationale: கிரேக்க ஏகார்த்த வேற்றுமைத் தனிநிலைத் தொடரின் முன்னிகழ்வையும், ἐκεῖθεν என்பதன் இடச்சார்பையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் மோசேயின் சட்டத்தையும் வேதங்களையும் ஆராய்ந்து கற்பித்தவர்களைக் குறிக்கும் பணியைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் எழுத்துத் தொழிலாளர்கள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: வரலாற்று யூதக் குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: δεινῶς ἐνέχειν
  choice: அவரைக் கடுமையாக நெருக்கவும்
  rationale: எதிர்ப்புணர்வோடு தீவிர அழுத்தம் கொடுக்கும் கூட்டு அர்த்தத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀποστοματίζειν αὐτὸν
  choice: அவரிடமிருந்து பதில்களை வரவழைக்கவும்
  rationale: அரிதான இவ்வினைச்சொல், தாக்குதலான முறையில் ஒருவரைப் பேசவைத்து பதில்களை வெளிக்கொணரும் கருத்தைக் கொண்டுள்ளது. நோக்கத்தை மிகுதியாகத் தீர்மானிக்காமல் அதன் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: περὶ πλειόνων
  choice: பல காரியங்களைக் குறித்து
  rationale: ஒப்பீட்டு 'மேலும் பல' என்பதைக் காட்டிலும், பல்வேறு விஷயங்கள் அல்லது விவகாரங்கள் என்ற சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
