  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: ta
  text: அவர் அங்கிருந்து வெளியேறியபின், வேத அறிஞர்களும் பரிசேயர்களும் அவரைக் கடுமையாக நெருக்கவும், பல விஷயங்களைப் பற்றி அவரைப் பேசவைக்கவும்[a] தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை நெருக்கமாகக் கேள்வி கேட்கவும்,” அல்லது “முன்தயாரிப்பின்றி அவரைப் பேசவைக்கவும்.” இங்குள்ள கிரேக்க வினைச்சொல் அரிதானது; அவரிடமிருந்து பதில்களைத் தாக்குதலான முறையில் வெளிக்கொணர முயல்வதைக் குறிப்பதாகத் தெரிகிறது.
