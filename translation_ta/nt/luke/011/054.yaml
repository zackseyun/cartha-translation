  text: lying in wait for him[c][b][a], to catch something from his mouth.
translation:
  language: ta
  text: அவரைச் சிக்கவைக்கப் பதுங்கிக் காத்திருந்து[a], அவரது வாயிலிருந்து வரும் எதையாவது பிடித்துக்கொள்ள முயன்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு எதிராகப் பதுங்கியிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “அவரது வாயிலிருந்து எதையாவது பிடிக்க.” அதாவது, அவர் சொன்ன ஏதாவது ஒன்றைப் பற்றிக்கொண்டு அவரைச் சிக்கவைக்க.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: அவரைச் சிக்கவைக்கப் பதுங்கிக் காத்திருந்து
  rationale: இந்தப் பங்கேற்புவினை பகைமையான நோக்கத்துடன் பதுங்கிக் காத்திருப்பதைக் குறிக்கிறது. தமிழில் நோக்கம் தெளிவாகவும் இயல்பாகவும் இருக்க ‘சிக்கவைக்க’ சேர்க்கப்பட்டுள்ளது; ‘பதுங்கிக் காத்திருந்து’ மூலத்தின் உருவகத்தைக் காக்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இந்தப் பதிலிப்பெயர் இயேசுவைக் குறிக்கிறது. முந்தைய சூழலைச் சார்ந்த மூலத்தின் பதிலிப்பெயர் வடிவமே தமிழிலும் வைக்கப்பட்டுள்ளது.
- source_word: θηρεῦσαί
  choice: பிடித்துக்கொள்ள
  rationale: வேட்டையாடிப் பிடிப்பதை அடிப்படையாகக் கொண்ட இந்த வினை, இங்கு அவர் பேசுவதில் ஏதாவது ஒன்றைப் பற்றிக்கொண்டு அவரைச் சிக்கவைக்கும் நோக்கத்தைக் குறிக்கிறது. ‘பிடித்துக்கொள்ள’ அந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: τι
  choice: எதையாவது
  rationale: குறிப்பிடப்படாத ஏதோ ஒன்றை எதிர்பார்த்திருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: அவரது வாயிலிருந்து வரும்
  rationale: பேச்சைக் குறிக்கும் மூலத்தின் உடல்சார்ந்த உருவகமான ‘வாயிலிருந்து’ என்பதைக் காக்கிறது. தமிழ் வாக்கியம் இயல்பாக அமைய ‘வரும்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வேட்டையாடிப் பிடிக்கும் உருவகமும் ‘வாயிலிருந்து’ என்ற தெளிவான படிமமும் காக்கப்பட்டுள்ளன; அதேவேளை தமிழில் நோக்கமும் வாக்கியத் தொடர்பும் புரியும்படி குறைந்த அளவு வெளிப்படுத்தப்பட்டுள்ளது.
