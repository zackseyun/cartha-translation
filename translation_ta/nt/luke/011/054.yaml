  source_fidelity: மூலத்தின் ἐνεδρεύοντες (‘பதுங்கிக் காத்திருந்து’), αὐτόν (‘அவரை’), θηρεῦσαι (‘பிடித்துக்கொள்ள’), τι (‘எதையாவது’), ἐκ τοῦ στόματος αὐτοῦ (‘அவரது வாயிலிருந்து வரும்’) ஆகிய கூறுகள் பொருளோடும் உருவகத்தோடும் நன்றாகக் காக்கப்பட்டுள்ளன. ‘அவரைச் சிக்கவைக்க’ என்பது பதுங்கிக் காத்திருப்பின் பகைமையான நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; மூலத்துக்கு முரணான தகவலைச் சேர்ப்பதில்லை.
