  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: ta
  text: ஆகவே, உனக்குள் இருக்கும் வெளிச்சம் இருளாக இல்லாதபடி கவனித்துக்கொள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குள் இருக்கும் வெளிச்சம் இருளாக இல்லை என்பதை உறுதிசெய்துகொள்.”
    reason: σκόπει μή என்ற கிரேக்கத் தொடரை எச்சரிக்கையாகவும், ஒரு நிலை அப்படி இல்லை என்பதை உறுதிசெய்யும் கட்டளையாகவும் தமிழில் வெளிப்படுத்த முடியும்.
lexical_decisions:
- source_word: σκόπει
  choice: கவனித்துக்கொள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல் வடிவம் தொடர்ந்து விழிப்புடன் இருக்கும்படி எச்சரிக்கிறது. ‘கவனித்துக்கொள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் எச்சரிக்கையின் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கண், வெளிச்சம் ஆகியவற்றைப் பற்றிய போதனையிலிருந்து வரும் முடிவை இது குறிக்கிறது.
- source_word: μὴ
  choice: இல்லாதபடி
  rationale: ஏவலுடன் வரும் μή, விரும்பத்தகாத நிலை ஏற்படாதபடி எச்சரிக்கும் பொருளைத் தருகிறது.
- source_word: τὸ φῶς
  choice: வெளிச்சம்
  rationale: மூல உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; இதை அறிவு, மனச்சாட்சி அல்லது ஆன்மிக நிலை என்று குறுக்கிப் பொருள்கொள்ளவில்லை.
- source_word: τὸ ἐν σοὶ
  choice: உனக்குள் இருக்கும்
  rationale: இரண்டாம் நபர் ஒருமையையும் உள்ளார்ந்த இடத்தைக் குறிக்கும் சொல்லாட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σκότος
  choice: இருள்
  rationale: உடனுள்ள சூழலில் காணப்படும் வெளிச்சம்–இருள் முரணையும் அதன் விரிவான உருவக வலிமையையும் பாதுகாக்கிறது.
- source_word: ἐστίν
  choice: இருளாக
  rationale: இணைப்புவினையின் பொருளை தமிழ் வாக்கிய அமைப்பில் இயல்பாகக் கொண்டுவருகிறது; ‘ஆகிவிடுதல்’ என்ற மாற்றப் பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘வெளிச்சம்’ மற்றும் ‘இருள்’ என்பவற்றின் உருவகப் பொருள்
  choice: உருவகத்தை விளக்கிப் பொருள் குறுக்காமல் அப்படியே தக்கவைத்தல்
  alternative: ‘உனது புரிதல்’, ‘உன் மனச்சாட்சி’ அல்லது ‘உன் ஆன்மிக நிலை’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: இயேசுவின் கூற்று பார்வையையும் உள்ளார்ந்த நிலையையும் இணைக்கும் பரந்த உருவகமாக உள்ளது. குறிப்பிட்ட ஒரு கோட்பாட்டுப் பொருளைச் சேர்ப்பது கிரேக்க மூலத்தின் திட்டமிட்ட விரிவையும் பதற்றத்தையும் குறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலையைத் தக்கவைத்து, எளிமையான ஆனால் கண்ணியமான எச்சரிக்கை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வெளிச்சம்/இருள்’ என்ற பரிச்சயமான உருவக இணை மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளது.
