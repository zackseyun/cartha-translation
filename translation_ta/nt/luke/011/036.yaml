reference: Luke 11:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: ta
  text: ஆகவே, உன் உடல் முழுவதும் ஒளிமயமாக இருந்து, அதில் இருண்ட பகுதி எதுவும் இல்லாவிட்டால், அது முழுவதும் ஒளிமயமாக இருக்கும்; ஒரு விளக்கு தன் ஒளிவீச்சால்[a] உனக்கு ஒளி தருவதுபோல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘ஒரு விளக்கு தன் மின்னலால் உனக்கு ஒளி தருவதுபோல.’ கிரேக்கச் சொல் ‘மின்னல்’ அல்லது ‘ஒளிவீச்சு/பிரகாசம்’ என்பதைக் குறிக்கலாம்; இங்கு அது விளக்கின் ஒளிர்வைக் குறிப்பதாகத் தெரிகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: உடல்
  rationale: சொல்லின் நேரடிப் பொருளையும், கண்–விளக்கு–உடல் என்ற சூழமைவின் உருவகத்தையும் காக்கிறது; ‘உள்ளம்’ அல்லது ‘முழு மனிதன்’ என்று விளக்கிப் பொருளுரைக்கவில்லை.
- source_word: ὅλον
  choice: முழுவதும்
  rationale: இருமுறை வரும் முழுமையைக் குறிக்கும் வலியுறுத்தலை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: φωτεινόν
  choice: ஒளியுள்ளதாக
  rationale: ‘இருளாக’ என்பதுடன் உள்ள எதிர்மறை ஒப்புமையைத் தெளிவாகக் காட்டுகிறது; ‘பிரகாசமான’ என்பதைவிட ஒளி உருவகத்தை நேரடியாக வைத்திருக்கிறது.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: அதில் எந்தப் பகுதியும் இருளாக இல்லாமலும்
  rationale: எந்தப் பகுதியும் இருண்டதாக இல்லை என்ற பங்கேற்புச் சொற்றொடரின் பொருளை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: எளிய எதிர்காலப் பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ὡς ὅταν
  choice: …போல
  rationale: ஒப்புமையையும் நிகழும் சூழலையும் தமிழில் சீராக இணைக்கிறது.
- source_word: λύχνος
  choice: விளக்கு
  rationale: இது ஒளி என்ற அருவச் சொல்லையோ விளக்குத்தண்டையோ அல்ல, எடுத்துச் செல்லக்கூடிய விளக்கைக் குறிக்கிறது.
- source_word: τῇ ἀστραπῇ
  choice: தன் ஒளிவீச்சால்
  rationale: ἀστραπή என்பதன் ‘மின்னல்/ஒளிவீச்சு’ பொருள் வரம்பை மதித்து, விளக்கே எழுவாய் என்பதால் இங்கு அதன் பிரகாசமான ஒளிவீச்சைக் குறிக்கும் இயல்பான வாசிப்பைத் தேர்கிறது.
- source_word: φωτίζῃ σε
  choice: உனக்கு வெளிச்சம் தருவது
  rationale: σε என்ற தனிப்பட்ட பொருளைத் தக்கவைத்து, தமிழில் இயல்பாக ‘உனக்கு வெளிச்சம் தருகிறது’ என்று வழங்குகிறது.
theological_decisions:
- issue: ‘உடல்’ மற்றும் ‘ஒளி’ என்பவற்றின் உருவகப் பொருள்
  choice: உடல்–ஒளி உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘உள்ளார்ந்த வாழ்க்கை’, ‘ஆவிக்குரிய நிலை’ அல்லது ‘ஒழுக்க நிலை’ என்று விளக்கிப் பரவலாக்குதல்
  rationale: முந்தைய வசனத்தில் வரும் கண், விளக்கு, உடல் ஆகிய உருவகங்களுடன் இவ்வசனம் இணைந்துள்ளது. அதன் இறையியல் அழுத்தத்தை ஒரு குறிப்பிட்ட விளக்கமாகத் தீர்மானிக்காமல் மூல உருவகத்தையே மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நிபந்தனை வாக்கியத்தின் நீளத்தை வாசிக்கச் சீராக்கியபோதும், ‘உடல் முழுவதும்’, ‘எந்தப் பகுதியும்’, ‘விளக்கு’, ‘ஒளிவீச்சு’ ஆகிய மூலப் படிமங்கள் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு தொடர்புடைய ஒளிவீச்சு ஒப்புமைக்குப் பின் வைக்கப்பட்டுள்ளது.
