- from: 'இதனால்தான் கடவுளின் ஞானமும் கூறியது[a]: “நான் அவர்களிடம் இறைவாக்கினர்களையும் அப்போஸ்தலர்களையும் அனுப்புவேன். அவர்களில் சிலரை அவர்கள் கொன்றுபோடுவார்கள்; சிலரைத் துன்புறுத்துவார்கள்.”'
  to: 'இதன் காரணமாகக் கடவுளின் ஞானமும் கூறியது[a]: “நான் அவர்களிடம் இறைவாக்கினர்களையும் அப்போஸ்தலர்களையும் அனுப்புவேன். அவர்களில் சிலரைக் கொல்வார்கள், துன்புறுத்துவார்கள்.”'
  rationale: The revision retains the Greek’s causal-plus-additive opening and its deliberate ambiguity concerning “the wisdom of God.” It removes the repeated partitive object so that “some of them” naturally governs both future verbs, as in the source, and uses the more direct modern-standard verb “கொல்வார்கள்.” The footnote is recast to make its real function—the preservation of interpretive ambiguity—clear.
