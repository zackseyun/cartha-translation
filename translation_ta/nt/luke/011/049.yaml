  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: ta
  text: 'இதன் காரணமாகக் கடவுளின் ஞானமும் கூறியது[a]: “நான் அவர்களிடம் இறைவாக்கினர்களையும் அப்போஸ்தலர்களையும் அனுப்புவேன். அவர்களில் சிலரைக் கொல்வார்கள், துன்புறுத்துவார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய ஞானம்.” இத்தொடர் இறைஞானத்தின் ஆளுருவாக்கமாகவோ, கடவுளின் ஞானமிக்க தீர்மானத்தைக் குறிப்பதாகவோ, அல்லது இயேசு தம்மை மறைமுகமாகக் குறிப்பிடுவதாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய கண்டனத்திலிருந்து வரும் காரணவிளைவு மற்றும் முடிவுரைத் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -உம் (ஞானமும்)
  rationale: கிரேக்கச் சொல்லின் சேர்க்கை அல்லது வலியுறுத்தல் நுணுக்கத்தைத் தமிழின் இணைப்பும்மை இயல்பாகக் காட்டுகிறது.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: கடவுளின் ஞானம்
  rationale: இறைஞானத்தின் ஆளுருவாக்கம், கடவுளுடைய ஞானமான தீர்மானம், அல்லது இயேசுவின் மறைமுகத் தற்குறிப்பு ஆகிய சாத்தியங்களைத் தீர்மானிக்காமல் மூலத்தின் மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: εἶπεν
  choice: கூறியது
  rationale: எளிய இறந்தகால உரைவினையாகவும், ‘ஞானம்’ என்ற அஃறிணை எழுவாயுடன் இயல்பாகவும் அமைகிறது.
- source_word: Ἀποστελῶ
  choice: நான் … அனுப்புவேன்
  rationale: எதிர்காலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς αὐτούς
  choice: அவர்களிடம்
  rationale: அனுப்புதல் என்ற வினையுடன் இலக்கைச் சுட்டும் εἰς என்பதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: προφήτας
  choice: இறைவாக்கினர்கள்
  rationale: கடவுளிடமிருந்து செய்தியை உரைப்பவர்களைக் குறிக்கும் மரியாதையான, நவீனத் தமிழ் வேதாகமச் சொல்.
- source_word: ἀποστόλους
  choice: அப்போஸ்தலர்கள்
  rationale: லூக்கா–அப்போஸ்தலர் சூழலில் காணப்படும் அங்கீகரிக்கப்பட்ட பணிப்பெயரின் தொழில்நுட்ப நுணுக்கத்தைப் பாதுகாக்கிறது; பொதுவான ‘தூதர்கள்’ என்பதைவிடத் தெளிவானது.
- source_word: ἐξ αὐτῶν
  choice: அவர்களில் சிலரை
  rationale: அனுப்பப்படுகிற அனைவரும் ஒரே விதமாக நடத்தப்பட மாட்டார்கள் என்ற பகுதியுறவுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀποκτενοῦσιν
  choice: கொன்றுபோடுவார்கள்
  rationale: கொலைசெய்தல் என்ற நேரடியான பொருளை இயல்பான தமிழில் வலிமையாக வெளிப்படுத்துகிறது.
- source_word: διώξουσιν
  choice: துன்புறுத்துவார்கள்
  rationale: இச்சூழலில் நடுநிலையான பின்தொடர்தல் அல்ல, பகைமையோடு செய்யப்படும் துன்புறுத்தலே குறிக்கப்படுவதைக் காட்டுகிறது.
theological_decisions:
- issue: ‘கடவுளின் ஞானம்’ என்பதன் பொருள்
  choice: இயேசு, வேதவாக்கு, அல்லது தனியான ஆளுருவம் என்று வெளிப்படையாக அடையாளப்படுத்தாமல் ‘கடவுளின் ஞானம்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: இறைஞானத்தின் ஆளுருவாக்கம்; கடவுளுடைய ஞானமான தீர்மானம்; இயேசுவின் மறைமுகத் தற்குறிப்பு.
  rationale: சூழலில் இத்தொடரை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ள முடியும். மூலத்தின் இறையியல் இழுவிசையையும் உண்மையான தெளிவின்மையையும் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் இரு எதிர்கால வினைகளிலும் ‘அவர்கள்’ தெளிவாகத் தொடர்கிறது. பகுதியுறவான ἐξ αὐτῶν என்பதை இயல்பாக்க ‘சிலரை’ இரு வினைகளுக்கும் பகிர்ந்து புரிந்துகொள்ளும் வகையில் அமைக்காமல், தமிழில் தெளிவிற்காக இரண்டாவது வினைக்கு முன்பும் ‘சிலரை’ இடப்பட்டுள்ளது; இதனால் ஒரே நபர்களுக்கே இரு செயல்களும் நிகழும் என்ற தவறான வாசிப்பு தவிர்க்கப்படுகிறது.
