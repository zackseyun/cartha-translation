id: LUK.11.20
reference: Luke 11:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ta
  text: ஆனால் நான் கடவுளின் விரலால்[a] பேய்களை விரட்டுகிறேன் என்றால், கடவுளின் ராஜ்யம் உங்களிடம் வந்தடைந்துவிட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளின் விரலைக் கொண்டு’ என்றும் மொழிபெயர்க்கலாம். இது கடவுளின் நேரடியான வல்லமையைக் குறிக்கும் உருவகம்; யாத்திராகமம் 8:19-ஐ எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள்மேல் வந்துவிட்டது’ அல்லது ‘உங்களை வந்தடைந்துவிட்டது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: கடவுளின் விரலால்
  rationale: ἐν இங்கு செயல் நிகழும் கருவி அல்லது வல்லமையைக் குறிக்கிறது. இந்தத் தேர்வு கடவுளின் நேரடியான வல்லமையைக் காட்டும் உயிருள்ள உருவகத்தையும் யாத்திராகமம் 8:19-ன் எதிரொலியையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: ἐκβάλλω
  choice: விரட்டுகிறேன்
  rationale: பேய்களை ஒருவரிடமிருந்து வெளியேற்றுவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வினை; மூலத்தின் வலிமையையும் நிகழ்கால முதல் நபர் வடிவத்தையும் தக்கவைக்கிறது.
- source_word: τὰ δαιμόνια
  choice: பேய்களை
  rationale: δαιμόνια என்பதற்கான நேரடியான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் இணை. ‘அசுத்த ஆவிகள்’ என்பது கிரேக்கத்தில் வேறொரு சொற்றொடருக்குரியது என்பதால் தவிர்க்கப்பட்டது.
- source_word: ἄρα
  choice: என்றால்
  rationale: நிபந்தனையின் விளைவைத் தமிழில் இயல்பாக இணைக்கிறது; ‘அப்படியானால்’ என்ற தர்க்க வலிமை வாக்கிய அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: உங்களிடம் வந்தடைந்துவிட்டது
  rationale: ஏற்கெனவே தீர்மானமாக வந்து சேர்ந்திருப்பதைத் தெரிவிக்கிறது. ‘உங்கள்மேல் வந்துவிட்டது’ என்ற வடிவிலுள்ள சாத்தியமான எதிர்மறைத் தொனியைத் தவிர்த்தாலும், மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: βασιλεία-வின் அரசாட்சி மற்றும் ராஜ்யம் ஆகிய இரு பரிமாணங்களுக்கும் இடமளிக்கும், எளிய மற்றும் மரியாதையான தமிழ். ‘ஆட்சி’ என்று மட்டும் மொழிபெயர்த்து பொருளை முன்கூட்டியே சுருக்கவில்லை.
theological_decisions:
- issue: ‘கடவுளின் விரல்’ என்பதன் பொருள்
  choice: இயேசுவின் பேயோட்டும் செயல்களில் கடவுளின் நேரடியான வல்லமை அல்லது செயலாற்றலைக் குறிக்கும் உருவகம்; உருவகமாகவே வைக்கப்பட்டது.
  alternative: மத்தேயு 12:28 உடன் ஒப்பிட்டு இதைத் தூய ஆவியானவருக்கான நேரடிக் குறிப்பாக மொழிபெயர்த்தல்.
  rationale: லூக்காவின் தனித்த சொற்களையும் யாத்திராகமத்துடனான வேதாகம எதிரொலியையும் பாதுகாக்க வேண்டும்; விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தக் கூடாது.
- issue: ‘கடவுளுடைய அரசு உங்களிடம் வந்தடைந்துவிட்டது’ என்பதன் வலிமை
  choice: இயேசுவின் ஊழியத்தில் கடவுளுடைய அரசு நிகழ்காலத்திலேயே தீர்மானமாக வந்து சேர்ந்துள்ளது.
  alternative: அரசு முற்றிலும் எதிர்காலத்திற்குரியது; அல்லது இந்தச் சொற்றொடர் தண்டனைத் தொனி கொண்ட ‘உங்களை முந்திப்பிடித்துவிட்டது’ என்று மட்டும் பொருள்படும்.
  rationale: ἔφθασεν என்பது வந்தடைதலை நிறைவேறிய, தீர்மானமான நிகழ்வாகக் காட்டுகிறது. அதேவேளை ஒரு முழுமையான காலமுடிவுக் கோட்பாட்டை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. ‘கடவுளின் விரல்’ என்ற மூல உருவகமும், அரசின் நிகழ்கால வருகையும் விளக்கமாகக் கரைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
