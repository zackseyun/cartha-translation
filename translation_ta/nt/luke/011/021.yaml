source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: ta
  text: முழுமையாக ஆயுதம் ஏந்திய வலிமையானவன் தன் சொந்த முற்றத்தை[a] காவல்காக்கும்போது, அவனுடைய உடைமைகள் பாதுகாப்பாக இருக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் சொந்த அரண்மனையை’ அல்லது ‘தன் சொந்த வளாகத்தை’; கிரேக்கச் சொல் ஒரு முற்றத்தையோ, அதனுடன் சேர்ந்த குடியிருப்பு அல்லது வளாகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘அமைதியில் உள்ளன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: காவல்காக்கும்போது
  rationale: பொதுவான ஒரு கால/நிபந்தனைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘எப்போதெல்லாம்’ என்பதும் சாத்தியம், ஆனால் இங்கு ‘-ம்போது’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὁ ἰσχυρός
  choice: வலிமையானவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஆண்பால் ஒருமை அடைமொழியைத் தக்கவைத்து, ஒருவரைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: καθωπλισμένος
  choice: முழுமையாக ஆயுதம் ஏந்திய
  rationale: ஆயுதங்களுடன் முழுமையாக ஆயத்தமாயிருக்கும் நிலையைக் குறிக்கும் perfect participle-இன் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φυλάσσῃ
  choice: காவல்காக்கும்போது
  rationale: தொடர்ந்து கண்காணித்துப் பாதுகாக்கும் செயலைக் காட்டுகிறது; ὅταν உடன் வரும் வினை அமைப்பு தமிழில் காலவினையெச்சமாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: தன் சொந்த முற்றத்தை
  rationale: αὐλή என்பதன் நேரடியான ‘முற்றம்’ என்ற பொருளையும், ἑαυτοῦ தரும் தனக்கே உரியது என்ற வலியுறுத்தலையும் தக்கவைக்கிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: பாதுகாப்பாக இருக்கும்
  rationale: உடைமைகள் தொந்தரவின்றி பத்திரமாக இருப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் சூழற்பொருளை இயல்பான தமிழில் வழங்குகிறது; நேரடியான ‘அமைதியில்’ என்ற வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: அவனுடைய உடைமைகள்
  rationale: அவனுக்குச் சொந்தமான பொருட்கள் அல்லது சொத்துகள் அனைத்தையும் உள்ளடக்கும் தெளிவான நவீனத் தமிழ் சொற்றொடர்.
theological_decisions:
- issue: உவமையின் சூழல்சார் குறிப்பு
  choice: ‘வலிமையானவன்’ என்ற உருவகத்தை அப்படியே மொழிபெயர்த்து, இவ்வசனத்திலேயே அவனைச் சாத்தான் என்று வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: முதன்மை உரையிலேயே ‘சாத்தான்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இவ்வசனம் உருவகக் காட்சியையே முன்வைக்கிறது; அதன் குறிப்பு சுற்றியுள்ள வசனங்களிலிருந்து விளங்க வேண்டும். வெளிப்படையாக அடையாளப்படுத்துவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘முற்றம்’ என்ற நேரடி உருவகம் முதன்மை உரையில் வைக்கப்பட்டு அதன் சொற்பொருள் அகலம் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ἐν εἰρήνῃ என்பதன் இயல்பான சூழற்பொருள் உரையிலும் அதன் நேரடி வடிவம் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
