language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: ta
  text: 'ஆனால் அவர் அவர்களுடைய எண்ணங்களை அறிந்து, அவர்களிடம் கூறினார்: “தனக்கு எதிராகத் தானே பிளவுபடும் ஒவ்வொரு அரசும் பாழடைந்துவிடும்; ஒரு வீடு மற்றொரு வீட்டின்மேல் விழும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு குடும்பம் மற்றொரு குடும்பத்தின்மேல் விழும்.” கிரேக்கச் சொல்லான οἶκος என்பது கட்டடமான ‘வீடு’ என்பதையும் ‘குடும்பம்/வீட்டார்’ என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்து
  rationale: இது அவர்களுடைய உள்ளார்ந்த எண்ணங்களை அவர் அறிந்திருந்ததைச் சுட்டும் இறந்தகால வினையெச்சம்; முதன்மை வினையுடன் உள்ள தொடர்பையும் இயல்பாகப் பேணுகிறது.
- source_word: διανοήματα
  choice: எண்ணங்கள்
  rationale: மனத்தில் எழும் சிந்தனைகள் அல்லது ஆலோசனைகளைக் குறிக்கிறது; பகைமையான நோக்கத்தைத் தேவையின்றி சேர்க்காமல் பொதுவான பொருளைப் பேணுகிறது.
- source_word: Πᾶσα βασιλεία
  choice: ஒவ்வொரு அரசும்
  rationale: பொதுவான நியதியாகக் கூறப்படும் பகிர்ந்தளிக்கும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐφ’ ἑαυτὴν
  choice: தனக்கு எதிராகத் தானே
  rationale: உள்ளகப் பிரிவும் தன்னையே எதிர்க்கும் நிலையும் என்ற கிரேக்கச் சொற்றொடரின் வலிமையைப் பேணுகிறது.
- source_word: διαμερισθεῖσα
  choice: பிளவுபடும்
  rationale: அரசுக்குள் ஏற்படும் உட்பிரிவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐρημοῦται
  choice: பாழாக்கப்படும்
  rationale: அழிவுக்கும் பாழ்நிலைக்கும் உட்படுத்தப்படுதல் என்ற கடுமையான விளைவையும் செயப்பாட்டு வடிவையும் பேணுகிறது.
- source_word: οἶκος ἐπὶ οἶκον
  choice: ஒரு வீடு மற்றொரு வீட்டின்மேல்
  rationale: சுருக்கமான கிரேக்கக் காட்சியை நேரடியாகப் பேணி, οἶκος என்பதன் ‘வீடு’ மற்றும் ‘குடும்பம்/வீட்டார்’ ஆகிய சாத்தியங்களை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: πίπτει
  choice: விழும்
  rationale: பழமொழி போன்ற நிகழ்காலப் பொதுக் கூற்றையும் விழுதல் என்ற உருவகத்தையும் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: இரண்டாம் கூறிலுள்ள οἶκος என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வீடு’
  alternative: ‘குடும்பம்’ அல்லது ‘வீட்டார்’
  rationale: கிரேக்கச் சொல் கட்டடத்தையும் குடும்பம்/வீட்டாரையும் குறிக்க முடியும். சூழல் சமூகப் பிளவைக் குறிக்கக்கூடியதாக இருந்தாலும், முதன்மை உரையில் காட்சிப்படையான நேரடிப் பொருளை வைத்திருப்பது உண்மையான இருபொருள் வாய்ப்பைத் தீர்மானித்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் சுருக்கமான பழமொழித் தன்மையும் οἶκος என்பதன் இருபொருள் வாய்ப்பும் பேணப்பட்டுள்ளன.
