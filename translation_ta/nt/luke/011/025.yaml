  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: ta
  text: அது வந்து, வீடு பெருக்கப்பட்டு ஒழுங்குபடுத்தப்பட்டிருப்பதைக் காண்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெருக்கப்பட்டு அலங்கரிக்கப்பட்டிருப்பதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: அது வந்து
  rationale: ἔρχομαι என்பதன் இறந்தகால வினையெச்ச வடிவம்; முந்தைய வசனத்தில் திரும்பி வரும் அசுத்த ஆவியையே குறிக்கிறது. தமிழில் இயல்பாக வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: εὑρίσκει
  choice: காண்கிறது
  rationale: நிகழ்கால வினைச்சொல்லின் உயிரோட்டமான கதைநடையைப் பேணுகிறது. எழுவாய் அசுத்த ஆவி என்பதால் தமிழில் பாலைக் குறிப்பிடாத ‘அது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: σεσαρωμένον
  choice: பெருக்கப்பட்டு
  rationale: σαρόω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம்; வீடு பெருக்கப்பட்ட நிலையில் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது. மூலத்தில் தனியாக இல்லாத ‘சுத்தமாக’ என்ற கருத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: κεκοσμημένον
  choice: ஒழுங்குபடுத்தப்பட்டிருப்பதை
  rationale: κοσμέω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம். வீட்டுச் சூழலில் அலங்காரத்தை மட்டும் அல்லாமல் ஒழுங்காக அமைக்கப்பட்ட நிலையையும் குறிக்கக்கூடும்; ‘ஒழுங்குபடுத்தப்பட்டு’ இந்தச் சூழலுக்கு இயல்பானது, அதேவேளை ‘அலங்கரிக்கப்பட்டு’ என்ற சாத்தியம் அடிக்குறிப்பில் பேணப்படுகிறது.
theological_decisions:
- issue: விடப்பட்டுள்ள செயப்படுபொருளின் குறிப்பு
  choice: வீடு
  alternative: அது / அதனை
  rationale: கிரேக்கத்தில் செயப்படுபொருள் நேரடியாகத் திரும்பச் சொல்லப்படவில்லை; ஆனால் 24, 26ஆம் வசனங்களின் உடனடிச் சூழல் வீட்டையே தெளிவாகக் குறிக்கிறது. தமிழில் இரண்டு ‘அது’ வடிவங்கள் குழப்பம் உண்டாக்குவதால், மறைமுகமாக உள்ள குறிப்பை ‘வீடு’ என்று வெளிப்படுத்துவது பொருளைத் தீர்மானிப்பதல்ல, இயல்பாகத் தெளிவாக்குவதாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அசுத்த ஆவிக்கு மனிதப் பால் வழங்காமல் ‘அது’ எனக் குறிப்பிடப்பட்டுள்ளது; நிறைவுற்ற செயப்பாட்டு வடிவங்களின் விளைவுநிலை ‘ப்பட்டிருப்பதை’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
