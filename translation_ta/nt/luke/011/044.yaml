  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: ta
  text: உங்களுக்கு ஐயோ! ஏனெனில், நீங்கள் அடையாளம் தெரியாத கல்லறைகளைப் போல இருக்கிறீர்கள்; அவற்றின்மேல் நடக்கும் மனிதர்கள் அதை அறியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: உங்களுக்கு ஐயோ!
  rationale: தீர்ப்பையும் புலம்பலையும் ஒருங்கே வெளிப்படுத்தும் கிரேக்க எச்சரிக்கைச் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: μνημεῖα τὰ ἄδηλα
  choice: அடையாளம் தெரியாத கல்லறைகள்
  rationale: ἄδηλα என்பது கண்ணுக்குப் புலப்படாத அல்லது அடையாளம் காண முடியாத நிலையைக் குறிக்கிறது; சூழலில் குறியிடப்படாத கல்லறைகள் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: அவற்றின்மேல் நடக்கிற மனிதர்கள்
  rationale: ἄνθρωποι என்பதன் பொதுவான மனிதக் குறிப்பையும், கல்லறைகளின்மேல் நடப்பதையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: οὐκ οἴδασιν
  choice: அதை அறியாமல் இருக்கிறார்கள்
  rationale: அவர்கள் எதை அறியவில்லை என்பது மூலத்தில் மறைமுகமாக இருப்பதைத் தமிழிலும் அளவுக்கு மீறி விளக்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: அடையாளமற்ற கல்லறைகளின் சடங்கு அசுத்தப் பின்னணி
  choice: வசனத்தில் மறைமுகமாகவே விடப்பட்டது
  alternative: அவற்றை மிதிப்பதால் தாங்கள் அசுத்தமாவதை அறியவில்லை என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: யூதச் சுத்தச் சட்டப் பின்னணி உவமைக்கு முக்கியமானதாக இருந்தாலும், அந்த விளக்கம் கிரேக்க வசனத்தில் நேரடியாக இல்லை; ஆகவே மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க மற்றும் பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் கடுமையான தீர்ப்புத் தொனியும் உவமையின் மறைமுகத்தன்மையும் பேணப்பட்டுள்ளன.
