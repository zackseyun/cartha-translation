id: LUK.11.13
reference: Luke 11:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: ta
  text: ஆகவே, தீயவர்களாக இருந்தும் நீங்கள் உங்கள் பிள்ளைகளுக்கு நல்ல பரிசுகளைக் கொடுக்க அறிந்திருக்கிறீர்கள் என்றால், வானத்திலிருந்து வரும் தந்தை[a] தம்மிடம் கேட்பவர்களுக்குப் பரிசுத்த ஆவியை[b] எவ்வளவு அதிகமாகக் கொடுப்பார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகள் மத்தேயு 7:11-ஐ ஒட்டி, “உங்கள் பரலோகத் தந்தை” எனக் கூறுகின்றன. ஆனால் லூக்காவின் கிரேக்க உரை, “வானத்திலிருந்து வரும் தந்தை” என்று கூறுகிறது.
    reason: alternative_reading
  - marker: b
    text: மத்தேயு 7:11-ல் “நல்லவற்றை” என்று உள்ளது; இங்கு லூக்கா “பரிசுத்த ஆவியை” என்று கூறுகிறார். இவ்வாறு ஒவ்வொரு நற்செய்தி நூலின் தனித்த சொற்களும் பாதுகாக்கப்படுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: தீயவர்களாக இருந்தும்
  rationale: 'சூழலில் இச்சொற்றொடர் சலுகைப் பொருளைத் தருகிறது: மனிதர்கள் தீயவர்களாக இருந்தபோதிலும் நல்லவற்றைக் கொடுக்கிறார்கள். தமிழ் நடையில் இயல்பாகவும் மூலத்தின் அறநிலை மதிப்பீட்டைத் தணிக்காமலும் இதைத் தெரிவிக்கிறது.'
- source_word: οἴδατε … διδόναι
  choice: கொடுக்க அறிந்திருக்கிறீர்கள்
  rationale: வினையெச்சத்துடன் வரும் οἴδατε நடைமுறை அறிவையோ திறனையோ குறிக்கிறது. ‘கொடுக்க அறிந்திருக்கிறீர்கள்’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δόματα ἀγαθὰ
  choice: நல்ல பரிசுகள்
  rationale: δόματα என்பது பொதுவான ‘பொருட்கள்’ என்பதைக் காட்டிலும் குறிப்பாகக் கொடுக்கப்படும் பரிசுகளைக் குறிக்கிறது.
- source_word: τέκνοις ὑμῶν
  choice: உங்கள் பிள்ளைகளுக்கு
  rationale: குடும்பச் சூழலில் τέκνα என்பதற்கான இயல்பான நவீனத் தமிழ் சொல் ‘பிள்ளைகள்’.
- source_word: πόσῳ μᾶλλον
  choice: எவ்வளவு அதிகமாக
  rationale: குறைந்த நிலையிலிருந்து அதிக நிலைக்குச் செல்லும் இயேசுவின் வலியுறுத்தும் ஒப்பீட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து வரும் தந்தை
  rationale: மூலத்தில் ‘உங்கள்’ என்பது இல்லை; மேலும் ἐξ என்பது ‘வானத்தில் உள்ள’ என்பதைவிட ‘வானத்திலிருந்து’ எனப் பொருள்படும். சற்றே தனித்துவமான லூக்காவின் சொற்றொடரை மத்தேயுவோடு ஒத்திசைக்காமல் பாதுகாக்கிறது.
- source_word: πνεῦμα ἅγιον
  choice: தூய ஆவி
  rationale: இச்சூழலில் இது பொதுவான ஓர் ஆவியை அல்ல, கடவுளுடைய தூய ஆவியைக் குறிக்கிறது. தமிழில் ‘தூய ஆவி’ தெளிவும் இயல்பும் உடையது.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: தம்மிடம் கேட்பவர்களுக்கு
  rationale: αὐτόν என்ற வெளிப்படையான சுட்டுப்பெயரை ‘தம்மிடம்’ பாதுகாக்கிறது; நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பாக ‘கேட்பவர்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: πνεῦμα ἅγιον என்பதன் குறிப்பு
  choice: கடவுளுடைய தனிப்பட்ட தூய ஆவியைக் குறிக்கும் ‘தூய ஆவி’
  alternative: ‘ஒரு தூய ஆவி’ அல்லது பொதுவான ‘தூய ஆவி’ நிலை
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாவிட்டாலும், லூக்காவின் இச்சூழலில் தந்தை அளிக்கும் கொடை கடவுளுடைய ஆவியே. ‘ஒரு’ என்பதைச் சேர்ப்பது மூலத்தில் இல்லாத தெளிவின்மையை உருவாக்கும்.
- issue: மத்தேயு 7:11 உடனான தொடர்பு
  choice: லூக்காவின் தனித்த சொற்களான ‘வானத்திலிருந்து வரும் தந்தை’ மற்றும் ‘தூய ஆவி’ என்பவற்றைப் பாதுகாத்தல்
  alternative: ‘உங்கள் பரலோகத் தந்தை’ மற்றும் ‘நல்லவற்றை’ என்று மத்தேயுவோடு ஒத்திசைத்தல்
  rationale: மொழிபெயர்ப்பு லூக்காவின் கிரேக்க உரையைப் பின்பற்ற வேண்டும்; இணை வசனத்தின் சொற்களை இங்கு புகுத்தக் கூடாது.
translation_notes:
  register: நவீனப் பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீயவர்களாக இருந்தும்’ என்பது குற்றச்சாட்டின் வலிமையைத் தக்கவைக்கிறது; இறுதி வியப்புக்குறி கிரேக்கத்தின் வலியுறுத்தும் அளவுமிகு ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘வானத்திலிருந்து வரும் தந்தை’ என்பது வழக்கமான ‘பரலோகத் தந்தை’ என்பதைவிட சற்றே அசாதாரணமாக இருந்தாலும், லூக்காவின் ἐξ οὐρανοῦ என்ற தனித்த மூலச் சொல்லை நோக்கமுடன் பாதுகாக்கிறது.
