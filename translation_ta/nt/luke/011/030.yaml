id: LUK.11.30
reference: Luke 11:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: ta
  text: ஏனெனில், யோனா நினிவே மக்களுக்கு ஓர் அடையாளமாக அமைந்ததுபோலவே, மனிதமகனும் இந்தத் தலைமுறைக்கு ஓர் அடையாளமாக இருப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவ்வாறே மனிதமகனும் இந்தத் தலைமுறைக்கு இருப்பார்.” “இந்தத் தலைமுறைக்கு ஓர் அடையாளமாக இருப்பார்” என்ற பொருள் யோனாவுடனான ஒப்புமையால் உணர்த்தப்படுகிறது.'
    reason: இரண்டாம் பகுதியில் ‘அடையாளம்’ என்ற சொல் கிரேக்கத்தில் மீண்டும் வராமல், முதல் பகுதியிலிருந்து உணர்த்தப்படுகிறது.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: ஏனெனில், … போல
  rationale: γάρ தரும் விளக்கத் தொடர்பையும் καθώς தரும் ஒப்பீட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐγένετο
  choice: ஆனதுபோல
  rationale: யோனா வெறுமனே அடையாளமாக ‘இருந்தார்’ என்பதைக் காட்டிலும், அவர் அடையாளமாகச் செயல்படும் நிலைக்கு வந்தார் என்ற γίνομαι வினையின் நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: Ἰωνᾶς
  choice: யோனா
  rationale: தமிழில் வழக்கில் உள்ள பெயர்வடிவம்.
- source_word: τοῖς Νινευίταις
  choice: நினிவே மக்களுக்கு
  rationale: இடப்பெயரைச் சார்ந்த மக்களைத் தமிழில் இயல்பாகக் குறிக்கிறது; தொடர்பைக் காட்டும் கிரேக்க வேற்றுமையையும் ‘மக்களுக்கு’ எனப் பிரதிபலிக்கிறது.
- source_word: σημεῖον
  choice: ஓர் அடையாளம்
  rationale: வெளிப்படுத்தும் முக்கியத்துவமுள்ள ‘sign’ என்ற லூக்காவின் வழக்கமான பொருளைக் காக்கிறது.
- source_word: οὕτως … καὶ
  choice: … போல, … உம்
  rationale: இரு பகுதிகளுக்கிடையிலான ஒப்புமையையும் καί என்பதன் ‘மேலும்/அவரும்’ என்ற சேர்க்கை வலிமையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἔσται
  choice: இருப்பார்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை நேராக மொழிபெயர்க்கிறது; முதல் பகுதியில் இருந்து புரிந்துகொள்ளப்படும் ‘அடையாளமாக’ என்ற பயனிலையைச் சூழல் காரணமாக இணைக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதமகன்
  rationale: நற்செய்தி நூல்களில் பட்டப்பெயர்போலப் பயன்படும் சொற்றொடரின் நேர்ப்பொருளையும் இறையியல் எதிரொலியையும் விளக்கவுரையால் குறுக்காமல் காக்கிறது.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: இந்தத் தலைமுறைக்கு
  rationale: γενεά என்பதன் ‘தலைமுறை’ என்ற பொருளையும் இங்குள்ள தொடர்பு வேற்றுமையையும் காக்கிறது.
theological_decisions:
- issue: இரண்டாம் பகுதியில் வெளிப்படையாக இல்லாத பயனிலை
  choice: ‘மனிதமகனும் இந்தத் தலைமுறைக்கு ஓர் அடையாளமாக இருப்பார்’ என்று முதல் பகுதியிலிருந்து புரிந்துகொள்ளப்படும் ‘ஓர் அடையாளமாக’ என்பதை உரையில் வழங்குதல்
  alternative: ‘மனிதமகன் இந்தத் தலைமுறைக்கு இருப்பார்’ என்று சொற்சொல்லாக விடுதல்
  rationale: கிரேக்கத்தில் σημεῖον இரண்டாம் முறை வராவிட்டாலும், καθώς … οὕτως என்ற இணை ஒப்புமை அதைத் தெளிவாக உணர்த்துகிறது. தமிழில் அதை வழங்குவது பொருளைத் தெளிவாக்குகிறது; அடிக்குறிப்பு கிரேக்கத்தின் சுருக்கமான அமைப்பைப் பதிவு செய்கிறது.
- issue: ‘மனிதமகன்’ என்பதன் பொருள்
  choice: பட்டப்பெயரின் மரபான, நேரான வடிவமான ‘மனிதமகன்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘மனிதரானவர்’ போன்ற விளக்க மொழிபெயர்ப்பு
  rationale: இச்சொற்றொடரின் பட்டப்பெயர்த் தன்மையையும் மெசியா/வெளிப்பாட்டு நூல் சார்ந்த எதிரொலியையும் ஒரே விளக்கத்துக்குள் அடக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘நினிவேயர்’ என்ற அரிதான இனப்பெயருக்குப் பதிலாக இயல்பான ‘நினிவே மக்கள்’ பயன்படுத்தப்பட்டது; ‘மனிதமகன்’ என்ற பட்டப்பெயர் விளக்கமின்றித் தக்கவைக்கப்பட்டது.
