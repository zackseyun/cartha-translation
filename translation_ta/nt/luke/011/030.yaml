  to: ஏனெனில், யோனா நினிவே மக்களுக்கு ஓர் அடையாளமாக அமைந்ததுபோலவே, மனிதமகனும் இந்தத் தலைமுறைக்கு ஓர் அடையாளமாக இருப்பார்.[a]
