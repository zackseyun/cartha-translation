  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: ta
  text: “திருச்சட்ட அறிஞர்களே,[a] உங்களுக்கு ஐயோ! ஏனெனில், அறிவின் திறவுகோலை[b] நீங்கள் அகற்றிவிட்டீர்கள். நீங்களே உள்ளே நுழையவில்லை; நுழைந்துகொண்டிருந்தவர்களையும் தடுத்தீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, மோசேயின் திருச்சட்டத்தில் வல்லுநர்கள்; இன்றைய வழக்கறிஞர்கள் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அறிவுக்கான திறவுகோலை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: உங்களுக்கு ஐயோ
  rationale: தீர்க்கதரிசனக் கண்டனத்தையும் வரவிருக்கும் துயரைக் குறிக்கும் எச்சரிக்கைத் தொனியையும் தக்கவைக்கிறது.
- source_word: νομικοῖς
  choice: திருச்சட்ட அறிஞர்களே
  rationale: இன்றைய குடிமைச் சட்ட வழக்கறிஞர்களை அல்லாமல், யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்றவர்களைக் குறிக்கும் சொல்லாகத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἤρατε
  choice: அகற்றிவிட்டீர்கள்
  rationale: வெறுமனே எடுத்தல் என்பதைக் காட்டிலும், பிறருக்கான அணுகலை நீக்கிவிட்டார்கள் என்ற αἴρω வினையின் இங்குள்ள பொருளை வெளிப்படுத்துகிறது.
- source_word: κλεῖδα τῆς γνώσεως
  choice: அறிவின் திறவுகோல்
  rationale: கிரேக்க மொழியின் உருபுத் தொடர்பையும் திறவுகோல் உருவகத்தையும் நெருக்கமாகப் பாதுகாக்கிறது; இயல்பான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτοὶ
  choice: நீங்களே
  rationale: குற்றச்சாட்டிலுள்ள வலியுறுத்தலையும், அவர்கள் மற்றவர்களைத் தடுத்ததற்கு எதிரான முரண்பாட்டையும் காக்கிறது.
- source_word: οὐκ εἰσήλθατε
  choice: உள்ளே நுழையவில்லை
  rationale: எதற்குள் நுழைந்தார்கள் என்பதை விளக்கிச் சேர்க்காமல், மூலத்தின் நுழைவு உருவகத்தைத் தக்கவைக்கிறது.
- source_word: τοὺς εἰσερχομένους
  choice: நுழைந்துகொண்டிருந்தவர்களை
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் காட்டும் நிகழ்காலப் பெயரெச்சத்தின் முன்னேற்றத் தன்மையை வெளிப்படுத்துகிறது; ‘முயன்றவர்கள்’ என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: ἐκωλύσατε
  choice: தடுத்தீர்கள்
  rationale: அவர்கள் வழியை மறித்து இடையூறு செய்ததை இயல்பான தமிழில் கூறுகிறது; முடிவைத் தேவைக்கு அதிகமாகத் திட்டவட்டப்படுத்தவில்லை.
theological_decisions:
- issue: ‘உள்ளே நுழைதல்’ மற்றும் ‘அறிவின் திறவுகோல்’ என்ற உருவகங்களின் குறிப்பு
  choice: எதற்குள் நுழைவது என்பதை முதன்மை உரையில் குறிப்பிடாமல், அணுகல்/நுழைவு உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: தேவனுடைய அரசுக்குள் நுழைதல் என்று அல்லது தேவனைப் பற்றிய உண்மையான அறிவுக்குள் வருதல் என்று வெளிப்படையாக விளக்குதல்.
  rationale: உடனடி கிரேக்க உரை நுழைவதற்கான இடத்தையோ இலக்கையையோ பெயரிடவில்லை. ஆகவே இரட்சிப்பு அல்லது வெளிப்பாட்டைச் சார்ந்த ஒரு குறிப்பிட்ட விளக்கத்தை உரைக்குள் சேர்க்காமல், மூலத்திலுள்ள பொருள் நெருக்கடியும் மறைமுகத்தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘திருச்சட்டம்’ என்பது யூத மதச் சட்டச் சூழலைத் தெளிவுபடுத்துகிறது. ‘உங்களுக்கு ஐயோ’ என்ற சொற்றொடர் அன்றாடப் பேச்சை விட உயர்ந்த தீர்க்கதரிசனக் கண்டனத் தொனியை நோக்கத்துடன் தக்கவைக்கிறது.
