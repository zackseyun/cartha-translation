language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: ta
  text: “அசுத்த ஆவி ஒரு மனிதனைவிட்டு வெளியேறும்போது, அது ஓய்வைத் தேடி நீரற்ற இடங்கள்[a] வழியாகச் செல்கிறது. ஓய்வு எதுவும் கிடைக்காமல், ‘நான் வெளியேறிய என் வீட்டுக்குத் திரும்பிச் செல்வேன்’ என்று சொல்கிறது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வறண்ட இடங்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் சொல்லுக்குச் சொல் ‘நீரற்ற இடங்கள்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: வெளியேறும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைநிலை வினை ஒரு பொதுவான காலச் சூழலைக் குறிக்கிறது; தமிழில் ‘—ும்போது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: அசுத்த ஆவி
  rationale: நற்செய்தி நூல்களில் தனிப்பட்ட தீய ஆவியைக் குறிக்கும் வழக்கமான சொற்றொடர்; தூய்மையின்மை என்ற நுண்ணுணர்வையும் காக்கிறது.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ஒரு மனிதனைவிட்டு
  rationale: ἀνθρώπου என்பது பிரதிநிதித்துவமான ஒரு மனிதரைக் குறிக்கிறது. குறிப்பிட்ட ஒருவரைப் பற்றிய முன் குறிப்பு இல்லாததால் தமிழில் ‘ஒரு மனிதன்’ இயல்பானது.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: நீரற்ற இடங்கள் வழியாகச் செல்கிறது
  rationale: ἀνύδρων என்பதன் நேரடியான ‘நீரற்ற’ படிமத்தையும், διέρχεται என்பதன் ஓர் இடத்தின் வழியாக நகரும் பொருளையும் பாதுகாக்கிறது.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ஓய்வைத் தேடி
  rationale: நோக்கத்தையோ உடன்நிகழும் செயலைவோ குறிக்கும் பங்கேற்பு வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: καὶ μὴ εὑρίσκον
  choice: ஓய்வு கிடைக்காததால்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஓய்வே கிடைக்கவில்லை என்பதைத் தமிழில் தெளிவாக்கி, அடுத்த முடிவுக்கான தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: என் வீட்டுக்குத் திரும்பிச் செல்வேன்
  rationale: எதிர்காலத் தீர்மானத்தையும் ‘வீடு’ என்ற உருவகத்தையும் தெளிவாகக் காக்கிறது.
- source_word: ὅθεν ἐξῆλθον
  choice: நான் வெளியேறிய
  rationale: முந்தைய வெளியேற்றத்துடன் உள்ள சொல் தொடர்பைக் காத்து, தமிழில் இயல்பான தொடர்பெயர் அமைப்பைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: ‘அசுத்த ஆவி’ என்பதன் இயல்பு
  choice: பேசவும் வெளியேறவும் திரும்பவும் செய்கிற தனிப்பட்ட தீய ஆவியாக உரை வழங்கப்பட்டுள்ளது.
  alternative: ஒழுக்கச் சீர்கேட்டின் உருவகம் அல்லது ஆள்தன்மையற்ற சக்தி
  rationale: கிரேக்க உரை ஆவியைச் செயல்பட்டு பேசும் எழுவாயாக முன்வைக்கிறது; மொழிபெயர்ப்பு அதை வெறும் உருவகமாகக் குறுக்கவில்லை.
- issue: ἀνθρώπου என்பதன் பாலினம் மற்றும் பொதுப்பொருள்
  choice: ‘ஒரு மனிதன்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு ஆண்’ அல்லது ‘ஒருவர்’
  rationale: ἄνθρωπος பொதுவாக மனித நபரைக் குறிக்கும்; இங்கு குறிப்பாக ஆண் பாலினத்தை வலியுறுத்தும் ἀνήρ இல்லை. ‘மனிதன்’ மூலத்தின் பிரதிநிதித்துவ ஒருமையையும் தமிழின் இயல்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வீடு, வெளியேறுதல், திரும்புதல் ஆகிய படிமங்களும் நிகழ்கால விவரிப்பும் பாதுகாக்கப்பட்டுள்ளன.
