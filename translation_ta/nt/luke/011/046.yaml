source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: ta
  text: அதற்கு அவர், “திருச்சட்ட வல்லுநர்களாகிய உங்களுக்கும் ஐயோ![a] ஏனெனில், சுமக்கக் கடினமான சுமைகளை மக்கள்மேல் ஏற்றுகிறீர்கள்; ஆனால் நீங்களோ உங்கள் விரல்களில் ஒன்றால்கூட அந்தச் சுமைகளைத் தொடுவதில்லை.[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திருச்சட்ட வல்லுநர்கள்’ என்பது யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்ற நிபுணர்களைக் குறிக்கிறது; நவீன நீதிமன்ற வழக்கறிஞர்களை அல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்தச் சுமைகளின்மேல் ஒரு விரலைக்கூட வைப்பதில்லை.’ தாங்கள் பிறர்மேல் சுமத்துகிறவற்றில் உதவுவதற்கு அவர்கள் சிறிதும் முயலுவதில்லை என்பதை இந்தச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: திருச்சட்ட வல்லுநர்களாகிய
  rationale: இங்கு இந்தச் சொல் நவீன நீதிமன்ற வழக்கறிஞர்களைக் குறிக்காமல், யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்றவர்களைக் குறிக்கிறது. ‘திருச்சட்ட வல்லுநர்கள்’ என்பது அந்தச் சூழலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: οὐαί
  choice: ஐயோ!
  rationale: இது வெறும் வருத்தத்தை மட்டுமல்லாமல் தீர்ப்பை அறிவிக்கும் தீர்க்கதரிசனக் கண்டனத்தின் வலிமையையும் தக்கவைக்கிறது.
- source_word: φορτίζετε
  choice: ஏற்றுகிறீர்கள்
  rationale: மக்கள்மேல் சுமைகளை ஏற்றும் மூலமொழியின் உயிருள்ள உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἀνθρώπους
  choice: மக்கள்மேல்
  rationale: இது ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது; ‘மக்கள்’ நவீன தமிழில் இயல்பான பொதுப்பெயர்.
- source_word: φορτία δυσβάστακτα
  choice: சுமக்கக் கடினமான சுமைகளை
  rationale: ‘சுமைகள்’ என்ற உருவகத்தையும், அவை முற்றிலும் சுமக்க முடியாதவை என்று மிகைப்படுத்தாமல் ‘சுமக்கக் கடினமானவை’ என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: αὐτοὶ
  choice: நீங்களோ
  rationale: மக்களுக்கும் திருச்சட்ட வல்லுநர்களுக்கும் இடையிலான அழுத்தமான முரண்பாட்டைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: உங்கள் விரல்களில் ஒன்றால்கூட
  rationale: ஒரு விரலால் செய்யக்கூடிய மிகச் சிறிய முயற்சியைக்கூட அவர்கள் செய்வதில்லை என்ற அழுத்தத்தையும், மூலத்தின் பகுதிப்பொருள் அமைப்பையும் தக்கவைக்கிறது.
- source_word: οὐ προσψαύετε
  choice: தொடுவதில்லை
  rationale: ‘தொடுதல்’ என்ற நேரடியான உருவகத்தைப் பாதுகாக்கிறது; உதவ மறுப்பது என்ற உட்கருத்தை முதன்மை உரையில் விளக்கவுரையாக விரிவாக்கவில்லை.
- source_word: Καὶ ὑμῖν
  choice: உங்களுக்கும்
  rationale: முந்தைய கண்டனத்துடன் இன்னொரு குழுவும் சேர்க்கப்படுவதை ‘-க்கும்’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: νομικοῖς என்பவர்களின் அடையாளம்
  choice: யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்றவர்களைக் குறிக்கும் ‘திருச்சட்ட வல்லுநர்கள்’
  alternative: வழக்கறிஞர்கள்; சட்ட அறிஞர்கள்; மறைநூல் அறிஞர்கள்
  rationale: மூலச் சூழல் மோசேயின் திருச்சட்டத்தை விளக்கிய சமயச் சட்ட நிபுணர்களைக் குறிக்கிறது. ‘வழக்கறிஞர்கள்’ நவீன குடிமை அல்லது நீதிமன்றத் தொழிலைத் தவறாக நினைவூட்டலாம்; ‘மறைநூல் அறிஞர்கள்’ மூலச் சொல்லின் சட்டம்சார் கவனத்தை மங்கச் செய்யலாம்.
- issue: இறுதிக் கூற்றின் வலிமை
  choice: ‘உங்கள் விரல்களில் ஒன்றால்கூட அந்தச் சுமைகளைத் தொடுவதில்லை’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: அந்தச் சுமைகளில் உதவுவதற்கு நீங்கள் சிறிதும் முயல்வதில்லை
  rationale: மூலமொழி நேரடியான தொடுதல் உருவகத்தின் வழியாக அவர்களுடைய பாசாங்கையும் உதவ மறுப்பதையும் உணர்த்துகிறது. அதனை விளக்கவுரையாக மாற்றாமல், இயல்பான தமிழில் அதன் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகப் புரியும், அதேவேளையில் இயேசுவின் தீர்ப்புக் கூற்றுக்கேற்ற கண்ணியமும் வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது யூதச் சமயச் சட்டச் சூழலைத் தெளிவுபடுத்துகிறது; சுமை மற்றும் விரல் தொடர்பான மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
