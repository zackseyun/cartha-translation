id: LUK.11.11
reference: Luke 11:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: ta
  text: உங்களில் எந்தத் தந்தை, தன் மகன் மீன் கேட்டால், மீனுக்குப் பதிலாக அவனுக்குப் பாம்பைக் கொடுப்பார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: உங்களில் எந்தத் தந்தையாவது
  rationale: கேட்போரில் எந்தத் தந்தை இப்படிச் செய்வார் என்ற கிரேக்கச் சொல்லாட்சியின் வினாவலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αἰτήσει ὁ υἱὸς
  choice: தன் மகன் ... கேட்டால்
  rationale: கிரேக்கத்தில் எதிர்கால வினை இருந்தாலும், இது நிபந்தனைத் தன்மையுள்ள சொல்லாட்சிக் கேள்வி. ‘கேட்டால்’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது; ‘தன் மகன்’ தந்தை–மகன் உறவைத் தெளிவாக்குகிறது.
- source_word: ἰχθύν / ἰχθύος
  choice: மீன் / மீனுக்கு
  rationale: கிரேக்க ஒருமையையும் எடுத்துக்காட்டின் நேரடியான தன்மையையும் காக்கிறது.
- source_word: ἀντὶ
  choice: பதிலாக
  rationale: ஒன்றிற்குப் பதிலாக வேறொன்றைக் கொடுக்கும் மாற்றீட்டுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὄφιν
  choice: பாம்பு
  rationale: ὄφις என்பதற்கான இயல்பான, பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்; தேவையற்ற குறியீட்டு அல்லது இறையியல் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: αὐτῷ ἐπιδώσει
  choice: அவனுக்குக் ... கொடுப்பாரா
  rationale: கொடுப்பவர் தந்தை, பெறுபவர் மகன் என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; சொல்லாட்சிக் கேள்வியின் எதிர்கால நோக்கை ‘கொடுப்பாரா’ தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் சொல்லாட்சிக் கேள்வியும் மீன்–பாம்பு எதிர்மறை ஒப்புமையும் பாதுகாக்கப்பட்டுள்ளன.
