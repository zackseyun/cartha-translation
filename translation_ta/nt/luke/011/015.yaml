  naturalness: The sentence is fluent, clear modern standard Tamil. ‘பேய்களை விரட்டுகிறான்’ is natural in this exorcism context, and the quoted-speech structure is idiomatic.
  terminology: ‘பெயல்செபூல்’ consistently follows the Greek Beelzebul form, while the footnote appropriately records the traditional Beelzebub form. ‘பேய்களின் தலைவன்’ is a clear, non-speculative rendering of ἄρχων τῶν δαιμονίων.
