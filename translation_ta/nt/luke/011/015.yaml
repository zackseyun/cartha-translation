id: LUK.11.15
reference: Luke 11:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: ta
  text: ஆனால் அவர்களில் சிலர், “பேய்களின் தலைவனான பெயல்செபூல்[a] மூலமாக அவன் பேய்களை விரட்டுகிறான்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக இந்தப் பெயர் ‘பெயல்செபூப்’ என்றும் வழங்கப்படுகிறது; இங்கே கிரேக்க மூலத்தின் வடிவத்தைப் பின்பற்றி ‘பெயல்செபூல்’ என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: ஆனால் அவர்களில் சிலர்
  rationale: τινὲς என்பது குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கிறது; ἐξ αὐτῶν என்பதன் பகுதிப்பொருளை ‘அவர்களில்’ காக்கிறது. சூழலில் முந்தைய எதிர்வினைக்கு மாறான குற்றச்சாட்டை δὲ அறிமுகப்படுத்துவதால் ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἶπον
  choice: என்றார்கள்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த எளிய பேச்சுச் செயலை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: Ἐν Βεελζεβοὺλ
  choice: பெயல்செபூல் மூலமாக
  rationale: ஒரு நபருடன் வரும் ἐν இங்கு செயல் நடைபெறும் முகமை அல்லது வழிமுறையைக் குறிக்கிறது. ‘மூலமாக’ என்பது பெயல்செபூலின் முகமையால் பேய்கள் விரட்டப்படுகின்றன என்ற குற்றச்சாட்டைத் தெளிவாகக் காட்டுகிறது; கிரேக்கப் பெயரின் வடிவம் ‘பெயல்செபூல்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: பேய்களின் தலைவனான
  rationale: ἄρχων குறிக்கும் ஆளுகை மற்றும் மேலாதிக்கத்தை நவீன தமிழில் இயல்பாக ‘தலைவன்’ தெரிவிக்கிறது. இது பெயல்செபூலை விளக்கும் ஒத்திசைவு தொடராக அமைந்துள்ளது.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: பேய்களை விரட்டுகிறான்
  rationale: ἐκβάλλω என்பதன் வெளியேற்றும் பொருளையும் பேயோட்டும் சூழலையும் ‘விரட்டுகிறான்’ இயல்பாக வெளிப்படுத்துகிறது; δαιμόνια நேரடியாக ‘பேய்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: Βεελζεβούλ என்ற பெயரின் வடிவம்
  choice: பெயல்செபூல்
  alternative: பெயல்செபூப்
  rationale: முதன்மை உரையான கிரேக்கத்தில் Βεελζεβούλ இருப்பதால் அதற்கு நெருக்கமான ஒலிபெயர்ப்பு முதன்மை உரையில் தரப்பட்டுள்ளது. பாரம்பரியமாக அறியப்படும் மாற்று வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: ἄρχων என்பதன் அதிகாரப் பொருள்
  choice: பேய்களின் தலைவன்
  alternative: பேய்களின் ஆட்சியாளர்
  rationale: வசனம் பேய்கள்மேல் உள்ள மேலாதிக்கத்தைச் சொல்கிறது; பிற்கால பேயியல் அமைப்புகளைச் சேர்க்காமல், சாதாரண வாசகருக்கு இயல்பாகப் புரியும் ‘தலைவன்’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், பேச்சுவழக்காகத் தாழாமல் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘இவன்’ என்பது குற்றஞ்சாட்டுவோரின் சுட்டலை இயல்பாகப் பிரதிபலிக்கிறது; அவர்களின் கூற்றை மொழிபெயர்ப்பாளர் ஏற்றுக்கொள்வதாக மாற்றவில்லை.
