  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: ta
  text: 'ஆபேலின் இரத்தத்திலிருந்து, பலிபீடத்துக்கும் ஆலயத்துக்கும்[a] இடையே மாண்டுபோன சகரியாவின்[b] இரத்தம்வரை—ஆம், உங்களுக்குச் சொல்கிறேன்: அதற்காக இந்தத் தலைமுறையிடம் கணக்குக் கேட்கப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் சொல்லுக்குச் சொல் ‘இல்லம்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே குறிப்பிடப்படும் சகரியா யார் என்பது விவாதத்திற்குரியது. அவர் யோய்தாவின் மகன் சகரியாவாகவோ (2 நாளாகமம் 24:20–22), பெரகியாவின் மகன் சகரியாவாகவோ இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: ஆபேலின் இரத்தத்திலிருந்து … சகரியாவின் இரத்தம்வரை
  rationale: ἀπό … ἕως என்ற தொடக்கம்–முடிவு அமைப்பையும், இரத்தப்பழி மற்றும் கொலைக்கான நீதிக்கணக்கு என்ற வேதாகமச் சொல்லாட்சியையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τοῦ ἀπολομένου
  choice: மாண்டுபோன
  rationale: வன்முறையான மரணம் என்பதைச் சூழல் உணர்த்தினாலும், செய்பவரை வெளிப்படையாகச் சேர்க்காத கிரேக்க நடுநிலை வினையெச்சத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: பலிபீடத்துக்கும் ஆலயத்துக்கும் இடையே
  rationale: οἶκος என்பதன் சொல்லடிப் பொருள் ‘இல்லம்’ என்றாலும், இச்சூழலில் அது ஆலயக் கட்டிடத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. சொல்லடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ναί, λέγω ὑμῖν
  choice: ஆம், உங்களுக்குச் சொல்கிறேன்
  rationale: ναί என்பதன் வலியுறுத்தலையும் இயேசுவின் நேரடி, ஆணித்தரமான உரையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: அதற்காக இந்தத் தலைமுறையிடம் கணக்குக் கேட்கப்படும்
  rationale: தெய்வீக நீதியில் இரத்தப்பழிக்குப் பொறுப்புக் கோரப்படும் என்ற நீதித்துறைச் சார்ந்த பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்கத்தைப் போலவே கணக்குக் கேட்பவர் யார் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: சகரியா யார் என்பதும் இயேசுவின் குற்றச்சாட்டின் வரம்பும்
  choice: சகரியாவை முதன்மை உரையில் மேலும் அடையாளப்படுத்தாமல், ‘இந்தத் தலைமுறை’ என்பதையும் இயேசு உரையாற்றிய தலைமுறையாகவே திறந்த நிலையில் வைத்தல்
  alternative: யோய்தாவின் மகன் சகரியா; பெரகியாவின் மகன் சகரியா; அல்லது தீர்க்கதரிசிகளின் தியாக மரணத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருவர்
  rationale: கிரேக்க வசனம் சகரியா என்று மட்டுமே பெயரிடுகிறது. விவாதத்திற்குரிய வரலாற்று அடையாளத்தையோ, ‘இந்தத் தலைமுறை’ பற்றிய விரிவான இறையியல் அமைப்பையோ மொழிபெயர்ப்பு தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மாண்டுபோன’ என்பது செய்பவரைச் சேர்க்காமல் வன்முறை மரணத்தை உணர்த்துகிறது; ‘கணக்குக் கேட்கப்படும்’ என்பது மூலத்தின் நீதிக்கணக்குச் சார்ந்த செயலற்ற வினை அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
