  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: ta
  text: அறிவற்றவர்களே! வெளிப்புறத்தை உண்டாக்கியவரே உட்புறத்தையும் உண்டாக்கவில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியில் உள்ளதை … உள்ளே உள்ளதையும்.’ உடனடிச் சூழலில் இச்சொற்கள் பாத்திரத்தின் வெளிப்புறத்தையும் உட்புறத்தையும் குறிக்கலாம்; விரிவான பொருளில் மனிதரின் வெளிப்படையான வாழ்க்கையையும் உள்ளார்ந்த வாழ்க்கையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: அறிவற்றவர்களே
  rationale: பன்மை விளி வடிவில் வரும் நேரடியான கடிந்துரையைத் தெளிவாகவும் வலிமையாகவும் காட்டுகிறது; தேவையற்ற இழிவுச் சாயலைச் சேர்க்கவில்லை.
- source_word: οὐχ ... ἐποίησεν;
  choice: உண்டாக்கவில்லையா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ ποιήσας
  choice: உண்டாக்கியவரே
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்பு வடிவையும், மறைமுகமான தனிப்பட்ட குறிப்பையும் காக்கிறது; மூலத்தில் இல்லாத ‘கடவுள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: τὸ ἔξωθεν
  choice: வெளியே இருப்பதை
  rationale: உடனடிச் சூழலில் பாத்திரத்தின் வெளிப்புறத்தையும், விரிவாக மனிதரின் வெளிப்படையான வாழ்க்கையையும் குறிக்கக்கூடிய பரப்பைத் தக்கவைக்கிறது.
- source_word: τὸ ἔσωθεν
  choice: உள்ளே இருப்பதையும்
  rationale: வெளி–உள் இணைப்பைத் தெளிவாக வைத்தபடி, பாத்திரத்தின் உட்புறத்தையும் மனிதரின் உள்ளார்ந்த வாழ்க்கையையும் குறிக்கும் இரட்டைச் சாத்தியத்தைப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: -யும்
  rationale: வெளியே இருப்பதை உண்டாக்கியவர் உள்ளே இருப்பதையும் உண்டாக்கினார் என்ற ‘also’ பொருளை இயல்பான தமிழ் இணைப்பும்மையால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உண்டாக்கியவர்’ என்பவரின் குறிப்பு
  choice: படைப்பாளராகிய கடவுளைக் குறிக்கும் மறைமுகக் குறிப்பை வெளிப்படையாக ‘கடவுள்’ என்று சேர்க்காமல் வைத்தல்
  alternative: இதைப் பாத்திரத்தைச் செய்தவரை மட்டும் குறிக்கும் உடனடிக் குறிப்பாக எடுத்தல்
  rationale: வாக்கியம் கோப்பை/பாத்திர உருவகத்திலும், வெளி மற்றும் உள் இரண்டையும் படைத்த கடவுளைப் பற்றிய விரிந்த உண்மையிலும் செயல்பட முடியும். கிரேக்கத்தில் இல்லாத பெயரைச் சேர்க்காமல் இரு அடுக்குகளையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் கூர்மையான கடிந்துரையைத் தணிக்காமலும் அமைக்கப்பட்டது. ‘வெளியே இருப்பது/உள்ளே இருப்பது’ என்பது இயல்பான பேச்சு வழக்குக்கும் கண்ணியமான எழுத்து நடைக்கும் இடைப்பட்ட தெளிவான வடிவாகத் தேர்ந்தெடுக்கப்பட்டது.
