source:
  edition: SBLGNT
  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: ta
  text: ஏனெனில், என் நண்பர் ஒருவர் பயணத்திலிருந்து[a] என்னிடம் வந்திருக்கிறார்; அவருக்கு முன் வைப்பதற்கு என்னிடம் எதுவும் இல்லை.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, ‘சாலையிலிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: ஏனெனில்
  rationale: உவமையில் வேண்டுகோளுக்கான காரணத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: φίλος μου
  choice: என் நண்பர் ஒருவர்
  rationale: குறிப்பிட்ட சுட்டுப்பெயர் இல்லாத φίλος என்பதன் வரையறுக்கப்படாத தன்மையையும் μου என்பதன் உடைமைத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρεγένετο
  choice: வந்திருக்கிறார்
  rationale: நண்பர் வந்து இப்போது அங்கே இருப்பதால் ஏற்பட்டுள்ள தற்போதைய நிலையைத் தமிழின் நிறைவுநிலை வடிவில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξ ὁδοῦ
  choice: பயணத்திலிருந்து
  rationale: சொல்லுக்கு சொல் ‘சாலையிலிருந்து’ என்றாலும், இச்சூழலில் பயணம் செய்து வந்ததைக் குறிக்கும் மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πρός με
  choice: என்னிடம்
  rationale: பேசுகிறவரை நோக்கிய வருகையைச் சுருக்கமாகத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வீடு’ அல்லது ‘சந்திக்க’ என்ற கருத்துகளைச் சேர்க்கவில்லை.
- source_word: οὐκ ἔχω
  choice: என்னிடம் எதுவும் இல்லை
  rationale: உடைமையின்மையைத் தெளிவான, இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὃ παραθήσω αὐτῷ
  choice: அவருக்கு முன் வைப்பதற்கு
  rationale: விருந்தோம்பல் சூழலில் உணவை ஒருவர்முன் வைக்கும் படிமத்தைப் பாதுகாக்கிறது; ‘பரிமாற’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
