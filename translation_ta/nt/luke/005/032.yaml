  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: ta
  text: நீதிமான்களை அழைக்க அல்ல, பாவிகளை மனந்திரும்புதலுக்கு[a] அழைக்க நான் வந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனமாற்றத்திற்கு.” கிரேக்கத் தொடர் நோக்கம் அல்லது இலக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: நான் வந்திருக்கிறேன்
  rationale: ἔρχομαι என்பதன் நிறைவேற்ற நிகழ்கால வடிவம், வந்து இப்போது இருப்பதையும் பணியின் நோக்கத்தையும் உணர்த்துகிறது; ‘வந்திருக்கிறேன்’ அந்த அம்சத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: καλέσαι
  choice: அழைக்கவே
  rationale: வினையெச்சம் வருகையின் நோக்கத்தைக் குறிக்கிறது. ‘அழைக்க’ என்பது அழைப்பு மற்றும் அதிகாரபூர்வமான கூப்பிடுதல் ஆகிய இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல் தக்கவைக்கிறது; ‘வே’ நோக்கத்தின் வலியுறுத்தலை இயல்பாக்குகிறது.
- source_word: δικαίους
  choice: நீதிமான்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை பெயரடை. ‘நீதிமான்கள்’ என்பது ஒழுக்க மற்றும் சமய வகைப்பாட்டை, அவர்கள் உண்மையில் நீதிமான்களா அல்லது அவ்வாறு கருதப்படுகிறார்களா என்று தீர்மானிக்காமல் காக்கிறது.
- source_word: ἁμαρτωλοὺς
  choice: பாவிகளை
  rationale: பாவிகளாக வகைப்படுத்தப்படும் மக்களைக் குறிக்கும் நிலையான, தெளிவான தமிழ் சொல்; இதன் சமூக மற்றும் ஒழுக்க வலிமையைத் தக்கவைக்கிறது.
- source_word: εἰς μετάνοιαν
  choice: மனந்திரும்புதலுக்கு
  rationale: εἰς உடன் வரும் μετάνοια, அழைப்பின் நோக்கம் அல்லது இலக்கைக் குறிக்கிறது. ‘மனந்திரும்புதல்’ என்பது வெறும் கருத்துமாற்றத்தைவிட ஒழுக்க மற்றும் ஆவிக்குரிய திருப்பத்தையும் இயல்பாக வெளிப்படுத்துகிறது; பெயர்ச்சொல் அமைப்பும் காக்கப்படுகிறது.
theological_decisions:
- issue: இயேசு உண்மையிலேயே நீதிமான்கள் இருப்பதை மறுக்கிறாரா, அல்லது சமூகத்தில் நீதிமான்களாகக் கருதப்படுபவர்களைச் சொல்கிறாரா?
  choice: ‘நீதிமான்கள்’ மற்றும் ‘பாவிகள்’ என்ற நேரடியான வகைப்பாடுகளை விளக்கச் சேர்க்கையின்றித் தக்கவைத்தல்.
  alternative: ‘தங்களை நீதிமான்கள் என்று நினைப்பவர்கள்’ அல்லது ‘நீதிமான்களாகக் கருதப்படுபவர்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: இந்த வசனத்தில் இகழ்ச்சியையோ தோற்றநிலையையோ வெளிப்படையாகக் குறிக்கும் சொற்கள் இல்லை. விளக்கச் சொற்களைச் சேர்ப்பது பரந்த சூழலிலிருந்து ஒரு முடிவை உரைக்குள் கொண்டுவரும்; நேரடி மொழிபெயர்ப்பு இறையியல் இழுபறியைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘நீதிமான்கள்,’ ‘பாவிகள்,’ ‘மனந்திரும்புதல்’ ஆகிய பரவலாக அறியப்பட்ட சமயச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வாக்கியம் சாதாரண வாசகருக்கும் இயல்பாக இருக்கும்படி அமைக்கப்பட்டுள்ளது.
