id: LUK.5.23
reference: Luke 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: ta
  text: '“எது எளிது: ‘உன் பாவங்கள் மன்னிக்கப்பட்டுள்ளன’[a] என்று சொல்வதா, அல்லது ‘எழுந்து நட’ என்று சொல்வதா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பாவங்கள் மன்னிக்கப்பட்டன.”
    reason: கிரேக்க நிறைவு வடிவத்தைத் தமிழில் நிகழ்வின் நிறைவாகவும் மொழிபெயர்க்க இயலும் என்பதைப் பதிவு செய்யும் காலவினை மாற்று.
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: எது எளிது
  rationale: இரண்டு கூற்றுகளில் ஒப்பீட்டளவில் எது எளிது என்று கேட்கும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: εἰπεῖν
  choice: என்று சொல்வதா
  rationale: இரண்டு மாற்றுக் கூற்றுகளின் உள்ளடக்கத்தையும் அறிமுகப்படுத்தும் வினையெச்சத்தின் செயல்பாட்டை இயல்பான தமிழ் வினாவாக வெளிப்படுத்துகிறது.
- source_word: Ἀφέωνταί
  choice: மன்னிக்கப்பட்டுள்ளன
  rationale: பாவமன்னிப்பைக் குறிக்கும் வினையின் நிறைவு பெற்ற செயலால் தொடரும் தற்போதைய நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது; செய்பவர் யார் என்பதைச் சேர்க்காமல் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: σοι … αἱ ἁμαρτίαι σου
  choice: உன் பாவங்கள்
  rationale: ஒரே நபரை நேரடியாக ஒருமையில் அழைக்கும் சூழலையும் உடைமைத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: இரண்டு மாற்றுக் கூற்றுகளுக்கிடையிலான தெளிவான வேறுபாட்டைக் குறிக்கிறது.
- source_word: Ἔγειρε
  choice: எழுந்து
  rationale: அந்த மனிதன் உடனே எழ வேண்டும் என்ற கட்டளையைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: καὶ περιπάτει
  choice: நட
  rationale: இங்கு உருவக நடத்தை அல்ல, உடலால் நடப்பதையே குறிக்கிறது; ‘எழுந்து நட’ என்பது இயல்பான தமிழ் கட்டளைத் தொடர்.
theological_decisions:
- issue: நிறைவு வடிவிலும் செயப்பாட்டு வடிவிலும் உள்ள பாவமன்னிப்புக் கூற்றைத் தேவையற்ற கோட்பாட்டு விளக்கமின்றி மொழிபெயர்த்தல்
  choice: உன் பாவங்கள் மன்னிக்கப்பட்டுள்ளன
  alternative: உன் பாவங்கள் மன்னிக்கப்பட்டன
  rationale: ‘மன்னிக்கப்பட்டுள்ளன’ என்பது நிறைவு பெற்ற செயலின் விளைவாக நீடிக்கும் நிலையைத் தெரிவிக்கிறது. அதே நேரத்தில், மன்னிப்பைச் செய்பவர் யார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்காததால், மூலத்தின் செயப்பாட்டு வடிவமும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி பேச்சு நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்து நட’ என்ற சுருக்கமான கட்டளை மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
