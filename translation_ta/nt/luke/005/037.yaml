  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: ta
  text: புதிய திராட்சரசத்தை யாரும் பழைய தோல் பைகளில்[a] வைப்பதில்லை. அப்படி வைத்தால், புதிய திராட்சரசம் அந்தத் தோல் பைகளைக் கிழித்துவிடும்; அதுவும் சிந்திவிடும்[b], தோல் பைகளும் பாழாகிவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘பழைய தோல்களில்.’ கிரேக்கச் சொல் திராட்சரசம் போன்ற திரவங்களை வைக்கப் பயன்படுத்தப்பட்ட தோல் கொள்கலன்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெளியே ஊற்றப்படும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: வைப்பதில்லை
  rationale: பொதுவாக ஒன்றை மற்றொன்றுக்குள் இடுவதைக் குறிக்கும் வினை. ‘ஊற்றுவதில்லை’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும், மூலச்சொல்லைவிட விளக்கமானது; ‘வைப்பதில்லை’ அதன் பொதுவான பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: οἶνον νέον
  choice: புதிய திராட்சரசம்
  rationale: οἶνος என்பதைக் குழப்பமின்றி குறிக்க ‘திராட்சரசம்’ என்றும், νέος என்பதைக் ‘புதிய’ என்றும் மொழிபெயர்த்துள்ளது; புளிப்பு நடைபெறும் சூழலையும் இது இயல்பாகத் தாங்குகிறது.
- source_word: ἀσκοὺς παλαιούς
  choice: பழைய தோல் பைகள்
  rationale: ἀσκός என்பது திரவங்களை, குறிப்பாகத் திராட்சரசத்தை, வைத்த தோலால் செய்யப்பட்ட பையைக் குறிக்கிறது. ‘தோல் பைகள்’ என்பது நவீன வாசகருக்குத் தெளிவானதும் மூலத்தின் பொருளுக்கு நெருக்கமானதும் ஆகும்.
- source_word: εἰ δὲ μήγε
  choice: அப்படி வைத்தால்
  rationale: முந்தைய மறுப்புக்கு மாறாக அந்தச் செயலைச் செய்தால் ஏற்படும் விளைவை இந்த நிபந்தனைச் சொற்றொடர் அறிமுகப்படுத்துகிறது. தமிழில் காரணத் தொடர்பை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ῥήξει
  choice: கிழித்துவிடும்
  rationale: புதிய திராட்சரசம் தோல் பைகளைப் பிளந்து சேதப்படுத்துவதைச் சூழலுக்கு ஏற்ற தமிழில் வெளிப்படுத்துகிறது. ‘வெடிக்கச் செய்யும்’ என்பதும் சாத்தியம்; ஆனால் தோல் கொள்கலன் கிழிவதை இது நேரடியாகச் சொல்கிறது.
- source_word: ἐκχυθήσεται
  choice: சிந்திப்போகும்
  rationale: கிழிந்த பைகளிலிருந்து திராட்சரசம் வெளியேறி வீணாவதை இயல்பான தமிழில் குறிக்கிறது; மூலத்தின் இறப்புவினை வடிவத்தையும் விளைவையும் காக்கிறது.
- source_word: ἀπολοῦνται
  choice: பாழாகிவிடும்
  rationale: தோல் பைகள் அழிந்து பயன்படாதவையாகிவிடும் பொருளைத் தருகிறது. ‘அழிந்துபோகும்’ என்பதைக் காட்டிலும் கொள்கலன்களின் பயன்பாட்டு இழப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ αὐτός
  choice: திராட்சரசமும்
  rationale: αὐτός புதிய திராட்சரசத்தையே சுட்டுகிறது. தமிழில் பெயர்ச்சொல்லை மீண்டும் கூறுவது சுட்டுப்பெயர் குழப்பத்தைத் தவிர்த்து, ‘அதுவும்’ என்ற வலியுறுத்தலை ‘-உம்’ மூலம் காக்கிறது.
- source_word: οὐδεὶς
  choice: யாரும் ... இல்லை
  rationale: முழுமையான மறுப்பைத் தரும் இயல்பான நவீனத் தமிழ் அமைப்பு; பழமொழித் தன்மையையும் காக்கிறது.
