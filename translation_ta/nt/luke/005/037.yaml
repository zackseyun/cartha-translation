  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான பழமொழி நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘துருத்தி’ போன்ற இலக்கிய அல்லது பழைய சொல்லுக்குப் பதிலாக ‘தோல் பைகள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ἐκχυθήσεται என்பதற்கே பொருந்தாத ‘அழிந்துபோகும்’ என்ற மாற்றுப்பொருள் சேர்க்கப்படவில்லை; அந்தப் பொருள் அடுத்துள்ள ἀπολοῦνται என்பதற்குரியது.
