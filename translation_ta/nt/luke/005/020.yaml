  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: ta
  text: அவர்களுடைய விசுவாசத்தைக்[a] கண்டு அவர், “மனிதனே, உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பிக்கையைக்’. கிரேக்கச் சொல் விசுவாசம் அல்லது நம்பிக்கை என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மன்னிக்கப்பட்டுள்ளன’. கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவம், நிறைவேற்றப்பட்ட செயலால் உண்டான தற்போதைய நிலையை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: கண்டு
  rationale: இறந்தகால வினையெச்சம், இயேசு அவர்களுடைய விசுவாசத்தைக் கண்டதற்கும் அவர் கூறியதற்கும் உள்ள இயல்பான தொடர்பைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இங்கு செயலால் வெளிப்பட்ட நம்பிக்கை அல்லது சார்ந்திருத்தலைக் குறிக்கிறது. ‘விசுவாசம்’ என்பது பொருளைத் தளர்த்தாமல் கிறிஸ்தவச் சூழலில் இயல்பாகப் புரியும் நிலையான சொல்.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: கிரேக்க மூலத்தின் பன்மையைப் பாதுகாக்கிறது; அது முடக்குவாதமுற்ற மனிதனை மட்டும் குறிக்கிறதா அல்லது அவரையும் சுமந்து வந்தவர்களையும் சேர்த்துக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: Ἄνθρωπε
  choice: மனிதனே
  rationale: ஆண்பாலைக் குறிக்கும் நேரடி விளிவடிவத்தைப் பாதுகாக்கிறது. ‘நண்பனே’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத நெருக்கம் சேர்க்கப்படும்.
- source_word: ἀφέωνταί
  choice: மன்னிக்கப்பட்டிருக்கின்றன
  rationale: நிறைவேற்றப்பட்ட செயலின் விளைவாகத் தற்போது நிலவும் மன்னிப்பு நிலையைக் கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவத்திற்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἁμαρτίαι
  choice: பாவங்கள்
  rationale: ஒழுக்க மற்றும் இறையியல் பொருளை நேரடியாகப் பாதுகாக்கும் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: σοι ... σου
  choice: உன் பாவங்கள்
  rationale: சொந்தத்தைக் குறிக்கும் σου தெளிவாக மொழிபெயர்க்கப்படுகிறது; மன்னிப்பைப் பெறுபவரைக் குறிக்கும் σοι, நேரடி அழைப்பிலும் ‘உன்’ என்பதிலும் தமிழில் இயல்பாக உள்ளடங்குகிறது.
theological_decisions:
- issue: ‘அவர்களுடைய விசுவாசம்’ என்பதன் வரம்பு
  choice: பன்மை அப்படியே பாதுகாக்கப்படுகிறது; அது முடக்குவாதமுற்ற மனிதனையும் அவரைக் கொண்டுவந்தவர்களையும் எவ்வாறு உள்ளடக்குகிறது என்பது தீர்மானிக்கப்படவில்லை.
  alternative: அவரைச் சுமந்து வந்தவர்களின் விசுவாசம் மட்டும்; அல்லது அந்த மனிதனும் அவனுடைய தோழர்களும் பகிர்ந்த விசுவாசம்.
  rationale: αὐτῶν என்பது பன்மை. அதன் சரியான குறிப்பைச் சுருக்கி விளக்குவது மூலத்தில் உள்ள கதை மற்றும் இறையியல் அழுத்தத்தைத் தேவையின்றி தீர்த்துவிடும்.
- issue: மன்னிப்பு அறிவிப்பின் காலமும் வலிமையும்
  choice: ‘மன்னிக்கப்பட்டிருக்கின்றன’ என்பது நிறைவேற்றப்பட்ட செயலால் தற்போது நிலவும் நிலையை அறிவிக்கிறது.
  alternative: அந்தக் கணத்தில் மன்னிப்பை நிகழ்த்தும் அறிவிப்பு; அல்லது ஏற்கெனவே வழங்கப்பட்ட மன்னிப்பை அறிவித்தல்.
  rationale: கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவம் மன்னிப்பு உண்மையையும் அதன் தற்போதைய விளைவையும் கூறுகிறது; ஆனால் அதன் காலச்சார்ந்த இறையியல் இயங்குமுறையைத் துல்லியமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மனிதனே’ என்பது அன்றாட உரையாடலில் அரிதாக இருந்தாலும், மூலத்தின் நேரடி ஆண்பால் அழைப்பைச் செயற்கையான கூடுதல் நெருக்கமின்றிப் பாதுகாக்கிறது. வசனத்தின் சொற்தொடர் தமிழில் இயல்பாக இருக்கும்படி வினையெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
