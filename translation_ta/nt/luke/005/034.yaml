reference: Luke 5:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “மணமகன் அவர்களோடு இருக்கும்போது, திருமண விருந்தினர்களை[a] உபவாசம் இருக்கச் செய்ய உங்களால் முடியாதல்லவா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘மணவறையின் மகன்கள்’; இது மணமகனின் தோழர்கள் அல்லது திருமண விருந்தினர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: உங்களால் முடியுமா?
  rationale: μή உடன் வரும் இந்தக் கேள்வி எதிர்மறையான பதிலை எதிர்பார்க்கிறது. தமிழில் சூழலும் கேள்வியின் சொல்லமைப்பும் ‘முடியாது’ என்ற எதிர்பார்ப்பை இயல்பாக உணர்த்துகின்றன.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: திருமண விருந்தினர்களை
  rationale: சொல்லுக்குச் சொல் ‘மண அறையின் மகன்கள்’ என்றாலும், இது மணமகனின் தோழர்கள் அல்லது திருமணக் கொண்டாட்டத்தில் கலந்துகொள்பவர்களைக் குறிக்கும் மரபுத்தொடர். ‘திருமண விருந்தினர்கள்’ நவீன தமிழில் அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: νυμφίος
  choice: மணமகன்
  rationale: திருமண உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கும் நிலையான தமிழ் இணைச்சொல்.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: தங்களோடு இருக்கும்போது
  rationale: மணமகன் அவர்களுடன் தற்போது இருப்பதை இயல்பான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: ποιῆσαι νηστεῦσαι
  choice: உபவாசம் இருக்கச் செய்ய
  rationale: ποιέω மற்றும் வினையெச்சத்தின் causative பொருளை, விருந்தினர்களை உபவாசிக்க வற்புறுத்துதல் அல்லது அவ்வாறு செய்ய வைத்தல் என்ற வகையில் காக்கிறது.
- source_word: νηστεῦσαι
  choice: உபவாசம் இருக்க
  rationale: மதச் சூழலில் உணவைத் தவிர்ப்பதைக் குறிக்கும் பரவலாகப் புரிந்துகொள்ளப்படும், மரியாதைமிக்க தமிழ் வழக்கு.
theological_decisions:
- issue: இயேசுவை மணமகனாகக் குறிக்கும் உருவகம்
  choice: ‘மணமகன்’ என்ற உருவகத்தை விளக்க விரிவாக்கமின்றி அப்படியே வைத்தல்
  alternative: மணமகன் இயேசுவையே குறிக்கிறார் என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சொல்லுதல்
  rationale: வசனம் உருவகத்தின் வழியாக இயேசுவின் தனித்துவமான பங்கைச் சுட்டுகிறது; ஆனால் அதன் இறையியல் பொருளை மொழிபெயர்ப்பே தீர்மானித்து விளக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் வினையூக்கப் பொருளும், எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாவும் காக்கப்பட்டுள்ளன.
