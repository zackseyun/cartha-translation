review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the causative force of ποιῆσαι νηστεῦσαι (‘make/cause ... to fast’), the present accompanying sense of μετ’ αὐτῶν ἐστιν, and the wedding imagery. However, its plain question ‘உங்களால் முடியுமா?’ does not adequately convey μή with the indicative, which frames a rhetorical question expecting a negative answer.
  naturalness: The sentence is generally clear and modern, but ‘மணமகன் தங்களோடு’ uses an honorific reflexive form where the ordinary third-person plural ‘அவர்களோடு’ is more natural and unambiguous. A negative tag question is idiomatic Tamil and better represents the Greek rhetorical force.
  terminology: ‘மணமகன்,’ ‘திருமண விருந்தினர்கள்,’ and ‘உபவாசம் இருக்கச் செய்ய’ are suitable. The note should give the literal expression as ‘மணவறையின் மகன்கள்,’ a more natural Tamil equivalent for the literal ‘sons of the bridal chamber.’
  issues:
  - severity: medium
    issue: The expected-negative force of Μὴ δύνασθε is underrepresented.
    rationale: ‘உங்களால் முடியுமா?’ can be read as a genuine open question. ‘... செய்ய முடியாதல்லவா?’ naturally signals the rhetorical question and expected negative answer without adding interpretation.
  - severity: low
    issue: ‘தங்களோடு’ is an awkward referent for the wedding guests.
    rationale: The Greek αὐτῶν refers to the wedding guests. ‘அவர்களோடு’ is the normal modern Tamil third-person plural form in this context.
  revised_text: அவர் அவர்களிடம், “மணமகன் அவர்களோடு இருக்கும்போது, திருமண விருந்தினர்களை[a] உபவாசம் இருக்கச் செய்ய உங்களால் முடியாதல்லவா?” என்றார்.
  revised_footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘மணவறையின் மகன்கள்’; இது மணமகனின் தோழர்கள் அல்லது திருமண விருந்தினர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s wedding metaphor and causative infinitive while expressing the μή-question as a Tamil rhetorical question that anticipates a negative reply. It also clarifies the pronoun’s referent and slightly improves the literal wording in the lexical footnote.
