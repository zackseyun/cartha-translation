  to: அவர் அவர்களிடம், “மணமகன் அவர்களோடு இருக்கும்போது, திருமண விருந்தினர்களை[a] உபவாசம் இருக்கச் செய்ய உங்களால் முடியாதல்லவா?” என்றார்.
