  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: ta
  text: மக்கள் கூட்டம் அவரை நெருக்கி வந்துகொண்டு கடவுளுடைய வார்த்தையைக் கேட்டுக்கொண்டிருந்த வேளையில்,[a] அவர் கெனேசரேத்து ஏரிக்கரையில்[b] நின்றுகொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் கூட்டம் அவரை நெருக்கி வந்து கடவுளுடைய வார்த்தையைக் கேட்டபோது.”
    reason: lexical_alternative
  - marker: b
    text: கெனேசரேத்து ஏரி, கலிலேயக் கடல் என்றும் அழைக்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: —
  rationale: இது லூக்காவின் நிகழ்வை அறிமுகப்படுத்தும் கதைநடைச் சூத்திரம். தமிழில் தனியாக ‘அப்போது நிகழ்ந்ததாவது’ என்று மொழிபெயர்த்தால் இயல்பற்றதாக இருக்கும்; காலநிலைத் துணைவாக்கியமும் முதன்மை வாக்கியமும் இதன் பணியை இயல்பாக நிறைவேற்றுகின்றன.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: மக்கள் கூட்டம் ... நெருக்கிக்கொண்டு ... கேட்டுக்கொண்டிருந்தபோது
  rationale: ἐν τῷ உடன் வரும் இரண்டு வினையெச்சங்களின் காலநிலைத் தொடர்பையும், கூட்டம் ஒரே நேரத்தில் நெருக்கி வந்து கேட்டுக்கொண்டிருந்ததையும் வெளிப்படுத்துகிறது.
- source_word: ὄχλον
  choice: மக்கள் கூட்டம்
  rationale: நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ὄχλος என்பதைக் குறிக்கிறது.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: அவரை நெருக்கிக்கொண்டு
  rationale: அவர்மீது உடலளவில் நெருங்கி அழுத்தும் கூட்டத்தின் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀκούειν
  choice: கேட்டுக்கொண்டிருந்த
  rationale: தொடர்ந்து கவனித்துக் கேட்ட செயலைச் சூழலுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: சொற்றொடரின் இறையியல் அகலத்தையும் வேதாகமங்களுக்கு இடையிலான தொடர்பொலியையும் காக்கும் முறையான, பரிச்சயமான மொழிபெயர்ப்பு.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: அவர் ... நின்றுகொண்டிருந்தார்
  rationale: சுற்றுப்பெயர்ச்சியுள்ள கிரேக்க வினையமைப்பு குறிக்கும் தொடர்நிலையை இயல்பான தமிழில் தருகிறது; αὐτός இங்கு தனியாக வலியுறுத்தப்பட வேண்டியதில்லை.
- source_word: παρὰ τὴν λίμνην
  choice: ஏரிக்கரையில்
  rationale: ஏரியின் அருகில் அல்லது ஓரத்தில் இருந்த இடநிலையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Γεννησαρέτ
  choice: கெனேசரேத்து
  rationale: கிரேக்க மூலத்தில் உள்ள இடப்பெயரை மாற்றுப் பெயரால் பதிலிடாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: τὸν λόγον τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய வார்த்தை
  alternative: கடவுளுடைய செய்தி
  rationale: இச்சொற்றொடர் அறிவிக்கப்படும் செய்தியைக் குறிக்கக்கூடும்; எனினும் ‘வார்த்தை’ என்பது அதன் விரிவான இறையியல் பொருளையும் பிற வேதாகமப் பயன்பாடுகளுடனான தொடர்பையும் தீர்மானிக்காமல் காக்கிறது.
- issue: Γεννησαρέτ என்ற பெயரைக் கையாளுதல்
  choice: கெனேசரேத்து
  alternative: கலிலேயக் கடல்
  rationale: மூலவசனம் ஏரியை ‘கெனேசரேத்து’ என்று பெயரிடுகிறது. ‘கலிலேயக் கடல்’ என்று முதன்மை உரையில் மாற்றுவது மூலத்தில் இல்லாத விளக்க அடையாளத்தை உரைக்குள் சேர்த்துவிடும்.
