  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்செயல் உணர்வு ‘நெருக்கிக்கொண்டு’, ‘கேட்டுக்கொண்டிருந்தபோது’, ‘நின்றுகொண்டிருந்தார்’ என்பவற்றால் காக்கப்பட்டுள்ளது; வாக்கியத் தொடக்கத்தில் இயல்பற்ற தனி நிகழ்வு-அறிமுகச் சொற்றொடர் சேர்க்கப்படவில்லை.
