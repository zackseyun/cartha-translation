source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: ta
  text: ஆனால், அவரைப் பற்றிய செய்தி இன்னும் அதிகமாகப் பரவிக்கொண்டே இருந்தது[a]; கேட்பதற்கும் தங்கள் நோய்களிலிருந்து குணமடைவதற்கும் பெருந்திரளான மக்கள் கூடிவந்துகொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைப் பற்றிய பேச்சு’ அல்லது ‘அவரைப் பற்றிய தகவல்.’
    reason: λόγος என்பதற்கு இச்சூழலில் ‘செய்தி,’ ‘பேச்சு,’ ‘தகவல்’ ஆகிய பொருள் நுணுக்கங்கள் சாத்தியம்.
lexical_decisions:
- source_word: διήρχετο
  choice: பரவியது
  rationale: இச்சூழலில் இந்த இறந்தகாலத் தொடர்நிலை வினை, இயேசுவைப் பற்றிய செய்தி தொடர்ந்து பல இடங்களுக்குப் பரவியதைக் குறிக்கிறது; ‘பரவியது’ இயல்பான நவீனத் தமிழ் நடை.
- source_word: μᾶλλον
  choice: இன்னும் அதிகமாக
  rationale: முன்பைவிடச் செய்தி அதிகமாகப் பரவியது என்ற ஒப்பீட்டு வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: அவரைப் பற்றிய செய்தி
  rationale: λόγος இங்கு இறையியல் சார்ந்த தொழில்நுட்பப் பொருளில் ‘வார்த்தை’ என்பதைக் காட்டிலும், இயேசுவைப் பற்றிப் பரவிய செய்தி அல்லது தகவலைக் குறிக்கிறது. மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: συνήρχοντο
  choice: கூடிவந்தார்கள்
  rationale: மக்கள் தொடர்ந்து அல்லது மீண்டும் மீண்டும் ஒன்றுகூடியதைக் காட்டும் இறந்தகாலத் தொடர்நிலை உணர்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὄχλοι πολλοὶ
  choice: மக்கள் பெருந்திரளாக
  rationale: ‘பல கூட்டங்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட, ஏராளமான மக்கள் திரண்டனர் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀκούειν
  choice: அவர் சொல்வதைக் கேட்பதற்கு
  rationale: கிரேக்கத்தில் கேட்கப்படும் பொருள் வெளிப்படையாகச் சொல்லப்படவில்லை; தமிழில் வாக்கியம் இயல்பாக இருக்க சூழலிலிருந்து தெளிவாகும் ‘அவர் சொல்வதை’ சேர்க்கப்பட்டுள்ளது, புதிய கருத்து சேர்க்கப்படவில்லை.
- source_word: θεραπεύεσθαι
  choice: குணமடைவதற்கு
  rationale: செயப்பாட்டு உணர்வைத் தமிழில் இயல்பாக வெளிப்படுத்தி, நோயிலிருந்து குணம் பெறுதல் என்ற உடல் சார்ந்த பொருளைக் காக்கிறது.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: தங்கள் நோய்களிலிருந்து
  rationale: ἀπό என்பதன் ‘இலிருந்து விடுபடுதல்’ உணர்வையும், இச்சூழலில் ἀσθένεια குறிக்கும் உடல் நோய்களையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: குணப்படுத்துதலின் தன்மை
  choice: உடல் நோய்களிலிருந்து குணமடைதல் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஆவிக்குரிய மீட்பையும் உள்ளடக்கக்கூடிய ‘முழுமையாக்கப்படுதல்’ போன்ற விரிவான மொழி.
  rationale: உடனடி கதைச்சூழல் உடல் நோய்களுக்கான குணப்படுத்துதலைக் குறிக்கிறது; இவ்வசனம் வெளிப்படையாகச் சொல்லாத ஆவிக்குரிய பொருளை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான செயல்களை ‘பரவியது,’ ‘கூடிவந்தார்கள்’ என்பவை சூழலுடன் வெளிப்படுத்துகின்றன; தேவையற்ற சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
