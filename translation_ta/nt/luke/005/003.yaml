id: LUK.5.3
reference: Luke 5:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: ta
  text: பின்பு அவர் படகுகளில் ஒன்றில் ஏறினார்; அது சீமோனுக்குச் சொந்தமானது. நிலத்திலிருந்து[a] படகைச் சற்றுத் தள்ளிச் செலுத்தும்படி அவரிடம் கேட்டார். பிறகு அவர் படகில் அமர்ந்து, அதிலிருந்தபடியே மக்கள் கூட்டங்களுக்குப் போதித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கரையிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொற்சொல்லாக ‘நிலத்திலிருந்து’ என்று உள்ளது; இது படகை உலர்ந்த நிலத்துடன் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: ஏறினார்
  rationale: படகுக்குள் சென்ற செயலை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; முதன்மை வினைக்கு முன் நடந்த இறந்தகாலப் பங்கேற்புவினையின் தொடர்ச்சியும் காக்கப்படுகிறது.
- source_word: πλοίων / πλοίου
  choice: படகுகள் / படகு
  rationale: கலிலேயா ஏரியின் மீன்பிடிப் படகுகள் என்ற சூழலுக்கு ‘படகு’ பொருத்தமானது; கிரேக்கத்தின் பன்மை மற்றும் ஒருமை முறையே காக்கப்பட்டுள்ளன.
- source_word: ὃ ἦν Σίμωνος
  choice: அது சீமோனுக்குச் சொந்தமானது
  rationale: Σίμωνος என்ற உரிமைச் சுட்டும் வேற்றுமையின் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: ἠρώτησεν αὐτόν
  choice: அவரிடம் கேட்டார்
  rationale: ἐρωτάω இங்கு ஒரு வேண்டுகோளை முன்வைப்பதைக் குறிக்கிறது; ‘கேட்டார்’ என்பது தேவையற்ற முறையான தொனியின்றி இயல்பாக உள்ளது. அண்மைய ஆண்பால் ஒருமை நபரான சீமோனை ‘அவர்’ சுட்டுகிறது.
- source_word: ἐπαναγαγεῖν
  choice: படகைச் சற்றுத் தள்ளிச் செலுத்தும்படி
  rationale: படகை நிலத்திலிருந்து நீருக்குள் சிறிது தொலைவு நகர்த்தும் கடல்சார் பொருளைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπὸ τῆς γῆς
  choice: நிலத்திலிருந்து
  rationale: γῆ என்பதன் அடிப்படைப் பொருளான ‘நிலம்’ என்பதைக் காத்து, நீரில் உள்ள படகுக்கும் உலர்ந்த நிலத்துக்கும் உள்ள எதிர்மறையை வெளிப்படுத்துகிறது.
- source_word: ὀλίγον
  choice: சற்று
  rationale: சிறிய தொலைவு அல்லது அளவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: καθίσας
  choice: அவர் படகில் அமர்ந்து
  rationale: போதிப்பதற்கு முன் அவர் அமர்ந்த செயலை இயல்பான தமிழ் வாக்கியத் தொடரில் காட்டுகிறது.
- source_word: ἐκ τοῦ πλοίου
  choice: அதிலிருந்தபடியே
  rationale: அவர் படகிலிருந்து மக்களுக்குப் போதித்தார் என்ற இடநிலையைத் தெளிவுபடுத்துகிறது; தமிழில் தவறாக ‘படகைவிட்டு வெளியேறி’ என்ற பொருள் எழாமல் தவிர்க்கிறது.
- source_word: ἐδίδασκεν
  choice: போதித்துக்கொண்டிருந்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினையின் நீடித்த செயற்பாட்டைத் தமிழில் காக்கிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களுக்கு
  rationale: ὄχλους என்பதன் பன்மையைப் பாதுகாத்து, ‘திரள்கள்’ என்பதைக் காட்டிலும் சாதாரண வாசகர்களுக்கு இயல்பான தமிழை வழங்குகிறது.
