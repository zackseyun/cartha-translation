source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: ta
  text: வியப்பு அனைவரையும் ஆட்கொண்டது; அவர்கள் கடவுளை மகிமைப்படுத்திக்கொண்டிருந்தார்கள்; பயத்தால் நிரம்பி, “இன்று நாங்கள் அசாதாரணமான காரியங்களைக் கண்டோம்[a]” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “குறிப்பிடத்தக்க காரியங்களை” அல்லது “வழக்கத்திற்கு மாறான காரியங்களை”; கிரேக்கச் சொல் சாதாரண எதிர்பார்ப்புக்கு அப்பாற்பட்ட காரியங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: வியப்பு
  rationale: இச்சூழலில் இது பரவசநிலையைக் குறிக்காமல், நிகழ்ந்ததைக் கண்டு ஏற்பட்ட ஆழ்ந்த வியப்பைக் குறிக்கிறது. ‘வியப்பு’ என்பது இயல்பான நவீனத் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔλαβεν ἅπαντας
  choice: அனைவரையும் ஆட்கொண்டது
  rationale: ‘அனைவரையும் பற்றிக்கொண்டது’ என்ற கிரேக்கச் சொல்லாட்சியின் வலிமையைத் தக்கவைத்தபடி, தமிழில் இயல்பாக அமைகிறது.
- source_word: ἐδόξαζον
  choice: மகிமைப்படுத்திக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான செயலை ‘கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது; δοξάζω என்பதன் ‘மகிமைப்படுத்து’ என்ற பொருளையும் காக்கிறது.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: இச்சூழலில் θεός என்பதற்கான இயல்பான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழாக்கம்.
- source_word: ἐπλήσθησαν φόβου
  choice: பயத்தால் நிறைந்து
  rationale: φόβος என்பதிலுள்ள ‘பயம்’ என்ற நேரடிப் பொருளை மென்மைப்படுத்தாமல் காக்கிறது; அதேவேளையில் தொடரும் சொல்லாட்சியுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: Εἴδομεν
  choice: நாங்கள் ... கண்டோம்
  rationale: கிரேக்க இறந்தகால வடிவையும், அன்று நிகழ்ந்ததை நேரடியாகக் கண்டவர்களின் உடனடி சாட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παράδοξα
  choice: அசாதாரணமானவற்றை
  rationale: வழக்கமான எதிர்பார்ப்புக்கு அப்பாற்பட்ட நிகழ்வுகள் என்ற பொருளை வெளிப்படுத்துகிறது; எதிர்மறையான ‘விநோதம்’ என்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: σήμερον
  choice: இன்று
  rationale: நிகழ்வுக்கான உடனடித் காலச் சுட்டை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: தெய்வீகச் செயலுக்கான பதிலில் φόβος என்பதன் நுட்பம்
  choice: ‘பயம்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘பயபக்தி’ அல்லது ‘பிரமிப்பு’
  rationale: இயேசுவின் அதிகாரத்தை எதிர்கொண்டவர்களின் பதிலில் அச்சமும் வழிபாட்டு உணர்வும் இணைந்துள்ள பதற்றத்தை உரை தானாகவே வைத்திருக்கிறது. ‘பயபக்தி’ அல்லது ‘பிரமிப்பு’ என்று விளக்கமாக மாற்றுவது அந்தப் பதற்றத்தை முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. தொடர்ச்சியான ἐδόξαζον என்பதைக் காட்ட ‘மகிமைப்படுத்திக்கொண்டிருந்தார்கள்’ பயன்படுத்தப்பட்டது; φόβος என்பதிலுள்ள இறையியல் பதற்றம் ‘பயம்’ எனத் தக்கவைக்கப்பட்டது.
