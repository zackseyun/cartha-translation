  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: ta
  text: அவர் அவனிடம், “யாரிடமும் சொல்லாதே. ஆனால் நீ போய், உன்னை ஆசாரியரிடம் காட்டு; மோசே கட்டளையிட்டபடி உன் தூய்மைப்படுத்தலுக்காகக் காணிக்கையைச் செலுத்து[b], அவர்களுக்கு ஒரு சாட்சியாக[a]” என்று கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்கு ஒரு சாட்சியாக” என்பது ஆசாரியர்களையோ மற்றவர்களையோ குறிக்கலாம்; சிலர் இதை அவர்களுக்கு எதிரான ஆதாரம் என்றும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: தூய்மைப்படுத்தலுக்காக மோசே கட்டளையிட்ட காணிக்கையைப் பற்றி லேவியராகமம் 14-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: கட்டளையிட்டார்
  rationale: அதிகாரத்துடன் கொடுக்கப்பட்ட நேரடியான அறிவுறுத்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத கூடுதல் கடுமையைச் சேர்ப்பதில்லை.
- source_word: μηδενὶ εἰπεῖν
  choice: யாரிடமும் சொல்லாதே
  rationale: தடையைத் தெளிவாகவும் இயல்பாகவும் கூறும் தமிழ் வடிவம்.
- source_word: ἀπελθὼν
  choice: நீ போய்
  rationale: முதலில் சென்று, பின்னர் ஆசாரியரிடம் தன்னைக் காட்ட வேண்டும் என்ற செயல்வரிசையை இயல்பான தமிழில் காக்கிறது.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: உன்னை ஆசாரியரிடம் காட்டு
  rationale: கிரேக்க கட்டளை வடிவத்தையும் தற்சுட்டுப் பெயரையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: προσένεγκε
  choice: காணிக்கையைச் செலுத்து
  rationale: பலிசார் வழிபாட்டுச் சூழலில் கொண்டுவந்து அர்ப்பணிப்பதைக் குறிக்கும் இயல்பான தமிழ்; தேவையான பொருள் மோசேயின் கட்டளையால் சூழலில் விளங்குவதால் ‘காணிக்கை’ சேர்க்கப்பட்டுள்ளது.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: உன் தூய்மைப்படுத்தலுக்கான
  rationale: சடங்குசார் தூய்மை நிலையை அணுகத்தக்க தமிழில் தெரிவிக்கிறது; உடல் குணமடைதல் மட்டுமாக பொருளைக் குறுக்கவில்லை.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: மோசே கட்டளையிட்டபடி
  rationale: மோசேயின் சட்டக் கட்டளையை நேரடியாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: இது அவர்களுக்கு ஒரு சாட்சியாக இருக்கும்
  rationale: ‘அவர்கள்’ யார் என்பதையும் சாட்சியின் சாதக அல்லது எதிர்மறை வலிமையையும் தீர்மானிக்காமல், கிரேக்கத்தின் பொருள் நெகிழ்வைக் காக்கிறது.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς என்பதில் ‘அவர்களுக்கு’ என்பதன் சுட்டும் குழுவும் சாட்சியின் தன்மையும்
  choice: ‘அவர்களுக்கு ஒரு சாட்சியாக’ என்று குறிப்பிட்ட குழுவையோ சாட்சியின் சாதக/எதிர்மறை வலிமையையோ நிர்ணயிக்காமல் விடப்பட்டது.
  alternative: ஆசாரியர்களுக்குச் சாட்சியாக; மக்களுக்குச் சாட்சியாக; அவர்களுக்கு எதிரான சாட்சியாக
  rationale: கிரேக்கப் பிரதியில் αὐτοῖς என்ற பன்மைப் பதிலிப்பெயரின் சுட்டு வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை; μαρτύριον என்பதும் இங்கு ஆதாரமா அல்லது எதிரான சாட்சியா என்பதைத் தனியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘தூய்மைப்படுத்தல்’, ‘சாட்சி’ ஆகியவை சட்டம் மற்றும் வழிபாட்டுச் சூழலைக் காக்கும் பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள். கிரேக்கத்தின் மறைமுக உரை அமைப்பு தமிழில் இயல்பாக இருக்க மேற்கோள் நேரடி உரையாக வழங்கப்பட்டுள்ளது.
