  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: ta
  text: ஏனெனில், அவர்கள் பிடித்த மீன்களின் பிடிப்பின் காரணமாக, அவனையும் அவனோடு இருந்த அனைவரையும் திகைப்பு ஆட்கொண்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: திகைப்பு
  rationale: திடீரென ஏற்படும் ஆழ்ந்த வியப்பையும் மனத்தை ஆட்கொள்ளும் அதிர்வையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் சீமோன் வெளிப்படுத்திய எதிர்வினைக்கான காரணத்தை இவ்வசனம் விளக்குகிறது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: περιέσχεν
  choice: ஆட்கொண்டது
  rationale: ஓர் உணர்ச்சி ஒருவரை முற்றிலும் பற்றிக்கொண்டது என்ற கிரேக்க வழக்கை இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: அவரோடு இருந்த அனைவரையும்
  rationale: சீமோனுடன் அங்கு இருந்த முழுக் குழுவையும் உள்ளடக்கும் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: மீன்களின் பெரும் எண்ணிக்கையைக் கண்டு
  rationale: ἄγρα இச்சூழலில் பிடிபட்ட மீன்களின் தொகுப்பைக் குறிக்கிறது; ἐπί அவர்களது திகைப்புக்கான காரணத்தைச் சுட்டுகிறது. முந்தைய வசனங்களில் கூறப்பட்ட மிகுதியை மனதில் கொண்டு, தமிழில் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: ὧν συνέλαβον
  choice: அவர்கள் பிடித்திருந்த
  rationale: உறவுப்பெயர் மீன்களைக் குறிக்கிறது; பன்மை வினைச்சொல் அந்தக் குழுவினர் சேர்ந்து பிடித்ததைத் தெரிவிக்கிறது. ‘பிடித்திருந்த’ என்பது இந்நிகழ்வுக்கு முந்திய செயலை இயல்பாகக் காட்டுகிறது.
