  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘திகைப்பு ஆட்கொண்டது’ என்ற அமைப்பு மூலத்தின் வலிமையைப் பாதுகாக்கிறது; தொடர்ச்சியான ‘பிடிப்பு/பிடித்த’ என்ற செயற்கையான சொல் மீளலை முதன்மை உரையில் தவிர்க்கிறது.
