translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தில் இல்லாத கூரைப் பிரித்தல் போன்ற செயல்விவரங்கள் சேர்க்கப்படவில்லை; κλινίδιον என்பதன் பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
