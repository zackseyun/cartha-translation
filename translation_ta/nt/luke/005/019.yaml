source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: ta
  text: மக்கள் கூட்டத்தினால் அவரை உள்ளே கொண்டுவர எந்த வழியும் கிடைக்காததால்[a], அவர்கள் கூரையின்மேல் ஏறி, ஓடுகளின் வழியாக[b] அவரைப் படுக்கையோடு[c] நடுவில், இயேசுவின் முன்பாக இறக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்கள் கூட்டத்தினால் அவரை எப்படி உள்ளே கொண்டுவருவது என்று தெரியாததால்.’ கிரேக்க மரபுத்தொடர் செல்லும் வழியையோ பயன்படுத்தும் முறையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கூரை ஓடுகளின் வழியாக. லூக்காவின் சொற்கள் ஓடுகள் பதிக்கப்பட்ட கூரை அமைப்பைக் காட்டுகின்றன.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘சிறுபடுக்கையோடு,’ ‘பாயோடு,’ அல்லது ‘தூக்குப் படுக்கையோடு.’ கிரேக்கச் சொல் ஒரு சிறிய படுக்கையையோ படுக்கும் பாயையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: அவரை உள்ளே கொண்டுவர எந்த வழியும்
  rationale: ποίας என்பது இங்கு ‘எந்த வழியில்/எப்படி’ என்ற நீள்விடுபட்ட கிரேக்க மரபுத்தொடராக உள்ளது. ‘எந்த வழியும்’ என்பது அணுகும் வழியையும் செய்முறையையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: διὰ τὸν ὄχλον
  choice: மக்கள் கூட்டத்தினால்
  rationale: διά + வேற்றுமை அமைப்பு இங்கு இடவழியைக் குறிக்காமல் காரணத்தைக் குறிக்கிறது; கூட்டமே உள்ளே செல்லத் தடையாக இருந்தது.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: கூரையின்மேல் ஏறி
  rationale: δῶμα என்பது வீட்டின் கூரை அல்லது மொட்டைமாடிப் பகுதியைக் குறிக்கலாம். இச்சூழலில் ‘கூரையின்மேல்’ என்பது அடுத்துவரும் ஓடுகள் குறித்த விவரத்தோடு இயல்பாக இணைகிறது.
- source_word: διὰ τῶν κεράμων
  choice: ஓடுகளின் வழியாக
  rationale: κέραμος என்பதன் பன்மை இங்கு கூரையின் களிமண் ஓடுகளைக் குறிக்கிறது. அவற்றை எவ்வாறு திறந்தார்கள் என்பதை மூலவசனம் வெளிப்படையாகச் சொல்லாததால் அதைக் கூட்டிச் சொல்லவில்லை.
- source_word: καθῆκαν
  choice: இறக்கினார்கள்
  rationale: மேலிருந்து கீழே இறக்கிவிடும் செயலைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: σὺν τῷ κλινιδίῳ
  choice: படுக்கையோடு
  rationale: κλινίδιον என்பது சிறிய படுக்கை, படுக்கும் பாய் அல்லது தூக்கிச் செல்லப் பயன்படும் படுக்கையைக் குறிக்கலாம். ‘படுக்கை’ என்பது பொருளை மிகையாக மருத்துவமயமாக்காமல் பொதுவாக வைத்திருக்கிறது.
- source_word: εἰς τὸ μέσον
  choice: நடுவில்
  rationale: கூடியிருந்தவர்களின் மத்திய பகுதியை எளிய, இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: இயேசுவுக்கு முன்பாக
  rationale: இது இயேசுவின் எதிரே அல்லது அவருக்கு முன்னுள்ள இடத்தில் இறக்கப்பட்டதைச் சுட்டுகிறது.
