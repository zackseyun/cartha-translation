  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: ta
  text: அவர்கள் இப்படிச் செய்தபோது, மிகத் திரளான மீன்களை வலைகளுக்குள் வளைத்துப் பிடித்தார்கள்[a]; அவர்களுடைய வலைகளோ கிழிந்துகொண்டிருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏராளமான மீன்களைப் பிடித்தார்கள்.” கிரேக்க வினைச்சொல் இன்னும் சொல்லுக்குச் சொல் முறையில் “உள்ளே அடைத்தார்கள்” அல்லது “சுற்றி அகப்படுத்தினார்கள்” என்று பொருள்படும்; மீன்கள் வலைகளால் சூழப்பட்ட காட்சியை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய வலைகள் கிழியத் தொடங்கின.” கிரேக்க இறந்தகாலத் தொடர்நிலை வினை, வலைகள் முற்றிலும் கிழிந்துவிட்டதாக அல்லாமல் கிழிவு நடந்துகொண்டிருந்ததாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: அவர்கள் இப்படிச் செய்தபோது
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தை, தமிழில் இயல்பான காலத் தொடர்புடன் தருகிறது; τοῦτο என்பதையும் ‘இப்படி’ என்று சுட்டுகிறது.
- source_word: συνέκλεισαν
  choice: வலைகளுக்குள் வளைத்துப் பிடித்தார்கள்
  rationale: மீன்களைச் சுற்றி அடைத்தல் அல்லது வலைக்குள் அகப்படுத்துதல் என்ற சொல்லின் காட்சியைப் பேணுகிறது; வெறுமனே ‘பிடித்தார்கள்’ என்று மொழிபெயர்ப்பதைவிட மூலத்தின் உருவகத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: πλῆθος ἰχθύων πολύ
  choice: மிகத் திரளான மீன்களை
  rationale: πλῆθος மற்றும் πολύ ஆகிய இரண்டும் வலியுறுத்தும் பெரும் எண்ணிக்கையை, இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: διερρήσσετο
  choice: கிழிந்துகொண்டிருந்தன
  rationale: முற்றுப்பெற்ற கிழிவாக அல்லாமல் நடந்துகொண்டிருந்த செயற்பாடாகக் காட்டும் இறந்தகாலத் தொடர்நிலையைப் பேணுகிறது.
- source_word: τὰ δίκτυα αὐτῶν
  choice: அவர்களுடைய வலைகள்
  rationale: மூலத்தில் உள்ள பன்மையையும் உடைமையையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
