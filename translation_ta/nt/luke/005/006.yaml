translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ‘வலைகளோ’ என்ற மாறுபாட்டுச் சுட்டு, பெரும் மீன்பிடிப்புக்கும் வலைகள் கிழியும் விளைவுக்கும் இடையிலான தொடர்பை இயல்பாகக் காட்டுகிறது; மூலத்தில் இல்லாத காரண விளக்கம் சேர்க்கப்படவில்லை.
