source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “யோவானுடைய சீடர்கள் அடிக்கடி உபவாசம் இருக்கிறார்கள்; வேண்டுதல்களைச் செலுத்துகிறார்கள். பரிசேயர்களைச் சேர்ந்தவர்களும்[a] அவ்வாறே செய்கிறார்கள். ஆனால் உம்முடையவர்களோ[b] உண்ணுகிறார்கள், குடிக்கிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசேயர்களின் சீடர்களும்.’ கிரேக்கத்தில் முந்தைய கூறிலுள்ள ‘சீடர்கள்’ என்ற சொல் இங்கும் பொருளில் எடுத்துக்கொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உம்முடைய சீடர்களோ.’ கிரேக்கத்தில் ‘உம்முடையவர்கள்’ என்று மட்டுமே உள்ளது; ‘சீடர்கள்’ என்பது சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: அவர்கள் அவரிடம் ... என்றார்கள்
  rationale: δέ இங்கு மென்மையான உரையாடல் இணைப்பாக இருப்பதால் தனியே வலுவான எதிர்மறைச் சொல்லைச் சேர்க்காமல், தமிழின் இயல்பான வாக்கிய அமைப்பில் தரப்பட்டுள்ளது.
- source_word: μαθηταὶ Ἰωάννου
  choice: யோவானுடைய சீடர்கள்
  rationale: உடைமை அல்லது தொடர்பைக் குறிக்கும் கிரேக்க வேற்றுமையைத் தெளிவான, இயல்பான தமிழில் காட்டுகிறது.
- source_word: νηστεύουσιν πυκνά
  choice: அடிக்கடி உபவாசமிருந்து
  rationale: πυκνά தொடர்ச்சியான வழக்கத்தை அல்ல, அடிக்கடி நிகழ்வதைக் குறிக்கிறது; ‘அடிக்கடி’ அந்தப் பொருளை நேரடியாகத் தருகிறது.
- source_word: δεήσεις ποιοῦνται
  choice: மன்றாட்டுகளை ஏறெடுக்கிறார்கள்
  rationale: δεήσεις என்பது பொதுவான ஜெபத்தைவிட வேண்டுதல் அல்லது மன்றாட்டு என்ற குறிப்பான பொருளுடையது; பெயர்ச்சொல் அமைப்பையும் பக்திக்குரிய இயல்பான தமிழையும் இத்தேர்வு காக்கிறது.
- source_word: ὁμοίως καὶ
  choice: அவ்வாறே செய்கிறார்கள்
  rationale: முந்தைய இரண்டு செயல்களும் பரிசேயர்களைச் சேர்ந்தவர்களுக்கும் பொருந்துகின்றன என்பதை இயல்பான தமிழில் சுருக்கமாகக் காட்டுகிறது.
- source_word: οἱ τῶν Φαρισαίων
  choice: பரிசேயர்களைச் சேர்ந்தவர்களும்
  rationale: கிரேக்கத்தில் ‘சீடர்கள்’ மீண்டும் சொல்லப்படாமல் இருப்பதைப் போலவே தமிழிலும் அதை வெளிப்படையாகச் சேர்க்காமல், தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ δὲ σοὶ
  choice: ஆனால் உம்முடையவர்களோ
  rationale: σοί என்பதில் ‘உம்முடைய சீடர்கள்’ என்பது சூழலால் புரிந்துகொள்ளப்படுகிறது. ‘உம்முடையவர்கள்’ கிரேக்கத்தின் சுருக்கத்தையும் ‘-ஓ’ அதன் முரண்பாட்டையும் காக்கின்றன.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: சாப்பிடுகிறார்கள், குடிக்கிறார்கள்
  rationale: நிகழ்காலம் இங்கு வழக்கமான நடத்தையைக் குறிக்கிறது; தமிழின் எளிய நிகழ்கால வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரண்டாம் மற்றும் மூன்றாம் கூறுகளில் ‘சீடர்கள்’ என்பதை வெளிப்படையாகச் சேர்ப்பதா
  choice: மூல கிரேக்கத்தின் விடுபட்ட அமைப்பை ‘பரிசேயர்களைச் சேர்ந்தவர்கள்’ மற்றும் ‘உம்முடையவர்கள்’ என்று முதன்மை உரையில் காத்தல்
  alternative: ‘பரிசேயர்களின் சீடர்கள்’ மற்றும் ‘உம்முடைய சீடர்கள்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: சூழல் இரு குறிப்புகளையும் தெளிவாக்குகிறது. எனவே பொருளை மறைக்காமல் மூலத்தின் சுருக்கத்தையும் கருத்து இறுக்கத்தையும் காக்க முடிகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘உம்முடையவர்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘உபவாசம்’ மற்றும் ‘மன்றாட்டு’ ஆகியவை பரவலாக அறியப்படும் சமயச் சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு எளிமையாக வைக்கப்பட்டுள்ளது.
