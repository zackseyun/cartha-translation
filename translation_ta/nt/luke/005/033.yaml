  to: அவர்கள் அவரிடம், “யோவானுடைய சீடர்கள் அடிக்கடி உபவாசம் இருக்கிறார்கள்; வேண்டுதல்களைச் செலுத்துகிறார்கள். பரிசேயர்களைச் சேர்ந்தவர்களும்[a] அவ்வாறே செய்கிறார்கள். ஆனால் உம்முடையவர்களோ[b] உண்ணுகிறார்கள், குடிக்கிறார்கள்” என்றார்கள்.
