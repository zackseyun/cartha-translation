revisions:
- from: ஆனால் இயேசு அவர்களுடைய உள்ளார்ந்த யோசனைகளை அறிந்து[a], அவர்களிடம் மறுமொழியாக, “உங்கள் இதயங்களில் ஏன் இவ்வாறு யோசித்துக்கொண்டிருக்கிறீர்கள்?” என்று சொன்னார்.
  to: 'ஆனால் இயேசு அவர்களுடைய எண்ணங்களை அறிந்து[a], அவர்களிடம் பதிலளித்துச் சொன்னார்: “உங்கள் இதயங்களில் ஏன் சிந்தித்துக்கொண்டிருக்கிறீர்கள்?”'
  rationale: The revision removes an unsupported adverb, improves the Tamil narrative syntax, and uses concise, natural terms for the Greek inward deliberation. It preserves the source’s unanswered question about how Jesus knew their thoughts and retains “hearts” as the biblical idiom.
