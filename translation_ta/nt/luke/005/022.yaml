id: LUK.5.22
reference: Luke 5:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: ta
  text: 'ஆனால் இயேசு அவர்களுடைய எண்ணங்களை அறிந்து[a], அவர்களிடம் பதிலளித்துச் சொன்னார்: “உங்கள் இதயங்களில் ஏன் சிந்தித்துக்கொண்டிருக்கிறீர்கள்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய தர்க்கங்களை உணர்ந்து.”
    reason: ἐπιγνοὺς என்பதற்கு “உணர்ந்து” என்பதையும், διαλογισμοὺς என்பதற்கு “தர்க்கங்கள்” என்பதையும் மாற்று நுண்பொருளாகக் காட்டுகிறது.
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: அறிந்து
  rationale: இயேசு அவர்களுடைய உள்ளார்ந்த யோசனைகளைத் தெளிவாக அறிந்திருந்தார் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; அவர் அதை எவ்வாறு அறிந்தார் என்று மூலவசனம் கூறாததால், அந்த முறையை விளக்கும் கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மறைமுகமாக எழுந்த எதிர்ப்பிலிருந்து இயேசுவின் பதிலுக்கு வரும் மென்மையான எதிர்மறைத் திருப்பத்தை இது காட்டுகிறது.
- source_word: διαλογισμοὺς
  choice: உள்ளார்ந்த யோசனைகளை
  rationale: அவர்கள் தங்களுக்குள் செய்த சிந்தனை மற்றும் ஆராய்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘உள்ளார்ந்த’ என்பது இவை வெளிப்படையாகச் சொல்லப்படாதவை என்பதைத் தெளிவாக்குகிறது.
- source_word: ἀποκριθεὶς εἶπεν
  choice: மறுமொழியாக ... சொன்னார்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து, சொன்னார்’ என்ற இரட்டை வினை அமைப்பின் பதிலளிக்கும் நுண்பொருளையும் சொல்லும் செயற்பாட்டையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: Τί
  choice: ஏன்
  rationale: διαλογίζεσθε என்பதுடன் வரும் இக்கேள்வியில் τί, அவர்கள் இவ்வாறு யோசிப்பதற்கான காரணத்தைக் கேட்பதால், தமிழில் ‘ஏன்’ என்பதே இயல்பான பொருத்தம்.
- source_word: διαλογίζεσθε
  choice: யோசித்துக்கொண்டிருக்கிறீர்கள்
  rationale: தொடர்ந்து நடைபெறும் உள்ளார்ந்த ஆராய்ச்சியை நிகழ்காலத் தொடர்வினை வடிவில் காட்டுகிறது; மேலும் διαλογισμοὺς என்பதுடனான சொற்பொருள் தொடர்பையும் தமிழில் ஓரளவு தக்கவைக்கிறது.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் இதயங்களில்
  rationale: καρδία குறிக்கும் சிந்தனை, விருப்பம் ஆகியவற்றின் உள்ளார்ந்த மையத்தைச் சுட்டும் வேதாகம உருவகத்தைப் பராமரிக்கிறது; அதை வெறுமனே ‘மனத்தில்’ என்று விளக்கி ஒடுக்கவில்லை.
theological_decisions:
- issue: மற்றவர்களின் உள்ளார்ந்த யோசனைகளை இயேசு அறிந்த விதம்
  choice: இயேசு அவர்களுடைய உள்ளார்ந்த யோசனைகளை அறிந்தார் என்று மட்டும் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அற்புதமான முறையில் அறிந்தார்’ என்று வெளிப்படையாகச் சேர்ப்பது அல்லது ‘ஊகித்தார்’ என்று அதன் வலிமையைக் குறைப்பது.
  rationale: இயேசு அவர்களின் உள்ளார்ந்த யோசனைகளை அறிந்திருந்தார் என்று வசனம் கூறுகிறது; ஆனால் அவர் அதை அறிந்த முறையை விளக்கவில்லை. எனவே அந்த இறையியல் பதற்றம் விளக்கமின்றித் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இதயங்களில்’ என்பது மூலத்தின் வேதாகம மனிதவியல் உருவகத்தைப் பாதுகாக்கிறது; ‘யோசித்துக்கொண்டிருக்கிறீர்கள்’ என்பது இயல்பான தமிழில் தொடரும் உள்ளார்ந்த சிந்தனையை வெளிப்படுத்துகிறது.
