source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: ta
  text: 'மேலும், வேத அறிஞர்களும் பரிசேயர்களும் தங்களுக்குள் சிந்திக்கத் தொடங்கினர்: “இறைநிந்தனைகளைப் பேசுகிறான் இந்தவன் யார்? கடவுள் ஒருவரைத் தவிர, பாவங்களை மன்னிக்க யாரால் முடியும்?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: தங்களுக்குள் இவ்வாறு சிந்திக்கத் தொடங்கினார்கள்
  rationale: ἄρχομαι + infinitive என்பதன் ‘தொடங்கினார்கள்’ என்ற அம்சத்தையும், διαλογίζομαι என்பதன் உள்ளார்ந்த சிந்தனை/பரிசீலனை என்ற பொருளையும் இயல்பான தமிழில் தருகிறது. இது முற்றிலும் வாய்வழி விவாதம் என்று தீர்மானிக்கவில்லை.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: இச்சூழலில் மோசேயின் திருச்சட்டத்தில் தேர்ச்சி பெற்ற அங்கீகரிக்கப்பட்ட அறிஞர்களைக் குறிக்கிறது. ‘எழுத்தர்கள்’ என்பது நவீன தமிழில் நகலெழுதுபவர்கள் என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: λαλεῖ βλασφημίας
  choice: இறைவனைப் பழித்துப் பேசுகிற
  rationale: βλασφημία இச்சூழலில் கடவுளுக்கு எதிரான அவதூறு அல்லது பழிப்புரையைக் குறிக்கிறது. தமிழில் பன்மையை இயந்திரமாகத் திணிக்காமல், கிரேக்கத்தின் குற்றச்சாட்டின் வலிமையை இயல்பாகத் தருகிறது.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: பாவங்களை மன்னிக்க
  rationale: ἀφίημι + ἁμαρτίας என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை; பாவங்களின் பன்மையும் காக்கப்படுகிறது.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: கடவுள் ஒருவரைத் தவிர
  rationale: εἰ μή என்பதன் விதிவிலக்கையும் μόνος என்பதன் தனித்தன்மை/பிரத்தியேகத்தையும் இயல்பான தமிழில் தெளிவாகக் காக்கிறது.
- source_word: Τίς ἐστιν οὗτος
  choice: இவன் யார்?
  rationale: கிரேக்கத்தில் ‘மனிதன்’ இல்லை. ‘இவன் யார்?’ என்பது கூடுதல் சொல்லின்றி அதன் நேரடியான, எதிர்ப்புணர்வுள்ள தொனியைத் தருகிறது.
theological_decisions:
- issue: பாவங்களை மன்னிக்கும் இயேசுவின் அதிகாரம் குறித்த உட்பொருள்
  choice: ‘கடவுள் ஒருவரைத் தவிரப் பாவங்களை மன்னிக்க யாரால் முடியும்?’ என்ற எதிர்ப்பை அதன் முழு இறையியல் வலிமையுடன் நேரடியாக மொழிபெயர்த்தல்
  alternative: இயேசுவின் தெய்வீகத்தை வெளிப்படையாக விளக்கிச் சேர்த்தல் அல்லது ‘கடவுள் மட்டுமே’ என்ற தனியுரிமைக் கூற்றை மென்மையாக்குதல்
  rationale: வசனம் வேத அறிஞர்களும் பரிசேயர்களும் முன்வைக்கும் கூற்றையே தருகிறது. லூக்காவின் கதையில் எழும் கிறிஸ்துவியல் பதற்றத்தை மொழிபெயர்ப்பு காக்க வேண்டும்; ஆனால் வசனம் சொல்லாத முடிவைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘வேத அறிஞர்கள்’ என்பது வரலாற்றுப் பணியை வாசகருக்குத் தெளிவாக்குகிறது. ‘இறைவனைப் பழித்துப் பேசுதல்’ என்பது βλασφημία-வின் சூழ்நிலைப் பொருளை பொதுவாசகருக்கு நேரடியாக உணர்த்துகிறது.
