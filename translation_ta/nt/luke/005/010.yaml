  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: ta
  text: அவ்வாறே, சீமோனின் கூட்டாளிகளாக இருந்த செபெதேயுவின் மகன்களான யாக்கோபையும் யோவானையும் திகைப்பு சூழ்ந்தது. இயேசு சீமோனை நோக்கி, “பயப்படாதே; இப்போதுமுதல் நீ மனிதர்களை உயிருடன் பிடிப்பவனாக இருப்பாய்”[a][b] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதர்களை உயிருடன் கைப்பற்றுபவனாக இருப்பாய்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒருவரை உயிருடன் பிடிப்பதை அல்லது கைப்பற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: மத்தேயு 4:19; மாற்கு 1:17 ஆகியவற்றை ஒப்பிடுக. அங்கு “உங்களை மனிதர்களைப் பிடிக்கும் மீனவர்களாக்குவேன்” என்ற வேறுபட்ட சொற்றொடர் வருகிறது; லூக்காவின் தனித்துவமான சொல்லாட்சியை இங்கு அதனுடன் ஒன்றாக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: அதேபோல்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வியப்பை யாக்கோபும் யோவானும் அதே விதமாக அனுபவித்தார்கள் என்பதை இயல்பான தமிழில் இணைக்கிறது. தமிழில் தேவையற்ற இரட்டிப்பு இல்லாமல் ஒப்புமை மற்றும் சேர்க்கை உணர்வைத் தருகிறது.
- source_word: υἱοὺς Ζεβεδαίου
  choice: செபெதேயுவின் மகன்கள்
  rationale: குடும்ப அடையாளத்தை மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: κοινωνοὶ
  choice: கூட்டாளிகள்
  rationale: இச்சூழலில் வெறும் தோழர்களை அல்ல, மீன்பிடித் தொழிலில் பங்குடையவர்களைக் குறிக்கிறது.
- source_word: Μὴ φοβοῦ
  choice: பயப்படாதே
  rationale: ஒருமை அழைப்பையும் இயேசுவின் ஆறுதலான கட்டளையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἀπὸ τοῦ νῦν
  choice: இப்போதுமுதல்
  rationale: சீமோனின் பணியில் தொடங்கும் தீர்மானமான புதிய கட்டத்தைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: ἀνθρώπους
  choice: மனிதர்களை
  rationale: ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் மூலச்சொல்லின் விரிவைத் துல்லியமாகக் காக்கிறது.
- source_word: ζωγρῶν
  choice: உயிரோடு பிடிப்பவனாக இருப்பாய்
  rationale: ζωγρέω என்பதிலுள்ள உயிருடன் கைப்பற்றுதல் என்ற தனித்துவமான பொருளை வெளிப்படுத்துகிறது; அதேவேளை மீன்பிடி உருவகத்தின் ‘பிடித்தல்’ கூறையும் காக்கிறது.
theological_decisions:
- issue: ζωγρέω என்ற வினைச்சொல்லில் உள்ள அழைப்பு உருவகம்
  choice: நீ மனிதர்களை உயிரோடு பிடிப்பவனாக இருப்பாய்
  alternative: நீ மனிதர்களைப் பிடிப்பாய்; நீ மனிதரைப் பிடிக்கும் மீனவனாவாய்
  rationale: லூக்காவின் சொற்றொடர் மத்தேயு 4:19 மற்றும் மாற்கு 1:17 ஆகியவற்றிலுள்ள ‘மனிதரைப் பிடிக்கும் மீனவர்கள்’ என்ற மொழியிலிருந்து வேறுபடுகிறது. ‘உயிரோடு’ என்பது உயிருடன் கைப்பற்றும் பொருளைத் தாங்கி, அந்த வேறுபாட்டை இணைப்பாடுகளோடு ஒத்திசைத்து மறைத்துவிடாமல் காக்கிறது.
- issue: ἀνθρώπους என்பதன் பாலின வரம்பு
  choice: மனிதர்களை
  alternative: ஆண்களை; மக்களை
  rationale: இங்கு நோக்கப்படுவது ஆண்கள் மட்டும் அல்ல, மனிதர்கள் பொதுவாகவே. ‘மனிதர்கள்’ என்பது அந்தப் பொருளைத் துல்லியமாகவும் மாண்பான நடையிலும் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் மாண்பும் கொண்ட நடை. முன் வசனத்திலிருந்து தொடரும் ἐξέστη என்ற வினை தமிழில் வெளிப்பட வேண்டியதால் “திகைத்தார்கள்” சேர்க்கப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; சீமோனிடம் ஒருமையில் பேசும் வடிவம் காக்கப்பட்டுள்ளது.
