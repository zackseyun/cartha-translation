language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: ta
  text: படகுகளைக் கரைக்குக் கொண்டுவந்த பிறகு, அவர்கள் எல்லாவற்றையும் விட்டுவிட்டு அவரைப் பின்பற்றினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: கொண்டுவந்த பிறகு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; தமிழில் இயல்பான காலவரிசையை இது தெளிவாகக் காட்டுகிறது.
- source_word: τὰ πλοῖα
  choice: படகுகளை
  rationale: கலிலேய மீன்பிடிச் சூழலில் πλοῖον என்பதற்கு ‘படகு’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἐπὶ τὴν γῆν
  choice: கரைக்கு
  rationale: சொல்லளவில் ‘நிலத்தின்மேல்/நிலத்திற்கு’ என்று இருந்தாலும், படகுகளை நீரிலிருந்து நிலத்திற்குக் கொண்டுவரும் இச்சூழலில் ‘கரைக்கு’ என்பது இயல்பாகப் பொருளைத் தருகிறது.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: ἀφίημι இங்கு விட்டுச் செல்லுதல் என்ற பொருளில் உள்ளது; தமிழ் வினையெச்சம் செயல்களின் தொடரை இயல்பாகப் பாதுகாக்கிறது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மை வடிவம் முழுமையைக் குறிக்கிறது; எதை எல்லாம் விட்டார்கள் என்பதை உரையில் இல்லாத வகையில் குறிப்பாக்காமல் அதன் விரிவைத் தக்கவைக்கிறது.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்பற்றினார்கள்
  rationale: இது உடல்ரீதியாகப் பின்னால் செல்வதையும் சீடத்துவத்தையும் சுட்டக்கூடும்; கூடுதல் விளக்கம் சேர்க்காமல் இரு நிழற்பொருள்களையும் தக்கவைக்கிறது.
theological_decisions:
- issue: πάντα என்பதில் துறந்தவற்றின் வரம்பு
  choice: அவர்கள் எல்லாவற்றையும் விட்டுவிட்டு
  alternative: அவர்கள் அனைத்தையும் விட்டுவிட்டு
  rationale: மூலவுரை முழுமையான விட்டுவிடுதலைக் கூறுகிறது; அது நிரந்தர உடைமைத் துறப்பா அல்லது குறிப்பாக என்னென்னவற்றை உள்ளடக்கியது என்பதைக் கூடுதலாகத் தீர்மானிக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. மூலத்தின் செயல்வரிசையும் ‘எல்லாவற்றையும்’ என்ற முழுமையின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
