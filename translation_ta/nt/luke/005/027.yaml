source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு அவர் வெளியே சென்று, லேவி என்னும் வரிவசூலிப்பவர் வரிவசூல் சாவடியில்[b] அமர்ந்திருப்பதைக் கண்டார்[a]. அவரிடம், “என்னைப் பின்பற்று” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவனித்தார்” அல்லது “உற்றுப் பார்த்தார்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் மேலோட்டமாகப் பார்ப்பதைவிடக் கவனமான பார்வையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “சுங்கச் சாவடியில்” அல்லது “சுங்கம் வசூலிக்கும் இடத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரைப் பாதுகாத்து, லூக்காவின் நிகழ்வுத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்றார்
  rationale: வினைச்சொல் குறிக்கும் இடமாற்றத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐθεάσατο
  choice: கண்டார்
  rationale: சூழலில் இயல்பான தமிழ்; கிரேக்கச் சொல் கவனித்துப் பார்த்தல் என்ற கூடுதல் நுணுக்கத்தையும் கொள்ளக்கூடும் என்பதால் மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: τελώνην
  choice: வரிவசூலிப்பவர்
  rationale: அரசுக்கான வரி அல்லது சுங்கத் தொகைகளை வசூலித்த பணியைத் தெளிவாகக் குறிக்கும், பொதுவாகப் புரியும் நவீனத் தமிழ்.
- source_word: ὀνόματι Λευὶν
  choice: லேவி என்னும்
  rationale: பெயரைக் குறிப்பிடும் கிரேக்கத் தொடருக்கான சுருக்கமான, இயல்பான தமிழ் அமைப்பு.
- source_word: καθήμενον
  choice: அமர்ந்திருப்பதை
  rationale: லேவி தமது பணியிடத்தில் இருந்த நிலையை நிகழ்வுணர்வுடன் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὸ τελώνιον
  choice: வரிவசூல் சாவடியில்
  rationale: வரி அல்லது சுங்கம் வசூலிக்கப்பட்ட இடத்தைக் காட்சிப்படுத்தும் தெளிவான தமிழ்; இடப்பொருளைச் சூழலுக்கேற்ப தருகிறது.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்று
  rationale: நேரடியான கட்டளையையும் சீடத்துவ அழைப்பின் வலிமையையும் விளக்கச் சொற்கள் சேர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளையில் உள்ள சீடத்துவ அழைப்பு
  choice: “என்னைப் பின்பற்று” என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: “என் சீடனாகு” அல்லது “என் சீடனாக என்னைப் பின்பற்று”
  rationale: சூழலில் இது சீடத்துவ அழைப்பாக இருந்தாலும், கிரேக்க வாசகம் நேரடியாக ‘என்னைப் பின்பற்று’ என்றே கூறுகிறது; ஆகவே உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. மூலத்தின் நிகழ்வுத் தொடரும் நேரடியான கட்டளையும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் அவற்றின் விளக்கங்களோடு பொருந்தாத இடங்களில் இருந்ததால், தமிழில் [a] ‘கண்டார்’ என்பதற்குப் பின்னும் [b] ‘வரிவசூல் சாவடியில்’ என்பதற்குப் பின்னும் பொருளுக்கேற்றவாறு வைக்கப்பட்டுள்ளன.
