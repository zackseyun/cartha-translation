  source_fidelity: 'மூலக் கிரேக்கத்தின் நிகழ்வுவரிசை துல்லியமாகக் காக்கப்பட்டுள்ளது: μετὰ ταῦτα என்பதன் பன்மைச் சுட்டல் “இவற்றுக்குப் பிறகு” எனவும், ἐξῆλθεν “வெளியே சென்று” எனவும், ἐθεάσατο “கண்டார்” எனவும், τελώνης “வரிவசூலிப்பவர்” எனவும் சரியாக வழங்கப்பட்டுள்ளன. லேவி சாவடியில் அமர்ந்திருந்தார் என்பதும், இயேசுவின் நேரடியான நிகழ்காலக் கட்டளை “என்னைப் பின்பற்று” என்பதும் மூலத்துக்கு ஏற்ப உள்ளன.'
