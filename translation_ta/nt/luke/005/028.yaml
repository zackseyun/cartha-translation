    text: அல்லது, “எல்லாவற்றையும் விட்ட பின்பு, அவன் எழுந்து அவரைப் பின்பற்றினான்.”
    reason: கிரேக்க வினையெச்சம் முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலைக் குறிக்கக்கூடிய இலக்கண மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: καταλιπὼν
  choice: விட்டுவிட்டு
  rationale: καταλείπω என்பதன் இறந்தகால வினையெச்சம்; முதன்மைச் செயலுக்கு முன் நிகழ்ந்த தீர்மானமான விலகலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. ‘கைவிட்டு’ என்பதைக் காட்டிலும் தேவையற்ற கடுமையைச் சேர்க்காது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மை வடிவத்தின் முழுமையான பரப்பைத் தக்கவைக்கிறது; லேவி விட்டுச் சென்றவற்றின் தன்மையை வசனம் மேலும் வரையறுக்கவில்லை.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: ἀνίστημι என்பதன் இறந்தகால வினையெச்சத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அடுத்த செயலை மேற்கொள்ள எழுவதைக் குறிக்கிறது.
- source_word: ἠκολούθει
  choice: பின்பற்றினான்
  rationale: ἀκολουθέω என்பதன் நிறைவுறா இறந்தகால வடிவம் தொடர்ச்சியான சீடத்துவத்தை உணர்த்தக்கூடும்; எனினும் இக்கதைச் சூழலில் எளிய இறந்தகாலம் இயல்பாக இருந்து, தொடர்ச்சியை மறுப்பதில்லை.
- source_word: αὐτῷ
  choice: அவரைப்
  rationale: உடனடியான சூழலில் இயேசுவைக் குறிக்கும் பதிலிப்பெயரைப் பாதுகாக்கிறது; தமிழில் இயேசுவுக்குரிய மரியாதைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: முந்தைய வசனத்துடன் உள்ள தொடர்ச்சி தமிழின் வாக்கிய ஓட்டத்தில் இயல்பாகவே வெளிப்படுகிறது; தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது தேவையற்ற நுண்பொருளை உண்டாக்கலாம்.
theological_decisions:
- issue: சீடத்துவத்தில் லேவி விட்டுச் சென்றவற்றின் பரப்பு
  choice: ‘எல்லாவற்றையும்’ என்ற முழுமையான சொல்லை அப்படியே தக்கவைத்து, அவன் இயேசுவின் அழைப்புக்கு அளித்த தீர்மானமான பதிலை வெளிப்படுத்துதல்
  alternative: அவன் தன் வேலையை மட்டும் தற்காலிகமாக விட்டான் அல்லது தன் உடைமைகள் அனைத்தையும் நிரந்தரமாகத் துறந்தான் என்று குறிப்பாக விளக்குதல்
  rationale: πάντα முழுமையை வலியுறுத்துகிறது; ஆனால் உடைமை அல்லது தொழிலைப் பற்றிய நிரந்தரக் கோட்பாட்டை இவ்வசனம் தனியாக வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: ἠκολούθει என்ற நிறைவுறா இறந்தகாலத்தின் பொருள்
  choice: ‘பின்பற்றினான்’
  alternative: ‘பின்பற்றத் தொடங்கினான்’ அல்லது ‘தொடர்ந்து பின்பற்றினான்’
  rationale: கிரேக்க வடிவம் தொடக்கத்தையோ தொடர்ச்சியையோ உணர்த்தக்கூடும்; இச்சூழலில் அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் இயல்பான தமிழ் இறந்தகாலம் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. லேவிக்குத் ‘அவன்/பின்பற்றினான்’ என்றும் இயேசுவுக்கு மரியாதை வடிவமான ‘அவரைப்’ என்றும் பயன்படுத்தி இரு நபர்களும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளனர்.
