  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: ta
  text: எல்லாவற்றையும் விட்டுவிட்டு[a], அவன் எழுந்து அவரைப் பின்பற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
