  source_fidelity: 'மொழிபெயர்ப்பு கிரேக்க மூலத்தின் செயல்வரிசையைத் துல்லியமாகக் காக்கிறது: கையை நீட்டுதல், அவனைத் தொடுதல், விருப்பத்தைத் தெரிவித்தல், தூய்மையாக்கும் கட்டளை, உடனடியான நோய் நீக்கம் ஆகிய அனைத்தும் உள்ளன. καθαρίσθητι என்பதன் செயப்பாட்டு/தூய்மை சார்ந்த வலிமை “தூய்மையாக்கப்படு” என்பதில் பாதுகாக்கப்பட்டுள்ளது; அதை வெறும் குணமடைதல் எனக் குறைக்கவில்லை.'
