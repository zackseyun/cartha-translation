source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: ta
  text: அவர் தமது கையை நீட்டி அவனைத் தொட்டு, “எனக்கு விருப்பம் உண்டு; தூய்மையாக்கப்படு” என்றார். உடனே தொழுநோய்[a] அவனைவிட்டு நீங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விரிவான பொருளில், “கடுமையான தோல் நோய்.” வேதாகமப் பயன்பாட்டில் λέπρα என்ற கிரேக்கச் சொல், இக்காலத்தில் தொழுநோய் என்று அழைக்கப்படும் ஹான்சன் நோயை மட்டும் அல்லாமல் பலவகையான கடுமையான தோல் நோய்களையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: தமது கையை நீட்டி
  rationale: முதன்மை வினைக்கு முன் நிகழும் உடல் அசைவை இயல்பான தமிழில் தெரிவிக்கிறது; χεῖρα என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: ἥψατο αὐτοῦ
  choice: அவனைத் தொட்டு
  rationale: ἅπτομαι உடன் வரும் கிரேக்க வேற்றுமை அமைப்பைத் தமிழில் இயல்பான நேர்செயப்படுபொருள் தொடராக வழங்குகிறது.
- source_word: Θέλω
  choice: எனக்கு விருப்பம் உண்டு
  rationale: வெறும் எதிர்காலத்தைக் காட்டாமல், குணமாக்குவதற்கான விருப்பத்தையும் மனமுவந்த சம்மதத்தையும் தெரிவிக்கிறது.
- source_word: καθαρίσθητι
  choice: தூய்மையாக்கப்படு
  rationale: இது இறந்தகால வினையல்ல, கட்டளைப் பொருளுள்ள இறந்தநிலைச் செயப்பாட்டு வடிவம்; உடல் குணமடைதலோடு தூய்மை மீட்கப்படுவதையும் காக்கிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: காலத் தாமதமின்றி நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λέπρα
  choice: தொழுநோய்
  rationale: நற்செய்தி நூல்களின் சூழலில் பரவலாக அறியப்பட்ட மரபான தமிழ் சொல்; பண்டைய கிரேக்கச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: அவனைவிட்டு நீங்கியது
  rationale: நோய் உடனடியாக அகன்றதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் ‘அவனிடமிருந்து சென்றது’ என்ற உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: தொழுநோயாளியின் குணமாக்குதலில் καθαρίσθητι என்பதன் மொழிபெயர்ப்பு
  choice: தூய்மையாக்கப்படு
  alternative: குணமடை; தூய்மையாகு
  rationale: கிரேக்கச் சொல் மருத்துவக் குணமடைதலை மட்டும் அல்லாமல் தூய்மை மீட்கப்படுவதையும் குறிக்கிறது. செயப்பாட்டு வடிவத்தையும் தூய்மை சார்ந்த பொருளையும் இந்தத் தேர்வு காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; எளிதில் புரியக்கூடியதாய் இருந்தாலும் நிகழ்வின் கண்ணியத்தையும் மூலத்தின் சுருக்கமான ஓட்டத்தையும் காக்கிறது. நோயைக் குறித்த அடிக்குறிப்பு குறியீடு அதற்குரிய ‘தொழுநோய்’ என்ற சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
