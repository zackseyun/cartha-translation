source:
  edition: SBLGNT
  text: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: ta
  text: ஆனால் புதிய திராட்சைரசத்தைப் புதிய தோல் பைகளில்[a] ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புதிய திராட்சைரசத்தைப் புதிய தோல் பைகளில் ஊற்ற வேண்டும்.” கிரேக்கத்தில் திராட்சைரசத்திற்கு νέος (முக்கியமாக காலத்தின் அடிப்படையில் “புதியது”) என்றும், தோல் பைகளுக்கு καινός (தரம் அல்லது நிலையின் அடிப்படையில் “புதியது/புத்தம்புதிய நிலையில் உள்ள”) என்றும் இரண்டு வெவ்வேறு பெயரடைகள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பொருந்தாத செயலுக்கு மாறாக, இங்கு செய்ய வேண்டிய சரியான செயலை அறிமுகப்படுத்தும் எதிர்மறை இணைப்புச்சொல்.
- source_word: οἶνον νέον
  choice: புதிய திராட்சைரசத்தை
  rationale: νέον என்பது காலத்தின் அடிப்படையில் புதியதைக் குறிக்கிறது; இங்கு புதிதாகத் தயாரிக்கப்பட்ட திராட்சைரசம் பொருள்.
- source_word: εἰς
  choice: -இல்
  rationale: தமிழில் ‘ஊற்று’ என்ற வினையுடன் இடப்பொருள் வேற்றுமை இயல்பாகவே ஒரு கொள்கலனுக்குள் செலுத்தப்படுவதைக் காட்டுகிறது.
- source_word: ἀσκοὺς
  choice: தோற்பைகளில்
  rationale: ἀσκός என்பது திராட்சைரசம் போன்ற திரவங்களை வைத்திருக்கப் பயன்படுத்தப்பட்ட விலங்குத்தோல் கொள்கலனைக் குறிக்கிறது.
- source_word: καινοὺς
  choice: புதுப்பிக்கப்பட்ட
  rationale: νέος என்பதிலிருந்து சொல் வேறுபாட்டைக் காக்கவும், புதிய திராட்சைரசத்திற்கு ஏற்ற நல்ல நிலையில் உள்ள, நெகிழ்வான தோற்பைகள் என்ற கருத்தைத் தெரிவிக்கவும் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: βλητέον
  choice: ஊற்ற வேண்டும்
  rationale: இந்த வினையடை வடிவம் அவசியத்தை அல்லது செய்ய வேண்டிய முறையைத் தெரிவிக்கிறது; திரவத்தைத் தோற்பையில் இடுவதற்கு ‘ஊற்ற வேண்டும்’ இயல்பான தமிழ்.
theological_decisions:
- issue: ஒரே வாக்கியத்தில் νέος மற்றும் καινός ஆகியவற்றை வேறுபடுத்துதல்
  choice: νέος என்பதற்கு ‘புதிய’ என்றும் καινός என்பதற்கு ‘புதுப்பிக்கப்பட்ட’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘புதிய’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கம் இரண்டு வெவ்வேறு பெயரடைகளைப் பயன்படுத்துகிறது. அவற்றின் வேறுபாட்டை முடிந்தவரை காப்பது, புதிய திராட்சைரசத்திற்குப் பொருத்தமான நல்ல நிலையிலுள்ள தோற்பைகள் என்ற உவமையின் மையக் கருத்தை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மற்றொரு நேரடி மொழிபெயர்ப்பையும் பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை. ‘தோற்பைகள்’ என்ற பண்பாட்டு பொருள் சுருக்கமாக வைக்கப்பட்டு, கிரேக்கப் பெயரடைகளின் நுண்ணிய வேறுபாடு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
