    issue: ‘புதுப்பிக்கப்பட்ட தோற்பைகள்’ for καινοὺς
    rationale: ‘புதுப்பிக்கப்பட்ட’ normally denotes something restored or renovated. It does not faithfully convey new/fresh wineskins and may suggest old skins repaired for reuse.
  - severity: low
    issue: Footnote gloss ‘புத்துணர்வானது’
    rationale: This is not a natural or accurate description of wineskins in Tamil. ‘புதிய/புத்தம்புதிய நிலையில் உள்ள’ better communicates the quality/condition nuance of καινός.
