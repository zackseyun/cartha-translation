  naturalness: ‘தனிமையான இடங்களுக்குச் ஒதுங்கிச் சென்று ஜெபித்துவந்தார்’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. இது ‘விலகிச் சென்று’ என்பதைக் காட்டிலும் ὑποχωρέω-வின் ஒதுங்குதல்/பின்வாங்குதல் நுணுக்கத்தைச் சிறப்பாகத் தருகிறது. அடிக்குறிப்பிலுள்ள மாற்று வாசகமும் இயல்பாக்கப்பட்டுள்ளது.
