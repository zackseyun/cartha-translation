  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: ta
  text: ஆனால், அவரோ தனிமையான இடங்களுக்குச் ஒதுங்கிச் சென்று ஜெபித்துவந்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரோ தனிமையான இடங்களில் ஒதுங்கிக்கொண்டும் ஜெபித்துக்கொண்டும் இருந்தார்.” கிரேக்கத்தில் இறந்தகால வினையுடன் நிகழ்காலப் பங்கேற்புவினைகள் இணைந்த அமைப்பு உள்ளது; அது தொடர்ச்சியான அல்லது வழக்கமான செயலைக் குறிக்கலாம்.
    reason: கிரேக்க வினையமைப்பின் அதிகச் சொற்படியான மாற்றையும் அதன் தொடர்ச்சி அல்லது வழக்கத்தன்மை குறித்த நுணுக்கத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: αὐτὸς
  choice: அவரோ
  rationale: வெளிப்படையாகக் கொடுக்கப்பட்டுள்ள பதிலிடுபெயரின் மிதமான அழுத்தத்தையும், முந்தைய நிகழ்வுடன் உள்ள வேறுபாட்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: 'சுற்றியுள்ள கதையோட்டத்தில் காணப்படும் மிதமான முரண்பாட்டை வெளிப்படுத்துகிறது: அவரைப் பற்றிய செய்தி பரவியபோதிலும் அவர் தனிமையை நாடினார்.'
- source_word: ἦν ὑποχωρῶν
  choice: விலகிச் சென்று … வந்தார்
  rationale: இறந்தகால εἰμί வினையுடன் நிகழ்காலப் பங்கேற்புவினை சேர்ந்த அமைப்பு தொடர்ச்சியான அல்லது வழக்கமான செயலைக் குறிக்கிறது. ‘வந்தார்’ என்ற துணைவினை தமிழில் அந்த வழக்கமான செயலை இயல்பாக உணர்த்துகிறது.
- source_word: ἐν ταῖς ἐρήμοις
  choice: தனிமையான இடங்களுக்கு
  rationale: பன்மையில் உள்ள ἔρημος மக்கள் வசிப்பில்லாத, ஒதுக்கமான இடங்களைக் குறிக்கிறது. ‘தனிமையான இடங்கள்’ என்பது குறிப்பிட்ட பாலைவனப் பகுதியைத் தவறாக உணர்த்தாமல் பொருளைத் தருகிறது; விலகிச் செல்லும் இயக்கத்தோடு இலக்கு வேற்றுமை தமிழில் இயல்பாக உள்ளது.
- source_word: καὶ
  choice: சென்று
  rationale: இரு செயல்களையும் இயல்பான தமிழ் தொடர்வினை அமைப்பில் இணைக்கிறது.
- source_word: προσευχόμενος
  choice: ஜெபித்துவந்தார்
  rationale: விலகிச் செல்வதுடன் இணைந்த, மீண்டும் மீண்டும் நிகழ்ந்த ஜெபச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் செயலின் காலத்தன்மை
  choice: தனிமையான இடங்களுக்கு விலகிச் சென்று ஜெபிப்பது இயேசுவின் வழக்கமான நடைமுறை என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஒரே ஒரு சந்தர்ப்பத்தில் அவர் விலகிச் சென்று ஜெபித்தார் என்று எடுத்துக்கொள்ளலாம்.
  rationale: ἦν என்பதுடன் நிகழ்காலப் பங்கேற்புவினைகள் இணையும் கிரேக்க அமைப்பு, ஒரே நிகழ்வைவிட கடந்தகாலத்தில் தொடர்ந்த அல்லது வழக்கமாக நடந்த செயலை இயல்பாகக் குறிக்கிறது. இதற்கு மேல் எந்தக் கோட்பாட்டு முடிவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரோ’ மிதமான அழுத்தத்தையும் முரண்பாட்டையும் தருகிறது; ‘தனிமையான இடங்கள்’ என்பது ‘பாலைவனம்’ என்ற தேவையற்ற நிலவியல் குறிப்பைத் தவிர்க்கிறது.
