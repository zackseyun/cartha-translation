source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: ta
  text: அந்த நாட்களில் ஒருநாள், இயேசு கற்பித்துக்கொண்டிருந்தார். அங்கே பரிசேயர்களும் திருச்சட்டப் போதகர்களும் உட்கார்ந்திருந்தார்கள். அவர்கள் கலிலேயா, யூதேயா ஆகிய பகுதிகளிலுள்ள ஒவ்வொரு கிராமத்திலிருந்தும் எருசலேமிலிருந்தும் வந்திருந்தார்கள். குணமாக்குவதற்கான ஆண்டவரின் வல்லமை அவரோடு இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அவர் குணமாக்குவதற்காக” என்பதற்குப் பதிலாக, “அவர்களைக் குணமாக்குவதற்கு” என்று காணப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: அந்த நாட்களில் ஒருநாள்
  rationale: லூக்காவின் நிகழ்வு அறிமுகச் சொற்றொடரை நவீன தமிழில் இயல்பாகத் தருகிறது; ‘அப்போது நிகழ்ந்ததாவது’ போன்ற தேவையற்ற கனமான நடையைத் தவிர்க்கிறது.
- source_word: αὐτὸς ἦν διδάσκων
  choice: இயேசு கற்பித்துக்கொண்டிருந்தார்
  rationale: நீடித்துக்கொண்டிருந்த செயலைத் தமிழ் வினைவடிவம் வெளிப்படுத்துகிறது. தமிழில் சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க சூழலால் தெளிவான ‘இயேசு’ பயன்படுத்தப்பட்டுள்ளது; αὐτός இங்கு தனிப்பட்ட வலியுறுத்தலைக் கோரவில்லை.
- source_word: καθήμενοι
  choice: உட்கார்ந்திருந்தார்கள்
  rationale: அவர்கள் அங்கே நிலையாக அமர்ந்திருந்த காட்சியை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவுக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: νομοδιδάσκαλοι
  choice: திருச்சட்டப் போதகர்கள்
  rationale: மோசேயின் சட்டத்தைப் போதிப்பவர்களைச் சுட்டுகிறது; ‘திருச்சட்டம்’ என்பது இங்கு சாதாரண நாட்டுச் சட்டம் அல்ல, வேதாகமச் சட்டம் என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐληλυθότες
  choice: வந்திருந்தார்கள்
  rationale: முன்னரே வந்து அங்கே இருந்த நிலையை கிரேக்க perfect participle-க்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἐκ πάσης κώμης
  choice: ஒவ்வொரு கிராமத்திலிருந்தும்
  rationale: κώμη என்பதன் கிராமப்புறக் குடியிருப்பு பொருளையும் πάσης என்பதன் பகிர்வுப் பொருளையும் காக்கிறது.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: கலிலேயா, யூதேயா ஆகிய பகுதிகளிலுள்ள ஒவ்வொரு கிராமத்திலிருந்தும் எருசலேமிலிருந்தும்
  rationale: கலிலேயா மற்றும் யூதேயா பகுதிகள்; எருசலேம் நகரம் என்ற புவியியல் வேறுபாட்டைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: δύναμις κυρίου
  choice: ஆண்டவரின் வல்லமை
  rationale: தெய்வீக ஆற்றலைக் குறிக்கும் δύναμις என்பதற்கு ‘வல்லமை’ பொருத்தமான வேதாகமத் தமிழாகும்; κύριος என்பதற்கு ‘ஆண்டவர்’ வழங்கப்பட்டுள்ளது.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: குணமாக்குவதற்கான ஆண்டவரின் வல்லமை அவரோடு இருந்தது
  rationale: SBLGNT-இன் αὐτόν வாசகத்தை முன்னிறுத்தி, குணமாக்கும் வல்லமை இயேசுவோடு இருந்தது எனத் தமிழில் இயல்பாக வழங்குகிறது; இல்லாத பன்மைச் செயப்படுபொருளை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: δύναμις κυρίου என்பதில் κύριος யாரைக் குறிக்கிறது
  choice: ‘ஆண்டவரின் வல்லமை’ என்று திறந்த நிலையில் வைக்கப்பட்டது
  alternative: ‘கடவுளின் வல்லமை’ என்று குறிப்பாக விளக்குதல்
  rationale: κύριος என்ற மூலச்சொல்லின் வடிவத்தையும் இறையியல் ஒலிப்பையும் காத்து, அதன் குறிப்பை மொழிபெயர்ப்பிலேயே தேவையின்றி குறுக்கவில்லை.
- issue: ἦν εἰς τὸ ἰᾶσθαι αὐτόν என்பதன் பொருளும் உரைவேறுபாடும்
  choice: ஆண்டவரின் வல்லமை இயேசுவோடு குணமாக்குவதற்காக இருந்தது
  alternative: ‘அவர்களைக் குணமாக்குவதற்கு ஆண்டவரின் வல்லமை இருந்தது’
  rationale: கொடுக்கப்பட்ட SBLGNT உரை αὐτόν என்று வாசிக்கிறது; ஆகவே முதன்மை உரையில் ‘அவர்களை’ சேர்க்கவில்லை. அதேவேளை, கிரேக்கக் கட்டமைப்பின் சற்றுக் கடினமான தன்மையையும் முக்கியமான பன்மை உரைவேறுபாட்டையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியும், அதேவேளை கண்ணியமான வேதாகம நடை. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக நான்கு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’, ‘ஆண்டவர்’, ‘வல்லமை’ ஆகியவை சூழலுக்கேற்ற நிலைபெற்ற சொற்கள்.
