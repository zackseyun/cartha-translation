source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: ta
  text: லேவி தன் வீட்டில் அவருக்காக ஒரு பெரிய விருந்து ஏற்பாடு செய்தான். வரி வசூலிப்பவர்களும் மற்றவர்களும் பெருந்திரளாக அவர்களோடு[a] பந்தியில் சாய்ந்து அமர்ந்திருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘அவர்களோடு’ என்று பன்மையில் உள்ளது. இந்தப் பன்மை விருந்தில் இருந்த குழுவைக் குறிக்கிறது; அந்தக் குழுவில் இயேசுவும் அடங்கியிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: பண்டைய மத்தியதரைக் கடல் உலகில் முறையான விருந்துகளின்போது மக்கள் பந்தியைச் சுற்றிச் சாய்ந்த நிலையில் உணவருந்துவது வழக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: ஒரு பெரிய விருந்து
  rationale: δοχή என்பது விருந்தோம்பலுடன் கூடிய விருந்து அல்லது விருந்துக் கூடுகையைக் குறிக்கிறது. ‘பெரிய விருந்து’ என்பது பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: αὐτῷ
  choice: அவருக்காக
  rationale: இந்தப் பதிலிப்பெயர் உடனடி சூழலில் இயேசுவைக் குறிக்கிறது. மூலத்தின் பதிலிப்பெயர் வடிவத்தைத் தமிழிலும் காக்கிறது.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: தன் வீட்டில்
  rationale: வீடு லேவிக்குரியது என்பதைத் தமிழில் இயல்பாகவும் குழப்பமின்றியும் தெரிவிக்கத் தற்சுட்டுப் பதிலிப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὄχλος πολὺς τελωνῶν καὶ ἄλλων
  choice: வரி வசூலிப்பவர்களும் மற்றவர்களும் பெருந்திரளாக
  rationale: ὄχλος πολὺς என்பதன் பெருந்திரள் என்ற கருத்தையும், ἄλλων என்பதன் குறிப்பிடப்படாத தன்மையையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: τελωνῶν
  choice: வரி வசூலிப்பவர்கள்
  rationale: நற்செய்தி நூல்களின் சமூகச் சூழலில் τελώνης என்பதற்கான தெளிவான, பொதுவாகப் புரியும் நவீனத் தமிழ்ச் சொல்.
- source_word: μετ’ αὐτῶν
  choice: அவர்களோடு
  rationale: மூலத்தில் உள்ள பன்மைப் பதிலிப்பெயரை நேரடியாகக் காக்கிறது; அது விருந்தில் இருந்த மையக் குழுவோடு இணைந்திருப்பதைச் சுட்டுகிறது.
- source_word: κατακείμενοι
  choice: பந்தியில் சாய்ந்தமர்ந்திருந்தார்கள்
  rationale: பண்டைய மத்தியதரைக் கடல் உலகில் முறையான விருந்தின்போது உணவருந்திய சாய்ந்திருக்கும் நிலையையும், இது உணவு மேசைச் சூழல் என்பதையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: μετ’ αὐτῶν என்பதிலுள்ள பன்மைப் பதிலிப்பெயரின் குறிப்பு
  choice: அவர்களோடு
  alternative: அவரோடு
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவம் பிரதான உரையில் காக்கப்பட்டுள்ளது. இருப்பினும் நிகழ்ச்சியின் மையத்தில் இயேசு இருப்பதால், பொருள் நோக்கில் அவரோடு உணவருந்தினார்கள் என வாசிக்கப்படலாம்; இதை அடிக்குறிப்பு தெரிவிக்கிறது, ஆனால் ஒருமையை மூல உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் வீட்டில்’ என்பது தமிழில் உரிமையாளரை இயல்பாகத் தெளிவுபடுத்துகிறது; ‘பந்தியில் சாய்ந்தமர்ந்திருந்தார்கள்’ என்பது பண்டைய உணவருந்தும் வழக்கை மிகையாக விளக்காமல் பிரதிபலிக்கிறது.
