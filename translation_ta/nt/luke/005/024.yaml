id: LUK.5.24
reference: Luke 5:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: ta
  text: 'ஆனால், பாவங்களை மன்னிக்க மனிதகுமாரனுக்குப்[a] பூமியில் அதிகாரம் உண்டு என்பதை நீங்கள் அறிந்துகொள்ளும்படி—அவர் முடங்கியவரிடம், “நான் உனக்குச் சொல்கிறேன்: எழுந்திரு; உன் படுக்கைப் பாயை[b] எடுத்துக்கொண்டு உன் வீட்டுக்குப் போ” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மானிட மகன்’ அல்லது ‘மனிதனின் மகன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இது இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் பட்டம்; தானியேல் 7-ன் எதிரொலியையும் கொண்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘சிறிய படுக்கை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சிறிய படுக்கை, விரிப்பு அல்லது பாயைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: ஆனால் ... நீங்கள் அறிந்துகொள்ளும்படி
  rationale: δέ குறிக்கும் மென்மையான மாறுபாட்டை ‘ஆனால்’ என்றும், ἵνα உடன் வரும் நோக்கத்தை ‘அறிந்துகொள்ளும்படி’ என்றும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயகுறிப்பாகவும் தானியேல் 7-ஐ எதிரொலிக்கும் பட்டமாகவும் உள்ள சொற்றொடரை விளக்கவுரையாகச் சுருக்காமல், தமிழில் நிலைபெற்ற வேதாகமப் பட்டமாகத் தருகிறது.
- source_word: ἐξουσίαν ἔχει
  choice: அதிகாரம் உண்டு
  rationale: வெறும் வல்லமையை அல்ல, பாவங்களை மன்னிப்பதற்கான உரிமையுள்ள அதிகாரத்தை ἐξουσία குறிக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரை விளக்கவுரை சேர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: ἀφιέναι ἁμαρτίας
  choice: பாவங்களை மன்னிக்க
  rationale: இந்தச் சூழலில் ἀφίημι என்பது பாவங்களை மன்னித்தல் அல்லது நீக்குதல் என்ற பொருளில் வருகிறது; ‘மன்னிக்க’ தெளிவான நவீன தமிழ்.
- source_word: τῷ παραλελυμένῳ
  choice: முடக்குவாதமுற்றவனை
  rationale: உடல் இயக்கம் முடங்கியிருந்த நபரைத் துல்லியமாகவும் சுருக்கமாகவும் குறிக்கிறது; இழிவுபடுத்தும் பெயரிடலைத் தவிர்க்கிறது.
- source_word: Σοὶ λέγω
  choice: நான் உனக்குச் சொல்கிறேன்
  rationale: Σοί என்பதிலுள்ள நேரடியான வலியுறுத்தலையும் கட்டளையின் கண்ணியமான தொனியையும் காக்கிறது.
- source_word: ἔγειρε
  choice: எழுந்திரு
  rationale: உடனடியாக எழும்புமாறு கூறும் ஒருமை கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: ἄρας
  choice: எடுத்துக்கொண்டு
  rationale: படுக்கைப் பாயைத் தூக்கி எடுத்துச் செல்வதைக் குறிக்கும் αἴρω-வின் சூழல்சார் பொருளைத் தருகிறது.
- source_word: κλινίδιόν σου
  choice: உன் படுக்கைப் பாய்
  rationale: κλινίδιον குறிக்கும் சிறிய படுக்கை, விரிப்பு அல்லது பாயின் இயல்பை ‘படுக்கைப் பாய்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: உன் வீட்டுக்குப் போ
  rationale: இலக்கையும் இயக்கக் கட்டளையையும் நவீன தமிழில் எளிமையாகவும் துல்லியமாகவும் தருகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மானிட மகன் / மனிதனின் மகன்
  rationale: இது கிறிஸ்துவைப் பற்றிய பட்டமாகச் செயல்பட்டு தானியேல் 7-ன் எதிரொலியையும் கொண்டிருக்கலாம். ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற வடிவம் அந்த வேதாகமத் தொடர்பையும் சொற்றொடரின் பொருள் நெருக்கடியையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- issue: பாவங்களை மன்னிப்பதில் ἐξουσία-வின் நுட்பம்
  choice: அதிகாரம்
  alternative: வல்லமை
  rationale: இங்கு விவாதிக்கப்படுவது அற்புதம் செய்யும் ஆற்றல் மட்டும் அல்ல; பாவங்களை மன்னிக்கும் உரிமையுள்ள அதிகாரம். ஆகவே ‘அதிகாரம்’ பொருத்தமானது.
- issue: ἐπὶ τῆς γῆς என்பதன் குறிப்பு
  choice: பூமியில்
  alternative: பூமிக்குரிய உலகில்
  rationale: மூலத்தின் சுருக்கமான இடக்குறிப்பை விரிவான இறையியல் விளக்கமாக மாற்றாமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தில் நோக்கவாக்கியத்தை இடைநிறுத்தும் நீண்ட கோடு பாதுகாக்கப்பட்டுள்ளது; நேரடியான கட்டளைக்கு இயல்பான ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
