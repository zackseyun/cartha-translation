  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: ta
  text: 'பரிசேயர்களும் அவர்களுடைய வேத அறிஞர்களும் இயேசுவின் சீடர்களிடம் முணுமுணுத்துக்கொண்டிருந்தார்கள்[a]: “நீங்கள் ஏன் வரி வசூலிப்பவர்களோடும் பாவிகளோடும் சேர்ந்து சாப்பிடுகிறீர்கள், குடிக்கிறீர்கள்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறை கூறிக்கொண்டிருந்தார்கள்.” கிரேக்க வினைச்சொல் வெளிப்படையான முறையீட்டை மட்டுமல்லாமல், அதிருப்தியுடன் முணுமுணுப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: முணுமுணுத்து
  rationale: குறை கூறும் தொனியில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் முணுமுணுத்ததை இறந்தகால முற்றா வினை உணர்த்துகிறது; தமிழ் வாக்கியத்தில் துணைவினைச் சூழலுடன் இந்தத் தொடர்ச்சியான குறைகூறல் இயல்பாக வெளிப்படுகிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: யூத மறைநூல்களையும் சட்டத்தையும் ஆராய்ந்து போதித்த வரலாற்றுக் குழுவை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது; வெறும் எழுத்தர் என்ற தவறான நவீனப் பொருளைத் தவிர்க்கிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: இப்பெயர்ச்சொல் இயல்பாகப் பரிசேயர்களுடன் தொடர்புடைய வேத அறிஞர்களைக் குறிக்கிறது; கிரேக்கத் தொடரின் உறவைத் தக்கவைக்கிறது.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: இயேசுவின் சீடர்களிடம்
  rationale: πρός இங்கு பேச்சின் திசையைக் குறிக்கிறது. ‘அவருடைய’ என்பதற்குப் பதிலாக ‘இயேசுவின்’ என்பது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணம் கேட்கும் கிரேக்க வினாவுக்கான இயல்பான, நேரடியான தமிழ் இணை.
- source_word: τελωνῶν
  choice: வரி வசூலிப்பவர்கள்
  rationale: அரசு அல்லது ஆட்சியாளருக்காக வரி, சுங்கம் வசூலித்த சமூகக் குழுவைத் தெளிவாகக் குறிக்கும் வழக்கமான நவீன தமிழ் சொற்றொடர்.
- source_word: ἁμαρτωλῶν
  choice: பாவிகள்
  rationale: பேசுவோரால் ஒழுக்க மற்றும் சமய ரீதியாகக் குறிக்கப்பட்ட வகுப்பை நேரடியாகப் பாதுகாக்கும் மரபான இணை; விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
- source_word: ἐσθίετε καὶ πίνετε
  choice: சாப்பிடுகிறீர்கள், குடிக்கிறீர்கள்
  rationale: இரண்டு தனித்த வினைகளையும் காத்து, நிகழ்காலப் பொதுவான குற்றச்சாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -உம் ... -உம்
  rationale: வசனத் தொடக்க இணைப்பைத் தமிழின் இயல்பான இணைப்பும்மை அமைப்புக்குள் வெளிப்படுத்துகிறது; தனியே ‘மேலும்’ சேர்ப்பது தேவையில்லை.
theological_decisions:
- issue: ‘வரி வசூலிப்பவர்களோடும் பாவிகளோடும்’ உணவு உறவு கொள்வதன் சமூக-சமயப் பொருள்
  choice: குற்றச்சாட்டை அதன் தெளிவான உணவு மற்றும் குடிப்புச் சொற்களோடு அப்படியே வைத்தல்
  alternative: சடங்கு தூய்மை மீறல் அல்லது ஒழுக்க அங்கீகாரம் என்று விளக்கிப் பொழிப்புரை செய்தல்
  rationale: வசனம் அந்த உறவின் முழு காரணவிளக்கத்தை வழங்காமல், பேசுவோரின் வகைப்பாடுகளையும் இயேசுவின் சீடர்களின் மேசை உறவையும் மட்டும் முன்வைக்கிறது. மொழிபெயர்ப்பு அந்த இறையியல் மற்றும் சமூக இழுபறியைத் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வேத அறிஞர்கள்’ என்பது வரலாற்றுச் செயல்பாட்டைத் தெளிவாக்குகிறது; ‘சேர்ந்து’ என்பது μετά குறிக்கும் உடனிருப்பை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு உரையில் [a] எனச் சேர்க்கப்பட்டுள்ளது.
