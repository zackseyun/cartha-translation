  source_fidelity: ‘அப்போது’ என்பது καὶ ἰδού என்பதற்குத் துல்லியமான இணை அல்ல; காலத் தொடர்ச்சியைச் சேர்க்கிறது. மேலும், φέροντες என்பது அவர்கள் ‘வந்தார்கள்’ என்று வெளிப்படையாகக் கூறவில்லை; அவர்கள் சுமந்துகொண்டிருந்த செயலைக் குறிக்கிறது. ‘சில’ என்பதும் மூலத்தில் இல்லாத அளவுச்சுட்டல். திருத்தப்பட்ட உரை இவற்றைத் தவிர்த்து, παραλελυμένος என்பதன் தொடர்நிலையான முடக்கத்தையும் εἰσενεγκεῖν என்பதன் ‘உள்ளே கொண்டுவருதல்’ பொருளையும் காக்கிறது.
  naturalness: ‘இதோ’ நவீனத் தரத் தமிழிலும் வேதாகமக் கதைநடையில் இயல்பாகச் செயல்படுகிறது. ‘ஆண்கள் ... சுமந்துகொண்டிருந்தார்கள்’ மற்றும் ‘உள்ளே கொண்டுவந்து ... வைக்க முயன்றுகொண்டிருந்தார்கள்’ தெளிவான, கண்ணியமான நடை. ‘அவர் முன்பாக’ சூழலில் இயேசுவைக் குறிக்கும் மரியாதை ஒருமையாக இயல்பாக உள்ளது.
  terminology: ‘முடங்கியிருந்த’ என்பது παραλελυμένος என்பதற்கு மருத்துவக் காரணத்தை அளவுக்கு மீறிக் குறிப்பிடாமல் ஏற்றது. κλίνη என்பதற்கு ‘படுக்கை’ முதன்மை உரையில் பொருத்தமானது; அடிக்குறிப்பில் ‘தூக்குப்படுக்கை’ மற்றும் ‘சாய்வுப் படுக்கை’ மாற்றுகளாகத் தரப்பட்டுள்ளன. இறுதி பிரதிப்பெயர் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அடிக்குறிப்பு அதன் சூழல்சார் குறிபொருளை மட்டும் விளக்குகிறது.
