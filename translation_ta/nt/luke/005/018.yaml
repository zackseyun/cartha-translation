source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: ta
  text: இதோ, ஆண்கள் படுக்கையில்[a] முடங்கியிருந்த ஒரு மனிதனைச் சுமந்துகொண்டிருந்தார்கள்; அவனை உள்ளே கொண்டுவந்து அவர் முன்பாக[b] வைக்க முயன்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூக்குப்படுக்கையில்’ அல்லது ‘சாய்வுப் படுக்கையில்’; κλίνη என்ற கிரேக்கச் சொல் படுக்கை போன்ற தளம் அல்லது சாய்வுப் படுக்கையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இயேசுவின் முன்பாக.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: காட்சியின் மீது கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலிமையையும் கதையின் உயிரோட்டத்தையும் தக்கவைக்கிறது.
- source_word: ἄνδρες
  choice: சில ஆண்கள்
  rationale: ἀνήρ வயதுவந்த ஆண்களைக் குறிக்கிறது; தமிழில் இயல்பாகத் தெரிய எண்ணிக்கையை வரையறுக்காத ‘சில’ சேர்க்கப்பட்டுள்ளது.
- source_word: φέροντες
  choice: சுமந்துகொண்டு வந்தார்கள்
  rationale: நிகழ்ந்துகொண்டிருந்த சுமக்கும் செயலைத் தெரிவிப்பதோடு, காட்சிக்குள் அவர்கள் வருவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ κλίνης
  choice: படுக்கை ஒன்றில்
  rationale: κλίνη என்பது படுக்கை, படுக்கை போன்ற பலகை அல்லது சாய்விருக்கையைக் குறிக்கலாம்; ‘படுக்கை’ மிகக் குறைவான விளக்கச் சேர்க்கையுள்ள இயல்பான தேர்வு.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதனை
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆண் நபரைக் குறிக்கிறது; ‘மனிதன்’ மூலத்தின் சொல்லாட்சியை நெருக்கமாகப் பேணுகிறது.
- source_word: παραλελυμένος
  choice: உடல் முடங்கியிருந்த
  rationale: முடக்கத்தின் விளைவாகத் தொடரும் நிலையைக் காட்டும் perfect passive participle-ஐ இயல்பான தமிழில் தருகிறது; காரணமாக ஒரு குறிப்பிட்ட நோயை ஊகித்துச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐζήτουν
  choice: முயன்றுகொண்டிருந்தார்கள்
  rationale: imperfect வினையின் தொடர்ச்சியான முயற்சியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰσενεγκεῖν
  choice: அவனை உள்ளே கொண்டுபோய்
  rationale: உள்ளே எடுத்துச் செல்வது என்ற திசைநோக்கிய பொருளை இயல்பாகத் தருகிறது; சுமக்கும் முறை முன் சூழலில் ஏற்கெனவே தெளிவாக உள்ளது.
- source_word: θεῖναι
  choice: வைக்க
  rationale: τίθημι என்பதன் பொதுவான ‘வைத்தல்/இடுதல்’ பொருளைத் தருகிறது; அந்த மனிதனின் உடல் நிலையை மேலதிகமாக வரையறுக்கவில்லை.
- source_word: ἐνώπιον αὐτοῦ
  choice: அவர் முன்பாக
  rationale: மூலத்தில் பெயருக்குப் பதிலாக வரும் பிரதிப்பெயரைப் பேணுகிறது; தமிழில் ‘அவர்’ என்பது சூழலிலுள்ள இயேசுவைக் குறிக்கும் மரியாதை ஒருமையாக இயல்பாகப் புரிகிறது.
theological_decisions:
- issue: வசனத்தின் இறுதியில் வரும் αὐτοῦ என்பதன் குறிப்பு
  choice: அவர் முன்பாக
  alternative: இயேசுவுக்கு முன்பாக
  rationale: சூழலின்படி இயேசுவே குறிக்கப்படுகிறார்; எனினும் கிரேக்க மூலம் பெயரை வெளிப்படையாகச் சொல்லாமல் பிரதிப்பெயரைப் பயன்படுத்துவதால், முதன்மை உரை அதையே பேணுகிறது; அடிக்குறிப்பு குறிப்பைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ கதையின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. நோயின் மருத்துவக் காரணத்தை ஊகிக்காமல் ‘உடல் முடங்கியிருந்த’ எனத் தரப்பட்டுள்ளது; இயேசுவின் பெயரை மூல உரைக்குள் சேர்க்காமல் பிரதிப்பெயரும் விளக்க அடிக்குறிப்பும் பயன்படுத்தப்பட்டுள்ளன.
