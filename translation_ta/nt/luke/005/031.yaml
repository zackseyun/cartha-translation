  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “நலமாக இருப்பவர்களுக்கு மருத்துவர் தேவையில்லை; நோயுற்றவர்களுக்கே தேவை.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: அவர்களுக்குப் பதிலளித்தார்
  rationale: கிரேக்கக் கதைநடையில் பதிலுரையை அறிமுகப்படுத்தும் இச்சொற்றொடரை, இரு பேச்சுவினைகளையும் தேவையின்றி மீளுரைக்காமல் இயல்பான நவீனத் தமிழில் தருகிறது; αὐτούς என்பதையும் ‘அவர்களுக்கு’ எனப் பாதுகாக்கிறது.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: தேவையில்லை
  rationale: ‘தேவை உடையவர்களல்ல’ என்ற சொற்சொற் மொழிபெயர்ப்பைவிட இயல்பாகவும் தெளிவாகவும் χρείαν ἔχουσιν என்பதன் பொருளை வெளிப்படுத்துகிறது.
- source_word: οἱ ὑγιαίνοντες
  choice: நலமாக இருப்பவர்கள்
  rationale: உடல்நலமுள்ள நிலையில் இருப்பவர்களைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் வகுப்புப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἰατροῦ
  choice: மருத்துவர்
  rationale: ἰατρός என்பதற்கான இயல்பான, மதிப்புமிக்க நவீனத் தமிழ்ச் சொல்.
- source_word: οἱ κακῶς ἔχοντες
  choice: நோயுற்றவர்கள்
  rationale: சொற்சொல்லாக ‘மோசமாக இருப்பவர்கள்’ என்று அல்லாமல், நோய்வாய்ப்பட்டிருப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளைத் துல்லியமாகத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் பழமொழித் தன்மையுள்ள எதிர்மறை ஒப்புமையின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் இறுதிப் பகுதியில் வினைச்சொல் விடுபட்டிருப்பதைத் தமிழில் ‘தேவை’ என இயல்பாக நிரப்பியுள்ளது.
