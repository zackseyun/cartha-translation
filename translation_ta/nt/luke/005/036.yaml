translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆடை’, ‘ஒட்டுத்துண்டு’, ‘பொருந்தாது’ ஆகியவை இயல்பான ஆடைச் சூழலைத் தருகின்றன; மூலத்தில் இல்லாத ‘தைத்தல்’ போன்ற செயல் விவரங்கள் தவிர்க்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
