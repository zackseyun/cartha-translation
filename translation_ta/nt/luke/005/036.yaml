source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: ta
  text: 'அவர் அவர்களிடம் ஓர் உவமையையும் சொல்லிக்கொண்டிருந்தார்: “எவரும் புதிய ஆடையிலிருந்து ஒரு துண்டைக் கிழித்து, பழைய ஆடையின்மேல் ஒட்டுப்போடுவதில்லை.[a] இல்லையெனில், அவர் புதிய ஆடையையும் கிழித்துவிடுவார்; புதிய ஆடையிலிருந்து எடுத்த ஒட்டுத்துண்டும் பழைய ஆடைக்குப் பொருந்தாது.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “எவரும் புதிய ஆடையிலிருந்து ஓர் ஒட்டுத்துண்டைக் கிழித்தெடுத்து, அதைப் பழைய ஆடையின்மேல் போடுவதில்லை.” கிரேக்கத்தில் முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கும் ‘கிழித்தெடுத்து’ என்ற பொருளுடைய aorist வினையெச்சம் உள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: “பொருந்தாது” என்பதை “ஒத்துப்போகாது” அல்லது “ஏற்றதாக இருக்காது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை, ஒட்டுத்துண்டுக்கும் பழைய ஆடைக்கும் இடையே ஒத்திசைவு அல்லது தகுதி இல்லாததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: அவர் ... ஓர் உவமையையும் சொல்லிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்ச்சியை உணர்த்தும் imperfect வினை வடிவத்தை ‘சொல்லிக்கொண்டிருந்தார்’ எனவும், καί தரும் கூடுதல் கருத்தை ‘-யும்’ எனவும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παραβολὴν
  choice: ஓர் உவமை
  rationale: παραβολή என்பதற்கான வழக்கமான, பொதுவாகப் புரியும் தமிழ் வேதாகமச் சொல்; ஒப்புமைக் கதையின் இலக்கிய இயல்பைக் காக்கிறது.
- source_word: ἐπίβλημα
  choice: ஒட்டுத்துண்டு / ஒட்டுப்போடுதல்
  rationale: ஆடையின் கிழிசலை மூடப் பயன்படுத்தப்படும் துண்டைச் சூழலுக்கேற்ற இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἀπὸ ἱματίου καινοῦ σχίσας
  choice: புதிய ஆடையிலிருந்து ஒரு துண்டைக் கிழித்து
  rationale: aorist participle-இன் முன்னிகழ்வை இயல்பான தமிழ் தொடர் வினையெச்ச அமைப்பில் பாதுகாக்கிறது.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: பழைய ஆடையின்மேல் ஒட்டுப்போடுவதில்லை
  rationale: ‘மேல் வைக்கிறான்’ என்ற சொற்சொல் வடிவத்தைவிட ஆடைச் சூழலில் நோக்கம் தெளிவாகிறது; தைக்கும் முறை என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: εἰ δὲ μήγε
  choice: அப்படிச் செய்தால்
  rationale: எச்சரிக்கப்படும் செயல் நிகழ்ந்தால் வரும் இரட்டை விளைவை நவீன தமிழில் தெளிவாக இணைக்கிறது.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: அவர் புதிய ஆடையையும் கிழித்துவிடுவார்
  rationale: எதிர்கால active வினையின் மறைந்த மனித எழுவாயைப் பாதுகாத்து, புதிய ஆடை சேதமடைவதைத் தெளிவாக்குகிறது.
- source_word: οὐ συμφωνήσει
  choice: பொருந்தாது
  rationale: συμφωνέω இங்கு தரும் ஒத்திசைவு, ஏற்றம் அல்லது தகுதி இன்மையைத் தீர்மானிக்காமல் பரந்த வகையில் வெளிப்படுத்துகிறது.
