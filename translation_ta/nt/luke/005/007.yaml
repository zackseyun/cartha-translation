revisions:
- from: அவர்கள் மற்றப் படகில் இருந்த தங்கள் கூட்டாளிகள் வந்து தங்களுக்கு உதவும்படி சைகை செய்தார்கள்.[a] அவர்களும் வந்து, இரண்டு படகுகளையும் நிரப்பினார்கள்; அதனால் அவை மூழ்கத் தொடங்கின.[b]
  to: அவர்கள் மற்றப் படகில் இருந்த தங்கள் கூட்டாளிகளுக்கு, வந்து தங்களுக்கு உதவும்படி சைகை செய்தார்கள்.[a] அவர்களும் வந்து, இரண்டு படகுகளையும் நிரப்பினார்கள்; அதனால் அவை மூழ்கத் தொடங்கின.[b]
  rationale: The revision adds the Tamil dative marker “-க்கு” to show explicitly that the signal was made to the partners, corresponding to τοῖς μετόχοις. No change is made to the event sequence, the implied filling of the boats, or the processive result that the boats began to sink.
