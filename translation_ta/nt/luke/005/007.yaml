id: LUK.5.7
reference: Luke 5:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: ta
  text: அவர்கள் மற்றப் படகில் இருந்த தங்கள் கூட்டாளிகளுக்கு, வந்து தங்களுக்கு உதவும்படி சைகை செய்தார்கள்.[a] அவர்களும் வந்து, இரண்டு படகுகளையும் நிரப்பினார்கள்; அதனால் அவை மூழ்கத் தொடங்கின.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாடை காட்டினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதனால் அவை மூழ்கிக்கொண்டிருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: சைகை செய்தார்கள்
  rationale: தண்ணீரில் தொலைவிலிருந்தவர்களுக்குக் கை அல்லது உடல் அசைவால் குறிப்பு தெரிவித்ததைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: μετόχοις
  choice: கூட்டாளிகள்
  rationale: இங்கு பொதுவான தோழர்களை அல்ல, மீன்பிடித் தொழிலில் இணைந்திருந்தவர்களைக் குறிக்கிறது.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: மற்றப் படகில் இருந்த
  rationale: காட்சியில் உள்ள இன்னொரு படகை இயல்பாகவும் தெளிவாகவும் அடையாளப்படுத்துகிறது.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: வந்து தங்களுக்கு உதவும்படி
  rationale: இக்கட்டமைப்பு நோக்கத்தைக் காட்டுகிறது; συλλαβέσθαι என்பது இச்சூழலில் அவர்களுடன் சேர்ந்து பணியாற்றி உதவுவதைக் குறிக்கிறது.
- source_word: ἔπλησαν
  choice: நிரப்பினார்கள்
  rationale: முந்தைய சூழலில் மீன்கள் பற்றிப் பேசப்படுவதால், எதனால் நிரப்பினர் என்பதைச் சேர்க்காமல் மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: இரண்டு படகுகளையும்
  rationale: இரு படகுகளும் நிரம்பின என்ற ἀμφότερα-வின் முழுமையான பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: அதனால் அவை மூழ்கத் தொடங்கின
  rationale: நிகழ்ந்த விளைவையும் தொடர்ந்துகொண்டிருந்த மூழ்கும் செயல்முறையையும் இயல்பான தமிழில் காட்டுகிறது; முழுமையாக மூழ்கிவிட்டதாகக் கூறவில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிகழ்வுவரிசையும், படகுகள் முழுமையாக மூழ்கினவா என்ற சொல்லப்படாத நிலையையும் காக்கப்பட்டுள்ளது.
