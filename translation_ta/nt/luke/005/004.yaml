  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: ta
  text: அவர் பேசி முடித்தபோது, சீமோனை நோக்கி, “ஆழமான நீர்ப்பகுதிக்குப்[a] படகைச் செலுத்து; மீன் பிடிப்புக்காக உங்கள் வலைகளை இறக்குங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆழத்திற்குள்.” கிரேக்கத்தில் சொற்படியாக, “ஆழத்திற்குள்” என்று உள்ளது; இங்கு அது ஆழமான நீர்ப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: அவர் ... முடித்தபோது
  rationale: δέ-யின் மென்மையான நிகழ்ச்சி முன்னேற்றத்தைத் தமிழில் தனியாக மிகைப்படுத்தாமல், ὡς உடன் வரும் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπαύσατο λαλῶν
  choice: பேசி முடித்தபோது
  rationale: நடந்துகொண்டிருந்த பேச்சு முடிவடைந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: சீமோனை நோக்கி ... என்றார்
  rationale: சீமோனிடம் உரையாற்றியதை நேரடியாகவும் மரியாதையான கதைநடையிலும் தருகிறது.
- source_word: Ἐπανάγαγε
  choice: படகைச் செலுத்து
  rationale: மீன்பிடிச் சூழலில் கரையிலிருந்து படகை ஆழமான நீர்ப்பகுதிக்கு எடுத்துச் செல்லும் ஒருமை கட்டளையை இயல்பாக வெளிப்படுத்துகிறது; ‘கடலுக்குச் செல்’ என்று ஏரிச் சூழலை மாற்றவில்லை.
- source_word: εἰς τὸ βάθος
  choice: ஆழமான நீர்ப்பகுதிக்கு
  rationale: βάθος என்பதன் சொற்பொருள் ‘ஆழம்’; இங்கு அது ஆழமான நீரைச் சுட்டுவதால் தமிழில் பொருள் தெளிவாகிறது.
- source_word: χαλάσατε
  choice: இறக்குங்கள்
  rationale: படகிலிருந்து வலைகளை நீரில் கீழிறக்கும் செயலைத் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தின் பன்மை கட்டளை தக்கவைக்கப்பட்டுள்ளது.
- source_word: τὰ δίκτυα ὑμῶν
  choice: உங்கள் வலைகளை
  rationale: பன்மையான ‘வலைகள்’ என்பதையும் பன்மை உடைமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς ἄγραν
  choice: மீன் பிடிப்பதற்காக
  rationale: ἄγρα இச்சூழலில் மீன்பிடியை அல்லது கிடைக்கும் பிடிப்பைச் சுட்டுகிறது; நோக்கத்தை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
