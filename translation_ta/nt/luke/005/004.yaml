translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் கட்டளை சீமோனுக்கான ஒருமையாகவும், வலைகளை இறக்கும் இரண்டாம் கட்டளை உடனிருந்தவர்களையும் உள்ளடக்கும் பன்மையாகவும் மொழிபெயர்க்கப்பட்டு, மூலத்தின் எண்ணிக்கை மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
