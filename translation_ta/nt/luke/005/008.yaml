  to: ஆனால், சீமோன் பேதுரு அதைக் கண்டபோது, இயேசுவின் முழங்கால்களருகே விழுந்து, “ஆண்டவரே, என்னைவிட்டுப் போய்விடுங்கள்[a]; ஏனெனில் நான் பாவமுள்ள ஒரு மனிதன்[b]” என்றான்.
