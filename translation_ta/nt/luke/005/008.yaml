source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: ta
  text: ஆனால், சீமோன் பேதுரு அதைக் கண்டபோது, இயேசுவின் முழங்கால்களருகே விழுந்து, “ஆண்டவரே, என்னைவிட்டுப் போய்விடுங்கள்[a]; ஏனெனில் நான் பாவமுள்ள ஒரு மனிதன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைவிட்டு விலகிச் செல்லுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ஆண்பாலைக் குறிப்பாகச் சுட்டும் “மனிதன்” என்ற சொல் உள்ளது; அது சீமோன் பேதுருவையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: அதைக் கண்டபோது
  rationale: இறந்தகால வினையெச்சம் காலப்பொருளில் இயல்பான தமிழாக மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் அது மிகுதியான மீன்பிடிப்பைக் குறிக்கிறது; தமிழில் வாக்கியம் இயல்பாக அமைய ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதை நகர்வில் மென்மையான திருப்பத்தைக் குறிக்கிறது; அற்புத நிகழ்விலிருந்து பேதுருவின் எதிர்வினைக்குச் செல்லும் மாற்றத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Σίμων Πέτρος
  choice: சீமோன் பேதுரு
  rationale: கிரேக்க மூலத்தில் உள்ள இரு பெயர்களும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: இயேசுவின் முழங்கால்களருகே விழுந்து
  rationale: προσπίπτω வினையின் முன்நோக்கிய விழுதலையும், முழங்கால்கள் எனும் தெளிவான உடல் சார்ந்த இடத்தையும் தக்கவைக்கிறது; ‘காலடியில்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: λέγων
  choice: என்றான்
  rationale: தமிழ் கதைநடையில் நேர்கூற்றை முடிக்கும் இயல்பான வினையாக மாற்றப்பட்டுள்ளது.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: என்னைவிட்டுப் போய்விடுங்கள்
  rationale: பேதுரு இயேசுவிடம் தன்னைவிட்டுப் பிரிந்து செல்லுமாறு விடுக்கும் அவசர வேண்டுகோளை இயல்பான, மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: பாவியான ஒரு மனிதன்
  rationale: ἀνήρ என்பதன் ஆண்பால் குறிப்பையும், ἁμαρτωλός என்பதன் பெயரடை அமைப்பையும் தக்கவைக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையையும் இயேசுவின் அதிகாரத்தை உணரும் சாத்தியமான ஆழத்தையும் காக்கிறது; வெறும் ‘ஐயா’ என்று குறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பின் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா; தலைவரே
  rationale: அற்புதத்தைக் கண்டு அச்சத்துடனும் பாவ உணர்வுடனும் பேதுரு பேசும் சூழலில் ‘ஆண்டவரே’ என்பது மரியாதையையும் இறையியல் ஆழத்திற்கான வாய்ப்பையும் காக்கிறது; அதே நேரத்தில் பேதுருவின் முழுமையான கிறிஸ்தவ அறிக்கையை இங்கே முன்கூட்டியே வரையறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. இயேசுவை நோக்கிய பேச்சில் இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கருத்து மாற்றப்படவில்லை. மூலத்தில் வெளிப்படையாக இல்லாத ‘அதை’ சூழல் தெளிவிற்காக மட்டும் சேர்க்கப்பட்டுள்ளது.
