  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: ta
  text: பழைய திராட்சரசத்தைக் குடித்த எவரும் புதியதை விரும்புவதில்லை; ஏனெனில், “பழையதே நல்லது” என்று சொல்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “பழையதே சிறந்தது” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: எவரும் … இல்லை
  rationale: எந்த நபரையும் பொதுவாகக் குறிக்கும் எதிர்மறைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πιὼν
  choice: குடித்த
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘பழைய திராட்சரசத்தைக் குடித்த எவரும்’ என்பது ‘குடித்த பின்பு’ என்ற கால உறவைச் சூழலில் தெளிவுபடுத்துகிறது.
- source_word: παλαιὸν
  choice: பழைய திராட்சரசத்தை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் விடுபட்டிருந்தாலும், முந்தைய வசனங்களின் திராட்சரசச் சூழலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘திராட்சரசம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: θέλει
  choice: விரும்புவதில்லை
  rationale: இங்கு θέλω விருப்பத்தையோ தேர்வையோ குறிக்கிறது; ‘விரும்பு’ என்பது தற்போதைய தமிழில் இயல்பான இணைச்சொல்.
- source_word: νέον
  choice: புதியதை
  rationale: கிரேக்கத்தைப் போலவே ‘திராட்சரசம்’ என்பதை மீண்டும் சொல்லாமல் விடுகிறது; சூழலிலிருந்து அது புதிய திராட்சரசத்தைக் குறிக்கிறது என்பது தெளிவு.
- source_word: λέγει γάρ
  choice: ஏனெனில் … என்று சொல்கிறார்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நேர்கூற்றையும் காரணத் தொடர்பையும் காக்கிறது.
- source_word: Ὁ παλαιὸς
  choice: பழையதே
  rationale: கிரேக்கத்தில் ‘திராட்சரசம்’ மறைமுகமாக உள்ளது. ‘பழையதே’ என்ற வடிவம் அந்தச் சுருக்கத்தையும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: χρηστός
  choice: நல்லது
  rationale: χρηστός என்பதன் இங்குள்ள அடிப்படைப் பொருள் ‘நல்லது’ அல்லது ‘இனிமையானது.’ ஒப்பீட்டுப் பொருளான ‘சிறந்தது’ என்பதை மூல உரையில் இல்லாமல் சேர்க்காத பரந்த, நடுநிலையான மொழிபெயர்ப்பு இது.
theological_decisions:
- issue: பழைய திராட்சரசத்தை விவரிக்கும் χρηστός என்பதன் மொழிபெயர்ப்பு
  choice: நல்லது
  alternative: சிறந்தது
  rationale: அச்சிடப்பட்ட SBLGNT உரையிலுள்ள χρηστός பொதுவாக ‘நல்லது’ அல்லது ‘இனிமையானது’ என்று பொருள்படும்; அது ஒப்பீட்டுச் சொல்லான ‘சிறந்தது’ அல்ல. அறியப்பட்ட மாற்று வாசகம் அடிக்குறிப்பில் மட்டும் பாதுகாக்கப்பட்டுள்ளது; இதனால் மொழிபெயர்ப்பு மரபைவிட மூலமொழி உரைக்கு முன்னுரிமை அளிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் பழமொழி போன்ற சுருக்கமும் காக்கப்பட்டுள்ளன. ‘திராட்சரசம்’ முதல் இடத்தில் வெளிப்படையாகக் கொடுக்கப்பட்டு, பின்னர் கிரேக்கத்தின் பெயர்ச்சொல் விடுபாட்டைப் பின்பற்றி ‘புதியதை,’ ‘பழையதே’ எனச் சுருக்கப்பட்டுள்ளது.
