reference: Luke 5:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: ta
  text: உடனே அவன் அவர்கள் முன்னிலையில் எழுந்து நின்று, தான் படுத்திருந்ததை[a] எடுத்துக்கொண்டு, கடவுளை மகிமைப்படுத்திக்கொண்டே தன் வீட்டுக்குச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “தான் படுத்திருந்த பாயை.” சொல்லுக்குச் சொல்: “தான் எதன்மேல் படுத்திருந்தானோ அதை.”'
    reason: ‘பாய்’ என்பது சூழலுக்கு ஏற்ற தெளிவான மாற்று; ஆனால் கிரேக்கத்தில் இவ்வசனத்தில் பொருளின் பெயர் நேரடியாகக் குறிப்பிடப்படவில்லை.
lexical_decisions:
- source_word: παραχρῆμα
  choice: உடனே
  rationale: தாமதமின்றி நிகழ்ந்ததைக் குறிக்கும் வினையடை; குணமடைதல் உடனடியாக விளைவுற்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀναστὰς
  choice: எழுந்து நின்று
  rationale: இறந்தகால வினையெச்ச வடிவத்தைத் தமிழ் நிகழ்ச்சித் தொடருக்கு ஏற்றவாறு மொழிபெயர்த்து, படுத்திருந்தவன் எழுந்து நின்ற செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐνώπιον αὐτῶν
  choice: அவர்கள் முன்னிலையில்
  rationale: அங்கு கூடியிருந்தவர்களின் முன்னிலையில், அவர்கள் காணும்படி நிகழ்ந்தது என்ற பொதுவான வெளிப்படைத்தன்மையைப் பாதுகாக்கிறது; ‘அவர்கள் கண்களுக்கு முன்பாக’ என்ற கூடுதல் அழுத்தத்தைச் சேர்க்கவில்லை.
- source_word: ἄρας
  choice: எடுத்துக்கொண்டு
  rationale: அவன் படுத்திருந்த பொருளைத் தூக்கி உடன் எடுத்துச் சென்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: தான் படுத்திருந்ததை
  rationale: கிரேக்கத்தில் படுக்கை அல்லது பாய் எனப் பெயர்ச்சொல் வெளிப்படையாக இல்லை; ‘அவன் படுத்திருந்தது’ என்ற சார்புத் தொடரின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: தன் வீட்டுக்குச் சென்றான்
  rationale: அவன் அங்கிருந்து தன் வீட்டை நோக்கிச் சென்றதை இயல்பாகத் தெரிவிக்கிறது; ‘தன்’ என்பது αὐτοῦ குறிக்கும் அதே நபருடைமையைத் தமிழில் தெளிவாக்குகிறது.
- source_word: δοξάζων τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்திக்கொண்டே
  rationale: சென்றுகொண்டிருந்தபோது கடவுளுக்கு மகிமை செலுத்திய தொடர்ச்சியான உடனிகழ்வைக் காட்டுவதோடு, δοξάζω என்பதன் மகிமை/மதிப்பு அளிக்கும் கருத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: அவன் எடுத்துச் சென்ற பொருளை முதன்மை உரையில் ‘பாய்’ அல்லது ‘படுக்கை’ என்று குறிப்பாக்க வேண்டுமா?
  choice: கிரேக்கத்தின் பொதுவான சார்புத் தொடரைப் பின்பற்றி ‘தான் படுத்திருந்ததை’ என்று முதன்மை உரையில் வைப்பது.
  alternative: ‘தான் படுத்திருந்த பாயை’ அல்லது ‘தான் படுத்திருந்த படுக்கையை’ என்று வெளிப்படையாகக் கூறுவது.
  rationale: இந்த வசனத்தின் கிரேக்க உரையில் அந்தப் பொருளுக்கான பெயர்ச்சொல் இல்லை. ஆகவே முதன்மை உரை தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது; சூழலின் அடிப்படையில் புரிந்துகொள்ள உதவும் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான செயல்கள் தமிழ் வினையெச்சங்களால் இயல்பாக இணைக்கப்பட்டுள்ளன; மூலத்தின் சொல்லப்படாத பொருள் முதன்மை உரையில் தேவையின்றி குறிப்பாக்கப்படவில்லை.
