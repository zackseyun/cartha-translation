  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: ta
  text: 'சீமோன் பதிலளித்தான்: “எஜமானே, நாங்கள் இரவு முழுவதும் கடுமையாக உழைத்தோம்[a]; ஒன்றும் பிடிக்கவில்லை. ஆனாலும் உமது சொல்லின்படி[b] வலைகளை இறக்குவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகவும் பாடுபட்டோம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கடுமையான முயற்சியை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது சொல்லை நம்பி’ அல்லது ‘நீர் சொன்னதால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: அதற்குச் சீமோன் … என்றான்
  rationale: கிரேக்க மொழியில் நேர்கூற்றை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர். ‘பதிலளித்து … சொன்னான்’ என்ற இறுக்கமான வடிவத்தைத் தவிர்த்து, இயல்பான தமிழில் பதிலுரையின் தொடர்பைப் பாதுகாக்கிறது.
- source_word: Ἐπιστάτα
  choice: எஜமானே
  rationale: இயேசுவின் அதிகாரத்தை ஏற்றுக்கொள்ளும் மரியாதைமிக்க அழைப்பு. மூலத்தில் κύριος இல்லாததால், ‘ஆண்டவரே’ என்பதன் கூடுதலான இறையியல் நிறையை இங்கு புகுத்தாமல் இருக்கிறது.
- source_word: δι’ ὅλης νυκτός
  choice: இரவு முழுவதும்
  rationale: முழு இரவையும் உள்ளடக்கிய கால நீட்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: κοπιάσαντες
  choice: கடுமையாக உழைத்தோம்
  rationale: வெறும் வேலை செய்வதைவிட மிகுந்த முயற்சியையும் களைப்பூட்டும் உழைப்பையும் வினைச்சொல் வலியுறுத்துகிறது.
- source_word: οὐδὲν ἐλάβομεν
  choice: ஒன்றும் பிடிக்கவில்லை
  rationale: மீன்பிடிக்கும் சூழலில் λαμβάνω என்பது பிடிப்பதைக் குறிக்கிறது; மீன் என்ற மறைபொருளைத் தேவையின்றி விரிக்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: ஆனாலும் உமது சொல்லின்படி
  rationale: முன்னைய பயனற்ற உழைப்புக்கும் சீமோனின் கீழ்ப்படிதலுக்கும் இடையிலான மெல்லிய முரண்பாட்டையும், இயேசுவின் சொல் அவரது செயலுக்கான அடிப்படை என்பதையும் தெரிவிக்கிறது.
- source_word: χαλάσω
  choice: இறக்குவேன்
  rationale: வலைகளைத் தண்ணீருக்குள் கீழிறக்கும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τὰ δίκτυα
  choice: வலைகளை
  rationale: SBLGNT மூலத்தின் பன்மையைப் பாதுகாக்கிறது; சூழல் தெளிவாக இருப்பதால் ‘மீன்பிடி வலைகள்’ என்று விரிவாக்கத் தேவையில்லை.
theological_decisions:
- issue: இயேசுவுக்கான Ἐπιστάτα என்னும் அழைப்பின் மொழிபெயர்ப்பு
  choice: எஜமானே
  alternative: ஆண்டவரே
  rationale: இங்கு மூலச்சொல் κύριος அல்ல, ἐπιστάτης. ஆகவே இயேசுவின் அதிகாரத்தைத் தெளிவாகக் காட்டியபடியே, ‘ஆண்டவர்’ என்பதோடு தொடர்புடைய முழுமையான கிறிஸ்தியல் பொருளை இந்த இடத்தில் முன்கூட்டியே புகுத்தாமல் ‘எஜமானே’ என வழங்கப்படுகிறது.
- issue: ἐπὶ τῷ ῥήματί σου என்பதன் பொருள்
  choice: உமது சொல்லின்படி
  alternative: உமது சொல்லை நம்பி / நீர் சொன்னதால்
  rationale: இந்தக் கட்டமைப்பு இயேசுவின் சொல் சீமோனின் செயலுக்கான அடிப்படை அல்லது காரணம் என்பதைச் சுட்டுகிறது. நம்பிக்கையை மட்டும் வெளிப்படையாகச் சேர்த்து பொருளைச் சுருக்காமல், மூலத்தின் உறவுநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘உமது’ என்பது நேரடிப் பேச்சில் மரியாதையைப் பேணுகிறது. குறிப்பு அடையாளங்கள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
