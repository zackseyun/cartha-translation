language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: ta
  text: அவர் ஏரிக்கரையில் நின்றிருந்த இரண்டு படகுகளைக் கண்டார். மீனவர்களோ அவற்றிலிருந்து இறங்கி[a], வலைகளைக் கழுவிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றிலிருந்து கரையிறங்கி.’
    reason: ἀποβάντες என்பதைக் சூழலுக்கேற்ப ‘கரையிறங்கி’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் ‘கரை’ என்பது மூலச்சொல்லில் வெளிப்படையாக இல்லை.
lexical_decisions:
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் இறந்தகாலக் கதைநடை வடிவத்தை இயல்பாகவும் நேரடியாகவும் காட்டுகிறது; ‘கவனித்தார்’ என்பதில் மூலத்தில் கட்டாயமில்லாத திடீர் கவனிப்பு நிழல் உண்டு.
- source_word: δύο πλοῖα
  choice: இரண்டு படகுகள்
  rationale: கெனேசரேத் ஏரியின் மீன்பிடிச் சூழலில் πλοῖον என்பதற்கு நவீனத் தமிழில் ‘படகு’ என்பதே இயல்பானது.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: ஏரிக்கரையில் நின்றிருந்த
  rationale: ἑστῶτα படகுகள் அசையாமல் ஒரு நிலையில் இருந்ததைக் குறிக்கிறது. ‘நங்கூரமிட்டிருந்த’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத கூடுதல் விவரத்தைச் சேர்க்கும்; ‘நின்றிருந்த’ மூல உருவகத்தைத் தக்கவைக்கிறது.
- source_word: οἱ δὲ ἁλιεῖς
  choice: மீனவர்களோ
  rationale: δέ குறிக்கும் மென்மையான வேறுபாட்டையும் காட்சிமாற்றத்தையும் தமிழின் ‘-ஓ’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: அவற்றிலிருந்து இறங்கி
  rationale: மீனவர்கள் படகுகளிலிருந்து இறங்கிய செயல் வலைகளைக் கழுவிய செயலுக்கு முன்பு நிகழ்ந்ததை வினையெச்ச அமைப்பு இயல்பாகக் காட்டுகிறது. ‘அவை’ என்பது படகுகளைக் குறிக்கிறது.
- source_word: ἔπλυνον τὰ δίκτυα
  choice: வலைகளைக் கழுவிக்கொண்டிருந்தார்கள்
  rationale: ἔπλυνον என்ற முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்ச்சியான செயலை ‘கழுவிக்கொண்டிருந்தார்கள்’ தெளிவாகக் காட்டுகிறது; τὰ δίκτυα என்பதில் இல்லாத உடைமைச் சொல்லைச் சேர்க்காமல் ‘வலைகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
