translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. படகுகளைப் பற்றிய ‘நின்றிருந்த’ என்ற சொல்லாட்சி சற்றே உருவகமானதாக இருந்தாலும் கிரேக்கத்தின் நிலையைக் குறிக்கும் சொல்லைத் தெளிவாகத் தக்கவைக்கிறது.
