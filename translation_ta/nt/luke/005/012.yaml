reference: Luke 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: ta
  text: ஒரு சமயம், அவர் பட்டணங்களில் ஒன்றில் இருந்தபோது, இதோ, தொழுநோயால் முழுவதும் பாதிக்கப்பட்ட ஒரு மனிதன் அங்கே இருந்தான்.[a] அவன் இயேசுவைக் கண்டதும் முகங்குப்புற விழுந்து, அவரிடம் மன்றாடி, “ஆண்டவரே, நீர் விரும்பினால், என்னைத் தூய்மையாக்க உம்மால் முடியும்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச்சொல், “தொழுநோய் நிறைந்த ஒரு மனிதன்.” இது அவனுடைய நிலையின் கடுமையை வலியுறுத்துகிறது. பண்டைய காலத்தில் “தொழுநோய்” என்ற சொல் இன்றைய ஹான்சன் நோயை மட்டுமல்லாமல் பலவகையான கடுமையான தோல் நோய்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னைச் சுத்தமாக்கு.” இங்கு பயன்படுத்தப்பட்டுள்ள வினைச்சொல் உடல் குணமடைதலோடு சடங்கு ரீதியான மற்றும் சமூகத் தூய்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: அவர் ... இருந்தபோது
  rationale: லூக்காவின் காட்சி அறிமுகச் சூத்திரத்தையும் காலப்பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது; ‘அது நிகழ்ந்தது’ என்பதைத் தனியாகச் சேர்த்து நடையைச் சுமையாக்கவில்லை.
- source_word: μιᾷ τῶν πόλεων
  choice: பட்டணங்களில் ஒன்றில்
  rationale: πόλις என்பதற்கு இச்சூழலில் பெரிய மாநகரம் என்ற தேவையற்ற எண்ணத்தை ஏற்படுத்தாமல் ‘பட்டணம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் திடீரென கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் அடையாளத்தின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: ἀνὴρ πλήρης λέπρας
  choice: உடல் முழுவதும் தொழுநோய் பரவிய ஒரு மனிதன்
  rationale: πλήρης என்பதன் தீவிரத்தைக் காக்கும் அதேவேளையில், சொற்சொல்லான ‘தொழுநோய் நிறைந்த’ என்பதைவிட இயல்பான தமிழை வழங்குகிறது.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: இயேசுவைக் கண்டதும்
  rationale: இறந்தகால வினையெச்சத்தின் தொடர்ச்சிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: முகங்குப்புற விழுந்து
  rationale: தாழ்மையும் அவசரமான வேண்டுதலும் வெளிப்படும் உடல் நிலையைக் தெளிவாகக் காட்டுகிறது.
- source_word: ἐδεήθη αὐτοῦ
  choice: அவரிடம் மன்றாடி
  rationale: சாதாரணமாகக் கேட்டல் என்பதைக் காட்டிலும் வேண்டுகோளின் தீவிரத்தைப் பிரதிபலிக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பையும் சாத்தியமான கிறிஸ்துவியல் ஒலியையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἐὰν θέλῃς
  choice: நீர் விரும்பினால்
  rationale: இயேசுவின் திறனை அல்ல, அவரது விருப்பத்தைச் சார்ந்த நிபந்தனை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: δύνασαί με καθαρίσαι
  choice: என்னைத் தூய்மையாக்க உம்மால் முடியும்
  rationale: δύναμαι என்பதன் ஆற்றல் கருத்தையும் καθαρίζω என்பதன் உடல், சடங்கு, சமூகப் பரிமாணங்களையும் காக்கிறது.
theological_decisions:
- issue: λέπρα / καθαρίζω என்பவற்றை நோய்நீக்கச் சூழலில் மொழிபெயர்த்தல்
  choice: ‘தொழுநோய்’ மற்றும் ‘தூய்மையாக்க’
  alternative: ‘தோல் நோய்’ மற்றும் ‘குணமாக்க’
  rationale: καθαρίζω வெறும் மருத்துவ குணமாக்கலைவிட உடல், சடங்கு மற்றும் சமூக மீட்பையும் குறிக்கக்கூடும். பாரம்பரியமாக அறியப்படும் ‘தொழுநோய்’ பயன்படுத்தப்பட்டாலும், பண்டைய λέπρα இன்றைய ஹான்சன் நோயை மட்டும் துல்லியமாகக் குறித்திருக்க வேண்டியதில்லை.
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பு
  choice: ஆண்டவர்
  alternative: ஐயா அல்லது போதகரே
  rationale: இது மரியாதையான நேரடி அழைப்பையும் சாத்தியமான கிறிஸ்துவியல் உட்பொருளையும் பாதுகாக்கிறது; உடனடிச் சூழல் நிரூபிப்பதைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘நீர்/உம்மால்’ வைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற சற்று உயர்நடைச் சொல் மூலத்தின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது.
