source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: ta
  text: ஆனால் நாட்கள் வரும்; மணமகன் அவர்களிடமிருந்து எடுத்துச் செல்லப்படும்போது[a], அப்போது அந்த நாட்களில் அவர்கள் நோன்பிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அகற்றப்படும்போது” என்றும் மொழிபெயர்க்கலாம். மணமகன் வெறுமனே புறப்படுவதை அல்ல, அவர் எடுத்துச் செல்லப்படுவதை கிரேக்க வினைச்சொல் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: நாட்கள் வரும்
  rationale: கிரேக்க மொழியின் எதிர்காலக் காலச் சொல்லாட்சியைத் தமிழிலும் இயல்பாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலில் நிலவும் நோன்பின்மைக்கும் வரவிருக்கும் நோன்புக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ὅταν
  choice: எப்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் கிரேக்கத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπαρθῇ
  choice: எடுத்துச் செல்லப்படும்போது
  rationale: மணமகன் தாமாகப் புறப்படுவதாக அல்லாமல், பிறரால் அவர்களிடமிருந்து அகற்றப்படுவதை உணர்த்தும் செயப்பாட்டு வடிவத்தையும் அச்சுறுத்தலான நுண்பொருளையும் தக்கவைக்கிறது.
- source_word: ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து
  rationale: மணமகனுக்கும் அவருடன் இருப்பவர்களுக்கும் இடையில் உண்டாகும் பிரிவை நேரடியாகக் குறிக்கிறது.
- source_word: ὁ νυμφίος
  choice: மணமகன்
  rationale: திருமண உருவகத்தில் வரும் νυμφίος என்பதற்கான தெளிவான, வழக்கிலுள்ள நவீனத் தமிழ்ச் சொல்.
- source_word: τότε
  choice: அப்போது
  rationale: மணமகன் எடுத்துச் செல்லப்பட்டதைத் தொடர்ந்து நிகழும் கால விளைவைத் தெளிவாகக் குறிக்கிறது.
- source_word: νηστεύσουσιν
  choice: நோன்பிருப்பார்கள்
  rationale: வெறுமனே உணவு உண்ணாமல் இருப்பதைவிட சமய நோக்கமுள்ள நோன்பைக் குறிக்கும் கிரேக்க வினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: கிரேக்க மூலத்தில் மீண்டும் குறிப்பிடப்படும் எதிர்காலக் காலப்பகுதியை நீக்காமல் அதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மணமகன் இல்லாமற்போவதைத் தன்னிச்சையான புறப்பாடாக மென்மைப்படுத்துவதா, பிறரால் அகற்றப்படுவதாகக் காட்டுவதா
  choice: மணமகன் அவர்களிடமிருந்து எடுத்துச் செல்லப்படுகிறார் என்ற செயப்பாட்டு மற்றும் வலிமையான பொருளைத் தக்கவைத்தல்
  alternative: மணமகன் அவர்களைவிட்டுப் புறப்படும்போது
  rationale: ἀπαρθῇ என்பது செயப்பாட்டு வடிவம்; மணமகன் தாமாகச் செல்வதை மட்டும் அல்லாமல் அவருக்கு நிகழ்த்தப்படும் அகற்றுதலை உணர்த்துகிறது. இந்தத் தெரிவு இயேசுவின் வரவிருக்கும் மரணத்தை விளக்கமாகச் சேர்க்காமல், மூலத்தின் முன்னறிவிப்புத் தன்மையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காலச் சொல் மீளுரையும் செயப்பாட்டு நுண்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
