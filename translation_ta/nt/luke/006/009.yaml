language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: ta
  text: 'ஆனால் இயேசு அவர்களிடம், “நான் உங்களிடம் கேட்கிறேன்: ஓய்வுநாளில் நன்மை செய்வதா அல்லது தீங்கு செய்வதா[a] அனுமதியா, ஓர் உயிரைக்[b] காப்பதா அல்லது அதை அழிப்பதா?” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீமை செய்வதா” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நன்மை செய்வதையும் தீய அல்லது தீங்கு விளைவிக்கும் செயலைச் செய்வதையும் எதிரெதிராக நிறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஓர் ஆன்மாவைக்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் “உயிர்” என்பது ஒரு மனிதரின் வாழ்வைப் பாதுகாப்பதையோ அழிப்பதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: கதைத் தொடரில் இயேசு எதிர்வினையாற்றுவதைக் காட்டும் மிதமான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: நான் உங்களிடம் கேட்கிறேன்
  rationale: நேரடியான சவால் நிறைந்த கேள்வியின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: εἰ ἔξεστιν
  choice: முறையா
  rationale: ஓய்வுநாள் தொடர்பான சட்ட மற்றும் ஒழுக்க அனுமதியை நவீன தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது; வெறும் நடைமுறை அனுமதியாகக் குறுக்கவில்லை.
- source_word: τῷ σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: குறிப்பிட்ட உடன்படிக்கை நாளைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: ἀγαθοποιῆσαι
  choice: நன்மை செய்வது
  rationale: எதிர்வரும் κακοποιῆσαι என்பதுடனான ஒழுக்க எதிர்மறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: κακοποιῆσαι
  choice: தீங்கு செய்வது
  rationale: சூழலில் குணமாக்குதல் அல்லது ஒருவருக்குக் கேடு விளைவித்தல் என்ற நடைமுறை எதிர்மறையை வெளிப்படுத்துகிறது; ‘தீமை செய்வது’ என்பதும் சாத்தியம்.
- source_word: ψυχὴν
  choice: ஓர் உயிரை
  rationale: இங்கு மனித வாழ்வைக் காப்பது அல்லது அழிப்பது பற்றிய உறுதியான சூழலைக் காட்டுகிறது; உடலிலிருந்து பிரிந்த ஆன்மாவை மட்டும் குறிப்பதாகத் தீர்மானிக்கவில்லை.
- source_word: σῶσαι
  choice: காப்பது
  rationale: உயிரைப் பாதுகாத்தல் என்ற உடனடிப் பொருளையும் வேதாகமப் பயன்பாட்டின் விரிவையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἀπολέσαι
  choice: அதை அழிப்பது
  rationale: ‘காப்பது’ என்பதற்கு எதிரான வலுவான சொல்லைத் தக்கவைத்து, ‘கொல்வது’ என்ற குறுகிய விளக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: ψυχὴν σῶσαι ἢ ἀπολέσαι என்பதில் ψυχή என்பதன் பொருள்
  choice: “ஓர் உயிரைக் காப்பதா அல்லது அதை அழிப்பதா” என்று உறுதியான மனித வாழ்வைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: “ஓர் ஆன்மாவைக் காப்பதா அல்லது அதை அழிப்பதா”; “ஒரு மனிதரைக் காப்பதா அல்லது அழிப்பதா”
  rationale: ஓய்வுநாளில் குணமாக்கும் உடனடிச் சூழல் மனித வாழ்வைப் பாதுகாப்பதையும் தீங்கு செய்வதையும் பற்றியது. இதனால் பின்னைய மனித இயல்பு குறித்த கோட்பாட்டை வசனத்திற்குள் புகுத்தாமல், ψυχή என்பதன் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் இணையான இரு ஒழுக்க எதிர்மறைகளும் கேள்வி வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
