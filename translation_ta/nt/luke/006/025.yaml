  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: ta
  text: இப்போது நிறைவாக இருப்பவர்களே, உங்களுக்கு ஐயோ! ஏனெனில் நீங்கள் பசியடைவீர்கள். இப்போது சிரித்துக்கொண்டிருப்பவர்களே, உங்களுக்கு ஐயோ! ஏனெனில் நீங்கள் துக்கப்படுவீர்கள்; அழுவீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ
  rationale: வரவிருக்கும் தீர்ப்பையும் நிலைமாற்றத்தையும் அறிவிக்கும் தீர்க்கதரிசன எச்சரிக்கையின் வலிமையைத் தக்கவைக்கிறது; வெறும் இரக்க வெளிப்பாடாக இதை மென்மையாக்கவில்லை.
- source_word: ἐμπεπλησμένοι
  choice: வயிறு நிறைந்திருக்கிற
  rationale: நிரப்பப்பட்டதன் விளைவாகத் தற்போது நிலவும் நிறைவு நிலையைக் காட்டும் perfect participle-ஐ இயல்பான தமிழில் வெளிப்படுத்தி, வரவிருக்கும் பசியுடனான தெளிவான முரண்பாட்டையும் காக்கிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: தற்போதைய நிலைக்கும் வருங்கால நிலைமாற்றத்திற்கும் இடையிலான கால முரண்பாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: πεινάσετε
  choice: நீங்கள் பசியடைவீர்கள்
  rationale: எதிர்காலத்தில் ஏற்படும் உணவின்மை அல்லது பசி நிலையைக் கூறும் future indicative-ஐ இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γελῶντες
  choice: சிரிக்கிற
  rationale: தற்போது சிரித்துக்கொண்டிருப்பவர்களைக் குறிக்கும் present participle-ன் தொடர்நிலைப் பொருளைப் பாதுகாக்கிறது; ‘மகிழ்கிற’ என்று விரிவுபடுத்தவில்லை.
- source_word: πενθήσετε
  choice: நீங்கள் துக்கப்பட்டு
  rationale: ஆழ்ந்த துயரத்தையும் புலம்பல் சார்ந்த துக்கத்தையும் குறிக்கிறது; தொடர்ந்து வரும் அழுகையிலிருந்து பொருள் வேறுபாட்டை வைத்திருக்கிறது.
- source_word: κλαύσετε
  choice: அழுவீர்கள்
  rationale: வெளிப்படையான அழுகையைக் குறித்து, முந்தைய துக்கத்துடன் சேர்ந்து வரும் சொல்லாட்சியின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: ‘ஐயோ’ என்ற எச்சரிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் causal தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘ஐயோ’ கூற்றின் தன்மை
  choice: இப்போது நிறைவாகவும் கவலையின்றியும் இருப்போருக்கு வரவிருக்கும் நிலைமாற்றத்தையும் தீர்ப்பையும் அறிவிக்கும் தீர்க்கதரிசன எச்சரிக்கை
  alternative: வாழ்க்கைச் சூழ்நிலைகள் மாறும் என்பதைக் குறிக்கும் வெறும் சமூகக் கவனிப்பு
  rationale: மீண்டும் வரும் οὐαί, எதிர்கால வினைகள், சுற்றியுள்ள பேறுபெற்றோர் கூற்றுகளுடனான இணை அமைப்பு ஆகியவை நடுநிலையான கவனிப்பை விட வலிமையான எச்சரிக்கையைச் சுட்டுகின்றன. ஆனால் அந்த நிலைமாற்றம் எவ்வாறு அல்லது எப்போது நிகழும் என்பதை மூலவசனம் கூறாததால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் தீர்க்கதரிசன எச்சரிக்கைக்குரிய கண்ணியமும் தீவிரமும் நிலைக்குமாறும் மொழிபெயர்க்கப்பட்டது. இணை வாக்கியங்களின் அமைப்பும் ‘இப்போது’–எதிர்காலம் என்ற முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
