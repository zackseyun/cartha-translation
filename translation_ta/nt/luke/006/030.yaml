source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: ta
  text: உன்னிடம் கேட்கிற ஒவ்வொருவருக்கும் கொடு; உனக்குச் சொந்தமானவற்றை எடுத்துக்கொள்கிறவரிடமிருந்து அவற்றைத் திரும்பக் கேட்காதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைத் திரும்பக் கோராதே.”
    reason: ἀπαιτέω என்ற வினை சாதாரணமாகத் திரும்பக் கேட்பதையும் வலியுறுத்திக் கோருவதையும் குறிக்கக்கூடும்; ‘கோராதே’ அதன் வலிமையான நிழற்பொருளை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: உன்னிடம் கேட்கிற ஒவ்வொருவருக்கும்
  rationale: παντί என்பதன் பகிர்ந்தளிக்கும் பரந்த பொருளை ‘ஒவ்வொருவருக்கும்’ வெளிப்படுத்துகிறது. αἰτέω பொதுவாகக் கேட்பதையோ வேண்டுவதையோ குறிக்கும்; வறுமை அல்லது பிச்சையெடுத்தல் என்ற சமூக நிலையைக் கிரேக்கம் குறிப்பாகச் சொல்லாததால் ‘கேட்கிற’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δίδου
  choice: கொடு
  rationale: நிகழ்கால கட்டளை வடிவத்தின் நேரடியான வலிமையை இயல்பான தமிழ் ஒருமை கட்டளையாகத் தருகிறது; தொடர்ச்சியான பழக்கத்தைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: எடுத்துக்கொள்கிறவரிடமிருந்து
  rationale: αἴρω இச்சூழலில் ஒருவருக்குச் சொந்தமானவற்றை எடுத்தல் அல்லது எடுத்துச் செல்லுதல் எனப் பொருள்படலாம். ‘எடுத்துக்கொள்கிறவர்’ என்பது திருட்டு போன்ற ஒரு குறிப்பிட்ட சட்ட வகையைத் திணிக்காமல் அந்த அகலத்தைப் பாதுகாக்கிறது.
- source_word: τὰ σὰ
  choice: உனக்குச் சொந்தமானவற்றை
  rationale: ‘உன்னுடையவை’ என்ற கிரேக்கத்தின் பரந்த பொருளை இயல்பாகத் தருகிறது; அதைச் சொத்து அல்லது உடைமை என்ற குறுகிய சட்டப் பொருளுக்குள் அடைக்கவில்லை.
- source_word: μὴ ἀπαίτει
  choice: அவற்றைத் திரும்பக் கேட்காதே
  rationale: ἀπαιτέω எடுத்ததைத் திரும்பக் கேட்பது, கோருவது அல்லது வற்புறுத்திக் கேட்பது எனப் பொருள்படும். ‘திரும்பக் கேட்காதே’ நேரடியும் பொதுவாகப் புரியக்கூடியதுமாக இருந்து, வினையின் முழு வலிமையை மாற்று வாசிப்பாக அடிக்குறிப்பில் தர அனுமதிக்கிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளைகளின் பரப்பும் வலிமையும்
  choice: கட்டளைகளை அவற்றின் பரந்த, நேரடியான வடிவிலேயே மொழிபெயர்த்தல்
  alternative: இதை மிகைப்படுத்திக் கூறும் உவமை என மென்மைப்படுத்துதல், தர்மம் கொடுப்பதற்கு மட்டும் வரையறுத்தல், அல்லது இரண்டாம் பகுதியை சட்டரீதியான திருட்டுச் சூழலுக்கு மட்டும் கட்டுப்படுத்துதல்
  rationale: கிரேக்கத்தில் ‘ஒவ்வொருவருக்கும்’ என்ற பரந்த மொழியோடு நேரடியான கட்டளைகள் உள்ளன. அவற்றை நடைமுறையில் எவ்வாறு பயன்படுத்துவது என்ற விவாதத்தை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் அறநெறிசார் பதற்றத்தையும் பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் நேரடியான ஆனால் கண்ணியமான நடை. இயேசு ஒருவரை நேரடியாக அணைக்கும் கிரேக்க ஒருமையை ‘உன்/கொடு/கேட்காதே’ வடிவங்கள் பாதுகாக்கின்றன.
