  source_fidelity: 'மூலக் கிரேக்கத்தின் இரண்டு நிகழ்காலக் கட்டளைகளும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன: παντὶ αἰτοῦντί σε என்பதன் பரந்த பரப்பு ‘உன்னிடம் கேட்கிற ஒவ்வொருவருக்கும்’ என்பதிலும், ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει என்பதன் பொருள் ‘உனக்குச் சொந்தமானவற்றை எடுத்துக்கொள்கிறவரிடமிருந்து அவற்றைத் திரும்பக் கேட்காதே’ என்பதிலும் துல்லியமாக உள்ளது. ‘எடுத்துக்கொள்கிறவர்’ αἴρω என்பதைக் குறிப்பிட்ட சட்டவகையான திருட்டாகக் குறுக்காமல் உரிய அகலத்தில் தருகிறது.'
