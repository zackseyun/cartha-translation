revisions:
- from: அவர்கள் அவருக்குச் செவிகொடுக்கவும், தங்கள் நோய்களிலிருந்து குணமடையவும் வந்திருந்தார்கள். அசுத்த ஆவிகளால் தொல்லைக்குள்ளானவர்களும்[a] குணமாகிக்கொண்டிருந்தார்கள்.
  to: அவர்கள் அவரைக் கேட்கவும், தங்கள் நோய்களிலிருந்து குணமடையவும் வந்தார்கள். அசுத்த ஆவிகளால் தொல்லைக்குள்ளானவர்களும்[a] குணமடைந்து வந்தார்கள்.
  rationale: The revision removes the unsupported pluperfect and the potentially interpretive ‘pay heed’ sense, while preserving the purpose infinitives, the causal force of ἀπό with unclean spirits, and the imperfective sense of ἐθεραπεύοντο in idiomatic Tamil. No doctrinal expansion is introduced.
