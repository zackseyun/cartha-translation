source:
  edition: SBLGNT
  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: ta
  text: அவர்கள் அவரைக் கேட்கவும், தங்கள் நோய்களிலிருந்து குணமடையவும் வந்தார்கள். அசுத்த ஆவிகளால் தொல்லைக்குள்ளானவர்களும்[a] குணமடைந்து வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துன்புறுத்தப்பட்டவர்களும்’ அல்லது ‘வேதனைக்குள்ளானவர்களும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ἐνοχλούμενοι என்பது சூழலுக்கேற்ப தொல்லை, துன்பம், அல்லது வேதனைக்கு உள்ளாவதைக் குறிக்கக்கூடிய சொல்.
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: அவர்கள் ... வந்திருந்தார்கள்
  rationale: οἳ முந்தைய வசனத்தில் கூறப்பட்ட மக்களைக் குறிக்கிறது. முந்தைய நிகழ்வுடன் இயல்பாக இணையும் வகையில் தமிழில் தனிப்பெயர்ச்சொல்லுடன் இறந்தகால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: அவருக்குச் செவிகொடுக்கவும்
  rationale: இயேசுவைக் கேட்பதே அவர்கள் வந்த நோக்கம் என்பதை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; வெறுமனே ஒலி கேட்பதைவிட கவனித்துக் கேட்பது என்ற பொருளையும் கொண்டுள்ளது.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: தங்கள் நோய்களிலிருந்து குணமடையவும்
  rationale: செயப்பாட்டு இறந்தகால infinitive-இன் நோக்கப் பொருளையும், ἀπό குறிக்கும் நோயிலிருந்து விடுதலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: அசுத்த ஆவிகளால் தொல்லைக்குள்ளானவர்கள்
  rationale: ἀπό இங்கு காரணத்தைக் குறிக்கிறது. ἐνοχλούμενοι என்பதன் அகன்ற பொருளை மிகைப்படுத்தாமல் ‘தொல்லைக்குள்ளானவர்கள்’ தருகிறது; ‘அசுத்த ஆவிகள்’ என்பது கிரேக்கச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἐθεραπεύοντο
  choice: குணமாகிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயற்பாங்கைத் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων என்பதன் பொருள்
  choice: அசுத்த ஆவிகள்
  alternative: தீய ஆவிகள்
  rationale: மூலத்தின் ‘அசுத்தம்’ என்ற சடங்கு-ஒழுக்க நுணுக்கத்தையும், தனிப்பட்ட ஆவிகளைக் குறிக்கும் நற்செய்தி நூல் சொல்லாட்சியையும் பாதுகாக்கிறது; ‘தீய’ என்பது விளக்கமாக இருந்தாலும் மூலச் சொல்லின் நேரடி பொருள் அல்ல.
- issue: ἐθεραπεύοντο என்பதன் கால-செயற்பாங்கு
  choice: குணமாகிக்கொண்டிருந்தார்கள்
  alternative: குணமடைந்தார்கள்
  rationale: காட்சியில் சுகமாக்குதல் தொடர்ந்து நடந்ததை imperfect வடிவம் சுட்டுவதால், அதை எளிய நிறைவுற்ற நிகழ்வாக மாற்றாமல் வைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முந்தைய வசனத்துடன் உள்ள தொடர்பை ‘அவர்கள்’ மற்றும் ‘வந்திருந்தார்கள்’ காட்டுகின்றன; தொடர்ச்சியான குணமாக்குதலை ‘குணமாகிக்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது.
