  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: ta
  text: வேறொரு ஓய்வுநாளில் அவர் ஜெபக்கூடத்திற்குள் சென்று கற்பித்துக்கொண்டிருந்தார். அங்கே வலது கை சூம்பியிருந்த[a] ஒரு மனிதர் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உலர்ந்து சுருங்கியிருந்தது. கிரேக்கச் சொல் ‘உலர்ந்த’ அல்லது ‘சூம்பிய’ நிலையைக் குறிக்கலாம்; இங்கே அது அந்த மனிதரின் வலது கையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: வேறொரு ஓய்வுநாளில்
  rationale: இது லூக்கா பயன்படுத்தும் நிகழ்வு அறிமுகத் தொடர். தமிழில் ‘நிகழ்ந்தது’ என்று தனியே மொழிபெயர்ப்பது இயல்பற்றதாக இருப்பதால், மென்மையான δέ இணைப்பையும் அடுத்த காலச் சொற்றொடருடன் இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: வேறொரு ஓய்வுநாளில்
  rationale: ἕτερος இதே வகையைச் சேர்ந்த மற்றொரு சந்தர்ப்பத்தைக் குறிக்கிறது; ‘வேறொரு’ அந்த வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: அவர் ஜெபக்கூடத்திற்குள் சென்று
  rationale: ἐγένετο என்பதற்குப் பின்வரும் வினையெச்ச அமைப்பு தமிழில் தொடர்ச்சியான நிகழ்ச்சியாக இயல்பாக வழங்கப்பட்டுள்ளது. συναγωγή என்பதற்கு பொதுவாகப் புரியும் ‘ஜெபக்கூடம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: καὶ διδάσκειν
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: நிகழ்ந்துகொண்டிருந்த செயலைக் காட்டும் நிகழ்நிலைத் தன்மையைத் தமிழ் தொடர்நிலை வடிவம் காக்கிறது.
- source_word: ἄνθρωπος ἐκεῖ
  choice: அங்கே ... ஒரு மனிதர் இருந்தார்
  rationale: ஆண் நபரைக் குறிக்கும் சூழலைக் காத்து, தமிழின் இயல்பான இடம்–எழுவாய்–வினை வரிசையில் அமைக்கப்பட்டுள்ளது.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: வலது கை
  rationale: குறிப்பாக அவரது வலது கையே பாதிக்கப்பட்டிருந்தது என்ற கிரேக்கச் சொல்லமைப்பின் வலியுறுத்தல் காக்கப்படுகிறது.
- source_word: ξηρά
  choice: சூம்பியிருந்த
  rationale: ξηρός என்பதன் அடிப்படைப் பொருள் ‘உலர்ந்தது’; இந்தக் குணமாக்கல் சூழலில் செயலிழந்து சுருங்கிய கையை இயல்பாகக் குறிக்க ‘சூம்பியிருந்த’ பொருத்தமானது. ‘முடங்கிய’ என்று கூறுவது காரணம் அல்லது துல்லியமான உடல்நிலையை அளவுக்கு மீறித் தீர்மானிக்கலாம்.
