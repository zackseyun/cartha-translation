reference: Luke 6:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: ta
  text: ஆனால் உங்கள் பகைவர்களை நேசியுங்கள்; நன்மை செய்யுங்கள்; திரும்ப எதையும் எதிர்பாராமல்[a] கடன் கொடுங்கள். அப்போது உங்கள் வெகுமதி மிகுதியாக இருக்கும்; நீங்கள் உன்னதமானவரின் மகன்களாக இருப்பீர்கள்[b]. ஏனெனில் அவர் நன்றியில்லாதவர்களிடமும் தீயவர்களிடமும் தயவுள்ளவராக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சாத்தியம் குறைந்த விளக்கமாக, “ஒருவரைக் குறித்தும் நம்பிக்கை இழக்காமல்” அல்லது “ஒருபோதும் நம்பிக்கை இழக்காமல்.” μηδὲν ἀπελπίζοντες என்ற கிரேக்கச் சொற்றொடர் பொருள் காண்பதில் கடினமானது; இச்சூழலில், கொடுத்த கடன் திரும்பக் கிடைக்கும் என்றோ வேறு கைம்மாறு கிடைக்கும் என்றோ எதிர்பாராதிருப்பதைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “மகன்கள்” என்பது கிரேக்க மூலத்திலுள்ள ஆண்பால் பன்மைச் சொல்லை மொழிபெயர்க்கிறது; இங்கே அது பிரதிநிதித்துவமான விரிவான பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட கைம்மாறு சார்ந்த அன்புக்கும் இக்கட்டளைக்கும் இடையிலான வலுவான மாறுபாட்டை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: உங்கள் பகைவர்களிடம் அன்புகூருங்கள்
  rationale: கட்டளையின் நேரடித்தன்மையையும் ‘பகைவர்கள்’ என்ற சொல்லின் அதிர்வையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: ἀγαθοποιεῖτε
  choice: நன்மை செய்யுங்கள்
  rationale: செயலில் வெளிப்படும் நன்மையைத் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: δανίζετε
  choice: கடன் கொடுங்கள்
  rationale: கிரேக்க வினையின் பொருளைத் தருகிறது; ‘பணம்’ என்று மூலத்தில் இல்லாத வரம்பைச் சேர்க்கவில்லை.
- source_word: μηδὲν ἀπελπίζοντες
  choice: திரும்ப எதையும் எதிர்பாராமல்
  rationale: கடன் கொடுத்தல் மற்றும் கைம்மாறு பற்றிய உடனடிச் சூழலில், திருப்பிக் கிடைப்பதை எதிர்பாராதிருத்தல் என்ற சாத்தியமான முதன்மைப் பொருளை இயல்பான தமிழில் தருகிறது; வேறு விளக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὁ μισθὸς ὑμῶν πολύς
  choice: உங்கள் வெகுமதி மிகுதியாக இருக்கும்
  rationale: μισθός என்பதன் பிரதிபலன் சார்ந்த பொருளையும் πολύς என்பதன் அளவுசார் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: υἱοὶ Ὑψίστου
  choice: உன்னதமானவரின் மகன்கள்
  rationale: υἱοί என்ற ஆண்பால் பன்மையைத் துல்லியமாகக் காத்து, Ὕψιστος என்ற இறைப்பட்டத்தை மரியாதையான தமிழில் வழங்குகிறது.
- source_word: χρηστός
  choice: தயவுள்ளவர்
  rationale: தகுதியற்றவர்களிடமும் வெளிப்படும் இறைவனின் இரக்கமிக்க நற்குணத்தைச் சூழலுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: நன்றியில்லாதவர்களிடமும் தீயவர்களிடமும்
  rationale: இரு பெயரடைப் பயன்பாடுகளையும் மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் வடிவில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: υἱοὶ Ὑψίστου என்பதை பாலினப் பொதுமைப்படுத்தலுடன் மொழிபெயர்ப்பதா
  choice: உன்னதமானவரின் மகன்கள்
  alternative: உன்னதமானவரின் பிள்ளைகள்
  rationale: மூல கிரேக்கம் வெளிப்படையாக ஆண்பால் பன்மையான υἱοί என்பதைக் கொண்டுள்ளது. முதன்மை உரை அதைப் ‘மகன்கள்’ என்று காக்கிறது; சூழலில் அதன் பிரதிநிதித்துவப் பயன்பாடு இருக்கலாம் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: μηδὲν ἀπελπίζοντες என்பதன் பொருள்
  choice: திரும்ப எதையும் எதிர்பாராமல்
  alternative: ஒருவரைக் குறித்தும் நம்பிக்கை இழக்காமல் / ஒருபோதும் நம்பிக்கை இழக்காமல்
  rationale: உடனடிச் சூழல் கடன் கொடுத்தலையும் கைம்மாறு எதிர்பார்ப்பதையும் பற்றியதால், திருப்பிக் கிடைப்பதை எதிர்பாராதிருத்தல் என்பது முதன்மை உரையில் ஏற்கப்படுகிறது. கிரேக்கச் சொற்றொடரின் உண்மையான விளக்கச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளைகள் தெளிவாகவும் நேரடியாகவும் வைக்கப்பட்டுள்ளன; விளக்கச் சிக்கல்கள் முதன்மை உரையில் தீர்மானமாக மறைக்கப்படாமல் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன.
