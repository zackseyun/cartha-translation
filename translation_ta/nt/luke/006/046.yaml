id: LUK.6.46
reference: Luke 6:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: ta
  text: “நீங்கள் என்னை, ‘ஆண்டவரே, ஆண்டவரே’[a] என்று அழைத்தும், நான் சொல்வதை ஏன் செய்வதில்லை?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “எஜமானே, எஜமானே.” கிரேக்கத்தில்: “கிரியே, கிரியே” (Kyrie, kyrie).'
    reason: κύριος என்பதற்கான அகராதிசார் மாற்றையும், இவ்வசனத்தில் வரும் கிரேக்க vocative வடிவத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: Τί
  choice: ஏன்
  rationale: இங்கு τί, καλεῖτε என்பதுடன் சேர்ந்து காரணத்தை வினவுகிறது; கண்டிக்கும் வலிமையுடன் இயல்பான தமிழில் ‘ஏன்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: δέ
  choice: ; ஆனால்
  rationale: δέ மென்மையான தொடர்புச்சொல்; அழைப்புக்கும் கீழ்ப்படியாமைக்கும் உள்ள முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்படுகிறது.
- source_word: με
  choice: என்னை
  rationale: καλεῖτε என்பதன் நேரடிச் செயப்படுபொருள்.
- source_word: καλεῖτε
  choice: அழைக்கிறீர்கள்
  rationale: நிகழ்கால, இரண்டாம் நபர் பன்மை வினை; ஒருவரை ஒரு பட்டத்தால் அழைப்பதை இயல்பாகக் குறிக்கிறது.
- source_word: Κύριε κύριε
  choice: ஆண்டவரே, ஆண்டவரே
  rationale: κύριος என்பதன் மரியாதை மற்றும் கிறிஸ்துவியல் எடையை ‘ஆண்டவர்’ காக்கிறது; இருமுறை அழைப்பதும் வலியுறுத்தலுக்காக அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: καὶ οὐ ποιεῖτε
  choice: ஆனால் ... செய்யாமல் இருப்பது
  rationale: வாயால் ஏற்றுக்கொள்வதற்கும் செயலில் கீழ்ப்படியாமைக்கும் உள்ள எதிர்மறை முரண்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἃ λέγω
  choice: நான் சொல்வதை
  rationale: நடுநிலைப் பன்மை சார்புப்பெயரின் கூட்டுப்பொருளைத் தமிழில் இயல்பாக ஒருமைத் தொகுப்பாக அளிக்கிறது; λέγω-வின் எளிய ‘சொல்’ பொருளையும் காக்கிறது.
theological_decisions:
- issue: κύριος என்பதைக் கிறிஸ்துவியல் பட்டமாக மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு இயேசுவை நேரடியாக அழைக்கும் பட்டம் மரியாதையையும் அதிகாரத்தையும், சாத்தியமான கிறிஸ்துவியல் எடையையும் கொண்டுள்ளது. ‘ஆண்டவர்’ இவற்றைக் காக்கிறது; ‘எஜமான்’ என்பது சாத்தியமான அகராதிசார் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கண்டன வினாவின் வலிமையைத் தக்கவைக்கும் கண்ணியமான நடை. கிரேக்கச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், அழைப்பு மற்றும் கீழ்ப்படியாமை இடையிலான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
