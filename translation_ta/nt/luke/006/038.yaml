source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: ta
  text: '**லூக்கா 6:38**


    கொடுங்கள்; உங்களுக்குக் கொடுக்கப்படும். அமுக்கப்பட்டு, குலுக்கப்பட்டு, நிரம்பி வழிகிற[a] நல்ல அளவை உங்கள் மடியில்[b] கொடுப்பார்கள். ஏனெனில், நீங்கள் எந்த அளவால் அளக்கிறீர்களோ, அந்த அளவாலேயே உங்களுக்கும் திரும்ப அளக்கப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொங்கி வழியும்.” அளக்கும் பாத்திரம் மிக முழுமையாக நிரப்பப்பட்டதால் அதன் உள்ளடக்கம் வெளியே வழிவதே இங்குள்ள படிமம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “உங்கள் ஆடையின் முன்மடிப்பில்.” அக்காலத்தில் மேலாடையின் முன்பகுதியை மடியாகப் பயன்படுத்தி அளக்கப்பட்ட பொருட்களைப் பெற்றுக்கொள்வார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: கொடுங்கள்
  rationale: நிகழ்கால கட்டளைப் பன்மையை இயல்பான தமிழ் கட்டளையாகத் தருகிறது; கிரேக்க வினையின் தொடர்ச்சித் தன்மையை அளவுக்கு மீறி வெளிப்படுத்தவில்லை.
- source_word: δοθήσεται ὑμῖν
  choice: உங்களுக்குக் கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், கொடுக்கப்படும் பொருள் குறிப்பிடப்படாமல் இருப்பதையும் பாதுகாக்கிறது.
- source_word: μέτρον καλὸν
  choice: நல்ல அளவை
  rationale: அளவிடப்பட்ட அளவு அல்லது அளக்கும் பாத்திரம் என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘தாராளமான’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: πεπιεσμένον
  choice: அமுக்கி
  rationale: ஒரு பாத்திரத்தில் உள்ள பொருளை நெருக்கமாக அடக்கி அதிகமாக நிரப்பும் சந்தை உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σεσαλευμένον
  choice: குலுக்கி
  rationale: பாத்திரத்திலுள்ள பொருள் இடைவெளியின்றி படியும்படி குலுக்கப்படுவதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ὑπερεκχυννόμενον
  choice: நிரம்பி வழியும்
  rationale: அளவுக்கு மேலாக நிறைந்து வெளியே வழியும் உயிரோட்டமான படிமத்தைத் தெளிவாகத் தருகிறது.
- source_word: δώσουσιν
  choice: கொடுப்பார்கள்
  rationale: கிரேக்கத்தில் உள்ள, செய்பவர் யார் என்று குறிப்பிடாத மூன்றாம் நபர் பன்மையைச் செயப்பாட்டாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: உங்கள் மடியில்
  rationale: பொருட்களைப் பெற்றுக்கொள்ளப் பயன்படுத்தப்பட்ட ஆடையின் முன்மடிப்பைக் குறிக்கும் சொற்றொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: ஏனெனில், நீங்கள் எந்த அளவையால் அளக்கிறீர்களோ
  rationale: பரஸ்பர அளவீட்டுக் கொள்கையையும் அளவு உருவகத்தையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: அதே அளவால் உங்களுக்கும் திரும்ப அளக்கப்படும்
  rationale: ἀντί உணர்த்தும் பதிலளிப்பு அல்லது பிரதியளவீட்டை ‘திரும்ப’ என்பதால் வெளிப்படுத்தி, எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இந்தக் கூற்றை பணம் அல்லது தர்மம் கொடுப்பதற்கு மட்டும் வரையறுப்பதா
  choice: கொடுப்பதையும் அதற்குப் பதிலாக அளக்கப்படுவதையும் பரந்த பொருளில் வைத்திருத்தல்
  alternative: பொருளாதார உதவி அல்லது தர்மம் கொடுப்பதை மட்டும் குறிக்கும் வகையில் மொழிபெயர்த்தல்
  rationale: உடனடியான சூழலில் இரக்கம், தீர்ப்பிடாமை, மன்னிப்பு, கொடுத்தல் ஆகியவை உள்ளன. கிரேக்க உரை பணத்தை வெளிப்படையாகக் குறிப்பிடாததால், மொழிபெயர்ப்பு இதை செல்வவள வாக்குறுதியாகவோ பண உதவிக்கு மட்டுமே உரியதாகவோ சுருக்கவில்லை.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அமுக்கி, குலுக்கி, நிரம்பி வழியும்’ என்ற தொடர் மூலத்தின் செறிவான சந்தை அளவைப் படிமத்தை இயல்பாகத் தக்கவைக்கிறது.
