source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: ta
  text: அவர் அவர்கள் எல்லாரையும் சுற்றிப் பார்த்துவிட்டு, அந்த மனிதனிடம், “உன் கையை நீட்டு” என்றார். அவனும் அப்படியே செய்தான்; அவனுடைய கை சீரான நிலைக்குத் திரும்பியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குணமானது” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இன்னும் நேரடியாக, கை சீரான நிலைக்குத் திரும்பியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος πάντας αὐτούς
  choice: அவர்கள் எல்லாரையும் சுற்றிப் பார்த்துவிட்டு
  rationale: இறந்தகாலப் பங்கேற்புவினை, பேசுவதற்கு முன் இயேசு அங்கிருந்த அனைவரையும் சுற்றிப் பார்த்த செயல்வரிசையைக் காட்டுகிறது. ‘சுற்றிப் பார்த்துவிட்டு’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘எல்லாரையும்’ என்பது πάντας என்பதன் முழுமையையும் காக்கிறது.
- source_word: εἶπεν αὐτῷ
  choice: அந்த மனிதனிடம் … என்றார்
  rationale: αὐτῷ யாரைக் குறிக்கிறது என்பதைத் தமிழ் உரைநடையில் தெளிவாக்க ‘அந்த மனிதனிடம்’ பயன்படுத்தப்பட்டுள்ளது. ‘என்றார்’ என்பது பேச்சுச் செயலை மேலதிக விளக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: உன் கையை நீட்டு
  rationale: Ἔκτεινον நேரடியான கட்டளை; ‘நீட்டு’ என்பது உடல் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. χείρ என்பதற்கு ‘கை’ என்ற வழக்கமான பொருள் காக்கப்பட்டுள்ளது.
- source_word: ὁ δὲ ἐποίησεν
  choice: அவனும் அப்படியே செய்தான்
  rationale: ἐποίησεν முன் கூறப்பட்ட கட்டளையைச் செய்ததைக் குறிக்கிறது. ‘அப்படியே செய்தான்’ அந்தப் பின்னுறவை இயல்பாகத் தருகிறது; δέ இங்கு மென்மையான தொடர்ச்சியாக ‘-உம்’ மூலம் வெளிப்படுகிறது.
- source_word: ἀπεκατεστάθη ἡ χεὶρ αὐτοῦ
  choice: அவனுடைய கை சீரான நிலைக்குத் திரும்பியது
  rationale: ἀποκαθίστημι என்பது ஒன்றை உரிய அல்லது முந்தைய நிலைக்குத் திரும்பச் செய்வதை வலியுறுத்துகிறது. ‘சீரான நிலைக்குத் திரும்பியது’ என்பது ‘குணமானது’ என்ற மருத்துவ விளக்கத்தை நேரடியாகச் சேர்க்காமல், மீட்டமைப்பின் கருத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ἀπεκατεστάθη என்பதில் அற்புதத்தின் தன்மை எவ்வாறு சொல்லப்படுகிறது
  choice: ‘சீரான நிலைக்குத் திரும்பியது’ என்ற மீட்டமைப்பு மொழி
  alternative: ‘குணமானது’ அல்லது ‘முழுமையாக நலமானது’
  rationale: கிரேக்க வினை கை உரிய நிலைக்குத் திரும்பியதை முன்னிறுத்துகிறது. தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு அற்புதத்தைத் தெளிவாகக் காட்டினாலும், மூலத்தில் இல்லாத மருத்துவச் சொல்லை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது; குணமடைந்த மனிதனை ஒருமையில் குறிப்பிடுவது இயல்பான தமிழுக்கு ஏற்றது. அடிக்குறிப்புக் குறி அது விளக்கும் ‘திரும்பியது’ என்ற சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
