  terminology: ‘அத்திப்பழங்கள்,’ ‘முள் செடிகள்,’ ‘முட்புதர்,’ and ‘திராட்சைக் குலை’ accurately convey the botanical and agricultural imagery without unjustified species-level precision. No theological terminology is introduced or interpretively expanded.
