id: LUK.6.44
reference: Luke 6:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: ta
  text: ஒவ்வொரு மரமும் அதனதன் கனியினால் அறியப்படுகிறது. ஏனெனில், முள் செடிகளிலிருந்து அத்திப்பழங்களைச் சேகரிப்பதில்லை; முட்புதரிலிருந்து திராட்சைக் குலையையும் அறுவடை செய்வதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: ஒவ்வொரு மரமும்
  rationale: ἕκαστον என்பதன் பகிர்ந்தளிக்கும் தன்மையை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: அதனதன் கனியினால்
  rationale: ἰδίου வலியுறுத்தும் ஒவ்வொரு மரத்துக்கும் உரிய சொந்தக் கனியுடனான தொடர்பை ‘அதனதன்’ காக்கிறது; γινώσκεται உடன் வரும் ἐκ என்பதற்கு தமிழில் கருவிப் பொருளைத் தரும் ‘-இனால்’ இயல்பானது.
- source_word: γινώσκεται
  choice: அறியப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் பொதுவான பழமொழிக் கூற்றின் தன்மையையும் காக்கிறது.
- source_word: ἀκανθῶν
  choice: முள் செடிகள்
  rationale: ஒரு குறிப்பிட்ட இனத்தைத் தேவையின்றி சுட்டாமல், பலவகை முட்களுள்ள செடிகளைக் குறிக்கும் பன்மைப் பொருளைத் தருகிறது.
- source_word: συλλέγουσιν
  choice: சேகரிப்பதில்லை
  rationale: விளைபொருளை ஒன்றாகச் சேர்த்துக் கொள்வதைக் குறிக்கும் வினையை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: σῦκα
  choice: அத்திப்பழங்கள்
  rationale: σῦκα என்பதற்கான வழக்கமான மற்றும் தெளிவான தமிழ்ச் சொல்.
- source_word: βάτου
  choice: முட்புதர்
  rationale: பொதுவான புதர் என்பதைவிட, βάτος குறிக்கும் முட்கள் நிறைந்த புதரின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: σταφυλήν
  choice: திராட்சைக் குலை
  rationale: கிரேக்க ஒருமையையும், திராட்சைப் பழங்களின் குலை என்ற பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τρυγῶσιν
  choice: அறுவடை செய்வதில்லை
  rationale: பழுத்த விளைபொருளை, குறிப்பாகத் திராட்சையை, அறுவடை செய்வதைக் குறிக்கும் வினையின் வேளாண்மை நுணுக்கத்தைக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்திய கூற்றை விளக்கும் பழமொழி சார்ந்த தர்க்கத் தொடர்பை வெளிப்படுத்துகிறது; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்க்க இரண்டாம் γάρ ஒரே விளக்க வாக்கியத்தின் தொடக்கத்தில் பிரதிபலிக்கப்படுகிறது.
theological_decisions:
- issue: கனி உருவகத்தின் பொருள்
  choice: அறநடத்தை, செயல்கள் அல்லது குணநலன் என்று மொழிபெயர்ப்பிலேயே விளக்காமல் வேளாண்மைப் பழமொழியாகவே வைத்தல்
  alternative: ‘கனி’ என்பதை ஒருவரின் குணம் அல்லது செயல்கள் என்று விரித்துரைத்தல்
  rationale: கிரேக்க உரை இவ்வசனத்தில் உருவகத்தின் பயன்பாட்டை நேரடியாக விளக்கவில்லை. அதன் சூழல்சார் இறையியல் வலிமையையும் திறந்த பொருளையும் பாதுகாக்க உருவகத்தை அப்படியே வைத்திருப்பது ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான பழமொழி நடையைப் பயன்படுத்துகிறது. ‘அதனதன்’ என்பது மரத்துக்கும் அதன் கனிக்கும் உள்ள இயல்பான ஒத்திசைவைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
