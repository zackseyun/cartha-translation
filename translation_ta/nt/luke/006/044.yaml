  source_fidelity: 'Greek is represented faithfully: the distributive ‘each tree,’ recognition by its own fruit, plural thorny plants and figs, singular thorny bramble, singular grape cluster, and distinct actions of gathering and harvesting are all preserved. The single Tamil connective ‘ஏனெனில்’ naturally carries the explanatory proverbial relationship without requiring a mechanically repeated rendering of both γάρ instances.'
