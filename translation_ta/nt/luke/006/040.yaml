  terminology: “சீடன்” fittingly preserves μαθητής as a relational learner rather than merely an academic student, while “ஆசிரியர்” is a neutral and current equivalent for διδάσκαλος. The footnotes provide legitimate lexical alternatives and their anchors are correctly placed.
