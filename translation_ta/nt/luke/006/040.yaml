source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: ta
  text: சீடன்[a] தன் ஆசிரியரைவிட மேலானவன் அல்ல; ஆனால் முழுமையாகப் பயிற்சி பெற்ற ஒவ்வொருவரும்[b] தன் ஆசிரியரைப் போல இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாணவன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முழுமையாக ஆயத்தமாக்கப்பட்ட ஒவ்வொருவரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: சீடன்
  rationale: ஒரு ஆசிரியருடன் இணைந்து அவரிடமிருந்து கற்று, அவரால் உருவாக்கப்படும் நபர் என்ற உறவுசார் பொருளை இது காக்கிறது; வெறும் கல்விசார் ‘மாணவன்’ என்பதைவிட மூலச்சொல்லின் நுணுக்கத்திற்கு ஏற்றது.
- source_word: ὑπὲρ
  choice: விட மேலானவன்
  rationale: இங்கு ὑπέρ நிலை அல்லது தரத்தில் உயர்ந்திருப்பதைக் குறிக்கிறது. தமிழில் ஒப்பீட்டை இயல்பாக வெளிப்படுத்த ‘ஆசிரியரைவிட மேலானவன்’ என வழங்கப்பட்டுள்ளது.
- source_word: διδάσκαλος
  choice: ஆசிரியர்
  rationale: கற்பிப்பவரைக் குறிக்கும் எளிய, தற்போதைய தமிழ்ச் சொல். ‘குரு’ அல்லது ‘எஜமான்’ போன்ற சொற்கள் மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் அதிகார அல்லது சமய நுணுக்கங்களைத் தரக்கூடும்.
- source_word: κατηρτισμένος
  choice: முழுமையாகப் பயிற்சி பெற்ற
  rationale: καταρτίζω என்பதன் perfect passive participle, ஒருவரைப் பொருத்தமாக உருவாக்கி ஆயத்தப்படுத்திய நிறைவுற்ற செயலின் விளைவுநிலையைக் குறிக்கிறது. சீடன்–ஆசிரியர் சூழலில் ‘முழுமையாகப் பயிற்சி பெற்ற’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πᾶς
  choice: ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமை இலக்கண வடிவம் கொண்டிருந்தாலும், இங்கு பொதுப்படையான பொருள் உள்ளது. ‘ஒவ்வொருவரும்’ அந்தப் பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὡς
  choice: போல
  rationale: இங்கு ὡς ஒப்புமையைக் குறிக்கிறது; ‘போல’ என்பது நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: αὐτοῦ
  choice: தன்
  rationale: இது சீடன் அல்லது ‘ஒவ்வொருவரும்’ என்பவருடைய ஆசிரியரையே சுட்டுகிறது. தமிழ் தற்சுட்டுப் பெயரடையான ‘தன்’ ஒருமைத் தொடர்பைத் தெளிவாகவும் பாலினத்தைத் தேவையின்றி வலியுறுத்தாமலும் காக்கிறது.
theological_decisions:
- issue: பொதுப்படையான ஆண்பால் ஒருமைக் குறிப்பு
  choice: ‘ஒவ்வொருவரும் … தன் ஆசிரியர்’ என்று ஒருமைத் தொடர்பைக் காத்தல்
  alternative: ‘அவர்கள் தங்கள் ஆசிரியர்’ அல்லது ‘அந்த ஆசிரியர்’
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவங்கள் ஒரு பொதுவான நீதிமொழியாகப் பயன்படுகின்றன. தமிழில் ‘ஒவ்வொருவரும் … தன்’ என்பது அனைவரையும் உள்ளடக்கும் பொருளையும் மூலத்தின் ஒருமைத் தொடர்பையும் இயல்பாகக் காக்கிறது.
- issue: κατηρτισμένος என்பதின் சூழல்சார் பொருள்
  choice: முழுமையாகப் பயிற்சி பெற்ற
  alternative: முழுமையாக ஆயத்தமாக்கப்பட்ட / சீராக்கப்பட்ட
  rationale: இந்தச் சொல் ஆயத்தப்படுத்துதல், பொருத்தமாக்குதல், சீராக்குதல் போன்ற பரந்த பொருள்களைக் கொண்டது. ஆனால் சீடன் மற்றும் ஆசிரியர் பற்றிய இச்சூழலில் பயிற்சியால் உருவாக்கப்படுதல் முதன்மையாகத் தெரிகிறது; மற்ற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் வழங்கப்பட்டுள்ளது. ‘சீடன்’ மற்றும் ‘ஆசிரியர்’ ஆகியவை உறவுசார் கற்றல் சூழலைக் காக்கின்றன. ‘இருப்பார்’ என்பது ἔσται என்ற எதிர்கால வடிவத்தை வெளிப்படுத்துகிறது; ‘போல’ என்பது ஆசிரியருக்கு சமமான பதவி என்று அல்லாமல், அவரைப் போன்ற உருவாக்கம் என்ற ஒப்புமையைத் திறந்தவாறே வைக்கிறது.
