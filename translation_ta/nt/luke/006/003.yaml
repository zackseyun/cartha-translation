id: LUK.6.3
reference: Luke 6:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “இதைக் கூட நீங்கள் வாசித்ததில்லையா: தாவீதும் அவருடன் இருந்தவர்களும் பசியடைந்தபோது அவர் என்ன செய்தார் என்பதை?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: பதிலளித்தார்
  rationale: பங்கேற்புவினை மற்றும் முற்றுவினை இணைந்துள்ள பொதுவான கொய்னே மரபை, தேவையற்ற இரட்டிப்பின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களுக்கு
  rationale: இயேசுவின் பதில் யாரை நோக்கியது என்பதை இயல்பான தமிழ் வேற்றுமையுடன் தெரிவிக்கிறது.
- source_word: Οὐδὲ τοῦτο
  choice: என்பதைக்கூட
  rationale: οὐδέ தரும் வலியுறுத்தலான ‘கூட’ என்ற பொருளைத் தக்கவைத்து, தமிழ் வாக்கிய அமைப்பில் வாசிக்க இயல்பாக அமைகிறது.
- source_word: ἀνέγνωτε
  choice: நீங்கள் வாசிக்கவில்லையா
  rationale: வேதவாக்கியத்தை அவர்கள் அறிந்திருக்க வேண்டுமென்ற எதிர்பார்ப்புடன் கேட்கப்படும் வினாவை இயல்பான தமிழில் தருகிறது.
- source_word: ὃ ἐποίησεν Δαυίδ
  choice: தாவீது என்ன செய்தார் என்பதை
  rationale: கிரேக்க உறவுப்பெயர் தொடரின் உள்ளடக்கத்தைத் தெளிவான தமிழ் பெயரெச்சத் தொடராகக் கொடுக்கிறது.
- source_word: ἐπείνασεν
  choice: பசியடைந்தபோது
  rationale: πεινάω வினையின் நிகழ்வுத்தன்மையைத் தக்கவைத்து, சூழலில் இயல்பான தமிழாக உள்ளது.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: தாவீதும் அவருடன் இருந்தவர்களும்
  rationale: வெளிப்படையான முதன்மை நபரையும் அவருடன் இருந்தவர்களையும் காக்கிறது; தமிழில் தெளிவுக்காக ‘அவர்’ என்பதற்குப் பதில் ‘தாவீது’ மீண்டும் பயன்படுத்தப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நேரடியான உரை. கிரேக்கத்தின் வலியுறுத்தலை ‘கூட’ காக்கிறது; மூலத்தின் சொல்வரிசையை அப்படியே பின்பற்றி செயற்கையான தமிழ் உருவாக்காமல், கேள்வியின் முழு கருத்தையும் இயல்பாக முன்வைக்கிறது.
