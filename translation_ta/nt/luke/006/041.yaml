source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ta
  text: ஆனால், உன் சகோதரனுடைய[a] கண்ணில் இருக்கும் துரும்பை[b] நீ ஏன் பார்க்கிறாய்; உன் சொந்தக் கண்ணில் இருக்கும் உத்திரத்தை[c] ஏன் கவனிப்பதில்லை?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரன்’ என்பது மூல கிரேக்கத்தில் உள்ள ஆண்பால் ஒருமைச் சொல்; இந்தப் போதனை ஆண் உடன்பிறந்தவருக்கு மட்டும் அல்லாமல் மற்றவர்களுடனான உறவுகளுக்கும் பொருந்துகிறது.
    reason: cultural_note
  - marker: b
    text: ‘துரும்பு’ என்பதற்கு ‘சிறு மரச்சிதல்’ அல்லது ‘வைக்கோல் துணுக்கு’ என்றும் பொருள் கொள்ளலாம்; இது மிகப் பெரிய உத்திரத்துடன் முரண்படுத்தப்படும் மிகச் சிறிய துணுக்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘உத்திரம்’ என்பது கட்டடத்தில் பயன்படும் பெரிய மரத்தூண் அல்லது குறுக்குச் சட்டம்; ‘பெரிய மரக்கட்டை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: ஏன்
  rationale: βλέπεις என்பதுடன் வரும் τί இங்கு வெறும் ‘எதை?’ என்ற கேள்வியல்ல; குற்றங்காட்டும் காரணவினாவாக இருப்பதால் ‘ஏன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய போதனையுடன் தொடர்ச்சியையும் இங்கு வரும் மிதமான முரண்பாட்டையும் காட்டுகிறது.
- source_word: βλέπεις
  choice: பார்க்கிறாய்
  rationale: கண்ணைப் பற்றிய உருவகத்தின் நேரடியான பார்வைச் சொல்லைத் தக்கவைக்கிறது.
- source_word: κάρφος
  choice: துரும்பு
  rationale: வைக்கோல் துணுக்கு அல்லது சிறு மரச்சிதல் போன்ற மிகச் சிறிய பொருளைக் குறிக்கிறது; பெரிய உத்திரத்துடனான மிகைப்படுத்தப்பட்ட முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀδελφοῦ
  choice: சகோதரனுடைய
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமையைத் தக்கவைக்கிறது; போதனையின் பயன்பாடு ஆண் உடன்பிறந்தவருக்கு மட்டும் கட்டுப்பட்டதல்ல என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: δοκόν
  choice: உத்திரம்
  rationale: கட்டடத்தில் பயன்படும் பெரிய மரத்தூண் அல்லது குறுக்குச் சட்டத்தைக் குறிக்கும் δοκός என்பதற்கு துல்லியமான தமிழ்ச் சொல்; துரும்புடனான அளவு வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: ἰδίῳ
  choice: உன் சொந்த
  rationale: ἴδιος தரும் உடைமை சார்ந்த வலியுறுத்தலையும், சகோதரனுடைய கண்ணுடன் உள்ள எதிர்மறை ஒப்புமையையும் வெளிப்படுத்துகிறது.
- source_word: κατανοεῖς
  choice: கவனிப்பதில்லை
  rationale: வெறுமனே காண்பதைவிட அக்கறையுடன் உணர்ந்து கவனிப்பதைக் குறிக்கிறது; βλέπεις உடனான கருத்து வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ἀδελφοῦ என்ற உறவுச் சொல்லின் பாலின வடிவம்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; உடன் விசுவாசி
  rationale: மூல உரை ஆண்பால் ஒருமையைப் பயன்படுத்தும் ஓர் ஒழுக்கப் போதனை உருவகமாக உள்ளது. ஆகவே அதை பொதுப்பாலாக்காமல் உரையில் தக்கவைத்து, அதன் விரிவான பயன்பாட்டை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் நேரடியான வினாவாக்கியம் பயன்படுத்தப்பட்டுள்ளது. ‘உத்திரம்’ இலக்கிய மரியாதையையும் கட்டட மரத்திற்கான துல்லியத்தையும் தருகிறது; அதன் பொருள் அடிக்குறிப்பில் எளிமையாக விளக்கப்பட்டுள்ளது. மூலத்தின் பார்வை/கவனிப்பு வேறுபாடும், துரும்பு/உத்திரம் என்ற மிகைப்படுத்தப்பட்ட அளவு முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
