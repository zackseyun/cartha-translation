source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: ta
  text: அந்த நாட்களில், அவர் ஜெபிப்பதற்காக மலைக்குச் சென்றார். இரவு முழுவதையும் கடவுளிடம் ஜெபிப்பதில் கழித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடம் ஜெபித்தபடியே இரவு முழுவதும் இருந்தார்.”
    reason: ἦν διανυκτερεύων என்ற நீடித்த செயலைத் தமிழில் வேறொரு இயல்பான முறையில் வழங்கும் மொழிபெயர்ப்பு மாற்று.
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις
  choice: அந்த நாட்களில்
  rationale: லூக்காவின் நிகழ்வை அறிமுகப்படுத்தும் தொடரை நவீனத் தமிழில் இயல்பாகக் கொடுக்கிறது. Ἐγένετο என்பதைக் கட்டாயமாக ‘நடந்தது’ என்று தனியே மொழிபெயர்க்காமல், தமிழ் கதைநடையின் காலச் சூழல் தொடக்கத்தில் அதன் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐξελθεῖν αὐτὸν εἰς τὸ ὄρος
  choice: அவர் ... மலைக்குச் சென்றார்
  rationale: மூலத்தின் இயக்கத்தையும் இலக்கையும் இயல்பான தமிழில் தெரிவிக்கிறது. ὄρος என்பதற்கு ‘மலை’ என்ற நேரடியான பொருள் தேர்ந்தெடுக்கப்பட்டது; குறிப்பிட்ட எந்த மலையென்றும் உரை கூறாததால் பெயர் சேர்க்கப்படவில்லை.
- source_word: προσεύξασθαι
  choice: ஜெபிப்பதற்காக
  rationale: சென்றதன் நோக்கத்தைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἦν διανυκτερεύων
  choice: இரவு முழுவதையும் ... கழித்தார்
  rationale: முற்றிரவும் தொடர்ந்த செயலைக் குறிக்கும் கூட்டு வினை அமைப்பின் நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘விழித்திருந்தார்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத கூறைச் சேர்ப்பதில்லை.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: கடவுளிடம் ஜெபிப்பதில்
  rationale: τοῦ θεοῦ என்பதை ஜெபம் செலுத்தப்படும் இலக்காக எடுத்துக்கொண்டு, இயல்பான தமிழில் ‘கடவுளிடம்’ என வழங்குகிறது. ‘கடவுளுடைய ஜெபம்’ என்ற தவறான உடைமைப் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவின் ஜெபத்துடன் தொடர்புடைய τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளிடம் ஜெபிப்பதில்
  alternative: கடவுளுடைய ஜெபத்தில்
  rationale: சூழலில் இயேசு கடவுளை நோக்கி ஜெபிப்பதே பொருள். இது மூலத்தின் உறவை இயல்பாக வெளிப்படுத்துகிறது; இயேசு யாரிடம் ஜெபித்தார் என்பதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘ஜெபம்’ என்பது தமிழ் கிறிஸ்தவ வாசகர்களுக்குப் பரவலாகப் புரியும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. இரண்டு குறுகிய வாக்கியங்கள் வசனத்தின் நிகழ்வையும் இரவெங்கும் நீடித்த ஜெபத்தையும் தெளிவாக முன்னிறுத்துகின்றன.
