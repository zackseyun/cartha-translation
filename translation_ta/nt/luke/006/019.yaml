source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: ta
  text: மக்கள் கூட்டம் முழுவதும் அவரைத் தொட முயன்றுகொண்டிருந்தது; ஏனெனில் அவரிடமிருந்து வல்லமை வெளிப்பட்டுக்கொண்டிருந்து அனைவரையும் குணமாக்கிக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டத்தினர் அனைவரும்
  rationale: πᾶς உடன் வரும் ஒருமைக் கூட்டுப்பெயரான ὄχλος, கூடியிருந்த மக்கள் அனைவரையும் குறிக்கிறது. தமிழில் இயல்பான பன்மை வினை ஒத்திசைவுடன் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐζήτουν
  choice: முயன்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினைவடிவம் தொடர்ந்து அல்லது திரும்பத் திரும்ப நடந்த முயற்சியைக் காட்டுகிறது. சூழலில் ‘தேடினார்கள்’ என்பதைக் காட்டிலும் ‘முயன்றுகொண்டிருந்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἅπτεσθαι
  choice: தொட
  rationale: குணமாக்கும் இச்சூழலில் ἅπτομαι என்பது இயல்பாக ‘தொடுதல்’ என்று பொருள்படும்; ‘பற்றிக்கொள்ளுதல்’ என்பது தேவையற்ற வலிமையைச் சேர்க்கலாம்.
- source_word: δύναμις
  choice: வல்லமை
  rationale: இங்கு இயேசுவிடமிருந்து செயல்பட்டு குணமாக்கும் திறனை δύναμις குறிக்கிறது. ‘வல்லமை’ அந்தப் பொருளைத் தக்கவைத்து, மூலத்தில் இல்லாத ‘அற்புத’ என்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: அவரிடமிருந்து வல்லமை புறப்பட்டு வந்து
  rationale: παρά உடன் ἐξέρχομαι, அவரிடமிருந்து வல்லமை தொடர்ந்து வெளிப்பட்டதைக் குறிக்கிறது. ‘புறப்பட்டு வந்து’ என்பது அதன் மூலத்தையும் மக்களிடத்திற்கான இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰᾶτο
  choice: குணமாக்கிக்கொண்டிருந்தது
  rationale: நிறைவுறா வினைவடிவம் தொடர்ந்து நடந்த குணமாக்கும் செயலைக் காட்டுகிறது. தமிழின் தொடர்நிலை வடிவம் இதைப் பாதுகாக்கிறது.
- source_word: πάντας
  choice: அவர்கள் அனைவரையும்
  rationale: πάντας என்பது சூழலில் குணமாக்கப்பட்ட மக்களைச் சுட்டுகிறது. தமிழில் சுட்டுப்பெயரை வெளிப்படையாகக் கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: இயேசுவிடமிருந்து புறப்பட்ட δύναμις என்பதன் இயல்பு
  choice: ‘அவரிடமிருந்து வல்லமை புறப்பட்டு வந்து’ என்று கூடுதல் கோட்பாட்டு விளக்கம் இல்லாமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவரிடமிருந்து அற்புத வல்லமை புறப்பட்டு வந்து’
  rationale: வசனம் இயேசுவைக் குணமாக்கும் வல்லமையின் மூலமாக முன்வைக்கிறது. ‘அற்புத’ என்பது சூழலால் உணரப்பட்டாலும் கிரேக்க மூலத்தில் வெளிப்படையாக இல்லை; ஆகவே அதைச் சேர்க்காமல் வசனத்தின் கூற்றும் அதன் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், ஆனால் கண்ணியமான நடை. கிரேக்க இறந்தகால நிறைவுறா வினைகளின் தொடர்ச்சியான செயற்பாடு ‘முயன்றுகொண்டிருந்தார்கள்’ மற்றும் ‘குணமாக்கிக்கொண்டிருந்தது’ என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளது. இம்மொழிபெயர்ப்பில் அடிக்குறிப்பு தேவையில்லை.
