id: LUK.6.48
reference: Luke 6:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: ta
  text: அவன் வீடு கட்டுகிற ஒரு மனிதனைப் போன்றவன்[a]. அந்த மனிதன் ஆழமாகத் தோண்டி, பாறையின்மேல் அடித்தளம் அமைத்தான். வெள்ளம் வந்தபோது, ஆறு அந்த வீட்டின்மேல் பலமாக மோதியது; ஆனால் அந்த வீட்டை அசைக்க அதனால் முடியவில்லை. ஏனெனில், அது நன்றாகக் கட்டப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவரைப் போன்றவன்.’ கிரேக்கத்தில் ஒப்பீட்டின் பிரதிநிதியாக ஆண்பால் ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: போன்றவன்
  rationale: உவமையின் நேரடியான ஒப்பீட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνθρώπῳ
  choice: ஒரு மனிதனை
  rationale: ஒப்பீட்டில் வரும் தனிநபரைக் குறிக்கிறது; கிரேக்கத்தின் ஆண்பால் ஒருமை வடிவத்தையும் பிரதிநிதித்துவத் தன்மையையும் காக்கிறது.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: வீடு கட்டுகிற
  rationale: கட்டுமானச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கும் வழக்கமான தமிழ்ச் சொற்றொடர்.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: ஆழமாகத் தோண்டி
  rationale: இரு கிரேக்க வினைச்சொற்களும் வலியுறுத்தும் ஆழமான அகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔθηκεν θεμέλιον
  choice: அஸ்திவாரம் போட்டான்
  rationale: வீடு கட்டும் சூழலில் பொதுமக்களுக்கு நன்கு புரியும் இயல்பான தமிழ்ப் பயன்பாடு.
- source_word: ἐπὶ τὴν πέτραν
  choice: பாறையின்மேல்
  rationale: πέτρα என்பதன் பாறைத் தன்மையையும் குறிப்பிட்ட உருவகத்தையும் நேரடியாகக் காக்கிறது; ‘அடிப்பாறை’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: πλημμύρης δὲ γενομένης
  choice: வெள்ளம் வந்தபோது
  rationale: நிகழ்வின் காலச் சூழலை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: προσέρηξεν ὁ ποταμὸς
  choice: ஆறு ... வேகமாக மோதியது
  rationale: வினைச்சொல்லில் உள்ள பலத்த தாக்கத்தை ‘வேகமாக மோதியது’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: அந்த வீட்டை அசைக்க அதனால் முடியவில்லை
  rationale: ஆற்றின் இயலாமையையும் வீட்டை நிலைகுலையச் செய்ய முடியாததையும் தெளிவாகக் காக்கிறது.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: ஏனெனில், அது நன்றாகக் கட்டப்பட்டிருந்தது
  rationale: காரண உறவையும் இறந்தகால நிறைவு நிலையையும் கிரேக்கச் செயப்பாட்டு வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ உவமையில் ἀνθρώπῳ என்பதன் பாலின வெளிப்பாடு
  choice: ஒரு மனிதனை
  alternative: ஒருவரை
  rationale: கிரேக்கத்தில் உவமையின் எடுத்துக்காட்டு ஆண்பால் ஒருமையில் உள்ளது. ‘மனிதன்’ என்பது தமிழில் இதைத் துல்லியமாகக் காக்கிறது; அதேவேளையில் உவமையின் பிரதிநிதித்துவப் பொருளையும் சூழல் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டுமானச் சூழலில் இயல்பாக உள்ள ‘அஸ்திவாரம் போட்டான்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ஆற்றின் பலத்த தாக்கத்தை வெளிப்படுத்த ‘வேகமாக மோதியது’ பயன்படுத்தப்பட்டுள்ளது.
