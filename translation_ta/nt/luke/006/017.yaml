  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: ta
  text: அவர் அவர்களுடன் கீழே இறங்கி, சமதளமான ஓர் இடத்தில் நின்றார்.[a] அங்கே அவருடைய சீடர்களின் பெருங்கூட்டமும், யூதேயா முழுவதிலிருந்தும் எருசலேமிலிருந்தும் தீரு, சீதோன் ஆகியவற்றின் கடற்கரைப் பகுதியிலிருந்தும் வந்த மக்களின் பெருந்திரளும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
