lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: அவர் அவர்களுடன் கீழே இறங்கி
  rationale: இறங்கிச் சென்ற திசையையும், உடன் இருந்தவர்களையும் காத்து, தமிழில் இயல்பான தொடராக வழங்குகிறது.
- source_word: ἔστη
  choice: நின்றார்
  rationale: ἵστημι என்பதன் இச்சூழலுக்குரிய எளிய கதைநடைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: சமதளமான ஓர் இடத்தில்
  rationale: τόπος என்பதற்கான ‘இடம்’ என்பதையும் πεδινός என்பதற்கான ‘சமதளமான’ என்பதையும் காத்து, அது பரந்த சமவெளி என்று அளவுக்கு மீறி வரையறுக்காமல் மொழிபெயர்க்கிறது.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்கள் பெருங்கூட்டமாக
  rationale: ὄχλος πολὺς என்பதன் பெருமளவான கூட்டத்தையும், அந்தக் கூட்டம் சீடர்களைக் கொண்டது என்ற மரபுத்தொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: மக்கள் பெருந்திரளாக
  rationale: πλῆθος πολὺ வலியுறுத்தும் மிகப் பெரிய எண்ணிக்கையையும் λαός குறிக்கும் பொதுமக்களையும் தெளிவாகத் தருகிறது; சீடர்களின் கூட்டத்திலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: யூதேயா முழுவதிலிருந்தும்
  rationale: πάσης தரும் முழுமை உணர்வை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: தீரு, சீதோன் ஆகியவற்றின் கடற்கரைப் பகுதியிலிருந்தும்
  rationale: παράλιος குறிக்கும் கடலோரப் பகுதியைத் தெளிவாகத் தருவதோடு, தீரு மற்றும் சீதோனுடன் அதன் புவியியல் தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: போதனையின் நிகழ்விட நிலவியல் வருணனை
  choice: சமதளமான ஓர் இடத்தில்
  alternative: ஒரு சமவெளியில்
  rationale: மத்தேயுவின் மலைச் சூழலுடன் ஒத்திசைக்கவோ முரண்பாட்டை வலுப்படுத்தவோ முயலாமல், லூக்கா பயன்படுத்திய சொற்றொடரின் நேரடிப் பொருளைக் காக்கிறது. ‘இடம்’ என்ற சொல்லும் பாதுகாக்கப்படுவதால், பரந்த சமவெளி என்ற கூடுதல் முடிவு தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான வேதாகமக் கதைநடையுடனும் வடிவமைக்கப்பட்டது. இடப்பெயர்களுக்கு பரவலாக அறியப்படும் தமிழ் வடிவங்கள் பயன்படுத்தப்பட்டன; சீடர்களின் கூட்டமும் பிற மக்களின் பெருந்திரளும் தனித்தனியாகத் தெளிவாக்கப்பட்டன.
