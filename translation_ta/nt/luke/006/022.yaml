  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: ta
  text: மனிதகுமாரனின் பொருட்டு மக்கள் உங்களை வெறுத்து, ஒதுக்கிவைத்து, இகழ்ந்து, உங்கள் பெயரைத் தீயதென்று தள்ளிவிடும்போது[a] நீங்கள் பேறுபெற்றவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் தீயவர்கள் என்று பகிரங்கமாக நிராகரிக்கும்போது.” “உங்கள் பெயரைத் தள்ளிவிடுதல்” என்பது உங்களை ஒழுக்கக்கேடானவர்கள் எனப் பழித்து ஏற்க மறுப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοί
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனமகிழ்ச்சியையோ உலகியல் அதிர்ஷ்டத்தையோ குறிக்காமல், வாழ்த்துரையின் ஆன்மிக மற்றும் இறையியல் நிறையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: μισήσωσιν
  choice: வெறுத்து
  rationale: துன்புறுத்தல் சூழலில் உள்ள பகைமையையும் வெறுப்பையும் நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: οἱ ἄνθρωποι
  choice: மக்கள்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிப்பதால், பாலின வரம்பில்லாத இயல்பான தமிழ்ச் சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀφορίσωσιν
  choice: ஒதுக்கிவைத்து
  rationale: சமூக அல்லது சமுதாய உறவிலிருந்து ஒருவரை விலக்கிவைக்கும் பொருளை எளிய நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: ὀνειδίσωσιν
  choice: இகழ்ந்து
  rationale: வாய்மொழியாக அவமதித்தல் அல்லது பழித்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: உங்கள் பெயரைத் ... தள்ளிவிடும்போது
  rationale: பெயரை வெளியே எறிதல் என்ற கிரேக்க உருவகத்தை ஓரளவு காத்து, ஒருவரின் பெயரையும் நற்பெயரையும் ஏற்க மறுக்கும் சமூகச் செயலை உணர்த்துகிறது.
- source_word: ὡς πονηρὸν
  choice: தீயதென்று
  rationale: அவர்களுடைய பெயரை ஒழுக்கரீதியாகத் தீயது என வகைப்படுத்தும் தீர்ப்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἕνεκα
  choice: பொருட்டு
  rationale: காரணத்தையும் ஒருவரோடு உள்ள தொடர்பினால் நேரிடும் விளைவையும் dignified modern Tamil-இல் இயல்பாகக் குறிக்கிறது.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிறுவப்பட்ட பட்டத்தையும் நற்செய்தி நூல்களிலுள்ள பயன்பாட்டையும் பழைய ஏற்பாட்டு எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν என்ற சொற்றொடரின் உருவகமும் சமூகப் பொருளும்
  choice: உங்கள் பெயரைத் தீயதென்று தள்ளிவிடும்போது
  alternative: உங்களைத் தீயவர்கள் என்று பகிரங்கமாக நிராகரிக்கும்போது
  rationale: முதன்மை உரை கிரேக்கத்தின் ‘பெயரைத் தள்ளிவிடுதல்’ என்ற உருவகத்தை காக்கிறது; அடிக்குறிப்பு அதன் சாத்தியமான சமூகப் பொருளை விளக்குகிறது. இதனால் துல்லியமான செயல்வகை தேவையின்றி முடிவுசெய்யப்படவில்லை.
- issue: οἱ ἄνθρωποι என்பதன் பொதுப்பொருள்
  choice: மக்கள்
  alternative: மனிதர்கள்
  rationale: குறிப்பு குறிப்பாக ஆண்களை அல்ல, பொதுவாகச் சமூகத்திலுள்ள மக்களைக் குறிக்கிறது.
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனித மகன்
  rationale: நிறுவப்பட்ட கிறிஸ்தவப் பட்டத்தையும் அதன் வேதாகம இடையுரைத்தொடர்பையும் காக்கும் அதேவேளையில், தமிழில் புரிந்துகொள்ளத்தக்க வடிவமாக உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாக்கியவான்கள்’ போன்ற பாலினச் சாயலும் பழைய நடையும் கொண்ட வடிவத்திற்குப் பதிலாக ‘பேறுபெற்றவர்கள்’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தில் தொடரும் செயல்கள் தமிழில் ஒரே ‘போது’ அமைப்பின்கீழ் இயல்பாக இணைக்கப்பட்டுள்ளன.
