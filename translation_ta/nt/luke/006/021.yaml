  terminology: ‘ஆசீர்வதிக்கப்பட்டவர்கள்’ can imply that an explicit agent has bestowed a blessing, whereas μακάριοι is a beatitude declaration of blessed/favored condition. ‘பேறுபெற்றவர்கள்’ is a well-established, suitably dignified Tamil beatitude expression and avoids adding that implication.
