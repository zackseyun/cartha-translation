source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: ta
  text: இப்போது பசியாயிருக்கிற நீங்கள் பேறுபெற்றவர்கள்[a]; ஏனெனில் நீங்கள் நிறைவடைவீர்கள்[b]. இப்போது அழுகிற நீங்கள் பேறுபெற்றவர்கள்; ஏனெனில் நீங்கள் சிரிப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இப்போது பசியாயிருப்பவர்கள் பேறுபெற்றவர்கள் … இப்போது அழுகிறவர்கள் பேறுபெற்றவர்கள்.’ கிரேக்கத்தில் பெயர்ச்சொல்லாக்கப்பட்ட பங்கேற்புச் சொற்கள் உள்ளன; ஆனால் உடனடிச் சூழலும் இரண்டாம் நபர் பன்மை வினைகளும் நேரடி அழைப்பை ஆதரிக்கின்றன.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நீங்கள் திருப்தியடைவீர்கள்.’ இச்சொல் உணவால் வயிறு நிறைவதையும், விரிவான பொருளில் முழுத் திருப்தி அடைவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ஆசீர்வதிக்கப்பட்டவர்கள்
  rationale: இயேசுவின் பேறுபெற்றோர் கூற்றுக்குரிய இறையியல் கனத்தையும், ஒருவரின் அகநிலை மகிழ்ச்சியை மட்டும் குறிக்காத பொருளையும் காக்கிறது.
- source_word: οἱ πεινῶντες νῦν
  choice: இப்போது பசியாயிருக்கிற நீங்கள்
  rationale: கிரேக்கத்தின் நிகழ்காலப் பங்கேற்புச் சொல்லையும் νῦν என்பதன் கால எதிர்மறையையும் காக்கிறது; இரண்டாம் நபர் பன்மை வினைமுற்றும் உடனடிச் சூழலும் நேரடி அழைப்பை ஆதரிக்கின்றன.
- source_word: χορτασθήσεσθε
  choice: நீங்கள் நிறைவடைவீர்கள்
  rationale: உணவால் நிரம்புதல் அல்லது முழுமையாகத் திருப்தியடைதல் ஆகிய இரு நிழற்பொருள்களுக்கும் இடமளிக்கிறது; வாக்குறுதியின் நிறைவேற்ற முறையைத் தீர்மானித்து விடவில்லை.
- source_word: οἱ κλαίοντες νῦν
  choice: இப்போது அழுகிற நீங்கள்
  rationale: κλαίω என்பதன் அழுதல் என்ற நேரடியான பொருளைக் காக்கிறது; துக்கவீட்டுப் புலம்பலாக மட்டும் பொருளைச் சுருக்கவில்லை.
- source_word: γελάσετε
  choice: நீங்கள் சிரிப்பீர்கள்
  rationale: γελάω என்பதன் தெளிவான, உருவகச் செறிவுள்ள பொருளை அப்படியே காத்து, பொதுவான ‘மகிழ்வீர்கள்’ என்று விளக்கமாக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: நேரடி அழைப்பா அல்லது பொதுவான மூன்றாம் நபர் பேறுபெற்றோர் கூற்றா
  choice: ‘பசியாயிருக்கிற நீங்கள் / அழுகிற நீங்கள்’ என்று நேரடி அழைப்பாக மொழிபெயர்த்தல்
  alternative: ‘இப்போது பசியாயிருப்பவர்கள் / அழுகிறவர்கள்’
  rationale: பெயர்ச்சொல்லாக்கப்பட்ட பங்கேற்புச் சொற்கள் மூன்றாம் நபர் வடிவில் இருந்தாலும், தொடர்ந்து வரும் வினைகள் இரண்டாம் நபர் பன்மையில் உள்ளன; சுற்றியுள்ள உரையும் சீடர்களை நேரடியாக நோக்குகிறது.
- issue: வாக்குறுதியளிக்கப்படும் நிலைமாற்றத்தின் தன்மை
  choice: ‘நிறைவடைவீர்கள்’, ‘சிரிப்பீர்கள்’ என்ற தெளிவான படிமங்களை வைத்திருத்தல்
  alternative: ஆவிக்குரிய திருப்தி அல்லது இறுதிக்கால நிறைவேற்றம் என்று வெளிப்படையாக விளக்குதல்
  rationale: அதன் காலம் அல்லது விதம் இவ்வசனத்தில் வரையறுக்கப்படவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பசியாயிருக்கிற’ மற்றும் ‘அழுகிற’ என்பவை நீடிக்கும் தற்போதைய நிலையைத் தெளிவாகக் காட்டுகின்றன. பேறுபெற்றோர் கூற்றின் மரபுசார் இறையியல் கனத்திற்காக ‘ஆசீர்வதிக்கப்பட்டவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
