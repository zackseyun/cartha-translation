source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: ta
  text: உன் கண்ணில் இருக்கும் பெரிய மரக்கட்டையை நீயே காணாதபோது, உன் சகோதரனிடம்[c], ‘சகோதரனே, உன் கண்ணில் இருக்கும் துரும்பை[a] நான் அகற்றட்டும்’ என்று உன்னால் எப்படிச் சொல்ல முடியும்? வெளிவேடக்காரனே, முதலில் உன் கண்ணிலிருந்து பெரிய மரக்கட்டையை அகற்று; அப்போது உன் சகோதரனின் கண்ணில் இருக்கும் துரும்பை அகற்றுவதற்குத் தெளிவாகக் காண்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துரும்பு” என்பதற்கு “வைக்கோல் துகள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் மிகச் சிறிய உலர்ந்த பொருள் துண்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “சகோதரன்” என்பது கிரேக்கத்தில் ஆண்பால் ஒருமையாக உள்ள ἀδελφός என்ற உறவுமுறைச் சொல்லை மொழிபெயர்க்கிறது; இந்தப் போதனை இன்னும் விரிவாகப் பொருந்தலாம் என்றாலும், கிரேக்க வாசகம் ஆண்பால் ஒருமையில் உள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: உன்னால் எப்படிச் சொல்ல முடியும்?
  rationale: சாத்தியத்தையும் தகுதியையும் கேள்விக்குள்ளாக்கும் வினாவாக இயல்பான தமிழில் தருகிறது.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: சகோதரனிடம் / சகோதரனே / சகோதரனின்
  rationale: மூலத்தின் ஆண்பால் ஒருமை உறவுமுறைச் சொல்லையும் நேரடி அழைப்பையும் துல்லியமாகப் பேணுகிறது.
- source_word: ἄφες ἐκβάλω
  choice: நான் எடுக்க விடு
  rationale: அனுமதி கோரும் கட்டளை வடிவத்தின் பொருளை இயல்பான நேரடிப் பேச்சாக வெளிப்படுத்துகிறது.
- source_word: κάρφος
  choice: துரும்பு
  rationale: கண்ணில் விழக்கூடிய மிகச் சிறிய உலர்ந்த துண்டைக் குறிக்கிறது; பெரிய மரக்கட்டையுடனான மிகைப்படுத்திய வேறுபாட்டையும் தெளிவாக வைத்திருக்கிறது.
- source_word: δοκός
  choice: பெரிய மரக்கட்டை
  rationale: கட்டுமானத்தில் பயன்படும் பெரிய மரத்துண்டு என்ற அடிப்படைப் படிமத்தை இன்றைய பொதுவாசகர் உடனடியாகப் புரிந்துகொள்ளும் வகையில் தருகிறது.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: நீயே பார்க்காமல் இருக்கிறாயே
  rationale: αὐτός என்பதன் வலியுறுத்தலையும், பிறரைக் குறைகூறுகிறவர் தமது குறையைக் காணாத முரண்பாட்டையும் பேணுகிறது.
- source_word: ὑποκριτά
  choice: வெளிவேடக்காரனே
  rationale: நேரடியான ஒருமை விளிப்பையும், உள்ளார்ந்த நிலைக்கு மாறாக வெளியில் நடிப்பவர் என்ற கண்டனத்தையும் வெளிப்படுத்துகிறது.
- source_word: διαβλέψεις ... ἐκβαλεῖν
  choice: எடுப்பதற்குத் தெளிவாகப் பார்ப்பாய்
  rationale: διαβλέπω என்பதன் தெளிவாகக் காணும் பொருளையும் அதைத் தொடர்ந்து வரும் நோக்கத்தைக் குறிக்கும் வினையெச்சப் பொருளையும் தீர்மானிக்காமல் பேணுகிறது.
theological_decisions:
- issue: நெறிப்போதனையில் ἀδελφός என்ற ஆண்பால் உறவுமுறைச் சொல்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; உடன்விசுவாசி
  rationale: போதனை விரிவாகப் பொருந்தக்கூடியதாக இருந்தாலும், மூல உரை ஆண்பால் ஒருமையைப் பயன்படுத்துவதால் அதையே முதன்மை உரையில் பேணுகிறது.
- issue: κάρφος மற்றும் δοκός ஆகியவற்றின் மிகைப்படுத்திய உருவக முரண்
  choice: துரும்பு ... பெரிய மரக்கட்டை
  alternative: சிறு சிம்பு ... உத்திரம்; தூசி ... மரத்தூண்
  rationale: சிறிய குறையையும் மிகப் பெரிய குறையையும் எதிரெதிராக வைக்கும் இயேசுவின் கூர்மையான உருவகத்தைச் சீராக்காமல் பாதுகாக்கிறது.
- issue: διαβλέψεις என்பதன் நெறிசார் விளைவு
  choice: தெளிவாகப் பார்ப்பாய்
  alternative: தகுதியடைவாய்; சரியாக முடியும்
  rationale: மூலத்தில் உள்ள பார்வை உருவகத்தைத் தக்கவைத்து, அதை நெறிசார் தகுதி என்ற ஒரே விளக்கமாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், நேரடியும் கண்ணியமுமான போதனை நடையில் வடிவமைக்கப்பட்டது. “வெளிவேடக்காரனே” என்ற கடுமையான விளிப்பு மற்றும் துரும்பு–பெரிய மரக்கட்டை என்ற நகைமுரண் மிக்க மிகைப்படுத்தல் மெலிதாக்கப்படவில்லை. “எடுப்பதற்குத் தெளிவாகப் பார்ப்பாய்” என்பது சற்றே செறிவான அமைப்பாக இருந்தாலும், மூலத்தின் பார்வை உருவகத்தையும் நோக்கம்/விளைவு தொடர்பையும் பேணுகிறது.
