  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: ta
  text: ஆனால் அவர் அவர்களுடைய எண்ணங்களை[a] அறிந்திருந்தார். கை சூம்பியிருந்த அந்த மனிதனிடம், “எழுந்து, நடுவுக்கு வந்து நில்” என்றார். அவனும் எழுந்து நின்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய உள்ளார்ந்த தர்க்கங்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: அறிந்திருந்தார்
  rationale: οἶδα என்பதன் இவ்வடிவம் இங்கு அறிந்திருத்தலைக் குறிக்கிறது. தமிழ் கதைநடையில் இயல்பாகவும், அந்த அறிவு எவ்வாறு வந்தது என்று கூடுதலாக விளக்காமலும் இருக்க இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: διαλογισμοὺς
  choice: எண்ணங்களை
  rationale: இச்சொல் எண்ணங்கள், சிந்தனைகள், உள்ளார்ந்த ஆராய்ச்சிகள் ஆகிய பொருள்களைக் கொள்ளலாம். சூழலில் அவர்களுடைய மனத்திற்குள் நடந்ததைத் தெளிவாகவும் மிகையாகக் குறிப்பாக்காமலும் ‘எண்ணங்கள்’ தெரிவிக்கிறது.
- source_word: ἀνδρὶ
  choice: மனிதனிடம்
  rationale: ἀνήρ வயது வந்த ஆணைக் குறிக்கிறது. தமிழில் ‘அந்த மனிதன்’ என்பது ஆண் ஒருவரைக் குறிக்கும் இயல்பான சூழல்சார் வடிவம்.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: கை சூம்பியிருந்த
  rationale: ξηρός உடல் உறுப்பைப் பற்றியபோது உலர்ந்து சுருங்கிய அல்லது செயலிழந்த நிலையைக் குறிக்கிறது. ‘கை சூம்பியிருந்த’ என்பது நவீன தமிழில் புரியக்கூடிய, சுருக்கமான வருணனை.
- source_word: Ἔγειρε
  choice: எழுந்து
  rationale: அவர் இருந்த இடத்திலிருந்து எழும்பும்படி கொடுக்கப்பட்ட கட்டளை. அடுத்துவரும் στῆθι என்பதிலிருந்து இதைத் தனியே வைத்திருக்கிறது.
- source_word: στῆθι
  choice: நில்
  rationale: நின்றுகொள்ளும்படி கூறும் இரண்டாவது கட்டளையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἰς τὸ μέσον
  choice: நடுவில்
  rationale: கூடியிருந்தவர்களின் நடுப்பகுதியில் நிற்கும்படி கூறுவதை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் உள்ள திசைநோக்கிய நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀναστὰς ἔστη
  choice: அவனும் எழுந்து நின்றான்
  rationale: எழுதல், பின்னர் நிற்றல் என்ற இரு செயல்களையும் சுருக்காமல் வரிசையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மற்றவர்களின் உள்ளார்ந்த எண்ணங்களை இயேசு அறிந்திருத்தல்
  choice: அவர் அவர்களுடைய எண்ணங்களை அறிந்திருந்தார் என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: அவர்களுடைய நோக்கங்களை அவர் உணர்ந்துகொண்டார்; இயற்கைக்கு அப்பாற்பட்ட அறிவால் அவர்களுடைய சிந்தனைகளை அறிந்தார்
  rationale: அவர் அறிந்திருந்தார் என்று வசனம் கூறுகிறது; அந்த அறிவின் வழிமுறையை அது விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு கூற்றைப் பாதுகாத்து, அதன் இயல்பைப் பற்றிய இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கான மரியாதைப் பன்மையும், அந்த மனிதனுக்கான இயல்பான ஒருமைச் சுட்டும் கடைப்பிடிக்கப்பட்டுள்ளன.
