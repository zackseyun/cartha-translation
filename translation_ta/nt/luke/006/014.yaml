- from: சீமோன்—இவருக்கு அவர் பேதுரு என்றும் பெயரிட்டார்—சீமோனின் சகோதரரான அந்திரேயா, யாக்கோபு, யோவான், பிலிப்பு, பர்த்தலோமேயு,
