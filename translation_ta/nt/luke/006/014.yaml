source:
  edition: SBLGNT
  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: ta
  text: சீமோனையும்—அவருக்குப் பேதுரு என்றும் பெயரிட்டார்—அவருடைய சகோதரரான அந்திரேயாவையும், யாக்கோபையும், யோவானையும், பிலிப்புவையும், பர்த்தலோமேயுவையும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: சீமோன்
  rationale: இந்த அப்போஸ்தலரைக் குறிக்கும் Σίμων என்ற பெயரின் தமிழில் நிலைபெற்ற புதிய ஏற்பாட்டு வடிவம்.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: இவருக்கு அவர் பேதுரு என்றும் பெயரிட்டார்
  rationale: ὀνομάζω என்பதன் பெயரிடுதல் என்ற பொருளையும், καί தரும் ‘என்றும்/கூட’ என்ற நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Πέτρον
  choice: பேதுரு
  rationale: Πέτρος என்ற பெயரின் தமிழில் பரவலாக நிலைபெற்ற வேதாகம வடிவம்.
- source_word: Ἀνδρέαν
  choice: அந்திரேயா
  rationale: Ἀνδρέας என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: சீமோனின் சகோதரரான
  rationale: ἀδελφός இங்கு உடன்பிறந்த சகோதரனைக் குறிக்கிறது. αὐτοῦ யாரைக் குறிக்கிறது என்பது தமிழில் குழப்பமடையாதபடி, சூழலால் தெளிவான சீமோனைப் பெயரிட்டு இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἰάκωβον
  choice: யாக்கோபு
  rationale: Ἰάκωβος என்ற பெயரின் தமிழில் நிலைபெற்ற புதிய ஏற்பாட்டு வடிவம்.
- source_word: Ἰωάννην
  choice: யோவான்
  rationale: Ἰωάννης என்ற பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம்.
- source_word: Φίλιππον
  choice: பிலிப்பு
  rationale: Φίλιππος என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: Βαρθολομαῖον
  choice: பர்த்தலோமேயு
  rationale: Βαρθολομαῖος என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: καὶ
  choice: பட்டியலின் இணைப்பைத் தமிழில் காற்புள்ளிகளால் வெளிப்படுத்துதல்
  rationale: கிரேக்கப் பட்டியலில் மீண்டும் மீண்டும் வரும் καί-ஐ ஒவ்வொரு முறையும் ‘மற்றும்’ என்று மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருக்கும்; காற்புள்ளிகள் அதே ஒருங்கிணைப்பை இயல்பாகத் தருகின்றன.
