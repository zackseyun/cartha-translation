translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் பெயர்களின் நிலைபெற்ற தமிழ் வேதாகம வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. முந்தைய வசனத்தில் தொடங்கும் பட்டியல் இங்கே தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; இடைக்குறிப்பு சீமோனுக்குப் பேதுரு என்று பெயரிடப்பட்ட செய்தியைத் தெளிவாகப் பிரிக்கிறது.
