  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: ta
  text: மத்தேயுவையும் தோமாவையும், அல்பேயுவின் மகனான யாக்கோபையும், செலோத்தே[a] என்று அழைக்கப்பட்ட சீமோனையும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செலோத்தே’ என்பது கிரேக்கப் பட்டம். இதை ‘தீவிரப் பற்றுடையவர்’ என்றும் புரிந்துகொள்ளலாம்; ஆனால் அந்தச் சொல் மட்டுமே அவர் ஒரு குறிப்பிட்ட அரசியல் இயக்கத்தின் முறையான உறுப்பினர் என்று முடிவுசெய்யச் செய்வதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ஐயும் / -ஆனையும்
  rationale: பெயர்ப் பட்டியலில் கிரேக்கத்தின் தொடர்ச்சியான இணைப்பைத் தமிழின் இயல்பான ‘உம்’ இணைப்பால் வெளிப்படுத்துகிறது.
- source_word: Μαθθαῖον
  choice: மத்தேயு
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம்.
- source_word: Θωμᾶν
  choice: தோமா
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம்.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: அல்பேயுவின் மகனான யாக்கோபு
  rationale: பெயரிடும் இச்சூழலில் Ἁλφαίου என்ற உரிமை வேற்றுமை தந்தை–மகன் உறவைக் குறிக்கிறது; தமிழில் உறவைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: Σίμωνα
  choice: சீமோன்
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம்.
- source_word: τὸν καλούμενον
  choice: என்று அழைக்கப்பட்ட
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் அடையாளப்படுத்தும் பொருளை பட்டியல் நடையில் இயல்பாகத் தருகிறது.
- source_word: Ζηλωτὴν
  choice: ‘தீவிரப் பற்றாளர்’
  rationale: ஒருவரை அடையாளப்படுத்தும் அடைமொழியாக மொழிபெயர்க்கிறது; நவீன தமிழில் அரசியல் வன்முறையைக் குறிப்பதுபோல் ஒலிக்கக்கூடிய ‘தீவிரவாதி’ என்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: Ζηλωτής என்பது ஓர் அரசியல் குழுவின் முறையான உறுப்பினர் பட்டமா அல்லது தீவிரப் பற்றைக் குறிக்கும் அடைமொழியா?
  choice: ‘தீவிரப் பற்றாளர்’ என்ற அடைமொழியாக மொழிபெயர்த்து, வரலாற்றுச் சிறப்புப் பொருளை அடிக்குறிப்பில் திறந்துவைத்தல்.
  alternative: ‘செலோத்தே’ என்று ஒலிபெயர்த்தல் அல்லது ‘செலோத்தர் கட்சியைச் சேர்ந்தவர்’ என்று குறிப்பாக்குதல்.
  rationale: கிரேக்கச் சொல் அடைமொழியை உறுதிப்படுத்தினாலும், பிற்காலத்தில் அறியப்பட்ட ஓர் அரசியல் இயக்கத்தில் முறையான உறுப்பினர் என்பதைத் தனியாக நிரூபிப்பதில்லை. ஆகவே உரையிலுள்ள தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பெயர்ப் பட்டியலின் தொடர்ச்சியை ‘உம்’ இணைப்புகள் காக்கின்றன. வசனம் முந்தைய வாக்கியத்திலிருந்து தொடர்வதால், தமிழில் முழுமையான வாசிப்புக்காக ‘தேர்ந்தெடுத்தார்’ இறுதியில் சேர்க்கப்பட்டுள்ளது; இது லூக்கா 6:13-இன் ஆளும் வினையை வெளிப்படையாக மீட்டுரைக்கிறது.
