  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: ta
  text: ஆனால் அவர்களோ மதியீனத்தால் நிறைந்தார்கள்[a]; இயேசுவை என்ன செய்யலாம் என்று ஒருவரோடு ஒருவர் ஆலோசித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மதிகேட்டால் நிறைந்தார்கள்” அல்லது “மூடத்தனத்தால் நிறைந்தார்கள்.” கிரேக்கச் சொல் பகுத்தறிவின்மை, மூடத்தனம், அல்லது மதிகெட்ட நிலை ஆகியவற்றைக் குறிக்கலாம்; இச்சூழலில் அது பகுத்தறிவற்ற சீற்றத்தையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: ஆனால் அவர்களோ
  rationale: δὲ குறிக்கும் முரண்பாட்டையும் αὐτοὶ என்பதன் அழுத்தத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: மதிகெட்ட சீற்றத்தால் நிறைந்தார்கள்
  rationale: நிறைதலைக் குறிக்கும் கிரேக்க மரபுத்தொடரைப் பேணுகிறது; ἄνοια என்பதிலுள்ள பகுத்தறிவின்மை/மதிகேடு என்ற பொருளையும், இச்சூழலில் வெளிப்படும் கடும் கோபத்தையும் இணைத்துக் காட்டுகிறது.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: ஒருவரோடு ஒருவர் ஆலோசித்துக்கொண்டிருந்தார்கள்
  rationale: பரஸ்பர உரையாடலையும் imperfect வினை வடிவம் சுட்டும் தொடர்ச்சியான ஆலோசனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τί ἂν ποιήσαιεν
  choice: என்ன செய்யலாம்
  rationale: ἄν + optative குறிக்கும் ஆலோசனை சார்ந்த சாத்தியத்தை, கடமை அல்லது வெறும் திறன் என்று மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: τῷ Ἰησοῦ
  choice: இயேசுவை
  rationale: தமிழில் ‘ஒருவரை என்ன செய்வது’ என்ற அமைப்பு, அந்த நபர்மீது செய்ய நினைக்கும் செயலை இயல்பாகக் குறிக்கிறது; ‘எதிராக’ என்று மூலத்தில் வெளிப்படையாக இல்லாததைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἀνοίας என்பதை மனநோயைக் குறிப்பதுபோல் மொழிபெயர்ப்பதா, அல்லது பகுத்தறிவற்ற சீற்றமாக வெளிப்படுத்துவதா
  choice: மதிகெட்ட சீற்றம்
  alternative: பைத்தியம்; மதியீனம்; மூடத்தனம்
  rationale: இச்சொல் பகுத்தறிவின்மை, மதிகேடு, மூடத்தனம் ஆகிய பொருள்களைத் தரலாம். ஓய்வுநாளில் இயேசு குணமாக்கியதற்கான எதிரிகளின் பகைமையான எதிர்வினை இங்கு உணர்ச்சிசார் சீற்றத்தையும் உணர்த்துகிறது. ‘மதிகெட்ட சீற்றம்’ நவீன மருத்துவப் பொருளைத் திணிக்காமல் இரு கூறுகளையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், ஆனால் கண்ணியமான நடை. ‘அவர்களோ’ மூலம் எதிர்மறை மாறுபாடு வலியுறுத்தப்பட்டுள்ளது; ‘ஆலோசித்துக்கொண்டிருந்தார்கள்’ தொடர்ந்த பரஸ்பர விவாதத்தை வெளிப்படுத்துகிறது.
