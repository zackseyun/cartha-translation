  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: ta
  text: 'மேலும் அவர் அவர்களிடம் கூறினார்: “மனிதகுமாரன் ஓய்வுநாளின் ஆண்டவர்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுமாரன் ஓய்வுநாளின் மீது அதிகாரம் கொண்டவர்.”
    reason: κύριος என்பதுடன் வரும் உடைமை வேற்றுமை, ‘ஓய்வுநாளின் ஆண்டவர்’ என்றும் ‘ஓய்வுநாளின் மீது அதிகாரம் கொண்டவர்’ என்றும் தமிழில் வெளிப்படுத்தப்படலாம்.
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய நிகழ்வோடு இணைக்கும் எளிய தொடர்ச்சிச் சொல்லாகும்; கிரேக்கத்தில் இல்லாத குறிப்பான கால வரிசையைச் சேர்க்கவில்லை.
- source_word: ἔλεγεν
  choice: கூறினார்
  rationale: இறந்தகால நிறைவுறா வினை வடிவம் தொடர்ச்சி அல்லது மீளுரைப்பைக் குறிக்கக்கூடும். எனினும் மேற்கோளை அறிமுகப்படுத்தும் தமிழ் கதைநடையில் ‘கூறினார்’ இயல்பாக உள்ளது; ‘கூறிக்கொண்டிருந்தார்’ இங்கு தேவையற்ற நீடிப்பை வலியுறுத்தக்கூடும்.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பன்மை மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உரையில் இல்லாத அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: Κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இது வெறும் மரியாதை விளிப்பு அல்ல; அதிகாரத்தை வெளிப்படுத்தும் பட்டப்பெயர். ‘ஆண்டவர்’ அந்த வலிமையையும் கிறிஸ்துவியல் நயத்தையும் காக்கிறது.
- source_word: τοῦ σαββάτου
  choice: ஓய்வுநாளின்
  rationale: κύριος என்பதுடன் வரும் கிரேக்க உடைமை வேற்றுமையைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது. சூழலில் இது வாராந்திர ஓய்வுநாளைக் குறிக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசு பயன்படுத்தும் நிலைபெற்ற பட்டப்பெயரையும் அதன் செமித்தியப் பின்னணி மற்றும் தானியேல் 7 தொடர்புக்கான வாய்ப்பையும் காக்கும் பரவலாக அறியப்பட்ட தமிழ் வடிவம்.
theological_decisions:
- issue: ஓய்வுநாளைக் குறித்த மனிதகுமாரனின் அதிகாரம்
  choice: “மனிதகுமாரன் ஓய்வுநாளின் ஆண்டவர்” என்று நேரடியான ஆண்டவர்தன்மை உரிமைகோரலாக மொழிபெயர்க்கப்பட்டது.
  alternative: “மனிதகுமாரன் ஓய்வுநாள்மேல் அதிகாரமுள்ள ஆண்டவர்.”
  rationale: கிரேக்கச் சொற்றொடர் மனிதகுமாரனுக்கும் ஓய்வுநாளுக்கும் இடையிலான ஆண்டவர்–அதிகார உறவை வலுவாகக் கூறுகிறது. ‘கூட’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் அதன் கிறிஸ்துவியல் அழுத்தம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்,’ ‘ஆண்டவர்,’ ‘மனிதகுமாரன்’ ஆகியவை வாசகர்களுக்கு அறிமுகமான வேதாகமச் சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு இயல்பான நவீன தமிழில் வைக்கப்பட்டுள்ளது.
