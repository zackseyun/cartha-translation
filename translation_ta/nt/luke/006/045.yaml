id: LUK.6.45
reference: Luke 6:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: ta
  text: நல்ல மனிதர் தமது இதயத்தின் நல்ல கருவூலத்திலிருந்து நல்லதை வெளிக்கொணர்கிறார்; தீய மனிதரோ தீய கருவூலத்திலிருந்து தீயதை வெளிக்கொணர்கிறார். ஏனெனில் இதயத்தில் நிரம்பி வழிவதையே அவரது வாய் பேசுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதயத்தின் மிகுதியிலிருந்தே அவரது வாய் பேசுகிறது.”
    reason: περισσεύματος என்பதற்கு ‘நிரம்பி வழிவது’ என்றும் ‘மிகுதி’ என்றும் பொருள் கொள்ள முடியும்.
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: நல்ல மனிதர்
  rationale: ἀγαθός என்பதன் ஒழுக்கநெறி சார்ந்த ‘நல்ல’ என்ற பொருளையும், ἄνθρωπος என்பதன் பொதுவான மனிதக் குறிப்பையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: θησαυροῦ
  choice: கருவூலம்
  rationale: உள்ளத்தில் சேமித்து வைக்கப்பட்டிருக்கும் வளத்தைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது; ‘சேமிப்பு’ என்பதைவிட உயர்ந்த, ஆனால் புரிந்துகொள்ளக்கூடிய நடை.
- source_word: καρδίας
  choice: இதயம்
  rationale: எண்ணம், விருப்பம், மனப்பாங்கு ஆகியவற்றை உள்ளடக்கும் உள்ளார்ந்த மனிதனைச் சுட்டும் வழக்கமான வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
- source_word: προφέρει
  choice: வெளிக்கொணர்கிறார்
  rationale: உள்ளே இருப்பது வெளியே கொண்டுவரப்படுகிறது என்ற மூலப்படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: தீய / தீயதை
  rationale: சொல்லின் ஒழுக்கநெறி சார்ந்த வலிமையைத் தக்கவைத்து, ‘நல்ல’ என்பதற்கு தெளிவான எதிரிணையாக அமைகிறது.
- source_word: περισσεύματος
  choice: நிரம்பி வழிவது
  rationale: மிகுதியாக இருப்பது வெளியே வழிகிறது என்ற சொல்லின் படிமத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது; ‘மிகுதி’ என்ற நேரடியான மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λαλεῖ
  choice: பேசுகிறது
  rationale: பழமொழித் தன்மையுள்ள கூற்றுக்கு ஏற்ற இயல்பான, கண்ணியமான தமிழ் வினைச்சொல்.
- source_word: τὸ στόμα αὐτοῦ
  choice: அவரது வாய்
  rationale: உள்ளத்தின் நிலை வாய்மொழியில் வெளிப்படுகிறது என்பதை வலியுறுத்தும் மூலத்தின் ‘வாய்’ என்ற வெளிப்படையான குறிப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀγαθός/πονηρός என்பவற்றிலுள்ள ஒழுக்கநெறி முரண்பாடு
  choice: ‘நல்ல’ மற்றும் ‘தீய’ என்ற ஒழுக்கநெறி வகைப்பாடுகளைத் தக்கவைத்தல்
  alternative: ‘நலமான’ மற்றும் ‘கெட்ட’ என்று மென்மைப்படுத்துதல்
  rationale: இவ்வசனம் மனிதரின் ஒழுக்கப் பண்பும் அதன் வெளிப்பாடும் பற்றியது; எனவே மூலத்தின் நன்மை–தீமை எதிரிணையைத் தெளிவாகப் பாதுகாக்க வேண்டும்.
- issue: περισσεύματος என்பதன் உருவகம்
  choice: இதயத்தில் ‘நிரம்பி வழிவது’ என்று மொழிபெயர்த்தல்
  alternative: இதயத்தின் ‘மிகுதியிலிருந்து’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலச்சொல் மிகுதி அல்லது நிறைவைச் சுட்டலாம்; பிரதான உரை அதன் வழிந்தோடும் படிமத்தை இயல்பாகத் தருகிறது, மாற்று பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பழமொழி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனிதர்/அவர்’ வடிவங்கள் பொதுமனிதரைக் குறிக்கும் மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளன; இரு ஒழுக்க வகைகளுக்கும் ஒரே இலக்கண நடை பேணப்பட்டுள்ளது.
