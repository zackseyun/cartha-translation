  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: ta
  text: ஆனால் பரிசேயர்களில் சிலர், “ஓய்வுநாட்களில்[a] செய்யக் கூடாததை நீங்கள் ஏன் செய்கிறீர்கள்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘ஓய்வுநாட்களில்’ என்று பன்மையில் உள்ளது; இது ‘ஓய்வுநாளில்’ என்ற பொருளில் பொதுவாகப் பயன்படுத்தப்பட்ட ஒரு சொல்வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς τῶν Φαρισαίων
  choice: பரிசேயர்களில் சிலர்
  rationale: இது பரிசேயர்கள் அனைவரையும் அல்ல, அவர்களில் ஒரு பகுதியினரை மட்டும் குறிக்கிறது. தமிழில் இந்தப் பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து எதிர்ப்பான திருப்பத்தைச் சுட்டுகிறது.
- source_word: Τί ποιεῖτε
  choice: நீங்கள் ஏன் செய்கிறீர்கள்?
  rationale: τί என்பதன் அடிப்படைப் பொருள் ‘என்ன?’ என்றாலும், இங்கு செயலை எதிர்த்துக் கேட்கும் வினாவில் ‘ஏன்?’ என்பதே தமிழில் இயல்பாக அதன் நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ὃ οὐκ ἔξεστιν
  choice: செய்யக் கூடாததை
  rationale: ἔξεστιν இங்கு அனுமதிக்கப்பட்டிருப்பதைக் குறிக்கிறது. ‘செய்யக் கூடாதது’ என்பது சட்டம் அல்லது சமய நடைமுறை அனுமதிக்காத செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாட்களில்
  rationale: மூலத்தில் உள்ள பன்மை வடிவத்தைத் தக்கவைக்கிறது; இதன் வழக்குப் பொருள் வாராந்திர ஓய்வுநாளைக் குறிக்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த பேச்சை எளிமையாகக் கூறும் கிரேக்க இறந்தகால வினைக்கு இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ஓய்வுநாளைக் குறிக்கும் பன்மை வடிவம்
  choice: ஓய்வுநாட்களில்
  alternative: ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் τοῖς σάββασιν என்ற பன்மை வடிவம் உள்ளது. மூல வடிவத்தை முதன்மை உரையில் தக்கவைத்து, அது ஒருமைப் பொருளிலும் வழங்கும் வழக்குச் சொற்றொடர் என்பதை அடிக்குறிப்பில் குறிப்பிடுவது மூலத் தெளிவையும் இயல்பான புரிதலையும் இணைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடி உரை. கேள்வியின் எதிர்ப்புத் தொனியை ‘ஏன்’ என்பதும், அனுமதி சார்ந்த பொருளை ‘செய்யக் கூடாததை’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
