id: LUK.6.32
reference: Luke 6:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: ta
  text: உங்களை நேசிக்கிறவர்களையே நீங்கள் நேசித்தால், அதில் உங்களுக்கு என்ன பாராட்டு இருக்கிறது?[a] பாவிகளும்கூட தங்களை நேசிக்கிறவர்களை நேசிக்கிறார்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில் உங்களுக்கு என்ன கிருபை இருக்கிறது?” கிரேக்கச் சொல் “கிருபை,” “பாராட்டு,” அல்லது “நன்மதிப்பு” எனப் பொருள்படலாம்; இங்கே பாராட்டத்தக்கதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: நேசிக்கிற / நேசித்தால் / நேசிக்கிறார்கள்
  rationale: மூன்று இடங்களிலும் ஒரே வேர்ச்சொல்லைப் பயன்படுத்தி, கிரேக்க மூலத்திலுள்ள சொல்லிணைப்பையும் வலியுறுத்தலையும் பாதுகாக்கிறது.
- source_word: ποία
  choice: என்ன
  rationale: கேள்வியின் பண்புசார் பொருளை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: χάρις
  choice: பாராட்டு
  rationale: இச்சூழலில் மீட்புசார் ‘கிருபை’ என்பதைக் காட்டிலும், பாராட்டத்தக்க தன்மை அல்லது அங்கீகாரம் என்பதே முன்னிலையில் உள்ளது.
- source_word: ἁμαρτωλοὶ
  choice: பாவிகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் கிரேக்கப் பெயரடையின் நேரடியான, வழக்கமான புதிய ஏற்பாட்டுத் தமிழ் வடிவம்.
- source_word: καὶ γὰρ
  choice: பாவிகளும்கூட ... -ஆர்களே
  rationale: καί-யின் ‘கூட’ என்ற வலியுறுத்தலையும் γάρ தரும் ஆதார விளக்கத்தையும் தமிழ் வாக்கிய இறுதியிலுள்ள ‘-ஆர்களே’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: χάρις என்பதுடன் சேர்ந்துள்ள பயனிலை வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றில் χάρις என்பதன் பொருள்
  choice: மீட்புசார் அல்லாத ‘பாராட்டு/பாராட்டத்தக்க தன்மை’
  alternative: கிருபை; நன்றி; நன்மதிப்பு
  rationale: உங்களை நேசிப்பவர்களை மட்டுமே நேசிப்பதில் தனிப்பட்டுப் பாராட்டத்தக்கது என்ன என்பதே உடனடிச் சூழல். ‘கிருபை’ என்று முதன்மை உரையில் மொழிபெயர்த்தால், இங்கு முன்னிலையிலில்லாத கோட்பாட்டுச் சார்பை வாசகர் கொண்டு வரக்கூடும்; எனினும் மூலச்சொல்லின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘நேசிக்க’ என்ற சொல்லை எல்லா நிகழ்வுகளிலும் ஒரேபோல் வைத்து மூலத்தின் மறுபடியுரைத்தலைப் பாதுகாக்கிறது. ‘-ஆர்களே’ ஆதாரமளிக்கும் வாக்கியத்தின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
