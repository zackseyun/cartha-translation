id: LUK.6.29
reference: Luke 6:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: ta
  text: உன்னை கன்னத்தில்[a] அடிக்கிறவனுக்கு மற்ற கன்னத்தையும் முன்வை[b]; உன் மேலாடையை[c] எடுத்துக்கொள்கிறவனை உன் உள் ஆடையையும் எடுத்துக்கொள்ளத் தடுக்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாடையில்.’
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரிய மொழிபெயர்ப்புகளில் அடிக்கடி ‘மற்ற கன்னத்தையும் திருப்பிக்காட்டு’ என்று வருகிறது. ஆனால் இங்குள்ள கிரேக்கம் இன்னும் நேரடியாக ‘மற்றதையும் முன்வை/அளி’ என்று கூறுகிறது.
    reason: alternative_reading
  - marker: c
    text: ‘மேலாடை’ (ἱμάτιον) என்பது வெளிப்புற ஆடை; ‘உள் ஆடை’ (χιτών) என்பது உடலுக்கு அருகில் அணியும் ஆடை.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: உன்னை அடிக்கிறவனுக்கு
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, இச்செயலைச் செய்கிற ஒருவரைப் பொதுவாகக் குறிக்கிறது. ‘அடிக்கிறவன்’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: கன்னத்தில்
  rationale: σιαγών என்பதற்கு ‘தாடை’ அல்லது ‘கன்னம்’ என்ற பொருள் வரலாம். முகத்தில் அடிக்கப்படுவதைக் குறிக்கும் இச்சூழலில் ‘கன்னம்’ இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πάρεχε καὶ τὴν ἄλλην
  choice: மற்ற கன்னத்தையும் முன்வை
  rationale: παρέχω என்பதன் ‘அளி/வழங்கு/முன்வை’ என்ற பொருளை ‘முன்வை’ இயல்பாக வெளிப்படுத்துகிறது. மத்தேயுவின் இணைப் பகுதியில் உள்ள ‘திருப்பு’ என்ற சொல்லை இங்கு இறக்குமதி செய்யாமல், லூக்காவின் தனித்த சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον
  choice: உன் மேலங்கியை எடுத்துக்கொள்கிறவனுக்கு
  rationale: αἴρω இங்கு ஆடையை எடுத்துக்கொள்வதையோ அகற்றுவதையோ குறிக்கிறது. ἱμάτιον வெளிப்புற ஆடை என்பதால் ‘மேலங்கி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸν χιτῶνα
  choice: உன் உள்ளங்கி
  rationale: χιτών உடலுக்கு அருகில் அணியப்படும் உள் ஆடையைக் குறிக்கிறது. ‘உள்ளங்கி’ என்பது மேலங்கியிலிருந்து அதன் வேறுபாட்டைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: μὴ κωλύσῃς
  choice: கொடுக்க மறுக்காதே
  rationale: κωλύω என்பதன் அடிப்படை உணர்வு தடுத்தல் அல்லது அனுமதிக்காமல் இருத்தல். ஆடையை எடுத்துக்கொள்ளும் இச்சூழலில் ‘கொடுக்க மறுக்காதே’ என்பது எதிர்ப்பதையோ தடுத்து வைத்துக்கொள்வதையோ இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: லூக்காவின் சொற்றொடரை மத்தேயுவின் பழக்கமான ‘மறு கன்னத்தைத் திருப்பு’ என்ற வடிவத்துடன் ஒத்திசைப்பதா
  choice: லூக்காவின் தனித்த சொல் தேர்வைப் பாதுகாத்து, ‘மற்ற கன்னத்தையும் முன்வை’ என்று மொழிபெயர்த்தல்
  alternative: ‘மறு கன்னத்தையும் திருப்பிக்காட்டு’
  rationale: இங்கு கிரேக்கத்தில் ‘திருப்பு’ என்பதற்கான வினைச்சொல் இல்லை; πάρεχε என்பது ‘முன்வை/அளி’ என்று பொருள்படும். ஆகவே இணை நற்செய்திப் பகுதியின் மொழியைச் சேர்க்காமல் மூலத்தைப் பின்பற்றுகிறது.
- issue: கட்டளைகளின் கடுமையை விளக்கக் குறிப்புகளால் முதன்மை உரையிலேயே மென்மைப்படுத்துவதா
  choice: எந்தத் தகுதிப்படுத்தலையும் சேர்க்காமல் நேரடிக் கட்டளைகளாக வைத்தல்
  alternative: பழிவாங்காமை, மிகைப்படுத்தல் அல்லது நடைமுறை வரம்புகள் பற்றிய விளக்கத்தை முதன்மை உரையில் சேர்த்தல்
  rationale: மூல உரை நேரடியான இரண்டாம் நபர் கட்டளைகளை வழங்குகிறது. அவற்றின் நெறியியல் மற்றும் இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் அப்படியே வைத்திருக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் கட்டளைக்குரிய நேர்மையும் கண்ணியமும் நிலைக்குமாறும் வடிவமைக்கப்பட்டது. ‘முன்வை’ என்பது இலக்கியமாக மிகப் பழமையில்லாமல், ‘திருப்பு’ என்ற ஒத்திசைப்பையும் தவிர்க்கிறது; ஆடைச் சொற்கள் இரண்டிற்குமுள்ள பண்பாட்டு வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
