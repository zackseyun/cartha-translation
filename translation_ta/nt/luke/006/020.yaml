reference: Luke 6:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: ta
  text: அவரே தமது சீடர்களை நோக்கிக் கண்களை உயர்த்தி, “ஏழைகள் பேறுபெற்றவர்கள்[a][b]; ஏனெனில் இறைவனுடைய அரசு உங்களுடையது” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏழைகளாகிய நீங்கள் பேறுபெற்றவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் முதல் சொற்றொடர் மூன்றாம் நபர் வடிவில் உள்ளது; அடுத்து வரும் ‘உங்களுடையது’ என்பது சீடர்களை நேரடியாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'இங்கு லூக்கா ‘ஏழைகள்’ என்றே கூறுகிறார்; ‘ஆவியில் ஏழைகள்’ என்று கூறவில்லை (ஒப்பிடுக: மத்தேயு 5:3).'
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: கண்களை உயர்த்தி
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முன்நிகழ் செயலைத் தமிழில் இயல்பான வினையெச்சமாகவும், பார்வையை உயர்த்தும் தெளிவான உருவகத்துடனும் தருகிறது.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: தமது சீடர்களை நோக்கி
  rationale: εἰς இங்கு பார்வையின் திசையைக் குறிக்கிறது; ‘நோக்கி’ என்பது அதற்கான இயல்பான நவீனத் தமிழ்.
- source_word: ἔλεγεν
  choice: என்று கூறினார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை உரையை அறிமுகப்படுத்துகிறது. ‘கூறிக்கொண்டிருந்தார்’ என்பது தமிழில் தேவையற்ற நீடித்த செயல் உணர்வை உண்டாக்கக்கூடும்; ‘கூறினார்’ இச்சூழலில் இயல்பான உரையறிமுகம்.
- source_word: Μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனமகிழ்ச்சியைக் காட்டும் ‘மகிழ்ச்சியானவர்கள்’ என்பதைக் காட்டிலும், இறைவனிடமிருந்து கிடைக்கும் நல்வாழ்வு மற்றும் அங்கீகாரத்தின் ஆழத்தை இது தாங்குகிறது; ‘பாக்கியவான்கள்’ என்பதைக் காட்டிலும் இன்றைய பொதுத் தமிழில் எளிதாகப் புரிகிறது.
- source_word: οἱ πτωχοί
  choice: ஏழைகள்
  rationale: பெயரடையைப் பெயர்ச்சொல்லாகப் பயன்படுத்தும் கிரேக்க வடிவத்தைத் தெளிவாகத் தருகிறது; மத்தேயு 5:3-இன் ‘ஆவியில் ஏழைகள்’ என்ற விரிவாக்கத்தை இங்கு சேர்க்கவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள பேற்றுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ὑμετέρα ἐστὶν
  choice: உங்களுடையது
  rationale: இரண்டாம் நபர் பன்மை உடைமையைத் தெளிவாகக் காக்கிறது; சீடர்களை நேரடியாக நோக்கிய உரை என்பதை வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: இறைவனுடைய அரசு
  rationale: βασιλεία என்பதன் அரசாட்சி மற்றும் ஆட்சிக்குட்பட்ட நிலை ஆகிய பரப்பைத் திறந்தவாறு வைக்கும் நிறுவப்பட்ட, புரியக்கூடிய தமிழ் வடிவம்.
theological_decisions:
- issue: πτωχοί என்பது ஆன்மீக ஏழ்மையா அல்லது பொருளாதார/சமூக ஏழ்மையா
  choice: ஏழைகள்
  alternative: ஆவியில் ஏழைகள்
  rationale: லூக்காவின் கிரேக்க உரை ‘ஏழைகள்’ என்று மட்டுமே கூறுகிறது. மத்தேயுவின் இணை வசனத்திலிருந்து ‘ஆவியில்’ என்பதைச் சேர்ப்பது லூக்காவின் தனித்த வலியுறுத்தலை மறைத்துவிடும்.
- issue: முதல் வாக்கியத்தை மூன்றாம் நபர் வடிவிலா அல்லது நேரடி அழைப்பாகவா மொழிபெயர்ப்பது
  choice: ஏழைகள் பேறுபெற்றவர்கள்
  alternative: ஏழைகளாகிய நீங்கள் பேறுபெற்றவர்கள்
  rationale: οἱ πτωχοί இலக்கண வடிவில் மூன்றாம் நபராக உள்ளது; உடன்வரும் ὑμετέρα (‘உங்களுடையது’) நேரடி உரையை வெளிப்படுத்துகிறது. முதன்மை உரை இந்த இரு அம்சங்களுக்கிடையிலான மாற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்’ என்பது வழிபாட்டு மரபுச் சொல்லான ‘பாக்கியவான்கள்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு தெளிவானது. மூலத்தின் மூன்றாம் நபர் வடிவத்தையும் தொடர்ந்து வரும் நேரடி இரண்டாம் நபர் உடைமையையும் தமிழிலும் பாதுகாத்துள்ளோம்.
