  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: ta
  text: மறைநூல் அறிஞர்களும் பரிசேயர்களும், அவர் ஓய்வுநாளில் குணமாக்குவாரா என்று அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்[a]; அவர்மேல் குற்றம் சுமத்துவதற்கான காரணத்தைக் கண்டுபிடிப்பதற்காகவே அவ்வாறு செய்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை உன்னிப்பாகக் கண்காணித்துக்கொண்டிருந்தார்கள்.” கிரேக்க வினைச்சொல் கூர்ந்த, சூழலில் பகைமை கலந்த கண்காணிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவர்மேல் குற்றம் சுமத்த வழி கண்டுபிடிப்பதற்காக.” கிரேக்கத் தொடர் அவருக்கு எதிராகக் குற்றச்சாட்டு சுமத்துவதற்கான அடிப்படை அல்லது வாய்ப்பைத் தேடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்த செயலைக் குறிக்கும் இறந்தகால வடிவத்தையும், சூழலில் உள்ள சந்தேகமும் பகைமையும் கலந்த உன்னிப்பான கண்காணிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அவரை’ என்பது சூழலிலிருந்து தெளிவாகிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: யூத வேதச்சட்டங்களைப் படித்து விளக்கியவர்களைக் குறிக்கும் சொல்லை, இன்றைய பொதுவாசகருக்குப் புரியும் வகையில் அவர்களது பணியை எடுத்துரைக்கும் சொல்லாக மொழிபெயர்க்கிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: வரலாற்றுச் சமயக் குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: εἰ
  choice: என்று
  rationale: கவனித்தல் என்ற வினையுடன் வரும் மறைமுக வினாவை, ‘குணமாக்குவாரா என்று’ என இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: கிரேக்க ஒருமையையும் காலத்தைக் குறிக்கும் பயன்பாட்டையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: θεραπεύει
  choice: குணமாக்குவாரா
  rationale: மறைமுக வினாவின் சூழலில், அவர்கள் எதிர்பார்த்த நிகழ்வைத் தமிழில் இயல்பாகக் குறிக்கிறது; இயேசு ஒருவரைக் குணப்படுத்துவாரா என்பதே கேள்வி.
- source_word: ἵνα εὕρωσιν
  choice: ஏதாவது காரணம் கிடைக்குமா என்பதே அவர்களுடைய நோக்கம்
  rationale: ἵνα கூறும் நோக்கத்தைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; அவர்களது கண்காணிப்பின் குறிக்கோளை மறைப்பதில்லை.
- source_word: κατηγορεῖν αὐτοῦ
  choice: அவர்மேல் குற்றம் சுமத்துவதற்கு
  rationale: அவருக்கு எதிராகக் குற்றச்சாட்டு முன்வைப்பதைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான சட்ட/பொது தமிழ் வழக்கில் தருகிறது.
theological_decisions:
- issue: எதிர்ப்பாளர்களின் நோக்கம் எவ்வாறு சித்தரிக்கப்படுகிறது
  choice: அவர்கள் உன்னிப்பாகக் கவனித்தது இயேசுவுக்கு எதிராகக் குற்றம் சுமத்தக் காரணம் தேடுவதற்காகவே என வெளிப்படையாகத் தரப்பட்டது.
  alternative: அவர்கள் அவர் குணமாக்குகிறாரா என்பதை நடுநிலையாகக் கவனித்தார்கள் என்று மொழிபெயர்க்கலாம்.
  rationale: παρετηροῦντο என்பதன் சூழல்சார்ந்த பகைமை நுணுக்கமும், ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ என்ற நோக்கக் கூற்றும் சேர்ந்து நடுநிலையற்ற கண்காணிப்பைக் காட்டுகின்றன; அதற்கு மேல் எந்த நோக்கத்தையும் மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான விவிலிய உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; நோக்கத் தொடர்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு சுட்டிகளும் உரையில் இடம்பெற்றுள்ளன.
