review_pass:
  verdict: revise
  source_fidelity: The two present plural imperatives and their objects are retained. ‘உங்களைச் சபிக்கிறவர்களை’ accurately renders the substantival participle ‘those who curse you,’ and ‘உங்களை மோசமாக நடத்துகிறவர்களுக்காக’ preserves the broad hostile-mistreatment sense of ἐπηρεάζω without restricting it to either insult or physical abuse. ‘ஜெபியுங்கள்’ directly conveys προσεύχεσθε as prayer.
  naturalness: The revision uses idiomatic modern standard Tamil. ‘மோசமாக நடத்துகிறவர்கள்’ is more natural than ‘தவறாக நடத்துகிறவர்கள்’ for persons who treat someone badly. ‘ஜெபியுங்கள்’ is the established, immediately clear Tamil biblical term for prayer; ‘மன்றாடுங்கள்’ can more specifically suggest earnest pleading and may overstate the manner of the prayer.
  terminology: ‘ஆசீர்வதியுங்கள்’ and ‘சபிக்கிறவர்களை’ maintain the deliberate lexical and ethical contrast in the Greek. ‘ஜெபியுங்கள்’ preserves the key prayer term without adding an explicit recipient or a doctrinal interpretation. The footnote remains attached to the phrase governed by ἐπηρεαζόντων.
  issues:
  - severity: low
    issue: ‘மன்றாடுங்கள்’ can imply urgent entreaty rather than prayer in general.
    rationale: προσεύχεσθε commands prayer but does not specify an especially pleading manner. ‘ஜெபியுங்கள்’ is the standard direct equivalent and avoids this possible semantic intensification.
  - severity: low
    issue: ‘உங்களைத் தவறாக நடத்துகிறவர்கள்’ is somewhat less idiomatic in this context.
    rationale: ‘உங்களை மோசமாக நடத்துகிறவர்கள்’ is a natural modern Tamil expression for those who mistreat someone and retains the source term’s breadth.
  revised_text: உங்களைச் சபிக்கிறவர்களை ஆசீர்வதியுங்கள்; உங்களை மோசமாக நடத்துகிறவர்களுக்காக[a] ஜெபியுங்கள்.
