- from: உங்களைச் சபிக்கிறவர்களை ஆசீர்வதியுங்கள்; உங்களைத் தவறாக நடத்துகிறவர்களுக்காக[a] மன்றாடுங்கள்.
  to: உங்களைச் சபிக்கிறவர்களை ஆசீர்வதியுங்கள்; உங்களை மோசமாக நடத்துகிறவர்களுக்காக[a] ஜெபியுங்கள்.
