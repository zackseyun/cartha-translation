reference: Luke 6:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: ta
  text: உங்களைச் சபிக்கிறவர்களை ஆசீர்வதியுங்கள்; உங்களை மோசமாக நடத்துகிறவர்களுக்காக[a] ஜெபியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் துன்புறுத்துகிறவர்களுக்காக” அல்லது “உங்களை அவமதிக்கிறவர்களுக்காக.” கிரேக்க வினைச்சொல் பலவகையான பகைமையான தவறான நடத்தைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: ஆசீர்வதியுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் கட்டளை வலிமையையும், ‘சபித்தல்’ என்பதற்கு எதிரான நெறிசார் முரண்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: உங்களைச் சபிக்கிறவர்களை
  rationale: பெயர்ச்சொல் செயல்பாட்டில் உள்ள பங்கேற்புவினையை இயல்பான தொடர்பெயர் அமைப்பில் வழங்கி, தீங்கு வேண்டிச் சபிக்கும் பகைமையான பேச்சைத் தக்கவைக்கிறது.
- source_word: προσεύχεσθε
  choice: மன்றாடுங்கள்
  rationale: பன்மை ஏவலின் நேரடிக் கட்டளையைத் தருகிறது. ‘ஜெபியுங்கள்’ என்பதும் வழக்கமானது; ஆனால் ‘மன்றாடுங்கள்’ என்பது நவீன செந்தமிழில் இறைவனை நோக்கிய வேண்டுதலைத் தெளிவாகச் சொல்கிறது.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: உங்களைத் தவறாக நடத்துகிறவர்களுக்காக
  rationale: περί என்பதை இங்கு வேண்டுதலின் பயனாளியைச் சுட்டும் ‘-க்காக’ என வழங்குகிறது. ἐπηρεάζω குறிக்கும் இழிவுபடுத்துதல், அவமதித்தல், துன்புறுத்துதல் ஆகிய பகைமையான நடத்தைகளின் பரப்பை மிகையாகக் குறுக்காமல் ‘தவறாக நடத்துதல்’ காக்கிறது.
theological_decisions:
- issue: பகைவர்களிடம் காட்ட வேண்டிய அன்புக் கட்டளைகளின் வரம்பு
  choice: பகைமையான செயலுக்குப் பதிலாக ஆசீர்வாதமும் வேண்டுதலும் செய்யும்படி கூறும் நேரடிக் கட்டளைகளாக மொழிபெயர்த்தல்
  alternative: கட்டளைகளின் நடைமுறை அல்லது கோட்பாட்டுச் சார்ந்த வரம்புகளை மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: மூலவசனம் எந்தக் கோட்பாட்டு வரம்பையும் இங்கு சேர்க்காமல் நேரடிக் கட்டளைகளை அளிக்கிறது; ஆகவே அவற்றின் நெறிசார் வலிமையையும் பதற்றத்தையும் விளக்கச் சேர்க்கையின்றி காக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான பன்மை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசீர்வதியுங்கள்’ பொதுவாக அறியப்பட்ட வேதாகமச் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது; ‘மன்றாடுங்கள்’ என்பது தேவையற்ற சமயக்குழுச் சார்பின்றி இறைவனை நோக்கிய வேண்டுதலை வெளிப்படுத்துகிறது.
