  source_fidelity: 'மூலக் கிரேக்கத்தின் தொடரமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: கேட்டும் செய்யாதவர், அடித்தளமின்றித் தரையின்மேல் கட்டப்பட்ட வீடு, ஆற்றின் வன்மையான மோதல், உடனடியான இடிவு, மற்றும் வீட்டின் பெரிய அழிவு ஆகிய அனைத்தும் தெளிவாகத் தரப்பட்டுள்ளன. ‘அதன்படி’ என்பது முந்தைய சூழலில் இயேசுவின் வார்த்தைகளைச் சுட்டும் இயல்பான தமிழ்ச் சுட்டல்; மூலத்தின் பொருளைத் தவறாகக் குறுக்கவில்லை.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் வேதாகம வாசிப்புக்குரிய கண்ணியத்துடனும் உள்ளது. ‘தரையின்மேல்,’ ‘ஆறு ... மோதியபோது,’ ‘உடனே இடிந்து விழுந்தது’ என்பவை தெளிவான, பொதுவாகப் புரியக்கூடிய தெரிவுகள். ‘அந்த வீட்டின் அழிவு பெரிதாயிற்று’ என்பது சிறிது இலக்கியத் தொனியுடையதாயினும், மூலத்தின் வலியுறுத்தலையும் வசனத்தின் நடையையும் நன்றாகக் காக்கிறது.
