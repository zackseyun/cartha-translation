id: LUK.6.49
reference: Luke 6:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: ta
  text: ஆனால், கேள்விப்பட்டும் அதன்படி செய்யாதவன், அடித்தளம் இல்லாமல் தரையின்மேல் வீடு கட்டிய ஒரு மனிதனைப் போன்றவன்.[a] ஆறு அந்த வீட்டின்மேல் மோதியபோது, அது உடனே இடிந்து விழுந்தது; அந்த வீட்டின் அழிவு பெரிதாயிற்று.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன்படி செய்யாதவன்’ என்பதற்கு ‘செய்யாதவன்’ அல்லது ‘நடைமுறைப்படுத்தாதவன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் அடிப்படையில் ‘செய்’ என்று பொருள்பட்டு, இங்கு இயேசுவின் வார்த்தைகளின்படி செயல்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த வீட்டின் பிளவு பெரிதாயிற்று’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் உடைவு, பிளவு அல்லது அதனால் விளையும் அழிவைக் குறிக்கலாம்; வீடு இடிந்து விழும் இச்சூழலில் இயல்பான தமிழுக்காக ‘அழிவு’ எனத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: ஆனால், கேள்விப்பட்டும் அதன்படி செய்யாதவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ஒருமை வினையெச்சங்களையும், கேட்டதற்கு ஏற்ப செயல்படாத எதிர்மறையையும் இயல்பான தமிழில் தெரிவிக்கிறது. ‘அதன்படி’ என்பது முந்தைய சூழலில் இயேசுவின் வார்த்தைகளைக் குறிக்கிறது; கிரேக்கத்தில் உள்ள செயல் கருத்தை அளவுக்கு மீறி விரிவாக்கவில்லை.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: ஒரு மனிதனைப் போன்றவன்
  rationale: உவமை அமைப்பையும் பிரதிநிதித்துவ ஒருமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: அடித்தளம் இல்லாமல் தரையின்மேல் வீடு கட்டிய
  rationale: γῆ என்பதன் இச்சூழலுக்குரிய பொருளை ‘தரை’ என்றும் θεμέλιος என்பதை வழக்கமான ‘அடித்தளம்’ என்றும் தெளிவாக வழங்குகிறது.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: ஆறு அந்த வீட்டின்மேல் மோதியபோது
  rationale: உறவுப்பெயர் குறிக்கும் வீட்டைத் தமிழில் வெளிப்படையாகச் சொல்லி, προσρήγνυμι குறிக்கும் வன்மையான தாக்கத்தை ‘மோதியது’ என இயல்பாகத் தருகிறது.
- source_word: εὐθὺς συνέπεσεν
  choice: அது உடனே இடிந்து விழுந்தது
  rationale: வீடு சரிந்து விழுவதைக் குறிக்கும் συμπίπτω என்பதையும் εὐθύς என்பதன் உடனடித் தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: அந்த வீட்டின் அழிவு பெரிதாயிற்று
  rationale: ῥῆγμα என்பதற்கு இச்சரிவு சூழலில் விளையும் பேரழிவை உணர்த்தும் ‘அழிவு’ இயல்பான தமிழ்; μέγα என்பதையும் ‘பெரிது’ என்று காக்கிறது.
theological_decisions:
- issue: உவமையில் பிரதிநிதித்துவ ஒருமை மனிதக் குறிப்பு
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: ἀνθρώπῳ என்பது இங்கு ஓர் தனி மனிதரை பிரதிநிதியாகக் காட்டுகிறது. தமிழ் ‘மனிதன்’ அந்த ஒருமை உருவகத்தைப் பாதுகாக்கிறது; கருத்தை குறிப்பாக ஆண்களுக்கு மட்டும் கட்டுப்படுத்துவதில்லை.
- issue: கேட்பதற்கும் செய்வதற்கும் இடையிலான தொடர்பு
  choice: கேள்விப்பட்டும் அதன்படி செய்யாதவன்
  alternative: கேள்விப்பட்டும் செய்யாதவன்
  rationale: ποιέω எதைச் செய்வதைக் குறிக்கிறது என்பது முந்தைய வசனத்திலுள்ள இயேசுவின் வார்த்தைகளால் நிர்ணயிக்கப்படுகிறது. ‘அதன்படி’ தமிழில் தேவையான தொடர்பைத் தெளிவாக்குகிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வாசிப்புக்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘தரையின்மேல்’, ‘அடித்தளம்’, ‘இடிந்து விழுந்தது’ ஆகியவை உருவகத்தைத் தெளிவாக வைத்திருக்கின்றன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
