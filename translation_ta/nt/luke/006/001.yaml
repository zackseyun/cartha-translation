translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘ஓய்வுநாள்’, ‘தானிய வயல்கள்’, ‘கதிர்கள்’ ஆகியவை தெளிவான பொதுச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; பயிரின் வகை தேவையின்றி குறிப்பாக்கப்படவில்லை.
