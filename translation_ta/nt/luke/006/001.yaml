id: LUK.6.1
reference: Luke 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: ta
  text: ஒரு ஓய்வுநாளில், அவர் தானிய வயல்களின் வழியாகச் சென்றுகொண்டிருந்தபோது, அவருடைய சீடர்கள் கதிர்களைப் பறித்துத் தங்கள் கைகளால் கசக்கித் தின்றுகொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கதிர்களை கைகளால் கசக்குவது, உண்பதற்குரிய தானிய மணிகளைப் பிரிப்பதற்காகும்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: இப்படி நடந்தது
  rationale: லூக்கா பயன்படுத்தும் நிகழ்வு அறிமுகத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ἐν σαββάτῳ
  choice: ஒரு ஓய்வுநாளில்
  rationale: குறிப்பிட்டுச் சுட்டப்படாத σαββάτῳ இங்கு ஓர் ஓய்வுநாள் நிகழ்வைக் குறிக்கிறது; ‘ஒரு’ என்பது அந்த வரையறையின்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: அவர் தானிய வயல்களின் வழியாகச் சென்றுகொண்டிருந்தார்
  rationale: தொடர்ந்து நடைபெற்ற செயலை ‘சென்றுகொண்டிருந்தார்’ காக்கிறது; σπόριμα பயிரிடப்பட்ட தானிய வயல்களைக் குறிக்கிறது, ஆனால் எந்தத் தானியம் என்பதைச் சுட்டவில்லை.
- source_word: ἔτιλλον
  choice: பறித்து
  rationale: கதிர்களைச் செடியிலிருந்து எடுத்த செயலை இயல்பாகக் குறிக்கிறது; அடுத்த தொடர்நிலை வினையுடன் இணைந்து நடந்துகொண்டிருந்த செயலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς στάχυας
  choice: கதிர்களை
  rationale: στάχυας என்பது தானியத்தின் கதிர்கள் அல்லது தானியத் தலைகளைக் குறிக்கிறது; ‘கதிர்கள்’ என்பது சுருக்கமான, வழக்கமான தமிழ்.
- source_word: ψώχοντες ταῖς χερσίν
  choice: தங்கள் கைகளால் கசக்கி
  rationale: உண்பதற்குரிய தானிய மணிகளைப் பிரிக்கக் கைகளால் தேய்த்த அல்லது கசக்கிய செயலைக் குறிப்பாகக் காக்கிறது.
- source_word: καὶ ἤσθιον
  choice: தின்றுகொண்டிருந்தார்கள்
  rationale: முடிவுறாத, தொடர்ந்து நடந்த உண்பதைக் காட்டும் இறந்தகாலத் தொடர்நிலையைப் பாதுகாக்கிறது.
