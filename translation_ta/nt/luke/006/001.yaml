- from: 'ஒரு ஓய்வுநாளில் இப்படி நடந்தது: அவர் தானிய வயல்களின் வழியாகச் சென்றுகொண்டிருந்தார். அவருடைய சீடர்கள் கதிர்களைப் பறித்து, தங்கள் கைகளால் கசக்கித் தின்றுகொண்டிருந்தார்கள்.[a]'
  to: ஒரு ஓய்வுநாளில், அவர் தானிய வயல்களின் வழியாகச் சென்றுகொண்டிருந்தபோது, அவருடைய சீடர்கள் கதிர்களைப் பறித்துத் தங்கள் கைகளால் கசக்கித் தின்றுகொண்டிருந்தார்கள்.[a]
