source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: ta
  text: அந்நாளில் மகிழுங்கள்; மகிழ்ச்சியால் துள்ளிக் குதியுங்கள்[a]. ஏனெனில், இதோ, பரலோகத்தில் உங்கள் வெகுமதி மிகப் பெரியது; ஏனெனில், அவர்களுடைய முன்னோர்கள் தீர்க்கதரிசிகளை இதே விதமாக நடத்திவந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்நாளில் மகிழ்ந்து துள்ளுங்கள்.’
    reason: σκιρτήσατε என்பதற்கு உடல்சார் மகிழ்ச்சி வெளிப்பாட்டைச் சுருக்கமாகத் தரும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: நேரடியாக, ‘அவர்களுடைய முன்னோர்கள் தீர்க்கதரிசிகளுக்கு இதே விதமாகச் செய்துவந்தார்கள்.’ ποιέω + தத்திவ் என்ற சுருக்கமான அமைப்பு இச்சூழலில் அவர்கள் தீர்க்கதரிசிகளை இதே விதமாக நடத்தினார்கள் என்பதைக் குறிக்கிறது. ‘முன்னோர்கள்’ என்பதற்கான கிரேக்கச் சொல் நேரடியாக ‘தந்தையர்’ என்றும் பொருள்படும்.
    reason: ποιέω + தத்திவ் அமைப்பின் சொற்சொல் வடிவத்தையும், πατέρες என்பதன் நேரடிப் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: χάρητε
  choice: மகிழ்ந்து
  rationale: χαίρω என்பதன் கட்டளை வலிமையை இயல்பான தமிழில் தருகிறது; அடுத்த கட்டளையுடன் இணைந்து ஒரே தொடராக வாசிக்கப்படுகிறது.
- source_word: σκιρτήσατε
  choice: மகிழ்ச்சியால் துள்ளிக் குதியுங்கள்
  rationale: மகிழ்ச்சியின் உடல்சார், மிகுந்த வெளிப்பாட்டைக் குறிக்கும் வினையின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து சொல்லப்படும் காரணத்தின்மீது கவனத்தைத் திருப்பும் உரையாடல் குறியீட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: μισθὸς
  choice: பலன்
  rationale: இச்சூழலில் கிடைக்கும் கைம்மாறு அல்லது வெகுமதி என்ற பொருளைத் தருகிறது; குறுகிய பொருளாதாரக் ‘கூலி’ என்ற எண்ணத்துக்கு மட்டும் கட்டுப்படுத்துவதில்லை.
- source_word: πολὺς
  choice: மிகுதியாய்
  rationale: பலனின் பெருமையையும் நிறைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: ஒருமை வடிவிலுள்ள οὐρανός குறிக்கும் பரலோகத் தளத்தைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: κατὰ τὰ αὐτά
  choice: இதே விதமாகவே
  rationale: ‘அதே காரியங்களின்படி’ என்ற சொற்சொல் அமைப்பை விட, ஒரே முறையிலான நடத்தையைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐποίουν
  choice: செய்துவந்தார்கள்
  rationale: இறந்த காலத்தில் வழக்கமாக அல்லது தொடர்ந்து நடந்த செயலைக் குறிக்கும் imperfect வினையின் தன்மையைப் பாதுகாக்கிறது; செயல் என்ன என்பதைச் சூழலே நிரப்புமாறு விடுகிறது.
- source_word: τοῖς προφήταις
  choice: தீர்க்கதரிசிகளுக்கும்
  rationale: தத்திவ் அமைப்பை ‘தீர்க்கதரிசிகளுக்கும் ... செய்தார்கள்’ எனப் பாதுகாத்து, பகைமையான நடத்தையை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- source_word: οἱ πατέρες αὐτῶν
  choice: அவர்களுடைய முன்னோர்கள்
  rationale: πατέρες இங்கு முந்தைய தலைமுறையினரைச் சுட்டுவதால், நவீன தமிழில் தவறாகப் புரியாத ‘முன்னோர்கள்’ இயல்பான தேர்வு; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
