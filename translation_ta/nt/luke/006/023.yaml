- issue: முன்னோர்கள் தீர்க்கதரிசிகளுக்குச் செய்தது என்ன
  choice: தீர்க்கதரிசிகளுக்கும் இதே விதமாகவே செய்துவந்தார்கள்
  alternative: தீர்க்கதரிசிகளையும் இதே விதமாகவே நடத்திவந்தார்கள்
  rationale: ποιέω என்ற பொதுவான வினையின் சுருக்கத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது. முந்தைய சூழல் பகைமையான நடத்தையை உணர்த்தினாலும், ‘துன்புறுத்தினர்’ போன்ற குறிப்பான செயலை உரைக்குள் சேர்க்கவில்லை.
