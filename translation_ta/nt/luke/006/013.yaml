source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: ta
  text: பொழுது விடிந்தபோது, அவர் தம்முடைய சீடர்களைத் தம்மிடம் அழைத்து, அவர்களிலிருந்து பன்னிரண்டு பேரைத் தேர்ந்தெடுத்தார்; அவர்களுக்கு “அப்போஸ்தலர்கள்” என்றும் பெயரிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: பொழுது விடிந்தபோது
  rationale: பகல் வந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; முந்தைய இரவுக் காட்சியிலிருந்து காலமாற்றத்தையும் தெளிவாக்குகிறது.
- source_word: προσεφώνησεν
  choice: தம்மிடம் அழைத்து
  rationale: இங்கு பெரிய சீடர் குழுவிலிருந்து பன்னிருவரைத் தேர்ந்தெடுக்க இயேசு அவர்களைத் தம்மிடம் வரவழைத்தார் என்பதே சூழலுக்கு ஏற்ற பொருள். ‘உரையாற்றினார்’ என்ற அகராதிசார் வாய்ப்பைச் சூழல் ஆதரிக்கவில்லை.
- source_word: μαθητὰς
  choice: சீடர்களை
  rationale: நற்செய்தி நூல்களின் சூழலில் μαθητής என்பதற்கான நிலைபெற்ற, எளிதில் புரியும் தமிழ் சொல்.
- source_word: ἐκλεξάμενος
  choice: தேர்ந்தெடுத்தார்
  rationale: பலரிலிருந்து நோக்கத்துடன் பன்னிருவரைத் தெரிவுசெய்த செயலை இயல்பாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: ἀπ’ αὐτῶν
  choice: அவர்களிலிருந்து
  rationale: பன்னிருவரும் சீடர்களாகிய பெரிய குழுவிலிருந்து தேர்ந்தெடுக்கப்பட்டனர் என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: δώδεκα
  choice: பன்னிரண்டு பேரை
  rationale: மனிதர்களைக் குறிக்கும் எண்ணைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀποστόλους
  choice: அப்போஸ்தலர்கள்
  rationale: இங்கு இது வெறும் ‘தூதர்கள்’ என்ற பொதுவான பணிவிளக்கம் அல்ல; பன்னிருவருக்கு வழங்கப்படும் குறிப்பிட்ட பதவிப்பெயராக உருவாகிறது. நிலைபெற்ற தமிழ் வேதாகமச் சொல்லைத் தக்கவைக்கிறது.
- source_word: ὠνόμασεν
  choice: பெயரிட்டார்
  rationale: ஒரு பெயர் அல்லது designation வழங்குவதைக் காட்டுகிறது; முன்பு வரும் ‘அழைத்து’ என்பதிலிருந்து வேறுபாட்டையும் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: ἀποστόλους என்பதை பொதுவான ‘அனுப்பப்பட்டவர்கள்/தூதர்கள்’ என மொழிபெயர்ப்பதா அல்லது நிலைபெற்ற பதவிப்பெயராகக் கொடுப்பதா
  choice: அப்போஸ்தலர்கள்
  alternative: அனுப்பப்பட்டவர்கள்; தூதர்கள்
  rationale: லூக்காவின் இவ்விடத்தில் இயேசு பன்னிருவருக்கு வழங்கும் குறிப்பிட்ட பெயராக இச்சொல் செயல்படுகிறது. ‘அப்போஸ்தலர்கள்’ என்பது அந்தக் கதையியல் முக்கியத்துவத்தைப் பாதுகாக்கிறது; அதற்கு மேலான திருச்சபைக் கோட்பாடுகளை வசனத்தில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை காக்கப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள தொடர்ச்சியான அமைப்பு தமிழில் வாசிக்கத் தெளிவாக வினைமுற்றுகளாக அமைக்கப்பட்டது.
