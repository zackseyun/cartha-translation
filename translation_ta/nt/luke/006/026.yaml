source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: ta
  text: எல்லா மக்களும் உங்களைக் குறித்து நல்லவிதமாகப் பேசும்போது[a] உங்களுக்கு ஐயோ! ஏனெனில் அவர்களுடைய தந்தையரும்[b] பொய்த்தீர்க்கதரிசிகளுக்கு அதேபோல் செய்துவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் பற்றிச் சாதகமாகப் பேசும்போது.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “அவர்களுடைய தந்தையர்”; இங்கு அவர்களுடைய மக்களின் முந்தைய தலைமுறையினர் குறிக்கப்படுகின்றனர்.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: உங்களுக்கு ஐயோ!
  rationale: தீர்க்கதரிசனப் பாணியிலான கண்டனமும் எச்சரிக்கையும் கொண்ட வலிமையைத் தக்கவைக்கிறது; வெறும் வருத்த வெளிப்பாடாக மென்மையாக்கவில்லை.
- source_word: ὅταν
  choice: பேசும்போது
  rationale: பொதுவாக நிகழக்கூடிய சூழ்நிலையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: உங்களைக் குறித்து நல்லவிதமாகப் பேசும்போது
  rationale: ஒருவரைப் பற்றி சாதகமாகப் பேசுதல் என்ற கிரேக்க மரபுத்தொடரின் பொருளை, ‘புகழ்தல்’ என்று மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντες οἱ ἄνθρωποι
  choice: எல்லா மக்களும்
  rationale: பாலினப் பொதுமையைத் தக்கவைத்து, சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழை வழங்குகிறது.
- source_word: κατὰ τὰ αὐτά
  choice: அதையே
  rationale: முந்தைய செயலை ஒத்த முறையில் நடத்துதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய ‘ஐயோ’ என்ற எச்சரிப்புக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἐποίουν
  choice: செய்துவந்தார்கள்
  rationale: கிரேக்க இறந்தகால முற்றுப்பெறா வினையின் வழக்கமான அல்லது தொடர்ச்சியாக நிகழ்ந்த கடந்தகாலச் செயலை வெளிப்படுத்துகிறது.
- source_word: τοῖς ψευδοπροφήταις
  choice: பொய்த்தீர்க்கதரிசிகளுக்கு
  rationale: செயல் யாரை நோக்கிச் செய்யப்பட்டதோ அவர்களைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: οἱ πατέρες αὐτῶν
  choice: அவர்களுடைய முன்னோர்களும்
  rationale: சொல்லுக்கு சொல் ‘தந்தையர்’ என்பதைவிட, இங்கு குறிக்கப்படும் முந்தைய தலைமுறைகளை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘கூட/அதேபோல்’ என்ற ஒப்பீட்டு உறவை ‘-உம்’ தக்கவைக்கிறது.
theological_decisions:
- issue: பொய்த்தீர்க்கதரிசிகளுடன் செய்யப்படும் ஒப்பீட்டின் பொருளும் வலிமையும்
  choice: அனைவருடைய சாதகமான பேச்சும், முந்தைய தலைமுறைகள் பொய்த்தீர்க்கதரிசிகளை நடத்திய விதத்தோடு ஒப்பிடப்படும் எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: மற்றவர்களின் எந்தப் பாராட்டையும் விதிவிலக்கின்றி கண்டிப்பதாக அல்லது பிரபலத்தன்மையை மட்டும் கண்டிப்பதாக விளக்குதல்.
  rationale: γάρ மற்றும் κατὰ τὰ αὐτά ஆகியவை வரலாற்று ஒப்பீட்டை எச்சரிப்புக்கான காரணமாக்குகின்றன. மொழிபெயர்ப்பு இந்தத் தொடர்பைத் தக்கவைக்கிறது; அதேவேளையில் எல்லா பாராட்டையும் தன்னிச்சையாகத் தவறானது என்று தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் வேதாகம எச்சரிப்பின் கண்ணியமும் வலிமையும் காக்கப்பட்டுள்ளன. ‘பொய்த்தீர்க்கதரிசிகள்’ என்பது நிலைபெற்ற வேதாகமச் சொல் என்பதால் தக்கவைக்கப்பட்டது.
