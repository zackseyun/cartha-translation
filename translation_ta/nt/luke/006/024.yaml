lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய பேறுபெற்றோர் கூற்றுகளுடன் உள்ள வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: οὐαὶ
  choice: ஐயோ!
  rationale: புலம்பலையும் கடுமையான தீர்ப்பு எச்சரிக்கையையும் ஒருங்கே தாங்கும் தீர்க்கதரிசனச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: செல்வந்தர்களாகிய உங்களுக்கு
