- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள ‘ஐயோ’ என்பதற்கான காரணத்தை வெளிப்படையாகக் காட்டுகிறது.
- source_word: ἀπέχετε
  choice: பெற்றுவிட்டீர்கள்
  rationale: இவ்வினை நிகழ்கால வடிவில் இருந்தாலும், கிடைக்க வேண்டியதைப் பெற்றுக்கொண்டிருப்பது அல்லது முழுமையாகப் பெற்றுவிட்டது என்ற வழக்காற்றுப் பொருளைக் கொள்ள முடியும். தமிழ் நிறைவுவினை இங்கு ஏற்கெனவே கிடைத்துவிட்ட ஆறுதலை இயல்பாகக் காட்டுகிறது; ‘முழுமையாக’ என்ற நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παράκλησιν
  choice: ஆறுதலை
  rationale: இச்சூழலில் ‘தேற்றுதல்/தேறுதல்’ அல்லது ‘ஆறுதல்’ எனப் பொருள்படக்கூடிய சொல்லுக்கு, பொதுவாகப் புரியும் இயல்பான தமிழ் இணை இது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: παράκλησιν என்பதுடன் இணைந்த உடைமைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: செல்வந்தர்கள்மீது கூறப்படும் எச்சரிக்கையின் தன்மை
  choice: செல்வந்தர்களை நேரடியாக நோக்கிக் கூறப்படும் கடுமையான ‘ஐயோ’ எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘செல்வத்தை நம்புகிறவர்களே’ என்று விரிவுபடுத்துதல் அல்லது இதை மென்மையான வருத்தக் கூற்றாக மட்டும் மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் நேரடியாக ‘செல்வந்தர்களாகிய உங்களுக்கு’ என்று கூறுகிறது. செல்வம் குறித்த கூடுதல் ஒழுக்க அல்லது கோட்பாட்டு விளக்கத்தை வசனத்திற்குள் சேர்க்காமல் அதன் தீவிரம் பாதுகாக்கப்படுகிறது.
- issue: ἀπέχετε என்பதன் கால மற்றும் நிறைவுப் பொருள்
  choice: ‘பெற்றுவிட்டீர்கள்’ என்று, ஆறுதல் ஏற்கெனவே கிடைத்துவிட்ட நிலையைக் காட்டுகிறது.
  alternative: ‘பெற்றுக்கொண்டிருக்கிறீர்கள்’ அல்லது ‘முழுமையாகப் பெற்றுவிட்டீர்கள்.’
  rationale: இது இலக்கணத்தில் நிகழ்காலமாக இருந்தாலும், பெற வேண்டிய தொகையை முழுமையாகப் பெற்றதாகக் கூறும் வழக்காற்றுப் பயன்பாடு இவ்வினைக்கு உண்டு. பிரதான உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; முழுமைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் நேரடியான, தீர்க்கதரிசனத் தீவிரம் குறையாத வகையிலும் வடிவமைக்கப்பட்டது. ‘செல்வந்தர்களாகிய’ என்பது மரியாதைமிக்க எழுத்துநடையையும் நேரடி அழைப்பையும் சமநிலைப்படுத்துகிறது.
