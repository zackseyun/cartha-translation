  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: ta
  text: யாக்கோபின் மகன் யூதா[a], மற்றும் துரோகியாக ஆன யூதாஸ் இஸ்காரியோத்து.
  philosophy: optimal-equivalence
