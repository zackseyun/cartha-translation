lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: யாக்கோபின் மகன் யூதா
  rationale: Ἰακώβου என்ற உறவுமுறை வேற்றுமைத் தொடர் உறவைத் தெளிவாகக் குறிப்பிடாமல் விடுகிறது. சீடர்களின் பட்டியலில் இயல்பான தமிழுக்காக ‘மகன்’ சேர்க்கப்படுகிறது; இது பொதுவாக ஏற்றுக்கொள்ளப்படும் புரிதல். மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Ἰσκαριὼθ
  choice: இஸ்காரியோத்து
  rationale: இது ஒரு பெயர் அல்லது அடைமொழி என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: ὃς ἐγένετο
  choice: பின்னர் … ஆன
  rationale: ἐγένετο என்பதன் ‘ஆனான்/ஆகிவிட்டான்’ என்ற மாற்றத்தைக் குறிக்கும் வினைவலிமையை இயல்பான தமிழில் ‘பின்னர் … ஆன’ எனப் பாதுகாக்கிறது.
- source_word: προδότης
  choice: துரோகி
  rationale: நம்பிக்கைக்குத் துரோகம் செய்பவரைக் குறிக்கும் பெயர்ச்சொல்லாக προδότης-இன் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: καὶ
  choice: மேலும் / பட்டியல் இணைப்பு
  rationale: மூலத்தில் மீண்டும் வரும் இணைப்புச் சொற்கள் பட்டியலின் இறுதி இரு பெயர்களை இணைக்கின்றன; தமிழில் வசனத் துணுக்காக இயல்பாக அமைய காற்புள்ளி மற்றும் ‘பின்னர்’ அமைப்பின் மூலம் இணைப்பு வெளிப்படுகிறது.
theological_decisions:
- issue: Ἰακώβου என்பதில் மறைந்துள்ள உறவுமுறை
  choice: முதன்மை உரையில் ‘யாக்கோபின் மகன் யூதா’
  alternative: ‘யாக்கோபின் சகோதரன் யூதா’ அல்லது சொற்படியாக ‘யாக்கோபின் யூதா’
  rationale: கிரேக்கத்தில் துல்லியமான உறவு வெளிப்படையாக இல்லை. இயல்பான தமிழுக்காக ‘மகன்’ என்பது எச்சரிக்கையான இயல்புநிலைத் தேர்வாகப் பயன்படுத்தப்படுகிறது; ‘சகோதரன்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டு மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: யூதாஸ் துரோகியாக இருந்தாரா அல்லது ஆனாரா
  choice: ‘பின்னர் துரோகியான’
  alternative: ‘துரோகியாக இருந்த’
  rationale: ἐγένετο நிலையான அடையாளத்தை மட்டும் அல்லாமல் அவர் அந்நிலைக்கு வந்ததையும் சுட்டுகிறது; ஆகவே ‘ஆன’ என்ற மாற்ற வினை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பட்டியல் நடையைப் பயன்படுத்துகிறது. யூதா/யூதாஸ் என்ற தமிழ் வேறுபாடு ஒரே கிரேக்கப் பெயரைக் குறித்தாலும், இரண்டு நபர்களையும் வாசிப்பில் உடனடியாக வேறுபடுத்த உதவும் நிலைபெற்ற தமிழ் வழக்கைத் தொடர்கிறது.
