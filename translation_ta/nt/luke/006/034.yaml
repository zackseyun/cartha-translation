id: LUK.6.34
reference: Luke 6:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: ta
  text: யாரிடமிருந்து திரும்பப் பெறுவீர்கள் என்று எதிர்பார்க்கிறீர்களோ, அவர்களுக்குக் கடன் கொடுத்தால், உங்களுக்கு என்ன பாராட்டு?[a] பாவிகளும்கூட தாங்கள் கொடுத்ததற்குச் சமமானதைத் திரும்பப் பெறுவதற்காகப் பாவிகளுக்குக் கடன் கொடுக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு என்ன நன்றி?” கிரேக்கச் சொல் “நன்றி” என்றும் பொருள்படலாம்; இங்கு அது பாராட்டு அல்லது சாதகமான அங்கீகாரத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: கடன் கொடுத்தால் / கடன் கொடுக்கிறார்கள்
  rationale: பணம் அல்லது பொருளைக் கடனாக வழங்குவதைக் குறிக்கும் வினை; நவீனத் தமிழில் இயல்பான நிதிசார் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: παρ’ ὧν
  choice: யாரிடமிருந்து ... அவர்களுக்கே
  rationale: கடன் பெறுபவர்களிடமிருந்தே திரும்பக் கிடைக்கும் என்ற இரு உறவுகளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐλπίζετε λαβεῖν
  choice: திரும்பப் பெறலாம் என்று எதிர்பார்க்கிறீர்களோ
  rationale: ἐλπίζω என்பதன் ‘நம்பிக்கை வை’ என்ற சாத்தியத்தைவிட, இச்சூழலில் எதிர்பார்க்கப்படும் திருப்பிச் செலுத்துதலை ‘எதிர்பார்க்கிறீர்கள்’ தெளிவாகக் காட்டுகிறது; ‘திரும்ப’ என்பது கடன் சூழலால் வேண்டப்படும் பொருளை வெளிப்படுத்துகிறது.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: அதனால் உங்களுக்கு என்ன பாராட்டு கிடைக்கும்?
  rationale: இங்கு χάρις இரட்சிப்புக்குரிய ‘கிருபை’ என்பதைவிட நற்பெயர், அங்கீகாரம் அல்லது பாராட்டுக்குரிய தன்மையைக் குறிக்கிறது. ‘பாராட்டு’ சாதாரண வாசகருக்கு இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἁμαρτωλοὶ
  choice: பாவிகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல்லின் நேரடியான, வழக்கமான தமிழ் இணை.
- source_word: ἵνα ἀπολάβωσιν
  choice: திரும்பப் பெறுவதற்காக
  rationale: கொடுத்ததை மீண்டும் பெறுதல் என்ற நோக்கத்தைத் துல்லியமாகக் காட்டுகிறது.
- source_word: τὰ ἴσα
  choice: தாங்கள் கொடுத்ததற்குச் சமமானதை
  rationale: சம மதிப்பு அல்லது சம அளவுள்ள திருப்பிக் கொடுத்தலைக் குறிக்கிறது; பணம் மட்டுமென்றோ வட்டியுடனான இலாபமென்றோ தேவையின்றி வரையறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் வினாவில் χάρις என்பதன் பொருள்
  choice: நற்பண்புக்குக் கிடைக்கும் அங்கீகாரம் என்ற பொருளில் ‘பாராட்டு’
  alternative: கிருபை; நன்றி; நன்மை
  rationale: அடுத்தடுத்த ஒப்பீடுகளில் சீடர்களின் நடத்தை பாவிகளின் நடத்தையிலிருந்து எவ்வாறு வேறுபடுகிறது என்பதே மையம். ஆகவே இது இரட்சிக்கும் கிருபை என்ற இறையியல் கருத்தாக மொழிபெயர்க்கப்படவில்லை; இருப்பினும் ‘நன்றி’ என்ற சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: கடனுக்கான எதிர்பார்க்கப்பட்ட திருப்பிக் கொடுத்தலின் தன்மை
  choice: கொடுத்ததற்குச் சமமானதைத் திரும்பப் பெறுதல்
  alternative: வட்டியுடன் பெறுதல்; இலாபத்துடன் முழுமையாகப் பெறுதல்
  rationale: τὰ ἴσα சமமான திருப்பிக் கொடுத்தலை மட்டுமே குறிக்கிறது. வட்டி, இலாபம் அல்லது குறிப்பிட்ட பொருளாதார நடைமுறையை உரை கூறாததால் அவை மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘யாரிடமிருந்து ... அவர்களுக்கே’ என்ற கட்டமைப்பு கிரேக்கத்தில் உள்ள உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘சமமானதை’ என்பது பணம் அல்லது பொருள் என்ற இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
