id: LUK.6.37
reference: Luke 6:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: ta
  text: தீர்ப்பிடாதீர்கள்; நீங்களும் ஒருபோதும் தீர்ப்பிடப்பட மாட்டீர்கள். குற்றவாளி எனத் தீர்க்காதீர்கள்; நீங்களும் ஒருபோதும் குற்றவாளி எனத் தீர்க்கப்பட மாட்டீர்கள். விடுவியுங்கள்[a]; நீங்களும் விடுவிக்கப்படுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மன்னியுங்கள்; நீங்களும் மன்னிக்கப்படுவீர்கள்.” கிரேக்க வினைச்சொல் “விடுவித்தல்,” “சுதந்திரமாகப் போகவிடுதல்” என்பவற்றைக் குறிக்கலாம்; இந்தச் சூழலில் “மன்னித்தல்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: தீர்ப்பிடாதீர்கள்
  rationale: பொதுவாக ஒருவரைக் குறித்து மதிப்பிட்டுத் தீர்ப்புச் செய்வதைக் குறிக்கும் κρίνω என்பதன் சுருக்கமான கட்டளை வடிவத்தையும், அதற்கு இணையான செயப்பாட்டு வடிவத்தையும் இது காக்கிறது.
- source_word: οὐ μὴ κριθῆτε
  choice: நீங்களும் ஒருபோதும் தீர்ப்பிடப்பட மாட்டீர்கள்
  rationale: οὐ μή தரும் வலியுறுத்தப்பட்ட மறுப்பை இயல்பான நவீனத் தமிழில் ‘ஒருபோதும் … மாட்டீர்கள்’ என்று வெளிப்படுத்துகிறது; தீர்ப்பிடுபவர் யார் என்பதை மூலத்தைப் போலவே குறிப்பிடாமல் விடுகிறது.
- source_word: καταδικάζετε
  choice: குற்றவாளி என்று தீர்ப்பளிக்காதீர்கள்
  rationale: καταδικάζω, κρίνω-வைவிட வலுவாக, ஒருவரைக் குற்றவாளி எனத் தீர்ப்பதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு இரு வினைகளுக்கிடையிலான பொருள் ஏற்றத்தைத் தெளிவாக்குகிறது.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: நீங்களும் ஒருபோதும் குற்றவாளி என்று தீர்ப்பளிக்கப்பட மாட்டீர்கள்
  rationale: முந்தைய கூறுடன் உள்ள இணைநிலையையும் οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும் காக்கிறது.
- source_word: ἀπολύετε
  choice: விடுவியுங்கள்
  rationale: ἀπολύω என்பது விடுவித்தல், போகவிடுதல், ஒருவர்மீதுள்ள உரிமைக்கோரிக்கையிலிருந்து அவரை விடுதல், சூழலில் மன்னித்தல் ஆகிய பொருள்களை உடையது. ‘விடுவியுங்கள்’ அதன் விரிந்த பொருளை முதன்மை உரையில் காக்கிறது.
- source_word: ἀπολυθήσεσθε
  choice: நீங்களும் விடுவிக்கப்படுவீர்கள்
  rationale: ἀπολύετε என்பதுடனான சொல் தொடர்பையும் இயேசுவின் கூற்றிலுள்ள பரஸ்பர அமைப்பையும் காக்கிறது.
- source_word: καὶ
  choice: அப்போது / நீங்களும்
  rationale: கிரேக்கத்தில் மீண்டும் வரும் καὶ கூறுகளை இணைக்கிறது. தமிழில் இயல்பாக விளைவு மற்றும் இணைநிலையை வெளிப்படுத்த ‘அப்போது’, ‘நீங்களும்’ பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: ἀπολύετε / ἀπολυθήσεσθε என்பவற்றை ‘மன்னியுங்கள் / மன்னிக்கப்படுவீர்கள்’ என்று குறுகலாக மொழிபெயர்ப்பதா, ‘விடுவியுங்கள் / விடுவிக்கப்படுவீர்கள்’ என்று விரிவாக மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘விடுவியுங்கள்; நீங்களும் விடுவிக்கப்படுவீர்கள்’
  alternative: ‘மன்னியுங்கள்; நீங்களும் மன்னிக்கப்படுவீர்கள்’
  rationale: நியாயத்தீர்ப்பு மற்றும் குற்றத்தீர்ப்பைப் பற்றிய உடனடிச் சூழலில் ἀπολύω விடுதலை செய்தல் அல்லது ஒருவர்மீதுள்ள கோரிக்கையை விட்டுவிடுதல் என்ற விரிந்த பொருளைக் கொண்டிருக்க முடியும். ‘மன்னித்தல்’ சூழலுக்கு ஏற்ற முக்கியமான புரிதலாக இருந்தாலும், அதை மட்டும் முதன்மை உரையில் தேர்ந்தெடுப்பது கிரேக்கச் சொல்லின் உண்மையான பொருள் அகலத்தைச் சுருக்கும்; ஆகவே அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பழமையான ‘நியாயந்தீர்க்காதீர்கள்’ என்பதற்குப் பதிலாக ‘தீர்ப்பிடாதீர்கள்’ பயன்படுத்தப்பட்டுள்ளது. κρίνω மற்றும் καταδικάζω இடையிலான வலிமை வேறுபாடு ‘தீர்ப்பிடுதல்’ மற்றும் ‘குற்றவாளி என்று தீர்ப்பளித்தல்’ எனக் காட்டப்பட்டுள்ளது. மூலத்தில் தீர்ப்பிடுபவர் அல்லது விடுவிப்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் அந்த மறைபொருள் தீர்மானிக்கப்படவில்லை.
