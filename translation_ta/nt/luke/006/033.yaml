id: LUK.6.33
reference: Luke 6:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: ta
  text: உங்களுக்கு நன்மை செய்கிறவர்களுக்கு நீங்கள் நன்மை செய்தால், உங்களுக்கு என்ன பாராட்டு கிடைக்கும்?[a] பாவிகளும் அதையே செய்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு என்ன கிருபை உண்டு?” கிரேக்கச் சொல் “கிருபை,” “தயவு,” “நன்றி” அல்லது “பாராட்டு” என்று பொருள்படலாம்; இங்கு கைம்மாறாகச் செய்யப்படும் நன்மைக்குக் கிடைக்கும் அங்கீகாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε / ἀγαθοποιοῦντας
  choice: நன்மை செய்தால் / நன்மை செய்கிறவர்கள்
  rationale: ஒரே கிரேக்க வினைச்சொல்லின் தொடர்பை இரு இடங்களிலும் ‘நன்மை செய்’ என்று இயல்பான தமிழில் காக்கிறது; பிறருக்குப் பயனளிக்கும் நல்ல செயலைக் குறிக்கிறது.
- source_word: ποία ... χάρις
  choice: என்ன பாராட்டு கிடைக்கும்?
  rationale: இந்த அறநெறிச் சூழலில் χάρις இரட்சிப்பளிக்கும் ‘கிருபை’ என்பதைவிட, ஒரு செயலுக்குக் கிடைக்கும் அங்கீகாரம் அல்லது பாராட்டைக் குறிக்கிறது. தமிழில் கேள்வி இயல்பாக ஒலிக்க ‘கிடைக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: பாராட்டு யாருக்குச் சேரும் என்பதைக் காட்டும் கிரேக்க வேற்றுமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἁμαρτωλοὶ
  choice: பாவிகள்
  rationale: லூக்காவில் காணப்படும் சமூக-சமயப் பிரிவைக் குறிக்கும் சொல்லை மென்மைப்படுத்தாமல், வழக்கமான நேரடி தமிழ்ச் சொல்லால் தருகிறது.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: அதையே செய்கிறார்கள்
  rationale: ‘அதே காரியத்தைச் செய்கிறார்கள்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καὶ
  choice: -உம்
  rationale: இரண்டாவது καὶ-யின் வலியுறுத்தும் பொருளை ‘பாவிகளும்’ என்பதிலுள்ள இணைப்பு விகுதி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அறநெறிப் போதனையின் சூழலில் χάρις என்பதன் பொருள்
  choice: பாராட்டு அல்லது அங்கீகாரம்
  alternative: கிருபை; தயவு; நன்றி
  rationale: இங்கு ஒருவர் பதிலுக்கு நன்மை செய்வதால் அவருக்கு ஏதேனும் சிறப்பான அங்கீகாரம் உண்டா என்பதே சொல்லாட்சிக் கேள்வி. ஆகவே இரட்சிப்பு சார்ந்த ‘கிருபை’ என்ற பொருளை முதன்மை உரையில் திணிக்காமல், கிரேக்கச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் அமைக்கப்பட்டது. ‘நன்மை செய்’ என்ற சொல் மீளுருவாக்கப்பட்டு மூலத்தின் சொல் தொடர்பு காக்கப்பட்டுள்ளது; ‘பாவிகளும்’ என்பது இரண்டாவது καὶ-யின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
