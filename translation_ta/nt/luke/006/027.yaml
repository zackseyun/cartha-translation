id: LUK.6.27
reference: Luke 6:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: ta
  text: 'ஆனால், செவிகொடுத்துக் கேட்கிற உங்களிடம்[a] நான் சொல்கிறேன்: உங்கள் பகைவர்களிடம் அன்புகூருங்கள்; உங்களை வெறுக்கிறவர்களுக்கு நன்மை செய்யுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்கிற.” கிரேக்கப் பங்கேற்பு வினையை இவ்வாறு இன்னும் நேரடியாக மொழிபெயர்க்கலாம்; “செவிகொடுத்துக் கேட்கிற” என்பது இச்சூழலில் கவனத்துடன் தொடர்ந்து கேட்பதை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய உரையுடன் உள்ள வலுவான மாறுபாட்டை இயல்பான, சுருக்கமான தமிழில் குறிக்கிறது.
- source_word: ὑμῖν λέγω
  choice: உங்களிடம் நான் சொல்கிறேன்
  rationale: நேரடி அழைப்பையும் உரைச் சூத்திரத்தையும் கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: τοῖς ἀκούουσιν
  choice: செவிகொடுத்துக் கேட்கிற
  rationale: நிகழ்காலப் பங்கேற்பு வினையின் தொடர்ச்சியான, கவனமுள்ள கேட்பைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀγαπᾶτε
  choice: அன்புகூருங்கள்
  rationale: கட்டளைத் தன்மையையும் ἀγαπάω என்பதன் நேரடியான பொருளையும் கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: உங்கள் பகைவர்களிடம்
  rationale: உடைமைத் தொடர்பையும் கட்டளையின் இலக்கையும் தெளிவாகக் காட்டுகிறது; தமிழில் அன்புகூரு என்பதோடு ‘இடம்’ இயல்பாக அமைகிறது.
- source_word: καλῶς ποιεῖτε
  choice: நன்மை செய்யுங்கள்
  rationale: கிரேக்க மரபுத்தொடரின் செயல் மற்றும் அறநெறித் தன்மையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: உங்களை வெறுக்கிறவர்களுக்கு
  rationale: μισέω என்பதன் வலிமையை மென்மைப்படுத்தாமல், வேற்றுமைத் தொடர்பை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: எதிரிகளைக் குறித்த அறநெறிக் கட்டளைகள்
  choice: எந்த வரம்பையும் மொழிபெயர்ப்பில் சேர்க்காமல், கட்டளைகளை நேரடியான பன்மை முன்னிலை ஏவல்களாக வழங்குதல்
  alternative: இதைத் தனிப்பட்ட பகைவர்களுக்கு மட்டும் வரையறுத்தல் அல்லது மிகைப்படுத்தப்பட்ட சொல்லாக விளக்குதல்
  rationale: கிரேக்க வசனத்தில் கட்டளைகளின் வரம்பைக் குறைக்கும் வெளிப்படையான சொற்கள் இல்லை. ஆகவே அதன் தீவிரமான அறநெறி வலிமையும் விளக்கவியல் பதற்றமும் அப்படியே பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான நடையுடன், இயேசுவின் நேரடியான கட்டளைகளுக்கேற்ற கண்ணியமும் வலிமையும் பேணப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘enemies’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் τοῖς ἀκούουσιν குறித்ததால் தமிழில் சம்பந்தப்பட்ட சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
