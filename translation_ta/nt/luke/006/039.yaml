source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: ta
  text: 'மேலும் அவர் அவர்களுக்கு ஓர் உவமையைச் சொன்னார்: “பார்வையற்ற ஒருவர் பார்வையற்ற இன்னொருவருக்கு வழிகாட்ட முடியுமா? இருவரும் ஒரு குழியில் விழ மாட்டார்களா?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “பார்வையற்ற ஓர் ஆண் ... பார்வையற்ற ஓர் ஆண்” என்பதற்குரிய ஆண்பால் ஒருமை வடிவங்கள் பொதுப்பிரதிநிதித்துவ பொருளில் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “குழி” என்பதற்குப் பதிலாக “பள்ளம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ
  choice: மேலும்
  rationale: δὲ உடன் வரும் καὶ இங்குக் கூட்டிச் சொல்லும் தொடர்பைக் காட்டுகிறது. தமிழில் முந்தைய உரையோடு இயல்பாக இணைக்க ‘மேலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παραβολὴν
  choice: ஓர் உவமையை
  rationale: παραβολή என்பது ஒப்புமை அல்லது உருவகச் சொல்லின் மூலம் உண்மையை விளக்கும் உரையைக் குறிக்கிறது. நற்செய்தி நூல்களின் சூழலில் ‘உவமை’ இயல்பான, பரவலாக அறியப்பட்ட தமிழ்ச் சொல்.
- source_word: Μήτι δύναται
  choice: முடியுமா?
  rationale: Μήτι எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. ‘முடியுமா?’ என்ற இயல்பான தமிழ்க் கேள்வி அந்த வினாவியல் தாக்கத்தைச் சூழலில் தக்கவைக்கிறது.
- source_word: τυφλὸς ... τυφλὸν
  choice: பார்வையற்ற ஒருவர் ... பார்வையற்ற இன்னொருவருக்கு
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவங்கள் பொதுப்பிரதிநிதித்துவ பொருளில் வருகின்றன. நவீனத் தமிழில் ‘பார்வையற்ற ஒருவர்’ என்பது மரியாதையானதும் இயல்பானதும்; இரண்டாவது நபரை ‘இன்னொருவர்’ எனக் கூறுவது இரண்டு தனிநபர்களைக் குறிக்கும் படிமத்தைத் தெளிவாக்குகிறது.
- source_word: ὁδηγεῖν
  choice: வழிகாட்ட
  rationale: ஒருவர் மற்றொருவரைச் செல்ல வேண்டிய பாதையில் நடத்தும் உருவகத்தை ‘வழிகாட்ட’ துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐχὶ ἀμφότεροι
  choice: இருவரும் ... விழ மாட்டார்களா?
  rationale: οὐχί உறுதியான உடன்பாட்டு விடையை எதிர்பார்க்கும் கேள்வியை உருவாக்குகிறது. தமிழின் எதிர்மறை வினா வடிவம் அந்த வினாவியல் வலிமையைப் பாதுகாக்கிறது; ἀμφότεροι என்பதற்கு ‘இருவரும்’ நேரான இணை.
- source_word: βόθυνον
  choice: ஒரு குழியில்
  rationale: βόθυνος என்பது குழி அல்லது பள்ளத்தைக் குறிக்கலாம். ‘குழி’ விரிவான பொருளுடைய, படிமத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἐμπεσοῦνται
  choice: விழ மாட்டார்களா?
  rationale: எதிர்கால வடிவமும் εἰς காட்டும் உள்ள்நோக்கிய இயக்கமும் தமிழில் ‘ஒரு குழியில் விழ’ என்று இயல்பாக வெளிப்படுகின்றன.
theological_decisions:
- issue: τυφλός என்ற ஆண்பால் ஒருமை பெயரடை பெயர்ச்சொல்லாகப் பயன்படுத்தப்படுதல்
  choice: பார்வையற்ற ஒருவர் ... பார்வையற்ற இன்னொருவர்
  alternative: குருடன் ... குருடன்
  rationale: கிரேக்க ஆண்பால் ஒருமை வடிவம் பழமொழிச் சொல்லில் பொதுப்பிரதிநிதித்துவ வலிமை கொண்டது; குறிப்பாக ஆண்களை மட்டும் வரையறுப்பதில்லை. தமிழில் பாலினம் குறிப்பிடாத ‘ஒருவர்’ அந்த பொதுப்பொருளை இயல்பாகத் தருகிறது. மூலத்தின் இலக்கண வடிவம் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. ‘குருடன்’ என்ற நேரடி வடிவத்திற்குப் பதிலாக மரியாதையான ‘பார்வையற்ற ஒருவர்’ தேர்ந்தெடுக்கப்பட்டாலும், கிரேக்கத்தின் ஆண்பால் வடிவம் மற்றும் அதன் பொதுப்பிரதிநிதித்துவ வலிமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன. வினாவியல் கேள்விகளின் எதிர்பார்க்கப்பட்ட பதில்கள் உரையிலேயே விளக்கப்படாமல், மூலத்தின் தாக்கம் தக்கவைக்கப்பட்டுள்ளது.
