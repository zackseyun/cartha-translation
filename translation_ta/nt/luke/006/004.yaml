source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: ta
  text: அவர் எவ்வாறு கடவுளின் இல்லத்திற்குள் சென்று, முன்னிலை அப்பங்களை[a] எடுத்து உண்டு, தம்மோடு இருந்தவர்களுக்கும் கொடுத்தார்—அந்த அப்பங்களை ஆசாரியர்கள் மட்டுமே உண்ணச் சட்டம் அனுமதித்தது அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கடவுளின் முன்னிலையில் வைக்கப்பட்ட அர்ப்பணிக்கப்பட்ட அப்பங்கள்; மரபாக, “சமுகத்து அப்பங்கள்.”
    reason: ἄρτους τῆς προθέσεως என்ற வழிபாட்டுச் சொல்லின் பொருளையும் மரபுவழிப் பெயரையும் விளக்குகிறது.
lexical_decisions:
- source_word: ὡς
  choice: எவ்வாறு
  rationale: முந்தைய வசனத்தில் தொடங்கிய தாவீதின் செயலை விவரிக்கும் மறைமுகக் கேள்வியை இயல்பாகத் தொடர்கிறது.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: கடவுளின் இல்லத்திற்குள் சென்று
  rationale: εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தையும், οἶκος என்பதன் ‘இல்லம்’ என்ற சொற்பொருளையும் காக்கிறது; ‘ஆலயம்’ என்று விளக்கிக் கூறவில்லை.
- source_word: ἄρτους τῆς προθέσεως
  choice: திருமுன்னிலை அப்பங்கள்
  rationale: கடவுளின் முன்னிலையில் வைக்கப்பட்ட புனித அப்பங்களைக் குறிக்கும் வழிபாட்டுச் சொல்லின் கருத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது; மாற்றுச் சொல்லை அடிக்குறிப்பு விளக்குகிறது.
- source_word: λαβὼν ἔφαγεν
  choice: எடுத்து உண்டு
  rationale: வினையெச்சமும் முதன்மை வினையும் காட்டும் செயல்களின் வரிசையை இயல்பான தமிழில் தருகிறது.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: தம்மோடு இருந்தவர்களுக்கும் கொடுத்தார்
  rationale: τοῖς μετ’ αὐτοῦ என்பதை நெருக்கமாகப் பிரதிபலிக்கிறது; καί இன் சேர்க்கைப் பொருளை ‘-உம்’ காட்டுகிறது.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: உண்ணச் சட்டம் அனுமதிக்கிறதே தவிர, வேறு யாரும் உண்ண அனுமதியில்லை
  rationale: இது வெறும் சமூக வழக்கமல்ல, சமயச் சட்டத்தின் அனுமதியைப் பற்றியது என்பதை வெளிப்படுத்துகிறது.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: குருக்கள் மட்டுமே
  rationale: εἰ μὴ மற்றும் μόνους ஆகியவை வலியுறுத்தும் தனிப்பட்ட உரிமையைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: புனித அப்பங்களை உண்பதற்கான வழிபாட்டுச் சட்டக் கட்டுப்பாடு
  choice: ‘சட்டம் அனுமதிக்கிறது / அனுமதியில்லை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உண்ணத் தகாது’ அல்லது ‘உண்ணக்கூடாது’
  rationale: ἔξεστιν இங்கு பொதுவான தகுதியை அல்ல, இஸ்ரவேலின் வழிபாட்டுச் சட்டத்தின்படியான அனுமதியைச் சுட்டுகிறது. அதேவேளை, இயேசுவின் வாதத்திலுள்ள பதற்றத்தைத் தீர்த்து விளக்காமல் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான நீண்ட வாக்கியத்தைத் தவிர்க்க இரண்டு தொடர்புடைய வினாக்களாக அமைத்தாலும், கிரேக்கத்தின் கேள்வித் தொனியும் சட்டரீதியான வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
