id: LUK.6.43
reference: Luke 6:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: ta
  text: ஏனெனில், நல்ல மரம் கெட்ட[a] கனியைக் கொடுப்பதில்லை; மறுபுறம், கெட்ட மரம் நல்ல கனியைக் கொடுப்பதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழுகிய கனி’ என்றும் ‘அழுகிய மரம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அழுகிய, பாழான அல்லது கெட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: ஏனெனில் ... கொடுப்பதில்லை
  rationale: γάρ முந்தைய கருத்துக்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் இருப்பை மறுக்கும் அமைப்பு, தமிழில் இயல்பான பொதுவிதிக் கூற்றாக வினை மறுப்பில் வெளிப்படுத்தப்பட்டது.
- source_word: δένδρον καλὸν
  choice: நல்ல மரம்
  rationale: καλός என்பதின் வேளாண்மை சார்ந்த நல்ல தன்மையையும் ஒழுக்க உருவகத்தின் எதிரொலியையும் ‘நல்ல’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ποιοῦν καρπὸν
  choice: கனியைக் கொடுக்கும்
  rationale: ποιέω என்பதற்கு நேரடியாக ‘செய்யும்’ என்று கூறுவதைவிட, மரம் கனிதரும் சூழலில் ‘கனியைக் கொடுக்கும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: σαπρόν
  choice: கெட்ட
  rationale: σαπρός என்பதற்கு அழுகிய, பாழான, கெட்ட ஆகிய பொருள்கள் உண்டு. கனிக்கும் மரத்திற்கும் ஒரே சொல்லை இயல்பாகப் பயன்படுத்தி, ‘நல்ல’ என்பதுடனான இணையான எதிர்மறை அமைப்பைப் பேண ‘கெட்ட’ தேர்ந்தெடுக்கப்பட்டது; அதன் தெளிவான அழுகல் சார்ந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐδὲ πάλιν
  choice: மறுபுறம் ... கொடுப்பதுமில்லை
  rationale: οὐδέ இரண்டாம் மறுப்பை இணைக்கிறது; πάλιν இங்கு எதிர்மறையான மறுபக்கத்தைக் காட்டுகிறது. ‘மறுபுறம்’ மற்றும் ‘-உம் இல்லை’ ஆகியவை இந்த அமைப்பை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: καρπὸν καλόν
  choice: நல்ல கனி
  rationale: முதல் பகுதிக்கு எதிரிணையாக உள்ள கிரேக்க அமைப்பையும் ‘நல்ல’ என்ற முக்கியச் சொல்லின் தொடர்ச்சியையும் பேணுகிறது.
theological_decisions:
- issue: வேளாண்மை உருவகத்துக்கும் ஒழுக்கப் பொருளுக்கும் இடையிலான சமநிலை
  choice: σαπρός என்பதை முதன்மை உரையில் ‘கெட்ட’ என்று இரு இடங்களிலும் மொழிபெயர்த்தல்
  alternative: ‘அழுகிய’ அல்லது ‘பாழான’ என்று மொழிபெயர்த்தல்
  rationale: ‘கெட்ட’ என்பது தமிழில் கனி மற்றும் மரம் இரண்டுடனும் இயல்பாகப் பொருந்தி, ‘நல்ல’ என்பதுடனான எதிரிணையைத் தெளிவாக்குகிறது. அதேவேளை, உருவகத்தை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாக மாற்றாமல் விடுகிறது; சொல்லின் அழுகல் சார்ந்த நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதாகப் புரியும் கண்ணியமான பழமொழிப் பாணி பயன்படுத்தப்பட்டுள்ளது. ‘கனி’ என்பது வேளாண்மை உருவகத்தையும் அதன் ஒழுக்க எதிரொலியையும் தக்கவைக்கிறது.
