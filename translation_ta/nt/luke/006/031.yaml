review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the reciprocal structure, the generic sense of οἱ ἄνθρωποι, and the repeated broad verb ποιέω. However, “எப்படிச் செய்ய வேண்டும்” can focus specifically on the manner in which people act, whereas the Greek leaves ποιῶσιν broad (“do [for/to]”). A wording without “எப்படி” better retains that breadth.
  naturalness: The draft is understandable and suitably dignified. The revised wording is more concise and idiomatic in modern standard Tamil while maintaining the conditional-comparative structure.
  terminology: “மக்கள்,” “விரும்புகிறீர்கள்,” and “செய்யுங்கள்” are appropriate, inclusive, and natural. “உங்களுக்குச் / அவர்களுக்குச்” clearly expresses the reciprocal relation.
  issues:
  - severity: low
    issue: “எப்படிச் செய்ய வேண்டும்” may narrow the broad sense of ποιῶσιν to manner of action.
    rationale: ποιέω is deliberately general in both clauses. Tamil can retain this generality by saying simply “உங்களுக்குச் செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறபடியே.”
