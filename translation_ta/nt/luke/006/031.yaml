language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: ta
  text: மக்கள் உங்களுக்குச் செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறபடியே, நீங்களும் அவர்களுக்குச் செய்யுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்றவர்கள் உங்களுக்குச் செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறவாறே, நீங்களும் அவர்களுக்குச் செய்யுங்கள்.”
    reason: ‘மக்கள்’ என்பதற்கான இயல்பான மாற்றுச் சொல் மற்றும் καθὼς என்பதன் ஒப்புமைப் பொருளை வேறு நடையில் வெளிப்படுத்தும் மாற்று மொழியாக்கம்.
lexical_decisions:
- source_word: καθὼς
  choice: எப்படியோ
  rationale: விருப்பத்தின் உள்ளடக்கத்தையும் அதற்கேற்ற ஒப்புமையையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: θέλετε
  choice: நீங்கள் விரும்புகிறீர்களோ
  rationale: θέλω இங்கு சாதாரண விருப்பத்தைக் குறிக்கிறது; ‘விரும்புகிறீர்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: உங்களுக்கு எப்படிச் செய்ய வேண்டும் என்று
  rationale: ἵνα உடன் வரும் வினை, விரும்பப்படுவதன் உள்ளடக்கத்தைத் தெரிவிக்கிறது. ποιέω என்பதன் பொதுவான பொருளைச் சுருக்காமல் ‘செய்ய’ என்று காக்கிறது.
- source_word: οἱ ἄνθρωποι
  choice: மக்கள்
  rationale: ἄνθρωποι ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது; ‘மக்கள்’ அந்தப் பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: ποιεῖτε
  choice: செய்யுங்கள்
  rationale: நிகழ்காலக் கட்டளையின் ஒழுக்க நடைமுறைக்கான அழைப்பை இயல்பான தமிழ் கட்டளை வடிவில் தெரிவிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: ὑμῖν என்பதுடன் உள்ள பரஸ்பர இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ὁμοίως
  choice: அப்படியே
  rationale: முன்னர் கூறப்பட்ட முறைக்கு ஒத்த செயலைக் கட்டளையிடும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: οἱ ἄνθρωποι என்பதன் பொதுப்பாலினக் குறிப்பு
  choice: மக்கள்
  alternative: மனிதர்கள் / மற்றவர்கள்
  rationale: மூலச்சொல் ஆண்களை மட்டும் குறிக்கவில்லை. ‘மக்கள்’ என்பது தேவையற்ற ஆண்பால் வரம்பைச் சேர்க்காமல் அதன் பொதுவான குறிப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கட்டளை நடை. ‘செய்ய’ என்ற பொதுவான வினை இருமுறையும் காக்கப்பட்டு, ‘நடத்துங்கள்’ போன்ற குறுகிய விளக்கவுரை தவிர்க்கப்பட்டுள்ளது.
