source:
  edition: SBLGNT
  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: ta
  text: உங்கள் தந்தை இரக்கமுள்ளவராய் இருப்பதுபோல, நீங்களும் இரக்கமுள்ளவர்களாய்[a] இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிவுள்ளவர்களாய்.” கிரேக்க அடைமொழி, பிறரின் துயரத்தைக் கண்டு மனம் உருகி இரக்கம் காட்டுகிறவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: இருங்கள்
  rationale: நிகழ்காலப் பன்மை ஏவல் வடிவத்தை இயல்பான நவீனத் தமிழில் தொடர்ச்சியான பண்புக்கான அழைப்பாக வெளிப்படுத்துகிறது; ‘ஆகுங்கள்’ என்பதைவிட இச்சூழலில் இயல்பாக உள்ளது.
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: இரக்கமுள்ளவர்களாய் / இரக்கமுள்ளவராய்
  rationale: இரக்கம் கொண்டு அதைச் செயலில் காட்டும் பண்பைத் தெரிவிக்கிறது. கிரேக்கச் சொல்லின் இரு நிகழ்வுகளிலும் ஒரே தமிழ்ச் சொல்லை வைத்து சொல் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: καθὼς
  choice: இருப்பதுபோல
  rationale: தந்தையின் இரக்கத்தை சீடர்களின் நடத்தைக்கான ஒப்புமையாகவும் முன்மாதிரியாகவும் காட்டுகிறது; காரணப் பொருளைச் சேர்ப்பதில்லை.
- source_word: ὁ πατὴρ ὑμῶν
  choice: உங்கள் தந்தை
  rationale: மூலத்தில் உள்ள உறவுமுறைச் சொல்லை நேரடியாகக் காக்கிறது; மூலத்தில் இல்லாத ‘பரலோகத்’ என்ற அடைமொழியைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கட்டளைக்கும் தந்தையின் பண்புக்கும் உள்ள உறவு
  choice: தந்தையின் இரக்கம், சீடர்கள் பின்பற்ற வேண்டிய முன்மாதிரியாக ஒப்பிடப்படுகிறது.
  alternative: தந்தை இரக்கமுள்ளவர் என்பதால் நீங்களும் இரக்கமுள்ளவர்களாய் இருங்கள்.
  rationale: καθὼς இங்கு காரணத்தைக் காட்டுவதைக் காட்டிலும் ஒப்புமையை (‘போல’) காட்டுகிறது; இதனால் வசனத்தின் நெறிசார் பின்பற்றுதல் கருத்து கூடுதல் விளக்கமின்றிப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. பன்மை ஏவல் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது; ஒரே கிரேக்க அடைமொழியின் இரு பயன்பாடுகளிலும் தமிழ்ச் சொல் ஒருமைப்பாடு காக்கப்பட்டுள்ளது.
