source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: ta
  text: 'என்னிடம் வந்து, என் வார்த்தைகளைக் கேட்டு, அவற்றின்படி செய்கிற ஒவ்வொருவரும் யாருக்கு ஒப்பானவர் என்பதை உங்களுக்குக் காட்டுவேன்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: என்னிடம் வந்து ... செய்கிற ஒவ்வொருவரும்
  rationale: πᾶς உடன் வரும் பெயரெச்சத் தொடர், குறிப்பிட்ட ஒருவரை அல்லாமல் இவ்வாறு செய்கிற எவரையும் பொதுவாகக் குறிக்கிறது. “ஒவ்வொருவரும்” அதன் முழுமையான பரப்பை இயல்பான தமிழில் காக்கிறது; πρός με என்பதற்கு “என்னிடம்” என்பது இயல்பான இயக்கக் குறிப்பு.
- source_word: ἀκούων μου τῶν λόγων
  choice: என் வார்த்தைகளைக் கேட்டு
  rationale: μου τῶν λόγων என்பது இங்கு இயேசுவின் சொற்கள் அல்லது போதனைகளைக் குறிக்கிறது. “கேட்டு” என்பது மூலத்தின் நேரடியான வினையைத் தக்கவைக்கிறது; கவனித்துக் கேட்பது அல்லது கீழ்ப்படிவது என்ற கருத்தை முன்கூட்டியே சேர்ப்பதில்லை.
- source_word: ποιῶν αὐτούς
  choice: அவற்றின்படி செய்கிற
  rationale: சொற்களை நேரடியாக “செய்தல்” என்பது தமிழில் இயல்பற்றது. “அவற்றின்படி செய்கிற” என்பது அந்த வார்த்தைகளை நடைமுறைப்படுத்தும் பொருளைத் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் தருகிறது.
- source_word: ὑποδείξω ὑμῖν
  choice: உங்களுக்குக் காட்டுவேன்
  rationale: எதிர்கால வினையான ὑποδείξω, அடுத்து வரவிருக்கும் ஒப்புமையை அறிமுகப்படுத்துகிறது. “காட்டுவேன்” அதன் காலத்தையும் செயற்பாட்டையும் நேரடியாகக் காக்கிறது.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: யாருக்கு ஒப்பானவர் என்பதை
  rationale: τίνι என்பது ஒருமை வேற்றுமை வடிவில் “யாருக்கு” என்ற ஒப்பீட்டைக் குறிக்கிறது. “யாருக்கு ஒப்பானவர்” என்பது அடுத்த வசனத்தில் வரும் மனிதருடனான ஒப்புமையை இயல்பான தமிழில் முன்வைக்கிறது.
theological_decisions:
- issue: பொதுப்படையான ஆண்பால் ஒருமை
  choice: “ஒவ்வொருவரும் ... ஒப்பானவர்” என்ற பொதுப்படையான ஒருமை அமைப்பு
  alternative: ஆண்பாலைக் குறிப்பாக வெளிப்படுத்த “அவன்” அல்லது “அவர்” என்ற பதிற்பெயரைச் சேர்த்தல்
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை இலக்கண வடிவம் பொதுப்படையாக எந்த மனிதரையும் குறிக்கிறது. தமிழில் “ஒவ்வொருவரும் ... ஒப்பானவர்” என்பது பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல் ஒருமைப் பிரதிநிதித்துவத்தையும் பொதுவான பொருளையும் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, ஆனால் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. “வார்த்தைகள்” என்பது λόγων என்பதன் நேரடியான பன்மையைத் தக்கவைக்கிறது; “அவற்றின்படி செய்கிற” என்பது இயல்பான தமிழுக்காகச் செய்யப்பட்ட அளவான பொருள்-இணைவு.
