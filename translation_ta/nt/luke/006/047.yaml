  source_fidelity: மூலக் கிரேக்கத்தின் பொதுப்படையான πᾶς ὁ ... அமைப்பும், ‘என்னிடம் வந்து,’ ‘என் வார்த்தைகளைக் கேட்டு,’ ‘அவற்றின்படி செய்கிற’ என்ற மூன்று இணைச் செயல்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ὑποδείξω ὑμῖν என்பதன் எதிர்கால அறிமுகச் செயல்பாடும் ‘உங்களுக்குக் காட்டுவேன்’ என்பதில் உள்ளது. τίνι ἐστὶν ὅμοιος என்பதற்கு ‘யாருக்கு ஒப்பானவர் என்பதை’ என்பது அடுத்துவரும் ஒப்புமையை இயல்பாகவும் பொருளோடும் முன்வைக்கிறது.
  naturalness: நடை நவீனத் தரநிலைத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘வார்த்தைகளைச் செய்தல்’ என்ற தமிழில் இயல்பற்ற நேரடிச் சொல்லாட்சியைத் தவிர்த்து, ‘அவற்றின்படி செய்கிற’ என்று கூறுவது பொருளைச் சேர்க்கவோ குறைக்கவோ செய்யாமல் இயல்பான வெளிப்பாட்டை வழங்குகிறது.
  terminology: ‘வார்த்தைகள்,’ ‘கேட்டு,’ ‘காட்டுவேன்,’ மற்றும் ‘ஒப்பானவர்’ ஆகியவை சூழலுக்கு ஏற்ற, நடுநிலையான சொற்கள். பொதுப்படையான ஆண்பால் ஒருமையைத் தமிழில் தேவையற்ற பாலினக் குறிப்பின்றி ‘ஒவ்வொருவரும் ... ஒப்பானவர்’ என வெளிப்படுத்துவது பொருத்தமானது.
