- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: அப்போது அவனுடைய தந்தை
  rationale: இரண்டாவது δέ தந்தையின் பதில்செயலை அறிமுகப்படுத்துகிறது; ‘அப்போது’ தமிழ் கதைநடையில் இயல்பான முன்னேற்றத்தைத் தருகிறது.
- source_word: ἐξελθὼν
  choice: வெளியே வந்து
