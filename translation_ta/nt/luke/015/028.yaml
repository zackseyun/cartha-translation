  rationale: παρακαλέω என்பதன் earnest appeal-ஐ ‘மன்றாடினார்’ காட்டுகிறது; imperfect வடிவத்தின் நீடித்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுகோளை ‘தொடர்ந்து’ வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவனிடம்
  rationale: சுட்டுப்பெயர் மூத்த மகனைக் குறிக்கிறது; தமிழ் வினை அமைப்புக்கு ஏற்றவாறு வேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
