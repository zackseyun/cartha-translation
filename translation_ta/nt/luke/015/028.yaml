translation_notes:
  register: நவீன தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் கண்ணியமான கதைநடையைப் பேணும் வகையிலும் அமைக்கப்பட்டது. ‘விரும்பவில்லை’ மூலத்தின் விருப்பம் சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது; ‘தொடர்ந்து’ என்பது imperfect வினைவடிவத்தின் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
