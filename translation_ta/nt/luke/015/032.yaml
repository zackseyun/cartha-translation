id: LUK.15.32
reference: Luke 15:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: ta
  text: ஆனால் கொண்டாடி மகிழ வேண்டியிருந்தது. ஏனெனில், உன் இந்தச் சகோதரன் இறந்தவனாக இருந்தான்; மீண்டும் உயிர்பெற்றான்[a]. காணாமற்போயிருந்தான்; கண்டுபிடிக்கப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், ‘வாழ்ந்தான்’ அல்லது ‘உயிரடைந்தான்.’ இங்கு இது உவமையில் ஏற்பட்ட மீட்பைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: கொண்டாட
  rationale: விருந்தின் சூழலில் உள்ள விழாக்கால மகிழ்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: χαρῆναι
  choice: மகிழ
  rationale: மூலத்தில் உள்ள இரண்டாவது, நெருங்கிய பொருளுடைய மகிழ்ச்சி வினையைத் தனியாகப் பேணுகிறது.
- source_word: ἔδει
  choice: வேண்டியிருந்தது
  rationale: இறந்தகாலத்தில் இருந்த சூழ்நிலை அல்லது ஒழுக்கத் தேவையை வெளிப்படுத்துகிறது; ‘தகுந்தது’ என்ற மென்மையான பொருளையும் முற்றிலும் நீக்காது.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: உன் சகோதரனாகிய இவன்
  rationale: οὗτος என்ற சுட்டுப்பொருளையும் σου என்ற உறவுச் சுட்டையும் இயல்பான, வலியுறுத்தலுள்ள தமிழில் பேணுகிறது.
- source_word: νεκρὸς ἦν
  choice: இறந்தவனாக இருந்தான்
  rationale: உவமையான மீட்பு உணர்வை விளக்கமாகச் சேர்க்காமல் மூலத்தின் மரணம்–உயிர் எதிரிணையைப் பேணுகிறது.
- source_word: ἔζησεν
  choice: மீண்டும் உயிர்பெற்றான்
  rationale: முந்தைய மரண நிலையுடன் உள்ள எதிர்மறை இணைப்பினால் குறிக்கப்படும் மீண்டும் வாழ்தலை இயல்பான தமிழில் தருகிறது; கிரேக்க வினை சொற்பட ‘வாழ்ந்தான்/உயிரடைந்தான்’ என்றும் கொள்ளலாம்.
- source_word: ἀπολωλὼς
  choice: காணாமற்போயிருந்தான்
  rationale: முடிவுற்ற நிலையைக் காட்டும் பங்கெச்சத்தின் ‘தொலைந்த நிலையில் இருந்தான்’ என்ற பொருளை, மனிதரைப் பற்றிய இயல்பான தமிழில் தருகிறது.
- source_word: εὑρέθη
  choice: கண்டுபிடிக்கப்பட்டான்
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, காணாமற்போதல்–கண்டுபிடிக்கப்படுதல் என்ற எதிரிணையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἔζησεν என்பது உடல் உயிர்த்தெழுதலா அல்லது உவமையான மீட்பா என்பதை மொழிபெயர்ப்பில் வெளிப்படையாகத் தீர்மானித்தல்
  choice: ‘மீண்டும் உயிர்பெற்றான்’ என்று மரணம்–உயிர் உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘மீண்டும் வாழ்ந்தான்’ அல்லது ‘மீண்டும் உயிரடைந்தான்’
  rationale: உவமையின் சூழலில் இது உறவுமீட்பைக் குறித்தாலும், மொழிபெயர்ப்பு அந்த விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் தெய்வியல் உருவகத் தீவிரத்தையும் இயல்பான தமிழையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified, இயல்பான நடை. ‘களிகூர’ போன்ற அரிதான அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் இரட்டை மகிழ்ச்சி வெளிப்பாடும் மரணம்–உயிர், காணாமற்போதல்–கண்டுபிடிக்கப்படுதல் ஆகிய இணைகளும் பேணப்பட்டுள்ளன.
