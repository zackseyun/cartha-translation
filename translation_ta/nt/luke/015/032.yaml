revisions:
- from: ஆனால் நாம் கொண்டாடி மகிழ வேண்டியிருந்தது. ஏனெனில், உன் சகோதரனாகிய இவன் இறந்தவனாக இருந்தான்; மீண்டும் உயிர்பெற்றான்[a]. காணாமற்போயிருந்தான்; கண்டுபிடிக்கப்பட்டான்.
  to: ஆனால் கொண்டாடி மகிழ வேண்டியிருந்தது. ஏனெனில், உன் இந்தச் சகோதரன் இறந்தவனாக இருந்தான்; மீண்டும் உயிர்பெற்றான்[a]. காணாமற்போயிருந்தான்; கண்டுபிடிக்கப்பட்டான்.
  rationale: The revision removes the added first-person subject so that the Tamil retains the Greek impersonal necessity. It also adjusts the order of the demonstrative and possessive expression to make the father's pointed reminder of kinship more natural in modern standard Tamil. No doctrinal clarification is added to the text itself, and the existing footnote remains appropriately restrained.
