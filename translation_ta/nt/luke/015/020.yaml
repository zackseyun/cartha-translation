source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: ta
  text: அவன் எழுந்து தன் தந்தையிடம் சென்றான். அவன் இன்னும் வெகுதூரத்தில் இருந்தபோதே, அவனுடைய தந்தை அவனைக் கண்டு மனம் உருகினார்; ஓடிவந்து அவனுடைய கழுத்தைக் கட்டிக்கொண்டு, அவனை உள்ளன்போடு முத்தமிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கிரேக்க வினை தீவிரமான அன்புடன் முத்தமிடுவதைக் குறிக்கலாம்; மீண்டும் மீண்டும் முத்தமிட்டார் என்ற நுண்பொருளும் இதில் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: மகன் முடிவெடுத்துச் செயல்படத் தொடங்குவதையும், அதைத் தொடர்ந்து தந்தையிடம் செல்வதையும் இயல்பான தமிழ் நிகழ்வரிசையில் காட்டுகிறது.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: தன் தந்தையிடம் சென்றான்
  rationale: ἔρχομαι என்பது பார்வைக்கோணத்தின்படி ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். மகனின் செயலின் பார்வையில் ‘சென்றான்’ என்பது இயல்பான தமிழ்; ἑαυτοῦ என்பதன் தற்சுட்டுப் பொருளை ‘தன்’ காக்கிறது.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: அவன் இன்னும் வெகுதூரத்தில் இருந்தபோதே
  rationale: ஒரே நேரத்தில் நிலவிய சூழ்நிலையைச் சுட்டும் கிரேக்கச் சொற்றொடரையும், தந்தை மகனைத் தொலைவிலேயே கண்டார் என்ற வலியுறுத்தலையும் தெளிவாகக் காக்கிறது.
- source_word: ἐσπλαγχνίσθη
  choice: மனம் உருகினார்
  rationale: ஆழ்ந்த உள்ளார்ந்த இரக்கத்தால் அசைக்கப்பட்டார் என்ற வினையின் உணர்ச்சிசார் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δραμὼν
  choice: ஓடிவந்து
  rationale: தந்தை ஓடிய செயலை நேரடியாகக் கூறுவதோடு, மகனை நோக்கி வந்த இயக்கத்தையும் தமிழ் வினையெச்சத்தில் இயல்பாக இணைக்கிறது.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: அவனுடைய கழுத்தைக் கட்டிக்கொண்டு
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய கழுத்தின்மேல் விழுந்து’ என்பது தமிழில் தவறாகப் புரியக்கூடும். இங்கு அணைத்துக்கொள்ளுதலைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் உயிர்ப்பையும் பொருளையும் இயல்பாக வழங்குகிறது.
- source_word: κατεφίλησεν
  choice: அவனை உள்ளன்போடு முத்தமிட்டார்
  rationale: καταφιλέω என்ற வினையில் இருக்கக்கூடிய அன்பின் தீவிரத்தை வெளிப்படுத்துகிறது; அதேவேளையில் முத்தமிடுதல் மீண்டும் மீண்டும் நடந்தது என்று முதன்மை உரையில் அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: உவமையில் தந்தையின் இரக்கத்தைச் சித்தரித்தல்
  choice: தந்தையின் உணர்ச்சியையும் முன்வந்து செயல்பட்டதையும் வலிமையாகக் காட்டி, அதற்கு வெளிப்படையான உருவக அல்லது கோட்பாட்டுச் சித்தரிப்பைச் சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: தந்தை நேரடியாக இறைவனைக் குறிக்கிறார் என்று விளக்கத்தை உரைக்குள்ளேயே சேர்த்தல், அல்லது உணர்ச்சியின் தீவிரத்தைக் குறைத்துக் கூறுதல்
  rationale: மூலவசனம் தந்தையின் ஆழ்ந்த இரக்கம், ஓட்டம், அணைப்பு, முத்தம் ஆகியவற்றைத் தெளிவாக முன்வைக்கிறது. மொழிபெயர்ப்பு அந்த வலிமையைக் காக்க வேண்டும்; ஆனால் உவமையின் இறையியல் பொருளை உரையைத் தாண்டி வெளிப்படையாக நிர்ணயிக்கக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. தந்தையைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘மனம் உருகினார்’ உணர்ச்சியின் ஆழத்தையும், ‘கழுத்தைக் கட்டிக்கொண்டு’ கிரேக்க மரபுத்தொடரின் அணைப்புப் பொருளையும் சாதாரண வாசகர்களுக்குத் தெளிவாக வழங்குகின்றன.
