revisions:
- from: அவருடைய மூத்த மகன் வயலில் இருந்தான். அவன் திரும்பி வந்து வீட்டை நெருங்கியபோது, இசையையும் நடனத்தையும் கேட்டான்.[a]
  to: அவனுடைய மூத்த மகன் வயலில் இருந்தான். அவன் வந்து வீட்டை நெருங்கியபோது, இசையையும் நடனத்தையும்[a] கேட்டான்.
  rationale: “திரும்பி” நீக்கப்பட்டதால் மூலத்தில் இல்லாத திரும்பிவருதல் என்னும் பொருள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு அதன் விளக்கும் இசை மற்றும் நடனச் சொற்களுக்கே நேரடியாக இணைக்கப்பட்டுள்ளது; அவற்றின் சொற்பொருள் மாற்றுவாய்ப்பும் பாதுகாக்கப்பட்டுள்ளது.
