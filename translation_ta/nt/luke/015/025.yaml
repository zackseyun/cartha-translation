  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: ta
  text: அவனுடைய மூத்த மகன் வயலில் இருந்தான். அவன் வந்து வீட்டை நெருங்கியபோது, இசையையும் நடனத்தையும்[a] கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கருவியிசையையும் நடனக் குழுக்களையும்.” கிரேக்கச் சொற்கள் இன்னும் குறிப்பாக இசை நிகழ்த்துதலையும் நடனமாடும் குழுக்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: இருந்தான்
  rationale: δέ இங்கு கதையின் கவனத்தை மூத்த மகனிடம் மாற்றுகிறது; தமிழில் தனியான இணைப்புச்சொல் சேர்க்காமலேயே புதிய வாக்கியமும் சூழலும் அந்த மாற்றத்தை இயல்பாகக் காட்டுகின்றன.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: அவருடைய மூத்த மகன்
  rationale: πρεσβύτερος ஒப்பீட்டுப் பொருளில் இளைய மகனுக்கு எதிரான மூத்த மகனைக் குறிக்கிறது; குடும்பச் சூழலில் ‘மூத்த மகன்’ இயல்பான நவீனத் தமிழ்.
- source_word: ἐν ἀγρῷ
  choice: வயலில்
  rationale: ἀγρός இங்கு வயல் அல்லது பண்ணை நிலத்தைக் குறிக்கிறது; ‘வயலில்’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: ὡς ἐρχόμενος
  choice: அவன் திரும்பி வந்து ... போது
  rationale: ἐρχόμενος வீட்டை நோக்கி வந்துகொண்டிருந்த சூழலைக் குறிக்கிறது. வயலிலிருந்து வீட்டுக்கு வருவதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் சொல்ல ‘திரும்பி வந்து’ பயன்படுத்தப்பட்டுள்ளது; ‘போது’ தொடரும் செயலை இணைக்கிறது.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: வீட்டை நெருங்கியபோது
  rationale: ἐγγίζω என்பதன் ‘அருகில் வருதல்’ என்ற இயக்கப் பொருளை ‘நெருங்கு’ நேரடியாகத் தருகிறது.
- source_word: ἤκουσεν
  choice: கேட்டான்
  rationale: எளிய இறந்தகாலக் கதைவினையாக மொழிபெயர்க்கப்பட்டுள்ளது; தொடக்கநிலைப் பொருள் கூடுதலாகச் சேர்க்கப்படவில்லை.
- source_word: συμφωνίας
  choice: இசை
  rationale: συμφωνία இசை அல்லது குறிப்பாகக் கருவியிசையைக் குறிக்கலாம்; சூழலில் ‘இசை’ வாசகருக்கு இயல்பாகவும் போதுமான அகலத்துடனும் உள்ளது.
- source_word: χορῶν
  choice: நடனம்
  rationale: χορός நடனத்தையோ நடனக் குழுவையோ குறிக்கலாம்; இசையுடன் இணைந்த இச்சூழலில் நிகழ்வைக் குறிக்கும் ‘நடனம்’ இயல்பானது, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
