  text: 'So he told them this parable[a], saying:'
translation:
  language: ta
  text: 'அவர் அவர்களிடம் இந்த உவமையைக் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: λέγω என்பதன் இறந்தகால வடிவம் பேச்சை அறிமுகப்படுத்துகிறது. ‘உவமையைச் சொன்னார்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் பேச்சுச் செயலைத் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: δέ இங்கு மென்மையான நிகழ்வுத் தொடர்ச்சி இணைப்பாக உள்ளது. முந்தைய முறையீட்டுக்குப் பிறகு இயேசு பதிலளிப்பதை ‘அப்போது’ இயல்பாக இணைக்கிறது; தேவையற்ற எதிர்மறையையோ வலுவான காரணவிளைவையோ சேர்க்கவில்லை.
- source_word: πρὸς αὐτοὺς
  choice: அவர்களிடம்
  rationale: πρός உடன் வரும் வேற்றுமை உரையின் முகவர்களைக் குறிக்கிறது. ‘அவர்களிடம்’ என்பது இதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: τὴν παραβολὴν ταύτην
  choice: இந்த உவமையை
  rationale: சினாப்டிக் நற்செய்திகளில் παραβολή என்பதன் நிலையான சூழல்சார் பொருள் ‘உவமை’; ταύτην என்பதைக் ‘இந்த’ எனக் காத்துள்ளது.
- source_word: λέγων
  choice: முற்றுப்புள்ளிக்குப் பதிலான முக்காற்புள்ளி (:) வழியாக வெளிப்படுத்தப்பட்டது
  rationale: இப்பெயரெச்சம் தொடர்ந்து வரும் உவமையின் சொற்களை அறிமுகப்படுத்துகிறது. தமிழில் ‘சொன்னார், கூறியதாவது’ என்று மீளுரைப்பதைவிட முக்காற்புள்ளி இதன் உரையாடல் அறிமுகப் பணியை இயல்பாகச் செய்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கிரேக்கத்தின் ‘சொன்னார்… சொல்லி’ என்ற கட்டமைப்பு தமிழில் ஏற்படுத்தும் தேவையற்ற மீளுரைப்பைத் தவிர்த்து, அதன் பணியை முக்காற்புள்ளி மூலம் காத்துள்ளது.
