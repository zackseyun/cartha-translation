review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the fattened calf, the slaughtering command, and the concluding communal invitation to eat and celebrate. However, «கொண்டுவந்து» is a conjunctive participial form (‘having brought’) rather than a clear rendering of the independent plural imperative φέρετε. A finite imperative makes the sequence of commands explicit.
  naturalness: The wording is generally modern and clear. «கொழுக்கவைத்த கன்று» is understandable, and «அறுங்கள்» can refer to slaughtering, but «அறுத்துவிடுங்கள்» is more idiomatic and unambiguously conveys slaughter in this context. Separating the commands with semicolons gives natural Tamil pacing.
  terminology: No doctrinally loaded terminology has been introduced. The footnote appropriately retains the possible sacrificial nuance of θύσατε without making it the primary meaning. «மகிழ்வோம்» accurately conveys εὐφρανθῶμεν and is natural in a shared feast context.
  issues:
  - severity: medium
    issue: The rendering of φέρετε is not an explicit imperative.
    rationale: «கொண்டுவந்து» functions as ‘having brought/bringing,’ whereas φέρετε is a plural command. «கொண்டு வாருங்கள்» preserves the command directly.
  - severity: low
    issue: «அறுங்கள்» may be less explicit than needed for slaughtering an animal.
    rationale: Although intelligible in context, «அறுத்துவிடுங்கள்» is a more natural modern Tamil command for slaughtering the calf and retains the non-cultic primary sense.
  revised_text: கொழுக்கவைத்த கன்றைக் கொண்டு வாருங்கள்; அதை அறுத்துவிடுங்கள்[a]; நாம் சாப்பிட்டு மகிழ்வோம்.
