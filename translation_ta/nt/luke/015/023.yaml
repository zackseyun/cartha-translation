    text: “அதைப் பலியிடுங்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் ஒரு விலங்கை அறுப்பதைக் குறிக்கலாம், மேலும் சில சூழல்களில் பலியிடும் நுண்பொருளையும் கொண்டிருக்கலாம்.
