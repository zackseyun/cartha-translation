  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: ta
  text: கொழுக்கவைத்த கன்றைக் கொண்டு வாருங்கள்; அதை அறுத்துவிடுங்கள்[a]; நாம் சாப்பிட்டு மகிழ்வோம்.
  philosophy: optimal-equivalence
  footnotes:
