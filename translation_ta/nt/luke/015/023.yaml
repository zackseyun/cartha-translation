lexical_decisions:
- source_word: φέρετε
  choice: கொண்டுவந்து
  rationale: பன்மை ஏவல் வடிவத்தை இயல்பான தமிழில் தருகிறது; ‘இங்கே’ அல்லது ‘வெளியே’ போன்ற, கிரேக்கத்தில் வெளிப்படையாக இல்லாத இடக்குறிப்பைச் சேர்க்கவில்லை.
- source_word: μόσχον τὸν σιτευτόν
  choice: கொழுக்கவைத்த கன்று
  rationale: μόσχος இளம் மாட்டைக் குறிக்கிறது; σιτευτός சிறப்பு நிகழ்வுக்காகத் தீனி போட்டு கொழுக்கவைக்கப்பட்டதைக் குறிக்கிறது. இச்சொற்றொடர் இரண்டையும் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: θύσατε
  choice: அதை அறுங்கள்
  rationale: விருந்துக்காக விலங்கைக் கொல்லும் நிகழ்வைத் தமிழில் இயல்பாகக் குறிக்கிறது; வசனத்தில் கட்டாயமாக இல்லாத சடங்குசார் பலியிடும் கருத்தை முதன்மை உரையில் புகுத்தவில்லை.
- source_word: φαγόντες
  choice: நாம் சாப்பிட்டு
  rationale: சொல்லுக்குச் சொல் வடிவில் ‘சாப்பிட்ட பின்பு’ என இருந்தாலும், தொடர்ந்துவரும் εὐφρανθῶμεν உடன் இணைந்து விருந்து நிகழ்வின் ஒருங்கிணைந்த செயலாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: εὐφρανθῶμεν
  choice: கொண்டாடுவோம்
  rationale: முதல் நபர் பன்மை ஊக்கவுரை வடிவத்தையும், விருந்து மற்றும் மகிழ்ச்சி நிறைந்த சூழலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ ... καὶ
  choice: -உம் / இணைப்பு அமைப்பு
  rationale: தமிழின் இயல்பான வாக்கிய ஓட்டத்தில் கட்டளைகளையும் இறுதி ஊக்கவுரையையும் இணைக்கிறது; கிரேக்கத் தொடரின் முன்னேற்றம் காக்கப்படுகிறது.
theological_decisions:
- issue: θύσατε என்பதிலுள்ள சாத்தியமான பலிசார் நுண்பொருள்
  choice: முதன்மை உரையில் விருந்துக்காக விலங்கை அறுக்கும் கட்டளையாக ‘அதை அறுங்கள்’ என்று தரப்பட்டது.
  alternative: ‘அதைப் பலியிடுங்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: θύω சில சூழல்களில் பலியிடுதலைக் குறிக்கலாம். ஆனால் இக்கதையில் வீட்டார் கொண்டாட்டத்திற்கான விருந்து தயாரிப்பே நேரடியான சூழல். ‘பலியிடுங்கள்’ என்பது வெளிப்படையாகக் கூறப்படாத சடங்குசார் கருத்தை முன்னிறுத்தக்கூடும்; அதேவேளையில் அந்தச் சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதையின் குடும்ப விருந்து சூழலும் காக்கப்பட்டுள்ளன. ‘கொழுக்கவைத்த’ என்பது செயற்கையாகப் பருமனானது என்பதல்ல, சிறப்பு விருந்துக்காகத் தீனி போட்டு வளர்க்கப்பட்டதைக் குறிக்கிறது. அரைப்புள்ளி கட்டளைகளிலிருந்து ‘நாம்’ எனும் கூட்டு அழைப்புக்கான நகர்வைத் தெளிவாக்குகிறது.
