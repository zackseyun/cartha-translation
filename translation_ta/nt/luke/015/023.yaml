- from: கொழுக்கவைத்த கன்றைக் கொண்டுவந்து, அதை அறுங்கள்[a]; நாம் சாப்பிட்டுக் கொண்டாடுவோம்.
  to: கொழுக்கவைத்த கன்றைக் கொண்டு வாருங்கள்; அதை அறுத்துவிடுங்கள்[a]; நாம் சாப்பிட்டு மகிழ்வோம்.
