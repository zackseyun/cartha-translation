revisions:
- from: ஏனெனில், என்னுடைய இந்த மகன் இறந்துபோயிருந்தான்; மீண்டும் உயிர்பெற்றான். காணாமற்போயிருந்தான்; இப்போது கிடைத்துவிட்டான். பிறகு அவர்கள் கொண்டாடத் தொடங்கினார்கள்.
  to: ஏனெனில், இந்த என் மகன் இறந்திருந்தான்; மீண்டும் உயிர்பெற்றான். காணாமற்போயிருந்தான்; கண்டுபிடிக்கப்பட்டான். அவர்கள் கொண்டாடத் தொடங்கினார்கள்.
