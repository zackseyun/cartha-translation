id: LUK.15.24
reference: Luke 15:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: ta
  text: ஏனெனில், இந்த என் மகன் இறந்திருந்தான்; மீண்டும் உயிர்பெற்றான். காணாமற்போயிருந்தான்; கண்டுபிடிக்கப்பட்டான். அவர்கள் கொண்டாடத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: தந்தை ஏன் கொண்டாட்டம் நடத்துகிறார் என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் இயல்பான காரண இணைப்புச்சொல்.
- source_word: οὗτος ὁ υἱός μου
  choice: என்னுடைய இந்த மகன்
  rationale: οὗτος என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலையும், μου என்பதன் உரிமை மற்றும் பாசத் தொடர்பையும் இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
- source_word: νεκρὸς ἦν
  choice: இறந்துபோயிருந்தான்
  rationale: முந்தைய நிலையைத் தெளிவாகக் காட்டுகிறது. உவமைப் பொருளை விளக்கிப் பதிலிடாமல், மூலத்தின் வலுவான இறப்பு மொழியை அப்படியே காக்கிறது.
- source_word: ἀνέζησεν
  choice: மீண்டும் உயிர்பெற்றான்
  rationale: ‘மறுபடியும் வாழ்தல்/உயிரடைதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; கிரேக்க இறந்தகால நிகழ்வையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἦν ἀπολωλὼς
  choice: காணாமற்போயிருந்தான்
  rationale: முந்தைய காணாமற்போன நிலையை வெளிப்படுத்தி, லூக்கா 15 முழுவதிலும் உள்ள காணாமற்போதல்–கிடைத்தல் கருத்திணைப்பைக் காக்கிறது.
- source_word: εὑρέθη
  choice: இப்போது கிடைத்துவிட்டான்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தின் ‘கிடைக்கப்பெற்றான்’ என்ற பொருளை, செய்பவரைக் குறிப்பிடாமல் இயல்பான தமிழில் தருகிறது. ‘இப்போது’ மற்றும் நிறைவுப்பொருள் கொண்ட ‘விட்டான்’ தற்போதைய கொண்டாட்டத்துக்குக் காரணமான விளைவைத் தெளிவாக்குகின்றன.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: அவர்கள் கொண்டாடத் தொடங்கினார்கள்
  rationale: ἤρξαντο என்பதன் தொடக்க நிலையைப் பாதுகாக்கிறது; விருந்து சார்ந்த மகிழ்ச்சியை εὐφραίνεσθαι இங்கு குறிக்கும் என்பதால் ‘கொண்டாட’ என்பது இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
theological_decisions:
- issue: ‘இறந்துபோயிருந்தான்; மீண்டும் உயிர்பெற்றான்’ என்ற மொழியின் உவமைத் தன்மை
  choice: இறப்பு–உயிர்ப்பு மொழியை விளக்கப் பரிமாற்றமின்றி நேரடியாக வைத்தல்
  alternative: ‘உறவை இழந்திருந்தான்; மீண்டும் உறவுக்குள் வந்தான்’ என்று உவமையை விளக்கிப் பெயர்த்தல்
  rationale: கதையில் இச்சொற்கள் பிரிவையும் மீட்பையும் உவமையாகக் குறித்தாலும், இயேசுவின் கதையில் உள்ள வலுவான இறப்பு–உயிர்ப்பு பதற்றத்தை மொழிபெயர்ப்பு மென்மையாக்கவோ குறிப்பிட்ட ஆன்மிக விளக்கமாக மாற்றவோ கூடாது.
- issue: εὑρέθη என்ற செயப்பாட்டு வடிவத்தில் செய்பவர் குறிப்பிடப்படாமை
  choice: ‘கிடைத்துவிட்டான்’ என்று செய்பவரைக் குறிப்பிடாமல் வைத்தல்
  alternative: ‘நாங்கள் அவனைக் கண்டுபிடித்தோம்’ என்று செய்பவரைச் சேர்த்தல்
  rationale: மூலவாக்கியம் யார் கண்டுபிடித்தார் என்பதை வெளிப்படையாகச் சொல்லவில்லை; அந்தத் திறந்த தன்மையை மொழிபெயர்ப்பும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடை இயல்பும் கொண்ட பதிவு. ‘என்னுடைய இந்த மகன்’ என்பதில் மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது; ‘கிடைத்துவிட்டான்’ என்பது கடினமான ‘கண்டுபிடிக்கப்பட்டான்’ என்பதைவிட இயல்பான தமிழ்.
