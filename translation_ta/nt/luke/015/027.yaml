  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: ta
  text: அவன் அவனிடம், “உன் சகோதரன் வந்திருக்கிறான்; அவனை நலமாகத் திரும்பப் பெற்றுக்கொண்டதால், உன் தகப்பன் கொழுக்கவைத்த கன்றை அறுத்தார்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἥκει
  choice: வந்திருக்கிறார்
  rationale: வருகை நிகழ்ந்து, அவர் இப்போது அங்கே இருப்பதைக் காட்டும் ἥκω என்பதன் நிகழ்கால விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔθυσεν
  choice: அடித்திருக்கிறார்
  rationale: விருந்துக்காக மிருகத்தைக் கொன்றதைக் குறிக்கும் இயல்பான தமிழ் வழக்கு; ‘பலியிட்டார்’ என்று மொழிபெயர்த்து வழிபாட்டுச் சடங்கு என்ற தேவையற்ற பொருளை ஏற்படுத்துவதைத் தவிர்க்கிறது.
- source_word: μόσχον τὸν σιτευτόν
  choice: கொழுக்கவைத்த கன்று
  rationale: சிறப்பு விருந்துக்காகத் தீனி போட்டு கொழுக்கவைக்கப்பட்ட கன்றைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑγιαίνοντα
  choice: நலமுடன்
  rationale: உடல்நலத்தையும் பாதுகாப்பாகத் திரும்பிய நிலையையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἀπέλαβεν
  choice: திரும்பப் பெற்றுக்கொண்டதால்
  rationale: வெறுமனே வரவேற்றார் என்பதைக் காட்டிலும், பிரிந்திருந்த மகனை மீண்டும் பெற்றுக்கொண்டார் என்ற மீட்புப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: அவன் அவரிடம் ... என்றான்
  rationale: ὅτι நேர்கூற்றை அறிமுகப்படுத்துவதை மேற்கோள் வடிவில் இயல்பாகக் காட்டுகிறது; δέ இங்கே மென்மையான இணைப்பாக இருப்பதால் தனியாக வலியுறுத்தப்படவில்லை.
