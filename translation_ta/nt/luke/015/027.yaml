translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வடிவமைக்கப்பட்டது. உரையாடலில் ‘உங்கள்,’ ‘சகோதரர்,’ ‘தகப்பனார்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; விருந்துக்கான மிருகக் கொலையை இயல்பாகச் சொல்ல ‘கன்றை அடித்திருக்கிறார்’ எனத் தேர்ந்தெடுக்கப்பட்டது.
