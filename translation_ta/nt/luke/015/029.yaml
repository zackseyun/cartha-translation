  to: 'ஆனால் அவன் தன் தந்தையிடம் பதிலளித்தான்: “இதோ, இத்தனை ஆண்டுகளாக நான் உமக்கு அடிமைபோல் பணிசெய்து வருகிறேன்[a]; உமது கட்டளையை ஒருபோதும் மீறியதில்லை. இருந்தும், என் நண்பர்களோடு மகிழ்ந்து கொண்டாடுவதற்கு ஒரு வெள்ளாட்டுக்குட்டியைக்கூட நீர் எனக்குத் தந்ததில்லை.”'
  rationale: The revision replaces the potentially imprecise animal term with «வெள்ளாட்டுக்குட்டி», makes the discourse marker idiomatic in Tamil, and renders the final purpose clause as festive celebration. It retains the careful non-literal Tamil expression for the elder son's use of δουλεύω and preserves the existing footnote anchor and lexical alternative.
