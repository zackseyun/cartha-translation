source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: ta
  text: 'ஆனால் அவன் தன் தந்தையிடம் பதிலளித்தான்: “இதோ, இத்தனை ஆண்டுகளாக நான் உமக்கு அடிமைபோல் பணிசெய்து வருகிறேன்[a]; உமது கட்டளையை ஒருபோதும் மீறியதில்லை. இருந்தும், என் நண்பர்களோடு மகிழ்ந்து கொண்டாடுவதற்கு ஒரு வெள்ளாட்டுக்குட்டியைக்கூட நீர் எனக்குத் தந்ததில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்குப் பணிசெய்து வருகிறேன்.” δουλεύω என்ற கிரேக்க வினைச்சொல் “பணிசெய்” என்றும், வலிமையான பொருளில் “அடிமையாகப் பணிசெய்” என்றும் பொருள்படலாம். இங்கு மூத்த மகனின் கசப்பான தொனியை “அடிமைபோல் பணிசெய்து வருகிறேன்” என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்தான்
  rationale: ‘பதிலளித்து சொன்னான்’ என்ற கிரேக்க வழக்குச் சொல்லின் பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: Ἰδοὺ
  choice: பாருங்கள்
  rationale: தந்தையின் கவனத்தை வலியுறுத்தி ஈர்க்கும் உரையாடல் குறிப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοσαῦτα ἔτη
  choice: இத்தனை ஆண்டுகளாக
  rationale: நீண்ட காலத்தைக் குறிக்கும் தொடர்ச்சியான குறையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: δουλεύω σοι
  choice: உமக்கு அடிமைபோல் உழைத்துவருகிறேன்
  rationale: δουλεύω என்பதிலுள்ள கீழ்ப்பட்ட அடிமைப் பணியின் வலிமையையும் மூத்த மகனின் கசப்பான மனநிலையையும் காக்கிறது; அவன் சட்டப்படி அடிமை என்று கூறுவதைத் தவிர்க்க ‘அடிமைபோல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐντολήν σου παρῆλθον
  choice: உமது கட்டளையை ... மீறியதில்லை
  rationale: கட்டளையைப் புறக்கணித்தல் அல்லது மீறுதல் என்ற சூழல்சார் பொருளை தெளிவாகத் தருகிறது.
- source_word: ἔδωκας ἔριφον
  choice: ஓர் ஆட்டுக்குட்டியைக்கூட ... தந்ததில்லை
  rationale: ἔριφος என்பது இளம் வெள்ளாட்டைக் குறிக்கிறது; ‘கூட’ என்பது மகனின் குறையில் உள்ள ஒப்பீட்டு வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: என் நண்பர்களோடு மகிழ்ந்திருக்க
  rationale: நண்பர்களுடன் விருந்து கொண்டாடி மகிழும் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: மூத்த மகன் பயன்படுத்தும் δουλεύω என்பதன் வலிமை
  choice: உமக்கு அடிமைபோல் உழைத்துவருகிறேன்
  alternative: உமக்குப் பணிசெய்துவருகிறேன்
  rationale: இங்கு உண்மையான சட்ட அடிமைத்தன்மை பற்றிய கோட்பாடு கூறப்படவில்லை; மூத்த மகன் தன் சேவையை அடிமை உழைப்பாக உணரும் கசப்பான மனநிலையே வெளிப்படுகிறது. ‘அடிமைபோல்’ அந்த வலிமையைத் தக்கவைத்தபடியே தவறான நேரடிப் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், குடும்ப உரையாடலுக்கேற்ற மரியாதை ஒருமை வடிவங்களான ‘உமக்கு/உமது/நீர்’ பயன்படுத்தப்பட்டுள்ளன. மொழிநடை தெளிவாகவும் கண்ணியமாகவும் இருந்து, மகனின் குற்றச்சாட்டுத் தொனியைக் காக்கிறது.
