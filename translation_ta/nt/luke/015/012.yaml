source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: ta
  text: அவர்களில் இளையவன் தன் தந்தையிடம், “அப்பா, சொத்தில் எனக்குச் சேர வேண்டிய பங்கை[a] எனக்குத் தாருங்கள்” என்றான். அதற்கு அவர் தன் வாழ்வாதாரமான சொத்துகளை[b] அவர்களுக்குப் பங்கிட்டுக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சொத்தில் எனக்குரிய பகுதியை” அல்லது “எனக்குக் கிடைக்க வேண்டிய பங்கை.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “வாழ்வு/வாழ்வாதாரம்” (βίος); இங்கு அது தந்தையின் உடைமைகளையோ அவர் வாழ்வதற்கான வசதிகளையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: இளையவன்
  rationale: ஒப்பீட்டுப் பெயரடை இங்கு பெயர்ச்சொல்லாகச் செயல்பட்டு ‘இளையவன்’ என்று பொருள்படுகிறது. சூழலில் அவன் மகன் என்பது தெளிவானாலும், இந்த வசனத்தில் ‘மகன்’ வெளிப்படையாக இல்லை.
- source_word: δός μοι
  choice: எனக்குத் தாருங்கள்
  rationale: வேண்டுகோள் அல்லது கட்டளையைக் குறிக்கும் வினை வடிவத்தை, தந்தையிடம் மகன் பேசுவதற்கு இயல்பான நவீன மரியாதை நடையில் தருகிறது.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: எனக்குச் சேர வேண்டிய பங்கு
  rationale: ஒருவருக்குச் சேருவது அல்லது உரியதாக இருப்பது என்ற ἐπιβάλλον என்பதன் பொருளை இயல்பாகவும் உரிமைக் கருத்தை மிகைப்படுத்தாமலும் வெளிப்படுத்துகிறது.
- source_word: οὐσία
  choice: சொத்து
  rationale: இந்தக் குடும்பப் பங்கீட்டுச் சூழலில் உடைமைகள் அல்லது சொத்துகளைக் குறிக்கிறது; ‘சொத்து’ என்பது பொதுவாகப் புரியும் இயல்பான தமிழ்ச் சொல்.
- source_word: διεῖλεν
  choice: பங்கிட்டுக் கொடுத்தார்
  rationale: பிரித்தல் அல்லது பகிர்ந்தளித்தல் என்ற செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: கிரேக்கத்தின் பன்மை வேற்றுமைப் பொருளை நேரடியாகப் பேணுகிறது; சூழல் இரு மகன்களைக் காட்டினாலும், வசனத்தில் இல்லாத ‘இருவருக்கும்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: βίον
  choice: தன் வாழ்வாதாரத்தை
  rationale: βίος இங்கு வாழ்வதற்கான வசதிகள், உடைமைகள் அல்லது வாழ்வாதாரம் என்ற பொருளைக் கொண்டுள்ளது. ‘வாழ்வாதாரம்’ அதன் உயிர்வாழ்வுடன் தொடர்புடைய நுண்ணிய பொருளைப் பேணுகிறது.
