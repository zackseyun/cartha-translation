id: LUK.15.4
reference: Luke 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: ta
  text: “உங்களில் எந்த மனிதன் நூறு ஆடுகளை வைத்திருந்து, அவற்றில் ஒன்றை இழந்துவிட்டால், தொண்ணூற்றொன்பது ஆடுகளையும் திறந்த வெளியில்[a] விட்டுவிட்டு, அதைக் கண்டுபிடிக்கும்வரை தொலைந்துபோனதைத் தேடிச் செல்லமாட்டான்?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வனாந்தரத்தில்.” கிரேக்கச் சொல் திறந்த வெளி, மேய்ச்சல் நிலம், அல்லது மக்கள் நடமாட்டமற்ற இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: உங்களில் எந்த மனிதன்
  rationale: ஆண்பால் ஒருமையில் அமைந்துள்ள பிரதிநிதித்துவக் கேள்வியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: நூறு ஆடுகளை வைத்திருந்து
  rationale: உடைமையையும் தொடர்ச்சியான வாக்கிய ஓட்டத்தையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: அவற்றில் ஒன்றை இழந்துவிட்டால்
  rationale: ஒரு ஆடு காணாமல் போன நிகழ்வைச் சுட்டுகிறது; வேண்டுமென்றே அழித்தான் என்ற பொருளை ஏற்படுத்தாது.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: தொண்ணூற்றொன்பது ஆடுகளையும் ... விட்டுவிட்டு
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவைத் தமிழில் இயல்பாகத் தொடரச் செய்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: திறந்த வெளியில்
  rationale: மேய்ப்புச் சூழலில் திறந்த, குடியிருப்பில்லாத அல்லது பயிரிடப்படாத வெளியைக் குறிக்கக்கூடிய சொல்லின் பரப்பை வாசிக்க எளிதாக வழங்குகிறது; ‘வனாந்தரம்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: தொலைந்துபோனதை ... தேடிப் போகமாட்டான்
  rationale: தொலைந்த ஆட்டை நோக்கிச் சென்று தேடும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἕως εὕρῃ αὐτό
  choice: கண்டுபிடிக்கும்வரை
  rationale: தேடல் அந்த ஆடு கிடைக்கும் வரையில் தொடர்வதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: உவமை சார்ந்த கேள்வியில் பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: ‘எந்த மனிதன்’ என்று ஆண்பால் ஒருமையைத் தக்கவைத்தல்
  alternative: ‘யாராவது’ என்று பாலினம் குறிப்பிடாத வகையில் அமைத்தல்
  rationale: கிரேக்கத்தில் ἄνθρωπος ஆண்பால் ஒருமையில் பிரதிநிதித்துவ எடுத்துக்காட்டாக வருகிறது; அதன் வடிவைத் தக்கவைத்தாலும் கருத்து ஆண்களுக்கு மட்டுமே உரியது என்று தமிழாக்கம் கூறுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், பேச்சுவழக்காகச் சுருங்காமல் கண்ணியமான வினா நடையில் அமைக்கப்பட்டுள்ளது. எதிர்பார்க்கப்படும் ‘நிச்சயமாகத் தேடிப் போவான்’ என்ற பதிலை எதிர்மறை வினா இயல்பாக உணர்த்துகிறது.
