  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: ta
  text: நான் எழுந்து என் தந்தையிடம் போவேன்; அவரிடம், ‘அப்பா, பரலோகத்திற்கு எதிராகவும்[a] உங்கள் முன்பாகவும்[b] நான் பாவம் செய்துவிட்டேன்’ என்று சொல்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுக்கு எதிராக’; இங்கு ‘பரலோகம்’ என்பது கடவுளை மரியாதையுடன் மறைமுகமாகக் குறிப்பிடும் சொல்லாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் பார்வையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: நான் எழுந்து
  rationale: முதன்மை எதிர்கால வினைக்கு முன் நடைபெறும் முதல் செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவம். தமிழில் தொடர்வினையாக ‘எழுந்து ... போவேன்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πορεύσομαι
  choice: போவேன்
  rationale: தந்தையை நோக்கிச் செல்லும் தீர்மானத்தை எதிர்கால வினையாக நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πρὸς τὸν πατέρα μου
  choice: என் தந்தையிடம்
  rationale: πρός மற்றும் வேற்றுமை உருபு இங்கு ஒருவரிடம் சென்று சேர்வதைக் குறிக்கின்றன; தமிழில் ‘தந்தையிடம்’ என்பது இலக்கையும் பின்னர் நிகழும் உரையாடலையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐρῶ αὐτῷ
  choice: அவரிடம் ... என்று சொல்வேன்
  rationale: எதிர்காலத்தில் தந்தையிடம் நேரடியாகச் சொல்லவிருப்பதை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: Πάτερ
  choice: அப்பா
  rationale: இது நேரடி அழைப்புமுறை. ‘அப்பா’ என்பது தந்தையை மகன் இயல்பாகவும் மரியாதையுடனும் அழைக்கும் நவீனத் தமிழ் சொல்; மூலத்தில் இல்லாத ‘என்’ என்பதையும் சேர்ப்பதில்லை.
- source_word: ἥμαρτον
  choice: நான் பாவம் செய்துவிட்டேன்
  rationale: முடிந்த செயலும் அதன் தற்போதைய ஒழுக்க விளைவும் ஒப்புக்கொள்ளப்படுவதை ‘செய்துவிட்டேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν οὐρανὸν
  choice: பரலோகத்திற்கு எதிராக
  rationale: ‘பரலோகம்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, εἰς இங்கு கொண்டுள்ள எதிரான செயல் என்ற பொருளை ‘எதிராக’ தெளிவுபடுத்துகிறது.
- source_word: ἐνώπιόν σου
  choice: உங்கள் முன்னிலையில்
  rationale: ‘உங்களுக்கு முன்பாக/உங்கள் பார்வையில்’ என்ற தனித்துவமான இடநிலை மற்றும் ஒழுக்கப் பொருளைத் தக்கவைக்கிறது; முந்தைய சொற்றொடரைப் போலவே ‘உங்களுக்கு எதிராக’ என்று மாற்றி விளக்கவில்லை.
theological_decisions:
- issue: ‘பரலோகம்’ என்பதை முதன்மை உரையில் நேரடியாக ‘கடவுள்’ என்று விளக்குவதா
  choice: ‘பரலோகத்திற்கு எதிராக’ என்ற மூலச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘கடவுளுக்கு எதிராக’
  rationale: οὐρανός இங்கு கடவுளைக் குறிக்கும் மரியாதைசார் மாற்றுச் சொல்லாக இருக்க வாய்ப்புள்ளது. இருந்தாலும், மூலத்தின் உருவகத்தையும் அதன் அர்த்த அடுக்கையும் முதன்மை உரையில் பாதுகாத்து, விளக்கத்தை அடிக்குறிப்பில் தருவது பொருத்தமானது.
- issue: ἐνώπιόν σου என்பதை ‘உங்களுக்கு எதிராக’ என்று பொருளாக்குவதா
  choice: ‘உங்கள் முன்னிலையில்’ என்று தனித்த சொற்றொடராகத் தக்கவைத்தல்
  alternative: ‘உங்களுக்கு எதிராக’
  rationale: ‘உங்களுக்கு எதிராக’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும், ἐνώπιον என்பதன் ‘முன்னிலையில்/பார்வையில்’ என்ற மொழிவடிவத்தை அழித்துவிடும். மூலத்தில் உள்ள இரண்டு வேறுபட்ட சொற்றொடர்களும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், அதே நேரத்தில் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் இயல்பான ‘அப்பா’ என்பதும், தந்தையை மரியாதையுடன் குறிக்கும் ‘அவரிடம்/உங்கள்’ என்பதும் தேர்ந்தெடுக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் பொருந்தாத இடங்களில் இருந்ததால், அவை விளக்கும் கிரேக்கச் சொற்றொடர்களான ‘பரலோகம்’ மற்றும் ‘உங்கள் முன்னிலையில்’ என்பவற்றுக்குப் பின் முறையாக அமைக்கப்பட்டுள்ளன.
