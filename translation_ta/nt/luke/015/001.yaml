revisions:
- from: அவர் சொல்வதைக் கேட்பதற்காக, வரி வசூலிப்பவர்களும் பாவிகளும் எல்லாரும் அவரிடம் நெருங்கி வந்துகொண்டிருந்தார்கள்.[a]
  to: வரி வசூலிப்பவர்களும் பாவிகளுமான எல்லாரும் அவரைக் கேட்பதற்காக அவரிடம் நெருங்கி வந்துகொண்டிருந்தார்கள்.[a]
  rationale: The revision removes an unnecessary explicit reference to Jesus' speech while retaining the purposive sense of the infinitive in idiomatic Tamil. It also improves the natural expression of the inclusive ‘all,’ while preserving the ongoing aspect of the Greek periphrastic construction. The footnote remains correctly anchored and continues to present the lexical alternative without altering the verse's meaning.
