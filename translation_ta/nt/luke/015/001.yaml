  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: ta
  text: வரி வசூலிப்பவர்களும் பாவிகளுமான எல்லாரும் அவரைக் கேட்பதற்காக அவரிடம் நெருங்கி வந்துகொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரிடம் வந்துகொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் தொடரும் செயலைக் காட்டும் வடிவம் இருப்பதால், அவர்கள் தொடர்ந்து அல்லது மீண்டும் மீண்டும் அவரிடம் வந்ததை இது சுட்டிக்காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: வந்துகொண்டிருந்தார்கள்
  rationale: Ἦσαν என்பதுடன் நிகழ்காலப் பெயரெச்சம் சேர்ந்த சுற்றுவழிக் கட்டமைப்பு, கடந்த காலத்தில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கிறது. δέ-யின் மெலிந்த உரையாடல் இணைப்பைத் தமிழில் தனிச் சொல்லாகச் சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: αὐτῷ ἐγγίζοντες
  choice: அவரிடம் நெருங்கி வந்துகொண்டிருந்தார்கள்
  rationale: ἐγγίζω என்பதின் ‘நெருங்குதல்’ என்ற பொருளையும், தொடர்ச்சியான அல்லது மீள்மீள் அணுகுதலைக் காட்டும் வினையம்சத்தையும் இந்தச் சொற்றொடர் தக்கவைக்கிறது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: வரி வசூலிப்பவர்களும் பாவிகளும் ஆகிய இரு குழுக்களையும் உள்ளடக்கும் முழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ τελῶναι
  choice: வரி வசூலிப்பவர்கள்
  rationale: ரோம ஆட்சிச் சூழலில் வரி அல்லது அரச வருவாய் வசூலித்தவர்களைக் குறிக்கும் தெளிவான, பொதுவாகப் புரியும் நவீன தமிழ்ச் சொற்றொடர்.
- source_word: οἱ ἁμαρτωλοὶ
  choice: பாவிகள்
  rationale: சமூக-சமயச் சூழலில் பாவிகளாகக் கருதப்பட்டவர்களைக் குறிக்கும் மூலத்தின் நேரடியான வகைப்பாட்டை விளக்கச் சேர்க்கையின்றித் தக்கவைக்கிறது.
- source_word: ἀκούειν αὐτοῦ
  choice: அவர் சொல்வதைக் கேட்பதற்காக
  rationale: இறுதிநிலை வினைச்சொல் நோக்கத்தைக் குறிக்கிறது. தமிழில் வெறும் ‘அவரைக் கேட்க’ என்பது கீழ்ப்படிதல் என்ற பொருளையும் தரக்கூடும்; எனவே அவருடைய பேச்சைக் கேட்கும் நோக்கத்தை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘வரி வசூலிப்பவர்களும் பாவிகளும்’ என்ற இணையின் சமூக-சமய வலிமை
  choice: மூலத்தில் உள்ள இரு வகைப்பாடுகளும் விளக்க விரிவாக்கமின்றித் தக்கவைக்கப்பட்டன.
  alternative: ‘வரி வசூலிப்பவர்களும் சமூகத்தால் ஒதுக்கப்பட்ட மற்றவர்களும்’ அல்லது ‘வரி வசூலிப்பவர்களும் பெயர்பெற்ற பாவிகளும்’
  rationale: கிரேக்க உரை இரண்டு அறியப்பட்ட குழுக்களை மட்டும் பெயரிடுகிறது. கூடுதல் சமூக அல்லது ஒழுக்க விளக்கம் கதையின் பதற்றத்தை முன்கூட்டியே தீர்த்து, மூலத்தைவிட அதிகமான பொருளைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘நெருங்கி வந்துகொண்டிருந்தார்கள்’ என்பது சற்றுக் குறியீட்டான மூலச் சொல்லையும் அதன் தொடர்ச்சியான வினையம்சத்தையும் காக்கிறது.
