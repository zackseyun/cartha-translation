source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: ta
  text: 'அவ்வாறே[a], நான் உங்களுக்குச் சொல்கிறேன்: மனந்திரும்புகிற ஒரே ஒரு பாவியைக் குறித்து, கடவுளுடைய தூதர்களுக்கு முன்பாக[b] மகிழ்ச்சி உண்டாகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்படியே” அல்லது “இவ்விதமாக.”
    reason: lexical_alternative
  - marker: b
    text: “கடவுளுடைய தூதர்களுக்கு முன்பாக” என்பது அவர்களுடைய முன்னிலையில் என்று பொருள்படலாம். தூதர்களே மகிழ்கிறார்கள் என்று கிரேக்க வாசகம் வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய உவமையின் நிகழ்வை இவ்வசனத்தின் பயன்பாட்டுடன் ஒப்பிடுகிறது; ‘அவ்வாறே’ இயல்பாகவும் ஒப்புமை வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி அழைப்பையும் வலியுறுத்தும் உரைமாற்றத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γίνεται χαρά
  choice: மகிழ்ச்சி உண்டாகிறது
  rationale: மகிழ்ச்சி நிகழ்வதை அல்லது தோன்றுவதை γίνομαι குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் நிகழ்வுணர்வைத் தக்கவைத்தும் உள்ளது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: ஒருவரின் முன்னிலையில் அல்லது பார்வைக்கு முன் என்ற இடவியல்/உறவியல் பொருளைத் தக்கவைக்கிறது; மகிழ்வோரைக் குறிப்பாகத் தூதர்களாக மாற்றவில்லை.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: கடவுளுடைய தூதர்கள்
  rationale: உடைமைத் தொடர்பைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்; ‘தூதர்கள்’ என்பது ἄγγελοι என்பதன் நேரடியான வேதாகமப் பயன்பாடு.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: ஒரே ஒரு பாவியைக் குறித்து
  rationale: ἐπί + வேற்றுமை இங்கு மகிழ்ச்சிக்கான காரணம் அல்லது பொருளைக் குறிக்கிறது; ‘குறித்து’ என்பது அந்த உறவைத் தெளிவாகக் காட்டுகிறது, ‘ஒரே ஒரு’ ἑνί என்பதன் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: μετανοοῦντι
  choice: மனந்திரும்புகிற
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் செயற்பாட்டைத் தக்கவைத்து, தமிழில் நிலைபெற்ற வேதாகமச் சொல்லால் கருத்தை தேவையின்றி விரிவாக்காமல் தருகிறது.
theological_decisions:
- issue: மனந்திரும்புதல் மொழியின் பொருள்
  choice: ‘மனந்திரும்புகிற’ என்று மொழிபெயர்த்து, இவ்வசனத்திலேயே இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
  alternative: ‘மனதை மாற்றிக்கொள்கிற’ அல்லது ‘திரும்பி வருகிற’
  rationale: μετανοοῦντι என்பதன் பரந்த வேதாகமப் பொருளை ‘மனந்திரும்புகிற’ தக்கவைக்கிறது; அதை வெறும் மனமாற்றமாகவோ குறிப்பிட்ட வகை திரும்புதலாகவோ சுருக்கவில்லை.
- issue: மகிழ்ச்சியின் இடம் அல்லது செய்பவர்
  choice: ‘கடவுளுடைய தூதர்களுக்கு முன்பாக மகிழ்ச்சி உண்டாகிறது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளுடைய தூதர்கள் மகிழ்கிறார்கள்’ அல்லது ‘கடவுளுடைய தூதர்களிடையே மகிழ்ச்சி உண்டாகிறது’
  rationale: கிரேக்கம் மகிழ்ச்சி தூதர்களுக்கு ‘முன்பாக’ உண்டாகிறது என்று கூறுகிறது; தூதர்களே மகிழ்ச்சியின் செய்பவர்கள் என வெளிப்படையாகக் கூறவில்லை. எனவே மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவ்வாறே’, ‘மனந்திரும்புகிற’, ‘பாவி’, ‘கடவுளுடைய தூதர்கள்’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் நிலைபெற்ற சொற்கள். கிரேக்கச் சொல் வரிசையை மரப்போலப் பின்பற்றாமல், மகிழ்ச்சியின் செய்பவர் குறித்த தெளிவின்மையை மட்டும் கவனமாகப் பாதுகாக்கிறது.
