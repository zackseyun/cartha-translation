revisions:
- from: இனி உங்கள் மகன் என்று அழைக்கப்படுவதற்கு நான் தகுதியுள்ளவன் அல்ல. உங்கள் கூலியாட்களில் ஒருவனைப் போல[a] என்னை ஆக்குங்கள்.
  to: இனி உங்கள் மகன் என்று அழைக்கப்படுவதற்கு நான் தகுதியானவன் அல்ல. உங்கள் கூலித் தொழிலாளர்களில் ஒருவனைப் போல[a] என்னை ஆக்குங்கள்.
  rationale: The revision makes limited stylistic and lexical improvements for natural modern standard Tamil. It preserves the Greek temporal negation, filial status language, passive designation, imperative request, comparative force, and the distinction between paid workers and household slaves.
