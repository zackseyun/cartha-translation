source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: ta
  text: இனி உங்கள் மகன் என்று அழைக்கப்படுவதற்கு நான் தகுதியானவன் அல்ல. உங்கள் கூலித் தொழிலாளர்களில் ஒருவனைப் போல[a] என்னை ஆக்குங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் ஊதியம் பெறும் பணியாளர்களில் ஒருவனைப் போல.’ கிரேக்கச் சொல் வீட்டு அடிமைகளை அல்ல, கூலி பெறும் பணியாளர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: இனி … அல்ல
  rationale: முன்பு இருந்த நிலை இப்போது மாறிவிட்டது என்பதைக் காட்டும் கால மறுப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄξιος
  choice: தகுதியுள்ளவன்
  rationale: ஒரு நிலை அல்லது மரியாதையைப் பெறத் தகுந்தவன் என்ற ஒழுக்க மற்றும் சமூகப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: κληθῆναι
  choice: அழைக்கப்படுவதற்கு
  rationale: செயப்பாட்டு வினையெச்சத்தின் வடிவத்தையும், ஒருவனாகக் குறிப்பிடப்படுதல் அல்லது கருதப்படுதல் என்ற பொருளையும் காக்கிறது.
- source_word: υἱός
  choice: மகன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் தந்தை–மகன் உறவைத் தெளிவாகக் குறிப்பிடுவதால் பாலினப் பொதுமைப்படுத்தல் செய்யப்படவில்லை.
- source_word: ποίησόν
  choice: என்னை ஆக்குங்கள்
  rationale: புதிய, தாழ்ந்த நிலைக்கு தன்னை மாற்றும்படி மகன் வேண்டுவதைக் கட்டளை வடிவில் நேரடியாகத் தெரிவிக்கிறது; ‘நடத்துங்கள்’ என்பது அதிக விளக்கவுரையாகிவிடும்.
- source_word: ὡς
  choice: ஒருவனைப் போல
  rationale: முழு அடையாளப்படுத்தலைவிட ஒப்பீட்டு நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἕνα τῶν μισθίων σου
  choice: உங்கள் கூலியாட்களில் ஒருவன்
  rationale: μίσθιος என்பது வீட்டு அடிமையை அல்ல, கூலி பெறும் பணியாளரைக் குறிக்கிறது. ‘கூலியாள்’ என்பது இந்த பொருளைச் சுருக்கமாகவும் பொதுமக்களுக்கு புரியும் வகையிலும் தருகிறது.
theological_decisions:
- issue: மகனின் அறிக்கையிலுள்ள தகுதி மற்றும் உறவுநிலை மொழி
  choice: ‘தகுதியுள்ளவன்’ மற்றும் ‘மகன்’ என்பவற்றை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: ‘உங்கள் பிள்ளை என்று அழைக்கப்படுவதற்கு இனி எனக்குத் தகுதியில்லை’
  rationale: இவ்வசனம் பொதுவான வெட்க உணர்வை மட்டும் அல்லாமல், மகனுக்குரிய உறவுநிலைக்கும் மரியாதைக்கும் தான் தகுதியற்றவன் என்று அவன் கருதுவதை வெளிப்படுத்துகிறது. ‘மகன்’ மற்றும் ‘தகுதியுள்ளவன்’ என்ற சொற்கள் இதன் உறவு மற்றும் சமூகப் பரிமாணங்களைத் தக்கவைக்கின்றன; அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவைத் திணிப்பதில்லை.
translation_notes:
  register: மரியாதையான நேரடி உரையாடலுக்குப் பொருத்தமாக ‘உங்கள்’, ‘ஆக்குங்கள்’ என்ற நவீன நிலையான தமிழ் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதாகவும் வைக்கப்பட்டுள்ளது.
