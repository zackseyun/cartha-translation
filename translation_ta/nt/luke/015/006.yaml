id: LUK.15.6
reference: Luke 15:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: ta
  text: அவர் வீட்டுக்குள் வந்ததும்[a], தம் நண்பர்களையும் அக்கம்பக்கத்தாரையும் ஒன்றாக அழைத்து, அவர்களிடம், ‘என்னோடு சேர்ந்து மகிழுங்கள்[b]; ஏனெனில் காணாமற்போயிருந்த என் ஆட்டைக் கண்டுபிடித்துவிட்டேன்[c]’ என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீட்டுக்கு வந்ததும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கில் சொல்லுக்கு நெருக்கமாக, ‘வீட்டுக்குள் வந்ததும்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘என்னோடு சேர்ந்து கொண்டாடுங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கட்டளை ஒருவருடன் சேர்ந்து மகிழ்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘என் காணாமற்போன ஆட்டைக் கண்டுபிடித்துவிட்டேன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கில் சொல்லுக்கு நெருக்கமாக, ‘காணாமற்போயிருந்த என் ஆடு’ என்ற கருத்து உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: அவர் வீட்டுக்குள் வந்ததும்
  rationale: இறந்தகாலப் பங்கேற்பு முதன்மைச் செயலுக்கு முன் நிகழும் காலத் தொடர்பைக் குறிக்கிறது; ‘வீட்டுக்குள்’ என்பது εἰς τὸν οἶκον என்பதன் இயக்கத்தையும் இலக்கையும் காக்கிறது.
- source_word: συγκαλεῖ
  choice: ஒன்றாக அழைத்து
  rationale: பலரை ஒருங்கே அழைப்பதைக் குறிக்கும் வினை; தமிழில் இயல்பான தொடராகவும் கொண்டாட்டச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: தம் நண்பர்களையும் அக்கம்பக்கத்தாரையும்
  rationale: φίλους என்பதற்கு ‘நண்பர்கள்’ நேரடியான இணை; γείτονας சமூகச் சூழலில் அருகில் வசிப்பவர்களைக் குறிப்பதால் ‘அக்கம்பக்கத்தார்’ இயல்பான தமிழ்.
- source_word: Συγχάρητέ μοι
  choice: என்னோடு சேர்ந்து மகிழுங்கள்
  rationale: சொல்பவருடன் மகிழ்ச்சியைப் பகிர்ந்துகொள்ளுமாறு கூறும் பன்மை கட்டளையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὅτι εὗρον
  choice: ஏனெனில் ... கண்டுபிடித்துவிட்டேன்
  rationale: ὅτι காரணத்தை அறிமுகப்படுத்துகிறது; εὗρον முடிந்த கண்டுபிடிப்பின் தற்போதைய விளைவைத் தமிழின் ‘விட்டேன்’ வடிவம் இயல்பாக உணர்த்துகிறது.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: காணாமற்போயிருந்த என் ஆடு
  rationale: ‘என் ஆடு, காணாமற்போயிருந்தது’ என்ற பெயர்ச்சொல்–பங்கேற்பு அமைப்பின் பொருளைக் காத்து, தமிழில் இயல்பான பெயரடைத் தொடராக வழங்குகிறது; உவமையை விளக்கவுரையாக மாற்றவில்லை.
theological_decisions:
- issue: மீட்கப்பட்ட ஆட்டின் உவமைப் படிமம்
  choice: காணாமற்போயிருந்த என் ஆடு
  alternative: என் காணாமற்போன ஆடு; தொலைந்துபோயிருந்த என் ஆடு
  rationale: வசனம் கூறும் ஆட்டின் நேரடியான படிமத்தை மட்டும் காக்கிறது; பாவிகள் அல்லது இரட்சிப்பு பற்றிய விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை. நிறைநிலைப் பங்கேற்பு முன்பு காணாமற்போய் இருந்த நிலையையும் இப்போது கண்டுபிடிக்கப்பட்ட மாற்றத்தையும் உணர்த்துகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதையான, எளிதில் புரியும் நடை. உவமையின் எளிய வாய்மொழித் தன்மையைப் பேணியபடி, ‘தம்’ மூலம் எழுவாயுடனான உடைமையுறவு தெளிவாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
