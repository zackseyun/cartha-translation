  naturalness: “வேலைக்காரர்களில் ஒருவனைத் தன்னிடம் அழைத்து ... விசாரித்தான்” என்பது நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. வாக்கிய அமைப்பு தெளிவாக உள்ளது.
  terminology: “வேலைக்காரர்கள்” இச்சூழலில் παῖδες என்பதற்குப் பொருத்தமானது; ‘பிள்ளைகள்’ என்ற தவறான புரிதலைத் தவிர்க்கிறது. “விசாரித்தான்” ἐπυνθάνετο என்பதன் தகவல் அறியும் கேள்வி அர்த்தத்தைச் சரியாக வழங்குகிறது.
