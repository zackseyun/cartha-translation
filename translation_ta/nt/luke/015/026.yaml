  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: ta
  text: வேலைக்காரர்களில் ஒருவனைத் தன்னிடம் அழைத்து, இவையெல்லாம் என்னவாக இருக்கும் என்று விசாரித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதற்கு என்ன பொருள்?” கிரேக்கத்தில் இன்னும் நேரடியாக, “இவையெல்லாம் என்னவாக இருக்கும்?” என்று உள்ளது.
    reason: τί ἂν εἴη ταῦτα என்ற சொற்றொடரை பொருள் விளக்கும் விதமாகத் தமிழாக்குவதற்கான இயல்பான மாற்றைச் சுட்டிக்காட்டுகிறது; மூலத்தின் பன்மை வடிவத்தையும் சாத்திய நுணுக்கத்தையும் முதன்மை உரை காக்கிறது.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தன்னிடம் அழைத்து
  rationale: இந்த இறந்தகால இடைநிலை வினையெச்சம், அவன் ஒருவனைத் தன்னிடம் அழைத்த பிறகு விசாரித்தான் என்ற செயல்களின் வரிசையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παίδων
  choice: வேலைக்காரர்களில்
  rationale: παῖς என்பதற்கு ‘பிள்ளை’ அல்லது ‘வேலைக்காரன்’ எனப் பொருள் இருக்கலாம். ஆனால் இந்த வீட்டுச் சூழலில் கொண்டாட்டத்தைப் பற்றி விளக்கம் கேட்க அழைக்கப்படுபவர் வேலைக்காரர் என்பதே பொருத்தமானது.
- source_word: ἐπυνθάνετο
  choice: விசாரித்தான்
  rationale: πυνθάνομαι என்பது தகவல் அறியக் கேட்டலைக் குறிக்கிறது. முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்நிலை இங்கு முன்னிலைப்படுத்தப்படாததால், ‘விசாரித்தான்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τί ἂν εἴη ταῦτα
  choice: இவையெல்லாம் என்னவாக இருக்கும்
  rationale: சாத்திய அல்லது ஊக நுணுக்கமுள்ள மறைமுகக் கேள்வியை இது காக்கிறது; அதேவேளை ταῦτα என்பதன் பன்மையையும் ‘இவையெல்லாம்’ என்று வெளிப்படுத்துகிறது.
