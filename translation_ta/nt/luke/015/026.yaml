  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன்னிடம் அழைத்து’ என்பது பங்கேற்பு வினையின் உறவுநிலையைத் தெளிவாக்குகிறது; ‘இவையெல்லாம் என்னவாக இருக்கும்’ என்பது கிரேக்கத்தின் திட்டமிடப்படாத கேள்வி நுணுக்கத்தைக் காக்கிறது.
