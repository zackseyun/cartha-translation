  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: ta
  text: ஆனால் தந்தை தன் அடிமைகளிடம்[a], ‘விரைவாகச் சிறந்த அங்கியைக் கொண்டுவந்து[b] அவனுக்கு உடுத்துங்கள்; அவன் கையில் ஒரு மோதிரத்தையும்[c], அவன் கால்களில் செருப்புகளையும் அணிவியுங்கள்’ என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமைகள்’ என்பதற்குப் பதிலாக ‘வேலைக்காரர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் (δούλους) வீட்டுடன் பிணைக்கப்பட்ட அடிமைப் பணியாளர்களைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘முதல் அங்கி’; இச்சூழலில் ‘சிறந்த அங்கி’ அல்லது ‘முதன்மையான அங்கி’ என்பது பொருளாக இருக்கலாம்.'
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க உரை ‘ஒரு மோதிரம்’ என்று மட்டுமே கூறுகிறது. சிலர் இதை மீண்டும் அளிக்கப்பட்ட நிலையையோ அதிகாரத்தையோ குறிக்கும் முத்திரை மோதிரமாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: அடிமைகள்
  rationale: வீட்டுடன் பிணைக்கப்பட்ட அடிமைப் பணியாளர்கள் என்ற அக்காலச் சமூக நிலையை மறைக்காமல் காட்டுகிறது; ‘வேலைக்காரர்கள்’ என்பது அந்த நிலையை மென்மையாக்கிவிடலாம்.
- source_word: Ταχὺ
  choice: விரைவாக
  rationale: உடனடியாகச் செயல்படும்படி தகப்பன் கூறும் அவசரத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξενέγκατε
  choice: கொண்டுவந்து
  rationale: வீட்டிற்குள் அல்லது சேமிப்பிடத்தில் இருந்த அங்கியை வெளியே எடுத்து வருவதைக் குறிக்கும் சூழல்சார் இயல்பான தமிழ்.
- source_word: στολὴν τὴν πρώτην
  choice: சிறந்த அங்கி
  rationale: πρώτην என்பதன் சொற்பொருள் ‘முதல்’ என்றாலும், இச்சூழலில் தரத்திலோ முதன்மையிலோ சிறந்த அங்கியைக் குறிப்பதாகத் தெரிகிறது; அந்தச் சாத்தியமான மொழிவழக்குப் பொருளைத் தருகிறது.
- source_word: ἐνδύσατε αὐτόν
  choice: இவனுக்கு உடுத்துங்கள்
  rationale: முன்னரே குறிப்பிடப்பட்ட அங்கியை அவனுக்கு அணிவிக்கும் செயலை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: δακτύλιον
  choice: ஒரு மோதிரம்
  rationale: கிரேக்கச் சொல் மோதிரம் என்று மட்டுமே கூறுகிறது; முத்திரை மோதிரம் என்ற விளக்கத்தை மூலவசனத்தில் சேர்க்கவில்லை.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: இவன் கையில்
  rationale: அணிகலனை ஒருவரது கையில் அணிவிப்பதைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ὑποδήματα
  choice: மிதியடிகள்
  rationale: பண்டைய மத்தியதரைக் கடல் உலகில் பயன்படுத்தப்பட்ட காலணிவகையை ‘காலணிகள்’ என்பதைவிடத் துல்லியமாகக் காட்டுகிறது.
- source_word: εἰς τοὺς πόδας
  choice: கால்களில்
  rationale: காலணியை அணிவிக்கும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: மகனின் பேச்சிலிருந்து தகப்பனின் உடனடி நடவடிக்கைக்கு வரும் மென்மையான முரண்பாட்டுத் திருப்பத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: δούλους என்பதை ‘அடிமைகள்’ என்றா ‘வேலைக்காரர்கள்’ என்றா மொழிபெயர்ப்பது
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள்
  rationale: உவமையின் வீட்டுச் சூழலில் இருந்த பிணைக்கப்பட்ட சமூக நிலையைக் ‘அடிமைகள்’ தெளிவாகப் பாதுகாக்கிறது; இதனால் வசனத்திற்கு அப்பாற்பட்ட இறையியல் கருத்து சேர்க்கப்படவில்லை.
- issue: στολὴν τὴν πρώτην என்பதில் πρώτην என்பதை ‘முதல்’ என்றா ‘சிறந்த’ என்றா தருவது
  choice: சிறந்த அங்கி
  alternative: முதல் அங்கி / முதன்மையான அங்கி
  rationale: இங்கு வரிசையில் முதலாவதைவிட தரத்திலும் நிலையிலும் முதன்மையான அங்கியைக் குறிக்கும் வாய்ப்பு அதிகம். ‘சிறந்த’ என்பது குறியீட்டு இறையியல் பொருளைச் சேர்க்காமல் மொழிவழக்குப் பொருளைத் தருகிறது.
- issue: δακτύλιον என்பதை ‘மோதிரம்’ என்றா ‘முத்திரை மோதிரம்’ என்றா விரிவாக்குவது
  choice: ஒரு மோதிரம்
  alternative: ஒரு முத்திரை மோதிரம்
  rationale: மோதிரம் மீட்டுக்கொள்ளப்பட்ட மகன் நிலை அல்லது அதிகாரத்தைக் குறிக்கலாம்; ஆயினும் கிரேக்கச் சொல் முத்திரை மோதிரம் என்று குறிப்பாகச் சொல்லாததால் அந்த விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தகப்பன்’ கதைச்சூழலின் உறவுமுறையைத் தெளிவாகக் காட்டுகிறது; கட்டளைகளுக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ‘அவன்’ என்றாலும் நேரடி உரையாடலில் இயல்பாக ‘இவன்’ பயன்படுத்தப்பட்டுள்ளது.
