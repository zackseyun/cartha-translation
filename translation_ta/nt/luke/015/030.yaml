reference: Luke 15:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: ta
  text: “ஆனால், விபச்சாரிகளோடு சேர்ந்து உங்கள் சொத்தை விழுங்கித் தீர்த்த[a] உங்கள் இந்த மகன் வந்தபோது, அவனுக்காகக் கொழுத்த கன்றை வெட்டினீர்களே!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் வாழ்வாதாரத்தைத் தின்று தீர்த்த.” கிரேக்க வினைச்சொல் ‘விழுங்குதல்’ என்ற வலுவான உருவகத்தைக் கொண்டது; பெயர்ச்சொல் வாழ்வாதாரம், உடைமை, அல்லது சொத்து ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால் ... வந்தபோது
  rationale: ὅτε என்பதன் காலப் பொருளையும், δέ தரும் மிதமான முரண்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ υἱός σου οὗτος
  choice: உங்கள் இந்த மகன்
  rationale: οὗτος என்பதன் சுட்டும் வலிமையையும், ‘என் சகோதரன்’ என்று சொல்லாமல் மூத்த மகன் காட்டும் உணர்ச்சிபூர்வமான விலகலையும் காக்கிறது.
- source_word: ὁ καταφαγών
  choice: விழுங்கித் தீர்த்த
  rationale: ‘தின்று தீர்த்தல்/விழுங்குதல்’ என்ற வலுவான உருவகத்தை மென்மையாக்காமல், தமிழில் இயல்பாகவும் குற்றஞ்சாட்டும் தொனியுடனும் தருகிறது.
- source_word: σου τὸν βίον
  choice: உங்கள் சொத்தை
  rationale: இங்கு βίος உயிரைக் குறிக்காமல் வாழ்வாதாரமாகிய உடைமை அல்லது சொத்தைக் குறிக்கிறது; சூழலில் ‘சொத்து’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: μετὰ πορνῶν
  choice: விபச்சாரிகளோடு சேர்ந்து
  rationale: πόρνη என்பதன் நேரடியான பொருளைத் தெளிவாகக் காக்கிறது; மூத்த மகனின் குற்றச்சாட்டை மென்மையாக்கவில்லை.
- source_word: ἦλθεν
  choice: வந்தபோது
  rationale: கிரேக்கம் ‘வந்தான்’ என்று மட்டுமே கூறுகிறது; சூழல் திரும்பிவந்ததைக் காட்டினாலும், மொழிபெயர்ப்பில் அந்த விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἔθυσας
  choice: அடித்தீர்கள்
  rationale: விருந்துக்காக விலங்கைக் கொன்று ஆயத்தப்படுத்துவதைத் தமிழில் இயல்பாகக் குறிக்கிறது; வழிபாட்டுப் பலி என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: τὸν σιτευτὸν μόσχον
  choice: கொழுத்த கன்றை
  rationale: விருந்துக்காகச் சிறப்பாகக் கொழுக்கவைக்கப்பட்ட கன்றைக் குறிக்கும் இயல்பான, மரபறிந்த தமிழ் சொற்றொடர்.
- source_word: αὐτῷ
  choice: அவனுக்காக
  rationale: கன்று அவனுடைய வருகையை முன்னிட்டு, அவனுக்காக அடிக்கப்பட்டது என்ற பயனாளி சார்ந்த தத்தியைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: விபச்சாரிகளோடு சொத்தை அழித்தான் என்ற கூற்றை உறுதிப்படுத்தப்பட்ட உண்மையாகவா அல்லது மூத்த மகனின் குற்றச்சாட்டாகவா காட்டுவது
  choice: மூத்த மகனின் நேரடிப் பேச்சில் உள்ள குற்றச்சாட்டை எந்தத் தகுதிப்படுத்தலும் இன்றி அப்படியே வைத்தல்
  alternative: ‘விபச்சாரிகளோடு சேர்ந்து உங்கள் சொத்தை அழித்ததாகச் சொல்லப்படும்’ என்று சந்தேகக் குறிப்பு சேர்த்தல்
  rationale: கிரேக்க உரை இதை மூத்த மகனின் குற்றச்சாட்டாகவே நேரடியாக முன்வைக்கிறது; கதைசொல்லியின் தனிப்பட்ட உறுதிப்படுத்தலாக மாற்றாமலும் ‘கூறப்படுகிற’ போன்ற சேர்க்கையால் பலவீனப்படுத்தாமலும் இருப்பது கதையின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், தந்தையிடம் பேசும் மரியாதைப் பன்மையான ‘உங்கள்/அடித்தீர்கள்’ பயன்படுத்தப்பட்டுள்ளது. இறுதியிலுள்ள ‘அடித்தீர்களே’ மூத்த மகனின் குற்றஞ்சாட்டும், மனக்கசப்பான தொனியை இயல்பாக வெளிப்படுத்துகிறது.
