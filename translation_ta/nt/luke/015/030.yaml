  terminology: ‘சொத்தை விழுங்கித் தீர்த்த’ effectively renders the vivid καταφαγών with βίος in context. ‘விபச்சாரிகளோடு’ is direct and understandable for πόρναι. ‘கொழுத்த கன்று’ is established and suitable for σιτευτὸς μόσχος.
