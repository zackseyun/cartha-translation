  verdict: revise
  source_fidelity: The draft accurately preserves the temporal-contrastive opening, the older brother's distancing phrase ('your this son'), the forceful metaphor of καταφαγών, the accusation involving prostitutes, the unembellished 'came,' and the beneficiary 'for him.' The accusation remains the older brother's direct speech rather than being recast as narrator-confirmed fact.
