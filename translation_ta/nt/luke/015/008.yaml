id: LUK.15.8
reference: Luke 15:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: ta
  text: அல்லது, பத்து திராக்மா நாணயங்களை வைத்திருக்கும் எந்தப் பெண்ணாவது, ஒரு திராக்மா நாணயத்தை[a] தொலைத்தால், விளக்கை ஏற்றி, வீட்டைப் பெருக்கி, அதைக் கண்டுபிடிக்கும்வரை கவனமாக[b] தேடாமல் இருப்பாளா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: திராக்மா என்பது கிரேக்க வெள்ளி நாணயம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அக்கறையுடன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: அல்லது
  rationale: முந்தைய உவமைக்கு இணையான அடுத்த எடுத்துக்காட்டை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τίς γυνὴ
  choice: எந்தப் பெண்
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘உங்களில்’ என்பதைச் சேர்க்கவில்லை.
- source_word: δραχμὰς / δραχμὴν
  choice: திராக்மா நாணயங்களை / திராக்மா நாணயத்தை
  rationale: பொதுவான ‘நாணயம்’ என்று மட்டும் மாற்றாமல் வரலாற்றுக்குரிய குறிப்பிட்ட நாணயப் பெயரைப் பாதுகாக்கிறது; ‘நாணயம்’ என்ற வகைப்பெயர் வாசகருக்கு உடனடி தெளிவைத் தருகிறது.
- source_word: ἐὰν ἀπολέσῃ
  choice: தொலைத்துவிட்டால்
  rationale: பொதுவான நிபந்தனைச் சூழலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: οὐχὶ
  choice: தேட மாட்டாள்?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாற்றலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἅπτει λύχνον
  choice: விளக்கை ஏற்றி
  rationale: விளக்கைக் கொளுத்துதல் என்ற செயலின் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: σαροῖ τὴν οἰκίαν
  choice: வீட்டைப் பெருக்கி
  rationale: வீட்டுக்குள் காணாமல் போன நாணயத்தைத் தேடும் நடைமுறைச் செயலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ζητεῖ ἐπιμελῶς
  choice: கவனமாகத் தேட
  rationale: ἐπιμελῶς என்பதிலுள்ள கவனமான, விடாமுயற்சியுள்ள தேடலின் பொருளை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: ἕως οὗ εὕρῃ
  choice: அதைக் கண்டுபிடிக்கும்வரை
  rationale: தேடலின் முடிவெல்லையைக் காட்டுகிறது; சூழலிலிருந்து தெளிவாகும் நாணயத்தை ‘அதை’ என வெளிப்படையாகக் குறிப்பிடுகிறது.
