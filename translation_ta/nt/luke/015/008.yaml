translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்றுச் சிறப்புடைய ‘திராக்மா’ பெயர் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. கிரேக்கத்தின் உடன்பாடான பதிலை எதிர்பார்க்கும் எதிர்மறை வினா தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
