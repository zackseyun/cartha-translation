base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: ta
  text: ஆனால் மகன் அவரிடம், “அப்பா, பரலோகத்துக்கு எதிராகவும்[a] உங்கள் முன்னிலையிலும் நான் பாவம் செய்துவிட்டேன். இனி உங்கள் மகன் என்று அழைக்கப்படுவதற்கு நான் தகுதியானவன் அல்ல” என்றான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரலோகத்துக்கு எதிராக’ என்ற கிரேக்கச் சொற்றொடரில், ‘பரலோகம்’ என்பது கடவுளைக் குறிப்பிடும் மரியாதை சார்ந்த மறைமுகச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. சில மொழிபெயர்ப்புகள் இதை விளக்கமாக ‘கடவுளுக்கு எதிராக’ என்று வழங்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், 19ஆம் வசனத்துடன் ஒத்தவாறு, ‘உங்கள் கூலியாட்களில் ஒருவனாக என்னை வைத்துக்கொள்ளுங்கள்’ என்பதற்கு இணையான சொற்கள் மகனுடைய உரையின் தொடர்ச்சியாக உள்ளன. SBLGNT உரை ‘உங்கள் மகன்’ என்பதோடு இவ்வாக்கியத்தை முடிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: ஆனால் ... என்றான்
  rationale: δέ ஒரு மென்மையான இணைப்புச்சொல்; தந்தையின் முந்தைய செயலுக்குப் பின்வரும் மகனின் உரையை ‘ஆனால்’ இயல்பாக இணைக்கிறது. தமிழில் மேற்கோளுக்குப் பின் ‘என்றான்’ என்பது இயல்பான சொல்வரிசை.
- source_word: ὁ υἱὸς αὐτῷ
  choice: மகன் அவரிடம்
  rationale: ὁ υἱός என்பதை ‘மகன்’ என்றும் αὐτῷ என்பதைத் தெளிவை அதிகமாக விளக்காமல் ‘அவரிடம்’ என்றும் நேரடியாக வழங்குகிறது.
- source_word: Πάτερ
  choice: அப்பா
  rationale: தந்தையை நேரடியாக அழைக்கும் இயல்பான, மரியாதையுள்ள நவீனத் தமிழ் வடிவம்; கிரேக்கத்தில் இல்லாத ‘என்’ சேர்க்கப்படவில்லை.
- source_word: ἥμαρτον
  choice: நான் பாவம் செய்துவிட்டேன்
  rationale: முடிந்த செயலும் அதன் தற்போதைய குற்றவுணர்வும் வெளிப்படும் ஒப்புதல் மொழியாக நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: εἰς τὸν οὐρανὸν
  choice: பரலோகத்துக்கு எதிராக
  rationale: கிரேக்கத்தின் ‘பரலோகத்துக்கு எதிராக’ என்ற மறைமுக இறைக் குறிப்பை விளக்கமாக ‘கடவுளுக்கு எதிராக’ என்று மாற்றாமல் பாதுகாக்கிறது.
- source_word: καὶ ἐνώπιόν σου
  choice: உங்கள் முன்னிலையிலும்
  rationale: ἐνώπιον என்பதன் ‘முன்னிலையில், கண்முன்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘உங்களுக்கு எதிராக’ என்று விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: οὐκέτι
  choice: இனி ... அல்ல
  rationale: தற்போதிலிருந்து அந்த நிலை இல்லை என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄξιος
  choice: தகுதியானவன்
  rationale: மனந்திரும்பும் சூழலில் உள்ள ஒழுக்க மற்றும் உறவுசார் தகுதியின்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κληθῆναι
  choice: என்று அழைக்கப்படுவதற்கு
  rationale: καλέω என்ற வினையின் செயப்பாட்டு infinitive பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: υἱός σου
  choice: உங்கள் மகன்
  rationale: மகன் தாம் இனி தாங்கத் தகுதியற்றவர் எனக் கருதும் குடும்ப உறவுப் பெயரைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ஒப்புதலில் ‘பரலோகம்’ என்பதன் பொருள்
  choice: கடவுளுக்கு எதிரான பாவத்தைக் குறிக்கும் மரியாதை சார்ந்த மறைமுகக் குறிப்பாகப் புரிந்துகொண்டு, ‘பரலோகத்துக்கு எதிராக’ என்றே மொழிபெயர்த்தல்
  alternative: விளக்கமாக ‘கடவுளுக்கு எதிராக’ என்று மொழிபெயர்த்தல்
  rationale: மூல கிரேக்கம் ‘பரலோகம்’ என்றே கூறுகிறது. அதன் இறையியல் குறிப்பை அடிக்குறிப்பில் விளக்கி, மூலத்தின் சொல் வடிவத்தையும் உண்மையான மறைமுகத்தன்மையையும் முதன்மை உரையில் பாதுகாக்கிறது.
- issue: இந்த வசனத்தில் மகனுடைய உரை முடியும் இடம்
  choice: SBLGNT உரையைப் பின்பற்றி ‘உங்கள் மகன்’ என்பதோடு உரையை முடித்தல்
  alternative: ‘உங்கள் கூலியாட்களில் ஒருவனாக என்னை வைத்துக்கொள்ளுங்கள்’ என்ற நீண்ட வாசகத்தையும் சேர்த்தல்
  rationale: வழங்கப்பட்ட மூல உரை இங்கேயே மகனின் கூற்றை முடிக்கிறது. நீண்ட வாசகம் சில கையெழுத்துப் பிரதிகளில் இருப்பதால், அதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. தந்தையை நோக்கிய உரையில் ‘உங்கள்’ என்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது; பழமையான ‘உமது/உமக்கு’ வடிவங்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் ‘பரலோகம்’ மற்றும் ‘உங்கள் முன்னிலையில்’ ஆகிய தனித்துவமான வெளிப்பாடுகள் விளக்கிப் பரப்பாமல் பாதுகாக்கப்பட்டுள்ளன.
