lexical_decisions:
- source_word: Εἶπεν
  choice: அவர் சொன்னார்
  rationale: λέγω என்பதன் இறந்தகால வடிவம் இயேசுவின் உரையில் அடுத்த பகுதியை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாக ‘சொன்னார்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δέ
  choice: பின்பு
  rationale: δέ இங்கு எதிர்மறை முரண்பாட்டை வலியுறுத்தாமல் உரையின் தொடர்ச்சியையோ மாற்றத்தையோ குறிக்கிறது; ‘பின்பு’ அந்த நகர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἄνθρωπός τις
  choice: ஒரு மனிதர்
  rationale: τις அடையாளம் குறிப்பிடப்படாத ஒருவரை அறிமுகப்படுத்துகிறது. தமிழின் ‘ஒரு மனிதர்’ என்பது அந்தக் குறிப்பின்மையை இயல்பாகத் தக்கவைக்கிறது; ‘குறிப்பிட்ட ஒரு மனிதர்’ என்பது தேவையற்ற அளவு குறிப்புத்தன்மையை உணர்த்தக்கூடும்.
- source_word: εἶχεν
  choice: இருந்தார்கள்
  rationale: ἔχω என்பதன் imperfect வடிவம் உவமையின் பின்னணிச் சூழலைக் கூறுகிறது. உடைமையைத் தமிழில் இயல்பாகக் காட்ட ‘ஒரு மனிதருக்கு ... இருந்தார்கள்’ என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: δύο
  choice: இரண்டு
  rationale: எண்ணிக்கையை நேரடியாகவும் துல்லியமாகவும் தருகிறது.
- source_word: υἱούς
  choice: மகன்கள்
  rationale: υἱούς என்பது பாலினம் தெளிவாக ‘மகன்கள்’ என்பதைக் குறிக்கிறது; ‘பிள்ளைகள்’ என்ற பொதுச் சொல்லால் அந்த விவரம் மங்கிவிடும்.
theological_decisions:
- issue: Ἄνθρωπός τις என்பதன் குறிப்பின்மை மற்றும் ஓரளவு தனிப்படுத்தும் வலிமை
  choice: ஒரு மனிதர்
  alternative: குறிப்பிட்ட ஒரு மனிதர்
  rationale: கிரேக்க τις ஓர் அடையாளம் கூறப்படாத உவமைக் கதாபாத்திரத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஒரு மனிதர்’ அதைப் பேச்சுவழக்கிற்கு இறக்காமல் இயல்பாக வெளிப்படுத்துகிறது; கூடுதல் உருவக அல்லது இறையியல் அடையாளத்தைப் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உவமைத் தொடக்கமாக அமைக்கப்பட்டுள்ளது. ‘மனிதர்’ மற்றும் ‘மகன்கள்’ என்பவை மரியாதை ஒருமையுடன் பொருந்துவதால் வினைச்சொல் ‘இருந்தார்கள்’ என வருகிறது.
