id: LUK.15.7
reference: Luke 15:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: ta
  text: 'நான் உங்களுக்குச் சொல்கிறேன்: அவ்வாறே[a], மனந்திரும்புகிற ஒரே ஒரு பாவியைக் குறித்து பரலோகத்தில் உண்டாகும் மகிழ்ச்சி, மனந்திரும்புதல் தேவையில்லாத தொண்ணூற்றொன்பது நீதிமான்களைக்[b] குறித்து உண்டாகும் மகிழ்ச்சியைவிட அதிகமாயிருக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவ்வாறே’ அல்லது ‘அப்படியே’ என்றும் மொழிபெயர்க்கலாம். இச்சொல் பரலோக மகிழ்ச்சியை முந்தைய உவமையின் கருத்துடன் இணைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: மூலத்தில் ‘நீதிமான்கள்’ என்றே உள்ளது. சூழலில் இதை நேரடியான பொருளிலோ கேலிக்குறிப்பாகவோ வாசிக்கலாம்; மொழிபெயர்ப்பு எந்த விளக்கத்தையும் முடிவாகத் தேர்ந்தெடுக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான அழைப்பையும் உறுதியான அறிவிப்பையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய உவமையில் விவரிக்கப்பட்ட மகிழ்ச்சிக்கும் பரலோக மகிழ்ச்சிக்கும் உள்ள தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: பரலோகத்தில் உண்டாகும் மகிழ்ச்சி ... அதிகமாயிருக்கும்
  rationale: எதிர்காலப் பொருளையும் பரலோகம் என்ற இடத்தையும் காக்கிறது; ἢ உருவாக்கும் ஒப்பீட்டை இயல்பான தமிழ்ச் சொற்றொடரில் வெளிப்படுத்த வாக்கியம் மறுசீரமைக்கப்பட்டுள்ளது.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: ஒரே ஒரு பாவியைக் குறித்து
  rationale: மகிழ்ச்சிக்கான காரணம் அல்லது நிகழ்வுப் பொருளை இங்கு ἐπί குறிக்கிறது; ‘குறித்து’ என்பது அதனை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: μετανοοῦντι
  choice: மனந்திரும்புகிற
  rationale: நிகழ்காலச் செயப்பெயரெச்சத்தின் செயற்பாட்டுப் பொருளை இயல்பாகத் தக்கவைக்கிறது; தமிழ் வேதாகம மொழிநடையில் புரிந்துகொள்ளக்கூடிய நிலையான சொல்.
- source_word: ἢ
  choice: …விட அதிகமாயிருக்கும்
  rationale: இரு தரப்புகளுக்கிடையிலான ஒப்பீட்டைத் தமிழில் தெளிவாகக் காட்டுகிறது. ‘அதிகம்’ என்பது கிரேக்க ஒப்பீட்டுக் கட்டமைப்பில் மறைமுகமாக உள்ள பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: தொண்ணூற்றொன்பது நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட δικαίοις என்பதைக் ‘நீதிமான்கள்’ என்று நேரடியாகவும் சமயப் பொருளைத் தீர்மானிக்காமலும் மொழிபெயர்க்கிறது.
- source_word: οὐ χρείαν ἔχουσιν μετανοίας
  choice: மனந்திரும்புதல் தேவையில்லாத
  rationale: μετανοίας என்பதை வெளிப்படையாகக் குறிப்பிட்டு, மூலத்தின் பெயர்ச்சொல் அமைப்பைச் சுருக்கமான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நீதிமான்கள்’ என்பது உண்மையிலேயே நீதியுள்ளவர்களைக் குறிக்கிறதா, அல்லது தங்களை நீதிமான்கள் எனக் கருதுவோரைக் கேலிக்குறிப்பாகக் குறிக்கிறதா?
  choice: மூலத்தில் உள்ளபடியே ‘நீதிமான்கள்’ என்று மொழிபெயர்த்து, பொருளை உரையிலேயே தீர்மானிக்காமல் விடுதல்.
  alternative: ‘தங்களை நீதிமான்கள் என்று நினைக்கிறவர்கள்’ என விளக்கமாக மொழிபெயர்த்தல்.
  rationale: δικαίοις என்பதில் கேலிக்குறிப்பு வெளிப்படையாகக் குறிக்கப்படவில்லை. லூக்காவின் விரிந்த சூழல் அத்தகைய வாசிப்பை அனுமதிக்கலாம்; ஆனால் மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்த்து விடக்கூடாது.
- issue: ‘பரலோகத்தில் மகிழ்ச்சி’ என்பதில் மகிழ்கிறவர்கள் யார்?
  choice: மகிழ்ச்சியின் இடத்தை மட்டும் ‘பரலோகத்தில்’ என்று குறிப்பிடுதல்.
  alternative: ‘தேவனுக்கு மகிழ்ச்சி’ அல்லது ‘பரலோகத் தூதர்களிடையே மகிழ்ச்சி’ என்று மகிழ்கிறவர்களைச் சேர்த்தல்.
  rationale: இவ்வசனம் மகிழ்ச்சியின் இருப்பிடத்தைச் சொல்கிறது; அதன் செய்பவர்களாக தேவனையோ தூதர்களையோ வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தில் இல்லாத செய்பவர் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மனந்திரும்புதல்,’ ‘பாவி,’ ‘நீதிமான்,’ ‘பரலோகம்’ ஆகிய பரவலாக அறியப்பட்ட இறையியல் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அதேவேளை வாக்கிய அமைப்பு இயல்பான தமிழ் ஒப்பீட்டு வடிவில் அமைக்கப்பட்டுள்ளது.
