translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சார்ந்துகொண்டான்’ சார்பின் நுணுக்கத்தை வெளிப்படுத்துகிறது; மூலச்சொல்லின் நேரடியான இணைதல் அல்லது ஒட்டிக்கொள்ளுதல் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘அவர்/தமது/அனுப்பினார்’ என்பவை குடிமகனைக் குறிக்கவும், ‘அவன்/அவனை’ என்பவை இளைய மகனைக் குறிக்கவும் பயன்படுத்தப்பட்டு சுட்டுப்பெயர் குழப்பம் குறைக்கப்பட்டுள்ளது.
