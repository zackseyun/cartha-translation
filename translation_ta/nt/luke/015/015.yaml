source:
  edition: SBLGNT
  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: ta
  text: அவன் போய், அந்த நாட்டுக் குடிமக்களில் ஒருவரைச் சார்ந்துகொண்டான்[a]. அவர் அவனைத் தமது வயல்களுக்குப் பன்றிகளை மேய்க்க அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னை இணைத்துக்கொண்டான்,” “ஒட்டிக்கொண்டான்.” கிரேக்க வினைச்சொல், ஒருவரோடு நெருக்கமாக இணைந்து அவரைச் சார்ந்துகொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: போய்
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன் நடந்த நகர்வைக் காட்டுகிறது; ‘போய்’ என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: ἐκολλήθη
  choice: சார்ந்துகொண்டான்
  rationale: κολλάομαι என்பதில் ஒருவரோடு நெருக்கமாக இணைந்துகொள்வதும் அவரைச் சார்ந்திருப்பதும் அடங்கும். இச்சூழலில் ‘சார்ந்துகொண்டான்’ அந்தச் சார்புநிலையை இயல்பாக வெளிப்படுத்துகிறது; சொல்லின் ஒட்டிக்கொள்ளும் உருவகத்தைக் குறிப்பு பாதுகாக்கிறது.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: குடிமக்களில் ஒருவரை
  rationale: πολίτης ஓர் அரசியல் அல்லது சமூகப் பகுதியைச் சேர்ந்த குடிமகனைக் குறிக்கிறது. ‘குடிமக்களில் ஒருவர்’ மூலத்தின் துல்லியத்தைத் தக்கவைக்கிறது.
- source_word: τῆς χώρας ἐκείνης
  choice: அந்த நாட்டுக்
  rationale: χώρα என்பது நாடு, நிலப்பகுதி, பிரதேசம் எனப் பொருள்படலாம். முந்தைய கதையோட்டத்தில் வரும் தொலைநாட்டுடன் ஒத்திசைவதால் ‘அந்த நாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἔπεμψεν
  choice: அனுப்பினார்
  rationale: πέμπω என்பதன் நேரடிப் பொருள் ‘அனுப்பு’. அண்மையில் குறிப்பிடப்பட்ட குடிமகனே எழுவாய்; மரியாதை ஒருமை தமிழ் உரையில் இயல்பாக உள்ளது.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: தமது வயல்களுக்கு
  rationale: ἀγρός என்பது வயல் அல்லது வேளாண்மை நிலம்; பன்மையைப் பாதுகாக்க ‘வயல்களுக்கு’ என மொழிபெயர்க்கப்பட்டது. ‘தமது’ என்பது அனுப்பிய குடிமகனுடைய வயல்கள் என்ற தொடர்பைத் தெளிவாக்குகிறது.
- source_word: βόσκειν
  choice: மேய்க்க
  rationale: βόσκω கால்நடைகளை உணவூட்டுதல் அல்லது மேய்த்தல் எனப் பொருள்படும். வயல்களுக்குச் சென்று பன்றிகளைப் பராமரிக்கும் சூழலில் ‘மேய்க்க’ இயல்பானது.
- source_word: χοίρους
  choice: பன்றிகளை
  rationale: χοῖρος என்பதன் எளிய நவீனத் தமிழ் இணை ‘பன்றி’; பன்மை மற்றும் வேற்றுமை உருபு பாதுகாக்கப்பட்டுள்ளன.
