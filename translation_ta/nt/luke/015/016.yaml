  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: ta
  text: பன்றிகள் தின்றுகொண்டிருந்த கரோப் நெற்றுகளால்[a] தன் வயிற்றை நிரப்ப அவன் ஏங்கினான்; யாரும் அவனுக்கு எதையும் கொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கரோபுக் காய்களால்’; கிரேக்கச் சொல் கரோப் மரத்தின் நெற்றுகளைச் சிறப்பாகக் குறிக்கிறது; அவை பொதுவாகக் கால்நடைத் தீவனமாகப் பயன்படுத்தப்பட்டன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: ஏங்கினான்
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ந்து நிலவிய தீவிர ஆசையைச் சுட்டுகிறது; ‘ஏங்கினான்’ பசியால் ஏற்பட்ட வலுவான விருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: தன் வயிற்றை நிரப்ப
  rationale: கிரேக்கத்தின் உடல்சார்ந்த, நேரடியான படிமத்தை நவீன தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἀπὸ τῶν κερατίων
  choice: கரோபுக் காய்களால்
  rationale: ἀπό இங்கு எதைக் கொண்டு வயிற்றை நிரப்ப விரும்பினான் என்பதைக் குறிக்கிறது; தமிழில் ‘-ஆல்’ இயல்பான கருவிப்பொருளைத் தருகிறது.
- source_word: κερατίων
  choice: கரோபுக் காய்கள்
  rationale: இச்சொல் கரோப் மரத்தின் நீண்ட நெற்றுகளைக் குறிப்பாகக் குறிக்கிறது. ‘கரோபுக் காய்கள்’ தாவரத்தை அடையாளப்படுத்துவதோடு பொதுவாசகருக்கும் புரியக்கூடிய வடிவமாக உள்ளது.
- source_word: οἱ χοῖροι
  choice: பன்றிகள்
  rationale: நவீன நிலையான தமிழில் இயல்பான, தெளிவான சமமான சொல்.
- source_word: ἤσθιον
  choice: தின்றுகொண்டிருந்த
  rationale: முற்றுப்பெறாத இறந்தகாலத்தின் நடந்துகொண்டிருந்த செயலைத் தமிழில் வெளிப்படுத்துகிறது; விலங்குகளின் உண்பதற்கு ‘தின்று’ இயல்பானது.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: ஒருவரும் அவனுக்கு எதையும் கொடுக்கவில்லை
  rationale: கிரேக்கத்தில் கொடுக்கப்பட்ட பொருள் வெளிப்படையாக இல்லாவிட்டாலும் தமிழில் ‘எதையும்’ சேர்ப்பது மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது. தொடர்ச்சியான மறுப்பைத் தனியே மிகைப்படுத்தாமல் சூழல் உணர்த்துகிறது.
