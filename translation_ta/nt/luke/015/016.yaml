  to: பன்றிகள் தின்றுகொண்டிருந்த கரோப் நெற்றுகளால்[a] தன் வயிற்றை நிரப்ப அவன் ஏங்கினான்; யாரும் அவனுக்கு எதையும் கொடுக்கவில்லை.
