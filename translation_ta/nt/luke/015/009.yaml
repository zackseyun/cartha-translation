source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: ta
  text: அதைக் கண்டுபிடித்ததும், அவள் தன் தோழிகளையும் அண்டை வீட்டுப் பெண்களையும் ஒன்றுகூட அழைத்து, ‘என்னோடு மகிழுங்கள்; ஏனெனில், நான் தொலைத்த திராக்மாவைக்[a] கண்டுபிடித்தேன்’ என்று சொல்கிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: திராக்மா என்பது ஒரு கிரேக்க வெள்ளி நாணயம்; பல சூழல்களில் அது ஒரு கூலித் தொழிலாளியின் ஏறக்குறைய ஒருநாள் கூலிக்குச் சமமானது.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: அதைக் கண்டுபிடித்ததும்
  rationale: பெண்பால் ஒருமை இறந்தகால வினையெச்சம் நிகழ்வுகளின் வரிசையைக் காட்டுகிறது; பொருள் சூழலிலுள்ள தொலைந்த நாணயத்தைக் குறிக்கும் என்பதால் ‘அதை’ சேர்க்கப்பட்டது.
- source_word: συγκαλεῖ
  choice: அழைத்து
  rationale: ஒருவரிடம் மற்றவர்களை ஒன்றுகூட அழைப்பது என்ற கூட்டுவினையின் பொருளை இயல்பான தமிழில் தருகிறது; நிகழ்காலக் கதைநடையின் தொடர்ச்சி ‘சொல்கிறாள்’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: φίλας
  choice: தன் தோழிகளையும்
  rationale: மூலத்தின் பெண்பால் பன்மையைத் தெளிவாகக் காக்க ‘தோழிகள்’ பயன்படுத்தப்பட்டது.
- source_word: γείτονας
  choice: அக்கம்பக்கத்துப் பெண்களையும்
  rationale: இச்சொல் தனியாகப் பொதுப்பாலாக இருக்கக்கூடும்; ஆனால் பெண்பால் கட்டுரையாலும் ‘தோழிகள்’ என்பதுடனான இணைப்பாலும் இங்கு பெண்களைக் குறிப்பது வெளிப்படுகிறது.
- source_word: Συγχάρητέ μοι
  choice: என்னோடு மகிழுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும், ஒருவரின் மகிழ்ச்சியில் மற்றவர்கள் பங்குகொள்வதையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: ;
  rationale: மகிழ்வதற்கான காரணத்தை தமிழில் முதலில் கூறி, பின்னர் அழைப்பை வைப்பது இயல்பான நேரடி உரையாகும்; அரைப்புள்ளி இரு கூறுகளின் காரணத் தொடர்பைத் தெளிவாக இணைக்கிறது.
- source_word: εὗρον
  choice: கண்டுபிடித்துவிட்டேன்
  rationale: தேடப்பட்ட பொருள் கிடைத்த நிறைவை நேரடி உரையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δραχμὴν
  choice: திராக்மாவை
  rationale: குறிப்பிட்ட கிரேக்க நாணயத்தின் பெயர் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டு, அதன் பண்பாட்டு மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἣν ἀπώλεσα
  choice: நான் தொலைத்த
  rationale: உறவுநிலைத் தொடரைச் சுருக்கமான தமிழ்ப் பெயரெச்சத் தொடராக வழங்கி, நாணயத்தைத் தொலைத்தவள் பேசுகிற பெண்ணே என்பதையும் காக்கிறது.
