id: LUK.15.14
reference: Luke 15:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: ta
  text: ஆனால் அவன் எல்லாவற்றையும் செலவழித்த பின்பு, அந்த நாடெங்கும்[a] கடுமையான பஞ்சம் ஏற்பட்டது; அவன் தேவையில் இருக்கத் தொடங்கினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பகுதி முழுவதும்’ அல்லது ‘அந்த நாட்டில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனுக்குக் குறைவு ஏற்படத் தொடங்கியது’ அல்லது ‘அவன் வறுமைப்படத் தொடங்கினான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: அவன் எல்லாவற்றையும் செலவழித்த பின்பு
  rationale: இறந்தகால வினையெச்சத்துடன் அமைந்த தனிநிலை வேற்றுமைத்தொடர், முதன்மை நிகழ்வுக்கு முந்திய காலத்தைச் சுட்டுகிறது. δαπανάω என்பதற்கு நேரான ‘செலவழித்த’ என்பதைத் தேர்ந்தெடுத்தது; ‘வீணடித்த’ என்பது இந்தச் சொல்லிலேயே வெளிப்படையாக இல்லாத மதிப்பீட்டைச் சேர்க்கும்.
- source_word: δέ
  choice: ஆனால்
  rationale: கதையில் செல்வநிலையிலிருந்து நெருக்கடிக்குத் திரும்பும் முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ἐγένετο
  choice: ஏற்பட்டது
  rationale: λιμός என்பதோடு சேர்ந்து பஞ்சம் உண்டானதையோ தொடங்கியதையோ குறிக்கிறது; நவீன தமிழில் ‘ஏற்பட்டது’ இயல்பானது.
- source_word: λιμὸς ἰσχυρά
  choice: கடுமையான பஞ்சம்
  rationale: ἰσχυρά இங்கு பஞ்சத்தின் தீவிரத்தை வலுப்படுத்துகிறது; ‘கடுமையான’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: அந்த நாடெங்கும்
  rationale: κατά + accusative ஓர் இடம் முழுவதும் பரவிய நிலையைக் குறிக்கலாம். ‘நாடெங்கும்’ என்பது பஞ்சத்தின் பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: அவனும் பற்றாக்குறையை அனுபவிக்கத் தொடங்கினான்
  rationale: ἤρξατο தொடக்கநிலையையும், ὑστερεῖσθαι தேவையானவை இல்லாத குறைநிலையையும் குறிக்கிறது. ‘பற்றாக்குறையை அனுபவிக்க’ என்பது நவீன தமிழில் இயல்பாக இருந்து, மூலத்தின் பொருளை மிகைப்படுத்தாமல் தருகிறது.
