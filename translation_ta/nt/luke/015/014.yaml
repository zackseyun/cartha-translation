translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வீணடித்தான்’ போன்ற சூழலிலிருந்து ஊகிக்கப்படும் மதிப்பீட்டுச் சொல்லைத் தவிர்த்து, மூலச்சொல்லின் நடுநிலைத்தன்மை காக்கப்பட்டுள்ளது.
