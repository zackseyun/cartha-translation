  to: ஆனால் அவன் எல்லாவற்றையும் செலவழித்த பின்பு, அந்த நாடெங்கும்[a] கடுமையான பஞ்சம் ஏற்பட்டது; அவன் தேவையில் இருக்கத் தொடங்கினான்.[b]
