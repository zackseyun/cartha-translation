source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: ta
  text: சில நாட்கள் கழித்து[a], இளைய மகன் எல்லாவற்றையும் ஒன்று திரட்டிக்கொண்டு, தொலைதூர நாட்டுக்குப் புறப்பட்டுப் போனான். அங்கே பொறுப்பற்ற விதத்தில் வாழ்ந்து[c], தன் சொத்தையெல்லாம் வீணடித்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “பல நாட்கள் ஆகாதபின்.”'
    reason: lexical_alternative
  - marker: b
    text: “தன் உடைமையையெல்லாம்” அல்லது “தன் செல்வத்தையெல்லாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வீணான முறையில் வாழ்ந்து” என்றும் மொழிபெயர்க்கலாம். இங்கு குறிப்பிட்ட பாவங்கள் எவையும் சொல்லப்படவில்லை; கட்டுப்பாடற்ற, பொறுப்பற்ற வாழ்க்கை முறையே குறிப்பிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: சில நாட்கள் கழித்து
  rationale: கிரேக்கத்தின் சொல்லுக்குச் சொல் வடிவம் ‘பல நாட்கள் ஆகாதபோது’ என்பதாக இருந்தாலும், அதன் பொருளை இயல்பான நவீன தமிழில் ‘சில நாட்கள் கழித்து’ என்று தருகிறது; நேர இடைவெளி குறுகியது என்பதையும் காக்கிறது.
- source_word: συναγαγὼν πάντα
  choice: எல்லாவற்றையும் ஒன்று திரட்டிக்கொண்டு
  rationale: புறப்படுவதற்கு முன்பு அவன் தனக்குரிய அனைத்தையும் ஒன்றாகச் சேர்த்த செயலைப் பங்கேற்புவினை குறிக்கிறது. அவற்றை விற்றுப் பணமாக்கினான் என்று மூலவசனம் வெளிப்படையாகச் சொல்லாததால் அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: ὁ νεώτερος υἱός
  choice: இளைய மகன்
  rationale: கதைச் சூழலில் ஒப்பீட்டு உரிச்சொல்லின் இயல்பான, தெளிவான தமிழ் வடிவம்.
- source_word: ἀπεδήμησεν
  choice: புறப்பட்டுப் போனான்
  rationale: சொந்த இடத்தைவிட்டு வேறொரு, தொலைவான இடத்துக்குச் சென்றதை இயல்பாகத் தெரிவிக்கிறது; ‘வெளிநாட்டுக்குச் சென்றான்’ என χώραν என்பதைக் குறுகலாக வரையறுக்கவில்லை.
- source_word: εἰς χώραν μακράν
  choice: தொலைதூர நாட்டுக்கு
  rationale: χώρα என்பதன் நிலப்பகுதி/நாடு என்ற பரப்பையும் μακράν என்பதன் தொலைவையும் வாசிக்க எளிய தமிழில் காக்கிறது.
- source_word: διεσκόρπισεν
  choice: வீணடித்தான்
  rationale: அடிப்படையில் ‘சிதறடித்தான்’ என்ற பொருள் இருந்தாலும், சொத்தைப் பற்றிய இச்சூழலில் வளங்களைப் பொறுப்பின்றிச் செலவழித்து அழித்துவிட்டான் என்ற வழக்குப் பொருளை ‘வீணடித்தான்’ துல்லியமாகத் தருகிறது.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: தன் சொத்தையெல்லாம்
  rationale: οὐσία இங்கே அவனுக்குச் சொந்தமான உடைமை அல்லது செல்வத்தைத் தொகுதியாகக் குறிக்கிறது. ‘சொத்து’ என்பது பரந்ததும் இயல்பானதும்; πάντα மற்றும் நிகழ்வுச் சூழலோடு ‘எல்லாம்’ நன்றாகப் பொருந்துகிறது.
- source_word: ζῶν ἀσώτως
  choice: பொறுப்பற்ற விதத்தில் வாழ்ந்து
  rationale: அவன் சொத்தை எவ்வாறு வீணடித்தான் என்பதைக் குறிக்கும் பங்கேற்புவினைத் தொடரை காக்கிறது. ‘பொறுப்பற்ற’ என்பது கட்டுப்பாடற்ற, வீணான வாழ்வை உணர்த்துகிறது; வசனத்தில் குறிப்பிடப்படாத குறிப்பிட்ட பாலியல் அல்லது வேறு பாவங்களைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἀσώτως என்பதன் ஒழுக்கவியல் பரப்பு
  choice: பொறுப்பற்ற விதத்தில் வாழ்ந்து
  alternative: காமவெறி வாழ்க்கை வாழ்ந்து / கேளிக்கைகளில் மூழ்கி வாழ்ந்து
  rationale: இவ்வசனம் குறிப்பிட்ட பாவங்களைக் கூறாமல், கட்டுப்பாடற்றதும் வளங்களை வீணாக்குவதுமான வாழ்க்கை முறையை மட்டுமே குறிக்கிறது. ஆகவே பின்னர் கதாபாத்திரம் கூறும் குற்றச்சாட்டையோ குறிப்பிட்ட பாரம்பரிய விளக்கத்தையோ இங்கே முன்கூட்டியே புகுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதையான கதைநடைத் தொனியிலும் அமைக்கப்பட்டது. ‘புறப்பட்டுப் போனான்,’ ‘ஒன்று திரட்டிக்கொண்டு’ போன்ற வடிவங்கள் மூலத்தின் செயல்வரிசையைத் தெளிவாகக் காக்கின்றன. சமயமரபுச் சார்ந்த மிகக் குறுகிய விளக்கச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
