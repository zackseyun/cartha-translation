  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: ta
  text: பரிசேயர்களும் மறைநூல் அறிஞர்களும், “இந்த மனிதன் பாவிகளை வரவேற்று, அவர்களோடு சேர்ந்து சாப்பிடுகிறான்” என்று முணுமுணுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: முணுமுணுத்துக்கொண்டே
  rationale: இச்சொல்லின் குறைகூறும் முணுமுணுப்பு நுணுக்கத்தையும், இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வடிவத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: பரிசேயர்களும் மறைநூல் அறிஞர்களும்
  rationale: τε ... καί இணைப்பு இரு குழுக்களையும் சேர்த்துக் காட்டுகிறது; தமிழின் இணைப்பு ‘-உம் ... -உம்’ அதை இயல்பாகப் பாதுகாக்கிறது. γραμματεῖς என்பது இச்சூழலில் மறைநூலில் தேர்ச்சி பெற்ற சமய அறிஞர்களைக் குறிக்கிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: முதன்மை வினையோடு ஒரே நேரத்தில் நிகழும் பேச்சைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் தருகிறது.
- source_word: Οὗτος
  choice: இந்த மனிதன்
  rationale: சுட்டுப்பெயரின் சற்றே இகழ்ச்சியான அல்லது விலகிய தொனியை ‘அவன்’ என்பதைக் காட்டிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἁμαρτωλοὺς
  choice: பாவிகளை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இப்பெயரடை, சமூக-சமய அடையாளமிடுதலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: προσδέχεται
  choice: வரவேற்று
  rationale: ஒருவரைச் சாதகமாக ஏற்றுக்கொள்வது என்ற பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது; வெறும் ‘ஏற்றுக்கொள்கிறான்’ என்பதில் ஏற்படக்கூடிய கருத்தியல் நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: συνεσθίει αὐτοῖς
  choice: அவர்களோடு சேர்ந்து சாப்பிடுகிறானே
  rationale: கூடி உண்பதையும் அதிலுள்ள பந்தி உறவின் சமூக முக்கியத்துவத்தையும் நேரடியாகக் காட்டுகிறது. இறுதி ‘-னே’ குற்றச்சாட்டின் வலியுறுத்தலை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: பாவிகளுடன் இயேசு கொண்ட உறவின் சமூக மற்றும் இறையியல் தாக்கம்
  choice: பாவிகளை வரவேற்று அவர்களோடு சேர்ந்து சாப்பிடுவதாகிய குற்றச்சாட்டை எந்த மென்மைப்படுத்தலும் இல்லாமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: பாவிகளை ஏற்றுக்கொண்டு அவர்களோடு உண்கிறான்
  rationale: கிரேக்க உரை பாவிகள் என அடையாளமிடப்பட்டவர்களை வரவேற்பதையும் அவர்களுடன் பந்தியில் பங்கேற்பதையும் குற்றச்சாட்டின் மையமாக்குகிறது. மொழிபெயர்ப்பு அந்த இடறலைப் பாதுகாக்கிறது; உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘மறைநூல் அறிஞர்கள்’ என்பது γραμματεῖς என்பதன் வரலாற்றுச் சமயப் பணியை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது. இவ்வரைவில் அடிக்குறிப்புகள் தேவையில்லை.
