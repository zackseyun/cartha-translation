  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: ta
  text: அதைக்[a] கண்டுபிடித்ததும், மகிழ்ந்தபடி அதைத் தன் தோள்களின்மேல் வைக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய சூழலில் கூறப்பட்ட காணாமற்போன ஆடு.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: கண்டுபிடித்ததும்
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது. மறைமுகமாக உள்ள செயப்படுபொருள், முந்தைய வசனத்தில் கூறப்பட்ட காணாமற்போன ஆட்டைச் சுட்டும் ‘அதை’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐπιτίθησιν
  choice: வைத்துக்கொள்கிறான்
  rationale: நிகழ்கால முதன்மைச் செயலை இயல்பாகக் காட்டுகிறது; தோள்கள்மேல் ஆட்டை ஏற்றிவைக்கும் மேய்ப்பனின் செயலும் தெளிவாகிறது.
- source_word: ἐπὶ τοὺς ὤμους
  choice: தோள்கள்மேல்
  rationale: ἐπί உடன் வரும் வேற்றுமை, ஒன்றைத் தோள்களின்மேல் ஏற்றிவைப்பதைக் குறிக்கிறது; பன்மையான ὤμους என்பதையும் ‘தோள்கள்’ காக்கிறது.
- source_word: αὐτοῦ
  choice: தன்
  rationale: இது ஆட்டின் தோள்களை அல்ல, செயலைச் செய்யும் மேய்ப்பனின் சொந்தத் தோள்களைச் சுட்டுவதால் தமிழின் இயல்பான தற்சுட்டுப் பெயரடையான ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: χαίρων
  choice: மகிழ்ந்தபடி
  rationale: முதன்மைச் செயலுடன் நிகழும் மகிழ்ச்சியை நிகழ்காலச் செயப்பாட்டு எச்சத்தின் துணைநிகழ்வு சார்புடன் காக்கிறது.
theological_decisions:
- issue: கிரேக்கத்தில் மறைமுகமாக உள்ள செயப்படுபொருளை வெளிப்படுத்துதல்
  choice: ‘அதை’ என்று சேர்த்து, காணாமற்போன ஆட்டைச் சுட்டுதல்
  alternative: செயப்படுபொருளைச் சொல்லாமல் ‘கண்டுபிடித்ததும்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் சூழலால் தெளிவாகும் செயப்படுபொருள் விடப்பட்டுள்ளது. தமிழிலும் சில இடங்களில் அதை விட முடிந்தாலும், இங்கு ‘அதை’ என்பது முந்தைய சூழலோடு தெளிவான தொடர்பை ஏற்படுத்துகிறது; எந்தத் தத்துவ விளக்கத்தையும் புதிதாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘தன் தோள்கள்மேல்’ என்பது உரிமைத் தொடர்பையும் இயக்கத்தின் இலக்கையும் இயல்பாக வெளிப்படுத்துகிறது; ‘மகிழ்ந்தபடி’ மூலத்தின் துணைநிகழ்வு நுணுக்கத்தைக் காக்கிறது.
