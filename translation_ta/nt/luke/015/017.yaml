translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தந்தையைப் பற்றிய நேர்கூற்றில் இயல்பான ‘என் தந்தை’ பயன்படுத்தப்பட்டுள்ளது; கூலிப் பணியாளர்களுக்கும் அடிமைகளுக்கும் உள்ள சொற்பொருள் வேறுபாடு காக்கப்பட்டுள்ளது.
