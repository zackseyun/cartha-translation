- from: ஆனால் அவன் தன்னுணர்வுக்கு வந்தபோது[a], ‘என் தந்தையின் கூலித் தொழிலாளர்கள் எத்தனையோ பேருக்கு தேவைக்கு அதிகமாக அப்பம் இருக்கிறது[b]; நானோ இங்கே பசியால் அழிந்துகொண்டிருக்கிறேனே!’ என்றான்.
  to: ஆனால் அவன் தன்னுணர்வுக்கு வந்தபோது[a], ‘என் தந்தையின் கூலித் தொழிலாளர்கள் எத்தனை பேருக்கு அப்பம் தேவைக்கு அதிகமாக இருக்கிறது! நானோ இங்கே பசியால் அழிந்துகொண்டிருக்கிறேனே!’ என்றான்.
  rationale: The wording is revised so that the rhetorical question concerns the number of hired workers while “தேவைக்கு அதிகமாக” clearly qualifies their bread supply. Footnote b is anchored after “அப்பம்” to correspond to the alternative rendering for περισσεύονται ἄρτων. The remaining wording and meaning are retained.
