  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: ta
  text: ஆனால் அவன் தன்னுணர்வுக்கு வந்தபோது[a], ‘என் தந்தையின் கூலித் தொழிலாளர்கள் எத்தனை பேருக்கு அப்பம் தேவைக்கு அதிகமாக இருக்கிறது! நானோ இங்கே பசியால் அழிந்துகொண்டிருக்கிறேனே!’ என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புத்தி தெளிந்தபோது.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “தன்னிடமே வந்தபோது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: தன்னுணர்வுக்கு வந்தபோது
  rationale: தெளிவான சுயவிழிப்புக்கும் நிலைமையை உணர்தலுக்கும் திரும்பியதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் உருவகத்தை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: ἔφη
  choice: என்றான்
  rationale: இறந்தகாலக் கதைநடையில் வரும் aorist வினையை இயல்பான தமிழ் நேர்கூற்றின் முடிவில் எளிய இறந்தகாலமாகத் தருகிறது.
- source_word: μίσθιοι
  choice: கூலித் தொழிலாளர்கள்
  rationale: வீட்டு அடிமைகளை அல்ல, கூலி பெறும் பணியாளர்களைக் குறிக்கிறது; இந்த வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: περισσεύονται ἄρτων
  choice: தேவைக்கு அதிகமாக அப்பம் இருக்கிறது
  rationale: அப்பம் மிகுதியாகவும் மீதிப்படும் அளவிலும் இருப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄρτων
  choice: அப்பம்
  rationale: பொதுவாக ‘உணவு’ என்று விரிவாக்காமல் மூலத்தின் குறிப்பிட்ட சொல்லைப் பாதுகாக்கிறது.
- source_word: λιμῷ
  choice: பசியால்
  rationale: இங்கு பஞ்சம் என்ற பரந்த சூழலைவிட பசி அல்லது பட்டினியால் ஏற்படும் நிலையே குறிக்கப்படுகிறது; காரணப்பொருளை இயல்பாகத் தருகிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: தந்தையின் தொழிலாளர்களின் நிலைக்கு எதிராக மகன் இருக்கும் தற்போதைய துயர்நிலையைச் சுட்டுகிறது.
- source_word: ἀπόλλυμαι
  choice: அழிந்துகொண்டிருக்கிறேன்
  rationale: நடந்துகொண்டிருக்கும் அழிவு அல்லது உயிரிழக்கும் அபாயத்தைப் பாதுகாக்கிறது; ‘இறந்துகொண்டிருக்கிறேன்’ என்று பொருளை தேவையின்றி குறுக்கவில்லை.
