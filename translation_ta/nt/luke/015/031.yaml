source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: ta
  text: அவர் அவனிடம், “பிள்ளையே[a], நீ எப்போதும் என்னோடு இருக்கிறாய்; என்னுடையவை அனைத்தும் உன்னுடையவை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகனே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘பிள்ளை’ என்று பொருள்படும் குடும்பப் பாசமுள்ள அழைப்புச் சொல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: பிள்ளையே
  rationale: அழைப்புநிலையில் வரும் τέκνον, குடும்பப் பாசத்துடன் ‘பிள்ளை’ என்று அழைப்பதைக் குறிக்கிறது. சூழலில் பேசப்படுபவர் மகனாக இருந்தாலும், மூலச்சொல்லில் இல்லாத ஆண்பால் குறிப்பை முதன்மை உரையில் சேர்க்காமல் அதன் மென்மையைக் காக்கிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: எல்லாக் காலத்திலும் தொடரும் உடனிருப்பை இயல்பான நவீன தமிழில் நேராக வெளிப்படுத்துகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: μετά + பிறப்புவேற்றுமை குறிக்கும் உடனிருப்பையும் உறவுச் சேர்ந்திருப்பையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πάντα τὰ ἐμὰ
  choice: என்னுடையவை அனைத்தும்
  rationale: தந்தைக்குரிய உடைமைகள் அனைத்தையும் உள்ளடக்கும் மூலமொழியின் பரந்த பொருளைக் காக்கிறது.
- source_word: σά ἐστιν
  choice: உன்னுடையவை
  rationale: ‘உனக்குரியவை’ என்ற பொருளைத் தருகிறது; இது சட்டபூர்வ உடைமை அல்லது உறவுசார் உரிமை என்ற நுணுக்கத்தை தேவையின்றி ஒருபக்கமாகத் தீர்மானிக்கவில்லை.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: அவர் அவனிடம் … என்றார்
  rationale: δέ இங்கு மென்மையான தொடர்ச்சி அல்லது எதிர்மறை மாறுதலைக் குறிக்கலாம். தமிழில் தனியான இணைப்புச்சொல்லைச் சேர்க்காமல் உரையாடலின் இயல்பான தொடர்ச்சியையும் சூழலிலுள்ள மாறுதலையும் விடுகிறது.
theological_decisions:
- issue: தந்தையின் குடும்பப் பாசமுள்ள அழைப்பு
  choice: τέκνον என்பதை ‘பிள்ளையே’ என்று மொழிபெயர்த்தல்
  alternative: ‘மகனே’
  rationale: கதையின் சூழலில் அழைக்கப்படுபவர் மகன் என்றாலும், τέκνον என்பது υἱός என்பதைக் காட்டிலும் பரந்த சொல்; அது உறவையும் பாசத்தையும் முன்னிறுத்துகிறது. ஆகவே மூலத்தின் மென்மையைப் பாதுகாத்து, அதில் இல்லாத ஆண்பால் குறிப்பை முதன்மை உரையில் கூர்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தந்தையின் கனிவும் கண்ணியமும் வெளிப்படும் இயல்பான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னுடையவை அனைத்தும் உன்னுடையவை’ என்பது மூலத்தின் இணை அமைப்பையும் முழுமைப் பொருளையும் தெளிவாகக் காக்கிறது.
