source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: ta
  text: நீங்கள் என் அரசாட்சியில் என் மேசையில் உண்ணவும் குடிக்கவும், அரியணைகளில் அமர்ந்து இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களுக்குத் தீர்ப்பளிக்கவும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களை ஆளவும்” அல்லது “நிர்வகிக்கவும்.”
    reason: κρίνοντες என்பது முதன்மையாக ‘தீர்ப்பளித்தல்’ என்பதைக் குறிக்கிறது; சூழலைப் பொறுத்து ஆளுதல் அல்லது நிர்வகித்தல் என்ற நுணுக்கமும் இருக்கலாம்.
lexical_decisions:
- source_word: ἵνα
  choice: …படியாகவும்
  rationale: முந்தைய வாக்குறுதியிலிருந்து தொடரும் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἔσθητε καὶ πίνητε
  choice: உண்டு குடிக்கும்படியாகவும்
  rationale: ἵνα-வின் கீழுள்ள இரு வினைகளையும் ஒரே நோக்க அமைப்பில் இணைத்து இயல்பாக வழங்குகிறது.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: என் பந்தியில்
  rationale: விருந்துண்ணும் மேசையையும் அதனுடன் தொடர்புடைய ஐக்கியத்தையும் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் வழக்கு.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: என் அரசாட்சியில்
  rationale: βασιλεία என்பதில் உள்ள அரசரின் ஆட்சி மற்றும் ஆட்சிக்குரிய தளம் ஆகிய இரு நுணுக்கங்களையும் ‘அரசாட்சி’ தக்கவைக்கிறது.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: அரியணைகளில் அமர்ந்து
  rationale: எதிர்கால அரச மற்றும் நீதியதிகாரப் படிமத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: κρίνοντες
  choice: தீர்ப்பளிக்கும்படியாகவும்
  rationale: κρίνω என்பதன் முதன்மையான நீதித்துறைப் பொருளைத் தக்கவைக்கிறது; ஆளுதல் என்ற விரிவான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்கள்
  rationale: இஸ்ரவேலின் உடன்படிக்கை சார்ந்த பன்னிரண்டு கோத்திரக் குறிப்பை வெளிப்படையாகவும் மரபுக்கு ஏற்றவாறும் வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களைக் ‘கிரினோ’ செய்வதில் சீடர்களின் எதிர்காலப் பங்கு
  choice: தீர்ப்பளித்தல்
  alternative: ஆளுதல் அல்லது நிர்வகித்தல்
  rationale: κρίνω நீதித்தீர்ப்பையும் ஆட்சியதிகாரத்தையும் குறிக்கக்கூடும். முதன்மை உரை அதன் நேரடியான நீதித்துறைப் பொருளை வைத்திருக்கிறது; அதைக் கண்டனத் தீர்ப்பு மட்டுமாகவோ நிர்வாக ஆட்சி மட்டுமாகவோ சுருக்காமல் மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் 29-ஆம் வசனத்திலிருந்து தொடரும் ἵνα நோக்க அமைப்பாக இருப்பதால், தனித்த வசனமாகவும் வாசிக்க உதவ ‘இது இருக்கும்’ இறுதியில் சேர்க்கப்பட்டுள்ளது; நோக்கத் தொடர்பு ‘…படியாகவும்’ என்ற அமைப்பால் தக்கவைக்கப்பட்டுள்ளது.
