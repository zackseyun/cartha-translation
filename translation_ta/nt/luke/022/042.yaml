  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: ta
  text: “தந்தையே, உமக்கு விருப்பமானால், இந்தக் கிண்ணத்தை என்னிடமிருந்து அகற்றும்.[a] ஆயினும், என் விருப்பம் அல்ல, உமது விருப்பமே நடக்கட்டும்.”[b] என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் கிண்ணத்தை என்னிடமிருந்து அகற்றும்’ என்பதற்குப் பதிலாக, ‘இந்தக் கிண்ணத்தை என்னிடமிருந்து எடுத்துச் செல்லும்’ என்றும் மொழிபெயர்க்கலாம். ‘கிண்ணம்’ என்பது ஒருவருக்கு ஒதுக்கப்பட்ட பங்கைக் குறிக்கும் வேதாகம உருவகம்; பல இடங்களில் அது குறிப்பாகத் துன்பத்தையோ நியாயத்தீர்ப்பையோ குறிக்கிறது.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: ‘நான் விரும்புவது அல்ல, நீர் விரும்புவதே நடக்கட்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: என்று கூறினார்
  rationale: நிகழ்காலப் பங்கேற்புவினை ஜெபத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தனி வசனமாக இயல்பாக வாசிக்க, தமிழில் வாக்கிய முடிவில் ‘என்று கூறினார்’ என அமைக்கப்பட்டுள்ளது.
- source_word: Πάτερ
  choice: தந்தையே
  rationale: கடவுளை நேரடியாக அழைக்கும் விளிவேற்றுமையை இயல்பான, கண்ணியமான நவீன தமிழில் காட்டுகிறது.
- source_word: εἰ βούλει
  choice: உமக்கு விருப்பமானால்
  rationale: βούλομαι குறிக்கும் விருப்பம் அல்லது மனமுவத்தலை நிபந்தனை வேண்டுதலாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: என்னிடமிருந்து அகற்றிவிடும்
  rationale: கிண்ணத்தைத் தம்மிடமிருந்து அகற்றுமாறு கேட்கும் கட்டளை வடிவை மரியாதையான வேண்டுகோளாக இயல்பாகத் தருகிறது.
- source_word: τοῦτο τὸ ποτήριον
  choice: இந்தக் கிண்ணத்தை
  rationale: வேதத்தில் ஒதுக்கப்பட்ட பங்கு, குறிப்பாகத் துன்பம் அல்லது நியாயத்தீர்ப்பு என்பதைக் குறிக்கக்கூடிய உருவகத்தை விளக்கிப் பரப்பாமல் அப்படியே காக்கிறது.
- source_word: πλὴν
  choice: ஆனாலும்
  rationale: முந்தைய வேண்டுதலிலிருந்து தந்தையின் விருப்பத்திற்குக் கீழ்ப்படும் வலுவான எதிர்மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: என் விருப்பத்தின்படி அல்ல, உமது விருப்பத்தின்படியே
  rationale: இரு விருப்பங்களுக்கிடையிலான வேறுபாட்டைத் தெளிவாகக் காத்து, தமிழில் தொடரும் ‘நடக்கட்டும்’ என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: γινέσθω
  choice: நடக்கட்டும்
  rationale: தந்தையின் விருப்பம் நிகழ வேண்டும் எனும் மூன்றாம் நபர் கட்டளைப் பொருளை நவீன தமிழில் நேர்த்தியாக வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் விருப்பத்திற்கும் தந்தையின் விருப்பத்திற்கும் உள்ள உறவு
  choice: ‘என் விருப்பத்தின்படி அல்ல, உமது விருப்பத்தின்படியே நடக்கட்டும்’ என்று வேறுபாட்டையும் கீழ்ப்படிதலையும் நேரடியாகக் காத்தல்
  alternative: ‘நான் விரும்புவது அல்ல, நீர் விரும்புவதே நடக்கட்டும்’
  rationale: மூலவசனம் இயேசுவின் விருப்பத்தையும் தந்தையின் விருப்பத்தையும் வேறுபடுத்தி, தந்தையின் விருப்பத்திற்கான கீழ்ப்படிதலை வெளிப்படுத்துகிறது. பின்னாளைய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் இந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘கிண்ணம்’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘கிண்ணம்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘இந்தத் துன்பத்தை’ அல்லது ‘இந்த வேதனையை’
  rationale: துன்பம் அல்லது நியாயத்தீர்ப்பு என விளக்கிப் பொருளை ஒரே வகையில் முடிவுசெய்யாமல், உருவகத்தின் வேதாகமத் தொடர்புகளையும் உண்மையான பொருள் வளத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமக்கு’, ‘உமது’, ‘அகற்றிவிடும்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் சொல் வரிசையைத் தமிழின் இயல்புக்கேற்ப மாற்றி, λέγων என்பதை வசன முடிவில் அமைத்துள்ளோம். அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
