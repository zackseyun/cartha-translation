- from: “தந்தையே, உமக்கு விருப்பமானால், இந்தக் கிண்ணத்தை என்னிடமிருந்து அகற்றிவிடும்.[a] ஆனாலும், என் விருப்பத்தின்படி அல்ல, உமது விருப்பத்தின்படியே நடக்கட்டும்” என்று கூறினார்.[b]
