source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: ta
  text: ஏனெனில், மனிதகுமாரன் தீர்மானிக்கப்பட்டபடியே செல்கிறார்; ஆனால், அவரைக் காட்டிக்கொடுக்கும் அந்த மனிதனுக்கு ஐயோ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை ஒப்புக்கொடுக்கும் அந்த மனிதனுக்கு ஐயோ!” கிரேக்க வினைச்சொல் சூழலுக்கேற்ப “காட்டிக்கொடு” அல்லது “ஒப்புக்கொடு” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் உரையோட்டத்தை இயல்பாக இணைக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயகுறிப்புக்கான நிலைபெற்ற தமிழாக்கம்; தலைப்பின் வேதாந்தரத் தொடர்புகளையும் காக்கிறது.
- source_word: μέν
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல், ‘ஆனாலும்’ என்பதுடனான வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: μέν–πλὴν எதிரிணைத் தொடர்பு தமிழில் தனித்த வலியுறுத்தல் சொல்லைவிட வாக்கிய எதிர்மறை அமைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: κατὰ τὸ ὡρισμένον
  choice: தீர்மானிக்கப்பட்டபடியே
  rationale: முன்னரே செய்யப்பட்ட தீர்மானத்துக்கு ஏற்ப நிகழ்வதைச் சுருக்கமாகவும், செயப்படுபொருள் வடிவின் மறைமுகத்தன்மையை மாற்றாமலும் தெரிவிக்கிறது.
- source_word: πορεύεται
  choice: செல்கிறார்
  rationale: இயேசு மரணத்தை நோக்கிச் செல்லும் பாதையைக் குறிக்கும் எளிய நிகழ்காலப் பயன்பாடு.
- source_word: πλὴν
  choice: ஆனாலும்
  rationale: தெய்வீகத் தீர்மானத்துக்கும் காட்டிக்கொடுப்பவரின் பொறுப்புக்கும் இடையிலான வலுவான முரணைக் காட்டுகிறது.
- source_word: οὐαὶ
  choice: ஐயோ!
  rationale: புலம்பலையும் தீர்ப்பின் எச்சரிக்கையையும் கொண்ட தீர்க்கதரிசன வலிமையைத் தக்கவைக்கிறது.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: அந்த மனிதனுக்கு
  rationale: குறிப்பிட்ட ஓர் ஆண் நபரைக் குறிக்கும் மூலத்தின் வடிவைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: δι’ οὗ
  choice: யாரால்
  rationale: διά உடன் வரும் agency-யைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: παραδίδοται
  choice: காட்டிக்கொடுக்கப்படுகிறார்
  rationale: இச்சூழலில் யூதாசின் துரோகச் செயலை இயல்பாகத் தெரிவிக்கிறது; ‘ஒப்புக்கொடுக்கப்படுகிறார்’ என்ற பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்மானத்துக்கும் மனிதப் பொறுப்புக்கும் உள்ள தொடர்பு
  choice: மனிதகுமாரன் தீர்மானிக்கப்பட்டபடி செல்கிறார்; அதேவேளை அவரைக் காட்டிக்கொடுக்கும் மனிதனுக்கு ஐயோ என்று கூறப்படுகிறது.
  alternative: தெய்வீகத் தீர்மானத்தை மென்மைப்படுத்துதல், அல்லது காட்டிக்கொடுப்பவரின் குற்றப்பொறுப்பை மென்மைப்படுத்துதல்.
  rationale: κατὰ τὸ ὡρισμένον மற்றும் οὐαὶ ஆகியவை இரு உண்மைகளையும் அருகருகே வைக்கின்றன. ஒரு குறிப்பிட்ட இறையியல் அமைப்புக்காக இந்தப் பதற்றம் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘தீர்மானிக்கப்பட்டபடியே’ மூலத்தின் மறைமுகச் செயப்படுபொருள் தன்மையைப் பாதுகாக்கிறது; தீர்மானித்தவர் யார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
