source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: ta
  text: உணவு உண்ட பின்பு, கிண்ணத்தையும் அவ்வாறே எடுத்து, “இந்தக் கிண்ணம் என் இரத்தத்தில் உள்ள புதிய உடன்படிக்கை[a]; அந்த இரத்தம் உங்களுக்காகச் சிந்தப்படுகிறது[b]” என்று கூறினார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் இரத்தத்தில் உள்ள புதிய ஏற்பாடு’ அல்லது ‘என் இரத்தத்தில் உள்ள புதிய சாசனம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘உங்களுக்காகச் சிந்தப்படுகிற’ என்ற தொடர் முழுக் கூற்றின் இறுதியில் உள்ளது. அதன் நடுநிலை ஒருமை வடிவம் ‘கிண்ணம்’ அல்லது ‘இரத்தம்’ என்பதோடு இலக்கணப்படி ஒத்துவரலாம்; ஆனால் சூழலில் சிந்தப்படுவது இயேசுவின் இரத்தமே என்பது இயல்பான பொருள்.
    reason: grammatical_ambiguity
  - marker: c
    text: சில பழமையான கையெழுத்துப் பிரதிகளில் லூக்கா 22:19-ன் பிந்திய பகுதியும் 22:20-மும் விடுபட்டுள்ளன; மற்ற சில பிரதிகளில் சொல் வரிசை மாறுபாடுகளும் உள்ளன.
    reason: textual_variant
lexical_decisions:
- source_word: ποτήριον
  choice: கிண்ணம்
  rationale: குடிப்பதற்கான பாத்திரத்தைக் குறிக்கும் இயல்பான பொதுத்தமிழ்ச் சொல்; வழிபாட்டு மரபைத் தேவையின்றி சுட்டும் சிறப்புச் சொல்லைத் தவிர்க்கிறது.
- source_word: ὡσαύτως
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் அப்பத்தோடு செய்யப்பட்ட செயலுடன் உள்ள தொடர்பை இயல்பாகப் பேணுகிறது.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: உணவு உண்ட பின்பு
  rationale: கிரேக்க காலத் தொடரைத் தெளிவான நவீனத் தமிழில் தருகிறது; குறிப்பாக இரவு உணவு என்ற பொருளைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: λέγων
  choice: என்று கூறினார்
  rationale: கிரேக்கப் பங்கேற்பு வினையைத் தமிழுக்கேற்ற முழு வினையாக மாற்றுகிறது.
- source_word: καινὴ διαθήκη
  choice: புதிய உடன்படிக்கை
  rationale: வேதாகமப் பின்னணியிலுள்ள இறை–மக்கள் உடன்படிக்கையைத் தெளிவாகக் குறிக்கிறது; இறுதி உயில் அல்லது சாசனம் என்ற தவறான முதன்மைப் பொருளைத் தவிர்க்கிறது.
- source_word: ἐν τῷ αἵματί μου
  choice: என் இரத்தத்தில் உள்ள
  rationale: ἐν என்பதன் ‘இல்/உள்ள’ வடிவை இயன்றவரைத் தக்கவைத்து, ‘என் இரத்தத்தினால்’ என்று கருவிப்பொருளை மட்டும் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: உங்களுக்காகச் சிந்தப்படுகிற
  rationale: ὑπέρ என்பதன் சார்பாக/நன்மைக்காக என்ற பரப்பை ‘உங்களுக்காக’ எனப் பேணுகிறது; பங்கேற்பு வினையை ‘என் இரத்தம்’ என்பதோடு இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: διαθήκη என்பதன் உடன்படிக்கைச் சூழல்
  choice: புதிய உடன்படிக்கை
  alternative: புதிய சாசனம் / புதிய ஏற்பாடு
  rationale: இரத்தத்தால் உறுதிப்படுத்தப்படும் உடன்படிக்கை என்ற பழைய ஏற்பாட்டுப் பின்னணி இங்கு முதன்மையானது. ‘உடன்படிக்கை’ அதைப் பொதுவாசகருக்குத் தெளிவாகத் தருகிறது.
- issue: ἐν τῷ αἵματί μου என்பதில் ἐν-ன் உறவு
  choice: என் இரத்தத்தில் உள்ள
  alternative: என் இரத்தத்தினால் ஏற்படுத்தப்படும்
  rationale: கிரேக்க முன்னிடைச்சொல்லின் உருவகத் திறப்பைத் தக்கவைத்து, இரத்தம் உடன்படிக்கையை ஏற்படுத்தும் கருவி என்ற விளக்கத்தை முதன்மை உரையிலேயே முழுமையாக நிர்ணயிக்கவில்லை.
- issue: ἐκχυννόμενον என்பதன் தொடர்புச் சொல்
  choice: ‘என் இரத்தம்’ என்பதோடு பொருளில் இணைத்தல்
  alternative: சொல் வரிசைப்படி முழு முந்தைய கூற்றோடு அல்லது ‘கிண்ணம்’ என்பதோடு தொடர்புள்ளதாக விடுதல்
  rationale: கிரேக்கத்தில் நடுநிலை ஒருமை வடிவம் ‘இரத்தம்’ மற்றும் ‘கிண்ணம்’ இரண்டுடனும் இலக்கண ஒற்றுமை பெறலாம்; இருப்பினும் சூழலில் சிந்தப்படுவது இயல்பாக இரத்தமே. இந்தப் பொருள் முதன்மை மொழிபெயர்ப்பில் தரப்பட்டு, தொடரின் இடம் குறித்த இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிண்ணம்’, ‘உடன்படிக்கை’, ‘சிந்தப்படுகிற’ ஆகியவை திருச்சபைச் சிறப்புமொழியைத் தேவையின்றி ஏற்றாமல் வேதாகமப் பொருளைத் தக்கவைக்கின்றன. முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் செயப்படுபொருள் குறையைத் தமிழில் நிறைவு செய்ய ‘எடுத்து’ சேர்க்கப்பட்டுள்ளது.
