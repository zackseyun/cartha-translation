  to: உணவு உண்ட பின்பு, கிண்ணத்தையும் அவ்வாறே எடுத்து, “இந்தக் கிண்ணம் என் இரத்தத்தில் உள்ள புதிய உடன்படிக்கை[a]; அந்த இரத்தம் உங்களுக்காகச் சிந்தப்படுகிறது[b]” என்று கூறினார்.[c]
