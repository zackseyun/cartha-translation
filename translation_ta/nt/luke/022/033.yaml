  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: ta
  text: ஆனால் அவர் இயேசுவிடம், “ஆண்டவரே, உம்மோடு சிறைக்குச் செல்லவும் சாவுக்குச் செல்லவும் நான் ஆயத்தமாக இருக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால் அவர்
  rationale: ὁ என்பது முன் சூழலில் உள்ள பேதுருவைக் குறிக்கும் பதிலிடுபெயர்போல் செயல்படுகிறது; δέ, இயேசுவின் முந்தைய கூற்றுக்கு எதிராக பேதுரு கூறும் பதிலை மென்மையான எதிர்மறை இணைப்பாகக் காட்டுகிறது.
- source_word: εἶπεν αὐτῷ
  choice: இயேசுவிடம் ... என்றார்
  rationale: αὐτῷ என்பதன் சூழல்சார் குறிப்பு இயேசுவே. தமிழில் தெளிவுக்காகப் பெயர் வெளிப்படுத்தப்பட்டுள்ளது; இதனால் பொருள் மிகைப்படுத்தப்படவில்லை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: நேரடி அழைப்பில் κύριος என்பதற்கான இயல்பான, மரியாதையும் பட்டப்பெயரின் இறையியல் நிறையும் கொண்ட தமிழ் வடிவம்.
- source_word: μετὰ σοῦ
  choice: உம்மோடு
  rationale: μετά + genitive உடன்செல்லுதலைக் குறிக்கிறது. நேரடி மரியாதை விளியில் ‘உம்மோடு’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἕτοιμός εἰμι
  choice: நான் ஆயத்தமாக இருக்கிறேன்
  rationale: இந்தச் சொற்றொடர் விருப்பத்தையும் தயார்நிலையையும் வெளிப்படுத்துகிறது; பேதுருவின் உறுதியான தன்னம்பிக்கையையும் காக்கிறது.
- source_word: καὶ ... καὶ
  choice: '... செல்லவும் ... செல்லவும்'
  rationale: இணையான இரு முடிவுகளையும் தமிழில் -வும் ... -வும் என்ற இணை அமைப்பு இயல்பாகவும் வலியுறுத்தலுடனும் இணைக்கிறது.
- source_word: εἰς φυλακὴν
  choice: சிறைக்குச்
  rationale: φυλακή இங்கு காவல் அல்லது சிறைவாசத்தைக் குறிக்கிறது; εἰς என்பதன் திசைநோக்கை ‘சிறைக்குச்’ தெளிவாகக் காட்டுகிறது.
- source_word: εἰς θάνατον
  choice: சாவுக்குச்
  rationale: சிறை மற்றும் மரணம் என்ற இணை இலக்குகளைத் தக்கவைத்து, மரணம்வரை செல்லும் ஆயத்தத்தை நேரடியாகக் கூறுகிறது.
- source_word: πορεύεσθαι
  choice: செல்ல
  rationale: ἕτοιμός εἰμι என்பதுடன் வரும் infinitive-ன் பொருளை நவீனத் தமிழில் எளிமையாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவுக்கான κύριος என்ற பட்டப்பெயர்
  choice: ஆண்டவர்
  alternative: போதகரே / எஜமானே
  rationale: ‘ஆண்டவர்’ என்பது மரியாதையையும் கிறிஸ்துவியல் ஒலிநயத்தையும் காக்கிறது; அதே நேரத்தில் வசனம் வெளிப்படையாகச் சொல்வதைத் தாண்டிய தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான நேரடி உரைக்காக ‘உம்மோடு’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் αὐτῷ என்பது ‘அவரிடம்’ என்றாலும், தொடர்ச்சியான தமிழ் உரையில் குறிப்பு தெளிவாக இருக்க ‘இயேசுவிடம்’ என வெளிப்படுத்தப்பட்டுள்ளது. ‘சிறைக்குச் செல்லவும் சாவுக்குச் செல்லவும்’ என்ற இணை அமைப்பு மூலத்தின் καὶ ... καὶ சமச்சீரைக் காக்கிறது.
