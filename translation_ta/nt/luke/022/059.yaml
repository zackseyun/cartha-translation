base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: ta
  text: ஏறக்குறைய ஒரு மணிநேரம் கடந்த பின்பு, வேறொரு மனிதர்[a], “உண்மையாகவே, இவனும் அவரோடு இருந்தான்; ஏனென்றால் இவனும் கலிலேயன்தான்” என்று வலியுறுத்திக் கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வேறொருவர்.” ἄλλος τις என்ற கிரேக்கச் சொற்றொடர் ஒருவரைக் குறிப்பின்றிச் சுட்டுகிறது; அதன் ஆண்பால் வடிவமும் இங்குள்ள சூழலும் ஆண் பேச்சாளரைச் சுட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: ஏறக்குறைய ஒரு மணிநேரம் கடந்த பின்பு
  rationale: காலம் கடந்ததைக் குறிக்கும் மரபுத்தொடரின் பொருளையும் ὡσεὶ தரும் தோராயத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἄλλος τις
  choice: வேறொரு மனிதர்
  rationale: கிரேக்கச் சொற்றொடர் குறிப்பிட்ட பெயரைச் சொல்லாமல் ‘வேறொருவர்’ எனக் குறிக்கிறது; ஆண்பால் வடிவமும் சூழலும் ஆண் பேச்சாளரைச் சுட்டுவதால் இத்தேர்வு செய்யப்பட்டது.
- source_word: διϊσχυρίζετο
  choice: வலியுறுத்திக் கூறினார்
  rationale: வலிமையாகவும் உறுதியாகவும் வாதிட்டுச் சொல்வதைக் குறிக்கும் வினையின் அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἐπ’ ἀληθείας
  choice: உண்மையாகவே
  rationale: கூற்றின் உண்மைத்தன்மையை வலியுறுத்தும் கிரேக்க மரபுத்தொடரின் அழுத்தத்தைத் தக்கவைக்கிறது.
- source_word: οὗτος
  choice: இவன்
  rationale: பேதுருவைச் சுட்டிக்காட்டும் நேரடியான, சற்றே குற்றஞ்சாட்டும் தொனியை ‘அவன்’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: μετ’ αὐτοῦ ἦν
  choice: அவரோடு இருந்தான்
  rationale: இயேசுவுடன் இருந்த தொடர்பை மேலதிக விளக்கமின்றி நேரடியாகத் தெரிவிக்கிறது.
- source_word: καὶ γὰρ
  choice: ஏனென்றால் இவனும்
  rationale: γάρ தரும் காரணத்தையும் καί தரும் ‘கூட/உம்’ என்ற சேர்க்கைப் பொருளையும் காக்கிறது.
- source_word: Γαλιλαῖός ἐστιν
  choice: கலிலேயன்தான்
  rationale: பேதுருவின் பிராந்திய அடையாளத்தை நேரடியாகக் கூறுவதோடு, குற்றஞ்சாட்டுபவரின் உறுதியான முடிவையும் ‘தான்’ இயல்பாக வெளிப்படுத்துகிறது.
