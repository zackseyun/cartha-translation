lexical_decisions:
- source_word: ὤφθη
  choice: தோன்றி
  rationale: ὁράω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு தோற்றரவு குறிக்கும் வழக்கில் ‘தோன்றினார்’ என்ற பொருளைத் தருகிறது; ‘காணப்பட்டார்’ என்பது தமிழில் இயல்புக் குறைவானது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ எதிர்மறை வேறுபாட்டைவிட நிகழ்வின் தொடர்ச்சியைச் சுட்டுகிறது; ‘அப்போது’ காட்சியின் முன்னேற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: ὤφθη உடன் வரும் நான்காம் வேற்றுமை, அந்தத் தோற்றம் இயேசுவை நோக்கியது என்பதைச் சுட்டுவதால் ‘அவருக்குத் தோன்றி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἄγγελος
  choice: ஒரு தூதர்
  rationale: வானத்திலிருந்து வருபவர் என்பதால் பொதுவான செய்தியாளர் அல்ல, தேவதூதரே குறிக்கப்படுகிறார்; தமிழில் ‘தூதர்’ என்ற சொல் சூழலால் இதைத் தெளிவாக உணர்த்துகிறது.
- source_word: ἀπ’ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: இந்தச் சொற்றொடர் தூதரின் வானுலகத் தோற்றுவாயைக் குறிக்கிறது; ‘வானத்திலிருந்து’ என்பது நேர்த்தியான நவீனத் தமிழ்.
- source_word: ἐνισχύων
  choice: பலப்படுத்தினார்
  rationale: இந்த நிகழ்காலப் பெயரெச்சம் தோன்றுதலுடன் இணைந்து நடந்த செயலைக் குறிக்கிறது. இயல்பான தமிழுக்காக முற்றுவினையாக அமைக்கப்பட்டாலும், ‘ஊக்கப்படுத்தினார்’ எனப் பொருளை மனவுணர்வாக மட்டும் சுருக்காமல் வலிமையூட்டும் கருத்து காக்கப்பட்டுள்ளது.
- source_word: αὐτόν
  choice: அவரை
  rationale: நேரடி செயப்படுபொருள் இயேசுவைக் குறிக்கிறது; மரியாதை ஒருமையில் ‘அவரை’ எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: லூக்கா 22:43-இன் மூலபாட நிலை
  choice: வழங்கப்பட்ட SBLGNT மூலபாடத்தின்படி வசனத்தை முதன்மைப் பனுவலில் சேர்த்தல்
  alternative: சில கையெழுத்துப் பிரதிகளில் லூக்கா 22:43–44 இல்லை
  rationale: வழங்கப்பட்ட கிரேக்க மூலத்தில் இவ்வசனம் உள்ளது. எனினும் அதன் கையெழுத்துப் பிரதிச் சான்று விவாதத்திற்குரியது என்பதால், மாற்றுப் பாடம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘பலப்படுத்தினார்’ என்பது உடல் அல்லது உள்ளார்ந்த வலிமை என்ற இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல் காக்கிறது.
