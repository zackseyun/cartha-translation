  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: ta
  text: பின்பு சாத்தான், இஸ்காரியோத் என்று அழைக்கப்பட்டவனும் பன்னிருவரின் எண்ணிக்கையைச் சேர்ந்தவனுமான[a] யூதாசுக்குள் நுழைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பன்னிருவரில் ஒருவனாக இருந்தவன்.’ சொல்லர்த்தமாக, ‘பன்னிருவரின் எண்ணிக்கையைச் சேர்ந்தவன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: பின்பு ... நுழைந்தான்
  rationale: δέ இங்கு நிகழ்ச்சியின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது; அதனால் இயல்பான கதைநடைக்காக ‘பின்பு’ பயன்படுத்தப்பட்டது. εἰσῆλθεν என்பதன் நுழைவு பொருள் நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: புதிய ஏற்பாட்டில் தனிப்பட்ட பெயர் அல்லது பட்டமாக வரும் சொல்லுக்கான வழக்கமான, தெளிவான தமிழ் வடிவம்.
- source_word: εἰς Ἰούδαν
  choice: யூதாசுக்குள்
  rationale: εἰς என்னும் முன்னிடைச்சொல் ஒருவருக்குள் நுழைவதை வெளிப்படையாகக் குறிக்கிறது; வெறும் செல்வாக்கு செலுத்துதல் என்று மென்மையாக்கப்படவில்லை.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: இஸ்காரியோத்து என்று அழைக்கப்பட்டவன்
  rationale: καλούμενον என்னும் பெயரெச்சம் யூதாசை அடையாளப்படுத்துகிறது. ‘என்று அழைக்கப்பட்டவன்’ கிரேக்க அமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: பன்னிருவரின் எண்ணிக்கையைச் சேர்ந்தவன்
  rationale: ἐκ τοῦ ἀριθμοῦ என்ற முறையான சொற்றொடரின் ‘எண்ணப்பட்ட குழுவைச் சேர்ந்தவர்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; தமிழில் புரியத்தக்கதாகவும் உள்ளது.
theological_decisions:
- issue: யூதாசுக்குள் சாத்தான் நுழைந்த செயலின் இயல்பு
  choice: ‘சாத்தான் ... யூதாசுக்குள் நுழைந்தான்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘சாத்தான் யூதாசின் மீது செல்வாக்குச் செலுத்தினான்’ அல்லது ‘யூதாசைப் பிடித்துக்கொண்டான்’
  rationale: εἰσῆλθεν ... εἰς என்ற கிரேக்கச் சொற்றொடர் நுழைவை வெளிப்படையாகக் கூறுகிறது. அதை உளவியல் செல்வாக்காக மட்டும் குறைத்துக் காட்டவில்லை; அதேவேளையில் பேய்ப்பிடித்தல் அல்லது மனிதப் பொறுப்பு குறித்து வசனம் கூறாத விளக்கமும் சேர்க்கப்படவில்லை.
- issue: ‘பன்னிருவர்’ என்பது அங்கீகரிக்கப்பட்ட சீடர் குழுவைக் குறிப்பதா
  choice: ‘பன்னிருவர்’ எனக் குழுவைக் குறிக்கும் இயல்பான தமிழ் வடிவத்தைப் பயன்படுத்துதல்
  alternative: ‘பன்னிரண்டு பேர்’ என பொதுவான எண்ணிக்கையாக மட்டும் மொழிபெயர்த்தல்
  rationale: τῶν δώδεκα இங்கு இயேசுவின் அறியப்பட்ட உள்வட்டக் குழுவைக் குறிக்கிறது. தமிழ் எழுத்துமுறையில் பெரிய எழுத்து வேறுபாடு இல்லாததால், சூழலும் சொல் வடிவமும் அந்தக் குழு சார்ந்த பொருளைத் தருகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. நீளமான கிரேக்க அடையாளத் தொடரை தமிழில் தெளிவாக இணைக்க ‘அழைக்கப்பட்டவனும் ... சேர்ந்தவனுமான’ என்ற அமைப்பு தேர்ந்தெடுக்கப்பட்டது.
