id: LUK.22.48
reference: Luke 22:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: ta
  text: ஆனால் இயேசு அவனிடம், “யூதாசே, முத்தத்தால் மனிதகுமாரனைக் காட்டிக்கொடுக்கிறாயா?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “ஒப்படைக்கிறாயா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ ஒரு மென்மையான இணைப்புச்சொல்; இச்சூழலில் யூதாசின் செயலுக்கு இயேசு எதிர்வினையாற்றுவதைக் காட்டும் மிதமான முரண்பாட்டு நயத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἶπεν αὐτῷ
  choice: அவனிடம் … என்றார்
  rationale: αὐτῷ என்ற வெளிப்படையான மறுபெயரைத் தக்கவைத்து, நவீனத் தமிழின் இயல்பான நேர்க்கூற்று அமைப்பில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἰούδα
  choice: யூதாசே
  rationale: அழைப்புவேற்றுமையைத் தமிழில் ‘-ஏ’ விகுதியால் வெளிப்படுத்தி, பெயரின் வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: φιλήματι
  choice: முத்தத்தால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; அன்பின் அடையாளமே துரோகத்தின் வழிமுறையாகப் பயன்படுத்தப்படும் பதற்றத்தையும் தக்கவைக்கிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற சுயக்குறிப்பையும் தானியேல் நூலுடனான எதிரொலியையும் காக்கும், நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய தலைப்பு.
- source_word: παραδίδως
  choice: காட்டிக்கொடுக்கிறாயா
  rationale: நிகழ்ந்துகொண்டிருக்கும் பகைமையான ஒப்படைப்பைச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது. வினாவின் நேரடியான கண்டன நயமும் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου என்பதன் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மானிட மகன் / மனிதன்
  rationale: இந்தச் சொற்றொடர் நற்செய்திகளில் இயேசுவின் கிறிஸ்துவியல் சுயக்குறிப்பாகச் செயல்படுகிறது. ‘மனிதகுமாரன்’ அதன் சொல் அமைப்பையும் வேதாகமங்களுக்கு இடையிலான எதிரொலியையும் பாதுகாக்கிறது; அதை வெறும் பொதுவான மனிதக் குறிப்பாகச் சுருக்குவதில்லை.
- issue: παραδίδως என்பதில் துரோகம் மற்றும் ஒப்படைத்தல் ஆகிய இரு நயங்கள்
  choice: காட்டிக்கொடுக்கிறாயா
  alternative: ஒப்படைக்கிறாயா
  rationale: சூழலில் துரோக நயம் தெளிவாக இருப்பதால் முதன்மை உரையில் ‘காட்டிக்கொடுக்கிறாயா’ இயல்பானது. ஆயினும், கிரேக்க வினையின் அடிப்படையான ‘ஒப்படைத்தல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேர்க்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதாசே’ என்ற அழைப்பும் ‘முத்தத்தால்’ என்ற கருவிப்பொருளும் மூலத்தின் நேரடித் தாக்கத்தைத் தக்கவைக்கின்றன.
