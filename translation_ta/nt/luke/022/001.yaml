  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: ta
  text: புளிப்பில்லாத அப்பத்தின் திருவிழா[a], பஸ்கா என்று அழைக்கப்படுவது, நெருங்கிக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பஸ்காவும் புளிப்பில்லாத அப்பத்தின் திருவிழாவும் நெருங்கிய தொடர்புடைய அனுசரிப்புகள். யூத வழக்கில் அவை ஒன்றாகக் குறிப்பிடப்படலாம்; அவற்றின் பெயர்களும் சில நேரங்களில் ஒன்றுடன் ஒன்று ஒட்டிய வகையில் பயன்படுத்தப்பட்டன.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: நெருங்கிக்கொண்டிருந்தது
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம், திருவிழா தொடர்ந்து நெருங்கி வந்ததைச் சுட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரையாடல் அல்லது கதை நகர்வு இணைப்பாக உள்ளது. தமிழில் வெளிப்படையான இணைப்புச் சொல் சேர்க்காமல் விடுவது இயல்பானது; மூலத்தில் இல்லாத ‘இப்போது’ என்பதைச் சேர்ப்பதும் தவிர்க்கப்படுகிறது.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: புளிப்பில்லா அப்பத் திருவிழா
  rationale: ἑορτή என்பது சமய விழாவைக் குறிக்கிறது; ἄζυμα என்பது புளிக்கச் செய்யப்படாத அப்பங்களைச் சுட்டுகிறது. ‘திருவிழா’ நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἡ λεγομένη
  choice: என்று அழைக்கப்படுவது
  rationale: மற்றொரு பெயரால் அந்த விழாவை விளக்கும் பெயரெச்சத் தொடரின் விளக்கத் தன்மையைப் பாதுகாக்கிறது.
- source_word: Πάσχα
  choice: பஸ்கா
  rationale: யூத விழாவின் மரபாக நிலைபெற்ற தமிழ் பெயரைப் பயன்படுத்துகிறது; இது கிரேக்க πάσχα-வின் ஒலிபெயர்ப்புடன் தொடர்புடையது.
theological_decisions:
- issue: ‘புளிப்பில்லா அப்பத் திருவிழா’ மற்றும் ‘பஸ்கா’ ஆகியவற்றின் தொடர்பு
  choice: லூக்கா கூறும் விளக்க அடையாளப்படுத்தலை அப்படியே பாதுகாத்து, ‘புளிப்பில்லா அப்பத் திருவிழா, பஸ்கா என்று அழைக்கப்படுவது’ என மொழிபெயர்த்தல்
  alternative: இரண்டையும் முற்றிலும் தனித்தனி அனுசரிப்புகளாகக் காட்டும் வகையில் காலவரிசை வேறுபாட்டை வலியுறுத்துதல்
  rationale: மூல வாசகம் விழாக்காலத்தை மற்றொரு பெயரால் விளக்குகிறது. முதல் நூற்றாண்டு யூதப் பயன்பாட்டில் இப்பெயர்கள் தொடர்புடைய அல்லது ஒன்றையொன்று மேலிடும் விதத்தில் பயன்படுத்தப்பட்டிருக்கலாம்; மொழிபெயர்ப்பு அதற்கு அப்பாற்பட்ட தொழில்நுட்ப வேறுபாட்டையோ ஒத்திசைவையோ திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புளிப்பில்லா அப்பம்’ வாசகருக்கு உடனடியாகப் புரியும் வடிவம்; ‘பஸ்கா’ என்பது தமிழ்க் கிறிஸ்தவச் சூழலில் பரவலாக அறியப்பட்ட விழாப்பெயர். மூலத்தின் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், அதன் விளக்கத் தொடர்பும் தொடர்நிலைச் செயற்பாங்கும் பாதுகாக்கப்பட்டுள்ளன.
