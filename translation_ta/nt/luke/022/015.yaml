source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நான் துன்பப்படுவதற்கு முன்பு, இந்தப் பஸ்காவை[b] உங்களோடு உண்ண மிகவும் விரும்பினேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு இன்னும் நெருக்கமாக, “ஆசையால் ஆசைப்பட்டேன்”; கிரேக்கத்தில் இயேசுவின் ஏக்கத்தைத் தீவிரப்படுத்தும் வலியுறுத்தல் அமைப்பு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “இந்தப் பஸ்கா” என்பது குறிப்பாகப் பஸ்கா உணவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: கிரேக்க மொழியின் வழக்கமான உரையாடல் அறிமுகத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: மிகவும் ஆவலாய் இருந்தேன்
  rationale: ஒரே வேர்ச்சொல்லைக் கொண்ட பெயர்ச்சொல்–வினைச்சொல் அமைப்பு விருப்பத்தின் தீவிரத்தை வலியுறுத்துகிறது. சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல் அந்த வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦτο τὸ πάσχα
  choice: இந்தப் பஸ்காவை
  rationale: மூலத்தில் உள்ள ‘இந்தப் பஸ்கா’ என்பதைக் காக்கிறது. உண்ணுதல் என்ற உடனடிச் சூழல் இது பஸ்கா உணவைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: φαγεῖν
  choice: உண்பதற்கு
  rationale: ‘உண்ணுதல்’ என்ற அடிப்படைப் பொருளை நேரடியாகவும் கண்ணியமான நடையிலும் தருகிறது.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு
  rationale: உடனிருப்பைக் குறிக்கும் எளிய, இயல்பான தமிழ்ச் சொல்.
- source_word: πρὸ τοῦ με παθεῖν
  choice: நான் துன்பப்படுவதற்கு முன்பு
  rationale: πρό உடன் வரும் வினையெச்ச அமைப்பின் முன்னிகழ் காலத் தொடர்பையும் πάσχω என்பதன் பொதுவான ‘துன்பப்படுதல்’ பொருளையும் காக்கிறது; நிகழ்வுகளை அளவுக்கு மீறி விளக்கவில்லை.
theological_decisions:
- issue: சூழலில் πάσχα என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘இந்தப் பஸ்கா’ என்று வைக்கப்பட்டது.
  alternative: இந்தப் பஸ்கா உணவு
  rationale: உண்ணுதல் பற்றிய சூழலால் பஸ்கா உணவு நோக்கத்தில் உள்ளது. இருப்பினும், கிரேக்கம் ‘இந்தப் பஸ்கா’ என்றே கூறுவதால் மூலத்தின் பொருள் பரப்பை முதன்மை உரை காக்கிறது.
- issue: Ἐπιθυμίᾳ ἐπεθύμησα என்ற வலியுறுத்தலின் ஆற்றல்
  choice: ‘மிகவும் ஆவலாய் இருந்தேன்’ என்று இயல்பாக வலியுறுத்தப்பட்டது.
  alternative: ஆசையால் ஆசைப்பட்டேன்
  rationale: இயேசுவின் தீவிரமான ஏக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளையில் தமிழில் செயற்கையாக ஒலிக்கும் சொல்லுக்குச் சொல் மறுபடிவைத் தவிர்க்கிறது.
- issue: πάσχω என்பதன் குறிப்பு
  choice: ‘துன்பப்படுவதற்கு’ என்ற பொதுவான வடிவம் காக்கப்பட்டது.
  alternative: பாடுபடுவதற்கு
  rationale: இது இயேசுவின் வரவிருக்கும் பாடுகளைச் சூழலில் குறித்தாலும், மூலச் சொல்லைச் சிலுவை மரணமாக மட்டும் விளக்கி விரிவுபடுத்தாமல் அதன் இயல்பான பொருளைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வேதாகம நடை. ‘பஸ்கா’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் காக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடருக்குப் பின் வரிசையாக அமைக்கப்பட்டுள்ளன.
