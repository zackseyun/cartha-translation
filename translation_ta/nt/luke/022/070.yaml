  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: ta
  text: அப்போது அவர்கள் எல்லாரும், “அப்படியானால், நீ கடவுளின் மகனா?” என்றார்கள். அதற்கு அவர், “நான் தான் என்று நீங்களே சொல்கிறீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வழக்கமான தமிழில், “நீங்கள் சொல்வது சரிதான்” அல்லது “நீங்களே அப்படிச் சொல்கிறீர்கள்” என்றும் மொழிபெயர்க்கலாம். இயேசுவின் பதில் சூழலில் உறுதிப்படுத்தும் பதிலாக உள்ளது; ஆனால் கிரேக்கத்தில் சொற்சொல்லாக, “நான் இருக்கிறேன் என்று நீங்களே சொல்கிறீர்கள்” என உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: குழுவினர் அனைவரும் கேட்டார்கள் என்ற கூட்டு வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய உரையாடலிலிருந்து அவர்கள் எடுத்த முடிவைச் சுட்டும் அனுமானத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: கிறிஸ்துவைப் பற்றிய பட்டத்தின் தன்மையையும் கேள்வியின் முறையான நிறையையும் காக்கிறது.
- source_word: ἔφη
  choice: என்றார்
  rationale: சூழலில் குறியீடற்ற, இயல்பான தமிழ் உரையாடல் வினை.
- source_word: Ὑμεῖς
  choice: நீங்களே
  rationale: வெளிப்படையாக இடம்பெறும் வலியுறுத்தப்பட்ட பன்மைச் சுட்டுப்பெயரைத் தமிழின் ‘-ஏ’ வலியுறுத்தலால் பிரதிபலிக்கிறது.
- source_word: λέγετε
  choice: சொல்கிறீர்கள்
  rationale: நிகழ்காலப் பன்மை வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: அவர்கள் கூறுவதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் கிரேக்க இணைப்பை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: ἐγώ εἰμι
  choice: நான் அவர்தான்
  rationale: தமிழில் தனித்து வரும் ‘நான் இருக்கிறேன்’ இச்சூழலில் முழுமையற்றதாகத் தோன்றுவதால், முன் குறிப்பிடப்பட்ட ‘கடவுளின் மகன்’ என்பதைக் குறிக்கும் இயல்பான பதிலாகத் தரப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் காக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் பதிலை வெளிப்படையான ஒப்புதலாகவா அல்லது மறைமுகமான பதிலாகவா மொழிபெயர்ப்பது
  choice: “நான் அவர்தான் என்று நீங்களே சொல்கிறீர்கள்” என மூல அமைப்புக்கு நெருக்கமாகத் தருதல்
  alternative: “நீங்கள் சொல்வது சரிதான்” அல்லது “நீங்களே அப்படிச் சொல்கிறீர்கள்”
  rationale: பதில் சூழலில் ஒப்புதலாகச் செயல்பட்டாலும், கிரேக்கத்தின் மறைமுகமான சொல்லமைப்பை முதன்மை உரை காக்கிறது; இதனால் அதன் இறையியல் இழுபறி தேவையின்றித் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரையாடல் நடை. ‘அப்படியானால்’ அனுமானத்தை வெளிப்படுத்துகிறது; ‘நீங்களே’ மூலச் சுட்டுப்பெயரின் வலியுறுத்தலைக் காக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் பதிலின் உடனேயே வைக்கப்பட்டுள்ளது.
