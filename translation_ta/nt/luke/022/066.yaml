- from: பொழுது விடிந்தபோது[a], மக்களின் மூப்பர் மன்றம்—தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும்—கூடிவந்தது. அவர்கள் அவரைத் தங்கள் நீதிமன்றக் கூட்டத்துக்கு[b] அழைத்துச் சென்றார்கள்.
  to: பொழுது விடிந்தபோது[a], மக்களின் மூப்பர் மன்றம்—தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும்—கூடிவந்தது. அவர்கள் அவரைத் தங்கள் மன்றத்துக்கு[b] அழைத்துச் சென்றார்கள்.
