  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: ta
  text: பொழுது விடிந்தபோது[a], மக்களின் மூப்பர் மன்றம்—தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும்—கூடிவந்தது. அவர்கள் அவரைத் தங்கள் மன்றத்துக்கு[b] அழைத்துச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பகல் ஆனபோது’ அல்லது ‘விடியற்காலையில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்கள் மன்றத்துக்குள்’ அல்லது ‘தங்கள் மன்றத்தின் முன்.’ கிரேக்கச் சொல் மன்றத்தையோ, அதன் முறையான அமர்வையோ, அது கூடும் இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: பொழுது விடிந்தபோது
  rationale: கிரேக்க மொழிப்பயன்பாட்டின் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; சொற்சொல்லான மாற்றுகளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: συνήχθη
  choice: கூடிவந்தது
  rationale: மன்றம் ஒன்றுகூடியதைக் காட்டும் இயல்பான கூட்டு வினை; மூலத்தின் இறந்தகாலப் பன்மை/கூட்டுக் கருத்தைத் தமிழில் ஒருமை மன்றத்துடன் பொருந்துமாறு தருகிறது.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: மக்களின் மூப்பர் மன்றம்
  rationale: πρεσβυτέριον என்பது வெறும் மூப்பர் நிலையை அல்ல, மூப்பர்களால் அமைந்த நிறுவனக் குழுவைக் குறிக்கிறது; ‘மூப்பர் மன்றம்’ இதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும்
  rationale: τε καί இணைக்கும் இரு குழுக்களையும் ‘உம்…உம்’ அமைப்பு பாதுகாக்கிறது. γραμματεῖς என்பதன் இச்சூழலுக்குரிய வேத/சமயச் சட்ட நிபுணர் கருத்தை ‘மறைநூல் அறிஞர்கள்’ பொதுவாசகருக்குத் தெளிவாக்குகிறது.
- source_word: ἀπήγαγον
  choice: அழைத்துச் சென்றார்கள்
  rationale: ἀπάγω என்பதிலுள்ள வழிநடத்திச் செல்லும் திசைக் கருத்தைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத வன்முறையைச் சேர்ப்பதில்லை.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: தங்கள் நீதிமன்றக் கூட்டத்துக்கு
  rationale: συνέδριον இங்கு ஆளும்/நீதி விசாரணை மன்றத்தையோ அதன் முறையான அமர்வையோ குறிக்கலாம். ‘நீதிமன்றக் கூட்டம்’ இடத்தை மட்டும் உறுதிசெய்யாமல் நீதித்துறை அமர்வை இயல்பாகக் காட்டுகிறது; உண்மையான பலபொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யூத ஆளும் மன்றத்துக்கான நிறுவனச் சொற்கள்
  choice: πρεσβυτέριον என்பதை ‘மூப்பர் மன்றம்’ என்றும் συνέδριον என்பதை ‘நீதிமன்றக் கூட்டம்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘மன்றம்’ என்று மொழிபெயர்த்தல்; அல்லது συνέδριον என்பதை ‘சனெட்ரின்’ என்று ஒலிபெயர்த்தல்
  rationale: வசனத்தில் தொடர்புடைய ஆனால் வேறுபட்ட இரு கிரேக்கச் சொற்கள் உள்ளன. அவற்றின் வேறுபாட்டைப் பாதுகாப்பது மூலத்தின் சொல் மாறுபாட்டைக் காட்டுகிறது; ‘சனெட்ரின்’ என்ற மரபுப்பெயரை இறக்குமதி செய்வதைத் தவிர்க்கிறது. அதேவேளை συνέδριον குறிக்கும் குழு/அமர்வு/இடம் என்ற பொருள் நெகிழ்வை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை. ‘ஆசாரியர்’ என்ற பரவலாக அறியப்படும் வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; γραμματεῖς என்பதற்கு இச்சூழலில் தெளிவான ‘மறைநூல் அறிஞர்கள்’ பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரையில் இரண்டு வாக்கியங்கள் அமைக்கப்பட்டுள்ளன; இது நீண்ட கிரேக்கத் தொடரை இயல்பான தமிழாக்கமாக்குகிறது, பொருள் தொடர்பை மாற்றுவதில்லை.
