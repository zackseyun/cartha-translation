id: LUK.22.26
reference: Luke 22:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: ta
  text: ஆனால், நீங்கள் அப்படி இருக்கக் கூடாது[a]. மாறாக, உங்களிடையே உயர்ந்தவராக இருப்பவர் இளையவரைப் போல ஆகட்டும்; வழிநடத்துகிறவர் சேவை செய்கிறவரைப் போல ஆகட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால், உங்களுக்குள் அப்படியல்ல.” கிரேக்க வாக்கியம் சில சொற்களை வெளிப்படையாகக் கூறாமல் சுருக்கமாக அமைந்து, சற்று முன் விவரிக்கப்பட்ட அந்தஸ்தை நாடும் போக்கிலிருந்து இயேசுவின் சீடர்களைக் கூர்மையாக வேறுபடுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: “இளையவர்” என்பது வயதில் இளையவரை மட்டும் குறிக்காமல், சமூக வரிசையில் இளநிலையிலுள்ளவரையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: ஆனால், நீங்கள் அப்படி இருக்கக் கூடாது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அதிகாரத்தையும் அந்தஸ்தையும் நாடும் போக்குடன் சீடர்களைத் தெளிவாக வேறுபடுத்தும் கூர்மையான முரண்பாட்டையும், கிரேக்கத்தில் மறைமுகமாக உள்ள தடைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλ’
  choice: மாறாக
  rationale: எதிர்மறையான நடத்தையிலிருந்து இயேசுவின் நேர்மறையான அறிவுறுத்தலுக்கு வரும் வலுவான மாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ μείζων
  choice: உயர்ந்தவராக இருப்பவர்
  rationale: முழுமையான மிகைநிலையாக அல்லாமல் ஒப்பீட்டு நிலையையும், இங்கு வயதைவிடக் குழுவுக்குள் உயர்ந்த அந்தஸ்தில் கருதப்படுபவரையும் குறிக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: சமூகத்திற்குள் உள்ள உறவுநிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: γινέσθω
  choice: ஆகட்டும்
  rationale: γίνομαι என்பதன் நிகழ்காலக் கட்டளை, வெறுமனே ஒரு நிலையில் இருப்பதைவிட ஒரு மனப்பாங்கையோ பங்கையோ ஏற்றுக்கொள்வதை உணர்த்துவதால், ‘ஆகட்டும்’ அதன் இயக்கத்தையும் கட்டளை வலிமையையும் காக்கிறது.
- source_word: ὡς ὁ νεώτερος
  choice: இளையவரைப் போல
  rationale: νεώτερος என்பது ஒப்பீட்டு வடிவம்; ‘மிக இளையவர்’ என்று மிகைநிலையாக்காமல் ‘இளையவர்’ எனத் தரப்பட்டுள்ளது. சமூகத்தில் தாழ்ந்த நிலையில் கருதப்பட்டவரே ஒப்பீட்டின் மையம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ὁ ἡγούμενος
  choice: வழிநடத்துகிறவர்
  rationale: தலைமைச் செயலைக் குறிக்கும் வினைத் தன்மையைப் பாதுகாக்கிறது; தேவையற்ற அரசியல் அல்லது பிற்கால நிறுவனப் பதவிப் பொருளைச் சேர்ப்பதில்லை.
- source_word: ὡς ὁ διακονῶν
  choice: சேவை செய்கிறவரைப் போல
  rationale: மற்றவர்களுக்காகச் செயல்படும் தொடர்ச்சியான சேவையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒரு முறையான பதவிப் பெயராக மாற்றுவதில்லை.
theological_decisions:
- issue: அந்தஸ்தையும் தலைமையையும் குறித்த இயேசுவின் அறிவுறுத்தலின் தன்மை
  choice: சீடர்களின் சமூகத்தில் உயர்ந்த அந்தஸ்து தாழ்மையான சேவையாகத் தலைகீழாக்கப்படுவதை வலியுறுத்தும் நெறிப்போதனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஆட்சி அல்லது திருச்சபைப் பதவி குறித்த வலுவான நிறுவனச் சொற்களால் மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் ‘உயர்ந்தவர்’ மற்றும் ‘வழிநடத்துகிறவர்’ ஆகியோரை ‘இளையவர்’ மற்றும் ‘சேவை செய்கிறவர்’ ஆகியோருடன் எதிரெதிராக நிறுத்துகிறது. ஆகவே, பிற்காலத் திருச்சபை அமைப்புகளை உரைக்குள் கொண்டுவராமல், சமூக அந்தஸ்தை மாற்றியமைக்கும் அழைப்பையும் தாழ்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘உயர்ந்தவர்’ என்பது அந்தஸ்தைக் குறிக்கவும், ‘வழிநடத்துகிறவர்’ மற்றும் ‘சேவை செய்கிறவர்’ என்பவை செயற்பாட்டுத் தன்மையைப் பாதுகாக்கவும் தேர்ந்தெடுக்கப்பட்டன. இரண்டு அடிக்குறிப்பு குறியீடுகளும் உரையில் உரிய இடங்களில் சேர்க்கப்பட்டுள்ளன.
