id: LUK.22.35
reference: Luke 22:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “பணப்பை, பயணப்பை[a], செருப்புகள் எதுவும் இல்லாமல் நான் உங்களை அனுப்பியபோது, உங்களுக்கு ஏதாவது குறை இருந்ததா?” என்று கூறினார். அவர்கள், “ஒன்றும் இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயண மூட்டை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄτερ
  choice: இல்லாமல்
  rationale: உடன் எடுத்துச் செல்லாத நிலையை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: βαλλαντίου
  choice: பணப்பை
  rationale: பணத்தை வைத்துச் செல்லும் பையை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: πήρας
  choice: பயணப்பை
  rationale: பயணத்திற்கான உணவு அல்லது பொருட்களை எடுத்துச் செல்லும் பை என்ற சூழல்சார்ந்த பொருளை வாசகருக்கு இயல்பாக உணர்த்துகிறது; ‘பயண மூட்டை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὑποδημάτων
  choice: செருப்புகள்
  rationale: நற்செய்தி நூல்களின் பயணச் சூழலுக்குப் பொருத்தமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான சொல்.
- source_word: μή τινος ὑστερήσατε
  choice: உங்களுக்கு ஏதாவது குறை இருந்ததா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வியின் தன்மையையும், ஏதாவது தேவையில் குறைவுபட்டார்களா என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Οὐθενός
  choice: ஒன்றும் இல்லை
  rationale: கிரேக்கப் பதிலின் சுருக்கத்தையும் முழுமையான மறுப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀπέστειλα
  choice: நான் உங்களை அனுப்பியபோது
  rationale: ஒரு பணிக்காக அவர்களை அனுப்பிய சூழலில் வினையின் பொருளைத் தெளிவாகக் காக்கிறது; தமிழில் தனியாக ‘வெளியே’ சேர்க்க வேண்டிய அவசியமில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பட்டியலில் உள்ள ஒவ்வொரு பொருளோடும் ‘-உம்’ இணைப்பைப் பயன்படுத்தி, அவை எதுவும் இல்லாமல் அனுப்பப்பட்டனர் என்ற கிரேக்க அமைப்பு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
