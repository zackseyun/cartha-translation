language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: ta
  text: நீங்கள் அந்த வீட்டின் தலைவரிடம், ‘ஆசிரியர் உங்களிடம், “என் சீடர்களோடு பஸ்கா உணவை உண்பதற்கான விருந்தினர் அறை[a] எங்கே இருக்கிறது?” என்று கேட்கிறார்’ என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்குமிடம்.’ κατάλυμα என்னும் கிரேக்கச் சொல் தங்குவதற்கான இடத்தையோ விருந்தினர் அறையையோ குறிக்கிறது. இங்கு அது குறிப்பாக ‘சத்திரம்’ என்று பொருள்படாது; ‘மேலறை’ என்ற விவரம் அடுத்த வசனத்தில்தான் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: அந்த வீட்டின் தலைவரிடம்
  rationale: οἰκοδεσπότης என்பது வீட்டுக்குடும்பத்தின் பொறுப்பும் அதிகாரமும் உடைய தலைவரைக் குறிக்கிறது. ‘வீட்டின் தலைவர்’ என்பது ‘உரிமையாளர்’ என்று தேவையின்றிக் குறுக்காமல், நவீன தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: ὁ διδάσκαλος
  choice: போதகர்
  rationale: διδάσκαλος இங்கு இயேசுவைக் குறிக்கும் அறியப்பட்ட பட்டமாக வருகிறது. ‘போதகர்’ என்பது கற்பிப்பவரைக் குறிக்கும் மரியாதையான, வேதாகமச் சூழலுக்கு இயல்பான தமிழ்ச் சொல்; ‘குரு’ போன்ற கூடுதல் சமயப் பொருளை இதில் புகுத்தவில்லை.
- source_word: κατάλυμα
  choice: விருந்தினர் அறை
  rationale: κατάλυμα என்பது தங்குவதற்கான இடம் அல்லது விருந்தினருக்கான அறையைக் குறிக்கலாம். வீட்டுச் சூழலில் ‘விருந்தினர் அறை’ இயல்பாகப் பொருந்துகிறது; ‘சத்திரம்’ அல்லது ‘மேலறை’ என்று கிரேக்கச் சொல்லுக்கு அப்பாற்பட்ட விவரத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τὸ πάσχα
  choice: பஸ்கா உணவு
  rationale: πάσχα பண்டிகையையோ அதற்குரிய உணவையோ குறிக்கலாம். φάγω (‘உண்பேன்’) என்பதால் இங்கு உணவு முன்னிலையில் உள்ளது; தமிழில் தெளிவாக இருக்க ‘பஸ்கா உணவு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: என் சீடர்களோடு
  rationale: μαθητής என்பது வெறும் மாணவர்களையல்ல, இயேசுவைப் பின்பற்றிக் கற்றுக்கொள்பவர்களைக் குறிக்கிறது; ‘சீடர்கள்’ அந்த உறவுப் பொருளைக் காக்கிறது.
- source_word: φάγω
  choice: உண்பதற்கான
  rationale: ὅπου என்பதுடன் வரும் அகராதி இறந்தகாலத் துணைவினை வடிவம் இங்கு எதிர்நோக்கப்படும் செயலைக் குறிக்கிறது. தமிழில் ‘உண்பதற்கான ... அறை’ என்பது நோக்கத்தையும் எதிர்பார்ப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐρεῖτε
  choice: சொல்லுங்கள்
  rationale: எதிர்காலச் சுட்டுவினை இச்சூழலில் சீடர்களுக்கான அறிவுறுத்தலாகச் செயல்படுகிறது. தமிழில் கட்டளை வடிவம் அந்த உரையாடல் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: διδάσκαλος என்னும் இயேசுவின் தற்சுட்டுப் பட்டத்தை மொழிபெயர்த்தல்
  choice: போதகர்
  alternative: ஆசிரியர்; குரு
  rationale: பட்டத்தை ஒலிபெயர்க்காமல் அதன் கற்பித்தல் பொருளை மொழிபெயர்க்கிறது. ‘ஆசிரியர்’ பள்ளிக்கூடச் சூழலை மிகுதியாக நினைவூட்டலாம்; ‘குரு’ கூடுதல் சமயப் பொருளை ஏற்றக்கூடும். ‘போதகர்’ இச்சூழலில் அறியப்பட்ட பட்டமாகவும் இயல்பாகவும் உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. மேற்கோளுக்குள் வரும் உரை தெளிவாக அடுக்கப்பட்டுள்ளது; ‘உம்மிடம்’ என்பது வீட்டுத் தலைவரை நேரடியாகவும் மரியாதையாகவும் குறிப்பிடுகிறது.
