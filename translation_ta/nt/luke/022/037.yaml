id: LUK.22.37
reference: Luke 22:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: ‘சட்டத்தை மதியாதவர்களோடு அவர் எண்ணப்பட்டார்’[a] என்று எழுதப்பட்டுள்ள இது என்னில் நிறைவேற வேண்டும். ஏனெனில், என்னைப் பற்றியது முடிவை அடைகிறது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மரபுவழியாக: “அக்கிரமக்காரர்களோடு அவர் எண்ணப்பட்டார்” (ஏசாயா 53:12).'
    reason: alternative_reading
  - marker: b
    text: அல்லது, “என்னைப் பற்றியது அதன் நிறைவை அடைகிறது” அல்லது “நிறைவேறுகிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: γάρ தரும் விளக்கத் தொடர்பை ‘ஏனெனில்’ காக்கிறது; λέγω ... ὑμῖν என்பதற்கு நவீன தமிழில் இயல்பான ‘உங்களுக்குச் சொல்கிறேன்’ பயன்படுத்தப்பட்டது.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: எழுதப்பட்டுள்ள இது
  rationale: ‘வேதவாக்கியம்’ என்று கிரேக்கத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்க்காமல், சுட்டுப்பெயரையும் எழுதப்பட்டுள்ள நிலையைச் சுட்டும் நிறைவுற்ற வினையெச்சத்தையும் காக்கிறது.
- source_word: δεῖ τελεσθῆναι
  choice: நிறைவேற வேண்டும்
  rationale: δεῖ என்பதன் அவசியத்தையும், எழுதப்பட்ட தீர்க்கவாக்கு நிகழ்வில் நிறைவேறுவதைக் குறிக்கும் τελεσθῆναι என்பதன் சூழல்சார் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοί
  choice: என்னில்
  rationale: இயேசுவின் நபரிலும் அவருக்கு நிகழப்போவதிலும் இவ்வாக்கு நிறைவேறுவதைச் சுட்டும் கிரேக்க முன்னிடைச்சொல்லை மிகையாக விளக்காமல் நேரடியாகக் காக்கிறது.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: சட்டத்தை மதியாதவர்களோடு அவர் எண்ணப்பட்டார்
  rationale: ἀνόμων என்பதிலுள்ள ‘சட்டமற்ற/சட்டத்தைப் பொருட்படுத்தாத’ கருத்தை சாதாரண வாசகருக்குப் புரியும் தமிழில் தருகிறது; ἐλογίσθη என்பதன் செயப்பாட்டு வடிவம் ‘எண்ணப்பட்டார்’ எனக் காக்கப்படுகிறது.
- source_word: τὸ περὶ ἐμοῦ
  choice: என்னைப் பற்றியது
  rationale: ஒருமை நடுநிலைச் சொற்றொடரின் தெளிவின்மையைப் பன்மையாக்காமலும் குறிப்பிட்ட நிகழ்வுகளாக விரிவாக்காமலும் காக்கிறது.
- source_word: τέλος ἔχει
  choice: அதன் முடிவை அடைகிறது
  rationale: τέλος என்பதில் உள்ள முடிவு, நிறைவு ஆகிய இரு நிழற்பொருள்களையும் முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல், நியமிக்கப்பட்ட நிகழ்ச்சி நிறைவுநிலையை நோக்கிச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏசாயா 53:12 மேற்கோளில் ἀνόμων என்பதன் மொழிபெயர்ப்பு
  choice: சட்டத்தை மதியாதவர்களோடு அவர் எண்ணப்பட்டார்
  alternative: அக்கிரமக்காரர்களில் ஒருவராக அவர் எண்ணப்பட்டார்
  rationale: முதன்மை வாசகம் ἀνόμων என்பதிலுள்ள சட்டம் சார்ந்த பொருளை வெளிப்படுத்துகிறது. தமிழ்க் கிறிஸ்தவ மரபில் அறிமுகமான ‘அக்கிரமக்காரர்கள்’ என்ற வடிவம் மேற்கோளின் தொடர்பை அறிய உதவுவதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τέλος ἔχει என்பதில் முடிவா அல்லது நிறைவா
  choice: அதன் முடிவை அடைகிறது
  alternative: அதன் நிறைவை அடைகிறது / நிறைவேறுகிறது
  rationale: பாடுபடுதல் சூழலில் நிறைவு என்ற பொருள் வலுவாக இருந்தாலும், கிரேக்கத் தொடர் முடிவையும் நிறைவையும் ஒருங்கே உணர்த்த முடியும். முதன்மை வாசகம் அந்தத் திசைமாற்றத்தைத் திறந்தே வைக்கிறது; நிறைவு சார்ந்த வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும், மரியாதையும் வேதவாக்கியத்துக்குரிய கண்ணியமும் கொண்ட நடை. தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டன; மூலத்திலுள்ள முடிவு/நிறைவு சார்ந்த பொருள் இழுப்பு அடிக்குறிப்புடன் காக்கப்பட்டது.
