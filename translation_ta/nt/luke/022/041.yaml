  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: ta
  text: அவரோ அவர்களிடமிருந்து ஏறக்குறைய ஒரு கல் எறியும் தூரம் விலகிச் சென்று[a], முழங்காலிட்டு[b] ஜெபித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு கல்லை எறிந்தால் சென்று விழும் அளவு தூரம்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘முழங்கால்களை வைத்துவிட்டு’; அதாவது, ‘முழங்காலிட்டு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: விலகிச் சென்று
  rationale: செயப்பாட்டு வடிவம் இச்சூழலில் அவர் சீடர்களிடமிருந்து தம்மைப் பிரித்துக்கொண்டு சென்றதை இயல்பாகக் குறிக்கிறது; வேண்டுமென்றே விலகிய இயக்கத்தையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὡσεὶ λίθου βολήν
  choice: ஏறக்குறைய ஒரு கல் எறியும் தூரம்
  rationale: ὡσεὶ என்பதன் தோராயப் பொருளையும், λίθου βολήν என்ற வழக்கமான தூர அளவீட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: θεὶς τὰ γόνατα
  choice: முழங்கால்படியிட்டு
  rationale: சொல்லுக்குச் சொல் 'முழங்கால்களை வைத்தபின்' என்றாலும், இது முழங்காலில் நின்ற உடல் நிலையைச் சுட்டும் மரபுத்தொடர்; 'முழங்கால்படியிட்டு' என்பது இன்றைய தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: προσηύχετο
  choice: வேண்டிக்கொண்டிருந்தார்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்நிலைத் தன்மையை '-க்கொண்டிருந்தார்' காக்கிறது; இச்சூழலில் கடவுளிடம் வேண்டுதல் செய்வதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: αὐτὸς
  choice: அவர்
  rationale: எழுவாயைத் தெளிவாகக் குறிக்கிறது. கிரேக்கத்தில் உள்ள மெலிந்த வலியுறுத்தலைத் தமிழில் செயற்கையான 'அவரே' மூலம் மிகைப்படுத்தாமல் விடுகிறது.
- source_word: καὶ
  choice: (தொடர்ச்சியாக அமைக்கப்பட்டது)
  rationale: வசனத்தின் கதைத் தொடர்ச்சி தமிழ்ச் சொற்றொடரமைப்பில் இயல்பாக வெளிப்படுவதால் தொடக்கத்தில் தனியாக 'மேலும்' சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ஜெப நிலையும் கிறிஸ்துவைப் பற்றிய சித்தரிப்பும்
  choice: இயேசு உடலளவில் விலகிச் சென்று, முழங்கால்படியிட்டு வேண்டிக்கொண்டிருந்ததாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இச்செயல்களுக்கு பக்திசார் அல்லது கோட்பாட்டுச் சார்ந்த விளக்கங்களை மொழிபெயர்ப்புக்குள் சேர்த்தல்.
  rationale: மூலவசனம் அவரது இயக்கம், உடல் நிலை, தொடர்ந்த வேண்டுதல் ஆகியவற்றை மட்டும் விவரிக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. தொடர்ச்சியான வேண்டுதலைக் காட்ட ‘வேண்டிக்கொண்டிருந்தார்’ பயன்படுத்தப்பட்டது; மூலத்தின் மரபுத்தொடர்களுக்கான நேரடி வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
