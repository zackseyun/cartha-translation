id: LUK.22.27
reference: Luke 22:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: ta
  text: ஏனெனில், யார் பெரியவர்—விருந்தில் சாய்ந்து அமர்ந்திருப்பவரா[a], பரிமாறுகிறவரா? விருந்தில் சாய்ந்து அமர்ந்திருப்பவர்தானே? ஆனால் நான் உங்கள் நடுவில் பரிமாறுகிறவராக இருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அக்கால விருந்து வழக்கில் உணவருந்துவோர் மேசையருகே சாய்ந்து அமர்ந்திருப்பார்கள்; பணிவிடை செய்வோர் அவர்களுக்குப் பரிமாறுவார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: ஏனெனில், யார் பெரியவர்
  rationale: τίς என்பதன் நேரடியான வினாப்பொருளையும் μείζων என்பதன் ஒப்பீட்டு வலிமையையும் காக்கிறது. γὰρ முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὁ ἀνακείμενος
  choice: விருந்தில் சாய்ந்து அமர்ந்திருப்பவர்
  rationale: உணவு அல்லது விருந்து சூழலில் ἀνάκειμαι என்பது வழக்கப்படி சாய்ந்து அமர்ந்திருப்பதைக் குறிக்கிறது. ‘விருந்தில்’ என்பது தமிழில் சூழலை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: ὁ διακονῶν
  choice: பரிமாறுகிறவர்
  rationale: இங்கு விருந்தில் உணவருந்துபவருக்கும் பணிவிடை செய்பவருக்கும் இடையிலான வேறுபாடு பேசப்படுகிறது. ‘பரிமாறுகிறவர்’ என்பது வினைச்சொல் சார்ந்த பொருளைக் காத்து, சபைப் பதவியையோ அடிமை நிலையையோ தேவையின்றி சேர்க்காமல் இருக்கிறது.
- source_word: οὐχὶ ὁ ἀνακείμενος
  choice: சாய்ந்து அமர்ந்திருப்பவர்தானே?
  rationale: οὐχί நேர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி. ‘தானே?’ என்பது அந்த எதிர்பார்ப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγὼ δὲ
  choice: ஆனால் நான்
  rationale: δέ சமூக வழக்கத்திற்கும் இயேசுவின் நடத்தைக்கும் உள்ள முரண்பாட்டைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: நான் உங்கள் நடுவில் ... இருக்கிறேன்
  rationale: குழுவினரிடையே இருப்பதை இயல்பாகத் தெரிவிக்கிறது; கிரேக்கத்தின் இடவியல் உருவகத்தையும் ஓரளவு காக்கிறது.
- source_word: ὡς ὁ διακονῶν
  choice: பரிமாறுகிறவரைப் போல
  rationale: ὡς காட்டும் பங்கு அல்லது ஒப்புமையைப் பாதுகாக்கிறது; இயேசுவை ஒரு பெயர்ச்சொல் மூலம் ‘வேலைக்காரர்’ என்று வலுப்படுத்தாமல், அவர் செய்கிற பணிவிடையை முன்னிறுத்துகிறது.
theological_decisions:
- issue: இயேசு தம்மைச் சேவை செய்பவராக விவரித்தல்
  choice: ஆனால் நான் உங்கள் நடுவில் பரிமாறுகிறவரைப் போல இருக்கிறேன்.
  alternative: ஆனால் நான் உங்கள் நடுவில் ஒரு வேலைக்காரனைப் போல இருக்கிறேன்.
  rationale: கிரேக்கம் δοῦλος என்ற ‘அடிமை/வேலைக்காரன்’ பெயர்ச்சொல்லைப் பயன்படுத்தாமல் διακονῶν என்ற நிகழ்காலப் பங்கேற்பு வினை வடிவைப் பயன்படுத்துகிறது. ஆகவே உடனடியான விருந்து சூழலையும் தாழ்மையான பணிவிடையையும் காத்து, அதற்கு மேல் ஒரு சமூக நிலையையோ திருச்சபைப் பதவியையோ உரையில் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘பெரியவர்’ என்பது பதவி, மதிப்பு, முக்கியத்துவம் ஆகியவற்றுக்கிடையிலான மூலத்தின் பரந்த பொருளைத் தீர்மானிக்காமல் காக்கிறது.
