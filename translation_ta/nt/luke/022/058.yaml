  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: ta
  text: சிறிது நேரத்திற்குப் பிறகு, வேறொருவன் அவனைப் பார்த்து, “நீயும் அவர்களில் ஒருவன்தான்” என்றான். ஆனால் பேதுரு, “மனிதனே, நான் அல்ல[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “நான் அவர்களில் ஒருவன் அல்ல” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “நான் அல்ல” என்று மட்டுமே உள்ளது; முன் கூறப்பட்ட குற்றச்சாட்டிலிருந்து புரியப்படும் பயனிலை விடுபட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: சிறிது நேரத்திற்குப் பிறகு
  rationale: குறுகிய ஓர் இடைவெளிக்குப் பிந்தைய நேரத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: ἕτερος
  choice: வேறொருவன்
  rationale: ‘வேறொருவர்’ என்ற பொருளுடன், கிரேக்க ஆண்பால் ஒருமை வடிவையும் சூழலில் உள்ள ஆண் பேச்சாளரையும் வெளிப்படுத்துகிறது.
- source_word: ἰδὼν αὐτὸν
  choice: அவனைப் பார்த்து
  rationale: இறந்தகாலப் பங்கேற்புவினையின் பின்னணிச் செயலைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: நீயும் அவர்களில் ஒருவன்தான்
  rationale: இங்கு ἐξ αὐτῶν என்பது தோற்றுவாயை அல்ல, அந்தக் குழுவைச் சேர்ந்திருப்பதைக் குறிக்கிறது; ‘-தான்’ குற்றச்சாட்டின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: Ἄνθρωπε
  choice: ஐயா
  rationale: நேரடி அழைப்பான ἄνθρωπε-ஐ நவீனத் தமிழில் இயல்பாகக் கூறுகிறது. ‘மனிதனே’ என்பது மிகச் சொற்சொறானதும் இச்சூழலில் செயற்கையானதும் ஆகும்.
- source_word: οὐκ εἰμί
  choice: நான் அல்ல
  rationale: கிரேக்கத்தில் பயனிலை விடுபட்டுள்ள சுருக்கமான மறுப்பைத் தமிழிலும் பாதுகாக்கிறது. ‘நான் இல்லை’ என்பது தமிழில் இருப்பையே மறுப்பதாகத் தவறாகப் புரியக்கூடும்.
