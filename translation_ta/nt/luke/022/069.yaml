  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: ta
  text: ஆனால், இப்போதுமுதல் மனிதகுமாரன் கடவுளுடைய வல்லமையின் வலப்பக்கத்தில் அமர்ந்திருப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமையின் வலப்பக்கத்தில்.” இந்த மாற்று மொழிபெயர்ப்பில் “வல்லமை” கடவுளைக் குறிக்கும் மரியாதைச் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: இப்போதுமுதல்
  rationale: ஒரே சொல்லாக இயல்பாக அமைந்து, இந்தக் கணத்திலிருந்து முன்னோக்கித் தொடரும் காலப்பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இயேசுவின் பதிலில் வரும் மாறுபாட்டையும் திருப்பத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἔσται
  choice: இருப்பார்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை நேரடியாகக் காட்டுகிறது; தமிழில் மனிதகுமாரனைக் குறிக்கும் மரியாதை ஒருமையுடன் அமைக்கப்பட்டுள்ளது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: தானியேல் நூலுடனான தொடர்பையும், இயேசுவின் நிலைபெற்ற தன்னடையாளத்தின் பொருள் செறிவையும் தெளிவுபடுத்தாமல் அப்படியே பாதுகாக்கும் மரபான தமிழ் வடிவம்.
- source_word: καθήμενος
  choice: அமர்ந்திருப்பார்
  rationale: எதிர்கால ἔσται உடன் சேர்ந்த தொடர்நிலை அமர்வையும், அரச அதிகாரத்தைச் சுட்டும் அரியணைச் சாயலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ δεξιῶν
  choice: வலப்பக்கத்தில்
  rationale: உயர்ந்த மரியாதை மற்றும் அதிகாரத்தின் இடத்தைக் குறிக்கும் வேதாகமச் சொல்லாட்சியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: τῆς δυνάμεως
  choice: வல்லமையின்
  rationale: δύναμις என்பதன் ஆற்றல் மற்றும் அதிகாரச் சாயலைத் தரும் dignified, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: அந்த வல்லமை யாருடையது என்பதை கிரேக்க மூலத்தைப் போல வெளிப்படையாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: மனிதகுமாரனின் உயர்த்தப்படுதலையும் தெய்வீக அதிகாரத்தையும் குறிக்கும் சொற்றொடர்
  choice: மனிதகுமாரன் கடவுளுடைய வல்லமையின் வலப்பக்கத்தில் அமர்ந்திருப்பார்
  alternative: மனிதகுமாரன் வல்லமையின் வலப்பக்கத்தில் அமர்ந்திருப்பார்
  rationale: தெய்வீக அதிகாரத்தில் பங்குகொள்ளும் வலுவான கூற்றையும் சங்கீதம் 110 மற்றும் தானியேல் 7 ஆகியவற்றின் எதிரொலியையும் பாதுகாக்கிறது. அதேவேளை, ‘வல்லமை’ என்பது கடவுளைக் குறிக்கும் மரியாதை வழக்காக இருக்கக்கூடிய மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகமத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மனிதகுமாரன்’ மற்றும் ‘வலப்பக்கத்தில்’ ஆகிய சொற்கள் உரையின் மறைநூல் தொடர்புகளையும் இறையியல் பதற்றத்தையும் விளக்கமாக மாற்றாமல் பாதுகாக்கின்றன.
