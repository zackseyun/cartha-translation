  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: ta
  text: தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும் அவரை எப்படிக் கொல்லலாம் என்று வழி தேடிக்கொண்டிருந்தார்கள்; ஏனெனில் அவர்கள் மக்களுக்குப் பயந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτουν
  choice: வழி தேடிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த முயற்சியைக் காட்டும் imperfect வினையின் கூறை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; τὸ πῶς என்பதோடும் இணைந்து செயல்முறையைத் தேடியதாகத் தெளிவாக்குகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: எருசலேம் ஆலயத்தின் முதன்மை ஆசாரியத் தலைமைக் குழுவைக் குறிக்கும் பன்மையை, பல ‘பிரதான ஆசாரியர்கள்’ இருந்ததாகத் தவறாக உணர்த்தாமல் வழங்குகிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: யூத மறைநூல்களிலும் அவற்றின் சட்ட விளக்கத்திலும் தேர்ச்சி பெற்றவர்களை சாதாரண வாசகருக்குப் புரியுமாறு குறிக்கிறது; ‘எழுத்தர்கள்’ என்பது இச்சூழலில் தவறாகப் புரியக்கூடும்.
- source_word: τὸ πῶς
  choice: எப்படி
  rationale: ‘எவ்வாறு/எந்த வழியில்’ என்ற கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ் இணை.
- source_word: ἀνέλωσιν
  choice: கொல்லலாம்
  rationale: இங்கு ἀναιρέω உயிரைப் போக்குவதைக் குறிக்கிறது. தலைவர்களின் கொலை நோக்கத்தை மென்மைப்படுத்தாமலும், இன்னும் குறிப்பிடப்படாத நீதிமுறை மரணதண்டனையைச் சேர்க்காமலும் நேரடியாகத் தருகிறது.
- source_word: ἐφοβοῦντο
  choice: பயந்தார்கள்
  rationale: அவர்கள் மக்களிடம் கொண்டிருந்த நீடித்த அச்சநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் அதன் தொடர்ச்சி தெளிவாக இருப்பதால் செயற்கையான தொடர்நிலை வடிவம் தேவையில்லை.
- source_word: τὸν λαόν
  choice: மக்கள்
  rationale: λαός குறிக்கும் கூட்டு மக்களைக் பரந்தவாறு தக்கவைக்கிறது; ‘கூட்டம்’ என மொழிபெயர்த்தால் அப்போது கூடியிருந்த ஒரு குறிப்பிட்ட கூட்டமாக பொருள் குறுகிவிடும்.
theological_decisions:
- issue: ἀνέλωσιν காட்டும் தலைவர்களின் நோக்கம்
  choice: கொல்லலாம்
  alternative: ஒழித்துக்கட்டலாம்; மரணதண்டனை விதிக்கலாம்
  rationale: கிரேக்கம் அவரை உயிரோடு அகற்றுவதல்ல, கொல்வதையே குறிக்கிறது. ‘கொல்லலாம்’ பகைமையின் தீவிரத்தைத் தக்கவைக்கிறது; அதேவேளையில் முறையான நீதித்துறைச் செயல்முறையை முன்கூட்டியே சேர்ப்பதில்லை.
- issue: λαός என்பதன் குறிப்பு
  choice: மக்கள்
  alternative: கூட்டம்
  rationale: தலைவர்கள் அஞ்சிய பொதுமக்களின் எதிர்வினை என்ற பரந்த கதைத் திருப்பத்தைப் பாதுகாக்கிறது; குறிப்பிட்ட இடத்தில் கூடிய கூட்டம் என்று தேவையின்றிக் குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை. ‘தலைமைக் குருக்கள்’ மற்றும் ‘மறைநூல் அறிஞர்கள்’ என்பவை வரலாற்றுப் பணிகளைப் புரியவைக்கும் வாசகர் நட்பு சொற்கள். கிரேக்கத்தின் காரணவாக்கியம் ‘ஏனெனில்’ மூலம் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
