  source_fidelity: 'கருத்து முழுமையாக மூலக் கிரேக்கத்துடன் ஒத்துள்ளது: தொடர்ச்சியான தேடல் (ἐζήτουν), அவரைக் கொல்லும் நோக்கம் (ἀνέλωσιν), மற்றும் மக்களைப் பற்றிய அச்சம் (ἐφοβοῦντο ... τὸν λαόν) அனைத்தும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் ‘தலைமைக் குருக்கள்’ என்பதற்குப் பதில் ‘தலைமை ஆசாரியர்கள்’ என்பது ἀρχιερεῖς என்பதன் ஆலயப் பதவிசார் பொருளைத் தெளிவாகவும் நிலையான வேதாகமப் பயன்பாட்டிலும் தருகிறது.'
