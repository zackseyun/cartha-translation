reference: Luke 22:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀκεῖνος ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον· ἐκεῖ ἑτοιμάσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: ta
  text: அவர் உங்களுக்குப் மேல்தளத்தில் உள்ள ஒரு பெரிய, ஆயத்தமாக அமைக்கப்பட்ட[a] அறையைக் காட்டுவார்; அங்கே ஆயத்தம் செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தளபாடங்கள் அமைக்கப்பட்ட”; அல்லது, “விரிப்புகள் விரிக்கப்பட்ட.”
    reason: ἐστρωμένον என்பது விரிக்கப்பட்டு அல்லது ஏற்பாடு செய்யப்பட்ட நிலையில் இருப்பதைக் குறிக்கிறது; சூழலில் உணவுக்கான இருக்கைகள் அல்லது தளபாடங்கள் அமைக்கப்பட்டிருப்பதும் உட்பொருளாக இருக்கலாம்.
lexical_decisions:
- source_word: κἀκεῖνος
  choice: அவர்
  rationale: καί + ἐκεῖνος முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வீட்டின் உரிமையாளரைக் குறிக்கிறது. தொடர்ச்சியைத் தமிழில் இயல்பாகப் பேண, தனியே ‘அவரும்’ என்று மொழிபெயர்க்காமல் ‘அவர்’ என வழங்கப்பட்டுள்ளது.
- source_word: ὑμῖν δείξει
  choice: உங்களுக்கு ... காட்டுவார்
  rationale: எதிர்கால வினையான δείξει மற்றும் மறைமுகப் பொருளான ὑμῖν ஆகியவற்றைத் தமிழில் நேராகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀνάγαιον μέγα
  choice: மாடியில் உள்ள ஒரு பெரிய அறை
  rationale: ἀνάγαιον என்பது கட்டிடத்தின் மேல்தள அறையைக் குறிக்கிறது; ‘மாடியில் உள்ள அறை’ என்பது நவீனத் தமிழில் தெளிவான இயல்பான சொற்றொடர். μέγα ‘பெரிய’ என நேரடியாக வழங்கப்பட்டுள்ளது.
- source_word: ἐστρωμένον
  choice: விருந்து உண்ணுவதற்காக ஆயத்தமாக அமைக்கப்பட்டிருக்கும்
  rationale: στρώννυμι என்பதன் நிறைவேற்றப்பட்ட நிலை, அறை விரிக்கப்பட்டோ உணவுக்கான படுக்கை இருக்கைகள் அமைக்கப்பட்டோ தயாராக இருப்பதைக் குறிக்கலாம். வெறும் ‘அலங்கரிக்கப்பட்ட’ அல்லது ‘தளபாடங்களுள்ள’ என்று மிகையாகக் குறிப்பிடாமல், சூழலுக்கேற்ற செயற்பாட்டு பொருள் வழங்கப்பட்டுள்ளது.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: அங்கே ஆயத்தம் செய்யுங்கள்
  rationale: ἐκεῖ என்பதன் இடக் குறிப்பையும், பன்மை ஏவல் வினையான ἑτοιμάσατε என்பதன் கட்டளை வலிமையையும் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானதாயும் மரியாதைமிக்கதாயும் அமைந்த நடை. மேல்தள அறையையும் அதன் ஆயத்த நிலையையும் சாதாரண வாசகர் தெளிவாகப் புரிந்துகொள்ளுமாறு மொழிபெயர்க்கப்பட்டுள்ளது; கிரேக்கச் சொல்லின் lexical ambiguity அடிக்குறிப்பில் பேணப்பட்டுள்ளது.
