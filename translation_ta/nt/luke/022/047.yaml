id: LUK.22.47
reference: Luke 22:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: ta
  text: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே, இதோ, ஒரு கூட்டம் வந்தது. பன்னிருவரில் ஒருவனான யூதாஸ் என்று அழைக்கப்பட்டவன் அவர்களுக்கு முன்னால் சென்றுகொண்டிருந்தான்[a]. அவன் இயேசுவை முத்தமிட அவரிடம் நெருங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை வழிநடத்திச் சென்றான்”; அல்லது, “அவர்களுக்கு முன்பாகச் சென்றான்.”
    reason: προήρχετο αὐτούς என்பதற்கு ‘அவர்களுக்கு முன்னால் சென்றான்’ என்பது முதன்மையான பொருள். சூழலுக்கு ஏற்ப ‘அவர்களை வழிநடத்திச் சென்றான்’ என்றும் கொள்ளலாம்; ஆனால் மூலத்தில் இல்லாத ‘வந்தான்’ என்ற வருகை நுணுக்கத்தைச் சேர்க்காமல் மாற்று தரப்பட்டுள்ளது.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: தொடர்ந்து நடந்துகொண்டிருந்த பேச்சோடு அடுத்த நிகழ்வு ஒரே நேரத்தில் நடந்ததை இந்தப் பிறவினைத் தொகை காட்டுகிறது; ‘இன்னும்’ என்பது ἔτι என்பதன் காலத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கூட்டத்தின் திடீர் தோற்றத்தின்மீது வாசகரின் கவனத்தைத் திருப்பும் கதைசொல்லல் குறியீட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὄχλος
  choice: ஒரு கூட்டம் வந்தது
  rationale: ὄχλος என்பது மக்கள் கூட்டத்தைக் குறிக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத வருகை வினை, சூழலில் உள்ள திடீர் தோற்றத்தைத் தமிழில் முழுமையான வாக்கியமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: யூதாஸ் எனப்பட்டவன்
  rationale: யூதாஸை அடையாளப்படுத்தும் பங்கேற்புவினைத் தொடரை கூடுதல் மதிப்பீடு அல்லது இகழ்ச்சிப் பொருள் சேர்க்காமல் நெருக்கமாகத் தருகிறது.
- source_word: εἷς τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவன்
  rationale: யூதாஸ் பன்னிருவருள் சேர்ந்தவன் என்ற அடையாளத்தையும் அதன் கதைமுரணையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: προήρχετο αὐτούς
  choice: அவர்களுக்கு முன்னால் சென்றுகொண்டிருந்தான்
  rationale: குழுவினருக்கு முன்பாகச் சென்ற நிலையைத் தெரிவிக்கிறது; தொடர்ந்த செயலைக் குறிக்கும் இறந்தகால வடிவின் அம்சத்தையும் காக்கிறது. முறையான தலைமை வகித்தான் என்று தேவைக்கு அதிகமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: இயேசுவிடம் நெருங்கினான்
  rationale: இயேசுவை நோக்கி அணுகிய செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: φιλῆσαι αὐτόν
  choice: அவரை முத்தமிட
  rationale: இச்சூழலில் φιλέω என்பதன் நேரடியான பொருளான முத்தமிடுதலை மட்டும் கூறி, அதன் நோக்கத்தை விளக்கும் கருத்தை மூலவசனத்திற்கு அப்பால் சேர்க்கவில்லை.
theological_decisions:
- issue: யூதாஸின் அணுகலும் முத்தமும் எவ்வாறு சித்தரிக்கப்பட வேண்டும்
  choice: அவன் இயேசுவை முத்தமிட நெருங்கியதாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘முத்தமிட்டு அவரைக் காட்டிக்கொடுக்க’ என்று நோக்கத்தை வெளிப்படையாகச் சேர்த்தல்
  rationale: சுற்றியுள்ள நிகழ்வுகளில் துரோகம் தெளிவாக இருந்தாலும், இவ்வசனம் அணுகலையும் முத்தமிடும் நோக்கத்தையுமே சொல்கிறது. ஆகவே மூலத்தில் இல்லாத ‘காட்டிக்கொடுக்க’ என்ற விளக்கத்தைச் சேர்க்காமல் கதையின் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்பது கதைசொல்லலின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘எனப்பட்டவன்’ மூலத்தின் அடையாளப்படுத்தும் வடிவை அளவான இலக்கிய நடையில் பாதுகாக்கிறது.
