base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: ta
  text: அவரைக் கைது செய்து, அவர்கள் அவரை அழைத்துச் சென்று தலைமை ஆசாரியரின் வீட்டுக்குள் கொண்டுசென்றார்கள். பேதுருவோ தொலைவில்[a] பின்தொடர்ந்து கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
