    text: அல்லது, ‘தொலைவிலிருந்து’; மரபுவழியாக, ‘தூரத்திலே.’
    reason: μακρόθεν என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்புகளைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: கைதுசெய்த
  rationale: சυλλαμβάνω இங்கு இயேசுவைப் பிடித்துக் காவலில் கொண்ட நிகழ்வைக் குறிக்கிறது. இறந்தகால வினையெச்சம் முதன்மைச் செயல்களுக்கு முந்திய செயலைக் காட்டுவதால், ‘கைதுசெய்த அவர்கள்’ என்பது பொருளையும் கால உறவையும் இயல்பாகத் தருகிறது.
- source_word: ἤγαγον
  choice: அழைத்துக்கொண்டு போய்
  rationale: ἄγω என்பது வழிநடத்துதல் அல்லது கொண்டுபோதலைக் குறிக்கிறது. காவலில் ஓரிடத்திலிருந்து அழைத்துச் செல்லப்பட்ட இயக்கத்தை இச்சொற்றொடர் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰσήγαγον
  choice: வீட்டுக்குள் கொண்டுசென்றார்கள்
  rationale: εἰσάγω என்பதில் உள்ள ‘உள்ளே’ என்ற திசை உணர்வை ‘வீட்டுக்குள்’ தெளிவாக வெளிப்படுத்துகிறது; முந்தைய இயக்க வினையிலிருந்து வேறுபடுத்தவும் ‘கொண்டுசென்றார்கள்’ உதவுகிறது.
- source_word: οἰκίαν
  choice: வீடு
  rationale: இங்கு οἰκία ஒரு உடற்கூறான வாழிடத்தைக் குறிக்கிறது. ‘வீடு’ என்பது நேரடியான, பொதுவாகப் புரியும் நவீனத் தமிழ்ச் சொல்.
- source_word: ἀρχιερέως
  choice: தலைமைக் குரு
  rationale: ἀρχιερεύς என்பதற்கான நிலைபெற்ற, துல்லியமான தமிழாக்கம் ‘தலைமைக் குரு’ ஆகும்.
- source_word: ἠκολούθει
  choice: பின்தொடர்ந்து கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடந்த செயலைக் கிரேக்க imperfect வடிவம் காட்டுகிறது. ‘கொண்டிருந்தார்’ அந்தத் தொடர்நிலையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μακρόθεν
  choice: தொலைவில்
  rationale: இந்த வினையடை இடைவெளியைக் குறிக்கிறது. ‘தொலைவில்’ என்பது இயல்பான நவீனத் தமிழ்; பேதுருவின் நோக்கத்தைப் பற்றி கூடுதல் மதிப்பீட்டைச் சேர்ப்பதில்லை.
- source_word: δὲ
  choice: பேதுருவோ
  rationale: இரண்டாவது δέ இயேசு உள்ளே கொண்டுசெல்லப்படுவதற்கும் பேதுரு தொலைவில் பின்தொடர்வதற்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது. தமிழின் ‘-ஓ’ அமைப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கைதின்போது இயேசுவுடன் பேதுருவுக்கு இருந்த தொடர்பைப் பற்றிய கதை விவரிப்பு
  choice: ‘பின்தொடர்ந்து கொண்டிருந்தார்’ என்று தொடர்நிலையை மட்டும் வெளிப்படுத்தி, ‘தொலைவில்’ என்று உடல் சார்ந்த இடைவெளியைச் சொல்வது
  alternative: ‘பயந்தபடி’ அல்லது ‘ரகசியமாக’ பின்தொடர்ந்தார் என்று நோக்கத்தை விளக்குவது
  rationale: வசனம் பேதுருவின் உள்ளார்ந்த நோக்கத்தையோ மனநிலையையோ வெளிப்படையாக மதிப்பிடவில்லை. ஆகவே, அவற்றைச் சேர்க்காமல் கதையின் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கும் பேதுருவுக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; காவலர்களின் செயல் எந்த கூடுதல் உளவியல் அல்லது இறையியல் விளக்கமும் இன்றி சொல்லப்பட்டுள்ளது.
