source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: ta
  text: அவர்கள் போய், அவர் அவர்களிடம் சொல்லியிருந்தபடியே இருந்ததைக் கண்டார்கள்; பஸ்காவை[a] ஆயத்தம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பஸ்கா விருந்து”; அல்லது, “பஸ்கா ஆட்டுக்குட்டி.” கிரேக்கச் சொல் பொதுவாகப் பஸ்கா அனுசரிப்பையோ, குறிப்பாக அதன் விருந்தையோ பலியிடப்பட்ட ஆட்டுக்குட்டியையோ குறிக்கலாம்.
    reason: πάσχα என்ற கிரேக்கச் சொல்லின் பரந்த பொருள் வரம்பையும், இச்சூழலில் சாத்தியமான குறிப்பான பொருள்களையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἀπελθόντες
  choice: அவர்கள் போய்
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான வினையெச்சத் தொடர் காலவரிசையைத் தெளிவாகக் காக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதையைத் தொடரச் செய்கிறது; தமிழின் வாக்கியத் தொடர்ச்சியே அந்தப் பணியை இயல்பாக நிறைவேற்றுகிறது.
- source_word: εὗρον
  choice: இருப்பதைக் கண்டார்கள்
  rationale: εὗρον என்பதற்கு ‘கண்டார்கள்’ என்பது நேரான பொருள். கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படாத பொருள், முன்னர் இயேசு விவரித்தபடியான சூழ்நிலை என்பதால் ‘இருப்பதை’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: καθὼς
  choice: சொல்லியிருந்தபடியே
  rationale: முன்னர் சொல்லப்பட்டதற்கும் அவர்கள் கண்டதற்கும் இருந்த துல்லியமான ஒத்திசைவை ‘படியே’ காக்கிறது.
- source_word: εἰρήκει αὐτοῖς
  choice: அவர் தங்களிடம் சொல்லியிருந்த
  rationale: இறந்தகாலத்திற்கு முன்னரே நிகழ்ந்த பேச்சை கிரேக்க முற்றிறந்தகாலம் குறிக்கிறது; ‘சொல்லியிருந்த’ அந்த காலத் தொடர்பைக் காக்கிறது. αὐτοῖς ‘தங்களிடம்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἡτοίμασαν
  choice: ஆயத்தம் செய்தார்கள்
  rationale: விருந்துக்கும் அனுசரிப்புக்கும் வேண்டியவற்றைத் தயாரித்த செயலைக் குறிக்கும் தெளிவான, கண்ணியமான நவீனத் தமிழ் நடை.
- source_word: τὸ πάσχα
  choice: பஸ்காவை
  rationale: πάσχα பண்டிகை அனுசரிப்பு, அதன் விருந்து அல்லது பலியிடப்பட்ட ஆட்டுக்குட்டி ஆகியவற்றைக் குறிக்கக்கூடும். ‘பஸ்கா’ என்பது மூலத்தின் பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: இச்சூழலில் πάσχα என்பதன் பொருள் வரம்பு
  choice: பஸ்கா
  alternative: பஸ்கா விருந்து; பஸ்கா ஆட்டுக்குட்டி
  rationale: உடனடி சூழல் பஸ்காவை உண்பதற்கான ஆயத்தத்தைப் பற்றியது. எனினும் கிரேக்கச் சொல் அனுசரிப்பு, விருந்து, பலிக்குரிய ஆட்டுக்குட்டி ஆகியவற்றில் ஒன்றையோ ஒன்றுக்கு மேற்பட்டவற்றையோ குறிக்கலாம். முதன்மை உரையில் பரந்த சொல்லைப் பயன்படுத்துவது அந்தப் பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயத்தம் செய்தார்கள்’ வேதாகமச் சூழலுக்கு ஏற்றதாகவும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாகவும் உள்ளது. அடிக்குறிப்புக் குறியீடு அது விளக்கும் ‘பஸ்கா’ என்ற சொல்லுடன் நேரடியாக இணைக்கப்பட்டுள்ளது.
