source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: ta
  text: அந்த நேரம் வந்தபோது, அவர் பந்தியில் சாய்ந்து அமர்ந்தார்[a]; அப்போஸ்தலர்களும் அவரோடு சாய்ந்து அமர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உணவு உண்ணுவதற்காகப் பந்தியில் சாய்ந்து அமர்ந்தார்; இது அக்காலத்தில் விருந்துண்ணும்போது பின்பற்றப்பட்ட வழக்கமான உடல் நிலை.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: அந்த நேரம் வந்தபோது
  rationale: குறிப்பிட்ட தருணத்தைக் காட்டும் ἡ ὥρα என்பதன் திட்டவட்டத்தையும், நிகழ்வு வந்தடைந்தது என்ற கதைநடையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἀνέπεσεν
  choice: பந்தியில் சாய்ந்து அமர்ந்தார்
  rationale: பண்டைய விருந்துண்ணும் வழக்கில் உணவுக்காகச் சாய்ந்து அமர்வதை வினைச்சொல் குறிக்கிறது. வெறுமனே ‘அமர்ந்தார்’ என்று மொழிபெயர்ப்பதைவிட இது வரலாற்றுப் பின்னணியைத் தெளிவாகக் காக்கிறது.
- source_word: οἱ ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: அறியப்பட்ட சீடர் குழுவைக் குறிக்கும் பெயர்ச்சொல்லுக்கு நேரான, வழக்கிலுள்ள தமிழ் வடிவம்; மூலத்தில் இல்லாத ‘அவருடைய’ என்பது சேர்க்கப்படவில்லை.
- source_word: σὺν αὐτῷ
  choice: அவரோடு
  rationale: சேர்ந்திருப்பதைக் குறிக்கும் σύν சொற்றொடரின் சுருக்கமான, இயல்பான மொழிபெயர்ப்பு.
- source_word: Καὶ
  choice: வாக்கியத் தொடக்கத்தில் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: தமிழ்க் கதைநடையில் காலநிலைத் துணைவாக்கியத்துடன் தொடங்குவது இயல்பானது; இணைப்பின் தொடர்ச்சி சூழலால் தெளிவாக உள்ளது.
theological_decisions:
- issue: பஸ்கா உணவின்போது பின்பற்றப்பட்ட உடல் நிலை
  choice: பந்தியில் சாய்ந்து அமர்ந்தார்
  alternative: பந்தியில் அமர்ந்தார்
  rationale: மூல வினைச்சொல் குறிக்கும் வரலாற்றுச் சிறப்புடைய உணவுப் பழக்கத்தைப் பாதுகாக்கிறது; இதன் மூலம் எந்தக் கோட்பாட்டுச் சிறப்புரையும் சேர்க்கப்படவில்லை.
- issue: அப்போஸ்தலர்களுக்கான விடுபட்ட வினைச்சொல்
  choice: சாய்ந்து அமர்ந்தார்கள் என்று வெளிப்படையாகத் தரப்பட்டது
  alternative: அப்போஸ்தலர்களும் அவரோடு இருந்தார்கள்
  rationale: கிரேக்கத்தில் இரண்டாம் கூறில் வினைச்சொல் விடுபட்டிருந்தாலும், அது முந்தைய ἀνέπεσεν என்பதிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் பொருள் தெளிவாக இருக்க வினைச்சொல் மீண்டும் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் எளிமையும் காக்கப்பட்டுள்ளன. ‘பந்தி’ என்பது உணவுக்கான இடத்தை இயல்பாக உணர்த்துகிறது; அடிக்குறிப்பு பண்டைய சாய்ந்து உண்ணும் வழக்கத்தை விளக்குகிறது.
