  text: And after going outside, he wept bitterly.
translation:
  language: ta
  text: அவர் வெளியே போய் மனங்கசந்து அழுதார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச் சொல் இல்லாமல் தொடர் வினையெச்ச அமைப்பு)
  rationale: தமிழில் ‘போய் … அழுதார்’ என்ற அமைப்பே முந்தைய நிகழ்வுடனான எளிய தொடர் இணைப்பை இயல்பாக வெளிப்படுத்துகிறது; ‘பிறகு’ என்று சேர்ப்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத கால நுணுக்கத்தை வலுப்படுத்தும்.
- source_word: ἐξελθὼν
  choice: போய்
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன்னர் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘போய்’ என்பது தமிழில் இயல்பான தொடர் வினையெச்சம்.
- source_word: ἔξω
  choice: வெளியே
  rationale: வெளிப்புறத்தை நோக்கிய இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἔκλαυσεν
  choice: அழுதார்
  rationale: κλαίω என்பதன் நேரடியான, சூழலுக்கேற்ற தமிழ் இணைச்சொல். பேதுருவைக் குறிக்கும் மரியாதை ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: πικρῶς
  choice: மனங்கசந்து
  rationale: ஆழ்ந்த துயரத்தோடும் வேதனையோடும் அழுததைக் குறிக்கும் πικρῶς என்பதற்கு இயல்பான நவீனத் தமிழ் வழக்கு; ‘கசப்பாக அழுதார்’ என்ற சொற்சொல் மொழிபெயர்ப்பின் இயல்பின்மையைத் தவிர்க்கிறது.
