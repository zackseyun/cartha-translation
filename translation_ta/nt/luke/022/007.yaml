  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: ta
  text: பின்பு புளிப்பில்லாத அப்பப் பண்டிகையின் நாள் வந்தது; அன்று பஸ்கா பலியிடப்பட வேண்டியிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பஸ்கா ஆட்டுக்குட்டி’ அல்லது ‘பஸ்கா பலி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பஸ்கா அனுசரிப்பைக் குறிக்கலாம்; இந்தச் சூழலில் அது குறிப்பாக பலியிடப்படும் உயிரினத்தையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: வந்தது
  rationale: காலமோ நாளோ வந்தடைந்ததைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழாக்கம்.
- source_word: δὲ
  choice: பின்பு
  rationale: கதையின் அடுத்த நிகழ்வைச் சுட்டும் இணைப்பாக இங்கு வருகிறது; நிகழ்வுகளின் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: புளிப்பில்லாத அப்பப் பண்டிகையின் நாள்
  rationale: கிரேக்கத்தில் ‘நாள்’ ஒருமையில் இருப்பதைப் பேணுகிறது; அதேவேளையில் இது புளிப்பில்லாத அப்பத்தைச் சார்ந்த பண்டிகை நாள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ᾗ
  choice: அன்று
  rationale: முன்னர் குறிப்பிடப்பட்ட நாளைச் சுட்டும் காலப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἔδει
  choice: வேண்டியிருந்தது
  rationale: பண்டிகை முறைப்படி இருந்த கட்டாயத்தையும் அவசியத்தையும் வெளிப்படுத்துகிறது.
- source_word: θύεσθαι
  choice: பலியிடப்பட
  rationale: இது சடங்குசார் பலியைக் குறிக்கும் சூழல் என்பதால், வெறுமனே கொல்லப்படுதல் என்பதைக் காட்டிலும் பலியிடப்படுதல் பொருத்தமானது.
- source_word: τὸ πάσχα
  choice: பஸ்கா
  rationale: கிரேக்கச் சொல்லின் பரந்த குறிப்பை முதன்மை உரையில் பேணுகிறது; பலியிடப்படும் உயிரினம் என்ற குறிப்பான பொருளை வினைச்சொல் உணர்த்துகிறது, மேலும் வெளிப்படையான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: பலியிடும் சூழலில் τὸ πάσχα எதைக் குறிக்கிறது என்பது
  choice: முதன்மை உரையில் ‘பஸ்கா’ என்று வைத்து, பலிக்குரிய பொருளை ‘பலியிடப்பட’ என்ற வினையால் உணர்த்துதல்
  alternative: ‘பஸ்கா ஆட்டுக்குட்டி’ அல்லது ‘பஸ்கா பலி’
  rationale: πάσχα என்பது பண்டிகை அனுசரிப்பையோ உணவையோ பலிக்குரிய உயிரினத்தையோ குறிக்கக்கூடும். இங்கு θύεσθαι பலியிடுதலைத் தெளிவாக்குவதால், குறிப்பை அளவுக்கு மீறி விளக்காமல் மூலத்தின் நெகிழ்வை முதன்மை உரை பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு நிகழ்வுக்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பஸ்கா’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட சொல்; மூலத்தின் பொருள் நெகிழ்வைப் பேணுவதற்காக முதன்மை உரையில் விரிவாக்கப்படவில்லை.
