  terminology: ‘பஸ்கா’ என்பது நிலையான தமிழ்க் கிறிஸ்தவச் சொல்லாட்சி. ‘பலியிடப்பட’ என்பது θύεσθαι-யின் சடங்குசார் பொருளைச் சரியாகக் காக்கிறது; ‘பஸ்கா ஆட்டுக்குட்டி’ அல்லது ‘பஸ்கா பலி’ என்ற விளக்கமான மாற்றுகளை அடிக்குறிப்பில் மட்டும் வைப்பது மூலத்தின் அளவான தெளிவின்மையைப் பாதுகாக்கிறது.
