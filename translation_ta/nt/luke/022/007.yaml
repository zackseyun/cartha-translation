  source_fidelity: மூலத்தின் காலத் தொடர்ச்சியை ‘பின்பு’ சரியாகக் காட்டுகிறது. ‘புளிப்பில்லாத அப்பப் பண்டிகையின் நாள்’ என்பது ἡ ἡμέρα τῶν ἀζύμων என்பதன் ஒருமை அமைப்பையும் பண்டிகைச் சூழலையும் காக்கிறது. ‘அன்று’ ᾗ என்பதன் காலச் சார்பை இயல்பாக வெளிப்படுத்துகிறது. ‘பலியிடப்பட வேண்டியிருந்தது’ ἔδει θύεσθαι என்பதிலுள்ள கட்டாயம் மற்றும் சடங்குசார் பலியிடுதலைத் துல்லியமாகத் தருகிறது. முதன்மை உரையில் ‘பஸ்கா’ என வைத்திருப்பது τὸ πάσχα-வின் குறிப்பு நெகிழ்வை பாதுகாக்கிறது.
