source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: ta
  text: அவர்களில் ஒருவன் தலைமை ஆசாரியரின் அடிமையை அடித்து, அவனுடைய வலது காதை வெட்டித் துண்டித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தலைமை ஆசாரியரின் வேலைக்காரன்.’ கிரேக்கச் சொல் δοῦλος; சூழலுக்கேற்ப அது ‘அடிமை’ அல்லது ‘வேலைக்காரன்’ எனப் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: தாக்கி
  rationale: πατάσσω இங்கு வலிமையாக அடிப்பதைக் குறிக்கிறது. ‘தாக்கி’ என்பது செயலைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: அவர்களில் ஒருவன்
  rationale: εἷς τις என்பது பெயர் குறிப்பிடப்படாத ஒருவரைக் குறிக்கும். ‘அவர்களில் ஒருவன்’ என்பது அந்தப் பெயரின்மையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: தலைமைக் குருவின் அடிமையை
  rationale: δοῦλος இங்கு தலைமைக் குருவின் வீட்டைச் சேர்ந்த சமூக ரீதியாகக் கட்டுப்பட்ட அடிமையைக் குறிக்கிறது. ‘அடிமை’ என்பது அந்த நிலையை ‘வேலைக்காரன்’ என்பதைக் காட்டிலும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἀφεῖλεν
  choice: வெட்டித் துண்டித்தான்
  rationale: ἀφαιρέω அடிப்படையில் அகற்றுதல் அல்லது எடுத்துவிடுதல் என்று பொருள்படும்; காது காயப்படுத்தப்பட்ட இச்சூழலில் அது வெட்டிப் பிரித்ததைச் சுட்டுகிறது. ‘வெட்டித் துண்டித்தான்’ முடிவைத் தெளிவாக்குகிறது.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: அவனுடைய வலது காதை
  rationale: உடல் உறுப்பையும் அதன் வலப்பக்கத்தையும் குறிக்கும் மூலமொழி விவரத்தை இயல்பான தமிழ் சொற்றொடரில் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளன்
  rationale: இங்கு δοῦλος உருவக அல்லது இறையியல் பொருளில் அல்லாமல் ஓர் உண்மையான சமூக நிலையைக் குறிக்கிறது. ‘அடிமை’ அந்தக் கட்டுப்பட்ட நிலையைக் காக்கிறது; சூழலுக்கேற்ப பயன்படுத்தப்படும் மென்மையான மாற்றுச் சொல்லை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தலைமைக் குரு’ என்பது ἀρχιερεύς என்ற பதவிப் பெயரைத் தெளிவாக வழங்குகிறது; ‘வெட்டித் துண்டித்தான்’ காது முற்றிலும் பிரிக்கப்பட்ட செயலை இயல்பாகத் தெரிவிக்கிறது.
