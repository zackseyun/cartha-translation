source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: ta
  text: அவரைச் சுற்றியிருந்தவர்கள் நடக்கப்போவதைக் கண்டபோது, “ஆண்டவரே, நாங்கள் வாளால்[a] தாக்கட்டுமா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் வாளையோ, குறுவாள் அல்லது குத்துவாள் போன்ற குறுகிய கூராயுதத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἱ περὶ αὐτὸν
  choice: அவரைச் சுற்றியிருந்தவர்கள்
  rationale: இயேசுவைச் சுற்றி இருந்தவர்களைக் குறிக்கும் கிரேக்கச் சொற்றொடரை, அவர்களை சீடர்கள் என்று வெளிப்படையாகச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: τὸ ἐσόμενον
  choice: நடக்கப்போவதை
  rationale: உடனே நிகழவிருந்த சம்பவத்தின் அண்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: மூலத்தில் உள்ள ‘சொன்னார்கள்’ என்ற அடிப்படைப் பொருளைப் பேணுகிறது; மேற்கோள் வினாவாக இருப்பதால் தமிழிலும் கேள்வித்தன்மை தெளிவாக உள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக விளிக்கும் மரியாதையையும் κύριος என்ற பட்டத்தின் இறையியல் கனத்தையும் பேணுகிறது.
- source_word: εἰ πατάξομεν
  choice: நாங்கள் ... தாக்கட்டுமா?
  rationale: இங்கு εἰ அறிமுகப்படுத்தும் ஆலோசனை/அனுமதி நாடும் வினாவையும், πατάσσω என்பதன் ‘தாக்கு’ என்ற வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν μαχαίρῃ
  choice: வாளால்
  rationale: ἐν என்பதன் கருவிப்பொருளை ‘-ஆல்’ வழியாகக் காட்டுகிறது. μάχαιρα குறிக்கும் ஆயுதத்தின் துல்லிய வடிவம் உறுதியல்ல என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இயேசுவை விளிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: போதகரே / தலைவரே
  rationale: இச்சூழலில் இது இயேசுவுக்கான நேரடி விளிப்பாக உள்ளது; வெறும் சமூக மரியாதைப் பட்டமாகக் குறுக்காமல் அதன் பட்டப்பெயர் சார்ந்த இறையியல் கனத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாக்கட்டுமா?’ என்பது ஆலோசனை அல்லது அனுமதி நாடும் கேள்வியாக இயல்பாக ஒலிக்கிறது; கிரேக்கத்தின் கேள்வித்தன்மையைத் தீர்மானமாக மாற்றவில்லை.
