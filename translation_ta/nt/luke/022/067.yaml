reference: Luke 22:67
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: ta
  text: அவர்கள், “நீர் மேசியாவாக இருந்தால்[a], எங்களுக்குச் சொல்லுங்கள்” என்றார்கள். ஆனால் அவர் அவர்களிடம், “நான் உங்களுக்குச் சொன்னால், நீங்கள் நிச்சயமாக நம்பமாட்டீர்கள்;” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவாக இருந்தால்.”
    reason: Χριστός என்பதற்கான பாரம்பரிய மாற்றுப் பட்டப்பெயரை வழங்குகிறது.
lexical_decisions:
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: முன்னைய நிகழ்வோடு இணைந்த நிகழ்காலப் பங்கேற்புவினையை, தமிழில் இயல்பான நேரடி உரை அறிமுகமாக மாற்றுகிறது.
- source_word: Εἰ σὺ εἶ
  choice: நீர் ... ஆனால்
  rationale: கிரேக்கத்தின் வெளிப்படையான நிபந்தனை வடிவத்தை நேரடிக் கேள்வியாக மாற்றாமல் பாதுகாக்கிறது; மரியாதை ஒருமைக்கு ‘நீர்’ பயன்படுத்தப்படுகிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: விசாரணையின் யூதச் சூழலில் Χριστός ஒரு பட்டமாகவும் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் சொல்லாகவும் உள்ளது.
- source_word: εἰπὸν ἡμῖν
  choice: எங்களிடம் சொல்லும்
  rationale: கட்டளை வினையின் வலிமையை இயல்பான, கண்ணியமான தமிழ் நடையில் தருகிறது.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: ஆனால் அவர் அவர்களிடம் ... என்றார்
  rationale: δέ குறிக்கும் மிதமான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: நான் உங்களிடம் சொன்னாலும்
  rationale: இந்தப் பதிலில் உள்ள நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்தும் concessive conditional வடிவம்; இயேசு சொன்னாலும் ஏற்படும் விளைவைக் காட்டுகிறது.
- source_word: οὐ μὴ πιστεύσητε
  choice: நீங்கள் நிச்சயமாக நம்பமாட்டீர்கள்
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக ... மாட்டீர்கள்’ தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த யூத விசாரணைச் சூழலில், பெயராக அல்லாமல் அபிஷேகம் பெற்ற எதிர்பார்க்கப்பட்ட அரசருக்கான பட்டமாகச் சொல் பயன்படுகிறது; ‘மேசியா’ அந்தச் சூழல்சார் பொருளைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான வேதாகம நடை. இயேசுவை நோக்கிய ஒருமை மரியாதைக்கு ‘நீர்’, குழுவை நோக்கி ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்திற்குத் தொடர்வதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
