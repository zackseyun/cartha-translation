- from: அவர்கள், “நீர் மேசியாவானால்[a], எங்களிடம் சொல்லும்” என்றார்கள். ஆனால் அவர் அவர்களிடம், “நான் உங்களிடம் சொன்னாலும், நீங்கள் நிச்சயமாக நம்பமாட்டீர்கள்;” என்றார்.
  to: அவர்கள், “நீர் மேசியாவாக இருந்தால்[a], எங்களுக்குச் சொல்லுங்கள்” என்றார்கள். ஆனால் அவர் அவர்களிடம், “நான் உங்களுக்குச் சொன்னால், நீங்கள் நிச்சயமாக நம்பமாட்டீர்கள்;” என்றார்.
