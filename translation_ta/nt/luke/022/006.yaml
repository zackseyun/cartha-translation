source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: ta
  text: அவன் ஒப்புக்கொண்டான்; மக்கள் கூட்டம் இல்லாத நேரத்தில் அவரை அவர்களிடம் ஒப்படைக்க[a] ஏற்ற வாய்ப்பைத் தேடிக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைக் காட்டிக்கொடுக்க.’ கிரேக்க வினை நேரடியாக ‘ஒப்படைக்க’ அல்லது ‘கையளிக்க’ என்று பொருள்படும்; யூதாஸின் பங்கைக் கருத்தில் கொண்டால் ‘காட்டிக்கொடுக்க’ என்பதும் சூழலுக்கேற்ற மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: ஒப்புக்கொண்டான்
  rationale: முந்தைய வசனங்களில் தலைமை ஆசாரியர்களும் காவல் தலைவர்களும் முன்வைத்த திட்டத்திற்கு யூதாஸ் உடன்பட்டதை இச்சூழலில் இந்த வினை குறிக்கிறது; ‘ஒப்புக்கொண்டான்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐζήτει
  choice: தேடிக்கொண்டிருந்தான்
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ந்த முயற்சியைக் காட்டுகிறது. ‘தேடிக்கொண்டிருந்தான்’ அந்த நீடித்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘தேடத் தொடங்கினான்’ என்ற தொடக்கநிலைப் பொருளைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
- source_word: εὐκαιρίαν
  choice: ஏற்ற வாய்ப்பை
  rationale: செயலை நிறைவேற்றுவதற்கு வசதியான அல்லது சாதகமான சந்தர்ப்பம் என்ற பொருளை ‘ஏற்ற வாய்ப்பு’ தெளிவாகத் தருகிறது.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: அவரை ... ஒப்படைக்க
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருளான ‘ஒப்படைத்தல்/கையளித்தல்’ பாதுகாக்கப்படுகிறது. யூதாஸின் செயல் சூழலில் துரோகம் என்ற பொருள் இருந்தாலும், அதை முதன்மை உரையில் விளக்கமாகச் சேர்க்காமல் அடிக்குறிப்பில் மாற்று மொழிபெயர்ப்பாக வழங்குகிறது.
- source_word: ἄτερ ὄχλου
  choice: மக்கள் கூட்டம் இல்லாத நேரத்தில்
  rationale: கூட்டம் உடனில்லாத அல்லது கூட்டம் வராத சந்தர்ப்பத்தை யூதாஸ் நாடினான் என்பதைக் கருத்துத் தெளிவுடனும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட தலைமை ஆசாரியர்களும் காவல் தலைவர்களுமே ஒப்படைப்பைப் பெறுபவர்கள் என்பதை இயல்பான தமிழ் வேற்றுமை வடிவில் குறிக்கிறது.
theological_decisions:
- issue: παραδίδωμι என்ற வினையில் உள்ள ‘ஒப்படைத்தல்’ மற்றும் ‘காட்டிக்கொடுத்தல்/துரோகம் செய்தல்’ ஆகிய பொருள் வாய்ப்புகள்
  choice: முதன்மை உரையில் ‘ஒப்படைக்க’
  alternative: ‘காட்டிக்கொடுக்க’ அல்லது ‘துரோகம் செய்ய’
  rationale: ‘ஒப்படைக்க’ என்பது கிரேக்க வினையின் அடிப்படைப் பொருளையும் பாடுகளின் நிகழ்வுரையில் அதன் பரந்த பயன்பாட்டையும் காக்கிறது. யூதாஸின் துரோகச் சூழலை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ந்த முயற்சியை ‘தேடிக்கொண்டிருந்தான்’ என்பதும், கூட்டம் இல்லாத சூழலை ‘மக்கள் கூட்டம் இல்லாத நேரத்தில்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
