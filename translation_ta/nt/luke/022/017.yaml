source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: ta
  text: அவர் ஒரு கிண்ணத்தைப் பெற்றுக்கொண்டு[a], நன்றி செலுத்தியபின், “இதை எடுத்துக்கொண்டு உங்களுக்குள் பகிர்ந்துகொள்ளுங்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்தக் கிண்ணத்தை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘கிண்ணம்’ என்பதற்கு முன் உருபு இல்லை; எனினும் உணவுச் சூழல் குறிப்பிட்ட ஒரு கிண்ணத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இதை உங்களுக்குள் பிரித்துக்கொள்ளுங்கள்” அல்லது “பகிர்ந்தளியுங்கள்.” இங்கு வரும் கிரேக்க வினைச்சொல் சூழலுக்கேற்ப ‘பிரி’ அல்லது ‘பகிர்ந்தளி’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: பெற்றுக்கொண்டு
  rationale: இது δέχομαι என்பதன் இறந்தகாலப் பங்கேற்புவினை வடிவம்; முதன்மை வினையான ‘என்றார்’ என்பதற்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது. ‘பெற்றுக்கொண்டு’ என்பது ‘எடுத்துக்கொண்டு’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ποτήριον
  choice: ஒரு கிண்ணத்தை
  rationale: கிரேக்கத்தில் இச்சொல் சுட்டுச்சொல் இன்றி வருகிறது. தமிழில் ‘ஒரு கிண்ணத்தை’ என்பது இயல்பாகவும், குறிப்பிட்ட ‘அந்தக் கிண்ணம்’ என்று அளவுக்கு மீறித் தீர்மானிக்காமலும் உள்ளது.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்தியபின்
  rationale: பேசுவதற்கு முன் நன்றி செலுத்தியதைத் தெளிவான இயல்பான தமிழில் தருகிறது; பிற்காலச் சடங்குசார் தொழில்நுட்பச் சொல்லை உள்ளே கொண்டுவரவில்லை.
- source_word: εἶπεν
  choice: என்றார்
  rationale: கிரேக்கத்தில் மறைமுகப் பொருள் வெளிப்படையாக இல்லை. மேற்கோளுக்குப் பின் வரும் ‘என்றார்’ இயல்பான தமிழாக இருந்து ‘அவர்களிடம்’ என்பதைச் சேர்க்காமல் காக்கிறது.
- source_word: Λάβετε
  choice: எடுத்துக்கொண்டு
  rationale: உணவுச் சூழலில் பொருளை ஏற்றுக்கொள்ளும்படி கூறும் கட்டளைக்கு இது இயல்பான தமிழ். தொடரும் கட்டளையுடன் இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῦτο
  choice: இதை
  rationale: இது முன்பு குறிப்பிடப்பட்ட கிண்ணத்தைக் குறித்தாலும், கிரேக்கம் பெயர்ச்சொல்லை மீண்டும் கூறவில்லை; ‘இதை’ அந்தச் சுருக்கத்தைப் பாதுகாக்கிறது.
- source_word: διαμερίσατε
  choice: பகிர்ந்துகொள்ளுங்கள்
  rationale: διαμερίζω என்பது பிரித்தல் அல்லது பகிர்ந்தளித்தலைக் குறிக்கலாம். இவ்வுணவுச் சூழலில் ‘உங்களுக்குள் பகிர்ந்துகொள்ளுங்கள்’ இயல்பாக இருந்து பரஸ்பரப் பகிர்வை வெளிப்படுத்துகிறது.
- source_word: εἰς ἑαυτούς
  choice: உங்களுக்குள்
  rationale: குழுவினரிடையே பகிர்வதைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; தனித்தனியாகத் தங்களுக்காக வைத்துக்கொள்வது என்ற தவறான பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: εὐχαριστήσας மற்றும் ποτήριον ஆகியவற்றை திருவிருந்து சார்ந்த பிற்கால வழிபாட்டுச் சொற்களால் மொழிபெயர்க்க வேண்டுமா?
  choice: ‘ஒரு கிண்ணம்’, ‘நன்றி செலுத்துதல்’ என்ற சாதாரண நிகழ்வுரைச் சொற்களைப் பயன்படுத்துதல்
  alternative: ‘அந்தக் கிண்ணம்’ போன்ற குறிப்பிட்ட அல்லது வலுவான சடங்குசார் மொழியைப் பயன்படுத்துதல்
  rationale: இவ்வசனம் இயேசுவின் உணவு மேசைச் செயலை விவரிக்கிறது; கிரேக்கம் வெளிப்படையாகக் கூறாத பிற்காலத் திருச்சபை அல்லது சடங்குசார் கருத்துகளை மொழிபெயர்ப்பில் சேர்க்காமல் இருப்பது மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் கொண்ட நிகழ்வுரை. ‘நன்றி செலுத்தியபின்’ செயல்வரிசையைத் தெளிவாக்குகிறது; ‘உங்களுக்குள் பகிர்ந்துகொள்ளுங்கள்’ சாதாரண வாசகருக்குப் புரியும் இயல்பான கட்டளை வடிவமாக உள்ளது.
