lexical_decisions:
- source_word: ἐχάρησαν
  choice: மகிழ்ச்சியடைந்து
  rationale: χαίρω என்ற வினையின் இங்குள்ள உணர்ச்சிப்பூர்வமான எதிர்வினையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அவர்களுடைய மகிழ்ச்சியின் வலிமையையும் காக்கிறது.
- source_word: συνέθεντο
  choice: ஒப்புக்கொண்டார்கள்
  rationale: συντίθεμαι என்பதன் இடைநிலை வடிவம் இச்சூழலில் உடன்படுதல் அல்லது ஒப்பந்தத்துக்கு வருதல் என்பதைக் குறிக்கிறது. ‘ஒப்புக்கொண்டார்கள்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: வேற்றுமை வடிவிலுள்ள பதிலிப்பெயர் δοῦναι என்பதன் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் ‘அவனுக்குப் பணம் கொடுக்க’ என்பது இயல்பான அமைப்பு.
- source_word: ἀργύριον
  choice: பணம்
  rationale: இந்தச் சொல் சொற்பொருளில் வெள்ளியைக் குறிக்கக்கூடியதாக இருந்தாலும், பரிவர்த்தனைச் சூழலில் பொதுவாகப் பணத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘பணம்’ பொருளைத் தெளிவாகத் தெரிவிக்கிறது; ‘வெள்ளி’ என்ற மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: δοῦναι
  choice: கொடுக்க
  rationale: இந்த வினையெச்சம் அவர்கள் ஒப்புக்கொண்டதன் உள்ளடக்கத்தைத் தெரிவிக்கிறது. ‘கொடுக்க’ என்பது நேரடியான சொற்பொருள் இணை; ‘செலுத்த’ என்பது சூழல்சார் விளக்கத்தை அதிகமாகச் சேர்க்கும்.
