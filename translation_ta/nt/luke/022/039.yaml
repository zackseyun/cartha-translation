source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: ta
  text: அவர் வெளியே புறப்பட்டு, வழக்கத்தின்படி ஒலிவ மலைக்குச் சென்றார்; சீடர்களும் அவரைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: வெளியே புறப்பட்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது. ‘வெளியே புறப்பட்டு’ என்பது அந்த நிகழ்வொழுங்கை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπορεύθη
  choice: சென்றார்
  rationale: πορεύομαι என்பதன் பொதுவான கதைநடைப் பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: κατὰ τὸ ἔθος
  choice: வழக்கத்தின்படி
  rationale: யாருடைய வழக்கம் என்று கிரேக்கத்தில் வெளிப்படையாகச் சேர்க்காமல், வழக்கமான நடைமுறை என்ற பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலைக்கு
  rationale: அங்கீகரிக்கப்பட்ட இடப்பெயரை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἠκολούθησαν
  choice: பின்தொடர்ந்தார்கள்
  rationale: ἀκολουθέω என்பதன் நேரடியான இயக்கப் பொருளையும் சீடர் உறவின் பின்னணியையும் பாதுகாக்கிறது.
- source_word: οἱ μαθηταί
  choice: சீடர்கள்
  rationale: கிரேக்கத்தில் இல்லாத ‘அவருடைய’ என்பதைச் சேர்க்காமல், சூழலில் தெளிவான குழுவைக் குறிக்கிறது.
- source_word: καὶ … δὲ καὶ
  choice: …; …உம்
  rationale: முதல் இணைப்பை இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் நிறுத்தக்குறியால் வெளிப்படுத்தி, இரண்டாவது καί-யின் சேர்க்கைப் பொருளை ‘உம்’ மூலம் காட்டுகிறது.
theological_decisions:
- issue: வழக்கம் இயேசுவுக்குரியது என்று வெளிப்படையாகச் சொல்லலாமா
  choice: ‘வழக்கத்தின்படி’ என்று மறைமுகமாகவே வைத்தல்
  alternative: ‘தமது வழக்கத்தின்படி’ அல்லது ‘தமக்கு வழக்கமானபடி’
  rationale: சூழல் அந்த வழக்கம் இயேசுவுடையது என்பதை உணர்த்தினாலும், κατὰ τὸ ἔθος என்ற சொற்றொடர் உடைமையை வெளிப்படையாகக் கூறவில்லை. தமிழ் மொழிபெயர்ப்பு அந்தச் சுருக்கத்தையும் இயல்பான தெளிவையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை. கிரேக்கத்தின் நிகழ்வொழுங்கும் ‘வழக்கம்’ யாருடையது என்பதில் உள்ள மறைமுகத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
