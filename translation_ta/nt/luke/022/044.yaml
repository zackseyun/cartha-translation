source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: ta
  text: அவர் கடும் வேதனையில் இருந்தபோது[a], இன்னும் தீவிரமாக ஜெபித்துக்கொண்டிருந்தார்; அவருடைய வியர்வை தரையில் விழும் இரத்தத் துளிகளைப் போல ஆனது.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடும் வேதனை’ என்பதற்கு ‘தீவிரமான மனப்போராட்டம்’ அல்லது ‘மிகுந்த துயரம்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘இரத்தத் துளிகள் அல்லது இரத்தக் கட்டிகளைப் போல.’ இது வியர்வையே இரத்தமாக இருந்தது என்று நேரடியாகக் கூறாமல் ஓர் ஒப்புமையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் லூக்கா 22:43–44 இல்லை; மற்றவற்றில் அவை உள்ளன. இந்த உரைநிலை ஐயத்தைக் காட்ட SBLGNT இவ்வசனங்களை அடைப்புக்குறிகளுக்குள் அச்சிடுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: கடும் வேதனையில் ஆழ்ந்து
  rationale: இச்சொற்றொடர் இயேசு மிகுந்த உள்ளார்ந்த போராட்டத்திலும் வேதனையிலும் இருந்த நிலையைக் குறிக்கிறது. ‘ஆழ்ந்து’ என்பது அந்த நிலைக்குள் அவர் இருந்ததை இயல்பான தமிழில் எடுத்துரைக்கிறது; கிரேக்கப் பங்கேற்புவினையின் நிகழ்நிலைச் சூழலையும் காக்கிறது.
- source_word: ἐκτενέστερον
  choice: இன்னும் தீவிரமாக
  rationale: ஒப்பீட்டு வினையடை என்பதால், முன்பைவிட அதிகரித்த தீவிரத்தை ‘இன்னும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: προσηύχετο
  choice: வேண்டிக்கொண்டிருந்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை வடிவம் தொடர்ந்து நடைபெற்ற செயலைக் காட்டுகிறது. ‘வேண்டிக்கொண்டிருந்தார்’ அந்த நீடித்த செயலை இயல்பான தமிழில் தருகிறது.
- source_word: ἐγένετο
  choice: ஆனது
  rationale: வியர்வை எப்படிப்பட்ட தோற்றத்தை அடைந்தது என்பதை விளக்கும் விளைவுநிலையைச் சுருக்கமாகக் காக்கிறது.
- source_word: ὁ ἱδρὼς αὐτοῦ
  choice: அவருடைய வியர்வை
  rationale: நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: இரத்தத் துளிகளைப் போல
  rationale: ὡσεὶ வெளிப்படுத்தும் ஒப்புமையை ‘போல’ தெளிவாகக் காக்கிறது. θρόμβοι என்பது கட்டிகள் அல்லது கனமான துளிகள் எனப் பொருள்படலாம்; கீழே விழும் காட்சியில் ‘துளிகள்’ இயல்பான தமிழாக உள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: தரையில் விழும்
  rationale: கீழ்நோக்கிய இயக்கத்தையும் அதன் இலக்கான தரையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: வியர்வைக்கும் இரத்தத் துளிகளுக்கும் இடையிலான ஒப்புமையின் தன்மை
  choice: வியர்வை இரத்தத் துளிகளைப் ‘போல’ ஆனது என்ற உவமை காக்கப்பட்டுள்ளது.
  alternative: வியர்வையே இரத்தமாக இருந்தது என்று நேரடியாகக் கூறுதல்.
  rationale: ὡσεὶ என்பது ஒற்றுமையைக் குறிக்கும் ஒப்புமை உருபு; அது இரண்டையும் ஒன்றாக அடையாளப்படுத்தவில்லை. ஆகவே மருத்துவ அல்லது அற்புத விளக்கத்தை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்காமல், மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- issue: லூக்கா 22:43–44-ன் உரைநிலை
  choice: SBLGNT-ஐப் பின்பற்றி வசனம் மொழிபெயர்க்கப்பட்டு, உரைவேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
  alternative: வசனத்தை முதன்மை உரையிலிருந்து நீக்குதல்.
  rationale: சில பழைய கையெழுத்துப் பிரதிகளில் இவ்வசனங்கள் இல்லை; மற்றவற்றில் உள்ளன. SBLGNT அவற்றை உரைநிலை ஐயத்தைக் காட்டும் குறியீடுகளுடன் அச்சிடுவதால், மொழிபெயர்ப்பு அவற்றை வழங்கி ஆதாரநிலையை வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘மன்றாடினார்’ போன்ற உணர்ச்சி வலுவைச் சேர்க்கக்கூடிய சொல்லுக்குப் பதிலாக, προσηύχετο-வின் தொடர்ச்சியான ஜெபச் செயலைக் காட்ட ‘வேண்டிக்கொண்டிருந்தார்’ பயன்படுத்தப்பட்டுள்ளது. ‘இன்னும் தீவிரமாக’ என்பது ஒப்பீட்டு வலிமையை நேரடியாகக் காக்கிறது.
