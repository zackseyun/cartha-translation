id: LUK.22.38
reference: Luke 22:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: ta
  text: அவர்கள், “ஆண்டவரே, பாருங்கள், இங்கே இரண்டு வாள்கள் இருக்கின்றன” என்றார்கள். அவர் அவர்களிடம், “போதும்”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இத்துடன் போதும்.” இரண்டு வாள்கள் போதுமானவை என்று கூறுவதைவிட, இந்த உரையாடல் இத்துடன் முடிவடைய வேண்டும் என்று இயேசு கூறியிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: அவர்கள் … என்றார்கள்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் தனியாக இணைப்புச் சொல் சேர்க்காமலேயே இயல்பான தொடர்ச்சி கிடைக்கிறது; எதிர்மறை வேறுபாட்டை அளவுக்கு அதிகமாகக் காட்டுவதும் தவிர்க்கப்படுகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதற்கும், புதிய ஏற்பாட்டில் நிலைபெற்றுள்ள பட்டப்பெயர் பயன்பாட்டிற்கும் ஏற்ற மரியாதையான தமிழ் வடிவம்.
- source_word: ἰδοὺ
  choice: பாருங்கள்
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் ἰδού என்பதன் சுட்டும் வலிமையை, பழமையான நடையின்றி இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: μάχαιραι
  choice: வாள்கள்
  rationale: μάχαιρα ஒரு கூராயுதத்தைக் குறிக்கிறது. ‘குறுவாள்’ அல்லது ‘கத்தி’ எனத் துல்லியத்தை மிகைப்படுத்தாமல், வழக்கமான பொதுப் பொருளை ‘வாள்’ காக்கிறது.
- source_word: ὧδε δύο
  choice: இங்கே இரண்டு … இருக்கின்றன
  rationale: ὧδε என்பதன் இடச்சுட்டையும் δύο என்பதன் எண்ணையும் இயல்பான தமிழ் சொல்வரிசையில் தெளிவாகக் காட்டுகிறது.
- source_word: Ἱκανόν ἐστιν
  choice: போதும்
  rationale: இச்சுருக்கமான தமிழ் சொல் ‘இரண்டு வாள்கள் போதும்’ என்ற பொருளையும் ‘இந்தப் பேச்சு போதும்’ என்ற பொருளையும் அனுமதித்து, கிரேக்கத்தின் உண்மையான இருபொருள் வாய்ப்பைக் காக்கிறது.
theological_decisions:
- issue: Ἱκανόν ἐστιν என்ற இயேசுவின் பதிலிலுள்ள விளக்கத் தெளிவின்மை
  choice: போதும்
  alternative: இத்துடன் போதும்
  rationale: இரண்டு வாள்கள் போதுமானவை என்று இயேசு கூறுகிறாரா, அல்லது உரையாடலை முடிக்கிறாரா என்பதை கிரேக்கம் உறுதியாகத் தீர்மானிப்பதில்லை. முதன்மை உரை அந்த இறையியல் மற்றும் கதைசார் இழுபறியைத் தீர்க்காமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் மரியாதையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘போதும்’ என்பது சுருக்கமாகவும் இயல்பாகவும் இருந்து மூலத்தின் இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
