source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: ta
  text: அவர் அப்பத்தை எடுத்து, நன்றி செலுத்தியபின் அதைப் பிட்டு, அவர்களுக்குக் கொடுத்து, “இது உங்களுக்காகக் கொடுக்கப்படுகிற என் உடல்.[a][b][c] என்னை நினைவுகூரும்படி இதைத் தொடர்ந்து செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “உங்களுக்காகக் கொடுக்கப்படுகிற” என்பதிலிருந்து வசனத்தின் இறுதிவரையுள்ள சொற்கள் இடம்பெறவில்லை.
    reason: textual_variant
  - marker: b
    text: “உங்களுக்காகக் கொடுக்கப்படும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “இது என் உடல்” என்பது மூலத்தில் உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது. சிலர் இதை “இது என் உடலைக் குறிக்கிறது” என்று விளக்குகிறார்கள்; ஆனால் கிரேக்க உரை ‘இது என் உடல்’ என்ற இணைப்புக் கூற்றையே பயன்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: அப்பத்தை எடுத்து
  rationale: இறந்தகால வினையெச்சம் நிகழ்வுகளின் தொடரை இயல்பான நவீனத் தமிழில் காக்கிறது; ἄρτος இவ்வுணவுச் சூழலில் நேரடியாக ‘அப்பம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்தியபின்
  rationale: அப்பத்தைப் பிட்டதற்கு முன் நன்றி செலுத்திய காலத் தொடரைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: ἔκλασεν
  choice: அதைப் பிட்டு
  rationale: அப்பத்தைத் துண்டாக்கிய செயலைக் குறிக்கும் κλάω என்பதற்கான இயல்பான உணவுச் சூழல் மொழிபெயர்ப்பு.
- source_word: ἔδωκεν αὐτοῖς
  choice: அவர்களுக்குக் கொடுத்து
  rationale: பெறுநர்களைத் தெளிவாகக் காட்டி, தொடர்ச்சியான வினையெச்ச நடையைப் பேணுகிறது.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: இது … என் உடல்
  rationale: ἐστιν என்பதன் நேரடியான இணைப்புப் பொருளை ‘இது … என் உடல்’ என்ற வடிவில் காத்து, ‘குறிக்கிறது’ அல்லது ‘அடையாளப்படுத்துகிறது’ என விளக்கமாக மாற்றவில்லை.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: உங்களுக்காகக் கொடுக்கப்படுகிற
  rationale: ὑπέρ என்பதன் பயன்சார்/சார்பான பொருளை ‘உங்களுக்காக’ எனவும், நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தை இயல்பான தமிழில் ‘கொடுக்கப்படுகிற’ எனவும் அளிக்கிறது.
- source_word: τοῦτο ποιεῖτε
  choice: இதைத் தொடர்ந்து செய்யுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் இச்சூழலில் தொடரும் அல்லது மீண்டும் செய்யப்படும் நடைமுறையைக் குறிக்கக்கூடியதால், அந்தத் தொடர்ச்சிப் பொருளை வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: என்னை நினைவுகூரும்படி
  rationale: ἀνάμνησις குறிக்கும் செயற்பாட்டுள்ள நினைவுகூருதலைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘இது என் உடல்’ என்ற நற்கருணைச் சொல்லின் பொருள்
  choice: ‘இது … என் உடல்’ என்ற மூலத்தின் இணைப்புக் கூற்றை அப்படியே பேணுதல்
  alternative: ‘இது என் உடலைக் குறிக்கிறது’ அல்லது ‘இது என் உடலின் அடையாளம்’
  rationale: கிரேக்க உரை ἐστιν (‘ஆகும்/இருக்கிறது’) என்ற இணைப்பு வினையைப் பயன்படுத்துகிறது. இதை விளக்கவுரையாக மாற்றாமல் இருப்பது திருச்சபை மரபுகளுக்கிடையிலான இறையியல் பதற்றத்தைத் தீர்மானிக்காமல் காக்கிறது.
- issue: லூக்கா 22:19-இன் நீண்ட வாசகத்தின் உரைநிலை
  choice: SBLGNT-இல் அடைப்புக்குறியுடன் இடம்பெறும் நீண்ட வாசகத்தை முதன்மை உரையில் சேர்த்தல்
  alternative: ‘இது என் உடல்’ என்பதோடு வசனத்தை முடிக்கும் குறுகிய வாசகம்
  rationale: வழங்கப்பட்ட மூலப் பதிப்பு நீண்ட வாசகத்தை விவாதத்திற்குரியதாகக் குறித்தாலும் உரையில் கொண்டுள்ளது; குறிப்பிடத்தக்க குறுகிய மாற்றுவாசகம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நன்றி செலுத்தியபின்’ என்பது தேவையற்ற வழிபாட்டுச் சிறப்புச்சொல்லைச் சேர்க்காமல் காலத் தொடரைக் காட்டுகிறது. ‘இதைத் தொடர்ந்து செய்யுங்கள்’ என்பது ஒரே தடவைச் செய்யும் கட்டளையாகக் குறுக்காமல், நிகழ்காலக் கட்டளையின் மீளும் நடைமுறைச் சாத்தியத்தை வெளிப்படுத்துகிறது.
