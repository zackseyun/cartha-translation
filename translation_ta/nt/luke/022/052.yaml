  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பட்டியலிலுள்ள மூன்று அதிகாரக் குழுக்களும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன; இயேசுவின் கேள்வியின் குற்றஞ்சாட்டும் வலிமையும் மூலத்தின் சொற்பொருள் பரப்பும் பாதுகாக்கப்பட்டுள்ளன.
