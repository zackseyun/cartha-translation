  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: ta
  text: ஆனால் இயேசு, தமக்கு எதிராக வந்திருந்த தலைமைக் குருக்களையும் ஆலயக் காவல் அதிகாரிகளையும் மூப்பர்களையும் நோக்கி, “ஒரு கொள்ளைக்காரனைப்[a] பிடிக்க வருவதுபோல், வாள்களோடும் தடிகளோடும் புறப்பட்டு வந்தீர்களா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொள்ளைக்காரன்’ என்பதற்குப் பதிலாக ‘வழிப்பறிக் கொள்ளையன்’ அல்லது ‘கலகத்தில் ஈடுபடும் சட்டவிரோதி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் λῃστής, கொள்ளைக்காரன், ஆயுதமேந்திய கொள்ளைக் கூட்டத்தைச் சேர்ந்தவன், அல்லது கிளர்ச்சியில் ஈடுபடும் சட்டவிரோதி ஆகிய பொருள்களைக் குறிக்கலாம். இங்கு ஆபத்தான குற்றவாளிக்கு எதிராகப் பயன்படுத்தப்படும் ஆயுதபலத்துடன் அவர்கள் வந்ததை இயேசு சுட்டிக்காட்டுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: கைதுசெய்ய வந்தவர்களின் நடவடிக்கையிலிருந்து இயேசுவின் எதிர்வினைக்குச் செல்லும் மென்மையான முரண்பாட்டையும் கதைத் திருப்பத்தையும் காட்டுகிறது.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: தமக்கு எதிராக வந்திருந்த
  rationale: ἐπί + வேற்றுமை அமைப்பு இக்கைது நிகழ்வில் இயேசுவை நோக்கிய பகைமையான அணுகுதலைக் குறிக்கிறது; வெறும் அருகில் வந்ததைவிட இதுவே சூழலுக்குப் பொருத்தமானது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: யூத மக்களின் முன்னணி குருத்துவ அதிகாரிகளைச் சுட்டும் பன்மைக்கான இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: ஆலயக் காவல் அதிகாரிகள்
  rationale: ஆலயப் பாதுகாப்புக்குப் பொறுப்பான அதிகாரிகளைத் தெளிவாகக் குறிக்கிறது; சொல்லுக்கு சொல் ‘தளபதிகள்’ என்பது இன்றைய வாசகருக்குத் தவறான இராணுவப் பொருளைத் தரக்கூடும்.
- source_word: πρεσβυτέρους
  choice: மூப்பர்கள்
  rationale: வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், அங்கீகரிக்கப்பட்ட யூதத் தலைவர்களைக் குறிக்கும் நிறுவப்பட்ட பொருளைப் பாதுகாக்கிறது.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ஒரு கொள்ளைக்காரனைப் பிடிக்க வருவதுபோல்
  rationale: ஆயுதம் ஏந்தியவர்கள் ஆபத்தான குற்றவாளியைப் பிடிக்க வருவதைப்போன்ற அணுகுமுறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; λῃστής என்பதின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐξήλθατε
  choice: புறப்பட்டு வந்தீர்களா
  rationale: அவர்கள் அப்போதுதான் மேற்கொண்ட நடவடிக்கையைச் சுட்டும் கேள்வியை இயல்பான தமிழில் வழங்குகிறது.
- source_word: μαχαιρῶν
  choice: வாள்களோடும்
  rationale: கைது நிகழ்வில் μάχαιρα என்பதற்கான வழக்கமான, சூழலுக்குப் பொருத்தமான ஆயுதப் பெயர்.
- source_word: ξύλων
  choice: தடிகளோடும்
  rationale: சொல்லின் அடிப்படைப் பொருள் மரப் பொருட்கள் என்றாலும், இங்கு ஆயுதங்களாக எடுத்துவரப்பட்ட அடிக்கும் தடிகளைக் குறிக்கிறது.
