  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: ta
  text: ஆனால் பாருங்கள், என்னைக் காட்டிக்கொடுக்கிறவனின் கை என்னோடு மேசையின்மேல் இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் வலுவான மாறுபாட்டைக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἰδοὺ
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் கட்டளையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது; பழமையான ‘இதோ’ என்பதைக் காட்டிலும் நேரடியாகக் கேட்போரை நோக்குகிறது.
- source_word: τοῦ παραδιδόντος με
  choice: என்னைக் காட்டிக்கொடுக்கிறவனின்
  rationale: நிகழ்ந்து கொண்டிருக்கும் துரோகச் செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் வலிமையைப் பேணுகிறது.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: என்னோடு மேசையின்மேல் இருக்கிறது
  rationale: கிரேக்கத்தின் இடவியல் அமைப்பையும் அதில் உள்ள திட்டமிட்ட அசாதாரணத் தன்மையையும் தீர்த்துவிடாமல் பேணுகிறது.
theological_decisions:
- issue: ‘கை’ என்பது துரோகி அருகில் அமர்ந்திருப்பதைக் குறிக்கும் உருவக/பகுதிப்பெயர் பயன்பாடு
  choice: ‘கை’ என்பதை நேரடியாகப் பேணுதல்
  alternative: ‘என்னைக் காட்டிக்கொடுப்பவன் என்னோடு மேசையில் இருக்கிறான்’
  rationale: மூலத்தின் தெளிவான உருவகத்தையும் வியப்பூட்டும் காட்சித்தன்மையையும் விளக்கவுரையாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ். ‘பாருங்கள்’ என்பது பன்மை/மரியாதை வடிவில் அங்கிருந்த சீடர்களை நோக்கிய அழைப்பை இயல்பாகக் காட்டுகிறது; மூலத்தின் சொற்றொடர் அமைப்பை அளவுக்கு மீறாமல் பேணுகிறது.
