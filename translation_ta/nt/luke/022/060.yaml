translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. பேதுருவைக் குறிக்க மரியாதை ஒருமை வினைமுற்று பயன்படுத்தப்பட்டாலும், அவர் எதிரிலுள்ள மனிதனிடம் பேசும் மூலத்தின் நேரடியான ஒருமைத் தொனி “நீ” என்பதன் மூலம் காக்கப்பட்டுள்ளது. இவ்வசனத்திற்கு அவசியமான உரை அல்லது பொருள் மாற்றுக் குறிப்பு இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
