reference: Luke 22:60
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: ta
  text: ஆனால் பேதுரு, “மனிதனே, நீ சொல்வது என்னவென்று எனக்குத் தெரியாது” என்றார். அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே, உடனே ஒரு சேவல் கூவியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய குற்றச்சாட்டுக்கும் பேதுருவின் மறுப்புக்கும் இடையிலான முரண்பாட்டையும் கதைத் திருப்பத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: Ἄνθρωπε
  choice: மனிதனே
  rationale: ஆண் ஒருவரை நேரடியாக அழைக்கும் ἄνθρωπε என்பதன் நேரான பொருளையும் அதன் சற்றுக் கடுமையான தொனியையும் காக்கிறது; “ஐயா” என்பது மூலத்தில் இல்லாத மரியாதைத் தொனியைச் சேர்க்கக்கூடும்.
- source_word: οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: οἶδα என்பதன் நிகழ்காலப் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ὃ λέγεις
  choice: நீ சொல்வது என்னவென்று
  rationale: பேதுருவின் மறுப்பை “நீ சொல்வதன் பொருள்” என விளக்கமாக விரிக்காமல், கிரேக்கச் சொல்லாட்சியின் நேரடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: எவ்விதத் தாமதமும் இன்றி நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: பேதுரு பேசுவதும் சேவல் கூவுவதும் ஒரே நேரத்தில் நிகழ்ந்ததை வலியுறுத்தும் genitive absolute அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: ஒரு சேவல் கூவியது
  rationale: ἀλέκτωρ என்பதற்கு நவீனத் தமிழில் வழக்கமான “சேவல்” என்பதையும், அதன் குரலைக் குறிக்கும் இயல்பான “கூவியது” என்பதையும் பயன்படுத்துகிறது; கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு உருபு இல்லாததால் “ஒரு” பொருத்தமானது.
