  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: ta
  text: மேலும், அவர்கள் அவரைப் பழித்துப் பேசி வேறு பல வார்த்தைகளையும் சொல்லிக்கொண்டிருந்தார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரைப் பழித்துப் பேசி’ என்பதற்கு ‘அவருக்கு எதிராகத் தூஷணமான வார்த்தைகளைப் பேசி’, ‘அவமதிப்பாகப் பேசி’ அல்லது ‘வசைபாடி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பழித்தல், இழிவுபடுத்தல், தூஷணமாகப் பேசுதல் ஆகிய பொருள்களைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரைப்’ என்பதற்குப் பின்னுள்ள கிரேக்கச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல்லாக ‘அவரிடம்’ என்றும் மொழிபெயர்க்கலாம். ஆனால் இச்சூழலில் அது அவருக்கு எதிரான விரோதமான பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட துன்புறுத்தல்களோடு இதையும் இணைத்து, கூடுதலான செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἕτερα πολλὰ
  choice: வேறு பலவற்றையும்
  rationale: ‘பல வேறு காரியங்கள்/வார்த்தைகள்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; சொல்லப்படாத ‘வார்த்தைகள்’ என்பதை வினைச்சொல் தெளிவாக்குகிறது.
- source_word: βλασφημοῦντες
  choice: தூஷித்து
  rationale: βλασφημέω என்பதன் நிந்தித்தல், பழித்துப் பேசுதல், இறைநிந்தனை செய்தல் ஆகிய வலுவான பொருள் வரம்பைத் தமிழ் ‘தூஷித்தல்’ தக்கவைக்கிறது; வெறும் கேலி அல்லது அவமதிப்பு என்று மெலிதாக்கவில்லை.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நடந்த பேச்சை imperfect வடிவுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτόν
  choice: அவரைத் தூஷித்து
  rationale: விரோதமான பேச்சின் இலக்கு இயேசு என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது; கிரேக்கச் சொற்றொடரைத் தனியாக ‘அவருக்கு எதிராக’ என்று விறைப்பாக மொழிபெயர்க்காமல், ‘தூஷித்து’ என்பதோடு இணைக்கிறது.
theological_decisions:
- issue: βλασφημοῦντες என்பது பொதுவான வசைபேச்சையா அல்லது இறைநிந்தனையின் வலிமையையும் கொண்டதா
  choice: ‘தூஷித்து’ என்று வலிமையைத் தக்கவைத்தல்
  alternative: ‘அவமதித்துப் பேசி’ அல்லது ‘வசைபாடி’
  rationale: இச்சொல் பொதுவான பழிப்புரையையும் இறைநிந்தனையையும் குறிக்கக்கூடும். ‘தூஷித்து’ என்பது அந்த முழுப் பொருள் வரம்பையும் திறந்தவாறு வைத்திருக்கிறது; இயேசுவின் அடையாளத்தைப் பற்றிய ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்புக்குள் கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சொல்லிக்கொண்டிருந்தார்கள்’ தொடர்ச்சியான செயலைக் காட்டுகிறது; ‘தூஷித்து’ மூலச்சொல்லின் வலிமையையும் பொருள் தெளிவின்மையையும் பாதுகாக்கிறது.
