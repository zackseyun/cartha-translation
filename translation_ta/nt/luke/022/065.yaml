revisions:
- from: மேலும், அவரைத் தூஷித்து வேறு பலவற்றையும் சொல்லிக்கொண்டிருந்தார்கள்[a][b].
  to: மேலும், அவர்கள் அவரைப் பழித்துப் பேசி வேறு பல வார்த்தைகளையும் சொல்லிக்கொண்டிருந்தார்கள்[a][b].
  rationale: The revision renders the participle as a natural Tamil manner phrase, explicitly supplies the implied ‘words,’ and preserves the imperfect with ‘சொல்லிக்கொண்டிருந்தார்கள்.’ It avoids narrowing the reviling vocabulary to a doctrinally specific sense while retaining its seriousness. Both footnote anchors remain in place and the notes now accurately describe the alternatives they support.
