id: LUK.22.53
reference: Luke 22:53
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: ta
  text: நான் நாள்தோறும் ஆலயத்தில் உங்களோடு இருந்தபோது, நீங்கள் எனக்கு எதிராகக் கைகளை நீட்டவில்லை[a]. ஆனால் இதுவே உங்கள் நேரமும் இருளின் அதிகாரமும் ஆகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் என்னைக் கைது செய்யவில்லை.” கிரேக்கத்தில் சொற்சொல்லாக, “எனக்கு எதிராகக் கைகளை நீட்டவில்லை”; இந்தச் சூழலில் அது பகைமையாக நடவடிக்கை எடுப்பதை, குறிப்பாகக் கைது செய்வதை, குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இருளின் வல்லமை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: நான் ... உங்களோடு இருந்தபோது
  rationale: மூலத்தின் genitive absolute அமைப்பை இயல்பான காலப் பொருள் கொண்ட தமிழ்த் துணைவாக்கியமாக வழங்குகிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν ஆலய வளாகத்தைக் குறிக்கிறது; ‘ஆலயத்தில்’ என்பது தெளிவானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான சொல்.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: நீங்கள் எனக்கு எதிராகக் கைகளை நீட்டவில்லை
  rationale: கிரேக்க உருவகச் சொல்லாடலைத் தக்கவைத்து, பகைமையான நடவடிக்கை அல்லது கைது செய்ய முற்படுதல் என்ற சூழல் பொருளையும் சுமக்கிறது.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: ஆனால் இதுவே உங்கள் நேரம்
  rationale: ὥρα இங்கு கடிகார மணியை அல்ல, அவர்களுக்குரிய தீர்மானமான தருணத்தைக் குறிக்கிறது; ‘நேரம்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἐξουσία
  choice: அதிகாரம்
  rationale: வெறும் வலிமையை விட உரிமை, ஆளுகை, செயல்படும் அதிகாரம் ஆகிய பொருள்களைப் பாதுகாக்கிறது.
- source_word: τοῦ σκότους
  choice: இருளின்
  rationale: மூலத்தில் உள்ள உருவகத்தையும் அதன் ஆன்மீக-தீய பரிமாணத்தின் தெளிவுபடுத்தப்படாத பதற்றத்தையும் அப்படியே தக்கவைக்கிறது.
theological_decisions:
- issue: ‘இருளின் அதிகாரம்’ என்பது சாத்தானின் அதிகாரமா அல்லது தீமையின் ஆளுகையா என்பதை வெளிப்படையாக்குதல்
  choice: இருளின் அதிகாரம்
  alternative: இருளின் வல்லமை; சாத்தானின் அதிகாரம்; தீமையின் ஆளுகை
  rationale: மூலம் சாத்தானை நேரடியாகப் பெயரிடாமல் ‘இருள்’ என்ற உருவகத்தையே பயன்படுத்துகிறது. அதனை விரிவாக்காமல் வைத்திருப்பது வசனத்தின் உண்மையான இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ‘உங்கள் நேரம்’ மற்றும் ‘இருளின் அதிகாரம்’ ஆகியவற்றுக்கிடையிலான தொடர்பு
  choice: இரண்டையும் ‘-உம்’ இணைப்பால் ஒரே உரையாடல் அலகில் வைத்தல்
  alternative: ‘இருளின் அதிகாரத்துக்குரிய நேரம்’ என்று ஒன்றை மற்றொன்றோடு அடையாளப்படுத்துதல்
  rationale: καὶ எனும் இணைப்புச் சொல் இரண்டையும் இணைக்கிறது; ஆனால் அவற்றின் துல்லிய உறவை விளக்கி முடிவுசெய்யவில்லை. எனவே மூலத்தின் அமைப்பைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆலயம்’, ‘அதிகாரம்’, ‘இருள்’ ஆகிய சொற்கள் வேதாகமச் சூழலின் செறிவைத் தக்கவைக்கின்றன; ‘உங்கள் நேரம்’ என்பது ‘உங்கள் மணி’ என்பதைக் காட்டிலும் இயல்பாகவும் பொருள்தெளிவாகவும் உள்ளது.
