  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: ta
  text: அவர் அந்த இடத்திற்கு வந்தபோது, அவர்களிடம் “நீங்கள் சோதனைக்குள்[a] நுழையாதபடி ஜெபியுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரீட்சைக்குள்” அல்லது “நெருக்கடிக்குள்.” இங்குள்ள கிரேக்கச் சொல், தீமைக்குத் தூண்டும் சோதனையையோ பொதுவான பரீட்சை அல்லது நெருக்கடிக் காலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: அவர் அந்த இடத்திற்கு வந்தபோது
  rationale: இடத்தை வந்தடைந்த பின்பு நிகழ்ந்த செயலைக் குறிக்கும் கிரேக்கப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. முன்சூழலில் அறியப்பட்ட இடம் என்பதால் ‘அந்த இடம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் … என்றார்
  rationale: λέγω என்பதன் எளிய ‘சொல்’ என்ற பொருளையும், யாரிடம் சொன்னார் என்பதையும் இயல்பான தமிழ் நேர்க்கூற்று அமைப்பில் தருகிறது.
- source_word: Προσεύχεσθε
  choice: ஜெபியுங்கள்
  rationale: தொடர்ந்து அல்லது வழக்கமாக ஜெபிக்க வேண்டும் என்ற நிகழ்காலக் கட்டளையின் வலிமையை, தேவையற்ற விரிவாக்கமின்றி இயல்பான தமிழ் கட்டளையாகத் தருகிறது.
- source_word: μὴ εἰσελθεῖν
  choice: நுழையாதபடி
  rationale: εἰσέρχομαι என்பதன் ‘நுழை’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘விழாதபடி’ என்று மொழிபெயர்த்து மூலத்தின் பொருளைத் தேவையின்றி விளக்கவில்லை.
- source_word: πειρασμόν
  choice: சோதனை
  rationale: தமிழில் ‘சோதனை’ என்பது தீமைக்குத் தூண்டும் சோதனையையும் பரந்த பொருளிலான பரீட்சை அல்லது நெருக்கடியையும் குறிக்கக்கூடும். உடனடிச் சூழலில் ஆன்மீகத் தடுமாற்றத்தின் அபாயம் முன்னிலையில் இருந்தாலும், கிரேக்கச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: πειρασμός என்பதன் பொருள்
  choice: சோதனை
  alternative: பரீட்சை அல்லது நெருக்கடிக் காலம்
  rationale: சீடர்கள் விரைவில் எதிர்கொள்ளவிருந்த ஆன்மீகத் தடுமாற்றத்தின் சூழலுக்கு ‘சோதனை’ நன்கு பொருந்துகிறது. அதேவேளையில், கிரேக்கச் சொல் பொதுவான பரீட்சையையும் குறிக்கக்கூடும் என்பதால் அந்த இறையியல் மற்றும் சொற்பொருள் நெருக்கடி அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நேர்க்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘சோதனைக்குள் நுழைதல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு அது விளக்கும் சொல்லுக்குப் பின்பே வைக்கப்பட்டுள்ளது.
