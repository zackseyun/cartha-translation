base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: ta
  text: அவர்கள் முற்றத்தின் நடுவில் நெருப்பு மூட்டி ஒன்றாக அமர்ந்தபின், பேதுரு அவர்கள் நடுவில் அமர்ந்திருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேதுரு அவர்கள் நடுவில் அமர்ந்தார்.’ கிரேக்க மொழியின் முற்றுப்பெறாத இறந்தகால வினையை எளிமையாக ‘அமர்ந்தார்’ என்றும் மொழிபெயர்க்கலாம்; ‘அமர்ந்திருந்தார்’ என்பது அப்போது தொடர்ந்து நிலவிய காட்சியை இன்னும் தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: நெருப்பு மூட்டி
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன்னர் நிகழ்ந்த செயலைக் குறிக்கிறது. இச்சூழலில் நெருப்பைப் பற்றவைத்ததை இயல்பான நவீனத் தமிழில் ‘நெருப்பு மூட்டி’ எனத் தெளிவாகச் சொல்கிறது.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: முற்றத்தின் நடுவில்
  rationale: αὐλή இங்கு தலைமைக் குருவின் வீட்டைச் சார்ந்த திறந்த முற்றத்தைக் குறிக்கிறது; ἐν μέσῳ அதன் நடுப்பகுதியை இடவியல் ரீதியாகக் குறிப்பிடுகிறது.
- source_word: συγκαθισάντων
  choice: ஒன்றாக அமர்ந்தபின்
  rationale: இறந்தகால வினையெச்சமும் σύν முன்னொட்டும் அவர்கள் சேர்ந்து அமர்ந்ததைக் காட்டுகின்றன. ‘அமர்ந்தபின்’ என்பது இதையும் முதன்மை வினைக்கு முந்திய செயலாகவும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκάθητο
  choice: அமர்ந்திருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து நிலவிய காட்சியை உணர்த்துகிறது; ‘அமர்ந்திருந்தார்’ அந்த நீடித்த நிலையைக் காக்கிறது.
- source_word: μέσος αὐτῶν
  choice: அவர்கள் நடுவில்
  rationale: பேதுரு அந்தக் குழுவினருக்குள் இருந்த இடநிலையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δὲ இங்கு கதையை மெதுவாக முன்னெடுக்கும் இணைப்பாக உள்ளது. தமிழில் வாக்கியத் தொடர்ச்சியே அந்தப் பணியை இயல்பாகச் செய்வதால் ‘மேலும்’ போன்ற சொல் தேவையற்றதாகும்.
