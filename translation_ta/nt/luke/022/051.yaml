  source_fidelity: 'மூலத்தின் முக்கிய நிகழ்வுகள் காக்கப்பட்டுள்ளன: இயேசு பேசுகிறார், காதைத் தொடுகிறார், அந்த மனிதனைச் சுகமாக்குகிறார். ஆனால் ἀποκριθεὶς (‘பதிலளித்து/பதிலாக’) என்பதன் பதிலுரைப் பிணைப்பு ‘என்று சொன்னார்’ என்பதில் வெளிப்படையாக இல்லை. மேலும் Ἐᾶτε ἕως τούτου என்பது சொல்லுக்குச் சொல் ‘இது வரையிலும் விடுங்கள்/அனுமதியுங்கள்’ என்ற வடிவம் கொண்டது; சூழலில் ‘இதற்கு மேல் வேண்டாம்’ என்ற சுருக்கமான கட்டளையாக இயல்பாக மொழிபெயர்க்கலாம்.'
  naturalness: ‘இதுவரை போதும்!’ புரியக்கூடியதாயினும், நவீனத் தமிழில் இச்சூழலில் சற்றே இயல்பற்றதாகவும் ‘இதுவரை போதுமானது’ என்ற கால-அளவுப் பொருளைத் தரக்கூடியதாகவும் உள்ளது. ‘இதற்கு மேல் வேண்டாம்!’ என்பது சுருக்கமாகவும் இயல்பாகவும், தொடரும் வன்முறையை நிறுத்தும் கட்டளைத் தொனியுடனும் அமைகிறது.
  terminology: ‘இயேசு,’ ‘காதைத் தொட்டு,’ ‘அவனைக் குணமாக்கினார்’ ஆகியவை பொருத்தமானவை. αὐτόν மனிதரைக் குறிக்கிறது என்பதைக் ‘அவனைக் குணமாக்கினார்’ சரியாகப் பாதுகாக்கிறது. ‘அந்த மனிதனுடைய’ என்பது முன்னோடியிலிருந்து அறியப்படும் குறிப்பைச் சேர்த்தாலும் பொருளை மாற்றவில்லை; இருப்பினும் மூலத்தின் சுருக்கத்தைப் பின்பற்ற ‘அவனுடைய’ போதுமானது.
