  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: ta
  text: ஆனால் இயேசு பதிலாக, “இதற்கு மேல் வேண்டாம்!” என்றார். பின்பு அவர் அவனுடைய காதைத் தொட்டு, அவனைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: இதுவரை போதும்!
  rationale: சொற்றொடரின் கட்டளைத் தொனியையும், நடைபெறும் வன்முறையை நிறுத்தும் சூழலையும் இயல்பான நவீனத் தமிழில் தருகிறது; ‘Enough of this!’ என்ற பொருளையும் காக்கிறது.
- source_word: ὠτίου
  choice: காதை
  rationale: இங்கு சிறுபெயர் வடிவம் இருந்தாலும், சூழலில் இயல்பான தமிழ் உடலுறுப்புப் பெயரான ‘காது’ பொருத்தமானது.
- source_word: ἰάσατο αὐτόν
  choice: அவனைக் குணமாக்கினார்
  rationale: αὐτόν என்பது காதைக் காட்டிலும் அந்த மனிதனையே இலக்கணப்படி குறிக்கிறது; ஆகவே மூலத்தின் தனிநபர் நோக்கைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளை யாரை நோக்கியது என்பதிலுள்ள மறைபொருள்
  choice: முகவரியைச் சேர்க்காமல் ‘இதுவரை போதும்!’ என்று மொழிபெயர்த்தல்
  alternative: ‘இதை நிறுத்துங்கள்!’ அல்லது ‘அவர்களை விடுங்கள்!’
  rationale: கிரேக்க வாசகம் சூழலின்படி பலவாறு புரிந்துகொள்ளக்கூடியது. குறிப்பிட்ட முகவரியையோ விளக்கத்தையோ சேர்க்காமல் அதன் உண்மையான சுருக்கத்தையும் ஓரளவு ambiguity-யையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நடையில், கதையின் வேகத்தையும் இயேசுவின் உறுதியான கட்டளைத் தொனியையும் காக்கிறது.
