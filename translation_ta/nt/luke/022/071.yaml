base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: ta
  text: அப்போது அவர்கள், “இன்னும் நமக்கு ஏன் சாட்சியம் தேவை?[a] ஏனெனில், நாமே அவருடைய வாயிலிருந்தே கேட்டோமே” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சியம் நமக்கு இன்னும் எதற்கு வேண்டும்?”
    reason: τί ἔτι ... χρείαν என்ற கிரேக்கச் சொல்லமைப்பை இன்னும் நேரடியாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: அப்போது அவர்கள் ... என்றார்கள்
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, நிகழ்வை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்பைக் குறிக்கிறது; ‘அப்போது’ இயல்பான தொடர்ச்சியைத் தருகிறது.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: இன்னும் நமக்கு ஏன் சாட்சி தேவை?
  rationale: τί ἔτι ... χρείαν ἔχειν என்ற சொல்லமைப்பின் வினாவூட்டும் பொருளை நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது. μαρτυρία நீதிவிசாரணைச் சூழலில் சாட்சி அல்லது சாட்சியம் எனப் பொருள்படும்; இங்கு ‘சாட்சி’ பொதுவாகப் புரிகிறது.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: நாமே கேட்டோமே
  rationale: αὐτοί தரும் வலியுறுத்தலை ‘நாமே’ காக்கிறது; γάρ கூறும் காரணத்தைத் தமிழின் ‘-ஓமே’ வடிவம் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: அவருடைய வாயிலிருந்தே
  rationale: அவர்கள் இயேசுவிடமிருந்து நேரடியாகக் கேட்டதைக் குறிக்கும் மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது; ‘-ஏ’ நேரடித்தன்மைக்கு வலியுறுத்தல் தருகிறது.
theological_decisions:
- issue: அவர்கள் கேட்டது இயேசுவின் எந்தக் கூற்று என்பதை வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘அவருடைய வாயிலிருந்தே நாமே கேட்டோமே’ என்று செயப்படுபொருளைச் சேர்க்காமல் வைத்தல்
  alternative: ‘அவருடைய சாட்சியை அவருடைய வாயிலிருந்தே நாமே கேட்டோமே’
  rationale: ἠκούσαμεν என்பதற்குப் பின் கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. ‘கூற்று’ அல்லது ‘சாட்சி’ என்று சேர்ப்பது உரை தராத விளக்கத்தைத் திணிக்கும்; ஆகவே மூலத்தின் சுருக்கமும் நீதிவிசாரணைத் தொனியும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், நீதிவிசாரணைச் சூழலுக்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது.
