  text: οἱ δὲ εἶπαν αὐτῷ· Ποῦ θέλεις ⸀ἑτοιμάσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “நாங்கள் எங்கே ஆயத்தம் செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறீர்கள்?” என்று கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆயத்தம் செய்ய’ என்பதற்கு ‘ஏற்பாடு செய்ய’ என்றும் மொழிபெயர்க்கலாம். எதை ஆயத்தம் செய்ய வேண்டும் என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய வசனத்தின் சூழலில் அது பஸ்கா உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: அவர்கள்
  rationale: சுட்டுப்பெயர்போல் செயல்படும் பன்மைச் சுட்டுச்சொல், சூழலில் சீடர்களைக் குறிக்கிறது. δέ இங்கு மென்மையான இணைப்புச் சொல் என்பதால் இயல்பான தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: εἶπαν αὐτῷ
  choice: அவரிடம் … என்று கேட்டார்கள்
  rationale: εἶπαν என்பதன் நேரடிப் பொருள் ‘சொன்னார்கள்’; ஆனால் தொடர்ந்து வருவது நேரடியான கேள்வி என்பதால், நவீன தமிழில் ‘கேட்டார்கள்’ என்பது இயல்பாகவும் பொருள் மாறாமலும் உள்ளது. αὐτῷ என்பது ‘அவரிடம்’ என வெளிப்படுகிறது.
- source_word: Ποῦ
  choice: எங்கே
  rationale: இடத்தைப் பற்றிய கேள்வியை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: θέλεις
  choice: நீர் விரும்புகிறீர்
  rationale: θέλω விருப்பத்தையோ நோக்கத்தையோ குறிக்கிறது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதையான ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἑτοιμάσωμεν
  choice: நாங்கள் … ஆயத்தம் செய்ய வேண்டும்
  rationale: முதல் நபர் பன்மை அஓரிஸ்ட் துணைவினை வடிவம் θέλεις என்பதுடன் சேர்ந்து, ‘நாங்கள் எங்கே ஆயத்தம் செய்ய வேண்டும் என்று நீர் விரும்புகிறீர்?’ என இயல்பாக வழங்கப்படுகிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனத்திலுள்ள பஸ்கா உணவு சூழலால் புரிகிறது.
