source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: ta
  text: அவர் ஜெபத்திலிருந்து எழுந்தபின், சீடர்களிடம் வந்து, துக்கத்தினால் அவர்கள் தூங்கிக்கொண்டிருப்பதைக் கண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துக்கத்தினால் அவர்கள் உறங்கிக்கிடப்பதைக் கண்டார்.”
    reason: கிரேக்க κοιμωμένους என்பதற்கு தொடரும் செயலாக ‘தூங்கிக்கொண்டிருப்பது’ என்றும், தூக்கநிலையாக ‘உறங்கிக்கிடப்பது’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: ஜெபத்திலிருந்து எழுந்து
  rationale: ἀναστὰς என்பது முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது; ἀπό உடன் வரும் சொற்றொடரை நெருக்கமாகப் பேணும் அதே நேரத்தில், செயல் வரிசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: சீடர்களிடம் வந்தபோது
  rationale: πρός குறிக்கும் அவர்களை நோக்கிய நகர்வையும், இப்பங்கேற்புவினை εὗρεν என்பதற்கான சூழலை அமைப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μαθητὰς
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் μαθητής என்பதற்கான வழக்கமான, துல்லியமான தமிழ் சொல்.
- source_word: εὗρεν
  choice: கண்டார்
  rationale: இங்கு εὑρίσκω என்பது ஒருவரை ஒரு குறிப்பிட்ட நிலையில் காண்பதைக் குறிக்கிறது; ‘கண்டார்’ இயல்பான தமிழாகும்.
- source_word: κοιμωμένους αὐτούς
  choice: அவர்கள் தூங்கிக்கொண்டிருப்பதை
  rationale: நிகழ்காலப் பங்கேற்புவினை, அவர் வந்தபோது அவர்கள் இருந்த தொடர்நிலையைச் சுட்டுகிறது; ‘தூங்கிக்கொண்டிருப்பது’ அதன் வினைத் தன்மையைப் பேணுகிறது.
- source_word: ἀπὸ τῆς λύπης
  choice: துக்கத்தினால்
  rationale: இங்குள்ள ἀπό காரணத்தை வெளிப்படுத்துகிறது. λύπη என்பதன் உணர்ச்சிசார் வேதனையை ‘துக்கம்’ தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: சீடர்கள் தூங்கியதற்கும் துக்கத்திற்கும் இடையிலான தொடர்பு
  choice: அவர்களுடைய தூக்கத்திற்குத் துக்கம் காரணமாக இருந்ததாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்கள் துக்கத்துடன் தூங்கிக்கொண்டிருந்தார்கள் என்று மட்டும், காரணத் தொடர்பை வலியுறுத்தாமல் வாசித்தல்.
  rationale: ἀπὸ τῆς λύπης என்பது இச்சூழலில் இயல்பாகக் காரணத்தைக் குறிக்கிறது. இதற்கு மேலான உளவியல் அல்லது கோட்பாட்டுச் சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் எளிமையும் காக்கப்பட்டுள்ளன. ‘ஜெபம்,’ ‘சீடர்கள்,’ ‘துக்கம்’ ஆகியவை பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற விளக்கவுரைகள் சேர்க்கப்படவில்லை.
