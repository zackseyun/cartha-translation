source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இதோ[a], நீங்கள் நகரத்திற்குள் நுழையும்போது, தண்ணீர்க் குடத்தைச்[b] சுமந்துகொண்டிருக்கும் ஒரு மனிதன் உங்களைச் சந்திப்பான். அவன் நுழையும் வீட்டிற்குள் அவனைப் பின்தொடருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கவனியுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் குறிப்பாக ஒரு மண்பாண்டத்தைக் குறிக்கலாம்; ஆகவே, “தண்ணீர் நிறைந்த மண்குடத்தை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் சுட்டிக்காட்டும் வலிமையை இயல்பான, மதிப்புமிக்க நவீனத் தமிழில் காக்கிறது.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: நீங்கள் நகரத்திற்குள் நுழையும்போது
  rationale: Genitive absolute அமைப்பின் காலப் பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: συναντήσει ὑμῖν
  choice: உங்களைச் சந்திப்பான்
  rationale: எதிர்கால வினையின் நேரடியான பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆணைக் குறிக்கும் மூலமொழியின் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது.
- source_word: κεράμιον ὕδατος
  choice: தண்ணீர்க் குடத்தை
  rationale: நீரைக் கொண்டுசெல்லும் பாத்திரத்தை இயல்பான தமிழில் குறிக்கிறது; அது மண்பாண்டம் என்பதற்கான சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βαστάζων
  choice: சுமந்துகொண்டிருக்கும்
  rationale: அந்த மனிதன் அப்போது செய்துகொண்டிருக்கும் தொடர்ச்சியான செயலைப் பங்கேற்பு வினையின் வலிமையுடன் தருகிறது.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: அவனைப் பின்தொடருங்கள்
  rationale: Aorist imperative-இன் நேரடியான கட்டளையைத் தெளிவாகக் காக்கிறது.
- source_word: οἰκίαν
  choice: வீட்டிற்குள்
  rationale: οἰκία என்பதன் concrete sense-ஐயும் εἰς என்பதன் உள்ளே செல்லும் திசையையும் ஒருங்கிணைத்துத் தருகிறது.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: அவன் நுழையும்
  rationale: அவன் செல்லும் குறிப்பிட்ட வீட்டை அடையாளப்படுத்தும் சார்பு வாக்கியத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
