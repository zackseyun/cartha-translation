id: LUK.22.25
reference: Luke 22:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “பிற இனத்தாரின்[a] அரசர்கள் அவர்கள்மீது ஆதிக்கம் செலுத்துகிறார்கள்; அவர்கள்மீது அதிகாரம் செலுத்துகிறவர்கள் ‘நன்மை செய்பவர்கள்’[b] என்று அழைக்கப்படுகிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளின்.”
    reason: lexical_alternative
  - marker: b
    text: “நன்மை செய்பவர்கள்” என்பது பொதுமக்களுக்கு நன்மை செய்பவர்களாகக் கருதப்பட்ட ஆட்சியாளர்கள் அல்லது செல்வாக்குள்ள ஆதரவாளர்களுக்கு வழங்கப்பட்ட ஒரு கௌரவப் பட்டம்.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: அரசர்கள்
  rationale: இச்சொல் பொதுவான ஆட்சியாளர்களை அல்ல, குறிப்பாக அரசர்களைக் குறிக்கிறது.
- source_word: τῶν ἐθνῶν
  choice: பிற இனத்தாரின்
  rationale: லூக்கா–அப்போஸ்தலர் நூல்களில் இச்சொல் பொதுவாக யூதரல்லாத மக்களைக் குறிக்கிறது; ‘பிற இனத்தார்’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது. ‘நாடுகளின்’ என்பதும் சொற்பொருள் அளவில் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κυριεύουσιν
  choice: ஆதிக்கம் செலுத்துகிறார்கள்
  rationale: வெறுமனே ஆட்சி செய்வதைவிட, பிறர்மீது மேலாதிக்கம் செலுத்தும் வலிமையான பொருளை இது காக்கிறது.
- source_word: ἐξουσιάζοντες
  choice: அதிகாரம் செலுத்துகிறவர்கள்
  rationale: அதிகாரப் பதவியில் இருப்பதை மட்டும் அல்லாமல், அதிகாரத்தைச் செயல்படுத்துவதையும் வினைநயத்துடன் வெளிப்படுத்துகிறது.
- source_word: εὐεργέται
  choice: நன்மை செய்பவர்கள்
  rationale: பொதுமக்களுக்கு நன்மை அளிப்பவர்களாகக் கருதப்பட்ட ஆட்சியாளர்கள் அல்லது செல்வாக்குள்ள ஆதரவாளர்களுக்குப் பயன்படுத்தப்பட்ட சிறப்புப் பட்டத்தை புரியக்கூடிய தமிழில் தருகிறது.
- source_word: καλοῦνται
  choice: அழைக்கப்படுகிறார்கள்
  rationale: அவர்களுக்கு வழங்கப்பட்ட பெயர் அல்லது பட்டத்தை கிரேக்கச் செயல்பாட்டு வடிவுக்கு ஏற்ப நேரடியாகக் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சீடர்களிடையே எழுந்த விவாதத்துக்கும் இயேசுவின் பதிலுக்கும் இடையிலான மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐθνῶν என்பதன் சூழல்சார் பொருள்
  choice: பிற இனத்தார்
  alternative: நாடுகள்
  rationale: இயேசு தம் சீடர்களுக்குரிய தலைமையை, யூதரல்லாத உலகத்தின் அரசியல் அதிகார முறையுடன் வேறுபடுத்திக் காட்டுகிறார். ‘பிற இனத்தார்’ என்பது புதிய ஏற்பாட்டில் வழக்கமான பொருளைப் பிரதிபலிக்கிறது; ‘நாடுகள்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆதிக்கம் செலுத்துகிறார்கள்’ என்பது உலகியலான அதிகாரப் பயன்பாட்டின் கடுமையைத் தெளிவாகக் காட்டுகிறது; ‘நன்மை செய்பவர்கள்’ மேற்கோள் குறிகளுடன் வருவதால் அது ஒரு கௌரவப் பட்டம் என்பது புலப்படுகிறது.
