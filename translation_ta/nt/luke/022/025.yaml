  source_fidelity: 'மூல கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: βασιλεῖς = “அரசர்கள்,” τῶν ἐθνῶν = “பிற இனத்தார்” (மாற்றாக “நாடுகள்” அடிக்குறிப்பில்), κυριεύουσιν = “ஆதிக்கம் செலுத்துகிறார்கள்,” ἐξουσιάζοντες = “அதிகாரம் செலுத்துகிறவர்கள்,” εὐεργέται = மேற்கோள் குறிகளுடனான “நன்மை செய்பவர்கள்,” καλοῦνται = “அழைக்கப்படுகிறார்கள்.” இரு αὐτῶν-களும் இயல்பாக அந்தப் பிற இனத்தாரையே சுட்டுகின்றன. “ஆனால்” δέ-யின் சூழல்சார் மென்மையான எதிர்மறைத் தொடர்பை ஏற்றவாறு வெளிப்படுத்துகிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது. “ஆதிக்கம் செலுத்துகிறார்கள்” ஆளுமை/மேலாதிக்கத்தின் வலிமையை இயல்பாகத் தருகிறது. “நன்மை செய்பவர்கள்” தனிப்பட்ட தமிழ்ப் பட்டமாக வழக்கில் இல்லாவிட்டாலும், மேற்கோள் குறிகளும் கலாச்சார அடிக்குறிப்பும் இது வழங்கப்பட்ட கௌரவப் பெயர் என்பதைத் தெளிவுபடுத்துகின்றன.
  terminology: “அரசர்கள்,” “அதிகாரம்,” மற்றும் “ஆதிக்கம்” ஆகியவை அரசியல் அதிகாரச் சூழலுக்கு ஏற்றவை. “பிற இனத்தார்” என்பது இச்சூழலில் ἐθνῶν என்பதற்கான ஏற்ற தமிழ் வடிவமாக உள்ளது; “நாடுகளின்” என்ற சொற்பொருள் மாற்று அடிக்குறிப்பில் சரியாகப் பாதுகாக்கப்பட்டுள்ளது. εὐεργέται-யின் கிரேக்க-ரோமப் பொது கௌரவப் பட்டப் பின்னணியை அடிக்குறிப்பு போதுமானவாறு விளக்குகிறது.
