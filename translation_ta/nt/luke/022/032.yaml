id: LUK.22.32
reference: Luke 22:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: ta
  text: ஆனால் உன் விசுவாசம்[a] ஒழிந்துபோகாதபடி நான் உனக்காக வேண்டிக்கொண்டேன். நீ திரும்பியபின்[b], உன் சகோதரர்களை உறுதிப்படுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசம்’ என்பதற்கு இங்கு ‘பற்றுறுதி’ அல்லது ‘நம்பிச் சார்ந்திருத்தல்’ என்ற பொருள் நிழல்களும் இருக்கலாம். கிரேக்கச் சொல் இவ்வொன்றோடொன்று தொடர்புடைய பொருள்களைத் தாங்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘திரும்பி வந்தபின்’ அல்லது ‘மீண்டும் திரும்பியபின்.’ பேதுரு விரைவில் செய்யவிருந்த தவறுக்குப் பிந்தைய அவரது மீட்பை இச்சொற்றொடர் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: வேண்டிக்கொண்டேன்
  rationale: இந்த வினை ஆழ்ந்த அக்கறையுடன் செய்யப்படும் மன்றாட்டைக் குறிக்கிறது. இயேசு ஏற்கெனவே செய்த வேண்டுதலையும் அதன் தொடர்ந்த பொருத்தத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ σοῦ
  choice: உனக்காக
  rationale: வேண்டுதல் குறித்த வினையுடன் வரும் περί + மரபுவேற்றுமை, ஒருவருக்காகச் செய்யப்படும் பரிந்துரை வேண்டுதலைக் குறிக்கிறது; ‘உன்னைப் பற்றி’ என்பதைக் காட்டிலும் ‘உனக்காக’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: ஒழிந்துபோகாதபடி
  rationale: ἐκλείπω என்பது குறைந்துபோதல், செயலிழத்தல், முடிவுக்கு வருதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. பேதுருவின் வரவிருக்கும் தவறை மறுக்காமலும், அவரது விசுவாசம் முற்றிலும் முடிவடையும் என்று கூறாமலும் இந்தத் தேர்வு மூலத்தின் தீவிரத்தைப் பேணுகிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு நம்பிக்கை, பற்றுறுதி, நம்பிச் சார்ந்திருத்தல் ஆகிய ஒன்றோடொன்று தொடர்புடைய பொருள்கள் உள்ளன. ‘விசுவாசம்’ அவற்றின் இறையியல் அகலத்தைக் குறுக்காமல் காக்கிறது.
- source_word: ποτε
  choice: நீ திரும்பியபின் என்ற காலத் தொடரில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது
  rationale: இச்சூழலில் ποτέ வருங்காலத்தின் ஒரு கட்டத்தை, ‘ஒருமுறை’ அல்லது ‘பின்னர் எப்போது’ என்ற வகையில் குறிக்கிறது. தமிழில் தனிச் சொல்லைச் சேர்ப்பதைவிட ‘திரும்பியபின்’ என்ற அமைப்பு இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐπιστρέψας
  choice: திரும்பியபின்
  rationale: இது திரும்புதல் அல்லது மீண்டும் நோக்கித் திரும்புதல் என்று பொருள்படலாம்; பேதுருவின் தவறுக்குப் பிந்தைய மீட்பு அல்லது மனமாற்றத்தின் நிழற்பொருளையும் அனுமதிக்கிறது. ‘மனந்திரும்பியபின்’ என்று மொழிபெயர்த்து பொருளை முன்கூட்டியே குறுக்கவில்லை.
- source_word: στήρισον
  choice: உறுதிப்படுத்து
  rationale: மற்றவர்களை நிலைபெறச் செய்தல், திடப்படுத்துதல் என்ற கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀδελφούς
  choice: சகோதரர்களை
  rationale: உடனடிச் சூழலில் இயேசுவின் ஆண் சீடர்களே குறிப்பிடப்படுவதால், மூலத்தின் ஆண்பால் பன்மை தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: πίστις என்பதில் விசுவாசம், பற்றுறுதி, நம்பிக்கை ஆகிய பொருள்கள் ஒன்றோடொன்று மேல்விரிதல்
  choice: விசுவாசம்
  alternative: பற்றுறுதி; நம்பிக்கை அல்லது நம்பிச் சார்ந்திருத்தல்
  rationale: மூலச்சொல்லின் இறையியல் அகலத்தைத் தக்கவைக்க ‘விசுவாசம்’ முதன்மை உரையில் இடம் பெறுகிறது; சோதனையின் மத்தியில் பேதுருவின் பற்றுறுதி என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐπιστρέψας என்பது பேதுருவின் வருங்கால நிலையை எவ்வாறு குறிக்கிறது
  choice: திரும்பியபின்
  alternative: திரும்பி வந்தபின்; மீண்டும் திரும்பியபின்; மனந்திரும்பியபின்
  rationale: இச்சொல் பேதுருவின் தவறுக்குப் பிந்தைய திரும்புதலையும் மீட்பையும் சுட்டுகிறது. ‘மனந்திரும்பியபின்’ என்ற குறுகிய இறையியல் விளக்கத்தை முதன்மை உரையில் திணிக்காமல், மூலத்தின் உருவகத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: ἀδελφούς என்பதன் சூழல்சார் பாலினக் குறிப்பு
  choice: சகோதரர்களை
  alternative: சகோதர சகோதரிகளை; சக விசுவாசிகளை
  rationale: இந்த நிகழ்வின் உடனடிக் குறிப்பு ஆண் சீடர்களைக் குறிக்கிறது; ஆகவே பொதுவான கலப்புப் பாலினக் குழுவாக விரிவுபடுத்தப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற செறிவும் காக்கப்பட்டுள்ளன. இயேசு பேதுருவிடம் ஒருமையில் பேசுவதால் ‘உன்/நீ’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. பழமையான ‘படிக்கு’ போன்ற வடிவங்களைத் தவிர்த்து ‘ஒழிந்துபோகாதபடி’ என இயல்பாக்கப்பட்டுள்ளது.
