  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: ta
  text: ஆனால், என் சோதனைகளில்[a] என்னோடு தொடர்ந்து நிலைத்திருந்தவர்கள் நீங்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சோதனைகள்’ என்பதற்கான கிரேக்கச் சொல் ‘பாவம் செய்யத் தூண்டும் சோதனைகள்’ அல்லது ‘கடினமான சோதனைகள்’ என்றும் பொருள்படலாம். இங்கே அது இயேசு எதிர்கொண்ட நெருக்கடிகளையும் கடின அனுபவங்களையும் பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்களே
  rationale: வாக்கியத்தின் தொடக்கத்தில் வலியுறுத்தப்பட்டுள்ள இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லின் அழுத்தத்தைத் தமிழில் ‘நீங்களே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய சூழலுடன் உள்ள முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ διαμεμενηκότες
  choice: தொடர்ந்து நிலைத்திருந்தவர்கள்
  rationale: διαμένω என்பதன் தொடர்ச்சியையும், இறந்தகாலத்தில் தொடங்கி பேசப்படும் தருணம்வரை நீடித்த நிலைப்பாட்டைக் குறிக்கும் perfect வினையெச்சத்தின் நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: உடனிருத்தல் மற்றும் தொடர்பைக் குறிக்கும் μετά + genitive என்பதற்கான இயல்பான தமிழாக்கம்.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: என் சோதனைகளில்
  rationale: πειρασμός என்பது சோதனை, கடினப் பரீட்சை, தூண்டல் ஆகிய பொருள்களைக் கொள்ளக்கூடும். ‘சோதனைகள்’ சூழலுக்கு ஏற்றதாகவும் மூலத்தின் பொருள் விரிவை ஓரளவு தக்கவைப்பதாகவும் உள்ளது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் πειρασμοῖς என்பதன் பொருள்
  choice: இயேசு எதிர்கொண்ட சோதனைகள் மற்றும் நெருக்கடிகள்
  alternative: இயேசு அனுபவித்த பாவத் தூண்டல்கள்
  rationale: சீடர்கள் இயேசுவோடு நிலைத்திருந்ததை இந்தச் சூழல் பாராட்டுவதால், அவரது ஊழியத்தில் ஏற்பட்ட எதிர்ப்பு, நெருக்கடி, கடின அனுபவங்கள் முதன்மையாகக் குறிக்கப்படுகின்றன. இருப்பினும், கிரேக்கச் சொல்லில் உள்ள ‘தூண்டல்’ என்ற சாத்தியத்தை அடிக்குறிப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘தொடர்ந்து நிலைத்திருந்தவர்கள்’ என்பது சீடர்களின் நீடித்த உடனிருப்பையும் பற்றுறுதியையும் வெளிப்படுத்துகிறது.
