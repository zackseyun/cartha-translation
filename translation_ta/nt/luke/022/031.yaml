review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the repeated direct address, the plural force of ὑμᾶς, and the sifting image. However, its wording makes Satan explicitly ask that the disciples be handed over to him ("தன்னிடம் ஒப்படைக்க வேண்டுமென்று"), an added formulation not stated in the Greek. ἐξῃτήσατο conveys an emphatic demand/request for them, with the purpose of sifting them.
  naturalness: The sentence is generally understandable, but placing the purpose before the added handover clause makes the syntax somewhat heavy. A more direct order is clearer in modern standard Tamil.
  terminology: “சீமோனே,” “இதோ,” “சாத்தான்,” and “கோதுமையைச் சலிப்பதுபோல்” are appropriate. “வற்புறுத்திக் கேட்டிருக்கிறான்” suitably conveys the force of ἐξῃτήσατο without asserting that the request was granted.
  issues:
  - severity: medium
    issue: Added explicit handover formulation
    rationale: “தன்னிடம் ஒப்படைக்க வேண்டுமென்று” introduces an explicit handing-over request. The Greek says that Satan emphatically demanded/requested “you [plural],” for the purpose of sifting; it does not specify the handover wording.
  revised_text: “சீமோனே, சீமோனே, இதோ, சாத்தான் உங்கள் அனைவரையும் கோதுமையைச் சலிப்பதுபோல் சலிப்பதற்காக வற்புறுத்திக் கேட்டிருக்கிறான்.”
  revised_footnotes: []
  revision_rationale: The revision removes the unstated explicit handover clause, retains the emphatic request, preserves the plural “your all,” and keeps the purpose and agricultural metaphor in a direct, natural Tamil sentence.
