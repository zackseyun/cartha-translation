id: LUK.22.31
reference: Luke 22:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: ta
  text: “சீமோனே, சீமோனே, இதோ, சாத்தான் உங்கள் அனைவரையும் கோதுமையைச் சலிப்பதுபோல் சலிப்பதற்காக வற்புறுத்திக் கேட்டிருக்கிறான்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμων Σίμων
  choice: சீமோனே, சீமோனே
  rationale: பெயரை இருமுறை அழைக்கும் மூலத்தின் வலியுறுத்தலையும் நேரடி அழைப்பையும் இயல்பான தமிழ் விளிவேற்றுமையுடன் காக்கிறது.
- source_word: ἰδού
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலச் சொல்லின் வலிமையைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: ἐξῃτήσατο
  choice: தன்னிடம் ஒப்படைக்க வேண்டுமென்று ... வற்புறுத்திக் கேட்டிருக்கிறான்
  rationale: இந்த வினை தனக்காக வலியுறுத்திக் கேட்பதைக் குறிக்கிறது; கோரிக்கை ஏற்கப்பட்டுவிட்டதாகச் சொல்லாமல் அதன் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: ὑμᾶς
  choice: உங்கள் அனைவரையும்
  rationale: கிரேக்கத்தில் இது பன்மை; சீமோனை மட்டும் அல்லாமல் அங்கிருந்த சீடர்கள் அனைவரையும் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: கோதுமையைச் சலிப்பதுபோல் ... சலிப்பதற்காக
  rationale: தானியத்தைச் சல்லடையில் சலிக்கும் உருவகத்தை இயல்பான தமிழில் காத்து, நோக்கத்தைக் குறிக்கும் infinitive அமைப்பையும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: சாத்தானின் கோரிக்கை நிறைவேற்றப்பட்டதா என்பது
  choice: வற்புறுத்திக் கேட்டிருக்கிறான்
  alternative: கேட்டுப் பெற்றுக்கொண்டான்
  rationale: மூல வினை சாத்தான் கோரியதை உறுதிப்படுத்துகிறது; அவனுக்கு அனுமதி வழங்கப்பட்டதாக இவ்வசனம் மட்டும் வெளிப்படையாகச் சொல்லாததால், அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: ‘உங்களை’ என்பதன் எண்ணிக்கை
  choice: உங்கள் அனைவரையும்
  alternative: உன்னை
  rationale: சீமோன் ஒருமையில் அழைக்கப்பட்டாலும் ὑμᾶς பன்மையாக உள்ளது; இந்த முக்கியமான வேறுபாடு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத் தமிழில், வாய்வழியாக வாசிக்க ஏற்ற கண்ணியமான நடை. ‘இதோ’ என்ற வேதாகமப் பயன்பாடு தக்கவைக்கப்பட்டுள்ளது; அரிதான அல்லது சமயப் பிரிவுக்குரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
