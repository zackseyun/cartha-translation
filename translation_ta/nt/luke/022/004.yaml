  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: ta
  text: அவன் போய், அவரை அவர்களிடம் எவ்வாறு ஒப்படைக்கலாம்[a] என்று தலைமை ஆசாரியர்களோடும் அதிகாரிகளோடும்[b] ஆலோசித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் காட்டிக்கொடுக்கலாம்.” கிரேக்க வினைச்சொல் “ஒப்படை,” “கையளி,” அல்லது இச்சூழலில் “காட்டிக்கொடு” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அதிகாரிகள்” என்பது ரோமப் படைவீரர்களை அல்ல, ஆலய அதிகாரிகளையோ ஆலயக் காவல்படையைச் சேர்ந்த அதிகாரிகளையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: அங்கிருந்து போய்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இயல்பான தமிழ் வினையெச்சத் தொடரால் காட்டுகிறது; சூழலிலிருந்து விலகிச் சென்ற நுணுக்கத்தையும் தக்கவைக்கிறது.
- source_word: συνελάλησεν
  choice: ஆலோசித்தான்
  rationale: வெறுமனே பேசுவதைவிட, ஒன்றாகக் கலந்து திட்டம் குறித்து விவாதித்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀρχιερεῦσιν
  choice: தலைமைக் குருமார்கள்
  rationale: ஒரே நேரத்தில் பல தலைமைக்குருக்கள் இருந்ததாகப் பொருள்படாமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மையைத் தெளிவாக்குகிறது.
- source_word: στρατηγοῖς
  choice: அதிகாரிகள்
  rationale: சொல் அதிகாரப் பொறுப்பில் இருந்தவர்களைக் குறிக்கிறது; இச்சூழலில் அவர்கள் ஆலயக் காவல் அதிகாரிகள் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: τὸ πῶς
  choice: எப்படி
  rationale: ஆலோசனையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: παραδῷ
  choice: காட்டிக்கொடுக்கலாம்
  rationale: தமிழில் இச்சூழலில் ஒருவரை எதிரிகளிடம் ஒப்படைப்பதையும் துரோகமாகக் காட்டிக்கொடுப்பதையும் இயல்பாக உணர்த்துகிறது; கிரேக்கச் சொல்லின் பரந்த ‘ஒப்படை’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: αὐτοῖς ... αὐτόν
  choice: அவரிடம் ... அவரை
  rationale: ‘அவரை’ என்பது இயேசுவையும், ஒருங்கிணைந்த குழுவைக் குறிக்கும் மரியாதை ஒருமையான ‘அவரிடம்’ என்பது தலைமைக் குருமார்களையும் அதிகாரிகளையும் குறிக்கிறது; தமிழ் உருபுகள் இரு சுட்டுகளையும் வேறுபடுத்துகின்றன.
theological_decisions:
- issue: யூதாசின் செயலில் παραδῷ என்பதன் மொழிபெயர்ப்பு
  choice: அவரைக் காட்டிக்கொடுக்கலாம்
  alternative: அவரை அவர்களிடம் ஒப்படைக்கலாம்
  rationale: சூழலில் துரோகச் செயல் தெளிவாக இருப்பதால் ‘காட்டிக்கொடுக்க’ என்பது இயல்பான தமிழாகும்; எனினும் கிரேக்க வினையின் அடிப்படை ‘ஒப்படைத்தல்’ பொருளை மாற்று வாசகமாக அடிக்குறிப்பில் தருவதன் மூலம் அதன் சொற்பொருள் பரப்பும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆலோசித்தான்’ கூட்டாகத் திட்டமிட்ட நுணுக்கத்தைத் தருகிறது. ‘காட்டிக்கொடுக்க’ வாசிப்பில் இயல்பாக இருந்தாலும், παραδίδωμι என்பதன் பரந்த பொருள் அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களை அடுத்தே முதன்மை உரையில் இடம்பெற்றுள்ளன.
