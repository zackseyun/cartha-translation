language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: ta
  text: கர்த்தர் திரும்பி, பேதுருவை நோக்கிப் பார்த்தார்[a]. பேதுரு, “இன்று சேவல் கூவுவதற்கு முன், நீ என்னை மூன்று முறை மறுதலிப்பாய்” என்று கர்த்தர் தன்னிடம் சொன்ன வார்த்தையை நினைவுகூர்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேதுருவை உற்றுப் பார்த்தார்.” கிரேக்க வினைச்சொல் நேரான அல்லது நிலைத்த பார்வையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: திரும்பி
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது.
- source_word: ὁ κύριος
  choice: கர்த்தர்
  rationale: இங்கு இயேசுவுக்குப் பயன்படுத்தப்பட்ட κύριος என்ற பட்டத்தின் புதிய ஏற்பாட்டு இறையியல் நிறையையும் வழக்கமான தமிழ் வேதாகமச் சொல்லாட்சியையும் காக்கிறது.
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: பேதுருவை நோக்கிப் பார்த்தார்
  rationale: பேதுருவை நேராகப் பார்த்த செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; தீவிரமான அல்லது நிலைத்த பார்வை என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὑπεμνήσθη
  choice: நினைவுகூர்ந்தார்
  rationale: வடிவம் ‘நினைவூட்டப்பட்டார்’ என்ற பொருளையும் அனுமதித்தாலும், சூழலில் பேதுருவின் நினைவுக்கு வந்ததே முன்னிலையில் உள்ளது; ‘நினைவுகூர்ந்தார்’ இயல்பான தமிழாகும்.
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: கர்த்தர் ... சொன்ன வார்த்தையை
  rationale: λόγος இங்கு ஒரு குறிப்பிட்ட கூற்றைக் குறிக்கிறது. தமிழில் மேற்கோளுடன் சேர்த்து வாக்கியத்தை இயல்பாக்கினாலும் ‘வார்த்தை’ என்ற முக்கியச் சொல்லைத் தக்கவைக்கிறது.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι σήμερον
  choice: இன்று சேவல் கூவுவதற்கு முன்
  rationale: πρίν உடனான இறந்தகாலமற்ற வினைவடிவத்தின் முன்னுரிமைக் காலத்தையும் σήμερον என்பதன் உடனடித்தன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது; பெயர்ச்சொல்லில் கிரேக்கத்தில் சுட்டிடைச்சொல் இல்லாததால் குறிப்பிட்ட ஒரு சேவலைத் தேவையின்றி முன்வைக்கவில்லை.
- source_word: ἀπαρνήσῃ με τρίς
  choice: நீ என்னை மூன்று முறை மறுதலிப்பாய்
  rationale: இயேசுவுடன் உள்ள தொடர்பை மறுத்தலை ‘மறுதலிப்பாய்’ துல்லியமாகத் தருகிறது; τρίς என்பதை நவீன தமிழில் தெளிவாக ‘மூன்று முறை’ என வழங்குகிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்ற பட்டம்
  choice: கர்த்தர்
  alternative: ஆண்டவர்; எஜமான்
  rationale: ‘கர்த்தர்’ என்பது பட்டத்தின் கிறிஸ்துவியல் நிறையைத் தக்கவைக்கிறது; ‘எஜமான்’ அதன் பொருளை எஜமானர் என்ற குறுகிய உறவுக்குள் மட்டுப்படுத்தக்கூடும். ‘ஆண்டவர்’ சாத்தியமான தமிழாக்கமாயினும், புதிய ஏற்பாட்டு மேற்கோள் நடையில் ‘கர்த்தர்’ தெளிவாகவும் மரியாதையாகவும் உள்ளது.
- issue: ὑπεμνήσθη என்பதிலுள்ள செயப்பாட்டு/இடைநிலை நுணுக்கம்
  choice: நினைவுகூர்ந்தார்
  alternative: நினைவூட்டப்பட்டார்
  rationale: யார் அல்லது எது நினைவூட்டியது என்பதை மூலவாக்கியம் வெளிப்படையாகச் சொல்லவில்லை. தமிழில் செயப்பாட்டை வலியுறுத்துவது தேவையற்ற விளக்கத்தை ஏற்படுத்தலாம்; ‘நினைவுகூர்ந்தார்’ நிகழ்ந்த விளைவைத் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மறுதலிப்பாய்’ போன்ற வேதாகமச் சூழலில் நன்கு அறியப்பட்ட சொல் தக்கவைக்கப்பட்டாலும், வாக்கிய அமைப்பு இயல்பான தற்போதைய தமிழாக உள்ளது.
