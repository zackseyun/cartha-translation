source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: ta
  text: அவர் பேதுருவையும் யோவானையும் அனுப்பி, “நீங்கள் போய், நாம் உண்பதற்காகப் பஸ்காவை[a] ஆயத்தம் செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பஸ்கா விருந்தை’; கிரேக்கச் சொல் பஸ்காவைப் பரந்த பொருளில் குறிக்கலாம். ஆனால் இங்கே அதை ஆயத்தம் செய்து உண்பது பற்றிய சூழல், விருந்தையே சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பி
  rationale: இறந்தகால வினையெச்ச வடிவம், பேதுருவையும் யோவானையும் அனுப்பியதையும் அதைத் தொடர்ந்து அவர் கூறியதையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: εἰπών
  choice: என்றார்
  rationale: கிரேக்கப் பங்கேற்புவினை இயேசுவின் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளின் முடிவில் ‘என்றார்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Πορευθέντες
  choice: நீங்கள் போய்
  rationale: வடிவில் இறந்தகாலப் பங்கேற்புவினையாக இருந்தாலும், கட்டளைச் சூழலில் முன்னோடி செயலைக் குறிக்கிறது; ‘போய்’ என்பது அதன் கட்டளை வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἑτοιμάσατε
  choice: ஆயத்தம் செய்யுங்கள்
  rationale: நடைமுறை ஏற்பாடுகளைச் செய்யும் கட்டளையை மரியாதைப் பன்மையுடன் தெளிவாகக் காட்டுகிறது.
- source_word: ἡμῖν
  choice: நாம் உண்பதற்காக
  rationale: ‘நமக்காக’ என்ற பயன்நிலை, தொடர்ந்து வரும் நோக்கவாக்கியத்துடன் தமிழில் இயல்பாக ஒருங்கிணைக்கப்பட்டுள்ளது; ‘நாம்’ இயேசுவையும் அவரோடு உண்பவர்களையும் உள்ளடக்குகிறது.
- source_word: τὸ πάσχα
  choice: பஸ்காவை
  rationale: சொல் பண்டிகை, விருந்து அல்லது அதனுடன் தொடர்புடைய பலியைக் குறிக்கக்கூடியதால், சூழல் உணவைச் சுட்டினாலும் மூலச்சொல்லின் பரப்பைச் சுருக்காமல் வழக்கமான வேதாகமப் பெயர் தக்கவைக்கப்படுகிறது.
- source_word: ἵνα φάγωμεν
  choice: நாம் உண்பதற்காக
  rationale: ἵνα உடன் வரும் துணைவினை குறிக்கும் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது; உண்பதன் பொருள் பஸ்கா என்பது தமிழில் வாக்கிய அமைப்பிலேயே புரிகிறது.
theological_decisions:
- issue: ‘பஸ்கா’ என்பதன் குறிப்பு
  choice: உணவு என்ற சூழலுணர்வைத் தக்கவைத்தபடி ‘பஸ்கா’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பஸ்கா விருந்து’ அல்லது ‘பஸ்கா ஆட்டுக்குட்டி’
  rationale: ஆயத்தம் செய்து உண்பது என்ற சூழல் விருந்தை வலுவாகச் சுட்டுகிறது. எனினும் πάσχα என்ற கிரேக்கச் சொல் அதைவிடப் பரந்த குறிப்பைக் கொண்டிருக்க முடிவதால், மொழிபெயர்ப்பு அதைத் தேவையின்றி ஒரு பொருளுக்குள் மட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்கள்’ மற்றும் ‘செய்யுங்கள்’ ஆகியவை இரு சீடர்களை நோக்கிய பன்மைக் கட்டளையைத் தெளிவாக்குகின்றன. ‘பஸ்கா’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல், மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
