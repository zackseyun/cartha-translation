source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஆனால் இப்போது, பணப்பை வைத்திருப்பவர் அதை எடுத்துக்கொள்ளட்டும்; அதுபோலவே பயணப் பையையும்[a] எடுத்துக்கொள்ளட்டும். இல்லாதவர் தமது மேலங்கியை விற்று ஒரு வாளை[b] வாங்கட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பை” அல்லது “தோள்பை” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் (πήρα) பயணி எடுத்துச் செல்லும் பையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வாள்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (μάχαιρα), கத்தி அல்லது குறுவாள் போன்ற சிறிய கூராயுதத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: ஆனால் இப்போது
  rationale: முந்தைய அறிவுறுத்தல்களுடன் உள்ள வலுவான மாறுபாட்டையும் νῦν என்பதன் காலக் குறிப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ ἔχων
  choice: வைத்திருப்பவர்
  rationale: பால் வேறுபாடு காட்டாமல், பொதுவாக ஒருவரைக் குறிக்கும் பெயரெச்சத் தொடராக articular participle-ஐ வழங்குகிறது.
- source_word: βαλλάντιον
  choice: பணப்பை
  rationale: பணம் எடுத்துச் செல்லும் பையைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀράτω
  choice: எடுத்துக்கொள்ளட்டும்
  rationale: பயணத்திற்குத் தம்முடன் எடுத்துச் செல்வது என்ற சூழல்சார்ந்த பொருளையும் கட்டளை வடிவையும் காக்கிறது.
- source_word: ὁμοίως καὶ πήραν
  choice: அதுபோலவே பயணப் பையையும்
  rationale: ὁμοίως என்பதன் ஒப்புமைத் தன்மையைக் காத்து, πήρα என்பது பயணி எடுத்துச் செல்லும் பை என்பதைத் தெளிவாக்குகிறது.
- source_word: ὁ μὴ ἔχων
  choice: வாள் இல்லாதவர்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தொடர்ந்து வரும் ‘வாளை வாங்கிக்கொள்ளட்டும்’ என்பதிலிருந்து இயல்பாகப் புரியும் வாளைத் தமிழில் நிரப்புகிறது.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: தமது மேலங்கியை விற்று
  rationale: ἱμάτιον என்பதன் வெளிப்புற ஆடைப் பொருளையும், தனக்குரிய ஆடை என்ற தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀγορασάτω μάχαιραν
  choice: ஒரு வாளை வாங்கிக்கொள்ளட்டும்
  rationale: நேரடியான கட்டளையையும் μάχαιρα என்பதன் வழக்கமான பரந்த பொருளையும் காக்கிறது; உருவகமாகவோ மென்மைப்படுத்தியோ மொழிபெயர்க்கவில்லை.
theological_decisions:
- issue: வாளை வாங்கும்படியான இயேசுவின் கட்டளையை நேரடியாக மொழிபெயர்ப்பதா, அல்லது வன்முறை குறித்த ஓர் விளக்கத்துக்கு ஏற்ப மென்மைப்படுத்துவதா
  choice: “ஒரு வாளை வாங்கிக்கொள்ளட்டும்” என்று நேரடியாக வழங்கப்பட்டது.
  alternative: “ஆபத்தை எதிர்கொள்ள ஆயத்தமாகட்டும்” போன்ற உருவக விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்.
  rationale: மூலத்தில் μάχαιρα என்ற சொலும் நேரடியான கட்டளை வடிவங்களும் உள்ளன. அதன் நேர்ப்பொருள் அல்லது உருவகப்பொருள் குறித்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல் அப்படியே விடுகிறது.
- issue: ὁ μὴ ἔχων என்பதில் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: தொடரும் கட்டளையின் அடிப்படையில் “வாள் இல்லாதவர்” என வழங்கப்பட்டது.
  alternative: “இல்லாதவர்” என மட்டும் வைத்து தமிழில் தெளிவின்மையை முழுமையாகத் தக்கவைத்தல்.
  rationale: கிரேக்கத்தின் சுருக்கமான அமைப்பில் செயப்படுபொருள் சூழலிலிருந்து அறியப்படுகிறது; தமிழில் பொருளுள்ள, இயல்பான வாக்கியமாக அமைய ‘வாள்’ நிரப்பப்பட்டுள்ளது. இது கட்டளையின் இறையியல் நோக்கத்தை மேலதிகமாக விளக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை பொதுப்படையான நபரைப் பால் சார்பின்றி “வர்” வடிவில் வழங்கியுள்ளோம். ஆங்கில ஆலோசனை உரையில் அடிக்குறிக் குறிகள் இடம்மாறியிருந்ததால், [a] πήρα என்பதற்குப் பின்னும் [b] μάχαιρα என்பதற்குப் பின்னும் மூலச் சொற்களுக்கு ஏற்றவாறு வைக்கப்பட்டுள்ளன.
