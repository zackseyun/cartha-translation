  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: ta
  text: தங்களில் யார் மேலானவராகக் கருதப்படுகிறார் என்பது குறித்து அவர்களுக்குள் வாக்குவாதமும் எழுந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களில் யார் மேலானவராகத் தோன்றுகிறார்.” கிரேக்க வினைச்சொல் “தோன்றுகிறார்” அல்லது “கருதப்படுகிறார்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: எழுந்தது
  rationale: ஒரு நிலைமை புதிதாக உருவானதை இங்கு குறிக்கிறது; வாக்குவாதம் தொடங்கியதை இயல்பான தமிழில் ‘எழுந்தது’ தெளிவாகச் சொல்கிறது.
- source_word: δὲ καὶ
  choice: மும்
  rationale: δέ உரையோட்டத்தின் வளர்ச்சியைக் குறிக்கிறது; καί-இன் சேர்க்கைப் பொருளை ‘வாக்குவாதமும்’ என்பதில் உள்ள ‘மும்’ இயல்பாக வெளிப்படுத்துகிறது. தமிழில் தேவையற்ற தொடக்க இணைப்புச்சொல் சேர்க்கப்படவில்லை.
- source_word: φιλονεικία
  choice: வாக்குவாதம்
  rationale: கருத்து மோதலோடு கூடிய போட்டித்தன்மையுள்ள சச்சரவைச் சுட்டுகிறது. ‘வாக்குவாதம்’ நவீனத் தமிழில் தெளிவாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: ἐν αὐτοῖς
  choice: அவர்களுக்குள்
  rationale: அந்தக் குழுவினரிடையே ஏற்பட்ட மோதல் என்ற சமூக உறவுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: τὸ τίς αὐτῶν
  choice: தங்களில் யார் … என்பது குறித்து
  rationale: பெயர்ச்சொல் தன்மை பெற்ற மறைமுகக் கேள்வியே வாக்குவாதத்தின் பொருள் என்பதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δοκεῖ
  choice: கருதப்படுகிறார்
  rationale: இங்கு ஒருவரின் தோற்றத்தைவிடக் குழுவினரின் மதிப்பீடு அல்லது கணிப்பே முன்னிலையில் இருப்பதால், ‘கருதப்படுகிறார்’ பொருத்தமானது. ‘தோன்றுகிறார்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἶναι
  choice: ஆக
  rationale: δοκεῖ என்பதுடன் இணையும் இருப்புப் பொருளை ‘மேலானவராகக் கருதப்படுகிறார்’ என்ற தமிழ் அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μείζων
  choice: மேலானவர்
  rationale: ஒப்பீட்டு நிலையான ‘greater’ என்ற பொருளை, சீடர்களிடையேயான அந்தஸ்து ஒப்பீட்டின் சூழலில் ‘மேலானவர்’ தெளிவாகக் காட்டுகிறது; வெளிப்படையான உயர்நிலை வடிவமான ‘அனைவரிலும் பெரியவர்’ என்று தீவிரப்படுத்தவில்லை.
theological_decisions:
- issue: சீடர்களிடையேயான அந்தஸ்தைக் குறிக்கும் ஒப்பீட்டு மொழி
  choice: மேலானவர்
  alternative: அனைவரிலும் பெரியவர் / மிக முக்கியமானவர்
  rationale: μείζων ஒப்பீட்டு வடிவம்; வெளிப்படையான உயர்நிலை வடிவம் அல்ல. ஆகவே மூலத்தின் ஒப்பீட்டுத் தன்மை காக்கப்பட்டு, அதன் வலிமை மொழிபெயர்ப்பில் அதிகரிக்கப்படவில்லை.
- issue: δοκεῖ என்பதிலுள்ள மதிப்பீடு–தோற்றம் என்ற இரு சாத்தியங்கள்
  choice: கருதப்படுகிறார்
  alternative: தோன்றுகிறார்
  rationale: அந்தஸ்தைப் பற்றிய குழு வாக்குவாதத்தில் சமூக மதிப்பீடு முதன்மையான பொருளாகத் தெரிகிறது. இருப்பினும் கிரேக்கச் சொல்லின் ‘தோன்றுகிறார்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் விடப்படாமல் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்களுக்குள் வாக்குவாதமும் எழுந்தது’ என்பது இயல்பான உரையோட்டத்தையும் καί-இன் சேர்க்கைப் பொருளையும் காக்கிறது; தேவையற்ற சமய மரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
