id: LUK.22.34
reference: Luke 22:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: ta
  text: 'அதற்கு அவர், “பேதுருவே, நான் உனக்குச் சொல்கிறேன்: நீ என்னை அறிந்திருப்பதை மூன்று முறை மறுதலிக்கும்வரை இன்று சேவல் கூவாது” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: அதற்கு அவர் ... என்றார்
  rationale: δέ இங்கு உரையாடலில் பதிலையும் மென்மையான மாறுபாட்டையும் குறிக்கிறது; ‘அதற்கு’ என்பது நவீனத் தமிழில் இயல்பாக அந்தத் தொடர்பைக் காட்டுகிறது.
- source_word: Λέγω σοι
  choice: நான் உனக்குச் சொல்கிறேன்
  rationale: நிகழ்காலச் சொல்லின் நேரடியான வலிமையையும் பொதுவான உரையாடல் சூத்திரத்தையும் காக்கும் இயல்பான தமிழ்.
- source_word: Πέτρε
  choice: பேதுருவே
  rationale: பெயர் வழக்கமான தமிழ் வேதாகம வடிவில் ஒலிபெயர்க்கப்பட்டு, அழைப்புவேற்றுமை வெளிப்படையாகக் காட்டப்படுகிறது.
- source_word: φωνήσει ... ἀλέκτωρ
  choice: சேவல் கூவாது
  rationale: சேவலை எழுவாயாகக் கொண்ட φωνέω என்பதன் சூழல்சார் பொருள் ‘கூவு’; இது தமிழில் துல்லியமும் இயல்பும் உடையது.
- source_word: σήμερον
  choice: இன்று
  rationale: நேரடியான, இயல்பான கால வினையடை.
- source_word: ἕως
  choice: மறுதலிக்கும்வரை
  rationale: மறுக்கப்பட்ட முதன்மை வினையின் கால எல்லையை ἕως குறிக்கிறது; ‘வரை’ கிரேக்கத் தொடரமைப்பையும் பொருளையும் காக்கிறது.
- source_word: τρίς
  choice: மூன்று முறை
  rationale: நவீன வாசகர்களுக்குத் தெளிவான இயல்பான இணைச்சொல்.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: நீ என்னை அறிந்திருப்பதை ... மறுதலிக்கும்வரை
  rationale: εἰδέναι விடப்படாமல், மறுதலிப்பின் உள்ளடக்கம் இயேசுவை அறிந்திருப்பது என்பதைக் காட்டுகிறது; ‘மறுதலி’ என்பது இச்சூழலில் மறுத்துரைத்தல் அல்லது ஒப்புக்கொள்ளாமை என்ற வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பேதுருவின் முன்னறிவிக்கப்பட்ட மறுதலிப்பின் தன்மை
  choice: இயேசுவை அறிந்திருப்பதை மூன்று முறை மறுதலிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இயேசுவையே மூன்று முறை மறுதலிப்பதாகச் சுருக்குதல்.
  rationale: கிரேக்கத்தில் εἰδέναι வெளிப்படையாக இருப்பதால், அறிமுகம் அல்லது அறிவை மறுப்பது என்ற உள்ளடக்கத்தை விடக்கூடாது; அதேவேளை உரை கூறாத விரிவான இறையியல் முடிவும் சேர்க்கப்படவில்லை.
- issue: ἕως உடைய காலத் தொடர்பு
  choice: ‘மறுதலிக்கும்வரை ... கூவாது’ என்ற அமைப்பு வைக்கப்பட்டது.
  alternative: ‘கூவுவதற்குமுன் ... மறுதலிப்பாய்’ என்று பொருளை மறுஅமைத்தல்.
  rationale: இரண்டும் நடைமுறையில் ஒரே நிகழ்வுவரிசையைத் தரலாம்; ஆனால் முதன்மை மொழிபெயர்ப்பு மூலத்தின் மறுக்கப்பட்ட வினை + ἕως அமைப்பை நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் நேரடித்தன்மையும் கொண்ட உரையாடல் நடை. பழமையான ‘மும்முறை’ போன்ற வடிவங்களுக்குப் பதில் ‘மூன்று முறை’ பயன்படுத்தப்பட்டது. மூலத்தில் உண்மையான விளக்கத் தேவை உள்ள இடங்கள் மொழிபெயர்ப்பிலேயே தெளிவாகக் காக்கப்பட்டதால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
