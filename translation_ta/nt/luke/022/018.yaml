  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: இப்போதுமுதல் இறைவனுடைய அரசாட்சி வரும்வரை திராட்சைக் கொடியின் கனியிலிருந்து[a] நான் குடிக்கவே மாட்டேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திராட்சரசத்திலிருந்து.’ கிரேக்கத்தில் ‘திராட்சைக் கொடியின் கனியிலிருந்து’ என்று உள்ளது; இது பொதுவாகக் கோப்பையிலிருந்த பானத்தைக் குறித்தாலும், திராட்சரசத்திற்கான வழக்கமான சொல்லைப் பயன்படுத்தாத பரந்த சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: λέγω என்பதுடன் வரும் ὑμῖν நேரடியாகக் கேட்போரிடம் உரைப்பதைக் குறிக்கிறது. γάρ முந்தைய கூற்றுடனான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என்று தக்கவைக்கப்பட்டது.
- source_word: οὐ μὴ πίω
  choice: நான் நிச்சயமாகக் குடிக்க மாட்டேன்
  rationale: οὐ μή உடன் வரும் aorist subjunctive வலியுறுத்தப்பட்ட எதிர்கால மறுப்பாகும். ‘நிச்சயமாகக் ... மாட்டேன்’ அதன் வலிமையைத் தருகிறது; தொடர்ந்து வரும் ‘வரும்வரை’ என்ற கால எல்லையை மறைக்கவில்லை.
- source_word: ἀπὸ τοῦ νῦν
  choice: இப்போதுமுதல்
  rationale: இந்தச் சொற்றொடர் தற்போதைய தருணத்தைத் தொடக்க எல்லையாகக் குறிக்கிறது. ‘இப்போதுமுதல்’ இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: திராட்சைக் கொடியின் கனியிலிருந்து
  rationale: γένημα என்பது விளைபொருள் அல்லது கனியைக் குறிக்கிறது. கிரேக்கம் இங்கு வழக்கமான ‘திராட்சரசம்’ என்ற சொல்லைப் பயன்படுத்தாததால், மூலத்தின் பரந்த மற்றும் முறையான சொல்லாட்சியை இது பாதுகாக்கிறது.
- source_word: ἕως οὗ
  choice: வரும்வரை
  rationale: ἕως οὗ மறுப்புக்குரிய கால எல்லையை அறிமுகப்படுத்துகிறது. தமிழில் வினையுடன் இணைந்த ‘வரும்வரை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: இறைவனுடைய அரசு
  rationale: βασιλεία அரசாட்சி அல்லது அரசு என்ற பரப்பைக் கொண்டது. ‘இறைவனுடைய அரசு’ அரசரின் ஆட்சியையும் அதன் ஆளுகை நிஜத்தையும் திறந்த நிலையில் வைத்திருக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: ἔλθῃ
  choice: வரும்
  rationale: ἕως οὗ என்பதற்குப் பின் வரும் aorist subjunctive எதிர்கால நோக்குள்ள காலவாக்கியமாக இருப்பதால், தமிழில் ‘வரும்வரை’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: γενήματος τῆς ἀμπέλου என்பதை ‘திராட்சரசம்’ எனச் சுருக்குவதா அல்லது மூலத்தின் விரிந்த சொல்லாட்சியைத் தக்கவைப்பதா
  choice: திராட்சைக் கொடியின் கனி
  alternative: திராட்சரசம்
  rationale: மூலத்தில் ‘திராட்சரசம்’ என்பதற்கான சாதாரணச் சொல் இல்லை. ஆகவே பானத்தைக் குறிக்கும் சூழல் இருந்தாலும், அதைவிடக் குறுகிய பொருளை முதன்மை உரையில் திணிக்காமல் மூலச் சொல்லாட்சி பாதுகாக்கப்படுகிறது.
- issue: இறைவனுடைய அரசு வருவது எந்த நிலை அல்லது முறையைக் குறிக்கிறது என்பது
  choice: இறைவனுடைய அரசு வரும்வரை
  alternative: இறைவனுடைய அரசு முழுமையாக வரும்வரை
  rationale: கிரேக்க உரை எதிர்காலக் கால எல்லையைக் கூறுகிறது; வருகையின் முறை, கட்டம் அல்லது நிறைவைத் தனியாக விளக்கவில்லை. எனவே அந்த இறையியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. வலியுறுத்தப்பட்ட மறுப்பும் எதிர்கால அரசைப் பற்றிய மூலத்தின் திறந்தநிலையும் பாதுகாக்கப்பட்டுள்ளன.
