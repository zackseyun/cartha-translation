  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: ta
  text: என் தந்தை எனக்கு ஓர் அரசாட்சியை அளித்ததுபோல, நானும் உங்களுக்கு ஓர் அரசாட்சியை அளிக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தந்தை எனக்கு ஓர் அரசாட்சியை உடன்படிக்கையாக அளித்ததுபோல, நானும் உங்களுக்கு ஓர் அரசாட்சியை உடன்படிக்கையாக அளிக்கிறேன்.” ‘அளிக்கிறேன்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க வினைச்சொல், ஏற்பாடு செய்தல் அல்லது உரிமையாக வழங்குதல் என்பதோடு, உடன்படிக்கை செய்தல் என்ற பொருளையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதிலுள்ள தொடர்ச்சியையும் இயேசுவின் தனிப்பட்ட வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διατίθεμαι / διέθετό
  choice: அளிக்கிறேன் / அளித்ததுபோல
  rationale: இந்த வினைச்சொல் ஏற்படுத்துதல், ஒப்பந்தமாக உறுதிசெய்தல், உரிமையாக வழங்குதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. அரசாட்சியை ஒருவருக்கு ‘நியமித்தல்’ என்பது தமிழில் இயல்பாக இல்லாததால், தந்தையிடமிருந்து மகனுக்கும் மகனிடமிருந்து சீடர்களுக்கும் வழங்கப்படுவதை ‘அளி’ தெளிவாகக் காட்டுகிறது; இரு இடங்களிலும் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டு கிரேக்க இணை அமைப்பு காக்கப்படுகிறது.
- source_word: ὑμῖν / μοι
  choice: உங்களுக்கு / எனக்கு
  rationale: கொடையைப் பெறுபவர்களைக் குறிக்கும் இரு வேற்றுமை வடிவங்களையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: καθὼς
  choice: அளித்ததுபோல
  rationale: இயேசுவின் செயலும் தந்தையின் முந்தைய செயலும் ஒத்தவை என்பதை ‘போல’ தெளிவாகக் குறிக்கிறது.
- source_word: ὁ πατήρ μου
  choice: என் தந்தை
  rationale: மகன்–தந்தை உறவை நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் காக்கிறது.
- source_word: βασιλείαν
  choice: ஓர் அரசாட்சி
  rationale: βασιλεία என்பது ஆளுகையையும் அரசுரிமையையும் அரசையும் குறிக்கலாம். அடுத்த வசனத்தின் அரியணைச் சூழலில், வெறும் நிலப்பரப்பைக் குறிக்கும் ‘அரசு’ என்பதைக் காட்டிலும் ‘அரசாட்சி’ அரச ஆளுகை மற்றும் அதிகாரத்தின் பொருளைச் சிறப்பாகக் காக்கிறது. ‘ஓர்’ என்பது பெயர்ச்சொல்லின் வரையறுக்கப்படாத வடிவத்தையும் தமிழின் இயல்பையும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: διατίθεμαι என்பதில் உடன்படிக்கை சார்ந்த பொருளை முதன்மை உரையில் வெளிப்படையாகச் சொல்ல வேண்டுமா?
  choice: அளிக்கிறேன்
  alternative: உடன்படிக்கையால் உறுதிசெய்கிறேன்
  rationale: வினைச்சொல்லுக்கு உடன்படிக்கைப் பொருள் இருக்கக்கூடும்; எனினும் βασιλείαν என்ற பொருளுடன் இது அரசாட்சியை வழங்குதல் அல்லது ஒப்படைத்தல் என்ற பரந்த பொருளையும் இயல்பாகக் கொண்டுள்ளது. ஒரு குறிப்பிட்ட உடன்படிக்கை விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல், அந்தச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: βασιλείαν என்பது அரசு என்ற பரப்பையா அல்லது ஆட்சி என்ற செயலையா குறிக்கிறது?
  choice: அரசாட்சி
  alternative: ஓர் அரசு
  rationale: சொல் இரண்டையும் குறிக்கக்கூடியதால் முழுமையாகத் தீர்மானிக்க முடியாது. ‘அரசாட்சி’ என்பது அரசுரிமை, ஆளுகை, அரச நிலை ஆகியவற்றை உள்ளடக்கி, உடனடி சூழலில் வரும் மேசை மற்றும் அரியணை உருவகங்களோடும் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் ‘அரசாட்சி’ இறுதியில் வந்து இரண்டு வினைகளுக்கும் பொருளாகச் செயல்படுகிறது; தமிழில் குழப்பத்தைத் தவிர்க்க அது இருமுறை சொல்லப்பட்டுள்ளது. ‘நானும்’ என்ற வடிவம் முந்தைய சூழலுடனான தொடர்ச்சியையும் இயேசுவின் வலியுறுத்தலையும் காக்கிறது.
