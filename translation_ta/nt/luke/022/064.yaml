id: LUK.22.64
reference: Luke 22:64
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: ta
  text: அவரை மூடியபின்[a], அவர்கள், “தீர்க்கதரிசனம் சொல்! உன்னை அடித்தவன் யார்?” என்று தொடர்ந்து கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய கண்களைக் கட்டியபின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: அவரை மூடியபின்
  rationale: இந்த வினையெச்சம் ஒருவரை மூடுதல் அல்லது மறைத்தல் என்பதைக் குறிக்கிறது. சூழலில் பார்வை மறைக்கப்பட்டதை உணர்த்தினாலும், மூலச்சொல் கூறுவதைவிட அதிகமாகக் குறிப்பாக்காமல் பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: ἐπηρώτων
  choice: தொடர்ந்து கேட்டார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த கேள்வியைக் காட்டுகிறது; அதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: அவர்கள் கேட்ட கேள்வியின் நேரடி உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; கிரேக்க வினையெச்சத்தின் செயல்பாட்டைத் தக்கவைக்கிறது.
- source_word: Προφήτευσον
  choice: தீர்க்கதரிசனம் சொல்!
  rationale: கேலியாகக் கூறப்பட்ட நேரடிக் கட்டளையைச் சுருக்கமாகவும் வலிமையாகவும் எடுத்துரைக்கிறது; இயேசுவின் தீர்க்கதரிசன அடையாளத்தை நோக்கிய நையாண்டியையும் தக்கவைக்கிறது.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: உன்னை அடித்தவன் யார்?
  rationale: ὁ παίσας என்ற பெயர்ச்சொல் தன்மையுள்ள வினையெச்சத்தை ‘அடித்தவன்’ என நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவின் கண்கள் கட்டப்பட்டதாக வெளிப்படையாகக் கூறலாமா
  choice: முதன்மை உரையில் ‘அவரை மூடியபின்’ என்ற விரிவான பொருளைத் தக்கவைத்தல்
  alternative: ‘அவருடைய கண்களைக் கட்டியபின்’
  rationale: சூழல் அவரது பார்வை மறைக்கப்பட்டதைத் தெளிவாக உணர்த்தினாலும், கிரேக்க வினைச்சொல் பொதுவாக மூடுதல் அல்லது மறைத்தல் என்றே கூறுகிறது. ஆகவே மூலத்தில் உள்ளதைவிட அதிகத் துல்லியத்தை முதன்மை உரையில் சேர்க்காமல், வழக்கமான புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கையாளுகிறது. ‘தொடர்ந்து கேட்டார்கள்’ என்பது நிகழ்ச்சியின் மீள்முறைத் தன்மையைத் தெளிவாக்குகிறது; ‘தீர்க்கதரிசனம் சொல்!’ என்பது கேலிக் கட்டளையின் கூர்மையைப் பாதுகாக்கிறது.
