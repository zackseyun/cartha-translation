  source_fidelity: மூலத்தின் ἤρξαντο συζητεῖν என்பதன் தொடக்கநிலையும், πρὸς ἑαυτούς என்பதன் பரஸ்பரக் குழு உணர்வும், τὸ τίς ... εἴη என்பதன் ஐயமுள்ள மறைமுகக் கேள்வியும் துல்லியமாகக் காக்கப்பட்டுள்ளன. “இதைச் செய்யப்போகிறவர்” என்பது μέλλων πράσσειν மற்றும் τοῦτο ஆகியவற்றைச் சூழலுக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்காமல் இயல்பாகத் தருகிறது.
  naturalness: “அவர்களில் இதைச் செய்யப்போகிறவர் யாராக இருக்கக்கூடும் என்று அவர்கள் தங்களுக்குள் கலந்துபேசத் தொடங்கினார்கள்” என்பது நவீனத் தரமான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. “கலந்துபேசத் தொடங்கினார்கள்” பரஸ்பர ஆலோசனையை வாக்குவாதமாக மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
  terminology: “இதை” என்ற சுட்டுமொழி முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; “காட்டிக்கொடுக்கும் செயல்” என்பது அடிக்குறிப்பில் மட்டுமே சூழல் விளக்கமாக உள்ளது. இது மூலத்தின் மறைமுகக் குறிப்பை மதிக்கிறது. பெயர்கள் அல்லது இறையியல் சொற்கள் இவ்வசனத்தில் இடம்பெறவில்லை.
