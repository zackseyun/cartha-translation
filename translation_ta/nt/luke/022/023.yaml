id: LUK.22.23
reference: Luke 22:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: ta
  text: அவர்களில் இதைச் செய்யப்போகிறவர் யாராக இருக்கக்கூடும் என்று அவர்கள் தங்களுக்குள் கலந்துபேசத் தொடங்கினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதைச் செய்யப்போகிறவர் தங்களில் யாராக இருக்கக்கூடும்.” இங்கு “இதை” என்பது முந்தைய வசனத்தில் அறிவிக்கப்பட்ட காட்டிக்கொடுக்கும் செயலைக் குறிக்கிறது.
    reason: சொற்றொடரமைப்புக்கான மாற்று மொழிபெயர்ப்பையும் சுட்டுப்பெயரின் சூழல்சார் குறிப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: ἤρξαντο
  choice: தொடங்கினார்கள்
  rationale: ἄρχω என்பதன் இறந்தகால வடிவம் இங்கு ஒரு செயல் தொடங்கியதைக் குறிக்கிறது; ‘தொடங்கினார்கள்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συζητεῖν
  choice: கலந்துபேச
  rationale: இந்தச் சூழலில் சீடர்கள் ஒருவரோடொருவர் விவாதித்துப் பேசுவதைக் குறிக்கிறது; ‘கலந்துபேச’ என்பது பகைமையான வாக்குவாதத்தைத் தேவையின்றி உணர்த்தாமல் பரஸ்பர உரையாடலைக் காட்டுகிறது.
- source_word: πρὸς ἑαυτούς
  choice: தங்களுக்குள்
  rationale: குழுவினருக்கிடையே நடந்த பரஸ்பர உரையாடலை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: அவர்களில் ... யாராக இருக்கக்கூடும்
  rationale: அறியப்பட்ட குழுவிலுள்ள ஒருவரைப் பற்றிய மறைமுகக் கேள்வியையும், ἄρα மற்றும் εἴη வெளிப்படுத்தும் ஆலோசனை சார்ந்த ஐயத்தையும் இந்த அமைப்பு காக்கிறது.
- source_word: μέλλων πράσσειν
  choice: செய்யப்போகிறவர்
  rationale: μέλλω உடன் வரும் வினையெச்சம் விரைவில் அல்லது எதிர்வரும் நிலையில் நடைபெறவுள்ள செயலைக் குறிக்கிறது; ‘செய்யப்போகிறவர்’ நோக்கத்தை மட்டும் வலியுறுத்தாமல் அந்த எதிர்நிலையை இயல்பாகத் தருகிறது.
- source_word: τοῦτο
  choice: இதை
  rationale: சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட செயலைச் சுட்டுகிறது; மூலத்தில் இல்லாத ‘காட்டிக்கொடுத்தல்’ என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘இதைச் செய்வது’ எந்தச் செயலைக் குறிக்கிறது என்பதை முதன்மை உரையிலேயே வெளிப்படுத்த வேண்டுமா
  choice: மூலத்தின் பொதுவான ‘இதைச் செய்ய’ என்ற சுட்டுமொழியைத் தக்கவைத்தல்
  alternative: ‘அவரைக் காட்டிக்கொடுக்கப்போகிறவர்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் இது இயேசுவைக் காட்டிக்கொடுக்கும் செயலைக் குறிக்கிறது என்பதைத் தெளிவாக்கினாலும், இவ்வசனத்தின் கிரேக்கம் τοῦτο μέλλων πράσσειν என்று மட்டுமே கூறுகிறது. எனவே மூலத்தின் மறைமுகத் தன்மையை முதன்மை உரையில் காத்து, அதன் குறிப்பை அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தங்களுக்குள் கலந்துபேச’ என்பது பரஸ்பர உரையாடலை இயல்பாகக் காட்டுகிறது; ‘யாராக இருக்கக்கூடும்’ என்பது மறைமுகக் கேள்வியின் ஐயத்தைக் காக்கிறது.
