  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: ta
  text: அப்போது பணிப்பெண் ஒருத்தி, வெளிச்சத்தருகே[a] அவன் உட்கார்ந்திருப்பதைக் கண்டு, அவனை உற்றுப் பார்த்து, “இவனும் அவரோடு இருந்தான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளிச்சத்தில்.” கிரேக்கச் சொற்றொடர் வெளிச்ச மூலத்துக்கு அருகிலிருப்பதையோ வெளிச்சம் படும் இடத்திலிருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: கண்டு
  rationale: இறந்தகால வினையெச்சத்தின் நிகழ்வோட்டத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: வலுவான முரண்பாட்டைக் காட்டாமல் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது.
- source_word: παιδίσκη τις
  choice: பணிப்பெண் ஒருத்தி
  rationale: இளம் பெண் பணியாளரையும் τις தரும் குறிப்பிடப்படாத தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது; அடிமை நிலையை இவ்வசனம் வலியுறுத்தாததால் ‘அடிமைப் பெண்’ எனக் கடுமையாக்கவில்லை.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: வெளிச்சத்தருகே அவன் உட்கார்ந்திருப்பதை
  rationale: பேதுருவின் அமர்ந்த நிலையைச் சொல்வதோடு, πρὸς என்பதன் வெளிச்ச மூலத்துக்கு அருகிலுள்ள இடநிலையை முதன்மையாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀτενίσασα αὐτῷ
  choice: அவனை உற்றுப் பார்த்து
  rationale: கவனமாகவும் கூர்ந்து நோக்கியதையும் சுருக்கமான இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Καὶ οὗτος
  choice: இவனும்
  rationale: சுட்டுப்பெயரின் அடையாளப்படுத்தும் வலிமையையும் καί என்பதன் ‘மேலும்/கூட’ பொருளையும் காக்கிறது.
- source_word: σὺν αὐτῷ ἦν
  choice: அவரோடு இருந்தான்
  rationale: உடனிருந்த தொடர்பை நேரடியாகக் காட்டுகிறது; சூழலில் இரண்டாவது சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது என்பதை தமிழில் தெளிவாக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மேற்கோளில் இயேசுவைக் குறிக்கும் αὐτῷ என்பதற்கான தமிழ் சுட்டுப்பெயர்
  choice: அவரோடு
  alternative: அவனோடு
  rationale: தமிழின் வழக்கமான மரியாதை நடையில் இயேசுவையும் பேதுருவையும் வேறுபடுத்தித் தெளிவாக்குகிறது; மூலத்தின் இறையியல் கருத்தை விரிவுபடுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். தொடர்ச்சியான கிரேக்க வினையெச்சங்கள் இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளன.
