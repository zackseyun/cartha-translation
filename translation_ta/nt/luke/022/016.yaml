source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: அதை நான் நிச்சயமாக உண்ண மாட்டேன்; அது இறைவனுடைய அரசாட்சியில் நிறைவேறும்வரை.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அது இறைவனுடைய அரசாட்சியில் நிறைவேறும்வரை, நான் அதை மீண்டும் ஒருபோதும் உண்ண மாட்டேன்.” கிரேக்கச் சொற்றொடர் எதிர்காலத்தில் உண்பதை வலியுறுத்தி மறுக்கிறது. சூழலின் அடிப்படையில் சில மொழிபெயர்ப்புகள் “மீண்டும்” என்பதை வெளிப்படையாகச் சேர்க்கின்றன; ஆனால் அந்தச் சொல் கிரேக்க மூலத்தில் இல்லை.'
    reason: lexical_alternative
  - marker: b
    text: “அது” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பஸ்காவைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: γάρ முந்தைய வசனத்துடனான விளக்கத் தொடர்பைக் காட்டுகிறது; λέγω ὑμῖν என்பதற்கு இயல்பான நவீனத் தமிழ் பேச்சு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ὅτι
  choice: ':'
  rationale: கிரேக்கத்தில் இது உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் முக்காற்புள்ளி அதே கட்டமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ φάγω
  choice: நான் அதை நிச்சயமாக உண்ண மாட்டேன்
  rationale: οὐ μή மற்றும் aorist subjunctive இணைவு எதிர்காலச் செயலை வலியுறுத்தி மறுக்கிறது; ‘நிச்சயமாக … மாட்டேன்’ அந்த வலிமையைத் தெளிவாகக் கடத்துகிறது.
- source_word: αὐτό
  choice: அதை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பஸ்காவைச் சுட்டும் பிரதிப்பெயர்; மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் பிரதிப்பெயராகவே வைக்கப்பட்டது.
- source_word: ἕως ὅτου
  choice: நிறைவேறும்வரை
  rationale: கால எல்லையைக் குறிக்கும் இச்சொற்றொடர் தமிழில் ‘வரை’ என்பதால் இயல்பாகவும் முழுமையாகவும் வெளிப்படுகிறது.
- source_word: πληρωθῇ
  choice: நிறைவேறும்
  rationale: செயப்பாட்டு வடிவத்தின் நிறைவேற்றம்/முழுமை பொருளையும் இரட்சிப்பு வரலாற்றுச் சாயலையும் ‘நிறைவேறு’ காக்கிறது; தமிழில் உயிரற்ற எழுவாயுடன் இவ்வடிவம் இயல்பாகச் செயப்பாட்டுப் பொருளைத் தருகிறது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: இறைவனுடைய அரசாட்சியில்
  rationale: βασιλεία இங்கு ஆட்சி மற்றும் ஆட்சிக்குரிய தளம் ஆகிய இரு சாயல்களையும் கொண்டிருக்கலாம்; ‘அரசாட்சி’ அதன் ஆட்சி சார்ந்த மையப் பொருளைக் காக்கிறது, ‘இறைவனுடைய’ என்பது τοῦ θεοῦ என்ற தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: αὐτό (‘அது/அதை’) என்பதன் சுட்டுப்பொருள்
  choice: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பஸ்கா உணவு அல்லது பஸ்கா அனுசரிப்பைச் சுட்டும் பிரதிப்பெயராகத் திறந்துவைத்தல்
  alternative: முதன்மை உரையிலேயே ‘இந்தப் பஸ்கா உணவு’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: உடனடி சூழல் பஸ்காவைச் சுட்டினாலும், கிரேக்க வசனம் பிரதிப்பெயரை மட்டுமே பயன்படுத்துகிறது. ஆகவே குறுகிய உணவு அல்லது விரிந்த அனுசரிப்பு என்ற சாத்தியங்களை அளவுக்கு மீறித் தீர்மானிக்காமல் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
- issue: ‘இறைவனுடைய அரசாட்சியில் நிறைவேறுதல்’ என்பதன் பொருள்
  choice: நிறைவேற்றத்தின் தன்மை எதுவென்று வரையறுக்காமல் மூலத்தின் முடிவுக்காலச் சாயலைக் காத்தல்
  alternative: இறைவனுடைய அரசாட்சி வருவதால் நிறைவேறும் அல்லது மெசியாவின் விருந்தில் நிறைவேறும் என்று குறிப்பாக்குதல்
  rationale: கிரேக்கம் நிறைவேற்றத்தின் முறை அல்லது குறிப்பிட்ட நிகழ்வை விளக்கவில்லை. எனவே வசனத்தின் இறையியல் அழுத்தமும் திறந்த தன்மையும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன, பொதுத் தரத் தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘உண்ண’ என்பது வேதாகமச் சூழலுக்கேற்ற மரியாதையான பொதுநடை; ‘நிச்சயமாக’ emphatic negation-ஐத் தெளிவாக்குகிறது. ‘அரசாட்சி’ βασιλείαவின் ஆட்சி சார்ந்த பொருளை முன்னிறுத்தினாலும், வசனத்தின் முடிவுக்கால நிறைவேற்றத்தைத் தேவையற்ற வகையில் விளக்கவில்லை.
