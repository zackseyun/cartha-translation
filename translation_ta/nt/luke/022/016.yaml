    issue: Main-clause flow and pronoun sequencing
    rationale: The draft’s sequence, “அது ... நிறைவேறும்வரை, நான் அதை ...,” is grammatically acceptable, but the paired pronouns in an initial subordinate clause and later main clause are less smooth in modern Tamil. Reordering the same elements improves readability without changing the scope of “until” or the referent.
