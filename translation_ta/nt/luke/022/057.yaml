source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: ta
  text: ஆனால் அவன் அதை மறுத்து[a], “பெண்ணே[b], அவரை எனக்குத் தெரியாது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “ஆனால் அவன் மறுத்து, … என்றான்.” கிரேக்கத்தில் ‘மறுத்தான்’ என்பதன் செயப்படுபொருள் கூறப்படவில்லை; இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பெண்ணே” என்பது γύναι என்ற விளிவேற்றுமைச் சொல்லின் மொழிபெயர்ப்பு. இது பேசிய பெண்ணை நேரடியாக அழைக்கிறது; “அம்மா” போன்ற மாற்றுகள் மூலத்தில் இல்லாத உறவு அல்லது மரியாதை நுணுக்கத்தைச் சேர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: அதை மறுத்து
  rationale: ἀρνέομαι இங்கு முன்வைக்கப்பட்ட குற்றச்சாட்டை அல்லது கூற்றை மறுப்பதைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது; கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை.
- source_word: λέγων
  choice: என்றான்
  rationale: நிகழ்காலப் பங்கேற்புவினையான λέγων மறுப்பின் சொற்களை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோளின் முடிவில் ‘என்றான்’ என அமைப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: அறியவில்லை என்ற நேரடியான மறுப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இப்பெயர்ப்புப் பதிலீடு இயேசுவைக் குறிக்கிறது. தமிழில் அவரைக் குறிக்க மரியாதைப் பன்மையான ‘அவரை’ இயல்பானது; ‘இந்த மனிதரை’ போன்ற விரிவாக்கம் கிரேக்கத்தில் இல்லை.
- source_word: γύναι
  choice: பெண்ணே
  rationale: γύναι என்பது பெண்ணை நேரடியாக அழைக்கும் விளிவேற்றுமை வடிவம். ‘அம்மா’ போன்ற சொற்கள் இல்லாத உறவையோ கூடுதல் மரியாதை நுணுக்கத்தையோ சேர்க்கக்கூடும்; ‘பெண்ணே’ மூலத்துக்கு நெருக்கமானது.
theological_decisions:
- issue: பேதுரு எதை மறுத்தான் என்பதை வெளிப்படையாகக் குறிப்பிடுவதா
  choice: உடனுள்ள குற்றச்சாட்டைக் குறிக்க ‘அதை’ சேர்க்கப்பட்டது.
  alternative: ‘ஆனால் அவன் மறுத்து, … என்றான்’ என்று செயப்படுபொருளின்றி மொழிபெயர்க்கலாம்.
  rationale: கிரேக்கத்தில் ἠρνήσατο என்பதற்குச் செயப்படுபொருள் வெளிப்படையாக இல்லை. ‘அவரை மறுத்து’ என்பது இயேசுவையே நேரடியாகப் புறக்கணித்தான் என்று தேவையின்றி குறிப்பாக்கிவிடலாம்; ‘அதை’ என்பது அந்தப் பெண் கூறிய கூற்றை அவன் மறுத்தான் என்ற உடனடிச் சூழலை இயல்பாகக் காட்டுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் தமிழின் இயல்பான சொல்வரிசைப்படி அமைக்கப்பட்டுள்ளது; இயேசுவைக் குறிக்கும் இடத்தில் வழக்கமான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘பெண்ணே’ என்ற நேரடி அழைப்பு மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
