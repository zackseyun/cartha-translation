  source_fidelity: மூலக் கிரேக்கத்தின் ἠρνήσατο என்பதற்குச் செயப்படுபொருள் வெளிப்படையாக இல்லாத நிலையை ‘அதை’ என உடனடி குற்றச்சாட்டு/கூற்றைக் குறிக்கும் வகையில் இயல்பாகக் கையாள்கிறது. λέγων மேற்கோளை அறிமுகப்படுத்தும் ‘என்றான்’ மூலம் சரியாக வெளிப்படுகிறது. Οὐκ οἶδα αὐτόν என்பதற்கு ‘அவரை எனக்குத் தெரியாது’ துல்லியமான, இயல்பான இணையாகும். γύναι-யின் நேரடி விளி ‘பெண்ணே’ என மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: நவீன பொதுத்தமிழில் வாசகம் இயல்பாகவும் தெளிவாகவும் உள்ளது. மேற்கோளுக்குள் விளியை முதலில் வைப்பது தமிழ் சொல்வரிசைக்கு ஏற்றது. ‘அவரை எனக்குத் தெரியாது’ என்பது மரியாதையான, வழக்கிலுள்ள சொல்லாட்சி.
  terminology: இயேசுவைக் குறிக்கும் ‘அவரை’ மரியாதைப் பன்மை நவீன தமிழ் வேதாகம நடைக்கு ஏற்றது; இது கிரேக்கப் பதிலிப்பெயரின் குறிப்பை மாற்றுவதில்லை. ‘பெண்ணே’ γύναι-யின் நேரடி அழைப்பைத் தக்கவைத்து, தேவையற்ற உறவு அல்லது மரியாதை நுணுக்கத்தைச் சேர்ப்பதில்லை. அடிக்குறிப்புகள் உரையில் சேர்க்கப்பட்ட ‘அதை’ மற்றும் விளியின் தன்மையைச் சரியாக விளக்குகின்றன.
