source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஏன் தூங்குகிறீர்கள்? சோதனைக்குள் நுழையாதபடி எழுந்து ஜெபியுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: தூங்குகிறீர்கள்
  rationale: நிகழ்கால வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ἀναστάντες
  choice: எழுந்து
  rationale: சூழலில் படுத்திருந்த அல்லது தூங்கிக்கொண்டிருந்த சீடர்களை எழும்பும்படி கூறும் பொருளை இயல்பாகத் தருகிறது.
- source_word: προσεύχεσθε
  choice: ஜெபியுங்கள்
  rationale: வேதாகமத் தமிழில் பரவலாக அறியப்படும், அதேவேளையில் நவீன வாசகர்களுக்கும் தெளிவான இறைவேண்டல் சார்ந்த சொல்.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: சோதனைக்குள் நுழைந்துவிடாதபடி
  rationale: ‘உள்ளே நுழைதல்’ என்ற மூல உருவகத்தையும், πειρασμός என்பதன் சோதனை/தூண்டுதல் சார்ந்த திறந்த பொருள் பரப்பையும் காக்கிறது.
theological_decisions:
- issue: πειρασμός என்பதன் பொருள்
  choice: சோதனை
  alternative: பாவத் தூண்டுதல்
  rationale: இச்சொல் சோதனையையும் பாவத்திற்கான தூண்டுதலையும் குறிக்கக்கூடும்; ‘சோதனை’ என்று மொழிபெயர்ப்பது மூலத்தின் பொருள் நெகிழ்வையும் இறையியல் பதற்றத்தையும் தேவையின்றி குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. ‘எழுந்து’ என்பது ‘rise/get up’ என்பதைக் கட்டளையின் ஓட்டத்தில் சுருக்கமாக வழங்குகிறது; மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
