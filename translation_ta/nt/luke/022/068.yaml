translation:
  language: ta
  text: ஆனால் நான் கேட்டால்[a], நீங்கள் நிச்சயமாகப் பதில் சொல்ல மாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: ‘நீங்கள் எவ்விதத்திலும் பதில் சொல்ல மாட்டீர்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: -ஆல் (கேட்டால்)
  rationale: நிபந்தனையைக் குறிக்கும் ἐὰν என்பதைக் இயல்பான தமிழ் நிபந்தனை விகுதியால் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐρωτήσω
  choice: நான் கேட்டால்
  rationale: ἐὰν உடன் வரும் இறந்தகாலத் தோற்றமுடைய துணைவினையின் எதிர்கால நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘விசாரித்தால்’ என்று பகைமையான விசாரணையை அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: οὐ μὴ
  choice: நிச்சயமாக ... மாட்டீர்கள்
  rationale: οὐ μὴ என்னும் வலியுறுத்தப்பட்ட மறுப்பை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀποκριθῆτε
  choice: பதில் சொல்ல
  rationale: நீதிமன்றச் சூழலில் ‘பதில் அளித்தல்’ என்ற நேரடியான பொருளை சாதாரண வாசகர்களுக்கு இயல்பாகத் தருகிறது.
