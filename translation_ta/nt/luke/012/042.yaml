source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: ta
  text: 'ஆண்டவர் கூறினார்: “அப்படியானால், தன் வீட்டுப் பணியாளர்கள்மேல், அவர்களுக்குரிய உணவுப் பங்கை[b] தக்க நேரத்தில் கொடுக்கும்படி எஜமான் நியமிக்கும் நம்பிக்கைக்குரிய, விவேகமுள்ள[a] நிர்வாகி யார்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானமுள்ள.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “அளந்து கொடுக்கப்படும் தானியப் பங்கு”; அதாவது, ஒவ்வொரு பணியாளருக்கும் ஒதுக்கப்பட்ட அளவான உணவுப் பங்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர் / எஜமான்
  rationale: பேசுகிற இயேசுவைக் குறிக்கும் முதல் பயன்பாட்டில் மரியாதைப் பட்டமாக ‘ஆண்டவர்’ என்றும், உவமையின் வீட்டுத் தலைவரைக் குறிக்கும் இரண்டாம் பயன்பாட்டில் சூழலுக்கேற்றவாறு ‘எஜமான்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πιστός
  choice: உண்மையுள்ள
  rationale: ஒப்படைக்கப்பட்ட பொறுப்பில் நம்பகமாகச் செயல்படுபவரை இயல்பாகக் குறிக்கிறது.
- source_word: οἰκονόμος
  choice: நிர்வாகி
  rationale: வீடு அல்லது சொத்துகளின் நிர்வாகப் பொறுப்பு ஒப்படைக்கப்பட்டவரைக் குறிக்கும் சொல்லின் பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: φρόνιμος
  choice: விவேகமுள்ள
  rationale: நடைமுறை ஞானத்தையும் சூழ்நிலைக்கேற்ற நல்ல தீர்மானத்தையும் குறிக்கிறது; ‘ஞானமுள்ள’ என்பதும் சாத்தியம்.
- source_word: καταστήσει
  choice: நியமிக்கும்
  rationale: ஒருவரைப் பொறுப்பான பதவியில் வைப்பதைக் குறிக்கும் எதிர்காலச் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θεραπείας
  choice: வீட்டுப் பணியாளர்கள்
  rationale: இங்கு ‘சேவை’ என்ற கருத்தை அல்லாமல், எஜமானுக்குக் கீழுள்ள பணியாளர் குழுவைக் குறிக்கிறது.
- source_word: ἐν καιρῷ
  choice: தக்க நேரத்தில்
  rationale: பொருத்தமான அல்லது நிர்ணயிக்கப்பட்ட நேரம் என்ற காலநுட்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: σιτομέτριον
  choice: அவர்களுக்குரிய உணவுப் பங்கு
  rationale: ஒவ்வொருவருக்கும் அளந்து ஒதுக்கப்பட்ட, வரலாற்றுச் சூழலில் தானியத்தை அடிப்படையாகக் கொண்ட உணவுப் பங்கைக் குறிக்கிறது.
theological_decisions:
- issue: κύριος என்ற சொல் வசனத்தில் இருமுறை வெவ்வேறு குறிப்பு நிலைகளில் வருவது
  choice: இயேசுவுக்கு ‘ஆண்டவர்’; உவமையிலுள்ள வீட்டுத் தலைவருக்கு ‘எஜமான்’
  alternative: இரு இடங்களிலும் ‘ஆண்டவர்’
  rationale: ஒரே கிரேக்கச் சொல்லின் பொருள் வரம்பைப் பாதுகாத்தபடியே, கதை சொல்லும் நிலைக்கும் உவமையின் உள் நிலைக்கும் இடையிலான வேறுபாட்டைத் தமிழில் தெளிவாக்குகிறது; எந்தக் கோட்பாட்டு முடிவையும் கூடுதலாகப் புகுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே நீண்ட வினாவாக்கிய அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது; ‘நிர்வாகி’ என்பது பழமையான அல்லது குறிப்பிட்ட சமய மரபுடன் தொடர்புடைய பதத்துக்குப் பதிலாகப் பொதுவாகப் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
