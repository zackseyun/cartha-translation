id: LUK.12.5
reference: Luke 12:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: ta
  text: 'ஆனால், யாருக்கு அஞ்ச வேண்டும் என்பதை நான் உங்களுக்குக் காட்டுவேன்: கொன்றபின் கெஹென்னாவுக்குள்[a] எறிய அதிகாரமுள்ளவருக்கு அஞ்சுங்கள். ஆம், நான் உங்களுக்குச் சொல்கிறேன், அவருக்கே அஞ்சுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நரகத்துக்குள்.’ ‘கெஹென்னா’ என்பது தீர்ப்பைக் குறிக்கும் கிரேக்கச் சொல்; இது இன்னோம் பள்ளத்தாக்கின் உருவகப் பின்னணியுடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: நான் உங்களுக்குக் காட்டுகிறேன்
  rationale: எதிர்காலச் செயலைக் குறிக்கும் கிரேக்க வடிவம், அடுத்து இயேசு சுட்டிக்காட்டப் போவதை அறிமுகப்படுத்துகிறது. தமிழில் நிகழ்கால வடிவம் உடனடியாகத் தொடர்ந்து வரும் போதனையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τίνα φοβηθῆτε
  choice: யாருக்கு அஞ்ச வேண்டும்
  rationale: மறைமுகக் கேள்வியின் பொருளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: φοβήθητε
  choice: அஞ்சுங்கள்
  rationale: எச்சரிக்கையின் வலிமையையும் வினைச்சொல் மீண்டும் வருவதையும் காக்கிறது; ‘வணங்குங்கள்’ என்பது இச்சூழலில் பொருளைத் தேவையின்றி மென்மையாக்கும்.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: கொன்ற பிறகு
  rationale: கொலைக்கும் அதைத் தொடர்ந்து வரும் தீர்ப்புச் செயலுக்கும் இடையிலான கால வரிசையை நேரடியாகக் காக்கிறது.
- source_word: ἔχοντα ἐξουσίαν
  choice: அதிகாரம் உள்ளவருக்கு
  rationale: ἐξουσία வெறும் வல்லமையை மட்டுமல்ல, அதிகாரத்தையும் குறிக்கிறது; அதனால் ‘அதிகாரம்’ பொருத்தமானது.
- source_word: ἐμβαλεῖν εἰς
  choice: உள்ளே எறிய
  rationale: வலிமையான இயக்கச் செயலை நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: γέενναν
  choice: கெஹென்னா
  rationale: பிற்காலத் தெய்வியல் கருத்துகளை மூலச்சொல்லில் கலக்காமல், அதன் யூதப் பின்னணியுள்ள தனிப்பெயரை ஒலிபெயர்த்துக் காக்கிறது.
- source_word: ναί
  choice: ஆம்
  rationale: உறுதியூட்டும் வலியுறுத்தலை எளிமையாகவும் நேரடியாகவும் தருகிறது.
- source_word: τοῦτον φοβήθητε
  choice: அவருக்கே அஞ்சுங்கள்
  rationale: τοῦτον என்பதன் சுட்டும் வலியுறுத்தலை ‘-ஏ’ விகுதி இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: தீர்ப்புச் சூழலில் γέεννα என்ற சொல்லை மொழிபெயர்த்தல்
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: கிரேக்கச் சொல்லின் வரலாற்று மற்றும் யூதச் சூழலைக் காக்க முதன்மைப் பாடத்தில் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது. ‘நரகம்’ என்பது பரவலாக அறியப்பட்ட விளக்க இணைச்சொல் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: அஞ்ச வேண்டியவரின் அடையாளம்
  choice: மூலப்பாடலைப் போல அடையாளத்தை இவ்வசனத்திலேயே வெளிப்படையாகச் சொல்லாமல் ‘அதிகாரம் உள்ளவர்’ என வைத்தல்
  alternative: ‘தேவனுக்கு அஞ்சுங்கள்’ என்று அடையாளத்தை வெளிப்படையாக்குதல்
  rationale: சூழல் அந்த அடையாளத்தை வாசகர் புரிந்துகொள்ள வழி செய்தாலும், இவ்வசனத்தின் கிரேக்க உரை பெயரை நேரடியாகக் கூறவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான எச்சரிக்கை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அஞ்சுங்கள்’ என்ற சொல் இருமுறை பயன்படுத்தப்பட்டு மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
