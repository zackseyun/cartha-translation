  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: ta
  text: நீங்களும், திருமண விருந்திலிருந்து தங்கள் எஜமான் திரும்பி வருவதை எதிர்பார்த்துக் காத்திருக்கும் பணியாளர்களைப் போல இருங்கள்; அவர் வந்து கதவைத் தட்டியவுடன், உடனே அவருக்குக் கதவைத் திறக்கும்படி இருங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος ἑαυτῶν
  choice: தங்கள் எஜமான்
  rationale: இங்கு κύριος என்பது பணியாளர்களுடன் தொடர்புடைய வீட்டுத் தலைவரைக் குறிக்கிறது; ‘எஜமான்’ அந்த உறவை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: προσδεχομένοις
  choice: காத்திருக்கும்
  rationale: எதிர்பார்ப்புடன் வருகையை நோக்கிக் காத்திருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πότε ἀναλύσῃ
  choice: எப்போது திரும்பி வருவார்
  rationale: ἀναλύω இச்சூழலில் ஒரு நிகழ்விடத்திலிருந்து புறப்பட்டுத் திரும்பி வருவதைக் குறிக்கிறது; தமிழில் இலக்கை நோக்கிய இயல்பான வெளிப்பாடு தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐκ τῶν γάμων
  choice: திருமண விருந்திலிருந்து
  rationale: பன்மை வடிவமான γάμοι சூழலில் திருமணக் கொண்டாட்டம் அல்லது விருந்தைக் குறிக்கிறது; நவீன தமிழில் ‘திருமண விருந்து’ தெளிவானது.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: உடனே அவருக்குத் திறந்துவிடுவதற்காக
  rationale: உடனடியான வரவேற்பையும் கதவைத் திறக்கும் செயலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: உவமையின் வீட்டுப் பணியாளர்–எஜமான் உறவை முன்னிலைப்படுத்துகிறது; அதேவேளை உவமையின் இயேசுவைக் குறித்த விரிவான பொருளை உரையிலேயே வெளிப்படையாகச் சேர்த்து தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் ஒப்பீடு, காத்திருப்பு, வருகை, கதவைத் தட்டுதல், உடனடியாகத் திறத்தல் ஆகிய தொடர் பாதுகாக்கப்பட்டுள்ளது.
