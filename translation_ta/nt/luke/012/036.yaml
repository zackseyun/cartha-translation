  source_fidelity: 'மூலத்தின் முக்கிய உருவகமும் உறவுகளும் சரியாக உள்ளன: சீடர்கள், திருமண விருந்திலிருந்து திரும்பிவரும் தங்கள் எஜமானை எதிர்நோக்கும் பணியாளர்களைப் போல விழிப்புடன் இருக்க வேண்டும்; அவர் வந்து தட்டும்போது உடனே திறக்க வேண்டும். ஆனால் தற்போதைய வாக்கியத்தின் இறுதியில் உள்ள “அப்படி இருங்கள்” தேவையற்ற மீளுரையாகி, ἵνα-நோக்கத்தை இயல்பாக வெளிப்படுத்தவில்லை.'
