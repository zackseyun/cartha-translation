language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: ta
  text: அவர் அவனிடம், “மனிதனே, உங்கள்மேல் நீதிபதியாகவோ பிரித்தளிப்பவனாகவோ என்னை நியமித்தவர் யார்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: மனிதனே
  rationale: நேரடியாக அழைக்கும் கிரேக்கச் சொல்லின் சற்றே கடுமையான, இடைவெளி காட்டும் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: κριτὴν
  choice: நீதிபதியாக
  rationale: வழக்கில் தீர்ப்பளிக்கும் அதிகாரமுள்ளவரைக் குறிக்கும் மூலச்சொல்லின் நேரான பொருள்.
- source_word: μεριστὴν
  choice: பங்கிடுபவராக
  rationale: சொத்து அல்லது வாரிசுரிமைப் பங்கைப் பிரித்தளிப்பவரைக் குறிக்கிறது; பொதுவான ‘நடுவர்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பகிர்வு சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்களுக்கு
  rationale: பன்மையிலுள்ள ‘உங்கள் மீது/உங்களுக்காக’ என்ற அதிகார அல்லது பொறுப்பு உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு நீதித் தீர்ப்பு வழங்கும் பங்கை மறுப்பதன் வரம்பு
  choice: இந்தக் குறிப்பிட்ட தகராறில் தம்மை நியமித்தவர் யார் என்று கேட்கும் வடிவத்தையே காத்தல்
  alternative: இயேசு எந்த வகையிலும் நீதிபதி அல்ல என்று பொதுமைப்படுத்துதல்
  rationale: மூலவாக்கியம் ஒரு வினாவாகவும் இச்சூழலுக்குரிய நியமனத்தைப் பற்றியதாகவும் உள்ளது; பரந்த கிறிஸ்தவத் தத்துவக் கூற்றாக அதை மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதும். கிரேக்கத்தில் ‘உங்களுக்கு’ என்பது பன்மை என்பதால், பேசுபவனையும் அவன் சகோதரனையும் உள்ளடக்கும் நுணுக்கம் தக்கவைக்கப்பட்டுள்ளது.
