source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: ta
  text: நீங்களும், எதைச் சாப்பிடுவது, எதைக் குடிப்பது என்று தேடிக்கொண்டிருக்காதீர்கள்; மனக்குழப்பத்தில் இருக்காதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கவலைப்படாதீர்கள்,’ ‘நிலைகுலையாதீர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இன்னும் சொல்லுக்குச் சொல்லாக, ‘நிச்சயமற்ற தவிப்பில் இருக்காதீர்கள்’ எனப் பொருள்படும்.
    reason: μετεωρίζεσθε என்பதிலுள்ள மனக்கலக்கம், நிலைகுலைவு, நிச்சயமற்ற தவிப்பு ஆகிய பொருள் நிழல்களைப் பதிவு செய்யும் சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்களும்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் உள்ள பன்மை முன்னிலைப்பெயரை இயல்பான தமிழில் காட்டுகிறது; καί என்பதையும் ‘உம்’ பிரதிபலிக்கிறது.
- source_word: ζητεῖτε
  choice: தேடிக்கொண்டிருக்காதீர்கள்
  rationale: ζητέω என்பதன் ‘தேடு/நாடு’ என்ற அடிப்படைப் பொருளைப் பேணுவதோடு, μή உடன் வரும் நிகழ்காலக் கட்டளையின் தொடர்ச்சியான முனைப்பைத் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: τί φάγητε
  choice: எதைச் சாப்பிடுவது
  rationale: உணவுக்கான ஏற்பாட்டைப் பற்றிய திறந்த, ஆலோசனைத் தன்மையுள்ள கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முன்னறிவிக்கப்பட்ட எதிர்காலம் என்ற பொருளைத் திணிப்பதில்லை.
- source_word: τί πίητε
  choice: எதைக் குடிப்பது
  rationale: τί φάγητε என்பதற்கு இணையான கிரேக்க அமைப்பையும், பானத்துக்கான ஏற்பாட்டைப் பற்றிய திறந்த கேள்வியையும் பேணுகிறது.
- source_word: μετεωρίζεσθε
  choice: மனக்கலக்கத்துடன் இருக்காதீர்கள்
  rationale: மனநிலையில் ஊசலாட்டம், அமைதியின்மை, நிச்சயமின்மையால் உண்டாகும் கலக்கம் ஆகியவற்றை உணர்த்துகிறது; ‘கவலைப்படாதீர்கள்’ என்று மட்டும் சுருக்கி அதன் உருவகத் தளத்தை முற்றிலும் மறைக்கவில்லை.
- source_word: καὶ ... καὶ ... καὶ
  choice: உம் ... , ... ;
  rationale: முதல் καί ‘நீங்களும்’ என்பதில் வெளிப்படுகிறது. உணவு, பானம் ஆகிய இணை உறுப்புகள் தமிழில் காற்புள்ளியால் இயல்பாக ஒருங்கிணைக்கப்படுகின்றன; கடைசி καί-இன் கூட்டுச் செயல் அரைப்புள்ளியால் தொடர்ச்சியாகக் காட்டப்படுகிறது.
theological_decisions:
- issue: உணவு, பானம் போன்ற உடல் தேவைகளை நாடாதிருக்கும்படி கூறும் கட்டளையின் வரம்பு
  choice: உணவு, பானம் குறித்த தொடர்ச்சியான தேடலையும் அதனுடன் சேர்ந்த மனக்கலக்கத்தையும் நேரடியாகத் தடைசெய்யும் வாசகம்
  alternative: உணவு, பானத்துக்காக எந்தத் திட்டமிடலும் செய்யக்கூடாது என்ற வாசகம்; அல்லது உடல் தேவைகளில் முற்றிலும் அக்கறையின்றி இருக்க வேண்டும் என்ற வாசகம்
  rationale: சுற்றியுள்ள சூழல் தேவைகளைப் பற்றிய கலக்கமான முனைப்பை எதிர்கொள்கிறது. மொழிபெயர்ப்பு சாதாரண முன்னேற்பாட்டையோ உணவு, பானத்தின் நன்மையையோ மறுப்பதாக விரிவுபடுத்தாமல், கட்டளையின் நேரடியான இறுக்கத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் நேரடித்தன்மையும் கொண்ட பன்மைக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘எதைச் சாப்பிடுவது, எதைக் குடிப்பது’ என்பது சாதாரண வாசகருக்கு இயல்பாகவும் கிரேக்க இணை அமைப்புக்கு நெருக்கமாகவும் உள்ளது. அரிதான அல்லது சமயப் பிரிவுக்குரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
