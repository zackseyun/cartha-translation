id: LUK.12.3
reference: Luke 12:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: ta
  text: ஆகையால், நீங்கள் இருளில் சொன்னவை அனைத்தும் வெளிச்சத்தில் கேட்கப்படும்; நீங்கள் உள்ளறைகளில் காதில் சொன்னது வீட்டுக் கூரைகளின்மேல் அறிவிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டுக் கூரைகளிலிருந்து.” பண்டைய வீடுகளின் தட்டையான கூரைகளிலிருந்து பொதுமக்களுக்கு அறிவிக்கும் காட்சி இங்கு உள்ளது.
    reason: ἐπί என்ற முன்னிடைச்சொல் இங்கு கூரைகளின்மேல் என்ற இடத்தையோ, அங்கிருந்து அறிவிக்கப்படுவதையோ இயல்பாகச் சுட்டக்கூடும்; மாற்று மொழிபெயர்ப்பும் வரலாற்றுப் படிமமும் தரப்படுகின்றன.
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் மறைந்திருப்பவை வெளிப்படும் என்று கூறியதிலிருந்து இவ்வசனம் ஒரு முடிவை எடுத்துரைக்கிறது; அந்தத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὅσα
  choice: சொன்னவை அனைத்தும்
  rationale: ரகசியமாகச் சொல்லப்பட்ட எதையும் விலக்காமல் உள்ளடக்கும் கிரேக்கச் சொல்லின் விரிவைத் தெளிவாகத் தருகிறது.
- source_word: ἐν τῇ σκοτίᾳ … ἐν τῷ φωτί
  choice: இருளில் … வெளிச்சத்தில்
  rationale: மறைவு மற்றும் வெளிப்பாடு ஆகிய பொருள்களையும், மூலத்தின் தெளிவான எதிரிணையையும் காக்கிறது.
- source_word: ἀκουσθήσεται
  choice: கேட்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πρὸς τὸ οὖς ἐλαλήσατε
  choice: காதில் சொன்னது
  rationale: ஒருவரிடம் மிகத் தனிப்பட்ட முறையில் மெதுவாகச் சொல்வதைக் குறிக்கும் உயிரோட்டமான படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τοῖς ταμείοις
  choice: உள்ளறைகளில்
  rationale: ταμεῖον என்பதன் களஞ்சிய அறை அல்லது தனியறை என்ற சாத்தியங்களை மிகக் குறுகலாக்காமல், இச்சூழலில் வலியுறுத்தப்படும் மறைவான இடத்தைக் காட்டுகிறது.
- source_word: κηρυχθήσεται
  choice: அறிவிக்கப்படும்
  rationale: இங்கு சமயப் பிரசங்கத்தை மட்டும் குறிக்காமல், பொதுமக்கள் கேட்கும்படி பகிரங்கமாக அறிவிப்பதைக் குறிக்கிறது.
- source_word: ἐπὶ τῶν δωμάτων
  choice: வீட்டுக் கூரைகளின்மேல்
  rationale: பண்டைய வீடுகளின் தட்டையான கூரைகளிலிருந்து பொதுவாக அறிவிக்கும் படிமத்தைப் பாதுகாத்து, கிரேக்கத்தின் இடப்பொருளுக்கு நெருக்கமாக உள்ளது.
theological_decisions:
- issue: மறைவானவை வெளிப்படும் விதமும் காலமும்
  choice: மறைவாகச் சொல்லப்பட்டவை பகிரங்கமாகும் என்ற எச்சரிக்கையாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: இது இறுதி நியாயத்தீர்ப்பில் நிகழும் வெளிப்பாடு என்று குறிப்பாக மொழிபெயர்ப்பது; அல்லது தற்போதைய வரலாற்றிலேயே மாய்மாலம் அம்பலமாவதாகக் கட்டுப்படுத்துவது.
  rationale: உடனடிச் சூழல் மாய்மாலம் வெளிப்படுவதைப் பற்றியதாக இருந்தாலும், இவ்வசனம் வெளிப்பாட்டின் காலத்தையோ செயல்முறையையோ வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் திறந்தநிலை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. “இருள்/வெளிச்சம்” என்ற சொல்லாட்சியும், தனிப்பட்ட “காதில்” சொல்லுதல் மற்றும் பொதுவான கூரைமேல் அறிவித்தல் என்ற எதிரிணையும் பாதுகாக்கப்பட்டுள்ளன.
