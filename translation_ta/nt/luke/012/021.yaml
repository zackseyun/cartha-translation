  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: ta
  text: தனக்காகச் செல்வத்தைக் குவித்து வைத்துக்கொண்டு, கடவுளிடம் செல்வந்தனாக இல்லாதவனின் நிலையும் இப்படித்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்காகச் செல்வத்தைக் குவித்து வைத்துக்கொண்டு, கடவுளுக்கு முன்பாகச் செல்வந்தனாக இல்லாதவனின் நிலையும் இப்படித்தான்.”
    reason: εἰς θεὸν என்ற தொடரை ‘கடவுளிடம்’ என்றும் ‘கடவுளுக்கு முன்பாக’ என்றும் சூழலில் புரிந்துகொள்ள இயலும் என்பதைக் காட்டும் சொற்பொருள் மாற்றுவடிவு.
lexical_decisions:
- source_word: οὕτως
  choice: இப்படித்தான் இருக்கிறான்
  rationale: முந்தைய உவமையின் முடிவை அதே வகையான மனிதருக்குப் பொருத்தும் சொல்லாக οὕτως வருகிறது. தமிழில் இயல்பான பழமொழித் தன்மையையும் முடிவுரையின் வலிமையையும் இது தருகிறது.
- source_word: ὁ θησαυρίζων
  choice: செல்வத்தைக் குவித்துவைத்துக்கொண்டு ... இல்லாதவன்
  rationale: கட்டுரையுடன் வரும் நிகழ்காலப் பெயரெச்சம், இச்செயலால் தனித்துக் காட்டப்படும் ஒருவரைப் பொதுவாகக் குறிக்கிறது. ‘செல்வத்தைக் குவித்துவைத்தல்’ என்பது θησαυρίζω என்பதிலுள்ள சேமித்துக் குவிக்கும் கருத்தைப் பாதுகாக்கிறது.
- source_word: ἑαυτῷ
  choice: தனக்காக
  rationale: தனக்கே பயன் சேரும் நோக்கத்தைக் குறிக்கும் தன்மைச் சுட்டுப் பெயரின் வேற்றுமைப் பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καὶ μὴ
  choice: '... இல்லாதவனும்'
  rationale: இரு பெயரெச்சங்களையும் ஒரே நபரைக் குறிக்கும் இணை அமைப்பில் வைத்துக் காட்டுகிறது. ‘-உம்’ καί என்ற இணைப்பைத் தக்கவைக்கிறது; தேவையற்ற அளவில் எதிர்மறை முரணை வலுப்படுத்தவில்லை.
- source_word: εἰς θεὸν
  choice: கடவுளிடம்
  rationale: εἰς என்பதன் கடவுளை நோக்கிய உறவு அல்லது திசைநிலையைச் சுருக்கமாகத் தெரிவிக்கிறது. அதன் பொருளை ‘கடவுளுக்கு விருப்பமானவற்றில்’ என்று விளக்கி விரிவுபடுத்தாமல், மூலத்தின் இறையியல் செறிவையும் திறந்த தன்மையையும் காக்கிறது.
- source_word: πλουτῶν
  choice: செல்வந்தனாக
  rationale: ‘செல்வமுடையவனாக இருத்தல்’ என்ற பெயரெச்சப் பொருளைத் தமிழில் இயல்பான பயனிலை வடிவில் தருகிறது; உலகச் செல்வத்தைக் குவிப்பதற்கும் கடவுளிடம் செல்வந்தனாக இருப்பதற்கும் உள்ள முரணையும் காக்கிறது.
theological_decisions:
- issue: ஒழுக்கப் போதனையில் ஆண்பால் ஒருமை பொதுப்பிரதிநிதியாக வருதல்
  choice: இல்லாதவன் ... இருக்கிறான்
  alternative: இல்லாத ஒருவர் ... இருக்கிறார்
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை பெயரெச்சம் பொதுவான எடுத்துக்காட்டு நபராக வருகிறது. தமிழிலும் அந்த இலக்கண வடிவைத் தக்கவைத்திருக்கிறது; இருப்பினும் போதனை ஆண்களுக்கு மட்டும் உரியது என்று பொருள் குறுக்கப்படவில்லை.
- issue: ‘கடவுளை நோக்கிச் செல்வந்தனாக இருத்தல்’ என்பதன் பொருள்
  choice: கடவுளிடம் செல்வந்தனாக
  alternative: கடவுளுக்கு முன்பாகச் செல்வந்தனாக
  rationale: இத்தொடரை வசனம் விரிவாக வரையறுக்கவில்லை. ஆகவே ‘கடவுளுக்குப் பிடித்த காரியங்களில் செல்வந்தன்’ போன்ற விளக்கத்தை உரைக்குள் சேர்க்காமல், உறவு சார்ந்த மூலத்தொடரின் இறையியல் செறிவும் தெளிவுறாத பரப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுளிடம் செல்வந்தனாக’ என்பது தமிழில் சற்று செறிவான உருவகம்; மூலத்தின் அபூர்வமான உறவுத் திசையையும் இறையியல் திறந்த தன்மையையும் பாதுகாப்பதற்காக அது திட்டமிட்டே தக்கவைக்கப்பட்டுள்ளது.
