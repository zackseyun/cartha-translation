source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: ta
  text: ஆனால் கடவுள் அவனிடம், “மூடனே! இந்த இரவிலேயே உன் உயிர்[a] உன்னிடமிருந்து திரும்பக் கோரப்படுகிறது. நீ ஆயத்தப்படுத்தியவை யாருடையவையாகும்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் ஆத்துமா.” கிரேக்கச் சொல் சூழலைப் பொறுத்து “உயிர்” அல்லது “ஆத்துமா” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: மூடனே
  rationale: நேரடி அழைப்பாக வரும் கடுமையான கண்டனத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; வெறும் அறிவுத்திறன் குறைவைக் காட்டாமல் விவேகமின்மையையும் உணர்த்துகிறது.
- source_word: ταύτῃ τῇ νυκτί
  choice: இந்த இரவிலேயே
  rationale: சுட்டுப்பெயருடன் வரும் காலக் குறிப்பு வலியுறுத்தும் உடனடித் தன்மையை ‘-ஏ’ தெளிவாகக் காட்டுகிறது.
- source_word: ψυχήν
  choice: உயிர்
  rationale: இச்சூழலில் அந்த மனிதனின் உடனடியாக முடிவுறவிருக்கும் வாழ்வையே முதன்மையாகக் குறிக்கிறது. கிரேக்கச் சொல்லின் ‘ஆத்துமா’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: உன்னிடமிருந்து திரும்பக் கோரப்படுகிறது
  rationale: ἀπαιτέω என்பதிலுள்ள கோருதல் அல்லது மீளக் கோருதல் என்ற பொருளை வெளிப்படுத்துகிறது. கிரேக்கத்தில் செய்பவர் குறிப்பிடப்படாத பன்மை வினை இருப்பதால், தமிழில் செய்பவரைச் சேர்க்காத இயல்பான செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἃ δὲ ἡτοίμασας
  choice: நீ ஆயத்தப்படுத்தியவை
  rationale: சேகரிக்கப்பட்ட பொருட்களைச் சுட்டும் நடுநிலைப் பன்மை உறவுப்பெயரையும் ἑτοιμάζω என்பதன் ‘ஆயத்தப்படுத்துதல்’ என்ற பொருளையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: τίνι ἔσται
  choice: யாருடையவையாகும்?
  rationale: உடைமை குறித்த சொல்லாட்சியின் சுருக்கத்தையும் வினாவின் சொல்லாட்சிசார் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: மரணச் சூழலில் ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: வசனம் அந்த மனிதனின் உடனடி மரணத்தையும் அவனுடைய இவ்வுலக வாழ்வு அவனிடமிருந்து எடுக்கப்படுவதையும் பேசுகிறது. ‘உயிர்’ என்பது சூழலுக்கு ஏற்றது; அதேவேளை மனித இயல்பைப் பற்றிய ஒரு குறுகிய இறையியல் முடிவைத் திணிக்காமல் ‘ஆத்துமா’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀπαιτοῦσιν என்ற குறிப்பிடப்படாத பன்மை எழுவாய்
  choice: செய்பவரைக் குறிப்பிடாத செயப்பாட்டு வடிவம்
  alternative: அவர்கள் உன்னிடமிருந்து திரும்பக் கோருகிறார்கள்
  rationale: மூலத்தில் கோருபவர்கள் யார் என்பது சொல்லப்படவில்லை. அவர்களை தேவதூதர்கள், கடவுள் அல்லது வேறு முகவர்கள் என அடையாளப்படுத்தாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையின் கடுமை மற்றும் கண்ணியத்தைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மூடனே’ நேரடியான கண்டனத்தையும், ‘இந்த இரவிலேயே’ உடனடித் தன்மையையும் வெளிப்படுத்துகின்றன.
