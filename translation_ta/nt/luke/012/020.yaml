  terminology: ‘உயிர்’ இச்சூழலில் ψυχή என்பதற்குப் பொருத்தமானது; ‘ஆத்துமா’ என்ற மாற்றுவாசிப்பு அடிக்குறிப்பில் முறையாகப் பாதுகாக்கப்பட்டுள்ளது. ‘மூடனே’ Ἄφρων-ன் ஒழுக்க/விவேகக் கண்டனத்தைத் தக்கவைக்கிறது; எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்கவில்லை.
