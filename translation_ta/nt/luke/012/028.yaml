source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: ta
  text: ஆனால், இன்று வயலில் இருக்கும், நாளை அடுப்பில்[b] எறியப்படும் புல்லுக்கு[a] கடவுள் இவ்வாறு உடை அணிவித்தால், குறைந்த விசுவாசமுள்ளவர்களே, உங்களுக்கு எவ்வளவு அதிகமாக உடை அணிவிப்பார்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புல்’ என்பதற்கு ‘பசுந்தாவரம்’ அல்லது ‘தாவரங்கள்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு குறிப்பிடப்படும் ‘அடுப்பு’ அப்பம் சுடும் அடுப்பு; உலர்ந்த வயற்புல் அதற்கு எரிபொருளாகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: புல்
  rationale: χόρτος என்பதன் இயல்பான தமிழாக்கம் ‘புல்’; இங்கு வயலில் குறுகிய காலமே இருந்து பின்னர் எரிபொருளாகப் பயன்படும் தாவர வளர்ச்சியை இது குறிக்கிறது.
- source_word: ἐν ἀγρῷ
  choice: வயலில்
  rationale: புல் இருக்கும் வெளிப்புற இடத்தைப் பொதுவாகவும் இயல்பாகவும் குறிக்கிறது; தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: இன்று ... இருக்கிறதும் நாளை ... எறியப்படுவதுமான
  rationale: கிரேக்கப் பங்கேற்பு வினை வடிவங்களின் சுருக்கத்தைத் தமிழில் தெளிவாக விரித்து, இன்று–நாளை என்ற நிலையாமை மாறுபாட்டைப் பாதுகாக்கிறது.
- source_word: κλίβανον
  choice: அடுப்பு
  rationale: κλίβανος பொதுவாக அப்பம் சுடும் அடுப்பைக் குறிக்கிறது; ‘உலை’ என்பதைக் காட்டிலும் ‘அடுப்பு’ இச்சூழலில் துல்லியமும் இயல்பும் உடையது.
- source_word: ἀμφιέζει
  choice: உடை உடுத்துகிறார்
  rationale: வயல்வெளித் தாவரங்களை அலங்கரிப்பதை மனிதருக்கு உடை உடுத்துவதோடு ஒப்பிடும் உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: πόσῳ μᾶλλον
  choice: இன்னும் எவ்வளவு அதிகமாக
  rationale: சிறியதிலிருந்து பெரியதற்குச் செல்லும் வாதத்தின் ஒப்பீட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀλιγόπιστοι
  choice: குறைந்த விசுவாசமுள்ளவர்களே
  rationale: சீடர்களை நேரடியாக அழைத்து, அவர்களின் குறைவான நம்பிக்கையைக் கண்டிக்கும் சொல்லின் பொருளைப் பாதுகாக்கிறது; இதை இரட்சிப்பு குறித்த தொழில்நுட்பக் கூற்றாக மாற்றவில்லை.
- source_word: εἰ δὲ
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய கருத்தைத் தொடர்ந்தபடியே வரும் மென்மையான மாறுபாட்டையும் நிபந்தனையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: கிரேக்க மூலத்தில் வெளிப்படையாக உள்ள எழுவாயை நேரடியாகவும் பொதுவாகப் புரியுமாறும் தருகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: கடவுள் புல்லுக்கு உடை உடுத்தும் விதத்தைச் சுட்டும் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὀλιγόπιστοι என்ற இயேசுவின் நேரடி அழைப்பின் வலிமை
  choice: 'நேரடியான ஆனால் அளவுக்கு மீறிக் கடுமையாக்கப்படாத கண்டிப்பு: ‘குறைந்த விசுவாசமுள்ளவர்களே’'
  alternative: ‘அற்ப விசுவாசிகளே’ என்ற அதிகக் கடுமையாக ஒலிக்கக்கூடிய வடிவம்; அல்லது நம்பிக்கைக் குறையை வெறும் விளக்கமாக மட்டும் கூறுதல்
  rationale: இச்சொல் கடவுள்மீது உள்ள குறைவான நம்பிக்கையைக் கண்டிக்கிறது; ஆனால் இரட்சிக்கும் விசுவாசம் அல்லது விசுவாசத்திலிருந்து விழுதல் பற்றிய தொழில்நுட்பக் கோட்பாட்டை முன்வைப்பதில்லை. எனவே மூலத்தின் மேய்ப்பருக்குரிய கண்டிப்பும் இறையியல் இழுபறியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இன்று–நாளை மாறுபாடும், சிறியதிலிருந்து பெரியதற்குச் செல்லும் வாதமும், நேரடியான அழைப்பும் பாதுகாக்கப்பட்டுள்ளன.
