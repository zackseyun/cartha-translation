source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: ta
  text: 'அண்டங்காக்கைகளைக் கவனித்துப் பாருங்கள்[a]: அவை விதைப்பதும் இல்லை, அறுவடை செய்வதும் இல்லை; அவற்றுக்குச் சேமிப்பறையும் இல்லை, களஞ்சியமும் இல்லை[b]; கடவுள் அவற்றுக்கு உணவளிக்கிறார். பறவைகளைவிட நீங்கள் எவ்வளவோ மதிப்புள்ளவர்கள்![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அண்டங்காக்கைகளை உற்றுக் கவனியுங்கள்” அல்லது “அண்டங்காக்கைகளைப் பற்றிக் கவனமாகச் சிந்தியுங்கள்.” “அண்டங்காக்கைகள்” என்பது காக்கை இனத்தைச் சேர்ந்த பெரிய கரும்பறவைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்க மொழியில் இங்கே இரண்டு வேறுபட்ட சேமிப்பிடச் சொற்கள் உள்ளன: ταμεῖον என்பது “சேமிப்பறை”; ἀποθήκη என்பது “களஞ்சியம்.”'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பறவைகளைவிட நீங்கள் எவ்வளவோ மேலானவர்கள்!”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: கவனித்துப் பாருங்கள்
  rationale: வெறுமனே பார்ப்பதை அல்ல, கவனமாக நோக்கிச் சிந்திப்பதைக் குறிக்கும் இறந்தகாலக் கட்டளை வடிவத்தின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κόρακας
  choice: காக்கைகள்
  rationale: κόραξ குறிக்கும் ரேவன் இனப் பறவைக்கு பொதுவான நவீனத் தமிழில் இயல்பாகப் புரியும் பெயர் ‘காக்கை’; பொதுப்படையாக ‘பறவைகள்’ என்று மாற்றாமல் குறிப்பிட்ட உருவகத்தைப் பாதுகாக்கிறது.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: விதைப்பதும் இல்லை, அறுவடை செய்வதும் இல்லை
  rationale: இரு வேளாண்மைச் செயல்களையும் இணையான அமைப்பில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ταμεῖον
  choice: சேமிப்பறை
  rationale: உள்ளகப் பொருள் சேமிப்பு அறை என்ற பொருளைத் தருவதோடு, அடுத்து வரும் ἀποθήκη என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἀποθήκη
  choice: களஞ்சியம்
  rationale: விளைபொருட்களைச் சேமிக்கும் தனிப் பெரிய இடத்தைக் குறிக்கும் இயல்பான சொல்; ταμεῖον என்பதுடன் உள்ள இரண்டு வேறுபட்ட சேமிப்பிடச் சொற்களையும் காக்கிறது.
- source_word: τρέφει
  choice: உணவளிக்கிறார்
  rationale: கடவுளின் தொடர்ந்த பராமரிப்பை எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πόσῳ μᾶλλον
  choice: எவ்வளவோ
  rationale: குறைவிலிருந்து அதிகத்துக்குச் செல்லும் வாதத்தின் தீவிரமான ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διαφέρετε
  choice: மதிப்புள்ளவர்கள்
  rationale: இச்சூழலில் வெறுமனே ‘வேறுபடுகிறீர்கள்’ என்பதல்ல, பறவைகளைவிட மேம்பட்ட மதிப்பு உடையவர்கள் என்ற பொருளைத் தருகிறது.
- source_word: τῶν πετεινῶν
  choice: பறவைகளைவிட
  rationale: முன்னர் குறிப்பிட்ட காக்கைகளைத் தொடர்ந்து, பொதுவான பறக்கும் உயிரினங்களைச் சுட்டும் பரந்த ஒப்பீட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒப்பீட்டில் கடவுளின் பராமரிப்பு
  choice: ஆனாலும் கடவுள் அவற்றுக்கு உணவளிக்கிறார்
  alternative: கடவுள் அவற்றைப் பேணுகிறார்
  rationale: உயிரினங்களுக்குக் கடவுள் செயற்படையாக உணவளிப்பதே மனிதரின் மதிப்பைப் பற்றிய இயேசுவின் ஒப்பீட்டுக்கு அடிப்படை. மூலத்தில் இல்லாத விரிவான கோட்பாட்டைச் சேர்க்காமல் அதைத் தெளிவாகக் காக்கிறது.
- issue: διαφέρετε என்பதின் ஒப்பீட்டு நுணுக்கம்
  choice: பறவைகளைவிட நீங்கள் எவ்வளவோ மதிப்புள்ளவர்கள்
  alternative: பறவைகளைவிட நீங்கள் எவ்வளவோ மேலானவர்கள்
  rationale: மதிப்பு அல்லது முக்கியத்துவத்தில் விஞ்சுதல் என்ற சூழல்சார் பொருளை எடுத்துக்கொள்கிறது; ‘மேலானவர்கள்’ என்பதில் தோன்றக்கூடிய பரந்த தரவரிசைக் கருத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், ஆனால் கண்ணியமான நடை. ‘கவனித்துப் பாருங்கள்’ என்பது கட்டளையின் சிந்தனைமிக்க வலிமையைத் தருகிறது. ‘சேமிப்பறை/களஞ்சியம்’ என்ற சொல் ஜோடி மூலத்தின் இரண்டு தனித்த சேமிப்பிடப் பெயர்களைப் பாதுகாக்கிறது. இறுதி வியப்புக்குறி ஒப்பீட்டின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
