  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: ta
  text: “பூமியின்மேல் நெருப்பை வீசவே நான் வந்தேன்; அது ஏற்கெனவே மூட்டப்பட்டிருக்க வேண்டும் என்று நான் எவ்வளவு ஆவலாய் விரும்புகிறேன்![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக: “அது ஏற்கெனவே மூட்டப்பட்டிருந்தால், நான் என்ன விரும்புகிறேன்?” கிரேக்கத் தொடர் புரிந்துகொள்வதற்குக் கடினமானது; முதன்மை உரை தீவிர விருப்பத்தை வெளிப்படுத்தும் அதன் சாத்தியமான வழக்குப் பொருளைத் தருகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: நெருப்பு
  rationale: உருவகத்தை விளக்கிவிடாமல், கிரேக்கச் சொல்லின் நேரடியானதும் இயல்பானதுமான படிமத்தைத் தக்கவைக்கிறது.
- source_word: ἦλθον
  choice: நான் வந்தேன்
  rationale: இயேசுவின் வருகையின் நோக்கத்தைச் சுட்டும் இறந்தகால வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: βαλεῖν
  choice: வீசவே
  rationale: ‘எறிதல்/வீசுதல்’ என்ற வினையின் உயிரோட்டமான படிமத்தைத் தக்கவைக்கிறது; -வே என்பது நோக்கத்தின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὴν γῆν
  choice: பூமியின்மேல்
  rationale: γῆ என்பதன் இச்சூழலுக்கேற்ற பரந்த பொருளைத் தருகிறது; ‘நாடு’ எனக் குறுக்கவில்லை.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: அது ஏற்கெனவே பற்றியிருக்க வேண்டுமென்று நான் எவ்வளவாய் விரும்புகிறேன்!
  rationale: கடினமான கிரேக்கத் தொடரை வலுவான விருப்பத்தை வெளிப்படுத்தும் வியப்புரையாகப் புரிந்து, தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: செயல் இதற்குள் நிறைவேறியிருக்க வேண்டும் என்ற கால வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνήφθη
  choice: பற்றியிருக்க
  rationale: நெருப்பு மூட்டப்பட்டு எரியத் தொடங்குவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; கிரேக்கச் செயலப்பாட்டு வடிவத்தின் விளைவைத் தருகிறது.
theological_decisions:
- issue: ‘நெருப்பு’ என்ற உருவகத்தின் பொருள்
  choice: தீர்ப்பு, தூய்மைப்படுத்துதல், பரிசுத்த ஆவி அல்லது பிளவு என்று குறிப்பிட்டு விளக்காமல் ‘நெருப்பு’ என்ற உருவகத்தையே தக்கவைத்தல்.
  alternative: உருவகத்தை ‘தீர்ப்பு’, ‘தூய்மைப்படுத்துதல்’, ‘பரிசுத்த ஆவி’ அல்லது இயேசுவின் பணியால் ஏற்படும் பிளவு என்று வெளிப்படையாகப் பொருள்கூறுதல்.
  rationale: வசனம் உருவகத்தை வரையறுக்கவில்லை. எனவே அதன் பல்வேறு சாத்தியமான இறையியல் ஒலிப்புகளையும் பதற்றத்தையும் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
- issue: τί θέλω εἰ ἤδη ἀνήφθη என்பதன் வலிமை
  choice: நெருப்பு ஏற்கெனவே பற்றியிருக்க வேண்டும் என்ற தீவிர விருப்பத்தை வெளிப்படுத்தும் வியப்புரையாக மொழிபெயர்த்தல்.
  alternative: ‘அது ஏற்கெனவே பற்றியிருந்தால் நான் வேறு என்ன விரும்புகிறேன்?’ என்ற நேரடியான கேள்வியாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத் தொடர் கடினமானது. சூழலில் வலுவான விருப்பத்தை வெளிப்படுத்தும் வழக்குத்தொடராகப் புரிவது ஒத்திசைவாக உள்ளது; இருப்பினும் நேரடியான இலக்கண வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பூமியின்மேல்’, ‘நெருப்பை வீசவே’ ஆகியவை மூலத்தின் வலுவான படிமத்தையும் சற்றே உயர்ந்த தொனியையும் தக்கவைக்கின்றன; கடினமான இறுதித் தொடர் இயல்பான தமிழில் வியப்புரையாக வழங்கப்பட்டு, உண்மையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
