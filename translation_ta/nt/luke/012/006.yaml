source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: ta
  text: ஐந்து சிட்டுக்குருவிகள் இரண்டு அசாரியக் காசுகளுக்கு விற்கப்படுகின்றன அல்லவா? ஆனாலும், அவற்றில் ஒன்றுகூட கடவுளின் பார்வையில் மறக்கப்படுவதில்லை[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டு சிறிய செப்புக் காசுகளுக்கு’; கிரேக்கத்தில் அசாரியங்கள் எனப்படும் சிறிய ரோமச் செப்புக் காசுகள் குறிப்பிடப்படுகின்றன.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவற்றில் ஒன்றுகூட கடவுளின் பார்வையில் புறக்கணிக்கப்படுவதில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: சிட்டுக்குருவிகள்
  rationale: இச்சூழலில் சிறிய, மலிவாக விற்கப்பட்ட பறவைகளைக் குறிக்கும் சொல்லுக்கு இயல்பான, குறிப்பான தமிழ் இணை இது; பொதுவான ‘சிறு பறவைகள்’ என்பதும் சாத்தியம்.
- source_word: πωλοῦνται
  choice: விற்கப்படுகின்றன
  rationale: கிரேக்க நிகழ்காலப் பாட்டு வடிவைப் பொருளிலும் வடிவிலும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: ἀσσαρίων δύο
  choice: இரண்டு அசாரியக் காசுகளுக்கு
  rationale: பண்டைய ரோம நாணயத்தின் பெயரைத் தக்கவைத்து, ‘காசுகள்’ என்பதன் மூலம் தமிழ் வாசகருக்கு அதன் வகையைத் தெளிவாக்குகிறது.
- source_word: ἐπιλελησμένον
  choice: மறக்கப்படுவதில்லை
  rationale: மறக்கப்பட்ட நிலையில் இல்லை என்ற கிரேக்க நிறைநிலைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘கவனிக்கப்படாமல்’ என்பது சாத்தியமான ஆனால் சற்று விளக்கமான மாற்று.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: ‘கடவுளுக்கு முன்பாக/அவரது பார்வையில்’ என்ற மூலத்தின் வெளிப்பாட்டை நேரடியாகத் தக்கவைக்கிறது.
- source_word: οὐχὶ ... ;
  choice: '... அல்லவா?'
  rationale: உறுதியான ஆம் பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் சொல்லாட்சிச் சக்தியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: ஆனாலும், அவற்றில் ஒன்றுகூட
  rationale: சந்தை மதிப்புக்கும் கடவுளின் நினைவுக்கும் இடையிலான சூழல் முரணை வெளிப்படுத்துவதோடு, ஐந்தில் ஒரு பறவைகூட விலக்கப்படவில்லை என்ற வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: கடவுளின் நினைவு/பராமரிப்பு மொழி
  choice: அவற்றில் ஒன்றுகூட கடவுளின் முன்னிலையில் மறக்கப்படுவதில்லை
  alternative: அவற்றில் ஒன்றுகூட கடவுளின் பார்வையில் கவனிக்கப்படாமல் இல்லை
  rationale: ‘மறக்கப்படுவதில்லை’ என்பது மூலச்சொல்லுக்கு நெருக்கமாக இருந்து, கடவுளின் கவனத்தை உணர்த்துகிறது; இவ்வசனம் வெளிப்படையாகச் சொல்வதைத் தாண்டி முழுமையான பராமரிப்புக் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. பண்டைய நாணயப் பெயர் உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது; ‘கடவுளின் முன்னிலையில்’ என்ற சிறிது செம்மையான சொற்றொடர் மூலத்தின் திட்டமிட்ட வெளிப்பாட்டைப் பாதுகாக்கிறது.
