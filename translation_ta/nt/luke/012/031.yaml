  terminology: ‘அரசாட்சி’ is a suitable contemporary rendering of βασιλεία, retaining room for both reign and kingdom. ‘அவருடைய’ appropriately preserves the Greek pronoun while the note identifies its contextual referent without making it explicit in the main text.
