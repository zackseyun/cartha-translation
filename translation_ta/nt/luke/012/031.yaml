base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: ta
  text: ஆனால், அவருடைய அரசாட்சியை[b][a] நாடுங்கள்; இவையும் உங்களுக்குச் சேர்த்துக் கொடுக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய அரசாட்சியை”; கிரேக்க மூலத்தில் “அவருடைய அரசாட்சியை” என்று உள்ளது; ‘அவர்’ யார் என்பது சூழலிலிருந்து அறியப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “அவருடைய அரசாட்சி” என்பதற்குப் பதிலாக “தேவனுடைய அரசாட்சி” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் பொருள் தேவைகளைப் பதற்றத்துடன் தேடுவதற்கு எதிராக இங்கு சொல்லப்படுவதை இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: ζητεῖτε
  choice: நாடுங்கள்
  rationale: தொடர்ந்து முன்னுரிமையோடு தேடுவதை உணர்த்தும் நிகழ்காலக் கட்டளையை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: βασιλείαν
  choice: அரசாட்சி
  rationale: தேவனுடைய ஆளுகையையும் அவரது அரசின் பரப்பையும் உள்ளடக்கக்கூடிய சொல்லாக இருந்து, இச்சூழலில் ‘ராஜ்யம்’ என்பதைக் காட்டிலும் இயல்பான நவீன தமிழை வழங்குகிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: சூழலில் தேவனைக் குறிக்கும் ஆண்பால் ஒருமைப் பிரதிப்பெயரை வெளிப்படையாக ‘தேவனுடைய’ என்று மாற்றாமல், கிரேக்க வடிவின் மறைமுகக் குறிப்பைப் பேணுகிறது.
- source_word: ταῦτα
  choice: இவையும்
  rationale: சுற்றியுள்ள வசனங்களில் கூறப்பட்ட உணவு, உடை போன்ற தேவைகளைக் குறிக்கிறது. கிரேக்கத்தில் ‘எல்லாம்’ இல்லாததால் அதைச் சேர்க்காமல், καί என்பதன் ‘-உம்’ பொருளையும் வெளிப்படுத்துகிறது.
- source_word: προστεθήσεται
  choice: சேர்த்துக் கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவையும் ‘கூடுதலாகச் சேர்த்தல்’ என்ற உருவகத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: கிரேக்க வேற்றுமைப் பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: αὐτοῦ என்பதன் சுட்டுப்பொருள்
  choice: சூழலில் தேவனைக் குறிக்கும் பிரதிப்பெயராக ‘அவருடைய அரசாட்சி’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தேவனுடைய அரசாட்சி’ என்று சுட்டுப்பொருளை வெளிப்படையாக்கலாம்.
  rationale: உடனடியான சூழலில் பிதாவும் தேவனுடைய பராமரிப்பும் பேசப்படுவதால் சுட்டுப்பொருள் தெளிவாக உள்ளது; எனினும் மூலத்தில் உள்ள பிரதிப்பெயர் வடிவத்தையும் அதன் இயல்பான மறைமுகத்தன்மையையும் முதன்மை உரை பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அரசாட்சி’ என்பது ஆளுகை மற்றும் அரசு ஆகிய இரு பரிமாணங்களுக்கும் இடமளிக்கிறது; ‘இவையும்’ என்பது மத்தேயுவின் இணை வசனத்திலுள்ள ‘எல்லாம்’ என்பதை இங்கு புகுத்தாமல் லூக்காவின் குறுகிய வாசகத்தைப் பேணுகிறது.
