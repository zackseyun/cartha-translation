  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எண்ணப்பட்டிருக்கின்றன’ என்பது மூல கிரேக்க நிறைவு காலத்தின் தொடரும் விளைவைப் பாதுகாக்கிறது.
