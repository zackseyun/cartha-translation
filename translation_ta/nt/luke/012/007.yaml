  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: ta
  text: ஆனால், உங்கள் தலையிலுள்ள ஒவ்வொரு முடியும் கூட எண்ணப்பட்டிருக்கிறது.[a] பயப்படாதீர்கள்; பல சிட்டுக்குருவிகளைவிட நீங்கள் அதிக மதிப்புடையவர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணப்பட்டுள்ளன”; பாரம்பரிய மொழிபெயர்ப்புகளில், “எண்ணப்பட்டிருக்கின்றன” என வரும்.
    reason: ἠρίθμηνται என்பதற்கான நிறைவு செயப்பாட்டு மாற்று நடை; குறியீடு ‘எண்ணப்பட்டிருக்கிறது’ என்பதோடு சரியாக இணைக்கப்பட்டுள்ளது.
  - marker: b
    text: அல்லது, “பல சிட்டுக்குருவிகளைவிட நீங்கள் அதிக மதிப்புள்ளவர்கள்.”
    reason: διαφέρετε என்பதன் ஒப்பீட்டு மதிப்பு வெளிப்பாட்டுக்கான இயல்பான சொற்சார் மாற்று; குறியீடு ஒப்பீட்டு வாக்கியத்தோடு சரியாக இணைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: ஆனால் ... கூட
  rationale: ἀλλά தரும் முந்தைய கருத்துடனான வேறுபாட்டையும், καί தரும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: உங்கள் தலையிலுள்ள முடிகளெல்லாம்
  rationale: மூலத்தின் தெளிவான உருவகத்தையும் πᾶσαι என்பதன் முழுமையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἠρίθμηνται
  choice: எண்ணப்பட்டிருக்கின்றன
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தற்போதைய விளைவும் தொடர்வதைக் காட்டும் நிறைவு காலச் செயப்பாட்டு வடிவத்தின் பொருளைத் தக்கவைக்கிறது.
- source_word: μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: பன்மை இரண்டாம் நபருக்கான நேரடியான எதிர்மறைக் கட்டளையை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: πολλῶν στρουθίων
  choice: அநேக சிட்டுக்குருவிகளைவிட
  rationale: உடனடி சூழலில் குறிப்பிடப்படும் அதே சிறிய பறவையைத் துல்லியமாகக் குறிக்கிறது; πολλῶν என்பதற்கு ‘அநேக’ என வழங்குகிறது.
- source_word: διαφέρετε
  choice: நீங்கள் மதிப்புமிக்கவர்கள்
  rationale: இச்சூழலில் உள்ள ஒப்பீட்டு மதிப்பை ‘...விட மதிப்புமிக்கவர்கள்’ என்று தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மனிதர்களுக்கும் சிட்டுக்குருவிகளுக்கும் இடையிலான ஒப்பீட்டு மதிப்பு
  choice: அநேக சிட்டுக்குருவிகளைவிட நீங்கள் மதிப்புமிக்கவர்கள்
  alternative: அநேக சிட்டுக்குருவிகளைவிட நீங்கள் மேலானவர்கள்
  rationale: διαφέρετε இச்சூழலில் வெறும் வேறுபாட்டை அல்ல, ஒப்பீட்டு மதிப்பைக் குறிக்கிறது. ‘மதிப்புமிக்கவர்கள்’ என்பது கடவுளின் அக்கறையைச் சுட்டும் குறைவிலிருந்து மிகுதிக்கான வாதத்தைத் தெளிவுபடுத்துகிறது; அதேவேளை வசனத்திற்கு அப்பாற்பட்ட தத்துவக் கூற்றைச் சேர்ப்பதில்லை.
