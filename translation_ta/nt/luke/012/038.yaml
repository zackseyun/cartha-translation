reference: Luke 12:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: ta
  text: அவர் இரண்டாம் காவல் வேளையில் வந்தாலும்[a], மூன்றாம் காவல் வேளையில் வந்தாலும், அவர்களை அவ்வாறே கண்டால், அவர்கள் பேறுபெற்றவர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இரவின் இரண்டாம் காவல் வேளையிலோ மூன்றாம் காவல் வேளையிலோ.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அந்தவர்கள் பேறுபெற்றவர்கள்.” இங்கு “அந்தவர்கள்” என்பது முந்தைய வசனங்களில் குறிப்பிடப்பட்ட பணியாளர்களைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: '...வேளையிலோ, ...வேளையிலோ'
  rationale: இரண்டு மாற்று நேரங்களையும் வலியுறுத்தும் தொடரைத் தமிழில் இயல்பான இணைநிலை ‘-ஓ ... -ஓ’ அமைப்பால் வெளிப்படுத்துகிறது; நிபந்தனைத் தன்மை ‘கண்டால்’ என்பதில் தெளிவாகிறது.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: இரண்டாம் இரவுக்காவல் வேளை ... மூன்றாம் இரவுக்காவல் வேளை
  rationale: φυλακή இங்கு இரவைப் பிரித்த காவல் நேரப்பகுதியைக் குறிக்கிறது. ‘இரவுக்காவல் வேளை’ என்பது சிறை அல்லது காவலிடம் என்ற தவறான பொருளைத் தவிர்த்து, சாதாரண வாசகருக்கும் நேரத்தைக் குறிக்கும் சொல்லாகத் தெளிவளிக்கிறது.
- source_word: ἔλθῃ
  choice: வந்து
  rationale: எதிர்காலத்தில் நிகழக்கூடிய வருகையை நிபந்தனை வாக்கியத்துக்குள் இயல்பான தமிழ் வினையெச்சமாகக் காட்டுகிறது.
- source_word: εὕρῃ οὕτως
  choice: அவர்கள் அவ்வாறே இருப்பதைக் கண்டால்
  rationale: οὕτως முந்தைய வசனத்தில் கூறப்பட்ட விழிப்புடனான ஆயத்த நிலையைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க, சூழலிலிருந்து ‘அவர்கள்’ மற்றும் ‘இருப்பதை’ வெளிப்படையாகச் சேர்க்கப்படுகின்றன.
- source_word: μακάριοί
  choice: பேறுபெற்றவர்கள்
  rationale: μακάριος குறிக்கும் இறைவனுக்கு முன்பான அருள்பெற்ற, நன்மைக்குரிய நிலையை ‘மகிழ்ச்சியானவர்கள்’ அல்லது ‘அதிர்ஷ்டசாலிகள்’ என்பதைக் காட்டிலும் துல்லியமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἐκεῖνοι
  choice: அவர்கள்
  rationale: கிரேக்கத்தில் ‘அவர்கள்/அந்தவர்கள்’ என்ற சுட்டுப்பெயர் மட்டுமே உள்ளது; உடனடி சூழலில் அது பணியாளர்களைக் குறிக்கிறது. மூலத்தின் சுருக்கத்தையும் உண்மையான சொல்லமைப்பையும் காக்க முதன்மை உரையில் ‘பணியாளர்கள்’ என்று சேர்க்காமல், அடிக்குறிப்பில் சுட்டுப்பொருள் விளக்கப்படுகிறது.
theological_decisions:
- issue: ἐκεῖνοι என்பதன் சுட்டுப்பொருளை வெளிப்படையாகக் குறிப்பிடுதல்
  choice: முதன்மை உரையில் ‘அவர்கள்’; அடிக்குறிப்பில் பணியாளர்களைக் குறிக்கிறது என்று விளக்கம்
  alternative: அந்தப் பணியாளர்கள்
  rationale: மூல வசனத்தில் δοῦλοι என்ற பெயர்ச்சொல் இல்லை; ἐκεῖνοι மட்டுமே உள்ளது. அதன் சுட்டுப்பொருள் முந்தைய சூழலில் தெளிவாக இருந்தாலும், பெயர்ச்சொல்லை முதன்மை உரையில் சேர்க்காமல் இருப்பது மூல வடிவத்தை மதிக்கிறது; அடிக்குறிப்பு வாசகருக்குத் தேவையான தெளிவை அளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டுள்ளது. ‘இரவுக்காவல் வேளை’ வரலாற்றுக் காலப்பிரிவைத் தெளிவுபடுத்துகிறது; ‘பேறுபெற்றவர்கள்’ என்பது வெறும் மனமகிழ்ச்சி அல்லது அதிர்ஷ்டம் என்ற பொருளைத் தவிர்க்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
