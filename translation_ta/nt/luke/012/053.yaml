source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: ta
  text: 'அவர்கள் பிளவுபடுவார்கள்: தந்தை மகனுக்கு எதிராகவும், மகன் தந்தைக்கு எதிராகவும்; தாய் மகளுக்கு எதிராகவும், மகள் தாய்க்கு எதிராகவும்; மாமியார் தன் மருமகளுக்கு எதிராகவும், மருமகள் தன் மாமியாருக்கு எதிராகவும் இருப்பார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிரிக்கப்படுவார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒரே குடும்பத்தினருக்குள் ஏற்படும் பிளவை வலியுறுத்துகிறது. “மருமகள்” என்பதற்கான கிரேக்கச் சொல் வேறு சூழல்களில் “மணமகள்” என்றும் பொருள்படும்; இங்கு “மாமியார்” என்பதுடனான உறவு காரணமாக “மருமகள்” என்பதே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: பிரிந்துபோவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் குடும்பத்தினரிடையே உண்டாகும் பிளவுபட்ட நிலையைக் குறிக்கிறது. தமிழில் இயல்பாகவும் முடிவுநிலையை உணர்த்துமாறும் இச்சொல் அமைந்துள்ளது.
- source_word: ἐπὶ
  choice: எதிராக
  rationale: நபர்களை இணைக்கும் இக்கட்டமைப்பில் எதிர்ப்பு அல்லது பகைநிலையைக் குறிக்கிறது; ‘எதிராக’ என்பது இயல்பான சமகாலத் தமிழ் இணை.
- source_word: πατήρ
  choice: தகப்பன்
  rationale: தந்தை–மகன் என்ற குறிப்பிட்ட குடும்ப உறவைத் தெளிவாகக் காக்கிறது; வேதாகம உரைநடைக்கு ஏற்ற, இன்றும் புரியக்கூடிய சொல்.
- source_word: υἱός
  choice: மகன்
  rationale: ஆண்பால் பிள்ளையைத் துல்லியமாகக் குறித்து, தகப்பனுடனான பரஸ்பர இணைப்பைக் காக்கிறது.
- source_word: μήτηρ
  choice: தாய்
  rationale: பெற்றெடுத்த பெண்ணைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; பரஸ்பர குடும்ப இணைப்பில் ஒரேபடியாக வழங்கப்பட்டுள்ளது.
- source_word: θυγάτηρ
  choice: மகள்
  rationale: பெண்பால் பிள்ளையைத் துல்லியமாகக் குறித்து, தாயுடனான இணைப்பைக் காக்கிறது.
- source_word: πενθερά
  choice: மாமியார்
  rationale: திருமண உறவின் தாயைக் குறிக்கும் தெளிவான சமகாலத் தமிழ் உறவுமுறைச் சொல்.
- source_word: νύμφη
  choice: மருமகள்
  rationale: வேறு சூழல்களில் ‘மணமகள்’ எனப் பொருள்படலாம்; இங்கு πενθερά உடனான பரஸ்பர உறவு ‘மருமகள்’ என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: αὐτῆς
  choice: தன்
  rationale: மாமியாருக்கும் மருமகளுக்கும் உள்ள உறவைச் சுட்டும் உடைமைப்பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விவரிக்கப்படும் பிளவின் தன்மை
  choice: இயேசுவின் பணியால் விளையும் சமூக மற்றும் குடும்ப மோதலைக் கடுமையான பரஸ்பர எதிர்ப்புச் சொற்களுடன் விவரித்தல்
  alternative: குடும்பப் பகைமையை இயேசு ஆதரிக்கிறார் எனக் காட்டுதல் அல்லது இதை வெறும் பொதுவான குடும்பத் தகராறு என மென்மைப்படுத்துதல்
  rationale: முந்தைய வசனச் சூழலில் கூறப்பட்ட பிளவின் விளைவாகக் குடும்ப உறுப்பினர்கள் ஒருவருக்கொருவர் எதிராக நிற்பதை வசனம் பட்டியலிடுகிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தணிக்காமலும், பகைமைக்கு ஒப்புதல் என்ற கருத்தைச் சேர்க்காமலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. மூலத்தின் மீளுரையும் பரஸ்பர எதிர்ப்பு அமைப்பும் காக்கப்பட்டுள்ளன. இறுதிக் கூறில் கிரேக்கத்தில் வெளிப்படையான உடைமைப்பெயர் இல்லாவிட்டாலும், தமிழில் உறவை இயல்பாகவும் இணை அமைப்பைத் தெளிவாகவும் காட்ட ‘தன்’ சேர்க்கப்பட்டுள்ளது.
