id: LUK.12.46
reference: Luke 12:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: ta
  text: அந்த அடிமையின் எஜமான், அவன் எதிர்பாராத ஒரு நாளிலும் அவன் அறியாத ஒரு நேரத்திலும் வருவார்; அவனை இரண்டாக வெட்டி[a], நம்பகமற்றவர்களோடு[b] அவனுக்கான இடத்தை ஒதுக்குவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைத் துண்டுகளாக வெட்டுவார்”; “அவனை இரண்டாக வெட்டுவார்” என்பதைக் சிலர் மரபுத்தொடராகப் புரிந்துகொண்டு, “அவனைக் கடுமையாகத் தண்டிப்பார்” என மொழிபெயர்க்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம்பாதவர்களோடு.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையின் எஜமான்–அடிமை உறவை இயல்பாகக் காட்டுகிறது; இங்கு நேரடியாக ‘ஆண்டவர்’ என்ற கிறிஸ்துவியல் பட்டத்தைத் திணிக்கவில்லை.
- source_word: δοῦλος
  choice: அடிமை
  rationale: வீட்டு நிர்வாகச் சூழலில் உரிமைக்கும் கீழ்ப்படிதலுக்கும் உட்பட்ட நிலை தெளிவாக இருப்பதால், மென்மையான ‘வேலைக்காரன்’ என்பதைவிட ‘அடிமை’ துல்லியமானது.
- source_word: ἥξει
  choice: வந்து
  rationale: எதிர்கால வருகையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வாக்கியத்தின் முதன்மை வினையான ‘நியமிப்பார்’ உடன் இணைந்த வினையெச்ச வடிவம்.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: அவன் எதிர்பாராத நாளிலும்
  rationale: προσδοκάω என்பதன் ‘எதிர்பார்’ என்ற பொருளைத் தக்கவைக்கிறது; எதிர்பார்க்கப்படாதது எஜமானின் வருகை என்பது சூழலில் தெளிவு.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: அவன் அறியாத நேரத்திலும்
  rationale: γινώσκω என்பதன் ‘அறி’ என்ற பொருளைப் பாதுகாத்து, முந்தைய ‘எதிர்பார்’ என்பதிலிருந்து உள்ள வேறுபாட்டை நிலைநிறுத்துகிறது.
- source_word: διχοτομήσει
  choice: அவனை இரண்டாக வெட்டி
  rationale: வினையின் நேரடியான, கடுமையான படிமத்தைப் பாதுகாக்கிறது. இதை ‘கடுமையாகத் தண்டிப்பார்’ என்ற மரபுத்தொடராகப் புரியும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸ μέρος αὐτοῦ
  choice: அவனுக்குரிய பங்கை
  rationale: μέρος என்பதன் ‘பங்கு/பாகம்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, தீர்ப்பில் அவனுக்கு ஒதுக்கப்படும் கதியை உணர்த்துகிறது.
- source_word: ἀπίστων
  choice: நம்பிக்கைக்குரியவர்களாய் இல்லாதவர்கள்
  rationale: உடனடி சூழலில் அடிமையின் விசுவாசமின்மை அல்லது நம்பகமின்மையைச் சுட்டுகிறது; ‘நம்பாதவர்கள்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θήσει
  choice: நியமிப்பார்
  rationale: ஒருவருக்கான பங்கு அல்லது கதியைத் தீர்மானித்து ஒதுக்கும் நீதித்தீர்ப்புச் சார்ந்த பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தண்டனையின் படிமத்தை நேரடியாக மொழிபெயர்ப்பதா அல்லது கடுமையான தண்டனை என்ற மரபுத்தொடராக மென்மைப்படுத்துவதா
  choice: ‘அவனை இரண்டாக வெட்டி’ என்ற நேரடியான படிமம் முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: ‘அவனைக் கடுமையாகத் தண்டித்து’
  rationale: διχοτομήσει என்பதன் அதிர்ச்சியூட்டும் தீர்ப்புப் படிமத்தைத் தணிக்காமல் பாதுகாக்கிறது; மரபுத்தொடர் சார்ந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀπίστων என்பது நம்பகமற்றவர்களையா அல்லது நம்பாதவர்களையா குறிக்கிறது
  choice: உவமையின் பணிப்பொறுப்பு மற்றும் விசுவாசம் சார்ந்த சூழலுக்கு ஏற்ப ‘நம்பிக்கைக்குரியவர்களாய் இல்லாதவர்கள்’ முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: ‘நம்பாதவர்கள்’
  rationale: கிரேக்கச் சொல் விசுவாசமின்மை மற்றும் அவநம்பிக்கை ஆகிய இரு பொருட்களையும் தாங்கக்கூடும். உடனடிச் சூழலுக்குரிய பொருள் முதன்மை உரையிலும், மற்ற சாத்தியம் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘எஜமான்–அடிமை’ என்பது மூலத்தின் சமூக உறவை நேரடியாகக் காட்டுகிறது. கிரேக்கத்தின் இரு காலக் கூறுகளும் (‘எதிர்பாராத நாள்’, ‘அறியாத நேரம்’) வேறுபடுத்தப்பட்டுள்ளன; தீர்ப்பின் கடுமையும் ἀπίστων என்பதிலுள்ள பொருள் இரட்டைத்தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
