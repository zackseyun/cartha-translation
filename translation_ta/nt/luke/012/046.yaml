revisions:
- from: அந்த அடிமையின் எஜமான், அவன் எதிர்பாராத நாளிலும் அவன் அறியாத நேரத்திலும் வந்து, அவனை இரண்டாக வெட்டி[a], நம்பிக்கைக்குரியவர்களாய் இல்லாதவர்களோடு[b] அவனுக்குரிய பங்கை நியமிப்பார்.
  to: அந்த அடிமையின் எஜமான், அவன் எதிர்பாராத ஒரு நாளிலும் அவன் அறியாத ஒரு நேரத்திலும் வருவார்; அவனை இரண்டாக வெட்டி[a], நம்பகமற்றவர்களோடு[b] அவனுக்கான இடத்தை ஒதுக்குவார்.
  rationale: The revision retains the Greek's literal judgment imagery and the two distinct temporal clauses, while making the final judicial-allocation clause idiomatic in modern Tamil. It replaces an unwieldy expression for ἀπίστοις with the contextually appropriate ‘நம்பகமற்றவர்கள்’ and preserves the alternative confessional sense in the footnote. The first footnote now records both the lexical wording reflected in the English audit trail and the possible idiomatic interpretation.
