- from: 'ஆண்டவர்[a] வரும்போது விழித்திருப்பவர்களாக அவர் காணும் அந்த அடிமைகள்[b] பேறுபெற்றவர்கள். உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: அவர் தமது உடையை இடுப்பில் கட்டிக்கொண்டு[c], அவர்களை உணவுப் பந்தியில் சாய்ந்து அமரச் செய்து, அருகில் வந்து அவர்களுக்குப் பணிவிடை செய்வார்.'
  to: 'ஆண்டவர்[a] வந்து விழித்திருப்பவர்களாகக் காணும் அந்த அடிமைகள்[b] பேறுபெற்றவர்கள். உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: அவர் தமது உடையை இடுப்பில் கட்டிக்கொண்டு[c], அவர்களை உணவுப் பந்தியில் சாய்ந்து அமரச் செய்து, அவர்களிடம் வந்து பணிவிடை செய்வார்.'
  rationale: முதல் வாக்கியத்தின் தமிழ்ச் சொல்வரிசை மட்டும் இயல்பாகவும் தெளிவாகவும் திருத்தப்பட்டது. இறுதிச் செயற்பாட்டில் «அருகில்» என்ற கூடுதல் இடச்சுட்டலைத் தவிர்த்து, ஆண்டவர் அடிமைகளுக்குப் பணிவிடை செய்ய அணுகுவதைத் தெரிவிக்கும் «அவர்களிடம் வந்து» பயன்படுத்தப்பட்டுள்ளது. பொருள், பதிவு, முக்கியச் சொற்கள், மற்றும் அடிக்குறிப்பு அடையாளங்கள் மாற்றப்படவில்லை.
