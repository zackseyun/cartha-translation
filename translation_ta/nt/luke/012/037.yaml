source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: ta
  text: 'ஆண்டவர்[a] வந்து விழித்திருப்பவர்களாகக் காணும் அந்த அடிமைகள்[b] பேறுபெற்றவர்கள். உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: அவர் தமது உடையை இடுப்பில் கட்டிக்கொண்டு[c], அவர்களை உணவுப் பந்தியில் சாய்ந்து அமரச் செய்து, அவர்களிடம் வந்து பணிவிடை செய்வார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘எஜமான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் அடிமை நிலையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: இந்தச் சொற்றொடர், வேலை செய்வதற்கு ஆயத்தமாக நீண்ட ஆடையை இடுப்பில் கட்டுவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனநிலையான ‘மகிழ்ச்சி’யை அல்லாமல், இயேசுவின் வாழ்த்துரைக்குரிய ஆழத்தையும் மதிப்பையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: இந்த வீட்டுச் சூழலில் எஜமான்–அடிமை உறவு வெளிப்படையாக இருப்பதால், பிணைக்கப்பட்ட சமூக நிலையைக் காட்டும் நேரடியான சொல்லைத் தேர்ந்தெடுக்கிறது; ‘பணியாளர்கள்’ என்பதை அடிக்குறிப்பில் மாற்றாகத் தருகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: உவமையின் வீட்டுத் தலைவரையும், லூக்கா நற்செய்தியில் ஒலிக்கக்கூடிய ‘ஆண்டவர்’ என்ற பரந்த பொருளையும் ஒரே நேரத்தில் திறந்துவைக்கிறது.
- source_word: γρηγοροῦντας
  choice: விழித்திருப்பவர்களாக
  rationale: உறங்காமல் இருப்பதையும் விழிப்புடன் ஆயத்தமாயிருப்பதையும் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: வாக்கின் உறுதியையும் வலியுறுத்தலையும் நவீன வாசகருக்குத் தெளிவாகக் காக்கிறது.
- source_word: περιζώσεται
  choice: தமது உடையை இடுப்பில் கட்டிக்கொண்டு
  rationale: வேலை செய்ய ஆயத்தமாக நீண்ட ஆடையை இடுப்பில் கட்டும் செயலைத் தெளிவாகவும் காட்சியுணர்வுடனும் வெளிப்படுத்துகிறது.
- source_word: ἀνακλινεῖ αὐτούς
  choice: அவர்களை உணவுப் பந்தியில் சாய்ந்து அமரச் செய்து
  rationale: பண்டைய விருந்தில் உணவருந்துவதற்காகச் சாய்ந்து அமரும் செயலைப் பொதுவான ‘அமரச் செய்தல்’ என்று மங்கவிடாமல் தெரிவிக்கிறது.
- source_word: παρελθὼν
  choice: அருகில் வந்து
  rationale: விருந்தினர்களிடையே சென்று பணிவிடை செய்யும் இயக்கத்தை சூழலுக்கேற்ற இயல்பான தமிழில் காட்டுகிறது.
- source_word: διακονήσει αὐτοῖς
  choice: அவர்களுக்குப் பணிவிடை செய்வார்
  rationale: இங்கு குறிப்பாக மேசைப் பணியுடன் தொடர்புடைய நடைமுறைச் சேவையை, தேவையற்ற சமயத் தொழில்நுட்பச் சாயலின்றி தெரிவிக்கிறது.
theological_decisions:
- issue: உவமைச் சூழலில் κύριος என்பதன் வீட்டுத் தலைவர் பொருளும் ஆண்டவர் என்ற கிறிஸ்துவியல் எதிரொலியும்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: உடனடி உவமைச் சூழலில் ‘எஜமான்’ பொருத்தமானதாயினும், ‘ஆண்டவர்’ என்பது கிரேக்கச் சொல்லின் பரந்த பட்டப்பெயர் எதிரொலியைத் தக்கவைத்து, பணிவிடை செய்யும் ஆண்டவர் என்ற உரையின் வியப்பையும் முன்கூட்டியே தீர்மானிக்காமல் காக்கிறது.
- issue: வீட்டுச் சூழலில் δοῦλος என்பதன் சமூக நிலை
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: இந்தக் காட்சியில் கீழ்ப்பட்ட, உரிமையாளருக்குச் சார்ந்த நிலை முக்கியமானதால் ‘அடிமைகள்’ நேரடியானது. அதேவேளை மென்மையான மாற்றை அடிக்குறிப்பில் வழங்குவது சொல்லின் சேவை சார்ந்த பரப்பையும் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘பேறுபெற்றவர்கள்’ வாழ்த்துரையின் உயர்ந்த தொனியைத் தக்கவைக்கிறது; ‘பணிவிடை’ மேசைச் சேவையைத் தெளிவாகக் காட்டுகிறது. மூலத்தில் உள்ள ஆண்டவர்/எஜமான் மற்றும் அடிமை/பணியாளர் பொருள் அழுத்தங்கள் அடிக்குறிப்புகளால் திறந்துவைக்கப்பட்டுள்ளன.
