  source_fidelity: 'வரைவின் பொருள் கிரேக்க மூலத்துக்கு நெருக்கமாக உள்ளது: μακάριοι, δοῦλοι, γρηγοροῦντας, περιζώσεται, ἀνακλινεῖ, மற்றும் διακονήσει ஆகிய முக்கியக் கூறுகள் காக்கப்பட்டுள்ளன. இருப்பினும் முதல் வாக்கியத்தில் உள்ள சொல்வரிசை தமிழில் கனமாக உள்ளது; அதை மாற்றுவதால் ஆண்டவர் வந்து அடிமைகளை விழித்திருப்பவர்களாகக் காண்பார் என்ற மூலத்தின் தொடர்பமைப்பு தெளிவாகிறது.'
  naturalness: «ஆண்டவர் வரும்போது விழித்திருப்பவர்களாக அவர் காணும்» என்பது இயல்பான நவீனத் தமிழ் நடை அல்ல. «ஆண்டவர் வந்து விழித்திருப்பவர்களாகக் காணும்» என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது. «அருகில் வந்து» என்பதற்குப் பதில் «அவர்களிடம் வந்து» என்பது παρελθών என்பதன் சேவை செய்ய அணுகும் இயக்கத்தை இயல்பாகத் தருகிறது.
  terminology: «ஆண்டவர்», «அடிமைகள்», «பேறுபெற்றவர்கள்», «பணிவிடை செய்வார்» ஆகியவை பொருத்தமானவை. ஆண்டவர்/எஜமான் மற்றும் அடிமைகள்/பணியாளர்கள் என்ற மாற்றுகள் அடிக்குறிப்புகளில் சரியாகத் திறந்துவைக்கப்படுகின்றன. «உணவுப் பந்தி» மற்றும் «சாய்ந்து அமரச் செய்து» பண்டைய விருந்துணவு முறையைப் பாதுகாக்கின்றன.
