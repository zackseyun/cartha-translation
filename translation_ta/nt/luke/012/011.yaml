  naturalness: ‘யூதத் தொழுகைக்கூடங்கள், ஆட்சியாளர்கள், அதிகாரிகள் ஆகியோரின் முன்’ என்பது நவீனத் தரமான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘எப்படித் தற்காப்பாகப் பதிலளிப்பது அல்லது என்ன சொல்லித் தற்காப்பு செய்வது’ மூலத்தின் மீளுரைப்பைத் தக்கவைத்தாலும் தமிழில் வாசிக்கத்தக்கதாக உள்ளது.
