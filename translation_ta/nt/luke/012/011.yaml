translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தொழுகைக்கூடம்’ என்பது συναγωγή என்பதன் நேரடிப் பொருளைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் நீதிவிசாரணைச் சூழலை விளக்குகிறது. மூலத்தில் உள்ள ‘எப்படி அல்லது என்ன’ என்ற இரட்டைக் கேள்வி தமிழில் இயல்பாக ‘எப்படி ... என்ன’ எனப் பாதுகாக்கப்பட்டுள்ளது.
