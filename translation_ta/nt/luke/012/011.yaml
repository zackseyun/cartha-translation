source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: ta
  text: ஆனால், அவர்கள் உங்களை யூதத் தொழுகைக்கூடங்கள், ஆட்சியாளர்கள், அதிகாரிகள் ஆகியோரின் முன் கொண்டுவரும்போது,[a] எப்படித் தற்காப்பாகப் பதிலளிப்பது அல்லது என்ன சொல்லித் தற்காப்பு செய்வது, அல்லது என்ன பேசுவது என்று கவலைப்படாதீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதத் தொழுகைக்கூடங்கள், ஆட்சியாளர்கள், அதிகாரிகள்” என்பது சீடர்கள் விசாரிக்கப்படக்கூடிய சமய மற்றும் குடியாட்சி அமைப்புகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “தற்காப்பாகப் பதிலளிப்பது” என்பதை இன்னும் சொல்லுக்கு நெருக்கமாக, “தங்கள் தற்காப்பு வாதத்தை முன்வைப்பது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால், ... கொண்டுவரும்போது
  rationale: ὅταν வருங்காலத்தில் நிகழக்கூடிய சந்தர்ப்பத்தைச் சுட்டுகிறது; δέ சூழலில் உள்ள மென்மையான மாறுபாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: அவர்கள் உங்களை ... கொண்டுவரும்போது
  rationale: நீதிவிசாரணைச் சூழலில் ஒருவரை அதிகார அமைப்புகளுக்கு முன் கொண்டுவருவதைக் குறிக்கிறது.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: தொழுகைக்கூடங்களுக்கும் ஆட்சியாளர்களுக்கும் அதிகாரிகளுக்கும் முன்பாக
  rationale: ἐπί + வேற்றுமை வடிவம் இங்கு விசாரணைக்காக அவர்கள்முன் நிறுத்தப்படுவதைக் குறிக்கிறது; மூன்று கூறுகளின் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: συναγωγάς
  choice: தொழுகைக்கூடங்கள்
  rationale: அடிப்படைச் சொற்பொருளைத் தக்கவைக்கிறது; இங்கு அவை விசாரணை நடைபெறும் யூத சமய அமைப்புகளையும் குறிக்கலாம்.
- source_word: ἀρχάς
  choice: ஆட்சியாளர்கள்
  rationale: இச்சட்ட மற்றும் ஆட்சி சூழலில் ஆளும் நபர்களையோ நிர்வாகத் தலைவர்களையோ குறிக்கிறது.
- source_word: ἐξουσίας
  choice: அதிகாரிகள்
  rationale: அதிகாரம் வழங்கப்பட்ட ஆளும் அலுவலர்கள் அல்லது அதிகார அமைப்புகளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μὴ μεριμνήσητε
  choice: கவலைப்படாதீர்கள்
  rationale: முன்கூட்டியே மனக்கலக்கத்துடன் சிந்திப்பதைத் தடைசெய்யும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πῶς ἢ τί
  choice: எப்படி ... என்ன
  rationale: பேசும் முறை மற்றும் பேச வேண்டிய உள்ளடக்கம் ஆகிய இரண்டையும் மூலத்தின் படி தக்கவைக்கிறது.
- source_word: ἀπολογήσησθε
  choice: உங்களைத் தற்காத்துப் பேசுவது
  rationale: நீதிவிசாரணைச் சூழலில் தமக்காகப் பதிலளித்துத் தற்காப்பு வாதம் செய்வதைக் காட்டுகிறது.
- source_word: ἢ τί εἴπητε
  choice: என்ன பேசுவது
  rationale: தற்காப்பின் முறை மற்றும் பொதுவாகச் சொல்ல வேண்டிய வார்த்தைகள் ஆகியவற்றின் நுட்பமான வேறுபாட்டைப் பாதுகாக்கிறது.
