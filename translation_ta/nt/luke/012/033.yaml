id: LUK.12.33
reference: Luke 12:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: ta
  text: உங்களுடைய உடைமைகளை விற்று, ஏழைகளுக்கு உதவியாகக் கொடுங்கள்[a]. தேய்ந்துபோகாத பணப்பைகளை உங்களுக்காக ஏற்படுத்திக்கொள்ளுங்கள்; திருடன் நெருங்காததும் அந்துப்பூச்சி அழிக்காததுமான வானங்களில்[b] ஒருபோதும் குறையாத செல்வத்தைச் சேர்த்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரக்க உதவியாகக் கொடுங்கள்’ அல்லது ‘தர்மம் செய்யுங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், தேவையிலிருப்போருக்குக் கொடுப்பதன் மூலம் வெளிப்படும் இரக்கச் செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வானத்தில்’ அல்லது ‘பரலோகத்தில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘வானங்கள்’ எனப் பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: விற்று
  rationale: பன்மை கட்டளையின் செயற்பாட்டை அடுத்த கட்டளையுடன் இயல்பான தமிழில் இணைக்கிறது; அனைத்தையும் கட்டாயமாக விற்றுவிடுதல் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: உங்களுடைய உடைமைகளை
  rationale: ஒருவருக்குச் சொந்தமான பொருட்கள் அல்லது சொத்துகள் என்ற பொருளைத் தெளிவாகவும் பொதுவான தமிழிலும் தெரிவிக்கிறது.
- source_word: δότε ἐλεημοσύνην
  choice: ஏழைகளுக்கு உதவியாகக் கொடுங்கள்
  rationale: ἐλεημοσύνη என்பது தேவையிலிருப்போருக்குக் கொடுப்பதன் மூலம் வெளிப்படும் இரக்கச் செயலைக் குறிக்கிறது; பழமையான ‘தர்மம் செய்யுங்கள்’ என்பதைவிட இலக்கைத் தெளிவுபடுத்துகிறது.
- source_word: ποιήσατε ἑαυτοῖς
  choice: உங்களுக்காக ஏற்படுத்திக்கொள்ளுங்கள்
  rationale: தமக்கான நன்மைக்காகச் செய்வது என்ற reflexive dative பொருளையும் கட்டளையின் வலிமையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: பழுதடையாத பணப்பைகளை
  rationale: பணப்பை என்ற உருவகத்தைத் தக்கவைத்து, பழமையாகி தேய்ந்து போகாத தன்மையை இயல்பான தமிழில் கூறுகிறது.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: ஒருபோதும் குறையாத செல்வத்தை
  rationale: ἀνέκλειπτος என்பதன் தீர்ந்துபோகாத, தவறாத தன்மையைத் தெளிவுபடுத்துகிறது; θησαυρός இங்கு சேமித்து வைக்கப்படும் மதிப்புமிக்க செல்வத்தைக் குறிக்கிறது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: வானங்களில்
  rationale: மூலத்தின் பன்மை வடிவத்தைப் பாதுகாக்கிறது; இது யூத மற்றும் புதிய ஏற்பாட்டு வழக்கில் விண்ணுலகத் தளத்தைக் குறிக்கும்.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: திருடன் நெருங்காததும்
  rationale: ἐγγίζω என்பதன் ‘அருகே வருதல்’ என்ற இடவியல் படிமத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: அந்துப்பூச்சி அழிக்காததுமான
  rationale: σής என்பது துணி முதலியவற்றை அரிக்கும் அந்துப்பூச்சி; διαφθείρω இங்கு பாழாக்குதல் அல்லது அழித்தல் எனப் பொருள்படும்.
theological_decisions:
- issue: ἐλεημοσύνην என்ற சொல்லின் சமூக இலக்கு
  choice: ஏழைகளுக்கு உதவியாகக் கொடுங்கள்
  alternative: தர்மம் செய்யுங்கள் / இரக்க உதவி கொடுங்கள்
  rationale: கட்டளை தேவையிலிருப்போருக்கான நடைமுறை கொடையைக் குறிக்கிறது. ‘ஏழைகளுக்கு’ என்பது சூழலில் உள்ள இலக்கைத் தெளிவாக்கினாலும், தனிப்பட்ட பொருளாதாரக் கோட்பாடு எதையும் உரையில் சேர்ப்பதில்லை.
- issue: பழுதடையாத பணப்பைகளுக்கும் வானச் செல்வத்திற்கும் இடையிலான தொடர்பு
  choice: ‘அதாவது’ கொண்டு விளக்க உறவாக அமைத்தல்
  alternative: இரண்டையும் தனித்தனி நேரடி பொருட்களாக இணைத்தல்
  rationale: பணப்பை உருவகம் வானங்களில் உள்ள குறையாத செல்வத்தால் விளக்கப்படுகிறது. கிரேக்க appositional அமைப்பைத் தமிழில் தெளிவாக்குகிறது; இரண்டையும் முற்றிலும் வேறு கட்டளைகளாக்கவில்லை.
- issue: ἐν τοῖς οὐρανοῖς என்பதன் எண்ணிக்கை
  choice: வானங்களில்
  alternative: வானத்தில் / பரலோகத்தில்
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, அதனை ஒரு குறிப்பிட்ட விண்வெளியியல் கோட்பாடாக விளக்காமல் மூலமொழியின் இறையியல்-இலக்கியத் தோற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தர்மம்’ என்ற சமய-பண்பாட்டு பலபொருள் சொல்லுக்குப் பதிலாக கொடையின் பெறுநரும் இரக்கத் தன்மையும் தெளிவாகக் கூறப்பட்டுள்ளன. ‘பணப்பைகள்’ என்ற தெளிவான உருவகம் பாதுகாக்கப்பட்டு, ‘வானங்களில்’ மூலம் மூலத்தின் பன்மை வடிவம் தக்கவைக்கப்பட்டுள்ளது.
