id: LUK.12.12
reference: Luke 12:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: ta
  text: ஏனெனில், நீங்கள் என்ன சொல்ல வேண்டுமோ அதை அந்த நேரத்திலேயே[a] பரிசுத்த ஆவியானவர் உங்களுக்குக் கற்பிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நேரத்தில்.” கிரேக்கச் சொற்றொடர் உதவி தேவைப்படும் அந்தத் துல்லியமான நேரத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் தரப்பட்ட உறுதிக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: τὸ ἅγιον πνεῦμα
  choice: பரிசுத்த ஆவியானவர்
  rationale: தெய்வீக ஆவியைக் குறிக்கும் இச்சொற்றொடருக்கான தெளிவான, மரியாதையான நவீனத் தமிழ்; வினையின் செயற்படும் எழுவாயாக வரும் தனிப்பட்ட முகமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διδάξει
  choice: கற்பிப்பார்
  rationale: διδάσκω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தையும், தேவையான பேச்சை அறிவிக்கும் வாக்குறுதியையும் நேரடியாகக் காட்டுகிறது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் பன்மையை மரியாதை/பன்மை வடிவில் தக்கவைக்கிறது; ‘கற்பிப்பார்’ என்பதோடு தமிழில் இயல்பாக நான்காம் வேற்றுமையில் அமைகிறது.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: அந்த நேரத்திலேயே
  rationale: αὐτῇ தரும் துல்லியமான நேர வலியுறுத்தலை ‘-லேயே’ இயல்பாக வெளிப்படுத்துகிறது; ‘மணி நேரம்’ என்ற அளவுப் பொருளைத் தவிர்த்து சூழலுக்கேற்ற ‘நேரம்’ பயன்படுத்தப்படுகிறது.
- source_word: ἃ
  choice: என்ன
  rationale: நடுநிலைப் பன்மை உறவுப்பெயரின் உள்ளடக்கப் பொருளை தமிழில் இயல்பான ‘என்ன ... மோ’ அமைப்பால் தருகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: சூழ்நிலைக்குரிய அவசியத்தைத் தெளிவாகக் குறிக்கிறது; மூலத்தின் கட்டாயத் தன்மையை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: εἰπεῖν
  choice: சொல்ல
  rationale: சீடர்கள் கூற வேண்டிய வார்த்தைகளைக் குறிக்கும் இச்சூழலில் λέγω என்பதற்கான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: ‘பரிசுத்த ஆவி’ என்பவரின் முகமை
  choice: ‘பரிசுத்த ஆவியானவர் ... கற்பிப்பார்’ என்று தனிப்பட்ட செயற்படும் எழுவாயாக மொழிபெயர்த்தல்
  alternative: தனித்தன்மையற்ற தெய்வீகத் தூண்டுதல் அல்லது ஆற்றல் என மொழிபெயர்த்தல்
  rationale: மூலத்தில் பரிசுத்த ஆவி ‘கற்பிப்பார்’ என்ற எதிர்காலச் செயல்வினையின் எழுவாயாக இருக்கிறார். ஆகவே தனிப்பட்ட முகமையைத் தக்கவைக்கிறது; அதேவேளை இவ்வசனத்திற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாட்டு விவரங்களைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அந்த நேரத்திலேயே’ என்பது மூலத்தின் நேர வலியுறுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது; ‘நீங்கள்/உங்களுக்கு’ என்பது பன்மையையும் மரியாதையான பொதுநடையையும் ஏந்துகிறது.
