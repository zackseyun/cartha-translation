id: LUK.12.1
reference: Luke 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: ta
  text: 'இதற்கிடையில், கூட்டத்தினரான பல்லாயிரக்கணக்கானோர் கூடியிருந்தபோது, அவர்கள் ஒருவரையொருவர் மிதித்துக்கொள்ளும் அளவுக்கு நெரிசல் ஏற்பட்டது.[a] அப்போது அவர் முதலில் தமது சீடர்களிடம் சொல்லத் தொடங்கினார்: “பரிசேயரின் புளிப்பு மாவிலிருந்து[b] எச்சரிக்கையாக இருங்கள்; அது பாசாங்குத்தனம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பல்லாயிரக்கணக்கானோர்’ என்பதற்கு கிரேக்கத்தில் உள்ள μυριάδες என்ற சொல் நேரடியாக ‘பத்தாயிரங்கள்’ என்பதையோ, பொதுவாக மிகப் பெரும் எண்ணிக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “பரிசேயரின் புளிப்பு மாவைக் குறித்து எச்சரிக்கையாக இருங்கள்” அல்லது “உங்களைக் கவனித்துக்கொள்ளுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: இதற்கிடையில்
  rationale: முந்தைய நிகழ்வுகளுடன் காலச்சூழலை இணைக்கும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: பல்லாயிரக்கணக்கான மக்கள் திரண்டதால்
  rationale: மிகப் பெருந்திரளை μυριάδες குறிக்கக்கூடும்; சரியாக ‘பத்தாயிரங்கள்’ என வரையறுக்காமல் அதன் எண்ணிக்கைப் பெருக்கைத் தெரிவிக்கிறது.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: ஒருவரையொருவர் மிதிக்கும் நிலை ஏற்பட்டது
  rationale: ὥστε உடனான வினையெச்சத்தின் விளைவு சார்ந்த பொருளையும் கூட்ட நெரிசலின் தொடர்ச்சியான குழப்பத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: அவர் முதலில் தமது சீடர்களிடம் சொல்லத் தொடங்கினார்
  rationale: πρῶτον என்பதை உரையாடலின் முதல் கேட்போர் சீடர்கள் என்ற முன்னுரிமையோடு இணைக்கிறது; கிரேக்கச் சொல் வரிசையின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: குறித்து உங்களைக் காத்துக்கொள்ளுங்கள்
  rationale: எச்சரிக்கையையும் தற்காப்பைக் குறிக்கும் ἑαυτοῖς என்பதன் எதிரொலியையும் இயல்பான தமிழில் தருகிறது.
- source_word: ζύμη
  choice: புளிப்புமா
  rationale: புளிக்கச் செய்யும் மாவையும் அதன் உருவகத் தன்மையையும் தக்கவைக்கும் பொதுவாகப் புரியும் சொல்.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: அது வெளிவேடம்
  rationale: உருவகத்தின் பொருளை உரையே அடையாளப்படுத்துவதைக் கூடுதல் விளக்கமின்றித் தெளிவாகக் கூறுகிறது.
- source_word: τῶν Φαρισαίων
  choice: பரிசேயர்களின்
  rationale: உடைமை அல்லது பண்புசார் தொடர்பைக் குறிக்கும் கிரேக்க ஆறாம் வேற்றுமையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: புளிப்புமா என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தைத் தக்கவைத்து, உரை கூறுவதுபோல அதை ‘வெளிவேடம்’ என அடையாளப்படுத்துதல்
  alternative: ‘போதனை’ அல்லது ‘செல்வாக்கு’ என்று விளக்கமாக மாற்றுதல்
  rationale: லூக்கா உருவகத்தைத் தாமே விளக்குவதால், அதற்குப் பதிலாகக் குறுகிய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இலக்கிய மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது.
- issue: πρῶτον என்பதன் தொடர்பு
  choice: ‘முதலில் தமது சீடர்களிடம்’ என்று கேட்போரின் முன்னுரிமையுடன் இணைத்தல்
  alternative: ‘முதலாவதாக’ என்ற உரைப்பட்டியல் குறியீடாகக் கொள்ளுதல்
  rationale: கிரேக்கம் இரண்டுக்கும் இடமளித்தாலும், நிகழ்ச்சிசார் சூழலில் சீடர்களுக்கு முதலில் உரையாற்றியதாக மொழிபெயர்ப்பது இயல்பானது; பின்னர் நடந்ததாகச் சொல்லப்படாத உரைகளை இது சேர்ப்பதில்லை.
- issue: Προσέχετε ἑαυτοῖς என்பதிலுள்ள தன்னிலை வலியுறுத்தல்
  choice: ‘உங்களைக் காத்துக்கொள்ளுங்கள்’ எனத் தன்னிலை எச்சரிக்கையை வெளிப்படுத்துதல்
  alternative: ‘எச்சரிக்கையாக இருங்கள்’ அல்லது ‘கவனமாக இருங்கள்’
  rationale: தமக்கான பாதுகாப்பில் கவனம் செலுத்துமாறு கூறும் கட்டளையின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘புளிப்புமா’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டு உடனே ‘வெளிவேடம்’ என உரையின் சொந்த விளக்கம் வழங்கப்படுகிறது.
