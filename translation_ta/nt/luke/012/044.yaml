  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: ta
  text: 'உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: அவன் தனக்குச் சொந்தமான எல்லாவற்றின்மேலும் அவனை நியமிப்பான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய எல்லா உடைமைகளின்மேலும்” அல்லது “அவனுடைய சொத்துகள் அனைத்தின்மேலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: உண்மையாகவே
  rationale: கூற்றின் உண்மைத்தன்மையையும் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி அழைப்பையும் அதிகாரமுள்ள அறிவிப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: வாக்கிய அமைப்பில் முக்குறியால் வெளிப்படுத்தப்பட்டது
  rationale: கிரேக்கத்தில் இது சொல்லப்படும் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் முக்குறியுடன் நேரடியாகத் தொடர்வது இயல்பாக உள்ளது.
- source_word: ἐπὶ
  choice: அனைத்திற்கும் ... பொறுப்பாளனாக
  rationale: இங்கு ஒருவரை உடைமைகளின் மேல் அதிகாரமும் மேற்பார்வையும் உடையவராக வைப்பதைக் குறிக்கிறது.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: தனக்குள்ள அனைத்திற்கும்
  rationale: அவனுக்குச் சொந்தமான அனைத்தையும் உள்ளடக்கும் பரந்த பொருளைப் பாதுகாக்கிறது; பொருட்செல்வம் என்று மட்டும் குறுக்கவில்லை.
- source_word: καταστήσει
  choice: நியமிப்பான்
  rationale: ஒருவரிடம் பொறுப்பையும் அதிகாரத்தையும் முறையாக ஒப்படைக்கும் சூழல்சார்ந்த பொருளைத் தருகிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: உடனடி சூழலில் வரும் ஆண்பால் ஒருமை பணியாளனைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: உவமைக் கதாபாத்திரத்தைக் குறிக்கும் ஆண்பால் ஒருமை வடிவங்கள்
  choice: “அவன்”, “அவனை” என்று ஆண்பால் ஒருமையைத் தக்கவைத்தல்
  alternative: “அந்த நபர்” போன்ற பாலினப் பொதுமைப்படுத்தப்பட்ட வடிவத்தைப் பயன்படுத்துதல்
  rationale: கிரேக்க மூலத்தில் ஆண்பால் ஒருமை வடிவங்கள் உள்ளன; அவை உவமையிலுள்ள ஆண் கதாபாத்திரத்தைக் குறிப்பதால் அவற்றை மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. “பொறுப்பாளனாக நியமிப்பான்” என்பது அதிகாரத்தையும் ஒப்படைக்கப்பட்ட மேற்பார்வையையும் இயல்பாகத் தெரிவிக்கிறது.
