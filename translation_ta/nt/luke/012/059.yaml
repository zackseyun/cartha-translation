  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: ta
  text: 'நான் உனக்குச் சொல்கிறேன்: கடைசி லெப்டோனைக் கூட செலுத்தித் தீர்க்கும்வரை, அங்கிருந்து நீ நிச்சயமாக வெளியே வரமாட்டாய்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω σοι
  choice: நான் உனக்குச் சொல்கிறேன்
  rationale: நேரடி உரையாடல் சூத்திரத்தை இயல்பான நவீனத் தமிழில், நிகழ்கால வினையின் வலிமையுடன் தருகிறது.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: நீ நிச்சயமாக வெளியே வரமாட்டாய்
  rationale: οὐ μή மற்றும் இறந்தகாலத் துணைவினை வடிவம் எதிர்காலத்தைப் பற்றிய வலியுறுத்தப்பட்ட மறுப்பைக் குறிக்கிறது; ‘நிச்சயமாக ... வரமாட்டாய்’ அந்த வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: ‘அந்த இடத்திலிருந்து’ என்ற மூலப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἕως
  choice: வரை ... வரை
  rationale: மறுக்கப்பட்ட நிலை நீடிக்கும் கால எல்லையைக் குறிக்கிறது; தமிழில் ‘வரைக்கும் ... வரை’ அமைப்பு வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ τὸ ἔσχατον
  choice: கடைசி ... வரைக்கும்
  rationale: καί இங்கு ‘கூட/வரைக்கும்கூட’ என்ற வலியுறுத்தல் கொண்டது; தமிழ் வாக்கியத்தில் ‘கடைசி ... வரைக்கும்’ முழுமையான செலுத்துதலை இயல்பாக வலியுறுத்துகிறது.
- source_word: λεπτόν
  choice: லெப்டோன்
  rationale: அக்கால மிகச் சிறிய நாணயத்தின் வரலாற்றுச் சிறப்பை ஒலிபெயர்ப்பு காக்கிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது.
- source_word: ἀποδῷς
  choice: செலுத்தித் தீர்க்கும்வரை
  rationale: கடன்/சட்டச் சூழலில் தொகையை முழுமையாகச் செலுத்துவதை இது குறிக்கிறது; வினையின் நிறைவுத் தன்மையை ‘தீர்க்கும்’ தெளிவாக்குகிறது.
theological_decisions:
- issue: கூற்றிலுள்ள கடன்–சிறை உருவகத்தின் தன்மை
  choice: முழுத் தொகையும் செலுத்தப்படும் வரை விடுதலை இல்லை என்ற உருவகத்தை மட்டும் தக்கவைத்தல்
  alternative: இதை உலகியலான சட்ட விளைவு, இறுதி தெய்வீகத் தீர்ப்பு, அல்லது பிற்கால உத்தரிப்பு நிலையக் கோட்பாடு என்று குறிப்பாக விளக்குதல்
  rationale: இந்த வசனம் சிறைப்படுத்தலையும் முழுச் செலுத்துதலையும் கூறுகிறது; ஆனால் அதன் குறிப்பான ஆன்மீக அல்லது உலகியலான சுட்டுப்பொருளை அடையாளப்படுத்தவில்லை. ஆகவே இறையியல் பதற்றமும் தெளிவின்மையும் தீர்க்கப்படாமல் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடி, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் நடை. ஒருமை முன்னிலை ‘உனக்கு/நீ’ மூலத்தின் σοι மற்றும் வினை வடிவத்தைக் காக்கிறது. வரலாற்று நாணயப்பெயர் உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
