id: LUK.12.56
reference: Luke 12:56
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: ta
  text: பாசாங்குக்காரர்களே! நிலத்தினதும் வானத்தினதும் தோற்றத்தைப் பகுத்தறிய உங்களுக்குத் தெரியும்; ஆனால் இந்தக் காலத்தை எப்படிப் பகுத்தறிய உங்களுக்குத் தெரியவில்லை?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்களே
  rationale: பன்மை விளியின் நேரடியான கண்டனத்தைத் தக்கவைக்கிறது; இங்கு மேடை நடிகர்கள் அல்ல, வெளிப்புறமாக வேடமிடுகிறவர்கள் என்பதே பொருள்.
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: நிலம், வானம் ஆகியவற்றின் தோற்றம்
  rationale: πρόσωπον என்பதன் சொற்பொருள் ‘முகம்’ என்றாலும், இங்கு நிலத்திலும் வானத்திலும் காணப்படும் வெளிப்புறத் தோற்றத்தைக் குறிக்கும் மரபுத்தொடர். வானிலை அறிகுறிகளின் சூழலில் οὐρανός என்பதற்கு ‘வானம்’ இயல்பானது.
- source_word: οἴδατε δοκιμάζειν
  choice: பகுத்தறிய உங்களுக்குத் தெரிகிறது
  rationale: οἴδατε உடன் வரும் வினையெச்சம் திறன் அல்லது எப்படி செய்வது என்ற அறிவைக் குறிக்கிறது; δοκιμάζειν இங்கு காணக்கூடிய அறிகுறிகளை ஆராய்ந்து சரியாக உணர்வதைக் குறிக்கிறது.
- source_word: τὸν καιρὸν τοῦτον
  choice: இந்தக் காலம்
  rationale: τοῦτον என்பதைக் ‘இந்த’ என்று நேரடியாகக் காட்டுகிறது. καιρός குறிப்பிடத்தக்க அல்லது தக்க காலத்தைக் குறிக்கக்கூடும்; ஆயினும் மொழிபெயர்ப்பிலேயே அதன் குறிப்பிட்ட இறையியல் பொருளை மிகையாக நிர்ணயிக்காமல் ‘காலம்’ என்று வைக்கப்படுகிறது.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: எப்படிப் பகுத்தறியத் தெரியாமல் இருக்கிறீர்கள்?
  rationale: πῶς எழுப்பும் வியப்பும் கண்டனமும் நிறைந்த வினாவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துவதோடு, முந்தைய பகுதியில் வந்த ‘பகுத்தறிய’ என்ற வினையையும் மீண்டும் தக்கவைக்கிறது.
theological_decisions:
- issue: καιρός என்பதன் பொருள்
  choice: இந்தக் காலம்
  alternative: இந்தத் தக்க தருணம் / இந்தத் தீர்மானமான காலம்
  rationale: இயேசுவின் ஊழியத்திலும் கடவுளின் செயலிலும் உள்ள நிகழ்கால முக்கியத்துவம் சூழலில் உணர்த்தப்படுகிறது. எனினும் கிரேக்கச் சொல்லைவிடக் குறுகிய ஒரு இறையியல் விளக்கத்தை உரைக்குள் சேர்க்காமல் அதன் இயல்பான பதற்றத்தையும் பொருள் விரிவையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையிலும் கண்டனத்தின் கண்ணியமான தீவிரம் குறையாத வகையிலும் மொழியாக்கப்பட்டுள்ளது. இரு பகுதிகளிலும் δοκιμάζειν என்பதற்கு ‘பகுத்தறிய’ என்று ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் சொல்மீட்சி தக்கவைக்கப்பட்டுள்ளது.
