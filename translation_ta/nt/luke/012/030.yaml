  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: ta
  text: ஏனெனில், உலகத்தின் நாடுகள்[a] இவை அனைத்தையும் நாடித் தேடுகின்றன; ஆனால், இவை உங்களுக்குத் தேவை என்பதை உங்கள் தந்தை அறிந்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலகத்தின் புறஜாதியார்.’ கிரேக்கச் சொல் ‘நாடுகள்’ அல்லது ‘புறஜாதியார்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: இவை அனைத்தையும்
  rationale: முன்னுள்ள சூழலில் கூறப்பட்ட உணவு, பானம் போன்ற வாழ்க்கைத் தேவைகளைச் சுட்டுகிறது; கிரேக்கத்தின் பன்மைச் சுட்டுப்பெயரையும் முழுமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: உலகத்தின் பிற இன மக்கள்
  rationale: ἔθνη என்பதன் ‘இனத்தார்/புறவினத்தார்’ என்ற பொருளையும், சீடர்களுக்கு வெளியேயுள்ள உலக மக்களைக் குறிக்கும் பரந்த நோக்கையும் இயல்பான தமிழில் தருகிறது; ‘நாடுகள்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐπιζητοῦσιν
  choice: நாடித் தேடுகிறார்கள்
  rationale: வெறுமனே தேடுவதைக் காட்டிலும் முனைப்புடன் பின்தொடர்ந்து தேடும் ἐπιζητέω வின் வலிமையைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: உங்கள் தந்தை
  rationale: கிரேக்கத்தில் உள்ள உறவுமுறைச் சொல்லை நேரடியாகக் காக்கிறது; லூக்காவின் இவ்வசனத்தில் இல்லாத ‘பரலோகத்’ என்ற சொல்லை இணைக்கவில்லை.
- source_word: οἶδεν
  choice: அறிந்திருக்கிறார்
  rationale: வடிவில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்கால அறிவைக் குறிக்கும் οἶδα என்பதைக் கண்ணியமான, இயல்பான தமிழில் தருகிறது.
- source_word: χρῄζετε τούτων
  choice: இவை உங்களுக்குத் தேவை
  rationale: தேவை என்னும் பொருளைத் தெளிவாகத் தருவதோடு, τούτων என்ற சுட்டுப்பெயரையும் வெளிப்படையாக வைத்திருக்கிறது.
theological_decisions:
- issue: உலக மக்களின் தேடலுக்கும் பிள்ளைகளாகத் தந்தையை நம்புவதற்கும் இடையிலான முரண்
  choice: ‘உலகத்தின் பிற இன மக்கள்’ என்றும் ‘உங்கள் தந்தை’ என்றும் விளக்க விரிவாக்கமின்றி மொழிபெயர்த்தல்
  alternative: ἔθνη என்பதை ‘உலகத்தின் நாடுகள்’ என்று மொழிபெயர்த்தல் அல்லது இணைவசனத்தின் அடிப்படையில் ‘பரலோகத் தந்தை’ என்று சேர்த்தல்
  rationale: உலகத்தாரின் முனைப்பான தேடலுக்கும் சீடர்கள் கடவுளைத் தங்கள் தந்தையாக அறிந்திருப்பதற்கும் உள்ள இறையியல் அழுத்தத்தை வசனம் தரும் அளவிலேயே காக்கிறது; இனவியல் பொருளை அளவுக்கு மீறிக் குறுக்கவோ, மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. ‘நாடித் தேடுகிறார்கள்’ என்பது செயற்பாட்டின் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறி தெளிவுக்காக நேரடியாகத் தொடர்புடைய ‘பிற இன மக்கள்’ என்பதன் பின்னர் வைக்கப்பட்டுள்ளது.
