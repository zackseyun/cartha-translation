id: LUK.12.39
reference: Luke 12:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: ta
  text: 'ஆனால் இதை அறிந்துகொள்ளுங்கள்: வீட்டுத் தலைவர் திருடன் எந்த நேரத்தில் வருவான் என்று அறிந்திருந்தால், தன் வீட்டுச் சுவர் துளைக்கப்பட அனுமதித்திருக்க மாட்டார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘துளையிடப்பட.’ அக்கால வீடுகளின் சுவரைத் துளைத்து உள்ளே புகும் வழக்கத்தை இது பிரதிபலிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: ஆனால் இதை அறிந்துகொள்ளுங்கள்
  rationale: δέ குறிக்கும் மாறுதலை ‘ஆனால்’ வெளிப்படுத்துகிறது; நிகழ்காலக் கட்டளை வடிவமான γινώσκετε-ஐ வாசகர்களை நேரடியாக அழைக்கும் மரியாதைப் பன்மை வடிவில் மொழிபெயர்க்கிறது.
- source_word: οἰκοδεσπότης
  choice: வீட்டுத் தலைவர்
  rationale: வீட்டுக்கும் குடும்பத்துக்கும் பொறுப்பான தலைவரைக் குறிக்கும் சொல்லை, இன்றைய தமிழில் இயல்பாகவும் சமூகப் பொருளைத் தக்கவைத்தும் தருகிறது.
- source_word: ποίᾳ ὥρᾳ
  choice: எந்த நேரத்தில்
  rationale: சொல்லின் காலக் குறிப்பைத் தெளிவாகக் காக்கிறது; ‘எந்த மணி நேரத்தில்’ என்பதைவிட நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ὁ κλέπτης ἔρχεται
  choice: திருடன் ... வருவான் என்று
  rationale: கிரேக்கத்தில் நிகழ்கால வடிவம் இருந்தாலும், இறந்தகாலத்திற்கு எதிரான நிபந்தனைச் சூழலில் வீட்டுத் தலைவரின் முன்னோக்கிய பார்வையைத் தமிழில் இயல்பாக வெளிப்படுத்த எதிர்கால வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: விட்டிருக்க மாட்டார்
  rationale: நிகழாத இறந்தகால நிபந்தனையின் விளைவைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: διορυχθῆναι
  choice: சுவரைத் துளைத்து உள்ளே நுழைய
  rationale: மண் அல்லது செங்கல் சுவரைத் துளைத்து வீட்டுக்குள் புகும் வரலாற்றுச் செயற்படிமத்தைப் பாதுகாத்தபடியே, அதன் நோக்கத்தையும் நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: τὸν οἶκον αὐτοῦ
  choice: தன் வீட்டின்
  rationale: αὐτοῦ-ஐ எழுவாயையே சுட்டும் இயல்பான தமிழ் வடிவமான ‘தன்’ என்று தருகிறது; οἶκος குறிக்கும் கட்டிடப் பொருளையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியும் கண்ணியமுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எதிர்நிகழ்வு நிபந்தனை தெளிவாக வைக்கப்பட்டு, சுவரைத் துளைக்கும் மூலமொழிப் படிமம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
