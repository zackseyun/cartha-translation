- from: 'ஆனால் இதை அறிந்துகொள்ளுங்கள்: வீட்டுத் தலைவர் திருடன் எந்த நேரத்தில் வருவான் என்று அறிந்திருந்தால், தன் வீட்டின் சுவரைத் துளைத்து உள்ளே நுழைய[a] விட்டிருக்க மாட்டார்.'
  to: 'ஆனால் இதை அறிந்துகொள்ளுங்கள்: வீட்டுத் தலைவர் திருடன் எந்த நேரத்தில் வருவான் என்று அறிந்திருந்தால், தன் வீட்டுச் சுவர் துளைக்கப்பட அனுமதித்திருக்க மாட்டார்.[a]'
