reference: Luke 12:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: ta
  text: ஆனால், தன் எஜமானின் விருப்பத்தை அறிந்திருந்தும், ஆயத்தம் செய்யவோ அவருடைய விருப்பத்தின்படி செயல்படவோ செய்யாத அந்த அடிமை பல அடிகள்[a] அடிக்கப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘அடிகள்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. ‘பலமுறை அடிக்கப்படுவான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: அடிமை
  rationale: இச்சொல் கூலிப் பணியாளரை அல்ல, எஜமானின் அதிகாரத்திற்குக் கட்டுப்பட்ட அடிமையைக் குறிக்கிறது; உவமையின் தண்டனைச் சூழலிலும் இந்த உறவு முக்கியமானது.
- source_word: γνοὺς
  choice: அறிந்திருந்தும்
  rationale: எஜமானுடைய விருப்பத்தை முன்பே அறிந்திருந்ததை இறந்தகால வினையெச்சம் காட்டுகிறது; எதிர்மறையான தொடருடன் ‘அறிந்திருந்தும்’ என்பது இயல்பாக அந்த முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: θέλημα
  choice: விருப்பம்
  rationale: இங்கு எஜமான் எதிர்பார்த்தது அல்லது வேண்டியது என்ற பொருள்; நவீனத் தமிழில் ‘விருப்பம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κυρίου
  choice: எஜமானுடைய
  rationale: இது உவமையிலுள்ள அடிமை–எஜமான் உறவைக் குறிக்கிறது; இவ்வாக்கியத்தில் நேரடியான தெய்வீகப் பட்டமாக எடுத்துக்கொள்ளாமல் சமூக உறவைத் தெளிவுபடுத்துகிறது.
- source_word: ἑτοιμάσας
  choice: ஆயத்தம் செய்யாமலும்
  rationale: கிரேக்கத்தில் ஆயத்தப்படுத்தப்பட வேண்டிய பொருள் வெளிப்படையாகக் கூறப்படவில்லை; தமிழிலும் அதைச் சேர்க்காமல் பொருளைத் திறந்தவாறே வைத்திருக்கிறது.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: அவருடைய விருப்பத்தின்படி நடக்காமலும்
  rationale: ποιέω plus πρός இங்கு எஜமானுடைய விருப்பத்துக்கு ஏற்ப செயற்படுவதைக் குறிக்கிறது; ‘நடக்காமலும்’ என்பது இயல்பான தமிழில் அந்தச் செயற்பாட்டு பொருளை வழங்குகிறது.
- source_word: δαρήσεται
  choice: அடிக்கப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் உடல் ரீதியான தண்டனையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: πολλάς
  choice: பல அடிகள்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் விடுபட்டிருந்தாலும், பல அடிகள் அல்லது பல முறை அடித்தல் என்பது உட்பொருள்; ‘பல அடிகள்’ எச்சரிக்கையின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: வாக்கியத்தின் உடனடிச் சூழல் அடிமைக்கும் அவனுடைய அதிகாரிக்கும் இடையிலான உறவு. ‘எஜமான்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் உவமையின் விரிந்த தெய்வீகக் குறிப்பை மறுப்பதில்லை.
- issue: πολλάς என்னும் தண்டனையின் அளவைக் குறிக்கும் சொற்றொடர்
  choice: பல அடிகள்
  alternative: பலமுறை; கடுமையாக
  rationale: கிரேக்கம் பெயர்ச்சொல்லை வெளிப்படையாகக் கூறாமல் விட்டுள்ளது. ‘பல அடிகள்’ திரும்பத் திரும்ப அடிக்கப்படுவதன் தெளிவான படிமத்தைப் பாதுகாக்கிறது; ‘கடுமையாக’ என்பது அளவுக்கு மீறிய விளக்கமாகிவிடலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் நேரடியான எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ‘அடிமை’ என்பது δοῦλος என்பதன் சமூக வலிமையைத் தெளிவாகத் தருகிறது; ‘ஊழியக்காரன்’ போன்ற மென்மையாக்கம் தவிர்க்கப்பட்டுள்ளது. அடிக்கப்பட வேண்டிய ‘அடிகள்’ கிரேக்கத்தில் மறைமுகமாக இருப்பதால் அடிக்குறிப்பில் மாற்று வாசிப்பு தரப்பட்டுள்ளது.
