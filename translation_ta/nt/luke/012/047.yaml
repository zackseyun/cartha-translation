- from: ஆனால், தன் எஜமானுடைய விருப்பத்தை அறிந்திருந்தும், ஆயத்தம் செய்யாமலும் அவருடைய விருப்பத்தின்படி நடக்காமலும் இருந்த அந்த அடிமை பல அடிகள்[a] அடிக்கப்படுவான்.
