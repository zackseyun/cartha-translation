  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ta
  text: ஏனெனில், உங்கள் பொக்கிஷம் எங்கே இருக்கிறதோ, அங்கே உங்கள் இதயமும் இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கெல்லாம் உங்கள் பொக்கிஷம் இருக்கிறதோ, அங்கெல்லாம் உங்கள் இதயமும் இருக்கும்.”
    reason: ὅπου என்பதற்கு சூழலைப் பொறுத்து ‘எங்கே’ என்பதோடு ‘எங்கெல்லாம்/எங்கிருந்தாலும்’ என்ற விரிவான நுணுக்கமும் இருக்கலாம்.
lexical_decisions:
- source_word: ὅπου
  choice: எங்கே
  rationale: இடத்தைக் குறிக்கும் சார்பு வாக்கியத்தை இயல்பாக அறிமுகப்படுத்துகிறது; ἐκεῖ என்பதுடன் சேர்ந்து ‘எங்கே… அங்கே…’ என்ற கிரேக்க இணை அமைப்பையும் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கமாக இந்தப் பழமொழித் தன்மையுள்ள கூற்று வருவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: θησαυρός
  choice: பொக்கிஷம்
  rationale: சேமிக்கப்பட்ட செல்வம் என்ற நேரடிப் பொருளையும், ஒருவர் உயர்வாக மதிப்பது என்ற உருவகப் பொருளையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: καρδία
  choice: இதயம்
  rationale: விருப்பம், பற்று, உள்ளார்ந்த நோக்கு ஆகியவற்றின் மையத்தைக் குறிக்கும் வேதாகமச் சொல்லாட்சியை, பொருளை ஒரு மனவியல் கூறாகச் சுருக்காமல் காக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: ὅπου என்பதுடன் அமைந்துள்ள ‘எங்கே… அங்கே…’ என்ற தொடர்புறு அமைப்பைப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: இதயமும் என்பதிலுள்ள ‘-உம்’
  rationale: பொக்கிஷம் இருக்கும் இடத்திலேயே இதயமும் சேர்ந்திருக்கும் என்ற சேர்க்கை வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: கிரேக்கத்தின் எதிர்கால வினையைப் பாதுகாத்து, எதிர்கால விளைவையும் பழமொழிக்குரிய உறுதியையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டு இடங்களிலும் உள்ள இரண்டாம் நபர் பன்மை உடைமையை நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: ‘இதயம்’ என்பதன் மானுடவியல் பொருள்
  choice: ஒருவரின் பற்றுகளும் அர்ப்பணிப்புகளும் உள்ளார்ந்த நோக்கும் மையங்கொள்ளும் இடத்தைக் குறிக்கும் ‘இதயம்’ என்ற சொல்லைத் தக்கவைத்தல்
  alternative: ‘ஆசைகள்’, ‘மனம்’ அல்லது ‘உள்ளம்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் ஒருவர் மதிப்பிடுவது அவருடைய உள்ளார்ந்த நோக்கை வழிநடத்துகிறது என்று கூறுகிறது. ‘இதயம்’ என்பது இப்பொருளின் அகலத்தையும் வேதாகம இலக்கியத் தொடர்ச்சியையும் காக்கிறது; அதை ஆசை அல்லது சிந்தனை மட்டும் என்று சுருக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வசனத்தின் கண்ணியமான பழமொழித் தொனியைப் பேணும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. ‘பொக்கிஷம்’ உருவகப் பொருளைத் தக்கவைக்கிறது; ‘இதயமும் இருக்கும்’ என்பது καὶ மற்றும் எதிர்கால வினையை இயல்பாகக் கடத்துகிறது.
