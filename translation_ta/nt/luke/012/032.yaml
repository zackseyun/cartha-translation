source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: ta
  text: சிறிய மந்தையே[b], அஞ்சாதே[a]. ஏனெனில், உங்களுக்கு ராஜ்யத்தைக்[c] கொடுக்க உங்கள் தந்தை பிரசன்னமாயிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பயப்படாதே.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சின்ன மந்தையே.’
    reason: lexical_alternative
  - marker: c
    text: ‘ராஜ்யம்’ என்பதை ‘அரசாட்சி’ என்றும் புரிந்துகொள்ளலாம்; இச்சொல் மக்களுக்குக் கொடுக்கப்படும் ராஜ்யத்தையும் தந்தையின் அரசாளுதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: அஞ்சாதே
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் தடையுத்தரவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது. ஒருமை வடிவம், ஒரே கூட்டமாக உருவகிக்கப்படும் ‘மந்தை’யை நோக்கிய கிரேக்க அழைப்பைத் தக்கவைக்கிறது.
- source_word: τὸ μικρὸν ποίμνιον
  choice: சிறிய மந்தையே
  rationale: ποίμνιον என்பதன் ஆட்டு மந்தை உருவகத்தையும், μικρόν என்பதன் சிறிய அளவையும், விளிவேற்றுமையில் வரும் நேரடி அழைப்பையும் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அஞ்ச வேண்டாம் என்ற அறிவுறுத்தலுக்கான காரணத்தை ὅτι அறிமுகப்படுத்துவதால், அதன் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εὐδόκησεν
  choice: மனமுவந்தார்
  rationale: தந்தையின் நல்விருப்பத்தையும் உவப்புடன் கூடிய முனைப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; இதை ஓர் உணர்ச்சி மிகைப்பாகவோ தொழில்நுட்பமான இறையியல் தீர்மானமாகவோ மாற்றவில்லை.
- source_word: ὁ πατὴρ ὑμῶν
  choice: உங்கள் தந்தை
  rationale: கிரேக்கத்தில் உள்ள பன்மை உடைமைப்பெயரையும் ‘தந்தை’ என்ற எளிய குறிப்பையும் காக்கிறது; மூலத்தில் இல்லாத ‘பரலோக’ போன்ற அடைமொழியைச் சேர்க்கவில்லை.
- source_word: δοῦναι ὑμῖν
  choice: உங்களுக்கு … கொடுக்க
  rationale: δίδωμι என்ற வினையின் எளிய ‘கொடு’ பொருளையும், ὑμῖν என்ற பன்மை பெறுபொருளையும் நேரடியாகத் தருகிறது.
- source_word: τὴν βασιλείαν
  choice: ராஜ்யத்தை
  rationale: βασιλεία குறிக்கக்கூடிய அரசின் களத்தையும் அரசாளும் அதிகாரத்தையும் முற்றிலும் ஒன்றுக்குள் சுருக்காமல், தமிழில் நன்கு அறியப்பட்ட வேதாகமச் சொல்லாக்கத்தைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: βασιλεία என்பதன் பொருள் நுணுக்கம்
  choice: ராஜ்யம்
  alternative: அரசாட்சி / அரசாளுதல்
  rationale: இச்சொல் ஓர் அரசின் களத்தையும் அரசரின் ஆட்சிச் செயலையும் குறிக்கக்கூடும். ‘ராஜ்யம்’ என்ற மொழிபெயர்ப்பு பழக்கமான வேதாகமச் சொல்லாக இருந்து இரு பரிமாணங்களுக்கும் இடமளிக்கிறது; அடிக்குறிப்பு அதன் ஆட்சிப் பொருளை வெளிப்படுத்துகிறது.
- issue: εὐδόκησεν மற்றும் தெய்வீக விருப்பம்
  choice: மனமுவந்தார்
  alternative: விரும்பினார் / அருளுடன் தீர்மானித்தார்
  rationale: தந்தையின் நல்விருப்பத்தையும் அருளான முனைப்பையும் தெரிவிக்கிறது; ஆனால் கிரேக்கச் சொல்லை ஒரு குறிப்பிட்ட கோட்பாட்டு ‘தீர்மானம்’ என்று மிகுதியாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை. ‘மந்தை’ என்ற மேய்ப்பர் உருவகம் மாற்றமின்றி வைக்கப்பட்டுள்ளது. கூட்டத்தைக் குறிக்கும் ‘மந்தை’ ஒருமையாக இருப்பதால் ‘அஞ்சாதே’ என்ற ஒருமை அழைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘ராஜ்யம்’ பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமப் பயன்பாடாகத் தக்கவைக்கப்பட்டு, அதன் ஆட்சிப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
