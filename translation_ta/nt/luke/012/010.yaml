id: LUK.12.10
reference: Luke 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: ta
  text: மனிதகுமாரனுக்கு எதிராக ஒரு வார்த்தை பேசுகிற ஒவ்வொருவருக்கும் அது மன்னிக்கப்படும்[a]; ஆனால் பரிசுத்த ஆவியானவருக்கு எதிராகத் தூஷணம் செய்கிறவருக்கு மன்னிக்கப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “அவருக்கு மன்னிக்கப்படும்” என்று உள்ளது; மன்னிக்கப்படும் பொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; அது அவர் பேசிய குற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: ஒவ்வொருவருக்கும்
  rationale: இந்தக் கிரேக்க அமைப்பு பொதுவான, பகிர்ந்தளிக்கும் பொருளில் ‘யார் யாரோ அவர்கள் ஒவ்வொருவரும்’ என்பதைக் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் இயல்பாக அமைக்கப்பட்டது.
- source_word: ἐρεῖ λόγον
  choice: பேசுகிற
  rationale: λόγον என்ற சொல்லைத் தனியே ‘ஒரு வார்த்தை’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்ற சொற்சொல் தன்மையை உண்டாக்கும்; ‘எதிராகப் பேசுகிற’ என்பது முழு சொற்றொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: εἰς
  choice: எதிராக
  rationale: விரோதமான பேச்சும் தூஷணமும் இடம்பெறும் இச்சூழலில் திசையைக் காட்டும் பொருளைவிட எதிர்ப்பைக் குறிக்கும் ‘எதிராக’ பொருத்தமானது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசு பயன்படுத்தும் இப்பட்டப்பெயருக்கான நிலைபெற்ற தமிழ் வடிவம்; அதன் செமித்தியப் பின்னணியையும் கிறிஸ்துவியல் வலிமையையும் காக்கிறது.
- source_word: ἀφεθήσεται αὐτῷ
  choice: அவருக்கும் அது மன்னிக்கப்படும்
  rationale: கிரேக்கத்தில் மன்னிக்கப்படுவது மறைமுகமாகக் குறிக்கப்படும் குற்றம்; ‘அது’ என்பதன் மூலம் அந்த மறைமுகப் பொருள் தமிழிலும் காக்கப்படுகிறது.
- source_word: τῷ ... βλασφημήσαντι
  choice: தூஷணம் செய்கிறவருக்கு
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள இறந்தகாலப் பங்கேற்புவினையை பொதுவான எச்சரிக்கையாக இயல்பான தமிழில் தருகிறது; முடிவுற்ற ஒரே செயல் என்ற கூடுதல் விளக்கத்தைத் திணிக்கவில்லை.
- source_word: τὸ ἅγιον πνεῦμα
  choice: பரிசுத்த ஆவியானவர்
  rationale: தெய்வீக ஆள்தன்மையை மரியாதையுடன் குறிக்கும், நவீன தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாகப் புரியப்படும் வடிவம்.
- source_word: οὐκ ἀφεθήσεται
  choice: மன்னிக்கப்படாது
  rationale: எதிர்காலச் செயப்பாட்டு மறுப்பைச் சுருக்கமாகவும் கடுமை குறையாமலும் வழங்குகிறது.
theological_decisions:
- issue: மனிதகுமாரனுக்கு எதிராகப் பேசுவதற்கும் பரிசுத்த ஆவியானவருக்கு எதிராகத் தூஷணம் செய்வதற்கும் உள்ள வேறுபாடு
  choice: வசனம் கூறும் மன்னிப்பின் வேறுபாட்டை விளக்கித் தீர்க்காமல் அப்படியே காத்தல்
  alternative: முதல் செயலை அறியாமையினாலும் இரண்டாவதை இறுதி மனந்திரும்பாமையினாலும் ஏற்பட்டதாக மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இந்த வசனம் மன்னிக்கப்படுவதில் ஒரு வேறுபாட்டைக் கூறுகிறது; ஆனால் அதற்கான செயல்முறையையோ ‘மன்னிக்கப்படாத பாவத்தின்’ முழு வரையறையையோ இங்கே வழங்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஒரு வார்த்தை பேசுகிற’ என்ற சொற்சொல் வடிவத்துக்குப் பதிலாக இயல்பான ‘எதிராகப் பேசுகிற’ பயன்படுத்தப்பட்டது; இரு உட்பிரிவுகளுக்கிடையிலான இறையியல் பதற்றம் விளக்கமின்றிக் காக்கப்பட்டது.
