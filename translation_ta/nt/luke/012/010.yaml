revisions:
- from: மனிதகுமாரனுக்கு எதிராகப் பேசுகிற ஒவ்வொருவருக்கும் அது மன்னிக்கப்படும்[a]; ஆனால் பரிசுத்த ஆவியானவருக்கு எதிராகத் தூஷணம் செய்கிறவருக்கு மன்னிக்கப்படாது.
  to: மனிதகுமாரனுக்கு எதிராக ஒரு வார்த்தை பேசுகிற ஒவ்வொருவருக்கும் அது மன்னிக்கப்படும்[a]; ஆனால் பரிசுத்த ஆவியானவருக்கு எதிராகத் தூஷணம் செய்கிறவருக்கு மன்னிக்கப்படாது.
