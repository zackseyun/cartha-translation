  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: ta
  text: பின்பு அவர் அவர்களிடம், “எச்சரிக்கையாக இருங்கள்; எல்லா வகையான பேராசையிலிருந்தும்[a] உங்களைக் காத்துக்கொள்ளுங்கள். ஏனெனில், ஒருவருடைய வாழ்வு அவரிடம் உள்ள உடைமைகள் ஏராளமாக இருப்பதில் அமைந்திருக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாப் பொருளாசையிலிருந்தும்.” πλεονεξία என்ற கிரேக்கச் சொல் பேராசை, பொருளாசை, அல்லது மேலும் மேலும் சேர்த்துக்கொள்ளும் ஆசை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் எச்சரிக்கை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: φυλάσσεσθε
  choice: உங்களைக் காத்துக்கொள்ளுங்கள்
  rationale: நடுநிலை ஏவல் வடிவத்திலுள்ள தற்காப்பு அல்லது தன்னைக் காவல் செய்துகொள்ளும் நுணுக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: எல்லா வகையான பேராசையிலிருந்தும்
  rationale: πάσης என்பதன் முழுமையான பரப்பையும், πλεονεξία குறிக்கும் பேராசை மற்றும் மேலும் சேர்த்துக்கொள்ளும் ஆசையின் விரிவான பொருளையும் எடுத்துரைக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்க இணைப்புச் சொல்லின் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: ஒருவருக்கு உடைமைகள் ஏராளமாக இருந்தாலும், ... அவரது வாழ்வு அமைவதில்லை
  rationale: ஒருவருடைய வாழ்வு மிகுதியான உடைமைகளால் உருவாகவோ நிலைபெறவோ செய்வதில்லை என்ற கிரேக்கக் கூற்றை இயல்பான தமிழில் தருகிறது; concessive phrasing captures context without changing logic.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: அந்த உடைமைகளால்
  rationale: ஒருவருக்குச் சொந்தமான அல்லது அவரிடம் உள்ள பொருட்களைக் குறிக்கும் ὑπάρχοντα என்பதைச் சுருக்கமாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ஆண்பால் ஒருமையின் பொதுப்பொருள்
  choice: ஒருவருக்கு ... அவரது வாழ்வு
  alternative: அவனுக்கு ... அவனுடைய வாழ்வு
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் அல்லாமல் எந்த மனிதரையும் பொதுவாகக் குறிக்கிறது; தமிழில் ‘ஒருவர்’ அந்தப் பொதுப்பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- issue: πλεονεξία குறிக்கும் தீய விருப்பத்தின் பரப்பு
  choice: எல்லா வகையான பேராசை
  alternative: எல்லாப் பொருளாசை
  rationale: எச்சரிக்கை பிறருடைய பொருளை விரும்புவதற்கு மட்டும் வரையறுக்கப்படாமல், அதிகமாகப் பெறவும் சேர்க்கவும் விழையும் மனநிலையின் எல்லா வடிவங்களையும் உள்ளடக்குகிறது.
- issue: வாழ்வுக்கும் உடைமைகளுக்கும் இடையிலான உறவு
  choice: அந்த உடைமைகளால் அவரது வாழ்வு அமைவதில்லை
  alternative: அவரது வாழ்வு அந்த உடைமைகளில் அடங்கியிருப்பதில்லை
  rationale: மிகுதியான உடைமைகள் வாழ்வின் அடிப்படையோ சாரமோ அல்ல என்ற பதற்றமுள்ள கூற்றை, ‘வாழ்வு’ என்பது உயிர்வாழும் காலமா அல்லது உண்மையான வாழ்க்கையா என்பதை தேவையின்றித் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நேரடி உரை. இரு எச்சரிக்கை ஏவல்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; இறுதி கூற்றில் ‘வாழ்வு’ என்பதன் இயல்பான பொருள் அகலமாகவே விடப்பட்டுள்ளது.
