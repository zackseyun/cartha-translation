  source_fidelity: மூலத்தின் எதிர்மறை இணைப்பான δέ, பொதுநியதியை வெளிப்படுத்தும் பெயர்ச்சொல்-வினையெச்சம், வெளிப்படையான என்னை, மற்றும் செய்பவரைக் குறிப்பிடாத எதிர்காலச் செயலப்பாட்டு வடிவம் ஆகியவை வரைவில் பெரும்பாலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் «மனிதர்களுக்கு முன்பாக / தூதர்களுக்கு முன்பாக» என்பதற்குப் பதில் «மனிதர்களின் முன்னிலையில் / தூதர்களின் முன்னிலையில்» என்பது ἐνώπιον-இன் பொதுமக்கள்/விண்ணகச் சாட்சிமுன் என்ற பொருளை நவீன தமிழில் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
