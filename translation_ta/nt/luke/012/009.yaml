source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: ta
  text: ஆனால் மனிதர்களின் முன்னிலையில் என்னை மறுதலிக்கிறவன், கடவுளின் தூதர்களின் முன்னிலையில் மறுதலிக்கப்படுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மறுத்துத் தள்ளப்படுவான்” என்றும் மொழிபெயர்க்கலாம்; இங்கு வரும் கிரேக்க வினைச்சொல், “மறுதலிக்கிறவன்” என்பதற்குப் பயன்படுத்தப்பட்ட சொல்லின் வலிமையான தொடர்புடைய வடிவம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνησάμενός
  choice: மறுதலிக்கிறவன்
  rationale: இறந்தகால வினையெச்ச வடிவம் பெயர்ச்சொல் தன்மையில் பொதுவான நியதியைச் சுட்டுகிறது. அதனால் இயல்பான தமிழ் நிகழ்கால வடிவம் பயன்படுத்தப்பட்டது; மேலும், பின்வரும் தொடர்புடைய வினையோடு உள்ள சொல்லிணைப்பும் காக்கப்படுகிறது.
- source_word: με
  choice: என்னை
  rationale: இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: பிறர் முன்னிலையில் வெளிப்படையாக நிகழ்வதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: τῶν ἀνθρώπων
  choice: மனிதர்களுக்கு
  rationale: ஆண் பாலாரை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; கடவுளின் தூதர்களோடு மூலத்தில் அமைந்துள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: ἀπαρνηθήσεται
  choice: மறுதலிக்கப்படுவான்
  rationale: எதிர்காலச் செயலப்பாட்டு வடிவத்தை அப்படியே காத்து, செய்பவர் யார் என்பதைச் சேர்க்கவில்லை. முதல் வினையோடு உள்ள பரஸ்பரச் சொல்லிணைப்பும் காக்கப்பட்டது.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: கடவுளின் தூதர்களுக்கு
  rationale: கிரேக்க உறவுவேற்றுமை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்தி, பரலோகத் தூதர்களைக் குறிக்கும் பொருளைக் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலுள்ள ஒப்புக்கொள்ளுதலுக்கு எதிரான மறுதலிப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: “மறுதலிக்கப்படுவான்” என்பதில் மறுதலிக்கும் செய்பவர் யார்?
  choice: மூலத்தைப் போலவே செயலப்பாட்டு வடிவத்தில் வைத்து, செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை.
  alternative: “மனுஷகுமாரனால் மறுதலிக்கப்படுவான்” அல்லது “கடவுளால் மறுதலிக்கப்படுவான்” என்று செய்பவரைச் சேர்த்தல்.
  rationale: கிரேக்க வசனம் செய்பவரைப் பெயரிடவில்லை. உடனடிச் சூழல் ஒரு முடிவை நோக்கிச் சுட்டக்கூடும்; ஆனாலும் இவ்வசனத்தின் தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் தீவிரமும் கொண்ட நடை பயன்படுத்தப்பட்டது. “மனிதர்கள்” பாலினப் பொதுமையை இயல்பாக வெளிப்படுத்துகிறது; “மறுதலிக்கப்படுவான்” என்ற செயலப்பாட்டு வடிவம் மூலத்தின் நோக்கமுள்ள தெளிவின்மையைக் காக்கிறது.
