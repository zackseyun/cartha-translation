  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: ta
  text: ஆனால் நான் பெற வேண்டிய திருமுழுக்கு ஒன்று இருக்கிறது[a][b]; அது நிறைவேறும் வரையில் நான் எவ்வளவு நெருக்கடிக்கு உள்ளாகிறேன்![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் திருமுழுக்கைப் பெற வேண்டியிருக்கிறது.” கிரேக்கத்தில் ‘திருமுழுக்கு’ என்ற படிமம் வெளிப்படையாகவே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘திருமுழுக்கு’ என்பது உவமை; இயேசு விரைவில் எதிர்கொள்ளவிருந்த அவரை ஆட்கொள்ளும் பாடுகளையும் மரணத்தையும் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நான் எவ்வளவு மனவேதனை அடைகிறேன்!” அல்லது “நான் எவ்வளவு அழுத்தத்திற்குள்ளாகிறேன்!”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: உவமையின் முழுகுதல்/ஆட்கொள்ளப்படுதல் படிமத்தை மறைக்காமல், தமிழில் அறியப்பட்ட வேதாகமச் சொல்லான ‘திருமுழுக்கு’ பயன்படுத்தப்படுகிறது.
- source_word: ἔχω βαπτισθῆναι
  choice: நான் பெற வேண்டிய ஒரு திருமுழுக்கு இருக்கிறது
  rationale: ἔχω + இறந்தகாலச் செயல்பாட்டு வினையெச்சம் காட்டும் வரவிருக்கும் கட்டாயத்தையும், βαπτισθῆναι என்பதன் செயப்படுபொருள் நிலையையும் இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் baptism படிமம் பெயர்ச்சொல்லில் தக்கவைக்கப்படுகிறது.
- source_word: πῶς
  choice: எவ்வளவு
  rationale: உணர்ச்சித் தீவிரத்தை வெளிப்படுத்தும் வியப்புப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: συνέχομαι
  choice: நெருக்கப்படுகிறேன்
  rationale: ‘அழுத்தப்படுதல், கட்டுப்படுத்தப்படுதல், மனவேதனை அடைதல்’ ஆகிய பொருள் நிழல்களை முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல், மூலத்தின் அழுத்தம்/நெருக்கடி சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἕως ὅτου
  choice: வரை
  rationale: நிலையின் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τελεσθῇ
  choice: அது நிறைவேறும்
  rationale: τελέω என்பதிலுள்ள நிறைவு அல்லது குறித்த முடிவை அடைதல் என்ற பொருளைத் தருகிறது; யோவான் 19:30-ன் தனிப்பட்ட சொற்றொடரை இங்கு இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: ‘திருமுழுக்கு’ என்பதன் உவமைப் பொருள்
  choice: இயேசுவின் வரவிருக்கும் பாடுகளையும் மரணத்தையும் குறிக்கும் உவமையாகப் புரிந்துகொள்ளப்படுகிறது; ஆனால் திருமுழுக்குப் படிமம் முதன்மை உரையில் அப்படியே வைக்கப்படுகிறது.
  alternative: பொதுவான ஆட்கொள்ளும் சோதனை அல்லது சொல்லர்த்தமான நீர்த் திருமுழுக்கு.
  rationale: உடனடிச் சூழல் வரவிருக்கும் பாடுகளைச் சுட்டினாலும், ‘பாடு’ என்று நேரடியாக மாற்றுவது மூலத்தின் இலக்கிய மற்றும் இறையியல் இழுபறியைத் தட்டையாக்கிவிடும்.
- issue: συνέχομαι என்பதன் உணர்ச்சி மற்றும் கட்டுப்பாட்டு நிழல்கள்
  choice: ‘நெருக்கப்படுகிறேன்’ என்று மொழிபெயர்த்து, உளவேதனையையும் அழுத்தம்/கட்டுப்பாட்டையும் திறந்த நிலையில் வைக்கிறது.
  alternative: ‘மனவேதனை அடைகிறேன்’ அல்லது ‘கட்டுப்படுத்தப்பட்டிருக்கிறேன்’.
  rationale: கிரேக்க வினை இரு நிழல்களையும் ஏற்கக்கூடியதால், ஒன்றை மட்டும் இறுதியான பொருளாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. ‘திருமுழுக்கு’ என்ற நிலைபெற்ற கிறிஸ்தவச் சொல் உவமையைத் தக்கவைக்கிறது. ‘நெருக்கப்படுகிறேன்’ என்பது சற்றே செறிவானதாயினும் மூலத்தின் உணர்ச்சி வேதனை மற்றும் அழுத்தம்/கட்டுப்பாடு ஆகிய இரு நிழல்களையும் பாதுகாக்கிறது.
