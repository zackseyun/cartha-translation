revisions:
- from: அப்போது கூட்டத்திலிருந்த ஒருவர் அவரிடம், “போதகரே, சொத்தை என்னுடன் பங்கிட்டுக்கொள்ளும்படி என் சகோதரரிடம் சொல்லுங்கள்” என்றார்.[a]
  to: அப்போது கூட்டத்திலிருந்து ஒருவர் அவரிடம், “போதகரே, பரம்பரைச் சொத்தை என்னுடன் பங்கிட்டுக்கொள்ளும்படி என் சகோதரரிடம் சொல்லுங்கள்” என்றார்.[a]
  rationale: The revision replaces the overly broad “சொத்தை” with “பரம்பரைச் சொத்தை” to preserve the source term’s inheritance sense. It also uses “கூட்டத்திலிருந்து” for the source expression “from the crowd.” The wording continues to preserve the Greek’s lack of detail about the precise legal arrangement or the size of the requested share.
