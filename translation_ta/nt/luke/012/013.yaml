id: LUK.12.13
reference: Luke 12:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: ta
  text: அப்போது கூட்டத்திலிருந்து ஒருவர் அவரிடம், “போதகரே, பரம்பரைச் சொத்தை என்னுடன் பங்கிட்டுக்கொள்ளும்படி என் சகோதரரிடம் சொல்லுங்கள்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரம்பரைச் சொத்தை என்னுடன் பகிர்ந்துகொள்ளும்படி” அல்லது “பரம்பரைச் சொத்தில் எனக்குரிய பங்கைப் பிரித்துக் கொடுக்கும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: அப்போது ... என்றார்
  rationale: δέ ஒரு மென்மையான நிகழ்வுத் தொடர்ச்சி இணைப்பாக உள்ளது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது, தேவையற்ற முரண்பாட்டைச் சேர்ப்பதில்லை.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: கூட்டத்திலிருந்த ஒருவர்
  rationale: கூடியிருந்த மக்களுள் அடையாளம் குறிப்பிடப்படாத ஒருவரைக் குறிக்கிறது; இவ்வடிவம் நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: இது இயேசுவைக் குறிக்கும் மறைமுக வேற்றுமை வடிவம்; தமிழில் உரையாடல் இலக்கை இயல்பாகக் காட்டுகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை நேரடியாக அழைக்கும் சொல்; ‘போதகரே’ என்பது dignified, பொதுவாகப் புரியும் தமிழ் வேதாகமப் பயன்பாடு, கூடுதல் அதிகாரக் கருத்தைத் திணிப்பதில்லை.
- source_word: εἰπὲ
  choice: சொல்லுங்கள்
  rationale: சகோதரரிடம் பேசுமாறு இயேசுவிடம் வைக்கும் வேண்டுகோள்; தமிழில் மரியாதைமிக்க ஏவல் வடிவம் பொருத்தமானது.
- source_word: τῷ ἀδελφῷ μου
  choice: என் சகோதரரிடம்
  rationale: உறவையும் உடைமையையும் நேரடியாகத் தக்கவைக்கிறது; பாலினம் ஆண் என்பதை மூலச்சொல் தெரிவிக்கிறது.
- source_word: μερίσασθαι μετ’ ἐμοῦ
  choice: என்னுடன் பங்கிட்டுக்கொள்ளும்படி
  rationale: μερίζομαι என்பதன் பகுத்தல்/பங்கிடுதல் பொருளையும் μετά என்பதன் ‘என்னுடன்’ என்ற கூட்டுப்பங்கேற்பையும் தக்கவைக்கிறது; யாருக்கு எவ்வளவு பங்கு என்ற சட்ட நிலையை அதிகமாக விளக்குவதில்லை.
- source_word: τὴν κληρονομίαν
  choice: சொத்தை
  rationale: இங்கு பரம்பரையாகக் கிடைக்கும் உடைமையைச் சுட்டுகிறது. தமிழில் குடும்பப் பங்கீட்டு சூழலில் ‘சொத்து’ இயல்பானது; அடிக்குறிப்பு ‘பரம்பரைச் சொத்து’ என்ற தெளிவான மாற்றை வழங்குகிறது.
