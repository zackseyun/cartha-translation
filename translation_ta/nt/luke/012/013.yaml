translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க ஆனால் பொதுமக்களுக்கு எளிதில் புரியும் கதைநடை. நேரடி உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சட்டநிலைத் தெளிவின்மையை முதன்மை உரை காக்கிறது; சாத்தியமான பொருள் வேறுபாடுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
