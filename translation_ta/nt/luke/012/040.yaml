  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: ta
  text: நீங்களும் ஆயத்தமாக இருங்கள்[a]. ஏனெனில் நீங்கள் எதிர்பாராத நேரத்தில்[b] மானிடமகன்[c] வருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்களும் ஆயத்தமாயிருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் நினைக்காத நேரத்தில்” அல்லது “நீங்கள் அதை எதிர்பாராதபோது.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கில், “மானிடமகன்.” இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் பட்டம்; இதில் தானியேல் 7:13–14-ன் எதிரொலி இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: முந்தைய உவமையில் கூறப்பட்ட பணியாளர்களைப் போலக் கேட்போரும் ஆயத்தமாக இருக்க வேண்டும் என்ற உள்ளடக்கத்தையும் வலியுறுத்தலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γίνεσθε ἕτοιμοι
  choice: ஆயத்தமாக இருங்கள்
  rationale: தொடர்ந்து நிலவும் ஆயத்த நிலையைக் கோரும் நிகழ்காலக் கட்டளை வடிவத்தின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ᾗ ὥρᾳ
  choice: நேரத்தில்
  rationale: குறிப்பிட்ட மணிநேரத்தைவிட நிகழும் காலப்புள்ளியையே குறிக்கும் கிரேக்க காலவியல் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: οὐ δοκεῖτε
  choice: நீங்கள் எதிர்பாராத
  rationale: δοκέω என்பதன் ‘நினைத்தல்/கருதுதல்’ பொருள் இச்சூழலில் நடைமுறையாக எதிர்பாராமையைக் குறிக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசு பயன்படுத்தும் பட்டத்தின் சொல் வடிவத்தையும் தானியேல் 7 பின்னணியின் மேசியா மற்றும் வெளிப்பாட்டு ஒலிப்புகளையும் பாதுகாக்கும் நவீனத் தமிழ் வடிவம்.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: எதிர்கால நோக்குடன் பயன்படுத்தப்பட்டுள்ள கிரேக்க நிகழ்காலத்தை அப்படியே உயிரோட்டத்துடனும் எச்சரிக்கைத் தொனியுடனும் தருகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டத்தை மொழிபெயர்த்தல்
  choice: மானிடமகன்
  alternative: மனிதரானவர்
  rationale: பட்டத்தின் நேரடியான அமைப்பையும் தானியேல் 7:13–14 உடனான சாத்தியமான தொடர்பையும் பாதுகாக்கிறது; உரையில் இல்லாத கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: இறுதிக்கால எச்சரிக்கையில் ἔρχεται என்பதன் காலவியல் வலிமை
  choice: வருகிறார்
  alternative: வருவார்
  rationale: கிரேக்க நிகழ்காலத்தின் உடனடித் தன்மையையும் எச்சரிக்கைத் தொனியையும் காக்கிறது; அதேவேளை எந்தக் குறிப்பிட்ட இறுதிக்கால முறையையும் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயத்தமாக’ என்பது கட்டளையின் தீவிரத்தையும் தொடர்ச்சியான நிலையையும் தருகிறது; ‘மானிடமகன்’ என்பது பழமையான ‘மனுஷகுமாரன்’ என்பதற்குப் பதிலாக பட்டத்தின் வேதாகமத் தொடர்பைத் தக்கவைக்கும் நவீன வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது.
