id: LUK.12.48
reference: Luke 12:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: ta
  text: ஆனால், அறியாமல் அடிபடத் தகுந்தவற்றைச் செய்தவன் சில அடிகளால் அடிக்கப்படுவான். அதிகம் கொடுக்கப்பட்ட ஒவ்வொருவரிடமும் அதிகம் கேட்கப்படும்; யாரிடம் அதிகம் ஒப்படைத்தார்களோ, அவரிடம் இன்னும் அதிகமாகக் கேட்பார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: அறியாதவன்
  rationale: எதை அறியவில்லை என்பது உடனடியான சூழலிலிருந்து புரிகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்காமல், பெயர்ச்சொல் போன்று செயல்படும் பங்கேற்புவினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: அடிபடத் தகுந்தவற்றைச் செய்தவன்
  rationale: ἄξια என்ற பன்மை வடிவத்தையும், செயல்கள் அடிகளுக்குத் தகுதியானவை என்ற காரணத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: δαρήσεται ὀλίγας
  choice: சில அடிகளே அடிக்கப்படுவான்
  rationale: δέρω என்பதிலுள்ள அடித்தல் என்ற வெளிப்படையான பொருளையும் ὀλίγας என்பதிலுள்ள குறைந்த எண்ணிக்கையையும் தெளிவாகத் தருகிறது; ‘-ஏ’ முந்தைய வசனத்திலுள்ள அதிக அடிகளுடனான வேறுபாட்டை இயல்பாக உணர்த்துகிறது.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: அதிகம் கொடுக்கப்பட்ட ஒவ்வொருவரிடமும்
  rationale: பொதுவான பொறுப்புக் கொள்கையைத் தெரிவிக்கும் தத்துவார்த்த தத்திவ் அமைப்பையும், செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: அதிகம் கேட்கப்படும்
  rationale: ζητέω இங்கு கணக்குக் கேட்பது அல்லது கோருவது என்ற வலிமையைக் கொண்டது. ‘கேட்கப்படும்’ என்பது அடுத்துள்ள αἰτέω உடனான சொல் தொடர்பையும் செயப்பாட்டு அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ᾧ παρέθεντο πολύ
  choice: யாரிடம் அதிகம் ஒப்படைத்தார்களோ
  rationale: παρατίθημι என்பதன் பொறுப்பாக ஒப்படைத்தல் என்ற பொருளையும், வெளிப்படையான எழுவாய் இல்லாத மூன்றாம் நபர் பன்மை வினையையும் தமிழில் குறிப்பிடப்படாத பொதுவான செய்பவர்களாகவே வைத்திருக்கிறது.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: அவரிடம் இன்னும் அதிகமாகக் கேட்பார்கள்
  rationale: περισσότερον என்பதன் உயர்த்தப்பட்ட அளவையும், αἰτέω என்பதன் கேட்பது அல்லது கோருவது என்ற பொருளையும், குறிப்பிடப்படாத பன்மைச் செய்பவர்களையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தண்டனையின் உருவகம்
  choice: ‘அடிகள்’ மற்றும் ‘அடிக்கப்படுவான்’ என்ற உடல்சார்ந்த உவமையை அப்படியே வைத்தல்
  alternative: பொதுவாக ‘தண்டனை பெறுவான்’ என்று மென்மையாக்குதல் அல்லது குறிப்பிட்ட கருவியால் சவுக்கடி என வலுப்படுத்துதல்
  rationale: உரை அறிவுக்கும் பொறுப்புக்கும் ஏற்ப மாறுபடும் தண்டனையை உவமையாகக் கூறுகிறது. அது சொல்லாத இறுதித் தீர்ப்பின் நடைமுறையை வரையறுக்காமல், உரையின் தெளிவான உருவகத்தைப் பாதுகாக்க வேண்டும்.
- issue: இறுதிக் கூறிலுள்ள செய்பவர்கள்
  choice: ‘ஒப்படைத்தார்களோ ... கேட்பார்கள்’ என்று குறிப்பிடப்படாத பன்மையைப் பாதுகாத்தல்
  alternative: ‘தேவன் ஒப்படைத்தார்; தேவன் கேட்பார்’ அல்லது குறிப்பிட்ட மனிதர்களை எழுவாயாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் எழுவாய் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை வினைகள் உள்ளன. கடவுளையோ மனிதர்களையோ வெளிப்படையாகச் சேர்ப்பது உரை கூறுவதைக் கடந்த விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் உவமையின் தீவிரமும் குன்றாத வகையில் வடிவமைக்கப்பட்டது. ‘அவரிடம்’ என்பது தமிழின் இயல்பான ஒருமை மரியாதைச் சுட்டு; கிரேக்கத்தின் ஒருமை நபரைக் குறிக்கிறது. தேவையற்ற சமய மரபுச் சொற்களும் தொன்மையான நடையும் தவிர்க்கப்பட்டுள்ளன.
