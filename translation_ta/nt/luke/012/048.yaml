  to: ஆனால், அறியாமல் அடிபடத் தகுந்தவற்றைச் செய்தவன் சில அடிகளால் அடிக்கப்படுவான். அதிகம் கொடுக்கப்பட்ட ஒவ்வொருவரிடமும் அதிகம் கேட்கப்படும்; யாரிடம் அதிகம் ஒப்படைத்தார்களோ, அவரிடம் இன்னும் அதிகமாகக் கேட்பார்கள்.
