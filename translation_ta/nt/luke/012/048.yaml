review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between ignorance and culpable action, retains the explicit image of being beaten, and preserves the general principle of greater accountability for greater gifts and entrusted responsibility. The indefinite third-person plural in the final clause is appropriately retained without specifying an agent.
  naturalness: The opening expression “அறியாதவனாய் ... செய்தவன்” is understandable but somewhat stiff in modern standard Tamil. Recasting it with “அறியாமல்” is more idiomatic while maintaining the source's lack-of-knowledge sense. “சில அடிகளே அடிக்கப்படுவான்” is also less natural than an instrumental expression for the means/measure of beating.
  terminology: “அடிகள்,” “ஒப்படைத்தார்கள்,” and “கேட்பார்கள்” suit the source and the intended modern register. The wording does not over-specify the disciplinary image or the unnamed agents.
  issues:
  - severity: low
    issue: Opening participial construction is stylistically stiff.
    rationale: “அறியாதவனாய் ... செய்தவன்” is grammatically possible, but “அறியாமல் ... செய்தவன்” is more natural modern Tamil and still represents ὁ μὴ γνούς without supplying an unstated object of knowledge.
  - severity: low
    issue: The punishment clause needs a more idiomatic Tamil construction.
    rationale: Greek δαρήσεται ὀλίγας explicitly means being beaten with few blows. “சில அடிகளால் அடிக்கப்படுவான்” clearly and naturally expresses this while retaining the concrete imagery.
  revised_text: ஆனால், அறியாமல் அடிபடத் தகுந்தவற்றைச் செய்தவன் சில அடிகளால் அடிக்கப்படுவான். அதிகம் கொடுக்கப்பட்ட ஒவ்வொருவரிடமும் அதிகம் கேட்கப்படும்; யாரிடம் அதிகம் ஒப்படைத்தார்களோ, அவரிடம் இன்னும் அதிகமாகக் கேட்பார்கள்.
