translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் வேளாண்மைச் சூழலைக் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. பேச்சாளனின் தன்னம்பிக்கையான திட்டமிடலை வெளிப்படுத்தும் தொடர்ச்சியான முதலாம் நபர் எதிர்கால வினைகள் பாதுகாக்கப்பட்டுள்ளன.
