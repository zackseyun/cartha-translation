reference: Luke 12:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: ta
  text: 'அவன், “நான் இப்படிச் செய்வேன்: என் களஞ்சியங்களை[a] இடித்துவிட்டு, அவற்றைவிடப் பெரிய களஞ்சியங்களைக் கட்டுவேன். அங்கே தானியம் முழுவதையும்[b], என் உடைமைகள் அனைத்தையும்[c] சேர்த்துவைப்பேன்” என்று சொன்னான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தானியக் கிடங்குகளை.”
    reason: lexical_alternative
  - marker: b
    text: சில சூழல்களில் “தானியம்” என்பது குறிப்பாக “கோதுமை”யைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “என் பொருள்கள் அனைத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: நான் இப்படிச் செய்வேன்
  rationale: முன்னோக்கிக் கூறப்படும் தீர்மானத்தையும் τοῦτο என்பதன் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθελῶ
  choice: இடித்துவிட்டு
  rationale: ஏற்கெனவே உள்ள கட்டடங்களை அகற்றும் உறுதியான எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀποθήκας
  choice: களஞ்சியங்களை
  rationale: சேமிப்பிடங்களைக் குறிக்கும் கிரேக்கச் சொல்லின் பரந்த பொருளைக் காக்கிறது; இவ்வேளாண்மைச் சூழலில் தானியக் கிடங்குகளைக் குறிக்கிறது.
- source_word: μείζονας οἰκοδομήσω
  choice: அவற்றைவிடப் பெரியவற்றைக் கட்டுவேன்
  rationale: ஒப்பீட்டுப் பொருளைக் காத்து, கிரேக்கத்தில் விடுபட்டுள்ள ‘களஞ்சியங்கள்’ என்ற பெயர்ச்சொல்லை இயல்பான தமிழில் மறைமுகமாக உணர்த்துகிறது.
- source_word: συνάξω ἐκεῖ
  choice: அங்கே … சேர்த்துவைப்பேன்
  rationale: ‘அங்கே ஒன்றாகச் சேர்ப்பேன்’ என்ற அடிப்படைப் பொருளையும் சேமிப்பிடச் சூழலையும் இயல்பாக இணைக்கிறது.
- source_word: πάντα τὸν σῖτον
  choice: தானியம் முழுவதையும்
  rationale: πάντα என்பதன் முழுமையையும் σῖτος என்பதன் பொதுவான ‘தானியம்’ என்ற பொருளையும் காக்கிறது; மூலத்தில் இல்லாத உடைமைப் பெயரைச் சேர்க்கவில்லை.
- source_word: τὰ ἀγαθά μου
  choice: என் உடைமைகள் அனைத்தையும்
  rationale: பணத்துக்கு மட்டும் குறுக்காமல், பேச்சாளனுடைய பொருட்கள் அல்லது சொத்துகள் என்ற பரந்த பொருளைத் தருகிறது.
