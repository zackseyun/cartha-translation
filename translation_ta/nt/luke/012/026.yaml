source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: ta
  text: ஆகவே, மிகச் சிறிய காரியத்தைக்கூட உங்களால் செய்ய முடியாவிட்டால், மற்றவற்றைக் குறித்து[a] ஏன் கவலைப்படுகிறீர்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீதியுள்ள காரியங்களைக் குறித்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: ஆகவே, ... முடியாவிட்டால்
  rationale: εἰ என்பதன் நிபந்தனைப் பொருளையும் οὖν என்பதன் முந்தைய வாதத்திலிருந்து வரும் முடிவுறுத்தும் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐδὲ ἐλάχιστον
  choice: மிகச் சிறிய காரியத்தைக்கூட
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ἐλάχιστον என்பதைக் தமிழில் தெளிவாக்க ‘காரியம்’ சேர்க்கப்பட்டுள்ளது; οὐδέ-யின் வலியுறுத்தலை ‘கூட’ வெளிப்படுத்துகிறது.
- source_word: δύνασθε
  choice: உங்களால் செய்ய முடியாவிட்டால்
  rationale: δύναμαι குறிக்கும் ஆற்றல் அல்லது இயலுமையைத் தக்கவைக்கிறது; கிரேக்கத்தில் மறைமுகமாக உள்ள செயலைத் தமிழில் ‘செய்ய’ என்று வெளிப்படுத்துகிறது.
- source_word: τί
  choice: ஏன்
  rationale: இந்த வினாவாக்கியத்தில் τί காரணத்தை விசாரிக்கும் சொல்லாகப் பயன்படுவதால், இயல்பான தமிழ் வடிவம் ‘ஏன்’ ஆகும்.
- source_word: περὶ τῶν λοιπῶν
  choice: மற்றவற்றைக் குறித்து
  rationale: ‘மிகச் சிறிய காரியம்’ தவிர எஞ்சியுள்ள காரியங்களை λοιπός சுட்டுகிறது; சுருக்கமான, இயல்பான தமிழாக இது அமைகிறது.
- source_word: μεριμνᾶτε
  choice: கவலைப்படுகிறீர்கள்
  rationale: தொடர்ந்து கவலைகொள்வதைச் சுட்டும் நிகழ்காலப் பொருளை வெளிப்படுத்துகிறது; அதேவேளை எல்லா பொறுப்புள்ள அக்கறையையும் இயேசு தடைசெய்வதாகக் கூறவில்லை.
theological_decisions:
- issue: கடவுளைச் சார்ந்திருப்பது பற்றிய இயேசுவின் போதனையில் μεριμνάω என்பதன் பொருள்
  choice: கவலைப்படுகிறீர்கள்
  alternative: அக்கறைப்படுகிறீர்கள்
  rationale: இங்கு கண்டிக்கப்படுவது பொறுப்பான அக்கறை அல்ல, மனத்தை ஆட்கொள்ளும் கவலை. ‘கவலைப்படுகிறீர்கள்’ என்பது அந்த வேறுபாட்டைத் தேவையற்ற விளக்கமின்றி சூழலுக்கேற்றவாறு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பன்மை முன்னிலையை ‘உங்களால்/கவலைப்படுகிறீர்கள்’ என்பவை காக்கின்றன; கிரேக்கத்தின் நிபந்தனை மற்றும் முடிவுறுத்தும் தொடர்பும் பாதுகாக்கப்பட்டுள்ளது.
