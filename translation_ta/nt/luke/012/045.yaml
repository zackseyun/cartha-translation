id: LUK.12.45
reference: Luke 12:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: ta
  text: ஆனால் அந்த அடிமை[a] தன் உள்ளத்தில்[b], ‘என் எஜமான்[c] வரத் தாமதிக்கிறார்’ என்று சொல்லி, ஆண் பணியாளர்களையும் பெண் பணியாளர்களையும் அடிக்கவும், உண்ணவும் குடிக்கவும் குடிபோதையில் ஆழவும் தொடங்கினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேலைக்காரன்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் கட்டுப்பட்ட அடிமை நிலையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தனக்குள்’. சொற்சொல்லாக, ‘தன் இதயத்தில்’.
    reason: idiom_clarification
  - marker: c
    text: அல்லது, ‘என் ஆண்டவன்’. இங்கு கிரேக்க κύριος வீட்டின் மனிதத் தலைவரைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: அடிமை
  rationale: வீட்டு அதிகார அமைப்பிற்குள் கட்டுப்பட்ட நிலையையும் கணக்குக்கொடுக்க வேண்டிய உறவையும் ‘அடிமை’ தெளிவாக வெளிப்படுத்துகிறது; ‘பணியாளர்’ அந்த சமூக நிலையை மென்மையாக்கிவிடலாம்.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: தன் உள்ளத்தில்
  rationale: எண்ணம் வெளியில் சொல்லப்படாமல் மனத்திற்குள் இருப்பதைத் தெரிவிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான, அதேவேளை வடிவத்துக்கு நெருக்கமான தமிழ்.
- source_word: Χρονίζει … ἔρχεσθαι
  choice: வரத் தாமதிக்கிறார்
  rationale: வருகை தாமதமாவதாக அடிமை கருதுவதை இயல்பான தமிழில் தெரிவிக்கிறது; நிகழ்காலத்தின் தொடரும் நிலையும் காக்கப்படுகிறது.
- source_word: κύριός μου
  choice: என் எஜமான்
  rationale: உவமையின் வீட்டுச் சூழலில் இது அடிமையின் மனித அதிகாரியைக் குறிக்கிறது. ‘எஜமான்’ அந்த உறவைத் தெளிவுபடுத்தி, தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: ἄρξηται
  choice: தொடங்கினால்
  rationale: அடுத்துவரும் செயல்களில் அவன் ஈடுபடத் தொடங்குவதை நிபந்தனை வாக்கியத்தோடு இயல்பாக இணைக்கிறது.
- source_word: τύπτειν
  choice: அடிக்கவும்
  rationale: இச்சூழலில் மீண்டும் மீண்டும் நிகழக்கூடிய உடல் வன்முறையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: ஆண் பணியாளர்களையும் பெண் பணியாளர்களையும்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ஆண்பால்–பெண்பால் இணையைத் தக்கவைத்து, இங்கு வீட்டுப் பணியாளர்களே குறிக்கப்படுகிறார்கள் என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: ἐσθίειν τε καὶ πίνειν
  choice: உண்ணவும் குடிக்கவும்
  rationale: இரு இணைச் செயல்களையும் விரிவாக்கமின்றி நேரடியாக வழங்குகிறது.
- source_word: μεθύσκεσθαι
  choice: குடிபோதையில் ஆழவும்
  rationale: போதையடையும் நிலையை நவீன, கண்ணியமான தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: உவமையில் κύριος என்பது மனித வீட்டுத் தலைவரைக் குறிக்கும்போது அதை எவ்வாறு மொழிபெயர்ப்பது
  choice: எஜமான்
  alternative: ஆண்டவன்
  rationale: கதை உலகில் இது அடிமையின் மனித எஜமானைக் குறிக்கிறது. ‘ஆண்டவன்’ என்பது தெய்வீகப் பட்டமாகப் புரிந்துகொள்ளப்படக்கூடும்; எனினும் கிரேக்கச் சொல்லின் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இந்த வீட்டுச் சூழலில் δοῦλος என்பதைக் குறிக்கும் சொல்
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: அதிகாரம், கட்டுப்பட்ட சமூக நிலை, பொறுப்புக்கூறல் ஆகியவை இச்சூழலில் முன்னிலையாக இருப்பதால் ‘அடிமை’ மூலச்சொல்லின் கடினமான சமூக உண்மையை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நிபந்தனை வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘ஆண் பணியாளர்கள் / பெண் பணியாளர்கள்’ என்ற இணை மூலத்தின் பாலின வேறுபாட்டைப் பாதுகாக்கிறது.
