  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: ta
  text: உங்கள் இடுப்புகள் வரிந்து கட்டப்பட்டிருக்கட்டும்; உங்கள் விளக்குகள் எரிந்துகொண்டிருக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செயல்பட ஆயத்தமாக இருங்கள்.” நீண்ட ஆடையைத் தூக்கிச் சேர்த்து இடுப்பில் இறுக்கிக் கட்டிக்கொண்டு ஆயத்தமாவதை இந்த உருவகம் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: இருக்கட்டும்
  rationale: εἰμί என்பதன் மூன்றாம் நபர் நிகழ்காலக் கட்டளை வடிவம். தமிழில் அறிவுறுத்தலை இயல்பாகவும் மூலத்தின் இலக்கண வலிமையுடனும் தெரிவிக்கிறது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டு இணை பெயர்ச்சொல் தொடர்களுக்கும் உரிமைப் பொருளைத் தரும் பன்மை முன்னிலைப் பெயர்; தமிழில் இயல்பாக இரண்டிலும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὀσφύες
  choice: இடுப்புகள்
  rationale: இடுப்பு அல்லது அரைப் பகுதியைக் குறிக்கிறது. ‘அரைகள்’ என்பதைவிட ‘இடுப்புகள்’ இன்றைய பொதுத் தமிழில் தெளிவானது; உடல் சார்ந்த மூல உருவகத்தையும் காக்கிறது.
- source_word: περιεζωσμέναι
  choice: வரிந்துகட்டப்பட்டிருக்கட்டும்
  rationale: ஆடையை இடுப்பைச் சுற்றி இறுக்கிக் கட்டி ஆயத்தமாக நிற்கும் உருவகத்தைத் தக்கவைக்கிறது. நிறைவேறிய செயலின் தொடரும் நிலையை கிரேக்க நிறைவுக்காலப் பங்கேற்பு வடிவத்துக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: λύχνοι
  choice: விளக்குகள்
  rationale: ஒளியைப் பொதுவாக அல்லாமல் எண்ணெய் விளக்குகள் போன்ற தெளிவான பொருளைக் குறிக்கும் சொல்.
- source_word: καιόμενοι
  choice: எரிந்துகொண்டிருக்கட்டும்
  rationale: நிகழ்காலப் பங்கேற்பு காட்டும் தொடர்ச்சியான எரியும் நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆயத்தநிலையைக் குறிக்கும் பண்பாட்டு உருவகம்
  choice: ‘இடுப்புகள் வரிந்துகட்டப்பட்டிருக்கட்டும்’ என்ற தெளிவான உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘செயல்பட ஆயத்தமாக இருங்கள்’ என்று பொருளை மட்டும் நேரடியாகக் கூறுதல்
  rationale: மூலவசனம் ஆயத்தநிலையை நீண்ட ஆடையை இடுப்பில் வரிந்துகட்டும் உருவகத்தின் வழியாகச் சொல்கிறது. அதை விளக்கவுரையாக மாற்றாமல் தக்கவைத்து, நவீன வாசகருக்கான பண்பாட்டு விளக்கத்தை அடிக்குறிப்பில் தருவது மூலத்தின் உருவக வலிமையையும் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரைகள் கட்டப்பட்டிருக்கட்டும்’ போன்ற பழமையான வழக்கைத் தவிர்த்து, மூலத்தின் உடல் சார்ந்த உருவகத்தை ‘இடுப்புகள் வரிந்துகட்டப்பட்டிருக்கட்டும்’ என்று தக்கவைத்துள்ளது.
