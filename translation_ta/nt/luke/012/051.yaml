id: LUK.12.51
reference: Luke 12:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: ta
  text: பூமியில்[a] சமாதானத்தை ஏற்படுத்த[b] நான் வந்தேன் என்று நினைக்கிறீர்களா? இல்லை, உங்களுக்குச் சொல்கிறேன்; மாறாக, பிரிவினையை ஏற்படுத்தவே வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமியில்’ என்பதை ‘நாட்டில்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு பரந்த பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் சொற்பொருளில் ‘கொடுக்க’ என்பதாகும்; தமிழில் இயல்பாக இருக்க ‘ஏற்படுத்த’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: நினைக்கிறீர்களா
  rationale: இது பன்மை முன்னிலையிலுள்ளவர்களை நோக்கி எழுப்பப்படும் நேரடியான வினா. நவீனத் தமிழில் இயல்பாகவும் சவாலான தொனியைத் தக்கவைத்தும் உள்ளது.
- source_word: εἰρήνην
  choice: சமாதானத்தை
  rationale: இங்கு தனிப்பட்ட மன அமைதியை மட்டும் அல்லாமல் மக்களிடையேயான சமாதானம் மற்றும் ஒற்றுமையையும் குறிக்கக்கூடிய பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: παρεγενόμην
  choice: நான் வந்தேன்
  rationale: இயேசுவின் வருகையையும் அதனுடன் தொடர்புடைய நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δοῦναι
  choice: ஏற்படுத்த
  rationale: இதன் நேரடிப் பொருள் ‘கொடுக்க’ என்பதாக இருந்தாலும், ‘சமாதானத்தைக் கொடுக்க’ என்பதைவிட ‘சமாதானத்தை ஏற்படுத்த’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ். அதே வினைச்சொல்லை ‘பிரிவினை’ என்பதோடும் பயன்படுத்த முடிவதால் மூலத்தின் இணையான எதிர்மறை அமைப்பு தெளிவாகிறது.
- source_word: ἐν τῇ γῇ
  choice: பூமியில்
  rationale: γῆ என்பதன் பரந்த உலகளாவிய பொருளைத் தக்கவைக்கிறது; ‘நாட்டில்’ என்பது பொருளை ஒரு குறிப்பிட்ட நிலப்பகுதிக்குள் குறுக்கக்கூடும்.
- source_word: οὐχί
  choice: இல்லை
  rationale: வினாவுக்கு வலுவான, சுருக்கமான மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான அழுத்தத்தைக் கொண்ட நற்செய்தி நூல்களின் வழக்கமான உரைச் சூத்திரத்தைத் தக்கவைக்கிறது.
- source_word: ἀλλ’ ἢ
  choice: மாறாக
  rationale: மறுப்புக்குப் பின் சமாதானத்துக்கும் பிரிவினைக்கும் இடையிலான கூர்மையான எதிர்மறையை வெளிப்படுத்துகிறது.
- source_word: διαμερισμόν
  choice: பிரிவினையை
  rationale: அடுத்த வசனங்களில் குடும்பங்களுக்குள்ளும் ஏற்படும் பிளவை உள்ளடக்கும் பரந்த சமூகப் பிரிவை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: இயேசுவின் வருகை சமாதானத்தை அல்ல, பிரிவினையை ஏற்படுத்தும் என்ற கூற்றின் கூர்மையை மென்மைப்படுத்தலாமா?
  choice: சமாதானம் அல்ல, பிரிவினை என்ற நேரடியான எதிர்மறை அப்படியே தக்கவைக்கப்பட்டது.
  alternative: ‘கருத்து வேறுபாடு’ போன்ற மென்மையான சொல்லைப் பயன்படுத்துவது அல்லது இது தற்செயலான விளைவு மட்டுமே என்று மொழிபெயர்ப்பிலேயே விளக்குவது.
  rationale: கிரேக்க உரை வேண்டுமென்றே கூர்மையான எதிர்மறையை முன்வைக்கிறது. உடனடிச் சூழலில் இயேசுவின் பணி மக்களிடையே, குறிப்பாகக் குடும்பங்களுக்குள், ஏற்படுத்தும் பிளவைக் குறிக்கிறது. சமாதானத்தைப் பற்றிய பிற வேதாகமக் கருத்துகளுடன் இதை மொழிபெயர்ப்பிலேயே சமரசப்படுத்தாமல் உரையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில், அதேவேளையில் கண்ணியமான நேரடி உரைநடையில் வடிவமைக்கப்பட்டது. மூலத்தின் சொல்லாட்சிக் கூர்மையும் சமாதானம்–பிரிவினை எதிர்மறையும் பாதுகாக்கப்பட்டுள்ளன.
