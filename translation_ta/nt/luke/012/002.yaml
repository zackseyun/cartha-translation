  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: ta
  text: ஆனால், மூடிவைக்கப்பட்டிருக்கிற எதுவும் வெளிப்படுத்தப்படாமல் போகாது[a][c]; மறைந்திருக்கும் எதுவும் அறியப்படாமல் போகாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூடிவைக்கப்பட்டிருக்கிற’ என்பதற்கு ‘மறைத்து வைக்கப்பட்டிருக்கிற’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ஒன்றை மூடி வைத்திருந்து பின்னர் வெளிப்படுத்தும் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மறைந்திருக்கும்’ என்பதற்கு ‘இரகசியமான’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்தக் கூற்று, இக்காலத்திலோ இறுதித் தீர்ப்பிலோ நிகழும் வெளிப்பாட்டைக் பொதுவாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: எதுவும் ... இருக்காது
  rationale: முழுமையான மறுப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘ஒன்றுகூட இல்லை’ என்ற முழு வரம்பும் காக்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கையோடு தொடர்ச்சியையும் மென்மையான முரண்பாட்டையும் குறிக்கிறது.
- source_word: συγκεκαλυμμένον
  choice: மூடி வைக்கப்பட்டிருப்பவை
  rationale: மூடப்பட்டு தற்போது அந்த நிலையில் இருப்பதைச் சுட்டும் கிரேக்க நிறைவு-செயப்பாட்டு வடிவத்தையும், ‘மூடுதல்’ என்ற உருவகத்தையும் காக்கிறது.
- source_word: ἀποκαλυφθήσεται
  choice: வெளிப்படுத்தப்படாதது ... இருக்காது
  rationale: எதிர்கால செயப்பாட்டு அர்த்தத்தைத் தமிழ் எதிர்கால மறுப்பு அமைப்பின் வழியாக இயல்பாகத் தருகிறது; மூடப்பட்டதற்கு எதிரான வெளிப்படுத்துதல் என்ற இணையும் காக்கப்படுகிறது.
- source_word: κρυπτὸν
  choice: மறைவானவை
  rationale: ‘மறைந்தவை’ அல்லது ‘இரகசியமானவை’ என்ற பொருள் வரம்பை மிகையாகக் குறுக்காமல் பொதுவான மறைவு நிலையைக் குறிக்கிறது.
- source_word: γνωσθήσεται
  choice: அறியப்படாததும் ... இருக்காது
  rationale: எதிர்கால செயப்பாட்டு/விளைவு அர்த்தத்தைப் பேணி, இறுதியில் அறியப்படும் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: -ப்படாதது எதுவும் இருக்காது
  rationale: இரு இணையான தொடர்புச் சொற்றொடர்களின் ‘அவ்வாறு ஆகாமல் இருப்பது எதுவுமில்லை’ என்ற தர்க்க அமைப்பைத் தமிழில் தெளிவாக மீளுருவாக்குகிறது.
theological_decisions:
- issue: கூற்றின் காலமும் வரம்பும்
  choice: இப்போது மறைக்கப்பட்டிருப்பவை இறுதியில் வெளிப்படும் அல்லது அறியப்படும் என்ற பொதுக் கொள்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது இறுதித் தீர்ப்பில் நிகழும் வெளிப்பாட்டை மட்டும் குறிக்கலாம்; அல்லது இக்காலத்திலேயே மாய்மையின் முகத்திரை கிழிக்கப்படுவதைக் குறிப்பாகக் குறிக்கலாம்.
  rationale: கிரேக்க எதிர்கால செயப்பாட்டு வினைகள் வெளிப்பாடு நிகழும் என்பதைச் சொல்கின்றன; ஆனால் அது எப்போது நிகழும் என்பதை வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் திறந்த நிலையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இணையான இரு கிரேக்க உறுப்புகளும் தமிழில் சமச்சீராக வைக்கப்பட்டுள்ளன; எதிர்காலத் தன்மை ‘இருக்காது’ என்ற அமைப்பால் காக்கப்படுகிறது.
