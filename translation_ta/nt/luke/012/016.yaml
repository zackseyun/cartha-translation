translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கிரேக்க வாக்கிய அமைப்பு தமிழில் இயல்பாக மறுசீரமைக்கப்பட்டாலும், அதன் கதைத் தொடர்ச்சி, ஆண்பால் ஒருமைக் குறிப்பு, உடைமைத் தொடர்பு, நிலத்தின் மிகுந்த விளைச்சல் ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
