source:
  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: ta
  text: 'அப்போது அவர் அவர்களிடம் ஓர் உவமையைச் சொன்னார்: “செல்வந்தன் ஒருவனுடைய நிலம் மிகுதியாக விளைந்தது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏராளமான விளைச்சலைத் தந்தது” அல்லது “மிகவும் விளைச்சலுள்ளதாயிருந்தது.”
    reason: εὐφόρησεν என்பதன் ‘நன்றாக விளைதல்/மிகுந்த பலன் தருதல்’ என்ற பொருள் வரம்பைக் காட்டும் சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: அப்போது … சொன்னார்
  rationale: δέ என்பது இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் உரையின் அடுத்த நகர்வை இணைக்கிறது. தமிழில் இயல்பான கதைத் தொடர்ச்சிக்காக ‘அப்போது’ என்றும், παραβολή நேரடிச் செயப்படுபொருளாக இருப்பதால் ‘சொன்னார்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: παραβολὴν
  choice: ஓர் உவமையை
  rationale: παραβολή என்பதற்கான நற்செய்தி நூல்களின் வழக்கமான தமிழ்ச் சொல் ‘உவமை’; இது வெறும் எடுத்துக்காட்டு என்பதைக் காட்டிலும் அந்த இலக்கிய வடிவத்தைத் தக்கவைக்கிறது.
- source_word: πρὸς αὐτοὺς
  choice: அவர்களிடம்
  rationale: உவமை யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: λέγων
  choice: —
  rationale: உவமையின் உள்ளடக்கம் முக்காற்புள்ளிக்குப் பின் நேரடியாக வருவதால், கிரேக்கப் பங்கேற்பு வினையின் பணியைத் தமிழின் மேற்கோள் அமைப்பே நிறைவேற்றுகிறது; தனியே ‘என்று கூறி’ எனச் சேர்ப்பது தேவையற்ற மறுபதிப்பாக இருக்கும்.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: செல்வந்தன் ஒருவனுடைய
  rationale: τινός தரும் குறிப்பிடப்படாத ஒருமை உணர்வை ‘ஒருவன்’ தக்கவைக்கிறது; ஆண்பால் ஒருமை குறிப்பும் உடைமைத் தொடர்பும் பாதுகாக்கப்படுகின்றன.
- source_word: εὐφόρησεν
  choice: மிகுதியாக விளைந்தது
  rationale: εὐφορέω என்பது நிலம் நன்றாக அல்லது ஏராளமாக விளைச்சல் கொடுப்பதைக் குறிக்கிறது. ‘மிகுதியாக விளைந்தது’ சுருக்கமாகவும் இயல்பாகவும் வேளாண்மைச் சூழலை வெளிப்படுத்துகிறது.
- source_word: ἡ χώρα
  choice: நிலம்
  rationale: இங்கு χώρα என்பது ஒரு நாடையோ பிரதேசத்தையோ அல்ல, செல்வந்தனுக்குச் சொந்தமான பயிரிடும் நிலத்தைக் குறிக்கிறது.
