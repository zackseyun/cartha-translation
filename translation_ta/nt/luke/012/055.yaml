id: LUK.12.55
reference: Luke 12:55
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: ta
  text: தெற்குக் காற்று[a] வீசும்போது, ‘கடும் வெப்பம்[b] உண்டாகும்’ என்று சொல்கிறீர்கள்; அப்படியே நடக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘தெற்கு’—இங்கு தெற்கிலிருந்து வீசும் காற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘கொளுத்தும் வெப்பம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: தெற்குக் காற்று
  rationale: νότος என்பதற்கு ‘தெற்கு’ அல்லது ‘தெற்குக் காற்று’ என்று பொருள் கொள்ளலாம். πνέοντα (‘வீசும்’) என்பதுடன் வரும் வானிலைச் சூழலில், இயல்பான தமிழில் ‘தெற்குக் காற்று’ என்பது பொருளைத் தெளிவாகத் தருகிறது.
- source_word: πνέοντα
  choice: வீசும்போது
  rationale: நிகழ்ந்துகொண்டிருக்கும் காற்றின் இயக்கத்தை நிகழ்காலப் பங்கேற்புச் சொல் குறிக்கிறது; ὅταν உடன் சேர்ந்து தமிழில் ‘வீசும்போது’ என்பது வழக்கமான, இயல்பான வடிவம்.
- source_word: λέγετε
  choice: என்று சொல்கிறீர்கள்
  rationale: இது மக்களின் வழக்கமான, திரும்பத் திரும்ப நிகழும் வானிலை கணிப்பைக் குறிக்கும் பொதுநிகழ்காலம்; ‘சொல்கிறீர்கள்’ அதைப் பாதுகாக்கிறது.
- source_word: Καύσων
  choice: கடும் வெப்பம்
  rationale: இந்தச் சொல் சாதாரண வெப்பத்தைவிடத் தீவிரமான, தாங்கக் கடினமான வெப்பத்தைக் குறிக்கிறது. ‘கடும் வெப்பம்’ நவீன தமிழில் இயல்பாகவும் மிகைப்படுத்தாமலும் அந்தத் தீவிரத்தைத் தெரிவிக்கிறது.
- source_word: ἔσται
  choice: உண்டாகும்
  rationale: வரப்போகும் வானிலை நிலையைத் தமிழில் இயல்பாக முன்னறிவிக்கும் வடிவம் ‘உண்டாகும்’.
- source_word: γίνεται
  choice: அப்படியே நடக்கிறது
  rationale: முன்னறிவிக்கப்பட்டது நிகழ்வதை γίνεται குறிக்கிறது. ‘அப்படியே’ என்பது கூறிய கணிப்பு நிறைவேறுவதைக் காட்டுகிறது; ‘நடக்கிறது’ பொதுநிகழ்காலத் தன்மையைப் பாதுகாக்கிறது.
