id: LUK.12.4
reference: Luke 12:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: ta
  text: 'ஆனால், என் நண்பர்களே, உங்களுக்குச் சொல்கிறேன்: உடலைக் கொன்றுவிட்டு, அதற்குப் பிறகு வேறு எதையும் செய்ய இயலாதவர்களுக்குப் பயப்படாதீர்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: ஆனால் ... உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்கு இயேசுவின் உரையில் மென்மையான மாற்றத்தைக் குறிக்கிறது. ‘ஆனால்’ அந்த மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது; Λέγω ὑμῖν என்பதற்கு ‘உங்களுக்குச் சொல்கிறேன்’ நேரான இணையாக உள்ளது.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: என் நண்பர்களே, உங்களுக்கு
  rationale: τοῖς φίλοις μου என்பது ὑμῖν என்பதைக் கூடுதலாக விளக்கும் அழைப்புமுறை. இயல்பான தமிழுக்காக ‘என் நண்பர்களே’ என்று அழைத்துப் பின்னர் ‘உங்களுக்கு’ என அமைக்கப்பட்டுள்ளது; அன்பான உறவுக் குறிப்பும் இரண்டாம் நபர் குறிப்பும் தக்கவைக்கப்படுகின்றன.
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: கொல்கிறவர்களுக்குப் பயப்படாதீர்கள்
  rationale: μή உடன் வரும் வினை இங்கு தடையுத்தரவாக உள்ளது. ἀπό என்பது φοβέομαι உடன் பயத்தின் இலக்கைக் குறிக்கிறது; தமிழில் அது இயல்பாக ‘-க்குப் பயப்படாதீர்கள்’ என வருகிறது.
- source_word: τὸ σῶμα
  choice: உடலை
  rationale: σῶμα இங்கு மனிதரின் உடல் சார்ந்த உயிரைக் குறிக்கிறது. அடுத்த வசனத்தின் கருத்தை முன்கூட்டியே சேர்க்காமல் எளிய ‘உடல்’ என்பதே பொருத்தமானது.
- source_word: καὶ μετὰ ταῦτα
  choice: அதற்குப் பிறகு
  rationale: இந்தச் சொற்றொடர் உடலைக் கொல்வதற்குப் பிந்தைய காலவரிசையைக் குறிக்கிறது. ‘அதற்குப் பிறகு’ என்பது நவீன தமிழில் தெளிவான காலக்குறிப்பு.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: அதற்கு மேல் எதுவும் செய்ய இயலாதவர்கள்
  rationale: περισσότερόν τι என்பது ‘மேலும்/அதற்கு மேல் எதுவும்’ என்ற வரம்பைக் குறிக்கிறது. ‘செய்ய இயலாதவர்கள்’ மனிதக் கொலையாளிகளின் அதிகாரம் உடல் மரணத்துக்கு அப்பால் செல்லாது என்பதை, மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடல் மரணத்திற்குப் பிறகு மனித அதிகாரத்தின் எல்லை
  choice: மனிதர்கள் உடலைக் கொல்ல முடியும்; அதற்குப் பிறகு அதற்கு மேல் எதுவும் செய்ய இயலாது என்று மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அவர்கள் ஆன்மாவைக் கொல்ல முடியாது என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: இந்த வசனம் ‘ஆன்மா’ என்று குறிப்பிடவில்லை. அடுத்த வசனத்தில் வரும் இறையதிகார ஒப்பீட்டை இவ்வசனத்துக்குள் கொண்டு வராமல், மூலத்தின் சொற்களையும் அதன் உள்ளார்ந்த இறையியல் அழுத்தத்தையும் அப்படியே தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் இயல்பான பேச்சோட்டமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் நண்பர்களே’ என்பது அன்பான நேரடி அழைப்பைத் தக்கவைக்கிறது; தேவையற்ற சமய மரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
