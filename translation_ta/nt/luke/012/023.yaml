base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: ta
  text: ஏனெனில் உயிர்[a] உணவைவிட மேலானது; உடல் உடையைவிட மேலானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாழ்வு’ அல்லது ‘ஆத்துமா.’ கிரேக்கச் சொல் ψυχή, ‘உயிர்,’ ‘வாழ்வு,’ ‘தன் நபர்,’ அல்லது ‘ஆத்துமா’ எனப் பொருள்படலாம்; இங்கு சூழல் ‘உயிர்’ அல்லது ‘வாழ்வு’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψυχή
  choice: உயிர்
  rationale: உணவு, கவலை, உடல் தேவைகள் ஆகியவற்றைப் பற்றிய சூழலில் இது உடலற்ற ஆத்துமாவை மட்டும் குறிக்காமல் ஒருவரின் உயிர் அல்லது வாழ்வைக் குறிக்கிறது. ‘உயிர்’ சுருக்கமாகவும் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: πλεῖόν
  choice: மேலானது
  rationale: உணவு மற்றும் உடையைவிட உயிரும் உடலும் அதிக மதிப்புடையவை என்ற ஒப்பீட்டைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் அளவுசார் ‘அதிகம்’ என்று கூறுவதைவிட தமிழில் இயல்பாக உள்ளது.
- source_word: τροφή
  choice: உணவு
  rationale: இச்சூழலில் பொதுவான, தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: σῶμα
  choice: உடல்
  rationale: உடையுடன் இணைத்துக் கூறப்படும் மனித உடலை நேரடியாகக் குறிக்கிறது.
- source_word: ἔνδυμα
  choice: உடை
  rationale: உடலை மூடும் ஆடையைப் பொதுவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: கவலை மற்றும் இறைபராமரிப்பு பற்றிய போதனையில் ψυχή என்பதன் பொருள்
  choice: ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஆத்துமா’ அல்லது ‘வாழ்வு’
  rationale: உணவுடன் ψυχή-யையும் உடையுடன் உடலையும் இணைத்து ஒப்பிடும் அமைப்பு, இவ்வுலக வாழ்வையும் உடல் இருப்பையும் சுட்டுகிறது. ‘உயிர்’ என்பது இச்சூழலைக் காக்கிறது; அதேவேளையில் ψυχή என்ற சொல்லின் பரந்த பொருள் வரம்பை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் இரு இணையான ஒப்பீடுகளும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளன.
