source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: ta
  text: 'பின்பு அவர் தமது சீடர்களிடம் கூறினார்: “இதன் காரணமாக நான் உங்களுக்குச் சொல்கிறேன்: என்ன சாப்பிடுவீர்கள் என்று உங்கள் வாழ்வைப் பற்றி கவலைப்படாதீர்கள்[a]; என்ன உடுத்துவீர்கள் என்று உங்கள் உடலைப் பற்றியும் கவலைப்படாதீர்கள்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பதற்றமடையாதீர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள் வாழ்வு’ என்பதற்கான கிரேக்கச் சொல் ‘உயிர்’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது ஒருவரின் இவ்வுலக வாழ்வைக் குறிக்கிறது; தனியாக ‘ஆன்மா’ என்பதைக் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: பின்பு அவர் ... சொன்னார்
  rationale: δέ ஒரு மென்மையான தொடரிணைப்பு; இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் உரையாடலின் முன்னேற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: தமது சீடர்களிடம்
  rationale: μαθηταί என்பதற்கு வழக்கமான ‘சீடர்கள்’ பயன்படுத்தப்பட்டுள்ளது; αὐτοῦ என்ற உடைமைச் சுட்டும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: Διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய போதனையை நோக்கிப் பின்னோக்கிச் சுட்டி, அதிலிருந்து வரும் முடிவை வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையையும் பன்மை முன்னிலையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: μὴ μεριμνᾶτε
  choice: கவலைப்படாதீர்கள்
  rationale: μεριμνάω இங்கு மனத்தை ஆட்கொள்ளும் கவலை அல்லது பதற்றத்தைக் குறிக்கிறது; ‘கவலைப்படாதீர்கள்’ தெளிவான பொதுநடைத் தமிழ்.
- source_word: τῇ ψυχῇ
  choice: உங்கள் உயிரைப் பற்றி
  rationale: இச்சூழலில் ψυχή, உணவால் பேணப்படும் இவ்வுலக வாழ்க்கை அல்லது உயிரைக் குறிக்கிறது; தனியாகக் கருதப்படும் ‘ஆன்மா’ என்ற இறையியல் பொருளைத் திணிக்கவில்லை.
- source_word: τί φάγητε
  choice: என்ன சாப்பிடுவது என்று
  rationale: எதிர்காலத் தேவையைப் பற்றிய மறைமுகக் கேள்வியை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μηδὲ τῷ σώματι
  choice: உங்கள் உடலைப் பற்றியும் ... கவலைப்படாதீர்கள்
  rationale: μηδέ இணைக்கும் இரண்டாவது கவலைப் பொருளை முதல் கூறுடன் இணையான அமைப்பில் தருகிறது.
- source_word: τί ἐνδύσησθε
  choice: என்ன உடுத்துவது என்று
  rationale: ஆடை அணிவதைச் சுட்டும் நடுத்தர வினையின் பொருளை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: இச்சூழலில் ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆன்மா
  rationale: ψυχήக்கு உணவும் σώμαக்கு உடையும் என வசனம் அமைக்கும் இணைநிலை, இங்கு சாதாரண மனித உயிர்வாழ்வையே முன்னிறுத்துகிறது. ‘ஆன்மா’ என்று மொழிபெயர்ப்பது வசனம் அவசியப்படுத்தாத உடல்–ஆன்மா பிரிவை இறையியல் ரீதியாக முன்வைக்கக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் உரைநடைக் கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் ‘உயிர்/உணவு’ மற்றும் ‘உடல்/உடை’ இணை அமைப்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது. ஆலோசனை ஆங்கில உரையில் அடிக்குறிப்பு குறியீடுகள் பொருந்தாத இடங்களில் இருந்ததால், அவை அவற்றுக்குரிய சொற்களோடு பொருந்துமாறு தமிழில் இடமாற்றப்பட்டுள்ளன.
