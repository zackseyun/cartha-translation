id: LUK.12.27
reference: Luke 12:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: ta
  text: 'லில்லி மலர்களை[a] எவ்வாறு வளர்கின்றன என்பதைக் கவனியுங்கள். அவை உழைப்பதுமில்லை, நூல் நூற்பதுமில்லை. ஆனாலும் நான் உங்களுக்குச் சொல்கிறேன்: சாலொமோன்கூட தனது எல்லா மகிமையிலும்[b] இவற்றில் ஒன்றைப்போல உடை அணிந்திருக்கவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காட்டுப் பூக்கள்’ அல்லது ‘மலர்கள்’; கிரேக்கத்தில் குறிப்பாக ‘லில்லிகள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தனது எல்லா மாட்சிமையிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: கவனித்துப் பாருங்கள்
  rationale: வெறுமனே பார்ப்பதை அல்ல, உற்றுக் கவனித்துச் சிந்திப்பதை வலியுறுத்தும் இறந்தகாலக் கட்டளை வடிவத்தின் ஆற்றலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τὰ κρίνα
  choice: அல்லி மலர்கள்
  rationale: கிரேக்கச் சொல்லின் குறிப்பான மலர்ப் பெயரைப் பொதுவாக ‘மலர்கள்’ என்று மாற்றாமல் தக்கவைக்கிறது; தாவரவியல் அடையாளத்தின் நடைமுறைச் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: πῶς αὐξάνει
  choice: எவ்வாறு வளர்கின்றன
  rationale: கிரேக்கத்தில் நடுநிலைப் பன்மை எழுவாயுடன் ஒருமை வினை வந்தாலும், தமிழில் இயல்பான பன்மை இயைபும் ‘எவ்வாறு’ என்ற முறை சார்ந்த பொருளும் தக்கவைக்கப்படுகின்றன.
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: அவை உழைப்பதுமில்லை, நூல் நூற்பதுமில்லை
  rationale: κοπιάω என்பதன் கடின உழைப்பையும் νήθω என்பதன் நூல் நூற்கும் செயற்பாட்டையும் தெளிவாகவும் இணையான அமைப்பிலும் வெளிப்படுத்துகிறது.
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனாலும் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δὲ குறிக்கும் மென்மையான முரண்பாட்டையும் அடுத்து வரும் வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: தன் மகிமை அனைத்திலும்
  rationale: அரசருக்குரிய ஒளிமிகு மேன்மை என்ற சூழற்பொருளைத் தருவதோடு, δόξα என்பதன் விரிவான வேதாகமச் சொற்பொருள் ஒலியையும் ‘மகிமை’ தக்கவைக்கிறது.
- source_word: περιεβάλετο
  choice: உடை அணிந்திருக்கவில்லை
  rationale: கிரேக்க நடு/செயப்பாட்டு வடிவத்தின் செய்பவரை அளவுக்கு மீறிக் குறிப்பிடாமல், ஆடை உடுத்திய நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὡς ἓν τούτων
  choice: இவற்றில் ஒன்றைப்போல
  rationale: முன்னர் கூறப்பட்ட மலர்களில் ஒன்றுடன் செய்யப்படும் நேரடியான ஒப்பீட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மலர் உருவகத்தின் குறிப்பு
  choice: குறிப்பான ‘அல்லி மலர்கள்’ என்ற வாசகம் தக்கவைக்கப்பட்டது.
  alternative: மலர்கள்; காட்டுப் பூக்கள்
  rationale: மூல கிரேக்கம் κρίνα என்ற குறிப்பான சொல்லைப் பயன்படுத்துகிறது. பொதுமைப்படுத்த வேண்டிய இறையியல் அவசியம் இல்லாததால் மூலத்தின் குறிப்புத்தன்மை பாதுகாக்கப்படுகிறது; சொல்லின் அடையாள வரம்பு அடிக்குறிப்பில் கூறப்படுகிறது.
- issue: சாலொமோனின் δόξα என்பதன் மொழிபெயர்ப்பு
  choice: மகிமை
  alternative: மாட்சிமை; ஆடம்பரச் சிறப்பு
  rationale: இச்சூழலில் அரசருக்குரிய மாட்சிமை முதன்மையாக இருந்தாலும், ‘மகிமை’ வாசிக்க இயல்பாக இருந்து மூலச்சொல்லின் விரிவான பொருள் ஒலியையும் பாதுகாக்கிறது.
- issue: περιεβάλετο வடிவத்தில் செய்பவர் குறித்த தெளிவின்மை
  choice: உடை அணிந்திருக்கவில்லை
  alternative: உடுத்திக்கொள்ளவில்லை; உடுத்தப்பட்டிருக்கவில்லை
  rationale: நடு அல்லது செயப்பாட்டுப் பொருளைத் தமிழில் வற்புறுத்தித் தீர்மானிக்காமல், சாலொமோன் அணிந்திருந்த ஆடையின் நிலையை மையப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நூல் நூற்பது’ ஆடை உருவாக்கும் பணியுடனான தொடர்பைத் தெளிவாக்குகிறது. [b] குறி அது விளக்கும் ‘மகிமை அனைத்திலும்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
