id: LUK.12.43
reference: Luke 12:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: ta
  text: தன் எஜமான்[a] வந்து பார்க்கும்போது இவ்வாறு செய்துகொண்டிருக்கும் அந்தப் பணியாளர் பேறுபெற்றவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் ஆண்டவர் வந்து பார்க்கும்போது இவ்வாறு செய்துகொண்டிருக்கும் அந்தப் பணியாளர் பேறுபெற்றவர்.” கிரேக்கச் சொல், இந்த இல்லத்து உவமையில் “எஜமான்” என்றும், விரிவான பயன்பாட்டில் “ஆண்டவர்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: வெறும் மனநிலையான ‘மகிழ்ச்சி’ என்பதைக் காட்டிலும், கடவுளின் அங்கீகாரத்தையும் நல்வாய்ப்பையும் உள்ளடக்கும் வாழ்த்துரையின் வலிமையை இது இயல்பாகத் தருகிறது.
- source_word: δοῦλος
  choice: பணியாளர்
  rationale: இச்சொல் அடிமையையோ பணியாளரையோ குறிக்கலாம். இங்கு இல்ல நிர்வாக உவமையில் எஜமானுக்குக் கீழ்ப்பட்டு பொறுப்பை நிறைவேற்றும் நிலையே முன்னிலையில் இருப்பதால், நவீனத் தமிழில் இயல்பான ‘பணியாளர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையின் நேரடிப் பொருளில் இது வீட்டு எஜமானைக் குறிக்கிறது. அதேவேளையில் ஆண்டவராகிய இயேசுவின் வருகையைக் குறிக்கும் விரிவான ஒலிப்பும் இருக்கக்கூடும்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐλθὼν … εὑρήσει
  choice: வந்து பார்க்கும்போது
  rationale: கிரேக்கத்தில் வருகைக்குப் பின் கண்டறிதல் என்ற நிகழ்வுவரிசையை, தமிழில் இயல்பான காலத் தொடராக இது வெளிப்படுத்துகிறது.
- source_word: ποιοῦντα οὕτως
  choice: இவ்வாறு செய்துகொண்டிருக்கும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலைப் பின்னோக்கிச் சுட்டுவதையும், எஜமான் வரும்போது அது தொடர்ந்து நடைபெறுவதையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐκεῖνος
  choice: அந்த
  rationale: குறிப்பிட்ட பணியாளரை வலியுறுத்தும் கிரேக்கச் சுட்டுப்பெயரின் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: κύριος என்ற சொல்லின் இல்லத்து எஜமான் / ஆண்டவர் என்ற இரட்டை ஒலிப்பு
  choice: முதன்மை உரையில் ‘எஜமான்’
  alternative: ‘ஆண்டவர்’
  rationale: உவமையின் மேற்பரப்புச் சூழலில் பணியாளரின் இல்லத்து அதிகாரியே நேரடியாகக் குறிக்கப்படுகிறார். ஆனால் ஆண்டவரின் வருகையைப் பற்றிய விரிவான பயன்பாட்டைத் தீர்த்துவிடாமல், மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘வந்து பார்க்கும்போது’ என்பது சொற்சொல்லான அமைப்பைத் தவிர்த்து ἐλθὼν … εὑρήσει என்பதன் நிகழ்வுவரிசையை இயல்பாக வழங்குகிறது.
