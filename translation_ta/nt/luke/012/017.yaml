id: LUK.12.17
reference: Luke 12:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: ta
  text: 'அவன் தனக்குள் இவ்வாறு யோசித்துக்கொண்டிருந்தான்: ‘நான் என்ன செய்வேன்? என் விளைச்சலைச் சேர்த்து வைக்க எனக்கு இடம் இல்லையே!’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: யோசித்துக்கொண்டே
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த உள்ளார்ந்த ஆலோசனையைக் குறிக்கிறது; ‘யோசித்துக்கொண்டே’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἑαυτῷ
  choice: தனக்குள்
  rationale: இது வெளிப்படையாகப் பேசியதல்ல, மனத்திற்குள் நடந்த ஆலோசனை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: λέγων
  choice: என்றான்
  rationale: உள்ளார்ந்த உரையின் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; ‘தனக்குள்’ என்பதால் இது மனத்திற்குள் சொல்லப்பட்டது என்பது தெளிவு.
- source_word: Τί ποιήσω
  choice: நான் என்ன செய்வேன்?
  rationale: ஆலோசனைக்குரிய aorist subjunctive கேள்வியின் தீர்மானமின்மையை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: …இல்லையே
  rationale: கேள்விக்கான காரணத்தைத் தனி காரண வாக்கியமாக மொழிபெயர்க்காமல், தமிழின் இயல்பான காரண-உணர்வு கொண்ட ‘இல்லையே’ வடிவில் தருகிறது.
- source_word: οὐκ ἔχω ποῦ
  choice: எனக்கு இடமில்லையே
  rationale: ‘எங்கே/எதில் வைப்பது எனக்கு இல்லை’ என்ற கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: συνάξω
  choice: சேர்த்துவைக்க
  rationale: ‘ஒன்றுசேர்த்தல்’ என்ற அடிப்படைப் பொருளையும், அறுவடை விளைச்சலைக் களஞ்சியத்தில் வைக்கும் சூழலையும் ஒருங்கே உணர்த்துகிறது.
- source_word: τοὺς καρπούς μου
  choice: என் விளைச்சலை
  rationale: வேளாண் சூழலில் καρποί என்பது பழங்களை மட்டும் அல்ல, நிலத்தின் மொத்த விளைபொருளைக் குறிக்கிறது; ‘விளைச்சல்’ தெளிவும் இயல்பும் உடையது.
