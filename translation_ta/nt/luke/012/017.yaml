translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளை கண்ணியமான நடை. உள்ளார்ந்த ஆலோசனையும், இடமின்மையைச் சுட்டும் காரணத் தொடர்பும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
