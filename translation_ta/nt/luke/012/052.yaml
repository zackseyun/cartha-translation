id: LUK.12.52
reference: Luke 12:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: ta
  text: ஏனெனில், இப்போதுமுதல் ஒரே வீட்டில்[a] ஐந்து பேர் பிரிந்திருப்பார்கள்—மூவர் இருவருக்கு எதிராகவும், இருவர் மூவருக்கு எதிராகவும் இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே குடும்பத்தில்.” கிரேக்கச் சொல் வீட்டுக் கட்டடத்தையோ அதில் வாழும் குடும்ப அலகையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: இருப்பார்கள்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; மனிதர்களைக் குறிப்பதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றில் கூறப்பட்ட பிரிவை இவ்வசனம் விளக்குவதால், காரணவிளக்கத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀπὸ τοῦ νῦν
  choice: இப்போதுமுதல்
  rationale: இப்பொழுதிலிருந்து தொடரும் காலநிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: πέντε
  choice: ஐந்து பேர்
  rationale: இங்கு எண்ணப்படுவது ஒரு வீட்டைச் சேர்ந்த மனிதர்கள் என்பதைக் தமிழின் இயல்பான ஆளெண்ணுச் சொல்லால் காட்டுகிறது.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: ஒரே வீட்டில்
  rationale: οἶκος என்பதன் நேரடியான பொருளான ‘வீடு’ என்பதை முதன்மை உரையில் பாதுகாக்கிறது; குடும்ப அலகு என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διαμεμερισμένοι
  choice: பிரிந்திருப்பார்கள்
  rationale: διαμερίζω என்பதன் நிறைவுற்ற செயப்பாட்டு எச்சம் குறிக்கும், பிரிவினால் ஏற்பட்டுத் தொடரும் நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: மூவர் இருவருக்கு எதிராக
  rationale: ἐπί இங்கு குறிக்கும் எதிர்ப்புற உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: இருவர் மூவருக்கு எதிராக
  rationale: முந்தைய சொற்றொடரின் இணை அமைப்பையும் பரஸ்பர எதிர்ப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: οἶκος என்பதை ‘வீடு’ என்று நேரடியாக மொழிபெயர்ப்பதா, ‘குடும்பம்’ என்று பொருள்விளக்கமாக மொழிபெயர்ப்பதா
  choice: ஒரே வீட்டில்
  alternative: ஒரே குடும்பத்தில்
  rationale: அடுத்த வசனத்தின் குடும்ப உறவுகள் இங்கு குடும்ப அலகே கருத்தில் இருப்பதைச் சுட்டினாலும், கிரேக்கச் சொல் உடலமைப்பான வீட்டையும் குடும்பத்தையும் குறிக்க முடியும். ஆகவே முதன்மை உரையில் நேரடி வடிவம் வைக்கப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூவர்/இருவர்’ என்ற வடிவங்கள் மனிதர்களைக் குறிக்கும் சுருக்கமான இலக்கியப் பொதுநடையாக உள்ளன; வாக்கியத்தின் இரு எதிரெதிர் அணிகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
