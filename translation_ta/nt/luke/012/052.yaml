  terminology: ‘ஒரே வீட்டில்’ retains the concrete primary sense of οἶκος, while the footnote supplies ‘குடும்பத்தில்’ as the contextual alternative. ‘பிரிந்திருப்பார்கள்’ and ‘எதிராக’ convey the relational division and adversative force without importing doctrinal interpretation.
