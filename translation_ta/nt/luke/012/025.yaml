  source_fidelity: மூலத்தின் வினா அமைப்பும், μεριμνῶν (‘கவலைப்படுவதால்’), δύναται (‘முடியும்’), πῆχυν (‘ஒரு முழம்’) ஆகியவற்றின் பொருளும் நன்றாக வெளிப்படுகின்றன. ஆனால் ἐπὶ τὴν ἡλικίαν αὐτοῦ என்பது ‘தன் வாழ்நாளுக்கு/உயரத்துக்கு’ என்று சேர்க்கப்படும் இலக்கைக் குறிக்கிறது; ‘தன் வாழ்நாளில்’ என்பது தமிழில் வேறுபட்ட இடப்பொருளைத் தருகிறது.
  naturalness: ‘தன் வாழ்நாளுக்கு ஒரு முழம் சேர்க்க’ என்பது நவீனத் தமிழில் இயல்பாகவும், மூலத்தின் ‘add to’ அமைப்புக்கு நேர்மையாகவும் உள்ளது. கேள்விக்குறிக்கு முன் அடிக்குறிப்பு குறியை வைத்திருப்பது வழக்கமான அமைப்பாகும்.
  terminology: ‘முழம்’ πῆχυς என்பதற்கு சரியான பாரம்பரிய அளவுச்சொல். ἡλικία என்பதற்கான ‘வாழ்நாள்’ என்ற சூழல்சார் தெரிவு ஏற்கத்தக்கது; ‘உயரம்’ என்ற மாற்றுப்பொருளை அடிக்குறிப்பு சரியாகப் பாதுகாக்கிறது.
