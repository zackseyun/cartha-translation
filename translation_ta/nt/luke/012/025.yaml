    rationale: கிரேக்க ἐπὶ + accusative இங்கு ஒருவன் சேர்க்க முயல்கிற பொருளின் இலக்கைக் குறிக்கிறது. ‘வாழ்நாளில்’ என்பது ‘during/in one’s lifetime’ என்ற தமிழ்ப் பொருளை உருவாக்கி, προσθεῖναι (‘சேர்க்க’) வினையுடன் பொருத்தம் குறைகிறது.
