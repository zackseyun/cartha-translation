translation:
  language: ta
  text: உங்களில் யார் கவலைப்படுவதால் தன் வாழ்நாளுக்கு ஒரு முழம் சேர்க்க முடியும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாழ்நாள்” என்பதற்கான கிரேக்கச் சொல் “உயரம்” அல்லது “உடல்வளர்ச்சி” என்றும் பொருள்படலாம். எனவே, “தன் உயரத்துக்கு ஒரு முழம் சேர்க்க முடியும்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: ἡλικία என்ற சொல்லின் சொற்பொருள் இருமையையும், வசனத்துக்கான பழமையான இரு முக்கியப் புரிதல்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: μεριμνῶν
  choice: கவலைப்படுவதால்
  rationale: இங்கு நிகழ்கால வினையெச்சம் கவலைப்படுதல் வழியாக அல்லது அதனால் என்ற பொருளைத் தருகிறது; நவீனத் தமிழில் இயல்பாகவும் காரணத் தொடர்பைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡλικίαν
  choice: வாழ்நாளில்
  rationale: இந்தச் சூழலில் மனிதன் கவலையால் தன் வாழ்நாளை நீட்டிக்க முடியாது என்பதே முதன்மையான பொருள். இருப்பினும் இச்சொல்லுக்கு ‘உயரம்/உடல்வளர்ச்சி’ என்ற பொருளும் இருக்கக்கூடும்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πῆχυν
  choice: ஒரு முழம்
  rationale: πῆχυς என்பது முழங்கை முதல் விரல் நுனிவரை அளக்கப்படும் பழங்கால நீள அளவான ‘முழம்’; வாழ்நாளுடன் பயன்படுத்தப்படுவது மூலத்தின் உருவகத் தாக்கத்தைப் பாதுகாக்கிறது.
- source_word: προσθεῖναι
  choice: கூட்ட
  rationale: ‘சேர்த்தல்/கூட்டுதல்’ என்ற மூல வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘நீட்டிக்க’ என்று பொருளை மட்டும் வெளிப்படுத்துவதைவிட மூல உருவகத்துக்கு நெருக்கமானது.
- source_word: δύναται
  choice: முடியும்
  rationale: திறன் அல்லது இயலுமையைக் குறிக்கும் δύναται என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: ἡλικία என்பதன் பொருள்—வாழ்நாளா அல்லது உயரமா
  choice: முதன்மை உரையில் ‘வாழ்நாள்’
  alternative: ‘உயரம்’ அல்லது ‘உடல்வளர்ச்சி’
  rationale: கவலை மற்றும் வாழ்வாதாரம் பற்றிய உடனடி சூழலும், அடுத்த வசனத்தில் இது மிகச் சிறிய காரியம் எனக் குறிப்பிடப்படுவதும் வாழ்நாள் என்ற வாசிப்பை ஆதரிக்கின்றன. ஆனாலும் கிரேக்கச் சொல்லின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: மொழிநடை நவீனமும் மரியாதைமிக்கதும் பொதுவாசகருக்கு எளிதில் புரியத்தக்கதுமாக உள்ளது. ‘ஒரு முழம்’ என்ற பழங்கால அளவைத் தக்கவைத்து, மூலத்தில் வாழ்நாளுக்கும் நீள அளவுக்கும் இடையே உள்ள உருவகத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
