id: LUK.12.19
reference: Luke 12:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: ta
  text: “நான் என் ஆன்மாவிடம், ‘ஆன்மாவே, பல ஆண்டுகளுக்குப் போதுமான ஏராளமான நல்ல பொருட்கள் உனக்குச் சேமித்து வைக்கப்பட்டுள்ளன. ஓய்வெடு, சாப்பிடு, குடி, மகிழ்ந்திரு[b]’ என்று சொல்வேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது “களித்திரு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: சொல்வேன்
  rationale: λέγω என்பதன் எதிர்கால வினைவடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ψυχῇ / Ψυχή
  choice: ஆன்மாவிடம் / ஆன்மாவே
  rationale: ஒருவன் தன் உள்ளார்ந்த தன்மையையே நேரடியாக அழைத்துப் பேசும் சொல்லாட்சியைப் பாதுகாக்கிறது; ψυχή என்ற சொல்லின் இலக்கிய மற்றும் இறையியல் ஒலியையும் முற்றிலும் தட்டையாக்காமல் வைத்திருக்கிறது.
- source_word: πολλὰ ἀγαθὰ
  choice: ஏராளமான நல்ல பொருட்கள்
  rationale: சூழலில் பொருளாதாரச் செல்வங்களைக் குறித்தாலும், ἀγαθὰ என்பதன் பரந்த பொருளைச் சுருக்காமல் தருகிறது.
- source_word: κείμενα
  choice: சேமித்து வைக்கப்பட்டுள்ளன
  rationale: பிற்காலப் பயன்பாட்டிற்காக வைத்திருக்கும் பொருட்கள் என்ற சூழல்சார் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς ἔτη πολλά
  choice: பல ஆண்டுகளுக்குப் போதுமான
  rationale: அந்தச் சேமிப்பு வரவிருக்கும் பல ஆண்டுகளுக்குப் பயன்படும் என்ற காலநீட்சி கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἀναπαύου
  choice: ஓய்வெடு
  rationale: இளைப்பாறி சுகமாக இருக்கும்படி கூறும் கட்டளையைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: φάγε
  choice: சாப்பிடு
  rationale: நவீன பொதுத் தமிழில் இயல்பான நேரடிக் கட்டளை.
- source_word: πίε
  choice: குடி
  rationale: மூலத்தின் எளிய கட்டளையை நேரடியாகத் தருகிறது.
- source_word: εὐφραίνου
  choice: மகிழ்ந்திரு
  rationale: மகிழ்ச்சியுடன் களித்திருக்கும் பொருளைத் தருகிறது; சூழலைவிட அதிகமான ஒழுக்க அல்லது சமய நேர்மறைப் பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: உவமையில் ஒருவர் தன்னையே அழைத்துப் பேசும் இடத்தில் ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: ஆன்மா
  alternative: உயிர்; உள்ளம்; தான்
  rationale: இவ்வசனம் மனித இயல்பின் கூறுகளை வரையறுக்கும் தொழில்நுட்பக் கூற்றல்ல. இருந்தாலும், ‘ஆன்மா’ என்பது மூலச்சொல்லின் பாரம்பரிய மற்றும் இலக்கிய ஒலியைப் பாதுகாத்து, தன்னையே அழைத்துப் பேசும் சொல்லாட்சியையும் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நேரடி உரை. ‘சாப்பிடு’ என்பது ‘உண்பாயாக’ என்பதைக் காட்டிலும் இயல்பான நவீனப் பயன்பாடு; வாக்கியத்தின் சுய உரையாடல் தொனி பாதுகாக்கப்பட்டுள்ளது.
