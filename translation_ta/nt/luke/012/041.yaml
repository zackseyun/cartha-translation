  source_fidelity: மூல கிரேக்கத்தின் உரையாடல் தொடர் (δέ), பேதுருவின் அறிக்கைவினை (Εἶπεν), மரியாதைமிக்க அழைப்பு (Κύριε), ‘எங்களுக்கா ... அனைவருக்குமா’ என்ற எதிர்மறை-தேர்வு அமைப்பு, மற்றும் நிகழ்கால நேரடிக் கேள்வி அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘எல்லாருக்கும்’ என்பது πάντας என்பதன் இங்கு உள்ள பொதுப்பொருளைச் சரியாகத் தருகிறது.
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. ‘எங்களுக்குச் சொல்கிறீரா, அல்லது எல்லாருக்கும் சொல்கிறீரா?’ என்ற இணை அமைப்பு கேள்வியின் வலிமையையும் தெளிவையும் நன்றாக வெளிப்படுத்துகிறது.
  terminology: ‘பேதுரு,’ ‘ஆண்டவரே,’ மற்றும் ‘உவமை’ ஆகியவை நிலையான வேதாகமப் பயன்பாட்டுக்கும் நவீன வாசிப்பு இயல்புக்கும் ஏற்றவை. ‘ஆண்டவரே’ என்பது Κύριε என்பதற்கான பொருத்தமான மொழிபெயர்ப்பு; இவ்வசனத்தின் அளவை மீறிய கோட்பாட்டுப் பொருளைத் திணிப்பதில்லை.
