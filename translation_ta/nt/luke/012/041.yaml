id: LUK.12.41
reference: Luke 12:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: ta
  text: அப்போது பேதுரு, “ஆண்டவரே, இந்த உவமையை எங்களுக்குச் சொல்கிறீரா, அல்லது எல்லாருக்கும் சொல்கிறீரா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: என்றார்
  rationale: λέγω என்பதன் இறந்தகால வடிவை, கேள்வி மேற்கோளை இயல்பாக முடிக்கும் ‘என்றார்’ என மொழிபெயர்ப்பது தமிழில் இயல்பாகவும் மூலத்தின் பொதுவான ‘சொன்னார்’ என்ற அறிக்கைவினையைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: δὲ
  choice: அப்போது
  rationale: δέ இங்கு உரையாடலின் தொடர்ச்சியைக் குறிக்கிறது; ‘அப்போது’ நவீன தமிழில் இயல்பான கதைத் தொடுப்பை வழங்குகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதற்கு ‘ஆண்டவரே’ மரியாதையையும் சாத்தியமான கிறிஸ்தியல் ஒலிப்பையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: πρὸς ἡμᾶς
  choice: எங்களுக்கு
  rationale: λέγεις உடன் வரும் πρός பேச்சு யாரை நோக்கியது என்பதைக் குறிக்கிறது; தமிழில் ‘எங்களுக்குச் சொல்கிறீரா’ என்பது இயல்பான சமமான வெளிப்பாடு.
- source_word: τὴν παραβολὴν ταύτην
  choice: இந்த உவமையை
  rationale: சினாப்டிக் நற்செய்திகளில் παραβολή என்பதற்கான நிலையான, இயல்பான தமிழ் சொல் ‘உவமை’.
- source_word: λέγεις
  choice: சொல்கிறீரா
  rationale: நிகழ்கால வினை வடிவையும் பேதுருவின் நேரடிக் கேள்வியையும் இயல்பான மரியாதைப் பன்மையுடன் வெளிப்படுத்துகிறது.
- source_word: ἢ καὶ
  choice: அல்லது ... -உம்
  rationale: ἤ-யின் மாற்றுத் தேர்வையும் καί-யின் சேர்க்கைப் பொருளையும் ‘அல்லது எல்லாருக்கும்’ என்ற தமிழ் அமைப்பு இயல்பாகத் தக்கவைக்கிறது.
- source_word: πρὸς πάντας
  choice: எல்லாருக்கும்
  rationale: πάντας வடிவில் ஆண்பால் பன்மையாக இருந்தாலும் இங்கு பரந்த கேட்போர் அனைவரையும் பொதுவாகக் குறிக்கிறது; ‘எல்லாருக்கும்’ அந்த உள்ளடக்கிய பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிப் பயன்படுத்தப்பட்ட κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: போதகரே / எஜமானே
  rationale: ‘ஆண்டவரே’ மரியாதைமிக்க நேரடி அழைப்பையும் சொல்லின் சாத்தியமான கிறிஸ்தியல் ஆழத்தையும் தக்கவைக்கிறது; அதே நேரத்தில் இவ்வசனம் மட்டும் கூறுவதைவிட அதிகமான கோட்பாட்டுத் தீர்மானத்தைத் திணிக்கவில்லை.
- issue: பொதுப்பொருளில் வரும் ஆண்பால் பன்மை πάντας
  choice: எல்லாருக்கும்
  alternative: அனைவருக்கும் / எல்லா மக்களுக்கும்
  rationale: இச்சொல் ‘எங்களை’ பரந்த கேட்போருடன் ஒப்பிடுகிறது; ஆண்களுக்கு மட்டும் வரையறுக்காமல் கிரேக்கத்தின் பொதுப்பொருளை ‘எல்லாருக்கும்’ துல்லியமாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை. ‘எங்களுக்குச் ... எல்லாருக்கும்’ என்ற இணை அமைப்பு மூலத்தின் எதிர்மறைத் தேர்வைத் தெளிவாகப் பாதுகாக்கிறது. இந்தத் தமிழ் மொழிபெயர்ப்பில் ‘எல்லாருக்கும்’ என்பதே பொதுப்பொருளை இயல்பாக வெளிப்படுத்துவதால் தனி அடிக்குறிப்பு தேவையில்லை.
