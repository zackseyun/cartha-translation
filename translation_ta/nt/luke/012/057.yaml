lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: மேலும், … ஏன்
  rationale: முந்தைய கருத்தைத் தொடர்ந்து கேட்போரை இன்னும் நேரடியாகச் சிந்திக்கத் தூண்டும் வினாவாக இச்சொற்றொடர் உள்ளது. கிரேக்க இடைச்சொற்களைச் சொற்சொல்லாகக் கொடுக்காமல், அவற்றின் தொடர்ச்சி மற்றும் வலியுறுத்தலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: ἀφ’ ἑαυτῶν
  choice: நீங்களாகவே
  rationale: பிறர் சொல்லுவதற்காகக் காத்திராமல், தங்கள் சொந்த முனைப்பிலும் மதிப்பீட்டிலும் முடிவுக்கு வருவதை இச்சொல் குறிக்கிறது. ‘நீங்களாகவே’ என்பது இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐ κρίνετε
  choice: தீர்மானிப்பதில்லை
  rationale: κρίνω இங்கு ஒன்றை மதிப்பிட்டு முடிவு செய்வதைக் குறிக்கிறது. ‘தீர்மானிக்க’ என்பது நீதிமன்றத் தீர்ப்பு என்ற குறுகிய பொருளுக்குள் அடைக்காமல், சூழலுக்கேற்ற மதிப்பீட்டு அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: τὸ δίκαιον
  choice: சரியானது எது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்த நடுநிலை ஒருமை உரிச்சொல், சரியான அல்லது நீதியான காரியத்தைக் குறிக்கிறது. ‘சரியானது எது’ என்பது அதன் விரிந்த அறநெறி மற்றும் நடைமுறைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: τὸ δίκαιον என்பதன் பொருள் நுணுக்கம்
  choice: சரியானது எது
  alternative: நீதியானது எது
  rationale: இவ்வசனம் சட்டநீதியை மட்டும் பற்றிய தொழில்நுட்பக் கூற்றாக இல்லாமல், அறநெறி மற்றும் நடைமுறை சார்ந்த சரியான மதிப்பீட்டை வலியுறுத்துகிறது. ஆகவே ‘சரியானது’ என்ற விரிந்த சொல் மூலத்தின் பதற்றத்தைச் சுருக்காமல் பாதுகாக்கிறது; ‘நீதியானது’ என்பதும் உண்மையான மாற்றுப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் உடனடியாகப் புரிந்துகொள்ளும் வகையில் இயல்பானதும் கண்ணியமானதும் ஆன நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சொல்லாட்சியில் எந்த ஒரு சமயப்பிரிவின் தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
