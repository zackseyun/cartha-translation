revisions:
- from: '“மேலும் நான் உங்களுக்குச் சொல்கிறேன்: மனிதர்களுக்கு முன்பாக என்னை ஒப்புக்கொள்கிற ஒவ்வொருவரையும்[a] மனிதகுமாரனும் கடவுளுடைய தூதர்களுக்கு முன்பாக ஒப்புக்கொள்வார்.”'
  to: '“நான் உங்களுக்குச் சொல்கிறேன்: மனிதர்கள் முன்னிலையில் என்னை ஒப்புக்கொள்கிற ஒவ்வொருவரையும்[a] மனிதகுமாரனும் கடவுளின் தூதர்கள் முன்னிலையில் ஒப்புக்கொள்வார்.”'
  rationale: δέ-யின் மென்மையான இணைப்பைத் தமிழில் கட்டாயமாகத் தனிச்சொல்லால் காட்டத் தேவையில்லை; ‘நான் உங்களுக்குச் சொல்கிறேன்’ என்பது இயல்பான, கண்ணியமான உரைநடை. இரண்டு ‘முன்பாக’ சொற்றொடர்களும் ‘முன்னிலையில்’ என மாற்றப்பட்டுள்ளன. மற்றபடி மூலத்தின் பொதுநிபந்தனை, பரஸ்பர ஒப்புக்கொள்ளுதல், மனிதகுமாரன் பட்டம், மற்றும் கடவுளின் தூதர்கள் என்ற குறிப்பு அனைத்தும் மாற்றமின்றி காக்கப்பட்டுள்ளன.
