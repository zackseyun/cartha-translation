source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: ta
  text: '“நான் உங்களுக்குச் சொல்கிறேன்: மனிதர்கள் முன்னிலையில் என்னை ஒப்புக்கொள்கிற ஒவ்வொருவரையும்[a] மனிதகுமாரனும் கடவுளின் தூதர்கள் முன்னிலையில் ஒப்புக்கொள்வார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வெளிப்படையாக ஏற்றுக்கொள்கிற ஒவ்வொருவரையும்.” கிரேக்க வினை ஒருவரை பொதுவில் ஏற்றுக்கொண்டு அறிவிப்பதைக் குறிக்கலாம்.
    reason: ‘ஒப்புக்கொள்’ என்பதன் இங்குள்ள பொது அறிவிப்பு சார்ந்த பொருளைத் தெளிவுபடுத்தி, இயல்பான மாற்று மொழிபெயர்ப்பையும் வழங்குகிறது.
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: மேலும் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: λέγω என்பதன் நிகழ்கால உறுதியுரைக்கும் தன்மையை ‘நான் உங்களுக்குச் சொல்கிறேன்’ இயல்பாகக் காட்டுகிறது. δέ இங்கு வலுவான எதிர்மறை அல்ல; முந்தைய உரையுடன் மென்மையாகத் தொடர்வதால் ‘மேலும்’ பொருத்தமானது.
- source_word: πᾶς ὃς ἂν
  choice: ஒவ்வொருவரையும்
  rationale: இந்த அமைப்பு வரையறுக்கப்படாத பொதுநிபந்தனையையும் அனைவரையும் உள்ளடக்கும் பரப்பையும் குறிக்கிறது. அடுத்த வாக்கியப் பகுதியின் செயப்படுபொருளாகத் தமிழில் இயல்பாக அமைய ‘ஒவ்வொருவரையும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: ஒப்புக்கொள்கிற … ஒப்புக்கொள்வார்
  rationale: ὁμολογέω இங்கு ஒருவரை வெளிப்படையாக ஏற்றுக்கொண்டு அறிவிப்பதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே தமிழ் வினையைப் பயன்படுத்துவது மனிதரின் ஒப்புக்கொள்ளுதலுக்கும் மனிதகுமாரனின் ஒப்புக்கொள்ளுதலுக்கும் உள்ள பரஸ்பரத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: என்னை … ஒவ்வொருவரையும்
  rationale: ὁμολογέω உடன் வரும் ἐν + வேற்றுமை உருபு அமைப்பைச் சொற்சொல்லாக ‘என்னில்/அவரில்’ என்று மொழிபெயர்ப்பது தமிழில் தவறான அல்லது தெளிவற்ற பொருளைத் தரும். நபரை ஒப்புக்கொள்ளுதல் என்ற இடியோமப் பொருள் இயல்பான தமிழில் நேரடிச் செயப்படுபொருளால் தரப்பட்டுள்ளது.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: மனிதர்களுக்கு முன்பாக
  rationale: ἔμπροσθεν என்பதன் ‘முன்பாக/முன்னிலையில்’ என்ற பொருளையும், ἀνθρώπων என்பதன் பொதுவான மனிதர்களைக் குறிக்கும் பரப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இது இயேசுவின் தனித்துவமான சுயகுறிப்புப் பட்டமும் தானியேல் நூலுடனான பின்னணியைக் கொண்ட சொற்றொடரும் ஆகும்; எனவே விளக்கவுரையாக மாற்றாமல் நிலைபெற்ற தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: கடவுளுடைய தூதர்களுக்கு முன்பாக
  rationale: சொற்றொடரின் வானுலகச் சாட்சியாளர் சூழலையும் ‘கடவுளுடைய தூதர்கள்’ என்ற உறவையும் தெளிவாகவும் நேரடியாகவும் காட்டுகிறது.
theological_decisions:
- issue: ἐν + வேற்றுமை உருபுடன் வரும் பரஸ்பர ஒப்புக்கொள்ளுதல்
  choice: ‘என்னை ஒப்புக்கொள்கிற … ஒவ்வொருவரையும் … ஒப்புக்கொள்வார்’ என்று இடியோமப் பொருளில் மொழிபெயர்த்தல்
  alternative: ‘என்னில் அறிக்கையிடுகிற … அவரில் அறிக்கையிடுவார்’ என்று வடிவத்தைச் சொற்சொல்லாகத் தக்கவைத்தல்
  rationale: சொற்சொல்லான வடிவம் நவீன தமிழில் இயல்பற்றதுடன் வேறொரு தத்துவப் பொருளையும் உணர்த்தக்கூடும். தேர்ந்தெடுத்த வடிவம் பொது முன்னிலையில் இயேசுவை ஏற்றுக்கொள்ளுதல் மற்றும் அதற்குப் பதிலாக மனிதகுமாரன் அந்த நபரை ஏற்றுக்கொள்ளுதல் என்ற பதற்றமுள்ள பரஸ்பரத்தைக் கூடுதல் கோட்பாட்டு விளக்கமின்றிப் பாதுகாக்கிறது.
- issue: ἀνθρώπων என்பதன் பாலின மற்றும் பொதுப்பரப்பு
  choice: ‘மனிதர்கள்’
  alternative: ‘ஆண்கள்’
  rationale: கிரேக்கப் பன்மை இலக்கணத்தில் ஆண்பால் வடிவமாயிருந்தாலும், இங்கு மனிதர்களை பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ மூலத்தின் உண்மையான பரப்பை நவீனத் தமிழில் இயல்பாக வழங்குகிறது; ஆண்களுக்கு மட்டும் கட்டுப்படுத்தும் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறிக்கைபண்ணு’ போன்ற பழைய அல்லது சமயத்துறைக்கே உரிய நடையைத் தவிர்த்து, இரு கிரேக்க வினைகளின் இணைப்பை ‘ஒப்புக்கொள்’ என்ற ஒரே வினையால் காத்திருக்கிறது. கடவுளைக் குறிக்கும் மரியாதைப் பன்மையைச் சேர்க்காமல், கிரேக்க இலக்கணத்தின் ஒருமை வினை இயல்பை ‘மனிதகுமாரன் … ஒப்புக்கொள்வார்’ என்ற தமிழ் மரியாதை வினைமுற்றில் வழங்குகிறது.
