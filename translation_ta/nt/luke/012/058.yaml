  terminology: ‘அதிகாரி,’ ‘நீதிபதி,’ ‘காவல் அதிகாரி,’ ‘சிறை’ ஆகிய சட்டச் சொற்கள் சூழலுக்கேற்றவை. ‘அவனிடமிருந்து விடுபட’ என்பது ἀπηλλάχθαι ἀπ’ αὐτοῦ என்பதின் திறந்த, நேரடியான பொருளைத் தக்கவைக்கிறது; வழக்கைத் தீர்த்துக்கொள்ளுதல் என்ற சூழல்சார் விளக்கம் அடிக்குறிப்பில் மட்டுமே இருப்பது சரியானது.
