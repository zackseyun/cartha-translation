id: LUK.12.58
reference: Luke 12:58
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: ta
  text: ஏனெனில், உனக்கு எதிராக வழக்காடுகிறவனுடன் அதிகாரியிடம் நீ போகும்போது, வழியிலேயே அவனிடமிருந்து விடுபட முயற்சி செய்.[a] இல்லாவிட்டால், அவன் உன்னை நீதிபதியிடம் இழுத்துச் செல்வான்; நீதிபதி உன்னைக் காவல் அதிகாரியிடம் ஒப்படைப்பார்; காவல் அதிகாரி உன்னைச் சிறையில் தள்ளுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனோடு வழக்கைத் தீர்த்துக்கொள்ள முயற்சி செய்.” கிரேக்கத்தில் நேரடியாக, “அவனிடமிருந்து விடுபட முயற்சி செய்” என்று உள்ளது; சூழலில், வழக்கு நீதிபதியிடம் செல்வதற்கு முன் அதைத் தீர்த்துக்கொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: உனக்கு எதிராக வழக்காடுகிறவன்
  rationale: சட்டப் பின்னணியிலுள்ள எதிர்தரப்பினரைக் குறிக்கிறது. வெறும் ‘எதிரி’ என்பதைவிட வழக்கின் சூழலைத் தெளிவாகவும், ‘குற்றம் சாட்டுகிறவன்’ என்பதைவிட கிரேக்கச் சொல்லின் விரிவை நன்கு காக்கும் இயல்பான தமிழ்.
- source_word: ἄρχοντα
  choice: அதிகாரி
  rationale: இங்கு குடிமை அல்லது நிர்வாக அதிகாரம் உடையவரைக் குறிக்கிறது. பின்னர் வரும் κριτής என்பதற்கான ‘நீதிபதி’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: δὸς ἐργασίαν
  choice: முயற்சி செய்
  rationale: தீவிரமாகச் செயல்படும்படி வலியுறுத்தும் கிரேக்க மரபுத்தொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: அவனிடமிருந்து விடுபட
  rationale: கிரேக்கத்தின் நேரடியான, ஓரளவு திறந்த பொருளை முதன்மை உரையில் காக்கிறது; வழக்கைத் தீர்த்துக்கொள்வது என்ற சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατασύρῃ
  choice: இழுத்துச் செல்வான்
  rationale: வலுக்கட்டாயமாக நீதிமன்றத்திற்குக் கொண்டுசெல்லும் வினையின் வலிமையான காட்சியைப் பாதுகாக்கிறது.
- source_word: κριτήν / κριτής
  choice: நீதிபதி
  rationale: இச்சட்டப் பின்னணியில் சொல்லின் வழக்கமான மற்றும் தெளிவான பொருள்.
- source_word: παραδώσει
  choice: ஒப்படைப்பார்
  rationale: நீதித்துறை அதிகாரத்தின் கீழ் ஒருவரை அடுத்த அதிகாரியிடம் ஒப்படைக்கும் கருத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πράκτορι / πράκτωρ
  choice: காவல் அதிகாரி
  rationale: நீதிபதியின் ஆணையை நிறைவேற்றி, கடன் வசூல் அல்லது சிறைக் காவலை மேற்கொள்ளும் அலுவலரைக் குறிக்கிறது. குறிப்பிட்ட நவீன நீதித்துறைப் பதவியைத் திணிக்காமல் பங்கைத் தெளிவாக்குகிறது.
- source_word: βαλεῖ εἰς φυλακήν
  choice: சிறையில் தள்ளுவார்
  rationale: βάλλω என்பதிலுள்ள வலிமையை ‘சிறையில் வைப்பார்’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: ὡς γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலோடு இணைக்கும் γάρ என்பதன் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; ὡς தொடங்கும் சூழ்நிலையை ‘போகும்போது’ என்ற துணைவாக்கியம் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியிலேயே
  rationale: இடத்தையும், வழக்கு முறையான தீர்ப்பை அடைவதற்கு முன் செயல்பட வேண்டிய அவசரத்தையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: சட்ட அறிவுறுத்தலின் விளக்கத் துல்லியம்
  choice: சட்டக் காட்சியை அப்படியே வைத்திருந்து, அதன் ஆன்மீகப் பயன்பாட்டை வசனத்திற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: இதை இறுதித் தீர்ப்புக்கு முன் கடவுளோடு ஒப்புரவாக வேண்டிய அழைப்பாக வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: வசனத்தின் நேரடி மொழி ஒரு சட்டச் சூழலை முன்வைக்கிறது. விரிந்த சூழல் இறுதித் தீர்ப்பின் அவசரத்தை உணர்த்தக்கூடும் என்றாலும், எதிர்த்தரப்பினர், நீதிபதி, சிறை ஆகியவற்றின் ஆன்மீக அடையாளங்களை இவ்வசனம் வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான சட்டச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. ‘அதிகாரி’ மற்றும் ‘நீதிபதி’ என்ற வேறுபாடு மூலத்தின் ἄρχων/κριτής வேறுபாட்டைக் காக்கிறது. அடிக்குறி அது விளக்கும் ‘விடுபட’ என்ற சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
