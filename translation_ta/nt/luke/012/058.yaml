  source_fidelity: மூலக் கிரேக்கத்தின் சட்டக் காட்சி, நிகழ்வுகளின் வரிசை, மற்றும் வினைகளின் வலிமை துல்லியமாகக் காக்கப்பட்டுள்ளன. ἄρχων (‘அதிகாரி’) மற்றும் κριτής (‘நீதிபதி’) ஆகிய வேறுபாடும், πράκτωρ என்பதன் ஆணை நிறைவேற்றும் அலுவலர் என்ற பங்கும் பொருத்தமாகத் தரப்பட்டுள்ளன. ‘வழியிலேயே’ என்பது ἐν τῇ ὁδῷ என்பதன் இட மற்றும் அவசரக் குறிப்பை நன்றாக வெளிப்படுத்துகிறது.
