  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: ta
  text: 'அவர் மக்கள் கூட்டங்களிடமும் சொல்லிக்கொண்டிருந்தார்: “மேற்கே ஒரு மேகம் எழும்புவதை நீங்கள் காணும்போது, ‘மழை[a] வருகிறது’ என்று உடனே சொல்கிறீர்கள்; அது அப்படியே நடக்கிறது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெருமழை வருகிறது.” கிரேக்கச் சொல் பொதுவாக மழையைக் குறிக்கலாம்; இன்னும் குறிப்பாகப் பெருமழையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: இறந்தகால முற்றுப்பெறா வினைவடிவம் பின்னணியில் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கிறது; தமிழ் தொடர்நிலை வடிவம் அந்தக் கூறைத் தக்கவைக்கிறது.
- source_word: δὲ καὶ
  choice: -இடமும்
  rationale: καὶ என்பதன் சேர்க்கைப் பொருளை ‘மக்கள் கூட்டத்தினரிடமும்’ என்பதில் இயல்பாக வெளிப்படுத்துகிறது; δέ-ஐ தனியாக மிகையாக மொழிபெயர்க்கவில்லை.
- source_word: τοῖς ὄχλοις
  choice: மக்கள் கூட்டத்தினரிடம்
  rationale: கிரேக்கத்தில் உள்ள பன்மையைத் தக்கவைத்தபடி, நவீன தமிழில் இயல்பாகப் புரியும் சொற்றொடர்.
- source_word: Ὅταν ἴδητε
  choice: நீங்கள் காணும்போது
  rationale: பொதுவாக நிகழக்கூடிய ஒரு சூழலைக் குறிக்கும் ὅταν மற்றும் இறந்தகாலத் துணைவினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: νεφέλην
  choice: ஒரு மேகம்
  rationale: மூலச்சொல் பொதுவாக ‘மேகம்’ என்றே பொருள்படும்; ‘மழைமேகம்’ என்ற சூழல்சார் விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἀνατέλλουσαν
  choice: எழும்புவதை
  rationale: மேகம் மேலெழுந்து தோன்றும் காட்சியைச் சுருக்கமாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ δυσμῶν
  choice: மேற்கே
  rationale: மேற்கு திசை அல்லது மேற்குப் பகுதியைக் குறிக்கும் கிரேக்கச் சொற்றொடரை வானிலைப் பார்வையின் சூழலில் இயல்பாக வழங்குகிறது; ‘மேற்கிலிருந்து’ என்பதும் பொருள்சாத்தியம்.
- source_word: εὐθέως
  choice: உடனே
  rationale: உடனடித் தன்மையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λέγετε
  choice: சொல்கிறீர்கள்
  rationale: வழக்கமாகச் செய்யும் செயலைக் குறிக்கும் நிகழ்காலத்தை தமிழ் நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: நேர்கூற்றை அறிமுகப்படுத்தும் மேற்கோள் குறிகள்
  rationale: இங்கு ὅτι அவர்கள் சொல்வதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேர்கூற்றும் ‘என்று’ என்பதும் இதை இயல்பாகத் தெரிவிக்கின்றன.
- source_word: Ὄμβρος
  choice: மழை
  rationale: இச்சொல் பொதுவாக மழையையும், குறிப்பாகப் பெருமழை அல்லது மழைப்புயலையும் குறிக்கலாம். அடிப்படைப் பொருளை முதன்மை உரையில் வைத்து, வலுவான மாற்றைப் அடிக்குறிப்பில் தருவது மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: ἔρχεται
  choice: வருகிறது
  rationale: விரைவில் நிகழவிருக்கும் வானிலை நிகழ்வை தமிழ் நிகழ்காலம் இயல்பாகக் காட்டுகிறது.
- source_word: γίνεται οὕτως
  choice: அது அப்படியே நடக்கிறது
  rationale: முன்கூறியது உண்மையில் அதேபோல் நிகழ்வதை கிரேக்கத்தின் பொதுநிகழ்காலத் தன்மையுடன் வெளிப்படுத்துகிறது.
