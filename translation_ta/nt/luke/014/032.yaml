  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: ta
  text: ஆனால், அவ்வாறு செய்ய முடியாவிட்டால், மற்ற அரசன் இன்னும் தொலைவில் இருக்கும்போதே, இந்த அரசன் ஒரு தூதுக்குழுவை[a] அனுப்பி, சமாதானத்திற்கான நிபந்தனைகளைக்[b] கேட்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதுக்குழு’ என்பதற்கு ‘தூதர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘சமாதானத்தைச் சார்ந்த காரியங்கள்’; அதாவது, சமாதானத்தை ஏற்படுத்தும் நிபந்தனைகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: ஆனால், முடியாது என்றால்
  rationale: முந்தைய வசனத்தில் எதிர்த்து நிற்க முடியுமா என்ற கேள்வியுடன் இச்சொற்றொடர் நேரடியாக இணைகிறது. எனவே வெறும் ‘இல்லையென்றால்’ என்பதைக் காட்டிலும் ‘முடியாது என்றால்’ என்பது சூழலில் மறைந்துள்ள கருத்தை இயல்பாக வெளிப்படுத்துகிறது; δὲ-யின் எதிர்மறைத் திருப்பை ‘ஆனால்’ காக்கிறது.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: மற்ற அரசன் இன்னும் தொலைவில் இருக்கும்போதே
  rationale: இது ஒரே நேரத்தில் நிலவும் சூழலைக் குறிக்கும் genitive absolute அமைப்பு. αὐτοῦ என்பது தூதரை அனுப்பும் அரசனை அல்ல, அவரை எதிர்த்து வரும் மற்ற அரசனைக் குறிக்கிறது. ‘இன்னும் தொலைவில் இருக்கும்போதே’ காலச்சூழலையும் அவசரத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: πρεσβείαν
  choice: ஒரு தூதுக்குழுவை
  rationale: இச்சொல் அரசியல் அல்லது அதிகாரப்பூர்வ நோக்கத்திற்காக அனுப்பப்படும் தூதர்கள் அடங்கிய குழுவைக் குறிக்கலாம். நவீன தமிழில் ‘தூதுக்குழு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀποστείλας
  choice: அனுப்பி
  rationale: Aorist participle முதன்மை வினைக்கு முந்திய அல்லது அதனுடன் நெருங்கிய தொடர்புள்ள செயலைக் காட்டுகிறது. ‘அனுப்பி ... கேட்பார்’ என்பது செயல்களின் வரிசையைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐρωτᾷ
  choice: கேட்பார்
  rationale: இங்கு வினை வெறும் விசாரிப்பதை அல்ல, சமாதானத்திற்கான ஏற்பாடுகளை வேண்டிக் கேட்பதைக் குறிக்கிறது. அதன் பொருளை அடுத்த பெயர்த்தொடருடன் சேர்ந்து ‘கேட்பார்’ இயல்பாகத் தருகிறது.
- source_word: τὰ πρὸς εἰρήνην
  choice: சமாதானத்திற்கான நிபந்தனைகளை
  rationale: சொல்லுக்குச் சொல் ‘சமாதானத்தைச் சார்ந்த காரியங்கள்’ என்றாலும், போர் சூழலில் இது சமாதானத்தை ஏற்படுத்தும் நிபந்தனைகள் அல்லது உடன்பாட்டு விதிகளைக் குறிக்கிறது. ‘சமாதானத்திற்கான நிபந்தனைகள்’ தெளிவான நவீனத் தமிழ்.
