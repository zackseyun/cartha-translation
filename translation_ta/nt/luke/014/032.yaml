translation_notes:
  register: நவீன நிலையான தமிழில், உவமையின் அரசியல் மற்றும் போர் சார்ந்த சூழலைத் தெளிவாக வைத்துள்ள மொழிநடை. இரு அரசர்களையும் வேறுபடுத்த ‘மற்ற அரசன்’ மற்றும் ‘இவர்’ பயன்படுத்தப்பட்டுள்ளன. மரியாதைப் பன்மை வினைமுற்று கண்ணியமான வேதாகம உரைநடையைத் தருகிறது.
