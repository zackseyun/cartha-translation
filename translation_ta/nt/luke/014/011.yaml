id: LUK.14.11
reference: Luke 14:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: ta
  text: ஏனெனில், தன்னை உயர்த்திக்கொள்கிற ஒவ்வொருவரும் தாழ்த்தப்படுவார்; தன்னைத் தாழ்த்திக்கொள்கிறவர் உயர்த்தப்படுவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், விளக்கக் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: தன்னை உயர்த்திக்கொள்கிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொற்றொடரின் பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளைத் தக்கவைக்கிறது; ‘தன்னை ... கொள்கிற’ என்பது தற்சுட்டுப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ταπεινωθήσεται
  choice: தாழ்த்தப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், ‘உயர்த்துதல்—தாழ்த்துதல்’ என்ற சொல்லாட்சிசார் எதிரிணையையும் காக்கிறது.
- source_word: καὶ
  choice: ;
  rationale: கிரேக்கத்தில் καὶ இரண்டு இணையான எதிர்மறைக் கூறுகளை இணைக்கிறது. தமிழில் அரைப்புள்ளி பழமொழித் தன்மையுள்ள சமச்சீர் அமைப்பையும் முரண்பாட்டையும் இயல்பாகக் காட்டுகிறது; இணைப்பின் பொருள் வாக்கிய அமைப்பிலேயே தெளிவாக உள்ளது.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: தன்னைத் தாழ்த்திக்கொள்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புச் சொல்லையும், ஒருவர் தாமே தம்மைத் தாழ்த்திக்கொள்வதையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑψωθήσεται
  choice: உயர்த்தப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, முதல் கூறுடன் நேர்த்தியான எதிரிணையை உருவாக்குகிறது.
theological_decisions:
- issue: எதிர்காலச் செயப்பாட்டு வினைகளில் மறைந்திருக்கும் செய்பவர்
  choice: ‘தாழ்த்தப்படுவார்’, ‘உயர்த்தப்படுவார்’ என்று செயப்பாட்டு வடிவங்களையே வைத்தல்
  alternative: ‘கடவுளால் தாழ்த்தப்படுவார்’, ‘கடவுளால் உயர்த்தப்படுவார்’ என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்க மூலத்தில் செய்பவர் பெயரிடப்படவில்லை. கடவுளின் செயல்பாடு சூழலில் உணர்த்தப்பட்டாலும், அதை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் இறையியல் மறைபொருளையும் பதற்றத்தையும் காக்கிறது.
- issue: ஒருமை ஆண்பால் வடிவங்களின் பொதுப்பயன்பாடு
  choice: பாலினத்தைச் சுட்டாத இயல்பான தமிழ் ஒருமை மனிதக் குறிப்பு—‘தன்னை’, ‘ஒவ்வொருவரும்’, ‘தாழ்த்திக்கொள்கிறவர்’
  alternative: ஆண்பாலை வெளிப்படையாகக் குறிக்கும் ‘தன்னை உயர்த்திக்கொள்கிற ஒவ்வொரு ஆணும்’ போன்ற வடிவம்
  rationale: கிரேக்க ஒருமை ஆண்பால் இங்கு எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கிறது. தமிழின் இயல்பான பொதுமை ஒருமை வடிவங்கள் எண்ணையும் பிரதிபலிப்பையும் காத்து, மூலத்தில் இல்லாத ஆண்-மட்டும் என்ற பொருளை உருவாக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பழமொழிபோன்ற சமச்சீர், கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘உயர்த்திக்கொள்கிற—தாழ்த்தப்படுவார் / தாழ்த்திக்கொள்கிறவர்—உயர்த்தப்படுவார்’ என்ற எதிரிணை திட்டமிட்டு பாதுகாக்கப்பட்டது.
