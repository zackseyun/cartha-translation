source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: ta
  text: ஆனால் நீ அழைக்கப்படும்போது, போய் மிகவும் தாழ்ந்த இடத்தில் உணவு மேசையில் சாய்ந்துகொள்[a]. அப்போது, உன்னை அழைத்தவர் வந்து, ‘நண்பரே, இன்னும் உயர்ந்த இடத்துக்கு வாருங்கள்[b]’ என்று உன்னிடம் சொல்லும்படி அவ்வாறு செய். அப்பொழுது உன்னோடு உணவு மேசையில் சாய்ந்திருக்கும் அனைவரின் முன்னிலையிலும் உனக்கு மதிப்பு உண்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிகவும் தாழ்ந்த இருக்கையில் அமர்.’ கிரேக்க வினைச்சொல் உணவின்போது மேசையில் சாய்ந்திருப்பதைச் சிறப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இன்னும் மேலே வாருங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: நீ அழைக்கப்படும்போது
  rationale: விருந்துச் சூழலில் καλέω என்பது பொதுவாக அழைப்பைப் பெறுவதைக் குறிக்கிறது; எனவே ‘அழைக்கப்படும்போது’ இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: πορευθεὶς
  choice: போய்
  rationale: இந்தப் பங்கேற்புவினை முதன்மைக் கட்டளையோடு இணைந்த செயலைக் குறிக்கிறது; தமிழில் ‘போய் ... அமர்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀνάπεσε
  choice: பந்தியில் சாய்ந்து அமர்
  rationale: முதல் நூற்றாண்டு விருந்துகளில் உணவுண்ணும்போது சாய்ந்திருக்கும் வழக்கை வினைச்சொல் குறிப்பாகக் குறிக்கிறது. ‘அமர்’ மட்டும் கூறுவதைவிட இது பண்பாட்டுச் சூழலைப் பாதுகாக்கிறது.
- source_word: ἔσχατον τόπον
  choice: மிகத் தாழ்ந்த இடம்
  rationale: இது வெறும் கடைசி இடத்தைக் காட்டிலும் சமூக மதிப்பில் மிகக் குறைந்த இடத்தைக் குறிக்கிறது; ‘மிகத் தாழ்ந்த இடம்’ அந்த நிலையைத் தெளிவாக்குகிறது.
- source_word: ὁ κεκληκώς σε
  choice: உன்னை அழைத்தவர்
  rationale: கிரேக்கப் பங்கேற்புவினையின் பொருளை நேரடியாகத் தருகிறது; ‘விருந்து அளிப்பவர்’ என்பதைக் காட்டிலும் மூலத்தின் சொற்றொடருக்கு நெருக்கமானது.
- source_word: Φίλε
  choice: நண்பரே
  rationale: மரியாதையுடனான நேரடி அழைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத உடைமைப் பொருளைச் சேர்க்கவில்லை.
- source_word: προσανάβηθι ἀνώτερον
  choice: இன்னும் மேலான இடத்துக்கு வாருங்கள்
  rationale: உயர்ந்த மதிப்புள்ள இடத்துக்கு நகருமாறு கூறும் பொருளையும் மேல்நோக்கிய படிமத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δόξα
  choice: மதிப்பு
  rationale: இந்தச் சமூகச் சூழலில் δόξα என்பது தெய்வீக மகிமையை அல்ல, மற்றவர்கள் முன்னிலையில் கிடைக்கும் மதிப்பு அல்லது கௌரவத்தைக் குறிக்கிறது.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: உன்னோடு பந்தியில் சாய்ந்திருக்கும் அனைவரின் முன்னிலையிலும்
  rationale: நிகழ்வின் பொதுவான தன்மையையும் விருந்துப் பந்தியில் சாய்ந்திருக்கும் படிமத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: கூற்றின் தன்மை
  choice: தாழ்மையையும் மதிப்பின் தலைகீழ் மாற்றத்தையும் பற்றிய உவமைப் போதனையின் பகுதியாக அமையும் நடைமுறை அறிவுரையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை வெறும் விருந்து நெறிமுறையாக மட்டும் கருதுதல் அல்லது முற்றிலும் இறுதிக்கால வெகுமதியைப் பற்றியதாக மட்டும் விளக்குதல்.
  rationale: விருந்து உருவகத்தின் சமூகப் பொருளும் விரிந்த இறையியல் எதிரொலியும் வசனத்தில் இணைந்திருக்கின்றன; மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பந்தியில் சாய்ந்து அமர்’ என்பது பழங்கால விருந்து வழக்கைத் தெளிவுபடுத்துகிறது. விருந்தளிப்பவரின் மரியாதையான அழைப்பை ‘நண்பரே ... வாருங்கள்’ என உயர்திணை வடிவில் கொடுத்தாலும், இயேசுவின் நேரடி அறிவுரை ஒருமை நெருக்கநடையில் ‘நீ ... அமர்’ என வைக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கிலக் குறிப்புகளின் பொருளுடன் அவற்றின் குறியீட்டு இடங்கள் பொருந்துவதற்காக [a] சாய்ந்து அமர்வதற்குப் பின்னும் [b] மேலே வருவதற்குப் பின்னும் வைக்கப்பட்டுள்ளன.
