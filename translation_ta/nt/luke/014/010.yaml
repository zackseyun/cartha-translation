review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders invitation, going, reclining at a meal, the low-status place, the inviter, public honor, and the fellow diners. However, it omits the purpose force of ἵνα ('so that'), replacing it with a merely temporal 'அப்போது'. This should be restored.
  naturalness: The overall register is clear and modern. 'பந்தியில் சாய்ந்து அமர்' is understandable but somewhat awkward in contemporary Tamil; 'உணவு மேசையில் சாய்ந்துகொள்' more naturally expresses ancient table reclining while retaining the culturally specific action.
  terminology: ‘மிகவும் தாழ்ந்த இடம்’ appropriately conveys the socially least prominent place. ‘மதிப்பு’ suitably renders δόξα in this context. ‘நண்பரே’ and the respectful imperative ‘வாருங்கள்’ are appropriate and do not add theological interpretation.
  issues:
  - severity: medium
    issue: The purpose clause ἵνα is not represented.
    rationale: The wording 'அப்போது உன்னை அழைத்தவர் வந்து' makes the host's arrival simply subsequent, whereas Greek says to take the low place so that the host may come and address the guest. Tamil should preserve this purposive connection.
  - severity: low
    issue: ‘பந்தியில் சாய்ந்து அமர்’ is less idiomatic than necessary.
    rationale: It retains the meal setting but combines actions in a slightly awkward way. A natural Tamil expression for taking a reclining place at table improves readability without losing the historical dining image.
