  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: ta
  text: அவர் அவர்களிடம்[a], “உங்களில் ஒருவருடைய மகனோ மாடோ கிணற்றில் விழுந்தால், ஓய்வுநாளில்கூட உடனே வெளியே இழுத்தெடுக்காமல் இருப்பீர்களா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “மகன்” என்பதற்குப் பதிலாக “கழுதை” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: உங்களில் ஒருவருடைய
  rationale: கிரேக்கச் சொற்றொடர் இங்கு ‘உங்களில் யாருடைய மகனோ மாடோ’ என்ற உடைமைப் பொருளுடன் வரும் வினாவாகும்; தமிழில் இயல்பாக அமைய ‘உங்களில் ஒருவருடைய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: υἱὸς
  choice: மகன்
  rationale: ஆண்பால் ஒருமையைக் குறிப்பாகக் கூறும் மூலச்சொல்லின் துல்லியத்தைக் காக்கிறது.
- source_word: βοῦς
  choice: மாடு
  rationale: βοῦς குறிக்கும் மாட்டினத்தை நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் ‘மாடு’ என வழங்குகிறது; ‘எருது’ என்று பாலினம் அல்லது பயன்பாட்டை அதிகமாகக் குறிப்பாக்கவில்லை.
- source_word: φρέαρ
  choice: கிணறு
  rationale: இச்சூழலில் φρέαρ என்பதன் இயல்பான பொருள் ‘கிணறு’; இணை நிகழ்வுகளிலுள்ள ‘குழி’ என்ற சொல்லுடன் ஒத்திசைக்கப்படவில்லை.
- source_word: πεσεῖται
  choice: விழுந்தால்
  rationale: எதிர்கால வினை வடிவம் இங்கு நிபந்தனையுடன் கூடிய சொல்லாட்சியில் வருகிறது; தமிழில் ‘விழுந்தால்’ என்பது அதன் பொருளையும் இயல்பையும் காக்கிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: மீட்பைத் தாமதிக்காத அவசரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνασπάσει
  choice: வெளியே தூக்கிவிட
  rationale: கீழே விழுந்த ஒன்றை மேலே இழுத்துத் தூக்கி வெளியே எடுப்பதைக் குறிக்கிறது; கிணற்றிலிருந்து மீட்கும் காட்சிக்கு இச்சொற்றொடர் இயல்பானது.
- source_word: αὐτὸν
  choice: அதை
  rationale: தமிழில் மகனையோ மாட்டையோ மீண்டும் சுட்டும் இடத்தில் ‘அதை’ என்பது இயல்பான பொதுச் சுட்டுப்பெயர்; கிரேக்க இலக்கண ஆண்பாலை செயற்கையாகத் தமிழில் திணிக்கவில்லை.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: ஓய்வுநாளாக இருந்தாலும்
  rationale: ‘ஓய்வுநாளில்’ என்ற காலப்பொருளுடன், பதில் தெளிவாக ‘மீட்பார்கள்’ என்பதாக அமையும் வினாவின் விட்டுக்கொடுப்பு நயத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எடுத்துக்காட்டில் வரும் முதல் நபர்/விலங்கு குறித்த பாட வேறுபாடு
  choice: மகன் அல்லது மாடு
  alternative: கழுதை அல்லது மாடு
  rationale: வழங்கப்பட்ட SBLGNT மூலப்பாடம் υἱὸς (‘மகன்’) என்று வாசிப்பதால் அதையே முதன்மை உரையில் பின்பற்றுகிறது; ‘கழுதை’ என்ற வேறுபட்ட பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்க வினாவின் உடைமை அமைப்பை ‘உங்களில் ஒருவருடைய’ என்றும், எதிர்பார்க்கப்படும் உறுதியான பதிலை ‘மாட்டீர்களா?’ என்றும் வெளிப்படுத்துகிறது. ‘ஓய்வுநாளாக இருந்தாலும்’ என்பது சூழலிலுள்ள வாதத்தின் அழுத்தத்தைத் தெளிவாக்குகிறது.
