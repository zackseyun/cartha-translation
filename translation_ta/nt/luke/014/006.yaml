  text: And they were not able to reply to these things[a].
translation:
  language: ta
  text: அவர்களால் இவற்றுக்குப் பதிலளிக்க முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவற்றுக்கு” என்பது கிரேக்கத்தில் பன்மை வடிவில் உள்ளது. “இதற்குப்” அல்லது “இவற்றைக் குறித்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: வாக்கியத் தொடர்ச்சியால் இயல்பாக உணர்த்தப்பட்டுள்ளது
  rationale: கிரேக்கத்தில் இது எளிய இணைப்புச் சொல். தமிழில் தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது இயல்பற்றதாகவோ தேவையற்ற கால நுணுக்கத்தைச் சேர்ப்பதாகவோ இருக்கும்; ஆகவே வாக்கியத் தொடர்ச்சியிலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: οὐκ
  choice: முடியவில்லை
  rationale: வினைச்சொல் தொடரை நேரடியாக மறுக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἴσχυσαν
  choice: அவர்களால் ... முடியவில்லை
  rationale: இங்கு ἰσχύω உடல் வலிமையை அல்ல, செயலாற்றும் திறனைச் சுட்டுகிறது. ‘அவர்களால் ... முடியவில்லை’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀνταποκριθῆναι
  choice: பதிலளிக்க
  rationale: திரும்பப் பதில் கூறுவதைக் குறிக்கும் வினை. ‘பதிலளிக்க’ என்பது தேவையற்ற எதிர்ப்புத் தொனியைச் சேர்க்காமல் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: πρὸς ταῦτα
  choice: இவற்றுக்குப்
  rationale: πρός உடன் வரும் பன்மைச் சுட்டுப்பெயரான ταῦτα, இங்கு கூறப்பட்டவற்றுக்குப் பதிலாக அல்லது அவற்றை முன்னிட்டு பதிலளிப்பதைக் குறிக்கிறது. ‘இவற்றுக்குப்’ பன்மையைப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் பன்மை வெளிப்பாடு முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; இயல்பற்ற இணைப்புச் சொல்லைச் சேர்க்காமல் தொடர்ச்சியான உரைநடை பயன்படுத்தப்பட்டுள்ளது.
