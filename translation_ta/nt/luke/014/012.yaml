id: LUK.14.12
reference: Luke 14:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: ta
  text: 'மேலும், தம்மை அழைத்தவரிடம் அவர் கூறினார்: “நீ பகல் விருந்தோ[a] இரவு விருந்தோ கொடுக்கும்போது, உன் நண்பர்களையோ, உன் சகோதரர்களையோ, உன் உறவினர்களையோ, செல்வந்தர்களான அண்டை வீட்டாரையோ அழைக்காதே. இல்லையென்றால், அவர்களும் உன்னைத் திரும்ப அழைத்து[b], அது உனக்குக் கைம்மாறாகிவிடலாம்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முற்பகல் உணவு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἄριστον, இன்றைய காலை உணவைத் துல்லியமாகக் குறிக்காமல், பெரும்பாலும் நண்பகலை ஒட்டிய நாளின் முந்தைய உணவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘அவர்களும் உன்னைப் பதிலுக்கு அழைத்து.’ கிரேக்க வினைச்சொல் திரும்ப அழைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, ‘அது உனக்குக் கைம்மாறாக ஆகிவிடலாம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: மேலும் ... அவர் கூறினார்
  rationale: δὲ καὶ என்பதன் தொடர்ச்சி மற்றும் கூடுதல் கருத்தை ‘மேலும்’ இயல்பாக வெளிப்படுத்துகிறது. ἔλεγεν இறந்தகாலத் தொடர்நிலையைக் கொண்டிருந்தாலும், தனி வசனமாகத் தமிழில் ‘கூறினார்’ என்பது இயல்பான கதைநடை; ‘கூறிக்கொண்டிருந்தார்’ இங்கு தேவையற்ற நீடிப்பை உணர்த்தக்கூடும்.
- source_word: τῷ κεκληκότι αὐτόν
  choice: தம்மை அழைத்தவரிடம்
  rationale: καλέω என்பதன் நிறைவுநிலைப் பங்கேற்புச் சொல், இயேசுவை முன்பே அழைத்த நபரைக் குறிக்கிறது. ‘விருந்தளித்தவரிடம்’ என்பதைவிட இது மூலத்தின் சொற்தொடருக்கு வெளிப்படையாக நெருக்கமானது.
- source_word: Ὅταν ποιῇς
  choice: நீ ... விருந்து கொடுக்கும்போது
  rationale: உணவுச் சொற்களுடன் ποιέω என்பது விருந்தை ஏற்பாடு செய்து அளிப்பதைக் குறிக்கிறது; தமிழில் ‘விருந்து கொடு’ இயல்பான இணைச்சொல்.
- source_word: ἄριστον
  choice: பகல் விருந்து
  rationale: ἄριστον நாளின் முற்பகுதி அல்லது நண்பகலில் உண்ணப்பட்ட முந்தைய உணவைக் குறிக்கிறது. நவீன காலை உணவாகத் தவறாகப் புரிந்துகொள்ளப்படாமல், δεῖπνον உடனான வேறுபாட்டையும் இது காக்கிறது.
- source_word: δεῖπνον
  choice: இரவு விருந்து
  rationale: δεῖπνον பொதுவாக நாளின் பிற்பகுதியில் உண்ணப்பட்ட முக்கிய உணவைக் குறிக்கிறது; ‘இரவு விருந்து’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: μὴ φώνει
  choice: அழைக்காதே
  rationale: φωνέω அடிப்படையில் ‘கூப்பிடு’ என்றாலும், விருந்துச் சூழலில் அழைப்பிதழ் பொருளுடைய ‘அழை’ என்பதே இயல்பான தமிழ்.
- source_word: τοὺς ἀδελφούς σου
  choice: உன் சகோதரர்களை
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையைப் பாலினச் சார்பற்ற சொல்லாக மாற்றாமல் காக்கிறது; அதேவேளை நவீன தமிழில் கண்ணியமானதும் தெளிவானதும் ஆகும்.
- source_word: τοὺς συγγενεῖς σου
  choice: உன் உறவினர்களை
  rationale: συγγενεῖς என்பதன் குடும்ப உறவுப் பொருளை நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: γείτονας πλουσίους
  choice: செல்வந்தர்களான அண்டை வீட்டாரை
  rationale: πλουσίους என்பது γείτονας என்பதையே நேரடியாகத் தகுதிப்படுத்துகிறது. ‘செல்வந்தர்களான’ என்பது ‘பணக்கார’ என்பதைவிட இங்கு கண்ணியமான நடை.
- source_word: μήποτε
  choice: இல்லையென்றால் ...லாம்
  rationale: எதிர்மறையான எச்சரிக்கை அல்லது சாத்திய விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கட்டாயமாக நிகழும் விளைவாக மாற்றவில்லை.
- source_word: ἀντικαλέσωσίν σε
  choice: அவர்களும் உன்னைத் திரும்ப அழைத்து
  rationale: ἀντι- முன்னொட்டில் உள்ள பரஸ்பரக் கைம்மாற்றை ‘திரும்ப அழைத்து’ தெளிவாகக் காக்கிறது.
- source_word: γένηται ἀνταπόδομά σοι
  choice: அது உனக்குக் கைம்மாறாகிவிடலாம்
  rationale: γένηται என்பதன் சாத்தியத்தையும் ἀνταπόδομα என்பதன் பதிலளிப்பு அல்லது திருப்பிச் செலுத்தல் கருத்தையும் காக்கிறது. ‘கைம்மாறு’ இங்கு பொருளாதாரப் பணப்பரிவர்த்தனை மட்டும் அல்லாத சமூகப் பதிலுதவியை உணர்த்துகிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளையின் நோக்கம்
  choice: வசனத்தின் நேரடி தடை மற்றும் கைம்மாறு குறித்த எச்சரிக்கையை அப்படியே வைத்தல்
  alternative: நண்பர்களையோ உறவினர்களையோ ஒருபோதும் விருந்துக்கு அழைக்கக் கூடாது என்ற முழுமையான விதியாக விளக்குதல்
  rationale: வசனம் சமூகக் கைம்மாற்றை எதிர்பார்த்து அழைப்பதன் பிரச்சினையை முன்வைக்கிறது; அதன் நடைமுறை எல்லையை மொழிபெயர்ப்பிலேயே தீர்மானித்து விடாமல், மூலத்தின் இறுக்கத்தையும் அடுத்த வசனங்களுக்கான தொடர்பையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, தெளிவான வசனநடை பயன்படுத்தப்பட்டுள்ளது. ‘பகல் விருந்து / இரவு விருந்து’ என்ற இணை மூலத்தில் உள்ள இரு உணவு நேரங்களின் வேறுபாட்டைக் காக்கிறது. ஒருமை இரண்டாம் நபருக்கான ‘நீ’ மற்றும் ‘உன்’ மூலத்தின் நேரடி தனிப்பட்ட உரையைப் பாதுகாக்கின்றன.
