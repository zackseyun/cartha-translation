id: LUK.14.26
reference: Luke 14:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: ta
  text: “யாராவது என்னிடம் வந்து, தன் தந்தையையும் தாயையும் மனைவியையும் பிள்ளைகளையும் சகோதரர்களையும் சகோதரிகளையும்—ஏன், தன் உயிரையும்கூட—வெறுக்காவிட்டால், அவர் என் சீடராக இருக்க முடியாது.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தந்தை, தாய், மனைவி, பிள்ளைகள், சகோதரர், சகோதரிகள், ஏன், தன் உயிரைக்கூட என்னைவிடக் குறைவாக நேசிக்காவிட்டால்.” வினைச்சொல்லின் நேரடிப் பொருள் “வெறுத்தல்.” ஆனால் இச்சூழலில், மிக நெருங்கிய குடும்ப உறவுகளையும்விட இயேசுவுக்கான பற்றுறுதிக்கு முதலிடம் கொடுக்க வேண்டும் என்ற கோரிக்கையை இது வெளிப்படுத்துகிறது; மத்தேயு 10:37-ஐ ஒப்பிடுக.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் ஆத்துமாவையும்கூட.” சீடராக இருப்பதற்கான விலையைப் பற்றிய இச்சூழலில் ψυχή என்பதன் பொருளை “உயிர்” பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: வெறுக்காவிட்டால்
  rationale: கிரேக்க வினைச்சொல்லின் நேரடியான பொருள் ‘வெறுத்தல்.’ இச்சூழலில் இது இயேசுவுக்கான பற்றுறுதி மிக நெருங்கிய குடும்ப உறவுகளையும்விட மேலானதாக இருக்க வேண்டும் என்ற ஒப்பீட்டு வலியுறுத்தலைக் கொண்டிருக்கலாம்; எனினும், மூலத்தின் அதிர்ச்சியூட்டும் வலிமையை முதன்மை உரையில் மென்மையாக்காமல் பாதுகாக்கிறது.
- source_word: ἔρχεται πρός με
  choice: என்னிடம் வந்து
  rationale: πρός με என்பதன் நேரடியான உறவுநோக்கிய இயக்கத்தை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘என்னைப் பின்பற்றி’ என்ற சீடத்துவச் சொற்றொடரைச் சேர்க்கவில்லை.
- source_word: πατέρα ἑαυτοῦ
  choice: தன் தந்தையை
  rationale: ἑαυτοῦ என்பதன் தனிப்பட்ட, தன்னுறவு வலிமையை ‘தன்’ வெளிப்படுத்துகிறது. பட்டியலின் மற்ற குடும்ப உறவுகளுக்கும் தமிழில் இது இயல்பாகப் பொருந்துகிறது.
- source_word: γυναῖκα
  choice: மனைவியை
  rationale: குடும்ப உறுப்பினர்களின் இப்பட்டியலில் γυνή என்பதற்கான சூழல்சார் பொருள் ‘மனைவி’; பொதுவான ‘பெண்’ அல்ல.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: சகோதரர்களையும் சகோதரிகளையும்
  rationale: மூலத்தில் ஆண் மற்றும் பெண் உடன்பிறப்புகள் தனித்தனியாகக் குறிப்பிடப்படுவதால் இரண்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἔτι τε καὶ
  choice: ஏன், ...கூட
  rationale: பட்டியலின் இறுதி உருப்படியை உச்சக்கட்டமாக வலியுறுத்தும் கிரேக்கச் சேர்க்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψυχὴν ἑαυτοῦ
  choice: தன் உயிரை
  rationale: சீடத்துவத்தின் விலை குறித்த இச்சூழலில் ψυχή ஒருவருடைய உயிர் அல்லது வாழ்வைக் குறிக்கிறது. ‘உயிர்’ என்பது நவீன தமிழில் தெளிவாக இருப்பதோடு, உடலிலிருந்து தனிப்பட்ட ஆத்துமாவைப் பற்றிய குறுகிய கருத்தைத் தேவையின்றி இறக்குமதி செய்யாது.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: என் சீடராக இருக்க முடியாது
  rationale: இது வெறும் தடையை அல்ல, இயேசுவின் சீடத்துவத்தோடு பொருந்தாத இயலாமையை வெளிப்படுத்தும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: μισεῖ என்ற இயேசுவின் கடுமையான சொல்லை முதன்மை உரையில் ஒப்பீட்டு மொழியாக மென்மையாக்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘வெறுக்காவிட்டால்’ என்று வைத்து, ‘குறைவாக நேசிக்காவிட்டால்’ என்ற ஒப்பீட்டு வாய்ப்பை அடிக்குறிப்பில் விளக்குதல்.
  alternative: முதன்மை உரையிலேயே ‘குறைவாக நேசிக்காவிட்டால்’ என்று மொழிபெயர்த்தல்.
  rationale: இயேசுவின் சொல் திட்டமிட்டே கடுமையாக உள்ளது. ஒப்பீட்டு விளக்கம் சூழலில் சாத்தியமானதாயினும், அதை முதன்மை உரையிலேயே பயன்படுத்துவது மூலத்தின் இறுக்கத்தையும் அதிர்ச்சியையும் குறைக்கும். அடிக்குறிப்பு அந்தச் சூழல்சார் பொருளை மறைக்காமல் தருகிறது.
- issue: இவ்வசனத்தில் ψυχή என்பதன் பொருள்
  choice: ‘ஆத்துமா’ என்பதற்குப் பதிலாக ‘உயிர்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘ஆத்துமா’ அல்லது ‘தன்னையே’ என்று மொழிபெயர்த்தல்.
  rationale: சூழல் சீடத்துவத்தின் விலையையும் ஒருவர் தன் உயிர்மீதான இறுதி உரிமையைக்கூட விட்டுக்கொடுப்பதையும் பற்றியது. ‘உயிர்’ என்பது இப்பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; குறிப்பிட்ட ஓர் மனிதவியல் கோட்பாட்டைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வெறுக்காவிட்டால்’ என்ற கடுமையான மூலச்சொல் பாதுகாக்கப்பட்டுள்ளது; அதன் ஒப்பீட்டு அல்லது முன்னுரிமை சார்ந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. பாலினம் தெரியாத τις என்பதற்காக ‘யாராவது’ மற்றும் மரியாதை/பொதுமை கொண்ட ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
