source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: ta
  text: ஒரு ஓய்வுநாளில், பரிசேயர்களின் தலைவர்களில் ஒருவருடைய வீட்டுக்கு உணவு சாப்பிடுவதற்காக[a] அவர் சென்றபோது, அவர்கள் அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அப்பம் சாப்பிடுவதற்காக’; இச்சொற்றொடர் உணவு உண்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரை உன்னிப்பாகக் கவனித்துக்கொண்டிருந்தார்கள்’; கிரேக்கச் சொல் சந்தேகத்துடனோ பகைமையுடனோ கண்காணிப்பதையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: நிகழ்வை அறிமுகப்படுத்தும் இயல்பான தமிழ் வாக்கிய அமைப்பு
  rationale: லூக்காவின் இந்தக் கதை அறிமுகச் சூத்திரத்தைச் சொற்குச் சொல் மொழிபெயர்த்தால் நவீன தமிழில் செயற்கையாக ஒலிக்கும். காலச் சூழலை முதலில் வைத்து நிகழ்வை நேரடியாகத் தொடங்குவது அதன் உரையாடல் பணியை இயல்பாக நிறைவேற்றுகிறது.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: அவர் சென்றபோது
  rationale: ἐν உடன் வரும் பெயர்ச்சொல் தன்மையுள்ள வினையெச்சம் காலத்தைக் குறிக்கிறது; ‘சென்றபோது’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: οἶκόν
  choice: வீட்டுக்கு
  rationale: இது விருந்துண்ணச் சென்ற இடத்தைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: பரிசேயர்களின் தலைவர்களில் ஒருவருடைய
  rationale: ἀρχόντων என்பது தலைமை வகிப்பவர்களைக் குறிக்கிறது. ‘தலைவர்களில் ஒருவர்’ என்பது பலரில் ஒருவரென்ற கிரேக்க அமைப்பையும் பதவிசார் பொருளையும் காக்கிறது.
- source_word: σαββάτῳ
  choice: ஒரு ஓய்வுநாளில்
  rationale: வேற்றுமை உருபு காலத்தைக் குறிக்கிறது. கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததால், கதையில் ஒரு குறிப்பிட்ட ஓய்வுநாள் முதன்முறையாக அறிமுகமாகும் இயல்பை ‘ஒரு’ காக்கிறது.
- source_word: φαγεῖν ἄρτον
  choice: உணவு சாப்பிடுவதற்காக
  rationale: சொல்லுக்கு சொல் ‘அப்பம் சாப்பிட’ என்றாலும், இந்தச் சொற்றொடர் உணவு உண்பதைக் குறிக்கும் மரபுத்தொடர். நவீன வாசகருக்கு இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: παρατηρούμενοι
  choice: கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்
  rationale: வினைச்சொல் கவனமாக உற்றுநோக்குவதைக் குறிக்கிறது; சூழலில் சந்தேகமோ எதிர்ப்போ தொனிக்கலாம். இந்த மொழிபெயர்ப்பு தீய நோக்கத்தை வெளிப்படையாகச் சேர்க்காமல் பதற்றத்தைக் காக்கிறது.
- source_word: αὐτοὶ
  choice: அவர்கள்
  rationale: கிரேக்கப் பதிற்பெயரில் ஓரளவு வலியுறுத்தல் இருந்தாலும், தமிழில் ‘அவர்களே’ என்பது தேவையற்ற எதிர்மறை அல்லது முரண்பாட்டு வலியுறுத்தலை உருவாக்கலாம்; சூழலில் ‘அவர்கள்’ போதுமானது.
theological_decisions:
- issue: இயேசுவை அவர்கள் கவனித்ததில் மறைமுகமான பகைமை இருந்ததா
  choice: அவர்கள் அவரைக் கூர்ந்து கவனித்துக்கொண்டிருந்தார்கள்
  alternative: அவர்கள் அவரை வேவு பார்த்துக்கொண்டிருந்தார்கள்
  rationale: παρατηρέω சந்தேகத்துடனான அல்லது பகைமையான கண்காணிப்பைக் குறிக்கக்கூடும்; ஆனால் இந்த வசனம் அவர்களுடைய நோக்கத்தை வெளிப்படையாக அறிவிக்கவில்லை. ஆகவே பதற்றம் காக்கப்படுகிறது, தீய நோக்கம் உறுதியாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உணவு சாப்பிட’ என்பது பேச்சுவழக்குக்கும் எழுத்துவழக்குக்கும் ஏற்ற இயல்பான வடிவம்; ‘கூர்ந்து கவனித்தல்’ என்பது மூலத்தின் தெளிவான பொருளையும் மறைமுகப் பதற்றத்தையும் அளவுக்கு மீறாமல் தக்கவைக்கிறது.
