  source_fidelity: மூலக் கிரேக்கத்தின் கால உறவு (ἐν τῷ ἐλθεῖν), பரிசேயத் தலைவர்களில் ஒருவரைச் சுட்டும் அமைப்பு, ஓய்வுநாள், விருந்துண்ணுதல், மற்றும் கவனமான கண்காணிப்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ἐγένετο என்ற லூக்காவுக்குரிய நிகழ்வு-அறிமுகச் சூத்திரம் தமிழில் இயல்பான நேரடி கதைத் தொடக்கத்தில் உட்கொள்ளப்பட்டிருப்பது ஏற்றது. παρατηρούμενοι-யில் சாத்தியமான சந்தேக/பகைமைத் தொனியை முதன்மை உரை மிகைப்படுத்தவில்லை.
