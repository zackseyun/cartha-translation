  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பிடித்து’ என்பது தொடுதலின் உடல்ரீதியான தன்மையைக் காக்கிறது; ‘அனுப்பிவிட்டார்’ என்பது சட்டரீதியான விடுதலை என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
