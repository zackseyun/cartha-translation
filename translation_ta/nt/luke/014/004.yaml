  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: ta
  text: ஆனால் அவர்கள் அமைதியாக இருந்தார்கள்.[a] அவர் அந்த மனிதனைப் பிடித்து, குணமாக்கி, அனுப்பிவிட்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதில் சொல்லாமல் இருந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரைப் போகவிட்டார்” அல்லது “அவரை விடுவித்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ஆனால் அவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட திருச்சட்ட அறிஞர்களையும் பரிசேயர்களையும் οἱ குறிக்கிறது; இயேசுவின் கேள்விக்கு அவர்கள் பதிலளிக்காத முரண்பாட்டை δέ காட்டுவதால் ‘ஆனால்’ இயல்பாக உள்ளது.
- source_word: ἡσύχασαν
  choice: அமைதியாக இருந்தார்கள்
  rationale: இங்கு ἡσυχάζω என்பது பதில் சொல்லாமல் இருப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் சுருக்கத்தைக் காக்கும் வகையிலும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπιλαβόμενος
  choice: அந்த மனிதனைப் பிடித்து
  rationale: ἐπιλαμβάνομαι உடல்ரீதியாகப் பற்றிக்கொள்வதை உணர்த்துகிறது. தமிழ் வாக்கியத்தில் சுட்டுப்பெயரின் தொடர்பைத் தெளிவாக்க ‘அந்த மனிதனை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἰάσατο
  choice: குணமாக்கி
  rationale: உடல்நோயைக் குணப்படுத்திய செயலை ἰάομαι தெளிவாகக் குறிக்கிறது.
- source_word: ἀπέλυσεν
  choice: அனுப்பிவிட்டார்
  rationale: ἀπολύω என்பதற்கு விடுவித்தல், போக அனுமதித்தல், அனுப்பிவைத்தல் ஆகிய பொருள்கள் உண்டு; குணமாக்கப்பட்ட மனிதன் அங்கிருந்து அனுப்பப்பட்ட இந்தச் சூழலில் இது இயல்பான தமிழ்.
