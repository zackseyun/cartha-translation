translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான உவமைநடை குன்றாமலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விருந்துண்ணும் நேரம்’ சூழலை வெளிப்படுத்துகிறது; ‘எல்லாம் ஆயத்தமாக இருக்கிறது’ என்பது தமிழின் இயல்பான கூட்டுப்பொருள் வழக்கு.
