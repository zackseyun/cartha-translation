source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: ta
  text: விருந்துண்ணும் நேரத்தில், ஏற்கெனவே அழைக்கப்பட்டிருந்தவர்களிடம், ‘வாருங்கள்; ஏனெனில் எல்லாம் ஏற்கெனவே ஆயத்தமாக இருக்கிறது[a]’ என்று சொல்லும்படி அவர் தமது பணியாளனை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘எல்லாம்’ என்பதற்கான எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; நடுநிலைப் பன்மை வடிவம் கூட்டுப்பொருளாகப் பயன்படுத்தப்பட்டுள்ளது. அல்லது, ‘இப்போது எல்லாம் தயாராக உள்ளது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: இறந்தகால நிகழ்வை இயல்பான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: δοῦλον
  choice: பணியாளனை
  rationale: உவமையின் வீட்டுச் சூழலில் இவரது தூதுப் பணியே முன்னிலைப்படுகிறது; ‘அடிமை’ என்பது சாத்தியமான நேரடி மாற்றாக இருந்தாலும் இங்கு தேவையற்ற சமூக அழுத்தத்தை முன்வைக்கலாம்.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: விருந்துண்ணும் நேரத்தில்
  rationale: δείπνον என்பது மாலை உணவு/விருந்து உணவைக் குறிக்கலாம்; சூழலில் பெரிய விருந்து என்பதால் இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: εἰπεῖν
  choice: சொல்லும்படி
  rationale: ‘அனுப்பினார்’ என்பதுடன் இணைந்து நோக்கத்தைக் காட்டும் இறந்தகால வினையெச்ச அமைப்பாக இயல்பாக அமைகிறது.
- source_word: τοῖς κεκλημένοις
  choice: ஏற்கெனவே அழைக்கப்பட்டிருந்தவர்களிடம்
  rationale: நிறைவு செயல்பாட்டு எச்சம், இவர்கள் இதற்கு முன்பே அழைக்கப்பட்டவர்கள் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἔρχεσθε
  choice: வாருங்கள்
  rationale: பன்மை அழைப்பை மரியாதையுடனும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: என்று சொல்லும்படி அமைந்த மேற்கோளில் காரணத்தைத் தொடரும் குறியீடாக ‘;’க்கு பின் நேரடி செய்தி
  rationale: தமிழில் ‘வாருங்கள்; இப்போது எல்லாம் ஆயத்தமாக இருக்கிறது’ என்ற அமைப்பு வருவதற்கான காரணத்தை இயல்பாக உணர்த்துகிறது; ‘ஏனெனில்’ சேர்த்தால் உரையாடல் சற்றுக் கடினமாகும்.
- source_word: ἤδη
  choice: இப்போது
  rationale: தற்போது ஆயத்தம் முடிந்துவிட்டது என்ற காலநிலையை இயல்பான தமிழில் காட்டுகிறது; ‘ஏற்கெனவே’ என்பதும் சாத்தியம்.
- source_word: ἕτοιμά ἐστιν
  choice: எல்லாம் ஆயத்தமாக இருக்கிறது
  rationale: மூலத்தில் எழுவாய் வெளிப்படையாக இல்லை; நடுநிலைப் பன்மை வடிவம் கூட்டுப்பொருளில் வருவதால், தமிழில் ‘எல்லாம்’ என வழங்குவது இயல்பாகவும் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
