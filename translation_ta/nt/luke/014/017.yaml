  to: விருந்துண்ணும் நேரத்தில், ஏற்கெனவே அழைக்கப்பட்டிருந்தவர்களிடம், ‘வாருங்கள்; ஏனெனில் எல்லாம் ஏற்கெனவே ஆயத்தமாக இருக்கிறது[a]’ என்று சொல்லும்படி அவர் தமது பணியாளனை அனுப்பினார்.
