  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: அழைக்கப்பட்டிருந்த அந்த மனிதர்களில் ஒருவன்கூட என் விருந்தைச் சுவைக்க மாட்டான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இரவு உணவை.” மரபுவழக்கில், “என் பந்தியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: γάρ முந்தைய கூற்றிற்கான விளக்கத் தொடர்பைக் காட்டுகிறது; λέγω ... ὑμῖν என்பதன் நேரடியான தனிப்பட்ட உரையாடல் வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: அந்த மனிதர்களில் ஒருவன்கூட
  rationale: οὐδείς என்பதன் முழுமையான, வலியுறுத்தப்பட்ட மறுப்பையும், ἀνδρῶν என்பதன் ஆண்பால் குறிப்பையும் இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: τῶν κεκλημένων
  choice: அழைக்கப்பட்டிருந்த
  rationale: καλέω என்பதன் perfect passive participle, விருந்திற்கான அழைப்பு ஏற்கெனவே வழங்கப்பட்டிருந்த நிலையைக் குறிக்கிறது; சூழலில் ‘அழைக்கப்பட்ட’ என்பது ‘கூப்பிடப்பட்ட’ என்பதைவிடத் தெளிவு.
- source_word: γεύσεταί
  choice: சுவைக்க மாட்டான்
  rationale: γεύομαι என்பதன் நேரடி சுவைத்தல் உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் விருந்தில் பங்குபெறவே மாட்டான் என்ற வலுவான பொருளையும் சுமக்கிறது.
- source_word: μου τοῦ δείπνου
  choice: என் விருந்து
  rationale: δεῖπνον முக்கிய உணவு, மாலை உணவு, அல்லது விருந்து எனப் பொருள்படலாம். உவமையின் சூழலில் ‘விருந்து’ இயல்பாகவும் விரிவான விருந்துணவு கருத்தைத் தெளிவாகவும் தருகிறது; μου என்பதன் உரிமைச் சுட்டும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: உவமையில் விருந்தளிப்பவரின் முதல் நபர் கூற்றை இறையியல் பொருளாக வெளிப்படையாக மாற்றுவதா
  choice: ‘என் விருந்து’ என்ற முதல் நபர் உரிமைச் சொல்லை அப்படியே வைத்தல்
  alternative: அதை வெளிப்படையாக இறையரசின் விருந்து என்று விளக்குதல்
  rationale: கிரேக்க உரை உவமையின் கதைசொல்லும் குரலையே தருகிறது. மொழிபெயர்ப்பு அதன் இறையியல் பயன்பாட்டைத் தானாகத் தீர்மானிக்காமல், கதைநிலையையும் அதிலுள்ள விலக்குதலின் தீவிரத்தையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஒருவன்கூட’ முழுமையான மறுப்பை இயல்பாக வலியுறுத்துகிறது. அடிக்குறி குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
