review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrast of usefulness for soil and for a manure/dung heap, the indefinite active plural in ‘they throw it outside,’ and the closing singular imperative. However, ‘எருக்குவியல்’ is not sufficiently clear or natural in modern standard Tamil for κοπρίαν.
  naturalness: The sentence structure and closing exhortation are natural. Replacing the uncommon/unclear agricultural expression with ‘சாணக்குவியல்’ gives the concrete agricultural sense in clear contemporary Tamil.
  terminology: ‘நிலம்,’ ‘ஏற்றது,’ and ‘கேட்பதற்குக் காதுகள் உள்ளவன் கேட்கட்டும்’ are suitable. ‘சாணக்குவியல்’ directly conveys κοπρία and avoids possible confusion with ‘எருக்கு’ (a plant) or with a generalized fertilizer term.
  issues:
  - severity: medium
    issue: ‘எருக்குவியல்’ is unclear and not idiomatic enough for modern standard Tamil.
    rationale: κοπρίαν denotes a dung/manure heap. ‘சாணக்குவியல்’ is direct, readily understood, and preserves the earthy agricultural image. The lexical alternative can then note ‘எருக்குவியல்’/‘உரக்குவியல்’ as a manure-heap rendering.
  revised_text: அது நிலத்திற்கும் சாணக்குவியலுக்கும் ஏற்றதல்ல; அதை வெளியே எறிந்துவிடுகிறார்கள். கேட்பதற்குக் காதுகள் உள்ளவன் கேட்கட்டும்.
