id: LUK.14.35
reference: Luke 14:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: ta
  text: அது நிலத்திற்கும் சாணக்குவியலுக்கும் ஏற்றதல்ல; அதை வெளியே எறிந்துவிடுகிறார்கள். கேட்பதற்குக் காதுகள் உள்ளவன் கேட்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆν
  choice: நிலம்
  rationale: இங்கு பயிரிடும் மண் அல்லது நிலமே குறிக்கப்படுகிறது; உலகம் என்ற பரந்த பொருள் அல்ல. வேளாண்மைச் சூழலில் ‘நிலம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κοπρίαν
  choice: எருக்குவியல்
  rationale: இந்தச் சொல் சாணம் அல்லது எரு குவிக்கப்பட்ட இடத்தைக் குறிக்கிறது. ‘எருக்குவியல்’ வேளாண்மைச் சூழலையும் உருவகத்தின் நேரடித்தன்மையையும் காக்கிறது.
- source_word: εὔθετόν
  choice: ஏற்றது
  rationale: பயன்பாட்டுக்கு உகந்தது அல்லது பொருத்தமானது என்ற மதிப்பீட்டுப் பொருளை ‘ஏற்றது’ சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: அதை வெளியே எறிந்துவிடுகிறார்கள்
  rationale: கிரேக்கத்தில் குறிப்பிடப்படாத பன்மை எழுவாயுடன் செயப்பாட்டு வினை உள்ளது. இந்த மொழிபெயர்ப்பு அந்தச் செயல்வடிவத்தையும் வெளியே வீசும் தெளிவான காட்சியையும் காக்கிறது.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: கேட்பதற்குக் காதுகள் உள்ளவன் கேட்கட்டும்
  rationale: கிரேக்கத்தின் ஒருமை ஆண்பால் அமைப்பையும் கட்டளை வலிமையையும் காக்கிறது; அதேவேளையில் இது பொதுவாக அனைவருக்கும் உரிய அழைப்பாகச் சூழலில் விளங்குகிறது.
theological_decisions:
- issue: முடிவிலுள்ள அறிவுறுத்தலில் பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: கேட்பதற்குக் காதுகள் உள்ளவன் கேட்கட்டும்
  alternative: கேட்பதற்குக் காதுகள் உள்ள எவரும் கேட்கட்டும்
  rationale: கிரேக்க உரை இலக்கண ரீதியில் ஆண்பால் ஒருமையில் இருந்தாலும் பொதுவான பிரதிநிதித்துவப் பொருளில் செயல்படுகிறது. மூலத்தின் வடிவத்தைத் தக்கவைத்தபடியே அதன் பொதுவான அழைப்பைச் சூழல் உணர்த்த அனுமதிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேளாண்மை உருவகத்தின் நேரடித்தன்மை மங்காத வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. இறுதி அறிவுறுத்தல் கண்ணியமான கட்டளைத் தொனியில் உள்ளது.
