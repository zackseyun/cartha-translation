reference: Luke 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: ta
  text: 'இயேசு திருச்சட்ட அறிஞர்களிடமும்[a] பரிசேயர்களிடமும் பதிலளித்துக் கூறினார்: “ஓய்வுநாளில் குணமாக்குவது சட்டப்படி அனுமதிக்கப்பட்டதா, இல்லையா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யூதத் திருச்சட்டத்தில் வல்லுநர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: மறுமொழியாக … என்று கேட்டார்
  rationale: கிரேக்கத்தில் வரும் ‘மறுமொழி அளித்து, கூறினார்’ என்ற இரட்டைச் சொல்லாட்சியின் பதிலளிக்கும் நுணுக்கத்தை ‘மறுமொழியாக’ காக்கிறது; நேரடிப் பேச்சு கேள்வியாக இருப்பதால் தமிழில் இயல்பாக ‘என்று கேட்டார்’ என முடிக்கப்படுகிறது.
- source_word: νομικοὺς
  choice: திருச்சட்ட அறிஞர்கள்
  rationale: இவர்கள் நவீன குடியியல் வழக்கறிஞர்கள் அல்ல, யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்றவர்கள் என்பதைத் தெளிவுபடுத்தும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: Φαρισαίους
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: Ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்பட்டதா
  rationale: ஓய்வுநாள் தொடர்பான இக்கேள்வியின் சட்ட-சமய அனுமதி சார்ந்த வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῷ σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: குறிப்பிட்ட சப்தா நாளைக் குறிக்கும் காலப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: θεραπεῦσαι
  choice: குணமாக்குவது
  rationale: நற்செய்தி நூல்களின் குணப்படுத்தல் சூழலில் θεραπεύω என்பதன் உடல்நலம் மீட்டல் பொருளை நேரடியாகக் காக்கிறது.
- source_word: ἢ οὔ
  choice: இல்லையா
  rationale: மாற்றுக் கேள்வியின் திறந்த எதிர்மறை முடிவைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: ஓய்வுநாளில் குணமாக்குவது குறித்த சட்ட-இறையியல் கேள்வியை முடிவுசெய்யாமல் மொழிபெயர்த்தல்
  choice: ஓய்வுநாளில் குணமாக்குவது சட்டப்படி அனுமதிக்கப்பட்டதா, இல்லையா?
  alternative: ஓய்வுநாளில் குணமாக்க அனுமதி உண்டா, இல்லையா?
  rationale: இவ்வசனம் கேள்வியை மட்டுமே முன்வைக்கிறது. இரக்கம், அவசியம், அல்லது இயேசுவின் அதிகாரம் பற்றிய முடிவை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூலத்தின் இறையியல் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திருச்சட்ட அறிஞர்கள்’ என்பது நவீன வழக்கறிஞர்கள் என்ற தவறான புரிதலைத் தவிர்க்கிறது; அடிக்குறிப்பு வரலாற்றுச் சூழலைத் தெளிவுபடுத்துகிறது.
