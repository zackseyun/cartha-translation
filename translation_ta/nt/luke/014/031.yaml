source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: ta
  text: அல்லது, வேறொரு அரசனோடு போரிடச் செல்லும் எந்த அரசன், முதலில் அமர்ந்து, இருபதாயிரம் பேருடன் தனக்கு எதிராக வருகிறவனைப் பத்தாயிரம் பேருடன் எதிர்கொள்ள முடியுமா என்று ஆலோசிப்பதில்லையா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சந்திக்க’. கிரேக்க வினைச்சொல்லை இவ்வாறு நேரடியாக மொழிபெயர்க்கலாம்; இங்கு அது முன்னேறிவரும் படையைப் போரில் எதிர்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: இயேசுவின் உரையில் இரண்டாவது ஒப்புமையை அறிமுகப்படுத்தும் இணைப்புச் சொல்; கேள்வியின் தொடர்ச்சியை இயல்பாகக் காக்கிறது.
- source_word: τίς βασιλεὺς
  choice: எந்த அரசன்
  rationale: பொதுவான வினாவைத் தமிழில் இயல்பான சொல்லமைப்பில் வெளிப்படுத்துகிறது.
- source_word: πορευόμενος
  choice: புறப்படும்
  rationale: ஒரு நோக்கத்துடன் செல்வதைக் குறிக்கிறது; போர் என்ற சூழல் இராணுவப் பயணத்தைத் தெளிவுபடுத்துகிறது.
- source_word: ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: வேறொரு அரசனோடு போரிட
  rationale: வேறொரு அரசனை ஆயுத மோதலில் சந்திக்கச் செல்வதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: முதலில் உட்கார்ந்து ... ஆலோசிக்காமல் இருப்பான்?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் வலிமையையும், செயலுக்கு முன் அமர்ந்து ஆராயும் வரிசையையும் காக்கிறது.
- source_word: εἰ δυνατός ἐστιν
  choice: முடியுமா என்று
  rationale: அனுமதியை அல்ல, செயல் திறன் போதுமா என்பதைப் பற்றிய மதிப்பீட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐν δέκα χιλιάσιν
  choice: தன்னிடமுள்ள பத்தாயிரம் பேரைக் கொண்டு
  rationale: அரசனுக்குக் கிடைக்கும் படைவீரர்களைக் குறிக்கும் கருவி/உடனிகழ்வு பொருளைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ὑπαντῆσαι
  choice: எதிர்கொள்ள
  rationale: அடிப்படையில் ‘சந்திக்க’ எனப் பொருள்படக்கூடிய வினைச்சொல், இப்போர் சூழலில் எதிர்த்துச் சந்திப்பதைக் குறிக்கிறது; ‘எதிர்கொள்ள’ இரு நுணுக்கங்களையும் பெருமளவு காக்கிறது.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: இருபதாயிரம் பேருடன் தனக்கு எதிராக வருகிறவனை
  rationale: பெரிய படையுடன் பகைமையாக முன்னேறும் எதிர் அரசனைத் தெளிவாகக் குறிக்கிறது.
