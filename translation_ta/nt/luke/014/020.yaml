  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: ta
  text: வேறொருவன், “நான் ஒரு பெண்ணைத் திருமணம் செய்துகொண்டேன்; அதனால் என்னால் வர முடியாது” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: வேறொருவன்
  rationale: முந்தையவர்களைத் தொடர்ந்து இன்னொருவர் பதிலளிப்பதை இயல்பாகக் குறிக்கிறது.
- source_word: Γυναῖκα ἔγημα
  choice: நான் ஒரு பெண்ணைத் திருமணம் செய்துகொண்டேன்
  rationale: γυνή என்பது சூழலுக்கேற்ப ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படும்; γαμέω உடன் வருவதால் இங்கு திருமண உறவு தெளிவாகிறது. தமிழில் இந்தச் சொற்றொடர் மூலத்தின் நேரடித் தன்மையையும் இயல்பான நடையையும் காக்கிறது.
- source_word: διὰ τοῦτο
  choice: அதனால்
  rationale: முன்னர் கூறிய திருமணத்தையே வர இயலாததற்கான காரணமாக இணைக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: என்னால் வர முடியாது
  rationale: δύναμαι மற்றும் வினையெச்சத்தின் திறன் அல்லது இயலாமை சார்ந்த பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க இறந்தகால வினையின் எளிய நிகழ்வுப் பொருள் தமிழில் ‘திருமணம் செய்துகொண்டேன்’ என்று நேரடியாக வைக்கப்பட்டுள்ளது.
