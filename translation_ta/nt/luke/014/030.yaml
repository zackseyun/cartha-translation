- from: “இந்த மனிதன் கட்டத் தொடங்கினான்; ஆனால் அதை முடிக்க முடியவில்லை[a]” என்று சொல்வார்கள்.
  to: “இந்த மனிதன் கட்டத் தொடங்கினான்; அதை முடிக்க முடியவில்லை” என்று சொல்வார்கள்.
  rationale: The revision removes an unsupported adversative connector while preserving the Greek sequence of beginning to build and failing to finish. The footnote is recast to convey insufficient strength/capability rather than a change into weakness.
