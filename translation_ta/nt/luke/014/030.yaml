base_translation:
  language: en
  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: ta
  text: “இந்த மனிதன் கட்டத் தொடங்கினான்; அதை முடிக்க முடியவில்லை” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: என்று சொல்வார்கள்
  rationale: முந்தைய வசனத்தில் உள்ள ஏளனம் செய்பவர்களோடு நிகழ்காலப் பங்கேற்புவினையை இயல்பாக இணைக்கிறது; ὅτι அறிமுகப்படுத்தும் நேரடிக் கூற்றைத் தமிழ் மேற்கோள் அமைப்பில் ‘என்று’ வெளிப்படுத்துகிறது.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: இந்த மனிதன்
  rationale: சுட்டுப்பெயரையும் ஆண்பால் ஒருமை பெயர்ச்சொல்லையும் நேரடியாகவும், தேவையற்ற இகழ்ச்சிச் சாயலைச் சேர்க்காமலும் தருகிறது.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: கட்டத் தொடங்கினான்
  rationale: ‘கட்ட ஆரம்பித்தான்’ என்பதைக் காட்டிலும் நவீனத் தரத் தமிழில் இயல்பான வடிவம்; தொடங்கிய செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ἴσχυσεν
  choice: முடியவில்லை
  rationale: இச்சூழலில் ἰσχύω உடல் வலிமையை மட்டும் அல்லாமல் செயலைச் செய்து முடிக்கும் திறனையும் குறிக்கலாம்; ‘முடியவில்லை’ அந்தப் பொதுவான பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐκτελέσαι
  choice: அதை முடிக்க
  rationale: கட்டுமானத்தை நிறைவு செய்வதைக் குறிக்கிறது. தமிழில் விடுபட்ட செயப்படுபொருளைத் தெளிவுபடுத்த ‘அதை’ சேர்ப்பது இயல்பானது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நேரடிக் கூற்று. முந்தைய வசனத்துடன் உள்ள இலக்கணத் தொடர்பைப் பாதுகாக்க இறுதியில் ‘என்று சொல்வார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
