  source_fidelity: The adversative “ஆனால்,” the iterative temporal force in “வைக்கும்போதெல்லாம்,” the hospitality sense of δοχὴν ποιῇς, and the imperative “அழை” are faithfully represented. The four groups remain distinct. However, “நடக்க இயலாதவர்கள்” can imply a total inability to walk, whereas χωλούς denotes those with impaired walking/mobility (traditionally ‘the lame’) and need not imply complete inability.
