base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: ta
  text: ஆனால், நீ விருந்து வைக்கும்போதெல்லாம்[a], ஏழைகளையும், உடல் குறைபாடுள்ளவர்களையும்[b], நடப்பதில் குறைபாடுள்ளவர்களையும், பார்வையற்றவர்களையும் அழை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருந்தளிக்கும்போதெல்லாம்” அல்லது “வரவேற்பு நிகழ்ச்சி நடத்தும்போதெல்லாம்.”
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கிரேக்கச் சொல் உடல் உறுப்புகளில் குறைபாடு அல்லது செயல்திறன் இழப்பு உள்ளவர்களைக் குறிக்கலாம்; “உடல் ஊனமுற்றவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் யாரை அழைக்க வேண்டாம் என்று கூறியதற்கு மாறாக, இப்போது யாரை அழைக்க வேண்டும் என்பதை அறிமுகப்படுத்தும் எதிர்மறை இணைப்புச் சொல்.
- source_word: ὅταν
  choice: போதெல்லாம்
  rationale: குறிப்பிடப்படாத எந்தச் சந்தர்ப்பத்திலும் பொருந்தும் காலப்பொருளையும், மீண்டும் நிகழக்கூடிய தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δοχὴν ποιῇς
  choice: நீ விருந்து வைக்கும்போது
  rationale: வரவேற்பு அல்லது விருந்து ஒன்றை நடத்துதல் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κάλει
  choice: அழை
  rationale: உணவு விருந்தின் சூழலில் καλέω என்பது ஒருவரை வருமாறு அழைப்பதைக் குறிக்கிறது; ஒருமை கட்டளை வடிவமும் காக்கப்படுகிறது.
- source_word: πτωχούς
  choice: ஏழைகளை
  rationale: பொருளாதார வறுமையில் உள்ளவர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἀναπείρους
  choice: உடல் குறைபாடுள்ளவர்களை
  rationale: உடல் உறுப்புகளில் குறைபாடு அல்லது செயல்திறன் இழப்பு உள்ளவர்களைக் குறிக்கும் சொல்லை இழிவுணர்வு ஏற்படுத்தாத நவீன தமிழில் தருகிறது; அடுத்துள்ள χωλούς என்பதோடு முற்றிலும் ஒன்றாக்கவில்லை.
- source_word: χωλούς
  choice: நடக்க இயலாதவர்களை
  rationale: நடப்பதில் கடுமையான குறைபாடு உள்ளவர்களைச் சுட்டுகிறது; ἀναπείρους என்ற பரந்த உடல் குறைபாட்டுச் சொல்லிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: τυφλούς
  choice: பார்வையற்றவர்களை
  rationale: குருடர்களைக் குறிக்கும் கிரேக்கச் சொல்லுக்கு மரியாதையான, பொதுவாகப் புரியும் நவீன தமிழ் வடிவம்.
theological_decisions:
- issue: உடல் குறைபாடுகளைக் குறிக்கும் ἀναπείρους மற்றும் χωλούς ஆகிய சொற்களின் வேறுபாடு
  choice: “உடல் குறைபாடுள்ளவர்கள்” என்றும் “நடக்க இயலாதவர்கள்” என்றும் தனித்தனியாக மொழிபெயர்த்தல்
  alternative: “ஊனமுற்றவர்கள், முடவர்கள்” போன்ற பாரம்பரிய வகைப்பாட்டுச் சொற்களைப் பயன்படுத்துதல்
  rationale: கிரேக்கப் பட்டியலின் தனித்தனி பிரிவுகளைப் பாதுகாக்கும் அதேவேளையில், இன்றைய வாசகர்களுக்கு இயல்பாகவும் மரியாதையாகவும் இருக்கும் மொழியைப் பயன்படுத்துகிறது. எந்தப் பிரிவின் எல்லையையும் மூலத்தைவிடத் துல்லியமாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான பட்டியல் அமைப்பும் ஒருமை கட்டளையும் காக்கப்பட்டுள்ளன; disability தொடர்பான சொற்களில் இழிவாக ஒலிக்கக்கூடிய பழைய வழக்குகள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
