- from: ஒருவர் உன்னை ஒரு திருமண விருந்துக்கு[a] அழைக்கும்போது, பந்தியில் முதன்மையான இடத்தில்[b] சாய்ந்து அமராதே[c]. ஏனெனில், உன்னைவிட அதிக மதிப்புக்குரிய ஒருவர் அவரால் அழைக்கப்பட்டிருக்கக்கூடும்.
