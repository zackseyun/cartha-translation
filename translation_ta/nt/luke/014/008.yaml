  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: ta
  text: ஒருவர் உன்னை ஒரு திருமண விருந்துக்கு[a] அழைக்கும்போது, பந்தியில் மிகுந்த மரியாதைக்குரிய இடத்தில்[b] சாய்ந்து அமராதே[c]; ஒருவேளை உன்னைவிட அதிக மதிப்புக்குரிய ஒருவர் அவரால் அழைக்கப்பட்டிருக்கலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு திருமணத்துக்கு.” கிரேக்கப் பன்மைச் சொல் திருமணக் கொண்டாட்டங்களை, குறிப்பாக விருந்தை, குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, விருந்துப் பந்தியில் மிகுந்த மரியாதைக்குரிய இடம்.
    reason: cultural_note
  - marker: c
    text: பண்டைக்கால முறைப்படியான விருந்துகளில் மக்கள் நிமிர்ந்து உட்காராமல் பொதுவாகச் சாய்ந்து அமர்ந்து உண்பார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: ஒருவர் உன்னை ... அழைக்கும்போது
  rationale: பொதுவான சூழ்நிலையை இயல்பான நவீன தமிழில் கூறுகிறது; விருந்து சார்ந்த இடத்தில் καλέω என்பதற்கு ‘அழை’ பொருத்தமானது.
- source_word: εἰς γάμους
  choice: ஒரு திருமண விருந்துக்கு
  rationale: γάμους என்ற பன்மை வடிவம் திருமண விழாக்களை, குறிப்பாக இச்சூழலில் விருந்தை, குறிக்க முடியும்.
- source_word: μὴ κατακλιθῇς
  choice: சாய்ந்து அமராதே
  rationale: பண்டைய விருந்துகளில் மேசையருகே சாய்ந்தபடி உண்பதைக் குறிக்கும் வினையின் பண்பாட்டு விவரத்தைத் தக்கவைக்கிறது.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: பந்தியில் முதன்மையான இடத்தில்
  rationale: விருந்துப் பந்தியில் உயர்ந்த மரியாதைக்குரிய இடத்தைக் குறிக்கிறது; ‘பந்தி’ உணவுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: μήποτε
  choice: ஏனெனில் ... இருக்கக்கூடும்
  rationale: கட்டளைக்கான எச்சரிக்கை காரணத்தையும் நிகழக்கூடிய அபாயத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐντιμότερός σου
  choice: உன்னைவிட அதிக மதிப்புக்குரிய ஒருவர்
  rationale: ஒப்பீட்டு மரியாதை அல்லது சமூக மதிப்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: அவரால் அழைக்கப்பட்டிருக்கக்கூடும்
  rationale: நிறைவேறிய அழைப்பின் தற்போதைய பொருத்தத்தையும் μήποτε உடனான சாத்திய எச்சரிக்கையையும் தக்கவைக்கிறது; ‘அவரால்’ என்பது அழைத்த நபரைச் சுட்டுகிறது.
