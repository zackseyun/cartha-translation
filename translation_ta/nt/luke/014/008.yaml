review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the invitation, wedding-feast setting, honored seating, and the ancient reclining posture. However, «ஏனெனில்» means “because,” whereas μήποτε introduces a cautionary possibility (“lest/perhaps”), not a stated reason. The warning should therefore be expressed with «ஒருவேளை» or an equivalent.
  naturalness: The Tamil is generally clear and modern. «பந்தியில் முதன்மையான இடம்» is understandable, but «பந்தியில் மிகுந்த மரியாதைக்குரிய இடம்» more directly conveys πρωτοκλισία as the place of greatest honor. «ஒருவேளை ... அழைக்கப்பட்டிருக்கலாம்» is a natural idiom for the final caution.
  terminology: «திருமண விருந்து», «பந்தி», and «சாய்ந்து அமருதல்» suit the meal context and register. «அதிக மதிப்புக்குரியவர்» appropriately conveys the comparative social honor of ἐντιμότερος without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: «ஏனெனில்» is used for μήποτε.
    rationale: This changes the connective from a preventative warning (“lest/perhaps”) to a causal assertion (“because”). Tamil «ஒருவேளை» preserves the source’s contingent warning.
  - severity: low
    issue: «முதன்மையான இடம்» can be read simply as the first place rather than the place of highest honor.
    rationale: πρωτοκλισία denotes the chief or most honored dining place. An explicit honor-based phrase is clearer in modern Tamil.
  revised_text: ஒருவர் உன்னை ஒரு திருமண விருந்துக்கு[a] அழைக்கும்போது, பந்தியில் மிகுந்த மரியாதைக்குரிய இடத்தில்[b] சாய்ந்து அமராதே[c]; ஒருவேளை உன்னைவிட அதிக மதிப்புக்குரிய ஒருவர் அவரால் அழைக்கப்பட்டிருக்கலாம்.
