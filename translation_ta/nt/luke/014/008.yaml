translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. ‘சாய்ந்து அமராதே’ மூலத்தின் பண்பாட்டு படிமத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதை விளக்குகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
