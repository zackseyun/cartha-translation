source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: ta
  text: ஆகவே, உப்பு நல்லது; ஆனால் உப்பும்கூட சுவையற்றுப் போனால்[a], அதற்கு எதனால் சுவையூட்டப்படும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “உப்பு தன் சுவையை இழந்துவிட்டால்” என்றும் மொழிபெயர்க்கலாம். இதற்கான கிரேக்க வினைச்சொல் நேரடியாக “முட்டாளாகிவிடுதல்” என்றும் பொருள்படலாம்; ஆனால் இங்கு உப்பைக் குறிக்கும் சூழலில், அது சுவையற்றுப் போவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: நல்லது
  rationale: உப்பை பொதுவாக நேர்மறையாக மதிப்பிடும் சொல்லாக இருப்பதால், பயன்பாடு அல்லது அழகு என்ற கருத்தை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய போதனையிலிருந்து வரும் முடிவை அல்லது தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἅλας
  choice: உப்பு
  rationale: பழமொழித்தன்மையுடன் பயன்படுத்தப்பட்டுள்ள நேரடியான குறிப்பு; உருவகத்தை விளக்கிப் பரவலாக்காமல் அப்படியே காக்கிறது.
- source_word: ἐὰν δὲ καὶ
  choice: ஆனால் உப்பே ... போனால்
  rationale: δέ-யின் மாறுபாட்டையும் καί தரும் ‘உப்பும்கூட’ என்ற வலியுறுத்தலையும் தமிழில் ‘உப்பே’ என்பதன் மூலம் இயல்பாகக் காக்கிறது.
- source_word: μωρανθῇ
  choice: சுவையற்றுப் போனால்
  rationale: வினைச்சொல் நேரடியாக ‘மடமையாகுதல்’ என்று பொருள்படக்கூடியதாயினும், உப்பைக் குறிக்கும் இச்சூழலில் சுவையிழந்து பயனற்ற தன்மைக்கு மாறுவதைக் குறிக்கிறது.
- source_word: ἐν τίνι
  choice: எதனால்
  rationale: சுவையூட்டுவதற்கான கருவி அல்லது வழிமுறையை வினவும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀρτυθήσεται
  choice: சுவையூட்டப்படும்
  rationale: சமையல் உருவகத்தைத் தக்கவைத்து, ‘மீட்டெடுக்கப்படும்’ போன்ற விளக்கவுரை சார்ந்த சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: உப்பைப் பற்றிய கூற்றின் உருவகப் பொருள்
  choice: சீடத்துவப் பயன்பாட்டை மொழிபெயர்ப்புக்குள் வெளிப்படையாகச் சேர்க்காமல், உப்பைப் பற்றிய உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘சீடர்கள் தங்கள் தனித்தன்மையை இழந்தால்’ என்று விளக்கமாக விரித்துரைத்தல்
  rationale: இந்த வசனத்தின் பயன்பாட்டைச் சுற்றியுள்ள சூழல் வழங்குகிறது; முதன்மை உரையிலேயே அதைத் தீர்மானித்து விடாமல் உருவகத்தின் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘உப்பே’ என்பது மூலத்திலுள்ள வலியுறுத்தலைக் காக்கிறது; ‘சுவையூட்டப்படும்’ என்பது சொல்லாட்சியின் சமையல் உருவகத்தைத் தக்கவைக்கிறது.
