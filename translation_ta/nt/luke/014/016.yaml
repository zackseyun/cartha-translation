lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: அதற்கு அவர் அவனிடம் ... என்று கூறினார்
  rationale: δέ இங்கு முந்தைய பேச்சுக்கான மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது; ‘அதற்கு’ என்பது தேவையற்ற வலுவான முரண்பாட்டைச் சேர்க்காமல் அந்தத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது. αὐτῷ என்பதன் ஆண்பால் ஒருமையும் ‘அவனிடம்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: Ἄνθρωπός τις
  choice: ஒரு மனிதர்
  rationale: τις தரும் குறிப்பிடப்படாத தனிநபர் என்ற பொருளை ‘ஒரு’ இயல்பாக வெளிப்படுத்துகிறது; ஆண்பால் ஒருமையும் தக்கவைக்கப்படுகிறது.
- source_word: ἐποίει
  choice: ஏற்பாடு செய்துகொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வடிவத்தை ‘செய்துகொண்டிருந்தார்’ வெளிப்படுத்துகிறது. விருந்தின் சூழலில் ποιέω என்பதைச் சொற்சொல்லாக ‘செய்தார்’ என்பதற்குப் பதில் ‘ஏற்பாடு செய்தார்’ என்று கூறுவது இயல்பான தமிழ்.
- source_word: δεῖπνον μέγα
  choice: பெரிய விருந்து
  rationale: δεῖπνον அன்றைய முக்கிய உணவைக் குறிக்கிறது; இச்சூழலில் அது விருந்தினர்களுக்காக நடத்தப்படும் முறையான உணவு என்பதால் ‘விருந்து’ இயல்பானது. μέγα என்பதற்கு ‘பெரிய’ நேரடியான இணை.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: அவர் பலரை அழைத்தார்
  rationale: உணவு நிகழ்ச்சியின் சூழலில் καλέω என்பதற்கு ‘அழைத்தார்’ என்பது பொருத்தமானது. πολλούς என்பதன் பொருள் ‘பலரை’ என்பதில் முழுமையாக அடங்குகிறது.
