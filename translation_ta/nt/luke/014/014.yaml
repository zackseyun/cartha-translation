review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future blessedness, the inability to reciprocate, the passive future repayment, and the temporal sense of ἐν τῇ ἀναστάσει. However, ‘அப்போது’ has no counterpart in καὶ and introduces an unwarranted temporal reference. ‘வசதி இல்லை’ can suggest mere convenience rather than inability or lack of means.
  naturalness: The honorific plural is appropriate. ‘பேறுபெற்றவராக இருப்பீர்கள்’ is understandable, but ‘பேறுபெற்றவராவீர்கள்’ is more idiomatic and direct. ‘அவர்களால் ... முடியாது’ is clearer modern Tamil for the intended inability.
  terminology: ‘பேறுபெற்றவர்,’ ‘கைம்மாறு,’ ‘உயிர்த்தெழுதல்,’ and ‘நீதிமான்கள்’ are suitable, dignified modern-standard Tamil renderings. The passive ‘அளிக்கப்படும்’ appropriately leaves the agent unstated.
  issues:
  - severity: medium
    issue: Untranslated/added temporal expression ‘அப்போது’
    rationale: The Greek begins καὶ (‘and’) and contains no temporal adverb. ‘அப்போது’ adds a temporal connection not present in the source.
  - severity: low
    issue: ‘வசதி இல்லை’ may weaken the intended inability
    rationale: Although the Greek ἔχουσιν + infinitive idiomatically expresses inability/lack of means, Tamil ‘வசதி’ may be heard as convenience. ‘அவர்களால் ... முடியாது’ communicates the contextual sense more directly; the note can retain the literal-form nuance.
  revised_text: நீங்கள் பேறுபெற்றவராவீர்கள்; ஏனெனில், உங்களுக்குக் கைம்மாறு செய்ய அவர்களால் முடியாது.[a] நீதிமான்களின் உயிர்த்தெழுதலின்போது[b] உங்களுக்குக் கைம்மாறு அளிக்கப்படும்.
