- from: அப்போது நீங்கள் பேறுபெற்றவராக இருப்பீர்கள்; ஏனெனில், உங்களுக்குக் கைம்மாறு செய்ய அவர்களிடம் வசதி இல்லை.[a] நீதிமான்களின் உயிர்த்தெழுதலின்போது[b] உங்களுக்குக் கைம்மாறு அளிக்கப்படும்.
  to: நீங்கள் பேறுபெற்றவராவீர்கள்; ஏனெனில், உங்களுக்குக் கைம்மாறு செய்ய அவர்களால் முடியாது.[a] நீதிமான்களின் உயிர்த்தெழுதலின்போது[b] உங்களுக்குக் கைம்மாறு அளிக்கப்படும்.
