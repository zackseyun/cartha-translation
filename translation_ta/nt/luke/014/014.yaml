source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: ta
  text: நீங்கள் பேறுபெற்றவராவீர்கள்; ஏனெனில், உங்களுக்குக் கைம்மாறு செய்ய அவர்களால் முடியாது.[a] நீதிமான்களின் உயிர்த்தெழுதலின்போது[b] உங்களுக்குக் கைம்மாறு அளிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களுக்குக் கைம்மாறு செய்வதற்கான வழிவகை அவர்களிடம் இல்லை.’ கிரேக்கத்தில் சொற்சொல்லாக, கைம்மாறு செய்வதற்கு அவர்களிடம் ‘இல்லை’ என்று வருகிறது; இது கடமை இல்லாமையை அல்ல, இயலாமையையோ அதற்கான வழிவகையின்மையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘நீதிமான்களின் உயிர்த்தெழுதலில்.’ இங்கு ‘உயிர்த்தெழுதலின்போது’ என்பது காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: பேறுபெற்றவராக
  rationale: இயேசுவின் பேறுபெற்ற நிலையை அறிவிக்கும் சொல்லாகிய μακάριος என்பதன் இறையியல் மற்றும் வருங்கால நிறைவேற்றச் செறிவை இது காக்கிறது; வெறும் மனநிலையைக் குறிக்கும் ‘மகிழ்ச்சியாக’ என்பதைத் தவிர்க்கிறது.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: உங்களுக்குக் கைம்மாறு செய்ய அவர்களிடம் வசதி இல்லை
  rationale: ‘அவர்களிடம் இல்லை’ என்ற கிரேக்க அமைப்பையும், கடமை இல்லாமையல்ல இயலாமை அல்லது வழிவகையின்மையே கருத்து என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀνταποδοθήσεται ... σοι
  choice: உங்களுக்குக் கைம்மாறு அளிக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பேணுவதோடு, முந்தைய ἀνταποδοῦναι உடன் உள்ள சொல் தொடர்பையும் ‘கைம்மாறு’ என்பதன் மூலம் காக்கிறது; கைம்மாறு அளிப்பவர் யார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἐν τῇ ἀναστάσει
  choice: உயிர்த்தெழுதலின்போது
  rationale: ἐν என்பதன் இங்குள்ள காலக் குறிப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν δικαίων
  choice: நீதிமான்களின்
  rationale: எவர்களோடு உயிர்த்தெழுதல் தொடர்புபடுத்தப்படுகிறது என்பதைச் சுருக்கமாகவும் இறையியல் விளக்கத்தைச் சேர்க்காமலும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘நீதிமான்களின் உயிர்த்தெழுதல்’ என்பதன் காலமும் அமைப்பும்
  choice: எதிர்கால உயிர்த்தெழுதலை நீதிமான்களோடு நேரடியாகத் தொடர்புபடுத்தும் சொற்றொடராகவே மொழிபெயர்க்கப்பட்டது.
  alternative: இது எல்லாருக்கும் பொதுவான ஒரே உயிர்த்தெழுதலில் நீதிமான்களுக்கு அளிக்கப்படும் வலியுறுத்தல் என்றும், மற்றவர்களிடமிருந்து வேறான நீதிமான்களின் உயிர்த்தெழுதல் என்றும் விளக்கப்படலாம்.
  rationale: வசனம் விரிவான இறுதிக்கால நிகழ்வுவரிசையைத் தீர்மானிக்கவில்லை. ஆகவே எந்த ஓர் கோட்பாட்டு அமைப்பையும் மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- issue: கைம்மாறு அளிப்பவர்
  choice: கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பின்பற்றி, கைம்மாறு அளிப்பவர் வெளிப்படையாகப் பெயரிடப்படவில்லை.
  alternative: ‘கடவுள் உங்களுக்குக் கைம்மாறு அளிப்பார்’ என்று வெளிப்படுத்துதல்.
  rationale: இறைச் செயல் சூழலில் உட்குறிப்பாக இருந்தாலும், மூலவசனம் செய்பவரை வெளிப்படையாகக் குறிப்பிடாததால் மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பாக்கியவான்’ போன்ற பாலினக் குறியீடும் பழைய வழக்குச் சாயலும் கொண்ட சொல்லுக்கு மாறாக ‘பேறுபெற்றவர்’ பயன்படுத்தப்பட்டது; ஒருமை ‘நீ’ என்பதைக் கண்ணியமான தமிழில் ‘நீங்கள்’ என வழங்கியது.
