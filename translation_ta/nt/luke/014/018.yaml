    issue: The final idiom ἔχε με παρῃτημένον is rendered as “என்னை மன்னித்துவிடும்படி.”
    rationale: Although “forgive me” can function idiomatically, the Greek asks the host to regard the speaker as excused—i.e., to accept his nonattendance. A Tamil rendering explicitly referring to accepting the absence preserves this contextual force without adding moral-fault overtones.
