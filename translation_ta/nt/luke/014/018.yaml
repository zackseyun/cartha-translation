translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையில் வேண்டுகோளின் மரியாதையைப் பேண ‘உம்மை’ வடிவம் பயன்படுத்தப்பட்டுள்ளது; ‘சாக்கு’ என்ற சொல் காரணங்கள் பொய்யானவை என்று முன்கூட்டியே வலியுறுத்தக்கூடும் என்பதால் அது அடிக்குறிப்பு மாற்றாக வைக்கப்பட்டுள்ளது.
