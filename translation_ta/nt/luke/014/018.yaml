base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: ta
  text: ஆனால் அவர்கள் எல்லாரும் ஒரேபோல[a] காரணம் சொல்லி மறுக்கத் தொடங்கினார்கள்[b]. முதலாமவன் அவனிடம், “நான் ஒரு வயலை வாங்கியிருக்கிறேன்; வெளியே போய் அதைப் பார்க்க வேண்டியிருக்கிறது. நான் வராததை ஏற்றுக்கொள்ளும்படி உம்மைக் கேட்டுக்கொள்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஒன்றிலிருந்து.” இது “அனைவரும் ஒன்றுபோல்” அல்லது “ஒருமனதாக” என்ற பொருளுடைய கிரேக்க மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாக்குச் சொல்லத் தொடங்கினார்கள்.” கிரேக்க வினைச்சொல், ஒரு காரணத்தைக் கூறி அழைப்பை மறுப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலுள்ள அழைப்புக்கு எதிரான மறுமொழியைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἀπὸ μιᾶς ... πάντες
  choice: அவர்கள் எல்லாரும் ஒரேபோல
  rationale: அனைவரும் ஒரே வகையில் அல்லது ஒன்றுபோல் நடந்துகொண்டார்கள் என்ற கிரேக்க மரபுத்தொடரின் கூட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: காரணம் சொல்லி மறுக்கத் தொடங்கினார்கள்
  rationale: அழைப்பை ஏற்காமல், அதற்குக் காரணம் கூறி விலகுதல் என்ற நடுத்தர வினையின் சூழல்சார் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: Ἀγρόν
  choice: ஒரு வயலை
  rationale: வயல் அல்லது நிலப்பகுதி என்ற நேரடியான பொருளைத் தருகிறது; ‘பண்ணை’ என்று மொழிபெயர்ப்பதால் வரக்கூடிய கூடுதல் வேளாண்மை நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: ἠγόρασα
  choice: வாங்கியிருக்கிறேன்
  rationale: முடிந்த வாங்குதல் இப்போதைய சூழ்நிலைக்கு தொடர்புடையதாக இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχω ἀνάγκην
  choice: வேண்டியிருக்கிறது
  rationale: கட்டாயம் அல்லது தேவை என்ற கருத்தை நடப்பு தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: வெளியே போய் அதைப் பார்க்க
  rationale: பங்கேற்புவினையும் வினையெச்ச நோக்கத்தையும் மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது; ‘ஆய்வு செய்ய’ என்பது மூலத்தைவிட வலுவானதாக இருக்கும்.
- source_word: ἐρωτῶ σε
  choice: உம்மைக் கேட்டுக்கொள்கிறேன்
  rationale: வெளிப்படையான வேண்டுகோளையும் மரியாதையான நேரடி உரையையும் பாதுகாக்கிறது.
- source_word: ἔχε με παρῃτημένον
  choice: என்னை மன்னித்துவிடும்படி
  rationale: வர இயலாமையை ஏற்றுக்கொண்டு விலக்கு அளிக்குமாறு விருந்தளிப்பவரிடம் கேட்கும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ πρῶτος
  choice: முதலாமவன்
  rationale: அடுத்தடுத்து கூறப்படும் காரணங்களில் முதல் நபரைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
