source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: ta
  text: அப்படியானால், உங்களில் ஒவ்வொருவரும் தனக்குள்ள எல்லா உடைமைகளையும் துறக்காவிட்டால்[a], என் சீடராக இருக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்மிடம் உள்ள அனைத்தையும் கைவிடாவிட்டால்.” கிரேக்க வினைச்சொல் நேரடியாக “விடைபெறுதல்” என்றும் பொருள்படலாம்; இங்கு உடைமைகள்மீதான தமது உரிமையைத் துறப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: அதுபோலவே
  rationale: முந்தைய இரு எடுத்துக்காட்டுகளோடு இந்த முடிவுரையை இணைத்து, அவற்றின் அடிப்படையில் இதே முடிவு பொருந்துகிறது என்பதைக் காட்டுகிறது.
- source_word: πᾶς ἐξ ὑμῶν
  choice: உங்களில் எவரும்
  rationale: கேட்போரில் ஒவ்வொருவருக்கும் தனித்தனியாக இந்த நிபந்தனை பொருந்துவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: துறக்காவிட்டால்
  rationale: ἀποτάσσομαι என்பதற்கு விடைபெறுதல், கைவிடுதல், உரிமைகோரலைத் துறத்தல் ஆகிய பொருள் நிழல்கள் உள்ளன. இச்சூழலில் உடைமைகள்மீதான பற்றையும் உரிமைகோரலையும் தீர்மானமாக விட்டுவிடுவதை ‘துறத்தல்’ சுருக்கமாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: தமக்குச் சொந்தமான அனைத்தையும்
  rationale: ὑπάρχουσιν இங்கு ஒருவருடைய உடைமைகளைக் குறிக்கிறது; ἑαυτοῦ-வின் தனக்குரிய என்ற வலியுறுத்தலையும் ‘தமக்குச் சொந்தமான’ பிரதிபலிக்கிறது. ‘எவரும் ... தமக்கு’ என்ற அமைப்பு கிரேக்கத்தின் பொதுப்பொருளுடைய ஒருமையை பாலினப் பாகுபாடின்றி இயல்பான தமிழில் காக்கிறது.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: என் சீடராக இருக்க முடியாது
  rationale: இது வெறும் தகாத செயலை அல்ல, சீடராக இருப்பதற்கான இயலாமை அல்லது முடியாமையைத் திட்டவட்டமாகக் கூறுகிறது.
- source_word: μαθητής
  choice: சீடர்
  rationale: இயேசுவைப் பின்பற்றுதல், அவரிடம் கற்றல், அவருடன் கொண்ட உறவு ஆகிய பரிமாணங்களை நற்செய்தி நூல்களின் சூழலில் நிலைபெற்ற தமிழ்ச் சொல்லாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடைமைகள் குறித்த கோரிக்கையின் தன்மை
  choice: அனைத்து உடைமைகள்மீதான பற்றையும் உரிமைகோரலையும் துறக்க வேண்டிய தீவிர அழைப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒவ்வொரு சீடரும் எல்லா உடைமைகளையும் எல்லாச் சூழல்களிலும் நேரடியாகக் கொடுத்துவிட வேண்டும் என்ற கட்டளையாக மொழிபெயர்த்தல்.
  rationale: ἀποτάσσεται என்பது விடைபெறுதல் அல்லது கைவிடுதல் என்ற பொருளையும் கொண்டிருப்பதால், ‘துறத்தல்’ அதன் தீவிரத்தைக் காக்கிறது; அதேவேளையில், மூலவசனம் வெளிப்படையாகத் தீர்மானிக்காத பொருளாதார நடைமுறையை மொழிபெயர்ப்பு கட்டாயப்படுத்துவதில்லை. அடிக்குறிப்பு மாற்றுப் பொருளை வெளிப்படையாக வைக்கிறது.
