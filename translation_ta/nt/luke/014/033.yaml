  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் நற்செய்தி நூலுக்குரிய கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘எவரும் ... தமக்கு’ என்ற ஒருமை அமைப்பு கிரேக்கத்தின் ஒவ்வொருவரையும் தனிப்படுத்தும் வலியுறுத்தலை இயல்பாகக் காக்கிறது.
