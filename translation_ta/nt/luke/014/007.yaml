  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: ta
  text: 'அழைக்கப்பட்டவர்கள் விருந்தில் மரியாதைக்குரிய இடங்களை[a] எப்படித் தேர்ந்தெடுத்துக்கொண்டிருந்தார்கள் என்பதை அவர் கவனித்து, அவர்களிடம் ஓர் உவமையைச் சொல்லிக்கொண்டிருந்தார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முதன்மை இருக்கைகளை.’ கிரேக்கச் சொல், விருந்தில் மிகுந்த மரியாதைக்குரிய இடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: சொன்னார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினை நிகழ்வின் பின்னணியையோ தொடர்ச்சியையோ குறிக்கிறது. தமிழில் அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்தும் இடத்தில் ‘சொன்னார்’ இயல்பாக உள்ளது; ‘சொல்லிக்கொண்டிருந்தார்’ இங்கு தேவையற்ற நீட்சியாகவும் சற்று செயற்கையாகவும் ஒலிக்கும்.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரைத் தொடர்பை மட்டும் குறிக்கிறது. தமிழில் வசனத்தின் இயல்பான தொடரமைப்பே அந்தத் தொடர்பை வழங்குவதால் ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது பொருளை மிகைப்படுத்தும்.
- source_word: τοὺς κεκλημένους
  choice: அழைக்கப்பட்டவர்கள்
  rationale: καλέω என்பதன் நிறைவுற்ற பெயரெச்சம், அழைக்கப்பட்ட நிலையில் இருந்தவர்களைக் குறிக்கிறது. ‘விருந்தினர்கள்’ என்பது சூழலிலிருந்து பெறப்படும் பொருள்; ‘அழைக்கப்பட்டவர்கள்’ மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: παραβολήν
  choice: ஓர் உவமை
  rationale: நற்செய்தி நூல்களில் παραβολή என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணை ‘உவமை’ ஆகும்.
- source_word: ἐπέχων
  choice: கவனித்து
  rationale: அவரது போதனைக்கு காரணமான கூர்ந்த அவதானிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: அவர்கள் நடந்துகொண்ட விதத்தை நேரடியாகக் குறிக்கிறது.
- source_word: τὰς πρωτοκλισίας
  choice: விருந்தில் முதன்மையான இடங்களை
  rationale: இச்சொல் உணவுவிருந்தில் மிகுந்த மரியாதைக்குரிய சாய்விடங்களைக் குறிக்கிறது. ‘முதன்மையான இடங்கள்’ சமூக மரியாதையின் கருத்தை நவீன வாசகருக்குத் தெளிவாக்குகிறது; ‘விருந்தில்’ என்பது சூழலை வெளிப்படையாக்குகிறது.
- source_word: ἐξελέγοντο
  choice: தேர்ந்தெடுத்துக்கொண்டார்கள்
  rationale: இறந்தகாலத் தொடர்வினையையும் இடைநிலை வடிவின் தங்களுக்கான தேர்வு என்ற நுணுக்கத்தையும் தமிழின் ‘தேர்ந்தெடுத்துக்கொண்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγων πρὸς αὐτούς
  choice: அவர்களிடம் ... சொன்னார்
  rationale: அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்தும் கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான தமிழ் வினைத் தொடராக அமைக்கிறது.
