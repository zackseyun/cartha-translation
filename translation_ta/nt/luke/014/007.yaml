review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the invited people, the parable, the observation, and the honored banquet places. However, both Ἔλεγεν and ἐξελέγοντο are imperfects; the Tamil finite forms ‘சொன்னார்’ and ‘தேர்ந்தெடுத்துக்கொண்டார்கள்’ lose the ongoing/background aspect.
  naturalness: The current Tamil is generally clear and modern. Recasting both imperfects with ‘-க்கொண்டிருந்தார்/-க்கொண்டிருந்தார்கள்’ is natural in this scene-setting narrative and avoids treating the observation and teaching as merely completed single acts.
  terminology: ‘உவமை’ is an appropriate standard rendering of παραβολή. ‘மரியாதைக்குரிய இடங்கள்’ communicates πρωτοκλισίας well in contemporary Tamil. The footnote’s ‘முதன்மை இருக்கைகள்’ is a clearer Tamil lexical alternative than the less idiomatic ‘சாய்விடங்கள்.’
  issues:
  - severity: medium
    issue: The imperfect aspect of Ἔλεγεν is not represented.
    rationale: ‘சொன்னார்’ is a completed/simple past form, whereas Ἔλεγεν presents Jesus’ speaking as ongoing or backgrounded action. ‘சொல்லிக்கொண்டிருந்தார்’ preserves this without unnatural literalism.
  - severity: medium
    issue: The imperfect aspect of ἐξελέγοντο is not represented.
    rationale: ‘தேர்ந்தெடுத்துக்கொண்டார்கள்’ reads as a completed action. ‘தேர்ந்தெடுத்துக்கொண்டிருந்தார்கள்’ reflects the ongoing/repeated choosing observed by Jesus.
  - severity: low
    issue: The footnote alternative ‘முதன்மையான சாய்விடங்களை’ is not idiomatic modern Tamil.
    rationale: Although reclining is historically relevant, ‘சாய்விடங்கள்’ is unclear as a designation for banquet seating. ‘முதன்மை இருக்கைகள்’ gives the lexical alternative naturally; the note can explain the banquet setting and honorific sense.
  revised_text: 'அழைக்கப்பட்டவர்கள் விருந்தில் மரியாதைக்குரிய இடங்களை[a] எப்படித் தேர்ந்தெடுத்துக்கொண்டிருந்தார்கள் என்பதை அவர் கவனித்து, அவர்களிடம் ஓர் உவமையைச் சொல்லிக்கொண்டிருந்தார்:'
