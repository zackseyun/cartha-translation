translation_notes:
  register: நவீனத் தரமான, மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. விருந்துச் சூழல் தெளிவாக இருக்க ‘விருந்தில்’ சேர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள மென்மையான δὲ தொடர்புச்சொல்லுக்கு தனியான தமிழ் வார்த்தை சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘முதன்மையான இடங்களை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
