revisions:
- from: உங்களில் யாராவது ஒரு கோபுரத்தைக் கட்ட விரும்பினால், அதை முடிப்பதற்குத் தேவையான வசதி தன்னிடம் இருக்கிறதா என்று முதலில் உட்கார்ந்து செலவைக் கணக்கிடாமல் இருப்பாரா?[a]
  to: உங்களில் யார் ஒரு கோபுரத்தைக் கட்ட விரும்பி, அதை முடிக்கப் போதுமான வளம் தன்னிடம் இருக்கிறதா என்று முதலில் உட்கார்ந்து செலவைக் கணக்கிடாமல் இருப்பார்?[a]
  rationale: The revision retains the Greek rhetorical negative question and sequence of actions, while replacing the ambiguous “வசதி” with “வளம்” and using a more direct Tamil equivalent for “which of you, wanting.” The footnote identifies the compact Greek expression and explains the contextually implied sufficiency without adding doctrinal interpretation.
