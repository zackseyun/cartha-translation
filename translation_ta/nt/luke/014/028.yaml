language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: ta
  text: உங்களில் யார் ஒரு கோபுரத்தைக் கட்ட விரும்பி, அதை முடிக்கப் போதுமான வளம் தன்னிடம் இருக்கிறதா என்று முதலில் உட்கார்ந்து செலவைக் கணக்கிடாமல் இருப்பார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “முடிவுக்காகத் தன்னிடம் இருக்கிறதா என்று.” அதாவது, கட்டுமானத்தை முடிக்கப் போதுமான வளம் தன்னிடம் இருக்கிறதா என்று.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: உங்களில் யாராவது
  rationale: τίς ... ἐξ ὑμῶν என்பது கேட்போரிடம் நேரடியாக முன்வைக்கப்படும், ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. முந்தைய போதனையுடன் உள்ள γάρ தொடர்பைத் தமிழில் தனிச்சொல்லால் வற்புறுத்தாமல், வாக்கியத்தின் தொடர்ச்சியால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: ஒரு கோபுரத்தைக் கட்ட விரும்பினால்
  rationale: θέλων என்பதன் விருப்பம் அல்லது நோக்கம் என்ற பொருளையும், πύργον மற்றும் οἰκοδομῆσαι என்பவற்றின் நேரடி உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: முதலில் உட்கார்ந்து ... கணக்கிடாமல் இருப்பாரா?
  rationale: οὐχί ஆம் என்ற பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவைக் குறிக்கிறது; καθίσας என்பது கணக்கிடுவதற்கு முந்திய செயல் என்பதைத் தமிழ்ச் சொற்றொடர் காக்கிறது.
- source_word: ψηφίζει τὴν δαπάνην
  choice: செலவைக் கணக்கிடு
  rationale: ψηφίζω இங்கு கட்டுமானத்திற்கான செலவை எண்ணிக் கணிப்பதைக் குறிக்கிறது; δαπάνη என்பதற்கு இயல்பான நவீனத் தமிழ் இணை 'செலவு'.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: அதை முடிப்பதற்குத் தேவையான வசதி தன்னிடம் இருக்கிறதா என்று
  rationale: கிரேக்கத்தில் சொல்லுக்கு சொல் 'முடிப்பதற்காக [அவனிடம்] இருக்கிறதா' என்று உள்ளது. சூழலில் போதுமான பொருளாதார வளம் உள்ளதா என்பதே பொருள்; 'தேவையான வசதி' இதை இயல்பாகத் தெரிவிக்கிறது, அதேவேளை அடிப்படை அமைப்பை அடிக்குறிப்பில் தருகிறது.
