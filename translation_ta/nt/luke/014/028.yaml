  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் எதிர்மறை வினாவும் கோபுரம் கட்டும் உருவகமும் காக்கப்பட்டுள்ளன.
