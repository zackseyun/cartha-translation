  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: ta
  text: இல்லாவிட்டால்[a], அவன் அடித்தளம் அமைத்த பிறகு அதை முடிக்க இயலாமல் போனால், அதைப் பார்ப்பவர்கள் அனைவரும் அவனை ஏளனம் செய்யத் தொடங்கக்கூடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவேளை அவன் அடித்தளம் அமைத்த பிறகு, அதை முடிக்க இயலாமல் போனால், அதைப் பார்ப்பவர்கள் அனைவரும் அவனை ஏளனம் செய்யத் தொடங்கிவிடாதபடிக்கு.”
    reason: ἵνα μήποτε என்பதன் எச்சரிக்கை நோக்கத்தையும், ‘ஒருவேளை ... ஆகாதபடிக்கு’ என்ற நேரடியான அமைப்பையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: இல்லாவிட்டால்
  rationale: முந்தைய வசனத்துடன் இணைந்து, தவிர்க்க வேண்டிய விளைவை அறிமுகப்படுத்துகிறது. நவீன தமிழில் எச்சரிக்கைத் தொனியை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் ‘ஒருவேளை ... ஆகாதபடிக்கு’ என்ற சாத்திய நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: அவன் அடித்தளம் போட்ட பிறகு
  rationale: Genitive absolute கட்டுமானம், முக்கிய வினைக்கு முன்னதாக நடந்த செயலைக் குறிக்கிறது. ‘அடித்தளம் போட்ட பிறகு’ கால வரிசையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: μὴ ἰσχύοντος ἐκτελέσαι
  choice: கட்டி முடிக்க முடியாமல் போகும்போது
  rationale: ἰσχύω இங்கு உடல் வலிமையை மட்டும் அல்லாமல் செயலை நிறைவேற்றும் திறனைச் சுட்டுகிறது; கட்டுமானச் சூழலில் ἐκτελέσαι என்பதைக் ‘கட்டி முடிக்க’ என மொழிபெயர்ப்பது பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντες οἱ θεωροῦντες
  choice: அதைப் பார்க்கும் அனைவரும்
  rationale: θεωρέω கவனித்துப் பார்ப்பதைக் குறிக்கிறது. ‘அதை’ என்பது சூழலில் தொடங்கி முடிக்கப்படாத கட்டுமானத்தைச் சுட்டும் இயல்பான தமிழ் சேர்க்கை.
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: அவனை ஏளனம் செய்யத் தொடங்கக்கூடும்
  rationale: ἄρξωνται எச்சரிக்கை அமைப்பிலுள்ள subjunctive என்பதால் சாத்திய விளைவை ‘தொடங்கக்கூடும்’ காக்கிறது. ἐμπαίζωவின் இகழ்ந்து கேலி செய்யும் பொருளை ‘ஏளனம் செய்ய’ கண்ணியமான நடையில் தருகிறது.
