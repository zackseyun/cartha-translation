id: LUK.14.9
reference: Luke 14:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: ta
  text: உன்னையும் அவரையும் அழைத்தவர் வந்து, உன்னிடம், ‘இவருக்கு உன் இடத்தைக் கொடு’ என்று சொல்வார். அப்போது நீ அவமானத்துடன் கடைசி இடத்தைப் பிடிக்கத் தொடங்குவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிகத் தாழ்ந்த இடம்.’ கிரேக்கச் சொற்றொடர் வரிசையில் கடைசி இடத்தையும், இந்த விருந்துச் சூழலில் மரியாதையில் மிகத் தாழ்ந்த இடத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: உன்னையும் அவரையும் அழைத்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்புவினையை இயல்பான தமிழில் வழங்கி, அழைக்கப்பட்ட இருவரையும் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: வந்து, உன்னிடம் ... சொல்வார்
  rationale: இறந்தகாலப் பங்கேற்புவினையும் எதிர்கால முதன்மை வினையும் குறிக்கும் தொடர்ச்சியான செயல்களை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: Δὸς τούτῳ τόπον
  choice: இவருக்கு உன் இடத்தைக் கொடு
  rationale: விருந்துச் சூழலில் மற்றவருக்காகத் தன் இடத்தை விட்டுக்கொடுப்பதே கருத்து; சூழலால் உட்பொருளாகும் ‘உன்’ என்பது தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: μετὰ αἰσχύνης
  choice: அவமானத்துடன்
  rationale: αἰσχύνη குறிக்கும் வெட்கம் மட்டுமல்லாத சமூகத் தாழ்வையும் அவமானத்தையும் இச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν ἔσχατον τόπον
  choice: கடைசி இடம்
  rationale: ἔσχατος என்பதன் அடிப்படைப் பொருளான ‘கடைசி’ என்பதைப் பேணி, விருந்தின் இருக்கை வரிசையில் அது தாழ்ந்த மரியாதை நிலையைக் குறிப்பதைச் சூழலே உணர்த்த அனுமதிக்கிறது.
- source_word: ἄρξῃ ... κατέχειν
  choice: பிடிக்கத் தொடங்குவாய்
  rationale: ‘தொடங்குவாய்’ என்ற கூறை நீக்காமல் காத்து, κατέχω என்பதன் ‘ஒரு இடத்தை எடுத்துக்கொண்டு இருப்பது/வகிப்பது’ என்ற சூழல்சார் பொருளை இயல்பாக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அழைப்பவருக்கும் மற்ற விருந்தினருக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தின் ‘கடைசி/மிகத் தாழ்ந்த’ என்ற பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
