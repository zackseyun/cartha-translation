source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: ta
  text: அப்போது எஜமான் அடிமையிடம், “சாலைகளுக்கும் வேலியோரங்களுக்கும் வெளியே போய், அங்கிருப்பவர்களை உள்ளே வரும்படி வற்புறுத்து[a]; என் வீடு நிரம்பும்படி” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை உள்ளே வருமாறு வலியுறுத்து.” கிரேக்க வினைச்சொல் வலுவானது (“கட்டாயப்படுத்து, அழுத்தமாக வற்புறுத்து”); ஆனால் இந்த உவமையில் அது உடல் வன்முறையைக் குறிக்க வேண்டிய அவசியமில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையின் கதைச்சூழலில் இது வீட்டின் உரிமையாளரைக் குறிக்கிறது; நேரடியான தெய்வீகப் பட்டமாகக் காட்டாமல் அவரது சமூகப் பங்கைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δοῦλον
  choice: அடிமை
  rationale: δοῦλος குறிக்கும் கட்டுப்பட்ட சமூக நிலையை ‘வேலைக்காரன்’ போன்ற மென்மையான சொல்லால் மறைக்காமல் வெளிப்படுத்துகிறது.
- source_word: Ἔξελθε
  choice: போய்
  rationale: முந்தைய கதைச்சூழலில் வீட்டிலிருந்து வெளியே செல்லுதல் தெளிவாக இருப்பதாலும், அடுத்துவரும் இடக்குறிப்புடன் ‘போய்’ என்பது இயல்பான தமிழாக இருப்பதாலும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: ὁδοὺς
  choice: சாலைகள்
  rationale: ஊருக்கு வெளியேயுள்ள போக்குவரத்து வழிகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: φραγμοὺς
  choice: வேலியோரங்கள்
  rationale: φραγμός வேலி அல்லது புதர்வேலியைக் குறிக்கலாம்; மக்கள் காணப்படக்கூடிய எல்லைப்புற இடங்கள் என்ற காட்சியை ‘வேலியோரங்கள்’ இயல்பாகத் தருகிறது.
- source_word: ἀνάγκασον
  choice: வரும்படி வற்புறுத்து
  rationale: வினைச்சொல்லின் வலிமையைத் தக்கவைத்தபடியே, இவ்வுவமையில் உடல் வன்முறை அவசியம் குறிக்கப்படவில்லை என்பதைப் பொருத்தமாக வெளிப்படுத்துகிறது; இன்னும் வலுவான நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἰσελθεῖν
  choice: உள்ளே வரும்படி
  rationale: வீட்டிற்குள் நுழைவதைக் குறிக்கும் இயல்பான தமிழ் கூறு.
- source_word: ἵνα γεμισθῇ
  choice: அப்போதுதான் ... நிரம்பும்
  rationale: கட்டளையின் நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: μου ὁ οἶκος
  choice: என் வீடு
  rationale: விருந்து நடைபெறும் வீட்டையே இங்கு οἶκος குறிக்கிறது; இது நேரடியானதும் சூழலுக்கு ஏற்றதுமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: உவமையில் κύριος என்பதன் பொருள்
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இங்கு அந்தச் சொல் கதை உலகிலுள்ள மனித வீட்டு உரிமையாளரைக் குறிக்கிறது. ‘எஜமான்’ என்பது உவமையின் இறையியல் முக்கியத்துவத்தை மறுக்காமல், இதை நேரடியான தெய்வீகப் பட்டமாக முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: ἀνάγκασον என்பதன் வலிமை
  choice: வரும்படி வற்புறுத்து
  alternative: உள்ளே வரக் கட்டாயப்படுத்து
  rationale: கிரேக்க வினைச்சொல் வலுவானது; எனவே அழைப்பின் தீவிரம் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது. அதேவேளையில், உவமை கூறாத உடல் வன்முறையை மொழிபெயர்ப்பு திணிக்காமல், நேரடியான வலுவான மாற்றை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் கண்ணியமான தொனியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எஜமான்—அடிமை’ என்ற சொற்கள் கதையின் சமூக உறவைத் தெளிவாகக் காட்டுகின்றன; ‘சாலைகள்—வேலியோரங்கள்’ என்பது வெளிய்ப்புற மற்றும் எல்லைப்புற இடங்களின் இணைப்பை இயல்பாகப் பாதுகாக்கிறது.
