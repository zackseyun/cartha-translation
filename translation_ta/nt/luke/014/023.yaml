    issue: «அப்போதுதான்» introduces a restrictive temporal inference.
    rationale: ἵνα γεμισθῇ is a purpose clause and does not say that the house will be filled ‘only then.’ «என் வீடு நிரம்பும்படி» preserves the intended purpose without added emphasis.
  - severity: low
    issue: The footnote’s alternative is oriented opposite to the English audit trail’s nuance.
    rationale: The main text already uses a strong Tamil verb, «வற்புறுத்து». The note should identify a less coercive contextual alternative such as «வலியுறுத்து», while explaining that the Greek verb itself is forceful and does not necessarily denote physical force in this parable.
