review_pass:
  verdict: revise
  source_fidelity: 'The principal renderings are sound: «எஜமான்» appropriately represents κύριος in this parabolic household setting, «அடிமை» reflects δοῦλος, and «வற்புறுத்து» retains the force of ἀνάγκασον without asserting physical violence. However, «அப்போதுதான் என் வீடு நிரம்பும்» adds an unnecessary restrictive/temporal sense (‘only then’) not present in ἵνα γεμισθῇ. The Greek expresses purpose: ‘so that/in order that my house may be filled.’'
  naturalness: The Tamil is clear and modern. «வெளியே போய்» more explicitly represents the outward movement in Ἔξελθε, and «என் வீடு நிரம்பும்படி» is both idiomatic and closer to the Greek purpose clause.
  terminology: «எஜமான்—அடிமை» accurately maintains the household-status relation. «சாலைகள்» and «வேலியோரங்கள்» are natural contextual renderings of ὁδοί and φραγμοί. The footnote should give the softer contextual alternative (‘urge strongly’) rather than presenting the more coercive wording as the alternative to an already moderated main-text rendering.
  issues:
