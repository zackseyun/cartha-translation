- from: அப்போது எஜமான் அடிமையிடம், “சாலைகளுக்கும் வேலியோரங்களுக்கும் போய், அங்கிருப்பவர்களை உள்ளே வரும்படி வற்புறுத்து[a]; அப்போதுதான் என் வீடு நிரம்பும்” என்றான்.
