source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: ta
  text: வேலைக்காரன் திரும்பி வந்து, இவற்றைத் தன் எஜமானனிடம்[a] தெரிவித்தான். அப்போது வீட்டின் தலைவர் கோபமடைந்து தன் வேலைக்காரனிடம், “நகரத்தின் அகன்ற தெருக்களுக்கும் சந்துகளுக்கும் உடனே போய், ஏழைகளையும் உடல் குறைபாடுள்ளவர்களையும்[b] பார்வையற்றவர்களையும் நடக்க இயலாதவர்களையும் இங்கே அழைத்துக்கொண்டு வா” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “எஜமானன்” என மொழிபெயர்க்கப்பட்ட κύριος என்ற சொல், வேலைக்காரனின் மனிதத் தலைவரைக் குறிக்கிறது; கடவுளைக் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “உடல் ஊனமுற்றவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: திரும்பி வந்து
  rationale: முந்தைய பணியைச் செய்துவிட்டு வேலைக்காரன் வந்து தகவல் தெரிவிக்கும் கதைச் சூழலில், திரும்பி வருதல் உட்பொருளாக உள்ளது; இயல்பான தமிழில் அதைத் தெளிவாக்குகிறது.
- source_word: δοῦλος
  choice: வேலைக்காரன்
  rationale: வீட்டுச் சூழலில் கீழ்ப்பட்டு பணிபுரிபவரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; இங்கு அடிமை நிலையைவிட அவரது பணிப் பங்கே முன்னிலையில் உள்ளது.
- source_word: ἀπήγγειλεν
  choice: தெரிவித்தான்
  rationale: தன் மேலதிகாரியிடம் செய்தியை எடுத்துரைப்பதைக் குறிக்கும் இயல்பான வினைச்சொல்.
- source_word: κυρίῳ
  choice: எஜமானனிடம்
  rationale: இங்கு கடவுளைக் குறிக்கும் பட்டம் அல்லாமல் வேலைக்காரனின் மனிதத் தலைவரைக் குறிக்கிறது. 'எஜமானன்' அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ταῦτα
  choice: நடந்தவற்றை
  rationale: முன்னர் சொல்லப்பட்ட மறுப்புகளையும் நிகழ்வுகளையும் சுட்டும் பன்மைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὀργισθεὶς
  choice: கோபமடைந்து
  rationale: பேசுவதற்கு முன் ஏற்பட்ட எதிர்வினையையும் கோபம் உருவான நுணுக்கத்தையும் காக்கிறது.
- source_word: οἰκοδεσπότης
  choice: வீட்டின் தலைவர்
  rationale: வீட்டுக்கும் குடும்ப நிர்வாகத்துக்கும் தலைவரானவரைக் குறிக்கும் மூலச்சொல்லை நவீன, இயல்பான தமிழில் தருகிறது; κύριος என்பதிலிருந்து சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: Ἔξελθε ταχέως
  choice: உடனே போய்
  rationale: வெளியே செல்வதற்கான கட்டளையையும் அதன் அவசரத்தையும் இயல்பான தமிழ் கட்டளை நடையில் தருகிறது.
- source_word: πλατείας
  choice: அகன்ற தெருக்கள்
  rationale: அகலமான பொதுத் தெருக்கள் என்ற பொருளைக் காத்து, அடுத்துள்ள குறுகிய சந்துகளோடு உள்ள வேறுபாட்டைக் காட்டுகிறது.
- source_word: ῥύμας
  choice: சந்துகள்
  rationale: நகரத்தின் சிறிய அல்லது குறுகிய வழித்தெருக்களைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: πτωχούς
  choice: ஏழைகள்
  rationale: பொருளாதார வறுமையில் உள்ளவர்களைக் குறிக்கும் நேரடியான, பொதுவான தமிழ் வடிவம்.
- source_word: ἀναπείρους
  choice: உடல் குறைபாடுள்ளவர்கள்
  rationale: உடலில் கடுமையான இயலாமை அல்லது ஊனம் உள்ளவர்களைக் குறிக்கும் மூலச்சொல்லை மரியாதையான நவீனத் தமிழில் தருகிறது; 'உடல் ஊனமுற்றவர்கள்' என்பதும் சாத்தியம்.
- source_word: τυφλούς
  choice: பார்வையற்றவர்கள்
  rationale: பார்க்க இயலாதவர்களைக் குறிக்கும் தெளிவான, மரியாதையான நவீனத் தமிழ் வடிவம்.
- source_word: χωλούς
  choice: நடக்க இயலாதவர்கள்
  rationale: கால் பாதிப்பால் நடப்பதில் இயலாமை உள்ளவர்களைக் குறிக்கும்; ἀναπείρους என்பதுடன் தேவையற்ற சொல் மீளலைத் தவிர்த்து வேறுபாட்டைக் காக்கிறது.
- source_word: εἰσάγαγε ὧδε
  choice: இங்கே அழைத்துக்கொண்டு வா
  rationale: அவர்களை இவ்விடத்திற்குள் கூட்டிவர வேண்டும் என்ற கட்டளையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: வேலைக்காரன்
  alternative: அடிமை
  rationale: இந்த வசனத்தில் சட்ட அல்லது சமூக அடிமை நிலையைவிட வீட்டுத் தலைவரின் கட்டளையை நிறைவேற்றும் பணிப் பங்கு முன்னிலைப்படுகிறது. ஆகவே இயல்பான வாசிப்புக்காக 'வேலைக்காரன்' தேர்ந்தெடுக்கப்பட்டது; மூலச்சொல்லின் பரந்த பொருள் மறுக்கப்படவில்லை.
- issue: மனிதத் தலைவரைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமானன்
  alternative: ஆண்டவர்
  rationale: இங்கு குறிக்கப்படுபவர் உவமையில் வரும் மனிதத் தலைவர்; கடவுளைக் குறிக்கும் பட்டமாகப் புரிந்துகொள்ளக் கூடாது. எனவே 'எஜமானன்' தேர்ந்தெடுக்கப்பட்டு, οἰκοδεσπότης என்பது தனியாக 'வீட்டின் தலைவர்' என்று மொழிபெயர்க்கப்பட்டது.
- issue: ἀνάπηρος மற்றும் χωλός ஆகிய இரு வகைகளின் வேறுபாடு
  choice: உடல் குறைபாடுள்ளவர்கள் / நடக்க இயலாதவர்கள்
  alternative: உடல் ஊனமுற்றவர்கள் / கால் ஊனமுற்றவர்கள்
  rationale: மூலத்தில் தனித்தனியாகக் குறிப்பிடப்படும் இரு குழுக்களையும் ஒன்றாகக் கலக்காமல், நவீன மரியாதையான மொழியில் வேறுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் உவமைக்குரிய கண்ணியமான நடையுடனும் அமைக்கப்பட்டது. மாற்றுத்திறனைக் குறிக்கும் சொற்களில் இழிவான பழைய வழக்குகளைத் தவிர்த்து, மூலத்தில் உள்ள வகை வேறுபாடு காக்கப்பட்டது.
