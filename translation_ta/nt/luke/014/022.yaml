  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: ta
  text: அந்தப் பணியாள்[a], “எஜமானே[b], நீங்கள் கட்டளையிட்டது நிறைவேறிவிட்டது; இன்னும் இடம் இருக்கிறது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அடிமை.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “ஆண்டவரே.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: பணியாள்
  rationale: இல்லத் தலைவரின் அதிகாரத்திற்குக் கீழ்ப்பட்டவரை இயல்பான தமிழில் குறிக்கிறது. கிரேக்கச் சொல் ‘அடிமை’ என்றும் பொருள்படக்கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் விளி வடிவத்தையும் மரியாதையுடனான நேரடி அழைப்பையும் காக்கிறது. உவமையின் இல்லச் சூழலில் ‘எஜமானே’ என்பதும் சாத்தியம்.
- source_word: γέγονεν
  choice: செய்யப்பட்டுவிட்டது
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளை நிறைவேற்றப்பட்டு, அதன் விளைவு இப்போதும் நிலவுவதை கிரேக்க நிறைவுக்கால வடிவத்துக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: ὃ ἐπέταξας
  choice: நீங்கள் கட்டளையிட்டது
  rationale: ἐπιτάσσω என்பதிலுள்ள அதிகாரபூர்வமான கட்டளையின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔτι
  choice: இன்னும்
  rationale: கட்டளை நிறைவேற்றப்பட்ட பின்னரும் இடம் மீதமிருப்பதை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: τόπος
  choice: இடம்
  rationale: விருந்து நடைபெறும் சூழலில் மேலும் ஆட்களைச் சேர்க்கக்கூடிய இடவசதியைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: κύριε என்பது தெய்வீகப் பட்டமா அல்லது இல்லத் தலைவருக்கான அழைப்பா
  choice: முதன்மை உரையில் ‘ஆண்டவரே’ என வழங்கி, சூழலுக்கேற்ற ‘எஜமானே’ என்பதைக் அடிக்குறிப்பில் தருதல்
  alternative: எஜமானே
  rationale: இது உவமைக்குள் இல்லத் தலைவரை நோக்கிச் சொல்லப்பட்டாலும், κύριος என்ற சொல்லின் வழக்கமான ‘ஆண்டவர்’ பொருளை நீக்காமல், இல்ல அதிகாரத்தைக் குறிக்கும் மாற்று வாசிப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையுடனும் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நேரடி உரைநடையும், கட்டளை நிறைவேறிய பின்பும் இடம் மீதமிருப்பதையும் இயல்பாகப் பாதுகாக்கிறது.
