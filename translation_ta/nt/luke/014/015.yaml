source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: ta
  text: அவரோடு பந்தியில் சாய்ந்திருந்தவர்களில் ஒருவர் இவற்றைக் கேட்டபோது, அவரிடம், “இறைவனுடைய அரசில் அப்பம்[b] உண்பவர் பேறுபெற்றவர்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனுடைய அரசில் அப்பம் உண்பவர் மகிழ்ச்சியானவர்.”
    reason: lexical_alternative
  - marker: b
    text: மூலமொழியில் நேரடியாக “அப்பம் உண்பவர்” என்று உள்ளது. இது உணவைப் பகிர்ந்து உண்ணுவதைக் குறிக்கும் இயல்பான கிரேக்க மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழ் காலத் துணைவாக்கியமாகக் காட்டுகிறது.
- source_word: δέ
  choice: சூழலுக்குள் இயல்பான தொடர்ச்சியாக வெளிப்படுத்தப்பட்டது
  rationale: இங்கு மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது; தனியாக ‘ஆனால்’ எனச் சேர்ப்பது தமிழில் தேவையற்ற வலுவான முரண்பாட்டை உண்டாக்கலாம்.
- source_word: τις τῶν συνανακειμένων
  choice: அவரோடு பந்தியில் சாய்ந்திருந்தவர்களில் ஒருவர்
  rationale: பெயர் குறிப்பிடப்படாத ஒருவரையும், பண்டைய விருந்தின் சாய்ந்து உண்ணும் நிலையையும் பாதுகாக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்பு இயேசு கூறிய பல கருத்துகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் ... என்றார்
  rationale: கிரேக்க உரையாடல் சூத்திரத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: Μακάριος
  choice: பேறுபெற்றவர்
  rationale: வெறும் மனநிலையான மகிழ்ச்சியைக் காட்டாமல், இறைவனின் நன்மைக்கும் வரவிருக்கும் அரசில் பங்கேற்பதற்கும் உரிய ஆழத்தைத் தக்கவைக்கிறது.
- source_word: ὅστις
  choice: உண்பவர்
  rationale: பொதுப்பொருளுள்ள உறவுப்பெயரை தமிழில் இயல்பான பெயரெச்ச வடிவில் வழங்குகிறது.
- source_word: φάγεται
  choice: உண்பவர்
  rationale: தமிழ் நிகழ்காலப் பெயரெச்சம் இங்கு பொதுவான எதிர்காலப் பங்கேற்பை இயல்பாகக் குறிக்கிறது; அரசின் வருங்காலச் சூழல் அதைக் தெளிவாக்குகிறது.
- source_word: ἄρτον
  choice: உணவு
  rationale: ‘அப்பம் உண்பது’ என்ற கிரேக்க மரபுத்தொடர் ஒரு விருந்தில் உண்பதைக் குறிக்க முடியும்; நவீன தமிழில் ‘உணவு உண்பது’ அந்தப் பொருளை இயல்பாகத் தருகிறது, நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: இறைவனுடைய அரசில்
  rationale: முன்னிடைத் தொடரை நேரடியாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘விருந்து’ என்ற கருத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: எதிர்கால இறையரசு விருந்து குறித்த கூற்றில் Μακάριος என்பதன் வலிமை
  choice: பேறுபெற்றவர்
  alternative: மகிழ்ச்சியானவர்
  rationale: இக்கூற்று ஒருவரின் உளவியல் மகிழ்ச்சியை மட்டும் அல்லாமல், இறைவனுடைய அரசில் பங்கேற்கும் அருள்நிலையையும் நல்வாய்ப்பையும் குறிக்கிறது.
- issue: ‘இறைவனுடைய அரசில்’ என்பது ஆட்சியையா இடத்தையா குறிக்கிறது
  choice: இறைவனுடைய அரசில்
  alternative: இறைவனுடைய ஆட்சியில்
  rationale: ἐν என்ற சொல்லுடன் வரும் விருந்து உருவகம் பங்கேற்பின் களத்தை முன்வைக்கிறது; ‘அரசு’ என்பது இடமும் ஆட்சியும் சார்ந்த மூலத்தின் நெகிழ்வை ஓரளவு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பந்தியில் சாய்ந்திருந்த’ என்பது பண்டைய உணவுமுறையைத் தெளிவாக வைத்திருக்கிறது; ‘பேறுபெற்றவர்’ என்பது இயல்பான தமிழோடு வாழ்த்துரையின் இறையியல் எடையையும் காக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
