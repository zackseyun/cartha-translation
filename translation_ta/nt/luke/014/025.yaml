  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: ta
  text: 'பல மக்கள் கூட்டங்கள் அவரோடு பயணம் செய்துகொண்டிருந்தன[a]; அவர் திரும்பி அவர்களிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெருந்திரளான மக்கள் அவரோடு சென்றுகொண்டிருந்தனர்.” கிரேக்க வாசகம், இயேசுவுடன் பயணித்த மக்கள் கூட்டங்கள் ஏராளமாக இருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: அவரோடு பயணம் செய்துகொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடந்த கடந்தகாலச் செயலைக் குறிக்கும் imperfect வடிவத்தையும், வழியில் உடன் சென்றனர் என்ற accompaniment பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டை அல்ல, மென்மையான கதைத் தொடர்ச்சியை மட்டுமே குறிக்கிறது; தமிழில் தனி இணைப்புச்சொல் இல்லாமலேயே இயல்பாகப் பாய்கிறது.
- source_word: αὐτῷ
  choice: அவரோடு
  rationale: கிரேக்கப் பிரதிப்பெயரையும் உடன்செல்லும் உறவையும் காக்கிறது; சூழலில் இயேசுவே குறிக்கப்படுவது தெளிவு.
- source_word: ὄχλοι πολλοί
  choice: மக்கள் பெருங்கூட்டமாக
  rationale: பலர் கூட்டங்களாக உடன் சென்றனர் என்ற கருத்தை, செயற்கையான ‘பல கூட்டங்கள்’ என்பதற்குப் பதிலாக இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καὶ
  choice: அவர்
  rationale: தமிழில் புதிய வாக்கியத் தொடக்கத்தின் மூலம் நிகழ்வுகளின் தொடர்ச்சி இயல்பாக வெளிப்படுவதால் இணைப்புச்சொல் வெளிப்படையாகத் தேவையில்லை.
- source_word: στραφεὶς
  choice: திரும்பி
  rationale: அவர் திரும்பிய பின் பேசிய நிகழ்வுத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது; ‘திரும்பிப் பார்த்து’ போன்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: εἶπεν
  choice: சொன்னது
  rationale: λέγω என்பதற்கான இயல்பான கதைநடைத் தமிழ்; அடுத்து நேரடி உரை வருவதைக் காட்டும் வகையில் அமைந்துள்ளது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதைத் தெளிவாகக் காட்டி, கிரேக்கப் பிரதிப்பெயரைப் பாதுகாக்கிறது.
