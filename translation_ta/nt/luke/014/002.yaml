  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: ta
  text: மேலும், இதோ, உடலில் நீர் தேங்கும் நோயால் பாதிக்கப்பட்ட ஒருவர்[a] அவருக்கு முன்பாக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இது ஒரே பெயரடையாக உள்ளது; ‘நீர்க்கோவை நோயுள்ள ஒருவர்’ என்றும் மொழிபெயர்க்கலாம். இந்நிலை உடலில் அளவுக்கு அதிகமாகத் திரவம் தேங்கி வீக்கம் ஏற்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனியாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் வசனத் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ எனச் சேர்ப்பது இயல்பற்றதாகவோ, மூலத்தில் வெளிப்படையாக இல்லாத காலநுணுக்கத்தைப் புகுத்துவதாகவோ அமையும்; ἰδοὺ உடன் வரும் கதைத்தொடர்பு இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, நிகழ்வை உயிரோட்டமாக முன்வைக்கும் கிரேக்கச் சொல்லின் உரையாடல் வலிமையை இயல்பான, மரியாதையான தமிழில் காக்கிறது.
- source_word: ἄνθρωπός τις
  choice: மனிதர் ஒருவர்
  rationale: குறிப்பிட்டவராயினும் பெயர் சொல்லப்படாத ஒருவரை அறிமுகப்படுத்தும் τις என்பதன் நுணுக்கத்தைத் தமிழின் இயல்பான ‘ஒருவர்’ கட்டமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: εἰμί என்பதன் இறந்தகாலத் தொடர்நிலையை எளிமையாகக் காட்டுகிறது; மனிதரைக் குறிக்கும் மரியாதை விகுதி நவீனத் தமிழில் இயல்பானது.
- source_word: ὑδρωπικὸς
  choice: உடலில் நீர் தேங்கும் நோயால் பாதிக்கப்பட்ட
  rationale: அசாதாரணமாக உடலில் திரவம் தேங்கி வீக்கம் ஏற்படும் நிலையைக் குறிக்கும் சொல்லை, இன்றைய சாதாரண வாசகருக்குப் புரியும் வகையில் விளக்கமாகத் தருகிறது; அரிதான ‘நீர்க்கோவை’ என்பதைக் குறிப்பில் வைத்துள்ளது.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: அவருக்கு முன்பாக
  rationale: உடல்ரீதியாக எதிரில் இருப்பதையும் ஒருவரது முன்னிலையில் இருப்பதையும் அனுமதிக்கும் மூலத்தின் இடவியல் மற்றும் சூழ்நிலைத் தெளிவின்மையைப் பாதுகாக்கிறது.
