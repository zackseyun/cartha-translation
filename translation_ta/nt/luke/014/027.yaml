  terminology: ‘சிலுவை’ மற்றும் ‘சீடர்’ நற்செய்தி சூழலுக்கான நிலையான, பொருத்தமான சொற்கள். ‘எனக்குப் பின்னால் வருதல்’ என்பது ἔρχεται ὀπίσω μου என்பதன் இயக்க உருவகத்தைப் பாதுகாக்கிறது; அதை விளக்கமாக ‘பின்பற்றுதல்’ என மாற்றவில்லை.
