  source_fidelity: மூலக் கிரேக்கத்தின் பொதுநிபந்தனை (ὅστις), தன்னுடைய சிலுவையைச் சுமத்தல்/தாங்குதல், இயேசுவுக்குப் பின்னால் வருதல், மற்றும் ‘என் சீடராக இருக்க முடியாது’ என்ற இயலாமை ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘தன்’ என்பது பொதுப்பொருளில் வரும் ஒருமைத் தற்சுட்டைக் காக்கிறது.
