source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: ta
  text: தன் சிலுவையைச் சுமந்துகொண்டு[a] எனக்குப் பின்னால் வராத எவரும் என் சீடராக இருக்க முடியாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் சிலுவையைத் தாங்கிக்கொண்டு.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லடியாக, ‘எனக்குப் பின்னால் வருதல்’; சீடத்துவத்தைக் குறிக்கும் பொதுவான ‘என்னைப் பின்பற்றுதல்’ என்ற சொல்லாட்சியோடு ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: எவரும்
  rationale: பொதுவான நிபந்தனையை அறிமுகப்படுத்தும் காலவரையற்ற தொடர்புப்பெயரின் அனைவரையும் உள்ளடக்கும் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: βαστάζει
  choice: சுமந்துகொண்டு
  rationale: ‘சுமத்தல்/தாங்குதல்’ என்ற பொருள்களில், சிலுவையை எடுத்துச் செல்லும் தெளிவான உருவகத்தை ‘சுமந்துகொண்டு’ இயல்பாகக் காக்கிறது.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: தன் சிலுவையை
  rationale: ‘சிலுவை’ என்பது σταυρός என்பதற்கான நிலையான சொல்; ‘தன்’ என்பது ஒருமைத் தற்சுட்டுப் பெயரின் தனக்குரிய என்ற வலியுறுத்தலைப் பாலினம் குறிப்பிடாமல் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔρχεται ὀπίσω μου
  choice: எனக்குப் பின்னால் வராத
  rationale: சொல்லடியாக உள்ள ‘எனக்குப் பின்னால் வருதல்’ என்ற நகர்வு உருவகத்தையும் சீடத்துவச் சாயலையும் ‘என்னைப் பின்பற்றுதல்’ என்று முழுமையாக விளக்கிவிடாமல் காக்கிறது.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: என் சீடராக இருக்க முடியாது
  rationale: இது வெறும் தடையை அல்ல, இயலாமை அல்லது பொருந்தாமையைச் சொல்கிறது; தமிழ் வடிவம் அதைப் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μαθητής
  choice: சீடர்
  rationale: நற்செய்தி நூல்களின் சூழலில் அர்ப்பணிப்புடன் ஆசிரியரைப் பின்பற்றிக் கற்கிறவரைக் குறிக்கும் நிலையான, மரியாதையான தமிழ் சொல்.
theological_decisions:
- issue: ἑαυτοῦ என்ற ஒருமை ஆண்பால் தற்சுட்டுப் பெயரின் பொதுப்பொருள்
  choice: பாலினம் குறிப்பிடாத ஒருமைத் தமிழ் வடிவமான ‘தன் சிலுவையை’
  alternative: ‘அவனுடைய சொந்தச் சிலுவையை’
  rationale: கிரேக்கத்தில் இலக்கண ஆண்பால் ஒருமை இருந்தாலும் அது பொதுவாக எவரையும் குறிக்கிறது. தமிழின் ‘தன்’ ஒருமையையும் தற்சுட்டு வலியுறுத்தலையும் காத்து, மூலத்தில் நோக்கமில்லாத உயிரியல் பாலினக் கட்டுப்பாட்டை உருவாக்காது.
- issue: சிலுவை மொழியின் நேரடியான மற்றும் உருவகமான பதற்றம்
  choice: ‘சிலுவை’ என்ற நேரடி சொல்லைத் தக்கவைத்தல்
  alternative: ‘துன்பம்’ அல்லது ‘தியாகம்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: σταυρός மரணதண்டனைக் கருவியையும் சீடத்துவத்தின் விலை, அவமானம், உயிரிழப்பு ஆகிய சாத்தியங்களையும் ஒரே நேரத்தில் எழுப்புகிறது; விளக்கச் சொல் அந்தப் பதற்றத்தைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு புரியும் வகையில் நேரடியாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘எவரும் … வராத’ என்ற அமைப்பு கிரேக்கத்தின் பொதுவான நிபந்தனையைத் தருகிறது. அடிக்குறிப்பு குறிகள் உரையில் இரண்டும் இடம்பெற்றுள்ளன.
