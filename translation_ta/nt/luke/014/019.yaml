  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: ta
  text: வேறொருவன், “நான் ஐந்து ஜோடி எருதுகளை வாங்கியிருக்கிறேன்; அவற்றைச் சோதித்துப் பார்க்கப் போகிறேன். தயவுசெய்து என்னை மன்னித்துவிடுங்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “என்னை விலக்கு அளிக்கப்பட்டவனாகக் கருதுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: வேறொருவன்
  rationale: சாக்குப்போக்குக் கூறும் அழைக்கப்பட்டவர்களின் தொடரில் இன்னொரு நபரை இயல்பாகக் குறிக்கிறது.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: ஐந்து ஜோடி எருதுகள்
  rationale: ζεῦγος என்பது இங்கு வேலைக்காக இணைக்கப்படும் ஒரு ஜோடியைக் குறிக்கிறது; நவீன தமிழில் ‘ஐந்து ஜோடி எருதுகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἠγόρασα
  choice: வாங்கியிருக்கிறேன்
  rationale: இறந்தகால வினை என்றாலும், புதிதாக வாங்கியது தற்போதைய சாக்குப்போக்கிற்குப் பொருத்தமானதாக இருப்பதைத் தமிழின் நிறைவுநிலை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πορεύομαι
  choice: போகிறேன்
  rationale: தற்போதைய பயணம் அல்லது உடனடி நோக்கத்தை எளிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δοκιμάσαι
  choice: சோதித்துப் பார்க்க
  rationale: வாங்கிய எருதுகளின் வேலைத்திறனை முயன்று மதிப்பிடும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐρωτῶ σε
  choice: தயவுசெய்து
  rationale: நேரடியான வேண்டுகோளின் மரியாதைத் தொனியைத் தமிழில் இயல்பாக இணைக்கிறது; தனியாக ‘உம்மைக் கேட்கிறேன்’ என்று மொழிபெயர்ப்பது இச்சூழலில் செயற்கையாக இருக்கும்.
- source_word: ἔχε με παρῃτημένον
  choice: என்னை மன்னித்துவிடுங்கள்
  rationale: தன்னை விருந்திலிருந்து விடுவித்தவனாக ஏற்றுக்கொள்ளுமாறு கேட்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
