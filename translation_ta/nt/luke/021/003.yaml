  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: ta
  text: 'அவர், “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இந்த ஏழை விதவை மற்ற அனைவரையும்விட அதிகமாக இட்டாள்[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “போட்டாள்.”
    reason: ἔβαλεν என்பதன் நேரடியான செயல் நிழலைச் சுட்டுகிறது; முதன்மை உரையில் காணிக்கைச் சூழலுக்கு ஏற்ற ‘இட்டாள்’ பயன்படுத்தப்பட்டுள்ளது.
lexical_decisions:
- source_word: Ἀληθῶς
  choice: உண்மையாகவே
  rationale: இயேசு வலியுறுத்திக் கூறும் உறுதியான அறிவிப்பின் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி அழைப்பையும் அதிகாரத்தோடு கூறும் தன்மையையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: χήρα
  choice: விதவை
  rationale: கணவனை இழந்த பெண்ணைக் குறிக்கும் துல்லியமான, பொதுவாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: πτωχή
  choice: ஏழையான
  rationale: வறுமையைக் குறிக்கிறது; ‘மிகவும் வறிய’ அல்லது ‘ஆதரவற்ற’ என்று வறுமையின் அளவை மூலவசனத்தைவிட அதிகமாகக் குறிப்பிடாமல் இருக்கிறது.
- source_word: αὕτη
  choice: இந்த
  rationale: குறிப்பிட்ட விதவையைச் சுட்டும் மூலமொழியின் சுட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: πλεῖον
  choice: அதிகமாக
  rationale: அளவு சார்ந்த ஒப்பீட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πάντων
  choice: மற்ற அனைவரையும்விட
  rationale: ஒப்பீடு அங்கிருந்த பிற காணிக்கையாளர்களோடு என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἔβαλεν
  choice: இட்டாள்
  rationale: காணிக்கை செலுத்தும் சூழலில் பணத்தை உள்ளே இடுவதைக் கண்ணியமான, இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இவ்வசனத்தில் மீண்டும் சொல்லப்படாத காணிக்கைப் பெட்டியை வெளிப்படையாகச் சேர்ப்பதில்லை.
theological_decisions:
- issue: விதவையின் காணிக்கையைப் பற்றிய ஒப்பீடு
  choice: “மற்ற அனைவரையும்விட அதிகமாக இட்டாள்” என்ற அளவு சார்ந்த ஒப்பீடு
  alternative: “அவர்களில் எவரையும்விட அதிகமாக இட்டாள்” அல்லது “எல்லாரையும்விட அதிகமாக இட்டாள்”
  rationale: πλεῖον πάντων மற்ற காணிக்கையாளர்களோடு ஒப்பிடுகிறது. அடுத்த வசனம் விளக்கும் விகிதாசார காரணத்தை இவ்வசனத்துக்குள் முன்கூட்டியே சேர்க்காமல், இயேசுவின் மதிப்பீட்டிலுள்ள அழுத்தத்தையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைந்துள்ளது. மேற்கோள் இயல்பான தமிழ் வாக்கிய வரிசையில் தரப்பட்டுள்ளது; மூலவசனத்தின் வலியுறுத்தலும் ஒப்பீடும் பாதுகாக்கப்பட்டுள்ளன.
