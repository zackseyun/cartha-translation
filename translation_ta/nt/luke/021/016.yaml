  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: ta
  text: ஆனால், பெற்றோர், சகோதரர்கள்[a], உறவினர்கள், நண்பர்கள் ஆகியோரால்கூட நீங்கள் ஒப்படைக்கப்படுவீர்கள்; அவர்கள் உங்களில் சிலரைக் கொன்றுவிடுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகள்” / “உடன்பிறந்தவர்கள்”; கிரேக்க ஆண்பால் பன்மைச் சொல் சில சூழல்களில் ஆண்களையும் பெண்களையும் உள்ளடக்கிய உடன்பிறந்தவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: நீங்கள் ஒப்படைக்கப்படுவீர்கள்
  rationale: παραδίδωμι என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம். யாரிடம் ஒப்படைக்கப்படுவார்கள் என்பதைச் சேர்க்காமல், பகைமையானவர்களின் கையில் ஒப்படைக்கப்படுதல் என்ற அடிப்படைப் பொருளையும் மூலத்தின் செயப்பாட்டு அமைப்பையும் காக்கிறது; ‘காட்டிக்கொடுக்கப்படுவீர்கள்’ என்பது துரோகத்தின் நுண்பொருளை அளவுக்கு மீறி முன்னிறுத்தக்கூடும்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் உறுதியளிப்பிலிருந்து இங்கு வரும் மென்மையான எதிர்மறைத் திருப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καὶ
  choice: ஆகியோரால்கூட
  rationale: வெளியாரால் மட்டுமல்ல, நெருங்கிய உறவினர்களாலும் நண்பர்களாலும்கூட ஒப்படைக்கப்படுவார்கள் என்ற உயர்த்திக்காட்டும் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: ὑπὸ
  choice: -ஆல்
  rationale: செயப்பாட்டு வினையுடன் வரும் ὑπό, செயலைச் செய்பவர்களைக் குறிக்கிறது; தமிழில் கருவிப்பொருள் வேற்றுமை உருபு இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: γονέων
  choice: பெற்றோர்
  rationale: தந்தை, தாய் இருவரையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: ἀδελφῶν
  choice: சகோதரர்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது. உடன்பிறந்த ஆண்களையும் பெண்களையும் சேர்த்துக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: συγγενῶν
  choice: உறவினர்கள்
  rationale: ஒரே குடும்பம் அல்லது உறவுவட்டத்தைச் சேர்ந்தவர்களைக் குறிக்கும் கிரேக்கச் சொல்லுக்கு தெளிவான, பரந்த, நவீனத் தமிழ் இணை.
- source_word: φίλων
  choice: நண்பர்கள்
  rationale: φίλων என்பதன் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: θανατώσουσιν
  choice: கொன்றுவிடுவார்கள்
  rationale: θανατόω என்பது ஒருவரை மரணமடையச் செய்வதைக் குறிக்கிறது. இந்தத் தமிழாக்கம் திட்டமிட்டுக் கொல்லப்படுதல் என்ற தீவிரத்தைத் தெளிவாகச் சொல்கிறது; கொல்லும் முறையை வரையறுப்பதில்லை.
- source_word: ἐξ ὑμῶν
  choice: உங்களில் சிலரை
  rationale: சொல்லுக்குச் சொல் ‘உங்களிலிருந்து’ என்பதற்குப் பதிலாக, இந்தக் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: உறவுப் பட்டியலில் ἀδελφῶν என்பதன் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / உடன்பிறந்தவர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதேவேளையில், உறவுமுறைச் சூழலில் அது இருபாலரையும் சேர்ந்த உடன்பிறந்தவர்களைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்ற உண்மையான மொழியியல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒப்படைக்கப்படுவீர்கள்’ என்பதால் மூலத்தின் செயப்பாட்டு வடிவமும், யாரிடம் ஒப்படைக்கப்படுவார்கள் என்று சொல்லாமல் விடும் தெளிவின்மையும் காக்கப்படுகின்றன. பட்டியலின் இறுதியில் வரும் ‘ஆகியோரால்கூட’ நெருங்கியவர்களே இதைச் செய்வார்கள் என்ற வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
