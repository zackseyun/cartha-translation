  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ta
  text: வானமும் பூமியும் ஒழிந்துபோகும்; ஆனால் என் வார்த்தைகள் ஒருபோதும் ஒழிந்துபோகாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மொழியில் இங்கு வலியுறுத்தப்பட்ட மறுப்பு (οὐ μή) பயன்படுத்தப்பட்டுள்ளது; அதனால், ‘ஒழிந்துபோகவே போகாது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: வானம்
  rationale: γῆ என்பதோடு இணைந்த இந்தச் சூழலில், படைக்கப்பட்ட பிரபஞ்சத்தின் வானத்தைக் குறிக்கிறது; வெறும் கண்ணுக்குத் தெரியும் ஆகாயத்தை மட்டும் அல்ல. ‘வானமும் பூமியும்’ என்பது இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ἡ γῆ
  choice: பூமி
  rationale: ‘வானமும் பூமியும்’ என்ற இணைப்பில் இது ஒரு குறிப்பிட்ட நிலப்பகுதியை அல்ல, பூமியைப் பிரபஞ்ச அளவில் குறிக்கிறது.
- source_word: παρελεύσονται
  choice: ஒழிந்துபோகும் / ஒழிந்துபோகாது
  rationale: இங்கு παρέρχομαι என்பது இல்லாமற்போதல் அல்லது முடிவுறுதல் என்ற பொருளைத் தருகிறது. இரு அரையடிகளிலும் ஒரே வினைச்சொல்லைப் பயன்படுத்துவது மூலத்தின் வலுவான இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: படைப்பின் நிலையாமைக்கும் இயேசுவின் வார்த்தைகளின் நிலைத்தன்மைக்கும் இடையிலான தெளிவான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: οἱ λόγοι μου
  choice: என் வார்த்தைகள்
  rationale: இங்கு λόγοι என்பது இயேசு கூறிய வார்த்தைகள் அல்லது உரைகளைக் குறிக்கிறது. ‘என் வார்த்தைகள்’ என்பது நேரடியான, இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: οὐ μὴ
  choice: ஒருபோதும் … இல்லை
  rationale: எதிர்கால வினையோடு வரும் οὐ μή வலியுறுத்தப்பட்ட மறுப்பாகும். தமிழில் ‘ஒருபோதும் … இல்லை’ என்ற அமைப்பு அதன் உறுதியான வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் வார்த்தைகள் ஒழிந்துபோகாது என்ற கூற்றின் வலிமை
  choice: ‘ஒருபோதும் ஒழிந்துபோகாது’ என்று வலியுறுத்தப்பட்ட மறுப்பைப் பாதுகாத்தல்
  alternative: ‘ஒழிந்துபோகவே போகாது’
  rationale: οὐ μή சாதாரண மறுப்பைவிட வலிமையானது. ‘ஒருபோதும்’ என்பது அந்த முழுமையான மறுப்பை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் மூலத்தைத் தாண்டிய விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்திலுள்ள எதிர்மறை இணை அமைப்பும் வலியுறுத்தப்பட்ட மறுப்பும் பாதுகாக்கப்பட்டுள்ளன.
