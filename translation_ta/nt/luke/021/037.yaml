  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: ta
  text: பகல் நேரங்களில் அவர் ஆலயத்தில்[a] கற்பித்துவந்தார்; இரவுகளிலோ வெளியே போய், ஒலிவ மலை என்று அழைக்கப்படும் மலையில் தங்கிவந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல், ஆலயத்தின் உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் அதன் முழு வளாகத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இரவைக் கழித்துவந்தார்’; இந்தக் கிரேக்க வினை திறந்த வெளியிலும் தங்குவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: கற்பித்துவந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்து வழக்கமாக நடைபெற்ற செயலைக் குறிக்கும் இந்தக் கூட்டு வினை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰς ἡμέρας
  choice: பகல் நேரங்களில்
  rationale: கால அளவைக் குறிக்கும் பன்மையையும், அடுத்து வரும் இரவு நேரச் செயலுடனான வேறுபாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது; பொதுவான தமிழ் வேதாகம நடையில் ‘ஆலயத்தில்’ இயல்பாக உள்ளது, விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰς δὲ νύκτας
  choice: இரவுகளிலோ
  rationale: பன்மையையும், பகல் நேரச் செயலுக்கு எதிரான வழக்கமான இரவு நேரச் செயலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐξερχόμενος
  choice: வெளியே போய்
  rationale: ஆலயத்திலிருந்து வெளியே செல்வதைக் குறிக்கும் பங்கேற்பு வினையின் தொடர்ச்சியை இயல்பான தமிழில் இணைக்கிறது.
- source_word: ηὐλίζετο
  choice: தங்கிவந்தார்
  rationale: ஒவ்வொரு இரவும் தங்கிய வழக்கமான செயலைக் காட்டுகிறது; திறந்த வெளியில் இரவைக் கழித்திருக்கலாம் என்ற சொல்லின் சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς τὸ ὄρος
  choice: மலையில்
  rationale: தங்குவதற்காக மலையை நோக்கிச் சென்றதன் விளைவான இருப்பிடத்தைத் தமிழ் வழக்குக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: ஒலிவ மலை என்று அழைக்கப்படும் மலை
  rationale: மலையின் பெயரை மொழிபெயர்த்து, ‘அழைக்கப்படும்’ என்ற மூலத்தின் பெயரிடும் அமைப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
