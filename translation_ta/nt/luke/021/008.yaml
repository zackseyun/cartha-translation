reference: Luke 21:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “நீங்கள் வழிதவறிப் போகாதபடி எச்சரிக்கையாக இருங்கள். ஏனெனில் பலர் என் பெயரில் வந்து, ‘நான்தான் அவர்’[a] என்றும், ‘காலம் நெருங்கிவிட்டது’ என்றும் சொல்வார்கள். அவர்களைப் பின்தொடராதீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இருக்கிறேன்.” இது, எதிர்பார்க்கப்பட்டவராக—ஒருவேளை மெசியாவாக—தன்னைக் கூறிக்கொள்ளும் ஒரு பொய்யான உரிமைகோரலைக் குறிக்கலாம்.
    reason: Ἐγώ εἰμι என்பதன் சொல்லுக்குச் சொல் வடிவையும், சூழல் உணர்த்தும் ஆனால் வெளிப்படையாகக் கூறப்படாத அடையாளத்தையும் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: நீங்கள் வழிதவறிப் போகாதபடி எச்சரிக்கையாக இருங்கள்
  rationale: Βλέπετε என்ற விழிப்புணர்வுக்கான கட்டளையையும், πλανάω என்பதிலுள்ள சரியான வழியிலிருந்து விலகுதல் என்ற உருவகத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. கிரேக்கச் செயலப்பாட்டு வடிவத்தின் நோக்கத்தைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரில் வந்து
  rationale: இயேசுவின் பெயர், அதிகாரம் அல்லது அடையாளத்தைத் தமக்குரியதாகக் கூறிக்கொண்டு வருவதைக் குறிக்கும் சொற்றொடரின் பரப்பைத் திறந்தே வைக்கிறது.
- source_word: λέγοντες
  choice: சொல்வார்கள்
  rationale: பொய்யான உரிமைகோரல்களின் உள்ளடக்கத்தை அடுத்துவரும் நேரடிக் கூற்றுகளே விளக்க அனுமதிக்கும் எளிய, மூலத்துக்கு நெருக்கமான மொழிபெயர்ப்பு.
- source_word: Ἐγώ εἰμι
  choice: நான்தான் அவர்
  rationale: விடுபட்டுள்ள பயனிலையைத் தமிழில் இயல்பாக உணர்த்தி, எதிர்பார்க்கப்பட்ட நபர் தானே என்ற உரிமைகோரலைக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மெசியா’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: காலம் நெருங்கிவிட்டது
  rationale: καιρός குறிக்கும் தீர்மானமான அல்லது குறிக்கப்பட்ட காலத்தை ‘காலம்’ எனச் சுருக்கமாகத் தருகிறது; ἤγγικεν என்பதின் நிறைவுற்று தற்போது நிலவும் அண்மையை ‘நெருங்கிவிட்டது’ வெளிப்படுத்துகிறது.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: அவர்களைப் பின்தொடராதீர்கள்
  rationale: அத்தகைய ஏமாற்றுக்காரர்களோடு சேர்ந்து அவர்களுக்குப் பின்னால் செல்ல வேண்டாம் என்ற கட்டளையையும் திசைசார் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பொய்யான உரிமைகோருபவர்களின் சூழலில் Ἐγώ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: நான்தான் அவர்
  alternative: நான் இருக்கிறேன்; நான்தான்; நான்தான் மெசியா
  rationale: இச்சூழலில் இது ஒரு பொய்யான சுய அடையாள உரிமைகோரலாகப் பொருள்படுகிறது. ‘நான்தான் அவர்’ மறைந்துள்ள பொருளை உணர்த்தினாலும், மூலத்தில் இல்லாத ‘மெசியா’ என்பதை நேரடியாகச் சேர்ப்பதில்லை. சொல்லுக்குச் சொல் வடிவின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; மரியாதையும் தெளிவும் கொண்ட நேரடி உரை. ‘என் பெயரில்’ மற்றும் ‘காலம்’ ஆகியவை மூலத்தின் பொருள் பரப்பைத் தேவையின்றிச் சுருக்காமல் வைக்கின்றன. அடிக்குறிப்பு குறி அது விளக்கும் ‘நான்தான் அவர்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
