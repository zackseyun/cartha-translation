  source_fidelity: 'மூலத்தின் தொடரமைப்பும் பொருளும் பெரும்பாலும் காக்கப்பட்டுள்ளன: οὕτως καὶ ὑμεῖς என்பதன் ஒப்புமை மற்றும் வலியுறுத்தல், ὅταν ἴδητε ταῦτα γινόμενα என்பதன் எதிர்காலச் சூழல், γινώσκετε என்பதன் கட்டளை, ἐγγύς ἐστιν என்பதன் அண்மை ஆகியவை சரியாகத் தரப்பட்டுள்ளன. ஆனால் நவீனப் பயன்பாட்டில் ‘கடவுளின் அரசு’ என்பது பெரும்பாலும் ஒரு அரசாங்கத்தைக் குறிக்கக்கூடும்; βασιλεία என்பதன் அரசுரிமை/ஆட்சி மற்றும் அரசாட்சி என்ற பரந்த கருத்தைத் தெளிவாகக் காக்க ‘கடவுளின் அரசாட்சி’ சிறந்தது.'
  naturalness: ‘அதுபோலவே நீங்களும் ... அறிந்துகொள்ளுங்கள்’ இயல்பான கண்ணியமான நவீனத் தமிழ். ‘இவை நடைபெறுவதைப் பார்க்கும்போது’ என்பது நிகழ்ந்துமுடிவதைக் குறிக்கும் ‘நடந்தேறுவதை’ விட γινόμενα-வின் நடைபெறும் நிகழ்வுப் பொருளுக்கு நெருக்கமானதும் இயல்பானதும் ஆகும்.
