source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: ta
  text: அதுபோலவே நீங்களும், இவை நடைபெறுவதைப் பார்க்கும்போது[a], கடவுளின் அரசாட்சி[b] அருகில் இருக்கிறது என்பதை அறிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவை நிகழ்வதைப் பார்க்கும்போது.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளின் அரசு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: அதுபோலவே நீங்களும்
  rationale: முந்தைய உவமையிலிருந்து சீடர்களுக்கான பயன்பாட்டை எடுத்துரைக்கும் தொடரை இயல்பான தமிழில் தருகிறது; வெளிப்படையாக உள்ள ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்களும்’ காக்கிறது.
- source_word: ὅταν ἴδητε
  choice: பார்க்கும்போது
  rationale: எதிர்காலத்தில் நிகழக்கூடிய சூழலைக் குறிக்கும் தொடரை இயல்பாகவும் முன்னறிவிப்பு சூழலுக்கு ஏற்றவாறும் தருகிறது.
- source_word: ταῦτα γινόμενα
  choice: இவை நிகழ்வதை
  rationale: முன்பு கூறப்பட்ட அடையாள நிகழ்வுகளையே சுட்டுகிறது; γινόμενα என்பதன் நிகழ்தல் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: அடையாளங்களின் பொருளை உணர வேண்டும் என்ற கட்டளையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγγύς ἐστιν
  choice: அருகில் இருக்கிறது
  rationale: காலம் அல்லது இடம் எனத் தேவையின்றி வரையறுக்காமல், கிரேக்கச் சொல்லின் அண்மை உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளின் அரசு
  rationale: βασιλεία என்பதில் உள்ள அரசு, ஆளுகை ஆகிய பொருள் பரப்பை முற்றிலும் ‘ஆட்சி’ என்று மட்டும் சுருக்காமல், நவீனத் தமிழில் புரியும்படி தருகிறது.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் ‘கடவுளின் அரசு’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘கடவுளின் அரசு’ என்று வைத்தல்
  alternative: ‘கடவுளின் ஆட்சி’ அல்லது ‘கடவுளின் அரசாட்சி நிறைவேறுவது அருகில் உள்ளது’
  rationale: இவ்வசனம் அரசின் வெளிப்பாடு, நிறைவு, அல்லது நீதிநிறைவேற்றம் ஆகியவற்றில் ஒன்றை மட்டும் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தின் இறையியல் இழுபறியைத் தீர்மானித்து விடாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜ்யம்’ என்ற வடமொழிச் சொல்லுக்கு மாற்றாக ‘அரசு’ தேர்ந்தெடுக்கப்பட்டாலும், ‘ஆட்சி’ என்ற ஒரே பொருளுக்குள் சொற்றொடர் சுருக்கப்படவில்லை. அடிக்குறி குறியீடுகள் அவை விளக்கும் சொற்றொடர்களின் பின்னர் வைக்கப்பட்டுள்ளன.
