id: LUK.21.7
reference: Luke 21:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “ஆசிரியரே, அப்படியானால் இவை எப்போது நிகழும்? இவை நிகழவிருக்கும் போது என்ன அடையாளம் இருக்கும்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: கேட்டார்கள்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த எளிய கேள்விச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: அவர்கள் அவரிடம்… கேட்டார்கள்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் உரையாடலைத் தொடர்ந்து நகர்த்தும் மென்மையான இணைப்பாக உள்ளது; தமிழில் தனி இணைப்புச்சொல் சேர்க்காமல் இயல்பான தொடரால் அதன் பணியை வெளிப்படுத்துவது பொருத்தமானது.
- source_word: λέγοντες
  choice: “…” என்று
  rationale: கேள்வியின் நேரடிக் கூற்றை அறிமுகப்படுத்தும் பங்கேற்புவினையின் செயல்பாட்டை இயல்பான தமிழ் மேற்கோள் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: διδάσκαλος என்பதன் ஆசிரியர் அல்லது கற்பிப்பவர் என்ற பொருளை மரியாதையான, வேதாகமச் சூழலுக்கு ஏற்ற நவீனத் தமிழில் தருகிறது; ‘எஜமானே’ என்ற அதிகப்படியான அதிகாரப் பொருளைச் சேர்க்கவில்லை.
- source_word: πότε οὖν
  choice: அப்படியானால் … எப்போது
  rationale: πότε காலத்தைப் பற்றி கேட்கிறது; οὖν முந்தைய கூற்றிலிருந்து வரும் முடிவை அல்லது தொடர்ச்சியைச் சுட்டுகிறது. ‘அப்படியானால்’ இரண்டாவது நுணுக்கத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ταῦτα ἔσται
  choice: இவை எப்போது நிகழும்
  rationale: εἰμίயின் எதிர்கால வடிவம் இங்கு நிகழ்வுகள் நடைபெறுவதைக் குறிக்கும் மொழிவழக்காக உள்ளது; சொற்சொல்லான ‘இவை எப்போது இருக்கும்’ என்பதைக் காட்டிலும் ‘நிகழும்’ தெளிவான தமிழ்.
- source_word: σημεῖον
  choice: அதற்கான அடையாளம்
  rationale: வரவிருக்கும் நிகழ்வைச் சுட்டிக்காட்டும் ஒன்றை σημεῖον குறிக்கிறது. ‘அடையாளம்’ அதன் பொதுவான மற்றும் தெளிவான தமிழ் இணை.
- source_word: ὅταν
  choice: நிகழவிருக்கும்போது
  rationale: எதிர்கால நோக்குடைய காலத் துணைவாக்கியத்தை ‘போது’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μέλλῃ
  choice: நிகழவிருக்கும்போது
  rationale: μέλλω தெரிவிக்கும் வரவிருக்கும் அல்லது நெருங்கிய நிகழ்வு என்ற நுணுக்கத்தை ‘விருக்கிறது’ பாதுகாக்கிறது; அதன் காலநெருக்கத்தை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: γίνεσθαι
  choice: நிகழ
  rationale: இச்சூழலில் γίνομαι சம்பவங்கள் நடைபெறுவதைக் குறிக்கிறது; ‘நிகழ’ என்பது தெளிவான, dignified modern Tamil rendering.
theological_decisions:
- issue: இறுதிக்காலச் சொற்களும் கால நுணுக்கமும்
  choice: சீடர்கள் ஓர் ‘அடையாளத்தை’ கேட்பதையும், μέλλῃயின் வரவிருக்கும் நிகழ்வு என்ற நுணுக்கத்தையும் பாதுகாத்தல்.
  alternative: μέλλῃ என்பதை பொதுவாக ‘நிகழும்போது’ அல்லது ‘நிகழப்போகும்போது’ என்று மொழிபெயர்த்தல்.
  rationale: வசனம் எதிர்கால நிகழ்வுகளின் காலத்தையும் அவற்றைக் காட்டும் அடையாளத்தையும் கேட்கிறது. ‘நிகழவிருக்கும்போது’ என்பது குறிப்பிட்ட இறுதிக்காலத் திட்டத்தைத் திணிக்காமல் மூலத்தின் காலநெருக்கத் தாக்கத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: இயல்பான நவீனத் தமிழ் கேள்வி அமைப்பு பயன்படுத்தப்பட்டுள்ளது. மரியாதையும் வேதாகம உரையாடலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன; அதேவேளை செயற்கையான சொற்சொல் நடையும் பழமையான வினைமுற்றுகளும் தவிர்க்கப்பட்டுள்ளன.
