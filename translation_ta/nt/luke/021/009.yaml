id: LUK.21.9
reference: Luke 21:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: ta
  text: ஆனால், போர்களையும் குழப்பங்களையும்[a] பற்றிக் கேள்விப்படும்போது, திகிலடையாதீர்கள். ஏனெனில், இவை முதலில் நிகழ வேண்டும்; ஆனால் முடிவு உடனே வராது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமைதியின்மைகளையும்,’ ‘கொந்தளிப்புகளையும்,’ அல்லது ‘ஒழுங்கின்மைகளையும்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘ஆனால் முடிவு உடனே அல்ல.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால், … போது
  rationale: ὅταν எதிர்காலத்தில் நிகழக்கூடிய ஒரு சூழலைக் குறிக்கிறது; δέ இங்கு முந்தைய எச்சரிக்கையிலிருந்து இவ்வாக்கியத்துக்கு நகரும் மென்மையான இணைப்பாக இருப்பதால், ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀκούσητε
  choice: கேள்விப்படும்போது
  rationale: போர்கள் போன்ற நிகழ்வுகளைப் பற்றிய செய்திகள் காதில் விழுவதைக் குறிக்க, நவீன தமிழில் இயல்பான ‘கேள்விப்படும்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πολέμους
  choice: போர்களை
  rationale: ஆயுத மோதல்களைக் குறிக்கும் பன்மைச் சொல்லின் நேரான பொருள்.
- source_word: ἀκαταστασίας
  choice: குழப்பங்களை
  rationale: இச்சொல் அமைதியின்மை, ஒழுங்கின்மை, சமூக அல்லது அரசியல் கொந்தளிப்பு ஆகியவற்றை விரிவாகக் குறிக்கலாம். குறிப்பிட்ட வகை கிளர்ச்சி என்று பொருளைச் சுருக்காமல் இருக்க ‘குழப்பங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: μὴ πτοηθῆτε
  choice: திகிலடையாதீர்கள்
  rationale: வெறுமனே கவலைப்படுவதைவிட, அச்சத்தால் நிலைகுலைவதையோ பீதியடைவதையோ குறிக்கும் வலிமையை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δεῖ γὰρ
  choice: ஏனெனில், … வேண்டும்
  rationale: γάρ விளக்கக் காரணத்தையும், δεῖ நிகழ வேண்டிய அவசியத்தையும் தெரிவிக்கின்றன.
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: இவை முதலில் நிகழ வேண்டும்
  rationale: நிகழ்வுகள் நடைபெறுவதையும் அவை முடிவுக்கு முன் வர வேண்டிய வரிசையையும் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: ஆனால் முடிவு உடனே வராது
  rationale: கிரேக்கத்தில் இறுதி பகுதி வினையின்றி சுருக்கமாக இருந்தாலும், தமிழில் பொருள் இயல்பாகத் தெளிவதற்காக ‘வராது’ சேர்க்கப்பட்டுள்ளது; εὐθέως என்பதன் உடனடித் தன்மையும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: முடிவுக்கால நிகழ்வுகளின் காலவரிசை
  choice: போர்களும் குழப்பங்களும் முதலில் நிகழ வேண்டும்; ஆனால் அவற்றைத் தொடர்ந்து முடிவு உடனே வராது.
  alternative: இந்த நிகழ்வுகள் முடிவுக்கு முந்தைய காலத்துக்குரியவை; அவையே முடிவு அல்ல.
  rationale: இக்குழப்பங்களை முடிவின் உடனடி வருகையோடு சமமாக்க வேண்டாம் என்பதே வசனத்தின் எச்சரிக்கை. எந்த ஒரு குறிப்பிட்ட முடிவுக்காலக் கோட்பாட்டையும் புகுத்தாமல் காலம் குறித்த பதற்றம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழின் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திகிலடையாதீர்கள்’ மூலத்தின் அச்ச வலிமையைத் தக்கவைக்கிறது; ‘குழப்பங்கள்’ சமூக மற்றும் அரசியல் அமைதியின்மையின் பரந்த பொருளைச் சுருக்காமல் வழங்குகிறது.
