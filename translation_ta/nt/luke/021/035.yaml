  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: ta
  text: பொறியைப் போல[a]. ஏனெனில், முழுப் பூமியின்[c] பரப்பில் வாழும் அனைவர்மேலும் அது வரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கண்ணியைப் போல.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘முழு நிலம்’ அல்லது ‘முழு தேசம்.’ எனினும், இங்குள்ள சொற்றொடரின் பரந்த எல்லைக்கு ‘முழுப் பூமி’ என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: பொறியைப் போல
  rationale: παγίς என்பது பிடிப்பதற்கான பொறி அல்லது கண்ணியைக் குறிக்கிறது. திடீரெனச் சிக்கவைக்கும் உருவகத்தை நவீன தமிழில் ‘பொறி’ தெளிவாகத் தெரிவிக்கிறது; ὡς என்பதற்கு ‘போல’ இயல்பான இணை.
- source_word: ἐπεισελεύσεται
  choice: அது வரும்
  rationale: இந்த வினை வருதல் அல்லது ஒருவர்மேல் வந்தடைதல் என்ற பொருளைக் கொண்டது. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நாளே மறைமுக எழுவாய்; ‘அனைவர்மேலும் அது வரும்’ என்பது ἐπί உடன் சேர்ந்த இயக்கத்தையும் எச்சரிக்கைத் தொனியையும் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அதன் இணைப்புப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ πάντας
  choice: அனைவர்மேலும்
  rationale: ἐπί உடன் வரும் குற்றுவேற்றுமை இங்கு அனைவர்மேலும் வந்தடையும் இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘அனைவர்மேலும்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοὺς καθημένους
  choice: வாழ்கிற
  rationale: κάθημαι என்பதன் நேரடிப் பொருள் ‘உட்கார்ந்திருக்கிற’ என்றாலும், இங்குள்ள நிலவியல் சொற்றொடரில் அது குடியிருப்போர் அல்லது வாழ்வோரைக் குறிக்கிறது. ‘வாழ்கிற’ என்பது அந்த மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: ἐπὶ πρόσωπον
  choice: பரப்பிலும்
  rationale: ‘முகத்தின்மேல்’ என்ற நேரடி வடிவம் தமிழில் செயற்கையாக ஒலிக்கும். இச்செமித்தியத் தாக்கமுள்ள மரபுத்தொடர் மேற்பரப்பு அல்லது எங்கும் பரவிய இருப்பைக் குறிப்பதால் ‘பரப்பிலும்’ பொருளை இயல்பாகத் தருகிறது.
- source_word: πάσης τῆς γῆς
  choice: பூமி முழுவதின்
  rationale: γῆ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்/தேசம்’ எனப் பொருள் இருக்கலாம். இச்சூழலில் அனைவரையும் உள்ளடக்கும் விரிந்த எல்லைக்கு ‘பூமி முழுவதும்’ சிறப்பாகப் பொருந்துகிறது; வேற்றுமைத் தொடருக்காக ‘பூமி முழுவதின்’ என அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிக்கால எச்சரிக்கையில் γῆ என்பதன் எல்லை
  choice: பூமி முழுவதும்
  alternative: நிலம் முழுவதும் அல்லது தேசம் முழுவதும்
  rationale: γῆ இருவகைப் பொருளையும் ஏற்கக்கூடியது. ஆனால் ‘அதன் பரப்பில் வாழ்கிற அனைவரும்’ என்ற விரிந்த சொற்றொடர் உலகளாவிய பொருளை வலுப்படுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட எச்சரிக்கைத் தொனி பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்தில் உள்ள ‘நாள்’ என்பதை விளக்கமாகச் சேர்க்காமல், கிரேக்கத்தில் உள்ள மறைமுக எழுவாயை ‘அது’ எனப் பாதுகாக்கிறது. ‘பூமியின் முகம்’ என்ற சொற்சொல் மொழிபெயர்ப்புக்கு பதிலாக இயல்பான ‘பரப்பு’ பயன்படுத்தப்பட்டுள்ளது.
