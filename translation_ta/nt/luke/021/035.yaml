  rationale: 'The revision makes the earth/surface phrase idiomatic in modern Tamil, while retaining the source’s comparison, causal connection, future force, implied subject, resident/dweller sense, and universal scope. Footnote anchors are retained: a marks παγίς, b remains available for τοὺς καθημένους, and c marks γῆ.'
