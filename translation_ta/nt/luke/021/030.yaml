    text: அல்லது, இன்னும் சொற்சார்பாக, “அவை ஏற்கெனவே புதிய வளர்ச்சியை வெளிப்படுத்தும்போது.” கிரேக்க மூலத்தில் “இலைகள்” என்று வெளிப்படையாகச் சொல்லப்படவில்லை; மரங்களைப் பற்றிய சூழல் புதிய வளர்ச்சியைக் குறிக்கிறது.
