revisions:
- from: அவை ஏற்கெனவே துளிர்க்கும்போது[a], நீங்களே அவற்றைப் பார்த்து, கோடைக்காலம் ஏற்கெனவே நெருங்கிவிட்டது என்று அறிந்துகொள்கிறீர்கள்.
  to: அவை ஏற்கெனவே துளிர்க்கும்போது[a], அவற்றைப் பார்த்து, கோடைக்காலம் ஏற்கெனவே அருகில் இருக்கிறது என்பதை நீங்களே அறிந்துகொள்கிறீர்கள்.
  rationale: The revision preserves the implied botanical growth, the two instances of ‘already,’ and recognition through one’s own observation. It changes the final predicate to a direct Tamil equivalent of ‘is near,’ rather than implying a completed approach.
