id: LUK.21.30
reference: Luke 21:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: ta
  text: அவை ஏற்கெனவே துளிர்க்கும்போது[a], அவற்றைப் பார்த்து, கோடைக்காலம் ஏற்கெனவே அருகில் இருக்கிறது என்பதை நீங்களே அறிந்துகொள்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்பாக, “அவை ஏற்கெனவே புதிய வளர்ச்சியை வெளிப்படுத்தும்போது.” கிரேக்க மூலத்தில் “இலைகள்” என்று வெளிப்படையாகச் சொல்லப்படவில்லை; மரங்களைப் பற்றிய சூழல் புதிய வளர்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: -க்கும்போது
  rationale: நிபந்தனைத் தன்மையுள்ள காலச் சூழலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: προβάλωσιν
  choice: துளிர்க்கும்
  rationale: மரங்கள் புதிய வளர்ச்சியை வெளிப்படுத்துவதைக் குறிக்கிறது; கிரேக்கத்தில் ‘இலைகள்’ வெளிப்படையாக இல்லாததால், ‘துளிர்க்கும்’ என்பது சூழலையும் மூலத்தின் பொதுமையையும் காக்கிறது.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: வசனத்தில் இருமுறை வரும் காலநிலைக் குறிப்பை இரு இடங்களிலும் காக்கிறது.
- source_word: βλέποντες ἀφ’ ἑαυτῶν
  choice: நீங்களே அவற்றைப் பார்த்து
  rationale: தங்களது நேரடி பார்வையிலிருந்தே முடிவை அறிகிறார்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: γινώσκετε
  choice: அறிந்துகொள்கிறீர்கள்
  rationale: காணும் அடையாளத்திலிருந்து உணர்ந்து அறிதல் என்ற நிகழ்காலப் பொருளைத் தெரிவிக்கிறது.
- source_word: ἐγγὺς
  choice: நெருங்கிவிட்டது
  rationale: காலரீதியான அண்மையை இயல்பான தமிழில் கூறுகிறது; ‘ஏற்கெனவே’ என்பதுடன் தொடங்கியிருக்கும் அண்மையை உணர்த்துகிறது.
- source_word: θέρος
  choice: கோடைக்காலம்
  rationale: குறிப்பிடப்பட்ட பருவத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
