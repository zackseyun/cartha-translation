translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நடையில், மூலத்தின் இருமுறை வரும் ‘ஏற்கெனவே’ என்பதும் நேரடியாகப் பார்த்து அறியும் கருத்தும் காக்கப்பட்டுள்ளன.
