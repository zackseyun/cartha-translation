id: LUK.21.27
reference: Luke 21:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: ta
  text: அப்போது, மனிதகுமாரன் வல்லமையோடும் மிகுந்த மகிமையோடும் ஒரு மேகத்தில் வருவதை அவர்கள் காண்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு மேகத்தின்மேல்.’ கிரேக்க மூலத்தில் ஒருமையில் ‘ஒரு மேகத்தில்’ என்று உள்ளது; அதேவேளையில், இந்தக் காட்சி மனிதகுமாரன் மேகங்களோடு வருவதைப் பற்றிய தானியேல் 7 மற்றும் தொடர்புடைய பகுதிகளை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: அவர்கள் காண்பார்கள்
  rationale: எதிர்காலத்தில் நிகழும் நேரடியான பார்வைப் புலனை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தேவையற்ற உயர்நடையைச் சேர்க்கவில்லை.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவைக் குறிக்கும் நிலைபெற்ற பட்டப்பெயரையும் தானியேல் 7 உடனான இலக்கியத் தொடர்பையும் காக்கிறது.
- source_word: ἐρχόμενον
  choice: வருவதை
  rationale: காணப்படும் நிகழ்வாகத் தொடர்ச்சியுடன் சித்தரிக்கப்படும் ‘வருதல்’ என்ற செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν νεφέλῃ
  choice: ஒரு மேகத்தில்
  rationale: கிரேக்க மூலத்தின் ஒருமையையும் ἐν என்பதன் அடிப்படைப் பொருளையும் காக்கிறது; வேறு பகுதிகளின் பன்மை வடிவத்துடன் ஒத்திசைக்கவில்லை.
- source_word: μετὰ δυνάμεως
  choice: வல்லமையோடும்
  rationale: μετά உடனிகழ்ச்சியைக் குறிக்கிறது; ‘வல்லமை’ இச்சூழலில் δύναμις என்பதன் தெளிவான, dignified Tamil equivalent.
- source_word: δόξης πολλῆς
  choice: மிகுந்த மகிமையோடும்
  rationale: πολλῆς என்பதன் அளவுப் பொருளை இயல்பான தமிழில் தெரிவித்து, வசனத்தின் மேன்மையான தொனியையும் காக்கிறது.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டப்பெயர்
  choice: மனிதகுமாரன்
  alternative: மனிதனின் மகன்
  rationale: நிலைபெற்ற பட்டப்பெயரையும் தானியேல் 7 இன் எதிரொலியையும் காக்கிறது; வெறும் உயிரியல் உறவாகக் குறுக்கிவிடுவதில்லை.
- issue: மேக உருவகமும் தானியேல் நூல்/இறைத்தோற்ற எதிரொலியும்
  choice: ஒரு மேகத்தில்
  alternative: ஒரு மேகத்தின்மேல்
  rationale: லூக்காவின் ஒருமை வடிவத்தையும் ἐν என்ற முன்னிடைச்சொல்லின் நேரடிப் பொருளையும் முன்னிலைப்படுத்துகிறது; அதேவேளையில் ‘மேல்’ என்ற சாத்தியமான சூழல்சார் வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் பட்டப்பெயர் மற்றும் வெளிப்பாட்டு காட்சியின் மேன்மை குன்றாத வகையிலும் அமைக்கப்பட்டுள்ளது. ‘வல்லமையோடும் மிகுந்த மகிமையோடும்’ என்ற இணைப்பு இயல்பான ஓசையையும் மூலத்தின் இரு உடனிகழ்வுக் கூறுகளையும் காக்கிறது.
