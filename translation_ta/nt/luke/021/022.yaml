  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: ta
  text: ஏனெனில், எழுதப்பட்டவை அனைத்தும் நிறைவேறும்படி இவை பழிதீர்ப்பின் நாட்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பழிவாங்குதலின் நாட்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தையும் விளக்கத்தையும் அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: ἡμέραι
  choice: நாட்கள்
  rationale: மூலத்தின் பன்மை வடிவத்தை நேரடியாகப் பேணுகிறது; ‘காலம்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: ἐκδικήσεως
  choice: தண்டனைத் தீர்ப்பின்
  rationale: இங்கு நீதித்தீர்ப்பாக வரும் பதிலீட்டுத் தண்டனையைக் குறிக்கிறது. ‘பழிவாங்குதல்’ என்பது தமிழில் தனிப்பட்ட காழ்ப்புணர்ச்சியைத் தவறாக உணர்த்தக்கூடும்; ‘தண்டனைத் தீர்ப்பு’ நீதிசார் தீவிரத்தைப் பேணுகிறது.
- source_word: αὗταί εἰσιν
  choice: இவை
  rationale: வலியுறுத்தப்பட்ட சுட்டுப்பெயரையும் இணைப்புவினையையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: τοῦ πλησθῆναι
  choice: நிறைவேறுவதற்கான
  rationale: τοῦ உடனான வினையெச்சத்தின் நோக்கம்/விளைவு சார்ந்த இருபொருள் நிழலைத் திட்டவட்டமாக ஒன்றாகக் குறுக்காமல் பேணுகிறது.
- source_word: πάντα τὰ γεγραμμένα
  choice: எழுதப்பட்டவை அனைத்தும்
  rationale: எழுதப்பட்ட அனைத்தையும் உள்ளடக்கும் வலிமையைப் பேணுகிறது; ‘வேதவசனங்கள்’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: ἐκδικήσεως என்பதன் நீதித்தீர்ப்புச் சார்ந்த பொருள்
  choice: தண்டனைத் தீர்ப்பு
  alternative: பழிவாங்குதல்; நீதியான பதிலீடு
  rationale: சூழலில் இது எழுதப்பட்டவை நிறைவேறும் தெய்வீக நீதித்தீர்ப்பைக் குறிக்கிறது. தமிழில் மனிதரின் தனிப்பட்ட பழிவாங்கும் மனநிலையைத் தவிர்த்து, தண்டனைக்குரிய தீவிரத்தையும் நீதிசார் தன்மையையும் ‘தண்டனைத் தீர்ப்பு’ காக்கிறது.
- issue: τοῦ + infinitive கட்டமைப்பின் நோக்கம்/விளைவு
  choice: நிறைவேறுவதற்கான
  alternative: நிறைவேறும்படியாக; நிறைவேறும் வகையில்
  rationale: கிரேக்கக் கட்டமைப்பு நோக்கத்தையும் விளைவையும் சுட்டக்கூடும். தேர்ந்த வடிவம் அந்த உறவைத் திறந்தவாறே வைத்து, ஒன்றை மட்டும் இறுதியானதாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘எழுதப்பட்டவை’ என்ற வடிவம் வேதாகம நிறைவேற்றச் சூழலை உணர்த்தினாலும், மூலத்தில் இல்லாத ‘வேதவசனங்கள்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
