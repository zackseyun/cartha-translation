  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: ta
  text: பின்பு அவர் நிமிர்ந்து பார்த்து, செல்வந்தர்கள் தங்கள் கொடைகளைக்[a] கருவூலத்தில்[b] போடுவதைக் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் காணிக்கைகளை.’
    reason: lexical_alternative
  - marker: b
    text: ‘கருவூலம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், ஆலயக் கருவூலப் பகுதியையோ காணிக்கைகளைப் போடும் கொள்கலன்களையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: நிமிர்ந்து பார்த்து
  rationale: தமது பார்வையை மேலே உயர்த்திப் பார்த்த செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: இது மென்மையான நிகழ்ச்சித் தொடர்ச்சியைக் குறிக்கும் இணைப்புச்சொல்; இங்கு எதிர்மறை வேறுபாட்டை வலியுறுத்தாமல் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் எளிய புலனுணர்வுப் பொருளைப் பாதுகாக்கிறது; ‘கவனித்தார்’ போன்ற கூடுதல் நுட்பத்தைச் சேர்ப்பதில்லை.
- source_word: τοὺς βάλλοντας
  choice: போடுவதைக்
  rationale: βάλλω என்பதற்கு சொற்பொருளாக ‘எறிதல்’ இருந்தாலும், காணிக்கை செலுத்தும் இச்சூழலில் ‘போடுதல்’ என்பதே இயல்பான தமிழ்.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: கருவூலத்தில்
  rationale: ஆலயக் கருவூலப் பகுதியையோ காணிக்கை இடும் கொள்கலன்களையோ குறிக்கக்கூடிய மூலச்சொல்லின் பரந்த பொருளை ஓரளவு தக்கவைக்கிறது; வசனத்தில் வெளிப்படையாக இல்லாத ‘ஆலய’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τὰ δῶρα αὐτῶν
  choice: தங்கள் கொடைகளைக்
  rationale: δῶρα என்பதன் அடிப்படைப் பொருளான ‘கொடைகள்’ என்பதைத் தக்கவைக்கிறது; இச்சூழலில் ‘காணிக்கைகள்’ என்பதும் சாத்தியமானது என்பதை அடிக்குறிப்பு தருகிறது.
- source_word: πλουσίους
  choice: செல்வந்தர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மை உரிச்சொல்லை இயல்பாகவும் மரியாதையான நடையிலும் மொழிபெயர்க்கிறது.
