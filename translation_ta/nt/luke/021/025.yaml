  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: ta
  text: மேலும், சூரியனிலும் சந்திரனிலும் நட்சத்திரங்களிலும் அடையாளங்கள் தோன்றும்; பூமியில், கடலின் முழக்கத்தாலும் கொந்தளிப்பாலும் திகைத்து மக்கள் இனங்கள் நெருக்கடிக்குள்ளாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடலின் முழக்கத்திலும் கொந்தளிப்பிலும் திகைத்து மக்கள் இனங்கள் நெருக்கடிக்குள்ளாகும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: வழக்கமான, பரந்த பொருளுடைய மொழிபெயர்ப்பு; இவை தீய சகுனங்களா அல்லது வேறு வகை அடையாளங்களா என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: சூரியனிலும் சந்திரனிலும் நட்சத்திரங்களிலும்
  rationale: வானியல் உடல்களில் அடையாளங்கள் தோன்றும் என்ற கிரேக்க இடவியல் அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: συνοχὴ ἐθνῶν
  choice: மக்கள் இனங்கள் நெருக்கடிக்குள்ளாகும்
  rationale: συνοχή குறிக்கும் அழுத்தமான துயர்நிலையை ‘நெருக்கடி’ தெரிவிக்கிறது; ἔθνη இங்கு யூதரல்லாதவர்களை மட்டும் அல்லாமல் உலகின் மக்கள் இனங்களைக் குறிக்கிறது.
- source_word: ἐν ἀπορίᾳ
  choice: என்ன செய்வதென்று தெரியாமல்
  rationale: வழி தெரியாத, தீர்வு காண முடியாத திகைப்பை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: கடலின் முழக்கத்தையும் கொந்தளிப்பையும் கண்டு
  rationale: ἦχος என்பதன் பெரும் ஒலியை ‘முழக்கம்’ என்றும், σάλος என்பதன் கடல் கிளர்ச்சியை ‘கொந்தளிப்பு’ என்றும் தருகிறது. ‘கண்டு’ என்பது தமிழில் காரணத்தையும் எதிர்வினையையும் இயல்பாக இணைக்கிறது; மூலத்தின் சுருக்கமான தொடர்புக்கு விளக்கக்குறிப்பு வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: வானியல் அடையாளங்களின் இயல்பு
  choice: அவற்றை விளக்காமல் நேரடியாக ‘அடையாளங்கள்’ என மொழிபெயர்த்தல்
  alternative: அவற்றை முற்றிலும் நேரடியான வானியல் நிகழ்வுகளாகவோ, முற்றிலும் குறியீட்டு அரசியல் படிமங்களாகவோ விளக்குதல்
  rationale: வசனம் இவை நேரடியான நிகழ்வுகளா, குறியீட்டுப் படிமங்களா, அல்லது இரண்டுமா என்பதைத் தீர்மானிக்கவில்லை; மொழிபெயர்ப்பும் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. கிரேக்க வாக்கியத்தின் இறுக்கத்தை தமிழில் இயல்பாக்கியபோதும் அதன் பேரழிவு சார்ந்த படிமமும் விளக்கப்படாத இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
