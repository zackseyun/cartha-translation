  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: ta
  text: அந்த நாட்களில் கர்ப்பமாக இருப்பவர்களுக்கும் குழந்தைகளுக்குப் பாலூட்டுகிறவர்களுக்கும் ஐயோ! ஏனெனில் நாட்டின்மேல்[a] பெரும் நெருக்கடி வரும்; இந்த மக்கள்மேல் கோபமும்[b] வரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியின்மேல்.” γῆ என்ற கிரேக்கச் சொல் “நாடு” அல்லது “பூமி” என்று பொருள்படலாம். சுற்றியுள்ள பகுதி எருசலேமையும் யூதேயாவையும் மையப்படுத்துவதால் இங்கே “நாடு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த மக்களுக்கு கோபம்” அல்லது “இந்த மக்களுக்கு எதிரான கோபம்.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ
  rationale: தீர்க்கதரிசனப் புலம்பலையும் வரவிருக்கும் நியாயத்தீர்ப்பின் கடுமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: கர்ப்பமாக இருப்பவர்களுக்கு
  rationale: ‘கருப்பையில் கொண்டிருப்பவர்கள்’ என்ற கிரேக்கச் சொல்லாட்சியைத் தெளிவான, நவீன தமிழில் வழங்குகிறது.
- source_word: ταῖς θηλαζούσαις
  choice: குழந்தைகளுக்குப் பாலூட்டுகிறவர்களுக்கு
  rationale: வினையில் மறைந்துள்ள குழந்தை என்ற செயப்படுபொருளை இயல்பாக வெளிப்படுத்தி, தாய்ப்பாலூட்டும் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: கிரேக்க காலக் குறிப்பை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀνάγκη μεγάλη
  choice: பெருந்துயரம்
  rationale: இந்தப் பேரழிவுச் சூழலில் வெறும் ‘கட்டாயம்’ என்பதற்குப் பதிலாகக் கடுமையான நெருக்கடியையும் வேதனையையும் குறிக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: நாட்டின்மேல்
  rationale: γῆ என்பதற்கு ‘நாடு’ அல்லது ‘பூமி’ எனப் பொருள் கொள்ளலாம்; எருசலேமும் யூதேயாவும் பற்றிய உடனடிச் சூழலால் ‘நாடு’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὀργὴ
  choice: கோபம்
  rationale: மூலத்தில் உள்ள தீவிரமான கோபத்தைத் தமிழில் நேரடியாகக் கூறுகிறது; உரையில் இல்லாத ‘தேவனுடைய’ அல்லது விளக்கமான ‘நியாயத்தீர்ப்பு’ என்பவற்றைச் சேர்க்கவில்லை.
- source_word: τῷ λαῷ τούτῳ
  choice: இந்த மக்கள்மேல்
  rationale: கோபத்தால் பாதிக்கப்படும் மக்களைக் குறிக்கும் வேற்றுமை உறவையும் ‘இந்த’ என்ற சுட்டையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: γῆ மற்றும் ‘இந்த மக்கள்’ என்பவற்றின் குறிப்பு மற்றும் பரப்பு
  choice: உடனடிச் சூழலில் முதன்மையாக யூதேயா/இஸ்ரவேல் நாட்டையும் அங்குள்ள மக்களையும் குறிக்கும் வகையில் ‘நாடு’ என மொழிபெயர்க்கப்பட்டது.
  alternative: γῆ என்பதை உலகளாவிய பொருளில் ‘பூமி’ எனக் கொள்ளுதல்.
  rationale: சுற்றியுள்ள வசனங்கள் எருசலேமின் முற்றுகை, அழிவு, யூதேயாவில் இருப்பவர்கள் ஆகியவற்றை மையப்படுத்துகின்றன; இருப்பினும் மூலச்சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ὀργή என்பதன் தன்மை
  choice: ‘கோபம்’ என்று மட்டும் மொழிபெயர்த்து, அதன் உரிமையாளரை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘தேவனுடைய கோபம்’ அல்லது ‘நியாயத்தீர்ப்பு’.
  rationale: சூழலில் இது தெய்வீகக் கோபமாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் கிரேக்க உரை ‘தேவனுடைய’ என்று கூறாததால் அந்த விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஐயோ’ என்ற வலுவான புலம்பல் காக்கப்பட்டுள்ளது. ‘தேவனுடைய’ என உரையில் இல்லாத எழுவாய் சேர்க்கப்படவில்லை; γῆ என்பதன் பொருள் மாறுபாடு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
