id: LUK.21.13
reference: Luke 21:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: ta
  text: இது உங்களுக்குச் சாட்சியளிப்பதற்கான வாய்ப்பாக அமையும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது உங்களுக்குச் சாட்சியாக அமையும்.”
    reason: εἰς μαρτύριον என்பது சீடர்கள் சாட்சியளிக்கும் வாய்ப்பையோ, நிகழ்வுகளே சாட்சியாக அமையும் விளைவையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: ἀποβήσεται
  choice: அமையும்
  rationale: எதிர்காலத்தில் ஒரு நிகழ்வு குறிப்பிட்ட விளைவாக மாறுவதை இயல்பான நவீனத் தமிழில் குறிக்கிறது; வெறும் ‘நடக்கும்’ என்ற பொருளைக் காட்டிலும் விளைவு என்னும் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: இந்த விளைவு சீடர்களைப் பொறுத்தவரை அல்லது அவர்களுக்காக ஏற்படுகிறது என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς
  choice: -தற்கான வாய்ப்பாக
  rationale: இங்கு εἰς நோக்கம் அல்லது விளைவைச் சுட்டலாம். சூழலில் அதிகாரிகள்முன் பேசுவதற்குக் கிடைக்கும் சந்தர்ப்பத்தை இது தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μαρτύριον
  choice: சாட்சியளிப்பது
  rationale: μαρτύριον என்பதிலுள்ள பொது அல்லது நீதித்துறைச் சாட்சியின் கருத்தை வினைச்சொல் வடிவில் இயல்பான தமிழில் தருகிறது; யாரைக் குறித்து அல்லது யாருக்கு எதிராகச் சாட்சி என்பது தேவையின்றி தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: அதிகாரிகள்முன் சீடர்கள் அனுபவிக்கும் துன்பத்தின் விளைவு
  choice: அந்த நிகழ்வுகள் சீடர்கள் சாட்சியளிப்பதற்கான வாய்ப்பாக அமையும்.
  alternative: அந்த நிகழ்வுகளே ஒரு சாட்சியாக அல்லது ஆதாரமாக அமையும்.
  rationale: லூக்காவின் உடனடிச் சூழலில் கைது செய்யப்பட்டு அரசர்களுக்கும் ஆளுநர்களுக்கும் முன் கொண்டுபோகப்படுவது, சீடர்கள் பேசிச் சாட்சியளிக்கும் வாய்ப்பை முதன்மையாகக் குறிக்கிறது. ஆயினும் கிரேக்கச் சொற்றொடர் நிகழ்வுகளே சாட்சியாக அமைவதையும் அனுமதிப்பதால் அந்த வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘சாட்சியளிப்பது’ என்பது சூழலின் செயற்பாட்டுப் பொருளைத் தருகிறது; உண்மையான இலக்கணப் பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
