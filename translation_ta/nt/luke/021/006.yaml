reference: Luke 21:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: ta
  text: “நீங்கள் பார்த்துக்கொண்டிருக்கும் இவற்றைப் பொறுத்தவரை,[a] எந்தக் கல்லும் மற்றொரு கல்லின்மேல் எஞ்சாதபடி அவை இடித்துத் தள்ளப்படும் நாட்கள் வரும்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் காண்கிற இவற்றைப் பொறுத்தவரை.” இங்குள்ள வினைச்சொல் பொதுவாக ‘காணுதல்’ என்றும், குறிப்பாக ‘கவனித்துப் பார்த்தல்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “இடித்துத் தள்ளப்படாத எந்தக் கல்லும் ஒரு கல்லின்மேல் விடப்படாது.” இது முழுமையான அழிவை வலியுறுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: நீங்கள் உற்றுப் பார்க்கிற இவற்றைப் பொறுத்தவரை
  rationale: முன்னிலைப்படுத்தப்பட்ட Ταῦτα பொருட்களை வலியுறுத்துகிறது. θεωρεῖτε என்பது வெறுமனே ‘காண்கிறீர்கள்’ என்பதைக் காட்டிலும் கவனித்துப் பார்ப்பதை இங்கு குறிக்கலாம்; நிகழ்காலத்தின் தொடர்ச்சியான பார்வையையும் ‘உற்றுப் பார்க்கிற’ இயல்பாகக் காட்டுகிறது.
- source_word: ἐλεύσονται ἡμέραι
  choice: நாட்கள் வரும்
  rationale: வரவிருக்கும் நிகழ்வைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் நேரடியும் இயல்புமான தமிழ் வடிவம்.
- source_word: ἐν αἷς
  choice: அப்போது
  rationale: சொல்லுக்குச் சொல் ‘அவற்றில்’ என்றாலும், நாட்களைக் குறிக்கும் தொடர்புப் பயன்பாடு தமிழில் இயல்பாக ‘அப்போது’ என அமைகிறது.
- source_word: οὐκ ἀφεθήσεται
  choice: விடப்படாமல்
  rationale: ἀφίημι என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் இங்கு ஒரு கல் மற்றொன்றின்மேல் எஞ்சவிடப்படாததைக் குறிக்கிறது.
- source_word: λίθος ἐπὶ λίθῳ
  choice: ஒரு கல்லின்மேல் மற்றொரு கல்
  rationale: முழுமையான கட்டட அழிவைக் காட்டும் மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὃς οὐ καταλυθήσεται
  choice: அனைத்தும் இடித்துத் தள்ளப்படும்
  rationale: καταλύω கட்டடத்தைத் தகர்ப்பதையோ இடிப்பதையோ குறிக்கிறது. கிரேக்கத்தின் இரட்டை எதிர்மறை அமைப்பை அப்படியே சிக்கலாகத் தராமல், எந்தக் கல்லும் விதிவிலக்கல்ல என்ற முழுமையை ‘அனைத்தும்’ காக்கிறது.
theological_decisions:
- issue: ஆலயக் கட்டமைப்புகளைப் பற்றிய இயேசுவின் முன்னறிவிப்பின் எல்லையும் வலிமையும்
  choice: கண்ணுக்குத் தெரியும் கட்டமைப்பின் முழுமையான அழிவைப் பற்றிய தெளிவான முன்னறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: முதன்மையாக அடையாளமொழியான நியாயத்தீர்ப்புக் கூற்றாகவோ, குறிப்பிட்ட ஒரு இறுதிக்காலக் கோட்பாட்டுக்குள் பொருத்தியோ வாசித்தல்.
  rationale: கிரேக்கம் கற்கள் ஒன்றின்மேல் ஒன்று எஞ்சாத அளவுக்கு கட்டமைப்பு இடிக்கப்படுவதை நேரடியாகச் சொல்கிறது. வசனம் கூறாத காலக்கணிப்பையோ இறுதிக்காலக் கோட்பாட்டையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘உற்றுப் பார்க்கிற’ என்பது பார்வையின் கவனத்தையும் தொடர்ச்சியையும் காக்கிறது; பிரதான வாக்கியத்தில் இயல்புக்காக கிரேக்க இரட்டை எதிர்மறை நேர்மறை முழுமையாக மாற்றப்பட்டு, அதன் சொற்படி அமைப்பு அடிக்குறிப்பில் தரப்பட்டது.
