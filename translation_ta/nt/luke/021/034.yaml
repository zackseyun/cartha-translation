source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: ta
  text: “ஆனால், உங்களைப் பற்றி எச்சரிக்கையாக இருங்கள்; இல்லையெனில், மது அருந்துவதில் அளவுமீறுதலாலும்[a] குடிபோதையாலும் வாழ்க்கைக் கவலைகளாலும் உங்கள் இதயங்கள் பாரமடைந்து, அந்த நாள் திடீரென உங்கள்மேல் வந்துவிடும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடித்துக் களிப்பதாலும்”; கிரேக்கச் சொல் அளவுக்கு மீறி மது அருந்துவதையோ அதன் மோசமான பின்விளைவுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: ஆனால், உங்களைக் குறித்து எச்சரிக்கையாயிருங்கள்
  rationale: προσέχω உடன் வரும் தற்சுட்டுப் பெயரின் பொருள், ஒருவர் தம்மையே கவனித்து விழிப்புடன் இருக்க வேண்டும் என்பதாகும். தமிழில் எச்சரிக்கையின் வலிமையையும் இயல்பான நடையையும் இத்தொடர் காக்கிறது.
- source_word: μήποτε
  choice: இல்லையெனில்
  rationale: தவிர்க்க வேண்டிய அபாயத்தை அறிமுகப்படுத்தும் எதிர்மறை எச்சரிக்கைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: உங்கள் இதயங்கள் பாரமடைந்து
  rationale: βαρέω என்பதன் பாரமாக்கப்படுதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; καρδίαι இங்கு உள்ளார்ந்த சிந்தனை, விருப்பம், ஆன்மிக விழிப்புணர்வு ஆகியவற்றை உள்ளடக்குகிறது.
- source_word: κραιπάλῃ
  choice: அளவுமீறிய குடிவெறி
  rationale: அளவுக்கு மீறிக் குடித்துக் களித்தலையும் அதன் மோசமான பின்விளைவுகளையும் குறிக்கக்கூடிய சொல்லின் பரப்பை ஓரளவு வெளிப்படுத்துகிறது; குறிப்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: μέθῃ
  choice: குடிபோதை
  rationale: மது அருந்திய போதையையும் குடிவெறியையும் குறிக்கும் பெயர்ச்சொல்லுக்கு நேரடியான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: μερίμναις βιωτικαῖς
  choice: வாழ்க்கையின் கவலைகள்
  rationale: அன்றாட இவ்வுலக வாழ்க்கை சார்ந்த கவலைகள் என்ற பரந்த பொருளை, தேவையற்ற எதிர்மறை இறையியல் விளக்கமின்றி வழங்குகிறது.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: திடீரென உங்கள்மேல் வந்துவிடும்
  rationale: எதிர்பாராத விதத்தில் ஒருவர்மேல் வந்து நிற்கும் நிகழ்வைக் குறிக்கும் கிரேக்கத் தொடரின் திடீர் வருகை உணர்வைப் பாதுகாக்கிறது.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: அந்த நாள்
  rationale: சூழலில் இறுதிக்காலக் குறிப்பைக் கொண்டிருந்தாலும், மூலத்தில் இல்லாத ‘நியாயத்தீர்ப்பு’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் உள்ளபடியே தருகிறது.
theological_decisions:
- issue: ‘அந்த நாள்’ என்பதன் இறுதிக்காலக் குறிப்பு
  choice: அந்த நாள்
  alternative: நியாயத்தீர்ப்பு நாள்
  rationale: இயேசுவின் உரைச்சூழலில் உச்சகட்ட இறுதிக்கால நாளைக் குறித்தாலும், மூலவாசகத்தின் சுருக்கத்தையும் அதன் இறையியல் திறந்தநிலையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எச்சரிக்கையின் அவசரத் தன்மையும் ‘இதயங்கள் பாரமடைதல்’ என்ற மூல உருவகமும் காக்கப்பட்டுள்ளன.
