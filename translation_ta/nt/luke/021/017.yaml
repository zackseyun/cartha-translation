  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: ta
  text: என் பெயரின் காரணமாக நீங்கள் எல்லாராலும் வெறுக்கப்படுவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் காரணமாக.” “என் பெயர்” என்பது இயேசுவின் அடையாளம், அதிகாரம், அவருக்கு உள்ள பற்றுறுதியை வெளிப்படையாக அறிக்கையிடுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: வெறுக்கப்படுவீர்கள்
  rationale: எதிர்கால இடைநிலை வினையும் நிகழ்காலச் செயப்பாட்டு வினையெச்சமும் சேர்ந்த கிரேக்க அமைப்பை, இயல்பான நவீனத் தமிழில் எதிர்காலச் செயப்பாட்டு வினையாகத் தருகிறது.
- source_word: ὑπὸ πάντων
  choice: எல்லாராலும்
  rationale: ὑπό உடன் வரும் மரபுத்தொடர் செயலைச் செய்பவர்களைக் குறிக்கிறது; πάντων என்பதன் பரந்த பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: διὰ τὸ ὄνομά μου
  choice: என் பெயரின் காரணமாக
  rationale: διά + வேற்றுமை உருபு இங்கு காரணத்தைக் குறிக்கிறது. 'என் பெயர்' என்பதை விளக்கமாகச் சுருக்காமல், மூலத்தின் சொற்றொடரையும் அதன் பலதள அர்த்தத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: '''என் பெயர்'' என்பதன் பொருள்'
  choice: '''என் பெயரின் காரணமாக'' என்ற நேரடி வெளிப்பாட்டைத் தக்கவைத்தல்'
  alternative: '''என் காரணமாக'' / ''நீங்கள் என்னைச் சேர்ந்தவர்கள் என்பதால்'''
  rationale: கிரேக்கத்தில் வெளிப்படையாக 'என் பெயர்' என்றே உள்ளது. இது இயேசுவின் அடையாளம், அதிகாரம், அவர்மீதான பற்றுறுதியின் அறிக்கை ஆகியவற்றை உள்ளடக்கக்கூடும்; ஒரே பொருளாகக் குறுக்காமல் அந்த இறையியல் செறிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. 'எல்லாராலும்' என்பது மூலத்தின் வலுவான பொதுமைப்படுத்தலைப் பாதுகாக்கிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
