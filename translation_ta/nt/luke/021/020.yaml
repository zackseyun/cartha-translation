source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: ta
  text: ஆனால் எருசலேம் படைகளால்[a] சூழப்பட்டிருப்பதை நீங்கள் காணும்போது, அதன் அழிவு நெருங்கிவிட்டது என்பதை அறிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இராணுவ முகாம்களால்.’ கிரேக்கச் சொல் முகாம்களையோ முகாமிட்ட படைகளையோ குறிக்கலாம்; இங்கு எருசலேமை முற்றுகையிடும் படைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ ἴδητε
  choice: ஆனால் ... நீங்கள் காணும்போது
  rationale: ὅταν உடன் வரும் subjunctive எதிர்காலத்தில் நிகழவிருக்கும் சூழ்நிலையைச் சுட்டுகிறது; δὲ முந்தைய உரையிலிருந்து மென்மையான மாற்றத்தைக் குறிக்கிறது. நவீன தமிழில் இந்த அமைப்பு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κυκλουμένην
  choice: சூழப்பட்டிருப்பதை
  rationale: நிகழ்காலச் செயப்பாட்டு participle எருசலேம் அப்போது படைகளால் சுற்றிவளைக்கப்பட்டிருக்கும் நிலையைக் காட்டுகிறது; ‘சூழப்பட்டிருப்பதை’ அந்தத் தொடர்நிலையைப் பாதுகாக்கிறது.
- source_word: ὑπὸ στρατοπέδων
  choice: படைகளால்
  rationale: στρατόπεδον என்பது படைமுகாம்களையோ முகாமிட்ட படைகளையோ குறிக்கலாம். இச்சூழலில் நகரத்தை முற்றுகையிடும் இராணுவப் படைகளே கருத்தாக இருப்பதால் ‘படைகளால்’ என்பது தெளிவான இயல்பான மொழிபெயர்ப்பு.
- source_word: τότε γνῶτε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: γνῶτε என்பது aorist imperative; காணப்படும் அடையாளத்தின் பொருளை உணர்ந்து உறுதியாக அறியுமாறு கட்டளையிடுகிறது. தமிழில் ‘அறிந்துகொள்ளுங்கள்’ அந்தக் கட்டளை வலிமையை இயல்பாகத் தருகிறது.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டது
  rationale: ἐγγίζω என்பதன் perfect வடிவம், நெருங்கி வந்து இப்போது அருகில் இருக்கும் விளைவுநிலையைச் சுட்டுகிறது; ‘நெருங்கிவிட்டது’ அந்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: அதன் பாழாக்கம்
  rationale: ἐρήμωσις என்பது பாழாக்கம் அல்லது அழிவால் உண்டாகும் பாழ்நிலையைக் குறிக்கிறது. ‘பாழாக்கம்’ தீர்க்கதரிசன நியாயத்தீர்ப்பு மொழியின் எதிரொலியைப் பாதுகாக்கிறது; αὐτῆς என்பதற்கு தமிழில் நகரைக் குறிக்கும் இயல்பான ‘அதன்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: எருசலேமுக்கு வரவிருக்கும் நியாயத்தீர்ப்பின் குறிப்பு
  choice: ἐρήμωσις என்பதை ‘பாழாக்கம்’ என்று மொழிபெயர்த்து, நகருக்கு நெருங்கிவரும் பேரழிவை மட்டும் வசனத்தில் கூறுதல்
  alternative: ‘முழு அழிவு’ என்று பொருள்விரித்து மொழிபெயர்த்தல் அல்லது ‘பாழாக்கும் அருவருப்பு’ என்பதுடன் முதன்மை உரையிலேயே வெளிப்படையாக இணைத்தல்
  rationale: இவ்வசனம் படைகள் எருசலேமைச் சூழும்போது அதன் பாழாக்கம் நெருங்கிவிட்டதாகக் கூறுகிறது. ‘பாழாக்கம்’ என்ற சொல் மூலத்தின் தீர்க்கதரிசனச் சுமையைப் பாதுகாக்கிறது; ஆனால் வசனத்தில் சொல்லப்படாத குறிப்பிட்ட காலமுடிவு விளக்கத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில், ஆனால் தீர்க்கதரிசன எச்சரிக்கைக்குரிய கண்ணியமான தொனியில் வடிவமைக்கப்பட்டது. ‘எருசலேம்’ என்ற வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது; பாலினமுள்ள நகர உருவகம் தமிழில் இயல்பில்லாததால் αὐτῆς என்பது ‘அதன்’ என வழங்கப்பட்டது.
