- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் இறந்தகால வடிவம் இங்கு எளிய கதைநடையில் ‘கண்டார்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: δέ
  choice: -உம்
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் ‘போடுவதையும்’ என்ற இணைப்பில் அது இயல்பாக வெளிப்படுகிறது.
- source_word: τινα
  choice: ஒரு
  rationale: τις குறிப்பிடப்படாத ஒருவரை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஒரு விதவை’ என்பது இயல்பான சமமான வடிவம்.
- source_word: χήραν
  choice: விதவை
  rationale: χήρα என்பதன் நேரான, நவீனத் தமிழ் இணைச்சொல் ‘விதவை’.
- source_word: πενιχρὰν
  choice: ஏழையான
  rationale: πενιχρός குறைந்த பொருளாதார வசதியைக் குறிக்கிறது. ‘ஏழையான’ இயல்பானது; ‘வறிய’ என்பதும் சாத்தியம், ஆனால் ‘ஆதரவற்ற’ அல்லது ‘பரம ஏழை’ என்பது மூலத்தைவிட அதிகமாகக் கூறும்.
- source_word: βάλλουσαν
  choice: போடுவதையும்
  rationale: βάλλω அடிப்படையில் ‘எறி/வீசு’ எனினும் காணிக்கைப் பெட்டியில் பணம் செலுத்தும் சூழலில் ‘போடு’ என்பது நவீனத் தமிழில் இயல்பானது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இது முன்னைய வசனத்தில் நிறுவப்பட்ட காணிக்கைப் பெட்டியின் இடத்தைக் குறிக்கும் நேரான இடவினையடை.
- source_word: λεπτὰ δύο
  choice: இரண்டு மிகச் சிறிய செப்புக் காசுகள்
  rationale: λεπτά மிகக் குறைந்த மதிப்புடைய சிறிய செப்பு நாணயங்கள். பெயரை ஒலிபெயர்ப்பதைவிட அளவும் பொருளும் வாசகருக்குத் தெளிவாகக் கூறப்படுகின்றன; வரலாற்றுப் பெயர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
