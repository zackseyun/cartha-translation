reference: Luke 21:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: ta
  text: ஏனெனில், உங்களை எதிர்ப்பவர்கள் எவராலும் எதிர்த்து நிற்கவோ எதிர்வாதம் செய்யவோ முடியாத சொற்களையும் ஞானத்தையும் நான் உங்களுக்குக் கொடுப்பேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: சொற்கள்
  rationale: சொல்லர்த்தமாக ‘வாய்’ என்றாலும், இங்கு பேசுவதற்கான சொற்கள் அல்லது பேச்சுத்திறனைக் குறிக்கும் ஆகுபெயர். நவீன தமிழில் இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் ‘சொற்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: σοφίαν
  choice: ஞானம்
  rationale: பதில் அளிக்கத் தேவையான தெய்வீகமாக வழங்கப்படும் விவேகத்தையும் அறிவுத்திறனையும் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ் சொல்.
- source_word: ἀντιστῆναι
  choice: எதிர்த்து நிற்க
  rationale: எதிர்ப்பைத் தாங்கி நின்று வெல்வது அல்லது வெற்றிகரமாக எதிர்கொள்வது என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: ἀντειπεῖν
  choice: மறுத்துப் பேச
  rationale: எதிராகப் பேசுதல், மறுமொழி கூறி மறுத்தல் ஆகிய பொருள்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: உங்களை எதிர்ப்பவர்கள்
  rationale: சீடர்களுக்கு எதிராக நிற்பவர்களை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
theological_decisions:
- issue: இயேசுவே சொற்களையும் ஞானத்தையும் வழங்குபவர்
  choice: ‘நான் உங்களுக்குக் கொடுப்பேன்’ என்று முதல்நபர் வாக்குறுதி தக்கவைக்கப்பட்டது.
  alternative: இதை பொதுவான தெய்வீக உதவி அல்லது மனிதத் தயாரிப்பு என விரிவுபடுத்துதல்.
  rationale: கிரேக்க மூலத்தில் ἐγώ வலியுறுத்தப்பட்டு, கொடுப்பவர் இயேசுவே என்று நேரடியாகக் கூறப்படுகிறது.
- issue: எதிரிகளால் முடியாத இரு செயல்களின் தொடர்பு
  choice: ‘எதிர்த்து நிற்கவோ மறுத்துப் பேசவோ முடியாத’ என்று இரு வினைகளும் தனித்தனியே தக்கவைக்கப்பட்டன.
  alternative: ‘வெல்ல முடியாத’ என்று இரண்டையும் ஒரே பொதுப்பொருளில் சுருக்குதல்.
  rationale: மூலத்தின் இரட்டை வெளிப்பாடு நீதிமன்ற அல்லது சாட்சியச் சூழலில் எதிர்ப்பதும் மறுப்பதும் ஆகிய இரு பரிமாணங்களைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கச் சொற்றொடரின் கவனமுன்னிலையைத் தமிழில் வாசிக்க எளிதாக மாற்றியிருந்தாலும், வாக்குறுதியின் வலிமையும் இரு எதிர்வினைகளின் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
