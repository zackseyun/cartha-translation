  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: ta
  text: ஆனால் இவை நிகழத் தொடங்கும்போது[a], நீங்கள் நிமிர்ந்து, உங்கள் தலைகளை உயர்த்துங்கள்[b]; ஏனெனில் உங்கள் மீட்பு நெருங்கி வருகிறது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை நிகழத் தொடங்குகையில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மேலே பார்த்து, உங்கள் தலைகளை உயர்த்துங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: “மீட்பு” என்பதை “விடுதலை” என்றும் மொழிபெயர்க்கலாம்; இங்கே அது நெருங்கிவரும் இறுதி விடுதலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: இவை நிகழத் தொடங்கும்போது
  rationale: இந்தத் தனித்துநிற்கும் பிறப்புவேற்றுமைத் தொடர் காலச் சூழலைக் குறிக்கிறது. ‘நிகழத் தொடங்கும்போது’ என்பது ἀρχομένων மற்றும் γίνεσθαι ஆகிய இரண்டின் கருத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய துயரச் சூழலிலிருந்து ஊக்கமளிக்கும் கூற்றுக்குச் செல்லும் மென்மையான மாறுபாட்டை இது காட்டுகிறது.
- source_word: ἀνακύψατε
  choice: நீங்கள் நிமிர்ந்து
  rationale: குனிந்த நிலையிலிருந்து உடலை நிமிர்த்துதல் என்ற உருவகத்தையும், ஊக்கத்தோடும் நம்பிக்கையோடும் எழுதல் என்ற உட்பொருளையும் தக்கவைக்கிறது.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: உங்கள் தலைகளை உயர்த்துங்கள்
  rationale: பன்மை ஏவலைவும் நம்பிக்கையையும் துணிவையும் வெளிப்படுத்தும் மூலப்படிமத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: διότι
  choice: ஏனெனில்
  rationale: காரணத் தொடர்பைத் தெளிவான, தற்காலத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγγίζει
  choice: நெருங்கி வருகிறது
  rationale: நிகழ்கால வினை காட்டும் அணுகிவரும் நெருக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; வெறுமனே ‘அருகில் இருக்கிறது’ என்ற நிலையான பொருளாகச் சுருக்கவில்லை.
- source_word: ἀπολύτρωσις
  choice: மீட்பு
  rationale: விடுவித்தல் மற்றும் இரட்சிப்பு சார்ந்த செறிவைத் தக்கவைக்கும் வழக்கமான வேதாகமத் தமிழ்ச் சொல்; இதை வெறும் உடனடி ஆபத்திலிருந்து தப்புதல் என்று குறுக்கவில்லை.
theological_decisions:
- issue: இறுதிக்கால உரையில் ‘உங்கள் மீட்பு’ என்பதன் பொருள்
  choice: ‘உங்கள் மீட்பு’ என்று மொழிபெயர்த்து, அதன் நிறைவேற்ற முறையை மொழிபெயர்ப்பிலேயே மிகையாக விளக்காமல் வைத்தல்
  alternative: உடனடி வரலாற்று நெருக்கடியிலிருந்து கிடைக்கும் விடுதலை மட்டும்; அல்லது இறுதிக்காலச் சார்பற்ற முற்றிலும் ஆன்மிகமான மீட்பு
  rationale: சூழல் எதிர்காலத்தையும் இறுதிக்கால நிகழ்வுகளையும் நோக்கியது. ἀπολύτρωσις என்பதன் இறையியல் செறிவை ‘மீட்பு’ தக்கவைக்கிறது; அடிக்குறிப்பு சூழலில் இயேசுவின் மக்களுக்கு நெருங்கிவரும் இறுதி விடுதலையை இது குறிக்கிறது என்பதைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நிமிர்ந்து’ மற்றும் ‘தலைகளை உயர்த்துங்கள்’ என்ற உடல் சார்ந்த படிமங்கள் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
