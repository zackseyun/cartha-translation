base_translation:
  language: en
  yaml_path: translation/nt/luke/021/029.yaml
  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: ta
  text: 'மேலும் அவர் அவர்களிடம் ஓர் உவமையைச் சொன்னார்: “அத்தி மரத்தையும் எல்லா மரங்களையும் பாருங்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அத்தி மரத்தையும் எல்லா மரங்களையும் கவனியுங்கள்.”
    reason: Ἴδετε என்பதன் கவனத்தைச் செலுத்துதல் என்ற நுணுக்கத்தை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Καὶ
  choice: மேலும்
  rationale: முந்தைய உரையுடன் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; கிரேக்கத்தில் இல்லாத குறிப்பிட்ட கால வரிசையைச் சேர்க்கவில்லை.
- source_word: εἶπεν ... αὐτοῖς
  choice: அவர் அவர்களிடம் ... சொன்னார்
  rationale: தமிழில் ஒருவரிடம் ஒன்றைச் சொல்வது என்பது இயல்பான சொற்றொடர்; மூலத்தின் மூன்றாம் நபர் வினையையும் மறைமுகச் செயப்படுபொருளையும் காக்கிறது.
- source_word: παραβολὴν
  choice: ஓர் உவமையை
  rationale: நற்செய்தி நூல்களில் παραβολή குறிக்கும் போதனை வடிவத்திற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: Ἴδετε
  choice: பாருங்கள்
  rationale: கவனத்தை நேரடியாகத் திருப்பும் பன்மை ஏவலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν συκῆν
  choice: அத்தி மரத்தை
  rationale: συκῆ இங்கு பழத்தையல்ல, அத்தி மரத்தையே குறிக்கிறது.
- source_word: πάντα τὰ δένδρα
  choice: எல்லா மரங்களையும்
  rationale: ‘மற்ற’ என்ற சொல்லை மூலத்தில் இல்லாமல் சேர்க்காமல், கிரேக்கப் பன்மைத் தொடரை நேரடியாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் அமைந்த நடை. ‘மற்ற எல்லா மரங்கள்’ என்று விளக்கமாக்காமல் மூலத்தின் பரந்த சொற்றொடர் அப்படியே வைக்கப்பட்டுள்ளது.
