id: LUK.21.26
reference: Luke 21:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: ta
  text: மக்கள் வாழும் உலகின்மேல்[a] வரப்போகிறவற்றைக் குறித்த பயத்தினாலும் எதிர்பார்ப்பினாலும் மக்கள் மயங்கிப்போவார்கள்; ஏனெனில் வானங்களின் வல்லமைகள்[b] அசைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘உலகின்மேல்’ அல்லது ‘பூமியின்மேல்’; கிரேக்கில் ‘மக்கள் குடியிருக்கும் உலகம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘வானுலக வல்லமைகள்’ அல்லது ‘வானத்தின் வல்லமைகள்.’ இச்சொற்றொடர் பேரண்ட அல்லது வானுலக வல்லமைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: மயங்கிப்போவார்கள்
  rationale: இந்த வினையெச்சம் கடும் அச்சத்தால் வலுவிழந்து மயங்கும் உடல்-மன விளைவைச் சுட்டுகிறது. தனி வசனமாக இயல்பாக வாசிக்கத் தமிழில் எதிர்கால வினைமுற்றாக வழங்கப்பட்டது.
- source_word: ἀνθρώπων
  choice: மக்கள்
  rationale: இது ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது; ஆகவே பாலினப் பொதுமையை இயல்பாகக் காக்கிறது.
- source_word: ἀπὸ φόβου
  choice: பயத்தினாலும்
  rationale: ἀπό இங்கு காரணத்தைச் சுட்டுகிறது. ‘பயத்தினால்’ என்ற causal பொருளைத் தெளிவாகத் தருகிறது.
- source_word: προσδοκίας
  choice: எதிர்பார்ப்பினாலும்
  rationale: சொல் எதிர்பார்த்துக் காத்திருப்பதைக் குறிக்கிறது. சூழல் அதை அச்சமூட்டுவதாக ஆக்கினாலும், மூலத்தில் இல்லாத ‘பீதியான முன்னுணர்வு’ போன்ற பொருள் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- source_word: τῶν ἐπερχομένων
  choice: வரப்போகிறவற்றைக் குறித்த
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மை வினையெச்சம் வரவிருக்கும் நிகழ்வுகளைக் குறிக்கிறது; தமிழில் அதன் பன்மை மற்றும் நிகழ்வுசார் பொருள் காக்கப்படுகிறது.
- source_word: τῇ οἰκουμένῃ
  choice: மக்கள் வாழும் உலகின்மேல்
  rationale: οἰκουμένη வெறும் புவிக்கோளை விட மனிதர்கள் குடியிருக்கும் உலகை வலியுறுத்தலாம். இந்தத் தமிழ் சொற்றொடர் அந்த நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: வானங்களின் வல்லமைகள்
  rationale: இது விண்மீன் சார்ந்த சக்திகள், அண்ட ஒழுங்குகள் அல்லது வானுலக வல்லமைகள் ஆகியவற்றைக் குறிக்கக்கூடிய தெளிவுபடுத்தப்படாத சொற்றொடர். நேரடியான அமைப்பு அந்தப் பன்முகப் பொருளைத் தக்கவைக்கிறது.
- source_word: σαλευθήσονται
  choice: அசைக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, பேரண்டக் கலக்கத்தைக் குறிக்கும் தீர்க்கதரிசனப் படிமத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் சார்ந்த சூழலில் ‘வானங்களின் வல்லமைகள்’ என்பதன் பொருள்
  choice: அதை விண்மீன்கள் அல்லது தேவதூத வல்லமைகள் என்று மட்டும் குறுக்காமல், ‘வானங்களின் வல்லமைகள்’ என்ற தெளிவுபடுத்தப்படாத பேரண்டச் சொற்றொடராக வைத்தல்.
  alternative: ‘வானுலக வல்லமைகள்’ அல்லது ‘வானிலுள்ள கோள்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கச் சொற்றொடர் பேரண்ட அமைப்புகள், வானொளிகள் அல்லது வானுலக வல்லமைகள் ஆகியவற்றை நினைவூட்டக்கூடும். ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிக்காமல் மூலத்தின் பொருள் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனி வசனமாகத் தெளிவாக நிற்க கிரேக்க வினையெச்சத் தொடர் தமிழில் எதிர்கால வினைமுற்றாக அமைக்கப்பட்டுள்ளது; பேரண்டப் படிமத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
