  source_fidelity: The translation accurately represents the causal force of ἀπὸ φόβου καὶ προσδοκίας, the plural substantival participle τῶν ἐπερχομένων, and οἰκουμένη as the humanly inhabited world. “மயங்கிப்போவார்கள்” suitably conveys the physical and psychological collapse denoted by ἀποψυχόντων without adding an interpretive cause beyond the text. “அசைக்கப்படும்” preserves the future passive force of σαλευθήσονται.
