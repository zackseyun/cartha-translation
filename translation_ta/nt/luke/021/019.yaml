  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: ta
  text: 'நீங்கள் மனவுறுதியோடு நிலைத்திருப்பதன் மூலம் உங்கள் உயிரைப் பெற்றுக்கொள்ளுங்கள்.[a][b]


    [a] சில கிரேக்கக் கையெழுத்துப் பிரதிகளில், “பெற்றுக்கொள்வீர்கள்” என்று வருங்கால வினையாக உள்ளது.

    [b] “உங்கள் உயிரை” என்பதற்கு “உங்களையே” அல்லது “உங்கள் ஆன்மாக்களை” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கிரேக்கக் கையெழுத்துப் பிரதிகளில், “பெற்றுக்கொள்வீர்கள்” என்று வருங்கால வினையாக உள்ளது.
    reason: textual_variant
  - marker: b
    text: “உங்கள் உயிரை” என்பதற்கு “உங்களையே” அல்லது “உங்கள் ஆன்மாக்களை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: மனவுறுதியோடு நிலைத்திருப்பதன் மூலம்
  rationale: ὑπομονή என்பது துன்பம் அல்லது சோதனையின் கீழ் தளராமல் நிலைத்திருப்பதைக் குறிக்கிறது. வெறும் பொறுமையைக் காட்டிலும், இங்குள்ள துன்புறுத்தல் சூழலில் உறுதியான சகிப்பையும் தொடர்ந்த நிலைத்தன்மையையும் இந்தச் சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κτήσασθε
  choice: பெற்றுக்கொள்ளுங்கள்
  rationale: SBLGNT கொடுத்துள்ள வடிவம் இறந்தகாலத் தன்மையுடைய இடைநிலை ஏவல்வினை. κτάομαι என்பதன் அடிப்படைப் பொருளான ‘பெறு/சொந்தமாக்கிக்கொள்’ என்பதைக் காத்து, ஏவல் வடிவமும் முதன்மை உரையில் நிலைநிறுத்தப்பட்டுள்ளது; ‘காத்துக்கொள்ளுங்கள்’ என்று விளக்கமாக மட்டும் மாற்றப்படவில்லை.
- source_word: ψυχὰς
  choice: உங்கள் உயிரை
  rationale: ψυχή இங்கு ‘உயிர்’, ‘தன்னையே’, அல்லது ‘ஆன்மா’ என்று பொருள்படலாம். துன்புறுத்தல், மரணம், இறுதி மீட்பு ஆகிய சூழலில் முழு நபரின் உயிரைக் குறிக்கும் ‘உயிர்’ இயல்பானது; கிரேக்கப் பன்மை தமிழில் ஒவ்வொருவருக்கும் உரிய உயிரைக் குறிக்கும் இயல்பான ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐν
  choice: மூலம்
  rationale: ἐν + வேற்றுமை உருபு இங்கு வழிமுறை அல்லது கருவியைக் காட்டுகிறது. அதனால் சொற்சொல்லான ‘உள்ளே’ என்பதற்குப் பதிலாக இயல்பான தமிழில் ‘மூலம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிக்காலத் துன்புறுத்தல் சூழலில் ψυχή என்பதன் பொருள்
  choice: முழு நபரையும் உள்ளடக்கும் ‘உயிர்’
  alternative: ‘ஆன்மா’ அல்லது ‘உங்களையே’
  rationale: ‘ஆன்மா’ என்று மட்டும் மொழிபெயர்ப்பது உடலிலிருந்து பிரிந்த ஒரு பகுதியை மட்டுமே வசனம் குறிக்கிறது என்ற எண்ணத்தைத் தேவையின்றி ஏற்படுத்தலாம். ‘உயிர்’ என்பது உடல் ஆபத்துக்கும் இறுதி பாதுகாப்புக்கும் இடையிலுள்ள வேதவியல் அழுத்தத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: κτήσασθε என்பதின் ஏவல் வடிவமும் κτήσεσθε என்ற வருங்கால மாற்றுப் பாடமும்
  choice: SBLGNT முதன்மைப் பாடத்தின்படி ‘பெற்றுக்கொள்ளுங்கள்’
  alternative: ‘பெற்றுக்கொள்வீர்கள்’
  rationale: கொடுக்கப்பட்ட மூல உரையில் உள்ள ஏவல் வடிவத்தை முதன்மை உரை நேரடியாகப் பிரதிபலிக்கிறது. சில பிரதிகளின் வருங்காலப் பாடம் அடிக்குறிப்பில் தரப்படுவதால் கட்டளைக்கும் வாக்குறுதி போன்ற விளைவுக்கும் இடையிலுள்ள உரை வேறுபாடு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன, மரியாதைக்குரிய பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ போன்ற பழைய வழக்கைத் தவிர்த்து ‘உயிர்’ முதன்மைப்படுத்தப்பட்டுள்ளது. ‘மனவுறுதியோடு நிலைத்திருப்பது’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் ὑπομονήயின் செயற்பாட்டையும் நீடித்த தன்மையையும் வெளிப்படுத்துகிறது.
