- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் உள்ளங்களில்
  rationale: கிரேக்கத்தில் உள்ள பன்மையையும், உள்ளார்ந்த மனவுறுதியைக் குறிக்கும் ‘இதயம்’ சார்ந்த உருவகத்தையும் காக்கிறது; ‘உள்ளம்’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: μὴ
