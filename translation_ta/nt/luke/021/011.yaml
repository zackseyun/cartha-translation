source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: ta
  text: பெரும் நிலநடுக்கங்களும், பல்வேறு இடங்களில் பஞ்சங்களும் கொள்ளைநோய்களும்[a] ஏற்படும். அச்சமூட்டும் நிகழ்வுகளும், வானத்திலிருந்து[b] பெரிய அடையாளங்களும்[c] உண்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெருந்தொற்றுநோய்கள்.’ கிரேக்கச் சொல் λοιμοί, பரவலாகப் பாதிக்கும் தொற்றுநோய்களையோ கொள்ளைநோய்களையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆகாயத்திலிருந்து’ அல்லது ‘விண்ணுலகத்திலிருந்து.’ கிரேக்கச் சொல் οὐρανός, கண்ணுக்குத் தெரியும் வானத்தையோ விண்ணுலகத்தையோ குறிக்கலாம்.
    reason: lexical_ambiguity
  - marker: c
    text: ‘அடையாளங்கள்’ என்பதற்குப் பதிலாக, குறிப்பாக இறுதிக்காலச் சூழலில், ‘முன்னறிகுறிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί ... μεγάλοι
  choice: பெரும் நிலநடுக்கங்கள்
  rationale: σεισμοί என்பதன் இயல்பான பொருள் நிலநடுக்கங்கள்; μεγάλοι அவற்றின் பெருமையையோ கடுமையையோ குறிக்கலாம். ‘பெரும்’ என்பது இரண்டையும் தேவையின்றி குறுக்காமல் காக்கிறது.
- source_word: κατὰ τόπους
  choice: பல்வேறு இடங்களில்
  rationale: இடத்துக்கு இடம் பரவலாக நிகழ்வதைச் சுட்டும் கிரேக்கத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: λιμοὶ
  choice: பஞ்சங்கள்
  rationale: இச்சொல் சாதாரண உணவுப் பற்றாக்குறையைவிடக் கடுமையான பஞ்சங்களைக் குறிக்கிறது.
- source_word: λοιμοὶ
  choice: கொள்ளைநோய்கள்
  rationale: பரவலான தொற்றுநோய் அல்லது பெருந்தொற்றைச் சுட்டும் சொல்லின் தீவிரத்தைப் பாதுகாக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: φόβητρα
  choice: அச்சமூட்டும் நிகழ்வுகள்
  rationale: அச்சத்தை உண்டாக்கும் பொருட்களையோ நிகழ்வுகளையோ குறிக்கும் அரிய பன்மைச் சொல்லை இயல்பாகவும் அதன் விரிவைச் சுருக்காமலும் தருகிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: σημεῖον என்பதன் பரந்த, வழக்கமான புதிய ஏற்பாட்டுப் பொருளைப் பாதுகாக்கிறது; ‘முன்னறிகுறிகள்’ என்பது சாத்தியமான சூழல்சார் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπ’ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பது வானத்தையோ விண்ணுலகையோ குறிக்கலாம். ‘வானம்’ தமிழிலும் இவ்விரு நிழற்பொருள்களையும் ஓரளவு தாங்குவதால் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: μεγάλα
  choice: பெரிய
  rationale: அடையாளங்களின் அளவையோ முக்கியத்துவத்தையோ மிகைப்படுத்தி விளக்காமல் கிரேக்கப் பெயரடையை நேரடியாகத் தருகிறது.
- source_word: ἔσονται / ἔσται
  choice: ஏற்படும் / உண்டாகும்
  rationale: வரவிருக்கும் நிகழ்வுகளின் பட்டியலில் εἰμί வினையின் எதிர்கால இருப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் οὐρανός என்பதன் பொருள்
  choice: வானத்திலிருந்து
  alternative: விண்ணுலகத்திலிருந்து / ஆகாயத்திலிருந்து
  rationale: இந்தத் தொடர் கண்ணுக்குத் தெரியும் வானியல் நிகழ்வுகளையோ விண்ணுலகத் தொடர்பையோ சுட்டலாம். ‘வானத்திலிருந்து’ என்பது ஒரு குறிப்பிட்ட இயற்கை அல்லது இயற்கைக்கு அப்பாற்பட்ட விளக்கத்தைத் திணிக்காமல் அந்தப் பொருள் இழுப்பைத் தக்கவைக்கிறது.
- issue: φόβητρα என்பது பொருட்களா நிகழ்வுகளா
  choice: அச்சமூட்டும் நிகழ்வுகள்
  alternative: பயங்கரங்கள்
  rationale: அரிய கிரேக்கச் சொல் அச்சத்தை உண்டாக்கும் பொருட்களையோ சம்பவங்களையோ குறிக்கலாம். பட்டியலின் சூழலில் ‘நிகழ்வுகள்’ இயல்பாக இருந்தாலும் அவற்றின் தன்மையை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. இரண்டு கிரேக்க இருப்பு வினைகளின் பட்டியல் அமைப்பு, தமிழில் ‘ஏற்படும் / உண்டாகும்’ என இயல்பாக்கப்பட்டுள்ளது; மூலத்தில் உள்ள வானம்–விண்ணுலகம் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
