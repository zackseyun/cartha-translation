- from: அவர்கள் வாளின் முனையில் வீழ்வார்கள்; சிறைபிடிக்கப்பட்டு எல்லா நாடுகளுக்கும் கொண்டுபோகப்படுவார்கள்.[a] நாடுகளின் காலங்கள் நிறைவேறும் வரை, எருசலேம் நாடுகளால்[b] மிதிக்கப்படும்.[c]
