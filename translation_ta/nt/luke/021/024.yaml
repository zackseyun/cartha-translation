  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: ta
  text: வாளின் கூர்மையால் அவர்கள் வீழ்வார்கள்; சிறைபிடிக்கப்பட்டு எல்லா நாடுகளுக்கும் கொண்டுபோகப்படுவார்கள்.[a] நாடுகளின் காலங்கள் நிறைவேறும்வரை[c] எருசலேம் நாடுகளால்[b] மிதிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதரல்லாத எல்லா மக்களிடையேயும்’ அல்லது ‘பிற இனத்தார் அனைவரிடையேயும்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ‘நாடுகள்’ அல்லது ‘யூதரல்லாத மக்கள்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எருசலேம் யூதரல்லாத மக்களால் மிதிக்கப்படும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘யூதரல்லாத மக்களின் காலங்கள் நிறைவேறும்வரை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: வீழ்வார்கள்
  rationale: போர்ச் சூழலில் இது கொல்லப்படுவதைக் குறிக்கும் மரபுத்தொடராக இருந்தாலும், ‘வீழ்வார்கள்’ என்பது மூலத்தின் உருவகத்தையும் அடுத்துவரும் வாள் குறித்த சொற்றொடரையும் பாதுகாக்கிறது.
- source_word: στόματι μαχαίρης
  choice: வாளின் முனையில்
  rationale: சொல்லர்த்தமாக ‘வாளின் வாயால்’ எனும் உருவகம் தமிழில் இயல்பாக இல்லை. ‘வாளின் முனையில்’ என்பது வாளால் கொல்லப்படுவதை இயல்பாகவும் உருவக வலிமையுடனும் தெரிவிக்கிறது.
- source_word: αἰχμαλωτισθήσονται
  choice: சிறைபிடிக்கப்பட்டு … கொண்டுபோகப்படுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், கைதிகளாகப் பிடிக்கப்பட்டு வேறு நாடுகளுக்குக் கொண்டுசெல்லப்படும் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: எல்லா நாடுகளுக்கும்
  rationale: εἰς காட்டும் இடப்பெயர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ἔθνη என்பதை இவ்வசனம் முழுவதும் ‘நாடுகள்’ என்று ஒரே சீராக மொழிபெயர்க்கிறது.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: πατουμένη
  choice: மிதிக்கப்படும்
  rationale: ἔσται உடன் சேர்ந்துள்ள செயப்பாட்டுப் பங்கேற்புவினை தொடரும் எதிர்கால நிலையைத் தருகிறது; இத்தேர்வு அடக்கி ஆளப்படுதலின் ‘மிதித்தல்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ὑπὸ ἐθνῶν
  choice: நாடுகளால்
  rationale: செயலைச் செய்பவர்களைக் குறிக்கும் ὑπό என்பதைக் காட்டுகிறது; இவ்வசனத்தில் ἔθνη வரும் மற்ற இடங்களோடும் சொல்லிணக்கத்தைப் பேணுகிறது.
- source_word: ἄχρι οὗ
  choice: வரை
  rationale: குறிப்பிட்ட நிகழ்வு நிகழும் வரையிலான கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πληρωθῶσιν
  choice: நிறைவேறும்
  rationale: காலங்கள் முடிவை அடைவது அல்லது நியமிக்கப்பட்ட நிறைவை அடைவது ஆகிய இரு நுணுக்கங்களுக்கும் இடமளித்து, தேவையற்ற இறுதிக்கால விளக்கத்தைத் திணிக்கவில்லை.
- source_word: καιροὶ ἐθνῶν
  choice: நாடுகளின் காலங்கள்
  rationale: καιροί என்பதன் குறிப்பிடத்தக்க அல்லது நியமிக்கப்பட்ட காலங்கள் என்ற நுணுக்கத்தையும், ἐθνῶν என்ற உடைமைவேற்றுமையின் பொருள் தெளிவின்மையையும் ஓரளவு பாதுகாக்கிறது.
theological_decisions:
- issue: இவ்வசனத்தில் ἔθνη என்பதன் மொழிபெயர்ப்பு
  choice: நாடுகள்
  alternative: யூதரல்லாத மக்கள் / பிற இனத்தார்
  rationale: ஒரே கிரேக்கச் சொல் மூன்று முறை வருவதால் ‘நாடுகள்’ என்று ஒரே சீராகத் தருவது சொல் இணைப்பைப் பாதுகாக்கிறது. இது அரசியல் நாடுகளைக் குறிக்கிறதா அல்லது குறிப்பாக யூதரல்லாத மக்களைக் குறிக்கிறதா என்பதை மூலத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை; மாற்றுப் பொருள் அடிக்குறிப்புகளில் தரப்படுகிறது.
- issue: καιροὶ ἐθνῶν என்பதன் இறையியல் பொருள்
  choice: நாடுகளின் காலங்கள் நிறைவேறும்
  alternative: யூதரல்லாத மக்களின் காலங்கள் நிறைவேறும் / நாடுகளுக்காக நியமிக்கப்பட்ட காலங்கள் முடிவடையும்
  rationale: இச்சொற்றொடர் எல்லையிடப்பட்ட ஒரு காலப்பகுதியைக் குறிக்கலாம்; ஆனால் குறிப்பிட்ட இறுதிக்காலத் திட்டத்தை மொழிபெயர்ப்பில் புகுத்தாமல், காலங்களின் நிறைவு என்ற மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வாளின் முனையில் வீழ்வார்கள்’ என்பது போர் மரணத்தின் உருவகத்தைப் பேணுகிறது; ‘சிறைபிடிக்கப்பட்டு … கொண்டுபோகப்படுவார்கள்’ என்பது நாடுகடத்தலின் இயக்கத்தைத் தெளிவாக்குகிறது. ‘நாடுகள்’ என்ற சொல் மூன்று இடங்களிலும் சீராக வைக்கப்பட்டு, ‘யூதரல்லாத மக்கள்’ என்ற சாத்தியம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
