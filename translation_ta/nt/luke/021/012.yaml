id: LUK.21.12
reference: Luke 21:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: ta
  text: ஆனால், இவை அனைத்திற்கும் முன்பு, அவர்கள் உங்கள்மேல் கைகளை வைத்து[a] உங்களைத் துன்புறுத்துவார்கள்; உங்களை யூதத் தொழுகைக்கூடங்களிடமும் சிறைகளிடமும் ஒப்படைப்பார்கள். என் பெயரின் காரணமாக[b] நீங்கள் அரசர்களுக்கும் ஆளுநர்களுக்கும் முன்பாகக் கொண்டுசெல்லப்படுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “உங்கள்மேல் தங்கள் கைகளை வைப்பார்கள்.” இங்கு இது பகைமையுடன் உங்களைப் பிடிப்பதையோ கைது செய்வதையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “என் பெயரின் காரணமாக” என்பதை “என் பெயருக்காக” அல்லது விளக்கமாக “என் காரணமாக” என்றும் மொழிபெயர்க்கலாம். முதன்மை உரை, இயேசுவின் பெயரை அவரது நபரோடும் அதிகாரத்தோடும் இணைக்கும் வேதாகம வெளிப்பாட்டைத் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: ஆனால், இவை அனைத்தும் நடப்பதற்கு முன்பு
  rationale: πρό + genitive கால முன்னுரிமையையும், πάντων ‘அனைத்தும்’ என்பதையும் காட்டுகிறது. தமிழில் முழுமையான காலத் தொடராக இயல்பாக இருக்க ‘நடப்பதற்கு’ சேர்க்கப்பட்டது; δέ-யின் மாறுதல்/எதிர்மறைத் தொடர்பு ‘ஆனால்’ எனத் தரப்பட்டது.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: அவர்கள் உங்கள்மேல் கை வைத்து
  rationale: கிரேக்கத்தின் நேரடி கை-உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் இது பகைமையுடன் பிடித்தல் அல்லது கைது செய்தலைக் குறிக்கும் மரபுத்தொடர். தமிழில் ஆசீர்வாதம் அளித்தல் என்ற வேறு பொருளும் தோன்றக்கூடும் என்பதால் அடிக்குறிப்பில் சூழ்நிலைப் பொருள் தெளிவுபடுத்தப்பட்டது.
- source_word: διώξουσιν
  choice: உங்களைத் துன்புறுத்துவார்கள்
  rationale: சீடர்கள் இயேசுவின் பெயரால் எதிர்ப்புக்குள்ளாகும் சூழலில் διώκω சாதாரணமாகப் பின்தொடர்வதைவிடத் துன்புறுத்துதலைக் குறிக்கிறது.
- source_word: παραδιδόντες
  choice: ஒப்படைப்பார்கள்
  rationale: παραδίδωμι-யின் பகைமை மற்றும் சட்ட நடவடிக்கை சார்ந்த நிழற்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: யூதத் தொழுகைக்கூடங்களிடமும் சிறைகளிடமும்
  rationale: συναγωγή என்பது இங்கு யூதத் தொழுகைக்கூடத்தையும் அதனுடன் தொடர்புடைய உள்ளூர் விசாரணை/அதிகார அமைப்பையும் சுட்டக்கூடும்; அந்தப் பொருள் அகலத்தை விளக்கமாக விரித்துவிடாமல் நிறுவனச் சொல்லே தக்கவைக்கப்பட்டது. φυλακή ‘சிறை’ எனத் தரப்பட்டது.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: நீங்கள் அரசர்களுக்கும் ஆளுநர்களுக்கும் முன்பாகக் கொண்டுசெல்லப்படுவீர்கள்
  rationale: ἀπαγομένους என்பது செயல்பாட்டு வடிவல்ல, செயல்படுபொருள் வடிவப் பங்கேற்புச் சொல்; அதனால் ‘கொண்டுசெல்லப்படுவீர்கள்’ என அதன் கட்டாயமான, பகைமைமிக்க இயக்கம் பாதுகாக்கப்பட்டது. ἐπί நீதித்துறைச் சூழலில் அதிகாரிகளுக்கு ‘முன்பாக’ ஆஜராக்கப்படுதலைக் குறிக்கிறது.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: என் பெயரின் காரணமாக
  rationale: ἕνεκεν காரணத்தை அல்லது பொருட்டைச் சுட்டுகிறது. ‘என் பெயர்’ என்ற வேதாகம வெளிப்பாட்டை ‘என் காரணமாக’ என்று விளக்கி மாற்றாமல், இயேசுவின் நபர், அதிகாரம், அவரைப் பற்றிய அறிக்கை ஆகியவற்றுடனான தொடர்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: துன்புறுத்தலுக்கான காரணமாக ‘என் பெயர்’ என்பதன் பொருள்
  choice: ‘என் பெயரின் காரணமாக’ என்ற வேதாகம வெளிப்பாட்டைத் தக்கவைத்தல்
  alternative: ‘என் காரணமாக’ அல்லது ‘நீங்கள் என்னைச் சேர்ந்தவர்கள் என்பதால்’
  rationale: τοῦ ὀνόματός μου என்பது இயேசுவின் நபரையும் அதிகாரத்தையும் அவரைப் பற்றிய அறிக்கையையும் உள்ளடக்கும் செறிவான வெளிப்பாடு. ஒரே விளக்கத்திற்குள் அதைச் சுருக்காமல் மூலத்தின் இறையியல் ஒலியைத் தக்கவைக்கிறது.
- issue: συναγωγή என்பதன் நிறுவனப் பொருள்
  choice: ‘யூதத் தொழுகைக்கூடம்’ என்ற சொல்லைத் தக்கவைத்தல்
  alternative: ‘யூத நீதிமன்றம்’ அல்லது ‘தொழுகைக்கூட அதிகாரிகள்’ என்று விளக்கமாக விரித்தல்
  rationale: இச்சூழலில் தொழுகைக்கூடம் விசாரணை மற்றும் தண்டனை சார்ந்த உள்ளூர் அமைப்பையும் குறிக்கலாம்; ஆனால் மூல உரை நிறுவனப் பெயரையே பயன்படுத்துவதால் அதன் சாத்தியமான பொருள் அகலம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உங்கள்மேல் கை வைத்து’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டாலும் அதன் பகைமைச் சூழல் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. கிரேக்கத்தின் செயல்படுபொருள் பங்கேற்புச் சொல் ‘கொண்டுசெல்லப்படுவீர்கள்’ என்று தக்கவைக்கப்பட்டுள்ளது.
