source:
  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: ta
  text: 'சிலர் கோவிலைப்[a] பற்றி, அது அழகிய கற்களாலும் அர்ப்பணிக்கப்பட்ட காணிக்கைகளாலும்[b] அலங்கரிக்கப்பட்டிருப்பதாகப் பேசிக்கொண்டிருந்தபோது, அவர் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘கோவில்’ என்பதற்கான கிரேக்கச் சொல், உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் கோவில் வளாகம் முழுவதையும் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அதாவது, கடவுளுக்கென அர்ப்பணிக்கப்பட்டு கோவிலில் வைக்கப்பட்ட காணிக்கைப் பொருள்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: சிலர் … பேசிக்கொண்டிருந்தபோது
  rationale: இவ்வினைச்சொல் அமைப்பு ஒரே நேரத்தில் நடந்துகொண்டிருந்த சூழலைக் குறிக்கிறது; தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦ ἱεροῦ
  choice: கோவில்
  rationale: ἱερόν என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் கோவில் வளாகம் முழுவதையும் குறிக்கக்கூடும். வாசிப்புக்கு இயல்பான ‘கோவில்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: λίθοις καλοῖς
  choice: அழகிய கற்களால்
  rationale: καλοῖς என்பது கற்களின் கண்ணைக் கவரும் சிறப்பையும் அழகையும் சுட்டுகிறது; ‘அழகிய’ அதன் மதிப்பீட்டுப் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἀναθήμασιν
  choice: அர்ப்பணிக்கப்பட்ட காணிக்கைகளால்
  rationale: இச்சொல் கடவுளுக்கென அர்ப்பணிக்கப்பட்டு கோவிலில் வைக்கப்பட்ட காணிக்கைப் பொருள்களைக் குறிக்கிறது. ‘நேர்த்திக்கடன்’ என்று மட்டும் மொழிபெயர்ப்பதால் ஏற்படக்கூடிய தேவையற்ற பொருள் சுருக்கத்தை இத்தேர்வு தவிர்க்கிறது.
- source_word: κεκόσμηται
  choice: அலங்கரிக்கப்பட்டிருப்பதாக
  rationale: முற்றுப்பெற்ற அலங்கரிப்பின் தற்போதைய விளைவு நீடிப்பதை கிரேக்க நிறைவுக்கால வடிவம் உணர்த்துகிறது; ‘அலங்கரிக்கப்பட்டிருப்பதாக’ அந்த நிலைத்த விளைவைப் பாதுகாக்கிறது.
- source_word: εἶπεν
  choice: அவர் சொன்னார்
  rationale: மூலத்தில் இயேசுவின் பெயர் இங்கு வெளிப்படையாக மீண்டும் சொல்லப்படவில்லை; ‘அவர்’ உரையாடலின் தொடர்ச்சியைப் பேணுகிறது.
