translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேசிக்கொண்டிருந்தபோது’ தொடர்ச்சியான பின்னணிச் செயலைக் காட்டுகிறது; அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்த இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
