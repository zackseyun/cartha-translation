source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: ta
  text: 'உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: இந்தத் தலைமுறை[a] நிச்சயமாக ஒழிந்துபோகாது; அனைத்தும் நிகழும்வரை[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தத் தலைமுறை’ என்பதற்கு ‘இந்த மக்கள்’ அல்லது ‘இந்த யுகம்’ என்றும் பொருள் கொள்ளலாம்; எனினும், கிரேக்கச் சொல்லின் மிக நேரடியான மொழிபெயர்ப்பு ‘தலைமுறை’ என்பதே.
    reason: alternative_reading
  - marker: c
    text: ‘நிகழும்’ என்பதற்கு ‘நடந்தேறும்’ அல்லது ‘சம்பவிக்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் ஆணித்தரமான உறுதிமொழியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் ஒலிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடித் தன்மையையும் தமிழின் இயல்பான பேச்சு நடையையும் காக்கிறது.
- source_word: οὐ μὴ παρέλθῃ
  choice: நிச்சயமாக ஒழிந்துபோகாது
  rationale: οὐ μή தரும் வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக ... ஆகாது’ என்ற தமிழ்ச் சொற்றொடர் தெளிவாகத் தெரிவிக்கிறது. παρέρχομαι இங்கு தலைமுறை மறைந்துபோதலைக் குறிக்கிறது.
- source_word: ἡ γενεὰ αὕτη
  choice: இந்தத் தலைமுறை
  rationale: γενεά என்பதன் மிக நேரடியான பொருள் ‘தலைமுறை’; அதன் குறிப்பிட்ட சுட்டுப்பொருளைப் பிரதான உரை தீர்மானிக்கவில்லை.
- source_word: ἕως ἂν
  choice: நிகழும்வரை
  rationale: முன் கூறிய நிலை நீடிக்கும் கால எல்லையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: πάντα
  choice: இவை அனைத்தும்
  rationale: கிரேக்கத்தில் πάντα என்பது சொற்பட ‘அனைத்தும்’; தமிழில் தனித்து ‘அனைத்தும்’ என்பது மனிதர்களைக் குறிக்கும் வாய்ப்புள்ளதால், சுற்றியுள்ள நிகழ்வுகளைத் தெளிவாகச் சுட்ட ‘இவை’ சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது; இது அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- source_word: γένηται
  choice: நிகழும்
  rationale: γίνομαι இங்கு சம்பவித்தல் அல்லது நடந்தேறுதலைக் குறிக்கிறது; ‘நிறைவேறும்’ என்ற கூடுதல் இறையியல் நுட்பத்தைச் சேர்க்காமல் இயல்பான எதிர்காலக் காலப்பொருளை வழங்குகிறது.
theological_decisions:
- issue: இறுதிக்காலக் கூற்றில் ‘இந்தத் தலைமுறை’ என்பதன் சுட்டுப்பொருள்
  choice: சொற்பொருளுக்கு நெருக்கமாக ‘இந்தத் தலைமுறை’ என்று மொழிபெயர்த்து, அது யாரைக் குறிக்கிறது என்பதைப் பிரதான உரையில் தீர்மானிக்காமல் விடுதல்.
  alternative: ‘இந்த மக்கள்’ அல்லது ‘இந்த யுகம்’; மேலும், ‘இவற்றைக் காணும் தலைமுறை’ என்பது ஒரு விளக்கவுரை.
  rationale: ἡ γενεὰ αὕτη என்ற சொற்றொடர் நேரடியானதாயினும், அதன் சுட்டுப்பொருள் விவாதத்திற்குரியது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தை மறைக்கவோ ஒரு விளக்கத்தை உரைக்குள் புகுத்தவோ கூடாது.
- issue: πάντα என்பதில் ‘இவை’ வெளிப்படையாக உள்ளதா?
  choice: இயல்பான தமிழுக்காக ‘இவை அனைத்தும்’ என்று வழங்கி, ‘இவை’ சூழலிலிருந்து சேர்க்கப்பட்டதை அடிக்குறிப்பில் தெரிவிப்பது.
  alternative: ‘அனைத்தும்’ என்று மட்டும் வழங்குதல்.
  rationale: கிரேக்க உரையில் ‘இவை’ என்பதற்கான தனிச் சுட்டுப்பெயர் இல்லை. இருப்பினும், தமிழில் ‘அனைத்தும்’ மட்டும் வந்தால் மனிதர்கள் அல்லது பொருட்கள் குறித்த குழப்பம் ஏற்படலாம்; சூழல் முன் விவரிக்கப்பட்ட நிகழ்வுகளைச் சுட்டுகிறது.
translation_notes:
  register: மரியாதைமிக்க, நவீன பொதுத்தமிழ். ‘உண்மையாகவே’ ஆணித்தரமான தொடக்கத்தைத் தருகிறது; ‘நிச்சயமாக ... ஒழிந்துபோகாது’ வலியுறுத்தப்பட்ட மறுப்பைக் காக்கிறது. உரையின் பொருள்விவாதத்தைத் தீர்க்காமல் வாசிக்க எளிய வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
