revisions:
- from: ஆனால், வரவிருக்கும் இவை அனைத்திலிருந்தும் தப்பிக்க வலிமை பெறவும், மானிடமகன் முன் நிற்கவும், எப்போதும் விழிப்புடன் இருந்து மன்றாடுங்கள்.[a][b]
  to: ஆனால், எல்லாக் காலங்களிலும் விழிப்புடன் இருந்து மன்றாடுங்கள்; நிகழவிருக்கும் இவை அனைத்திலிருந்தும்[a] தப்பித்து, மானிடமகன் முன் நிற்கும் வலிமை உங்களுக்குக் கிடைக்கும்படி மன்றாடுங்கள்.[b][c]
