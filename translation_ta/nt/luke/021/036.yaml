  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: ta
  text: ஆனால், எல்லாக் காலங்களிலும் விழிப்புடன் இருந்து மன்றாடுங்கள்; நிகழவிருக்கும் இவை அனைத்திலிருந்தும்[a] தப்பித்து, மானிடமகன் முன் நிற்கும் வலிமை உங்களுக்குக் கிடைக்கும்படி மன்றாடுங்கள்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நடைபெறவிருக்கும் இவை அனைத்திலிருந்தும்.”
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், “தப்பித்து, மானிடமகன் முன் நிற்கும் வலிமை உங்களுக்குக் கிடைக்கும்படி” என்பதற்குப் பதிலாக, “இவை அனைத்திலிருந்தும் தப்பிக்கத் தகுதியுள்ளவர்களாக எண்ணப்படும்படி” என்று உள்ளது.
    reason: textual_variant
  - marker: c
    text: “மானிடமகன் முன் நிற்க” என்பது அவர் முன் ஏற்றுக்கொள்ளப்பட்டவர்களாக அல்லது விடுவிக்கப்பட்டவர்களாக நிற்பதைக் குறிக்கக்கூடும்; ஆனால் கிரேக்க உரை இதை வெளிப்படையாகச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: விழிப்புடன் இருந்து
  rationale: விழித்திருத்தல் என்ற உருவகத்தையும் ஆன்மிக எச்சரிக்கையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கையிலிருந்து வரும் மென்மையான மாறுபாட்டை அல்லது திருப்பத்தைச் சுட்டுகிறது.
- source_word: ἐν παντὶ καιρῷ
  choice: எப்போதும்
  rationale: ஒவ்வொரு காலத்திலும் என்ற தொடர்ச்சியான பொருளை இயல்பாகத் தருகிறது.
- source_word: δεόμενοι
  choice: மன்றாடுங்கள்
  rationale: சாதாரணமாக ஜெபித்தல் என்பதைக் காட்டிலும் வேண்டுதல் நிறைந்த விண்ணப்பத்தின் நுணுக்கத்தைத் தமிழில் தெளிவாகத் தருகிறது; கிரேக்கப் பங்கேற்புவினை, முதன்மை கட்டளையோடு இணைந்த கட்டளையாக இயல்பாக்கப்பட்டுள்ளது.
- source_word: ἵνα κατισχύσητε
  choice: வலிமை பெறவும்
  rationale: κατισχύω என்பதன் வலிமை பெற்று முடிதல் அல்லது போதிய ஆற்றல் உடையிருத்தல் என்ற பொருளைக் காக்கிறது; 'தகுதியுள்ளவர்களாக எண்ணப்பட' என்ற வேறுபட்ட வாசகத்தை முதன்மை உரையில் ஏற்கவில்லை.
- source_word: ἐκφυγεῖν
  choice: தப்பிக்க
  rationale: ஆபத்திலிருந்து தப்புதல் என்ற நேரடியான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: வரவிருக்கும் இவை அனைத்திலிருந்தும்
  rationale: μέλλω + γίνεσθαι என்பதன் எதிர்வரும் நிகழ்வுகளைச் சுட்டும் பொருளை இயல்பாகத் தருகிறது; உடனடி அண்மையை அளவுக்கு மீறி உறுதிப்படுத்தவில்லை.
- source_word: σταθῆναι
  choice: நிற்கவும்
  rationale: நிற்றல் என்ற படிமத்தை அப்படியே காக்கிறது; ஏற்றுக்கொள்ளப்படுதல் அல்லது விடுவிக்கப்படுதல் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἔμπροσθεν
  choice: முன்
  rationale: ஒருவரின் முன்னிலையில் இருப்பதைக் குறிக்கும் சுருக்கமான இயல்பான தமிழ்.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: சுவிசேஷங்களில் வரும் பட்டப்பெயருக்கான நிலையான, சுருக்கமான தமிழ் வடிவம்; அதன் செமித்திய மற்றும் கிறிஸ்துவியல் பின்னணியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடைசிக்காலத் தாங்குதலுடன் தொடர்புடைய κατισχύσητε என்பதன் பொருள்
  choice: '''வலிமை பெறவும்'' என்று மொழிபெயர்க்கப்பட்டது.'
  alternative: '''தகுதியுள்ளவர்களாக எண்ணப்படவும்'''
  rationale: SBLGNT வாசகம் κατισχύσητε; இது தகுதியைக் காட்டாமல் வலிமையையோ வெற்றி பெறும் ஆற்றலையோ குறிக்கிறது. நன்கு அறியப்பட்ட மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου என்பதன் இறுதிக்காலக் கருத்து
  choice: '''மானிடமகன் முன் நிற்கவும்'' என்ற படிமம் விளக்கச் சேர்க்கையின்றி வைக்கப்பட்டது.'
  alternative: '''மானிடமகன் முன் ஏற்றுக்கொள்ளப்பட்டவர்களாய் நிற்கவும்'' அல்லது ''மானிடமகன் முன் தோன்றவும்'''
  rationale: இது ஏற்றுக்கொள்ளப்படுதலையோ நியாயப்படுத்தப்படுதலையோ உட்குறிக்கலாம்; ஆனால் கிரேக்கம் அதை வெளிப்படையாகச் சொல்லாததால் அந்த இறையியல் இழுபறி காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கச் சொற்களின் வரிசையை மரத்தனமாகப் பின்பற்றாமல், நோக்கத்தைச் சுட்டும் இரண்டு வினையெச்சங்களையும் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
