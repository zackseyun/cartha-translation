source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: ta
  text: ஏனெனில், இவர்கள் எல்லாரும் தங்களுக்கு மிகுதியாக இருந்ததிலிருந்து காணிக்கைகளில் செலுத்தினார்கள்[a]; ஆனால் இவளோ தன் பற்றாக்குறையிலிருந்து[b], தன்னிடம் இருந்த வாழ்வாதாரம் முழுவதையும் செலுத்தினாள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘அன்பளிப்புகளில் செலுத்தினார்கள்.’ கிரேக்கச் சொல் நேரடியாக ‘கொடைகள்’ அல்லது ‘அன்பளிப்புகள்’ என்று பொருள்படும்; இங்கு ஆலயத்திற்குக் கொடுக்கப்பட்ட காணிக்கைகளைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘தன் வறுமையிலிருந்து’ அல்லது ‘தன் தேவையிலிருந்து.’'
    reason: lexical_alternative
  - marker: c
    text: அதாவது, அவள் வாழ்வதற்கான வசதி முழுவதையும். இது அவளுடைய வாழ்நாள் முழுவதையோ உயிரையோ குறிக்கவில்லை.
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: ஏனெனில், இவர்கள் எல்லாரும்
  rationale: γάρ முந்தைய வசனத்திற்கான விளக்கத் தொடர்பைச் சுட்டுவதால் ‘ஏனெனில்’ எனவும், πάντες ... οὗτοι என்பதை இயல்பாக ‘இவர்கள் எல்லாரும்’ எனவும் மொழிபெயர்க்கிறது.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: தங்களுக்கு மிகுதியாக இருந்ததிலிருந்து
  rationale: περισσεύοντος என்பது அவர்களிடம் தேவைக்கு மேல் மிகுதியாக இருந்ததைக் குறிக்கிறது; விதவையின் பற்றாக்குறையோடு உள்ள எதிர்மறை ஒப்புமையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: காணிக்கைகளில் போட்டார்கள்
  rationale: ἔβαλον என்பதன் பொருளான போடுதல் என்ற செயற்படிமத்தையும், ஆலயச் சூழலில் τὰ δῶρα குறிக்கும் காணிக்கைகளையும் நேரடியாகக் காட்டுகிறது.
- source_word: αὕτη δὲ
  choice: ஆனால் இவளோ
  rationale: ஏற்கெனவே குறிப்பிடப்பட்ட விதவையைச் சுட்டி, δέ வெளிப்படுத்தும் வலுவான வேறுபாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: தன் பற்றாக்குறையிலிருந்து
  rationale: ὑστέρημα என்பது குறைவு, தேவை அல்லது வறுமை நிலையைக் குறிக்கிறது; ‘மிகுதி’ என்பதற்கு எதிரான மூலமொழியின் சொல்லியல் அழுத்தத்தை ‘பற்றாக்குறை’ காக்கிறது.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: தன்னிடம் இருந்த வாழ்வாதாரம் அனைத்தையும்
  rationale: இங்கு βίος என்பது வாழ்நாள் அல்லது உயிர் அல்ல; வாழ்வதற்கான பொருளாதார வசதி அல்லது பிழைப்பாதாரத்தைக் குறிக்கிறது. சார்பு வாக்கியமான ὃν εἶχεν என்பதும் ‘தன்னிடம் இருந்த’ என்று வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
- source_word: ἔβαλεν
  choice: போட்டாள்
  rationale: நாணயங்களை இடும் உறுதியான செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: விதவை கொடுத்த βίος என்பதன் பொருள்
  choice: ‘வாழ்வாதாரம்’ என்று, அவள் வாழ்வதற்கான பொருளாதார வசதியைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வாழ்க்கை முழுவதையும்’ அல்லது ‘உயிர் முழுவதையும்’
  rationale: பணக் காணிக்கை பற்றிய சூழலில் βίος பிழைப்புக்கான வசதியைக் குறிக்கிறது. ‘வாழ்க்கை’ அல்லது ‘உயிர்’ என்று மொழிபெயர்த்தால், அவள் தன் இருப்பையே கொடுத்தாள் என்ற மூலத்தில் இல்லாத பொருள் தோன்றலாம்.
- issue: τὰ δῶρα என்பதன் குறிப்பு
  choice: ஆலயச் சூழலில் ‘காணிக்கைகள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அன்பளிப்புகள்’ அல்லது ‘ஆலயக் கருவூலம்’
  rationale: δῶρα என்பதன் அடிப்படைப் பொருள் கொடுக்கப்பட்ட பரிசுகள் அல்லது காணிக்கைகள். ‘ஆலயக் கருவூலம்’ என்பது சூழல் சார்ந்த கூடுதல் குறிப்பாக இருப்பதால் பிரதான உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மிகுதி—பற்றாக்குறை’ என்ற மூலமொழியின் எதிர்மறை ஒப்புமையும், ‘போட்டார்கள்—போட்டாள்’ என்ற செயல்வினை இணைப்பும் காக்கப்பட்டுள்ளன.
