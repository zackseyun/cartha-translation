revisions:
- from: பின்பு அவர் அவர்களிடம், “நாட்டுக்கு எதிராக நாடும், அரசுக்கு எதிராக அரசும் எழும்பும்,” என்றார்.
  to: அப்போது அவர் அவர்களிடம், “ஒரு நாடு மற்றொரு நாட்டுக்கு எதிராகவும், ஒரு ராஜ்யம் மற்றொரு ராஜ்யத்திற்கு எதிராகவும் எழும்பும்” என்றார்.
  rationale: 'The revision retains the narrative sequence and the straightforward future prediction while using ‘ராஜ்யம்’ for the political-realm sense of βασιλεία. The distributive phrasing naturally expresses the Greek repeated conflict formula. No footnote is needed: ‘எழும்பும்’ adequately renders the idiomatic future form here, and the English alternative note does not require replication in Tamil.'
