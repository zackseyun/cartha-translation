id: LUK.21.10
reference: Luke 21:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: ta
  text: அப்போது அவர் அவர்களிடம், “ஒரு நாடு மற்றொரு நாட்டுக்கு எதிராகவும், ஒரு ராஜ்யம் மற்றொரு ராஜ்யத்திற்கு எதிராகவும் எழும்பும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: பின்பு
  rationale: முந்தைய உரையோடு காலவரிசையாக இணைக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἔλεγεν
  choice: என்றார்
  rationale: இறந்தகால தொடர்நிலை வடிவத்தை நேரடி உரையை அறிமுகப்படுத்தும் இயல்பான தமிழ் கதைநடை வடிவில் வழங்குகிறது; தொடர்ச்சியையோ மீளுரைப்பையோ தேவையின்றி வலியுறுத்தவில்லை.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: மறைமுகப் பெறுநரைக் குறிக்கும் இயல்பான தமிழ் பயன்பாடு.
- source_word: Ἐγερθήσεται
  choice: எழும்பும்
  rationale: இச்சண்டைச் சூழலில் எதிர்த்து எழுவதைக் குறிக்கிறது; வெளிப்புறச் செயற்பாட்டாளரைச் சுட்டாதவாறு கிரேக்க நடுநிலை/செயப்பாட்டு வடிவத்தின் இயல்பான பொருளைப் பாதுகாக்கிறது.
- source_word: ἔθνος
  choice: நாடு
  rationale: அரசியல் கூட்டமைப்பாகிய மக்கள் அல்லது நாட்டைக் குறிக்கிறது; ‘அரசு’ என்பதுடனான இணைப்புக்கும் ஏற்றது.
- source_word: ἐπ’ ἔθνος
  choice: நாட்டுக்கு எதிராக
  rationale: ἐπί இங்கு பகைமையான எதிர்ப்பைக் குறிக்கிறது; ‘எதிராக’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: βασιλεία
  choice: அரசு
  rationale: இங்கு ஆட்சியுரிமை என்ற கருத்தை விட அரசியல் ஆட்சிப்பரப்பு அல்லது ராஜ்யத்தைக் குறிக்கிறது; நவீன வாசகருக்கு ‘அரசு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐπὶ βασιλείαν
  choice: அரசுக்கு எதிராக
  rationale: மீண்டும் வரும் பகைமைச் சூத்திரத்தைத் தமிழில் தெளிவாகவும் இணையான அமைப்பிலும் தருகிறது.
theological_decisions:
- issue: இறுதிக்கால மோதல் சூத்திரம்
  choice: நாடுகளும் அரசுகளும் ஒன்றுக்கொன்று எதிராக எழும் என்ற நேரடியான முன்னறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை எருசலேமின் வீழ்ச்சியை மட்டும் குறிப்பதாகவோ, உலக முடிவின் விரிவான கால அட்டவணையாகவோ வெளிப்படையாக விளக்குதல்.
  rationale: வசனம் தானாகவே எந்த ஓர் இறுதிக்காலக் கோட்பாட்டையும் தீர்மானிக்கவில்லை; ஆகவே அதன் பொதுவான அரசியல் மோதல் மொழியும் இறையியல் திறந்தநிலையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை. இணையான கிரேக்க அமைப்பைப் பாதுகாக்க ‘நாட்டுக்கு எதிராக நாடும், அரசுக்கு எதிராக அரசும்’ என சமச்சீராக வடிவமைக்கப்பட்டது. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு Ἐγερθήσεται என்பதற்கான ஆங்கிலச் சொல் மாற்று மட்டுமே; தமிழில் ‘எழும்பும்’ இரு நுணுக்கங்களையும் இயல்பாக உள்ளடக்குவதால் தனிக் குறிப்பு தேவையில்லை.
