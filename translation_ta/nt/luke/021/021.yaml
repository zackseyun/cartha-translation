id: LUK.21.21
reference: Luke 21:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: ta
  text: அப்போது யூதேயாவில் இருப்பவர்கள் மலைகளுக்குத் தப்பியோடட்டும்; அதன் நடுவில் இருப்பவர்கள் வெளியேறட்டும்; நாட்டுப்புறங்களில் இருப்பவர்கள் அதற்குள்[a] நுழைய வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதன்” என்றும் “அதற்குள்” என்றும் வருபவை எருசலேமைக் குறிக்கின்றன; கிரேக்கத்தில் நகரம் பெண்பால் பதிலிடுபெயரால் குறிப்பிடப்பட்டுள்ளது.
    reason: referent_clarification
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அடையாளத்தைத் தொடர்ந்து செய்ய வேண்டிய செயல்களை அறிமுகப்படுத்தும் கால அடைமொழி.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: யூதேயாவில் இருப்பவர்கள்
  rationale: யூதேயாவில் உள்ள மக்களைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: மலைகளுக்குத் தப்பியோடட்டும்
  rationale: நிகழ்கால மூன்றாம் நபர் கட்டளையின் அவசரத்தையும், ஆபத்திலிருந்து மலைகளை நோக்கித் தப்பிச் செல்லும் பொருளையும் காக்கிறது.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: அதன் நடுவில் இருப்பவர்கள்
  rationale: ἐν μέσῳ என்பதன் இடவியல் பொருளையும் αὐτῆς என்ற பதிலிடுபெயரையும் வெளிப்படையான பெயர்ச்சொல்லைச் சேர்க்காமல் காக்கிறது; அதன் குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐκχωρείτωσαν
  choice: வெளியேறட்டும்
  rationale: ஒரு இடத்தைவிட்டு அகலுதல் அல்லது வெளியேறுதல் என்ற பொருளை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: οἱ ἐν ταῖς χώραις
  choice: நாட்டுப்புறங்களில் இருப்பவர்கள்
  rationale: χῶραι என்பது இங்கு நகருக்கு வெளியேயுள்ள ஊரகப் பகுதிகளைக் குறிக்கிறது; குறிப்பாக வயல்களை மட்டும் குறுக்கிவிடாமல் மொழிபெயர்க்கிறது.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: அதற்குள் நுழைய வேண்டாம்
  rationale: எதிர்மறை நிகழ்காலக் கட்டளையின் தடை வலிமையைக் காக்கிறது; αὐτήν என்பதற்கு தமிழில் இயல்பான நடுநிலைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: αὐτῆς / αὐτήν ஆகிய பதிலிடுபெயர்களின் குறிப்பு
  choice: முதன்மை உரையில் ‘அதன் / அதற்குள்’ எனப் பதிலிடுபெயரைக் காத்து, அது எருசலேமைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: தெளிவுக்காக முதன்மை உரையிலேயே ‘எருசலேமில் / எருசலேமுக்குள்’ என்று பெயரை மீண்டும் இடுதல்
  rationale: முந்தைய வசனத்தின் உடனடிச் சூழல் எருசலேமைச் சுட்டுகிறது. கிரேக்கத்தில் நகரைக் குறிக்கும் பெண்பால் வடிவம் உள்ளது; தமிழில் இலக்கணப் பால் வேறுபாடு இல்லாததால் ‘அது’ இயல்பானது. பெயர்ச்சொல்லை உரைக்குள் சேர்த்து மூலத்தின் மறைமுகச் சுட்டைத் தீர்த்துவிடாமல், அடிக்குறிப்பு மூலம் குறிப்பைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அவசரமான மூன்று இணைக் கட்டளைகளையும் அரைப்புள்ளிகளால் தெளிவாகப் பிரித்து, மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது.
