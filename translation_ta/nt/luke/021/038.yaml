translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வந்து கொண்டிருந்தார்கள்’ என்பது தொடர்ச்சியாகவும் வழக்கமாகவும் நடந்த செயலைக் காட்டுகிறது; ‘அதிகாலையிலேயே’ என்பது நேரத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
