  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: ta
  text: மக்கள் அனைவரும் அதிகாலையிலேயே ஆலயத்தில் அவரிடம் வந்து, அவர் சொல்வதைக் கேட்பது வழக்கமாக இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல் ἱερόν; அது ஆலயத்தின் உள் சந்நிதியை மட்டும் அல்ல, ஆலய வளாகத்தையும் அதன் முற்றங்களையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: மக்கள் அனைவரும்
  rationale: மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் விரிவான பொருளை இயல்பான நவீன தமிழில் தருகிறது; ஒவ்வொரு தனிநபரும் விதிவிலக்கின்றி வந்தார் என்று தேவையின்றி வலியுறுத்தவில்லை.
- source_word: ὤρθριζεν
  choice: அதிகாலையிலேயே ... வந்து கொண்டிருந்தார்கள்
  rationale: வினைச்சொல்லின் அதிகாலை நேரப் பொருளையும், முற்றுப்பெறா இறந்தகாலம் காட்டும் வழக்கமான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலையும் வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: ஒரு நபரை நோக்கிச் செல்வதைக் குறிக்கும் πρός என்பதன் பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய சூழலில் இயேசுவே சுட்டப்படுவதால் பெயரை மீண்டும் சேர்க்கவில்லை.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உட்புறப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது. வாசிப்புக்கு இயல்பான ‘ஆலயத்தில்’ என்பதைக் கொண்டு, அதன் துல்லியமான பரப்பை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: ἀκούειν αὐτοῦ
  choice: அவர் சொல்வதைக் கேட்பதற்காக
  rationale: இறுதிநிலை வினைச்சொல் நோக்கத்தைக் காட்டுகிறது. இங்கு இயேசுவின் போதனையைக் கேட்பதே கருத்தாதலால், வெறும் ஒலியைக் கேட்பது என்ற தவறான புரிதலைத் தவிர்த்து இயல்பாக மொழிபெயர்க்கிறது.
