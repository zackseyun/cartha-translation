source:
  edition: SBLGNT
  text: καὶ θρὶξ ἐκ τῆς κεφαλῆς ὑμῶν οὐ μὴ ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/018.yaml
  text: And not a hair from your head will perish[a].
translation:
  language: ta
  text: மேலும், உங்கள் தலையிலிருந்து ஒரு முடிகூட அழியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக மொழிபெயர்த்தால்: ‘உங்கள் தலையிலிருந்து ஒரு முடிகூட நிச்சயமாக அழியாது.’ கிரேக்கத்தில் வலுவான உறுதியை வெளிப்படுத்த அழுத்தமான மறுப்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி வசனத்தில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: καί முந்தைய கூற்றுடன் இணைக்கும் தொடர் இணைப்புச்சொல். இந்தத் தனி வசனத்தை இயல்பான நவீன தமிழில் வழங்கும்போது தொடக்கத்தில் ‘மேலும்’ சேர்ப்பது செயற்கையாக இருக்கும்; வசனத் தொடரில் அதன் இணைப்பு இயல்பு மறைமுகமாகத் தங்குகிறது.
- source_word: θρὶξ
  choice: ஒரு முடிகூட
  rationale: ஒருமைச் சொல்லின் பொருளைத் தக்கவைத்து, ‘கூட’ என்பதன் மூலம் ‘ஒரு தலைமுடியும் இல்லை’ என்ற இயல்பான தமிழ் வலியுறுத்தலை வழங்குகிறது.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: உங்கள் தலையிலிருந்து
  rationale: ἐκ என்பதன் ‘இலிருந்து’ என்ற பொருளையும், பன்மைக் கேட்போரிடம் தமிழில் இயல்பாகப் பயன்படுத்தப்படும் ‘உங்கள் தலை’ என்ற கூட்டு ஒருமையையும் தக்கவைக்கிறது.
- source_word: οὐ μὴ
  choice: அழிந்துபோகாது
  rationale: οὐ μή உடன் வரும் வினை வலுவான மறுப்பைக் குறிக்கிறது. தமிழின் உறுதியான எதிர்கால மறுப்பு இதை இயல்பாகத் தருகிறது; கிரேக்கத்தின் இரட்டை மறுப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀπόληται
  choice: அழிந்துபோகாது
  rationale: ἀπόλλυμι இங்கு அழிதல் அல்லது முற்றிலும் இழக்கப்படுதல் என்ற பரப்பைக் கொண்டது. ‘அழிந்துபோகாது’ என்பது வசனத்தின் உயர்ந்த நடையையும் பொருளின் திறந்த தன்மையையும் காக்கிறது.
theological_decisions:
- issue: அருகிலுள்ள வசனங்களில் சீடர்கள் கொல்லப்படுவார்கள் என்ற முன்னறிவிப்புக்கும் இவ்வசனத்தின் உறுதிமொழிக்கும் இடையிலான பதற்றம்
  choice: எந்த உடல் தீங்கும் நேராது என்று விளக்கிச் சொல்லாமல், ‘ஒரு முடிகூட அழிந்துபோகாது’ என்ற பழமொழித் தன்மையுள்ள உறுதிமொழியை அப்படியே வைத்தல்
  alternative: சீடர்களுக்கு உடல் காயமோ மரணமோ ஒருபோதும் நேராது என்ற நேரடியான வாக்குறுதியாக மொழிபெயர்த்தல்
  rationale: உடனுள்ள சூழல் சிலர் கொல்லப்படுவார்கள் எனச் சொல்கிறது. ஆகவே மொழிபெயர்ப்பு அந்தத் தோற்றப் பதற்றத்தைத் தீர்த்துவிடாமல், மூலத்தின் வலுவான உறுதியையும் அதன் பொருள் திறந்த தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த நடை. ‘ஒரு முடிகூட’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் பழமொழித் தன்மையுள்ள சொற்றொடர்; ‘அழிந்துபோகாது’ மூலத்தின் solemn assurance-ஐ மிகை விளக்கமின்றி காக்கிறது.
