revisions:
- from: உங்கள் தலையிலிருந்து ஒரு முடிகூட அழிந்துபோகாது.[a]
  to: மேலும், உங்கள் தலையிலிருந்து ஒரு முடிகூட அழியாது.[a]
  rationale: The revision retains the draft’s faithful proverbial assurance and its avoidance of doctrinally resolving the surrounding tension. It supplies the Greek connective with natural Tamil ‘மேலும்,’ uses the more idiomatic ‘அழியாது,’ and improves the footnote’s clarity while preserving its explanation of οὐ μή.
  reviewer_model: gpt-5.6-terra
