revisions:
- from: அதைக் கேட்டவர்கள், “அப்படியானால் யார்தான் மீட்கப்பட முடியும்?” என்று கேட்டார்கள்.
  to: அதைக் கேட்டவர்கள், “யார் மீட்கப்பட முடியும்?” என்று கூறினார்கள்.
  rationale: The revision removes the unsupported inferential particle and uses a direct equivalent for Εἶπαν. It retains ‘அதைக்’ as a natural contextual object for οἱ ἀκούσαντες and preserves the salvation sense and passive form of σωθῆναι.
