  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: ta
  text: அதைக் கேட்டவர்கள், “யார் மீட்கப்பட முடியும்?” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: என்று கேட்டார்கள்
  rationale: சொல்லப்பட்ட உள்ளடக்கம் ஒரு கேள்வியாக இருப்பதால், எளிய இறந்தகாலக் கதைநடையில் இயல்பான தமிழாக ‘கேட்டார்கள்’ என மொழிபெயர்க்கப்பட்டது; கிரேக்கத்தில் அடிப்படைப் பொருள் ‘சொன்னார்கள்’ என்பதே.
- source_word: δὲ
  choice: அப்படியானால்
  rationale: δέ உரையாடலின் அடுத்த எதிர்வினையை இணைக்கிறது; முந்தைய வசனத்தால் எழுந்த திகைப்பான முடிவைத் தமிழில் இயல்பாக வெளிப்படுத்த இதனுடன் καί தரும் தொடர்ச்சியும் சேர்த்து மொழியாக்கப்பட்டது.
- source_word: οἱ ἀκούσαντες
  choice: அதைக் கேட்டவர்கள்
  rationale: பெயர்ச்சொல் தன்மையுள்ள இறந்தகாலப் பங்கேற்பு ‘கேட்டவர்கள்’ என வழங்கப்பட்டது; முந்தைய இயேசுவின் கூற்றைச் சுட்டும் பொருள் தமிழில் ‘அதை’ என இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: Καὶ
  choice: அப்படியானால்
  rationale: இங்கு καί முந்தைய கூற்றைத் தொடர்ந்து எழும் வியப்பான கேள்வியை அறிமுகப்படுத்துகிறது; தனியாக ‘மற்றும்’ என்று மொழிபெயர்ப்பதைவிட δέ உடன் இணைந்த ‘அப்படியானால்’ இயல்பான தமிழ்.
- source_word: τίς
  choice: யார்தான்
  rationale: ‘யார்’ என்பது நேரடி இணை; கேள்வியில் உள்ள திகைப்பையும் சாத்தியமின்மை உணர்வையும் இயல்பாகக் காட்ட ‘தான்’ வலியுறுத்தல் சேர்க்கப்பட்டது, புதிய நபர் வகையை வரையறுக்காமல்.
- source_word: δύναται
  choice: முடியும்
  rationale: திறன் அல்லது சாத்தியத்தைச் சுட்டும் வினை; நவீன தமிழில் ‘முடியும்’ சுருக்கமான இயல்பான இணை.
- source_word: σωθῆναι
  choice: மீட்கப்பட
  rationale: இறையாட்சிக்குள் நுழைதல் குறித்த சூழலில் இது இரட்சிப்பைச் சுட்டுகிறது. ‘மீட்கப்பட’ என்பது நவீன வாசகருக்குப் புரியும், passive வடிவத்தையும் பரந்த இரட்சிப்பு உணர்வையும் காக்கும் சொல்.
theological_decisions:
- issue: σωθῆναι என்பதன் சூழல்சார் பொருள்
  choice: மீட்கப்பட
  alternative: இரட்சிக்கப்பட / காப்பாற்றப்பட
  rationale: சுற்றியுள்ள பகுதி இறையாட்சிக்குள் நுழைவதையும் செல்வந்தருக்குள்ள கடினத்தையும் பற்றியது; ஆகவே வெறும் உடல் ஆபத்திலிருந்து காப்பாற்றப்படுதல் அல்ல, இறையியல் சார்ந்த மீட்பு முதன்மை. அதே நேரத்தில், வசனம் விளக்காத இரட்சிப்பின் முறை அல்லது பரப்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; உரையாடலுக்கேற்ற இயல்பும் வேதாகம வாசிப்புக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘யார்தான்’ கேட்போரின் அதிர்ச்சியை இயல்பாகக் காட்டுகிறது. அடிக்குறிப்புகள் தேவையில்லை.
