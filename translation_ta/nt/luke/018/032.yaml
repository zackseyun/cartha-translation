translation:
  language: ta
  text: ஏனெனில், அவர் யூதரல்லாதவர்களிடம்[a] ஒப்படைக்கப்படுவார்; கேலி செய்யப்படுவார், அவமதிக்கப்படுவார்[b], அவர்மேல் துப்பப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற இனத்தவர்களிடம்.” இங்கே குறிப்பாக யூதரல்லாத மக்கள் குறிக்கப்படுகிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இழிவாக நடத்தப்படுவார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: ஒப்படைக்கப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், யாருடைய நோக்கத்தையும் முன்கூட்டியே குறுக்காமல் மற்றவர்களின் கையில் ஒப்படைக்கப்படும் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பாடுகளுக்கான விளக்கத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாதவர்களிடம்
  rationale: இச்சூழலில் ἔθνη என்பது பொதுவாக நாடுகளை அல்ல, யூதர் அல்லாத மக்களைக் குறிக்கிறது; நவீனத் தமிழில் இதுவே உடனடியாகப் புரியும் வடிவம்.
- source_word: ἐμπαιχθήσεται
  choice: கேலி செய்யப்படுவார்
  rationale: இகழ்ச்சியுடன் பரிகசிக்கப்படுதல் என்ற செயப்பாட்டு அர்த்தத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ὑβρισθήσεται
  choice: அவமதிக்கப்படுவார்
  rationale: ὑβρίζω குறிக்கும் இழிவாகவும் மரியாதையற்றும் நடத்தப்படுதலைப் பிடிக்கிறது; வெறும் வாய்ச்சொல் நிந்தனையாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: ἐμπτυσθήσεται
  choice: அவர்மேல் துப்பப்படும்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தையும் அந்தக் குறிப்பிட்ட இழிவான செயலையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: செயப்பாட்டு வினைகளின் வெளிப்படையாகச் சொல்லப்படாத எழுவாய்
  choice: முந்தைய சூழலில் உள்ள மனுஷகுமாரனைக் குறிக்கும் வகையில் ‘அவர்’ சேர்க்கப்பட்டது
  alternative: எழுவாயைக் குறிப்பிடாமல் வினைகளை மட்டும் அமைத்தல்
  rationale: கிரேக்கத்தில் இவ்வசனத்துக்குள் தனி எழுவாய் இல்லாவிட்டாலும், லூக்கா 18:31-இல் உள்ள முன்னிலைத் தொடர்பு தெளிவானது. இயல்பான தமிழுக்காக ‘அவர்’ சேர்ப்பது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையான நடை. தொடர்ச்சியான எதிர்காலச் செயப்பாட்டு வினைகள் மூலத்தின் அமைப்பையும் தீவிரமடையும் அவமதிப்புச் செயல்களின் வரிசையையும் காக்கின்றன.
