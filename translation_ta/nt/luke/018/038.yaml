  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: ta
  text: அவன், “இயேசுவே, தாவீதின் மகனே[a], என்மேல் இரக்கம் காட்டும்!” என்று கூக்குரலிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின் மகன்” என்பது தாவீதின் வம்சத்தில் வருவார் என்று வாக்களிக்கப்பட்ட அரசரை நினைவூட்டும் மேசியா பட்டம்; இதை இன்னும் பொதுவாக “தாவீதின் வழித்தோன்றல்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: கூக்குரலிட்டான்
  rationale: βοάω உரத்த, அவசரமான அழைப்பைக் குறிக்கிறது. ‘கூக்குரலிட்டான்’ என்பது அதன் ஒலி வலிமையையும் வேண்டுகோளின் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγων
  choice: என்று
  rationale: கிரேக்கப் பங்கேற்பு வடிவமான λέγων நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்று’ இதை இயல்பாகச் செய்கிறது.
- source_word: Ἰησοῦ
  choice: இயேசுவே
  rationale: Ἰησοῦ என்பது விளிவேற்றுமை வடிவம்; தமிழில் அழைப்பைக் காட்ட ‘இயேசுவே’ என வழங்கப்பட்டுள்ளது.
- source_word: υἱὲ Δαυίδ
  choice: தாவீதின் மகனே
  rationale: இது தாவீதின் வழியில் வருவதாக வாக்களிக்கப்பட்ட அரசரை நினைவூட்டும் மேசியப் பட்டமாகச் செயல்படுகிறது. மூலத்தின் உறவுமுறை உருவகத்தையும் பட்டத்தின் வேதாகம ஒலிப்பையும் இது காக்கிறது.
- source_word: ἐλέησόν με
  choice: என்மேல் இரக்கம் காட்டும்
  rationale: ἐλεέω என்பதன் இறந்தகாலக் கட்டளை வடிவம் இரக்கமுள்ள செயலுக்கான நேரடியான வேண்டுகோள். ‘என்மேல் இரக்கம் காட்டும்’ என்பது அவசரத்தையும் பொருளையும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: υἱὲ Δαυίδ என்ற பட்டத்தின் மேசியப் பொருள்
  choice: ‘தாவீதின் மகன்’ என்ற பட்டமாக மொழிபெயர்த்தல்
  alternative: ‘தாவீதின் வழித்தோன்றல்’ என்று பொதுவான வம்சக் குறிப்பாக மொழிபெயர்த்தல்
  rationale: லூக்காவின் கதைச் சூழலில் இது இயேசுவை நோக்கிய அரச-மேசியப் பட்டமாகச் செயல்படுகிறது. ‘தாவீதின் மகன்’ என்பது விளக்கத்தை உரைக்குள் சேர்க்காமல் அந்தத் தெய்வவியல் ஒலிப்பைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளையில் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. உரத்த குரல் என்ற கூறு தமிழில் தெளிவாக முன்வைக்கப்பட்டு, ‘கூக்குரலிட்டான்’ மூலம் βோάω-வின் தீவிரமும் காக்கப்பட்டது.
