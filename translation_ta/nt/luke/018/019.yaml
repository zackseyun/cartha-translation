id: LUK.18.19
reference: Luke 18:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: ta
  text: அதற்கு இயேசு அவனிடம், “நீ ஏன் என்னை நல்லவர் என்று அழைக்கிறாய்? ஒருவரைத் தவிர வேறு யாரும் நல்லவர் அல்ல; அவரே கடவுள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: அதற்கு
  rationale: முந்தைய உரைக்கு இயேசு அளிக்கும் பதிலை இயல்பான தமிழில் இணைக்கிறது; கிரேக்கச் சொல்லின் மென்மையான எதிர்மறை அல்லது பதிலளிக்கும் உரையாடல் செயல்பாட்டை மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: இயேசு ... என்றார்
  rationale: λέγω என்பதன் நேரான பொருளான ‘சொன்னார்’ என்பதை மரியாதைமிக்க, இயல்பான தமிழ் நேர்கூற்றுத் தொடரில் வெளிப்படுத்துகிறது; ‘பதிலளித்தார்’ என்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ஒருமை ஆண்பால் பதிலிடுபெயரைப் பாதுகாக்கிறது; ‘அந்த மனிதனிடம்’ என உரையில் இல்லாத பெயர்ச்சொல்லைச் சேர்ப்பதில்லை.
- source_word: Τί
  choice: ஏன்
  rationale: τί με λέγεις ἀγαθόν என்ற தொடரில் τί காரணத்தைக் கேட்கிறது; ‘ஏன்’ என்பது இதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: με λέγεις ἀγαθόν
  choice: என்னை நல்லவர் என்று அழைக்கிறாய்
  rationale: λέγεις உடன் வரும் ἀγαθόν என்ற பயனிலைப் பெயரடையின் நேரடித்தன்மையைப் பாதுகாத்து, மரியாதைச் சூழலுக்கேற்ற இயல்பான தமிழை அளிக்கிறது.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: நல்லவர்
  rationale: இரு இடங்களிலும் ஒரே சொல்லைத் தொடர்ந்து பயன்படுத்துகிறது. மனிதரைச் சுட்டும் தமிழில் ‘நல்லவர்’ இயல்பானது; ‘ஒழுக்கத்தில் நல்லவர்’ எனப் பொருளை அளவுக்கு மீறிக் குறுக்குவதில்லை.
- source_word: οὐδεὶς
  choice: வேறு யாரும் ... அல்ல
  rationale: εἰ μὴ εἷς என்ற விதிவிலக்குத் தொடருடன் இணைந்து, முழுமையான மறுப்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰ μὴ εἷς
  choice: ஒருவரைத் தவிர
  rationale: கிரேக்க விதிவிலக்குக் கட்டமைப்பையும் εἷς என்பதன் ‘ஒருவர்’ என்ற வலியுறுத்தலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ὁ θεός
  choice: அவரே கடவுள்
  rationale: ‘ஒருவர்’ யார் என்பதைத் தமிழில் தெளிவாக அடையாளப்படுத்தி, εἷς ὁ θεός என்பதன் வலியுறுத்தலை வெளிப்படுத்துகிறது; உரையில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: இயேசுவின் கேள்வியிலுள்ள கிறிஸ்தியல் உட்குறிப்பு
  choice: இயேசு நல்லவர் என்பதை மறுக்கிறார் என்றோ, தமது தெய்வீகத்தை இங்கே நேரடியாக அறிவிக்கிறார் என்றோ உரையை மாற்றாமல் கேள்வியை அப்படியே பாதுகாத்தல்
  alternative: இயேசு முழுமையான பொருளில் நல்லவர் அல்ல என்று மறுப்பதாகவோ, ‘நல்லவர்’ என்ற அழைப்பை மறைமுகமாக ஏற்று தம்மைக் கடவுள் என்று வெளிப்படையாகக் கூறுவதாகவோ விளக்கிப் பெயர்த்தல்
  rationale: கிரேக்க வசனம் கேள்வியையும் கடவுளின் தனித்த நன்மையையும் முன்வைக்கிறது; அவற்றுக்கிடையிலான கிறிஸ்தியல் பதற்றத்தைத் தானே வெளிப்படையாகத் தீர்ப்பதில்லை. ஆகவே மொழிபெயர்ப்பு எந்த ஒரு கோட்பாட்டு முடிவையும் உள்ளே புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், இயேசுவைக் குறிக்கும் வினைமுற்றில் மரியாதையுடனும் அமைக்கப்பட்டுள்ளது. இறுதி அரைப்புள்ளி, ‘ஒருவர்’ மற்றும் ‘கடவுள்’ ஆகியவற்றின் அடையாள உறவைத் தெளிவாக்குகிறது.
