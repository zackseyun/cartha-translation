  text: ὁ δὲ εἶπεν· Ταῦτα πάντα ⸀ἐφύλαξα ἐκ νεότητος ⸀μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: ta
  text: அதற்கு அவர், “இவை அனைத்தையும் என் இளமை முதல் கடைப்பிடித்து வந்திருக்கிறேன்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலை இன்னும் வெளிப்படையாகக் காட்ட, “இந்தக் கட்டளைகள் அனைத்தையும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் நேரடியாக “இவை அனைத்தையும்” என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: அதற்கு அவர் … என்றார்
  rationale: δέ மென்மையான உரையாடல் இணைப்பாக உள்ளது; முந்தைய கேள்விக்கான பதிலை இயல்பான தமிழில் காட்ட ‘அதற்கு’ பயன்படுத்தப்பட்டது, வலுவான எதிர்மறைத் திருப்பைச் சேர்க்காமல்.
- source_word: Ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: கிரேக்கத்தில் ‘கட்டளைகள்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. ஆகவே சூழலில் அது உணரப்பட்டாலும், மூலத்தின் சுருக்கத்தையும் மறைபொருளையும் பிரதான உரை காக்கிறது.
- source_word: ἐφύλαξα
  choice: கடைப்பிடித்து வந்திருக்கிறேன்
  rationale: φυλάσσω இங்கு கட்டளைகளைப் பின்பற்றி ஒழுகுதல் என்ற பொருள் தருகிறது. கிரேக்க இறந்தகால வடிவம் இளமை தொடங்கி இதுவரையிலான வாழ்க்கை நடத்தையைச் சுருக்கிக் கூறுவதால், தமிழில் தொடர்ச்சியையும் தற்போதைய உரிமைக்கூற்றையும் இயல்பாக வெளிப்படுத்தும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐκ νεότητος μου
  choice: என் இளமைமுதல்
  rationale: ἐκ காலத்தின் தொடக்கப் புள்ளியைக் குறிக்கிறது; ‘இளமைமுதல்’ என்பது நவீனத் தமிழில் சுருக்கமான, இயல்பான நேரக் குறிப்பு.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘கட்டளைகள்’ பிரதான உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் சூழல்சார் மாற்றாக வழங்கப்பட்டுள்ளது.
