source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: ta
  text: அதற்கு அவர், “மனிதர்களால் முடியாதவை கடவுளால் முடியும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: முடியாதவை
  rationale: நடுநிலைப் பன்மை பெயரடை பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டுள்ளது. ‘முடியாதவை’ என்பது அதன் பன்மைத் தன்மையையும் மனித இயலாமை என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: παρὰ ἀνθρώποις
  choice: மனிதர்களால்
  rationale: παρά + வேற்றுமை இங்கு மனிதர்களின் தரப்பு அல்லது ஆற்றல் எல்லையைக் குறிக்கிறது. தமிழில் ‘மனிதர்களால்’ என்பது ‘மனிதர்களுக்கு/மனித உலகில்’ என்பதன் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δυνατὰ
  choice: முடியும்
  rationale: ἀδύνατα என்பதற்கு நேரெதிரான சொல்லாக இங்கு செயற்படுகிறது. ‘முடியும்’ என்பது தமிழில் செய்ய இயலும் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: παρὰ τῷ θεῷ
  choice: கடவுளால்
  rationale: மனித ஆற்றலுக்கும் கடவுளின் ஆற்றலுக்கும் உள்ள இணையான முரண்பாட்டை ‘மனிதர்களால் … கடவுளால்’ என்ற தமிழ்ச் சொற்றொடர் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὁ δὲ εἶπεν
  choice: அதற்கு அவர் … என்றார்
  rationale: δέ இங்கு முந்தைய கூற்றுக்கான பதிலை அறிமுகப்படுத்துகிறது. ‘அதற்கு’ என்பது அந்த உரையாடல் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளால் முடியும் என்பதன் எல்லை
  choice: மனிதர்களால் முடியாதவை கடவுளால் முடியும் என்ற விரிவான முரண்பாட்டை, அதன் சூழலான மீட்பு மற்றும் கடவுளுடைய அரசில் நுழைதல் என்பவற்றோடு திறந்த நிலையில் வைத்தல்
  alternative: எந்த வகையிலான எல்லாச் செயல்களையும் குறித்த முழுமையான தத்துவக் கோட்பாடாக விளக்குதல்
  rationale: கிரேக்க வாசகம் மனித இயலாமையையும் கடவுளின் ஆற்றலையும் எதிரெதிராக வைக்கிறது; ஆனால் ஒவ்வொரு கற்பனைச் செயலையும் தனியாக வரையறுப்பதில்லை. மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் இயல்பான பரப்பையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான உரையாடல் நடை. ‘மனிதர்கள்’ என்பது ἀνθρώποις என்பதன் பொதுவான மனிதக் குறிப்பை பாலினச் சுருக்கமின்றி தருகிறது. மூலத்தில் ஒரே மாதிரியாக வரும் παρά அமைப்பின் எதிரிணையைத் தமிழில் ‘மனிதர்களால் … கடவுளால்’ என்று பாதுகாத்துள்ளோம்.
