source:
  edition: SBLGNT
  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: ta
  text: 'அவர் சொன்னார்: “ஒரு நகரத்தில் நீதிபதி ஒருவர் இருந்தார். அவர் கடவுளுக்குப் பயப்படாதவர்; மனிதர்களை மதிக்காதவர்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் “மனிதனை” என்று ஒருமையில் உள்ளது; “யாரையும் மதிக்காதவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: அவர் சொன்னார்
  rationale: இது இயேசுவின் உவமை உரையை அறிமுகப்படுத்தும் நிகழ்காலப் பெயரெச்சம். முந்தைய வசனத்துடனான தொடர்பை இயல்பான நவீனத் தமிழில் காட்ட முற்றுவினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Κριτής τις
  choice: நீதிபதி ஒருவர்
  rationale: τις குறிப்பிடப்படாத ஒருவரை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஒருவர்’ என்பது பெயர் குறிப்பிடப்படாத கதாபாத்திரத்தை இயல்பாகவும் மரியாதைநிறைந்த நடையிலும் அறிமுகப்படுத்துகிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: கதையில் ஒரு நபரை அறிமுகப்படுத்தும் இருப்புவினையாக மொழிபெயர்க்கப்பட்டுள்ளது; மனிதரைக் குறிக்கும் இயல்பான உயர்திணை ஒருமை வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: ἔν τινι πόλει
  choice: ஒரு நகரத்தில்
  rationale: மீண்டும் வரும் indefinite τις-ஐ தமிழில் இயல்பான ‘ஒரு’ மூலம் வெளிப்படுத்துகிறது; ‘குறிப்பிட்ட’ என்று மொழிபெயர்ப்பது தேவையற்ற குறிப்புத்தன்மையை ஏற்படுத்தும்.
- source_word: τὸν θεὸν
  choice: கடவுளுக்கு
  rationale: இங்கு ஒரே கடவுளைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல் பயன்படுத்தப்பட்டுள்ளது; φοβέομαι உடன் வரும் பொருள் தமிழில் ‘கடவுளுக்குப் பயப்படுதல்’ என இயல்பாக அமைகிறது.
- source_word: μὴ φοβούμενος
  choice: பயப்படாதவர்
  rationale: நீதிபதியின் நிலையான குணநிலையைச் சுட்டும் பெயரெச்சத்தை, தமிழில் அதே பண்பைத் தெளிவாகக் காட்டும் தொடர்பெயர் வடிவில் வழங்குகிறது.
- source_word: ἄνθρωπον
  choice: மனிதர்களை
  rationale: கிரேக்க ஒருமை இங்கு பொதுப்பொருளில் மனிதரைச் சுட்டுகிறது. நவீனத் தமிழில் ‘மனிதர்களை’ என்பது பாலினக் குழப்பமின்றி அந்தப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் ஒருமை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: μὴ ἐντρεπόμενος
  choice: மதிக்காதவர்
  rationale: இச்சூழலில் ἐντρέπομαι என்பது பிறருக்கு மதிப்பு அல்லது மரியாதை காட்டுவதைச் சுட்டுகிறது. ‘மதிக்காதவர்’ சுருக்கமாகவும் இயல்பாகவும் கடவுளுக்குப் பயப்படாததுடன் உள்ள நெறிசார் இணைப்பைக் காக்கிறது.
theological_decisions:
- issue: கடவுள் மற்றும் பொதுப்பொருளில் வரும் ஒருமை ἄνθρωπον ஆகியவற்றுக்கிடையிலான மாறுபாடு
  choice: மனிதர்களை
  alternative: ஒரு மனிதனையும் / யாரையும்
  rationale: ἄνθρωπον இலக்கண ரீதியாக ஒருமை என்றாலும் இங்கு பொதுப்பொருளுடையது. நவீனத் தமிழில் பன்மை வடிவம் அதன் உள்ளடக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘யாரையும்’ என்பது நீதிபதி எவருக்கும் மதிப்பு கொடுக்கவில்லை என்ற பொருளை இன்னும் வெளிப்படையாகக் கூறும் மாற்று. மூலத்தின் ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உவமைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒரு நகரத்தில் நீதிபதி ஒருவர்’ என்ற சொல்வரிசை கிரேக்கத்தின் இருமுறை வரும் indefiniteness-ஐ தமிழில் இயல்பாகப் பாதுகாக்கிறது.
