  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: ta
  text: “நான் உனக்காக என்ன செய்ய வேண்டும் என்று விரும்புகிறாய்?” என்று கேட்டார். அதற்கு அவன், “ஆண்டவரே[a], நான் மீண்டும் பார்க்க வேண்டும்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா”; κύριε என்ற கிரேக்கச் சொல் மரியாதையான அழைப்பாகவும் அமையலாம். எனினும் κύριος என்பதற்கான இத்திட்டத்தின் வழக்கமான மொழிபெயர்ப்பு “ஆண்டவர்” என்பதாகும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நான் என் பார்வையைத் திரும்பப் பெற வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: நான் உனக்கு என்ன செய்ய வேண்டுமென விரும்புகிறாய்?
  rationale: கேள்வியின் நேரடியான பொருளையும் பயனாளியைக் குறிக்கும் σοι என்பதையும் காத்து, நவீனத் தமிழில் இயல்பான வாக்கியமாக வழங்குகிறது.
- source_word: ὁ δὲ εἶπεν
  choice: அதற்கு அவன் ... என்றான்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் பதிலைத் தொடர்வதால், ‘அதற்கு’ என்பது உரையாடலின் ஓட்டத்தை இயல்பாக இணைக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதற்கான முதன்மை மொழிபெயர்ப்பாக ‘ஆண்டவர்’ என்பதைப் பேணி, மரியாதையையும் கிறிஸ்துவைப் பற்றிய சாத்தியமான ஆழ்ந்த அங்கீகாரத்தையும் திறந்த நிலையில் வைக்கிறது.
- source_word: ἵνα ἀναβλέψω
  choice: நான் மீண்டும் பார்க்க வேண்டும்
  rationale: குணமாக்கும் சூழலில் ἀναβλέπω என்பது மீண்டும் பார்வை பெறுவதைக் குறிக்கிறது; இந்தத் தேர்வு வேண்டுகோளின் சுருக்கமான, நேரடியான தன்மையைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சொல் மரியாதையான அழைப்பாகவும் இருக்கலாம்; அதேவேளை இயேசுவைப் பற்றிய மேலான அங்கீகாரத்தையும் தாங்கக்கூடும். ‘ஆண்டவரே’ என்பது இந்த இறையியல் அழுத்தத்தை முன்கூட்டியே குறைக்காமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான உரையாடல் நடையும் வேதாகம வாசிப்புக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்கத்தில் இயேசு கேள்வி கேட்டார் என்பது வினைச்சொல்லால் வெளிப்படையாகக் கூறப்படாவிட்டாலும் உரையாடலில் தெளிவாக இருப்பதால், தமிழின் இயல்புக்காக ‘என்று கேட்டார்’ சேர்க்கப்பட்டுள்ளது.
