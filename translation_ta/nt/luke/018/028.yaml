  source_fidelity: 'The Tamil accurately represents all elements of the Greek: δέ as a natural narrative transition (''அப்போது''), Peter''s speech, the attention marker ἰδού (''இதோ''), the explicit first-person plural, the broad τὰ ἴδια, the prior action of leaving, and following Jesus. It does not narrow τὰ ἴδια to possessions or homes.'
