  terminology: '''பேதுரு,'' ''உம்மை,'' and ''பின்பற்றினோம்'' are suitable established biblical Tamil forms. ''எங்களுக்குச் சொந்தமானவற்றை'' preserves the source phrase''s intentionally broad reference without adding interpretive detail.'
