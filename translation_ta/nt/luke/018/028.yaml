source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: ta
  text: அப்போது பேதுரு, “இதோ, நாங்கள் எங்களுக்குச் சொந்தமானவற்றை விட்டுவிட்டு உம்மைப் பின்பற்றினோம்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எங்களுடையவற்றை” அல்லது “எங்கள் உடைமைகளை.” கிரேக்கச் சொற்றொடர் பரந்த பொருளுடையது; பேதுருவும் மற்றவர்களும் எதை விட்டார்கள் என்பதை அது துல்லியமாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: அப்போது பேதுரு ... என்றார்
  rationale: δέ இங்கு உரையாடலின் தொடர்ச்சியையும் மென்மையான மாற்றத்தையும் குறிக்கிறது; ‘அப்போது’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது. Εἶπεν என்பதற்கு நேரடியான ‘என்றார்’ பொருத்தமானது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் ἰδού என்பதன் வலிமையை நவீன, கண்ணியமான தமிழில் ‘இதோ’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἡμεῖς
  choice: நாங்கள்
  rationale: வெளிப்படையாக உள்ள முதலாம் நபர் பன்மைப் பெயர்ச்சொல்லைத் தக்கவைக்கிறது; தமிழில் ‘நாங்கள்’ என்பது இயேசுவைச் சேர்க்காத குழுவைக் குறிக்க ஏற்றது.
- source_word: ἀφέντες τὰ ἴδια
  choice: எங்களுக்குச் சொந்தமானவற்றை விட்டுவிட்டு
  rationale: τὰ ἴδια என்பது வீடு அல்லது உடைமைகள் என்று மட்டும் வரையறுக்காத பரந்த சொற்றொடர். ‘சொந்தமானவை’ அந்தத் திறந்த பொருளைத் தக்கவைக்கிறது; ἀφέντες என்பதன் முன்னோடி செயலை ‘விட்டுவிட்டு’ இயல்பாக இணைக்கிறது.
- source_word: ἠκολουθήσαμέν σοι
  choice: உம்மைப் பின்பற்றினோம்
  rationale: ἀκολουθέω என்பதன் நேரடி பின்தொடர்தல் மற்றும் சீடத்துவ நிழற்பொருள் இரண்டையும் ‘பின்பற்றினோம்’ தக்கவைக்கிறது. இயேசுவை நோக்கிய மரியாதையான ஒருமைக்கு ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: τὰ ἴδια எதைச் சுட்டுகிறது என்பது குறிப்பிடப்படாதிருத்தல்
  choice: எங்களுக்குச் சொந்தமானவற்றை
  alternative: எங்கள் உடைமைகளை / எங்கள் வீடுகளை
  rationale: கிரேக்கச் சொற்றொடர் பரந்தது; அது சொத்துகள், வீடு, குடும்பச் சூழல் அல்லது ஒருவருக்குச் சொந்தமான பிறவற்றை உள்ளடக்கலாம். வசனம் கூறாத குறிப்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ், கண்ணியமான வேதாகம நடை. உரையாடலில் இயேசுவை நோக்கி ‘உம்மை’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு மேற்கோளுக்குப் பின் வைக்கப்பட்டுள்ளது; அது முழுக் கூற்றிலுள்ள பரந்த சொற்றொடருக்கான விளக்கமாகும்.
