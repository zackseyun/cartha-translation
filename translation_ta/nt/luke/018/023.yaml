  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: ta
  text: ஆனால் அவர் இவற்றைக் கேட்டபோது, மிகவும் துயரமடைந்தார்[a]; ஏனெனில் அவர் பெரும் செல்வந்தராக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆழ்ந்த மனவேதனை அடைந்தார்.” கிரேக்கப் பெயரடை தீவிரமான துயரத்தையோ மனக்கலக்கத்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு காலத் தொடர்பைக் காட்டுகிறது; அவரது எதிர்வினை கேட்டதைத் தொடர்ந்து நிகழ்ந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயர் இயேசு முன்பு கூறியவற்றைக் குறிக்கிறது; மூலத்தின் பன்மையைப் பேணுகிறது.
- source_word: περίλυπος
  choice: மிகவும் துயரமடைந்தார்
  rationale: ஆழ்ந்த துயரம் அல்லது மனவேதனையைக் குறிக்கும் சொல்லின் தீவிரத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγενήθη
  choice: அடைந்தார்
  rationale: ஒரு நிலைக்குள் வந்ததை உணர்த்தும் γίνομαι வினையின் தொடக்கநிலைப் பொருளை, ‘துயரமடைந்தார்’ என்ற கூட்டுவினை வழியாகப் பேணுகிறது.
- source_word: πλούσιος
  choice: செல்வந்தர்
  rationale: பொருளாதார வளமுடையவரைக் குறிக்கும் தெளிவான, இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: σφόδρα
  choice: பெரும்
  rationale: அவரது செல்வத்தின் மிகுதியை வலுவாகக் காட்டுகிறது; ‘பெரும் செல்வந்தர்’ என்பது தமிழில் இயல்பான சொல்லிணைவு.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உரையாடலுக்கும் அவரது எதிர்வினைக்கும் இடையிலான மாறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: அவரது துயரத்திற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை வெளிப்படையாகக் காட்டுகிறது.
