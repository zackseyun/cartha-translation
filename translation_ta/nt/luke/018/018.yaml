source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: ta
  text: ஒரு அதிகாரி அவரிடம், “நல்ல போதகரே, நித்திய வாழ்வைச் சுதந்தரித்துக்கொள்ள நான் என்ன செய்ய வேண்டும்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: கேட்டார்
  rationale: ἐπερωτάω என்பதன் இயல்பான கதைநடைப் பொருள் ‘கேள்’; தமிழில் ‘கேட்டார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τις ἄρχων
  choice: ஒரு தலைவர்
  rationale: τις குறிப்பிடப்படாத ஒருவரை அறிமுகப்படுத்துகிறது; ἄρχων அதிகாரம் அல்லது உயர்நிலை வகிப்பவரைக் குறிக்கிறது. குறிப்பிட்ட பதவியை ஊகிக்காமல் ‘ஒரு தலைவர்’ அதன் பரந்த பொருளைப் பேணுகிறது.
- source_word: λέγων
  choice: என்று
  rationale: கேள்வியைத் தொடர்ந்து வரும் λέγων என்ற பங்கேற்பு வடிவம் தமிழில் நேரடி உரையின் முடிவிலுள்ள ‘என்று’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: Διδάσκαλε ἀγαθέ
  choice: நல்ல போதகரே
  rationale: διδάσκαλος கற்பிப்பவரைக் குறிக்கிறது; ἀγαθός என்பதையும் இயேசு அடுத்த வசனத்தில் எடுத்துரைப்பதால் ‘நல்ல’ என்பதைத் தெளிவாகப் பேணுவது அவசியம்.
- source_word: τί ποιήσας
  choice: நான் என்ன செய்ய வேண்டும்
  rationale: முற்றுவினையெச்சமான ποιήσας, எதிர்கால வினையுடன் இங்கு தேவையான செயல் அல்லது முன்நிபந்தனை குறித்த கேள்வியை உருவாக்குகிறது. தமிழில் இவ்வடிவம் இயல்பானது; மனிதச் செயலை மையப்படுத்தும் கேள்வியாளரின் எண்ணத்தையும் மாற்றாமல் வைக்கிறது.
- source_word: ζωὴν αἰώνιον
  choice: முடிவில்லா வாழ்வு
  rationale: αἰώνιος இங்கு முடிவில்லாமல் நிலைக்கும் வாழ்வைக் குறிக்கிறது. ‘முடிவில்லா வாழ்வு’ நவீன தமிழில் எளிதில் புரியும், இயல்பான சொற்றொடர்.
- source_word: κληρονομήσω
  choice: உரிமையாகப் பெற
  rationale: κληρονομέω-வின் பரம்பரை அல்லது வாரிசுரிமை சார்ந்த கருத்தை வெறும் ‘பெற’ என்பதைக் காட்டிலும் ‘உரிமையாகப் பெற’ தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: மனிதச் செயலுக்கும் முடிவில்லா வாழ்வைப் பெறுவதற்கும் இடையிலான தொடர்பாகக் கேள்வியை மொழிபெயர்த்தல்
  choice: முடிவில்லா வாழ்வை உரிமையாகப் பெற நான் என்ன செய்ய வேண்டும்?
  alternative: நான் என்ன செய்தால் முடிவில்லா வாழ்வை உரிமையாகப் பெறுவேன்?
  rationale: கிரேக்க உரை தலைவரின் கேள்வியை அவர் செய்ய வேண்டிய செயல் என்ற கோணத்தில் முன்வைக்கிறது. மொழிபெயர்ப்பு அந்தக் கேள்வியை அப்படியே பேணுகிறது; அதை லூக்காவின் இரட்சிப்புக் கோட்பாடாக அங்கீகரிப்பதுமில்லை, பிற்காலக் கோட்பாட்டு விளக்கத்தால் மென்மைப்படுத்துவதுமில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘அதிகாரி’ எனப் பதவியைத் துல்லியப்படுத்தாமல் ‘தலைவர்’ பயன்படுத்தப்பட்டது. இயல்பான தமிழுக்காக λέγων தனியே ‘சொல்லி’ என்று மொழிபெயர்க்கப்படாமல் நேரடி உரையுடன் ‘என்று கேட்டார்’ என அமைக்கப்பட்டது.
