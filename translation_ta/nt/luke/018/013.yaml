source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: ta
  text: ஆனால் வரி வசூலிப்பவன் தொலைவில் நின்றுகொண்டு, வானத்தை நோக்கித் தன் கண்களை உயர்த்தக்கூட மனமில்லாமல், தன் மார்பைத் தொடர்ந்து அடித்துக்கொண்டு, ‘கடவுளே, பாவியான என்மீது இரக்கம் காட்டும்[a]’ என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்மீது தயவாயிரும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் பாவநிவிர்த்தி மற்றும் சாந்தப்படுத்துதல் சார்ந்த சொற்குடும்பத்துடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: வரி வசூலிப்பவன்
  rationale: அக்காலத்தில் அரசுக்காக வரி வசூலித்தவரைக் குறிக்கும் தெளிவான, நவீனத் தமிழ் சொற்றொடர்; சூழலில் உள்ள சமூக இழிவையும் வாசகர் அறிந்துகொள்ள இடமளிக்கிறது.
- source_word: μακρόθεν ἑστὼς
  choice: தொலைவில் நின்றுகொண்டு
  rationale: இடைவெளியையும் அவனுடைய உடல் நிலைப்பாட்டையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: …க்கூட மனமில்லாமல்
  rationale: இது இயலாமையை அல்ல, விருப்பமின்மையையோ தயக்கத்தையோ குறிக்கிறது; கிரேக்க வினையின் மனவிருப்பச் சார்பைத் தக்கவைக்கிறது.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: வானத்தை நோக்கித் தன் கண்களை ஏறெடுக்க
  rationale: கிரேக்க மொழியின் திசையையும் வழிபாட்டுச் சைகையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: தன் மார்பில் தொடர்ந்து அடித்துக்கொண்டு
  rationale: இறந்தகாலத் தொடர்வினை வடிவம் காட்டும் தொடர்ந்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட செயலை வெளிப்படுத்துகிறது.
- source_word: ἱλάσθητί μοι
  choice: என்மீது இரக்கம் காட்டும்
  rationale: நேரடி வேண்டுதலில் எளிதாகப் புரியும் தமிழை வழங்குகிறது; அதேவேளை பாவநிவிர்த்தி/சாந்தப்படுத்துதல் சார்ந்த சொல்லியல் பின்னணி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῷ ἁμαρτωλῷ
  choice: பாவியான என்மீது
  rationale: ‘ஒரு பாவி’ என்று பொதுமைப்படுத்தாமல், கிரேக்க உருபின் வலியுறுத்தலைத் தமிழில் இயன்றவரை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἱλάσθητί μοι என்ற வேண்டுதலில் இரக்கம் மற்றும் பாவநிவிர்த்தி சார்ந்த பொருள்களை எவ்வாறு வழங்குவது
  choice: முதன்மை உரையில் ‘என்மீது இரக்கம் காட்டும்’
  alternative: ‘எனக்காகப் பாவநிவிர்த்தி செய்யும்’ அல்லது ‘என்மீது தயவாயிரும்’
  rationale: வினைச்சொல் பாவநிவிர்த்தி மற்றும் சாந்தப்படுத்துதல் சார்ந்த சொற்குடும்பத்தைச் சேர்ந்தது. ஆனால் இங்கு கடவுளிடம் செய்யப்படும் நேரடி வேண்டுதலின் இயல்பான பொருள் இரக்கத்திற்கான மன்றாட்டு. ஒரு குறிப்பிட்ட பாவநிவிர்த்திக் கோட்பாட்டை உரைக்குள் சேர்க்காமல், சொல்லின் ஆழமான தொடர்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘கடவுளே’ என்ற நேரடி அழைப்பும், ‘பாவியான என்மீது’ என்ற தன்னைத் தாழ்த்தும் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அதற்குரிய ἱλάσθητί மெய்ப்பொருளான ‘இரக்கம் காட்டும்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
