revisions:
- from: இயேசு இதைக் கேட்டபோது அவனிடம், “உனக்கு இன்னும் ஒன்று குறைவாக இருக்கிறது:[a] உன்னிடம் உள்ள அனைத்தையும் விற்று ஏழைகளுக்குப் பகிர்ந்துகொடு; அப்போது பரலோகத்தில் உனக்குப் பொக்கிஷம் இருக்கும். பின்பு வந்து என்னைப் பின்பற்று” என்றார்.
  to: இயேசு இதைக் கேட்டபோது அவனிடம், “உனக்கு இன்னும் ஒரு காரியம் குறைவாக உள்ளது:[a] உன்னிடம் உள்ள அனைத்தையும் விற்று ஏழைகளுக்குப் பகிர்ந்துகொடு; அப்போது பரலோகத்தில் உனக்குப் பொக்கிஷம் இருக்கும். வந்து என்னைப் பின்பற்று” என்றார்.
  rationale: The revision replaces an awkward literalism with idiomatic modern Tamil, while retaining the Greek clause’s emphasis that one matter remains. It also renders δεῦρο directly as «வந்து», without the added temporal specification «பின்பு». No doctrinal interpretation has been introduced.
