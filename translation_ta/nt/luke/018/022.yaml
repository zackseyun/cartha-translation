source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ta
  text: இயேசு இதைக் கேட்டபோது அவனிடம், “உனக்கு இன்னும் ஒரு காரியம் குறைவாக உள்ளது:[a] உன்னிடம் உள்ள அனைத்தையும் விற்று ஏழைகளுக்குப் பகிர்ந்துகொடு; அப்போது பரலோகத்தில் உனக்குப் பொக்கிஷம் இருக்கும். வந்து என்னைப் பின்பற்று” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு இன்னும் ஒரு குறை உள்ளது.” கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக, “உனக்கு இன்னும் ஒரு காரியம் குறைவாக உள்ளது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: இயேசு இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையையும் δέ தரும் தொடர்ச்சியையும் இயல்பான தமிழ்க் காலத் துணைவாக்கியமாக வழங்குகிறது; முந்தைய கூற்றையே ‘இதை’ சுட்டுகிறது.
- source_word: Ἔτι ἕν σοι λείπει
  choice: உனக்கு இன்னும் ஒன்று குறைவாக இருக்கிறது
  rationale: λείπει என்பதன் ‘குறைவாக/இல்லாமல் இருக்கிறது’ என்ற பொருளையும், கிரேக்கத்தில் ‘ஒன்று’ எழுவாயாக இருப்பதையும் முடிந்தவரை காக்கிறது.
- source_word: πάντα ὅσα ἔχεις
  choice: உன்னிடம் உள்ள அனைத்தையும்
  rationale: πάντα ὅσα என்பதன் முழுமையான விரிவைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πώλησον
  choice: விற்று
  rationale: தீர்மானமான செயலைக் கோரும் கட்டளையைத் தொடர்ந்து வரும் பகிர்ந்துகொடுத்தலுடன் இயல்பாக இணைக்கிறது.
- source_word: διάδος πτωχοῖς
  choice: ஏழைகளுக்குப் பகிர்ந்துகொடு
  rationale: διαδίδωμι என்பதிலுள்ள பகிர்ந்து வழங்குதல் என்ற நுணுக்கத்தைப் பொதுவான ‘கொடு’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: பரலோகத்தில் உனக்குப் பொக்கிஷம் இருக்கும்
  rationale: தமிழ் வேதாகம வழக்கிலும் பொதுப் பயன்பாட்டிலும் இயல்பான ஒருமை ‘பரலோகம்’ பயன்படுத்தப்படுகிறது; ἕξεις என்பதன் உடைமைப் பொருள் இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: δεῦρο ἀκολούθει μοι
  choice: பின்பு வந்து என்னைப் பின்பற்று
  rationale: δεῦρο தரும் வருகைக்கான அழைப்பையும் ἀκολούθει தரும் தொடர்ச்சியான சீடத்துவ அழைப்பையும் இயல்பான தமிழில் காக்கிறது; ‘பின்பு’ செயல்களின் வரிசையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: துறத்தலும் சீடத்துவமும் குறித்த கட்டளையின் பரப்பு
  choice: இந்த நபருக்குச் சொல்லப்பட்ட பொருளாதாரத் துறப்பின் நேரடியான கட்டளையையும், அதன் உச்சமாகிய ‘என்னைப் பின்பற்று’ என்ற அழைப்பையும் அப்படியே வைத்தல்
  alternative: எல்லா விசுவாசிகளுக்கும் விதிக்கப்பட்ட முழுச் சொத்துத் துறப்பாகவோ, நடைமுறைப் பொருளற்ற வெறும் அடையாளக் கட்டளையாகவோ விளக்குதல்
  rationale: வசனம் இந்த நபருக்கு உண்மையான, குறிப்பிட்ட செயலைக் கட்டளையிடுகிறது; ஆனால் அதன் உலகளாவிய பயன்பாட்டை இந்த வசனம் தனியே வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பொக்கிஷம்’, ‘பரலோகம்’, ‘பின்பற்று’ ஆகியவை பரிச்சயமான வேதாகமச் சொற்களாக இருந்தாலும் இன்றைய வாசகருக்கும் தெளிவானவை. கிரேக்கப் பன்மை οὐρανοῖς தமிழ் வழக்கிற்கு ஏற்ப ‘பரலோகத்தில்’ என ஒருமையில் வழங்கப்பட்டது; தனி அடிக்குறிப்பு அவசியமில்லை.
