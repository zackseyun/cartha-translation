source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ta
  text: முன்னே சென்றவர்கள் அவன் அமைதியாக இருக்கும்படி அவனைக் கண்டித்துக்கொண்டிருந்தார்கள். ஆனால் அவனோ இன்னும் அதிகமாக, “தாவீதின் மகனே, எனக்கு இரக்கம் காட்டும்!” என்று தொடர்ந்து கூக்குரலிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: முன்னால் சென்றுகொண்டிருந்தவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்கால வினையெச்சம்; கூட்டத்தில் முன்னால் சென்றவர்களைக் குறிக்கிறது. அவர்களுக்கு வழிநடத்தும் பங்கு இருந்ததாகக் கூடுதலாகப் பொருள் புகுத்தாமல் இடம்சார்ந்த கருத்தைப் பாதுகாக்கிறது.
- source_word: ἐπετίμων
  choice: கண்டித்தார்கள்
  rationale: ἐπιτιμάω என்பதன் கடுமையான கண்டிப்பு அல்லது அதட்டல் என்ற வலிமையைத் தருகிறது. கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த அல்லது மீண்டும் நிகழ்ந்த செயல், தமிழில் சூழலாலும் அடுத்துள்ள நோக்கக் கட்டமைப்பாலும் போதுமான அளவு வெளிப்படுகிறது.
- source_word: ἵνα σιγήσῃ
  choice: அமைதியாக இருக்கும்படி
  rationale: ἵνα மற்றும் இறந்தகாலத் துணைவினை வடிவம் தெரிவிக்கும் நோக்கத்தை இயல்பான தமிழில் காட்டுகிறது; வெறுமனே சத்தத்தைக் குறைக்கச் சொல்வதைவிட மௌனமாக இருக்கச் சொன்ன வலிமையையும் தக்கவைக்கிறது.
- source_word: αὐτὸς δὲ
  choice: ஆனால் அவனோ
  rationale: δὲ-யின் எதிர்மறைத் தொடர்பையும் αὐτός-இன் அழுத்தத்தையும் இயல்பான தமிழ் வேற்றுமைத் துகளான “ஓ” மூலம் வெளிப்படுத்துகிறது.
- source_word: πολλῷ μᾶλλον
  choice: இன்னும் அதிகமாக
  rationale: ஒப்பீட்டு வலுப்படுத்தலை நேரடியாகப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத “உரத்த குரலில்” என்பதைச் சேர்க்கவில்லை.
- source_word: ἔκραζεν
  choice: தொடர்ந்து கூக்குரலிட்டான்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த அல்லது மீண்டும் நிகழ்ந்த செயற்பாட்டை “தொடர்ந்து” என்பதன் மூலம் தெளிவாக்குகிறது; κράζω-வின் உரத்த அழைப்பையும் “கூக்குரலிட்டான்” இயல்பாகத் தருகிறது.
- source_word: Υἱὲ Δαυίδ
  choice: தாவீதின் மகனே
  rationale: அழைப்புவேற்றுமையிலுள்ள தாவீதிய-மேசிய பட்டத்தை மொழிபெயர்த்து, அதன் அரச வம்ச மற்றும் கிறிஸ்துவியல் முக்கியத்துவத்தை விளக்கச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: ἐλέησόν με
  choice: என்மேல் இரக்கமாயிரும்
  rationale: அவசரமான வேண்டுதலையும் இரக்கத்திற்கான ஆழமான விண்ணப்பத்தையும் dignified, தெளிவான தமிழ் வழக்கில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Υἱὲ Δαυίδ என்பதன் மேசிய முக்கியத்துவம்
  choice: முதன்மை உரையில் “தாவீதின் மகனே” என்ற பட்டமாக மொழிபெயர்த்தல்
  alternative: வெறும் மரியாதை அழைப்பாகக் கருதி கூடுதல் கவனமின்றி வழங்குதல்
  rationale: லூக்காவின் கதைச்சூழலில் இது தாவீதிய அரச வம்சத்தையும் மேசிய எதிர்பார்ப்பையும் தாங்கும் பட்டம். நேரடியாக மொழிபெயர்ப்பது எந்தக் கோட்பாட்டு விரிவாக்கமும் சேர்க்காமல் அந்த முக்கியத்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான நடை, அதே நேரத்தில் வேண்டுதலின் கண்ணியமும் தீவிரமும் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான கண்டிப்பு மற்றும் விடாமுயற்சியான கூக்குரல் ஆகியவை தமிழ் வினைநடையில் வெளிப்படுத்தப்பட்டுள்ளன.
