  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: ta
  text: இரு ஆண்கள் ஜெபிப்பதற்காக ஆலயத்துக்கு[a] ஏறிச் சென்றார்கள்; ஒருவர் பரிசேயர், மற்றவர் வரி வசூலிப்பவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் ἱερόν, ஆலயத்தின் உள் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: ஆண்கள் இருவர்
  rationale: ἄνθρωποι என்பது பொதுவாக மனிதர்களைக் குறிக்கக்கூடும்; ஆனால் இங்கு தொடரும் ஆண்பால் ஒருமை வடிவங்களும் இருவரின் அடையாளங்களும் ஆண்களையே சுட்டுகின்றன. ‘ஆண்கள் இருவர்’ என்பது இயல்பான, பாலினத் துல்லியமுள்ள தமிழ்.
- source_word: ἀνέβησαν
  choice: ஏறிச் சென்றார்கள்
  rationale: ἀναβαίνω என்பதன் ‘மேலே செல்’ என்ற பொருளை இது காக்கிறது; எருசலேமுக்கும் ஆலயத்துக்கும் செல்வதைப் பற்றிய வழக்கையும் நில அமைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ ἱερὸν
  choice: ஆலயத்துக்கு
  rationale: ἱερόν என்பது உள் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது. முதன்மை உரையில் ‘ஆலயம்’ வாசிப்புக்கு இயல்பானது; அதன் துல்லியமான வரம்பு அடிக்குறிப்பில் விளக்கப்படுகிறது. εἰς இச்சூழலில் தமிழில் இயல்பாக ‘-க்கு’ என வழங்கப்படுகிறது.
- source_word: προσεύξασθαι
  choice: வேண்டிக்கொள்வதற்காக
  rationale: இறைவேண்டலே அவர்கள் சென்றதன் நோக்கம் என்பதை நோக்கப்பொருள் வினையெச்சம் காட்டுகிறது. ‘வேண்டிக்கொள்வதற்காக’ என்பது தெளிவான, தற்போதைய கண்ணியமான தமிழ்.
- source_word: ὁ εἷς
  choice: ஒருவர்
  rationale: ὁ ἕτερος என்பதோடு பகிர்ந்தளிக்கும் எதிரிணையாக வருகிறது; தமிழில் ‘ஒருவர் … மற்றவர்’ என்பது இயல்பான அமைப்பு.
- source_word: Φαρισαῖος
  choice: பரிசேயர்
  rationale: யூத சமயக் குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் வடிவம்; மரியாதைப் பன்மை இங்கு இயல்பாகப் பயன்படுகிறது.
- source_word: ὁ ἕτερος
  choice: மற்றவர்
  rationale: இருவரில் எதிர்நிலையில் குறிப்பிடப்படும் இரண்டாம் நபரை இயல்பாகக் குறிக்கிறது.
- source_word: τελώνης
  choice: வரி வசூலிப்பவர்
  rationale: τελώνης என்பது வரி அல்லது சுங்கம் வசூலிப்பவரைக் குறிக்கிறது. ‘வரி வசூலிப்பவர்’ என்பது இன்றைய வாசகருக்குத் தெளிவான, பழமையற்ற சொற்றொடர்.
theological_decisions:
- issue: ἱερόν என்பதையும் ναός என்பதையும் வேறுபடுத்திக் காட்டுதல்
  choice: முதன்மை உரையில் ‘ஆலயம்’; அடிக்குறிப்பில் ஆலய வளாகம் என்ற விளக்கம்
  alternative: ஆலய வளாகத்துக்கு
  rationale: இங்கு கூறப்படுவது உள் திருத்தலம் மட்டும் அல்ல, விரிந்த ஆலய வளாகம். வாசிப்பின் இயல்புக்காகப் பழக்கமான ‘ஆலயம்’ வைக்கப்பட்டு, சொற்பொருளின் துல்லியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἄνθρωποι என்பதன் பாலின வெளிப்பாடு
  choice: ஆண்கள்
  alternative: மனிதர்கள் / மக்கள்
  rationale: இந்தச் சொல் பொதுவாக அனைவரையும் குறிக்கக்கூடியதாயினும், உடனடியான சூழலும் ஆண்பால் இலக்கண வடிவங்களும் குறிப்பிட்ட இரண்டு ஆண்களை அடையாளப்படுத்துகின்றன; எனவே பாலினத்தை மறைக்காமல் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏறிச் சென்றார்கள்’ மூலத்தின் திசைநுட்பத்தைப் பாதுகாக்கிறது; ‘ஒருவர் … மற்றவர்’ என்ற அமைப்பு இயல்பான தமிழ் எதிரிணையை வழங்குகிறது.
