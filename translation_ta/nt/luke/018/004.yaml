  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: ta
  text: 'சில காலம் அவன் விரும்பவில்லை. ஆனால் பின்னர் அவன் தனக்குள் இவ்வாறு சொல்லிக்கொண்டான்: ‘நான் கடவுளுக்குப் பயப்படுவதும் இல்லை, எந்த மனிதரையும் மதிப்பதும் இல்லை என்றாலும்,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: மனமில்லாமல் இருந்தான்
  rationale: இறந்தகாலத் தொடர்நிலையை உணர்த்தும் வினைவடிவம், ஒரு காலப்பகுதி முழுவதும் அவன் இணங்க விரும்பாமல் இருந்ததைச் சுட்டுகிறது. தமிழில் இது இயல்பாகவும் மிகைப்படுத்தாமலும் அந்த மனநிலையைத் தெரிவிக்கிறது.
- source_word: ἐπὶ χρόνον
  choice: சில காலம்
  rationale: குறிப்பிடப்படாத ஒரு கால அளவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: μετὰ ταῦτα δὲ
  choice: ஆனால் பின்னர்
  rationale: நிகழ்வுகளின் கால வரிசையையும் கதையில் ஏற்படும் மெல்லிய திருப்பத்தையும் தக்கவைக்கிறது.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: தனக்குள்
  rationale: வெளியே பேசப்பட்ட கூற்றல்ல, உள்ளார்ந்த தனிப்பேச்சு என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Εἰ καὶ
  choice: என்றாலும்
  rationale: இங்கு நிபந்தனையைவிட ஒப்புக்கொள்ளும் முரண்பாட்டு உணர்வே முதன்மை; வாக்கியத்தின் முடிவில் வரும் தமிழ் இணைப்புச் சொல் அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: நான் கடவுளுக்குப் பயப்படுவதும் இல்லை
  rationale: கடவுளைக் குறித்த பயம் அல்லது பயபக்தி என்ற மூலத்தின் நேரடியான இறையியல் மொழியைத் தக்கவைக்கிறது.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: எந்த மனிதரையும் மதிப்பதும் இல்லை
  rationale: ἐντρέπομαι என்பதன் இச்சூழலுக்குரிய மதித்தல் அல்லது பொருட்படுத்துதல் என்ற பொருளைத் தருகிறது. ஒருமை ἄνθρωπον பொதுப்பொருளில் வருவதால், தமிழில் ‘எந்த மனிதரையும்’ என்பது இயல்பாக அதன் பரந்த குறிப்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஒருமையில் பொதுப்பொருளில் வரும் ἄνθρωπον
  choice: எந்த மனிதரையும்
  alternative: மனிதனை
  rationale: மூலமொழியின் ஒருமை இங்கு குறிப்பிட்ட ஓர் ஆணைக் குறிக்காமல் மனிதர் எவரையும் பொதுவாகக் குறிக்கிறது. ‘எந்த மனிதரையும்’ என்பது பாலினத்தைத் தவறாகக் குறுக்காமல் தமிழில் அந்தப் பொதுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- issue: Εἰ καὶ என்பதன் நிபந்தனை அல்லது ஒப்புக்கொள்ளும் முரண்பாடு
  choice: என்றாலும்
  alternative: ஒருவேளை ... இருந்தாலும்
  rationale: நீதிபதி தன்னைப் பற்றிய உண்மையை ஒப்புக்கொண்டு, அதற்கு மாறான செயலை அடுத்த வசனத்தில் தீர்மானிக்கிறார்; ஆகவே ஒப்புக்கொள்ளும் முரண்பாட்டு வாசிப்பு சூழலுக்கு ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நேரடி உரையாக இருப்பதால் முடிவில் நிறைவு குறியீடு இடப்படவில்லை.
