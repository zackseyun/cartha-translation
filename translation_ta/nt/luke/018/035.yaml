translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “பார்வையற்ற” என்பது இன்றைய மரியாதையான பயன்பாடு; தொடர்நிலை வினைகள் கிரேக்க இறந்தகாலத் தொடர்நிலையையும் நிகழ்காலப் பங்கேற்பு வினையின் பின்னணி செயலையும் வெளிப்படுத்துகின்றன.
