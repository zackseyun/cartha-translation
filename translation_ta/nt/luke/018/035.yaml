source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: ta
  text: அவர் எரிகோவை நெருங்கிக்கொண்டிருந்தபோது[a], பார்வையற்ற ஒருவர்[b] சாலையோரத்தில் உட்கார்ந்து பிச்சை கேட்டுக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் எரிகோவுக்கு அருகில் வந்துகொண்டிருந்தபோது.”
    reason: lexical_alternative
  - marker: b
    text: “ஒரு பார்வையற்ற மனிதர்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ஒருவரைச் சற்றுத் தனிப்படுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இந்தச் சொற்றொடர் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இடைமாற்றாகச் செயல்படுகிறது. தமிழில் தனியாக “அப்போது நிகழ்ந்தது” என்று சேர்ப்பது இயல்பற்றதாக இருக்கும்; காலத் தொடர்பை “நெருங்கிக்கொண்டிருந்தபோது” என்ற அமைப்பே தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: அவர் எரிகோவை நெருங்கிக்கொண்டிருந்தபோது
  rationale: ἐν என்பதுடன் வரும் பெயராக்கப்பட்ட நிகழ்கால வினையெச்சம் ஒரே நேரத்தில் நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது. “நெருங்கிக்கொண்டிருந்தபோது” அதன் தொடர்நிலையையும், εἰς காட்டும் எரிகோவை நோக்கிய நகர்வையும் இயல்பான தமிழில் தருகிறது.
- source_word: τυφλός τις
  choice: பார்வையற்ற ஒருவர்
  rationale: τυφλός என்பதைக் கண்ணியமான நவீன தமிழில் “பார்வையற்ற” என மொழிபெயர்த்துள்ளது. τις தரும் வரையறுக்கப்படாத, ஆனால் ஒருவரைத் தனிப்படுத்திக் காட்டும் மென்மையான நுட்பத்தை “ஒருவர்” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκάθητο
  choice: உட்கார்ந்து … கேட்டுக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலையைச் சுட்டும் வினைவடிவம் காட்சியின் பின்னணியில் நீடித்த செயலைக் காட்டுகிறது. தமிழில் “உட்கார்ந்து … கேட்டுக்கொண்டிருந்தார்” என்ற தொடர் இயல்பாக அந்த நிலையைத் தருகிறது.
- source_word: παρὰ τὴν ὁδὸν
  choice: சாலையோரத்தில்
  rationale: παρά இங்கு சாலையின் பக்கத்திலுள்ள இடத்தைக் குறிக்கிறது. “சாலையோரத்தில்” என்பது சுருக்கமான, தெளிவான நவீனத் தமிழ் வழக்கு.
- source_word: ἐπαιτῶν
  choice: பிச்சை கேட்டுக்கொண்டிருந்தார்
  rationale: அவர் அப்போது செய்துகொண்டிருந்த இரப்புச் செயலை இந்தப் பங்கேற்பு வினை குறிக்கிறது. “பிச்சை கேட்டுக்கொண்டிருந்தார்” என்பது பொருளையும் தொடர்நிலையையும் நேரடியாகத் தருகிறது.
