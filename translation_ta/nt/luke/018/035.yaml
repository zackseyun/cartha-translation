  source_fidelity: மூலக் கிரேக்கத்தின் காலப்பின்னணி அமைப்பு, எரிகோவை நோக்கிய நெருங்குதல், பார்வையற்ற ஒருவரின் குறிப்பிடத்தக்க ஆனால் வரையறுக்கப்படாத குறிப்பு (τις), சாலையோர அமர்ந்த நிலை, மற்றும் பிச்சை கேட்டுக்கொண்டிருந்த தொடர்செயல் ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. Ἐγένετο δὲ-யைத் தனியாகச் சொற்சொல்லாக மொழிபெயர்க்காமல் விடுவது தமிழில் இயல்பான கதைநடை மாற்றமாகும்.
  naturalness: “அவர் எரிகோவை நெருங்கிக்கொண்டிருந்தபோது, பார்வையற்ற ஒருவர் சாலையோரத்தில் உட்கார்ந்து பிச்சை கேட்டுக்கொண்டிருந்தார்” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் இயல்பாகவும் உள்ளது. “பார்வையற்ற” என்பது மரியாதையான பயன்பாடு.
  terminology: “எரிகோ,” “பார்வையற்ற,” “சாலையோரத்தில்,” மற்றும் “பிச்சை கேட்டுக்கொண்டிருந்தார்” ஆகிய சொல் தேர்வுகள் பொருத்தமானவை. இறையியல் சார்ந்த தனிப்பட்ட சொற்கள் இவ்வசனத்தில் இல்லை.
