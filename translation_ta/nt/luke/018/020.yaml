language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: ta
  text: 'கட்டளைகள் உனக்குத் தெரியும்: “விபசாரம் செய்யாதே[a]; கொலை செய்யாதே; திருடாதே; பொய்ச் சாட்சி சொல்லாதே; உன் தந்தையையும் தாயையும் மதித்து நட.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தத் தடைக் கட்டளைகளை, “விபசாரம் செய்யக்கூடாது; கொலை செய்யக்கூடாது; திருடக்கூடாது; பொய்ச் சாட்சி சொல்லக்கூடாது” என்றும் மொழிபெயர்க்கலாம்.
    reason: நேரடியாக ஒருவரை நோக்கும் தடை வடிவத்திற்குப் பதிலாக, பாரம்பரியமான பொதுவிதி வடிவத்தையும் காட்டும் நடைமுறை மாற்று.
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: கட்டளைகள்
  rationale: இச்சூழலில் இது பத்துக் கட்டளைகளிலிருந்து மேற்கோள் காட்டப்படும், அதிகாரமுள்ள நெறிக் கட்டளைகளைக் குறிக்கிறது. ‘கட்டளைகள்’ என்பது இயல்பானதும் அடையாளம் காணக்கூடியதுமான தமிழ் சொல்.
- source_word: οἶδας
  choice: உனக்குத் தெரியும்
  rationale: οἶδα வடிவத்தில் perfect ஆக இருந்தாலும், கோயினே கிரேக்கத்தில் நிகழ்காலப் பொருளில் ‘அறிந்திருக்கிறாய்/தெரியும்’ எனப் பயன்படுகிறது. ‘உனக்குத் தெரியும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: Μὴ μοιχεύσῃς
  choice: விபசாரம் செய்யாதே
  rationale: μοιχεύω திருமணத் துரோகமான பாலுறவைக் குறிப்பாகக் குறிக்கிறது. ‘விபசாரம் செய்யாதே’ அந்த நெறிசார் குறிப்பைத் தெளிவாகக் காக்கிறது.
- source_word: Μὴ φονεύσῃς
  choice: கொலை செய்யாதே
  rationale: φονεύω என்பது எல்லா வகையான உயிர்கொல்லுதலையும் பொதுவாகக் குறிக்காமல், கொலை செய்வதைக் குறிக்கிறது. எனவே ‘கொலை’ என்பது துல்லியமான தேர்வு.
- source_word: Μὴ κλέψῃς
  choice: திருடாதே
  rationale: κλέπτω என்பதன் நேரான பொருள் ‘திருடுதல்’; சுருக்கமான தடை வடிவம் கிரேக்கத்தின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: பொய்ச் சாட்சி சொல்லாதே
  rationale: ψευδομαρτυρέω என்பது பொய்யாகச் சாட்சி கூறுவதைக் குறிக்கிறது. ‘பொய்ச் சாட்சி’ என்ற சொற்றொடர் பத்துக் கட்டளைகளுடனான தொடர்பையும் காக்கிறது.
- source_word: Τίμα
  choice: மதித்து நட
  rationale: τιμάω இங்கு பெற்றோருக்குரிய மதிப்பையும் அதற்கேற்ற நடத்தையையும் குறிக்கிறது. ‘மதித்து நட’ என்பது ‘கனம் பண்ணு’ போன்ற பழைய வழக்கைத் தவிர்த்து, நவீனத் தமிழில் கட்டளையின் தொடர்ச்சியான நடைமுறைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: உன் தந்தையையும் தாயையும்
  rationale: இரு பெற்றோரையும் நேரடியாகக் குறிப்பிடும் மூலத்தின் பொருளைத் தமிழில் இணையான இணைப்புக் கட்டமைப்புடன் காக்கிறது.
theological_decisions:
- issue: பத்துக் கட்டளைப் பாணியிலான தடைகளைத் தமிழில் வடிவமைத்தல்
  choice: ‘செய்யாதே’ என்ற நேரடி தடை வடிவம்
  alternative: ‘செய்யக்கூடாது’ என்ற பொதுவிதி வடிவம்
  rationale: கிரேக்கத்தில் இவை ஒருமை இரண்டாம் நபரை நோக்கிய தடைக் கட்டளைகள். ‘செய்யாதே’ என்பது அவற்றின் நேரடியான உரையாடல் வலிமையை நவீனத் தமிழில் தெளிவாகக் காக்கிறது; இது கோட்பாட்டு தீர்மானம் அல்ல, நடைத் தேர்வு.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம மேற்கோளின் செறிவும் காக்கப்பட்டுள்ளன. ‘கனம் பண்ணு’ போன்ற பழைய திருச்சபை வழக்குகளும், மிகப் பேச்சுவழக்கான சொற்களும் தவிர்க்கப்பட்டுள்ளன.
