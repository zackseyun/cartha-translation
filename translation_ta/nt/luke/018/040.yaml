  text: 'இயேசு நின்று, அவனைத் தம்மிடம் கொண்டுவரும்படி கட்டளையிட்டார்.[a] அவன் அருகில் வந்தபோது, இயேசு அவனிடம் கேட்டார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனைத் தம்மிடம் வழிநடத்தி வரும்படி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: நின்று
  rationale: ἵστημι என்பதன் இறந்தகாலப் பங்கேற்பு இங்கு செயப்படுபொருளற்ற பொருளில் வந்து, இயேசு முன்னே செல்வதை நிறுத்தி நின்றதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: δέ என்பது மென்மையான கதைத் தொடர்புச் சொல்; தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடர்ச்சியால் அதை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டார்
  rationale: κελεύω அதிகாரத்துடன் ஆணையிடுவதைக் குறிக்கிறது; ‘கட்டளையிட்டார்’ அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀχθῆναι
  choice: அழைத்து வரும்படி
  rationale: ἄγω என்பதன் செயப்பாட்டு infinitive இங்கு பிறர் அந்த மனிதனை இயேசுவிடம் கொண்டுவருவதைக் குறிக்கிறது; தமிழில் ‘அழைத்து வரும்படி’ இயல்பாக உள்ளது, வழிநடத்தி வருதல் என்ற சாத்தியத்தையும் முற்றிலும் நீக்காது.
- source_word: πρὸς αὐτόν
  choice: தம்மிடம்
  rationale: πρός + accusative இயேசுவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; எழுவாய் இயேசுவே என்பதால் மரியாதைத் தற்சுட்டான ‘தம்மிடம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: அவன் அருகில் வந்தபோது
  rationale: Genitive absolute அமைப்பின் காலத் தொடர்பை ‘வந்தபோது’ இயல்பாகக் காட்டுகிறது; ‘அவன்’ என்பது முன் குறிப்பிடப்பட்ட மனிதனைக் குறிக்கிறது.
- source_word: ἐπηρώτησεν αὐτόν
  choice: இயேசு அவனிடம் கேட்டார்
  rationale: ἐπερωτάω இச்சூழலில் பொதுவாக ‘கேள்’ என்று பொருள் தருகிறது. கிரேக்கத்தில் உள்ள மறைமுக எழுவாயைத் தமிழில் ‘இயேசு’ என்று மீண்டும் கூறுவது குழப்பத்தைத் தவிர்க்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: பெயர் வழக்கமான நவீனத் தமிழ் வேதாகமப் பெயர்ப்பாட்டின்படி வழங்கப்படுகிறது.
