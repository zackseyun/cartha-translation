source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: ta
  text: ஏனெனில், செல்வந்தர் ஒருவர் கடவுளின் அரசாட்சிக்குள் நுழைவதைவிட, ஓர் ஒட்டகம் ஊசிக்காதின் வழியாக நுழைவது எளிது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊசிக்காது’ என்பது ஒரு குறுகிய வாயிலின் பெயர் என்றும், ‘ஒட்டகம்’ என்பதற்குப் பதில் ‘கயிறு’ என்று பொருள் கொள்ள வேண்டும் என்றும் சிலர் விளக்கியுள்ளனர். ஆனால் இங்குள்ள கிரேக்க உரை ‘ஒட்டகம்’ என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: எளிது
  rationale: ἐστιν என்பதுடன் வரும் ஒப்பீட்டு வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த, ‘...விட ... எளிது’ என்ற அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κάμηλον
  choice: ஓர் ஒட்டகம்
  rationale: κάμηλος என்பதன் நேரடியான, வழக்கமான பொருள் ‘ஒட்டகம்’; உரை ஆதாரமில்லாத ‘கயிறு’ போன்ற விளக்கங்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: διὰ τρήματος βελόνης
  choice: ஊசியின் காதுவழியாக
  rationale: ‘ஊசியின் துளை வழியாக’ என்ற மூலப் படிமத்தை இயல்பான நவீனத் தமிழில் ‘ஊசியின் காதுவழியாக’ என்பது துல்லியமாகத் தருகிறது.
- source_word: εἰσελθεῖν
  choice: நுழைவது
  rationale: ஒப்பீட்டின் இரு பகுதிகளிலும் εἰσελθεῖν என்பதன் இயக்கப் பொருளை ஒரே சொல்லால் சீராகப் பாதுகாக்கிறது.
- source_word: πλούσιον
  choice: செல்வந்தர் ஒருவர்
  rationale: ஆண்பால் ஒருமையில் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள பெயரடையை, நவீனத் தமிழில் இயல்பாகவும் மரியாதையான பொதுக் குறிப்பாகவும் தருகிறது.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சிக்குள்
  rationale: εἰς என்பதன் உள்ள்நோக்கிய இயக்கத்தை ‘-க்குள்’ பாதுகாக்கிறது; βασιλεία என்பதை வெறும் நிலப்பரப்பாக அல்லாமல் கடவுளின் ஆட்சியைக் குறிக்கும் ‘அரசாட்சி’ எனத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ஒட்டகம்–ஊசிக்காது படிமத்தின் விளக்கம்
  choice: ‘ஓர் ஒட்டகம் ஊசியின் காதுவழியாக நுழைவது’ என்ற உரையின் நேரடியான மிகைப்படுத்தல் படிமத்தைத் தக்கவைத்தல்
  alternative: ‘ஊசியின் காது’ என்பது ஒரு குறுகிய வாயிலின் பெயர் என விளக்குதல் அல்லது ‘ஒட்டகம்’ என்பதற்குப் பதில் ‘கயிறு’ எனப் பொருள் கொள்ளுதல்
  rationale: கொடுக்கப்பட்ட கிரேக்க உரையில் κάμηλον என்பது ‘ஒட்டகம்’ என்றே உள்ளது. செல்வந்தர் கடவுளின் அரசாட்சிக்குள் நுழைவதிலுள்ள கடினத்தை வலியுறுத்தும் வேண்டுமென்றே இயலாததுபோல் அமைந்த படிமத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தவோ மறுவிளக்கம் செய்யவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் வகையிலும் வேதாகமக் கூற்றுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘ராஜ்யம்’ என்பதற்குப் பதில் இயல்பான தமிழ் வடிவமான ‘அரசாட்சி’ பயன்படுத்தப்பட்டது; மூலத்தின் வலுவான ஒட்டகம்–ஊசிக்காது படிமம் அப்படியே பாதுகாக்கப்பட்டது.
