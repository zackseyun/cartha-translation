lexical_decisions:
- source_word: Ἔλεγεν
  choice: சொன்னார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் பின்னணியை அமைக்கும் அல்லது தொடர்ந்த செயலைக் குறிக்கலாம். தமிழில் ‘சொன்னார்’ இச்சூழலில் இயல்பாக உள்ளது; ‘சொல்லிக்கொண்டிருந்தார்’ என்பது தேவையற்ற தொடர்ச்சியை வலியுறுத்தக்கூடும்.
- source_word: δὲ
  choice: வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான உரையாடல் இணைப்புச் சொல். தனியே ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தமிழில் இல்லாத கால அல்லது முரண்பாட்டு அழுத்தத்தை ஏற்படுத்தலாம்.
- source_word: παραβολὴν
  choice: ஓர் உவமை
  rationale: சினாப்டிக் நற்செய்திகளில் παραβολή என்பதற்கான நிலையான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: சொல்லப்பட்டவர்களைக் குறிக்கும் மறைமுகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸς τὸ δεῖν
  choice: வேண்டும் ... என்பதைக் குறித்து
  rationale: πρὸς τό + வினையெச்ச அமைப்பு நோக்கம் அல்லது தொடர்பைக் குறிக்கலாம். முதன்மை உரை அவசியத்தைத் தெளிவாகக் காட்டியபடி தொடர்பு சார்ந்த வாசிப்பைப் பாதுகாக்கிறது; நோக்க வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πάντοτε προσεύχεσθαι
  choice: எப்போதும் ஜெபிக்க வேண்டும்
  rationale: πάντοτε என்பதன் தொடர்ந்த நிலைத்தன்மையையும் προσεύχεσθαι என்பதன் வழக்கமான பொருளையும் தெளிவாகத் தருகிறது; இடைவிடாத வாய்மொழிச் செயல் என்ற மரப்பொருளை கட்டாயப்படுத்தவில்லை.
- source_word: μὴ ἐγκακεῖν
  choice: மனந்தளரக் கூடாது
  rationale: ἐγκακέω இங்கு ஊக்கமிழத்தல், சோர்ந்து கைவிடுதல் என்ற பொருள் கொண்டது. ‘மனந்தளரக் கூடாது’ என்பது உள்ளார்ந்த சோர்வையும் விடாமுயற்சிக்கான அழைப்பையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: தொடர்ந்து ஜெபிப்பதற்கான அவசியத்தின் வலிமை
  choice: ‘ஜெபிக்க வேண்டும், மனந்தளரக் கூடாது’ என்று அவசியத்தையும் அறிவுறுத்தலையும் வெளிப்படுத்துதல்
  alternative: ‘தொடர்ந்து ஜெபிப்பது அவர்களுக்குத் தேவை’ என்று பெயர்ச்சொல் அமைப்பில் மென்மையாக மொழிபெயர்த்தல்
  rationale: δεῖν உண்மையான அவசியத்தை வெளிப்படுத்துகிறது. அதேவேளை, ஜெபத்தின் விளைவைப் பற்றிய எந்த ஒரு பிரிவுசார் கோட்பாட்டையும் வசனத்தில் சேர்க்காமல் அதன் அறிவுறுத்தல் வலிமை பாதுகாக்கப்படுகிறது.
- issue: πρὸς τὸ δεῖν அமைப்பின் தொடர்பு அல்லது நோக்க நுட்பம்
  choice: முதன்மை உரையில் ‘என்பதைக் குறித்து’
  alternative: ‘என்பதை உணர்த்துவதற்காக’
  rationale: கிரேக்க அமைப்பு பொருள்/தொடர்பையும் நோக்கத்தையும் அனுமதிக்கிறது. முதன்மை வாசிப்பு ஒன்றைத் தேர்ந்தெடுத்தாலும், மற்ற உண்மையான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபிக்க’ என்பது கிறிஸ்தவ வேதாகமச் சூழலில் பொதுவாகப் புரியப்படும் சொல்; ‘மனந்தளரக் கூடாது’ என்பது இலக்கியத் தொனியை அளவுக்கு மீறாமல் காத்து, சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
