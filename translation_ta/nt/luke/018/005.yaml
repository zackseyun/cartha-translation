id: LUK.18.5
reference: Luke 18:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: ta
  text: “ஆனாலும், இந்த விதவை எனக்குத் தொடர்ந்து தொல்லை கொடுப்பதால், அவள் தொடர்ந்து வந்து என்னைத் தளரச் செய்யாதபடி, அவளுக்கு நீதி வழங்குவேன்[a].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவளுடைய நியாயத்தை நிலைநாட்டுவேன்’ என்றும் மொழிபெயர்க்கலாம். சில சூழல்களில் இந்தக் கிரேக்க வினைச்சொல் ‘அவளுக்காகப் பழிவாங்குவேன்’ எனப் பொருள்படலாம்; இங்கு சட்டப்படி நீதி வழங்குவதே கருத்து.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்கு சொல், ‘என் கண்ணுக்குக் கீழே அடிப்பாள்.’ இங்கு இது ‘என்னைத் தளரச் செய்வாள்’ அல்லது ‘என்னை மிகவும் சோர்வடையச் செய்வாள்’ என்ற உருவகப் பொருளில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: எனக்குத் தொடர்ந்து தொல்லை கொடுப்பதால்
  rationale: διά + பெயராக்கப்பட்ட நிகழ்கால வினையெச்சம் காரணத்தையும் நீடிக்கும் செயலையும் குறிக்கிறது; γε நீதிபதியின் தயக்கத்துடனான ஒப்புதலுக்கு வலு சேர்க்கிறது. இயல்பான தமிழில் ‘தொடர்ந்து தொல்லை கொடுப்பதால்’ என வழங்கப்பட்டது.
- source_word: τὴν χήραν ταύτην
  choice: இந்த விதவை
  rationale: சுட்டுப்பெயரடையையும் ‘விதவை’ என்ற சமூக நிலையைச் சுட்டும் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐκδικήσω αὐτήν
  choice: அவளுக்கு நீதி வழங்குவேன்
  rationale: சட்டச் சூழலில் இது தனிப்பட்ட பழிவாங்குதலைவிட உரிய நீதியைப் பெற்றுத்தருதல் அல்லது அவளது நியாயத்தை நிலைநாட்டுதல் என்பதைக் குறிக்கிறது.
- source_word: ἵνα μὴ
  choice: இல்லையென்றால் ... செய்துவிடுவாள்
  rationale: நீதிபதி அஞ்சும் விளைவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தின் நோக்கம்/தவிர்ப்பு நுட்பம் பாதுகாக்கப்படுகிறது.
- source_word: εἰς τέλος ἐρχομένη
  choice: மீண்டும் மீண்டும் வந்து
  rationale: சூழலில் அவளது வருகை தொடர்ந்துகொண்டிருப்பதை இது உணர்த்துகிறது. ‘முடிவில்லாமல்’ என்பதும் சாத்தியம்; ஆனால் அது கால அளவை தேவைக்கு அதிகமாகத் தீர்மானிக்கக்கூடும்.
- source_word: ὑπωπιάζῃ με
  choice: என்னைச் சோர்வடையச் செய்துவிடுவாள்
  rationale: சொல்லின் நேரடியான படிமம் கண்ணுக்குக் கீழே அடிப்பதாக இருந்தாலும், இங்கு தொடர்ச்சியான தொந்தரவால் ஒருவரைத் தளரச் செய்தல் என்ற உருவகப் பொருள் சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: ἐκδικήσω என்பதன் சட்ட மற்றும் இறையியல் நுட்பம்
  choice: அவளுக்கு நீதி வழங்குவேன்
  alternative: அவளுக்காகப் பழிவாங்குவேன் / அவளுடைய நியாயத்தை நிலைநாட்டுவேன்
  rationale: உவமையின் சூழல் நீதிபதியிடம் கேட்கப்படும் சட்ட நிவாரணத்தைப் பற்றியது. ஆகவே பழிவாங்குதல் என்ற பதிலடி நுட்பத்தை இறக்குமதி செய்யாமல், சுற்றியுள்ள வசனங்களின் ‘நீதி’ கருப்பொருளைப் பாதுகாக்கிறது.
- issue: ὑπωπιάζῃ என்பதைக் கூறும் முறை
  choice: சோர்வடையச் செய்துவிடுவாள்
  alternative: கண்ணுக்குக் கீழே அடிப்பாள்
  rationale: நீதிபதியை உடல்ரீதியாகத் தாக்குவாள் என்று உரை அவசியமாகச் சொல்வதில்லை. உருவகப் பொருள் முதன்மை உரையில் தரப்பட்டு, வலுவான நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நீதிபதியின் எரிச்சலை ‘தொல்லை’, ‘மீண்டும் மீண்டும்’, ‘சோர்வடைய’ ஆகிய இயல்பான சொற்கள் வெளிப்படுத்துகின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
