source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: ta
  text: அவர்கள் கைக்குழந்தைகளைக்கூட[a] அவரிடம் கொண்டுவந்துகொண்டிருந்தார்கள்; அவர் அவர்களைத் தொடும்படி. ஆனால் சீடர்கள் இதைக் கண்டபோது[c], அவர்களைக்[b] கடிந்துகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிக இளம் குழந்தைகள்.’ ‘கைக்குழந்தைகள்’ என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் மிகச் சிறிய குழந்தைகளை, குறிப்பாகப் பாலகர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, கைக்குழந்தைகளை இயேசுவிடம் கொண்டுவந்தவர்களை.
    reason: lexical_alternative
  - marker: c
    text: இணை நிகழ்வுகளில், இயேசு குழந்தைகளைத் தொடுவது அவர்களை ஆசீர்வதிப்பதோடும் அவர்கள்மேல் கைகளை வைப்பதோடும் தொடர்புடையது (மத் 19:13; மாற் 10:13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: கொண்டுவந்துகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்வினை வடிவம், பலர் தொடர்ந்து அல்லது மீண்டும் மீண்டும் குழந்தைகளைக் கொண்டுவந்த செயலைக் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முதல் δὲ தமிழில் தனியாகக் காட்டப்படாமல் இயல்பான கதைத் தொடராக விடப்பட்டுள்ளது; இரண்டாவது δὲ சீடர்களின் எதிர்வினையால் ஏற்படும் தெளிவான மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καὶ τὰ βρέφη
  choice: கைக்குழந்தைகளைக்கூட
  rationale: βρέφη மிக இளம் குழந்தைகளைக் குறிக்கிறது; καὶ இங்கு வலியுறுத்தும் பொருளில் இருப்பதால் ‘கூட’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: அவர் அவர்களைத் தொடும்படி
  rationale: ἵνα நோக்கத்தைக் குறிக்கிறது; ἅπτομαι என்பதன் நேரடிப் பொருளான ‘தொடு’ பாதுகாக்கப்பட்டு, ‘ஆசீர்வதிக்க’ என்பது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: ἰδόντες
  choice: இதைக் கண்டபோது
  rationale: இறந்தகால வினையெச்சம் தமிழில் இயல்பான காலத் துணைவாக்கியமாக வழங்கப்பட்டுள்ளது; ‘இது’ அவர்கள் கண்ட நிகழ்வைக் குறிக்கிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: கிரேக்கச் சொல்லை நேராகவும் இயல்பாகவும் வழங்குகிறது; மூலத்தில் இல்லாத ‘அவருடைய’ என்ற உடைமைச் சொல் சேர்க்கப்படவில்லை.
- source_word: ἐπετίμων
  choice: கடிந்துகொண்டார்கள்
  rationale: வினையின் கடுமையான கண்டிப்பு சார்ந்த பொருளையும் அதன் தொடர்வினை வடிவத்தையும் வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: மூலத்தின் பிரதிப்பெயர் பாதுகாக்கப்பட்டுள்ளது; சூழலில் அது கைக்குழந்தைகளைக் கொண்டுவந்தவர்களைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: குழந்தைகளிடம் இயேசு செய்யவிருந்த செயலின் தன்மை
  choice: அவர்களைத் தொடும்படி
  alternative: அவர்களை ஆசீர்வதிக்கும்படி / அவர்கள்மேல் கைகளை வைக்கும்படி
  rationale: லூக்கா இங்கு ἅπτηται, ‘தொட’, என்றே கூறுகிறார். இணை நிகழ்வுகளில் ஆசீர்வாதமும் கைகளை வைப்பதும் இடம்பெற்றாலும், அந்த விரிவான கருத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருவது மூலத்தின் கட்டுப்பாட்டையும் பொருள் நுட்பத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கைக்குழந்தை’ என்பது துல்லியத்தையும் இயல்பான பயன்பாட்டையும் இணைக்கிறது. தொடர்ச்சியான செயலைக் காட்டும் வடிவங்கள் கிரேக்க இறந்தகாலத் தொடர்வினைகளின் வலிமையை இயன்றவரை பாதுகாக்கின்றன.
