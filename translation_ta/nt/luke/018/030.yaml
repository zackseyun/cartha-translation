  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: ta
  text: அவர் இந்தக் காலத்தில் பல மடங்கு அதிகமாகவும், வரவிருக்கும் யுகத்தில் நித்திய வாழ்வையும் நிச்சயமாகப் பெறுவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: நிச்சயமாகப் பெறுவார்
  rationale: οὐχὶ μὴ என்பதன் வலியுறுத்தப்பட்ட உறுதியை, தமிழில் இயல்பற்ற இரட்டை எதிர்மறையைப் பயன்படுத்தாமல் ‘நிச்சயமாக’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπολάβῃ
  choice: பெறுவார்
  rationale: இச்சூழலில் கைம்மாறாகப் பெறுதல் என்ற கருத்து உள்ளது; முன்னொட்டின் ‘திரும்பப் பெறுதல்’ நுணுக்கத்தை அளவுக்கு மீறி வலியுறுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: πολλαπλασίονα
  choice: பன்மடங்கு அதிகமாக
  rationale: அளவு பல மடங்காகப் பெருகியிருப்பதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: இந்தக் காலத்தில்
  rationale: καιρός இங்கு குறிப்பிட்ட தற்போதைய காலத்தைக் குறிக்கிறது; அடுத்து வரும் யுகத்துடன் உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: வரவிருக்கும் யுகத்தில்
  rationale: புதிய ஏற்பாட்டின் தற்போதைய யுகம்–வரவிருக்கும் யுகம் என்ற இறுதிக்கால எதிர்நோக்கை, வெறும் ‘எதிர்காலம்’ என்று தட்டையாக்காமல் காக்கிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: நற்செய்தி நூல்களில் உள்ள நிலையான இறுதிக்காலப் பொருளை நவீன, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்ட நபரைத் தொடர்ந்து சுட்டுகிறது; தனித்த வசனமாக வாசிக்கும்போதும் இயல்பான தமிழ்ச் சொற்றொடரை அளிக்கிறது.
theological_decisions:
- issue: αἰῶνι τῷ ἐρχομένῳ என்ற இறுதிக்காலச் சொற்றொடர்
  choice: வரவிருக்கும் யுகத்தில்
  alternative: வரப்போகும் காலத்தில்
  rationale: ‘யுகம்’ என்பது தற்போதைய ஒழுங்குக்கும் வரவிருக்கும் இறுதிக்கால ஒழுங்குக்கும் இடையிலான வேறுபாட்டைக் காக்கிறது; அதை பொதுவான எதிர்காலக் காலக்குறிப்பாக மட்டும் மாற்றவில்லை.
- issue: οὐχὶ μὴ என்பதன் வலியுறுத்தப்பட்ட உறுதி
  choice: நிச்சயமாகப் பெறுவார்
  alternative: பெறாமல் போகவே மாட்டார்
  rationale: மாற்று வடிவம் கிரேக்க இரட்டை எதிர்மறையின் அமைப்பை நெருக்கமாகப் பிரதிபலித்தாலும், முதன்மை வடிவம் அதே உறுதியை இயல்பான தமிழில் வழங்குகிறது; வாக்குறுதியின் நிச்சயத்தைத் தளர்த்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘ஜீவன்’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘வாழ்வு’ பயன்படுத்தப்பட்டுள்ளது; ‘யுகம்’ இறுதிக்கால எதிர்நோக்கின் தனித்துவத்தைப் பாதுகாக்கிறது.
