reference: Luke 18:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: ta
  text: இரவும் பகலும் தம்மை நோக்கிக் கூக்குரலிடுகிற தாம் தேர்ந்தெடுத்த தம் மக்களுக்கு தேவன் நியாயம் வழங்காமல் இருப்பாரா? அவர்களுக்காக அவர் நீண்ட காலம் தாமதிப்பாரா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களிடம் நீடிய பொறுமையுடன் இருப்பாரா?” அல்லது, “அவர் அவர்களிடம் நீடிய பொறுமையுடன் இருந்தாலும்.” கிரேக்கச் சொற்றொடரைத் தாமதம் என்பதற்குப் பதிலாகப் பொறுமை அல்லது நீடிய சகிப்பு என்ற பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: நியாயம் வழங்க
  rationale: அநீதியான நீதிபதி குறித்த உவமையின் நீதித்துறைச் சூழலில், தனிப்பட்ட பழிவாங்குதலைவிட உரிய நீதி அல்லது சட்டப்பூர்வ நிவாரணம் வழங்குவதையே இச்சொல் குறிக்கிறது.
- source_word: ἐκλεκτῶν
  choice: தாம் தேர்ந்தெடுத்தவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இப்பெயரடை, தேவனால் தேர்ந்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. ‘தாம்’ என்பது தேர்ந்தெடுப்பவர் தேவன் என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது; குறிப்பிட்ட இறையியல் மரபின் சொல்லாட்சியைத் திணிப்பதில்லை.
- source_word: βοώντων
  choice: கூக்குரலிடுகிற
  rationale: தீவிரமும் தொடர்ந்து எழுப்பப்படும் வேண்டுதலும் இதில் அடங்குகின்றன; உவமையின் விடாப்பிடியான முறையீட்டுக்கு இது பொருந்துகிறது.
- source_word: ἡμέρας καὶ νυκτός
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான வேண்டுதலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் மரபுத்தொடர்.
- source_word: οὐ μὴ ποιήσῃ
  choice: வழங்காமல் இருப்பாரா?
  rationale: οὐ μή சேர்ந்த வினை வடிவம், ‘நிச்சயமாக வழங்குவார்’ என்ற உறுதியான உடன்பாட்டு விடையை எதிர்பார்க்கும் மறுப்புவடிவ வினாவாக உள்ளது. தமிழ் வினா வடிவம் அந்தச் சொல்லாட்சிச் சக்தியை இயல்பாகக் காக்கிறது.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: அவர்களுக்காகச் செயல்பட அவர் நெடுங்காலம் தாமதிப்பாரா?
  rationale: அடுத்த வசனத்தின் விரைவான நீதி வழங்குதல் என்ற உறுதியோடு இசையும் வகையில், இங்கு தேவன் அவர்களுக்காக நடவடிக்கை எடுப்பதைத் தாமதிப்பாரா என்ற பொருள் முதன்மை உரையில் தரப்படுகிறது. எனினும் ‘பொறுமையாயிருத்தல்’ என்ற இயல்பான சொற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: μακροθυμεῖ ἐπ’ αὐτοῖς என்பது தேவனுடைய தாமதத்தையா அல்லது பொறுமையையா குறிக்கிறது?
  choice: அவர்களுக்காகச் செயல்பட அவர் நெடுங்காலம் தாமதிப்பாரா?
  alternative: ‘அவர் அவர்களிடம் நீடிய பொறுமையுடன் இருப்பாரா?’ அல்லது ‘அவர் அவர்களிடம் நீடிய பொறுமையுடன் இருந்தாலும்’
  rationale: உடனடியான சூழலும் அடுத்த வசனமும் தேவன் தமது மக்களுக்கு விரைவில் நியாயம் வழங்குவதை வலியுறுத்துவதால், தாமதம் குறித்த வினா முதன்மை உரைக்குத் தேர்ந்தெடுக்கப்பட்டது. கிரேக்க வாக்கியத்தின் பொறுமை/நீடிய சகிப்பு சார்ந்த உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனைச் சுட்டும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; நீதித்துறைச் சூழல் ‘நியாயம் வழங்க’ என்பதால் காக்கப்பட்டுள்ளது.
