revisions:
- from: இயேசு அவனிடம், “பார்வை பெறு[a]; உன் விசுவாசம் உன்னை மீட்டிருக்கிறது[b]” என்றார்.
  to: இயேசு அவனிடம், “பார்வை பெறு[a]; உன் விசுவாசம் உன்னை இரட்சித்திருக்கிறது[b]” என்றார்.
  rationale: The revision replaces an ambiguous rescue-oriented Tamil verb with the standard salvation term required by the selected rendering of σέσωκέν, without foreclosing its healing sense, which remains explicitly available in footnote b. Footnote a is recast in natural modern Tamil and remains anchored to the command “பார்வை பெறு.”
