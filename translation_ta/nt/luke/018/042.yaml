  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: ta
  text: இயேசு அவனிடம், “பார்வை பெறு[a]; உன் விசுவாசம் உன்னை இரட்சித்திருக்கிறது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் பார்வை பெறு.” குணமாக்கும் சூழலில் கிரேக்கக் கட்டளை பார்வையை மீண்டும் பெறுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னை நலமாக்கியிருக்கிறது” அல்லது “உன்னைக் குணமாக்கியிருக்கிறது.” இங்குள்ள கிரேக்க வினைச்சொல் குணமடைதலையும் இரட்சிப்பையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: இயேசு
  rationale: தமிழ் கதைநடையில் வாக்கியத் தொடக்கத்தில் வரும் καί-ஐ தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று மொழிபெயர்ப்பது தேவையற்ற இணைப்புச் சுமையை ஏற்படுத்தும்; இயல்பான தொடர்ச்சியில் அது வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: εἶπεν αὐτῷ
  choice: அவனிடம் … என்றார்
  rationale: மறைமுகப் பொருளையும் நேரடி உரை அறிமுகத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது; இயேசுவைக் குறிக்கும் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἀνάβλεψον
  choice: பார்வை பெறு
  rationale: குணமாக்கும் இச்சூழலில் ‘மேலே பார்’ என்பதல்ல, பார்வை கிடைப்பதையே குறிக்கிறது. ஒருகாலத்தில் பார்வை இருந்தது என்று பிரதான உரையில் கட்டாயப்படுத்தாமல், கிரேக்கச் சொல்லின் ‘மீண்டும் பார்வை பெறுதல்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு இயேசுவின் மீது அந்த மனிதன் வைத்த நம்பிக்கையைக் குறிக்கிறது. ‘விசுவாசம்’ என்பது நவீனத் தமிழ் வேதாகம நடையில் தெளிவாகவும் பரவலாகவும் புரியும் சொல்.
- source_word: σέσωκέν
  choice: மீட்டிருக்கிறது
  rationale: σῴζω என்பதன் நிறைவேற்றப்பட்ட செயலும் தொடரும் விளைவும் தமிழில் வெளிப்படுகின்றன. ‘மீட்டிருக்கிறது’ என்பது உடல் நலம்பெறுதலை மட்டும் குறிப்பதாகச் சுருக்காமல், மீட்பு/இரட்சிப்பு என்ற விரிந்த பொருளுக்கும் இடமளிக்கிறது.
theological_decisions:
- issue: குணமாக்கும் நிகழ்வில் σῴζω என்பதன் பொருள் எல்லை
  choice: மீட்டிருக்கிறது
  alternative: உன்னை நலமாக்கியிருக்கிறது / உன்னைக் குணமாக்கியிருக்கிறது / உன்னை இரட்சித்திருக்கிறது
  rationale: இச்சூழலில் உடல் குணமடைதல் தெளிவாக இருந்தாலும், லூக்காவின் பயன்பாட்டில் குணமாக்குதலும் விரிந்த மீட்பும் ஒன்றோடொன்று ஒலிக்கலாம். பிரதான உரை அந்த இறையியல் அழுத்தத்தை உடல் குணமாக்குதலாக மட்டும் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வை பெறு’ நேரடியான கட்டளையாகவும், ‘மீட்டிருக்கிறது’ கிரேக்க நிறைவேற்றுநிலையின் தொடரும் விளைவையும் இரட்சிப்பு–குணமாக்குதல் என்ற பொருள் விரிவையும் காக்கும் வகையிலும் அமைந்துள்ளன.
