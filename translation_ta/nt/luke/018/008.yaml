id: LUK.18.8
reference: Luke 18:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: ta
  text: அவர் அவர்களுக்கு விரைவாக நீதி வழங்குவார்[a] என்று உங்களுக்குச் சொல்கிறேன். ஆயினும், மனிதகுமாரன் வரும்போது, பூமியில் விசுவாசத்தை[b] உண்மையிலேயே காண்பாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘அவர்களுக்காக நீதியை நிலைநாட்டுவார்’ அல்லது ‘அவர்களுக்கு நியாயம் கிடைக்கச் செய்வார்.’ கிரேக்கச் சொற்றொடர் அவர்களுக்காக நீதி செய்யப்படுவதையோ, அவர்களின் உரிமை நிலைநாட்டப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நம்பிக்கையை’ அல்லது ‘உண்மைப்பற்றை.’ கிரேக்கச் சொல் விசுவாசம், நம்பிக்கை, அல்லது உண்மைப்பற்று ஆகியவற்றைக் குறிக்கலாம்; முதன்மை உரை அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: அவர் அவர்களுக்கு நீதி வழங்குவார்
  rationale: விடாமுயற்சியுடன் நீதியை நாடிய விதவையின் சட்டச் சூழலில், ἐκδίκησις என்பது பழிவாங்குதலை மட்டும் அல்லாமல் ஒருவருக்குச் சார்பாக நீதி வழங்கப்படுதல் அல்லது அவரது உரிமை நிலைநாட்டப்படுதல் என்ற பொருளையும் தருகிறது. ‘அவர்களுக்கு நீதி வழங்குவார்’ என்பது பழிவாங்கும் தொனியைத் தேவையின்றி வலுப்படுத்தாமல் நீதித்துறை சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τάχει
  choice: விரைவாக
  rationale: இச்சொற்றொடர் செயல் வேகமாக அல்லது தாமதமின்றி நடைபெறுவதைக் குறிக்கலாம். ‘விரைவாக’ என்பது ஒரு குறிப்பிட்ட கால அட்டவணையைக் கூறாமல் அதன் வேகத்தன்மையைப் பாதுகாக்கிறது.
- source_word: πλὴν
  choice: ஆயினும்
  rationale: கடவுள் நீதி வழங்குவார் என்ற உறுதிக்கும் அதைத் தொடர்ந்து வரும் ஆராயும் கேள்விக்கும் இடையிலான வலுவான எதிர்மறை மாற்றத்தை இது வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் தனிப்பட்ட பட்டப்பெயரையும் தானியேல் 7 உடனான அதன் தொடர்பையும் பாதுகாக்கும் நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: ἐλθὼν
  choice: வரும்போது
  rationale: இறந்தகால வினையெச்சம் இங்கு முதன்மை வினையோடு காலத் தொடர்பைக் கொண்டுள்ளது; தமிழில் ‘வரும்போது’ என்பது அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἆρα
  choice: உண்மையிலேயே
  rationale: ἆρα கேள்விக்கு ஆராயும், எதிர்பார்ப்பைச் சோதிக்கும் தொனியைத் தருகிறது. ‘உண்மையிலேயே’ அந்த வலியுறுத்தலைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τὴν πίστιν
  choice: விசுவாசத்தை
  rationale: πίστις என்பதன் விசுவாசம், நம்புதல், உண்மைப்பற்று ஆகிய பொருள் பரப்பை ஒரே விளக்கத்தில் குறுக்காமல், இங்கு விரிவான மற்றும் நிலைபெற்ற ‘விசுவாசம்’ என்ற சொல்லால் மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: இறுதிக்காலப் பின்னணியில் γῆ என்பதன் பரந்த உலகளாவிய பொருளை ‘பூமியில்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இச்சூழலில் πίστις என்பது ‘விசுவாசம்’, ‘நம்புதல்’, அல்லது ‘உண்மைப்பற்று’ என்று புரிந்துகொள்ளப்படலாம்.
  choice: விசுவாசம்
  alternative: நம்புதல்; உண்மைப்பற்று
  rationale: மன்றாட்டில் வெளிப்படும் விடாப்பிடியான நம்புதலைச் சூழல் சுட்டினாலும், கிரேக்கச் சொல்லின் பொருள் பரப்பை ஒரே விளக்கத்துக்குள் குறுக்காமல் ‘விசுவாசம்’ முதன்மை உரையில் வைக்கப்படுகிறது; குறிப்பிடத்தக்க மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனிதகுமாரன்’ மற்றும் ‘விசுவாசம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் அவற்றின் இறையியல் மற்றும் இடைநூல் ஒலிப்புகளைப் பாதுகாக்கப் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு [b] அது விளக்கும் πίστις என்பதற்குச் சரியாக இணைக்கப்பட்டுள்ளது.
