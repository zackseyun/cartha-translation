reference: Luke 18:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: ta
  text: 'பரிசேயர் தனியாக நின்று இவ்வாறு வேண்டிக்கொண்டிருந்தார்: “கடவுளே, பிறருடையதைப் பறிப்பவர்கள், அநீதிக்காரர்கள், திருமணத் துரோகம் செய்பவர்கள் ஆகிய மற்ற எல்லா மனிதர்களைப் போலவோ, இந்த வரிவசூலிப்பவனைப் போலக்கூடவோ நான் இல்லாததற்காக உமக்கு நன்றி செலுத்துகிறேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταθεὶς
  choice: நின்று
  rationale: இறந்தகாலப் பங்கேற்பு வடிவம் காட்சியில் பரிசேயரின் உடல் நிலையை அறிமுகப்படுத்துகிறது; தமிழில் ‘நின்று’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: πρὸς ἑαυτὸν
  choice: தனியாக
  rationale: இச்சொற்றொடர் அவர் மற்றவர்களிடமிருந்து விலகித் தனியே நின்றதையோ, தனக்குள்ளே அல்லது தன்னிடமே வேண்டிக்கொண்டதையோ குறிக்கலாம். முதன்மை உரையில் இடம்சார்ந்த பொருள் தரப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ταῦτα
  choice: இவற்றைச் சொல்லி
  rationale: பின்வரும் வேண்டுதலின் உள்ளடக்கத்தைச் சுட்டும் பன்மைச் சுட்டுப்பெயரைத் தெளிவான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσηύχετο
  choice: வேண்டிக்கொண்டிருந்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நடந்துகொண்டிருந்த செயலைக் காட்டுவதால், தமிழ் தொடர்நிலை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: εὐχαριστῶ σοι
  choice: உமக்கு நன்றி செலுத்துகிறேன்
  rationale: கடவுளை நேரடியாக நோக்கிப் பேசும் மரியாதையையும், நன்றி தெரிவிக்கும் வினையின் இயல்பான பொருளையும் காக்கிறது.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: மற்ற மனிதர்களைப் போல
  rationale: λοιποί என்பதன் ‘மற்றவர்கள்’ என்ற வேறுபாட்டையும், ἄνθρωποι என்பதன் பொதுவான மனிதக் குறிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἅρπαγες
  choice: பிறருடையதைப் பறிப்பவர்கள்
  rationale: வலுக்கட்டாயமாகவோ பேராசையோடு சுரண்டியோ பிறருடையதை அபகரிப்பவர்களைச் சுட்டும் சொல்லின் பரந்த பொருளை இது காக்கிறது.
- source_word: ἄδικοι
  choice: அநீதியுள்ளவர்கள்
  rationale: சட்டநீதியை மட்டுமல்லாமல் ஒழுக்கநெறி சார்ந்த தவறையும் உள்ளடக்கும் கிரேக்கச் சொல்லின் பொருளைத் தருகிறது.
- source_word: μοιχοί
  choice: விபசாரிகள்
  rationale: திருமண உறுதிப்பாட்டை மீறுபவர்களைக் குறிக்கும் பன்மைப் பெயர்ச்சொல்லின் நேரான தமிழ் இணை.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: இந்த வரிவசூலிப்பவனைப் போலக்கூடவோ
  rationale: ἢ καὶ தரும் உச்சக்கட்ட இகழ்ச்சியை ‘போலக்கூட’ என்பதும், τελώνης என்பதைக் ‘வரிவசூலிப்பவன்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: πρὸς ἑαυτόν என்ற சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் அவர் ‘தனியாக’ நின்றார் என்ற இடம்சார்ந்த பொருள்
  alternative: ‘நின்று, தனக்குள்ளே இவற்றை வேண்டிக்கொண்டிருந்தார்’ அல்லது தன்னிடமே வேண்டினார் என்ற பொருள்
  rationale: கிரேக்கச் சொற்றொடர் இரு பொருள்களுக்கும் இடமளிக்கிறது. பரிசேயரின் வேண்டுதல் உண்மையில் தன்னையே நோக்கியது என்ற இறையியல் நையாண்டியை முதன்மை உரையில் கட்டாயப்படுத்தாமல், அந்தச் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’ என்பதற்குப் பதிலாக பரந்த தமிழ் வழக்கிலுள்ள ‘வேண்டுதல்’ பயன்படுத்தப்பட்டாலும், உரையின் சமயச் சூழலும் கடவுளை நேரடியாக அழைக்கும் தன்மையும் தெளிவாகக் காக்கப்பட்டுள்ளன.
