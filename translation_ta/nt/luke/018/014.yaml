source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: ta
  text: '“நான் உங்களுக்குச் சொல்கிறேன்: மற்றவனைவிட[a] இந்த மனிதனே நீதிமானாகத் தீர்க்கப்பட்டவனாய் தன் வீட்டுக்கு இறங்கிச் சென்றான். ஏனெனில், தன்னை உயர்த்துகிற ஒவ்வொருவனும் தாழ்த்தப்படுவான்; தன்னைத் தாழ்த்துகிறவனோ உயர்த்தப்படுவான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மனிதனுடன் ஒப்பிடுகையில் நீதிமானாகத் தீர்க்கப்பட்டவனாய்”; இச்சொற்றொடர் இந்த மனிதனையும் மற்ற வழிபாட்டாளரையும் வேறுபடுத்தி ஒப்பிடுகிறது.
    reason: παρ’ ἐκεῖνον என்ற சொற்றொடரின் ஒப்பீட்டு நுணுக்கத்தையும் மாற்று மொழிபெயர்ப்பையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: நீதிமானாகத் தீர்க்கப்பட்டவனாய்
  rationale: இறைவன் அளிக்கும் சாதகமான தீர்ப்பையும், நிறைவேறிய தீர்ப்பின் தொடரும் நிலையையும் உணர்த்தும் perfect passive participle-இன் சட்டத்தீர்ப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: παρ’ ἐκεῖνον
  choice: மற்றவனைவிட
  rationale: வரி வசூலிப்பவனையும் பரிசேயனையும் ஒப்பிட்டு வேறுபடுத்தும் παρά + accusative அமைப்பை இயல்பான தமிழில் தருகிறது; ஒப்பீட்டு நுணுக்கம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: κατέβη
  choice: இறங்கிச் சென்றான்
  rationale: καταβαίνω என்பதன் நேரடியான கீழ்நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது; ஆலயப் பகுதியிலிருந்து வீட்டுக்குச் செல்வதையும் சூழலுக்கு ஏற்றபடி உணர்த்துகிறது.
- source_word: οἶκον αὐτοῦ
  choice: தன் வீட்டுக்கு
  rationale: எழுவாயையே மீண்டும் சுட்டும் αὐτοῦ என்பதற்கு தமிழில் இயல்பான தற்சுட்டுப் பெயரடையான ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: தன்னை உயர்த்துகிற ஒவ்வொருவனும்
  rationale: பொதுவான விதியை வெளிப்படுத்தும் articular participle-ஐ ஒருமையிலும் தற்சுட்டுத் தன்மையுடனும் காக்கிறது.
- source_word: ταπεινωθήσεται
  choice: தாழ்த்தப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, செய்பவர் யார் என்பதை கிரேக்கத்தைப் போலவே வெளிப்படையாகக் குறிப்பிடாமல் விடுகிறது.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: தன்னைத் தாழ்த்துகிறவனோ
  rationale: δέ குறிக்கும் முரண்பாட்டை ‘-ஓ’ மூலம் தெளிவாகக் காட்டி, முந்தைய கூற்றுடன் இணையான அமைப்பைப் பேணுகிறது.
- source_word: ὑψωθήσεται
  choice: உயர்த்தப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், ‘தாழ்த்தப்படுவான்’ என்பதுடனான கருத்தியல் எதிரிணையையும் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய இறைத்தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் causal force-ஐ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὗτος
  choice: இந்த மனிதனே
  rationale: வரி வசூலிப்பவனைச் சுட்டி, பரிசேயனுடனான வேறுபாட்டை ‘-ஏ’ வலியுறுத்தலால் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: δικαιόω என்பதன் பொருள்
  choice: இறைவனுடைய சாதகமான தீர்ப்பைக் குறிக்கும் ‘நீதிமானாகத் தீர்க்கப்பட்டவனாய்’
  alternative: பொதுவான பொருளில் ‘நியாயம் பெற்றவனாய்’ அல்லது ‘குற்றமற்றவன் என்று நிரூபிக்கப்பட்டவனாய்’
  rationale: சூழல், தன்னையே நீதிமானென்று கருதும் பரிசேயனையும் இரக்கம் வேண்டிய வரி வசூலிப்பவனையும் கடவுள்முன் வேறுபடுத்துகிறது. இத்தேர்வு வசனத்தின் இறைத்தீர்ப்பு சார்ந்த வலிமையைப் பாதுகாக்கிறது; அதேவேளை பிற்கால முறைப்படுத்தப்பட்ட இறையியல் முழுவதையும் வசனத்துக்குள் சேர்ப்பதில்லை.
- issue: பொதுப்படையான ஆண்பால் ஒருமை
  choice: ‘ஒவ்வொருவனும் ... தன்னை’ என்ற ஒருமை அமைப்பைத் தக்கவைத்தல்
  alternative: பன்மை அல்லது பாலினக் குறியீடற்ற மறுவடிவாக்கம்
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமை participle பொதுவான மனித விதியைச் சொல்கிறது. தமிழிலும் இணையான ஒருமை அமைப்பை வைத்ததால் இரு கூற்றுகளின் சமச்சீர் வடிவம் காக்கப்படுகிறது.
- issue: மறைமுகச் செய்பவர் கொண்ட இறையியல் செயப்பாடு
  choice: ‘தாழ்த்தப்படுவான் / உயர்த்தப்படுவான்’ என்று செய்பவரைப் பெயரிடாமல் விடுதல்
  alternative: ‘கடவுள் தாழ்த்துவார் / உயர்த்துவார்’ என்று வெளிப்படையாக்குதல்
  rationale: சூழலில் கடவுள் செய்பவராகப் புரிந்துகொள்ளப்படலாம்; எனினும் கிரேக்கம் அவரை வெளிப்படையாகப் பெயரிடவில்லை. அந்த மறைமுகத்தன்மை மொழிபெயர்ப்பிலும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கிச் சென்றான்’ மூலத்தின் இடப்பெயர்ச்சிப் படிமத்தைப் பாதுகாக்கிறது; இறுதி இரு கூற்றுகளிலும் இணையான ஒலி மற்றும் இலக்கண அமைப்பு பேணப்பட்டுள்ளது.
