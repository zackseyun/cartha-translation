  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: ta
  text: இயேசு அவனைப் பார்த்து, “செல்வம் உடையவர்கள் இறைவனுடைய அரசாட்சிக்குள் நுழைவது எவ்வளவு கடினம்!” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς εἶπεν
  choice: இயேசு அவனைப் பார்த்து ... என்றார்
  rationale: இறந்தகாலப் பங்கேற்புவினையான Ἰδὼν-ஐ இயல்பான தமிழில் ‘பார்த்து’ என்று இணைத்து, δέ-யின் மென்மையான கதைத் தொடர்ச்சியை தனிச் சொல்லால் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: Πῶς δυσκόλως
  choice: எவ்வளவு கடினம்
  rationale: இது வியப்பையும் கடினத்தின் அளவையும் காட்டும் சொற்றொடர். ‘எவ்வளவு கடினம்’ என்பது அதன் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: செல்வம் உடையவர்கள்
  rationale: χρήματα என்பது பணத்தை மட்டும் அல்லாமல் உடைமைகள் அல்லது செல்வத்தையும் குறிக்கலாம். ‘செல்வம் உடையவர்கள்’ என்பது பங்கேற்புச் சொற்றொடரையும் பரந்த பொருளையும் காக்கிறது.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: இறைவனுடைய அரசாட்சிக்குள்
  rationale: βασιλεία என்பதன் ஆட்சி சார்ந்த பொருளை ‘அரசாட்சி’ தெளிவாகக் காட்டுகிறது; εἰς என்பதற்குரிய நுழைவு நோக்கை ‘-க்குள்’ வெளிப்படுத்துகிறது.
- source_word: εἰσπορεύονται
  choice: நுழைவது
  rationale: கிரேக்கத்தில் நிகழ்கால வினையாக இருந்தாலும், Πῶς δυσκόλως உடன் தமிழில் தொழிற்பெயர் அமைப்பு இயல்பாகவும் பொருள் மாறாமலும் உள்ளது.
theological_decisions:
- issue: செல்வம் உடையவர்கள் இறைவனுடைய அரசாட்சிக்குள் நுழைவதன் கடினத்தன்மை
  choice: நுழைவது மிகவும் கடினம் என்ற பொதுக் கூற்று
  alternative: செல்வம் உடையவர்கள் நுழைவது முற்றிலும் இயலாதது
  rationale: இவ்வசனத்தில் δυσκόλως ‘கடினமாக’ என்கிறது; ‘இயலாது’ என்று சொல்லவில்லை. ஆகவே வசனத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமலும் மிகைப்படுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், இயல்பான, கண்ணியமான நடை. ‘இறைவனுடைய அரசாட்சி’ என்பது மரபுப் பொருளை மதித்தபடி βασιλεία-வின் ஆட்சி சார்ந்த நுணுக்கத்தைக் காட்டுகிறது.
