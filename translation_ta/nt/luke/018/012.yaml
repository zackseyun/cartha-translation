  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: ta
  text: வாரத்தில் இருமுறை நோன்பிருக்கிறேன்[a]; நான் பெறும் எல்லாவற்றிலும் பத்தில் ஒரு பங்கைக் கொடுக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “ஓய்வுநாளின் இருமுறை”; இது “வாரத்தில் இருமுறை” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: நோன்பிருக்கிறேன்
  rationale: நிகழ்கால வினை இங்கு வழக்கமாகத் தொடர்ந்து செய்யும் செயலைக் குறிக்கிறது; பேசுபவர் தமது வழக்கமான நோன்புப் பழக்கத்தைச் சொல்கிறார்.
- source_word: δὶς
  choice: இருமுறை
  rationale: இது ‘இரண்டு முறை’ என்று நேரடியாகப் பொருள்படும் வினையடை.
- source_word: τοῦ σαββάτου
  choice: வாரத்தில்
  rationale: சொல்லுக்குச் சொல் ‘ஓய்வுநாளின்’ என்று இருந்தாலும், கொய்னே கிரேக்கத்தில் இது வாரச் சுழற்சியைக் குறிக்கும் மரபுத்தொடர்; தமிழில் கால இடைவெளியை இயல்பாக ‘வாரத்தில்’ என்று கூறுவது பொருத்தம்.
- source_word: ἀποδεκατῶ
  choice: பத்தில் ஒரு பங்கைக் கொடுக்கிறேன்
  rationale: வினைச்சொல் குறிப்பாக பத்தில் ஒரு பங்கைக் கொடுப்பதைக் குறிக்கிறது. ‘தசமபாகம் செலுத்துகிறேன்’ என்பதைக் காட்டிலும் இந்த வடிவம் பொதுவாசகர்களுக்கு உடனடியாகப் புரியும்.
- source_word: πάντα
  choice: எல்லாவற்றிலும்
  rationale: நடுநிலைப் பன்மை இங்கு முழுமையான பரப்பைக் குறிக்கிறது; பத்தில் ஒரு பங்கு எதிலிருந்து கொடுக்கப்படுகிறது என்பதைக் காட்ட தமிழில் ‘எல்லாவற்றிலும்’ இயல்பாக உள்ளது.
- source_word: ὅσα
  choice: எல்லாவற்றிலும் என்பதில் உட்பொதிந்துள்ளது
  rationale: ‘எவையெல்லாமோ அவை’ என்ற தொடர்புப் பொருள் தமிழின் ‘நான் பெறும் எல்லாவற்றிலும்’ என்ற தொடரில் இயல்பாக வெளிப்படுகிறது.
- source_word: κτῶμαι
  choice: நான் பெறும்
  rationale: நடுநிலை வடிவிலுள்ள இவ்வினை தனக்கெனப் பெறுதல் அல்லது சம்பாதித்துக் கொள்ளுதல் என்ற பொருளைக் கொண்டது. ‘பெறும்’ என்பது சம்பாதிப்பதோடு மட்டும் வரையறுக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உபவாசக் கூற்றில் τοῦ σαββάτου என்பதன் பொருள்
  choice: வாரத்தைக் குறிக்கும் கால மரபுத்தொடராக ‘வாரத்தில்’
  alternative: சொல்லுக்குச் சொல் ‘ஓய்வுநாளின்’ அல்லது ‘ஓய்வுநாளுக்கு’
  rationale: இது ஓய்வுநாள் கடைப்பிடிப்பைப் பற்றிய இறையியல் கூற்று அல்ல; நோன்பின் அடிக்கடியைச் சொல்கிறது. மிகச் சொற்படியான மொழிபெயர்ப்பு, அவர் ஓய்வுநாளில் இரண்டு முறை நோன்பிருந்ததாகத் தவறாகப் புரியச் செய்யலாம்.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை. ‘நோன்பிருக்கிறேன்’ என்பது வழக்கமான செயலை இயல்பாகக் காட்டுகிறது; ‘பத்தில் ஒரு பங்கு’ என்பது சமயத் தொழில்சொல்லை அறியாத வாசகருக்கும் தெளிவாக உள்ளது.
