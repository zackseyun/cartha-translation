source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: ta
  text: உடனே அவன் பார்வை பெற்றான்[a]. கடவுளை மகிமைப்படுத்திக்கொண்டே அவரைப் பின்தொடர்ந்தான்[b]. இதைக் கண்ட மக்கள் அனைவரும் கடவுளுக்குத் துதி செலுத்தினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் பார்க்கத் தொடங்கினான்” அல்லது “தன் பார்வையை மீண்டும் பெற்றான்.” கிரேக்க வினைச்சொல் பார்வையை மீட்டுப் பெறுவதைக் குறிக்கலாம்; ஆனால் அவனுக்கு முன்பு பார்வை இருந்தது என்று வெளிப்படையாகக் கூறாமல் இருக்க இங்கே “பார்வை பெற்றான்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரைப் பின்தொடர்ந்துகொண்டிருந்தான்.” கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த செயலை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: உடனே
  rationale: தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνέβλεψεν
  choice: பார்வை பெற்றான்
  rationale: குணமாக்குதல் சூழலில் பார்வை கிடைத்ததை இயல்பாகச் சொல்கிறது; அவனுக்கு முன்பு பார்வை இருந்ததா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: ἠκολούθει
  choice: அவர் பின்னால் சென்றான்
  rationale: இயேசுவைப் பின்தொடர்ந்த செயலை இயல்பான தமிழில் தருகிறது. கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த செயற்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: δοξάζων
  choice: கடவுளை மகிமைப்படுத்திக்கொண்டே
  rationale: பின்தொடர்ந்துகொண்டிருந்தபோது நிகழ்ந்த உடனிகழ் செயலைக் காட்டுவதோடு, δοξάζω என்பதன் ‘மகிமைப்படுத்துதல்’ என்ற தனித்த சொற்பொருளையும் காக்கிறது.
- source_word: λαός
  choice: மக்கள் அனைவரும்
  rationale: πᾶς ὁ λαός என்ற கூட்டுப் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἰδών
  choice: இதைக் கண்ட
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருளை, முந்தைய குணமாக்குதலும் அதற்கான பதிலும் எனச் சூழலிலிருந்து ‘இது’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔδωκεν αἶνον
  choice: துதி செலுத்தினர்
  rationale: ‘துதியைக் கொடுத்தனர்’ என்ற கிரேக்கப் பெயர்ச்சொல்-வினைச்சொல் அமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; முன் வரும் ‘மகிமைப்படுத்துதல்’ என்பதிலிருந்தும் சொல் வேறுபாட்டைக் காக்கிறது.
- source_word: θεός / θεῷ
  choice: கடவுள் / கடவுளுக்கு
  rationale: θεός என்பதற்கான பொதுவான நவீனத் தமிழ் இணை; வசனத்தில் இருமுறை வரும் கடவுள் நோக்கிய செயலை அப்படியே காக்கிறது.
theological_decisions:
- issue: பார்வை கிடைத்த பிறகு அவன் இயேசுவைப் பின்தொடர்ந்த செயலின் காலப்பாங்கு
  choice: அவர் பின்னால் சென்றான்
  alternative: அவர் பின்னால் சென்றுகொண்டிருந்தான்
  rationale: ἠκολούθει தொடரும் செயலைக் குறிக்கக்கூடும். எனினும் கதைநடையில் இயல்பான தமிழுக்காக எளிய இறந்தகாலம் பயன்படுத்தப்பட்டு, தொடர்நிலைச் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது; இதனால் சீடத்துவம் குறித்த கூடுதல் கோட்பாட்டு விளக்கம் திணிக்கப்படவில்லை.
- issue: πᾶς ὁ λαός என்பதன் கூட்டொருமை இலக்கணம்
  choice: மக்கள் அனைவரும் ... துதி செலுத்தினர்
  alternative: மக்கள் கூட்டம் முழுவதும் ... துதி செலுத்தியது
  rationale: கிரேக்கத்தில் கூட்டொருமை வடிவம் இருந்தாலும், மனிதர்களைக் குறிக்கும் இச்சூழலில் தமிழ் இயல்பாகப் பன்மையைப் பயன்படுத்துகிறது; இது நடையியல் மாற்றமே அன்றி பொருள் அல்லது இறையியல் மாற்றமல்ல.
translation_notes:
  register: நவீன, பொதுப் பயன்பாட்டுக்குரிய, கண்ணியமான தமிழ். இயேசுவைக் குறிக்கும் αὐτῷ என்பதற்கு மரியாதை ஒருமையான “அவர்” பயன்படுத்தப்பட்டுள்ளது. “மகிமைப்படுத்துதல்” மற்றும் “துதி செலுத்துதல்” என இரு வேறு கிரேக்கச் சொற்களின் வேறுபாடு காக்கப்பட்டுள்ளது.
