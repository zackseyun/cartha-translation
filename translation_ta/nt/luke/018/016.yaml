    rationale: ‘பிள்ளைகள் என்னிடம் வர அனுமதியுங்கள்’ is understandable, but ‘பிள்ளைகள் என்னிடம் வரட்டும்’ is more natural modern Tamil for a command meaning ‘Let the children come,’ without changing the source sense.
