source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களைத் தம்மிடம் அழைத்து, “பிள்ளைகள் என்னிடம் வரட்டும்; அவர்களைத் தடுக்காதீர்கள். ஏனெனில், கடவுளுடைய ராஜ்யம் இப்படிப்பட்டவர்களுக்கு உரியது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “கடவுளுடைய ராஜ்யம் இப்படிப்பட்டவர்களுடையது.”
    reason: τῶν τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ என்ற கிரேக்கத் தொடரின் உடைமை அமைப்பை இன்னும் நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: அவர்களைத் தம்மிடம் அழைத்து
  rationale: நடுவினை வடிவம் ஒருவரைத் தன்னிடம் அழைப்பதைக் குறிக்கிறது. தமிழில் ‘தம்மிடம் அழைத்து’ என்பது இயேசுவிடம் அவர்களை வரவழைத்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: பிள்ளைகள் என்னிடம் வர அனுமதியுங்கள்
  rationale: ἀφίημι இங்கு அனுமதித்தல் என்ற பொருளில் வருகிறது. நேரடியான கட்டளையையும் இயல்பான தமிழ் தொடரையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: μὴ κωλύετε αὐτά
  choice: அவர்களைத் தடுக்காதீர்கள்
  rationale: κωλύω என்பதன் தடுத்தல் அல்லது வரவிடாமல் செய்தல் என்ற பரந்த பொருளை இது சுருக்கமாகக் காக்கிறது.
- source_word: τῶν ... τοιούτων
  choice: இப்படிப்பட்டவர்களுக்கு
  rationale: இச்சொற்றொடர் அங்கிருந்த குறிப்பிட்ட பிள்ளைகளை மட்டும் அல்லாமல், அவர்களால் பிரதிநிதித்துவப்படுத்தப்படும் வகையினரையும் சுட்டலாம். எந்தக் குறிப்பிட்ட பண்பை அது குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய ராஜ்யம்
  rationale: βασιλεία என்பதில் ராஜ்யம் மற்றும் அரசாட்சி ஆகிய கருத்துகள் அடங்கலாம். ‘கடவுளுடைய ராஜ்யம்’ என்பது பொதுவாகப் புரிந்துகொள்ளப்படும் மரியாதையான தமிழ் வழக்காக இருந்து, இவ்விடத்தின் உடைமை/உரிமைத் தொடர்போடும் இயல்பாக அமைகிறது.
theological_decisions:
- issue: τῶν τοιούτων என்பதன் வரம்பு
  choice: அங்கிருந்த பிள்ளைகளால் பிரதிநிதித்துவப்படுத்தப்படும் இப்படிப்பட்டவர்களையும் உள்ளடக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: இயேசுவிடம் கொண்டுவரப்பட்ட அந்தப் பிள்ளைகளை மட்டும் குறிப்பதாக மொழிபெயர்த்தல்
  rationale: τοιοῦτος என்னும் சொல்லின் வகைசுட்டும் தன்மை, உடனிருந்தவர்களைத் தாண்டி அவர்களைப் போன்றவர்களையும் இயல்பாக உள்ளடக்குகிறது. ஆனால் அவர்கள் எந்த விதத்தில் பிள்ளைகளைப் போன்றவர்கள் என்பதை இவ்வசனம் விளக்காததால், மொழிபெயர்ப்பு அதை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் நேரடியானதும் மரியாதையானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிள்ளைகள்’ என்பது παιδία என்பதற்கு வயதை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பாக அமைகிறது; இறுதித் தொடர் குழந்தைத்தன்மையின் எந்தப் பண்பை இயேசு கருதுகிறார் என்பதை விளக்கிச் சேர்க்காமல் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
