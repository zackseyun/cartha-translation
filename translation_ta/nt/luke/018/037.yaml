  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “நாசரேயனாகிய இயேசு கடந்து செல்கிறார்” என்று தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “நாசரேத்தைச் சேர்ந்த இயேசு கடந்து செல்கிறார்.” கிரேக்கத்தில் “இயேசு, நாசரேயன்” என்ற அடையாளப் பெயர் வடிவம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: சொன்னார்கள்
  rationale: தகவலை ஒருவரிடம் தெரிவிப்பதைக் குறிக்கும் வினை. இக்கதைச் சூழலில் எளிய உரையாடல் நடையில் ‘சொன்னார்கள்’ இயல்பாக உள்ளது.
- source_word: δὲ
  choice: வாக்கிய ஓட்டத்தில் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதையை மெதுவாக முன்னெடுக்கும் இணைப்புச் சொல். தமிழில் தனிச் சொல்லாகச் சேர்க்காமல் விடுவது இயல்பான தொடர்ச்சியைத் தருகிறது; முரண்பாட்டை உணர்த்துவதில்லை.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: தகவல் யாரிடம் சொல்லப்பட்டது என்பதைத் தமிழில் இயல்பான வேற்றுமை வடிவில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: நேர்கூற்றை அறிமுகப்படுத்தும் ‘என்று’
  rationale: கிரேக்கத்தில் கூற்றை அறிமுகப்படுத்தும் சொல்லை, தமிழின் இயல்பான நேர்கூற்று அமைப்பான மேற்கோள் மற்றும் ‘என்று’ மூலம் வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ὁ Ναζωραῖος
  choice: நாசரேயராகிய
  rationale: கிரேக்கம் ‘நாசரேத்தைச் சேர்ந்தவர்’ என்ற முன்னிடைச்சொல் தொடரைக் காட்டிலும் ஓர் அடையாளப் பெயரைப் பயன்படுத்துகிறது. ‘நாசரேயராகிய’ அந்த வடிவத்தைப் பாதுகாத்து, தமிழிலும் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
- source_word: παρέρχεται
  choice: இவ்வழியாகப் போய்க்கொண்டிருக்கிறார்
  rationale: அந்த நேரத்தில் நிகழ்ந்துகொண்டிருக்கும் கடந்து செல்லும் செயலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: Ναζωραῖος என்ற இயேசுவின் அடையாளப் பெயரை மொழிபெயர்த்தல்
  choice: நாசரேயராகிய
  alternative: நாசரேத்தைச் சேர்ந்த
  rationale: இது முதன்மையாக இயேசுவின் ஊர்சார் அடையாளம்; விரிவாக்கப்பட்ட கிறிஸ்தவக் கோட்பாட்டுப் பட்டமல்ல. தேர்ந்த வடிவம் கிரேக்கத்தின் அடையாளப் பெயர் அமைப்பைத் தக்கவைக்கிறது; மாற்று அதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போய்க்கொண்டிருக்கிறார்’ என்பது நிகழ்ந்துகொண்டிருக்கும் செயலைக் காட்டுகிறது; ‘இவ்வழியாக’ என்பது παρέρχεται என்பதன் சூழல்சார் ‘கடந்து செல்லுதல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
