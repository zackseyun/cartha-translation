  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: ta
  text: அவரைச் சாட்டையால் அடித்த பிறகு, அவர்கள் அவரைக் கொன்றுவிடுவார்கள்; மூன்றாம் நாளில் அவர் உயிர்த்தெழுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் எழுப்பப்படுவார்.’ இங்குள்ள கிரேக்க வினைச்சொல் இன்னும் நேரடியாக, ‘அவர் உயிர்த்தெழுவார்’ என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: சாட்டையால் அடித்த பிறகு
  rationale: இறந்தகால வினையெச்சம் பிரதான வினைக்கு முந்திய செயலைக் குறிக்கிறது. ‘சாட்டையால் அடித்த’ என்பது வன்முறையைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: ἀποκτενοῦσιν
  choice: அவர்கள் அவரைக் கொன்றுவிடுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவமும் பன்மை எழுவாயும் நேரடியாகப் பாதுகாக்கப்படுகின்றன. ‘கொன்றுவிடுவார்கள்’ என்பது மரணத்தில் முடியும் செயலை இயல்பாகத் தெரிவிக்கிறது; ‘கொலை செய்வார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது அறநெறி நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: αὐτόν
  choice: அவரை / அவரைக்
  rationale: சூழலில் இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்; தமிழின் மரியாதை ஒருமை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் துல்லியமாகத் தருகிறது; தேவையற்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἀναστήσεται
  choice: அவர் உயிர்த்தெழுவார்
  rationale: இங்கு எதிர்கால நடுவினை வடிவம் சூழலில் தன்னிலைப் பொருளுடன் உள்ளது. ‘உயிர்த்தெழுவார்’ என்பது உயிர்த்தெழுதலைத் தெளிவாகக் கூறி, செயப்பாட்டு வடிவமான ‘உயிரோடு எழுப்பப்படுவார்’ என்பதை மூலத்தில் இல்லாமல் இறக்குமதி செய்யாது.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த வினை வடிவம்
  choice: அவர் உயிர்த்தெழுவார்
  alternative: அவர் உயிரோடு எழுப்பப்படுவார்
  rationale: ἀναστήσεται என்பது இங்கு நேரடியாக ‘அவர் எழுவார்/உயிர்த்தெழுவார்’ என்ற தன்னிலைப் பொருளைத் தருகிறது; செயப்பாட்டு மாற்று புதிய ஏற்பாட்டின் பிற இடங்களோடு பொருந்தினாலும், இந்த வசனத்தின் வடிவத்தை விட குறைவாக நேரடியானது. அடிக்குறிப்பு அந்த மாற்றைத் தெரிவித்து மூலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; தெளிவான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. வசனத்தின் தொடர்ச்சியான செயல்களைத் தமிழில் இயல்பாகக் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘உயிர்த்தெழுவார்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
