source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: ta
  text: அவர்கள் இவற்றில் எதையும் புரிந்துகொள்ளவில்லை; இந்தச் செய்தி[a] அவர்களிடமிருந்து மறைக்கப்பட்டிருந்தது[b]; சொல்லப்பட்டவற்றை அவர்கள் அறியவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சொல்” அல்லது “இந்தக் கூற்று.”
    reason: lexical_alternative
  - marker: b
    text: “மறைக்கப்பட்டிருந்தது” என்ற செயப்பாட்டு வடிவம், அதை மறைத்தவர் அல்லது மறைத்தது எது என்பதைச் சொல்லவில்லை.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “என்ன சொல்லப்பட்டது என்பதை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: சீடர்கள் இயேசு முன்பு கூறியவற்றை அறிவார்ந்த முறையில் புரிந்துகொள்ளாததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: οὐδὲν τούτων
  choice: இவற்றில் எதையும்
  rationale: முன்னர் கூறப்பட்ட பல செய்திகளைச் சுட்டும் பன்மைக் குறிப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: τὸ ῥῆμα τοῦτο
  choice: இந்தக் கூற்று
  rationale: ῥῆμα இங்கு தனியொரு சொல்லைவிட இயேசு கூறிய உரை அல்லது செய்தியைக் குறிக்கிறது; ‘கூற்று’ என்பது அதன் உரைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து மறைக்கப்பட்டிருந்தது
  rationale: நிறைவுற்ற மறைத்தலால் தொடரும் நிலையையும், மறைத்தவர் யார் என்பதைச் சொல்லாத செயப்பாட்டு வடிவத்தையும் பேணுகிறது.
- source_word: ἐγίνωσκον
  choice: அறிந்துகொள்ளவில்லை
  rationale: முதல் வாக்கியத்திலுள்ள συνῆκαν என்பதற்கான ‘புரிந்துகொள்ளவில்லை’ என்பதிலிருந்து சொல் வேறுபாட்டைப் பேணியபடியே, இச்சூழலில் உள்ள உணர்ந்தறிதல் சார்ந்த பொருளைத் தருகிறது.
- source_word: τὰ λεγόμενα
  choice: சொல்லப்பட்டவற்றை
  rationale: பேசப்பட்ட உள்ளடக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; கிரேக்கச் செயப்பாட்டு அமைப்பையும் தேவையற்ற விளக்கமின்றிப் பேணுகிறது.
theological_decisions:
- issue: சீடர்களிடமிருந்து கூற்று மறைக்கப்பட்டதற்கான காரணம் அல்லது செய்பவர்
  choice: மறைத்தவர் யார் என்பதைக் குறிப்பிடாமல் செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: கடவுளே அதை மறைத்தார் என்று வெளிப்படையாகக் கூறுதல் அல்லது அது அவர்களுடைய மனக்குழப்பம் மட்டுமே என்று விளக்குதல்
  rationale: கிரேக்க மூலத்தில் மறைத்த செய்பவர் குறிப்பிடப்படவில்லை. ஆகவே தெய்வச் செயல், இறைநடத்தல், அல்லது உளவியல் குழப்பம் என்று உரை தீர்மானிக்காத பதற்றம் மொழிபெயர்ப்பிலும் பேணப்படுகிறது.
- issue: புரிதலின்மையின் மூன்று அடுக்குகள்
  choice: புரிந்துகொள்ளாமை, மறைக்கப்பட்ட நிலை, அறிந்துகொள்ளாமை ஆகிய மூன்றையும் தனித்தனியாக வைத்தல்
  alternative: மூன்றையும் ஒரே பொதுவான ‘அவர்கள் புரிந்துகொள்ளவில்லை’ என்ற வாக்கியமாகச் சுருக்குதல்
  rationale: லூக்கா பயன்படுத்தும் மீளுரைத்தலும் வெவ்வேறு வினைச்சொற்களும் சீடர்களின் முழுமையான புரிதலின்மையை வலியுறுத்துகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க மூலத்தின் மூன்று கூறுகளும் தனி வாக்கியங்களாக அமைக்கப்பட்டதால் மீளுரைத்தல் தெளிவாகவும் இயல்பாகவும் உள்ளது.
