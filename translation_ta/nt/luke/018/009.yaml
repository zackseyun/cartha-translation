source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: ta
  text: மேலும், தாங்கள் நீதிமான்கள் என்று தங்கள்மீதே நம்பிக்கை வைத்து, மற்றவர்களை இகழ்ந்த சிலருக்கு அவர் இந்த உவமையைச் சொன்னார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்றவர்களை அற்பமாகக் கருதிய”; “மற்றவர்களைத் தாழ்வாகப் பார்த்த.”
    reason: ἐξουθενοῦντας என்பதன் ‘ஒன்றுமில்லாதவர்களாகக் கருதுதல் / தாழ்வாகப் பார்த்தல்’ என்ற மாற்று நுணுக்கங்களைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Εἶπεν
  choice: சொன்னார்
  rationale: ‘கூறினார்’ அல்லது ‘பேசினார்’ என்றும் பொருள்படலாம்; ஆனால் ‘இந்த உவமையை’ என்பது நேரடிப் பொருளாக இருப்பதால், இயல்பான தமிழில் ‘உவமையைச் சொன்னார்’ என்பது பொருத்தமானது.
- source_word: δὲ καὶ
  choice: மேலும்
  rationale: δὲ இங்கு மென்மையான கதைத் தொடர்ச்சியையும், καὶ கூடுதலான போதனையையும் குறிக்கிறது; ‘மேலும்’ இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πρός τινας
  choice: சிலருக்கு
  rationale: பேசும் வினையுடன் வரும் πρός, உரை யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கிறது.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: தங்கள்மீதே நம்பிக்கை வைத்து
  rationale: πεποιθότας நிலைபெற்ற நம்பிக்கையையும், ἐφ’ ἑαυτοῖς அந்த நம்பிக்கை தங்களையே சார்ந்திருந்ததையும் காட்டுகிறது; ‘-ஏ’ தற்சார்பைத் தெளிவாக்குகிறது.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: தாங்கள் நீதிமான்கள் என்று
  rationale: δίκαιοι என்பதன் ஒழுக்க மற்றும் இறையியல் வலிமையை ‘நீதிமான்கள்’ காக்கிறது; அவர்களது மதிப்பீடு தவறானது என்பதை மொழிபெயர்ப்பில் முன்கூட்டியே சேர்க்காமல் சூழலே வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: ἐξουθενοῦντας
  choice: இகழ்ந்த
  rationale: இந்த வினை மற்றவர்களை ஒன்றுமில்லாதவர்களாகக் கருதுதல், அற்பமாக எண்ணுதல், இகழ்தல் ஆகிய பொருள்களைக் கொண்டது; ‘இகழ்ந்த’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: τοὺς λοιπούς
  choice: மற்றவர்களை
  rationale: சொல்லுக்கு ‘மீதியுள்ளவர்கள்’ அல்லது ‘மற்றவர்கள்’ என்று பொருள்; இச்சூழலில் ‘மற்றவர்களை’ என்பது இயல்பாகவும் போதிய விரிவுடனும் உள்ளது.
- source_word: τὴν παραβολὴν ταύτην
  choice: இந்த உவமையை
  rationale: சினாப்டிக் நற்செய்திகளில் παραβολή என்பதற்குரிய வழக்கமான, வகையைத் தெளிவாகக் காட்டும் தமிழ் சொல் ‘உவமை’ ஆகும்.
theological_decisions:
- issue: சுயநீதியை விமர்சிக்கும் சூழலில் δίκαιοι என்பதன் மொழிபெயர்ப்பு
  choice: நீதிமான்கள்
  alternative: நியாயமானவர்கள் / தாங்களே சரியானவர்கள்
  rationale: கிரேக்கச் சொல் தன்னிச்சையாக இகழ்ச்சிப் பொருள் கொண்டதல்ல. ‘நீதிமான்கள்’ என்ற முக்கிய இறையியல் சொல்லை வைத்திருப்பதால், அவர்களது சுயமதிப்பீட்டில் உள்ள முரண்பாட்டை உவமையின் சூழலே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘தாங்கள்’ என்பது குறிப்பிடப்படும் சிலரை மரியாதை ஒருமையாக அல்ல, தற்சுட்டுப் பன்மையாகக் குறிக்கிறது.
