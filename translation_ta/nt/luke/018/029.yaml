source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: ta
  text: 'அவர் அவர்களிடம், “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இறையாட்சியின் பொருட்டு வீட்டையோ மனைவியையோ சகோதரர்களையோ பெற்றோரையோ பிள்ளைகளையோ விட்டுவிட்ட எவரும் இல்லை,” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உறுதியான அறிவிப்பு முறையை இயல்பான, கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀφῆκεν
  choice: விட்டுவிட்ட
  rationale: வீடு மற்றும் நெருங்கிய உறவுகளை இறையாட்சியின் பொருட்டு விட்டுச் செல்வது அல்லது துறப்பது என்ற விரிந்த பொருளைத் தக்கவைக்கிறது.
- source_word: οἰκίαν
  choice: வீட்டை
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருளைத் தருகிறது; இங்கு குடும்பம் என்பதை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: இறையாட்சியின் பொருட்டு
  rationale: காரணம் அல்லது நோக்கத்தைக் குறிக்கும் ἕνεκεν என்பதையும், தேவனுடைய அரசாட்சியைக் குறிக்கும் சொற்றொடரையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: இறையாட்சி
  alternative: தேவனுடைய ராஜ்யம்
  rationale: தேவன் ஆளும் செயற்பாட்டு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதை வெறும் இடமாகக் குறுக்கவில்லை.
- issue: உறவுகளை ‘விட்டுவிடுதல்’ என்பதன் தன்மை
  choice: விட்டுவிட்ட என்று மட்டும் மொழிபெயர்த்து, நிரந்தரக் கைவிடுதல் என விளக்கவில்லை
  alternative: துறந்துவிட்ட
  rationale: ἀφίημι இங்கு பிரிந்து செல்லுதல் அல்லது பின்னால் விட்டுச் செல்லுதல் ஆகியவற்றை உள்ளடக்கலாம்; வசனம் தானாகத் தீர்மானிக்காத நெறியியல் அல்லது நிரந்தரத் தன்மையை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நேரடி நடை. கிரேக்க வாக்கியத்தின் பட்டியல் அமைப்பும், அடுத்த வசனத்தில் தொடரும் நிறைவுறாத மேற்கோள் ஓட்டமும் பாதுகாக்கப்பட்டுள்ளன.
