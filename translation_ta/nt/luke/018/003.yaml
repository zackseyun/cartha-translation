revisions:
- from: அந்த நகரத்தில் ஒரு விதவை இருந்தாள். அவள் அவனிடம் திரும்பத் திரும்ப வந்து, “என் எதிராளியிடமிருந்து எனக்கு நீதி கிடைக்கச் செய்யும்[a]” என்று கேட்டுக்கொண்டிருந்தாள்.
  to: அந்த நகரத்தில் ஒரு விதவை இருந்தாள். அவள் அவனிடம் திரும்பத் திரும்ப வந்து, “என் எதிராளிக்கு எதிராக எனக்கு நீதி வழங்குங்கள்[a]” என்று கேட்டுக்கொண்டிருந்தாள்.
  rationale: The revision clarifies the judicial direction of the widow’s appeal while preserving the Greek ambiguity between legal vindication and justice. It retains the repeated-action force of the imperfect and uses accessible modern standard Tamil.
  reviewer_model: gpt-5.6-terra
