  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: ta
  text: அந்த நகரத்தில் ஒரு விதவை இருந்தாள். அவள் அவனிடம் திரும்பத் திரும்ப வந்து, “என் எதிராளிக்கு எதிராக எனக்கு நீதி வழங்குங்கள்[a]” என்று கேட்டுக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் எதிராளியிடமிருந்து என்னை நியாயப்படுத்துங்கள்” அல்லது “என் எதிராளிக்கு எதிராக எனக்கு நியாயம் கிடைக்கச் செய்யுங்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் தனிப்பட்ட பழிவாங்குதலை அவசியம் குறிக்காமல், சட்டரீதியான நீதி அல்லது நியாயநிரூபணம் வழங்கப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
