- source_word: ἤρχετο πρὸς αὐτόν
  choice: அவனிடம் திரும்பத் திரும்ப வந்து
  rationale: இறந்தகால imperfect வடிவம் சூழலில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் காட்டுகிறது; விதவையின் விடாமுயற்சியைத் தெளிவாக்குகிறது.
- source_word: λέγουσα
  choice: என்று கேட்டுக்கொண்டிருந்தாள்
  rationale: அவளுடைய தொடர்ச்சியான வேண்டுகோளை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் ‘சொன்னாள்’ என்பதைவிட சூழலுக்குப் பொருத்தமானது.
- source_word: Ἐκδίκησόν με
  choice: எனக்கு நீதி கிடைக்கச் செய்யும்
  rationale: நீதித்துறைச் சூழலில் பழிவாங்குதலை அல்ல, சட்டரீதியான நீதி அல்லது நியாயத் தீர்ப்பைப் பெற்றுத்தருதலைக் குறிக்கிறது.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: என் எதிராளியிடமிருந்து
  rationale: ἀντίδικος என்பது வழக்கில் எதிர்த்தரப்பினராக இருப்பவரைக் குறிக்கலாம்; ἀπό என்பதன் ‘இடமிருந்து’ என்ற வடிவத்தையும் தக்கவைக்கிறது.
