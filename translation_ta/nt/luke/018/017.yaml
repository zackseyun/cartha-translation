  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ta
  text: '“உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: ஒரு குழந்தையைப் போல இறைவனுடைய அரசாட்சியை ஏற்றுக்கொள்ளாத எவரும் அதற்குள் ஒருபோதும் நுழையமாட்டார்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு குழந்தையாக’ என்றும் மொழிபெயர்க்கலாம். குழந்தையைப் போன்று ஏற்றுக்கொள்ளும் மனப்பான்மை, நம்பிக்கை, பணிவு, அல்லது சார்ந்திருத்தல் ஆகியவற்றில் எது வலியுறுத்தப்படுகிறது என்பதை கிரேக்க உரை துல்லியமாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் கூற்றை உறுதிப்படுத்தி அறிமுகப்படுத்தும் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘ஆமென்’ என்ற ஒலிபெயர்ப்பு இச்சூழலில் தெளிவற்றதாக இருக்கலாம்.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: பன்மை இரண்டாம் நபருக்கான நேரடி உரையை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ὃς ἂν μὴ δέξηται
  choice: ஏற்றுக்கொள்ளாத எவரும்
  rationale: ὃς ἂν குறிக்கும் பொதுவான, வரையறையற்ற நிபந்தனையை ‘எவரும்’ வெளிப்படுத்துகிறது; δέχομαι என்பதன் பெறுதல் மற்றும் மனமுவந்து ஏற்றல் ஆகிய பரப்பை ‘ஏற்றுக்கொள்’ இயல்பாகக் காக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: இறைவனுடைய அரசாட்சி
  rationale: βασιλεία என்பதிலுள்ள ஆட்சி அல்லது அரசுரிமை என்ற இயக்கமிக்க பொருளைக் காக்கிறது; அதேவேளை தமிழில் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
- source_word: ὡς παιδίον
  choice: ஒரு குழந்தையைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையைத் தெளிவாகக் காக்கிறது; குழந்தையின் பணிவு, நம்பிக்கை, சார்ந்திருத்தல் அல்லது ஏற்றுக்கொள்ளும் மனப்பான்மை ஆகியவற்றில் ஒன்றை மட்டும் உரை குறிப்பிடாததால் அவற்றை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: οὐ μὴ εἰσέλθῃ εἰς αὐτήν
  choice: அதற்குள் ஒருபோதும் நுழையமாட்டார்
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பை ‘ஒருபோதும் ... மாட்டார்’ வலுவாகவும் இயல்பாகவும் தெரிவிக்கிறது; αὐτήν முந்தைய ‘அரசாட்சி’யைக் குறிக்கிறது.
theological_decisions:
- issue: ‘ஒரு குழந்தையைப் போல’ அரசாட்சியை ஏற்றுக்கொள்வதன் துல்லியமான பொருள்
  choice: குழந்தையுடன் செய்யப்படும் ஒப்புமையை விளக்காமல் அப்படியே வைத்தல்
  alternative: ‘குழந்தைக்குரிய பணிவுடன்,’ ‘குழந்தையைப் போன்ற நம்பிக்கையுடன்,’ அல்லது ‘ஒரு குழந்தையாக’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை எந்தத் தன்மையை—பணிவு, நம்பிக்கை, சார்ந்திருத்தல், அல்லது ஏற்றுக்கொள்ளும் தன்மை—முதன்மைப்படுத்துகிறது என்று வெளிப்படையாகச் சொல்லவில்லை. ஆகவே உண்மையான பொருள் விரிவையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: βασιλεία τοῦ θεοῦ என்பதன் வடிவம்
  choice: இறைவனுடைய அரசாட்சி
  alternative: இறைவனுடைய ராஜ்யம்
  rationale: ‘அரசாட்சி’ என்பது கடவுளின் ஆளுகையைத் தெளிவாக வெளிப்படுத்துகிறது; அதை வெறும் நிலப்பரப்பாகக் குறுக்கும் அபாயத்தைத் தவிர்க்கிறது, ஆனால் அந்தக் கருத்தை உரைக்கு அப்பால் விரிவுபடுத்தவில்லை.
