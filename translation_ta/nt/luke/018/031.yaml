source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: ta
  text: பின்பு அவர் பன்னிருவரையும் தனியே அழைத்துக்கொண்டு, அவர்களிடம், “இதோ, நாம் எருசலேமுக்குப் போகிறோம். மனிதகுமாரனைக் குறித்து இறைவாக்கினர்கள் மூலம் எழுதப்பட்டுள்ள அனைத்தும் நிறைவேறும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παραλαβὼν
  choice: தனியே அழைத்து
  rationale: παραλαμβάνω என்பதன் அடிப்படைப் பொருள் ‘தம்முடன் அழைத்துக்கொள்ளுதல்’; இச்சூழலில் பன்னிருவருக்குத் தனிப்பட்ட முறையில் அறிவுறுத்துவதைக் குறிக்கும் இயல்பான தமிழாக ‘தனியே அழைத்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τοὺς δώδεκα
  choice: பன்னிருவரையும்
  rationale: கிரேக்கம் ‘பன்னிருவர்’ என்ற அங்கீகரிக்கப்பட்ட குழுப்பெயரை மட்டுமே பயன்படுத்துகிறது; ‘சீடர்கள்’ என்பதைச் சேர்க்காமல் அதே வடிவம் காக்கப்படுகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் குறிப்பான ἰδού என்பதற்கு நவீன, கண்ணியமான தமிழில் இயல்பான இணைச்சொல்.
- source_word: ἀναβαίνομεν
  choice: போகிறோம்
  rationale: எருசலேமை நோக்கிய ஏற்றப் பயணத்தை ἀνά உணர்த்தினாலும், தமிழில் ‘எருசலேமுக்குப் போகிறோம்’ என்பது இயல்பான பயணச் சொல்லாக்கம்; ‘மேலே போகிறோம்’ என்பது தவறான திசை உணர்வை ஏற்படுத்தக்கூடும்.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற இடப்பெயர் வடிவம்.
- source_word: τελεσθήσεται
  choice: நிறைவேறும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம், எழுதப்பட்டவை அவற்றின் நோக்கமுற்ற நிறைவை அடைவதைச் சுட்டுகிறது; தீர்க்கதரிசனச் சூழலில் ‘நிறைவேறும்’ இயல்பானது.
- source_word: πάντα τὰ γεγραμμένα
  choice: எழுதப்பட்டுள்ள அனைத்தும்
  rationale: πάντα என்பதன் முழுமையையும் γεγραμμένα என்ற நிறைநிலைப் பெயரெச்சத்தின் தொடரும் விளைவையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: διὰ τῶν προφητῶν
  choice: இறைவாக்கினர்கள் மூலம்
  rationale: διά + மரபுவேற்றுமை இங்கு வழிமுறை அல்லது முகவரைச் சுட்டுகிறது; ‘மூலம்’ அந்த உறவைத் தெளிவாகக் காக்கிறது.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: மனிதகுமாரனைக் குறித்து
  rationale: வேற்றுமை உருபை சொற்பட ‘மனிதகுமாரனுக்காக’ எனக் கொள்ள முடிந்தாலும், இக்கட்டமைப்பில் எழுதப்பட்டவற்றின் பொருள் அல்லது குறிப்பு அவரே என்பதைக் காட்ட ‘குறித்து’ இயல்பானது; மாற்று வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துசார் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனித மைந்தன் / மனிதரானவர்
  rationale: ‘மனிதகுமாரன்’ கிரேக்கச் சொல்லமைப்பையும் தானியேல் நூலுடனான சாத்தியமான எதிரொலியையும் காக்கும் நிலைபெற்ற தமிழ் வடிவம்; பொதுவான மனிதத்தன்மையைக் குறிக்கும் சொலாக இதைத் தட்டையாக்கவில்லை.
- issue: τῷ υἱῷ τοῦ ἀνθρώπου என்ற நான்காம் வேற்றுமையின் தொடர்பு
  choice: மனிதகுமாரனைக் குறித்து
  alternative: மனிதகுமாரனுக்காக
  rationale: சூழலில் இறைவாக்கினர்கள் எழுதியவற்றின் உள்ளடக்கம் மனிதகுமாரனைச் சார்ந்தது என்பது முதன்மையான வாசிப்பு; எனினும் கிரேக்க வேற்றுமையின் இலக்கணத் திறந்தநிலை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘இதோ’, ‘இறைவாக்கினர்கள்’, ‘மனிதகுமாரன்’, ‘நிறைவேறும்’ ஆகியவை வேதாகமத் தன்மையைத் தக்கவைத்தாலும் பழமையான வாக்கிய அமைப்பைத் தவிர்க்கின்றன.
