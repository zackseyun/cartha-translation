  source_fidelity: The translation accurately conveys εἶπεν δὲ ὁ κύριος, the plural imperative Ἀκούσατε, and the content clause τί ... λέγει. “அநீதியான நீதிபதி” is a sound idiomatic rendering of the qualitative genitive τῆς ἀδικίας, while the footnote preserves the more literal construction without overstating it.
