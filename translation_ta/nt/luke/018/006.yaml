  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: ta
  text: 'ஆண்டவர் மேலும் சொன்னார்: “அந்த அநீதியான நீதிபதி[a] சொல்வதைக் கேளுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அநீதியின் நீதிபதி.” கிரேக்கச் சொற்றொடர் சொல்லுக்கு சொல் “அநீதியின் நீதிபதி” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: λέγω என்பதன் இறந்தகாலக் கதைவடிவத்தை இயல்பான தமிழ் இறந்தகாலமாக வழங்குகிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: கதைத் தொடர்ச்சியைக் குறிக்கும் δέ-யின் இணைப்புத் தன்மையை, தேவையற்ற காலப்பொருள் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவைக் குறிக்கும் κύριος-ன் பட்டப்பெயர்ச் சிறப்பையும் மரியாதையையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: Ἀκούσατε
  choice: கேளுங்கள்
  rationale: கவனமாகக் கேட்கும்படி வலியுறுத்தும் பன்மை ஏவலைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: τί
  choice: சொல்வதை
  rationale: நீதிபதி கூறும் உள்ளடக்கத்தைக் குறிக்கிறது; அவர் எவ்வாறு பேசுகிறார் என்ற முறையை அல்ல.
- source_word: ὁ κριτὴς
  choice: அந்த ... நீதிபதி
  rationale: உவமையில் முன்பே குறிப்பிடப்பட்ட நீதிபதியைச் சுட்டுவதால், கிரேக்க வரையறைச் சுட்டின் பின்னோக்குக் குறிப்பை இயல்பான தமிழில் ‘அந்த’ என வெளிப்படுத்துகிறது.
- source_word: τῆς ἀδικίας
  choice: அநீதியான
  rationale: சொல்லுக்கு சொல் ‘அநீதியின்’ என்ற பண்புத் தொகையை இயல்பான தமிழில் நெறிப்பண்பைக் குறிக்கும் பெயரடையாக வழங்குகிறது.
- source_word: λέγει
  choice: சொல்வதை
  rationale: கிரேக்க நிகழ்காலத்தின் உடனடித் தன்மையைத் தமிழ் சார்புவினை வடிவில் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமானர்
  rationale: லூக்காவின் உரையில் இது வெறும் சமூக உறவைக் குறிக்கும் ‘எஜமானர்’ என்பதைக் கடந்த பட்டப்பெயர்ச் சிறப்பைக் கொண்டுள்ளது; ‘ஆண்டவர்’ அதைத் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
- issue: τῆς ἀδικίας என்ற பண்புத் தொகையின் பொருள்
  choice: அநீதியான நீதிபதி
  alternative: அநீதியின் நீதிபதி
  rationale: இந்த இறைமைவேற்றுமைத் தொடர் நீதிபதியின் நெறிப்பண்பைச் சுட்டுகிறது. இயல்பான தமிழில் ‘அநீதியான’ என்பது அதைக் காட்டுகிறது; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. ‘ஆண்டவர்’ என்ற பட்டப்பெயரும் ‘கேளுங்கள்’ என்ற ஏவல் வடிவமும் உரையின் கண்ணியத்தையும் நேரடித்தன்மையையும் காக்கின்றன.
