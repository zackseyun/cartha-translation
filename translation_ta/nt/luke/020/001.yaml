  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: ta
  text: ஒருநாள், அவர் ஆலய வளாகத்தில்[a] மக்களுக்குப் போதித்து நற்செய்தியை அறிவித்துக்கொண்டிருந்தபோது[b], தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும் மூப்பர்களோடு சேர்ந்து அவரிடம் வந்தார்கள்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ἱερόν என்பது ஆலயத்தின் உள் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நற்செய்தியைப் பிரசங்கித்துக்கொண்டிருந்தபோது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: அந்த நாட்களில் ஒன்றில்
  rationale: கிரேக்கக் கதைநடை மாற்றுச் சொற்றொடரின் செயல்பாட்டை அடுத்த காலக் குறிப்புடன் இணைத்து, தமிழில் இயல்பாக வழங்குகிறது; சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தேவையற்ற கனத்த நடை உருவாகும்.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: அந்த நாட்களில் ஒன்றில்
  rationale: நடப்பு நிகழ்வுத் தொடரிலுள்ள குறிப்பிட்டிராத ஒரு நாளைக் குறிக்கும் பகுதிப்பொருளைத் தக்கவைக்கிறது.
- source_word: διδάσκοντος αὐτοῦ τὸν λαὸν
  choice: அவர் … மக்களுக்குப் போதித்து
  rationale: ஒரே நேரத்தில் நடந்த செயலைத் தமிழில் இயல்பான வினையெச்ச அமைப்பில் தருகிறது; λαός என்பதற்கு கூட்டம் என்று குறுக்காமல் மக்கள் என மொழிபெயர்க்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν இங்கு உள் திருத்தலத்தை மட்டும் அல்லாமல் முழு ஆலயப் பகுதியையும் குறிக்கிறது; முதன்மை உரையிலேயே அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: εὐαγγελιζομένου
  choice: நற்செய்தியை அறிவித்துக்கொண்டிருந்தபோது
  rationale: நல்ல செய்தியைப் பொதுவாக அறிவிக்கும் வினைச்செயலைத் தெளிவாகவும் சபைசார் தொழில்நுட்பச் சொல்லாக்கமின்றியும் வெளிப்படுத்துகிறது.
- source_word: ἐπέστησαν
  choice: அவரிடம் வந்து நின்றார்கள்
  rationale: அவர்கள் நேரடியாக வந்து அணுகியதையும் கிரேக்க வினையின் திடமான வருகை நிழற்பொருளையும் காட்டுகிறது; பகைமையை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: இது பல தலைமைக்குரு பதவியாளர்களைக் குறிக்காமல், ஆலயத்தின் தலைமைக்குருத்துவக் குழுவைக் குறிக்கும் வரலாற்றுப் பயன்பாட்டை வெளிப்படுத்துகிறது.
- source_word: οἱ γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: வெறும் எழுத்தர்களாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து, மறைநூல்களிலும் சமயச் சட்டத்திலும் தேர்ந்திருந்த வரலாற்றுக் குழுவைக் குறிக்கிறது.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: மூப்பர்களோடு சேர்ந்து
  rationale: σύν குறிக்கும் உடனிணைவை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: εὐαγγελιζομένου என்பதை பிற்கால சபைசார் தொழில்நுட்பச் சொல்லாகக் காட்டலாமா
  choice: நற்செய்தியை அறிவித்துக்கொண்டிருந்தபோது
  alternative: சுவிசேஷத்தைப் பிரசங்கித்துக்கொண்டிருந்தபோது
  rationale: இங்கு இயேசுவின் பொதுப் போதனைச் செயல் விவரிக்கப்படுகிறது. தேர்ந்த மொழிபெயர்ப்பு கிரேக்க வினையின் பொருளைக் காக்கிறது; பின்னாளைய சபை வழக்கைத் தேவையின்றி உரைக்குள் கொண்டுவரவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் ஒரே வாக்கியத்தின் தொடக்கம் என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்களிலிருந்து இடம்பெயர்ந்திருந்ததால், தமிழில் அவை பொருத்தமான இடங்களில் அமைக்கப்பட்டுள்ளன.
