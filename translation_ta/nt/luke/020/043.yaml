lexical_decisions:
- source_word: ἕως ἂν
  choice: வைக்கும்வரை
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் ஒரு செயலை எல்லையாகக் காட்டும் தொடரைத் தமிழில் இயல்பாக ‘-வரை’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: θῶ
  choice: நான் வைக்கும்வரை
  rationale: τίθημι என்பதன் அடிப்படைப் பொருள் ‘வை/இடம் செய்’. இங்கு கால்மணை என்ற உருவகத்தோடு ‘வைக்க’ என்பது இயல்பாகவும் மூலத்தின் சொல்லாட்சிக்கு நெருக்கமாகவும் உள்ளது.
- source_word: τοὺς ἐχθρούς σου
  choice: உன் பகைவர்களை
  rationale: எதிர்ப்பையும் பகைமையையும் மென்மைப்படுத்தாமல், நேரடியான பன்மைச் செயப்படுபொருளையும் ஒருமை உடைமைச் சுட்டையும் காக்கிறது.
- source_word: ὑποπόδιον
  choice: கால்மணையாக
  rationale: கால்களை வைத்துக்கொள்ளும் தாழ்ந்த மணையைக் குறிக்கும் சொல்லாக ‘கால்மணை’ உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: τῶν ποδῶν σου
  choice: உன் கால்களுக்கு
  rationale: சொல்லுக்கு சொல் ‘உன் கால்களின்’ என்றாலும், கால்மணையுடன் தமிழில் ‘உன் கால்களுக்கு’ என்பதே இயல்பான தொடர்பைத் தருகிறது; உருவகத்தை ‘கால்களுக்குக் கீழே’ என்று விளக்கிப் பெருக்குவதில்லை.
theological_decisions:
- issue: சங்கீதம் 110:1 மேற்கோளில் உள்ள கீழ்ப்படுத்தல் உருவகம்
  choice: ‘பகைவர்களை உன் கால்களுக்குக் கால்மணையாக வைப்பது’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘உன் பகைவர்களை உன் கால்களுக்குக் கீழே அடக்கும்வரை’
  rationale: மூலவசனம் பகைவர்களின் தோல்வி அல்லது முழுமையான ஆதிக்கம் என்று விளக்கிச் சொல்லாமல் அரசருக்குரிய உருவகத்தையே தருகிறது. ஆகவே அதன் கிறிஸ்துவியல் வலிமையையும் பொருள் நெருக்கடியையும் விளக்கச் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கால்மணை’ என்பது உருவகத்தைச் சுருக்கமாகவும் பொதுவாகப் புரிந்துகொள்ளக்கூடிய வகையிலும் தெரிவிக்கிறது.
