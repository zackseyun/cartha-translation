  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: ta
  text: அவர் மேலும் இன்னொரு அடிமையை[a] அனுப்பினார். அவர்களோ அவனையும் அடித்து அவமானப்படுத்தி, வெறுங்கையுடன் அனுப்பிவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாள்.’ கிரேக்கச் சொல் δοῦλος இங்கு எஜமானருக்குக் கட்டுப்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: மேலும் … அனுப்பினார்
  rationale: προστίθημι என்பதுடன் வினையெச்சம் சேரும் இத்தொடர், முன்பு செய்த செயலையே தொடர்ந்து இன்னொரு முறை செய்வதைக் குறிக்கிறது. தமிழில் ‘மேலும் … அனுப்பினார்’ என்பது அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἕτερον
  choice: வேறொரு
  rationale: முன்பு அனுப்பப்பட்டவரிலிருந்து வேறுபட்ட இன்னொருவரைக் குறிக்கிறது; ‘வேறொரு’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: δοῦλον
  choice: அடிமை
  rationale: திராட்சைத்தோட்ட உரிமையாளரின் கட்டுப்பாட்டிற்குட்பட்ட நபரின் சமூக நிலையைக் δοῦλος குறிக்கிறது. ‘அடிமை’ அந்தப் பிணைக்கப்பட்ட நிலையைக் ‘பணியாள்’ என்பதைவிடத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: κἀκεῖνον
  choice: அவனையும்
  rationale: καὶ ἐκεῖνον என்பதன் சுருக்க வடிவமான இது, முந்தைய நபருக்கு நடந்ததே இவனுக்கும் நடந்ததை வலியுறுத்துகிறது; தமிழில் ‘அவனையும்’ இதை இயல்பாகக் காட்டுகிறது.
- source_word: δείραντες
  choice: அடித்து
  rationale: உடல்ரீதியாகத் தாக்கி அடித்தலைக் குறிக்கிறது; எந்தக் குறிப்பிட்ட தண்டனை முறையையும் தேவையின்றி சேர்க்காமல் ‘அடித்து’ பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: ἀτιμάσαντες
  choice: அவமானப்படுத்தி
  rationale: மரியாதையின்றி நடத்தி இழிவுபடுத்தியதைக் குறிக்கிறது. ‘அவமானப்படுத்தி’ சமூக இழிவின் பரிமாணத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξαπέστειλαν
  choice: அனுப்பிவிட்டார்கள்
  rationale: ஒருவரை அங்கிருந்து வெளியே அனுப்பிய செயலைக் குறிக்கிறது; ‘அனுப்பிவிட்டார்கள்’ சூழலுக்கேற்ற நிறைவையும் நீக்கி அனுப்பிய உணர்வையும் தருகிறது.
- source_word: κενόν
  choice: வெறுங்கையுடன்
  rationale: எதிர்பார்க்கப்பட்ட விளைச்சலில் எதையும் பெற்றுக்கொள்ளாமல் திருப்பி அனுப்பப்பட்டதைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: உவமையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாள்
  rationale: இந்த உவமையில் திராட்சைத்தோட்ட உரிமையாளருக்கும் அனுப்பப்பட்ட நபருக்கும் உள்ள உடைமை மற்றும் அதிகார உறவு கவனத்திற்குரியது. எனவே எந்தக் கூடுதல் சமயக் கோட்பாட்டையும் புகுத்தாமல் அக்கால சமூக நிலையைக் காட்ட ‘அடிமை’ பயன்படுத்தப்படுகிறது; வாசிப்புக்கு உதவ ‘பணியாள்’ அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் கண்ணியமான கதைநடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்களோ’ எதிர்மறைத் திருப்பத்தையும், ‘அவனையும்’ முந்தைய நிகழ்வுடன் உள்ள இணைப்பையும் வெளிப்படுத்துகின்றன.
