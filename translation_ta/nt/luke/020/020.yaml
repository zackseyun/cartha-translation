id: LUK.20.20
reference: Luke 20:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: ta
  text: அவர்கள் அவரைக் கூர்ந்து கவனித்து, தாங்கள் நீதிமான்கள் என்று பாசாங்கு செய்த உளவாளிகளை அனுப்பினார்கள். அவர்கள் அவர் சொன்ன ஏதாவது ஒரு சொல்லைப் பற்றிக்கொண்டு[a], அவரை ஆளுநரின் ஆட்சிக்கும் அதிகாரத்திற்கும்[b] ஒப்புக்கொடுப்பதற்காக இவ்வாறு செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘அவருடைய வார்த்தையைப் பற்றிக்கொண்டு’ அல்லது ‘அவருடைய வார்த்தையைப் பிடித்துக்கொண்டு.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஆளுநரின் ஆளுகைக்கும் அதிகார வரம்பிற்கும் அவரை ஒப்புக்கொடுக்க’ என்றும் மொழிபெயர்க்கலாம். இணையாக வரும் இரு சொற்களும் ஆளுநரின் அதிகாரப்பூர்வ ஆட்சியையும் அதிகாரத்தையும் வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: அவரைக் கூர்ந்து கவனித்து
  rationale: இறந்தகாலப் பங்கேற்பு வினை, உளவாளிகளை அனுப்புவதற்கு முன் நடந்த விழிப்பான, பகைநோக்குடைய கண்காணிப்பைக் குறிக்கிறது. கிரேக்கத்தில் மறைமுகமாக உள்ள செயப்படுபொருள் சூழலிலிருந்து ‘அவரை’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐγκαθέτους
  choice: உளவாளிகளை
  rationale: பொறியில் சிக்கவைக்க இரகசியமாக அமர்த்தப்பட்ட ஆட்களை இச்சொல் குறிக்கிறது; ‘உளவாளிகள்’ என்பது மறைமுகமான பகைநோக்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: தாங்கள் நீதிமான்கள் என்பதுபோல் நடித்த
  rationale: அவர்களின் ஏமாற்றும் சுயவெளிப்பாட்டைத் தெரிவிக்கிறது. ‘நீதிமான்கள்’ என்பது δίκαιος என்பதன் ஒழுக்க மற்றும் சமயச் சாயலைத் தக்கவைக்கிறது.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: அவர் சொல்லும் ஏதாவது ஒரு வார்த்தையைப் பிடித்துக்கொண்டு
  rationale: அவருடைய சொற்களையே ஆதாரமாக்கி அவரைப் பொறியில் சிக்கவைக்கும் நோக்கத்தைச் சொல்கிறது. மூலத்தின் உருவகத்தைத் தக்கவைத்தபடி தமிழில் புரியுமாறு அமைக்கப்பட்டுள்ளது.
- source_word: ὥστε
  choice: ஒப்புக்கொடுப்பதே அவர்களுடைய நோக்கம்
  rationale: பேச்சில் பிடித்துக்கொள்வதன் நோக்கமுள்ள விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இதை வெறும் தற்செயல் விளைவாக மாற்றவில்லை.
- source_word: παραδοῦναι
  choice: ஒப்புக்கொடுக்க
  rationale: நீதித்துறை மற்றும் பகைமைச் சூழலில் ஒருவரை அதிகாரிகளின் கையில் ஒப்படைப்பதை இயல்பாகக் குறிக்கிறது.
- source_word: τῇ ἀρχῇ
  choice: ஆட்சிக்கும்
  rationale: இங்கே ἀρχή என்பது ‘தொடக்கம்’ அல்ல, ஆளும் அதிகார அமைப்பை அல்லது ஆட்சியைச் சுட்டுகிறது. தொடர்ந்து வரும் ἐξουσία என்பதிலிருந்து வேறுபடுத்த ‘ஆட்சி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τῇ ἐξουσίᾳ
  choice: அதிகாரத்திற்கும்
  rationale: அதிகாரத்தைச் செலுத்துவதற்கான உரிமை அல்லது அதிகார வரம்பைச் சுட்டுகிறது; இணைச்சொற்களின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: τοῦ ἡγεμόνος
  choice: ஆளுநரின்
  rationale: ரோம மாகாண நிர்வாகச் சூழலில் ἡγεμών என்பதற்கான தெளிவான, பொதுவாகப் புரியும் பதம்.
theological_decisions:
- issue: பொய்யாகக் காட்டிக்கொள்ளப்பட்ட ஒழுக்க-சமய நிலையைச் சுட்டும் δίκαιος என்பதன் மொழிபெயர்ப்பு
  choice: நீதிமான்கள்
  alternative: நேர்மையானவர்கள் / நியாயமானவர்கள்
  rationale: ‘நீதிமான்கள்’ என்பது சொல்லின் ஒழுக்க மற்றும் சமய நிறையைப் பாதுகாக்கிறது; அதை வெறும் சமூக நேர்மையாகவோ சட்டநியாயமாகவோ சுருக்குவதில்லை.
- issue: ἀρχή மற்றும் ἐξουσία என்ற இணைச் சொற்களின் உறவு
  choice: ஆட்சி மற்றும் அதிகாரம் என இரண்டையும் தனித்தனியாக வைத்தல்
  alternative: ஆளுநரின் அதிகாரம் என ஒன்றிணைத்தல்
  rationale: மூலத்தில் உள்ள இரட்டைச் சொல்லாக்கம் அதிகாரப்பூர்வ ஆளுகையையும் அதிகார வல்லமையையும் வலியுறுத்தலாம்; ஒன்றிணைப்பது அந்த அழுத்தத்தை இழக்கச் செய்யும்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமாக உள்ளது. மூலத்தில் உள்ள பொறிவைத்தல் உருவகமும் ‘ஆட்சி—அதிகாரம்’ என்ற இணைச்சொல் வலியுறுத்தலும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
