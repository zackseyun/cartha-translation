  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: ta
  text: “நீண்ட அங்கிகளை[b] அணிந்துகொண்டு நடமாடவும், சந்தைவெளிகளில் வாழ்த்துகளையும், யூத ஜெபக்கூடங்களில் முதன்மை இருக்கைகளையும்[c], விருந்துகளில் மதிப்புக்குரிய இடங்களையும்[d] விரும்புகிற மறைநூல் அறிஞர்களிடம் எச்சரிக்கையாக இருங்கள்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைநூல் அறிஞர்களைக் குறித்து விழிப்பாயிருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “நீண்ட அங்கிகள்” என்பது பிறர் கவனத்தை ஈர்த்து சமூக அந்தஸ்தைக் காட்டக்கூடிய ஆடைகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மிகச் சிறந்த இருக்கைகள்” அல்லது “கௌரவ இருக்கைகள்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “முதன்மை இடங்கள்” அல்லது “மிகச் சிறந்த இடங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: இந்தக் கட்டளை ஒரு குழுவினரைக் குறித்து விழிப்புடனும் எச்சரிக்கையுடனும் இருக்கும்படி அழைக்கிறது. தமிழில் இயல்பாக எச்சரிக்கை வலிமையைத் தருகிறது.
- source_word: γραμματέων
  choice: திருமறை அறிஞர்கள்
  rationale: இவர்கள் வெறும் எழுத்தர்களல்ல; யூதத் திருமறையையும் திருச்சட்டத்தையும் படித்து விளக்கிய அறிஞர்கள். நவீன வாசகருக்கு அவர்களுடைய சமயப் பணி தெளிவாகும் வகையில் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῶν θελόντων περιπατεῖν
  choice: நடமாட விரும்புகிறவர்கள்
  rationale: θέλω என்பதன் விருப்பம் அல்லது நாட்டம் என்ற நுணுக்கத்தையும், பொதுவிடங்களில் காணப்படுமாறு சுற்றித் திரிவதைச் சுட்டும் περιπατεῖν என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν στολαῖς
  choice: நீண்ட அங்கிகளை அணிந்துகொண்டு
  rationale: στολή என்பது நீளமான, பொதுவாக மதிப்பு அல்லது அந்தஸ்தை வெளிப்படுத்தக்கூடிய அங்கியைக் குறிக்கிறது. தமிழில் ஆடை அணிந்திருப்பது இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: φιλούντων ἀσπασμοὺς
  choice: வாழ்த்துகளை விரும்புகிறவர்கள்
  rationale: φιλούντων என்பதிலுள்ள வலுவான விருப்பத்தையும், ἀσπασμοί என்பதன் பொது வாழ்த்துகள் என்ற அடிப்படைப் பொருளையும் காக்கிறது; அவை மரியாதைமிக்க வாழ்த்துகள் என்பது சூழலால் புலப்படுகிறது.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: சந்தைவெளிகளில்
  rationale: ἀγορά என்பது வணிகமும் பொது சமூகச் சந்திப்பும் நடைபெற்ற திறந்த சந்தைப் பகுதியைக் குறிக்கிறது.
- source_word: πρωτοκαθεδρίας
  choice: முதன்மை இருக்கைகள்
  rationale: தொழுகைக்கூடங்களில் மிகுந்த மதிப்புக்குரிய அல்லது பிரதான இருக்கைகளைச் சுட்டுகிறது. சொற்பொருளையும் சமூக அந்தஸ்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: தொழுகைக்கூடங்களில்
  rationale: யூதர்களின் கூடுகை மற்றும் வழிபாட்டு இடத்தைக் குறிக்கும் συναγωγή என்பதற்கு நவீன வாசகருக்குப் புரியும் இயல்பான தமிழ்.
- source_word: πρωτοκλισίας
  choice: மதிப்புக்குரிய இடங்கள்
  rationale: விருந்தின்போது மிகுந்த கௌரவம் பெற்ற அமர்வு அல்லது சாய்ந்திருக்கும் இடங்களைக் குறிக்கிறது. பண்டைய உணவுமுறையைத் தேவையின்றி விரிவாக்காமல் அதன் சமூகச் செயல்பாட்டைத் தெரிவிக்கிறது.
theological_decisions:
- issue: திருமறை அறிஞர்கள்மீதான சமூக-சமய விமர்சனத்தின் வரம்பு
  choice: தொடர்ந்து வரும் பண்புப்பெயரெச்சங்களால் விவரிக்கப்படும், பகட்டான தோற்றத்தையும் பொதுமக்களின் மதிப்பையும் நாடும் திருமறை அறிஞர்களைக் குறித்த எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒவ்வொரு திருமறை அறிஞரையும் வேறுபாடின்றிக் கண்டிக்கும் கூற்றாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க வாக்கியம் ‘திருமறை அறிஞர்கள்’ என்பதைத் தொடர்ந்து அவர்களுடைய விருப்பங்களையும் நடத்தைகளையும் விவரிக்கிறது. அந்த விமர்சன வலிமையைத் தக்கவைத்தபடியே, மூலத்தில் இல்லாத முழுமையான வகுப்புக் கண்டனத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘வேதபாரகர்’ என்பதற்குப் பதிலாகப் பணியை விளக்கும் ‘திருமறை அறிஞர்கள்’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட பண்புவிவர அமைப்பு தமிழில் வாசிக்கத்தக்க ஒழுங்கில் வைக்கப்பட்டு, எச்சரிக்கைக் கட்டளை இறுதியில் இயல்பாக நிறுத்தப்பட்டுள்ளது.
