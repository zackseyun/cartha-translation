source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் இனியும் இறக்க முடியாது; ஏனெனில், அவர்கள் வானதூதர்களுக்கு ஒப்பானவர்களும் கடவுளின் மகன்களும் ஆவர்[a]; அவர்கள் உயிர்த்தெழுதலின் மகன்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானதூதர்களுக்குச் சமமானவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘கடவுளின் மகன்கள்’ என்றும் ‘உயிர்த்தெழுதலின் மகன்கள்’ என்றும் உள்ளது. இங்குள்ள ஆண்பால் வடிவம் நிலை மற்றும் அடையாளத்தைக் குறிக்கிறது; ஆண்களை மட்டுமே உள்ளடக்குவதாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: இனி சாகவும் முடியாது
  rationale: δύνανται திறன் அல்லது இயலாமையைக் குறிக்கிறது; ἔτι இங்கு மறுபடியும் என்பதைக் காட்டுவதைவிட, மரணம் இனி தொடராது என்ற ‘இனி’ என்னும் பொருளைக் கொடுக்கிறது. οὐδέ-யின் தொடர்ச்சி உணர்வை ‘சாகவும்’ வெளிப்படுத்துகிறது.
- source_word: ἰσάγγελοι
  choice: வானதூதர்களுக்கு ஒப்பானவர்கள்
  rationale: இந்தச் சொல் வானதூதர்களோடு ஒரே அடையாளம் உடையவர்கள் என்று அல்லாமல், அவர்களுக்கு ஒப்பானவர்கள் அல்லது சமமானவர்கள் என்று குறிக்கிறது. ‘ஒப்பானவர்கள்’ இயல்பான தமிழில் அந்த ஒப்பீட்டைத் தெளிவாகப் பேணுகிறது.
- source_word: υἱοί ... θεοῦ
  choice: கடவுளின் மகன்கள்
  rationale: கிரேக்கம் வெளிப்படையாக υἱοί என்ற ஆண்பால் பன்மையைப் பயன்படுத்துகிறது. அடுத்துள்ள ‘உயிர்த்தெழுதலின் மகன்கள்’ என்பதோடு உள்ள சொல்லாட்சித் தொடர்பைப் பேணுவதற்காக ‘மகன்கள்’ தக்கவைக்கப்படுகிறது.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: உயிர்த்தெழுதலின் மகன்களாக இருப்பதால்
  rationale: ‘உயிர்த்தெழுதலின் மகன்கள்’ என்ற மூல உருவகத்தைப் பேணுகிறது. ὄντες என்ற பங்கேற்புவினை இங்கு கடவுளின் மகன்கள் என்று அழைக்கப்படுவதற்கான விளக்கக் காரணத்தையும் சுட்டுவதால், தமிழில் ‘இருப்பதால்’ இயல்பாக உள்ளது.
- source_word: γάρ ... γάρ
  choice: ஏனெனில் ... ;
  rationale: முதல் γάρ முந்தைய கூற்றுக்கான விளக்கத்தைத் தொடங்குவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்படுகிறது. இரண்டாவது γάρ-இன் விளக்கத் தொடர்பு தமிழின் வாக்கிய அமைப்பிலும் அடுத்த கூற்றின் காரணவிளக்கத்திலும் இயல்பாக வெளிப்படுகிறது; அதை மீண்டும் சொற்சொல்லாக மொழிபெயர்ப்பது தேவையற்ற கடினத்தன்மையை உண்டாக்கும்.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் மகன் என்ற உறவுமுறைச் சொல்லை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘கடவுளின் மகன்கள்’ மற்றும் ‘உயிர்த்தெழுதலின் மகன்கள்’ என்று தக்கவைத்தல்
  alternative: ‘கடவுளின் பிள்ளைகள்’ மற்றும் ‘உயிர்த்தெழுதலின் பிள்ளைகள்’
  rationale: υἱοί என்ற சொல் இருமுறை வந்து சொல்லாட்சிச் சமநிலையையும் நிலை/அடையாளத்தையும் வலியுறுத்துகிறது. இதை பாலினப் பொதுமைப்படுத்தி மாற்றாமல் மூல வடிவத்தைப் பேணுகிறோம்; இங்கு ஆண்கள் மட்டுமே குறிக்கப்படவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உயிர்த்தெழுதலின் மகன்கள்’ என்பது அன்றாட வழக்கில் அரிதானதாயினும், மூலத்தின் திட்டமிட்ட உருவகத்தையும் இருமுறை வரும் υἱοί என்ற சொல்லின் ஒத்திசைவையும் காக்கத் தக்கவைக்கப்பட்டுள்ளது.
