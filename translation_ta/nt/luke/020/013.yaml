id: LUK.20.13
reference: Luke 20:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: ta
  text: அப்போது திராட்சைத்தோட்டத்தின் உரிமையாளர்[a], “நான் என்ன செய்வது? என் அன்புக்குரிய மகனை அனுப்புவேன். ஒருவேளை இவனை அவர்கள் மதிப்பார்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு இன்னும் நெருக்கமாக, “திராட்சைத்தோட்டத்தின் எஜமான்” அல்லது “திராட்சைத்தோட்டத்தின் ஆண்டவர்.”
    reason: lexical_alternative
  - marker: b
    text: “மதிப்பார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க வினைச்சொல், “இவனுக்கு முன் வெட்கப்படுவார்கள்” அல்லது “இவனுக்கு மரியாதை காட்டுவார்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின் உரிமையாளர்
  rationale: உவமையின் உடனடி வேளாண்மைச் சூழலில், திராட்சைத்தோட்டத்தை உடைமையாகக் கொண்டவரையே இது குறிக்கிறது. ‘உரிமையாளர்’ என்பது கதையின் இயல்பான பொருளைத் தெளிவாகத் தருகிறது; அதேவேளை ‘ஆண்டவர்’ என்ற இறையியல் பட்டத்தை மொழிபெயர்ப்பே வலிந்து புகுத்துவதைத் தவிர்க்கிறது.
- source_word: Τί ποιήσω;
  choice: நான் என்ன செய்வது?
  rationale: தனக்குள் ஆலோசிக்கும் கேள்வியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. தொடர்ந்து வரும் தீர்மானத்திற்கும் இது பொருந்துகிறது.
- source_word: πέμψω
  choice: அனுப்புவேன்
  rationale: உரிமையாளர் முடிவு செய்த அடுத்த நடவடிக்கையை எதிர்கால வினையாக நேரடியாகக் காட்டுகிறது.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: என் அன்புக்குரிய மகனை
  rationale: υἱός என்பதன் ஆண்பால் குறிப்பை ‘மகன்’ காக்கிறது; ἀγαπητός என்பதன் பாசமும் லூக்காவில் இருக்கக்கூடிய இறைமகன் சார்ந்த எதிரொலியும் ‘அன்புக்குரிய’ என்பதில் இயல்பாக நிலைக்கின்றன.
- source_word: ἴσως
  choice: ஒருவேளை
  rationale: உறுதியைக் கூறாமல் எதிர்பார்ப்பையோ சாத்தியத்தையோ தெரிவிக்கிறது.
- source_word: τοῦτον
  choice: இவனை
  rationale: மகனைச் சுட்டிக்காட்டும் கிரேக்க அண்மைச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழிலும் காக்கிறது.
- source_word: ἐντραπήσονται
  choice: மதிப்பார்கள்
  rationale: இந்தச் சூழலில் ஒருவருக்கு மதிப்போ மரியாதையோ காட்டுதல் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது. வெட்கப்படுதல் அல்லது பணிவுமரியாதை காட்டுதல் என்ற சொல்லியல் நிழல்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: உவமையில் தேவனை உருவகமாகக் குறிக்கக்கூடிய பாத்திரத்துக்கு κύριος பயன்படுத்தப்படுதல்
  choice: உரிமையாளர்
  alternative: திராட்சைத்தோட்டத்தின் எஜமான் அல்லது ஆண்டவர்
  rationale: கதையின் நேரடித் தளத்தில் இவர் சொத்தின் உரிமையாளர். உருவக இறையியல் தொடர்பை வாசகர் உணர இடமளித்தாலும், மொழிபெயர்ப்பு அவருக்கு முன்கூட்டியே ஓர் இறையியல் பட்டத்தை வழங்குவதில்லை.
- issue: ‘அன்புக்குரிய மகன்’ என்பதிலுள்ள கிறிஸ்துவியல் எதிரொலி
  choice: என் அன்புக்குரிய மகனை
  alternative: என் மகனை—அன்புக்குரியவனை
  rationale: கிரேக்கத் தொடரின் உவமை சார்ந்த நேரடிப் பொருளையும், லூக்காவில் இயேசுவின் திருமுழுக்கு மற்றும் தோற்றமாற்ற நிகழ்வுகளை நினைவூட்டக்கூடிய எதிரொலியையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
- issue: ἐντραπήσονται என்பதிலுள்ள மதிப்பு, மரியாதை, வெட்கம் சார்ந்த பொருள் அகலம்
  choice: மதிப்பார்கள்
  alternative: இவனுக்கு முன் வெட்கப்படுவார்கள்; இவனுக்கு மரியாதை காட்டுவார்கள்
  rationale: முதன்மை உரையில் சூழலுக்கேற்ற தெளிவான தமிழைத் தேர்ந்தெடுத்து, கிரேக்கச் சொல்லின் பிற உண்மையான நிழல்களை அடிக்குறிப்பில் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. உரிமையாளர் தனக்குள் கேட்கும் கேள்விக்கு இயல்பான ‘நான் என்ன செய்வது?’ என்பதும், τοῦτον என்பதன் சுட்டு வலிமையைத் தக்கவைக்கும் ‘இவனை’ என்பதும் தேர்ந்தெடுக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
