id: LUK.20.10
reference: Luke 20:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: ta
  text: உரிய காலத்தில், திராட்சைத் தோட்டத்தின் விளைச்சலில் ஒரு பங்கைத் தமக்குக் கொடுக்கும்படி, அவர் திராட்சைத் தோட்டத்தைப் பயிரிடுவோரிடம் ஓர் அடிமையை[a] அனுப்பினார். ஆனால் அவர்கள் அவனை அடித்து, வெறுங்கையுடன்[b] அனுப்பிவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமை’ என்பதற்குப் பதிலாக ‘பணியாள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் இரண்டையும் குறிக்கக்கூடும், ஆனால் இங்கு ‘அடிமை’ என்பது கட்டுப்பட்ட சமூக நிலையைத் தெளிவாகக் காட்டுகிறது.
    reason: alternative_reading
  - marker: b
    text: நேரடியாக, ‘வெறுமையாக’; அதாவது திராட்சைத் தோட்டத்தின் விளைச்சலில் எதையும் பெறாமல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: தக்க காலத்தில்
  rationale: காலத்தைக் குறிக்கும் வேற்றுமையில் வரும் καιρός, ஏற்ற அல்லது உரிய நேரத்தைக் குறிக்கிறது; கிரேக்கம் நேரடியாக ‘அறுவடைக்காலம்’ என்று கூறாததால் அதனை மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: γεωργούς
  choice: திராட்சைத்தோட்டத் தொழிலாளர்கள்
  rationale: γεωργοί என்பது பயிரிடுவோரைக் குறிக்கிறது; ἀμπελών என்ற சூழலால் திராட்சைத்தோட்டம் தெளிவாகிறது. ‘குத்தகைக்காரர்கள்’ எனச் சட்ட உறவைச் சொல்லில் சேர்க்காமல் தவிர்க்கப்பட்டது.
- source_word: δοῦλον
  choice: அடிமை
  rationale: δοῦλος இச்சூழலில் உரிமையாளருக்குக் கட்டுப்பட்ட நிலையைக் குறிக்கிறது; ‘வேலைக்காரன்’ என்று மென்மைப்படுத்தாமல் சமூக நிலையைக் காக்கிறது.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: தமக்குக் கொடுக்கும்படி
  rationale: ἵνα உடன் வரும் வினை அமைப்பு அனுப்பிய நோக்கத்தை வெளிப்படுத்துகிறது; தமிழில் இயல்பாக நோக்கவினையெச்சத்தால் தரப்பட்டது.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின் விளைச்சலில் ஒரு பங்கை
  rationale: ἀπό + உரிமை வேற்றுமை இங்கு விளைச்சலிலிருந்து ஒரு பகுதியைக் குறிக்கிறது. குறிப்பிட்ட சட்டபூர்வ பங்கு அல்லது அளவைச் சேர்க்காமல் பகுதியுணர்வு வெளிப்படுத்தப்பட்டது.
- source_word: ἐξαπέστειλαν
  choice: அனுப்பிவிட்டார்கள்
  rationale: ἐξαποστέλλω என்பது வெளியே அல்லது திருப்பி அனுப்பும் வலிமையைக் கொண்டது; தமிழில் ‘அனுப்பிவிட்டார்கள்’ அந்த நிறைவு மற்றும் அகற்றும் உணர்வைக் காட்டுகிறது.
- source_word: δείραντες
  choice: அடித்து
  rationale: δέρω என்பது அடித்தல் அல்லது தாக்குதலைக் குறிக்கிறது; ‘சவுக்கால் அடித்தல்’ போன்ற தேவையற்ற குறிப்பாக்கம் தவிர்க்கப்பட்டது.
- source_word: κενόν
  choice: வெறுங்கையுடன்
  rationale: κενός என்பதன் நேர்ப்பொருள் ‘வெறுமையான’; இச்சூழலில் எதையும் பெறாமல் அனுப்பப்பட்டதைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர் ‘வெறுங்கையுடன்’.
