revisions:
- from: தக்க காலத்தில், திராட்சைத்தோட்டத்தின் விளைச்சலில் ஒரு பங்கைத் தமக்குக் கொடுக்கும்படி, அவர் திராட்சைத்தோட்டத் தொழிலாளர்களிடம் ஓர் அடிமையை[a] அனுப்பினார். ஆனால் அந்தத் தொழிலாளர்கள் அவனை அடித்து, வெறுங்கையுடன்[b] அனுப்பிவிட்டார்கள்.
  to: உரிய காலத்தில், திராட்சைத் தோட்டத்தின் விளைச்சலில் ஒரு பங்கைத் தமக்குக் கொடுக்கும்படி, அவர் திராட்சைத் தோட்டத்தைப் பயிரிடுவோரிடம் ஓர் அடிமையை[a] அனுப்பினார். ஆனால் அவர்கள் அவனை அடித்து, வெறுங்கையுடன்[b] அனுப்பிவிட்டார்கள்.
  rationale: The revision replaces a potentially misleading term for hired laborers with wording that directly represents vineyard cultivators, without specifying a tenant/legal relationship. It also improves the lexical alternatives in the footnotes while preserving the draft’s faithful rendering of the verse.
