translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் இயல்பும் காக்கப்பட்டுள்ளன. உரிமையாளரைக் குறிக்கும் ஒருமை ஆண்பால் சுட்டுப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டது; தொழிலாளர்களுக்கு சாதாரண பன்மை பயன்படுத்தப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
