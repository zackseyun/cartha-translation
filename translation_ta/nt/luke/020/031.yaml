base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: ta
  text: மூன்றாமவனும் அவளை மணந்துகொண்டான்[a]. அதேபோல், ஏழுபேரும் பிள்ளைகள் எவரையும் விட்டுச்செல்லாமல் இறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளை எடுத்துக்கொண்டான்.” கிரேக்கத்தில் இவ்வாறு உள்ளது; இந்தச் சூழலில் ஒரு பெண்ணை மனைவியாகக் கொள்வதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: மூன்றாமவன்
  rationale: கிரேக்கத்தில் ‘சகோதரன்’ என்பது மீண்டும் சொல்லப்படாமல் ‘மூன்றாமவன்’ என்றே உள்ளது; தமிழிலும் சூழலிலிருந்து பொருள் தெளிவாக இருப்பதால் அந்தச் சுருக்கம் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἔλαβεν αὐτήν
  choice: அவளை ஏற்றுக்கொண்டான்
  rationale: இந்தச் சூழலில் இது அவளை மனைவியாக ஏற்றுக்கொண்டதைக் குறிக்கும். ‘ஏற்றுக்கொண்டான்’ என்பது கிரேக்கச் சொல்லாட்சிக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது; தெளிவான மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὡσαύτως δὲ καὶ
  choice: அவ்வாறே
  rationale: முன்பு கூறப்பட்ட அதே நிகழ்வு தொடர்ந்து மற்றவர்களுக்கும் நடந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οἱ ἑπτὰ
  choice: ஏழுபேரும்
  rationale: குறிப்பிடப்பட்ட ஏழுபேரின் முழுத் தொகுதியையும் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ κατέλιπον τέκνα
  choice: பிள்ளைகள் யாரையும் விட்டுச்செல்லாமல்
  rationale: இறக்கும்போது சந்ததியாகப் பிள்ளைகள் எவரையும் விட்டுச்செல்லவில்லை என்ற καταλείπω என்பதன் நுட்பத்தை இது காக்கிறது.
- source_word: ἀπέθανον
  choice: இறந்தார்கள்
  rationale: கிரேக்க வினையின் நேரடியான, அலங்காரமற்ற பொருளை நவீனத் தமிழில் வழங்குகிறது.
