  text: Ἀκούοντος δὲ παντὸς τοῦ λαοῦ εἶπεν τοῖς ⸀μαθηταῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: ta
  text: 'மக்கள் அனைவரும் கேட்டுக்கொண்டிருக்கையில்[a], அவர் சீடர்களிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் அனைவரும் கேட்டுக்கொண்டிருந்தபோது, அவர் சீடர்களிடம் கூறினார்.” கிரேக்கத்தில், அவர் கூறியதற்கான சூழலைக் குறிக்கும் தனித்த இலக்கண அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: கேட்டுக்கொண்டிருக்கையில்
  rationale: நிகழ்காலப் பெயரெச்சம், அவர் பேசுவதும் மக்கள் கேட்பதும் ஒரே நேரத்தில் நடந்ததைச் சூழலாகக் காட்டுகிறது. தொடர்ந்த செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாகத் தருவதால், ‘மேலும்’ அல்லது ‘ஆனால்’ என்று வெளிப்படையாகச் சேர்ப்பது தேவையற்றது; குறிப்பாக ‘ஆனால்’ தவறான முரண்பாட்டை உருவாக்கும்.
- source_word: παντὸς τοῦ λαοῦ
  choice: மக்கள் அனைவரும்
  rationale: λαός என்பதைக் ‘மக்கள்’ என்றும், πᾶς தரும் முழுமையைக் ‘அனைவரும்’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘கூட்டம்’ என்பது வெறும் திரளைக் குறிக்கும் வாய்ப்புள்ளதால் தவிர்க்கப்பட்டது.
- source_word: εἶπεν
  choice: கூறினார்
  rationale: λέγω என்பதன் இறந்தகாலக் கதை வடிவை நேரடியாகவும் கண்ணியமான நடையிலும் தருகிறது.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களிடம்
  rationale: μαθηταί என்பதற்கான வழக்கமான நற்செய்தி நூல் சொல் ‘சீடர்கள்’. கிரேக்கத்தில் உடைமைச் சொல் இல்லாததால் ‘தமது சீடர்களிடம்’ என்று சேர்க்கப்படவில்லை.
theological_decisions:
- issue: காட்சியில் உரையைக் கேட்போர் மற்றும் நேரடியாக உரையாடப்படுவோர் ஆகியோருக்கிடையிலான வேறுபாடு
  choice: மக்கள் அனைவரும் கேட்டுக்கொண்டிருக்க, அவர் சீடர்களை நேரடியாக நோக்கிக் கூறுகிறார்.
  alternative: அவர் மக்கள் அனைவரிடமும் நேரடியாகக் கூறுகிறார்; அல்லது கூட்டத்திலிருந்து தனியே சீடர்களிடம் பேசுகிறார்.
  rationale: மரபுத்தொடர் அமைப்பு மக்கள் கேட்டுக்கொண்டிருந்த பொதுச் சூழலைக் காட்டுகிறது; τοῖς μαθηταῖς என்பது நேரடியாக உரையாடப்பட்டவர்களை அடையாளப்படுத்துகிறது. மொழிபெயர்ப்பு இரண்டையும் ஒன்றாகக் கலக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதே நேரத்தில் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை. கிரேக்கத்தில் இல்லாத ‘அவருடைய’ என்ற உடைமைச் சொல் சேர்க்கப்படவில்லை.
