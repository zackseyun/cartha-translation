source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: ta
  text: “ஒரு தினாரியத்தை எனக்குக் காட்டுங்கள்.[a] அதில் யாருடைய உருவமும் பொறிப்பும் உள்ளன?” அதற்கு அவர்கள், “சீசருடையவை” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தினாரியம் என்பது அக்காலத்தில் பொதுவாகப் பயன்படுத்தப்பட்ட ஒரு ரோம நாணயம்; வரலாற்றுச் சூழலைப் பாதுகாக்க அதன் பெயர் அப்படியே வைக்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: எனக்குக் காட்டுங்கள்
  rationale: திடமான கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: δηνάριον
  choice: ஒரு தினாரியத்தை
  rationale: பொதுவான ‘நாணயம்’ என்று மாற்றாமல், வரலாற்றுச் சூழலுக்குரிய ரோம நாணயத்தின் குறிப்பிட்ட பெயரைப் பாதுகாக்கிறது.
- source_word: τίνος
  choice: யாருடைய
  rationale: உடைமை அல்லது தொடர்பைக் கேட்கும் கிரேக்க உரையின் இயல்பான தமிழ் இணைச்சொல்.
- source_word: εἰκόνα
  choice: உருவம்
  rationale: நாணயத்தில் காணப்படும் ஒருவரின் தோற்றத்தைக் குறிக்கும் வகையில் இயல்பாகவும், சொல்லின் விரிவான பொருளைச் சுருக்காமலும் உள்ளது.
- source_word: ἐπιγραφήν
  choice: பொறிப்பு
  rationale: நாணயத்தின் மேல் பொறிக்கப்பட்ட எழுத்துகளைக் குறிக்கத் துல்லியமான, எளிதில் புரியும் சொல்.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: அதற்கு அவர்கள் ... என்று பதிலளித்தார்கள்
  rationale: பங்கேற்பெச்சம்-வினை அமைப்பைத் தமிழின் இயல்பான கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: Καίσαρος
  choice: சீசருடையவை
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான உடைமைப் பதிலைப் பாதுகாக்கிறது; உருவம், பொறிப்பு என்ற இரண்டையும் குறிக்கும் வகையில் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கேள்வி மற்றும் பதிலின் சுருக்கமும் வரலாற்றுத் தனித்தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
