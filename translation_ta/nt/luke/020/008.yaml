  naturalness: The wording is clear, idiomatic modern standard Tamil, with a natural direct-speech order and suitable narrative register.
  terminology: “அதிகாரம்” accurately expresses ἐξουσία here as rightful or operative authority, without reducing it to mere power or adding theological interpretation. The alternative footnote is appropriately anchored and stated.
