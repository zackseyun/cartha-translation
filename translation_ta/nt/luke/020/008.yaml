id: LUK.20.8
reference: Luke 20:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “நானும் எந்த அதிகாரத்தால்[a] இவற்றைச் செய்கிறேன் என்று உங்களுக்குச் சொல்லமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த அதிகாரத்துடன்.”
    reason: ἐν ποίᾳ ἐξουσίᾳ என்ற சொற்றொடருக்கான சாத்தியமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Οὐδὲ
  choice: நானும் ... சொல்லமாட்டேன்
  rationale: முந்தைய வசனத்தில் அவர்கள் பதில் சொல்ல மறுத்ததோடு இயேசுவின் மறுப்பை οὐδέ இணைக்கிறது. தமிழில் ‘நானும் ... சொல்லமாட்டேன்’ என்பது அந்த எதிர்வினைத் தொடர்பையும் மறுப்பின் இயல்பான வலிமையையும் தருகிறது.
- source_word: λέγω
  choice: சொல்லமாட்டேன்
  rationale: இங்கு λέγω என்பது தகவலைத் தெரிவிப்பதைக் குறிக்கிறது. எதிர்மறை உரையாடல் சூழலில் ‘சொல்லமாட்டேன்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: இயேசு செயல்படுவதற்கான அடிப்படை அல்லது உரிமையளிக்கும் அதிகாரத்தை இச்சொற்றொடர் குறிக்கிறது. ‘எந்த அதிகாரத்தால்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘எந்த அதிகாரத்துடன்’ என்பதும் சாத்தியம்.
- source_word: ἐξουσίᾳ
  choice: அதிகாரம்
  rationale: இங்கு ἐξουσία வெறும் வல்லமையை அல்ல, செயல்படுவதற்கான உரிமையையும் அதிகாரத்தையும் குறிக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: கிரேக்க மூலத்தின் பன்மையைப் பாதுகாத்து, விவாதிக்கப்பட்ட இயேசுவின் செயல்களைச் சுட்டுகிறது.
- source_word: ποιῶ
  choice: செய்கிறேன்
  rationale: நிகழ்கால வினையை இயல்பான தமிழ் நிகழ்காலமாக வழங்குகிறது.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: இயேசு அவர்களிடம் ... என்றார்
  rationale: தமிழ் நேரடி உரையின் இயல்பான சொல் வரிசையைப் பின்பற்றி, இயேசு அவர்களிடம் கூறியதைத் தெளிவாகத் தருகிறது; καί-ஐ தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது இங்கு தேவையற்றதாக இருக்கும்.
theological_decisions:
- issue: தமது அதிகாரத்தின் மூலத்தைத் தெரிவிக்க இயேசு மறுப்பது
  choice: அவர் பதிலைத் தெரிவிக்கமாட்டார் என்ற நேரடியான மறுப்பாக வழங்கப்பட்டது.
  alternative: அவர் கேள்வியைத் தவிர்ப்பதாகவோ, தலைவர்களின் நம்பிக்கையின்மையை வெளிப்படையாகத் தீர்ப்பதாகவோ மொழிபெயர்ப்பது.
  rationale: வசனம் கூறுவது, இயேசு தாம் எந்த அதிகாரத்தால் இவற்றைச் செய்கிறார் என்பதை அவர்களுக்குச் சொல்ல மறுத்தார் என்பதே. அதற்கான காரணத்தை மொழிபெயர்ப்பில் சேர்க்காமல் உரையின் இறையியல் மற்றும் உரையாடல் சார்ந்த பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் நேரடியான உரையாடல் வலிமையும் காக்கப்பட்டுள்ளன. தேவையற்ற சமயக்குழுச் சொற்கள் அல்லது விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
