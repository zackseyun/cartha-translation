  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: ta
  text: ஆனால் திராட்சைத்தோட்ட உழவர்கள்[a] அவரைக் கண்டதும், ஒருவரோடு ஒருவர் ஆலோசித்து, “இவன்தான் வாரிசு. இவனைக் கொன்றுவிடுவோம்; அதனால் பரம்பரைச் சொத்து நமக்குச் சொந்தமாகும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “குத்தகை உழவர்கள்” அல்லது “விவசாயிகள்.” கிரேக்கச் சொல் வேளாண் பணியாளர்களைக் குறிக்கிறது; இந்த உவமையில் அவர்கள் குறிப்பாக ஒரு திராட்சைத்தோட்டத்தில் வேலை செய்கிறவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: திராட்சைத்தோட்ட உழவர்கள்
  rationale: γεωργοί என்பது வேளாண் பணியில் ஈடுபடுகிறவர்களைக் குறிக்கிறது; உவமையின் உடனடிச் சூழல் திராட்சைத்தோட்டம் என்பதால், பொதுவான ‘விவசாயிகள்’ என்பதைக் காட்டிலும் ‘திராட்சைத்தோட்ட உழவர்கள்’ சூழலைத் தெளிவாகக் காட்டுகிறது. குத்தகை உறவு சுற்றியுள்ள வசனங்களால் தெரிந்தாலும், இச்சொல்லில் தனியே வெளிப்படவில்லை.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: ஒருவரோடு ஒருவர் ஆலோசித்து
  rationale: முழுமையுறா இறந்தகால நடுவினை வடிவம் அவர்கள் தங்களுக்குள் தொடர்ந்து சிந்தித்துப் பேசியதைச் சுட்டுகிறது. ‘ஆலோசித்து’ என்பது கணக்கிட்ட முடிவெடுக்கும் தன்மையை இயல்பான தமிழில் தருகிறது; ‘வாதிட்டனர்’ தேவையற்ற முரண்பாட்டைச் சேர்க்கும்.
- source_word: κληρονόμος
  choice: வாரிசு
  rationale: சட்ட மற்றும் கதைச் சூழல்கள் இரண்டிற்கும் பொருந்தும், சுருக்கமான நவீனத் தமிழ் இணைச்சொல்.
- source_word: ἀποκτείνωμεν
  choice: இவனைக் கொன்றுவிடுவோம்
  rationale: முதல் நபர் பன்மை aorist subjunctive இங்கு தூண்டுதல் அல்லது கூட்டு முன்மொழிவாக வருகிறது. ‘கொலை செய்வோம்’ என்பதைவிட ‘கொன்றுவிடுவோம்’ நேரடியாகவும் இயல்பாகவும் உள்ளது; மூல வினைச்சொல்லில் இல்லாத சட்ட அல்லது ஒழுக்க மதிப்பீட்டைத் தனியே சேர்க்கவில்லை.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: அப்போது பரம்பரைச் சொத்து நமக்குச் சொந்தமாகிவிடும்
  rationale: ἵνα கூறும் நோக்கம் பேச்சாளர்களின் திட்டமிட்ட விளைவாக ‘அப்போது’ என்பதன் மூலம் இயல்பான தமிழில் வெளிப்படுகிறது; γένηται என்பதன் ‘ஆகிவிடுதல்’ நுணுக்கம் ‘சொந்தமாகிவிடும்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதையின் அடுத்த திருப்பத்தில் வரும் மிதமான முரண்பாட்டை ‘ஆனால்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἰδόντες
  choice: கண்டதும்
  rationale: Aorist participle-இன் காலத்தொடர்பை சுருக்கமான, இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: திராட்சைத்தோட்டச் சூழலில் γεωργοὶ என்பதன் மொழிபெயர்ப்பு
  choice: திராட்சைத்தோட்ட உழவர்கள்
  alternative: குத்தகைதாரர்கள்; விவசாயிகள்
  rationale: மூலச்சொல்லின் வேளாண் பொருளுக்கும் உவமையின் திராட்சைத்தோட்டச் சூழலுக்கும் முன்னுரிமை தரப்படுகிறது. இவர்கள் குத்தகை அடிப்படையில் தோட்டத்தைப் பராமரிப்பவர்கள் என்பது பரந்த கதைச் சூழலில் புலப்பட்டாலும், அந்தச் சட்ட உறவை இப்பெயர்ச்சொல் மட்டும் நேரடியாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. நேரடி உரையில் ‘இவன்தான்’ மற்றும் ‘கொன்றுவிடுவோம்’ பயன்படுத்தப்பட்டதால் திட்டத்தின் கடுமையும் வாய்மொழி இயல்பும் நிலைக்கின்றன.
