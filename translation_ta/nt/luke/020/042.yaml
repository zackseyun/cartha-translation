  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: ta
  text: 'ஏனெனில், தாவீது தாமே சங்கீதப் புத்தகத்தில் இவ்வாறு கூறுகிறார்: “ஆண்டவர்[a] என் ஆண்டவரிடம், ‘என் வலப்பக்கத்தில் அமர்ந்திரு’ என்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சங்கீதம் 110:1-ன் எபிரெய உரையைப் பின்பற்றினால், “யாவே என் ஆண்டவரிடம் சொன்னார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: ஏனெனில், தாவீதே
  rationale: γάρ முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. αὐτός தரும் அழுத்தம், ‘தாவீதே’ என்ற ஏகார வடிவால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: மேற்கோள் அறிமுகத்தில் வரும் நிகழ்கால வினை, தமிழ் இலக்கிய வழக்கிற்கு இயல்பாக நிகழ்காலத்திலேயே வைக்கப்பட்டுள்ளது.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: சங்கீதப் புத்தகத்தில்
  rationale: βίβλος என்பதன் ‘புத்தகம்’ என்ற பொருளையும் ψαλμῶν குறிக்கும் சங்கீதத் தொகுப்பையும் இயல்பான தமிழ் நூற்பெயர் வடிவில் தருகிறது.
- source_word: Εἶπεν
  choice: என்றார்
  rationale: மேற்கோளுக்குள் வரும் இறந்தகாலக் கூற்றைத் தமிழில் இயல்பான மேற்கோள் முடிப்பு வடிவில் வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: கிரேக்க κύριος என்பதன் முதன்மைப் பொருளைத் தருகிறது; இங்கு முதலாம் பயன்பாடு தேவனைக் குறிக்கிறது. அடிப்படையான எபிரெய உரையிலுள்ள தெய்வீகப் பெயர் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: τῷ κυρίῳ μου
  choice: என் ஆண்டவரிடம்
  rationale: உடைமைப் பெயருடன் கூடிய வேற்றுமை வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘என் எஜமானரிடம்’ என்பதும் சொற்பொருளில் சாத்தியமானது, ஆனால் இங்கு உள்ள ஆண்டவர்/ஆண்டவர் என்ற பதற்றத்தை அது மங்கச் செய்யும்.
- source_word: Κάθου
  choice: நீர் ... அமர்ந்திரும்
  rationale: கட்டளைப் பொருளைத் தக்கவைத்து, உயர்நிலை அழைப்புக்கு ஏற்ற மரியாதைமிக்க ஒருமை வடிவில் தரப்பட்டுள்ளது.
- source_word: ἐκ δεξιῶν μου
  choice: என் வலப்பக்கத்தில்
  rationale: இந்த கிரேக்கச் சொற்றொடரின் நிலையான இடப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளின் முதல் κύριος, அடிப்படையான எபிரெய சங்கீதம் 110:1-ல் தெய்வீகப் பெயரைக் கொண்டிருப்பது
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: முதன்மை ஆதாரமான கிரேக்க உரையில் κύριος இருப்பதால் முதன்மைப் பனுவல் ‘ஆண்டவர்’ என்று மொழிபெயர்க்கிறது. எபிரெய இடைநூல் தொடர்பு மறையாமல் இருக்க ‘யாவே’ என்ற வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: கிறிஸ்துவைப் பற்றிய வாதத்தில் முக்கியமான இரண்டாம் κύριος
  choice: என் ஆண்டவர்
  alternative: என் எஜமானர்
  rationale: ‘என் ஆண்டவர்’ என்பது கிரேக்கத்தின் பொருளையும் முதல் மற்றும் இரண்டாம் κύριος இடையிலான நோக்கமுள்ள இறையியல் பதற்றத்தையும் காக்கிறது; மேற்கோள் தானாகத் தீர்மானிப்பதைக் கடந்த விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க இலக்கிய நடையைப் பயன்படுத்துகிறது. ‘தாவீதே’ மூலம் மூலத்தின் அழுத்தமும், ‘ஆண்டவர் என் ஆண்டவரிடம்’ மூலம் மேற்கோளின் சொல்விளையாட்டும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
