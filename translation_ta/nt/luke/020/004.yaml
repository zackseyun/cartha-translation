  edition: SBLGNT
  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: ta
  text: யோவானின் திருமுழுக்கு வானத்திலிருந்து வந்ததா[a], அல்லது மனிதர்களிடமிருந்து வந்ததா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளிடமிருந்து.’ கிரேக்கத்தில் சொல்லுக்கு சொல் ‘வானத்திலிருந்து’; இது தெய்வீகத் தோற்றம் அல்லது அதிகாரத்தைக் குறிக்கும் மரியாதைமிக்க பேச்சுவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: யோவானோடு தொடர்புடைய சமயச் சடங்கு/நடைமுறையைக் குறிக்கும் பெயர்ச்சொல். நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய, இயல்பான இணைச்சொல்லாக ‘திருமுழுக்கு’ பயன்படுத்தப்படுகிறது.
- source_word: Ἰωάννου
  choice: யோவானின்
  rationale: உரிமை அல்லது தொடர்பைக் காட்டும் கிரேக்க வேற்றுமையைத் தமிழில் இயல்பான ஆறாம் வேற்றுமையாக வழங்குகிறது.
- source_word: ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: கிரேக்கத்தின் நேரடியான உருவகச் சொல்லாட்சியைப் பாதுகாக்கிறது; இது கடவுளிடமிருந்து வந்த அதிகாரம் அல்லது தோற்றத்தைக் குறிக்கும் மரியாதைமிக்க மறைமுகப் பேச்சாகவும் அமைகிறது.
- source_word: ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: ἀνθρώπων என்பது ஆண்களை மட்டும் குறிக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ஆகவே பாலினத் துல்லியத்துடன் ‘மனிதர்களிடமிருந்து’ என வழங்கப்படுகிறது.
- source_word: ἦν
  choice: வந்ததா
  rationale: கிரேக்கத்தில் இணைப்புவினையுடன் மூலத்தைச் சுட்டும் சொற்றொடர் உள்ளது; தமிழில் மூலத்தைக் கேட்கும் இவ்வமைப்பை ‘வந்ததா’ என்று சொல்வது இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: ἢ
  choice: அல்லது
  rationale: கேள்வியில் முன்வைக்கப்படும் இரு மாற்று வாய்ப்புகளையும் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: யோவானின் திருமுழுக்கு ‘வானத்திலிருந்து’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வானத்திலிருந்து’ என்ற சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: கடவுளிடமிருந்து
  rationale: இச்சொற்றொடர் தெய்வீகத் தோற்றம் அல்லது அதிகாரத்தைக் குறிப்பதாக இருந்தாலும், கிரேக்கம் வெளிப்படையாக ‘வானத்திலிருந்து’ என்கிறது. அந்த மரியாதைமிக்க மறைமுகப் பேச்சையும் அதன் நுட்பத்தையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான கேள்வி நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனிதர்களிடமிருந்து’ என்பது பாலினம் சாராத பொதுமனிதக் குறிப்பைப் பாதுகாக்கிறது.
