    text: அல்லது, ‘கடவுளிடமிருந்து.’ கிரேக்கத்தில் சொல்லுக்கு சொல் ‘வானத்திலிருந்து’; இது தெய்வீகத் தோற்றம் அல்லது அதிகாரத்தைக் குறிக்கும் மரியாதைமிக்க பேச்சுவழக்கு.
    reason: lexical_alternative
