source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: ta
  text: ஆனால், ‘மனிதர்களிடமிருந்து’ என்று நாம் சொன்னால், மக்கள் அனைவரும் நம்மீது கல்லெறிவார்கள்; ஏனெனில், யோவான் ஒரு தீர்க்கதரிசி என்று அவர்கள் உறுதியாக நம்புகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: ஆனால், … என்று நாம் சொன்னால்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் தோற்றமுடைய துணைவினை வடிவம் ஒரு சாத்திய நிபந்தனையை அறிமுகப்படுத்துகிறது; δέ-யின் எதிர்மறைத் தொடர்ச்சியை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: முந்தைய வசனத்தில் கேட்கப்பட்ட யோவானின் திருமுழுக்கின் மூலத்தைச் சுட்டும் சுருக்கமான, விடுபட்ட சொற்றொடர். ‘மனிதத் தோற்றமுடையது’ என்று விளக்கமாக விரிக்காமல், மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: ὁ λαὸς ἅπας
  choice: மக்கள் அனைவரும்
  rationale: λαός குறிக்கும் கூட்டு மக்களையும் ἅπας தரும் முழுமை வலியுறுத்தலையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταλιθάσει ἡμᾶς
  choice: நம்மீது கல்லெறிவார்கள்
  rationale: கற்களால் தாக்குதல் நடத்துவதைத் துல்லியமாகக் கூறுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கொன்றுவிடுவார்கள்’ என்ற விளைவைச் சேர்க்கவில்லை.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: ஏனெனில், … அவர்கள் உறுதியாக நம்புகிறார்கள்
  rationale: ஒருமை வடிவம் முழு மக்களையும் கூட்டாகக் குறிக்கிறது. தமிழில் ‘அவர்கள்’ என்ற பன்மைச் சுட்டும் ‘உறுதியாக நம்புகிறார்கள்’ என்பதும் இயல்பானவை.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: யோவான் ஒரு தீர்க்கதரிசி என்று
  rationale: தமிழின் மேற்கோள் அமைப்பு, யோவானைப் பற்றிய மக்களின் உறுதியான மதிப்பீட்டை இயல்பாகத் தருவதோடு, εἶναι-யை கட்டாயமாக இறந்தகாலமாகவோ நிகழ்காலமாகவோ வெளிப்படுத்தாமல் அதன் காலத் தெளிவின்மையைக் காக்கிறது.
theological_decisions:
- issue: யோவானைப் பற்றிய மக்களின் மதிப்பீட்டின் காலக் குறிப்பு
  choice: யோவான் ஒரு தீர்க்கதரிசி என்று
  alternative: யோவான் ஒரு தீர்க்கதரிசியாக இருந்தார் என்று / யோவான் ஒரு தீர்க்கதரிசியாக இருக்கிறார் என்று
  rationale: கிரேக்க εἶναι என்பது இங்கு காலத்தைத் தனியே நிர்ணயிப்பதில்லை. தமிழில் ‘ஒரு தீர்க்கதரிசி என்று’ என்பது இயல்பாகவும் காலத்தைத் தீர்மானிக்காமலும் இருப்பதால், மக்களின் நம்பிக்கையை இறந்தகாலத்திற்கோ நிகழ்காலத்திற்கோ தேவையின்றி வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. சூழலில் நிரப்பப்படும் ‘மனிதர்களிடமிருந்து’ என்ற விடுபட்ட சொற்றொடர் திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
