source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: ta
  text: அவன் வந்து இந்தக் குத்தகை விவசாயிகளை[a] அழித்து, திராட்சைத்தோட்டத்தை மற்றவர்களுக்குக் கொடுப்பான்.” இதைக் கேட்டவர்கள், “அப்படி ஒருபோதும் நடக்காதிருக்கட்டும்![b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “விவசாயிகள்” அல்லது “குத்தகைதாரர்கள்”; கிரேக்கச் சொல் பிறருக்குச் சொந்தமான நிலத்தைப் பயிரிட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது “அப்படி நடக்கவே கூடாது!” அல்லது “நிச்சயமாக இல்லை!”; இது வலுவான நிராகரிப்பைக் காட்டும் கிரேக்கச் சொற்றொடர். சொல்லுக்குச் சொல்: “அது நடக்காதிருப்பதாக.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: அவன் வந்து
  rationale: எதிர்காலச் செயலைத் தமிழில் இயல்பாகத் தொடர்வினை அமைப்பில் காட்டுகிறது; ‘திரும்பி’ என்ற மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: ἀπολέσει
  choice: அழித்து
  rationale: தீர்ப்பின் கடுமையைத் தக்கவைக்கும் அதேவேளையில், ‘கொன்றுவிடுவான்’ என்று பொருளைத் தேவையின்றிக் குறுக்காமல் ἀπόλλυμι என்பதன் விரிவைச் சுமக்கிறது.
- source_word: γεωργοὺς
  choice: குத்தகை விவசாயிகளை
  rationale: பிறருக்குச் சொந்தமான திராட்சைத்தோட்டத்தைப் பொறுப்பேற்று பயிரிட்டவர்களைக் குறிக்கும் சூழல்சார் சமூகப் பங்கை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τούτους
  choice: இந்த
  rationale: பேசப்பட்டுக்கொண்டிருக்கும் குறிப்பிட்ட குத்தகை விவசாயிகளைச் சுட்டும் கிரேக்க அண்மைச் சுட்டின் வலிமையைப் பாதுகாக்கிறது.
- source_word: δώσει
  choice: கொடுப்பான்
  rationale: δίδωμι என்பதன் எளிய பொருளைத் தக்கவைத்து, பொறுப்பு மாற்றம் போன்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: τὸν ἀμπελῶνα
  choice: திராட்சைத்தோட்டத்தை
  rationale: உவமையின் விவசாயப் படிமத்தையும் அதன் வேதாகமப் பின்னொலியையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἄλλοις
  choice: மற்றவர்களுக்குக்
  rationale: யார் என்பதை மூலத்தைப் போலவே குறிப்பிடாமல் விட்டு, பிறரிடம் மாற்றிக் கொடுப்பதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: இதைக் கேட்டவர்கள் … என்றார்கள்
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் காலத் தொடர்பை இயல்பான நவீனத் தமிழ் வாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: Μὴ γένοιτο
  choice: அப்படி நடக்கவே கூடாது!
  rationale: வெறும் மறுப்பாக அல்லாமல், அதிர்ச்சியுடனான வலுவான வேண்டுதல் சார்ந்த நிராகரிப்பாக உள்ள கிரேக்க optative சொற்றொடரின் விசையைத் தமிழில் இயல்பாகக் கொடுக்கிறது.
theological_decisions:
- issue: Μὴ γένοιτο என்ற கூட்டத்தின் பதிலின் வலிமை
  choice: “அப்படி நடக்கவே கூடாது!” என்ற விருப்பம் கலந்த வலுவான நிராகரிப்பு
  alternative: “நிச்சயமாக இல்லை!” அல்லது “ஒருபோதும் அப்படி ஆகாதிருப்பதாக!”
  rationale: இங்கு இது தர்க்கரீதியான மறுப்பை மட்டும் அல்லாமல் அறிவிக்கப்பட்ட தீர்ப்பை அதிர்ச்சியுடன் நிராகரிப்பதைக் காட்டுகிறது. மொழிபெயர்ப்பு அந்த நாடகத் தன்மையையும் விருப்பநிலையையும் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான உரைநடையிலும் மொழிபெயர்க்கப்பட்டது. உவமையின் சுருக்கமும் தீர்ப்பின் கடுமையும் கேட்போரின் அதிர்ச்சியும் தக்கவைக்கப்பட்டுள்ளன.
