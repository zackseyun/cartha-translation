source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: ta
  text: மறைநூல் அறிஞர்களும் தலைமைக் குருக்களும் அந்த நேரத்திலேயே அவரைப் பிடிக்க[a] முயன்றார்கள். ஆனால் அவர்கள் மக்களுக்குப் பயந்தார்கள். ஏனெனில், அவர் இந்த உவமையைத் தங்களுக்கு எதிராகச் சொன்னார்[b] என்பதை அவர்கள் அறிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவர்மேல் கைகளை வைக்க.’ அல்லது, ‘அவரைப் பிடிக்க’ அல்லது ‘அவரைக் கைது செய்ய.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்களிடம் சொன்னார்.’ சூழலில், அந்த உவமை தங்களையே குறிவைத்தது என்று அவர்கள் உணர்ந்தார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: முயன்றார்கள்
  rationale: இறந்தகால வினை அவர்களுடைய நோக்கத்தையும் முயற்சியையும் சுருக்கமாகக் கூறுகிறது; அவர்கள் வெற்றி பெற்றதாகக் காட்டாமல் இயல்பான தமிழில் தருகிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: அக்காலத்தில் வேதநூல்களிலும் சட்டத்திலும் தேர்ச்சி பெற்ற தனித்த சமூகக் குழுவை, பழமையான சொல்லாட்சியின்றி நவீன வாசகருக்குப் புரியும்படி குறிக்கிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: இப்பன்மை ஒரே நேரத்தில் பதவியிலிருந்த பல தலைமைக்குருக்களைக் குறிக்காமல், தலைமைக்குருத்துவ வட்டாரத்தைச் சுட்டுகிறது.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: அவரைப் பிடிக்க
  rationale: கிரேக்கச் சொற்றொடர் பகைமையுடன் ஒருவர்மேல் கைகளை வைப்பதைக் குறிக்கும் மரபுத்தொடர். சூழலில் இயல்பான தமிழாக ‘பிடிக்க’ எனத் தரப்பட்டு, சொல்லுக்கு நெருக்கமான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: அந்த நேரத்திலேயே
  rationale: அதே சந்தர்ப்பத்தில் உடனடியாகச் செயல்பட விரும்பியதை வலியுறுத்தும் கிரேக்கக் கூறை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: அவர்கள் மக்களுக்குப் பயந்தார்கள்
  rationale: λαός இங்கு கூடியிருந்த கூட்டத்தை மட்டும் அல்லாமல் பொதுமக்களைக் குறிக்கிறது; நேரடியான பயத்தையும் சமூக எதிர்வினை குறித்த அச்சத்தையும் திறந்தவாறு வைக்கிறது.
- source_word: ἔγνωσαν
  choice: அறிந்திருந்தார்கள்
  rationale: உவமையின் குறி தாங்களே என்பதை அவர்கள் புரிந்துகொண்ட நிலையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτοὺς
  choice: தங்களுக்கு எதிராக
  rationale: சூழலில் உவமை அவர்களை நோக்கிக் கண்டனம் செய்வதாக அவர்கள் உணர்ந்த எதிர்மறை வலிமையைத் தருகிறது; ‘தங்களிடம்’ என்ற சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παραβολὴν
  choice: உவமை
  rationale: நற்செய்தி இலக்கியத்தில் παραβολή என்பதற்கான நிலைபெற்ற, தெளிவான தமிழ் சொல்.
theological_decisions:
- issue: 'πρὸς αὐτοὺς என்பதன் பொருள்: உவமை அவர்களுக்கு எதிராகச் சொல்லப்பட்டதா அல்லது அவர்களிடம் சொல்லப்பட்டதா?'
  choice: தங்களுக்கு எதிராக
  alternative: தங்களிடம்
  rationale: முந்தைய உவமையில் கண்டிக்கப்படும் குத்தகைக்காரர்கள் தங்களையே குறிக்கிறார்கள் என்று தலைவர்கள் உணர்ந்ததால் ஏற்பட்ட பகைமையான எதிர்வினையைச் சூழல் காட்டுகிறது. இருப்பினும் πρός என்பதன் மேலும் நேரடியான ‘அவர்களிடம்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘வேதபாரகர்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘வேத அறிஞர்கள்’ பயன்படுத்தப்பட்டது. கிரேக்க மரபுத்தொடரின் உருவகமும் πρός என்பதிலுள்ள பொருள் நுட்பமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
