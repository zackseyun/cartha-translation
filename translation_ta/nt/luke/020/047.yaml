id: LUK.20.47
reference: Luke 20:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: ta
  text: விதவைகளின் வீடுகளை[a] விழுங்கி, பாசாங்குக்காக[b] நீண்ட நேரம் ஜெபிக்கிற இவர்கள் இன்னும் கடுமையான தீர்ப்பைப்[c] பெறுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீடுகள்” என்பது இங்கு அவர்களுடைய உடைமைகள் அல்லது வாழ்வாதாரத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு சாக்காக” அல்லது “வெளித்தோற்றத்திற்காக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இன்னும் கடுமையான தண்டனைத் தீர்ப்பை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: விழுங்கி
  rationale: இது சொல்லர்த்தமான உண்பதைக் குறிக்காமல், இரக்கமின்றிச் சுரண்டுவதை உருவகமாகக் குறிக்கிறது. ‘விழுங்கி’ என்பது மூலத்தின் தீவிரமான கண்டனத் தொனியைத் தக்கவைக்கிறது.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: விதவைகளின் வீடுகளை
  rationale: ‘வீடுகள்’ என்பது οἰκίας என்பதன் நேரடியான பொருள். சூழலில் அது அவர்களுடைய உடைமைகள் அல்லது குடும்ப வாழ்வாதாரத்தைக் குறிப்பதாக இருக்கலாம்; அந்த விரிவை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: προφάσει
  choice: பாசாங்குக்காக
  rationale: நீண்ட ஜெபம் உண்மையான பக்தியால் அல்லாமல் பொய்யான வெளித்தோற்றத்திற்காக அல்லது ஒரு சாக்காகச் செய்யப்படுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: μακρὰ προσεύχονται
  choice: நீண்ட நேரம் ஜெபிக்கிற
  rationale: μακρά என்பது இங்கு வினையடைபோல் இருந்து ஜெபத்தின் நீண்ட கால அளவைக் குறிக்கிறது.
- source_word: λήμψονται
  choice: பெறுவார்கள்
  rationale: எதிர்காலத்தில் தெய்வீக நீதித்தீர்ப்பின் விளைவாக ஒன்றைப் பெறுவார்கள் என்ற பொருளை நேரடியாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: περισσότερον κρίμα
  choice: இன்னும் கடுமையான தீர்ப்பு
  rationale: περισσότερον காட்டும் ஒப்பீட்டையும் κρίμα என்பதன் நீதித்தீர்ப்பு சார்ந்த பொருள் விரிவையும் தக்கவைக்கிறது; சூழல் அது எதிர்மறையான தீர்ப்பு என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: கρίμα என்பதன் தன்மை
  choice: தீர்ப்பு
  alternative: தண்டனைத் தீர்ப்பு / கண்டனத் தீர்ப்பு
  rationale: இங்கு அது குற்றத்திற்குரிய எதிர்மறையான இறைத் தீர்ப்பைக் குறித்தாலும், ‘தீர்ப்பு’ என்பது கிரேக்கச் சொல்லின் பொருள் விரிவை தேவையின்றி சுருக்காமல் பாதுகாக்கிறது.
- issue: περισσότερον என்பதன் ஒப்பீட்டு வலிமை
  choice: இன்னும் கடுமையான
  alternative: அதிகமான / மிகக் கடுமையான
  rationale: இது மற்றவர்களைவிட அதிகக் கடுமையுள்ள தீர்ப்பைக் குறிக்கும் ஒப்பீட்டு வடிவம்; ‘இன்னும் கடுமையான’ அந்த ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்புச் சொற்றொடர் தமிழில் இயல்பாக ஒருங்கிணைக்கப்பட்டு, οὗτοι என்பதன் சுட்டுவலிமை ‘இவர்கள்’ மூலம் காக்கப்பட்டுள்ளது.
