  rationale: அவருடைய பதிலால் ஏற்பட்ட ஆச்சரியத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀποκρίσει
  choice: பதில்
  rationale: விவாதச் சூழலில் இயேசு அளித்த மறுமொழியைக் குறிக்கும் நேரடியான தமிழ்ச் சொல்.
- source_word: ἐσίγησαν
  choice: மௌனமாகிவிட்டார்கள்
  rationale: அவர்கள் பேசாமல் இருந்த நிலையை மட்டும் அல்லாமல், பதிலைக் கேட்டபின் மௌனமான மாற்றத்தையும் அஓரிஸ்ட் வினைக்கேற்ப உணர்த்துகிறது.
