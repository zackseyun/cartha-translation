  rationale: ‘மக்களுக்கு முன்பாக/அவர்களுடைய முன்னிலையில்’ என்ற பொருளை இயல்பாகத் தருகிறது; λαός என்பதற்கு ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: θαυμάσαντες
