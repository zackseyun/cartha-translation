  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: ta
  text: மக்கள் முன்னிலையில் அவர் சொன்னதை வைத்து அவரைப் பிடிக்க அவர்களால் முடியவில்லை[a]. அவருடைய பதிலைக் கண்டு வியந்த அவர்கள் மௌனமானார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் சொன்ன வார்த்தையைப் பற்றிக்கொள்ள.’
    reason: ἐπιλαβέσθαι τοῦ ῥήματος என்பது சொற்படியாக ஒரு சொல்லை அல்லது கூற்றைப் பற்றிக்கொள்ளுதல் என்ற உருவகத்தைக் கொண்டுள்ளது; இச்சூழலில் அவர் சொன்னதை ஆதாரமாகக் கொண்டு அவரைச் சிக்கவைக்க முயல்வதைக் குறிக்கிறது.
