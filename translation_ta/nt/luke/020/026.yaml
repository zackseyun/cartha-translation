- source_word: ἐπιλαβέσθαι
  choice: பற்றிக்கொள்ள
  rationale: ‘பிடித்துக்கொள்ளுதல்/பற்றிக்கொள்ளுதல்’ என்ற கிரேக்க உருவகத்தைத் தக்கவைத்தபடியே, அவருடைய பேச்சை அவருக்கு எதிராகப் பயன்படுத்த முயன்ற சூழலையும் உணர்த்துகிறது.
- source_word: τοῦ ῥήματος
  choice: அவர் சொன்ன பேச்சை
  rationale: ῥῆμα இங்கு இறையியல் பொருளுள்ள ‘வார்த்தை’ அல்ல, வாயால் சொல்லப்பட்ட கூற்றைக் குறிக்கிறது; ‘அவர்’ என்பது சூழலிலிருந்து தெளிவாகிறது.
- source_word: ἐναντίον τοῦ λαοῦ
