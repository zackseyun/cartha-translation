reference: Luke 20:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: ta
  text: அவர்கள், “போதகரே, ஒருவனுடைய சகோதரன் மனைவியைக் கொண்டவனாய் இறந்து[a], அவன் பிள்ளையில்லாதவனாய் இருந்தால், அவனுடைய சகோதரன் அந்த மனைவியை மனைவியாக ஏற்றுக்கொண்டு, இறந்துபோன தன் சகோதரனுக்காக வழித்தோன்றலை ஏற்படுத்த வேண்டும்[b] என்று மோசே நமக்காக எழுதியிருக்கிறார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனைவியை விட்டுவிட்டு இறந்தால்”; கிரேக்கத்தில் சொல்லுக்குச் சொல், “மனைவியைக் கொண்டவனாய் இறந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: “வழித்தோன்றலை ஏற்படுத்த” என்பது உபாகமம் 25:5-இன் சட்டச் சொல்லாடலை எதிரொலிக்கிறது; இறந்த சகோதரனுக்காக வழித்தோன்றலை ஏற்படுத்துதல். சொல்லுக்குச் சொல், “விதையை எழுப்புதல்.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையான விளிப்பாகவும், நவீனத் தமிழில் இயல்பாகவும் உள்ளது; அதிகாரத் தலைவர் என்ற கூடுதல் பொருளைத் தவிர்க்கிறது.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: மோசே நமக்காக எழுதிவைத்திருக்கிறார்
  rationale: ἡμῖν என்பது நேரடியாகக் கடிதம் எழுதப்பட்டதைக் காட்டாமல், இஸ்ரவேலருக்காக வழங்கப்பட்ட சட்டத்தின் பொருத்தத்தைக் குறிக்கிறது. ‘எழுதிவைத்திருக்கிறார்’ என்பது முன்பு எழுதப்பட்ட விதி இப்போது மேற்கோள் காட்டப்படுவதை இயல்பாக உணர்த்துகிறது.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ஒருவனுடைய சகோதரன் ... இறந்து
  rationale: τινος என்பதன் குறிப்பிடப்படாத, பொதுவான ஒருமைத் தன்மையைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔχων γυναῖκα
  choice: மனைவியுள்ளவனாக
  rationale: கிரேக்கப் பங்கேற்புச் சொல்லின் நேரடிப் பொருளான ‘மனைவியைக் கொண்டவனாக’ என்பதை இயல்பான தமிழில் தருகிறது; ‘மனைவியை விட்டுவிட்டு’ என்ற விளக்கமான வாசிப்பை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: பிள்ளையில்லாதவனாக இருந்தால்
  rationale: οὗτος முன்னர் குறிப்பிடப்பட்டு இறந்த சகோதரனையே சுட்டுகிறது. ἄτεκνος என்பதன் பாலினம் குறிப்பிடாத பொருளை ‘பிள்ளையில்லாதவன்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: அவனுடைய சகோதரன் அந்த மனைவியை ஏற்றுக்கொண்டு ... வேண்டும்
  rationale: சட்டத்தில் விதிக்கப்பட்ட நோக்கத்தையும் கடமையையும் ‘வேண்டும்’ தெளிவாக்குகிறது. ‘ஏற்றுக்கொண்டு’ என்பது λάβῃ-ஐப் பிரதிபலிக்கிறது; ‘திருமணம் செய்துகொண்டு’ என்ற வெளிப்படையான விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: சந்ததியை உருவாக்க வேண்டும்
  rationale: இறந்த சகோதரனுக்கென வழித்தோன்றலை ஏற்படுத்தும் சட்ட மரபை நவீன வாசகருக்குப் புரியும் தமிழில் தருகிறது; ‘விதையை எழுப்புதல்’ என்ற சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: இறந்துபோன தன் சகோதரனுக்காக
  rationale: இங்கு சகோதரன் என்பது விதவையை ஏற்றுக்கொள்ளும் உயிருள்ள சகோதரன் அல்ல, இறந்த சகோதரன் என்பதைத் தமிழில் குழப்பமின்றித் தெளிவாக்குகிறது; dative-இன் நன்மை/சார்பு பொருளை ‘-க்காக’ காட்டுகிறது.
theological_decisions:
- issue: லேவிரேட் திருமணச் சட்ட மொழியைப் பிற்காலக் கோட்பாட்டு அல்லது பண்பாட்டு விளக்கங்களின்றி மொழிபெயர்த்தல்
  choice: ‘அந்த மனைவியை ஏற்றுக்கொண்டு, இறந்துபோன தன் சகோதரனுக்காகச் சந்ததியை உருவாக்க வேண்டும்’ என்ற நேரடியான சட்ட மொழி
  alternative: ‘அந்த விதவையைத் திருமணம் செய்து, இறந்த சகோதரனின் பெயரில் பிள்ளைகளைப் பெற வேண்டும்’
  rationale: மாற்று வாசிப்பு நடைமுறையை விளக்கினாலும், மூலத்தில் இல்லாத ‘விதவை,’ ‘திருமணம்,’ ‘பெயரில்’ ஆகியவற்றை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கிறது. தேர்ந்தெடுக்கப்பட்ட வாசிப்பு உபாகமம் 25:5-ன் சட்டப் பின்னணியையும் மூலத்தின் உருவகச் சொல்லாடலையும் அளவுக்கு மீறி விளக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் மோசேயின் சட்டத்தை மேற்கோள் காட்டுவதால் மிதமான சட்டத் தொனி பேணப்பட்டுள்ளது. ‘போதகரே,’ ‘எழுதிவைத்திருக்கிறார்,’ ‘ஏற்றுக்கொண்டு’ ஆகியவை இயல்பான நடையையும் மூலத்துடனான நெருக்கத்தையும் இணைக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் பொருத்தமான சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
