  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: ta
  text: ஆனால், அந்தக் காலத்தையும்[b] இறந்தோரிலிருந்து உயிர்த்தெழுதலையும் அடையத் தகுதியுள்ளவர்களாகக் கருதப்பட்டவர்கள்[a] திருமணம் செய்துகொள்வதுமில்லை, திருமணம் செய்து வைக்கப்படுவதுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: ‘தகுதியுள்ளவர்கள் என்று எண்ணப்பட்டவர்கள்’ அல்லது ‘தகுதியானவர்கள் என்று மதிப்பிடப்பட்டவர்கள்.’ கிரேக்கத்தில் இது இறப்பாட்டு வடிவில் உள்ளது; அவர்கள் தகுதியுள்ளவர்களாகத் தீர்மானிக்கப்படுவதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறுவிதமாக: ‘வரவிருக்கும் காலம்.’ சொல்லர்த்தமாக: ‘அந்தக் காலம்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: தகுதியுள்ளவர்களாகக் கருதப்படுகிறவர்கள்
  rationale: கிரேக்கச் சொல்லின் இறப்பாட்டு வடிவம், அவர்கள் தங்களிலேயே தகுதியுடையவர்கள் என்று கூறாமல், தகுதியுள்ளவர்களாக மதிப்பிடப்படுகிறார்கள் என்பதைக் காட்டுகிறது.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: அந்தக் காலம்
  rationale: αἰών இங்கு தற்போதைய காலத்துக்கு மாறான ஓர் எதிர்காலக் காலக்கட்டத்தைக் குறிக்கிறது. ‘அந்தக் காலம்’ என்பது கிரேக்கச் சுட்டுப்பெயரை நேரடியாகப் பேணுவதோடு, விளக்கத்தை மூலவாக்கியத்தைவிட அதிகமாக்குவதையும் தவிர்க்கிறது.
- source_word: τυχεῖν
  choice: அடைய
  rationale: இச்சூழலில் τυγχάνω என்பது ஒன்றைப் பெறுதல் அல்லது அதில் பங்குபெறும் நிலையை அடைதல் என்ற பொருளைக் கொண்டது; ஒரே வினைச்சொல் ‘அந்தக் காலம்’ மற்றும் ‘உயிர்த்தெழுதல்’ ஆகிய இரண்டுடனும் இயல்பாக இணைகிறது.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து உயிர்த்தெழுதல்
  rationale: ἐκ என்பதன் ‘இலிருந்து’ என்ற பொருளையும், ἀνάστασις என்பதன் உயிர்த்தெழுதல் என்ற பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: γαμοῦσιν
  choice: திருமணம் செய்துகொள்வதும் இல்லை
  rationale: γαμέω என்பதன் பொதுவான ‘திருமணம் செய்துகொள்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: γαμίζονται
  choice: திருமணம் செய்துகொடுக்கப்படுவதும் இல்லை
  rationale: முந்தைய வினையிலிருந்து வேறுபட்டுள்ள இறப்பாட்டு வடிவத்தையும், ஒருவரைத் திருமணம் செய்துகொடுக்கும் அக்காலச் சமூக வழக்கையும் மொழிபெயர்ப்பு பேணுகிறது.
theological_decisions:
- issue: καταξιωθέντες என்பது உயிர்த்தெழுதல் வாழ்வை மனிதர்கள் தங்கள் சொந்தத் தகுதியால் சம்பாதிப்பதாகக் குறிக்கிறதா?
  choice: ‘தகுதியுள்ளவர்களாகக் கருதப்படுகிறவர்கள்’ என்று இறப்பாட்டு மதிப்பீடாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘அந்தக் காலத்திற்குத் தகுதியானவர்கள்’
  rationale: தேர்ந்தெடுக்கப்பட்ட வாசகம், தகுதி குறித்து ஒரு மதிப்பீடு நடைபெறுகிறது என்பதைப் பேணுகிறது; அதேவேளையில், அது மனிதரின் உள்ளார்ந்த புண்ணியத்தையோ சம்பாதித்த உரிமையையோ வெளிப்படையாகக் கூறுவதாக மாற்றவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘திருமணம் செய்துகொள் / திருமணம் செய்துகொடுக்கப்படு’ என்ற இணை அமைப்பு கிரேக்கத்தின் செயப்பாட்டு–இறப்பாட்டு வேறுபாட்டைப் பேணுகிறது.
