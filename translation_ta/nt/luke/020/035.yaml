  source_fidelity: 'வரைவின் பொருள் கிரேக்க மூலத்துக்கு நெருக்கமாக உள்ளது: ‘அந்தக் காலம்,’ ‘இறந்தோரிலிருந்து உயிர்த்தெழுதல்,’ மற்றும் திருமணம் செய்தல்/திருமணம் செய்து வைக்கப்படுதல் என்ற வேறுபாடு அனைத்தும் காக்கப்பட்டுள்ளன. ஆனால் καταξιωθέντες என்பது இறப்பாட்டு அஓரிஸ்ட் பெயரெச்சம் என்பதால், நிகழ்கால ‘கருதப்படுகிறவர்கள்’ என்பதற்குப் பதில் ‘கருதப்பட்டவர்கள்’ என்பது மூலத்தின் மதிப்பீட்டு நிகழ்வைச் சற்றுத் துல்லியமாகக் காட்டுகிறது.'
  naturalness: ‘திருமணம் செய்துகொடுக்கப்படுதல்’ என்பது நவீனத் தமிழில் சற்று செயற்கையாகவும் தெளிவின்மையுடனும் ஒலிக்கலாம். ‘திருமணம் செய்து வைக்கப்படுதல்’ என்பது பொதுவழக்கில் இயல்பாக இருந்து, அக்கால சமூகச் சூழலில் உள்ள passive வேறுபாட்டையும் போதுமான அளவு காட்டுகிறது. இணைப்புச் சொற்கள் இல்லாத இணை மறுப்புக்கு ‘...துமில்லை, ...துமில்லை’ என்ற அமைப்பு ஓட்டமாக உள்ளது.
