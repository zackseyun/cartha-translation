  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: ta
  text: தாவீது அவரை ‘ஆண்டவர்’ என்று அழைக்கிறாரே; அப்படியானால் அவர் எப்படி தாவீதின் மகன்[a] ஆகிறார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழித்தோன்றல்.’ கிரேக்க மூலத்தில் ‘மகன்’ என்று உள்ளது. இந்தச் சொல் அரசகுல வழிவந்தவரையும் குறிக்கக்கூடும்; ஆனால் வாதத்தின் வெளிப்படையான சொல்வடிவத்தை முதன்மை உரை பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்; கிரேக்கப் பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய மேற்கோளிலிருந்து எழும் முடிவையும் தொடர்ந்து வரும் வினாவின் தர்க்கத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτὸν κύριον
  choice: அவரை ‘ஆண்டவர்’ என்று
  rationale: αὐτόν என்பதைக் மரியாதை ஒருமையான ‘அவரை’ என்றும் κύριος என்பதைக் அதன் பட்டப்பெயர்சார் கனத்தைப் பாதுகாக்கும் ‘ஆண்டவர்’ என்றும் வழங்குகிறது.
- source_word: καλεῖ
  choice: அழைக்கிறாரே
  rationale: நிகழ்கால வினையைப் பாதுகாப்பதோடு, அதிலிருந்து எழும் அடுத்த வினாவுக்கான வியப்பும் வலியுறுத்தலும் தமிழில் இயல்பாகத் தொடர உதவுகிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: ரெட்டோரிக்கான வினாவை எளிய, இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: αὐτοῦ υἱός
  choice: தாவீதின் மகன்
  rationale: கிரேக்கத்தின் ‘அவருடைய மகன்’ என்ற வெளிப்படையான உறவுச் சொல்லைத் தெளிவான தமிழில் தருகிறது; சூழலில் αὐτοῦ தாவீதைக் குறிப்பதால் பெயர் மீண்டும் பயன்படுத்தப்படுகிறது.
- source_word: ἐστιν
  choice: ஆகிறார்
  rationale: அடையாளம் அல்லது உறவுநிலையைச் சுட்டும் ἐστιν என்பதற்கு, நபரைப் பற்றிய இந்த வினாவில் இயல்பான தமிழ்ச் சொற்றொடரை அளிக்கிறது.
theological_decisions:
- issue: மேசியாவைப் பற்றிய வாதத்தில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ‘ஆண்டவர்’ என்பது உயர்நிலையையும் மரியாதையையும் தக்கவைக்கிறது; அதேவேளையில் வசனத்தின் சொற்களைத் தாண்டி கிறிஸ்தியல் முடிவை விரிவாக்கவில்லை.
- issue: υἱός என்பதைக் குலவழிப் பொருளாக விரிவாக்க வேண்டுமா
  choice: மகன்
  alternative: வழித்தோன்றல்
  rationale: வாதத்தின் பதற்றம் வெளிப்படையான ‘மகன்’ என்ற சொல்லைச் சார்ந்துள்ளது. அரசகுல அல்லது மரபுவழிச் சூழலில் அது வழித்தோன்றலைக் குறிக்கக்கூடியதாயினும், முதன்மை உரையில் ‘மகன்’ என்பதே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அழைக்கிறாரே’ என்ற வடிவம் முந்தைய சங்கீத மேற்கோளிலிருந்து எழும் ரெட்டோரிக்கான வினாவை இயல்பாக இணைக்கிறது. அடிக்குறி, அது விளக்கும் ‘மகன்’ என்ற சொல்லுக்குப் பின்னே வைக்கப்பட்டுள்ளது.
