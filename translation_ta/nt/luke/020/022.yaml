reference: Luke 20:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: ta
  text: நாம் சீசருக்கு வரி[a] செலுத்துவது முறையா, இல்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வரி’ என்பதை ‘கப்பம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஆளும் அதிகாரத்துக்குச் செலுத்தப்படும் வரியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்பட்டதா
  rationale: இது வெறும் செயல் திறனை அல்ல, ஒரு செயல் அனுமதிக்கப்படுகிறதா அல்லது முறையானதா என்பதைக் கேட்கிறது. எந்தச் சட்டம் என்பதைக் குறிப்பிடாமல் மூலத்தின் தெளிவின்மையையும் காக்கிறது.
- source_word: ἡμᾶς
  choice: நமக்கு
  rationale: ἔξεστιν என்பதுடன் வரும் எழுவாய்ப் பொருளை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத இன அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: Καίσαρι
  choice: சீசருக்கு
  rationale: ரோம ஆட்சியாளருக்குரிய வரலாற்று அரசியல் பட்டப்பெயரைப் பொதுவான ‘பேரரசர்’ என்பதாக்காமல் காக்கிறது.
- source_word: φόρον
  choice: வரி
  rationale: ஆளும் அதிகாரத்துக்குச் செலுத்தப்படும் வரி அல்லது கப்பத்தைக் குறிக்கிறது. முதன்மை உரையில் இயல்பான ‘வரி’ பயன்படுத்தப்பட்டு, அரசியல் கீழ்ப்படிதலின் நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δοῦναι
  choice: செலுத்துவது
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடுப்பது’ என்றாலும், வரியுடன் தமிழில் ‘செலுத்துவது’ என்பதே இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἢ οὔ
  choice: இல்லையா
  rationale: இரு மாற்றுகளில் ஒன்றைத் தேர்ந்தெடுக்க வற்புறுத்தும் கேள்வி முடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அனுமதிக்கப்பட்டதா’ என்பதில் குறிக்கப்படும் சட்டத்தின் தன்மை
  choice: ‘சட்டப்படி அனுமதிக்கப்பட்டதா’ என்று மொழிபெயர்த்து, அது ரோமச் சட்டமா இறைச்சட்டமா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘ரோமச் சட்டப்படி செல்லுமா’ அல்லது ‘இறைவனுடைய சட்டப்படி முறையா’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்க உரை எந்தச் சட்டத்தைச் சுட்டுகிறது என்பதைத் தெளிவுபடுத்தவில்லை. கேள்வியின் அரசியல் மற்றும் சமயப் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சீசர்’ வரலாற்றுச் சிறப்பைத் தக்கவைக்கிறது; ‘வரி செலுத்துவது’ தற்போதைய தமிழில் தெளிவான வழக்கு.
