reference: Luke 20:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “மேசியா[a] தாவீதின் மகன்[b] என்று எப்படிச் சொல்கிறார்கள்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கச் சொல் Χριστός இங்கு எதிர்பார்க்கப்பட்ட தாவீதிய விடுவிப்பவரைக் குறிக்கும் பட்டமாக இருப்பதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “தாவீதின் ஒரு மகன்” அல்லது “தாவீதின் அந்த மகன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொற்படி, “தாவீதின் மகன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அவர் … என்றார்
  rationale: δέ இங்கு மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது. தமிழில் தனியாக ‘ஆனால்’ எனச் சேர்ப்பதைவிட, இயல்பான தொடர்ச்சியால் இதை வெளிப்படுத்துவது பொருத்தமானது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Πῶς
  choice: எப்படி
  rationale: அந்தக் கூற்றின் தர்க்கத்தையோ சாத்தியத்தையோ கேள்விக்குட்படுத்தும் கிரேக்க வினாவை இயல்பாகத் தருகிறது.
- source_word: λέγουσιν
  choice: சொல்கிறார்கள்
  rationale: குறிப்பிடப்படாத பன்மை எழுவாயை அப்படியே காக்கிறது; ‘மக்கள்’ அல்லது ‘வேத அறிஞர்கள்’ என்று தேவையின்றி அடையாளப்படுத்தவில்லை.
- source_word: τὸν χριστόν
  choice: மேசியா
  rationale: Χριστός இங்கு எதிர்பார்க்கப்பட்ட தாவீதிய அரச விடுவிப்பவரைக் குறிக்கும் பட்டமாக வருவதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: εἶναι
  choice: என்று
  rationale: λέγουσιν உடன் வரும் மறைமுகக் கூற்றைத் தமிழில் இயல்பாக ‘… என்று சொல்கிறார்கள்’ என்ற அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Δαυὶδ υἱόν
  choice: தாவீதின் மகன்
  rationale: சொற்பொருளையும் தாவீதுடனான வழிவந்த உறவையும் காக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத திட்டவட்டத் தன்மையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: சூழல் எதிர்பார்க்கப்பட்ட தாவீதிய அரசரைப் பற்றியது; எனவே பெயர்போன்ற ‘கிறிஸ்து’ என்பதைக் காட்டிலும் பட்டப்பெயரான ‘மேசியா’ பொருத்தமானது.
- issue: தாவீதிய மகத்துவ/வழித்தோன்றல் மொழி
  choice: தாவீதின் மகன்
  alternative: தாவீதின் ஒரு மகன்; தாவீதின் அந்த மகன்
  rationale: இந்தச் சொற்றொடர் மேசியாவின் தாவீதிய வழிவந்த தன்மையைச் சுட்டுகிறது. அடுத்த வசனங்கள் ஆராயும் இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்காமல், கிரேக்கத்தின் எளிய மகன் மொழியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. குறிப்பிடப்படாத பன்மை எழுவாய் காக்கப்பட்டுள்ளது; ‘மேசியா’ மற்றும் ‘தாவீதின் மகன்’ என்ற சொற்களில் உள்ள சூழல்சார் இறையியல் பதற்றம் தீர்க்கப்படாமல் வைக்கப்பட்டுள்ளது.
