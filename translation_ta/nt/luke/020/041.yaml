  source_fidelity: கிரேக்கத்தின் கேள்வி அமைப்பு, குறிப்பிடப்படாத பன்மை எழுவாய் (λέγουσιν), மறைமுகக் கூற்று, மற்றும் தாவீதுடனான மகன் உறவு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. δέ-யின் மென்மையான உரையாடல் மாற்றம் தமிழில் வெளிப்படையான இணைப்புச்சொல் இன்றியும் இயல்பாகத் தெரிவிக்கப்படுகிறது.
  naturalness: “அவர் அவர்களிடம் … என்றார்” மற்றும் “எப்படிச் சொல்கிறார்கள்?” ஆகியவை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளன. பன்மை வினைச்சொல், கிரேக்கத்தில் உள்ள குறிப்பிடப்படாத ‘அவர்கள்’ என்ற எழுவாயைச் சேர்த்துக் குறிப்பாக்காமல் வெளிப்படுத்துகிறது.
