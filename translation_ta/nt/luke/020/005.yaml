source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: ta
  text: 'அவர்களோ தங்களுக்குள் ஆலோசித்தார்கள்: “நாம், ‘வானத்திலிருந்து’ என்று சொன்னால், ‘ஏன் நீங்கள் அவரை நம்பவில்லை?’ என்று அவர் சொல்வார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: தங்களுக்குள் ஆலோசித்து
  rationale: குழுவுக்குள் நடந்த சிந்தனை மற்றும் கலந்தாலோசனை ஆகிய இரண்டையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: தெய்வீக மூலத்தையும் அதிகாரத்தையும் சுட்டும் கிரேக்க மரபுத்தொடரை ‘கடவுளிடமிருந்து’ என்று விளக்கிவிடாமல் அதன் உருவகத்தோடு தக்கவைக்கிறது.
- source_word: ἐρεῖ
  choice: அவர் சொல்வார்
  rationale: அடுத்து வருவது கேள்வியாக இருந்தாலும், கிரேக்க வினைச்சொல் பொதுவாக ‘சொல்வார்’ என்பதே; ஆகவே கேள்வியின் தன்மையை மேற்கோளே வெளிப்படுத்துமாறு மூலச் சொல்லைத் தக்கவைக்கிறது.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: நீங்கள் அவரை நம்பவில்லை
  rationale: πιστεύω என்பதுடன் ஆளைக் குறிக்கும் நான்காம் வேற்றுமை வருவதால், இங்கு யோவானின் சொல்லை நம்புதல் அல்லது அவரை நம்பகமானவராக ஏற்றுக்கொள்ளுதல் பொருந்துகிறது; ‘அவர்மேல் விசுவாசம் வைக்கவில்லை’ என்பது மூலத்தைவிட வலுவான தனிப்பட்ட விசுவாசப் பொருளைச் சேர்க்கக்கூடும்.
theological_decisions:
- issue: ‘வானத்திலிருந்து’ என்பதில் குறிக்கப்படும் மூலம்
  choice: வானத்திலிருந்து
  alternative: கடவுளிடமிருந்து
  rationale: இச்சொற்றொடர் தெய்வீக அதிகாரத்தை உணர்த்தினாலும், கிரேக்க உரை நேரடியாக ‘வானம்’ என்கிறது. அந்த மரியாதைமிகு மறைமுகக் குறிப்பை விளக்கவுரையாக மாற்றாமல் தக்கவைத்துள்ளது.
- issue: யோவானை ‘நம்புதல்’ என்பதன் தன்மை
  choice: அவரை நம்பவில்லை
  alternative: அவர் சொன்னதை ஏற்றுக்கொள்ளவில்லை
  rationale: மூல வினைச்சொல் ஒருவரை நம்புதல், அவர் கூறியதை உண்மையென ஏற்றுக்கொள்ளுதல் ஆகிய நெருங்கிய பொருள்களைத் தாங்குகிறது. முதன்மை உரை இந்தச் செறிவை இயல்பாகத் தக்கவைக்கிறது; அடிக்குறிப்பு சூழல்சார் மாற்றுப் பொருளைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஆனால் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களோ’ என்பது δὲ குறிக்கும் எதிர்மறைத் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது; பங்கேற்பு அமைப்பான λέγοντες தமிழில் தொடர்வினையாகவும் இறுதி ‘என்றார்கள்’ என்பதாலும் இயல்பாக்கப்பட்டுள்ளது.
