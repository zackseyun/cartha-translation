source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “அப்படியானால், சீசருக்குரியவற்றைச் சீசருக்கும் கடவுளுக்குரியவற்றைக் கடவுளுக்கும் திருப்பிக் கொடுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “செலுத்துங்கள்.” இங்குள்ள கிரேக்க வினைச்சொல், உரியதைக் கொடுப்பது, செலுத்துவது அல்லது திருப்பிக் கொடுப்பது எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: ஆனால் அவர் அவர்களிடம் … என்றார்
  rationale: δέ இங்கு மென்மையான எதிர்மறைத் திருப்பையோ உரையாடலின் தொடர்ச்சியையோ குறிக்கலாம்; சூழலில் உள்ள பதிலின் திருப்பை இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது. πρὸς αὐτούς என்பது தமிழில் இயல்பாக ‘அவர்களிடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Τοίνυν
  choice: அப்படியானால்
  rationale: முன்னிருந்த கேள்வியிலிருந்தும் நாணயத்தைப் பற்றிய ஒப்புதலிலிருந்தும் இயேசு வருவிக்கும் முடிவை இது இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἀπόδοτε
  choice: திருப்பிக் கொடுங்கள்
  rationale: இந்த வினைச்சொல் ஒருவருக்குச் சேரவேண்டியதை அவருக்குக் கொடுப்பது, செலுத்துவது அல்லது திருப்பிக் கொடுப்பது ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது. ‘திருப்பிக் கொடுங்கள்’ அந்த உரிமை அல்லது கடமை சார்ந்த நுணுக்கத்தைத் தெளிவாக வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: சீசருக்குரியவற்றைச் சீசருக்கும்
  rationale: τὰ என்ற நடுநிலைப் பன்மையை வரிகளுக்கு மட்டும் சுருக்காமல், சீசருக்குரிய அனைத்தையும் உள்ளடக்கும் பரந்த சொல்லாக்கமாக வைத்திருக்கிறது. இரு இணை உறுப்புகளின் சமநிலையைத் தமிழில் இயல்பாகக் காட்ட ‘-க்கும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Καίσαρος / Καίσαρι
  choice: சீசர்
  rationale: Καῖσαρ என்பது பேரரசரின் பெயர் அல்லது பட்டமாக இங்கு வருகிறது; விளக்கமான ‘பேரரசர்’ என்பதற்குப் பதிலாக வழக்கமான தமிழ் ஒலிபெயர்ப்பு வைக்கப்பட்டுள்ளது.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: கடவுளுக்குரியவற்றைக் கடவுளுக்கும்
  rationale: சீசரைப் பற்றிய முந்தைய உறுப்புடன் உள்ள கிரேக்க இணை அமைப்பையும் முரண்பாட்டையும் காக்கிறது; கடவுளுக்குரியவற்றின் எல்லையை மொழிபெயர்ப்பு தானாக வரையறுக்கவில்லை.
theological_decisions:
- issue: அரசியல் அதிகாரத்திற்கும் கடவுளுக்கும் உரிய கடமைகளின் வரம்பு
  choice: சீசருக்குரியவற்றைச் சீசருக்கும் கடவுளுக்குரியவற்றைக் கடவுளுக்கும் கொடுக்க வேண்டிய இணையான பொறுப்பு திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
  alternative: இதை வரி செலுத்துவதற்கு மட்டும் உரிய கட்டளையாகவோ, சமயமும் அரசும் முற்றிலும் பிரிந்திருப்பதற்கான கோட்பாடாகவோ, அரசுக்கு எல்லையற்ற அதிகாரம் அளிப்பதாகவோ வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்க வாசகம் இருவருக்கும் உரியதை அளிக்கும் கொள்கையைச் சொல்கிறது; ஆனால் ஒவ்வொரு துறையின் துல்லியமான எல்லையையும் வரையறுக்கவில்லை. எனவே அதன் பரப்பும் இறையியல் பதற்றமும் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்படியானால்’ உரையாடலின் முடிவுரைத்தன்மையை இயல்பாகக் காட்டுகிறது; இணையான இரு கூறுகளும் சுருக்கப்படாமல் காக்கப்பட்டுள்ளன.
