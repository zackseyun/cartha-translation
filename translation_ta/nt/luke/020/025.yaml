  source_fidelity: மூல கிரேக்கத்தின் உரையாடல் தொடக்கம், τοίνυν-ன் முடிவுரைத்தன்மை, ἀπόδοτε-ன் ‘உரியதைத் திருப்பிக் கொடுங்கள்’ என்ற கடமை/உரிமை நுணுக்கம், மேலும் சீசர்–கடவுள் இணை அமைப்பு ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘சீசருக்குரியவற்றைச் சீசருக்கும்; கடவுளுக்குரியவற்றைக் கடவுளுக்கும்’ என்பது τὰ ... τῷ ... என்ற இரு இணை உறுப்புகளின் பரந்த பொருளை வரி அல்லது வேறு ஒரு குறிப்பிட்ட கடமைக்குள் சுருக்கவில்லை.
  naturalness: நவீன தரத் தமிழில் நடை இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது. ‘அப்படியானால்’ சூழலிலிருந்து வரும் முடிவைத் தெளிவாகக் காட்டுகிறது; ‘திருப்பிக் கொடுங்கள்’ பொதுவாசகருக்கும் புரியக்கூடியது. சொற்றொடரின் இணைநிலையும் வலியுறுத்தலும் தமிழில் நன்றாக அமைந்துள்ளன.
  terminology: ‘சீசர்’ என்பது பெயர்/பட்டத்திற்கான பொருத்தமான ஒலிபெயர்ப்பு. இஸ்ரவேலின் கடவுளைக் குறிக்கும் சூழலில் ‘கடவுள்’ பொருத்தமான நவீன தமிழ் சொல்லாகும். ‘திருப்பிக் கொடுங்கள்’ என்பதற்கான அடிக்குறிப்பு செலுத்துதல் உள்ளிட்ட அகராதிசார் மாற்றுப் பொருளைச் சரியாகக் குறிப்பிடுகிறது; அது வசனத்தின் அரசியல் அல்லது இறையியல் வரம்புகளை விளக்கி முடிவுசெய்யவில்லை.
