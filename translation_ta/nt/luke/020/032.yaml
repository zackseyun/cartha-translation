  text: Later[a], the woman also died.
translation:
  language: ta
  text: பிறகு, அந்தப் பெண்ணும் இறந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: பிறகு
  rationale: கதை நிகழ்வுகளின் வரிசையில் அடுத்த காலத்தைச் சுட்டும் வினையடை; ‘பிறகு’ இயல்பான நவீனத் தமிழில் கால முன்னேற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: முந்தைய சகோதரர்கள் இறந்ததைப் போல அந்தப் பெண்ணும் இறந்தாள் என்ற சேர்க்கைப் பொருளைத் தமிழின் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள் இருக்கலாம். பல சகோதரர்களை மணந்த சூழலில், ஒரு குறிப்பிட்ட திருமண உறவை மட்டும் உணர்த்தாமல் முன்னர் குறிப்பிடப்பட்ட நபரைத் தெளிவாகச் சுட்ட ‘அந்தப் பெண்’ பொருத்தமானது.
- source_word: ἀπέθανεν
  choice: இறந்தாள்
  rationale: இறப்பை நேரடியாகத் தெரிவிக்கும் இறந்தகால வினை; மூலத்தின் எளிய, நேரடியான கூற்றைத் தமிழில் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, சுருக்கமான, கண்ணியமான நடை. கிரேக்கச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல் அதன் காலத் தொடர்ச்சியும் ‘கூட/உம்’ என்ற சேர்க்கைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
