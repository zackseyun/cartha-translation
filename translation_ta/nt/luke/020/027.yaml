source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: ta
  text: பின்னர், உயிர்த்தெழுதல் இல்லை என்று மறுக்கிற சதுசேயர்களில் சிலர் அவரிடம் வந்து கேள்வி கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: அவரிடம் வந்து
  rationale: இறந்தகால வினையெச்சம் பிரதான வினைக்கு முன் நிகழ்ந்த அணுகுதலைக் குறிக்கிறது; இயல்பான தமிழில் ‘அவரிடம் வந்து’ என்பது இயேசுவை அணுகியதையும் செயல் வரிசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: δέ
  choice: பின்னர்
  rationale: இங்கு வலுவான முரண்பாட்டைவிடக் கதை நகர்வைக் குறிக்கிறது; ‘பின்னர்’ என்பது நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: τινες τῶν Σαδδουκαίων
  choice: சதுசேயர்களில் சிலர்
  rationale: கிரேக்கப் பகுதிப்பொருள் அமைப்பை இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: οἱ ἀντιλέγοντες
  choice: மறுக்கிற
  rationale: தொடர்ந்து வரும் μὴ εἶναι என்ற உள்ளடக்கக் கூற்றுடன் சேர்ந்து, வெறும் எதிர்ப்பையோ முரண்பட்டுப் பேசுவதையோ அல்லாமல் உயிர்த்தெழுதல் இருப்பதை மறுக்கும் நிலைப்பாட்டைக் குறிக்கிறது.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: உயிர்த்தெழுதல் இல்லை என்று
  rationale: மறுக்கப்படும் கூற்றின் உள்ளடக்கத்தை இயல்பாகவும் சுருக்கமாகவும் தருகிறது; ‘உயிர்த்தெழுதல்’ என்பதை பொதுக் கருத்தாகவே வைத்திருக்கிறது.
- source_word: ἐπηρώτησαν αὐτόν
  choice: அவரிடம் ... கேள்வி கேட்டார்கள்
  rationale: ἐπερωτάω என்பதன் கேட்பது/வினவுவது என்ற பொருளைத் தருகிறது; அடுத்துவரும் சவாலான கேள்விக்குப் பொருந்தும் அதேவேளையில் தேவையற்ற நோக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த சதுசேயர்களின் நிலைப்பாட்டை மொழிபெயர்த்தல்
  choice: உயிர்த்தெழுதல் இல்லை என்று மறுக்கிற
  alternative: உயிர்த்தெழுதல் இல்லை என்று சொல்கிற
  rationale: ἀντιλέγοντες என்ற சொல்லின் எதிர்மறையான வலிமையை ‘மறுக்கிற’ காக்கிறது; அதே நேரத்தில் உயிர்த்தெழுதல் பற்றிய பிற்கால இறையியல் விளக்கங்களை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சதுசேயர்கள்’ என்ற நிலைபெற்ற வேதாகமப் பெயர் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உண்மையான வாசக வேறுபாட்டையோ விளக்கம் தேவைப்படும் தெளிவின்மையையோ இவ்வசனத்தில் குறிக்க வேண்டிய அவசியம் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
