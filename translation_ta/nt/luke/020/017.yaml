    text: அல்லது, “மூலைக்கல்”; வேறொரு சாத்தியம், “மூலையின் உச்சிக்கல்.” கிரேக்கில் சொற்சொல்லாக, “மூலையின் தலை” என்று உள்ளது.
    reason: alternative_reading
  revision_rationale: The revision preserves the draft’s formal rhetorical framing while explicitly representing οὗτος with “அதுவே,” rendering ἀπεδοκίμασαν as a deliberate refusal, and making the debated architectural expression clearer in idiomatic Tamil. The footnote continues to preserve the unresolved architectural alternatives rather than selecting a doctrinally loaded interpretation.
