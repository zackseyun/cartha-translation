revisions:
- from: ஆனால் அவர் அவர்களை உற்றுப் பார்த்து, “அப்படியானால், ‘கட்டுகிறவர்கள் புறக்கணித்த கல்லே மூலைக்குத் தலைக்கல்லாயிற்று[a]’ என்று எழுதப்பட்டிருப்பது என்ன?” என்றார்.
  to: ஆனால் அவர் அவர்களை உற்றுப் பார்த்து, “அப்படியானால், ‘கட்டுகிறவர்கள் ஏற்க மறுத்த கல் அதுவே மூலையின் தலைக்கல்லாயிற்று[a]’ என்று எழுதப்பட்டிருப்பது என்ன?” என்றார்.
  rationale: The revision preserves the draft’s formal rhetorical framing while explicitly representing οὗτος with “அதுவே,” rendering ἀπεδοκίμασαν as a deliberate refusal, and making the debated architectural expression clearer in idiomatic Tamil. The footnote continues to preserve the unresolved architectural alternatives rather than selecting a doctrinally loaded interpretation.
