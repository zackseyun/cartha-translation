id: LUK.20.17
reference: Luke 20:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: ta
  text: ஆனால் அவர் அவர்களை உற்றுப் பார்த்து, “அப்படியானால், ‘கட்டுகிறவர்கள் ஏற்க மறுத்த கல் அதுவே மூலையின் தலைக்கல்லாயிற்று[a]’ என்று எழுதப்பட்டிருப்பது என்ன?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூலைக்கல்”; வேறொரு சாத்தியம், “மூலையின் உச்சிக்கல்.” கிரேக்கில் சொற்சொல்லாக, “மூலையின் தலை” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: உற்றுப் பார்த்து
  rationale: அவர்களை நோக்கிச் செலுத்தப்பட்ட கவனமான பார்வையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தீவிரத்தை அளவுக்கு மீறிக் கூட்டவில்லை.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: அப்படியானால், ... என்று எழுதப்பட்டிருப்பது என்ன?
  rationale: οὖν என்பதின் தொடர்விளைவையும், γεγραμμένον என்பதின் எழுதி நிலைத்திருக்கும் பொருளையும் காக்கிறது; ‘இதன் பொருள் என்ன?’ என்று விளக்கவுரை சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: Λίθον
  choice: கல்லே
  rationale: மேற்கோளில் அடையாளப்படுத்தப்பட்ட குறிப்பிட்ட கல்லையும், பின்னுள்ள οὗτος தரும் வலியுறுத்தலையும் தமிழின் ஏகாரத்தால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπεδοκίμασαν
  choice: புறக்கணித்த
  rationale: தகுதியற்றதென மதிப்பிட்டு ஏற்க மறுத்த செயலைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: οἰκοδομοῦντες
  choice: கட்டுகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை நேரடியாகக் காக்கிறது; கட்டிட உருவகமும் தெளிவாக உள்ளது.
- source_word: οὗτος
  choice: கல்லே
  rationale: தமிழில் தனியாக ‘இதுவே’ என மீண்டும் கூறுவதைவிட, ‘கல்லே’ என்ற வலியுறுத்தல் οὗτος என்பதின் சுட்டு வலிமையை இயல்பாகச் சுமக்கிறது.
- source_word: ἐγενήθη εἰς
  choice: ஆயிற்று
  rationale: ஒரு புதிய நிலை அல்லது பங்காக மாறியதைச் சுருக்கமான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: κεφαλὴν γωνίας
  choice: மூலைக்குத் தலைக்கல்
  rationale: ‘மூலையின் தலை’ என்ற மூல உருவகத்தைத் தெளிவாக வைத்துக்கொண்டு, அது அடிக்கல்லா மேல்முடிக்கல்லா என்ற விவாதத்தை முதன்மை உரையில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: சங்கீதம் 118:22 மேற்கோளிலுள்ள கட்டிடக்கலை உருவகம்
  choice: மூலைக்குத் தலைக்கல்
  alternative: மூலைக்கல்; அல்லது மூலையின் உச்சிக்கல்
  rationale: κεφαλὴ γωνίας என்பதன் துல்லியமான கட்டிடப் பணி விவாதத்திற்குரியது. ஆகவே முதன்மை உரை ‘தலை’ மற்றும் ‘மூலை’ ஆகிய இரு கூறுகளையும் காத்து, சாத்தியமான விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனப் பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. வேதாகம மேற்கோளின் செறிவைத் தக்கவைக்க ‘ஆயிற்று’ பயன்படுத்தப்பட்டுள்ளது; தெளிவற்ற கட்டிட உருவகம் அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டுள்ளது.
