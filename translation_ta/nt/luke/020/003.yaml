base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: ta
  text: ஆனால், அவர்களுக்குப் பதிலளித்து அவர், “நானும் உங்களிடம் ஒரு கேள்வி கேட்பேன்; நீங்கள் எனக்குப் பதில் சொல்லுங்கள்:” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: ஆனால் அவர் அவர்களுக்குப் பதிலாக ... என்றார்
  rationale: பதிலுரைக்கும் சூழலை ἀποκριθείς வெளிப்படுத்துகிறது; δέ இங்கு மெல்லிய முரண்பாட்டைக் குறிக்கிறது. கிரேக்கப் பங்கேற்புவினை அமைப்பை அப்படியே கடினமாகப் பின்பற்றாமல் இயல்பான நவீனத் தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: நானும் உங்களிடம் ... கேட்கிறேன்
  rationale: κἀγώ என்பதன் ‘நானும்’ என்ற பரஸ்பர வலியுறுத்தலைப் பாதுகாக்கிறது. கிரேக்க எதிர்கால வடிவம் இங்கு உடனடியாகச் செய்யப்போகும் செயலைக் குறிப்பதால், தமிழ் உரையாடலில் இயல்பான நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: λόγον
  choice: ஒரு கேள்வி
  rationale: λόγος என்பதற்கு அடிப்படையில் ‘சொல்’ அல்லது ‘விஷயம்’ என்று பொருள் வரலாம்; ஆனால் ἐρωτάω உடன் இங்கு அது கேட்கப்படும் ஒன்றை, அதாவது ‘கேள்வி’யைக் குறிக்கிறது.
- source_word: καὶ εἴπατέ μοι
  choice: நீங்கள் எனக்குப் பதில் சொல்லுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் நேரடியான சவாலை ‘நீங்கள் ... சொல்லுங்கள்’ பாதுகாக்கிறது; சூழலில் சொல்ல வேண்டியது கேள்விக்கான பதில் என்பதால் ‘பதில் சொல்லுங்கள்’ இயல்பான தமிழாகும்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பதிலுரைத்தல், மெல்லிய எதிர்மறை இணைப்பு, ‘நானும்’ என்ற வலியுறுத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
