source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: ta
  text: ஆனால் இறந்தோர் உயிர்த்தெழுப்பப்படுகிறார்கள் என்பதை மோசேயும்கூட முட்புதரைப் பற்றிய பகுதியில்[a] தெரிவித்தார். அங்கே அவர் ஆண்டவரை[b] ஆபிரகாமின் கடவுள் என்றும், ஈசாக்கின் கடவுள் என்றும், யாக்கோபின் கடவுள் என்றும் குறிப்பிடுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்புதரிடத்தில்.” கிரேக்கச் சொற்றொடர் அந்த நிகழ்வு நடந்த இடத்தையோ, வழக்குச் சொல்லாக எரியும் முட்புதரைப் பற்றிய வேதப்பகுதியையோ (யாத்திராகமம் 3) குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “ஆண்டவர்.” யாத்திராகமம் 3-இல் வரும் இறைப்பெயரை கிரேக்கப் பழைய ஏற்பாடு வழக்கமாக மொழிபெயர்த்த விதத்தை இது பிரதிபலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: உயிர்த்தெழுப்பப்படுகிறார்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, இறந்தோரை எழுப்பும் செயல் அவர்களுக்குச் செய்யப்படுவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ νεκροὶ
  choice: இறந்தோர்
  rationale: கூட்டுப் பொருளைக் காக்கும், சுருக்கமானதும் கண்ணியமானதும் ஆன நவீனத் தமிழ் வழக்கு.
- source_word: ἐμήνυσεν
  choice: தெரியப்படுத்தியிருக்கிறார்
  rationale: ‘அறியச்செய்தார்/வெளிப்படுத்தினார்’ என்ற சான்றளிக்கும் பொருளைத் தருகிறது; முறையான பிரகடனம் என்ற கூடுதல் வலிமையைத் திணிக்கவில்லை.
- source_word: ἐπὶ τῆς βάτου
  choice: முட்புதரைப் பற்றிய பகுதியில்
  rationale: இது முட்புதர் இருந்த இடத்தையும் குறிக்கக்கூடியதாயினும், இச்சூழலில் யாத்திராகமம் 3-இல் உள்ள வேதப்பகுதியைக் குறிக்கும் இலக்கிய வழக்காக இயல்பாகப் புரிகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὡς λέγει
  choice: அங்கே அவர் ... குறிப்பிடுகிறார்
  rationale: வேதப்பகுதியில் மோசே ஆண்டவரை எவ்வாறு குறிப்பிடுகிறார் என்பதைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; கிரேக்க இரட்டை வேற்றுமை அமைப்பின் பொருளையும் காக்கிறது.
- source_word: κύριον
  choice: ஆண்டவரை
  rationale: κύριος என்பதற்கான வழக்கமான தெய்வீகப் பட்டப்பெயரைத் தருகிறது; யாத்திராகமத்தில் உள்ள இறைப்பெயருடனான தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: ஆபிரகாமின் கடவுள் என்றும், ஈசாக்கின் கடவுள் என்றும், யாக்கோபின் கடவுள் என்றும்
  rationale: θεόν மூன்றுமுறை வருவதால் உண்டாகும் வலியுறுத்தலையும் மேற்கோளின் ஓசைநயத்தையும் தமிழிலும் மீளுருவாக்குகிறது.
theological_decisions:
- issue: சதுசேயருக்கு எதிரான இயேசுவின் வாதத்தில் உயிர்த்தெழுதல் மொழி
  choice: இறந்தோர் உயிர்த்தெழுப்பப்படுகிறார்கள்
  alternative: இறந்தோர் உயிர்த்தெழுகிறார்கள்
  rationale: செயப்பாட்டு வடிவம் கிரேக்க வினையின் வடிவத்தைக் காத்து, இறந்தோரை எழுப்பும் மறைமுகச் செய்பவரைக் குறிப்பால் உணர்த்துகிறது; அதேவேளை உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: இஸ்ரவேலின் கடவுளைப் பற்றிய மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர் / யெகோவா
  rationale: கிரேக்க மூலத்தில் κύριος இருப்பதால் அதற்கேற்ற பொதுவான தமிழ்ச் சொல்லான ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது. யாத்திராகமத்தின் இறைப்பெயர் மரபுடனான தொடர்பு அடிக்குறிப்பில் மட்டும் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறந்தோர்’ என்ற செறிவான வடிவமும், மூன்று முறையும் மீள வரும் ‘கடவுள் என்றும்’ என்ற அமைப்பும் மூலத்தின் கூட்டுப் பொருளையும் வலியுறுத்தலையும் காக்கின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே இடப்பட்டுள்ளன.
