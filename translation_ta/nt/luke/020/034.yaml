lexical_decisions:
- source_word: Καὶ
  choice: இணைப்பைத் தனியே மொழிபெயர்க்காமல் தமிழ் வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்தப்பட்டது
  rationale: கிரேக்கத்தில் இது எளிய கதைத் தொடரைச் சுட்டும் இணைப்புச்சொல். தமிழில் ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்த்தால் தேவையற்ற வலியுறுத்தல் அல்லது காலநுட்பம் தோன்றும்.
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: இயேசு அவர்களிடம் … என்றார்
  rationale: தமிழின் இயல்பான நேர்கூற்று அமைப்பைப் பின்பற்றி, ‘சொன்னார்’ என்பதைக் காட்டிலும் கண்ணியமான நடையில் ‘என்றார்’ பயன்படுத்தப்பட்டது; αὐτοῖς என்பதும் ‘அவர்களிடம்’ எனத் தெளிவாகப் பாதுகாக்கப்பட்டது.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: இந்தக் காலத்தின் மகன்கள்
  rationale: υἱοί என்பதன் ‘மகன்கள்’ என்ற உருவக வடிவத்தையும், αἰών குறிக்கும் தற்போதைய கால ஒழுங்கையும் பாதுகாக்கிறது. இது ஆண்களை மட்டும் அல்லாமல் இக்காலத்தைச் சேர்ந்தவர்களைப் பிரதிநிதித்துவ முறையில் குறிக்கிறது என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: γαμοῦσιν
  choice: திருமணம் செய்துகொள்கிறார்கள்
  rationale: திருமணம் புரிதலைக் குறிக்கும் செயப்பாட்டு வினையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γαμίσκονται
  choice: திருமணம் செய்துவைக்கப்படுகிறார்கள்
  rationale: முந்தைய செயப்பாட்டு வினையிலிருந்து வேறுபடும் கிரேக்கச் செயப்பாட்டுவினை வடிவத்தைப் பாதுகாக்கிறது; ‘மணம் முடித்துவைக்கப்படுகிறார்கள்’ என்பதைக் காட்டிலும் இது பொதுவாக எளிதில் புரியும்.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் பாலினம் குறிக்கப்பட்ட உருவகம்
  choice: இந்தக் காலத்தின் மகன்கள்
  alternative: இந்தக் காலத்தைச் சேர்ந்தவர்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் பாதுகாக்கிறது; அதே நேரத்தில் அது இக்காலத்தைச் சேர்ந்த மக்களைப் பிரதிநிதித்துவமாகக் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: αἰών என்பதன் இறுதிக்காலவியல் பொருள்
  choice: இந்தக் காலம்
  alternative: இந்த உலகம்
  rationale: அடுத்த வசனங்களில் வரும் வரவிருக்கும் காலத்துடனான முரண்பாட்டைப் பாதுகாக்கிறது. ‘உலகம்’ என்பது பௌதிக உலகைக் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்.
- issue: γαμοῦσιν மற்றும் γαμίσκονται இடையிலான வேறுபாடு
  choice: திருமணம் செய்துகொள்கிறார்கள்; திருமணம் செய்துவைக்கப்படுகிறார்கள்
  alternative: திருமணம் செய்துகொள்கிறார்கள்
  rationale: மூலத்தில் உள்ள செயப்பாட்டு–செயப்பாட்டுவினை வேறுபாட்டைத் தீர்த்துவிடாமல் வெளிப்படுத்துகிறது; பழங்கால திருமண வழக்குகளின் மொழிநடையையும் தேவையற்ற விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான நேர்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘இந்தக் காலத்தின் மகன்கள்’ என்பது தமிழில் சற்றே செமித்தியத் தன்மை கொண்டிருந்தாலும், மூல உருவகத்தைப் பாதுகாப்பதற்காக வைக்கப்பட்டு அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது.
