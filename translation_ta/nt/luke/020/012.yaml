  text: καὶ προσέθετο ⸂τρίτον πέμψαι⸃· οἱ δὲ καὶ τοῦτον τραυματίσαντες ἐξέβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: ta
  text: பிறகு அவர் மூன்றாவதாக ஒருவனை அனுப்பினார்[a]. ஆனால் அவர்களோ இவனையும் காயப்படுத்தி வெளியே எறிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘அவர் மூன்றாவதாக ஒருவனை அனுப்பச் சேர்த்தார்’; இது ‘அவர் மூன்றாவதாக ஒருவனை அனுப்பினார்’ அல்லது ‘அவர் தொடர்ந்து மூன்றாவதாக ஒருவனை அனுப்பினார்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: அனுப்பினார்
  rationale: προστίθημι + வினையெச்சம் தொடர்ந்து அல்லது மேலும் ஒரு செயலைச் செய்வதைக் குறிக்கும் மரபுத்தொடர். ‘மூன்றாவதாக’ என்பதே தொடர்ச்சியைத் தெளிவாக்குவதால், தமிழில் இயல்பாக ‘அனுப்பினார்’ என்று வழங்கப்பட்டது.
- source_word: τρίτον πέμψαι
  choice: மூன்றாவதாக ஒருவனை அனுப்பினார்
  rationale: கிரேக்கத்தில் ‘மூன்றாவதாக ஒருவனை அனுப்ப’ என்று, முந்தைய சூழலில் உள்ள வேலைக்காரன் என்னும் பெயர் விடப்பட்டுள்ளது. தமிழில் ஆண்பால் ஒருமை குறிப்பை இயல்பாக வெளிப்படுத்த ‘ஒருவனை’ சேர்க்கப்பட்டது; ‘வேலைக்காரனை’ என்று வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சுருக்கம் காக்கப்பட்டது.
- source_word: οἱ δὲ
  choice: ஆனால் அவர்களோ
  rationale: δέ உரிமையாளரின் செயலுக்கும் குத்தகைக்காரர்களின் எதிர்வினைக்கும் இடையிலான முரண்பாட்டைச் சுட்டுகிறது. ‘அவர்களோ’ சூழலில் ஏற்கெனவே அறியப்பட்ட குத்தகைக்காரர்களைக் குறிக்கிறது.
- source_word: καὶ τοῦτον
  choice: இவனையும்
  rationale: καί மீண்டும் அதே கொடுமை நிகழ்ந்ததைச் சுட்டுகிறது; ‘இவனையும்’ என்பது அந்தச் சேர்க்கை உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: τραυματίσαντες
  choice: காயப்படுத்தி
  rationale: τραυματίζω காயம் ஏற்படுத்துவதை நேரடியாகக் குறிக்கிறது; ‘காயப்படுத்தி’ அதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξέβαλον
  choice: வெளியே எறிந்தார்கள்
  rationale: ἐκβάλλω இங்கு வன்முறையாக வெளியே தள்ளுதல் அல்லது எறிதல் என்ற பொருளுடையது. ‘வெளியே எறிந்தார்கள்’ அந்த வலிமையைப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க கதைநடைத் தொனியிலும் மொழிபெயர்க்கப்பட்டது. ‘ஒருவனை’ என்பது சூழலில் புரியும் வேலைக்காரனைச் சுட்டுகிறது; தேவையற்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டது.
