  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: ta
  text: அப்போது மறைநூல் அறிஞர்களில் சிலர் பதிலளித்து, “ஆசிரியரே, நன்றாகச் சொன்னீர்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசிரியரே, சரியாகச் சொன்னீர்,” அல்லது “ஆசிரியரே, முறையாகப் பேசினீர்.”
    reason: கலῶς εἶπας என்பது இயேசுவின் கூற்றைப் பாராட்டுவதாகவும் அது சரியானது என ஒப்புக்கொள்வதாகவும் பொருள்படும்; தமிழில் இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: பதிலளித்தார்கள்
  rationale: ἀποκρίνομαι இங்கு முந்தைய உரைக்கான வாய்மொழிப் பதிலை அறிமுகப்படுத்துகிறது. கிரேக்கப் பெயரெச்ச அமைப்பைத் தமிழில் இயல்பான வினைமுற்றாக மொழிபெயர்த்துள்ளது.
- source_word: δέ
  choice: அப்போது
  rationale: δέ மென்மையான உரையாடல் அல்லது நிகழ்வுத் தொடர்ச்சி மாற்றத்தைக் குறிக்கிறது; முந்தைய வாதத்திற்குப் பின்வரும் பதிலை ‘அப்போது’ இயல்பாக இணைக்கிறது.
- source_word: τινες τῶν γραμματέων
  choice: வேத அறிஞர்களில் சிலர்
  rationale: τινες உடன் வரும் பன்மை உரிமைவேற்றுமை, அந்தக் குழுவில் ஒரு பகுதியினரை மட்டும் குறிக்கிறது; ‘…இல் சிலர்’ இதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γραμματέων
  choice: வேத அறிஞர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் γραμματεῖς வேதத்திலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்றவர்களைக் குறிக்கிறது. ‘வேத அறிஞர்கள்’ என்பது பழமையான தொழிற்பெயரைத் தவிர்த்து, நவீன வாசகருக்குப் புரியும் சுருக்கமான மொழிபெயர்ப்பு.
- source_word: Διδάσκαλε
  choice: ஆசிரியரே
  rationale: διδάσκαλος என்பதன் நேரடியான பொருள் ‘ஆசிரியர்’; விளிப்புவேற்றுமை ‘ஆசிரியரே’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: καλῶς
  choice: நன்றாக
  rationale: καλῶς இங்கு இயேசுவின் கூற்றின் தரத்தையோ சரியான தன்மையையோ பாராட்டுகிறது. ‘நன்றாக’ அதன் பரந்த பாராட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: εἶπας
  choice: சொன்னீர்
  rationale: இரண்டாம் நபர் ஒருமை இறந்தகால வினையை மரியாதையுடன் இயல்பான தமிழில் ‘சொன்னீர்’ என்று வழங்குகிறது.
