translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் நேரடியான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொற்றொடரின் திருமணப் பொருள் முதன்மை உரையில் இயல்பாகவும், அதன் நேரடியான வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
