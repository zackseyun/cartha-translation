source:
  edition: SBLGNT
  text: ἑπτὰ οὖν ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος λαβὼν γυναῖκα ἀπέθανεν ἄτεκνος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: ta
  text: சகோதரர்கள் ஏழு பேர் இருந்தார்கள். அவர்களில் முதலாமவன் ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொண்டு[a], பிள்ளையில்லாமல் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமணம் செய்துகொண்டு.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “ஒரு பெண்ணை மனைவியாக எடுத்துக்கொண்டு”; இது திருமணத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ
  choice: சகோதரர்கள் ஏழு பேர்
  rationale: ஆண் உடன்பிறந்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; ஏழு என்ற எண்ணிக்கையையும் தெளிவாகக் காக்கிறது.
- source_word: οὖν
  choice: தனியாக வெளிப்படுத்தப்படவில்லை
  rationale: இங்கு இது உரையாடலின் தொடர்ச்சியை மென்மையாகக் குறிக்கிறது; ‘எனவே’ என்று மொழிபெயர்த்தால் இல்லாத வலுவான தர்க்க முடிவையும், ‘அப்போது’ என்றால் காலப்பொருளையும் சேர்க்கக்கூடும். தமிழில் வாக்கியத் தொடர்ச்சியே இதன் பணியை இயல்பாகச் செய்கிறது.
- source_word: ὁ πρῶτος
  choice: அவர்களில் முதலாமவன்
  rationale: சகோதரர்களின் வரிசையில் முதலில் குறிப்பிடப்படுபவனைக் குறிக்கிறது; வயதில் மூத்தவன் என்று மூலத்தில் வெளிப்படையாகச் சொல்லப்படாததால் ‘மூத்தவன்’ தவிர்க்கப்பட்டது.
- source_word: λαβὼν γυναῖκα
  choice: ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொண்டு
  rationale: சொற்றொடரின் ‘ஒரு பெண்ணை மனைவியாக எடுத்தல்’ என்ற திருமண மரபுத்தொடரின் வடிவத்தை ஓரளவு காத்தபடியே, தமிழில் இயல்பாகத் திருமணப் பொருளைத் தெரிவிக்கிறது.
- source_word: ἀπέθανεν ἄτεκνος
  choice: பிள்ளையில்லாமல் இறந்தான்
  rationale: அவன் இறந்தபோது பிள்ளைகள் இல்லை என்ற சட்ட மற்றும் கதைச் சூழலுக்குரிய பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
