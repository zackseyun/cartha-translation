source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: ta
  text: அவனைத் திராட்சைத்தோட்டத்திலிருந்து வெளியே தள்ளி, கொன்றார்கள். அப்படியானால், திராட்சைத்தோட்டத்தின் உரிமையாளர்[a] அவர்களுக்கு என்ன செய்வார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சைத்தோட்டத்தின் ஆண்டவர்” அல்லது “திராட்சைத்தோட்டத்தின் எஜமான்.” கிரேக்கச் சொல் κύριος (குரியோஸ்); இது ஒரு பட்டமாக வரும்போது பொதுவாக “ஆண்டவர்” என மொழிபெயர்க்கப்படுகிறது. ஆனால் இங்கு உவமையின் கதைச் சூழலில் திராட்சைத்தோட்டத்தின் மனித உரிமையாளரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: வெளியே தள்ளிவிட்டு
  rationale: இறந்தகால வினையெச்சம், கொல்வதற்கு முன் அவனைத் தோட்டத்திலிருந்து வலுக்கட்டாயமாக வெளியேற்றியதைக் காட்டுகிறது. ‘தள்ளிவிட்டு’ என்பது அந்த வரிசையையும் வலிமையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்திற்கு வெளியே
  rationale: தோட்டத்தின் உள்ளிருந்து வெளியே நிகழ்ந்த நகர்வைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀπέκτειναν
  choice: கொன்றார்கள்
  rationale: வினையின் நேரடியான பொருள் ‘கொன்றார்கள்’; ‘கொலை செய்தார்கள்’ என மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது ஒழுக்க நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: τί οὖν
  choice: அப்படியானால் ... என்ன
  rationale: οὖν என்பதன் முடிவுரைக்கும் அல்லது விளைவைக் கேட்கும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ποιήσει ... αὐτοῖς
  choice: அவர்களை என்ன செய்வார்
  rationale: தமிழில் ‘அவர்களை என்ன செய்வார்?’ என்பது அவர்களுக்கு எதிராக உரிமையாளர் எடுக்கும் நடவடிக்கையை இயல்பாகக் கேட்கிறது; கிரேக்கத் தத்திவின் சூழல்சார் எதிர்மறை நோக்கையும் காக்கிறது.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின் உரிமையாளர்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ அல்லது ‘எஜமான்’ என்ற பொருள்கள் இருக்கலாம்; இங்கு உவமையின் கதைமட்டத்தில் திராட்சைத்தோட்டத்தைச் சொந்தமாகக் கொண்ட மனிதரைக் குறிப்பதால் ‘உரிமையாளர்’ தெளிவானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: உவமையில் மனித உரிமையாளரைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: உரிமையாளர்
  alternative: ஆண்டவர்; எஜமான்
  rationale: இவ்வசனத்தின் கதைச் சூழலில் இது நேரடியான தெய்வீகப் பட்டமல்ல; தோட்டத்தின் சொந்தக்காரரைக் குறிக்கிறது. ஆகவே ‘உரிமையாளர்’ என்பது உடனடிச் சூழலைத் தெளிவாகத் தருகிறது. அதே நேரத்தில், உவமையின் விரிவான இறையியல் குறிப்பை மறுப்பதில்லை; மூலச்சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வெளியே தள்ளிவிட்டு’ செயல் வரிசையையும் வெளியேற்றத்தின் வலிமையையும் காக்கிறது. கேள்வி இயல்பான தமிழ் நடையில் அமைந்துள்ளது.
