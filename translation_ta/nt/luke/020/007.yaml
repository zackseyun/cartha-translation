lexical_decisions:
- source_word: καὶ
  choice: அதற்கு
  rationale: இணைப்புச் சொல்லை இயந்திரமாக ‘மற்றும்’ என்று மொழிபெயர்க்காமல், முந்தைய கேள்விக்கான பதிலை இயல்பான தமிழ் உரையாடல் ஓட்டத்தில் இணைக்கிறது.
- source_word: ἀπεκρίθησαν
  choice: பதிலளித்தார்கள்
  rationale: ἀποκρίνομαι என்பதன் இறந்தகால வடிவம் இங்கு ‘பதில் சொன்னார்கள்/பதிலளித்தார்கள்’ என்று பொருள்படும்; dignified modern Tamil-க்கு ‘பதிலளித்தார்கள்’ பொருத்தமானது.
- source_word: μὴ εἰδέναι
  choice: தங்களுக்குத் தெரியாது என
  rationale: பதில் கூறும் வினைக்குப் பின் வரும் மறுப்பு infinitive மறைமுகக் கூற்றாகச் செயல்படுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு தரப்படுகிறது.
- source_word: πόθεν
  choice: அது எங்கிருந்து வந்தது
  rationale: ‘எங்கிருந்து’ என்பது தோற்றம் அல்லது மூலத்தைக் குறிக்கிறது. முந்தைய சூழலில் உள்ள யோவானின் திருமுழுக்கை ‘அது’ சுட்டுகிறது; அதன் மூலத்தை மேலதிகமாக விளக்காமல் மூலமொழியின் திறந்த தன்மை காக்கப்படுகிறது.
