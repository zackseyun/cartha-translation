reference: Luke 20:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “ஆசிரியரே, நீங்கள் சரியாகப் பேசுகிறீர்கள், கற்பிக்கிறீர்கள்; யாரிடமும் பாரபட்சம் காட்டுவதில்லை; மாறாக, உண்மையின்படி கடவுளின் வழியைக் கற்பிக்கிறீர்கள் என்பதை நாங்கள் அறிவோம்” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: கேட்டார்கள்
  rationale: வினவுதல் அல்லது கேள்வி எழுப்புதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது. சூழலில் சோதிக்கும் நோக்கம் இருந்தாலும், இந்தச் சொல்லிலேயே பகைமையை மிகைப்படுத்தவில்லை.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: அழைப்புவேற்றுமையிலுள்ள διδάσκαλος என்பதற்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: οἴδαμεν
  choice: எங்களுக்குத் தெரியும்
  rationale: பேசுகிறவர்கள் உறுதியாக அறிந்திருப்பதாகக் கூறுவதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; அவர்களது புகழ்ச்சியின் நேர்மையை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: ὀρθῶς
  choice: சரியாக
  rationale: பேசுதல், கற்பித்தல் ஆகிய இரண்டுடனும் இயல்பாக இணைந்து, சரியான முறையிலும் உண்மைக்கு ஏற்பவும் செய்வதைக் குறிக்கிறது.
- source_word: λέγεις καὶ διδάσκεις
  choice: பேசிக் கற்பிக்கிறீர்கள்
  rationale: கிரேக்கத்தில் உள்ள இரு வினைகளையும் காத்து, தமிழில் இயல்பான தொடராக வழங்குகிறது.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: யாரிடமும் பாரபட்சம் காட்டாமல்
  rationale: சொல்லுக்கு சொல் ‘முகத்தை ஏற்றுக்கொள்ளுதல்’ எனும் மரபுத்தொடர், ஒருவரின் தோற்றம் அல்லது சமூக நிலையை வைத்து சாதகமாக நடத்துவதைச் சுட்டுகிறது. அதன் பொருளைத் தெளிவான தமிழில் தருகிறது.
- source_word: ἐπ’ ἀληθείας
  choice: உண்மையாகவே
  rationale: இது கற்பிக்கும் விதத்தை விவரிப்பதாக வாசிக்கப்படுவதை இயல்பான தமிழில் தருகிறது; ‘உண்மையின்படி’ என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: கடவுளின் வழி
  rationale: கிரேக்கச் சொற்றொடரின் உருவகத்தையும், கடவுளின் சித்தம் அல்லது அவர் காட்டும் வாழ்க்கைநெறி என்ற விரிவான ஒலிப்பையும் காக்கிறது.
- source_word: ἀλλ’
  choice: -ஆமல் … உண்மையாகவே
  rationale: 'கிரேக்கத்தின் முரண்பாட்டை தமிழில் இயல்பான எதிர்மறை எச்சவினை அமைப்பின் மூலம் காட்டுகிறது: பாரபட்சம் காட்டாமல், மாறாக உண்மையாகக் கற்பித்தல்.'
theological_decisions:
- issue: பாரபட்சமின்மையைக் குறிக்கும் மரபுத்தொடர்
  choice: ‘யாரிடமும் பாரபட்சம் காட்டாமல்’ என்று பொருள் வழியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘முகத்தை ஏற்றுக்கொள்ளாமல்’ அல்லது ‘வெளித்தோற்றத்தால் பாதிக்கப்படாமல்’
  rationale: சொல்லுக்கு சொல் மொழிபெயர்ப்பு நவீனத் தமிழில் தெளிவற்றதாக இருக்கும். தேர்ந்த வடிவம், சமூக நிலை அல்லது வெளித்தோற்றத்தின் அடிப்படையில் இயேசு ஒருதலைப்பட்சமாக நடப்பதில்லை என்ற கருத்தைக் காக்கிறது.
- issue: ἐπ’ ἀληθείας எதனுடன் இணைகிறது
  choice: ‘உண்மையாகவே கடவுளின் வழியைக் கற்பிக்கிறீர்கள்’ என்று கற்பிக்கும் முறையுடன் இணைக்கப்பட்டது.
  alternative: ‘உண்மையின்படி கடவுளின் வழியைக் கற்பிக்கிறீர்கள்’
  rationale: இரண்டும் கிரேக்கத்தின் பொருள் வரம்புக்குள் உள்ளன. முதன்மை உரை இயல்பான தமிழ் நடையைப் பயன்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மையான ‘நீங்கள்’ இயேசுவை நேரடியாக அழைக்கும் உரைக்கு இயல்பாக உள்ளது. கிரேக்கத்தின் நீளமான புகழ்ச்சிக் கூற்றைத் தமிழில் தெளிவாக வைத்திருக்க ‘என்றும் … என்றும்’ என்ற இணைப்பு பயன்படுத்தப்பட்டுள்ளது.
