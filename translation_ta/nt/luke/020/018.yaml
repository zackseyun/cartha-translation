source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: ta
  text: அந்தக் கல்லின்மேல் விழும் ஒவ்வொருவரும் நொறுங்கிப்போவார்[a]. ஆனால் அந்தக் கல் எவர்மேல் விழுமோ, அவரை அது நசுக்கிவிடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிதறுண்டுபோவார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரைப் பொடிப்பொடியாக்கிவிடும்’ அல்லது ‘பதரைப்போல் சிதறடித்துவிடும்.’ கிரேக்க வினைச்சொல் வெறுமனே மோதுவதைக் காட்டிலும் வலுவான பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: விழும் ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினை பொதுவான, எல்லாரையும் உள்ளடக்கும் பொருளைக் கொண்டுள்ளது. ‘ஒவ்வொருவரும்’ என்பது அதன் பரப்பை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: அந்தக் கல்லின்மேல்
  rationale: πίπτω என்பதுடன் வரும் ἐπί இயக்கம் சென்று கல்லின்மேல் விழுவதைக் குறிக்கிறது; ἐκεῖνον என்பதன் சுட்டுப்பொருளும் ‘அந்த’ என்பதால் காக்கப்படுகிறது.
- source_word: συνθλασθήσεται
  choice: நொறுங்கிப்போவார்
  rationale: இந்த எதிர்காலச் செயப்பாட்டு வடிவம் முற்றிலும் உடைந்து சிதைவதைக் குறிக்கிறது. ‘நொறுங்கிப்போவார்’ கடுமையான விளைவை இயல்பாகச் சொல்கிறது; மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ஆனால் அந்தக் கல் எவர்மேல் விழுமோ
  rationale: ἄν உடன் வரும் தொடர்புச் சொற்றொடர் குறிப்பற்ற நிபந்தனையை—‘எவர்மேல் விழுந்தாலும்’ என்ற பொருளை—வெளிப்படுத்துகிறது. தெளிவுக்காக மறைந்துள்ள எழுவாய் ‘அந்தக் கல்’ என்று மீண்டும் சொல்லப்பட்டுள்ளது.
- source_word: λικμήσει
  choice: நசுக்கிவிடும்
  rationale: λικμάω நசுக்குதல், பொடியாக்குதல், அல்லது பதரைப்போல் சிதறடித்தல் என்ற வலுவான படிமத்தைக் கொண்டிருக்கலாம். பிரதான உரையில் ‘நசுக்கிவிடும்’ தெளிவாகவும் கடுமையாகவும் உள்ளது; மற்ற நுணுக்கங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது ஒருமை முன்னிலையைக் குறிக்கும் பிரதிப்பெயர். தமிழில் ‘அவரை’ ஒருமையையும் பொதுவான மனிதக் குறிப்பையும் இயல்பாகக் காக்கிறது; ‘அவனை’ என்று ஆண் பாலைக் குறிப்பாக வலியுறுத்தி மூலத்தின் பொதுப்பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: கல்லின் நியாயத்தீர்ப்புப் படிமம்
  choice: கல்லை அழிவை உண்டாக்கும் நியாயத்தீர்ப்பின் செயற்பாட்டாளராகவே வைத்து, வினைச்சொற்களின் கடுமையைத் தணிக்காமல் மொழிபெயர்த்தல்
  alternative: இதை வெறும் இடறல் அல்லது சிறு காயம் என மென்மைப்படுத்துதல்
  rationale: முந்தைய மேற்கோளின் சூழலில் கல் தீர்மானமான நியாயத்தீர்ப்பைச் சித்தரிக்கிறது. συνθλασθήσεται மற்றும் λικμήσει ஆகிய இரு வினைகளும் கடுமையான அழிவைக் குறிக்கின்றன; வசனத்தைத் தாண்டிய விளக்கத்தைச் சேர்க்காமல் அந்த வலிமை காக்கப்படுகிறது.
- issue: பொதுவான ஒருமை மனிதக் குறிப்பு
  choice: ‘அவரை’ என்று ஒருமை பொதுக்குறிப்பைப் பயன்படுத்துதல்
  alternative: ‘அவனை’ என்று இலக்கண ஆண்பாலை வெளிப்படையாகக் காட்டுதல் அல்லது ‘அவர்களை’ என்று பன்மையாக்குதல்
  rationale: கிரேக்கத்தில் αὐτόν ஆண்பால் ஒருமையாக இருந்தாலும் அதன் முன்னிலை குறிப்பற்ற, பொதுவான மனிதரைக் குறிக்கிறது. தமிழில் ‘அவரை’ ஒருமையைக் காத்தபடி பாலைக் தேவையின்றி குறிப்பாக்காமல் இயல்பாக அந்த பிரதிநிதித்துவப் பொருளைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் இயல்பான ஓட்டத்திற்காக ‘நொறுங்கிப்போவார்’ என்றும், இரண்டாவது வாக்கியத்தின் வலுவான தீர்ப்புப் படிமத்திற்காக ‘நசுக்கிவிடும்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
