base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: ta
  text: 'பின்பு அவர் மக்களிடம் இந்த உவமையைச் சொல்லத் தொடங்கினார்: “ஒருவன் ஒரு திராட்சைத்தோட்டத்தை நட்டு, அதை விவசாயிகளுக்குக் குத்தகைக்கு விட்டுவிட்டு, நீண்ட காலம் வெளியூருக்குச் சென்றான்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெடுங்காலம் வெளிநாட்டுக்குச் சென்றான்.” இந்த வினைச்சொல் ஒருவர் தம் சொந்தப் பகுதியைவிட்டு வேறிடத்தில், சில சமயம் வெளிநாட்டில், இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: பின்பு … தொடங்கினார்
  rationale: δέ இங்கு நிகழ்ச்சியின் அடுத்த கட்டத்தைக் குறிக்கிறது; ἤρξατο பேச்சுச் செயல் தொடங்கியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: மக்களிடம் … சொல்ல
  rationale: λαός என்பதன் கூட்டு உணர்வை ‘மக்கள்’ காக்கிறது; உவமையை அறிமுகப்படுத்தும் சூழலில் λέγειν என்பதற்கு ‘சொல்ல’ இயல்பானது.
- source_word: τὴν παραβολὴν ταύτην
  choice: இந்த உவமையை
  rationale: παραβολή என்பதற்கான வழக்கமான, வகையைத் தெளிவாகக் காட்டும் தமிழ் சொல் ‘உவமை’.
- source_word: Ἄνθρωπος
  choice: ஒருவன்
  rationale: கதையில் அறிமுகமாகும் குறிப்பிட்ட ஆண் நபரைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ஒரு திராட்சைத்தோட்டத்தை நட்டு
  rationale: φυτεύω என்பதன் நேரடிப் பொருள் ‘நடு’; ἀμπελών என்பது திராட்சைத்தோட்டம்.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: அதை விவசாயிகளுக்குக் குத்தகைக்கு விட்டுவிட்டு
  rationale: ἐκδίδωμι இச்சூழலில் நிலத்தை குத்தகைக்கு விடுவதைக் குறிக்கிறது; γεωργοί என்பதன் பரந்த பொருளான ‘விவசாயிகள்’ காக்கப்படுகிறது.
- source_word: ἀπεδήμησεν χρόνους ἱκανούς
  choice: நீண்ட காலம் வெளியூருக்குச் சென்றான்
  rationale: ἀποδημέω சொந்த இடத்திலிருந்து வேறிடத்துக்குச் செல்வதை, சில வேளைகளில் வெளிநாடு செல்வதையும் குறிக்கலாம்; χρόνοι ἱκανοί கணிசமான கால அளவைக் காட்டுகிறது.
theological_decisions:
- issue: Ἄνθρωπος என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஒருவன்
  alternative: ஒரு நபர்
  rationale: இது பொதுவான மனிதகுலத்தைக் குறிப்பிடாமல் கதையிலுள்ள ஓர் ஆண் நில உரிமையாளரை அறிமுகப்படுத்துவதால், மூலத்தின் ஆண்பால் குறிப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. குத்தகை உறவை வினைச்சொல் வெளிப்படுத்துகிறது; γεωργοί தனியாக ‘குத்தகைக்காரர்கள்’ என்று குறுக்கப்படாமல் ‘விவசாயிகள்’ என வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் வெளியூர் செல்லும் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
