reference: Luke 20:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: ta
  text: 'அவர்கள் அவரிடம், “எங்களுக்குச் சொல்லுங்கள்: எந்த அதிகாரத்தால் இவற்றைச் செய்கிறீர்? அல்லது இந்த அதிகாரத்தை உமக்குக் கொடுத்தவர் யார்?” என்றார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: கிரேக்க இணைப்புச்சொல் முந்தைய நிகழ்வோடு எளிய தொடர்ச்சியை ஏற்படுத்துகிறது. தமிழில் தனியாக ‘மேலும்’ என்று தொடங்குவதைவிட, வாக்கியத்தின் இயல்பான கதைத் தொடர்ச்சியில் அது வெளிப்படுகிறது.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: ‘சொல்லி அவரிடம் கூறினார்கள்’ என்ற தேவையற்ற மீளுரைப்பைத் தவிர்த்து, பேச்சு அவரை நோக்கியது என்பதையும் பிரதான வினையையும் இயல்பான தமிழில் முழுமையாகக் காட்டுகிறது.
- source_word: Εἰπὸν ἡμῖν
  choice: எங்களுக்குச் சொல்லுங்கள்
  rationale: கட்டளை வடிவத்தின் நேரடியான வேண்டுகோளை நவீன, மரியாதையான தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: இங்கு ἐν செயல் நடைபெறுவதற்கான அதிகார அடிப்படையைக் குறிக்கிறது; ‘எந்த அதிகாரத்தில்’ என்பதைவிட ‘எந்த அதிகாரத்தால்’ தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ταῦτα ποιεῖς
  choice: இவற்றைச் செய்கிறீர்
  rationale: ταῦτα என்பதன் பன்மையை ‘இவற்றை’ காக்கிறது; நிகழ்காலச் செயலை ‘செய்கிறீர்’ வெளிப்படுத்துகிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: அதே சவாலை மாற்று வடிவில் முன்வைக்கும் இரண்டாவது கேள்வியைத் தெளிவாக இணைக்கிறது.
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: உமக்குக் கொடுத்தவர் யார்
  rationale: ὁ δούς என்ற பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவத்தை ‘கொடுத்தவர்’ எனக் காத்து, தமிழில் இயல்பான கேள்வி அமைப்பை வழங்குகிறது.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: இந்த அதிகாரத்தை
  rationale: ταύτην என்பதன் சுட்டுப்பொருளையும், ἐξουσία என்பதன் அங்கீகரிக்கப்பட்ட உரிமை அல்லது அதிகாரம் என்ற சூழல்சார் பொருளையும் காக்கிறது.
theological_decisions:
- issue: ஆலயச் சூழலில் ἐξουσία என்பதன் பொருள்
  choice: அதிகாரம்
  alternative: வல்லமை; உரிமை
  rationale: கேள்வி இயேசுவின் செயல்திறனைப் பற்றியது அல்ல; அவர் இவற்றைச் செய்வதற்கான அங்கீகாரமும் அதன் மூலமும் பற்றியது. ‘அதிகாரம்’ இந்த நிறுவன மற்றும் இறையியல் அழுத்தத்தைத் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் ‘செய்கிறீர்’, ‘உமக்கு’ என்ற மரியாதை ஒருமை வடிவங்கள் dignified register-ஐக் காக்கின்றன; பேச்சாளர்களின் சவாலான தொனியை மென்மைப்படுத்தவில்லை.
