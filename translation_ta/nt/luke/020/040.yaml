  text: For they no longer dared to ask him anything.
translation:
  language: ta
  text: ஏனெனில், அதன்பின் அவர்கள் அவரிடம் எதையும் கேட்கத் துணியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: அதற்குப் பிறகு … இல்லை
  rationale: முன்பு இருந்த செயல் அந்தக் கட்டத்திலிருந்து நின்றுவிட்டது என்ற காலப்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுக்கான விளக்கத்தையோ காரணத்தையோ இணைக்கும் சொல்லாக உள்ளதால், அதன் தொடர்பை வெளிப்படையாகப் பேணுகிறது.
- source_word: ἐτόλμων
  choice: துணியவில்லை
  rationale: τολμάω என்பதன் துணிவு கொள்ளுதல் என்ற பொருளைத் தருகிறது; இறந்தகால imperfect வடிவத்தின் தொடர்நிலை, οὐκέτι என்பதுடன் சேர்ந்து ‘அதற்குப் பிறகு … இல்லை’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἐπερωτᾶν
  choice: கேட்க
  rationale: இங்கு கேள்வி கேட்பதைக் குறிக்கும் infinitive-ஐ எளிய, இயல்பான தமிழில் வழங்குகிறது; ‘விசாரிக்க’ என்பது தேவையற்ற கடுமையைச் சேர்க்கலாம்.
- source_word: αὐτὸν
  choice: அவரிடம்
  rationale: இயேசுவைக் குறிக்கும் pronoun-ஐ, ‘கேட்பது’ என்ற தமிழ் வினையுடன் இயல்பாக வரும் இடவேற்றுமை வடிவில் தருகிறது.
- source_word: οὐδέν
  choice: எதையும்
  rationale: எதிர்மறை வினையுடன் சேர்ந்து ‘ஒன்றைக்கூட’ என்ற முழுமையான பரப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் விளக்கத் தொடர்பும், இனி கேள்வி கேட்கத் துணியாத நிலையும் தெளிவாக வைக்கப்பட்டுள்ளன; அடிக்குறிப்பு தேவையில்லை.
