  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: ta
  text: அப்படியானால், உயிர்த்தெழுதலில்[a] அந்தப் பெண் அவர்களில் யாருடைய மனைவியாக ஆவாள்?[b] ஏனெனில், அந்த ஏழு பேரும் அவளை மனைவியாகக் கொண்டிருந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிர்த்தெழுதலின்போது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களில் யாருக்கு அவள் மனைவியாக இருப்பாள்?”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவளைத் திருமணம் செய்திருந்தார்கள்.” மூலமொழியில் சொல்லர்த்தமாக, “அவளை மனைவியாகக் கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: முதல் இடத்தில் γυνή, ஏற்கெனவே பேசப்பட்ட பெண்ணைக் குறிக்கிறது; இங்கு திருமண உறவைக் காட்டும் ‘மனைவி’ என்பதைக் காட்டிலும் ‘அந்தப் பெண்’ இயல்பாக உள்ளது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: சதுசேயர்களின் வாதத்தில் இருந்து எழும் முடிவுக் கேள்வியை இயல்பான நவீனத் தமிழில் காட்டுகிறது; ‘ஆகவே’ என்பதைவிட உரையாடலுக்கு ஏற்றது.
- source_word: ἐν τῇ ἀναστάσει
  choice: உயிர்த்தெழுதலில்
  rationale: மூலத்தின் ἐν என்ற முன்னிடைச்சொல் அமைப்பை நெருக்கமாகப் பேணுகிறது; நிகழ்வின் நேரத்தை வலியுறுத்தும் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τίνος αὐτῶν
  choice: அவர்களில் யாருடைய
  rationale: உறவு அல்லது உரிமையைக் கேட்கும் genitive interrogative τίνος-ஐ ‘யாருடைய’ என்று நேரடியாகக் காட்டுகிறது.
- source_word: γίνεται
  choice: மனைவியாகிறாள்
  rationale: γίνομαι-இன் ‘ஆகுதல்/ஆகிவிடுதல்’ என்ற இயக்கநிலையைப் பேணுகிறது; வெறுமனே ‘இருப்பாள்’ என்று நிலைச்சொல்லாக மாற்றவில்லை.
- source_word: γυνή
  choice: மனைவி
  rationale: வினையின் நிரப்பியாக வரும் இரண்டாம் γυνή இங்கு திருமண உறவையே தெளிவாகக் குறிக்கிறது.
- source_word: οἱ γὰρ ἑπτὰ
  choice: ஏனெனில், அந்த ஏழு பேரும்
  rationale: γάρ-இன் காரணவிளக்கத் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது; கட்டுரையுடன் வரும் ‘ஏழு’ முன்பு குறிப்பிடப்பட்ட ஏழு சகோதரர்களைக் குறிக்கிறது.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: அவளை மனைவியாகக் கொண்டிருந்தார்கள்
  rationale: ‘அவளை மனைவியாக வைத்திருந்தனர்/கொண்டிருந்தனர்’ என்ற உறவுநிலையைப் பேணுகிறது; ‘அவளைத் திருமணம் செய்தார்கள்’ என்று செயலை மட்டும் முன்னிறுத்தவில்லை.
theological_decisions:
- issue: சதுசேயர்களின் கேள்வியில் ἀνάστασις என்பதன் பொருள்
  choice: எந்த விளக்கச் சேர்க்கையும் இன்றி ‘உயிர்த்தெழுதல்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இறந்தோரின் உயிர்த்தெழுதல்’
  rationale: இந்த வசனத்தில் ἀνάστασις மட்டுமே உள்ளது. சூழலிலிருந்து ‘இறந்தோரின்’ என்பதைச் சேர்க்காமல், கேள்வியின் இறையியல் பதற்றத்தையும் சொல் அளவையும் அப்படியே பேணுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் வாதத் தொனிக்காக ‘அப்படியானால்’ தேர்ந்தெடுக்கப்பட்டது; திருமண உறவின் தொடர்நிலையைச் சுட்ட ‘மனைவியாகக் கொண்டிருந்தார்கள்’ பயன்படுத்தப்பட்டது.
