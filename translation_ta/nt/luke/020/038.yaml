  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: ta
  text: அவர் இறந்தவர்களின் இறைவன் அல்ல; மாறாக, உயிரோடிருப்பவர்களின் இறைவன். ஏனெனில், அனைவரும் அவருக்கு உயிருள்ளவர்களாக இருக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், அனைவரும் அவர் முன்னிலையில் உயிரோடிருக்கிறார்கள்.”
    reason: αὐτῷ ζῶσιν என்ற கிரேக்கச் சொற்றொடரில் αὐτῷ என்பதன் சாத்தியமான மாற்று விளக்கத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: θεὸς
  choice: இறைவன்
  rationale: யூத ஒரே-இறைக் சூழலில் θεός குறிப்பிட்ட ஒரே இறைவனைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மரியாதையுடனும் ‘இறைவன்’ என வழங்கப்பட்டது.
- source_word: δὲ
  choice: ஆனால் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான தொடர்ச்சி அல்லது எதிர்மறை மாறுதலைக் குறிக்கிறது; οὐκ ... ἀλλὰ அமைப்பிலுள்ள ‘அல்ல; ...’ என்ற தமிழ்ச் சொல்லாக்கமே எதிர்மறை வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νεκρῶν
  choice: இறந்தவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் பன்மை வடிவம்; ‘இறந்தவர்களின் இறைவன்’ என்பது கிரேக்கத்தின் சுருக்கமான அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ζώντων
  choice: வாழ்கிறவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினை; ‘இறந்தவர்கள்’ என்பதற்கு நேரான எதிரிணையாகவும் நிகழ்நிலை வாழ்வை உணர்த்துவதாகவும் உள்ளது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: சூழலில் முன்னோர்களைக் குறிப்பிட்டாலும், கிரேக்கத்தின் பரந்த மற்றும் சுருக்கமான எல்லையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: இடவேற்றுமையின் சுருக்கமான உறவுப்பொருளை நேரடியாகக் காக்கிறது; ‘அவருக்காக’ அல்லது ‘அவர் முன்னிலையில்’ என்று பொருளைத் தீர்மானித்து விடவில்லை.
- source_word: ζῶσιν
  choice: வாழ்கிறார்கள்
  rationale: நிகழ்கால வினையை நேரடியாக வழங்கி, ‘உயிரோடிருக்கிறார்கள்’ என்ற சாத்தியமான விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
theological_decisions:
- issue: πάντες γὰρ αὐτῷ ζῶσιν என்பதில் αὐτῷ என்பதன் பொருள்
  choice: ஏனெனில், அனைவரும் அவருக்கு வாழ்கிறார்கள்
  alternative: ஏனெனில், அனைவரும் அவர் முன்னிலையில் உயிரோடிருக்கிறார்கள்
  rationale: ‘அவருக்கு’ என்பது கிரேக்க இடவேற்றுமையின் உறவுசார் சுருக்கத்தையும் உயிர்த்தெழுதலைப் பற்றிய இயேசுவின் வாதத்திலுள்ள இறையியல் அழுத்தத்தையும் காக்கிறது; அதனை ‘அவருக்காக’ அல்லது ‘அவர் முன்னிலையில்’ என்று ஒரே விளக்கமாகத் தீர்மானிக்கவில்லை.
