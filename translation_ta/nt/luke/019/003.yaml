    text: அல்லது, “அவர் குள்ளமாக இருந்தார்.” கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல் உடல் உயரத்தில் சிறியவர் என்பதைக் குறிக்கிறது; இச்சூழலில் இது வயதை அல்ல, உடல் உயரத்தைக் குறிக்கிறது.
