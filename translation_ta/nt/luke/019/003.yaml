  text: அவர் இயேசு யார் என்று பார்க்க முயன்றுகொண்டிருந்தார். ஆனால் கூட்டத்தின் காரணமாக அவரால் பார்க்க முடியவில்லை; ஏனெனில் அவர் உயரம் குறைந்தவராக இருந்தார்[a].
  philosophy: optimal-equivalence
