source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: ta
  text: ஆனால் அவனுடைய குடிமக்கள் அவனை வெறுத்தார்கள்; அவர்கள், ‘இவன் எங்கள்மேல் அரசாளுவதை நாங்கள் விரும்பவில்லை’ என்று கூறி, அவனுக்குப் பின்னால் ஒரு தூதுக்குழுவை[a] அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு தூதர்க் குழு.’ கிரேக்கச் சொல் அதிகாரபூர்வ பணிக்காக அனுப்பப்படும் பிரதிநிதிகள் குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: குடிமக்கள்
  rationale: அரசியல் சமூகத்தின் உறுப்பினர்கள் என்ற குடியியல் பொருளை இது தெளிவாகக் காக்கிறது; ‘குடிகள்’ அல்லது ‘கீழ்ப்பட்டவர்கள்’ என்பது அவர்கள் மறுக்கும் அரசாட்சியை முன்கூட்டியே ஏற்றுக்கொண்டதாகத் தோன்றலாம்.
- source_word: ἐμίσουν
  choice: வெறுத்தார்கள்
  rationale: நீடித்த அல்லது இயல்பான பகைமையைச் சுட்டும் இறந்தகால வினையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀπέστειλαν
  choice: அனுப்பினார்கள்
  rationale: கதைநடையின் நிறைவுற்ற செயலை எளிமையாகவும் இயல்பாகவும் தருகிறது.
- source_word: πρεσβείαν
  choice: ஒரு தூதுக்குழுவை
  rationale: அதிகாரபூர்வ பணிக்காக அனுப்பப்படும் பிரதிநிதிகள் குழு என்ற அரசியல் பொருளை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ὀπίσω αὐτοῦ
  choice: அவனைத் தொடர்ந்து
  rationale: அவன் சென்ற திசையில் அவனுக்குப் பின்னால் குழு அனுப்பப்பட்டது என்ற சூழல்சார் பொருளைக் காக்கிறது; ‘அவனுக்குப் பின்னால்’ என்பது தமிழில் நோக்கத்தைத் தவறாக உணர்த்தக்கூடும்.
- source_word: λέγοντες
  choice: என்று சொல்லி
  rationale: தூதுக்குழு எடுத்துச் சென்ற செய்தியை நேரடி மேற்கோளுடன் இயல்பாக இணைக்கிறது.
- source_word: Οὐ θέλομεν
  choice: நாங்கள் விரும்பவில்லை
  rationale: அவர்களுடைய விருப்பமின்மையையும் திட்டவட்டமான மறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῦτον
  choice: இவன்
  rationale: அருகுச் சுட்டுப் பெயரின் விலகிய, ஓரளவு இகழ்ச்சியான தொனியை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: எங்கள்மேல் அரசாளுவதை
  rationale: பொதுவான ஆட்சியைக் காட்டிலும் அரசன் சார்ந்த அரசாட்சி நுணுக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உவமையிலுள்ள அரசியல் மற்றும் அரச நுணுக்கம்
  choice: ‘எங்கள்மேல் அரசாளுவதை’ என்று வெளிப்படையான அரச மொழியைத் தக்கவைத்தல்
  alternative: ‘எங்களை ஆள்வதை’
  rationale: βασιλεύω என்பதிலுள்ள அரசன்/அரசாட்சி சார்ந்த படிமத்தைப் பொதுவான அதிகார மொழியாகச் சமப்படுத்தாமல் காக்கிறது; அதேவேளையில் உவமையின் அடையாளப் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி மேற்கோளில் ‘இவன்’ என்பது மூலத்தின் விலகிய தொனியைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘தூதுக்குழு’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
