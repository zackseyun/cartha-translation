  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: ta
  text: அவன் அவனிடம், “சபாஷ், நல்ல அடிமையே! மிகச் சிறிய காரியத்தில் நீ நம்பிக்கைக்குரியவனாய் இருந்ததால், பத்து நகரங்கள்மேல் அதிகாரம் உடையவனாக இரு” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὖγε
  choice: நன்று
  rationale: பாராட்டை வெளிப்படுத்தும் சுருக்கமான இயல்பான வியப்புச்சொல்; சூழலில் ‘சிறப்பாகச் செய்தாய்’ என்ற பொருளைத் தருகிறது.
- source_word: ἀγαθὲ δοῦλε
  choice: நல்ல அடிமையே
  rationale: ἀγαθός என்பதன் நேரடியான ‘நல்ல’ என்ற பொருளையும், எஜமானுக்குச் சொந்தமாகவும் கீழ்ப்பட்டும் இருப்பதை δοῦλος குறிக்கும் வலிமையையும் காக்கிறது.
- source_word: ἐν ἐλαχίστῳ
  choice: மிகச் சிறிய ஒன்றில்
  rationale: பெயர்ச்சொல் வெளிப்படையாக இல்லாத கிரேக்க நடுநிலை வடிவத்தின் பொதுமையையும், மிகக் குறைந்த பொறுப்பு என்ற கருத்தையும் காக்கிறது.
- source_word: πιστὸς ἐγένου
  choice: நம்பிக்கைக்குரியவனாய் இருந்தாய்
  rationale: πιστός இங்கு ஒப்படைக்கப்பட்ட பொறுப்பில் விசுவாசமாகவும் நம்பத்தக்கவனாகவும் இருந்ததைக் குறிக்கிறது; ἐγένου என்பதை அளவுக்கு மீறி ‘நிரூபித்தாய்’ என விரிவாக்காமல் தருகிறது.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: அதிகாரம் பெற்றிரு
  rationale: அதிகாரத்தை உடைய நிலையில் இருக்குமாறு கூறும் சுற்றுவழி கட்டளை அமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπάνω δέκα πόλεων
  choice: பத்துப் பட்டணங்கள்மேல்
  rationale: ஆட்சியதிகாரச் சூழலில் ἐπάνω என்பதன் ‘மேல்’ என்ற உறவையும் πόλεις என்பதன் நகர்ப்புற அலகுகளையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: உவமையின் எஜமான்–δοῦλος உறவைத் தமிழில் வெளிப்படுத்துதல்
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாள்
  rationale: δοῦλος வெறும் கூலிப் பணியாளனைவிட எஜமானுக்குக் கீழ்ப்பட்ட, அவருக்குச் சொந்தமான நிலையைக் குறிக்க முடியும். உவமையின் அதிகார உறவை மங்கச் செய்யாமல் ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது; இதிலிருந்து தனிப்பட்ட கோட்பாட்டு முடிவு எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், உவமையின் மரியாதைமிக்க ஆனால் நேரடியான எஜமான்–அடிமை உரையாடல் நடை காக்கப்பட்டது. ‘பட்டணம்’ என்பது ஆட்சிக்குட்பட்ட நகரைக் குறிக்கும் இயல்பான வேதாகமத் தமிழ்ச் சொல்; வாக்கியம் சாதாரண வாசகருக்கும் தெளிவாக அமைக்கப்பட்டது.
