  naturalness: The Tamil is clear, modern, and appropriately dignified. A single sentence better reflects the source's unified causal-purpose structure while remaining natural. «வரவழைக்கும்படி» is a direct, idiomatic rendering of the passive ‘to be summoned to him.’
  terminology: «அரசுரிமை» appropriately conveys βασιλεία here as royal authority/kingship rather than a territorial kingdom. «அடிமைகள்» preserves the social force of δούλους. «பணம்» is appropriate for ἀργύριον in this context, and «வணிகம் செய்து என்ன ஈட்டியிருந்தார்கள்» faithfully retains both commercial activity and result.
