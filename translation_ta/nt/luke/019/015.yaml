  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: ta
  text: அவர் அரசுரிமையைப் பெற்ற பிறகு திரும்பி வந்தபோது, தான் பணம் கொடுத்திருந்த அந்த அடிமைகளைத் தன்னிடம் வரவழைக்கும்படி கட்டளையிட்டார்; அவர்கள் வணிகம் செய்து என்ன ஈட்டியிருந்தார்கள்[a] என்பதை அறியவே அவர் அவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் என்ன வணிகம் செய்திருந்தார்கள்” அல்லது “அவர்கள் எவ்வளவு இலாபம் ஈட்டியிருந்தார்கள்.” கிரேக்க வினைச்சொல் வணிகத்தில் ஈடுபடுவதையும் அதனால் கிடைத்த விளைவையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: அவர் ... திரும்பி வந்தபோது
  rationale: ἐν என்பதுடன் வரும் articular infinitive இங்கு காலத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பான காலவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: λαβόντα τὴν βασιλείαν
  choice: அரசுரிமையைப் பெற்றுக்கொண்டு
  rationale: உவமையின் அரசியல் சூழலில் βασιλεία என்பது நிலப்பரப்பைவிட அரசராக ஆளும் உரிமையைக் குறிக்கிறது; λαμβάνω வலுக்கட்டாயமாகக் கைப்பற்றுதல் என்று அவசியம் பொருள்படாததால் ‘பெற்றுக்கொண்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: φωνηθῆναι αὐτῷ
  choice: தன்னிடம் அழைத்து வரும்படி
  rationale: இங்குள்ள passive infinitive, அவருடைய முன்னிலையில் வருமாறு அழைப்பித்தல் அல்லது வரவழைத்தல் என்ற பொருளுடையது.
- source_word: δούλους
  choice: அடிமைகளை
  rationale: δοῦλος என்பது எஜமானின் அதிகாரத்திற்குக் கட்டுப்பட்ட அடிமை நிலையைக் குறிக்கிறது; இச்சூழலில் அந்தச் சமூக உறவை மறைக்காமல் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: δεδώκει τὸ ἀργύριον
  choice: பணம் கொடுத்திருந்த
  rationale: Pluperfect வடிவம் அவர் திரும்புவதற்கு முன்பே பணம் கொடுத்திருந்ததைச் சுட்டுகிறது; ἀργύριον இங்கு வெள்ளி என்ற உலோகத்தைவிட பணத்தைக் குறிக்கிறது.
- source_word: ἵνα γνοῖ
  choice: அறியவே
  rationale: ἵνα உடன் வரும் subjunctive நோக்கத்தை வெளிப்படுத்துகிறது; தமிழில் ‘அறியவே’ அந்த நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τί διεπραγματεύσαντο
  choice: வணிகம் செய்து என்ன ஈட்டியிருந்தார்கள்
  rationale: வினைச்சொல் வணிக நடவடிக்கையையும் அதனால் வந்த முடிவையும் உள்ளடக்குகிறது; மொழிபெயர்ப்பு அந்த இரு கூறுகளையும் காக்கிறது.
theological_decisions:
- issue: உவமையின் பொருளாதாரச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: அந்த மனிதர் இவர்கள்மேல் கொண்டிருந்த எஜமான அதிகாரமும் அவர்களுடைய பிணைக்கப்பட்ட சமூக நிலையும் இங்கு முக்கியம். ஆகவே பொதுவான பணியாளர் உறவைக் குறிக்கும் சொற்களைவிட ‘அடிமைகள்’ மூலத்தின் சமூக உண்மையைத் தெளிவாகக் காக்கிறது.
- issue: βασιλεία என்பதன் சூழல்சார் பொருள்
  choice: அரசுரிமை
  alternative: அரசாட்சி / ராஜ்யம்
  rationale: இங்கு ஒருவர் பயணம் செய்து பெற்று வருவது ஒரு நிலப்பரப்பு அல்ல, அரசராக ஆளும் உரிமை அல்லது பதவி. ‘அரசுரிமை’ அந்த அரசியல் கருத்தைத் தெளிவுபடுத்துகிறது; இதை ஆன்மீக ராஜ்யம் என்று முன்கூட்டியே விளக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் உவமையின் அரசியல்-பொருளாதாரச் சூழலைக் காக்கும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
