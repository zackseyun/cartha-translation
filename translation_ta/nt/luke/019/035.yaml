translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் நிகழ்வு வரிசை பாதுகாக்கப்பட்டுள்ளது. πῶλος என்பதன் சூழல்சார் பொருள் நேரடியாக ‘கழுதைக்குட்டி’ எனத் தரப்பட்டதால் தனி அடிக்குறிப்பு தேவையில்லை.
