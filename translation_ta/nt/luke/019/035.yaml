  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: ta
  text: அவர்கள் அந்தக் கழுதைக்குட்டியை இயேசுவிடம் கொண்டுவந்தார்கள். பின்பு தங்கள் மேலாடைகளை அதன்மேல் போட்டு, இயேசுவை அதன்மேல் ஏற்றினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: கொண்டுவந்தார்கள்
  rationale: ἄγω என்பதன் இறந்தகால வடிவம் இங்கு கழுதைக்குட்டியை இயேசுவிடம் அழைத்து வந்த செயலைக் குறிக்கிறது; நவீன தமிழில் ‘கொண்டுவந்தார்கள்’ இயல்பாக உள்ளது.
- source_word: αὐτὸν
  choice: அந்தக் கழுதைக்குட்டியை
  rationale: கிரேக்கத்தில் ஆண்பால் சுட்டுப்பெயர் வந்தாலும், அது முந்தைய சூழலிலுள்ள πῶλος-ஐக் குறிக்கிறது. தமிழில் தெளிவுக்காக பெயர்ச்சொல் மீண்டும் கூறப்படுகிறது.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: இயேசுவிடம்
  rationale: πρός + வேற்றுமை உருபு ஒரு நபரை நோக்கிய இயக்கத்தைச் சுட்டுகிறது; ‘இயேசுவிடம்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπιρίψαντες
  choice: போட்டு
  rationale: இந்த இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் நடந்த செயலைக் குறிக்கிறது; ‘பின்பு ... போட்டு’ தமிழில் நிகழ்வுகளின் வரிசையைத் தெளிவாக்குகிறது.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: தங்கள் மேலாடைகளை
  rationale: ἱμάτια இங்கு வெளிப்புற ஆடைகளைக் குறிக்கிறது; ‘மேலாடைகள்’ என்பது ‘ஆடைகள்’ என்பதைவிடத் துல்லியமானதும் புரியத்தக்கதுமாகும்.
- source_word: ἐπὶ τὸν πῶλον
  choice: அதன்மேல்
  rationale: ἐπί இங்கு விலங்கின்மீது ஆடைகளை வைத்ததைக் குறிக்கிறது; முன்பு கழுதைக்குட்டி தெளிவாகக் குறிப்பிடப்பட்டுள்ளதால் சுட்டுப்பெயர் இயல்பானது.
- source_word: πῶλον
  choice: கழுதைக்குட்டி
  rationale: πῶλος பொதுவாக இளம் விலங்கைக் குறிக்கலாம்; உடனடியான லூக்கா 19 சூழலில் இது கழுதையின் குட்டி என்பதால் தமிழில் ‘கழுதைக்குட்டி’ தெளிவாகவும் சூழலுக்கு உண்மையாகவும் உள்ளது.
- source_word: ἐπεβίβασαν
  choice: ஏற்றினார்கள்
  rationale: இந்த வினை ஒருவரை ஒரு விலங்கு அல்லது வாகனத்தின்மேல் ஏறச் செய்வதைக் குறிக்கிறது; ‘ஏற்றினார்கள்’ அதன் காரணவினைப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவை
  rationale: Ἰησοῦς என்ற பெயரின் வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டு, வினையின் நேர்செயப்படுபொருளாக ‘-ஐ’ உருபு சேர்க்கப்பட்டுள்ளது.
