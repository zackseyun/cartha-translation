  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: ta
  text: இவற்றைச் சொன்னபின், அவர் எருசலேமுக்கு ஏறிச் செல்லும்போது, முன்னே சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: பிறகு
  rationale: இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்காமல், நிகழ்வுகளின் தொடர்ச்சியை இயல்பான தமிழில் ‘பிறகு’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: εἰπὼν ταῦτα
  choice: இவற்றைச் சொன்ன பிறகு
  rationale: முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பையும், முந்தைய உரையைச் சுட்டும் பன்மைச் சுட்டுப்பெயரையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐπορεύετο
  choice: நடந்து சென்றார்
  rationale: தொடர்ந்து பயணித்துச் சென்றதை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; கால்நடையாகச் சென்ற சூழலையும் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: ἔμπροσθεν
  choice: முன்னால்
  rationale: மற்றவர்களுக்கு முன்னே இயேசு சென்றார் என்ற இடவியல் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀναβαίνων
  choice: போகும்படி
  rationale: எருசலேமை நோக்கிய பயணத்தை இயல்பாகக் கூறினாலும், கிரேக்கத்தின் நேரடியான ‘மேலே போதல்’ என்ற உருவகத்தைத் தெளிவாகப் பாதுகாக்காத தளர்வான தேர்வு.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: நகருக்குள் நுழைந்தார் என்று முன்கூட்டியே கூறாமல், இலக்கை நோக்கிய இயக்கத்தைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: எருசலேமுக்குச் செல்லும் பயணத்தில் ‘மேலே செல்லுதல்’ என்ற மொழியைப் பாதுகாப்பதா
  choice: இயல்பான தமிழுக்காக ‘எருசலேமுக்குப் போகும்படி’ என்று வழங்கப்பட்டது.
  alternative: ‘எருசலேமுக்கு மேலே சென்றுகொண்டிருந்தார்’ அல்லது ‘எருசலேமை நோக்கி ஏறிச் சென்றார்’
  rationale: ‘மேலே செல்வது’ புவியியல் மற்றும் கதைநடைச் செறிவைக் கொண்டிருந்தாலும், தமிழ் வாசகருக்கு ‘மேலே’ என்பது இயல்பற்றதாகவும் ‘ஏறிச் சென்றார்’ என்பது மலை ஏற்றத்தை மிகைப்படுத்துவதாகவும் தோன்றலாம். இருப்பினும் இத்தேர்வு மூலத்தின் தனித்துவத்தை ஓரளவு தளர்த்துகிறது.
translation_notes:
  register: நவீன, எளிதில் புரியும், மரியாதையான கதைநடைத் தமிழ். ‘அவர்’ என்பது இயேசுவைக் குறிக்கிறது; மூலத்தில் இல்லாத பெயர் அல்லது சீடர்கள் பற்றிய விளக்கம் சேர்க்கப்படவில்லை.
