  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: ta
  text: அவர்கள் அந்தக் கழுதைக்குட்டியை அவிழ்த்துக்கொண்டிருந்தபோது, அதன் உரிமையாளர்கள்[a] அவர்களிடம், “நீங்கள் ஏன் அந்தக் கழுதைக்குட்டியை அவிழ்க்கிறீர்கள்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் எஜமானர்கள்.” கிரேக்கச் சொல் ‘ஆண்டவர்/எஜமான்’ (κύριος) என்பதன் பன்மை வடிவம்; இங்கு அது கழுதைக்குட்டியின் மனித உரிமையாளர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων
  choice: அவிழ்த்துக்கொண்டிருந்தபோது
  rationale: நிகழ்காலச் செயப்பெயரெச்சம் முதன்மை வினையுடன் ஒரே நேரத்தில் நடைபெறும் செயலைக் குறிக்கிறது. கட்டப்பட்டிருந்த விலங்கை விடுவிக்கும் செயலை ‘அவிழ்த்தல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ கதையை மெதுவாக முன்னெடுக்கும் இணைப்பாக உள்ளது. தமிழில் ‘...போது’ என்ற வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுவதால் கூடுதல் ‘மேலும்/ஆனால்’ தேவையில்லை.
- source_word: αὐτῶν
  choice: அவர்கள்
  rationale: முந்தைய சூழலில் அனுப்பப்பட்ட இரு சீடர்களைச் சுட்டுகிறது; பெயர்ச்சொல்லைச் சேர்க்காமல் மூலத்தின் பிரதிப்பெயர் வடிவம் காக்கப்படுகிறது.
- source_word: πῶλον
  choice: அந்தக் கழுதைக்குட்டியை
  rationale: πῶλος என்பது இளம் விலங்கைக் குறிக்கும்; முந்தைய சூழல் இதைக் கழுதைக்குட்டியாக அடையாளப்படுத்துகிறது. ‘அந்த’ என்பது ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட விலங்கை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: λέγω என்பதன் நேரடியான ‘சொல்’ என்ற பொருளைத் தக்கவைத்து, கேள்வி மேற்கோளைத் தொடர்ந்து வரும் இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ κύριοι αὐτοῦ
  choice: அதன் உரிமையாளர்கள்
  rationale: இங்கு κύριοι இறையியல் பட்டப்பெயராக அல்லாமல், கழுதைக்குட்டியின் மனித உடைமையாளர்களைக் குறிக்கிறது. ‘உரிமையாளர்கள்’ சூழலுக்குத் தெளிவான, இயல்பான சொல்.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: பேச்சு வினையுடன் வரும் πρός என்பதன் திசை/பெறுநர் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Τί
  choice: ஏன்
  rationale: சொல்லளவில் ‘என்ன’ என்றாலும், இந்த வினா அமைப்பில் செயலுக்கான காரணத்தை கேட்பதால் ‘ஏன்’ என்பதே பொருத்தமான தமிழ்.
- source_word: λύετε
  choice: அவிழ்க்கிறீர்கள்
  rationale: நிகழ்கால நேரடி வினாவை இயல்பாகக் காட்டுகிறது; λυόντων உடனான ஒரே வேர்ச்சொல் தொடர்பையும் ‘அவிழ்’ என்பதை மீண்டும் பயன்படுத்துவதன் மூலம் காக்கிறது.
theological_decisions:
- issue: இறையியல் சாராத மனித உடைமைச் சூழலில் κύριοι என்பதன் மொழிபெயர்ப்பு
  choice: உரிமையாளர்கள்
  alternative: எஜமானர்கள்
  rationale: κύριος வேறு சூழல்களில் ‘ஆண்டவர்’ அல்லது ‘எஜமான்’ என வரக்கூடும். ஆனால் இங்கு பன்மை வடிவம் கழுதைக்குட்டியை உடைய மனிதர்களைக் குறிக்கிறது; ‘உரிமையாளர்கள்’ தேவையற்ற இறையியல் ஒலிப்பைத் தவிர்த்து சூழலின் நேரடிப் பொருளைத் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘அவிழ்’ என்ற வினை இரு இடங்களிலும் மீண்டும் பயன்படுத்தப்பட்டு மூலத்தின் சொல்லிணைப்பு காக்கப்பட்டுள்ளது.
