source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: ta
  text: 'இவ்வாறு கூறினார்: “இந்த நாளில் நீயும்கூட, சமாதானத்திற்கு வழிவகுப்பவற்றை[b] அறிந்திருந்தால்—! ஆனால் இப்போதோ அவை[c] உன் கண்களிலிருந்து மறைக்கப்பட்டுள்ளன.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: கிரேக்கில் சொல்லுக்குச் சொல், “சமாதானத்தை நோக்கியவை”; அதாவது, சமாதானத்துக்குச் சார்ந்தவை அல்லது அதற்கு வழிவகுப்பவை.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க வினை இலக்கண வடிவில் ஒருமையாக உள்ளது. எனவே சில மொழிபெயர்ப்புகள், “அது உன் கண்களிலிருந்து மறைக்கப்பட்டுள்ளது” என்று வழங்குகின்றன; இங்கு முந்தைய பன்மைத் தொடருடனான தொடர்பைத் தெளிவாக்க “அவை” எனப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: இவ்வாறு கூறினார்
  rationale: இது முந்தைய வசனத்தின் வினையுடன் இணைந்த நிகழ்காலப் பெயரெச்சம். தனி வசனமாக வாசிக்கும்போது தமிழில் இயல்பாக அமைய, அதன் தொடர்ச்சியை உணர்த்தும் வகையில் ‘இவ்வாறு கூறினார்’ என வழங்கப்பட்டுள்ளது.
- source_word: Εἰ ἔγνως
  choice: அறிந்திருந்தால்…!
  rationale: நிறைவேறாத, வேதனை நிறைந்த நிபந்தனையை இது வெளிப்படுத்துகிறது. மூலத்தில் விடப்பட்டுள்ள முடிவுரையைச் சேர்க்காமல், முற்றுப்பெறாத புலம்பலின் வலிமையை நீள்விடைக்குறி காக்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: இந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலைச் சேர்ப்பதில்லை.
- source_word: καὶ σὺ
  choice: நீயும்கூட
  rationale: எருசலேமை நேரடியாக நோக்கிச் சொல்லப்படும் வலியுறுத்தலையும் புலம்பலின் உணர்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: τὰ πρὸς εἰρήνην
  choice: சமாதானத்திற்கு வழிவகுப்பவற்றை
  rationale: ‘சமாதானத்தை நோக்கியவை’ என்ற கிரேக்கச் சொல்லமைப்பின் பன்மையையும், சமாதானத்துக்குச் சார்ந்த அல்லது அதை நோக்கி நடத்தும் காரியங்கள் என்ற பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: εἰρήνην
  choice: சமாதானம்
  rationale: அமைதி, நல்வாழ்வு, வரவிருக்கும் தீர்ப்பைத் தவிர்க்கும் நிலை ஆகிய சூழல்சார் பொருள் வளத்தைத் திறந்தவாறு வைத்திருக்கும் வழக்கமான வேதாகமச் சொல்.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: அறிந்திருக்கக்கூடிய நிலைக்கும் தற்போதைய மறைக்கப்பட்ட நிலைக்கும் இடையிலான கூர்மையான முரணை வெளிப்படுத்துகிறது.
- source_word: ἐκρύβη
  choice: மறைக்கப்பட்டிருக்கின்றன
  rationale: இறந்தகாலச் செயல் தற்போதும் விளைவைக் கொண்டிருப்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது. மறைக்கப்பட்டவை முந்தைய பன்மைத் தொடரையே குறிக்கின்றன என்பதையும் தெளிவாக்குகிறது.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: உன் கண்களுக்கு
  rationale: காணுதல், உணர்தல் ஆகிய இரு பரிமாணங்களும் உள்ள மூல உருவகத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ἐκρύβη என்பதன் மறைமுக எழுவாய்
  choice: மறைக்கப்பட்டவை ‘சமாதானத்திற்கு வழிவகுப்பவை’ என்று பன்மையில் வெளிப்படையாகக் காட்டப்பட்டுள்ளது.
  alternative: ‘அது உன் கண்களுக்கு மறைக்கப்பட்டுள்ளது’ என்ற ஒருமைக் கருத்தாக்கம்.
  rationale: கிரேக்க வினை ஒருமையில் இருந்தாலும், முந்தைய நடுநிலைப் பன்மைத் தொடரை ஒரே கருத்தாகத் தொடர்ந்து குறிக்க முடியும். தமிழில் ‘அவை’ என்பது தொடர்பைத் தெளிவாக்குகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: நிபந்தனைப் புலம்பலின் வலிமை
  choice: மூலத்தில் முடிவுரை விடப்பட்டிருப்பதை ‘அறிந்திருந்தால்…!’ என்று காக்கப்பட்டுள்ளது.
  alternative: ‘அறிந்திருந்தால் எவ்வளவு நன்றாயிருந்திருக்கும்!’ என்று மறைமுக முடிவுரையை வெளிப்படையாகச் சேர்த்தல்.
  rationale: இது வருத்தமும் நிறைவேறாத விருப்பமும் கொண்ட புலம்பல் என்பது தெளிவு. ஆனால் கிரேக்கத்தில் வெளிப்படையாக இல்லாத முடிவுரையை முதன்மை உரையில் சேர்க்காமல், உண்மையான முற்றுப்பெறாமையும் உணர்ச்சித் திடீர்நிறுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் புலம்பலின் உணர்ச்சி வலிமையும் காக்கப்பட்டுள்ளன. ‘சமாதானம்’, ‘மறைக்கப்பட்டிருக்கின்றன’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; அளவுக்கு மீறிய செந்தமிழ் அல்லது சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
