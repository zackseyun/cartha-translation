source:
  edition: SBLGNT
  text: πορευομένου δὲ αὐτοῦ ὑπεστρώννυον τὰ ἱμάτια ⸀ἑαυτῶν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: ta
  text: அவர் போய்க்கொண்டிருந்தபோது, அவர்கள் தங்கள் மேலாடைகளை[a] சாலையில் விரித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆடைகளை.”
    reason: ἱμάτια என்ற கிரேக்கச் சொல் பொதுவாக ஆடைகள் என்றோ, குறிப்பாக மேலாடைகள் என்றோ பொருள்படலாம்.
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: அவர் போய்க்கொண்டிருந்தபோது
  rationale: இது நிகழ்காலப் பங்கேற்புவினையுடன் அமைந்த genitive absolute தொடர்; இயேசு போய்க்கொண்டிருந்த அதே நேரத்தில் மற்றவர்கள் செய்த செயலை இயல்பான தமிழில் உணர்த்துகிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுவதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: ὑπεστρώννυον
  choice: விரித்துக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினைவடிவம் நடந்துகொண்டிருந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது; இந்தத் தொடர்ச்சித் தன்மையைத் தமிழ் வடிவம் காக்கிறது.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: தங்கள் மேலாடைகளை
  rationale: ἱμάτια என்பது பொதுவாக ஆடைகளையும், பல சூழல்களில் குறிப்பாக வெளிப்புற மேலாடைகளையும் குறிக்கலாம். சாலையில் விரிக்கும் இச்சூழலில் ‘மேலாடைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘தங்கள்’ என்பது ἑαυτῶν-இன் தற்சுட்டுப் பொருளைக் காக்கிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: சாலையில்
  rationale: இத்தொடர் செயல் நிகழ்ந்த இடத்தைக் குறிக்கிறது. ‘சாலையில்’ என்பது அவர்கள் இயேசு செல்லும் பாதையில் ஆடைகளை விரித்தனர் என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான இரு செயல்களையும் இயல்பாக வெளிப்படுத்த ‘போய்க்கொண்டிருந்தபோது’ மற்றும் ‘விரித்துக்கொண்டிருந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளன.
