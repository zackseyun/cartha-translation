  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: ta
  text: என்ன செய்யலாம் என்று அவர்களால் ஒரு வழியும் காண முடியவில்லை. ஏனெனில் மக்கள் அனைவரும் அவர் சொல்வதை ஆவலோடு கேட்டுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சொல்லான மாற்று: “மக்கள் அனைவரும் அவரையே பற்றிக்கொண்டு, கேட்டுக்கொண்டிருந்தார்கள்.” இங்குள்ள கிரேக்க மரபுத்தொடர், இயேசுவிடம் அவர்கள் காட்டிய தீவிரமான, ஆவலான கவனத்தை வெளிப்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: அவர்களால் ஒரு வழியும் காண முடியவில்லை
  rationale: எதிர்மறையுடன் வரும் நிறைவுறா இறந்தகால வினை, தொடர்ந்து வழி காண இயலாத நிலையைச் சுட்டுகிறது. தமிழில் நடைமுறையான இயலாமையை இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ τί ποιήσωσιν
  choice: என்ன செய்யலாம் என்று
  rationale: τί உடன் வரும் இறந்தகாலத் துணைவினை, அவர்கள் ஆலோசித்துக்கொண்டிருந்த செயல்திட்டத்தைத் திறந்த நிலையில் வைக்கிறது; ‘என்ன செய்யலாம்’ என்பது அந்த ஆலோசனை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: ஏனெனில் மக்கள் அனைவரும்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத்தைத் தருகிறது; λαός மற்றும் ἅπας இணைந்து மக்களின் முழுமையை வலியுறுத்துகின்றன.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: அவர் சொல்வதை ஆவலோடு
  rationale: இச்சொற்றொடர் ஒருவர்மீது முழுக் கவனத்தையும் ஆழ்ந்த ஆர்வத்தையும் செலுத்துவதைக் குறிக்கும் கிரேக்க மரபுத்தொடர். அடுத்துள்ள ‘கேட்டுக்கொண்டிருந்தார்கள்’ என்பதுடன் இணைத்து, நவீன தமிழில் அதன் பொருள் இயல்பாகத் தரப்பட்டுள்ளது; ‘சொல்வதை’ என்பது கேட்கும் சூழலிலிருந்து வெளிப்படுத்தப்பட்ட பொருள்.
- source_word: ἀκούων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை, மக்கள் ஆவலுடன் கவனம் செலுத்தியபோது நடந்த தொடர்ச்சியான கேட்புச் செயலைக் காட்டுகிறது. கூட்டுப்பெயரான ‘மக்கள் அனைவரும்’ என்பதற்கு ஏற்ற பன்மை வடிவம் தமிழில் பயன்படுத்தப்பட்டுள்ளது.
