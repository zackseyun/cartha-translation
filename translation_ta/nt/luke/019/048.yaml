translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க மரபுத்தொடரின் சொற்சொல்லான வடிவம் தமிழில் இயல்பற்றதாக இருப்பதால் அதன் கருத்து முதன்மை உரையில் தரப்பட்டு, சொற்சொல்லான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
