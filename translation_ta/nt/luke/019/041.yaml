id: LUK.19.41
reference: Luke 19:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: ta
  text: அவர் நெருங்கி வந்தபோது, நகரத்தைக் கண்டு, அதற்காகக் கண்ணீர் விட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: அவர் நெருங்கி வந்தபோது
  rationale: ἐγγίζω என்பது நெருங்குதல் அல்லது அருகே வருதல் என்று பொருள்படும். எதை நெருங்கினார் என்பதைச் சூழல் தெளிவுபடுத்துவதால், மூலத்தில் இல்லாத இடப்பெயர் சேர்க்கப்படவில்லை.
- source_word: ἰδὼν τὴν πόλιν
  choice: நகரத்தைக் கண்டு
  rationale: இறந்தகால வினையெச்சமான ἰδών, நகரத்தைக் கண்டதும் அதனுடன் தொடர்பாக ஏற்பட்ட உணர்ச்சிப் பதிலையும் சுருக்கமாக இணைக்கிறது. எருசலேம் என்பது சூழலிலிருந்து தெளிவாக இருப்பதால், πόλις என்பதற்கு ‘நகரம்’ என்றே மொழிபெயர்க்கப்பட்டது.
- source_word: ἔκλαυσεν
  choice: கண்ணீர் விட்டார்
  rationale: κλαίω என்பது அழுதல் அல்லது கண்ணீர் விடுதல். ‘கண்ணீர் விட்டார்’ என்பது இயல்பான, கண்ணியமான தமிழ்; மூலத்தில் வெளிப்படையாக இல்லாத தீவிரத்தைச் சேர்க்காது.
- source_word: ἐπ’ αὐτήν
  choice: அதற்காக
  rationale: κλαίω உடன் வரும் ἐπί + வேற்றுமை வடிவம், ஒருவரையோ ஒன்றையோ குறித்து அல்லது அதற்காக அழுதலைக் குறிக்கிறது. தமிழில் ‘அதற்காகக் கண்ணீர் விட்டார்’ என்பது நகரத்தின் நிலையை நோக்கிய இயேசுவின் புலம்பலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πόλις மற்றும் αὐτήν ஆகியவற்றின் இலக்கணப் பெண்பாலை மொழிபெயர்ப்பில் வெளிப்படுத்த வேண்டுமா
  choice: தமிழில் இயல்பான அஃறிணைச் சுட்டான ‘அதற்காக’ பயன்படுத்தப்பட்டது.
  alternative: எருசலேமை ஒரு பெண்ணாக உருவகப்படுத்தும் சொற்றொடரைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தில் αὐτήν என்பது பெண்பாலான πόλις என்பதுடன் இலக்கண ஒத்திசைவைக் கொண்டது. தமிழில் ‘நகரம்’ இயல்பாக அஃறிணையாகக் குறிப்பிடப்படுகிறது; இவ்வசனம் மட்டும் வெளிப்படையான பெண் உருவகத்தை கட்டாயப்படுத்தவில்லை. ஆகவே தேவையற்ற உருவகத்தைச் சேர்க்காமல் இயல்பான தமிழ் நடை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான வாக்கிய ஓட்டமும், நகரத்தைக் கண்டதற்கும் கண்ணீர் விட்டதற்கும் உள்ள நேரடியான தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
