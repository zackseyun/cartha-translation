  source_fidelity: மூலத்தின் εἰσελθὼν என்ற முன்னிகழ்வைக் காட்டும் பங்கேற்புவினை ‘நுழைந்து’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது. διήρχετο-வின் முற்றுப்பெறாத, தொடர்நிலை இறந்தகால உணர்வு ‘சென்றுகொண்டிருந்தார்’ என்பதில் பாதுகாக்கப்படுகிறது. ‘எரிகோவுக்குள்’ மற்றும் ‘அதன் வழியாக’ இணைந்து நகருக்குள் நுழைந்து அதனூடே செல்லும் பொருளைச் சரியாக வெளிப்படுத்துகின்றன.
  naturalness: நவீன பொதுத்தமிழில் நடை இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘அதன்’ என்பது உடனடியாக முன்வந்த எரிகோவையே இயல்பாகக் குறிக்கிறது. தொடக்க Καὶ-ஐத் தனிச் சொல்லாக விடுத்திருப்பது தமிழ் வினையெச்சத் தொடரில் இயல்பானது; நிகழ்வுத் தொடரின் பொருள் இழக்கப்படவில்லை.
  terminology: ‘எரிகோ’ நிலையான தமிழ்ப் பயன்பாட்டிற்கு ஏற்ற இடப்பெயர் வடிவம். மரியாதை ஒருமை வினை வடிவம் உரிய பதிவில் உள்ளது. இறையியல் சொற்களோ விளக்கச் சேர்க்கைகளோ இல்லை.
