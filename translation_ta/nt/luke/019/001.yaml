  text: And he entered and was passing through Jericho[a].
translation:
  language: ta
  text: அவர் எரிகோவுக்குள் நுழைந்து, அதன் வழியாகச் சென்றுகொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லோட்டத்துக்கு நெருக்கமாக: “அவர் எரிகோவுக்குள் நுழைந்து, எரிகோவினூடே சென்றுகொண்டிருந்தார்.”'
    reason: மூலமொழியின் பங்கேற்புவினை மற்றும் முற்றுப்பெறாத வினை வடிவத்தை வெளிப்படையாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழ் தொடர்நடையில் வசனத்தின் தொடக்கத்தில் ‘மேலும்/அப்போது’ என்று சேர்ப்பது மூலத்தில் இல்லாத வலியுறுத்தலை ஏற்படுத்தலாம்; வினையெச்சத் தொடர் இயல்பாகவே நிகழ்வுகளின் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: εἰσελθὼν
  choice: நுழைந்து
  rationale: இறந்தகால வினையெச்சத்தின் முன்னிகழ்வையும் முதன்மை வினையோடு உள்ள நெருங்கிய தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: διήρχετο
  choice: அதன் வழியாகச் சென்றுகொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்ச்சியான, அப்போது நடந்துகொண்டிருந்த நகர்வை ‘சென்றுகொண்டிருந்தார்’ வெளிப்படுத்துகிறது; ‘அதன் வழியாக’ என்பது எரிகோவைக் கடந்து செல்லும் கருத்தைக் காக்கிறது.
- source_word: τὴν Ἰεριχώ
  choice: எரிகோவுக்குள் … அதன் வழியாக
  rationale: இடப்பெயரை வழக்கமான தமிழ் வடிவில் தருவதோடு, நுழைதலும் அதன் ஊடாகச் செல்லுதலும் தெளிவாக வெளிப்படுகின்றன.
