source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: ta
  text: 'ஆகவே அவர் சொன்னார்: “உயர்குடியைச் சேர்ந்த ஒருவர், தனக்கென ஒரு அரசாட்சியைப்[a] பெற்று, திரும்பி வருவதற்காகத் தொலைதூர நாட்டிற்குச் சென்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அரசு,” “அரசுரிமை,” அல்லது “அரச அதிகாரம்.” கிரேக்கச் சொல் ஆளப்படும் அரசையோ அரசனின் ஆட்சி அல்லது அதிகாரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையுடன் உள்ள தர்க்கரீதியான அல்லது கதைத் தொடர்ச்சியைக் காட்டுகிறது; மூலத்தின் இணைப்புச் சக்தியை இயல்பான தமிழில் காக்கிறது.
- source_word: Ἄνθρωπός τις
  choice: ஒருவர்
  rationale: உவமையில் இன்னும் அடையாளம் குறிப்பிடப்படாத ஒருவரை அறிமுகப்படுத்துகிறது; அடுத்து வரும் அவரது உயர்குடிப் பின்னணியுடன் இயல்பாக இணைகிறது.
- source_word: εὐγενὴς
  choice: உயர்குடியைச் சேர்ந்த
  rationale: உயர்ந்த பிறப்பு அல்லது சமூகத் தகுநிலையைக் குறிக்கிறது; ‘பிரபு’ என மொழிபெயர்த்து குறிப்பிட்ட பதவியைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐπορεύθη
  choice: சென்றார்
  rationale: தொலைவிலுள்ள நாட்டை நோக்கிய இயக்கத்தை எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰς χώραν μακρὰν
  choice: தொலைதூர நாட்டுக்கு
  rationale: வெகுதொலைவில் உள்ள ஒரு நிலப்பகுதி அல்லது நாட்டைக் குறிக்கும் மூலச் சொற்றொடரைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: λαβεῖν
  choice: பெற்றுக்கொண்டு
  rationale: அரசாட்சியைப் பிடுங்கிக் கொள்வதைவிட, அதை அங்கீகாரமாக அல்லது அளிப்பாகப் பெறும் அரசியல் சூழலை வெளிப்படுத்துகிறது.
- source_word: ἑαυτῷ
  choice: தனக்கான
  rationale: அவர் தமக்கே உரியதாக அந்த அரசாட்சியைப் பெறுவதைக் காட்டும் தற்சுட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: βασιλείαν
  choice: அரசாட்சியை
  rationale: ஆட்சி, அரசுரிமை, அல்லது ஆளப்படும் அரசு என்ற பொருள் எல்லையை முற்றிலும் சுருக்காமல், இச்சூழலில் பெறப்படும் அரச ஆளுகையை இயல்பாகக் குறிக்கிறது.
- source_word: ὑποστρέψαι
  choice: திரும்பிவருவதற்காக
  rationale: அரசாட்சியைப் பெற்ற பின்பு அவர் மீண்டும் வருவதே பயணத்தின் இணைந்த நோக்கம் என்பதைத் தெரிவிக்கிறது; மூலத்தில் இல்லாத தனியான கால இணைப்புச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: அரசியல் சார்ந்த உவமையில் βασιλείαν என்பதன் பொருள்
  choice: அரசாட்சி
  alternative: அரசு; அரசுரிமை; அரச அதிகாரம்
  rationale: இச்சொல் ஆளப்படும் நாட்டையும் அரசனின் ஆட்சி அல்லது அதிகாரத்தையும் குறிக்கலாம். இங்கு அந்த உயர்குடியினர் அரச அங்கீகாரத்தைப் பெற்று வருவதாக உள்ள அரசியல் காட்சிக்கு ‘அரசாட்சி’ பொருந்துகிறது; எனினும் மூலத்தின் உண்மையான பொருள் அகலத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘உயர்குடியைச் சேர்ந்தவர்’ என்பது பிறப்பு அல்லது சமூகத் தகுநிலையைத் தெளிவாகக் காட்டுகிறது; குறிப்பிட்ட பட்டத்தையோ சமய விளக்கத்தையோ சேர்க்கவில்லை. அடிக்குறிப்பு குறி அதற்குரிய ‘அரசாட்சி’ என்ற சொல்லுக்குப் பின்பே வைக்கப்பட்டுள்ளது.
