  source_fidelity: 'மூல கிரேக்கத்தின் செயல்தொடர் துல்லியமாகப் பிரதிபலிக்கப்படுகிறது: σπεύσας என்பதற்கு «விரைந்து», κατέβη என்பதற்கு «கீழே இறங்கி», ὑπεδέξατο என்பதற்கு விருந்தோம்பல் நிழற்பொருளையும் தரும் «வரவேற்றான்», χαίρων என்பதற்கு «மகிழ்ச்சியுடன்» பொருத்தமாக உள்ளன. இயேசுவைக் குறிக்கும் αὐτόν-க்கு «அவரை» என்பது தமிழ் மரியாதை வழக்கில் இயல்பானது.'
