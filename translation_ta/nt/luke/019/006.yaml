  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: ta
  text: அவன் விரைந்து கீழே இறங்கி, மகிழ்ச்சியுடன் அவரை வரவேற்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் விரைந்து கீழே இறங்கி வந்து, மகிழ்ந்தவாறே அவரை ஏற்றுக்கொண்டான்.”
    reason: ‘ὑπεδέξατο’ என்பதற்கு ‘ஏற்றுக்கொண்டான்’ என்றும், ‘χαίρων’ என்பதற்கு ‘மகிழ்ந்தவாறே’ என்றும் நெருக்கமாக மொழிபெயர்க்கலாம்; ‘κατέβη’ என்பதையும் முழு இயக்க வினையாக வெளிப்படுத்தும் மாற்று இது.
lexical_decisions:
- source_word: σπεύσας
  choice: விரைந்து
  rationale: இறந்தகால வினையெச்சம் உடனடியான, ஆர்வமுள்ள செயல்பாட்டைக் குறிக்கிறது; ‘விரைந்து’ என்பது இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: κατέβη
  choice: கீழே இறங்கி
  rationale: மூல வினை கீழ்நோக்கிய இயக்கத்தைக் குறிக்கிறது. தொடர்ச்சியான செயல்களைத் தமிழில் இயல்பாக இணைக்க ‘இறங்கி’ என வினையெச்ச வடிவில் தரப்பட்டுள்ளது.
- source_word: ὑπεδέξατο
  choice: வரவேற்றான்
  rationale: இந்த இடைநிலை வினை ஒருவரை உபசரிக்கும் நோக்குடன் ஏற்றுக்கொள்வதைச் சுட்டலாம்; ‘வரவேற்றான்’ அந்த விருந்தோம்பல் நுண்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் ஒருமை ஆண்பால் சுட்டுப்பெயர்; தமிழின் மரியாதை வழக்குக்கு ஏற்ப ‘அவரை’ எனத் தரப்பட்டுள்ளது.
- source_word: χαίρων
  choice: மகிழ்ச்சியுடன்
  rationale: நிகழ்கால வினையெச்சம் வரவேற்றபோது உடனிருந்த மகிழ்ச்சியான மனநிலையைக் காட்டுகிறது; ‘மகிழ்ச்சியுடன்’ அதை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: καὶ ... καὶ
  choice: …-உம் …-உம் என்ற வெளிப்படையான மறுஇணைப்பின்றி தொடர் வினையெச்ச அமைப்பு
  rationale: கிரேக்கத்தில் மீள வரும் இணைப்புச் சொற்கள் செயல்களின் வரிசையை இணைக்கின்றன. தமிழில் ‘விரைந்து கீழே இறங்கி … வரவேற்றான்’ என்ற அமைப்பே அதே தொடரை இயல்பாகக் காட்டுகிறது; ஒவ்வொரு καί-யையும் தனியே மொழிபெயர்ப்பது செயற்கையாக ஒலிக்கும்.
