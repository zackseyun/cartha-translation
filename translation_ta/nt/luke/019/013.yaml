  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: ta
  text: தன்னுடைய பத்து அடிமைகளை அழைத்து, அவர்களுக்குப் பத்து மினாக்களைக்[a] கொடுத்து, “நான் வரும்வரை இவற்றைக் கொண்டு வியாபாரம் செய்யுங்கள்”[b] என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மினா என்பது பண்டைய காலப் பண அலகு.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நான் வரும்வரை வணிகத்தில் ஈடுபடுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: அழைத்து
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன்னான செயலைக் குறிக்கிறது; தமிழில் ‘அழைத்து ... கொடுத்து’ என்பது அந்த வரிசையை இயல்பாகத் தருகிறது.
- source_word: δούλους ἑαυτοῦ
  choice: தன்னுடைய அடிமைகள்
  rationale: δοῦλος இச்சூழலில் எஜமானுக்குச் சொந்தமான அடிமையைக் குறிக்கிறது; ἑαυτοῦ தரும் தன்சார்பு மற்றும் உடைமை வலியுறுத்தலை ‘தன்னுடைய’ காக்கிறது.
- source_word: δέκα μνᾶς
  choice: பத்து மினாக்கள்
  rationale: μνᾶ என்பது பண்டைய பண அலகு; இக்கால நாணயத்துடன் தவறாக ஒப்பிடாமல் வரலாற்றுச் சிறப்பைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: Πραγματεύσασθε
  choice: இவற்றைக் கொண்டு வியாபாரம் செய்யுங்கள்
  rationale: ஒப்படைக்கப்பட்ட பணத்தைக் கொண்டு வணிகச் செயலில் ஈடுபடுமாறு கட்டளையிடுகிறது; ‘இவற்றைக் கொண்டு’ என்பது தமிழில் இயல்பாகத் தேவையான பொருள் தொடர்பை வெளிப்படுத்துகிறது, ஆனால் முதலீட்டின் குறிப்பிட்ட முறையைச் சேர்ப்பதில்லை.
- source_word: ἐν ᾧ ἔρχομαι
  choice: நான் திரும்பிவரும்வரை
  rationale: இக்காலச் சொற்றொடர் இங்கு வருகை/திரும்பிவருகை நிகழும் வரையிலான காலத்தை உணர்த்துகிறது; புறப்பட்டுச் சென்ற அரசகுல மனிதன் திரும்பும் உவமைச் சூழலில் ‘திரும்பிவரும்வரை’ இயல்பும் தெளிவும் உடையது.
theological_decisions:
- issue: உவமையின் எஜமான்–δοῦλος உறவை மொழிபெயர்த்தல்
  choice: அடிமைகள்
  alternative: வேலையாட்கள் / பணியாளர்கள்
  rationale: ‘தன்னுடைய’ என்ற உடைமை வலியுறுத்தலும் உவமையின் சமூக அமைப்பும் கட்டுப்பட்ட அடிமை உறவைக் காட்டுகின்றன. ‘அடிமைகள்’ வரலாற்று நிஜத்தை மறைக்காது; அதேவேளையில் பின்னாளைய சமயப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பண்டைய சமூக உறவை மறைக்காமல் ‘அடிமைகள்’ என்றும், வரலாற்றுப் பண அலகை மாற்று மதிப்பாகக் கணிக்காமல் ‘மினாக்கள்’ என்றும் வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
