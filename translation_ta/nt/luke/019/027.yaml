  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: ta
  text: ஆனால், நான் அவர்கள்மேல் அரசாளுவதை விரும்பாத இந்த என் பகைவர்களை[a] இங்கே கொண்டுவந்து, என் முன்னே வெட்டிக் கொல்லுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவர்களுக்கு அரசனாக இருப்பதை விரும்பாத இந்த என் பகைவர்களை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் முன்னே அவர்களைக் கொல்லுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: இங்கு இது அரசகுலத்தவனின் பேச்சில் இறுதியான, தீவிரமான கட்டளைக்குச் செல்லும் வலுவான மாற்றத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘ஆனால்’ இயல்பாக அந்த எதிர்மறை மாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: என்னுடைய இந்தப் பகைவர்களை
  rationale: ‘பகைவர்கள்’ என்பது தனிப்பட்ட எதிரிகளைக் குறிக்கும் இயல்பான, கண்ணியமான சொல்; ‘இந்த’ என்பது τούτους தரும் குறிப்பான வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτούς
  choice: நான் தங்கள்மீது அரசாளுவதை விரும்பாத
  rationale: எழுவாயுடன் கூடிய infinitive அமைப்பைத் தமிழில் இயல்பான தொடர்பெச்சத் தொடராக வழங்குகிறது. βασιλεύω என்பதன் வினைச்சொல் தன்மையையும் ‘தங்கள்மீது அரசாளுவது’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀγάγετε ὧδε
  choice: இங்கே கொண்டுவந்து
  rationale: ἄγω என்பதற்கு ‘அழைத்து/கொண்டுவருதல்’ என்ற பொருள் உண்டு; கட்டளையின் சூழலிலும் ὧδε குறிக்கும் இடத்திலும் ‘இங்கே கொண்டுவந்து’ இயல்பாக உள்ளது.
- source_word: κατασφάξατε
  choice: வெட்டிக் கொல்லுங்கள்
  rationale: இவ்வினைச்சொல் பொதுவான ‘கொல்லுங்கள்’ என்பதைவிடக் கடுமையானதும் காட்சியளவில் தீவிரமானதும் ஆகும். ‘வெட்டிக் கொல்லுங்கள்’ அந்த வன்முறையை மென்மைப்படுத்தாமல் நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἔμπροσθέν μου
  choice: என் முன்னிலையில்
  rationale: இந்தச் சொற்றொடர் பேசுகிறவரின் முன்னும் அவரது நேரடி பார்வை/இருப்பு சூழலிலும் செயல் நடப்பதைக் குறிக்கிறது; ‘என் முன்னிலையில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: உவமைக்குள் பேசுபவரின் கட்டளை
  choice: அரசகுலத்தவனின் கட்டளையை அதன் வன்முறையை மென்மைப்படுத்தாமல் நேரடியாக மொழிபெயர்த்தல்; அதேவேளையில், உவமைக்கு வெளியே இயேசு நேரடியாகக் கொடுத்த கட்டளை என்று விளக்கச் சொற்களைச் சேர்க்காமல் இருத்தல்.
  alternative: இது வெறும் உவமைப் படிமம் என்பதை வெளிப்படையாக வலியுறுத்தி, கூற்றிலிருந்து அதிக இடைவெளி ஏற்படுத்துதல்.
  rationale: கிரேக்க உரையில் இந்த வார்த்தைகள் உவமைக்குள் அரசகுலத்தவனால் பேசப்படுகின்றன. மொழிபெயர்ப்பு அந்தக் கதைநடை வலிமையையும் இறையியல் பதற்றத்தையும் பாதுகாக்க வேண்டும்; உரை கூறாத முடிவைச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஆனால் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கடுமையான வன்முறை மென்மைப்படுத்தப்படவில்லை; தேவையற்ற பழமையான சொற்களும் நீதித்துறை சார்ந்த விளக்கச் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
