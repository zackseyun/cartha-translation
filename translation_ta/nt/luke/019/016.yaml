id: LUK.19.16
reference: Luke 19:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: ta
  text: அப்போது முதல் ஊழியன் வந்து, “ஆண்டவரே[a], உமது மினா[b] மேலும் பத்து மினாக்களை ஈட்டியுள்ளது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எஜமானே” என்றும் மொழிபெயர்க்கலாம். கிரேக்க அழைப்புச் சொல்லான κύριε, “ஆண்டவரே” என்பதோடு, மேலதிகாரியை மரியாதையுடன் அழைக்கும் “எஜமானே” என்ற பொருளையும் தரலாம்.
    reason: alternative_reading
  - marker: b
    text: மினா என்பது பண்டைய காலப் பண அலகு.
    reason: historical_context
lexical_decisions:
- source_word: παρεγένετο
  choice: வந்து
  rationale: παραγίνομαι என்பதன் ‘வந்தான்/வந்து சேர்ந்தான்’ என்ற பொருளை இயல்பான தமிழ் கதைநடையில் ‘வந்து’ எனத் தருகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ நிகழ்வின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது; ‘அப்போது’ அதன் கதைத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ πρῶτος
  choice: முதலாமவன்
  rationale: ஊழியர்கள் வரிசையில் முதலில் வருபவனைக் குறிக்கிறது; பெயர்ச்சொல் மறைந்துள்ள கிரேக்க அமைப்பைத் தமிழில் இயல்பாக நிறைவு செய்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பதற்கான வழக்கமான, மரியாதைமிக்க தமிழ் இணை; உவமையின் சூழலில் ‘எஜமானே’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
- source_word: ἡ μνᾶ σου
  choice: உமது மினா
  rationale: சொந்தத்தைக் குறிக்கும் σου என்பதை ‘உமது’ எனவும், பண்டைய பண அலகான μνᾶ-வை நவீன பண மதிப்பாக மாற்றாமல் ‘மினா’ எனவும் தருகிறது.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: மேலும் பத்து மினாக்களை ஈட்டியுள்ளது
  rationale: προσεργάζομαι என்பதில் உள்ள உழைப்பின் மூலம் கூடுதலாகப் பெறுதல் என்ற கருத்தை ‘மேலும்… ஈட்டியுள்ளது’ தெளிவாகக் காட்டுகிறது; ஈட்டியதாகச் சொல்லப்படுவது எஜமானுடைய மினாவே என்ற மூலத்தின் உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: உவமையில் κύριος என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: இந்தச் சூழலில் இது மேலதிகாரியை மரியாதையுடன் அழைப்பதாக இருக்கலாம்; அதேவேளை κύριος என்பதன் வழக்கமான மொழிபெயர்ப்பை முதன்மை உரையில் காத்து, சூழலுக்கேற்ற மாற்றை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது மரியாதையையும், பணம் எஜமானுக்குச் சொந்தமானது என்பதையும் தெளிவாக்குகிறது; வரலாற்றுச் சிறப்புடைய ‘மினா’ பெயர் அப்படியே வைக்கப்பட்டு அடிக்குறிப்பில் சுருக்கமாக விளக்கப்பட்டுள்ளது.
