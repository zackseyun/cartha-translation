    issue: “முதலாமவன்” is somewhat stiff and underspecified in modern Tamil.
    rationale: The Greek substantive “the first” refers to the first of the servants already introduced in the parable. “முதல் ஊழியன்” expresses that contextual referent more naturally without adding doctrinal or interpretive content.
