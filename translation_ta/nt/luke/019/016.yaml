revisions:
- from: அப்போது முதலாமவன் வந்து, “ஆண்டவரே[a], உமது மினா[b] மேலும் பத்து மினாக்களை ஈட்டியுள்ளது” என்றான்.
  to: அப்போது முதல் ஊழியன் வந்து, “ஆண்டவரே[a], உமது மினா[b] மேலும் பத்து மினாக்களை ஈட்டியுள்ளது” என்றான்.
