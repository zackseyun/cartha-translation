base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: ta
  text: அவர் நாள்தோறும் ஆலயத்தில் கற்பித்துக்கொண்டிருந்தார். ஆனால் தலைமைக் குருக்களும் மறைநூல் அறிஞர்களும் மக்களிடையே முதன்மை வகித்த ஆண்களும்[a] அவரை அழித்துவிட வழிதேடிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களின் தலைவர்களும்.” கிரேக்கத்தில் சொற்பட “மக்களின் முதன்மையானவர்களும்”; இது மக்களிடையே முக்கியத்துவமோ செல்வாக்கோ பெற்ற ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: தொடர்ச்சியையோ மீண்டும் மீண்டும் நிகழ்ந்த செயலையோ குறிக்கும் சுற்றுவழி இறந்தகால அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது; தமிழில் ‘ஆலயத்தில்’ என்பது வழக்கமான, சூழலுக்கு ஏற்ற சுருக்கமான மொழிபெயர்ப்பு.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: யூதக் குருத்துவத் தலைமைக் குழுவைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: οἱ γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: வெறும் எழுத்தர்களை அல்லாமல் யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்றவர்களைக் குறிக்கும் வகையில், பழமையான ‘வேதபாரகர்’ என்பதற்குப் பதிலாக நவீன வாசகர்களுக்குப் புரியும் மொழி பயன்படுத்தப்பட்டது.
- source_word: ἐζήτουν
  choice: வழிதேடிக்கொண்டிருந்தார்கள்
  rationale: தொடர்ந்து மேற்கொள்ளப்பட்ட முயற்சியை இறந்தகாலத் தொடர்நிலையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπολέσαι
  choice: அழித்துவிட
  rationale: இச்சூழலில் கொலைசெய்யும் பகைநோக்கம் அடங்கியிருந்தாலும், கிரேக்கச் சொல்லின் ‘அழித்தல்/ஒழித்தல்’ என்ற பரந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: மக்களிடையே முதன்மை வகித்த ஆண்கள்
  rationale: πρῶτοι என்பதிலுள்ள சமூக முக்கியத்துவத்தையும், வரலாற்றுச் சூழலில் குறிப்பிடப்படும் ஆண் பிரமுகர்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: οἱ πρῶτοι τοῦ λαοῦ என்பதில் ஆண்பால் குறிப்பு
  choice: மக்களிடையே முதன்மை வகித்த ஆண்கள்
  alternative: மக்களின் தலைவர்கள்
  rationale: கிரேக்க ஆண்பால் பன்மையையும், இவர்கள் ஆண் சமூகப் பிரமுகர்களாக இருந்திருக்கக்கூடிய வரலாற்றுச் சூழலையும் மறைக்காமல் வைத்திருக்கிறது; அதேவேளை அவர்கள் அதிகாரபூர்வத் தலைவர்கள் மட்டுமே என்று தீர்மானிக்கவில்லை.
- issue: ἀπολέσαι என்பதின் பொருள் பரப்பு
  choice: அழித்துவிட
  alternative: கொன்றுவிட
  rationale: இச்சூழலில் மரண நோக்கம் சாத்தியமானதும் தெளிவானதுமாக இருந்தாலும், மூலச்சொல்லின் பரந்த ‘அழித்தல்’ பொருளைச் சுருக்கி ஒரே விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான இறந்தகாலச் செயல்களை ‘கொண்டிருந்தார்/கொண்டிருந்தார்கள்’ வடிவங்கள் காக்கின்றன. ‘மறைநூல் அறிஞர்கள்’ என்பது பழமையான தொழில்நுட்பச் சொல்லைத் தவிர்த்து வரலாற்றுப் பங்கைத் தெளிவாக்குகிறது.
