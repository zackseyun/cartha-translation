  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: ta
  text: இரண்டாவது பணியாளன் வந்து, ‘ஆண்டவரே, உமது மினா ஐந்து மினாக்களை ஈட்டியுள்ளது’ என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: இரண்டாவது பணியாளன்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் விடுபட்டிருந்தாலும், உவமையின் சூழலில் இரண்டாவது பணியாளனைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘பணியாளன்’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: μνᾶ
  choice: மினா
  rationale: பண்டைய பண அலகின் பெயரை ஒலிபெயர்த்து, அதன் வரலாற்றுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: நேரடி அழைப்பைக் குறிக்கும் மரியாதையான விளிவேற்றுமை; இச்சூழலில் எஜமானனை நோக்கிய அழைப்பு.
- source_word: ἐποίησεν
  choice: ஈட்டியுள்ளது
  rationale: சொற்படி ‘செய்தது’ என்பதற்குப் பதிலாக, முதலீட்டின் விளைவாக மேலும் ஐந்து மினாக்கள் கிடைத்தன என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: κύριε என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: எஜமானே / ஐயா
  rationale: உவமைக்குள் இது பணியாளன் தனது எஜமானனை அழைப்பதாகப் புரிந்துகொள்ளலாம்; அதேவேளையில் ‘ஆண்டவரே’ என்ற வழக்கமான வேதாகமச் சொல் உள்ளார்ந்த கிறிஸ்தவ ஒலியையும் முற்றிலும் நீக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் தமிழ். கிரேக்கத்தின் சுருக்கத்தைப் பேணியபடியே, தமிழில் எழுவாய் தெளிவாக இருக்க ‘பணியாளன்’ சேர்க்கப்பட்டுள்ளது.
