  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: ta
  text: இதோ, சகேயு என்னும் ஒரு மனிதர் தலைமை வரிவசூலிப்பவராகவும் செல்வந்தராகவும் இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: லூக்கா வாசகரின் கவனத்தைத் திருப்பப் பயன்படுத்தும் உரையாடல் குறியீட்டையும் நிகழ்வின் உயிரோட்டத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀνὴρ
  choice: ஒரு மனிதர்
  rationale: குறிப்பிட்ட ஓர் ஆணைக் குறிக்கும் சொல்லை மரியாதையும் இயல்பும் கொண்ட நவீனத் தமிழில் வழங்குகிறது.
- source_word: ὀνόματι καλούμενος
  choice: என்று அழைக்கப்பட்ட
  rationale: கிரேக்கத்தில் உள்ள ‘பெயரால் அழைக்கப்பட்ட’ என்ற கூறைத் தெளிவாகத் தக்கவைக்கிறது; தமிழில் இது இயல்பான பெயர் அறிமுக வடிவமாகும்.
- source_word: Ζακχαῖος
  choice: சகேயு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: αὐτὸς ἦν
  choice: அவர் ... இருந்தார்
  rationale: எழுவாயை மீண்டும் எடுத்துரைக்கும் கிரேக்கப் பிரதிப்பெயரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற ‘அவரே’ என்ற மிகை வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: ἀρχιτελώνης
  choice: தலைமை வரிவசூலிப்பவர்
  rationale: ἀρχι- என்பதன் தலைமை அல்லது உயர்நிலைப் பொருளையும் τελώνης என்பதன் வரிவசூலிப்பவர் என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πλούσιος
  choice: செல்வந்தர்
  rationale: பொருளாதார வளமுள்ளவர் என்ற நேரடியான பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
