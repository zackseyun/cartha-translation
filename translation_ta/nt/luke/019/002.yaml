translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத இடவியல் தகவல் சேர்க்கப்படவில்லை. கிரேக்கத்தின் இரண்டு நிலைப்பண்புகளும் ‘வரிவசூலிப்பவராகவும் செல்வந்தராகவும் இருந்தார்’ என்ற இணை அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
