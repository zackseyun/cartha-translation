revisions:
- from: கூட்டத்திலிருந்த பரிசேயர்களில் சிலர் அவரிடம், “போதகரே, உம்முடைய சீடர்களைக் கண்டியும்” என்றார்கள்.
  to: கூட்டத்தில் இருந்த பரிசேயர்களில் சிலர் அவரிடம், “ஆசிரியரே, உம்முடைய சீடர்களைக் கண்டியுங்கள்” என்றார்கள்.
  rationale: The revision improves modern Tamil idiom and the respectful imperative while retaining the source text’s scope, tone, and wording. No footnote is needed, since the translation does not introduce or resolve a material ambiguity beyond the Greek text.
