id: LUK.19.39
reference: Luke 19:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: ta
  text: கூட்டத்தில் இருந்த பரிசேயர்களில் சிலர் அவரிடம், “ஆசிரியரே, உம்முடைய சீடர்களைக் கண்டியுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: பரிசேயர்களில் சிலர்
  rationale: τινες உடன் வரும் பகுதிப்பொருள் மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்தி, எல்லாப் பரிசேயர்களும் அல்லாமல் அவர்களில் குறிப்பிடப்படாத சிலரையே குறிக்கிறது.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: கூட்டத்திலிருந்த
  rationale: ἀπό இங்கு அந்தப் பரிசேயர்கள் கூட்டத்திற்குள் இருந்தவர்கள் என்பதைச் சுட்டுகிறது; தமிழில் இவ்வமைப்பு இடத்தையும் மூலத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἶπαν πρὸς αὐτόν
  choice: அவரிடம் ... என்றார்கள்
  rationale: இது இயல்பான தமிழ் உரையாடல் அறிமுகம்; πρός உடன் வரும் முகப்படுத்தப்பட்ட பேச்சையும் தெளிவாகக் காட்டுகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: διδάσκαλος என்பதன் கற்பித்தல் சார்ந்த பொருளையும் மரியாதை விளியையும் நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἐπιτίμησον
  choice: கண்டியும்
  rationale: இந்த இறந்தகால ஏவல் வடிவத்தின் நேரடியான கட்டளையையும் வாய்மொழிக் கண்டனத்தின் வலிமையையும் காக்கிறது; ‘அமைதிப்படுத்தும்’ என்பது மூலத்தைவிட விளக்கமாகிவிடும்.
- source_word: τοῖς μαθηταῖς σου
  choice: உம்முடைய சீடர்களை
  rationale: μαθητής என்பதன் ஆசிரியர்–சீடர் உறவைப் பாதுகாக்கிறது; ἐπιτιμάω உடன் வரும் வேற்றுமையைத் தமிழில் இயல்பான செயப்படுபொருளாக அளிக்கிறது.
theological_decisions:
- issue: Διδάσκαλε என்பது இயேசுவை அழைக்கும் மரியாதைத் தலைப்பு
  choice: போதகரே
  alternative: ஆண்டவரே
  rationale: இங்கு சொல் முதன்மையாக கற்பிப்பவரைக் குறிக்கிறது; ‘ஆண்டவரே’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத வலுவான அதிகார அல்லது கிறிஸ்தியல் பொருள் சேரக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான நேரடி உரைக்காக ‘உம்முடைய’ பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் சுருக்கமும் கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன.
