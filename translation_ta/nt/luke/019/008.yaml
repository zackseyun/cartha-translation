source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: ta
  text: சக்கேயுவோ நின்று ஆண்டவரிடம், “ஆண்டவரே, இதோ, என் உடைமைகளில் பாதியை ஏழைகளுக்குக் கொடுக்கிறேன்; யாரிடமிருந்தாவது எதையாவது அநியாயமாகப் பறித்திருந்தால்[a], அதை நான்கு மடங்காகத் திருப்பிக் கொடுக்கிறேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாரிடமிருந்து எதையாவது மோசடி செய்து பெற்றிருந்தால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் மிரட்டிப் பறித்தல், அதிகாரத்தைப் பயன்படுத்திச் சுரண்டுதல், மோசடி செய்தல் ஆகியவற்றைக் குறிக்கலாம்; சில சூழல்களில் பொய்க் குற்றச்சாட்டின் மூலம் இவற்றைச் செய்வதையும் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க நிகழ்கால வினைகளை, உடனடியாகச் செயல்படுத்தப்போகும் தீர்மானத்தை வெளிப்படுத்தும் வகையில், ‘கொடுப்பேன்’ என்றும் ‘திருப்பிக் கொடுப்பேன்’ என்றும் புரிந்துகொள்ளவும் முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: நின்று
  rationale: இங்கு ἵστημι வினையின் இறந்தகாலப் பங்கேற்பு வடிவம் தன்வினைப் பொருளில் வருகிறது. உடல்நிலையை அளவுக்கு மீறி விளக்காமல், கதையின் செயலை இயல்பாகத் தருகிறது.
- source_word: κύριον / κύριε
  choice: ஆண்டவர் / ஆண்டவரே
  rationale: இயேசுவைக் குறிக்கும் κύριος என்ற பட்டத்தையும், நேரடி அழைப்பில் உள்ள மரியாதையையும் காக்கிறது; வெறும் ‘ஐயா’ என்று பொருளைத் தட்டையாக்கவில்லை.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: பேசப்படவிருக்கும் முக்கிய அறிவிப்பின் மீது கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: என் உடைமைகளில் பாதியை
  rationale: ὑπάρχοντα என்பது இச்சூழலில் சொத்து அல்லது உடைமைகளைக் குறிக்கிறது; கிரேக்கத்தின் பகுதிப்பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῖς πτωχοῖς
  choice: ஏழைகளுக்கு
  rationale: பொருளாதார ரீதியில் ஏழைகளாக இருப்பவர்களைக் குறிக்கும் இயல்பான, நேரடியான மொழிபெயர்ப்பு.
- source_word: δίδωμι
  choice: கொடுக்கிறேன்
  rationale: கிரேக்க நிகழ்கால வினையை நிகழ்காலமாகவே தருகிறது; இது வழக்கமான செயலைக் குறிக்கிறதா அல்லது உடனடியான தீர்மானத்தைக் குறிக்கிறதா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: ἐσυκοφάντησα
  choice: அநியாயமாகப் பறித்திருந்தால்
  rationale: வரி வசூலிப்பவரின் அதிகாரத் துஷ்பிரயோகம், மிரட்டிப் பறித்தல் அல்லது மோசடி செய்தல் ஆகிய பொருள் நிழல்களை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἀποδίδωμι
  choice: திருப்பிக் கொடுக்கிறேன்
  rationale: பெற்றதை அல்லது எடுத்ததை ஈடாகத் திருப்பித் தருதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τετραπλοῦν
  choice: நான்கு மடங்காக
  rationale: நான்கு மடங்கு ஈடு செய்வதைக் குறிக்கும் கிரேக்கச் சொல்லின் அளவைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: δίδωμι, ἀποδίδωμι ஆகிய நிகழ்கால வினைகளின் காலப்பொருள்
  choice: ‘கொடுக்கிறேன் … திருப்பிக் கொடுக்கிறேன்’ என்று நிகழ்காலத்தில் மொழிபெயர்த்தல்
  alternative: ‘கொடுப்பேன் … திருப்பிக் கொடுப்பேன்’ என்று உடனடி எதிர்காலத் தீர்மானமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் இரண்டும் நிகழ்காலக் குறிப்புவினைகள். நிகழ்காலத்தைப் பேணுவதால் சக்கேயு ஏற்கெனவே கடைப்பிடித்த வழக்கத்தைச் சொல்கிறானா, இப்போது எடுத்த தீர்மானத்தை அறிவிக்கிறானா, அல்லது இரண்டிற்கும் இடமுள்ளதா என்ற இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான நடை. ‘சக்கேயுவோ’ என்பது δέ தரும் உரையாடல் மாற்றம் அல்லது மிதமான எதிர்நிலையை இயல்பாகக் காட்டுகிறது. சட்டநடைச் சொற்களைத் தவிர்த்து, ஈடு செய்தல் சார்ந்த கருத்து தெளிவாக வைக்கப்பட்டுள்ளது.
