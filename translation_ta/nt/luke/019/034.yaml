base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: ta
  text: அவர்கள், “ஆண்டவருக்கு[a] இது தேவை” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, κύριος என்ற சொல் இயேசுவுக்கான பட்டப்பெயராக அல்லாமல் ‘எஜமான்’ அல்லது ‘உரிமையாளர்’ என்ற பொருளில் எடுத்துக்கொள்ளப்பட்டால், “எஜமானுக்கு இது தேவை.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: அவர்கள்
  rationale: οἱ என்பது முன்பு குறிப்பிடப்பட்ட சீடர்களைக் குறிக்கிறது. δέ மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுவதால், இயல்பான தமிழில் தனிச் சொல்லாக மொழிபெயர்க்காமல் வாக்கிய ஓட்டத்தில் உணர்த்தப்பட்டுள்ளது.
- source_word: εἶπαν
  choice: சொன்னார்கள்
  rationale: λέγω என்பதன் இறந்தகால வடிவம் இங்கு நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. ‘பதிலளித்தார்கள்’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலத்தில் வெளிப்படையாக இல்லாத பதில் கூறும் நுணுக்கத்தைச் சேர்க்கும்.
- source_word: ὅτι
  choice: என்று
  rationale: ὅτι நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோள் குறிகளோடு ‘என்று’ பயன்படுத்துவது இயல்பான அமைப்பு.
- source_word: Ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான தமிழ் வேதாகமப் பட்டப்பெயர் ‘ஆண்டவர்.’ லூக்காவின் சூழலில் இது இயேசுவைக் குறிப்பதாகத் தோன்றினாலும், ‘எஜமான்/உரிமையாளர்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: αὐτοῦ
  choice: இது
  rationale: இந்தப் பதிலிடுபெயர் முன்பு குறிப்பிடப்பட்ட கழுதைக்குட்டியைக் குறிக்கிறது. தமிழில் ‘ஆண்டவருக்கு இது தேவை’ என்ற அமைப்பு அதன் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: χρείαν ἔχει
  choice: தேவை
  rationale: ‘தேவை கொண்டிருக்கிறார்’ என்ற சொற்சொற் மொழிபெயர்ப்பை விட, உடைமையைக் குறிக்கும் தமிழ் வாக்கிய அமைப்பான ‘ஆண்டவருக்கு இது தேவை’ இயல்பாகவும் மூலப் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
theological_decisions:
- issue: சீடர்களின் பதிலில் κύριος யாரைக் குறிக்கிறது?
  choice: சூழலில் இயேசுவைக் குறிப்பதாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: கழுதைக்குட்டியின் எஜமான் அல்லது உரிமையாளர் என்று பொருள்கொண்டு ‘எஜமான்’ என மொழிபெயர்க்கலாம்.
  rationale: இது இயேசு சீடர்களுக்கு முன்கூட்டியே சொல்லிக்கொடுத்த பதில்; மேலும் லூக்கா κύριος என்பதை இயேசுவுக்கான பட்டப்பெயராக அடிக்கடி பயன்படுத்துகிறார். எனினும், இச்சொல்லுக்கு ‘எஜமான்/உரிமையாளர்’ என்ற பொருளும் இருக்கக்கூடும் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்பானதும் கண்ணியமானதுமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆண்டவர்’ என்ற வழக்கமான பட்டப்பெயர் முதன்மை உரையில் வைக்கப்பட்டு, மூலச்சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
