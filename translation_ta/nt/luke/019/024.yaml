source:
  edition: SBLGNT
  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: ta
  text: அவர் அருகில் நின்றிருந்தவர்களிடம், “அவனிடமிருந்து அந்த மினாவை எடுத்து பத்து மினாக்களை வைத்திருப்பவனுக்குக் கொடுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεστῶσιν
  choice: அருகில் நின்றிருந்தவர்களிடம்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள இப்பெயரெச்சம், அங்கே அருகில் நின்றிருந்தவர்களைக் குறிக்கிறது; காட்சியின் நேரடித் தன்மையையும் இயல்பான தமிழையும் இது காக்கிறது.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: அவனிடமிருந்து ... எடுத்துப்
  rationale: αἴρω இங்கு அகற்றுதல் அல்லது எடுத்துக்கொள்ளுதல் என்ற பொருளிலும், ἀπό பிரிவைக் குறிக்கும் பொருளிலும் வருகின்றன; தமிழில் கட்டளையின் தொடரை இயல்பாக வெளிப்படுத்த இந்த வடிவம் ஏற்றது.
- source_word: μνᾶν
  choice: மினாவை
  rationale: μνᾶ என்பது பழங்கால நாணய மதிப்புடைய அலகு. நவீன நாணயத்துடன் தவறாக ஒப்பிடாமல் வரலாற்றுச் சூழலைக் காக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: δότε
  choice: கொடுங்கள்
  rationale: δίδωμι என்பதன் இறந்தகாலக் கட்டளைப் பன்மை வடிவம்; பொருளை மற்றொருவரிடம் ஒப்படைக்கும் எளிய கட்டளையை இது நேரடியாகத் தருகிறது.
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: பத்து மினாக்களை வைத்திருப்பவனுக்கு
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரெச்சத் தொடரை இயல்பான தமிழில் தருகிறது; முன்பு குறிப்பிடப்பட்ட பத்து மினாக்கள் அவனிடம் இருப்பதையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: μνᾶ என்ற பழங்காலப் பண அலகின் மொழிபெயர்ப்பு
  choice: மினா
  alternative: ராத்தல்
  rationale: ‘மினா’ என்பது கிரேக்கப் பழங்கால அலகை நேரடியாகப் பாதுகாக்கிறது. ‘ராத்தல்’ என்பது மரபுவழி மொழிபெயர்ப்பாக இருந்தாலும், இன்றைய வாசகருக்கு எடை அலகையோ வேறு மதிப்பையோ தவறாக உணர்த்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் உவமையின் நேரடி கட்டளைத் தொனியைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவன்’ என்பது சூழலில் குறிப்பிடப்படும் வேலைக்காரனை இயல்பாகச் சுட்டுகிறது; மரியாதை அல்லது கோட்பாட்டு நுணுக்கம் தேவையின்றி சேர்க்கப்படவில்லை.
