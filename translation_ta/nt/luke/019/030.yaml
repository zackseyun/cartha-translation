source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: ta
  text: அவர், “உங்களுக்கு எதிரே இருக்கும் கிராமத்திற்குச் செல்லுங்கள். அதற்குள் நுழையும்போது, எந்த மனிதனும் ஒருபோதும் அமராத ஒரு இளம் விலங்கு கட்டப்பட்டிருப்பதைக் காண்பீர்கள். அதை அவிழ்த்து அழைத்து வாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέναντι
  choice: உங்களுக்கு எதிரே இருக்கும்
  rationale: சீடர்கள் இருந்த இடத்திற்கு எதிரே அமைந்த கிராமத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: πῶλον
  choice: கழுதைக்குட்டி
  rationale: πῶλος பொதுவாக இளம் விலங்கைக் குறிக்கலாம்; இச்சூழலிலும் இணை நற்செய்தி மரபிலும் கழுதைக்குட்டியே குறிக்கப்படுவதால் தெளிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἐκάθισεν
  choice: ஏறி அமராத
  rationale: விலங்கின்மேல் அமர்ந்து சவாரி செய்வதை இயல்பாகத் தெரிவிக்கிறது; வெறும் ‘அமராத’ என்பதைவிட தமிழில் சூழலைத் தெளிவாக்குகிறது.
- source_word: λύσαντες
  choice: அவிழ்த்து
  rationale: கட்டப்பட்டிருந்த விலங்கின் கட்டை விடுவிப்பதற்கான இயல்பான தமிழ் சொல்.
- source_word: ἀγάγετε
  choice: இங்கே கொண்டுவாருங்கள்
  rationale: பேசுபவரிடம் கொண்டு வருதல் என்ற திசை தமிழில் இயல்பாக வெளிப்பட ‘இங்கே’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: இதுவரை மனிதர் அமராத குட்டி
  choice: இதுவரை எந்த மனிதனும் ஏறி அமராத
  alternative: ஒருவரும் ஒருபோதும் அமராத
  rationale: οὐδεὶς πώποτε ἀνθρώπων என்பதன் வலியுறுத்தலைப் பாதுகாக்கிறது; அதன் சடங்கு அல்லது அரச அடையாளப் பொருளை வசனத்துக்குள் விளக்கமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, எளிதில் புரியும் நேரடி கட்டளை நடை. மூலத்தின் வரிசையும் வலியுறுத்தலும் இயன்றவரை காக்கப்பட்டுள்ளன.
