  source_fidelity: திருத்தம் தேவை. πῶλον என்பது இவ்வசனத்தில் குறிப்பாகக் கழுதைக்குட்டி என்று சொல்லப்படவில்லை; இளம் விலங்கு/குட்டி விலங்கு என்ற பொதுப்பொருளையே கொண்டுள்ளது. இணைநற்செய்திகளின் அடிப்படையில் குறிப்பாக்குவது இவ்வசனத்தின் சொல்-அளவிலான தெளிவின்மையை நீக்குகிறது. மேலும் πώποτε-இன் ‘ஒருபோதும்’ வலியுறுத்தல் வெளிப்படையாக இருக்க வேண்டும்.
