reference: Luke 19:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: ta
  text: 'ஏனெனில், நீர் கடுமையான மனிதர்[a] என்பதால் உமக்குப் பயந்தேன்: நீர் வைக்காததை எடுத்துக்கொள்கிறீர்[b]; விதைக்காததை அறுவடை செய்கிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடுமையான’ என்பதற்குப் பதிலாக ‘கண்டிப்பான’ அல்லது ‘கறாரான’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘நீர் வைக்காததை எடுத்துக்கொள்கிறீர்.’ சில மொழிபெயர்ப்புகள் இதை ‘நீர் இடாததை எடுத்துக்கொள்கிறீர்’ அல்லது ‘நீர் வைப்பாக வைக்காததை வசூலிக்கிறீர்’ என்று விளக்கமாகத் தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: உமக்குப் பயந்தேன்
  rationale: இறந்தகாலத்தில் நீடித்த அச்சநிலையை இறந்தகால வினை வடிவம் குறிக்கிறது. ‘உமக்குப் பயந்தேன்’ என்பது நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐστηρὸς
  choice: கடுமையான
  rationale: கண்டிப்பும் கடினமான அணுகுமுறையும் கொண்டவர் என்ற எதிர்மறைத் தொனியைப் பாதுகாக்கிறது; பணியாளனின் குற்றச்சாட்டை மென்மையாக்கவில்லை.
- source_word: ἄνθρωπος
  choice: மனிதர்
  rationale: உவமையில் வரும் குறிப்பிட்ட ஆண் எஜமானைக் குறிக்கிறது. ‘மனிதர்’ என்பது மரியாதைமிக்க நேரடி அழைப்புச் சூழலுக்கு ஏற்றது.
- source_word: αἴρεις
  choice: எடுத்துக்கொள்கிறீர்
  rationale: ‘எடு/எடுத்துக்கொள்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; பணத்தை வசூலித்தல் போன்ற குறிப்பான பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: ὃ οὐκ ἔθηκας
  choice: நீர் வைக்காததை
  rationale: τίθημι என்பதன் ‘வை, இடு’ என்ற நேரடிப் படிமத்தைப் பாதுகாக்கிறது; ‘வைப்புத்தொகையாகச் செலுத்து’ போன்ற விளக்கப் பொருளை மூலத்திற்குள் திணிக்கவில்லை.
- source_word: θερίζεις
  choice: அறுவடை செய்கிறீர்
  rationale: வேளாண்மைப் படிமத்தை இயல்பான நவீன தமிழில் தருவதுடன், விதைத்தல்–அறுவடை செய்தல் என்ற இணைப்பையும் காக்கிறது.
- source_word: ὃ οὐκ ἔσπειρας
  choice: விதைக்காததை
  rationale: σπείρω என்பதன் நேரடிப் பொருளையும், அறுவடையுடன் உள்ள பழமொழிச் சமநிலையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: உவமையிலுள்ள எஜமானைப் பற்றிய பணியாளனின் வருணனையை மென்மையாக்க வேண்டுமா?
  choice: பணியாளனின் குற்றஞ்சாட்டும் சொற்களை மென்மையாக்காமல் வைத்தல்
  alternative: ‘கண்டிப்பானவர்’ அல்லது ‘கறாரானவர்’ போன்ற ஓரளவு மென்மையான சொல்லைப் பயன்படுத்துதல்
  rationale: இது பணியாளன் கூறும் விளக்கமும் குற்றச்சாட்டும் ஆகும். எஜமானின் இயல்பைப் பற்றி கதைக்கு அப்பாற்பட்டு தீர்ப்பளிக்காமலும், குற்றச்சாட்டின் வலிமையைக் குறைக்காமலும் மொழிபெயர்க்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எஜமானை நேரடியாகப் பேசுவதால் ‘நீர்/உமக்கு’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. விதைத்தல்–அறுவடை செய்தல் என்ற மூல உருவகம் மாற்றமின்றிக் காக்கப்பட்டுள்ளது.
