lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει
  choice: அவர் ... இறக்கத்தை நெருங்கிவிட்டபோது
  rationale: மரபுத்தொடரின் காலப் பின்னணியையும், இயேசு அந்த இடத்தை நோக்கி நெருங்கிக்கொண்டிருந்த இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. πρὸς τῇ καταβάσει என்பது மலையின் கீழ்நோக்கிய இறக்கப் பகுதியைக் குறிக்கிறது.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: ஒலிவ மலை
  rationale: இடப்பெயரின் பொருளைத் தெளிவாகவும் தமிழில் வழக்கமான வேதாகமப் பெயரமைப்புக்கு ஏற்றவாறும் தருகிறது.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: சீடர்களாகிய பெருந்திரள் முழுவதும்
  rationale: πλῆθος குறிக்கும் பெரிய கூட்டத்தையும், அது பொதுமக்கள் கூட்டமல்ல சீடர்களின் கூட்டம் என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: χαίροντες αἰνεῖν τὸν θεὸν
  choice: மகிழ்ந்து ... கடவுளைப் புகழத் தொடங்கியது
  rationale: χαίροντες என்பதன் உடனிகழும் செயற்பொருளை ‘மகிழ்ந்து’ எனக் காத்து, ἤρξαντο ... αἰνεῖν என்பதன் ‘புகழத் தொடங்கினர்’ என்ற தொடக்கப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: கிரேக்க மொழியின் நேரடியான உருவகத்தையும் தமிழின் இயல்பான சொல்லாட்சியையும் ஒருங்கே காக்கிறது.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: தாங்கள் கண்ட எல்லா வல்ல செயல்களுக்காகவும்
  rationale: δύναμις என்பதிலுள்ள ‘வல்லமை வெளிப்படும் செயல்’ என்ற பரந்த பொருளைக் காக்கிறது; அதை உடனே ‘அற்புதங்கள்’ என்ற குறுகிய தொழில்நுட்பச் சொல்லாக மட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: அற்புதச் சூழலில் δύναμις என்பதன் மொழிபெயர்ப்பு
  choice: வல்ல செயல்கள்
  alternative: அற்புதங்கள்; வல்லமையான செயல்கள்
  rationale: இச்சொல் வல்லமை, வல்லமையின் செயல், அற்புதம் ஆகிய பொருட்களை ஏற்கக்கூடும். ‘வல்ல செயல்கள்’ என்பது தெய்வீக வல்லமை செயல்களில் வெளிப்படுவதைத் தக்கவைத்தபடியே, மூலத்தின் பொருள் பரப்பைத் தேவையின்றிக் குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ‘பெருந்திரள் முழுவதும்’ என்பது கூட்டுப் பெயராக இருப்பதால் வினை ஒருமையில் அமைக்கப்பட்டுள்ளது; கூட்டத்தின் உறுப்பினர்களைக் குறிக்க ‘தாங்கள் கண்ட’ பயன்படுத்தப்பட்டுள்ளது.
