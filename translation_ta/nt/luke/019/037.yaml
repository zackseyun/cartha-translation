  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: ta
  text: அவர் ஒலிவ மலையின் இறக்கப் பகுதியை ஏற்கெனவே நெருங்கியபோது, சீடர்களின் பெருங்கூட்டம் முழுவதும் தாங்கள் கண்ட எல்லா வல்லமையான செயல்களுக்காகவும்[a] மகிழ்ச்சியுடன் உரத்த குரலில் கடவுளைப் புகழத் தொடங்கினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்புதங்கள்” அல்லது “வல்ல செயல்கள்.” கிரேக்கச் சொல் வல்லமை வெளிப்படும் செயல்களை வலியுறுத்துகிறது.
