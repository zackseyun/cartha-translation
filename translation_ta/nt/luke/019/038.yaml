  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: ta
  text: அவர்கள், “ஆண்டவரின் பெயரில் வருகிற அரசர்[a] ஆசீர்வதிக்கப்பட்டவர்! வானத்தில் அமைதி,[b] உன்னதங்களில் மகிமை!” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பரிச்சயமான சுருக்கமான வடிவத்தில், “ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்” என்று கூறப்படுகிறது; ஆனால் லூக்காவின் உரையில் “அரசர்” என்ற சொல் வெளிப்படையாக உள்ளது.
    reason: alternative_reading
  - marker: b
    text: 'இது லூக்கா 2:14-ஐ எதிரொலிக்கிறது; ஆனால் இடத்தைக் கவனிக்கத்தக்க விதத்தில் மாற்றிக் கூறுகிறது: அங்கே “பூமியில் அமைதி”; இங்கே “வானத்தில் அமைதி.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: என்று சொல்லிக்கொண்டிருந்தார்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை முந்தைய வசனத்தில் வரும் மக்களின் செயலைத் தொடர்ந்து நடைபெறும் முழக்கமாக இணைக்கிறது; தமிழ் நடையில் அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Εὐλογημένος
  choice: ஆசீர்வதிக்கப்பட்டவர்
  rationale: சங்கீதப் பின்னணியுள்ள வாழ்த்துமுழக்கத்தைப் பாதுகாக்கும் வழக்கமான, பொருத்தமான தமிழ் சொல்; ‘போற்றப்படுபவர்’ என்று பொருளை ஒருதலைப்பட்சமாக மாற்றவில்லை.
- source_word: ὁ ἐρχόμενος
  choice: வருகிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் பொருளை அரசருடன் இயல்பாக இணைத்து, ‘வருபவர்’ என்ற அடையாளப் பொருளையும் தக்கவைக்கிறது.
- source_word: βασιλεὺς
  choice: அரசர்
  rationale: லூக்காவின் உரையில் வெளிப்படையாக உள்ள அரச அடையாளத்தைத் தக்கவைக்கிறது; மரியாதைமிக்க நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἐν ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: எபிரேயப் பின்னணியுள்ள நிலையான சொற்றொடரையும், ஆண்டவரின் அதிகாரத்தில் அல்லது அவரைப் பிரதிநிதித்துவப்படுத்தி வருதல் என்ற பொருள் வளத்தையும் பாதுகாக்கிறது.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: வானத்தில் அமைதி
  rationale: வினையில்லாத சுருக்கமான முழக்கத்தைத் தக்கவைத்து, ‘பூமியில் அமைதி’ என்று ஒத்திசைக்காமல் மூலத்தின் ‘வானத்தில்’ என்பதைக் காக்கிறது.
- source_word: δόξα ἐν ὑψίστοις
  choice: உன்னதங்களில் மகிமை
  rationale: ‘மிக உயர்ந்த இடங்கள்’ அல்லது ‘உன்னத வானுலகம்’ என்ற பொருளை விளக்கமாகக் கட்டுப்படுத்தாமல், கிரேக்கப் பன்மை வடிவத்தின் கவித்துவச் சுருக்கத்தையும் லூக்கா 2:14 உடனான ஒலிப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: வெற்றிநுழைவில் மேசியாவுக்குரிய அரச முழக்கம்
  choice: βασιλεὺς என்பதை வெளிப்படையாக ‘அரசர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்’
  rationale: லூக்காவின் உரையில் ‘அரசர்’ என்பது வெளிப்படையாக உள்ளது. அதை நீக்காமல் மொழிபெயர்ப்பது அரச மற்றும் மேசியா சார்ந்த வலியுறுத்தலைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: லூக்கா 2:14 உடனான தொடர்பு
  choice: ‘வானத்தில் அமைதி’ என்று மொழிபெயர்த்தல்
  alternative: ‘பூமியில் அமைதி’
  rationale: மூல உரை தெளிவாக ‘வானத்தில்’ என்று கூறுகிறது. லூக்கா 2:14-க்கு ஒத்திசைத்து மாற்றாமல், உரையில் உள்ள இடமாற்றத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: மரியாதைமிக்க, நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மக்களின் தொடர்ச்சியான முழக்கத்தை ‘சொல்லிக்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது. ‘உன்னதங்களில்’ என்ற கவித்துவ வடிவம் மூலத்தின் சுருக்கத்தையும் தெளிவாகத் தீர்க்கப்படாத இடக் குறிப்பையும் பாதுகாக்கிறது.
