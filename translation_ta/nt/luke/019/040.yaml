reference: Luke 19:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: ta
  text: 'அதற்கு அவர், “நான் உங்களுக்குச் சொல்கிறேன்: இவர்கள் மௌனமானால், கற்கள் கூக்குரலிடும்” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: அதற்கு அவர்
  rationale: முன்னர் கூறப்பட்டதற்குப் பதிலளிக்கும் பங்கேற்புவினையின் பொருளை இயல்பான நவீனத் தமிழில் காட்டுகிறது; தொடர்ந்து வரும் ‘என்றார்’ உடன் தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: முதன்மை வினையான ‘சொன்னார்’ என்ற பொருளை நேரடி உரைக்குப் பின் இயல்பான தமிழில் தருகிறது.
- source_word: Λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: வலியுறுத்தலும் அதிகாரமிக்க நேரடித் தொனியும் காக்கப்படும் பொதுவான நவீனத் தமிழ் வடிவம்.
- source_word: ὅτι
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது இயேசு கூறும் உள்ளடக்கத்தை அறிமுகப்படுத்தி உடனே நிபந்தனை வாக்கியத்துக்கு வழிவகுக்கிறது; தமிழில் ‘என்று, இவர்கள்...’ எனச் சேர்ப்பது இயல்பற்றதாகும்.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: சூழலில் உள்ளவர்களைக் குறிக்கும் சுட்டுப்பெயரை ‘சீடர்கள்’ போன்ற விளக்கச் சேர்க்கையின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: σιωπήσουσιν
  choice: மௌனமானால்
  rationale: இப்போது ஒலித்துக்கொண்டிருப்பவர்கள் அமைதியாகும் மாற்றத்தை நிபந்தனை வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ λίθοι
  choice: கற்கள்
  rationale: λίθοι என்பதன் நேரடி, தெளிவான பொருளைத் தருகிறது; தமிழில் பொதுப்படக் குறிப்பிடும் பன்மைப் பெயருக்கு தனி குறிப்புச் சுட்டு தேவையில்லை.
- source_word: κράξουσιν
  choice: கூக்குரலிடும்
  rationale: உரத்த குரலெழுப்புதல் என்ற κράζω வினையின் தீவிரத்தையும் உயிருள்ள காட்சியையும் காக்கிறது.
theological_decisions:
- issue: கற்கள் குரலெழுப்பும் கூற்றை உருவகமாகவோ அற்புதமாகவோ வெளிப்படையாக விளக்க வேண்டுமா
  choice: ‘கற்கள் கூக்குரலிடும்’ என்ற நேரடியான உருவப்படத்தை விளக்கமின்றி வைத்தல்
  alternative: கற்கள் உருவகமாகச் சாட்சி கூறும்; படைப்பு முழுவதும் தேவனைப் புகழும்
  rationale: கிரேக்கம் எந்த விளக்கமும் தராமல் வலுவான படிமத்தை முன்வைக்கிறது. இது மிகைப்படுத்தலா, தீர்க்கதரிசனப் படிமமா, அற்புத சாத்தியமா என்பதைத் தீர்மானிக்காமல் அதன் இறையியல் மற்றும் சொல்லாட்சித் தீவிரத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்கப் பங்கேற்புவினைத் தமிழில் ‘அதற்கு அவர் ... என்றார்’ என்ற சுற்றியமைப்பில் இயல்பாக்கப்பட்டுள்ளது.
