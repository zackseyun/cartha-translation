review_pass:
  verdict: approve
  source_fidelity: ‘அதற்கு அவர் ... என்றார்’ appropriately conveys the responsive participle ἀποκριθείς together with εἶπεν without unnatural duplication. ‘நான் உங்களுக்குச் சொல்கிறேன்’ accurately preserves Λέγω ὑμῖν. The conditional ‘இவர்கள் மௌனமானால்’ faithfully represents οὗτοι σιωπήσουσιν, and ‘கற்கள் கூக்குரலிடும்’ preserves both the concrete subject and the forceful future verb κράξουσιν.
  naturalness: The sentence is clear, dignified, and natural in modern standard Tamil. ‘மௌனமானால்’ and ‘கூக்குரலிடும்’ have an appropriately elevated but readily understandable scriptural register. The direct-speech structure and punctuation read smoothly.
  terminology: ‘இவர்கள்’ retains the demonstrative without importing ‘disciples’; ‘கற்கள்’ is a direct rendering of λίθοι; and ‘கூக்குரலிடும்’ suitably conveys a loud outcry rather than merely speaking. The striking image is retained without doctrinal or interpretive explanation.
