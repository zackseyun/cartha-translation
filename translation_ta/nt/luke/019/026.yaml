source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: ta
  text: '“உங்களுக்குச் சொல்கிறேன்: எவரிடம் இருக்கிறதோ, அவருக்குக் கொடுக்கப்படும்[a]; ஆனால் எவரிடம் இல்லையோ, அவரிடமிருந்து அவரிடம் இருப்பதும்கூட எடுத்துக்கொள்ளப்படும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் அதிகமாகக் கொடுக்கப்படும்.” கிரேக்க மூலத்தில் “அதிகமாக” என்ற சொல் வெளிப்படையாக இல்லை; ஆனால் சூழலில் அதிகரிப்பு குறிக்கப்படுவதாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் நிகழ்கால வினையை இயல்பான, வலியுறுத்தலுள்ள நவீனத் தமிழில் தருகிறது.
- source_word: παντὶ τῷ ἔχοντι
  choice: எவரிடம் இருக்கிறதோ, அவருக்கு
  rationale: ‘வைத்திருக்கும் ஒவ்வொருவருக்கும்’ என்ற செயற்கையான வடிவைத் தவிர்த்து, பொருள் என்னவென்று சேர்க்காமல், substantival participle-இன் பொதுவான மற்றும் திறந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: δοθήσεται
  choice: கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவை நேரடியாகத் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அதிகமாக’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: ஆனால் எவரிடம் இல்லையோ, அவரிடமிருந்து
  rationale: δέ-யின் எதிர்மறைத் திருப்பை ‘ஆனால்’ எனவும், μή உடன் வரும் பொதுவான articular participle-ஐ இயல்பான தமிழ் தொடர்பமைப்பிலும் தருகிறது.
- source_word: καὶ ὃ ἔχει
  choice: அவரிடம் இருப்பதும்கூட
  rationale: இங்கு καί வலியுறுத்தும் பொருளில் இருப்பதால் ‘கூட’ என மொழிபெயர்க்கப்படுகிறது; கூறின் திட்டமிட்ட முரண்பாட்டுத் தன்மை காக்கப்படுகிறது.
- source_word: ἀρθήσεται
  choice: எடுத்துக்கொள்ளப்படும்
  rationale: αἴρω என்பதன் நீக்குதல் அல்லது பறித்தல் சார்ந்த எதிர்காலச் செயப்பாட்டுப் பொருளை தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இந்தக் கூற்றை அதிகரிப்பும் இழப்பும் பற்றிய பொதுக் கொள்கையாகப் புரிந்துகொள்ளும் விதம்
  choice: இரட்சிப்பு, தகுதி, முன்நியமனம் அல்லது வேறு கோட்பாட்டு விளக்கத்தைச் சொற்களுக்குள் சேர்க்காமல், கூற்றை அதன் சுருக்கத்தோடு மொழிபெயர்த்தல்
  alternative: இதை உவமையின் பணிப்பொறுப்பு பற்றிய கருத்தாக மட்டும் விளக்குதல், அல்லது பரந்த இறையரசுக் கொள்கையாக வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: வசனம் தானாகவே அந்த இறையியல் செயல்முறையை வரையறுக்கவில்லை. எனவே அதன் பயன்பாட்டை விளக்கவுரைக்கு விட்டுவிட்டு, மூலத்தின் இறையியல் பதற்றமும் திறந்த தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘எவரிடம் இருக்கிறதோ / இல்லையோ’ என்ற இணை அமைப்பு கிரேக்கப் பழமொழியின் சுருக்கத்தையும் திட்டமிட்ட முரண்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
