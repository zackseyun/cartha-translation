  source_fidelity: 'மூலக் கிரேக்கத்தின் அமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: παντὶ τῷ ἔχοντι என்பதன் பொதுவான ‘எவரிடம் இருக்கிறதோ,’ δοθήσεται என்பதன் எதிர்காலச் செயப்பாட்டு ‘கொடுக்கப்படும்,’ மற்றும் ἀπὸ... τοῦ μὴ ἔχοντος... ἀρθήσεται என்பதன் இழப்பு-முரண்பாடு அனைத்தும் சரியாக வெளிப்பட்டுள்ளன. முதன்மை உரையில் கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அதிகமாக’ சேர்க்கப்படவில்லை; வலியுறுத்தும் καί, ‘கூட’ மூலம் பொருத்தமாகக் காட்டப்பட்டுள்ளது.'
