translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடி உரை. எஜமானின் கண்டிப்பான கேள்வித் தொனி தக்கவைக்கப்பட்டுள்ளது; பழமையான நிதிசார் உருவகம் முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் சொற்சொல்லாகவும் வழங்கப்பட்டுள்ளது.
