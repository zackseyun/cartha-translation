  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: ta
  text: “அப்படியானால், என் பணத்தை ஏன் வங்கியில்[a] வைப்பாகச் செலுத்தவில்லை? நான் வந்ததும் அதை வட்டியோடு வசூலித்திருப்பேனே.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வங்கியாளர்களிடம் என் பணத்தை ஒப்படைக்கவில்லை” என்றும் மொழிபெயர்க்கலாம்; சொற்சொல்லாக, “என் பணத்தை ஒரு மேசையின்மேல் வைத்துக் கொடுக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் இயல்பான நவீனத் தமிழ்ச் சொல்; கேள்வியில் உள்ள கண்டிப்பையும் தக்கவைக்கிறது.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: வங்கியில் ... போட்டு வைக்கவில்லை
  rationale: சொற்சொல்லாகப் பணத்தை ‘மேசையின்மேல்’ கொடுப்பதைக் குறித்தாலும், இந்த நிதிசார் சூழலில் τράπεζα வங்கியாளரின் மேசையையோ வங்கி ஏற்பாட்டையோ குறிக்கிறது. ‘வங்கியில் போட்டு வை’ என்பது நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μου τὸ ἀργύριον
  choice: என் பணத்தை
  rationale: ἀργύριον என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’ என்றாலும், இங்கு பரிவர்த்தனைக்குரிய பணத்தைக் குறிக்கிறது; ‘பணம்’ நவீனத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: κἀγὼ ἐλθὼν
  choice: நான் வந்ததும்
  rationale: கிரேக்க இறந்தகால வினையெச்சத்தை இயல்பான காலத் தொடர்பாக மொழிபெயர்க்கிறது; வருகைக்குப் பின் உடனடியாகப் பணத்தைப் பெறும் கருத்தோட்டத்தையும் காட்டுகிறது.
- source_word: σὺν τόκῳ
  choice: வட்டியோடு
  rationale: வைப்புப் பணத்திற்குக் கிடைக்கும் interest என்பதற்கான தெளிவான, வழக்கமான தமிழ்ச் சொல்; தேவையற்ற எதிர்மறை அறச்சாயலைச் சேர்க்கவில்லை.
- source_word: αὐτὸ ἔπραξα
  choice: அதை ... வசூலித்திருப்பேனே
  rationale: πράσσω இங்கு கிடைக்க வேண்டிய தொகையைப் பெற்றுக்கொள்வது அல்லது வசூலிப்பது என்ற வணிகப் பொருளைக் கொண்டுள்ளது. ἄν உணர்த்தும் நிகழாத சாத்தியத்தை ‘வசூலித்திருப்பேன்’ தக்கவைக்கிறது; இறுதியிலுள்ள ‘ஏ’ கண்டிப்பின் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
