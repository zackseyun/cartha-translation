reference: Luke 19:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: ta
  text: அவன் அவனிடம், “உன் சொந்த வாயிலிருந்தே உனக்குத் தீர்ப்பளிப்பேன், பொல்லாத அடிமையே! நான் வைக்காததை எடுத்துக்கொள்கிறவனும், நான் விதைக்காததை அறுவடை செய்கிறவனுமான கடுமையான மனிதன் என்று உனக்குத் தெரிந்திருந்ததே?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: உன் வாயிலிருந்து வந்ததைக் கொண்டே
  rationale: ஊழியனின் சொந்தக் கூற்றையே தீர்ப்பின் அடிப்படையாகக் கொள்வது என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κρίνω
  choice: தீர்ப்பளிப்பேன்
  rationale: எதிர்கால வினை வடிவத்தைப் பேணுகிறது; சூழலில் தண்டனை உட்பொருளாக இருந்தாலும், ‘கண்டனம் செய்வேன்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: πονηρὲ δοῦλε
  choice: பொல்லாத அடிமையே
  rationale: πονηρός தரும் ஒழுக்கக் குற்றச்சாட்டையும், எஜமான்–அடிமை உறவில் δοῦλος குறிக்கும் கட்டுப்பட்ட சமூக நிலையையும் நேரடியாகப் பேணுகிறது.
- source_word: ᾔδεις
  choice: உனக்குத் தெரிந்திருந்ததே
  rationale: ஊழியன் முன்பு கூறிய கூற்றை அவனுக்கு எதிராகத் திருப்பும் வினாவுரையின் தொனியையும், கடந்தகால அறிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐστηρός
  choice: கடுமையான
  rationale: எதிர்மறையான கண்டிப்பும் இரக்கமின்மையும் கொண்ட பண்பை நவீனத் தமிழில் தெளிவாகத் தருகிறது; ‘கண்டிப்பான’ என்பதைக் காட்டிலும் வலிமையானது.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: நான் வைக்காததை எடுத்துக்கொள்கிறவன்
  rationale: τίθημι என்பதன் பொதுவான ‘வை’ பொருளையும் αἴρω என்பதன் ‘எடுத்துக்கொள்’ பொருளையும் பேணி, நிதி வைப்புத் தொகை என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: நான் விதைக்காததை அறுவடை செய்கிறவன்
  rationale: ‘எதை’ என்ற கிரேக்க நேரடிப் பொருளைத் தக்கவைத்து, விதைத்தல்–அறுவடை செய்தல் என்ற வேளாண் உருவகத்தை இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: உவமையில் வரும் δοῦλος என்பதன் சமூக நிலை
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாள்
  rationale: இங்கு எஜமான் அதிகாரமும் கீழ்ப்பட்ட நபரின் கட்டுப்பட்ட நிலையும் சூழலில் முக்கியம்; ஆகவே மென்மைப்படுத்தாமல் ‘அடிமை’ என வழங்கப்படுகிறது.
- issue: எஜமானின் ‘கடுமையான மனிதன்’ என்ற சுயவிளக்கம் உண்மையாக உறுதிப்படுத்தப்படுகிறதா
  choice: ஊழியனின் சொந்தக் கூற்றை எஜமான் வினாவுரையாக அவனுக்கு எதிராகத் திருப்பும் வடிவம் அப்படியே பேணப்பட்டது.
  alternative: ‘நான் கடுமையானவன் என்று நீ சொல்கிறாயே’ அல்லது ‘நான் கடுமையானவன் என்றால்’ என்று விளக்கிச் சேர்த்தல்
  rationale: கிரேக்கம் ‘நான் கடுமையான மனிதன் என்று உனக்குத் தெரிந்திருந்ததே?’ என்று நேரடியாக அமைந்துள்ளது. உவமையின் தெய்வவியல் பொருளை மொழிபெயர்ப்பே முன்கூட்டியே தீர்மானிக்காமல் அந்தச் சொல்லாட்சியின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பொல்லாத அடிமையே’ நேரடி அழைப்பின் கடுமையைப் பேணுகிறது. இறுதிப் பகுதியின் கிரேக்க நிறுத்தக்குறி பதிப்பாசிரியர் தீர்மானம் என்பதால், முக்கிய உரையில் சூழலுக்கேற்ற வினாவுரையும் அடிக்குறிப்பில் கூற்றுரையும் வழங்கப்பட்டுள்ளன.
