base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: ta
  text: அவர் முன்னே ஓடிச்சென்று, அவரைப் பார்ப்பதற்காக ஒரு சிக்கமோர் அத்தி மரத்தில்[a] ஏறினார்; ஏனெனில் அவர் அந்த வழியாகக் கடந்து செல்லவிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, சிக்கமோர் அத்தி மரம் (Ficus sycomorus); இது பொதுவாக “sycamore” என அழைக்கப்படும் வேறு மரம் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: முன்னால் ஓடிப்போய்
  rationale: முன்னே செல்வதையும் அதற்காக ஓடியதையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; கிரேக்கத்தில் உள்ள இரு கூறுகளின் வலியுறுத்தலையும் தேவையற்ற மறுபடியுரையின்றி தருகிறது.
- source_word: ἀνέβη ἐπὶ
  choice: மரத்தில் ஏறினார்
  rationale: மரத்தின் மேல்/கிளைகளுக்குள் ஏறிய செயலைத் தமிழில் இயல்பாகக் குறிக்கும் வழக்கு.
- source_word: συκομορέαν
  choice: காட்டத்தி மரம்
  rationale: Ficus sycomorus எனப்படும் sycamore-fig மரத்திற்குப் பயன்படும் தமிழ் தாவரவியல் பெயர்; பொதுவாசகர்களுக்கான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: அவரைப் பார்ப்பதற்காக
  rationale: ἵνα உடன் வரும் வினை வெளிப்படுத்தும் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அவர் ஏன் மரத்தில் ஏறினார் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἐκείνης
  choice: அந்த வழியாக
  rationale: கிரேக்கப் பெண்பால் சுட்டுப்பெயர் இங்கு மறைமுகமாக வழி அல்லது பாதையைக் குறிப்பதாகத் தெரிகிறது; குறிப்பிட்ட தெரு ஒன்றை உரையில் சேர்க்காமல் அந்த மறைபொருளைப் பாதுகாக்கிறது.
- source_word: ἤμελλεν διέρχεσθαι
  choice: கடந்து செல்லவிருந்தார்
  rationale: μέλλω உடன் வரும் infinitive குறிக்கும் உடனடி அல்லது எதிர்பார்க்கப்பட்ட எதிர்காலச் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
