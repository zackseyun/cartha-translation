source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: ta
  text: ஏனெனில், நாட்கள் உன்மேல் வரும்; அப்போது உன் பகைவர்கள் உனக்கு எதிராக ஒரு முற்றுகை மேட்டை எழுப்பி[a], உன்னைச் சுற்றிவளைத்து, எல்லாப் பக்கங்களிலிருந்தும் உன்னை நெருக்குவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு முற்றுகை அரணை அமைத்து.”
    reason: χάραξ என்பது இச்சூழலில் முற்றுகை மேடு, அரண் அல்லது தடுப்பு அமைப்பு போன்ற முற்றுகைப் பணியைக் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள இயேசுவின் புலம்பலுக்கும் இங்கு கூறப்படும் காரணத்துக்கும் உள்ள தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: நாட்கள் உன்மேல் வரும்
  rationale: வரவிருக்கும் நிகழ்வுகள் எருசலேமை வந்தடையும் என்ற தீர்க்கதரிசனத் தொனியையும் கிரேக்க மொழியின் உருவகத்தையும் தக்கவைக்கிறது.
- source_word: παρεμβαλοῦσιν
  choice: எழுப்பி
  rationale: χάρακα என்பதுடன் சேர்ந்து முற்றுகைப் பணியை அமைப்பதைக் குறிக்கிறது; தமிழில் கட்டுமானச் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οἱ ἐχθροί σου
  choice: உன் பகைவர்கள்
  rationale: எருசலேமுக்கு எதிராக வரும் பகைமைப் படைகளை நேரடியாகக் குறிக்கிறது.
- source_word: χάρακά
  choice: ஒரு முற்றுகை மேட்டை
  rationale: நகரைத் தாக்குவதற்காக எழுப்பப்படும் siege work அல்லது rampart என்ற பொருளை நவீன வாசகர்கள் புரிந்துகொள்ளும் வகையில் தெரிவிக்கிறது; சொல்லின் வேறு சாத்தியமான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σοι
  choice: உனக்கு எதிராக
  rationale: இந்தச் சூழலில் எருசலேமுக்குத் தீங்கு விளைவிக்கும் நோக்கில் முற்றுகை அமைக்கப்படுவதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: περικυκλώσουσίν σε
  choice: உன்னைச் சுற்றிவளைத்து
  rationale: முற்றுகைப் படைகள் நகரை முழுவதும் சூழ்வதை இயல்பான இராணுவச் சொல்லாட்சியில் தெரிவிக்கிறது.
- source_word: συνέξουσίν σε πάντοθεν
  choice: எல்லாப் பக்கங்களிலிருந்தும் உன்னை நெருக்குவார்கள்
  rationale: எல்லாத் திசைகளிலிருந்தும் அடைத்து அழுத்தும் முற்றுகைச் செயலையும் πάντοθεν தரும் முழுமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இரண்டாம் நபர் ஒருமைப் பிரதிப்பெயரின் சுட்டுப்பொருள்
  choice: எருசலேமை உருவகப்படுத்திப் பேசும் ஒருமை ‘உன்/உன்னை’ தக்கவைக்கப்பட்டது.
  alternative: நகரின் குடிமக்களைச் சேர்த்துக் குறிக்கும் பன்மையாக வெளிப்படுத்தலாம்.
  rationale: கிரேக்க மூலத்தில் ஒருமைப் பிரதிப்பெயர்கள் உள்ளன; அவை உடனடி சூழலில் எருசலேமை ஒரு நபரைப்போல் நோக்கிப் பேசும் தீர்க்கதரிசன மற்றும் கவித்துவ வலிமையைத் தக்கவைக்கின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தீர்க்கதரிசனத்தின் கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டது. எருசலேமை நோக்கிய ஒருமை அழைப்பு மாற்றப்படவில்லை.
