  terminology: “பகைவர்கள்,” “முற்றுகை மேடு,” “சுற்றிவளைத்து,” “நெருக்குவார்கள்” ஆகியவை சூழலுக்கேற்ற சொற்கள். χάραξ-க்கான “முற்றுகை மேடு” பாதுகாப்பான முதன்மைத் தேர்வு; அடிக்குறிப்பில் உள்ள “முற்றுகை அரண்” மாற்றுவழி பொருத்தமானது. எந்தக் கோட்பாட்டுச் சேர்க்கையும் இல்லை.
