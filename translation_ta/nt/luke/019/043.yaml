  source_fidelity: மூலத்தின் காரணவியல் இணைப்பு (ὅτι), எதிர்காலத் தீர்க்கதரிசனத் தொனி, எருசலேமை நோக்கிய ஒருமை இரண்டாம் நபர், மற்றும் முற்றுகையின் மூன்று செயல்கள்—முற்றுகைப் பணியை அமைத்தல், சுற்றிவளைத்தல், எல்லாத் திசைகளிலிருந்தும் நெருக்குதல்—அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. “உன்மேல்” என்பது ἐπὶ σέ என்பதன் உருவகமான தாக்கத்தையும் தக்கவைக்கிறது.
