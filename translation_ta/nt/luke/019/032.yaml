revisions:
- from: அனுப்பப்பட்டவர்கள் புறப்பட்டுப் போய், அவர் தங்களிடம் சொன்னபடியே இருப்பதைக் கண்டார்கள்.[a]
  to: அனுப்பப்பட்டவர்கள் புறப்பட்டுச் சென்று, அவர் அவர்களிடம் சொன்னபடியே அதைக் கண்டார்கள்.[a]
  rationale: The revision replaces the added existential expression with “அதைக்,” which gives natural Tamil while acknowledging in the footnote that the Greek leaves the object implicit. It preserves the contextual reference without treating an existential claim as part of the source text.
  reviewer_model: gpt-5.6-terra
