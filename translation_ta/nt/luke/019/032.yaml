translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கத்தையும் செயப்படுபொருள் விடுபட்டிருப்பதையும் அடிக்குறிப்பின் மூலம் வெளிப்படையாகப் பேணியபடி, முதன்மை உரை இயல்பான தமிழாக அமைக்கப்பட்டுள்ளது.
