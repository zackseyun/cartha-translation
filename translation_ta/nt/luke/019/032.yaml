  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: ta
  text: அனுப்பப்பட்டவர்கள் புறப்பட்டுச் சென்று, அவர் அவர்களிடம் சொன்னபடியே அதைக் கண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘அதை’ என்ற செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய சூழலில் இயேசு கூறிய கழுதைக்குட்டியே குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: புறப்பட்டுப் போய்
  rationale: ἀπέρχομαι என்ற வினையின் இறந்தகால வினையெச்சம்; அங்கிருந்து புறப்பட்டுச் சென்ற செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வினையெச்சத் தொடரே அந்த முன்னேற்றத்தை இயல்பாகத் தெரிவிப்பதால் தனியாக ‘அப்போது’ அல்லது ‘ஆகவே’ சேர்க்கப்படவில்லை.
- source_word: οἱ ἀπεσταλμένοι
  choice: அனுப்பப்பட்டவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தநிலைச் செயப்பாட்டு வினையெச்சத்தின் செயப்பாட்டு கருத்தைத் தெளிவாகப் பேணுகிறது; ‘தூதர்கள்’ என்ற கூடுதல் பொருளை இறக்குமதி செய்யவில்லை.
- source_word: εὗρον
  choice: இருப்பதைக் கண்டார்கள்
  rationale: εὗρον என்பதற்கு ‘கண்டார்கள்’ என்று பொருள். கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; தமிழில் இயல்புக்காக ‘இருப்பதை’ சேர்க்கப்பட்டுள்ளது, ஆனால் அது முந்தைய சூழலில் விவரிக்கப்பட்ட கழுதைக்குட்டியைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: καθὼς
  choice: சொன்னபடியே
  rationale: அவர் முன்பு கூறியதற்கும் அவர்கள் கண்டதற்கும் இடையிலான நேரான ஒத்திசைவை ‘-படியே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் தங்களிடம் சொன்ன
  rationale: λέγω என்பதன் பொதுவான ‘சொல்’ பொருளைப் பேணுகிறது; αὐτοῖς என்பதற்கு, எழுவாயான அனுப்பப்பட்டவர்களையே திரும்பக் குறிப்பதால் இயல்பான தமிழ் தற்சுட்டுப் பதிலிப்பெயரான ‘தங்களிடம்’ பயன்படுத்தப்பட்டுள்ளது.
