  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: ta
  text: ஏனெனில், இழந்துபோனதைத் தேடவும் மீட்கவும் மானிடமகன் வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இழந்துபோனவர்கள்.’ கிரேக்கச் சொற்றொடர் நபுஞ்சக ஒருமையில் உள்ளது; அது பொதுப்படையான பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: கதைச் சூழலில் இறந்தகால நிகழ்வைக் குறிக்கும் aorist வினையை இயல்பான தமிழ் இறந்தகாலமாக மொழிபெயர்க்கிறது; எழுவாயான மானிடமகனுக்கு மரியாதைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் தனிச்சிறப்பான சுயகுறிப்பையும் தானியேல் நூலோடு உள்ள ஒலிப்பையும் காக்கும், தமிழில் புரிந்துகொள்ளத்தக்க தலைப்புச் சொல்.
- source_word: ζητῆσαι
  choice: தேட
  rationale: ἦλθεν என்பதற்குப் பின் வரும் நோக்கத்தைக் குறிக்கும் infinitive-ஐ இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: σῶσαι
  choice: காப்பாற்ற
  rationale: உடல் ஆபத்திலிருந்து மீட்பதை மட்டும் அல்லாமல், லூக்கா 19:9-ன் இரட்சிப்பு சார்ந்த பரந்த பொருளையும் தமிழில் தாங்கக்கூடிய இயல்பான சொல்.
- source_word: τὸ ἀπολωλός
  choice: இழந்துபோனதை
  rationale: நபுஞ்சக ஒருமை perfect participle-இன் வடிவத்தையும், தனிநபரையோ பொதுவாக இழந்துபோனவர்களையோ குறிக்கக்கூடிய தெளிவின்மையையும் தேவையின்றி சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: τὸ ἀπολωλός என்பதன் குறிப்பு மற்றும் பரப்பு
  choice: இழந்துபோனதை
  alternative: இழந்துபோனவர்களை
  rationale: கிரேக்கத்தில் இது article உடைய நபுஞ்சக ஒருமை வடிவம்; சக்கேயை உடனடியாகக் குறிப்பதோடு, இயேசுவின் விரிந்த பணியையும் பொதுப்படையாகச் சுட்டலாம். ‘இழந்துபோனதை’ என்பது மூலத்தின் ஒருமை வடிவத்தையும் உண்மையான குறிப்புத் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மானிடமகன்’ தலைப்புச் சொல்லாக இணைத்து எழுதப்பட்டது; நோக்கத்தை வலியுறுத்த ‘வே’ பயன்படுத்தப்பட்டது.
