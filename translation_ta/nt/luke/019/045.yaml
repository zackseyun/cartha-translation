lexical_decisions:
- source_word: εἰσελθὼν
  choice: உள்ளே சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வினையை, இயல்பான நவீனத் தமிழில் நிகழ்வுகளின் வரிசை தெளிவாகத் தெரியுமாறு மொழிபெயர்க்கிறது.
- source_word: ἱερὸν
  choice: ஆலய வளாகம்
  rationale: ἱερόν என்பது உட்புறப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலயத்தின் விரிவான வளாகத்தைக் குறிக்கிறது. தமிழில் ‘ஆலயம்’ மட்டும் அந்த இடவியற் நுட்பத்தை மறைக்கக்கூடும் என்பதால் ‘ஆலய வளாகம்’ பயன்படுத்தப்பட்டது.
