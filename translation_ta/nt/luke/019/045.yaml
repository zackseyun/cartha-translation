  rationale: ἄρχομαι என்பதன் தொடக்கநிலைப் பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκβάλλειν
  choice: வெளியே துரத்த
  rationale: ἐκβάλλω குறிக்கும் வலுவான, தீர்மானமான வெளியேற்றத்தை ‘வெளியே துரத்த’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: πωλοῦντας
  choice: விற்றுக்கொண்டிருந்தவர்கள்
  rationale: விற்பனைச் செயலில் தொடர்ந்து ஈடுபட்டிருந்தவர்களைக் குறிக்கும் நிகழ்காலப் பங்கேற்பு வினையின் தொடர்ச்சித் தன்மையைப் பாதுகாக்கிறது; அவர்கள் விற்ற பொருளை வசனம் குறிப்பிடாததால் அதைக் கூட்டிச் சொல்லவில்லை.
theological_decisions:
- issue: இயேசுவின் நடவடிக்கை நடைபெற்ற இடத்தைக் குறிக்கும் ἱερόν என்பதன் பரப்பு
  choice: ஆலய வளாகம்
  alternative: ஆலயம்; ஆலய முற்றங்கள்; பரிசுத்த இடம்
  rationale: கிரேக்கச் சொல் பொதுவாக முழு ஆலய வளாகத்தையே குறிக்கிறது; உட்புறப் பரிசுத்த இடத்தைக் குறிக்கும் ναός என்பதுடன் இதை ஒன்றாக்காமல் இடத்தின் பரப்பைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
