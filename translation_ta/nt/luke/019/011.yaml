  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: ta
  text: அவர்கள் இவற்றைக் கேட்டுக்கொண்டிருந்தபோது, அவர் தொடர்ந்து ஓர் உவமையைச் சொன்னார். ஏனெனில், அவர் எருசலேமுக்கு அருகில் இருந்தார்; மேலும், கடவுளின் அரசாட்சி உடனே வெளிப்படவிருக்கிறது[a] என்று அவர்கள் எண்ணினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடனே வெளிப்படையாகத் தோன்றவிருக்கிறது.” இங்குள்ள வினைச்சொல் ஒன்று காணக்கூடியதாக அல்லது தெளிவாக வெளிப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: அவர்கள் இவற்றைக் கேட்டுக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையுடன் அமைந்த தனிநிலை வேற்றுமைத்தொடர், அதே நேரத்தில் தொடர்ந்து நடந்த செயலைக் குறிக்கிறது; ‘கேட்டுக்கொண்டிருந்தபோது’ அந்த நீடித்த தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: προσθεὶς εἶπεν
  choice: அவர் தொடர்ந்து ... சொன்னார்
  rationale: இது பேச்சை மேலும் தொடர்வதைக் குறிக்கும் மரபுத்தொடர்; சொற்சொல்லாக ‘சேர்த்துச் சொன்னார்’ என்பதைக் காட்டிலும் இங்கு ‘தொடர்ந்து சொன்னார்’ இயல்பாக உள்ளது.
- source_word: παραβολὴν
  choice: ஓர் உவமையை
  rationale: நற்செய்தி நூல்களில் இவ்வகை போதனைக் கதைக்குப் பயன்படும் நிலையான, பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: அவர் எருசலேமுக்கு அருகில் இருந்தார் என்பதால்
  rationale: διά உடன் வரும் பெயராக்கப்பட்ட வினையெச்சத் தொடர் காரணத்தைக் காட்டுகிறது; எருசலேமுக்கு அருகில் இருந்தவர் இயேசுவே என்பதைத் தமிழ் வாக்கியம் தெளிவாக்குகிறது.
- source_word: δοκεῖν αὐτοὺς
  choice: அவர்கள் எண்ணினார்கள்
  rationale: அவர்களுடைய கருத்து அல்லது எதிர்பார்ப்பை, உறுதியான அறிவாகக் காட்டாமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: காலத் தாமதமின்மையை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: வெளிப்படவிருக்கிறது
  rationale: μέλλω அண்மையில் நிகழவிருப்பதையும் ἀναφαίνεσθαι காணக்கூடியதாக அல்லது வெளிப்படையாக ஆவதையும் குறிக்கின்றன; இந்தத் தேர்வு இரண்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளின் அரசு
  rationale: βασιλεία என்பதன் ஆட்சி மற்றும் அரசுலகம் சார்ந்த பொருள் பரப்பை முழுமையாகச் சுருக்கிவிடாமல், சாதாரண வாசகர்களுக்குப் புரியும் நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கடவுளின் அரசு எவ்வகையில் வெளிப்படும் என்ற எதிர்பார்ப்பு
  choice: ‘கடவுளின் அரசு உடனே வெளிப்படவிருக்கிறது’ என்று மட்டும் கூறுதல்
  alternative: அது அரசியல் ரீதியாக நிறுவப்படும் அல்லது இறுதிக்காலத்தில் முழுமையாக வெளிப்படுத்தப்படும் என்று குறிப்பாக்குதல்
  rationale: வசனம் உடனடியான வெளிப்பாட்டைப் பற்றிய அவர்களுடைய எதிர்பார்ப்பைச் சொல்கிறது; அது அரசியல், இறுதிக்கால அல்லது ஆன்மீக வடிவமா என்பதை வரையறுப்பதில்லை. மொழிபெயர்ப்பு அந்தத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் வாசிப்போட்டத்திற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரு காரணங்களின் தொடர்பும் காக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘வெளிப்படவிருக்கிறது’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
