id: LUK.19.31
reference: Luke 19:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: ta
  text: யாராவது உங்களிடம், ‘இதை ஏன் அவிழ்க்கிறீர்கள்?’ என்று கேட்டால், ‘இது ஆண்டவருக்குத்[a] தேவை’ என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஜமான்.”
    reason: κύριος என்பதற்கு இச்சூழலில் சாத்தியமான மாற்றுப் பொருளைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: கேட்டால்
  rationale: நேரடிக் கேள்வி கேட்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; கிரேக்க நிபந்தனை அமைப்பையும் காக்கிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் சொற்றொடருக்கான தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: λύετε
  choice: இதை ... அவிழ்க்கிறீர்கள்
  rationale: கட்டப்பட்டிருந்த கழுதைக்குட்டியைத் தளையிலிருந்து அவிழ்ப்பதே சூழல். கிரேக்கத்தில் மறைந்துள்ள செயப்படுபொருளைத் தமிழில் ‘இதை’ என்று வெளிப்படுத்துவது தெளிவளிக்கிறது.
- source_word: οὕτως ἐρεῖτε
  choice: என்று சொல்லுங்கள்
  rationale: எதிர்கால வினை இங்கு அறிவுறுத்தும் வலிமையுடன் வருகிறது; தமிழில் கட்டளை வடிவம் அந்தச் செயல்பாட்டை இயல்பாகத் தருகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இயேசுவைக் குறிக்கும் பட்டத்தையும் லூக்காவில் அதற்குள்ள இறையியல் ஒலிப்பையும் பாதுகாக்கிறது.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: இது ஆண்டவருக்குத் தேவை
  rationale: கிரேக்க மரபுத்தொடரின் பொருள் ‘ஆண்டவருக்கு இது தேவை’ என்பதாகும். தமிழில் இயல்பான சொல் வரிசையுடன், αὐτοῦ கழுதைக்குட்டியைக் குறிப்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ὁ κύριος என்பதன் பொருளும் குறிக்கப்படுபவரும்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: உடனடிச் சூழலில் இயேசுவே பேசுபவர்; லூக்காவின் பயன்பாட்டில் κύριος இயேசுவுக்கான பட்டமாகவும் ஒலிக்கிறது. ‘ஆண்டவர்’ அந்த இறையியல் பரிமாணத்தைப் பாதுகாக்கிறது; ‘எஜமான்’ என்ற நடைமுறைப் பொருளைத் தேர்ந்தெடுத்து வசனத்தைச் சுருக்கமாக விளக்கிவிடவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். கிரேக்கத்தின் அறிவுறுத்தும் எதிர்காலத்தை தமிழில் இயல்பான கட்டளை வடிவமாக வழங்குகிறது. இவ்வசனத்தின் αὐτοῦ குறிக்கும் கழுதைக்குட்டி முன்சூழலில் தெளிவாக இருப்பதால் தனிக் குறிப்புரை சேர்க்கப்படவில்லை.
