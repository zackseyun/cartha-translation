id: LUK.19.44
reference: Luke 19:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: ta
  text: உன்னையும் உன்னுள் இருக்கும் உன் பிள்ளைகளையும் தரைமட்டமாக்குவார்கள். உன்னுள் ஒரு கல்லின்மேல் ஒரு கல்லைக்கூட விட்டுவைக்க மாட்டார்கள். ஏனெனில், உன்னைச் சந்தித்த காலத்தை[a] நீ உணர்ந்துகொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை ஆய்வுசெய்த காலத்தை.” கிரேக்கச் சொல் வருகை அல்லது ஆய்வைக் குறிக்கலாம்; குறிப்பாக, இரக்கத்தையோ தீர்ப்பையோ கொண்டுவரக்கூடிய தெய்வீக வருகையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: தரையோடு தரையாக அழிப்பார்கள்
  rationale: தரையளவுக்கு வீழ்த்தி முற்றிலும் அழிப்பதைக் குறிக்கும் வினையின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: σε
  choice: உன்னை
  rationale: எருசலேம் ஒரு நபராக உருவகப்படுத்தப்பட்டு நேரடியாக அழைக்கப்படுவதைப் பாதுகாக்கிறது; ‘உன் நகரத்தை’ என்று விளக்கிச் சேர்க்கவில்லை.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: உனக்குள் இருக்கும் உன் பிள்ளைகள்
  rationale: நகருக்குள் வாழும் மக்களைக் குறித்தாலும், ‘குடிமக்கள்’ என்று மாற்றாமல் தாய்-நகர் உருவகத்தையும் τέκνα என்பதன் ‘பிள்ளைகள்’ பொருளையும் பாதுகாக்கிறது.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: உனக்குள் ஒரு கல்லின்மேல் மற்றொரு கல்லைக்கூட விட்டுவைக்க மாட்டார்கள்
  rationale: முழுமையான அழிவைக் குறிக்கும் சொற்றொடரைத் தமிழில் இயல்பாகவும், ἐν σοί என்பதை வெளிப்படையாகவும் தருகிறது.
- source_word: ἀνθ’ ὧν
  choice: ஏனெனில்
  rationale: இங்கு வரவிருக்கும் அழிவுக்கான காரணத்தை அறிமுகப்படுத்தும் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: ἔγνως
  choice: உணர்ந்துகொள்ளவில்லை
  rationale: வெறுமனே அறியாமல் இருந்ததைவிட, நிகழ்ந்துகொண்டிருந்த முக்கியமான செயலை அடையாளம் கண்டு புரிந்துகொள்ளத் தவறிய நுண்ணிய பொருளைத் தருகிறது.
- source_word: καιρὸν
  choice: காலத்தை
  rationale: ஒரு குறிப்பிடத்தக்க அல்லது தீர்மானகரமான நேரத்தைக் குறிக்கும் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῆς ἐπισκοπῆς σου
  choice: உன்னைச் சந்தித்த காலத்தை
  rationale: ἐπισκοπή என்பதிலுள்ள ‘சந்திப்பு/வருகை’ நுண்ணிய பொருளைத் தருகிறது; சந்தித்தவர் யார் என்பதையும் அந்தச் சந்திப்பு இரக்கத்திற்கா தீர்ப்பிற்கா என்பதையும் மூலவசனத்தைவிட வெளிப்படையாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: தீர்ப்பின் சூழலில் ἐπισκοπή என்பதன் பொருள்
  choice: ‘உன்னைச் சந்தித்த காலம்’ என்று மொழிபெயர்த்து, தெய்வீகச் சந்திப்பின் நுண்ணிய பொருளை மறைமுகமாக வைத்தல்
  alternative: ‘உன்னை ஆய்வுசெய்த காலம்’ அல்லது ‘கடவுள் உன்னைச் சந்தித்த காலம்’
  rationale: இந்தச் சொல் இரக்கத்தையோ தீர்ப்பையோ கொண்டுவரக்கூடிய தெய்வீகச் சந்திப்பு அல்லது ஆய்வைக் குறிக்கலாம். ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்க்காமலும், ‘ஆய்வு’ என்ற ஒரே பொருளுக்குள் சுருக்காமலும் மூலத்தின் இறையியல் அழுத்தத்தையும் பொருள் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எருசலேமை ஒரு நபராகவும் தாயாகவும் உருவகப்படுத்தும் இரண்டாம் நபர் ஒருமைச் சொற்கள் தொடர்ந்து பாதுகாக்கப்பட்டுள்ளன.
