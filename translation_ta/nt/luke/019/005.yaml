id: LUK.19.5
reference: Luke 19:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: ta
  text: இயேசு அந்த இடத்திற்கு வந்தபோது, மேலே பார்த்து அவனிடம், “சகேயுவே, சீக்கிரம் கீழே இறங்கி வா; ஏனெனில் இன்று நான் உன் வீட்டில் தங்க வேண்டும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேண்டும்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், இயேசுவின் பணி அல்லது இறைநோக்குடன் தொடர்புடைய அவசியத்தையும் உணர்த்தக்கூடும்.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ὡς
  choice: வந்தபோது
  rationale: கதை நிகழ்வுகளின் காலத் தொடரை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ τὸν τόπον
  choice: அந்த இடத்திற்கு
  rationale: சகேயு இருந்த குறிப்பிட்ட இடத்தைச் சுட்டும் கிரேக்க இடவியல் தொடரை இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἀναβλέψας
  choice: மேலே பார்த்து
  rationale: மரத்தில் இருந்த சகேயுவை நோக்கி இயேசு பார்வையை மேலே உயர்த்தியதைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: εἶπεν πρὸς αὐτόν
  choice: அவனிடம் … என்றார்
  rationale: தமிழின் இயல்பான நேரடிக் கூற்று அமைப்பைப் பயன்படுத்துகிறது.
- source_word: Ζακχαῖε
  choice: சகேயுவே
  rationale: பெயரைத் தமிழில் வழக்கமான முறையில் ஒலிபெயர்த்து, அழைப்புவேற்றுமையைப் பாதுகாக்கிறது.
- source_word: σπεύσας κατάβηθι
  choice: சீக்கிரம் கீழே இறங்கி வா
  rationale: பங்கேற்புவினை மற்றும் கட்டளை இணைந்து தரும் அவசரத்தை இயல்பான தமிழ்க் கட்டளையாக வெளிப்படுத்துகிறது.
- source_word: σήμερον γὰρ
  choice: ஏனெனில் இன்று
  rationale: γάρ தரும் காரணத் தொடர்பையும் σήμερον தரும் கால வலியுறுத்தலையும் காக்கிறது.
- source_word: ἐν τῷ οἴκῳ σου
  choice: உன் வீட்டில்
  rationale: சகேயுவின் குடியிருப்பில் இயேசு தங்குவதைக் குறிக்கும் சூழலுக்கு நேரான, இயல்பான தமிழ்.
- source_word: δεῖ με μεῖναι
  choice: நான் … தங்க வேண்டும்
  rationale: தங்குதல் குறித்த வலுவான அவசியத்தை வெளிப்படுத்துகிறது; அந்த அவசியத்தின் காரணத்தை மொழிபெயர்ப்பிலேயே மிகையாக விளக்கவில்லை.
theological_decisions:
- issue: லூக்காவின் கதைநடையில் δεῖ என்பதன் வலிமை
  choice: நான் … தங்க வேண்டும்
  alternative: நான் … தங்குவது அவசியம்
  rationale: δεῖ இயேசுவின் பணி அல்லது இறைநோக்குடன் தொடர்புடைய அவசியத்தை உணர்த்தக்கூடும். முதன்மை உரை அந்த அவசியத்தைப் பாதுகாக்கிறது; ஆனால் அதை வெளிப்படையாக ‘தேவனுடைய கட்டளை’ என்று தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கு மரியாதைப் பன்மை வினைமுற்றும், சகேயுவை நோக்கிய நேரடி ஒருமைக் கட்டளையும் இயல்பாகப் பேணப்பட்டுள்ளன.
