  source_fidelity: மூல கிரேக்கத்தின் காலத் தொடர் (ὡς), இடச் சுட்டு, மேல்நோக்கிப் பார்த்த செயல், சகேயுவுக்கான அழைப்பு, அவசரக் கட்டளை, γάρ-இன் காரணத் தொடர்பு, ‘இன்று,’ வீட்டில் தங்குதல், மற்றும் δεῖ-இன் வலுவான அவசியம் ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘நான் உன் வீட்டில் தங்க வேண்டும்’ என்பது δεῖ με μεῖναι என்பதற்கு இயல்பானதும் போதுமான வலிமையுடையதுமான மொழிபெயர்ப்பு.
  naturalness: உரை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமான கதைநடையிலும் உள்ளது. இயேசுவுக்கான மரியாதை ஒருமை/பன்மை நடை (‘என்றார்’) மற்றும் சகேயுவை நோக்கிய இயல்பான ஒருமைக் கட்டளை (‘இறங்கி வா’) சரியாக அமைந்துள்ளன.
  terminology: ‘சகேயுவே,’ ‘வீட்டில்,’ ‘தங்க வேண்டும்’ ஆகியவை நிலையான, புரியத்தக்க சொல் தேர்வுகள். ‘வேண்டும்’ குறித்த அடிக்குறிப்பு δεῖ தரும் பணி/இறைநோக்குச் சார்ந்த அவசியத்தைச் சுட்டுகிறது; ஆனால் மூலவசனம் வெளிப்படையாகச் சொல்லாத விளக்கத்தை உரையில் திணிக்கவில்லை.
