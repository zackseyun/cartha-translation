  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: ta
  text: மற்றொருவன் வந்து, ‘ஆண்டவரே, இதோ உம்முடைய மினா; இதை நான் ஒரு துணியில்[a] வைத்து ஒதுக்கி வைத்திருந்தேன்’ என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கைக்குட்டையில்.” கிரேக்கச் சொல் முகத்துணி அல்லது கைக்குட்டியாகப் பயன்படுத்தப்படும் ஒரு துணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: வேறொருவனும்
  rationale: முன்பு வந்த பணியாளர்களுக்கு மாறாக அடுத்த பணியாளனைக் குறிக்கிறது; ‘வேறொருவனும்’ என்பது அந்த வேறுபாட்டையும் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἦλθεν λέγων
  choice: வந்து … என்றான்
  rationale: கிரேக்கப் பங்கேற்பு வினை அமைப்பை இயல்பான நவீனத் தமிழில் உரையாடலை அறிமுகப்படுத்தும் அமைப்பாகத் தருகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் ‘ஆண்டவர்/எஜமான்’ பொருள் அகலத்தை ஓரளவு தக்கவைத்து, நேரடி அழைப்பாக மரியாதையுடன் ஒலிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, கையில் உள்ள பொருளைச் சுட்டிக்காட்டும் கிரேக்கச் சொல்லின் இரு செயல்களையும் சுருக்கமாகத் தருகிறது.
- source_word: ἡ μνᾶ σου
  choice: உம்முடைய மினா
  rationale: மினா என்ற பண்டைய நாணய/எடை அலகைத் தவறான நவீன மதிப்பாக மாற்றாமல் ஒலிபெயர்த்துத் தருகிறது.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: இதை நான் … வைத்து ஒதுக்கி வைத்திருந்தேன்
  rationale: εἶχον மற்றும் ἀποκειμένην இணைந்து காட்டும் தொடர்ந்த சேமிப்பு நிலையைக் ‘வைத்திருந்தேன்’ என்ற வடிவம் காக்கிறது.
- source_word: ἐν σουδαρίῳ
  choice: ஒரு துணியில்[a]
  rationale: σουδάριον முகம் அல்லது வியர்வையைத் துடைக்கப் பயன்படுத்தப்பட்ட துணியைக் குறிக்கலாம்; ‘துணி’ மிகையான நவீனத் துல்லியத்தைத் தவிர்க்கிறது, குறிப்பான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உவமையின் நேரடி அழைப்பில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: சூழலில் அது உவமையின் எஜமானைக் குறித்தாலும், ‘ஆண்டவரே’ என்பது மூலச்சொல்லின் மரியாதைமிக்க ‘lord’ பொருளையும் உவமையின் சாத்தியமான விரிந்த ஒலிப்பையும் காக்கிறது; அதேவேளை இதை நேரடியான கிறிஸ்துவியல் அறிக்கையாக வற்புறுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. உரையாடலில் ‘உம்முடைய’ பயன்படுத்தப்பட்டு கண்ணியமான அழைப்பு காக்கப்பட்டுள்ளது; பண்டைய நாணய அலகான ‘மினா’ ஒலிபெயர்க்கப்பட்டுள்ளது.
