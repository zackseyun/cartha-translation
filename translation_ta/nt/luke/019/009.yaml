source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: ta
  text: இயேசு அவனிடம், “இன்று இந்த வீட்டுக்கு[a] மீட்பு வந்திருக்கிறது; ஏனெனில் அவனும் ஆபிரகாமின் மகன்தான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வீட்டாருக்கு.” கிரேக்கச் சொல் வீட்டைக் குறிக்கலாம்; அந்த வீட்டைச் சேர்ந்த குடும்பத்தாரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் ... என்றார்
  rationale: δέ ஒரு மென்மையான தொடரிணைப்பு என்பதால் தமிழில் தனியாக மொழிபெயர்க்காமல் இயல்பான கதை ஓட்டத்தில் விடப்பட்டுள்ளது. πρὸς αὐτόν என்பதிலுள்ள சுட்டுப்பெயர் ‘அவனிடம்’ என்று நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: Σήμερον
  choice: இன்று
  rationale: வாக்கியத்தின் முன்பகுதியில் உள்ள கால அழுத்தத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: σωτηρία
  choice: மீட்பு
  rationale: லூக்காவில் இச்சொல் வெறும் ஆபத்திலிருந்து விடுவிப்பதைவிட விரிவான இறையியல் பொருளைக் கொண்டுள்ளது; ‘மீட்பு’ அந்தப் பொருளை பொதுவாகப் புரியும் தமிழில் சுமக்கிறது.
- source_word: τῷ οἴκῳ τούτῳ
  choice: இந்த வீட்டுக்கு
  rationale: οἶκος என்பதன் நேரடி இடப்பொருளைத் தக்கவைக்கிறது; அது வீட்டாரையும் குறிக்கக்கூடிய சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐγένετο
  choice: வந்திருக்கிறது
  rationale: γίνομαι என்பதன் நிகழ்தல் அல்லது வந்தடைதல் கருத்தை, σωτηρία உடன் வரும் இச்சூழலில் இயல்பான தமிழ் வழக்கில் வெளிப்படுத்துகிறது.
- source_word: καθότι
  choice: ஏனெனில்
  rationale: இயேசுவின் அறிவிப்புக்கான காரணத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: καὶ αὐτὸς
  choice: இவனும் ... தான்
  rationale: சக்கேயுவும் ஆபிரகாமின் மகன் என்ற உள்ளடக்கும் வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: υἱὸς Ἀβραάμ
  choice: ஆபிரகாமின் மகன்
  rationale: ஆண்பால் ஒருமையையும் உடன்படிக்கை அல்லது அடையாளம் சார்ந்த சொல்லாட்சியின் வலிமையையும் தக்கவைக்கிறது; ‘வழித்தோன்றல்’ என்று விளக்கி அதன் பொருள் எல்லையைச் சுருக்கவில்லை.
theological_decisions:
- issue: ‘ஆபிரகாமின் மகன்’ என்பதன் பொருள்
  choice: இனவழி, உடன்படிக்கை அடையாளம், விசுவாசக் குடும்பத்தைச் சார்ந்த நிலை ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூல உருவகம் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: ‘ஆபிரகாமின் வழித்தோன்றல்’ அல்லது ‘ஆபிரகாமின் விசுவாசக் குடும்பத்தைச் சேர்ந்தவன்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் இவற்றில் ஒரு பொருளை மட்டும் கட்டாயப்படுத்தவில்லை. மூலச் சொல்லாட்சியைப் பாதுகாப்பது உண்மையான இறையியல் பதற்றத்தையும் உடனடிச் சூழல் தரும் விளக்க வாய்ப்பையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளையில் கண்ணியமான நடை. மேற்கோள் உரையில் இயல்பான பேச்சுத் தொனி காக்கப்பட்டு, இறையியல் நிறை கொண்ட சொற்கள் எளிமைப்படுத்தப்படாமல் வைக்கப்பட்டுள்ளன.
