id: LUK.19.7
reference: Luke 19:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: ta
  text: அனைவரும் இதைக் கண்டபோது, “இவர் ஒரு பாவியான மனிதனிடம் தங்குவதற்காக[a] உள்ளே சென்றார்” என்று குறைகூறத் தொடங்கினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்குவதற்காக” என்பதை “விருந்தினராகத் தங்குவதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: καταλῦσαι என்பதன் விருந்தினராகத் தங்குதல் என்ற பொருளை வெளிப்படுத்தும் சொல் மாற்று.
lexical_decisions:
- source_word: ἰδόντες πάντες
  choice: அனைவரும் இதைப் பார்த்தபோது
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கான காலச் சூழலைக் காட்டுவதால், இயல்பான தமிழில் காலவாக்கியமாக மொழிபெயர்க்கப்பட்டது. ‘இதை’ என்பது இயேசு சக்கேயுவுடன் செல்வதைச் சூழலிலிருந்து குறிக்கிறது.
- source_word: διεγόγγυζον
  choice: முணுமுணுக்கத் தொடங்கினார்கள்
  rationale: நீடித்த அல்லது தொடக்கநிலையிலுள்ள செயலைக் காட்டும் imperfect வடிவத்தையும், அதிருப்தியோடு குறைகூறும் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: அவர்கள் முணுமுணுத்ததன் உள்ளடக்கத்தை இயல்பான தமிழ் நேர்கூற்றாக அறிமுகப்படுத்துகிறது.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: பாவியான ஒரு மனிதனோடு
  rationale: παρά + dative இங்கு ஒருவருடன் தங்குவதைக் குறிக்கிறது. பெயரடையான ἁμαρτωλῷ மற்றும் ஆண்பாலைக் குறிப்பாகக் கொண்ட ἀνδρί ஆகிய இரண்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: εἰσῆλθεν
  choice: இவர் உள்ளே போயிருக்கிறார்
  rationale: கூட்டத்தார் இயேசுவைப் பற்றிப் பேசும் குற்றச்சாட்டின் உடனடி தொடர்பைத் தமிழின் நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது; மரியாதையைக் காக்க ‘இவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: καταλῦσαι
  choice: தங்குவதற்காக
  rationale: ஒருவருடைய வீட்டில் விருந்தினராகத் தங்குதல் என்ற சூழல்சார் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; இரவு முழுவதும் தங்கினார் என்று தேவையின்றி வரையறுக்கவில்லை.
theological_decisions:
- issue: சக்கேயுவைப் பற்றிய கூட்டத்தாரின் வருணனை
  choice: பாவியான ஒரு மனிதன்
  alternative: பாவி
  rationale: மூலத்தில் பெயரடை + ஆண்பால் பெயர்ச்சொல் இருப்பதால் இரு கூறுகளும் பாதுகாக்கப்படுகின்றன. இது கூட்டத்தாரின் இழிவான மதிப்பீட்டைத் தருகிறது; அதற்கு மேலான இறையியல் முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கூட்டத்தாரின் அதிருப்தி ‘முணுமுணுக்க’ என்பதால் வெளிப்படுகிறது. அடிக்குறிப்புக் குறி தொடர்புடைய καταλῦσαι சொல்லின் மொழிபெயர்ப்புக்குப் பிந்தைய வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
