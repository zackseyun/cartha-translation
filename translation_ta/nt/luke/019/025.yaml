id: LUK.19.25
reference: Luke 19:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: ta
  text: அவர்கள் அவரிடம், “ஆண்டவரே[a], அவனிடம் பத்து மினாக்கள்[b] இருக்கின்றன—” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஐயா” அல்லது “எஜமானே.”
    reason: lexical_alternative
  - marker: b
    text: மினா என்பது பண்டைய காலப் பண அலகு; அது ஏறத்தாழ நூறு நாள் கூலிக்குச் சமமானது.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: கிரேக்கத்தின் எளிய இணைப்புச் சொல் இங்கு தமிழ் உரைநடையில் தனியாக மொழிபெயர்க்கப்படாமல் இயல்பான வாக்கியத் தொடரில் வெளிப்படுகிறது; ‘அப்போது’ அல்லது ‘ஆனால்’ எனக் கால அல்லது எதிர்மறை நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: εἶπαν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: இறந்தகாலக் கதைநடையை இயல்பான தமிழில் தருகிறது; αὐτῷ என்பது உவமையிலுள்ள ஆண் அதிகாரியைக் குறிக்கும் மறைமுகப் பொருள்.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் அழைப்புவேற்றுமையையும் அதிகாரம் நிறைந்த மரியாதை அழைப்பையும் காக்கிறது. உவமையின் சூழலில் ‘ஐயா’ அல்லது ‘எஜமானே’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔχει
  choice: அவனிடம் … இருக்கின்றன
  rationale: உடைமையைக் குறிக்கும் நிகழ்கால வினையை இயல்பான தமிழில் தருகிறது; ‘ஏற்கெனவே’ போன்ற கிரேக்கத்தில் இல்லாத வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: δέκα μνᾶς
  choice: பத்து மினாக்கள்
  rationale: எண்ணை நேரடியாகத் தருவதோடு, பண்டைய நாணய அலகை நவீன பணமதிப்பாக மாற்றாமல் ஒலிபெயர்த்து வரலாற்றுச் சூழலைக் காக்கிறது.
theological_decisions:
- issue: உவமையின் நேரடி அழைப்பில் κύριος என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா; எஜமானே
  rationale: ‘ஆண்டவரே’ என்பது மூலச்சொல்லின் அதிகார நுணுக்கத்தையும் கதைநடை எதிரொலியையும் காக்கிறது. இருப்பினும் இது உவமையிலுள்ள அதிகாரிக்குச் செலுத்தப்படும் மரியாதை அழைப்பாகவும் இருக்கலாம்; ஆகவே இதை வெளிப்படையான கிறிஸ்துவியல் அறிக்கையாகத் தீர்மானிக்காமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. இறுதியிலுள்ள நீண்ட கோடு, பேச்சு தொடர்வதற்குள் இடைமறிக்கப்பட்ட உணர்வை அல்லது மூல உரையின் முடிவுறாத எதிர்ப்பைக் காக்கிறது.
