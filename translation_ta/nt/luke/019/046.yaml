revisions:
- from: 'அவர்களிடம் அவர் கூறியது: “எழுதப்பட்டிருக்கிறது: ‘என் வீடு ஜெபத்தின் வீடாக இருக்கும்.’ ஆனால் நீங்களோ அதைத் திருடர்களின் குகையாக்கிவிட்டீர்கள்.”[a][b]'
  to: 'அவர்களிடம் அவர் கூறினார்: “எழுதப்பட்டிருக்கிறது: ‘என் வீடு[a] ஜெபத்தின் வீடாக இருக்கும்.’ ஆனால் நீங்களோ அதை கொள்ளையர்களின் குகையாக்கிவிட்டீர்கள்.[b]”'
  rationale: The revision corrects the Tamil direct-speech introduction, uses a more source-faithful equivalent for λῃστῶν, and relocates footnote anchors to the words they explain. It retains the literal and theologically significant ‘என் வீடு,’ the future statement in the quotation, and the emphatic contrast ‘ஆனால் நீங்களோ.’
