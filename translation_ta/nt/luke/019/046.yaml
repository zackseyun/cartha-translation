review_pass:
  verdict: revise
  source_fidelity: The draft preserves the scriptural formula, the ‘my house’ wording, the adversative emphasis of ὑμεῖς δέ, and the completed-result force of ἐποιήσατε. However, λῃστῶν is better rendered ‘கொள்ளையர்கள்’ than ‘திருடர்கள்,’ since it denotes robbers/bandits rather than ordinary thieves. ‘குகை’ adequately preserves σπήλαιον and its Jeremiah allusion.
  naturalness: ‘அவர்களிடம் அவர் கூறியது’ is an unnatural nominal construction before direct speech. A finite verb, ‘அவர்களிடம் அவர் கூறினார்,’ is idiomatic modern standard Tamil. ‘ஜெபத்தின் வீடாக’ is clear, dignified, and natural in a biblical quotation.
  terminology: Retain ‘என் வீடு’ rather than interpreting it as ‘ஆலயம்,’ as this reflects οἶκος and preserves the Isaiah echo. Use ‘கொள்ளையர்களின் குகை’ for the established prophetic image without imposing a political sense on λῃσταί.
  issues:
  - severity: medium
    issue: The opening wording is syntactically unnatural in Tamil.
    rationale: ‘அவர்களிடம் அவர் கூறியது:’ means approximately ‘what he said to them,’ but it does not naturally introduce direct speech here. The Greek participle may be rendered idiomatically by a finite past verb in Tamil.
  - severity: medium
    issue: ‘திருடர்கள்’ understates λῃστῶν.
    rationale: λῃσταί refers to robbers, brigands, or bandits; ‘கொள்ளையர்கள்’ more accurately conveys the term while retaining the Jeremiah 7:11 allusion.
  - severity: low
    issue: Footnote markers are placed only at the end of the whole verse.
    rationale: Anchoring [a] after ‘என் வீடு’ and [b] after ‘குகை’ makes each note’s referent unambiguous.
