id: LUK.19.46
reference: Luke 19:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: ta
  text: 'அவர்களிடம் அவர் கூறினார்: “எழுதப்பட்டிருக்கிறது: ‘என் வீடு[a] ஜெபத்தின் வீடாக இருக்கும்.’ ஆனால் நீங்களோ அதை கொள்ளையர்களின் குகையாக்கிவிட்டீர்கள்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் வீடு” என்பது ஆலயத்தைக் குறிக்கிறது; இந்தச் சொற்றொடர் ஏசாயா 56:7-ஐ எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கொள்ளையர்களின் குகை” என்பது எரேமியா 7:11-ஐ எதிரொலிக்கிறது. “கொள்ளையர்கள்” என்பதை “வழிப்பறிக்காரர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: அவர்களிடம் அவர் கூறியது
  rationale: முந்தைய நிகழ்வுடன் இணையும் நிகழ்கால வினையெச்சத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேதவாக்கை அதிகாரப்பூர்வமாக அறிமுகப்படுத்தும் நிறைநிலைச் செயலற்ற வடிவத்தைப் பாதுகாக்கிறது.
- source_word: Καὶ ἔσται
  choice: இருக்கும்
  rationale: மேற்கோளின் எதிர்காலக் கூற்றைப் பாதுகாக்கிறது; தொடக்க καί தமிழில் இயல்பற்றதாக இருப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: ὁ οἶκός μου
  choice: என் வீடு
  rationale: ஆலயத்தைக் குறித்தாலும், ஏசாயா 56:7-இன் சொற்றொடரையும் οἶκος என்பதன் நேரடிப் பொருளையும் பாதுகாக்கிறது.
- source_word: οἶκος προσευχῆς
  choice: ஜெபத்தின் வீடு
  rationale: வேதாகம மேற்கோளின் அடையாளமிக்க மரபுத்தொடரை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ὑμεῖς δὲ
  choice: ஆனால் நீங்களோ
  rationale: எதிர்மறை மாறுபாட்டையும் வலியுறுத்தப்பட்ட ‘நீங்கள்’ என்பதையும் வெளிப்படுத்துகிறது.
- source_word: ἐποιήσατε
  choice: ஆக்கிவிட்டீர்கள்
  rationale: அவர்கள் செய்த செயலால் ஏற்பட்டுள்ள தற்போதைய விளைவை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: σπήλαιον
  choice: குகை
  rationale: எரேமியா 7:11-ஐ எதிரொலிக்கும் உருவகத்தைப் பாதுகாக்கிறது; கொள்ளையர்கள் ஒளியும் இருப்பிடத்தைக் குறிக்கிறது.
- source_word: λῃστῶν
  choice: திருடர்களின்
  rationale: கொள்ளையர்கள் அல்லது வழிப்பறிக்காரர்கள் என்றும் பொருள்படக்கூடிய சொல்லை மிகையாகக் குறிப்பாக்காமல் பொதுவாக வழங்குகிறது.
theological_decisions:
- issue: ஆலய மேற்கோளில் ‘வீடு’ அல்லது ‘ஆலயம்’
  choice: என் வீடு ... ஜெபத்தின் வீடு
  alternative: என் ஆலயம் ... ஜெபத்தின் வீடு
  rationale: கிரேக்கத்தில் οἶκος என்பதே உள்ளது. ‘வீடு’ என்பது ஏசாயா 56:7 உடனான தொடர்பையும் தேவனுடைய இல்லம் என்ற இறையியல் வலிமையையும் பாதுகாக்கிறது.
- issue: λῃστῶν என்பதன் வரம்பு
  choice: திருடர்கள்
  alternative: கொள்ளையர்கள் / வழிப்பறிக்காரர்கள்
  rationale: இந்தச் சொல் திருடர்கள், கொள்ளையர்கள், ஆயுதக் கள்வர்கள் எனப் பரந்த பொருள் கொள்ளலாம்; அரசியல் கலகக்காரர்கள் என்ற குறிப்பிட்ட விளக்கத்தை உரைக்குள் திணிக்காமல் பொதுவான பொருள் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை. வேதமேற்கோளின் உயர்ந்த தொனியும் ‘வீடு’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
