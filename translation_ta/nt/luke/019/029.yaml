  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: ta
  text: அப்போது, அவர் பெத்பகே, பெத்தானியா ஆகிய இடங்களுக்கு அருகில், ஒலிவ மலை எனப்படும் மலையை நோக்கி வந்தபோது,[a] சீடர்களில் இருவரை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “ஒலிவங்கள் என்று அழைக்கப்படும் மலை.”
    reason: மூல கிரேக்கத்தில் மலையின் பெயர் வழக்கமான முழு வடிவில் அல்லாமல் சுருக்கமாக உள்ளது.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: அப்போது
  rationale: லூக்கா பயன்படுத்தும் இந்தக் கதைத் தொடர்ச்சி சூத்திரத்தை, தமிழில் இயல்பான கதை இணைப்பாகக் கொடுக்கிறது. ‘அப்போது நிகழ்ந்தது என்னவென்றால்’ என்பது மூல வடிவத்தை வெளிப்படையாகக் காட்டினாலும், இச்சூழலில் செயற்கையாக ஒலிக்கும்.
- source_word: ὡς
  choice: வந்தபோது
  rationale: இங்கு ὡς காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; அணுகிவரும் செயல் நடைபெறும் வேளையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: பெத்பகே, பெத்தானியா ஆகிய ஊர்களை நெருங்கி
  rationale: ἐγγίζω என்பது ஓர் இடத்திற்கு அருகில் வருவதைக் குறிக்கிறது. இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டு, இரண்டும் குடியிருப்புகள் என்பதை வாசகர் எளிதில் புரிந்துகொள்ள ‘ஊர்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πρὸς τὸ ὄρος
  choice: மலையை நோக்கி
  rationale: πρός இங்கு திசையை அல்லது அந்த இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது; ‘மலையை நோக்கி’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: ஒலிவ மலை என்று அழைக்கப்படும்
  rationale: கிரேக்கத்தில் ‘ஒலிவங்களின்’ என்ற சுருக்கமான பெயரமைப்பு உள்ளது. தமிழில் அறியப்பட்டதும் இயல்பானதுமான ‘ஒலிவ மலை’ பிரதான உரையில் பயன்படுத்தப்பட்டு, மூலத்தின் சுருக்கமான வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: எளிய இறந்தகாலக் கதைச் செயலை இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: δύο τῶν μαθητῶν
  choice: சீடர்களில் இருவரை
  rationale: ‘சீடர்களில் இரண்டு பேர்’ என்ற பகுதியுறவை நேரடியாகத் தெரிவிக்கிறது. சூழலில் அவர்கள் இயேசுவின் சீடர்கள் என்பது தெளிவாக இருந்தாலும், கிரேக்கத்தில் இல்லாத ‘தமது’ அல்லது ‘அவருடைய’ என்பது சேர்க்கப்படவில்லை.
