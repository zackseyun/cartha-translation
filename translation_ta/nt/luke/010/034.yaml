  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. சமாரியரைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் இல்லாத விலங்கினத்தைச் சேர்க்காமல் பொதுவான சொல்லே வைக்கப்பட்டுள்ளது.
