  source_fidelity: வரைவில் கருத்து முழுமையாக உள்ளது. ஆனால் κτῆνος என்பது சுமை சுமக்கும் விலங்கு மட்டுமல்ல; சவாரிக்குப் பயன்படும் விலங்கையும் குறிக்கலாம். ஆகவே முதன்மை உரையில் ‘சுமை விலங்கு’ என்பது தேவையற்ற குறுக்கமாகிறது. πανδοχεῖον-க்கு ‘சத்திரம்’ பொருளில் சரியானதாயினும், நவீனத் தரத் தமிழில் ‘விடுதி’ அதிக இயல்பானது.
  naturalness: ‘காயங்களில் ... ஊற்றி, அவற்றுக்குக் கட்டுப்போட்டார்’ புரிந்துகொள்ளத்தக்கது; இருப்பினும் காயங்களைக் கட்டி, அவற்றின்மேல் எண்ணெயையும் திராட்சரசத்தையும் ஊற்றினார் என்ற அமைப்பு நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘கவனித்துக்கொண்டார்’ என்பதையும் இடைவெளியுடன் எழுதுவது வாசிப்பிற்கு ஏற்றது.
