source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: ta
  text: அவனருகில் சென்று, அவனுடைய காயங்களைக் கட்டி, அவற்றின்மேல் எண்ணெயையும் திராட்சரசத்தையும் ஊற்றினார். பின்பு அவனைத் தமது சொந்த விலங்கின்மேல்[a] ஏற்றி, ஒரு விடுதிக்குக் கொண்டுபோய் அவனைக் கவனித்துக் கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் கிரேக்கச் சொல், சுமை சுமக்கவோ சவாரிக்காகவோ பயன்படுத்தப்படும் ஒரு விலங்கைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: அவனருகே சென்று
  rationale: காயமடைந்தவனை நோக்கிச் சென்று அருகில் வந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατέδησεν τὰ τραύματα αὐτοῦ
  choice: அவனுடைய காயங்களில் ... ஊற்றி, அவற்றுக்குக் கட்டுப்போட்டார்
  rationale: καταδέω என்பது காயங்களைக் கட்டுவதைக் குறிக்கிறது; ‘கட்டுப்போட்டார்’ என்பது நவீன தமிழில் தெளிவான மருத்துவச் செயல்பாட்டுச் சொல். கிரேக்க வாக்கியத்தில் ἐπιχέων உடனிகழும் முறையைக் குறிப்பதால், தமிழின் இயல்புக்காக ஊற்றுதல் முதலில் அமைக்கப்பட்டுள்ளது.
- source_word: ἐπιχέων ἔλαιον καὶ οἶνον
  choice: எண்ணெயையும் திராட்சரசத்தையும் ஊற்றி
  rationale: ἐπιχέων என்பதன் நேரடியான செயலை ‘ஊற்றி’ எனவும், ἔλαιον என்பதை தேவையின்றி ‘ஒலிவ எண்ணெய்’ என்று விரிவாக்காமல் ‘எண்ணெய்’ எனவும் மொழிபெயர்க்கிறது.
- source_word: ἐπιβιβάσας ... ἐπὶ τὸ ἴδιον κτῆνος
  choice: தமது சொந்தச் சுமை விலங்கின்மேல் ஏற்றி
  rationale: ἴδιον தரும் தனிப்பட்ட உடைமை வலியுறுத்தலை ‘சொந்த’ காக்கிறது. κτῆνος என்பது சவாரி அல்லது சுமை தாங்கப் பயன்படும் விலங்கு; குறிப்பிட்ட இனத்தை ஊகிக்காமல் ‘சுமை விலங்கு’ எனத் தரப்பட்டுள்ளது.
- source_word: πανδοχεῖον
  choice: சத்திரம்
  rationale: பயணிகள் தங்கும் விடுதியைக் குறிக்கும் சொல்லுக்கு தமிழில் அறியப்பட்ட, சூழலுக்கேற்ற சொல்.
- source_word: ἐπεμελήθη αὐτοῦ
  choice: அவனைக் கவனித்துக்கொண்டார்
  rationale: தனிப்பட்ட அக்கறையுடன் பராமரித்த செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
