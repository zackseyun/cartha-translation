source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: ta
  text: மறுநாள், அவர் இரண்டு தினாரி நாணயங்களை[a] எடுத்து விடுதிக்காரரிடம் கொடுத்து, ‘இவரைக் கவனித்துக்கொள்ளுங்கள். மேலும் நீங்கள் செலவிடும் எந்தத் தொகையையும், நான் திரும்பி வரும்போது உங்களுக்குத் திருப்பிக் கொடுப்பேன்’ என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தினாரி என்பது பொதுவாக ஒரு தொழிலாளியின் ஒரு நாள் கூலிக்குச் சுமார் சமமான ரோம வெள்ளி நாணயம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: மறுநாள்
  rationale: அடுத்த நாளைக் குறிக்கும் கிரேக்க காலச் சொற்றொடரை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: ἐκβαλών
  choice: எடுத்து
  rationale: தன்னிடமிருந்த பணத்தை வெளியே எடுத்து வழங்கிய செயலைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது; சொல்லின் அடிப்படைப் பொருளை இயந்திரத்தனமாக மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: δύο δηνάρια
  choice: இரண்டு தினாரி நாணயங்களை
  rationale: வரலாற்று நாணயத்தின் பெயரைப் பாதுகாக்கிறது; ‘நாணயங்கள்’ என்பது சாதாரண வாசகருக்கு அதன் தன்மையை உடனே தெளிவாக்குகிறது. அதன் தோராயமான மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: πανδοχεῖ
  choice: விடுதிக்காரரிடம்
  rationale: தங்கும் விடுதியை நடத்துபவரையே குறிக்கிறது; கட்டிடத்தைக் குறிக்கவில்லை.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: இவரைக் கவனித்துக்கொள்ளுங்கள்
  rationale: அக்கறையுடன் பராமரிக்குமாறு கூறும் கட்டளையை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: இதற்கு மேல் நீங்கள் எவ்வளவு செலவு செய்தாலும்
  rationale: ஏற்கெனவே கொடுக்கப்பட்ட தொகைக்கு மேலாக ஏற்படும், முன்கூட்டியே நிர்ணயிக்கப்படாத எந்தச் செலவையும் உள்ளடக்கும் கிரேக்க அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: நான் திரும்பி வரும்போது
  rationale: கிரேக்க காலவியல் வினையெச்சக் கட்டமைப்பை இயல்பான தமிழ்க் காலத் தொடராக வழங்குகிறது.
- source_word: ἀποδώσω σοι
  choice: அதை உங்களுக்குத் திருப்பிக் கொடுப்பேன்
  rationale: கூடுதலாகச் செலவிட்ட தொகையை ஈடுசெய்து கொடுப்பதாகிய நிதிசார் பொருளைத் தெளிவாகக் காட்டுகிறது.
