translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. நேரடி உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. வரலாற்று நாணயப் பெயர் தக்கவைக்கப்பட்டு, அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
