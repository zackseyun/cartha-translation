  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: ta
  text: இயேசு பதிலளித்து, “ஒரு மனிதர் எருசலேமிலிருந்து எரிகோவுக்குக் கீழிறங்கிச் சென்றுகொண்டிருந்தார். அவர் கொள்ளையர்களிடம் அகப்பட்டார். அவர்கள் அவருடைய ஆடைகளைக் கழற்றிவிட்டு, அவரை அடித்து, குற்றுயிராக விட்டுச் சென்றார்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: அதற்கு ... என்றார்
  rationale: முந்தைய கேள்விக்குப் பதிலளித்து உரையைத் தொடங்குவதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατέβαινεν
  choice: போய்க்கொண்டிருந்தார்
  rationale: எருசலேமிலிருந்து எரிகோ நோக்கிய பயணத்தை இயல்பாகக் கூறுகிறது; கிரேக்கத்தின் ‘கீழே சென்றார்’ என்பது நிலவியல் சார்ந்ததாக இருந்தாலும் தமிழில் சொற்சொல்லாக அமைந்தால் தேவையற்ற திசைத் தகவலாகத் தோன்றலாம்.
- source_word: λῃσταῖς περιέπεσεν
  choice: கொள்ளையர்களிடம் அகப்பட்டார்
  rationale: திடீரென கொள்ளையர் கையில் சிக்கிய பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκδύσαντες αὐτὸν
  choice: அவருடைய உடைகளையும் பறித்துக்கொண்டு
  rationale: ἐκδύω என்பதன் உடைகளை உரித்தல்/கழற்றுதல் என்ற பொருளை, கொள்ளைச் சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது; καί-யின் கூட்டுச் சாயலை ‘-யும்’ காக்கிறது.
- source_word: πληγὰς ἐπιθέντες
  choice: அவரை அடித்துவிட்டு
  rationale: காயங்களை ஏற்படுத்தும் வகையில் தாக்கினர் என்ற கிரேக்கச் சொல்லாட்சியை பொதுவாசகருக்குத் தெளிவான தமிழில் தருகிறது.
- source_word: ἡμιθανῆ
  choice: குற்றுயிராக
  rationale: ‘பாதி இறந்த நிலையில்’ என்பதைக் குறிக்கும் செறிவான, புரிந்துகொள்ளக்கூடிய தமிழ் சொல்.
