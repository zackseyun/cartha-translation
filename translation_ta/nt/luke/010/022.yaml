source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ta
  text: “எல்லாவற்றையும் என் தந்தை என்னிடம் ஒப்புவித்திருக்கிறார்.[a] மகன் யார் என்பதைத் தந்தையைத் தவிர வேறு யாரும் அறியார். தந்தை யார் என்பதை மகனையும், மகன் யாருக்குத் தந்தையை வெளிப்படுத்த விரும்புகிறாரோ அவரையும் தவிர வேறு யாரும் அறியார்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைத்தையும் என் தந்தை என்னிடம் ஒப்புவித்திருக்கிறார்.”
    reason: πάντα என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: “மகன் யாருக்குத் தந்தையை வெளிப்படுத்தத் தீர்மானிக்கிறாரோ” என்றும் மொழிபெயர்க்கலாம்.
    reason: βούληται என்பதில் விருப்பத்தோடு தீர்மானிக்கும் பொருளும் அடங்கலாம்.
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மை வடிவத்தின் விரிவான, அனைத்தையும் உள்ளடக்கும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: என் தந்தை என்னிடம் ஒப்புவித்திருக்கிறார்
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருளான ‘ஒப்புவித்தல்’ என்பதைக் காக்கிறது; இறந்தகாலச் செயல் தற்போதும் விளைவுடையதாக இருப்பதை ‘ஒப்புவித்திருக்கிறார்’ தெரிவிக்கிறது. ὑπό உடன் வரும் உருபு தந்தையைச் செய்பவராகக் காட்டுகிறது.
- source_word: γινώσκει
  choice: அறியார்
  rationale: ‘முழுமையாக அறியார்’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல், கிரேக்க வினையின் நேரடிப் பொருளைத் தக்கவைக்கிறது.
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: மகன் யார் என்பதை / தந்தை யார் என்பதை
  rationale: ஆள்தன்மை மற்றும் உறவுநிலையை இயல்பான தமிழில் காக்கும் நேரடியான அமைப்பு.
- source_word: εἰ μὴ
  choice: …தவிர வேறு யாரும்
  rationale: விலக்குப் பொருளையும் ‘யாரும் இல்லை’ என்ற வலியுறுத்தலையும் தெளிவான தமிழில் வழங்குகிறது.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: தந்தையை வெளிப்படுத்த மகன் யாரை விரும்புகிறாரோ அவரையும்
  rationale: மகனுடைய விருப்பத்தையும் தீர்மானிக்கும் முகமையையும் காக்கிறது. தமிழில் குழப்பம் தவிர்க்க, வெளிப்படுத்தப்படுபவர் முந்தைய கூற்றிலுள்ள தந்தை என்பதை வெளிப்படையாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: தந்தைக்கும் மகனுக்கும் இடையிலான தனித்துவமான பரஸ்பர அறிவு
  choice: ‘அறியார்’ என்ற எளிய சொல் மற்றும் விலக்குச் syntax மூலம் கூற்றின் முழு வலிமையும் காக்கப்பட்டது.
  alternative: ‘முழுமையாக அறியார்’ அல்லது ‘உண்மையில் அறியார்’ என்று விரிவாக்குதல்.
  rationale: தந்தை–மகன் பரஸ்பர அறிவின் தனித்துவத்தை வசனம் தானே வலுவாகக் கூறுகிறது; γινώσκει-க்கு இல்லாத வினையடைச் செறிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: தந்தையை வெளிப்படுத்துவதில் மகனுடைய சித்தமும் முகமையும்
  choice: βούληται என்பது ‘விரும்புகிறாரோ’ என மொழிபெயர்க்கப்பட்டு, வெளிப்படுத்துபவராக மகனுடைய தீர்மானிக்கும் முகமை தக்கவைக்கப்பட்டது.
  alternative: ‘தேர்ந்தெடுக்கிறாரோ’ அல்லது முகமையைத் தணிக்கும் விளக்கவுரை.
  rationale: கிரேக்கம் மகனுடைய சித்தத்தை நேரடியாக முன்வைக்கிறது. ‘விரும்புகிறார்’ அதன் சித்தப் பொருளைக் காக்கிறது; அதேவேளை குறிப்பிட்ட கோட்பாட்டு அமைப்பை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அறியார்’ போன்ற மரியாதைப் பன்மை வடிவங்கள் தந்தை மற்றும் மகன் இருவருக்கும் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன; ‘தந்தை’, ‘மகன்’ ஆகிய உறவுப் பட்டங்கள் நிலையாக வைக்கப்பட்டுள்ளன.
