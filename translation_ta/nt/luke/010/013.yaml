source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: ta
  text: “கோராசினே, உனக்கு ஐயோ! பெத்சாயிதாவே, உனக்கு ஐயோ! ஏனெனில் உங்களிடையே நிகழ்ந்த வல்லமையான செயல்கள் தீருவிலும் சீதோனிலும் நிகழ்ந்திருந்தால், அவர்கள் வெகு காலத்திற்கு முன்பே துக்கவுடை உடுத்திச் சாம்பலில் உட்கார்ந்து மனந்திரும்பியிருப்பார்கள்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துக்கவுடை” என்பது துக்கத்தையும் மனந்திரும்புதலையும் வெளிப்படுத்த அணிந்த கரடுமுரடான சாக்குத் துணியைக் குறிக்கிறது; கிரேக்கத்தில், “சாக்குத் துணியிலும் சாம்பலிலும் உட்கார்ந்து.”
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: Οὐαί σοι
  choice: உனக்கு ஐயோ
  rationale: தீர்ப்பை அறிவிக்கும் தீர்க்கதரிசனத் தொனியையும் புலம்பலின் வலிமையையும் காக்கிறது; நேரடி அழைப்பில் வரும் ஒருமையையும் வெளிப்படுத்துகிறது.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: கோராசின் / பெத்சாயிதா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் எளிதில் அடையாளம் காணக்கூடிய ஒலிபெயர்ப்புகள்.
- source_word: δυνάμεις
  choice: வல்ல செயல்கள்
  rationale: செயல்களையும் அவற்றில் வெளிப்படும் வல்லமையையும் ஒருங்கே காட்டுகிறது; ‘அற்புதங்கள்’ என்று பொருளைச் சற்றுக் குறுக்காமல் கிரேக்கச் சொல்லின் பரப்பை காக்கிறது.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: நிகழ்ந்திருந்தால் ... நிகழ்ந்த
  rationale: γίνομαι என்பதன் நிகழ்வு சார்ந்த பொருளையும் கிரேக்கத்தில் உள்ள மீளுரைப்பையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: அந்த நகரங்களிலும் அவற்றின் மக்களிடையிலும் செயல்கள் நிகழ்ந்தன என்ற இடச்சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: πάλαι
  choice: வெகு காலத்திற்கு முன்பே
  rationale: கடந்தகால எதிர்நிலை வாக்கியத்தில் உள்ள வலியுறுத்தப்பட்ட காலக் குறிப்பை இயல்பாகத் தருகிறது.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: துக்கவுடை உடுத்திச் சாம்பலில்
  rationale: சாக்குத் துணி அணிவதும் சாம்பலில் அமர்வதும் குறிக்கும் புலம்பல் மற்றும் மனந்திரும்புதல் படிமத்தை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: καθήμενοι
  choice: உட்கார்ந்து
  rationale: துக்கம் மற்றும் மனந்திரும்புதலுடன் தொடர்புடைய தெளிவான உடல் நிலையை நீக்காமல் காக்கிறது.
- source_word: μετενόησαν
  choice: மனந்திரும்பியிருப்பார்கள்
  rationale: லூக்காவில் μετανοέω குறிக்கும் சிந்தனை, மனப்பாங்கு மற்றும் வாழ்வுத் திருப்பத்தைத் தமிழில் நிலைபெற்ற வேதாகமச் சொல்லால் தருகிறது.
theological_decisions:
- issue: இயேசுவின் ஊழியத்தில் δυνάμεις என்பதன் இயல்பு
  choice: வல்ல செயல்கள்
  alternative: அற்புதங்கள் / வல்லமையின் செயல்கள்
  rationale: இச்சொல் அசாதாரணமான தெய்வீக வல்லமையை வெளிப்படுத்தும் செயல்களைக் குறித்தாலும், கிரேக்கத்தில் வல்லமையும் செயலும் இரண்டும் முன்னிலைப்படுகின்றன; ஆகவே பின்னாளைய தொழில்நுட்பச் சொல்லாகக் குறுக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: மனந்திரும்புதலின் வெளிப்புற அடையாளம்
  choice: துக்கவுடை உடுத்திச் சாம்பலில் உட்கார்ந்து மனந்திரும்பியிருப்பார்கள்
  alternative: துக்கவுடையிலும் சாம்பலிலும் மனந்திரும்பியிருப்பார்கள்
  rationale: καθήμενοι என்ற பங்கேற்புவினை காட்டும் உட்கார்ந்த நிலையைப் பாதுகாத்து, வரலாற்று-தீர்க்கதரிசனப் படிமத்தைத் தெளிவாக வைத்திருக்கிறது.
- issue: கடந்தகால எதிர்நிலை நிபந்தனை
  choice: நிகழ்ந்திருந்தால் ... மனந்திரும்பியிருப்பார்கள்
  alternative: நிகழ்ந்திருந்தால் ... மனந்திரும்பியிருப்பர்
  rationale: தீரு, சீதோனில் அவை உண்மையில் நிகழவில்லை என்பதையும், நிகழ்ந்திருந்தால் ஏற்பட்டிருக்கும் விளைவையும் தமிழ் இலக்கணத்தில் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நகரங்கள் ஒருமையில் நேரடியாக அழைக்கப்படுவதால் ‘உனக்கு’ என்றும், இரு நகரங்களையும் அவற்றின் மக்களையும் சேர்த்துக் குறிப்பிடும் இடத்தில் ‘உங்களிடையே’ என்றும் எண்ணுமாற்றம் பாதுகாக்கப்பட்டுள்ளது. ‘ஐயோ’ தீர்ப்பும் புலம்பலும் கலந்த கூர்மையான தொனியைத் தக்கவைக்கிறது.
