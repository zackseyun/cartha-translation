source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: பல தீர்க்கதரிசிகளும் அரசர்களும் நீங்கள் காண்பவற்றைக் காண விரும்பினார்கள்[a]; ஆனால் அவற்றைக் காணவில்லை. நீங்கள் கேட்பவற்றைக் கேட்கவும் விரும்பினார்கள்; ஆனால் அவற்றைக் கேட்கவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆசைப்பட்டார்கள்’ அல்லது ‘ஏங்கினார்கள்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: λέγω உடன் வரும் ὑμῖν இயல்பாக ‘உங்களுக்குச் சொல்கிறேன்’ என மொழிபெயர்க்கப்படுகிறது. γάρ முந்தைய வசனத்துடனான விளக்கத் தொடர்பைக் காட்ட ‘ஏனெனில்’ எனத் தக்கவைக்கப்பட்டது.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: பல தீர்க்கதரிசிகளும் அரசர்களும்
  rationale: πολλοὶ என்பதற்கு இயல்பான ‘பல’ பயன்படுத்தப்பட்டது. προφῆται மற்றும் βασιλεῖς ஆகிய வரலாற்றுப் பிரிவுகள் விளக்க விரிவாக்கமின்றி முறையே ‘தீர்க்கதரிசிகள்’, ‘அரசர்கள்’ என வழங்கப்பட்டன.
- source_word: ἠθέλησαν
  choice: விரும்பினார்கள்
  rationale: θέλω இங்கு ஒன்றைக் காணவும் கேட்கவும் கொண்ட விருப்பத்தைக் குறிக்கிறது. ‘விரும்பினார்கள்’ என்பது உணர்ச்சியின் தீவிரத்தை மிகைப்படுத்தாமல் பொருளையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: நீங்கள் காண்பவற்றைக் காண
  rationale: உறவுப்பெயர்ச்சொல் அமைப்பும் நிகழ்கால βλέπετε என்பதும் தமிழில் இயல்பாக ‘நீங்கள் காண்பவற்றை’ எனக் கொடுக்கப்பட்டன; ὑμεῖς தெளிவாக ‘நீங்கள்’ என வெளிப்படுத்தப்பட்டது.
- source_word: καὶ οὐκ εἶδαν
  choice: ஆனால் அவற்றைக் காணவில்லை
  rationale: அவர்கள் விரும்பிய காட்சியை அடையவில்லை என்ற வரலாற்று உண்மை நேரடியாகக் காக்கப்பட்டது. தமிழில் பொருள் தெளிவாக இருக்க ‘அவற்றை’ சேர்க்கப்பட்டது; καί இங்குள்ள எதிர்மறைத் தொடர்பு ‘ஆனால்’ என இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: நீங்கள் கேட்பவற்றைக் கேட்கவும்
  rationale: காண்பது–கேட்பது என்ற இணை அமைப்பு காக்கப்பட்டது. முதல் விருப்ப வினையுடன் தொடர்வதைக் காட்ட ‘-வும்’ பயன்படுத்தப்பட்டது.
- source_word: καὶ οὐκ ἤκουσαν
  choice: ஆனால் அவற்றைக் கேட்கவில்லை
  rationale: முந்தைய ‘காணவில்லை’ என்பதுடன் உள்ள சமநிலை காக்கப்பட்டது; தமிழில் குறிக்கப்படும் பொருளைத் தெளிவாக்க ‘அவற்றை’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: ‘தீர்க்கதரிசிகளும் அரசர்களும்’ என்பவர்களின் அடையாளம்
  choice: வரலாற்றுப் பிரிவுகளான ‘தீர்க்கதரிசிகள்’, ‘அரசர்கள்’ என்பவற்றை விளக்கச் சேர்க்கையின்றி தக்கவைத்தல்
  alternative: ‘தீர்க்கதரிசிகளும் ஆட்சியாளர்களும்’ அல்லது ‘பண்டைய தீர்க்கதரிசிகளும் அரசர்களும்’
  rationale: கிரேக்க உரை இஸ்ரவேலின் கடந்தகால முக்கிய நபர்களுக்கும் இயேசுவின் சீடர்கள் இப்போது காண்பதும் கேட்பதும் ஆகியவற்றுக்கும் இடையிலான வேறுபாட்டைக் காட்டுகிறது. ‘பண்டைய’ போன்ற விளக்கத்தைச் சேர்க்காமலும் ‘அரசர்கள்’ என்பதைப் பொதுவான ‘ஆட்சியாளர்கள்’ என விரிவாக்காமலும் அந்த இறையியல் அழுத்தம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டது. மூலத்தின் காணுதல்–கேட்டல் இணை அமைப்பும் விளக்கத் தொடர்பும் காக்கப்பட்டுள்ளன; வாசிப்புத் தெளிவுக்காக நீண்ட கிரேக்க வாக்கியம் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
