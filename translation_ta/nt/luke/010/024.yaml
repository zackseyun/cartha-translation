  source_fidelity: மூலக் கிரேக்கத்தின் விளக்கத் தொடர்பான γάρ (‘ஏனெனில்’), ‘தீர்க்கதரிசிகள் மற்றும் அரசர்கள்’ என்ற வரலாற்றுப் பிரிவுகள், காணுதல்–கேட்டல் இணை அமைப்பு, மற்றும் அவர்கள் விரும்பியதை அடையவில்லை என்ற இரு மறுப்புகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அவற்றை’ என்பது கிரேக்கத்தில் உட்பொருளாக உள்ள சார்புப் பொருளைத் தமிழில் தெளிவுபடுத்தும் இயல்பான சேர்க்கையாகும்.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. நீளமான கிரேக்க வாக்கியத்தை இரண்டு வாக்கியங்களாகப் பிரித்திருப்பது பொருளையோ இணை அமைப்பையோ பாதிக்கவில்லை. ‘கேட்கவும் விரும்பினார்கள்’ என்பது முன்வரும் பொருளிலிருந்து எழுவாயை இயல்பாகத் தொடர்கிறது.
