id: LUK.10.27
reference: Luke 10:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: ta
  text: 'அவர் பதிலளித்தார்: “உன் ஆண்டவராகிய கடவுளை உன் முழு இதயத்தோடும், உன் முழு ஆன்மாவோடும், உன் முழு வலிமையோடும், உன் முழு மனதோடும் அன்புகூர வேண்டும்; உன் அயலவரை உன்னைப்போல அன்புகூர வேண்டும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்தார்
  rationale: பங்கேற்புவினை மற்றும் முற்றுவினை சேர்ந்த கிரேக்கக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காட்டுகிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூர வேண்டும்
  rationale: எதிர்காலச் சுட்டுவினை இங்கு வேதக் கட்டளையின் வலிமையுடன் செயல்படுகிறது; தமிழில் ‘வேண்டும்’ அந்தக் கட்டளைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κύριον τὸν θεόν σου
  choice: உன் ஆண்டவராகிய கடவுள்
  rationale: κύριος என்பதன் தெய்வீகப் பட்டத்தை ‘ஆண்டவர்’ என்றும் θεός என்பதை ‘கடவுள்’ என்றும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: உன் முழு இதயத்திலிருந்தும்
  rationale: ἐξ என்பதன் ‘இலிருந்து’ என்ற மூலப் பொருளையும், அடுத்துள்ள ἐν தொடர்களிலிருந்து அதன் வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: உன் முழு ஆன்மாவோடும்
  rationale: ψυχή என்பதை இங்கு கடுமையான உடல்–ஆன்மா கோட்பாடாக விளக்காமல், மரபும் சூழலும் ஏற்ற ‘ஆன்மா’ என வழங்குகிறது.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: உன் முழு வலிமையோடும்
  rationale: ἰσχύς என்பதன் சக்தி அல்லது வலிமை என்ற நேரடிப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: உன் முழு மனதோடும்
  rationale: διάνοια குறிக்கும் சிந்தனை மற்றும் புரிதல் ஆற்றலை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸν πλησίον σου
  choice: உனக்கு அடுத்திருப்பவர்
  rationale: πλησίον என்பதன் ‘அருகில்/அடுத்திருப்பவர்’ என்ற உறவுசார் பொருளை வெளிப்படுத்துகிறது; ‘அயலார்’ எனும் சொல் பக்கத்து வீட்டாராக மட்டும் குறுகிப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: ὡς σεαυτόν
  choice: உன்னிடம்போல்
  rationale: ὡς என்பதன் ஒப்பீட்டு வலிமையை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: வேதாகம மேற்கோளில் κύριος என்ற தெய்வீகப் பட்டம்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் பட்டமாக இருப்பதால் ‘ஆண்டவர்’ தெய்வீகப் பொருளையும் வேதாகம ஒலிப்பையும் பாதுகாக்கிறது.
- issue: καρδία, ψυχή, ἰσχύς, διάνοια என்னும் நான்கு மனிதத் திறன்கள்
  choice: இதயம், ஆன்மா, வலிமை, மனம் என நான்கையும் தனித்தனியாக வைத்தல்
  alternative: ‘முழு ஆளுமையோடும்’ என ஒன்றிணைத்தல்
  rationale: இவை முழுமையான அர்ப்பணிப்பை வலியுறுத்தும் ஒன்றோடொன்று மேலிடும் சொற்கள். அவற்றைத் தனித்தனியாக வைப்பது மூலத்தின் சொல்லடுக்கை பாதுகாக்கிறது; அதே நேரத்தில் ஒரு குறிப்பிட்ட மனிதவியல் கோட்பாட்டைத் திணிக்கவில்லை.
- issue: ἐξ மற்றும் ἐν முன்இடைச்சொற்களின் வேறுபாடு
  choice: இதயத்திற்கு ‘இலிருந்து’; மற்றவற்றிற்கு ‘ஓடும்’
  alternative: அனைத்திற்கும் ‘ஓடும்’
  rationale: லூக்காவின் கிரேக்கத்தில் உள்ள உண்மையான வடிவ வேறுபாட்டைத் தமிழ் வாசகனுக்குத் தெரியச் செய்கிறது; இயல்பான மரபுவழி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை. மேற்கோளின் கட்டளை வலிமைக்காக ‘அன்புகூர வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது. ‘அடுத்திருப்பவர்’ என்பது πλησίον என்பதைக் குடியிருப்பு அயலாராக மட்டும் குறுக்காமல் உறவுசார் அகலத்துடன் தருகிறது.
