source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: ta
  text: அந்த ஊரில் உள்ள நோயாளிகளைக் குணமாக்குங்கள்; அவர்களிடம், “இறைவனுடைய ஆட்சி உங்களிடம் நெருங்கி வந்துவிட்டது” என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεραπεύετε
  choice: குணமாக்கி
  rationale: நிகழ்காலச் செயப்படுத்தும் கட்டளை தொடர்ச்சியான பணியைச் சுட்டுகிறது. நோயாளிகள் என்ற உடனடிச் சூழலில் ‘குணமாக்குங்கள்’ என்பதே இயல்பானதும் தெளிவானதும்.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: அந்த ஊரில் உள்ள நோயாளிகளை
  rationale: ἀσθενεῖς என்பது ‘பலவீனமானவர்கள்’ அல்லது ‘நோயுற்றவர்கள்’ எனப் பொருள்படலாம்; θεραπεύετε உடன் வருவதால் உடல்நோயே முதன்மை. αὐτῇ முந்தைய வசனத்தில் உள்ள ஊரைக் குறிக்கிறது.
- source_word: λέγετε αὐτοῖς
  choice: அவர்களிடம் … என்று சொல்லுங்கள்
  rationale: கிரேக்கச் சொல்லின் எளிய, நேரடியான பேச்சுக் கட்டளையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: Ἤγγικεν
  choice: நெருங்கி வந்துவிட்டது
  rationale: நிறைவுக்கால வினை, நெருங்கிவந்த நிகழ்வையும் அதன் தற்போதைய விளைவையும் தெரிவிக்கிறது. ‘நெருங்கி வந்துவிட்டது’ இந்த இரு அம்சங்களையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்களிடம்
  rationale: ἐγγίζω உடன் வரும் ἐπί + accusative, கேட்போருடன் தொடர்புடைய அணுகுதலைக் குறிக்கிறது. ‘உங்களிடம்’ என்பது இயல்பான தமிழ்; அச்சுறுத்தலைக் குறிப்பதாகத் தவறாகப் புரியவைக்காது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: இறைவனுடைய ஆட்சி
  rationale: βασιλεία என்பது ஒரு நிலப்பரப்பை மட்டுமல்ல, அரசாட்சி அல்லது ஆளுகையையும் குறிக்கிறது. இச்சூழலில் ‘ஆட்சி’ அதன் இயக்கமுள்ள பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; ‘இறைவனுடைய’ என்பது நவீனத் தமிழில் கண்ணியமான, பொதுவாகப் புரியும் வடிவம்.
theological_decisions:
- issue: இறைவனுடைய ஆட்சி பற்றிய அறிவிப்பின் பொருள்
  choice: இறைவனுடைய ஆட்சி நெருங்கிவந்து இப்போது பொருத்தமுடையதாகியுள்ளது என அறிவிக்கிறது; அது முழுமையாக நிறைவேறிவிட்டதா அல்லது இன்னும் எதிர்கால நிறைவை உடையதா என்பதை வசனம் தீர்மானிக்கவில்லை.
  alternative: ஆட்சி இப்போதே முழுமையாக வந்துவிட்டது; அல்லது அது எதிர்காலத்தில் மட்டுமே வரவுள்ளது.
  rationale: Ἤγγικεν அணுகிவந்ததையும் தற்போதைய தொடர்பையும் காட்டுகிறது; ஆனால் தொடங்கியுள்ளதா—இன்னும் நிறைவடைய வேண்டியதா என்ற இறுதிக்காலத் தத்துவப் பதற்றத்தைத் தீர்ப்பதில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்குப் புரியும், கண்ணியமான நேரடி கட்டளை நடை. முந்தைய வசனத்தின் நகரம்/ஊர் என்ற குறிப்பு தமிழில் தெளிவாக ‘அந்த ஊரில்’ என வழங்கப்பட்டுள்ளது. மூலத்தில் தனி அடிக்குறிப்பு தேவைப்படும் முக்கிய உரைவேறுபாடு இல்லை.
