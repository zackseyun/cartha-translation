source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, ஆண்டவர் வேறு எழுபத்திரண்டு பேரையும்[a] நியமித்து, தாம் செல்லவிருந்த ஒவ்வொரு நகரத்திற்கும் இடத்திற்கும், தமக்கு முன்னதாக, அவர்களை இருவர் இருவராக அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப்பிரதிகளில் ‘எழுபத்திரண்டு’ என்பதற்குப் பதிலாக ‘எழுபது’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரைக் காத்து, நிகழ்வுகளுக்கிடையிலான காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀνέδειξεν
  choice: நியமித்து
  rationale: ஒரு பணிக்காக ஆட்களைத் தேர்ந்தெடுத்து நியமித்தல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரபான, கண்ணியமான தமிழாக்கம்; இவ்விடத்தில் இது இயேசுவைக் குறிக்கிறது.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: வேறு எழுபத்திரண்டு பேரையும்
  rationale: ἑτέρους என்பதன் ‘வேறு/கூடுதலானவர்கள்’ என்ற பொருளையும் καί தரும் சேர்க்கைப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது; SBLGNT-இன் ‘எழுபத்திரண்டு’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: குறிப்பிட்ட பணிக்காக அனுப்பிய செயலை நேரடியாகச் சொல்கிறது; தேவையற்ற பதவிசார் பொருளைச் சேர்க்கவில்லை.
- source_word: ἀνὰ δύο δύο
  choice: இருவர் இருவராக
  rationale: கிரேக்கத்தின் பகிர்மானத் திரும்பச்சொல்லைத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் காக்கிறது.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: தமக்கு முன்னதாக
  rationale: அவர் வருவதற்கு முன்பே ஆயத்தப் பணிக்காகச் சென்றார்கள் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: ஒவ்வொரு நகரத்திற்கும் இடத்திற்கும்
  rationale: πόλις மற்றும் τόπος என்ற இரு பெயர்ச்சொற்களையும் ஒன்றாகச் சுருக்காமல் காக்கிறது.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: தாம் செல்லவிருந்த
  rationale: μέλλω தரும் வரவிருக்கும்/திட்டமிடப்பட்ட செயலை ‘செல்லவிருந்த’ எனக் காட்டி, αὐτός என்பதன் வலியுறுத்தலை மரியாதைத் தற்சுட்டான ‘தாம்’ மூலம் காக்கிறது.
theological_decisions:
- issue: நியமிக்கப்பட்டவர்களின் எண்ணிக்கையிலுள்ள பாடவேறுபாடு
  choice: எழுபத்திரண்டு
  alternative: எழுபது
  rationale: வழங்கப்பட்ட SBLGNT மூல உரையில் ἑβδομήκοντα δύο (‘எழுபத்திரண்டு’) உள்ளது. ‘எழுபது’ என்பது முக்கியமான கையெழுத்துப்பிரதி வேறுபாடு என்பதால் அதை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது; இது கோட்பாட்டுத் தீர்மானம் அல்ல, உரைப்பாடச் சிக்கல்.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்க ‘ஆண்டவர்’ என்றும், மரியாதை ஒருமையைத் தெளிவாகக் காக்க ‘தாம்/தமக்கு’ என்றும் வழங்கப்பட்டுள்ளது.
