source:
  edition: SBLGNT
  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: ta
  text: “இந்த மூவரில், கொள்ளையர்களிடம் சிக்கிக்கொண்டவனுக்கு அயலானாக ஆனவர் யார் என்று உனக்குத் தோன்றுகிறது?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மூவரில், கொள்ளையர்களிடம் சிக்கிக்கொண்டவனுக்கு அயலானாக இருந்தவர் யார் என்று நீ நினைக்கிறாய்?” கிரேக்கத்தில் இன்னும் நேரடியாக, “அயலானாக ஆகியிருக்கிறார் என்று உனக்குத் தோன்றுகிறது” என்று உள்ளது; இது செயலால் ஒருவர் அயலானாக ஆவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: இந்த மூவரில் ... யார்
  rationale: வரையறுக்கப்பட்ட மூவரில் ஒருவரைத் தேர்ந்தெடுக்கும் வினாவை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தருகிறது; கிரேக்கத்தில் இல்லாத ‘மனிதர்கள்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: πλησίον
  choice: அயலானாக
  rationale: இங்கு πλησίον அருகிலிருப்பவர் என்ற பெயர்ச்சொல் பொருளில், γεγονέναι என்பதுடன் பயனிலையாக வருகிறது. ‘அயலானாக’ என்பது உறவுநிலையையும் அதற்கேற்ற செயலையும் சுருக்கமாகக் காக்கிறது.
- source_word: δοκεῖ σοι
  choice: உனக்குத் தோன்றுகிறது
  rationale: δοκεῖ என்பதிலுள்ள ‘தோன்றுதல்’ என்ற வெளிப்பாட்டையும் σοι என்பதிலுள்ள ‘உனக்கு’ என்பதையும் நேரடியாகக் காக்கிறது; அதை வெறுமனே ‘நீ நினைக்கிறாய்’ என்று மாற்றவில்லை.
- source_word: γεγονέναι
  choice: ஆனவர்
  rationale: γίνομαι என்பதன் நிறைவுற்ற infinitive வடிவம் நிலையாக ‘இருத்தலை’ மட்டும் அல்லாமல் ‘ஆகியிருத்தலை’ சுட்டுகிறது. தமிழில் ‘அயலானாக ஆனவர்’ என்பது இந்த இயக்கத்தையும் உவமையின் நெறியியல் திருப்பத்தையும் காக்கிறது.
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: கொள்ளையர்களிடம் அகப்பட்டவனுக்கு
  rationale: ἐμπίπτω + εἰς என்ற மரபுத்தொடர் கொள்ளையர்களின் பிடியில் அல்லது வசத்தில் சிக்கியதைக் குறிக்கிறது. ‘அகப்பட்டவன்’ தமிழில் இயல்பாக அதைக் காட்டுகிறது; சூழலில் குறிப்பிடப்பட்ட மனிதனையே ஒருமை ஆண்பால் வடிவம் சுட்டுகிறது.
theological_decisions:
- issue: நல்ல சமாரியன் உவமையின் கேள்வியில் உள்ள நெறியியல் மையம்
  choice: ‘அயலானாக ஆனவர்’ என்று γίνομαι-யின் இயக்கப் பொருளைக் காத்தல்
  alternative: ‘அயலானாக இருந்தவர்’ என்று நிலையான உறவாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வாக்கியம் ‘என் அயலான் யார்?’ என்ற அடையாளக் கேள்வியை, செயலால் ‘யார் அயலானாக ஆனார்?’ என்ற கேள்வியாக மாற்றுகிறது. ‘ஆனவர்’ என்பது இந்த இறையியல் மற்றும் நெறியியல் அழுத்தத்தை விளக்கவுரை சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதையும் கண்ணியமும் கொண்ட கேள்விநடை பயன்படுத்தப்பட்டுள்ளது. ‘அயலானாக ஆனவர்’ என்ற சிறிது குறியிடப்பட்ட சொற்றொடர், கிரேக்க γεγονέναι-யின் ‘ஆகுதல்’ பொருளை நோக்கத்துடன் காக்கிறது. வசனத்திலுள்ள ‘உனக்கு’ என்ற ஒருமைத் தொடர்பு ‘உனக்குத்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
