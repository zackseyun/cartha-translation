  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: ta
  text: நீங்கள் எந்த வீட்டுக்குள் நுழைந்தாலும், முதலில் ‘இந்த வீட்டுக்குச் சமாதானம் உண்டாகட்டும்’[a] என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த வீட்டுக்குச் சமாதானம்’ அல்லது ‘இந்த வீட்டின்மேல் சமாதானம் உண்டாகட்டும்.’ கிரேக்கத்தில் இது சுருக்கமான ஆசிமொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃
  choice: நீங்கள் எந்த வீட்டுக்குள் சென்றாலும்
  rationale: εἰς என்பதன் திசைநோக்கிய பொருளை ‘வீட்டுக்குள்’ காக்கிறது; ἣν ... ἂν உடனான இறந்தகாலத் துணைநிலை வினைச்சொல் பொதுவான எதிர்காலச் சூழலைக் குறிப்பதால், நவீன தமிழில் ‘எந்த ... சென்றாலும்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: οἰκίαν / οἴκῳ
  choice: வீடு / வீட்டுக்கு
  rationale: இங்கு முதன்மையாகக் குறிக்கப்படுவது சீடர்கள் நுழையும் குடியிருப்பு. ஆசிமொழியில் வரும் οἶκος அதே வீட்டையும், பொருள்விரிவாக அங்குள்ளவர்களையும் குறிக்க இயலும்; ‘வீடு’ அந்த இயல்பான இருபொருள் வாய்ப்பை ஓரளவு காக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: வீட்டுக்குள் நுழைந்ததும் செய்ய வேண்டிய முதல் செயலை வரிசைப்படி குறிக்கிறது.
- source_word: λέγετε
  choice: என்று சொல்லுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் மீண்டும் மீண்டும் பின்பற்ற வேண்டிய அறிவுறுத்தலைக் காட்டுகிறது; தமிழில் நேரடி உரையைத் தொடர்ந்து ‘என்று சொல்லுங்கள்’ இயல்பான வடிவம்.
- source_word: Εἰρήνη τῷ οἴκῳ τούτῳ
  choice: இந்த வீட்டுக்குச் சமாதானம் உண்டாகட்டும்
  rationale: கிரேக்கத்தில் வினைச்சொல் இல்லாத சுருக்கமான வாழ்த்து/ஆசிமொழி உள்ளது. தமிழில் ‘உண்டாகட்டும்’ என்பதை வெளிப்படுத்துவது அதன் ஆசிமொழித் தன்மையை இயல்பாகத் தெரிவிக்கிறது; ‘சமாதானம்’ εἰρήνη என்பதன் அமைதி, நலன் ஆகிய விரிவைத் தாங்குகிறது.
theological_decisions:
- issue: சமாதான வாழ்த்தின் இயல்பு
  choice: ‘இந்த வீட்டுக்குச் சமாதானம் உண்டாகட்டும்’ என்ற பேசப்படும் ஆசிமொழியாக மொழிபெயர்த்தல்
  alternative: ‘இந்த வீட்டுக்குச் சமாதானம்’ என்ற கிரேக்கத்தை ஒத்த சுருக்கமான வடிவம்
  rationale: இது வெறும் சாதாரண வணக்கம் மட்டுமல்லாமல் வீட்டின் மீது உரைக்கப்படும் சமாதான வாழ்த்து/ஆசியாகச் செயல்படுகிறது. ‘உண்டாகட்டும்’ என்பது கிரேக்கத்தில் உள்ள மறைமுக ஆசிப் பொருளை தமிழில் வெளிப்படுத்துகிறது; அதற்கு மேலான சடங்கு அல்லது கோட்பாட்டுச் சொல்லாக்கத்தைச் சேர்ப்பதில்லை.
- issue: ‘வீடு’ என்பதன் குறிப்பு
  choice: குடியிருப்பை நேரடியாகக் குறிக்கும் ‘வீடு’ என்பதைக் காத்தல்
  alternative: அங்குள்ள மக்களை வெளிப்படையாகக் குறிக்கும் ‘குடும்பம்’ அல்லது ‘வீட்டார்’
  rationale: οἰκία மற்றும் οἶκος இச்சூழலில் நுழையப்படும் வீட்டை நேரடியாகக் குறிக்கின்றன; ஆசிமொழி அதன் குடியிருப்போரையும் உள்ளடக்கலாம். ‘வீடு’ என்று மொழிபெயர்ப்பது அந்தச் சாத்தியமான பொருள் விரிவைத் தீர்மானமாகச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டுக்குள்’ மூலத்தின் திசைநோக்கிய பொருளைக் காக்கிறது; ‘சமாதானம் உண்டாகட்டும்’ தமிழில் வாழ்த்து/ஆசிமொழியாக இயல்பாக ஒலிக்கிறது.
