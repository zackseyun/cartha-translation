  rationale: ἤγγικεν என்ற நிறைவுக் கால வடிவம் நிகழ்ந்த நெருக்கத்தையும் தொடரும் விளைவையும் காட்டுகிறது; இறுதி நிறைவேற்றம் பற்றிய முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீனப் பொதுத்தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘துடைத்துப் போடுகிறோம்’ என்பது மூல வினையின் உடற்செயலைக் காக்கிறது; ‘நெருங்கி வந்திருக்கிறது’ என்பது நிறைவுக் காலத்தின் தொடரும் விளைவை இயல்பாக வெளிப்படுத்துகிறது. சமயக்குழு சார்ந்த தனிப்பட்ட கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
