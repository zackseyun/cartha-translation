- source_word: κονιορτός
  choice: தூசி
  rationale: இச்சொல் பொதுவான மண்ணையோ அழுக்கையோ அல்ல, குறிப்பாகத் தூசியைக் குறிக்கிறது; இச்சூழலில் செயலின் அடையாளப் பொருளையும் இது காக்கிறது.
- source_word: κολληθέντα
  choice: ஒட்டிக்கொண்ட
  rationale: தூசி கால்களில் நெருக்கமாகப் படிந்து ஒட்டியிருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: உங்கள் நகரத்திலிருந்து
  rationale: ἐκ குறிக்கும் தோற்றுவாயை இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰς τοὺς πόδας
  choice: எங்கள் கால்களில்
  rationale: சொல்லுக்கு சொல் வடிவம் சற்றே இடரானது; இவ்விடத்தில் நகரத்தின் தூசி தூதர்களின் கால்களில் ஒட்டியிருப்பதே பொருள்.
- source_word: ἀπομασσόμεθα
  choice: துடைத்துப் போடுகிறோம்
  rationale: வழக்கமாகக் காணப்படும் ‘உதறுகிறோம்’ என்பதற்குப் பதிலாக, மூல வினைச்சொல்லின் குறிப்பான ‘துடைத்து அகற்றுதல்’ என்ற பொருளைக் காக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு எதிராக
  rationale: இந்தச் செயல் வெறுமனே அவர்கள் முன்னிலையில் செய்யப்படுவது அல்ல; மறுத்த நகரத்திற்கு எதிரான அடையாளச் செயலாக இருப்பதைச் சூழல் காட்டுகிறது.
- source_word: πλήν
  choice: ஆனாலும்
  rationale: நியாயத்தீர்ப்பைக் குறிக்கும் செயலுக்குப் பின்னரும் அறியப்பட வேண்டிய உண்மையை வலியுறுத்தும் எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: அங்கீகரித்து உணர வேண்டும் எனக் கோரும் நிகழ்காலக் கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἤγγικεν
  choice: நெருங்கி வந்திருக்கிறது
  rationale: நெருங்கிவந்த நிகழ்வும் அதன் தொடரும் நிகழ்காலப் பொருத்தமும் ஆகிய இரண்டையும் கிரேக்க நிறைவுக் காலத்துக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: கடவுளின் அரசுரிமையும் ஆட்சியும் அடங்கிய βασιλεία என்பதற்கான எளிய, கண்ணியமான தமிழ்; அதை வெறும் அரசியல் நிர்வாகமாக விரிவாக்காமல் ‘kingdom’ உருவகத்தையும் காக்கிறது.
