base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: ta
  text: '“உங்கள் நகரத்திலிருந்து எங்கள் கால்களில் ஒட்டிக்கொண்ட தூசியைக்கூட உங்களுக்கு எதிராகத் துடைத்து அகற்றுகிறோம்.[a][b] ஆனாலும் இதை அறிந்துகொள்ளுங்கள்: கடவுளின் அரசாட்சி நெருங்கி வந்திருக்கிறது.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கள் கால்களிலிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் மரபுத்தொடர் தன்மை கொண்டது; அவர்களுடைய நகரத்தின் தூசி தூதர்களின் கால்களில் ஒட்டியிருந்ததை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: பல மொழிபெயர்ப்புகள் “உதறிப்போடுகிறோம்” என்று தருகின்றன; ஆனால் இங்குள்ள கிரேக்க வினைச்சொல் இன்னும் குறிப்பாக “துடைத்து அகற்றுகிறோம்” என்று பொருள்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “நெருங்கியிருக்கிறது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுக் காலம், கடவுளின் அரசாட்சி நெருங்கி வந்ததையும் அந்த நெருக்கம் தொடர்வதையும் சுட்டுகிறது.
    reason: lexical_alternative
