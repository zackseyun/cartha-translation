source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: ta
  text: அதற்கு அவர், “அவரிடம் இரக்கம் காட்டியவர்தான்” என்றார். அப்போது இயேசு அவரிடம், “நீர் போய், நீரும் அவ்வாறே செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: அவரிடம் இரக்கம் காட்டியவர்தான்
  rationale: ‘இரக்கத்தைச் செய்தவர்’ என்ற மூலமொழி மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பதிலின் வலியுறுத்தலை ‘தான்’ காக்கிறது.
- source_word: Πορεύου
  choice: நீர் போய்
  rationale: கட்டளையின் நேரடியான தன்மையைத் தக்கவைத்து, இயேசு உரையாடும் சூழலுக்கு ஏற்ற கண்ணியமான ஒருமை முன்னிலையைப் பயன்படுத்துகிறது.
- source_word: καὶ σὺ
  choice: நீரும்
  rationale: ‘நீயும்’ என்ற வெளிப்படையான வலியுறுத்தலை விடாமல் மொழிபெயர்க்கிறது.
- source_word: ποίει ὁμοίως
  choice: அவ்வாறே செய்யும்
  rationale: தொடர்ந்து கடைப்பிடிக்க வேண்டிய கட்டளையின் இயல்பையும் ‘அதேபோல் செய்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளையில் καὶ σὺ என்பதன் வெளிப்படையான வலியுறுத்தல்
  choice: “நீரும்” என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது
  alternative: “போய் அவ்வாறே செய்யும்”
  rationale: செயலைக் கேட்டறிந்தவரிடமே தனிப்பட்ட முறையில் திருப்பும் மூலவாக்கியத்தின் அழுத்தத்தைப் பாதுகாக்கிறது; எந்தக் கோட்பாட்டு விளக்கத்தையும் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பும், வேதாகம உரையாடலுக்கேற்ற கண்ணியமும் சமநிலைப்படுத்தப்பட்டுள்ளன. மரியாதை ஒருமையான ‘நீர்’ மற்றும் அதற்குரிய வினைமுற்று பயன்படுத்தப்பட்டுள்ளன.
