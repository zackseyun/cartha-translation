  source_fidelity: முதல் பதில் Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ என்பதன் பொருளைத் துல்லியமாகத் தருகிறது; “அவரிடம் இரக்கம் காட்டியவர்” என்பது மூலத்தின் ‘அவருக்கு இரக்கம் செய்தவர்/காட்டியவர்’ என்ற கருத்துக்கு இயல்பான தமிழ். καὶ σὺ என்பதிலுள்ள வலியுறுத்தலும் “நீரும்” என்பதால் காக்கப்படுகிறது. ஆனால் ποίει என்பது முன்னிலை கட்டளை; வரைவிலுள்ள “செய்யும்” நவீன நிலையான தமிழில் கட்டளையாக அமையவில்லை.
  naturalness: “நீர் போய், நீரும் அவ்வாறே செய்யுங்கள்” என்பது மரியாதை ஒருமை உரையாடலுக்கு இயல்பான, இலக்கணமான நவீனத் தமிழ். “அதற்கு அவர்” மற்றும் “அப்போது இயேசு அவரிடம்” என்பவை சூழலுக்கும் தொடர்ச்சிக்கும் ஏற்றவை.
  terminology: “இரக்கம் காட்டியவர்” என்பது ἔλεος-க்கு சூழல்பொருந்திய பொதுவாசகர் நடையிலான மொழிபெயர்ப்பு. “இயேசு” பெயர்ப்பயன்பாடும் நிலையானது. எந்தக் கோட்பாட்டுச் சேர்க்கையும் இல்லை.
