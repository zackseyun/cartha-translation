source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: ta
  text: அந்த வீட்டிலேயே தங்கி, அவர்கள் கொடுப்பவற்றை உண்டு குடியுங்கள்; ஏனெனில் உழைப்பவர் தமக்குரிய கூலிக்குத் தகுதியானவர்.[a] வீடு வீடாக மாறிச் செல்லாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உழைப்பவர் தமக்குரிய கூலியைப் பெறத் தகுதியானவர்.”
    reason: ἄξιος ... τοῦ μισθοῦ αὐτοῦ என்ற தொடரில், உழைப்பவருக்குச் சேர வேண்டிய கூலியைப் பெறும் உரிமை என்ற பொருளை வெளிப்படுத்தும் இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: அந்த வீட்டிலேயே
  rationale: முன்னர் குறிப்பிடப்பட்ட, தங்களை ஏற்றுக்கொண்ட அதே வீட்டைக் குறிக்கும் தொடர். ‘-லேயே’ என்பது ஒரே வீட்டில் தொடர்ந்து இருக்க வேண்டிய வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μένετε
  choice: தங்கி
  rationale: தொடர்ந்து அங்கே இருக்குமாறு இடப்படும் கட்டளையை, அடுத்து வரும் உண்டு குடித்தலுடன் இயல்பாக இணைக்கிறது.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: உண்டு குடியுங்கள்
  rationale: தங்கியிருக்கும் காலத்தில் நடைபெறும் இரு செயல்களையும் இயல்பான தமிழ்க் கட்டளை வடிவில் தெரிவிக்கிறது.
- source_word: τὰ παρ’ αὐτῶν
  choice: அவர்கள் கொடுப்பவற்றை
  rationale: வீட்டார் வழங்கும் உணவு மற்றும் பானத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது; இணை வசனங்களிலிருந்து கூடுதல் சொற்களை இறக்குமதி செய்யவில்லை.
- source_word: ἄξιος γὰρ ὁ ἐργάτης
  choice: ஏனெனில், வேலையாள் ... தகுதியுள்ளவர்
  rationale: γάρ தரும் காரண உறவையும், ἐργάτης என்பதன் பொதுவான ‘வேலை செய்பவர்’ என்ற பொருளையும் சுருக்கமாகவும் கண்ணியமாகவும் அளிக்கிறது.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: தன் கூலிக்கு
  rationale: μισθός இச்சூழலில் உழைப்புக்குரிய ஊதியத்தைக் குறிக்கிறது. ‘தன்’ என்பது ஒருமை வேலையாளையே திரும்பச் சுட்டி, தமிழில் இயல்பாக உள்ளது.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: வீடு வீடாக மாறிச் செல்லாதீர்கள்
  rationale: தங்கும் இடத்தை ஒரு வீட்டிலிருந்து இன்னொரு வீட்டுக்கு மாற்ற வேண்டாம் என்ற தடையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: τοῦ μισθοῦ αὐτοῦ என்பதில் உள்ள ஒருமை ஆண்பால் சுட்டல்
  choice: வேலையாள் தன் கூலிக்குத் தகுதியுள்ளவர்
  alternative: வேலை செய்பவர்கள் தங்கள் கூலிக்குத் தகுதியுள்ளவர்கள்
  rationale: கிரேக்கத்தில் உள்ள ஒருமை அமைப்பைப் பாதுகாக்கிறது. தமிழின் ‘தன்’ பாலைக் கட்டாயமாகக் குறிப்பிடாமல் அதே ஒருமை வேலையாளைத் துல்லியமாகச் சுட்டுகிறது; பொதுப்பொருளையும் தேவையின்றி பன்மையாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அந்த வீட்டிலேயே’ ஒரே இடத்தில் தங்கும் வலியுறுத்தலைக் காட்டுகிறது; ‘வீடு வீடாக மாறிச் செல்லாதீர்கள்’ தங்குமிடத்தை மாற்றிக்கொண்டிருப்பதைத் தெளிவாகத் தடுக்கிறது. அடிக்குறிப்புக் குறி அது விளக்கும் கூலி தொடர்பான வாக்கியத்திற்குப் பின் வைக்கப்பட்டுள்ளது.
