revisions:
- from: அந்த வீட்டிலேயே தங்கி, அவர்கள் கொடுப்பவற்றை உண்டு குடியுங்கள்; ஏனெனில், வேலையாள் தன் கூலிக்குத் தகுதியுள்ளவர்.[a] வீடு வீடாக மாறிச் செல்லாதீர்கள்.
  to: அந்த வீட்டிலேயே தங்கி, அவர்கள் கொடுப்பவற்றை உண்டு குடியுங்கள்; ஏனெனில் உழைப்பவர் தமக்குரிய கூலிக்குத் தகுதியானவர்.[a] வீடு வீடாக மாறிச் செல்லாதீர்கள்.
