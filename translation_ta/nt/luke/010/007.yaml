review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the command to remain in the receiving household, accept what the hosts supply, the rationale concerning a worker's wages, and the prohibition on changing houses. The phrase “வேலையாள் தன் கூலிக்குத் தகுதியுள்ளவர்,” however, is less idiomatic and “வேலையாள்” can suggest a household servant rather than a worker/laborer in general.
  naturalness: The verse is generally clear modern Tamil. Replacing “வேலையாள்” with “உழைப்பவர்” and using “தமக்குரிய கூலி” produces a more natural, dignified, and contextually precise expression. “வீடு வீடாக மாறிச் செல்லாதீர்கள்” naturally communicates moving between lodgings.
  terminology: “உழைப்பவர்” appropriately represents ἐργάτης without importing a servant-specific nuance. “கூலி” suitably renders μισθός in its sense of wages. The Tamil reflexive form preserves the singular referential relationship without forcing a grammatical gender not expressed in Tamil.
  issues:
  - severity: low
    issue: “வேலையாள்” is potentially narrower than ἐργάτης.
    rationale: In current Tamil, “வேலையாள்” may commonly evoke a domestic employee or hired servant. The Greek refers broadly to a worker/laborer.
  - severity: low
    issue: The wording “தன் கூலிக்குத் தகுதியுள்ளவர்” is somewhat awkward.
    rationale: “தமக்குரிய கூலிக்குத் தகுதியானவர்” is more idiomatic Tamil and explicitly preserves the sense that the wages belong to the worker by right.
  revised_text: அந்த வீட்டிலேயே தங்கி, அவர்கள் கொடுப்பவற்றை உண்டு குடியுங்கள்; ஏனெனில் உழைப்பவர் தமக்குரிய கூலிக்குத் தகுதியானவர்.[a] வீடு வீடாக மாறிச் செல்லாதீர்கள்.
