  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: ta
  text: அவர்கள் பயணம் செய்துகொண்டிருந்தபோது, அவர் ஒரு கிராமத்துக்குள் சென்றார். மார்த்தா என்னும் ஒரு பெண் அவரை வரவேற்றார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வரவேற்றார்” என்ற கிரேக்க வினை, ஒருவரை விருந்தினராக உபசரித்து ஏற்றுக்கொள்வதைக் குறிக்கிறது; “ஏற்றுக்கொண்டார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: அவர்கள் பயணம் செய்துகொண்டிருந்தபோது
  rationale: ἐν + பெயர்ச்சொல் தன்மையுடைய வினையெச்ச அமைப்பு ஒரே நேரத்தில் நடைபெறும் செயலைக் குறிக்கிறது; αὐτούς என்பது இயேசுவை மட்டும் அல்லாமல் பயணித்த குழுவைக் குறிக்கும். δέ-யின் மென்மையான கதைத் தொடர்ச்சி தமிழில் தனியாகச் சொல்லப்படாமல் இயல்பாக வெளிப்படுகிறது.
- source_word: αὐτὸς
  choice: அவர்
  rationale: இந்த வலியுறுத்தப்பட்ட சுட்டுப்பெயர், பயணித்த பலரிலிருந்து இயேசுவைத் தனிப்படுத்துகிறது. சூழலில் “அவர்” என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது; “இயேசு” என்று பெயரைச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கமாகிவிடும்.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: ஒரு கிராமத்துக்குள் சென்றார்
  rationale: κώμη என்பது கிராமத்தைக் குறிக்கிறது; εἰσῆλθεν அதன் உள்ளே சென்றதைக் குறிக்கிறது. τινά தரும் வரையறுக்கப்படாத குறிப்புத்தன்மை தமிழில் இயல்பான “ஒரு” என்பதால் போதுமான அளவு வெளிப்படுகிறது; “ஒரு குறிப்பிட்ட கிராமம்” என்பது தேவையற்ற செயற்கைத்தன்மை கொண்டது.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: மார்த்தா என்னும் பெண் ஒருவர்
  rationale: ὀνόματι என்ற மரபுத்தொடர் தமிழில் “என்னும்” என்று இயல்பாக வருகிறது. τις-ன் வரையறுக்கப்படாத தன்மையை “ஒருவர்” காக்கிறது; δέ புதிய பாத்திரத்தை அறிமுகப்படுத்துவதால் தனி எதிர்மறை இணைப்புச்சொல் தேவையில்லை.
- source_word: ὑπεδέξατο αὐτόν
  choice: அவரை வரவேற்றார்
  rationale: ὑποδέχομαι என்பது ஒருவரை விருந்தினராக ஏற்று உபசரிக்கும் வரவேற்பைக் குறிக்கலாம். “வரவேற்றார்” அந்த விருந்தோம்பல் நயத்தை இயல்பாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத “தன் வீட்டிற்குள்” என்பது சேர்க்கப்படவில்லை.
