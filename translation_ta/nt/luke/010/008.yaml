id: LUK.10.8
reference: Luke 10:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: ta
  text: நீங்கள் எந்த நகரத்திற்குள் சென்றாலும், அங்கே அவர்கள் உங்களை ஏற்றுக்கொண்டால்[a], உங்கள்முன் வைக்கப்படுபவற்றைச் சாப்பிடுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏற்றுக்கொண்டால்” என்பதை “வரவேற்றால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “உங்கள்முன் வைக்கப்படுகிறவற்றை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: எந்த நகரத்திற்குள் சென்றாலும்
  rationale: ἣν ἂν என்பது பொதுவான, வரையறுக்கப்படாத பொருளைத் தருகிறது. ‘எந்த நகரத்திற்குள் ... சென்றாலும்’ என்பது εἰς என்பதன் உள்நோக்கிய நகர்வையும் πόλις என்பதன் இயல்பான பொருளையும் நவீன தமிழில் தெளிவாகக் காக்கிறது.
- source_word: εἰσέρχησθε
  choice: சென்றாலும்
  rationale: ἄν உடன் வரும் நிகழ்காலத் துணைவினை வடிவம் பொதுவான சூழலைக் குறிக்கிறது; தமிழில் ‘சென்றாலும்’ என்பது அந்த மீண்டும் நிகழக்கூடிய நிபந்தனைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δέχωνται ὑμᾶς
  choice: அவர்கள் உங்களை ஏற்றுக்கொண்டால்
  rationale: δέχομαι என்பதற்கு ‘ஏற்றுக்கொள்’ அல்லது ‘வரவேற்று ஏற்றுக்கொள்’ என்ற பொருள் உண்டு. ‘ஏற்றுக்கொண்டால்’ மூலச்சொல்லுடன் நெருக்கமாகவும் சூழலில் இயல்பாகவும் உள்ளது; ‘வரவேற்றால்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐσθίετε
  choice: சாப்பிடுங்கள்
  rationale: இது நிகழ்கால கட்டளை வடிவம். உணவைப் பற்றிய சூழலில் ‘சாப்பிடுங்கள்’ என்பது சாதாரண வாசகர்களுக்கு இயல்பான, மரியாதையான கட்டளையாகும்.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: உங்கள்முன் வைக்கப்படுபவற்றை
  rationale: παρατίθημι என்ற வினையின் செயல்பாட்டு வடிவம், அவர்கள்முன் உணவாக வைக்கப்படுபவற்றைக் குறிக்கிறது. இந்தத் தேர்வு மூலத்தின் பன்மையையும் செயப்பாட்டு அமைப்பையும் காக்கிறது; ‘பரிமாறப்படுவதை’ என்பது சற்றே விளக்கமான மாற்றாக இருக்கும்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நகரம்,’ ‘ஏற்றுக்கொள்,’ ‘சாப்பிடுங்கள்’ ஆகியவை இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் பொதுவான நிபந்தனை உணர்வும் செயப்பாட்டு வடிவமும் காக்கப்பட்டுள்ளன.
