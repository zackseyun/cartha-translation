- issue: ἀντιπαρῆλθεν என்பதில் தவிர்த்துச் செல்லும் நோக்கம்
  choice: மறுபக்கமாக விலகிச் சென்றார்
  alternative: கடந்து சென்றார்
  rationale: கூட்டுவினையின் எதிர்ப்புறமாகக் கடந்துசெல்லும் வலிமையைத் தக்கவைக்கிறது; அதேவேளை அவரது உள்ளார்ந்த நோக்கத்தை வசனம் கூறுவதைக் காட்டிலும் அதிகமாக விவரிக்கவில்லை.
