- source_word: Λευίτης
  choice: ஒரு லேவியர்
  rationale: வரலாற்றுச் சிறப்புடைய யூதக் குழுவின் பெயரை பொதுவான பணிப்பெயராக மாற்றாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தக்கவைக்கிறது.
- source_word: κατὰ τὸν τόπον
  choice: அந்த இடத்துக்கு
  rationale: குறிப்பிட்ட நிகழ்விடம் வந்தடைந்ததை இயல்பான தமிழில் காட்டுகிறது; சொற்றொடரின் இடவியல் நுணுக்கத்திற்கான மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἐλθὼν
  choice: வந்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலைத் தமிழின் இயல்பான வினையெச்ச அமைப்பில் தருகிறது.
- source_word: ἰδὼν
  choice: அவரைக் கண்டபோது
  rationale: சூழலிலிருந்து புரியும் காயமடைந்த மனிதரைப் பிரதிப்பெயரால் குறிப்பிட்டு, பார்த்ததற்குப் பின் நடந்த செயல்வரிசையை வெளிப்படுத்துகிறது.
- source_word: ἀντιπαρῆλθεν
  choice: மறுபக்கமாக விலகிச் சென்றார்
