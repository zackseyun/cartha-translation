  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: ta
  text: அவர் அவனிடம், “நீ சரியாகப் பதிலளித்தாய். இதைச் செய்; நீ வாழ்வாய்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பரந்த சூழல் நித்திய வாழ்வைப் பற்றியது (லூக்கா 10:25 பார்க்கவும்); ஆனால் இங்கே கிரேக்கத்தில் ‘வாழ்வாய்’ என்று மட்டுமே கூறப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: அவர் அவனிடம் … என்றார்
  rationale: εἶπεν என்பது எளிய இறந்தகால ‘சொன்னார்’; δέ இங்கு மென்மையான உரையாடல் இணைப்பாக இருப்பதால் தமிழில் தனிச் சொல்லால் வலுப்படுத்தாமல் இயல்பான வாக்கிய ஓட்டத்தில் தரப்பட்டுள்ளது; αὐτῷ என்பது ‘அவனிடம்’.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: நீ சரியாகப் பதிலளித்தாய்
  rationale: Ὀρθῶς என்பது ‘சரியாக/முறையாக’; ἀπεκρίθης இரண்டாம் நபர் ஒருமை இறந்தகால வினை. நவீனத் தமிழில் ‘சரியாகப் பதிலளித்தாய்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοῦτο ποίει
  choice: இதைச் செய்
  rationale: τοῦτο முன்பு கூறப்பட்ட கட்டளையைச் சுட்டுகிறது. ποίει நிகழ்காலக் கட்டளை வடிவமாக இருந்து தொடர்ச்சியான நடைமுறையையும் அனுமதிக்கிறது; ஆனால் அதைத் தேவையின்றி விரிவாக்காமல் இயல்பான தமிழில் ‘செய்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καὶ ζήσῃ
  choice: நீ வாழ்வாய்
  rationale: ζήσῃ என்பதன் நேரடியான பொருள் ‘நீ வாழ்வாய்’. καί காட்டும் விளைவு அரைப்புள்ளி வழியாக இயல்பாக வெளிப்படுகிறது; மூலத்தில் இல்லாத ‘நித்திய வாழ்வைப் பெறுவாய்’ என்ற விரிவாக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘வாழ்வாய்’ என்பதன் பரப்பு
  choice: நீ வாழ்வாய்
  alternative: நீ நித்திய வாழ்வைப் பெறுவாய்
  rationale: லூக்கா 10:25-ன் விரிந்த சூழல் நித்திய வாழ்வைப் பற்றியது. எனினும் இவ்வசனத்தில் கிரேக்கம் ‘வாழ்வாய்’ என்று மட்டுமே கூறுவதால், அந்தத் தெய்வியல் தொடர்பை அடிக்குறிப்பில் குறிப்பிட்டு, மூலத்தின் சுருக்கத்தையும் பொருள் இழுபறியையும் முதன்மைப் பிரதியில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க இரண்டாம் நபர் ஒருமைக்கு இயல்பான ‘நீ’ வடிவம் தரப்பட்டுள்ளது; மரபுசார்ந்த பிரிவினை மொழி தவிர்க்கப்பட்டுள்ளது.
