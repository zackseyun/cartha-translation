base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: ta
  text: போங்கள்; இதோ, ஓநாய்களின் நடுவில்[a] ஆட்டுக்குட்டிகளைப்[b] போல நான் உங்களை அனுப்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓநாய்களின் நடுவில்” என்பதை “ஓநாய்களிடையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில பழக்கமான மொழிபெயர்ப்புகளில் “ஆடுகள்” என்று இருக்கலாம்; ஆனால் இங்குள்ள கிரேக்கச் சொல் குறிப்பாக “ஆட்டுக்குட்டிகள்” என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπάγετε
  choice: போங்கள்
  rationale: இரண்டாம் நபர் பன்மை கட்டளை வடிவத்தை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἀποστέλλω
  choice: அனுப்புகிறேன்
  rationale: முதலாம் நபர் ஒருமை நிகழ்கால வினையை நேரடியாகத் தருகிறது; சூழலே இது பணிக்காக அனுப்பப்படுவதைக் காட்டுவதால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மை செயப்படுபொருளைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ὡς
  choice: போல
  rationale: இது அடையாளப்படுத்தல் அல்ல, உவமை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἄρνας
  choice: ஆட்டுக்குட்டிகளை
  rationale: ἀρήν என்பதன் பன்மை வடிவம் குறிப்பாக ஆட்டுக்குட்டிகளைக் குறிக்கிறது; பொதுவான ‘ஆடுகள்’ என்று மாற்றாமல் அவற்றின் பாதுகாப்பற்ற தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐν μέσῳ λύκων
  choice: ஓநாய்களின் நடுவில்
  rationale: ‘ஓநாய்களின் மத்தியில்/இடையே’ என்ற பகைமையான சூழல் உருவகத்தை மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
theological_decisions:
- issue: சீடர்களின் பணியை விளக்கும் விலங்கு உவமை
  choice: ‘ஓநாய்களின் நடுவில் ஆட்டுக்குட்டிகளைப் போல’ என்ற உவமையை அப்படியே வைத்தல்
  alternative: ‘ஓநாய்களிடையே ஆடுகளைப் போல’
  rationale: கிரேக்கத்தில் பொதுவான ‘ஆடுகள்’ (πρόβατα) என்பதல்ல, குறிப்பாக ‘ஆட்டுக்குட்டிகள்’ (ἄρνας) என்பதே உள்ளது. ஆகவே சீடர்களின் பாதுகாப்பற்ற நிலையை வலுப்படுத்தும் மூல உருவகத்தைக் காக்கிறது; ஒத்த வேறு வசனங்களோடு ஒத்திசைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘இதோ’ கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘ஆட்டுக்குட்டிகள்’ மூலத்தின் குறிப்பான உருவகத்தைப் பாதுகாக்கிறது.
