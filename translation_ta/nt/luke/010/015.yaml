id: LUK.10.15
reference: Luke 10:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: ta
  text: கப்பர்நகூமே, நீ வானம் வரை உயர்த்தப்படுவாயா? பாதாளம்[a] வரை இறக்கப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தோரின் உலகம் வரை.” கிரேக்கத்தில் ‘ஹாதேஸ்’; ‘கெஹென்னா’ (‘நரகம்’) அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: கிரேக்க இடப்பெயரின் ஒலிப்பைத் தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது; அழைப்புவேற்றுமையில் ‘கப்பர்நகூமே’ என வருகிறது.
- source_word: μὴ ... ὑψωθήσῃ
  choice: உயர்த்தப்படுவாயா?
  rationale: μή உடன் வரும் கேள்வி எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சியாகப் புரிந்துகொள்ளப்படுகிறது. கேள்வி வடிவம் மூலத்தின் வனப்பையும், ὑψόω என்பதின் உயர்நிலைக்கு உயர்த்தப்படுதல் என்ற உருவகத்தையும் காக்கிறது.
- source_word: ἕως οὐρανοῦ
  choice: வானம்வரை
  rationale: ἕως + மரபுவேற்றுமை இங்கு எல்லை அல்லது எட்டும் அளவைக் குறிக்கிறது. ‘வானம்வரை’ என்பது இயல்பான தமிழில் மேல்நோக்கிய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἕως τοῦ ᾅδου
  choice: பாதாளம்வரை
  rationale: ᾅδης என்பது இறந்தோரின் உலகத்தைக் குறிக்கிறது; கெஹென்னா என்ற இறுதித் தண்டனைக்கான சொல்லுடன் இதைக் கலக்காமல் ‘பாதாளம்’ என வழங்கப்படுகிறது.
- source_word: καταβιβασθήσῃ
  choice: இறக்கப்படுவாய்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம், ஒருவர் கீழே செல்லச் செய்யப்படுவதைத் தெரிவிக்கிறது. ‘இறக்கப்படுவாய்’ என்பது செயப்பாட்டு வலிமையையும் ‘உயர்த்தப்படுவாய்’ என்பதுடனான செங்குத்தான எதிர்மறை ஒப்புமையையும் காக்கிறது.
theological_decisions:
- issue: ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: இறந்தோரின் உலகம்; நரகம்
  rationale: ‘பாதாளம்’ என்பது ᾅδης குறிக்கும் இறந்தோரின் உலகத்தைச் சுருக்கமாகக் காட்டி, அதை கெஹென்னா அல்லது பொதுவாக ‘நரகம்’ என்று சொல்லப்படும் கருத்துடன் ஒன்றாக்குவதைத் தவிர்க்கிறது. விளக்க மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: μὴ ... ὑψωθήσῃ என்பதன் வாக்கிய வகை
  choice: எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினா
  alternative: ‘நீ வானம்வரை உயர்த்தப்படமாட்டாய்’ என்ற நேரடி மறுப்பு
  rationale: கிரேக்க நிறுத்தக்குறியும் சொல்லமைப்பும் சொல்லாட்சிமிக்க கேள்வியை ஆதரிக்கின்றன. கேள்வியாகவே வைப்பது மூலத்தின் வலியுறுத்தலையும் உண்மையான இலக்கண நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்புக்கு ‘கப்பர்நகூமே’ என்றும், உயர்வு–இறக்கம் என்ற இணையான உருவகத்தைத் தெளிவாகக் காக்க ‘உயர்த்தப்படுவாயா / இறக்கப்படுவாய்’ என்றும் வழங்கப்பட்டுள்ளது.
