  terminology: ‘கப்பர்நகூம்’ and vocative ‘கப்பர்நகூமே’ are appropriate. ‘பாதாளம்’ may carry broader cultural associations, but the retained explanation ‘ஹாதேஸ்; கெஹென்னா அல்ல’ adequately preserves the Greek lexical distinction without imposing a doctrinal interpretation.
