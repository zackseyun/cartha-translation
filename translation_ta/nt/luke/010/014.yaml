  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: ta
  text: ஆனால் நியாயத்தீர்ப்பில் உங்களுக்குக் கிடைப்பதைவிடத் தீருவுக்கும் சீதோனுக்கும் கிடைப்பது மேலும் தாங்கத்தக்கதாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் பொறுத்துக்கொள்ளத்தக்கதாக இருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய கண்டனத்துடன் வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: தீருவுக்கும் சீதோனுக்கும்
  rationale: ஒப்பீட்டுடன் வரும் மூன்றாம் வேற்றுமைப் பொருளைத் தமிழின் ‘-க்கும்’ வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνεκτότερον
  choice: தாங்கிக்கொள்வது எளிதாக
  rationale: ‘மேலும் தாங்கத்தக்கதாக’ என்ற பொருளை சாதாரண வாசகர்களுக்குத் தெளிவான, இயல்பான தமிழில் தருகிறது; ஒப்பீட்டு வலிமையையும் காக்கிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: எதிர்காலக் காலத்தைக் காட்டும் இயல்பான தமிழ் வினைமுற்று.
- source_word: ἐν τῇ κρίσει
  choice: நியாயத்தீர்ப்பின்போது
  rationale: குறிப்பிட்ட தீர்ப்பைக் குறிக்கும் கிரேக்கச் சொல்லையும் அதன் காலச்சூழலையும் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἢ ὑμῖν
  choice: உங்களைவிட
  rationale: கிரேக்க ஒப்பீட்டுத் தொடரை இயல்பான தமிழில் நேரடியாக நிறைவு செய்கிறது.
theological_decisions:
- issue: கρίσις என்பதன் சூழல்சார் தன்மை
  choice: நியாயத்தீர்ப்பு
  alternative: பொதுவான தீர்ப்பு
  rationale: மனந்திரும்பாத நகரங்களின் நிலையைத் தீரு, சீதோனுடன் இயேசு ஒப்பிடும் சூழல் இறுதி தெய்வீக நியாயத்தீர்ப்பை வலுவாகச் சுட்டுகிறது. இருப்பினும் ‘இறுதி’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. ‘தீரு’, ‘சீதோன்’ ஆகியவை தமிழில் நிலைபெற்ற வேதாகம இடப்பெயர் வடிவங்களாகப் பயன்படுத்தப்பட்டுள்ளன.
