  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: ta
  text: தற்செயலாக, ஆசாரியர் ஒருவர் அந்த வழியில் இறங்கிச் சென்றுகொண்டிருந்தார்; அவர் அவனைக் கண்டதும், சாலையின் மறுபக்கமாகச் சென்று கடந்துபோனார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடந்துபோனார்.’ கிரேக்க வினைச்சொல் மறுபக்கமாகச் சென்று கடப்பதைக் குறிக்கிறது; ஆகவே, வேண்டுமென்றே தவிர்த்துச் சென்றார் என்ற நுட்பமும் இதில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: தற்செயலாக
  rationale: தற்செயலாக அல்லது எதிர்பாராத ஒத்துநிகழ்வாக நடந்ததைச் சுட்டும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது; நிகழ்வின் பின்னால் உள்ள காரணத்தைப் பற்றி தேவையற்ற தத்துவ முடிவைத் திணிக்கவில்லை.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதையை முன்னெடுக்கும் மென்மையான இணைப்புச்சொல். தமிழில் வாக்கிய ஓட்டமே அந்தப் பணியைச் செய்வதால், ‘ஆனால்’ அல்லது ‘இப்போது’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்.
- source_word: ἱερεύς τις
  choice: ஆசாரியர் ஒருவர்
  rationale: τις சுட்டும் பெயர் குறிப்பிடப்படாத தனிநபரை ‘ஒருவர்’ இயல்பாக வெளிப்படுத்துகிறது; ‘ஆசாரியர்’ என்பது ஆலயப் பணியுடன் தொடர்புடைய ἱερεύς என்பதற்கான நிலைபெற்ற, தெளிவான சொல்.
- source_word: κατέβαινεν
  choice: இறங்கிப் போய்க்கொண்டிருந்தார்
  rationale: இறங்கிச் செல்லும் இயக்கத்தையும், பின்னணியில் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டும் imperfect வடிவின் அம்சத்தையும் காக்கிறது.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: அந்த வழியில்
  rationale: ஒரு பாதை அல்லது சாலையூடாகப் பயணிப்பதை நவீனத் தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: ἰδὼν αὐτὸν
  choice: அவர் அவனைக் கண்டதும்
  rationale: காயமடைந்த மனிதனைப் பார்த்ததைத் தொடர்ந்து ஆசாரியரின் செயல் நிகழ்ந்தது என்ற கால உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀντιπαρῆλθεν
  choice: மறுபக்கமாக விலகிக் கடந்துசென்றார்
  rationale: வெறுமனே கடந்துசென்றார் என்பதைக் காட்டிலும், எதிர்ப்பக்கமாகச் சென்று தவிர்த்துக் கடந்தார் என்ற கூட்டுவினையின் நுணுக்கத்தைப் பாதுகாக்கிறது.
