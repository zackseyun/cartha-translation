  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; மற்ற கட்டமைப்புகள் இயல்பான தற்போதைய தமிழ் உரைநடையில் அமைக்கப்பட்டுள்ளன.
