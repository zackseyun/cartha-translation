source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: ta
  text: இருப்பினும், ஆவிகள்[a] உங்களுக்குக் கீழ்ப்படிகின்றன என்பதில் மகிழாதீர்கள்; மாறாக, உங்கள் பெயர்கள் வானங்களில்[b] எழுதப்பட்டிருக்கின்றன என்பதில் மகிழுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு சூழல் பகைமை கொண்ட ஆவிக்குரிய உயிர்களைக் குறிக்கிறது; ‘தீய ஆவிகள்’ அல்லது ‘பேய்கள்’ என்றும் பொருளை விளக்கிக் கூறலாம். ஆனால் கிரேக்கத்தில் ‘ஆவிகள்’ என்றே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: மரபான வழக்கில் ‘வானத்தில்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘வானங்களில்’ எனப் பன்மை உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: இருப்பினும்
  rationale: சீடர்களின் முந்தைய மகிழ்ச்சியைத் திருத்தும் வலுவான எதிர்மறைத் திருப்பத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τούτῳ μὴ χαίρετε ... χαίρετε δὲ
  choice: என்பதில் மகிழாதீர்கள்; மாறாக, ... என்பதில் மகிழுங்கள்
  rationale: χαίρω என்ற ஒரே வினையின் மறுபயன்பாட்டையும் இரு மகிழ்ச்சிக் காரணங்களுக்கிடையிலான சொல்லாட்சிசார் எதிர்மறையையும் காக்கிறது.
- source_word: τὰ πνεύματα
  choice: ஆவிகள்
  rationale: சூழல் பகைமை கொண்ட ஆவிக்குரிய உயிர்களைக் குறித்தாலும், மூலச்சொல் தானாகவே ‘பேய்கள்’ அல்லது ‘தீய ஆவிகள்’ என்று குறிப்பாக்காததால் அதன் பொருள் அகலம் காக்கப்படுகிறது.
- source_word: ὑμῖν ὑποτάσσεται
  choice: உங்களுக்குக் கீழ்ப்படிகின்றன
  rationale: அவை சீடர்களின் அதிகாரத்திற்குக் கட்டுப்படுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: உங்கள் பெயர்கள்
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἐγγέγραπται
  choice: எழுதப்பட்டிருக்கின்றன
  rationale: எழுதப்பட்ட செயலும் அதன் தொடரும் விளைவும் சேர்ந்த கிரேக்க நிறைவுக்காலப் பொருளைத் தமிழில் காக்கிறது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: வானங்களில்
  rationale: மூலத்தில் உள்ள பன்மை வடிவத்தை ஒற்றையாக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: ஆவிகளின் தன்மை
  choice: ஆவிகள்
  alternative: தீய ஆவிகள் / பேய்கள்
  rationale: உடனடி சூழலில் பகைமை கொண்ட ஆவிக்குரிய உயிர்கள் குறிக்கப்பட்டாலும், இவ்வசனத்தின் πνεύματα என்ற சொல் பொதுவானது; ஆகவே முதன்மை உரை தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
- issue: பெயர்கள் எழுதப்பட்டுள்ள இடம்
  choice: வானங்களில்
  alternative: வானத்தில்
  rationale: οὐρανοῖς என்ற பன்மையைப் பாதுகாப்பது மூலமொழியின் வெளிப்பாட்டைத் தட்டையாக்காமல் வைக்கிறது; மரபான தமிழ் வழக்கில் ஒற்றை வடிவமும் சாத்தியம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: எழுதப்பட்டிருப்பதன் காலநிலைப் பொருள்
  choice: எழுதப்பட்டிருக்கின்றன
  alternative: எழுதப்பட்டுள்ளன / எழுதப்பட்டன
  rationale: ἐγγέγραπται என்பதிலுள்ள நிறைவுற்ற செயலும் நிலைத்திருக்கும் விளைவும் இரண்டையும் வெளிப்படுத்துகிறது; அது எப்போது எழுதப்பட்டது அல்லது எந்த முறையில் பதிவு செய்யப்பட்டது என்பதை மொழிபெயர்ப்பு மேலதிகமாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மகிழாதீர்கள் ... மகிழுங்கள்’ என்ற மீளுருவாக்கம் மூலத்தின் சொல்லாட்சிசார் எதிர்மறையைப் பாதுகாக்கிறது. அரைப்புள்ளி இரு கட்டளைகளின் நெருங்கிய தொடர்பையும் தெளிவான திருப்பத்தையும் காட்டுகிறது.
