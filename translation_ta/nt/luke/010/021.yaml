source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: ta
  text: 'அதே நேரத்தில் அவர் பரிசுத்த ஆவியில் பேரானந்தமடைந்து கூறினார்: “தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே, ஞானிகளிடமிருந்தும் விவேகிகளிடமிருந்தும் இவற்றை மறைத்து, சிறு பிள்ளைகளுக்கு வெளிப்படுத்தியதற்காக உம்மைப் போற்றுகிறேன்.[a] ஆம், தந்தையே, இவ்வாறே உமக்குப் பிரியமாயிருந்தது.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உமக்கு நன்றி செலுத்துகிறேன்” என்றும் மொழிபெயர்க்கலாம். ஜெபச் சூழலில் கிரேக்க வினைச்சொல் போற்றுதலையும் நன்றி செலுத்துதலையும் வெளிப்படுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “இதுவே உமது நல்விருப்பமாயிருந்தது” அல்லது “இவ்வாறு உமது பார்வையில் நல்விருப்பம் உண்டாயிற்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: அதே வேளையில்
  rationale: வலியுறுத்தப்பட்ட காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἠγαλλιάσατο
  choice: மிகுந்த மகிழ்ச்சியடைந்து
  rationale: வினைச்சொல் குறிக்கும் தீவிரமான மகிழ்ச்சியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: உருபுகளுடன் உள்ள கிரேக்கச் சொற்றொடர் பரிசுத்த ஆவியைக் குறிப்பிடுகிறது; வேற்றுமையின் செயற்படுத்தும் கருவி அல்லது அனுபவத் தளம் என்ற நுணுக்கத்தை தீர்மானிக்காமல் ‘ஆவியில்’ காக்கிறது.
- source_word: Ἐξομολογοῦμαί σοι
  choice: உம்மைப் போற்றுகிறேன்
  rationale: ஜெபச் சூழலில் இவ்வினைச்சொல் புகழ்தல் அல்லது நன்றி செலுத்துதல் என்னும் பொருள்களைத் தரலாம்; ‘போற்றுகிறேன்’ புகழ்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே
  rationale: இரண்டு அழைப்புப் பெயர்களையும் காத்து, κύριος என்பதைக் கடவுளின் ஆட்சியை உணர்த்தும் ‘ஆண்டவர்’ என வழங்குகிறது.
- source_word: σοφῶν καὶ συνετῶν
  choice: ஞானிகளிடமிருந்தும் அறிவுள்ளவர்களிடமிருந்தும்
  rationale: ஞானமும் புரிந்துணர்வும் கொண்டவர்களைக் குறிக்கும் இணைச்சொற்களின் வேறுபாட்டைக் காக்கிறது; கல்வித்தகுதியை தேவையின்றி உட்புகுத்தவில்லை.
- source_word: ἀπεκάλυψας
  choice: வெளிப்படுத்தியதற்காக
  rationale: ‘மறைத்தல்’ என்பதுடன் உள்ள நேரடியான எதிர்மறை இணைப்பையும் வெளிப்பாட்டின் வலிமையையும் காக்கிறது.
- source_word: νηπίοις
  choice: சிறு பிள்ளைகளுக்கு
  rationale: நேரடியாக ‘குழந்தைகள்/கைக்குழந்தைகள்’ எனும் உருவகத்தை வாசிக்க இயல்பான தமிழில் காக்கிறது.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: இவ்வாறு செய்வது உமது பார்வையில் உகந்ததாயிருந்தது
  rationale: εὐδοκία-வின் உகந்த தன்மை/நற்பிரியம் மற்றும் ἔμπροσθέν σου-வின் ‘உமது பார்வையில்’ என்ற மொழியமைப்பைக் காக்கிறது; இதை ‘சித்தம்’ என்று மட்டும் விளக்கித் தீர்மானிப்பதில்லை.
theological_decisions:
- issue: τῷ πνεύματι τῷ ἁγίῳ என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியில்
  alternative: தமது ஆவியில்; பரிசுத்த ஆவியினால்
  rationale: உருபுடன் வரும் πνεῦμα ἅγιον பரிசுத்த ஆவியைக் குறிப்பதை வலுவாக ஆதரிக்கிறது. ‘ஆவியில்’ என்பது அனுபவத் தளமா கருவியா என்ற வேற்றுமை நுணுக்கத்தைத் திறந்தவாறு வைக்கிறது.
- issue: தந்தையை நோக்கிய κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: எஜமானரே; ஆளுநரே
  rationale: தெய்வீக ஆட்சியையும் உயர்ந்த ஜெப மொழிநடையையும் இயல்பான தமிழில் தருகிறது; பிரிவுசார் தனிச்சிறப்பைச் சேர்ப்பதில்லை.
- issue: οὕτως εὐδοκία ἐγένετο என்பதன் பொருள்
  choice: இவ்வாறு செய்வது உமது பார்வையில் உகந்ததாயிருந்தது
  alternative: இதுவே உமது நல்விருப்பமாயிருந்தது; இவ்வாறே உமக்குப் பிரியமாயிருந்தது
  rationale: இறைவனுடைய நற்பிரியம், அங்கீகாரம் அல்லது சித்தம் என்ற பொருள் பரப்பை அளவுக்கு மீறி ஒரே கோட்பாட்டுச் சொல்லாகச் சுருக்காமல், கிரேக்க வடிவிற்கு நெருக்கமாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஜெப மொழிநடையுடன் வடிவமைக்கப்பட்டது. ‘தந்தையே’, ‘உம்மை’, ‘உமது’ ஆகியவை உயரிய நேரடி அழைப்பை இயல்பாகக் காக்கின்றன. νηπίοις என்பதன் உருவகப் பொருளை முதன்மை உரையில் விளக்கமாக மாற்றாமல் ‘சிறு பிள்ளைகள்’ எனவே வைத்துள்ளது.
