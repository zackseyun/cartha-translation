revisions:
- from: 'அதே வேளையில் அவர் பரிசுத்த ஆவியில் மிகுந்த மகிழ்ச்சியடைந்து கூறினார்: “தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே, ஞானிகளிடமிருந்தும் அறிவுள்ளவர்களிடமிருந்தும் இவற்றை மறைத்து, சிறு பிள்ளைகளுக்கு வெளிப்படுத்தியதற்காக உம்மைப் போற்றுகிறேன்.[a] ஆம், தந்தையே, இவ்வாறு செய்வது உமது பார்வையில் உகந்ததாயிருந்தது.[b]”'
  to: 'அதே நேரத்தில் அவர் பரிசுத்த ஆவியில் பேரானந்தமடைந்து கூறினார்: “தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே, ஞானிகளிடமிருந்தும் விவேகிகளிடமிருந்தும் இவற்றை மறைத்து, சிறு பிள்ளைகளுக்கு வெளிப்படுத்தியதற்காக உம்மைப் போற்றுகிறேன்.[a] ஆம், தந்தையே, இவ்வாறே உமக்குப் பிரியமாயிருந்தது.[b]”'
  rationale: இறுதி வாக்கியத்தில் மூலத்தில் இல்லாத “செய்வது” நீக்கப்பட்டுள்ளது. εὐδοκία-வின் நற்பிரியம்/நல்விருப்பம் என்ற பொருள் “உமக்குப் பிரியமாயிருந்தது” எனத் தரப்பட்டுள்ளது; மாற்று வாசிப்புக் குறிப்பு ‘உமது பார்வையில்’ மற்றும் ‘நல்விருப்பம்’ என்ற நுணுக்கங்களையும் காக்கிறது. மற்ற மாற்றங்கள் மூலத்தின் வலிமையையும் நவீனத் தமிழ் இயல்பையும் மேம்படுத்தும் சிறிய சொல் தேர்வுகள் மட்டுமே.
