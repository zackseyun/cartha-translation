source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: ta
  text: அங்கே சமாதானத்தின் மகன் ஒருவர் இருந்தால்[a], உங்கள் சமாதானம் அவன்மேல் வந்து தங்கும்; இல்லையென்றால், அது உங்கள்மேல் திரும்பிவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமாதானத்துக்குரிய ஒருவர்’—அதாவது, சமாதானத்தைக் கொண்டுவரும் செய்தியை ஏற்றுக்கொள்ளும் ஒருவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: சமாதானத்தின் மகன்
  rationale: ‘சமாதானத்தின் மகன்’ என்ற செமித்தியப் பாணியிலான சொற்றொடர், சமாதானத்தால் பண்புபெற்ற அல்லது சமாதானச் செய்தியை ஏற்றுக்கொள்ளும் ஒருவரைக் குறிக்கிறது. மூலத்தின் உருவகத்தையும் ஆண்பால் ஒருமையையும் முதன்மை உரை தக்கவைக்கிறது; இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπαναπαήσεται
  choice: தங்கும்
  rationale: ஒருவர்மேல் வந்து இளைப்பாறுதல் அல்லது நிலைத்திருத்தல் என்ற உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: உங்கள் சமாதானம்
  rationale: சீடர்கள் கூறும் சமாதான வாழ்த்து அல்லது ஆசீர்வாதத்தை மிகையாக விளக்காமல், கிரேக்க உரையின் நேரடியான உடைமை அமைப்பைத் தக்கவைக்கிறது.
- source_word: εἰ δὲ μήγε
  choice: இல்லாவிட்டால்
  rationale: வலியுறுத்தப்பட்ட எதிர்மறை நிபந்தனையை நவீன தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: ἀνακάμψει
  choice: திரும்பிவரும்
  rationale: தங்க இடம் பெறாத சமாதானம் அனுப்பியவர்களிடமே மீண்டும் வருவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்களிடமே
  rationale: ‘திரும்பிவரும்’ என்பதோடு இயல்பாக இணைவதுடன், மீண்டும் சீடர்களிடமே வருதல் என்ற இலக்கையும் ‘-ஏ’ மூலம் வலியுறுத்துகிறது.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: அங்கே ... இருந்தால்
  rationale: இடத்தைக் குறிக்கும் ἐκεῖ என்பதையும் நிபந்தனை அமைப்பையும் தெளிவாகப் பாதுகாக்கிறது; தமிழில் வசனத் தொடக்கத்தில் ‘மற்றும்’ சேர்ப்பது இயல்பற்றதால் καί தனியாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: υἱὸς εἰρήνης என்ற ஆண்பால் உருவகத்தைப் பாலினப் பொதுமையாக்க வேண்டுமா
  choice: முதன்மை உரையில் ‘சமாதானத்தின் மகன்’ என்று தக்கவைத்தல்
  alternative: ‘சமாதானத்தை ஏற்றுக்கொள்ளும் ஒருவர்’ அல்லது ‘சமாதானத்துக்குரிய ஒருவர்’
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமையும் ‘மகன்’ என்ற செமித்திய உருவகமும் உள்ளன. அதை முதன்மை உரையில் தக்கவைத்து, அதன் இயல்பான பொருளை அடிக்குறிப்பில் விளக்குவது மூலத்தின் தனித்தன்மையையும் பொருள் தெளிவையும் ஒருங்கிணைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சமாதானம்’ என்ற வேதாகமப் பயன்பாடு வாழ்த்து, ஆசீர்வாதம், நலநிலை ஆகிய அர்த்தத் தளங்களைத் திறந்தவாறே வைக்கிறது.
