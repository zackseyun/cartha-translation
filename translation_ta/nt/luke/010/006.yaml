revisions:
- from: அங்கே சமாதானத்தின் மகன் ஒருவன் இருந்தால்[a], உங்கள் சமாதானம் அவன்மேல் தங்கும்; இல்லாவிட்டால், அது உங்களிடமே திரும்பிவரும்.
  to: அங்கே சமாதானத்தின் மகன் ஒருவர் இருந்தால்[a], உங்கள் சமாதானம் அவன்மேல் வந்து தங்கும்; இல்லையென்றால், அது உங்கள்மேல் திரும்பிவரும்.
  rationale: The revision preserves the Greek masculine singular idiom and the ambiguity of ‘son of peace,’ while smoothing the Tamil indefinite expression. It also restores the source’s balanced ‘upon him/upon you’ imagery and makes the resting action more explicit without adding interpretive content.
