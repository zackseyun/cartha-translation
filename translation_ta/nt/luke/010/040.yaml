source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: ta
  text: ஆனால் மார்த்தா மிகுந்த பணிவிடை செய்வதில் கவனம் சிதறிப்போயிருந்தாள். அவள் அருகில் வந்து, “ஆண்டவரே, என் சகோதரி என்னைத் தனியாகப் பணிவிடை செய்ய விட்டுவிட்டதைப் பற்றி உங்களுக்கு அக்கறையில்லையா?[a] ஆகவே, எனக்கு உதவும்படி அவளிடம் சொல்லுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதரி என்னைத் தனியாகப் பணிவிடை செய்ய விட்டுவிட்டது உங்களுக்கு ஒரு பொருட்டல்லவா?”
    reason: οὐ μέλει σοι என்பதன் ‘உங்களுக்கு ஒரு பொருட்டல்லவா?’ என்ற நுணுக்கத்தை, மூலத்தில் உள்ள முழுக் கேள்வியோடு சேர்த்துத் தருகிறது.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: கவனம் சிதறிப்போயிருந்தாள்
  rationale: இந்த முற்றுப்பெறா வினை வடிவம், பல திசைகளில் இழுக்கப்பட்டதுபோல் தொடர்ந்த கவனச்சிதறல் நிலையில் இருந்ததைச் சுட்டுகிறது. சூழலில் மரியாளின் கவனத்துடன் உள்ள வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περὶ πολλὴν διακονίαν
  choice: மிகுந்த பணிவிடை செய்வதில்
  rationale: இங்கு διακονία என்பது முறையான சமய ஊழியத்தை அல்ல, விருந்தோம்பல் சார்ந்த நடைமுறைப் பணிவிடையை குறிக்கிறது. கிரேக்கத்தின் பரந்த பொருளைத் தேவையின்றி ‘பல ஆயத்தங்கள்’ என்று குறுக்காமல் வைத்திருக்கிறது.
- source_word: ἐπιστᾶσα
  choice: அருகில் வந்து
  rationale: பேசுவதற்கு முன் அவள் அணுகி வந்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை மரியாதையுடன் அழைக்கும் κύριος என்பதற்கான நிலையான தமிழ் மொழிபெயர்ப்பு; லூக்காவின் விரிவான பயன்பாட்டுடனும் ஒத்துள்ளது.
- source_word: οὐ μέλει σοι
  choice: உங்களுக்கு அக்கறையில்லையா?
  rationale: இது ஒரு காரியம் அவருடைய கவனத்திற்கும் அக்கறைக்கும் உரியதல்லவா என்று கேட்கும் மரபுத்தொடர். மார்த்தாவின் குறைசொல்லும் தொனியை இயல்பாகப் பாதுகாக்கிறது.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: என்னைத் தனியாகப் பணிவிடை செய்ய விட்டுவிட்டதை
  rationale: μόνην என்பதன் ‘தனியாக’ என்ற பொருளையும், διακονεῖν என்ற நிறைவு வினையின் பணிவிடைச் செயலையும் தெளிவாகக் கொண்டுவருகிறது; ‘கைவிட்டாள்’ என்ற மிகுதியான உணர்வைத் தவிர்க்கிறது.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: ஆகவே, ... அவளிடம் சொல்லுங்கள்
  rationale: கட்டளைத் தன்மையையும் οὖν என்பதன் முடிவுரைக்கும் தொடர்பையும் நவீன மரியாதை நடையில் வெளிப்படுத்துகிறது.
- source_word: συναντιλάβηται
  choice: எனக்கு உதவும்படி
  rationale: தன்னுடன் சேர்ந்து உதவ வேண்டும் என்ற கூட்டு உதவியின் பொருள் சூழலால் தெளிவாக இருப்பதால், சுருக்கமான இயல்பான தமிழ் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவிடம் மார்த்தா பயன்படுத்தும் κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: போதகரே / தலைவரே
  rationale: ‘ஆண்டவரே’ என்பது மரியாதையான நேரடி அழைப்பையும் லூக்கா நூலில் இயேசுவுக்குப் பயன்படுத்தப்படும் பரந்த இறையியல் ஒலியையும் பாதுகாக்கிறது; இவ்வசனம் அந்த ஒலியைத் தனியாகச் சுருக்கவோ மிகைப்படுத்தவோ வேண்டியதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிவிடை’ என்பது வீட்டு விருந்தோம்பல் சார்ந்த சேவையைக் குறிக்கிறது; முறையான திருச்சபை ஊழியம் என்ற கருத்து இங்கு திணிக்கப்படவில்லை. இயேசுவிடம் பேசும் இடத்தில் மரியாதைப் பன்மை வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
