source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: ta
  text: 'அவர் தம் சீடர்களை நோக்கித் திரும்பி, தனிமையில்[a] அவர்களிடம் சொன்னார்: “நீங்கள் காண்பவற்றைக் காணும் கண்கள் பாக்கியமுள்ளவை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்றவர்களின்றி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: நோக்கித் திரும்பி
  rationale: பேசுவதற்கு முன் அவர் சீடர்களின் பக்கம் திரும்பிய செயலை இயல்பான தமிழில் வினையெச்சத் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: மற்றவர்களிடமிருந்து தனிப்பட்ட விதத்தில் சீடர்களிடம் கூறியதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μαθητάς
  choice: சீடர்கள்
  rationale: μαθητής என்பதன் கற்றுக்கொள்பவர் மற்றும் பின்பற்றுபவர் என்ற உறவுசார் பொருளைப் பாதுகாக்கும் வழக்கமான புதிய ஏற்பாட்டுச் சொல்.
- source_word: Μακάριοι
  choice: பாக்கியமுள்ளவை
  rationale: வெறும் மனமகிழ்ச்சியை அல்லாமல், இறை அருளால் கிடைக்கும் நற்பேற்றை அறிவிக்கும் வாழ்த்துரையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ὀφθαλμοὶ
  choice: கண்கள்
  rationale: காணும் வாய்ப்பு பெற்றவர்களைக் குறிக்கும் கிரேக்க உருவகத்தை விளக்கமாக விரிவுபடுத்தாமல் அப்படியே பாதுகாக்கிறது.
- source_word: οἱ βλέποντες
  choice: காணும்
  rationale: கண்களை விவரிக்கும் நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான விளக்கத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: ἃ βλέπετε
  choice: நீங்கள் காண்பவற்றை
  rationale: சீடர்கள் காண்கிற காரியங்களை நேரடியாகக் குறிக்கும் சார்புப்பெயர் மற்றும் நிகழ்கால வினையின் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வாழ்த்துரையின் வலிமை
  choice: இயேசுவின் செயல்களையும் வெளிப்பாட்டையும் காணும் சீடர்களின் சிறப்பான வாய்ப்பை நற்பேறு என அறிவித்தல்
  alternative: வெறும் உணர்ச்சிசார் மகிழ்ச்சியைத் தெரிவித்தல்
  rationale: μακάριοι என்பது இங்கு வெறும் மனநிலையைச் சொல்லாமல், இறை அருளால் பெற்ற நற்பேற்றை அறிவிக்கும் வாழ்த்துரை; “பாக்கியமுள்ளவை” அந்த இறையியல் நிறையை மேலதிக விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் கண்கள் குறித்த உருவகம் அப்படியே வைக்கப்பட்டுள்ளது; உட்கருத்தை உரைக்குள் விரிவுபடுத்தவில்லை.
