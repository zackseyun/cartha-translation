revisions:
- from: அப்போது இதோ, திருச்சட்ட அறிஞர் ஒருவர்[a] எழுந்து, அவரைச் சோதிப்பதற்காக, “போதகரே, நித்திய வாழ்வை வாரிசுரிமையாகப் பெற நான் என்ன செய்ய வேண்டும்?” என்று கேட்டார்.
  to: மேலும், இதோ, திருச்சட்ட அறிஞர் ஒருவர் எழுந்து, அவரைச் சோதித்துப் பார்க்கும் நோக்கில், “ஆசிரியரே, நித்திய வாழ்வை வாரிசுரிமையாகப் பெற நான் என்ன செய்ய வேண்டும்?” என்று கேட்டார்.
  rationale: The revision replaces the potentially anachronistic «போதகரே» with «ஆசிரியரே», retains the legal/Torah context of νομικός, and adjusts the opening connective and testing phrase for closer fidelity to Καὶ ἰδοὺ and ἐκπειράζων αὐτόν. It preserves the questioner's action-and-inheritance formulation without resolving its theological tension. The existing lexical footnote remains accurate and properly anchored.
  reviewer_model: gpt-5.6-terra
