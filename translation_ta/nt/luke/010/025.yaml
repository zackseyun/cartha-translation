id: LUK.10.25
reference: Luke 10:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: ta
  text: மேலும், இதோ, திருச்சட்ட அறிஞர் ஒருவர் எழுந்து, அவரைச் சோதித்துப் பார்க்கும் நோக்கில், “ஆசிரியரே, நித்திய வாழ்வை வாரிசுரிமையாகப் பெற நான் என்ன செய்ய வேண்டும்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: அப்போது இதோ
  rationale: ἰδού என்பதன் கவனத்தை ஈர்க்கும் கதைசொல்லல் வலிமையை விடாமல், நவீன தமிழில் புரியுமாறு தருகிறது.
- source_word: νομικός τις
  choice: திருச்சட்ட அறிஞர் ஒருவர்
  rationale: இச்சொல் நவீன நீதிமன்ற வழக்கறிஞரை அல்ல, மோசேயின் திருச்சட்டத்தில் தேர்ச்சி பெற்ற ஒருவரைக் குறிக்கிறது; தமிழில் அந்தச் சூழலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνέστη
  choice: எழுந்து
  rationale: கிரேக்க வினையின் எளிய நிகழ்வுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκπειράζων αὐτὸν
  choice: அவரைச் சோதிப்பதற்காக
  rationale: ἐκπειράζω என்பதிலுள்ள பரிசோதித்துப் பார்க்கும் அல்லது சிக்கவைக்கும் நோக்கைத் தெரிவிக்கிறது; பாவத்துக்கு இழுக்கும் ‘சோதனை’ என்று தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை மரியாதையுடன் நேரடியாக அழைக்கும் சொல்லாக, சமகாலத் தமிழில் இயல்பாக உள்ளது.
- source_word: τί ποιήσας
  choice: நான் என்ன செய்ய வேண்டும்
  rationale: இறுதி வினையோடு சேர்ந்த இறந்தகாலப் பங்கேற்புச் சொல்லின் வழிமுறை அல்லது முன்நிபந்தனைப் பொருளை இயல்பான தமிழ் கேள்வியாக மாற்றுகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: காலவரம்பற்ற வாழ்வைக் குறிக்கும் நிலையான, தெளிவான தமிழ் மொழிபெயர்ப்பு.
- source_word: κληρονομήσω
  choice: வாரிசுரிமையாகப் பெற
  rationale: வெறுமனே ‘பெற’ என்று தட்டையாக்காமல், κληρονομέω என்பதிலுள்ள வாரிசுரிமை உருவகத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இரண்டாம் ஆலயக் கால யூதச் சூழலில் νομικός என்பதன் பொருள்
  choice: மோசேயின் திருச்சட்டத்தில் தேர்ச்சி பெற்றவரைக் குறிக்கும் ‘திருச்சட்ட அறிஞர்’
  alternative: வழக்கறிஞர்
  rationale: ‘வழக்கறிஞர்’ என்பது நவீன குடிமை அல்லது நீதிமன்றத் தொழிலைத் தவறாக நினைவூட்டலாம்; மூலச் சூழலை ‘திருச்சட்ட அறிஞர்’ துல்லியமாகக் காட்டுகிறது.
- issue: τί ποιήσας ... κληρονομήσω என்பதிலுள்ள செயலும் வாரிசுரிமையும் இடையிலான பதற்றம்
  choice: “வாரிசுரிமையாகப் பெற நான் என்ன செய்ய வேண்டும்?”
  alternative: “நித்திய வாழ்வை நான் எப்படிப் பெறுவேன்?”
  rationale: கேள்வியாளர் செயலை முன்நிபந்தனையாக அமைப்பதையும், அதேவேளையில் ‘வாரிசுரிமை’ உருவகத்தையும் பாதுகாக்கிறது; இவ்விரண்டிற்கிடையிலான இறையியல் பதற்றத்தை விளக்கி நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘திருச்சட்ட அறிஞர்’ நவீன வழக்கறிஞர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது; ‘வாரிசுரிமையாகப் பெற’ மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
