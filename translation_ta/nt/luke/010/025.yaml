review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the legal expert, his standing up, his testing intent, the question's action-oriented form, eternal life, and the inheritance metaphor. However, «போதகரே» normally denotes a Christian pastor in contemporary Tamil and does not suitably render Διδάσκαλε here. «அப்போது» can impose a temporal connection not explicitly expressed by Καὶ; a simple connective better preserves the Greek narrative marker.
  naturalness: The sentence is clear and fluent in modern standard Tamil. Recasting the testing participle as «சோதித்துப் பார்க்கும் நோக்கில்» is natural and retains the probing intent without implying temptation to sin.
  terminology: «திருச்சட்ட அறிஞர்» appropriately identifies a specialist in Mosaic/Torah law rather than a modern attorney. «ஆசிரியரே» is the natural, contextually neutral equivalent of Διδάσκαλε; «போதகரே» risks an anachronistic ecclesial meaning. «நித்திய வாழ்வு» and «வாரிசுரிமையாகப் பெறுதல்» preserve the established theological expression and the Greek inheritance metaphor.
  issues:
  - severity: medium
    issue: «போதகரே» for Διδάσκαλε
    rationale: In modern Tamil, «போதகர்» commonly means a Christian pastor/preacher. The speaker addresses Jesus as a teacher, so «ஆசிரியரே» is more accurate and avoids importing a later ecclesial office.
  - severity: low
    issue: «அப்போது» for Καὶ ἰδοὺ
    rationale: «அப்போது» adds a specific temporal sense. «மேலும், இதோ» retains both the connective and the attention-directing narrative force without unnecessarily specifying timing.
  revised_text: மேலும், இதோ, திருச்சட்ட அறிஞர் ஒருவர் எழுந்து, அவரைச் சோதித்துப் பார்க்கும் நோக்கில், “ஆசிரியரே, நித்திய வாழ்வை வாரிசுரிமையாகப் பெற நான் என்ன செய்ய வேண்டும்?” என்று கேட்டார்.
