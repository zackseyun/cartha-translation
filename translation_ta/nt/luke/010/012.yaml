  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: ta
  text: 'நான் உங்களுக்குச் சொல்கிறேன்: அந்த நாளில் அந்த நகரத்தைவிடச் சோதோமின் மக்களுக்கு அதிகம் தாங்கத்தக்கதாக இருக்கும்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகம் தாங்கத்தக்கதாக’ என்பதற்கு ‘அதிகம் பொறுத்துக்கொள்ளத்தக்கதாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த நாள்’ என்பது இறைவனின் நியாயத்தீர்ப்பு நாளைக் குறிக்கிறது; சில இணை வசனங்கள் இதை வெளிப்படையாகக் கூறுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான, வலியுறுத்தலுள்ள நிகழ்காலக் கூற்றை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Σοδόμοις
  choice: சோதோமுக்கு
  rationale: கிரேக்கப் பன்மைத் தரவுவேற்றுமை வடிவம் சோதோமின் மக்களை இடப்பெயரால் கூட்டாகக் குறிக்கிறது; தமிழிலும் இடப்பெயரை இவ்வாறு பயன்படுத்துவது பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: அந்த நாளில்
  rationale: மூலத்தின் காலக் குறிப்பை அப்படியே காக்கிறது; முதன்மை உரையில் ‘நியாயத்தீர்ப்பு நாள்’ என்று வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἀνεκτότερον
  choice: தாங்கிக்கொள்வது எளிதாக
  rationale: ‘மேலும் தாங்கத்தக்கது’ என்ற ஒப்பீட்டுப் பொருளை சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: எதிர்கால வினையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: அந்த நகரத்தைவிட
  rationale: ஒப்பீட்டையும் முந்தைய சூழலில் குறிப்பிடப்பட்ட நகரத்திற்கான சுட்டையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அந்த நாள்’ என்பதன் தன்மை
  choice: முதன்மை உரையில் ‘அந்த நாளில்’ என்றே வைத்தல்
  alternative: ‘நியாயத்தீர்ப்பு நாளில்’ என்று விரித்துரைத்தல்
  rationale: சூழலும் இணை வசனங்களும் இறை நியாயத்தீர்ப்பைக் குறித்தாலும், இந்த வசனத்தின் கிரேக்க உரை ‘அந்த நாளில்’ என்றே கூறுகிறது; ஆகவே விளக்கத்தை அடிக்குறிப்பில் தருவது மூலத்தின் மறைமுகத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியும் அதேவேளை கண்ணியமான நடை. ஒப்பீட்டு வாக்கியத்தைத் தமிழில் இயல்பாக்க ‘சோதோமுக்குத் தாங்கிக்கொள்வது எளிதாக இருக்கும்’ என அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
