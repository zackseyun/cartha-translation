source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “அறுவடை மிகுதி; வேலையாட்களோ குறைவு. ஆகவே, அறுவடையின் ஆண்டவரிடம், தமது அறுவடைக்குள் வேலையாட்களை அனுப்பும்படி[a] மன்றாடுங்கள்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலுவாக அனுப்பும்படி.” ‘அனுப்பு’ என்று மட்டும் சொல்வதைவிடக் கிரேக்க வினை வலிமையான பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: கூறினார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை என்றாலும், கதைநடையில் தமிழில் இயல்பாக வரும் எளிய இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: δὲ
  choice: இணைப்புச் சொல்லாகத் தனியே வெளிப்படுத்தப்படவில்லை
  rationale: இது கதைநடையைத் தொடரும் மென்மையான இணைப்பு; தமிழில் வாக்கியத் தொடர்ச்சியே அதன் பணியை இயல்பாகச் செய்கிறது.
- source_word: θερισμὸς πολύς
  choice: அறுவடை மிகுதி
  rationale: வேளாண்மை உருவகத்தை நெருக்கமாகப் பாதுகாத்து, அறுவடையின் பெருமளவைக் குறுகிய இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐργάται ὀλίγοι
  choice: வேலையாட்களோ குறைவு
  rationale: ἐργάται என்பதன் பொதுவான வேலைசெய்பவர்கள் என்ற பொருளைப் பாதுகாக்கிறது; ‘-ஓ’ மிகுதியும் குறைவும் இடையிலான முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: δεήθητε
  choice: மன்றாடுங்கள்
  rationale: சாதாரணமாகக் கேட்பதைவிட உள்ளார்ந்த, தீவிரமான வேண்டுதலைக் குறிக்கும் கட்டளை வலிமையை வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவையும் கட்டளையின் காரணத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: அறுவடையின் ஆண்டவர்
  rationale: κύριος என்பதின் அதிகாரத்தையும் இறையியல் ஒலிப்பையும் தக்கவைத்து, மூலத்தின் உருவகத் தலைப்பை விளக்கிச் சுருக்காமல் வழங்குகிறது.
- source_word: ἐργάτας ἐκβάλῃ
  choice: வேலையாட்களை அனுப்பும்படி[a]
  rationale: சூழலில் இயல்பான அனுப்புதல் என்ற பொருளை முதன்மை உரையில் தருகிறது; ἐκβάλλω வினையின் வலிமையான சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: தமது அறுவடைக்கு
  rationale: அறுவடை அவருக்குரியது என்ற உடைமைப் பொருளைப் பாதுகாக்கிறது; தமிழில் பணிக்காக அனுப்புவதை இயல்பாகக் குறிக்க ‘-க்கு’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அறுவடையின் ஆண்டவர்’ என்பவர் யார் என்பதும் அந்தத் தலைப்பின் இறையியல் வலிமையும்
  choice: ‘அறுவடையின் ஆண்டவர்’ என்ற உருவகத் தலைப்பு விளக்கமின்றித் தக்கவைக்கப்பட்டுள்ளது.
  alternative: அறுவடைக்குச் சொந்தக்காரரும் ஊழியத்தை நடத்துபவருமான கடவுள் என்று உரையிலேயே வெளிப்படுத்துதல்
  rationale: அறுவடைக்குச் சொந்தக்காரராகவும் வேலையாட்களை அனுப்புபவராகவும் ஓர் இறை அதிகாரத்தை வசனம் காட்டுகிறது; ஆனால் இங்கு அதன் கிறிஸ்துவியல் உட்பொருளையோ குறிப்பிட்ட அடையாளத்தையோ விரித்துரைக்கவில்லை. ஆகவே மூலத்தின் இறையியல் இடைவெளி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மன்றாடுங்கள்’ வேண்டுதலின் தீவிரத்தையும், ‘அறுவடையின் ஆண்டவர்’ மூலத்தின் உருவகத்தையும் இறையியல் திறந்தநிலையையும் தக்கவைக்கின்றன.
