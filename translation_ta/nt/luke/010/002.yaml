  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் பெரும்பாலும் தக்கவைக்கப்பட்டுள்ளது: அறுவடையின் மிகுதியும் வேலையாட்களின் குறைவும், அறுவடையின் ஆண்டவரிடம் வேண்டுமாறு கூறும் கட்டளையும் இடம்பெறுகின்றன. ஆனால் «தமது அறுவடைக்கு» என்பது εἰς («உள்ளே/நோக்கி») என்பதன் இடநோக்கை ஓரளவு தளர்த்தி, ‘அறுவடைக்காக’ என்ற பொருளுக்கு நகரக்கூடும். «தமது அறுவடைக்குள்» என்பது மூலத்தின் திசையையும் உடைமைப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.'
  naturalness: «அறுவடையின் ஆண்டவர் ... அவரிடம்» என்ற சொல் வரிசை சற்றே தாமதமாக வந்து, வாசிப்பில் ஒரு கண நேரத் தெளிவின்மையை உண்டாக்குகிறது. «அறுவடையின் ஆண்டவரிடம், ... மன்றாடுங்கள்» என்ற வரிசை நவீனத் தரத் தமிழில் நேரடியாகவும் இயல்பாகவும் உள்ளது. «வேலையாட்கள்» இச்சூழலில் அறுவடைப் பணியாளர்களைக் குறிக்க இயலும்.
