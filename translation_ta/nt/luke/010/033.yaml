reference: Luke 10:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: ta
  text: ஆனால், பயணம் செய்துகொண்டிருந்த ஒரு சமாரியர் அவன் இருந்த இடத்திற்கு வந்தார்; அவனைப் பார்த்ததும், அவருக்கு அவன்மேல் இரக்கம் உண்டாயிற்று.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர் மனம் உருகினார்.”'
    reason: ἐσπλαγχνίσθη என்பதன் உணர்ச்சி வலிமையை வெளிப்படுத்தும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: Σαμαρίτης
  choice: ஒரு சமாரியர்
  rationale: சமாரிய இன-சமய அடையாளத்தைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ்ச் சொல்; உவமையில் உள்ள சமூக முரண்பாட்டையும் காக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய ஆசாரியர் மற்றும் லேவியரின் செயல்களுடன் காணப்படும் முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τις
  choice: ஒரு
  rationale: பெயரைக் குறிப்பிடாத ஒருவரைக் குறிக்கும் கிரேக்கச் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ὁδεύων
  choice: பயணம் செய்துகொண்டிருந்த
  rationale: பின்னணியில் தொடர்ந்துகொண்டிருந்த பயணச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: அவன் இருந்த இடத்திற்கு வந்தார்
  rationale: காயமடைந்தவன் இருந்த இடத்தை நோக்கி அவர் வந்தார் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது; ‘அவன்மேல் வந்தார்’ என்ற இயல்பற்ற சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: ἰδών
  choice: அவனைப் பார்த்ததும்
  rationale: பார்த்ததற்குப் பின் ஏற்பட்ட உடனடியான உள்ளுணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐσπλαγχνίσθη
  choice: பரிவால் மனம் உருகினார்
  rationale: ஆழ்ந்த, உள்ளார்ந்த இரக்கத்தால் நெகிழ்ந்தார் என்ற வினையின் உணர்ச்சி வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: சமாரியரின் இரக்கமான எதிர்வினையைப் பிற்கால அறநெறி அல்லது கோட்பாட்டு விளக்கமின்றி மொழிபெயர்த்தல்
  choice: பரிவால் மனம் உருகினார்
  alternative: அவன்மேல் இரக்கம் கொண்டார்
  rationale: கிரேக்க வினையில் உள்ள ஆழ்ந்த உணர்ச்சியைப் பாதுகாக்கிறது; அதேவேளையில் கிருபை, அயலான்-அன்பு போன்ற வசனத்தில் வெளிப்படையாக இல்லாத விளக்கங்களைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், இயல்பான, கண்ணியமான நடையில் அமைக்கப்பட்டது. மரியாதை ஒருமை வினைமுற்றுகள் சமாரியருக்குப் பயன்படுத்தப்பட்டுள்ளன; காயமடைந்தவரைக் குறிக்கும் பிரதிப்பெயர் தெளிவுக்காக ஒருமையில் வைக்கப்பட்டுள்ளது.
