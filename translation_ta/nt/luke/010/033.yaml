  to: ஆனால், பயணம் செய்துகொண்டிருந்த ஒரு சமாரியர் அவன் இருந்த இடத்திற்கு வந்தார்; அவனைப் பார்த்ததும், அவருக்கு அவன்மேல் இரக்கம் உண்டாயிற்று.[a]
