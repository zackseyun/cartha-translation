  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: ta
  text: பின்பு அந்த எழுபத்திரண்டு[a] பேரும் மகிழ்ச்சியுடன் திரும்பிவந்து, “ஆண்டவரே, உமது பெயரால் பேய்கள்கூட எங்களுக்குக் கீழ்ப்படிகின்றன” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “எழுபத்திரண்டு” என்பதற்குப் பதிலாக “எழுபது” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: திரும்பிவந்து
  rationale: பணிக்குச் சென்றவர்கள் திரும்பிய நிகழ்வை இறந்தகாலத்தில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: கதை அடுத்த நிகழ்வுக்கு நகர்வதைக் காட்டும் இணைப்பாக இங்கு இயல்பாக அமைகிறது.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: அந்த எழுபத்திரண்டு பேர்
  rationale: SBLGNT மூலப்பாடத்திலுள்ள எண்ணிக்கையைப் பின்பற்றுகிறது; அறியப்பட்ட மாற்றுப் பாடம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியுடன்
  rationale: மூலத்திலுள்ள பெயர்ச்சொல் சார்ந்த கருத்தை இயல்பான நவீன தமிழில் துல்லியமாகத் தருகிறது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்புவினையைத் தமிழின் இயல்பான நேர்கூற்று அமைப்பில் வழங்குகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதற்கான மரியாதையும் வேதாகமப் பயன்பாடும் கொண்ட இயல்பான தமிழ் வடிவம்.
- source_word: καὶ
  choice: கூட
  rationale: சீடர்களின் வியப்பை வெளிப்படுத்தும் உயர்த்திக் கூறும் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τὰ δαιμόνια
  choice: பேய்கள்
  rationale: தீய ஆவிக்குரிய உயிர்களைக் குறிக்கும் δαιμόνια என்பதற்கான பொதுவாகப் புரியும் நேரடியான தமிழ் சொல்.
- source_word: ὑποτάσσεται
  choice: கீழ்ப்படிகின்றன
  rationale: தற்போதைய கீழ்ப்படிதல் அல்லது கட்டுப்பாட்டுக்குட்படுதலை இயல்பாக வெளிப்படுத்துகிறது; தமிழ் இலக்கணப்படி பன்மை வினை பயன்படுத்தப்படுகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: ὑποτάσσω என்பதோடு வரும் வேற்றுமைப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ ὀνόματί σου
  choice: உமது பெயரால்
  rationale: இயேசுவின் பெயருடன் தொடர்புடைய அதிகாரம் அல்லது செயலாற்றும் வழிமுறையைத் தமிழில் இயல்பாகக் காட்டுகிறது; வெறும் சொற்பெயர்ப்பை விட கருத்தைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: சீடர்களின் எண்ணிக்கையிலுள்ள மூலப்பாட வேறுபாடு
  choice: எழுபத்திரண்டு
  alternative: எழுபது
  rationale: கொடுக்கப்பட்ட SBLGNT மூலப்பாடம் ‘எழுபத்திரண்டு’ என வாசிக்கிறது. முக்கியமான ‘எழுபது’ என்ற மாற்றுப் பாடம் மறைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நேர்கூற்று இயல்பான தமிழ் வாக்கிய அமைப்பில் தரப்பட்டுள்ளது; ‘ஆண்டவரே’, ‘உமது’ ஆகிய வடிவங்கள் மரியாதையையும் வாசிப்பின் கண்ணியத்தையும் பேணுகின்றன.
