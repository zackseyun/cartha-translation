  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: ta
  text: பணப்பையையோ, பயணப்பையையோ[a], செருப்புகளையோ எடுத்துச் செல்லாதீர்கள்; வழியில் யாரையும் வாழ்த்தாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயணப்பை’ என்பதை ‘பை’ அல்லது ‘முதுகுப்பை’ என்றும் மொழிபெயர்க்கலாம்; பயணத்திற்கான உணவு மற்றும் தேவைகளை எடுத்துச் செல்லும் பை இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இது சாதாரண மரியாதையையே முற்றிலும் தடைசெய்வதாக இல்லாமல், அக்காலத்தில் நீண்ட நேரம் எடுத்துக்கொள்ளக்கூடிய வழக்கமான சமூக வாழ்த்துகளால் தாமதிக்க வேண்டாம் என்ற அவசரத்தை உணர்த்தக்கூடும். ஆயினும், கிரேக்க உரை நேரடியாக ‘யாரையும் வாழ்த்தாதீர்கள்’ என்றே கூறுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: எடுத்துச் செல்லாதீர்கள்
  rationale: பயணத்துக்கான பொருட்களைக் கொண்டுசெல்வதைத் தடைசெய்யும் இச்சூழலில், ‘சுமக்காதீர்கள்’ என்பதைவிட ‘எடுத்துச் செல்லாதீர்கள்’ என்பது இயல்பான நவீனத் தமிழாகவும் கிரேக்க வினையின் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: βαλλάντιον
  choice: பணப்பை
  rationale: பணத்தை வைத்திருக்கும் பையைத் தெளிவாகக் குறிக்கிறது; ‘பர்ஸ்’ போன்ற கடன்சொல்லைத் தவிர்க்கிறது.
- source_word: πήραν
  choice: பயணப்பை
  rationale: பயணத்திற்கான உணவு அல்லது தேவைகளை எடுத்துச் செல்லப் பயன்படுத்திய பையைக் குறிக்கிறது. ‘பை’ என்பதைக் காட்டிலும் அதன் பயன்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: ὑποδήματα
  choice: செருப்புகள்
  rationale: பண்டைய மத்தியதரைக் கடல் சூழலில் அணிந்த காலணிகளை இயல்பாகக் குறிக்கும் சொல். பொதுவான ‘காலணிகள்’ என்பதைக் காட்டிலும் வரலாற்றுச் சூழலுக்கு நெருக்கமானது.
- source_word: μηδένα
  choice: யாரையும்
  rationale: வாழ்த்துதலின் எதிர்மறை நேரடிப் பொருளாக இயல்பான தமிழில் அமைக்கப்பட்டுள்ளது.
- source_word: κατὰ τὴν ὁδόν
  choice: வழியில்
  rationale: பயணம் செய்துகொண்டிருக்கும்போது அல்லது செல்லும் வழியில் என்ற இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀσπάσησθε
  choice: வாழ்த்தாதீர்கள்
  rationale: ἀσπάζομαι என்பதன் இச்சூழலுக்குரிய வழக்கமான பொருள் ‘வாழ்த்து’ என்பதாகும்; ‘தழுவு’ என்பது இங்கு தேவையற்ற அளவு குறிப்பானது.
theological_decisions:
- issue: பயண வழியில் மற்றவர்களை வாழ்த்தக்கூடாது என்ற கட்டளையின் வலிமை
  choice: ‘வழியில் யாரையும் வாழ்த்தாதீர்கள்’ என்ற நேரடியான தடையாக மொழிபெயர்த்தல்
  alternative: ‘வாழ்த்துவதற்காக வழியில் தாமதிக்காதீர்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை நேரடியான தடை வடிவில் உள்ளது. நீண்ட சமூக வாழ்த்துகளால் ஏற்படும் தாமதமே பின்னணி என்று இருக்கக்கூடும்; ஆனால் அதை மூலவாக்கியத்துக்குள் சேர்க்காமல் அடிக்குறிப்பில் விளக்குவது உண்மையான உரை வலிமையையும் அதன் பண்பாட்டு நுணுக்கத்தையும் காக்கிறது.
- issue: ‘செருப்புகளை எடுத்துச் செல்லாதீர்கள்’ என்பது அணிந்திருந்த செருப்புகளையும் தடைசெய்கிறதா?
  choice: மூலத்தின் பொதுவான சொல்லைத் தீர்மானிக்காமல் ‘செருப்புகளையோ எடுத்துச் செல்லாதீர்கள்’ என்று வைத்தல்
  alternative: ‘கூடுதல் செருப்புகளை எடுத்துச் செல்லாதீர்கள்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரையில் ‘கூடுதல்’ என்ற சொல் இல்லை. பயணச் சாமான்களை எடுத்துச் செல்ல வேண்டாம் என்பதே சூழலாக இருந்தாலும், மொழிபெயர்ப்பில் இல்லாத விவரத்தைச் சேர்க்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மரியாதைப் பன்மை கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் ஒவ்வொரு பொருளுக்கும் ‘-ஐயோ’ இணைப்பு கொடுத்து தமிழின் இயல்பான எதிர்மறைப் பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது; வாக்கியத்தின் நேரடியான, அவசரமான கட்டளைத் தொனியும் பாதுகாக்கப்பட்டுள்ளது.
