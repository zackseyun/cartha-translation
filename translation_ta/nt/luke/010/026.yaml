  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: ta
  text: அவர் அவனிடம், “திருச்சட்டத்தில் என்ன எழுதப்பட்டிருக்கிறது? அதை நீ எவ்வாறு வாசிக்கிறாய்?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை நீ எவ்வாறு பொருள்கொள்கிறாய்?” கிரேக்கத்தில் நேரடியாக, “எவ்வாறு வாசிக்கிறாய்?” என்று உள்ளது; வாசித்துப் புரிந்துகொள்ளும் அல்லது விளக்கும் கருத்தும் இதில் அடங்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: அவர்
  rationale: δέ ஒரு மென்மையான உரைத்தொடர்பு; தமிழில் தனியாக இணைப்புச்சொல் சேர்க்காமல் இயல்பான உரையோட்டம் கிடைக்கிறது. ὁ இங்கு மறைமுக எழுவாயைக் குறிக்கும் பதிலிப்பெயர் செயல்பாட்டில் உள்ளது.
- source_word: εἶπεν πρὸς αὐτόν
  choice: அவனிடம் ... என்று கேட்டார்
  rationale: πρός + வேற்றுமை உருபு பேசப்படுபவரைக் குறிக்கிறது. வாக்கியம் கேள்விகளைக் கொண்டிருப்பதால், தமிழில் ‘என்று கேட்டார்’ என்பது இயல்பானது; மூலத்தின் நேரடி உரையாடலைப் பாதுகாக்கிறது.
- source_word: Ἐν τῷ νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: νόμος இங்கு இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட அங்கீகரிக்கப்பட்ட வேதச்சட்டத் தொகுப்பைக் குறிக்கிறது. ‘திருச்சட்டம்’ பொதுவான மனிதச் சட்டம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, வேதப்பின்னணியைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τί γέγραπται
  choice: என்ன எழுதப்பட்டிருக்கிறது
  rationale: γέγραπται என்ற நிறைவுக்காலச் செயப்பாட்டு வடிவம் எழுதப்பட்டு நிலைத்திருக்கும் நிலையைக் குறிக்கிறது; ‘எழுதப்பட்டிருக்கிறது’ அந்த நுணுக்கத்தை தமிழில் காக்கிறது.
- source_word: πῶς
  choice: எவ்வாறு
  rationale: வாசிக்கும் முறை அல்லது புரிந்துகொள்ளும் விதத்தைப் பற்றிய திறந்த கேள்வியை இது காக்கிறது.
- source_word: ἀναγινώσκεις
  choice: வாசிக்கிறாய்
  rationale: வினையின் அடிப்படைப் பொருள் ‘வாசி’ என்பதாகும். சூழலில் விளக்கிப் புரிந்துகொள்வது என்ற நுணுக்கமும் இருக்கலாம்; அதை முதன்மை உரையில் தீர்மானிக்காமல் அடிக்குறிப்பில் காட்டப்படுகிறது.
theological_decisions:
- issue: νόμος என்பதன் பொருள்
  choice: இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட அங்கீகரிக்கப்பட்ட வேதச்சட்டத்தைக் குறிக்கும் ‘திருச்சட்டம்’
  alternative: ‘தோரா’ அல்லது பொதுவான ‘சட்டம்’
  rationale: சட்ட அறிஞருடனான யூத வேதப்பின்னணி உரையாடலே சூழல். ‘திருச்சட்டம்’ வேதச்சட்டத்தைச் சுட்டுகிறது; அதேவேளை எபிரேய ஒலிபெயர்ப்பை முதன்மை உரையில் கட்டாயப்படுத்துவதில்லை.
- issue: πῶς ἀναγινώσκεις என்பதிலுள்ள விளக்கவியல் நுணுக்கம்
  choice: ‘அதை நீ எவ்வாறு வாசிக்கிறாய்?’ என்ற நேரடியான வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘அதை நீ எவ்வாறு பொருள்கொள்கிறாய்?’
  rationale: கேள்வி வாசிப்போடு புரிதலையும் உள்ளடக்கக்கூடும்; ஆனால் கிரேக்க வினையின் நேரடிப் பொருள் ‘வாசித்தல்.’ முதன்மை உரை அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ இயேசுவுக்கான மரியாதை வடிவமாகவும், ‘அவன்/நீ’ அக்கால நேரடி உரையாடலின் இயல்பான ஒருமை வடிவமாகவும் உள்ளது. வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாக்கப்பட்டாலும், மூலத்தின் இரு கேள்விகளும் அதன் விளக்கவியல் திறந்த தன்மையும் காக்கப்பட்டுள்ளன.
