id: LUK.10.41
reference: Luke 10:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: ta
  text: 'ஆனால் ஆண்டவர் அவளுக்குப் பதிலளித்தார்: “மார்த்தா, மார்த்தா, நீ பலவற்றைக் குறித்துக் கவலைப்பட்டுக் கலங்குகிறாய்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கவலையும் பதற்றமும் அடைகிறாய்.’
    reason: μεριμνᾷς மற்றும் θορυβάζῃ ஆகிய சொற்களின் பொருள் நிழல்களை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: ஆனால் ஆண்டவர் அவளுக்குப் பதிலளித்தார்
  rationale: கிரேக்க மொழியின் ‘பதிலளித்து அவளிடம் சொன்னார்’ என்ற கதைசொல்லல் மரபுத்தொடரை இயல்பான நவீனத் தமிழில் ஒரே வினையாக வழங்குகிறது; δὲ குறிக்கும் மென்மையான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: லூக்காவின் கதைநடையில் இயேசுவுக்குரிய மரியாதை மற்றும் கிறிஸ்துவியல் எதிரொலி கொண்ட பட்டத்தைத் தமிழில் வழக்கமான முறையில் காக்கிறது.
- source_word: Μάρθα Μάρθα
  choice: மார்த்தா, மார்த்தா
  rationale: அன்பும் வலியுறுத்தலும் நிறைந்த இருமுறை அழைப்பை அப்படியே காக்கிறது.
- source_word: μεριμνᾷς
  choice: கவலைப்படுகிறாய்
  rationale: உள்ளார்ந்த கவலை அல்லது மனச்சுமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: θορυβάζῃ
  choice: கலங்குகிறாய்
  rationale: கவலையிலிருந்து வேறுபட்ட உள்ளக் குழப்பம் அல்லது அமைதியின்மையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: περὶ πολλά
  choice: பலவற்றைக் குறித்து
  rationale: மார்த்தாவின் கவலைகளின் பரந்த பொருளை கிரேக்கத்தை ஒட்டி இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: இயேசுவுக்கான κύριος என்னும் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமானர்
  rationale: இங்கு இது வெறும் வீட்டு எஜமானரைக் குறிக்கும் சொல்லாக அல்லாமல், லூக்காவின் கதைநடையில் மரியாதையும் கிறிஸ்துவியல் பொருளும் கொண்ட பட்டமாக வருகிறது; ‘ஆண்டவர்’ அந்த எதிரொலியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நேரடி உரை. கிரேக்கத்தில் உள்ள இருமுறை அழைப்பும் இரண்டு தனித்த உணர்ச்சி வினைகளும் பாதுகாக்கப்பட்டுள்ளன.
