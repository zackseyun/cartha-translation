  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “சாத்தான் மின்னலைப்போல் வானத்திலிருந்து விழுவதை நான் பார்த்துக்கொண்டிருந்தேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாத்தான் மின்னலைப்போல் வானத்திலிருந்து விழுவதை நான் கண்டேன்.” கிரேக்க முற்றுப் பெறாத இறந்தகால வினையை எளிமையாக “கண்டேன்” என்றும் மொழிபெயர்க்கலாம்; “பார்த்துக்கொண்டிருந்தேன்” என்பது அதன் நீடித்த தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: δέ-ஐத் தனியாக வலியுறுத்தாமல், தமிழின் இயல்பான உரையாடல் அமைப்பில் மென்மையான கதைத் தொடர்ச்சியாகக் கொடுக்கிறது; εἶπεν எளிய இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἐθεώρουν
  choice: நான் பார்த்துக்கொண்டிருந்தேன்
  rationale: θεωρέω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம் குறிக்கும் நீடித்த அல்லது நடந்துகொண்டிருந்த பார்வையை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: τὸν Σατανᾶν
  choice: சாத்தான்
  rationale: இங்கு தனிப்பட்ட பெயர் அல்லது பட்டமாகப் பயன்படுத்தப்படும் Σατανᾶς என்பதற்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ὡς ἀστραπὴν
  choice: மின்னலைப்போல்
  rationale: ὡς குறிக்கும் உவமையையும் ἀστραπή குறிக்கும் மின்னல் உருவகத்தையும் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பதன் வானம்/பரலோகம் சார்ந்த பரப்பைத் தேவையின்றி மிகத் துல்லியமாகக் கட்டுப்படுத்தாமல், இச்சூழலில் இயல்பான தமிழ்ச் சொல்லால் வழங்குகிறது.
- source_word: πεσόντα
  choice: விழுவதை
  rationale: Σατανᾶν என்பதுடன் தொடர்புடைய அக்கூசட்டிவ் இறந்தகாலப் பங்கேற்பு வடிவத்தை, பார்வைக்குட்பட்ட முழு நிகழ்வாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சாத்தானின் விழுதலைக் குறித்த இயேசுவின் கூற்றின் காலமும் பொருளும்
  choice: நடந்துகொண்டிருந்த பார்வையைச் சுட்டும் வகையில் ‘பார்த்துக்கொண்டிருந்தேன்’ என்று மொழிபெயர்த்து, சாத்தான் ‘விழுவதை’ நிகழ்வாகக் காட்டுதல்
  alternative: ‘சாத்தான் மின்னலைப்போல் வானத்திலிருந்து விழுந்ததை நான் கண்டேன்’
  rationale: இக்கூற்று ஆதிகால வீழ்ச்சியையா, சீடர்களின் அப்போதைய ஊழியத்தையா, அல்லது வருங்காலத் தோல்வியின் தரிசனத்தையா குறிக்கிறது என்பதை கிரேக்க வாசகம் தனித்து முடிவுசெய்யவில்லை. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தையும் காலத் தெளிவின்மையையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்த்துக்கொண்டிருந்தேன்’ என்பது இயல்பான பேச்சு வழக்கைத் தக்கவைத்தபடியே மூலத்தின் தொடர்நிலை அம்சத்தை வெளிப்படுத்துகிறது; ‘வானம்’ என்பது இங்கு வானம்/பரலோகம் என்ற பொருள் எல்லையை மிகையாகத் தீர்மானிக்கவில்லை.
