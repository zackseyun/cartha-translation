  source_fidelity: 'மூலக் கிரேக்கத்தின் நபர்சார் இணை அமைப்பு முறையாகப் பாதுகாக்கப்பட்டுள்ளது: உங்களுக்குச் செவிகொடுப்பது எனக்குச் செவிகொடுப்பதாகவும், உங்களை நிராகரிப்பது என்னை நிராகரிப்பதாகவும், என்னை நிராகரிப்பது என்னை அனுப்பியவரை நிராகரிப்பதாகவும் தெளிவாக உள்ளது. ἀκούω உடனான நபரைக் குறிக்கும் பயன்பாட்டைச் செய்தி போன்ற கூடுதல் சொல்லைச் சேர்க்காமல் இயல்பாகக் கையாண்டுள்ளது. ἀθετέω-வின் மும்முறை மீளுரைப்பும் காக்கப்பட்டுள்ளது.'
  naturalness: ‘உங்களுக்குச் செவிகொடுக்கிறவர்’ மற்றும் ‘எனக்குச் செவிகொடுக்கிறார்’ என்பது நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘நிராகரிக்கிறார்’ என்ற தொடர் மீளுரை வசனத்தின் வலியுறுத்தலைச் சீராக வெளிப்படுத்துகிறது. நிறுத்தற்குறிகளும் கருத்தோட்டமும் தெளிவாக உள்ளன.
  terminology: ‘நிராகரிக்கிறார்’ இச்சூழலில் ἀθετέω-க்கு பொருத்தமான முதன்மை மொழிபெயர்ப்பு. அடிக்குறிப்பில் ‘புறக்கணிக்கிறார்’ மற்றும் ‘ஒதுக்கித் தள்ளுகிறார்’ என்ற மாற்றுப் பொருள்கள் உரியவாறு தரப்பட்டுள்ளன. ‘என்னை அனுப்பியவரை’ என்ற சொற்றொடர் அனுப்பியவரின் அடையாளத்தை மூலத்தைவிட வெளிப்படையாக்காமல் தக்கவைக்கிறது.
