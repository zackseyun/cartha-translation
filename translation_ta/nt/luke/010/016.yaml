id: LUK.10.16
reference: Luke 10:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: ta
  text: உங்களுக்குச் செவிகொடுக்கிறவர் எனக்குச் செவிகொடுக்கிறார்; உங்களை நிராகரிக்கிறவர்[a] என்னை நிராகரிக்கிறார். ஆனால் என்னை நிராகரிக்கிறவர், என்னை அனுப்பியவரை நிராகரிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘நிராகரிக்கிறார்’ என்பதற்கு ‘புறக்கணிக்கிறார்’ அல்லது ‘ஒதுக்கித் தள்ளுகிறார்’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων ὑμῶν
  choice: உங்களுக்குச் செவிகொடுக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல் பொதுவாக அத்தகைய செயலைச் செய்கிற ஒருவரைக் குறிக்கிறது. ἀκούω உடன் வரும் ὑμῶν நபரைக் கேட்டல் அல்லது அவருக்குச் செவிகொடுத்தலைக் குறிக்கிறது; கிரேக்கத்தில் இல்லாத ‘உங்கள் செய்தி’ என்பதைச் சேர்க்காமல் நபர் சார்ந்த நேரடித் தொடர்பை இது காக்கிறது.
- source_word: ἐμοῦ ἀκούει
  choice: எனக்குச் செவிகொடுக்கிறார்
  rationale: முதல் வினையுடன் உள்ள சொல்லாட்சி ஒற்றுமையைத் தக்கவைத்து, சீடர்களுக்குச் செவிகொடுப்பது இயேசுவுக்குச் செவிகொடுப்பதே என்ற பிரதிநிதித்துவ உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: நிராகரிக்கிறவர் / நிராகரிக்கிறார்
  rationale: ἀθετέω என்பதற்கு நிராகரித்தல், புறக்கணித்தல், ஒதுக்கிவைத்தல் போன்ற பொருள்கள் உண்டு. இங்கு அதிகாரத்துடன் அனுப்பப்பட்ட நபர்களை ஏற்க மறுக்கும் உறவுசார் பொருளை ‘நிராகரிக்கிறார்’ தெளிவாக வெளிப்படுத்துகிறது; ஒரே வினையின் மும்முறை மறுபயன்பாடும் பாதுகாக்கப்படுகிறது.
- source_word: ὑμᾶς / ἐμέ
  choice: உங்களை / என்னை
  rationale: கிரேக்கத்தில் நபர்களே நேரடி செயப்படுபொருள்களாக உள்ளனர். ‘உங்கள் செய்தியை’ போன்ற விளக்கத்தைச் சேர்க்காமல் மூலத்தின் தனிப்பட்ட வலிமையை இது காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: சீடர்களை நிராகரிப்பதிலிருந்து இயேசுவையும் அவரை அனுப்பியவரையும் நிராகரிப்பது வரை செல்லும் உச்சக்கட்ட முன்னேற்றத்தைச் சுட்டும் மென்மையான எதிர்மறை இணைப்பாக இங்கு அமைகிறது.
- source_word: τὸν ἀποστείλαντά με
  choice: என்னை அனுப்பியவரை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இறந்தகாலப் பங்கேற்புச் சொல்லை இயல்பாக மொழிபெயர்க்கிறது. அனுப்பியவர் யார் என்பதை மூலத்தைவிட வெளிப்படையாகக் குறிப்பிடாமல் தனிப்பட்ட குறிப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவுக்கும் அவர் அனுப்பிய சீடர்களுக்கும் இடையிலான பிரதிநிதித்துவ அடையாளம்
  choice: சீடர்களுக்குச் செவிகொடுப்பது இயேசுவுக்குச் செவிகொடுப்பதாகவும், அவர்களை நிராகரிப்பது இயேசுவை நிராகரிப்பதாகவும் உள்ள நேரடியான நபர்சார் தொடர் பாதுகாக்கப்பட்டது.
  alternative: சீடர்களின் ‘செய்தியைக்’ கேட்பது அல்லது நிராகரிப்பது என்று பொருளுரைத்தல்.
  rationale: மூலத்தில் ‘நீங்கள்’, ‘நான்’ என்ற நபர்சார் பதிலிப்பெயர்கள் உள்ளன; ‘செய்தி’ அல்லது ‘போதனை’ என்ற கருத்துப்பெயர்கள் இல்லை. ஆகவே பிரதிநிதித்துவ அதிகாரத்தின் வலிமையை மொழிபெயர்ப்பு குறுக்கவில்லை.
- issue: ‘என்னை அனுப்பியவர்’ என்பவரின் அடையாளம்
  choice: ‘என்னை அனுப்பியவர்’ என்றே மறைமுகமாக விடப்பட்டது.
  alternative: ‘என்னை அனுப்பிய பிதா’ அல்லது ‘கடவுள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: சூழலில் இது பிதாவாகிய கடவுளைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்க உரை ‘பிதா’ என்ற சொல்லைப் பயன்படுத்தவில்லை. மூலத்தின் மறைமுகத்தன்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைய ‘செவிகொடுக்கிறார்’ பயன்படுத்தப்பட்டது. வாக்கியத்தின் சுருக்கமான இணை அமைப்பும் ‘நிராகரிக்கிறார்’ என்ற மும்முறை மறுபயன்பாடும் மூலத்தின் சொற்பொழிவு வலிமையைத் தக்கவைக்கின்றன.
