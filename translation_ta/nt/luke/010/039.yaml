    text: சில கையெழுத்துப் பிரதிகளில் “இயேசு” என்பதற்குப் பதிலாக “ஆண்டவர்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: அவளுக்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மார்த்தாவையே பெண்பால் சுட்டுப்பெயர் குறிக்கிறது; தமிழில் உடைமை உறவை இயல்பாகச் சொல்ல ‘அவளுக்கு ... சகோதரி இருந்தாள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἀδελφὴ
  choice: சகோதரி
  rationale: இது நேரடியான உறவுமுறைச் சொல்; நவீன பொதுத்தமிழில் தெளிவான, மரியாதையான இணை.
- source_word: καλουμένη Μαριάμ
  choice: மரியா என்ற
  rationale: ஒருவரின் பெயரை அறிமுகப்படுத்தும் இயல்பான தமிழ் அமைப்பு; ‘அழைக்கப்பட்ட’ என்ற சொற்சொல் மொழிபெயர்ப்பின் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: காலடியில் அமர்ந்து
  rationale: அவர் கால்களின் அருகில் அமர்ந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது; சீடருக்குரிய தோரணையை விளக்கமாகச் சேர்க்காமல் அசல் படிமத்தைக் காக்கிறது.
- source_word: τοῦ Ἰησοῦ
  choice: இயேசுவின்
  rationale: வழங்கப்பட்ட SBLGNT மூலப்பாடத்தில் Ἰησοῦ (‘இயேசு’) இருப்பதால் அதையே முதன்மைப் பாடத்தில் பின்பற்றுகிறது.
- source_word: ἤκουεν
  choice: கேட்டுக்கொண்டிருந்தாள்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் imperfect வினையின் அம்சத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον αὐτοῦ
  choice: அவருடைய வார்த்தையை
  rationale: λόγος என்பதன் பரந்த பொருளை ‘போதனை’ அல்லது ‘செய்தி’ என்று குறுக்காமல், இயேசு பேசிக்கொண்டிருந்ததைச் சுட்டும் நெருக்கமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ‘யாருடைய காலடியில்’ என்பதில் பெயர் அல்லது பட்டம் குறித்த பாடவேறுபாடு
  choice: இயேசுவின்
  alternative: ஆண்டவரின்
  rationale: வழங்கப்பட்ட SBLGNT உரை Ἰησοῦ என்று வாசிக்கிறது. κύριος (‘ஆண்டவர்’) என்ற மாற்றுப் பாடம் பொருளுள்ள பாடவேறுபாடாக அடிக்குறிப்பில் காக்கப்படுகிறது; முதன்மைப் பாடத்தில் பட்டத்தைப் புகுத்தி மூல வாசகத்தை மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காலடியில் அமர்ந்து’ என்ற அசல் படிமமும், ‘கேட்டுக்கொண்டிருந்தாள்’ என்ற தொடர்ச்சிச் செயலும் பாதுகாக்கப்பட்டுள்ளன.
