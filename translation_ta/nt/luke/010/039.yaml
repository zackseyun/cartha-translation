  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: ta
  text: அவளுக்கு மரியா என்ற ஒரு சகோதரி இருந்தாள். அந்த மரியாவும் இயேசுவின்[a] பாதங்களருகே அமர்ந்து, அவருடைய வார்த்தையைக் கேட்டுக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
