  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: ta
  text: 'ஆனால் எந்த நகரத்திற்குள் நீங்கள் சென்றாலும், அங்குள்ளவர்கள் உங்களை ஏற்றுக்கொள்ளாவிட்டால், வெளியேறி அதன் தெருக்களுக்குச் சென்று[a] இவ்வாறு சொல்லுங்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் பொது சதுக்கங்களுக்கு’ அல்லது ‘அதன் அகன்ற வீதிகளுக்கு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் திறந்த பொதுவழித்தடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: ஆனால் நீங்கள் எந்த நகரத்திற்குள் சென்றாலும்
  rationale: ἄν உடன் வரும் தொடர்புப்பெயர் அமைப்பு, நிகழக்கூடிய எந்த நகரத்தையும் குறிக்கும் பொதுவான நிபந்தனைப் பொருளைத் தருகிறது. ‘எந்த நகரத்திற்குள் சென்றாலும்’ என்பது இதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσέλθητε
  choice: சென்றாலும்
  rationale: இது நகரத்திற்குள் நுழைவதைக் குறிக்கும் இறந்தகாலத் தோற்றமுடைய subjunctive வடிவம். ‘நகரத்திற்குள் சென்றாலும்’ என்ற தொடரில் இயக்கமும் நிபந்தனைப் பொருளும் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: அங்குள்ளவர்கள் உங்களை ஏற்றுக்கொள்ளாவிட்டால்
  rationale: δέχομαι இங்கு தூதர்களை வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘ஏற்றுக்கொள்ளாவிட்டால்’ என்பது வெறும் அன்பான வரவேற்பை மட்டுமல்லாமல் அவர்களையும் அவர்களுடைய பணியையும் ஏற்காத விரிவான பொருளையும் தக்கவைக்கிறது. கிரேக்கத்தில் வெளிப்படாத எழுவாயைத் தமிழில் தெளிவுபடுத்த ‘அங்குள்ளவர்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐξελθόντες
  choice: சென்று
  rationale: இந்தப் பங்கேற்புவினை அடுத்துள்ள கட்டளைக்கு முன் நிகழும் செயலைக் குறிக்கிறது. நகரிலுள்ள தனிப்பட்ட இடத்திலிருந்து பொது வீதிகளுக்குச் செல்வதைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் ‘சென்று’ தெரிவிக்கிறது.
- source_word: τὰς πλατείας αὐτῆς
  choice: அதன் தெருக்களுக்கு
  rationale: πλατεῖα என்பது அகன்ற, திறந்த பொது வீதிகளையோ பொது சதுக்கங்களையோ குறிக்கலாம். ‘தெருக்கள்’ சூழலில் இயல்பாக உள்ளது; சொல்லின் கூடுதல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἴπατε
  choice: இவ்வாறு சொல்லுங்கள்
  rationale: λέγω என்பதன் கட்டளை வடிவம் நேரடியாக ‘சொல்லுங்கள்’ என மொழிபெயர்க்கப்படுகிறது. அடுத்த வசனத்தில் வரும் மேற்கோளை இயல்பாக அறிமுகப்படுத்த ‘இவ்வாறு’ சேர்க்கப்பட்டுள்ளது.
