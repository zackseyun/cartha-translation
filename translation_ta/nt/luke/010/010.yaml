translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதைமிக்க பன்மைக் கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தின் நேரடி உரைக்கு வழிவகுப்பதால் முடிவில் முக்காற்புள்ளி இடப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘தெருக்களுக்கு’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
