id: LUK.10.29
reference: Luke 10:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: ta
  text: ஆனால், தம்மை நியாயப்படுத்திக்கொள்ள விரும்பிய அவர் இயேசுவிடம், “மேலும், என் அயலார் யார்?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரை என் அயலாராகக் கருத வேண்டும்?”
    reason: ‘என் அயலார் யார்?’ என்ற கேள்வியில் யார் அயலாராகக் கணக்கிடப்படுகிறார் என்ற எல்லை வரையறுக்கும் நோக்கம் இருக்கக்கூடும் என்பதை வெளிப்படுத்தும் சொல்லியல் மாற்று.
lexical_decisions:
- source_word: θέλων
  choice: விரும்பி
  rationale: நிகழ்காலப் பங்கேற்புவினை அந்த மனிதரின் நோக்கத்தைத் தெரிவிக்கிறது; ‘விரும்பி’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: தம்மை நியாயப்படுத்திக்கொள்ள
  rationale: தாம் சரியானவர் என்று காட்டிக்கொள்ளும் முயற்சியை இச்சொற்றொடர் குறிக்கிறது. தொழில்நுட்ப இறையியல் பொருளை மட்டும் திணிக்காமல், மூலத்தின் சொல்லியல் தொடர்பையும் இது காக்கிறது.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: இயேசுவிடம் … என்று கேட்டார்
  rationale: நேரடியான கேள்வியை அறிமுகப்படுத்தும் இயல்பான தமிழ் உரையாடல் நடை; கிரேக்கத்தில் பொதுவான ‘சொன்னார்’ என்ற வினை இருந்தாலும், இங்கு கேள்வி என்பதால் ‘கேட்டார்’ பொருத்தமானது.
- source_word: Καὶ
  choice: அப்படியென்றால்
  rationale: முந்தைய உரையாடலிலிருந்து எழும் தொடர்க் கேள்வியின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τίς ἐστίν μου πλησίον
  choice: என் அயலார் யார்?
  rationale: πλησίον இங்கு பெயர்ச்சொல்லாகப் பயன்பட்டு, தோராவின் மேற்கோளுடன் தொடர்புடைய ‘அயலார்’ என்ற பொருளைத் தருகிறது. கேள்வியின் நேரடித் தன்மையும் காக்கப்படுகிறது.
theological_decisions:
- issue: δικαιῶσαι ἑαυτόν என்பதன் பொருள்
  choice: தாம் சரியானவர் என்று காட்டிக்கொள்ள அவர் முயன்றதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: தம்மை ஒழுக்க ரீதியில் நீதிமானாக்கிக்கொள்ளுதல் அல்லது கூடியிருந்தவர்களுக்கு முன் தம்மை நிரபராதி என நிறுவுதல்.
  rationale: உடனடிச் சூழல் சட்டம் மற்றும் ஒழுக்கம் சார்ந்த உரையாடல். ஆகவே இது தொழில்நுட்பமான நீதிமானாக்குதல் கோட்பாட்டை நேரடியாகக் குறிப்பதாகத் தீர்மானிக்காமல், தன்னைச் சரியென நிலைநாட்டும் முயற்சியை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தம்மை’ என்பது மரியாதைக்காக அல்ல; ஒருமை எழுவாயைத் தெளிவாகத் திரும்பச் சுட்டும் இயல்பான வடிவம். ‘அயலார்’ வேதாகமச் சூழலிலுள்ள ‘neighbor’ கருத்தைத் தக்கவைத்தாலும் இன்றைய தமிழிலும் புரியக்கூடியது.
