id: LUK.10.19
reference: Luke 10:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: ta
  text: இதோ, பாம்புகளையும் தேள்களையும் மிதிப்பதற்கும்[a], பகைவனுடைய எல்லா வல்லமையின்மேலும் உங்களுக்கு அதிகாரம் கொடுத்திருக்கிறேன்; எதுவும் உங்களுக்கு ஒருபோதும் தீங்கு செய்யாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாம்புகள்’ என்பதற்கு ‘சர்ப்பங்கள்’ என்றும் மொழிபெயர்க்கலாம். இந்தப் படிமம், இச்சூழலில் பகைமையான ஆவிக்குரிய சக்திகளையும் நினைவூட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘எதுவும் உங்களுக்கு எவ்வகையிலும் தீங்கு செய்யாது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் வலியுறுத்தப்பட்ட இரட்டை மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலியுறுத்தலை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: δέδωκα
  choice: கொடுத்திருக்கிறேன்
  rationale: முடிவுற்ற செயல் இப்போதும் விளைவுடன் தொடர்வதைக் காட்டும் கிரேக்க நிறைவுக்கால நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: பின்னர் வரும் δύναμις என்பதிலிருந்து வேறுபட்ட, வழங்கப்பட்ட உரிமை அல்லது ஆளுகையைக் குறிக்கிறது.
- source_word: τοῦ πατεῖν
  choice: மிதிக்கவும்
  rationale: கொடுக்கப்பட்ட அதிகாரத்தின் செயல்பாட்டைத் தெளிவாகவும், மூலப்படிமத்தை மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: பாம்புகளையும் தேள்களையும்
  rationale: நேரடியான உருவகப் படிமத்தை இயல்பான இன்றைய தமிழில் தருகிறது; ‘சர்ப்பங்கள்’ என்பதைக் காட்டிலும் ‘பாம்புகள்’ பொதுவாக எளிதில் புரியும்.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: எல்லா வல்லமையின்மீதும்
  rationale: பகைவனுடைய முழு வலிமையின்மேல் சீடர்களுக்குக் கொடுக்கப்பட்ட மேலாதிக்கத்தைக் குறிக்கிறது.
- source_word: δύναμιν
  choice: வல்லமை
  rationale: முன்னுள்ள ἐξουσίαν என்பதற்கு ‘அதிகாரம்’ என்று மொழிபெயர்த்துள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: τοῦ ἐχθροῦ
  choice: பகைவனுடைய
  rationale: மூலத்தில் உள்ள ஒருமை மற்றும் தனிப்பட்ட எதிரி என்ற சாயலைக் காக்கிறது; சாத்தான் என்று உரையிலேயே மேலதிகமாக அடையாளப்படுத்தவில்லை.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: எதுவும் உங்களுக்கு ஒருபோதும் தீங்கு செய்யாது
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் ‘ஒருபோதும் ... செய்யாது’ என்று வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பகைவன்’ என்பவரின் அடையாளம்
  choice: மூலத்தின்படி ‘பகைவன்’ என்றே வைக்கப்பட்டது.
  alternative: ‘சாத்தான்’ அல்லது ‘பிசாசு’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: அருகிலுள்ள சூழல் சாத்தானிய எதிர்ப்பைக் குறிப்பிட்டாலும், கிரேக்க உரை ‘பகைவன்’ என்று மட்டுமே கூறுகிறது; ஆகவே உரை கூறாத அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: ‘பாம்புகளும் தேள்களும்’ என்பதன் நேரடி அல்லது அடையாளப் பொருள்
  choice: முதன்மை உரையில் நேரடியான படிமம் பாதுகாக்கப்பட்டது.
  alternative: பேய் சக்திகளுக்கான உருவகமாக நேரடியாக மொழிபெயர்த்தல்.
  rationale: சொற்களின் அடிப்படை பொருள் நேரடியானது; சூழல் பகைமையான ஆவிக்குரிய சக்திகளையும் நினைவூட்டக்கூடும். அந்த விளக்கத் திறப்பை மொழிபெயர்ப்பு தீர்மானித்து மூடவில்லை.
- issue: தீங்கு ஏற்படாது என்ற வாக்குறுதியின் வலிமை
  choice: ‘ஒருபோதும் தீங்கு செய்யாது’ என்று வலியுறுத்தப்பட்ட மறுப்பு காக்கப்பட்டது.
  alternative: ‘பெரிய தீங்கு செய்யாது’ அல்லது ‘இறுதியில் வெல்லாது’ என்று வரம்பிட்டு விளக்குதல்.
  rationale: கிரேக்கத்தில் οὐδέν ... οὐ μή என்ற மிக வலுவான மறுப்பு உள்ளது. அதன் நடைமுறை அல்லது இறையியல் எல்லைகளை மொழிபெயர்ப்பிலேயே விளக்கிச் சுருக்காமல், மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிநடை அமைக்கப்பட்டது. ‘அதிகாரம்’ மற்றும் ‘வல்லமை’ என்ற இரு சொற்கள் மூலத்தின் ἐξουσία–δύναμις வேறுபாட்டைக் காக்கின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
