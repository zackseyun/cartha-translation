- from: இதோ, பாம்புகளையும் தேள்களையும் மிதிக்கவும்[a], பகைவனுடைய எல்லா வல்லமையின்மீதும் அதிகாரம் செலுத்தவும் உங்களுக்கு அதிகாரம் கொடுத்திருக்கிறேன்; எதுவும் உங்களுக்கு ஒருபோதும் தீங்கு செய்யாது[b].
  to: இதோ, பாம்புகளையும் தேள்களையும் மிதிப்பதற்கும்[a], பகைவனுடைய எல்லா வல்லமையின்மேலும் உங்களுக்கு அதிகாரம் கொடுத்திருக்கிறேன்; எதுவும் உங்களுக்கு ஒருபோதும் தீங்கு செய்யாது[b].
  rationale: மூலத்தின் ஒரே ἐξουσίαν இரு இணையான பகுதிகளையும் ஆளும் அமைப்பைத் தமிழில் மீட்டமைத்தோம். நிறைவுக்காலத்தின் தற்போதைய விளைவைக் காட்டும் ‘கொடுத்திருக்கிறேன்’, ἐξουσία–δύναμις வேறுபாடு, ‘பகைவன்’ என்ற குறிப்பிடப்படாத அடையாளம், மற்றும் வலுவான மறுப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு a-வில் சொல்லியல் மாற்று சேர்க்கப்பட்டு, உருவகச் சாத்தியம் விளக்கமாக மட்டுமே தரப்பட்டுள்ளது.
