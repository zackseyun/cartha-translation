source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: ta
  text: ஆனால் சிலவே தேவை—அல்லது ஒன்றே[a]. ஏனெனில் மரியா நல்ல பங்கை[b] தேர்ந்தெடுத்திருக்கிறாள்; அது அவளிடமிருந்து எடுத்துக்கொள்ளப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே காரியம்தான் அவசியம்.’ உணவு பரிமாறப்படும் இந்தச் சூழலில், ‘சில உணவுவகைகளே தேவை—அல்லது ஒன்றே போதும்’ என்றும் கிரேக்கத்தை இன்னும் குறிப்பாகப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘நல்ல பகுதி.’ ‘பங்கு’ என்பது உணவில் ஒருவருக்குக் கிடைக்கும் பங்கையும், உண்மையில் மதிப்புள்ள ஒன்றில் அவருக்குரிய பங்கையும் ஒருசேர எதிரொலிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων
  choice: சிலவே
  rationale: χρεία என்பதோடு வரும் பன்மைச் சொல்லாக, தேவையானவை மிகச் சில என்பதைக் குறிக்கிறது. ‘சிலவே’ என்பது கிரேக்கத்தின் சுருக்கத்தையும், உணவு ஏற்பாடுகளைக் குறிக்கக்கூடிய சூழலையும் காக்கிறது.
- source_word: χρεία
  choice: தேவை
  rationale: ἐστιν χρεία என்ற மரபுத்தொடர் தேவை அல்லது அவசியத்தைச் சுட்டுகிறது. நவீன தமிழில் ‘தேவை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἢ ἑνός
  choice: அல்லது ஒன்றே
  rationale: ‘சில’ என்பதற்கு எதிராக ‘ஒன்று’ என்பதைச் சுருக்கமாக நிறுத்துகிறது. அது ஒரு உணவுவகையா அல்லது இன்றியமையாத ஒரே காரியமா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: Μαριὰμ
  choice: மரியா
  rationale: நவீனத் தமிழில் எளிதில் அறியப்படும் இயல்பான பெயர் வடிவம்.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: நல்ல பங்கை
  rationale: ἀγαθή என்பதற்கு நேராக ‘நல்ல’ என்றும், μερίς என்பதற்கு ‘பங்கு’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. உணவில் கிடைக்கும் பங்கையும் உண்மையில் மதிப்புள்ளவற்றில் ஒருவருக்குரிய பங்கையும் இது எதிரொலிக்கக்கூடும்; கிரேக்கத்தில் ஒப்பீட்டு வடிவம் இல்லாததால் ‘சிறந்த’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: ἐξελέξατο
  choice: தேர்ந்தெடுத்திருக்கிறாள்
  rationale: இறந்தகாலத்தில் செய்யப்பட்ட மரியாவின் சொந்தத் தேர்வையும் அதன் நீடிக்கும் விளைவையும் தமிழின் நிறைவுநிலை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἥτις
  choice: அது
  rationale: மரியா தேர்ந்தெடுத்த ‘பங்கு’ என்பதையே மீண்டும் சுட்டி, அதன் நிலையான பண்பை அடுத்த வாக்கியத்தில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: அது அவளிடமிருந்து எடுத்துக்கொள்ளப்படாது
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், அந்தப் பங்கு அவளிடமிருந்து நீக்கப்படாது என்ற உறுதியையும் நேராகக் காக்கிறது.
theological_decisions:
- issue: ‘சிலவே தேவை—அல்லது ஒன்றே’ என்பது மார்த்தாவின் பணிவிடைக்கும் மரியாவின் தேர்வுக்கும் எவ்வாறு தொடர்புடையது
  choice: தேவையானவை சிலவா அல்லது ஒன்றா என்று உரை கூறும் வடிவத்தைத் தக்கவைத்து, அது உணவுவகைகளையா அல்லது இன்றியமையாத ஒரே காரியத்தையா குறிக்கிறது என்பதை முதன்மை உரையில் வரையறுக்காமல் விடுதல்.
  alternative: ‘சில உணவுவகைகளே தேவை, அல்லது ஒன்றே போதும்’ என்றும், மாற்றாக ‘ஒரே காரியம்தான் அவசியம்’ என்றும் தெளிவாகப் பொருளுரைத்தல்.
  rationale: கிரேக்க வாசகம் உணவு ஏற்பாட்டைச் சார்ந்த நடைமுறைப் பொருளையும், ஆழமான ஆன்மிக எதிர்மறையையும் அனுமதிக்கிறது. ஆகவே அதன் உண்மையான பொருள் நெருக்கடியை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: இயல்பான, நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சிலவே—அல்லது ஒன்றே’ என்ற சுருக்கமான அமைப்பு மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது; அடிக்குறிப்புகள் சாத்தியமான இரு பொருள்களையும் விளக்குகின்றன.
