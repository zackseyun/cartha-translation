    rationale: The alternate sense of φάραγξ is ravine/gorge, not “மலை இடுக்கு” in this wording; moreover, the English audit footnote supplies an alternative rendering of the full terrain-and-road sequence. The footnote should give “பள்ளம்” or “குறுகிய பள்ளத்தாக்கு” as the lexical alternative without altering the verse’s meaning.
