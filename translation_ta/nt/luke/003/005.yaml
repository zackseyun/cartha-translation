  source_fidelity: 'The main translation accurately represents the Greek future-passive terrain and road imagery: every valley is filled, mountains and hills are lowered, crooked places are made straight, and rough places become smooth roads. However, footnote a is not a valid lexical alternative for the cited phrase and omits the remainder of the alternative rendering found in the audit trail.'
