  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: ta
  text: ஒவ்வொரு பள்ளத்தாக்கும் நிரப்பப்படும்[a]; ஒவ்வொரு மலையும் குன்றும் தாழ்த்தப்படும். கோணலான இடங்கள் நேராக்கப்படும்[b]; கரடுமுரடான இடங்கள் மென்மையான வழிகளாக மாற்றப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு பள்ளமும் நிரப்பப்படும்.”
    reason: lexical_alternative
  - marker: b
    text: இந்த வரி ஏசாயா 40:4-ஐ எதிரொலிக்கிறது; ஆண்டவருடைய வழியை ஆயத்தப்படுத்துவதைச் சாலை அமைக்கும் படிமத்தால் எடுத்துரைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: ஒவ்வொரு பள்ளத்தாக்கும்
  rationale: φάραγξ என்பது பள்ளத்தாக்கு, குறுகிய பள்ளம் அல்லது மலை இடுக்கு என்பதைக் குறிக்கலாம். தீர்க்கதரிசன நிலச்சீரமைப்புக் காட்சியில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘பள்ளத்தாக்கு’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πληρωθήσεται
  choice: நிரப்பப்படும்
  rationale: πληρόω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம்; நிலப்பரப்பிலுள்ள பள்ளம் நிரப்பப்படுவதை நேரடியாகக் காட்டுகிறது.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: ஒவ்வொரு மலையும் குன்றும்
  rationale: ὄρος, βουνός ஆகிய இரு நில உயர்வுகளையும் தனித்தனியாகப் பாதுகாத்து, மூலத்தின் கவித்துவ நிறைவைத் தக்கவைக்கிறது.
- source_word: ταπεινωθήσεται
  choice: தாழ்த்தப்படும்
  rationale: இங்கு உயர்ந்த நிலம் தாழ்த்தப்படுவதே நேரடிப் பொருள். அதே வேளையில், சொல்லிலுள்ள தீர்க்கதரிசன ஒலிநயத்தையும் ‘தாழ்த்தப்படும்’ தக்கவைக்கிறது.
- source_word: τὰ σκολιά
  choice: கோணலான இடங்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நடுநிலைப் பன்மை அடைமொழி. ‘இடங்கள்’ என்பது சாலை அமைக்கும் நிலக்காட்சியைத் தெளிவாக்குகிறது; ‘பாதைகள்’ என்று மூலத்தைவிட மிகுதியாகக் குறிப்பாக்கவில்லை.
- source_word: εἰς εὐθείαν
  choice: நேராக்கப்படும்
  rationale: 'மாற்றத்தின் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது: கோணலாக இருப்பவை நேராக ஆக்கப்படுகின்றன.'
- source_word: αἱ τραχεῖαι
  choice: கரடுமுரடான பாதைகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெண்பால் பன்மை அடைமொழி; சூழலில் விடுபட்டுள்ள பாதை அல்லது வழி என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς ὁδοὺς λείας
  choice: சீரான சாலைகளாகும்
  rationale: ὁδούς என்பது சாலைகள் அல்லது வழிகள்; λείας என்பது வழுவழுப்பான, சீரான நிலையைச் சுட்டுகிறது. ‘சீரான சாலைகள்’ நவீன தமிழில் இயல்பாக இருந்து, செப்பனிடப்பட்ட சாலைப் படிமத்தைத் தருகிறது.
theological_decisions:
- issue: ஏசாயா 40:4-இலிருந்து வரும் தீர்க்கதரிசன நிலப்பரப்பு மற்றும் சாலை அமைப்புப் படிமம்
  choice: நிலத்தையும் சாலையையும் சீரமைக்கும் நேரடியான படிமத்தைத் தக்கவைத்தல்
  alternative: ‘தாழ்மையானவர்கள் உயர்த்தப்படுவார்கள்; பெருமையுள்ளவர்கள் தாழ்த்தப்படுவார்கள்’ போன்ற முற்றிலும் அறநெறி அல்லது ஆன்மிக விளக்கவுரை
  rationale: இந்த வசனம் ஆண்டவருக்கான வழியை ஆயத்தப்படுத்துவதை நிலப்பரப்பு மற்றும் சாலை அமைப்பின் காட்சியால் கூறுகிறது. அதன் இறையியல் உட்பொருளை மொழிபெயர்ப்பிலேயே ஒரே விளக்கமாக மாற்றாமல், மூலத்தின் கவித்துவத்தையும் உண்மையான உருவகத் திறப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கையாளுகிறது. ‘மலை—குன்று’, ‘கோணல்—நேர்’, ‘கரடுமுரடு—சீர்’ ஆகிய எதிரிணைகள் மூலத்தின் கவித்துவச் சாலைப் படிமத்தைத் தக்கவைக்கின்றன.
