  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: ta
  text: மெல்கியின் மகன்[a], அத்தியின் மகன், கோசாமின் மகன், எல்மதாமின் மகன், ஏரின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ஒவ்வொரு பெயருக்கும் முன் ‘του’ என்ற உடைமை/தொடர்பைக் குறிக்கும் வடிவம் மீள்கிறது. சுற்றியுள்ள வம்சவரிசைச் சூழல் காட்டும் உறவைத் தெளிவாக்குவதற்காகத் தமிழில் ‘மகன்’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: லூக்காவின் வம்சவரிசைச் சூழலில், ஒவ்வொரு பெயருடனும் வரும் உடைமை வேற்றுமை உருபு முன் கூறப்பட்ட ‘மகன்’ என்ற உறவைத் தொடர்ந்து குறிக்கிறது. தமிழில் வெறும் ‘…இன்’ என்று மொழிபெயர்ப்பது தெளிவற்றதாக இருப்பதால், குறிப்பாக உள்ள ‘மகன்’ என்பதை வெளிப்படையாக வழங்குகிறது.
- source_word: Μελχὶ
  choice: மெல்கி
  rationale: கிரேக்கப் பெயரின் ஒலிப்பை இயல்பான தமிழ் எழுத்துப்பெயர்ப்பில் தருகிறது.
- source_word: Ἀδδὶ
  choice: அத்தி
  rationale: கிரேக்க இரட்டை டெல்டாவின் ஒலியைத் தமிழ் ஒலிமுறைக்கு ஏற்ற ‘த்தி’ என எழுத்துப்பெயர்க்கிறது.
- source_word: Κωσὰμ
  choice: கோசாம்
  rationale: கிரேக்கப் பெயரின் நீண்ட உயிரொலிகளையும் மெய்யொலியையும் இயல்பான தமிழ் வடிவில் பிரதிபலிக்கிறது.
- source_word: Ἐλμαδὰμ
  choice: எல்மதாம்
  rationale: கிரேக்கப் பெயரை அதன் ஒலியமைப்புக்கு நெருக்கமான, வாசிக்க எளிய தமிழ் வடிவில் தருகிறது.
- source_word: Ἢρ
  choice: ஏர்
  rationale: கிரேக்க ஏட்டாவின் நீண்ட ‘ஏ’ ஒலியையும் இறுதி ரோவையும் நேரடியாகப் பிரதிபலிக்கிறது.
