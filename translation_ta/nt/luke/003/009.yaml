id: LUK.3.9
reference: Luke 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ta
  text: இப்போதே மரங்களின் வேரருகே கோடரி வைக்கப்பட்டுள்ளது. ஆகவே, நல்ல கனி கொடுக்காத ஒவ்வொரு மரமும் வெட்டப்பட்டு நெருப்பில் எறியப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: இப்போதே
  rationale: ἤδη என்பதன் உடனடித் தன்மையையும் καὶ தரும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் உணர்த்துகிறது; δὲ இங்கு உரையோட்டத் தொடர்பைக் குறிக்கிறது.
- source_word: ἡ ἀξίνη
  choice: கோடரி
  rationale: மரத்தை வெட்டும் கருவியைக் குறிக்கும் தெளிவான, பொதுவழக்கிலுள்ள தமிழ் சொல்.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: மரங்களின் வேரருகே கோடரி வைக்கப்பட்டுள்ளது
  rationale: கோடரி வெட்டுவதற்குத் தயாராக வேரின் அருகில் இருப்பதை இயல்பாக வெளிப்படுத்துகிறது; κεῖται என்பதன் நிலைப்பட்டிருக்கும் பொருளை ‘வைக்கப்பட்டுள்ளது’ காக்கிறது.
- source_word: πᾶν οὖν δένδρον
  choice: ஆகவே, ... ஒவ்வொரு மரமும்
  rationale: οὖν குறிக்கும் முடிவுறுத்தும் தொடர்பையும் πᾶν குறிக்கும் அனைத்தையும் தனித்தனியாக உள்ளடக்கும் வலிமையையும் காக்கிறது.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: நல்ல கனி கொடுக்காத
  rationale: பழமொழிப் படிமத்துக்கும் ஒழுக்க/ஆவிக்குரிய விளைவைக் குறிக்கும் உருவகத்துக்கும் ஏற்ற இயல்பான தமிழ் சொற்றொடர்.
- source_word: ἐκκόπτεται
  choice: வெட்டப்பட்டு
  rationale: மரத்தை அடியோடு வெட்டும் காட்சியைத் தெளிவாகத் தருகிறது; அடுத்த இணை வினையோடு தமிழ் தொடரமைப்பில் இயல்பாக இணைகிறது.
- source_word: εἰς πῦρ βάλλεται
  choice: நெருப்பில் எறியப்படுகிறது
  rationale: εἰς என்பதன் உள்ளே செலுத்தும் திசையையும் βάλλεται என்பதன் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: நெருப்பைக் கொண்ட நியாயத்தீர்ப்பு உருவகம்
  choice: கோடரி, கனி கொடுக்காத மரம், நெருப்பு ஆகிய வேளாண் உருவகங்களை விளக்கிச் சுருக்காமல் அப்படியே வைத்தல்
  alternative: நெருப்பை நரகம் என்று நேரடியாக விளக்குதல் அல்லது இதை இஸ்ரவேலுக்கான வரலாற்றுத் தீர்ப்பாக மட்டும் கட்டுப்படுத்துதல்
  rationale: வசனம் உடனடியும் கடுமையுமான நியாயத்தீர்ப்பை உணர்த்துகிறது; ஆனால் நெருப்பின் முழுக் குறிப்பைத் தானாக வரையறுக்கவில்லை. ஆகவே அதன் இறையியல் பதற்றமும் பரந்த குறிப்பும் பாதுகாக்கப்படுகின்றன.
- issue: நிகழ்கால செயப்பாட்டு வினைகளின் வலிமை
  choice: ‘வெட்டப்பட்டு நெருப்பில் எறியப்படுகிறது’ என்று நிகழ்காலப் பொதுவிதி/உறுதியான விளைவாக மொழிபெயர்த்தல்
  alternative: ‘வெட்டப்பட்டு ... எறியப்படும்’ என்று எதிர்காலமாக்குதல்
  rationale: ἐκκόπτεται மற்றும் βάλλεται இரண்டும் நிகழ்கால செயப்பாட்டு வடிவங்கள். தமிழில் நிகழ்காலம் தீர்ப்பின் உறுதியையும் பொதுவிதித் தன்மையையும் காக்கிறது; அதை வெளிப்படையான எதிர்காலமாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதானதாயும், எச்சரிக்கையின் கண்ணியமும் தீவிரமும் நிலைத்திருக்குமாறும் அமைக்கப்பட்டது. தேவையற்ற வடமொழிச் சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டன.
