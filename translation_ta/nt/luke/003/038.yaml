translation:
  language: ta
  text: ஏனோசின் மகன்[a], சேத்தின் மகன், ஆதாமின் மகன், கடவுளின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘ஏனோசின், சேத்தின், ஆதாமின், கடவுளின்’ என ஒரே வம்சவரலாற்று அமைப்பு தொடர்ந்து வருகிறது; அந்த அமைப்பிலிருந்து ‘மகன்’ என்பது தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: ஏனோசின் மகன்
  rationale: முந்தைய வசனங்களிலிருந்து தொடரும் வம்சவரலாற்றுச் சொற்றொடரில், உடைமை வேற்றுமை வடிவம் விடுபட்டுள்ள ‘மகன்’ என்ற உறவுச்சொல்லைக் குறிக்கிறது. தமிழில் உறவு தெளிவாக இருக்க ‘மகன்’ சேர்க்கப்பட்டுள்ளது; Ἐνώς என்பது ‘ஏனோஸ்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ Σὴθ
  choice: சேத்தின் மகன்
  rationale: அதே வம்சவரலாற்று அமைப்பின்படி மகனுறவு வெளிப்படையாகக் கூறப்பட்டுள்ளது. Σήθ என்ற பெயர் தமிழில் வழக்கமான ‘சேத்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ Ἀδὰμ
  choice: ஆதாமின் மகன்
  rationale: Ἀδάμ இங்கு பொதுப்பெயரான ‘மனிதன்’ என்று அல்லாமல் ஆட்பெயராக வருகிறது. ஆகவே ‘ஆதாம்’ என ஒலிபெயர்த்து, தொடரின் மகனுறவு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: இறுதி உடைமை வேற்றுமைத் தொடரும் முன் வரும் வம்சவரலாற்று அமைப்பையே பின்பற்றுவதால், விடுபட்டுள்ள உறவுச்சொல் ‘மகன்’ என வழங்கப்பட்டுள்ளது. θεός என்பதற்கு இயல்பான நவீனத் தமிழில் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஆதாமின் வம்சவரலாற்றில் வரும் இறுதித் தொடர் τοῦ θεοῦ
  choice: கடவுளின் மகன்
  alternative: கடவுளுடையவர் / கடவுளிடமிருந்து வந்தவர்
  rationale: கிரேக்கத்தில் இது வடிவரீதியாக உடைமை வேற்றுமைத் தொடர் மட்டுமே. எனினும், வம்சவரலாறு முழுவதும் தொடரும் அதே அமைப்பு மகனுறவைக் குறிக்கிறது. ‘கடவுளின் மகன்’ என்பது அந்த இலக்கியத் தொடரையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது; அதேவேளையில் ஆதாமின் மகன்நிலையைப் பற்றிய பிற்காலக் கோட்பாட்டு விளக்கங்களை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சவரலாற்று நடையும் கண்ணியமான பொதுமொழியும் பயன்படுத்தப்பட்டுள்ளன. பெயர்கள் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் மீளுருவாக்க அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
