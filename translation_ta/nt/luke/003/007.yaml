base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ta
  text: ஆகவே, அவரால் திருமுழுக்கு பெறுவதற்காக வெளியே வந்துகொண்டிருந்த மக்கள் கூட்டத்தினரிடம் அவர், “விரியன் பாம்புகளின் குட்டிகளே,[a] வரவிருக்கும் கடுங்கோபத்திலிருந்து[b] தப்பியோடும்படி உங்களை எச்சரித்தது யார்?” என்று சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரியன் பாம்புகளின் சந்ததிகளே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வரப்போகும் கடுங்கோபத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்து அல்லது பலமுறை சொல்லிவந்ததைக் குறிக்கலாம்; தமிழ் தொடர்நிலை வடிவம் அந்த அம்சத்தை அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளோடு உள்ள கதை மற்றும் கருத்துத் தொடர்ச்சியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: வெளியே வந்துகொண்டிருந்த மக்கள் கூட்டத்தினரிடம்
  rationale: மக்கள் யோவானை நோக்கி வெளியே வந்துகொண்டிருந்த இயக்கத்தையும், பன்மையான கூட்டங்களைக் குறிக்கும் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: தம்மால் திருமுழுக்கு பெறுவதற்காக
  rationale: செயப்பாட்டு வினையின் பொருளையும் நோக்கத்தையும் காக்கிறது; ‘தம்மால்’ என்பது பேசியவராகிய யோவானையே சுட்டுகிறது, பெயரை உரையில் சேர்ப்பதில்லை.
- source_word: Γεννήματα ἐχιδνῶν
  choice: விரியன் பாம்புகளின் குட்டிகளே
  rationale: γέννημα என்பதிலுள்ள பிறப்பு/வழித்தோன்றல் படிமத்தையும் ἐχιδνῶν என்பதிலுள்ள நச்சுப்பாம்பு படிமத்தையும் ordinary modern Tamil-இல் நேரடியாகவும் கடுமையாகவும் வெளிப்படுத்துகிறது.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: உங்களை எச்சரித்தது யார்
  rationale: வரவிருக்கும் ஆபத்தைக் குறித்த சூழலில் ὑποδείκνυμι என்பதன் அறிவுறுத்தல் அல்லது எச்சரிக்கைத் தன்மையை இயல்பாகத் தருகிறது.
- source_word: φυγεῖν
  choice: தப்பியோடும்படி
  rationale: ஆபத்திலிருந்து ஓடிச்செல்லும் உயிரோட்டமான படிமத்தையும், எச்சரித்ததன் உட்பொருள் நிறைவு வினையையும் காக்கிறது.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: வரவிருக்கும் கடுங்கோபத்திலிருந்து
  rationale: μέλλουσα குறிக்கும் எதிர்வரும் தன்மையையும் ὀργή குறிக்கும் தீவிரமான கோபம்/சினத்தையும் காக்கிறது; தீர்ப்பின் காலம் அல்லது வடிவத்தை மொழிபெயர்ப்பு குறுக்கவில்லை.
theological_decisions:
- issue: யோவானின் எச்சரிக்கையில் ὀργή என்பதன் இயல்பு
  choice: கடுங்கோபம்
  alternative: இறைத்தீர்ப்பு; வரவிருக்கும் தண்டனை
  rationale: சூழல் மனந்திரும்புதலையும் தேவனுடைய தீர்ப்பையும் சுட்டினாலும், மூலச்சொல் நேரடியாக ‘கோபம்/சினம்’ என்கிறது. ‘கடுங்கோபம்’ அந்தத் திறந்த பொருளைக் காத்து, அது இறுதிக்காலத் தீர்ப்பா அல்லது வரலாற்றுக்குள் நிகழும் தீர்ப்பா என்பதைத் தனியாக நிர்ணயிப்பதில்லை.
- issue: βαπτισθῆναι என்பதில் திருமுழுக்கின் முறை
  choice: திருமுழுக்கு பெற
  alternative: நீராட்டுப் பெற
  rationale: இது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்படும் செயற்பெயர். இவ்வசனம் சடங்கின் முறையை விளக்காததால், மொழிபெயர்ப்பு மூழ்கடித்தல் அல்லது நீர் தெளித்தல் போன்ற ஒரு குறிப்பிட்ட முறையை விளக்கமாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. யோவானின் கடுமையான அழைப்பு மென்மையாக்கப்படவில்லை. தொடர்நிலை வினைகள் கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தையும் நிகழ்ந்துகொண்டிருந்த வருகையையும் பிரதிபலிக்கின்றன; இறைத்தீர்ப்பின் துல்லியமான காலம் அல்லது கோட்பாட்டுச் சட்டகம் சேர்க்கப்படவில்லை.
