source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: ta
  text: அவருடைய தூற்றுவாரி[a] அவர் கையில் இருக்கிறது. அவர் தமது களத்தை முற்றிலும் சுத்தம் செய்து, கோதுமையைத் தமது களஞ்சியத்தில்[b] சேர்ப்பார்; ஆனால் பதரை அணைக்க முடியாத நெருப்பால்[c] முற்றிலும் எரித்துவிடுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூற்றும் மண்வாரி’ என்றும் மொழிபெயர்க்கலாம். தானியத்தையும் பதரையும் பிரிக்க அவற்றை மேலே வீசப் பயன்படும் கருவியை கிரேக்கச் சொல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, தானியச் சேமிப்பிடம்.
    reason: lexical_clarification
  - marker: c
    text: அல்லது ‘அணையாத நெருப்பால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: தூற்றுவாரி
  rationale: தானியத்தையும் பதரையும் பிரிப்பதற்காக அவற்றை மேலே வீசப் பயன்படும் வேளாண் கருவியைக் குறிக்கிறது. ‘தூற்றுவாரி’ என்பது கருவியின் செயலையும் களச் சூழலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: διακαθᾶραι
  choice: முற்றிலும் சுத்தப்படுத்தி
  rationale: களத்தை முழுமையாகச் சுத்தம் செய்யும் தீவிரமான செயலைக் கூட்டுவினையின் வலியுறுத்தலுடன் தெரிவிக்கிறது.
- source_word: ἅλωνα
  choice: களம்
  rationale: தானியம் போரடிக்கப்பட்டுத் தூற்றப்படும் இடத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; வேளாண் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: συναγαγεῖν
  choice: சேர்ப்பார்
  rationale: பிரித்தெடுக்கப்பட்ட கோதுமையை ஓரிடத்தில் திரட்டிக் களஞ்சியத்துக்குள் வைக்கும் செயலை இயல்பாகக் கூறுகிறது.
- source_word: σῖτον
  choice: கோதுமை
  rationale: சொல் பொதுவாகத் தானியத்தைக் குறிக்கக்கூடியதாயினும், பதருடனான இச்சூழல்சார் எதிரிணையில் ‘கோதுமை’ பொருத்தமானது.
- source_word: ἀποθήκην
  choice: களஞ்சியம்
  rationale: தானியத்தைச் சேமிக்கும் இடத்தைத் துல்லியமாகவும், கட்டிடத்தின் வடிவத்தைத் தேவையின்றிக் குறிப்பாக்காமலும் தெரிவிக்கிறது.
- source_word: ἄχυρον
  choice: பதர்
  rationale: தூற்றும்போது தானியத்திலிருந்து பிரிக்கப்படும் பயனற்ற உமி போன்ற கழிவைக் குறிக்கும் பொருத்தமான தமிழ்ச் சொல்.
- source_word: κατακαύσει
  choice: முற்றிலும் எரித்துவிடுவார்
  rationale: கூட்டுவினையில் உள்ள முழுமையாக எரித்தழிக்கும் வலிமையை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: πυρὶ ἀσβέστῳ
  choice: அணைக்க முடியாத நெருப்பில்
  rationale: அந்த நெருப்பை அணைக்க இயலாது என்பதைக் கூறி, மூலத்தின் தீர்ப்புப் படிமத்தின் வலிமையை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: οὗ
  choice: அவருடைய
  rationale: வரவிருக்கிறவரைக் குறிக்கும் உறவுப்பெயரின் உடைமைப் பொருளைத் தமிழில் இயல்பான வாக்கியத் தொடக்கமாக வழங்குகிறது.
theological_decisions:
- issue: வேளாண் உருவகத்திலுள்ள பிரித்தலும் தீர்ப்பும்
  choice: கோதுமை களஞ்சியத்தில் சேர்க்கப்படுவதையும் பதர் அணைக்க முடியாத நெருப்பில் எரிக்கப்படுவதையும் அப்படியே வைத்துக் காப்பும் தீர்ப்பும் கொண்ட பிரித்தலை வெளிப்படுத்துதல்
  alternative: இதை இஸ்ரவேலுக்கு ஏற்பட்ட வரலாற்றுத் தீர்ப்பாக மட்டும் வரையறுத்தல், அல்லது இறுதி நரகத்தைப் பற்றிய முழுமையான கோட்பாட்டு விளக்கமாக விரிவாக்குதல்
  rationale: வசனம் தெளிவாகப் பிரித்தலையும் தீர்ப்பையும் சித்தரிக்கிறது; ஆனால் அந்தத் தீர்ப்பு எவ்வாறு நிறைவேறும் என்பதை இதற்கு அப்பால் விளக்கவில்லை. ஆகவே மூலத்தின் வலிமையும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வேளாண் படிமத்தைத் தக்கவைக்க ‘தூற்றுவாரி,’ ‘களம்,’ ‘பதர்’ ஆகிய சூழல்சார் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; அரிதாக இருக்கக்கூடிய கருவிச் சொல்லுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது.
