  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: ta
  text: மெலேயாவின் மகன்[a], மென்னாவின் மகன்[b], மத்தத்தாவின் மகன், நாத்தானின் மகன், தாவீதின் மகன்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், ‘மெலேயாவின், மென்னாவின், மத்தத்தாவின், நாத்தானின், தாவீதின்’ என்று உள்ளது; லூக்காவின் வம்சவரலாற்றில் திரும்பத் திரும்ப வரும் இந்த அமைப்பு சூழலின்படி ‘மகன்’ என்பதை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகளில் இந்தப் பெயர் வேறொரு வடிவத்தில் காணப்படுகிறது; இங்கு பின்பற்றப்படும் SBLGNT கிரேக்க மூலபாடம் Μεννά (‘மென்னா’) என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன் / …வின் மகன்
  rationale: இந்த வம்சவரலாற்றின் விரிந்த வாக்கிய அமைப்பில், மீண்டும் மீண்டும் வரும் உறவுநிலை வேற்றுமை உருபு தந்தை–மகன் உறவைக் குறிப்பால் உணர்த்துகிறது. இயல்பான தமிழுக்காக ஒவ்வொரு பெயருடனும் ‘மகன்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: Μελεὰ
  choice: மெலேயா
  rationale: கிரேக்கப் பெயரின் ஒலிவடிவத்தை நவீன தமிழில் இயல்பாக எடுத்துரைக்கும் ஒலிபெயர்ப்பு.
- source_word: Μεννὰ
  choice: மென்னா
  rationale: SBLGNT மூலத்தில் உள்ள Μεννά என்ற வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ματταθὰ
  choice: மத்தத்தா
  rationale: கிரேக்க Ματταθά பெயரின் மெய்யொலி அமைப்பைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ναθὰμ
  choice: நாத்தான்
  rationale: கிரேக்க Ναθάμ குறிக்கும் எபிரேய வேதாகமப் பெயருக்கு தமிழில் ஏற்கெனவே அறிமுகமான ‘நாத்தான்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: இந்த வேதாகமப் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வடிவம்; கிரேக்க Δαυίδ குறிக்கும் நபரைத் தெளிவாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: வம்சவரலாற்றில் விடுபட்டிருக்கும் உறவுச் சொல்
  choice: ஒவ்வொரு பெயருக்கும் ‘மகன்’ என்பதை வெளிப்படையாகச் சேர்த்தல்
  alternative: ‘மெலேயாவினுடையவர், மென்னாவினுடையவர்…’ என உறவுநிலை வடிவத்தை மட்டும் தருதல்
  rationale: கிரேக்கத்தில் பெயர்களுக்கு முன்னால் திரும்பத் திரும்ப வரும் τοῦ, சுற்றியுள்ள வம்சவரலாற்று வாக்கிய அமைப்பைச் சார்ந்து ‘மகன்’ என்பதை உணர்த்துகிறது. ‘மகன்’ என்று சேர்ப்பது புதிய இறையியல் தகவலைப் புகுத்தாமல், தமிழில் அந்த உறவை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; வம்சவரலாற்றுப் பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. பெயர்கள் கிரேக்க மூலத்தை முதன்மையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன; நாத்தான், தாவீது ஆகிய அறிமுகமான வேதாகமப் பெயர்களுக்கு நிலைபெற்ற தமிழ் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
