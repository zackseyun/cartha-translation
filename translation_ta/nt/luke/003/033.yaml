id: LUK.3.33
reference: Luke 3:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ ⸂Ἀμιναδὰβ τοῦ Ἀδμὶν τοῦ Ἀρνὶ⸃ τοῦ Ἑσρὼμ τοῦ Φαρὲς τοῦ Ἰούδα
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: ta
  text: அம்மினதாபின் மகன்[a], அத்மீனின் மகன், அர்னியின் மகன், எஸ்ரோனின் மகன், பேரேஸின் மகன், யூதாவின் மகன்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அம்மினதாபின் மகன், அத்மீனின் மகன், அராமின் மகன்” என்று உள்ளது; வேறு சில பிரதிகள் “அத்மீனின் மகன்” என்பதை விடுத்து, “அம்மினதாபின் மகன், அராமின் மகன்” என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: லூக்காவின் வம்சவரலாற்றில் ஒவ்வொரு பெயருக்கும் முன் திரும்பத் திரும்ப வரும் வேற்றுமை உருபு, முந்தைய வசனத்திலிருந்து தொடரும் தந்தை–மகன் உறவைச் சுருக்கமாகக் குறிக்கிறது. தமிழில் வெறும் உடைமை வேற்றுமையை மட்டும் பயன்படுத்துவது இயல்பாக இருக்காது; ஆகவே மறைந்துள்ள உறவு ‘…இன் மகன்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Ἀμιναδάβ
  choice: அம்மினதாப்
  rationale: கிரேக்கப் பெயரையும் பழைய ஏற்பாட்டில் அறியப்படும் செமித்தியப் பெயரையும் அடையாளம் காண உதவும் தமிழாக்கம்.
- source_word: Ἀδμίν
  choice: அத்மீன்
  rationale: SBLGNT முதன்மைப் பாடத்தில் உள்ள கிரேக்கப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; பாடவேறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Ἀρνί
  choice: அர்னி
  rationale: SBLGNT-யில் அச்சிடப்பட்டுள்ள பெயரை நேரடியாக ஒலிபெயர்க்கிறது; ‘அராம்’ என்ற பாடவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: Ἑσρώμ
  choice: எஸ்ரோன்
  rationale: கிரேக்க வடிவத்துக்குப் பின்னுள்ள பழைய ஏற்பாட்டுப் பெயரைத் தமிழில் எளிதாக அடையாளம் காணச் செய்யும் வடிவம்.
- source_word: Φαρές
  choice: பேரேஸ்
  rationale: பழைய ஏற்பாட்டுப் பெயருடன் ஒத்திசையும், நவீன தமிழில் தெளிவான வடிவம்.
- source_word: Ἰούδα
  choice: யூதா
  rationale: இங்கு புதிய ஏற்பாட்டின் ‘யூதாஸ்’ என்ற பெயருடைய நபர்களைக் குறிக்காமல், பழைய ஏற்பாட்டின் கோத்திரத் தந்தையான யூதாவைக் குறிப்பதால் வழக்கமான ‘யூதா’ பயன்படுத்தப்பட்டுள்ளது.
