  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றின் தொடர்ச்சியான ஓசையையும் அமைப்பையும் காக்கும் வகையில் ஒவ்வொரு பெயருடனும் ‘மகன்’ திரும்பக் கூறப்பட்டுள்ளது. பெயர்கள் வாசிக்க எளிதான, மரியாதைக்குரிய வேதாகம நடையில் வழங்கப்பட்டுள்ளன.
