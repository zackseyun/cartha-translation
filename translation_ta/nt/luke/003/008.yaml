  source_fidelity: The Tamil accurately represents the imperative force of ποιήσατε, the plural καρπούς, the correspondence expressed by ἀξίους τῆς μετανοίας, the prohibition against initiating the ancestry-based claim, and God's ability to raise up children for Abraham from the stones. “உங்களுக்குள்” appropriately leaves ἐν ἑαυτοῖς open to either inward or group-directed speech.
