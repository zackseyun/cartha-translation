id: LUK.3.8
reference: Luke 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ta
  text: ஆகையால், மனந்திரும்புதலுக்கு ஏற்ற கனிகளைக் கொடுங்கள்[a]. ‘ஆபிரகாம் எங்களுக்குத் தந்தையாக இருக்கிறார்’ என்று உங்களுக்குள் சொல்லத் தொடங்காதீர்கள்[b]. ஏனெனில், இந்தக் கற்களிலிருந்தும் ஆபிரகாமுக்குப் பிள்ளைகளை எழுப்ப தேவனால் முடியும் என்று உங்களுக்குச் சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனந்திரும்புதலுக்குத் தகுதியான கனிகள்’ அல்லது ‘மனந்திரும்புதலோடு ஒத்துப்போகும் கனிகள்.’ கிரேக்கத்தில் ‘கனிகள்’ என்பது பன்மையில் உள்ளது; உண்மையான மனந்திரும்புதலுக்கு ஏற்ற நடத்தையை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் உள்ளத்தில்’ அல்லது ‘ஒருவருக்கொருவர்.’ இச்சொற்றொடர் உள்ளார்ந்த தன்னுரையையோ, தங்கள் குழுவுக்குள் அவர்கள் பேசுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: கொடுங்கள்
  rationale: ‘கனிகள்’ என்பதுடன் தமிழில் இயல்பாக அமையும் வினை; இறந்தகால ஏவல் வடிவின் தீர்மானமான கட்டளையையும் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய எச்சரிக்கையிலிருந்து வரும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: மனந்திரும்புதலுக்கு ஏற்ற கனிகள்
  rationale: கிரேக்கப் பன்மையான ‘கனிகள்’ என்பதையும், மனந்திரும்புதலோடு ஒத்துப்போகும் நடத்தையைச் சுட்டும் ἀξίους என்பதையும் காக்கிறது.
- source_word: μὴ ἄρξησθε λέγειν
  choice: சொல்லத் தொடங்காதீர்கள்
  rationale: இந்தத் தற்காப்புக் கூற்றைச் சொல்ல ஆரம்பிப்பதையே தடைசெய்யும் மூலமொழிக் கட்டமைப்பை நேரடியாக வழங்குகிறது.
- source_word: ἐν ἑαυτοῖς
  choice: உங்களுக்குள்
  rationale: உள்ளார்ந்த தன்னுரை அல்லது தங்கள் குழுவுக்குள் பேசுதல் என்ற இரு சாத்தியங்களையும் தமிழில் திறந்துவைக்கிறது.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: ஆபிரகாம் எங்களுக்குத் தந்தையாக இருக்கிறார்
  rationale: ஆபிரகாமிய வம்சத்தைத் தமக்கான பாதுகாப்பாக முன்வைக்கும் உறவுக் கூற்றை இயல்பான தமிழில் தருகிறது.
- source_word: δύναται ὁ θεὸς
  choice: தேவனால் முடியும்
  rationale: கடவுளின் ஆற்றலை வலியுறுத்தும் இயல்பான, கண்ணியமான தமிழ் அமைப்பு.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: இந்தக் கற்களிலிருந்தும் ஆபிரகாமுக்குப் பிள்ளைகளை எழுப்ப
  rationale: ‘எழுப்ப’ என்பது ἐγεῖραι என்பதன் உருவக வலிமையைப் பேணுகிறது; ‘இருந்தும்’ என்பது இப்படிப்பட்ட எதிர்பாராத மூலத்தில்கூட தேவன் செயல்பட முடியும் என்ற அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மனந்திரும்புதலுக்கு ஏற்ற கனிகள்’ என்பதன் பொருள்
  choice: உண்மையான மனந்திரும்புதலோடு ஒத்துப்போகும் வெளிப்படையான செயல்கள்
  alternative: ‘மனந்திரும்புதலுக்குத் தகுதியான கனிகள்’ அல்லது ‘மனந்திரும்புதலைக் காட்டும் கனிகள்’
  rationale: மூலவாக்கியம் நடத்தைக்கும் மனந்திரும்புதலுக்கும் உள்ள பொருத்தத்தை வலியுறுத்துகிறது; இச்செயல்கள் மன்னிப்பைச் சம்பாதிக்கின்றன என்று சேர்த்துக் கூறுவதில்லை.
- issue: ஆபிரகாமின் சந்ததி என்ற நிலையின் மதிப்பு
  choice: உடல் வழி வம்சத்தை ஆன்மீகப் பாதுகாப்புக்கான போதுமான அடிப்படையாக நம்புவதை யோவான் மறுக்கிறார்
  alternative: ஆபிரகாமிய வம்சத்துக்கே எந்த மதிப்பும் இல்லை என்று விரிவுபடுத்துதல்
  rationale: வசனம் வம்சாவளியின்மீது வைக்கும் தன்னம்பிக்கையை எதிர்க்கிறது; அதேவேளை, ஆபிரகாமுக்குப் பிள்ளைகளை எழுப்புவதில் தேவனுடைய சுதந்திரத்தையும் வல்லமையையும் உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மனந்திரும்புதல்’ பரவலாக அறியப்பட்ட துல்லியமான சொல்; ‘கனிகளைக் கொடுங்கள்’ என்பது தமிழ் உருவகப் பயன்பாட்டில் இயல்பானது. ἐν ἑαυτοῖς என்பதின் உண்மையான இருபொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
