lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: கிரேக்கத்தில் ஒவ்வொரு பெயருக்கும் முன் உரிமைவேற்றுமைச் சுட்டு மட்டும் மீண்டும் வருகிறது; சுற்றியுள்ள வம்சவரிசை அமைப்பில் மறைந்துள்ள மகன் உறவை இயல்பான தமிழில் வெளிப்படையாகக் கொடுக்கிறது.
- source_word: Ἰωανὰν
  choice: யோவானான்
  rationale: கிரேக்கப் பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: Ῥησὰ
  choice: ரேசா
  rationale: கிரேக்கப் பெயரைத் தமிழ் ஒலியமைப்புக்கு ஏற்றபடி எழுத்துப்பெயர்க்கிறது.
- source_word: Ζοροβαβὲλ
  choice: செருபாபேல்
  rationale: பழைய ஏற்பாட்டில் அறியப்படும் பெயருடன் தொடர்பு தெளிவாக இருக்கும்படி வழக்கிலுள்ள தமிழ் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: Σαλαθιὴλ
  choice: சாலத்தியேல்
  rationale: SBLGNT-இன் கிரேக்க வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு; எபிரெய மரபிலுள்ள சேயல்த்தியேல் என்ற பெயருடன் அடையாளப்படுத்தப்படுவது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: Νηρὶ
  choice: நேரி
  rationale: கிரேக்கப் பெயரின் உயிர்நீளத்தைக் காட்டும் இயல்பான தமிழ் எழுத்துப்பெயர்ப்பு.
theological_decisions:
- issue: வம்சவரிசையில் விடுபட்டுள்ள உறவுச்சொல்
  choice: ஒவ்வொரு பெயருடனும் ‘மகன்’ என்பதை வழங்குதல்
  alternative: ஒவ்வொரு பெயரையும் ‘…இன்’ என்று மட்டும் வரிசைப்படுத்துதல்
  rationale: கிரேக்கத்தின் உரிமைவேற்றுமைத் தொடரில் ‘மகன்’ என்பது சுற்றியுள்ள வம்சவரிசைச் சூழலால் மறைமுகமாக உள்ளது. அதைத் தமிழில் வெளிப்படுத்துவது உறவைத் தெளிவாக்குகிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: Σαλαθιὴλ என்ற பெயரின் வடிவம்
  choice: கிரேக்க வடிவத்துக்கு நெருக்கமான ‘சாலத்தியேல்’
  alternative: எபிரெய மரபைத் தொடர்ந்து ‘சேயல்த்தியேல்’
  rationale: மூலமாக வழங்கப்பட்ட கிரேக்க உரைக்கு முன்னுரிமை அளிக்கப்படுகிறது; பழைய ஏற்பாட்டுப் பெயருடனான மரபுவழி அடையாளம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
