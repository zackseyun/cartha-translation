  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: ta
  text: 'மெத்தூசலாவின் மகன், ஏனோக்கின் மகன், யாரேத்தின் மகன், மகலாலெயேலின் மகன், கைனாமின் மகன்[a],


    [a] கிரேக்க மூலத்தில் இப்பெயர் Καϊνάμ (கைனாம்) என்று உள்ளது. இதை “கைனான்” என்றும், பழைய ஏற்பாட்டு வம்சவரிசைகளோடு ஒத்திசைத்து “கேனான்” என்றும் வழங்குவதுண்டு. லூக்காவின் கிரேக்க உரையில் இப்பெயர் இடம்பெற்றுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் இப்பெயர் Καϊνάμ (கைனாம்) என்று உள்ளது. இதை “கைனான்” என்றும், பழைய ஏற்பாட்டு வம்சவரிசைகளோடு ஒத்திசைத்து “கேனான்” என்றும் வழங்குவதுண்டு. லூக்காவின் கிரேக்க உரையில் இப்பெயர் இடம்பெற்றுள்ளது.
    reason: மாற்றுப் பெயர்வடிவங்களையும் கிரேக்க உரையில் பெயர் இடம்பெற்றிருப்பதையும் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: τοῦ
  choice: …வின் மகன்
  rationale: வம்சவரிசையின் முந்தைய சூழலில் தொடரும் கிரேக்க உருபின் மறைபொருள் உறவைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்ட “மகன்” சேர்க்கப்பட்டது.
- source_word: Μαθουσαλά
  choice: மெத்தூசலா
  rationale: பழைய ஏற்பாட்டு நபருடன் எளிதில் அடையாளம் காணக்கூடிய, தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்.
- source_word: Ἑνώχ
  choice: ஏனோக்கு
  rationale: தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவம்.
- source_word: Ἰάρετ
  choice: யாரேத்
  rationale: கிரேக்கப் பெயரின் ஒலியையும் தமிழில் அறியப்பட்ட வேதாகம வழக்கையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: Μαλελεήλ
  choice: மகலாலெயேல்
  rationale: தொடர்புடைய பழைய ஏற்பாட்டு நபரை வாசகர் அடையாளம் காண உதவும் நிலைபெற்ற தமிழ்ப் பெயர்வடிவம்.
- source_word: Καϊνάμ
  choice: கைனாம்
  rationale: SBLGNT உரையிலுள்ள Καϊνάμ என்ற கிரேக்க வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; கைனான்/கேனான் என்ற மாற்று வடிவங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: வம்சவரிசையில் மீண்டும் வரும் உடைமை வேற்றுமையின் மறைநிறைவு
  choice: ஒவ்வொரு பெயருக்கும் “மகன்” என்று வெளிப்படையாக வழங்குதல்
  alternative: “உடையவன்/வழிவந்தவன்” போன்ற பொதுவான உறவுச் சொல்லை வழங்குதல் அல்லது வெறும் உடைமைத் தொடராக விடுதல்
  rationale: சூழலில் குறிக்கப்படும் தந்தை–மகன் வம்சத் தொடர்பைத் தமிழில் தெளிவாகக் கூறுகிறது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: Καϊνάμ என்ற பெயரின் வடிவமும் உரையில் அதன் இருப்பும்
  choice: மூல கிரேக்க வடிவத்துக்கு நெருக்கமாக “கைனாம்” என்று முதன்மை உரையில் சேர்த்தல்
  alternative: “கைனான்” அல்லது பழைய ஏற்பாட்டு வம்சவரிசையுடன் ஒத்திசைத்த “கேனான்”
  rationale: SBLGNT உரையில் பெயர் இருப்பதால் அதை நீக்காமலும் வேறு வம்சவரிசையுடன் மௌனமாக ஒத்திசைக்காமலும் மொழிபெயர்க்கிறது; அறியப்பட்ட மாற்று வடிவங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட வம்சவரிசை நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் இயன்றவரை தமிழில் அறியப்பட்ட வேதாகம வடிவங்களில் தரப்பட்டுள்ளன; ஆனால் Καϊνάμ மட்டும் மூல வடிவத்தின் தனித்தன்மையைப் பாதுகாக்க “கைனாம்” என்று வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அதற்குரிய பெயருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
