translation:
  language: ta
  text: யாக்கோபின் மகன்[a], ஈசாக்கின் மகன், ஆபிரகாமின் மகன், தேராகுவின் மகன்[b], நாகோரின் மகன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ஒவ்வொரு பெயருக்கும் ‘…இன்’ என்ற பொருளுடைய வடிவமே திரும்பத் திரும்ப வருகிறது; வம்சவரலாற்றின் அமைப்பின்படி ‘மகன்’ என்பது தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கப் பெயர் வடிவம் ‘தாரா’; பழைய ஏற்பாட்டில் அறியப்பட்ட அதே பெயருடன் ஒத்திருக்க ‘தேராகு’ என்று வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கப் பெயர் வடிவம் ‘நாகோர்’ என்பதற்கு நெருக்கமானது; பழைய ஏற்பாட்டில் அறியப்பட்ட பெயர் வடிவமே இங்கு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: கிரேக்கத்தில் ஒவ்வொரு பெயரும் உடைமை வேற்றுமையில் தொடர்கிறது; சுற்றியுள்ள வம்சவரலாற்றின் அமைப்பிலிருந்து தந்தை–மகன் உறவு புரிகிறது. இயல்பான தமிழுக்காக மறைந்துள்ள ‘மகன்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: Ἰακώβ
  choice: யாக்கோபு
  rationale: பழைய ஏற்பாட்டுத் தந்தையின் பெயருக்குத் தமிழில் பரவலாக அறியப்பட்ட வடிவம்; வேற்றுமை ஏற்கும்போது ‘யாக்கோபின்’ என வருகிறது.
- source_word: Ἰσαάκ
  choice: ஈசாக்கு
  rationale: தமிழ் வேதாகம வழக்கில் அறியப்பட்ட பெயர் வடிவம்; இங்கு ‘ஈசாக்கின்’ என வேற்றுமை பெற்றுள்ளது.
- source_word: Ἀβραάμ
  choice: ஆபிரகாம்
  rationale: தமிழில் நிலைபெற்ற பழைய ஏற்பாட்டுப் பெயர் வடிவம்; இங்கு ‘ஆபிரகாமின்’ என வருகிறது.
- source_word: Θάρα
  choice: தேராகு
  rationale: கிரேக்க வடிவம் ‘தாரா’ என்பதற்கு நெருக்கமானது; எனினும் அதே நபரைக் குறிக்கும் பழைய ஏற்பாட்டின் எபிரெயப் பெயருடன் ஒத்த, தமிழில் அறியப்பட்ட ‘தேராகு’ பயன்படுத்தப்பட்டது.
- source_word: Ναχώρ
  choice: நாகோர்
  rationale: கிரேக்க உச்சரிப்பை மட்டும் நெருக்கமாகப் பின்பற்றுவதற்குப் பதிலாக, அதே பழைய ஏற்பாட்டு நபருக்குத் தமிழில் அறியப்பட்ட ‘நாகோர்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: சுருக்கமாக விடப்பட்டுள்ள வம்ச உறவை வெளிப்படையாகக் கூறுதல்
  choice: ஒவ்வொரு பெயருடனும் ‘மகன்’ என்று வழங்குதல்
  alternative: பெயர்களை ‘…இன்’ என்ற உடைமை வேற்றுமையில் மட்டும் தொடர்ச்சியாக வழங்குதல்
  rationale: கிரேக்க மூலத்தில் மீண்டும் வரும் உடைமை வேற்றுமை, முந்தைய வசனங்களிலிருந்து புரியும் வம்ச உறவைச் சுருக்கமாகக் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்க ‘மகன்’ சேர்க்கப்படுகிறது; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், மரியாதைமிக்க வம்சவரலாற்று நடை. பெயர்களின் அடிப்படை வடிவங்கள் தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமானவையாக வைக்கப்பட்டு, வாக்கியத்தில் இயல்பான உடைமை வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
