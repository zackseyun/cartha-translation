id: LUK.3.21
reference: Luke 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: ta
  text: மக்கள் அனைவரும் திருமுழுக்குப் பெற்றபோது, இயேசுவும் திருமுழுக்குப் பெற்று ஜெபித்துக்கொண்டிருந்தார். அப்போது வானம்[a] திறக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானம்” என்பதற்கான கிரேக்கச் சொல் காணக்கூடிய ஆகாயத்தையோ பரலோகத்தையோ குறிக்கலாம். இங்கு வெளிப்பாட்டு நிகழ்வின் சூழலில் பரலோகப் பொருள் முன்னிலையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: அப்போது
  rationale: லூக்காவின் நிகழ்வை முன்னெடுத்துச் செல்லும் தொடர் அமைப்பை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத தனிப்பட்ட ‘இப்போது’ என்ற காலப்பொருளைச் சேர்ப்பதில்லை.
- source_word: ἐν τῷ βαπτισθῆναι
  choice: திருமுழுக்குப் பெற்றபோது
  rationale: ἐν உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் இங்கு காலத்தைக் குறிக்கிறது; ‘பெற்றபோது’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: ἅπαντα τὸν λαὸν
  choice: மக்கள் அனைவரும்
  rationale: மக்களை ஒரு முழுத் தொகுதியாகக் குறிப்பிடும் கிரேக்கச் சொற்றொடரின் பரப்பைத் தெளிவாகக் காக்கிறது.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: இயேசுவும் திருமுழுக்குப் பெற்று
  rationale: καί என்பதன் சேர்க்கைப் பொருளை ‘உம்’ காட்டுகிறது; வினையெச்ச வடிவம் இயேசுவின் திருமுழுக்கு ஜெபத்திற்கு முன் நிகழ்ந்ததை இயல்பாக உணர்த்துகிறது.
- source_word: καὶ προσευχομένου
  choice: ஜெபித்துக்கொண்டிருந்தார்
  rationale: முக்கிய நிகழ்வு நடந்துகொண்டிருந்த வேளையில் தொடர்ந்த செயலைக் கிரேக்க நிகழ்காலப் பங்கேற்புவினை குறிக்கிறது; தமிழ் தொடர்நிலை வடிவம் அதைத் தெளிவாக்குகிறது.
- source_word: ἀνεῳχθῆναι
  choice: திறக்கப்பட்டது
  rationale: கிரேக்கச் செயல்பாட்டு வடிவத்தின் செயப்பாட்டு நிலையைப் பாதுகாக்கிறது; ‘பிளக்கப்பட்டது’ போன்ற வலுவான உருவகத்தைச் சேர்ப்பதில்லை.
- source_word: τὸν οὐρανὸν
  choice: வானம்
  rationale: தமிழில் ‘வானம்’ என்பது காணக்கூடிய ஆகாயத்தையும் பரலோகத் தளத்தையும் குறிக்கக்கூடியதால், மூலத்தின் இயல்பான பொருள் பரப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: திருமுழுக்கு நிகழ்வில் οὐρανός என்பதன் குறிப்பு
  choice: வானம்
  alternative: விண்ணுலகம் / ஆகாயம்
  rationale: ஆவியின் இறங்குதலும் தெய்வீகக் குரலும் தொடரும் வெளிப்பாட்டு சூழலில் பரலோகப் பொருள் முன்னிலையில் உள்ளது. இருப்பினும், ‘வானம்’ என்ற தமிழ் சொல் காணக்கூடிய ஆகாயம் என்ற சாத்தியத்தையும் முற்றிலும் நீக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நிகழ்வுகளின் காலத் தொடர்பு காக்கப்பட்டுள்ளது.
