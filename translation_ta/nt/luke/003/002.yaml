id: LUK.3.2
reference: Luke 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: ta
  text: அன்னா, காய்பா ஆகியோரின் தலைமைக்குருப் பதவிக் காலத்தில்[a], வனாந்தரத்தில் இருந்த சகரியாவின் மகன் யோவானுக்குக் கடவுளின் வார்த்தை வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக மொழிபெயர்த்தால், ‘அன்னா, காய்பா ஆகியோரின் தலைமைக்குருப் பதவியில்.’ பதவி ஒருமையில் குறிப்பிடப்பட்டாலும், லூக்கா இருவரையும் பெயரிட்டு குறிப்பிடுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: அன்னா, காய்பா ஆகியோரின் தலைமைக் குருத்துவக் காலத்தில்
  rationale: ἐπί + உரிமை வேற்றுமை இங்கு காலத்தைக் குறிக்கிறது. ἀρχιερέως ஒருமையில் இருப்பதை ‘தலைமைக் குருத்துவம்’ என்ற ஒருமை நிறுவனச் சொல்லால் காத்து, லூக்கா இருவரையும் பெயரிடுவதில் உள்ள பதற்றத்தையும் அப்படியே வைக்கிறது.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: கடவுளின் வார்த்தை வந்தது
  rationale: இது இறைவாக்கு வெளிப்பாட்டைக் குறிக்கும் வேதாகம மரபுத்தொடர். ἐγένετο என்பதன் நிகழ்வுத் தன்மையை இயல்பான தமிழில் ‘வந்தது’ வெளிப்படுத்துகிறது.
- source_word: ἐπὶ Ἰωάννην
  choice: யோவானுக்கு
  rationale: வெளிப்பாட்டு வார்த்தை ஒருவரிடம் வருவதைக் குறிக்கும் ἐπί + செயப்படுபொருள் வேற்றுமைக்கு இயல்பான தமிழாக்கம்.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: சகரியாவின் மகன்
  rationale: யோவானை அடையாளப்படுத்தும் உடனிலைத் தொடரை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: ἔρημος என்பது மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த காட்டுப்புறப் பகுதியையும் குறிக்கிறது; ‘வனாந்தரம்’ வேதாகமச் சூழலுக்கு ஏற்ற துல்லியமான சொல்.
theological_decisions:
- issue: ஒருமையான ἀρχιερέως என்பதுடன் அன்னா, காய்பா ஆகிய இருவரும் குறிப்பிடப்படுதல்
  choice: ‘அன்னா, காய்பா ஆகியோரின் தலைமைக் குருத்துவக் காலத்தில்’ என்று ஒருமை நிறுவனத் தன்மையைத் தக்கவைத்தல்
  alternative: ‘அன்னாவும் காய்பாவும் தலைமைக் குருக்களாக இருந்தபோது’
  rationale: மாற்று வடிவம் இருவரும் ஒரே விதத்தில் ஒரே நேரத்தில் பதவி வகித்ததாகச் சீராக்கக்கூடும். மூலத்தின் ஒருமையையும் இரு பெயர்களையும் காப்பது வரலாற்று மற்றும் இலக்கியப் பதற்றத்தைத் தீர்க்காமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தலைமைக் குருத்துவம்’ என்ற நிறுவனச் சொல் மூலத்தின் ஒருமையைப் பாதுகாக்கிறது; ‘வனாந்தரம்’ என்பது வெறும் மணற்பாலை என்ற தவறான குறுக்கலைத் தவிர்க்கிறது.
