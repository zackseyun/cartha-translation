id: LUK.3.4
reference: Luke 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ta
  text: 'இறைவாக்கினரான ஏசாயாவின் வார்த்தைகள் அடங்கிய நூலில் எழுதப்பட்டிருப்பதுபோல்: “பாலைநிலத்தில்[b] உரக்கக் கூப்பிடுகிற ஒருவரின் குரல்: ‘ஆண்டவரின்[a] வழியை ஆயத்தப்படுத்துங்கள்; அவருடைய பாதைகளை நேராக்குங்கள்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “ஆண்டவர்” என்று மொழிபெயர்க்கப்பட்டுள்ள மேற்கோள் ஏசாயா 40:3-ஐ எதிரொலிக்கிறது; அதன் எபிரெய உரையில் YHWH என்ற இறைப்பெயர் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: '“பாலைநிலத்தில்” என்பதை “உரக்கக் கூப்பிடுகிற” என்பதுடன் இங்கு இணைத்துள்ளோம். இதை அடுத்த கட்டளையுடன் இணைத்து, “ஒருவர் உரக்கக் கூப்பிடும் குரல்: ‘பாலைநிலத்தில் ஆண்டவரின் வழியை ஆயத்தப்படுத்துங்கள்’” என்றும் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: எழுதப்பட்டிருப்பதுபோல்
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் நிலைத்த விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν βίβλῳ λόγων
  choice: வார்த்தைகள் அடங்கிய நூலில்
  rationale: இரு பெயர்ச்சொற்களையும் கருத்தளவில் காத்து, சொல்லுக்குச் சொல் மொழிபெயர்ப்பால் ஏற்படும் இயல்பின்மையைத் தவிர்க்கிறது.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: இறைவாக்கினரான ஏசாயாவின்
  rationale: ஏசாயாவை இறைவாக்கினராக அடையாளப்படுத்தும் கிரேக்க இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: Φωνὴ βοῶντος
  choice: உரக்கக் கூப்பிடுகிற ஒருவரின் குரல்
  rationale: βοάω என்பதன் உரத்த அழைப்பையும், பங்கேற்பு வினையின் நபர்சார்ந்த பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: பாலைநிலத்தில்
  rationale: மக்கள் குடியிராத வறண்ட வெளிப்பகுதியைக் குறிக்கும் ἔρημος என்பதற்கு இயல்பான நவீனத் தமிழ்; இதை ‘கூப்பிடுகிற’ என்பதுடன் முதன்மையாக இணைக்கிறது.
- source_word: Ἑτοιμάσατε
  choice: ஆயத்தப்படுத்துங்கள்
  rationale: தீர்க்கதரிசனக் கட்டளையின் வலிமையையும் மரியாதைமிக்க பன்மை ஏவலையும் காக்கிறது.
- source_word: τὴν ὁδὸν κυρίου
  choice: ஆண்டவரின் வழியை
  rationale: சாலை ஆயத்தப்படுத்தும் உருவகத்தையும் வேத மொழிநடையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: லூக்காவின் கிரேக்க κύριος என்பதைக் கையாளும் வழக்கமான தமிழ் இணை; ஏசாயா 40:3-இல் உள்ள YHWH பின்னணி அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: εὐθείας ποιεῖτε
  choice: நேராக்குங்கள்
  rationale: பெயரடை-வினை அமைப்பின் கட்டளைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰς τρίβους αὐτοῦ
  choice: அவருடைய பாதைகளை
  rationale: ὁδός உடன் இணையும் சாலை உருவகத்தையும் பன்மையையும் காக்கிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் YHWH-ஐக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: லூக்காவின் கிரேக்க உரை κύριος என்று வாசிப்பதால் முதன்மை உரை அதைப் பின்பற்றுகிறது; எபிரெய மூலத்தின் இறைப்பெயர் பின்னணி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν τῇ ἐρήμῳ தொடரின் இலக்கண இணைப்பு
  choice: ‘உரக்கக் கூப்பிடுகிற’ என்பதுடன் இணைத்தல்
  alternative: ‘வழியை ஆயத்தப்படுத்துங்கள்’ என்ற கட்டளையுடன் இணைத்தல்
  rationale: லூக்காவின் கிரேக்க சொல் அமைப்பு முதன்மை வாசிப்பை ஆதரித்தாலும், ஏசாயாவின் எபிரெய நிறுத்தக்குறியீட்டு மரபின்படி மாற்று இணைப்பு சாத்தியம்; அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘இறைவாக்கினர்,’ ‘ஆண்டவர்,’ ‘ஆயத்தப்படுத்துங்கள்’ ஆகியவை வேதச் சூழலுக்கேற்றவையாக இருந்தாலும் சாதாரண வாசகருக்குப் புரியும் சொற்கள். எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
