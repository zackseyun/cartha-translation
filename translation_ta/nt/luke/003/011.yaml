reference: Luke 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: ta
  text: 'அவர்களுக்குப் பதிலளித்து, அவர் சொன்னார்: “இரண்டு அங்கிகள்[a] உள்ளவர், அங்கி இல்லாதவருக்குப் பகிர்ந்து கொடுக்கட்டும்; உணவு உள்ளவரும் அதேபோல் செய்யட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் உடலுக்கு அருகில் அணியப்படும் அடிப்படை ஆடையான அங்கியைக் குறிக்கிறது; இதை ‘சட்டை’ அல்லது ‘ஆடை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: அதற்கு அவர் அவர்களிடம் ... என்றார்
  rationale: பதில் உரையை அறிமுகப்படுத்தும் வினையெச்சத்தையும், மென்மையான தொடுப்புச் சொல்லையும், பிரதான உரைவினையையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது. கிரேக்க இறந்தகால நிறைவுறா வினையின் நீடிப்பு இச்சூழலில் கட்டாயமாக வெளிப்படுத்தப்பட வேண்டியதில்லை.
- source_word: Ὁ ἔχων
  choice: வைத்திருப்பவர்
  rationale: பொதுவாக யாரையும் குறிக்கும் ஒருமை வினையெச்சத்தின் பொருளை, பாலினத்தைக் குறிப்பாகச் சுட்டாமல் இயல்பான தமிழில் தருகிறது.
- source_word: δύο χιτῶνας
  choice: இரண்டு உள்சட்டைகள்
  rationale: χιτών உடலுக்கு அருகில் அணியப்பட்ட அடிப்படை உள்ளாடை வகையைக் குறிக்கிறது; நவீன சட்டை அல்லது மேலாடை என்று தவறாகப் புரிந்துகொள்ளாமல் இருக்க ‘உள்சட்டை’ பயன்படுத்தப்படுகிறது.
- source_word: μεταδότω
  choice: பகிர்ந்துகொள்ளட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையைத் தமிழின் இயல்பான கட்டளை அமைப்பில் பாதுகாக்கிறது; பொருளை முழுவதும் விட்டுக்கொடுக்க வேண்டும் என்று தேவையின்றி கூறுவதில்லை.
- source_word: τῷ μὴ ἔχοντι
  choice: ஒன்றும் இல்லாதவருடன்
  rationale: சூழலில் விடுபட்டுள்ள உடைப் பொருளை ‘ஒன்றும்’ என்பதால் இயல்பாக உணர்த்தி, μεταδίδω வினையின் பகிர்தல் பொருளுக்கு ஏற்ற ‘உடன்’ அமைப்பைப் பயன்படுத்துகிறது.
- source_word: βρώματα
  choice: உணவு
  rationale: உண்ணத்தக்க பொருட்களைக் குறிக்கும் பன்மைச் சொல்லை இயல்பான தமிழ்க் கூட்டுப்பொருள் பெயராக வழங்குகிறது.
- source_word: ὁμοίως ποιείτω
  choice: அதேபோல் செய்யட்டும்
  rationale: முதல் கட்டளையை உணவு வைத்திருப்பவருக்கும் இணையாகப் பொருத்துகிறது; இணையான மூன்றாம் நபர் கட்டளை வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை வடிவங்கள்
  choice: வைத்திருப்பவர் ... இல்லாதவர்
  alternative: வைத்திருக்கும் ஆண் ... இல்லாத ஆண்
  rationale: கிரேக்க ஆண்பால் ஒருமை வினையெச்சங்கள் இங்கு ஆண்களை மட்டும் அல்லாமல் பொதுவாக எவரையும் பிரதிநிதித்துவப்படுத்துகின்றன. தமிழ் மரியாதை ஒருமை ‘வர்’ வடிவம் அந்தப் பொதுப்பொருளையும் ஒருமைத் தன்மையையும் இயல்பாகக் காக்கிறது.
- issue: μεταδότω என்பதன் கட்டளை மற்றும் பகிர்தல் பொருள்
  choice: பகிர்ந்துகொள்ளட்டும்
  alternative: கொடுத்துவிடட்டும் / பகிர்ந்துகொள்ள வேண்டும்
  rationale: கிரேக்கச் சொல் மற்றவருக்குப் பங்கு அளிப்பதையும் மூன்றாம் நபர் கட்டளையையும் தெரிவிக்கிறது. ‘கொடுத்துவிடட்டும்’ முழுவதையும் துறப்பதாக அதிகமாகச் சொல்லக்கூடும்; ‘வேண்டும்’ கட்டளையை கடமைக்கூற்றாக மாற்றும். தேர்ந்த வடிவம் மூலத்தின் அறிவுறுத்தல் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி உரையின் கட்டளை இணைமை காக்கப்பட்டுள்ளது; பழங்கால ஆடைக்கான சொல்லால் ஏற்படும் பண்பாட்டு இடைவெளி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
