revisions:
- from: இயேசு தாமே தொடங்கியபோது[a] ஏறக்குறைய முப்பது வயதுடையவராக இருந்தார். மக்கள் கருதியபடி[b] அவர் யோசேப்பின் மகன்; யோசேப்பு ஏலியின் மகன்.[c]
  to: இயேசு தாமே, தொடங்கியபோது[a], ஏறக்குறைய முப்பது வயதுடையவராக இருந்தார். அவர் யோசேப்பின் மகன் எனக் கருதப்பட்டவர்[b]; யோசேப்பு ஏலியின் மகன்.[c]
  rationale: The revision removes the unnecessary explicit subject from the impersonal passive ὡς ἐνομίζετο and places the qualification naturally with Jesus’ status as Joseph’s son. It retains the Greek ambiguity about what Jesus began, the approximation of his age, and the elliptical genealogical form while explaining the supplied Joseph–Heli relationship in a footnote.
