source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: ta
  text: இயேசு தாமே, தொடங்கியபோது[a], ஏறக்குறைய முப்பது வயதுடையவராக இருந்தார். அவர் யோசேப்பின் மகன் எனக் கருதப்பட்டவர்[b]; யோசேப்பு ஏலியின் மகன்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இயேசு எதைத் தொடங்கினார் என்று வெளிப்படையாகச் சொல்லப்படவில்லை; சூழலில் இது அவரது பொதுப் பணி தொடங்கியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘கருதப்பட்டபடி’ என்று உள்ளது. இயேசு யோசேப்பின் மகன் எனக் கருதப்பட்டார் என்பதைக் குறிக்கிறது; யார் இவ்வாறு கருதினர் என்று வெளிப்படையாகக் கூறப்படவில்லை.
    reason: clarification
  - marker: c
    text: 'யோசேப்புக்கும் ஏலிக்கும் இடையிலான உறவுக்காக கிரேக்கத்தில் ‘மகன்’ என்ற சொல் மீண்டும் எழுதப்படவில்லை; வம்சவரலாற்றின் தொடர் அந்த உறவை உணர்த்துகிறது. சொற்சொல்லாக: ‘யோசேப்பு, ஏலியின்.’'
    reason: source_form
lexical_decisions:
- source_word: Καὶ αὐτὸς … Ἰησοῦς
  choice: இயேசு தாமே
  rationale: αὐτός தரும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் ‘தாமே’ எனக் காக்கிறது. Καί இங்கு கதைத் தொடர்ச்சியை இணைக்கிறது; தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: ἀρχόμενος
  choice: தொடங்கியபோது
  rationale: வினையெச்சத்தின் கால/சூழல் தொடர்பை இயல்பாகத் தருகிறது. எதைத் தொடங்கினார் என்று கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படாததால் முதன்மை உரையில் ‘தமது பணியை’ என்று சேர்க்கப்படவில்லை.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: ஏறக்குறைய முப்பது வயதுடையவராக
  rationale: ὡσεὶ குறிக்கும் தோராயத்தைக் காத்து, வயதைக் கூறும் இயல்பான தமிழ்ச் சொற்றொடரைப் பயன்படுத்துகிறது.
- source_word: ὡς ἐνομίζετο
  choice: மக்கள் கருதியபடி
  rationale: இது பொதுவாக நிலவிய எண்ணம் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; யோசேப்பின் உயிரியல் தந்தைத்துவத்தை ஆசிரியர் நேரடியாக உறுதிப்படுத்துவதாக மாற்றவில்லை.
- source_word: υἱός … Ἰωσὴφ
  choice: அவர் யோசேப்பின் மகன்
  rationale: வம்சவரலாற்றைத் தொடங்கும் மகன் உறவைத் தமிழில் தெளிவாகத் தருகிறது; ‘மக்கள் கருதியபடி’ என்ற தகுதிப்படுத்தல் அந்த உறவுக்கே இணைக்கப்பட்டுள்ளது.
- source_word: Ἰωσὴφ τοῦ Ἠλὶ
  choice: யோசேப்பு ஏலியின் மகன்
  rationale: கிரேக்க வம்சவரலாற்றில் தொடர்ந்து வரும் பிறப்புப்பெயர்ச்சித் தொடர் விடுபட்ட ‘மகன்’ உறவை உணர்த்துகிறது. தமிழில் வெறும் ‘ஏலியுடைய யோசேப்பு’ என்பது இயல்பற்றதும் தெளிவற்றதும் என்பதால் மறைந்துள்ள உறவு வெளிப்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘ὡς ἐνομίζετο’ என்பது யாருடைய மகனாக இருப்பதைத் தகுதிப்படுத்துகிறது?
  choice: இயேசு யோசேப்பின் மகன் என்று மக்கள் கருதியதாக அமைத்தல்
  alternative: யோசேப்புடனான உறவைத் தகுதிப்படுத்தாமல் சாதாரண அடையாளக் குறிப்பாக மொழிபெயர்த்தல்
  rationale: சொற்றொடரின் இடமும் லூக்காவின் முந்தைய கன்னிப் பிறப்புக் கதையும், இது சமூகத்தில் நிலவிய தந்தை–மகன் அடையாளம் என்பதைச் சுட்டுகின்றன. அதேவேளை இந்த வசனம் கூறுவதைக் கடந்து அந்த உறவின் சட்ட அல்லது உயிரியல் இயல்பை வரையறுக்கவில்லை.
- issue: ἀρχόμενος என்பதற்கு ‘ஊழியத்தைத் தொடங்கினார்’ என்று சேர்க்கலாமா?
  choice: முதன்மை உரையில் ‘தொடங்கியபோது’ என்று மட்டும் வைத்தல்
  alternative: ‘தமது பொதுப் பணியைத் தொடங்கியபோது’ என்று சூழலை வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் இயேசுவின் பொதுப் பணி தொடங்கியதை வலுவாக உணர்த்தினாலும், ‘பணி/ஊழியம்’ என்ற பெயர்ச்சொல் மூலத்தில் இல்லை. உண்மையான சுருக்கத்தை அடிக்குறிப்பின் மூலம் விளக்குவது மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: τοῦ Ἠλὶ என்பதில் மறைந்துள்ள உறவு
  choice: தமிழில் ‘யோசேப்பு ஏலியின் மகன்’ என்று வெளிப்படுத்தல்
  alternative: ‘யோசேப்பு, ஏலியுடையவர்’ என்று கிரேக்க வடிவத்தைச் சொற்சொல்லாக வைத்தல்
  rationale: வம்சவரலாற்றின் பிறப்புப்பெயர்ச்சித் தொடர் ‘மகன்’ என்பதை இயல்பாக உணர்த்துகிறது. இதை வெளிப்படுத்துவது தமிழில் புரிதலை அளிக்கிறது; அடிக்குறிப்பு மூலத்தின் சுருக்கமான வடிவத்தைப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘தாமே’ கிரேக்க வலியுறுத்தலைக் காக்கிறது. வம்சவரலாற்றின் தொடக்கம் தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; ஆனால் ‘தொடங்குதல்’ குறித்த மூலத்தின் வெளிப்படையின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
