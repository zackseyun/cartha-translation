  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: ta
  text: இவ்வாறு, வேறு பல அறிவுரைகளையும் வழங்கி, அவர் மக்களுக்கு நற்செய்தியை அறிவித்துவந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறு பலவற்றாலும் அவர்களை அறிவுறுத்தி.” ‘பல’ என்பது எவற்றைக் குறிக்கிறது என்பதை கிரேக்கம் வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: வேறு பலவற்றையும்
  rationale: நடுநிலைப் பன்மைச் சொற்கள் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளன; எவை என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படாததால், தமிழிலும் பொதுவாகவும் இயல்பாகவும் விடப்பட்டுள்ளது.
- source_word: μὲν οὖν
  choice: இவ்வாறு
  rationale: முந்தைய செய்தியிலிருந்து தொடர்ச்சியையும் சுருக்கமான முடிவுறுத்தலையும் குறிக்கும் சொற்றொடர்; ஒவ்வொரு துகளையும் தனித்தனியாக மொழிபெயர்க்காமல் உரையோட்டத்தைப் பாதுகாக்கிறது.
- source_word: παρακαλῶν
  choice: அறிவுறுத்தி
  rationale: இங்கு யோவானின் மனந்திரும்புதலை வலியுறுத்தும் பிரசங்கச் சூழலில் ஊக்குவித்தல், வேண்டுதல், கடிந்துரைத்தல் ஆகிய நிழற்பொருள்களை உள்ளடக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: εὐηγγελίζετο
  choice: நற்செய்தியை அறிவித்துவந்தார்
  rationale: முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியான செயலை ‘அறிவித்துவந்தார்’ காட்டுகிறது; εὐαγγελίζω என்பதன் நற்செய்தி அறிவிப்பு என்ற வலிமையையும் காக்கிறது.
- source_word: τὸν λαόν
  choice: மக்களுக்கு
  rationale: λαός என்பதற்கான நேரடியான, இயல்பான தமிழ்; வசனம் வெளிப்படையாகச் சொல்லாத ‘இஸ்ரவேல் மக்கள்’ அல்லது ‘கூட்டம்’ என்ற குறுக்கீட்டைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோவானின் பணியுடன் தொடர்புடைய εὐηγγελίζετο என்பதன் வலிமை
  choice: நற்செய்தியை அறிவித்துவந்தார்
  alternative: பிரசங்கித்துவந்தார் / செய்தியை அறிவித்துவந்தார்
  rationale: யோவானின் அறிவுறுத்தல்கள் உள்ள செய்தியையே கிரேக்க உரை நற்செய்தி அறிவிப்பாகச் சித்தரிக்கிறது. அந்த இறையியல் பதற்றத்தைப் பொதுவான ‘பிரசங்கம்’ எனத் தளர்த்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அறிவுறுத்தி’ என்பது போதனைக்கும் வலியுறுத்தலுக்கும் இடையிலான παρακαλέω-வின் பரப்பை இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலத்தின் மறைபொருளைத் தெளிவுபடுத்துகிறது.
