  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: ta
  text: கூட்டத்தினர் அவரிடம், “அப்படியானால் நாங்கள் என்ன செய்ய வேண்டும்?” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், கேள்வி தொடர்ந்து அல்லது மீண்டும் மீண்டும் கேட்கப்பட்டதைக் குறிக்கிறது; தமிழ் தொடர்நிலை வினை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: மூலத்தில் உள்ள பன்மையைப் பாதுகாத்து, திரண்டிருந்த பல குழுக்களைக் குறிக்கும் வகையில் நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: கேள்வியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பங்கேற்பு வினை வடிவத்தை, தமிழ் நேரடி உரை அமைப்பில் இயல்பான ‘என்று’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: Τί οὖν
  choice: அப்படியானால் ... என்ன
  rationale: οὖν முந்தைய அறிவுறுத்தலிலிருந்து எழும் நடைமுறை முடிவைச் சுட்டுகிறது; ‘அப்படியானால்’ அந்தத் தர்க்கத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ποιήσωμεν
  choice: நாங்கள் என்ன செய்ய வேண்டும்
  rationale: ஆலோசனை நாடும் முதலாம் நபர் பன்மை வினாவாகிய aorist subjunctive-ஐ, நவீன தமிழில் இயல்பான ‘செய்ய வேண்டும்?’ என்ற கேள்வியாக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை. மூலத்தின் பன்மையும் தொடர்ச்சியான வினவல் அம்சமும் பாதுகாக்கப்பட்டுள்ளன.
