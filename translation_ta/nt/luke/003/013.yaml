source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: ta
  text: அதற்கு அவர் அவர்களிடம், “உங்களுக்கு விதிக்கப்பட்டிருப்பதைவிட அதிகமாக எதையும் வசூலிக்காதீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “உங்களுக்கு விதிக்கப்பட்டிருப்பதைவிட அதிகமாக எதையும் செய்யாதீர்கள்.” சூழலில் இவ்வினைச்சொல் குறிப்பாக அவர்களுடைய வரி வசூலிக்கும் பணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: அதற்கு அவர்
  rationale: δέ ஒரு மென்மையான இணைப்புச்சொல். முந்தைய வசனத்தில் வரி வசூலிப்பவர்கள் கேட்ட கேள்விக்கான பதிலாக இது வருவதால், ‘அதற்கு’ என்பது உரையோட்டத்தை இயல்பாகக் காட்டுகிறது; வலுவான முரண்பாட்டை உருவாக்குவதில்லை.
- source_word: εἶπεν πρὸς αὐτούς
  choice: அவர்களிடம் … என்றார்
  rationale: λέγω + πρός என்பதன் இயல்பான தமிழ் வடிவம். நேரடிக் கூற்றைச் சுற்றிய தமிழ் வாக்கிய அமைப்புக்கு ஏற்ப ‘என்றார்’ இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: Μηδὲν πλέον
  choice: அதிகமாக எதையும் … செய்யாதீர்கள்
  rationale: அளவுக்கு மீறிய செயலைத் தடைசெய்வதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: உங்களுக்கு விதிக்கப்பட்டிருப்பதைவிட
  rationale: διατεταγμένον என்பது διατάσσω என்பதன் நிறைவு passive participle; அதிகாரப்பூர்வமாக விதிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட அளவு என்ற பொருளையும் passive தன்மையையும் இவ்வடிவம் காக்கிறது.
- source_word: πράσσετε
  choice: வசூலிக்காதீர்கள்
  rationale: πράσσω பொதுவாக ‘செய்’ என்று பொருள்பட்டாலும், உடனடி சூழலில் யோவான் வரி வசூலிப்பவர்களிடம் பேசுகிறார். எனவே இங்கு அவர்கள் மேற்கொள்ளும் வரி வசூலைக் குறிக்கும் பொருளைத் தமிழில் வெளிப்படையாக்குவது இயல்பானது.
theological_decisions:
- issue: πράσσετε என்பதில் மறைமுகமாக உள்ள செயலைச் சூழலுக்கேற்ப குறிப்பாக்குதல்
  choice: வரி வசூலிக்கும் செயலை வெளிப்படையாக்கி ‘வசூலிக்காதீர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உங்களுக்கு விதிக்கப்பட்டிருப்பதைவிட அதிகமாக எதையும் செய்யாதீர்கள்’
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல; மொழிபெயர்ப்பு முறையைச் சார்ந்த முடிவு. முந்தைய வசனத்தில் பேசப்படுபவர்கள் வரி வசூலிப்பவர்கள் என்பதால், ‘வசூலி’ என்பது சூழல் ஆதரிக்கும் குறிப்பாக்கம். அதேவேளையில் மூலத்தின் பொதுவான வினைச்சொல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘விதிக்கப்பட்டிருப்பது’ அதிகாரப்பூர்வ நியமனத்தின் நுணுக்கத்தையும் passive வடிவத்தையும் காக்கிறது; ‘வசூலிக்காதீர்கள்’ உடனடி சூழலைத் தெளிவாக்குகிறது.
