id: LUK.3.24
reference: Luke 3:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ Μαθθὰτ τοῦ Λευὶ τοῦ Μελχὶ τοῦ Ἰανναὶ τοῦ Ἰωσὴφ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/024.yaml
  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: ta
  text: மத்தாத்தின் மகன்[a], லேவியின் மகன், மெல்கியின் மகன், யன்னாயின் மகன், யோசேப்பின் மகன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த முறையில்: ‘மத்தாத்தின், லேவியின், மெல்கியின், யன்னாயின், யோசேப்பின்.’ கிரேக்கத்தில் உடைமை வேற்றுமை வடிவங்கள் தொடர்ந்து வருகின்றன; சுற்றியுள்ள வம்சவரலாற்றுச் சூழலிலிருந்து ‘மகன்’ என்பது மறைமுகமாகப் பொருள்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: ஒவ்வொரு பெயருக்கும் முன் திரும்பத் திரும்ப வரும் கிரேக்க உருபு உடைமை வேற்றுமையைக் குறிக்கிறது. சுற்றியுள்ள வம்சவரலாற்றுச் சூழலில் ‘மகன்’ என்பது மறைமுகமாகப் பொருள்படுவதால், இயல்பான தமிழுக்காக அது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: Μαθθὰτ
  choice: மத்தாத்
  rationale: கிரேக்கப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது; வேற்றுமை உருபுடன் ‘மத்தாத்தின்’ என வருகிறது.
- source_word: Λευὶ
  choice: லேவி
  rationale: கிரேக்கப் பெயரின் வழக்கமான, தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Μελχὶ
  choice: மெல்கி
  rationale: Μελχί என்ற கிரேக்க வடிவை நவீன தமிழில் வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: Ἰανναὶ
  choice: யன்னாய்
  rationale: Ἰανναί என்ற மூல வடிவின் இறுதி இரட்டை உயிரொலியையும் பெயரின் ஒலியையும் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: Ἰωσὴφ
  choice: யோசேப்பு
  rationale: Ἰωσήφ என்பதற்கான பரவலாக அறியப்படும் தமிழ் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: வம்சவரலாற்றில் விடுபட்டிருக்கும் உறவுமுறைச் சொல்
  choice: ஒவ்வொரு பெயருக்கும் ‘மகன்’ என்பதை வெளிப்படையாகச் சேர்த்தல்
  alternative: ‘மத்தாத்தின், லேவியின், மெல்கியின், யன்னாயின், யோசேப்பின்’ என்று உடைமை வேற்றுமைத் தொடரை மட்டும் வைத்தல்
  rationale: கிரேக்கத்தில் ‘மகன்’ இவ்வசனத்தில் எழுதப்படவில்லை; ஆனால் முந்தைய வம்சவரலாற்று அமைப்பிலிருந்து அது தெளிவாகப் பொருள்படுகிறது. அதைச் சேர்ப்பது புதிய உறவை உருவாக்காமல், மறைமுகமாக உள்ள உறவை இயல்பான தமிழில் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரன்’ என்பதற்குப் பதிலாக இன்றைய பொதுவழக்கில் தெளிவான ‘மகன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
