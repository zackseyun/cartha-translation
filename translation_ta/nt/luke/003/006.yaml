  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: ta
  text: மாம்சமான அனைவரும் கடவுளுடைய மீட்பைக் காண்பர்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லா மனிதர்களும்.’ கிரேக்கத்தில் சொற்படையாக ‘எல்லா மாம்சமும்’ என்று உள்ளது. இது ஏசாயா 40:5-ஐ எதிரொலித்து, இங்கு மனிதகுலம் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளிடமிருந்து வரும் மீட்பு.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: காணும்
  rationale: ὁράω என்பதன் எதிர்கால வடிவம் இங்கு நேரடியான எதிர்காலப் பொருளில் வருகிறது. ‘காணும்’ என்பது இயல்பான நவீனத் தமிழாகவும் மூலத்தின் காட்சிசார் மொழியைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: πᾶσα σὰρξ
  choice: எல்லா மாம்சமும்
  rationale: இது ஏசாயா 40:5-ஐ எதிரொலிக்கும் தீர்க்கதரிசனச் சொற்றொடர்; பொருளில் மனிதகுலம் முழுவதையும் குறிக்கிறது. இடைநூல் தொடர்பையும் மூலத்தின் உருவகத்தையும் காக்க, ‘எல்லா மனிதர்களும்’ என்று உரைத்துத் தீர்க்காமல் சொற்படையான வடிவம் முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: σωτήριον
  choice: மீட்பு
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட σωτήριον, கடவுளின் காப்பாற்றும் செயலை விரிவாகக் குறிக்கிறது. ‘மீட்பு’ என்பது தமிழில் இயல்பாகவும் செறிவாகவும் இருந்து, ‘விடுதலை’ என்பதைக் காட்டிலும் பொருளின் இறையியல் அகலத்தை நன்கு தக்கவைக்கிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: கிரேக்க உரையின் உரிமை/தோற்றுவாய் சார்ந்த உறவைத் தீர்மானிக்காமல் வைத்திருக்க, மரபுவழி வேற்றுமைத் தொடர்பு தமிழில் ‘கடவுளுடைய’ என்று வழங்கப்படுகிறது. ‘கடவுளிடமிருந்து வரும்’ என்பது சாத்தியமான விளக்கம்; ஆனால் அது தோற்றுவாயை வெளிப்படையாகத் தீர்மானிக்கிறது.
theological_decisions:
- issue: πᾶσα σὰρξ என்ற சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘எல்லா மாம்சமும்’; பொருளில் மனிதகுலம் முழுவதும்
  alternative: எல்லா மனிதர்களும்
  rationale: ஏசாயா மேற்கோளின் தீர்க்கதரிசன மொழியையும் இடைநூல் எதிரொலியையும் முதன்மை உரை பாதுகாக்கிறது; அடிக்குறிப்பு அதன் இயல்பான மனிதக் குறிப்பை விளக்குகிறது.
- issue: τοῦ θεοῦ என்ற பிறப்புவேற்றுமையின் உறவு
  choice: கடவுளுடைய மீட்பு
  alternative: கடவுளிடமிருந்து வரும் மீட்பு
  rationale: மூலத்தில் உள்ள உரிமை அல்லது தோற்றுவாய் சார்ந்த பொருள் நெகிழ்வை ‘கடவுளுடைய’ தக்கவைக்கிறது; மாற்று வாசிப்பு தோற்றுவாயை வலியுறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. ‘மாம்சம்’ என்ற வேதாகமச் சொல் இடைநூல் தொடர்பைத் தக்கவைக்க நோக்கமுடன் பயன்படுத்தப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
