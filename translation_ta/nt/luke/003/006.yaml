revisions:
- from: எல்லா மாம்சமும் கடவுளுடைய மீட்பைக் காணும்[a][b].
  to: மாம்சமான அனைவரும் கடவுளுடைய மீட்பைக் காண்பர்[a][b].
  rationale: The revision replaces only the unnatural singular collective calque with an idiomatic Tamil expression that preserves the biblical ‘flesh’ idiom, its universal human reference, and the future sense. Footnote anchors and meanings are retained.
