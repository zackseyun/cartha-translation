source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: ta
  text: 'யோவான் அனைவருக்கும் பதிலளித்துச் சொன்னான்: “நானோ உங்களுக்குத் தண்ணீரால்[a] திருமுழுக்கு அளிக்கிறேன். ஆனால் என்னைவிட வலிமைமிக்கவர்[b] வருகிறார். அவருடைய செருப்புகளின் வாரை அவிழ்க்கக்கூட நான் தகுதியானவன் அல்ல. அவர் உங்களுக்குத் தூய ஆவியிலும்[c] நெருப்பிலும்[d] திருமுழுக்கு அளிப்பார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தண்ணீரில்.’ இங்குள்ள கிரேக்க வேற்றுமை உருபு கருவியையோ மூலகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னைவிட அதிக வல்லமையுள்ளவர்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தூய ஆவியால்.’ கிரேக்கத்தில் ‘தூய ஆவியில்’ என்று உள்ளது; இங்குள்ள முன்னிடைச்சொல் மூலம், சூழல் அல்லது மூலகம் ஆகிய நுட்பங்களில் ஒன்றைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘நெருப்பு’ என்பது தூய்மைப்படுத்துதலையோ நியாயத்தீர்ப்பையோ குறிக்கலாம்; அல்லது ஆவியும் நெருப்பும் இணைந்த ஒரே திருமுழுக்கு உருவகத்தின் பகுதியாக இருக்கலாம். முதன்மை உரை எந்த விளக்கத்தையும் தனியாகத் தேர்ந்தெடுக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: யோவான் அவர்கள் எல்லாருக்கும் மறுமொழியாக ... என்றான்
  rationale: கிரேக்க மொழியின் பதிலுரைக்கும் கருத்தையும், அனைவரை நோக்கிச் சொன்னார் என்பதையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது; λέγων என்ற பங்கேற்புவினை தமிழில் மேற்கோள் முடிவிலுள்ள ‘என்றான்’ மூலம் தெரிவிக்கப்படுகிறது.
- source_word: Ἐγὼ μὲν ... δὲ
  choice: நான் ... ஆனால்
  rationale: μέν–δέ அமைப்பு யோவானின் செயலை வரவிருப்பவரின் செயலுடன் எதிரெதிராக நிறுத்துகிறது. தமிழில் ‘நான் ... ஆனால்’ என்பது அந்த வேறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ὕδατι
  choice: தண்ணீரால்
  rationale: இங்குள்ள வேற்றுமை உருபு கருவியையோ மூலகத்தையோ குறிக்கலாம். ‘தண்ணீரால்’ இயல்பான முதன்மை வாசகம்; ‘தண்ணீரில்’ என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βαπτίζω / βαπτίσει
  choice: திருமுழுக்கு அளிக்கிறேன் / திருமுழுக்கு அளிப்பார்
  rationale: நற்செய்தி நூலின் சடங்கு சார்ந்த சூழலில் βαπτίζω என்பதைக் குறிக்கும் தெளிவான, மரியாதையான தமிழ் சொற்றொடர். செய்முறையைப் பற்றிய பிரிவுசார் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: ὁ ἰσχυρότερός μου
  choice: என்னைவிட வலிமைமிக்கவர்
  rationale: ஒப்பீட்டுப் பொருளை வெளிப்படையாகவும் இயல்பாகவும் காட்டி, அந்த நபருக்கு உரிய மரியாதை நிலையையும் தமிழில் பேணுகிறது.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: அவருடைய ... நான் தகுதியானவன் அல்ல
  rationale: இந்தத் தாழ்மை வெளிப்பாட்டில் ἱκανός என்பது வெறும் திறனைவிடத் தகுதியைச் சுட்டுகிறது; ஆகவே ‘தகுதியானவன் அல்ல’ பொருத்தமானது.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: அவருடைய காலணிகளின் வாரை அவிழ்ப்பதற்குக்கூட
  rationale: காலணியை அவிழ்க்கும் தாழ்வான பணியை இன்றைய வாசகர்கள் தெளிவாகப் புரிந்துகொள்ளும் வகையில் தருகிறது. ‘கூட’ என்பது யோவானின் தாழ்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτὸς
  choice: அவர்
  rationale: முன்னர் குறிப்பிடப்பட்டு வருகிறவரையே சுட்டி, யோவானுடனான வேறுபாட்டை தமிழ் சூழலில் போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: தூய ஆவியிலும் நெருப்பிலும்
  rationale: ἐν என்பதன் இடம், மூலம் அல்லது மூலகம் சார்ந்த நுட்பத்தைத் தீர்மானிக்காமல் ‘-இல்’ வடிவில் பேணுகிறது. πνεῦμα ἅγιον இறைவனுடைய ஆவியைக் குறிப்பதால் ‘தூய ஆவி’ என வழங்கப்படுகிறது; ‘நெருப்பு’ விளக்கமின்றி அப்படியே வைக்கப்படுகிறது.
theological_decisions:
- issue: ‘தூய ஆவியிலும் நெருப்பிலும் திருமுழுக்கு அளிப்பார்’ என்பதிலுள்ள நெருப்பின் பொருள்
  choice: நெருப்பு தூய்மைப்படுத்துதலா, நியாயத்தீர்ப்பா, அல்லது ஆவி–நெருப்பு என்ற ஒரே உருவகத்தின் ஓர் அம்சமா என்பதை முதன்மை உரை தீர்மானிக்காமல் சொற்றொடரை அப்படியே பேணுகிறது.
  alternative: ‘தூய ஆவியாகிய தூய்மைப்படுத்தும் நெருப்பில்’ என்று ஒன்றாக்குதல்; அல்லது சிலருக்கு ஆவியிலும் மற்றவர்களுக்கு நியாயத்தீர்ப்பின் நெருப்பிலும் என்று பிரித்தல்.
  rationale: கிரேக்க வாசகம் சுருக்கமானது; உடனடிச் சூழல் ஒன்றுக்கு மேற்பட்ட விளக்கத்திற்கு இடமளிக்கிறது. எனவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: πνεύματι ἁγίῳ என்பதன் அடையாளம்
  choice: தூய ஆவி
  alternative: தூய ஆவிக்குரிய ஆற்றல் அல்லது தூய மனப்பாங்கு
  rationale: லூக்காவின் சூழலில் இச்சொற்றொடர் இறைவனுடைய தூய ஆவியைக் குறிக்கிறது; ஆயினும் அவர் செயல்படும் விதத்தை மொழிபெயர்ப்பு விரிவாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘ஞானஸ்நானம்’ என்பதற்குப் பதில் நேரடியாகப் புரியும் ‘திருமுழுக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘காலணிகளின் வார்,’ ‘தகுதியானவன் அல்ல’ ஆகியவை பழமையான அல்லது மிகச் சமயத் தொழில்நுட்பமான சொற்களைத் தவிர்த்து மூலத்தின் சமூகப் படிமத்தையும் தாழ்மையையும் காக்கின்றன.
