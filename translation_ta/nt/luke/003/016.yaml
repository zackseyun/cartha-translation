  revised_text: 'யோவான் அனைவருக்கும் பதிலளித்துச் சொன்னான்: “நானோ உங்களுக்குத் தண்ணீரால்[a] திருமுழுக்கு அளிக்கிறேன். ஆனால் என்னைவிட வலிமைமிக்கவர்[b] வருகிறார். அவருடைய செருப்புகளின் வாரை அவிழ்க்கக்கூட நான் தகுதியானவன் அல்ல. அவர் உங்களுக்குத் தூய ஆவியிலும்[c] நெருப்பிலும்[d] திருமுழுக்கு அளிப்பார்.”'
