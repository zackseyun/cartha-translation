  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் பெரும்பாலும் காக்கப்பட்டுள்ளது: யோவானின் பதில், தண்ணீராலான திருமுழுக்கு, தம்மைவிட வலிமைமிக்கவர் வருதல், செருப்பு-வாரை அவிழ்க்கத் தகுதியற்ற தாழ்மை, தூய ஆவியிலும் நெருப்பிலும் திருமுழுக்கு ஆகியவை சரியாக உள்ளன. ஆனால் ‘காலணிகள்’ என்பது ὑποδήματα குறிக்கும் செருப்பு/சந்தல் படிமத்தைச் சற்றே பொதுமைப்படுத்துகிறது; ‘செருப்புகள்’ மிக நெருக்கமானது.'
  naturalness: ‘யோவான் அவர்கள் எல்லாருக்கும் மறுமொழியாக … என்றான்’ என்பது நவீனத் தமிழில் இயல்பற்ற அமைப்பாகவும், ‘அவர்கள்’ என்பதன் குறிப்பு தெளிவில்லாததாகவும் உள்ளது. ‘யோவான் அனைவருக்கும் பதிலளித்துச் சொன்னான்’ என்பது மூலத்தின் பதில்-கூறும் அமைப்பையும் இயல்பான தமிழையும் தருகிறது. ‘நானோ’ μέν–δέ எதிர்மறை அமைப்பின் வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
  terminology: ‘திருமுழுக்கு’ என்பது நிலையான, பிரிவுசார் செய்முறை விளக்கத்தைச் சேர்க்காத பொருத்தமான சொல். ‘தூய ஆவி’ மற்றும் ‘நெருப்பு’ ஆகியவை விளக்கமின்றி வைக்கப்படுவது சரியானது. ‘செருப்புகளின் வார்’ மூலத்தின் குறிப்பிட்ட காலணி வகையையும் ஒருமை வாரையும் இயல்பாக வெளிப்படுத்துகிறது.
