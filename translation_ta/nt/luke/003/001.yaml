source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: ta
  text: திபேரியு சீசரின் ஆட்சியின் பதினைந்தாம் ஆண்டில்[a], பொந்தியு பிலாத்து யூதேயாவை ஆட்சி செய்துகொண்டிருந்தபோதும், ஏரோது கலிலேயாவின் டெட்ரார்க்காகவும், அவனுடைய சகோதரன் பிலிப்பு இத்துரேயா மற்றும் திரகோனித்தி நிலப்பகுதியின் டெட்ரார்க்காகவும், லிசானியா அபிலேனேயின் டெட்ரார்க்காகவும் இருந்தபோதும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதினைந்தாம் ஆண்டின்போது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: பதினைந்தாம் ஆண்டில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: δὲ
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறையைக் காட்டாமல் கதை நகர்வைக் குறிக்கிறது; தமிழில் புதிய காலச்சூழலை முன்வைக்கும் வாக்கிய அமைப்பே அந்தப் பணியை இயல்பாகச் செய்கிறது.
- source_word: ἡγεμονίας
  choice: ஆட்சிக்காலம்
  rationale: திபேரியு சீசரின் பேரரசாட்சியையும் அதன் கால அளவையும் தெளிவாகக் குறிக்கிறது.
- source_word: ἡγεμονεύοντος
  choice: ஆட்சி செய்துகொண்டிருந்தான்
  rationale: பதவிப் பெயராக மட்டும் மாற்றாமல், கிரேக்கப் பங்கேற்பு வினையின் தொடர்நிலைச் சூழற்பொருளைப் பாதுகாக்கிறது.
- source_word: τετρααρχοῦντος
  choice: டெட்ரார்க்காக ... இருந்த
  rationale: பொதுவாக ‘ஆட்சியாளர்’ என்று தளர்த்தாமல் குறிப்பிட்ட ரோமகால அரசியல் பதவியைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது.
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: அவனுடைய சகோதரன் பிலிப்பு
  rationale: αὐτοῦ என்பது ஏரோதைக் குறிப்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: இத்துரேயா மற்றும் திரகோனித்தி நிலப்பகுதி
  rationale: χώρας என்பதிலுள்ள நிலப்பகுதி அல்லது பிரதேசம் என்ற பொருளை விடாமல், இவை நவீன இறையாண்மை நாடுகள் என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
theological_decisions:
- issue: τετρααρχοῦντος என்ற அரசியல் பதவியின் மொழிபெயர்ப்பு
  choice: ‘டெட்ரார்க்’ என்ற குறிப்பிட்ட வரலாற்றுப் பதவியைத் தக்கவைத்தல்
  alternative: ‘ஆட்சியாளர்’ அல்லது ‘குறுநில ஆட்சியாளர்’ என்று பொதுமைப்படுத்துதல்
  rationale: இந்த வசனத்தின் வரலாற்றுத் துல்லியத்தைப் பாதுகாக்க குறிப்பிட்ட பதவிப்பெயர் தேவை; வாசகருக்கான விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுப் பதவியான ‘டெட்ரார்க்’ மட்டும் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மூல வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
