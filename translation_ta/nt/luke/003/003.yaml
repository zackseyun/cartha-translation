  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: ta
  text: அவர் யோர்தானைச் சுற்றியிருந்த முழுப் பகுதிக்கும் வந்து[a], பாவங்களின் மன்னிப்புக்கான மனந்திரும்புதலின் திருமுழுக்கை அறிவித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: ‘யோர்தானைச் சுற்றியுள்ள முழுப் பகுதியெங்கும்.’'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘பிரசங்கித்தார்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: யோர்தானைச் சுற்றியிருந்த பகுதி முழுவதிலும் சென்று
  rationale: ἦλθεν மற்றும் εἰς ஆகியவை இயக்கத்தைக் குறிக்கின்றன; περίχωρος சுற்றுப்புறப் பகுதியையும் πᾶσαν அதன் முழுமையையும் குறிக்கிறது. தமிழில் ‘பகுதி முழுவதிலும் சென்று’ என்பது அந்தப் பகுதி எங்கும் அவர் சென்றார் என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: κηρύσσων
  choice: அறிவித்தார்
  rationale: κηρύσσω பொதுமக்கள் முன் அதிகாரபூர்வமாக அறிவிப்பதைக் குறிக்கிறது. ‘அறிவித்தார்’ என்பது திருச்சபைச் சூழலுக்கு மட்டும் கட்டுப்படாமல் இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: βάπτισμα குறிக்கும் நீரில் முழுக்குதல் அல்லது சடங்குசார் baptism என்பதற்கான தெளிவான, மரியாதையான நவீன தமிழ்ச் சொல்.
- source_word: μετανοίας
  choice: மனந்திரும்புதலின்
  rationale: மனப்போக்கும் வாழ்வுத் திசையும் மாறித் திரும்புவதை μετανοία குறிக்கிறது. ‘-இன்’ என்ற உடைமைத் தொடர்பு கிரேக்கச் சொல்லிணைப்பை விளக்கமாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: பாவமன்னிப்புக்கான
  rationale: ἄφεσις இங்கு பாவங்களின் மன்னிப்பு அல்லது விடுவிப்பைக் குறிக்கிறது. ‘-க்கான’ என்பது εἰς காட்டும் நோக்கு அல்லது இலக்குத் தொடர்பை இயல்பாகத் தருகிறது; அதன் துல்லியமான இறையியல் செயல்முறையை முடிவுசெய்யவில்லை.
theological_decisions:
- issue: திருமுழுக்கு, மனந்திரும்புதல், பாவமன்னிப்பு ஆகியவற்றுக்கிடையிலான உறவு
  choice: ‘பாவமன்னிப்புக்கான மனந்திரும்புதலின் திருமுழுக்கு’ என்று தொடர்புகளை வெளிப்படையாகவே வைத்தல்
  alternative: ‘மன்னிப்பைப் பெற வழிவகுக்கும் மனந்திரும்புதலைக் குறிக்கும் திருமுழுக்கு’ அல்லது ‘மனந்திரும்புதலை வெளிப்படுத்தி மன்னிப்பைப் பெறும் திருமுழுக்கு’
  rationale: βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν என்ற கிரேக்கத் தொடர், திருமுழுக்கு மன்னிப்புக்குக் கருவியா, அடையாளமா, அறிவிப்பா என்பதைத் தனியாக வரையறுக்கவில்லை. எனவே பிற்கால சடங்கியல் விவாதங்களை மொழிபெயர்ப்பில் தீர்க்காமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘யோர்தான்’, ‘மனந்திரும்புதல்’, ‘திருமுழுக்கு’, ‘பாவமன்னிப்பு’ ஆகியவை பொதுவாகப் புரியக்கூடிய வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; எந்த ஒரு பிரிவின் தனிப்பட்ட கோட்பாட்டையும் மொழிபெயர்ப்பு சேர்க்கவில்லை.
