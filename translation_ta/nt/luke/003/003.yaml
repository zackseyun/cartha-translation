revisions:
- from: அவர் யோர்தானைச் சுற்றியிருந்த பகுதி முழுவதிலும் சென்று[a], பாவமன்னிப்புக்கான மனந்திரும்புதலின் திருமுழுக்கை அறிவித்தார்[b].
  to: அவர் யோர்தானைச் சுற்றியிருந்த முழுப் பகுதிக்கும் வந்து[a], பாவங்களின் மன்னிப்புக்கான மனந்திரும்புதலின் திருமுழுக்கை அறிவித்தார்[b].
  rationale: The revision renders ἦλθεν with «வந்து» rather than the more interpretive «சென்று». It preserves πᾶσαν περίχωρον’s comprehensive regional sense, κηρύσσων’s public-proclamation force, and βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν without resolving its debated theological relation. Footnote a is recast as a readable lexical/idiomatic alternative, and both anchors remain correctly placed.
