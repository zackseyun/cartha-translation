lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: லூக்காவின் வம்சவரலாற்றுச் சூழலில் மீண்டும் மீண்டும் வரும் உரிய பெயருடன் கூடிய பிறப்புப்பொருள் வேற்றுமை, முன் சூழலிலிருந்து புரிந்துகொள்ளப்படும் தந்தை–மகன் உறவைத் தொடர்கிறது. தமிழில் வெறும் ‘…இன்’ என்பது இயல்பற்றதும் தெளிவற்றதும் ஆகும்; எனவே சூழலில் உட்கிடையாக உள்ள ‘மகன்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: Σεροὺχ
  choice: செரூகு
  rationale: இது கிரேக்கத்தில் ஒலிபெயர்க்கப்பட்ட ஆள்பெயர். பழைய ஏற்பாட்டு வம்சவரலாற்றுடன் தொடர்பு தெளிவாக இருக்க, எபிரெயப் பெயருக்கு நெருக்கமான வழக்கமான தமிழ் வேதாகம வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Ῥαγαὺ
  choice: ரெகூ
  rationale: கிரேக்க வடிவம் ‘ராகாவு’ என்பதற்கு நெருக்கமானது; ஆயினும் ஆதியாகம வம்சவரலாற்றில் உள்ள எபிரெயப் பெயருடன் அடையாளத் தொடர்ச்சியைப் பேணும் வழக்கமான தமிழ் வடிவமாக ‘ரெகூ’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Φάλεκ
  choice: பேலேகு
  rationale: இந்தப் பெயர் ஆதியாகமத்தில் வரும் எபிரெயப் பெயரான பேலேகுடன் ஒத்தது. பழைய மற்றும் புதிய ஏற்பாட்டு வம்சவரலாறுகளுக்கிடையிலான தொடர்பை வாசகர் அறிய இந்த வடிவம் உதவுகிறது.
- source_word: Ἔβερ
  choice: ஏபேர்
  rationale: இது ஆதியாகமத்தில் வரும் எபிரெயப் பெயரான ஏபேரைக் குறிக்கிறது. வேறு நபர்களுடன் குழப்பம் ஏற்படாமல், அந்தத் தந்தைவழித் தலைவருக்குரிய வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Σαλὰ
  choice: சேலா
  rationale: கிரேக்க ‘சலா’ ஆதியாகம வம்சவரலாற்றில் வரும் எபிரெயப் பெயரைக் குறிக்கிறது. இரு ஏற்பாடுகளிலும் அந்த நபரை எளிதில் அடையாளம் காணும் வழக்கமான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
