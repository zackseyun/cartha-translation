translation:
  language: ta
  text: ஆனால், பிராந்திய ஆட்சியாளரான ஏரோது, தன் சகோதரனின் மனைவியான ஏரோதியாளைக் குறித்தும், ஏரோது செய்த எல்லாத் தீய செயல்களைக் குறித்தும் அவரால் கண்டிக்கப்பட்டபோது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடிந்துகொள்ளப்பட்டபோது’ அல்லது ‘அவருடைய தவறு வெளிப்படுத்தப்பட்டபோது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒழுக்கரீதியாகக் கண்டிப்பதையோ தவறை வெளிப்படுத்துவதையோ குறிக்கலாம்.
