lexical_decisions:
- source_word: τετραάρχης
  choice: நான்கில் ஒரு பகுதியை ஆட்சி செய்த
  rationale: குறிப்பிட்ட வரலாற்று-அரசியல் பதவியின் பொருளை நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய வகையில் வெளிப்படுத்துகிறது; பொதுவாக ‘ஆட்சியாளர்’ என்று மட்டும் கூறி அதன் தனித்தன்மையை இழக்கவில்லை.
- source_word: ἐλεγχόμενος
  choice: கண்டிக்கப்பட்டபோது
  rationale: ஏரோதின் தவறுகளைச் சுட்டிக்காட்டும் ஒழுக்கரீதியான கடிந்துகொள்ளுதலைத் தெரிவிக்கிறது; வினையெச்ச வடிவம் அடுத்த வசனத்துடன் தொடரும் கிரேக்க வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: ὑπ’ αὐτοῦ
  choice: அவரால்
  rationale: சூழலில் இது யோவானைக் குறித்தாலும், மூலத்தில் உள்ள சுட்டுப்பெயரைத் தெளிவாக்கி விரிவுபடுத்தாமல் அப்படியே பேணுகிறது.
- source_word: περὶ Ἡρῳδιάδος
  choice: ஏரோதியாளைப் பற்றியும்
  rationale: περὶ என்பதன் தொடர்புப்பொருளை இயல்பான தமிழில் தருவதோடு, அடுத்துவரும் இணையான தொடருடனான அமைப்பையும் காக்கிறது.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: தன் சகோதரனின் மனைவியான
  rationale: உறவுநிலையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘தன்’ என்பது இங்கு ஏரோதைக் குறிக்கிறது.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: தான் செய்த எல்லாத் தீய செயல்களைப் பற்றியும்
  rationale: ஏரோது செய்த தீமைகள் அனைத்தையும் குறிக்கும் விரிவான பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து ஏரோதின் எதிர்வினைக்குத் திரும்பும் கதைநடை முரண்பாட்டைத் தெளிவாகக் குறிக்கிறது.
