  rationale: இச்சொல் தீர்க்கதரிசனத் தன்மையுள்ள ஒழுக்கக் கண்டனத்தைத் தக்கவைக்கிறது; அதேவேளை சட்டரீதியான குற்றத்தீர்ப்பு அல்லது கூடுதல் இறையியல் விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
