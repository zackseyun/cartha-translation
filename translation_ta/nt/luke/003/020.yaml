id: LUK.3.20
reference: Luke 3:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: ta
  text: 'அவை எல்லாவற்றோடும் இதையும் சேர்த்துக்கொண்டான்: யோவானைச் சிறையில் அடைத்தான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொறாக, “எல்லாவற்றின்மேலும் இதையும் சேர்த்தான்.” அதாவது, ஏரோது தன் மற்ற எல்லாத் தீய செயல்களோடும் இந்தச் செயலையும் சேர்த்துக்கொண்டான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: சேர்த்துக்கொண்டான்
  rationale: முந்தைய செயல்களுடன் இன்னொரு செயலையும் கூட்டினான் என்ற தொடர்ச்சியான, சேர்க்கை சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῦτο
  choice: இதையும்
  rationale: அடுத்து சொல்லப்படும் குறிப்பிட்ட செயலைச் சுட்டுகிறது; καὶ தரும் ‘கூட/மேலும்’ என்ற சேர்க்கைப் பொருளையும் ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: ἐπὶ πᾶσιν
  choice: அவை எல்லாவற்றோடும்
  rationale: முந்தைய சூழலில் கூறப்பட்ட ஏரோதின் தீய செயல்கள் அனைத்துடனும் இச்செயல் சேர்க்கப்பட்டது என்ற இடியம்சார் பொருளைத் தருகிறது; ‘எல்லாவற்றின்மேல்’ என்ற சொற்சொறான தமிழைவிட இது இயல்பானது.
- source_word: κατέκλεισεν
  choice: சிறையில் அடைத்தான்
  rationale: ஒருவரை அடைத்து வைப்பது என்ற வினையின் konkreமான பொருளையும், தொடர்ந்து வரும் ἐν φυλακῇ என்பதையும் ஒருங்கிணைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: Ἰωάννην
  choice: யோவானை
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ἐν φυλακῇ
  choice: சிறையில்
  rationale: இங்கு φυλακή காவல் அல்லது அடைப்பு இடத்தைக் குறிக்கிறது; ‘சிறையில்’ என்பது நவீன தமிழில் தெளிவான இயல்பான சொல்.
theological_decisions:
- issue: ἐπὶ πᾶσιν என்பதன் குறிப்பு மற்றும் சேர்க்கைப் பொருள்
  choice: ஏரோது இதையும் தன் முந்தைய தீய செயல்கள் அனைத்தோடும் சேர்த்துக்கொண்டான் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எல்லாவற்றின்மேலும் இதையும் சேர்த்தான்’ அல்லது ‘இவை அனைத்துக்கும் மேலாக இதையும் செய்தான்’ என்று இன்னும் சொற்சொறாக வழங்கலாம்.
  rationale: லூக்கா 3:19–20-ன் உடனடிச் சூழல் ஏரோதின் தீய செயல்களைப் பற்றியது. ஆகவே யோவானைச் சிறையில் அடைத்தது அவற்றுடன் சேர்க்கப்பட்ட மேலும் ஒரு தீய செயல் என்பதே இயல்பான வாசிப்பு. இருப்பினும் ‘அவை’ எவற்றைக் குறிக்கிறது என்பதை முதன்மை உரை விரிவாகச் சேர்க்காமல் சூழலுக்கே விட்டுவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. மூலத்தின் சேர்க்கை சார்ந்த சொல்லாட்சியை இயல்பாகத் தர இரு செயல்பகுதிகளுக்கிடையில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
