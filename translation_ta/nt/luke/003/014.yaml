base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: ta
  text: படைவீரர்களும் அவரிடம், “நாங்களும் என்ன செய்ய வேண்டும்?” என்று கேட்டார்கள். அவர் அவர்களிடம், “யாரிடமும் மிரட்டிப் பணம் பறிக்காதீர்கள்[a]; யார்மீதும் பொய்க் குற்றம் சுமத்தாதீர்கள்; உங்கள் ஊதியமே போதுமென்று மனநிறைவோடு இருங்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான கிரேக்க வினைச்சொல் சொல்லடிப்படையில் ஒருவரை ‘உலுக்குதல்’ அல்லது அச்சுறுத்துதல் என்ற எண்ணத்தைத் தரலாம்; இங்கு அதிகாரத்தைத் தவறாகப் பயன்படுத்தி வற்புறுத்திப் பொருள் பறிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஊதியம்” என்பதற்கான கிரேக்கச் சொல் படைவீரர்களுக்குக் கொடுக்கப்பட்ட சம்பளம் அல்லது உணவுப்படி போன்ற வழங்கீட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: படைவீரர்கள்
  rationale: இராணுவப் பணியில் ஈடுபட்டிருந்தவர்களைக் குறிக்கும் பங்கேற்புவினையைச் சூழலுக்கு இயல்பான பெயர்ச்சொல்லாக வழங்குகிறது.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: அப்படியானால், நாங்களும் என்ன செய்ய வேண்டும்?
  rationale: கலந்தாலோசனைப் பொருளுள்ள கேள்வியையும் καὶ ἡμεῖς என்பதன் ‘நாங்களும்’ என்ற வெளிப்படையான வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது. ‘அப்படியானால்’ என்பது முந்தைய குழுக்களின் கேள்விகளுடன் உள்ள தொடர்பைத் தெளிவாக்குகிறது.
- source_word: διασείσητε
  choice: மிரட்டிப் பணம் பறிக்காதீர்கள்
  rationale: அதிகாரம் அல்லது அச்சுறுத்தலைப் பயன்படுத்திக் கட்டாயமாகப் பொருள் பறிக்கும் சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: συκοφαντήσητε
  choice: பொய்க் குற்றம் சுமத்தாதீர்கள்
  rationale: தீங்கு அல்லது ஆதாயத்திற்காக ஒருவர்மீது தவறான குற்றச்சாட்டை முன்வைப்பதைக் குறிக்கும் பொருளைச் சரளமாகத் தருகிறது; உறுதியில்லாத ‘மிரட்டிப் பணம் வாங்குதல்’ என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: ἀρκεῖσθε
  choice: போதுமென்று மனநிறைவோடு இருங்கள்
  rationale: தமக்குக் கிடைப்பதைப் போதுமானதாக ஏற்றுக்கொள்ளும் தொடர்ச்சியான மனப்பாங்கை நிகழ்காலக் கட்டளையின் வலிமையுடன் தெரிவிக்கிறது.
- source_word: ὀψωνίοις
  choice: ஊதியம்
  rationale: இச்சொல் படைவீரர்களுக்கான சம்பளம் அல்லது உணவுப்படி/வழங்கீட்டைக் குறிக்கலாம்; இங்கு பொதுவாகவும் இயல்பாகவும் ‘ஊதியம்’ பொருந்துகிறது.
theological_decisions:
- issue: படைவீரர்களுக்குக் கொடுக்கப்படும் அறநெறி அறிவுரை
  choice: அவர்களுடைய அதிகாரத் துஷ்பிரயோகத்தையும் பேராசையையும் யோவான் தடைசெய்கிறார்; படைப்பணியை விட்டு விலகும்படி இவ்வசனம் கூறவில்லை.
  alternative: இவ்வசனம் படைப்பணியையே மறைமுகமாகக் கண்டிக்கிறது.
  rationale: மூலவாக்கியம் படைவீரர்களை அவர்கள் இருக்கும் நிலையிலேயே நேரடியாக அழைத்து, மிரட்டிப் பறித்தல், பொய்க் குற்றம் சுமத்துதல், ஊதியத்தில் மனநிறைவின்மை ஆகியவற்றைப் பற்றிய கட்டளைகளைத் தருகிறது. இதற்கு அப்பாற்பட்ட கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாங்களும்’ என்பதன் வலியுறுத்தல் காக்கப்பட்டுள்ளது. இரண்டு தடைகளும் தனித்தனியாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளன; மூலத்தில் இல்லாத சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு அடையாளங்களும் உரையில் இடம்பெற்றுள்ளன.
