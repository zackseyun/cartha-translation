base_translation:
  language: en
  yaml_path: translation/nt/luke/003/026.yaml
  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: ta
  text: மாத்தின் மகன், மத்தத்தியாவின் மகன், செமேயினின் மகன், யோசேக்கின் மகன், யோதாவின் மகன்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: லூக்காவின் வம்சவரலாற்றுச் சூழலில் மீண்டும் மீண்டும் வரும் பிறப்புவேற்றுமை உருபு, முன் கூறப்பட்ட ‘மகன்’ என்ற உறவைக் குறிக்கும் சுருக்கமான அமைப்பு. தமிழில் உறவைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘…இன் மகன்’ என்று வழங்கப்பட்டது.
- source_word: Μάαθ
  choice: மாத்
  rationale: கிரேக்கத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் நேரடியாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: Ματταθίου
  choice: மத்தத்தியா
  rationale: Ματταθίας என்ற பெயரின் பிறப்புவேற்றுமை வடிவத்தை அடிப்படைப் பெயராக எடுத்துத் தமிழில் ஒலிப்பெயர்த்தது.
- source_word: Σεμεῒν
  choice: செமேயின்
  rationale: SBLGNT-இல் உள்ள கிரேக்க வடிவத்தின் ஒலியையும் இறுதி நாசியொலியையும் இயன்றவரை பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: Ἰωσὴχ
  choice: யோசேக்
  rationale: இறுதி χ ஒலியை ‘க்’ மூலம் காட்டி, கிரேக்க வாசகத்தை நேரடியாகப் பின்பற்றும் எழுத்துப்பெயர்ப்பு.
- source_word: Ἰωδὰ
  choice: யோதா
  rationale: கிரேக்க Ἰωδά என்பதன் நேரடி தமிழ் ஒலிப்பெயர்ப்பு; எபிரெய வடிவத்தோடு ஒத்திசைக்கவில்லை.
theological_decisions: []
