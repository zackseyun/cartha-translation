translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றின் சங்கிலித் தொடரைத் தெளிவாகக் காட்டும் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தில் ‘மகன்’ என்பதற்கான தனிச்சொல் இவ்வசனத்தில் இல்லாவிட்டாலும், சுற்றியுள்ள வம்சவரலாற்றுச் சூத்திரத்தில் மறைந்துள்ள உறவு தமிழில் வெளிப்படையாக வழங்கப்பட்டது.
