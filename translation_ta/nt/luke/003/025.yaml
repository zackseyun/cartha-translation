  text: மத்தத்தியாவின் மகன், ஆமோசின் மகன், நாகூமின் மகன், எஸ்லியின் மகன், நக்காயின் மகன்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: …இன் மகன்
  rationale: லூக்காவின் வம்சவரலாற்றுச் சூழலில் மீண்டும் வரும் பிறப்புவேற்றுமை உருபு, முந்தைய வசனத்தில் நிறுவப்பட்ட ‘மகன்’ என்ற உறவை மறைமுகமாகக் குறிக்கிறது. தமிழில் உறவைத் தெளிவாகவும் இயல்பாகவும் காட்ட ஒவ்வொரு பெயருடனும் ‘…இன் மகன்’ என வழங்கப்பட்டது.
- source_word: Ματταθίου
  choice: மத்தத்தியா
  rationale: ஆள்பெயர் மொழிபெயர்க்கப்படாமல் கிரேக்க ஒலிவடிவத்தை நெருக்கமாகப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்டது; பிறப்புவேற்றுமை உறவு ‘மத்தத்தியாவின்’ எனக் காட்டப்பட்டது.
- source_word: Ἀμὼς
  choice: ஆமோஸ்
  rationale: ஆள்பெயர் தமிழில் பரிச்சயமான வேதாகமப் பெயர்வடிவில் எழுத்துப்பெயர்க்கப்பட்டது; இங்கு இது தீர்க்கதரிசியை அவசியம் குறிக்காமல் வம்சவரலாற்றிலுள்ள ஒருவரின் பெயராக மட்டுமே வருகிறது.
- source_word: Ναοὺμ
  choice: நாகூம்
  rationale: கிரேக்க Ναούμ என்பதன் ஒலியையும் தமிழில் நிலவும் வேதாகமப் பெயர்வடிவத்தையும் கருத்தில் கொண்டு ‘நாகூம்’ என வழங்கப்பட்டது.
- source_word: Ἑσλὶ
  choice: எஸ்லி
  rationale: ஆள்பெயர் கிரேக்க ஒலிவடிவத்திற்கு நெருக்கமாக ‘எஸ்லி’ என எழுத்துப்பெயர்க்கப்பட்டது; தொடக்கத்தில் தனியான ‘ஹ’ ஒலி சேர்க்கப்படவில்லை.
- source_word: Ναγγαὶ
  choice: நக்காய்
  rationale: கிரேக்க இரட்டை காம்மாவின் ஒலியைத் தமிழில் ‘க்க’ என்றும் இறுதி இரட்டை உயிரொலியை ‘ஆய்’ என்றும் பிரதிபலித்து எழுத்துப்பெயர்க்கப்பட்டது.
