  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: ta
  text: இவர் ஈசாயின் மகன்; ஈசாய் யோபேலின் மகன்; யோபேல் போவாசின் மகன்; போவாஸ் சாலாவின் மகன்; சாலா நகசோனின் மகன்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: … மகன்
  rationale: கிரேக்க மரபுப்பட்டியலில் மீண்டும் வரும் உருபு ஒவ்வொரு பெயருக்கும் முந்தைய தலைமுறை உறவைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘மகன்’ என்ற உறவுச்சொல்லால் வெளிப்படுத்தப்பட்டது.
- source_word: Ἰεσσαὶ
  choice: ஈசாய்
  rationale: எபிரெய வேதாகமப் பெயருடன் ஒத்துப்போகும் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἰωβὴλ
  choice: யோபேத்
  rationale: SBLGNT வாசகமான Ἰωβὴλ-ஐ நேரடியாக ஒலிபெயர்க்காமல், இம்மரபுப்பட்டியலில் ரூத் 4:21–22-இல் வரும் ஓபேதைக் குறிக்கும் பெயர்வடிவமாகப் புரிந்து தமிழில் பரிச்சயமான ‘யோபேத்’ பயன்படுத்தப்பட்டது.
- source_word: Βόος
  choice: போவாஸ்
  rationale: Boaz என்பதற்கான பரிச்சயமான தமிழ் வேதாகமப் பெயர்வடிவம்.
- source_word: Σαλὰ
  choice: சாலா
  rationale: மூல கிரேக்கப் பெயர்வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு; இதனை உரை ஆதாரமின்றி ‘சல்மோன்’ என ஒத்திசைக்கவில்லை.
- source_word: Ναασσὼν
  choice: நகசோன்
  rationale: Nahshon என்பதற்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: மரபுப்பட்டியலின் உறவுத் தொடர்
  choice: ஒவ்வொரு பெயரையும் ‘X, Y-இன் மகன்’ என்ற தொடராக வெளிப்படுத்துதல்
  alternative: பெயர்களை மட்டும் ஆறாம் வேற்றுமையில் தொடர்ச்சியாக அமைத்தல்
  rationale: மூலத்தின் இலக்கணச் சுருக்கத்தைப் பாதுகாத்தபடியே, தனி வசனமாக வாசிக்கும்போது தமிழில் தலைமுறை உறவு தெளிவாக இருக்க வேண்டும்.
- issue: Σαλὰ என்ற பெயரை இணை மரபுப்பட்டியலுடன் ஒத்திசைத்தல்
  choice: சாலா
  alternative: சல்மோன்
  rationale: மூல உரை Σαλὰ என இருப்பதால், மத்தேயு அல்லது ரூத்தின் மரபுப்பட்டியலுடன் அமைதியாக ஒத்திசைக்காமல் உரையின் பெயர்வடிவம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட மரபுப்பட்டியல் நடை. முந்தைய வசனத்திலிருந்து தொடரும் அமைப்பை உணர்த்த ‘இவர்’ தொடக்கத்தில் சேர்க்கப்பட்டது; அரைப்புள்ளிகள் தலைமுறைகளைத் தெளிவாகப் பிரிக்கின்றன.
