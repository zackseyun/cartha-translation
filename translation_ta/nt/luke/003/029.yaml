  language: en
  yaml_path: translation/nt/luke/003/029.yaml
  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: ta
  text: யெஷுவாவின் மகன், எலியேசரின் மகன், யோரீமின் மகன், மத்தாத்தின் மகன், லேவியின் மகன்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: யேசு
  rationale: கிரேக்கப் பெயரான Ἰησοῦς என்பதன் தமிழ் ஒலிபெயர்ப்பு; இங்கு வம்சவரலாற்றில் வரும் நபரின் பெயராக இருப்பதால் இயேசு கிறிஸ்துவுக்குப் பொதுவாகப் பயன்படுத்தப்படும் «இயேசு» என்பதிலிருந்து வேறுபடுத்த «யேசு» தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ἐλιέζερ
  choice: எலியேசர்
  rationale: கிரேக்கப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἰωρὶμ
  choice: யோரீம்
  rationale: கிரேக்க வடிவத்தின் ஒலியைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Μαθθὰτ
  choice: மத்தாத்
  rationale: இரட்டை θ ஒலியையும் இறுதி மெய்யையும் இயல்பான தமிழ் பெயர் வடிவில் பிரதிபலிக்கிறது.
- source_word: Λευὶ
  choice: லேவி
  rationale: வேதாகமத் தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: τοῦ
  choice: —இன் மகன்
  rationale: வம்சவரலாற்றில் தொடரும் கிரேக்க உருபின் உறவுப் பொருளைத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: Ἰησοῦ என்ற பெயரின் அடையாளம்
  choice: யேசு
  alternative: இயேசு / யோசுவா
  rationale: மூலத்தில் பெயர் ஒரே கிரேக்க வடிவில் இருந்தாலும், இந்த வம்சவரலாற்று நபரை இயேசு கிறிஸ்துவுடன் குழப்பாமல் காட்ட ஒலிபெயர்ப்புச் சிறு வேறுபாடு பயன்படுத்தப்பட்டது; «யோசுவா» என்று மாற்றுவது மூலத்தில் வெளிப்படையாக இல்லாத எபிரெய வடிவத்தைத் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; வம்சவரலாற்றின் தொடர் அமைப்பையும் அடுத்த வசனத்துடன் இணையும் இறுதிக் காற்புள்ளியையும் காக்கும் சுருக்கமான, கண்ணியமான நடை.
