  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: ta
  text: வரி வசூலிப்பவர்கள்கூட திருமுழுக்கு பெற வந்தார்கள்[a]. அவர்கள் அவரிடம், “ஆசிரியரே, நாங்கள் என்ன செய்ய வேண்டும்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வரி வசூலிப்பவர்களும் திருமுழுக்கு பெற வந்தார்கள்.”
    reason: δέ மற்றும் καί ஆகியவற்றின் சேர்த்தல்/வலியுறுத்தலைத் தமிழில் வேறுவிதமாக அமைக்கலாம்.
lexical_decisions:
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: இறந்தகால aorist வினை இங்கு நிகழ்வை எளிய கடந்தகாலமாகக் குறிப்பிடுகிறது.
- source_word: δὲ καὶ τελῶναι
  choice: வரி வசூலிப்பவர்கள்கூட
  rationale: δέ உரையின் முன்னேற்றத்தையும் καί சேர்த்தல் அல்லது வலியுறுத்தலையும் தருகின்றன; ‘கூட’ அவர்களுடைய குறிப்பிடத்தக்க சேர்க்கையை இயல்பான தமிழில் காக்கிறது.
- source_word: τελῶναι
  choice: வரி வசூலிப்பவர்கள்
  rationale: அரசுக்கான வருவாயை வசூலித்தவர்களைக் குறிக்கிறது; நவீன வாசகருக்கு தெளிவான பொதுமொழி.
- source_word: βαπτισθῆναι
  choice: திருமுழுக்குப் பெற
  rationale: செயப்பாட்டு infinitive, அவர்கள் வந்த நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: εἶπαν πρὸς αὐτόν
  choice: அவர்கள் அவரிடம் … என்று கேட்டார்கள்
  rationale: மூல வினை நேரடியாக ‘சொன்னார்கள்’ என்றாலும், அதன் உள்ளடக்கம் கேள்வியாக இருப்பதால் இயல்பான தமிழில் ‘கேட்டார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை மரியாதையுடன் நேரடியாக அழைப்பதை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: τί ποιήσωμεν
  choice: நாங்கள் என்ன செய்ய வேண்டும்?
  rationale: ஆலோசனை நாடும் aorist subjunctive-இன் நடைமுறை மற்றும் ஒழுக்கவியல் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: யோவானின் மனந்திரும்புதல் அழைப்புக்கு சமூகத்தில் இகழப்பட்ட வரி வசூலிப்பவர்களும் பதிலளித்தது
  choice: ‘வரி வசூலிப்பவர்கள்கூட’ என்று வலியுறுத்தலைக் காத்தல்
  alternative: ‘வரி வசூலிப்பவர்களும்’
  rationale: καί தரும் சேர்த்தல்/வலியுறுத்தலைப் பாதுகாக்கிறது; அதேவேளையில் அவர்களைப் பற்றி மூலத்தில் இல்லாத ஒழுக்கத் தீர்ப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வரி வசூலிப்பவர்கள்’ தெளிவுக்காகவும், ‘திருமுழுக்கு’ வேதாகமப் பயன்பாட்டின் தொடர்ச்சிக்காகவும் தேர்ந்தெடுக்கப்பட்டன.
