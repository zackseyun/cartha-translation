id: LUK.3.15
reference: Luke 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: ta
  text: மக்கள் ஆவலுடன் எதிர்பார்த்துக்கொண்டிருந்தபோது, எல்லாரும் யோவானைக் குறித்து, ஒருவேளை இவரே மெசியாவாக இருப்பாரோ[a] என்று தங்கள் உள்ளங்களில் சிந்தித்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “கிறிஸ்து.” கிரேக்கத்தில்: ho christos.'
    reason: Χριστός என்ற பட்டப்பெயருக்கான மரபுவழி மாற்று மொழிபெயர்ப்பையும் கிரேக்க வடிவையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: ஆவலுடன் எதிர்பார்த்துக்கொண்டிருந்தபோது
  rationale: தொடர்ந்து நிலவிய எதிர்பார்ப்பையும், பின்னணி அமைக்கும் genitive absolute கட்டமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு வலுவான எதிர்மறை மாறுபாடு இல்லை; மென்மையான கதைத் தொடர்ச்சியைத் தமிழ் வாக்கிய அமைப்பே இயல்பாகக் காட்டுகிறது.
- source_word: τοῦ λαοῦ
  choice: மக்கள்
  rationale: λαός என்பதன் கூட்டுப்பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: διαλογιζομένων πάντων
  choice: எல்லாரும் ... சிந்தித்துக்கொண்டிருந்தார்கள்
  rationale: அனைவரின் தொடர்ச்சியான உள்ளார்ந்த ஆலோசனை அல்லது சிந்தனையைப் பாதுகாக்கிறது.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: தங்கள் உள்ளங்களில்
  rationale: வேதாகமப் பயன்பாட்டிலுள்ள உள்ளார்ந்த எண்ணம் மற்றும் பரிசீலனை ஆகியவற்றை ‘உள்ளம்’ இயல்பாக உள்ளடக்குகிறது.
- source_word: περὶ τοῦ Ἰωάννου
  choice: யோவானைக் குறித்து
  rationale: περί + genitive என்பதன் ‘குறித்து’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: μήποτε ... εἴη
  choice: ஒருவேளை ... இருப்பாரோ என்று
  rationale: மறைமுகக் கேள்வியிலுள்ள ஐயத்தையும் சாத்தியத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: αὐτὸς
  choice: இவரே
  rationale: யோவானைக் குறிப்பதோடு, கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலையும் காட்டுகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு இது யோவானின் அடையாளத்தைப் பற்றிய யூத மக்களின் எதிர்பார்ப்பில் வரும் பட்டப்பெயர்; ஆகவே ‘மெசியா’ சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: Χριστός என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பெயரைப் போல் அல்லாமல் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக உள்ளது. ‘மெசியா’ அந்த வரலாற்று-யூதச் சூழலைத் தெளிவாகப் பாதுகாக்கிறது; மாற்று மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருப்பாரோ’ என்பது மூலத்திலுள்ள தயக்கத்தையும் தீர்மானிக்கப்படாத சாத்தியத்தையும் நிலைநிறுத்துகிறது.
