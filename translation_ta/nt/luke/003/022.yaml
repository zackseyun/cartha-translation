  to: 'மேலும், பரிசுத்த ஆவியானவர் உடல் வடிவில் புறாவைப் போல அவர்மேல் இறங்கினார். அப்போது வானத்திலிருந்து ஒரு குரல் வந்தது: “நீ என் அன்புக்குரிய மகன்; உன்னில் நான் மகிழ்ந்தேன்.[a]”'
  rationale: The sole revision reorders the two adverbial expressions so that “உடல் வடிவில்” unambiguously modifies the Spirit’s descent, while “புறாவைப் போல” remains a comparison rather than an assertion that the Spirit literally became a dove. The main rendering of εὐδόκησα retains the Greek aorist’s past orientation; the existing note preserves the idiomatic present alternative.
