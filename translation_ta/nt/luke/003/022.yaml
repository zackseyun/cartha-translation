reference: Luke 3:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: ta
  text: 'மேலும், பரிசுத்த ஆவியானவர் உடல் வடிவில் புறாவைப் போல அவர்மேல் இறங்கினார். அப்போது வானத்திலிருந்து ஒரு குரல் வந்தது: “நீ என் அன்புக்குரிய மகன்; உன்னில் நான் மகிழ்ந்தேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னில் நான் மகிழ்கிறேன்.”
    reason: εὐδόκησα என்ற இறந்தகால வடிவம் இங்கு நிலையான மகிழ்ச்சி அல்லது அங்கீகாரத்தை வெளிப்படுத்துவதாகவும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: καταβῆναι
  choice: இறங்கினார்
  rationale: கீழ்நோக்கிய இயக்கத்தைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் வினைச்சொல்; கதைத் தொடரிலுள்ள இறந்தகால நிகழ்வாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: தமிழ் வேதாகம மொழிநடையில் பரவலாக அறியப்பட்டதும், நவீன வாசகருக்குத் தெளிவானதும், இங்கு தனிப்பட்ட செயற்பாட்டாளரைக் குறிக்கும் மரியாதை விகுதியுடன் இயல்பாக அமைவதும் ஆகும்.
- source_word: σωματικῷ εἴδει
  choice: உடல் வடிவில்
  rationale: ஆவியானவரின் இறங்குதல் காணக்கூடிய உருவ வெளிப்பாடாக இருந்ததை நேரடியாகத் தெரிவிக்கிறது; அதை வெறும் உள்ளார்ந்த அனுபவமாக மாற்றவில்லை.
- source_word: ὡς περιστερὰν
  choice: புறாவைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையைப் பாதுகாக்கிறது; ஆவியானவர் சொற்பொருளில் புறாவாக மாறினார் என்று உரை கூறுவதைவிட அதிகமாக வலியுறுத்தாது.
- source_word: ἐπ’ αὐτόν
  choice: அவர்மேல்
  rationale: இயேசுவின்மேல் நிகழ்ந்த இறங்குதலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: வானத்திலிருந்து ஒரு குரல் வந்தது
  rationale: குரல் நிகழ்ந்தது என்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: Σὺ εἶ
  choice: நீ
  rationale: நேரடி அழைப்பிலுள்ள இரண்டாம் நபர் ஒருமையைத் தெளிவாக வைத்திருக்கிறது; தமிழில் ‘நீ’ என்பதே போதிய நேரடித்தன்மையையும் வலியுறுத்தலையும் தருகிறது.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: என் அன்புக்குரிய மகன்
  rationale: மகனுறவையும் ἀγαπητός என்பதன் நேசத்திற்குரியவர் என்ற பொருளையும் இயல்பான, கண்ணியமான தமிழில் இணைக்கிறது.
- source_word: ἐν σοὶ
  choice: உன்னில்
  rationale: ἐν என்பதன் வடிவத்தையும் தெய்வீக மகிழ்ச்சி மகனில் இருப்பதாகச் சொல்லும் உரையின் தன்மையையும் பாதுகாக்கிறது; ‘உன்னைக் குறித்து’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: εὐδόκησα
  choice: நான் மகிழ்ந்தேன்
  rationale: கிரேக்க இறந்தகால வடிவை நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ். தொடர்ந்து நிலைக்கும் மகிழ்ச்சியை வெளிப்படுத்தும் நிகழ்கால மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஆவியானவரின் வெளிப்பாட்டின் இயல்பு
  choice: ஆவியானவர் காணக்கூடிய உடல் வடிவில் இறங்கினார்; அந்த இறங்குதல் புறாவோடு ஒப்பிடப்படுகிறது.
  alternative: ஆவியானவர் உண்மையான புறாவாக இறங்கினார்.
  rationale: σωματικῷ εἴδει ὡς περιστερὰν என்பது காணக்கூடிய வெளிப்பாட்டையும் ஒப்புமையையும் இணைக்கிறது. ‘புறாவைப் போல’ என்பது கிரேக்க உரையைவிட வலுவான உருவமாற்றக் கருத்தைச் சேர்க்காமல் இந்த வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: εὐδόκησα என்பதன் காலமும் கருத்தும்
  choice: முதன்மை உரையில் ‘நான் மகிழ்ந்தேன்’ என்று இறந்தகால வடிவம் பாதுகாக்கப்படுகிறது.
  alternative: ‘நான் மகிழ்கிறேன்’ என்று நிலையான தற்போதைய மகிழ்ச்சியாக மொழிபெயர்த்தல்.
  rationale: εὐδόκησα இலக்கணரீதியாக இறந்தகால வடிவம். இருப்பினும் இந்த அறிவிப்பு தொடரும் அங்கீகாரத்தையும் மகிழ்ச்சியையும் குறிக்கும் என இயல்பாகப் புரிந்துகொள்ளப்படலாம்; ஆகவே அந்த மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த ஆவியானவர்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்களும் பிரிவுசார் விளக்கங்களும் தவிர்க்கப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் இணைப்பை ‘மேலும்’ என்பதும், இரண்டாவது நிகழ்வின் கதைத் தொடரை ‘அப்போது’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
