source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: ta
  text: இதோ, அந்த நகரத்தில் இருந்த ஒரு பாவிப் பெண், அவர் பரிசேயரின் வீட்டில் உணவருந்தச் சாய்ந்திருந்ததை அறிந்து, நறுமணத் தைலமுள்ள அலபாஸ்தர் கல் குடுவை ஒன்றைக் கொண்டுவந்தாள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அவளுடைய பாவம் எத்தகையது என்று கிரேக்க மூலவாசகம் குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அலபாஸ்தர் என்பது நறுமணத் தைலம் போன்றவற்றை வைக்கப் பயன்படுத்தப்பட்ட ஒரு வகைக் கல் குடுவை; அக்கால விருந்துகளில் மக்கள் மேசையருகே சாய்ந்து உணவருந்தினர்.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் புதிய நபரை வியப்புடனும் உயிரோட்டத்துடனும் அறிமுகப்படுத்தும் உரையாடல்-சுட்டியின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: அந்த நகரத்தில் ... இருந்த
  rationale: ἐν என்பதன் இடப்பொருளை நேரடியாகத் தக்கவைக்கிறது; ‘அந்நகரைச் சேர்ந்த’ அல்லது ‘அங்கு வாழ்ந்த’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: ἁμαρτωλός
  choice: பாவியாக
  rationale: அந்தப் பெண்ணைப் பற்றிய பெயர்ச்சொல் சார்ந்த அறநிலை விவரிப்பைத் தக்கவைக்கிறது; அவளுடைய குறிப்பிட்ட பாவம் என்னவென்று ஊகிக்கவில்லை.
- source_word: ἐπιγνοῦσα
  choice: அறிந்து
  rationale: முதன்மைச் செயலுக்கு முன் அவள் அந்தத் தகவலை அறிந்ததைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: κατάκειται
  choice: உணவுக்காகச் சாய்ந்து அமர்ந்திருப்பதை
  rationale: பண்டைய விருந்துண்ணும் வழக்கிலிருந்த சாய்ந்த நிலையை வெளிப்படுத்துகிறது; வெறுமனே ‘அமர்ந்திருந்தார்’ அல்லது ‘சாப்பிட்டுக்கொண்டிருந்தார்’ என்று மாற்றவில்லை.
- source_word: κομίσασα
  choice: கொண்டுவந்தாள்
  rationale: அவள் அந்தப் பொருளைத் தன்னுடன் எடுத்துவந்தாள் என்ற பொருளை இயல்பான தமிழில் அளிக்கிறது.
- source_word: ἀλάβαστρον μύρου
  choice: நறுமணத் தைலம் நிறைந்த பளிங்குக்கல் குடுவை
  rationale: கொள்கலனையும் அதன் மணமிக்க தைல உள்ளடக்கத்தையும் தெளிவாகத் தருகிறது; ‘அலபாஸ்தர்’ என்ற அறிமுகமற்ற ஒலிபெயர்ப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: பெண்ணின் பாவநிலை பற்றிய அடையாளம்
  choice: பாவியாக இருந்த ஒரு பெண்
  alternative: ஒழுக்கங்கெட்ட பெண் / விபச்சாரி
  rationale: கிரேக்கச் சொல் அவளை ‘பாவி’ என்று மட்டுமே குறிப்பிடுகிறது; அவளுடைய பாவத்தின் தன்மையைக் கூறவில்லை. ஆகவே மரபுவழி ஊகத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற சற்றே உயர்ந்த கதைநடைச் சொல் லூக்காவின் உயிரோட்டமான அறிமுகத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
