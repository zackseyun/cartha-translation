  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: ta
  text: நீ என் தலையில் எண்ணெய் பூசவில்லை; ஆனால் இவள் என் கால்களில் நறுமணத் தைலம் பூசினாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλαίῳ
  choice: எண்ணெய்
  rationale: கருவிப் பொருளைக் குறிக்கும் வேற்றுமையில் வந்துள்ள ἔλαιον என்பதன் இயல்பான தமிழாக்கம். இங்கு ‘ஒலிவ எண்ணெய்’ என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: ἤλειψας / ἤλειψεν
  choice: பூசவில்லை / பூசினாள்
  rationale: ἀλείφω என்பது எண்ணெயையோ தைலத்தையோ உடலில் பூசுதல் அல்லது தடவுதல் என்று பொருள்படும். விருந்தோம்பல் சூழலில் இயல்பாகவும், சடங்குசார் பொருளை மிகைப்படுத்தாமலும் இருக்க ‘பூசு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὴν κεφαλήν μου
  choice: என் தலையில்
  rationale: தமிழில் ‘பூசு’ என்ற வினையுடன் உடலுறுப்பை இடவேற்றுமையில் அமைப்பது இயல்பானது; பொருள் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: αὕτη δὲ
  choice: ஆனால் இவள்
  rationale: முன்னுள்ள ‘நீ’ என்பதுடன் உள்ள வலுவான முரண்பாட்டையும், அங்கே இருக்கும் பெண்ணைச் சுட்டுவதையும் பாதுகாக்கிறது.
- source_word: μύρῳ
  choice: நறுமணத் தைலம்
  rationale: μύρον என்பது மணமுள்ள எண்ணெய் அல்லது தைலத்தைக் குறிக்கிறது. சாதாரண எண்ணெயுக்கும் விலையுயர்ந்த மணத் தைலத்துக்கும் உள்ள வேறுபாட்டைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τοὺς πόδας μου
  choice: என் கால்களில்
  rationale: பன்மையைப் பாதுகாக்கும் இயல்பான தமிழாக்கம்; ‘பூசு’ என்பதற்கு ஏற்ற இடவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவின் கண்டிப்பிலுள்ள விருந்தோம்பல் மற்றும் மரியாதை சார்ந்த முரண்பாடு
  choice: சீமோன் செய்யாத சாதாரண விருந்தோம்பலையும் பெண் செய்த மிகுதியான மரியாதையையும் நேரடியாக முரண்படுத்தும் சொற்கள்
  alternative: முறைப்படியான அபிஷேகம் அல்லது திருநிலைப்படுத்தலைத் தெளிவாக உணர்த்தும் சடங்குசார் சொற்கள்
  rationale: உடனடிச் சூழல் விருந்தினருக்குக் காட்டப்படும் மரியாதையை ஒப்பிடுகிறது. ‘பூசு’ என்பது மூல வினையின் பொருளைப் பாதுகாத்தாலும், உரையில் வெளிப்படையாக இல்லாத சடங்கு அல்லது சமயப் பொருளைத் திணிக்காது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை. ‘எண்ணெய்’ மற்றும் ‘நறுமணத் தைலம்’ என்ற சொற்கள் மூலத்திலுள்ள ἔλαιον–μύρον வேறுபாட்டைப் பாதுகாக்கின்றன. இவ்வசனத்திற்கு அவசியமான உரை அல்லது பொருள் மாற்றுக் குறிப்பு இல்லை.
