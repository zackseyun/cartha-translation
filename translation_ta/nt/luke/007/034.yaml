source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: ta
  text: மனிதகுமாரன் உண்டும் குடித்தும் வந்திருக்கிறார்; நீங்கள், ‘இதோ, பெருந்தீனிக்காரனும் குடிகாரனுமான ஒரு மனிதன், வரிவசூலிப்பவர்களுக்கும் பாவிகளுக்கும் நண்பன்!’ என்று சொல்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘குடிகாரன்’ என்பதற்கான சொற்சொல்லான மாற்று மொழிபெயர்ப்பு: ‘திராட்சரசம் குடிப்பவன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: வந்திருக்கிறார்
  rationale: ἔρχομαι என்பதன் நிறைவுக்கால வடிவம் வருகை நிகழ்ந்து அதன் விளைவு தொடர்வதை உணர்த்துகிறது; ‘வந்திருக்கிறார்’ என்பது தமிழில் அந்த வந்தடைந்த-தற்போதுள்ள நுணுக்கத்தை இயல்பாகக் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயக்குறிப்புப் பட்டத்தைத் தமிழில் பரவலாக அறியப்படும் வடிவில் தருகிறது; அதன் பட்டத்தன்மையையும் சாத்தியமான தானியேல் நூல் எதிரொலியையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: ἐσθίων καὶ πίνων
  choice: உண்டும் குடித்தும்
  rationale: இரு நிகழ்கால வினையெச்சங்களும் அவர் வந்த விதத்தையோ அதனுடன் சேர்ந்த நடத்தையையோ காட்டுகின்றன; இணையான தமிழ் வினையெச்சங்கள் இயல்பாக அதைப் பிரதிபலிக்கின்றன.
- source_word: λέγετε
  choice: நீங்கள் ... என்று சொல்கிறீர்கள்
  rationale: நேரடியாகச் சுட்டப்படும் பன்மை முன்னிலையின் நிகழ்காலச் செயலை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் வியப்பும் சுட்டுதலும் கொண்ட மூலச்சொல்லின் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள பெயர்ச்சொல்லைக் காத்து, அதைத் தொடர்ந்து வரும் இழிவான அடைமொழிகளை இயல்பான தமிழ் அமைப்பில் இணைக்கிறது.
- source_word: φάγος
  choice: பெருந்தீனிக்காரன்
  rationale: அளவுக்கு மீறி உண்பவன் என்ற இழிவான குற்றச்சாட்டை சுருக்கமாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: οἰνοπότης
  choice: குடிகாரன்
  rationale: சொற்பிறப்பின்படி ‘திராட்சரசம் குடிப்பவன்’ என்றாலும், இச்சூழலில் உள்ள இழிவான குற்றச்சாட்டின் வலிமையை நவீன தமிழில் ‘குடிகாரன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φίλος
  choice: நண்பன்
  rationale: முந்தைய குற்றச்சாட்டுகளுடன் இணைக்கப்பட்ட பயனிலைப் பெயராக நேரடியாகவும் இயல்பாகவும் அமைகிறது.
- source_word: τελωνῶν
  choice: வரிவசூலிப்பவர்கள்
  rationale: அக்காலத்தில் அரசுக்காகச் சுங்கம் அல்லது வரி வசூலித்தவர்களை நவீன வாசகர்களுக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: ἁμαρτωλῶν
  choice: பாவிகள்
  rationale: எதிரிகள் பயன்படுத்திய சமூக-சமய அடையாளச் சொல்லை விளக்கிச் சுருக்காமலும் மென்மையாக்காமலும் காக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற இயேசுவின் பட்டத்தை மொழிபெயர்த்தல்
  choice: மனிதகுமாரன்
  alternative: மனித மைந்தன் / மானிடர் ஒருவர்
  rationale: நிலையான தமிழ் வேதாகமப் பட்டத்தைக் காப்பதால் கிறிஸ்துவியல் முக்கியத்துவமும் சாத்தியமான தானியேல் நூல் தொடர்பும் நீடிக்கின்றன; பொதுவான ‘மனிதன்’ என்ற பொருளாக மட்டும் தீர்மானிக்கப்படவில்லை.
- issue: இயேசுவுக்கு எதிரான குற்றச்சாட்டுகளின் வலிமை
  choice: பெருந்தீனிக்காரனும் குடிகாரனுமான ஒரு மனிதன்
  alternative: அதிகம் உண்பவனும் திராட்சரசம் குடிப்பவனுமான மனிதன்
  rationale: இவை உரையாளர் உறுதிப்படுத்தும் ஒழுக்கத் தீர்ப்புகள் அல்ல, எதிரிகள் கூறும் பகைமையான பழிச்சொற்கள். ஆகவே அவற்றின் கூர்மையை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘ஆனால்’ என்பது கிரேக்க καί-யின் தொடர்ச்சிக்குள் இங்குள்ள எதிர்மறைத் திருப்பத்தை தமிழில் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு முழுக் குற்றச்சாட்டுத் தொடரின் முடிவில் வைக்கப்பட்டுள்ளது.
