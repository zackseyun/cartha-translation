id: LUK.7.14
reference: Luke 7:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: ta
  text: அவர் அருகில் சென்று, பாடையை[a] தொட்டார். அதைச் சுமந்தவர்கள் அப்படியே நின்றார்கள். அப்போது அவர், “இளைஞனே, நான் உனக்குச் சொல்கிறேன், எழுந்திரு!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சவப்பெட்டி” அல்லது “உடலைச் சுமந்து செல்லும் கட்டில்.” கிரேக்கச் சொல், இறுதி ஊர்வலத்தில் இறந்தவரின் உடலை எடுத்துச் செல்லப் பயன்படுத்தப்பட்ட பாடை அல்லது சுமப்புச் சட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: அருகில் சென்று
  rationale: இயேசு பாடையை அணுகிச் சென்றதையும், அதன் பின்பு அதைத் தொட்டார் என்ற நிகழ்வுகளின் வரிசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἥψατο
  choice: தொட்டார்
  rationale: இச்சூழலில் ἅπτω என்பதன் நடுநிலை வடிவம் ‘தொடுதல்’ அல்லது ‘பற்றிக்கொள்ளுதல்’ எனப் பொருள்படலாம்; நீடித்துப் பற்றியதாக மிகைப்படுத்தாமல் ‘தொட்டார்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: σοροῦ
  choice: பாடையை
  rationale: σορός என்பது இறுதி ஊர்வலத்தில் இறந்தவரின் உடலைச் சுமந்து செல்லப் பயன்படுத்தப்பட்ட திறந்த சுமப்புச் சட்டம் அல்லது கட்டிலைக் குறிக்கிறது; நவீன மூடிய சவப்பெட்டியை அவசியம் குறிக்காது. ‘பாடை’ வரலாற்றுச் சூழலுக்கும் இயல்பான தமிழ்ப் பயன்பாட்டுக்கும் ஏற்றது.
- source_word: οἱ δὲ βαστάζοντες
  choice: அதைச் சுமந்தவர்கள்
  rationale: பாடையைச் சுமந்து சென்றவர்களைத் தெளிவாகவும் பாலினத்தை மூலவசனத்தை விட அதிகமாகக் குறிப்பாக்காமலும் காட்டுகிறது.
- source_word: ἔστησαν
  choice: அப்படியே நின்றார்கள்
  rationale: அவர்கள் நகர்வதை நிறுத்தி, இருந்த இடத்திலேயே நின்றார்கள் என்ற இரு நுட்பங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Νεανίσκε
  choice: இளைஞனே
  rationale: இளம் ஆணை நேரடியாக அழைக்கும் vocative வடிவத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: σοὶ λέγω
  choice: நான் உனக்குச் சொல்கிறேன்
  rationale: σοί என்ற வலியுறுத்தப்பட்ட மறைவேற்றுமைச் சுட்டுப்பெயரின் நேரடித்தன்மையையும், இயேசுவின் உரையின் வலிமையையும் காக்கிறது.
- source_word: ἐγέρθητι
  choice: எழுந்திரு
  rationale: இறந்த இளைஞனுக்கு வழங்கப்படும் நேரடிக் கட்டளையை இயல்பான, கண்ணியமான தமிழில் தருகிறது; ‘எழுப்பப்படு’ என்ற செயப்பாட்டு வடிவத்தை விட நேரடி உரையில் இயல்பாக உள்ளது.
theological_decisions:
- issue: இறந்த இளைஞனிடம் இயேசு கூறும் கட்டளையின் தொனியும் ἐγέρθητι என்பதன் வடிவமும்
  choice: “எழுந்திரு!” என்று நேரடிக் கட்டளையாக மொழிபெயர்த்தல்
  alternative: “எழுப்பப்படு” அல்லது இன்னும் பேச்சுவழக்கான கட்டளை
  rationale: கிரேக்க வடிவம் இலக்கணரீதியாகச் செயப்பாட்டு வடிவமாகப் புரிந்துகொள்ளப்பட வாய்ப்பிருந்தாலும், இச்சூழலில் எழுந்திருப்பதற்கான நேரடிக் கட்டளையாக இயல்பாகச் செயல்படுகிறது. ‘எழுந்திரு’ என்பது அற்புதத்தின் அதிகாரமிக்க, தீவிரமான தொனியைப் பாதுகாக்கிறது; அதேவேளை கூடுதல் கோட்பாட்டு விளக்கத்தை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பாடை’ வரலாற்றுச் சூழலைத் துல்லியமாகக் காட்டுகிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான καί இணைப்புகள் தமிழில் செயற்கையாக ஒலிக்காமல் இருக்க வாக்கியப் பிரிப்பும் ‘அப்போது’ என்ற இயல்பான நிகழ்வுத் தொடர்பும் பயன்படுத்தப்பட்டுள்ளன.
