source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: ta
  text: ஏனெனில், திருமுழுக்கு கொடுக்கும் யோவான் அப்பம் சாப்பிடாமலும் திராட்சரசம் குடிக்காமலும் வந்திருக்கிறார்; நீங்களோ, ‘அவருக்குப் பேய் பிடித்திருக்கிறது’ என்று சொல்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: வந்திருக்கிறார்
  rationale: ἔρχομαι என்பதன் நிறைவேற்றுக் கால வடிவம் கடந்த வருகையின் தற்போதைய தொடர்பை உணர்த்துவதால், தமிழில் ‘வந்திருக்கிறார்’ என்று இயல்பாகக் கொடுக்கப்பட்டது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்லாக இருப்பதால் ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: திருமுழுக்கு கொடுக்கும் யோவான்
  rationale: βαπτιστής என்பது செயலைச் செய்பவரைக் குறிக்கிறது; பெயருடன் சேர்ந்த சமயப் பிரிவுப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படாதவாறு, நவீன தமிழில் தெளிவான செயற்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: அப்பம் சாப்பிடாமலும் திராட்சரசம் குடிக்காமலும்
  rationale: ἄρτος என்ற குறிப்பான சொல்லை ‘உணவு’ என்று பொதுமைப்படுத்தாமல் ‘அப்பம்’ என்றும், οἶνος என்பதை ‘திராட்சரசம்’ என்றும் மொழிபெயர்த்து, யோவானின் துறவுநெறியான வாழ்க்கை முறையை விவரிக்கும் பங்கேற்பு அமைப்பு பாதுகாக்கப்பட்டது.
- source_word: λέγετε
  choice: நீங்கள் ... சொல்கிறீர்கள்
  rationale: கேட்போரின் வழக்கமான தற்போதைய எதிர்வினையைச் சுட்டும் நிகழ்கால வடிவம் தமிழிலும் நிகழ்காலமாக வைக்கப்பட்டது.
- source_word: Δαιμόνιον ἔχει
  choice: அவருக்குப் பேய் பிடித்திருக்கிறது
  rationale: சொல்லுக்குச் சொல் ‘அவரிடம் ஒரு பேய் இருக்கிறது’ என்பதைக் காட்டிலும், அதே குற்றச்சாட்டை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கும் நவீனத் தமிழ் மரபுத்தொடர் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: யோவானுக்கு எதிரான குற்றச்சாட்டில் δαιμόνιον என்பதன் மொழிபெயர்ப்பு
  choice: பேய்
  alternative: அசுத்த ஆவி
  rationale: இங்கு மூலத்தில் δαιμόνιον என்பதே உள்ளது; ‘அசுத்த ஆவி’ என்பது தொடர்புடையதாயினும் வேறான கிரேக்கச் சொற்றொடரின் மொழிபெயர்ப்பு. ஆகவே சொற்களை ஒத்திசைத்து வேறுபாட்டை அழிக்காமல் ‘பேய்’ எனக் கொடுக்கப்பட்டது.
- issue: Δαιμόνιον ἔχει என்ற சொற்றொடரின் வடிவம்
  choice: அவருக்குப் பேய் பிடித்திருக்கிறது
  alternative: அவரிடம் ஒரு பேய் இருக்கிறது
  rationale: தமிழில் ‘பேய் பிடித்திருக்கிறது’ என்பது பேயின் ஆளுகைக்குட்பட்டவர் என்ற குற்றச்சாட்டை இயல்பாகத் தெரிவிக்கிறது; தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் மூலத்தின் நடைமுறைப் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், மரியாதையும் பொதுவாசகத் தெளிவும் கொண்டதாக அமைக்கப்பட்டது. யோவானைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை வினைமுற்றும் சுட்டுப்பெயரும் பயன்படுத்தப்பட்டுள்ளன. வசனத்தில் அடிக்குறிப்பு தேவைப்படாததால் எந்தக் குறியீடும் சேர்க்கப்படவில்லை.
