base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: ta
  text: பரிசேயர்களில் ஒருவன் தன்னோடு உணவருந்தும்படி அவரைக் கேட்டுக்கொண்டிருந்தான்[a]. அவர் அந்தப் பரிசேயனின் வீட்டுக்குள் சென்று, உணவருந்தச் சாய்ந்து அமர்ந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “தன்னோடு அவர் உணவருந்த வேண்டும் என்று அவரைக் கேட்டுக்கொண்டிருந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அக்காலத்தில் முறையான உணவின்போது வழக்கமாகச் செய்ததுபோல், நிமிர்ந்து உட்காராமல் சாய்ந்த நிலையில் அமர்ந்தார்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: கேட்டுக்கொண்டிருந்தான்
  rationale: இறந்தகாலத்தில் நீடித்த அல்லது தொடர்ந்து நடந்த வேண்டுகோளைச் சுட்டும் முற்றுப்பெறா வினைக்காலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது; சூழலில் இது அழைப்பாகச் செயல்பட்டாலும், ‘அழைத்தான்’ என்பதைவிட கிரேக்கச் சொல்லுக்கு நெருக்கமானது.
- source_word: δέ
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதையை மெதுவாக முன்னெடுக்கும் இணைப்புச்சொல். தமிழில் வசனத்தின் இயல்பான தொடரே அந்தப் பணியைச் செய்வதால், ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற கால அல்லது எதிர்மறை நுணுக்கத்தை உண்டாக்கும்.
- source_word: τις τῶν Φαρισαίων
  choice: பரிசேயர்களில் ஒருவன்
  rationale: பகுதிப்பொருள் கொண்ட மரபுத்தொடரை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: தன்னோடு உணவருந்தும்படி
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘விருந்துண்ண’ என்று மொழிபெயர்த்து உரையில் இல்லாத விருந்தின் தன்மையை அதிகமாக வலியுறுத்தவில்லை.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: அந்தப் பரிசேயனின் வீட்டுக்குள் சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை வினையெச்சத்தின் மூலம் இயல்பாகவும் வரிசை மாறாமலும் தருகிறது.
- source_word: κατεκλίθη
  choice: பந்தியில் சாய்ந்து அமர்ந்தார்
  rationale: இது சாதாரணமாக உட்கார்வதை அல்ல, அக்கால முறையான உணவின்போது சாய்ந்த நிலையில் அமர்வதைக் குறிக்கிறது. ‘பந்தியில்’ என்பது உணவுச் சூழலைத் தெளிவாக்குகிறது.
