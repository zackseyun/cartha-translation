  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: ta
  text: ஆனாலும், ஞானம் தன் பிள்ளைகள் அனைவராலும் சரியென உறுதிப்படுத்தப்பட்டது[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியானது என ஏற்றுக்கொள்ளப்பட்டது” அல்லது “சரியானது என நிரூபிக்கப்பட்டது.”
    reason: lexical_alternative
  - marker: b
    text: “பிள்ளைகள்” என்பது ஞானத்தின் உண்மையைத் தங்கள் எதிர்வினையாலோ வாழ்க்கை முறையாலோ வெளிப்படுத்துகிறவர்களைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: c
    text: மத்தேயு 11:19-இல், “ஞானம் தன் செயல்களால் சரியானது என மெய்ப்பிக்கப்பட்டது” என்று உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδικαιώθη
  choice: சரியானது என மெய்ப்பிக்கப்பட்டது
  rationale: இங்கு δικαιόω என்பது பவுலின் கடிதங்களில் காணப்படும் நீதிமானாக்குதல் என்ற நீதிமன்றப் பொருளை முதன்மையாகக் குறிக்காமல், ஞானம் சரியானது என்று அதன் விளைவுகளால் வெளிப்படையாக உறுதிப்படுத்தப்படுவதைக் குறிக்கிறது. இந்தத் தேர்வு இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: σοφία
  choice: ஞானம்
  rationale: σοφία என்பதற்கான இயல்பான தமிழ்ச் சொல். தொடரில் வரும் ‘தன் பிள்ளைகள்’ என்ற உருவகம் ஞானத்தை ஆளுருவப்படுத்துகிறது.
- source_word: ἀπὸ πάντων
  choice: அனைவராலும்
  rationale: செயப்பாட்டு வினையோடு வரும் ἀπό, செயலை உறுதிப்படுத்தும் நபர்களையோ ஆதார மூலத்தையோ குறிக்கலாம். தமிழில் ‘அனைவராலும்’ என்பது அந்த உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τέκνων
  choice: பிள்ளைகள்
  rationale: τέκνον என்பதன் நேரடிப் பொருளைத் தக்கவைத்து, அதை ‘செயல்கள்’ அல்லது ‘விளைவுகள்’ என்று முதன்மை உரையிலேயே விளக்கிவிடாமல் உருவகத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: αὐτῆς
  choice: தன்
  rationale: αὐτῆς என்பது ஞானத்தைக் குறிக்கிறது. தமிழில் ‘தன்’ என்பது ஞானத்திற்கும் பிள்ளைகளுக்கும் உள்ள உடைமை உறவை இயல்பாகக் காட்டுகிறது; தேவையற்ற பாலினக் குறிப்பையும் புகுத்தாது.
- source_word: καὶ
  choice: ஆனாலும்
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட தலைமுறையின் முரண்பாடான எதிர்வினைக்குப் பின் இங்கு மென்மையான எதிர்மறைத் திருப்பம் உள்ளது. ‘ஆனாலும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஞானத்தின் ‘பிள்ளைகள்’ என்பதன் பொருள்
  choice: தேவ ஞானத்தோடு இசைந்து அதைத் தங்கள் மறுமொழி அல்லது வாழ்க்கையால் வெளிப்படுத்துகிறவர்களைக் குறிக்கும் உருவகமாகப் புரிந்துகொள்ள இடமளித்து, முதன்மை உரையில் ‘பிள்ளைகள்’ என்றே மொழிபெயர்க்கப்பட்டது.
  alternative: ஞானம் உண்டாக்கும் விளைவுகள் அல்லது கனிகள்; அல்லது மத்தேயு 11:19-இல் உள்ள ‘செயல்கள்’ என்பதோடு கருத்தளவில் ஒத்திசைத்தல்.
  rationale: லூக்காவின் கிரேக்க உரை τέκνων (‘பிள்ளைகள்’) என்று வாசிக்கிறது. ஆகவே உருவகத்தையும் அதன் இறையியல் இழுவிசையையும் விளக்கத்தால் மாற்றாமல் முதன்மை உரையில் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மெய்ப்பிக்கப்பட்டது’ என்பது சற்று இலக்கிய நயமுடையதாயினும் பொதுவாகப் புரிந்துகொள்ளக்கூடியது; கிரேக்கச் செயப்பாட்டு வடிவத்தையும் பொதுமுன் சரியென உறுதியாகும் கருத்தையும் சுருக்கமாகக் காக்கிறது. ‘தன் பிள்ளைகள்’ என்பது தமிழில் ஆளுருவப்படுத்தலை இயல்பாகத் தக்கவைக்கிறது.
