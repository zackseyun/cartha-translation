lexical_decisions:
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: இயேசுவின் பேறுபெற்றோர் கூற்றுகளுக்குரிய ஆன்மிக மற்றும் இறையியல் நிறையை இது தக்கவைக்கிறது; ‘மகிழ்ச்சியானவர்’ என்பது இங்கு மிகவும் மேலோட்டமாக அமையும்.
- source_word: ὃς ἐὰν μή
  choice: இடறிவிடாதவர்
  rationale: தனிநபரைக் குறிக்கும் உறவுப்பெயரையும் பொதுவான நிபந்தனையையும் நவீனத் தமிழில் இயல்பான ஒரே தொடராகக் கொடுக்கிறது.
- source_word: σκανδαλισθῇ
  choice: இடறிவிடாதவர்
  rationale: மூலத்திலுள்ள இடறல் உருவகத்தைப் பாதுகாக்கிறது. கிரேக்கத்தில் வினை செயல்பாட்டு விளைவை ஏற்கும் வடிவில் இருந்தாலும், ‘இடறச் செய்யப்படாதவர்’ என்பது தமிழில் செயற்கையாகவும், இயேசுவே நேரடியாக இடறச் செய்கிறார் என்ற தேவையற்ற பொருளுடனும் ஒலிக்கும்.
- source_word: ἐν ἐμοί
  choice: என்னால்
  rationale: இயேசுவை முன்னிட்டு அல்லது அவரால் ஏற்படும் சந்தர்ப்பத்தில் இடறுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறும் இடவியல் பொருளான ‘என்னில்’ என்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறித்து ஏற்படும் இடறலை வெறும் மனவருத்தமாக மென்மைப்படுத்தும் சாத்தியம்
  choice: ‘இடறிவிடாதவர்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என்னைக் குறித்து மனவருத்தம் அடையாதவர்’ அல்லது ‘என்னால் விசுவாசத்தைவிட்டு விலகாதவர்’
  rationale: இந்தக் கூற்று இயேசுவைக் குறித்து தடைப்பட்டு ஆன்மிகமாக இடறும் அபாயத்தை உள்ளடக்குகிறது. ‘மனவருத்தம்’ அதன் வலிமையைக் குறைக்கும்; ‘விசுவாசத்தைவிட்டு விலகுதல்’ அதன் விளைவை மிகத் தெளிவாக நிர்ணயித்துவிடும். ஆகவே மூலத்தின் இறையியல் பதற்றமும் பொருள் அகலமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான பேறுபெற்றோர் கூற்றாக அமைக்கப்பட்டுள்ளது. ‘பேறுபெற்றவர்’ என்ற சொல் வேதாகமச் சூழலின் ஆன்மிக நிறையைத் தக்கவைக்கிறது; ‘இடறிவிடுதல்’ மூல உருவகத்தையும் அதன் திட்டமிட்ட பொருள் அகலத்தையும் பாதுகாக்கிறது.
