  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: ta
  text: அப்போது அவர் அவளிடம், “உன் பாவங்கள் மன்னிக்கப்பட்டுள்ளன[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் வெளிப்படையாக, “உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன.” கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவம் நிறைவேறிய செயலையும் அதன் தொடரும் விளைவையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: என்றார்
  rationale: λέγω என்பதன் இறந்தகால வடிவம் நேரடியாகப் பேசியதைச் சுட்டுகிறது; தமிழ் நேர்கூற்று அமைப்பில் ‘என்றார்’ இயல்பானதும் மரியாதைமிக்கதுமாக உள்ளது.
- source_word: δὲ
  choice: பின்பு
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்வை முன்னெடுக்கும் மென்மையான இணைப்பாக உள்ளது; ‘பின்பு’ கதை ஓட்டத்தை இயல்பாகத் தருகிறது.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: பெண்பால் ஒருமை தத்திவேற்றுமை வடிவம் பேச்சு யாரை நோக்கியது என்பதைக் காட்டுகிறது; ‘அவளிடம்’ என்பது இயல்பான தமிழ்.
- source_word: Ἀφέωνταί
  choice: மன்னிக்கப்பட்டிருக்கின்றன
  rationale: ἀφίημι என்பதன் நிறைவுக்காலச் செயப்பாட்டு வடிவம் நிறைவேறிய செயலையும் அதன் தொடரும் விளைவையும் வெளிப்படுத்துகிறது; ‘மன்னிக்கப்பட்டிருக்கின்றன’ இவ்விரு அம்சங்களையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: σου
  choice: உன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பொருளை இயல்பான தமிழில் ‘உன்’ எனக் கொடுக்கிறது.
- source_word: αἱ ἁμαρτίαι
  choice: பாவங்கள்
  rationale: இச்சூழலில் ἁμαρτίαι கடவுளுக்கு முன்பான ஒழுக்கக் குற்றங்களைக் குறிக்கிறது; உடைமைச் சொல்லுடன் வருவதால் கிரேக்கக் குறிப்புச் சுட்டைத் தனியே மொழிபெயர்க்கத் தேவையில்லை.
theological_decisions:
- issue: Ἀφέωνταί என்ற நிறைவுக்காலச் செயப்பாட்டு வடிவத்தின் வலிமை
  choice: ‘உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன’ என்று நிறைவேறிய மன்னிப்பின் தொடரும் நிலையை வெளிப்படுத்துதல்
  alternative: ‘உன் பாவங்கள் மன்னிக்கப்பட்டன’ அல்லது ‘உன் பாவங்கள் மன்னிக்கப்பட்டுள்ளன’
  rationale: கிரேக்க நிறைவுக்காலம் ஏற்கெனவே நிறைவேறிய செயலையும் அதன் தற்போதைய விளைவையும் ஒருங்கே சுட்டலாம். ‘மன்னிக்கப்பட்டிருக்கின்றன’ அந்த இறையியல் அழுத்தத்தை நேரம் அல்லது செய்பவர் குறித்து மேலதிக விளக்கம் சேர்க்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நேர்கூற்று. ‘அவர்’ மரியாதை ஒருமையாகவும், பெண்ணை நோக்கிய நேரடி உரையில் ‘உன்’ மூலத்தின் இரண்டாம் நபர் ஒருமையை இயல்பாகவும் பிரதிபலிக்கின்றன.
