revisions:
- from: அவர் அவர்களை ஆண்டவரிடம் அனுப்பி, “வரவிருக்கிறவர்[a] நீர்தானா, அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?” என்று கேட்டார்.
  to: அவர் அவர்களை ஆண்டவரிடம் அனுப்பி, “வருகிறவர்[a] நீர்தானா? அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?” என்று கேட்டார்.
  rationale: «வரவிருக்கிறவர்» என்பதற்குப் பதிலாக «வருகிறவர்» பயன்படுத்தப்பட்டுள்ளது; இது ὁ ἐρχόμενος என்ற நிகழ்காலப் பங்கேற்புவினைக்கு நெருக்கமாக இருந்து, சூழலிலுள்ள பட்டத்தன்மையையும் திறந்தவண்ணம் காக்கிறது. அடிக்குறிப்பு மாற்று வாசிப்பைச் சுருக்கமாகவும் நடுநிலையாகவும் விளக்குகிறது. மற்ற சொற்கள் மூலத்தின் பொருளையும் நவீனத் தரத் தமிழின் இயல்பையும் நன்கு காக்கின்றன.
