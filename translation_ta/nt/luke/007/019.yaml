base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: ta
  text: அவர் அவர்களை ஆண்டவரிடம் அனுப்பி, “வருகிறவர்[a] நீர்தானா? அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வரவிருக்கிறவர்.” இந்தக் கிரேக்கச் சொற்றொடரை விளக்கமான பொருளிலும் வாசிக்கலாம்; ஆனால் இச்சூழலில் அது ஒரு பட்டமாகவும் செயல்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: அவர் அவர்களை ... அனுப்பி
  rationale: இறந்தகாலக் கதைநிகழ்வை இயல்பான தமிழில் தருகிறது. அனுப்பப்பட்டவர்கள் முந்தைய சூழலிலிருந்து தெளிவாவதால், தமிழில் தேவையான ‘அவர்களை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: πρὸς τὸν κύριον
  choice: ஆண்டவரிடம்
  rationale: πρός உடன் வரும் குற்றுவேற்றுமை ஒருவரை நோக்கிய அனுப்புதலைக் குறிக்கிறது. κύριος என்பதன் மரியாதையையும் கிறிஸ்துவியல் கனத்தையும் ‘ஆண்டவர்’ காக்கிறது.
- source_word: λέγων
  choice: என்று கேட்டார்
  rationale: பின்வரும் நேரடிக் கேள்வியின் உரையை அறிமுகப்படுத்தும் பங்கேற்புவினையை, இயல்பான தமிழில் கேள்விக்கேற்ற வகையில் தருகிறது; செய்தி அனுப்பப்பட்டவர்கள்மூலம் கேட்கப்பட்டது என்பதையும் சூழல் உணர்த்துகிறது.
- source_word: Σὺ εἶ
  choice: நீர்தானா
  rationale: நேரடிக் கேள்வியையும் வலியுறுத்தப்பட்ட Σὺ என்பதையும் ‘தானா’ வெளிப்படுத்துகிறது. ‘நீர்’ மரியாதையான ஒருமை வடிவம்.
- source_word: ὁ ἐρχόμενος
  choice: வரவிருக்கிறவர்
  rationale: கட்டுரையுடன் பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புவினையின் எதிர்பார்க்கப்படும் வருகை என்ற பொருளையும், சூழலில் உள்ள அடையாளப் பட்டத்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: மாற்றுக் கேள்வியை அறிமுகப்படுத்தும் பிரிநிலை இணைப்புச் சொல்.
- source_word: ἄλλον
  choice: வேறொருவரை
  rationale: ‘மற்றொருவர்/வேறு ஒருவர்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: προσδοκῶμεν
  choice: நாங்கள் எதிர்பார்க்க வேண்டுமா
  rationale: முதலாம் நபர் பன்மையையும், தொடர்ந்து எதிர்நோக்கும் நிலையையும், இந்த ஆலோசனைத் தன்மையுள்ள கேள்வியையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: இயேசுவுக்கான κύριος என்னும் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: லூக்காவின் சொல்லாட்சியில் இது மரியாதைப் பட்டமாக மட்டுமல்லாமல் கிறிஸ்துவியல் கனமும் உடையது; ‘எஜமான்’ அந்த கனத்தை இங்கு குறைத்துவிடக்கூடும்.
- issue: ὁ ἐρχόμενος என்பதை பட்டமாகவா பொதுவான விளக்கமாகவா தருவது
  choice: வரவிருக்கிறவர்
  alternative: வருகிறவர்
  rationale: இச்சூழலில் எதிர்பார்க்கப்பட்ட ஒருவரைக் குறிக்கும் பட்டத்தன்மை உள்ளது. அதேவேளையில், கிரேக்கத்தில் நேரடியாக இல்லாத ‘மேசியா’ என்ற சொல்லைச் சேர்க்காமல் அதன் இயல்பான அர்த்தத் திறப்பை இந்த வடிவம் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைக் கொண்டுள்ளது. நேரடி உரையில் ‘நீர்’ பயன்படுத்தப்பட்டு, தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
