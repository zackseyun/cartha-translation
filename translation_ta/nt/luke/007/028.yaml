  source_fidelity: 'முதல் கூற்று கிரேக்கத்தின் பொருளைத் துல்லியமாகத் தருகிறது: யோவானைவிடப் பெரியவர் எவரும் இல்லை. பிந்தைய கூற்றிலும் யோவானுடனான ஒப்பீடும், கடவுளுடைய அரசில் இருப்பவரைக் குறிக்கும் இடநிலைத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன. ஆனால் ὁ μικρότερος என்பது வடிவில் ஒப்பீட்டுச் சொல்; இச்சூழலில் ‘மிகச் சிறியவர்/குறைந்தவர்’ எனப் பொருள்படுவது இயல்பானது. நடப்பு அடிக்குறிப்பு இதைத் தேவையற்ற இலக்கணத் தெளிவின்மையாகக் காட்டுகிறது.'
