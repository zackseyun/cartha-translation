  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: ta
  text: '“நான் உங்களுக்குச் சொல்கிறேன்[a]: பெண்களுக்குப் பிறந்தவர்களுள்[b] யோவானைவிடப் பெரியவர் எவரும் இல்லை. ஆனாலும், கடவுளுடைய அரசில் மிகச் சிறியவர்கூட[c] அவரைவிடப் பெரியவர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “நான் உங்களிடம் சொல்கிறேன்.”
    reason: lexical_alternative
  - marker: b
    text: “பெண்களுக்குப் பிறந்தவர்கள்” என்பது பொதுவாக மனிதர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “கடவுளுடைய அரசில் மிகக் குறைந்தவர்.” கிரேக்கத்தில் உள்ள ஒப்பீட்டு வடிவம் இச்சூழலில் குறைந்த நிலையில் இருப்பவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியாகக் கேட்போரிடம் உரையாற்றும் நிகழ்காலச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: μείζων
  choice: பெரியவர்
  rationale: ஒப்பீட்டின் அடிப்படை எது என்பதை விளக்கிச் சேர்க்காமல், ‘மேலானவர்/முக்கியமானவர்’ என்ற பொருள் வரக்கூடிய கிரேக்க ஒப்பீட்டுச் சொல்லின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: பெண்களுக்குப் பிறந்தவர்களுள்
  rationale: மனிதர்களைப் பொதுவாகக் குறிக்கும் மூலமொழி மரபுத்தொடரின் வடிவத்தையும் பொருளையும் வாசிக்கத்தக்க தமிழில் பாதுகாக்கிறது.
- source_word: Ἰωάννου
  choice: யோவான்
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: οὐδείς ἐστιν
  choice: எவரும் இல்லை
  rationale: கிரேக்க மறுப்புக் கூற்றை இயல்பாகவும் உறுதியாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ δὲ μικρότερος
  choice: ஆனாலும், ... மிகச் சிறியவராக இருப்பவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்க ஒப்பீட்டு வடிவத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது; δέ-யின் எதிர்மறைத் திருப்பத்தை ‘ஆனாலும்’ வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: கடவுளுடைய அரசில்
  rationale: βασιλεία என்பதன் அரசாட்சி/அரசு சார்ந்த கருத்தையும் ἐν என்பதன் இடநிலைத் தொடர்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: அவரைவிடப் பெரியவர்
  rationale: αὐτοῦ யோவானைக் குறிப்பதைத் தமிழின் மரியாதை ஒருமையில் தெளிவாகக் காட்டி, ஒப்பீட்டை விளக்கிச் சேர்க்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: யோவானுக்கும் கடவுளுடைய அரசில் மிகச் சிறியவராக இருப்பவருக்கும் இடையிலான ஒப்பீட்டின் அடிப்படை
  choice: ‘பெரியவர்’ என்ற சொல்லை மட்டும் பயன்படுத்தி, அந்தப் பெருமை நிலை, சிறப்புரிமை, ஒழுக்கம், ஆன்மிகத் தரம் அல்லது மீட்பு வரலாற்றிலான இடம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: கடவுளுடைய அரசைச் சேர்ந்த மிகச் சிறியவருக்குக்கூட யோவானைவிட அதிக உடன்படிக்கைச் சிறப்புரிமை அல்லது உயர்ந்த ஆன்மிக நிலை உண்டு என்று வெளிப்படையாக விளக்குதல்.
  rationale: மூலவாக்கியம் ஒப்பீட்டைத் தெளிவாகச் சொல்கிறது; ஆனால் ஒப்பீட்டின் அடிப்படையை வரையறுக்கவில்லை. எனவே அதன் இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. பழமையான ‘ஸ்திரீ’, ‘ராஜ்யம்’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டன; அதேவேளை மூலத்தின் சுருக்கமும் முரண்பாடுபோல் ஒலிக்கும் ஒப்பீடும் பாதுகாக்கப்பட்டன.
