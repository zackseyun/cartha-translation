source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: ta
  text: அவர்களால் திருப்பிச் செலுத்த முடியாததால், அவர் இருவரின் கடன்களையும் மனமுவந்து தள்ளுபடி செய்தார்.[a] ஆகவே, அவர்களில் யார் அவரை அதிகமாக நேசிப்பார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இருவரையும் மனமுவந்து மன்னித்தார்.” கிரேக்க வினைச்சொல், செலுத்த வேண்டிய கடனை இலவசமாகத் தள்ளுபடி செய்வதையோ மன்னிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: அவர்கள் திருப்பிச் செலுத்த வழியில்லாததால்
  rationale: இந்தப் பிறவேற்றுமைத் தனிநிலைத் தொடரானது, இருவராலும் கடனைத் திருப்பிச் செலுத்த இயலாத சூழ்நிலையைத் தெரிவிக்கிறது. ‘வழியில்லாததால்’ என்பது காரணத் தொடர்பையும் பொருளாதார இயலாமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: அவர் இருவருடைய கடனையும் மனமுவந்து தள்ளுபடி செய்தார்
  rationale: கடன் பற்றிய சூழலில் χαρίζομαι என்பது செலுத்த வேண்டியதை இலவசமாக விட்டுக்கொடுப்பதையோ தள்ளுபடி செய்வதையோ குறிக்கிறது. ‘மனமுவந்து’ என்பது அருளுடன் இலவசமாக வழங்கும் நுண்பொருளைத் தருகிறது; ‘கடனைத் தள்ளுபடி செய்தார்’ என்பது தமிழில் நிதிசார் உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: τίς οὖν αὐτῶν
  choice: ஆகவே, அவர்களில் யார்
  rationale: οὖν முன் கூறிய சூழ்நிலையிலிருந்து வரும் முடிவுறுத்தும் கேள்வியைச் சுட்டுகிறது. ‘ஆகவே’ அந்தத் தர்க்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: அவரிடம் அதிகமாக அன்புகாட்டுவார்
  rationale: πλεῖον ஒப்பீட்டு அளவைக் குறிக்கிறது; ἀγαπάω அன்பைச் சுட்டுகிறது. தமிழில் ஒருவரை நோக்கிய அன்பை ‘அவரிடம் அன்புகாட்டுவார்’ என்று சொல்வது இயல்பாகவும் எதிர்கால வினைநிலையைப் பாதுகாப்பதாகவும் உள்ளது.
theological_decisions:
- issue: கடன் உவமையில் χαρίζομαι என்பதன் மொழிபெயர்ப்பு
  choice: இருவருடைய கடனையும் மனமுவந்து தள்ளுபடி செய்தார்
  alternative: இருவரையும் மனமுவந்து மன்னித்தார்
  rationale: உடனடிச் சூழல் பணக்கடனைப் பற்றியது என்பதால் ‘கடனைத் தள்ளுபடி செய்தார்’ என்பது உவமையின் நிதிசார் படிமத்தைத் தெளிவாகப் பாதுகாக்கிறது. அதே நேரத்தில் ‘மனமுவந்து’ என்பது வினைச்சொல்லிலுள்ள இலவச அருள் அல்லது தயவின் நுண்பொருளைக் காட்டுகிறது. மாற்று மொழிபெயர்ப்பான ‘மன்னித்தார்’ பரந்த ஆன்மிகப் பயன்பாட்டை முன்வைக்கலாம்; அதை முதன்மை உரையில் திணிக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடன் உவமையின் உருவகம் முதன்மை உரையில் காக்கப்பட்டு, ‘மன்னித்தார்’ என்ற பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
