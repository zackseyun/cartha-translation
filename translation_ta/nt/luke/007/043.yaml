source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: ta
  text: சீமோன், “அதிகமான கடனை யாருக்கு மன்னித்தாரோ[b], அவர்தான் என்று நினைக்கிறேன்[a]” என்று பதிலளித்தான். அவர் அவனிடம், “நீ சரியாக மதிப்பிட்டாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “என்று ஊகிக்கிறேன்”; கிரேக்கச் சொல் தயக்கத்துடன் செய்யப்படும் ஒரு முடிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அதிகமான கடனைத் தள்ளுபடி செய்தாரோ”; கிரேக்க வினை அருளோடு ஒரு கடனை நீக்குதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: பதிலளித்தான்
  rationale: கிரேக்கத்தில் வினையெச்சமும் முற்றுவினையும் இணைந்து பதிலை அறிமுகப்படுத்தும் வழக்குச் சொற்றொடராக உள்ளன; தமிழில் இயல்பாக ஒரே வினையால் தரப்பட்டது.
- source_word: Ὑπολαμβάνω
  choice: என்று நினைக்கிறேன்
  rationale: உறுதியான கூற்றாக அல்லாமல், சற்றுத் தயக்கத்துடன் செய்யப்படும் ஊகத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ᾧ τὸ πλεῖον
  choice: அவர் யாருக்கு அதிகமான கடனை … அவர்தான்
  rationale: உறவுப்பெயரின் மறைமுகச் செயப்படுபொருள் அமைப்பைத் தமிழில் இயல்பாகக் காக்கிறது; உடனடியான உவமையின் கடன் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: ἐχαρίσατο
  choice: கடனை மன்னித்தாரோ
  rationale: χαρίζομαι இங்கு கடனை அருளோடு நீக்குதல் அல்லது மன்னித்தல் என்ற பொருளைக் கொண்டது. ‘மன்னித்தார்’ என்பது கடன் உவமையையும் சுற்றியுள்ள பாவமன்னிப்பு கருத்தையும் இணைக்கிறது.
- source_word: Ὀρθῶς
  choice: சரியாக
  rationale: Simon அளித்த மதிப்பீடு சரியானது என்ற உறுதிப்பாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: ἔκρινας
  choice: தீர்ப்பளித்தாய்
  rationale: κρίνω என்பதன் மதிப்பிட்டு முடிவுகூறும் பொருளையும், இயேசு Simon இன் பதிலை அங்கீகரிப்பதையும் காக்கிறது.
theological_decisions:
- issue: உவமையில் ἐχαρίσατο குறிக்கும் மன்னிப்பின் தன்மை
  choice: கடனை மன்னித்தார்
  alternative: கடனைத் தள்ளுபடி செய்தார்
  rationale: உடனடியான சூழலில் இது கடன் நீக்கத்தைக் குறிக்கிறது; அதேவேளையில் பகுதியின் விரிந்த பாவமன்னிப்பு கருப்பொருளுடனான சொற்பொருள் தொடர்பையும் ‘மன்னித்தார்’ காக்கிறது. இதற்கு அப்பாற்பட்ட கோட்பாட்டுத் தீர்வை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டது. Simon இன் தயக்கமான தொனியும், கடன் மன்னிப்பு மற்றும் பாவமன்னிப்பு இடையிலான இயல்பான தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
