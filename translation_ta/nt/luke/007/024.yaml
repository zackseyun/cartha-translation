language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: ta
  text: 'யோவானின் தூதர்கள் புறப்பட்டுச் சென்றபின், அவர் யோவானைப் பற்றி மக்கள் கூட்டங்களிடம் பேசத் தொடங்கினார்: “எதைப் பார்க்க[a] நீங்கள் வனாந்தரத்துக்குப் போனீர்கள்? காற்றால் அசைக்கப்படும் ஒரு நாணலையா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “காண” அல்லது “கூர்ந்து பார்க்க.”
    reason: θεάσασθαι என்ற வினை சாதாரணமாகப் பார்ப்பதையும், கவனித்துக் காண்பதையும் குறிக்கக்கூடும் என்பதால் சொல்லியல் மாற்றுகளைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: புறப்பட்டுச் சென்றபின்
  rationale: முற்றுப்பெற்ற செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புச் சொல்லுடன் அமைந்த genitive absolute, இயேசு பேசத் தொடங்குவதற்கு முன் தூதர்கள் சென்றுவிட்ட காலவரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγγέλων
  choice: தூதர்கள்
  rationale: இச்சூழலில் யோவான் அனுப்பிய மனிதத் தகவல் கொண்டுசெல்வோர்களையே குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: Ἰωάννου
  choice: யோவானின் / யோவான்
  rationale: முதலில் உடைமையுறவை (‘யோவானின் தூதர்கள்’), பின்னர் περί என்பதுடன் உரையின் பொருளை (‘யோவானைப் பற்றி’) இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἤρξατο λέγειν
  choice: பேசத் தொடங்கினார்
  rationale: ஒரு உரை தொடங்குவதைச் சுட்டும் inceptive அமைப்பை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: πρὸς τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களிடம்
  rationale: ὄχλους என்பதன் பன்மையையும், பேசுதல் வினையுடன் πρός குறிக்கும் நோக்குநிலையையும் காக்கிறது.
- source_word: περὶ Ἰωάννου
  choice: யோவானைப் பற்றி
  rationale: இவ்வுரையாடல் சூழலில் περί + genitive என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: Τί ἐξήλθατε
  choice: எதைப் பார்க்க ... போனீர்கள்?
  rationale: τί இங்கு முதன்மையாகச் செல்வதற்கான காரணத்தைக் கேட்காமல், அவர்கள் காணச் சென்ற பொருள் என்னவென்று கேட்கிறது.
- source_word: εἰς τὴν ἔρημον
  choice: வனாந்தரத்துக்கு
  rationale: யோவானின் பணியுடன் தொடர்புடைய மக்கள் குடியிருப்பு குறைந்த வெளிப்பகுதியைக் குறிக்கிறது; ‘பாலைவனம்’ என்று மிகக் குறிப்பாக வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: θεάσασθαι
  choice: பார்க்க
  rationale: கவனித்துப் பார்ப்பது அல்லது காண்பது என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: κάλαμον
  choice: ஒரு நாணலை
  rationale: காற்றில் எளிதாக அசையும் நாணல் செடியின் நேரடி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: காற்றால் அசைக்கப்படும்
  rationale: காற்றின் செயலால் நாணல் அசைக்கப்படுவதைத் தெளிவாகவும் உருவகத்தை விளக்கிப் பரப்பாமல் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: யோவானைப் பற்றிய நாணல் உருவகத்தின் பொருள்
  choice: ‘காற்றால் அசைக்கப்படும் ஒரு நாணலையா?’ என்ற நேரடி உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘மனஉறுதியற்ற அல்லது நிலைமாறும் ஒருவரையா?’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: மூலவசனம் உருவகத்தை முன்வைத்து அதன் உட்பொருளை வாசகர் உணரும்படி விடுகிறது. யோவானின் உறுதியைப் பற்றிய மறைமுகமான வலியுறுத்தலை மொழிபெயர்ப்பிலேயே வெளிப்படையாகத் தீர்மானிக்காமல், அதன் சொல்லாட்சித் திணறலையும் வினாவாற்றலையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வனாந்தரம்’ நற்செய்தி நூல்களின் புவியியல் சூழலைக் காக்கிறது; ‘நாணல்’ உருவகம் விளக்கிப் பரப்பப்படாமல் அப்படியே வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது சார்ந்த ‘பார்க்க’ என்பதன் பின்னர் இடப்பட்டுள்ளது.
