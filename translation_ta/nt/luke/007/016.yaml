- from: அப்போது அவர்கள் அனைவரையும் அச்சம் ஆட்கொண்டது. அவர்கள் கடவுளை மகிமைப்படுத்திக்கொண்டே, “நம்மிடையே ஒரு பெரிய இறைவாக்கினர் எழுந்திருக்கிறார்[a]; கடவுள் தம் மக்களைச் சந்தித்திருக்கிறார்[b]” என்று சொன்னார்கள்.[c]
  to: அவர்கள் அனைவரையும் அச்சம் ஆட்கொண்டது. அவர்கள் கடவுளை மகிமைப்படுத்தி, “நம்மிடையே ஒரு பெரிய இறைவாக்கினர் எழுந்திருக்கிறார் என்றும், கடவுள் தம் மக்களைச் சந்தித்திருக்கிறார் என்றும்” சொன்னார்கள்.[a][b][c]
  rationale: The revision removes the temporal strengthening introduced by “அப்போது” and uses a more idiomatic Tamil finite-verb construction for the crowd’s glorification and speech. It retains the source’s fear response, ongoing public glorification, the two coordinated declarations, the noncommittal main-text force of “எழுந்திருக்கிறார்,” and the biblical ambiguity of divine visitation. All supplied footnote anchors and notes are retained and correctly anchored.
