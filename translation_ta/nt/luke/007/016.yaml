  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: ta
  text: அவர்கள் அனைவரையும் அச்சம் ஆட்கொண்டது. அவர்கள் கடவுளை மகிமைப்படுத்தி, “நம்மிடையே ஒரு பெரிய இறைவாக்கினர் எழுந்திருக்கிறார் என்றும், கடவுள் தம் மக்களைச் சந்தித்திருக்கிறார் என்றும்” சொன்னார்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மிடையே ஒரு பெரிய இறைவாக்கினர் எழுப்பப்பட்டிருக்கிறார்.” கடவுள் ஓர் இறைவாக்கினரை எழுப்பியிருப்பதை இந்த வாசகம் வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சந்தித்திருக்கிறார்” என்பது, கடவுள் தம் மக்கள்மேல் அக்கறை கொண்டு அவர்களிடம் வந்து செயல்படுவதைக் குறிக்கும் வேதாகமச் சொல்லாட்சி.
    reason: cultural_note
  - marker: c
    text: 'இரண்டு தனித்த கூற்றுகளாகவும் நிறுத்தலாம்: “நம்மிடையே ஒரு பெரிய இறைவாக்கினர் எழுந்திருக்கிறார்” என்றும், “கடவுள் தம் மக்களைச் சந்தித்திருக்கிறார்” என்றும் சொன்னார்கள்.'
    reason: punctuation_alternative
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: அவர்கள் அனைவரையும் அச்சம் ஆட்கொண்டது
  rationale: கிரேக்க மொழியின் திடீரெனப் பற்றிக்கொள்ளும் வலிமையை இயல்பான தமிழில் தருகிறது. ‘வியப்பு’ என்று மட்டும் மொழிபெயர்க்காமல், φόβος என்பதிலுள்ள அச்சம்–பயபக்தி பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: கதைத் தொடரில் மெல்லிய இணைப்பையும் நிகழ்வுக்குப் பிந்தைய உடனடி எதிர்வினையையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: கடவுளை மகிமைப்படுத்திக்கொண்டே
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்ச்சியான செயற்பாட்டைத் தமிழில் வெளிப்படுத்துகிறது; δοξάζω என்பதன் ‘மகிமைப்படுத்து’ என்ற நேரடி தொடர்பையும் காக்கிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: மகிமைப்படுத்தியதன் உரை உள்ளடக்கத்தைத் தெளிவாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: Προφήτης μέγας
  choice: ஒரு பெரிய இறைவாக்கினர்
  rationale: μέγας என்பதன் மதிப்பீட்டு வலிமையை ‘பெரிய’ என்பதும், προφήτης என்பதன் கடவுளுடைய செய்தியை அறிவிப்பவர் என்ற பரந்த பொருளை ‘இறைவாக்கினர்’ என்பதும் தருகின்றன.
- source_word: ἠγέρθη
  choice: எழுந்திருக்கிறார்
  rationale: ஒரு இறைவாக்கினர் மக்களிடையே தோன்றியிருப்பதையும், கடவுளால் எழுப்பப்பட்டிருக்கலாம் என்ற மறைமுகச் செயலாண்மையையும் முற்றிலும் தீர்மானிக்காமல் வைக்கிறது.
- source_word: ἐν ἡμῖν
  choice: நம்மிடையே
  rationale: சமூகத்தின் மத்தியில் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: Ἐπεσκέψατο
  choice: சந்தித்திருக்கிறார்
  rationale: கடவுள் தம் மக்களிடம் கவனத்துடனும் செயல்படும் அக்கறையுடனும் வந்தார் என்ற வேதாகம வருகைச் சொல்லாட்சியை, ‘உதவினார்’ அல்லது ‘மீட்டார்’ என்று மிகையாக வரையறுக்காமல் பாதுகாக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: τὸν λαὸν αὐτοῦ
  choice: தம் மக்களை
  rationale: αὐτοῦ என்பதன் உடைமைத் தொடர்பையும் உடன்படிக்கை சார்ந்த ‘அவருடைய மக்கள்’ என்ற ஒலியையும் இயல்பான தமிழ் தற்சுட்டுப் பெயரால் தருகிறது.
theological_decisions:
- issue: அற்புதத்துக்குப் பிந்தைய φόβος என்பதன் பொருள்
  choice: அச்சம்
  alternative: பயபக்தி; வியப்பு
  rationale: மூலச்சொல்லின் வலிமையையும் அச்சம் மற்றும் பயபக்தி இடையேயுள்ள பொருள் பதற்றத்தையும் காக்கிறது; ‘வியப்பு’ என்று மொழிபெயர்த்து எதிர்வினையை மென்மையாக்கவில்லை.
- issue: இறைவாக்கினரைப் பற்றிய ἠγέρθη என்பதன் செயப்பாட்டு நுணுக்கம்
  choice: எழுந்திருக்கிறார்
  alternative: எழுப்பப்பட்டிருக்கிறார்
  rationale: முதன்மை உரை இயல்பான தமிழில் ‘தோன்றியிருக்கிறார்’ என்ற பொருளைத் தருகிறது; அதேவேளை கடவுளே எழுப்பினார் என்று உணர்த்தக்கூடிய கிரேக்கச் செயப்பாட்டு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கடவுளின் Ἐπεσκέψατο என்ற செயல்
  choice: தம் மக்களைச் சந்தித்திருக்கிறார்
  alternative: தம் மக்களுக்கு உதவ வந்திருக்கிறார்; தம் மக்களைக் கவனித்திருக்கிறார்
  rationale: லூக்காவில் உள்ள மீட்பு வரலாற்றுச் ‘சந்திப்பு/வருகை’ சொல்லாட்சியைப் பாதுகாத்து, அந்தச் செயலை உதவி அல்லது மீட்பு என்ற ஒரே விளக்கத்துக்குள் சுருக்காமல் விடுகிறது.
- issue: இரண்டு ὅτι உட்பிரிவுகளின் மேற்கோள் அமைப்பு
  choice: ஒரே தொடர்ச்சியான மேற்கோளுக்குள் இரண்டு கூற்றுகள்
  alternative: இரண்டு தனித்த மேற்கோள்கள்
  rationale: λέγοντες என்பதற்குப் பின் வரும் இரண்டு இணையான கூற்றுகளையும் ஒரே மக்கள் அறிவிப்பாக இயல்பாக வாசிக்கச் செய்கிறது; கிரேக்கத்தின் மீண்டும் வரும் ὅτι காரணமாகத் தனித்த கூற்றுகளாக நிறுத்தக்கூடிய வாய்ப்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அச்சம்’ மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது; ‘இறைவாக்கினர்’ என்பது எதிர்காலத்தை மட்டும் முன்னறிவிப்பவர் என்ற குறுகிய புரிதலைத் தவிர்க்கிறது. மேற்கோளில் அரைப்புள்ளி பயன்படுத்தப்பட்டதால் இரண்டு இணையான அறிவிப்புகளும் தெளிவாகின்றன.
