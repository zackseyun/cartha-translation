  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: ta
  text: அனுப்பப்பட்டவர்கள் வீட்டிற்குத் திரும்பி வந்தபோது, அந்த அடிமை[a] நலமாக இருப்பதைக் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேலைக்காரன்.” கிரேக்கச் சொல் “δοῦλος”; சூழலுக்கு ஏற்ப அது “அடிமை” அல்லது “வேலைக்காரன்” என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: திரும்பிவந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காலத் தொடர்புடன் காட்டுகிறது; தமிழில் இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν οἶκον
  choice: வீட்டிற்கு
  rationale: εἰς உடன் வரும் வேற்றுமை இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தேவையின்றி ‘வீட்டிற்குள்’ என்று துல்லியப்படுத்தாமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οἱ πεμφθέντες
  choice: அனுப்பப்பட்டவர்கள்
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தையும் அந்தக் குழுவின் அடையாளத்தையும் காக்கிறது; ‘தூதர்கள்’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: εὗρον
  choice: கண்டார்கள்
  rationale: கதைநடையில் εὑρίσκω என்பதற்கான நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: τὸν δοῦλον
  choice: அந்த அடிமை
  rationale: δοῦλος இச்சூழலில் வெறும் கூலிப் பணியாளரை அல்ல, நூற்றுக்குத் தலைவனின் அதிகாரத்தின்கீழ் அடிமை நிலையில் இருந்தவரைக் குறிக்கிறது. குறிப்புச் சுட்டின் பொருளை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: ὑγιαίνοντα
  choice: நலமாக இருப்பதை
  rationale: ὑγιαίνω உடல்நலத்துடன் அல்லது நலமாக இருப்பதைக் குறிக்கிறது; சூழல் குணமடைதலை உணர்த்தினாலும், மூலத்தில் இல்லாத ‘குணமடைந்திருந்தான்’ என்ற விளக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: குணமாக்கப்பட்ட நிகழ்வில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன்
  rationale: சமூக மற்றும் அதிகார நிலையை மூலச்சொல் தெளிவாகக் குறிக்கிறது; அதை மென்மைப்படுத்தாமல் ‘அடிமை’ என்று வழங்கப்பட்டுள்ளது. பாரம்பரியமாகப் பயன்படுத்தப்படும் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நலமாக இருப்பதை’ என்பது மூலத்தின் நிலைமைக் குறிப்பைக் காத்து, ‘குணமடைந்தான்’ என்ற விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
