  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: ta
  text: அவர் தமது வார்த்தைகள் அனைத்தையும் மக்கள் கேட்கும்படி சொல்லி முடித்தபின்பு, கப்பர்நகூமுக்குள் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: முடித்தபின்பு
  rationale: இங்கு காரணத்தை அல்ல, முதன்மை நிகழ்வுக்கு முந்திய காலத் தொடர்பைச் சுட்டுகிறது.
- source_word: ἐπλήρωσεν
  choice: சொல்லி முடித்த
  rationale: ῥήματα என்பதுடன் வரும் இச்சூழலில், ‘நிறைவேற்றினார்’ என்பதல்லாமல் பேசி முடித்ததைக் குறிக்கிறது.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: தமது வார்த்தைகள் அனைத்தையும்
  rationale: கிரேக்க உரையின் ‘அவருடைய வார்த்தைகள் அனைத்தும்’ என்ற அமைப்பை நெருக்கமாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: மக்கள் கேட்கும்படி
  rationale: சொற்சொல்லான ‘மக்களின் காதுகளுக்குள்’ என்பதற்குப் பதிலாக, அவர்கள் கேட்கும் வகையில் உரை நிகழ்த்தப்பட்டது என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: λαοῦ
  choice: மக்கள்
  rationale: கூட்டம் என்று மிகக் குறிப்பாக்காமல், λαός என்பதன் பொதுவான கூட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: εἰσῆλθεν
  choice: உள்ளே சென்றார்
  rationale: நகருக்குள் நுழைந்த செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான மூன்றாம் நபர் ஒருமை நடையும் இயல்பான வாக்கிய ஓட்டமும் பயன்படுத்தப்பட்டுள்ளன. கிரேக்க மரபுத்தொடர் பொருள் சார்ந்து மொழிபெயர்க்கப்பட்டாலும், ‘தமது வார்த்தைகள் அனைத்தையும்’ என்பது மூலத்தின் வடிவ நெருக்கத்தைப் பாதுகாக்கிறது.
