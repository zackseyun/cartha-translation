id: LUK.7.30
reference: Luke 7:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: ta
  text: ஆனால் பரிசேயர்களும் திருச்சட்ட அறிஞர்களும், அவரால்[a] திருமுழுக்கு பெறாமல், தங்களுக்கான கடவுளின் நோக்கத்தை[b] நிராகரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, திருமுழுக்கு கொடுத்த யோவானால்.
    reason: cross_reference
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘தங்களுக்கு எதிரான கடவுளின் ஆலோசனையை’ அல்லது ‘தங்களைப் பற்றிய கடவுளின் திட்டத்தை.’'
    reason: alternative_reading
lexical_decisions:
- source_word: νομικοὶ
  choice: திருச்சட்ட அறிஞர்கள்
  rationale: இச்சொல் மோசேயின் திருச்சட்டத்தில் தேர்ச்சி பெற்றவர்களைக் குறிக்கிறது. ‘வழக்கறிஞர்கள்’ என்பது இன்றைய நீதிமன்றத் தொழிலைத் தவறாக நினைவூட்டலாம்; ‘திருச்சட்ட அறிஞர்கள்’ சூழலுக்கேற்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: βουλὴν
  choice: நோக்கத்தை
  rationale: βουλή என்பதற்கு நோக்கம், திட்டம், ஆலோசனை ஆகிய பொருள்கள் இருக்கலாம். இங்கு ‘நோக்கம்’ என்பது கடவுள் அவர்களைக் குறித்து கொண்டிருந்த எண்ணத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘ஆலோசனை’ வெறும் அறிவுரை என்ற தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்.
- source_word: ἠθέτησαν
  choice: நிராகரித்தார்கள்
  rationale: ἀθετέω என்பது நிராகரித்தல், ஒதுக்கித்தள்ளுதல் என்ற பொருளுடையது. இங்கு கடவுளின் நோக்கத்தை அவர்கள் ஏற்றுக்கொள்ளாததை ‘நிராகரித்தார்கள்’ நேரடியாகத் தெரிவிக்கிறது.
- source_word: εἰς ἑαυτούς
  choice: தங்களுக்கான
  rationale: இந்தச் சொற்றொடர் கடவுளின் நோக்கம் அவர்களைத் தனிப்பட்ட முறையில் சார்ந்தது என்பதைக் காட்டுகிறது. ‘தங்களுக்கு எதிரான’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: அவரால் திருமுழுக்கு பெறாமல்
  rationale: எதிர்மறையான இறந்தகாலச் செயவினைப் பெயரெச்சத்தை இயல்பான தமிழில் சூழ்நிலைத் தொடராக மொழிபெயர்க்கிறது. காரணம், வழிமுறை அல்லது உடன்நிகழ்வு ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் கிரேக்கத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: αὐτοῦ
  choice: அவரால்
  rationale: முந்தைய சூழலில் இச்சுட்டுப்பெயர் யோவானைக் குறிக்கிறது. மூலத்தின் சுட்டுப்பெயரை முதன்மை உரையில் தக்கவைத்து, அதன் குறிப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் யோவானின் திருமுழுக்கைப் பெற்றவர்கள் கடவுள் நீதியுள்ளவர் என ஏற்றுக்கொண்டதற்கு மாறான நிலையை δέ சுட்டுகிறது; ‘ஆனால்’ அந்த முரண்பாட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பரிசேயர்களும் திருச்சட்ட அறிஞர்களும் தொடர்பாக கடவுளின் βουλή என்பதன் பொருள்
  choice: தங்களுக்கான கடவுளின் நோக்கம்
  alternative: தங்களுக்கு எதிரான கடவுளின் ஆலோசனை; தங்களைப் பற்றிய கடவுளின் திட்டம்
  rationale: அவர்கள் தங்களைச் சார்ந்த கடவுளின் நோக்கத்தை நிராகரித்தார்கள் என்பதை இவ்வாசிப்பு கூறுகிறது. கடவுளின் முழுமையான சித்தம் தோற்கடிக்கப்பட்டது என்ற வலுவான கோட்பாட்டுக் கூற்றை இது திணிப்பதில்லை; அதேவேளை εἰς ἑαυτούς என்பதிலுள்ள உண்மையான பொருள் நெகிழ்வை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘திருச்சட்ட அறிஞர்கள்’ என்பது இன்றைய தொழில்முறை வழக்கறிஞர்களோடு குழப்பமடைவதைத் தவிர்க்கிறது. ‘திருமுழுக்கு’ என்பது வாசகருக்குப் புரியக்கூடிய, குறிப்பிட்ட திருச்சபை மரபைத் திணிக்காத சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
