  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: இரண்டு கடனாளிகள், ஒரு குறிப்பில்லாத கடன் கொடுப்பவர், 500 மற்றும் 50 தினாரிகள். இருப்பினும், முதல் தொடரில் ‘கடன்பட்டவர்கள் இருவர் இருந்தார்கள்’ என்பதற்குப் பின் ஒவ்வொருவரும் ‘கடன்பட்டிருந்தான்’ என வருவது ஓரளவு கனமாகவும் மீளுரைப்பாகவும் உள்ளது. ‘δανιστῇ τινι’யின் உறவை ‘ஒரு கடன் கொடுப்பவரிடம்’ என்பதற்குப் பதிலாக ‘ஒரு கடன் கொடுப்பவருக்கு’ எனத் தருவது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.'
  naturalness: ‘ஒரு கடன் கொடுப்பவருக்கு இரு கடனாளிகள் இருந்தார்கள்’ என்பது நவீனத் தரத் தமிழில் சீரான கதைநடை. எண்ணிக்கைக்குப் பின் நாணயப் பெயரைப் பன்மையில் தருவது (‘தினாரிகள்’) தெளிவான, இயல்பான பயன்பாடாகும்.
