  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: ta
  text: 'ஒரு கடன் கொடுப்பவருக்கு இரு கடனாளிகள் இருந்தார்கள்: ஒருவன் ஐந்நூறு தினாரிகள் கடன்பட்டிருந்தான்; மற்றவன் ஐம்பது தினாரிகள் கடன்பட்டிருந்தான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρεοφειλέται
  choice: கடன்பட்டவர்கள்
  rationale: கடனைத் திருப்பிச் செலுத்த வேண்டியவர்களைக் குறிக்கும் சொல்லை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δανιστῇ τινι
  choice: கடன் கொடுப்பவர் ஒருவரிடம்
  rationale: δανιστής பணத்தைக் கடனாகக் கொடுப்பவரைக் குறிக்கிறது; ‘ஒருவரிடம்’ என்பது τινι-யின் குறிப்பில்லாத ஆனால் தனிப்பட்ட அறிமுகத்தை இயல்பான தமிழில் தருகிறது. ‘கந்துவட்டிக்காரர்’ என்பது மூலத்தில் இல்லாத எதிர்மறைப் பொருளைச் சேர்க்கக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: ὤφειλεν
  choice: கடன்பட்டிருந்தான்
  rationale: இறந்தகாலத்தில் நிலவிய கடன் உறவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: δηνάρια
  choice: தினாரி
  rationale: வரலாற்றுச் சிறப்புடைய குறிப்பிட்ட ரோம நாணய அலகை பொதுவான ‘பணம்’ அல்லது ‘வெள்ளிக்காசு’ என்று மாற்றாமல் ஒலிபெயர்த்து வைத்திருக்கிறது; அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: πεντακόσια
  choice: ஐந்நூறு
  rationale: எண்ணின் நேரடியான தமிழ் இணை.
- source_word: ἕτερος
  choice: மற்றவன்
  rationale: ὁ εἷς என்பதற்கு இணையான எதிர்மறை அமைப்பில் ‘ஒருவன் … மற்றவன்’ என்பது இயல்பான தமிழ் நடை.
- source_word: πεντήκοντα
  choice: ஐம்பது
  rationale: எண்ணின் நேரடியான தமிழ் இணை; தெளிவுக்காக ‘தினாரி’ இரண்டாவது கூறிலும் மீண்டும் வழங்கப்பட்டுள்ளது.
