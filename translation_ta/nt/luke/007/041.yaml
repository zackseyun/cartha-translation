translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடன் கொடுப்பவர்’ என்பது நடுநிலையான சொல்; மூலத்தில் இல்லாத வட்டியையோ சுரண்டலையோ குறிப்பதில்லை. இரு கடன்களின் வேறுபாட்டைத் தெளிவுபடுத்த அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
