id: LUK.7.12
reference: Luke 7:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: ta
  text: அவர் நகரத்தின் வாசலை நெருங்கியபோது, இதோ, இறந்துபோன ஒருவனைச் சுமந்து வெளியே கொண்டுபோய்க்கொண்டிருந்தார்கள். அவன் தன் தாயின் ஒரே மகன்[a]; அவளோ ஒரு விதவை. நகரத்தைச் சேர்ந்த திரளான மக்கள் கூட்டமும் அவளுடன் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்கிருந்த ஒரே மகன்.”
    reason: μονογενής என்பதன் ‘ஒரே’ அல்லது ‘ஒரே ஒருவன்’ என்ற வலியுறுத்தலை விரிவாக வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: அவர் ... நெருங்கியபோது
  rationale: ὡς என்பதன் காலத் தொடர்பையும் ἤγγισεν என்பதன் அணுகும் இயக்கத்தையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; δέ தனியாக மொழிபெயர்க்கப்படாமல் கதை ஓட்டத்தில் உட்கொள்ளப்பட்டுள்ளது.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: நகரத்தின் வாசலை
  rationale: நகருக்குள் நுழையும் வாயிலைக் குறிக்கும் πύλη என்பதற்கு ‘வாசல்’ தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: καὶ ἰδοὺ
  choice: இதோ
  rationale: திடீரெனக் காட்சிக்குக் கவனம் ஈர்க்கும் ἰδού என்பதன் உரையாடல் செயல்பாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐξεκομίζετο
  choice: சுமந்து வெளியே கொண்டுபோய்க்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் நடந்துகொண்டிருந்த செயலைக் காட்டும் இறந்தகாலத் தொடர்நிலையையும், இறுதி ஊர்வலத்தில் உடலை நகரத்திற்கு வெளியே சுமந்து செல்லும் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்கச் செயப்பாட்டு வடிவம் தமிழில் இயல்பான குறிப்பிடப்படாத பன்மை எழுவாயால் தரப்பட்டுள்ளது.
- source_word: τεθνηκώς
  choice: இறந்துபோன ஒருவன்
  rationale: இறந்துவிட்ட நிலையில் இருந்த நபரைச் சுட்டும் நிறைவுப் பெயரெச்சத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: μονογενὴς υἱός
  choice: ஒரே மகன்
  rationale: இந்தக் குடும்பச் சூழலில் μονογενής தாய்க்கு வேறு மகன் இல்லை என்பதைக் குறிக்கிறது; தேவையற்ற கிறிஸ்தவியல் சிறப்புப் பொருள் இதில் ஏற்றப்படவில்லை.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: தன் தாய்க்கு
  rationale: மகனுக்கும் தாய்க்கும் இடையிலான உறவைத் தமிழ் வழக்கில் இயல்பாகக் குறிக்கிறது.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: அவளோ ஒரு விதவை
  rationale: αὐτή அளிக்கும் தாய்மீதான அழுத்தத்தையும், அவளுடைய துயரமான நிலையையும் ‘அவளோ’ என்பதன் மூலம் பாதுகாக்கிறது.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: நகரத்தைச் சேர்ந்த திரளான மக்கள் கூட்டம்
  rationale: ἱκανός குறிக்கும் கணிசமான எண்ணிக்கையை மிகைப்படுத்தாமல் ‘திரளான’ எனவும், τῆς πόλεως குறிக்கும் நகரத் தொடர்பை ‘நகரத்தைச் சேர்ந்த’ எனவும் தருகிறது.
- source_word: ἦν σὺν αὐτῇ
  choice: அவளுடன் இருந்தது
  rationale: σύν என்பதன் உடனிருப்பு அல்லது துணைசெல்லுதல் பொருளை எளிமையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: கிறிஸ்துவைக் குறிக்காத சூழலில் μονογενής என்பதன் மொழிபெயர்ப்பு
  choice: ஒரே மகன்
  alternative: தனக்கிருந்த ஒரே மகன்
  rationale: இங்கு இச்சொல் விதவையின் குடும்ப உறவையே விவரிக்கிறது. ‘ஒரே மகன்’ என்பது அதன் நேரடியான சூழற்பொருளைத் தருகிறது; ‘தனக்கிருந்த ஒரே மகன்’ என்பது சாத்தியமான விரிவான மாற்று, ஆனால் மூலத்தில் இல்லாத வலியுறுத்தலை அதிகரிக்கலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கதைநடை. இறுதி ஊர்வலச் சூழலைத் தெளிவாக்கினாலும், மூலத்தில் சொல்லப்படாத சடங்கு விவரங்கள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் ‘ஒரே மகன்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
