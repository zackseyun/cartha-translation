base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: ta
  text: ஆனால், நீங்கள் எதைப் பார்க்க வெளியே சென்றீர்கள்? மென்மையான ஆடைகளை அணிந்த ஒரு மனிதனையா?[a] இதோ, செழுமையான ஆடைகளை அணிந்து ஆடம்பரமாக வாழ்கிறவர்கள் அரச மாளிகைகளில் இருக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மெல்லிய ஆடைகளை அணிந்த ஒரு மனிதனையா?” இச்சொற்றொடர் சொகுசுடன் தொடர்புடைய மென்மையான, நுண்ணிய ஆடைகளைக் குறிக்கிறது; ஒழுக்க பலவீனத்தைக் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசவைகளில்.” கிரேக்கச் சொல் அரச குடியிருப்புகளையோ அரசவைச் சூழல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வினாவைத் தொடர்ந்து மாறுபாட்டை அறிமுகப்படுத்தும் இயல்பான எதிர்மறை இணைப்புச் சொல்.
- source_word: ἐξήλθατε ἰδεῖν
  choice: பார்க்க வெளியே சென்றீர்கள்
  rationale: இறந்தகாலச் செயலும் நோக்கத்தைக் குறிக்கும் வினையெச்சமும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதனை
  rationale: இங்கு ஒரு குறிப்பிட்ட ஆண் நபரைச் சுட்டும் ஒருமைச் சொல்.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: மென்மையான ஆடைகளை அணிந்த
  rationale: மென்மையும் நேர்த்தியும் கொண்ட ஆடைகளைச் சுட்டுகிறது; ஒழுக்க அல்லது பாலின இழிவுப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து வரும் விளக்கத்தின் மீது கவனத்தைத் திருப்பும் இயல்பான தமிழ் இடைச்சொல்.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: பகட்டான ஆடைகளை அணிந்து
  rationale: ἔνδοξος இங்கு செழுமையும் கண்கவர் மேன்மையும் கொண்ட ஆடைகளைக் குறிக்கிறது; 'பகட்டான' என்பது சமூக ஆடம்பரத்தின் படிமத்தை இயல்பாகத் தருகிறது.
- source_word: τρυφῇ ὑπάρχοντες
  choice: ஆடம்பரமாக வாழ்கிறவர்கள்
  rationale: வெறும் உடைமை அல்லாமல் சொகுசான, இன்பமான வாழ்க்கை நிலையில் இருப்பதைத் தெளிவாகக் கூறுகிறது.
- source_word: ἐν τοῖς βασιλείοις
  choice: அரச மாளிகைகளில்
  rationale: அரசருக்குரிய குடியிருப்புகள் அல்லது அரண்மனைச் சூழல்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: μαλακοῖς என்பதன் சூழல்சார் பொருள்
  choice: மென்மையான அல்லது நேர்த்தியான ஆடைகள்
  alternative: ஆண்மையற்றவருக்குரிய ஆடைகள்
  rationale: வனாந்தரத் துறவான வாழ்வையும் அரசவைச் சொகுசையும் இயேசு வேறுபடுத்துகிறார். அடுத்துள்ள பகட்டான ஆடை, ஆடம்பரம், அரச மாளிகைகள் ஆகியவை சமூக-பொருளாதார மாறுபாட்டை உறுதிப்படுத்துகின்றன; ஒழுக்கத் தீர்ப்பை அல்ல.
- issue: βασιλείοις குறிக்கும் இடம்
  choice: அரச மாளிகைகள்
  alternative: அரசர்களின் அவைகள்
  rationale: கிரேக்கச் சொல் அரச குடியிருப்புகளையோ அரசவை அமைந்த இடங்களையோ குறிக்கலாம்; முதன்மைப் பொருளாக அரச மாளிகைகள் உரையில் வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. தொடர்ச்சியான இரு வினாக்களின் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது; நீதிமொழி போன்ற சுருக்கமும் அரசவைக் காட்சியின் மாறுபாடும் தெளிவாக்கப்பட்டுள்ளன.
