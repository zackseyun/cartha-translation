source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: ta
  text: ஆண்டவர் அவளைப் பார்த்தபோது, அவள்மீது மனமிரங்கி அவளிடம், “அழாதே[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழ வேண்டாம்” அல்லது “அழுவதை நிறுத்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் பொதுவாக அழ வேண்டாம் என்று தடை செய்வதாகவோ, அப்போது நடந்துகொண்டிருந்த அழுகையை நிறுத்துமாறு சொல்வதாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: பார்த்தபோது
  rationale: ὁράω என்பதன் இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் காலத் தொடர்பை இயல்பாக வெளிப்படுத்தும் வகையில் “பார்த்தபோது” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος இங்கு இயேசுவைக் குறிக்கும் உயர்ந்த கிறிஸ்துவியல் பட்டமாக லூக்காவின் உரையில் வருகிறது; “ஆண்டவர்” அதைப் பொருத்தமாகவும் மரியாதையுடனும் எடுத்துரைக்கிறது.
- source_word: ἐσπλαγχνίσθη
  choice: மனமிரங்கி
  rationale: σπλαγχνίζομαι ஆழமான உள்ளார்ந்த இரக்கத்தைக் குறிக்கிறது. “மனமிரங்கி” என்பது அந்த உணர்வின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐπ’ αὐτῇ
  choice: அவள்மீது
  rationale: ἐπί + வேற்றுமை வடிவம் இரக்கம் செலுத்தப்பட்ட நபரைச் சுட்டுகிறது; “அவள்மீது” மூலத்தின் உறவைக் காக்கிறது.
- source_word: εἶπεν αὐτῇ
  choice: அவளிடம் ... என்றார்
  rationale: λέγω என்பதன் அடிப்படைப் பொருளான “சொல்” என்பதையும் αὐτῇ குறிக்கும் முகவரியையும் இயல்பான தமிழ் சொற்றொடரில் தருகிறது.
- source_word: Μὴ κλαῖε
  choice: அழாதே
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை, பொதுவாக அழ வேண்டாம் என்ற தடையாகவோ அப்போது நடந்துகொண்டிருந்த அழுகையை நிறுத்துமாறு கூறுவதாகவோ புரிந்துகொள்ளப்படலாம். “அழாதே” இரு சாத்தியங்களையும் மிகையாகத் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: இயேசுவுக்கான κύριος பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமானர்
  rationale: இங்கு κύριος வெறும் சமூக உறவிலுள்ள எஜமானைக் குறிப்பதல்ல; லூக்காவின் கதைசொல்லலில் இயேசுவுக்கான உயர்ந்த பட்டமாக உள்ளது. “ஆண்டவர்” அந்த நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. “மனமிரங்கி” ஆழ்ந்த இரக்கத்தைச் சுருக்கமாக எடுத்துரைக்கிறது; “அழாதே” மூலத்தின் பொருள்சார் தெளிவின்மையைப் பாதுகாக்கிறது.
