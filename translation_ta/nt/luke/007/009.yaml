source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: ta
  text: 'இயேசு இவற்றைக் கேட்டபோது, அவரைக் குறித்து வியந்தார். பின்பு தம்மைப் பின்தொடர்ந்துகொண்டிருந்த மக்கள் கூட்டத்தை நோக்கித் திரும்பி, “நான் உங்களுக்குச் சொல்கிறேன்: இவ்வளவு பெரிய[a] நம்பிக்கையை[b] இஸ்ரவேலில்கூட நான் கண்டதில்லை” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இத்தகைய.”
    reason: τοσαύτην என்பது அளவை மட்டுமல்லாமல் தன்மையையும் சுட்டக்கூடும்.
  - marker: b
    text: அல்லது, “விசுவாசத்தை”; கிரேக்கச் சொல் நம்பிக்கை அல்லது விசுவாசம் என்ற பொருளில் வரக்கூடும்.
    reason: πίστις என்பதற்கான மரபான மாற்று மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: இயேசு இவற்றைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புச் சொல் முதன்மைச் செயலுக்கு முன் நிகழ்ந்த சூழலைக் குறிக்கிறது. δέ மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிப்பதால் தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை; ταῦτα என்பதன் பன்மை ‘இவற்றை’ என்று தக்கவைக்கப்பட்டது.
- source_word: ἐθαύμασεν αὐτόν
  choice: அவனைக் குறித்து வியந்தார்
  rationale: θαυμάζω உண்மையான வியப்பைக் குறிக்கிறது. நூற்றுக்குத் தலைவன் அங்கு நேரில் இருந்ததாகத் தோன்றாதபடி, αὐτόν என்பதை ‘அவனைக் குறித்து’ என்று இயல்பாக வழங்குகிறது.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: தம்மைப் பின்தொடர்ந்து வந்த மக்கள் கூட்டத்தை நோக்கித் திரும்பி
  rationale: στραφεὶς என்பதன் தொடர்ச்சிச் செயலும், ἀκολουθοῦντι என்பதன் நடந்துகொண்டிருந்த செயலும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுகின்றன.
- source_word: Λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையின் வலியுறுத்தலை நவீனத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: இஸ்ரவேலில்கூட
  rationale: οὐδέ தரும் ‘கூட இல்லை’ என்ற வலியுறுத்தலும், ἐν என்பதன் இட/மக்கள் சார்ந்த பொருளும் சுருக்கமாகப் பாதுகாக்கப்படுகின்றன.
- source_word: τοσαύτην πίστιν
  choice: இவ்வளவு பெரிய நம்பிக்கையை
  rationale: τοσαύτην நம்பிக்கையின் அளவு அல்லது சிறப்பை வலியுறுத்துகிறது. πίστις இச்சூழலில் இயேசுவின் அதிகாரத்தின் மீதான நம்பிக்கையைக் குறிக்கிறது; ‘நம்பிக்கை’ பொதுவாசகருக்கு இயல்பானது.
- source_word: εὗρον
  choice: நான் கண்டதில்லை
  rationale: கிரேக்க இறந்தகால வடிவம் இதுவரையிலான அனுபவத்தைச் சுட்டுகிறது; தமிழில் ‘கண்டதில்லை’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: நம்பிக்கை
  alternative: விசுவாசம்
  rationale: இங்கு நூற்றுக்குத் தலைவன் இயேசுவின் அதிகாரத்தின்மீது வைத்த உறுதியான நம்பிக்கையே முன்னிலையாகிறது. பொதுவான நவீனத் தமிழுக்காக ‘நம்பிக்கை’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மரபான இறையியல் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இயேசுவின் வியப்பின் வெளிப்பாடு
  choice: வியந்தார்
  alternative: ஆச்சரியப்பட்டார்
  rationale: ἐθαύμασεν என்பதன் நேரடியான வியப்பைத் தணிக்காமலும், அதிலிருந்து இயேசுவின் அறிவைப் பற்றிய கூடுதல் கோட்பாட்டு முடிவைச் சேர்க்காமலும் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்மைப்’ என்பது இயேசுவைக் குறிக்கும் மரியாதைப் பிரதிபெயராகும்; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
