    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: செய்திகளை எடுத்துச் சொல்லுதல் அல்லது நிகழ்ந்தவற்றை அறியச் செய்தல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Ἰωάννῃ
  choice: யோவானிடம்
  rationale: செய்தி தெரிவிக்கப்பட்ட நபரைக் குறிக்கும் நான்காம் வேற்றுமைப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: ஆசிரியரைப் பின்பற்றிக் கற்கும் உறவைச் சுவிசேஷச் சூழலில் துல்லியமாகக் காட்டுகிறது; αὐτοῦ யாரைக் குறிக்கிறது என்பது முந்தைய சூழலால் விளங்குவதால் உரையில் தெளிவுபடுத்தப்படவில்லை.
- source_word: περὶ πάντων τούτων
  choice: இவை அனைத்தையும்
  rationale: περί என்பதன் ‘இவற்றைப் பற்றி’ என்ற பொருள் ‘தெரிவித்தார்கள்’ என்ற வினையுடன் தமிழில் நேரடி செயப்படுபொருளாக இயல்பாக வெளிப்படுகிறது; πάντων என்பதன் முழுமையும் பாதுகாக்கப்படுகிறது.
- source_word: προσκαλεσάμενος
  choice: அழைத்து
  rationale: யோவான் அவர்களைத் தம்மிடம் வருமாறு அழைத்த செயலை இயல்பாகக் காட்டுகிறது; மூலத்தில் இல்லாத வலுவான அதிகாரத் தொனியை ‘கட்டளையிட்டு வரவழைத்து’ போன்ற சொற்களால் சேர்க்கவில்லை.
- source_word: δύο τινὰς τῶν μαθητῶν αὐτοῦ
  choice: தம் சீடர்களில் இருவரை
  rationale: பகுதிப்பொருள் கொண்ட மரபுத்தொடரைத் துல்லியமாகத் தருகிறது. τινάς இங்கு குறிப்பிட்ட பெயரிடப்படாத இருவரைத் தேர்ந்தெடுத்த நுணுக்கத்தைக் கொண்டிருந்தாலும், தமிழில் ‘இருவரை’ என்பதே அதை இயல்பாகத் தாங்குகிறது.
- source_word: ὁ Ἰωάννης
  choice: யோவான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக மீண்டும் சொல்லப்பட்ட எழுவாயைப் பாதுகாத்து, புதிய உட்பிரிவின் செய்பவரைத் தெளிவாக்குகிறது.
