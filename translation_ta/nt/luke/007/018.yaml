  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: ta
  text: அவருடைய சீடர்கள் இவை அனைத்தையும் யோவானிடம் தெரிவித்தார்கள். யோவான் தம் சீடர்களில் இருவரை அழைத்து,[a]
