translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான கதைநடை. ‘சீடர்கள்’ என்ற நிலைபெற்ற வேதாகமச் சொல் பயன்படுத்தப்பட்டுள்ளது. முதல் ‘அவருடைய’ என்பது சூழலிலுள்ள நபரைச் சுட்டும் மூலத்தின் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது; யோவானைக் குறிக்கிறது என்று உரைக்குள் விளக்கமாகச் சேர்க்கப்படவில்லை.
