id: LUK.7.7
reference: Luke 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: ta
  text: ஆகவே, உம்மிடம் வருவதற்குக்கூட நான் தகுதியுள்ளவன் என்று கருதவில்லை. ஆனால், ஒரு வார்த்தை மட்டும் சொல்லுங்கள்; என் பணியாள்[a] குணமடையட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் பையன்” அல்லது “என் பிள்ளை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலைப் பொறுத்து பிள்ளை, இளைஞன் அல்லது பணியாள் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: οὐδὲ
  choice: வருவதற்குக்கூட ... இல்லை
  rationale: மறுப்பை வலுப்படுத்தும் ‘கூட’ என்ற அமைப்பு, தாம் வரத் தகுதியுள்ளவர் எனக்கூட அவர் எண்ணவில்லை என்பதைக் காட்டுகிறது.
- source_word: ἐμαυτὸν ἠξίωσα
  choice: நான் தகுதியுள்ளவன் என்று கருதவில்லை
  rationale: தம்மையே தகுதியுள்ளவராக மதிப்பிடவில்லை என்ற கிரேக்கத் தற்சுட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: உம்மிடம் வருவதற்கு
  rationale: இயேசுவை நேரில் அணுகி வருவதைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுக்கு மாறாக வரும் வேண்டுகோளைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: εἰπὲ λόγῳ
  choice: ஒரு வார்த்தை மட்டும் சொல்லுங்கள்
  rationale: கிரேக்கத்தில் கட்டளை வடிவம் உள்ளது. ‘மட்டும்’ என்பது இயேசுவின் அதிகாரமுள்ள சொல் ஒன்றே போதும் என்ற சூழல்சார் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰαθήτω
  choice: குணமடையட்டும்
  rationale: மூன்றாம் நபர் இறந்தகாலச் செயப்பாட்டு ஏவல் வடிவத்தின் வேண்டுகோள்/கட்டளை வலிமையைப் பாதுகாக்கிறது; அதை எதிர்கால உறுதிமொழியாக மாற்றவில்லை.
- source_word: ὁ παῖς μου
  choice: என் பணியாள்
  rationale: படைத்தலைவனின் அதிகாரத்திற்குக் கீழுள்ள வீட்டுப் பணியாளரைச் சூழல் சுட்டுவதால் ‘பணியாள்’ முதன்மைத் தேர்வாகிறது; சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: படைத்தலைவன் கூறும் παῖς என்பதன் பொருள்
  choice: என் பணியாள்
  alternative: என் பையன்; என் பிள்ளை
  rationale: παῖς என்பது பணியாள், பையன் அல்லது பிள்ளை எனப் பொருள்படலாம். அதிகார உறவை வலியுறுத்தும் இச்சூழலில் ‘பணியாள்’ பொருத்தமானது; அதேவேளை குடும்ப அல்லது பாச நுணுக்கம் இருக்கக்கூடிய உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: ἰαθήτω என்ற ஏவல் வடிவம்
  choice: குணமடையட்டும்
  alternative: குணமடைவான்
  rationale: கிரேக்க வடிவம் எதிர்காலக் குறிப்பு அல்ல, மூன்றாம் நபர் செயப்பாட்டு ஏவல். ஆகவே வேண்டுகோளின் இலக்கண வலிமையைத் தமிழிலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் எளிமையும் காக்கப்பட்டுள்ளன. இயேசுவை நோக்கிய மரியாதை ‘உம்மிடம்’ மற்றும் ‘சொல்லுங்கள்’ என்பவற்றால் வெளிப்படுகிறது. அரிதான அல்லது திருச்சபைச் சிறப்புப் பொருள் கொள்ளக்கூடிய சொற்களைத் தவிர்த்து ‘பணியாள்’ பயன்படுத்தப்பட்டுள்ளது.
