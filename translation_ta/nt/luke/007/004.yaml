id: LUK.7.4
reference: Luke 7:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: ta
  text: அவர்கள் இயேசுவிடம் வந்து, மிகுந்த ஆர்வத்துடன் அவரை வேண்டிக்கொண்டு, “நீர் அவருக்கு இதை வழங்குவதற்கு அவர் தகுதியானவர்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் அவருக்கு இதைச் செய்வதற்கு அவர் தகுதியானவர்.”
    reason: παρέξῃ இச்சூழலில் ‘வழங்கு’ என்றும், கேட்ட உதவியை ‘செய்’ என்றும் பொருள் கொள்ளப்படலாம்.
lexical_decisions:
- source_word: παραγενόμενοι
  choice: வந்து
  rationale: இந்த இறந்தகாலப் பெயரெச்சம் வந்து சேர்ந்ததைக் குறிக்கிறது; தமிழில் தொடர்ச்சியான செயலாக இயல்பாக அமைகிறது.
- source_word: παρεκάλουν
  choice: மன்றாடி
  rationale: இங்கு மரியாதையோடும் தீவிரத்தோடும் முன்வைக்கப்படும் வேண்டுகோளை இது வெளிப்படுத்துகிறது; வெறும் ‘கேட்டுக்கொண்டனர்’ என்பதைவிட மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: σπουδαίως
  choice: மிகவும்
  rationale: வேண்டுகோளின் தீவிரத்தையும் அக்கறையையும் இயல்பான நவீன தமிழில் உணர்த்துகிறது.
- source_word: Ἄξιός
  choice: தகுதியானவர்
  rationale: அவர் இந்த உதவியைப் பெறத் தகுந்தவர் என்ற மதிப்பீட்டை நேரடியாகக் காக்கிறது.
- source_word: ᾧ
  choice: அவருக்கு
  rationale: வேற்றுமை உருபிலுள்ள தொடர்புப்பெயர் நூற்றுக்குத் தலைவனைக் குறிக்கிறது; தமிழில் மறைமுகச் செயப்படுபொருளாக இயல்பாக வழங்கப்படுகிறது.
- source_word: παρέξῃ
  choice: செய்வதற்கு
  rationale: παρέχω இச்சூழலில் கேட்ட உதவியை அளிப்பது அல்லது செய்வது என்ற பொருள் தருகிறது; ‘இதைச் செய்வது’ என்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: τοῦτο
  choice: இதை
  rationale: முந்தைய வசனத்தில் கோரப்பட்ட உதவியைச் சுட்டும் மூலத்தின் பொதுவான சுட்டுப்பெயரை வெளிப்படையான விளக்கமின்றி அப்படியே காக்கிறது.
