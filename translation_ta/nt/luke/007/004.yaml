  register: நவீன நிலையான தமிழில், மரியாதையான நேரடி உரைக்காக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் மூலத்தின் தீவிர வேண்டுகோளையும் ‘தகுதி’ குறித்த கூற்றையும் எளிமையாகப் பாதுகாக்கிறது.
