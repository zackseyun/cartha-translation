  revision_rationale: The revision gives σπουδαίως its distinct force, uses an idiomatic Tamil expression for the earnest appeal, and clarifies the relative-clause sense that the centurion is worthy for Jesus to grant the requested favor to him. The footnote retains the broader contextual sense of παρέχω without altering the main text’s meaning.
