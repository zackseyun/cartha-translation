  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: ta
  text: அந்த நேரத்தில்[a] அவர் நோய்கள், கொடிய வேதனைகள்[b], தீய ஆவிகள் ஆகியவற்றிலிருந்து பலரைக் குணமாக்கினார்; பார்வையற்ற பலருக்குப் பார்க்கும் திறனை அருளினார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நேரத்திலேயே.’ இந்தக் கிரேக்கச் சொற்றொடர் நிகழ்வின் உடனடித் தன்மையை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வாதைகள்’ அல்லது ‘கொடுந்துன்பங்கள்.’ கிரேக்கச் சொல் நேரடியாகச் ‘சாட்டையடிகள்’ எனப் பொருள்படும்; விரிவான பொருளில் அது கடுமையான உடல் வேதனைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘பார்க்க அருளினார்.’
    reason: lexical_alternative
