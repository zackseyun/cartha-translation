theological_decisions:
- issue: πνεύματα πονηρά என்பவற்றின் இயல்பு மற்றும் அவற்றின்மேல் இயேசுவின் அதிகாரம்
  choice: ‘தீய ஆவிகள்’ என்ற தனிப்பட்ட ஆவிக்குரிய பொருளைப் பாதுகாத்து, அவற்றிலிருந்து மக்களை இயேசு விடுவித்ததை குணமாக்கும் செயல்களின் பட்டியலில் இணைத்தல்
  alternative: இதை மன அல்லது உடல் நோய்களுக்கான உருவக விவரிப்பாக மட்டும் மொழிபெயர்த்தல்
  rationale: πνευμάτων πονηρῶν என்பது தீய ஆவிகளைக் குறிக்கும் நேரடியான கிரேக்கச் சொற்றொடர். அதை வெறும் நோய் உருவகமாகக் குறைப்பது மூலத்தில் இல்லாத நவீன விளக்கத்தைத் திணிக்கும்.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ‘அருளினார்’ என்பது உயர்நடையாக இருந்தாலும் இங்கு χαρίζομαι என்பதன் மனமுவந்த கொடை நுண்ணுணர்வை இயல்பாகத் தருகிறது. மூன்று அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பக்கத்திலேயே வைக்கப்பட்டுள்ளன.
