id: LUK.7.38
reference: Luke 7:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: ta
  text: அவள் அழுதுகொண்டே, அவருக்குப் பின்னால் அவரது காலருகே நின்றாள். தன் கண்ணீரால் அவரது கால்களை நனைக்கத் தொடங்கி, தன் தலைமுடியால் அவற்றைத் துடைத்துக்கொண்டிருந்தாள். அவரது கால்களை முத்தமிட்டுக்கொண்டே[a], நறுமணத் தைலத்தை[b] அவற்றின்மேல் பூசிக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரது கால்களை மீண்டும் மீண்டும் முத்தமிட்டாள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினை தீவிரத்தைக் குறிப்பதுடன், அதன் கால வடிவம் தொடர்ந்து அல்லது திரும்பத் திரும்ப நடந்த செயலை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நறுமணக் களிம்பை’ அல்லது ‘வாசனை எண்ணெயை’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் வாசனைமிக்க எண்ணெயையோ களிம்பையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: நின்றாள்
  rationale: இறந்தகால வினையெச்சத்தின் காட்சியமைக்கும் பணியை, இயல்பான நவீனத் தமிழில் தனி வினையாக அளிக்கிறது.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: அவருக்குப் பின்னால் அவரது காலருகே
  rationale: ὀπίσω என்பதன் ‘பின்னால்’ என்ற பொருளையும், παρά + வேற்றுமை உருபின் அருகாமைப் பொருளையும் காக்கிறது; இயேசு பந்தியில் சாய்ந்திருந்த காட்சிக்கும் பொருந்துகிறது.
- source_word: κλαίουσα
  choice: அழுதுகொண்டே
  rationale: தொடர்ந்து நடந்த அழுகையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: தன் கண்ணீரால் ... நனைக்கத் தொடங்கி
  rationale: ἤρξατο செயல் தொடங்கியதைக் குறிக்கிறது; βρέχειν என்பதை மிகைப்படுத்தாமல் ‘நனைக்க’ எனத் தருகிறது.
- source_word: ἐξέμασσεν
  choice: துடைத்தாள்
  rationale: கால்களில் இருந்த கண்ணீரைத் தலைமுடியால் துடைக்கும் செயலைத் தெளிவாகக் காட்டுகிறது; சூழலில் உலர்த்துதல் உட்பொருளாக இருந்தாலும் அதை தேவையின்றி விரிவாக்கவில்லை.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: தன் தலைமுடியால்
  rationale: தமிழில் இயல்பான சுருக்கமான வடிவம்; ‘அவளுடைய தலையின் முடி’ என்ற மூலச் சொல்லின் முழுப் பொருளையும் தருகிறது.
- source_word: κατεφίλει
  choice: முத்தமிட்டுக்கொண்டே
  rationale: வினையின் imperfect காலம் காட்டும் தொடர்ச்சியையும், கூட்டு வினை தரும் மீண்டும் மீண்டும் முத்தமிடும் நுணுக்கத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἤλειφεν
  choice: பூசிக்கொண்டிருந்தாள்
  rationale: தொடர்ந்து நடைபெற்ற பூசும் செயலைக் காட்டுகிறது; தமிழில் இச்சூழலுக்கு இயல்பான வினை.
- source_word: τῷ μύρῳ
  choice: நறுமணத் தைலத்தை
  rationale: μύρον குறிக்கும் வாசனைமிக்க எண்ணெய் அல்லது களிம்பை ordinary modern Tamil-ல் தெளிவாக அளிக்கிறது.
theological_decisions:
- issue: இயேசுவின் கால்களிடம் பெண் செய்த செயல்களின் வர்ணனை
  choice: அழுகை, கண்ணீரால் நனைத்தல், தலைமுடியால் துடைத்தல், தொடர்ந்து முத்தமிடுதல், நறுமணத் தைலம் பூசுதல் ஆகிய உடல்சார்ந்த செயல்களை நேரடியாகக் காத்தல்
  alternative: இவற்றை ‘பக்தி காட்டினாள்’ போன்ற விளக்கவுரையாகச் சுருக்குதல் அல்லது முத்தமிடுதலின் தொடர்ச்சியை மென்மைப்படுத்துதல்
  rationale: கிரேக்க உரை செயல்களை உணர்ச்சித் தீவிரத்துடன் நேரடியாக வர்ணிக்கிறது; அவற்றுக்கு மேலாக ஒரு சமயவியல் நோக்கத்தைச் சேர்க்காமல் அதே வலிமையை மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தொடர்ச்சியான செயல்கள் ‘-கொண்டே/கொண்டிருந்தாள்’ வடிவங்களால் வெளிப்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் இடத்திலேயே அமைக்கப்பட்டுள்ளன.
