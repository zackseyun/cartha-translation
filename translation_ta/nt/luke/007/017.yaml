  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: ta
  text: அவரைப் பற்றிய இந்தச் செய்தி[a] யூதேயா முழுவதிலும், சுற்றியுள்ள பகுதிகள் முழுவதிலும் பரவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பற்றிய இந்தத் தகவல்” அல்லது “அவரைப் பற்றிய இந்த வார்த்தை.”
    reason: λόγος என்பதற்கு இச்சூழலில் ‘செய்தி,’ ‘தகவல்,’ அல்லது இன்னும் சொல்லுக்கு நெருக்கமாக ‘வார்த்தை’ எனப் பொருள் கொள்ள முடியும்.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: பரவியது
  rationale: செய்தி ஓரிடத்திலிருந்து பல இடங்களுக்குச் சென்றதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; மூலத்தில் உள்ள ‘வெளியே சென்றது’ என்ற உருவகத்தின் சூழல்சார் பொருளையும் தருகிறது.
- source_word: ὁ λόγος οὗτος
  choice: இந்தச் செய்தி
  rationale: இங்கு λόγος என்பது தனிப்பட்ட ஒரு சொல்லை அல்ல, இயேசுவைப் பற்றிப் பரவிய செய்தியைக் குறிக்கிறது.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: யூதேயா முழுவதிலும்
  rationale: ὅλῃ தரும் முழுப் பரப்பையும் உள்ளடக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றிய
  rationale: περί + பிறப்புவேற்றுமையின் ‘அவரைக் குறித்து’ என்ற பொருளை எளிய, மரியாதையான தமிழில் தருகிறது.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: அதைச் சுற்றியுள்ள பகுதி முழுவதிலும்
  rationale: περίχωρος குறிக்கும் யூதேயாவைச் சுற்றியுள்ள பரப்பைத் தெளிவாகவும், நிர்வாக எல்லை போன்ற தேவையற்ற குறிப்பின்றியும் தெரிவிக்கிறது.
- source_word: καὶ ... καὶ
  choice: …முழுவதிலும், …முழுவதிலும்
  rationale: இரு நிலப்பரப்புகளையும் ஒன்றோடொன்று சேர்க்கும் கிரேக்கத் தொடரைத் தமிழில் இயல்பான பட்டியல் அமைப்பால் வெளிப்படுத்துகிறது.
