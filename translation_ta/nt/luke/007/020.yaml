id: LUK.7.20
reference: Luke 7:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: ta
  text: அந்த மனிதர்கள் அவரிடம் வந்து, “திருமுழுக்கு அளிக்கும் யோவான் எங்களை உங்களிடம் அனுப்பினார்; அவர், ‘வரவேண்டியவர் நீங்கள்தானா, அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?’ என்று கேட்கிறார்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: அவரிடம் வந்து
  rationale: இறந்தகால வினையெச்சம் ஆண்கள் அவரை அணுகிய சூழலை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிகழ்வுத் தொடரைத் தருகிறது.
- source_word: οἱ ἄνδρες
  choice: அந்த ஆண்கள்
  rationale: ἀνήρ இங்கு ஆண் தூதர்களைக் குறிப்பதால், பொதுவான ‘மனிதர்கள்’ என்பதற்குப் பதிலாக பாலினக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: திருமுழுக்கு அளிக்கும் யோவான்
  rationale: βαπτιστής என்பதன் செயற்பாட்டு பொருளை நவீனத் தமிழில் தெளிவாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: எங்களை உங்களிடம் அனுப்பி, … என்று கேட்கச் சொன்னார்
  rationale: λέγων தூதர்களிடம் ஒப்படைக்கப்பட்ட செய்தியை அறிமுகப்படுத்துகிறது; அது கேள்வியாக இருப்பதால் தமிழில் ‘கேட்கச் சொன்னார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: Σὺ εἶ ὁ ἐρχόμενος
  choice: வரவிருக்கிறவர் நீங்கள்தானா
  rationale: Σὺ தரும் வலியுறுத்தலை ‘நீங்கள்தானா’ காக்கிறது; ὁ ἐρχόμενος என்பதின் எதிர்பார்க்கப்பட்ட நபர் என்ற தன்மையையும், அதன் மறைமுக மேசியச் சுட்டையும் மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: ἢ ἄλλον προσδοκῶμεν
  choice: அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா
  rationale: ἄλλον என்பதை ‘வேறொருவர்’ என்றும், ஆலோசனை/எதிர்பார்ப்பு நுட்பமுள்ள προσδοκῶμεν என்பதை ‘எதிர்பார்க்க வேண்டுமா’ என்றும் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: ὁ ἐρχόμενος என்பதின் மேசியச் சார்பு
  choice: வரவிருக்கிறவர்
  alternative: வருகிறவர்; வரவேண்டியவர்
  rationale: இச்சொற்றொடர் எதிர்பார்க்கப்பட்ட சிறப்பான ஒருவரைக் குறிக்கலாம். ‘வரவிருக்கிறவர்’ அதன் அடைமொழித் தன்மையையும் எதிர்கால எதிர்பார்ப்பையும் காக்கிறது; ‘மேசியா’ என்று வெளிப்படையாகச் சேர்த்து உரையின் மறைமுகத்தைக் கலைப்பதில்லை.
- issue: யோவானின் கேள்வியில் உள்ள உறுதியின்மை
  choice: நீங்கள்தானா … அல்லது வேறொருவரை …?
  alternative: நீங்களே அவர் என்று உறுதிப்படுத்தும் வகையில் உரைத்தல்
  rationale: மூலத்தின் உண்மையான கேள்வியையும் இரு சாத்தியங்களுக்கிடையேயான பதற்றத்தையும் தீர்த்துவிடாமல் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. இயேசுவை நோக்கிய நேரடி உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற விளக்கவுரையோ பிரிவுசார் சொற்களோ சேர்க்கப்படவில்லை.
