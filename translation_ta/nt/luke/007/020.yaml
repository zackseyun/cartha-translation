revisions:
- from: அந்த ஆண்கள் அவரிடம் வந்து, “திருமுழுக்கு அளிக்கும் யோவான் எங்களை உங்களிடம் அனுப்பி, ‘வரவிருக்கிறவர் நீங்கள்தானா, அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?’ என்று கேட்கச் சொன்னார்” என்றார்கள்.
  to: அந்த மனிதர்கள் அவரிடம் வந்து, “திருமுழுக்கு அளிக்கும் யோவான் எங்களை உங்களிடம் அனுப்பினார்; அவர், ‘வரவேண்டியவர் நீங்கள்தானா, அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?’ என்று கேட்கிறார்” என்றார்கள்.
  rationale: 'The revision makes John’s act of sending and the content of the messengers’ report more direct, improves narrative idiom, and renders ὁ ἐρχόμενος with a Tamil expression that preserves its expected-title force and its interpretive openness. No footnote is required: the translation itself retains the ambiguity without making the referent explicit.'
  reviewer_model: gpt-5.6-terra
