id: LUK.7.29
reference: Luke 7:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: ta
  text: யோவானின் திருமுழுக்கைப் பெற்றிருந்த[b] மக்கள் அனைவரும்—வரிவசூலிப்பவர்களும் உட்பட—இதைக் கேட்டபோது, கடவுள் நீதியுள்ளவர் என்று ஏற்றுக்கொண்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “கடவுள் நீதியானவர் என்று உறுதிப்படுத்தினார்கள்.” அதாவது, கடவுளே நீதியானவர் என்றும் அவர் பக்கமே நியாயம் என்றும் அவர்கள் ஏற்றுக்கொண்டார்கள்.
    reason: lexical_alternative
  - marker: b
    text: இதனை, “யோவானின் திருமுழுக்கைப் பெற்றிருந்ததால்” என்ற காரணப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: மக்கள் அனைவரும்
  rationale: ஒருமை வடிவிலுள்ள கூட்டுப்பொருளை இயல்பான நவீனத் தமிழில் முழுமையான கூட்டாகக் காட்டுகிறது.
- source_word: ἀκούσας
  choice: இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலச் சூழலை இயல்பாக வெளிப்படுத்துகிறது; ‘இதை’ என்பது முந்தைய உரையிலிருந்து புரிந்துகொள்ளப்படும் பொருளைத் தெளிவாக்குகிறது.
- source_word: οἱ τελῶναι
  choice: வரிவசூலிப்பவர்களும் உட்பட
  rationale: அக்கால வரி வசூலிப்போரைக் குறிக்கும் தெளிவான நவீனச் சொல்; καί-யை அளவுக்கு மீறிய வலியுறுத்தலின்றி உள்ளடக்க உறவாகக் காட்டுகிறது.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: கடவுள் நீதியுள்ளவர் என்று ஏற்றுக்கொண்டார்கள்
  rationale: மனிதர்கள் கடவுளை நீதியுள்ளவராக்கினார்கள் என்பதல்ல, அவர் நீதியானவர் என்றும் அவர் பக்கமே நியாயம் என்றும் அங்கீகரித்தார்கள் என்பதே இங்கு பொருள். தமிழில் தவறாகப் புரிந்துகொள்ளப்படாத வகையில் நீதித்துறை சார்ந்த நுண்பொருளைத் தக்கவைக்கிறது.
- source_word: βαπτισθέντες
  choice: திருமுழுக்கைப் பெற்றிருந்த
  rationale: செயப்பாட்டு இறந்தகாலப் பங்கேற்புவினையை முடிந்த நிகழ்வின் பின்னணியாக வைத்திருக்கிறது; காரணப் பொருளை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: யோவான் கொடுத்த திருமுழுக்கு
  rationale: யோவானோடு தொடர்புடைய திருமுழுக்குச் சடங்கை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது; ‘யோவானின் திருமுழுக்கு’ என்ற உடைமைத் தொடர் உண்டாக்கக்கூடிய சிறிய தெளிவின்மையைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘கடவுளை நீதிப்படுத்தினார்கள்’ என்பதன் பொருள்
  choice: கடவுள் நீதியுள்ளவர் என்று அவர்கள் ஏற்றுக்கொண்டார்கள்.
  alternative: ‘கடவுளை நீதிமானென்று தீர்த்தார்கள்’ என்று இன்னும் சொல்லுக்கு நெருக்கமாக மொழிபெயர்க்கலாம்.
  rationale: δικαιόω இங்கு கடவுளின் நிலையில் மாற்றம் ஏற்பட்டதாகச் சொல்லவில்லை; மக்கள் கடவுள் நீதியானவர், அவர் பக்கமே நியாயம் என்று அங்கீகரித்ததைச் சொல்கிறது. தேர்ந்த மொழிபெயர்ப்பு இந்தப் பொருளைத் தெளிவாக வைத்திருக்கிறது.
- issue: βαπτισθέντες என்ற பங்கேற்புவினையின் தொடர்பு
  choice: திருமுழுக்குப் பெற்றிருந்தது அவர்களுடைய பதிலின் பின்னணிச் சூழலாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘யோவானின் திருமுழுக்கைப் பெற்றிருந்ததால்’ என்று காரணப் பொருளிலும் புரிந்துகொள்ளலாம்.
  rationale: கிரேக்கப் பங்கேற்புவினை சூழலில் காரணத்தைக் குறிப்பதாக இருக்கக்கூடும்; ஆனால் அதன் வடிவம் மட்டும் காரணப் பொருளைக் கட்டாயப்படுத்தாது. எனவே முதன்மை உரை அந்தத் தொடர்பைத் தீர்மானமாக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்பது βάπτισμα என்பதற்கான வெளிப்படையான தமிழ்ச் சொலாகப் பயன்படுத்தப்பட்டுள்ளது. இடைக்கோடுகள் வரிவசூலிப்பவர்களும் ‘மக்கள் அனைவரும்’ என்ற கூட்டத்தில் அடங்குவதைத் தெளிவாக்குகின்றன.
