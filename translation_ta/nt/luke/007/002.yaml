  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: ta
  text: ஒரு நூற்றுவர் தலைவனுடைய அடிமை நோயுற்று இறக்கவிருந்தான்; அவன் அந்தத் தலைவனுக்கு மிகவும் மதிப்புக்குரியவனாக இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: ஒரு நூற்றுவர் தலைவனுடைய
  rationale: τινος என்பதன் குறிப்பற்ற தன்மையையும், ἑκατοντάρχης குறிக்கும் ரோமப் படை அதிகாரியின் பதவியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: δέ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான கதைத் தொடர்ச்சி இணைப்பாக உள்ளது; தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடரால் அதன் பணியை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: δοῦλος
  choice: அடிமை
  rationale: முதல் நூற்றாண்டின் வீட்டுடைமைச் சூழலில் உள்ள கட்டுப்பட்ட சமூக உறவை ‘அடிமை’ தெளிவாகப் பாதுகாக்கிறது; ‘பணியாளர்’ அந்த உறவை மென்மையாக்கக்கூடும்.
- source_word: κακῶς ἔχων
  choice: நோயுற்று
  rationale: ‘மோசமான நிலையில் இருத்தல்’ என்ற கிரேக்க மரபுத்தொடரை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἤμελλεν τελευτᾶν
  choice: இறக்கவிருந்தான்
  rationale: μέλλω உடன் வரும் வினையெச்சம் குறிக்கும் உடனடி நெருக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: அந்த அடிமையை அவன் மிகவும் மதித்தான்
  rationale: ἔντιμος குறிக்கும் உயர்ந்த மதிப்பைத் தெளிவாகக் காட்டுகிறது; கிரேக்க உறவுப்பெயர் அமைப்பு இயல்பான தமிழுக்காகத் தனி வாக்கியமாக மாற்றப்பட்டுள்ளது.
theological_decisions:
- issue: வீட்டு அடிமைத்தனச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளர்
  rationale: இங்கு உடைமை மற்றும் கீழ்ப்பட்ட சமூக நிலை பொருளின் ஒரு பகுதியாக இருப்பதால் ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது. மாற்று வழக்கை வாசகர் அறிய ‘பணியாளர்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நூற்றுவர் தலைவன்’ வரலாற்றுப் படைப் பதவியைச் சுருக்கமாகக் குறிக்கிறது; மூலத்தின் நீண்ட உறவுப்பெயர் வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
