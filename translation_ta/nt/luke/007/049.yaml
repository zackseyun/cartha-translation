id: LUK.7.49
reference: Luke 7:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: ta
  text: அவரோடு பந்தியில் சாய்ந்து உணவருந்திக்கொண்டிருந்தவர்கள், “பாவங்களைக்கூட மன்னிக்கிற இவர் யார்?” என்று தங்களுக்குள்[a] சொல்லத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுக்குத் தாங்களே.” கிரேக்கச் சொற்றொடர் அவரவர் உள்ளத்தில் எண்ணியதையோ, விருந்தினர்கள் தங்களிடையே பேசிக்கொண்டதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: சொல்லத் தொடங்கினார்கள்
  rationale: ἄρχω என்பதன் இறந்தகால வடிவமும் தொடர்வினையும் செயல் தொடங்கியதைக் குறிக்கின்றன; ‘தொடங்கினார்கள்’ அந்தத் தொடக்கநிலையை இயல்பான தமிழில் காக்கிறது.
- source_word: οἱ συνανακείμενοι
  choice: அவரோடு பந்தியில் சாய்ந்து உணவருந்திக்கொண்டிருந்தவர்கள்
  rationale: இது இயேசுவோடு விருந்தில் பண்டைய வழக்கப்படி சாய்ந்து உணவருந்தியவர்களைக் குறிக்கிறது. ‘பந்தியில்’ உணவுச் சூழலைத் தெளிவாக்குகிறது; ‘சாய்ந்து’ அக்கால உணவருந்தும் நிலையைக் காக்கிறது.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: தங்களுக்குள் சொல்ல
  rationale: இந்தக் கிரேக்கச் சொற்றொடர் அவரவர் உள்ளத்தில் எண்ணியதையோ, விருந்தினர்கள் தங்களிடையே பேசிக்கொண்டதையோ குறிக்கலாம். ‘தங்களுக்குள்’ இரு சாத்தியங்களையும் பெருமளவு திறந்தே வைக்கிறது.
- source_word: Τίς οὗτός ἐστιν
  choice: இவர் யார்?
  rationale: மூலத்தில் ‘மனிதன்’ என்ற பெயர்ச்சொல் இல்லை. ‘இவர் யார்?’ கேள்வியின் சுருக்கத்தையும் சூழலுக்கேற்ற மரியாதைநிலையையும் காக்கிறது.
- source_word: καὶ
  choice: கூட
  rationale: இங்கு καί வியப்பையும் எதிர்பாராத அளவையும் காட்டுகிறது; தமிழில் ‘கூட’ அந்த உயர்த்திக் காட்டும் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἁμαρτίας ἀφίησιν
  choice: பாவங்களை மன்னிக்கிற
  rationale: இந்தச் சூழலில் ἀφίημι பாவங்களை மன்னிப்பதற்கான நிலையான சொல்லாட்சி. ‘மன்னிக்கிற’ என்பது தெளிவான, வழக்கிலுள்ள தமிழ் இணை.
theological_decisions:
- issue: பாவங்களை மன்னிக்கும் இயேசுவின் அதிகாரம் குறித்த மறைமுகக் கேள்வி
  choice: “பாவங்களைக்கூட மன்னிக்கிற இவர் யார்?” என்ற விருந்தினர்களின் கேள்வியை விளக்க விரிவாக்கமின்றி வைத்தல்
  alternative: ‘கடவுளுக்குரிய அதிகாரத்தால் பாவங்களை மன்னிக்கிற இவர் யார்?’ என்று விளக்கத்தைச் சேர்த்தல்
  rationale: வசனம் விருந்தினர்களின் வியப்பையும் கிறிஸ்துவைப் பற்றிய கேள்வியையும் எழுப்புகிறது; ஆனால் அதற்கான கோட்பாட்டு முடிவை இங்கே வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தின் இறையியல் இறுக்கம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பந்தியில் சாய்ந்து உணவருந்துதல்’ பண்டைய விருந்துச் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘தங்களுக்குள்’ என்பதிலுள்ள உண்மையான இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
