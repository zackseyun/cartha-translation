id: LUK.7.32
reference: Luke 7:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: ta
  text: 'அவர்கள் சந்தைத் திடலில் அமர்ந்து ஒருவருக்கொருவர் கூப்பிடும் பிள்ளைகளைப் போன்றவர்கள்; அவர்கள் சொல்வது:


    ‘உங்களுக்காக நாங்கள் குழல் ஊதினோம்;

    நீங்கள் நடனமாடவில்லை.


    நாங்கள் புலம்பினோம்[a];

    நீங்கள் அழவில்லை.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் புலம்பல் பாடினோம்” அல்லது “நாங்கள் இரங்கற்பாடல் பாடினோம்.” கிரேக்கச் சொல் புலம்புவதையும், இறந்தவருக்கான இரங்கற்பாடல் பாடுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: போன்றவர்கள்
  rationale: உவமையை இயல்பான நவீனத் தமிழில் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: παιδίοις
  choice: பிள்ளைகளை
  rationale: வயதையோ பாலினத்தையோ தேவையின்றிக் குறிப்பாக்காமல், பொதுவாகக் குழந்தைகளைக் குறிக்கிறது.
- source_word: ἐν ἀγορᾷ
  choice: சந்தைத் திடலில்
  rationale: ἀγορά என்பது விற்பனை நடைபெறும் இடமாக மட்டுமன்றி பொதுமக்கள் கூடும் திறந்த வெளியையும் குறிக்கலாம்; ‘சந்தைத் திடல்’ அந்தச் சூழலைப் பாதுகாக்கிறது.
- source_word: καθημένοις
  choice: உட்கார்ந்து
  rationale: பிள்ளைகளின் நிலையை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: ஒருவரையொருவர் கூப்பிட்டு
  rationale: அவர்கள் பரஸ்பரம் உரக்க அழைத்துப் பேசும் காட்சியையும் ἀλλήλοις என்பதன் பரஸ்பரப் பொருளையும் காக்கிறது.
- source_word: ἃ λέγει
  choice: என்று சொல்லும்
  rationale: கிரேக்கப் பாடத்தின் எண்ணொற்றுமைச் சிக்கலை தமிழில் செயற்கையாக வெளிப்படுத்தாமல், பிள்ளைகள் கூறும் வார்த்தைகளை இயல்பாக இணைக்கிறது.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: உங்களுக்காக நாங்கள் குழல் ஊதினோம்
  rationale: αὐλέω குறிப்பாகக் குழல் அல்லது ஊதுகுழல் வாசிப்பதைக் குறிக்கிறது; பொதுவான ‘இசைத்தோம்’ என்பதைவிட மூலப்படிமத்தைத் துல்லியமாகக் காக்கிறது.
- source_word: οὐκ ὠρχήσασθε
  choice: நீங்கள் நடனமாடவில்லை
  rationale: எளிய இறந்தகால வடிவில் செயலை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐθρηνήσαμεν
  choice: நாங்கள் புலம்பல் பாடினோம்
  rationale: θρηνέω என்பதன் புலம்புதல் அல்லது இரங்கற்பா பாடுதல் என்ற பொருட்களில், இங்குள்ள நிகழ்த்துகை சார்ந்த எதிர்மறை இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ἐκλαύσατε
  choice: நீங்கள் அழவில்லை
  rationale: κλαίω என்பதன் அழுதல்/கண்ணீர் விடுதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: பிள்ளைகளின் முரண்பட்ட செயல்களை இயேசுவின் பயன்பாட்டை முன்கூட்டியே விளக்காமல் மொழிபெயர்த்தல்
  choice: ‘குழல் ஊதினோம்’, ‘நடனமாடவில்லை’, ‘புலம்பல் பாடினோம்’, ‘அழவில்லை’ என்ற நேரடியான காட்சிமொழி
  alternative: ‘மகிழ்ச்சியைக் கொண்டாடினோம்’, ‘துக்கம் அனுசரித்தோம்’ போன்ற விளக்கமளிக்கும் மொழி
  rationale: வசனம் உவமைக் காட்சியைத் தருகிறது; அதன் பொருளை இங்கேயே தீர்மானிக்கவில்லை. நேரடியான செயல்மொழி உருவகத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. கவிதைபோன்ற மேற்கோள் வரிகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; ‘சந்தைத் திடல்’ பொதுச் சதுக்கச் சூழலை உணர்த்துகிறது.
