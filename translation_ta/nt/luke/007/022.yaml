id: LUK.7.22
reference: Luke 7:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: ta
  text: 'அவர் அவர்களுக்குப் பதிலளித்து, “நீங்கள் போய், கண்டவற்றையும் கேட்டவற்றையும் யோவானிடம் அறிவியுங்கள்: பார்வையற்றோர் பார்வை பெறுகிறார்கள்[a]; கால் ஊனமுற்றோர் நடக்கிறார்கள்; தொழுநோயால் பாதிக்கப்பட்டோர் தூய்மையாக்கப்படுகிறார்கள்; காது கேளாதோர் கேட்கிறார்கள்; இறந்தோர் எழுப்பப்படுகிறார்கள்; ஏழைகளுக்கு நற்செய்தி அறிவிக்கப்படுகிறது[b]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வையற்றோர் மீண்டும் பார்க்கிறார்கள்.” இங்குள்ள கிரேக்க வினைச்சொல் பார்வையைப் பெறுவதையோ மீண்டும் பெறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் அமைப்பில், “ஏழைகள் நற்செய்தி அறிவிக்கப்படுகிறார்கள்.” கிரேக்கத்தில் இது செயப்பாட்டு வடிவில் இருந்து, ஏழைகளுக்கு நற்செய்தி அறிவிக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: அவர் அவர்களுக்குப் பதிலளித்து … என்றார்
  rationale: பதில் கூறும் தன்மையையும் ‘சொன்னார்’ என்ற முதன்மை வினையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: நீங்கள் போய் … அறிவியுங்கள்
  rationale: முதன்மைக் கட்டளையுடன் இணைந்து செயல்படும் பங்கேற்பு வினையை இயல்பான தமிழ் கட்டளைத் தொடராக வழங்குகிறது; ἀπαγγέλλω என்பதன் செய்தியைத் திரும்பத் தெரிவிக்கும் பொருளையும் காக்கிறது.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: கண்டவற்றையும் கேட்டவற்றையும்
  rationale: தூதர்கள் நேரடியாகக் கண்டும் கேட்டும் அறிந்த சான்றுகளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: பார்வையற்றோர் பார்வை பெறுகிறார்கள்
  rationale: இச்சூழலில் ἀναβλέπω குறிக்கும் பார்வை கிடைத்தல் அல்லது மீண்டும் கிடைத்தல் என்ற பொருளைத் தெளிவாக வழங்குகிறது; ‘மீண்டும்’ என்ற பொருள் கட்டாயமாக்கப்படவில்லை.
- source_word: χωλοὶ περιπατοῦσιν
  choice: கால் ஊனமுற்றோர் நடக்கிறார்கள்
  rationale: χωλός என்பதன் உடல் இயக்கக் குறைபாட்டை இன்றைய வாசகர்களுக்குத் தெளிவாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
- source_word: λεπροὶ καθαρίζονται
  choice: தொழுநோயால் பாதிக்கப்பட்டோர் தூய்மையாக்கப்படுகிறார்கள்
  rationale: மக்களை நோயின் பெயரால் மட்டும் அடையாளப்படுத்தாமல், καθαρίζονται என்பதிலுள்ள தூய்மைப்படுத்துதல் மற்றும் சமூக-சடங்கு மீட்பு நுணுக்கத்தைக் காக்கிறது.
- source_word: κωφοὶ ἀκούουσιν
  choice: காது கேளாதோர் கேட்கிறார்கள்
  rationale: ἀκούουσιν உடன் வரும் κωφοί இங்கு கேளாமையைக் குறிப்பது தெளிவு; தமிழ் இணை நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: νεκροὶ ἐγείρονται
  choice: இறந்தோர் எழுப்பப்படுகிறார்கள்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தையும் குறிப்பிடப்படாத செய்பவரையும் காக்கிறது.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ஏழைகளுக்கு நற்செய்தி அறிவிக்கப்படுகிறது
  rationale: தமிழில் இயல்பற்ற ‘ஏழைகள் நற்செய்தியாக்கப்படுகிறார்கள்’ போன்ற அமைப்பைத் தவிர்த்து, நற்செய்தி அவர்களுக்குப் பிரகடனப்படுத்தப்படுகிறது என்ற கிரேக்கச் செயப்பாட்டுப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: அற்புதங்களின் பட்டியல் இயேசுவின் அடையாளத்திற்கும் பணிக்கும் சான்றாக இருப்பது
  choice: மீட்புச் செயல்களை நேரடியாகக் கூறி, அவற்றின் மெசியா சார்ந்த விளக்கத்தை வசனத்திற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ஏசாயா தீர்க்கதரிசனங்கள் நிறைவேறுகின்றன என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாகக் கூறுதல்.
  rationale: வசனம் யோவானுக்குத் தெரிவிக்க வேண்டிய காணக்கூடிய செயல்களையே தருகிறது. தீர்க்கதரிசனப் பின்னொலிகள் சொற்களின் வழியே இருக்க அனுமதிக்கப்படுகின்றன; உரையில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
- issue: பட்டியலிலுள்ள செயப்பாட்டு வினைகளின் செய்பவர்
  choice: ‘தூய்மையாக்கப்படுகிறார்கள்,’ ‘எழுப்பப்படுகிறார்கள்,’ ‘அறிவிக்கப்படுகிறது’ என்ற செயப்பாட்டு வடிவங்கள் பயன்படுத்தப்பட்டன.
  alternative: ‘தேவன் எழுப்புகிறார்’ அல்லது ‘இயேசு அறிவிக்கிறார்’ என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: மூல கிரேக்கம் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. அதைத் தக்கவைப்பது இறையியல் பொருளை மொழிபெயர்ப்பாளர் முடிவுசெய்து சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மனிதர்களை உடல்நிலை அல்லது நோயின் பெயரால் இழிவுபடுத்தாத சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. தொடர் வாக்கியங்களின் தீர்க்கதரிசனத் தொனியைத் தக்கவைக்க ஒரே கால அமைப்பும் செயப்பாட்டு வடிவங்களும் பாதுகாக்கப்பட்டுள்ளன.
