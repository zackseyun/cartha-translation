id: LUK.7.26
reference: Luke 7:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ta
  text: ஆனால், எதைப் பார்க்க நீங்கள் வெளியே சென்றீர்கள்? ஒரு தீர்க்கதரிசியையா? ஆம், உங்களுக்குச் சொல்கிறேன், ஒரு தீர்க்கதரிசியைவிட மேலானவரையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய சொல்லாட்சிக் கேள்வுடன் உள்ள முரண்பாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: τί
  choice: எதை
  rationale: ἰδεῖν என்பதன் செயப்படுபொருளாக வரும் வினாப்பெயர்; இங்கு பொருள் ‘ஏன்’ அல்ல, ‘எதை’ என்பதே.
- source_word: ἐξήλθατε ἰδεῖν
  choice: பார்க்க நீங்கள் வெளியே சென்றீர்கள்
  rationale: கடந்தகாலச் செயலையும், ἰδεῖν குறிக்கும் நோக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: προφήτην
  choice: ஒரு தீர்க்கதரிசியையா
  rationale: சுருக்கப்பட்ட சொல்லாட்சிக் கேள்வைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ναί, λέγω ὑμῖν
  choice: ஆம், உங்களுக்குச் சொல்கிறேன்
  rationale: உறுதியான ஒப்புதலையும் நேரடி உரைநடையையும் காக்கிறது.
- source_word: καὶ περισσότερον προφήτου
  choice: ஒரு தீர்க்கதரிசியைவிட மேலானவரையே
  rationale: ஒப்பீட்டின் வலியுறுத்தலைக் காத்து, குறிப்பிடப்படுவது ஒரு நபர் என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அவரது மேன்மையின் துல்லிய தன்மையை விரித்துரைக்கவில்லை.
theological_decisions:
- issue: யோவானின் தீர்க்கதரிசன நிலையும் அதற்கு மேலான சிறப்பும்
  choice: அவர் ஒரு தீர்க்கதரிசி என்பதையும், தீர்க்கதரிசியைவிட மேலானவர் என்பதையும் மட்டும் கூறுதல்
  alternative: அவரை மிகப் பெரிய தீர்க்கதரிசி அல்லது இறுதிக்காலத் தூதர் என்று இவ்வசனத்திலேயே விளக்குதல்
  rationale: கிரேக்க மூலத்தின் சுருக்கமான ஒப்பீடு, அந்த மேன்மையின் தன்மையை இவ்வசனத்தில் தீர்மானிக்காமல் விடுகிறது; ஆகவே அந்த இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘மேலானவரையே’ என்பது καὶ-யின் உச்சவலியையும் நபரைக் குறிக்கும் சூழலையும் இயல்பாகத் தருகிறது.
