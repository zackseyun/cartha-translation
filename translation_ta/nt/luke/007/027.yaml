base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: ta
  text: 'எழுதப்பட்டிருப்பவர் இவரே: “இதோ, நான் என் தூதரை[a] உமக்கு முன்பாக[b] அனுப்புகிறேன்; அவர் உமக்கு முன்னே உமது வழியை ஆயத்தப்படுத்துவார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதர்’ என்பதற்கு ‘வானதூதர்’ என்றும் பொருள் இருக்கலாம்; ஆனால் இங்கு அது மனிதத் தூதராகிய யோவானைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘உமது முகத்திற்கு முன்பாக’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: இவரைக் குறித்தே எழுதப்பட்டுள்ளது
  rationale: யோவானைச் சுட்டும் οὗτός என்பதன் வலியுறுத்தலையும், வேத மேற்கோளை அறிமுகப்படுத்தும் γέγραπται என்பதன் நிறைவேற்றப்பட்ட நிலைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: தீர்க்கதரிசன மேற்கோளின் கவன ஈர்ப்பையும் உயர்ந்த நடையையும் நவீன வாசகருக்குப் புரியும் வகையில் தக்கவைக்கிறது.
- source_word: ἀποστέλλω
  choice: அனுப்புகிறேன்
  rationale: நிகழ்காலத்தின் நேரடித் தன்மையையும் தீர்க்கதரிசன அறிவிப்பின் உயிரோட்டத்தையும் காக்கிறது.
- source_word: ἄγγελόν
  choice: தூதரை
  rationale: ἄγγελος என்பது தூதன் அல்லது வானதூதன் என்று பொருள்படலாம்; இங்கு மனிதத் தூதராகிய யோவானைக் குறிப்பதால் ‘தூதர்’ சூழலுக்கு மிகப் பொருத்தமானது.
- source_word: πρὸ προσώπου σου
  choice: உமது முகத்திற்கு முன்பாக
  rationale: கிரேக்கத்தின் நேரடியான முக உருவகத்தையும் பழைய ஏற்பாட்டு மேற்கோளின் வடிவத்தையும் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κατασκευάσει
  choice: ஆயத்தப்படுத்துவார்
  rationale: ஒரு வழியை முன்கூட்டியே தயாராக்கும் எதிர்காலச் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: τὴν ὁδόν σου
  choice: உமது வழியை
  rationale: ‘வழி’ என்பது இங்குள்ள தீர்க்கதரிசன மற்றும் உருவகப் பயன்பாடு இரண்டிற்கும் பொருத்தமான இயல்பான தமிழ் சொல்.
- source_word: ἔμπροσθέν σου
  choice: உமக்கு முன்னே
  rationale: இறுதி இடவியல் சொற்றொடரை இயல்பான தமிழில் தருவதோடு, முந்தைய ‘முகத்திற்கு முன்பாக’ என்ற உருவகத்திலிருந்து அதன் சொல்வடிவ வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: மல்கியா/யாத்திராகம மொழியை இயேசு யோவானுக்குப் பயன்படுத்துவதும், தூதர் இயேசுவுக்கு முன்பாக வழியை ஆயத்தப்படுத்துவதும்
  choice: ‘உமது முகத்திற்கு முன்பாக,’ ‘உமது வழியை,’ ‘உமக்கு முன்னே’ என்ற இரண்டாம் நபர் குறிப்புகளை விளக்க விரிவாக்கமின்றி தக்கவைத்தல்
  alternative: ‘ஆண்டவராகிய மேசியாவுக்கான வழியை’ என்று அடையாளத்தை வெளிப்படையாக விரித்துரைத்தல்
  rationale: கிரேக்க உரை இரண்டாம் நபர் சுட்டுப்பெயர்களை நேரடியாகப் பயன்படுத்துகிறது. அவற்றை அப்படியே காப்பது இயேசுவின் வேதப் பயன்பாட்டிலுள்ள இறையியல் வலிமையையும் பதற்றத்தையும் தக்கவைத்து, உரையில் இல்லாத விளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேத மேற்கோளுக்குரிய கண்ணியமான நடையைப் பேணியுள்ளோம். இயேசுவை நோக்கிய மேற்கோளில் மரியாதை ஒருமை வடிவங்களான ‘உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளன; மூல கிரேக்கத்தில் மரியாதை நிலை தனியே குறிக்கப்படவில்லை.
