source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: ta
  text: அவர் இயேசுவைப் பற்றிக் கேள்விப்பட்டபோது, தன் அடிமையைக்[a] காப்பாற்ற வருமாறு இயேசுவிடம் வேண்டிக்கொண்டு, யூதர்களின் மூப்பர்களை அவரிடம் அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளனை.” கிரேக்கச் சொல் doulos சூழலைப் பொறுத்து “அடிமை” அல்லது “பணியாளன்” என்று பொருள்படலாம். இங்கு அது குறிக்கும் கட்டுப்பட்ட சமூக நிலையை வெளிப்படுத்த “அடிமை” பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: கேள்விப்பட்டபோது
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த சூழலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புச் சொல்லை இயல்பான தமிழ்க் காலத் தொடராக வழங்குகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான இணைப்புச் சொல்; தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: இயேசுவைப் பற்றி
  rationale: περί உடன் வரும் மரபுவேற்றுமையின் இயல்பான பொருளான ‘பற்றி’ என்பதைத் தெளிவாகத் தருகிறது.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: அவரிடம் அனுப்பினார்
  rationale: யாரை அனுப்பினார் என்பது அடுத்த சொற்றொடரில் தெளிவாக இருப்பதால், மூலத்தைப் போலவே ‘அனுப்பினார்’ என்று வழங்கப்படுகிறது.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: யூதர்களின் மூப்பர்களை
  rationale: வயதில் மூத்தவர்களை மட்டும் அல்லாமல் சமூகத்தில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் πρεσβύτεροι என்பதற்கு ‘மூப்பர்கள்’ பொருத்தமானது; மரபுவேற்றுமை அமைப்பும் காக்கப்படுகிறது.
- source_word: ἐρωτῶν αὐτὸν
  choice: இயேசுவிடம் வேண்டிக்கொண்டு
  rationale: இச்சூழலில் ἐρωτάω மரியாதையான கோரிக்கையைச் சுட்டுகிறது. ஒருமை எழுவாயுடன் உள்ள பங்கேற்புச் சொல்லின் அமைப்பை ‘வேண்டிக்கொண்டு’ காக்கிறது; சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க ‘இயேசு’ மீண்டும் குறிப்பிடப்படுகிறது.
- source_word: ὅπως ἐλθὼν
  choice: வருமாறு
  rationale: கோரிக்கையின் நோக்கம் அல்லது உள்ளடக்கத்தை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: διασώσῃ
  choice: காப்பாற்ற
  rationale: கடுமையாக நோயுற்ற அடிமையை உயிராபத்திலிருந்து மீட்பதே சூழல். ‘குணமாக்க’ என்று பொருளை உடல் நலத்திற்கு மட்டும் குறுக்காமல், διασῴζω என்பதன் விரிவான மீட்பு உணர்வைக் காக்கிறது.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: தன் அடிமையை
  rationale: இங்கு δοῦλος நூற்றுக்குத் தலைவனின் அதிகாரத்துக்குட்பட்ட, உரிமை நிலை கொண்ட வீட்டடிமையைக் குறிக்கிறது. ‘அடிமை’ அந்தச் சமூக மற்றும் கட்டுப்பட்ட நிலையைக் தெளிவாகக் காக்கிறது; ‘பணியாளன்’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வீட்டுச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளன்
  rationale: இப்பகுதியில் சொல்லின் சமூகச் சட்டநிலை மறைந்துவிடாதபடி ‘அடிமை’ தேர்ந்தெடுக்கப்படுகிறது. அதே நேரத்தில், பணிச் செயல்பாட்டை முன்னிறுத்தும் பாரம்பரிய மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘யூதர்களின் மூப்பர்கள்’ என்பது சமூகத் தலைமைப் பங்கைத் தெளிவாக்குகிறது. சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க இரண்டாவது இடத்தில் ‘இயேசு’ என்ற பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
