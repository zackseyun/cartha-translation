id: LUK.7.31
reference: Luke 7:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ta
  text: “அப்படியானால், இந்தத் தலைமுறையின் மனிதர்களை நான் எதற்கு ஒப்பிடுவேன்? அவர்கள் எதைப் போன்றவர்கள்?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: மனிதர்களை
  rationale: ἄνθρωποι என்பது இங்கு ஒரு பாலினத்தை மட்டும் குறிக்காமல், இந்தத் தலைமுறையைச் சேர்ந்த மக்களைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையின்
  rationale: γενεά என்பதன் இயல்பான பொருளான சமகாலத் தலைமுறையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁμοιώσω / ὅμοιοι
  choice: ஒப்பிடுவேன் / எதைப் போன்றவர்கள்
  rationale: ஒரே வேரிலிருந்து வரும் கிரேக்கச் சொற்களின் ஒப்புமைத் தொடர்பைத் தமிழிலும் தெளிவாகப் பேணுகிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவு அல்லது தொடர்ச்சியை உரையாடலுக்கேற்ற நவீன தமிழில் காட்டுகிறது.
theological_decisions:
- issue: τοὺς ἀνθρώπους என்பதன் பாலினப் பரப்பு
  choice: மனிதர்களை
  alternative: ஆண்களை
  rationale: சூழலில் இந்தத் தலைமுறையின் மக்களையே பொதுவாக இயேசு குறிப்பிடுகிறார்; கிரேக்க ἄνθρωπος இங்கு ஆண்களை மட்டும் குறிக்க வேண்டியதில்லை. எனவே தேவையற்ற பாலினக் கட்டுப்பாட்டைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கேள்விகளின் மீளுரைத்தல் மற்றும் வாக்கியத்தின் உரையாடல் வலிமை காக்கப்பட்டுள்ளன. இயேசுவின் நேரடி உரை என்பதால் மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன.
