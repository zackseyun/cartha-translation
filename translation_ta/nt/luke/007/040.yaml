translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கும் சீமோனுக்கும் மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; நேரடி அழைப்பில் இயல்பான ‘உன்னிடம்’ தக்கவைக்கப்பட்டுள்ளது.
