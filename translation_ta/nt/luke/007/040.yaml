  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: ta
  text: இயேசு அவருக்குப் பதிலளித்து, “சீமோனே, உன்னிடம் நான் சொல்ல ஒன்று இருக்கிறது” என்றார். அதற்கு அவர், “ஆசிரியரே[a], சொல்லுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குருவே, பேசுங்கள்.” கிரேக்கத்தில் Διδάσκαλε என்பது நேரடியாக “ஆசிரியரே”; εἰπέ என்பது “சொல்” அல்லது “பேசு” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: அதற்கு
  rationale: ἀποκρίνομαι என்ற வினையெச்சம் இங்கு பேச்சுக்கு மறுமொழியாக வரும் வழக்கமான கதைநடை அமைப்பாக உள்ளது. தமிழில் ‘அதற்கு’ என்பது அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; தேவையற்ற ‘பதிலளித்து’ என்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: εἶπεν πρὸς αὐτόν
  choice: இயேசு அவரிடம் … என்றார்
  rationale: πρὸς αὐτόν என்பதன் திசைநோக்கிய பொருளை ‘அவரிடம்’ தெளிவாகக் காட்டுகிறது; தமிழ் உரையாடல் நடையில் ‘என்றார்’ இயல்பானது.
- source_word: Σίμων
  choice: சீமோனே
  rationale: பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; அழைப்புவேற்றுமையை ‘-ஏ’ காட்டுகிறது.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: உன்னிடம் நான் ஒன்று சொல்ல வேண்டும்
  rationale: கிரேக்க மொழிவழக்கின் நோக்கம்—சீமோனிடம் சொல்ல வேண்டிய ஒன்று இயேசுவுக்கு இருப்பது—இயல்பான நவீனத் தமிழில் வெளிப்படுகிறது. σοί என்பதும் ‘உன்னிடம்’ எனத் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: Διδάσκαλε
  choice: ஆசிரியரே
  rationale: διδάσκαλος என்பதன் நேரடியான பொருள் ‘கற்பிப்பவர்/ஆசிரியர்.’ ‘ஆசிரியரே’ என்பது மரியாதையையும் அழைப்பையும் இயல்பாகக் காட்டி, ‘எஜமானர்’ என்ற கூடுதல் அதிகார நுணுக்கத்தைச் சேர்க்காது.
- source_word: εἰπέ
  choice: சொல்லுங்கள்
  rationale: தொடர்ந்து பேசுமாறு இயேசுவை அழைக்கும் ஒருமை கட்டளை. தமிழில் மரியாதைமிக்க ‘சொல்லுங்கள்’ சூழலுக்கு இயல்பானது; கிரேக்கத்தில் மறைந்துள்ள சொல்லப்பட வேண்டிய காரியத்தைத் தேவையின்றி விரிவாக்கவில்லை.
- source_word: φησίν
  choice: என்றார்
  rationale: கிரேக்கத்தில் இது வரலாற்று நிகழ்காலமாக இருந்தாலும், தமிழ்க் கதைநடையில் இறந்தகால ‘என்றார்’ வாசிப்புக்கு இயல்பானது.
