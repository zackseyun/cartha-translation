id: LUK.7.8
reference: Luke 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ta
  text: ஏனெனில், நானும் அதிகாரத்துக்குக் கீழ்ப்பட்ட ஒரு மனிதன்; எனக்குக் கீழ் படைவீரர்கள் இருக்கிறார்கள். நான் ஒருவனிடம், ‘போ’ என்று சொல்கிறேன்; அவன் போகிறான். மற்றொருவனிடம், ‘வா’ என்று சொல்கிறேன்; அவன் வருகிறான். என் அடிமையிடம்[a], ‘இதைச் செய்’ என்று சொல்கிறேன்; அவன் செய்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் பணியாளிடம்.’ கிரேக்கச் சொல் δοῦλος (doulos) உரிமைக்குட்பட்ட அல்லது கட்டுண்ட கீழ்நிலையில் இருப்பவரைக் குறிக்கிறது; சில சூழல்களில் அதை பொதுவாக ‘பணியாளர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: நூற்றுக்குத் தலைவன் முன்பு கூறியதற்கான காரணத்தை இச்சொற்றொடர் அறிமுகப்படுத்துகிறது; தமிழில் ‘ஏனெனில்’ அந்த விளக்க வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: நானும்கூட ... ஒரு மனிதன்
  rationale: வெளிப்படையாக வரும் ἐγώ-வின் அழுத்தத்தையும் καὶ-யின் ஒப்பீட்டுப் பொருளையும் ‘நானும்கூட’ காட்டுகிறது; ἄνθρωπος இங்கு பேசுகிற ஆண் தன்னை ஒரு மனிதனாகக் குறிப்பிடுவதைக் குறிக்கிறது.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: அதிகாரத்துக்குக் கீழ் நிறுத்தப்பட்டிருக்கும்
  rationale: τασσόμενος என்பதன் செயல்படுபொருள் நிலையும், அதிகாரப் படிநிலையில் ஒருவருக்குக் கீழ் அமைக்கப்பட்டிருக்கும் கருத்தும் காக்கப்படுகின்றன.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: எனக்குக் கீழ் படைவீரர்கள் இருக்கிறார்கள்
  rationale: நூற்றுக்குத் தலைவனுக்குக் கீழ்ப்பட்ட படைவீரர்கள் உள்ள அதிகாரப் படிநிலையைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: λέγω τούτῳ
  choice: நான் ஒருவனிடம் ... என்று சொன்னால்
  rationale: τούτῳ குறிக்கும் குறிப்பிட்ட ஒருவரை ‘ஒருவனிடம்’ இயல்பாக வெளிப்படுத்துகிறது; நிபந்தனை வடிவம் தொடர்ந்து நிகழும் கட்டளை–கீழ்ப்படிதல் உறவைத் தமிழில் தெளிவாக்குகிறது.
- source_word: Πορεύθητι ... πορεύεται
  choice: ‘போ’ ... அவன் போகிறான்
  rationale: கட்டளைக்கும் அதன் உடனான நிறைவேற்றத்திற்கும் இடையிலான இணை அமைப்பைக் காக்கிறது.
- source_word: Ἔρχου ... ἔρχεται
  choice: ‘வா’ ... அவன் வருகிறான்
  rationale: மூலத்தின் சுருக்கமான கட்டளை–மறுமொழி இணைப்பை இயல்பாகக் காக்கிறது.
- source_word: τῷ δούλῳ μου
  choice: என் அடிமையிடம்
  rationale: δοῦλος குறிக்கும் உரிமைக்குட்பட்ட அல்லது கட்டுண்ட கீழ்நிலையை ‘அடிமை’ தெளிவாகக் காட்டுகிறது; இவ்வசனத்தின் அதிகாரப் படிநிலை எடுத்துக்காட்டில் அந்த நிலை முக்கியமானது.
- source_word: Ποίησον τοῦτο ... ποιεῖ
  choice: ‘இதைச் செய்’ ... அவன் செய்கிறான்
  rationale: மூலத்தின் நேரடியான கட்டளையையும் அதற்கான கீழ்ப்படிதலையும் இணையான வடிவில் காக்கிறது.
theological_decisions:
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாள்
  rationale: இவ்வசனத்தில் அதிகாரத்துக்குக் கீழ்ப்பட்ட நிலையே ஒப்புமையின் மையமாக இருப்பதால் ‘அடிமை’ சமூக நிலையைக் கூடுதல் துல்லியத்துடன் காட்டுகிறது. ஆயினும், சில சூழல்களில் δοῦλος வீட்டுப் பணியாளரையும் பொதுவாகக் குறிக்கக்கூடும் என்பதால் ‘பணியாள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: நூற்றுக்குத் தலைவனின் அதிகார உறவு
  choice: அவர் அதிகாரத்துக்குக் கீழ் நிறுத்தப்பட்டவராகவும், தமக்குக் கீழ் படைவீரர்களைக் கொண்டவராகவும் கூறப்படுகிறார்
  alternative: அவர் வெறுமனே அதிகாரம் உடையவர் என்று சுருக்குதல்
  rationale: மூலம் அவரது அதிகாரம் மேலிருந்து அமைக்கப்பட்ட அதிகாரப் படிநிலைக்குள் செயல்படுவதாகக் காட்டுகிறது. இதைச் சுருக்காமல் வைத்திருப்பது இயேசுவின் அதிகாரத்தோடு செய்யப்படும் ஒப்புமையின் நுட்பத்தையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளை–நிறைவேற்றம் என்ற மூலத்தின் இணை அமைப்பு மீண்டும் வரும் ஒரே மாதிரியான வாக்கியங்களால் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு பொருத்தமான ‘அடிமை’ என்ற சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
