base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: ta
  text: ஏனெனில், அவர் நம் மக்களை நேசிக்கிறார்; நமக்காக அந்த ஜெபக்கூடத்தை அவரே கட்டினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்காக அந்த ஜெபக்கூடத்தைக் கட்டுவித்தார்.” கிரேக்க மூலத்தில் “கட்டினார்” என்று மட்டுமே உள்ளது; அவர் தாமே கட்டியதையோ, ஆதரவளித்தோ செலவளித்தோ கட்டுவித்ததையோ இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: நேசிக்கிறார்
  rationale: ἀγαπάω என்பதன் நேரடியான, வலிமையான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இதை வெறும் அக்கறையாக மெலிதாக்கவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை மூப்பர்கள் இங்கு கூறுவதைக் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ ἔθνος ἡμῶν
  choice: நம் மக்களை
  rationale: இங்கு ἔθνος என்பது பேசுகிற யூதர்கள் தங்களுடைய இன-சமூக மக்களைக் கூட்டாகக் குறிப்பிடுகிறது. தமிழில் ‘நம் மக்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘நம் தேசம்’ நிலப்பரப்பை முன்னிறுத்தக்கூடும்.
- source_word: τὴν συναγωγήν
  choice: அந்த ஜெபக்கூடத்தை
  rationale: சூழலில் பேசுபவர்களுக்கும் கேட்பவர்களுக்கும் தெரிந்த உள்ளூர் யூத ஜெபக்கூடத்தைச் சுட்டுகிறது. மூலத்தில் தனிப்பட்ட உடைமைப்பெயர் இல்லாததால் ‘நமது’ என்று சேர்க்கப்படவில்லை.
- source_word: αὐτὸς
  choice: அவரே
  rationale: எழுவாய்க்குக் கொடுக்கப்பட்டுள்ள மூலமொழியின் அழுத்தத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ᾠκοδόμησεν
  choice: கட்டினார்
  rationale: இறந்தகாலச் செயலை நேரடியாகத் தருகிறது. அவர் தாமே கட்டுமானத்தில் ஈடுபட்டாரா அல்லது செலவளித்து கட்டுவித்தாரா என்பதை மூலத்தின் எளிய வினை தீர்மானிக்கவில்லை.
- source_word: ἡμῖν
  choice: நமக்காக
  rationale: சமூகத்தின் நன்மைக்காகக் கட்டப்பட்டதைக் காட்டும் பயன்நிலை வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
