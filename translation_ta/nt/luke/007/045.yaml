source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: ta
  text: நீ எனக்கு முத்தம் கொடுக்கவில்லை[a]. ஆனால் இவளோ, நான் உள்ளே வந்ததுமுதல் என் கால்களை முத்தமிடுவதை நிறுத்தவே இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வரவேற்பு முத்தம் கொடுக்கவில்லை.’ முத்தம் கொடுப்பது அக்காலத்தில் வழக்கமான விருந்தோம்பல் செயலாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: 'இந்த வினைச்சொல் அன்புடன் அல்லது மீண்டும் மீண்டும் முத்தமிடுவதைக் குறிக்கலாம்: ‘என் கால்களை முத்தங்களால் மூடுவதை நிறுத்தவே இல்லை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά μοι οὐκ ἔδωκας
  choice: நீ எனக்கு முத்தம் கொடுக்கவில்லை
  rationale: ‘முத்தம் கொடு’ என்பது கிரேக்கத்தில் உள்ள ‘முத்தம் கொடுத்தல்’ என்ற இயல்பான சொல்லமைப்பைத் தமிழில் தெளிவாகத் தருகிறது. இது வரவேற்பு முத்தம் என்பதை மூலவாக்கியம் வெளிப்படையாகச் சேர்க்காததால், அந்தப் பண்பாட்டு தகவல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: αὕτη δὲ
  choice: ஆனால் இவளோ
  rationale: சீமோனின் செயலின்மைக்கும் அந்தப் பெண்ணின் செயலுக்கும் இடையிலான வலுவான மாறுபாட்டை ‘ஆனால்’ மற்றும் ‘-ஓ’ விகுதி இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: நான் உள்ளே வந்ததுமுதல்
  rationale: இந்தத் தொடர் காலப் பொருளில் ‘நான் நுழைந்த நேரத்திலிருந்து’ என்பதைக் குறிக்கிறது. தேர்ந்த வடிவம் நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὐ διέλιπεν
  choice: நிறுத்தவே இல்லை
  rationale: διαλείπω என்பதன் ‘நிறுத்து/விட்டுவிடு’ என்ற பொருளையும், பேச்சுத் தருணம்வரை தொடர்ந்த செயல் என்ற வலியுறுத்தலையும் இது தருகிறது.
- source_word: καταφιλοῦσά μου τοὺς πόδας
  choice: என் கால்களை முத்தமிடுவதை
  rationale: ‘என் கால்கள்’ என்பது மூலத்தின் பன்மையைப் பாதுகாக்கிறது. καταφιλέω குறிக்கும் அன்பான அல்லது மீண்டும் மீண்டும் முத்தமிடும் நுணுக்கம், ‘நிறுத்தவே இல்லை’ என்ற தொடருடன் முதன்மை உரையில் ஓரளவு வெளிப்படுகிறது; அதன் முழு வலிமை அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வரவேற்பு முத்தத்தின் விருந்தோம்பல் சார்ந்த பண்பாட்டு பொருள்
  choice: முதன்மை உரையில் செயலை மட்டும் நேரடியாகக் கூறி, பண்பாட்டு விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘வரவேற்பு முத்தம் கொடுக்கவில்லை’ என்று முதன்மை உரையிலேயே விரிவாக்குதல்
  rationale: இங்கு விருந்தோம்பலில் சீமோன் தவறியதற்கும் பெண் காட்டிய அன்புக்கும் இடையே மாறுபாடு உள்ளது. ஆயினும் கிரேக்க மூலத்தில் ‘வரவேற்பு’ என்பது வெளிப்படையாக இல்லை; எனவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அடிக்குறிப்பில் வைப்பது மூலத்தின் அளவையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையும் கண்ணியமும் கொண்ட நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இவளோ’ என்ற வடிவம் சூழலில் உள்ள மாறுபாட்டை இயல்பாக வலியுறுத்துகிறது; பழமையான அல்லது தேவையற்ற சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
