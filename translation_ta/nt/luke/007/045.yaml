  source_fidelity: மூல கிரேக்கத்தின் எதிர்மறை விருந்தோம்பல் செயல் (φίλημά μοι οὐκ ἔδωκας), பெண்ணுடனான மாறுபாடு (αὕτη δέ), இயேசு உள்ளே வந்ததிலிருந்து தொடரும் செயல் (ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν), மற்றும் ‘என் கால்கள்’ என்ற பன்மை ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘நிறுத்தவே இல்லை’ என்பது தொடர்ச்சியையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
