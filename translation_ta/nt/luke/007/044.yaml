source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: ta
  text: அவர் அந்தப் பெண்ணின் பக்கம் திரும்பி, சீமோனிடம், “இந்தப் பெண்ணைப் பார்க்கிறாயா? நான் உன் வீட்டிற்குள் வந்தேன்; நீ என் கால்களுக்குத் தண்ணீர் கொடுக்கவில்லை.[a] ஆனால் இவள் தன் கண்ணீரால் என் கால்களை நனைத்து, தன் தலைமுடியால் அவற்றைத் துடைத்தாள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “என் கால்களின்மேல் தண்ணீர் கொடுக்கவில்லை.” கால்களைக் கழுவுவதற்குத் தண்ணீர் அளிக்கும் வழக்கமே இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: அந்தப் பெண்ணின் பக்கம் திரும்பி
  rationale: இயேசு உடலளவில் பெண்ணை நோக்கித் திரும்பியதை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τῷ Σίμωνι ἔφη
  choice: சீமோனிடம் ... என்றார்
  rationale: தமிழ் நேர்கூற்று அமைப்புக்கு ஏற்றவாறு உரையாடுபவரை முன்பும் பேச்சு வினையை முடிவிலும் அமைக்கிறது.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: இந்தப் பெண்ணைப் பார்க்கிறாயா?
  rationale: Βλέπεις என்பதன் நேரடியான ‘பார்க்கிறாயா’ என்ற பொருளையும், ταύτην என்பதன் சுட்டும் வலிமையையும் காக்கிறது.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: நான் உன் வீட்டிற்குள் வந்தேன்
  rationale: εἰσέρχομαι என்பதன் உள்ளே வருதல் என்ற கருத்தை நவீன இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: நீ என் கால்களுக்குத் தண்ணீர் கொடுக்கவில்லை
  rationale: கிரேக்கம் வெளிப்படையாகக் கூறும் ‘தண்ணீர் கொடுத்தல்’ என்பதைக் காக்கிறது; கழுவுதல் என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: αὕτη δὲ
  choice: ஆனால் இவள்
  rationale: சீமோனின் செயலின்மைக்கும் பெண்ணின் செயலுக்கும் இடையிலான தெளிவான முரண்பாட்டை δέ-க்கு ஏற்றவாறு காட்டுகிறது.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: தன் கண்ணீரால் என் கால்களை நனைத்து
  rationale: கருவிப்பொருள் வேற்றுமையையும் βρέχω என்பதன் ‘நனைத்தல்’ பொருளையும் துல்லியமாகக் காட்டுகிறது.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: தன் தலைமுடியால் அவற்றைத் துடைத்தாள்
  rationale: θρίξ-ஐ சூழலுக்கேற்ற ‘தலைமுடி’ என்றும், ἐκμάσσω-வை இயல்பான ‘துடைத்தாள்’ என்றும் மொழிபெயர்க்கிறது; ‘அவற்றை’ என்பது கால்களைக் குறிக்கிறது.
