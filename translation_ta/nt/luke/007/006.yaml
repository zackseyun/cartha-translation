id: LUK.7.6
reference: Luke 7:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: ta
  text: இயேசு அவர்களுடன் சென்றார். அவர் அந்த வீட்டிற்கு வெகு தொலைவில் இல்லாதபோது, நூற்றுவர் தலைவர் இயேசுவிடம் நண்பர்களை அனுப்பி, “ஆண்டவரே[a], நீர் சிரமப்பட வேண்டாம். ஏனெனில், நீர் என் கூரையின் கீழ் உள்ளே வருவதற்கு நான் தகுதியுள்ளவன் அல்ல[b]” என்று சொல்லச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கத்தில் “ஆண்டவரே” (κύριε). இது மரியாதையான அழைப்பாகவும், இயேசுவின் அதிகாரத்தை ஏற்றுக்கொள்வதைக் குறிப்பதாகவும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஏற்றவன் அல்ல” / “போதுமானவன் அல்ல.” கிரேக்கச் சொல் தகுதி அல்லது போதுமான நிலையைக் குறிக்கலாம்; இங்கு அது இயேசுவுக்கு முன்பாக நூற்றுவர் தலைவர் காட்டிய தாழ்மையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: சென்றார்
  rationale: இறந்தகாலத் தொடர்நிலையைக் குறிக்கும் வினை வடிவம் இயேசுவின் பயணத்தைச் சுட்டுகிறது; நவீன தமிழில் இயல்பான கதைநடைச் சொல்லாக ‘சென்றார்’ அமைகிறது.
- source_word: σὺν αὐτοῖς
  choice: அவர்களுடன்
  rationale: உடன்செல்லும் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: அவர் வீட்டிலிருந்து வெகு தொலைவில் இல்லாதபோதே
  rationale: கிரேக்கத்தின் காலச்சூழலையும் ‘வெகு தொலைவில் இல்லை’ என்ற எதிர்மறை அமைப்பையும் பாதுகாக்கிறது.
- source_word: ἔπεμψεν φίλους
  choice: தன் நண்பர்களை ... அனுப்பி
  rationale: φίλους என்பதன் இயல்பான பன்மைப் பொருளைத் தருகிறது; உரிமைச் சூழலைத் தெளிவாக்க ‘தன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁ ἑκατοντάρχης
  choice: நூற்றுவர் தலைவர்
  rationale: ரோமப் படையின் நூறு வீரர்களுக்குப் பொறுப்பான பதவியைத் தமிழில் தெளிவாகக் குறிக்கும் வழக்கமான வேதாகமச் சொல்.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பையும் இயேசுவின் அதிகாரத்தை ஏற்றுக்கொள்ளும் சாத்தியத்தையும் ஒருங்கே திறந்தவையாக வைத்திருக்கிறது.
- source_word: μὴ σκύλλου
  choice: நீர் சிரமப்பட வேண்டாம்
  rationale: ஒருவரைத் தொந்தரவு அல்லது சிரமத்திற்கு உட்படுத்த வேண்டாமென்ற மரியாதையான வேண்டுகோளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἱκανός εἰμι
  choice: நான் தகுதியுள்ளவன் அல்ல
  rationale: ἱκανός குறிக்கக்கூடிய தகுதி, போதுமான நிலை, மதிப்பு ஆகிய நுணுக்கங்களில் இச்சூழலின் தாழ்மையைப் பாதுகாக்கிறது.
- source_word: ἵνα ... εἰσέλθῃς
  choice: நீர் ... வருவதற்கு
  rationale: தான் எதற்குத் தகுதியற்றவன் என்று நூற்றுவர் தலைவர் கூறும் உட்பொருளை இயல்பான தமிழ் நோக்குவினை அமைப்பில் தருகிறது.
- source_word: ὑπὸ τὴν στέγην μου
  choice: என் கூரையின் கீழ்
  rationale: வீட்டிற்குள் வருதல் என்ற பொருளோடு மூலத்தின் உயிரோட்டமான ‘கூரையின் கீழ்’ உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இங்கு இது மரியாதை அழைப்பாக இருக்கலாம்; அதேவேளை இயேசுவின் அதிகாரத்தை ஆழமாக ஏற்றுக்கொள்வதையும் குறிக்கலாம். ‘ஆண்டவரே’ இரு சாத்தியங்களையும் முற்றிலும் மூடிவிடாமல் பாதுகாக்கிறது.
- issue: ἱκανός என்பதில் தகுதியா, போதுமான நிலையா
  choice: தகுதியுள்ளவன் அல்ல
  alternative: போதுமானவன் அல்ல / ஏற்றவன் அல்ல
  rationale: நூற்றுவர் தலைவரின் தாழ்மையைச் சூழல் வலியுறுத்துவதால் ‘தகுதியுள்ளவன் அல்ல’ இயல்பாக அமைகிறது; எனினும் மூலச்சொல்லின் திறமை அல்லது போதுமான நிலை என்ற பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ என்பது நூற்றுவர் தலைவர் இயேசுவிடம் காட்டும் மரியாதையை வெளிப்படுத்துகிறது. மூலத்தின் ‘கூரையின் கீழ்’ என்ற உருவகம் மாற்றப்படாமல் வைக்கப்பட்டுள்ளது; ‘வீட்டிலிருந்து வெகு தொலைவில் இல்லாதபோதே’ என்பது οὐ μακράν என்ற அமைப்பின் உண்மையான எதிர்மறை வடிவத்தைப் பாதுகாக்கிறது.
