translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க மூலத்தில் எழுவாய் மறைமுகமாக இருந்தாலும், முந்தைய சூழலில் இயேசுவைக் குறிப்பதால் ‘அவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்வினை வடிவம் உடன்சென்றுகொண்டிருந்த செயலைப் பாதுகாக்கிறது.
