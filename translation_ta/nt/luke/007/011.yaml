reference: Luke 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: ta
  text: மறுநாள்[a] அவர் நாயீன் என்னும் ஊருக்குச் சென்றார். அவருடைய சீடர்களும் ஒரு பெரிய கூட்டமும் அவருடன் சென்றுகொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘மறுநாள்’ என்பதற்குப் பதிலாக ‘சிறிது காலத்திற்குப் பின்பு’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல், நிகழ்வை அறிமுகப்படுத்தும் வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது லூக்கா அடிக்கடி பயன்படுத்தும் கதைத் தொடக்க மரபுத்தொடர். தமிழில் ‘நடந்ததாவது’ என்று சொல்வது இங்கு செயற்கையாக ஒலிக்கும்; நேரடியான கதைநடை அதன் செயல்பாட்டை இயல்பாக நிறைவேற்றுகிறது.
- source_word: ἐν τῷ ἑξῆς
  choice: அடுத்த நாளில்
  rationale: இப்பாடத்தின் சூழலில் அடுத்த நாளைக் குறிப்பதாகப் புரிந்துகொள்வது இயல்பானது. வேறுபட்ட கையெழுத்துப் பிரதிப் பாடம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐπορεύθη
  choice: சென்றார்
  rationale: πορεύομαι என்பதன் வழக்கமான இயக்கப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰς πόλιν καλουμένην Ναΐν
  choice: நாயீன் என்னும் ஊருக்கு
  rationale: πόλις என்பது நகரத்தையோ ஊரையோ குறிக்கலாம்; சிறிய குடியிருப்பான நாயீனுக்கு ‘ஊர்’ இயல்பானது. καλουμένην என்பதற்கு ‘என்னும்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: συνεπορεύοντο αὐτῷ
  choice: அவருடன் சென்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்வினையின் நீடித்த உடன்செல்லும் இயக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: μαθηταί என்பதற்கான தெளிவான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: ὄχλος πολύς
  choice: பெருந்திரளான மக்கள்
  rationale: கூட்டத்தின் பெருமளவை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் ‘கூட்டம்’ என்பதைவிட மக்கள் என்பதையும் வெளிப்படையாக்குகிறது.
