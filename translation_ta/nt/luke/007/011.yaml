revisions:
- from: அடுத்த நாளில்[a] அவர் நாயீன் என்னும் ஊருக்குச் சென்றார். அவருடைய சீடர்களும் பெருந்திரளான மக்களும் அவருடன் சென்றுகொண்டிருந்தார்கள்.
  to: மறுநாள்[a] அவர் நாயீன் என்னும் ஊருக்குச் சென்றார். அவருடைய சீடர்களும் ஒரு பெரிய கூட்டமும் அவருடன் சென்றுகொண்டிருந்தனர்.
  rationale: The revision uses idiomatic modern Tamil for ‘on the next day’ and renders the singular collective ‘a large crowd’ directly as ‘ஒரு பெரிய கூட்டம்.’ The durative sense of συνεπορεύοντο is retained in ‘சென்றுகொண்டிருந்தனர்,’ and the textual-variant footnote remains correctly anchored.
