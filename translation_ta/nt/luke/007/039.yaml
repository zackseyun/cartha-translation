source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: ta
  text: அவரை விருந்துக்கு அழைத்திருந்த பரிசேயன் இதைக் கண்டபோது, தனக்குள், “இவர் ஒரு தீர்க்கதரிசியாக இருந்தால், இவரைத் தொட்டுக்கொண்டிருக்கிற இந்தப் பெண் யார், எப்படிப்பட்டவள்[a] என்பதை அறிந்திருப்பார்; ஏனெனில், அவள் ஒரு பாவி[b]” என்று சொல்லிக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “இந்தப் பெண் யார், எத்தகையவள்.” கிரேக்கச் சொற்றொடர் அவளுடைய அடையாளத்தையும் தன்மை அல்லது சமூகப் பெயரையும் வலியுறுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு விதமாக: “அவள் ஒரு பாவி என்பதை அறிந்திருப்பார்.” இந்த உட்பிரிவு அவர் அறிந்திருப்பதன் உள்ளடக்கமாகவோ, அவளைப் பற்றிய மதிப்பீட்டிற்கான காரணமாகவோ புரிந்துகொள்ளப்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: இதைக் கண்டபோது
  rationale: இறந்தகாலப் பெயரெச்சத்தின் காலச்சூழலை இயல்பான தமிழில் ‘கண்டபோது’ எனக் கொடுக்கிறது; ‘இதை’ என்பது முந்தைய நிகழ்வைக் குறிக்கச் சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது. δέ-க்கு தனி உரையாடல் இணைப்புச் சொல் தேவையில்லை.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: அவரை விருந்துக்கு அழைத்திருந்த பரிசேயன்
  rationale: உணவு விருந்தின் சூழலில் καλέω என்பது ‘அழைத்தல்’ என்பதையும், அது முன்னரே நடந்ததை ‘அழைத்திருந்த’ என்பதும் தெளிவாக்குகின்றன.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: தனக்குள் ... என்று சொல்லிக்கொண்டான்
  rationale: உள்ளார்ந்த பேச்சைக் குறிக்கும் கிரேக்க வழக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது; εἶπεν மற்றும் λέγων இரண்டையும் செயற்கையாக இரட்டிக்கவில்லை.
- source_word: Οὗτος
  choice: இவர்
  rationale: இயேசுவைக் குறிக்கும் சுட்டுப்பெயரை தமிழின் இயல்பான மனிதர் சுட்டும் வடிவில் தருகிறது. கிரேக்கத்தில் இருக்கக்கூடிய விலகிய அல்லது இகழ்ச்சித் தொனி சூழலால் உணரப்படுகிறது; தமிழில் தேவையற்ற அவமரியாதை சேர்க்கப்படவில்லை.
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: ஒரு தீர்க்கதரிசியாக இருந்தால் ... அறிந்திருப்பார்
  rationale: εἰ + இறந்தகால வினை மற்றும் ἄν உடனான இறந்தகால வினை சேர்ந்து வெளிப்படுத்தும் சந்தேகத்துடனான எதிர்நிலை நிபந்தனையை தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τίς καὶ ποταπὴ
  choice: யார், எப்படிப்பட்டவள்
  rationale: பெண்ணின் அடையாளம் மட்டுமல்லாமல் அவளுடைய தன்மை அல்லது சமூகப் பெயர் குறித்த மதிப்பீடும் வலியுறுத்தப்படுவதை இரு கேள்விச் சொற்களாலும் பாதுகாக்கிறது.
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: தன்னைத் தொட்டுக்கொண்டிருக்கிற இந்தப் பெண்
  rationale: நிகழ்ந்துகொண்டிருக்கும் தொடுதலை நிகழ்காலத் தொடர்ச்சியுடன் காட்டுகிறது; αὐτοῦ-ஐ மேற்கோளின் பேச்சாளரின் நோக்கிலிருந்து இயல்பாக ‘தன்னை’ என வழங்குகிறது.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: ஏனெனில், அவள் ஒரு பாவி
  rationale: ὅτι-யின் காரணப் பொருளை முதன்மை உரையில் வெளிப்படுத்துகிறது; அது அறிய வேண்டிய செய்தியின் உள்ளடக்கமாகவும் புரியக்கூடிய வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசு தீர்க்கதரிசியா என்பதைக் குறித்த நிபந்தனையின் வலிமை
  choice: “இவர் ஒரு தீர்க்கதரிசியாக இருந்தால் ... அறிந்திருப்பார்” என்ற எதிர்நிலை நிபந்தனை
  alternative: “இவர் ஒரு தீர்க்கதரிசி என்றால் ... அறிவார்” என்ற நடுநிலை நிபந்தனை
  rationale: εἰ ἦν ... ἐγίνωσκεν ἂν என்பது பரிசேயனின் சந்தேகத்தையும் அவர் கருதும் எதிர்நிலையையும் இயல்பாகக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு அவரது தீர்ப்பை உண்மை என ஏற்காமல் கதையின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ὅτι உட்பிரிவின் தொடர்பு
  choice: அவள் பாவி என்பதைக் காரணமாகக் காட்டும் வாசிப்பு
  alternative: அவர் அறிந்திருப்பதன் உள்ளடக்கமாக ‘அவள் ஒரு பாவி என்பதை’ என வாசித்தல்
  rationale: சூழலில் காரணப் பொருள் இயல்பாக இருந்தாலும், கிரேக்கத்தின் இலக்கணத் தொடர்பு இரு விதமாகக் கேட்கக்கூடும்; மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’, ‘பரிசேயன்’, ‘பாவி’ ஆகியவை பொதுவாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன. உள்ளார்ந்த பேச்சின் இயல்பும் பரிசேயனின் சந்தேகத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
