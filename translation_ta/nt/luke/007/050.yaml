id: LUK.7.50
reference: Luke 7:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὴν γυναῖκα· Ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: ta
  text: அவர் அந்தப் பெண்ணிடம், “உன் விசுவாசம் உன்னை மீட்டிருக்கிறது[a]; சமாதானத்துடன் போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை நலமாக்கியிருக்கிறது.” கிரேக்க வினைச்சொல் ‘மீட்பது,’ ‘காப்பாற்றுவது,’ அல்லது ‘நலமாக்குவது’ என்று பொருள்படலாம்; இங்கு சூழல் பாவமன்னிப்பையும் மீட்பையும் வலியுறுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς τὴν γυναῖκα
  choice: அவர் அந்தப் பெண்ணிடம் … என்றார்
  rationale: δέ இங்கு எளிய கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனியே இணைப்புச் சொல் சேர்க்காமலேயே இயல்பாகத் தொடர்கிறது. γυνή சூழலில் ‘பெண்’ என்பதையே குறிக்கிறது.
- source_word: Ἡ πίστις σου
  choice: உன் விசுவாசம்
  rationale: πίστις இங்கு இயேசுவின்மீது அவள் வைத்த நம்பிக்கையைக் குறிக்கிறது. ‘விசுவாசம்’ என்பது வேதாகமச் சூழலுக்கு ஏற்ற, நவீன வாசகர்களுக்குப் பரிச்சயமான சொல்.
- source_word: σέσωκέν σε
  choice: உன்னை மீட்டிருக்கிறது
  rationale: σῴζω என்பதன் நிறைவேற்றப்பட்டு தொடர்ந்து விளைவுள்ள செயலைக் கிரேக்க இறந்தகால நிறைவு வடிவம் காட்டுகிறது. பாவமன்னிப்பை மையப்படுத்தும் சூழலில் ‘மீட்டிருக்கிறது’ என்பது இரட்சிப்பு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πορεύου εἰς εἰρήνην
  choice: சமாதானத்துடன் போ
  rationale: சொல்லுக்குச் சொல் ‘சமாதானத்திற்குள் போ’ என்றாலும், இது பிரிந்து செல்லும்போது கூறப்படும் வாழ்த்தும் உறுதியும் கொண்ட மொழிவழக்கு; ‘சமாதானத்துடன் போ’ இயல்பாக அதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: σῴζω என்பது இரட்சிப்பையா உடல்நலமடைவதையா குறிக்கிறது?
  choice: உன்னை மீட்டிருக்கிறது
  alternative: உன்னை நலமாக்கியிருக்கிறது
  rationale: லூக்கா 7:36–50-ன் உடனடிச் சூழல் பாவமன்னிப்பையும் பெண்ணின் விசுவாசத்தையும் வலியுறுத்துகிறது. ஆகவே இரட்சிப்பு/மீட்பு சார்ந்த பொருள் முதன்மையானது; இருப்பினும் σῴζω உடல் நலமடைவதையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πίστις என்பதன் நுண்பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இங்கு பெண்ணின் இயேசுவின்மீதான நம்பிக்கையே சூழலுக்கு மிகவும் பொருந்துகிறது. ‘உண்மைத்தன்மை’ இலக்கணரீதியாகச் சாத்தியமானாலும் இங்கு குறைவான சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை. கிரேக்கத்தின் நிறைவு வினைத் தன்மையை ‘மீட்டிருக்கிறது’ என்பதன் மூலம் வெளிப்படுத்துகிறது; εἰς εἰρήνην என்ற மொழிவழக்கை இயல்பான ‘சமாதானத்துடன் போ’ என வழங்குகிறது.
