id: LUK.7.47
reference: Luke 7:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: ta
  text: 'எனவே, நான் உங்களுக்குச் சொல்கிறேன்: இவளுடைய பல பாவங்கள் மன்னிக்கப்பட்டுள்ளன; ஏனெனில், இவள் மிகவும் அன்புகூர்ந்தாள்.[a] ஆனால், சிறிதளவே மன்னிக்கப்படுகிறவர் சிறிதளவே அன்புகூருகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதனால் இவள் மிகவும் அன்புகூர்ந்தாள்.” இங்கே உள்ள கிரேக்க இணைப்புச் சொல்லை, இவளுடைய அன்பு மன்னிப்பைப் பெற்றதற்கான காரணம் என்று அல்லாமல், இவள் மன்னிக்கப்பட்டிருப்பதற்கான சான்று என்று வலியுறுத்தும் வகையிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: எனவே
  rationale: முந்தைய உவமையிலிருந்து இயேசு எடுக்கும் முடிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கிரேக்கத் தொடரின் காரண/தீர்மான இணைப்பையும் காக்கிறது.
- source_word: ἀφέωνται
  choice: மன்னிக்கப்பட்டுள்ளன
  rationale: நிறைவேறிய செயலும் அதன் தற்போதைய விளைவும் தொடர்வதை perfect passive வடிவத்துக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: இவளுடைய ஏராளமான பாவங்கள்
  rationale: அவளுடைய பாவங்கள் எண்ணிக்கையில் பல என்பதைக் கூறும் கிரேக்க அடைமொழித் தொடரை இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள காரணத் தொடர்பைப் பாதுகாக்கிறது; அன்பு மன்னிப்பைச் சம்பாதித்தது என்று உரையிலேயே விளக்கிச் சமன்செய்யாமல் அதன் உண்மையான விளக்கத் தளர்வை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: ἠγάπησεν πολύ
  choice: இவள் மிகவும் அன்புகூர்ந்தாள்
  rationale: aorist வினையை இயல்பான இறந்தகாலமாகவும் πολύ என்பதைக் அளவைக் காட்டும் ‘மிகவும்’ என்றும் வழங்குகிறது.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: ஆனால், கொஞ்சமே மன்னிக்கப்பட்டவர்
  rationale: பாலினத்தைத் தேவையின்றி குறிப்பதில்லை; ‘கொஞ்சம்’ என்ற அளவையும் passive கருத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: ὀλίγον ἀγαπᾷ
  choice: கொஞ்சமே அன்புகூருகிறார்
  rationale: முந்தைய ‘கொஞ்சமே மன்னிக்கப்பட்டவர்’ என்பதோடு இணையான அமைப்பையும் பழமொழி போன்ற சுருக்கமான வலிமையையும் காக்கிறது.
theological_decisions:
- issue: ὅτι என்பது அந்தப் பெண்ணின் அன்பே மன்னிப்புக்கான காரணம் என்று பொருள்படுகிறதா?
  choice: ὅτι என்பதை ‘ஏனெனில்’ என்று மொழிபெயர்த்து, கிரேக்கத்தின் காரணத் தோற்றத்தையும் இறையியல் இழுபறியையும் பிரதான உரையில் பாதுகாத்தல்.
  alternative: ‘அதனால் இவள் மிகவும் அன்புகூர்ந்தாள்’ என்று மொழிபெயர்த்து, அவளுடைய அன்பை ஏற்கெனவே பெற்ற மன்னிப்பின் விளைவாக அல்லது சான்றாக வெளிப்படையாகக் காட்டுதல்.
  rationale: உடனடிச் சூழலிலுள்ள உவமையும் வசனம் 50-உம் மன்னிப்பு அன்புக்கு முன் இருப்பதைச் சுட்டுகின்றன. ஆனாலும் இவ்வசனத்தின் சுருக்கமான கிரேக்க அமைப்பு ὅτι மூலம் காரணத் தொடர்பை வெளிப்படுத்துவதால், அதை பிரதான உரையில் அழிக்காமல் மாற்று புரிதலை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான ஒருமை முகவரிக்குப் பொதுவாகப் பயன்படும் ‘உங்களுக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூருதல்’ என்பது dignified biblical register-ஐத் தக்கவைத்தாலும் இன்றைய வாசகர்களுக்குப் புரியக்கூடியது. ‘கொஞ்சமே… கொஞ்சமே’ என்ற இணை அமைப்பு மூலத்தின் சுருக்கமான எதிரொலியைப் பாதுகாக்கிறது.
