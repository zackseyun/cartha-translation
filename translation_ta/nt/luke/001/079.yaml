source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: ta
  text: இருளிலும் மரணத்தின் நிழலிலும் அமர்ந்திருப்போர் மேல் ஒளிவீசவும்[a], நமது கால்களைச் சமாதானத்தின் வழியில் நடத்தவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரண நிழல்”; சிலர் இச்சொற்றொடரை விரிவாக “காரிருள்” என்று புரிந்துகொள்கிறார்கள். ஆனால் கிரேக்க மூலத்தில் “மரணம்” என்பது வெளிப்படையாக இடம்பெறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: ஒளிவீசவும்
  rationale: இருளுக்குள் ஒளி தோன்றும் உருவகத்தை இயல்பான தமிழில் காக்கிறது; வெறுமனே ‘தோன்றவும்’ என்று தட்டையாக்கவில்லை.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: இருளில் ... அமர்ந்திருப்போர்
  rationale: καθημένοις என்பதன் ‘அமர்ந்திருத்தல்’ என்ற உயிரோட்டமான உருவகத்தையும் ஏசாயா மரபுடனான எதிரொலியையும் காக்கிறது.
- source_word: σκότει
  choice: இருள்
  rationale: சொல்லின் நேரடியான மற்றும் உருவகமான இரு சாத்தியங்களையும் விளக்கித் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: σκιᾷ θανάτου
  choice: மரண நிழல்
  rationale: கிரேக்கத்தில் θανάτου (‘மரணத்தின்’) வெளிப்படையாக இருப்பதால் ‘காரிருள்’ எனப் பொதுமைப்படுத்தாமல், வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τοῦ κατευθῦναι
  choice: நடத்தவும்
  rationale: கால்களையும் வழியையும் சார்ந்த திசைநடத்தும் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நேராக்கவும்’ என்பது இங்கு மிகையான சொல்லடி மொழிபெயர்ப்பாகும்.
- source_word: τοὺς πόδας ἡμῶν
  choice: நமது கால்களை
  rationale: ‘நம்மை’ என்று சுருக்காமல் உடல் சார்ந்த கவித்துவ உருவகத்தை அப்படியே காக்கிறது.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: சமாதானத்தின் வழியில்
  rationale: ὁδός என்பதன் வழி உருவகத்தையும் εἰρήνη என்பதன் விரிவான சமாதானக் கருத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இருள் மற்றும் மரண நிழல் உருவகங்களை விளக்கிப் பொருள்கூறுவதா
  choice: இருள், மரண நிழல், கால்கள், வழி ஆகிய உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘ஆவிக்குரிய இருளிலும் மரணத்திலும் இருப்போருக்கு ஒளி கொடுத்து, சமாதானத்தைத் தரும் வாழ்க்கையில் நம்மை நடத்தவும்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: மூலவசனம் கவித்துவமும் மறைநூல் எதிரொலியும் கொண்டது. உருவகங்களை ஓர் ஆன்மிக, ஒழுக்க, அல்லது அரசியல் பொருளாக மட்டும் முடிவுசெய்யாமல் அதன் இறையியல் விரிவையும் பதற்றத்தையும் காக்க வேண்டும்.
- issue: εἰρήνης என்பதன் பொருள் வரம்பு
  choice: சமாதானம்
  alternative: அமைதி
  rationale: ‘சமாதானம்’ என்பது தனிப்பட்ட அமைதியைத் தாண்டி உறவு நலம், ஒப்புரவு, முழுமை ஆகிய வேதாகமப் பரப்பையும் திறந்துவைக்கிறது; அவற்றில் ஒன்றாக மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுவழக்குக்கும் இடைப்பட்ட கண்ணியமான, வாசிக்க எளிய நடை. ‘அமர்ந்திருப்போர்’ என்ற சொல் மூலத்தின் காட்சியையும், ‘சமாதானம்’ என்ற சொல் εἰρήνη என்பதன் வேதாகமப் பரப்பையும் காக்கிறது.
