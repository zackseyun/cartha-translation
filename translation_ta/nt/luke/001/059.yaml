translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ போன்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது. கிரேக்க imperfect-இன் உண்மையான பொருள் நுட்பத்தை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன; பெயரிடுதல் முடிந்துவிட்டதாக உரை தீர்மானிக்கவில்லை.
