  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: ta
  text: எட்டாம் நாளில், அந்தக் குழந்தைக்கு விருத்தசேதனம் செய்வதற்காக அவர்கள் வந்தார்கள். அவனுடைய தந்தையின் பெயரின்படி[b] அவனைச் சகரியா என்று அழைத்துக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனைச் சகரியா என்று அழைத்தார்கள்.’ கிரேக்க நிறைவுறாத இறந்தகால வினை வடிவம், அவர்கள் அவ்வாறு அழைத்துக்கொண்டிருந்ததையோ அல்லது அவ்வாறு அழைக்க முற்பட்டதையோ குறிக்கலாம்; அடுத்த வசனத்தில் வரும் திருத்தத்துடன் இரண்டாவது பொருள் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவனுடைய தந்தையின் பெயரின்படி அவனைச் சகரியா என்று அழைத்துக்கொண்டிருந்தார்கள்.’ குடும்ப உறுப்பினர் ஒருவரின் பெயரைக் குழந்தைக்குச் சூட்டும் வழக்கை இது குறிக்கிறது.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்காமல் நிகழ்வின் தொடக்க அமைப்பில் வெளிப்படுத்தப்பட்டது]'
  rationale: இது லூக்கா பயன்படுத்தும் நிகழ்வை அறிமுகப்படுத்தும் கதைசொல்லல் வாய்பாடு. தமிழில் ‘அது நிகழ்ந்தது’ என்று தனியே கூறுவது இயல்பற்றதால், ‘எட்டாம் நாளில்... வந்தார்கள்’ என்ற இயல்பான தொடர் அதன் பணியை ஏற்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: எட்டாம் நாளில்
  rationale: குறிப்பிட்ட காலத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ἦλθον
  choice: அவர்கள் வந்தார்கள்
  rationale: கிரேக்கத்தில் எழுவாய் குறிப்பிடப்படாத பன்மையாக உள்ளது; யார் என்று உரையில் இல்லாததைச் சேர்க்காமல் அதே தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: περιτεμεῖν
  choice: விருத்தசேதனம் செய்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் infinitive-ஐத் தெளிவாக வெளிப்படுத்துகிறது. ‘விருத்தசேதனம்’ என்பது நவீன தரத் தமிழில் நிலைபெற்ற வேதாகமச் சொல்.
- source_word: τὸ παιδίον
  choice: குழந்தைக்கு
  rationale: பிறந்து எட்டு நாளான சிசுவைக் குறித்தாலும், παιδίον என்பதற்கான நேரடியும் இயல்புமான பொதுச் சொல் ‘குழந்தை’.
- source_word: ἐκάλουν
  choice: அழைக்க முற்பட்டார்கள்
  rationale: Imperfect வடிவம் தொடர்ந்த அல்லது முயற்சிக்கப்பட்ட பெயரிடுதலைக் குறிக்கலாம்; அடுத்த வசனத்தில் வரும் மறுப்புடன் இயல்பாகப் பொருந்தும். இது உறுதியான ஒரே விளக்கம் அல்ல என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: அவனுடைய தந்தையின் பெயரின்படி
  rationale: தந்தையின் பெயரையே குழந்தைக்குச் சூட்டும் குடும்பப் பெயரிடும் வழக்கை வெளிப்படுத்துகிறது; கிரேக்க அமைப்பின் தொடர்பையும் பாதுகாக்கிறது.
- source_word: Ζαχαρίαν
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான, கிரேக்க Ζαχαρίας பெயருக்கான நிலைபெற்ற வடிவம்.
