  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகிழ்ச்சி’ மற்றும் ‘பேருவகை’ மூலம் மூலத்தின் இரு வேறுபட்ட மகிழ்ச்சி சொற்கள் பேணப்பட்டுள்ளன.
