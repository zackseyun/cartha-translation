id: LUK.1.14
reference: Luke 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: ta
  text: உனக்கு மகிழ்ச்சியும் பேருவகையும் உண்டாகும்; அவனுடைய பிறப்பின்போது[a] பலர் மகிழ்ச்சியடைவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய பிறப்பினால்.” கிரேக்கச் சொற்றொடர் மகிழ்ச்சிக்கான நிகழ்ச்சிச் சூழலையோ அதன் காரணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: உண்டாகும்
  rationale: எதிர்காலத்தில் நிகழவிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; χαρά, ἀγαλλίασις ஆகிய பெயர்ச்சொற்களுடன் நன்கு பொருந்துகிறது.
- source_word: χαρά
  choice: மகிழ்ச்சி
  rationale: χαρά என்பதன் பொதுவான பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: σοι
  choice: உனக்கு
  rationale: மகிழ்ச்சியை அனுபவிக்கப்போகும் நபரைக் குறிக்கும் ஒருமை தந்தைவேற்றுமையை நேரடியாகக் காட்டுகிறது.
- source_word: ἀγαλλίασις
  choice: பேருவகை
  rationale: χαρά என்பதிலிருந்து சொல்வேறுபாட்டைப் பேணுவதோடு, தீவிரமான கொண்டாட்ட மகிழ்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழியைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: அவனுடைய பிறப்பின்போது
  rationale: ἐπί + தந்தைவேற்றுமை இங்கு மகிழ்ச்சியின் நிகழ்ச்சிச் சூழலையோ அடிப்படையையோ குறிக்கலாம்; முதன்மை உரையில் கால/நிகழ்ச்சி நயத்தை இயல்பாகக் காட்டுகிறது.
- source_word: χαρήσονται
  choice: மகிழ்ச்சியடைவார்கள்
  rationale: χαίρω வினையின் எதிர்காலப் பொருளை இயல்பான தமிழில் வழங்கி, χαρά உடனான சொற்பொருள் தொடர்பையும் பேணுகிறது.
