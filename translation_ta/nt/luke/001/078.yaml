id: LUK.1.78
reference: Luke 1:78
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: ta
  text: நம் கடவுளின் கனிவான இரக்கத்தால், அதன் வழியாக உயரத்திலிருந்து வரும் உதயம் நம்மைச் சந்திக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விடியல்’; ἀνατολή என்ற கிரேக்கச் சொல், கிரேக்கப் பழைய ஏற்பாட்டில் மேசியாவைக் குறிக்கும் ‘கிளை’ என்ற பட்டத்தையும் எதிரொலிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: -இனால்
  rationale: Accusative உடன் வரும் διά காரணத்தையோ அடிப்படையையோ குறிக்கிறது; தமிழில் ‘இரக்கத்தினால்’ என்பது அதன் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σπλάγχνα ἐλέους
  choice: கனிவுள்ள இரக்கம்
  rationale: சொல்லாட்சிப்படி உள்ளுறுப்புகளோடு தொடர்புடைய இந்த மரபுத்தொடர் ஆழ்ந்த உள்ளார்ந்த பரிவைக் குறிக்கிறது; ‘கனிவுள்ள இரக்கம்’ அதன் உணர்வாழத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: θεοῦ ἡμῶν
  choice: நம் கடவுளின்
  rationale: Possessive genitive-ஐ நவீனத் தமிழின் இயல்பான உரிமைத் தொடராக வழங்குகிறது.
- source_word: ἐν οἷς
  choice: அதனால்
  rationale: முன்னுள்ள கடவுளின் இரக்கத்தைச் சார்ந்த வழி அல்லது அடிப்படையை இது குறிக்கிறது; தமிழில் காரணத் தொடர்புடன் இயல்பாக இணைக்கப்படுகிறது. வாக்கியத்தில் διά உடன் ஒருங்கிணைத்து ‘இரக்கத்தினால்’ என்று சுருக்கமாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐπισκέψεται
  choice: சந்திக்கும்
  rationale: எதிர்கால வினை வடிவைத் தக்கவைத்து, வருகை தந்து அருளுடன் தலையிடுதல் என்ற வேதாகமப் பொருளைச் சூழல் வெளிப்படுத்த இடமளிக்கிறது.
- source_word: ἀνατολὴ
  choice: உதயம்
  rationale: அடுத்த வசனத்தின் ஒளிப் படிமத்துடன் பொருந்தும் விடியல்/சூரிய உதயப் பொருளை முன்னிறுத்துகிறது; அதேவேளை கிரேக்கப் பழைய ஏற்பாட்டிலுள்ள மேசியாவைக் குறிக்கும் ‘கிளை’ என்ற எதிரொலியை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐξ ὕψους
  choice: உயரத்திலிருந்து
  rationale: ‘உயரத்திலிருந்து’ என்பது கிரேக்கச் சொல்லாட்சிக்கு நெருக்கமாகவும், ‘வானத்திலிருந்து’ என்று விளக்கமாக விரிவாக்காமல் பரலோகச் சார்பைத் தக்கவைக்கும் இயல்பான தமிழாகவும் உள்ளது.
theological_decisions:
- issue: மேசியா சார்ந்த சூழலில் ἀνατολή என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உதயம்’
  alternative: ‘விடியல்’; ‘கிளை’; ‘உதிக்கிறவர்’
  rationale: லூக்கா 1:78–79-இல் வரும் இருள் மற்றும் ஒளி உருவகங்கள் உதயம்/விடியல் என்ற பொருளை ஆதரிக்கின்றன. எனினும், செகரியா 3:8; 6:12 ஆகியவற்றின் கிரேக்கப் பழைய ஏற்பாட்டில் காணப்படும் மேசியாவுக்குரிய ‘கிளை’ என்ற எதிரொலியை உறுதியாக முதன்மைப் பொருளாக்காமல் அடிக்குறிப்பில் குறிப்பிடுவது உண்மையான பொருள் நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உதயம்’ என்பது ஒளி உருவகத்தையும் கவித்துவத் தன்மையையும் சுருக்கமாகக் காக்கிறது; [a] குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
