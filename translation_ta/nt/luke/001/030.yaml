  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: ta
  text: வானதூதர் அவளிடம், “மரியாளே, பயப்படாதே; ஏனெனில் கடவுளிடம் உனக்குத் தயவு கிடைத்திருக்கிறது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயர்ச்சொல்லான χάρις என்பதற்கு ‘அருள்’ அல்லது ‘தயவு’ என்று பொருள் கொள்ளலாம்; ஆனால் ‘கடவுளிடம் தயவு கிடைத்தல்’ என்ற மரபுத்தொடருக்கு இங்கே ‘தயவு’ நன்கு பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் நடை; கிரேக்க இறந்தகாலக் கதைநடையையும் வெளிப்படுத்துகிறது.
- source_word: ἄγγελος
  choice: வானதூதர்
  rationale: லூக்காவின் இப்பகுதியில் குறிக்கப்படுபவர் பரலோகத் தூதர் என்பதால், பொதுவான ‘தூதர்’ என்பதைவிடச் சூழலுக்குத் தெளிவான சொல்.
- source_word: Μὴ φοβοῦ
  choice: பயப்படாதே
  rationale: தடைப் பொருளுடைய கட்டளையை இயல்பான, நேரடியான நவீனத் தமிழில் தருகிறது.
- source_word: Μαριάμ
  choice: மரியாளே
  rationale: தமிழில் நிலைபெற்ற பெயர்வடிவத்தையும் நேரடி அழைப்புக்குரிய விளிவடிவத்தையும் பயன்படுத்துகிறது.
- source_word: εὗρες
  choice: கிடைத்திருக்கிறது
  rationale: கிரேக்க இறந்தகால வினை குறிக்கும் நிகழ்வின் தற்போதைய விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χάριν
  choice: தயவு
  rationale: χάρις என்பதற்கு ‘அருள்’ என்றும் பொருள் கொள்ளலாம்; ஆனால் ‘ஒருவரிடம் தயவு கிடைத்தல்’ என்ற மரபுத்தொடரில் உறவுசார் ஆதரவு அல்லது சாதகமான பார்வையை ‘தயவு’ தெளிவாகக் காட்டுகிறது.
- source_word: παρὰ τῷ θεῷ
  choice: கடவுளிடம்
  rationale: παρά + வேற்றுமை அமைப்பு இங்கு ‘கடவுளின் பார்வையில்/கடவுளோடு’ என்ற உறவுசார் பொருளைக் கொண்டதால், தமிழ் மரபுத்தொடருக்கு ஏற்ற ‘கடவுளிடம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: மரியாளைப் பற்றிய சூழலில் χάριν என்பதன் மொழிபெயர்ப்பு
  choice: தயவு
  alternative: அருள்
  rationale: εὑρίσκω χάριν παρά என்ற சொற்றொடர் ‘ஒருவரிடம் தயவு கிடைத்தல்’ என்னும் மரபுப் பொருளைக் கொண்டது. ‘தயவு’ என்பது பிற்காலக் கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்காமல், கடவுளின் சாதகமான மனப்பான்மையை வெளிப்படுத்துகிறது; ‘அருள்’ என்ற உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடிக் கதைநடை. வானதூதரைக் குறிக்க மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; மரியாளிடம் கூறப்படும் சொற்கள் நெருக்கமான ஒருமை வடிவில் உள்ளன.
