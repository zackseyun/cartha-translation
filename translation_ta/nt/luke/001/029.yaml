  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: ta
  text: ஆனால் அவள் அந்தச் செய்தியால் மிகவும் கலக்கமடைந்து,[a] இந்த வாழ்த்து எப்படிப்பட்டதாக இருக்குமோ என்று தொடர்ந்து சிந்தித்துக்கொண்டிருந்தாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த வார்த்தையினால்” அல்லது “அந்தக் கூற்றினால்.” λόγος என்பதற்கு “வார்த்தை,” “கூற்று,” அல்லது “செய்தி” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆழ்ந்து யோசித்துக்கொண்டிருந்தாள்” அல்லது “எண்ணிக்கொண்டிருந்தாள்.” கிரேக்க imperfect வடிவம் நீடித்த சிந்தனையைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வாழ்த்திலிருந்து மரியாளின் எதிர்வினைக்குச் செல்லும் மென்மையான மாறுபாட்டைக் காட்டுகிறது.
- source_word: ἐπὶ τῷ λόγῳ
  choice: அந்தச் செய்தியைக் கேட்டு
  rationale: λόγος இங்கு தூதர் கூறியதன் உள்ளடக்கத்தைக் குறிக்கிறது; ἐπί + வேற்றுமை உருபின் காரண/அடிப்படை நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διεταράχθη
  choice: மிகவும் கலக்கமடைந்து
  rationale: வினைச்சொல்லின் தீவிரமான மனக்கலக்கப் பொருளை வெளிப்படுத்துகிறது.
- source_word: διελογίζετο
  choice: தொடர்ந்து சிந்தித்துக்கொண்டிருந்தாள்
  rationale: இறந்தகால imperfect வடிவம் காட்டும் நீடித்த உள்ளார்ந்த ஆலோசனையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ποταπὸς
  choice: எப்படிப்பட்ட
  rationale: வாழ்த்தின் தன்மை அல்லது வகையைப் பற்றிய கேள்வியை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: εἴη
  choice: இருக்குமோ
  rationale: மறைமுகக் கூற்றிலுள்ள optative வடிவத்தின் ஊகத்தன்மையையும் தயக்க நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: ἀσπασμὸς
  choice: வாழ்த்து
  rationale: தூதர் உரைத்த வாழ்த்தைக் குறிக்கும் தெளிவான, இயல்பான தமிழ் சொல்.
- source_word: οὗτος
  choice: இது
  rationale: சற்றுமுன் கூறப்பட்ட குறிப்பிட்ட வாழ்த்தை நேரடியாகச் சுட்டுகிறது.
theological_decisions:
- issue: மரியாளின் எதிர்வினையின் தன்மை
  choice: தூதரின் செய்தியால் மரியாள் கலக்கமடைந்து, அந்த வாழ்த்தின் பொருளைத் தொடர்ந்து சிந்தித்தாள் என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: தூதரின் தோற்றத்தைக் கண்டு அவள் பயந்தாள் அல்லது அவளுடைய எதிர்வினை அவநம்பிக்கையைக் காட்டியது என்று விளக்குதல்.
  rationale: கிரேக்கம் அவளுடைய கலக்கத்தைச் சொல்லப்பட்ட λόγος உடன் நேரடியாக இணைக்கிறது; பாவமுள்ள பயம், அவநம்பிக்கை அல்லது ஒழுக்கக் குறை எதையும் உரை குறிப்பிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. “இருக்குமோ” என்பது optative நுணுக்கத்தை இயல்பாகக் காக்கிறது; “சிந்தித்துக்கொண்டிருந்தாள்” நீடித்த செயலை வெளிப்படுத்துகிறது.
