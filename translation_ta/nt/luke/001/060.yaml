  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: ta
  text: அவனுடைய தாய் பதிலளித்து, “இல்லை; மாறாக, அவன் யோவான் என்று அழைக்கப்படுவான்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு யோவான் என்று பெயரிடப்படும்.”
    reason: பெயரால் அழைக்கப்படுதல் என்ற கிரேக்கச் செயப்பாட்டு வினையைத் தமிழில் இயல்பாக வழங்கக்கூடிய மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: மறுமொழியாக … என்றாள்
  rationale: பேச்சை அறிமுகப்படுத்தும் இறந்தகாலப் பங்கேற்புவினையின் ‘பதிலளித்து/மறுமொழி கூறி’ என்ற பொருளை, இயல்பான நவீனத் தமிழில் நேரடி உரையோடு இணைக்கிறது.
- source_word: μήτηρ αὐτοῦ
  choice: அவனுடைய தாய்
  rationale: கிரேக்க மொழியின் உறவைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: Οὐχί
  choice: இல்லை
  rationale: முந்தைய பெயரிடும் முன்மொழிவை உறுதியாக மறுக்கும் நேரடியான பதில்.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: வெறும் எதிர்மறை இணைப்பாக அல்லாமல், முன் கூறப்பட்ட கருத்தைத் திருத்தும் ἀλλά என்பதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: κληθήσεται
  choice: அழைக்கப்படுவான்
  rationale: καλέω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தையும், பெயரால் அழைக்கப்படுதல் என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் இப்பெயரின் நிலையான வடிவம்.
