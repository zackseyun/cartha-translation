id: LUK.1.18
reference: Luke 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: ta
  text: சகரியா அந்தத் தூதரிடம், “இதை நான் எப்படி அறிந்துகொள்வேன்? ஏனெனில் நான் முதியவன்; என் மனைவியும் வயது முதிர்ந்தவள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: என்றார்
  rationale: தமிழ் நேர்க் கூற்றின் முடிவில் இயல்பாக வரும் மரியாதை ஒருமை உரையாடல் வினை; கிரேக்கக் கதையாடல் வினையின் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: πρὸς τὸν ἄγγελον
  choice: அந்தத் தூதரிடம்
  rationale: பேச்சின் பெறுநரை πρός குறிக்கிறது. சூழலில் இவர் கபிரியேல் என்பதால் ἄγγελος என்பதற்கு ‘தூதர்’ பொருத்தமானது; ‘அந்த’ என்பது முன்பு குறிப்பிடப்பட்டவரைச் சுட்டுகிறது.
- source_word: Κατὰ τί γνώσομαι τοῦτο
  choice: இதை நான் எப்படி அறிந்துகொள்வேன்?
  rationale: Κατὰ τί என்பது அறிந்துகொள்வதற்கான அடிப்படை அல்லது வழியை வினவுகிறது; γνώσομαι என்பதன் எதிர்காலக் கருத்தையும் ‘அறிந்துகொள்வேன்’ காக்கிறது.
- source_word: πρεσβύτης
  choice: முதியவன்
  rationale: இது பதவியைக் குறிக்காமல் வயதில் முதிர்ந்த ஆணைக் குறிக்கிறது; ‘முதியவன்’ நேரடியான, இயல்பான தமிழ்.
- source_word: ἡ γυνή μου
  choice: என் மனைவியும்
  rationale: உடைமைச் சுட்டுடன் இச்சூழலில் γυνή என்பது ‘மனைவி’ என்று பொருள்படும். καί-இன் இணைப்புக் கருத்தை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: வயது முதிர்ந்தவள்
  rationale: கிரேக்கத்தில் சொற்பட ‘தன் நாட்களில் முன்னேறியவள்’ என்றாலும், இது முதுமையைக் குறிக்கும் மரபுத்தொடர். நவீன தமிழில் ‘வயது முதிர்ந்தவள்’ அதன் பொருளை இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
theological_decisions:
- issue: ἄγγελος என்பதன் மொழிபெயர்ப்பு
  choice: தூதர்
  alternative: செய்தியாளர்
  rationale: ἄγγελος பொதுவாக ‘செய்தியாளர்’ எனப் பொருள்படலாம்; ஆனால் உடனடிச் சூழலில் தோன்றிப் பேசுபவர் கபிரியேல் என்பதால் இங்கு வானதூதரைக் குறிக்கும் ‘தூதர்’ தேவைப்படுகிறது.
- issue: சகரியாவின் கேள்வியின் தன்மை
  choice: இதை நான் எப்படி அறிந்துகொள்வேன்?
  alternative: இது நடக்கும் என்று நான் எப்படி உறுதிப்படுத்திக்கொள்வேன்?
  rationale: மூலத்தின் சுருக்கத்தையும் அதன் சாத்தியமான உறுதிச்சான்றுக் கோரிக்கையையும் திறந்த நிலையில் வைக்கிறது; ‘அடையாளம்’ போன்ற விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். கிரேக்க மரபுத்தொடரை சொற்படப் பின்பற்றுவதற்குப் பதிலாக அதன் பொருளை இயல்பான தமிழில் வழங்குகிறது; தேவையற்ற விளக்கவுரையோ சமயப்பிரிவு சார்ந்த சொல்லாட்சியோ சேர்க்கப்படவில்லை.
