source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: ta
  text: அவர் யாக்கோபின் வீட்டார் மீது என்றென்றும்[a] அரசாளுவார்; அவருடைய அரசாட்சிக்கு முடிவே இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலங்கள்தோறும்” / “யுகங்கள் முழுவதும்.” εἰς τοὺς αἰῶνας என்ற கிரேக்க மரபுத்தொடர் முடிவில்லாத காலநீட்சியை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: அரசாளுவார்
  rationale: βασιλεύω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் அரசராக ஆட்சி செய்வதைக் குறிக்கிறது. ‘அரசாளுவார்’ என்பது அரசத்தன்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: யாக்கோபின் வீட்டார்மேல்
  rationale: βασιλεύω உடன் வரும் ἐπί + accusative, ‘மேல்’ எனும் ஆட்சிக்குட்பட்ட உறவைக் குறிக்கிறது. οἶκος இங்கு கட்டடத்தை அல்ல, யாக்கோபைச் சார்ந்த மக்களைக் குறிக்கும் கூட்டுப்பெயராக இருப்பதால் ‘வீட்டார்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் முடிவில்லாத காலநீட்சியைத் தெரிவிக்கிறது. ‘என்றென்றும்’ என்பது நவீனத் தமிழில் இயல்பாகவும் வலிமையாகவும் அதைப் பதிக்கிறது.
- source_word: βασιλείας
  choice: அரசாட்சி
  rationale: βασιλεία என்பது ஆட்சி, அரசுரிமை அல்லது ராஜ்யம் ஆகிய பொருள்களைத் தரலாம். ‘முடிவு இருக்காது’ என்ற சூழலில் ‘அரசாட்சி’ அரசரின் நீடித்த ஆட்சியை இயல்பாக எடுத்துரைக்கிறது; நிலப்பரப்பு சார்ந்த பொருளைத் தேவையின்றி முன்னிறுத்தாது.
- source_word: οὐκ ἔσται τέλος
  choice: முடிவே இருக்காது
  rationale: இது எதிர்கால இருப்பை மறுக்கும் அமைப்பு. ‘முடிவே இருக்காது’ என்பது οὐκ என்பதன் உறுதியான மறுப்பைத் தமிழில் இயல்பாக வலியுறுத்துகிறது.
theological_decisions:
- issue: ‘யாக்கோபின் வீடு’ என்பதன் வரம்பு
  choice: ‘யாக்கோபின் வீட்டார்’ என்று வைத்திருந்து, அதை ‘இஸ்ரவேல் மக்கள்’ அல்லது ‘தேவனுடைய மக்கள்’ என விளக்கி விரிவுபடுத்தவில்லை.
  alternative: இஸ்ரவேல் மக்கள்; தேவனுடைய மக்கள்
  rationale: இது உடன்படிக்கைச் சார்ந்த பாரம்பரியக் கூட்டுப்பெயர். அதன் இறையியல் வரம்பை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், மூலத்தின் சொல்லாட்சியையும் இழுபறியையும் பாதுகாக்கிறது.
- issue: அரசாட்சியின் காலநீட்சி
  choice: εἰς τοὺς αἰῶνας என்பதை ‘என்றென்றும்’ என்றும், முடிவின்மையை ‘முடிவே இருக்காது’ என்றும் வழங்கியது.
  alternative: காலங்கள்தோறும்; யுகங்களுக்குள்
  rationale: வசனம் அரசாட்சியின் முடிவில்லாத நீட்சியை நேரடியாகக் கூறுகிறது. தேர்ந்த சொற்கள் அதன் வலிமையைத் தளர்த்தாமல் நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கின்றன.
- issue: βασιλεία என்பதன் பொருள்
  choice: ‘அரசாட்சி’
  alternative: ராஜ்யம்; அரசு
  rationale: βασιλεία ஆட்சிச் செயல் அல்லது ஆளுகையையும், ஆளப்படும் ராஜ்யத்தையும் குறிக்கக்கூடும். இங்கு ‘அரசாட்சி’ என்பதைத் தேர்ந்தெடுப்பது அரசரின் ஆளுகையை முன்னிறுத்தினாலும், சொல்லின் அரசத்தன்மையைப் பாதுகாக்கிறது; மாற்றுப் பொருளை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘வீட்டார்’ என்பது οἶκος என்பதன் மக்கள்-கூட்டுப் பொருளை இயல்பாகத் தருகிறது; ‘அரசாளுவார்’ மற்றும் ‘அரசாட்சி’ அரசருக்குரிய ஆளுகையைத் தெளிவாகப் பாதுகாக்கின்றன.
