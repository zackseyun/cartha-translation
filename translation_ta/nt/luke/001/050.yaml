source:
  edition: SBLGNT
  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: ta
  text: அவருக்கு அஞ்சுகிறவர்கள்மேல் அவரது இரக்கம் தலைமுறை தலைமுறையாக நிலைத்திருக்கிறது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைமுறை தலைமுறையாக” என்பது அடுத்தடுத்த தலைமுறைகளெங்கும் அவரது இரக்கம் தொடர்வதைக் குறிக்கிறது. கிரேக்கத்தில் சொல்லுக்கு சொல், “தலைமுறைகளுக்கும் தலைமுறைகளுக்கும்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அவருக்கு அஞ்சுகிறவர்கள்” என்பது தேவனைப் பயபக்தியுடன் மதிக்கிறவர்களைக் குறிக்கிறது; “அவரைப் பயபக்தியுடன் மதிக்கிறவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: தேவையிலுள்ளவருக்கு காட்டப்படும் கருணையையும் இரக்கத்தையும் குறிக்கும் சொல்லுக்கு இயல்பான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகளெங்கும் தொடர்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; εἰς குறிக்கும் நீடித்த விரிவையும் காக்கிறது.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: அவருக்கு அஞ்சி நடக்கிறவர்கள்மேல்
  rationale: தேவனைப் பற்றிய பயபக்தியை 'அஞ்சி நடக்கிறவர்கள்' என்ற வழக்கமான தமிழில் தெரிவிக்கிறது; வெறும் பீதியாகக் குறுக்காமல் வாழ்வில் வெளிப்படும் மரியாதையுள்ள அச்சத்தையும் தக்கவைக்கிறது.
- source_word: καὶ
  choice: —
  rationale: இவ்வசனம் முந்தைய கவிதை வரியோடு இணைந்திருந்தாலும், தனி வசனமாக இயல்பான தமிழில் தொடங்க இணைப்புச் சொல்லை வெளிப்படையாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: αὐτοῦ / αὐτόν
  choice: அவரது / அவருக்கு
  rationale: உடனடி சூழலில் இரண்டும் தேவனைக் குறிக்கின்றன; மரியாதையான ஒருமைச் சுட்டுப்பெயர்கள் குறிப்பைத் தெளிவாக வைத்திருக்கின்றன.
theological_decisions:
- issue: தேவனை 'அஞ்சுதல்' என்பதன் பொருள்
  choice: அவருக்கு அஞ்சி நடக்கிறவர்கள்
  alternative: அவரைப் பயபக்தியுடன் மதிக்கிறவர்கள்
  rationale: φοβέομαι என்ற சொல்லின் 'அச்சம்' சார்ந்த வேதாகமச் செறிவைத் தக்கவைத்தபடியே, இங்கு வெறும் பீதியல்லாமல் பயபக்தியுடன் வாழ்வதைக் குறிக்கிறது.
- issue: இரக்கத்தின் தொடர்ச்சி
  choice: தலைமுறை தலைமுறையாக நிலைத்திருக்கிறது
  alternative: தலைமுறைகள் தலைமுறைகளுக்கு உள்ளது
  rationale: கிரேக்கத்தின் சுருக்கமான வாக்கியத்தில் உள்ள காலந்தோறும் நீளும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இரக்கம் எல்லோருக்கும் வேறுபாடின்றி வழங்கப்படுகிறது என்று மூலத்தைவிட அதிகமாகக் கூறுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் பாடலுக்குரிய உயர்வும் கொண்ட எளிய நடை. 'பயப்படுகிறவர்கள்' என்பதற்குப் பதில் 'அஞ்சி நடக்கிறவர்கள்' என்பது வெறும் பீதி என்ற தவறான எண்ணத்தைத் தவிர்த்து, மூலத்தின் பயபக்தி சார்ந்த பதற்றத்தையும் காக்கிறது.
