id: LUK.1.5
reference: Luke 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: ta
  text: யூதேயாவின் அரசனான ஏரோதின் நாட்களில், அபியாவின் ஆசாரியப் பிரிவைச் சேர்ந்த சகரியா என்னும் ஓர் ஆசாரியர் இருந்தார்; அவருக்கு ஆரோனின் புதல்வியரின் வம்சத்தைச் சேர்ந்த ஒரு மனைவி இருந்தாள்; அவளுடைய பெயர் எலிசபெத்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: நாட்களில் ... இருந்தார்
  rationale: கதை அறிமுகச் சூத்திரத்தையும் காலக் குறிப்பையும் இயல்பான நவீனத் தமிழில் தருகிறது; மரத்தனமான ‘நிகழ்ந்தது’ என்பதைத் தவிர்க்கிறது.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: யூதேயாவின் அரசனாகிய ஏரோது
  rationale: ஏரோதின் ஆட்சிப் பதவியையும் நிலப்பகுதியையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: சகரியா என்னும் ஓர் ஆசாரியர்
  rationale: τις என்பதன் அறிமுகத் தன்மையை ‘ஓர்’ என்பதும், ὀνόματι என்பதைக் ‘என்னும்’ என்பதும் இயல்பாகக் காட்டுகின்றன.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: அபியா பிரிவைச் சேர்ந்த
  rationale: ἐφημερία என்பது ஆலயப் பணிக்கான ஆசாரிய சேவைப் பிரிவைக் குறிக்கிறது; ‘பிரிவு’ அதன் நிறுவனப் பொருளைச் சுருக்கமாகப் பேணுகிறது.
- source_word: γυνὴ αὐτῷ
  choice: அவருக்கு ... ஒரு மனைவி இருந்தார்
  rationale: உடைமைப் பொருளுடைய தத்திவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: ஆரோனின் புதல்வியரில் வந்த
  rationale: ‘ஆரோனின் புதல்வியர்’ என்ற கிரேக்க உருவகத்தைப் பேணியபடியே, இங்கு வம்சவழி குறிக்கப்படுவதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: அவரது பெயர் எலிசபெத்
  rationale: பெயர் அறிமுகச் சூத்திரத்தை இயல்பாகவும் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: எலிசபெத்தின் ஆசாரிய வம்சப் பின்னணி
  choice: ஆரோனின் புதல்வியரில் வந்த
  alternative: ஆரோனின் சந்ததியினரில் வந்த
  rationale: மூலத்தில் உள்ள ‘ஆரோனின் புதல்வியர்’ என்ற பெண்பால் குடும்பச் சொல்லாட்சியைப் பேணுகிறது; அதேவேளை ‘வந்த’ என்பது அதன் வம்சவழிப் பொருளை இயல்பான தமிழில் உணர்த்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதை விகுதிகள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் ஒரே வாக்கிய அமைப்பும் அரைப்புள்ளிகள் மூலம் பெருமளவு பேணப்பட்டுள்ளது. வரலாற்றுப் பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் எளிதில் அறியப்படும் வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன.
