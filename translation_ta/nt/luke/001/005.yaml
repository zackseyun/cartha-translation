  rationale: The revision resolves the ambiguous final pronoun, uses a more natural feminine verb for Elizabeth's introduction, and clarifies that the reference to Aaron's daughters denotes lineage. It also supplies correctly targeted Tamil footnotes for the priestly division and the genealogical idiom, without adding doctrinal interpretation.
