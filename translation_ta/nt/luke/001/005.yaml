revisions:
- from: யூதேயாவின் அரசனாகிய ஏரோதின் நாட்களில், அபியா பிரிவைச் சேர்ந்த சகரியா என்னும் ஓர் ஆசாரியர் இருந்தார்; அவருக்கு ஆரோனின் புதல்வியரில் வந்த ஒரு மனைவி இருந்தார்; அவரது பெயர் எலிசபெத்.
