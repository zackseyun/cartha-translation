  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: ta
  text: உங்களுக்கு அறிவுறுத்தப்பட்ட[a] விஷயங்களின் உறுதியை[b] நீங்கள் அறிந்துகொள்வதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கற்பிக்கப்பட்ட.” இந்த வினை முறையான, குறிப்பாக வாய்மொழியான, அறிவுறுத்தலையோ கற்பித்தலையோ குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “நம்பகத்தன்மையை.” கிரேக்கப் பெயர்ச்சொல் உறுதி, பாதுகாப்பு, அல்லது நம்பத்தகுந்த தன்மை ஆகியவற்றைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: அறிந்துகொள்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα என்பதன் பொருளை, தமிழில் இயல்பான நோக்க வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: ἐπιγνῷς
  choice: நீங்கள் அறிந்துகொள்ள
  rationale: ἐπιγινώσκω என்பதன் இவ்விடத்துக்குரிய பொருளை இயல்பாகத் தருகிறது; ‘முழுமையாக அறிய’ என்பது கிரேக்கக் கூட்டுவினையின் வலிமையை அளவுக்கு மீறி வலியுறுத்தக்கூடும்.
- source_word: περὶ ὧν
  choice: உங்களுக்குக் கற்றுக்கொடுக்கப்பட்ட செய்திகளின்
  rationale: தமிழ் வாக்கிய அமைப்பில் தொடர்பை இயல்பாகக் காட்டுவதற்காக, ‘எவற்றைக் குறித்து’ என்ற மரப்பொருள் அமைப்புக்குப் பதிலாகச் சார்புத் தொடர்பு உருபால் வழங்கப்பட்டுள்ளது.
- source_word: κατηχήθης
  choice: உங்களுக்குக் கற்றுக்கொடுக்கப்பட்ட
  rationale: வாய்மொழியாகவோ முறையாகவோ அறிவுறுத்தப்பட்டதைக் குறிக்கும் வினையின் பொருளை, பிற்காலத் திருச்சபைத் தொழில்நுட்பச் சொல்லை இறக்குமதி செய்யாமல் தெளிவாகத் தருகிறது.
- source_word: λόγων
  choice: செய்திகளின்
  rationale: இங்கு λόγων என்பது தனித்தனி ‘சொற்கள்’ என்பதைக் காட்டிலும் கற்றுக்கொடுக்கப்பட்ட உள்ளடக்கம் அல்லது செய்திகள் என்பதைக் குறிக்கிறது.
- source_word: τὴν ἀσφάλειαν
  choice: உறுதித்தன்மையை
  rationale: ἀσφάλεια குறிக்கக்கூடிய உறுதி, பாதுகாப்பான நிலை, நம்பகத்தன்மை ஆகிய பொருள் எல்லையை இயன்றவரைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: லூக்கா எழுதுவதன் நோக்கத்தில் ἀσφάλεια என்பதன் தன்மை
  choice: முன்பு கற்றுக்கொடுக்கப்பட்ட செய்திகளின் உறுதித்தன்மையை அறிதல்
  alternative: உள்ளார்ந்த நிச்சயத்தைப் பெறுதல் மட்டும்; அல்லது வரலாற்று நம்பகத்தன்மையைச் சரிபார்த்தல் மட்டும்
  rationale: ἀσφάλεια என்பது அறிபவரின் நிச்சயத்தையும் கற்றுக்கொடுக்கப்பட்ட செய்திகளின் நம்பகத்தன்மையையும் சுட்டக்கூடும். மொழிபெயர்ப்பு இவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து மற்றதை நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைக்குரிய ஒருமையை ‘நீங்கள்/உங்கள்’ வடிவங்களால் வெளிப்படுத்துகிறது. மூலத்தின் நோக்கத் துணைவாக்கிய அமைப்பையும், ‘உறுதித்தன்மை’ என்பதில் உள்ள அறிவுசார் மற்றும் பொருள்சார் விரிவையும் காக்கிறது.
