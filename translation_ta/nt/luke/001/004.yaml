revisions:
- from: உங்களுக்குக் கற்றுக்கொடுக்கப்பட்ட[a] செய்திகளின் உறுதித்தன்மையை[b] நீங்கள் அறிந்துகொள்வதற்காக.
  to: உங்களுக்கு அறிவுறுத்தப்பட்ட[a] விஷயங்களின் உறுதியை[b] நீங்கள் அறிந்துகொள்வதற்காக.
  rationale: The revision retains the Greek purpose clause and the ambiguity of ἀσφάλεια, while using more idiomatic modern Tamil. It neither limits Luke’s purpose to subjective assurance nor to objective historical verification.
  reviewer_model: gpt-5.6-terra
