  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: ta
  text: “இஸ்ரவேலின் கடவுளாகிய ஆண்டவர் போற்றப்படுவாராக! ஏனெனில் அவர் தமது மக்களைச் சந்தித்து[a], அவர்களுக்கு மீட்பை ஏற்படுத்தியிருக்கிறார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உதவ வந்திருக்கிறார்.” “சந்தித்து” என்பதற்கான கிரேக்கச் சொல், கடவுள் தமது மக்கள்மீது அக்கறைகொண்டு அவர்களுக்காகச் செயல்படுவதைக் குறிக்கும் வேதாகமச் சொல்லாட்சி.
