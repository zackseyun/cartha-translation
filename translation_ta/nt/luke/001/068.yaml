  source_fidelity: மூலக் கிரேக்கத்தின் வாழ்த்துரைத் தொனி (Εὐλογητός), ‘இஸ்ரவேலின் கடவுளாகிய ஆண்டவர்’ என்ற இணைப்புப் பெயரமைப்பு, காரணத்தை அறிமுகப்படுத்தும் ὅτι, கடவுளின் அக்கறைமிக்க வருகையைக் குறிக்கும் ἐπεσκέψατο, மற்றும் மக்களுக்கான λύτρωσις ஆகியவை நம்பகமாக வெளிப்படுத்தப்பட்டுள்ளன. ‘தமது மக்களைச் சந்தித்து, அவர்களுக்கு மீட்பை ஏற்படுத்தியிருக்கிறார்’ என்பது கிரேக்கத்தில் உட்கிடையாக உள்ள வருகையின் இலக்கையும், மீட்பின் பயனாளியையும் தெளிவாகவும் பொருள்மாற்றமின்றியும் காட்டுகிறது.
