lexical_decisions:
- source_word: Εὐλογητὸς
  choice: போற்றப்படுவாராக
  rationale: இது கடவுளைப் போற்றும் வாழ்த்துரைப் பயன்பாடு. தமிழில் இயல்பான வழிபாட்டு வலிமையுடன் இதை வெளிப்படுத்துகிறது.
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் கடவுளாகிய ஆண்டவர்
  rationale: ‘ஆண்டவர்’ என்பதைத் தெய்வீகப் பட்டமாகவும், அடுத்து வரும் சொற்றொடரை அதனை விளக்கும் அடைமொழியாகவும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: ஆண்டவர் போற்றப்படுவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἐπεσκέψατο
  choice: சந்தித்து
  rationale: அக்கறையுடன் வந்து செயல்படும் கடவுளின் தலையீட்டைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கவுரையாகக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: ἐποίησεν λύτρωσιν
  choice: மீட்பை ஏற்படுத்தியிருக்கிறார்
  rationale: ‘மீட்பைச் செய்தார்’ என்ற சொற்சொற் மொழிபெயர்ப்பின் இயல்பின்மையைத் தவிர்த்து, செயலும் அதன் விளைவும் நிறைவேறியிருப்பதைத் தெரிவிக்கிறது.
- source_word: τῷ λαῷ αὐτοῦ
  choice: தமது மக்களுக்கு
  rationale: மீட்புச் செயலின் பயனாளிகளாக அவருடைய மக்களை இயல்பான தமிழில் காட்டுகிறது; வாக்கியத்தில் ‘தமது மக்களைச் சந்தித்து, அவர்களுக்கு’ என உறவு தெளிவுபடுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளின் வருகையைக் குறிக்கும் மொழிநடை
  choice: சந்தித்து
  alternative: உதவ வந்திருக்கிறார்
  rationale: இச்சொல் கடவுளின் உடன்படிக்கை சார்ந்த, அக்கறையுள்ள மீட்புத் தலையீட்டைக் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது; அதன் பொருளை ‘உதவி’ என்று மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘போற்றப்படுவாராக’ என்ற வடிவம் வாழ்த்துரைத் தொனியையும், ‘சந்தித்து’ என்ற சொல் மூலத்தின் வேதாகம உருவகத்தையும் பாதுகாக்கின்றன.
