id: LUK.1.58
reference: Luke 1:58
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: ta
  text: அவளுடைய அக்கம்பக்கத்தாரும் உறவினர்களும், ஆண்டவர் அவளுக்கு மிகுந்த இரக்கம் காட்டியதைக் கேள்விப்பட்டு, அவளோடு சேர்ந்து மகிழ்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: அக்கம்பக்கத்தார்
  rationale: சுற்றுப்புறத்தில் வசிப்பவர்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: συγγενεῖς
  choice: உறவினர்கள்
  rationale: இரத்த அல்லது குடும்ப உறவுடையவர்களைக் குறிக்கும் பொதுவான, இயல்பான தமிழ் சொல்.
- source_word: ἐμεγάλυνεν
  choice: பெரிதாக வெளிப்படுத்திய
  rationale: ‘பெரிதாக்குதல்/மகத்துவப்படுத்துதல்’ என்ற வினையின் வலிமையை ஓரளவு காத்துக்கொண்டு, இரக்கத்துடன் வரும் இச்சூழலில் இயல்பான தமிழை வழங்குகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இச்சூழலில் கடவுளைக் குறிக்கும் திட்டவட்டமான பட்டப்பெயர்; தமிழ் வேதாகம நடையில் பரவலாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: கருணையுடன் உதவும் மனப்பான்மையைத் தெரிவிக்கும் ἔλεος என்பதற்கான தெளிவான, வழக்கமான இணைச்சொல்.
- source_word: μετ’ αὐτῆς
  choice: அவளிடம்
  rationale: சொல்லுக்கு சொல் ‘அவளுடன்’ என இருந்தாலும், μεγαλύνω … ἔλεος என்ற மொழிவழக்கில் இரக்கம் அவளுக்குச் செய்யப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: συνέχαιρον αὐτῇ
  choice: அவளோடு சேர்ந்து மகிழ்ந்தார்கள்
  rationale: அவளுடைய மகிழ்ச்சியில் மற்றவர்களும் இணைந்தார்கள் என்ற கூட்டுமகிழ்ச்சியின் பொருளை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ἐμεγάλυνεν … τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς என்ற மொழிவழக்கை மொழிபெயர்த்தல்
  choice: ஆண்டவர் அவளிடம் தமது இரக்கத்தைப் பெரிதாக வெளிப்படுத்தினார்
  alternative: ஆண்டவர் அவளுக்கு மிகுந்த இரக்கம் காட்டினார்
  rationale: முதன்மை உரை μεγαλύνω என்பதன் ‘பெரிதாக்குதல்’ சார்ந்த வலிமையைத் தக்கவைத்தபடியே தமிழில் புரியும்படி அமைக்கப்பட்டுள்ளது; அடிக்குறிப்பில் இன்னும் இயல்பான மாற்று தரப்படுகிறது. இதனால் கடவுளுடைய இரக்கமே வலியுறுத்தப்படுகிறது; கூடுதல் கோட்பாட்டு விளக்கம் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குத் தெளிவான, கண்ணியமான நடை. கிரேக்கத்தின் வலியுறுத்தலைக் காக்க ‘இரக்கத்தைப் பெரிதாக வெளிப்படுத்திய’ எனவும், இயல்பான மாற்றை அடிக்குறிப்பிலும் வழங்கியுள்ளது.
