id: LUK.1.15
reference: Luke 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: ta
  text: ஏனெனில், அவன் ஆண்டவரின் பார்வையில் பெரியவனாக இருப்பான். அவன் திராட்சரசமோ வேறு போதைபானமோ அருந்தவே மாட்டான்;[a][b] தன் தாயின் கருவிலிருந்தே[c] பரிசுத்த ஆவியால் நிரப்பப்படுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் திராட்சரசமோ வேறு போதைபானமோ ஒருபோதும் அருந்தக்கூடாது.” கிரேக்கத்தில் மறுப்பு மிகவும் வலியுறுத்தப்பட்டுள்ளது; அது உறுதியான முன்னறிவிப்பாகவோ, அவனுடைய அர்ப்பணிக்கப்பட்ட அழைப்புக்குரிய தடையாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வேறு போதைபானம்” என்பது திராட்சரசத்தைத் தவிர போதைதரும் பிற பானங்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “தன் தாயின் கருவிலிருக்கும்போதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: பெரியவனாக
  rationale: முக்கியத்துவத்தையும் மேன்மையையும் அளவுக்கு மீறி விளக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: ஆண்டவரின் பார்வையில்
  rationale: ஆண்டவருக்கு முன்பாக அல்லது அவரது மதிப்பீட்டில் என்ற உறவுசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: οἶνον καὶ σίκερα
  choice: திராட்சரசமோ மதுபானமோ
  rationale: οἶνος என்பதைக் குறிப்பான திராட்சரசமாகவும், σίκερα என்பதைக் திராட்சரசமல்லாத போதைதரும் பானங்களை உள்ளடக்கும் பொதுச் சொல்லாகவும் வேறுபடுத்துகிறது.
- source_word: οὐ μὴ πίῃ
  choice: அருந்தவே மாட்டான்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட எதிர்மறையையும் எதிர்கால அறிவிப்பின் வடிவையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது; கட்டளையாக மட்டும் மாற்றவில்லை.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: பரிசுத்த ஆவியால் நிரப்பப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் லூக்காவின் சூழலில் உள்ள தெய்வீக ஆவியைக் குறிக்கும் பொருளையும் காக்கிறது.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: தன் தாயின் கருவிலிருக்கும்போதே
  rationale: மிக ஆரம்பமான, பிறப்புக்கு முந்திய காலத்தைக் குறிக்கும் தொடரை இயல்பாகத் தருகிறது; ἔτι என்பதன் வலியுறுத்தலை ‘-போதே’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: 'οὐ μὴ πίῃ என்பதன் வலியுறுத்தப்பட்ட எதிர்மறை: தீர்க்கதரிசனமா அல்லது தடைச்சொல்லா'
  choice: 'எதிர்கால உறுதியான மறுப்பு: “அருந்தவே மாட்டான்”'
  alternative: 'கடமையாக்கப்பட்ட தடை: “ஒருபோதும் அருந்தக்கூடாது”'
  rationale: கிரேக்க வடிவம் வலுவான எதிர்கால மறுப்பை நேரடியாகக் காட்டுகிறது. அர்ப்பணிக்கப்பட்ட அழைப்பின் பின்னணி இருந்தாலும், வசனத்தை வெளிப்படையான கட்டளையாக மாற்றாமல் அதன் வலிமையைப் பாதுகாக்கிறது.
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: தெய்வீக நபரைக் குறிக்கும் “பரிசுத்த ஆவி”
  alternative: தனிப்பட்ட நபரல்லாத பரிசுத்த ஆற்றல் அல்லது மனநிலை
  rationale: லூக்காவின் உடனடி இலக்கியப் பயன்பாடு கடவுளுடைய ஆவியையே சுட்டுகிறது; எனவே தமிழில் வழக்கமான தனிப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
- issue: ἔτι ἐκ κοιλίας என்ற காலப்பொருள்
  choice: தாயின் கருவிலிருக்கும்போதே
  alternative: தாயின் கருவிலிருந்து, அதாவது பிறந்ததிலிருந்து
  rationale: இந்தத் தொடர் கருவிலிருந்த காலத்தையே குறிக்கக்கூடும்; யோவான் பிறந்த பின்னரிலிருந்து மட்டுமே என்று சுருக்காமல் பிறப்புக்கு முந்திய சாத்தியத்தைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. “ஆண்டவரின் பார்வையில்” என்பது தெளிவான வழிபாட்டு மொழிநடையையும் சாதாரண வாசகருக்கான புரிதலையும் இணைக்கிறது. “அருந்தவே மாட்டான்” என்பது கிரேக்கத்தின் வலியுறுத்தலைத் தருவதோடு, முன்னறிவிப்பு–தடை என்ற உண்மையான விளக்கத் தளர்வை அடிக்குறிப்பில் பாதுகாக்கிறது.
