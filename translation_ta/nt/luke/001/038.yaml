id: LUK.1.38
reference: Luke 1:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: ta
  text: அதற்கு மரியாள், “இதோ, நான் ஆண்டவரின் பணியாள்[a]. உமது வார்த்தையின்படியே எனக்கு நிகழட்டும்[b]” என்றாள். பின்பு தேவதூதர் அவளைவிட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரின் பெண் அடிமை.” கிரேக்கச் சொல் δούλη ஒரு பெண் அடிமையையோ பணியாளையையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உமது வார்த்தையின்படியே எனக்கு ஆகட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அதற்கு
  rationale: இது முந்தைய அறிவிப்புக்கான மரியாளின் பதிலை இயல்பான தமிழில் இணைக்கிறது; கிரேக்க இணைப்புச் சொல்லுக்கு இல்லாத வலுவான காலக் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: மரியாளின் பணிவான, வலியுறுத்தப்பட்ட தன்னறிமுகத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தக்கவைக்கிறது.
- source_word: δούλη
  choice: பணியாள்
  rationale: பெண்பால் வடிவமான இச்சொல் அடிமையையோ பணியாளையையோ குறிக்கலாம். இங்கு கடவுளுக்குப் பணிந்து ஒப்புக்கொடுப்பது முன்னிலையில் இருப்பதால் இயல்பான ‘பணியாள்’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; வலுவான அடிமைநிலைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: தெய்வீகப் பட்டமான κύριος என்பதையும் மரியாள் ஆண்டவருக்குரியவள் என்ற உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γένοιτό μοι
  choice: எனக்கு நிகழட்டும்
  rationale: இறந்தகால optative வடிவம் வெளிப்படுத்தும் விருப்பமுள்ள சம்மதத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் எதிர்காலக் கூற்றாக மாற்றுவதில்லை.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: உமது வார்த்தையின்படியே
  rationale: தூதர் கூறிய குறிப்பிட்ட அறிவிப்புக்கு ஏற்ப நிகழ வேண்டும் என்ற பொருளைத் தக்கவைக்கிறது; ῥῆμα என்பதற்கு ‘வார்த்தை’ என்ற நேரடியான தேர்வையும் பாதுகாக்கிறது.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: அவளைவிட்டுச் சென்றார்
  rationale: தூதர் அவளிடமிருந்து அகன்றார் என்ற காட்சியை இயல்பான தமிழ் நடையில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὁ ἄγγελος
  choice: தூதர்
  rationale: லூக்காவின் இச்சூழலில் இது மனிதச் செய்தியாளரை அல்ல, தேவதூதரைக் குறிக்கிறது; ‘தூதர்’ என்பது கண்ணியமான, வழக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: மரியாளின் δούλη என்ற தன்னடையாளம்
  choice: ஆண்டவரின் பணியாள்
  alternative: ஆண்டவரின் பெண் அடிமை
  rationale: சொல் சட்ட அல்லது சமூக அடிமை நிலையையும் குறிக்கக்கூடும். ஆனால் இச்சூழலில் மரியாளின் பணிவும் கடவுளுடைய சித்தத்துக்கு அவர் அளிக்கும் ஒப்புதலும் முன்னிலைப்படுகின்றன. வலுவான மாற்றுப் பொருள் மறைக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: γένοιτό μοι என்பதன் வலிமை
  choice: எனக்கு நிகழட்டும்
  alternative: எனக்கு ஆகட்டும்
  rationale: இது வெறும் முன்னறிவிப்பல்ல; மரியாளின் விருப்பமுள்ள ஏற்பை வெளிப்படுத்தும் optative வடிவம். ‘நிகழட்டும்’ அதைத் தெளிவாகத் தெரிவிக்கிறது; மேலும் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’, ‘ஆண்டவர்’, ‘வார்த்தை’ ஆகியவை வசனத்தின் உயர்ந்த தொனியைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
