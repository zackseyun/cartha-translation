- from: அதற்கு மரியாள், “இதோ, நான் ஆண்டவரின் பணியாள்[a]. உமது வார்த்தையின்படியே எனக்கு நிகழட்டும்[b]” என்றாள். பின்பு தூதர் அவளைவிட்டுச் சென்றார்.
  to: அதற்கு மரியாள், “இதோ, நான் ஆண்டவரின் பணியாள்[a]. உமது வார்த்தையின்படியே எனக்கு நிகழட்டும்[b]” என்றாள். பின்பு தேவதூதர் அவளைவிட்டுச் சென்றார்.
