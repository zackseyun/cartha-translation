  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: ta
  text: குழந்தையே, நீயும் உன்னதமானவரின் இறைவாக்கினர் என்று அழைக்கப்படுவாய். ஏனெனில், ஆண்டவருக்கு முன்பாக[a] சென்று, அவருடைய வழிகளை ஆயத்தப்படுத்துவாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டவரின் முன்னிலையில் சென்று.’ இந்தச் சொற்றொடர் ஒருவருக்கு முன்னால் செல்வதையோ அவரது முன்னிலையில் பணியாற்றுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இந்தச் சொற்கள் ஆண்டவருக்கு முன்பாக வழியை ஆயத்தப்படுத்துவது பற்றிய தீர்க்கதரிசன வாக்குறுதிகளை எதிரொலிக்கின்றன (ஒப்பிடுக: ஏசாயா 40:3; மல்கியா 3:1). லூக்காவின் கதையில் இது இயேசுவுக்கு முன்பாக யோவான் செய்த பணியில் நிறைவேறுகிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: நீயும்
  rationale: முன்னர் கூறப்பட்டவற்றிலிருந்து குழந்தையை நேரடியாக நோக்கித் திரும்பும் வலியுறுத்தலையும், சேர்க்கைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: παιδίον
  choice: குழந்தையே
  rationale: குழந்தை யோவானை நேரடியாக அழைக்கும் விளிவேற்றுமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: προφήτης
  choice: இறைவாக்கினர்
  rationale: கடவுளிடமிருந்து செய்தியை அறிவிப்பவரைக் குறிக்கும் சொல்லை நவீனத் தமிழில் மரியாதையுடன் தருகிறது.
- source_word: Ὑψίστου
  choice: உன்னதமானவரின்
  rationale: இது கடவுளைக் குறிக்கும் உயர்வுமிக்க பட்டம்; கிரேக்க உரையின் உரிமைத் தொடர்பையும் காக்கிறது.
- source_word: κληθήσῃ
  choice: என்று அழைக்கப்படுவாய்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், ஒருவருக்கு வழங்கப்படும் அடையாளம் அல்லது அங்கீகாரம் என்ற பொருளையும் காக்கிறது.
- source_word: προπορεύσῃ
  choice: முன்பாகச் சென்று
  rationale: ஒருவருக்கு முன்னால் செல்வது என்ற அடிப்படைப் பொருளையும், முன்னோடிப் பணியின் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον κυρίου
  choice: ஆண்டவருக்கு முன்பாக
  rationale: முன்னால் செல்வது என்றும் முன்னிலையில் பணியாற்றுவது என்றும் புரிந்துகொள்ளக்கூடிய மூலத்தின் பொருள் விரிவை முதன்மை உரையில் குறுக்காமல் காக்கிறது.
- source_word: ἑτοιμάσαι
  choice: ஆயத்தப்படுத்துவாய்
  rationale: முன்னால் செல்வதன் நோக்கத்தைத் தமிழில் தெளிவான வினை வடிவில் தருகிறது.
- source_word: ὁδοὺς αὐτοῦ
  choice: அவருடைய வழிகளை
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, தீர்க்கதரிசனப் பின்னணியிலுள்ள ‘வழியை ஆயத்தப்படுத்துதல்’ என்ற மொழிநடையின் எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: முன்னோடி குறித்த தீர்க்கதரிசனத்தில் ‘ஆண்டவர்’ என்பவர் யார்?
  choice: κύριος என்பதை ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்து, முதன்மை உரையிலேயே அதன் குறிப்பை ஒரே நபருக்குள் குறுக்கவில்லை.
  alternative: ஏசாயா மற்றும் மல்கியா பின்னணியின் அடிப்படையில் ஆண்டவராகிய கடவுள்; லூக்காவின் கதை நிறைவேற்றத்தின் அடிப்படையில் ஆண்டவராகிய இயேசு.
  rationale: பழைய ஏற்பாட்டு எதிரொலி கடவுளுக்கு முன்பாக வழியை ஆயத்தப்படுத்துவதைச் சுட்டுகிறது; லூக்காவின் கதையோ யோவானை இயேசுவின் முன்னோடியாகக் காட்டுகிறது. எனவே இந்த இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையைக் கடைப்பிடிக்கிறது. ‘இறைவாக்கினர்,’ ‘உன்னதமானவர்,’ ‘ஆண்டவர்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்றவையாக இருந்தாலும் அளவுக்கு மீறிய பழமைநடையைத் தவிர்க்கின்றன.
