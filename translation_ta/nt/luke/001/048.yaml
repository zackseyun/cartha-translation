source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: ta
  text: ஏனெனில், அவர் தமது அடிமைப் பெண்ணின்[a] தாழ்ந்த நிலையைக்[b] கண்ணோக்கினார். இதோ, இப்போதுமுதல் எல்லாத் தலைமுறையினரும் என்னைப் பேறுபெற்றவள் என்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமைப் பெண்’ என்பதை ‘பணிப்பெண்’ அல்லது ‘ஊழியக்காரி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘தாழ்ந்த நிலை’ என்பதை ‘சிறுமை,’ ‘தாழ்நிலை’ அல்லது ‘அவமானநிலை’ என்றும் மொழிபெயர்க்கலாம்; இங்கு உள்ளார்ந்த தாழ்மை மட்டுமே பொருள் என்று கொள்ள வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: கண்ணோக்கினார்
  rationale: ஒருவர்மீது கவனத்தைத் திருப்பிப் பார்ப்பதையும், இச்சூழலில் அருளான கவனத்தையும் குறிக்கிறது. ‘கண்ணோக்கினார்’ என்பது பாடல் நடைக்கு ஏற்ற, இயல்பான மரியாதைமிக்க சொல்லாகும்; மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: ταπείνωσιν
  choice: தாழ்ந்த நிலை
  rationale: இங்கு மரியாவின் உள்ளார்ந்த தாழ்மையை மட்டும் அல்லாமல், அவரது சமூகத் தாழ்நிலையையும் எளிய நிலையையும் குறிக்கிறது. ‘தாழ்ந்த நிலை’ இந்தப் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: δούλης
  choice: அடிமைப் பெண்
  rationale: பெண்பால் வடிவமான δούλη, ஒருவருக்குச் சொந்தமாகவும் முழுமையாகக் கீழ்ப்பட்டும் இருப்பவரைக் குறிக்கிறது. ‘அடிமைப் பெண்’ அந்த வலிமையான உறவைக் குறைக்காமல் தமிழில் பாலினத்தையும் தெளிவுபடுத்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் வலியுறுத்தலை இயல்பாகவும் பாடலுக்குரிய கண்ணியமான நடையிலும் தக்கவைக்கிறது.
- source_word: ἀπὸ τοῦ νῦν
  choice: இப்போதுமுதல்
  rationale: தற்போதைய தருணத்திலிருந்து தொடரும் காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μακαριοῦσίν με
  choice: என்னைப் பேறுபெற்றவள் என்பார்கள்
  rationale: மரியாவை ஆசீர்வதிப்பார்கள் என்று அல்லாமல், அவர் பேறுபெற்றவர் என்று அறிவிப்பார்கள் அல்லது ஏற்றுக்கொள்வார்கள் என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: πᾶσαι αἱ γενεαί
  choice: எல்லாத் தலைமுறையினரும்
  rationale: அடுத்தடுத்து வரும் மனிதத் தலைமுறைகள் அனைத்தையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: மரியா தம்மை δούλη என்று குறிப்பிடுதல்
  choice: அடிமைப் பெண்
  alternative: பணிப்பெண்; ஊழியக்காரி
  rationale: கடவுளுக்குரியவராகவும் அவருக்குக் கீழ்ப்பட்டவராகவும் இருப்பதன் வலிமையை மென்மைப்படுத்தாமல் தருகிறது; அதேவேளையில் பின்னாளைய மரியாள் குறித்த எந்தக் கோட்பாட்டையும் வசனத்தில் புகுத்துவதில்லை.
- issue: ταπείνωσις என்பதன் பொருள்
  choice: தாழ்ந்த நிலை
  alternative: தாழ்மை; சிறுமை; அவமானநிலை
  rationale: இந்தச் சொல் உள்ளார்ந்த பணிவை மட்டும் குறிக்கிறது என்று முடிவுசெய்யாமல், மரியாவின் எளிய சமூக நிலையையும் அவரது சிறுமையையும் உள்ளடக்கும் பொருள் இடத்தைப் பாதுகாக்கிறது.
- issue: μακαρίζω என்பதன் செயற்பாடு
  choice: பேறுபெற்றவள் என்பார்கள்
  alternative: பாக்கியவதி என்று அழைப்பார்கள்; பேறுபெற்றவள் என்று மதிப்பார்கள்
  rationale: தலைமுறைகள் மரியாவுக்கு ஆசீர்வாதம் அளிக்கின்றன என்ற பொருளைத் தவிர்த்து, அவர் பேறுபெற்றவர் என்று அறிவிப்பதையே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாவின் பாடலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்ணோக்கினார்,’ ‘இதோ,’ ‘பேறுபெற்றவள்’ ஆகியவை உயர்ந்ததாய் இருந்தாலும் பொதுவாசகர்களுக்குப் புரியும் சொற்கள். மூலத்தின் காரண இணைப்பான ‘ஏனெனில்’ தக்கவைக்கப்பட்டுள்ளது.
