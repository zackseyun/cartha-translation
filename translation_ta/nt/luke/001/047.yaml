  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: ta
  text: என் ஆவியும் என் மீட்பரான கடவுளில் களிகூர்ந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேருவகை கொண்டது.”
    reason: ἠγαλλίασεν என்பதன் தீவிரமான மகிழ்ச்சியை வெளிப்படுத்தும் மற்றொரு இயல்பான தமிழ் மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: καὶ
  choice: என்
  rationale: இவ்வசனம் முந்தைய வசனத்தின் இணைநிலை வாக்கியத்தைத் தொடர்கிறது. தமிழில் தனி வசனமாக வாசிக்கும்போது தொடக்கத்தில் ‘மற்றும்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், இணைப்பு கவிதை அமைப்பாலும் தொடர்ச்சியாலும் வெளிப்படும்படி விடப்பட்டுள்ளது.
- source_word: ἠγαλλίασεν
  choice: களிகூர்ந்தது
  rationale: இந்த வினை மிகுந்த, பொங்கிய மகிழ்ச்சியைச் சுட்டுகிறது. ‘களிகூர்ந்தது’ அதன் வலிமையையும் மரியாதையான பாடல் நடையையும் காக்கிறது; கிரேக்க இறந்தகால வினையின் நிறைவு உணர்வும் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: τὸ πνεῦμά μου
  choice: என் ஆவி
  rationale: முந்தைய வசனத்திலுள்ள ‘என் ஆன்மா’ என்பதுடன் கவிதை இணைநிலையைப் பேணுவதோடு, கிரேக்கத்தில் பயன்படுத்தப்பட்ட வேறுபட்ட சொல்லையும் அப்படியே காக்கிறது. இவை முற்றிலும் ஒரே பொருளா அல்லது மனிதரின் வேறுபட்ட அம்சங்களா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἐπὶ τῷ θεῷ
  choice: கடவுளில்
  rationale: ἐπί + வேற்றுமை இங்கு மகிழ்ச்சியின் அடிப்படை அல்லது காரணத்தைச் சுட்டலாம். ‘கடவுளில் களிகூர்ந்தது’ என்பது உறவுசார் கவனத்தையும் மூலத்தின் சுருக்கத்தையும் காக்கும் இயல்பான சமயத் தமிழ் நடை.
- source_word: τῷ σωτῆρί μου
  choice: என் மீட்பரான
  rationale: σωτήρ என்பதற்கு ‘மீட்பர்’ என்பது புதிய ஏற்பாட்டுச் சூழலில் நேரடியான, வழக்கமான தமிழ் இணை. இது கடவுளை மரியாவின் சொந்த மீட்பராகத் தெளிவாக அடையாளப்படுத்துகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவுகளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: கடவுளை மரியா ‘என் மீட்பர்’ என்று அழைப்பது
  choice: என் மீட்பரான கடவுள்
  alternative: என்னை விடுவிப்பவரான கடவுள்
  rationale: கிரேக்கம் கடவுளை நேரடியாக மரியாவின் மீட்பராக அடையாளப்படுத்துகிறது. ‘மீட்பர்’ அந்த இறையியல் வலிமையை மெலிதாக்காமல் காக்கிறது; ஆனால் வசனம் சொல்லாத மேலதிக முடிவுகளைச் சேர்க்கவில்லை.
- issue: சுற்றியுள்ள கவிதை இணைநிலையில் ‘ஆவி’க்கும் ‘ஆன்மா’வுக்கும் உள்ள தொடர்பு
  choice: வேறுபட்ட மூலச் சொற்களை வேறுபட்ட தமிழ்ச் சொற்களாகப் பேணுதல்
  alternative: இரண்டையும் ஒரே தமிழ்ச் சொல்லால் மொழிபெயர்த்தல்
  rationale: கவிதை இணைநிலை இச்சொற்களிடையே பொருள் ஒட்டுமையை உணர்த்தினாலும், கிரேக்கம் இரண்டு வேறுபட்ட சொற்களைப் பயன்படுத்துகிறது. அவற்றைத் தனித்தனியாக வைத்திருப்பது உரையின் இலக்கிய மற்றும் இறையியல் திறந்தநிலையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய மரியாதையான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘களிகூர்ந்தது’ அன்றாடப் பேச்சைவிட உயர்ந்த நடையுடையதாயினும், துதிப்பாடல் சூழலுக்கு இயல்பானதும் பரவலாகப் புரியக்கூடியதும் ஆகும்.
