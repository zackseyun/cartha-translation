  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: ta
  text: 'அவன் தன் பிரிவின் ஒழுங்கின்படி கடவுளின் முன்னிலையில் ஆசாரியச் சேவை செய்துகொண்டிருந்தபோது, நிகழ்ந்தது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: இவ்வாறு நிகழ்ந்தது
  rationale: கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான தொடரைத் தருகிறது; δέ-யின் மென்மையான இணைப்புத்தன்மையைத் தமிழில் தனிச்சொல்லால் மிகைப்படுத்தாமல் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: அவன் ... ஆசாரியப் பணியாற்றிக்கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் காலப்பொருளை (‘போது’) தருகிறது; ἱερατεύω குறிப்பாக ஆசாரியச் சேவையைக் குறிக்கிறது.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: தன் பிரிவின் முறைப்படி
  rationale: τάξις இங்கு ஒழுங்கு அல்லது நியமிக்கப்பட்ட முறை என்பதையும், ἐφημερία ஆலயப் பணிக்கான ஆசாரியப் பிரிவைக் குறிப்பதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔναντι τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: கடவுளுடைய சந்நிதியில் நடைபெறும் ஆலயச் சேவையைத் தெளிவாகக் குறிக்கும் நவீன, கண்ணியமான நடை.
theological_decisions:
- issue: சகரியாவின் ஆலய ஆசாரியச் சேவைக்கான வழிபாட்டு மொழி
  choice: தன் பிரிவின் முறைப்படி கடவுளின் முன்னிலையில் ஆசாரியப் பணியாற்றுதல்
  alternative: தன் ஆசாரியப் பிரிவின் பணிச்சுழற்சிப்படி கடவுளுக்கு முன்பாக ஆசாரியச் சேவை செய்தல்
  rationale: வரலாற்று ஆலயப் பணிமுறையைப் பாதுகாக்கிறது; பிற்கால திருச்சபை அமைப்புகள் அல்லது பிரிவுசார் கருத்துகளை உரைக்குள் கொண்டுவரவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. அடுத்த வசனத்தில் நிறைவடையும் கிரேக்கக் கதையறிமுக அமைப்பை உணர்த்த இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
