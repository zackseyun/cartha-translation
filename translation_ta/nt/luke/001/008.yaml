- from: 'அவன் தன் பிரிவின் முறைப்படி கடவுளின் முன்னிலையில் ஆசாரியப் பணியாற்றிக்கொண்டிருந்தபோது, இவ்வாறு நிகழ்ந்தது:'
  to: 'அவன் தன் பிரிவின் ஒழுங்கின்படி கடவுளின் முன்னிலையில் ஆசாரியச் சேவை செய்துகொண்டிருந்தபோது, நிகழ்ந்தது:'
  rationale: The revision removes the unsupported demonstrative “இவ்வாறு” and renders τάξει as “ஒழுங்கின்படி,” while preserving the source’s unfinished narrative introduction and its continuation into the following verse.
