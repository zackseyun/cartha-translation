id: LUK.1.13
reference: Luke 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: ta
  text: ஆனால் தூதன் அவரிடம், “சகரியாவே, பயப்படாதே; ஏனெனில் உன் வேண்டுதல்[a] கேட்கப்பட்டது. உன் மனைவி எலிசபெத் உனக்கு ஒரு மகனைப் பெற்றெடுப்பாள்; அவனுக்கு யோவான் என்று பெயரிடுவாய்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் மன்றாட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘அவனுடைய பெயரை யோவான் என்று அழைப்பாய்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος
  choice: ஆனால் தூதன் அவரிடம் ... என்றான்
  rationale: δέ இங்கு மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது; முந்தைய வசனத்தில் சகரியா பயந்ததிலிருந்து தூதனின் பதிலுக்கு நகர்வதை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது. ἄγγελος இச்சூழலில் விண்ணுலகத் தூதனைக் குறிக்கிறது.
- source_word: Μὴ φοβοῦ, Ζαχαρία
  choice: சகரியாவே, பயப்படாதே
  rationale: தற்போதைய அச்சத்தைக் களையும் நேரடியான தடைமொழியாக இயல்பான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது; அழைப்புவேற்றுமை பாதுகாக்கப்பட்டுள்ளது.
- source_word: διότι εἰσηκούσθη ἡ δέησίς σου
  choice: ஏனெனில் உன் வேண்டுதல் கேட்கப்பட்டது
  rationale: διότι காரணத்தை அறிமுகப்படுத்துகிறது. δέησις என்பது தேவையை முன்வைக்கும் உருக்கமான வேண்டுதல் அல்லது மன்றாட்டு; ‘வேண்டுதல்’ இதை இயல்பாகத் தருகிறது. இறைவனை வெளிப்படையாகச் சேர்க்காமல் கிரேக்கத்தின் செயப்பாட்டு வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: உன் மனைவி எலிசபெத்
  rationale: உடைமைச் சூழலில் γυνή தெளிவாக ‘மனைவி’ எனப் பொருள்படுகிறது; பெயர் நவீனத் தமிழில் எளிதாக அறியப்படும் வடிவில் தரப்பட்டுள்ளது.
- source_word: γεννήσει υἱόν σοι
  choice: உனக்கு ஒரு மகனைப் பெற்றெடுப்பாள்
  rationale: பெண் எழுவாயுடன் γεννάω என்பது குழந்தையைப் பெற்றெடுப்பதைக் குறிக்கிறது. σοι தரும் தனிப்பட்ட நன்மை அல்லது உறவு ‘உனக்கு’ என்பதால் நேரடியாகத் தக்கவைக்கப்படுகிறது.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: அவனுக்கு யோவான் என்று பெயரிடுவாய்
  rationale: கிரேக்க மொழிமரபின் சொற்சொல் வடிவத்தைத் திணிக்காமல், அதே பொருளையும் அறிவிப்பின் உறுதியையும் இயல்பான தமிழில் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: ‘கேட்கப்பட்டது’ என்ற செயப்பாட்டு வினையின் மறைமுகச் செய்பவர்
  choice: இறைவன் வேண்டுதலைக் கேட்டார் என்பது சூழலில் மறைமுகமாக இருக்கும்படி செயப்பாட்டு வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘இறைவன் உன் வேண்டுதலைக் கேட்டார்’ என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்
  rationale: யூத இறைவேண்டல் சூழலில் இறைவனே மறைமுகச் செய்பவர் என்பது இயல்பான புரிதல். இருப்பினும் கிரேக்க உரை அவரை இங்கு வெளிப்படையாகப் பெயரிடாததால், மொழிபெயர்ப்பும் அதனை மிகுதியாக விளக்கவில்லை.
- issue: எதிர்காலப் பெயரிடுதலின் கட்டளை அல்லது உறுதி நுணுக்கம்
  choice: ‘பெயரிடுவாய்’ என்று வடிவத்தின் எதிர்கால உறுதியைப் பாதுகாத்தல்
  alternative: ‘பெயரிட வேண்டும்’ என்று வெளிப்படையான கட்டளையாக மாற்றுதல்
  rationale: καλέσεις என்பது இலக்கணரீதியாக எதிர்கால வினை; அறிவிப்பு சூழலில் அது அதிகாரமிக்க வழிகாட்டுதலாகவும் ஒலிக்கலாம். அதை வெளிப்படையான கடமையாக்காமல் இரு நுணுக்கங்களுக்கும் இடமளிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் அறிவிப்பு நிகழ்வுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பாரம்பரியமாக அறியப்படும் ‘யோவான்’ பெயர்வடிவம் தக்கவைக்கப்பட்டுள்ளது; மற்ற பெயர்கள் நவீனப் பயன்பாட்டுக்கு ஏற்ற ‘சகரியா’, ‘எலிசபெத்’ வடிவங்களில் உள்ளன.
