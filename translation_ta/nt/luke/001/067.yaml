source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: ta
  text: 'அவனுடைய தந்தையான சகரியா பரிசுத்த ஆவியால் நிரப்பப்பட்டு, தீர்க்கதரிசனம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்; மூலப் பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: அவனுடைய தந்தை
  rationale: முந்தைய சூழலில் உள்ள குழந்தையைக் குறிக்கும் αὐτοῦ என்பதைக் தெளிவாகவும் இயல்பான தமிழிலும் எடுத்துரைக்கிறது.
- source_word: ἐπλήσθη
  choice: நிரப்பப்பட்டு
  rationale: πίμπλημι வினையின் இறந்தகாலச் செயப்பாட்டு பொருளைத் தக்கவைத்து, அடுத்த செயலுடன் இயல்பாக இணைக்கிறது.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால்
  rationale: நிரப்பப்படுதல் என்ற தமிழ்க் கட்டமைப்புடன் கருவிப் பொருளை ‘ஆல்’ உருபு இயல்பாக வெளிப்படுத்துகிறது; லூக்காவின் சூழலில் இது கடவுளுடைய பரிசுத்த ஆவியைக் குறிக்கிறது.
- source_word: ἐπροφήτευσεν
  choice: தீர்க்கதரிசனமாகப் பேசினார்
  rationale: προφητεύω என்பதன் தேவனால் ஏவப்பட்ட அறிவிப்பு என்ற வினைப் பொருளை சாதாரண நவீனத் தமிழில் தெளிவாகக் கொடுக்கிறது; ‘தீர்க்கதரிசனம் உரைத்தார்’ என்பதைக் காட்டிலும் இயல்பானது.
- source_word: λέγων
  choice: இவ்வாறு ... பேசினார்
  rationale: தொடர்ந்து வரும் தீர்க்கதரிசன உரையை அறிமுகப்படுத்தும் பங்கேற்பு வினையின் செயல்பாட்டை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Καὶ
  choice: —
  rationale: கிரேக்கத்தில் உள்ள தொடரிணைப்பைத் தமிழில் தனி ‘மேலும்/அப்போது’ என்பதனால் கட்டாயமாக வெளிப்படுத்தாமல், வாக்கியத் தொடர்ச்சியால் இயல்பாக உணர்த்தலாம்.
theological_decisions:
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவி
  alternative: ஒரு பரிசுத்த ஆவி
  rationale: லூக்கா–அப்போஸ்தலர் நடபடிகளில் தெய்வீக ஏவுதலுடன் தொடர்புடைய இத்தொடர் கடவுளுடைய ஆவியையே வழக்கமாகக் குறிக்கிறது. ‘பரிசுத்த ஆவி’ என்பது இதைத் தெளிவாக வெளிப்படுத்துகிறது; கூடுதல் சமயக்கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதைமிக்க வேதாகம நடையில் அமைக்கப்பட்டது. ‘தீர்க்கதரிசனமாகப் பேசினார்’ என்பது மூல வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
