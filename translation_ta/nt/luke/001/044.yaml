revisions:
- from: ஏனெனில், இதோ, உன் வாழ்த்தின் ஒலி என் காதுகளை எட்டியவுடன், என் கருப்பையில் இருந்த குழந்தை பேருவகையுடன் துள்ளியது.[a]
  to: ஏனெனில், இதோ, உன் வாழ்த்தின் ஒலி என் காதுகளில் விழுந்தபோது, என் கருப்பையிலுள்ள குழந்தை பேருவகையுடன் துள்ளியது.[a]
