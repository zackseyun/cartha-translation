source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: ta
  text: ஏனெனில், இதோ, உன் வாழ்த்தின் ஒலி என் காதுகளில் விழுந்தபோது, என் கருப்பையிலுள்ள குழந்தை பேருவகையுடன் துள்ளியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கருப்பையிலுள்ள குழந்தை பேருவகையில் துள்ளியது.”
    reason: ἐν ἀγαλλιάσει என்பதை தமிழில் உடனிகழ்ச்சி/முறை என “பேருவகையுடன்” என்றும், இன்னும் வடிவநெருக்கமாக “பேருவகையில்” என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உயிரோட்டமான உரையாடல் குறியீட்டை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ὡς ἐγένετο
  choice: எட்டியவுடன்
  rationale: ஒலி காதுகளை வந்தடைந்த நேரத்திலேயே நிகழ்ந்த உடனடித் தொடர்பை இயல்பாகக் காட்டுகிறது; இங்கு ὡς காலப்பொருளில் வருகிறது.
- source_word: φωνὴ τοῦ ἀσπασμοῦ σου
  choice: உன் வாழ்த்தின் ஒலி
  rationale: φωνή என்பதன் கேட்கத்தக்க தன்மையையும் ἀσπασμός என்பதன் வாழ்த்து என்ற பொருளையும் காக்கிறது.
- source_word: εἰς τὰ ὦτά μου
  choice: என் காதுகளை எட்டிய
  rationale: εἰς என்பதன் திசைநோக்குப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐσκίρτησεν
  choice: துள்ளியது
  rationale: கருப்பையிலுள்ள குழந்தையின் திடீர் அசைவைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐν ἀγαλλιάσει
  choice: பேருவகையுடன்
  rationale: சாதாரண மகிழ்ச்சியை விட மிகுந்த களிப்பைக் குறிக்கும் ἀγαλλίασις என்பதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: τὸ βρέφος
  choice: குழந்தை
  rationale: பிறக்காத அல்லது மிக இளம் குழந்தையைக் குறிக்கக்கூடிய βρέφος என்பதற்கு சூழலில் இயல்பான, கோட்பாட்டுச் சேர்க்கையற்ற சொல்.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: என் கருப்பையில் இருந்த
  rationale: இச்சூழலில் κοιλία குறிக்கும் கருப்பையைத் துல்லியமாக அடையாளப்படுத்துகிறது; தமிழ் வாக்கியத்தில் குழந்தையுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கருப்பையிலுள்ள யோவானைக் குறிக்கும் βρέφος சொல்லின் மொழிபெயர்ப்பு
  choice: குழந்தை
  alternative: சிசு
  rationale: மூலச்சொல் பிறக்காத குழந்தையையும் குறிக்கிறது. “குழந்தை” என்பது தெளிவான நவீனத் தமிழ்; உரை கூறுவதைத் தாண்டிய கோட்பாட்டுக் கூற்றைச் சேர்ப்பதில்லை.
- issue: ἐν ἀγαλλιάσει என்பதன் குழந்தையின் அசைவுடனான தொடர்பு
  choice: பேருவகையுடன் துள்ளியது
  alternative: பேருவகையில் துள்ளியது
  rationale: மூலத்தில் அசைவு மகிழ்ச்சியுடனானதாக விவரிக்கப்படுகிறது; அதன் காரணம் அல்லது குழந்தையின் அறிவுணர்வு குறித்து உரை கூறாதவற்றை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. “இதோ” மூலத்தின் கவனஈர்ப்பை காக்கிறது; “பேருவகை” ἀγαλλίασις என்பதன் தீவிர மகிழ்ச்சியை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
