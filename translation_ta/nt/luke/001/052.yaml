  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: ta
  text: அவர் ஆட்சியாளர்களை[a] அரியணைகளிலிருந்து இறக்கி, தாழ்ந்தவர்களை[b] உயர்த்தியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமையுள்ளவர்களை.” கிரேக்கச் சொல் பொதுவாக அதிகாரமும் வல்லமையும் உள்ளவர்களைக் குறிக்கலாம்; ஆனால் “அரியணைகளிலிருந்து” என்பது இங்கு ஆட்சியாளர்கள் என்ற பொருளை வலுப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாழ்நிலையில் உள்ளவர்களை.” கிரேக்கச் சொல் தாழ்மையுள்ளவர்களையும் சமூக நிலையில் தாழ்வுற்றவர்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: இறக்கி
  rationale: உயர்ந்த அதிகார நிலையிலிருந்து கீழிறக்குதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; வன்முறையையோ பதவிநீக்கத்தின் அரசியல் நடைமுறையையோ தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: δυνάστας
  choice: ஆட்சியாளர்களை
  rationale: இச்சொல் பொதுவாக வல்லமையுள்ளவர்களைக் குறிக்கலாம்; ஆனால் தொடர்ந்து வரும் ‘அரியணைகளிலிருந்து’ என்ற சொற்றொடர் ஆட்சி அதிகாரமுள்ளவர்களை முன்னிறுத்துகிறது.
- source_word: ἀπὸ θρόνων
  choice: அரியணைகளிலிருந்து
  rationale: மூலத்தின் உறுதியான அரசாட்சி உருவகத்தைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத உடைமைக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: ὕψωσεν
  choice: உயர்த்தியிருக்கிறார்
  rationale: நிலை மற்றும் மதிப்பில் உயர்த்துதல் என்ற சமூக, இறையியல் ஒலிவுகளைத் தக்கவைக்கிறது; கிரேக்க இறந்தகாலச் செயலின் நிறைவேறிய தன்மையையும் அதன் தொடரும் விளைவையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: ταπεινούς
  choice: தாழ்ந்தவர்களை
  rationale: தாழ்மையுள்ளவர்கள் என்றும் சமூக நிலையில் தாழ்வுற்றவர்கள் என்றும் புரிந்துகொள்ளக்கூடிய மூலத்தின் பொருள் விரிவை ஓரளவு தக்கவைக்கிறது.
theological_decisions:
- issue: மரியாளின் பாடலில் வரும் இறந்தகால வினைகளின் காலமும் நோக்கும்
  choice: நிறைவேறிய செயலையும் தொடரும் விளைவையும் காட்டும் ‘இறக்கி ... உயர்த்தியிருக்கிறார்’ என்ற வடிவம்
  alternative: எளிய இறந்தகாலமாக ‘இறக்கி ... உயர்த்தினார்’
  rationale: இறைவனுடைய செயலை நிறைவேறியதும் இப்போதும் பொருத்தமுடையதுமாகப் பாடும் வலிமையை இந்த வடிவம் தருகிறது; இது தீர்க்கதரிசன நிறைவேற்றமா, வரலாற்றுச் சுருக்கமா, புகழ்ச்சிப் பாடலின் உறுதியான மொழியா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை’ என்ற வேதாகம அரசாட்சி உருவகம் தக்கவைக்கப்பட்டு, ‘தாழ்ந்தவர்கள்’ என்பதிலுள்ள ஒழுக்கநிலை மற்றும் சமூகநிலை சார்ந்த பொருள் இறுக்கமாகத் தீர்மானிக்கப்படவில்லை.
