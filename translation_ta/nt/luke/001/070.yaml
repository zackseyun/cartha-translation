  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: ta
  text: பழங்காலத்திலிருந்தே தம்முடைய பரிசுத்த தீர்க்கதரிசிகளின் வாய்மூலம் அவர் பேசியபடியே,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொன்மையான காலத்திலிருந்து.” இச்சொற்றொடர் வெகு பழங்காலத்தைக் குறிக்கலாம். சிலர் இதை “நித்தியத்திலிருந்து” என்ற வலுவான பொருளில் எடுத்துக்கொள்கிறார்கள்; ஆனால் இங்கே தீர்க்கதரிசிகள் குறிப்பிடப்படுவதால் “பழங்காலத்திலிருந்தே” என்பதே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: பேசியபடியே
  rationale: முந்தைய கூற்றுக்கும் கடவுள் முன்பு உரைத்ததற்கும் உள்ள ஒத்திசைவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: λαλέω என்பதன் இறந்தகாலச் செயலை நேரடியாகக் காட்டுகிறது; தொடர்ந்து வரும் ‘வாய்மூலம்’ என்ற கருவிப் பொருளுடனும் இயல்பாக இணைகிறது.
- source_word: διὰ στόματος
  choice: வாய்மூலம்
  rationale: தீர்க்கதரிசிகள் வழியாகக் கடவுள் பேசியார் என்ற இடைமுகப் பொருளையும் ‘வாய்’ என்ற உருவகத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: தம்முடைய பரிசுத்த தீர்க்கதரிசிகள்
  rationale: ἁγίων என்பது προφητῶν-ஐப் பண்புப்பெயராக விவரிக்கிறது; ‘பரிசுத்த தீர்க்கதரிசிகள்’ என்பது தெளிவான, வழக்கிலுள்ள வேதாகமத் தமிழ்.
- source_word: ἀπ’ αἰῶνος
  choice: பழங்காலத்திலிருந்தே
  rationale: தொலைந்த பழங்காலம் முதல் நீடிக்கும் தீர்க்கதரிசனச் சாட்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘நித்தியத்திலிருந்து’ என்று அளவுக்கு மீறித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: αὐτοῦ
  choice: தம்முடைய
  rationale: சூழலில் சுட்டப்படுபவர் கடவுள்; தமிழ் தற்சுட்டுப் பெயரடை கடவுளுக்கும் அவருடைய தீர்க்கதரிசிகளுக்கும் உள்ள உறவை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ἀπ’ αἰῶνος என்பதன் கால எல்லை
  choice: இரட்சிப்பு வரலாற்றிலுள்ள தொன்மையான காலம் (‘பழங்காலத்திலிருந்தே’)
  alternative: நித்தியத்திலிருந்து
  rationale: உடனடியான சூழல் தீர்க்கதரிசிகளைச் சுட்டுவதால், சுருக்கமான மெய்யியல் நித்தியத்தைவிடப் பண்டைய தீர்க்கதரிசன வரலாறே முதன்மையாகக் குறிக்கப்படுகிறது; எனினும் மூலச் சொற்றொடரின் விரிந்த காலத் தொனியை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வாய்மூலம்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது; ‘தீர்க்கதரிசி’ என்பது பரவலாக அறியப்பட்ட சமயச் சொல் என்பதால் பயன்படுத்தப்பட்டுள்ளது.
