id: LUK.1.75
reference: Luke 1:75
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: ta
  text: நம் நாட்களெல்லாம் அவருக்கு முன்பாகப் பரிசுத்தத்தோடும் நீதியோடும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயத்தோடும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: -தோடும்
  rationale: இங்கு ἐν என்பது நிலை அல்லது முறையைக் குறிக்கிறது. தமிழில் இணைக்கப்பட்ட உடனிகழ்ச்சி வேற்றுமை உருபு, ஒருவர் எவ்வித பண்புடன் வாழ்கிறார் அல்லது பணிசெய்கிறார் என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁσιότητι
  choice: பரிசுத்தத்தோடும்
  rationale: ὁσιότης கடவுளுடன் உள்ள உறவில் பரிசுத்தம் அல்லது பக்திக்குரிய தன்மையை வலியுறுத்துகிறது. ‘பரிசுத்தம்’ என்பது dignified, familiar theological Tamil and remains distinct from δικαιοσύνη.
- source_word: καὶ
  choice: -ஓடும்
  rationale: இரு இணையான பண்புகளைத் தமிழில் இயல்பாக இணைக்கும் வகையில் ‘பரிசுத்தத்தோடும் நீதியோடும்’ என அமைக்கப்பட்டுள்ளது.
- source_word: δικαιοσύνῃ
  choice: நீதியோடும்
  rationale: இச்சூழலில் இது கடவுளுக்கு முன்பான நேர்மையான, நீதிக்கேற்ற வாழ்வைக் குறிக்கிறது. ‘நீதி’ சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது; ‘நியாயம்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐνώπιον αὐτοῦ
  choice: அவருக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையிலும் பார்வையிலும் என்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: நம் நாட்களெல்லாம்
  rationale: கிரேக்கத்தின் ‘நம்முடைய எல்லா நாட்களும்’ என்ற அமைப்பையும் வாழ்நாள் முழுவதும் என்ற உட்கருத்தையும் கூடுதல் சொல்லைச் சேர்க்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: பவுலின் கடிதங்களுக்கு வெளியேயுள்ள ஒழுக்கவியல் சூழலில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: ὁσιότης உடன் இணைந்து, கடவுளுக்கு முன்பான சரியான வாழ்வை இச்சொல் விவரிக்கிறது. ‘நீதி’ அதன் ஒழுக்க மற்றும் உறவுசார் பரப்பைத் தக்கவைக்கிறது; சமூக அல்லது தீர்ப்புசார் ‘நியாயம்’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வசனத் துணுக்காக அமைக்கப்பட்டுள்ளது. இது முந்தைய வசனத்திலிருந்து தொடரும் இலக்கண அமைப்பு என்பதால் தனி வினைச்சொல் சேர்க்கப்படவில்லை.
