  source_fidelity: 'The translation accurately conveys the two coordinated dative qualities, God''s presence, and the lifelong temporal phrase. The Tamil word order differs from the Greek but preserves the scope: ‘நம் நாட்களெல்லாம்’ qualifies the whole preceding manner of life/service.'
