  terminology: ‘பரிசுத்தம்’ appropriately renders ὁσιότης in its God-related sense. ‘நீதி’ is a suitable established Tamil biblical rendering for δικαιοσύνη and preserves the intended ethical uprightness; the footnoted ‘நியாயம்’ reasonably signals the justice-related lexical possibility without displacing the main rendering.
