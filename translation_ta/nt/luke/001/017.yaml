id: LUK.1.17
reference: Luke 1:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: ta
  text: அவன் எலியாவின் ஆவியிலும் வல்லமையிலும்[c] அவருக்கு முன்பாகச் செல்வான்; தந்தைகளின் இதயங்களைப் பிள்ளைகளை நோக்கித் திருப்பவும், கீழ்ப்படியாதவர்களை நீதிமான்களின் விவேகத்துக்குத் திருப்பவும், ஆண்டவருக்காக நன்கு ஆயத்தமான ஒரு மக்களை ஆயத்தப்படுத்தவும் செல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “எலியாவின் ஆவியிலும் வல்லமையிலும்” என்பது எலியாவைப் போன்ற தீர்க்கதரிசனப் பணியையும் வல்லமையையும் குறிக்கிறது; எலியாவே நேரடியாகத் திரும்பி வருகிறார் என்று அவசியமாகப் பொருள்படாது.
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: அவருக்கு முன்பாகச் செல்வான்
  rationale: முன்னே செல்வது, ஒருவருக்கு முன்பாக அல்லது அவரது முன்னிலையில் செயல்படுவது ஆகிய நுணுக்கங்களை இந்த இயல்பான தமிழ் சொற்றொடர் திறந்தவையாக வைத்திருக்கிறது.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: எலியாவின் ஆவியிலும் வல்லமையிலும்
  rationale: எலியாவோடு தொடர்புடைய தீர்க்கதரிசன ஆவியையும் வல்லமையையும் நேரடியாகப் பிரதிபலிக்கிறது; யோவானே எலியா என்று அடையாளப்படுத்துவதில்லை.
- source_word: ἐπιστρέψαι
  choice: திருப்பவும்
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சமாக இருந்து, திசைமாற்றம் அல்லது மனமாற்றம் ஆகிய இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: தந்தையரின் இதயங்களைப் பிள்ளைகளிடம்
  rationale: மல்கியா 4:6-இன் எதிரொலியைப் பாதுகாத்து, உறவுகள் பிள்ளைகளை நோக்கித் திரும்புவதை இயல்பான தமிழில் கூறுகிறது.
- source_word: ἀπειθεῖς
  choice: கீழ்ப்படியாதவர்களை
  rationale: நம்ப மறுத்தல், இணங்காமை, கலகம் ஆகிய பொருள் வரம்பை அளவுக்கு மீறிக் குறுக்காமல், இச்சூழலின் ஒழுக்கநெறி எதிர்மறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν φρονήσει δικαίων
  choice: நீதிமான்களின் விவேகத்திற்கு
  rationale: φρόνησις குறிக்கும் நடைமுறை அறிவு, புரிதல், மனப்பாங்கு ஆகியவற்றில் ‘விவேகம்’ இங்கு பொருத்தமானது; திசைநோக்கிப் ‘திருப்புதல்’ என்ற தொடரமைப்பையும் தக்கவைக்கிறது.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: ஆண்டவருக்காக ஆயத்தப்படுத்தப்பட்ட ஒரு மக்களைத் தயார்செய்யவும்
  rationale: ἑτοιμάσαι என்ற நோக்கச் செயலும், κατεσκευασμένον குறிக்கும் ஏற்கெனவே உருவாக்கப்பட்ட ஆயத்தநிலையும் வேறுபடுத்திக் காட்டப்படுகின்றன; κύριος ‘ஆண்டவர்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: எலியாவைக் குறிக்கும் மொழியின் அடையாளமும் பங்கும்
  choice: அவன் எலியாவின் ஆவியிலும் வல்லமையிலும் செல்கிறான்
  alternative: எலியாவே நேரடியாகத் திரும்பி வருகிறார் என்று கூறுதல்
  rationale: கிரேக்கம் யோவானை எலியா என்று நேரடியாக அடையாளப்படுத்தாமல், ‘எலியாவின் ஆவியிலும் வல்லமையிலும்’ என்று தீர்க்கதரிசனத் தொடர்ச்சியையும் வல்லமையையும் கூறுகிறது.
- issue: ‘அவர்’ மற்றும் ‘ஆண்டவர்’ என்பவற்றின் குறிப்பு
  choice: மூலத்தில் உள்ளபடி ‘அவருக்கு முன்பாக’ என்றும் ‘ஆண்டவருக்காக’ என்றும் வைத்தல்
  alternative: முதன்மை உரையிலேயே ‘மேசியாவுக்கு/இயேசுவுக்கு முன்பாக’ என்று விரிவுபடுத்துதல்
  rationale: சூழல் குறிப்பை விளக்கினாலும், வசனம் தானாகப் பயன்படுத்தும் பதிற்பெயரையும் பட்டத்தையும் மொழிபெயர்ப்பு பாதுகாக்கிறது; அதனால் உள்ளார்ந்த இணைப்பும் சிறிதளவு தெளிவின்மையும் நீடிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரு நோக்க வினையெச்சங்களையும், ‘அவருக்கு முன்பாக’ என்பதிலுள்ள திறந்த குறிப்பையும், ‘தயார்செய்ய/ஆயத்தப்படுத்தப்பட்ட’ என்ற பொருள் அடுக்கையும் இயன்றவரை பாதுகாக்கிறது.
