id: LUK.1.11
reference: Luke 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: ta
  text: அப்போது ஆண்டவருடைய தூதர் ஒருவர் அவருக்குத் தோன்றி, தூபப் பலிபீடத்தின் வலப்பக்கத்தில் நின்றுகொண்டிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: தோன்றி
  rationale: ὁράω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இக்கதைச் சூழலில் ‘தோன்றினார்’ என்ற அகநிலைப் பொருளில் இயங்குகிறது. ‘தோன்றி’ என்பது திடீரெனக் கண்களுக்குப் புலப்பட்ட நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ எதிர்மறை வேறுபாட்டைவிடக் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; ‘அப்போது’ அந்த முன்னேற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: ὤφθη உடன் வரும் வேற்றுமை உருபு, தோற்றம் யாருக்குக் கிடைத்தது என்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἄγγελος
  choice: தூதர்
  rationale: ஆலயத் தரிசனச் சூழலில் இது வானுலகத் தூதரைக் குறிக்கிறது. தமிழில் ‘தூதர்’ என்பது இந்த வேதாகமப் பயன்பாட்டிற்கு இயல்பானதும் மரியாதையானதும் ஆகும்.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: ἄγγελος κυρίου என்ற உடைமைத் தொடர்பை இயல்பான தமிழில் ‘ஆண்டவருடைய தூதர்’ என வழங்குகிறது.
- source_word: ἑστὼς
  choice: நின்றுகொண்டிருந்தார்
  rationale: Perfect participle, தூதர் தோன்றிய வேளையில் அவர் இருந்த நிலைப்பாட்டையும் இடத்தையும் விவரிக்கிறது. ‘நின்றுகொண்டிருந்தார்’ அந்த நிலைத்த நிலையைக் காட்டுகிறது.
- source_word: ἐκ δεξιῶν
  choice: வலப்பக்கத்தில்
  rationale: இந்த இடவியல் மரபுத்தொடர் பலிபீடத்தின் வலது புறத்தில் இருந்த நிலையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: θυσιαστηρίου
  choice: பலிபீடத்தின்
  rationale: θυσιαστήριον என்பதற்கான நிலையான தமிழ்ச் சொல் ‘பலிபீடம்’; தொடரும் genitive இதைத் தூபத்திற்குரிய பலிபீடமாக அடையாளப்படுத்துகிறது.
- source_word: τοῦ θυμιάματος
  choice: தூபப்
  rationale: Genitive, எந்தப் பலிபீடம் என்பதை அடையாளப்படுத்துகிறது. ‘தூபப் பலிபீடம்’ என்பது இயல்பான தமிழ்க் கூட்டுச்சொல்.
theological_decisions:
- issue: ἄγγελος κυρίου என்பதில் κύριος-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: ‘ஆண்டவர்’ என்பது நவீன நிலையான தமிழில் κύριος என்ற பட்டத்தைத் தெளிவாகவும் மரியாதையாகவும் தருகிறது; குறிப்பிட்ட சமய மரபின் தனிச்சொல்லாக்கத்தைத் தேவையின்றி முன்வைப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியத்தக்க கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தூதர் ஒருவர்’ என்பது indefinite ἄγγελος-ஐ இயல்பாகக் காட்டுகிறது; வானுலகச் சூழல் வசனத்திலேயே தெளிவாக இருப்பதால் கூடுதல் விளக்கச்சொல் சேர்க்கப்படவில்லை.
