source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: ta
  text: ஆண்டவரிடமிருந்து தனக்குச் சொல்லப்பட்டவை நிறைவேறும்[b] என்று நம்பியவள் பேறுபெற்றவள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரிடமிருந்து தனக்குச் சொல்லப்பட்டவை நிறைவேறுவதால் நம்பியவள் பேறுபெற்றவள்.” கிரேக்க இணைப்புச்சொல் காரணத்தையும் குறிக்கக்கூடும்; எனினும் இங்கு நம்பியதன் உள்ளடக்கத்தைக் குறிப்பதே அதிக வாய்ப்புள்ளது.
    reason: alternative_reading
  - marker: b
    text: “நிறைவு பெறும்” அல்லது “முழுமை பெறும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: பேறுபெற்றவள்
  rationale: வெறும் மனமகிழ்ச்சியையோ நல்ல அதிர்ஷ்டத்தையோ குறிக்காமல், கடவுளின் அருளால் கிடைக்கும் சிறப்பான நிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ πιστεύσασα
  choice: நம்பியவள்
  rationale: பெயர்ச்சொல் போன்று செயல்படும் இறந்தகாலப் பங்கேற்பு வடிவத்தையும், நம்பிக்கை கொண்ட செயலைவும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இங்கு மரியா நம்பியதன் உள்ளடக்கத்தை அறிமுகப்படுத்துவது இயல்பான வாசிப்பு. காரணப் பொருளில் ‘ஏனெனில்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τελείωσις
  choice: நிறைவேறும்
  rationale: மூலத்தில் உள்ள ‘நிறைவேற்றம்/நிறைவு’ என்னும் பெயர்ச்சொல் கருத்தை, வாக்குறுதி நிறைவேறுவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: தனக்குச் சொல்லப்பட்டவை
  rationale: முன்னர் அவளிடம் சொல்லப்பட்டவற்றின் உள்ளடக்கத்தையும் மூலத்தின் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
- source_word: παρὰ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: சொல்லப்பட்ட செய்தியின் ஊற்று அல்லது தோற்றம் ஆண்டவர் என்பதை παρά + பிறப்புவேற்றுமை இயல்பாகக் குறிக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இச்சூழலில் வாக்குறுதியின் மூலமாகிய இஸ்ரவேலின் கடவுளைக் குறிக்கும் κύριος என்பதற்கான மரியாதைக்குரிய, வழக்கமான தமிழாக்கம்.
theological_decisions:
- issue: மரியாவின் பேறுபெற்ற நிலைக்கும் அவளுடைய நம்பிக்கைக்கும் ஆண்டவரின் வாக்குறுதிக்கும் உள்ள தொடர்பு
  choice: ஆண்டவரிடமிருந்து தனக்குச் சொல்லப்பட்டவை நிறைவேறும் என்று நம்பியவள் பேறுபெற்றவள் என அறிவிக்கப்படுகிறது.
  alternative: தனக்குச் சொல்லப்பட்டவை நிறைவேறும் என்பதால் நம்பியவள் பேறுபெற்றவள் என வாசிக்கலாம்.
  rationale: πιστεύσασα என்பதோடு ὅτι அறிமுகப்படுத்தும் உள்ளடக்க வாக்கியத்தை இணைப்பதே தொடரியல் மற்றும் சூழலின் அடிப்படையில் இயல்பானது. இருப்பினும் காரணப் பொருளை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பேறுபெற்றவள்’ என்பது ‘மகிழ்ச்சியானவள்’ என்பதைக் காட்டிலும் μακαρία என்பதன் சமய மற்றும் அருள் சார்ந்த கனத்தைச் சிறப்பாகத் தக்கவைக்கிறது.
