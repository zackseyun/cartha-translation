source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: ta
  text: அவர்கள் இருவரும் கடவுளின் பார்வையில் நீதியுள்ளவர்களாய் இருந்தார்கள்; ஆண்டவரின் எல்லாக் கட்டளைகளையும் நியமங்களையும் கடைப்பிடித்து, குற்றஞ்சாட்ட இடமில்லாதவர்களாய் வாழ்ந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர்கள் இருவரும் கடவுளின் பார்வையில் நீதியுள்ளவர்களாகவும் குற்றஞ்சாட்ட இடமில்லாதவர்களாகவும் இருந்தார்கள்; ஆண்டவரின் எல்லாக் கட்டளைகளையும் நியமங்களையும் கடைப்பிடித்தார்கள்.”'
    reason: ἄμεμπτοι என்ற பெயரெச்சம் ‘வாழ்ந்தார்கள்’ என்னும் வாழ்க்கை நடத்தையுடன் இணைவதாகவும், ‘இருந்தார்கள்’ என்னும் நிலைவருணனையுடன் இணைவதாகவும் மொழிபெயர்க்கப்படலாம்; இரு வாசிப்புகளும் பாதுகாக்கப்படுகின்றன.
lexical_decisions:
- source_word: δίκαιοι
  choice: நீதியுள்ளவர்கள்
  rationale: இச்சொல் வெறும் சட்டரீதியான நியாயத்தைக் குறிக்காமல், கடவுளுக்கு முன்பான ஒழுக்க மற்றும் உடன்படிக்கை உண்மைத்தன்மையையும் தக்கவைக்கிறது.
- source_word: ἀμφότεροι
  choice: அவர்கள் இருவரும்
  rationale: சகரியாவுக்கும் எலிசபெத்துக்கும் இந்த வருணனை சமமாகப் பொருந்துகிறது என்ற மூலத்தின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: அவர்களுடைய நீதி மனித மதிப்பீட்டில் மட்டுமல்ல, கடவுளின் பார்வையிலும் அங்கீகரிக்கப்பட்டது என்ற உறவு மற்றும் மதிப்பீட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: πορευόμενοι
  choice: வாழ்ந்துவந்தார்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘நடத்தல்’ என்றாலும், இங்கு அது வாழ்க்கை முறையைக் குறிக்கிறது; நவீனத் தமிழில் ‘வாழ்ந்துவந்தார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: கட்டளைகள் ... அனைத்தின்படியும்
  rationale: πάσαις என்பதன் முழுமையான அளவையும், கட்டளைகளுக்கு ஏற்ப நடந்த வாழ்க்கையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δικαιώμασιν
  choice: நியமங்கள்
  rationale: கட்டளைகளிலிருந்து தொடர்புடையதாயினும் வேறுபட்ட, விதிக்கப்பட்ட சட்டமுறைகள் அல்லது ஒழுங்குகளைச் சுட்டுகிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் κύριος என்பதற்கு இயல்பான, மரியாதைக்குரிய தமிழ் இணை.
- source_word: ἄμεμπτοι
  choice: குற்றமற்றவர்களாய்
  rationale: இது இலக்கணரீதியாக உரிச்சொல்; அவர்களுடைய வாழ்வு குற்றஞ்சாட்ட இடமில்லாததாக இருந்ததை வலுவாகச் சொல்கிறது. முழுமையான பாவமின்மையை மொழிபெயர்ப்பில் சேர்ப்பதில்லை.
- source_word: ἦσαν δὲ
  choice: இருந்தார்கள்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்புச் சொல். தனித்த வசனமாக இயல்பான தமிழுக்காக வெளிப்படையான இணைப்புச் சொல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἄμεμπτοι முழுமையான பாவமின்மையைக் குறிக்கிறதா?
  choice: கட்டளைகளுக்கும் நியமங்களுக்கும் ஏற்ப குற்றஞ்சாட்ட இடமில்லாமல் வாழ்ந்த நடத்தையை விவரிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: முழுமையான ஒழுக்கப் பரிபூரணத்தையோ பாவமின்மையையோ குறிப்பதாகப் புரிந்துகொள்ளலாம்.
  rationale: உடனடிச் சூழல் ஆண்டவரின் கட்டளைகளையும் நியமங்களையும் கடைப்பிடித்த அவர்களுடைய வாழ்க்கையை விவரிக்கிறது. ‘குற்றமற்றவர்களாய்’ என்ற வலுவான சொல்லைத் தக்கவைத்து, வசனம் வெளிப்படையாகக் கூறாத கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
- issue: ἄμεμπτοι எதனுடன் முதன்மையாக இணைகிறது?
  choice: πορευόμενοι உடன் இணைத்து, அவர்கள் குற்றமற்றவர்களாய் வாழ்ந்தார்கள் என்று முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ‘அவர்கள் ... நீதியுள்ளவர்களாகவும் குற்றமற்றவர்களாகவும் இருந்தார்கள்; எல்லாக் கட்டளைகளிலும் நியமங்களிலும் நடந்தார்கள்’ என ἦσαν உடன் நெருக்கமாக இணைக்கலாம்.
  rationale: கிரேக்கச் சொல் பெயரெச்ச வடிவில் இருந்தாலும், அதன் இடம் வாழ்க்கை நடத்தையை விளக்கும் வாசிப்பை இயல்பாக்குகிறது. உண்மையான தொடரியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதையான நடை பயன்படுத்தப்பட்டது. ‘நடந்தார்கள்’ என்ற நேரடி உருவகத்தைவிட வாழ்க்கை முறையைத் தெளிவாக்க ‘வாழ்ந்துவந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘கட்டளைகள், நியமங்கள்’ என்ற இணை மூலத்தின் இரு சட்டச் சொற்களையும் வேறுபடுத்தித் தக்கவைக்கிறது.
