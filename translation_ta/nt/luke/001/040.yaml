language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: ta
  text: சகரியாவின் வீட்டுக்குள் சென்று, எலிசபெத்தை வாழ்த்தினாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: வீட்டுக்குள் சென்று
  rationale: இறந்தகாலச் செயலைக் குறிக்கும் εἰσέρχομαι இங்கு ஒரு இடத்திற்குள் நுழைவதைச் சொல்கிறது. முந்தைய வசனத்தின் எழுவாயான மரியாள் தொடர்வதால், தமிழில் இயல்பான தொடர் வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: οἶκον
  choice: வீடு
  rationale: εἰς உடன் வருவதால் இங்கு குடும்பத்தாரைவிட உடல்சார் இருப்பிடமே முதன்மையாகக் குறிக்கப்படுகிறது.
- source_word: Ζαχαρίου
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἠσπάσατο
  choice: வாழ்த்தினாள்
  rationale: ἀσπάζομαι என்பதன் சூழலுக்கேற்ற நேரடியான பொருள் ‘வாழ்த்துதல்’. ‘வரவேற்றாள்’ என மொழிபெயர்த்தால், வீட்டுக்கு வந்த மரியாளை எலிசபெத் வரவேற்றார் என்ற எதிர்திசைப் பொருள் தோன்றக்கூடும்.
- source_word: Ἐλισάβετ
  choice: எலிசபெத்
  rationale: தமிழில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: καὶ
  choice: சென்று, … வாழ்த்தினாள்
  rationale: இரு καί இணைப்புகளும் தொடர்ச்சியான செயல்களை இணைக்கின்றன; தமிழில் இயல்பான வினையெச்சத் தொடரால் அந்த நிகழ்வோட்டம் காக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. தனியாக மேற்கோள் காட்டப்படும் வசனம் தெளிவாக இருக்க, முந்தைய வசனத்திலிருந்து புரியும் பெண்பால் எழுவாய் இறுதி வினையில் வெளிப்படுத்தப்பட்டுள்ளது; கிரேக்கத்தின் தொடர்ச்சியான வாக்கிய அமைப்பும் வினையெச்சத்தின் மூலம் இயல்பாகப் பேணப்பட்டுள்ளது.
