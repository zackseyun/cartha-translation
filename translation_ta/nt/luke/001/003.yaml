base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: ta
  text: தொடக்கத்திலிருந்து எல்லாவற்றையும் கவனமாகப் பின்தொடர்ந்து ஆராய்ந்த எனக்கும்[a], அவற்றை உங்களுக்கு ஒழுங்கான வரிசையில்[b] எழுதுவது நல்லது என்று தோன்றியது, மாண்புமிகு தெயோப்பிலுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடக்கத்திலிருந்து எல்லாவற்றையும் கவனமாக ஆராய்ந்த எனக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒழுங்காக.” இச்சொல் கண்டிப்பான காலவரிசையைக் குறிக்காமல், ஒழுங்கான அமைப்பைக் குறிக்கவும் கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: நல்லது என்று கருதினேன்
  rationale: இந்த இடத்தில் δοκέω சிந்தித்து எடுத்த முடிவையோ ஏற்றதாகக் கண்ட தீர்மானத்தையோ குறிக்கிறது. தமிழில் இயல்பாகவும் முன்னுரையின் முறையான நடையைத் தக்கவைத்தும் இதை வெளிப்படுத்துகிறது.
- source_word: κἀμοὶ
  choice: நானும்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட எழுத்தாளர்களோடு தன்னையும் லூக்கா இணைத்துக் கொள்வதை καί வலியுறுத்துகிறது.
- source_word: παρηκολουθηκότι
  choice: ஆராய்ந்தறிந்த
  rationale: παρακολουθέω என்பதற்கு நெருக்கமாகப் பின்தொடர்தல், தடம் தொடர்ந்து அறிதல், ஆராய்தல் ஆகிய பொருள்கள் உண்டு. இங்குள்ள வரலாற்று முன்னுரைச் சூழலில் ‘ஆராய்ந்தறிந்த’ என்பது அதன் விசாரணை சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- source_word: ἄνωθεν
  choice: தொடக்கத்திலிருந்தே
  rationale: இச்சூழலில் இது ‘மேலிருந்து’ என்பதைக் காட்டிலும் நிகழ்வுகளின் தொடக்கத்திலிருந்து என்பதையே இயல்பாகக் குறிக்கிறது.
- source_word: πᾶσιν
  choice: எல்லாவற்றையும்
  rationale: லூக்கா ஆராய்ந்த அனைத்து நிகழ்வுகளையும் செய்திகளையும் உள்ளடக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀκριβῶς
  choice: கவனமாக
  rationale: துல்லியத்துடனும் கூர்ந்த கவனத்துடனும் மேற்கொண்ட ஆராய்ச்சியை இது தெரிவிக்கிறது.
- source_word: καθεξῆς
  choice: ஒழுங்கான வரிசையில்
  rationale: தொடர்ச்சியையும் ஒழுங்கமைப்பையும் ஒருங்கே வெளிப்படுத்துகிறது; கண்டிப்பான காலவரிசை என்ற வலுவான கருத்தைத் தேவையின்றி புகுத்தாது.
- source_word: σοι γράψαι
  choice: அவற்றை உங்களுக்கு ... எழுத
  rationale: σοι பெறுநரைக் குறிக்கிறது. முந்தைய சூழலில் பேசப்பட்ட நிகழ்வுகளைச் சுட்ட தமிழில் ‘அவற்றை’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: κράτιστε
  choice: மாண்புமிகு
  rationale: உயர்நிலை அல்லது மதிப்புக்குரிய ஒருவரை முறையாக அழைக்கும் கௌரவ அடைமொழியை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: Θεόφιλε
  choice: தெயோப்பிலுவே
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, நேரடி அழைப்பைக் காட்ட அழைப்புவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: καθεξῆς என்பது வரலாற்றுக் காலவரிசையைக் குறிக்கிறதா, இலக்கிய ஒழுங்கமைப்பைக் குறிக்கிறதா
  choice: ஒழுங்கான வரிசையில்
  alternative: ஒழுங்காக; கண்டிப்பான காலவரிசையில்
  rationale: இந்தச் சொல் தொடர்ச்சியான வரிசையையோ ஒழுங்கான அமைப்பையோ குறிக்கலாம். கிரேக்க வாசகம் கட்டாயமான முழுக் காலவரிசையை வலியுறுத்தாததால், இரு சாத்தியங்களுக்கும் இடமளிக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், லூக்காவின் முறையான முன்னுரை நடையைத் தக்கவைக்கும் வகையில் எழுதப்பட்டுள்ளது. ‘உங்களுக்கு’ என்பது இன்றைய வாசகர்களுக்கு இயல்பாக இருக்கிறது; ‘மாண்புமிகு’ என்ற அழைப்பு மூலத்தின் கௌரவ நடையைப் பாதுகாக்கிறது.
