  source_fidelity: திருத்தம் தேவை. «ஆராய்ந்தறிந்த» என்பது παρακολουθηκότι-யின் சாத்தியமான விசாரணைப் பொருளைத் தருகிறது; ஆனால் இணைச்சொல் மூலத்தில் வெளிப்படையாக இல்லாத ‘அறிந்த’ என்ற முடிவுப் பொருளைச் சேர்க்கிறது. «பின்தொடர்ந்து ஆராய்ந்த» என்பது மூலத்தின் ‘closely followed/traced’ என்ற பரப்பை நேரடியாகவும் இயல்பாகவும் காக்கிறது. மேலும் ἔδοξε என்பதற்கு «எனக்கும் ... நல்லது என்று தோன்றியது» மூலத்தின் முறையான, சிந்தித்து வந்த தீர்மானத் தொனியை «கருதினேன்» என்பதைக் காட்டிலும் நெருக்கமாகத் தருகிறது.
