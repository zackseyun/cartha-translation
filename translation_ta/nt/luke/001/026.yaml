lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: ஆறாம் மாதத்தில்
  rationale: ἐν உடன் வரும் வேற்றுமை வடிவம் காலத்தைக் குறிக்கிறது. δέ இங்கு மென்மையான உரைத் தொடர்ச்சியை மட்டுமே காட்டுவதால், தமிழில் இயல்பாகத் தனிச் சொல்லால் வெளிப்படுத்தப்படவில்லை.
- source_word: ἀπεστάλη
  choice: அனுப்பப்பட்டார்
  rationale: ἀποστέλλω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; அனுப்பியவரின் செயலை முன்னிறுத்தாமல், தூதர் அனுப்பப்பட்டதை நேரடியாகச் சொல்கிறது.
- source_word: ὁ ἄγγελος
  choice: வானதூதர்
  rationale: இந்தக் கதையாடல் சூழலில் ἄγγελος ஒரு மனிதத் தூதரை அல்ல, வானுலகத் தூதரைச் சுட்டுகிறது. ‘வானதூதர்’ என்பது இன்றைய தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: Γαβριὴλ
  choice: காபிரியேல்
  rationale: தனிப்பெயர் தமிழின் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: ἀπό உடன் வரும் உருபு இங்கு மூலத்தையோ புறப்படும் இடத்தையோ குறிக்கிறது. ‘கடவுளால்’ என்று மொழிபெயர்த்து செய்பவரை முன்னிறுத்துவதற்குப் பதிலாக, கிரேக்கச் சொற்றொடரின் ‘கடவுளிடமிருந்து’ என்ற நுணுக்கம் காக்கப்பட்டுள்ளது.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: கலிலேயாவைச் சேர்ந்த ... நகரத்திற்கு
  rationale: εἰς செல்லும் இலக்கைக் குறிக்கிறது. τῆς Γαλιλαίας என்ற உடைமை வேற்றுமையை ‘கலிலேயாவைச் சேர்ந்த’ என்று மொழிபெயர்ப்பது மூல அமைப்பின் தொடர்பைப் பாதுகாத்து, தமிழிலும் இயல்பாக உள்ளது.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: நாசரேத் என்னும்
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘அதன் பெயர் நாசரேத்’ எனப் பொருள்படும். ‘நாசரேத் என்னும்’ என்பது அந்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘ஆறாம் மாதம்’ எதைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘ஆறாம் மாதத்தில்’ என்று மட்டும் வைக்கப்பட்டுள்ளது; அடிக்குறிப்பில் எலிசபெத்தின் கர்ப்பத்தின் ஆறாம் மாதம் என விளக்கப்பட்டுள்ளது.
  alternative: ஆண்டின் பொதுவான ஆறாம் மாதம் என்று புரிந்துகொள்ளுதல்.
  rationale: லூக்கா 1:24, 36 ஆகிய உடனடிச் சூழல் இது எலிசபெத்தின் கர்ப்பத்தின் ஆறாம் மாதம் என்பதைத் தெளிவுபடுத்துகிறது. எனினும் கிரேக்க வசனம் அந்தத் தொடர்பை இங்கே மீண்டும் வெளிப்படையாகச் சொல்லாததால், விளக்கம் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானதூதர்’ என்பது கதையின் வானுலகத் தூதர் என்ற பொருளைத் தெளிவாக்குகிறது; மரியாதைப் பன்மை வடிவமான ‘அனுப்பப்பட்டார்’ தமிழின் கண்ணியமான கதையாடல் நடைக்கு ஏற்றது. முதன்மை உரையில் [a], [b] ஆகிய இரு அடிக்குறிப்பு குறிகளும் உரிய இடங்களில் இடம்பெற்றுள்ளன.
