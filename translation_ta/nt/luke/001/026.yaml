  text: ஆறாம் மாதத்தில்[a], கடவுளிடமிருந்து தூதன் காபிரியேல் கலிலேயாவிலுள்ள நாசரேத் என்னும் ஒரு நகரத்திற்கு[b] அனுப்பப்பட்டார்.
