  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: ta
  text: நம்மிடையே நிறைவேறிய காரியங்களைப் பற்றிய ஒரு விவரக் கணக்கைத் தொகுக்கப் பலர் முனைந்திருப்பதால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மிடையே நிறைவேற்றப்பட்ட காரியங்களைப் பற்றிய” அல்லது “நம்மிடையே முழுமையாக உறுதிப்படுத்தப்பட்ட காரியங்களைப் பற்றிய.”
    reason: πεπληροφορημένων என்பதற்கு ‘நிறைவேறிய’ என்பதே இச்சூழலில் முதன்மையான பொருள்; ‘நிறைவேற்றப்பட்ட’ மற்றும் ‘முழுமையாக உறுதிப்படுத்தப்பட்ட’ என்பவையும் சாத்தியமான மாற்றுப் பொருள்கள்.
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: முனைந்திருக்கிறபடியால்
  rationale: இந்தச் சொல் அடுத்துவரும் கூற்றுக்கான பின்னணிக் காரணத்தை அறிமுகப்படுத்துகிறது. கிரேக்க வாக்கியம் அடுத்த வசனங்களில் தொடர்வதால், தமிழிலும் காரணத் தொடர்பைக் காட்டும் வினையெச்சத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: எளிய அளவுக் குறிப்பை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘மற்றவர்கள்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ἐπεχείρησαν
  choice: முனைந்திருக்கிற
  rationale: ஒரு பணியை மேற்கொண்டார்கள் என்ற பொருளைத் தருகிறது; அவர்களுடைய முயற்சி தோல்வியடைந்தது என்று தேவையின்றி உணர்த்தாது.
- source_word: ἀνατάξασθαι
  choice: தொகுத்தெழுத
  rationale: கிடைத்த தகவல்களை ஒழுங்குபடுத்தி எழுத்து வடிவில் அமைப்பதைக் குறிக்கிறது; நவீன வாசகர்களுக்கும் இயல்பாக உள்ளது.
- source_word: διήγησιν
  choice: ஒரு நிகழ்வுரை
  rationale: நிகழ்வுகளை எடுத்துரைக்கும் தொடர் விவரிப்பு என்ற இலக்கியப் பொருளைக் காக்கிறது; வெறும் அறிக்கை என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: περὶ
  choice: பற்றிய
  rationale: தமிழில் இயல்பாகவும் இலக்கிய நடைக்கு ஏற்றவாறும் பொருளைத் தெளிவாக இணைக்கிறது.
- source_word: τῶν πεπληροφορημένων
  choice: நிறைவேறிய
  rationale: முடிவுறுதல் அல்லது நிறைவேற்றம் என்ற சாத்தியமான முதன்மைப் பொருளைப் பிரதிபலிக்கிறது. முழுமையாக உறுதிப்படுத்தப்பட்டவை என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐν ἡμῖν
  choice: நம்மிடையே
  rationale: பேசுபவரையும் அவருடன் தொடர்புடைய சமூகத்தையும் உள்ளடக்கும் கூட்டுப் பொருளைத் தருகிறது; அந்தக் குழுவை மூலத்தைவிடத் துல்லியமாக வரையறுக்கவில்லை.
- source_word: πραγμάτων
  choice: நிகழ்வுகளை
  rationale: இங்கு விவரிக்கப்படும் நடந்த காரியங்கள் அல்லது சம்பவங்கள் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: லூக்காவின் முன்னுரையில் πεπληροφορημένων என்பதன் பொருள்
  choice: நிறைவேறிய
  alternative: நிறைவேற்றப்பட்ட; முழுமையாக உறுதிப்படுத்தப்பட்ட
  rationale: πραγμάτων என்பதுடன் சேர்ந்து வரும் இச்சொல் நிகழ்வுகள் நிறைவடைந்ததை அல்லது நிறைவேற்றப்பட்டதை இயல்பாகக் குறிக்கலாம்; லூக்காவின் நூலில் காணப்படும் நிறைவேற்றக் கருத்துடனும் இது ஒத்துள்ளது. ஆயினும் ‘முழுமையாக உறுதிப்படுத்தப்பட்ட’ என்ற பொருளும் சொல்லின் பொருள் வரம்பில் இருப்பதால் அது அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூல கிரேக்கத்தின் முறையான முன்னுரை நடையைப் பேண ‘நிகழ்வுரை’, ‘தொகுத்தெழுத’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் லூக்கா 1:2–4 வரை தொடர்வதால் வசனம் காரணத் தொடருடன் முடிகிறது.
