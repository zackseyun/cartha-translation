lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: இரக்கம் காட்டவும்
  rationale: ποιεῖν ἔλεος என்பது ‘இரக்கம் செய்/காட்டு’ என்ற நிலையான கருத்திணைவு. நவீனத் தமிழில் ‘இரக்கம் காட்டவும்’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது; முடிவிலி நோக்கத் தொடரையும் ‘-வும்’ வடிவம் தக்கவைக்கிறது.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: நம் தந்தையரிடம்
  rationale: μετά + உரிமை வேற்றுமை எழுத்துப்படி ‘உடன்’ என்றாலும், இங்கு இரக்கம் இவர்களுடன் தொடர்பாகக் காட்டப்படுவதைத் தமிழில் ‘தந்தையரிடம்’ இயல்பாக வெளிப்படுத்துகிறது. ‘தந்தையர்’ என்பது மூலத்தின் ஆண்பால் மற்றும் உடன்படிக்கைச் சூழலைப் பாதுகாக்கிறது.
- source_word: μνησθῆναι
  choice: நினைவுகூரவும்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘நினைவுகூர்’ எனப் பொருள்படும். இறைவன் நினைவுகூருதல் செயல்பூர்வமான உடன்படிக்கை உண்மைத்தன்மையைக் குறிக்கக்கூடும்; ஆயினும் அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: தமது பரிசுத்த உடன்படிக்கையை
  rationale: διαθήκη இச்சூழலில் இறைவனுடைய உடன்படிக்கையைக் குறிக்கிறது; ἁγίας என்பதற்கு ‘பரிசுத்த’ என்பது நேரடியான வேதாகமத் தமிழ். ‘தமது’ என்பது இறைவனைச் சுட்டும் αὐτοῦ என்பதையும், உடன்படிக்கை அவருக்குரியது என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் இறைவன் ‘நினைவுகூருதல்’
  choice: தமது பரிசுத்த உடன்படிக்கையை நினைவுகூரவும்
  alternative: தமது பரிசுத்த உடன்படிக்கையின்படி உண்மையுடன் செயல்படவும்
  rationale: வேதாகம உடன்படிக்கை மொழியில் ‘நினைவுகூருதல்’ வெறும் மனநினைவைவிட, முன்பு அளித்த வாக்குறுதிக்கு ஏற்ப செயல்படுவதையும் உட்குறிக்கலாம். இருந்தாலும் கிரேக்கம் ‘நினைவுகூர்’ என்றே கூறுவதால், அந்த இறையியல் அழுத்தத்தையும் மொழியின் திறந்த தன்மையையும் முதன்மை உரை பாதுகாக்கிறது.
- issue: πατέρων ἡμῶν என்பதன் குறிப்பு
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர் / நம் மூதாதையர்
  rationale: இது இஸ்ரவேலின் முன்னோர்களை, குறிப்பாகத் தந்தைமரபினரைச் சுட்டுகிறது. மூலத்தின் ஆண்பால் உடன்படிக்கை மொழியை அழிக்காமல் ‘தந்தையர்’ என வைத்துள்ளோம்; பரந்த குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. வசனம் முந்தைய தொடரின் நோக்கவினைத் துண்டாக இருப்பதால், இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘இரக்கம் காட்டுதல்’ இயல்பான தமிழ்; ‘பரிசுத்த உடன்படிக்கை’ உடன்படிக்கைச் சூழலின் மரபொலியைக் காக்கிறது.
