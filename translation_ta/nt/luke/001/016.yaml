- from: இஸ்ரவேலின் மகன்களில் பலரை அவர்களுடைய கடவுளாகிய ஆண்டவரிடம் அவன் திருப்புவான்.[a]
  to: மேலும், இஸ்ரவேலின் மகன்களில் பலரை அவர்களுடைய கடவுளாகிய ஆண்டவரிடம் அவன் திருப்புவான்.[a]
  rationale: தொடக்கத்தில் “மேலும்,” சேர்ப்பதன் மூலம் καί-யின் இணைப்புப் பொருள் பாதுகாக்கப்படுகிறது. மற்ற சொற்கள் மூலத்தின் பொருள், இலக்கண உறவுகள், மற்றும் கண்ணியமான நவீன தமிழ் நடையை ஏற்கனவே நன்றாகக் காக்கின்றன.
