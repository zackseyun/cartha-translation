  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: ta
  text: மேலும், இஸ்ரவேலின் மகன்களில் பலரை அவர்களுடைய கடவுளாகிய ஆண்டவரிடம் அவன் திருப்புவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் மக்களில்’ அல்லது ‘இஸ்ரவேலரில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது; இது பாரம்பரிய உடன்படிக்கை வெளிப்பாட்டைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தமிழில் தனியே வெளிப்படுத்தப்படவில்லை)
  rationale: இது முந்தைய வாக்கியத்துடன் இணைக்கும் சொல். தனி வசனமாக இயல்பான நவீன தமிழில் தொடக்கத்தில் ‘மேலும்’ சேர்ப்பது தேவையற்றதாக இருப்பதால், தொடர்ச்சியை வாக்கிய ஓட்டமே உணர்த்துகிறது.
- source_word: πολλοὺς
  choice: பலரை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இச்சொல்லின் அளவுப்பொருளையும், அடுத்துவரும் தொகுதியிலிருந்து பலரைக் குறிக்கும் அமைப்பையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: இஸ்ரவேலின் மகன்களில்
  rationale: கிரேக்கத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற உடன்படிக்கை சார்ந்த பாரம்பரிய வெளிப்பாட்டைத் தக்கவைத்தும், πολλούς உடன் உள்ள பகுதியைக் குறிக்கும் பொருளை ‘மகன்களில் பலரை’ எனத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπιστρέψει
  choice: திருப்புவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவில் யோவான் பலரைத் திசைதிருப்பும் முகவராக இருப்பதைப் பாதுகாக்கிறது; ‘மனந்திரும்பச் செய்வான்’ போன்ற விளக்கவுரையாக்கத்தைத் தவிர்க்கிறது.
- source_word: ἐπὶ
  choice: -ிடம்
  rationale: ἐπιστρέφω என்பதுடன் இலக்கை நோக்கிய திருப்பத்தை இங்கு இயல்பான தமிழில் ‘ஆண்டவரிடம்’ எனக் காட்டுகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: மனித எஜமானை அல்ல, இஸ்ரவேலின் கடவுளைக் குறிக்கும் உடன்படிக்கை மற்றும் இறையியல் நிறையைத் தக்கவைக்கிறது.
- source_word: τὸν θεὸν αὐτῶν
  choice: அவர்களுடைய கடவுளாகிய
  rationale: ‘ஆண்டவர்’ என்பதையே விளக்கும் இணைப்பெயர் அமைப்பை இயல்பான தமிழில் தருவதோடு, ‘அவர்களுடைய கடவுள்’ என்ற உடன்படிக்கை உறவையும் பாதுகாக்கிறது.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραὴλ என்ற உடன்படிக்கை வெளிப்பாட்டின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையையும், வேதாகமத்தின் பாரம்பரிய உடன்படிக்கைச் சொல்லாட்சியையும் முதன்மை உரை பாதுகாக்கிறது; தமிழில் பொதுமக்களை உள்ளடக்கும் பொருள் உண்டு என்பதைக் குறிப்புரை தெளிவுபடுத்துகிறது.
- issue: κύριον τὸν θεὸν αὐτῶν என்பதன் குறிப்பு
  choice: அவர்களுடைய கடவுளாகிய ஆண்டவர்
  alternative: அவர்களுடைய எஜமான்
  rationale: இணைப்பெயர் தொடர் இஸ்ரவேலின் கடவுளையே அடையாளப்படுத்துகிறது; ஆகவே κύριος என்பதற்கு இங்கு ‘ஆண்டவர்’ என்பதே இறையியல் மற்றும் உடன்படிக்கைப் பொருளைச் சரியாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மகன்களில் பலரை’ என்பது மூலத்தின் பகுதி-முழு அமைப்பையும் பாரம்பரிய வெளிப்பாட்டையும் காக்கிறது; ‘அவர்களுடைய கடவுளாகிய ஆண்டவர்’ என்பது கிரேக்க இணைப்பெயர் உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
