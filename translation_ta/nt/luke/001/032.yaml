id: LUK.1.32
reference: Luke 1:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: ta
  text: அவர் மகத்தானவராக இருப்பார்; உன்னதமானவரின் மகன் என்று அழைக்கப்படுவார்[a]. ஆண்டவராகிய கடவுள் அவருடைய தந்தையான தாவீதின் அரியணையை அவருக்குக் கொடுப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெயரிடப்படுவார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அவருடைய தந்தை” என்பது இயேசுவின் அரச வம்ச முன்னோரான தாவீதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: அவர்
  rationale: இப்போது அறிவிக்கப்பட்ட குழந்தையைச் சுட்டுகிறது. கிரேக்கத்தில் சுட்டுப்பெயர் இருந்தாலும், நவீன தமிழில் மரியாதையான தனிப்பெயர்ச்சொல் இயல்பாக உள்ளது.
- source_word: μέγας
  choice: பெரியவராக
  rationale: மேன்மை, முக்கியத்துவம் ஆகியவற்றைச் சுருக்காமல் μέγας என்பதன் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: υἱὸς Ὑψίστου
  choice: உன்னதமானவரின் மகன்
  rationale: Ὕψιστος என்ற தெய்வீகப் பட்டத்தையும் υἱός என்ற உறவுமுறைச் சொல்லையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: κληθήσεται
  choice: என்று அழைக்கப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் பட்டமிடுதல் அல்லது பெயரிடுதல் என்ற பொருள் வாய்ப்பையும் பாதுகாக்கிறது.
- source_word: κύριος ὁ θεὸς
  choice: ஆண்டவராகிய கடவுள்
  rationale: κύριος மற்றும் θεός இரண்டையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: δώσει αὐτῷ
  choice: அவருக்குக் கொடுப்பார்
  rationale: δίδωμι என்பதையும் αὐτῷ என்ற வேற்றுமை உறவையும் நேரடியாகத் தருகிறது.
- source_word: τὸν θρόνον Δαυὶδ
  choice: தாவீதின் அரியணை
  rationale: அரசாட்சியையும் தாவீதிய வாக்குறுதி மொழியையும் காக்கும் நேரடி மரபுத்தொடர்.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: அவருடைய தந்தையான
  rationale: πατήρ என்பதன் நேரடிப் பொருளான ‘தந்தை’ என்பதை வைத்துக்கொண்டு, இங்கு வம்ச முன்னோரைச் சுட்டும் பயன்பாட்டை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: υἱὸς Ὑψίστου என்ற கிறிஸ்துவியல் பட்டம்
  choice: உன்னதமானவரின் மகன்
  alternative: உன்னதமானவருடைய ஒரு மகன்
  rationale: இது இயேசுவுக்குரிய பட்டமாகச் செயல்படுவதால், தேவையற்ற ‘ஒரு’ என்பதைச் சேர்க்காமல் மூலத்தின் உயர்ந்த உறவுமுறை உரிமையைப் பாதுகாக்கிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: இன்றைய பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருந்து, கிரேக்க κύριος என்பதைக் குறிப்பிட்ட எபிரெய இறைப்பெயராக மிகைப்படுத்தாமல் தருகிறது.
- issue: தாவீதின் தந்தைமை மொழி
  choice: அவருடைய தந்தையான தாவீது
  alternative: அவருடைய முன்னோரான தாவீது
  rationale: மூலத்தின் πατήρ என்ற சொல்லைத் தக்கவைத்து, தாவீதிய அரச வம்சத் தொடர்பை விளக்கவுரையால் மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இயேசுவைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; வசன ஓட்டத்திற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
