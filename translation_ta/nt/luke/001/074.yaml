- source_word: ῥυσθέντας
  choice: மீட்கப்பட்டு
  rationale: இது இறைவனுக்குப் பணிசெய்வதற்கு முன்னதாக நிகழ்ந்த விடுதலையைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு எச்சம். ‘மீட்கப்பட்டு’ அந்தத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: λατρεύειν
  choice: பணிசெய்ய
  rationale: இறைவனை நோக்கிய வழிபாட்டுத் தன்மையுள்ள சேவையைக் குறிக்கலாம். ‘பணிசெய்ய’ என்பது வழிபாட்டிற்கு மட்டும் பொருளைச் சுருக்காமல் அர்ப்பணிப்பும் கீழ்ப்படிதலும் உட்பட்ட விரிந்த பொருளைப் பாதுகாக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: முந்தைய சூழலில் இறைவனைக் குறிக்கும் வேற்றுமை உருபுடைய சுட்டுப்பெயர்; தமிழில் ‘பணிசெய்’ என்பதுடன் ‘அவருக்கு’ இயல்பாக அமைகிறது.
theological_decisions:
- issue: இறைவனை நோக்கிய λατρεύειν என்பதன் பொருள் வரம்பு
  choice: அவருக்குப் பணிசெய்ய
  alternative: அவரை வழிபட
  rationale: இந்தச் சொல் இறைவனுக்குரிய வழிபாட்டையும் சேவையையும் ஒருங்கே குறிக்கக்கூடும். ‘பணிசெய்ய’ என்பது அதைச் சடங்கு வழிபாட்டிற்கு மட்டும் வரையறுக்காமல் அதன் விரிந்த உடன்படிக்கை சார்ந்த பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையிலிருந்து’ என்ற வேதாகம உருவகம் உரையில் வைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடர்வதால் முடிவில் நீள்கோடு இடப்பட்டுள்ளது.
