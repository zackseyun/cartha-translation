lexical_decisions:
- source_word: ἀφόβως
  choice: அச்சமின்றி
  rationale: ‘அச்சம் இல்லாமல்’ அல்லது ‘அஞ்சாமல்’ என்ற பொருள் தரும் வினையடை. இங்கு இறைவனுக்குச் செய்யும் பணியின் விதத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: நம் பகைவர்களின் கையிலிருந்து
