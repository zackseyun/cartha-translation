  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: ta
  text: தூபம் செலுத்தும் வேளையில்[a], மக்கள் கூட்டம் முழுவதும் வெளியே ஜெபித்துக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
