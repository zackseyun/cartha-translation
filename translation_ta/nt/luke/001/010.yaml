    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: πᾶν என்பது ஒருமைத் தொகுப்புப்பெயரான πλῆθος-ஐ முழுமைப்படுத்துகிறது. நவீன தமிழில் இயல்பாகவும், கூடியிருந்த அனைவரையும் உள்ளடக்கும் வலியுறுத்தலைக் காக்கவும் இச்சொற்றொடர் உதவுகிறது.
- source_word: τοῦ λαοῦ
  choice: மக்கள்
  rationale: ஆலயச் சூழலில் இது உடன்படிக்கை மக்களைக் குறிக்கக்கூடும்; ஆனால் மூலவாக்கியம் ‘இஸ்ரவேல்’ என்று வெளிப்படையாகச் சொல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: προσευχόμενον
  choice: ஜெபித்துக்கொண்டிருந்தது
  rationale: ἦν உடன் வரும் நிகழ்காலப் பங்கேற்புவினை தொடர்ந்து நடைபெற்ற செயலைக் காட்டுகிறது. ‘ஜெபித்துக்கொண்டிருந்தது’ அந்த நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘ஒன்றாக’ என்ற கருத்து தனியே சேர்க்கப்படவில்லை.
- source_word: ἔξω
  choice: வெளியே
  rationale: ἔξω என்பதன் நேரடிப் பொருள் ‘வெளியே’. சூழல் ஆலயத்துக்கு வெளியே இருந்ததை உணர்த்தினாலும், கிரேக்கத்தில் குறிப்பிடப்படாத ‘பரிசுத்த இடத்துக்கு வெளியே’ போன்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τῇ ὥρᾳ
  choice: வேளையில்
  rationale: ὥρα இங்கு வழிபாட்டுக்கான நிர்ணயிக்கப்பட்ட நேரத்தைக் குறிக்கிறது. ‘வேளையில்’ என்பது நவீன தமிழில் இயல்பாக இருந்து அந்த நேரக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: τοῦ θυμιάματος
  choice: தூபம் செலுத்தும்
  rationale: θυμίαμα அடிப்படையில் தூபத்தைக் குறித்தாலும், ஆலயச் சூழலில் சடங்காகத் தூபம் செலுத்தப்படுவதைச் சுட்டுகிறது. ‘தூபம் செலுத்தும்’ என்பது வழிபாட்டுச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: θυμίαμα என்பதிலுள்ள ஆலய வழிபாட்டுச் சொற்பயன்பாடு
  choice: தூபம் செலுத்தும் வேளை
  alternative: தூபம் எரிக்கும் நேரம் / தூபத்தின் வேளை
  rationale: இந்த வசனம் ஆசாரியர் ஆலயத்தில் தூபம் செலுத்திய வழிபாட்டு நேரத்தை விவரிக்கிறது. ‘தூபம் செலுத்தும்’ என்பது சடங்கு மற்றும் வழிபாட்டுச் சூழலைக் காக்கிறது; அதேவேளையில் பிற்காலக் கோட்பாட்டுக் கருத்துகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஜெபம்’ மற்றும் ‘தூபம் செலுத்துதல்’ ஆகியவை தமிழ் வேதாகம மற்றும் பொதுக் கிறிஸ்தவ வழக்கில் பரவலாகப் புரியக்கூடிய சொற்கள். கிரேக்க வாக்கியத்தின் தொடர்ச்சியான செயலும், கூடியிருந்த மக்கள் அனைவரையும் குறிக்கும் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
