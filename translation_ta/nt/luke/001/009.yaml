source:
  edition: SBLGNT
  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: ta
  text: ஆசாரியப் பணியின் வழக்கப்படி, ஆண்டவருடைய ஆலயத்துக்குள்[a] சென்று தூபம் காட்டுவதற்கான சீட்டு அவருக்கு விழுந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருடைய பரிசுத்த இடத்துக்குள்.” இங்குள்ள கிரேக்கச் சொல் ναός; இது விரிந்த ஆலய வளாகத்தை அல்லாமல், ஆலயக் கட்டிடத்தின் புனித உட்பகுதியை அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος
  choice: வழக்கப்படி
  rationale: κατά என்பதுடன் ἔθος வருவது நிலைபெற்ற வழக்கத்துக்கு இணங்கச் செய்வதைக் குறிக்கிறது; ‘வழக்கப்படி’ என்பது இதை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: τῆς ἱερατείας
  choice: ஆசாரியப் பணியின்
  rationale: ἱερατεία என்பது தனிப்பட்ட ஆசாரியர்களை மட்டும் அல்லாமல் ஆசாரிய அலுவல் அல்லது பணிமுறையையும் குறிக்கிறது; சூழலில் நடைமுறையைச் சுட்டுவதால் ‘ஆசாரியப் பணி’ பொருத்தமானது.
- source_word: ἔλαχε
  choice: சீட்டு அவருக்கு விழுந்தது
  rationale: λαγχάνω என்பது சீட்டின் மூலம் ஒன்றைப் பெறுவதைக் குறிக்கிறது. ‘சீட்டு அவருக்கு விழுந்தது’ என்பது தேர்வு சீட்டின் மூலம் நடந்ததைத் தெளிவாகவும் தமிழில் இயல்பாகவும் கூறுகிறது.
- source_word: τοῦ θυμιᾶσαι
  choice: தூபம் காட்டுவதற்கான
  rationale: θυμιάω என்பது தூபத்தை எரித்தல் அல்லது செலுத்துதலைக் குறிக்கிறது; வழிபாட்டுச் சூழலில் ‘தூபம் காட்டுதல்’ இயல்பான தமிழ் வழக்கு.
- source_word: εἰσελθὼν
  choice: உள்ளே சென்று
  rationale: இறந்தகாலப் பங்கேற்பு வினை, தூபம் காட்டுவதுடன் தொடர்புடைய நுழைவைத் தெரிவிக்கிறது; ‘உள்ளே சென்று’ தேவையற்ற கால வரிசை விளக்கமின்றி அந்த உறவைப் பாதுகாக்கிறது.
- source_word: εἰς τὸν ναὸν
  choice: ஆலயத்துக்குள்
  rationale: ναός குறிப்பாக ஆலயத்தின் புனித உட்பகுதியைக் குறிக்கக்கூடும். பிரதான உரையில் எளிதில் புரியும் ‘ஆலயம்’ வைக்கப்பட்டு, அதன் குறுகிய பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος இங்கு தேவனைச் சுட்டுகிறது; ‘ஆண்டவர்’ என்பது நவீனத் தமிழில் கண்ணியமானவும் வழக்கமானவும் உள்ள மொழிபெயர்ப்பு.
theological_decisions:
- issue: ஆலய வழிபாட்டுச் சூழலில் ναός என்பதன் மொழிபெயர்ப்பு
  choice: ஆலயம்
  alternative: பரிசுத்த இடம்
  rationale: ναός என்பது விரிந்த ஆலய வளாகத்தைவிட ஆலயத்தின் புனித உட்பகுதியையே அடிக்கடி குறிக்கிறது; சகரியா தூபம் காட்டுவதற்காக நுழைவதால் அந்தக் குறுகிய பொருள் சூழலுக்குப் பொருந்துகிறது. வாசிப்பின் இயல்புக்காக பிரதான உரையில் ‘ஆலயம்’ வைக்கப்பட்டு, துல்லியமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சீட்டு அவருக்கு விழுந்தது’ என்பது மூலத்தில் உள்ள சீட்டுத் தேர்வு கருத்தைப் பேச்சுவழக்காகத் தாழ்த்தாமல் இயல்பாகத் தெரிவிக்கிறது.
