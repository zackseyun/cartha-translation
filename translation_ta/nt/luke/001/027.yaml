source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: ta
  text: தாவீதின் வீட்டைச் சேர்ந்த யோசேப்பு என்னும் பெயருடைய ஓர் ஆணுக்குத் திருமணம் நிச்சயிக்கப்பட்டிருந்த[a] ஒரு கன்னியிடம், அந்தக் கன்னியின் பெயர் மரியாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மணஒப்பந்தம் செய்யப்பட்டிருந்த.” கிரேக்கச் சொல், முழுமையான திருமண வாழ்வுக்கு முந்திய முறைப்படியான மண உறுதி நிலையைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மரியாம்”; இது கிரேக்கப் பெயர் வடிவுக்கு நெருக்கமான ஒலிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: கன்னி / கன்னியின்
  rationale: இங்கு παρθένος என்பதன் இயல்பான பொருள் திருமண உறவு கொள்ளாத கன்னி என்பதாகும்; ஒரே வசனத்தில் இச்சொல் திரும்ப வருவதையும் தமிழில் காத்திருக்கிறது.
- source_word: ἐμνηστευμένην
  choice: திருமணம் நிச்சயிக்கப்பட்டிருந்த
  rationale: Perfect participle, ஏற்கெனவே ஏற்படுத்தப்பட்டு தொடர்ந்து நிலவிய முறைப்படியான மண உறுதியைக் குறிக்கிறது. இன்றைய தமிழில் இயல்பாகப் புரியும் வகையில் இந்தச் சொற்றொடர் அதை வெளிப்படுத்துகிறது.
- source_word: ἀνδρὶ
  choice: ஓர் ஆணுக்கு
  rationale: ἀνήρ என்பதற்கு ‘ஆண்’ அல்லது ‘கணவன்’ எனப் பொருள் வரலாம். ஆனால் மணம் நிச்சயிக்கப்பட்ட நிலையைச் சொல்லும் இத்தொடரில் ‘ஆண்’ என்பது திருமணம் முழுமையாக நடந்துவிட்டதாக மிகைப்படுத்தாமல் உள்ளது.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: யோசேப்பு என்னும் பெயருடைய
  rationale: கிரேக்கப் பெயரிடும் மரபுத்தொடரை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: ἐξ οἴκου Δαυίδ
  choice: தாவீதின் வீட்டைச் சேர்ந்த
  rationale: ‘வீடு’ என்ற வேதாகம வம்ச/அரச மரபுச் சொல்லாட்சியைக் காத்து, ἐξ என்பதையும் ‘சேர்ந்த’ என்று இயல்பாக வெளிப்படுத்துகிறது. இத்தொடர் இலக்கணப்படி யோசேப்பைச் சுட்டுகிறது.
- source_word: Μαριάμ
  choice: மரியாள்
  rationale: தமிழ் வேதாகம வழக்கில் நன்கு நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது; கிரேக்க வடிவுக்கு நெருக்கமான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: லூக்காவின் பிறப்பு நிகழ்வுரையில் παρθένος என்பதன் கன்னித்தன்மை சார்ந்த பொருளைக் காப்பது
  choice: கன்னி
  alternative: இளம்பெண்
  rationale: கிரேக்கச் சொல்லின் வழக்கமான பொருளும் உடனடிச் சூழலும் ‘கன்னி’ என்பதை ஆதரிக்கின்றன. இது வசனம் கூறுவதற்கு மேலாக எதையும் சேர்க்காமல் அதன் இறையியல் முக்கியத்துவத்தைக் காக்கிறது.
- issue: ἐξ οἴκου Δαυίδ யாரைச் சுட்டுகிறது என்பது
  choice: யோசேப்பு தாவீதின் வீட்டைச் சேர்ந்தவர்
  alternative: மரியாள் தாவீதின் வீட்டைச் சேர்ந்தவர்
  rationale: கிரேக்கத்தில் இத்தொடர் அருகிலுள்ள யோசேப்பை அடையாளப்படுத்தும் பெயர்த் தொடரோடு இயல்பாக இணைகிறது; தமிழிலும் அந்த இணைப்பு தெளிவாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, எளிதில் புரியும், மதிப்புமிக்க தமிழ் நடை. வழங்கப்பட்ட கிரேக்கப் பகுதி முந்தைய வாக்கியத்தின் ‘…இடம்’ என்ற இலக்கணத் தொடர்ச்சியாக இருப்பதால், மொழிபெயர்ப்பும் ‘கன்னியிடம்’ எனத் தொடர் வடிவிலேயே வைக்கப்பட்டுள்ளது. ‘தாவீதின் வீடு’ என்ற வேதாகம மரபுச் சொல்லாட்சி வம்சத்தையும் அரச குடும்பத் தொடர்பையும் உள்ளடக்கும் வகையில் பாதுகாக்கப்பட்டுள்ளது.
