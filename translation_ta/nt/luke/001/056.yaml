id: LUK.1.56
reference: Luke 1:56
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: ta
  text: மரியா அவளுடன் ஏறக்குறைய மூன்று மாதங்கள்[a] தங்கியிருந்தாள்; பின்னர் தன் வீட்டிற்குத் திரும்பினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் கால அளவுடன் பயன்படுத்தப்பட்டுள்ள ὡς என்ற சொல், இது துல்லியமான கணக்கு அல்லாமல் தோராயமான காலம் என்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: தங்கியிருந்து
  rationale: μένω என்பதன் இறந்தகால வடிவம், ஒரு குறிப்பிட்ட காலம் ஓரிடத்தில் தொடர்ந்து தங்கியிருந்ததைக் குறிக்கிறது. ‘தங்கியிருந்து’ என்பது இயல்பான நவீனத் தமிழ் நடைக்கு ஏற்றது.
- source_word: δὲ
  choice: பிறகு
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்பை ஏற்படுத்துகிறது. தமிழில் வாக்கியத்தின் இரண்டாம் செயலுக்கு முன் ‘பிறகு’ என்று அமைப்பது நிகழ்வுகளின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; தனியாக ‘ஆனால்’ என்று மொழிபெயர்த்து தேவையற்ற முரண்பாட்டை உருவாக்கவில்லை.
- source_word: Μαριὰμ
  choice: மரியா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: σὺν αὐτῇ
  choice: அவளுடன்
  rationale: σύν உடனிருப்பையோ துணைநிலையையோ குறிக்கிறது. முந்தைய சூழலில் ‘அவள்’ என்பது எலிசபெத்தைச் சுட்டுகிறது; மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் மொழிபெயர்ப்பிலும் பிரதிப்பெயர் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ὡς μῆνας τρεῖς
  choice: ஏறக்குறைய மூன்று மாதங்கள்
  rationale: கால அளவுக்கு முன் வரும் ὡς தோராயத்தைக் குறிக்கக்கூடும். ‘ஏறக்குறைய’ அந்த நுட்பத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπέστρεψεν
  choice: திரும்பிச் சென்றாள்
  rationale: ὑποστρέφω முன்பு இருந்த இடத்திற்குத் திரும்புவதைக் குறிக்கிறது. இலக்கை நோக்கிய இயக்கத்தையும் தமிழில் இயல்பாகக் காட்ட ‘திரும்பிச் சென்றாள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: தன் வீட்டிற்கு
  rationale: இங்கு οἶκος குடும்பக் குழுவைவிட மரியா திரும்பிச் சென்ற இடத்தைக் குறிக்கிறது. ‘தன்’ என்பது எழுவாயான மரியாவுடனான உரிமைத் தொடர்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
