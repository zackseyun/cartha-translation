  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மென்மையான தொடர்பு, கால அளவின் தோராயத் தன்மை, மற்றும் எலிசபெத்தை மறைமுகமாகச் சுட்டும் பிரதிப்பெயர் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
