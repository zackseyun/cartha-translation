source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: ta
  text: மரியாளின் வாழ்த்தை[a] எலிசபெத் கேட்டபோது, அவளுடைய கருவில் குழந்தை துள்ளியது; எலிசபெத் பரிசுத்த ஆவியால் நிரப்பப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வணக்கம்.”
    reason: ἀσπασμός என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐγένετο
  choice: தமிழில் தனியே மொழிபெயர்க்காமல், முழு வாக்கியத்தின் நிகழ்வுரை அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: இது லூக்கா அடிக்கடி பயன்படுத்தும் நிகழ்வுரைச் சூத்திரம். ‘அது நிகழ்ந்தது’ என்று சொற்சொல்லாகச் சேர்ப்பது இங்கு நவீன தமிழில் செயற்கையாக இருக்கும்; நிகழ்வு நேரடியாக விவரிக்கப்படுவதால் அதன் உரையாடல் பணி காக்கப்படுகிறது.
- source_word: ὡς
  choice: கேட்டபோது
  rationale: இறந்தகால வினையுடன் இது காலத் தொடர்பைக் குறிக்கிறது. ‘கேட்டபோது’ இயல்பான தமிழில் நிகழ்வுகளின் உடனடியான தொடரைத் தருகிறது.
- source_word: ἀσπασμός
  choice: வாழ்த்து
  rationale: மரியாள் சொன்ன வரவேற்புச் சொல்லைக் குறிக்கிறது. ‘வாழ்த்து’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐσκίρτησεν
  choice: துள்ளியது
  rationale: திடீரான உயிர்ப்பான அசைவைக் காட்டும் வினை. ‘அசைந்தது’ என்பதைவிட மூலத்தின் vividness-ஐ நன்றாகக் காக்கிறது.
- source_word: βρέφος
  choice: குழந்தை
  rationale: எலிசபெத்தின் கருவிலிருந்த யோவானைக் குறிக்கிறது. ‘குழந்தை’ இயல்பான, மரியாதையான, வயதுநிலையை மிகையாக வரையறுக்காத தமிழ்ச் சொல்.
- source_word: κοιλία
  choice: கரு
  rationale: இந்தச் சூழலில் தாயின் கருப்பையைச் சுட்டுகிறது. ‘கருவில்’ என்பது நவீன தமிழில் துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐπλήσθη
  choice: நிரப்பப்பட்டாள்
  rationale: மூலத்தின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; செய்பவரை உரைக்கு அப்பாற்பட்டு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால்
  rationale: லூக்கா–அப்போஸ்தலர் நூல்களின் பயன்பாட்டில் இது தேவனுடைய பரிசுத்த ஆவியைக் குறிக்கிறது. தமிழ் வழக்கில் இவ்வடிவம் நிரப்பப்படுதலின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: தேவனுடைய பரிசுத்த ஆவியைக் குறிக்கும் ‘பரிசுத்த ஆவி’
  alternative: ‘ஒரு பரிசுத்த ஆவி’
  rationale: லூக்கா–அப்போஸ்தலர் நூல்களின் வழக்கிலும் இங்குள்ள தீர்க்கதரிசனத் தூண்டுதல் சார்ந்த சூழலிலும் இந்தச் சொற்றொடர் தேவனுடைய ஆவியையே குறிக்கிறது. உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: கருவிலுள்ள யோவானைக் குறிக்கும் βρέφος
  choice: குழந்தை
  alternative: சிசு
  rationale: மூலச்சொல் மிக இளம் குழந்தையைக் குறிக்கிறது; இங்கு கருவிலுள்ள யோவானைக் குறிப்பிடுகிறது. ‘குழந்தை’ தெளிவும் இயல்பும் உடையது; கூடுதல் இறையியல் முடிவை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. லூக்காவின் நிகழ்வுரைச் சூத்திரம் தமிழில் செயற்கையாகத் தோன்றாதவாறு வாக்கிய அமைப்பின் வழியே வெளிப்படுத்தப்பட்டுள்ளது; அரைப்புள்ளி இரு தொடர்ச்சியான நிகழ்வுகளைத் தெளிவாக இணைக்கிறது.
