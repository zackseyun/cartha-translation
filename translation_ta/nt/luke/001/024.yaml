  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: ta
  text: 'இந்த நாட்களுக்குப் பிறகு, அவருடைய மனைவி எலிசபெத் கருவுற்றாள்; அவள் ஐந்து மாதங்களாகத் தன்னை மறைத்துக்கொண்டிருந்தாள்; இவ்வாறு சொன்னாள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: அந்த நாட்களுக்குப் பிறகு
  rationale: μετά + குற்றுவேற்றுமை கால வரிசையில் ‘பிறகு’ என்பதைக் குறிக்கிறது. கடந்த நிகழ்வுகளைச் சுட்டும் இயல்பான நவீனத் தமிழில் ταύτας என்பதற்கு ‘அந்த’ பொருத்தமாக உள்ளது; மென்மையான இணைப்புச் சொல்லான δέ தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: συνέλαβεν
  choice: கருவுற்றாள்
  rationale: இச்சூழலில் συλλαμβάνω குழந்தையைக் கருவில் தரித்ததைக் குறிக்கிறது; ‘கருவுற்றாள்’ நேரடியானதும் இயல்பானதுமான தமிழ் வழக்கு.
- source_word: Ἐλισάβετ
  choice: எலிசபெத்
  rationale: தமிழில் பரவலாகப் பயன்படும் பெயரெழுத்தாக்கம்.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: அவருடைய மனைவி
  rationale: γυνή என்பது பெண் அல்லது மனைவி எனப் பொருள்படலாம்; உடைமைச் சுட்டும் αὐτοῦ மற்றும் சூழல் இதைத் தெளிவாக ‘மனைவி’ எனக் காட்டுகின்றன.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: தன்னை மறைத்துக்கொண்டு
  rationale: வினையின் நிறைவுறா இறந்தகால வடிவம் ஐந்து மாதங்களாகத் தொடர்ந்த செயலைக் காட்டுகிறது. ‘மறைத்துக்கொண்டு’ என்பது தற்சுட்டுப் பொருளையும் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μῆνας πέντε
  choice: ஐந்து மாதங்கள்
  rationale: குற்றுவேற்றுமை கால நீடிப்பைக் குறிக்கிறது; தமிழில் கால அளவை நேரடியாகச் சொல்வது இயல்பு.
- source_word: λέγουσα
  choice: 'இவ்வாறு சொன்னாள்:'
  rationale: நிகழ்காலப் பங்கேற்பு வடிவம் அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்துகிறது. தமிழில் முழுவினையாக மாற்றுவது இயல்பான வாசிப்பைத் தருகிறது; ‘இவ்வாறு’ மற்றும் முக்காற்புள்ளி அடுத்துவரும் கூற்றைத் தெளிவாக இணைக்கின்றன.
