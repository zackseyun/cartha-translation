translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை. கிரேக்கத்தின் நிகழ்வுரைத் தொடக்கத்தைச் சொற்சொல்லாகச் சேர்க்காமல் தமிழின் இயல்பான காலத் துணைவாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
