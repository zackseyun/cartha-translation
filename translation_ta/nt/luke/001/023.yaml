source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: ta
  text: அவருடைய ஆலயப் பணிக்குரிய நாட்கள் நிறைவடைந்தபோது[b], அவர் தம் வீட்டுக்குச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் இல்லத்துக்குச் சென்றார்.’ கிரேக்கச் சொல் வீட்டுக் கட்டிடத்தையோ, விரிவான பொருளில் இல்லம் அல்லது குடும்பத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆலயப் பணி’ என்பது சகரியாவுக்கு நியமிக்கப்பட்டிருந்த ஆசாரியப் பணியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: லூக்காவின் வழக்கமான நிகழ்வுரைத் தொடர்; தமிழில் ‘நிகழ்ந்தது என்னவென்றால்’ என்று சேர்ப்பது இச்சிறு வாக்கியத்தைச் செயற்கையாக்கும். காலத் துணைவாக்கியமும் முதன்மை வினையும் அதன் உரைநடைப் பணியை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ὡς
  choice: போது
  rationale: இங்கு காலத் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; ‘போது’ இயல்பான நவீனத் தமிழ் இணை.
- source_word: ἐπλήσθησαν
  choice: நிறைவடைந்த
  rationale: ஒதுக்கப்பட்ட நாட்கள் முழு எண்ணிக்கையை எட்டியதைக் குறிக்கிறது; ‘நிறைவேறின’ என்பதிலுள்ள சாத்தியமான தீர்க்கதரிசன நிழலைத் தவிர்க்கிறது.
- source_word: λειτουργίας
  choice: ஆலயப் பணி
  rationale: சகரியாவின் நியமிக்கப்பட்ட ஆசாரிய ஆலயப் பணியையே சூழல் குறிக்கிறது. ‘ஊழியம்’ என்பதைக் காட்டிலும் இது பொதுவாசகருக்குத் தெளிவாகவும் சமயமரபுச் சார்பின்றியும் உள்ளது.
- source_word: ἀπῆλθεν
  choice: சென்றார்
  rationale: எளிய இயக்க வினையை இயல்பான தமிழில் தருகிறது.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: தம் வீட்டுக்கு
  rationale: οἶκος என்பது கட்டிடமான வீட்டையோ விரிவாக இல்லம்/குடும்பத்தையோ குறிக்கலாம். இங்கு இலக்கை இயல்பாகக் கூற ‘வீட்டுக்கு’ பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
