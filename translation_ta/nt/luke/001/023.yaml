  source_fidelity: மூலத்தின் காலத் தொடர்பு (‘ὡς … ἐπλήσθησαν’) மற்றும் சகரியாவின் நியமிக்கப்பட்ட ஆலய/ஆசாரியப் பணிக்காலம் முடிந்த பின் அவர் வீட்டிற்குச் சென்றார் என்ற பொருள் துல்லியமாகத் தரப்பட்டுள்ளது. ‘καὶ ἐγένετο’ என்ற லூக்காவின் வழக்கமான நிகழ்வுரைச் சூத்திரம் தனியாக மொழிபெயர்க்கப்படவில்லை; ஆனால் தமிழில் அது செயற்கையாகாமல் காலத் துணைவாக்கிய அமைப்பில் அதன் உரைநடைச் செயல்பாடு போதுமான அளவு வெளிப்படுகிறது.
  naturalness: ‘அவருடைய ஆலயப் பணிக்குரிய நாட்கள் நிறைவடைந்தபோது, அவர் தம் வீட்டுக்குச் சென்றார்’ என்பது நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான, இயல்பான உரைநடை.
  terminology: ‘ஆலயப் பணி’ λειτουργία என்பதன் இச்சூழலுக்குரிய ஆசாரிய ஆலயக் கடமையைக் கருத்துரைக் கூடுதலின்றி சரியாகக் குறிக்கிறது. ‘தம் வீட்டுக்கு’ என்பது εἰς τὸν οἶκον αὐτοῦ என்பதற்கு இயல்பான மொழிபெயர்ப்பு; மாற்று விரிவான பொருள் அடிக்குறிப்பில் முறையாகக் காக்கப்பட்டுள்ளது.
