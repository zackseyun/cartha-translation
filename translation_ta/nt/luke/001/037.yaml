source:
  edition: SBLGNT
  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: ta
  text: ஏனெனில், கடவுளிடமிருந்து வரும் எந்த வார்த்தையும் இயலாதது அல்ல[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு இயலாதது ஒன்றுமில்லை.”
    reason: παρὰ τοῦ θεοῦ என்பதை ‘கடவுளுடன்/கடவுளுக்கு’ என்றும், πᾶν ῥῆμα என்பதை ‘எதுவும்’ என்றும் புரிந்துகொள்ளும் பாரம்பரியமான மாற்றுப் பொருள்.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், ὅτι என்பதன் விளக்கக் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: οὐκ ἀδυνατήσει
  choice: நிறைவேறாமல் போகாது
  rationale: ἀδυνατέω என்பதற்கு ‘இயலாதிரு’ அல்லது சூழலின்படி ‘தோல்வியுறு’ என்ற பொருள் உண்டு. ῥῆμα என்பதுடன் இணையும் இவ்விடத்தில், இறைவார்த்தை செயலற்றுப் போகாது என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘சாத்தியமற்றதாக இருக்காது’ என்பது தமிழில் வார்த்தையைப் பற்றி கூறும்போது செயற்கையாக ஒலிக்கும்.
- source_word: παρὰ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வரும்
  rationale: παρά + பிறப்புவேற்றுமை இங்கு மூலத்தைச் சுட்டக்கூடும். ῥῆμα என்பதுடன் சேர்ந்து, அந்த வார்த்தை கடவுளிடமிருந்து வருவதை இத்தேர்வு தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: πᾶν
  choice: எந்த ... உம் ... போகாது
  rationale: πᾶν என்பதன் முழுமையான பொதுப்பொருளை, எதிர்மறை வினையுடன் இயல்பான தமிழ் அமைப்பில் ‘எந்த ... உம் ... இல்லை/போகாது’ என்று வழங்குகிறது.
- source_word: ῥῆμα
  choice: வார்த்தை
  rationale: ῥῆμα என்பது ‘வார்த்தை,’ ‘கூற்று,’ அல்லது ‘விஷயம்’ எனப் பொருள்படலாம். உடனடி சூழலில் கபிரியேல் அறிவித்த இறைச்செய்தியுடன் உள்ள சொற்பிணைப்பைப் பாதுகாக்க ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘வாக்குறுதி’ என்பது அளவுக்கு மீறிய விளக்கமாகும்.
theological_decisions:
- issue: παρὰ τοῦ θεοῦ πᾶν ῥῆμα என்ற சொற்றொடரின் பொருள்
  choice: கடவுளிடமிருந்து வரும் எந்த வார்த்தையும் நிறைவேறாமல் போகாது.
  alternative: கடவுளால் இயலாதது ஒன்றுமில்லை.
  rationale: ῥῆμα என்ற சொல் கிரேக்கத்தில் வெளிப்படையாக இருப்பதால், முதன்மை உரை ‘வார்த்தை’ என்பதைப் பாதுகாக்கிறது; இது மரியாளிடம் அறிவிக்கப்பட்ட இறைவார்த்தை என்ற உடனடி சூழலுக்கும் பொருந்துகிறது. παρά என்பதைக் கடவுளிடமிருந்து வரும் மூலமாகப் புரிந்துகொள்ளலாம். அதேவேளை, கடவுளின் வல்லமையை மையப்படுத்தும் பாரம்பரிய வாசிப்பும் இலக்கணரீதியாக சாத்தியமானதால் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘தேவன்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரையில் ‘வார்த்தை’ பாதுகாக்கப்பட்டு, தமிழில் இயல்புக்காக அதன் விளைவு ‘நிறைவேறாமல் போகாது’ என வினைமயமாக்கப்பட்டுள்ளது.
