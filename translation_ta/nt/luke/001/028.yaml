source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: ta
  text: அவன் அவளிடம் வந்து, “வாழ்த்துகள்[a], அருள் பெற்றவளே[b], ஆண்டவர் உன்னோடு இருக்கிறார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மகிழ்வாயாக”; பாரம்பரியமாக “வாழ்க.” கிரேக்கத்தில் இது வடிவப்படி “மகிழ்வாயாக” என்ற கட்டளை; இங்கு வாழ்த்துரையாகப் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “மிகுந்த அருள் பெற்றவளே,” “அருளளிக்கப்பட்டவளே”; பாரம்பரியமாக “அருளால் நிறைந்தவளே.” கிரேக்கச் சொல் அருள் அல்லது தயவு காட்டப்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: அவன் அவளிடம் வந்து
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய உடன்நிகழ்வை அறிமுகப்படுத்துகிறது; πρός திசையையும் அணுகுதலையும் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘அவளிடம் வந்து’ இவ்விரண்டையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: Χαῖρε
  choice: வாழ்க
  rationale: இது χαίρω என்பதன் கட்டளை வடிவமாக இருந்தாலும், இங்கு வாழ்த்துரையாகப் பயன்படுகிறது. ‘வாழ்க’ தமிழ் வாழ்த்துரையாக இயல்பாக இருந்து, மூலத்தின் கட்டளைவடிவச் சாயலையும் ஓரளவு காக்கிறது.
- source_word: κεχαριτωμένη
  choice: அருள் பெற்றவளே
  rationale: χαριτόω என்பதன் நிறைவுநிலைச் செயப்பாட்டு வினையெச்சம்; மரியா அருள் அல்லது தயவைப் பெற்றவர் என்பதே இலக்கண வலிமை. ‘அருள் பெற்றவளே’ bestowed grace என்பதைக் காட்டுகிறது; உள்ளார்ந்த அருள் நிறைவைத் தானாக முன்வைப்பதில்லை.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: தேவனைச் சுட்டும் κύριος என்ற மரியாதைத் தலைப்புக்கு வேதாகமத் தமிழில் இயல்பான, புரியத்தக்க இணை.
- source_word: μετὰ σοῦ
  choice: உன்னோடு இருக்கிறார்
  rationale: μετά + உரிய வேற்றுமை ‘உடன்’ என்ற பொருளைத் தருகிறது; தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக மரியாதை ஒருமை வினை சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மரியாவைப் பற்றிய κεχαριτωμένη என்ற இறையியல் உணர்வுள்ள சொல்லின் மொழிபெயர்ப்பு
  choice: அருள் பெற்றவளே
  alternative: மிகுந்த அருள் பெற்றவளே; அருளால் நிறைந்தவளே
  rationale: கிரேக்கச் சொல் செயப்பாட்டு வடிவில் இருப்பதால், மரியா தேவனிடமிருந்து அருளைப் பெற்றவர் என்பதை முன்னிறுத்துகிறது. இது வசனத்தின் வலுவான உறுதிப்பாட்டைக் காக்கிறது; அதே நேரத்தில் பிற்காலக் கோட்பாட்டு விளக்கத்தை மூலத்தில் வெளிப்படையாக இருப்பதுபோல் சேர்ப்பதில்லை. பாரம்பரிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘வாழ்க’ சற்றுப் பாரம்பரியமானதாயினும் இன்னும் புரியக்கூடிய வாழ்த்து; அதன் நேரடியான ‘மகிழ்வாயாக’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. பெண்பால் அழைப்புமுறை ‘அருள் பெற்றவளே’ மூலத்தின் நேரடி அழைப்பைத் தெளிவாகக் காட்டுகிறது.
