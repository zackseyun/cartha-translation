  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: ta
  text: “மக்களிடையே இருந்த என் அவமானத்தை[a] நீக்குவதற்காக, என்னைக் கவனித்த நாட்களில் ஆண்டவர் எனக்கு இவ்வாறு செய்திருக்கிறார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இழிவு” அல்லது “பழி.” கிரேக்கச் சொல் குறிப்பாக மக்களிடையே ஏற்படும் அவமதிப்பையும் கண்ணிய இழப்பையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: மேற்கோள் வாக்கியத்தால் வெளிப்படுத்தப்பட்டது
  rationale: முந்தைய வசனத்தின் ‘என்று சொல்லி’ என்ற அமைப்போடு இவ்வசனம் தொடர்வதால், தனியாக ‘ஏனெனில்’ என்று சேர்ப்பதைவிட நேரடி மேற்கோளாகத் தொடங்குவது இயல்பான தமிழாகும்; ὅτι இங்கு சொல்லப்பட்டவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: Οὕτως μοι πεποίηκεν
  choice: அவர் எனக்கு இப்படிச் செய்திருக்கிறார்
  rationale: Οὕτως என்பதன் வலியுறுத்தப்பட்ட முறையையும், μοι உடன் வரும் πεποίηκεν என்பதன் தனிப்பட்ட தெய்வச் செயலையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இச்சூழலில் எலிசபெத்து கடவுளைக் குறிக்கும் மரியாதைத் தலைப்பாக κύριος என்பதைக் பயன்படுத்துகிறாள்.
- source_word: ἐν ἡμέραις αἷς ἐπεῖδεν
  choice: ஆண்டவர் என்னை நோக்கிய நாட்களில்
  rationale: காலத்தைக் குறிக்கும் தொடர்பு அமைப்பையும், கவனத்தோடு நோக்குதல் என்ற ἐπεῖδεν சொல்லின் பார்வை உருவகத்தையும் பாதுகாக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘என்னை’ என்பது சூழலிலிருந்து இயல்பாக நிரப்பப்படுகிறது.
- source_word: ἀφελεῖν
  choice: நீக்குவதற்காக
  rationale: இறைச் செயலின் நோக்கம் அல்லது விளைவாக அமைந்துள்ள வினையெச்சப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὄνειδός μου
  choice: எனக்கு இருந்த அவமானம்
  rationale: தனிப்பட்ட உணர்வை மட்டும் அல்லாமல், குழந்தையின்மையால் சமூகத்தில் ஏற்பட்ட அவமதிப்பு மற்றும் கண்ணிய இழப்பையும் குறிக்கக்கூடிய இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ἐν ἀνθρώποις
  choice: மக்களிடையே
  rationale: அவமானம் அனுபவிக்கப்பட்ட சமூக வட்டத்தைப் பாலினப் பாகுபாடின்றித் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: κύριος என்பவர் யார்?
  choice: கடவுளைக் குறிக்கும் ‘ஆண்டவர்’
  alternative: இச்சூழலில் குறிப்பிடத்தக்க வேறு வாசிப்பு இல்லை
  rationale: எலிசபெத்து தனது குழந்தையின்மையையும் அதனுடன் தொடர்புடைய சமூக அவமானத்தையும் நீக்கிய கடவுளின் செயலைப் பற்றிப் பேசுகிறாள்; உடனடி சூழலில் தேவையற்ற கிறிஸ்தியல் குறிப்பைச் சேர்க்காமல் தலைப்பின் இறையியல் நிறையை இது காக்கிறது.
- issue: ὄνειδος என்பதன் சமூகப் பொருள்
  choice: அவமானம்
  alternative: இழிவு; பழி
  rationale: இந்தச் சொல் உள்ளார்ந்த வெட்க உணர்வை மட்டும் குறிப்பதில்லை; மக்களிடையே ஏற்பட்ட சமூக அவமதிப்பையும் கண்ணிய இழப்பையும் குறிக்கிறது. ‘அவமானம்’ இயல்பான தமிழில் இரு பரிமாணங்களையும் தாங்குகிறது; அடிக்குறிப்பு சமூக வலியுறுத்தலைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னை நோக்கிய’ என்பது மூலத்தின் பார்வை உருவகத்தைத் தக்கவைக்கிறது; ‘கருணையுடன்’ போன்ற விளக்கச் சொற்கள் மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
