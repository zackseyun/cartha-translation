    text: அல்லது, “அவரைக் கண்டு.” கிரேக்கப் பங்கேற்புவினையை இவ்வாறு இன்னும் நேரடியாக மொழிபெயர்க்கலாம்; இங்குள்ள சூழலில் அது ‘கண்டபோது’ என்ற காலப்பொருளைத் தருகிறது.
