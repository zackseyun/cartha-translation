lexical_decisions:
- source_word: ἐταράχθη
  choice: கலக்கமடைந்தார்
  rationale: உள்ளத்தில் ஏற்பட்ட குழப்பத்தையும் மனக்கலக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்து வரும் φόβος குறிப்பிடும் பயத்தை முன்கூட்டியே மிகைப்படுத்துவதில்லை.
- source_word: Ζαχαρίας
  choice: சகரியா
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: ἰδών
  choice: அவரைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் சூழல்சார் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘அவரை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தூதரைச் சுட்டும் சூழலிலிருந்து தெளிவாகிறது.
- source_word: φόβος
  choice: பயம்
  rationale: சொல்லின் பொதுவான பொருளை நேரடியாகத் தருகிறது; ‘திகில்’ போன்ற வலுவான சொற்களால் தேவையின்றி தீவிரப்படுத்துவதில்லை.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: அவரை ஆட்கொண்டது
  rationale: ‘அவர்மேல் விழுந்தது’ என்ற கிரேக்கச் சொற்றொடரின் பொருளை நவீன தமிழில் இயல்பாகவும் வலிமையுடனும் வெளிப்படுத்துகிறது.
