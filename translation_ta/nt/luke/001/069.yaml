revisions:
- from: அவர் தமது ஊழியனாகிய தாவீதின் வீட்டில் நமக்காக இரட்சிப்பின் கொம்பை எழுப்பியிருக்கிறார்.[a]
  to: அவர் தமது ஊழியனாகிய தாவீதின் வம்சத்தில் நமக்காக இரட்சிப்பின் கொம்பை எழுப்பியிருக்கிறார்.[a]
  rationale: The revision changes only the Tamil rendering of ‘in the house of David’ to its intended dynastic sense. It preserves the Greek metaphor ‘horn of salvation,’ the benefactive force of ‘for us,’ and David’s designation as God’s servant. The footnote remains anchored to the metaphor and supplies the established interpretive alternative.
