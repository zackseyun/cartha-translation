source:
  edition: SBLGNT
  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: ta
  text: அவர் தமது ஊழியனாகிய தாவீதின் வம்சத்தில் நமக்காக இரட்சிப்பின் கொம்பை எழுப்பியிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வல்லமையுள்ள இரட்சகரை.’ சொல்லுக்குச் சொல், ‘இரட்சிப்பின் கொம்பை’; இது வல்லமையான விடுதலையைக் குறிக்கும் வேதாகம உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: எழுப்பியிருக்கிறார்
  rationale: இறைவனுடைய இரட்சிப்புச் செயல் நிகழ்ந்துவிட்டதாக சகரியாவின் துதிப்பாடல் கொண்டாடும் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்தும் நிறைவுற்ற நிகழ்கால வடிவம்; ‘எழுப்புதல்’ என்ற வேதாகம மரபுத்தொடரையும் காக்கிறது.
- source_word: κέρας σωτηρίας
  choice: இரட்சிப்பின் கொம்பு
  rationale: வலிமையையும் வெற்றிகரமான விடுதலையையும் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது; மூலத்தின் பெயர்ச்சொல் தொடர்பையும் பிரதிபலிக்கிறது.
- source_word: ἡμῖν
  choice: நமக்காக
  rationale: இது பயனைக் குறிக்கும் வேற்றுமையாக இருப்பதால், வெறும் திசையைவிட நமக்குக் கிடைக்கும் நன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: தாவீதின் வீட்டில்
  rationale: ‘வீடு’ என்பது இங்கு வம்சத்தைக் குறித்தாலும், தாவீதுடனான உடன்படிக்கைத் தொடர்பையும் மூலத்தின் உருவகத்தையும் காக்கச் சொற்றொடர் நேரடியாக வைக்கப்படுகிறது.
- source_word: παιδὸς αὐτοῦ
  choice: தமது ஊழியனாகிய
  rationale: தாவீது இறைவனோடு கொண்ட உறவில் παῖς என்பது இங்கு சிறுபிள்ளை என்பதல்ல, அவருடைய ஊழியன் என்பதைக் குறிக்கிறது; ‘தமது’ என்பது எழுப்பிய இறைவனையே சுட்டுகிறது.
theological_decisions:
- issue: κέρας σωτηρίας என்ற உருவகத்தை அப்படியே வைப்பதா அல்லது ‘வல்லமையுள்ள இரட்சகர்’ என்று விளக்குவதா
  choice: முதன்மை உரையில் ‘இரட்சிப்பின் கொம்பு’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: வல்லமையுள்ள இரட்சகர்
  rationale: கிரேக்க உரையிலுள்ள தெளிவான பழைய ஏற்பாட்டு அரச மற்றும் வெற்றிகரமான இரட்சிப்பு உருவகத்தைப் பாதுகாப்பது இலக்கிய, இறையியல் தொடர்புகளை நிலைநிறுத்துகிறது; புரிதலுக்காக மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘இரட்சிப்பு’, ‘ஊழியன்’ ஆகியவை பரவலாக அறியப்பட்ட சமயச் சொற்களாக இருப்பதால் வைக்கப்பட்டுள்ளன; அரிதாகத் தோன்றக்கூடிய ‘கொம்பு’ உருவகம் அடிக்குறிப்பால் விளக்கப்படுகிறது.
