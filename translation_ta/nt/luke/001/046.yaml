id: LUK.1.46
reference: Luke 1:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: ta
  text: 'மரியாளும் கூறினாள்: “என் ஆன்மா ஆண்டவரை மேன்மைப்படுத்துகிறது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆன்மா ஆண்டவரின் மகத்துவத்தைப் போற்றுகிறது.”
    reason: μεγαλύνει என்பது ‘மேன்மைப்படுத்துதல்’ என்றும், ஒருவரின் மகத்துவத்தைப் புகழ்ந்து அறிவித்தல் என்றும் பொருள்படலாம்; மாற்று வடிவம் உருவகத்தின் கருத்தைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: Καὶ
  choice: அப்போது
  rationale: கிரேக்க இணைப்புச் சொல் இங்கு கதைத் தொடர்ச்சியைச் சுட்டுகிறது; இயல்பான நவீனத் தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது, அதேவேளையில் தேவையற்ற வலுவான காலப் பொருளைச் சேர்ப்பதில்லை.
- source_word: εἶπεν
  choice: சொன்னாள்
  rationale: கதை அறிமுகத்தில் λέγω என்பதன் இறந்தகால வடிவத்துக்கு இயல்பான தமிழாக்கம்; மரியாளைக் குறிக்கும் பெண்பால் வினைமுற்றும் தெளிவாக உள்ளது.
- source_word: Μαριάμ
  choice: மரியாள்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: Μεγαλύνει
  choice: மேன்மைப்படுத்துகிறது
  rationale: ‘பெரிதாக்குகிறது’ என்ற சொற்சொல் மொழிபெயர்ப்பின் தவறான உடல் சார்ந்த எண்ணத்தைத் தவிர்த்து, ஒருவரின் மகத்துவத்தைப் புகழ்ந்து உயர்த்தும் கவித்துவப் பொருளைப் பாதுகாக்கிறது. நிகழ்கால வடிவமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἡ ψυχή μου
  choice: என் ஆன்மா
  rationale: ‘நான்’ என்று சுருக்காமல், மூலத்தின் செமித்திய-கவித்துவமான மனித இயல்பு சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது; ‘ஆன்மா’ நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய, கண்ணியமான வடிவம்.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: κύριος இங்கு கடவுளைக் குறிக்கும் மரியாதைக்குரிய பட்டமாக உள்ளது; ‘ஆண்டவர்’ அதன் வேதாகம-இறையியல் நிறையை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் இது கடவுளை நோக்கிய வேதப்புகழ்ச்சி மொழியின் பட்டம். ‘எஜமான்’ என்பது சாத்தியமான சொற்பொருளாயினும், இங்கு மிகக் குறுகிய மனித உறவுப் பொருளைத் தரக்கூடும்.
- issue: ἡ ψυχή μου என்னும் மனித இயல்பு சார்ந்த கவித்துவ வெளிப்பாடு
  choice: என் ஆன்மா
  alternative: நான் / என் உள்ளம்
  rationale: மூலத்தின் கவித்துவமான ‘ஆன்மா’ மொழியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது. ‘நான்’ என்பது உருவகத்தைத் தட்டையாக்கும்; ‘என் உள்ளம்’ இயல்பானதாயினும் ψυχή என்பதன் தனித்த சொல்லாட்சியை ஓரளவு விளக்கமாக மாற்றும்.
- issue: μεγαλύνει என்பதிலுள்ள புகழ்ச்சி உருவகம்
  choice: மேன்மைப்படுத்துகிறது
  alternative: மகத்துவத்தைப் போற்றுகிறது
  rationale: மரியாள் ஆண்டவரை உண்மையில் அதிக மகத்துவமுள்ளவராக்குகிறாள் என்று பொருள் கொள்ளாமல், அவரை மகத்துவமுள்ளவராகப் புகழ்ந்து உயர்த்துகிறாள் என்ற கவித்துவத் திணறலைத் தக்கவைக்கிறது; தெளிவான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடல் தொடங்கும் கண்ணியமான கவித்துவத் தொனி பேணப்பட்டுள்ளது. ‘ஆன்மா,’ ‘ஆண்டவர்,’ ‘மேன்மைப்படுத்துகிறது’ ஆகியவை சாதாரண வாசகருக்குப் புரியுமாறும் வேதாகமச் சொல்லாட்சியின் செறிவை இழக்காதவாறும் தேர்ந்தெடுக்கப்பட்டன.
