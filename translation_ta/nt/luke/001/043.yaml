  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: ta
  text: என் ஆண்டவரின் தாய் என்னிடம் வருகிற இந்தச் சிறப்பு எனக்கு எப்படிக் கிடைத்தது[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்ந்து, “என் ஆண்டவரின் தாய் என்னிடம் வருவது—இது எனக்கு எங்கிருந்து வந்தது?” இது இப்படிப்பட்ட சிறப்பு தனக்குக் கிடைத்ததைக் குறித்த வியப்பை வெளிப்படுத்தும் ஒரு சொல்வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν
  choice: எப்படி
  rationale: இதன் அடிப்படைப் பொருள் ‘எங்கிருந்து’ என்பதாக இருந்தாலும், இங்கு எதிர்பாராத பெருமை தனக்குக் கிடைத்ததைப் பற்றிய வியப்பை வெளிப்படுத்தும் இடியமாக உள்ளது. நவீனத் தமிழில் ‘எப்படி’ அந்த வியப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: μοι ... πρὸς ἐμέ
  choice: எனக்கு ... என்னிடம்
  rationale: μοι எதிர்பாராத பேற்றைப் பெறுகிற நபரையும், πρὸς ἐμέ எலிசபெத்தை நோக்கிய வருகையையும் குறிக்கின்றன; இரண்டின் வேறுபாடும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: τοῦτο
  choice: இந்தப் பேறு
  rationale: τοῦτο என்பது வெறுமனே ‘இது’ என்றாலும், இக்கூற்றில் எலிசபெத் வியக்கும் எதிர்பாராத சிறப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் கூற ‘இந்தப் பேறு’ என மொழிபெயர்க்கப்பட்டுள்ளது. சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα ἔλθῃ
  choice: வருகிற
  rationale: இங்கு ἵνα வியப்புக்குரிய நிகழ்வின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் பெயரெச்சத் தொடரான ‘வருகிற இந்தப் பேறு’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: என் ஆண்டவரின் தாய்
  rationale: ‘என் ஆண்டவர்’ என்பது κυρίου μου என்பதன் மரியாதையையும் கிறிஸ்துவைப் பற்றிய வலிமையையும் காக்கிறது; பின்னாளைய இறையியல் விளக்கத்தை வசனத்தில் சேர்ப்பதில்லை.
theological_decisions:
- issue: κυρίου என்பதன் மொழிபெயர்ப்பு
  choice: என் ஆண்டவர்
  alternative: என் எஜமான்
  rationale: κύριος இங்கு எலிசபெத் மரியாதையுடன் அறிக்கையிடும் பட்டமாக உள்ளது. ‘ஆண்டவர்’ அதன் கிறிஸ்துவியல் வலிமையைத் தக்கவைக்கிறது; வசனம் கூறுவதைத் தாண்டிய பிற்காலக் கோட்பாட்டு சொற்றொடர்களைச் சேர்ப்பதில்லை.
- issue: πόθεν μοι τοῦτο என்ற இடியத்தைச் சொற்சார்ந்ததா அல்லது இயல்பான தமிழிலா தருவது
  choice: இந்தப் பேறு எனக்கு எப்படிக் கிடைத்தது?
  alternative: இது எனக்கு எங்கிருந்து வந்தது?
  rationale: சொற்சார்ந்த மாற்று தமிழில் பொருள் மங்கக்கூடும். தேர்ந்த வடிவம் எதிர்பாராத சிறப்பு தனக்குக் கிடைத்ததைப் பற்றிய எலிசபெத்தின் வியப்பை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பேறு’ என்பது எதிர்பாராத சிறப்பைச் சுருக்கமாகத் தெரிவிக்கிறது; கேள்வி வடிவம் எலிசபெத்தின் வியப்பை நிலைநிறுத்துகிறது.
