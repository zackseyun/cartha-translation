  source_fidelity: முதன்மை உரை πόθεν μοι τοῦτο என்ற வியப்பூட்டும் வினாவையும், μοι/πρὸς ἐμέ ஆகிய இரு வேறுபட்ட தொடர்புகளையும், ἡ μήτηρ τοῦ κυρίου μου என்பதையும் துல்லியமாகக் காக்கிறது. ‘இந்தச் சிறப்பு ... எப்படிக் கிடைத்தது?’ என்பது மூலத்தில் உட்கிடக்கும் எதிர்பாராத அருள்பேற்றின் உணர்வை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ἵνα ἔλθῃ-யின் நிகழ்வு/உள்ளடக்கத் தொடர்பை ‘வருகிற இந்தச் சிறப்பு’ போதுமானவாறு தருகிறது.
  naturalness: ‘என் ஆண்டவரின் தாய் என்னிடம் வருகிற இந்தச் சிறப்பு எனக்கு எப்படிக் கிடைத்தது?’ என்பது கண்ணியமான, தெளிவான நவீன நிலையான தமிழ். ‘பேறு’ என்பதற்குப் பதிலாக ‘சிறப்பு’ பொதுவாசகர்களுக்கு மேலும் நடுநிலையாகவும் எளிதாகவும் உள்ளது.
