  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: ta
  text: இதோ, இவை நிகழும் நாள்வரை நீ பேச முடியாமல் மௌனமாக இருப்பாய்[a]. ஏனெனில், ஏற்ற காலத்தில்[b] நிறைவேறும் என் வார்த்தைகளை நீ நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘மௌனமாக இருப்பாய்’ என்பதுடன் ‘பேச முடியாமல்’ என்பதும் இணைக்கப்பட்டுள்ளது; இது அவருக்கு விதிக்கப்பட்ட பேச இயலாத நிலையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றுக்குரிய குறிக்கப்பட்ட காலத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் திடீர்த்தன்மையையும் தூதரின் அறிவிப்புக்குரிய கண்ணியத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: நீ பேச முடியாமல் மௌனமாக இருப்பாய்
  rationale: எதிர்கால நிலையைச் சுட்டும் அமைப்பையும், இது விருப்ப மௌனம் அல்லாமல் பேச இயலாத கட்டாய நிலை என்பதையும் இரு கூறுகளோடு காக்கிறது.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: இவை நிகழும் நாள்வரை
  rationale: குறிப்பிட்ட நிகழ்வுகள் நடந்தேறும் வரையிலான கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνθ’ ὧν
  choice: ஏனெனில்
  rationale: சகரியாவின் பேச இயலாமைக்கான காரணத்தை இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: என் வார்த்தைகளை நீ நம்பவில்லை
  rationale: πιστεύω என்பதன் இங்குள்ள பொருள் கூறப்பட்ட வார்த்தைகளை உண்மையென ஏற்றுக்கொள்வதாகும்; λόγοι என்பதையும் நேரடியாகக் காக்கிறது.
- source_word: πληρωθήσονται
  choice: நிறைவேறும்
  rationale: செயப்பாட்டு வடிவத்தின் உணர்வை தமிழில் இயல்பாகக் கொண்டு, அறிவிக்கப்பட்ட வார்த்தைகள் நிச்சயமாக நிறைவு பெறும் பொருளைக் காக்கிறது.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: ஏற்ற காலத்தில்
  rationale: καιρός என்பது வெறும் காலப்புள்ளியை அல்லாமல் பொருத்தமான அல்லது குறிக்கப்பட்ட நேரத்தைக் குறிக்கிறது; தமிழில் இயல்பாக 'ஏற்ற காலம்' என வழங்கப்படுகிறது.
theological_decisions:
- issue: சகரியாவுக்கு விதிக்கப்பட்ட தீர்ப்பின் தன்மை
  choice: வாக்குறுதி நிறைவேறும் வரை அவருக்குப் பேச இயலாத நிலை விதிக்கப்படுகிறது.
  alternative: இது தன்னிச்சையாக அமைதியாக இருக்கும்படி கொடுக்கப்பட்ட கட்டளை மட்டுமே என்று வாசித்தல்.
  rationale: ‘மௌனமாக இருப்பாய்’ என்பதோடு ‘பேச முடியாமல்’ என்பதும் இணைந்திருப்பதால், விருப்ப மௌனத்தைவிட விதிக்கப்பட்ட இயலாமையே தெளிவாகிறது; மொழிபெயர்ப்பு இரு கூறுகளையும் காக்கிறது.
- issue: καιρός என்பதிலுள்ள காலக் கருத்து
  choice: வார்த்தைகள் அவற்றுக்குரிய ஏற்ற காலத்தில் நிறைவேறும்.
  alternative: வார்த்தைகள் முன்குறிக்கப்பட்ட காலத்தில் நிறைவேறும்.
  rationale: சூழல் தெய்வீக நேரத்தை உணர்த்தினாலும், மூலச்சொல் தனியாக முன்நியமனத்தின் முறையை விளக்கவில்லை; ஆகவே 'ஏற்ற காலம்' என்ற திறந்த, இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், தூதரின் அறிவிப்புக்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘இதோ’ என்பது வேதாகம நடையின் செறிவை வைத்திருந்தாலும் இன்றைய வாசகருக்குப் புரியும். ‘ஊமையாக’ என்ற மருத்துவ அல்லது அடையாளப்படுத்தும் சொல் தவிர்க்கப்பட்டு, மூலத்தின் இரட்டை வலியுறுத்தல் இயல்பாகத் தரப்பட்டது.
