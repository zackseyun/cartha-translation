source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: ta
  text: அதற்கு மரியா தூதரிடம், “நான் ஒரு ஆணை அறிந்ததில்லையே; இது எப்படி நிகழும்?” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: காபிரியேலின் அறிவிப்புக்கும் மரியாவின் மறுமொழிக்கும் இடையிலான மென்மையான மாறுபாட்டைக் காட்டுகிறது; கிரேக்க இணைப்புச் சொல்லின் எதிர்மறைத் திருப்பத்தை மிகைப்படுத்தவில்லை.
- source_word: Μαριὰμ
  choice: மரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: πρὸς τὸν ἄγγελον
  choice: தூதரிடம்
  rationale: சூழலில் இது பரலோகத் தூதரைக் குறிக்கிறது; இயல்பான தமிழில் பேசப்பட்ட நபரை ‘தூதரிடம்’ என்று குறிப்பிடுவது தெளிவு.
- source_word: Πῶς ἔσται τοῦτο
  choice: இது எப்படி நிகழும்?
  rationale: அறிவிக்கப்பட்ட கருத்தரிப்பும் பிறப்பும் எவ்வாறு நிறைவேறும் என்ற கேள்வியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπεὶ
  choice: …அறியாதிருக்கிறேனே
  rationale: கிரேக்கத்தின் காரணப் பொருளைத் தமிழில் ‘-ஏனெனில்’ என்று கனமாக்காமல், காரணத்தை எடுத்துரைக்கும் இயல்பான ‘-ஏனே’ அமைப்பால் காட்டுகிறது.
- source_word: ἄνδρα
  choice: ஓர் ஆணை
  rationale: இங்கு ἀνήρ என்பதைக் ‘கணவன்’ என்று குறுக்காமல் ‘ஆண்’ என வழங்குகிறது; பாலுறவைக் குறிக்கும் மறைமுகச் சொற்றொடரின் பரப்பை இது காக்கிறது.
- source_word: οὐ γινώσκω
  choice: அறியாதிருக்கிறேன்
  rationale: நிகழ்கால கிரேக்க வினையை நிகழ்கால நிலையைக் குறிக்கும் தமிழில் வழங்கி, ‘அறிதல்’ என்ற மரியாதையான மறைமுகப் பேச்சையும் பாதுகாக்கிறது; அதன் பாலுறவுச் சார்ந்த பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
theological_decisions:
- issue: மரியாவின் கூற்றும் இயேசுவின் கன்னிப் பிறப்பும்
  choice: ‘ஓர் ஆணை அறியாதிருக்கிறேன்’ என்ற மூலமொழியின் மறைமுகச் சொற்றொடரை முதன்மை உரையில் வைத்தல்
  alternative: ‘ஓர் ஆணுடன் பாலுறவு கொண்டதில்லை’ அல்லது ‘நான் கன்னியாக இருக்கிறேன்’
  rationale: கிரேக்கம் பாலுறவு இல்லாத நிலையை ‘ஓர் ஆணை அறியவில்லை’ என்ற அடக்கமான மரபுத்தொடரால் தெரிவிக்கிறது. ‘கன்னி’ என்று நேரடியாக மாற்றுவது கருத்தைச் சரியாகச் சுருக்கினாலும் மூலத்தின் சொல் வடிவத்தை விட அதிகமாக விளக்கிவிடும்; ஆகவே உண்மையான மறைமுகத்தன்மை முதன்மை உரையில் காக்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தூதரிடம்’, ‘நிகழும்’ ஆகியவை தெளிவை அளிக்கின்றன; ‘ஓர் ஆணை அறியாதிருக்கிறேன்’ என்பது மூலத்தின் மரியாதையான மறைமுகப் பேச்சையும் இறையியல் பதற்றத்தையும் காக்கிறது.
