  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: ta
  text: நம் பகைவர்களிடமிருந்தும், நம்மை வெறுக்கிற அனைவரின் கையிலிருந்தும் மீட்பு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் பகைவர்களிடமிருந்தும், நம்மை வெறுக்கிற அனைவரின் அதிகாரத்திலிருந்தும் இரட்சிப்பு.’
    reason: σωτηρίαν என்பதற்கு ‘இரட்சிப்பு’ என்றும், ἐκ χειρός என்ற மரபுத்தொடருக்கு ‘அதிகாரத்திலிருந்து’ என்றும் பொருள் கொள்ளக்கூடிய சொற்பொருள் மாற்றை பதிவு செய்கிறது.
lexical_decisions:
- source_word: σωτηρίαν
  choice: மீட்பு
  rationale: இங்கு பகைவர்களிடமிருந்து காப்பாற்றப்படுதல் என்ற தெளிவான சூழல் இருப்பதால் ‘மீட்பு’ இயல்பாக உள்ளது; அதேவேளையில் லூக்காவின் விரிந்த இரட்சிப்புக் கருத்தையும் இது விலக்குவதில்லை.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: நம் பகைவர்களிடமிருந்து
  rationale: ἐξ குறிக்கும் பிரிவு அல்லது விடுதலையின் மூலத்தை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘அதிகாரத்திலிருந்து’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἐκ χειρὸς
  choice: கையிலிருந்து
  rationale: χείρ இங்கு அதிகாரம் அல்லது பிடியைக் குறிக்கும் மரபுத்தொடர். ‘கையிலிருந்து’ என்ற உருவகத்தைத் தக்கவைத்தல் வேதாகம மொழிநடையையும் பழைய ஏற்பாட்டு எதிரொலியையும் காக்கிறது; தமிழிலும் புரியக்கூடியது.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: நம்மை வெறுக்கிற அனைவரின்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பான நவீன தமிழில் தருகிறது; தொடரும் அல்லது பண்பியல்பான வெறுப்பையும் காக்கிறது.
- source_word: καὶ
  choice: உம் … உம்
  rationale: இரண்டு ἐκ சொற்றொடர்களையும் சமமாக இணைக்கும் καὶ என்பதைக் தமிழின் இயல்பான இணைப்பு அமைப்பால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சகரியாவின் தீர்க்கதரிசனத்தில் வாக்களிக்கப்படும் σωτηρίαν என்பதன் இயல்பு
  choice: பகைவர்களிடமிருந்து கிடைக்கும் நிகழ் விடுதலையையும் விரிந்த இறையியல் மீட்பையும் ஒருசேர அனுமதிக்கும் ‘மீட்பு’
  alternative: முற்றிலும் அரசியல் சார்ந்த தேசிய விடுதலை; அல்லது பாவத்திலிருந்து கிடைக்கும் முற்றிலும் ஆவிக்குரிய இரட்சிப்பு
  rationale: வசனம் பகைவர்களையும் வெறுப்பவர்களையும் நேரடியாகக் குறிப்பிடுகிறது; ஆனால் லூக்கா 1-இன் சூழலில் σωτηρία மொழி விரிந்த மீட்புப் பொருளையும் கொண்டுள்ளது. மொழிபெயர்ப்பு இவ்விரண்டில் ஒன்றாக மட்டும் குறுக்கக்கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிதில் புரியும், கண்ணியமான வேதாகம நடையில் அமைந்துள்ளது. ‘கையிலிருந்து’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு, அதன் பொருளான ‘அதிகாரத்திலிருந்து’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் பாடல் வாக்கியத் துணுக்காக இருப்பதால் இறுதியில் ‘கிடைக்கும்’ சேர்க்கப்பட்டுள்ளது; இது தமிழில் பொருளைத் தெளிவாக்குகிறது.
