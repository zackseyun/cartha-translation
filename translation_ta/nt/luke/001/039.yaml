  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: ta
  text: அந்த நாட்களில் மரியாள் எழுந்து, யூதா நாட்டின் மலைநாட்டிலுள்ள ஓர் ஊருக்கு[a] விரைந்து சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் ஒரு நகருக்கு” அல்லது “யூதேயாவிலுள்ள ஓர் ஊருக்கு.” கிரேக்கச் சொல்லான πόλις என்பது “நகரம்” அல்லது “ஊர்” என்ற இரு பொருள்களையும் தரலாம்; Ἰούδα என்பது யூதா/யூதேயா பிராந்தியத்தைக் குறிக்கக்கூடும்.
    reason: πόλις என்பதன் நகரம்/ஊர் என்ற சொற்பொருள் மாற்றையும் Ἰούδα என்பதன் யூதா/யூதேயா என்ற புவியியல் வழங்கல் மாற்றையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: எழுந்து
  rationale: ἀνίστημι என்பதன் இறந்தகால வினையெச்சம்; முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது. ‘எழுந்து’ என்பது மூலத்தின் காட்சியையும் நிகழ்வுகளின் வரிசையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் ‘ஆனால்’ அல்லது ‘இப்போது’ போன்ற தேவையற்ற இணைப்புச் சொல் சேர்க்கப்படவில்லை.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: அந்த நாட்களில்
  rationale: காலத்தைக் குறிக்கும் இச்சொற்றொடரின் சுட்டுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπορεύθη
  choice: சென்றாள்
  rationale: πορεύομαι இச்சூழலில் பயணம் செய்தல் அல்லது செல்லுதல் என்று பொருள்படும்; ‘சென்றாள்’ இயல்பானதும் போதுமான பரப்புடையதுமான தமிழ் வடிவம்.
- source_word: εἰς τὴν ὀρεινὴν
  choice: மலைநாட்டிலுள்ள
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ὀρεινή மலைப்பாங்கான பகுதியைக் குறிக்கிறது. அடுத்துள்ள ஊரின் இருப்பிடத்தைத் தமிழில் இயல்பாக இணைக்க ‘மலைநாட்டிலுள்ள’ என வழங்கப்பட்டுள்ளது.
- source_word: μετὰ σπουδῆς
  choice: விரைவாக
  rationale: σπουδή ஆர்வம், முனைப்பு அல்லது விரைவு ஆகிய பொருள்களைத் தரலாம். பயணச் சூழலில் தாமதமின்றி விரைந்து சென்றதை ‘விரைவாக’ இயல்பாக வெளிப்படுத்துகிறது; உள்ளார்ந்த உணர்ச்சியைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: εἰς πόλιν Ἰούδα
  choice: யூதாவின் ஓர் ஊருக்கு
  rationale: πόλις என்பது நகரத்தையோ ஊரையோ குறிக்கலாம்; பெயர் குறிப்பிடப்படாத குடியிருப்புக்கு ‘ஊர்’ இயல்பானது. Ἰούδα தனிநபரின் பெயராக அல்லாமல் யூதா என்ற பிராந்திய அல்லது கோத்திரப் பெயராகப் புரிந்துகொள்ளப்பட்டுள்ளது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: Ἰούδα என்பதன் அடையாளம்
  choice: பிராந்திய அல்லது கோத்திரப் பெயரான ‘யூதா’
  alternative: ‘யூதேயாவிலுள்ள ஓர் ஊர்’ அல்லது ‘யூதா என்ற பெயருடைய ஓர் ஊர்’
  rationale: இச்சூழலில் Ἰούδα என்பது யூதா/யூதேயா பிராந்தியத்தைக் குறிப்பதே மிகவும் இயல்பானது. ‘யூதா’ என்பது கிரேக்க வடிவத்துக்கு நெருக்கமாக இருந்து, குறிப்பிட்ட புவியியல் விளக்கத்தை மூலத்தைவிட அதிகமாகத் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மரியாள்’ என்ற பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அது சேர்க்கப்படவில்லை.
