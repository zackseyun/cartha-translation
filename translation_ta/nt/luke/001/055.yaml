  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: ta
  text: நம் தந்தையரிடம்[a] அவர் பேசியபடியே, ஆபிரகாமுக்கும் அவருடைய சந்ததிக்கும்[b] என்றென்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம் முன்னோர்களிடம்.’ கிரேக்கத்தில் சொற்படியாக ‘நம் தந்தையரிடம்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருடைய வித்துக்கும்.’ கிரேக்கத்தில் ‘வித்து,’ ‘சந்ததி,’ அல்லது ‘வழித்தோன்றல்கள்’ என்று பொருள்படக்கூடிய ஒருமைத் தொகுப்புப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: பேசியபடியே
  rationale: முந்தைய கூற்றுடன் ஒப்புமையையும், முன்பு உரைக்கப்பட்டதற்கு ஏற்ப நிகழ்வதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐλάλησεν
  choice: அவர் பேசினார்
  rationale: λαλέω என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; இறைவனைக் குறிக்கும் மரியாதைப் பன்மை தமிழில் இயல்பானது.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: நம் தந்தையரிடம்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மையையும் உடன்படிக்கை வரலாற்றில் முற்பிதாக்களைக் குறிக்கும் ஒலியையும் தக்கவைக்கிறது; பொதுவான ‘முன்னோர்கள்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῷ Ἀβραὰμ
  choice: ஆபிரகாமுக்கும்
  rationale: பெயரை வழக்கமான தமிழ் வேதாகம வடிவில் தருகிறது; முன்னுள்ள ‘தந்தையர்’ என்பதற்கு விளக்க இணைப்பாக உள்ள தத்திவை ‘-க்கும்’ மூலம் இயல்பாகக் காட்டுகிறது.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: அவருடைய சந்ததிக்கும்
  rationale: σπέρμα என்ற ஒருமைத் தொகுப்புப்பெயரின் ‘வித்து/சந்ததி/வழித்தோன்றல்கள்’ பொருள் பரப்பில், ‘சந்ததி’ இயல்பான தமிழாகவும் தொகுப்பொருளைத் தக்கவைக்கும் சொல்லாகவும் உள்ளது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: தொடர்ந்து நிலைக்கும் காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடருக்கு தெளிவான, dignified நவீன தமிழ் இணை.
theological_decisions:
- issue: πατέρας ἡμῶν என்பதிலுள்ள ஆண்பால் உடன்படிக்கை மொழி
  choice: நம் தந்தையர்
  alternative: நம் முன்னோர்கள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் பன்மையையும் இஸ்ரவேலின் முற்பிதாக்களை நினைவூட்டும் உடன்படிக்கைச் சாயலையும் முதன்மை உரையில் தக்கவைக்கிறது; பரந்த பொருள் அடிக்குறிப்பில் காட்டப்படுகிறது.
- issue: ஆபிரகாமிய வாக்குத்தத்தச் சூழலில் σπέρματι αὐτοῦ
  choice: அவருடைய சந்ததி
  alternative: அவருடைய வித்து; அவருடைய வழித்தோன்றல்கள்
  rationale: ‘சந்ததி’ ஒருமைத் தொகுப்புப்பொருளையும் ஆபிரகாமுடன் உள்ள உறவையும் இயல்பான தமிழில் காக்கிறது; ‘வித்து’ என்ற சொற்படியான மாற்று அடிக்குறிப்பில் தரப்படுவதால் மூலத்தின் இறையியல் ஒலிப்பு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் துணைப்பகுதி என்பதால், மூலத்தின் தொடர்ச்சியும் apposition அமைப்பும் காக்கப்பட்டுள்ளன; விளக்கமான ‘வாக்களித்தார்’ போன்ற சொல் சேர்க்கப்படவில்லை.
