reference: Luke 1:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: ta
  text: தேவதூதன் அவளுக்குப் பதிலளித்து, “பரிசுத்த ஆவி உன்மேல் வருவார்; உன்னதமானவரின் வல்லமை உன்மேல் நிழலிடும். ஆகையால், பிறக்கும் பரிசுத்தக் குழந்தை[a] ‘கடவுளின் மகன்’[b] என்று அழைக்கப்படும்” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிறக்கவிருக்கும் குழந்தை” என்றும் மொழிபெயர்க்கலாம். τὸ γεννώμενον என்ற கிரேக்கச் சொற்றொடர் சொல்லுக்கு நெருக்கமாக “பிறக்கிறவர்” அல்லது “பிறக்கிறது” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “மகன்” என்பதற்கு முன் வரையறைச் சுட்டி இல்லை. என்றாலும், இச்சூழலில் இது “ஒரு மகன்” என்ற வரையறையற்ற பொருளில் அல்லாமல் ஒரு பட்டப்பெயராகச் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: தேவதூதன் அவளுக்குப் பதிலளித்தான்
  rationale: ἀποκριθείς என்பதன் பதிலுரைக்கும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ἄγγελος இச்சூழலில் விண்ணுலகத் தேவதூதனைக் குறிக்கிறது.
- source_word: Πνεῦμα ἅγιον
  choice: பரிசுத்த ஆவி
  rationale: லூக்காவின் சூழலில் இது கடவுளின் ஆவியைக் குறிக்கிறது. ‘பரிசுத்த ஆவி’ என்பது தெளிவான, மரியாதைமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வழக்கு.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: உன்மேல் வருவார்
  rationale: ἐπί உடன் வரும் வினையின் வல்லமையான அணுகுதலை ‘உன்மேல்’ காக்கிறது; ஆவியைத் தனிப்பட்ட தெய்வீகச் செயலாளராகக் குறிப்பிட மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: δύναμις Ὑψίστου
  choice: உன்னதமானவரின் வல்லமை
  rationale: Ὑψίστου என்பதன் தெய்வீகப் பட்டப்பெயர் தன்மையையும், δύναμις என்பதன் ‘வல்லமை’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐπισκιάσει σοι
  choice: உன்மேல் நிழலிடும்
  rationale: தெய்வீகப் பிரசன்னத்தையும் செயலையும் சித்தரிக்கும் நிழல் உருவகத்தைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத உயிரியல் அல்லது பாலியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: διὸ καὶ
  choice: ஆகையால்
  rationale: முன் கூறப்பட்ட தெய்வீகச் செயலுக்கும் அடுத்து வரும் அடையாளத்துக்கும் இடையிலான விளைவு உறவை இயல்பான தமிழில் தெரிவிக்கிறது; καί-யின் வலியுறுத்தல் தமிழில் வாக்கியத் தொடர்பில் உள்ளடங்குகிறது.
- source_word: τὸ γεννώμενον ἅγιον
  choice: பிறக்கும் பரிசுத்தமானவர்
  rationale: நடுநிலை நிகழ்காலப் பெயரெச்சத்தின் ‘பிறக்கிறவர்/பிறக்கும் ஒன்று’ என்ற திறந்த வடிவை முடிந்தவரை காக்கிறது; குழந்தை என்று வெளிப்படையாகச் சேர்த்து மூலத்தின் இலக்கண வடிவத்தைத் தேவையின்றி குறுக்கவில்லை.
- source_word: κληθήσεται
  choice: என்று அழைக்கப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, பெயரிடப்படுதல் மற்றும் அந்த அடையாளத்தால் அறியப்படுதல் ஆகிய இரண்டிற்கும் இடமளிக்கிறது.
- source_word: υἱὸς θεοῦ
  choice: கடவுளின் மகன்
  rationale: கிரேக்கத்தில் υἱός முன் சுட்டுச்சொல் இல்லாவிட்டாலும், இச்சூழலில் இது வரையறையற்ற ‘ஒரு மகன்’ அல்ல, அடையாளப் பட்டப்பெயராகச் செயல்படுகிறது. தமிழ் உடைமைத் தொடர் இதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Πνεῦμα ἅγιον என்பதன் தெய்வீக, தனிப்பட்ட செயற்பாடு
  choice: பரிசுத்த ஆவி உன்மேல் வருவார்
  alternative: பரிசுத்த ஆவி உன்மேல் வரும்
  rationale: சூழலில் ஆவி கருத்தோ ஆற்றலோ மட்டுமல்லாமல் செயல்படும் தெய்வீக முகவராக வருகிறார்; அதே நேரத்தில் மொழிபெயர்ப்பு மூலத்தைத் தாண்டி திரித்துவ விளக்கத்தை விரிவாக்கவில்லை.
- issue: υἱὸς θεοῦ என்பதன் வரையறை மற்றும் பட்டப்பெயர் தன்மை
  choice: கடவுளின் மகன்
  alternative: கடவுளின் ஒரு மகன்
  rationale: சுட்டுச்சொல் இல்லாமை கிரேக்கத்தில் கட்டாயமாக வரையறையற்ற பொருளைக் கொடுக்காது. அறிவிப்பு சூழலில் இத்தொடர் இயேசுவின் தனித்துவ அடையாளத்தைச் சொல்லும் பட்டப்பெயராக உள்ளது.
- issue: ἐπισκιάσει என்ற உருவகத்தின் தெய்வியல் கட்டுப்பாடு
  choice: உன்மேல் நிழலிடும்
  alternative: உன்னை மூடிக்கொள்ளும்
  rationale: மூலத்தின் மரியாதைமிக்க நிழல் உருவகத்தைப் பாதுகாத்து, கருவுறுதல் எவ்வாறு நிகழ்ந்தது என்பதற்கான மூலத்தில் இல்லாத இயந்திரவியல் அல்லது பாலியல் விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘தேவதூதன்’, ‘பரிசுத்த ஆவி’, ‘உன்னதமானவர்’, ‘வல்லமை’ ஆகியவை வேதாகமச் சூழலின் கண்ணியத்தைத் தக்கவைத்தபடியே பரவலாகப் புரிந்துகொள்ளக்கூடிய சொற்கள். அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சரியான சொற்றொடர்களின் பின்னர் வைக்கப்பட்டுள்ளன.
