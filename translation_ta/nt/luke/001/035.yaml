revisions:
- from: 'தேவதூதன் அவளுக்குப் பதிலளித்தான்: “பரிசுத்த ஆவி உன்மேல் வருவார்; உன்னதமானவரின் வல்லமை உன்மேல் நிழலிடும். ஆகையால், பிறக்கும் பரிசுத்தமானவர்[a] ‘கடவுளின் மகன்’[b] என்று அழைக்கப்படுவார்.”'
  to: தேவதூதன் அவளுக்குப் பதிலளித்து, “பரிசுத்த ஆவி உன்மேல் வருவார்; உன்னதமானவரின் வல்லமை உன்மேல் நிழலிடும். ஆகையால், பிறக்கும் பரிசுத்தக் குழந்தை[a] ‘கடவுளின் மகன்’[b] என்று அழைக்கப்படும்” என்று கூறினான்.
  rationale: The revision explicitly renders both ‘answered’ and ‘said,’ improves the idiomatic rendering of the neuter expression for the child being born, and corrects the grammatical description in footnote b. It retains the source's reverent metaphor of overshadowing and its titular presentation of ‘Son of God,’ without adding doctrinal explanation.
