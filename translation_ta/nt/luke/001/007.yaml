source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: ta
  text: அவர்களுக்குப் பிள்ளை இல்லை. ஏனெனில், எலிசபெத்து கருவுற இயலாதவளாக இருந்தாள்; அவர்கள் இருவரும் வயது முதிர்ந்தவர்களாகவும் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தங்கள் வாழ்நாட்களில் முன்னேறியிருந்தார்கள்.”'
    reason: கிரேக்க மரபுத்தொடரின் சொற்பொருளையும் மொழிபெயர்ப்பில் தரப்பட்ட இயல்பான பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: τέκνον
  choice: பிள்ளை
  rationale: ஒருமையில் உள்ள τέκνον என்பதைக் இயல்பான தமிழில் ஒருமையாகவே தருகிறது; ‘பிள்ளைகள்’ என்பது மூலத்தின் எண்ணை மாற்றிவிடும்.
- source_word: καθότι
  choice: ஏனெனில்
  rationale: அவர்களுக்குப் பிள்ளை இல்லாததற்கான காரணத்தை அறிமுகப்படுத்தும் தெளிவான காரண இணைப்புச்சொல்.
- source_word: στεῖρα
  choice: கருவுற இயலாதவளாக
  rationale: இச்சொல் வெறுமனே பிள்ளையில்லாத நிலையையல்ல, கருத்தரிக்க இயலாத நிலையைக் குறிக்கிறது. ‘மலடியாக’ என்பது சுருக்கமான மாற்றாக இருந்தாலும், இன்றைய தமிழில் கடுமையாகவும் இழிவுபடுத்துவதாகவும் ஒலிக்கக்கூடும்.
- source_word: ἀμφότεροι
  choice: அவர்கள் இருவரும்
  rationale: சகரியாவுக்கும் எலிசபெத்துக்கும் இக்கூற்று சமமாகப் பொருந்துவதை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: வயது முதிர்ந்தவர்களாக
  rationale: ‘தங்கள் நாட்களில் முன்னேறியவர்கள்’ என்ற கிரேக்க மரபுத்தொடரின் பொருளை மரியாதையான, இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἦν αὐτοῖς
  choice: அவர்களுக்குப் ... இல்லை
  rationale: ‘அவர்களுக்கு ஒன்று இல்லை’ என்ற உடைமைக்கான கிரேக்க அமைப்பைத் தமிழின் இயல்பான உடைமை அமைப்பில் தருகிறது.
