id: LUK.1.31
reference: Luke 1:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: ta
  text: இதோ, நீ கருவுற்று ஒரு மகனைப் பெற்றெடுப்பாய்; அவருக்கு இயேசு என்று பெயரிடுவாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “அவருடைய பெயரை இயேசு என்று அழைப்பாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையையும் அறிவிப்பின் மாண்பான தொனியையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: நீ கருவுற்று
  rationale: கருப்பையில் கருத்தரித்தலைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது. ‘உன் கருப்பையில் கருவுற்று’ என்பது தமிழில் தேவையற்ற மீளுரையாகவும் மருத்துவச் சொல்லாடல் போலவும் ஒலிக்கும்.
- source_word: τέξῃ
  choice: பெற்றெடுப்பாய்
  rationale: குழந்தையைப் பிரசவித்தல் என்ற பொருளைத் தெளிவாகவும் மாண்பாகவும் வெளிப்படுத்துகிறது.
- source_word: υἱόν
  choice: ஒரு மகனை
  rationale: υἱός என்பதன் ஆண்பால் சார்ந்த குறிப்பான ‘மகன்’ என்ற பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: அவருக்கு … என்று பெயரிடுவாய்
  rationale: கிரேக்கப் பெயரிடும் மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: புதிய ஏற்பாட்டுத் தமிழில் நிலைபெற்றுள்ள பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: καλέσεις τὸ ὄνομα αὐτοῦ என்ற பெயரிடும் வாய்பாட்டை மொழிபெயர்த்தல்
  choice: அவருக்கு இயேசு என்று பெயரிடுவாய்
  alternative: அவருடைய பெயரை இயேசு என்று அழைப்பாய்
  rationale: இங்கு கோட்பாட்டுச் சர்ச்சை எதுவும் இல்லை. முதன்மை வடிவம் கிரேக்கத்தின் பொருளையும் எதிர்கால வினைநிலையையும் காத்தபடி இயல்பான தமிழை வழங்குகிறது; சொற்சொல்லான வேதாகம வாய்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடிய, மாண்பான அறிவிப்பு நடை. கிரேக்கத்தின் தொடர்ச்சியான καί அமைப்பு தமிழில் இயல்பாக அமைய அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
