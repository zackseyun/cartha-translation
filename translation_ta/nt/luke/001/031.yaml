  source_fidelity: The draft faithfully conveys the attention marker (ἰδού), future conception, birth of a male child, and the future act of naming him Jesus. Tamil idiom naturally incorporates ἐν γαστρί in “கருவுற்று,” without an unnecessary literal repetition of “in your womb.”
  naturalness: “இதோ, நீ கருவுற்று ஒரு மகனைப் பெற்றெடுப்பாய்; அவருக்கு இயேசு என்று பெயரிடுவாய்” is clear, dignified modern standard Tamil and suits the annunciation register. The semicolon appropriately joins the coordinated future actions.
  terminology: “மகன்,” “பெற்றெடுப்பாய்,” and “இயேசு” are accurate and established. The respectful “அவருக்கு” is idiomatic Tamil usage for Jesus and does not alter the verse’s sense. The footnote correctly preserves the more source-shaped naming formula.
