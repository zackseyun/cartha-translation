id: LUK.1.51
reference: Luke 1:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: ta
  text: அவர் தமது புயத்தால் வல்லமையை வெளிப்படுத்தியிருக்கிறார்[a]; அவர்களுடைய உள்ளங்களின் எண்ணங்களில் அகந்தையுள்ளவர்களைச் சிதறடித்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது புயத்தால் வல்ல செயல்களைச் செய்திருக்கிறார்.” கிரேக்கத்தில் சொற்பட “வல்லமையைச் செய்தார்” என்று உள்ளது; இது வல்லமையை வெளிப்படுத்துவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய உள்ளங்களின் நோக்கத்தின்படி அகந்தையுள்ளவர்களைச் சிதறடித்திருக்கிறார்”; அல்லது, “அவர்களுடைய உள்ளங்களின் கற்பனைகளில் அகந்தையுள்ளவர்களைச் சிதறடித்திருக்கிறார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: வல்லமையை வெளிப்படுத்தியிருக்கிறார்
  rationale: கிரேக்கத்தில் சொற்பட ‘வல்லமையைச் செய்தார்’ என்று இருந்தாலும், இது வல்லமையைச் செயலால் காட்டுதல் என்ற மரபுத்தொடர். தமிழில் இயல்பாகவும் நிறைவேறிய செயலின் தொடரும் பொருத்தத்தை உணர்த்தவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: தமது புயத்தால்
  rationale: ἐν இங்கு கருவிப்பொருளில் வருகிறது. ‘புயம்’ என்ற உருவகம் பழைய ஏற்பாட்டின் தேவ வல்லமைச் சித்திரத்தைத் தக்கவைக்கிறது; ‘தமது’ என்பது எழுவாயான தேவனைத் திரும்பச் சுட்டுகிறது.
- source_word: διεσκόρπισεν
  choice: சிதறடித்திருக்கிறார்
  rationale: வினை மக்களைப் பரவச் செய்தல் அல்லது சிதறடித்தல் என்று பொருள்படும். முதல் கூறின் நிறைவேற்றுத் தன்மைக்கும் கவிதை இணைப்புக்கும் ஏற்றவாறு நிகழ்கால நிறைவுவடிவம் பயன்படுத்தப்பட்டது.
- source_word: ὑπερηφάνους
  choice: பெருமைகொண்டவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இப்பன்மை உரிச்சொல் செருக்குள்ள அல்லது அகந்தையுள்ள மக்களைக் குறிக்கிறது. ‘பெருமைகொண்டவர்கள்’ நவீனத் தமிழில் இயல்பான ஒழுக்கச் சாயலை அளிக்கிறது.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: தங்கள் உள்ளத்தின் சிந்தனைகளில்
  rationale: διάνοια சிந்தனை, மனப்பாங்கு, நோக்கம் ஆகிய பொருட்களைக் கொள்ளலாம்; καρδία உள்ளார்ந்த மையத்தைக் குறிக்கிறது. மூலத்தின் உள்ளார்ந்த சிந்தனைச் சொல்லாட்சியை ஒரே உளவியல் சொல்லாகத் தட்டையாக்காமல் இம்மொழியாக்கம் காக்கிறது.
theological_decisions:
- issue: மரியாளின் பாடலில் வரும் இறந்தகால வினைகள்
  choice: ‘வெளிப்படுத்தியிருக்கிறார்’, ‘சிதறடித்திருக்கிறார்’ என்ற நிகழ்கால நிறைவுவடிவங்கள்
  alternative: ‘வெளிப்படுத்தினார்’, ‘சிதறடித்தார்’ என்ற எளிய இறந்தகால வடிவங்கள்
  rationale: கிரேக்க aorist வடிவங்கள் தேவனுடைய தீர்மானமான செயல்களை நிறைவேறியவையாகப் பாடுகின்றன; அவை வழக்கமான செயல்களின் தொகுப்பாகவோ தீர்க்கதரிசன உறுதியுடனோ ஒலிக்கலாம். நிகழ்கால நிறைவுவடிவம் நிறைவேறிய செயலையும் அதன் தொடரும் பொருத்தத்தையும் காக்கிறது.
- issue: பெருமையின் இருப்பிடம் அல்லது சிதறடித்தலின் அடிப்படை
  choice: ‘தங்கள் உள்ளத்தின் சிந்தனைகளில் பெருமைகொண்டவர்கள்’ எனப் புரியவைக்கும் முதன்மை உரை
  alternative: ‘தங்கள் உள்ளத்தின் நோக்கத்தின்படி அவர்களைச் சிதறடித்தார்’ அல்லது ‘தங்கள் உள்ளத்தின் கற்பனையில் பெருமைகொண்டவர்கள்’
  rationale: διανοίᾳ என்ற வேற்றுமை வடிவம் பெருமையின் உள்சார்ந்த தன்மையையோ சிதறடித்தலோடு தொடர்புடைய கருவி/அடிப்படையையோ சுட்டலாம். முதன்மை உரை இயல்பான வாசிப்பைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘புயம்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டாலும் வாக்கிய அமைப்பு பொதுவாசகருக்கு நேரடியாக உள்ளது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
