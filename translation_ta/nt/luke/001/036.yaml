  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: ta
  text: இதோ, உன் உறவினரான எலிசபெத்தும் தன் முதிர்வயதில் ஒரு மகனைக் கருத்தரித்திருக்கிறாள். மலடி என்று அழைக்கப்பட்ட அவளுக்கு இது ஆறாம் மாதம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலமொழிச் சொல்லை இயல்பான, கண்ணியமான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: συγγενίς
  choice: உறவினளாகிய
  rationale: உறவின் துல்லிய வகையை மூலவசனம் குறிப்பிடாததால், பொதுவான உறவுப் பொருளை அப்படியே பாதுகாக்கிறது.
- source_word: συνείληφεν υἱόν
  choice: ஒரு மகனைக் கருத்தரித்திருக்கிறாள்
  rationale: கருத்தரித்தல் நிகழ்ந்து அதன் நிலை தொடர்வதைக் காட்டும் perfect வடிவின் பொருளையும், பிறக்கவிருப்பது மகன் என்பதையும் தெளிவாக வழங்குகிறது.
- source_word: ἐν γήρει αὐτῆς
  choice: தன் முதிர்வயதில்
  rationale: γήρας என்பதன் முதுமை/முதிர்ந்த வயது பொருளை இயல்பான மரியாதைமிக்க தமிழில் தருகிறது.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: மலடி என்று அழைக்கப்பட்ட அவளுக்கு
  rationale: அவள் இவ்வாறு அழைக்கப்பட்டாள் என்பதைக் கூறும் மூலத்தின் passive அமைப்பையும், சமூக அடையாளப்படுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: எலிசபெத்தின் உறவுமுறை
  choice: உறவினள்
  alternative: சகோதரி / ஒன்றுவிட்ட சகோதரி
  rationale: συγγενίς குறிப்பிட்ட உறவுமுறையை நிர்ணயிக்கவில்லை; ஆகவே ஆதாரமில்லாத குடும்ப உறவைச் சேர்க்கவில்லை.
- issue: ‘மலடி’ என்ற சொல்லின் காலநிலை
  choice: அழைக்கப்பட்ட
  alternative: அழைக்கப்படுகிற
  rationale: καλουμένῃ இலக்கணத்தில் நிகழ்காலப் பெயரெச்சமாக இருந்தாலும், சூழலில் அவளுக்கு முன்பிருந்த பெயரிடலைத் தமிழில் இயல்பாகச் சுட்டுகிறது; இப்போது ஏற்பட்ட கருத்தரிப்பை மறுக்கும் விதமாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘இதோ’ என்ற வேதாகமச் சூழலுக்கு ஏற்ற கவன ஈர்ப்புச் சொல் வைக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
