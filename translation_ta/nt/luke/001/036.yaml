  terminology: ‘எலிசபெத்,’ ‘முதிர்வயது,’ ‘கருத்தரித்திருக்கிறாள்,’ மற்றும் ‘மலடி’ ஆகியவை பொருத்தமானவை. στείρα-வின் சமூகமாக ஒட்டப்பட்ட அடையாளத்தை ‘மலடி என்று அழைக்கப்பட்டவள்’ துல்லியமாகத் தருகிறது; நிகழ்கால καλουμένῃ-யை கட்டாயமாகத் தமிழில் நிகழ்காலமாக்கத் தேவையில்லை, ஏனெனில் கருத்தரித்த பிறகும் அந்தப் பெயரால் அறியப்பட்டிருந்த சூழலை இவ்வமைப்பு இயல்பாகக் குறிக்கிறது.
