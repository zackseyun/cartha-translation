  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாக உள்ளது: எலிசபெத்து உறவினர், முதிர்வயதில் மகனைக் கருத்தரித்துள்ளார், மேலும் இது ஆறாம் மாதம் என்பன பாதுகாக்கப்பட்டுள்ளன. ஆனால் καὶ αὐτὴ (‘அவளும்/அவள்கூட’) என்ற வலியுறுத்தல் தமிழில் வெளிப்படவில்லை; அதைச் சேர்ப்பது பாதுகாப்பானது.'
