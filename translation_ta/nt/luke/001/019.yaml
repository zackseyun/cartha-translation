source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: ta
  text: வானதூதர் அவருக்குப் பதிலளித்து, “நான் கடவுளின் முன்னிலையில் நிற்கிற கபிரியேல். உன்னிடம் பேசவும் இந்த நற்செய்தியை[a] உனக்கு அறிவிக்கவும் நான் அனுப்பப்பட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியங்களை உனக்கு நற்செய்தியாக அறிவிக்கவும்.” கிரேக்கத்தில் எழுத்துப்படி, “இந்தக் காரியங்களை உனக்கு நற்செய்தியாக அறிவிக்கவும்” என உள்ளது. “இந்தக் காரியங்கள்” என்பது கபிரியேல் இப்போது அறிவித்த செய்தியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: அதற்கு … என்றார்
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் இறந்தகால வினையெச்சத்தை, நவீன தமிழில் இயல்பான finite speech construction ஆக மொழிபெயர்க்கிறது; ‘அதற்கு’ பதிலுரையின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: ἄγγελος
  choice: வானதூதர்
  rationale: இச்சூழலில் கபிரியேல் எனத் தன்னை அடையாளப்படுத்தும் பரலோகத் தூதரைக் குறிக்கிறது; ‘வானதூதர்’ என்பது இயல்பான, குறிப்பான தமிழ்ச் சொல்.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: நான் … கபிரியேல்
  rationale: வலியுறுத்தப்பட்ட Ἐγώ என்பதைக் ‘நான்’ என்று வெளிப்படையாக வைத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: ὁ παρεστηκὼς
  choice: நிற்கிற
  rationale: Perfect participle உணர்த்தும் தொடர்ந்த நிலை/பதவியை இயல்பான நிகழ்கால உறவெச்சம் வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: தெய்வீக அரசவையை நினைவூட்டும் அண்மையையும் சேவைநிலையையும், வெறும் இடக் குறிப்பாகச் சுருக்காமல் தெரிவிக்கிறது.
- source_word: ἀπεστάλην
  choice: நான் அனுப்பப்பட்டேன்
  rationale: Aorist passive வடிவத்தையும் தெய்வீக அனுப்புதலின் மறைமுக செயப்படுபொருளையும் காக்கிறது.
- source_word: λαλῆσαι πρὸς σὲ
  choice: உன்னிடம் பேசவும்
  rationale: அனுப்பப்பட்டதன் நோக்கத்தைச் சொல்லும் infinitive-ஐ இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: εὐαγγελίσασθαί σοι
  choice: உனக்கு அறிவிக்கவும்
  rationale: நற்செய்தியை அறிவித்தல் என்ற வினைச்சொல்லின் பிரகடன உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: ταῦτα
  choice: இந்த நற்செய்தியை
  rationale: எழுத்துப்படி ‘இவற்றை’ என்றாலும், εὐαγγελίσασθαί உடன் இணைந்து கபிரியேல் அறிவித்த செய்தியைக் குறிக்கிறது; இயல்பான தமிழில் அதன் நல்ல செய்தி இயல்பு வெளிப்படுகிறது, சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: εὐαγγελίζω என்ற சொல்லை வானதூதரின் அறிவிப்புச் சூழலில் மொழிபெயர்த்தல்
  choice: நற்செய்தியை … அறிவிக்க
  alternative: சுவிசேஷத்தை அறிவிக்க / நல்ல செய்தியைக் கூற
  rationale: ‘நற்செய்தி’ மூல வினையின் நல்ல செய்தி என்ற பொருளையும் வேதாகம ஒலியையும் காக்கிறது; ‘சுவிசேஷம்’ இங்கு பிற்காலத்தில் நிலைபெற்ற தொழில்நுட்பச் சொல்லாக மிகையாக ஒலிக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கண்ணியமும் உடைய எளிய நடையில் அமைக்கப்பட்டுள்ளது. வானதூதரைக் குறிக்க மரியாதைப் பன்மை ஒருமைப்பாட்டு வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; சகரியாவை நோக்கிய ஒருமை இரண்டாம் நபர் மூலத்தின் எண்ணைத் தக்கவைக்கிறது.
