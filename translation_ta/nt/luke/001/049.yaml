  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: ta
  text: ஏனெனில், வல்லமையுள்ளவர் எனக்குப் பெரிய காரியங்களைச் செய்திருக்கிறார்; மேலும், அவருடைய பெயர் பரிசுத்தமானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “பரிசுத்தமானது அவருடைய பெயர்.” கிரேக்கத்தில் “பரிசுத்தமானது” என்பது வலியுறுத்தப்பட்டு முதலில் வருகிறது.'
    reason: மூலமொழியின் வலியுறுத்தப்பட்ட சொல்வரிசையைச் சுட்டிக்காட்டுதல்
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் மரியா ஆண்டவரை மகிமைப்படுத்துவதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐποίησέν
  choice: செய்திருக்கிறார்
  rationale: நிறைவேறிய செயல் தற்போதைய துதிக்குக் காரணமாகத் தொடர்வதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μοι
  choice: எனக்கு
  rationale: 'இங்கு வரும் வேற்றுமை உருபின் பயனடையும் பொருளை இயல்பாகக் காட்டுகிறது: கடவுள் மரியாவுக்காக நன்மையான பெரிய காரியங்களைச் செய்தார்.'
- source_word: μεγάλα
  choice: பெரிய காரியங்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நடுநிலைப் பன்மை அடைமொழியை, செயல்களின் தன்மையை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ὁ δυνατός
  choice: வல்லமையுள்ளவர்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லாகச் செயல்படும் அடைமொழியை கடவுளுக்கான மரியாதையான பட்டப்பெயராகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: ἅγιον
  choice: பரிசுத்தமானது
  rationale: கடவுளுடைய பெயரின் தூய்மையையும் தனித்துவமான புனிதத்தையும் குறிக்கும் நிலையான இறையியல் சொல்லைத் தக்கவைக்கிறது.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயர்
  rationale: மூலத்தில் உள்ள ‘பெயர்’ என்பதைக் காத்து, நவீனத் தமிழில் இயல்பான உடைமைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: ὁ δυνατός என்பதை கடவுளுக்கான பட்டப்பெயராக மொழிபெயர்த்தல்
  choice: வல்லமையுள்ளவர்
  alternative: வல்லவரானவர்
  rationale: கட்டுரையுடன் வரும் கிரேக்க அடைமொழி இங்கு பெயர்ச்சொல்லாகவும் கடவுளைக் குறிக்கும் மரியாதைப் பட்டமாகவும் செயல்படுகிறது; தேர்ந்த வடிவம் கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்காமல் இதைக் காக்கிறது.
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ என்பதன் சொல்வரிசை
  choice: அவருடைய பெயர் பரிசுத்தமானது
  alternative: பரிசுத்தமானது அவருடைய பெயர்
  rationale: முதன்மை உரை இயல்பான நவீனத் தமிழ் சொல்வரிசையைப் பயன்படுத்துகிறது; கிரேக்கத்தில் ‘பரிசுத்தமானது’ முன்னிலைப்படுத்தப்பட்டுள்ள வலியுறுத்தல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் துதியின் கண்ணியமான தொனியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘வல்லமையுள்ளவர்’ பட்டப்பெயரின் தன்மையையும் ‘பரிசுத்தமானது’ வேதாகமப் புனிதத்தின் பரந்த பொருளையும் காக்கின்றன.
