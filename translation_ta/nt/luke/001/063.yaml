id: LUK.1.63
reference: Luke 1:63
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: ta
  text: அவர் ஒரு சிறு எழுதுபலகையைக் கேட்டு, “யோவான் என்பதே அவனுடைய பெயர்” என்று எழுதினார். அனைவரும் வியப்படைந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: கேட்டு வாங்கி
  rationale: இறந்தகால வினையெச்சம், எழுதுவதற்கு முன் அவர் பலகையைக் கேட்டுப் பெற்றதைக் குறிக்கிறது; தமிழில் இயல்பாக நிகழ்வுகளின் வரிசையையும் வெளிப்படுத்துகிறது.
- source_word: πινακίδιον
  choice: எழுதுவதற்கான ஒரு சிறு பலகை
  rationale: எழுதப் பயன்பட்ட சிறிய பலகையைக் குறிக்கிறது. இன்றைய மின்னணுச் சாதனம் என்ற தவறான புரிதலைத் தவிர்த்து, பொருளையும் பயன்பாட்டையும் தெளிவாக்குகிறது.
- source_word: ἔγραψεν λέγων
  choice: என்று எழுதினார்
  rationale: கிரேக்கத்தில் உள்ள ‘எழுதி, சொல்லி’ என்ற அமைப்பு எழுதப்பட்ட வாசகத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்று எழுதினார்’ என்பது அதே செயல்பாட்டை இயல்பாக வழங்குகிறது.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: யோவான் என்பது இவனுடைய பெயர்
  rationale: பெயரையே முன்னிறுத்தும் கிரேக்கச் சொல்வரிசையையும் நிகழ்கால உறுதிப்பாட்டையும் பாதுகாக்கிறது; ‘இவனுடைய’ என்பது சூழலில் குழந்தையைக் குறிக்கிறது.
- source_word: ἐθαύμασαν πάντες
  choice: அனைவரும் வியப்படைந்தார்கள்
  rationale: θαυμάζω குறிக்கும் ஆச்சரியத்தை நவீன, கண்ணியமான தமிழில் இயல்பாக வெளிப்படுத்தி, πάντες என்பதன் முழுமையையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான எளிய நடையில் மொழிபெயர்க்கப்பட்டது. பெயரை முன்னிறுத்தும் மூலமொழியின் வலியுறுத்தல் ‘யோவான் என்பது இவனுடைய பெயர்’ எனப் பாதுகாக்கப்பட்டுள்ளது; விளக்கம் தேவையில்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
