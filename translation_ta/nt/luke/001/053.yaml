id: LUK.1.53
reference: Luke 1:53
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: ta
  text: அவர் பசியுள்ளவர்களை நல்லவற்றால் நிரப்பினார்; செல்வந்தர்களையோ வெறுமையாக[a] அனுப்பிவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெறுங்கையுடன்.’
    reason: κενούς என்பதற்கான இயல்பான, ஆனால் சற்றே விளக்கமான தமிழ் மாற்று.
lexical_decisions:
- source_word: πεινῶντας
  choice: பசியுள்ளவர்களை
  rationale: நிகழ்காலச் செயப்பெயர் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, பசியால் வாடும் மக்களை ஒரு வகுப்பாகக் குறிக்கிறது. தீவிரத்தை மிகைப்படுத்தாமல் இயல்பான தமிழில் இதைத் தருகிறது.
- source_word: ἐνέπλησεν
  choice: நிரப்பினார்
  rationale: ‘நிரப்புதல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘திருப்திப்படுத்தினார்’ என்று விளைவை மட்டும் முன்னிறுத்துவதைக் தவிர்க்கிறது. பாடலின் சூழலில் கிரேக்க இறந்தகால வினை தமிழில் இயல்பான இறந்தகாலமாகத் தரப்பட்டுள்ளது.
- source_word: ἀγαθῶν
  choice: நல்லவற்றால்
  rationale: நிரப்பப்பட்ட உள்ளடக்கத்தைக் குறிக்கும் பன்மை பெயரடையின் நேரடியான, இயல்பான தமிழ் வடிவம்; மூலத்தில் வெளிப்படையாக இல்லாத ‘பரிசுகள்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: πλουτοῦντας
  choice: செல்வந்தர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்காலச் செயப்பெயரைச் சுருக்கமாகத் தருகிறது; பசியுள்ளவர்களுடனான சமூக முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἐξαπέστειλεν
  choice: அனுப்பிவிட்டார்
  rationale: ஒருவரைத் தன்னிடமிருந்து அனுப்பிவிடுதல் என்ற கூட்டு வினையின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κενούς
  choice: வெறுமையாக
  rationale: செல்வந்தர்கள் அனுப்பப்பட்டபோது இருந்த நிலையைச் சொல்லும் மூலத்தின் பரந்த, நேரடியான பொருளைப் பாதுகாக்கிறது. ‘வெறுங்கையுடன்’ என்பது இயல்பான மாற்று, ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத கை குறித்த உருவகத்தைச் சேர்க்கிறது.
theological_decisions:
- issue: மரியாளின் பாடலில் காணப்படும் சமூக-இறையியல் நிலைமாற்றம்
  choice: ‘பசியுள்ளவர்கள்’ மற்றும் ‘செல்வந்தர்கள்’ என்ற நேரடியான சமூக முரண்பாட்டை அப்படியே வைத்தல்
  alternative: இவற்றை முறையே ஆவிக்குரிய தேவை உடையவர்கள் என்றும் தன்னிறைவு அல்லது அகந்தை கொண்டவர்கள் என்றும் விளக்கிப் பெயர்த்தல்
  rationale: கிரேக்க உரை பசியுள்ள மக்களையும் செல்வந்தர்களையும் நேரடியாகக் குறிப்பிடுகிறது. விரிவான ஆவிக்குரிய பயன்பாடுகள் இருக்கக்கூடியபோதிலும், மொழிபெயர்ப்பு அந்தத் தெளிவான சமூகப் பொருளை ஆன்மிகமயமாக்காமல், இறைவன் ஏற்படுத்தும் நிலைமாற்றத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இறைவனைக் குறிக்கும் மரியாதைப் பன்மை வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது; ‘-யோ’ எதிர்மறை இணைப்பு இரு சமூகக் குழுக்களுக்கிடையிலான கூர்மையான முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
