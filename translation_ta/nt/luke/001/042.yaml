id: LUK.1.42
reference: Luke 1:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: ta
  text: அவள் உரத்த குரலில் கூவி[a], “பெண்களிடையே நீ ஆசீர்வதிக்கப்பட்டவள்; உன் கருப்பையின் கனியும் ஆசீர்வதிக்கப்பட்டது” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உரத்த கூக்குரலுடன்.”
    reason: κραυγῇ μεγάλῃ என்பதற்கான நேரடியான சொற்பொருள் மாற்று; ‘உரத்த குரலில்’ என்பதற்கு மாற்றாக ‘with a loud cry’ என்னும் நுணுக்கத்தைத் தருகிறது.
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: கூவி
  rationale: வெறும் பேசுதலைவிட உரத்த, வெளிப்படையான குரலெழுப்புதலைக் குறிக்கிறது; துயரக்குரல் என்ற பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: κραυγῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: முறையைக் குறிக்கும் இத்தொடரை இயல்பான நவீனத் தமிழில் வழங்கி, குரலின் வலிமையையும் கேட்கத்தக்க தன்மையையும் காக்கிறது.
- source_word: Εὐλογημένη
  choice: ஆசீர்வதிக்கப்பட்டவள்
  rationale: நிறைவேறிய நிலையில் உள்ள இறை ஆசீர்வாதத்தைச் சுட்டும் செயப்பாட்டு வடிவத்தையும் வாழ்த்துத் தொனியையும் காக்கிறது.
- source_word: ἐν γυναιξίν
  choice: பெண்களுக்குள்
  rationale: பெண்களிடையே மரியாள் தனிப்பட்ட ஆசீர்வாதம் பெற்றிருப்பதை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘எல்லா’ என்பதைச் சேர்ப்பதில்லை.
- source_word: εὐλογημένος
  choice: ஆசீர்வதிக்கப்பட்டது
  rationale: முந்தைய ஆசீர்வாதக் கூற்றுடன் இணையான அமைப்பைக் காக்கிறது; ‘கனி’ என்னும் அஃறிணைப் பெயருடன் தமிழில் இயல்பாக ஒத்திசைகிறது.
- source_word: ὁ καρπὸς
  choice: கனி
  rationale: மூலத்தின் உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘குழந்தை’ என்று விளக்கிப் பொருளை மட்டும் தருவதைத் தவிர்க்கிறது.
- source_word: τῆς κοιλίας σου
  choice: உன் கருப்பையின்
  rationale: கர்ப்பச் சூழலில் κοιλία குறிக்கும் கருப்பையைத் துல்லியமாகவும் கண்ணியமாகவும் வழங்குகிறது.
theological_decisions:
- issue: மரியாளை நோக்கிக் கூறப்படும் ஆசீர்வாத மொழி
  choice: பெண்களுக்குள் நீ ஆசீர்வதிக்கப்பட்டவள்
  alternative: பெண்களிடையே நீ ஆசீர்வாதம் பெற்றவள்
  rationale: மரியாளைப் பற்றிய வசனத்தின் ஆசீர்வாதக் கூற்றை முழுமையாகக் காக்கிறது; அதைக் குறைக்கவோ பிற்காலக் கோட்பாட்டு விளக்கங்களைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. ‘கருப்பை’ துல்லியத்திற்காகவும் ‘கனி’ மூல உருவகத்தைப் பாதுகாக்கவும் பயன்படுத்தப்பட்டுள்ளன.
