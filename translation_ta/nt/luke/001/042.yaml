- from: அவள் உரத்த குரலில் கூவி[a], “பெண்களுக்குள் நீ ஆசீர்வதிக்கப்பட்டவள்; உன் கருப்பையின் கனியும் ஆசீர்வதிக்கப்பட்டது” என்றாள்.
  to: அவள் உரத்த குரலில் கூவி[a], “பெண்களிடையே நீ ஆசீர்வதிக்கப்பட்டவள்; உன் கருப்பையின் கனியும் ஆசீர்வதிக்கப்பட்டது” என்றாள்.
  rationale: ‘பெண்களுக்குள்’ என்பதற்குப் பதிலாக நவீன நிலையான தமிழில் இயல்பான ‘பெண்களிடையே’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஆசீர்வாத இணைமை, குரலெழுப்புதல், மற்றும் கருப்பையின் கனி என்ற உருவகம் அனைத்தும் மாற்றமின்றிக் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு அதன் குறியிடப்பட்ட சொல்லாக்கத்திற்கு நேரடியான மாற்றாகத் திருத்தப்பட்டுள்ளது.
