  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: ta
  text: உடனே அவருடைய வாய் திறக்கப்பட்டது; அவருடைய நாவும் பேச்சுப் பெற்றது[a]. அவர் கடவுளைப் போற்றியவாறு பேசத் தொடங்கினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவருடைய நாவும்.” சில மொழிபெயர்ப்புகள் “அவருடைய நாவும் கட்டவிழ்க்கப்பட்டது” என்று தருகின்றன; ஆனால் “கட்டவிழ்க்கப்பட்டது” என்பது கிரேக்க மூலத்தில் வெளிப்படையாக இல்லை.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பேசிக்கொண்டிருந்தார்.” இங்குள்ள முற்றுப்பெறா இறந்தகால வினை, பேச்சின் தொடக்கத்தைக் காட்டுவதற்குப் பதிலாக அது தொடர்ந்ததை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: திறக்கப்பட்டது
  rationale: இறந்தகாலச் செயலப்பாட்டு வடிவத்தைப் பிரதிபலிக்கிறது; பேச்சு திடீரென மீட்கப்பட்டதை, செய்பவர் யார் என்று மேலதிகமாகக் குறிப்பிடாமல் தெரிவிக்கிறது.
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல் இன்றி தொடரமைப்பில்)
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வசனத் தொடர் இயல்பாகவே அந்த உறவை வெளிப்படுத்துவதால் தனியாக ‘அப்போது’ அல்லது ‘ஆனால்’ சேர்க்கப்படவில்லை.
- source_word: στόμα
  choice: வாய்
  rationale: நேரடியான உடற்கூறு பொருள்; பேச்சு மீட்கப்படும் சூழலுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: அவருடைய நாவும் பேச்சுப் பெற்றது
  rationale: கிரேக்கத்தில் ‘அவருடைய நாவும்’ என்பதற்குப் பின் வினைச்சொல் விடுபட்டுள்ளது. தமிழில் முழுமையான, இயல்பான வாக்கியத்திற்காகப் பேச்சுத் திறன் மீண்டது வெளிப்படையாகச் சொல்லப்படுகிறது; ‘கட்டவிழ்க்கப்பட்டது’ என்ற மூலத்தில் இல்லாத உருவகத்தைத் தவிர்க்கிறது.
- source_word: ἐλάλει
  choice: பேசத் தொடங்கினார்
  rationale: முற்றுப்பெறா இறந்தகால வினை தொடர்ந்த பேச்சையோ அதன் தொடக்கத்தையோ குறிக்கலாம். மௌனம் நீங்கிய இச்சூழலில் பேச்சின் தொடக்கத்தைக் காட்டும் மொழிபெயர்ப்பு இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: εὐλογῶν
  choice: போற்றியவாறு
  rationale: இது பிரதான வினையோடு ஒரே நேரத்தில் நிகழும் செயலைக் குறிக்கும் நிகழ்காலப் பெயரெச்சம். கடவுளை நோக்கி வரும் போது εὐλογέω என்பதன் பொருளை ‘போற்று’ இயல்பாகத் தருகிறது; ‘வாழ்த்து’ என்ற சொல் நவீன தமிழில் தவறான வாழ்த்துரைப் பொருளை எழுப்பக்கூடும்.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: பெயரெச்சத்தின் நேரடிச் செயப்படுபொருளைத் தெளிவாகவும் பொதுவான தமிழிலும் தருகிறது.
