id: LUK.1.77
reference: Luke 1:77
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: ta
  text: அவருடைய மக்களுக்குத் தங்கள் பாவங்களின் மன்னிப்பில்[a] இரட்சிப்பைப் பற்றிய அறிவைக் கொடுப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் பாவங்கள் மன்னிக்கப்படுவதன் மூலம்’; அல்லது, ‘தங்கள் பாவங்களின் மன்னிப்பினால்.’
    reason: ἐν என்ற முன்னிடைச்சொல் இங்கு பரப்பு அல்லது முறை மட்டுமன்றி, கருவி சார்ந்த பொருளையும் தரக்கூடும்.
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: கொடுப்பதற்காக
  rationale: முந்தைய வசனத்தைச் சார்ந்த நோக்கத்தை இந்த வினையெச்ச அமைப்பு தெரிவிக்கிறது; தமிழில் ‘கொடுப்பதற்காக’ என்பது அந்த நோக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γνῶσιν σωτηρίας
  choice: இரட்சிப்பைப் பற்றிய அறிவு
  rationale: γνῶσις என்பதன் ‘அறிவு’ என்ற நேரடியான பொருளையும், σωτηρίας உடனான தொடர்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்த ‘இரட்சிப்பைப் பற்றிய அறிவு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: τῷ λαῷ αὐτοῦ
  choice: அவருடைய மக்களுக்கு
  rationale: வேற்றுமை வடிவம் அறிவைப் பெறுவோரைக் குறிக்கிறது; ‘அவருடைய மக்கள்’ உடன்படிக்கைச் சூழலை அதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἐν ἀφέσει
  choice: மன்னிப்பில்
  rationale: ἐν என்பது இங்கு பரப்பு, முறை அல்லது நெருங்கிய தொடர்பைக் குறிக்கக்கூடும். ‘மன்னிப்பில்’ என்பது அதன் வடிவத்தைப் பாதுகாத்து, கருவி அல்லது காரணம் என்ற ஒரே பொருளுக்குள் சுருக்காமல் விடுகிறது.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: தங்கள் பாவங்களின்
  rationale: பன்மையான ἁμαρτιῶν ‘பாவங்கள்’ என்று பாதுகாக்கப்பட்டது; αὐτῶν என்பது ‘மக்கள்’ என்பதையே சுட்டுவதால், தமிழில் இயல்பான பின்னோக்குச் சுட்டாக ‘தங்கள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இரட்சிப்புக்கும் பாவமன்னிப்புக்கும் உள்ள தொடர்பு
  choice: ‘பாவங்களின் மன்னிப்பில்’ என்று மொழிபெயர்த்து, இரட்சிப்பு அறியப்படுவது மன்னிப்புடன் நெருங்கிய தொடர்பில் உள்ளது என்பதைத் தெரிவிக்கிறது.
  alternative: ‘பாவங்கள் மன்னிக்கப்படுவதன் மூலம்’ அல்லது ‘பாவமன்னிப்பினால்’ என்று கருவி/காரணப் பொருளில் மொழிபெயர்க்கலாம்.
  rationale: ἐν ἀφέσει என்ற சொற்றொடர் பரப்பு, முறை, கருவி போன்ற நெருக்கமான பொருள் நிழல்களைத் தாங்கக்கூடும். மூலத்தில் உள்ள இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் குறுக்காமல் ‘மன்னிப்பில்’ என்று வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இது முந்தைய வசனத்துடன் இலக்கண ரீதியாகத் தொடரும் நோக்கவாக்கியம் என்பதால் இறுதியில் ‘கொடுப்பதற்காக’ பயன்படுத்தப்பட்டது; தனி வசனமாகக் காட்டுவதற்காக நிறுத்தக்குறி சேர்க்கப்பட்டுள்ளது.
