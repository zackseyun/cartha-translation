lexical_decisions:
- source_word: ἀντελάβετο
  choice: உதவினார்
  rationale: ஒருவருக்கு ஆதரவாகத் துணைசெய்வதை இங்கு குறிக்கிறது. ‘பற்றிக்கொண்டார்’ என்பது சொற்படியானாலும், இச்சூழலில் இயல்பான தமிழ் பொருளைத் தெளிவாகத் தராது.
- source_word: Ἰσραὴλ
  choice: இஸ்ரவேல்
  rationale: இது யாக்கோபு என்ற தனிநபரை அல்லாமல், இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் பெயராக இங்கு வருகிறது.
- source_word: παιδὸς
  choice: பணியாளரான
  rationale: παῖς என்பதற்கு ‘பணியாளர்’ அல்லது ‘பிள்ளை’ என்று பொருள் கொள்ளலாம். வேதாகமத்தில் இஸ்ரவேல் கடவுளின் பணியாளர் என அழைக்கப்படும் பின்னணியால் ‘பணியாளர்’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: αὐτοῦ
  choice: தமது
  rationale: இது கடவுளைக் குறிக்கும் தற்சுட்டுப் பெயரடை; தமிழ் வாக்கியத்தில் எழுவாயான ‘அவர்’ என்பதோடு இயல்பாக இசைய ‘தமது’ பயன்படுத்தப்பட்டது.
- source_word: μνησθῆναι
  choice: நினைவுகூர்ந்து
  rationale: இறைவனின் உதவிச் செயலோடு இணைந்துள்ள நோக்கம் அல்லது உடனிகழ்வை வினையெச்ச வடிவம் இயல்பாக வெளிப்படுத்துகிறது; இதை தனி முற்றுவினையாக மாற்றவில்லை.
- source_word: ἐλέους
  choice: இரக்கத்தை
  rationale: ἔλεος என்பதன் நேரடியான பொருள் ‘இரக்கம்’. உடன்படிக்கை சார்ந்த உண்மையுள்ள அன்பின் நிழற்பொருள் இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்பட்டது; மூலத்தில் இல்லாத விரிவாக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் παῖς என்பதன் பொருள்
  choice: தமது பணியாளரான இஸ்ரவேல்
  alternative: தமது பிள்ளையான இஸ்ரவேல்
  rationale: இஸ்ரவேலை ஆண்டவரின் பணியாளர் என்று அழைக்கும் பழைய ஏற்பாட்டு, குறிப்பாக ஏசாயா மரபுடன் ‘பணியாளர்’ நன்கு பொருந்துகிறது. அதேவேளை, சொல்லிலுள்ள குடும்ப உறவைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பு மறைக்கவில்லை.
- issue: μνησθῆναι ἐλέους என்பதன் தொடர்பு
  choice: இரக்கத்தை நினைவுகூர்ந்து
  alternative: இரக்கத்தை நினைவுகூருவதற்காக
  rationale: இறைவனின் நினைவுகூருதல் அவரது உதவிச் செயலில் வெளிப்படுகிறது. வினையெச்ச வடிவம் நோக்கம், விளைவு, உடனிகழ்வு ஆகியவற்றில் ஒன்றைத் தேவையின்றி முடிவுசெய்யாமல் கிரேக்கத்தின் சுருக்கத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாக வாசிக்க வாக்கியத்தின் வினையெச்சத் தொடர் முதலில் வைக்கப்பட்டது. ‘ஊழியன்’ என்ற மரபுவழி திருச்சபைச் சொல்லுக்குப் பதிலாக பொதுவாகப் புரியும், மதிப்பான ‘பணியாளர்’ பயன்படுத்தப்பட்டது. ‘நினைவுகூர்ந்து’ என்பது அடுத்த வசனத்துடன் தொடரும் பாடல் அமைப்பையும் கிரேக்க இறந்தகால infinitive-இன் சார்பையும் காக்கிறது.
