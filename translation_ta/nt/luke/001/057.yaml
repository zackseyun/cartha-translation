translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘காலம் நிறைவடைந்தது’ என்ற சொல்லமைப்பு முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதிக வழக்காற்றுத் தமிழ் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
