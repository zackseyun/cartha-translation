  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: ta
  text: எலிசபெத்துக்குக் குழந்தை பெற்றெடுக்கும் காலம் நிறைவடைந்தது[a]; அவள் ஒரு மகனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான வழக்கில், “எலிசபெத் குழந்தை பெற்றெடுக்கும் காலம் வந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதை நகர்வைக் குறிக்கும் மென்மையான இணைப்புச்சொல். இவ்வசனத்தின் இயல்பான தமிழ் நடையில் அதைத் தனியாக ‘இப்போது’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத வெளிப்படையான காலக் குறிப்பைச் சேர்க்கும்; வசனச் சூழலே அதன் தொடர்ச்சியை உணர்த்துகிறது.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: காலம் நிறைவடைந்தது
  rationale: கர்ப்பகாலம் முழுமையடைந்ததைச் சுட்டும் மூலத்தின் ‘காலம் நிறைவேறியது/நிறைவடைந்தது’ என்ற உருவகத்தைப் பாதுகாத்து, நவீன தமிழிலும் இயல்பாக அமைகிறது.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: எலிசபெத்துக்குப் பிள்ளை பெற வேண்டிய
  rationale: தாயின் பிரசவத்தைத் தெளிவாகக் குறிக்கிறது; αὐτήν என்பதன் குறிப்பு குழப்பமின்றி இருக்க பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டிய’ என்பது இங்கு கடமையை அல்ல, குறித்த நிகழ்வு நடைபெறும் காலத்தை உணர்த்துகிறது.
- source_word: ἐγέννησεν
  choice: பெற்றெடுத்தாள்
  rationale: முடிவுற்ற பிரசவ நிகழ்வைக் குறிக்கும் இறந்தகால வினையாகவும், ‘ஒரு மகன்’ என்பதுடன் இயல்பாகவும் உள்ளது.
- source_word: υἱόν
  choice: ஒரு மகனை
  rationale: மூலம் பொதுவாக ஒரு குழந்தை என்பதை மட்டும் அல்லாமல் ஆண் குழந்தையான மகனைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: Ἐλισάβετ
  choice: எலிசபெத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம் பயன்படுத்தப்பட்டுள்ளது.
