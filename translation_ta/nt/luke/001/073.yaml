  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: ta
  text: நம் தந்தையான[a] ஆபிரகாமுக்கு அவர் செய்த சத்தியத்தை, நமக்கு அருளுவதற்காக—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம் தந்தையான’ என்பதற்குப் பதிலாக ‘நம் மூதாதையான’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘நம் தந்தை’ என்று உள்ளது; இது ஆபிரகாமைப் பற்றிய உடன்படிக்கை மொழியைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: செய்துகொடுத்த சத்தியத்தை
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத்தில் இது செயப்படுபொருளாக உள்ளது. ‘சத்தியம்’ என்பது உறுதிமொழியைக் குறிக்கும் இயல்பான தமிழ்; ‘செய்துகொடுத்த’ என்பது ὤμοσεν என்பதையும் சேர்த்து வெளிப்படுத்துகிறது.
- source_word: ὃν ὤμοσεν
  choice: அவர் செய்துகொடுத்த
  rationale: ஆபிரகாமிடம் கடவுள் உறுதியாகச் செய்த சத்தியத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; இறந்தகால வினை பாதுகாக்கப்படுகிறது.
- source_word: πρὸς Ἀβραὰμ
  choice: ஆபிரகாமுக்கு
  rationale: சத்தியம் யாரை நோக்கிச் செய்யப்பட்டது என்பதைக் குறிக்கும் πρός என்பதற்கு இச்சூழலில் இயல்பான தமிழ் வடிவம்.
- source_word: τὸν πατέρα ἡμῶν
  choice: நம் தந்தையாகிய
  rationale: கிரேக்கத்தின் குடும்ப மற்றும் உடன்படிக்கை சார்ந்த ‘எங்கள் தந்தை’ மொழியைப் பாதுகாக்கிறது; தமிழில் பெயருடன் இயல்பாக இணைக்கப்படுகிறது.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: நமக்கு அருளும்படி
  rationale: ‘கொடுக்க’ என்ற அடிப்படைப் பொருளை உயர்ந்த பாடல் நடைக்கு ஏற்ற ‘அருள’ என வெளிப்படுத்துகிறது. articular infinitive-இன் நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கத்தை ‘-உம்படி’ திறந்தவாறே வைத்திருக்கிறது; கருத்து அடுத்த வசனத்தில் நிறைவடைகிறது.
theological_decisions:
- issue: ஆபிரகாமைச் சார்ந்த உடன்படிக்கை மொழி
  choice: நம் தந்தையாகிய
  alternative: நம் மூதாதையாகிய
  rationale: ‘தந்தை’ என்பது கிரேக்க மூலத்தின் நேரடி குடும்ப-உடன்படிக்கை மொழியையும் சகரியாவின் சமூக அடையாளத்தையும் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: τοῦ δοῦναι என்பதன் தொடர்பு
  choice: நமக்கு அருளும்படி
  alternative: நமக்கு அருளுவதற்காக / நமக்கு அருளியதாவது
  rationale: இது நோக்கத்தையோ விளைவையோ குறிக்கலாம். ‘-உம்படி’ அந்தத் தொடர்பை இயல்பாகக் காட்டி, மூலத்தில் இல்லாத அளவுக்கு அதைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சகரியாவின் பாடலுக்கேற்ற கண்ணியமான நடை. வசனம் முந்தைய வசனத்திலிருந்து தொடர்வதையும் அடுத்த வசனத்தில் நிறைவடைவதையும் காட்ட இறுதியில் நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்கு உடனே அல்லாமல் வசன இறுதியில் வைக்கப்பட்டுள்ளது.
