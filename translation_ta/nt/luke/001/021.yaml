- from: மக்கள் சகரியாவுக்காகக் காத்துக்கொண்டிருந்தார்கள். அவர் பரிசுத்த இடத்தில்[a] காலந்தாழ்த்தியதைக் கண்டு அவர்கள் வியந்தார்கள்.
  to: மக்கள் சகரியாவுக்காகக் காத்துக்கொண்டிருந்தார்கள்; அவர் ஆலயத்தின் பரிசுத்த இடத்தில் தாமதித்துக்கொண்டிருந்ததைக் கண்டு அவர்கள் வியந்தார்கள்.
