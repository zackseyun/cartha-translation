source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: ta
  text: மக்கள் சகரியாவுக்காகக் காத்துக்கொண்டிருந்தார்கள்; அவர் ஆலயத்தின் பரிசுத்த இடத்தில் தாமதித்துக்கொண்டிருந்ததைக் கண்டு அவர்கள் வியந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: மக்கள்
  rationale: வெளியில் கூடியிருந்த மக்களைச் சுட்டும் கூட்டுப்பெயர்; நவீன தமிழில் இயல்பானதும் துல்லியமானதும்.
- source_word: προσδοκῶν
  choice: காத்துக்கொண்டிருந்தார்கள்
  rationale: ἦν உடன் சேர்ந்த நிகழ்காலப் பெயரெச்சம் தொடர்ந்துகொண்டிருந்த கடந்தகாலச் செயலைக் குறிக்கிறது; தமிழ் தொடர்நிலை வடிவம் இதைப் பாதுகாக்கிறது.
- source_word: Ζαχαρίαν
  choice: சகரியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: ἐθαύμαζον
  choice: வியந்தார்கள்
  rationale: எதிர்பார்த்ததைவிட நீண்ட தாமதத்தால் ஏற்பட்ட தொடர்ந்த வியப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ χρονίζειν
  choice: காலந்தாழ்த்தியதைக் கண்டு
  rationale: காலம் நீண்டதையே குறிக்கிறது; தாமதத்தின் காரணத்தை ஊகிக்காமல், அது அவர்களின் வியப்புக்கான சந்தர்ப்பமாக இருந்ததைத் தெரிவிக்கிறது.
- source_word: ναῷ
  choice: பரிசுத்த இடத்தில்
  rationale: ναός என்பது ஆலய வளாகம் முழுவதையும் அல்ல, ஆலயத்தின் உட்புறப் பரிசுத்தக் கட்டிடத்தைச் சுட்டுகிறது; சூழலில் ஆசாரியர் நுழைந்த இடம் இதுவே.
- source_word: αὐτόν
  choice: அவர்
  rationale: χρονίζειν என்ற வினையெச்சத்தின் எழுவாயாக உள்ள வேற்றுமை உருபுடைய சுட்டுப்பெயர்; தமிழில் மரியாதை ஒருமையால் இயல்பாக வெளிப்படுகிறது.
