translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இரண்டு தொடர்நிலைச் செயல்களும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளன; ναός என்பதன் குறிப்பான பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
