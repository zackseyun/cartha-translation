source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: ta
  text: அந்தக் குழந்தையோ தொடர்ந்து வளர்ந்து, ஆவியில் வலிமை பெற்றுவந்தான்[a]. அவன் இஸ்ரவேல் மக்கள்முன் பொதுவெளியில் தோன்றும் நாள்வரை[c] வனாந்தரப் பகுதிகளில்[b] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆவியில்” என்பது பொதுவாக உள்ளார்ந்த அல்லது ஆன்மிக வலிமையைக் குறிக்கலாம்; அல்லது தூய ஆவியுடன் தொடர்புடைய வலிமையைக் குறிப்பாகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் இது பன்மையில் உள்ளது; “பாழான இடங்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவன் இஸ்ரவேல் மக்கள்முன் வெளிப்படும் நாள்வரை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: குழந்தை
  rationale: யோவானின் இளமைப் பருவத்தைக் குறிக்கிறது; குறிப்பிட்ட வயதுநிலையை வற்புறுத்தாமல் கிரேக்கச் சொல்லின் பரந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: ηὔξανε
  choice: தொடர்ந்து வளர்ந்து
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் காட்டும் நீடித்த வளர்ச்சியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκραταιοῦτο
  choice: வலிமை பெற்றுவந்தான்
  rationale: நடைபெற்றுக்கொண்டிருந்த வலுப்பெறும் செயல்முறையைத் தருகிறது; ‘வலுப்படுத்தப்பட்டான்’ என்று செயப்பாட்டு நுணுக்கத்தையோ ‘வலிமையானான்’ என்று நிறைவடைந்த நிலையையோ மிகைப்படுத்துவதில்லை.
- source_word: πνεύματι
  choice: ஆவியில்
  rationale: வலிமை பெற்ற தளம் அல்லது வகையைச் சுருக்கமாகக் காட்டி, மனிதனின் உள்ளார்ந்த ஆவியா தூய ஆவியுடன் தொடர்புடைய வலிமையா என்ற கிரேக்கத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἐν ταῖς ἐρήμοις
  choice: வனாந்தரப் பகுதிகளில்
  rationale: கிரேக்கத்தின் பன்மையைப் பாதுகாத்து, குடியிருப்பற்ற அல்லது தனிமையான பல இடங்களைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடராக உள்ளது.
- source_word: ἀναδείξεως
  choice: பொதுவாக வெளிப்படும்
  rationale: மக்கள்முன் வெளிப்படுதல் அல்லது பொதுவாழ்வில் தோன்றுதல் என்ற கருத்தை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: யோவானின் பொது வெளிப்பாட்டின் இலக்கு அல்லது பார்வையாளர்களாக இஸ்ரவேலைக் காட்டுகிறது.
theological_decisions:
- issue: πνεύματι என்பது யோவானின் ஆவியைக் குறிக்கிறதா, தூய ஆவியைக் குறிக்கிறதா
  choice: ஆவியில்
  alternative: தூய ஆவியில் / தனது உள்ளத்தில்
  rationale: கிரேக்கத்தில் இங்கு தூய ஆவி என்று வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை. ஆகவே இரு புரிதல்களுக்கும் இடமளிக்கும் பொதுவான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- issue: ἀνάδειξις என்பது வெறும் தோன்றுதலா அல்லது அதிகாரப்பூர்வ வெளிப்படுத்துதலா
  choice: பொதுவாக வெளிப்படும்
  alternative: இஸ்ரவேல்முன் வெளிப்படுத்தப்படும்
  rationale: யோவான் பொதுவாக அறியப்படும் தருணத்தைக் காட்டுகிறது; தெய்வீகச் செயப்பாட்டையோ அதிகாரப்பூர்வ நியமனத்தையோ மூலவாக்கியத்தைவிடத் தெளிவாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அந்தக் குழந்தையோ’ என்பது கிரேக்கத்தின் தலைப்புமாற்ற நுணுக்கத்தை இயல்பாகத் தருகிறது. தொடர்ந்த செயலைக் காட்ட ‘தொடர்ந்து’ மற்றும் ‘பெற்றுவந்தான்’ பயன்படுத்தப்பட்டுள்ளன; இறையியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
