source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: ta
  text: ஆனால் அவர் வெளியே வந்தபோது, அவர்களிடம் பேச அவரால் முடியவில்லை. ஆலயத்தின் பரிசுத்த இடத்தில்[a] அவர் ஒரு தரிசனத்தைக் கண்டிருந்தார் என்று அவர்கள் உணர்ந்துகொண்டார்கள். அவரோ அவர்களுக்குச் சைகை செய்துகொண்டே இருந்தார்; பேச முடியாத நிலையிலேயே இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தில்.” இங்குள்ள கிரேக்கச் சொல், முழு ஆலய வளாகத்தைக் காட்டிலும் அதன் பரிசுத்த உள் பகுதியை இன்னும் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஊமையாகவே இருந்தார்.” கிரேக்கப் பெயரடை பேச இயலாத ஒருவரைக் குறிக்கலாம்; சில சூழல்களில் அது செவிடுத்தன்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: அவர் வெளியே வந்தபோது
  rationale: முதன்மை வினைக்கு முந்திய நிகழ்வைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக வழங்குகிறது.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: அவர்களிடம் பேச அவரால் முடியவில்லை
  rationale: δύναμαι + வினையெச்சத்தின் இயலாமைப் பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: ἐπέγνωσαν
  choice: உணர்ந்துகொண்டார்கள்
  rationale: அவர்கள் கண்ட அறிகுறிகளிலிருந்து ஒரு தெளிவான முடிவுக்கு வந்ததைக் காட்டுகிறது.
- source_word: ὀπτασίαν
  choice: ஒரு தரிசனம்
  rationale: இச்சூழலில் வெளிப்படுத்தப்பட்ட அசாதாரணக் காட்சியை இயல்பாகக் குறிக்கிறது.
- source_word: ἐν τῷ ναῷ
  choice: திருக்கோயிலின் பரிசுத்த அறைக்குள்
  rationale: ναός என்பது பொதுவாக முழுக் கோயில் வளாகத்தை அல்ல, அதன் பரிசுத்த உள் பகுதியையே குறிக்கும் வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: διανεύων
  choice: சைகை செய்துகொண்டே இருந்தார்
  rationale: ἦν என்பதுடன் சேர்ந்த பங்கேற்புவினை தொடர்ச்சியான செயலைக் குறிக்கிறது; இத்தமிழாக்கம் அந்த நீடித்த தன்மையைப் பாதுகாக்கிறது.
- source_word: διέμενεν
  choice: இருந்தார்
  rationale: வேறு நிலையுக்கு மாறாமல் அதே நிலையில் தொடர்ந்ததைக் ‘வே’ என்னும் வலியுறுத்தலுடன் இயல்பாக எடுத்துரைக்கிறது.
- source_word: κωφός
  choice: பேச முடியாதவராகவே
  rationale: உடனடியான சூழல் அவரால் பேச முடியாததையே வெளிப்படையாக வலியுறுத்துகிறது; செவிடுத்தன்மையைத் தேவையின்றி முதன்மை உரையில் சேர்க்காமல் மூலச்சொல்லின் விரிந்த பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: சகரியாவின் நிலையை விவரிக்கும் κωφός என்பதன் பொருள்
  choice: பேச முடியாதவராகவே இருந்தார்
  alternative: ஊமையாகவே இருந்தார்; அல்லது செவிடராகவும் பேச முடியாதவராகவும் இருந்தார்
  rationale: இந்த வசனம் பேச இயலாமையையும் சைகை செய்வதையும் முன்னிறுத்துகிறது. κωφός சில சூழல்களில் செவிடுத்தன்மையையும் குறிக்கக்கூடும்; ஆனால் இவ்வசனம் அதைத் தெளிவாகக் கூறாததால் முதன்மை உரை அந்த முடிவைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘திருக்கோயிலின் பரிசுத்த அறை’ என்பது சாதாரண வாசகருக்குப் புரியும்படி ναός/ἱερόν வேறுபாட்டை வெளிப்படுத்துகிறது. இறுதிக் கூறில் செவிடுத்தன்மை பற்றிய சாத்தியத்தை முதன்மை உரை தீர்மானிக்காமல் அடிக்குறிப்பில் வைத்திருக்கிறது.
