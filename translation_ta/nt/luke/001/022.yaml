  to: ஆனால் அவர் வெளியே வந்தபோது, அவர்களிடம் பேச அவரால் முடியவில்லை. ஆலயத்தின் பரிசுத்த இடத்தில்[a] அவர் ஒரு தரிசனத்தைக் கண்டிருந்தார் என்று அவர்கள் உணர்ந்துகொண்டார்கள். அவரோ அவர்களுக்குச் சைகை செய்துகொண்டே இருந்தார்; பேச முடியாத நிலையிலேயே இருந்தார்[b].
