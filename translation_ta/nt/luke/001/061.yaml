  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். நேர்கூற்றில் இயல்பான தமிழ் சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உறவுமுறைப் பொருளும் சுட்டுப்பெயரின் அண்மைப் பொருளும் காக்கப்பட்டுள்ளன.
