source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: ta
  text: அவர்கள் அவளிடம், “உன் உறவினர்களில் இந்தப் பெயரால் அழைக்கப்படுகிறவர் யாரும் இல்லை” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் குடும்பத்தில் இந்தப் பெயரால் அழைக்கப்படுகிறவர் யாரும் இல்லை.”
    reason: συγγένεια என்பது ‘உறவினர்கள்’ என்றும், விரிவான பொருளில் ‘குடும்பம்’ என்றும் வழங்கப்படலாம்.
lexical_decisions:
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: λέγω என்பதன் இறந்தகாலக் கதை வடிவத்தை இயல்பான தமிழ் நேர்கூற்றில் ‘என்றார்கள்’ என வழங்குகிறது.
- source_word: πρὸς αὐτὴν
  choice: அவளிடம்
  rationale: பேசுதலைக் குறிக்கும் வினையுடன் πρός + வேற்றுமை, யாரிடம் பேசப்பட்டது என்பதைக் காட்டுகிறது; தமிழில் ‘அவளிடம்’ இயல்பானது.
- source_word: Οὐδείς ἐστιν
  choice: யாருக்கும் ... இல்லையே
  rationale: கிரேக்கத்தின் முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் அவர்களின் ஆட்சேபனையையும் ‘இல்லையே’ காட்டுகிறது.
- source_word: ἐκ τῆς συγγενείας σου
  choice: உன் உறவினர்களில்
  rationale: συγγένεια இங்கு உறவுமுறையால் இணைந்தவர்களைக் குறிக்கிறது; ἐκ என்பதன் பகுதிப்பொருளை ‘உறவினர்களில்’ தெளிவாக வழங்குகிறது.
- source_word: ὃς καλεῖται
  choice: பெயர் ... இருக்கிறது
  rationale: ஒருவர் ஒரு பெயரால் அழைக்கப்படுகிறார் என்ற கிரேக்கப் பயன்பாட்டை, தமிழில் பெயர் வைத்திருப்பதைக் குறிக்கும் இயல்பான சொல்லாக்கமாக வழங்குகிறது.
- source_word: τῷ ὀνόματι τούτῳ
  choice: இந்தப் பெயர்
  rationale: τούτῳ முன்பு முன்மொழியப்பட்ட குறிப்பிட்ட பெயரைச் சுட்டுவதால் ‘இந்தப் பெயர்’ என மொழிபெயர்க்கப்படுகிறது.
