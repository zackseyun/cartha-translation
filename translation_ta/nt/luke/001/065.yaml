  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: φόβος என்பதற்கு ‘அச்சம்,’ τοὺς περιοικοῦντας αὐτούς என்பதற்கு சுற்றிலும் குடியிருந்தோர், ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας என்பதற்கு யூதேயாவின் மலைநாடு முழுவதிலும், மற்றும் imperfect passive διελαλεῖτο என்பதற்கு தொடர்ச்சியைக் காட்டும் ‘பேசப்பட்டுவந்தன.’ ‘இந்த நிகழ்வுகள் அனைத்தும்’ என்பது ῥήματα-வின் சூழல்சார் ‘matters/events’ பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.'
  naturalness: உரை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அவர்களைச் சுற்றிலும் குடியிருந்த அனைவர்மீதும் அச்சம் உண்டாயிற்று’ மற்றும் ‘பேசப்பட்டுவந்தன’ ஆகியவை இயல்பானவை; மூலத்தின் பொது பரவல் மற்றும் தொடர்ச்சியான பேச்சு ஆகியவற்றைச் சுமையாகாமல் தெரிவிக்கின்றன.
