source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: ta
  text: அவர்களைச் சுற்றிலும் குடியிருந்த அனைவர்மீதும் அச்சம் உண்டாயிற்று[b]. யூதேயாவின் மலைநாடு முழுவதிலும் இந்த நிகழ்வுகள் அனைத்தும் பேசப்பட்டுவந்தன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வார்த்தைகள் அனைத்தும்” அல்லது “இந்தக் காரியங்கள் அனைத்தும்.” கிரேக்கச் சொல் பேசப்பட்ட வார்த்தைகளையோ, பேசப்பட்டுக்கொண்டிருந்த நிகழ்வுகள் அல்லது காரியங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அச்சம்” என்பது கடவுளுடைய செயல் தெளிவாக வெளிப்பட்டதால் ஏற்பட்ட வியப்பும் பயபக்தியும் கலந்த உணர்வையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: அனைவர்மீதும் அச்சம் உண்டாயிற்று
  rationale: அச்சம் அவர்களை ஆட்கொண்ட தொடக்கநிகழ்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ἐπί உடன் வரும் திசை/பரவல் நுணுக்கத்தையும் ‘மீதும்’ காக்கிறது.
- source_word: φόβος
  choice: அச்சம்
  rationale: φόβος என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; கடவுளுடைய செயலால் எழும் வியப்பும் பயபக்தியும் இதில் அடங்கக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: அவர்களைச் சுற்றிலும் குடியிருந்த அனைவரும்
  rationale: περιοικέω என்பதிலுள்ள அருகிலும் சுற்றுப்புறத்திலும் வாழ்தல் என்ற பொருளை, ‘அயலார்’ என்று சுருக்காமல் தெளிவாகக் கூறுகிறது.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: யூதேயாவின் மலைநாடு முழுவதிலும்
  rationale: ὀρεινή குறிக்கும் மேட்டுநில/மலைப்பாங்கான பிரதேசத்தையும், ὅλῃ குறிக்கும் முழுப் பரப்பையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: διελαλεῖτο
  choice: பேசப்பட்டுவந்தன
  rationale: நிறைவுறா காலச் செயப்பாட்டு வடிவம், இச்செய்திகள் தொடர்ந்து மக்களிடையே பேசப்பட்டதைச் சுட்டுகிறது.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: இந்த நிகழ்வுகள் அனைத்தும்
  rationale: ῥήματα என்பது சொற்கள், செய்திகள், அல்லது பேசப்பட்ட நிகழ்வுகள்/விவகாரங்கள் என்பவற்றைக் குறிக்கலாம். இக்கதைச் சூழலில் நிகழ்ந்த காரியங்களே பேசப்பட்டதால் ‘நிகழ்வுகள்’ இயல்பாக உள்ளது; மூலத்தின் பொருள் விரிவை அடிக்குறிப்பு காக்கிறது.
theological_decisions:
- issue: கடவுளுடைய செயல் வெளிப்பட்டபோது ஏற்பட்ட φόβος என்பதன் நுணுக்கம்
  choice: அச்சம்
  alternative: வியப்பு கலந்த பயபக்தி
  rationale: முதன்மை உரையில் நேரடியான ‘அச்சம்’ என்பதை வைத்திருப்பது பயம், பிரமிப்பு, பயபக்தி ஆகியவற்றுக்கிடையேயுள்ள வேதாகமச் சார்ந்த பொருள் அழுத்தத்தைத் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அனைவர்மீதும் அச்சம் உண்டாயிற்று’ என்பது மூலத்தின் சொற்றொடர் அமைப்பை அளவோடு காக்கிறது; ‘பேசப்பட்டுவந்தன’ தொடர்ச்சியான பொதுப் பேச்சை இயல்பாகத் தெரிவிக்கிறது.
