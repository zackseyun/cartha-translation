reference: Luke 1:66
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: ta
  text: இதைக் கேட்ட அனைவரும் தங்கள் உள்ளத்தில் பதித்துக்கொண்டார்கள். அவர்கள், “அப்படியானால் இந்தக் குழந்தை என்னவாகும்[a]?” என்று கூறினார்கள். ஏனெனில் ஆண்டவரின் கை அவனுடன் இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் குழந்தை என்னவாயிருக்கும்?” கிரேக்க வினைச்சொல் நேரடியாக ‘இருக்கும்’ என்று பொருள்படும்; இச்சூழலில் குழந்தையின் எதிர்கால நிலை அல்லது பங்கைப் பற்றிக் கேட்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவரின் கை’ என்பது கடவுளுடைய செயற்படும் வல்லமை, ஆதரவு அல்லது வழிநடத்துதலைக் குறிக்கும் வேதாகம மரபுச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: அதைத் தங்கள் உள்ளத்தில் பதித்துக்கொண்டு
  rationale: ‘தங்கள் இதயத்தில் வைத்தார்கள்’ என்ற மூல உருவகத்தைத் தக்கவைத்தபடியே, கேட்டவற்றை ஆழமாக நினைவில் கொண்டு சிந்தித்தார்கள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: πάντες οἱ ἀκούσαντες
  choice: இதைக் கேட்ட அனைவரும்
  rationale: கிரேக்கத்தில் கேட்கப்பட்ட பொருள் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும், முன் நிகழ்ந்தவற்றைச் சூழல் சுட்டுகிறது; தமிழில் ‘இதைக்’ என்பது தேவையான இயல்பான நிறைவு.
- source_word: Τί ἄρα
  choice: அப்படியானால் ... என்ன
  rationale: ἄρα தரும் விளைவு அல்லது ஊகத்தின் நுணுக்கத்தை ‘அப்படியானால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ παιδίον τοῦτο
  choice: இந்தக் குழந்தை
  rationale: வயதையோ எதிர்காலப் பங்கையோ தேவைக்கு மேல் குறிப்பாக்காமல் παιδίον என்பதன் எளிய பொருளைத் தருகிறது.
- source_word: ἔσται
  choice: என்னவாகும்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘இருக்கும்’ என்றாலும், இங்கு குழந்தையின் எதிர்கால நிலை அல்லது பங்கைப் பற்றிய கேள்வி என்பதால் ‘என்னவாகும்’ இயல்பாக உள்ளது; மாற்று நேரடி மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: மக்களின் கேள்விக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: χεὶρ κυρίου
  choice: ஆண்டவரின் கை
  rationale: இறைவனுடைய செயற்படும் வல்லமை, ஆதரவு அல்லது வழிநடத்துதலைக் குறிக்கும் வேதாகம உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவனோடு இருந்தது
  rationale: μετά உடன் வரும் ‘உடன்’ என்ற உறவை நேரடியாகத் தருகிறது; ‘அவன்’ என்பது குழந்தையை இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: ‘ஆண்டவரின் கை அவனோடு இருந்தது’ என்ற சொற்றொடரின் பொருள்
  choice: இறைவனுடைய ஆதரவு, வல்லமை அல்லது செயல்படும் உடனிருப்பைச் சுட்டும் உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘ஆண்டவர் அவனுக்கு உதவினார்’ அல்லது ‘கடவுளின் வல்லமை அவன்மேல் இருந்தது’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்தச் சொற்றொடர் குழந்தையின் வாழ்வில் கடவுள் செயல்படுவதை உணர்த்துகிறது; ஆனால் அது பாதுகாப்பு, ஆதரவு, வல்லமையூட்டல் அல்லது வழிநடத்துதல் என்று மூலவசனம் தனியே வரையறுக்கவில்லை. உருவகத்தைத் தக்கவைப்பது அந்தத் தெய்வியல் பரப்பைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளத்தில் பதித்துக்கொண்டு’ மற்றும் ‘ஆண்டவரின் கை’ ஆகிய உருவகங்கள் மூலத்தின் வேதாகமத் தன்மையையும் பொருள் பரப்பையும் காக்கின்றன.
