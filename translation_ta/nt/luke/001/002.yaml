translation:
  language: ta
  text: ஆரம்பம் முதலே நேரில் கண்ட சாட்சிகளாக இருந்து, வார்த்தைக்குப் பணியாற்றுவோராக ஆனவர்கள் அவற்றை எங்களுக்குக் கையளித்தபடியே,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: ஏற்பவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட முயற்சிகள், தொடக்ககாலச் சாட்சிகள் வழங்கிய மரபுக்கு ஏற்ப அமைந்தன என்ற ஒப்புமைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: παρέδοσαν
  choice: ஒப்படைத்த
  rationale: பெற்ற செய்தி அல்லது மரபை நம்பிக்கையுடன் அடுத்தவர்களிடம் வழங்குதல் என்ற பொருளைத் தருகிறது; வெறும் ‘கொடுத்தல்’ என்பதைவிட அதிகாரப்பூர்வமான பரிமாற்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἡμῖν
  choice: எங்களிடம்
  rationale: முதலாம் நபர் பன்மை மறைமுகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: தொடக்கமுதல் ... ஆனவர்கள்
  rationale: சம்பவங்களின் ஆரம்பத்திலிருந்தே நேரடி அறிவு பெற்றிருந்த குறிப்பிட்ட குழுவைக் குறிக்கிறது.
- source_word: αὐτόπται
  choice: நேரில் கண்ட சாட்சிகள்
  rationale: தாங்களே நேரடியாகக் கண்டவர்கள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπηρέται
  choice: பணியாளர்கள்
  rationale: λόγος சார்ந்த சேவையில் ஈடுபட்டவர்களைக் குறிக்கிறது; திருச்சபைப் பதவியைக் குறிக்கும் தேவையற்ற நுணுக்கத்தைச் சேர்க்காது.
- source_word: γενόμενοι
  choice: ஆனவர்கள்
  rationale: அவர்கள் நேரில் கண்ட சாட்சிகளாக இருந்ததோடு வார்த்தையின் பணியாளர்களாக ஆனார்கள் என்ற காலநிலை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: τοῦ λόγου
  choice: வார்த்தையின்
  rationale: λόγος என்பதன் பரந்த சொற்பொருளைத் தக்கவைக்கிறது; இங்கு இயேசுவைப் பற்றிய அறிவிக்கப்பட்ட செய்தியைக் குறிக்கும் வாய்ப்பு மிகுந்தாலும் அதை முதன்மை உரையில் தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: τοῦ λόγου என்பதன் குறிப்பு
  choice: வார்த்தை
  alternative: செய்தி
  rationale: இங்கு கிறிஸ்துவுக்கு வழங்கப்படும் தனிப்பட்ட ‘லோகோஸ்’ பட்டத்தைவிட, இயேசுவைப் பற்றிய அறிவிக்கப்பட்ட செய்தியே பெரும்பாலும் குறிக்கப்படுகிறது. எனினும் மூலச்சொல்லின் பரந்த பொருளையும் உண்மையான விளக்க இடைவெளியையும் காக்க முதன்மை உரையில் ‘வார்த்தை’ வைக்கப்பட்டு, ‘செய்தி’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: γενόμενοι என்பதன் காலநிலை நுணுக்கம்
  choice: நேரில் கண்ட சாட்சிகளாக இருந்து, ... பணியாளர்களாக ஆனவர்கள்
  alternative: நேரில் கண்ட சாட்சிகளும் வார்த்தையின் பணியாளர்களுமாக இருந்தவர்கள்
  rationale: சாட்சிகளாக இருந்தவர்கள் பின்னர் அறிவிப்புப் பணியில் ஈடுபட்டார்கள் என்ற இயல்பான முன்னேற்றத்தை வெளிப்படுத்துகிறது; அதே நேரத்தில் கிரேக்கத் தொடரின் நெருக்கமான இலக்கணத் தொடர்பை முற்றிலும் பிரிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் இலக்கியத் தெளிவும் காக்கப்பட்டுள்ளன. இது முந்தைய வசனத்துடன் தொடரும் சார்பு வாக்கியத் துணுக்கு என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘அவற்றை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நிகழ்வுகள் அல்லது விவரங்களை இயல்பாக மீண்டும் சுட்டுகிறது.
