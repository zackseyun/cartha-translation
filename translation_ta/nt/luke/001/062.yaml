translation:
  language: ta
  text: அவர்கள் அவனுடைய தந்தையிடம், குழந்தைக்கு என்ன பெயரிட விரும்புகிறார் என்று சைகை செய்து கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்படியாக: “குழந்தை என்னவென்று அழைக்கப்பட வேண்டும் என அவர் விரும்புகிறார் என்று அவர்கள் அவனுடைய தந்தையிடம் சைகை செய்தார்கள்.”'
    reason: மூலத்தின் செயப்பாட்டு வினை வடிவத்தையும் மறைமுகக் கேள்வியின் அமைப்பையும் காட்டும் சொற்படியான மாற்று.
lexical_decisions:
- source_word: ἐνένευον
  choice: சைகையால் கேட்டார்கள்
  rationale: வார்த்தைகளைப் பயன்படுத்தாமல் சைகைகள் மூலம் தொடர்புகொண்டதை வினைச்சொல் குறிக்கிறது. தமிழில் ‘சைகையால் கேட்டார்கள்’ என்பது இச்சூழலில் இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: அப்போது
  rationale: இது கதையை அடுத்த நிகழ்வுக்கு நகர்த்தும் மென்மையான இணைப்புச்சொல்; ‘அப்போது’ தமிழில் அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: அவனுடைய தந்தையிடம்
  rationale: சைகை யாரை நோக்கிச் செய்யப்பட்டது என்பதை வேற்றுமை உருபு காட்டுகிறது. குழந்தையைக் குறிக்கும் ஆண்பால் சுட்டுப்பெயர் தமிழில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: τὸ τί ἂν θέλοι
  choice: என்ன … விரும்புகிறார் என்று
  rationale: இது சைகையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் மறைமுகக் கேள்வி. ἄν உடனான optative தரும் சாத்தியம் அல்லது மென்மையான நிச்சயமின்மை தமிழில் இயல்பான மறைமுகக் கேள்வி வடிவில் வெளிப்படுகிறது.
- source_word: καλεῖσθαι αὐτό
  choice: அவனுக்கு என்ன பெயரிட
  rationale: கிரேக்கத்தில் சொற்படி ‘அவன் என்னவென்று அழைக்கப்பட’ என்ற செயப்பாட்டு வடிவம் உள்ளது. குழந்தைக்குப் பெயர் வைக்கும் இச்சூழலில் ‘அவனுக்கு என்ன பெயரிட’ என்பது இயல்பான தமிழ்; அடிப்படைப் பொருளை மாற்றாது.
