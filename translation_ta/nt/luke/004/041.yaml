reference: Luke 4:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: ta
  text: பலரிடமிருந்து பேய்களும் வெளியேறிக்கொண்டிருந்தன. அவை, “நீ கடவுளின் மகன்!” என்று கூக்குரலிட்டுச் சொல்லின. ஆனால் அவர் அவற்றைக் கடிந்துகொண்டு, அவை பேசுவதற்கு அனுமதிக்கவில்லை; ஏனெனில், அவர் மேசியா[a] என்று அவை அறிந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கச் சொல் Χριστός, “மேசியா; அபிஷேகம் செய்யப்பட்டவர்” என்று பொருள்படும்.
    reason: Χριστός என்பதற்கான பரிச்சயமான மாற்று மொழிபெயர்ப்பையும் அதன் பட்டப் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: δαιμόνια
  choice: பேய்கள்
  rationale: δαιμόνια என்பதன் நேரடிப் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; கிரேக்கத்தில் இல்லாத ‘அசுத்த ஆவிகள்’ என்ற வேறு சொற்றொடரை இங்கு கொண்டுவரவில்லை.
- source_word: ἐξήρχετο
  choice: வெளியேறிக்கொண்டிருந்தன
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கும் imperfect வடிவத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀπὸ πολλῶν
  choice: பலரிடமிருந்து
  rationale: கிரேக்கத்தில் மனிதர்கள் மறைமுகமாகக் குறிக்கப்பட்டுள்ளனர்; தமிழில் தெளிவுக்கும் இயல்புக்கும் ஏற்றவாறு ‘பலரிடமிருந்து’ எனத் தரப்பட்டுள்ளது.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: கூக்குரலிட்டுச் சொல்லின
  rationale: உரத்த குரலையும் அதனுடன் இணைந்த கூற்றையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: கிறிஸ்துவியல் பட்டத்தின் வலிமையைத் தக்கவைத்துக்கொண்டு, நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἐπιτιμῶν
  choice: கடிந்துகொண்டார்
  rationale: கூர்மையான கண்டிப்பையும் அதிகாரமுள்ள தடுத்தலையும் குறிக்கும் வினையின் வலிமையைத் தருகிறது.
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: அவை பேசாதபடி ... கடிந்துகொண்டார்
  rationale: அவர் அவற்றைப் பேச அனுமதிக்கவில்லை என்ற கருத்தைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; தொடர்ச்சியான தடுத்தலை ‘கடிந்துகொண்டார்’ வெளிப்படுத்துகிறது.
- source_word: ᾔδεισαν
  choice: அறிந்திருந்தன
  rationale: அந்த நேரத்துக்கு முன்பே நிலவிய அறிவைச் சுட்டும் கிரேக்க வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν χριστὸν αὐτὸν εἶναι
  choice: அவரே மேசியா ... என்று
  rationale: Χριστός இங்கு பெயராக அல்ல, அபிஷேகம் செய்யப்பட்ட அரசர்/மீட்பர் என்னும் பட்டமாகச் செயல்படுவதால் ‘மேசியா’ எனத் தரப்பட்டுள்ளது; αὐτός தரும் வலியுறுத்தலை ‘அவரே’ காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பேய்களின் அடையாள அறிவிப்பின் சூழலில் மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் தனிப்பெயரைப்போல் அல்லாமல் பட்டமாகப் பயன்படுகிறது. ‘மேசியா’ அதன் வரலாற்று மற்றும் பட்டப் பொருளைக் காக்கிறது; பரிச்சயமான மாற்றை அடிக்குறிப்பு தருகிறது.
- issue: ‘கடவுளின் மகன்’ மற்றும் ‘மேசியா’ ஆகிய பட்டங்களின் உறவு
  choice: இரு பட்டங்களையும் தனித்தனியாக வைத்தல்
  alternative: இரண்டையும் ஒரே விளக்கப் பட்டமாக இணைத்தல்
  rationale: பேய்கள் கூறும் ‘கடவுளின் மகன்’ என்பதையும், அவை அறிந்திருந்ததாக உரையாளர் கூறும் ‘மேசியா’ என்பதையும் கிரேக்கம் வேறுபடுத்துகிறது. அவற்றின் உறவை விளக்கி முடிவுசெய்யாமல் அந்த வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. பழமையான ‘தேவன்/குமாரன்’ நடைக்கு மாற்றாக ‘கடவுள்/மகன்’ பயன்படுத்தப்பட்டுள்ளது. கதையின் தொடர்ச்சியான செயலைக் காட்ட ‘வெளியேறிக்கொண்டிருந்தன’ பயன்படுத்தப்பட்டுள்ளது; கிறிஸ்துவியல் பட்டங்கள் விளக்கிச் சமப்படுத்தப்படாமல் தனித்தனியே பாதுகாக்கப்பட்டுள்ளன.
