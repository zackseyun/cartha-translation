  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: ta
  text: தீர்க்கதரிசி எலிசாவின் காலத்தில் இஸ்ரவேலில் தொழுநோயாளிகள்[a] பலர் இருந்தார்கள். ஆனால் சிரியனான நாமானைத் தவிர, அவர்களில் ஒருவரும் தூய்மையாக்கப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் பலவகையான கடுமையான தோல் நோய்களைக் குறிக்கக்கூடும்; அது இன்று ‘தொழுநோய்’ என்று மருத்துவ ரீதியில் அழைக்கப்படும் நோயை மட்டும் குறிக்க வேண்டியதில்லை.
    reason: λεπροί என்ற சொல்லை நவீன ஹான்சன் நோயோடு மட்டும் தவறாக ஒப்பிடுவதைத் தவிர்த்து, அதன் வேதாகமக் காலப் பொருள் பரப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: λεπροὶ
  choice: தொழுநோயாளிகள்
  rationale: வேதாகம வழக்கில் கடுமையான தோல் நோய்களால் பாதிக்கப்பட்டவர்களைக் குறிக்கும் சுருக்கமான, தமிழ் வாசகர்களுக்கு நன்கு புரியும் சொல். இது இன்றைய மருத்துவ வரையறையிலுள்ள தொழுநோயை மட்டுமே குறிக்க வேண்டியதில்லை என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: இஸ்ரவேலில்
  rationale: இடம் அல்லது எல்லையைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான தமிழில் நேரடியாக வழங்குகிறது; ‘இஸ்ரவேல் தேசத்தில்’ என்று தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: தீர்க்கதரிசியான எலிசாவின் காலத்தில்
  rationale: ἐπί உடன் வரும் இந்தக் காலத் தொடர் ‘எலிசா தீர்க்கதரிசியின் காலத்தில்’ என்ற பொருளைத் தருகிறது. தமிழில் அடையாளத்தையும் காலத்தையும் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐκαθαρίσθη
  choice: சுத்தமாக்கப்படவில்லை
  rationale: καθαρίζω இங்கு உடல்நல மீட்பையும் சடங்குசார் அசுத்தம் நீங்குதலையும் உள்ளடக்கும் வேதாகமச் சொல்லாட்சியாக இருப்பதால், வெறும் ‘குணமாக்கப்படவில்லை’ என்பதைவிட ‘சுத்தமாக்கப்படவில்லை’ மூலத்தின் பரப்பை நன்றாகப் பாதுகாக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: இங்கு விதிவிலக்கைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: Ναιμὰν ὁ Σύρος
  choice: சீரியனான நாமான்
  rationale: தனிப்பெயரையும் இன/நாட்டு அடையாளத்தையும் தக்கவைத்து, சுத்தமாக்கப்பட்டவர் இஸ்ரவேலர் அல்லாத சீரியர் என்ற வாக்கியத்தின் அழுத்தத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தொழுநோய் தொடர்பான சுத்தமாக்குதல் மொழியின் பொருள்
  choice: ἐκαθαρίσθη என்பதை ‘சுத்தமாக்கப்படவில்லை’ என்று மொழிபெயர்த்தல்
  alternative: ‘குணமாக்கப்படவில்லை’ அல்லது ‘தூய்மைப்படுத்தப்படவில்லை’
  rationale: இந்தச் சூழலில் உடல் நோயிலிருந்து மீட்பும் வேதாகமச் சடங்குசார் தூய்மை நிலையும் ஒன்றோடொன்று தொடர்புடையவை. ‘சுத்தமாக்கப்படுதல்’ அந்த இரு பரிமாணங்களையும் தீர்மானமாகப் பிரிக்காமல் தக்கவைக்கிறது.
- issue: நாமானின் சீரிய அடையாளத்தின் வலிமை
  choice: ‘சீரியனான நாமான்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘சீரியாவைச் சேர்ந்த நாமான்’
  rationale: ὁ Σύρος அவரை அடையாளப்படுத்தும் பெயரடைத் தொடராக உள்ளது. அவர் இஸ்ரவேலர் அல்லாத வெளிநாட்டவர் என்ற இயேசுவின் எடுத்துக்காட்டின் முரண்பாட்டை இந்த வடிவம் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆனால்’ இரண்டாம் கூறின் எதிர்மறைத் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது. ‘சுத்தமாக்கப்படவில்லை’ என்ற வேதாகமச் சொல்லாட்சி மூலத்தின் உடல் மற்றும் சடங்குசார் கருத்து நெருக்கத்தைத் தக்கவைக்கிறது.
