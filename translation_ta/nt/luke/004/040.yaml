id: LUK.4.40
reference: Luke 4:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: ta
  text: சூரியன் மறைந்துகொண்டிருந்தபோது[a], பலவகையான நோய்களால் பாதிக்கப்பட்டவர்கள் தங்களிடம் இருந்த அனைவரும் அவர்களை அவரிடம் அழைத்துவந்தார்கள். அவர் அவர்கள் ஒவ்வொருவர்மேலும் தம் கைகளை வைத்து, அவர்களைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சூரியன் மறைந்துகொண்டிருக்கையில்.’ கிரேக்க மொழியில் நிகழ்காலப் பங்கேற்புச் சொல்லுடன் வரும் தனித்த உடைமை வேற்றுமைத் தொடர், இந்த நிகழ்வுகள் நடந்த நேரத்தைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: சூரியன் மறைந்துகொண்டிருந்தபோது
  rationale: நிகழ்வுகள் நடந்துகொண்டிருந்த அதே நேரத்தில் சூரியன் மறைந்துகொண்டிருந்ததை நிகழ்காலப் பங்கேற்புச் சொல் கொண்ட genitive absolute அமைப்பு காட்டுகிறது. ‘மறைந்துகொண்டிருந்தபோது’ என்பது அதன் காலத் தொடர்ச்சியை இயல்பான தமிழில் காக்கிறது; δέ-க்கு இங்கு தனியே ‘இப்போது’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἅπαντες ὅσοι
  choice: அனைவரும்
  rationale: இந்த இரட்டை அமைப்பு உள்ளடக்கத்தின் முழுமையை வலியுறுத்துகிறது. தொடர்புச் சொற்றொடருடன் வரும் ‘அனைவரும்’ தமிழில் இயல்பாக அந்தப் பரந்த பொருளைக் காக்கிறது.
- source_word: εἶχον ἀσθενοῦντας
  choice: உடல்நலமில்லாமல் இருந்தவர்களைத் தங்களிடம் கொண்டிருந்த
  rationale: இங்கு ἔχω என்பது நோயுற்றவர்கள் ஒருவரின் குடும்பம் அல்லது பராமரிப்பில் இருப்பதைக் குறிக்கிறது. ‘தங்களிடம் கொண்டிருந்த’ என்பது உரையில் கூறப்படாத உறவை ‘உறவினர்’ எனக் குறுக்காமல் காக்கிறது.
- source_word: ἀσθενοῦντας
  choice: உடல்நலமில்லாமல் இருந்தவர்கள்
  rationale: குணமாக்கும் சூழலில் இது பொதுவான பலவீனத்தைவிட உடல் நோயைக் குறிக்கிறது. நவீன தமிழில் தெளிவான, மரியாதையான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: νόσοις ποικίλαις
  choice: பலவகையான நோய்களால்
  rationale: ποικίλαις நோய்களின் பல்வேறு தன்மையைச் சுட்டுகிறது; காரணம் அல்லது பாதிப்பைத் தெரிவிக்கும் ‘நோய்களால்’ தமிழ் வாக்கியத்தில் இயல்பாக அமைகிறது.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: அவர்களை அவரிடம் அழைத்துவந்தார்கள்
  rationale: ἄγω என்பதன் அழைத்து அல்லது கொண்டுவருதல் என்ற பொருளை, நோயுற்றவர்களை இயேசுவிடம் கொண்டுவரும் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: அவர்கள் ஒவ்வொருவர்மீதும்
  rationale: ἑνὶ ἑκάστῳ என்ற இரட்டைப் பகிர்வு ஒவ்வொரு நபருக்கும் தனித்தனியாகச் செய்யப்பட்ட செயலை வலியுறுத்துகிறது; ‘ஒவ்வொருவர்மீதும்’ அதைத் தெளிவாகக் காக்கிறது.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: தம் கைகளை வைத்து
  rationale: கைகளை ஒருவர்மீது வைக்கும் தெளிவான உடல் செயலை நேரடியாகக் காட்டுகிறது. செய்பவர் ஒரே உயர்பொருள் நபராக இருப்பதால் ‘தம்’ இயல்பாக உள்ளது.
- source_word: ἐθεράπευεν
  choice: குணமாக்கினார்
  rationale: முற்றாத இறந்தகால வினை தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டலாம். ‘ஒவ்வொருவர்மீதும்’ அந்தப் பகிர்வுத் தன்மையை ஏற்கெனவே வெளிப்படுத்துவதால், தமிழ் இறந்தகாலம் இயல்பாக அமைகிறது.
theological_decisions:
- issue: கைகளை வைத்து குணமாக்கிய செயலை மொழிபெயர்த்தல்
  choice: அவர் அவர்கள் ஒவ்வொருவர்மீதும் தம் கைகளை வைத்து, அவர்களைக் குணமாக்கினார்
  alternative: அவர் அவர்கள் ஒவ்வொருவர்மீதும் தம் கைகளை வைத்துக்கொண்டே அவர்களைக் குணமாக்கினார்
  rationale: உரை இயேசுவின் நேரடியான உடல் செயலையும் ஒவ்வொரு நபர்மீதும் காட்டிய தனிப்பட்ட கவனத்தையும் விவரிக்கிறது. பின்னாளைய திருச்சபை அல்லது சடங்கு சார்ந்த பொருளைச் சேர்க்காமல் அந்தச் செயல் மட்டும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுவழக்கிற்கும் இடைப்பட்ட, வாசிக்க எளிதான கண்ணியமான நடை. மூலத்தில் குறிப்பிடப்படாத ‘உறவினர்கள்’ போன்ற உறவுமுறையைச் சேர்க்காமல், சற்றே அசாதாரணமானாலும் பொருள்துல்லியமான ‘தங்களிடம் கொண்டிருந்த’ பயன்படுத்தப்பட்டது. வசனப் பிரிப்புக்கு ஏற்ற இரண்டு வாக்கியங்கள் பயன்படுத்தப்பட்டுள்ளன.
