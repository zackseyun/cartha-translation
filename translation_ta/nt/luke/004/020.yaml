language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: ta
  text: அவர் சுருளைச் சுருட்டி[a], அதைப் பணியாளரிடம்[b] திருப்பிக் கொடுத்துவிட்டு அமர்ந்தார். ஜெபக்கூடத்தில் இருந்த அனைவருடைய கண்களும் அவரை உற்றுநோக்கிக் கொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நூல்.” கிரேக்கச் சொல் பொதுவாக எழுதப்பட்ட ஒரு நூலையோ ஆவணத்தையோ குறிக்கலாம்; இந்த ஜெபக்கூடச் சூழலில் அது சுருளாக இருந்திருக்கும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, சுருள்களைக் கையாளும் பொறுப்புடைய ஜெபக்கூடப் பணியாளர்.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: சுருளைச் சுருட்டி
  rationale: முதல் நூற்றாண்டின் சுருளை மீண்டும் சுருட்டும் செயலைத் தெளிவாகக் குறிக்கிறது; நவீன புத்தகத்தைப் போல ‘மூடி’ என்று தவறாக உணர்த்துவதில்லை.
- source_word: βιβλίον
  choice: சுருள்
  rationale: இந்த ஜெபக்கூட வாசிப்புச் சூழலில் ஏசாயாவின் எழுத்து சுருள் வடிவில் இருந்ததால் வரலாற்றுச் சூழலைத் துல்லியமாக வெளிப்படுத்துகிறது; ‘நூல்’ என்ற பொதுவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀποδοὺς
  choice: திருப்பிக் கொடுத்துவிட்டு
  rationale: பயன்படுத்திய பொருளை அதற்குரிய பொறுப்பாளரிடம் மீண்டும் கொடுக்கும் பொருளையும், அடுத்த செயலை நோக்கிச் செல்லும் நிகழ்வுவரிசையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὑπηρέτῃ
  choice: பணியாளரிடம்
  rationale: ஜெபக்கூட வழிபாட்டில் சுருள்களைக் கையாள உதவிய பொறுப்பாளரைக் குறிக்கிறது; ‘ஊழியன்’ அல்லது ‘வேலைக்காரன்’ ஏற்படுத்தக்கூடிய தவறான சமூக அல்லது சமய நிழற்பொருள்களைத் தவிர்க்கிறது.
- source_word: ἐκάθισεν
  choice: அமர்ந்தார்
  rationale: செயலை நேரடியாகவும் இயல்பாகவும் சொல்கிறது; அவர் ஏன் அமர்ந்தார் என்பதை மூலவசனத்துக்கு அப்பால் விளக்குவதில்லை.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: அனைவருடைய கண்களும்
  rationale: அனைவரையும் உள்ளடக்கும் பரப்பையும், கண்களை இலக்கண எழுவாயாகக் கொண்ட கிரேக்கத்தின் காட்சித் தீவிரத்தையும் காக்கிறது.
- source_word: ἀτενίζοντες αὐτῷ
  choice: அவரையே உற்றுநோக்கிக்கொண்டிருந்தன
  rationale: நீடித்த, கூர்ந்த பார்வையை வெளிப்படுத்துகிறது; ‘அவரையே’ இலக்கின் மீது இருந்த முழுக் கவனத்தை இயல்பான தமிழில் காட்டுகிறது, பகைமையைச் சேர்ப்பதில்லை.
- source_word: συναγωγῇ
  choice: ஜெபக்கூடத்தில்
  rationale: இந்நிகழ்வில் யூதர்கள் வழிபாட்டிற்காகக் கூடும் நிறுவனம் மற்றும் இடத்தைக் குறிக்கும் வழக்கமான, எளிதில் புரியும் தமிழ் சொல்.
theological_decisions:
- issue: ஜெபக்கூட வழிபாட்டில் βιβλίον என்பதன் வரலாற்று வடிவம்
  choice: ‘நூல்’ என்ற பொதுச் சொல்லுக்குப் பதிலாக ‘சுருள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நூல்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; முதல் நூற்றாண்டின் வாசிப்புப் பொருளின் வடிவத்தைத் துல்லியமாகக் காட்டும் மொழிபெயர்ப்புத் தீர்மானம். கிரேக்கச் சொல்லின் பொதுவான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் தொடர் செயல்கள் இயல்பான தமிழ் வினையெச்சங்களால் இணைக்கப்பட்டுள்ளன. ‘அனைவருடைய கண்களும்’ என்ற உயிர்ப்பான உருவகம் பாதுகாக்கப்பட்டுள்ளது.
