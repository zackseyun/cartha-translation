source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: ta
  text: அனைவரும் அவரைப் பற்றி நல்லவிதமாகப் பேசிக்கொண்டிருந்தார்கள்[a]; அவருடைய வாயிலிருந்து வெளிவந்த அருளான வார்த்தைகளைக் கேட்டு வியந்துகொண்டிருந்தார்கள்[b]. “இவர் யோசேப்பின் மகன் அல்லவா?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பற்றிச் சாட்சியமளித்தார்கள்” அல்லது “அவருக்குச் சாதகமாகச் சாட்சியமளித்தார்கள்.” கிரேக்கச் சொற்றொடர் சாதகமாகப் பேசுவதையோ சாட்சியமளிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடிப் பொருள், “அருளின் வார்த்தைகள்.” இது அருள், தயவு, நன்மதிப்பு அல்லது கவர்ச்சி நிறைந்த வார்த்தைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: அவரைப் பாராட்டிப் பேசினார்கள்
  rationale: இந்தச் சூழலில் இச்சொற்றொடர் முறையான சாட்சியத்தைவிட இயேசுவைப் பற்றிய சாதகமான மதிப்புரையைக் குறிக்கிறது. தொடர்ந்து வரும் வியப்புடன் இது இயல்பாக இணைகிறது; அதேவேளையில் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐθαύμαζον
  choice: வியந்தார்கள்
  rationale: தொடர்ந்துகொண்டிருந்த ஆச்சரியமான எதிர்வினையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐπὶ τοῖς λόγοις
  choice: வார்த்தைகளைக் கேட்டு
  rationale: ἐπί உடன் வரும் தத்திவம் அவர்களுடைய வியப்புக்கான காரணம் அல்லது சந்தர்ப்பத்தைக் காட்டுகிறது. தமிழில் ‘கேட்டு வியந்தார்கள்’ என்பது இயல்பான காரணத் தொடர்பைத் தருகிறது.
- source_word: τῆς χάριτος
  choice: அருள்நிறைந்த
  rationale: χάρις என்ற சொல்லின் அருள், தயவு, ஈர்ப்பு ஆகிய பொருள் நிழல்களை ஓரளவு தக்கவைத்து, வார்த்தைகளின் பண்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: அவருடைய வாயிலிருந்து வந்த
  rationale: வார்த்தைகளின் மூலத்தை வலியுறுத்தும் கிரேக்க மொழியின் தெளிவான உருவகத்தைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: Οὐχὶ
  choice: அல்லவா?
  rationale: உறுதியான ‘ஆம்’ பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் சொல்லாட்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: இவர் யோசேப்பின் மகன்
  rationale: கூட்டத்தாரின் புரிதலை எந்த விளக்கச் சேர்க்கையும் இல்லாமல் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: கன்னிப் பிறப்பின் பின்னணியில் இயேசுவை யோசேப்பின் மகன் என்று அழைப்பது
  choice: கூட்டத்தாரின் கூற்றை ‘இவர் யோசேப்பின் மகன் அல்லவா?’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: கன்னிப் பிறப்பைப் பற்றிய தவறான புரிதலைத் தவிர்க்க விளக்கச் சொற்களைச் சேர்த்தல்
  rationale: இது கூட்டத்தாரின் பார்வையைப் பதிவு செய்கிறது; கதைசொல்லியின் இறையியல் திருத்தம் அல்ல. ஆகவே உரையிலுள்ள நாடகத் தளர்ச்சியையும் இறையியல் பதற்றத்தையும் விளக்கச் சேர்க்கையால் நீக்காமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘அருள்நிறைந்த’ என்பது வேதாகமச் செறிவைத் தக்கவைத்தாலும் தொழில்நுட்ப இறையியல் சொல்லாக மட்டும் ஒலிக்காமல் அமைகிறது. இரண்டு இறந்தகால வினைகளும் கூட்டத்தின் தொடர்ச்சியான எதிர்வினையை இயல்பாகக் காட்டுகின்றன.
