revisions:
- from: இயேசு அதைக் கடிந்துகொண்டு, “பேசாதே; இவனைவிட்டு வெளியே வா” என்றார். அந்தப் பேய் அவனை நடுவில் தள்ளிவிட்டு, அவனுக்கு எந்தத் தீங்கும் செய்யாமல் அவனைவிட்டு வெளியேறியது.
  to: இயேசு அதைக் கடிந்துகொண்டு, “பேசாதே; இவனைவிட்டு வெளியே வா” என்றார். அந்தப் பேய் அவனை நடுவில் வீசியெறிந்து, அவனுக்கு எந்தத் தீங்கும் செய்யாமல் அவனைவிட்டு வெளியேறியது.
