id: LUK.4.35
reference: Luke 4:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: ta
  text: இயேசு அதைக் கடிந்துகொண்டு, “பேசாதே; இவனைவிட்டு வெளியே வா” என்றார். அந்தப் பேய் அவனை நடுவில் வீசியெறிந்து, அவனுக்கு எந்தத் தீங்கும் செய்யாமல் அவனைவிட்டு வெளியேறியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: அதைக் கடிந்துகொண்டு
  rationale: ἐπιτιμάω என்பதன் கண்டிப்பும் அதிகாரமும் நிறைந்த பேச்சை ‘கடிந்துகொண்டு’ இயல்பாக வெளிப்படுத்துகிறது; அஃறிணைச் சுட்டுப்பெயர் சூழலில் முன் குறிப்பிடப்பட்ட பேயைக் குறிக்கிறது.
- source_word: Φιμώθητι
  choice: பேசாதே
  rationale: φιμόω என்பதன் நேர்ப்பொருள் ‘வாய்க்கட்டு போடப்படு’ என்றாலும், பேச்சை நோக்கிய கட்டளையில் ‘அமைதியாக இரு/பேசாதே’ என்பதே பொருள். இங்கு கூர்மையான நேரடிக் கட்டளையாக ‘பேசாதே’ இயல்பாக உள்ளது.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: இவனைவிட்டு வெளியே வா
  rationale: விடுதலைக் கட்டளையின் நேரடியான வடிவத்தையும் ἀπό குறிக்கும் பிரிவையும் பாதுகாக்கிறது; நேரில் உள்ள மனிதனைச் சுட்டுவதால் ‘இவனை’ இயல்பானது.
- source_word: ῥίψαν αὐτὸν εἰς τὸ μέσον
  choice: அவனை நடுவில் தள்ளிவிட்டு
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முதன்மை வினைக்கு முந்திய செயலை ‘தள்ளிவிட்டு’ காட்டுகிறது. ‘நடுவில்’ என்பது εἰς τὸ μέσον என்பதைக் கூடுதல் குழுவைக் குறிப்பிடாமல் தருகிறது.
- source_word: τὸ δαιμόνιον
  choice: அந்தப் பேய்
  rationale: δαιμόνιον என்பதற்கு நவீன பொதுத் தமிழில் நேரடியும் புரிந்துகொள்ளத்தக்கதுமான இணை ‘பேய்’; ‘அந்த’ என்பது ஏற்கெனவே சூழலில் குறிப்பிடப்பட்ட உயிரைக் குறிக்கிறது.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: அவனுக்கு எந்தத் தீங்கும் செய்யாமல்
  rationale: μηδέν என்பதன் முழுமையான மறுப்பையும் βλάπτω என்பதன் தீங்கு விளைவித்தல் என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: δαιμόνιον குறிக்கும் இருப்பின் தன்மை
  choice: இயேசுவால் நேரடியாகக் கட்டளையிடப்பட்டு மனிதனைவிட்டு வெளியேறும் ‘பேய்’ என மொழிபெயர்த்தல்
  alternative: ‘தீய சக்தி’ அல்லது மனநோய் போன்ற அருவமான விளக்கம்
  rationale: கிரேக்க உரை நேரடி அழைப்பு, கட்டளை, வெளியேறுதல் ஆகியவற்றுடன் ஒரு பேயோட்டும் நிகழ்வாகவே இதை விவரிக்கிறது; மொழிபெயர்ப்பு இதை வேறு கருத்தாக மாற்றக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குத் தெளிவானதும் கண்ணியமானதும் நேரடியுமான நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தின் வன்முறையான செயலும் மனிதனுக்கு ஏற்பட்ட தீங்கின்மையும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
