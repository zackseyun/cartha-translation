  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: ta
  text: அவர் வளர்க்கப்பட்ட நாசராவுக்கு[a] வந்து, தமது வழக்கத்தின்படி ஓய்வுநாளில் ஜெப ஆலயத்திற்குள் சென்று, வாசிப்பதற்காக எழுந்து நின்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாசரேத்.’ இங்கு கிரேக்க உரையில் ‘நாசரா’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: நாசரா
  rationale: இவ்வசனத்தின் கிரேக்க உரையிலுள்ள Ναζαρά என்ற வடிவத்தை நேரடியாகத் தமிழில் ஒலிபெயர்க்கிறது; பழக்கமான ‘நாசரேத்’ என்ற பெயருடன் அமைதியாக ஒத்திசைக்கவில்லை.
- source_word: τεθραμμένος
  choice: வளர்க்கப்பட்ட
  rationale: τρέφω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம் இங்கு அவர் அந்த ஊரில் வளர்க்கப்பட்டதைச் சுட்டுகிறது; ‘வளர்க்கப்பட்ட’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் செயப்பாட்டு வடிவத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: தமது வழக்கத்தின்படி
  rationale: அவரது தொடர்ச்சியான வழக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், இச்சொற்றொடர் ஒரு யூத ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ஒருமையாக மொழிபெயர்ப்பது பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: συναγωγήν
  choice: ஜெபக்கூடம்
  rationale: யூதர்கள் வழிபாட்டிற்கும் வேதவாசிப்பிற்கும் கூடும் இடத்தை நவீனத் தமிழில் பொதுவாகப் புரிந்துகொள்ளத்தக்க வகையில் குறிக்கிறது.
- source_word: ἀνέστη ἀναγνῶναι
  choice: வாசிப்பதற்காக எழுந்து நின்றார்
  rationale: வினையெச்சத்தின் நோக்கப்பொருளையும், வாசிப்பதற்காக அவர் எழுந்ததையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Ναζαρά என்ற இடப்பெயரின் வடிவம்
  choice: நாசரா
  alternative: நாசரேத்
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல; எனினும் இவ்வசனத்தின் கிரேக்க வடிவத்தை முன்னிலைப்படுத்தி ‘நாசரா’ எனக் கொடுக்கப்படுகிறது. வாசகர்களுக்குப் பழக்கமான ‘நாசரேத்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் தொடர்ச்சியான வாக்கிய ஓட்டம் காக்கப்பட்டுள்ளது; இடப்பெயரின் உண்மையான உரைவேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
