language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்தார்: “எழுதப்பட்டிருக்கிறது[b]: ‘உன் கடவுளாகிய ஆண்டவரை வணங்க வேண்டும்[a]; அவர் ஒருவருக்கே பணிவிடை செய்ய வேண்டும்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “உன் கடவுளாகிய ஆண்டவர் முன் பணிந்து வணங்க வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: இந்த மேற்கோள் உபாகமம் 6:13-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῷ
  choice: அவனுக்குப் பதிலளித்தார்
  rationale: கிரேக்க மொழியின் வினையெச்சம்–முதன்மை வினை அமைப்பை இயல்பான நவீனத் தமிழில் ஒரே பதிலுரை வினையாக வழங்குகிறது; αὐτῷ என்பதையும் ‘அவனுக்கு’ என்று காக்கிறது.
- source_word: Γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் நிறைவு நிலைச் செயப்பாட்டு வடிவத்தையும், எழுதப்பட்டதன் தொடரும் செல்லுபடியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Κύριον τὸν θεόν σου
  choice: உன் கடவுளாகிய ஆண்டவர்
  rationale: κύριος என்பதை ‘ஆண்டவர்’ என்றும் θεός என்பதை ‘கடவுள்’ என்றும் வேறுபடுத்தி, உடைமைத் தொடர்பையும் கிரேக்க உரையின் வரிசை சார்ந்த பொருளையும் காக்கிறது.
- source_word: προσκυνήσεις
  choice: வணங்க வேண்டும்
  rationale: இச்சூழலில் கடவுளுக்குரிய வழிபாட்டு வணக்கத்தைத் தெளிவாகச் சொல்கிறது; உடல் குனிதல் என்ற அடிப்படைப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λατρεύσεις
  choice: பணிவிடை செய்ய வேண்டும்
  rationale: ஒரு தெய்வத்துக்குச் செலுத்தப்படும் சேவையை ‘பணி செய்’ என்பதைக் காட்டிலும் தெளிவாகக் குறிக்கிறது; அதேவேளை குறிப்பிட்ட சமய மரபின் சொற்பயன்பாட்டைத் திணிக்கவில்லை.
- source_word: αὐτῷ μόνῳ
  choice: அவர் ஒருவருக்கே
  rationale: சேவை கடவுளுக்கு மட்டுமே உரியது என்ற விலக்குத் தன்மையைத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வேதாகம மேற்கோளில் கடவுளைக் குறிக்கும் κύριος
  choice: ஆண்டவர்
  alternative: கர்த்தர் / எஜமான் / யெகோவா
  rationale: புதிய ஏற்பாட்டின் கிரேக்க உரையில் உள்ள κύριος என்பதையே மொழிபெயர்க்கிறது. இதன் உபாகமப் பின்னணியிலுள்ள எபிரெய இறைபெயரை நேரடியாக முதன்மை உரைக்குள் கொண்டுவராமலும், ‘எஜமான்’ என்ற பலவீனமான பொருளைத் தவிர்த்தும் உள்ளது.
- issue: எதிர்கால வடிவங்களான προσκυνήσεις மற்றும் λατρεύσεις கட்டளையாகப் பயன்படுதல்
  choice: ‘வணங்க வேண்டும் … பணிவிடை செய்ய வேண்டும்’ என்ற கடமை வடிவம்
  alternative: ‘வணங்குவாய் … பணிவிடை செய்வாய்’ என்ற எளிய எதிர்கால வடிவம்
  rationale: வேதமேற்கோளில் இவ்வெதிர்கால வடிவங்கள் கட்டளையின் வலிமையுடன் வருகின்றன. நவீனத் தமிழில் ‘வேண்டும்’ அந்தக் கட்டாயத்தை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மேற்கோளின் கட்டளை வலிமையும் கடவுளுக்கே உரிய தனிப்பட்ட வணக்கமும் சேவையும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு [a] அது விளக்கும் ‘வணங்க வேண்டும்’ என்பதற்குப் பின்பும், [b] முழு மேற்கோளுக்குப் பின்பும் பொருத்தப்பட்டுள்ளது.
