source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: ta
  text: பிசாசு அவரிடம், “இந்த அதிகாரம் முழுவதையும், அவற்றின் மகிமையையும்[a] உமக்குத் தருவேன். ஏனெனில், அது என்னிடம் ஒப்படைக்கப்பட்டுள்ளது; நான் விரும்புகிற எவருக்கும் அதைத் தருகிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் பொலிவையும்.” இச்சூழலில் கிரேக்கச் சொல் மகிமை, பொலிவு அல்லது மாட்சிமை என்ற பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: பிசாசு
  rationale: சோதனை நிகழ்வில் சாத்தானைக் குறிக்கும் நிலைபெற்ற தனிப்பட்ட பெயராக இது வருகிறது; ‘அவதூறு செய்பவன்’ என்ற சொற்பிறப்புப் பொருளைவிட ‘பிசாசு’ இயல்பாகக் குறித்த நபரைத் தெரிவிக்கிறது.
- source_word: Σοὶ δώσω
  choice: உமக்குத் தருவேன்
  rationale: முன்னிறுத்தப்பட்ட இரண்டாம் நபர் வேற்றுமையைத் தமிழில் இயல்பான சொல் வரிசையோடு தருகிறது; இயேசுவை நோக்கிய உரை என்பதால் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: இங்கு வெறும் வலிமையை அல்ல, ஆளும் உரிமையையோ அதிகாரத்தையோ குறிக்கிறது.
- source_word: ταύτην ἅπασαν
  choice: இந்த ... முழுவதையும்
  rationale: சுட்டுப்பெயருடன் வரும் முழுமையைக் குறிக்கும் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: δόξαν αὐτῶν
  choice: அவற்றின் மகிமை
  rationale: முந்தைய வசனத்தில் காட்டப்பட்ட அரசுகளின் பெருமை, பொலிவு, கீர்த்தி ஆகிய கருத்துகளை ‘மகிமை’ காக்கிறது; ‘அவற்றின்’ என்பது அந்த அரசுகளைக் குறிக்கிறது.
- source_word: παραδέδοται
  choice: என்னிடம் ஒப்படைக்கப்பட்டுள்ளது
  rationale: கடந்த செயலில் உண்டான நிலை தொடர்வதைக் காட்டும் நிறைவுக்காலச் செயப்பாட்டு வடிவத்தையும், இது பிசாசின் கூற்று என்பதையும் கருத்துரையின்றி காக்கிறது.
- source_word: ᾧ ἂν θέλω
  choice: நான் விரும்புகிற எவருக்கும்
  rationale: விருப்பத்திற்குட்பட்ட, வரையறுக்கப்படாத நபரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δίδωμι αὐτήν
  choice: அதைத் தருகிறேன்
  rationale: பொதுவான அல்லது வழக்கமான செயலைக் குறிக்கும் நிகழ்காலத்தையும், ஒருமை பெண்பால் சுட்டுப்பெயர் ‘அதிகாரம்’ என்பதைக் குறிப்பதையும் காக்கிறது.
theological_decisions:
- issue: அரசுகளின் அதிகாரம் தன்னிடம் உள்ளது என்ற பிசாசின் கூற்றை மொழிபெயர்ப்பு உறுதிப்படுத்துகிறதா என்பது
  choice: அதைப் பிசாசின் நேரடிக் கூற்றாக எந்த விளக்கச் சேர்க்கையும் இல்லாமல் வழங்குதல்
  alternative: ‘தன்னிடம் ஒப்படைக்கப்பட்டதாகக் கூறினான்’ போன்ற விலக்கிக் காட்டும் சொற்களைச் சேர்த்தல்
  rationale: கிரேக்கம் இதை பிசாசின் நேரடி உரையாகவே தருகிறது. மொழிபெயர்ப்பு அவன் கூற்றை ஆதரிக்கவோ மறுக்கவோ கூடாது; பேச்சாளர் பிசாசு என்று கதைச் சூழல் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. இயேசுவை நோக்கிய பிசாசின் உரையில் ‘உமக்கு’ என்ற மரியாதை ஒருமை உள்ளது. அரைப்புள்ளி இரு நெருக்கமாக இணைந்த கூற்றுகளைப் பிரிக்கிறது; எந்த சமயப் பிரிவுக்குரிய விளக்கமும் சேர்க்கப்படவில்லை.
