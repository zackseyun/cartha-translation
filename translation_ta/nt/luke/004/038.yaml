source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: ta
  text: அவர் ஜெபக்கூடத்திலிருந்து புறப்பட்டு, சீமோனுடைய வீட்டுக்குள் சென்றார். சீமோனுடைய மாமியார் கடுமையான காய்ச்சலால் வாட்டப்பட்டுக்கொண்டிருந்தார். அவர்கள் அவளைப் பற்றி அவரிடம் கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுக்காக அவரிடம் வேண்டிக்கொண்டார்கள்.’ கிரேக்கச் சொற்றொடர் சொல்லர்த்தமாக ‘அவளைப் பற்றி அவரிடம் கேட்டார்கள்’ என உள்ளது; இந்தச் சூழலில் அது அவளுக்கு உதவும்படி விடுக்கப்பட்ட வேண்டுகோளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: அவர் எழுந்து, ஜெபக்கூடத்திலிருந்து புறப்பட்டு
  rationale: Ἀναστὰς என்பது முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கும் இறந்தகால வினையெச்சம்; ἀπό இடத்திலிருந்து வெளியேறும் நகர்வைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘எழுந்து… புறப்பட்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: சீமோனுடைய வீட்டுக்குள் சென்றார்
  rationale: εἰσέρχομαι மற்றும் εἰς இணைந்து ஓர் இடத்திற்குள் நுழைவதைக் குறிக்கின்றன. ‘வீட்டுக்குள் சென்றார்’ என்பது இதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: சீமோனுடைய மாமியார்
  rationale: πενθερά என்பது ‘மாமியார்’ எனும் உறவுமுறையைத் துல்லியமாகக் குறிக்கிறது; உரை கூறுவதற்கு மேலான முடிவுகள் சேர்க்கப்படவில்லை.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: கடுமையான காய்ச்சலால் வாட்டப்பட்டுக்கொண்டிருந்தார்
  rationale: செயப்பாட்டு வினையெச்சத்துடன் அமைந்துள்ள தொடர், நோய் அவளைப் பற்றிப்பிடித்து வாட்டிய நிலையைக் காட்டுகிறது. πυρετῷ μεγάλῳ என்பதன் தீவிரம் ‘கடுமையான காய்ச்சல்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: அவர்கள் அவளைப் பற்றி அவரிடம் கேட்டார்கள்
  rationale: ἐρωτάω என்பது கேட்பது அல்லது வேண்டுவது என்று பொருள்படலாம். περὶ αὐτῆς என்பதற்கு நெருக்கமாக ‘அவளைப் பற்றி’ என்று மொழிபெயர்ப்பது, உதவி கோரியதாக இருக்கக்கூடிய சூழல்சார் பொருளை முதன்மை உரையில் அளவுக்கு மீறி வெளிப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: πενθερά என்பதால் சீமோனின் திருமண நிலை குறித்த உட்குறிப்பு
  choice: உறவுமுறைச் சொல்லை நேரடியாக ‘மாமியார்’ என்று மட்டும் வழங்குதல்
  alternative: சீமோன் திருமணமானவர் என்பதை உரையில் வெளிப்படையாகச் சேர்த்தல்
  rationale: இந்த உறவுமுறை திருமணத்தை உட்குறித்தாலும், மூலவசனம் அதைத் தனியே விளக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அதன் சொற்பொருளைத் தாண்டக்கூடாது.
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆς என்பதில் வேண்டுகோளின் நுட்பம்
  choice: முதன்மை உரையில் ‘அவளைப் பற்றி அவரிடம் கேட்டார்கள்’ என்று வழங்குதல்
  alternative: ‘அவளுக்காக அவரிடம் வேண்டிக்கொண்டார்கள்’ அல்லது ‘அவளுக்கு உதவும்படி கேட்டார்கள்’
  rationale: குணமாக்கும் சூழல் இது அவளுக்காக விடுக்கப்பட்ட வேண்டுகோள் என்பதைக் காட்டினாலும், கிரேக்கச் சொற்றொடர் அதை வெளிப்படையாகக் கூறவில்லை. எனவே தெளிவின்மையை முதன்மை உரையில் காத்து, சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபக்கூடம்’ பொதுவாகப் புரிந்துகொள்ளக்கூடிய வழக்குச் சொல்லாகவும், ‘வாட்டப்பட்டுக்கொண்டிருந்தார்’ நோயின் தொடர்ச்சியான தீவிர நிலையை வெளிப்படுத்துவதாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன. மரியாதைப் பன்மை வினைமுற்றுகள் இயல்பான தமிழ்நடைக்கேற்ப பயன்படுத்தப்பட்டுள்ளன.
