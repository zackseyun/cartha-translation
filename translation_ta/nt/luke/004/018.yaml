source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: ta
  text: ஆண்டவருடைய ஆவி என்மேல் இருக்கிறார்; ஏனெனில் ஏழைகளுக்கு நற்செய்தியை அறிவிக்க அவர் என்னை அபிஷேகம் செய்தார். சிறைப்பட்டவர்களுக்கு விடுதலையையும்[a], பார்வையற்றவர்களுக்குப் பார்வை மீளுதலையும் அறிவிக்கவும், நொறுக்கப்பட்டவர்களை[b] விடுதலையோடு அனுப்பவும் அவர் என்னை அனுப்பியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விடுதலை’ என்பதற்கான கிரேக்கச் சொல் ἄφεσις, ‘மன்னிப்பு’ என்றும் பொருள்படலாம்; இங்கு சிறைப்பட்டவர்களையும் நொறுக்கப்பட்டவர்களையும் பற்றிய சூழல் விடுதலை என்ற பொருளை முன்னிறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொற்சார்ந்து ‘நொறுக்கப்பட்டவர்கள்’ என்று உள்ளது; சூழலில் இது ‘ஒடுக்கப்பட்டவர்கள்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: ஆண்டவருடைய ஆவி என்மேல் இருக்கிறார்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும் தமிழில் இயல்புக்காக ‘இருக்கிறார்’ சேர்க்கப்படுகிறது. ‘ஆண்டவருடைய ஆவி’ என்பது உடைமை/மூல உறவையும் ஏசாயா மேற்கோளின் வேதாகமத் தொனியையும் காக்கிறது.
- source_word: οὗ εἵνεκεν
  choice: ஏனெனில்
  rationale: ஆவி இயேசுவின்மேல் இருப்பதற்கான காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔχρισέν με
  choice: அவர் என்னை அருள்பொழிவு செய்தார்
  rationale: χρίω என்பதன் அபிஷேக/மேசியத் தொடர்பைத் தக்கவைத்தபடி, நவீனத் தமிழில் சமயச் சூழலில் புரிந்துகொள்ளக்கூடிய சொற்றொடராக உள்ளது.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: ஏழைகளுக்கு நற்செய்தியை அறிவிக்க
  rationale: εὐαγγελίζω என்பதன் நல்ல செய்தியை அறிவிக்கும் பொருளையும் πτωχοί என்பதன் பொருளாதார அல்லது சமூகத் தாழ்நிலையை மிகையாக வரையறுக்காமல் ‘ஏழைகள்’ எனவும் வழங்குகிறது.
- source_word: ἀπέσταλκέν με
  choice: அவர் என்னை அனுப்பியிருக்கிறார்
  rationale: நிறைவுற்ற அனுப்புதலின் தொடரும் விளைவை கிரேக்க perfect வடிவுக்கு ஏற்றவாறு ‘அனுப்பியிருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: κηρύξαι
  choice: அறிவிக்க
  rationale: பொதுவாகப் பிரகடனம் செய்வதைக் குறிக்கிறது; ‘பிரசங்கிக்க’ என்ற குறுகிய திருச்சபைச் சொல்லைத் தவிர்க்கிறது.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: சிறைப்பட்டவர்களுக்கு விடுதலையை
  rationale: சிறைப்பட்டவர்கள் என்ற உடனடிச் சூழலிலும் ஏசாயாவின் விடுவிப்பு உருவகத்திலும் ἄφεσις இங்கு ‘விடுதலை’ என இயல்பாகப் பொருள்படுகிறது; ‘மன்னிப்பு’ என்ற சாத்தியமும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: பார்வையற்றவர்களுக்குப் பார்வை மீளுதலை
  rationale: ἀνάβλεψις என்பது பார்வை பெறுதல் அல்லது மீண்டும் பெறுதலைக் குறிக்கும். ‘பார்வை மீளுதல்’ அதன் குறிப்பான நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἀποστεῖλαι
  choice: அனுப்பவும்
  rationale: மூலத்தின் ‘அனுப்புதல்’ வினையைத் தக்கவைக்கிறது; நேரடியாக ‘விடுவிக்க’ என விளக்கவுரையாக்குவதில்லை.
- source_word: τεθραυσμένους
  choice: நொறுக்கப்பட்டவர்களை
  rationale: θραύω என்பதன் perfect passive participle வடிவிலுள்ள ‘நொறுக்கப்பட்டவர்கள்’ என்ற வலிமையான உருவகத்தைப் பாதுகாக்கிறது; ‘ஒடுக்கப்பட்டவர்கள்’ என்பது சூழல்சார் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν ἀφέσει
  choice: விடுதலையோடு
  rationale: முன்னர் வந்த ἄφεσις என்பதுடனான சொல் மீளுருவை ‘விடுதலை’ எனத் தக்கவைத்துக் கொண்டு, தமிழில் இயல்பாக ‘விடுதலையோடு அனுப்ப’ என வழங்குகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் ἄφεσις என்பதன் பொருள்
  choice: விடுதலை
  alternative: மன்னிப்பு
  rationale: சிறைப்பட்டவர்கள், பார்வையற்றவர்கள், நொறுக்கப்பட்டவர்கள் ஆகிய உடனடிச் சூழல் விடுவிப்பு மற்றும் மீட்பு உருவகத்தை முன்னிறுத்துகிறது. லூக்காவில் இச்சொல் வேறு இடங்களில் பாவமன்னிப்பைக் குறித்தாலும், இங்கு அந்தப் பொருளை மட்டும் திணிக்காமல் முதன்மை உரையில் ‘விடுதலை’ என்றும் அடிக்குறிப்பில் ‘மன்னிப்பு’ என்றும் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. மூலத்தின் இணை அமைப்பையும் ‘விடுதலை’ என்ற சொல்லின் மீளுருவையும் முடிந்தவரை காக்கிறது; செயற்கையான சொற்சார்பு தவிர்க்கப்படுகிறது.
