revisions:
- from: ஆண்டவருடைய ஆவி என்மேல் இருக்கிறார்; ஏனெனில் ஏழைகளுக்கு நற்செய்தியை அறிவிக்க அவர் என்னை அருள்பொழிவு செய்தார். சிறைப்பட்டவர்களுக்கு விடுதலையையும்[a], பார்வையற்றவர்களுக்குப் பார்வை மீளுதலையும் அறிவிக்கவும், நொறுக்கப்பட்டவர்களை விடுதலையோடு அனுப்பவும்[b] அவர் என்னை அனுப்பியிருக்கிறார்.
  to: ஆண்டவருடைய ஆவி என்மேல் இருக்கிறார்; ஏனெனில் ஏழைகளுக்கு நற்செய்தியை அறிவிக்க அவர் என்னை அபிஷேகம் செய்தார். சிறைப்பட்டவர்களுக்கு விடுதலையையும்[a], பார்வையற்றவர்களுக்குப் பார்வை மீளுதலையும் அறிவிக்கவும், நொறுக்கப்பட்டவர்களை[b] விடுதலையோடு அனுப்பவும் அவர் என்னை அனுப்பியிருக்கிறார்.
