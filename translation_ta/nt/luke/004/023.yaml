source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம், “நிச்சயமாக நீங்கள் என்னிடம் இந்தப் பழமொழியைச் சொல்வீர்கள்: ‘மருத்துவரே, உம்மையே குணமாக்கிக்கொள்ளும்.’ கப்பர்நகூமில் நிகழ்ந்ததாக நாங்கள் கேள்விப்பட்ட அனைத்தையும் இங்கே உமது சொந்த ஊரிலும் செய்யும்” என்றார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கப்பர்நகூமில்” என்பதற்கான கிரேக்கச் சொற்றொடரில் பொதுவாக “க்கு/உள்ளே” என்று பொருள்படும் εἰς பயன்படுத்தப்பட்டுள்ளது; இச்சூழலில் அது இடப்பொருளில் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: நிச்சயமாக
  rationale: இயேசு அவர்கள் என்ன சொல்வார்கள் என்பதை உறுதியாக எதிர்பார்ப்பதைக் காட்டும் வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐρεῖτέ μοι
  choice: நீங்கள் என்னிடம் … சொல்வீர்கள்
  rationale: எதிர்காலக் குறிப்பு கட்டளையாகவோ சாத்தியமாகவோ அல்லாமல் முன்னறிவிப்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: παραβολὴν
  choice: பழமொழி
  rationale: இங்கு இது விரிவான உவமைக் கதை அல்ல; ‘மருத்துவரே, உம்மையே குணமாக்கிக்கொள்ளும்’ என்ற சுருக்கமான வழக்குச் சொல்லைக் குறிக்கிறது.
- source_word: Ἰατρέ
  choice: மருத்துவரே
  rationale: மருத்துவத் தொழிலாளரை நேரடியாக அழைக்கும் விளிவேற்றுமையையும் பழமொழியின் கண்ணியமான தொனியையும் தருகிறது.
- source_word: θεράπευσον σεαυτόν
  choice: உம்மையே குணமாக்கிக்கொள்ளும்
  rationale: நேரடியான கட்டளையின் வலிமையைப் பாதுகாக்கிறது; ‘உம்மையே’ என்பது reflexive வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: நிகழ்ந்ததாக நாங்கள் கேள்விப்பட்ட அனைத்தையும்
  rationale: அவை பிறரிடமிருந்து கேள்விப்பட்ட நிகழ்வுகள் என்ற மறைமுகச் செய்தித் தன்மையையும் γενόμενα என்பதன் ‘நிகழ்தல்’ பொருளையும் காக்கிறது.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: கப்பர்நகூமில்
  rationale: εἰς என்பதன் அடிப்படைப் பொருள் ‘க்கு/உள்ளே’ என்றாலும், நிகழ்வுகளுடன் இங்கு இடப்பொருளில் வருவதால் இயல்பான தமிழில் ‘கப்பர்நகூமில்’ என வழங்கப்படுகிறது.
- source_word: ποίησον καὶ ὧδε
  choice: இங்கே … செய்யும்
  rationale: ποίησον என்பதன் பொதுவான ‘செய்’ பொருளையும் καί என்பதன் ‘இங்கும்’ வலியுறுத்தலையும் இணைத்து வழங்குகிறது.
- source_word: ἐν τῇ πατρίδι σου
  choice: உமது சொந்த ஊரிலும்
  rationale: நாசரேத் சூழலில் πατρίς நாட்டை விட ஒருவரின் சொந்த ஊர் அல்லது தாயகப் பகுதியைக் குறிக்கிறது; ‘சொந்த ஊர்’ நவீன தமிழில் தெளிவானது.
theological_decisions:
- issue: இச்சூழலில் παραβολή என்பதன் தன்மை
  choice: ‘பழமொழி’ என மொழிபெயர்த்தல்
  alternative: ‘உவமை’ அல்லது ‘சொல்’
  rationale: ‘மருத்துவரே, உம்மையே குணமாக்கிக்கொள்ளும்’ என்பது கதை வடிவ உவமை அல்ல, சுருக்கமான பழமொழி. இது கோட்பாட்டுத் தீர்மானம் அல்ல; சூழல்சார் சொற்பொருள் தீர்மானம்.
- issue: கப்பர்நகூமில் நடந்தவற்றின் தன்மை
  choice: ‘நிகழ்ந்ததாக’ என்ற பொதுவான வடிவம்
  alternative: ‘செய்யப்பட்டதாக’ அல்லது ‘நீர் செய்ததாக’
  rationale: γενόμενα இலக்கணரீதியாக ‘நிகழ்ந்தவை/நடந்தவை’ எனப் பொதுவாக உள்ளது. சூழல் இயேசுவின் செயல்களைச் சுட்டினாலும், மூலத்தில் வெளிப்படாத செய்பவரைச் சேர்க்காமல் அதன் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையில் இயேசுவை நோக்கி மக்கள் கூறுவதாக இருப்பதால் ‘உமது/செய்யும்’ என்ற மரியாதை ஒருமை வடிவங்கள் வைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு வாக்கியத்தின் முடிவில் சேர்க்கப்பட்டுள்ளது.
