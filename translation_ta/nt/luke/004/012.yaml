id: LUK.4.12
reference: Luke 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்தார்: “உன் கடவுளாகிய ஆண்டவரைச் சோதித்துப் பார்க்கக் கூடாது என்று சொல்லப்பட்டிருக்கிறது.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபான சில மொழிபெயர்ப்புகளில், “எழுதப்பட்டிருக்கிறது” என்று உள்ளது. ஆனால் இங்குள்ள கிரேக்கச் சொல் நேரடியாக “சொல்லப்பட்டிருக்கிறது” என்று பொருள்படும்.
    reason: alternative_reading
  - marker: b
    text: இது உபாகமம் 6:16-இலிருந்து மேற்கோள் காட்டப்பட்டுள்ளது. அங்குள்ள எபிரெய உரையில், பொதுவாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படும் YHWH என்ற இறைப் பெயர் உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: அதற்கு இயேசு ... என்று பதிலளித்தார்
  rationale: பங்கேற்பு வினைச்சொல்லும் முற்றுவினையும் சேர்ந்த இந்த கிரேக்க மரபுத்தொடர் இயல்பான நவீன தமிழில் ‘பதிலளித்தார்’ என்று வழங்கப்படுகிறது; αὐτῷ சூழலில் ‘அதற்கு’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: பதிலின் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்த மேற்கோளுக்குப் பின் ‘என்று’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Εἴρηται
  choice: சொல்லப்பட்டிருக்கிறது
  rationale: λέγω என்பதன் நிறைவுக்காலச் செயப்பாட்டு வடிவம் ‘சொல்லப்பட்டிருக்கிறது’ என்ற பொருளைத் தருகிறது; ‘எழுதப்பட்டிருக்கிறது’ என்று மாற்றாமல் கிரேக்கச் சொல்வடிவம் காக்கப்படுகிறது.
- source_word: Οὐκ ἐκπειράσεις
  choice: சோதித்துப் பார்க்கக் கூடாது
  rationale: ἐκπειράζω என்பது ஒருவரைச் சோதனைக்கு உட்படுத்துதல் அல்லது பரிசோதித்துப் பார்த்தல் என்பதைக் குறிக்கிறது. பாவத்திற்கு ஆசைகாட்டுதல் என்ற தவறான எண்ணத்தைத் தவிர்த்து, இயல்பான தமிழில் பொருள் தெளிவாக்கப்படுகிறது.
- source_word: κύριον τὸν θεόν σου
  choice: உன் கடவுளாகிய ஆண்டவரை
  rationale: κύριος ‘ஆண்டவர்’ என்றும் θεός ‘கடவுள்’ என்றும் வழங்கப்பட்டு, இரண்டும் ஒரே நபரைக் குறிக்கும் கிரேக்க இணைநிலைத் தொடர்பு ‘கடவுளாகிய ஆண்டவர்’ எனக் காக்கப்படுகிறது.
theological_decisions:
- issue: வேத மேற்கோள் அறிமுகம் (Εἴρηται)
  choice: சொல்லப்பட்டிருக்கிறது
  alternative: எழுதப்பட்டிருக்கிறது
  rationale: கிரேக்கத்தில் γράφω அல்ல, λέγω பயன்படுத்தப்பட்டுள்ளது. ஆகவே மரபான வேத மேற்கோள் நடையைத் திணிக்காமல் மூலத்தின் ‘சொல்லுதல்’ என்ற கருத்து முதன்மை உரையில் காக்கப்படுகிறது.
- issue: உபாகமம் 6:16 மேற்கோளில் κύριος
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: லூக்காவின் கிரேக்க உரையில் κύριος உள்ளது; எனவே பிரதான உரை அதற்கான பொதுவான நவீனத் தமிழ் இணையான ‘ஆண்டவர்’ என்பதைப் பயன்படுத்துகிறது. மேற்கோளின் எபிரெய மூலத்தில் தெய்வீகப் பெயர் YHWH இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் நடை. மேற்கோளின் இரண்டாம் நபர் ஒருமை ‘உன்’ எனக் காக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
