  source_fidelity: ‘எலியா ... அனுப்பப்படவில்லை’ accurately renders the unnamed-agent passive ἐπέμφθη. ‘அவர்களில் எவரிடமும்’ preserves πρὸς οὐδεμίαν αὐτῶν, and ‘...விதவையிடம் மட்டுமே’ correctly expresses the exceptive εἰ μὴ. ‘சீதோன் பகுதியிலுள்ள சரெப்தா’ conveys the geographical association expressed by τῆς Σιδωνίας without asserting an unwarranted political precision.
