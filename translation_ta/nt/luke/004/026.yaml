  terminology: ‘எலியா’ and ‘விதவை’ are established, suitable biblical Tamil terms. Retaining ‘சரெப்தா’ reflects the Greek form, while the footnote responsibly supplies the traditional Old Testament identification ‘சாறிபாத்.’
