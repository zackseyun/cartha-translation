id: LUK.4.26
reference: Luke 4:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: ta
  text: எலியா அவர்களில் எவரிடமும் அனுப்பப்படவில்லை; சீதோன் பகுதியிலுள்ள சரெப்தாவில்[a] இருந்த ஒரு விதவையிடம் மட்டுமே அனுப்பப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘சீதோனியாவின் சரெப்தா’; இது 1 இராஜாக்கள் 17:9-இல் வரும் பழைய ஏற்பாட்டு இடமான சாறிபாத் என்று மரபாக அடையாளம் காணப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: அனுப்பப்பட்டார்
  rationale: பெயரிடப்படாத செய்பவரைக் கொண்ட கிரேக்கச் செயப்பாட்டு வடிவத்தை அப்படியே காக்கிறது; அனுப்பியவர் கடவுள் என்று உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: அவர்களில் எவரிடமும் ... இல்லை
  rationale: οὐδεμίαν தரும் முழுமையான விலக்கை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: இங்கு நிபந்தனையைக் காட்டாமல் விதிவிலக்கைச் சுட்டும் தொடராக இருப்பதால், ‘ஒரு விதவையிடம் மட்டுமே’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: Σάρεπτα
  choice: சரெப்தா
  rationale: SBLGNT-இன் கிரேக்க இடப்பெயர் வடிவத்தைத் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது; பழைய ஏற்பாட்டின் சாறிபாத் என்ற மரபுவழி அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῆς Σιδωνίας
  choice: சீதோன் பகுதியிலுள்ள
  rationale: இடப்பெயரை சீதோனுடன் இணைக்கும் கிரேக்கப் பிறப்புவேற்றுமையை, புவியியல் தொடர்பு தெளிவாகும் இயல்பான தமிழில் தருகிறது.
- source_word: γυναῖκα χήραν
  choice: ஒரு விதவை
  rationale: ‘ஒரு பெண், ஒரு விதவை’ என்ற appositional கிரேக்கச் சொல்லாக்கத்தின் பொருளை இழக்காமல் தமிழில் இயல்பாகச் சுருக்குகிறது.
theological_decisions:
- issue: எலியாவை அனுப்பியவர் யார் என்பது
  choice: செய்பவரைப் பெயரிடாமல் ‘அனுப்பப்பட்டார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுள் எலியாவை அனுப்பினார்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: சூழலில் கடவுளின் செயல் மறைமுகமாகப் புரிந்தாலும், கிரேக்க உரை அனுப்பியவரைப் பெயரிடவில்லை. ஆகவே அந்த உரைசார் கட்டுப்பாடும் மறைமுகத் தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, dignified தமிழில் அமைந்துள்ளது. ‘அவர்களில் எவரிடமும் ... ஒரு விதவையிடம் மட்டுமே’ என்ற அமைப்பு கிரேக்கத்தின் விலக்கையும் எதிர்மறை வலியுறுத்தலையும் இயல்பாகக் காக்கிறது.
