  - severity: low
    issue: Unnecessary emphasis in ‘இதற்காகவே.’
    rationale: ἐπὶ τοῦτο means ‘for this/for this purpose’; the particle ‘-வே’ adds emphasis not explicitly present in the SBLGNT text. ‘இதற்காக’ preserves the purpose sense without strengthening it.
