reference: Luke 4:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “நான் மற்ற நகரங்களிலும் கடவுளின் அரசைப் பற்றிய நற்செய்தியை அறிவிக்க வேண்டும்[a]; ஏனெனில் இதற்காக நான் அனுப்பப்பட்டேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்தியைப் பிரசங்கிக்க.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த நோக்கத்திற்காக நான் அனுப்பப்பட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: ஆனால் அவர் அவர்களிடம் ... என்றார்
  rationale: δέ இங்கு முந்தைய சூழலுடன் மென்மையான முரண்பாட்டைக் காட்டுகிறது; இயல்பான தமிழ் நேரடி உரை அமைப்புக்கேற்ப ‘என்றார்’ இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: மற்ற நகரங்களிலும்
  rationale: καί-யின் சேர்க்கைப் பொருளை ‘-உம்’ வெளிப்படுத்துகிறது; ἑτέραις தற்போதைய இடத்தைத் தவிர மற்ற இடங்களைக் குறிக்கிறது, πόλεσιν என்பதற்கு நேரான பொருள் ‘நகரங்கள்’.
- source_word: εὐαγγελίσασθαί
  choice: நற்செய்தியை அறிவிக்க
  rationale: εὐαγγελίζω என்பது நற்செய்தியைக் கொண்டுவருதல் அல்லது அறிவித்தல். ‘அறிவிக்க’ என்பது திருச்சபை சார்ந்த சிறப்புச் சொல்லாட்சியைத் திணிக்காமல் அதன் பிரகடன வலிமையைத் தக்கவைக்கிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: இது வலுவான அவசியத்தை, லூக்காவின் சூழலில் பணி சார்ந்த அல்லது இறை அவசியத்தையும் உணர்த்தக்கூடிய வகையில் இயல்பாகக் காட்டுகிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளின் அரசைக் குறித்த
  rationale: βασιλεία என்பது ஆட்சி அல்லது அரசைக் குறிக்கக்கூடிய மைய இறையியல் சொல். ‘அரசு’ அதன் பொருள் பரப்பை முற்றிலும் ‘ஆளுகை’ என மட்டும் சுருக்காமல் தக்கவைக்கிறது; εὐαγγελίζω என்பதோடு இயல்பான தமிழுக்காக ‘குறித்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐπὶ τοῦτο
  choice: இதற்காகவே
  rationale: இச்சொற்றொடரின் நோக்கப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; ‘-வே’ குறிப்பிட்ட இந்த நோக்கத்தையே வலியுறுத்துகிறது.
- source_word: ἀπεστάλην
  choice: நான் அனுப்பப்பட்டேன்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் பணி அனுப்புதலின் கருத்தையும் தக்கவைக்கிறது; அனுப்பியவர் யார் என்பதை மூலவசனம் வெளிப்படையாகச் சொல்லாததால் மொழிபெயர்ப்பும் அதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் பணியின் அவசியம்
  choice: ‘நான் ... அறிவிக்க வேண்டும்’ என்று வலுவான பணி அவசியத்தைப் பாதுகாத்தல்
  alternative: ‘நான் அறிவிப்பது அவசியம்’
  rationale: δεῖ லூக்காவில் இறை அவசியத்தையும் உணர்த்தலாம்; ஆனால் அதை விளக்கவுரையாக விரிவாக்காமல் ‘வேண்டும்’ மூலம் அதன் வலிமை பாதுகாக்கப்படுகிறது.
- issue: ἀπεστάλην என்பதில் அனுப்பியவர்
  choice: ‘நான் அனுப்பப்பட்டேன்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘கடவுள் என்னை அனுப்பினார்’
  rationale: செயப்பாட்டு வடிவம் கடவுளை அனுப்பியவராக மறைமுகமாகச் சுட்டக்கூடும்; இருப்பினும் இவ்வசனத்தில் அனுப்பியவர் வெளிப்படையாகக் குறிப்பிடப்படாததால் அந்த இறையியல் உள்ளார்ந்த குறிப்பைத் தீர்மானித்து விரிவாக்கவில்லை.
- issue: βασιλεία τοῦ θεοῦ என்பதன் பொருள் பரப்பு
  choice: ‘கடவுளின் அரசு’
  alternative: ‘கடவுளின் ஆட்சி’
  rationale: ‘ஆட்சி’ இயக்கமுள்ள ஆளுகையைத் தெளிவாக்கும்; ‘அரசு’ ஆளுகை மற்றும் அரசுத் தளம் ஆகிய இரு சாத்தியங்களையும் ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரசங்கிக்க’ என்பதைக் காட்டிலும் பரவலாகப் புரியும் ‘அறிவிக்க’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது. ஆங்கில ஆலோசனை உரையிலிருந்த அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பு சரியான இடங்களில் வைக்கப்பட்டுள்ளன.
