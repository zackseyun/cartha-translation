id: LUK.4.5
reference: Luke 4:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: ta
  text: பின்னர் அவனை மேலே கொண்டு சென்று, மக்கள் வாழும் உலகத்தின்[b] எல்லா ராஜ்யங்களையும் ஒரு கணப்பொழுதில்[a] அவனுக்குக் காட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே நொடியில்.’
    reason: lexical_alternative
  - marker: b
    text: ‘மக்கள் வாழும் உலகம்’ என்பதற்கான கிரேக்கச் சொல் சில சூழல்களில் நாகரிக உலகையோ பேரரசின் பரப்பையோ குறிப்பாகக் குறிக்கலாம்; பொதுவாக ‘உலகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: அவனை மேலே அழைத்துச் சென்று
  rationale: ἀνάγω என்பதன் மேல்நோக்கிய இயக்கத்தையும், முதன்மை வினைக்கு முந்திய பங்கேற்புவினைத் தொடரையும் இயல்பான தமிழில் காக்கிறது; லூக்கா இங்கு குறிப்பிடாத ‘மலை’ என்ற இடத்தைச் சேர்க்கவில்லை.
- source_word: ἔδειξεν
  choice: அவனுக்குக் காட்டினான்
  rationale: δείκνυμι என்பதன் இயல்பான கதைநடைப் பொருள் ‘காட்டு’; செய்பவர் முந்தைய சூழலில் தெளிவாக இருப்பதால் தமிழில் இயல்பாக மறை எழுவாயுடன் தரப்பட்டுள்ளது.
- source_word: πάσας τὰς βασιλείας
  choice: எல்லா அரசுகளையும்
  rationale: இங்கு βασιλεία என்பது ஆட்சித்தன்மை என்ற கருத்தைக் காட்டிலும் ஆளப்படும் அரசுகள் அல்லது ராஜ்யங்களைக் குறிக்கிறது. ‘அரசுகள்’ என்பது நவீன வாசகருக்குத் தெளிவான, இயல்பான பன்மை.
- source_word: τῆς οἰκουμένης
  choice: குடியிருக்கும் உலகத்தின்
  rationale: οἰκουμένη என்பதிலுள்ள ‘மக்கள் குடியிருக்கும் உலகம்’ என்ற சொற்பொருள் தனித்தன்மையைப் பாதுகாக்கிறது; அதை ‘ரோமப் பேரரசு’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἐν στιγμῇ χρόνου
  choice: ஒரு கணப்பொழுதில்
  rationale: στιγμή குறிக்கும் மிகச் சிறிய காலப்புள்ளியை இயல்பான நவீன தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசுகள் காட்டப்பட்ட விதம்
  choice: அவற்றைக் காட்டினான் என்று மட்டும் விவரித்து, அது தரிசனமா, அற்புத நிகழ்வா, அல்லது ஓர் உயரமான இடத்திலிருந்து காணப்பட்டதா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: அதை ஒரு தரிசனக் காட்சியாகவோ, உயரமான இடத்திலிருந்து நேரடியாகக் கண்ட காட்சியாகவோ வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க மூலவாக்கியம் காட்டப்பட்ட நிகழ்வை மட்டும் கூறுகிறது; அதன் செயல்முறையை விளக்கவில்லை. ஆகவே மூலத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை. ‘மேலே’ என்பதன் மூலம் மூலத்தின் உயர்நோக்கிய இயக்கம் காக்கப்பட்டுள்ளது; ‘மலை’ சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறிகள் தத்தம் சொல்லோட்டத்துடன் இணைக்கப்பட்டுள்ளன.
