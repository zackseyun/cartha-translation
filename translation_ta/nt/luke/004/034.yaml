  to: “ஆ!”[a] எங்களுக்கும் உமக்கும் என்ன சம்பந்தம்?[b] நாசரேத்து இயேசுவே,[c] எங்களை அழிக்க வந்தீரா? நீர் யார் என்று எனக்குத் தெரியும்—நீர் கடவுளின் பரிசுத்தர்.[d][e]
