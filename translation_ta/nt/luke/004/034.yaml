id: LUK.4.34
reference: Luke 4:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: ta
  text: “ஆ!”[a] எங்களுக்கும் உமக்கும் என்ன சம்பந்தம்?[b] நாசரேத்து இயேசுவே,[c] எங்களை அழிக்க வந்தீரா? நீர் யார் என்று எனக்குத் தெரியும்—நீர் கடவுளின் பரிசுத்தர்.[d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க இடைச்சொல் Ἔα திடீர் அச்சத்தையோ எதிர்ப்பையோ வெளிப்படுத்தும் கூக்குரல். சில மொழிபெயர்ப்புகள் இதன் பொருளை விரித்துக் “எங்களை விட்டுவிடுங்கள்!” எனத் தருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “எங்களுக்கு என்ன, உமக்கு என்ன?” இது விலகலையோ பகைமையான எதிர்ப்பையோ தெரிவிக்கும் செமித்திய வழக்குச் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “நாசரேயனாகிய இயேசுவே.”
    reason: lexical_alternative
  - marker: d
    text: “எங்களை” என்ற பன்மை யாரைக் குறிக்கிறது என்பதை கிரேக்க உரை குறிப்பிடவில்லை; பேசும் பிசாசு தன்னைப் பிரதிநிதித்துவமாகப் பன்மையில் குறிப்பிடுவதாகவோ, அல்லது பிசாசுலகத்தைப் பரந்தவகையில் குறித்ததாகவோ இருக்கலாம்.
    reason: alternative_reading
  - marker: e
    text: அல்லது, “கடவுளுடைய பரிசுத்தர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: ஆ!
  rationale: அச்சம் அல்லது எதிர்ப்பை வெளிப்படுத்தும் திடீர் கூக்குரலை இயல்பான தமிழில் சுருக்கமாகப் பாதுகாக்கிறது; ‘எங்களை விட்டுவிடும்’ என்ற விளக்கத்தை மூலச்சொல்லுக்குள் சேர்க்கவில்லை.
- source_word: τί ἡμῖν καὶ σοί
  choice: எங்களுக்கும் உமக்கும் என்ன சம்பந்தம்?
  rationale: சொல்லுக்குச் சொல் ‘எங்களுக்கு என்ன, உமக்கு என்ன?’ என்ற செமித்திய வழக்குச் சொற்றொடர் விலகலையோ எதிர்ப்பையோ குறிக்கிறது. அதன் மோதல் தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: நாசரேத்து இயேசுவே
  rationale: அழைப்புவேற்றுமையையும் நாசரேத்துடன் இயேசுவுக்குள்ள தொடர்பையும் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: எங்களை அழிக்க வந்தீரா?
  rationale: நிகழ்ந்த வருகையின் தற்போதைய நோக்கத்தைத் தமிழில் நேரடியாகக் கேட்கும் இயல்பான அமைப்பு; ἀπολέσαι என்பதின் அழிவுக் கருத்தைப் பாதுகாக்கிறது.
- source_word: οἶδά σε τίς εἶ
  choice: நீர் யார் என்று எனக்குத் தெரியும்
  rationale: பேசுபவன் இயேசுவின் அடையாளத்தை அறிந்திருப்பதாகக் கூறுவதை அலங்காரமின்றி நேரடியாகத் தருகிறது.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: கடவுளின் பரிசுத்தர்
  rationale: கிரேக்கச் சொற்றொடரின் பட்டப்பெயர் தன்மையையும் கடவுளுடனான உறவையும் பாதுகாக்கும் சுருக்கமான, மரியாதைக்குரிய தமிழ் வடிவம்.
theological_decisions:
- issue: பிசாசின் பேச்சிலுள்ள ἡμᾶς என்ற பன்மை
  choice: ‘எங்களை’ என்று மட்டும் வைத்து அதன் குறிப்பு யாரென்று தீர்மானிக்காமல் விடப்பட்டது.
  alternative: பிசாசையும் பிடிக்கப்பட்ட மனிதனையும் குறிக்கிறது; அல்லது பிசாசுகளின் உலகத்தையே பிரதிநிதித்துவப்படுத்துகிறது என்று வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்கம் முதலாம் நபர் பன்மையைப் பயன்படுத்தினாலும், அது யாரையெல்லாம் உள்ளடக்குகிறது என்பதை வசனம் குறிப்பிடவில்லை. ஆகவே மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: ὁ ἅγιος τοῦ θεοῦ என்ற கிறிஸ்துவியல் பட்டப்பெயர்
  choice: ‘கடவுளின் பரிசுத்தர்’ என்று doctrinal expansion இன்றி மொழிபெயர்க்கப்பட்டது.
  alternative: மேசியா அல்லது கடவுளால் அர்ப்பணிக்கப்பட்டவர் என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இது முக்கியமான அடையாளப் பட்டப்பெயராக இருந்தாலும், அதன் முழு இறையியல் பொருளை இவ்வசனம் விளக்கவில்லை; எனவே பட்டப்பெயர் அப்படியே பாதுகாக்கப்படுகிறது.
- issue: τί ἡμῖν καὶ σοί என்ற எதிர்ப்புச் சொற்றொடர்
  choice: ‘எங்களுக்கும் உமக்கும் என்ன சம்பந்தம்?’
  alternative: ‘எங்களை விட்டுவிடும்!’ என்று பொருளை வெளிப்படையாக விரித்தல்.
  rationale: சூழலில் விலகல் அல்லது பகைமையான எதிர்ப்பு தெளிவாக இருந்தாலும், கட்டளை வடிவம் மூலத்தில் இல்லை; ஆகவே அதைச் சேர்க்காமல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய பேச்சில் ‘நீர்/உமக்கு/வந்தீர்’ என்ற மரியாதை ஒருமை வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள திடீர் கூக்குரல், பகைமையான விலகல், பன்மையின் தெளிவின்மை, கிறிஸ்துவியல் பட்டப்பெயரின் செறிவு ஆகியவை விளக்கமாகத் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
