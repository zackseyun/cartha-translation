source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: ta
  text: அவர்கள் எழுந்து, அவரை ஊருக்கு வெளியே துரத்தி, தங்கள் ஊர் கட்டப்பட்டிருந்த மலையின் விளிம்புவரை அவரைக் கொண்டுபோனார்கள்; அவரைக் கீழே தள்ளிவிடும் நோக்கத்தில்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: எழுந்து
  rationale: இறந்தகால வினையெச்சம் கூட்டத்தினர் உடனடியாகச் செயல்பட எழுந்ததைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐξέβαλον
  choice: வெளியே துரத்தி
  rationale: வலுக்கட்டாயமாக வெளியேற்றுதல் என்ற பகைமையான சூழலை உணர்த்துகிறது; சமயச் சிறப்புப் பொருள் ஏற்படக்கூடிய சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: πόλεως
  choice: ஊர்
  rationale: πόλις என்பதன் பொதுவான குடியிருப்புப் பொருளையும் நாசரேத்தின் சூழலையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἤγαγον
  choice: கொண்டுபோனார்கள்
  rationale: ἄγω என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘இழுத்துச் சென்றார்கள்’ என்ற கூடுதல் வன்முறையைச் சேர்க்கவில்லை.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: மலையின் விளிம்புவரை
  rationale: ὀφρύς என்பதன் உருவகமான ‘புருவம்’ என்பதைத் தமிழில் நேரடியாகக் கூறாமல், உயரத்தின் ஓரம் அல்லது விளிம்பு என்ற இடவியல் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: தங்கள் ஊர் கட்டப்பட்டிருந்த
  rationale: இறந்தகால நிறைவு நிலையையும் செயப்பாட்டு வடிவையும் இயல்பாகக் காட்டி, αὐτῶν குறிக்கும் உள்ளூர் உரிமை அல்லது சேர்ந்திருத்தலை ‘தங்கள்’ எனப் பாதுகாக்கிறது.
- source_word: ὥστε
  choice: தள்ளிவிடவே இப்படிச் செய்தார்கள்
  rationale: இங்கு வினையெச்சத்துடன் வரும் ὥστε கூட்டத்தினரின் நோக்கத்தைக் குறிக்கிறது; தமிழில் இயல்பான நோக்கத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: κατακρημνίσαι
  choice: கீழே தள்ளிவிட
  rationale: உயரத்திலிருந்து தலைகுப்புறத் தள்ளும் செயலைச் சூழலோடு தெளிவாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘குன்றுச்சரிவு’ போன்ற பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: கூட்டத்தின் வன்முறையும் கொலை நோக்கமும் எவ்வளவு வெளிப்படையாகக் கூறப்பட வேண்டும்
  choice: அவரை வலுக்கட்டாயமாக ஊருக்கு வெளியேற்றியதையும் உயரத்திலிருந்து கீழே தள்ளும் நோக்கத்தையும் செயல்களின் வரிசையால் காட்டுதல்
  alternative: ‘அவரைக் கொலைசெய்ய முயன்றார்கள்’ என்று விளக்கமாகக் கூறுதல் அல்லது ‘இழுத்துச் சென்றார்கள்’ போன்ற மேலும் வலுவான சொல்லைப் பயன்படுத்துதல்
  rationale: வசனம் உயிர்க்கொல்லும் நோக்கத்தைத் தெளிவாக உணர்த்தினாலும், மொழிபெயர்ப்பு மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் அந்த நோக்கம் செயல்களின் வரிசையிலிருந்து வெளிப்பட அனுமதிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஊர்’, ‘மலையின் விளிம்பு’, ‘கீழே தள்ளிவிட’ ஆகியவை இயல்பான தமிழையும் கிரேக்க மூலத்தின் துல்லியத்தையும் சமநிலைப்படுத்துகின்றன.
