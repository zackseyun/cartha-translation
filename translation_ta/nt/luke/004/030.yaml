  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: ta
  text: ஆனால், அவர் அவர்கள் நடுவே கடந்து சென்று, தம் வழியில் தொடர்ந்து சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய மத்தியினூடாக.” இயேசு கூட்டத்தினூடே சென்றதை கிரேக்க உரை விவரிக்கிறது; இது எப்படி நிகழ்ந்தது என்பதை அது கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: அவர்
  rationale: வெளிப்படையாக உள்ள சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது. தமிழில் மரியாதை ஒருமையான ‘அவர்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ‘அவரோ’ என அதிக அழுத்தம் கொடுப்பது இங்கு தேவையில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூட்டத்தார் கொண்டிருந்த கொலை நோக்கத்திற்கும் இயேசு பாதிப்பின்றிச் சென்றதற்கும் இடையிலான மென்மையான முரண்பாட்டை இது வெளிப்படுத்துகிறது.
- source_word: διελθὼν
  choice: கடந்து சென்று
  rationale: διέρχομαι என்பதன் இறந்தகால வினையெச்சம் ஓர் இடத்தின் ஊடாக நகர்வதைக் குறிக்கிறது. ‘கடந்து சென்று’ என்பது பிரதான வினைக்கு முந்திய செயலை இயல்பான தமிழில் தருகிறது.
- source_word: διὰ μέσου αὐτῶν
  choice: அவர்களின் நடுவே
  rationale: அந்தக் குழுவின் மத்தியினூடாக அவர் நகர்ந்தார் என்ற இடவெளிச் சித்திரத்தைத் தெளிவாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: ἐπορεύετο
  choice: தம் வழியே போய்க்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் தொடர்ந்து நடந்த நகர்வைச் சுட்டுகிறது. ‘போய்க்கொண்டிருந்தார்’ அந்த நீடித்த அம்சத்தைக் காக்கிறது; ‘தம் வழியே’ அவர் அங்கிருந்து தொடர்ந்து சென்றதை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: இந்தத் தப்பிச் செல்லுதல் அற்புதமானது என்று மொழிபெயர்ப்பு வெளிப்படையாகக் கூற வேண்டுமா?
  choice: எப்படி நிகழ்ந்தது என்று விளக்காமல், அவர் கூட்டத்தின் நடுவே கடந்து சென்றதாக மட்டும் கூறுதல்
  alternative: ‘அற்புதமாக அவர்களிடமிருந்து தப்பிச் சென்றார்’ போன்ற அற்புதத்தை வெளிப்படையாகக் கூறும் வாசகம்
  rationale: கிரேக்க உரை இயேசு கூட்டத்தின் நடுவே நகர்ந்து சென்றதை விவரிக்கிறது; அது எப்படி நிகழ்ந்தது என்பதைச் சொல்லவில்லை. ஆகவே உரையில் இல்லாத அற்புத விளக்கத்தைச் சேர்க்காமல், வாசகர் சூழலிலிருந்து அதன் முக்கியத்துவத்தை உணர இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அவர்களின் நடுவே’ என்பது தெளிவான இடவெளிப் பொருளைக் காக்கிறது; ‘போய்க்கொண்டிருந்தார்’ மூலத்தின் தொடர்நிலை அம்சத்தை வெளிப்படுத்துகிறது.
