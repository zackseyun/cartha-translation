source:
  edition: SBLGNT
  text: καὶ ⸀ὅτι Ἐπὶ χειρῶν ἀροῦσίν σε μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: ta
  text: மேலும், “அவர்கள் தங்கள் கைகளில் உன்னைத் தாங்கிக்கொள்வார்கள்[a]; உன் கால் கல்லில் மோதிவிடாதபடி[b]” என்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை ஏந்திக்கொள்வார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் கால் கல்லில் இடறிவிடாதபடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτι
  choice: மேலும் … என்றும்
  rationale: καὶ முந்தைய வசனத்திலுள்ள மேற்கோளைத் தொடர்கிறது; ὅτι மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. இயல்பான தமிழில் இவ்விரண்டின் தொடர்பும் ‘மேலும் … என்றும்’ என்ற அமைப்பால் வெளிப்படுகிறது.
- source_word: Ἐπὶ χειρῶν
  choice: தங்கள் கைகளில்
  rationale: தேவதூதர்கள் தங்கள் கைகளால் தாங்கும் பாதுகாப்புப் படிமத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἀροῦσίν σε
  choice: உன்னைத் தாங்கிக்கொள்வார்கள்
  rationale: αἴρω இங்கு தூக்கித் தாங்குதல் அல்லது சுமந்து செல்லுதல் என்ற பொருளைக் கொண்டது. ‘தாங்கிக்கொள்வார்கள்’ என்பது பாதுகாப்பின் படிமத்தையும் எதிர்கால வினையையும் இயல்பான தமிழில் தருகிறது.
- source_word: μήποτε
  choice: மோதிவிடாதபடி
  rationale: எதிர்மறையான நோக்கம் அல்லது தவிர்க்கப்படும் விளைவைத் தெரிவிக்கும் μήποτε-யின் பொருளை ‘-விடாதபடி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προσκόψῃς πρὸς λίθον
  choice: கல்லில் மோதிவிடாதபடி
  rationale: προσκόπτω மற்றும் πρός இணைந்து கால் ஒரு கல்லுடன் மோதுவதைக் குறிக்கின்றன. ‘கல்லில் மோதுதல்’ நவீன தமிழில் நேரடியான, தெளிவான சொல்லாக்கம்.
- source_word: τὸν πόδα σου
  choice: உன் கால்
  rationale: கிரேக்க மூலத்தின் ஒருமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளிலுள்ள தேவதூதர்களின் பாதுகாப்புப் படிமத்தை வாசிக்க எளிய நவீன தமிழில் வழங்குதல்
  choice: ‘உன்னைத் தாங்கிக்கொள்வார்கள்’
  alternative: ‘உன்னை ஏந்திக்கொள்வார்கள்’
  rationale: இரண்டும் மூலத்தின் பொருளுக்குச் சாத்தியமானவை. ‘தாங்கிக்கொள்வார்கள்’ என்பது இயல்பான நவீன தமிழில் பாதுகாப்பின் கருத்தைத் தெளிவாகக் கொடுக்கிறது; குறிப்பிட்ட சமயக்கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் வேதாகம மேற்கோளுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் வாக்கியத்தையும் மேற்கோளையும் தொடர்வதால், கிரேக்கத்தின் துண்டு அமைப்பு ‘மேலும் … என்றும்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
