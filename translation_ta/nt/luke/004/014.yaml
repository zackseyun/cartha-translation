id: LUK.4.14
reference: Luke 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: ta
  text: இயேசு ஆவியானவரின் வல்லமையோடு கலிலேயாவுக்குத் திரும்பினார். அவரைப் பற்றிய செய்தி[a] சுற்றுப்புறம் முழுவதும் பரவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “புகழ்,” “தகவல்,” “வதந்தி.” கிரேக்கச் சொல் பரவலாகச் செல்லும் ஒரு செய்தியைக் குறிக்கலாம்; அது நல்லதா கெட்டதா என்பதைத் தனியாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: திரும்பினார்
  rationale: கதைப்போக்கில் முந்தைய இடத்திற்குத் திரும்பிச் செல்வதைக் குறிக்கும் வினை; இயல்பான நவீனத் தமிழ்.
- source_word: ἐν τῇ δυνάμει
  choice: வல்லமையோடு
  rationale: இயேசுவின் திரும்புதலுக்குரிய நிலை அல்லது முறையை இயல்பாகத் தெரிவிக்கிறது; வெறும் கருவிப் பொருளாக மட்டும் சுருக்கவில்லை.
- source_word: τοῦ πνεύματος
  choice: ஆவியானவரின்
  rationale: லூக்கா 4-ன் உடனடிச் சூழலில் இது பரிசுத்த ஆவியானவரைக் குறிக்கிறது. மூலத்தில் இவ்வசனத்தில் ‘பரிசுத்த’ என்பது இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: பயணத்தின் இலக்கைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: φήμη
  choice: செய்தி
  rationale: ஒருவரைப் பற்றிப் பரவலாகச் செல்லும் தகவலைக் குறிக்கிறது; நேர்மறையான ‘புகழ்’ அல்லது எதிர்மறையான ‘வதந்தி’ என்று தேவையின்றித் தீர்மானிக்கவில்லை.
- source_word: ἐξῆλθεν
  choice: பரவியது
  rationale: செய்தி வெளியே செல்வதைக் குறிக்கும் கிரேக்க உருவகத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: சுற்றுப்புறம் முழுவதும்
  rationale: சுற்றியுள்ள மாவட்டம் அல்லது பகுதி முழுவதையும் குறிக்கும் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றிய
  rationale: περί என்பதன் தொடர்புப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: πνεύματος என்பதன் குறிப்பு
  choice: ஆவியானவர், அதாவது பரிசுத்த ஆவியானவர்
  alternative: குறிப்பிடப்படாத ஓர் ஆவி
  rationale: லூக்கா 4-ன் முந்தைய வசனங்களில் பரிசுத்த ஆவியானவர் இயேசுவின் சோதனையிலும் ஊழியத் தொடக்கத்திலும் தெளிவாக இடம்பெறுகிறார். ‘ஆவியானவர்’ என்பது சூழலிலுள்ள குறிப்பைத் தெளிவாக வைத்துக்கொண்டு, மூலத்தில் இங்கு இல்லாத ‘பரிசுத்த’ என்ற சொல்லைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை. ‘ஆவியானவர்’ என்ற ஆளுமைச் சொல் தமிழ் வேதாகம நடைக்கு ஏற்றதாகவும் சூழலின் குறிப்பைத் தெளிவாக்குவதாகவும் உள்ளது. இரண்டாம் வாக்கியத்தில் இயல்பான தமிழுக்காக வினைமுற்று ‘பரவியது’ பயன்படுத்தப்பட்டுள்ளது.
