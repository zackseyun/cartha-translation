  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν πάντες θυμοῦ ἐν τῇ συναγωγῇ ἀκούοντες ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: ta
  text: இவற்றைக் கேட்டபோது, ஜெபக்கூடத்தில் இருந்த அனைவரும் கடும் கோபத்தால் நிறைந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆத்திரத்தால் நிறைந்தார்கள்.’ θυμός என்ற கிரேக்கச் சொல் கடுமையான கோபத்தையோ ஆத்திரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: நிறைந்தார்கள்
  rationale: πίμπλημι என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம், ஏதோ ஒன்றால் நிரம்பிய நிலையை இயல்பாகக் குறிக்கிறது. தமிழில் ‘கோபத்தால் நிறைந்தார்கள்’ என்பது மூலத்தின் உருவகத்தையும் செயப்பாட்டுப் பொருளையும் இயன்றவரை காக்கிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: ஜெபக்கூடத்தில் இருந்த மக்கள் அனைவரையும் கூட்டாகக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: θυμοῦ
  choice: கடும் கோபத்தால்
  rationale: θυμός இங்கு தீவிரமான கோபத்தைக் குறிக்கிறது. ‘கடும் கோபம்’ அதன் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது; இன்னும் தீவிரமான ‘ஆத்திரம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῇ συναγωγῇ
  choice: ஜெபக்கூடத்தில் இருந்த
  rationale: மக்கள் ஜெபக்கூடத்திற்குள் இருந்த சூழலைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: ἀκούοντες
  choice: கேட்டபோது
  rationale: நிகழ்காலப் பெயரெச்சம் பிரதான வினையுடன் ஒரே காலத்தில் நடந்ததையும், கோபம் எழுந்த சந்தர்ப்பத்தையும் காட்டுகிறது; ‘கேட்டபோது’ இதை இயல்பாகத் தருகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: இயேசு முன்பு கூறியவற்றைச் சுட்டும் பன்மைச் சுட்டுப்பெயரின் பரந்த பொருளைக் காக்கிறது; ‘இந்த வார்த்தைகளை’ என்று தேவையின்றி குறிப்பாக்கவில்லை.
