translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபக்கூடம்’ என்பது συναγωγή என்பதற்குப் பரவலாக அறியப்பட்ட வேதாகமச் சொல். மூலத்தின் ‘நிறைந்தார்கள்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது.
