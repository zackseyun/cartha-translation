id: LUK.4.3
reference: Luke 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: ta
  text: அப்போது பிசாசு அவரிடம்[a], “நீர் இறைவனுடைய மகனாக இருந்தால், இந்தக் கல்லிடம் அப்பமாக மாறும்படி சொல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் இறைவனுடைய மகனாக இருப்பதால்.” கிரேக்க நிபந்தனைத் தொடர், சவாலின் பொருட்டு இந்த முன்னுரையை உண்மையென ஏற்றுக்கொள்வதாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் முதன்மை உரை நிபந்தனை வடிவத்தைப் பேணுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: அப்போது
  rationale: இது மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; நவீன தமிழில் நிகழ்வின் முன்னேற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διάβολος
  choice: பிசாசு
  rationale: இச்சூழலில் இது சாத்தானைக் குறிக்கும் வழக்கமான தனிப்பட்ட அடையாளப் பெயர்; ‘பிசாசு’ என்பது தெளிவான, நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: Εἰ
  choice: …ஆக இருந்தால்
  rationale: கிரேக்க நிபந்தனை வடிவத்தை நேரடியாகப் பேணுகிறது; சவாலின் உட்பொருளை ‘ஏனெனில்’ என்று தீர்மானித்து விடவில்லை.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: இறைவனுடைய மகன்
  rationale: இச்சூழலில் இது வரையறையற்ற ‘ஒரு மகன்’ அல்ல, இயேசுவின் தனித்துவமான உறவையும் அடையாளத்தையும் குறிக்கிறது. இயல்பான தமிழ் வாக்கியத்தில் ‘மகனாக’ என வேற்றுமை உருபு பெறுகிறது.
- source_word: εἰπὲ
  choice: சொல்வீராக
  rationale: கல்லை நோக்கிக் கூறப்படும் கட்டளையான பேச்சுச் செயலைப் பேணுகிறது; ‘கட்டளையிடும்’ என்பது மூல வினையைவிட வலுவான விளக்கமாகிவிடும்.
- source_word: τῷ λίθῳ τούτῳ
  choice: இந்தக் கல்
  rationale: λίθος என்பதற்கு ‘கல்’ என்பது இயல்பான பொருத்தம்; சுட்டுப்பெயரடையும் பேணப்பட்டுள்ளது.
- source_word: ἵνα γένηται
  choice: மாறும்படி
  rationale: பேசுதல் சார்ந்த கட்டளையின் உள்ளடக்கத்தை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; ஆகுதல்/மாறுதல் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: ἄρτος
  choice: அப்பம்
  rationale: ἄρτος என்பதன் நேரடியான பொருள்; ‘உணவு’ என்பது மிகப் பரந்தது, ‘ஒரு அப்பத் துண்டு’ என்பது தேவையற்ற குறிப்பாக்கம்.
theological_decisions:
- issue: εἰ υἱὸς εἶ τοῦ θεοῦ என்ற நிபந்தனைத் தொடரின் வலிமை
  choice: நீர் இறைவனுடைய மகனாக இருந்தால்
  alternative: நீர் இறைவனுடைய மகனாக இருப்பதால்
  rationale: முதன்மை உரை நிபந்தனை வடிவத்தையும் சோதனைக் காட்சியின் இறையியல் பதற்றத்தையும் பேணுகிறது; அதே நேரத்தில், கிரேக்க நிபந்தனை சவாலுக்காக முன்னுரையை ஏற்றுக்கொள்வதாகவும் புரிந்துகொள்ளப்படலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மை (‘நீர்’, ‘சொல்வீராக’) பயன்படுத்தப்பட்டாலும், பிசாசின் சவால் மென்மையாக்கப்படவில்லை. ‘இறைவன்’ மற்றும் ‘அப்பம்’ ஆகியவை தெளிவும் வழக்குமுள்ள சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
