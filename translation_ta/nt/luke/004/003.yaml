- from: அப்போது பிசாசு அவரிடம்[a], “நீர் இறைவனுடைய மகனாக இருந்தால், இந்தக் கல் அப்பமாக மாறும்படி சொல்வீராக” என்றான்.
  to: அப்போது பிசாசு அவரிடம்[a], “நீர் இறைவனுடைய மகனாக இருந்தால், இந்தக் கல்லிடம் அப்பமாக மாறும்படி சொல்லுங்கள்” என்றான்.
  rationale: The revision explicitly marks the stone as the addressee of Jesus’ speech, corresponding to the Greek dative τῷ λίθῳ τούτῳ. It also uses a contemporary respectful imperative. All other wording and the conditional-force footnote are retained in substance.
