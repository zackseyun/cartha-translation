id: LUK.4.24
reference: Luke 4:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: ta
  text: 'அவர் கூறினார்: “உண்மையாகவே உங்களுக்குச் சொல்கிறேன், எந்த இறைவாக்கினரும் தமது சொந்த ஊரில்[a] ஏற்றுக்கொள்ளப்படுவதில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தமது சொந்த இடத்தில்,” “தமது சொந்தப் பகுதியில்,” அல்லது “தமது தாய்நாட்டில்.” கிரேக்கச் சொல் πατρίς ஒருவருடைய சொந்த ஊர், சொந்தப் பகுதி, அல்லது தாய்நாட்டைக் குறிக்கலாம்; இங்கு நாசரேத் சூழலுக்கு “சொந்த ஊர்” பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: அவர் மேலும் கூறினார்
  rationale: δέ என்பது இங்கு வலுவான முரண்பாட்டைக் காட்டாமல், முந்தைய உரையோடு இதை இணைக்கும் மென்மையான தொடர்ச்சிச் சொல். ‘மேலும்’ என்பது அந்த ஓட்டத்தை இயல்பாகக் காட்டுகிறது.
- source_word: Ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் கூற்றுக்கு முன் வரும் ἀμήν, உறுதியும் முக்கியத்துவமும் கொண்ட அறிமுகச் சொல்லாகும். ‘உண்மையாகவே’ அதன் வலியுறுத்தலை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியாகப் பன்மை கேட்போரிடம் உரையாடும் வழக்கமான சொற்றொடரின் பொருளையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: οὐδεὶς προφήτης
  choice: எந்த இறைவாக்கினரும்
  rationale: οὐδεὶς என்பதன் முழுமையான மறுப்பையும் προφήτης என்பதன் இறைச்செய்தியை அறிவிப்பவர் என்ற பொருளையும் இயல்பான தமிழ் அமைப்பில் தருகிறது.
- source_word: δεκτός
  choice: ஏற்றுக்கொள்ளப்படுவதில்லை
  rationale: இங்கு ஒருவர் சாதகமாக வரவேற்கப்பட்டு அங்கீகரிக்கப்படுதல் என்ற சமூகப் பொருள் உள்ளது. ‘ஏற்றுக்கொள்ளப்படுதல்’ அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: தமது சொந்த ஊரில்
  rationale: πατρίς என்பது சொந்த ஊர், பிறந்த பகுதி, அல்லது தாய்நாடு ஆகியவற்றைக் குறிக்கலாம். உடனடி நாசரேத் சூழலில் ‘சொந்த ஊர்’ மிகவும் இயல்பாகப் பொருந்துகிறது; மாற்றுப் பரப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
