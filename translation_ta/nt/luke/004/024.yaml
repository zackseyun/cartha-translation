translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்பது சமயப் பிரிவுக்கே உரிய சொல்லாட்சியைத் தவிர்த்து προφήτης என்பதன் பணியைத் தெளிவாகக் காட்டுகிறது. பொதுவான உண்மையை வெளிப்படுத்த ‘ஏற்றுக்கொள்ளப்படுவதில்லை’ என்ற நிகழ்கால வழக்குச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
