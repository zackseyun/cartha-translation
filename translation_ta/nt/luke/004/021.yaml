source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: ta
  text: 'பின்பு அவர் அவர்களிடம் சொல்லத் தொடங்கினார்: “இன்று இந்த வேதவாக்கு, நீங்கள் கேட்கும்போதே[a] நிறைவேறியுள்ளது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “உங்கள் செவிகளில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: பின்பு அவர் … சொல்லத் தொடங்கினார்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்ச்சியின் அடுத்த கட்டத்தைக் குறிக்கிறது; ἤρξατο உடன் வரும் λέγειν பேச்சைத் தொடங்கியதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πρὸς αὐτοὺς
  choice: அவர்களிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: Σήμερον
  choice: இன்று
  rationale: வாக்கியத்தின் தொடக்கத்தில் உள்ள கால வலியுறுத்தலையும் நிறைவேற்றத்தின் உடனடித் தன்மையையும் காக்கிறது.
- source_word: πεπλήρωται
  choice: நிறைவேறியுள்ளது
  rationale: நிறைவு பெற்ற செயலும் அதன் தற்போதைய விளைவும் தொடர்வதைக் காட்டும் கிரேக்க perfect passive வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ γραφὴ αὕτη
  choice: இந்த வேதவாக்கு
  rationale: சற்று முன் வாசிக்கப்பட்ட புனித நூல் பகுதியையே குறிக்கும் γραφή என்பதன் சூழல்சார் பொருளைச் சுருக்கமாகவும் மரியாதையுடனும் தருகிறது.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: நீங்கள் கேட்டுக்கொண்டிருக்கும்போதே
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் செவிகளில்’ என்றாலும், அவர்கள் அதைக் கேட்கும் நிகழ்விலேயே நிறைவேற்றம் அறிவிக்கப்படுகிறது என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: நிறைவேற்றக் கூற்றின் தன்மை
  choice: இந்த வேதவாக்கு இன்று நிறைவேறியுள்ளதாக மட்டும் மொழிபெயர்த்து, நிறைவேற்றம் யாரால் அல்லது எவ்வாறு நிகழ்ந்தது என்பதைச் சேர்க்கவில்லை.
  alternative: “இந்தத் தீர்க்கதரிசனம் இன்று என்னால் நிறைவேறியது” என்று விளக்கமாக விரிவுபடுத்துதல்.
  rationale: சூழல் இயேசுவை நிறைவேற்றத்துடன் தொடர்புபடுத்தினாலும், இவ்வசனத்தின் கிரேக்க உரையில் ‘என்னால்’ என்பதும் ‘தீர்க்கதரிசனம்’ என்பதும் நேரடியாக இல்லை. ஆகவே உரையின் வலிமையையும் திறந்துள்ள இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேதவாக்கு’ என்பது சற்று முன் வாசிக்கப்பட்ட வேதப்பகுதியைக் குறிக்கிறது; ‘நீங்கள் கேட்டுக்கொண்டிருக்கும்போதே’ என்பது கிரேக்க மரபுத்தொடரை இயல்பாக்குகிறது.
