base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: ta
  text: இயேசு பரிசுத்த ஆவியால் நிறைந்தவராய் யோர்தானிலிருந்து திரும்பினார்; அவர் ஆவியினால்[a] வனாந்தரத்தில் வழிநடத்தப்பட்டுக் கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவியில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரை இன்னும் நேரடியாக இவ்வாறு தரலாம்; ஆனால் இங்கு ஆவியே இயேசுவை வழிநடத்தினார் என்பதே பெரும்பாலும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால் நிறைந்தவராய்
  rationale: πλήρης என்பதுடன் வரும் உருபு, ஒன்றால் நிறைந்திருக்கும் நிலையை விவரிக்கிறது. இத்தமிழாக்கம் தற்காலிகமாக நிரப்பப்பட்ட நிகழ்வு என்று கூறாமல், இயேசுவின் நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπέστρεψεν
  choice: திரும்பினார்
  rationale: ὑποστρέφω என்பதன் இறந்தகால வடிவம் இங்கு ‘திரும்புதல்’ என்னும் நேரடியான பொருளைத் தருகிறது.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: யோர்தானிலிருந்து
  rationale: கிரேக்க உரை ஆற்றைக் குறிக்கும் விளக்கச் சொல்லைச் சேர்க்காமல் ‘யோர்தான்’ என்ற பெயரையே பயன்படுத்துகிறது; தமிழிலும் அது இயல்பாக உள்ளது.
- source_word: ἤγετο
  choice: வழிநடத்தப்பட்டுக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகாலச் செயப்பாட்டு வடிவம் தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கிறது; இந்தத் தேர்வு அந்த நீடித்த தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐν τῷ πνεύματι
  choice: ஆவியினால்
  rationale: செயப்பாட்டு வடிவிலுள்ள ἄγω என்பதுடன் ἐν இங்கு வழிநடத்தும் செயற்பாட்டாளரை அல்லது கருவியைச் சுட்டுவதாக இயல்பாகப் புரிகிறது. உடனடி சூழலில் இது பரிசுத்த ஆவியைக் குறிக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: ἔρημος என்பது மக்கள் வசிப்பில்லாத பாழ்நிலம் அல்லது வனாந்தரத்தைக் குறிக்கலாம். ‘வனாந்தரம்’ மணற்பாலைவனம் என்ற அளவுக்கு மிகையாகக் குறிப்பாக்காமல் தனிமையான நிலப்பரப்பை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. முந்தைய வசனத்துடன் சேர்த்து வாசிக்கும்போது தமிழில் வாக்கியத் தொடக்க இணைப்புச் சொல் இல்லாமலேயே அந்தத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: ἐν τῷ πνεύματι என்பதில் ‘ஆவி’ யாரைக் குறிக்கிறது?
  choice: பரிசுத்த ஆவி இயேசுவை வழிநடத்தினார்
  alternative: இயேசுவின் உள்ளார்ந்த ஆவிக்குரிய நிலை
  rationale: இதற்கு உடனடியாக முன் வரும் ‘பரிசுத்த ஆவியால் நிறைந்தவராய்’ என்ற சொற்றொடரும், லூக்காவின் கதைநடையில் ஆவி செயற்படுபவராக வருவதும், அதே பரிசுத்த ஆவியே இங்கும் குறிக்கப்படுகிறார் என்பதை வலுவாக ஆதரிக்கின்றன. அதேவேளையில் ἐν என்பதன் சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘வழிநடத்தப்பட்டுக்கொண்டிருந்தார்’ என்பது சற்றே நீளமானதாயினும், கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியான செயலைத் தெளிவாகப் பாதுகாக்கிறது. அடிக்குறி அது விளக்கும் ‘ஆவியினால்’ என்பதன் பின்னரே வைக்கப்பட்டுள்ளது.
