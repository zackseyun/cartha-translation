id: LUK.4.10
reference: Luke 4:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: ta
  text: ஏனெனில், “உன்னைப் பாதுகாக்குமாறு அவர் தமது தூதர்களுக்கு உன்னைக் குறித்துக் கட்டளையிடுவார்” என்று எழுதப்பட்டிருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேதவாக்கு எழுதப்பட்டு இன்றும் நிலைத்திருப்பதை உணர்த்தும் கிரேக்க இறந்தகால நிறைவு வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு ஆதாரமாக வேதவாக்கு மேற்கோள் காட்டப்படுவதைக் குறிக்கும் விளக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: மேற்கோள் குறிகள்
  rationale: ‘என்று எழுதப்பட்டிருக்கிறது’ என்ற தமிழ் மேற்கோள் அமைப்பில் ὅτι என்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பணியை மேற்கோள் குறிகளும் ‘என்று’ என்பதும் இயல்பாக நிறைவேற்றுகின்றன.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: தமது தூதர்களுக்கு
  rationale: αὐτοῦ என்பதன் உடைமைப் பொருளையும், தூதர்களுக்கு இடப்படும் கட்டளையைக் குறிக்கும் வேற்றுமைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐντελεῖται
  choice: கட்டளையிடுவார்
  rationale: கட்டளை அல்லது பொறுப்பு அளித்தல் என்ற எதிர்கால வினைப் பொருளைத் துல்லியமாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: περὶ σοῦ
  choice: உன்னைக் குறித்து
  rationale: περί உடன் வரும் பிறப்புவேற்றுமையின் ‘உன்னைக் குறித்து/உன்னைப் பற்றி’ என்ற பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: τοῦ διαφυλάξαι σε
  choice: உன்னைப் பாதுகாக்குமாறு
  rationale: தூதர்களுக்குக் கொடுக்கப்படும் கட்டளையின் நோக்கத்தைத் தெரிவிக்கும் வினையெச்சத் தொடராக இயல்பான தமிழில் தருகிறது; διαφυλάσσω என்பதன் காவல் மற்றும் பாதுகாப்புப் பொருளையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: சாத்தான் மேற்கோள் காட்டும் சங்கீத வசனத்தின் வடிவம்
  choice: லூக்கா பதிவு செய்துள்ள சொற்களை மட்டும் நெருக்கமாக மொழிபெயர்த்தல்
  alternative: சங்கீதம் 91:11-ன் முழுமையான தொடரை இங்கு சேர்த்தல்
  rationale: இங்கு கிரேக்க உரையில் உள்ள மேற்கோளை மட்டும் மொழிபெயர்ப்பது லூக்காவின் உரை வடிவத்தைப் பாதுகாக்கிறது; விடுபட்ட சங்கீதச் சொற்களை அமைதியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதமேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘உன்னைக் குறித்து’ மற்றும் ‘உன்னைப் பாதுகாக்குமாறு’ ஆகிய இரு கூறுகளும் கிரேக்கத்தின் தொடர்பையும் நோக்கத்தையும் தனித்தனியாகப் பாதுகாக்கின்றன.
