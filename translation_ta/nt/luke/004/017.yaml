source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: ta
  text: 'இறைவாக்கினர் ஏசாயாவின் சுருள்[a] அவருக்குக் கொடுக்கப்பட்டது. அவர் சுருளை விரித்து, எழுதப்பட்டிருந்த இடத்தைக் கண்டார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நூல்.’ கிரேக்கச் சொல் பொதுவாக எழுதப்பட்ட ஆவணத்தைக் குறிக்கலாம்; ஆனால் இந்தத் தொழுகைக்கூடச் சூழலில் அது பெரும்பாலும் ஒரு சுருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: கொடுக்கப்பட்டது
  rationale: இது ‘கொடு/ஒப்படை’ என்ற பொருளுடைய இறந்தகாலச் செயல்பாட்டு வினையின் செயப்பாட்டு வடிவம். தொழுகைக்கூட வாசிப்புச் சூழலில் ‘அவரிடம் கொடுக்கப்பட்டது’ என்பது இயல்பாகவும் மூலத்தின் வலிமையை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: βιβλίον
  choice: சுருள்
  rationale: முதல் நூற்றாண்டுத் தொழுகைக்கூடச் சூழலில் இது தற்காலப் புத்தக வடிவத்தைவிட எழுதப்பட்ட சுருளையே பெரும்பாலும் குறிக்கிறது. உண்மையான அகராதிசார் மாற்றாகிய ‘நூல்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: இறைவாக்கினர் ஏசாயாவின்
  rationale: மூலத்தின் உடைமை வேற்றுமையையும் ஏசாயாவுக்குரிய இறைவாக்கினர் என்ற பட்டத்தையும் இயல்பான தமிழ்ச் சொல் வரிசையில் காக்கிறது.
- source_word: ἀναπτύξας
  choice: விரித்து
  rationale: சுருளை விரித்த செயல் முதன்மை வினையான ‘கண்டார்’ என்பதற்கு முன்னதாக நிகழ்ந்ததைத் தமிழ் வினையெச்சம் இயல்பாகத் தெரிவிக்கிறது.
- source_word: εὗρεν
  choice: கண்டார்
  rationale: ‘கண்டுபிடித்தார்’ என்று தேவையற்ற தேடல் அல்லது கடினத்தன்மையை உணர்த்தாமல், εὑρίσκω என்பதன் நேரடியான பொருளை வழங்குகிறது.
- source_word: τόπον
  choice: இடத்தை
  rationale: மூலத்தின் concrete ஆன ‘இடம்’ என்ற சொல்லைத் தக்கவைத்து, சுருளிலுள்ள குறிப்பிட்ட உரைப்பகுதியைக் குறிக்கிறது.
- source_word: οὗ ἦν γεγραμμένον
  choice: இவ்வாறு எழுதப்பட்டிருந்த
  rationale: தொடர்ந்து வரும் மேற்கோளை அறிமுகப்படுத்துகிறது; ‘எழுதப்பட்டிருந்த’ என்பது கிரேக்கத்தின் நிறைவுற்ற நிலையை இயல்பான நவீன தமிழில் காட்டுகிறது. ‘இவ்வாறு’ என்பது மேற்கோள் அடுத்து வருவதைத் தெளிவாக்குகிறது.
