  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’ என்பதற்குப் பதிலாக இயல்பான, பொருள் தெளிவான ‘இறைவாக்கினர்’ தேர்ந்தெடுக்கப்பட்டது; ‘synagogue’ என்ற சூழல் இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
