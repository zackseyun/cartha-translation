language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: ta
  text: எல்லாரையும் திகைப்பு ஆட்கொண்டது. அவர்கள் ஒருவரோடு ஒருவர் பேசிக்கொண்டே, “இது என்ன வார்த்தை[a]? இவர் அதிகாரத்தோடும் வல்லமையோடும் அசுத்த ஆவிகளுக்குக் கட்டளையிடுகிறார்; அவை வெளியேறுகின்றனவே!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது என்ன செய்தி?” கிரேக்கச் சொல்லான லோகோஸ் என்பது “வார்த்தை,” “செய்தி,” அல்லது “விஷயம்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: திகைப்பு
  rationale: ஆழ்ந்த வியப்பையும் அதிர்ச்சியையும் குறிக்கும் சொல்லாக, நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் வலிமையுடனும் உள்ளது.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: எல்லாரையும் ... ஆட்கொண்டது
  rationale: ஒரு உணர்வு அனைவர்மீதும் வந்து அவர்களைப் பற்றிக்கொண்டது என்ற கிரேக்க மொழிநடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: ஒருவரோடு ஒருவர் பேசிக்கொண்டு
  rationale: பரஸ்பரமாகத் தொடர்ந்து பேசிக்கொண்டிருந்ததைக் காட்டும் இறந்தகாலத் தொடர்நிலையைப் பாதுகாக்கிறது.
- source_word: Τίς ὁ λόγος οὗτος
  choice: இது என்ன வார்த்தை
  rationale: λόγος என்பதன் ‘வார்த்தை/செய்தி/கூற்று’ என்ற பொருள் பரப்பைத் தேவையின்றி குறுக்காமல், இங்கு இயேசுவின் அதிகாரமுள்ள சொல்லை முன்னிறுத்துகிறது.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: அதிகாரத்தோடும் வல்லமையோடும்
  rationale: சட்டபூர்வமான அல்லது உரிமையுள்ள அதிகாரத்தையும் செயலாற்றும் வல்லமையையும் வேறுபடுத்திக் காட்டி, கிரேக்கச் சொல் வரிசையையும் காக்கிறது.
- source_word: ἐπιτάσσει
  choice: கட்டளையிடுகிறார்
  rationale: நிகழ்காலத்தின் உயிரோட்டத்தையும் ஆணையிடுதல் என்ற நேரடிப் பொருளையும் தருகிறது.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: அசுத்த ஆவிகளுக்கு
  rationale: நற்செய்தி நூல்களின் பேயோட்டும் நிகழ்வுகளில் உள்ள யூதத் தூய்மைச் சூழலையும் இயற்கைக்கு அப்பாற்பட்ட ஆவிகளைக் குறிக்கும் நேரடிப் பொருளையும் பாதுகாக்கிறது.
- source_word: ἐξέρχονται
  choice: அவை வெளியேறுகின்றன
  rationale: ஆவிகள் ஒருவரைவிட்டு வெளியேறுவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
theological_decisions:
- issue: பேயோட்டும் சூழலில் உள்ள ஆவிகளைக் குறிப்பிடுதல்
  choice: அசுத்த ஆவிகள்
  alternative: தீய ஆவிகள் / தூய்மையற்ற ஆவிகள்
  rationale: ἀκάθαρτος என்பதன் நேரடிப் பொருளையும் நற்செய்தி நூல்களின் சொல்வழக்கையும் காக்கிறது; இதை உளவியல் உருவகமாக மாற்றாமல், கதை கூறும் இயற்கைக்கு அப்பாற்பட்ட பரிமாணத்தையும் அப்படியே விடுகிறது.
- issue: ἐξουσία மற்றும் δύναμις ஆகியவற்றின் வேறுபாடு
  choice: அதிகாரம் மற்றும் வல்லமை
  alternative: அதிகாரம் மற்றும் சக்தி
  rationale: கட்டளையிடும் உரிமை/அதிகாரம் மற்றும் அதைச் செயல்படுத்தும் திறன்/வல்லமை ஆகிய இரண்டையும் ஒன்றாக்காமல் தனித்தனியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. கேள்வியின் வியப்புத் தொனியை ‘வெளியேறுகின்றனவே!’ என்பதன் மூலம் இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்புக் குறியீடு அது விளக்கும் ‘வார்த்தை’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
