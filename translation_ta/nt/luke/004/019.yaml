id: LUK.4.19
reference: Luke 4:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: ta
  text: ஆண்டவர் அருள்புரியும் ஆண்டைப் பறைசாற்றவும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருடைய தயவின் ஆண்டைப் பறைசாற்றவும்.”
    reason: lexical_alternative
  - marker: b
    text: 'மரபுவழி மொழிபெயர்ப்பு: “ஆண்டவருக்கு உகந்த ஆண்டைப் பறைசாற்றவும்.” இச்சொற்றொடர் ஏசாயா 61:2-ஐ எதிரொலிக்கிறது; யூபிலி ஆண்டைப் பற்றிய கருத்துகளையும் நினைவூட்டலாம்.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: பறைசாற்றவும்
  rationale: பொதுமக்கள் முன் அதிகாரபூர்வமாக அறிவிக்கும் κηρύσσω என்பதன் தூதறிவிப்பு உணர்வை இது இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘சொல்லவும்’ என்ற பொதுப்பொருளாகவோ, பிரசங்கத்துக்கு மட்டும் உரிய சொல்லாகவோ குறுக்கவில்லை.
- source_word: ἐνιαυτὸν
  choice: ஆண்டை
  rationale: ἐνιαυτός என்பதன் இயல்பான பொருள் ‘ஆண்டு.’ ஏசாயா 61:2-ஐ எதிரொலிக்கும் உருவகப் பயன்பாடு இருந்தாலும், அதை ‘காலம்’ என்று பொதுமைப்படுத்தாமல் மூலச்சொல்லைப் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கு நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது. ஏசாயா மேற்கோளின் பின்னணிக்கும் இது பொருந்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத வகையில் தெய்வீகப் பெயரைத் தனியாகக் குறிப்பிடவில்லை.
- source_word: δεκτόν
  choice: அருள்புரியும்
  rationale: இந்தச் சூழலில் δεκτός ஏற்றுக்கொள்ளத்தக்கது அல்லது சாதகமானது என்ற பொருளோடு ஆண்டவரின் தயவு/அருளைக் குறிக்கிறது. ‘ஆண்டவர் அருள்புரியும் ஆண்டு’ என்பது அதனைத் தெளிவான, இயல்பான தமிழில் கூறுகிறது; ‘ஆண்டவரால் ஏற்றுக்கொள்ளப்படும் ஆண்டு’ என்ற தவறான மையப்படுத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: ஏசாயா 61:2 குறித்த மறைசுட்டும் யூபிலி எதிரொலியும்
  choice: முதன்மை உரையில் ‘ஆண்டு’ என்பதை வைத்துக்கொண்டு, ‘யூபிலி’ என்பதைச் சேர்க்காமல் இருப்பது
  alternative: ‘ஆண்டவரின் யூபிலியைப் பறைசாற்றவும்’
  rationale: இந்தக் கிரேக்க வாசகம் ஏசாயா 61:2-ஐ எதிரொலிப்பதோடு யூபிலிக் கருத்தையும் நினைவூட்டலாம்; ஆனால் ‘யூபிலி’ என்ற சொல் வெளிப்படையாக இல்லை. எனவே மறைசுட்டைப் பாதுகாத்து, விளக்க விரிவாக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: κυρίου என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்; எஜமான்
  rationale: ‘ஆண்டவர்’ என்பது κύριος என்பதற்கான இயல்பான தெய்வீகப் பட்டப்பெயர். இங்கு ஏசாயா மேற்கோளின் சூழலுக்கும் அது பொருந்துகிறது; ‘எஜமான்’ என்பது பொருளை மனித உறவுக்குள் குறுக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பறைசாற்று’ என்பது பொதுவெளி அறிவிப்பின் வலிமையைத் தக்கவைக்கிறது; ‘ஆண்டவர் அருள்புரியும் ஆண்டு’ என்பது சொற்சொற் கட்டமைப்பைக் காட்டிலும் இயல்பான தமிழுக்கு முன்னுரிமை கொடுத்து δεκτόν என்பதிலுள்ள தெய்வீகத் தயவின் உணர்வை வெளிப்படுத்துகிறது.
