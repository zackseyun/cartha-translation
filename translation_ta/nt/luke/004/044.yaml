    text: சில கையெழுத்துப் பிரதிகளில் ‘யூதேயா’ என்பதற்குப் பதிலாக ‘கலிலேயா’ என்று உள்ளது. இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்க மூலவாசகத்தின்படி முதன்மைப் பாடத்தில் ‘யூதேயா’ என்று கொடுக்கப்பட்டுள்ளது.
