lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: தொடர்ந்து பிரசங்கித்துவந்தார்
  rationale: εἰμί என்பதன் இறந்தகால வடிவமும் நிகழ்காலப் பெயரெச்சமும் சேர்ந்த இந்த அமைப்பு, கடந்தகாலத்தில் நீடித்த அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அந்தத் தொடர்ச்சியை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: κηρύσσων
  choice: பிரசங்கித்துவந்தார்
  rationale: κηρύσσω என்பது பொதுவெளியில் அறிவிப்பதைக் குறிக்கிறது. ஜெபக்கூடச் சூழலில் ‘பிரசங்கித்தல்’ என்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: εἰς τὰς συναγωγάς
  choice: ஜெபக்கூடங்களில்
  rationale: εἰς என்பதற்கு அடிப்படையில் ‘உள்ளே/நோக்கி’ என்ற பொருள் இருந்தாலும், இங்கு அது பிரசங்கச் செயல் நடைபெற்ற இடத்தைக் குறிக்கிறது; ஆகவே தமிழில் இடவேற்றுமை இயல்பாக உள்ளது.
- source_word: συναγωγάς
  choice: ஜெபக்கூடங்கள்
  rationale: இச்சூழலில் συναγωγή என்பது யூதர்களின் வழிபாட்டுக் கூடங்களையோ அங்கு கூடும் சபையையோ குறிக்கிறது. நவீனத் தமிழ் வேதாகம நடையில் ‘ஜெபக்கூடம்’ தெளிவாகப் புரியும்.
- source_word: Ἰουδαίας
  choice: யூதேயாவின்
  rationale: SBLGNT மூலவாசகம் Ἰουδαίας (‘யூதேயா’) என்று உள்ளது. சுற்றியுள்ள கலிலேயச் சூழலோடு தோன்றும் பதற்றத்தை மொழிபெயர்ப்பில் ஒத்திசைக்காமல், மூலவாசகம் அப்படியே தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: சுற்றியுள்ள கலிலேயச் சூழலின் மத்தியில் τῆς Ἰουδαίας என்ற புவியியல் குறிப்பு
  choice: யூதேயா
  alternative: கலிலேயா; அல்லது யூதர்களின் நிலப்பரப்பை விரிவாகக் குறிக்கும் ‘யூதேயா’
  rationale: மூலமொழிக்கு முன்னுரிமை அளித்து SBLGNT-இன் ‘யூதேயா’ என்ற வாசகம் தக்கவைக்கப்படுகிறது. உடனடிச் சூழலுடன் காணப்படும் பதற்றம் மொழிபெயர்ப்பில் தீர்க்கப்படாமல், பாடவேறுபாடு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொடர்ந்து … வந்தார்’ என்பது நீடித்த அல்லது திரும்பத் திரும்ப நடைபெற்ற செயலை இயல்பாகக் காட்டுகிறது; பாடவேறுபாட்டால் எழும் புவியியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
