language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: ta
  text: பின்னர் அவன் அவரை எருசலேமுக்கு அழைத்துச் சென்று, ஆலயத்தின் உயர்ந்த முனையில்[a][b] நிறுத்தி, அவரிடம், “நீர் தேவனுடைய மகனானால்[c], உம்மை நீரே இங்கிருந்து கீழே தள்ளிவிடுங்கள்;” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்தின் சிறகில்.’ கிரேக்கச் சொல் ஆலயக் கட்டடத் தொகுதியின் வெளியே நீண்டிருக்கும் ஓரத்தையோ உயர்ந்த முனையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள கிரேக்கச் சொல் உள் திருத்தலத்தை மட்டும் அல்ல, ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘நீர் தேவனுடைய மகனாக இருப்பதால்.’ கிரேக்க நிபந்தனைத் தொடர் அந்தப் பொருளையும் தரக்கூடும்; இங்கு சோதிப்பவனின் சவாலைப் பாதுகாக்க ‘நீர் தேவனுடைய மகனானால்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: பின்னர் அவன் ... அழைத்துச் சென்று
  rationale: δέ இங்கு நிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கிறது; ἄγω என்பது வழிநடத்துதல் அல்லது அழைத்துச் செல்லுதல். தமிழில் இயல்பான தொடர்கதையோட்டத்திற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: நவீனத் தமிழில் பரவலாக அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: ἔστησεν
  choice: நிறுத்தி
  rationale: ἵστημι என்பதன் causative பொருளான ஒருவரை ஓர் இடத்தில் நிற்கச் செய்தல் அல்லது நிறுத்துதல் என்பதைக் காட்டுகிறது.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: உயர்ந்த முனையில்
  rationale: πτερύγιον என்பதன் அடிப்படைப் பொருள் ‘சிறகு’; கட்டடச் சூழலில் அது நீட்டிக்கொண்டிருக்கும் ஓர் ஓரம் அல்லது உயர்ந்த முனையைக் குறிக்கிறது. ‘உயர்ந்த முனை’ சாதாரண வாசகருக்குத் தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: τοῦ ἱεροῦ
  choice: ஆலயத்தின்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கக்கூடும். இயல்பான முதன்மை உரையில் ‘ஆலயம்’ பயன்படுத்தப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: நீர் தேவனுடைய மகனானால்
  rationale: εἰ உடன் வரும் நிபந்தனைச் சொற்றொடரின் சவால் தொனியை ‘ஆனால்’ பாதுகாக்கிறது; இயேசுவின் அடையாளத்தை உரையாளர் சந்தேகிப்பதாக இது தீர்மானிப்பதில்லை.
- source_word: βάλε σεαυτὸν
  choice: உம்மை நீரே ... எறிந்துவிடும்
  rationale: βάλλω இங்கு எறிதல் என்ற வலுவான இயக்கத்தைத் தருகிறது; σεαυτόν என்பதிலுள்ள தற்சுட்டுப் பொருளை ‘உம்மை நீரே’ வெளிப்படுத்துகிறது.
- source_word: ἐντεῦθεν κάτω
  choice: இங்கிருந்து கீழே
  rationale: தற்போதைய இடத்திலிருந்து கீழ்நோக்கிய இயக்கத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சோதிப்பவன் இயேசுவின் அடையாளத்தைச் சவாலிடும் சொற்றொடர்
  choice: நீர் தேவனுடைய மகனானால்
  alternative: நீர் தேவனுடைய மகனாக இருப்பதால்
  rationale: εἰ + indicative சில சூழல்களில் ‘இருப்பதால்/இருப்பது உண்மையானால்’ என்ற அடிப்படையிலான வாதத்தைக் குறிக்கலாம். எனினும் இங்குள்ள சோதனை மற்றும் சவாலின் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்க ‘ஆனால்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான கதைநடையும், வேதாகமச் சூழலுக்கு ஏற்ற கண்ணியமான உரையாடல் நடையும் பயன்படுத்தப்பட்டுள்ளன. இயேசுவைக் குறிக்க ‘அவர்/நீர்/உம்மை’ என்ற மரியாதை வடிவங்கள் வைக்கப்பட்டுள்ளன. கட்டடவியல் சார்ந்த πτερύγιον என்பதற்கு வாசகருக்குத் தெளிவான முதன்மைச் சொல் தரப்பட்டு, சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
