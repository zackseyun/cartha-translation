translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் மீண்டும் வரும் இயக்க வினைகள் தமிழில் இயல்பாக ‘வெளியே புறப்பட்டு ... சென்றார்’ என அமைக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடிக்குறிக் குறிகள் பொருளுக்குப் பொருத்தமான சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
