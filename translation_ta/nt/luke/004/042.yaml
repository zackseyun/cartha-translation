  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: ta
  text: பொழுது விடிந்ததும், அவர் வெளியே புறப்பட்டு ஒதுக்குப்புறமான ஓர் இடத்துக்குச் சென்றார்.[a] கூட்டத்தினர் அவரைத் தேடிக்கொண்டிருந்தார்கள்; அவர்கள் அவரிடம் வந்து, அவர் தங்களைவிட்டுப் போய்விடாதபடி அவரைத் தடுத்து நிறுத்த முயன்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தனிமையான ஓர் இடத்துக்கு” அல்லது “குடியிருப்பில்லாத ஓர் இடத்துக்கு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் மக்கள் வசிக்காத அல்லது ஒதுக்குப்புறமான இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவரைப் போகவிடாமல் தடுத்துக்கொண்டிருந்தார்கள்” அல்லது “அவரைத் தங்களோடு தங்கவைக்க முயன்றார்கள்” என்றும் மொழிபெயர்க்கலாம். அவர் அங்கிருந்து புறப்படுவதைத் தடுக்க மக்கள் முயன்றார்கள் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: பொழுது விடிந்ததும்
  rationale: நாளானபோது என்ற கால மாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; δέ-ஐ தனியே வலியுறுத்தாமல் கதை நகர்வில் வெளிப்படுத்துகிறது.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: அவர் வெளியே புறப்பட்டு ... சென்றார்
  rationale: முதலில் வெளியேறியதையும் பின்னர் குறிப்பிட்ட இடத்துக்குச் சென்றதையும் தமிழில் இயல்பாகவும் தெளிவாகவும் தொடர்ச்சியான செயல்களாகக் காட்டுகிறது.
- source_word: εἰς ἔρημον τόπον
  choice: மக்கள் நடமாட்டமில்லாத ஓர் இடத்துக்கு
  rationale: ἔρημος இங்கு கட்டாயமாகப் பாலைவனத்தைக் குறிக்காமல், தனிமையான அல்லது குடியிருப்பில்லாத இடத்தைக் குறிக்கிறது. இந்தத் தேர்வு அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டத்தினர்
  rationale: பலர் திரளாக இருந்ததைக் காட்டுவதோடு, தமிழில் அவர்களைச் செய்பவர்களாக இயல்பாகக் குறிப்பிடுகிறது.
- source_word: ἐπεζήτουν αὐτόν
  choice: அவரைத் தேடிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த செயற்பாட்டைத் தமிழில் காக்கிறது.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: அவர்கள் அவரிடம் வந்து
  rationale: அவர்கள் இயேசு இருந்த இடத்தை அடைந்தார்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: κατεῖχον αὐτὸν
  choice: அவரைத் தடுத்து நிறுத்த முயன்றார்கள்
  rationale: κατέχω என்பதன் தடுத்து வைத்தல் அல்லது போகவிடாமல் செய்தல் என்ற சூழல்சார் பொருளைத் தருகிறது; உடல் வன்முறையைத் தேவையின்றி ஊகிக்கவில்லை.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: அவர் தங்களைவிட்டுப் போய்விடாதபடி
  rationale: அவரைத் தடுத்ததன் நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘அவர்களிடமிருந்து செல்லாமல்’ என்ற கிரேக்க அமைப்பின் பொருளையும் காக்கிறது.
