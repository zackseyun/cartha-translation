source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: ta
  text: 'ஜெபஆலயத்தில் அசுத்தமான பேயின் ஆவியைக் கொண்டிருந்த ஒரு மனிதன் இருந்தான்.[a] அவன் உரத்த குரலில் கூக்குரலிட்டான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அசுத்தமான ஒரு பேய் ஆவி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘ஆவி’, ‘பேய்’ ஆகிய இரண்டு சொற்களும் இடம்பெறுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγῇ
  choice: வழிபாட்டுக்கூடத்தில்
  rationale: இச்சூழலில் யூதர்கள் கூடிவந்து வழிபட்ட இடத்தைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘வழிபாட்டுக்கூடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: கதைச் சூழலில் ஆண் ஒருவரைக் குறிக்கும் ஒருமைச் சொல் என்பதால் ‘மனிதன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔχων
  choice: கொண்டிருந்த
  rationale: இதன் நேரடிப் பொருள் ‘கொண்டிருந்த’ என்பதாகும். ‘பிடித்திருந்த’ என்று விளக்கமாக மொழிபெயர்த்து, மூலத்தில் வெளிப்படையாக இல்லாத உடைமைப் பொருளைச் சேர்ப்பதை இது தவிர்க்கிறது.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: அசுத்தமான பேயின் ஆவி
  rationale: மூலத்தில் ‘ஆவி’ (πνεῦμα), ‘பேய்’ (δαιμόνιον) ஆகிய இரு சொற்களும் உள்ளன. ἀκαθάρτου என்பது இலக்கணப்படி δαιμονίου உடன் இயைந்து நிற்பதால் ‘அசுத்தமான பேயின் ஆவி’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀνέκραξεν
  choice: கத்தினான்
  rationale: பலத்த சத்தத்துடன் கூக்குரலிடுவதைக் குறிக்கும் வினை. அடுத்துள்ள ‘உரத்த குரலில்’ என்பதுடன் சேர்ந்து தமிழில் இயல்பாக அமைகிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: ‘பெரிய/பலத்த குரலால்’ என்ற சொல்லாட்சியை நவீனத் தமிழில் இயல்பாகவும் அதன் வலிமை குறையாமலும் வழங்குகிறது.
theological_decisions:
- issue: பேய் சார்ந்த சொல்லாட்சியை வழங்குதல்
  choice: அசுத்தமான பேயின் ஆவி
  alternative: அசுத்தமான பேய் ஆவி / அசுத்த ஆவி
  rationale: மூல கிரேக்கத்தில் ‘ஆவி’, ‘பேய்’ இரண்டும் வெளிப்படையாக உள்ளன; ஆகவே ‘அசுத்த ஆவி’ என்று சுருக்கவில்லை. அதேவேளையில், பேய் பிடித்த நிலையை விளக்கும் கூடுதல் கோட்பாட்டுச் சொல்லாட்சியையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்த இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
