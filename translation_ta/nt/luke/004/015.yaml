source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: ta
  text: அவர் அவர்களுடைய ஜெப ஆலயங்களில் கற்பித்துக்கொண்டிருந்தார்; எல்லோராலும் புகழப்பட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லோராலும் மதிக்கப்பட்டார்’ அல்லது ‘எல்லோராலும் மகிமைப்படுத்தப்பட்டார்’ என்றும் மொழிபெயர்க்கலாம். δοξαζόμενος என்ற கிரேக்கச் சொல் பொதுவான புகழ்ச்சி அல்லது மதிப்பைக் குறிக்கலாம்; ‘மகிமைப்படுத்தப்பட்டார்’ என்பது ‘மகிமை’ சார்ந்த சொல் தொடர்பை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல் இடப்படவில்லை)
  rationale: தமிழில் முந்தைய நிகழ்வுடன் தொடர்வது வாக்கிய வரிசையாலேயே இயல்பாகத் தெரிகிறது; ‘மேலும்’ அல்லது ‘பின்பு’ என்பவை மூலத்தில் இல்லாத வலியுறுத்தலையோ காலநுட்பத்தையோ சேர்க்கக்கூடும்.
- source_word: αὐτὸς
  choice: அவர்
  rationale: இது இயேசுவைக் குறிக்கும் வெளிப்படையான எழுவாய். தமிழில் மரியாதைக்குரிய ஒருமை வடிவம் இயல்பாக உள்ளது; ‘அவரே’ என மொழிபெயர்த்தால் கிரேக்கத்தின் மெல்லிய வலியுறுத்தல் மிகைப்படக்கூடும்.
- source_word: ἐδίδασκεν
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்த அல்லது வழக்கமான செயலைக் காட்டும் imperfect வினைவடிவத்தின் நிறைவுறாத தன்மையை இது வெளிப்படுத்துகிறது.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: அவர்களுடைய ஜெபக்கூடங்களில்
  rationale: இடத்தையும் பன்மையையும் உடைமைத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது. சூழலில் இது கலிலேயப் பகுதிகளிலிருந்த சமூகங்களின் ஜெபக்கூடங்களைக் குறிக்கிறது.
- source_word: δοξαζόμενος
  choice: மகிமைப்படுத்தப்பட்டார்
  rationale: δοξάζω என்பதன் ‘மகிமைப்படுத்து’ என்ற சொல் தொடர்பைக் காக்கிறது; இச்சூழலில் பொதுமக்களின் புகழ்ச்சியையும் மதிப்பையும் குறிக்கக்கூடிய மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ὑπὸ πάντων
  choice: எல்லாராலும்
  rationale: ὑπό உடன் வரும் agency பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; பரவலான மக்கள் வரவேற்பைத் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய δοξαζόμενος என்பதன் மொழிபெயர்ப்பு
  choice: எல்லாராலும் மகிமைப்படுத்தப்பட்டார்
  alternative: எல்லாராலும் புகழப்பட்டார் / மதிக்கப்பட்டார்
  rationale: இங்கு இந்தச் சொல் மக்களின் பாராட்டையோ மதிப்பையோ குறிக்கலாம். ‘மகிமைப்படுத்தப்பட்டார்’ என்பது மூலச்சொல்லின் மகிமை சார்ந்த தொடர்பைத் தக்கவைக்கிறது; அதேவேளையில், இச்சூழலில் சாத்தியமான சாதாரண சமூகப் பொருள்களை அடிக்குறிப்பு திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. imperfect வினையின் தொடர்ச்சித் தன்மை ‘கற்பித்துக்கொண்டிருந்தார்’ என்பதால் காக்கப்பட்டுள்ளது. ‘மகிமைப்படுத்தப்பட்டார்’ என்ற சற்றே உயர்ந்த நடை மூலத்தின் சொல் தொடர்புக்காக வைக்கப்பட்டு, இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
