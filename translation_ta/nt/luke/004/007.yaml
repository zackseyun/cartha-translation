  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: ta
  text: ஆகையால், நீ என் முன்னிலையில் வழிபட்டால்[a], அனைத்தும் உனக்குச் சொந்தமாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் முன்னிலையில் பணிந்து வணங்கினால்.’ கிரேக்க வினைச்சொல் பணிந்து வணங்குவதையோ வழிபடுவதையோ குறிக்கலாம். இங்கு பிசாசுக்கு மதரீதியான மரியாதை செலுத்துவது பற்றிய சூழல் இருப்பதால், முதன்மை உரையில் ‘வழிபட்டால்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல் வலியுறுத்தலைக் கொண்டுள்ளது; தமிழில் ‘நீ’ என்பதை வெளிப்படையாகச் சொல்வது அந்த வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய வாக்குறுதியிலிருந்து வரும் விளைவு அல்லது நிபந்தனை சார்ந்த முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐὰν
  choice: -ட்டால்
  rationale: நிபந்தனையை நவீனத் தமிழில் இயல்பாகக் குறிக்கும் வினைமுற்று.
- source_word: προσκυνήσῃς
  choice: வழிபட்டால்
  rationale: இந்த வினை பணிந்து வணங்குவதையோ வழிபடுவதையோ குறிக்கலாம். அடுத்த வசனத்தில் கடவுளுக்கே உரிய வழிபாடு பேசப்படுவதால், இங்கு மதரீதியான பணிவை ‘வழிபட்டால்’ தெளிவாக வெளிப்படுத்துகிறது; உடல் செய்கை சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐνώπιον ἐμοῦ
  choice: என் முன்னிலையில்
  rationale: ‘எனக்கு முன்பாக’ அல்லது ‘என் சந்நிதியில்’ என்ற இட-உறவுப் பொருளை, அளவுக்கு மீறிய சமயச் சொற்சாயல் இல்லாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἔσται σοῦ
  choice: உனக்குச் சொந்தமாகும்
  rationale: எதிர்கால உடைமைப் பொருளை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πᾶσα
  choice: இவை அனைத்தும்
  rationale: முந்தைய வசனத்தில் காட்டப்பட்ட அரசுகளின் அதிகாரத்தையும் மகிமையையும் பின்னோக்கிச் சுட்டும் விடுபட்ட குறிப்பைத் தமிழில் புரியும்படி வெளிப்படுத்துகிறது; இல்லாத ஒரு குறிப்பிட்ட பெயர்ச்சொல்லைச் சேர்க்காமல் முழுமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: προσκυνέω என்பதை நடுநிலையான உடல் செய்கையாகவா, மதரீதியான வழிபாடாகவா மொழிபெயர்ப்பது
  choice: வழிபட்டால்
  alternative: என் முன்னிலையில் பணிந்து வணங்கினால்
  rationale: பிசாசுக்குக் கடவுளுக்குரிய மரியாதையைச் செலுத்தச் செய்யும் சோதனையே சூழலின் மையம்; அடுத்த வசனத்தில் இயேசு ஆண்டவரையே வழிபட வேண்டும் என்று பதிலளிப்பதும் இதை உறுதிப்படுத்துகிறது. அதேவேளையில், கிரேக்கச் சொல்லின் உடல் செய்கை சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்நிதி’ போன்ற அதிக சமயச் சாயலுள்ள சொல்லுக்குப் பதிலாக ‘முன்னிலையில்’ பயன்படுத்தப்பட்டுள்ளது; உரையின் நிபந்தனை அமைப்பும் வழிபாட்டின் இறையியல் தீவிரமும் தக்கவைக்கப்பட்டுள்ளன.
