source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: ta
  text: அவருடைய போதனையைக் குறித்து அவர்கள் வியப்படைந்தார்கள்; ஏனெனில் அவருடைய வார்த்தை அதிகாரத்தோடு இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய செய்தி அதிகாரமுள்ளதாக இருந்தது” அல்லது “அவர் அதிகாரத்தோடு பேசினார்.”
    reason: λόγος மற்றும் ἐν ἐξουσίᾳ ஆகியவற்றின் இணைப்பைத் தமிழில் பல இயல்பான வழிகளில் வெளிப்படுத்த முடியும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: வியப்படைந்தார்கள்
  rationale: இந்த வினைச்சொல் வலுவான வியப்பைக் குறிக்கிறது; முற்றுப்பெறாத கால வடிவத்தின் தொடர்ந்த எதிர்வினையைத் தமிழில் சூழல் இயல்பாக உணர்த்துகிறது.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: அவருடைய போதனையைக் கேட்டு
  rationale: ἐπί உடன் வரும் இத்தொடர் அவர்களின் வியப்புக்கான அடிப்படையையோ பொருளையோ குறிக்கிறது. ‘கேட்டு’ என்பது தொழுகைக்கூடத்தில் நிகழ்ந்த வாய்மொழிப் போதனையின் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διδαχῇ
  choice: போதனை
  rationale: இங்கு போதிக்கும் செயலையும் அதன் உள்ளடக்கத்தையும் குறிக்கக்கூடிய பொதுவான, தற்போதைய தமிழ் சொல்.
- source_word: ἐν ἐξουσίᾳ
  choice: அதிகாரத்தோடு
  rationale: இது இயேசுவின் பேச்சின் தன்மையையும் வலிமையையும் விவரிக்கிறது; அதன் அதிகாரத்திற்கான இறையியல் அடிப்படையை வசனத்தில் இல்லாதவாறு விரிவுபடுத்தவில்லை.
- source_word: ὁ λόγος αὐτοῦ
  choice: அவர் பேசியது
  rationale: இங்கு λόγος என்பது இயேசுவின் வாய்மொழிப் பேச்சைக் குறிக்கிறது. ‘அவர் பேசியது’ என்பது ‘அவருடைய வார்த்தை’ என்பதைக் காட்டிலும் இயல்பான தமிழாகவும், ‘செய்தி’ என்பதுபோல் உள்ளடக்கத்திற்கு மட்டும் பொருளைக் குறுக்காமலும் உள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அவர்களின் வியப்புக்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: இயேசுவின் பேச்சிலுள்ள அதிகாரத்தின் இயல்பு
  choice: ‘அவர் பேசியது அதிகாரத்தோடு இருந்தது’ என்று விளக்கவுரையின்றி விவரித்தல்
  alternative: ‘அவருடைய செய்தி அதிகாரமுள்ளதாக இருந்தது’ அல்லது ‘அவர் அதிகாரத்தோடு பேசினார்’
  rationale: வசனம் இயேசுவின் பேச்சை அதிகாரமுள்ளது எனக் கூறுகிறது; ஆனால் அந்த அதிகாரத்தின் முழு இறையியல் அடிப்படையை இவ்வசனமே விளக்கவில்லை. ஆகவே மூலத்தின் கூற்று விரிவுபடுத்தப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அதிகாரத்தோடு’ என்பது மூலத்தின் சுருக்கத்தையும் இறையியல் திறந்தநிலையையும் பாதுகாக்கிறது.
