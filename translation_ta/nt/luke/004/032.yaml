revisions:
- from: அவருடைய போதனையைக் கேட்டு அவர்கள் வியப்படைந்தார்கள்; ஏனெனில் அவர் பேசியது அதிகாரத்தோடு இருந்தது[a].
  to: அவருடைய போதனையைக் குறித்து அவர்கள் வியப்படைந்தார்கள்; ஏனெனில் அவருடைய வார்த்தை அதிகாரத்தோடு இருந்தது[a].
  rationale: The revision removes the added auditory nuance while retaining the causal structure and preserves λόγος more directly as ‘அவருடைய வார்த்தை.’ It retains ‘அதிகாரத்தோடு,’ which accurately represents ἐν ἐξουσίᾳ and does not specify a theological basis beyond the verse.
