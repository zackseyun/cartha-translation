translation:
  language: ta
  text: நாற்பது நாட்கள் பிசாசினால் சோதிக்கப்பட்டுக்கொண்டிருந்தார்[a]. அந்த நாட்களில் அவர் எதுவும் சாப்பிடவில்லை; அவை முடிந்தபோது அவருக்குப் பசியெடுத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசோதிக்கப்பட்டுக்கொண்டிருந்தார்.’ கிரேக்க வினைச்சொல் ‘சோதித்தல்’ அல்லது ‘பரிசோதித்தல்’ என்ற இரு பொருள்களையும் தரலாம்; இங்கு அதைச் செய்பவர் பிசாசு என்பதால் ‘சோதிக்கப்பட்டுக்கொண்டிருந்தார்’ என்பது சூழலுக்கு மிகவும் பொருந்துகிறது.
