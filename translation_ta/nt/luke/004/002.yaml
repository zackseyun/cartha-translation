- source_word: ἡμέρας τεσσεράκοντα
  choice: நாற்பது நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் வேற்றுமையைத் தமிழில் தனி இடைச்சொல் இன்றியே இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πειραζόμενος
  choice: சோதிக்கப்பட்டார்
  rationale: πειράζω என்பது ‘சோதித்தல்’ அல்லது தீய நோக்கில் ‘சோதனைக்குள்ளாக்குதல்/தூண்டுதல்’ எனப் பொருள்படலாம். பிசாசு செயற்பாட்டாளராக இருப்பதால் எதிர்மறைச் சூழல் தெளிவாகிறது; தமிழில் ‘சோதிக்கப்பட்டார்’ இரு நுணுக்கங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: பிசாசினால்
  rationale: διάβολος இங்கு நற்செய்தி நூலில் அறியப்பட்ட தனிப்பட்ட எதிரியைக் குறிக்கும் பட்டப்பெயர்; ‘பிசாசு’ என்பது நவீனத் தமிழில் தெளிவான வழக்கமான இணை.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: அவர் எதுவும் சாப்பிடவில்லை
  rationale: வலியுறுத்தப்பட்ட மறுப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: அந்த நாட்களில்
  rationale: குறிப்பிட்ட நாற்பது நாள் காலப்பகுதியை இயல்பாகச் சுட்டுகிறது.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: அவை முடிந்தபோது
  rationale: இறந்தகாலப் பெயரெச்சத் தொடரை இயல்பான காலத் துணைவாக்கியமாக மாற்றி, நாட்கள் நிறைவடைந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπείνασεν
  choice: அவருக்குப் பசியெடுத்தது
  rationale: நாற்பது நாட்கள் முடிந்தபின் பசி ஏற்பட்டதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வனாந்தரத்தில் இயேசு அனுபவித்த πειραζόμενος என்பதன் பொருள்
  choice: சோதிக்கப்பட்டார்
  alternative: தீயவற்றால் கவரப்பட்டார் / பரிசோதிக்கப்பட்டார்
  rationale: மூல வினைச்சொல்லில் ‘சோதனை’ மற்றும் ‘பரிசோதனை’ ஆகிய இரு சாத்தியங்களும் உள்ளன. செயற்பாட்டாளர் பிசாசு என்பதால் பகைமையான நோக்கம் சூழலில் தெளிவாக இருந்தாலும், கிறிஸ்துவின் சோதிக்கப்படத்தக்க தன்மை குறித்த கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனம் முந்தைய வசனத்திலிருந்து தொடர்வதால் தொடக்கத் துணுக்கின் இயல்பு பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற இணைப்புச் சொல் சேர்க்கப்படவில்லை.
