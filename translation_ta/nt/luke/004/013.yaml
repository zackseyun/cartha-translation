  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: ta
  text: பிசாசு எல்லாச் சோதனைகளையும்[a] முடித்த பின்பு, தகுந்த காலம் வரும்வரை அவரைவிட்டு விலகினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமைக்குத் தூண்டும் முயற்சிகளையும்.” கிரேக்கச் சொல் ‘சோதனை’ அல்லது ‘தீமைக்குத் தூண்டுதல்’ ஆகிய இரண்டையும் குறிக்கலாம்; இங்கு பிசாசின் பங்கு காரணமாக இரண்டாவது நுட்பமும் வலுவாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: முடித்த பின்பு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. ‘முடித்த பின்பு’ என்பது அந்தக் காலத் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πάντα πειρασμόν
  choice: எல்லாச் சோதனைகளையும்
  rationale: ஒருமையில் உள்ள πειρασμόν உடன் வரும் πάντα, இச்சூழலில் முழு வரிசையையும் உள்ளடக்கும் பகிர்வுப் பொருளைக் கொண்டது. தமிழில் ‘எல்லாச் சோதனைகளையும்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது; ‘சோதனை’ பரீட்சித்தல் மற்றும் தீமைக்குத் தூண்டுதல் ஆகிய இரு சாத்தியங்களையும் ஓரளவு தக்கவைக்கிறது.
- source_word: ὁ διάβολος
  choice: பிசாசு
  rationale: லூக்காவின் நிகழ்வுரையில் இது தனிப்பட்ட அமானுஷ்ய எதிரியைக் குறிக்கிறது. ‘பிசாசு’ என்பது நவீனத் தமிழில் நிலைபெற்ற, தெளிவான மொழிபெயர்ப்பு.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: அவரைவிட்டு விலகினான்
  rationale: ἀφίστημι இங்கு ஒருவரிடமிருந்து நீங்குதல் அல்லது விலகுதல் எனப் பொருள்படும். ‘விலகினான்’ என்பது தற்காலிகப் பின்வாங்கலையும் கண்ணியமான நிகழ்வுரை நடையையும் தக்கவைக்கிறது.
- source_word: ἄχρι καιροῦ
  choice: தகுந்த காலம் வரும்வரை
  rationale: καιρός வெறும் காலப்புள்ளியைக் காட்டாமல், பொருத்தமான அல்லது வாய்ப்பான நேரத்தைக் குறிக்கலாம். ‘தகுந்த காலம் வரும்வரை’ அந்த நுட்பத்தையும் பிசாசின் விலகல் தற்காலிகமானது என்பதையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πειρασμός என்ற சொல்லில் இயேசுவின் அனுபவம் சோதனையா அல்லது தீமைக்குத் தூண்டுதலா என்ற நுட்பம்
  choice: சோதனை
  alternative: தீமைக்குத் தூண்டுதல்
  rationale: πειρασμός என்பதற்கு சூழலைப் பொறுத்து பரீட்சை/சோதனை அல்லது தீமைக்குத் தூண்டுதல் என்ற இரு பொருள்களும் உண்டு. இங்கு செயற்படுபவன் பிசாசு என்பதால் தூண்டுதல் என்ற நுட்பம் வலுவாக இருந்தாலும், நிகழ்வு இயேசுவின் உண்மைத்தன்மையை வெளிப்படுத்தும் சோதனையாகவும் அமைகிறது. ‘சோதனை’ இரு பரிமாணங்களையும் அதிகம் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நிகழ்வுரை நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் சுட்டுப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; பிசாசைக் குறிக்கும் வினை ஒருமையில் வைக்கப்பட்டுள்ளது.
