source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: ta
  text: அவர் அவளுக்கு மேலாக நின்று, காய்ச்சலைக் கடிந்தார்; அது அவளை விட்டுப் போனது[a]. உடனே அவள் எழுந்து, அவர்களுக்குப் பணிவிடை செய்யத் தொடங்கினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காய்ச்சல் அவளை விட்டுப் போனது.” கிரேக்கத்தில் காய்ச்சலே கடிந்ததாகத் தெளிவாகக் கூறப்பட்டு, பின்னர் விட்டுப் போன செயலின் மறைமுக எழுவாயாகவும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: அவர் அவளுக்கு மேலாக நின்று
  rationale: இயேசு அந்தப் பெண்ணுக்கு மேலாக நின்ற உடல் நிலையை கிரேக்கச் சொற்றொடர் தெளிவாகக் காட்டுகிறது. தமிழில் சற்றே நேரடியான இந்த வடிவம் காட்சியின் குறிப்பை விளக்கமாக்காமல் பாதுகாக்கிறது.
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டார்
  rationale: இச்சொல் அதிகாரத்துடன் கடிந்துகொள்வதைக் குறிக்கிறது. நோயை வெறுமனே குணப்படுத்தினார் என்று பொதுமைப்படுத்தாமல், லூக்காவின் நேரடியான சொல்லாட்சியை இது தக்கவைக்கிறது.
- source_word: τῷ πυρετῷ
  choice: காய்ச்சலை
  rationale: கிரேக்கத்தில் காய்ச்சலே இயேசுவின் கடிந்துகொள்ளுதலுக்கு நேரடியான இலக்காக உள்ளது; ‘அவளுடைய காய்ச்சல்’ என்ற இயல்பான விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἀφῆκεν αὐτήν
  choice: அது அவளை விட்டுப் போனது
  rationale: இதன் மறைமுக எழுவாய் காய்ச்சல். தமிழில் ‘அது’ என்று குறிப்பிடுவது முந்தைய பெயர்ச்சொல்லோடு இயல்பாக இணைந்து, காய்ச்சல் நீங்கியதைத் தெளிவாகக் கூறுகிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: குணமடைதல் முழுமையாகவும் உடனடியாகவும் நிகழ்ந்ததைச் சுருக்கமான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: ἀναστᾶσα
  choice: அவள் எழுந்து
  rationale: குணமடைந்தபின் அவள் உடனடியாக எழுந்த செயலை இயல்பாகப் பதிவு செய்கிறது.
- source_word: διηκόνει
  choice: பணிவிடை செய்யத் தொடங்கினாள்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் தொடக்க அல்லது நீடித்த அம்சத்தை ‘செய்யத் தொடங்கினாள்’ வெளிப்படுத்துகிறது. ‘பணிவிடை’ என்பது இங்கு குழுவினருக்குச் செய்த நடைமுறைச் சேவையை உணர்த்துகிறது; குறிப்பாக உணவு பரிமாறுதல் என்று சுருக்கவில்லை.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: அங்கு இருந்த பலரைக் குறிக்கும் பன்மைச் சுட்டைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: காய்ச்சலை இயேசு கடிந்துகொண்டது ஆளுருவாக்கத்தையோ பேய்சார் காரணத்தையோ குறிக்கிறதா
  choice: ‘காய்ச்சலைக் கடிந்துகொண்டார்’ என்ற நேரடியான சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘காய்ச்சலை நீக்கும்படி கட்டளையிட்டார்’ அல்லது ‘நோயைக் குணப்படுத்தினார்’
  rationale: கிரேக்கம் காய்ச்சலையே கடிந்துகொள்ளப்பட்டதாகச் சொல்கிறது. இதை நேரடியாக மொழிபெயர்ப்பது இயேசுவின் அதிகாரத்தைப் பாதுகாக்கிறது; அதேவேளையில் நோய் பேயால் ஏற்பட்டது என்றோ வெறும் இலக்கிய ஆளுருவாக்கம் என்றோ தீர்மானித்து விடுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தின் அதிகாரமிக்க சொல்லாட்சியும் குணமடைதலின் உடனடித் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
