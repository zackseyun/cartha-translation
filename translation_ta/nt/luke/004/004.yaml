id: LUK.4.4
reference: Luke 4:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்தார்: “எழுதப்பட்டிருக்கிறது:[b] ‘மனிதன்[a] அப்பத்தினால் மட்டும் வாழமாட்டான்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவர் அப்பத்தினால் மட்டும் வாழமாட்டார்.” இங்குள்ள சொல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இயேசு உபாகமம் 8:3-ஐ மேற்கோள் காட்டுகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: அவனுக்குப் பதிலளித்தார்
  rationale: ἀποκρίνομαι என்பதுடன் வரும் πρός + வேற்றுமை அமைப்பு, தமிழில் இயல்பாக ‘அவனுக்குப் பதிலளித்தார்’ என்று வழங்கப்படுகிறது; மூலத்தின் பொருளும் நேரடியான தொடர்பும் காக்கப்படுகின்றன.
- source_word: Γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: இறந்தகாலத்தில் எழுதப்பட்டு இன்றும் நிலைத்திருக்கும் உரையைச் சுட்டும் நிறைவு செயல்பாட்டு வடிவத்தை இந்தத் தமிழ் சொல்லாக்கம் இயல்பாக வெளிப்படுத்துகிறது; இது வேதாகம மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சூத்திரமாகவும் பொருந்துகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: இங்கு ὅτι மேற்கோளை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்று’ என்பதைச் சேர்ப்பதைவிட முக்காற்புள்ளியைப் பயன்படுத்துவது மேற்கோளின் எல்லையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: அப்பத்தினால் மட்டும்
  rationale: ἐπί இங்கு உயிர்வாழ்வதற்கான ஆதாரம் அல்லது வழிமுறையைச் சுட்டுகிறது. ‘அப்பத்தினால் மட்டும்’ என்பது அந்தச் சார்பைத் தெளிவாக வெளிப்படுத்தும் இயல்பான தமிழ்.
- source_word: ζήσεται
  choice: வாழமாட்டான்
  rationale: எதிர்கால வினை வடிவமும் எதிர்மறை வாக்கியமும் தமிழில் இயல்பாக ‘வாழமாட்டான்’ என்று வழங்கப்படுகின்றன.
- source_word: ὁ ἄνθρωπος
  choice: மனிதன்
  rationale: இந்த ஒருமை வடிவம் உபாகமம் 8:3 மேற்கோளின் பிரதிநிதித்துவமான, பொதுமனிதப் பொருளைக் காக்கிறது. நவீன தமிழில் இது ஆணை மட்டும் குறிப்பதாகப் புரிந்துகொள்ளப்படக்கூடியதால், ‘ஒருவர்’ என்ற பொதுப்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வேதாகம மேற்கோளில் வரும் பொதுப்பொருளுடைய ஒருமை ὁ ἄνθρωπος என்பதன் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தில் ஆண்பால் இலக்கண வடிவிலான ஒருமைச் சொல் இருந்தாலும், அது இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. ‘மனிதன்’ மூலத்தின் ஒருமை வடிவத்தையும் உபாகமம் 8:3 உடனான சொல் தொடர்பையும் காக்கிறது; அதன் பொதுப்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எழுதப்பட்டிருக்கிறது’ என்பது வேதாகம மேற்கோள் சூத்திரத்தின் நிலைத்த விளைவை வெளிப்படுத்துகிறது. உள்ளமை மேற்கோளைக் காட்ட இரட்டை மற்றும் ஒற்றை மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன.
