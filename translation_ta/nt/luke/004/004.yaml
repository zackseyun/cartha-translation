  source_fidelity: 'மூல கிரேக்கத்தின் கூறுகள் அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன: இயேசுவின் பதில், நிலையான வேதாகம-மேற்கோள் சூத்திரமான Γέγραπται, மற்றும் ‘அப்பத்தினால் மட்டும்’ வாழ முடியாது என்ற எதிர்கால மறுப்பு ஆகியவை காக்கப்பட்டுள்ளன. SBLGNT-இல் அடைப்புக்குறிக்குள் உள்ள ‘அவனுக்குப் ... இயேசு’ என்ற வாசிப்பும் மொழிபெயர்ப்பில் பிரதிபலிக்கிறது.'
