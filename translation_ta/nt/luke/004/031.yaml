  source_fidelity: கிரேக்கத்தின் κατῆλθεν என்பதிலுள்ள கீழ்நோக்கிய பயண உணர்வு “இறங்கிச் சென்றார்” என்பதில் பாதுகாக்கப்பட்டுள்ளது. πόλιν τῆς Γαλιλαίας இயல்பான தமிழில் “கலிலேயாவிலுள்ள ... நகரம்” என்று துல்லியமாகத் தரப்பட்டுள்ளது. ἦν διδάσκων-இன் தொடர்ச்சியான/வழக்கமான இறந்தகாலச் செயல் “போதித்துவந்தார்” என்பதில் நன்றாக வெளிப்படுகிறது; αὐτούς என்பதன் குறிப்பிடப்படாத பன்மை முன்னோடியும் “அவர்களுக்கு” என விளக்கச் சேர்க்கையின்றி தரப்பட்டுள்ளது. ἐν τοῖς σάββασιν என்பதன் பன்மை “ஓய்வுநாட்களில்” எனப் பாதுகாக்கப்பட்டுள்ளது.
