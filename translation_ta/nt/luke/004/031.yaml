reference: Luke 4:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: ta
  text: பின்பு அவர் கலிலேயாவிலுள்ள கப்பர்நகூம் நகரத்துக்கு இறங்கிச் சென்றார். அவர் ஓய்வுநாட்களில் அவர்களுக்குப் போதித்துவந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῆλθεν
  choice: இறங்கிச் சென்றார்
  rationale: κατέρχομαι என்பதிலுள்ள கீழ்நோக்கிய பயணத்தின் பொருளைப் பாதுகாக்கிறது; தமிழிலும் இயல்பாக உள்ளது.
- source_word: Καφαρναοὺμ
  choice: கப்பர்நகூம்
  rationale: இந்த இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள ... நகரம்
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், கப்பர்நகூம் கலிலேயா பகுதியில் அமைந்த நகரம் என்ற உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἦν διδάσκων
  choice: போதித்துவந்தார்
  rationale: இறந்தகாலத்தில் நீடித்த அல்லது வழக்கமாகத் தொடர்ந்த போதனையை இந்தத் தமிழ் வினைவடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτοὺς
  choice: அவர்களுக்கு
  rationale: மூலத்தில் பெயர்ச்சொல் முன்னோடி வெளிப்படையாகக் கொடுக்கப்படாததால், ‘மக்களுக்கு’ போன்ற விளக்கத்தைச் சேர்க்காமல் பன்மைச் சுட்டுப்பெயர் பாதுகாக்கப்படுகிறது.
- source_word: ἐν τοῖς σάββασιν
  choice: ஓய்வுநாட்களில்
  rationale: σάββασιν என்பதன் பன்மையையும், பல ஓய்வுநாள் சந்தர்ப்பங்களில் நிகழ்ந்த செயல் என்ற சாத்தியமான தொடர்ச்சிப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: σάββασιν என்ற பன்மையை ஒருமையாக இயல்பாக்குவதா
  choice: ஓய்வுநாட்களில்
  alternative: ஓய்வுநாளில்
  rationale: பன்மையைப் பாதுகாப்பது இயேசு பல ஓய்வுநாள் சந்தர்ப்பங்களில் போதித்திருக்கலாம் என்ற கிரேக்கத்தின் தொடர்ச்சிப் பொருளை மறைக்காமல் விடுகிறது; இதனால் ஒரு நிகழ்வு மட்டுமே என்று வாசகம் கட்டுப்படுத்தப்படுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் திசை உணர்வு, தொடர்ச்சியான போதனை, ஓய்வுநாட்களின் பன்மை ஆகியவை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
