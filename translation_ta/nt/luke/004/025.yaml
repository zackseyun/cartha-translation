id: LUK.4.25
reference: Luke 4:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: ta
  text: 'ஆனால், உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: எலியாவின் நாட்களில் இஸ்ரவேலில் பல விதவைகள் இருந்தார்கள்; வானம் மூன்று ஆண்டுகளும் ஆறு மாதங்களும் அடைக்கப்பட்டிருந்தபோது, நாடெங்கும் பெரும் பஞ்சம் உண்டாயிற்று.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: உண்மையாகவே
  rationale: கூற்றின் உண்மைத்தன்மையை வலியுறுத்தும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: வானம் ... அடைக்கப்பட்டது
  rationale: மழை பெய்யாத நிலையை உருவகமாகக் கூறும் மூல மொழியின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: λιμὸς μέγας
  choice: கடுமையான பஞ்சம்
  rationale: μέγας என்பதன் தீவிரத்தை தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: நாடெங்கும்
  rationale: இங்கு γῆ என்பது சூழலுக்குரிய முழு நிலப்பகுதி அல்லது நாடு என்ற பொருளில் உள்ளது; உலகம் முழுவதும் எனத் தவறாக விரிவுபடுத்தாமல் இயல்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: வானம் அடைக்கப்பட்டதற்கான செய்பவர்
  choice: செய்பவரைக் குறிப்பிடாத ‘வானம் ... அடைக்கப்பட்டது’ என்ற வினைப்பாட்டு வடிவம்
  alternative: கடவுள் வானத்தை அடைத்தார்
  rationale: கிரேக்க மூலத்தில் உள்ள மறைமுகச் செயப்பாட்டு வடிவத்தின் தெளிவின்மையைப் பாதுகாத்து, உரையில் வெளிப்படையாக இல்லாத செய்பவரைச் சேர்க்கவில்லை.
- issue: பஞ்சத்தின் பரப்பு
  choice: நாடெங்கும்
  alternative: பூமி முழுவதும்
  rationale: சூழலில் இஸ்ரவேலும் அதைச் சுற்றிய நிலப்பகுதியும் குறிக்கப்படுவதால், தேவையற்ற உலகளாவிய பொருளை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். மூலத்தின் வலியுறுத்தலும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
