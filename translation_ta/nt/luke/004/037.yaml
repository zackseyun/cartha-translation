translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க imperfect வினையின் தொடர்ச்சித் தன்மை ‘பரவிக்கொண்டிருந்தது’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; அடிப்படைச் சொல்லாக்கத்துக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
