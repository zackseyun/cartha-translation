  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: ta
  text: அவரைப் பற்றிய செய்தி சுற்றுப்புறப் பகுதியின் எல்லா இடங்களுக்கும் பரவிக்கொண்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைப் பற்றிய தகவல் சுற்றுப்புறப் பகுதியின் ஒவ்வோர் இடத்திற்கும் சென்றுகொண்டிருந்தது.’
    reason: ἦχος என்பதற்கு ‘செய்தி/தகவல்’ என்றும் ἐξεπορεύετο என்பதற்கு இன்னும் நேரடியாக ‘சென்றுகொண்டிருந்தது’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: καὶ
  choice: வாக்கியத் தொடர்பால் வெளிப்படுத்தப்பட்டது; தனிச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: தமிழ் கதைநடையில் இங்கு ‘மேலும்’ அல்லது ‘பின்பு’ என்று சேர்ப்பது இயல்பற்றதாகவோ கிரேக்கத்தில் இல்லாத கூடுதல் நுண்பொருளைத் தருவதாகவோ அமையலாம். முந்தைய நிகழ்வுடன் உள்ள எளிய தொடர்ச்சி வாக்கிய வரிசையால் தெளிவாகிறது.
- source_word: ἐξεπορεύετο
  choice: பரவிக்கொண்டிருந்தது
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடைபெற்ற செயலை imperfect வடிவம் காட்டுகிறது. செய்தியை எழுவாயாகக் கொண்ட இச்சூழலில், ‘வெளியே சென்றுகொண்டிருந்தது’ என்பதைக் காட்டிலும் ‘பரவிக்கொண்டிருந்தது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἦχος
  choice: செய்தி
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘ஒலி’ என்றாலும், περὶ αὐτοῦ என்பதோடு இங்கு இயேசுவைப் பற்றிப் பரவும் செய்தி அல்லது தகவலைக் குறிக்கிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றிய
  rationale: செய்தியின் பொருள் அவரே என்பதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰς πάντα τόπον
  choice: எல்லா இடங்களுக்கும்
  rationale: εἰς என்பதன் திசைநோக்கிய பொருளையும் πάντα τόπον என்பதன் பகிர்ந்தளிக்கும் வலியுறுத்தலையும் காக்கிறது.
- source_word: τῆς περιχώρου
  choice: சுற்றுப்புறப் பகுதியின்
  rationale: περίχωρος என்பது சுற்றியுள்ள பகுதி அல்லது மாவட்டத்தைக் குறிக்கிறது; ‘சுற்றுப்புறப் பகுதி’ நவீனத் தமிழில் தெளிவான புவியியல் சொற்றொடர்.
