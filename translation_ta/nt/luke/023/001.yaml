  source_fidelity: 'மூலத்தின் நிகழ்வுத் தொடரும் பொருளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: கூடியிருந்தோர் அனைவரும் எழுந்து இயேசுவைப் பிலாத்துவிடம் கொண்டுசென்றனர். ἅπαν τὸ πλῆθος αὐτῶν என்பதிலுள்ள கூட்டுப் பெயர்ச்சொல் நுணுக்கம் முதன்மை உரையில் ‘அவர்கள் அனைவரும்’ என இயல்பாக்கப்பட்டாலும், அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.'
  naturalness: ‘அவர்கள் அனைவரும் எழுந்து, அவரைப் பிலாத்துவிடம் அழைத்துச் சென்றார்கள்’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான கதைநடை. ‘அழைத்துச் சென்றார்கள்’ இச்சூழலில் வழிநடத்திக் கொண்டுசென்ற பொருளை இயல்பாகத் தருகிறது.
