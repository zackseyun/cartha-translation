reference: Luke 23:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: ta
  text: அவர்கள் அனைவரும் எழுந்து, அவரைப் பிலாத்துவிடம் அழைத்துச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய முழுக் கூட்டமும் எழுந்து, அவரைப் பிலாத்துவிடம் அழைத்துச் சென்றது.”
    reason: πλῆθος என்பதன் வெளிப்படையான கூட்டுப் பெயர்ச்சொல் பொருளைப் பாதுகாக்கும் சொல்லாக்க மாற்று.
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் நிகழ்வுத் தொடரை இயல்பாக வெளிப்படுத்த தனியாக ‘மேலும்’ அல்லது ‘பின்பு’ சேர்க்கத் தேவையில்லை; அத்தகைய சொல் மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலை உண்டாக்கலாம்.
- source_word: ἀναστὰν
  choice: எழுந்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் செயலைத் தமிழில் இயல்பான வினையெச்சமாகக் காட்டுகிறது.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: அவர்கள் அனைவரும்
  rationale: ἅπαν என்பதன் முழுமையையும் αὐτῶν என்பதன் தொடர்பையும் இயல்பான நவீன தமிழில் தருகிறது. πλῆθος குறிக்கும் கூட்டுக் குழு இங்கு பன்மை வினையுடன் இயல்பாக வெளிப்படுகிறது; அதன் வெளிப்படையான பெயர்ச்சொல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἤγαγον
  choice: அழைத்துச் சென்றார்கள்
  rationale: ἄγω என்பதன் வழிநடத்தி ஒரு நபரிடம் கொண்டுசெல்லும் பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; ‘கொண்டுபோனார்கள்’ என்பதைவிட கண்ணியமான நடை.
- source_word: αὐτὸν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருளைத் தமிழின் மரியாதை ஒருமையில் இயல்பாக வழங்குகிறது.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: பிலாத்துவிடம்
  rationale: இயக்க வினையுடன் வரும் ἐπί + வேற்றுமை உருபு ஒரு நபரை நோக்கிய சென்றடைதலைக் குறிக்கிறது; ‘பிலாத்துவின் முன்னிலையில்’ என்பது சூழலால் சாத்தியமானாலும் அதிக விளக்கமாகிவிடும்.
- source_word: Πιλᾶτον
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்வடிவம்; ‘-விடம்’ இணையும் போது ‘பிலாத்துவிடம்’ ஆகிறது.
theological_decisions:
- issue: நீதிவிசாரணைச் சூழலில் கூட்டுப் பொருளின் மொழிபெயர்ப்பு
  choice: அவர்கள் அனைவரும்
  alternative: அவர்களுடைய முழுக் கூட்டமும்
  rationale: இது முந்தைய விசாரணையில் கூடியிருந்தவர்களை மொத்தமாகக் குறிக்கிறது. ‘அவர்கள் அனைவரும்’ இயல்பான தமிழாக இருந்தாலும், குழு அல்லது கூட்டம் என்ற πλῆθος-இன் நுணுக்கம் மாற்று மொழிபெயர்ப்பாக அடிக்குறிப்பில் வைக்கப்படுகிறது; ஓர் அதிகாரபூர்வ நிறுவனமாகவோ சீரற்ற பொதுமக்கள் கூட்டமாகவோ மிகைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘அழைத்துச் சென்றார்கள்’ காவலில் வழிநடத்திச் சென்ற சூழலை இயல்பாகக் காட்டுகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
