base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: ta
  text: 'அவருக்கு மேலே[b] ஒரு எழுதப்பட்ட அறிவிப்பும்[a] இருந்தது: “இவரே யூதர்களின் அரசர்.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எழுதப்பட்ட அறிவிப்பு” என்பதை “எழுத்து,” “அறிவிப்பு,” அல்லது “குற்றச்சாட்டு வாசகம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவருக்கு மேலே” என்பதை “அவர்மேல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'கிரேக்கத்தில் சொல்லுக்குச் சொல்: “யூதர்களின் அரசர்—இவர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: எழுத்துப் பலகை
  rationale: சிலுவையில் அறையப்பட்டவருக்கு மேலே வைக்கப்பட்ட எழுதப்பட்ட அறிவிப்பை இயல்பான தமிழில் குறிக்கிறது; அதைச் சட்டப்பூர்வமான ‘குற்றச்சாட்டு’ என்று தேவையின்றி விளக்கவில்லை.
- source_word: ἐπ’ αὐτῷ
  choice: அவருக்கு மேலாக
  rationale: ἐπί + இடவேற்றுமையின் இடம்சார்ந்த பொருளைக் காத்து, பலகை இயேசுவுக்கு மேலே இருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: இவர்தான் யூதர்களின் ராஜா
  rationale: வினைச்சொல் இல்லாத கிரேக்கத் தொடரை இயல்பான தமிழாக்கமாக்குவதோடு, இறுதியில் வரும் οὗτος என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலை ‘இவர்தான்’ என்று காக்கிறது.
- source_word: Ἰουδαίων
  choice: யூதர்கள்
  rationale: சிலுவைத் தலைப்பில் வரும் நிலையான இன-அரசியல் அடையாளத்துக்கு ‘யூதர்கள்’ என்பதே சூழலுக்குப் பொருத்தமான, வழக்கிலுள்ள தமிழ் வடிவம்.
- source_word: δὲ καὶ
  choice: -உம் இருந்தது
  rationale: கதையில் மேலும் ஒரு விவரத்தைச் சேர்க்கும் இணைப்பு மற்றும் சேர்க்கைப் பொருளை தமிழின் இயல்பான ‘-உம்’ அமைப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சிலுவை எழுத்துப் பலகையின் தன்மை
  choice: அது இயேசுவை ‘யூதர்களின் ராஜா’ என்று அடையாளப்படுத்திய எழுதப்பட்ட பலகை என நேரடியாக மொழிபெயர்த்தல்
  alternative: அதை முறையான சட்டக் குற்றச்சாட்டாக மொழிபெயர்த்தல் அல்லது அதன் நையாண்டி/அரசியல் நோக்கத்தை வெளிப்படையாகச் சேர்த்தல்
  rationale: வசனம் பலகை இருந்ததையும் அதில் எழுதப்பட்டிருந்த சொற்களையும் மட்டுமே தெரிவிக்கிறது. நையாண்டி, குற்றச்சாட்டு அல்லது மேசியாவைப் பற்றிய அறிக்கை என்ற விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் உள்ளார்ந்த இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டது. பாரம்பரிய சிலுவைத் தலைப்புடன் ஒத்துச் செல்ல ‘யூதர்கள்’ மற்றும் ‘ராஜா’ தேர்ந்தெடுக்கப்பட்டன; கிரேக்கத்தின் சுட்டுவலியுறுத்தல் ‘இவர்தான்’ மூலம் காக்கப்பட்டது.
