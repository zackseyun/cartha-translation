id: LUK.23.35
reference: Luke 23:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: ta
  text: மக்கள் நின்று பார்த்துக்கொண்டிருந்தார்கள். தலைவர்களும்கூட அவரை ஏளனம் செய்து, “இவன் மற்றவர்களைக் காப்பாற்றினான்; இவன் கடவுளின் மெசியாவும் தேர்ந்தெடுக்கப்பட்டவருமாக இருந்தால், தன்னையே காப்பாற்றிக்கொள்ளட்டும்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: நின்று
  rationale: இங்கு வினை வடிவம் காட்சியின் நிலையான பின்னணியை அமைக்கிறது; ‘நின்று’ என்பது உடல் நிலையைக் இயல்பாகத் தெரிவிக்கிறது.
- source_word: θεωρῶν
  choice: பார்த்துக்கொண்டிருந்தார்கள்
  rationale: மக்கள் தொடர்ந்து நிகழ்வைப் பார்த்துக்கொண்டிருந்ததைத் தொடர்நிலை வடிவம் வெளிப்படுத்துகிறது.
- source_word: ἐξεμυκτήριζον
  choice: ஏளனம் செய்து
  rationale: இச்சொல் இகழ்ச்சியும் பரிகாசமும் கலந்த கேலியைக் குறிக்கிறது; தமிழில் ‘ஏளனம் செய்து’ அந்தத் தொனியைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: ἄρχοντες
  choice: தலைவர்கள்
  rationale: சூழலில் ஆளும் அதிகாரம் கொண்ட யூதத் தலைவர்களைக் குறிக்கிறது; ‘தலைவர்கள்’ இயல்பானதும் தேவையற்ற அரசியல் குறிப்பைச் சேர்க்காததும் ஆகும்.
- source_word: Ἄλλους ἔσωσεν / σωσάτω ἑαυτόν
  choice: மற்றவர்களைக் காப்பாற்றினான் / தன்னையே காப்பாற்றிக்கொள்ளட்டும்
  rationale: இரு இடங்களிலும் ஒரே வேர் சொல்லின் மீளுரையைப் பேணி, கேலிப் பேச்சின் முரண்பாட்டையும் வலிமையையும் காக்கிறது.
- source_word: εἰ οὗτός ἐστιν
  choice: இவன் … என்றால்
  rationale: οὗτός என்பதன் சுட்டும், இச்சூழலில் சற்றே இகழும் தொனியையும் ‘இவன்’ இயல்பாகப் பேணுகிறது.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: கடவுளின் மெசியா
  rationale: Χριστός இங்கு பெயரைப் போல அல்லாமல் பட்டமாக வருகிறது; ‘மெசியா’ அதன் பட்டத் தன்மையைத் தமிழில் பரவலாக அறியப்படும் வடிவில் காக்கிறது.
- source_word: ὁ ἐκλεκτός
  choice: தேர்ந்தெடுக்கப்பட்டவர்
  rationale: இது இன்னொரு பட்டமாகச் செயல்படுகிறது; ‘தேர்ந்தெடுக்கப்பட்டவர்’ அதன் இறையியல் நிறையைக் கூடுதல் விளக்கமின்றி நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைக் பட்டமாக மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது இயேசுவின் பெயரின் பகுதியாக அல்ல, கடவுளுக்குரிய அபிஷேகம் பெற்ற அரசர்/மீட்பர் என்ற பட்டமாகப் பயன்படுத்தப்படுகிறது. ‘மெசியா’ அந்தப் பட்டத் தன்மையைத் தெளிவாக வைத்திருக்கிறது.
- issue: ὁ ἐκλεκτός என்பதன் பட்டத் தன்மை
  choice: தேர்ந்தெடுக்கப்பட்டவர்
  alternative: தெரிந்துகொள்ளப்பட்டவர்
  rationale: தலைவர்கள் கேலியாகப் பயன்படுத்தினாலும், மூலத்தில் உள்ள கிறிஸ்துவியல் பட்டத்தின் வலிமையைச் சுருக்காமல், நவீன வாசகருக்குப் புரியும் வகையில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தலைவர்களின் இகழ்ச்சித் தொனியை ‘இவன்’ மற்றும் கட்டளை வடிவம் மூலம் பேணியுள்ளோம்; அவர்களின் கூற்றை விளக்கி இறையியல் பதற்றத்தைத் தீர்க்க முயலவில்லை.
