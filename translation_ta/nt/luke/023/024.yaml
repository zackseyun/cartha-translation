  text: And Pilate decided that their demand should be granted[a].
translation:
  language: ta
  text: அவர்களுடைய கோரிக்கை நிறைவேற்றப்பட வேண்டும் என்று பிலாத்து தீர்ப்பளித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “அவர்களுடைய கோரிக்கை நிறைவேறும்படி பிலாத்து தீர்ப்பளித்தார்.”'
    reason: γενέσθαι என்பதன் வடிவத்தை ‘நிறைவேற்றப்பட வேண்டும்’ அல்லது ‘நிறைவேறும்படி’ என இயல்பாக வெளிப்படுத்தக்கூடிய மொழிபெயர்ப்பு மாற்று.
lexical_decisions:
- source_word: καὶ
  choice: (தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை)
  rationale: முந்தைய நிகழ்வுடன் இணைக்கும் பொதுவான இணைப்புச்சொல். தனி வசனமாக வாசிக்கும்போது தமிழில் ‘அப்போது’ அல்லது ‘எனவே’ என்று சேர்ப்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத கால அல்லது காரண நுணுக்கத்தைப் புகுத்தும்; ஆகவே இயல்பான தமிழ் நடைக்காக மறைமுகமாக விடப்பட்டுள்ளது.
- source_word: Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἐπέκρινεν
  choice: தீர்ப்பளித்தார்
  rationale: இங்கு வினைச்சொல் ஒரு நீதித்துறை முடிவை அறிவிப்பதைக் குறிக்கிறது. ‘முடிவுசெய்தார்’ என்பதைக் காட்டிலும் சட்டரீதியான நுணுக்கத்தைத் தெளிவாகக் காக்கிறது; ‘தண்டனை விதித்தார்’ என்பது குற்றத்துக்கான தண்டனையை அளவுக்கு மீறிக் குறிப்பாக்கும்.
- source_word: γενέσθαι
  choice: நிறைவேற்றப்பட வேண்டும்
  rationale: கோரப்பட்ட காரியம் நிகழுமாறு அதிகாரபூர்வமாக அனுமதிக்கப்பட்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ αἴτημα
  choice: கோரிக்கை
  rationale: αἴτημα என்பதன் ‘வேண்டுகோள்/கோரிக்கை’ என்ற பொருள் வரம்பைத் தக்கவைக்கிறது. சூழலில் வற்புறுத்தல் இருந்தாலும், ‘கட்டளை’ அல்லது ‘நிர்ப்பந்தம்’ என்று மூலத்தைவிட வலுப்படுத்தவில்லை.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: முன்னர் கோரிக்கை வைத்த மக்கள் மற்றும் தலைவர்களைக் குறிக்கும் பன்மை உடைமை வடிவம்.
theological_decisions:
- issue: பிலாத்துவின் செயலிலுள்ள நீதித்துறை நுணுக்கம்
  choice: அவர்களுடைய கோரிக்கை நிறைவேற்றப்பட வேண்டும் என்று பிலாத்து தீர்ப்பளித்தார்
  alternative: அவர்களுடைய கோரிக்கை நிறைவேறும்படி பிலாத்து முடிவுசெய்தார்
  rationale: ‘தீர்ப்பளித்தார்’ என்பது பிலாத்துவின் அதிகாரபூர்வ நீதித்துறை முடிவைக் காக்கிறது. அதேவேளையில், இயேசுவுக்கு நேரடியாகத் தண்டனை விதித்தார் என்று மூலத்தில் உள்ளதைவிட அதிகமாகக் கூறுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நீதித்துறைத் தன்மையைத் தக்கவைக்க ‘தீர்ப்பளித்தார்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
