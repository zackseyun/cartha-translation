source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: ta
  text: ஏரோது இயேசுவைக் கண்டபோது மிகவும் மகிழ்ந்தான். ஏனெனில், அவரைப் பற்றித் தொடர்ந்து கேள்விப்பட்டு வந்ததால்[a], அவரைக் காண நீண்ட காலமாக விரும்பியிருந்தான்; மேலும், அவர் செய்யும் ஏதாவது ஓர் அடையாளத்தைக்[b] காணலாம் என்று எதிர்பார்த்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைப் பற்றிக் கேள்விப்பட்டிருந்ததால்.’ கிரேக்கத்தை இவ்வாறு எளிமையாகவும் மொழிபெயர்க்கலாம்; ஆனால் நிகழ்கால வினையெச்ச வடிவம் மீண்டும் மீண்டும் அல்லது தொடர்ந்து கேள்விப்பட்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அற்புதத்தை.’ கிரேக்கத்தில் ‘அடையாளம்’ (σημεῖον) என்று உள்ளது; குறிப்பிடத்தக்க அடையாளமாகக் கருதப்படும் ஓர் அற்புதச் செயலையும் இச்சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: மிகவும் மகிழ்ந்தான்
  rationale: χαίρω என்பதன் மகிழ்ச்சி உணர்வையும் λίαν என்பதன் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: நீண்ட காலமாக
  rationale: கிரேக்கம் குறிப்பிடும் நீடித்த காலத்தைத் துல்லியமாகக் காட்டுகிறது; ‘பல ஆண்டுகளாக’ என்று கால அளவை மிகையாகக் குறிப்பதில்லை.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: அவரைக் காண ... விரும்பியிருந்தான்
  rationale: ἦν + θέλων என்ற தொடர்நிலை அமைப்பின் கடந்தகால நீடித்த விருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: அவரைப் பற்றித் தொடர்ந்து கேள்விப்பட்டு வந்ததால்
  rationale: διά + articular infinitive காரணத்தைக் குறிக்கிறது; நிகழ்கால infinitive ஆன ἀκούειν பலமுறை அல்லது தொடர்ச்சியாகக் கேட்டுவந்த நுணுக்கத்தை அனுமதிக்கிறது.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: ஏதாவது ஓர் அடையாளத்தைக் காணலாம் என்று எதிர்பார்த்துக்கொண்டிருந்தான்
  rationale: ἤλπιζεν என்பதிலுள்ள தொடர்ந்த எதிர்பார்ப்பையும் σημεῖον என்பதன் ‘அடையாளம்’ என்ற பரந்த பொருளையும் பாதுகாக்கிறது.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: அவர் செய்யும்
  rationale: அந்த அடையாளம் இயேசுவால் நிகழ்த்தப்படும் செயல் என்பதைக் குறிக்கும் ὑπό-வின் செயற்படுத்துநர் உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ δὲ Ἡρῴδης
  choice: ஏரோது
  rationale: δέ கதையின் முன்னேற்றத்தைக் குறிக்கும் மென்மையான இணைப்புச் சொல்; தமிழில் புதிய, தேவையற்ற காலச் சுட்டைச் சேர்க்காமல் வாக்கியத் தொடரே அந்தப் பணியைச் செய்கிறது.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: இயேசுவைக் கண்டபோது
  rationale: Aorist participle-க்கும் முதன்மை வினைக்கும் இடையிலுள்ள இயல்பான கால உறவைத் தெளிவான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: σημεῖον என்பதன் பொருள்
  choice: அடையாளம்
  alternative: அற்புதம்
  rationale: சூழலில் அற்புதச் செயல் குறிக்கப்பட்டாலும், கிரேக்கச் சொல் குறிப்பிடத்தக்க அல்லது சான்றளிக்கும் அடையாளம் என்ற விரிவான பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘இப்போது’ போன்ற கதைத்தொடக்கச் சொல்லைச் சேர்க்கவில்லை; காரணம், நீடித்த விருப்பம், தொடர்ந்த கேள்விப்பாடு, எதிர்பார்ப்பு ஆகிய உறவுகள் தெளிவாக வைக்கப்பட்டுள்ளன.
