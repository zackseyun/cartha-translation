reference: Luke 23:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: ta
  text: இயேசு உரத்த குரலில் கூப்பிட்டு, “தந்தையே, உமது கைகளில் என் ஆவியை ஒப்படைக்கிறேன்[a]” என்றார்.[b] இப்படிச் சொல்லி, தமது கடைசி மூச்சை விட்டார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பொறுப்பில் வைக்கிறேன்.” இந்த வினைச்சொல் ஒன்றை மற்றொருவரின் பாதுகாப்பில் ஒப்படைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இந்தச் சொற்கள் கிரேக்க வேதாகமத்திலுள்ள சங்கீதம் 31:5-ஐ எதிரொலிக்கின்றன: “உமது கைகளில் என் ஆவியை ஒப்படைக்கிறேன்.”'
    reason: cross_reference
  - marker: c
    text: அதாவது, அவர் இறந்தார். கிரேக்க வினைச்சொல் நேரடியாக மூச்சை வெளியே விடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: உரத்த குரலில் கூப்பிட்டு
  rationale: φωνέω என்பதன் வலிமையான அழைப்பையும், φωνῇ μεγάλῃ என்பதன் உரத்த தன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Πάτερ
  choice: தந்தையே
  rationale: உடமைச்சொல் சேர்க்காமல், கிரேக்க மூலத்திலுள்ள நேரடி விளிப்பைத் தக்கவைக்கிறது.
- source_word: εἰς χεῖράς σου
  choice: உமது கைகளில்
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவத்தையும் சங்கீதம் 31:5-ஐ எதிரொலிக்கும் வேதமொழி நடையையும் பாதுகாக்கிறது.
- source_word: παρατίθεμαι
  choice: ஒப்படைக்கிறேன்
  rationale: மற்றொருவரின் பாதுகாப்பிலும் பொறுப்பிலும் ஒன்றை வைப்பது என்ற நடுவினை உணர்வை இயல்பாக வெளிப்படுத்துகிறது; நிகழ்காலத்தின் செயற்படுத்தும் அறிவிப்புத் தன்மையையும் காக்கிறது.
- source_word: τὸ πνεῦμά μου
  choice: என் ஆவி
  rationale: πνεῦμα என்பதன் ‘மூச்சு’ என்ற சாத்தியத்தை மறுக்காமல், தந்தையிடம் உணர்வுடன் தம்மை ஒப்படைக்கும் ஜெபச் சூழலில் உள்ள ஆன்மீக ஆழத்தைப் பாதுகாக்கிறது.
- source_word: τοῦτο δὲ εἰπών
  choice: இப்படிச் சொல்லி
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் கிரேக்க இறந்தகாலப் பெயரெச்சத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξέπνευσεν
  choice: தமது கடைசி மூச்சை விட்டார்
  rationale: இறப்பைக் குறிக்கும் வினையின் மூச்சு சார்ந்த படிமத்தைத் தக்கவைத்து, தமிழில் தெளிவாகவும் மரியாதையாகவும் சொல்கிறது.
theological_decisions:
- issue: τὸ πνεῦμά μου என்பதன் பொருள்
  choice: என் ஆவி
  alternative: என் மூச்சு
  rationale: இது தந்தையிடம் உரைக்கப்படும் நோக்கமுள்ள ஒப்படைப்பு என்பதால் ‘ஆவி’ என்பது சூழலுக்கு ஏற்றது; அதேவேளை, வசனத்திற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: παρατίθεμαι என்பதன் வினையம்சம்
  choice: ஒப்படைக்கிறேன்
  alternative: ஒப்படைத்துக்கொண்டிருக்கிறேன்
  rationale: கிரேக்கத்தில் நிகழ்கால நடுவினையாக இருந்தாலும், இங்கு அது ஒரு செயற்படுத்தும் உறுதியுரையாக உள்ளது. தமிழ் எளிய நிகழ்காலம் அதன் நோக்கமுள்ள தனிப்பட்ட ஒப்படைப்பை இயல்பாகக் காட்டுகிறது.
- issue: ἐξέπνευσεν என்பதன் மரணக் குறிப்பு
  choice: தமது கடைசி மூச்சை விட்டார்
  alternative: இறந்தார்
  rationale: மரணத்தைத் தெளிவாக உணர்த்திக்கொண்டே, மூல வினையில் உள்ள ‘மூச்சை வெளியே விடுதல்’ என்ற படிமத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தையே’, ‘உமது’ போன்ற வடிவங்கள் ஜெபச் சூழலின் மரியாதையையும் நெருக்கத்தையும் தருகின்றன; தேவையற்ற பழமையான அல்லது சமயப் பிரிவுக்குரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
