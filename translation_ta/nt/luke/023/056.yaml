  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: ta
  text: அவர்கள் திரும்பிய பின்[a], நறுமணப் பொருட்களையும் நறுமணத் தைலங்களையும்[b] ஆயத்தப்படுத்தினார்கள். ஓய்வுநாளில் அவர்கள் கட்டளையின்படி ஓய்வெடுத்தார்கள்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திரும்பிய அவர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பங்கேற்புவினை, முதன்மை வினைக்கு முன் இந்தச் செயல் நிகழ்ந்ததைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “நறுமணத் தைலங்கள்” என்பதை “வாசனை எண்ணெய்கள்” அல்லது “நறுமணக் களிம்புகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: அவர்கள் திரும்பிய பின்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முன்னர் பெண்கள் திரும்பியதைச் சுட்டுகிறது. சென்ற இடத்தைக் குறிப்பிடாமல் மூலத்தின் அளவையே காக்கிறது.
- source_word: δὲ
  choice: பின்
  rationale: கதையின் தொடர்ச்சியை இயல்பான தமிழில் மெதுவாகக் குறிக்கிறது.
- source_word: ἡτοίμασαν
  choice: ஆயத்தப்படுத்தினார்கள்
  rationale: அடக்கத்திற்குப் பயன்படுத்த வேண்டிய பொருட்களைத் தயாரித்தார்கள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀρώματα
  choice: நறுமணப் பொருட்கள்
  rationale: அடக்கச் சூழலில் உடலுக்குப் பயன்படுத்தப்பட்ட மணமுள்ள பொருட்களைச் சுட்டுகிறது; μύρα என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: μύρα
  choice: நறுமணத் தைலங்கள்
  rationale: மணம் சேர்க்கப்பட்ட எண்ணெய்கள் அல்லது தைலங்கள் என்ற சொல்லின் பொருளை நவீன தமிழில் துல்லியமாகத் தருகிறது.
- source_word: τὸ μὲν σάββατον
  choice: ஓய்வுநாளிலோ
  rationale: குறிப்பிட்ட ஓய்வுநாளை காலக் குறிப்பாகத் தருகிறது; μέν என்பதன் மெதுவான மாற்றத் தொனியை ‘-லோ’ வெளிப்படுத்துகிறது.
- source_word: ἡσύχασαν
  choice: ஓய்ந்திருந்தார்கள்
  rationale: ஓய்வுநாள் சூழலில் செயல்களை நிறுத்தி ஓய்ந்திருந்தார்கள் என்ற பொருளைத் தருகிறது.
- source_word: κατὰ τὴν ἐντολήν
  choice: கட்டளையின்படி
  rationale: கட்டளைக்கு இணங்க நடந்ததைச் சுருக்கமாகக் காட்டி, மூலத்திலுள்ள ஒருமையைக் காக்கிறது.
theological_decisions:
- issue: ‘கட்டளை’ எதைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘கட்டளை’ என்று மட்டும் மொழிபெயர்த்து, சூழலில் ஓய்வுநாளைக் குறித்த மோசேயின் கட்டளை என்பதை உணர்த்துதல்
  alternative: ‘ஓய்வுநாளைக் குறித்த மோசேயின் கட்டளையின்படி’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: சூழல் தோராவின் ஓய்வுநாள் கட்டளையைச் சுட்டினாலும், கிரேக்க உரை அதை விரித்துக் கூறவில்லை. ஆகவே தேவையற்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அதன் இறையியல் தொடர்பைத் திறந்தவாறே காக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ἀρώματα மற்றும் μύρα ஆகிய இரு சொற்களின் வேறுபாட்டை ‘நறுமணப் பொருட்கள்’ மற்றும் ‘நறுமணத் தைலங்கள்’ எனக் காத்துள்ளோம். ஆங்கில ஆலோசனை உரையில் [b] குறி கட்டளைக்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு μύρα பற்றியது என்பதால் தமிழில் அது தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
