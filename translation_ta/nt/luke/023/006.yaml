  source_fidelity: 'மூலத்தின் Πιλᾶτος δὲ ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν என்ற அமைப்பு துல்லியமாகப் பிரதிபலிக்கப்படுகிறது: பிலாத்துவின் எதிர்வினை, கேட்டதற்குப் பிந்தைய காலத் தொடர்பு, மறைமுக ஆம்/இல்லை வினா, மற்றும் கலிலேயப் பிரதேச அடையாளம் அனைத்தும் காக்கப்பட்டுள்ளன.'
  naturalness: “ஆனால் பிலாத்து இதைக் கேட்டபோது, அந்த மனிதர் கலிலேயரா என்று விசாரித்தார்” என்பது நவீன நிலையான தமிழில் இயல்பான, தெளிவான கதைநடை. “விசாரித்தார்” இச்சூழலில் ‘asked/inquired’ என்பதற்கு ஏற்ற மரியாதைநடைத் தேர்வாகும்.
  terminology: “பிலாத்து” தமிழ் வேதாகம வழக்கில் நிலைபெற்ற பெயர்வடிவம். “கலிலேயர்” என்பது Γαλιλαῖος என்பதன் பிரதேச/அடையாளப் பொருளைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது. “அந்த மனிதர்” சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட நபரை அடையாளப்படுத்தும் இயல்பான தமிழாக்கம்; மூலத்தில் இல்லாத புதிய தெய்வீக அல்லது விளக்க வலியுறுத்தலைச் சேர்ப்பதில்லை.
