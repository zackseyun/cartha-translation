  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: ta
  text: ஆனால் பிலாத்து இதைக் கேட்டபோது, அந்த மனிதர் கலிலேயரா என்று விசாரித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதையோட்டத்தில் ஏற்படும் மெல்லிய திருப்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἀκούσας
  choice: இதைக் கேட்டபோது
  rationale: பிலாத்தைக் குறிக்கும் இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இதை’ என்பது முந்தைய உரையாடல் சூழலிலிருந்து நிரப்பப்படுகிறது.
- source_word: ἐπηρώτησεν
  choice: விசாரித்தார்
  rationale: ஒரு தகவலை உறுதிப்படுத்தக் கேட்பதை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: εἰ
  choice: …ஆ என்று
  rationale: மறைமுக ஆம்/இல்லை வினாவைத் தமிழில் இயல்பாக அமைக்கிறது.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதர்
  rationale: குறிப்பிட்ட மனிதரான இயேசுவைச் சுட்டும் கிரேக்க உறுப்பு தமிழில் இயல்பாக ‘அந்த’ என வெளிப்படுகிறது; மூலத்தில் இல்லாத ‘இந்த’ என்ற அண்மை வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: Γαλιλαῖός
  choice: கலிலேயர்
  rationale: கலிலேயாவைச் சேர்ந்தவர் என்ற பிரதேச அடையாளத்தைப் பெயர்ச்சொல் வடிவில் நேரடியாகக் குறிக்கிறது.
- source_word: ἐστιν
  choice: கலிலேயரா
  rationale: கிரேக்க நிகழ்கால இணைப்புவினையின் பொருள் தமிழின் மறைமுக வினா அமைப்பில் இயல்பாகப் பொதிந்துள்ளது; தேவையற்ற காலப் பின்னகர்த்தல் செய்யப்படவில்லை.
