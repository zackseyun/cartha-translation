  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: ta
  text: ஆனால் அவர்களோ, அவர் சிலுவையில் அறையப்பட வேண்டும் என்று உரத்த குரல்களுடன்[a] கேட்டுக்கொண்டு, விடாமல் வற்புறுத்தினார்கள்; அவர்களுடைய குரல்கள் மேலோங்கின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உரத்த கூக்குரல்களுடன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘குரல்கள்’ என்பதற்கான அதே சொல் இரண்டு வாக்கியக் கூறுகளிலும் திரும்ப வருகிறது; இச்சூழலில் அதை ‘கூக்குரல்கள்’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: விடாமல் வற்புறுத்தினார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் அவர்கள் ஒருமுறை மட்டும் கேட்டதைக் காட்டாமல், தொடர்ந்து தீவிரமாக அழுத்தம் கொடுத்ததைக் காட்டுகிறது.
- source_word: φωναῖς μεγάλαις
  choice: உரத்த குரலில்
  rationale: இந்தச் சூழலில் φωνή என்பது ‘குரல்’ அல்லது ‘கூக்குரல்’ எனப் பொருள்படலாம். இயல்பான நவீன தமிழில் உரத்த ஒலியையும் வற்புறுத்திய விதத்தையும் ‘உரத்த குரலில்’ தெளிவாகக் காட்டுகிறது.
- source_word: αἰτούμενοι
  choice: கேட்டுக்கொண்டு
  rationale: αἰτέω என்பதன் அடிப்படைப் பொருளான ‘கேட்பது’ என்பதைக் காக்கிறது; கோரிக்கையின் கடுமையைச் சுற்றியுள்ள ‘விடாமல் வற்புறுத்தினார்கள்’ என்பதே வெளிப்படுத்துகிறது.
- source_word: αὐτὸν σταυρωθῆναι
  choice: அவர் சிலுவையில் அறையப்பட வேண்டும் என்று
  rationale: கிரேக்கச் செயலப்பாட்டு வினையின் செயப்பாட்டு நிலையைக் காத்து, தமிழில் தெளிவான உள்ளடக்க வாக்கியமாக வழங்குகிறது.
- source_word: κατίσχυον
  choice: மேலோங்கின
  rationale: அவர்களுடைய குரல்கள் நடவடிக்கையில் மேலாதிக்கம் பெற்று வென்றதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; கிரேக்க இறந்தகாலத் தொடர்நிலை நிகழ்வின் முன்னேற்றத்தைக் குறித்தாலும், தமிழில் இவ்வடிவம் சூழலில் அந்த விளைவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: αἱ φωναὶ αὐτῶν
  choice: அவர்களுடைய குரல்களே
  rationale: மூலத்தில் φωνή மீண்டும் வருவதை ‘குரல்’ என்ற சொல்லைத் திரும்பப் பயன்படுத்திக் காக்கிறது; ‘-ஏ’ அவர்களின் குரல்கள்தான் மேலோங்கின என்ற அழுத்தத்தையும் இயல்பாக வழங்குகிறது.
