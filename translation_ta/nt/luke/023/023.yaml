  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கேட்டுக்கொண்டு’ என்பது சொற்பொருளைக் காக்க, ‘விடாமல் வற்புறுத்தினார்கள்’ என்பது தொடர்ச்சியான கடுமையான அழுத்தத்தை வெளிப்படுத்துகிறது. மூலத்தில் வரும் ‘குரல்’ என்ற சொல்லின் மறுபயன்பாடு தமிழிலும் இயன்ற அளவு காக்கப்பட்டுள்ளது.
