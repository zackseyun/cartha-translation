source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: ta
  text: அவர்கள் இயேசுவை அழைத்துச் சென்றபோது, ஊர்ப்புறத்திலிருந்து வந்துகொண்டிருந்த[a] சிரேனேவைச் சேர்ந்த சீமோன் என்ற ஒருவனைப் பிடித்து, இயேசுவுக்குப் பின்னால் சுமக்கும்படி சிலுவையை[b] அவன்மேல் வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயலிலிருந்து வந்துகொண்டிருந்த.” கிரேக்கச் சொல் குறிப்பிட்ட ஒரு வயலையோ, பொதுவாக நகருக்கு வெளியேயுள்ள ஊர்ப்புறத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சிலர் இங்கே “சிலுவை” என்பதை இன்னும் குறிப்பாக “சிலுவையின் குறுக்குச் சட்டம்” என்று புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்க மூல உரை “சிலுவை” என்றே கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: அழைத்துச் சென்றபோது
  rationale: காவலில் ஒருவரை ஓரிடத்திலிருந்து அழைத்துச் செல்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐπιλαβόμενοι
  choice: பிடித்து
  rationale: இச்சூழலில் ஒருவரைப் பலவந்தமாகப் பற்றிக்கொண்ட செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: சிரேனேவைச் சேர்ந்த சீமோன் என்ற ஒருவனை
  rationale: τινα தரும் அறிமுகப்படுத்தும் நிர்ணயமின்மையையும், Κυρηναῖον தரும் ஊர்ச் சார்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: ஊர்ப்புறத்திலிருந்து வந்துகொண்டிருந்த
  rationale: ἀγρός என்பது குறிப்பிட்ட வயலையோ பொதுவாக நகருக்கு வெளியேயுள்ள ஊர்ப்புறத்தையோ குறிக்கலாம்; முதன்மை உரையில் பரந்த பொருள் தேர்ந்தெடுக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: சிலுவையை அவன்மேல் வைத்தார்கள்
  rationale: சுமக்க வேண்டிய பாரத்தை அவன்மேல் வைத்தார்கள் என்ற கிரேக்கச் சொல்லமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: τὸν σταυρὸν
  choice: சிலுவையை
  rationale: σταυρός என்பதன் நேரடியான பொருளை வழங்குகிறது; உரையில் வெளிப்படையாக இல்லாத வரலாற்று மறுகட்டமைப்பை முதன்மை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: φέρειν
  choice: சுமந்துவரும்படி
  rationale: உடல் பாரத்தைத் தூக்கிச் செல்லும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: இயேசுவுக்குப் பின்னால்
  rationale: ὄπισθεν குறிக்கும் இடநிலையை நேரடியாகக் காத்து, ஊர்வலத்தில் இயேசுவின் பின்னால் சென்றதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: சிலுவைப்பாட்டு நிகழ்வில் σταυρός என்பதை இன்னும் குறிப்பாகக் குறுக்குச் சட்டம் என்று மொழிபெயர்க்க வேண்டுமா?
  choice: சிலுவை
  alternative: சிலுவையின் குறுக்குச் சட்டம்
  rationale: மூல உரை இன்னும் குறிப்பான சட்டத்தைக் குறிக்கும் சொல்லைப் பயன்படுத்தாமல் σταυρός என்றே கூறுகிறது. எனவே வரலாற்று மறுகட்டமைப்பை உரைக்குள் புகுத்தாமல் நேரடியான பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. “சீமோன் என்ற ஒருவன்” என்பது τινα தரும் அறிமுகப்படுத்தும் நுணுக்கத்தைச் செயற்கையான “ஒரு குறிப்பிட்ட” போன்ற தொடரின்றிக் காக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களின் பின்னரே வைக்கப்பட்டுள்ளன.
