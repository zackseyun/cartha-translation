revisions:
- from: அப்போது ஏற்கெனவே ஏறக்குறைய ஆறாம் மணி நேரமாயிருந்தது[a]; ஒன்பதாம் மணி நேரம்வரை நாடெங்கும்[b] இருள் உண்டாயிற்று.
  to: ஏற்கெனவே ஏறக்குறைய ஆறாம் மணிநேரமாக இருந்தது[a]; ஒன்பதாம் மணிநேரம் வரை நாடு முழுவதும்[b] இருள் உண்டாயிற்று.
  rationale: The revision removes an unsupported temporal addition and uses a more explicit modern-Tamil expression for the whole land. It retains the source’s approximation, ancient time expressions, and the lexical ambiguity of γῆ without deciding whether the darkness was regional or global.
