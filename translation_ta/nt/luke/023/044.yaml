id: LUK.23.44
reference: Luke 23:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: ta
  text: ஏற்கெனவே ஏறக்குறைய ஆறாம் மணிநேரமாக இருந்தது[a]; ஒன்பதாம் மணிநேரம் வரை நாடு முழுவதும்[b] இருள் உண்டாயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஏறக்குறைய நண்பகல் பன்னிரண்டு மணிமுதல் பிற்பகல் மூன்று மணிவரை.
    reason: cultural_note
  - marker: b
    text: அல்லது, “பூமி முழுவதும்.” γῆ என்ற கிரேக்கச் சொல் “நாடு/நிலம்” அல்லது “பூமி” என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: கதையின் இந்த நேரக்கட்டம் வந்துவிட்டிருந்ததைச் சுட்டுகிறது; கிரேக்கச் சொல்லின் காலநிலை வலியுறுத்தலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὡσεὶ
  choice: ஏறக்குறைய
  rationale: நேரம் துல்லியமானது அல்ல, தோராயமானது என்பதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ὥρα ἕκτη
  choice: ஆறாம் மணி நேரம்
  rationale: பண்டைய மணிக்கணக்கு முறையிலுள்ள மூல வெளிப்பாட்டைப் பிரதான உரையில் தக்கவைக்கிறது; இன்றைய நேரக் கணக்கிலான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σκότος
  choice: இருள்
  rationale: இச்சூழலில் தெளிவானதும் வழக்கமானதுமான தமிழ் இணைச்சொல்.
- source_word: ἐγένετο
  choice: உண்டாயிற்று
  rationale: இருள் ஒரு நிகழ்வாக ஏற்பட்டது என்ற γίνομαι வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: நாடெங்கும்
  rationale: γῆ என்பதன் ‘நாடு/நிலம்’ என்ற சூழலுக்கேற்ற, வரம்பான பொருளை இயல்பான தமிழில் தருகிறது; ‘பூமி முழுவதும்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἕως ὥρας ἐνάτης
  choice: ஒன்பதாம் மணி நேரம்வரை
  rationale: ‘ஆறாம் மணி நேரம்’ என்பதற்கு இணையாக மூலத்தின் நேரக் குறிப்பைத் தக்கவைக்கிறது; நவீன நேரத்திற்கு இணையான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இருள் சூழ்ந்த பரப்பைக் குறிக்கும் γῆ என்பதன் எல்லை
  choice: நாடெங்கும்
  alternative: பூமி முழுவதும்
  rationale: கிரேக்கச் சொல் ஒரு குறிப்பிட்ட நாட்டையோ நிலப்பரப்பையோ அல்லது பூமி முழுவதையுமோ குறிக்க முடியும். நிகழ்வின் பரப்பைத் தேவையின்றி உலகளாவியதாகத் தீர்மானிக்காமல் இருக்க, பிரதான உரையில் சூழலுக்கேற்ற வரம்பான பொருள் பயன்படுத்தப்பட்டு, விரிவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பண்டைய மணிக்கணக்கு பிரதான உரையில் தக்கவைக்கப்பட்டு, அதன் நவீன நேர இணை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; γῆ என்பதிலுள்ள பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளது.
