id: LUK.23.14
reference: Luke 23:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “மக்களை வழிதவறச் செய்கிறவன்[a] என்று இந்த மனிதனை என்னிடம் கொண்டுவந்தீர்கள். இதோ, உங்கள் முன்னிலையில் இவனை விசாரித்தபின், நீங்கள் இவன்மீது சுமத்தும் குற்றச்சாட்டுகளுக்கு எந்த அடிப்படையையும் இந்த மனிதனுக்கு எதிராக நான் காணவில்லை[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைத் திசைதிருப்புகிறவன்.” கிரேக்க வினைச்சொல் திருப்பிவிடுதல் அல்லது வழிதவறச் செய்தல் என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் இவன்மீது குற்றஞ்சாட்டுகிற காரியங்களில் இந்த மனிதனிடம் எந்தக் குற்றத்தையும் நான் காணவில்லை.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: என்னிடம் கொண்டுவந்தீர்கள்
  rationale: முடிவுற்ற கடந்தகாலச் செயலைக் குறிக்கும் வினையை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது; நீதிமன்றச் சூழலும் நீடிக்கிறது.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: இந்த மனிதனை
  rationale: குறிப்பிட்ட ஆண் நபரைக் குறிக்கும் மூலச்சொல்லின் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: மக்களை வழிதவறச் செய்கிறவன் என்று
  rationale: ἀποστρέφω என்பதன் ‘திருப்பிவிடுதல்/வழிதவறச் செய்தல்’ என்ற பொருள் வரம்பைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கலகத்துக்குத் தூண்டுதல்’ என்ற வலுவான பொருளைச் சேர்க்கவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கேட்போரின் கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலிமையைச் செம்மையான நவீன தமிழில் காக்கிறது.
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: உங்கள் முன்னிலையில் நான் இவனை விசாரித்தேன்
  rationale: விசாரணை அவர்களுடைய முன்னிலையில் நடைபெற்றது என்பதையும் ἀνακρίνω என்பதன் நீதித்துறை சார்ந்த பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: ஆதாரமாக எதையும் இந்த மனிதனிடம் நான் காணவில்லை
  rationale: αἴτιον என்பதைக் குற்றச்சாட்டிற்கான சட்டபூர்வ ஆதாரம் என்ற உடனடிச் சூழலில் மொழிபெயர்க்கிறது; இதைச் சூழலைத் தாண்டிய முழுமையான ஒழுக்கத் தீர்ப்பாக மாற்றவில்லை.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: நீங்கள் இவன்மீது சுமத்தும் குற்றச்சாட்டுகளுக்கு
  rationale: κατηγορέω என்பதன் சட்டம் சார்ந்த ‘குற்றஞ்சாட்டுதல்’ என்ற பொருளையும் அவருக்கு எதிரான குற்றச்சாட்டுகளுடனான தொடர்பையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பிலாத்துவின் அறிவிப்பின் தன்மை
  choice: அவர்கள் சுமத்திய குற்றச்சாட்டுகளுக்கு ஆதாரம் இல்லை என்ற நீதித்துறைத் தீர்மானமாக மொழிபெயர்த்தல்
  alternative: இந்த மனிதனிடம் எந்தக் குற்றமும் இல்லை
  rationale: ἀνακρίνω, αἴτιον, κατηγορέω ஆகிய சொற்கள் நீதிமன்றச் சூழலை உருவாக்குகின்றன. ஆகவே உடனடி சட்டப்பொருளைக் காத்து, அதற்கு அப்பாற்பட்ட முழுமையான இறையியல் அல்லது ஒழுக்கத் தீர்ப்பை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் செம்மையான நீதித்துறைச் சொல்லாட்சியைப் பயன்படுத்துகிறது. ‘இதோ’ என்பது ἰδοὺ-வின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. கிரேக்கப் பங்கேற்பு அமைப்பு தமிழில் இயல்பாக அமைய இரண்டு இணைந்த வாக்கியங்களாகத் தரப்பட்டுள்ளது.
