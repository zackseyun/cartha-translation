id: LUK.23.43
reference: Luke 23:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: ta
  text: 'அவர் அவனிடம்[a], “உண்மையாகவே உனக்குச் சொல்கிறேன்: இன்று நீ என்னுடன் பரதீசில் இருப்பாய்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சாத்தியம் குறைவாக: “உண்மையாகவே இன்று உனக்குச் சொல்கிறேன்: நீ என்னுடன் பரதீசில் இருப்பாய்.” கிரேக்க மூல உரையில் முதலில் நிறுத்தக்குறிகள் இல்லை; இந்த மாற்று வாசிப்பு “இன்று” என்பதை “இருப்பாய்” என்பதற்குப் பதிலாக “சொல்கிறேன்” என்பதுடன் இணைக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: உண்மையாகவே
  rationale: இயேசுவின் கூற்றை அதிகாரப்பூர்வமான உறுதிப்பாட்டுடன் அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் ஒலிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: σοι λέγω
  choice: உனக்குச் சொல்கிறேன்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடித் தன்மையையும், ஒருவரை நோக்கிப் பேசும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: σήμερον
  choice: இன்று
  rationale: முதன்மை வாசிப்பில் இது ‘இருப்பாய்’ என்பதோடு இணைந்து, வாக்குறுதி நிறைவேறும் காலத்தைச் சுட்டுகிறது; வேறு இணைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னுடன்
  rationale: இயேசுவோடு இருப்பதைத் தெளிவாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔσῃ
  choice: இருப்பாய்
  rationale: εἰμί என்பதன் எதிர்கால ஒருமை வடிவத்தை இயல்பான நவீன தமிழில் அளிக்கிறது.
- source_word: παραδείσῳ
  choice: பரதீசில்
  rationale: இறுதிக்கால ஆசீர்வாத இடத்தைக் குறிக்கும் παράδεισος என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ் சொல்; ‘தோட்டம்’ என்று மொழிபெயர்த்து கருத்தைத் தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: σήμερον (‘இன்று’) எந்த வினைத்தொடருடன் இணைகிறது என்பது
  choice: ‘இன்று’ என்பதை ‘நீ என்னுடன் பரதீசில் இருப்பாய்’ என்ற வாக்குறுதியுடன் இணைத்தல்
  alternative: '‘இன்று’ என்பதை ‘உனக்குச் சொல்கிறேன்’ என்பதுடன் இணைத்தல்: ‘இன்று உனக்குச் சொல்கிறேன்: நீ என்னுடன் பரதீசில் இருப்பாய்.’'
  rationale: பண்டைய கிரேக்க உரையில் நவீன நிறுத்தக்குறிகள் இல்லாததால் இரு இணைப்புகளும் இலக்கண ரீதியாக விவாதிக்கப்படுகின்றன. சொல் வரிசையும் கூற்றின் இயல்பான ஓட்டமும் ‘இன்று’ என்பதை ‘இருப்பாய்’ என்பதோடு இணைக்கும் முதன்மை வாசிப்பை ஆதரிக்கின்றன. கோட்பாட்டு தாக்கமுள்ள மாற்று வாசிப்பு மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சிலுவையில் அருகிலிருந்த குற்றவாளியை ஒருமையில் நேரடியாக அழைப்பதால் ‘அவன்/உனக்கு/நீ’ வடிவங்கள் வைக்கப்பட்டுள்ளன. ‘பரதீசு’ நிலைபெற்ற வேதாகமச் சொல்லாகப் பாதுகாக்கப்பட்டுள்ளது; உரை கூறுவதற்கு அப்பாற்பட்ட மறுமைநிலை விளக்கம் சேர்க்கப்படவில்லை.
