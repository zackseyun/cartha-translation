source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: ta
  text: ஏனெனில், மரம் பச்சையாக இருக்கும்போது[a][b] இவற்றைச் செய்கிறார்கள் என்றால், அது காய்ந்திருக்கும்போது என்ன ஆகும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறொரு மொழிபெயர்ப்பு: “பச்சை மரத்தில் … காய்ந்த மரத்தில்.” கிரேக்கம் இவ்வுருவகத்தை இன்னும் சொல்லுக்குச் சொல் அமைப்பில் தருகிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'இப்படிமம் சிறியதிலிருந்து பெரியதற்குச் செல்லும் ஒப்பீட்டை உணர்த்தலாம்: பச்சை மரத்தில் இவை செய்யப்படுமானால், காய்ந்த மரத்தில் என்ன நேரும்? ஆனால் அந்த மரங்கள் துல்லியமாக யாரை அல்லது எதைக் குறிக்கின்றன என்பதை வசனம் வெளிப்படையாகக் கூறவில்லை.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: மரம் பச்சையாக இருக்கும்போது
  rationale: ὑγρός என்பது ஈரமானது அல்லது பசுமையானது எனப் பொருள்படலாம். ξηρός என்பதுடனான எதிர்மறை இணைப்பில், எளிதில் எரியாத பச்சை மரத்தைக் குறிக்கும் படிமத்தை இச்சொற்றொடர் இயல்பான தமிழில் காக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரின் வடிவத்தையும், இப்போது நடைபெறும் செயல்களைப் பொதுவாகச் சுட்டும் அதன் திறந்த குறிப்பையும் காக்கிறது.
- source_word: ποιοῦσιν
  choice: செய்கிறார்கள்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழிலும் யார் என்பதை விளக்கிச் சேர்க்காமல் பன்மை வினை வடிவம் அந்தத் திறந்த குறிப்பைக் காக்கிறது.
- source_word: ἐν τῷ ξηρῷ
  choice: அது காய்ந்திருக்கும்போது
  rationale: முன்னுள்ள மரத்தையே சுட்டி, பச்சை மரம்–காய்ந்த மரம் என்ற உருவக எதிர்மறையைத் தெளிவான நவீன தமிழில் தொடர்கிறது.
- source_word: τί γένηται
  choice: என்ன ஆகும்?
  rationale: எதிர்பார்க்கப்படும் விளைவைப் பற்றிய வலிமையான வினாவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; அதை விளக்கவுரையாக மாற்றவில்லை.
theological_decisions:
- issue: பச்சை மரம் மற்றும் காய்ந்த மரம் பற்றிய உருவகத்தின் குறிப்பிட்ட பொருள்
  choice: உருவகத்தை முதன்மை உரையில் விளக்காமல் அப்படியே வைத்தல்
  alternative: ‘பச்சை மரம்’ இயேசுவையும் ‘காய்ந்த மரம்’ எருசலேமையோ அதன் மக்களையோ குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இந்தக் கூற்று சிறியதிலிருந்து பெரியதற்குச் செல்லும் எச்சரிக்கையை உணர்த்தக்கூடும்; ஆனால் மரங்கள் யாரை அல்லது எதைத் துல்லியமாகக் குறிக்கின்றன என்பது விளக்கத்திற்குரியது. ஆகவே ஒரு குறிப்பிட்ட இறையியல் அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்காமல் உள்ளார்ந்த பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் உடனடியாகப் புரிந்துகொள்ளும் வகையில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘பச்சை’–‘காய்ந்த’ என்ற மரப் படிமம் காக்கப்பட்டுள்ளது; ‘இருக்கும்போதே’ என்பது சொல்லின் எச்சரிக்கை வலிமையை இயல்பாக எடுத்துரைக்கிறது, ஆனால் உருவகத்தின் குறிப்பிட்ட பொருளைத் தீர்மானிக்கவில்லை.
