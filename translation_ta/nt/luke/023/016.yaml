translation:
  language: ta
  text: ஆகவே, அவரைத் தண்டித்துவிட்டு[a] விடுதலை செய்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒழுக்கப்படுத்திவிட்டு’ அல்லது ‘கண்டித்துவிட்டு’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினை திருத்தும் நோக்கமுள்ள தண்டனையைக் குறிக்கலாம். சிலர் இதைச் சாட்டையால் அடிப்பதைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்; ஆனால் அந்த வினை தனக்குள் அதைவிடப் பரந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: தண்டித்துவிட்டு
  rationale: இறந்தகாலச் செயவெச்சம் இங்கு முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கிறது. பிலாத்துவின் நீதித்துறைச் சூழலில் παιδεύω என்பது கல்வி கற்பித்தல் அல்ல, தண்டனை அளித்தல் என்ற பொருளைக் கொண்டுள்ளது. தண்டனையின் முறையை கிரேக்கம் குறிப்பாகச் சொல்லாததால், ‘சாட்டையால் அடித்துவிட்டு’ என்று மிகத் துல்லியப்படுத்தாமல் பரந்த பொருளுள்ள சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: οὖν
  choice: ஆகவே
  rationale: பிலாத்துவின் முந்தைய கூற்றிலிருந்து வரும் முடிவை அல்லது தீர்மானத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; தமிழ் மரியாதை மற்றும் வேதாகம உரைநடைக்கு இயல்பாக ‘அவரை’ பயன்படுத்தப்பட்டது.
- source_word: ἀπολύσω
  choice: விடுதலை செய்வேன்
  rationale: காவல் மற்றும் நீதித்துறைச் சூழலில் ஒருவரை விடுவிப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
theological_decisions:
- issue: பிலாத்து முன்மொழிந்த παιδεύω என்பதன் பொருள் வரம்பு
  choice: நீதித்துறை சார்ந்த தண்டனை என்ற பொருளில் ‘தண்டித்துவிட்டு’
  alternative: ‘ஒழுக்கப்படுத்திவிட்டு’ அல்லது இன்னும் குறிப்பாக ‘சாட்டையால் அடித்துவிட்டு’
  rationale: விசாரணைச் சூழல் தண்டனைப் பொருளைக் கோருகிறது. அதேவேளை, கிரேக்க வினை தண்டனையின் குறிப்பிட்ட முறையைச் சொல்லாததால் சாட்டையடி என்று மொழிபெயர்த்து உரையில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. மூலத்தின் சுருக்கமான முதலாம் நபர் கூற்று பாதுகாக்கப்பட்டுள்ளது.
