    reason: προσεφώνησεν என்பதற்கு ஒருவரை அல்லது ஒரு கூட்டத்தை நோக்கி அழைத்துப் பேசுதல், உரையாடுதல் என்ற நுணுக்கமும் உள்ளது.
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் திரும்ப நிகழ்வதைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் இணை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலில் கூட்டத்தின் கோரிக்கைக்கு எதிராக பிலாத்து மேற்கொண்ட முயற்சியைக் காட்டும் மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ὁ Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: προσεφώνησεν
  choice: அவர்களிடம் உரத்துக் கூறினார்
  rationale: ஒருவரையோ ஒரு கூட்டத்தையோ நோக்கிப் பேசுதல் அல்லது அழைத்துக் கூறுதல் என்ற பொருளை, இங்குள்ள பொது விசாரணைக் காட்சிக்கேற்றவாறு வெளிப்படுத்துகிறது; மறைமுகப் பொருளான ‘அவர்களிடம்’ சூழலிலிருந்து தெளிவாகிறது.
- source_word: θέλων
  choice: விரும்பிய
  rationale: முதன்மைச் செயலுடன் ஒரே நேரத்தில் இருந்த பிலாத்துவின் நோக்கத்தை இயல்பான தமிழ்ப் பெயரெச்சத் தொடரால் காக்கிறது.
- source_word: ἀπολῦσαι
  choice: விடுதலை செய்ய
  rationale: காவல் மற்றும் நீதித்துறைச் சூழலில் ஒருவரை விடுவிப்பதைக் குறிக்கும் தெளிவான தமிழ் சொற்றொடர்.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவை
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவத்துடன், வினையின் நேரடிச் செயப்படுபொருளைக் குறிக்கும் ‘ஐ’ உருபு சேர்க்கப்பட்டுள்ளது.
