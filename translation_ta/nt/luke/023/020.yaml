- from: ஆனால் இயேசுவை விடுதலை செய்ய விரும்பிய பிலாத்து, மீண்டும் அவர்களிடம் உரத்துக் கூறினார்.[a]
  to: ஆனால், இயேசுவை விடுதலை செய்ய விரும்பிய பிலாத்து மீண்டும் அவர்களிடம் பேசினார்.[a]
  rationale: Source ஆதாரமில்லாத ‘உரத்துக்’ என்ற கூறு நீக்கப்பட்டுள்ளது. ‘பேசினார்’ என்பது προσφωνέω-வின் நடுநிலையான பொருளைத் தக்கவைக்கிறது; குறிப்பில் ‘அழைத்துப் பேசினார்’ என்ற சற்று குறிப்பான மாற்றுவாய்ப்பு வழங்கப்படுகிறது. ‘மீண்டும்,’ பிலாத்துவின் இயேசுவை விடுதலை செய்யும் நோக்கம், மற்றும் சட்டச் சூழலுக்கேற்ற ‘விடுதலை செய்ய’ ஆகியவை காக்கப்பட்டுள்ளன.
