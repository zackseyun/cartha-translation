  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: ta
  text: ஆனால் ஏரோதும், தன் படைவீரர்களுடன் சேர்ந்து, அவரை அவமதித்துக் கேலி செய்தான். அவருக்குச் சிறப்பான ஆடையை[a] அணிவித்து, அவரைப் பிலாத்துவிடம் திருப்பி அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “ஒளிமிக்க ஆடை” அல்லது “பிரகாசமான ஆடை.” λαμπράν என்ற சொல் ஒளிமிக்க அல்லது சிறப்பான என்று பொருள்படலாம்; இயேசுவுக்கு போலியான மரியாதைக்குரிய தோற்றத்தைக் கொடுத்து அவரைக் கேலி செய்ய இந்த ஆடை பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: அவரை அவமதித்து
  rationale: ஒருவரை மதிப்பற்றவராகக் கருதி இகழ்வதையும் வெளிப்படையாக அவமதிப்பதையும் குறிக்கும் வினையெச்சத்தின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: தன் படைவீரர்களோடு சேர்ந்து
  rationale: στράτευμα இச்சூழலில் படைவீரர்களைக் குறிக்கிறது; இந்தத் தேர்வு தெளிவாகவும் நவீன தமிழுக்கு இயல்பாகவும் உள்ளது.
- source_word: ἐμπαίξας
  choice: கேலி செய்தான்
  rationale: இயேசுவை ஏளனம் செய்து பரிகசித்த செயலை நேரடியாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: περιβαλὼν
  choice: அணிவித்து
  rationale: ஒருவர்மேல் ஆடையைப் போர்த்துதல் அல்லது அவருக்கு ஆடை அணிவித்தல் என்ற செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐσθῆτα λαμπρὰν
  choice: பகட்டான ஆடை
  rationale: ἐσθής என்பது ஆடையையும் λαμπρός என்பது ஒளிமிக்க, சிறப்பான அல்லது ஆடம்பரமான தன்மையையும் குறிக்கலாம். ‘பகட்டான ஆடை’ என்பது குறிப்பாக அரச அங்கி என்று வரையறுக்காமல், கேலிக்குப் பயன்படுத்தப்பட்ட வெளிப்படையான சிறப்புத் தோற்றத்தைப் பாதுகாக்கிறது.
- source_word: ἀνέπεμψεν
  choice: திருப்பி அனுப்பினான்
  rationale: முந்தைய அதிகாரியான பிலாத்துவிடம் மீண்டும் அனுப்பிய நீதிமுறைச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῷ Πιλάτῳ
  choice: பிலாத்துவிடம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவத்தையும், ஒருவரிடம் அனுப்புதல் என்ற இயல்பான வேற்றுமை அமைப்பையும் பின்பற்றுகிறது.
- source_word: δὲ ... καὶ ὁ Ἡρῴδης
  choice: ஆனால் ஏரோதும்
  rationale: δὲ தரும் தொடர்ச்சி அல்லது மாறுபாட்டை ‘ஆனால்’ என்றும், καὶ தரும் ‘ஏரோதும்’ என்ற சேர்க்கைப் பொருளை ‘-உம்’ என்றும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ஆடையின் மூலம் செய்யப்பட்ட ஏரோதின் கேலியின் தன்மை
  choice: கேலிக்குரிய பகட்டான தோற்றத்தைப் பாதுகாத்து, ஆடையை அதன் வகைக்கு மேல் குறிப்பாக்காமல் மொழிபெயர்த்தல்
  alternative: அதைத் திட்டவட்டமாக அரச அங்கி என்றோ, பைத்தியக்காரரைக் குறிக்கும் ஆடை என்றோ விளக்குதல்
  rationale: வசனம் அவமதிப்பையும் கேலியையும் தெளிவாகக் கூறினாலும், கிரேக்க உரை ஒளிமிக்க அல்லது சிறப்பான ஆடை என்று மட்டுமே கூறுகிறது. ஆகவே கேலியான மரியாதையின் முரணை உணர்த்தலாம்; ஆனால் அதன் குறியீட்டுப் பொருளை பிரதான உரையில் தீர்மானித்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் பாடுபொருளின் கண்ணியத்தைக் காக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘அவரை/அவருக்கு’ என்ற மரியாதை ஒருமை இயேசுவைக் குறிக்கிறது; ஏரோதின் செயல்களுக்கு இயல்பான ஆண்பால் ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
