revisions:
- from: ஆனால் ஏரோதும் தன் படைவீரர்களோடு சேர்ந்து அவரை அவமதித்துக் கேலி செய்தான். பிறகு அவருக்குப் பகட்டான ஆடையை[a] அணிவித்து, அவரைப் பிலாத்துவிடம் திருப்பி அனுப்பினான்.
  to: ஆனால் ஏரோதும், தன் படைவீரர்களுடன் சேர்ந்து, அவரை அவமதித்துக் கேலி செய்தான். அவருக்குச் சிறப்பான ஆடையை[a] அணிவித்து, அவரைப் பிலாத்துவிடம் திருப்பி அனுப்பினான்.
  rationale: The revision replaces the interpretively colored “பகட்டான” with “சிறப்பான,” which more directly represents λαμπράν while preserving the garment’s precise nature and the irony of its use as matters of context. The footnote retains the viable “bright” sense and cautiously notes the likely mocking function without presenting it as explicit in the Greek.
  reviewer_model: gpt-5.6-terra
