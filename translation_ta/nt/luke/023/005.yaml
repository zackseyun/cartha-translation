  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: ta
  text: ஆனால் அவர்கள் விடாமல் வலியுறுத்தி, “இவன் கலிலேயாவிலிருந்து தொடங்கி இங்கேவரை[c], யூதேயா முழுவதிலும்[b] போதித்து மக்களைத் தூண்டிவிடுகிறான்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைக் கிளர்ச்சியடையச் செய்கிறான்.” கிரேக்க வினைச்சொல், அமைதிக்குலைவை ஏற்படுத்தும் விதத்தில் மக்களை எழுப்புவதையோ தூண்டுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யூதேயா” என்பது குறிப்பாக யூதேயா பகுதியையோ, சில சூழல்களில் விரிவாக இங்கே குறிப்பிடப்படும் யூதப் பகுதிகளையோ குறிக்கலாம். இங்கே அவருடைய செயல்பாடு பரவலாக இருந்தது என்பதே குற்றச்சாட்டின் வலியுறுத்தல்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “இந்த இடம்வரை.” கலிலேயாவிலிருந்து பிலாத்துவின் முன்னிலையிலுள்ள தற்போதைய இடம் வரையிலான பரப்பை இந்தச் சொற்றொடர் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: விடாமல் வலியுறுத்தி
  rationale: இறந்தகாலத் தொடர்வினை வடிவம், அவர்கள் தொடர்ந்து பலமாக வற்புறுத்தியதைச் சுட்டுகிறது. நவீன தமிழில் அதன் தொடர்ச்சியும் அழுத்தமும் இயல்பாக வெளிப்படுகின்றன.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: அவர்கள் வலியுறுத்திய குற்றச்சாட்டின் உள்ளடக்கத்தை நேரடியாக அறிமுகப்படுத்துகிறது.
- source_word: Ἀνασείει
  choice: மக்களைத் தூண்டிவிடுகிறான்
  rationale: மக்களிடையே அமைதிக்குலைவை உண்டாக்கும் விதத்தில் அவர்களைத் தூண்டுவதாகக் கூறப்படும் குற்றச்சாட்டை வெளிப்படுத்துகிறது; குறிப்பிட்ட அரசியல் குற்றமாக இதைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: τὸν λαὸν
  choice: மக்களை
  rationale: ஒரு குறிப்பிட்ட கூட்டத்தை அல்லாமல் பொதுமக்களை விரிவாகக் குறிக்கிறது.
- source_word: διδάσκων
  choice: போதித்து
  rationale: மக்களைத் தூண்டுவதாகக் கூறப்பட்ட செயலின் வழிமுறையையோ அதனுடன் சேர்ந்த செயலையோ குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: யூதேயா முழுவதிலும்
  rationale: அந்தப் பகுதி முழுவதும் பரவிய செயல்பாட்டின் விரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἰουδαίας
  choice: யூதேயா
  rationale: வரலாற்றுப் புவியியல் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவில் தொடங்கி
  rationale: செயல்பாட்டின் தொடக்க இடம் கலிலேயா என்பதை இயல்பான தமிழில் காட்டுகிறது; ἀπό குறிக்கும் மூலப்புள்ளி பாதுகாக்கப்படுகிறது.
- source_word: ἕως ὧδε
  choice: இங்கேவரை
  rationale: கலிலேயாவிலிருந்து பிலாத்துவின் முன்னிலையிலுள்ள தற்போதைய இடம் வரையிலான விரிவைக் காட்டும் இடச்சுட்டுப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான குற்றச்சாட்டின் தன்மை
  choice: “மக்களைத் தூண்டிவிடுகிறான்” என்று சமூக அமைதிக்குலைவைச் சுட்டும் பொதுவான குற்றச்சாட்டாக மொழிபெயர்த்தல்
  alternative: “மக்களைக் கிளர்ச்சியடையச் செய்கிறான்”
  rationale: Ἀνασείει என்பது குழப்பமூட்டும் விதத்தில் மக்களைத் தூண்டுவதைக் குறிக்கலாம்; ஆனால் அது தனியாகவே ஒரு குறிப்பிட்ட அரசியல் கிளர்ச்சிக் குற்றத்தைத் தொழில்நுட்பமாக வரையறுப்பதில்லை. எனவே குற்றஞ்சாட்டுவோரின் பகைமையான வலியுறுத்தலைப் பாதுகாத்தபடியே மிகைப்படுத்தல் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. குற்றஞ்சாட்டுவோரின் தொடர்ந்த அழுத்தத்தை “விடாமல் வலியுறுத்தி” என்பதும், அரசியல் கிளர்ச்சி என்ற மிகத் துல்லியமான பொருளைத் திணிக்காமல் குற்றச்சாட்டின் தீவிரத்தை “தூண்டிவிடுகிறான்” என்பதும் வெளிப்படுத்துகின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
