  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: ta
  text: ஏரோதும் பிலாத்துவும் அந்த நாளிலேயே ஒருவருக்கொருவர் நண்பர்களானார்கள்[a]; ஏனெனில், அதற்கு முன்பு அவர்கள் ஒருவருக்கொருவர் பகைமை கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒருவருக்கொருவர் நட்பாக ஆனார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதற்கு முன்பு அவர்கள் ஒருவருக்கொருவர் பகைமையில் இருந்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: ஆனார்கள்
  rationale: γίνομαι என்பதன் இறந்தகால வடிவம் உறவுநிலையில் ஏற்பட்ட மாற்றத்தைக் குறிக்கிறது; தமிழில் ‘ஆனார்கள்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φίλοι
  choice: நண்பர்கள்
  rationale: இது பயனிலைப் பெயர்ச்சொல்லாக வந்து, அவர்கள் நண்பர்களானதை அல்லது நட்புறவு கொண்டவர்களானதை நேரடியாகக் கூறுகிறது.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: ஏரோதும் பிலாத்துவும்
  rationale: τε ... καί இணைப்பு இருவரையும் ஒன்றாகச் சுட்டுகிறது; ‘-உம் ... -உம்’ என்ற தமிழ் அமைப்பு இதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: அந்த நாளிலேயே
  rationale: αὐτῇ தரும் வலியுறுத்தலை ‘-ஏ’ பாதுகாக்கிறது; இது சாதாரண ‘அந்த நாளில்’ என்பதைக் காட்டிலும் மூலத்தின் அழுத்தத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: μετ’ ἀλλήλων
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பர உறவைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: προϋπῆρχον
  choice: அதற்கு முன்பு ... கொண்டிருந்தார்கள்
  rationale: முன்னரே நீடித்து வந்த நிலையையும், அந்த நாளில் ஏற்பட்ட மாற்றத்துடனான கால வேறுபாட்டையும் இவ்வமைப்பு காட்டுகிறது.
- source_word: ἐν ἔχθρᾳ
  choice: பகைமை கொண்டிருந்தார்கள்
  rationale: ἔχθρα குறிக்கும் பரஸ்பர விரோதத்தை இயல்பான தமிழில் தருகிறது; மிகக் கடினமான சொற்சொல் அமைப்பான ‘பகைமையில் இருந்தார்கள்’ என்பதைக் காட்டிலும் வாசிக்க எளிது.
- source_word: ὄντες πρὸς αὑτούς
  choice: அவர்கள் ஒருவருக்கொருவர் ... கொண்டிருந்தார்கள்
  rationale: பங்கேற்புவினை தமிழில் இறந்தகால வினைத்தொடராக இயல்பாக்கப்பட்டு, πρός மற்றும் αὑτούς குறிக்கும் பரஸ்பர நோக்குநிலை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஏரோதுக்கும் பிலாத்துவுக்கும் ஏற்பட்ட உறவுமாற்றத்தின் தன்மை
  choice: அவர்கள் அந்த நாளில் நண்பர்களானார்கள் என்று உரை கூறும் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒருவருடன் ஒருவர் நட்பாக நடந்துகொள்ளத் தொடங்கினார்கள்’ அல்லது ‘அரசியல் கூட்டாளிகளானார்கள்’ என்று புரிந்துகொள்ளலாம்.
  rationale: φίλοι என்பது நண்பர்களையோ நட்புறவு கொண்ட கூட்டாளிகளையோ குறிக்கக்கூடும்; ஆனால் அவர்களுடைய நோக்கத்தையோ உறவின் ஆழத்தையோ வசனம் விளக்கவில்லை. ஆகவே அரசியல் அல்லது இறையியல் நோக்கம் எதுவும் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த நாளிலேயே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘பகைமை கொண்டிருந்தார்கள்’ முன்னர் நீடித்த பரஸ்பர விரோதத்தை இயல்பாகச் சொல்கிறது.
