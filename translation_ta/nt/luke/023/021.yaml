translation:
  language: ta
  text: ஆனால் அவர்களோ, “அவனைச் சிலுவையில் அறையுங்கள், சிலுவையில் அறையுங்கள்!”[a] என்று தொடர்ந்து கூச்சலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “அவனைச் சிலுவையில் அறைத்து மரணதண்டனை நிறைவேற்றுங்கள், அவனைச் சிலுவையில் அறைத்து மரணதண்டனை நிறைவேற்றுங்கள்!”
