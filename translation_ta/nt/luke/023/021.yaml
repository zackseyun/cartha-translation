lexical_decisions:
- source_word: οἱ δὲ
  choice: ஆனால் அவர்களோ
  rationale: οἱ என்பது சூழலில் முன்பு குறிப்பிடப்பட்ட மக்களைக் குறிக்கிறது; δέ முந்தைய கூற்றுக்கு எதிரான அவர்களின் பதிலை மென்மையான முரண்பாட்டுடன் காட்டுகிறது.
- source_word: ἐπεφώνουν
  choice: தொடர்ந்து கூச்சலிட்டார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது; ἐπιφωνέω உரத்துக் கூப்பிடுவதைக் குறிக்கிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: அவர்கள் கூச்சலிட்ட சொற்களை இயல்பான தமிழில் நேரடியாக அறிமுகப்படுத்துகிறது; தலைமை வினையுடன் ஒரே நேரத்தில் நிகழும் பங்கேற்பு வினையின் தொடர்பும் காக்கப்படுகிறது.
- source_word: Σταύρου σταύρου
  choice: சிலுவையில் அறையும், சிலுவையில் அறையும்
  rationale: மீண்டும் கூறப்பட்ட ஒருமை ஏவல் வடிவத்தின் வற்புறுத்தலையும் அவசரத்தையும் காக்கிறது. தமிழில் மரியாதையற்ற ஒருமை ஏவலைவிட, இவ்வடிவம் கூட்டம் ஆளுநரிடம் வைக்கும் கோரிக்கையாக இயல்பாக ஒலிக்கிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: ஏவல் வினையின் நேரடிச் செயப்படுபொருளான எளிய ஒருமை ஆண்பால் சுட்டுப்பெயரை நேராக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: σταυρόω என்ற மரணதண்டனைச் சொல்லின் மொழிபெயர்ப்பு
  choice: சிலுவையில் அறையும்
  alternative: சிலுவையில் கொன்று போடும்
  rationale: இந்த வினை குறிப்பாகச் சிலுவையில் அறைந்து மரணதண்டனை நிறைவேற்றுவதைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட சொற்றொடர் அதன் வரலாற்றுச் செயலைத் துல்லியமாகக் கூறுகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், உரத்த கூட்டக் கோரிக்கையின் மீளுரைப்பையும் மூலத்தின் தொடர்ச்சியான செயற்பாட்டையும் காக்கும் கண்ணியமான, எளிதில் புரியும் நடை. ‘அறையும்’ என்பது ஆளுநரை நோக்கிய கோரிக்கை வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது.
