revisions:
- from: ஏனெனில், இதோ, நாட்கள் வருகின்றன. அப்போது மக்கள், ‘மலடிகளும், பிள்ளை பெறாத கருப்பைகளும், பாலூட்டாத மார்பகங்களும் பேறுபெற்றவை’ என்று சொல்வார்கள்.
  to: ஏனெனில், இதோ, நாட்கள் வருகின்றன; அந்நாட்களில் மக்கள், ‘மலட்டுப் பெண்களும், பெற்றெடுக்காத கருப்பைகளும், பாலூட்டாத மார்பகங்களும் பேறுபெற்றவை’ என்று சொல்வார்கள்.
