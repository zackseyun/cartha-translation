id: LUK.23.29
reference: Luke 23:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ta
  text: ஏனெனில், இதோ, நாட்கள் வருகின்றன; அந்நாட்களில் மக்கள், ‘மலட்டுப் பெண்களும், பெற்றெடுக்காத கருப்பைகளும், பாலூட்டாத மார்பகங்களும் பேறுபெற்றவை’ என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: வரவிருக்கும் நிலைமையைச் சுட்டிக்காட்டி கவனத்தை ஈர்க்கும் மூலமொழியின் உரையாடல் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: Μακάριαι
  choice: பேறுபெற்றவை
  rationale: துயரத்தின் சூழலில் ‘ஆசீர்வதிக்கப்பட்டவர்கள்’ என்று நேரடியாகச் சொல்வதால் ஏற்படக்கூடிய தவறான பொருளைத் தவிர்த்து, இங்கு பொறாமைக்குரிய அல்லது நல்வாய்ப்புடைய நிலை என்று அறிவிக்கப்படும் முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: αἱ στεῖραι
  choice: மலடிகள்
  rationale: பெற்றெடுக்க இயலாத பெண்களைக் குறிக்கும் மூலச்சொல்லின் நேரடியான பொருளைச் சுருக்கமாகக் காக்கிறது; அடுத்துவரும் கருப்பைகள் மற்றும் மார்பகங்கள் என்ற இணை அமைப்போடும் பொருந்துகிறது.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: பிள்ளை பெறாத கருப்பைகள்
  rationale: உடல் உறுப்பை முன்னிறுத்தும் மூலத்தின் கவித்துவமான இணை அமைப்பையும், பெற்றெடுக்காத நிலையின் பொருளையும் காக்கிறது.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: பாலூட்டாத மார்பகங்கள்
  rationale: ἔθρεψαν என்பதன் அடிப்படைப் பொருள் ‘போஷித்தன’ என்றாலும், மார்பகங்கள் என்ற சூழலில் குழந்தைக்குப் பாலூட்டுதலை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: குழந்தையின்மையைப் பற்றிய ‘பேறுபெற்றவை’ என்ற கூற்றின் தன்மை
  choice: வரவிருக்கும் பேரிடரில் மக்கள் சொல்லப்போகும் முரண்பாடான மதிப்பீடாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: குழந்தையின்மையே பொதுவாகத் தேவ ஆசீர்வாதம் என விளக்கமாக மாற்றுதல்.
  rationale: இந்த வசனம் இயேசு அறிவிக்கும் வருங்காலத் துயரத்தின் தீவிரத்தைக் காட்டுகிறது; மூலவாக்கியம் அந்தக் கூற்றை மேற்கோளாக அளிக்கிறது, பொதுவான கோட்பாடாக அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; மூலத்தின் மூன்று இணையான பெயர்ச்சொல் தொடர்களும் திட்டமிட்டு காக்கப்பட்டுள்ளன. ‘மக்கள்’ என்பது கிரேக்கத்தின் குறிப்பிடப்படாத பன்மை வினைமுற்றை தமிழில் இயல்பாக்குகிறது. ‘ஏனெனில்’ முந்தைய வசனத்துடனான காரணத் தொடர்பை வெளிப்படுத்துகிறது.
