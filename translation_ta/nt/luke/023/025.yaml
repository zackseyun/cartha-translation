  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: ta
  text: கலகத்திற்காகவும் கொலைக்காகவும் சிறையில் தள்ளப்பட்டிருந்த[a], அவர்கள் கேட்டுக்கொண்டிருந்த அந்த மனிதனை அவன் விடுதலை செய்தான்; ஆனால் இயேசுவை அவர்களுடைய விருப்பத்தின்படி ஒப்படைத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிறையில் அடைக்கப்பட்டிருந்த.’ ‘தள்ளப்பட்டிருந்த’ என்பது கிரேக்கச் சொல்லின் விறுவிறுப்பான சொல்லாட்சியைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் விரும்பியபடி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: விடுதலை செய்தான்
  rationale: சிறைக் காவலில் இருந்த ஒருவனை விடுவிக்கும் சட்ட மற்றும் காவல் சூழலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: διὰ στάσιν καὶ φόνον
  choice: கலகத்திற்காகவும் கொலைக்காகவும்
  rationale: διά + accusative காரணத்தைச் சுட்டுகிறது. இச்சூழலில் στάσις வெறும் கருத்துவேறுபாடு அல்ல, ஆட்சிக்கு எதிரான கலகம் அல்லது கிளர்ச்சியைக் குறிக்கிறது.
- source_word: βεβλημένον εἰς φυλακήν
  choice: சிறையில் தள்ளப்பட்டிருந்த
  rationale: βάλλω என்பதன் விறுவிறுப்பான படிமத்தையும், perfect passive participle குறிக்கும் முன்பே நிகழ்ந்து தொடரும் சிறைப்பட்ட நிலையையும் காக்கிறது.
- source_word: ὃν ᾐτοῦντο
  choice: அவர்கள் கேட்டுக்கொண்டிருந்த அந்த மனிதனை
  rationale: Imperfect வினையின் தொடர்ச்சியான கோரிக்கையை ‘கேட்டுக்கொண்டிருந்த’ வெளிப்படுத்துகிறது; ‘வற்புறுத்திக் கேட்டனர்’ என்று தீவிரத்தை மிகைப்படுத்தவில்லை.
- source_word: παρέδωκεν
  choice: ஒப்படைத்தான்
  rationale: நீதித்துறை சார்ந்த அதிகார மாற்றத்தையும், பாடுகளின் நிகழ்வுரையில் παραδίδωμι கொண்டுள்ள ‘கையில் ஒப்படைத்தல்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: τῷ θελήματι αὐτῶν
  choice: அவர்களுடைய விருப்பத்திற்கு
  rationale: θέλημα என்பதன் ‘விருப்பம்/சித்தம்’ என்ற மனவிருப்பப் பொருளை நேரடியாகக் காக்கிறது; விளக்க உரையை மூலவாக்கியத்துக்குள் சேர்க்கவில்லை.
- source_word: δὲ ... δὲ
  choice: '[முதல் δέ வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை] ... ஆனால்'
  rationale: முதல் δέ தமிழில் இயல்பான நிகழ்வுத் தொடரில் மறைமுகமாகத் தெரிவதால் தனிச்சொல்லாக இடப்படவில்லை; இரண்டாவது δέ இரண்டு நபர்களுக்குச் செய்யப்பட்ட மாறுபட்ட தீர்ப்பைத் தெளிவாகக் காட்ட ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: விடுவிக்கப்பட்ட கலகக்காரனுக்கும் இயேசுவுக்கும் இடையிலான முரண்பாட்டை, பாவநிவாரணம் குறித்த விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: ஒருவன் விடுதலை செய்யப்பட்டதையும் இயேசு ஒப்படைக்கப்பட்டதையும் நேரடியான முரண்பாடாக வைத்திருக்கிறது.
  alternative: ‘இயேசுவுக்குப் பதிலாக’ அல்லது ‘அவனுடைய இடத்தில்’ போன்ற விரிவாக்கத்தைச் சேர்த்தல்.
  rationale: இத்தகைய இறையியல் தொடர்புகள் விரிவான பாடுகளின் நிகழ்விலிருந்து உணரப்படலாம்; ஆனால் இந்த வசனம் அவற்றை வெளிப்படையாகக் கூறாததால் மொழிபெயர்ப்பு அவற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் பாடுகளின் நிகழ்வுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘அவர்களுடைய விருப்பத்திற்கு ஒப்படைத்தான்’ என்பது தமிழில் சற்றே முறையான அமைப்பாக இருந்தாலும், மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
