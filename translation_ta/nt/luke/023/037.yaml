  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: ta
  text: அவர்களும், “நீ யூதர்களின் அரசன் என்றால்[a], உன்னையே காப்பாற்றிக்கொள்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ யூதேயர்களின் அரசன் என்றால்.” கிரேக்கச் சொல் Ἰουδαίων சூழலைப் பொறுத்து யூதர்களையோ யூதேயர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: மேலும் ... என்று சொன்னார்கள்
  rationale: கிரேக்கத்தில் முந்தைய வசனத்தின் பன்மை எழுவாயுடன் இணையும் நிகழ்காலப் பெயரெச்சத் தொடர். இயல்பான நவீன தமிழில் தொடர்ச்சியைப் பேணும் வகையில் வினைமுற்றாக மொழிபெயர்க்கப்பட்டது; கேலி என்ற பொருள் வினைக்குள் சேர்க்கப்படாமல் சூழலுக்கே விடப்பட்டது.
- source_word: Εἰ σὺ εἶ
  choice: நீ ... ஆனால்
  rationale: சவாலாக முன்வைக்கப்படும் நிபந்தனையைத் தெளிவாகப் பேணுகிறது. வெளிப்படையான σὺ என்பதன் வலியுறுத்தல் தமிழின் ‘நீ’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: யூதர்களின் அரசன்
  rationale: சிலுவைப்பாட்டு நிகழ்வில் குற்றச்சாட்டாகவும் கேலியாகவும் பயன்படுத்தப்படும் குறிப்பிட்ட அரச பட்டத்தைப் பேணுகிறது. Ἰουδαίων என்பதன் பிராந்திய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σῶσον σεαυτόν
  choice: உன்னையே காப்பாற்றிக்கொள்
  rationale: ஒருமை ஏவல் வடிவையும், பிரதிபெயரின் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது; σῴζω என்பதன் ‘காப்பாற்று’ என்ற அடிப்படைத் தொடர்பையும் பேணுகிறது.
theological_decisions:
- issue: βασιλεὺς τῶν Ἰουδαίων என்ற அரச பட்டத்தின் மொழிபெயர்ப்பு
  choice: யூதர்களின் அரசன்
  alternative: யூதேயர்களின் அரசன்
  rationale: இங்கு இச்சொற்றொடர் இயேசுவுக்கு எதிரான அரசியல் குற்றச்சாட்டையும் அவரது அரசத்தன்மையைச் சார்ந்த நையாண்டியையும் சுமக்கிறது. பொதுவாகப் புரிந்துகொள்ளப்படும் ‘யூதர்கள்’ முதன்மை உரையில் வைக்கப்பட்டாலும், Ἰουδαῖοι என்பதன் பிராந்திய/இன அடையாள நுணுக்கம் மாற்று மொழிபெயர்ப்பாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். முந்தைய வசனத்துடன் உள்ள இலக்கணத் தொடர்ச்சி ‘மேலும்’ என்பதால் குறிக்கப்படுகிறது; கேலித் தொனி வெளிப்படையாகச் சேர்க்கப்படாமல் சூழலில் நிலைக்கவிடப்படுகிறது.
