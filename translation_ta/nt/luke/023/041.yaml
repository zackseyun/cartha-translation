id: LUK.23.41
reference: Luke 23:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: ta
  text: நாமோ நியாயமாகவே பெறுகிறோம்; ஏனெனில் நாம் செய்தவற்றுக்குத் தகுந்ததையே பெற்றுக்கொண்டிருக்கிறோம்[a]. ஆனால் இவரோ எந்தத் தகாத செயலையும் செய்யவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் செய்தவற்றுக்குரியதைப் பெற்றுக்கொண்டிருக்கிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இவர் தவறு எதுவும் செய்யவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: நியாயமாகவே
  rationale: அவர்கள் பெறும் தண்டனை நீதியானதும் தகுதியானதும் என்பதைச் சுருக்கமாகவும் நீதிசார் பொருளுடனும் தெரிவிக்கிறது; μέν தரும் வலியுறுத்தலையும் ‘வே’ இயல்பாகக் காட்டுகிறது.
- source_word: ἄξια
  choice: தகுந்ததை
  rationale: அவர்கள் செய்த செயல்களுக்கு ஏற்ற விளைவுகளைப் பெறுகிறார்கள் என்ற விகிதாசாரப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὧν ἐπράξαμεν
  choice: நாம் செய்தவற்றுக்கு
  rationale: உறவுப்பெயரெச்சத் தொடரின் பொருளையும், முடிவுற்ற முந்தைய செயல்களைக் குறிக்கும் இறந்தகால வினையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀπολαμβάνομεν
  choice: பெற்றுக்கொண்டிருக்கிறோம்
  rationale: தற்போது அவர்கள் அந்த விளைவை அனுபவித்துக்கொண்டிருப்பதை நிகழ்நிலைத் தொடர்ச்சியுடன் காட்டுகிறது; திரும்பப் பெறுதல் அல்லது உரிய பலனைப் பெறுதல் என்ற நிழற்பொருளும் ஓரளவு தங்குகிறது.
- source_word: οὗτος
  choice: இவரோ
  rationale: இயேசுவைச் சுட்டும் demonstrative force-ஐ மரியாதையான, இயல்பான தமிழில் காக்கிறது; δέ காட்டும் முரண்பாட்டை ‘ஓ’ வெளிப்படுத்துகிறது.
- source_word: οὐδὲν ἄτοπον
  choice: முறையற்றது எதையும்
  rationale: ἄτοπος என்பதன் ‘பொருத்தமற்றது/முறையற்றது/தவறானது’ என்ற பரப்பைத் தக்கவைத்து, ‘குற்றம்’ என்று சட்டரீதியாக அளவுக்கு மீறிக் குறிப்பாக்குவதைத் தவிர்க்கிறது.
- source_word: ἔπραξεν
  choice: செய்யவில்லை
  rationale: அவர் எந்த முறையற்ற செயலையும் செய்யவில்லை என்ற நிறைவு பெற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் குற்றமின்மையைப் பற்றிய குற்றவாளியின் சாட்சி
  choice: ஆனால் இவரோ முறையற்றது எதையும் செய்யவில்லை
  alternative: ஆனால் இவர் தவறு எதுவும் செய்யவில்லை
  rationale: உடனடி நீதித்துறைச் சூழலில் இயேசுவுக்கு எதிராகத் தகாத அல்லது தவறான செயல் எதுவும் இல்லை என்ற மனித சாட்சியைப் பாதுகாக்கிறது. அதே நேரத்தில், மூலத்தில் வெளிப்படையாக இல்லாத விரிவான கோட்பாட்டுக் கூற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையைப் பயன்படுத்தியுள்ளது. ‘நாமோ … இவரோ’ என்ற அமைப்பு கிரேக்க μέν…δέ முரண்பாட்டை இயல்பாகக் காட்டுகிறது. ‘தண்டனை’ என்பது சூழலிலிருந்து தெளிவாகும் பொருளை முதல் கூறில் வெளிப்படுத்துகிறது; அடுத்த கூறு மூலத்தின் ‘தகுந்ததைப் பெறுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
