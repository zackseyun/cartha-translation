revisions:
- from: நாமோ நியாயமாகவே தண்டனை பெறுகிறோம்; ஏனெனில் நாம் செய்தவற்றுக்குத் தகுந்ததைப் பெற்றுக்கொண்டிருக்கிறோம்[a]. ஆனால் இவரோ முறையற்றது எதையும் செய்யவில்லை[b].
  to: நாமோ நியாயமாகவே பெறுகிறோம்; ஏனெனில் நாம் செய்தவற்றுக்குத் தகுந்ததையே பெற்றுக்கொண்டிருக்கிறோம்[a]. ஆனால் இவரோ எந்தத் தகாத செயலையும் செய்யவில்லை[b].
  rationale: The revision retains the present reception of consequences (ἀπολαμβάνομεν), the proportionality expressed by ἄξια, and the contrast between the criminals and Jesus. It removes the explicitly supplied “punishment,” preserves the source’s broad statement that Jesus did nothing improper, and improves modern Tamil flow and footnote scope.
  reviewer_model: gpt-5.6-terra
