id: LUK.23.50
reference: Luke 23:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: ta
  text: இதோ, யோசேப்பு என்னும் பெயருடைய ஒரு மனிதர் இருந்தார்; அவர் மன்ற உறுப்பினராக இருந்தார்; நல்லவரும் நீதியுள்ளவருமான[a] மனிதர்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயமானவர்.”
    reason: δίκαιος என்பது ஒழுக்கரீதியாக ‘நீதியுள்ளவர்’ என்றும், நீதியாக நடப்பவர் என்ற பொருளில் ‘நியாயமானவர்’ என்றும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: இதோ
  rationale: லூக்காவின் கவனத்தை ஈர்க்கும் கதைநடைச் சொல்லை நீக்காமல், நவீன தமிழில் இயல்பாகத் தருகிறது. தொடக்கத்திலுள்ள καί-யைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது இங்கு இயல்பற்றதாக இருப்பதால், தொடர்ச்சியையும் கவன ஈர்ப்பையும் ‘இதோ’ ஏந்துகிறது.
- source_word: ἀνὴρ
  choice: ஒரு மனிதர்
  rationale: இங்கு ἀνήρ வயதுவந்த ஆணைக் குறிக்கிறது; மரியாதையான நவீன தமிழ் நடைக்கேற்ப ‘மனிதர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὀνόματι Ἰωσὴφ
  choice: யோசேப்பு என்னும் பெயருடைய
  rationale: ὀνόματι என்ற வேற்றுமைத் தொடரைத் தமிழில் இயல்பான அறிமுகச் சொற்றொடராக வழங்குகிறது.
- source_word: βουλευτὴς ὑπάρχων
  choice: மன்ற உறுப்பினராகவும் ... இருந்தார்
  rationale: βουλευτής என்பது ஓர் ஆளும் மன்றத்தின் உறுப்பினரைக் குறிக்கிறது. உடனடி சூழல் யூத மன்றத்தைச் சுட்டினாலும், மூலத்தில் வெளிப்படையாக இல்லாத அடையாளத்தை வசனத்துக்குள் சேர்க்காமல் ‘மன்ற உறுப்பினர்’ எனத் தரப்பட்டுள்ளது.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: நல்லவரும் நீதியுள்ளவருமான மனிதர்
  rationale: மூலத்தில் ἀνήρ மீண்டும் வருவதால் ‘மனிதர்’ என்பதும் மீண்டும் வைக்கப்பட்டுள்ளது. ἀγαθός ‘நல்லவர்’ என்றும், δίκαιος கடவுளுக்கும் மனிதருக்கும் முன் நேர்மையான ஒழுக்கநிலையை உள்ளடக்கும் வகையில் ‘நீதியுள்ளவர்’ என்றும் தரப்பட்டுள்ளன.
theological_decisions:
- issue: யோசேப்பைப் பற்றிய δίκαιος என்ற வருணனையின் மொழிபெயர்ப்பு
  choice: நீதியுள்ளவர்
  alternative: நியாயமானவர்
  rationale: δίκαιος ஒழுக்க நேர்மையையும் நீதியான நடத்தையையும் குறிக்க முடியும். ‘நீதியுள்ளவர்’ அதன் விரிந்த வேதாகம ஒலிப்பைத் தக்கவைக்கிறது; அதேவேளை அதை ஒரு தொழில்நுட்பமான கோட்பாட்டுக் கூற்றாக மாற்றுவதில்லை. நீதித்துறை சார்ந்த ‘நியாயமானவர்’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமக் கதைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடர்வதை இறுதி நீண்ட கோடு காட்டுகிறது; மூலத்தின் பங்கேற்பு அமைப்பைத் தமிழில் தெளிவாக்க ‘இருந்தார்’ பயன்படுத்தப்பட்டுள்ளது.
