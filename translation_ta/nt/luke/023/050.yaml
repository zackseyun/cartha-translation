  terminology: “மன்ற உறுப்பினர்” is an appropriate non-speculative rendering of βουλευτής. “நீதியுள்ளவர்” suitably renders δίκαιος in this moral characterization; the footnote gives a legitimate contextual alternative without forcing a narrow juridical meaning.
