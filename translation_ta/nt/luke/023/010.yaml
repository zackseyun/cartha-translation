revisions:
- from: தலைமை ஆசாரியர்களும் மறைநூல் அறிஞர்களும் அங்கே நின்றுகொண்டு, அவர்மீது கடுமையாகக் குற்றஞ்சாட்டினார்கள்.
  to: தலைமை ஆசாரியர்களும் வேத அறிஞர்களும் அங்கே நின்றுகொண்டு, அவர்மீது கடுமையாகக் குற்றஞ்சாட்டிக்கொண்டிருந்தார்கள்.
  rationale: 'The revision retains the draft''s clear legal sense and vigorous tone while using an ongoing past form for the present participle. No footnote is necessary: the Tamil wording directly conveys the source meaning, and the English lexical-alternative footnote does not require replication.'
  reviewer_model: gpt-5.6-terra
