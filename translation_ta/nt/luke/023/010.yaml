  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: ta
  text: தலைமை ஆசாரியர்களும் வேத அறிஞர்களும் அங்கே நின்றுகொண்டு, அவர்மீது கடுமையாகக் குற்றஞ்சாட்டிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: அங்கே நின்றுகொண்டு
  rationale: இது கடந்தகாலத்தில் நீடித்திருந்த நிலையைச் சுட்டுகிறது. ‘அங்கே நின்றுகொண்டு’ என்பது அவர்கள் அந்த இடத்தில் இருந்ததையும், அதே நேரத்தில் குற்றஞ்சாட்டிக்கொண்டிருந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதையை மெதுவாகத் தொடர்கிறது. தமிழில் சொற்றொடரின் தொடர்ச்சியே அந்தப் பணியை இயல்பாக நிறைவேற்றுவதால் ‘ஆனால்’ அல்லது ‘மேலும்’ என்று சேர்க்கப்படவில்லை.
- source_word: ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: இது ஒரே ‘பிரதான ஆசாரியர்’ பதவியைக் குறிக்காமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மைப் பட்டப்பெயர்.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: நகலெழுதுவோர் என்ற சொற்பொருளை மட்டும் அல்லாமல், யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்றிருந்த இவர்களின் அறியப்பட்ட சமூகப் பங்கை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: εὐτόνως
  choice: கடுமையாக
  rationale: குற்றச்சாட்டுகளின் தீவிரத்தையும் வலிமையையும் இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: κατηγοροῦντες
  choice: குற்றஞ்சாட்டினார்கள்
  rationale: நீதிசார் சூழலில் தொடர்ந்து முன்வைக்கப்பட்ட குற்றச்சாட்டைத் தெளிவாகக் கூறுகிறது; நின்றிருந்ததுடன் இணைந்து நடந்த செயலை ‘நின்றுகொண்டு’ என்ற அமைப்பு காக்கிறது.
- source_word: αὐτοῦ
  choice: அவர்மீது
  rationale: κατηγορέω உடன் வரும் மரபுத்தொடரின் பொருளை தமிழில் இயல்பாக ‘அவர்மீது குற்றஞ்சாட்டினார்கள்’ என்று வெளிப்படுத்துகிறது.
