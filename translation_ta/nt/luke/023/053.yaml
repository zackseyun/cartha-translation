source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: ta
  text: அவரை இறக்கி, லினன் துணியில் சுற்றி, பாறையைக் குடைந்து உருவாக்கப்பட்ட ஒரு கல்லறையில் அவரை வைத்தார்; அதில் அதுவரை யாரும் கிடத்தப்பட்டிருக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθελὼν
  choice: அவரை இறக்கி
  rationale: καθαιρέω என்பதன் இறந்தகால வினையெச்சம்; சிலுவையிலிருந்து இயேசுவின் உடலை இறக்கியதைச் சூழல் தெளிவுபடுத்துகிறது. தமிழில் இயல்பான செயல்வரிசையைத் தருகிறது.
- source_word: ἐνετύλιξεν
  choice: சுற்றி
  rationale: ἐντυλίσσω என்பது துணியால் சுற்றுவதைக் குறிக்கிறது; மூலத்தில் இல்லாத அடக்கச் சடங்கு விவரங்களைச் சேர்க்காமல் செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: σινδόνι
  choice: ஒரு மெல்லிய நார்த்துணியில்
  rationale: σινδών என்பது நுண்மையான நாரால் செய்யப்பட்ட துணியைக் குறிக்கிறது; பொதுவாக linen எனப் புரிந்துகொள்ளப்பட்டாலும், தமிழில் ‘நார்த்துணி’ என்பது பொருளை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: ἔθηκεν
  choice: வைத்தார்
  rationale: τίθημι இங்கு உடலைக் கல்லறைக்குள் வைப்பதைக் குறிக்கிறது. ‘வைத்தார்’ என்பது இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: μνήματι
  choice: ஒரு கல்லறையில்
  rationale: μνῆμα என்பது புதைக்கப்படும் இடம் அல்லது கல்லறையைக் குறிக்கிறது; இச்சூழலில் ‘கல்லறை’ தெளிவான நவீனத் தமிழ் வழக்கு.
- source_word: λαξευτῷ
  choice: பாறையில் வெட்டப்பட்ட
  rationale: λαξευτός என்பது கல் அல்லது பாறையைக் குடைந்து வெட்டிச் செய்யப்பட்டதைக் குறிக்கிறது; ‘பாறையில் வெட்டப்பட்ட’ என்பது இயற்கையான இடவகையைத் தெளிவாக்குகிறது.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: அதில் அதுவரை யாரும் வைக்கப்பட்டிருக்கவில்லை
  rationale: யாரும் இதற்கு முன் அந்தக் கல்லறையில் கிடத்தப்படவில்லை என்ற பொருளை அடக்கச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது; οὔπω-வின் ‘இன்னும்/அதுவரை இல்லை’ என்ற கால நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: அடக்கம் மற்றும் கல்லறையின் முன்பயன்பாடு
  choice: இயேசு பாறையில் வெட்டப்பட்ட, அதுவரை யாரும் வைக்கப்படாத கல்லறையில் வைக்கப்பட்டார்.
  alternative: யாரும் ஒருபோதும் படுத்திராத வெட்டியமைக்கப்பட்ட கல்லறையில் அவர் வைக்கப்பட்டார்.
  rationale: வசனம் தரும் வரலாற்று விவரத்தை மட்டும் மொழிபெயர்த்து, இணைச் சுவிசேஷங்களிலிருந்து கூடுதல் தகவல்களையோ சமயப் பிரிவு சார்ந்த விளக்கங்களையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. கிரேக்க வாக்கியத்தின் செயல்வரிசை பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
