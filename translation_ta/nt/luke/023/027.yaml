source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: ta
  text: பெருந்திரளான மக்களும், மார்பில் அடித்துக்கொண்டு அவருக்காகப் புலம்பிய பெண்களும் அவரைப் பின்தொடர்ந்து சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: பின்தொடர்ந்து சென்றார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை, அப்போது தொடர்ந்து நடைபெற்ற செயலைக் காட்டுகிறது. ‘பின்தொடர்ந்து சென்றார்கள்’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதைத் தொடர்ச்சியைக் குறிக்கும் இணைப்புச்சொல்; இவ்விடத்தில் தமிழில் தனிச் சொல்லாகக் காட்டாமலேயே தொடர்ச்சி இயல்பாகத் தெரிகிறது.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: பெருந்திரளான மக்கள்
  rationale: சொற்சொல்லான மரபற்ற அமைப்பைத் தவிர்த்து, மிகுதியான மக்கள் கூட்டம் என்ற பொருளைத் தெளிவான தமிழில் தருகிறது.
- source_word: γυναικῶν αἳ
  choice: பெண்களும் … புலம்பிய
  rationale: பெண்பால் பன்மை உறவுப்பெயர் குறிப்பாகப் பெண்களையே சுட்டுகிறது; தமிழ் பெயரெச்சத் தொடர் அந்தத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐκόπτοντο
  choice: மார்பில் அடித்துக்கொண்டு
  rationale: துக்கச் சூழலில் இவ்வினை துயரத்தின் அடையாளமாகத் தங்கள் மார்பில் அடித்துக்கொள்வதைக் குறிக்கிறது; தமிழிலும் இது புரிந்துகொள்ளக்கூடிய துக்க வெளிப்பாடு.
- source_word: ἐθρήνουν
  choice: புலம்பிய
  rationale: இச்சொல் துயரத்தை வெளிப்படையாகக் கூறி அழுதல் அல்லது ஒப்பாரி வைத்தலைக் குறிக்கிறது; ‘புலம்பிய’ என்பது கண்ணியமானதும் பரவலாகப் புரிவதுமான தேர்வு.
- source_word: αὐτόν
  choice: அவருக்காக
  rationale: புலம்பலின் பொருள் இயேசு என்பதைக் தமிழில் இயல்பாகக் காட்டுகிறது; ‘அவருக்காகப் புலம்பினர்’ என்பது அவரைப் பற்றிய துயரத்தை வெளிப்படுத்துகிறது.
