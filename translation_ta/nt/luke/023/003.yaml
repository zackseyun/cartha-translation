source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: ta
  text: அப்போது பிலாத்து அவரிடம், “நீ யூதர்களின்[a] அரசனா?” என்று கேட்டான். அதற்கு அவர், “நீரே சொல்கிறீர்”[b] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதேயர்களின்.’ கிரேக்கச் சொல் சூழலைப் பொறுத்து யூதர்களையோ யூதேயர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீர் அதைச் சொல்கிறீர்’ அல்லது ‘ஆம், நீர் சொல்வதுபோல்தான்.’ கிரேக்கப் பதில் சுருக்கமானது; தகுதிப்படுத்தப்பட்ட ஒப்புதலாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு இது வலுவான எதிர்மறையைக் காட்டாமல் நிகழ்ச்சியை அடுத்த கட்டத்துக்கு நகர்த்தும் மென்மையான இணைப்பாக உள்ளது; ‘அப்போது’ இயல்பான கதைநடையைத் தருகிறது.
- source_word: ἠρώτησεν
  choice: கேட்டான்
  rationale: பிலாத்து நேரடியாகக் கேள்வி கேட்டதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: λέγων
  choice: என்று
  rationale: கிரேக்கத்தின் பேச்சை அறிமுகப்படுத்தும் பங்கேற்பு வினையைத் தமிழில் இயல்பான நேர்கூற்று அமைப்பான ‘என்று கேட்டான்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: Σὺ εἶ
  choice: நீ ... அரசனா?
  rationale: சூழலில் இது தெளிவான கேள்வி; Σὺ என்பதன் வெளிப்படையான இரண்டாம் நபர் வலியுறுத்தலும் ‘நீ’ என்பதால் தக்கவைக்கப்படுகிறது.
- source_word: βασιλεὺς
  choice: அரசன்
  rationale: அரசுரிமை குறித்த விசாரணையைத் தெளிவாகக் காட்டுகிறது; பொதுவான ‘ஆட்சியாளர்’ என்பது அரசர் என்ற உரிமைக்கூற்றை வலுவிழக்கச் செய்யும்.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: வேதனை வரலாற்றுச் சூழலில் அரசியல்-மதப் பட்டமாக ‘யூதர்களின் அரசன்’ இயல்பாகப் பொருந்துகிறது; ‘யூதேயர்களின்’ என்ற புவியியல்-இன மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: அதற்கு அவர் ... என்றார்
  rationale: பதில் கூறும் செயலும் αὐτῷ குறிக்கும் தொடர்பும் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுகின்றன.
- source_word: Σὺ λέγεις
  choice: நீரே சொல்கிறீர்
  rationale: 'மிகச் சுருக்கமான கிரேக்கச் சொல்லின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது: இயேசு பட்டத்தை மறுக்கவில்லை; அதேவேளை அதை பிலாத்தின் சொற்களாக முன்வைக்கிறார். ‘-ஏ’ Σὺ என்பதன் வலியுறுத்தலை வெளிப்படுத்துகிறது.'
theological_decisions:
- issue: Σὺ λέγεις என்ற இயேசுவின் பதிலின் வலிமை
  choice: தகுதிப்படுத்தப்பட்ட ஒப்புதலைத் திறந்த நிலையில் வைத்திருக்கும் ‘நீரே சொல்கிறீர்’
  alternative: ‘ஆம், நீர் சொல்வதுபோல்தான்’ என்ற நேரடியான உறுதிப்படுத்தல்; அல்லது ‘அதை நீர்தான் சொல்கிறீர்’ என்ற விலகிய மறுமொழி
  rationale: கிரேக்கப் பதில் சுருக்கமானதும் ஒரு சாதாரண ‘ஆம்’ என்பதைவிட மறைமுகமானதும் ஆகும். அது ஒப்புதலாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் பட்டத்தின் வடிவமைப்பை பிலாத்தின் சொற்களாகவும் முன்வைக்கிறது. ஆகவே கிறிஸ்துவியல் பொருளை வலுப்படுத்தியோ வலுவிழக்கச் செய்தோ தீர்மானிக்காமல் மூலத்தின் இறையியல் மற்றும் சொல்லாட்சி சார்ந்த பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பிலாத்தின் பேச்சில் நேரடியான ‘நீ’ மூலத்தின் வெளிப்படையான Σὺ-ஐக் காக்கிறது; இயேசுவின் பதிலில் அதிகாரியிடம் பேசுவதற்குரிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. சொற்சொல்லான கிரேக்க அமைப்பைத் தமிழில் திணிக்காமல், அதன் சுருக்கமும் நோக்கமுள்ள இருபொருள் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
