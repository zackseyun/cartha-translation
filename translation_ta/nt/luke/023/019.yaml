source:
  edition: SBLGNT
  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: ta
  text: அவன் நகரத்தில் நடந்த ஒரு கிளர்ச்சிக்காகவும்[a] கொலைக்காகவும் சிறையில் தள்ளப்பட்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கலகம்.” கிரேக்கச் சொல் ஒரு கிளர்ச்சி, கலகம் அல்லது ஆட்சிக்கு எதிரான எழுச்சியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: அவன்
  rationale: இது முன்பு குறிப்பிடப்பட்ட பரபாஸைச் சுட்டுகிறது. தமிழில் தனி வசனமாகவும் முந்தைய வாக்கியத்தின் தொடர்ச்சியாகவும் இயல்பாக அமைய, உறவுப்பெயருக்குப் பதிலாகச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: διὰ
  choice: -க்காக
  rationale: Accusative-உடன் வரும் διὰ இங்கு காரணத்தைத் தெரிவிக்கிறது; சிறையில் அடைக்கப்பட்டதற்கான காரணத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: στάσιν
  choice: கிளர்ச்சி
  rationale: நகரில் நிகழ்ந்த அரசியல் அல்லது வன்முறை சார்ந்த எழுச்சி/கலகத்தை இச்சொல் குறிக்கலாம். ‘கிளர்ச்சி’ தெளிவான, தற்போதைய பொதுத்தமிழ் சொல்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τινὰ
  choice: ஒரு
  rationale: குறிப்பிடப்படாத ஒரு நிகழ்வு என்ற indefinite நுணுக்கத்தை இயல்பான தமிழில் ‘ஒரு’ வெளிப்படுத்துகிறது; ‘ஒரு குறிப்பிட்ட’ என்பது தேவைக்கு அதிகமாக அறியப்பட்ட தனிப்பட்ட நிகழ்வைக் குறிக்கக்கூடும்.
- source_word: γενομένην ἐν τῇ πόλει
  choice: நகரத்தில் நடந்த
  rationale: Participial phrase-ஐ தமிழில் பெயரெச்சத் தொடராக மாற்றி, நிகழ்வும் அதன் இடமும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன. கிரேக்கம் நகரத்தை எருசலேம் என்று பெயரிடாததால் ‘நகரத்தில்’ என்றே வைக்கப்பட்டுள்ளது.
- source_word: φόνον
  choice: கொலை
  rationale: φόνος சாதாரணமாக உயிரிழப்பை மட்டும் அல்ல, குற்றமாகிய கொலையைக் குறிக்கிறது; நீதித்துறைச் சூழலுக்கு ‘கொலை’ பொருத்தமானது.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: சிறையில் தள்ளப்பட்டிருந்தான்
  rationale: βάλλω என்பதின் passive வலிமையை ‘தள்ளப்பட்டு’ பாதுகாக்கிறது; கடந்தகாலத்தில் சிறையில் அடைக்கப்பட்ட நிலையை ‘இருந்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
