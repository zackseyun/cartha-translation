  source_fidelity: 'மூலக் கிரேக்கத்தின் எல்லாக் கூறுகளும் பாதுகாக்கப்பட்டுள்ளன: பரபாஸைக் குறிக்கும் உறவுத்தொடர், நகரத்தில் நிகழ்ந்த குறிப்பிடப்படாத ஒரு στάσις, அதற்கும் கொலைக்கும் சிறைவாசத்திற்குமான காரணத் தொடர்பு, மற்றும் βληθείς-இன் ‘சிறையில் தள்ளப்பட்ட’ வலிமை ஆகியவை தெளிவாக உள்ளன.'
  naturalness: “அவன் நகரத்தில் நடந்த ஒரு கிளர்ச்சிக்காகவும் கொலைக்காகவும் சிறையில் தள்ளப்பட்டிருந்தான்” என்பது நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. காரணங்களின் இணை அமைப்பும் தெளிவாக உள்ளது.
  terminology: ‘கிளர்ச்சி’ στάσις-க்கு பொருத்தமான முதன்மைத் தேர்வு; ‘கலகம்’ மற்றும் ‘ஆட்சிக்கு எதிரான எழுச்சி’ என்ற அடிக்குறிப்பு மாற்றுகள் பொருள்வட்டத்தை அளவோடு காட்டுகின்றன. ‘கொலை,’ ‘சிறை,’ மற்றும் ‘தள்ளப்பட்டிருந்தான்’ ஆகியவை நீதித்துறைச் சூழலுக்கு ஏற்றவை.
