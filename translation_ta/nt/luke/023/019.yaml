translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் நீதித்துறைச் சூழலுக்குரிய கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. காரணங்களின் இணை அமைப்பு ‘கிளர்ச்சிக்காகவும் … கொலைக்காகவும்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
