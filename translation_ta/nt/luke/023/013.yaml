  text: Πιλᾶτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: ta
  text: ஆனால் பிலாத்து, தலைமைக் குருக்களையும் ஆட்சியாளர்களையும் மக்களையும் ஒன்றுகூட்டி,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: பிலாத்து
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து பிலாத்துவின் நடவடிக்கைக்குத் திரும்பும் மென்மையான எதிர்நிலை/நிகழ்வுமாற்ற இணைப்பைப் பாதுகாக்கிறது.
- source_word: συγκαλεσάμενος
  choice: ஒன்றுகூட்டி
  rationale: அழைத்து ஒன்றாகச் சேர்த்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; அடுத்து வரும் பிலாத்துவின் உரைக்கு முன்னான செயலைக் குறிக்கும் வினையெச்ச வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே தலைமைக் குருவைக் குறிக்காமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மைச் சொல்லாகத் தெளிவுபடுத்துகிறது.
- source_word: ἄρχοντας
  choice: ஆட்சியாளர்கள்
  rationale: ஆளும் அல்லது அதிகாரம் வகிக்கும் தலைவர்களைக் குறிக்கும் சொல்லின் அதிகாரப்பூர்வத் தன்மையைப் பாதுகாக்கிறது.
- source_word: λαὸν
  choice: மக்கள்
  rationale: ஒரு கூட்டத்தை மட்டும் என்று குறுக்காமல், அங்கிருந்த மக்களைத் தொகுதியாகக் குறிக்கும் பொதுப்பொருளைப் பாதுகாக்கிறது.
