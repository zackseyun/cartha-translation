translation:
  language: ta
  text: இவர் பிலாத்துவிடம் சென்று, இயேசுவின் உடலைக் கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: இவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அரிமத்தியாவைச் சேர்ந்த யோசேப்பைச் சுட்டுகிறது. மரியாதையும் இயல்பான தமிழ்நடையும் காக்கும் வகையில் ‘இவர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: προσελθὼν
  choice: சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த உடன்சார் செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சம். தமிழில் ‘பிலாத்துவிடம் சென்று’ என்பது இயல்பாகவும் நிகழ்வின் வரிசையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: τῷ Πιλάτῳ
  choice: பிலாத்துவிடம்
  rationale: προσέρχομαι என்பதுடன் வரும் வேற்றுமை, அணுகிச் சென்ற நபரைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘பொந்தியு’ என்ற பெயரைச் சேர்க்காமல் ‘பிலாத்துவிடம்’ என வழங்கப்பட்டது.
- source_word: ᾐτήσατο
  choice: கேட்டார்
  rationale: இங்கு αἰτέω என்பதன் பொருள் ஒன்றைத் தரும்படி கேட்பது. ‘உடலைக் கேட்டார்’ என்பது தமிழில் வேண்டுகோளின் பொருளைச் சூழலால் தெளிவாக வெளிப்படுத்துகிறது; ‘கோரினார்’ என்பதைவிட எளிமையானது.
- source_word: τὸ σῶμα
  choice: உடலை
  rationale: σῶμα என்பதன் நேரடிப் பொருள் ‘உடல்’. இயேசு இறந்திருந்தார் என்பது சூழலில் தெளிவாயினும், ‘சடலம்’ என்று மொழிபெயர்ப்பது மூலத்தைவிட அதிகமாக விளக்குவதோடு கடுமையான தொனியையும் தரும்.
- source_word: τοῦ Ἰησοῦ
  choice: இயேசுவின்
  rationale: இந்த உருபுத் தொடர் உடைமை அல்லது தொடர்பைக் குறிக்கிறது. ‘இயேசுவின் உடல்’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
