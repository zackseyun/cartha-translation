revisions:
- from: பண்டிகையின்போது அவர்களுக்கு ஒருவனை விடுதலை செய்ய வேண்டிய கட்டாயம் அவருக்கு இருந்தது.[a]
  to: பண்டிகையின்போது அவர்களுக்கு ஒருவனை விடுதலை செய்ய வேண்டிய கடமை அவருக்கு இருந்தது.[a]
  rationale: 'A single lexical revision changes ‘கட்டாயம்’ to ‘கடமை’ so that the Tamil reflects obligation/necessity rather than coercion. The footnote needs no substantive alteration: it appropriately reports the significant textual variation without presenting the proposed harmonization as certain.'
