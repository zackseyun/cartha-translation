translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. δέ என்பதற்கு தனியே ‘ஆனால்/இப்போது’ சேர்க்கப்படவில்லை; இவ்வசனத்தின் தனித்த சூழலில் அத்தகைய இணைப்புச் சொல் தேவையற்ற எதிர்மறை அல்லது கால நுணுக்கத்தை உருவாக்கக்கூடும். முழு வசனத்திற்குரிய உரைவேறுபாட்டுக் குறிப்பான [a] வசன முடிவில் வைக்கப்பட்டுள்ளது.
