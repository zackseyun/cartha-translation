  text: Ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: ta
  text: பண்டிகையின்போது அவர்களுக்கு ஒருவனை விடுதலை செய்ய வேண்டிய கடமை அவருக்கு இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான பல கிரேக்கக் கையெழுத்துப் பிரதிகளில் இல்லை. அவற்றில் மூன்றாம் நூற்றாண்டைச் சேர்ந்த பப்பிரஸ் 75, நான்காம் நூற்றாண்டைச் சேர்ந்த வத்திக்கான் கையெழுத்துப் பிரதி ஆகியவையும் அடங்கும்; பழமையான காப்டிக் மொழிபெயர்ப்புகள் சிலவற்றிலும் இது இல்லை. ஆனால் நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய் கையெழுத்துப் பிரதி போன்ற வேறு முக்கியமான பழமையான பிரதிகளிலும், லத்தீன் மரபிலும், பிற்கால பைசாந்தியப் பெரும்பான்மைப் பிரதிகளிலும் இது உள்ளது. மத்தேயு 27:15 மற்றும் மாற்கு 15:6 ஆகியவற்றில் சொல்லப்படும் கைதியை விடுவிக்கும் வழக்கத்தோடு லூக்காவின் பதிவை ஒத்திசைக்க நகலெடுத்தவர்கள் இதைச் சேர்த்திருக்கலாம். சில கையெழுத்துப் பிரதிகள் இந்த வாக்கியத்தை 18ஆம் வசனத்திற்குப் பிறகு வைக்கின்றன.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην εἶχεν
  choice: செய்ய வேண்டிய கட்டாயம் அவருக்கு இருந்தது
  rationale: ἀνάγκην ἔχειν என்பது ‘தேவையின் கீழ் இருத்தல்’ அல்லது ‘கட்டாயத்துக்கு உட்பட்டிருத்தல்’ என்ற பொருளுடைய சொற்றொடர். சட்டம் அல்லது வழக்கத்தால் பிலாத்துவுக்கு ஏற்பட்டிருந்த கட்டுப்பாட்டை இயல்பான நவீனத் தமிழில் இது தெரிவிக்கிறது.
- source_word: ἀπολύειν
  choice: விடுதலை செய்ய
  rationale: காவலில் உள்ள ஒருவரை விடுவிப்பதைக் குறிக்கும் சட்டச் சூழலுக்கு ‘விடுதலை செய்ய’ என்பது தெளிவான பொருத்தம்.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: கிரேக்கத்தின் மறைமுக வேற்றுமைப் பொருளை நேரடியாகக் காக்கிறது; மக்களின் வேண்டுகோளுக்கிணங்க அவர்களிடம் ஒருவனை விடுவிப்பது என்ற சூழலைத் தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: κατὰ ἑορτήν
  choice: பண்டிகையின்போது
  rationale: பண்டிகையுடன் தொடர்புடைய சந்தர்ப்பத்தை இயல்பான தமிழில் காட்டுகிறது. இங்கு குறிப்பாகப் பஸ்கா சூழல் இருந்தாலும், மூலத்தில் உள்ள பொதுச் சொல்லை மொழிபெயர்ப்பிலேயே ‘பஸ்கா’ எனக் குறுக்கவில்லை.
- source_word: ἕνα
  choice: ஒருவனை
  rationale: விடுதலை செய்யப்படும் ஒரு ஆண் நபரைக் குறிக்கும் எண்ணுப் பெயரின் பொருளைச் சுருக்கமாகக் காக்கிறது.
