  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: ta
  text: கலிலேயாவிலிருந்து அவருடன் வந்திருந்த[a] பெண்கள் பின்தொடர்ந்து, கல்லறையையும் அவருடைய உடல் எப்படி வைக்கப்பட்டது என்பதையும் பார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கலிலேயாவிலிருந்து அவரோடு வந்திருந்த.”
    reason: சொற்றொடரின் மாற்று இயல்பான வடிவம்; συνεληλυθυῖαι ... αὐτῷ என்பதில் கலிலேயாவிலிருந்து அவருடன் வந்திருந்த தொடர்பு பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: பின்தொடர்ந்து சென்று
  rationale: இறந்தகாலப் பங்கேற்புவினை பெண்களின் செயலை முதன்மை வினைக்கு முன் நிகழ்ந்த தொடர்ச்சியான செயலாகக் காட்டுகிறது. தமிழில் ‘பின்தொடர்ந்து சென்று’ என்பது இயல்பாகவும் நிகழ்வுகளின் வரிசையைத் தெளிவாகவும் தருகிறது; யாரைப் பின்தொடர்ந்தார்கள் என்பதை கிரேக்கம் வெளிப்படையாகக் கூறாததால் தமிழிலும் அதைச் சேர்க்கவில்லை.
- source_word: δέ
  choice: தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை
  rationale: இது மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வாக்கிய வரிசையே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் ‘இப்போது’ அல்லது ‘அப்போது’ போன்ற கூடுதல் காலப்பொருள் கொண்ட சொல்லைச் சேர்க்கவில்லை.
- source_word: αἱ γυναῖκες
  choice: பெண்கள்
  rationale: கிரேக்கக் குறிப்புச்சுட்டு முன்பே அறிமுகமான பெண்களைக் குறிக்கிறது; அவர்களை விவரிக்கும் சார்புத்தொடருடன் வரும் தமிழ்ச் சொற்றொடர் அந்த அறியப்பட்ட குழுவை இயல்பாக அடையாளப்படுத்துகிறது.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: கலிலேயாவிலிருந்து அவருடன் வந்திருந்த
  rationale: முன்னரே நிகழ்ந்த உடன்வருதலையும், புறப்பட்ட இடமான கலிலேயாவையும், இயேசுவுடனான தொடர்பையும் காக்கிறது. ‘வந்திருந்த’ என்பது கிரேக்கத்தின் நிறைவுற்ற முந்தைய நிலையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐθεάσαντο
  choice: பார்த்தார்கள்
  rationale: கவனத்துடன் காணுதல் என்ற நுண்பொருள் சூழலிலும் தொடர்ந்து வரும் இரு பொருள்களிலும் வெளிப்படுகிறது. ‘பார்த்தார்கள்’ என்பது பொதுவாசகர்களுக்கு இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: τὸ μνημεῖον
  choice: கல்லறை
  rationale: இயேசுவின் அடக்கச் சூழலில் μνημεῖον என்பதற்கான துல்லியமான, வழக்கமான தமிழ்ச் சொல்.
- source_word: ὡς ἐτέθη
  choice: எப்படி வைக்கப்பட்டது
  rationale: ὡς செயல் நிகழ்ந்த முறையை அறிமுகப்படுத்துகிறது; τίθημι-யின் இறப்பினைச் செயப்பாட்டுவினை அடக்கச் சூழலில் உடல் வைக்கப்பட்ட விதத்தைக் குறிக்கிறது. ‘வைக்கப்பட்டது’ உடலின் குறிப்பிட்ட நிலையையோ சடங்கு முறையையோ தேவையின்றி சேர்ப்பதில்லை.
- source_word: τὸ σῶμα αὐτοῦ
  choice: அவருடைய உடல்
  rationale: உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κατακολουθήσασαι என்ற பங்கேற்புவினைக்கும் ἐθεάσαντο என்ற முதன்மை வினைக்கும் இடையிலான நிகழ்வு வரிசை
  choice: ‘பின்தொடர்ந்து சென்று ... பார்த்தார்கள்’ என தொடர்செயலாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘பின்தொடர்ந்த பிறகு ... பார்த்தார்கள்’ அல்லது இன்னும் வடிவநெருக்கமாக பங்கேற்புவினை அமைப்பைப் பிரதிபலித்தல்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காக்கும் மொழிநடைத் தீர்மானம். பெண்கள் முதலில் பின்தொடர்ந்து சென்று, பின்னர் கல்லறையையும் உடல் வைக்கப்பட்ட விதத்தையும் கண்டார்கள் என்ற தொடர்ச்சி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை கண்ணியமான கதைநடை. கிரேக்கத்தில் வெளிப்படையாக இல்லாத பின்தொடரப்பட்ட நபரையோ கூடுதல் காலக் குறியீட்டையோ சேர்க்கவில்லை.
