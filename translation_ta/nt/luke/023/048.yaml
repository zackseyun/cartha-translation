reference: Luke 23:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: ta
  text: இந்தக் காட்சியைக் காணக் கூடிவந்திருந்த மக்கள் அனைவரும், நடந்தவற்றைக் கண்டபின், தங்கள் மார்பில் அடித்துக்கொண்டே திரும்பிச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மார்பில் அடித்துக்கொள்வது துக்கம், புலம்பல் அல்லது அதிர்ச்சியை வெளிப்படுத்தும் ஒரு சைகை.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: கூடிவந்திருந்த
  rationale: மக்கள் அந்த இடத்துக்கு ஒன்றாக வந்து கூடியிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; முன்பே நிகழ்ந்த வருகையையும் சூழலையும் காக்கிறது.
- source_word: ὄχλοι
  choice: மக்கள் கூட்டத்தினர்
  rationale: கிரேக்கப் பன்மையின் கூட்டுத்தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: இந்தக் காட்சியைக் காண
  rationale: θεωρία என்பதிலுள்ள பொதுமக்கள் பார்வைக்கு முன்வந்த காட்சி அல்லது பார்வையிடுதல் என்ற பொருளை, சிலுவை நிகழ்வை இகழ்ச்சியான ‘வேடிக்கை’ எனத் தவறாக உணர்த்தாமல் தருகிறது.
- source_word: θεωρήσαντες
  choice: கண்டபின்
  rationale: முதன்மை வினைக்கு முன்னர் நிகழ்ந்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὰ γενόμενα
  choice: நடந்தவற்றை
  rationale: நிகழ்ந்த காரியங்கள் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: τύπτοντες τὰ στήθη
  choice: தங்கள் மார்பில் அடித்துக்கொண்டே
  rationale: உடல் செயலைத் தெளிவாகக் காக்கிறது; மனந்திரும்புதல் அல்லது குறிப்பிட்ட ஓர் உணர்ச்சியை உரையில் சேர்க்கவில்லை.
- source_word: ὑπέστρεφον
  choice: திரும்பிச் சென்றார்கள்
  rationale: அங்கிருந்து மீண்டும் சென்றதைக் காட்டுகிறது; ‘அடித்துக்கொண்டே’ என்பதுடன் சேர்ந்து கிரேக்க இறந்தகாலத் தொடர்நிலையின் காட்சித் தொடர்ச்சியையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: மக்கள் செய்த சைகையின் உணர்ச்சி மற்றும் ஆன்மீகப் பொருள்
  choice: மார்பில் அடித்துக்கொண்ட செயலை மட்டும் மொழிபெயர்த்து, அதன் உள்ளார்ந்த பொருளைத் தீர்மானிக்காமல் விடுதல்
  alternative: அவர்கள் மனந்திரும்பினார்கள் அல்லது துக்கம்/அதிர்ச்சி அடைந்தார்கள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரை வெளிப்புறச் செயலை விவரிக்கிறது; அது மனந்திரும்புதல், குற்றவுணர்வு, துக்கம் அல்லது அதிர்ச்சி ஆகியவற்றில் எது என்பதைத் தெளிவாகக் குறிப்பிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை கண்ணியமான நடை. ‘காட்சி’ என்பது θεωρία-வின் பார்வைக்குரிய நிகழ்வு என்ற பொருளைக் காக்கிறது; தமிழில் எதிர்மறை நிழற்பொருள் தரக்கூடிய ‘வேடிக்கை’ தவிர்க்கப்பட்டுள்ளது.
