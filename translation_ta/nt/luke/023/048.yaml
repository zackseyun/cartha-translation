  verdict: revise
  source_fidelity: 'வரைவின் பொருள் மூலக் கிரேக்கத்துக்கு நெருக்கமாக உள்ளது: மக்கள் காட்சியைக் காணக் கூடிவந்தனர்; நிகழ்ந்தவற்றைக் கண்டனர்; மார்பில் அடித்துக்கொண்டு திரும்பிச் சென்றனர். இருப்பினும், «மக்கள் கூட்டத்தினர் அனைவரும்» என்பது ஒரே கூட்டுப்பொருளை இருமுறை கூறுவதால் இயல்பற்றதாக உள்ளது.'
  naturalness: «இந்தக் காட்சியைக் காணக் கூடிவந்திருந்த மக்கள் அனைவரும்» என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. «அடித்துக்கொண்டே திரும்பிச் சென்றார்கள்» கிரேக்கத்தின் ஒரேநேரச் செயல் மற்றும் தொடர்ச்சியான திரும்பிச் செல்லுதலை போதுமான அளவு வெளிப்படுத்துகிறது.
  terminology: «காட்சி» θεωρία என்பதன் பொதுமக்கள் காணும் நிகழ்வு/பார்வை என்ற பொருளைச் சரியாகக் காக்கிறது; இழிவான நிழற்பொருள் தரக்கூடிய «வேடிக்கை» தவிர்க்கப்படுவது பொருத்தமானது. «தங்கள் மார்பில் அடித்துக்கொண்டே» என்பது τύπτοντες τὰ στήθη என்பதன் உடற்சைகையை விளக்கமின்றி உண்மையாகத் தருகிறது.
