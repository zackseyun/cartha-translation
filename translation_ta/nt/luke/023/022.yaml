reference: Luke 23:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் மூன்றாவது முறையாகக் கூறினார்: “ஏன்?[a] இவன் என்ன தீமை செய்தான்? மரண தண்டனைக்குரிய எந்தக் குற்றத்தையும் இவனிடம் நான் காணவில்லை.[b] ஆகவே, இவனைத் தண்டித்துவிட்டு விடுதலை செய்வேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவன் என்ன தீமை செய்தான்?” தொடக்கத்திலுள்ள Τί என்பது அடுத்து வரும் முழுக் கேள்வியை அறிமுகப்படுத்தும் சுருக்கமான எதிர்ப்புக் கேள்வியாகப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மரணத்துக்கான காரணம் எதையும்,” “மரணத்துக்குத் தகுதியான எதையும்,” அல்லது “மரணத் தீர்ப்புக்கான அடிப்படை எதையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: மூன்றாவது முறையாக
  rationale: மீண்டும் நிகழ்வதைச் சுட்டும் வினையடைப் பயன்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; கதையின் வலியுறுத்தலையும் காக்கிறது.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: ஏன்? இவன் என்ன தீமை செய்தான்?
  rationale: Τί என்பதைச் சுருக்கமான எதிர்ப்புக் கேள்வியாகவும், அதைத் தொடர்ந்து வரும் முழுக் கேள்வியையும் தனித்தனியாகவும் காக்கிறது. κακόν என்பதன் அறநெறி வலிமையை ‘தீமை’ வெளிப்படுத்துகிறது.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: மரண தண்டனைக்குரிய குற்றம் எதையும்
  rationale: நீதித்துறைச் சூழலில் αἴτιον குற்றம் அல்லது தீர்ப்புக்கான அடிப்படையைக் குறிக்கிறது. மரணத் தீர்ப்புக்கான ஆதாரம் இல்லை என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εὗρον ἐν αὐτῷ
  choice: இவனிடம் நான் காணவில்லை
  rationale: ἐν αὐτῷ என்பதைக் ‘இவனிடம்’ என நெருக்கமாகக் காக்கிறது; பிலாத்துவின் தற்போதைய நீதிமன்ற முடிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: παιδεύσας
  choice: இவனைத் தண்டித்துவிட்டு
  rationale: இச்சூழலில் παιδεύω மரணத்துக்கு முந்திய குறைந்த அளவிலான தண்டனை நடவடிக்கையைக் குறிக்கிறது. தமிழில் ‘ஒழுக்கப்படுத்தி’ என்பது இங்கு தேவையற்ற கல்வி அல்லது திருத்தப் பொருளைத் தரக்கூடும்; ‘தண்டித்துவிட்டு’ தண்டனையின் குறிப்பிட்ட வடிவத்தை நிர்ணயிக்காமல் வைக்கிறது.
- source_word: ἀπολύσω
  choice: விடுதலை செய்வேன்
  rationale: நீதித்துறைச் சூழலிலுள்ள விடுவித்தல் என்ற பொருளை கண்ணியமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: παιδεύσας என்பதில் பிலாத்து முன்மொழிந்த நடவடிக்கையின் தன்மை
  choice: குறிப்பிட்ட தண்டனை முறையைச் சொல்லாமல் பொதுவாக ‘தண்டித்துவிட்டு’ என மொழிபெயர்த்தல்
  alternative: ‘சாட்டையால் அடித்துவிட்டு’ எனக் குறிப்பாக்குதல்
  rationale: இயேசு மரணத்துக்குரியவர் அல்ல என்று அறிவித்தபோதும் அவருக்கு ஒரு குறைந்த தண்டனையை வழங்க பிலாத்து முன்வரும் பதற்றத்தை வசனம் காக்கிறது. ஆனால் இந்த வினைச்சொல் மட்டும் தண்டனையின் துல்லியமான வடிவத்தை நிர்ணயிக்காததால், முதன்மை உரை அதைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இவன்’ என்பது οὗτος மற்றும் αὐτῷ ஆகியவற்றின் நெருக்கமான சுட்டுப் பொருளையும் பிலாத்துவின் நேரடி பேச்சின் இயல்பையும் காக்கிறது. வாக்கிய அமைப்பு பொதுவாசகர்களுக்குத் தெளிவாக இருக்கும்படி இயல்பாக்கப்பட்டாலும், கிரேக்க உரையின் கேள்வி ஓட்டமும் தீர்ப்புக்கும் தண்டனைக்கும் இடையிலான பதற்றமும் காக்கப்பட்டுள்ளன.
