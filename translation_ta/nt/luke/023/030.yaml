  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: ta
  text: அப்போது அவர்கள் மலைகளிடம்[a], ‘எங்கள்மேல் விழுங்கள்’ என்றும், குன்றுகளிடம்[b], ‘எங்களை மூடுங்கள்’ என்றும் சொல்லத் தொடங்குவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தச் சொற்கள் தீர்க்கதரிசன நூல்களிலுள்ள தீர்ப்பைப் பற்றிய மொழியை, குறிப்பாக ஓசியா 10:8-ஐ, எதிரொலிக்கின்றன.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘எங்களை மறைத்துவிடுங்கள்.’ இந்த வினைச்சொல்லின் நேரடிப் பொருள் ‘மூடுங்கள்’; ஆனால் இச்சூழலில் வரவிருக்கும் தீர்ப்பிலிருந்து மறைத்தல் என்ற கருத்தையும் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முந்தைய சூழலைத் தொடர்ந்து நிகழவிருப்பதைக் குறிக்கும் கால வினையடை; இயல்பான நவீனத் தமிழ்.
- source_word: ἄρξονται λέγειν
  choice: சொல்லத் தொடங்குவார்கள்
  rationale: ἄρξονται என்பதன் தொடக்கநிலைக் கருத்தையும், λέγειν என்பதன் சொல்லுதல் என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῖς ὄρεσιν
  choice: மலைகளைப் பார்த்து
  rationale: ὄρος என்பதற்கு ‘மலை’ எனத் தந்து, தொடர்ந்து வரும் βουνός என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது; உயிரற்றவற்றை நோக்கிச் சொல்லும் தமிழில் ‘பார்த்து’ இயல்பாக உள்ளது.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: எங்கள்மேல் விழுங்கள்
  rationale: பன்மை கட்டளை வடிவையும் ἐπί + accusative குறிக்கும் மேல்நோக்கிய இயக்கத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τοῖς βουνοῖς
  choice: குன்றுகளைப் பார்த்து
  rationale: βουνός என்பதன் சிறிய உயர்நிலம் அல்லது குன்று என்ற பொருளைத் தந்து, ‘மலைகள்’ என்பதுடனான சொல் வேறுபாட்டைக் காக்கிறது.
- source_word: Καλύψατε ἡμᾶς
  choice: எங்களை மூடுங்கள்
  rationale: καλύπτω என்பதன் அடிப்படைப் பொருளான ‘மூடு’ என்பதைப் பாதுகாக்கிறது; சூழலில் மறைத்தல் என்ற உட்பொருளும் உள்ளது.
