id: LUK.23.47
reference: Luke 23:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: ta
  text: நடந்ததைக் கண்ட நூற்றுவர் படைத்தலைவன், “உண்மையாகவே இந்த மனிதர் நீதிமானாக இருந்தார்[a]” என்று சொல்லி கடவுளை மகிமைப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றமற்றவர்” அல்லது “நீதியுள்ளவர்.” இங்குள்ள கிரேக்கச் சொல் சூழலுக்கேற்ப ஒழுக்கரீதியான நீதியையோ சட்டரீதியான குற்றமின்மையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: கண்ட
  rationale: 'இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது: நடந்ததை அவர் கண்டபோது/கண்டபின் முதன்மைச் செயல் நிகழ்ந்தது.'
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான கதைத் தொடர்ச்சி இணைப்புச்சொல். தமிழில் தனியே ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உருவாக்கும்; வாக்கியத் தொடரே அதன் பணியை நிறைவேற்றுகிறது.
- source_word: ἑκατοντάρχης
  choice: நூற்றுவர் படைத்தலைவன்
  rationale: ரோமப் படையின் குறிப்பிட்ட பதவியைப் பாதுகாக்கிறது; அதேவேளை ‘நூற்றுவர் தலைவர்’ என்பதைக் காட்டிலும் இன்றைய சாதாரண வாசகருக்கு இது படைத்துறைப் பதவி என்பது தெளிவாகிறது.
- source_word: τὸ γενόμενον
  choice: நடந்ததை
  rationale: அவர் அப்போது கண்ட நிகழ்வை இயல்பான, சுருக்கமான தமிழில் குறிக்கிறது.
- source_word: ἐδόξαζεν
  choice: மகிமைப்படுத்தினார்
  rationale: δοξάζω என்பதன் வலுவான மதச்சார்ந்த பொருளைப் பாதுகாக்கிறது. கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தை தமிழில் செயற்கையாக ‘மகிமைப்படுத்தத் தொடங்கினார்’ என்று விரிவாக்காமல், சூழலுக்கேற்ற இயல்பான இறந்தகாலமாக வழங்குகிறது.
- source_word: τὸν θεὸν
  choice: கடவுளை
  rationale: நேரடிச் செயப்படுபொருளை நவீன நிலையான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: λέγων
  choice: என்று சொல்லி
  rationale: அவர் கடவுளை மகிமைப்படுத்திய விதத்தையும் அவர் கூறிய சொற்களையும் இயல்பாக இணைக்கிறது.
- source_word: Ὄντως
  choice: உண்மையாகவே
  rationale: வலுவான உறுதிப்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: இந்த மனிதர்
  rationale: இயேசுவைக் குறிக்கும் குறிப்பிட்ட ஆண் நபர் என்ற பொருளை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: δίκαιος
  choice: நீதிமான்
  rationale: அச்சொல்லின் ஒழுக்க மற்றும் இறையியல் நிறையைப் பாதுகாக்கிறது; இச்சூழலில் ‘குற்றமற்றவர்’ என்ற சட்டரீதியான பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: கடந்தகால εἰμί வடிவத்தை இயல்பாகவும், நபருக்குரிய தமிழ் மரியாதை விகுதியுடனும் வழங்குகிறது.
theological_decisions:
- issue: நூற்றுவர் படைத்தலைவனின் கூற்றிலுள்ள δίκαιος என்பதன் பொருள்
  choice: நீதிமான்
  alternative: குற்றமற்றவர் அல்லது நீதியுள்ளவர்
  rationale: ‘நீதிமான்’ என்பது கிரேக்கச் சொல்லின் ஒழுக்க மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது. அதே நேரத்தில், லூக்கா வலியுறுத்தும் இயேசுவின் அநியாயமான தண்டனை என்ற சூழலில் ‘குற்றமற்றவர்’ என்பதும் சாத்தியம். முதன்மை உரை அந்தத் தெளிவின்மையை ஒருதலைப்பட்சமாகத் தீர்க்காமல், மாற்றுப் பொருளை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நூற்றுவர் படைத்தலைவன்’ என்பது வரலாற்றுப் பதவியின் தனித்தன்மையையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கிறது. மேற்கோளில் மரியாதை ஒருமை பயன்படுத்தப்பட்டாலும், மூலத்தின் கருத்தை விட கூடுதல் கிறிஸ்தவப் பட்டம் எதுவும் சேர்க்கப்படவில்லை.
