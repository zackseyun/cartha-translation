  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: ta
  text: ஆனால் ஏரோதும் அப்படிக் காணவில்லை; ஏனெனில் அவர் இவரை நம்மிடம் திருப்பி அனுப்பினார். இதோ, இவர் மரண தண்டனைக்குரிய எதையும் செய்திருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவரிடத்தில் மரண தண்டனைக்குரிய எதுவும் காணப்படவில்லை.”
    reason: αὐτῷ என்பதை செய்பவராக அல்லாமல், இயேசுவில் அல்லது அவரைப் பொறுத்தவரை அத்தகைய குற்றம் எதுவும் இல்லை என்ற தொடர்புப் பொருளில் எடுத்துக்கொள்ளலாம்.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: ஏரோதும் அப்படிக் காணவில்லை
  rationale: முந்தைய வசனத்தில் பிலாத்து கூறிய ‘குற்றம் காணவில்லை’ என்ற கருத்து இங்கு விடுபட்டுள்ளது. தமிழில் வாக்கியம் இயல்பாகவும் தொடர்பு தெளிவாகவும் இருக்க ‘அப்படிக் காணவில்லை’ என்று அந்த விடுபட்ட கருத்து வெளிப்படுத்தப்பட்டது; οὐδέ தரும் ‘ஏரோதும் இல்லை’ என்ற இணைப்பும் காக்கப்பட்டது.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: ஏனெனில் அவர் இவரை நம்மிடம் திருப்பி அனுப்பினார்
  rationale: γάρ காரண விளக்கத்தைக் குறிக்கிறது. இந்த நீதித்துறைச் சூழலில் ἀναπέμπω இயேசுவை பிலாத்துவிடம் திருப்பி அனுப்பியதைக் குறிக்கிறது. குழப்பத்தைத் தவிர்க்க ஏரோதுக்கு ‘அவர்’, இயேசுவுக்கு ‘இவர்’ பயன்படுத்தப்பட்டது.
- source_word: καὶ ἰδοὺ
  choice: பாருங்கள்
  rationale: ἰδού அடுத்து வரும் முடிவின்மீது கேட்போரின் கவனத்தைத் திருப்புகிறது. ‘இதோ’ என்பதையும் விட இங்கு நேரடியாக உரையாடும் ‘பாருங்கள்’ நவீனத் தமிழில் இயல்பானது.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: மரண தண்டனைக்குரிய எதையும்
  rationale: இது வெறுமனே இறப்பைப் பற்றியது அல்ல; மரண தண்டனையை நியாயப்படுத்தும் குற்றம் எதுவும் இல்லை என்ற நீதித்துறைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: இவர் ... எதையும் செய்திருக்கவில்லை
  rationale: முற்றுப்பெற்ற செயலின் தற்போதைய தொடர்பை ‘செய்திருக்கவில்லை’ இயல்பாக வெளிப்படுத்துகிறது. αὐτῷ என்பதை செயலைச் செய்தவரைக் குறிக்கும் வேற்றுமையாகப் புரிந்துகொண்டு, இயேசு மரண தண்டனைக்குரிய செயல் எதையும் செய்யவில்லை என்ற பிலாத்துவின் தீர்ப்பைத் தருகிறது.
theological_decisions:
- issue: πεπραγμένον αὐτῷ என்பதில் αὐτῷ-வின் பங்கு
  choice: 'செய்பவர்: ‘இவர் ... எதையும் செய்திருக்கவில்லை’'
  alternative: 'தொடர்பு/நிலை: ‘இவரிடம் ... எதுவும் காணப்படவில்லை’'
  rationale: சூழலில் பிலாத்து இயேசுவின்மீது மரண தண்டனைக்குரிய குற்றம் இல்லை என்று அறிவிக்கிறார். செய்பவர் என்ற வாசிப்பு அதைக் கூர்மையாகக் கூறுகிறது; இருப்பினும் கிரேக்க தத்துவத்தின் வேற்றுமையை பிரதிபலிக்கும் தொடர்பு வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, எளிதில் புரியும், நீதிமன்ற அறிவிப்புக்கேற்ற கண்ணியமான தமிழ். ‘இதோ’ போன்ற சற்றுப் பழைய நடை தவிர்க்கப்பட்டு ‘பாருங்கள்’ பயன்படுத்தப்பட்டது; ஏரோது மற்றும் இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்கள் தெளிவுபடுத்தப்பட்டன.
