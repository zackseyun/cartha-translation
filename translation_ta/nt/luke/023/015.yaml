  source_fidelity: முதற் தொடரில் ἀλλ’ தரும் வெளிப்படையான எதிர்மறைத் தொடர்ப்பு (‘ஆனால்’) விடுபட்டுள்ளது. அதைச் சேர்ப்பது பிலாத்துவின் முந்தைய தீர்ப்புடன் ஏரோதின் தீர்ப்பையும் இணைக்கும் மூலத்தின் வலிமையைத் தக்கவைக்கிறது. ἰδού-க்கு ‘இதோ’ என்பது உரையாடல்-கவன ஈர்ப்பை, கூடுதலான கேட்போர்-கட்டளையைச் சேர்க்காமல், நேரடியாகக் காட்டுகிறது. மற்ற கூறுகள் மூலத்துடன் பொருந்துகின்றன.
  naturalness: ‘ஆனால் ஏரோதும் அப்படிக் காணவில்லை’ நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘இதோ’ இந்நீதிமன்ற அறிவிப்பின் கண்ணியமான பதிவுக்குப் பொருத்தமானது. ‘மரண தண்டனைக்குரிய எதையும் செய்திருக்கவில்லை’ என்பது இயல்பானது.
