id: LUK.23.34
reference: Luke 23:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: ta
  text: ஆனால் இயேசு, “தந்தையே, அவர்களை மன்னியுங்கள்; ஏனெனில், அவர்கள் என்ன செய்கிறார்கள் என்பது அவர்களுக்குத் தெரியவில்லை” என்று சொல்லிக்கொண்டிருந்தார்.[a] அவர்கள் அவருடைய ஆடைகளைப் பங்கிட்டுக்கொண்டு, சீட்டுப் போட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “தந்தையே, அவர்களை மன்னியுங்கள்; ஏனெனில், அவர்கள் என்ன செய்கிறார்கள் என்பது அவர்களுக்குத் தெரியவில்லை” என்ற சொற்கள் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்து அல்லது மீண்டும் கூறிய செயலைக் குறிக்கக்கூடும்; எளிய ‘சொன்னார்’ என்பதைவிட இத்தேர்வு அந்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: Πάτερ
  choice: தந்தையே
  rationale: நேரடி அழைப்பைக் குறிக்கும் விளிவேற்றுமை. கிரேக்கத்தில் இல்லாத ‘என்’ என்ற உடைமைப் பொருளைச் சேர்க்காமல், இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἄφες
  choice: மன்னியுங்கள்
  rationale: குற்றம் செய்தவர்களைப் பற்றி கடவுளிடம் செய்யப்படும் வேண்டுதலில் ἀφίημι என்பதற்கு ‘மன்னியுங்கள்’ என்பது சூழலுக்கேற்ற இயல்பான பொருள்.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: இவர்கள் யார் என்பதை கிரேக்க உரை இவ்வாக்கியத்திலேயே மேலும் வரையறுக்கவில்லை; சுட்டுப்பெயர் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: ஏனெனில், அவர்கள் என்ன செய்கிறார்கள் என்பது அவர்களுக்குத் தெரியவில்லை
  rationale: οἶδα என்பதன் நேரடியான ‘தெரிதல்/அறிதல்’ பொருளைப் பாதுகாக்கிறது; ‘புரிந்துகொள்ளவில்லை’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: διαμεριζόμενοι
  choice: பங்கிட்டுக்கொண்டு
  rationale: இயேசுவின் ஆடைகளைத் தங்களுக்குள் பிரித்துக்கொள்ளும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἱμάτια
  choice: ஆடைகளை
  rationale: உடலில் அணியும் பொருட்களைக் குறிக்கும் சொல்லுக்கு எளிதில் புரியும், கண்ணியமான பொதுத் தமிழ் இணை.
- source_word: ἔβαλον κλήρους
  choice: சீட்டுகளைப் போட்டார்கள்
  rationale: பங்குகளைத் தீர்மானிக்கப் பயன்படுத்தப்பட்ட பழங்காலச் சீட்டுப்போடும் நடைமுறையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: δὲ
  choice: ஆனால் / பின்னர்
  rationale: முதல் δέ மெல்லிய மாறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ என்றும், இரண்டாவது கதைத் தொடர்ச்சியைக் காட்டுவதால் இயல்பான தமிழில் ‘பின்னர்’ என்றும் சூழலுக்கேற்ப மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘தந்தையே, அவர்களை மன்னியுங்கள்...’ என்ற கூற்றின் உரை நம்பகத்தன்மை
  choice: முதன்மை உரையில் சேர்க்கப்பட்டது
  alternative: சில கையெழுத்துப் பிரதிகளில் இந்தக் கூற்று இல்லை
  rationale: SBLGNT இக்கூற்றை உரை வேறுபாட்டைக் காட்டும் குறிகளுக்குள் முதன்மை உரையாக அச்சிடுகிறது. ஆகவே அது மொழிபெயர்ப்பில் சேர்க்கப்பட்டு, குறிப்பிடத்தக்க கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தந்தையே’ என்பது இயல்பான நேரடி அழைப்பாகவும், ‘சொல்லிக்கொண்டிருந்தார்’ என்பது கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியான அம்சத்தை வெளிப்படுத்தவும் தேர்ந்தெடுக்கப்பட்டது. குறிப்பிடத்தக்க உரை வேறுபாடு [a] மூலம் முதன்மை உரிலும் அடிக்குறிப்பிலும் காட்டப்பட்டுள்ளது.
