id: LUK.23.40
reference: Luke 23:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: ta
  text: ஆனால், மற்றொருவன் அவனைக் கடிந்துகொண்டு, “நீயும் அதே தீர்ப்புக்கு உட்பட்டிருக்கும்போது, கடவுளுக்குக்கூட அஞ்சுவதில்லையா?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: ஆனால் மற்றவன் … என்றான்
  rationale: ἀποκριθείς மற்றும் ἔφη ஆகிய இரு பேச்சு அறிமுகக் கூறுகளையும் தமிழில் இயல்பான ஒரே பேச்சு அறிமுகமாக இணைக்கிறது; δέ தரும் மிதமான எதிர்மறை வேறுபாட்டை “ஆனால்” வெளிப்படுத்துகிறது.
- source_word: ἐπιτιμῶν αὐτῷ
  choice: அவனைக் கடிந்துகொண்டு
  rationale: ἐπιτιμάω என்பதன் கூர்மையான கண்டிப்பு உணர்வையும், பேசும்போதே நிகழும் செயல் என்ற பங்கேற்புவினை உறவையும் காக்கிறது.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: கடவுளுக்குக்கூட அஞ்சுவதில்லையா?
  rationale: οὐδέ தரும் “கூட … இல்லை” என்ற வலியுறுத்தலையும், கடவுளுக்கு அஞ்சுதல் என்ற வேதாகமச் சொல்லாட்சியையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: ὅτι
  choice: அப்படியிருந்தும்
  rationale: அதே தீர்ப்புக்கு உட்பட்டிருப்பதே கண்டிப்புக்கான காரணம் என்பதை தமிழில் இயல்பான வினாவாக்கியத் தொடர்பால் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: நீ இதே தண்டனைத் தீர்ப்புக்கு உட்பட்டிருக்கிறாய்
  rationale: κρίμα என்பதன் நீதித்துறைச் சூழலை “தீர்ப்பு” காக்கிறது; சிலுவைத் தண்டனையின் சூழலை “தண்டனைத்” தெளிவுபடுத்துகிறது. ἐν என்பதைக் தமிழில் இயல்பாக “உட்பட்டு” என வழங்குகிறது.
theological_decisions:
- issue: கடவுளுக்கு அஞ்சுதல் என்பதன் பொருள்
  choice: “கடவுளுக்கு அஞ்சு” என்ற நேரடியான சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: “கடவுளை மதித்தல்” அல்லது “கடவுளுக்குப் பயபக்தி காட்டுதல்”
  rationale: இச்சொல்லாட்சி தெய்வீகப் பொறுப்புணர்வையும் பயபக்தியையும் உள்ளடக்கலாம்; அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து மூலத்தின் வலிமையைச் சுருக்காமல், அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: κρίμα என்பதன் சட்ட மற்றும் தண்டனை சார்ந்த பொருள்
  choice: “தண்டனைத் தீர்ப்பு”
  alternative: “கண்டனத் தீர்ப்பு” அல்லது “நியாயத்தீர்ப்பு”
  rationale: இங்கு இருவரும் பகிரும் உடனடி தண்டனை நிலையே முன்னிலையில் உள்ளது. இருந்தாலும் κρίμα என்பதிலுள்ள தீர்ப்பு, கண்டனம், தண்டனைத் தீர்ப்பு ஆகிய பொருள் பரப்பை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தின் பங்கேற்புவினைத் தொடர்கள் தமிழின் இயல்பான பேச்சு அறிமுகமாக மாற்றப்பட்டுள்ளன; சட்டச் சூழலும் வினாவின் கண்டிப்புத் தொனியும் காக்கப்பட்டுள்ளன.
