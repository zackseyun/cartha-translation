translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ஏரோதைக் குறிக்கும் மரியாதைப் பன்மையும் இயேசுவைக் குறிக்கும் மரியாதைப் பன்மையும் தமிழின் இயல்பான நடைக்கு ஏற்ப பயன்படுத்தப்பட்டுள்ளன.
