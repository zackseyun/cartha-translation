lexical_decisions:
- source_word: ἐπηρώτα
  choice: கேட்டுக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், ஏரோது தொடர்ந்து அல்லது திரும்பத் திரும்பக் கேட்டதை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: எனவே / ஆனால்
  rationale: முதல் δέ மென்மையான கதைத் தொடர்பாகவும், இரண்டாவது δέ ஏரோதின் கேள்விகளுக்கும் இயேசுவின் மௌனத்திற்கும் இடையிலான முரண்பாடாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: நீண்ட நேரம் பலவற்றைக் குறித்துக்
  rationale: சொல்லளவில் 'பல வார்த்தைகளால்' என்றாலும், சூழலில் நீடித்த விரிவான விசாரணையை இது குறிக்கிறது; λόγοις என்பதை 'கேள்விகள்' என்று மட்டும் குறுக்காமல் இந்த மொழியாக்கம் பொருளை இயல்பாகத் தருகிறது.
- source_word: αὐτὸς
  choice: அவரோ
  rationale: வலியுறுத்தப்பட்ட சுட்டுப்பெயரையும், ஏரோதின் செயலுக்கு எதிரான இயேசுவின் மௌனத்தையும் தமிழ் எதிர்மறைத் தொனியுடன் காட்டுகிறது.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: அவருக்கு எதுவும் பதிலளிக்கவில்லை
  rationale: கிரேக்கச் சொற்றொடரின் பொருளை நேரடியாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
