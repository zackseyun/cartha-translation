  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: ta
  text: அவர் அவரிடம் வெகுநேரம் கேள்விகள் கேட்டார்[a]. ஆனால் அவரோ அவருக்கு எதுவும் பதிலளிக்கவில்லை.
  philosophy: optimal-equivalence
