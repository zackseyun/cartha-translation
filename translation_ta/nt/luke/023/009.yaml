  - marker: a
    text: அல்லது, “பல வார்த்தைகளால் கேட்டார்”; அல்லது, “பல கேள்விகளைக் கேட்டார்.” கிரேக்கச் சொற்றொடர் நீடித்த வாய்மொழி கேள்வியிடலை வலியுறுத்துகிறது.
