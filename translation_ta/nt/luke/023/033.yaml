  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: ta
  text: அவர்கள் “மண்டையோடு” என்று அழைக்கப்பட்ட இடத்துக்கு வந்தபோது, அங்கே அவரையும் அந்தக் குற்றவாளிகளையும்—ஒருவனை வலப்பக்கத்திலும் மற்றவனை இடப்பக்கத்திலும்[a]—சிலுவையில் அறைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ச்சொல்லாக்கம்: “ஒருவன் வலப்புறத்திலும், ஒருவன் இடப்புறத்திலும்.” இது இரு குற்றவாளிகளின் நிலையைச் சுட்டும் கிரேக்க அமைப்பு.'
    reason: lexical_alternative
  - marker: b
    text: “மண்டையோடு” என்பது கிரேக்கச் சொல்லான Κρανίον என்பதன் நேர்ப்பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: இடத்துக்கு வந்தபோது
  rationale: இயக்கத்தைக் குறிக்கும் ἦλθον என்பதோடு ἐπί + வேற்றுமை உருபு இலக்கைச் சுட்டுகிறது; நவீன தமிழில் ‘இடத்துக்கு வந்தபோது’ என்பது இயல்பான கதைநடை.
- source_word: τὸν καλούμενον Κρανίον
  choice: “மண்டையோடு” என்று அழைக்கப்பட்ட
  rationale: Κρανίον என்பதன் நேர்ப்பொருள் ‘மண்டையோடு.’ ஒலிபெயர்ப்பை விட இடப்பெயரின் பொருளை மொழிபெயர்ப்பது மூலத்தின் அர்த்தத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἐσταύρωσαν
  choice: சிலுவையில் அறைந்தார்கள்
  rationale: σταυρόω என்பதற்கான தெளிவான, வழக்கிலுள்ள தமிழ் மொழிபெயர்ப்பு இது; சிலுவை மரணத்தைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: κακούργους
  choice: குற்றவாளிகள்
  rationale: κακοῦργος என்பது குற்றம் செய்தவர்களையோ தீச்செயல் புரிந்தவர்களையோ பொதுவாகக் குறிக்கிறது. ‘குற்றவாளிகள்’ என்பது தெளிவான நவீனச் சொல்; ‘கொள்ளையர்கள்’ அல்லது ‘கலகக்காரர்கள்’ என்று குறிப்பாக்கி மற்ற நற்செய்தி சொற்பயன்பாட்டுடன் ஒத்திசைக்கவில்லை.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: அவர்களில் ஒருவனை வலப்பக்கத்திலும் மற்றவனை இடப்பக்கத்திலும்
  rationale: இணைநிலைக் கிரேக்க அமைப்பு இரு குற்றவாளிகளின் இடங்களைப் பகிர்ந்து கூறுகிறது. தமிழ் இயல்புக்காக ‘ஒருவனை… மற்றவனை…’ என்று தரப்பட்டுள்ளது; ‘அவருடைய’ என்பது மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: Κρανίον என்ற இடப்பெயரின் மொழிபெயர்ப்பு
  choice: மண்டையோடு
  alternative: கிரானியோன்; மண்டையோடு எனப்படும் இடம்
  rationale: இது பொதுப்பெயரிலிருந்து உருவான இடப்பெயர். அதன் பொருளை மொழிபெயர்ப்பது லூக்காவின் சொற்பயன்பாட்டைக் காக்கிறது; இணை நற்செய்திகளில் காணப்படும் பிற பாரம்பரிய வடிவங்களை இங்கு இறக்குமதி செய்யவில்லை.
- issue: இயேசுவுடன் சிலுவையில் அறையப்பட்ட இருவரின் வருணனை
  choice: குற்றவாளிகள்
  alternative: தீச்செயல் புரிந்தவர்கள்; கொள்ளையர்கள்
  rationale: லூக்கா பயன்படுத்தும் κακοῦργοι என்பது ‘கொள்ளையர்கள்’ என்பதைவிடப் பொதுவானது. ‘குற்றவாளிகள்’ என்பது பொருளைச் சரியாகக் காத்து, பிற நற்செய்தி வருணனைகளுடன் செயற்கையாக ஒத்திசைப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களில்’ என்பது அருகிலுள்ள ‘குற்றவாளிகள்’ என்பதைக் குறிக்கிறது. இரு அடிக்குறிப்பு குறிகளும் அவை சார்ந்த கூறுகளுக்கு அருகில் அமைவது தெளிவாக இருக்கும் வகையில் இறுதியில் தொடர்ச்சியாக இடப்பட்டுள்ளன.
