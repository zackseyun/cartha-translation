reference: Luke 23:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: ta
  text: தொங்கவிடப்பட்டிருந்த குற்றவாளிகளில் ஒருவன், “நீதான் மேசியா[a] அல்லவா? உன்னையும் எங்களையும் காப்பாற்று!” என்று அவரை இகழ்ந்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “கிறிஸ்து.” கிரேக்கம்: ὁ χριστός (ஹோ கிறிஸ்டோஸ்).'
    reason: மூலச் சொல்லுக்கான மரபுவழி மாற்று மொழிபெயர்ப்பைத் தருகிறது.
lexical_decisions:
- source_word: Εἷς δὲ
  choice: ஒருவன்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சி அல்லது வேறுபாட்டைக் குறிக்கிறது; தமிழில் தனி இணைப்புச்சொல் சேர்க்காமல் இயல்பாக வெளிப்படுகிறது.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: தொங்கவிடப்பட்டிருந்த குற்றவாளிகளில்
  rationale: κρεμασθέντων என்பதன் செயப்பாட்டு நிலையையும் சிலுவைச் சூழலையும் காக்கிறது; κακούργων என்பதற்கு நவீனத் தமிழில் இயல்பான ‘குற்றவாளிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐβλασφήμει
  choice: பழித்துக்கொண்டிருந்தான்
  rationale: இங்கு இயேசுவை நோக்கிய இகழ்ச்சிப் பேச்சே முன்னிலையாக உள்ளது. இறந்தகால நிறைவுறா வினையின் தொடர்ச்சியான செயலை ‘கொண்டிருந்தான்’ வெளிப்படுத்துகிறது.
- source_word: λέγων
  choice: என்று
  rationale: மேற்கோள் பேச்சைத் தமிழில் இயல்பாக முதன்மை வினையுடன் இணைக்கிறது.
- source_word: Οὐχὶ σὺ εἶ
  choice: நீதான் ... அல்லவா?
  rationale: σὺ என்பதன் வலியுறுத்தலையும், உறுதிப்பதில் எதிர்பார்ப்பதுபோல் அமைந்த ஏளனக் கேள்வியையும் காக்கிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இங்கு இது பெயர்போன்ற பயன்பாடு அல்ல, அபிஷேகம் பெற்றவர் என்ற யூத எதிர்பார்ப்புடன் தொடர்புடைய பட்டம்.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: உன்னையும் எங்களையும் காப்பாற்று
  rationale: உடனடியான மரணத்திலிருந்து விடுவிக்கும்படி கூறும் கட்டளையையும், ‘காப்பாற்றுதல்’ என்ற விரிவான கருத்துத் தொடர்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தை மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இகழ்ச்சியான இக்கேள்வியில் Χριστός ஒரு பட்டமாகச் செயல்படுகிறது. ‘மேசியா’ என்பது அதன் யூதப் பின்னணியையும் பட்டத்தின் பொருளையும் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கதைசொல்லி இயேசுவை ‘அவர்’ என்று குறிப்பிடுகிறார்; குற்றவாளியின் ஏளனத்தையும் மரியாதையற்ற நேரடிப் பேச்சையும் காட்ட மேற்கோளில் ‘நீ/உன்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
