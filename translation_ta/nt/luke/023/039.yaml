  source_fidelity: The draft accurately represents the hanging criminal, the ongoing abusive speech, the taunting question, the title “Messiah,” and the command to save himself and them. The passive sense of κρεμασθέντων is suitably retained by “தொங்கவிடப்பட்டிருந்த.”
