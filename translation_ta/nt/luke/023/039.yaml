  terminology: “மேசியா” appropriately renders ὁ χριστός as a title, and the footnote provides the established alternative “கிறிஸ்து.” “காப்பாற்று” accurately retains the immediate-deliverance sense of σῶσον without excluding its broader verbal resonance.
