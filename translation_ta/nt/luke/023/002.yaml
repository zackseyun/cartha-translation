language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: ta
  text: அவர்கள் அவர்மேல் குற்றஞ்சாட்டத் தொடங்கி, “இந்த மனிதன் நம் தேசத்தைத் தவறான வழியில் நடத்துவதையும்[a], சீசருக்கு வரி செலுத்துவதைத் தடுப்பதையும், தானே மேசியா, ஒரு ராஜா என்று சொல்வதையும் கண்டோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நம் தேசத்தைச் சீர்குலைப்பதையும்” அல்லது “நம் தேசத்தை வழிதவறச் செய்வதையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: அவர்கள் அவர்மேல் குற்றஞ்சாட்டத் தொடங்கி
  rationale: நீதிவிசாரணைச் சூழலில் κατηγορεῖν என்பதன் குற்றச்சாட்டு சார்ந்த பொருளையும், ἤρξαντο என்பதன் தொடக்கநிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Τοῦτον
  choice: இந்த மனிதன்
  rationale: சுட்டிக்காட்டும், ஓரளவு இகழ்வான குற்றச்சாட்டு மொழிநடையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: நம் தேசத்தைத் தவறான வழியில் நடத்துவதையும்
  rationale: διαστρέφω என்பதில் உள்ள வழிதவறச் செய்தல் அல்லது சீர்குலைத்தல் என்ற பரப்பை அரசியல் கலகம் என்று மிகையாகக் குறுக்காமல் தருகிறது.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: சீசருக்கு வரி செலுத்தக்கூடாது என்று தடுப்பதையும்
  rationale: κωλύω என்பதன் தடுத்தல் சார்ந்த வலிமையையும், φόρους என்பதன் ரோம ஆட்சியாளருக்குச் செலுத்தப்பட்ட வரி அல்லது கப்பப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: αὑτὸν χριστὸν βασιλέα εἶναι
  choice: தானே மேசியா, ஒரு ராஜா என்று
  rationale: αὑτόν என்பதன் அழுத்தத்தை ‘தானே’ காக்கிறது; χριστός என்பதை பட்டமாக ‘மேசியா’ என்றும், βασιλεύς என்பதை தனித்த அரச அடையாளமாக ‘ஒரு ராஜா’ என்றும் வைத்துள்ளது.
theological_decisions:
- issue: அரசியல் குற்றச்சாட்டில் χριστόν என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு χριστός பெயரைப்போல் அல்லாமல் அபிஷேகம் பெற்ற அரசரைச் சுட்டும் பட்டமாகச் செயல்படுகிறது; ‘மேசியா’ யூத அரச எதிர்பார்ப்பையும் குற்றச்சாட்டின் அரசியல் பரிமாணத்தையும் காக்கிறது.
- issue: χριστόν மற்றும் βασιλέα ஆகியவற்றின் உறவு
  choice: மேசியா, ஒரு ராஜா
  alternative: ராஜாவாகிய மேசியா
  rationale: இரண்டு குற்றச்சாட்டு அடையாளங்களையும் ஒன்றாக முற்றிலும் இணைத்து விளக்காமல், கிரேக்கத்தின் இரட்டை நிரப்புப்பெயர் அமைப்பையும் அதன் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் நீதிமன்றக் குற்றச்சாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘சீசர்’, ‘மேசியா’ ஆகிய வரலாற்று மற்றும் பட்டச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வசனத்தின் அரசியல்-இறையியல் பதற்றம் விளக்கி நீக்கப்படவில்லை.
