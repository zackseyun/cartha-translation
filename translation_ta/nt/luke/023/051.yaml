id: LUK.23.51
reference: Luke 23:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: ta
  text: இவர் அவர்களுடைய தீர்மானத்திற்கும் செயலுக்கும் உடன்பட்டிருக்கவில்லை. இவர் யூதர்களின் ஒரு நகரமான அரிமத்தியாவைச் சேர்ந்தவர்; இறைவனுடைய அரசாட்சியை எதிர்பார்த்துக் காத்திருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: உடன்படவில்லை
  rationale: ἦν என்பதுடன் வரும் நிறைவேற்றப் பெயரெச்சம், முன்பே நிலைபெற்றிருந்த உடன்பாடின்மையைக் குறிக்கிறது. ‘உடன்படவில்லை’ என்பது இயல்பான நவீனத் தமிழில் சம்மதிக்காத நிலையைத் தெளிவாகச் சொல்கிறது.
- source_word: βουλῇ
  choice: தீர்மானம்
  rationale: இங்கு இது ஆளும் மன்றத்தைக் குறிக்காமல், அவர்கள் ஆலோசித்து எடுத்த முடிவைக் குறிக்கிறது. ‘தீர்மானம்’ அந்தப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: πράξει
  choice: செயல்
  rationale: βουλή என்பதுடன் இணைந்து, அவர்கள் எடுத்த முடிவை நடைமுறைப்படுத்தியதைக் குறிக்கிறது. ‘செயல்’ தீர்மானத்திற்கும் அதன் நிறைவேற்றத்திற்கும் இடையிலான வேறுபாட்டைப் பேணுகிறது.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: யூதர்களின் நகரமான அரிமத்தியாவைச் சேர்ந்தவர்
  rationale: கிரேக்கத்தின் விளக்க இணைப்பை இயல்பான தமிழில் பேணி, ‘யூதர்களின் நகரம்’ என்ற உண்மையான தெளிவின்மையையும் மிகுதியாக விளக்காமல் விடுகிறது.
- source_word: προσεδέχετο
  choice: எதிர்பார்த்துக் காத்திருந்தவர்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ந்து நிலைத்திருந்த நம்பிக்கையுள்ள காத்திருப்பைக் குறிக்கிறது. ‘எதிர்பார்த்துக் காத்திருந்தார்’ என்பது வெறும் காத்திருப்பையும் செயலில் தேடுவதையும் விட அந்த நுணுக்கத்தைச் சிறப்பாகத் தருகிறது.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: இறைவனுடைய அரசு
  rationale: βασιλεία என்பது அரசாட்சி அல்லது அரசு என்ற இரு தொடர்புடைய நுணுக்கங்களையும் தாங்கக்கூடும். லூக்காவின் முக்கிய இறையியல் சொல்லாக்கத்தை இயல்பான, மரியாதையான தமிழில் ‘இறைவனுடைய அரசு’ என வழங்குகிறது.
- source_word: οὗτος
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட யோசேப்பை இது மீண்டும் சுட்டுகிறது. தனி வசனமாகவும் தொடர்ச்சியிலும் இயல்பாக வாசிக்க ‘அவர்’ பொருத்தமானது; ‘இந்த மனிதர்’ தமிழில் தேவையற்ற வலியுறுத்தலாக ஒலிக்கலாம்.
theological_decisions:
- issue: இயேசுவின் மரணத்தில் தலைவர்களின் பங்கில் இருந்து யோசேப்பு விலகியிருந்ததன் தன்மை
  choice: அவர்களுடைய தீர்மானத்திற்கும் செயலுக்கும் அவர் உடன்படவில்லை என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்களுடைய வாக்கெடுப்பில் அவர் ஆதரவாக வாக்களிக்கவில்லை; அவர்களுடைய ஆலோசனையையும் செயலையும் அவர் அங்கீகரிக்கவில்லை.
  rationale: கிரேக்கம் அவர்களுடைய βουλή மற்றும் πρᾶξις தொடர்பாக யோசேப்பு சம்மதிக்கவில்லை என்று கூறுகிறது; குறிப்பிட்ட வாக்கெடுப்பு நடைமுறையை வெளிப்படையாகக் கூறவில்லை. ஆகவே வரலாற்று நடைமுறையை ஊகித்துச் சேர்க்காமல் அவரது விலகலைத் தெளிவாகப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் தீர்மானம்/செயல் இணை வேறுபாடு பேணப்பட்டுள்ளது. இவ்வசனத்திற்கு அடிக்குறிப்பு தேவையில்லை; ஆங்கிலத் தரவில் [a] குறியீட்டுக்கும் அதன் அடிக்குறிப்புக்கும் இடையே பொருத்தமின்மை இருப்பதால் அது இறக்குமதி செய்யப்படவில்லை.
