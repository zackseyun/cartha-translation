review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the vocative address, the request to be remembered, the future contingency introduced by ὅταν with the subjunctive, and SBLGNT’s ἐν τῇ βασιλείᾳ σου as ‘உமது அரசாட்சியில்.’ It appropriately avoids importing a fuller eschatological interpretation.
  naturalness: The honorific imperative ‘நினைவுகூரும்’ is not natural modern standard Tamil in this context and can be read as a non-imperative form. ‘நினைவுகூருங்கள்’ is the clear modern honorific imperative and agrees with ‘நீர்/உமது.’
  terminology: ‘இயேசுவே’ is a natural vocative, and ‘அரசாட்சி’ is a suitable modern rendering of βασιλεία that can retain both reign and kingdom nuance. The footnote should state the manuscript variant directly and naturally.
  issues:
  - severity: medium
    issue: The direct request uses ‘நினைவுகூரும்.’
    rationale: For modern standard Tamil, an honorific request addressed with ‘நீர்’ should use ‘நினைவுகூருங்கள்.’ The current form is archaic/ambiguous and weakens the imperative force of μνήσθητί.
  - severity: low
    issue: The footnote’s wording about the alternative reading is unnecessarily indirect.
    rationale: The variant can be stated plainly as a reading with ‘அரசாட்சிக்குள்’; this more accurately communicates the textual alternative without explanatory awkwardness.
  revised_text: அவன், “இயேசுவே, நீர் உமது அரசாட்சியில் வரும்போது[a] என்னை நினைவுகூருங்கள்” என்றான்.
  revised_footnotes:
  - marker: a
    text: அல்லது, “நீர் உமது அரசாட்சிக்குள் வரும்போது.” சில கையெழுத்துப் பிரதிகள் ‘உமது அரசாட்சிக்குள்’ என்று வாசிக்கின்றன; SBLGNT உரை ‘உமது அரசாட்சியில்’ என்று வாசிக்கிறது.
    reason: alternative_reading
