source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: ta
  text: அவன், “இயேசுவே, நீர் உமது அரசாட்சியில் வரும்போது[a] என்னை நினைவுகூருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் உமது அரசாட்சிக்குள் வரும்போது.” சில கையெழுத்துப் பிரதிகள் ‘உமது அரசாட்சிக்குள்’ என்று வாசிக்கின்றன; SBLGNT உரை ‘உமது அரசாட்சியில்’ என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: அவன்… என்றான் என்ற இயல்பான வாக்கிய அமைப்பில் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: καὶ இங்கு எளிய கதைத் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் ‘மேலும்’ அல்லது ‘பின்பு’ என்று வெளிப்படையாகச் சேர்ப்பது தேவையற்ற வலியுறுத்தலையோ காலத் தொடர்பையோ உருவாக்கலாம்.
- source_word: ἔλεγεν
  choice: என்றான்
  rationale: λέγω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவமாக இருந்தாலும், இங்கு நேரடி உரையை அறிமுகப்படுத்தும் இயல்பான தமிழ் கதைநடையில் ‘என்றான்’ பொருத்தமானது.
- source_word: Ἰησοῦ
  choice: இயேசுவே
  rationale: இது இயேசுவின் பெயருடைய அழைப்புவேற்றுமை; தமிழில் அழைப்பை இயல்பாகக் காட்ட ‘-வே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μνήσθητί
  choice: நினைவுகூரும்
  rationale: வேண்டுகோள் சூழலில் உள்ள கட்டளை வடிவத்தை மரியாதையும் கண்ணியமும் கொண்ட ஒருமை வேண்டுகோளாகத் தருகிறது; நினைவுகூருதல் செயல்பூர்வமான அருளைக் குறிக்கக்கூடும் என்றாலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: μου
  choice: என்னை
  rationale: μνήσθητί உடன் வரும் இயல்பான தமிழ் செயப்படுபொருள் வடிவம்.
- source_word: ὅταν ἔλθῃς
  choice: நீர் … வரும்போது
  rationale: எதிர்கால நிகழ்வை எதிர்பார்க்கும் பொருளை இயல்பான தமிழில் தருகிறது; ‘எப்போது வந்தாலும்’ என்ற மீள்நிகழ்வு உணர்வைத் தவிர்க்கிறது.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: உமது அரசாட்சியில்
  rationale: ἐν என்பதன் அடிப்படை ‘இல்’ பொருளைப் பாதுகாக்கிறது. βασιλεία குறிக்கும் ஆட்சி, அரசுரிமை, ஆட்சிக்குட்பட்ட நிலை ஆகிய நுணுக்கங்களை நவீன தமிழின் ‘அரசாட்சி’ தாங்குகிறது.
theological_decisions:
- issue: இயேசுவின் வருகையும் அரசாட்சியும் குறித்த இறுதிக்கால நுணுக்கம்
  choice: ‘நீர் உமது அரசாட்சியில் வரும்போது’ என்று காலவரிசையை விரிவுபடுத்தாமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீர் அரசராக வரும்போது’ அல்லது ‘நீர் உமது அரசாட்சிக்குள் வரும்போது’
  rationale: வசனம் இயேசுவின் வருங்கால அரசாட்சியை எதிர்பார்க்கிறது; ஆனால் அதன் நேரம், முறை, அல்லது முழுமையான இறுதிக்கால அமைப்பை விளக்கவில்லை. ஆகவே அந்தத் திறந்த தன்மை பாதுகாக்கப்பட்டுள்ளது.
- issue: βασιλεία என்பதன் ஆட்சி அல்லது ஆட்சிப்பரப்பு நுணுக்கம்
  choice: அரசாட்சி
  alternative: ராஜ்யம் / அரசு / அரச அதிகாரம்
  rationale: ‘அரசாட்சி’ அரசரின் ஆட்சியையும் அதனுடன் தொடர்புடைய ஆட்சிநிலையையும் கேட்க அனுமதிக்கிறது; ஓர் குறிப்பிட்ட சமய மரபின் விளக்கத்தைத் திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை. இயேசுவை நோக்கிய மரியாதையை ‘நீர்/உமது’ மற்றும் ‘நினைவுகூரும்’ காட்டுகின்றன. பாரம்பரியமான ‘ராஜ்யம்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியக்கூடிய ‘அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
