revisions:
- from: அவன், “இயேசுவே, நீர் உமது அரசாட்சியில் வரும்போது[a] என்னை நினைவுகூரும்” என்றான்.
  to: அவன், “இயேசுவே, நீர் உமது அரசாட்சியில் வரும்போது[a] என்னை நினைவுகூருங்கள்” என்றான்.
  rationale: The revision changes only the Tamil imperative to an unambiguous, natural modern honorific form and smooths the footnote’s presentation of the εἰς-type variant. The main text continues to reflect the SBLGNT reading ἐν (‘அரசாட்சியில்’) rather than adopting the directional variant.
