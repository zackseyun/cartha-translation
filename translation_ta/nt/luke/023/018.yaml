revisions:
- from: ஆனால் அவர்கள் அனைவரும் ஒருசேரக் கூக்குரலிட்டு, “இவனை அகற்றிவிடுங்கள்[a]; பரபாஸை எங்களுக்காக விடுதலை செய்யுங்கள்!” என்றார்கள்.
  to: ஆனால் அவர்கள் அனைவரும் ஒருசேரக் கூக்குரலிட்டு, “இவனை அகற்றிவிடுங்கள்[a]; பரபாஸை எங்களுக்கு விடுதலை செய்யுங்கள்!” என்றார்கள்.
