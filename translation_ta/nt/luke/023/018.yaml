  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: ta
  text: ஆனால் அவர்கள் அனைவரும் ஒருசேரக் கூக்குரலிட்டு, “இவனை அகற்றிவிடுங்கள்[a]; பரபாஸை எங்களுக்கு விடுதலை செய்யுங்கள்!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவன் ஒழியட்டும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கட்டளை சுருக்கமாகக் கூறப்படலாம்; இவனை அப்புறப்படுத்த வேண்டும் என்பதே கோரிக்கை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: கூக்குரலிட்டு
  rationale: இந்த வினைச்சொல் உரத்த குரலில் எழுப்பப்படும் கூச்சலைக் குறிக்கிறது; ‘கூக்குரலிட்டு’ என்பது அதன் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உரையாடலுக்கு மாறான திருப்பத்தை δέ இங்கு குறிக்கிறது; அதனை ‘ஆனால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παμπληθεὶ
  choice: அனைவரும் ஒருசேர
  rationale: முழுக் கூட்டமும் கூட்டாகச் செயல்பட்டதை இந்தச் சொல் குறிக்கிறது; ‘அனைவரும் ஒருசேர’ என்பது தனித்தனியான குரல்களா ஒரே குரலா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் கூட்டுச் செயலைத் தெரிவிக்கிறது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: கூக்குரலின் உள்ளடக்கத்தை நேரடிக் கூற்றாக இயல்பான தமிழ் வாக்கிய அமைப்பில் அறிமுகப்படுத்துகிறது.
- source_word: Αἶρε
  choice: அகற்றிவிடுங்கள்
  rationale: இங்குள்ள கட்டளை இயேசுவை அவர்களிடமிருந்து அப்புறப்படுத்தக் கோருகிறது. ‘அகற்றிவிடுங்கள்’ அந்த வலிமையைத் தருகிறது; ஆனால் மரணதண்டனையைச் சொல் மட்டத்திலேயே வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: τοῦτον
  choice: இவனை
  rationale: சுட்டுப்பெயரின் நேரடியான, சூழலில் இகழ்ச்சித் தொனி கொள்ளக்கூடிய சுட்டுதலை ‘இவனை’ பாதுகாக்கிறது.
- source_word: ἀπόλυσον
  choice: விடுதலை செய்யுங்கள்
  rationale: காவல் அல்லது நீதித்துறைப் பிடியிலிருந்து ஒருவரை விடுவிப்பதைக் குறிக்கும் வினைச்சொல்லுக்கு இது தெளிவான நவீனத் தமிழ் இணை.
- source_word: ἡμῖν
  choice: எங்களுக்காக
  rationale: கோரப்பட்ட விடுதலையின் பயனாளிகள் பேசுகிறவர்களே என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τὸν Βαραββᾶν
  choice: பரபாஸை
  rationale: கிரேக்கப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பை வேற்றுமை உருபுடன் வழங்குகிறது.
theological_decisions:
- issue: Αἶρε என்பது அகற்றுவதையா கொல்வதையா நேரடியாகக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘அகற்றிவிடுங்கள்’ என்று மொழிபெயர்த்து இரண்டாம் பொருளை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘இவனை ஒழித்துவிடுங்கள்’ அல்லது ‘இவன் ஒழியட்டும்.’
  rationale: சூழல் மரணதண்டனையை நோக்கிய கோரிக்கையாக இருந்தாலும், αἴρω என்ற கட்டளை தன்னிச்சையாக ‘கொல்லுங்கள்’ என்று மட்டும் பொருள்படாது. ஆகவே மூலத்தின் பொருள் அகலத்தைப் பாதுகாத்து, வலிமையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நீதிமன்றச் சூழலின் தீவிரத்தைக் காக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. பிலாத்துவை நோக்கிய ஒருமை கட்டளை தமிழில் இயல்பான மரியாதைப் பன்மை வினைமுற்றுகளால் வழங்கப்பட்டுள்ளது.
