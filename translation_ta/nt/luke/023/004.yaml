  terminology: ‘தலைமை ஆசாரியர்கள்’ ἀρχιερεῖς என்பதற்கு நிலையானதும் துல்லியமானதும். ‘குற்றம் சுமத்துவதற்கான ... ஆதாரம்’ αἴτιον என்பதன் சட்டப்பூர்வக் கருத்தை நன்றாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு ‘குற்றம்’ என்ற மாற்றுவழியையும் நீதித்துறை நுணுக்கத்தையும் சரியாகக் காக்கிறது.
