  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நீதித்துறைச் சொல்லாட்சியுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ὄχλους என்ற பன்மை ‘மக்கள் கூட்டங்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது; αἴτιον என்பதிலுள்ள ‘குற்றம்/குற்றச்சாட்டுக்கான ஆதாரம்’ என்ற பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
