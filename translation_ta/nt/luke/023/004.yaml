language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: ta
  text: அப்போது பிலாத்து தலைமை ஆசாரியர்களிடமும் மக்கள் கூட்டங்களிடமும், “இந்த மனிதர்மீது குற்றம் சுமத்துவதற்கான எந்த ஆதாரத்தையும் நான் காணவில்லை[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மனிதரிடம் எந்தக் குற்றத்தையும் நான் காணவில்லை.” αἴτιον என்ற கிரேக்கச் சொல் “குற்றம்” அல்லது “குறை” என்று பொருள்படலாம்; இங்கு குற்றம் சுமத்துவதற்கான செல்லத்தக்க ஆதாரம் என்ற நீதித்துறைப் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அப்போது
  rationale: இது மென்மையான கதைத் தொடர்புச்சொல்; இவ்விடத்தில் நிகழ்வின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: εἶπεν πρὸς
  choice: …இடமும் … என்றான்
  rationale: யாரை நோக்கிப் பேசினார் என்பதையும் சொன்ன செயற்பாட்டையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: இப்பன்மைச் சொல் ஒரே தலைமை ஆசாரியப் பதவியை அல்ல, மூத்த ஆசாரியத் தலைமைக் குழுவினரைக் குறிக்கிறது.
- source_word: ὄχλους
  choice: மக்கள் கூட்டங்கள்
  rationale: மூலத்தின் பன்மை வடிவத்தைத் தக்கவைத்தபடி, ὄχλος குறிக்கும் திரண்ட மக்களைத் தெளிவாகச் சொல்கிறது.
- source_word: Οὐδὲν εὑρίσκω
  choice: எந்த … ஆதாரத்தையும் நான் காணவில்லை
  rationale: நீதித்துறை சார்ந்த தற்போதைய மதிப்பீட்டின் முழுமையான மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: αἴτιον
  choice: குற்றம் சுமத்துவதற்கான … ஆதாரம்
  rationale: சட்டச் சூழலில் குற்றச்சாட்டை நிலைநிறுத்தும் காரணம் அல்லது அடிப்படையை இச்சொல் குறிக்கிறது; வெறும் ஒழுக்கக் ‘குறை’ என்ற பொருளுக்குள் அதைச் சுருக்கவில்லை.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: இந்த மனிதர்மீது
  rationale: சொல்லுக்கு சொல் ‘இந்த மனிதரில்’ என்பதற்குப் பதிலாக, குற்றச்சாட்டு சார்ந்த நீதித்துறைச் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
