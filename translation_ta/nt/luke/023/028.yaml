source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களை நோக்கித் திரும்பி, “எருசலேமின் மகள்களே,[a] எனக்காக அழாதீர்கள்; மாறாக, உங்களுக்காகவும் உங்கள் பிள்ளைகளுக்காகவும் அழுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமின் பெண்களே.” கிரேக்க மொழியில் சொல்லுக்கு சொல் “எருசலேமின் மகள்களே” என்று உள்ளது; தீர்க்கதரிசனப் பாணியிலான அந்த அழைப்பு முதன்மை உரையில் காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: ஆனால் இயேசு அவர்களை நோக்கித் திரும்பி
  rationale: இயேசு அந்தப் பெண்களின் பக்கம் உடலளவில் திரும்பியதை வினையெச்சத் தொடராக இயல்பான தமிழில் காட்டுகிறது; δέ குறிக்கும் மென்மையான மாறுதலை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: எருசலேமின் மகள்களே
  rationale: சொல்லாட்சியின் நேரடியான குடும்ப உருவகத்தையும் தீர்க்கதரிசனப் பாணியிலான அழைப்பின் வேதாகம ஒலிப்பையும் காக்கிறது.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: எனக்காக அழாதீர்கள்
  rationale: தற்போதைய கட்டளையின் தடைப் பொருளைத் தெளிவாகக் காட்டுகிறது; அழுகை ஏற்கெனவே தொடங்கிவிட்டது என்று ‘அழுவதை நிறுத்துங்கள்’ என மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: மாறாக, உங்களுக்காகவும் ... அழுங்கள்
  rationale: πλήν அறிமுகப்படுத்தும் திருத்தும் எதிர்மறை மாற்றத்தை ‘மாறாக’ இயல்பாக வெளிப்படுத்துகிறது; ἐπί சொற்றொடர்களின் இணை அமைப்பையும் காக்கிறது.
- source_word: τὰ τέκνα ὑμῶν
  choice: உங்கள் பிள்ளைகள்
  rationale: τέκνα என்பதன் குடும்ப உறவுப் பொருளை சாதாரண நவீனத் தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: Θυγατέρες Ἰερουσαλήμ என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: எருசலேமின் மகள்களே
  alternative: எருசலேமின் பெண்களே
  rationale: இது பெண்களைக் குறிக்கும் தகவல் மட்டுமல்ல; இஸ்ரவேலின் வேதமொழியில் காணப்படும் தீர்க்கதரிசன மற்றும் கூட்டு அடையாள ஒலிப்பையும் கொண்டுள்ளது. கூடுதல் கோட்பாட்டைச் சேர்க்காமல் அந்த ஒலிப்பை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும், உரையாடலுக்கேற்ற இயல்புடனும், அதேவேளை வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘மகள்களே’ என்ற இலக்கிய-தீர்க்கதரிசன அழைப்பு திட்டமிட்டு காக்கப்பட்டுள்ளது.
