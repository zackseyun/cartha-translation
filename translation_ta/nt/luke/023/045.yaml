  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: ta
  text: சூரியன் ஒளி தராமல் போனபோது[a], ஆலயத்தின் திரையும்[b] நடுவில் கிழிந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியன் இருண்டபோது.” “சூரிய கிரகணம் ஏற்பட்டபோது” என்று சிலர் மொழிபெயர்க்கிறார்கள்; ஆனால் கிரேக்கச் சொல் அத்தகைய குறிப்பிட்ட வானியல் விளக்கத்தைக் கட்டாயப்படுத்தவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஆலயத்தின் மறைப்புத் திரையும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நடுவே இரண்டாகக் கிழிந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: சூரியன் ஒளி தராமல் போனபோது
  rationale: ἐκλείπω என்பதன் ‘குன்றுதல், செயலற்றுப் போதல், நின்றுபோதல்’ என்ற விரிவான பொருளையும், இங்கு சூரியனைப் பற்றிய சூழலில் ஏற்பட்ட இருளையும் இயல்பான தமிழில் தெரிவிக்கிறது. வானியல் நிகழ்வான சூரிய கிரகணத்தைத் திட்டவட்டமாகக் குறிப்பிடாமல், கிரேக்கத்தின் காரண/சூழ்நிலை சார்ந்த மரபுத்தொடரையும் ‘போது’ என்ற அமைப்பால் காக்கிறது.
- source_word: ἐσχίσθη
  choice: கிழிந்தது
  rationale: துணியால் ஆன திரை பிளக்கப்பட்டதைத் தமிழில் இயல்பாகக் குறிக்கும் செயப்பாட்டு விளைவுச் சொல். கிரேக்கச் செயப்பாட்டு வடிவம் செய்பவரை வெளிப்படையாகக் கூறாததால், தமிழிலும் செய்பவர் சேர்க்கப்படவில்லை.
- source_word: δὲ
  choice: -உம்
  rationale: இங்குள்ள δέ மென்மையான இணைப்புச் சொல். ‘திரையும்’ என்பதிலுள்ள ‘-உம்’ முன்னைய நிகழ்வுடன் இயல்பாக இணைக்கிறது; தேவையற்ற முரண்பாட்டை உருவாக்கவில்லை.
- source_word: τὸ καταπέτασμα
  choice: திரை
  rationale: ஆலயத்துக்குள் பிரிப்பாகத் தொங்கிய துணியைக் குறிக்க, பொதுவான நவீன தமிழில் தெளிவாகப் புரியும் சொல். அதன் குறிப்பான மறைப்புத் தன்மை அடிக்குறிப்பில் மாற்றுச் சொல்லாக வழங்கப்படுகிறது.
- source_word: τοῦ ναοῦ
  choice: ஆலயத்தின்
  rationale: ναός இங்கு ஆலயத்தின் பரிசுத்தக் கட்டிடப்பகுதியைக் குறிக்கிறது. ‘ஆலயம்’ வாசகர்களுக்குப் பரிச்சயமானதும் இச்சூழலில் இயல்பானதும் ஆகும்; பரந்த ஆலய வளாகம் என்று தேவையின்றி விளக்கப்படவில்லை.
- source_word: μέσον
  choice: நடுவில்
  rationale: கிழிவு ஏற்பட்ட இடம் அல்லது விதத்தை நேரடியாகக் காட்டுகிறது. ‘இரண்டாக’ என்பது சாத்தியமான விளைவு என்றாலும், கிரேக்கத்தில் வெளிப்படையாக இல்லாத முடிவை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: சூரியனைப் பற்றிய ἐκλιπόντος என்பதன் பொருள்
  choice: வானியல் காரணத்தை நிர்ணயிக்காமல் ‘சூரியன் ஒளி தராமல் போனபோது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘சூரியன் இருண்டபோது’ அல்லது ‘சூரிய கிரகணம் ஏற்பட்டபோது’
  rationale: இயேசுவின் மரணத்தைச் சூழ்ந்த இருளை வசனம் விவரிக்கிறது; ஆனால் கிரேக்க வினைச்சொல் தொழில்நுட்பமான வானியல் விளக்கத்தை கட்டாயப்படுத்தவில்லை. ஆகவே நிகழ்வைத் தெளிவாகச் சொல்லியும், கிரகணம் என்ற குறிப்பிட்ட விளக்கத்தைத் திணிக்காமலும் உள்ளது.
- issue: καταπέτασμα என்பதற்கான சொல் தேர்வு
  choice: முதன்மை உரையில் ‘திரை’ பயன்படுத்தப்பட்டது.
  alternative: ‘மறைப்புத் திரை’ அல்லது ‘திரைச்சீலை’
  rationale: ஆலயத் திரை கிழிந்த நிகழ்வின் இறையியல் முக்கியத்துவத்தை விளக்கமாக உரைக்காமல், மூல உரை கூறும் பொருளை எளிய நவீன தமிழில் வழங்குகிறது. குறிப்பான மாற்றுச் சொல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘சூரிய கிரகணம்’ போன்ற மிகக் குறிப்பான விளக்கமும், திரை கிழிந்ததன் இறையியல் பொருளை உரைக்குள் சேர்ப்பதும் தவிர்க்கப்பட்டுள்ளன. ‘போது’ அமைப்பு கிரேக்க மரபுத்தொடரின் சூழ்நிலைத் தொடர்பை இயல்பான தமிழில் தக்கவைக்கிறது.
