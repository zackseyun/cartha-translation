source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: ta
  text: அவர் ஏரோதுவின் ஆளுகைக்கு உட்பட்டவர் என்று பிலாத்து அறிந்ததும்[a], அவரை ஏரோதுவிடம் அனுப்பினான். ஏரோதுவும் அந்த நாட்களில் எருசலேமில் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஏரோதுவின் அதிகாரத்துக்கு உட்பட்டவர் என்று.” கிரேக்கச் சொற்றொடர் ஏரோதுவின் நிர்வாகப் பரப்பையோ சட்ட அதிகாரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: அறிந்ததும்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முந்திய செயலைக் காட்டுகிறது; தமிழில் ‘அறிந்ததும்’ இயல்பான காலத் தொடர்பைத் தருகிறது.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: ஏரோதுவின் ஆளுகைக்கு உட்பட்ட பகுதியைச் சேர்ந்தவர்
  rationale: இங்கு ἐξουσία என்பது வெறும் வல்லமையையல்ல, ஏரோதுவின் நிர்வாக அல்லது சட்ட ஆளுகைப் பரப்பைக் குறிக்கிறது. இந்தத் தமிழாக்கம் நபர் அந்த ஆளுகைப் பகுதியைச் சேர்ந்தவர் என்ற சூழல்சார் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: ἀνέπεμψεν αὐτὸν
  choice: அவரை ... அனுப்பினான்
  rationale: நீதிவிசாரணைச் சூழலில் வழக்கை வேறொரு அதிகாரியிடம் அனுப்பும் நுட்பம் இருக்கலாம்; எனினும் கிரேக்க வினையின் அடிப்படைப் பொருளை இயல்பாகப் பாதுகாக்க ‘அனுப்பினான்’ போதுமானது.
- source_word: πρὸς Ἡρῴδην
  choice: ஏரோதுவிடம்
  rationale: πρός உடன் வேற்றுமை உருபு ஒரு நபரை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் ‘ஏரோதுவிடம்’ இயல்பான இணை.
- source_word: ὄντα καὶ αὐτὸν
  choice: ஏரோதுவும் ... இருந்தான்
  rationale: καὶ αὐτόν தரும் ‘அவரும்’ என்ற வலியுறுத்தலைத் தமிழில் ‘ஏரோதுவும்’ பாதுகாக்கிறது.
- source_word: ἐν Ἱεροσολύμοις
  choice: எருசலேமில்
  rationale: இடப்பெயரின் வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: சொல்லுக்கு சொல் ‘இந்த நாட்களில்’ என்றாலும், கடந்தகாலக் கதைநடையில் தமிழில் ‘அந்த நாட்களில்’ இயல்பாக temporal reference-ஐ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஏரோதுவுடன் தொடர்புடைய ἐξουσία என்பதன் அரசியல்/சட்டப் பொருள்
  choice: ஆளுகைக்கு உட்பட்ட பகுதி
  alternative: அதிகாரம்; ஆளுகை
  rationale: சூழல் பிலாத்து இயேசுவின் பிரதேசச் சார்பை அறிந்து ஏரோதுவிடம் அனுப்புவதைப் பற்றியது. ஆகவே இறையியல் சார்ந்த ‘அதிகாரம்’ என்ற பொதுப்பொருளை விட நிர்வாக-சட்ட ஆளுகைப் பொருளை வெளிப்படுத்துவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான கதைநடை. தெளிவுக்காக ‘பிலாத்து’ எழுவாய் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; முந்தைய வசனச் சூழலில் கிரேக்கத்தில் அது மறைமுகமாக உள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
