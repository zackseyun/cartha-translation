  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவரை அறிந்திருந்த அனைவரும்’ என்பது நெருங்கிய நண்பர்கள் என்ற குறுகிய பொருளைத் திணிக்காமல் மூலத்தின் பரப்பைக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
