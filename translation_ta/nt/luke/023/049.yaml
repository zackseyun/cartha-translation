base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: ta
  text: ஆனால், அவரை அறிந்திருந்த அனைவரும்[a], கலிலேயாவிலிருந்து அவரைப் பின்தொடர்ந்து வந்த பெண்களும் தொலைவில் நின்று, இவற்றைப் பார்த்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய அறிமுகமானவர்கள் அனைவரும்.” கிரேக்கச் சொல் γνωστοί ஒருவருக்குத் தெரிந்தவர்கள், அதாவது அறிமுகமானவர்கள் அல்லது அவரோடு தொடர்புடையவர்கள் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: நின்று ... பார்த்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த நிலையை உணர்த்தும் வினை வடிவத்தைத் தமிழில் தொடர்நிலை அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து பார்வையாளர்களிடம் திரும்பும் மென்மையான எதிர்மாறுதலைக் குறிக்கிறது.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: அவரை அறிந்திருந்த அனைவரும்
  rationale: γνωστοί என்பதன் ‘அவருக்குத் தெரிந்தவர்கள்/அறிமுகமானவர்கள்’ என்ற பரப்பைச் சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: μακρόθεν
  choice: சற்றுத் தொலைவில்
  rationale: பார்வையாளர்கள் தூரத்தில் நின்றிருந்த இடவியல் கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘சற்று’ என்பது துல்லியமான தூர அளவைக் கூறுவதற்கல்ல, இயல்பான சொல்லாக்கத்திற்காகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து அவரைப் பின்தொடர்ந்து வந்த பெண்களும்
  rationale: கலிலேயாவிலிருந்து இயேசுவோடு தொடர்ந்து வந்த குறிப்பிட்ட பெண்கள் குழுவைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: ὁρῶσαι ταῦτα
  choice: இவற்றைப் பார்த்துக்கொண்டிருந்தார்கள்
  rationale: அவர்கள் இந்த நிகழ்வுகளைத் தொடர்ந்து நேரில் கவனித்துக்கொண்டிருந்ததை வெளிப்படுத்தி, ταῦτα என்பதன் பன்மையையும் காக்கிறது.
