  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: ta
  text: அது ஆயத்த நாள்; ஓய்வுநாளும் தொடங்கிக்கொண்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “ஓய்வுநாள் விடிந்துகொண்டிருந்தது.” கிரேக்க வினைச்சொல் “விடிந்துகொண்டிருந்தது” அல்லது “தொடங்கிக்கொண்டிருந்தது” என்று பொருள்படலாம்; இங்கே அது மாலையில் ஓய்வுநாள் தொடங்கியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: ஆயத்த நாள்
  rationale: யூத வழக்கில் ஓய்வுநாளுக்கு முந்திய ஆயத்த நாளைக் குறிக்கும் சொல். ‘வெள்ளிக்கிழமை’ என்று விளக்கமாக மாற்றாமல், கிரேக்கச் சொல்லின் பொருளையும் அந்நாளின் சிறப்புப் பெயர் தன்மையையும் காக்கிறது.
- source_word: σάββατον
  choice: ஓய்வுநாள்
  rationale: சூழலில் குறிப்பிட்ட வாராந்தர ஓய்வுநாளே குறிக்கப்படுவதால், தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு வழங்கப்படுகிறது.
- source_word: ἐπέφωσκεν
  choice: தொடங்கிக்கொண்டிருந்தது
  rationale: இச்சூழலில் ஓய்வுநாள் மாலையில் தொடங்குவதைத் தெளிவாகத் தெரிவிக்கிறது; காலை விடிவதாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது. வினைச்சொல்லின் நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καὶ
  choice: ; …உம்
  rationale: இரு கூற்றுகளுக்கிடையிலான லூக்காவின் இணைப்பைத் தமிழில் இயல்பான தொடர் அமைப்பால் காட்டுகிறது; இரண்டாவது καί ‘உம்’ மூலம் வெளிப்படுகிறது.
theological_decisions:
- issue: ஓய்வுநாள் தொடங்கிய நேரத்துடன் ἐπέφωσκεν என்பதன் தொடர்பு
  choice: ஓய்வுநாள் மாலையில் தொடங்கிக்கொண்டிருந்தது
  alternative: ஓய்வுநாள் விடிந்துகொண்டிருந்தது
  rationale: யூதர்களின் நாள் கணக்கில் ஓய்வுநாள் மாலையில் தொடங்குகிறது. முதன்மை உரை அந்தச் சூழற்பொருளைத் தெளிவாக்குகிறது; கிரேக்க வினையின் ‘விடிதல்’ என்ற நேரடியான சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, சுருக்கமான, கண்ணியமான நடை. ‘ஆயத்த நாள்’ மற்றும் ‘ஓய்வுநாள்’ ஆகியவை வேதாகமச் சூழலைத் தெளிவாகக் காக்கின்றன; சொற்சொல்லான உருவகமும் சூழற்பொருளும் அடிக்குறிப்பு வழியாக இரண்டும் பாதுகாக்கப்படுகின்றன.
