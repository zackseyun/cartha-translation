  verdict: revise
  source_fidelity: திருத்தம் தேவை. வரைவில் செயல் வரிசை மூலத்தின் முதன்மை வினை அமைப்பிலிருந்து தலைகீழாக உள்ளது; மேலும் ὄξος என்பதற்கு மூலத்தில் வெளிப்படையாக இல்லாத ‘திராட்சை’ சேர்க்கப்பட்டுள்ளது. திருத்தப்பட்ட உரை, படைவீரர்கள் ஏளனம் செய்த முதன்மைச் செயலைத் தக்கவைத்துக்கொண்டு, அணுகி புளித்த மதுவை வழங்கிய பங்கேற்புச் செயல்களை அதனுடன் இணைக்கிறது.
  naturalness: ‘அவரிடம் வந்து, புளித்த மதுவை அவருக்கு வழங்கி’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘ஏளனம் செய்தார்கள்’ கண்ணியமான பொதுவாசகர் நடையைப் பேணுகிறது.
  terminology: ‘படைவீரர்கள்’ στρατιῶται என்பதற்குப் பொருத்தமானது. ‘புளித்த மது’ ὄξος என்பதன் ‘sour wine’ பொருளைத் தருகிறது; ‘காடி’ என்னும் பாரம்பரிய மாற்றுச் சொல்லை அடிக்குறிப்பில் வைத்திருப்பது பயனுள்ளது. ‘திராட்சை’ என்பதை நீக்குவதால் மூலத்தில் குறிப்பிடப்படாத விவரம் சேர்க்கப்படுவதில்லை.
  issues:
