    issue: வாக்கியத்தில் மூலத்தின் முக்கிய வினை மற்றும் பங்கேற்புச் செயல்களின் அமைப்பு மாற்றப்பட்டுள்ளது.
    rationale: ἐνέπαιξαν (‘ஏளனம் செய்தார்கள்’) முதன்மை வினை; προσερχόμενοι, προσφέροντες ஆகியவை அதனுடன் இணைந்த பங்கேற்புகள். வரைவு ‘அளித்து ... ஏளனம் செய்தார்கள்’ எனச் செயல் வரிசையை முன்னிலைப்படுத்துகிறது. தமிழில் பங்கேற்புகளை முன்வைத்து முதன்மை வினையை முடிவில் வைப்பது இயல்பானதாயினும், அவை ஏளனச் செயலைத் தகுந்தவாறு வரையறுக்கும் வகையில் அமைக்கப்பட வேண்டும்.
