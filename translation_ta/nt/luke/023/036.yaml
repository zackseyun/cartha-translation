  rationale: உடனடிச் சூழல் அவர்களுடைய செயலை ஏளனத்துடன் இணைக்கிறது; ஆனால் பானத்தை வழங்கியதற்கான தனிப்பட்ட உள்நோக்கத்தை வசனம் வெளிப்படையாக விளக்கவில்லை. எனவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
