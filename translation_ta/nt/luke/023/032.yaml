  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: ta
  text: வேறு இரு குற்றவாளிகளும்[a] அவரோடு கொல்லப்படுவதற்காக[b] அழைத்துச் செல்லப்பட்டுக் கொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீச்செயல் புரிந்தவர்கள்,’ ‘தீயவர்கள்,’ அல்லது ‘குற்றம் செய்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் குற்றத்திற்காகத் தண்டனைத் தீர்ப்புக்குள்ளானவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மரணதண்டனை நிறைவேற்றப்படுவதற்காக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘கொல்லப்படுவதற்காக’ என்றே உள்ளது; அந்தச் சொல் இங்கே கொல்லப்படும் முறையைக் குறிப்பிடவில்லை. எனினும், சூழல் சிலுவை மரணத்தைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: அழைத்துச் செல்லப்பட்டுக் கொண்டிருந்தனர்
  rationale: முற்றுப்பெறாத இறந்தகாலச் செயப்பாட்டு வடிவம், கடந்தகாலத்தில் நடந்துகொண்டிருந்த அழைத்துச் செல்லும் செயலைக் காட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் அந்தச் செயற்போக்கைத் தக்கவைக்கிறது.
- source_word: δὲ καὶ
  choice: மேலும் ... இன்னும்
  rationale: δὲ கதையை மெதுவாக முன்னெடுக்கும் இணைப்பாகவும், καὶ இயேசுவோடு கூடுதலாக மற்றவர்களும் அழைத்துச் செல்லப்பட்டதைச் சுட்டுவதாகவும் உள்ளன.
- source_word: ἕτεροι κακοῦργοι δύο
  choice: குற்றவாளிகளான இன்னும் இரண்டு பேர்
  rationale: ἕτεροι என்பது இயேசுவைத் தவிர வேறு நபர்களைக் குறிக்கிறது; κακοῦργοι அந்த இருவரை அடையாளப்படுத்துகிறது. இவ்வமைப்பு இயேசுவையும் ‘குற்றவாளி’ என வகைப்படுத்தும் தவறான வாசிப்பைத் தவிர்க்கிறது.
- source_word: σὺν αὐτῷ
  choice: அவரோடு
  rationale: σύν உடனிருப்பை அல்லது சேர்ந்து செல்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀναιρεθῆναι
  choice: கொல்லப்படுவதற்காக
  rationale: இங்கு இந்த வினை அதிகாரபூர்வமாக உயிரை நீக்குவதைக் குறிக்கிறது; இவ்வசனத்திலுள்ள சொல் சிலுவையில் அறையும் முறையைத் தனியாகக் குறிப்பிடவில்லை.
theological_decisions:
- issue: ἀναιρεθῆναι என்பதில் மரணமுறையை வெளிப்படையாகக் குறிப்பிட வேண்டுமா?
  choice: கொல்லப்படுவதற்காக
  alternative: சிலுவையில் அறையப்படுவதற்காக; மரணதண்டனை நிறைவேற்றப்படுவதற்காக
  rationale: சூழல் சிலுவை மரணத்தைக் காட்டினாலும், இங்குள்ள கிரேக்க வினை அந்த முறையைக் குறிப்பாகச் சொல்லவில்லை. ஆகவே மூலச்சொல்லின் பரந்த பொருள் காக்கப்படுகிறது.
- issue: ἕτεροι κακοῦργοι இரண்டு பேரையும் இயேசுவையும் ஒரே வகையினராகக் காட்டுகிறதா?
  choice: ‘குற்றவாளிகளான’ என்பது ‘இன்னும் இரண்டு பேர்’ என்பதையே விவரிக்குமாறு அமைத்தல்
  alternative: வேறு இரண்டு குற்றவாளிகள்
  rationale: கிரேக்கத்தில் κακοῦργοι என்பது அந்த மற்ற இருவரைக் குறிக்கிறது; இயேசுவை குற்றவாளி என்று உரை இலக்கணரீதியாகச் சொல்லவில்லை. தெளிவான தமிழ் உறவுப்பண்பு அமைப்பு இதை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அழைத்துச் செல்லப்பட்டுக் கொண்டிருந்தனர்’ என்பது சற்றே நீளமானாலும் கிரேக்க முற்றுப்பெறாத இறந்தகாலச் செயப்பாட்டின் தொடர்நிலையைத் துல்லியமாகக் காக்கிறது.
