id: LUK.16.4
reference: Luke 16:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: ta
  text: “நான் நிர்வாகப் பொறுப்பிலிருந்து நீக்கப்படும்போது, அவர்கள் என்னைத் தங்கள் வீடுகளில் ஏற்றுக்கொள்ளும்படி என்ன செய்யப்போகிறேன் என்று எனக்குத் தெரியும்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: எனக்குத் தெரிந்துவிட்டது
  rationale: இறந்தகால வடிவம் இங்கு புதிதாக ஒரு முடிவுக்கு அல்லது உணர்வுக்கு வந்ததைக் குறிக்கிறது. ‘தெரிந்துவிட்டது’ என்பது அந்தத் திடீர் உணர்வையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί ποιήσω
  choice: என்ன செய்ய வேண்டும்
  rationale: τί உடன் வரும் ஆலோசனைப் பொருளுடைய subjunctive, பேச்சாளர் அடுத்து மேற்கொள்ளவிருக்கும் செயலைச் சிந்தித்து முடிவு செய்வதைக் காட்டுகிறது. தமிழில் ‘என்ன செய்ய வேண்டும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἵνα ὅταν
  choice: நீக்கப்படும்போது … ஏற்றுக்கொள்ளும்படி
  rationale: ἵνα நோக்கத்தையும் ὅταν எதிர்காலத்தில் நிகழவிருக்கும் சூழலையும் குறிக்கின்றன. தமிழில் வாக்கிய அமைப்பை இயல்பாக்கியபோதும் இவ்விரு கூறுகளும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: நிர்வாகப் பொறுப்பிலிருந்து நான் நீக்கப்படும்போது
  rationale: μετασταθῶ என்பது ஒரு பதவி அல்லது நிலையிலிருந்து அகற்றப்படுவதையும், οἰκονομία இங்கு வீட்டுச் சொத்துகளை நிர்வகிக்கும் பொறுப்பையும் குறிக்கிறது. ‘நிர்வாகப் பொறுப்பு’ என்பது சூழலுக்கு ஏற்ற, சமயத் தொழில்சொல் சாயலற்ற மொழிபெயர்ப்பு.
- source_word: δέξωνταί με
  choice: அவர்கள் என்னை … ஏற்றுக்கொள்ளும்படி
  rationale: δέχομαι என்பது இங்கு ஒருவரை வரவேற்று தங்க இடமளிப்பதைக் குறிக்கிறது. ‘ஏற்றுக்கொள்ளுதல்’ அடிப்படைப் பொருளைப் பாதுகாக்கிறது; தேவையற்ற உணர்ச்சிச் சாயலைச் சேர்ப்பதில்லை.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: தங்கள் வீடுகளில்
  rationale: οἶκος இச்சூழலில் வெறும் கட்டடத்தைவிட ஒருவர் தங்க ஏற்றுக்கொள்ளப்படும் ‘வீட்டை’ குறிக்கிறது. ἑαυτῶν என்பதன் reflexive வலிமை ‘தங்கள்’ என்பதால் வெளிப்படுகிறது.
