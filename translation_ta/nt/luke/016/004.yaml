  revision_rationale: 'The revision preserves the Greek sequence and purpose relation: the steward has realized what action he will take, with the aim that others will receive him after his removal. It removes the potentially causative meaning introduced by “செய்வேன்,” while retaining the existing appropriate terminology and the lexical-alternative footnote.'
