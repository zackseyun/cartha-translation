translation_notes:
  register: நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேலாளரின் தனக்குள் பேசும் தொனி இயல்பாக இருக்கும்படி வாக்கியம் அமைக்கப்பட்டுள்ளது; அதே நேரத்தில் நோக்கம், எதிர்காலச் சூழல், விருந்தோம்பலுக்கான எதிர்பார்ப்பு ஆகிய மூலமொழிக் கூறுகள் பாதுகாக்கப்பட்டுள்ளன.
