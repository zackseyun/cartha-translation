  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: ta
  text: இவை எல்லாவற்றோடும் கூட[a], எங்களுக்கும் உங்களுக்கும் இடையே ஒரு பெரும் பிளவு நிலையாக அமைக்கப்பட்டுள்ளது; இங்கிருந்து உங்களிடம் கடந்து செல்ல விரும்புகிறவர்கள் செல்ல முடியாதபடிக்கும், அங்கிருந்து எங்களிடம் கடந்து வர முடியாதபடிக்கும் அது அமைக்கப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை எல்லாவற்றிலும்.” இச்சூழலில் கிரேக்கத் தொடர் கூடுதலான ஒரு கருத்தை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: இவை எல்லாவற்றோடும் கூட
  rationale: சூழலில் மேலும் ஒரு காரணத்தைச் சேர்க்கும் தொடராக இயல்பாக ஒலிக்கிறது; கிரேக்கச் சொல்லமைப்பின் நேரடிப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: எங்களுக்கும் உங்களுக்கும் இடையே
  rationale: இரு குழுக்களுக்கு இடையிலான பிரிவைத் தெளிவாகக் காட்டுகிறது; இரு சுட்டுப்பெயர்களின் பன்மையையும் தமிழ் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: χάσμα μέγα
  choice: ஒரு பெரும் பிளவு
  rationale: கடக்க முடியாத அகன்ற இடைவெளியை நவீனத் தமிழில் தெளிவாக உணர்த்துகிறது.
- source_word: ἐστήρικται
  choice: நிலையாக அமைக்கப்பட்டுள்ளது
  rationale: நிறைவேற்றப்பட்டு தொடர்ந்து நிலைக்கும் நிலையைக் குறிக்கும் கிரேக்க perfect passive வடிவத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ὅπως
  choice: அதனால்
  rationale: இங்கு நோக்கம் அல்லது விளைவு என இருவகையில் உணரக்கூடிய தொடர்பை இயல்பான தமிழில் திறந்தவாறு வைத்திருக்கிறது.
- source_word: οἱ θέλοντες
  choice: விரும்புகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வடிவத்தை பொதுவான மனிதக் குழுவாக இயல்பாக மொழிபெயர்க்கிறது.
- source_word: διαβῆναι ἔνθεν πρὸς ὑμᾶς
  choice: இங்கிருந்து உங்களிடம் கடந்து செல்ல
  rationale: பேசுகிறவரின் இடத்திலிருந்து மறுபக்கத்துக்குச் செல்லும் திசையைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: μὴ δύνωνται
  choice: செல்ல முடியாது
  rationale: தடை விதிப்பதை அல்ல, இயலாமையைக் குறிக்கிறது.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: அங்கிருந்து எங்களிடம் யாரும் கடந்து வரவும் முடியாது
  rationale: எதிர்த்திசையிலான கடத்தலும் இயலாதது என்பதைத் தமிழில் தெளிவாகவும் இணையான அமைப்பிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: உவமையில் இரு நிலைகளுக்கும் இடையிலான பிரிவின் தன்மை
  choice: பிளவு நிலையாக அமைக்கப்பட்டதும் கடக்க முடியாததும் என வசனத்தின் மொழியை மட்டும் பாதுகாத்தல்
  alternative: அதை மறுமையின் சொல்லர்த்தமான நிலவியல் அமைப்பாக விளக்குதல், அல்லது நிலையான மறுமைப் பிரிவைக் குறிக்காத முற்றிலும் உருவகமான மொழியாக மட்டும் கருதுதல்
  rationale: வசனம் பிரிவின் நிலைத்தன்மையையும் அதைக் கடக்க இயலாமையையும் வலியுறுத்துகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “எங்களுக்கும் உங்களுக்கும்” என்பதால் மூலத்தின் பன்மை வெளிப்படையாகப் பாதுகாக்கப்பட்டது; “நிலையாக அமைக்கப்பட்டுள்ளது” என்பது பிரிவின் தொடரும் நிலையைச் சுட்டுகிறது.
