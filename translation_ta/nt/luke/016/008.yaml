reference: Luke 16:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: ta
  text: அந்த எஜமான், நீதியற்ற நிர்வாகி சாமர்த்தியமாகச் செயல்பட்டதால் அவனைப் பாராட்டினார்.[a] ஏனெனில், இந்தக் காலத்தின் மகன்கள் தங்கள் சொந்தத் தலைமுறையினரோடு நடந்துகொள்வதில் ஒளியின் மகன்களைவிடச் சாமர்த்தியமானவர்களாக இருக்கிறார்கள்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவர் நீதியற்ற நிர்வாகியைப் பாராட்டினார்.” இங்கு κύριος என்பது உவமையிலுள்ள எஜமானைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “இந்தக் காலத்தின் மகன்கள்,” “ஒளியின் மகன்கள்” என்பவை மூலத்தில் உள்ள உருவகச் சொற்றொடர்கள். இவை முறையே தற்போதைய காலத்தால் வடிவமைக்கப்பட்டவர்களையும் தேவனுடைய ஒளியோடு அடையாளப்படுத்தப்பட்டவர்களையும் எதிரெதிராகக் காட்டுகின்றன.
    reason: lexical_alternative
  - marker: c
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “தங்கள் சொந்தத் தலைமுறையைப் பொறுத்தவரை ஒளியின் மகன்களைவிடச் சாமர்த்தியமானவர்கள்.” கிரேக்கச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: அந்த எஜமான்
  rationale: உவமையின் உடனடிச் சூழலில் இது செல்வந்த எஜமானைக் குறிப்பது இயல்பானது. ‘ஆண்டவர்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οἰκονόμον
  choice: நிர்வாகி
  rationale: வீட்டின் அல்லது சொத்துகளின் பொறுப்பாளரைக் குறிக்கும் சொல்; இன்றைய வாசகருக்குத் தெளிவான நவீனத் தமிழ்.
- source_word: τῆς ἀδικίας
  choice: நீதியற்ற
  rationale: நிர்வாகியின் ஒழுக்கக் குறையைத் தெளிவாகக் காட்டுகிறது; அதை குறிப்பாக ‘நேர்மையற்ற’ என்று சுருக்கிப் பொருள்கொள்ளாமல் ἀδικία என்பதன் பரந்த அறநெறி வலிமையைப் பாதுகாக்கிறது.
- source_word: φρονίμως / φρονιμώτεροι
  choice: சாமர்த்தியமாக / சாமர்த்தியமானவர்களாக
  rationale: நடைமுறைச் சூழ்ச்சித்திறனையும் முன்னோக்குச் சிந்தனையையும் குறிக்கிறது; ‘ஞானமாக’ என்பதில் தோன்றக்கூடிய அறநெறி அங்கீகாரத்தைத் தவிர்த்து, இரண்டு இடங்களிலும் ஒரே கருத்துத் தொடர்ச்சியைப் பேணுகிறது.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: இந்தக் காலத்தின் மகன்கள்
  rationale: மூலத்தின் செமித்திய உருவகத்தையும் ‘ஒளியின் மகன்கள்’ என்ற இணையான அமைப்பையும் பாதுகாக்கிறது.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: ஒளியின் மகன்கள்
  rationale: தேவனுடைய ஒளியோடு அடையாளப்படுத்தப்பட்டவர்களைக் குறிக்கும் வேதாகம உருவகத்தையும் எதிரிணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: தங்கள் சொந்தத் தலைமுறையினரோடு நடந்துகொள்வதில்
  rationale: கிரேக்கச் சொற்றொடரின் தொடர்பு அல்லது செயல்பாட்டுக் களத்தை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் கடினத்தன்மையும் வேறு சாத்தியமும் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
theological_decisions:
- issue: முதல் உட்பிரிவிலுள்ள ὁ κύριος யாரைக் குறிக்கிறது?
  choice: உவமைக்குள் வரும் எஜமான்
  alternative: ஆண்டவர், அதாவது இயேசு அல்லது தேவன்
  rationale: உடனடி கதையமைப்பு செல்வந்தரையும் அவரது நிர்வாகியையும் பற்றியது. ‘எஜமான்’ என்பது கதைக்குள்ளான குறிப்பை இயல்பாகத் தருகிறது; எனினும் ‘ஆண்டவர்’ என்ற வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: நிர்வாகியின் செயலுக்கான அறநெறி மதிப்பீடு
  choice: அவனுடைய நீதியற்ற தன்மையை அல்ல, அவனுடைய சாமர்த்தியமான செயல்முறையையே எஜமான் பாராட்டுகிறார்
  alternative: அவனுடைய செயல் அறநெறிப்படி ஞானமானது அல்லது அவனுடைய அநீதியே அங்கீகரிக்கப்பட்டது
  rationale: வசனம் அவனை ‘நீதியற்ற’வன் என்று அடையாளப்படுத்திக்கொண்டே அவன் ‘சாமர்த்தியமாக’ செயல்பட்டதைப் பாராட்டுகிறது. இந்த இரு அம்சங்களுக்கிடையிலான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்கதாயும் பொதுவாசகருக்குத் தெளிவாகவும் அமைக்கப்பட்டுள்ளது. ‘மகன்கள்’ என்ற மூல உருவகம் இரு எதிரிணைகளிலும் திட்டமிட்டுப் பாதுகாக்கப்பட்டுள்ளது; அறநெறி அங்கீகாரத்தை உணர்த்தக்கூடிய ‘ஞானம்’ என்பதற்குப் பதிலாக ‘சாமர்த்தியம்’ பயன்படுத்தப்பட்டுள்ளது.
