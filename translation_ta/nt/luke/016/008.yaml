  source_fidelity: மூலக் கிரேக்கத்தின் முக்கிய வேறுபாடுகள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ὁ κύριος உவமையின் எஜமானாக ‘அந்த எஜமான்’ என மொழிபெயர்க்கப்பட்டுள்ளது; οἰκονόμος τῆς ἀδικίας என்பதன் ஒழுக்கரீதியான எதிர்மறை வலிமை ‘நீதியற்ற நிர்வாகி’ என்பதில் உள்ளது. φρονίμως மற்றும் φρονιμώτεροι இரண்டிற்கும் ‘சாமர்த்தியம்’ சார்ந்த தொடர்ச்சியான சொல்லாட்சி, அநீதிக்கு அறநெறி அங்கீகாரம் வழங்காமல் நடைமுறைச் சாதுரியத்தைக் குறிக்கிறது. கடினமான εἰς τὴν γενεὰν τὴν ἑαυτῶν சொற்றொடருக்கான ‘தங்கள் சொந்தத் தலைமுறையினரோடு நடந்துகொள்வதில்’ என்பது ஆங்கில POB audit trail-இன் விளக்கத் தேர்வுடனும் பொருந்தும் வாசிக்கத்தக்க தீர்வாகும்.
