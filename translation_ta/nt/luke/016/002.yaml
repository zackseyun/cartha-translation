language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: ta
  text: அவனை அழைத்து, அவனிடம், “உன்னைப் பற்றி நான் கேட்பது என்ன? உன் நிர்வாகத்தின் கணக்கைக் கொடு[a]. இனி நீ நிர்வாகியாகச் செயல்பட முடியாது[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் நிர்வாகத்தைப் பற்றிய கணக்கைக் கொடு.”
    reason: λόγος மற்றும் οἰκονομία ஆகியவற்றின் கணக்கியல் மற்றும் நிர்வாகத் தொடர்பை வேறு இயல்பான முறையில் மொழிபெயர்க்கலாம்.
  - marker: b
    text: அல்லது, “இனி நீ நிர்வாகப் பொறுப்பில் இருக்க முடியாது.”
    reason: οἰκονομεῖν என்பது நிர்வகிக்கும் செயலை அல்லது நிர்வாகிப் பொறுப்பில் செயல்படுவதை குறிக்கலாம்.
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: அவன் அவனை அழைத்து
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; தமிழில் தொடர்வினையெச்சம் இயல்பாக அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: உன்னைப் பற்றி நான் கேள்விப்படுவது என்ன?
  rationale: கிரேக்கத்தின் கண்டிக்கும் தொனியுடைய நேரடி கேள்வியை மிகைவிளக்கம் இன்றி இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπόδος τὸν λόγον
  choice: கணக்கை ஒப்படை
  rationale: நிர்வாகப் பொறுப்பு முடிவுக்கு வரும்போது கணக்கைச் சமர்ப்பிக்கக் கோரும் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: τῆς οἰκονομίας σου
  choice: உன் நிர்வாகத்துக்கான
  rationale: οἰκονομία என்பது மற்றொருவருடைய உடைமைகளை நிர்வகிக்கும் பொறுப்பு அல்லது பணி; ‘நிர்வாகம்’ நவீன வாசகருக்குப் புரியக்கூடியதாய் அந்தச் சூழலைத் தக்கவைக்கிறது.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: இனி நீ நிர்வாகியாகச் செயல்பட முடியாது
  rationale: δύνῃ உடன் வரும் வினையெச்சத்தின் இயலாமையையும், ἔτι மறுப்புடன் தரும் ‘இனி இல்லை’ என்ற முடிவையும் காக்கிறது; οἰκονομεῖν என்பதன் பணிச்சார்ந்த பொருளும் வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானாலும் கண்ணியமான நேரடி உரை. ‘நிர்வாகி/நிர்வாகம்’ என்ற சொல் இணைப்பு கிரேக்க οἰκονομία/οἰκονομεῖν சொல் தொடர்பை இயன்றவரைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
