- from: அவன் அவனை அழைத்து, “உன்னைப் பற்றி நான் கேள்விப்படுவது என்ன? உன் நிர்வாகத்துக்கான கணக்கை ஒப்படை[a]. இனி நீ நிர்வாகியாகச் செயல்பட முடியாது[b]” என்று சொன்னான்.
  to: அவனை அழைத்து, அவனிடம், “உன்னைப் பற்றி நான் கேட்பது என்ன? உன் நிர்வாகத்தின் கணக்கைக் கொடு[a]. இனி நீ நிர்வாகியாகச் செயல்பட முடியாது[b]” என்றான்.
