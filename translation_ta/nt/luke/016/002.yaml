review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence of calling, the rhetorical question, the demand for an accounting, and the loss of the managerial role. However, «உன் நிர்வாகத்துக்கான கணக்கு» can mean an account intended for management rather than the account of the management entrusted to him; the Greek genitive τῆς οἰκονομίας σου is better represented as «உன் நிர்வாகத்தின் கணக்கு».
  naturalness: «அவன் அவனை அழைத்து» is grammatically possible but stylistically repetitive and less natural than beginning with «அவனை அழைத்து». «உன்னைப் பற்றி நான் கேட்பது என்ன?» is a more direct, idiomatic rendering of the rhetorical Greek question.
  terminology: «நிர்வாகம் / நிர்வாகியாகச் செயல்படுதல்» appropriately preserves the relationship between οἰκονομία and οἰκονομεῖν in modern standard Tamil without imposing a technical ecclesial meaning. «கணக்கைக் கொடு» is natural in an accounting demand and accurately renders ἀπόδος τὸν λόγον.
  issues:
  - severity: low
    issue: Genitive relationship in the accounting phrase is potentially unclear.
    rationale: «நிர்வாகத்துக்கான கணக்கு» may suggest a management-related or management-purpose account. «நிர்வாகத்தின் கணக்கு» more directly expresses “the account of your stewardship/management.”
  - severity: low
    issue: Opening subject-object repetition is unnecessarily heavy.
    rationale: Tamil naturally permits the antecedent subject to remain implicit in «அவனை அழைத்து ... என்றான்», while retaining the source sequence and sense.
  revised_text: அவனை அழைத்து, அவனிடம், “உன்னைப் பற்றி நான் கேட்பது என்ன? உன் நிர்வாகத்தின் கணக்கைக் கொடு[a]. இனி நீ நிர்வாகியாகச் செயல்பட முடியாது[b]” என்றான்.
