base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: ta
  text: பணத்தை நேசிப்பவர்களான பரிசேயர்கள் இவற்றையெல்லாம் கேட்டுக்கொண்டிருந்தார்கள்; அவர்கள் அவரை ஏளனம் செய்துகொண்டிருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை இகழ்ந்து கேலி செய்துகொண்டிருந்தார்கள்.” இந்த வினைச்சொல் வெளிப்படையான ஏளனத்தையோ இகழ்ச்சியுடன் கூடிய கேலியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், அப்போது நடந்துகொண்டிருந்த செயலைக் காட்டும் கிரேக்க imperfect வினையின் கூறை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறை இணைப்பை அல்ல, மென்மையான உரையாடல் அல்லது நிகழ்வோட்ட மாற்றத்தைக் குறிக்கிறது; தமிழில் வாக்கிய அமைப்பே அந்த மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: இயேசு இதற்கு முன் கூறிய போதனைகள் அனைத்தையும் தெளிவாகச் சுட்டுகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: நற்செய்தி நூல்களில் வரும் யூத சமயக் குழுவுக்கான வழக்கமான தமிழ் பெயர்.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: பணத்தை நேசிப்பவர்களாக இருந்த
  rationale: φιλάργυροι என்பதன் நேரடியான ‘பணத்தை நேசிப்பவர்கள்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘பேராசைக்காரர்கள்’ என்ற விரிவான மதிப்பீட்டைத் திணிக்கவில்லை.
- source_word: ἐξεμυκτήριζον
  choice: ஏளனம் செய்துகொண்டிருந்தார்கள்
  rationale: இகழ்ச்சியுடன் கேலி செய்வதையும், imperfect வினை வடிவம் காட்டும் தொடர்ச்சியான செயலையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் இது இயேசுவைக் குறிக்கிறது; மரியாதை ஒருமை தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: φιλάργυροι மூலம் பரிசேயர்களைப் பற்றிய குணவிளக்கம்
  choice: பணத்தை நேசிப்பவர்களாக இருந்த
  alternative: பேராசைக்காரர்களாக இருந்த
  rationale: கிரேக்கச் சொல் குறிப்பாகப் பணத்தின் மீதான நேசத்தைக் கூறுகிறது. இதை நேரடியாகத் தருவது உடனடிச் சூழலில் செல்வத்தைப் பற்றிய இயேசுவின் போதனையோடு உள்ள தொடர்பைப் பாதுகாக்கிறது; அதைவிட விரிவான ஒழுக்கத் தீர்ப்பைச் சேர்க்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு imperfect வினைகளின் தொடர்நிலைத் தன்மையும் ‘கேட்டுக்கொண்டிருந்தார்கள்’, ‘ஏளனம் செய்துகொண்டிருந்தார்கள்’ என்பவற்றால் பாதுகாக்கப்பட்டுள்ளது. δὲ-க்கு தேவையற்ற ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ சேர்க்கப்படவில்லை.
