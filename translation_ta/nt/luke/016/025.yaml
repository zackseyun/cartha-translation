  source_fidelity: மூலக் கிரேக்கத்தின் சொற்தொடரும் எதிர்மறை இணைவும் துல்லியமாகக் காக்கப்பட்டுள்ளன. «மகனே» என்பது இவ்வுரையாடலில் ஆண் செவிமடுப்பவருக்கான இயல்பான அழைப்பு; «உன் வாழ்நாளில்», «அதுபோல», «இப்போதோ … நீயோ» ஆகியவை கால மற்றும் நிலைமாற்ற முரண்பாட்டை நன்றாக வெளிப்படுத்துகின்றன. «துன்பங்கள்» τὰ κακά என்பதை ஒழுக்கத் தீமை எனத் தவறாகப் புரியவிடாமல் சூழலுக்கேற்பத் தருகிறது; «கடும் வேதனையில் இருக்கிறாய்» ὀδυνᾶσαι-யின் தீவிரத் துயரத்தைத் தேவையற்ற கோட்பாட்டு விரிவாக்கமின்றிக் காட்டுகிறது.
