source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: ta
  text: ஆனால் ஆபிரகாம், “மகனே, உன் வாழ்நாளில் உனக்குரிய நன்மைகளை நீ பெற்றாய்[a]; அதுபோல லாசருவும் துன்பங்களைப் பெற்றான் என்பதை நினைவில்கொள். இப்போதோ அவன் இங்கே ஆறுதல் பெறுகிறான்; நீயோ கடும் வேதனையில் இருக்கிறாய்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குரிய நன்மைகளை முழுமையாகப் பெற்றுக்கொண்டாய்.” கிரேக்க வினைச்சொல், ஒருவருக்கு ஒதுக்கப்பட்டதைப் பெறுதல் அல்லது அதை முழுமையாகப் பெற்றுக்கொள்ளுதல் என்ற நுண்பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ வதைக்கப்படுகிறாய்.” கிரேக்கச் சொல் கடுமையான வலி அல்லது ஆழ்ந்த துயரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: மகனே
  rationale: இது நேரடி அழைப்பில் பாசத்தையும் உறவுசார் மேல் நிலையையும் காட்டுகிறது; இங்கு பேசப்படுபவர் ஆண் என்பதற்கும் பொருந்துகிறது, ஆனால் சொல்லின் நோக்கம் நேரடியான உயிரியல் மகனுறவை வலியுறுத்துவது அல்ல.
- source_word: μνήσθητι
  choice: நினைவில்கொள்
  rationale: கடந்த அனுபவத்தை நினைவுபடுத்திக்கொள்ளுமாறு கூறும் கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀπέλαβες
  choice: பெற்றாய்
  rationale: பெறுதல் என்ற அடிப்படைப் பொருளைக் காக்கிறது; உரிய பங்கை அல்லது முழுப் பயனைப் பெற்றுக்கொண்டதைக் குறிக்கும் சாத்தியமான வலியுறுத்தல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ ἀγαθά σου
  choice: உனக்குரிய நன்மைகள்
  rationale: சொல்லின் பரந்த பொருளைக் காத்து, ‘ஆசீர்வாதங்கள்’ என்ற கூடுதல் இறையியல் நிறத்தைத் தவிர்க்கிறது.
- source_word: ἐν τῇ ζωῇ σου
  choice: உன் வாழ்நாளில்
  rationale: பூமியிலான வாழ்க்கைக் காலத்தைக் குறிக்கும் இயல்பான காலவியல் சொற்றொடர்.
- source_word: ὁμοίως
  choice: அதுபோல
  rationale: செல்வந்தனின் நன்மைகளுக்கும் லாசருவின் துன்பங்களுக்கும் இடையிலான இணையான முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: τὰ κακά
  choice: துன்பங்கள்
  rationale: இங்கு லாசரு செய்த ஒழுக்கத் தீமைகள் அல்ல, அவன் அனுபவித்த கேடுகளும் துயரங்களுமே குறிக்கப்படுகின்றன; இயல்பான தமிழில் அந்தச் சூழற்பொருளைத் தருகிறது.
- source_word: παρακαλεῖται
  choice: ஆறுதல் பெறுகிறான்
  rationale: சூழலில் அவன் இப்போது ஆறுதலையும் தேற்றுதலையும் பெறுகிறான் என்பதைக் குறிக்கிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: கதையில் ஆபிரகாம் இருக்கும் தற்போதைய இடத்தை நேரடியாகச் சுட்டுகிறது.
- source_word: ὀδυνᾶσαι
  choice: கடும் வேதனையில் இருக்கிறாய்
  rationale: உடல் அல்லது உள்ளம் சார்ந்த தீவிர வலி, துயரம் ஆகியவற்றைத் திறந்தவையாக வைத்தே கடுமையான அவதியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மரணத்திற்குப் பிந்தைய துன்ப மொழியின் மொழிபெயர்ப்பு
  choice: கடும் வேதனையில் இருக்கிறாய்
  alternative: வதைக்கப்படுகிறாய்
  rationale: சொல் தீவிரமான வேதனையைத் தெளிவாகக் குறிக்கிறது; ஆனால் அந்த வேதனையை ஏற்படுத்தும் செயற்பாட்டாளர் அல்லது அதன் துல்லிய இயல்பை மூலவசனம் குறிப்பிடாததால், மொழிபெயர்ப்பு அதற்கு மேலான கோட்பாட்டு விவரத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடியதாயும் அதேவேளை கண்ணியமான வேதாகம உரைநடையுடனும் வடிவமைக்கப்பட்டது. எதிர்மறை திருப்பத்தை ‘இப்போதோ’ மற்றும் ‘நீயோ’ தெளிவாகக் காட்டுகின்றன; மூலத்தின் சுருக்கமும் இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
