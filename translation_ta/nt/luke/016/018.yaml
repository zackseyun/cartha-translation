base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: ta
  text: தன் மனைவியை விவாகரத்து செய்துவிட்டு வேறொருத்தியைத்[a] திருமணம் செய்கிற ஒவ்வொருவனும் விபசாரம் செய்கிறான்; கணவனிடமிருந்து விவாகரத்து செய்யப்பட்டவளைத்[b] திருமணம் செய்கிறவனும் விபசாரம் செய்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறொரு பெண்ணைத் திருமணம் செய்கிற.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “கணவனிடமிருந்து விவாகரத்து செய்யப்பட்ட நிலையில் இருப்பவளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: ஒவ்வொருவனும்
  rationale: இந்த அமைப்பு பொதுவான, அனைவரையும் உள்ளடக்கும் கூற்றை அறிமுகப்படுத்துகிறது; ‘ஒவ்வொருவனும்’ அதன் உலகளாவிய பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπολύων
  choice: விவாகரத்து செய்துவிட்டு
  rationale: திருமணச் சூழலில் ἀπολύω என்பது வெறுமனே ‘அனுப்பிவிடுதல்’ அல்ல, திருமண உறவை முறிப்பதைக் குறிக்கிறது. அடுத்ததாக வரும் மறுமணத்துடனான தொடரையும் தமிழில் இயல்பாகக் காட்ட ‘செய்துவிட்டு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை
  rationale: இங்கு γυνή என்பதற்கு திருமணச் சூழலின்படி ‘மனைவி’ என்பதே பொருத்தம்; αὐτοῦ-வின் தொடர்பை இயல்பான தமிழில் ‘தன்’ காட்டுகிறது.
- source_word: γαμῶν
  choice: திருமணம் செய்கிற
  rationale: பொதுவான நிகழ்வைக் குறிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பான தமிழ் உறவெச்சத் தொடராக வழங்குகிறது.
- source_word: ἑτέραν
  choice: வேறொருத்தியை
  rationale: பெண்பால் ஒருமை வடிவம் ‘வேறொரு பெண்ணை’ என்பதைக் குறிக்கிறது; ‘வேறொருத்தியை’ சுருக்கமாகவும் இயல்பாகவும் அதைக் காக்கிறது.
- source_word: μοιχεύει
  choice: விபசாரம் செய்கிறான்
  rationale: மூல வினைச்சொல்லின் பாலியல் மற்றும் திருமண ஒழுக்கப் பொருளைத் தெளிவாகக் காட்டும் வழக்கமான வேதாகமத் தமிழ் சொற்றொடர்.
- source_word: ἀπολελυμένην
  choice: விவாகரத்து செய்யப்பட்டவளை
  rationale: நிறைவுப் passive பங்கேற்புச் சொல், விவாகரத்து செய்யப்பட்ட நிலையில் உள்ள பெண்ணைக் குறிக்கிறது; passive பொருள் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἀπὸ ἀνδρὸς
  choice: கணவனிடமிருந்து
  rationale: திருமணச் சூழலில் ἀνήρ என்பது ‘கணவன்’; ἀπό-வின் ‘இடமிருந்து/இருந்து’ என்ற உறவைப் பாதுகாத்து, செயப்படுபொருளின் செயற்பாட்டாளரைத் தேவையின்றி தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் விவாகரத்து குறித்த கூற்றின் பரப்பும் வலிமையும்
  choice: லூக்காவில் உள்ளபடியே, எந்த விதிவிலக்கையும் சேர்க்காமல் பொதுவான ஒழுக்கக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: மத்தேயுவிலுள்ள பாலியல் ஒழுக்கக்கேடு தொடர்பான விதிவிலக்கை இங்கு மறைமுகமாகச் சேர்த்தல், அல்லது குறிப்பிட்ட யூதச் சட்டச் சூழலுக்கே இதைக் கட்டுப்படுத்துதல்.
  rationale: இந்த வசனத்தின் கிரேக்க உரையில் விதிவிலக்கு எதுவும் இல்லை. வேறு பகுதிகளுடன் ஒத்திசைக்க முயன்று சொல்லப்படாத தகுதிகளைச் சேர்க்காமல், லூக்காவின் சுருக்கமான மற்றும் வலுவான கூற்று பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு உடனடியாகப் புரியும் ‘விவாகரத்து’ பயன்படுத்தப்பட்டுள்ளது. ‘விபசாரம் செய்கிறான்’ என்பது dignified மற்றும் பரவலாக அறியப்பட்ட வேதாகமப் பயன்பாடு. இரண்டு இணையான கூற்றுகளின் வலிமையை அரைப்புள்ளி காக்கிறது; மூலத்தில் இல்லாத விதிவிலக்கோ விளக்கமோ முதன்மை உரையில் சேர்க்கப்படவில்லை.
