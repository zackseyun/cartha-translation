  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: ta
  text: ஆனால் ஆபிரகாம், “அவர்களிடம் மோசேயும் தீர்க்கதரிசிகளும் இருக்கிறார்கள்[a]; அவர்கள் அவர்களுக்குச் செவிகொடுக்கட்டும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோசேயும் தீர்க்கதரிசிகளும்” என்பது மோசேயுடன் தொடர்புடைய வேத எழுத்துகளையும் தீர்க்கதரிசன நூல்களையும் உள்ளடக்கிய வேதசாட்சியைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: 'இன்னும் சொல்லுக்குச் சொல்: “அவர்கள் அவர்களைக் கேட்கட்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ Ἀβραάμ
  choice: ஆனால் ஆபிரகாம் ... என்றார்
  rationale: δέ இங்கு பதிலின் மிதமான முரண்பாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. வரலாற்று நிகழ்காலமான λέγει, இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலத்தில் ‘என்றார்’ என வழங்கப்பட்டது.
- source_word: Ἔχουσι
  choice: அவர்களிடம் ... இருக்கிறார்கள்
  rationale: இப்போது அவர்களுக்கு அணுகக்கூடிய சாட்சியாக மோசேயும் தீர்க்கதரிசிகளும் உள்ளனர் என்ற நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: மோசேயும் தீர்க்கதரிசிகளும்
  rationale: மோசேயுடன் தொடர்புடைய எழுத்துகளையும் தீர்க்கதரிசன நூல்களையும் குறிக்கும் யூத மரபுச் சொற்றொடரை விரிவாக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: ἀκουσάτωσαν
  choice: செவிகொடுக்கட்டும்
  rationale: மூன்றாம் நபர் பன்மை கட்டளை வடிவத்தின் வலிமையையும், வெறுமனே ஒலியைக் கேட்பதல்லாமல் கவனித்து ஏற்றுக்கொள்ளும் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτῶν
  choice: அவர்களுக்கு
  rationale: ἀκούω என்பதுடன் வரும் மரபான கிரேக்க அமைப்பைத் தமிழில் ‘அவர்களுக்குச் செவிகொடு’ என்று இயல்பாக வழங்குகிறது; இது மோசேயும் தீர்க்கதரிசிகளும் அளிக்கும் சாட்சியைச் சுட்டுகிறது.
theological_decisions:
- issue: ‘மோசேயும் தீர்க்கதரிசிகளும்’ என்பதன் குறிப்பு
  choice: ஏற்கெனவே அவர்களுக்குக் கொடுக்கப்பட்டுள்ள அதிகாரமிக்க வேதசாட்சியைக் குறிக்கும் ஆகுபெயராகப் புரிந்துகொள்ளப்பட்டது; ஆனால் மூலச் சொற்றொடரே முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: வரலாற்று நபர்களான மோசேயையும் தீர்க்கதரிசிகளையும் மட்டுமே நேரடியாகக் குறிக்கிறது.
  rationale: லூக்காவின் பயன்பாட்டிலும் பரந்த யூதப் பயன்பாட்டிலும் இச்சொற்றொடர் வேதவாக்கியத் தொகுதியைக் குறிப்பிடுவது வழக்கம். ஆயினும் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க கதைநடை பயன்படுத்தப்பட்டது. ‘செவிகொடுக்கட்டும்’ என்பது கட்டளையையும் கவனித்து ஏற்றுக்கொள்ளும் நுணுக்கத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
