source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: ta
  text: அதற்கு அவன், “அப்படியானால், தந்தையே, அவனை என் தந்தையின் வீட்டுக்கு அனுப்புமாறு உம்மைக் கேட்டுக்கொள்கிறேன்[a],” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மிடம் மன்றாடுகிறேன்.” கிரேக்க வினைச்சொல் உருக்கமான வேண்டுகோளை வெளிப்படுத்தக்கூடும்; எனினும் அதன் அடிப்படைப் பொருள் கேட்டுக்கொள்வதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: அதற்கு அவன் … என்றான்
  rationale: δέ இங்கு கதையை முன்ன நகர்த்தும் மென்மையான இணைப்பாக உள்ளது. முந்தைய மறுப்புக்கான பதிலை இயல்பான தமிழில் காட்ட ‘அதற்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Ἐρωτῶ
  choice: கேட்டுக்கொள்கிறேன்
  rationale: ἐρωτάω என்பதன் அடிப்படைப் பொருள் ‘கேட்பது/வேண்டுவது.’ தமிழில் ‘கேட்கிறேன்’ என்பது கேள்வி கேட்பதாகவும் புரியக்கூடும்; ‘கேட்டுக்கொள்கிறேன்’ வேண்டுகோளின் பொருளை இயல்பாகத் தருகிறது, அதேவேளை ‘மன்றாடுகிறேன்’ என்ற அளவுக்கு உணர்ச்சிவலுவை மிகைப்படுத்தாது.
- source_word: σε οὖν
  choice: அப்படியானால் … உம்மை
  rationale: οὖν முந்தைய மறுப்பிலிருந்து தொடரும் முடிவு அல்லது வேண்டுகோளைக் குறிக்கிறது; ‘அப்படியானால்’ அந்தத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது. Abraham-ஐ நேரடியாக அழைப்பதால் மரியாதையான ‘உம்மை’ பயன்படுத்தப்பட்டது.
- source_word: πάτερ
  choice: தந்தையே
  rationale: இது உவமையில் ஆபிரகாமை முன்னோராக அழைக்கும் விளி; கடவுளுக்கான தனிப்பட்ட பட்டமாக மாற்றாமல் ‘தந்தையே’ என வழங்கப்பட்டது.
- source_word: ἵνα πέμψῃς
  choice: அனுப்புமாறு
  rationale: வேண்டுகோளுக்குப் பின் வரும் ἵνα மற்றும் இறந்தகாலமல்லாத துணைவினை வடிவம், வேண்டுகோளின் உள்ளடக்கத்தைத் தெரிவிக்கிறது; ‘அனுப்புமாறு’ தமிழில் இயல்பான சார்பு அமைப்பு.
- source_word: αὐτὸν
  choice: அவனை
  rationale: இப்பெயர்ப்புப் பெயர் முந்தைய சூழலில் உள்ள லாசருவைக் குறிக்கிறது. மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் தமிழிலும் பெயரைச் சேர்க்காமல் பெயர்ப்புப் பெயர் தக்கவைக்கப்பட்டது.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: என் தந்தையின் வீட்டுக்கு
  rationale: οἶκος இங்கு வீடு அல்லது குடும்ப இல்லத்தைக் குறிக்கிறது; இலக்கை உணர்த்தும் εἰς என்பதற்கு ‘வீட்டுக்கு’ இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: உவமையில் πάτερ என்ற விளிப்பின் அடையாளம்
  choice: தந்தையே
  alternative: பிதாவே
  rationale: பேசுபவர் ஆபிரகாமைத் தம் முன்னோராக அழைக்கிறார்; நேரடியாகக் கடவுளை அழைப்பதாக உரை கூறவில்லை. ‘தந்தையே’ அந்த உறவை நவீன தமிழில் தெரிவித்து, தெய்வீகப் பட்டம் என்ற தேவையற்ற வாசிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மை’ என்ற மரியாதை வடிவம் நேரடி அழைப்பின் சூழலுக்கு ஏற்றது; ‘அவனை’ என்பது மூலத்தின் எளிய மூன்றாம் நபர் சுட்டைத் தக்கவைக்கிறது. அடுத்த வசனத்தில் தொடரும் மேற்கோளை உணர்த்த இறுதியில் மேற்கோளுக்குள் காற்புள்ளி வைக்கப்பட்டுள்ளது.
