id: LUK.16.11
reference: Luke 16:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: ta
  text: ஆகவே, அநீதியான செல்வத்தைக்[a] கையாளுவதில் நீங்கள் நம்பிக்கைக்குரியவர்களாக இருக்கவில்லை என்றால், உண்மையான செல்வத்தை[b] உங்களிடம் யார் ஒப்படைப்பார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவகையில்: ‘நேர்மையற்ற செல்வம்.’ சொல்லுக்குச் சொல்: ‘அநீதியான மாமோன்.’'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘உண்மையானது.’ அநீதியான செல்வத்துடன் உள்ள எதிர்மறை ஒப்புமையைத் தெளிவாக்க ‘செல்வம்’ சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: அநீதியான
  rationale: ἄδικος என்பதன் வழக்கமான ‘அநீதியான/நீதியற்ற’ என்ற அறநெறிச் சாயலைப் பாதுகாக்கிறது. ‘நேர்மையற்ற’ என்பது மோசடியாகப் பெற்ற செல்வம் என்ற குறுகிய பொருளைக் கொடுக்கக்கூடும்.
- source_word: μαμωνᾷ
  choice: செல்வம்
  rationale: μαμωνᾶς பணத்தை மட்டும் அல்லாமல் செல்வத்தையும் உடைமைகளையும் குறிக்கலாம்; எனவே ஒலிபெயர்ப்பான ‘மாமோன்’ அல்லது குறுகிய ‘பணம்’ என்பவற்றைவிட ‘செல்வம்’ இயல்பாகவும் விரிவாகவும் உள்ளது.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: அநீதியான செல்வத்தைக் கையாளுவதில்
  rationale: ἐν இங்கு நம்பகத்தன்மை வெளிப்படும் துறை அல்லது சூழலைக் குறிக்கிறது. தமிழில் ‘கையாளுவதில்’ என்பது உக்கிராணத்துவச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πιστοὶ
  choice: நம்பிக்கைக்குரியவர்களாக
  rationale: இந்தச் சூழலில் πιστός ஒப்படைக்கப்பட்டவற்றை நம்பகமாகக் கையாளும் தன்மையைக் குறிக்கிறது. ‘நம்பிக்கைக்குரிய’ என்பது அதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: οὐκ ἐγένεσθε
  choice: இருக்கவில்லை
  rationale: முன்னிலைப் பெயரடையுடன் வரும் γίνομαι இங்கு ‘ஆகுதல்’ என்பதைவிட ‘இருத்தல்/தன்னை நிரூபித்தல்’ என்ற பொருளில் இயங்குகிறது; தமிழில் ‘இருக்கவில்லை’ இயல்பானது.
- source_word: τὸ ἀληθινὸν
  choice: உண்மையான செல்வம்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாமல் ‘உண்மையானது’ என்றே உள்ளது. முன்வரும் செல்வத்துடனான எதிர்மறை ஒப்புமையைத் தெளிவாக்க ‘செல்வம்’ சேர்க்கப்பட்டுள்ளது; இதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: πιστεύσει
  choice: ஒப்படைப்பார்
  rationale: ஒருவரைக் குறிக்கும் மறைமுகச் செயப்படுபொருளுடனும் ஒரு பொருளைக் குறிக்கும் நேரடிச் செயப்படுபொருளுடனும் வரும் πιστεύω இங்கு ‘நம்புதல்’ அல்ல, ‘ஒருவரிடம் ஒன்றை நம்பி ஒப்படைத்தல்’ என்று பொருள்படுகிறது.
theological_decisions:
- issue: τὸ ἀληθινὸν என்பதன் மறைமுகப் பெயர்ச்சொல்
  choice: ‘உண்மையான செல்வம்’ என்று மொழிபெயர்த்து, சேர்க்கப்பட்ட பெயர்ச்சொல்லை அடிக்குறிப்பில் சுட்டிக்காட்டுதல்
  alternative: ‘உண்மையானது’ அல்லது ‘உண்மையான காரியம்’
  rationale: கிரேக்கம் பெயர்ச்சொல்லைக் குறிப்பிடாமல் உண்மையானதைத் திறந்த நிலையில் வைத்திருந்தாலும், உடனடி சூழலில் μαμωνᾶς உடனான எதிர்மறை ஒப்புமை செல்வத்தைக் குறிப்பதாக வலுவாக உணர்த்துகிறது. ‘செல்வம்’ என்பது தமிழில் பொருளை இயல்பாக்கும் சூழல்சார் நிறைவு; குறிப்பிட்ட பரலோகப் பலன் அல்லது தனிப்பட்ட கோட்பாட்டை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அநீதியான செல்வம்’ என்ற சற்றுக் கடினமான சொற்றொடர் கிரேக்கத்தின் அறநெறிச் சாயலைப் பாதுகாக்கிறது; ‘கையாளுவதில்’ என்பது உக்கிராணத்துவச் சூழலை வெளிப்படுத்துகிறது. இறுதி வினா கிரேக்கத்தின் வலியுறுத்தலையும் எதிர்பார்க்கப்படும் எதிர்மறை விடையையும் காக்கிறது.
