id: LUK.16.28
reference: Luke 16:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: ta
  text: ஏனெனில், எனக்கு ஐந்து சகோதரர்கள் இருக்கிறார்கள்; அவர்களும் இந்த வேதனையின் இடத்திற்கு வராதபடி, அவர் அவர்களைத் தீவிரமாக எச்சரிக்கட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களுக்குச் ஆணித்தரமாகச் சாட்சியளிக்கட்டும்” அல்லது “அவர் அவர்களைக் கடுமையாக எச்சரிக்கட்டும்.” கிரேக்க வினைச்சொல் ஆணித்தரமாகச் சாட்சியளித்தல் அல்லது எச்சரித்தல் என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: ஏனெனில், எனக்கு ... இருக்கிறார்கள்
  rationale: γάρ முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ἔχω என்பதன் இயல்பான தமிழ் வடிவம் ‘எனக்கு ... இருக்கிறார்கள்.’
- source_word: πέντε ἀδελφούς
  choice: ஐந்து சகோதரர்கள்
  rationale: ἀδελφούς ஆண்பால் பன்மை; இச்சூழலில் ஆண் உடன்பிறந்தவர்களையே குறிக்கிறது.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: அவர் அவர்களிடம் ஆணித்தரமாக எச்சரிக்கட்டும்
  rationale: ὅπως நோக்கத்தை உணர்த்துகிறது. διαμαρτύρομαι என்பது ஆணித்தரமாகச் சாட்சியளித்தல் அல்லது கடுமையாக எச்சரித்தல் எனப் பொருள்படலாம்; அடுத்துள்ள தவிர்க்கும் நோக்கவாக்கியத்தால் இங்கு எச்சரிப்பு முன்னிலைப்படுகிறது.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: அவர்களும் ... வந்துவிடாதபடி
  rationale: ἵνα μή எதிர்மறை நோக்கத்தைத் தெரிவிக்கிறது; καὶ αὐτοὶ என்பது ‘அவர்களும்’ என்ற சேர்க்கைப் பொருளைத் தருகிறது. ‘வந்துவிடாதபடி’ இயல்பான தமிழில் விரும்பத்தகாத முடிவைத் தடுக்கும் நோக்கத்தை வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: இந்த வேதனையான இடத்திற்கு
  rationale: εἰς இலக்கைச் சுட்டுகிறது. βάσανος கடும் வேதனை அல்லது துன்புறுத்தலைக் குறிக்கிறது; ‘வேதனையான இடம்’ அனுபவிக்கப்படும் நிலையைத் தெளிவாகக் காட்டுகிறது, அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: மறுமை நிலையின் இடத்தை βάσανος கொண்டு விவரித்தல்
  choice: இந்த வேதனையான இடத்திற்கு
  alternative: இந்த வேதனையின் இடத்திற்கு / இந்தத் துன்புறுத்தலின் இடத்திற்கு
  rationale: மூலவசனம் அந்த இடத்தை அங்கு அனுபவிக்கப்படும் கடும் வேதனையால் விவரிக்கிறது. ‘வேதனையான இடம்’ அந்தத் தீவிரத்தைக் காக்கிறது; வசனம் கூறாத விரிவான மறுமைக் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். முந்தைய வேண்டுகோளுடன் உள்ள காரணத் தொடர்பை ‘ஏனெனில்’ காக்கிறது. நேரடியான ஒரே வாக்கியத்தின் பதிலாக வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; நோக்கத் தொடர்பு இரண்டாவது வாக்கியத்தில் காக்கப்பட்டுள்ளது.
