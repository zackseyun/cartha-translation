revisions:
- from: ஏனெனில், எனக்கு ஐந்து சகோதரர்கள் இருக்கிறார்கள். அவர்களும் இந்த வேதனையான இடத்திற்கு வந்துவிடாதபடி, அவர் அவர்களிடம் ஆணித்தரமாக எச்சரிக்கட்டும்[a].
  to: ஏனெனில், எனக்கு ஐந்து சகோதரர்கள் இருக்கிறார்கள்; அவர்களும் இந்த வேதனையின் இடத்திற்கு வராதபடி, அவர் அவர்களைத் தீவிரமாக எச்சரிக்கட்டும்[a].
  rationale: The revision preserves the explanatory connection, the male-specific ‘brothers,’ both purpose relations, and the narrative’s restrained description of the location. It restores the source order of warning followed by the negative purpose and renders βάσανος as the noun ‘torment’ rather than an adjective. The footnote remains anchored to the warning verb and presents its legitimate testimony and warning alternatives.
  reviewer_model: gpt-5.6-terra
