reference: Luke 16:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: ta
  text: 'அப்போது அந்த மேலாளர் தனக்குள் இவ்வாறு சொல்லிக்கொண்டான்: ‘என் எஜமான் என்னிடமிருந்து என் மேலாளர் பொறுப்பை எடுத்துக்கொள்கிறார்; நான் என்ன செய்வேன்? தோண்டுவதற்கு எனக்குப் பலமில்லை; பிச்சை எடுக்க வெட்கமாக இருக்கிறது.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலாளர் / மேலாளர் பொறுப்பு’ என்பவற்றுக்கு ‘பொறுப்பாளர் / பொறுப்பாளர் பணி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நபரையும் அவரது பொறுப்பையும் குறிக்க ஒரே சொற்குடும்பத்தைச் சேர்ந்த சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: மேலாளர் / மேலாளர் பொறுப்பு
  rationale: மற்றொருவரின் உடைமைகளையும் அலுவல்களையும் நிர்வகிக்க ஒப்படைக்கப்பட்ட நபரையும் அவரது பொறுப்பையும் குறிக்கிறது. மூலத்தில் உள்ள தொடர்புடைய சொற்களின் உறவைத் தமிழிலும் தெளிவாக வைத்திருக்கிறது.
- source_word: ἐν ἑαυτῷ
  choice: தனக்குள்
  rationale: உள்ளார்ந்த பேச்சையோ சிந்தனையையோ குறிக்கும் இயல்பான தமிழ் வழக்கு.
- source_word: Τί ποιήσω
  choice: நான் என்ன செய்வேன்?
  rationale: எதிர்கால நடவடிக்கை குறித்த தனக்குள்ளான ஆலோசனைக் கேள்வியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κύριός μου
  choice: என் எஜமான்
  rationale: இங்கு இறைப்பட்டம் அல்லாமல் மேலாளருக்கு அதிகாரமுள்ள மனித முதலாளியைக் குறிக்கிறது.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: என்னிடமிருந்து ... எடுத்துவிடுகிறார்
  rationale: ஒருவரிடமிருந்து பதவிப் பொறுப்பைப் பறித்தல் அல்லது நீக்குதல் என்ற வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: தோண்டுவதற்கு எனக்குப் பலமில்லை
  rationale: தோண்டுதல் என்ற கடின உடல் உழைப்புக்குத் தேவையான வலிமை தன்னிடம் இல்லை என்பதைக் குறிப்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: பிச்சை கேட்க எனக்கு வெட்கமாக இருக்கிறது
  rationale: இரந்து கேட்பதைக் குறிக்கும் வினையையும் அதைப் பற்றிய வெட்க உணர்வையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இறைப்பட்டமாகவும் சாதாரண அதிகாரப் பெயராகவும் வரக்கூடிய κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்; உரிமையாளர்
  rationale: உவமையின் இச்சூழலில் இது செல்வந்த மனிதரையும் மேலாளரின் அதிகாரியையும் குறிக்கிறது. ‘ஆண்டவர்’ தேவையற்ற இறையியல் ஒலியை ஏற்படுத்தலாம்; ‘உரிமையாளர்’ அதிகார உறவை முழுமையாகச் சொல்லாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. உள்மொழியை மேற்கோளுக்குள் வைத்தும், மூலத்தின் மூன்று பகுதிகளைக் கொண்ட சிந்தனை ஓட்டத்தைப் பாதுகாத்தும் உள்ளது. அடிக்குறி குறியீடு உரையின் முடிவில் இணைக்கப்பட்டுள்ளது.
