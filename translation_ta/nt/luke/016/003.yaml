revisions:
- from: அப்போது அந்த மேலாளர் தனக்குள், ‘என் எஜமான் என்னிடமிருந்து மேலாளர் பொறுப்பை எடுத்துவிடுகிறாரே, நான் என்ன செய்வேன்? தோண்டுவதற்கு எனக்குப் பலமில்லை; பிச்சை கேட்க எனக்கு வெட்கமாக இருக்கிறது’ என்று சொன்னான்.[a]
  to: 'அப்போது அந்த மேலாளர் தனக்குள் இவ்வாறு சொல்லிக்கொண்டான்: ‘என் எஜமான் என்னிடமிருந்து என் மேலாளர் பொறுப்பை எடுத்துக்கொள்கிறார்; நான் என்ன செய்வேன்? தோண்டுவதற்கு எனக்குப் பலமில்லை; பிச்சை எடுக்க வெட்கமாக இருக்கிறது.’[a]'
