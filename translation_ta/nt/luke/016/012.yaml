source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: ta
  text: மேலும், மற்றொருவருக்குச் சொந்தமானதில்[a][c] நீங்கள் நம்பகமானவர்களாக இருக்கவில்லை என்றால், உங்களுக்குச் சொந்தமானதை[b] உங்களுக்கு யார் கொடுப்பார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்றொருவருடைய உடைமையில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களுடையதை.”
    reason: lexical_alternative
  - marker: c
    text: இந்த முரண், இப்போது உலகச் செல்வத்தைக் கையாளுவதில் காட்டும் நம்பகத்தன்மைக்கும் பின்னர் உண்மையான அல்லது நிலையான செல்வத்தைப் பெறுவதற்கும் இடையிலான தொடர்பைக் குறிக்கலாம்; ஆனால் இந்த வசனம் மட்டும் அவை எவற்றைக் குறிக்கின்றன என்பதை வெளிப்படையாகச் சொல்லவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: மற்றொருவருக்குச் சொந்தமானதில்
  rationale: கட்டுரையுடன் வரும் நடுநிலை ஒருமை பெயரடையான இது, ‘மற்றொருவருக்குச் சொந்தமானது’ என்று பெயர்ச்சொல் பொருளில் செயல்படுகிறது. தமிழில் ‘சொந்தமானதில்’ என்பது அந்த உடைமைப் பொருளையும், அதில் காட்ட வேண்டிய பொறுப்புணர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πιστοὶ
  choice: உண்மையுள்ளவர்களாக
  rationale: இங்கு இது நம்பிக்கை கொள்வதைக் குறிக்காமல், ஒப்படைக்கப்பட்டதைப் பொறுப்புடன் கையாளும் நம்பகத்தன்மையைக் குறிக்கிறது. ‘உண்மையுள்ளவர்கள்’ என்பது அந்த ஒழுக்க மற்றும் பொறுப்பாளர் சூழலைத் தக்கவைக்கிறது.
- source_word: οὐκ ἐγένεσθε
  choice: இருக்கவில்லை
  rationale: γίνομαι என்பதன் இறந்தகால வடிவம் இங்கு ஒரு நிலையில் இருப்பது அல்லது அப்படிப்பட்டவர்களாகத் தங்களை நிரூபிப்பது என்ற கருத்தைக் கொண்டுள்ளது. நிபந்தனை வாக்கியத்தில் ‘இருக்கவில்லை’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: τὸ ὑμέτερον
  choice: உங்களுக்குச் சொந்தமானதை
  rationale: கட்டுரையுடன் வரும் நடுநிலை ஒருமை வடிவம் ‘உங்களுடையது’ என்று பெயர்ச்சொல் பொருளில் உள்ளது. ‘உங்களுக்குச் சொந்தமானதை’ என்பது முந்தைய ‘மற்றொருவருக்குச் சொந்தமானதில்’ என்பதுடனான முரணைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: δώσει ὑμῖν
  choice: உங்களுக்கு யார் கொடுப்பார்
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடு’. சூழலால் ‘ஒப்படைப்பார்’ என்பதும் சாத்தியமானாலும், ‘கொடுப்பார்’ என்பது கிரேக்கச் சொல்லுக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: καὶ εἰ
  choice: மேலும் … என்றால்
  rationale: καί முந்தைய கூற்றுடன் தொடர்பைத் தொடர்கிறது; εἰ நிபந்தனையை அறிமுகப்படுத்துகிறது. ‘மேலும் … என்றால்’ இந்த உரைத் தொடர்பையும் நிபந்தனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τίς
  choice: யார்
  rationale: கொடுப்பவர் யார் என்று வினாவும் வினாப்பெயரை ‘யார்’ நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ‘மற்றொருவருக்குச் சொந்தமானது’ என்பதற்கும் ‘உங்களுக்குச் சொந்தமானது’ என்பதற்கும் இடையிலான முரணின் பொருள்
  choice: இவை எவற்றைக் குறிக்கின்றன என்பதை முதன்மை உரையில் குறிப்பாக வரையறுக்காமல் முரணை மட்டும் தக்கவைத்தல்.
  alternative: முந்தைய வசனத்துடன் இணைத்து ‘உலகச் செல்வம்’ மற்றும் ‘உண்மையான செல்வம்’ என்று விளக்குதல்; அல்லது தற்போதைய பூமிக்குரிய பொறுப்பும் எதிர்கால நித்திய உரிமையும் என்று விளக்குதல்.
  rationale: இந்த வசனத்தின் கிரேக்க உரை முரணைக் கூறுகிறது; ஆனால் இரு கூறுகளின் குறிப்பிட்ட பொருளை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே இறையியல் பதற்றத்தையும் உண்மையான பொருள் திறப்பையும் காக்க, முதன்மை உரை அவற்றை மறைபொருளாகவே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘உண்மையுள்ளவர்கள்’ என்பது வேதாகமச் சூழலுக்கு ஏற்றதாய் இருந்தாலும் இங்கு நம்பிக்கை கொள்வதை அல்ல, பொறுப்பில் நம்பகமாக இருப்பதைச் சுட்டுகிறது. மூலத்தின் சொல்லப்படாத குறிப்புகள் விளக்கமாக முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
