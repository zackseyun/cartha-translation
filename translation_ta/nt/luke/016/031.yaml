id: LUK.16.31
reference: Luke 16:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: ta
  text: அதற்கு அவர் அவனிடம், “அவர்கள் மோசேக்கும் தீர்க்கதரிசிகளுக்கும் செவிகொடுக்காவிட்டால்[a], இறந்தவர்களிடமிருந்து ஒருவர் உயிர்த்தெழுந்தாலும்[b], அவர்கள் நம்பவைக்கப்பட மாட்டார்கள்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கேட்காவிட்டால்’ அல்லது ‘கீழ்ப்படியாவிட்டால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை கேட்டலையும் அதற்குக் கவனத்துடன் பதிலளிப்பதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இறந்தவர்களுள் இருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘இணங்க மாட்டார்கள்’ அல்லது ‘உறுதியாக நம்ப மாட்டார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவாக நம்பவைக்கப்படுதல் அல்லது இணங்குதல் என்று பொருள்படும்; இங்கு அதை இறையியல் பொருளில் ‘விசுவாசித்தல்’ என்று மட்டும் குறுக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: ஆனால் அவர் அவனிடம் ... என்றார்
  rationale: δέ உரையாடலில் மெல்லிய எதிர்மறைத் திருப்பைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; தமிழின் இயல்பான மேற்கோள் அமைப்புக்கேற்ப ‘என்றார்’ வாக்கிய முடிவில் வைக்கப்பட்டது.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: மோசேக்கும் தீர்க்கதரிசிகளுக்கும்
  rationale: இது மோசேயையும் தீர்க்கதரிசிகளையும் வழியாகக் கிடைத்த அதிகாரமுள்ள வேதசாட்சியைக் குறிக்கும் நிலையான யூத வழக்கு. அதை ‘வேதவாக்கியங்கள்’ என்று விளக்கிப் பெயர்க்காமல் மூல உருவகம் பாதுகாக்கப்படுகிறது.
- source_word: οὐκ ἀκούουσιν
  choice: செவிகொடுக்காவிட்டால்
  rationale: ἀκούω இங்கு வெறுமனே ஒலியைக் கேட்பதை மட்டுமல்லாமல் கவனித்துக் கேட்டு ஏற்றுக்கொள்ளும் கருத்தையும் கொண்டிருக்கலாம். ‘செவிகொடு’ அந்த இரு நிழற்பொருள்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: οὐδ’ ἐάν
  choice: உயிர்த்தெழுந்தாலும் ... மாட்டார்கள்
  rationale: முதல் மறுப்பை வலுப்படுத்தி, இரண்டாம் நிபந்தனையிலும் விளைவு ஏற்படாது என்பதைக் காட்டும் அமைப்பு தமிழில் ‘-ஆலும் ... மாட்டார்கள்’ என இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: குறிப்பிடப்படாத ஒருமை நபரைக் குறிக்கும் τις என்பதற்கு இயல்பான, மரியாதையான தமிழ் இணை.
- source_word: ἐκ νεκρῶν
  choice: இறந்தவர்களிடமிருந்து
  rationale: பன்மையான νεκρῶν என்பதையும் ‘அவர்களிடமிருந்து/அவர்களுள் இருந்து’ என்ற பிரிவுப் பொருளையும் பாதுகாக்கிறது.
- source_word: ἀναστῇ
  choice: உயிர்த்தெழுந்தாலும்
  rationale: உயிர்த்தெழுதல் சூழலில் ἀνίστημι என்பதன் பொருளைத் தெளிவாகக் காட்டுகிறது; ἐάν உடனான நிபந்தனைத் தன்மை ‘-ஆலும்’ மூலம் வெளிப்படுகிறது.
- source_word: πεισθήσονται
  choice: ஏற்றுக்கொள்ளும்படி நம்பவைக்கப்பட மாட்டார்கள்
  rationale: πείθω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவமான இது வாதம் அல்லது சாட்சியால் ஒருவரை ஏற்றுக்கொள்ளச் செய்தல்/நம்பவைத்தல் என்ற பொதுப் பொருளைக் கொண்டது. ‘விசுவாசிக்க மாட்டார்கள்’ என்று குறுகிய இறையியல் பொருளைச் சேர்ப்பதை இத்தேர்வு தவிர்க்கிறது.
theological_decisions:
- issue: ‘மோசேயும் தீர்க்கதரிசிகளும்’ என்பதன் குறிப்பு
  choice: இஸ்ரவேலுக்கு ஏற்கெனவே கொடுக்கப்பட்ட அதிகாரமுள்ள வேதசாட்சியைக் குறிக்கும் வழக்குச் சொற்றொடராக வைத்தல்
  alternative: மோசே, தீர்க்கதரிசிகள் என்னும் இரு வகை நபர்களை மட்டும் குறிப்பதாக மொழிபெயர்த்தல்; அல்லது நேரடியாக ‘வேதவாக்கியங்கள்’ என விரித்துரைத்தல்
  rationale: சூழலில் இச்சொற்றொடர் வேதத்தின் சாட்சியைக் குறிக்கிறது. அதேவேளை, மூலத்தின் உருவகச் சொற்றொடரை அப்படியே வைத்திருப்பது விளக்கத்தை மொழிபெயர்ப்புக்குள் கட்டாயப்படுத்தாமல் பாதுகாக்கிறது.
- issue: πεισθήσονται என்பதன் வலிமை
  choice: பொதுவான நம்பவைத்தல் அல்லது ஏற்றுக்கொள்ளச் செய்தல்
  alternative: ‘விசுவாசிப்பார்கள்’ அல்லது ‘மனந்திரும்புவார்கள்’
  rationale: கிரேக்க வினை ஒருவர் நம்பவைக்கப்படுதல் அல்லது இணங்கச் செய்யப்படுதல் என்பதைக் குறிக்கிறது; இரட்சிக்கும் விசுவாசம் அல்லது மனந்திரும்புதல் என்று குறிப்பாகச் சொல்லவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘செவிகொடு’ வேதாகமச் சூழலுக்கேற்ற மரியாதைநடையைக் கொண்டிருந்தாலும் இன்றைய தமிழிலும் தெளிவாக உள்ளது. ‘நம்பவைக்கப்பட மாட்டார்கள்’ செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘ஏற்றுக்கொள்ளும்படி’ என்பது அதன் பொருளை இயல்பாக்குகிறது.
