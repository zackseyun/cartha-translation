id: LUK.16.5
reference: Luke 16:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: ta
  text: அவன் தன் எஜமானிடம் கடன்பட்டிருந்த ஒவ்வொருவரையும் அழைத்து, முதலாமவனிடம், “நீ என் எஜமானுக்கு எவ்வளவு கடன்பட்டிருக்கிறாய்?” என்று கேட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க κύριος என்ற சொல் பல இடங்களில் “ஆண்டவர்” என மொழிபெயர்க்கப்படுகிறது. ஆனால் இங்கு அது நிர்வாகியின் மனித மேலதிகாரியைக் குறிப்பதால் “எஜமான்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: அழைத்து
  rationale: இறந்தகால நடுவினைப் பெயரெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் ‘அழைத்து’ என்பது அந்தத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἕνα ἕκαστον
  choice: ஒவ்வொருவரையும்
  rationale: இந்தச் சொற்றொடரின் பகிர்ந்தளிக்கும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χρεοφειλετῶν
  choice: கடன்பட்டிருந்த
  rationale: இங்கு எஜமானிடம் பொருளாதாரக் கடன் வைத்திருந்தவர்களைக் குறிக்கிறது; பெயரெச்சத் தொடர் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: தன் எஜமானிடம்
  rationale: ἑαυτοῦ நிர்வாகியையே திரும்பச் சுட்டுகிறது; κύριος இங்கு மனித எஜமானைக் குறிக்கிறது. ‘கடன்பட்டிருந்த’ என்பதுடன் தமிழுக்கேற்ற வேற்றுமை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔλεγεν
  choice: என்று கேட்டான்
  rationale: மூலத்தில் ‘சொல்லிக்கொண்டிருந்தான்/சொன்னான்’ என்ற குறைநிலை இறந்தகால வடிவம் உள்ளது; நேரடி வினா வருவதால் தமிழில் ‘கேட்டான்’ இயல்பானது. ஒவ்வொருவரிடமும் நிகழ்ந்த தொடர்ச்சியான செயல் சூழலால் வெளிப்படுகிறது.
- source_word: τῷ πρώτῳ
  choice: முதலாமவனிடம்
  rationale: வரிசையில் முதலில் அணுகப்பட்ட ஆண் நபரை நேரடியாகக் குறிக்கிறது.
- source_word: Πόσον
  choice: எவ்வளவு
  rationale: கடனின் அளவைக் கேட்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ὀφείλεις
  choice: கடன்பட்டிருக்கிறாய்
  rationale: நிதிசார் சூழலில் தற்போதைய கடன்பாட்டைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῷ κυρίῳ μου
  choice: என் எஜமானுக்கு
  rationale: μου என்பதன் முதல் நபர் உடைமையையும், κύριος குறிக்கும் மனித மேலதிகாரியையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உவமையின் குடும்ப-பொருளாதாரச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர் / தலைவர்
  rationale: இவ்வசனத்தில் κύριος தெய்வீகப் பட்டமாக அல்லாமல் நிர்வாகியின் மனித மேலதிகாரியைக் குறிக்கிறது. ‘எஜமான்’ சமூக-பொருளாதார உறவைத் தெளிவாகக் காட்டி, தேவையற்ற தெய்வீகப் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. ‘எஜமான்’ இச்சூழலின் மனித உரிமையாளர்–நிர்வாகி உறவைத் தெளிவாகக் காட்டுகிறது. அடிக்குறிப்புக் குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
