  source_fidelity: மூலத்தின் செயல்வரிசை, பகிர்ந்தளிக்கும் பொருள், கடனாளிகள், நிர்வாகியின் சொந்த எஜமான், முதல் நபரிடம் கேட்கப்படும் கடன் அளவு ஆகிய அனைத்தும் துல்லியமாகத் தரப்பட்டுள்ளன. ἔλεγεν என்ற குறைநிலை இறந்தகாலத்தின் தொடர்நிகழ்வு நுணுக்கம் தமிழில் நேரடி வினா அறிமுகத்தில் இயல்பான இறந்தகாலமான “கேட்டான்” மூலம் போதுமானவாறு வெளிப்படுகிறது; பொருளில் இழப்பு இல்லை.
  naturalness: “தன் எஜமானிடம் கடன்பட்டிருந்த ஒவ்வொருவரையும் அழைத்து” மற்றும் நேரடி வினா அமைப்பு நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளன. “முதலாமவனிடம்” இச்சூழலில் வழக்கமான, புரிந்துகொள்ளத்தக்க வடிவம்.
  terminology: κύριος இரு இடங்களிலும் மனித மேலதிகாரியைக் குறிக்கும் இவ்வுவமைச் சூழலுக்கு ஏற்றவாறு “எஜமான்” என ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது. “கடன்பட்டிருந்த/கடன்பட்டிருக்கிறாய்” என்பவை χρεοφειλετῶν மற்றும் ὀφείλεις என்பவற்றின் நிதிசார் பொருளைத் துல்லியமாகக் காட்டுகின்றன. அடிக்குறிப்பு இந்தச் சூழல்சார் சொல் தேர்வைச் சரியாக விளக்குகிறது.
