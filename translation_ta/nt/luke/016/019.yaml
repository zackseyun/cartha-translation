source:
  edition: SBLGNT
  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: ta
  text: செல்வந்தன் ஒருவன் இருந்தான்; அவன் ஊதா நிற ஆடைகளையும் நுண்ணிய நார்த்துணியையும் அணிந்துகொண்டு, நாள்தோறும் செழுமையாக மகிழ்ந்து வாழ்ந்துவந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாள்தோறும் செழுமையாக விருந்துண்டு மகிழ்ந்துவந்தான்.” εὐφραινόμενος என்ற சொல் களிப்புடன் இருப்பதையோ விருந்துண்டு மகிழ்வதையோ குறிக்கலாம்; λαμπρῶς என்பது செழுமையையும் சிறப்பையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: செல்வந்தன் ஒருவன் இருந்தான்
  rationale: τις அறிமுகப்படுத்தும் குறிப்பிட்டுப் பெயரிடப்படாத ஒருவரை ‘ஒருவன்’ இயல்பாகக் காட்டுகிறது; δέ-யின் கதைத் தொடர்ச்சி தமிழில் தனியாகச் சொல்லப்படாமல் வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: πλούσιος
  choice: செல்வந்தன்
  rationale: பொருளாதார வளமுள்ள மனிதனைக் குறிக்கும் நேரடியான, நவீனத் தமிழ் சொல்.
- source_word: ἐνεδιδύσκετο
  choice: அணிந்துகொண்டு ... வாழ்ந்துவந்தான்
  rationale: இறந்தகாலத்தில் தொடர்ச்சியாக இருந்த வழக்கத்தை imperfect வடிவம் காட்டுவதால், ‘வாழ்ந்துவந்தான்’ என்பதுடன் இணைத்து பழக்கநிலையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πορφύραν
  choice: ஊதா நிற ஆடைகள்
  rationale: ஊதா சாயமிட்ட விலையுயர்ந்த ஆடையைக் குறிக்கும் பண்பாட்டு அடையாளத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: βύσσον
  choice: மெல்லிய நார்த்துணி ஆடைகள்
  rationale: உயர்தரமான நுண்ணிய linen துணியைச் சுட்டுகிறது; ‘பட்டு’ எனக் கூறி வேறு துணிவகையைப் பொருளில் புகுத்துவது தவிர்க்கப்பட்டுள்ளது.
- source_word: εὐφραινόμενος
  choice: மகிழ்ந்து வாழ்ந்துவந்தான்
  rationale: சொல் முதன்மையாகக் களிப்புடன் அனுபவிப்பதையோ கொண்டாடுவதையோ குறிக்கிறது; சூழலில் விருந்து உண்பதும் உட்படலாம், ஆனால் அதை முதன்மை உரையில் கட்டாயமாக்கவில்லை.
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் நிகழ்ந்த வழக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λαμπρῶς
  choice: மிக ஆடம்பரமாக
  rationale: இச்சூழலில் பகட்டும் செழுமையும் நிறைந்த வாழ்க்கைமுறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: εὐφραινόμενος என்பது பொதுவான களிப்பையா அல்லது குறிப்பாக விருந்துண்பதையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘மகிழ்ந்து வாழ்ந்துவந்தான்’
  alternative: ‘விருந்துண்டு மகிழ்ந்துவந்தான்’
  rationale: கிரேக்கச் சொல்லின் பரந்த பொருளை முதன்மை உரை பாதுகாக்கிறது; செல்வச் சூழலில் விருந்துண்ணும் சாத்தியத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது, ஆனால் அதையே ஒரே பொருளாக முடிவு செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘இரத்தாம்பரம்’ போன்ற சொற்களும், linen என்பதைக் silk எனத் தவறாக உணர்த்தக்கூடிய ‘பட்டு’ என்பதும் தவிர்க்கப்பட்டுள்ளன.
