source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: ta
  text: அதற்கு அவன், “இல்லை, தந்தை ஆபிரகாமே! ஆனால் இறந்தோரிலிருந்து[a] யாராவது அவர்களிடம் போனால், அவர்கள் மனந்திரும்புவார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தோருள் இருந்து.”
    reason: ἀπὸ νεκρῶν என்ற சொற்றொடரை ‘இறந்தவர்களிடமிருந்து’ என்றும் ‘இறந்தவர்களின் நடுவிலிருந்து’ என்றும் புரிந்துகொள்ளக்கூடிய மொழிபெயர்ப்பு நுணுக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Οὐχί
  choice: இல்லை
  rationale: வலுவான மறுப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: πάτερ Ἀβραάμ
  choice: தந்தை ஆபிரகாமே
  rationale: இது அழைப்புவேற்றுமையில் உள்ள உறவுமுறை அழைப்பு; ஆபிரகாமை மூதாதையாக அழைக்கும் கருத்தைப் பாதுகாக்கிறது.
- source_word: ἀλλ’ ἐάν
  choice: ஆனால் ... போனால்
  rationale: முந்தைய கூற்றை மறுத்துத் திருத்தும் எதிர்மறைத் திருப்பையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τις
  choice: யாராவது
  rationale: குறிப்பிடப்படாத ஒருவரைக் குறிக்கும் ஒருமைச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: ἀπὸ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: இறந்தவர்களின் நிலையிலிருந்தோ கூட்டத்திலிருந்தோ ஒருவர் வருவதைச் சுருக்கமாகவும் மூலத்தின் பன்மையைப் பாதுகாத்தும் தெரிவிக்கிறது.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: அவர்களிடம் போனால்
  rationale: πρός குறிக்கும் அவர்களை நோக்கிய இயக்கத்தையும், ἐάν உடன் வரும் நிபந்தனை அமைப்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: μετανοήσουσιν
  choice: அவர்கள் மனந்திரும்புவார்கள்
  rationale: லூக்காவின் சூழலில் வெறும் கருத்துமாற்றம் அல்லாமல், எச்சரிப்புக்குப் பதிலாக நிகழும் ஒழுக்க மற்றும் ஆவிக்குரிய திருப்பத்தைத் தெரிவிக்கிறது.
theological_decisions:
- issue: மனந்திரும்புதலைக் குறிக்கும் μετανοήσουσιν என்பதன் பொருள்
  choice: மனந்திரும்புவார்கள்
  alternative: தங்கள் எண்ணத்தை மாற்றிக்கொள்வார்கள்
  rationale: இச்சூழலில் சொல் வெறும் அறிவுசார் கருத்துமாற்றத்தைக் காட்டாமல், இறை எச்சரிப்பைக் கேட்டு வாழ்வில் திரும்புவதைக் குறிக்கிறது; ‘மனந்திரும்புவார்கள்’ அந்த விரிவான வேதாகமப் பொருளைப் பாதுகாக்கிறது.
- issue: ἀπὸ νεκρῶν என்பதில் உள்ள வெளிப்பாட்டின் பரப்பு
  choice: இறந்தோரிலிருந்து
  alternative: இறந்தோருள் இருந்து
  rationale: மூலத்தில் உள்ள பன்மையையும் ‘இருந்து’ என்ற பிரிவு/தோற்றக் கருத்தையும் பாதுகாக்கிறது; அதேவேளை ஒருவர் இறந்தோரின் நடுவிலிருந்து வருகிறார் என்ற வாசிப்பை அடிக்குறிப்பு வெளிப்படையாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் உரையாடலுக்கேற்ற இயல்புடனும், அதேவேளை கண்ணியமான வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. ‘தந்தை’ உறவுமுறை அழைப்பாகவும் ‘மனந்திரும்பு’ ஒழுக்க-ஆவிக்குரிய திருப்பத்தைக் குறிக்கும் பரவலாகப் புரியக்கூடிய சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளன.
