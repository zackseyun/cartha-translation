source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் சொன்னார்: “மக்கள் முன் உங்களை நீங்களே நீதிமான்களாகக் காட்டிக்கொள்கிறவர்கள் நீங்கள்தான்; ஆனால் கடவுள் உங்கள் இதயங்களை அறிந்திருக்கிறார். ஏனெனில், மக்களிடையே உயர்வாகக் கருதப்படுவது கடவுளின் பார்வையில் அருவருப்பானது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களிடையே மிகவும் மதிக்கப்படுவது கடவுளின் பார்வையில் அருவருக்கத்தக்க ஒன்று.”
    reason: τὸ ἐν ἀνθρώποις ὑψηλὸν என்பது சமூகத்தில் மிகவும் மதிக்கப்படுவதையும் குறிக்கலாம்; βδέλυγμα என்பதற்கான மேலும் பெயர்ச்சொல் சார்ந்த மாற்றும் இங்கே தரப்படுகிறது.
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: உங்களை நீங்களே நீதிமான்களாகக் காட்டிக்கொள்கிறவர்கள்
  rationale: தங்களை நீதியுள்ளவர்களாக அல்லது நியாயப்படுத்தப்பட்டவர்களாகப் பிறர் முன் நிலைநிறுத்துவதைச் சூழல் குறிக்கிறது. தமிழில் ‘உங்களை நீங்களே நீதிமான்களாக்கிக்கொள்கிறவர்கள்’ என்பது உண்மையான நீதியாக்கத்தைப் போலத் தவறாகப் புரியக்கூடும்; ‘காட்டிக்கொள்கிறவர்கள்’ சமூகத்தின் முன் தங்களை அப்படியாக முன்வைக்கும் கருத்தை இயல்பாகத் தருகிறது.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: மக்கள் முன்
  rationale: ἐνώπιον என்பதன் ‘முன்/பார்வையில்’ என்ற பொருளையும், ἀνθρώπων என்பதன் பொதுவான மனிதக் குறிப்பையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: உங்கள் இதயங்களை அறிந்திருக்கிறார்
  rationale: ‘இதயங்கள்’ என்பது உள்ளார்ந்த எண்ணங்கள், நோக்கங்கள், மனநிலை ஆகியவற்றைக் குறிக்கும் வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: மக்களிடையே உயர்வாகக் கருதப்படுவது
  rationale: ὑψηλόν என்பதிலுள்ள உயர்வு உருவகத்தையும், சூழலில் உள்ள சமூக மதிப்பு அல்லது மேன்மைப்படுத்தல் கருத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; ‘மிகவும் மதிக்கப்படுவது’ என்பது சாத்தியமான மாற்று.
- source_word: βδέλυγμα
  choice: அருவருப்பானது
  rationale: கடவுளின் பார்வையில் வெறுக்கத்தக்க அல்லது அருவருக்கத்தக்க ஒன்றைக் குறிக்கும் வலுவான சொல்லை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைத் தெளிவாகக் காட்டி, மனிதர்களின் மதிப்பீட்டுடனான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: …கிறவர்கள் நீங்கள்தான்
  rationale: கிரேக்க மூலத்தின் வலியுறுத்தப்பட்ட குற்றச்சாட்டை தமிழின் இயல்பான ‘நீங்கள்தான்’ அமைப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δικαιοῦντες என்ற சொல்லின் இச்சூழலிலான வலிமை
  choice: நீதிமான்களாகக் காட்டிக்கொள்கிறவர்கள்
  alternative: உங்களை நீங்களே நியாயப்படுத்திக்கொள்கிறவர்கள்
  rationale: இங்கு பிறர் முன்னிலையில் தங்களை நீதியுள்ளவர்களாக முன்வைப்பதே மையம். ‘நியாயப்படுத்துதல்’ என்பது தமிழில் செயல்களுக்கு காரணம் கூறுவதாக மட்டும் புரிய வாய்ப்புள்ளதால், சூழல்சார்ந்த பொருள் தேர்ந்தெடுக்கப்பட்டது; உண்மையில் கடவுள் அவர்களை நீதிமான்களாக்குகிறார் என்ற கருத்து புகுத்தப்படவில்லை.
- issue: τὸ ἐν ἀνθρώποις ὑψηλὸν என்பதன் பொருள்
  choice: மக்களிடையே உயர்வாகக் கருதப்படுவது
  alternative: மக்களிடையே மிகவும் மதிக்கப்படுவது
  rationale: சொல்லிலுள்ள உயரம்/மேன்மை உருவகத்தையும் சமூக மதிப்பீட்டையும் பாதுகாக்கிறது; அது செல்வம், அந்தஸ்து அல்லது புகழ் ஆகியவற்றில் ஏதேனும் ஒன்றாக மட்டும் சுருக்கப்படவில்லை.
- issue: βδέλυγμα என்பதன் தீவிரம்
  choice: அருவருப்பானது
  alternative: அருவருக்கத்தக்க ஒன்று
  rationale: கடவுளின் எதிர்மறையான மதிப்பீட்டின் வலிமையைத் தக்கவைக்கிறது; குறிப்பிட்ட சடங்கியல் அல்லது சமயப் பிரிவுசார் பொருளைத் தேவையின்றி புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். கிரேக்கத்தின் வலியுறுத்தல் ‘நீங்கள்தான்’ என்பதால் காக்கப்பட்டுள்ளது. ‘இதயங்கள்’ என்ற வேதாகம உருவகம் மொழிபெயர்க்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது. பிரதான உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
