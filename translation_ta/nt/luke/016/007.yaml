translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் மரியாதைப் பன்மை வந்தாலும் மேலாளரைக் குறிக்கும் ‘அவன்’ தொடர்ந்து வைக்கப்பட்டுள்ளது. மூலத்தின் வரலாற்று நிகழ்கால மாற்றம் ‘என்கிறான்’ என்பதால் பாதுகாக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில உரையில் அடிக்குறி குறியீடுகள் பொருளுடன் பொருந்தாத இடங்களில் இருந்ததால், [a] கடன் பத்திரத்திற்கும் [b] கோர் அளவிற்கும் பொருளடிப்படையில் இணைக்கப்பட்டுள்ளன.
