  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: ta
  text: பின்பு அவன் வேறொருவரிடம், “நீ எவ்வளவு கடன்பட்டிருக்கிறாய்?” என்றான். அவன், “நூறு கோர்[b] அளவு கோதுமை” என்றான். அவன் அவனிடம், “உன் கடன் பத்திரத்தை[a] எடுத்துக்கொண்டு, ‘எண்பது’ என்று எழுது” என்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “உன் எழுத்துப்பூர்வ ஒப்பந்தத்தை” அல்லது “உன் ஆவணங்களை.” கிரேக்கத்தில் “உன் எழுத்துகள்” (τὰ γράμματα); இங்கு இது கடனாளியின் எழுத்துப்பூர்வ கடன் பத்திரம் அல்லது கணக்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கோர் என்பது தானியங்களை அளக்கப் பயன்படுத்தப்பட்ட ஒரு பெரிய உலர் அளவையாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: பின்பு
  rationale: அடுத்த கடனாளியிடம் உரையாடல் நகர்வதைக் காட்டும் இயல்பான காலவரிசைச் சொல்.
- source_word: ἑτέρῳ
  choice: வேறொருவரிடம்
  rationale: முன்பு குறிப்பிடப்பட்டவரிலிருந்து வேறான இன்னொருவரைக் குறிக்கிறது; மூலத்தில் இல்லாத பாலினக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: Σὺ δὲ πόσον ὀφείλεις
  choice: நீ எவ்வளவு கடன்பட்டிருக்கிறாய்?
  rationale: Σὺ என்பதன் வலியுறுத்தலையும் δέ குறிக்கும் உரையாடல் மாற்றத்தையும் இயல்பான நேரடிக் கேள்வியாகக் காட்டுகிறது.
- source_word: Ἑκατὸν κόρους σίτου
  choice: நூறு கோர் அளவு கோதுமை
  rationale: κόρος என்ற குறிப்பிட்ட பண்டைய உலர் அளவை பொதுவான ‘அளவு’ என மாற்றாமல் ஒலிபெயர்த்துப் பாதுகாக்கிறது; தமிழ் வாசிப்பின் தெளிவுக்காக ‘அளவு’ சேர்க்கப்பட்டுள்ளது.
- source_word: λέγει αὐτῷ
  choice: அவன் அவரிடம் ... என்கிறான்
  rationale: கிரேக்கத்தில் கடந்தகால விவரிப்பினிடையே வரும் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து நிகழ்வின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: Δέξαι σου τὰ γράμματα
  choice: உன் கடன் பத்திரத்தை எடுத்துக்கொண்டு
  rationale: γράμματα என்பது சொற்படியாக ‘எழுத்துகள்/ஆவணங்கள்’ என்றாலும், இச்சூழலில் கடனைப் பதிவு செய்த பத்திரத்தைக் குறிக்கிறது. ஒருமை தமிழ் வழக்கில் இயல்பாக உள்ளது.
- source_word: γράψον ὀγδοήκοντα
  choice: ‘எண்பது’ என்று எழுது
  rationale: பத்திரத்தில் உள்ள தொகையை எண்பதாக எழுதும்படி கொடுக்கப்படும் கட்டளையை மூலத்திற்கு நெருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
