review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the appeal, mercy request, sending of Lazarus, fingertip dipped in water, cooling of the tongue, and severe suffering in the singular flame. A small revision makes φωνήσας explicit as a loud cry/call rather than merely describing the following speech as spoken loudly.
  naturalness: The proposed wording is clear and dignified modern standard Tamil. “உரக்கக் கூப்பிட்டு” is more idiomatic and precise than the draft's comma-separated “உரத்த குரலில்,” while honorific imperatives are natural for the ancestral address.
  terminology: “தந்தை ஆபிரகாமே,” “லாசரு,” “இரக்கம்,” “விரல் நுனி,” “நாவு,” and “தீச்சுடர்” are suitable. The footnote alternative is adjusted from a passive ‘being tormented’ formulation, which can imply an external tormenter not expressed by ὀδυνῶμαι, to a source-neutral expression of suffering.
  issues:
  - severity: low
    issue: φωνήσας is underrepresented by “உரத்த குரலில்” alone.
    rationale: The Greek participle denotes calling or crying out. Adding “கூப்பிட்டு” explicitly renders the action and retains its urgency.
  - severity: low
    issue: The footnote’s “வதைக்கப்படுகிறேன்” introduces a passive form.
    rationale: ὀδυνῶμαι expresses intense pain or distress without specifying an external agent. “துன்புறுகிறேன்” preserves the lexical alternative without adding that implication.
  revised_text: அவன் உரக்கக் கூப்பிட்டு, ‘தந்தை ஆபிரகாமே, என்மேல் இரக்கம் காட்டுங்கள். லாசருவை அனுப்புங்கள்; அவன் தன் விரல் நுனியைத் தண்ணீரில் தோய்த்து என் நாவைக் குளிரச்செய்யட்டும். ஏனெனில், இந்தத் தீச்சுடரில் நான் கடும் வேதனைப்படுகிறேன்[a]’ என்றான்.
