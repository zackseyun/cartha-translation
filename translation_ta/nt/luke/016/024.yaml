source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: ta
  text: அவன் உரக்கக் கூப்பிட்டு, ‘தந்தை ஆபிரகாமே, என்மேல் இரக்கம் காட்டுங்கள். லாசருவை அனுப்புங்கள்; அவன் தன் விரல் நுனியைத் தண்ணீரில் தோய்த்து என் நாவைக் குளிரச்செய்யட்டும். ஏனெனில், இந்தத் தீச்சுடரில் நான் கடும் வேதனைப்படுகிறேன்[a]’ என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தத் தீச்சுடரில் நான் துன்புறுகிறேன்.’ கிரேக்க வினைச்சொல் கடுமையான வேதனையையோ துன்பத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: உரத்த குரலில்
  rationale: இங்கு இந்த இறந்தகால வினையெச்சம் அவசரமும் தீவிரமும் நிறைந்த கூக்குரலைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் அதைக் காட்டுகிறது.
- source_word: ἐλέησόν με
  choice: என்மீது இரக்கம் காட்டும்
  rationale: இரக்கம் அல்லது கருணை காட்டுமாறு நேரடியாக வேண்டுவதைக் கண்ணியமான தமிழில் தெளிவாகத் தருகிறது.
- source_word: πέμψον
  choice: அனுப்பும்
  rationale: கிரேக்கக் கட்டளையின் நேரான பொருளைப் பேணுகிறது; ஆபிரகாமை மரியாதையுடன் ஒருமையில் அழைக்கும் சூழலுக்கு ஏற்ற வடிவம்.
- source_word: βάψῃ
  choice: தோய்த்து
  rationale: விரல் நுனியைத் தண்ணீரில் சிறிது நேரம் அமிழ்த்தும் செயலை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: தன் விரல் நுனியை
  rationale: உடல் உறுப்பின் நுனி என்ற கிரேக்கச் சொல்லமைப்பைச் சுருக்கமான இயல்பான தமிழில் பேணுகிறது.
- source_word: καταψύξῃ
  choice: குளிரச்செய்யட்டும்
  rationale: குளிர்விப்பதன் மூலம் தணிவளிக்கும் உறுதியான உடல்சார் படிமத்தைப் பேணுகிறது.
- source_word: γλῶσσάν μου
  choice: என் நாவை
  rationale: கிரேக்கத்தின் நேரடியான உடல் உறுப்பு குறிப்பை மாற்றமின்றித் தருகிறது.
- source_word: ὀδυνῶμαι
  choice: நான் கடும் வேதனைப்படுகிறேன்
  rationale: கடுமையான வலி அல்லது துயரத்தைத் தெரிவிக்கிறது; கிரேக்கத்தைத் தணிக்காமலும் தேவையற்ற கோட்பாட்டு நிறம் சேர்க்காமலும் உள்ளது.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: இந்தத் தீச்சுடரில்
  rationale: φλόξ என்பதன் குறிப்பான ‘சுடர்/ஜுவாலை’ படிமத்தைத் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: Πάτερ Ἀβραάμ
  choice: தந்தை ஆபிரகாமே
  rationale: மூதாதையருடனான உறவை முன்வைக்கும் நேரடி அழைப்பைத் தமிழில் மரியாதையுடன் பேணுகிறது.
theological_decisions:
- issue: செல்வந்தனின் வேதனையை மொழிபெயர்த்தல்
  choice: இந்தத் தீச்சுடரில் நான் கடும் வேதனைப்படுகிறேன்
  alternative: இந்தத் தீச்சுடரில் நான் வதைக்கப்படுகிறேன்
  rationale: ὀδυνῶμαι கடுமையான வலி அல்லது துயரத்தைக் குறிக்கிறது. ‘கடும் வேதனைப்படுகிறேன்’ அதன் தீவிரத்தைப் பேணுகிறது; துன்பத்தை யாரோ வெளிப்படையாகச் செய்கிறார் என்று கிரேக்கத்தைவிட அதிகமாகக் கூறக்கூடிய செயப்பாட்டு வடிவத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. வேண்டுகோளில் மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; காட்சியின் தீவிரமும் கிரேக்கத்தின் உடல்சார் படிமங்களும் பேணப்பட்டுள்ளன.
