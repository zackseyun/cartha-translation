- from: அவன் உரத்த குரலில், ‘தந்தை ஆபிரகாமே, என்மீது இரக்கம் காட்டும். லாசருவை அனுப்பும்; அவன் தன் விரல் நுனியைத் தண்ணீரில் தோய்த்து, என் நாவைக் குளிரச்செய்யட்டும். ஏனெனில், இந்தத் தீச்சுடரில் நான் கடும் வேதனைப்படுகிறேன்[a]’ என்றான்.
