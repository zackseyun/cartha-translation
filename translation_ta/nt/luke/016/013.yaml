source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: ta
  text: எந்த வீட்டு வேலைக்காரனாலும் இரண்டு எஜமானர்களுக்குப் பணிசெய்ய முடியாது. ஏனெனில், அவன் ஒருவரை வெறுத்து மற்றவரிடம் அன்புகூருவான்; அல்லது ஒருவரைப் பற்றிக்கொண்டு மற்றவரை இகழ்வான். கடவுளுக்கும் மாமோனுக்கும்[a] நீங்கள் பணிசெய்ய முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாமோன்’ என்பது ‘செல்வம்’ அல்லது ‘பணம்’ என்று பொருள்படும் சொல். இங்கு செல்வம், கடவுளுக்குப் போட்டியான ஓர் எஜமானனைப்போல் சித்தரிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: வீட்டு வேலைக்காரன்
  rationale: இச்சொல் பொதுவான பணியாளரை மட்டும் அல்லாமல், ஒரு வீட்டைச் சார்ந்து பணிபுரியும் கீழ்நிலை ஊழியரைக் குறிக்கிறது. நவீன தமிழில் புரியும்படி வீட்டுச் சூழலையும் எஜமான்–வேலைக்காரன் உறவையும் இச்சொல் காக்கிறது.
- source_word: κυρίοις
  choice: எஜமானர்கள்
  rationale: இங்கு κύριος என்பது தெய்வீகப் பட்டமாகிய ‘ஆண்டவர்’ என்பதைக் குறிக்காமல், வேலைக்காரன்மேல் அதிகாரமுள்ள மனித எஜமானர்களைக் குறிக்கிறது.
- source_word: δουλεύειν
  choice: பணிசெய்ய
  rationale: அடிமை அல்லது வேலைக்காரன் நிலையில் சேவிப்பது இதன் அடிப்படைப் பொருள். ‘பணிசெய்ய’ என்பது இயல்பான நவீன தமிழ்; எஜமானர்கள் என்ற சூழல் அதன் கீழ்ப்படிதல் சார்ந்த வலிமையைத் தெளிவாக்குகிறது.
- source_word: μισήσει
  choice: வெறுப்பான்
  rationale: அன்புகூருதல் என்பதற்கு எதிரான வலுவான சொல்லாக மூலத்தின் நேரடிப் பொருளைத் தளர்த்தாமல் காக்கிறது.
- source_word: ἀγαπήσει
  choice: அன்புகூருவான்
  rationale: ‘வெறுப்பான்’ என்பதோடு அமைந்துள்ள திட்டமிட்ட எதிர்மறை இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἀνθέξεται
  choice: பற்றிக்கொள்வான்
  rationale: ஒருவரை உறுதியாகப் பற்றிக்கொண்டு அவரிடம் விசுவாசமாக நிற்பது என்ற உறவு மற்றும் பற்றுறுதியை வெளிப்படுத்துகிறது.
- source_word: καταφρονήσει
  choice: இகழ்வான்
  rationale: அற்பமாக எண்ணி மதிக்காமல் நடத்துவது என்ற வலுவான பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: θεῷ
  choice: கடவுள்
  rationale: δουλεύειν என்பதன் மறைமுக வேற்றுமை உருபுடைய பொருளாக இங்கு ஒரே கடவுளைத் தெளிவாகக் குறிக்கிறது.
- source_word: μαμωνᾷ
  choice: மாமோன்
  rationale: செல்வத்தைக் குறிக்கும் செமித்தியக் கடன்சொல்லை ஒலிபெயர்த்து வைத்திருப்பது, செல்வம் ஒரு போட்டி எஜமானனைப்போல் சித்தரிக்கப்படும் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: θεῷ என்பதற்கு எதிராக μαμωνᾷ என்பதை வழங்குதல்
  choice: மாமோன்
  alternative: பணம்; செல்வம்
  rationale: கடவுளும் மாமோனும் போட்டி எஜமானர்களாக வசனத்தில் நிறுத்தப்படுகிறார்கள். ‘மாமோன்’ என்ற வடிவம் செல்வத்தை அதிகாரம் கோரும் போட்டிச் சக்தியாகக் காட்டும் உருவகத் தன்மையைப் பாதுகாக்கிறது; இது மாமோன் உண்மையில் ஒரு தெய்வம் என்று கூறுவதில்லை.
- issue: ஒருமை வேலைக்காரனைத் தொடர்ந்து வரும் மனிதச் சுட்டு
  choice: அவன் ... அன்புகூருவான் ... பற்றிக்கொள்வான் ... இகழ்வான்
  alternative: வேலைக்காரன் ...; பன்மை வடிவம்
  rationale: கிரேக்கத்தில் எடுத்துக்காட்டான வேலைக்காரனும் வினைகளும் ஒருமையில் உள்ளன. தமிழ் வாக்கியத்தில் ‘அவன்’ என்பதை ஒருமுறை வெளிப்படுத்தி, பிரதிநிதித்துவ ஒருமையை இயல்பாகக் காத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஊழியம் செய்’ என்ற சமயச் சிறப்புப் பயன்பாட்டைத் தவிர்த்து, வீட்டு வேலைக்காரன்–எஜமான் சூழலுக்கும் இறுதி உருவகத்துக்கும் பொருந்தும் ‘பணிசெய்’ பயன்படுத்தப்பட்டுள்ளது. ‘வெறுத்து/அன்புகூருதல்’ மற்றும் ‘பற்றிக்கொண்டு/இகழுதல்’ என்ற இரு எதிரிணைகளும் மூலத்தின் வலிமையுடன் காக்கப்பட்டுள்ளன.
