  rationale: புதிய நபரை அறிமுகப்படுத்தும் காலவரையற்ற சுட்டாக இயல்பான நவீனத் தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὀνόματι Λάζαρος
  choice: லாசரு என்னும் பெயருடைய
  rationale: பெயரைக் குறிக்கும் கிரேக்க வேற்றுமைத் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; Λάζαρος என்பது லாசரு என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐβέβλητο
  choice: கிடத்தப்பட்டிருந்தான்
  rationale: 'வினையின் இறந்தகால நிறைவு நிலையையும் செயப்பாட்டு வடிவையும் காக்கிறது: மற்றவர்கள் அவனை அங்கே கொண்டுவந்து கிடத்தியிருந்தனர். ‘தூக்கி எறியப்பட்டிருந்தான்’ என்ற கடுமையான சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.'
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: அந்தப் பணக்காரனுடைய வாசலருகே
  rationale: πυλών பெரிய வீட்டின் வாயில் அல்லது நுழைவாயிலைக் குறிக்கலாம். முந்தைய வசனத்தின் பணக்காரனையே αὐτοῦ சுட்டுவதால், தமிழில் தெளிவுக்காக அந்தச் சுட்டு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: εἱλκωμένος
  choice: புண்கள் நிறைந்தவனாக
  rationale: புண்கள் அல்லது ஆறாத புண்களால் பாதிக்கப்பட்டிருந்த நிலையைத் தெளிவாகத் தெரிவிக்கிறது; நோயின் வகையைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்கவில்லை.
