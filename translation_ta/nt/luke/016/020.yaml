lexical_decisions:
- source_word: πτωχὸς
  choice: ஏழையான
  rationale: இச்சொல் வறுமையிலும் பிறரைச் சார்ந்தும் வாழும் நிலையைக் குறிக்கிறது. பிச்சைக்காரன் என்ற குறிப்பிட்ட சமூகப் பாத்திரத்தைச் சேர்க்காமல், மூலத்தின் பொதுவான பொருளை இது காக்கிறது.
- source_word: τις
