reference: Luke 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: ta
  text: 'மேலும் நான் உங்களுக்குச் சொல்கிறேன்: அநீதியான செல்வத்தைக் கொண்டு உங்களுக்காக நண்பர்களை ஏற்படுத்திக்கொள்ளுங்கள்; அது இல்லாமற்போகும்போது அவர்கள் உங்களை நித்திய உறைவிடங்களுக்குள் வரவேற்கும்படி செய்யுங்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: உங்களுக்காக நண்பர்களை ஏற்படுத்திக்கொள்ளுங்கள்
  rationale: தற்சுட்டுப் பொருளையும் கட்டளைத் தன்மையையும் காத்து, நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: அநீதியான செல்வத்தைக் கொண்டு
  rationale: ἐκ என்பதன் சூழல்சார் கருவிப்பொருளை ‘கொண்டு’ வெளிப்படுத்துகிறது. μαμωνᾶ என்பது பணம் அல்லது செல்வத்தைக் குறிக்கிறது; τῆς ἀδικίας என்பதைக் ‘அநீதியான’ என்று விரிவாகவே வைத்திருப்பதால், மோசடியாக ஈட்டிய செல்வம் என்ற ஒரே பொருளுக்குள் வாக்கியம் சுருக்கப்படவில்லை.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: அது இல்லாமற்போகும்போது ... வரவேற்கும்படி
  rationale: வினையின் வெளிப்படையாகச் சொல்லப்படாத எழுவாயை அருகிலுள்ள ‘செல்வம்’ எனப் புரிந்துகொண்டு ‘அது’ என்று தருகிறது; செல்வத்தின் நிலையாமையையும் இயல்பாகக் காட்டுகிறது. வேறு சாத்தியமான புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: δέξωνται ὑμᾶς
  choice: அவர்கள் உங்களை ... வரவேற்கும்படி
  rationale: δέχομαι இங்கு ஓர் இடத்திற்குள் அன்புடன் ஏற்றுக்கொள்ளும் பொருளைக் கொண்டதால் ‘வரவேற்க’ என மொழிபெயர்க்கப்படுகிறது. ‘அவர்கள்’ யார் என்பது விளக்கிச் சேர்க்கப்படாமல் விடப்பட்டுள்ளது.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: நித்திய உறைவிடங்களுக்குள்
  rationale: σκηναί என்பதன் சொல்லடிப் பொருள் கூடாரங்கள் என்றாலும், இச்சூழலில் தங்கும் இடங்களைக் குறிக்கும் இயல்பான தமிழாக ‘உறைவிடங்கள்’ பயன்படுத்தப்பட்டுள்ளது; உருவகத்தின் சொல்லடிப் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘அநீதியான செல்வம்’ என்பதன் பொருள்
  choice: இப்போதைய அநீதியால் குறியிடப்பட்ட உலகத்துக்குரிய செல்வம் என்ற விரிந்த பொருளைத் திறந்துவைத்தல்
  alternative: மோசடியாக அல்லது நேர்மையின்றி ஈட்டப்பட்ட செல்வம் மட்டும்; அல்லது தனிப்பட்ட ஆளாக உருவகப்படுத்தப்பட்ட மாமோன்
  rationale: மூலச்சொற்றொடர் செல்வத்தை மோசடியில் ஈட்டிய பணம் என்ற பொருளுக்கு மட்டும் சுருக்கவில்லை; அதேவேளை இங்கே மாமோனை முழுமையாக ஆளுருவாக்கவும் மொழிபெயர்ப்பு கட்டாயப்படுத்தவில்லை.
- issue: ἐκλίπῃ என்பதன் எழுவாய்
  choice: செல்வம் இல்லாமற்போகிறது
  alternative: நீங்கள் இல்லாமற்போகும்போது, அதாவது இறக்கும்போது; அல்லது உலக வளங்கள் பொதுவாகத் தீரும்போது
  rationale: மிக அருகிலுள்ள இயல்பான முன்னிலைச் சொல் செல்வமே. எனினும் கிரேக்க வினையில் எழுவாய் வெளிப்படையாக இல்லை என்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: வரவேற்கும் ‘அவர்கள்’ யார்?
  choice: அடையாளத்தை விளக்காமல் மூலத்தின் மறைபொருளைத் தக்கவைத்தல்
  alternative: செல்வத்தால் ஏற்படுத்திக்கொண்ட நண்பர்கள்; ஏழைகள் அல்லது தேவனுடைய மக்கள்; விண்ணுலகினர்
  rationale: δέξωνται என்ற வினை பன்மை எழுவாயைக் காட்டினாலும், அந்த எழுவாய் யார் என்று கிரேக்க உரை குறிப்பிடவில்லை. குறிப்பிட்ட ஓர் அடையாளத்தைச் சேர்ப்பது அளவுக்கு மீறிய விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘செல்வம்,’ ‘நண்பர்களை ஏற்படுத்திக்கொள்ளுங்கள்,’ ‘வரவேற்க’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தெளிவின்மைகளும் இறையியல் இழுபறிகளும் அடிக்குறிப்புகளால் பாதுகாக்கப்பட்டுள்ளன.
