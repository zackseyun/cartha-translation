source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: ta
  text: அவன், “நூறு பாத்[a] ஆலிவ் எண்ணெய்” என்றான். மேலாளர் அவனிடம், “உன் கடன் ஆவணத்தை[b] எடுத்துக்கொள்; உட்கார்ந்து, விரைவாக ‘ஐம்பது’ என்று எழுது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாத்” என்பது பழங்காலத் திரவ அளவை குறிக்கும் அலகு. கிரேக்க மூலத்தில், “நூறு பாத் ஆலிவ் எண்ணெய்” என்று உள்ளது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “உன் எழுதப்பட்ட ஒப்பந்தம்” அல்லது “உன் ஆவணங்கள்.” கிரேக்கத்தில், “உன் எழுத்துகள்.” இச்சூழலில் இது கடன்பட்டவரின் கடன் ஆவணத்தை அல்லது கடன் பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: பாத்
  rationale: இது பொதுவான ‘அளவு’ அல்ல, பழங்காலத்தில் பயன்படுத்தப்பட்ட குறிப்பிட்ட திரவ அளவை குறிக்கிறது. அலகின் தனித்தன்மையைத் தக்கவைக்க ஒலிபெயர்க்கப்பட்டுள்ளது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐλαίου
  choice: ஒலிவ எண்ணெய்
  rationale: இச்சூழலில் ἔλαιον என்பது ஒலிவ எண்ணெயைக் குறிக்கிறது; ‘எண்ணெய்’ என்பதைவிட இது நவீன வாசகருக்குத் தெளிவானது.
- source_word: Δέξαι
  choice: எடுத்துக்கொள்
  rationale: கடன் ஆவணத்தைத் தன் கையில் எடுத்துக்கொள்ளுமாறு கூறும் கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὰ γράμματα
  choice: உன் கடன் ஆவணம்
  rationale: சொல்லளவில் இது பன்மையான ‘எழுத்துகள்/ஆவணங்கள்’ என்றாலும், கடன் சூழலில் கடன்பட்ட தொகையைப் பதிவு செய்த ஆவணத்தைக் குறிக்கிறது. தமிழில் ஒருமையான ‘கடன் ஆவணம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καθίσας
  choice: உட்கார்ந்து
  rationale: பின்வரும் கட்டளையோடு இணைந்த பங்கேற்புவினையைத் தமிழில் இயல்பான தொடர்வினையாகக் காட்டுகிறது.
- source_word: ταχέως
  choice: விரைவாக
  rationale: செயலை வேகமாகச் செய்ய வேண்டும் என்ற நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: γράψον
  choice: எழுது
  rationale: கடன் ஆவணத்தில் திருத்தப்பட்ட தொகையை எழுதுமாறு கூறும் கட்டளையைச் சேர்த்துரைக்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: πεντήκοντα
  choice: ஐம்பது
  rationale: எண்ணின் நேரடியான தமிழ் இணைச்சொல்.
