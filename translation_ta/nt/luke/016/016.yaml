source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: ta
  text: திருச்சட்டமும் தீர்க்கதரிசிகளும் யோவான் வரையிலும் இருந்தன; அப்போதுமுதல் கடவுளுடைய அரசு நற்செய்தியாக அறிவிக்கப்படுகிறது, ஒவ்வொருவரும் அதற்குள் வலிமுயற்சியுடன் நுழைகிறார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொருவரும் அதற்குள் வலிமையாக நுழைகிறார்கள்.” கிரேக்க வினை வலிமையான அல்லது தீவிரமான இயக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மத்தேயு 11:12-இல் உள்ள ஒத்த கூற்றின் வெளிச்சத்தில், சிலர் இறுதிப் பகுதியை வேறுவிதமாகவும், எதிர்மறையான நுணுக்கத்துடனும் புரிந்துகொள்கிறார்கள். ஆனால் இங்கே கிரேக்க வாக்கியத்தின் எழுவாய் “ஒவ்வொருவரும்”; “அரசு” அல்ல.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: திருச்சட்டம்
  rationale: மோசேயின் சட்டத்தையும் அங்கீகரிக்கப்பட்ட திருமறைப் பிரிவையும் குறிக்கும்; பொதுவான சட்டம் என்ற பொருளிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: οἱ προφῆται
  choice: தீர்க்கதரிசிகளின் நூல்கள்
  rationale: இங்கு தனிப்பட்ட தீர்க்கதரிசிகளை மட்டும் அல்லாமல், ‘திருச்சட்டம்’ என்பதுடன் இணைந்த யூதத் திருமறைப் பிரிவைக் குறிக்கிறது; தமிழில் ‘நூல்கள்’ என்பதைச் சேர்ப்பது இதைத் தெளிவாக்குகிறது.
- source_word: μέχρι Ἰωάννου
  choice: யோவான்வரை
  rationale: இரட்சிப்பு வரலாற்றில் ஒரு கால எல்லையைக் குறிக்கிறது; சூழலில் இவர் திருமுழுக்கு யோவான் என்பது விளங்குகிறது.
- source_word: ἀπὸ τότε
  choice: அப்போதுமுதல்
  rationale: அந்தக் காலப்புள்ளியிலிருந்து தொடரும் மாற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: βασιλεία என்பதிலுள்ள ஆட்சியும் அரசும் சார்ந்த பொருள் வரம்பைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: εὐαγγελίζεται
  choice: நற்செய்தியாக அறிவிக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் εὐαγγελίζω என்பதன் நற்செய்தி அறிவிப்பு சார்ந்த பொருளையும் வெளிப்படையாகக் காக்கிறது.
- source_word: πᾶς
  choice: ஒவ்வொருவரும்
  rationale: ஒருமை வடிவிலுள்ள பகிர்ந்தளிக்கும் பொதுப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτὴν
  choice: அதற்குள்
  rationale: முன்னுள்ள ‘அரசு’ என்பதைக் குறிப்பிட்டு, அதனுள் செல்லும் இயக்கத்தைத் தெரிவிக்கிறது.
- source_word: βιάζεται
  choice: வலிந்து நுழைகிறார்கள்
  rationale: மத்திய/செயப்பாட்டு வடிவின் கடினமான பொருளில், εἰς αὐτήν உடன் வருவதால் அரசுக்குள் தீவிரமாகவும் வலிமுயற்சியுடனும் நுழைவதை முன்னிலைப்படுத்துகிறது; வன்முறை என்ற ஒரே பொருளுக்கு அதைக் குறுக்கவில்லை.
theological_decisions:
- issue: βιάζεται என்பதற்கும் கடவுளுடைய அரசுக்கும் உள்ள உறவு
  choice: மக்கள் கடவுளுடைய அரசுக்குள் தீவிரமாக, வலிந்து நுழைவதாகக் கூறுதல்
  alternative: கடவுளுடைய அரசு வன்முறைக்கு உள்ளாகிறது என்று புரிந்துகொள்ளுதல்
  rationale: இவ்வசனத்தில் βιάζεται என்பதன் இலக்கண எழுவாய் πᾶς (‘ஒவ்வொருவரும்’); εἰς αὐτήν என்பது அரசுக்குள் செல்லும் இயக்கத்தை இயல்பாகச் சுட்டுகிறது. இருப்பினும் வினையின் மத்திய/செயப்பாட்டு வடிவமும் மத்தேயு 11:12-இன் ஒத்த கூற்றும் வேறு புரிதலுக்கு இடமளிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிதில் புரியும் தன்மையும் இணைந்த நடை. ‘திருச்சட்டம்’ மற்றும் ‘தீர்க்கதரிசிகளின் நூல்கள்’ என்பது திருமறைப் பிரிவுகளைத் தெளிவாக்குகிறது. இறுதிக் கூற்றின் உண்மையான கிரேக்கத் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
