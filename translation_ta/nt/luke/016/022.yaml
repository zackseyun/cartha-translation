  source_fidelity: 'மூலத்தின் இரு இணையான நிகழ்வுகளும் துல்லியமாக உள்ளன: ஏழை இறந்தான்; தேவதூதர்களால் ஆபிரகாமின் மடிக்கு எடுத்துச் செல்லப்பட்டான்; செல்வந்தனும் இறந்து அடக்கம் செய்யப்பட்டான். செயலப்பாட்டு வடிவமும், καί-யின் இணைவு வலியுறுத்தலும் ‘செல்வந்தனும்’ என்பதன் மூலம் பாதுகாக்கப்படுகின்றன. லூக்காவுக்குரிய ἐγένετο + infinitive நிகழ்வு-அறிமுக அமைப்பைத் தனியாகச் சொல்லுக்கு-சொல் மொழிபெயர்க்காமல் விட்டிருப்பது நவீனத் தமிழில் இயல்பானது; பொருள் இழப்பில்லை.'
