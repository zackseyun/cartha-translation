id: LUK.16.22
reference: Luke 16:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: ta
  text: அந்த ஏழை இறந்து, தேவதூதர்களால் ஆபிரகாமின் மடிக்கு[a] கொண்டுசெல்லப்பட்டான். செல்வந்தனும் இறந்து அடக்கம் செய்யப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆபிரகாமின் அருகில்.’ கிரேக்கச் சொற்றொடர் சொல்லர்த்தமாக ‘ஆபிரகாமின் மடிக்கு’ என உள்ளது; அது நெருக்கம், கண்ணியம், உறவு ஆகியவற்றைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: அந்த ஏழை இறந்து
  rationale: லூக்காவின் ἐγένετο + infinitive என்ற நிகழ்வை அறிமுகப்படுத்தும் அமைப்பை, தமிழில் செயற்கையான ‘அப்படி நிகழ்ந்தது’ என்பதற்குப் பதிலாக இயல்பான தொடர்வினை அமைப்பில் தருகிறது; δέ-யின் மென்மையான கதைத்தொடர்ச்சி சூழலால் வெளிப்படுகிறது.
- source_word: τὸν πτωχὸν
  choice: அந்த ஏழை
  rationale: πτωχός இங்கு வறிய அல்லது ஆதரவற்ற மனிதனைக் குறிக்கிறது. முந்தைய சூழலில் அறிமுகமான நபர் என்பதால் ‘அந்த ஏழை’ இயல்பாக உள்ளது; ‘பிச்சைக்காரன்’ என இவ்வசனத்துக்கு அப்பாற்பட்ட விவரத்தை இறக்குமதி செய்யவில்லை.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: தேவதூதர்களால் ... கொண்டுசெல்லப்பட்டான்
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவத்தையும், தேவதூதர்களே செயற்பாட்டாளர்கள் என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: ஆபிரகாமின் மடிக்கு
  rationale: κόλπος என்பதன் மார்பு/மடி சார்ந்த நெருக்க உருவகத்தை ‘மடி’ இயல்பான தமிழில் பாதுகாக்கிறது. அருகாமை, கண்ணியம், உறவு ஆகிய உட்பொருள்களை உரையிலேயே முழுமையாக விளக்கி தீர்மானிக்காமல் விடுகிறது.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: செல்வந்தனும் இறந்து
  rationale: καί-யின் ‘கூட/உம்’ பொருளை ‘செல்வந்தனும்’ வெளிப்படுத்தி, இருவருக்கும் ஏற்பட்ட மரணத்தை இணையாகக் காட்டுகிறது. δέ இங்கு தமிழில் தனி எதிர்மறை இணைப்புச்சொல் வேண்டாத மென்மையான தொடர்ச்சியாக உள்ளது.
- source_word: ἐτάφη
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: θάπτω-வின் செயலப்பாட்டுப் பொருளைத் தெளிவாகவும் நவீனத் தமிழில் கண்ணியமாகவும் தருகிறது.
theological_decisions:
- issue: εἰς τὸν κόλπον Ἀβραάμ என்பதன் உருவகப் பொருள்
  choice: ஆபிரகாமின் மடிக்கு
  alternative: ஆபிரகாமின் அருகில்
  rationale: ‘மடி’ என்பது மூலத்தின் உடல்சார்ந்த நெருக்க உருவகத்தைப் பாதுகாக்கிறது; அதை பொதுவான மறுமைநிலைச் சொல்லாக மாற்றி இறையியல் பொருளை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது. தெளிவான கருத்துமொழிபெயர்ப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான கதையுரைப் பாணி. மூலத்தின் சுருக்கமும் இரு மரணங்களுக்கிடையிலான இணைநிலையும் பாதுகாக்கப்பட்டுள்ளன.
