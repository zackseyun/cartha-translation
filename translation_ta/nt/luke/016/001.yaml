reference: Luke 16:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: ta
  text: 'அவர் சீடர்களிடமும் கூறினார்: “செல்வந்தன் ஒருவன் இருந்தான். அவனுக்கு ஒரு வீட்டுப் பொறுப்பாளர்[a] இருந்தான். அந்தப் பொறுப்பாளர் செல்வந்தனின் உடைமைகளை வீணாக்கிவருவதாக செல்வந்தனிடம் குற்றஞ்சாட்டப்பட்டது[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு அல்லது சொத்துத்தொகுதியின் நிர்வாகி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், ஒரு வீடு அல்லது சொத்துகளைக் கவனித்துக்கொள்ளும் பொறுப்பு ஒப்படைக்கப்பட்டவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனைப் பற்றி செல்வந்தனிடம் புகார் தெரிவிக்கப்பட்டது’ அல்லது ‘அவனைப் பற்றி செல்வந்தனிடம் பழிசுமத்தப்பட்டது’ என்றும் மொழிபெயர்க்கலாம். இச்சொல் ஒரு குற்றச்சாட்டையோ பாதகமான தகவலையோ குறிக்கலாம்; குற்றம் நிரூபிக்கப்பட்டது என்று அவசியமாகப் பொருள்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: கூறினார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் இங்கு பின்னணியை அமைக்கும் உரையைக் குறிக்கிறது. தமிழின் இயல்பான கதைநடையில் ‘கூறினார்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது; ‘கூறிக்கொண்டிருந்தார்’ தேவையற்ற நீடித்த செயற்பொருளை உணர்த்தக்கூடும்.
- source_word: δὲ καὶ
  choice: சீடர்களிடமும்
  rationale: δέ குறிக்கும் உரைமாற்றம் நிறுத்தக்குறியாலும் சூழலாலும் வெளிப்படுகிறது; καί என்பதன் ‘கூட/மேலும்’ பொருள் ‘-உம்’ மூலம் காக்கப்படுகிறது.
- source_word: πρὸς τοὺς μαθητάς
  choice: சீடர்களிடம்
  rationale: மூலத்தில் உடைமைப்பெயர் இல்லாததால் ‘தம் சீடர்கள்’ என்று சேர்க்காமல், திசை/பெறுநர் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: செல்வந்தன் ஒருவன் இருந்தான்
  rationale: உவமைக் கதாபாத்திரத்தை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லமைப்பின் குறிப்பற்ற, ஆனால் தனிப்பட்ட நபரைக் குறிக்கும் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: οἰκονόμον
  choice: வீட்டுப் பொறுப்பாளர்
  rationale: ஒரு வீடு அல்லது சொத்துத்தொகுதியின் நிர்வாகம் ஒப்படைக்கப்பட்ட நபரைத் தெளிவாகக் குறிக்கிறது; பொதுவான ‘மேலாளர்’ என்பதைவிட சூழலைச் சிறப்பாக வெளிப்படுத்துகிறது.
- source_word: οὗτος
  choice: அந்தப் பொறுப்பாளர்
  rationale: முன்னர் குறிப்பிடப்பட்ட பொறுப்பாளரை வலியுறுத்திச் சுட்டும் demonstrative-ஐத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: διεβλήθη αὐτῷ
  choice: அவனிடம் குற்றஞ்சாட்டப்பட்டது
  rationale: செல்வந்தனிடம் எதிர்மறையான குற்றச்சாட்டு கொண்டுவரப்பட்டதைப் பிரதிபலிக்கிறது; அது நிரூபிக்கப்பட்ட குற்றம் என்று உரை கூறாததைப் பாதுகாக்கிறது.
- source_word: ὡς διασκορπίζων
  choice: வீணாக்கிவருவதாக
  rationale: குற்றச்சாட்டின் உள்ளடக்கத்தைத் தருகிறது. நிதி/சொத்து சூழலில் ‘சிதறடித்தல்’ என்பதைக் காட்டிலும் ‘வீணாக்குதல்’ இயல்பானது; தொடர்செயல் உணர்வும் காக்கப்படுகிறது.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: அவனுடைய உடைமைகளை
  rationale: செல்வந்தனுக்குச் சொந்தமான பொருட்கள் மற்றும் சொத்துகள் அனைத்தையும் உள்ளடக்கும் பரந்த, இயல்பான சொல்.
theological_decisions:
- issue: குற்றச்சாட்டு உண்மையென உரை உறுதிப்படுத்துகிறதா?
  choice: ‘குற்றஞ்சாட்டப்பட்டது’ என்று மொழிபெயர்த்து, குற்றம் நிரூபிக்கப்பட்டதாகக் கூறவில்லை.
  alternative: ‘அவன் உடைமைகளை வீணாக்கினான் என்று தெரிவிக்கப்பட்டது’
  rationale: διαβάλλω என்பது குற்றஞ்சாட்டுதல், பழிசுமத்துதல் அல்லது பாதகமான தகவலைத் தெரிவித்தல் ஆகிய பொருள்களை ஏற்கக்கூடும். உவமையின் தொடக்கத்திலேயே குற்றத்தைத் தீர்மானமாக நிரூபிக்காமல் மூலத்தின் பதற்றத்தை வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘காரியக்காரன்’ போன்ற பழைய திருச்சபை வழக்குச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. இரு அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் நேரடியாக வைக்கப்பட்டுள்ளன.
