  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: ta
  text: மிகச் சிறிய காரியத்தில்[a] நம்பிக்கைக்குரியவர், மிகப் பெரிய காரியத்திலும் நம்பிக்கைக்குரியவராக இருக்கிறார்; மிகச் சிறிய காரியத்தில் நீதியற்றவர்[b], மிகப் பெரிய காரியத்திலும் நீதியற்றவராக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிக அற்பமானதில்.” கிரேக்கச் சொற்றொடர் அளவில் மிகச் சிறியதையோ முக்கியத்துவம் மிகக் குறைந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நீதியற்றவர்” என்பதற்கு “நேர்மையற்றவர்” அல்லது “நியாயமற்றவர்” என்றும் மொழிபெயர்க்கலாம். சுற்றியுள்ள பகுதியில் பணப் பொறுப்பாண்மை பற்றிய பொருள் இருந்தாலும், கிரேக்கச் சொல் நிதிசார் நேர்மையின்மையைவிட விரிவானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: நம்பிக்கைக்குரியவர்
  rationale: ஒப்படைக்கப்பட்டவற்றைக் கையாள்வதில் நம்பத்தகுந்தவராகவும் உண்மையுள்ளவராகவும் இருப்பதை இச்சூழலில் குறிக்கிறது; வெறுமனே நம்புகிறவர் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: ἐν ἐλαχίστῳ
  choice: மிகச் சிறியதில்
  rationale: ἐν உடன் வரும் வடிவம் செயற்படும் துறை அல்லது சூழலைக் குறிக்கிறது. இது அளவில் அல்லது முக்கியத்துவத்தில் மிகச் சிறியதைச் சுட்டி, πολλῷ உடனான எதிரிணையைப் பேணுகிறது.
- source_word: ἐν πολλῷ
  choice: மிகுதியிலும்
  rationale: அளவு அல்லது பரப்பில் அதிகமானதைச் சுருக்கமாகக் குறித்து, ‘மிகச் சிறியதில்’ என்பதோடு இயல்பான எதிரிணையை உருவாக்குகிறது.
- source_word: ἄδικος
  choice: அநீதியுள்ளவர்
  rationale: இச்சொல் நிதி நேர்மையின்மையை மட்டும் அல்லாமல், விரிவான அநீதி அல்லது தவறான நடத்தையையும் குறிக்கலாம்; ஆகவே சுற்றியுள்ள பொருளாதாரச் சூழலுக்குள் அதைச் சுருக்கவில்லை.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: நம்பிக்கைக்குரியவர் ... அநீதியுள்ளவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடைகளைத் தமிழில் பொதுவான பிரதிநிதி ஒருமையாகவும் பாலினம் குறிப்பிடாமலும் இயல்பாக வழங்குகிறது.
- source_word: καὶ
  choice: -உம் / ;
  rationale: இரு இணையான கூற்றுகளுக்குள் ‘மேலும்/கூட’ என்ற சேர்க்கைப் பொருளை ‘மிகுதியிலும்’ என்பதிலுள்ள -உம் வெளிப்படுத்துகிறது; இரண்டு பிரதான பகுதிகளின் இணைப்பை அரைப்புள்ளி தெளிவாக்குகிறது.
theological_decisions:
- issue: பொறுப்பாண்மைச் சூழலில் ἄδικος என்ற அறநெறிச் சொல்
  choice: அநீதியுள்ளவர்
  alternative: நேர்மையற்றவர்
  rationale: இயேசுவின் கூற்று பணத்தைக் கையாள்வது மட்டுமல்லாத ஒரு பொதுவான அறநெறிக் கோட்பாடாகவும் நிற்கிறது. ‘நேர்மையற்றவர்’ சூழலுக்கு ஏற்றதாயினும், கிரேக்கச் சொல்லின் விரிவான நீதிசார் பொருளைச் சுருக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்க வாக்கியத்தின் சமச்சீர் எதிரிணை—மிகச் சிறியது/மிகுதி, நம்பிக்கைக்குரியது/அநீதியுள்ளது—பேணப்பட்டுள்ளது. அடிக்குறிப்பு [a] தொடர்புடைய சொற்றொடருக்குப் பின்னும் [b] தொடர்புடைய அறநெறிச் சொல்லைக் கொண்ட கூற்றுக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
