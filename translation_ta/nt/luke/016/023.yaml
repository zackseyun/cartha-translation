  source_fidelity: 'திருத்தம் தேவை. வரைவில் கிரேக்கத்தின் ஒரே முக்கிய வினைச்சொல்லான ὁρᾷ இரண்டு முறை வெளிப்படுகிறது: “ஏறெடுத்துப் பார்க்கிறான்” என்றும் பின்னர் “காண்கிறான்” என்றும் வருகிறது. மேலும் ἐν βασάνοις என்பதன் ‘வேதனைகளில் இருக்கையில்’ என்ற நிலைநிலையை “வேதனைக்குள்ளாகி” ஓரளவு நிகழ்வாக மாற்றுகிறது. திருத்தப்பட்ட உரை நிகழ்கால உயிரோட்டத்தையும், பன்மை வேதனைகளையும், தூரத்தையும், ஆபிரகாமோடு லாசரு கொண்டுள்ள நெருக்கமான இடப்படிமத்தையும் காக்கிறது.'
