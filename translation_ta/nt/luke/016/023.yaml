  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: ta
  text: அவன் ஹேடீஸில்[a], வேதனைகளில் இருந்தபடி, தன் கண்களை ஏறெடுத்து, தொலைவில் ஆபிரகாமையும், ஆபிரகாமின் மடியில்[b] லாசருவையும் காண்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதாளத்தில்” அல்லது “இறந்தோரின் உலகத்தில்.” கிரேக்கத்தில் “ஹேடீஸ்”; இது இறுதி நியாயத்தீர்ப்பின் இடத்தைக் குறிக்கப் பயன்படுத்தப்படும் “கெஹென்னா” என்ற சொல்லிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “ஆபிரகாமின் மார்பருகில்”; மரபுவழக்கில், “ஆபிரகாமின் மடியில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: ஹேடீஸில்
  rationale: கிரேக்கச் சொல்லை ஒலிபெயர்த்து, இறுதி நியாயத்தீர்ப்புக்குரிய ‘கெஹென்னா’ என்ற சொல்லோடு இதைக் கலக்காமல் அதன் தனித்தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: தன் கண்களை ஏறெடுத்துப் பார்க்கிறான்
  rationale: கண்களை உயர்த்துதல் என்ற மூலப்படிமத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: வேதனைக்குள்ளாகி
  rationale: கடுமையான துன்ப நிலையில் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்கப் பன்மை தமிழில் நிலைச்சொல்லாக வழங்கப்படுகிறது.
- source_word: ὁρᾷ
  choice: காண்கிறான்
  rationale: கதையோட்டத்தின் உயிரோட்டமான கிரேக்க நிகழ்காலத்தைத் தக்கவைக்கிறது.
- source_word: ἀπὸ μακρόθεν
  choice: தொலைவில்
  rationale: இரு தரப்பினருக்கிடையேயுள்ள இடைவெளியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: அவருடைய மடியில்
  rationale: κόλπος குறிக்கும் மார்பு அல்லது மடியருகேயுள்ள நெருக்கமான இடத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘ஆபிரகாமின் மடி’ என்ற மரபுவழக்கையும் அடையாளம் காண முடிகிறது.
theological_decisions:
- issue: ᾅδης என்பதை இறுதி தண்டனை இடமாகப் புரிந்துகொள்ளச் செய்யும் வகையில் மொழிபெயர்க்கும் அபாயம்
  choice: ஹேடீஸ்
  alternative: பாதாளம்; இறந்தோர் உலகம்; நரகம்
  rationale: மூலத்தின் தனிப்பட்ட கிரேக்கச் சொல்லைப் பாதுகாத்து, அதை ‘கெஹென்னா’ அல்லது இறுதி நியாயத்தீர்ப்புடன் முன்கூட்டியே ஒன்றாக்காமல் விடுகிறது.
- issue: ‘ஆபிரகாமின் மடி’ என்ற உருவகத்தின் பொருள்
  choice: அவருடைய மடியில்
  alternative: ஆபிரகாமின் மார்பருகில்; ஆபிரகாமின் பக்கத்தில்
  rationale: நெருக்கமும் ஆறுதலும் கொண்ட இடப்படிமத்தைத் தக்கவைக்கிறது; விருந்தில் அருகே சாய்ந்திருத்தல் போன்ற சாத்தியமான பின்னணியைத் தேவையின்றி தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஹேடீஸ்’ என்ற ஒலிபெயர்ப்பு மூலச்சொல்லின் இறையியல் வேறுபாட்டைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது. கிரேக்க நிகழ்காலத்தின் கதையோட்ட உயிர்ப்பை ‘பார்க்கிறான்… காண்கிறான்’ என்று தக்கவைத்துள்ளது.
