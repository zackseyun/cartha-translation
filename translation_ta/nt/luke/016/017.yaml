  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: ta
  text: ஆனால், வானமும் பூமியும் ஒழிந்துபோவதைவிட, சட்டத்தில் உள்ள ஓர் எழுத்தின் ஒரு சிறிய கோடு விழுவது எளிது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நுண்குறி”—அதாவது, ஓர் எழுத்தை மற்றோர் எழுத்திலிருந்து வேறுபடுத்தும் மிகச் சிறிய கோடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: எளிது / கடினம் என்ற ஒப்பீட்டு அமைப்பு
  rationale: கிரேக்க ஒப்பீட்டின் பொருளை இயல்பான தமிழில் வெளிப்படுத்த, ‘ஒழிந்துபோவதைவிட ... விழுந்துபோவது கடினம்’ என்ற எதிர்மறை ஒப்பீட்டு அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய சூழலுடன் உள்ள மிதமான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: வானமும் பூமியும்
  rationale: படைப்புலகின் முழுமையைக் குறிக்கும் வேதாகம மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: παρελθεῖν
  choice: ஒழிந்துபோவது
  rationale: இங்கு வெறுமனே கடந்து செல்வதை அல்ல, வானமும் பூமியும் இல்லாமற்போவதைக் குறிக்கிறது.
- source_word: τοῦ νόμου
  choice: சட்டத்திலுள்ள
  rationale: பொதுவான சட்டத்தை அல்லாமல் யூத வேதச்சட்டத்தைக் குறிக்கும் சூழலைத் தக்கவைக்கிறது; தமிழில் தேவையற்ற விளக்கச் சொல்லைச் சேர்க்காமல் ‘சட்டம்’ என வழங்கப்பட்டுள்ளது.
- source_word: μίαν κεραίαν
  choice: ஓர் எழுத்தின் சிறு கோடு
  rationale: எழுத்தின் மிகச் சிறிய முனை அல்லது கோடு என்ற பொருளை, பழமையான சமயச் சொல்லாடல் இன்றி இன்றைய வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: πεσεῖν
  choice: விழுந்துபோவது
  rationale: மூலத்தின் ‘விழுதல்’ என்ற உருவகத்தைப் பாதுகாத்து, சட்டத்தின் மிகச் சிறிய பகுதியும் நீங்கிப்போவதைக் குறிக்கிறது.
theological_decisions:
- issue: νόμος என்பதன் குறிப்பு
  choice: யூத வேதச்சட்டத்தைக் குறிக்கும் ‘சட்டம்’
  alternative: பொதுவான சட்டம்
  rationale: லூக்காவின் உடனடிச் சூழலும் எழுத்தின் மிகச் சிறிய கோட்டைப் பற்றிய குறிப்பும் வேதச்சட்டத்தையே சுட்டுகின்றன; மொழிபெயர்ப்பு இதை அளவுக்கு மீறி விளக்கவில்லை.
- issue: κεραία என்பதன் மொழிபெயர்ப்பு
  choice: ஓர் எழுத்தின் சிறு கோடு
  alternative: நுண்குறி
  rationale: சட்டத்தின் மிகச் சிறிய எழுதப்பட்ட விவரம்கூட நிலைத்திருப்பதை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழைய திருச்சபைச் சொல்லுக்குப் பதிலாக ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டது; சிறு எழுத்துக் கோடு பற்றிய உருவகம் அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது.
