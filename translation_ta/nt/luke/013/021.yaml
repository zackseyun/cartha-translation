id: LUK.13.21
reference: Luke 13:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: ta
  text: அது புளிக்கவைக்கும் மாவைப்[a] போன்றது. ஒரு பெண் அதை எடுத்து, மூன்று சாத்து அளவு[b] மாவுக்குள் மறைத்துவைத்தாள்[c]—மாவு முழுவதும் புளிக்கும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புளிப்பூட்டி’ அல்லது ‘ஈஸ்ட்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மாவைப் புளிக்கச் செய்யும் பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கில் ‘மூன்று சாத்து.’ இது மிகப் பெரிய அளவு மாவைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘மாவுடன் கலந்தாள்’ என்றும் பொருள்பட மொழிபெயர்க்கலாம்; கிரேக்க வினையின் நேரடிப் பொருள் ‘மறைத்தாள்’ அல்லது ‘ஒளித்தாள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: போன்றது
  rationale: உவமையை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ζύμῃ
  choice: புளிக்கவைக்கும் மாவு
  rationale: பண்டைக்காலத்தில் மாவைப் புளிக்கச் செய்த புளித்த மாவுத் துண்டு அல்லது புளிப்பூட்டியை, நவீன வணிக ஈஸ்ட் என்று குறுக்காமல் இயல்பாகக் குறிக்கிறது.
- source_word: λαβοῦσα γυνὴ
  choice: ஒரு பெண் அதை எடுத்து
  rationale: முதன்மை வினைக்கு முந்திய இறந்தகாலப் பங்கேற்பு வினையைத் தமிழில் இயல்பான தொடர் வினையாகக் காட்டுகிறது.
- source_word: ἔκρυψεν
  choice: மறைத்துவைத்தாள்
  rationale: கிரேக்க வினையின் நேரடியான ‘மறைத்தாள்/ஒளித்தாள்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; கலந்தாள் என்று விளக்கமாக மட்டும் மாற்றவில்லை.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: மூன்று சாத்து அளவு மாவுக்குள்
  rationale: σάτα என்ற செமித்திய அளவுப் பெயரை ஒலிபெயர்த்து, அது அளவைக் குறிப்பது என்பதைத் தெளிவாக்குகிறது; εἰς என்பதன் ‘உள்ளே’ என்ற இயக்கத்தையும் காட்டுகிறது.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: மாவு முழுவதும் புளிக்கும்வரை
  rationale: கால எல்லையையும், முழு அளவும் புளித்தது என்ற மொத்தப்படுத்தும் கருத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உவமையில் புளிக்கவைக்கும் மாவின் குறியீட்டுப் பொருள்
  choice: அதன் குறியீட்டை நல்லது அல்லது தீயது என்று மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் நடுநிலையாக வைத்தல்
  alternative: இதைத் தீமையின் குறியீடாகவோ, இறையாட்சியின் வளர்ச்சியை நேரடியாக விளக்கும் நல்ல குறியீடாகவோ மொழிபெயர்ப்பிலேயே வெளிப்படுத்துதல்
  rationale: வசனம் உவமையை மட்டும் முன்வைக்கிறது. வேறு இடங்களில் புளித்த மாவுக்கு உள்ள குறியீட்டுப் பயன்பாடுகளை இங்கே திணிக்காமல், வாசகர் உவமையின் ஊடுருவும் விளைவை உணர இடமளிக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘புளித்தமா’ போன்ற பழமையான சுருக்கச் சொல்லைத் தவிர்த்து, பொதுவாசகர்கள் உடனே புரிந்துகொள்ளும் ‘புளிக்கவைக்கும் மாவு’ பயன்படுத்தப்பட்டுள்ளது. இறுதி கோடு கிரேக்கத்தின் ‘முழுவதும் புளிக்கும்வரை’ என்ற முடிவை வலியுறுத்துகிறது.
