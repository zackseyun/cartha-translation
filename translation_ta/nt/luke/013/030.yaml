id: LUK.13.30
reference: Luke 13:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: ta
  text: இதோ, கடைசியாக இருப்பவர்களில் சிலர் முதலாவார்கள்; முதலாவதாக இருப்பவர்களில் சிலர் கடைசியாவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க இடைச்சொல்லின் உரையாடல் வலிமையை இயல்பான, கண்ணியமான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ἔσχατοι
  choice: கடைசியில் இருக்கும் சிலர்
  rationale: இது ஒழுக்க மதிப்பீடாக ‘தாழ்ந்தவர்கள்’ என்று குறிப்பிடாமல், வரிசை அல்லது நிலையிலுள்ள கடைசி இடத்தைக் குறிக்கிறது. கிரேக்க இருப்புக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்த ‘சிலர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πρῶτοι
  choice: முதலில் இருக்கும் சிலர்
  rationale: ἔσχατοι என்பதற்கு இணையான எதிர்ச்சொல்லாக முதல் இடம் அல்லது முன்னிலையை நேரடியாகக் காட்டுகிறது; ‘சிலர்’ என்பது εἰσὶν என்ற இருப்புக் கூற்றின் வரையறுக்கப்படாத நபர்களை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἳ ἔσονται
  choice: முதலாவார்கள் / கடைசியாவார்கள்
  rationale: எதிர்காலத்தில் நிகழும் நிலைமாற்றத்தைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: καὶ
  choice: ;
  rationale: இரு இணையான, எதிர்மாறான கூறுகளின் நெருக்கமான தொடர்பைத் தமிழில் அரைப்புள்ளி இயல்பாகக் காட்டுகிறது; கிரேக்க καὶ-யின் இணைப்பு வலிமை வாக்கிய அமைப்பில் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: தலைகீழ் மாற்றக் கூற்றின் வரம்பு
  choice: நிலை அல்லது வரிசை தலைகீழாக மாறும் பொதுவான கூற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இது குறிப்பாக யூதர்–பிற இனத்தார், தாழ்மை–பெருமை, அல்லது இறுதித் தீர்ப்பின் தரவரிசை பற்றியது என்று உரையிலேயே விளக்குதல்.
  rationale: சூழல் இறையரசில் நுழைவதைப் பற்றியதாக இருந்தாலும், கிரேக்க வாசகம் மாற்றத்தின் தன்மையைச் சுருக்கமாகவும் விரிவான பொருளுடனும் வைக்கிறது. ஆகவே குறிப்பிட்ட ஒரு விளக்கத்தை மொழிபெயர்ப்பில் திணிக்கவில்லை.
- issue: ‘சிலர்’ என்பதன் பயன்பாடு
  choice: இருப்புக் கூற்றின் இயல்பான தமிழ் வடிவமாக ‘சிலர்’ பயன்படுத்தப்பட்டுள்ளது; இது எல்லாரையும் குறிக்கும் கூற்றாக மாற்றப்படுவதைத் தவிர்க்கிறது.
  alternative: ‘கடைசியில் இருப்பவர்கள் முதலாவார்கள்’ என்று பொதுமைப்படுத்துதல்.
  rationale: εἰσὶν ... οἳ என்ற கிரேக்க அமைப்பு இத்தகைய நபர்கள் இருக்கிறார்கள் என்று கூறுகிறது; குறிப்பிட்ட நிலையில் உள்ள ஒவ்வொருவரைப் பற்றியும் கட்டாயமாகக் கூறவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும், சுருக்கமான, கண்ணியமான மொழிநடை. மூலத்தின் சமச்சீர் எதிர்மறை அமைப்பும் நிகழ்காலத்திலிருந்து எதிர்காலத்திற்கான மாற்றமும் பாதுகாக்கப்பட்டுள்ளன.
