  source_fidelity: கிரேக்க மூலத்தின் எதிர்மறைத் தொடர்பு (πλὴν), அவசியம் (δεῖ), மூன்று-காலத் தொடர், பயணித்தல், மற்றும் எருசலேமுக்கு வெளியே ஒரு தீர்க்கதரிசி அழிவது/இறப்பது பற்றிய சாத்தியமின்மைக் கூற்று ஆகியவை வரைவில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. “மடிவது” ἀπολέσθαι என்பதற்கு சாத்தியமான பொருளாக இருந்தாலும், இச்சூழலில் அது நவீன பொதுத் தமிழில் குறைவாக இயங்குகிறது; “இறப்பது” தெளிவாகவும் இயல்பாகவும் உள்ளது; கொல்லப்படுதலைச் சேர்க்காது.
