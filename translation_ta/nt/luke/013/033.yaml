id: LUK.13.33
reference: Luke 13:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: ta
  text: ஆனாலும், இன்றும் நாளையும் அதற்கு அடுத்த நாளும்[b] நான் தொடர்ந்து செல்ல வேண்டும்; ஏனெனில், ஒரு தீர்க்கதரிசி எருசலேமுக்கு வெளியே இறப்பது சாத்தியமல்ல[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாத்தியமல்ல” என்பதற்கு “நடக்க இயலாது” அல்லது “நினைத்துப் பார்க்க முடியாது” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இன்றும் நாளையும் அதற்கு அடுத்த நாளும்” என்பது மூன்று நாட்காட்டி நாட்களைச் சொற்பொருளில் குறிப்பிடாமல், குறுகியதும் நிர்ணயிக்கப்பட்டதுமான ஒரு செயல்பாட்டுக் காலத்தைக் குறிக்கும் மரபுத்தொடராக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: πλὴν
  choice: ஆனாலும்
  rationale: முந்தைய கூற்றுடன் வலுவான மாறுபாட்டையும் தளராத தொடர்ச்சியையும் இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: δεῖ με
  choice: நான் ... வேண்டும்
  rationale: δεῖ குறிக்கும் கட்டாயம் அல்லது தவிர்க்க முடியாத அவசியத்தை, அதன் காரணத்தை விரிவாகத் தீர்மானிக்காமல் தெளிவாகப் பாதுகாக்கிறது.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: இன்றும் நாளையும் அதற்கு அடுத்த நாளும்
  rationale: மூன்று காலச் சொற்களின் வெளிப்படையான தொடரைத் தக்கவைத்து, தமிழில் இயல்பாக ஒலிக்கிறது; இது சொற்பொருளான மூன்று நாட்களா அல்லது குறுகிய நிர்ணயிக்கப்பட்ட காலத்தைக் குறிக்கும் மரபுத்தொடரா என்பதை அடிக்குறிப்பு திறந்துவைக்கிறது.
- source_word: πορεύεσθαι
  choice: தொடர்ந்து செல்ல
  rationale: செல்லுதல் அல்லது பயணித்தல் என்ற அடிப்படைப் பொருளையும், சூழலில் முன்னேறிச் செல்லும் தொடர்ச்சியையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னர் கூறப்பட்ட அவசியத்திற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ἐνδέχεται
  choice: சாத்தியமல்ல
  rationale: இயலாமை, பொருத்தமின்மை, அல்லது நினைத்துப் பார்க்க முடியாத நிலை ஆகிய கிரேக்கச் சொல்லின் சாத்தியமான நுணுக்கங்களை முழுமையாக ஒன்றாகத் தீர்த்துவிடாமல், அதன் முதன்மையான வலிமையைத் தக்கவைக்கிறது.
- source_word: προφήτην
  choice: ஒரு தீர்க்கதரிசி
  rationale: உறுப்பில்லாத ஒருமையைப் பொதுப்படையான கூற்றாகக் காட்டி, வாக்கியத்தின் பழமொழித் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἀπολέσθαι
  choice: மடிவது
  rationale: இறத்தல் அல்லது அழிந்துபோதல் என்ற பொருளைச் சூழலுக்கேற்ற கண்ணியமான தமிழில் தருகிறது; கொல்லப்படுதல் என்று காரணத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἔξω Ἰερουσαλήμ
  choice: எருசலேமுக்கு வெளியே
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: ஒரு தீர்க்கதரிசி எருசலேமுக்கு வெளியே மடிவது பற்றிய இயேசுவின் கூற்றின் வலிமை
  choice: இயலாமை அல்லது ஆழ்ந்த பொருத்தமின்மையைக் குறிக்கும் வகையில் “சாத்தியமல்ல” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: நையாண்டியை வெளிப்படையாக்கும் வகையில் “ஒரு தீர்க்கதரிசி எருசலேமுக்கு வெளியே மடிவதை நினைத்துக்கூடப் பார்க்க முடியாது” என்று மொழிபெயர்த்தல்.
  rationale: οὐκ ἐνδέχεται என்பது கண்டிப்பான இயலாமையையோ, வழக்கத்திற்கு மாறான பொருத்தமின்மையையோ, நினைத்துப் பார்க்க முடியாத ஒன்றையோ குறிக்கலாம். முதன்மை உரை அந்த இறையியல் மற்றும் சொல்லாட்சிசார் பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கிறது; அடிக்குறிப்பு மாற்று நுணுக்கங்களைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. “ஆனாலும்,” “தொடர்ந்து செல்ல வேண்டும்,” “மடிவது” ஆகியவை இயல்பான ஓட்டத்தையும் மூலத்தின் தீவிரத்தையும் இணைக்கின்றன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு [a] அதன் பொருளுக்குச் சம்பந்தமில்லாத இடத்தில் இருந்ததால், [a] சாத்தியமின்மைக் கூற்றின் அருகிலும் [b] காலச் சொற்றொடரின் அருகிலும் பொருளடிப்படையில் வைக்கப்பட்டுள்ளன.
