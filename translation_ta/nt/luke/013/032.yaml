review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the demonstrative force of ‘that fox,’ the temporal sequence, and the open-ended sense of τελειοῦμαι. However, ‘பேய்கள்’ can commonly suggest ghosts in modern Tamil, whereas δαιμόνια here denotes hostile spirits/demons. ‘தீய ஆவிகள்’ is clearer and more source-specific. The rendering of ἰάσεις ἀποτελῶ is also overly cumbersome in Tamil.
  naturalness: ‘அவர் அவர்களிடம், … என்றார்’ and ‘குணமாக்கும் செயல்களை நிறைவேற்றுகிறேன்’ are awkward for modern standard Tamil. A conventional speech introduction and a more idiomatic expression for performing healings improve readability without materially narrowing the Greek.
  terminology: 'Use ‘தீய ஆவிகளைத் துரத்துகிறேன்’ for exorcism. Render τελειοῦμαι as ‘நிறைவுபெறுகிறேன்’: it is idiomatic Tamil and retains the Greek verb’s completion sense without specifying death, resurrection, or glorification. The note preserves alternatives.'
  issues:
  - severity: medium
    issue: ‘பேய்களை விரட்டுகிறேன்’ is potentially imprecise in modern Tamil.
    rationale: ‘பேய்’ often means a ghost or apparition. In this Gospel exorcism context, δαιμόνια is more clearly conveyed as ‘தீய ஆவிகள்.’
  - severity: low
    issue: The introductory syntax and wording for healings are unnatural.
    rationale: ‘அவர் அவர்களிடம், … என்றார்’ is punctuationally and stylistically incomplete, while ‘குணமாக்கும் செயல்களை நிறைவேற்றுகிறேன்’ is a literal but heavy nominal construction. ‘அவர்களிடம் கூறினார்’ and ‘குணப்படுத்துதல்களைச் செய்கிறேன்’ are natural and retain the two coordinated actions.
  revised_text: 'அவர் அவர்களிடம் கூறினார்: “போய் அந்த நரியிடம், ‘இதோ, நான் இன்றும் நாளையும் தீய ஆவிகளைத் துரத்தி, குணப்படுத்துதல்களைச் செய்கிறேன்; மூன்றாம் நாளில் நான் நிறைவுபெறுகிறேன்[a]’ என்று சொல்லுங்கள்.”'
