source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் கூறினார்: “போய் அந்த நரியிடம், ‘இதோ, நான் இன்றும் நாளையும் தீய ஆவிகளைத் துரத்தி, குணப்படுத்துதல்களைச் செய்கிறேன்; மூன்றாம் நாளில் நான் நிறைவுபெறுகிறேன்[a]’ என்று சொல்லுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் என் இலக்கை அடைகிறேன்,” “நான் பூரணப்படுத்தப்படுகிறேன்,” அல்லது “என் பயணத்தை முடிக்கிறேன்.” கிரேக்கச் சொல் நிறைவுபெறுதல் அல்லது நிறைவுக்குக் கொண்டுவரப்படுதல் என்பதைக் குறிக்கலாம்; இங்கு அது இயேசுவுக்கு நியமிக்கப்பட்ட பணியின் நிறைவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: நரியிடம்
  rationale: சொல்லின் நேரடியான விலங்குப் பொருளைத் தக்கவைத்து, அதன் உருவகமான இகழ்ச்சித் தொனியை விளக்கவுரையாக விரித்துரைக்காமல் பாதுகாக்கிறது. ταύτῃ என்பதன் சுட்டுப்பொருள் ‘அந்த’ என்பதால் வெளிப்படுகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: தொடர்ந்து வரும் கூற்றின்மீது கவனத்தை ஈர்க்கும் இயல்பான, கண்ணியமான தமிழ் உரையாடல் குறியீடு.
- source_word: ἐκβάλλω δαιμόνια
  choice: நான் பேய்களை விரட்டுகிறேன்
  rationale: ἐκβάλλω என்பதன் வலிமையையும் நற்செய்தி நூல்களில் காணப்படும் பேயோட்டும் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἰάσεις ἀποτελῶ
  choice: குணமாக்கும் செயல்களை நிறைவேற்றுகிறேன்
  rationale: ἰάσεις என்ற குணமாக்குதல்களையும் ἀποτελῶ என்ற நிறைவேற்றுதல் அல்லது பலனுக்குக் கொண்டுவருதல் என்ற வினைநுட்பத்தையும் தக்கவைக்கிறது; முந்தைய வினையுடன் ஒன்றாக்குவதில்லை.
- source_word: σήμερον καὶ αὔριον
  choice: இன்றும் நாளையும்
  rationale: சொற்களின் நேரடியான காலப் பொருளையும், குறுகிய ஆனால் நிர்ணயிக்கப்பட்ட காலத்தைச் சுட்டக்கூடிய சொற்றொடரின் நுட்பத்தையும் பாதுகாக்கிறது.
- source_word: τῇ τρίτῃ
  choice: மூன்றாம் நாளில்
  rationale: கிரேக்க மொழியின் காலம் குறிக்கும் வேற்றுமையைத் தெளிவான இயல்பான தமிழில் தருகிறது.
- source_word: τελειοῦμαι
  choice: நான் நிறைவுக்குக் கொண்டுவரப்படுகிறேன்
  rationale: வினையின் செயல்பாட்டு எச்சவினை வடிவைப் பாதுகாத்து, இயேசுவின் நியமிக்கப்பட்ட பணி நிறைவடைவதைக் குறிக்கக்கூடிய திறந்த பொருளையும் தக்கவைக்கிறது; உயிர்த்தெழுதல் அல்லது மகிமைப்படுதல் என்று உரையிலேயே குறிப்பாக்குவதில்லை.
theological_decisions:
- issue: τελειοῦμαι என்பது இயேசுவின் பணியின் நிறைவையும், அவரது மரணம் அல்லது உயிர்த்தெழுதலுக்கான சாத்தியமான குறிப்பையும் எவ்வாறு வெளிப்படுத்துகிறது
  choice: நான் நிறைவுக்குக் கொண்டுவரப்படுகிறேன்
  alternative: நான் என் இலக்கை அடைகிறேன்; நான் நிறைவடைகிறேன்; என் பணியை முடிக்கிறேன்
  rationale: இச்சொல் இயேசுவின் பணி முடிவுறுவதைச் சுட்டலாம்; அது அவரது மரணத்திலும் அதற்குப் பிந்தைய நியாயப்படுத்தலிலும் உச்சமடைவதாகவும் புரிந்துகொள்ளலாம். ஆனால் கிரேக்க உரை இங்கு உயிர்த்தெழுதலை வெளிப்படையாகக் கூறாததால், முதன்மை உரை அந்த இறையியல் நெருக்கடியையும் பொருள் அகலத்தையும் திறந்தபடியே வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘அந்த நரி’ என்ற உருவகம் விளக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது. இறுதிக் கூற்றின் அசல் செயல்பாட்டு வடிவமும் இறையியல் பொருள் அகலமும் சற்றே முறையான ‘நிறைவுக்குக் கொண்டுவரப்படுகிறேன்’ என்ற சொற்றொடரால் தக்கவைக்கப்பட்டுள்ளன.
