base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: ta
  text: 'ஆகவே அவர் தொடர்ந்து கூறினார்: “கடவுளுடைய ராஜ்யம்[a] எதைப் போன்றது? அதை எதற்கு ஒப்பிடுவேன்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய ஆட்சி”; இது ஓர் ஆட்சிப்பரப்பைவிடக் கடவுள் அரசாளுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: தொடர்ந்து கூறினார்
  rationale: இறந்தகாலத் தொடர்நிலை வினையின் தொடரும் உரையாடல் நுணுக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய சூழலிலிருந்து வரும் தொடர்ச்சி அல்லது முடிவுறுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: எதைப் போன்றது?
  rationale: ஒப்புமையைக் கேட்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய ராஜ்யம்
  rationale: வழக்கமான வேதாகமச் சொற்றொடராக இருப்பதோடு, ஆளுகை மற்றும் ஆளப்படும் தளம் ஆகிய இரு பொருள் வாய்ப்புகளையும் முற்றிலும் நீக்காமல் வைத்திருக்கிறது.
- source_word: καὶ
  choice: (இரண்டாவது கேள்வியாகத் தொடரப்பட்டுள்ளது)
  rationale: தமிழில் இரண்டு இணையான கேள்விகளை அடுத்தடுத்து அமைப்பதே இயல்பாக இருப்பதால் தனியான ‘மற்றும்’ தேவையில்லை; இணைப்பு கட்டமைப்பால் வெளிப்படுகிறது.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: அதை எதற்கு ஒப்பிடுவேன்?
  rationale: எதிர்கால வினையின் சிந்தித்துக் கேட்கும் சொல்லாட்சியையும் ஒப்புமை உருவாக்கும் நோக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளுடைய ராஜ்யம்
  alternative: கடவுளுடைய ஆட்சி
  rationale: ‘ராஜ்யம்’ என்பது நிலைபெற்ற வேதாகமப் பயன்பாடு; அது அரசாட்சியின் தளத்தையும் அரசாளுதலையும் உள்ளடக்கக்கூடிய உருவகப் பரப்பைக் காக்கிறது. ‘ஆட்சி’ இயக்கமுள்ள அரசாளுதலைத் தெளிவாக வலியுறுத்தும் மாற்று.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ். ‘ராஜ்யம்’ என்ற நிலைபெற்ற வேதாகமச் சொல்லை வைத்துக்கொண்டு அதன் இயக்கமுள்ள ‘ஆட்சி’ பொருளை அடிக்குறிப்பில் தருகிறது.
