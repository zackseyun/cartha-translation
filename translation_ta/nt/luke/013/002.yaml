id: LUK.13.2
reference: Luke 13:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: ta
  text: 'அவர் அவர்களுக்குப் பதிலளித்துக் கூறினார்: “இந்தக் கலிலேயர்கள் இவற்றை அனுபவித்ததால், மற்ற எல்லாக் கலிலேயர்களைவிட அதிகப் பாவிகளாக ஆனார்கள் என்று நினைக்கிறீர்களா?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: அவர்களுக்குப் பதிலாக ... என்று கேட்டார்
  rationale: கிரேக்க மொழியின் ‘பதிலளித்து கூறினார்’ என்ற தொடரை இயல்பான நவீனத் தமிழில் வழங்குகிறது; கேள்வி வடிவத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους
  choice: மற்ற எல்லாக் கலிலேயர்களையும்விடப் பெரிய பாவிகள்
  rationale: παρά உடன் வரும் ஒப்பீட்டைத் தெளிவாக வெளிப்படுத்துகிறது. ‘பெரிய’ என்பது பாவத்தின் ஒப்பீட்டு அளவைக் குறிக்கிறது; வேறுவகையான பாவிகள் என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: ἐγένοντο
  choice: ஆனார்கள்
  rationale: மூலத்தின் ‘ஆனார்கள்/ஆகினர்’ என்ற நிகழ்வுசார் சொல்லைத் தக்கவைக்கிறது; எளிதாக ‘இருந்தார்கள்’ என்று மாற்றவில்லை.
- source_word: ταῦτα πεπόνθασιν
  choice: இவற்றை அனுபவித்ததால்
  rationale: நிறைவேற்றுக் காலத்தின் தற்போதைய விளைவுடனான அனுபவத்தை இயல்பாகக் கூறுகிறது; சம்பவத்தின் விவரங்களை வசனத்துக்குள் சேர்ப்பதில்லை.
theological_decisions:
- issue: துன்பம் ஒருவரின் அதிகமான பாவத்திற்கான சான்றா என்ற கேள்வி
  choice: இயேசுவின் கேள்வியைத் தீர்ப்பளிக்காமல் அப்படியே வைத்தல்
  alternative: அவர்கள் மற்றவர்களைவிட அதிகப் பாவிகள் அல்ல என்று வசனத்திலேயே விளக்கிச் சேர்த்தல்
  rationale: இந்த வசனம் கேள்வியை முன்வைக்கிறது; அதன் வெளிப்படையான பதில் அடுத்த வசனத்தில் வருகிறது. ஆகவே இங்கு பதிலை முன்கூட்டியே சேர்க்கவில்லை.
- issue: ἐγένοντο என்பதன் பொருள்
  choice: ஆனார்கள்
  alternative: இருந்தார்கள்
  rationale: கிரேக்கச் சொல்லின் இயல்பான இயக்கத்தன்மையைப் பாதுகாக்கிறது; இது அவர்களுடைய துன்பமே அவர்களைப் பாவிகளாக்கியது என்று கட்டாயமாகத் தீர்மானிப்பதில்லை, ஏனெனில் முழுக் கூற்றும் மறுபரிசீலனைக்குரிய கேள்வியாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். கிரேக்க வாக்கிய அமைப்பைச் சொற்சொறாகப் பின்பற்றாமல், அதன் ஒப்பீடு, கேள்வி, மற்றும் ‘ஆனார்கள்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
