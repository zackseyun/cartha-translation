revisions:
- from: அவர் அவர்களுக்குப் பதிலாக, “இந்தக் கலிலேயர்கள் இவற்றை அனுபவித்ததால், மற்ற எல்லாக் கலிலேயர்களையும்விடப் பெரிய பாவிகளாக ஆனார்கள் என்று நினைக்கிறீர்களா?” என்று கேட்டார்.
  to: 'அவர் அவர்களுக்குப் பதிலளித்துக் கூறினார்: “இந்தக் கலிலேயர்கள் இவற்றை அனுபவித்ததால், மற்ற எல்லாக் கலிலேயர்களைவிட அதிகப் பாவிகளாக ஆனார்கள் என்று நினைக்கிறீர்களா?”'
  rationale: The revision corrects the response formula without altering the question’s meaning. It retains “ஆனார்கள்” for ἐγένοντο, retains the causal relationship expressed by ὅτι, and renders the comparative explicitly and naturally. No footnote is required.
