source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: ta
  text: 'ஆனால் ஆண்டவர் அவருக்குப் பதிலளித்துக் கூறினார்: “வெளிவேடக்காரர்களே! உங்களில் ஒவ்வொருவரும் ஓய்வுநாளில் தன் மாட்டையோ கழுதையையோ தீவனத் தொட்டியிலிருந்து[a] அவிழ்த்து, தண்ணீர் கொடுப்பதற்காக அதை அழைத்துச் செல்வதில்லையா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தீவனம் வைக்கும் இடம்.” கிரேக்கச் சொல் கால்நடைகள் உண்பதற்கான இடத்தையோ தொட்டியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: லூக்காவின் கதைசொல்லலில் இயேசுவுக்குப் பயன்படுத்தப்படும் மரியாதையும் கிறிஸ்துவியல் நிறையும் கொண்ட பட்டத்தைத் தக்கவைக்கிறது.
- source_word: Ὑποκριταί
  choice: வெளிவேடக்காரர்களே
  rationale: பன்மை விளிவேற்றுமையில் உள்ள நேரடியான, கடுமையான கண்டனத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἕκαστος ὑμῶν
  choice: உங்களில் ஒவ்வொருவரும்
  rationale: ஒவ்வொரு கேட்பவரையும் தனித்தனியாகச் சுட்டும் பகிர்நிலைப் பொருளைத் தக்கவைக்கிறது.
- source_word: τῷ σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: யூத ஓய்வுநாளைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: λύει
  choice: அவிழ்த்து
  rationale: கட்டப்பட்டுள்ள கால்நடையின் கட்டை அவிழ்ப்பது என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: βοῦν
  choice: மாடு
  rationale: βοῦς குறிக்கும் மாட்டினக் கால்நடையைப் பாலினம் அல்லது பயன்பாடு குறித்து தேவையற்ற குறுக்கீடு இல்லாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ὄνον
  choice: கழுதை
  rationale: நவீனத் தமிழில் நேரடியான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: φάτνης
  choice: தீவனத் தொட்டி
  rationale: கால்நடை கட்டப்பட்டிருக்கும் உணவளிக்கும் இடம் அல்லது தொட்டி என்ற சூழலைத் தெளிவாகவும் காட்சிப்படியாகவும் தருகிறது; சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἀπαγαγὼν
  choice: அதை அழைத்துச் சென்று
  rationale: அவிழ்த்த பிறகு விலங்கை அங்கிருந்து வழிநடத்திச் செல்லும் தொடர்ச்சியான செயலை இயல்பான தமிழில் தருகிறது.
- source_word: ποτίζει
  choice: தண்ணீர் கொடுப்பது
  rationale: விலங்கைக் குடிக்கச் செய்வது அல்லது அதற்குத் தண்ணீர் அளிப்பது என்ற வினையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவுக்குப் பயன்படுத்தப்படும் κύριος என்ற கதைசொல்லல் பட்டம்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு லூக்கா இயேசுவைக் குறிக்கப் பயன்படுத்தும் பட்டத்தின் கிறிஸ்துவியல் நிறையைத் தக்கவைக்கிறது; ‘எஜமான்’ என்பது உறவுநிலை அல்லது சமூக அந்தஸ்தை மட்டும் முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நேரடியான கண்டனத்தின் வலிமை குறையாத வகையிலும் அமைக்கப்பட்டது. கிரேக்கத்தின் வினாவடிவமும் செயல்களின் வரிசையும் தக்கவைக்கப்பட்டுள்ளன.
