language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: ta
  text: அவர்கள் கிழக்கிலிருந்தும் மேற்கிலிருந்தும், வடக்கிலிருந்தும் தெற்கிலிருந்தும் வருவார்கள்; தேவனுடைய அரசாட்சியில் விருந்தில் சாய்ந்து அமர்வார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விருந்தில் அமர்வார்கள்.’ கிரேக்கச் சொல் இன்னும் குறிப்பாக, விருந்துண்பதற்காகச் சாய்ந்து அமரும் அக்கால வழக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: அவர்கள் … வந்து … அமர்வார்கள்
  rationale: ἥκω என்பதன் எதிர்கால வடிவம் இங்கு ‘வருவார்கள்’ என்ற பொருளைத் தருகிறது. தமிழில் தொடர்ந்து வரும் பிரதான வினையுடன் இயல்பாக இணைக்க ‘வந்து’ என வழங்கப்பட்டுள்ளது.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: கிழக்கிலிருந்தும் மேற்கிலிருந்தும்
  rationale: சொல்லர்த்தத்தில் ‘சூரிய உதயங்களிலிருந்தும் அஸ்தமனங்களிலிருந்தும்’ என இருந்தாலும், இது திசைகளைக் குறிக்கும் கிரேக்க மரபுத்தொடர்; தமிழில் இயல்பான திசைப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: வடக்கிலிருந்தும் தெற்கிலிருந்தும்
  rationale: ἀπό என்பதன் ‘இலிருந்து’ என்ற திசை/தொடக்க இடப் பொருளையும் நான்கு திசைகளின் பரப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀνακλιθήσονται
  choice: விருந்துண்ணச் சாய்ந்து அமர்வார்கள்
  rationale: ἀνακλίνω விருந்து சூழலில் உண்பதற்காகச் சாய்ந்து அமர்வதைக் குறிக்கிறது. ‘அமர்வார்கள்’ என்று மட்டும் பொதுமைப்படுத்தாமல், அக்கால விருந்துப் படிமம் புரியுமாறு வழங்கப்பட்டுள்ளது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: தேவனுடைய அரசில்
  rationale: βασιλεία τοῦ θεοῦ என்ற சொற்றொடரின் ஆட்சி/அரசு சார்ந்த இறையியல் பொருளைச் சுருக்கமான, நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதிக்கால அரசின் விருந்துப் படிமம்
  choice: ‘விருந்துண்ணச் சாய்ந்து அமர்வார்கள்’ என்று உணவு விருந்தின் காட்சியைத் தக்கவைத்தல்
  alternative: ‘அமர்வார்கள்’ அல்லது ‘இடம்பெறுவார்கள்’
  rationale: வசனம் தேவனுடைய அரசில் பங்கேற்பதை விருந்தின் தெளிவான காட்சியால் சித்தரிக்கிறது. பொதுவான வினையால் அந்தப் படிமத்தை மறைக்காமல், கூடுதல் கோட்பாட்டு விளக்கமும் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: நான்கு திசைகளிலிருந்தும் வருவோரின் பரந்த அளவு
  choice: கிழக்கு, மேற்கு, வடக்கு, தெற்கு என நேரடியாக வழங்குதல்
  alternative: ‘எல்லா நாடுகளிலிருந்தும் புறவினத்தார் வருவார்கள்’ என்று விளக்குதல்
  rationale: கிரேக்க உரை பரந்த புவியியல் திரட்டலைக் காட்டுகிறது; ஆனால் இவ்வசனத்தில் இனத்தையோ மக்கள் பிரிவையோ வெளிப்படையாகப் பெயரிடவில்லை. எனவே அந்தத் திறந்த பரப்பை அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருந்துண்ணச் சாய்ந்து அமர்வார்கள்’ என்பது இன்றைய தமிழ் வாசகருக்கு அந்நியமாகத் தோன்றக்கூடிய பழங்கால விருந்து முறையைத் தெளிவுபடுத்துகிறது; அடிக்குறிப்பு இயல்பான மாற்று வாசகத்தையும் தருகிறது.
