revisions:
- from: அவர்கள் கிழக்கிலிருந்தும் மேற்கிலிருந்தும், வடக்கிலிருந்தும் தெற்கிலிருந்தும் வந்து, தேவனுடைய அரசில் விருந்துண்ணச் சாய்ந்து அமர்வார்கள்[a].
  to: அவர்கள் கிழக்கிலிருந்தும் மேற்கிலிருந்தும், வடக்கிலிருந்தும் தெற்கிலிருந்தும் வருவார்கள்; தேவனுடைய அரசாட்சியில் விருந்தில் சாய்ந்து அமர்வார்கள்[a].
