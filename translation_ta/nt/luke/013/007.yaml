reference: Luke 13:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: ta
  text: பின்பு அவர் திராட்சைத்தோட்டப் பணியாளரிடம், “இதோ, மூன்று ஆண்டுகளாக இந்த அத்திமரத்தில் கனியைத் தேடி வருகிறேன்; ஒன்றும் கிடைக்கவில்லை. இதை வெட்டிப்போடு. இது நிலத்தையும் ஏன் வீணாக்கிக்கொண்டிருக்க வேண்டும்?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது மண்ணையும் ஏன் பயனற்றதாக்க வேண்டும்?” கிரேக்க வினைச்சொல், வெறுமனே இடத்தைப் பிடித்துக்கொள்வதை மட்டுமல்லாமல் நிலத்தை விளைச்சலற்றதாக ஆக்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: திராட்சைத்தோட்டப் பணியாளர்
  rationale: திராட்சைத்தோட்டத்தைப் பராமரித்துப் பயிரிடுபவரைக் குறிக்கும் சொல்லின் துல்லியத்தைப் பேணுகிறது; பொதுவான ‘தோட்டக்காரர்’ என்பதைக் காட்டிலும் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தும் இயல்பான, கண்ணியமான நவீனத் தமிழ் வடிவம்.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: மூன்று ஆண்டுகளாக
  rationale: கடந்த காலத்தில் தொடங்கி இப்போது வரை நீடிக்கும் கால அளவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἔρχομαι ζητῶν
  choice: தேடி வருகிறேன்
  rationale: மூன்று ஆண்டுகளாகத் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த தேடலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καρπὸν
  choice: கனி
  rationale: உவமையின் நேரடியான வேளாண் படிமத்தைப் பேணுகிறது.
- source_word: συκῇ
  choice: அத்திமரம்
  rationale: சொல்லின் வழக்கமான, துல்லியமான பொருள்.
- source_word: οὐχ εὑρίσκω
  choice: ஒன்றும் கிடைக்கவில்லை
  rationale: தொடர்ந்து தேடியும் இதுவரை கனி கிடைக்காத நிலையை இயல்பான தமிழில் சுருக்கமாகக் கூறுகிறது.
- source_word: ἔκκοψον αὐτήν
  choice: இதை வெட்டிப்போடு
  rationale: மரத்தை வெட்டி அகற்றும்படியான நேரடிக் கட்டளையைத் தெளிவாகத் தருகிறது.
- source_word: καὶ τὴν γῆν καταργεῖ
  choice: நிலத்தையும் வீணாக்கிக்கொண்டிருக்க வேண்டும்
  rationale: கனி தராத மரம் நிலத்தைப் பயனின்றி ஆக்குவது அல்லது அதன் வளத்தைப் பயன்படுத்திக்கொண்டிருப்பது ஆகிய சூழல்சார் பொருள்களை வாசிக்க இடமளிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உவமைப் படிமமா அல்லது வெளிப்படையான இறையியல் விளக்கமா
  choice: வேளாண் மொழியை அப்படியே தக்கவைத்தல்
  alternative: ஆவிக்குரிய கனியின்மையை மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்குதல்
  rationale: மூலவசனம் உவமையின் வேளாண் படிமத்தையே வழங்குகிறது; அதன் இறையியல் பொருளை மொழிபெயர்ப்புக்குள் சேர்க்காமல், சூழலிலிருந்து புரிந்துகொள்ள விடுவது பொருத்தமானது.
- issue: καταργεῖ என்பதன் பொருள் நுட்பம்
  choice: நிலத்தை வீணாக்கிக்கொண்டிருத்தல்
  alternative: மண்ணைப் பயனற்றதாக்குதல்
  rationale: வினைச்சொல் நிலத்தை வெறுமனே பிடித்திருப்பதையும் அதன் விளைச்சல் திறனைப் பயனற்றதாக்குவதையும் குறிக்கக்கூடும். முதன்மை உரை இயல்பான தமிழில் நடைமுறை விளைவைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திராட்சைத்தோட்டப் பணியாளர்’ மூலச்சொல்லின் தொழில் மற்றும் சூழலைப் பேணுகிறது. நேரடி உரையில் இயல்பான பேச்சுத் தன்மை இருக்கும்படியும், உவமையின் இறையியல் விளக்கம் மொழிபெயர்ப்பில் முன்கூட்டியே சேர்க்கப்படாதபடியும் வடிவமைக்கப்பட்டுள்ளது.
