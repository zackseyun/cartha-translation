reference: Luke 13:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: ta
  text: எருசலேமே, எருசலேமே, தீர்க்கதரிசிகளைக் கொல்கிறவளே, தன்னிடம் அனுப்பப்பட்டவர்களைக் கல்லெறிகிறவளே[a]—ஒரு கோழி தன் குஞ்சுகளைத் தன் சிறகுகளின்கீழ் சேர்த்துக்கொள்வதுபோல[b], உன் பிள்ளைகளைச் சேர்த்துக்கொள்ள எத்தனை முறை நான் விரும்பினேன்! ஆனால் நீங்களோ விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீர்க்கதரிசிகளைக் கொல்பவளே, தன்னிடம் அனுப்பப்பட்டவர்களைக் கல்லெறிபவளே’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிகழ்காலப் பெயரெச்சங்கள், கடவுளின் தூதர்களை எருசலேம் வழக்கமாக நடத்தும் விதத்தைச் சித்தரிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரு பறவை தன் குஞ்சுகளை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க ὄρνις என்பது பொதுவாகப் ‘பறவை’ எனவும் பொருள்படும்; ஆனால் குஞ்சுகளைச் சிறகுகளின்கீழ் சேர்க்கும் தாய்ப்பறவை உருவகத்தில் ‘கோழி’ என்பது இயல்பான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: எருசலேமே, எருசலேமே
  rationale: இடப்பெயரின் இரட்டிப்பையும், புலம்பலும் வலியுறுத்தலும் நிறைந்த நேரடி அழைப்பையும் இயல்பான தமிழ் விளிவேற்றுமையுடன் காக்கிறது.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: தீர்க்கதரிசிகளைக் கொன்று ... கல்லெறிகிறவளே
  rationale: நிகழ்காலப் பெயரெச்சங்கள் எருசலேமின் வழக்கமான செயல்பாட்டை உயிரோட்டமாகச் சித்தரிக்கின்றன. நகரம் பெண்பால் உருவகத்தில் அழைக்கப்படுவதால் ‘கிறவளே’ பொருந்துகிறது.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: தன்னிடம் அனுப்பப்பட்டவர்களை
  rationale: முற்றுப்பெற்ற செயப்பாட்டு பெயரெச்சத்தின் செயப்பாட்டு பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது; அனுப்பியவர் யார் என்பதை மொழிபெயர்ப்பு கூடுதலாகக் குறிப்பிடவில்லை.
- source_word: ποσάκις ἠθέλησα
  choice: எத்தனை முறை நான் விரும்பினேன்
  rationale: புலம்பலின் உணர்ச்சியையும், θέλω வெளிப்படுத்தும் விருப்பம் அல்லது சித்தத்தின் கருத்தையும் நேரடியாகக் காக்கிறது.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: உன் பிள்ளைகளைச் சேர்த்துக்கொள்ள
  rationale: நகரத்தைத் தாயாக உருவகப்படுத்தும் ‘உன் பிள்ளைகள்’ என்ற திறந்த குறிப்பைத் தக்கவைத்து, வினையின் ஒன்றுசேர்த்தல் உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: ஒரு கோழி தன் குஞ்சுகளை
  rationale: ὄρνις பொதுவாகப் பறவையையும் குறிக்கலாம்; ஆனால் தன் இளங்குஞ்சுகளைச் சிறகுகளின்கீழ் சேர்க்கும் தாய்ப்பறவை உருவகத்தில் ‘கோழி’ இயல்பாகவும் தெளிவாகவும் உள்ளது. νοσσιάவின் கூட்டுப் பொருள் தமிழில் ‘குஞ்சுகள்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ஆனால் நீங்களோ விரும்பவில்லை
  rationale: கிரேக்கத்தில் உள்ள பன்மை வினையை ‘நீங்கள்’ என்று வெளிப்படையாகக் காத்து, இயேசுவின் விருப்பத்திற்கும் மக்களின் மறுப்பிற்கும் இடையிலான முரண்பாட்டைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘உன் பிள்ளைகள்’ என்பதன் குறிப்பு
  choice: நகரவாசிகள், இஸ்ரயேல் மக்கள், அல்லது இயேசு சேர்க்க விரும்பிய குறிப்பிட்டவர்கள் என்று வரையறுக்காமல் ‘உன் பிள்ளைகள்’ என உருவகத்தைப் பேணுதல்
  alternative: ‘எருசலேமின் குடிமக்கள்’ அல்லது ‘இஸ்ரயேல் மக்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் எருசலேமைத் தாய்-நகரமாக உருவகப்படுத்தி அதன் ‘பிள்ளைகள்’ என்று மட்டுமே கூறுகிறது. குறிப்பின் எல்லையை மொழிபெயர்ப்பு தன்னிச்சையாகக் குறுக்கவில்லை.
- issue: θέλω / ἠθελήσατε ஆகியவற்றின் சித்தம் சார்ந்த முரண்பாடு
  choice: ‘நான் விரும்பினேன் ... நீங்களோ விரும்பவில்லை’
  alternative: ‘நான் சித்தங்கொண்டேன் ... நீங்கள் சித்தங்கொள்ளவில்லை’ அல்லது விருப்பத்தைத் தாண்டிய கோட்பாட்டு விளக்கம்
  rationale: மூலத்தில் வெளிப்படும் விருப்பம் மற்றும் மனித மறுப்பு ஆகிய இரண்டையும் காக்கிறது; இறைச்சித்தம் குறித்த விரிவான கோட்பாட்டு முடிவை வசனத்திற்குள் சேர்க்கவில்லை.
- issue: ஒருமை நகர அழைப்பிலிருந்து பன்மை மறுப்புக்கான மாற்றம்
  choice: ‘எருசலேமே ... உன் ... நீங்களோ’ என்று இலக்கண மாற்றத்தை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: இறுதியில் ‘நீயோ விரும்பவில்லை’ என்று ஒருமைப்படுத்துதல்
  rationale: மூலத்தில் எருசலேம் ஒருமையில் அழைக்கப்பட்டாலும் இறுதி வினை இரண்டாம் நபர் பன்மையில் உள்ளது. அந்தத் திடீர் மாற்றம் விளக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எருசலேமே’ என்ற இரட்டிப்பு அழைப்பு, நீண்ட உருவக வாக்கியம், இறுதி மறுப்பின் எதிர்மறை வலியுறுத்தல் ஆகியவை பேச்சோட்டத்துடன் காக்கப்பட்டுள்ளன. ஒருமை ‘உன்’ என்பதிலிருந்து பன்மை ‘நீங்கள்’ என்பதற்கான மூலத்தின் மாற்றம் திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது.
