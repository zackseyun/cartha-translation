  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: ta
  text: அல்லது, சீலோவாமில் இருந்த கோபுரம் விழுந்து கொன்ற அந்தப் பதினெட்டுப் பேரே, எருசலேமில் வசிக்கும் எல்லா மக்களைவிட அதிகக் கடன்பட்டவர்களாக ஆனார்கள் என்று நினைக்கிறீர்களா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடன்பட்டவர்கள்” என்பதற்கு “பாவிகள்” அல்லது “அதிகக் குற்றமுள்ளவர்கள்” என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொல் நேரடியாகக் கடன்பட்டவர்களைக் குறித்தாலும், இங்கு ஒழுக்கக் குற்றப்பொறுப்பைக் குறிக்கும் உருவகமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய எடுத்துக்காட்டைத் தொடர்ந்து மற்றொரு எடுத்துக்காட்டை அறிமுகப்படுத்தும் வினாவை நேரடியாகக் காட்டுகிறது.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: அந்தப் பதினெட்டுப் பேரும்
  rationale: பாலினத்தைக் கிரேக்க மூலத்தைவிடக் குறுக்காமல், குறிப்பிட்ட பதினெட்டு நபர்களை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: சீலோவாமிலிருந்த கோபுரம் ... விழுந்து
  rationale: கோபுரம் ‘விழுந்தது’ என்ற மூலத்தின் நேரடியான படிமத்தைப் பேணுகிறது; இடப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: ἀπέκτεινεν αὐτούς
  choice: அவர்களைக் கொன்றதோ
  rationale: விபத்தின் விளைவைக் கூறும் எளிய, இயல்பான தமிழ்; நீதித்தீர்ப்புச் சார்ந்த கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: δοκεῖτε ὅτι
  choice: என்று நினைக்கிறீர்களா?
  rationale: இயேசுவின் நேரடியான சவால்மிக்க வினாவை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὀφειλέται ἐγένοντο
  choice: கடன்பட்டவர்களாக ஆனார்கள்
  rationale: ὀφειλέται என்பதன் கடன் உருவகத்தையும் ἐγένοντο என்பதன் ‘ஆனார்கள்’ என்ற இயக்கப் பொருளையும் பேணுகிறது; சூழலில் இது ஒழுக்கக் குற்றப்பொறுப்பைக் குறிக்கலாம்.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: மற்ற எல்லாரையும்விட அதிக
  rationale: παράவின் ஒப்பீட்டுப் பொருளை இயல்பான தமிழில் காட்டுகிறது; ἀνθρώπους இங்கு எருசலேம் குடியிருப்போரைக் பொதுவாகக் குறிப்பதால் பாலினம் உள்ளிடப்படவில்லை.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: எருசலேமில் குடியிருந்த
  rationale: குடியிருப்போர் என்ற தொடர்ச்சியான வசிப்பைச் சுருக்கமான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: இச்சூழலில் ὀφειλέται என்பதன் பொருள்
  choice: கடன்பட்டவர்கள்
  alternative: பாவிகள்; அதிகக் குற்றமுள்ளவர்கள்
  rationale: முந்தைய வசனத்தின் ‘பாவிகள்’ என்ற சொல்லிலிருந்து லூக்கா இங்கு வேறுபட்ட சொல்லைப் பயன்படுத்துகிறார். ‘கடன்பட்டவர்கள்’ என்பது ஒழுக்க அல்லது இறைமுன் குற்றப்பொறுப்பு என்ற உருவகத்தைப் பேணி, பொருளை ஒரே விளக்கமாகச் சுருக்காமல் விடுகிறது.
- issue: ἀνθρώπους என்பதன் பொதுப்பொருள்
  choice: எல்லாரும்
  alternative: எல்லா மனிதர்களும்
  rationale: இங்கு எருசலேமில் குடியிருந்த மக்களைப் பொதுவாகக் குறிக்கிறது; தமிழில் ‘எல்லாரும்’ இயல்பாகவும் பாலினத்தைத் தேவையின்றி வரையறுக்காமலும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைந்துள்ளது. ‘கடன்பட்டவர்கள்’ என்ற மூல உருவகம் பிரதான உரையில் வைக்கப்பட்டு, சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
