  source_fidelity: 'The Tamil accurately represents the sequence in the Greek: Jesus sees the woman, calls/addresses her, and declares her release. “நீ விடுவிக்கப்பட்டிருக்கிறாய்” appropriately conveys the perfect passive ἀπολέλυσαι as a completed release with continuing effect. “உன் பலவீனத்திலிருந்து” preserves the deliberately broad sense of ἀσθένεια without imposing a specific diagnosis.'
  naturalness: The wording is clear, idiomatic modern standard Tamil with an appropriately respectful biblical register. “அவளை அழைத்து” naturally conveys Jesus’ initiating address without asserting more precisely than the Greek that she physically came over.
  terminology: “பெண்ணே” is a direct Tamil vocative corresponding to Γύναι and is suitable in this context. “பலவீனம்” is a sound broad equivalent for ἀσθένεια; the footnote responsibly identifies contextual alternatives. The footnote marker is correctly anchored to the term it explains.
