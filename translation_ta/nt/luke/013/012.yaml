id: LUK.13.12
reference: Luke 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: ta
  text: இயேசு அவளைப் பார்த்தபோது, அவளை அழைத்து, “பெண்ணே, உன் பலவீனத்திலிருந்து[a] நீ விடுவிக்கப்பட்டிருக்கிறாய்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலவீனம்’ என்பதற்குப் பதிலாக, “உடல்நலக் குறைவிலிருந்து” அல்லது “நோயிலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: இயேசு அவளைப் பார்த்தபோது
  rationale: இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. δέ இங்கு கதையின் நகர்வைக் குறிக்கிறது; தனியாக ‘ஆனால்’ என்று மொழிபெயர்த்தால் தேவையற்ற வலுவான முரண்பாடு தோன்றும்.
- source_word: προσεφώνησεν
  choice: அவளை அழைத்து
  rationale: அவளை நோக்கிக் கூப்பிட்டார் அல்லது நேரடியாக அழைத்தார் என்ற பொருளை இயல்பான தமிழில் தருகிறது; அவள் கட்டாயம் அவரிடம் நெருங்கிவந்தாள் என்று மிகையாகக் குறிப்பிடவில்லை.
- source_word: Γύναι
  choice: பெண்ணே
  rationale: மரியாதையுடன் நேரடியாக அழைக்கும் கிரேக்க விளியைச் சுருக்கமாகவும் பொருள் சேர்க்காமலும் பிரதிபலிக்கிறது.
- source_word: ἀπολέλυσαι
  choice: நீ விடுவிக்கப்பட்டிருக்கிறாய்
  rationale: நிறைவேற்றப்பட்ட விடுதலையும் அதன் தற்போதைய விளைவையும் குறிக்கும் நிறைவு காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: τῆς ἀσθενείας σου
  choice: உன் பலவீனத்திலிருந்து
  rationale: ἀσθένεια என்பதன் விரிவான பொருள் வரம்பைப் பாதுகாக்கிறது; சூழலில் உடல் சார்ந்த பாதிப்பு இருந்தாலும் குறிப்பிட்ட மருத்துவ நோயறிதலைத் திணிக்கவில்லை.
theological_decisions:
- issue: பெண்ணின் நிலையை ἀσθένεια எவ்வாறு விவரிக்கிறது
  choice: ‘பலவீனம்’ என்ற விரிவான சொல்லைப் பயன்படுத்துதல்
  alternative: ‘நோய்’, ‘உடல்நலக் குறைவு’ அல்லது ‘உடல் இயலாமை’
  rationale: சூழல் உடலைப் பாதித்த நிலையைக் காட்டினாலும், கிரேக்கச் சொல் நோய், பலவீனம், உடல் நலக்குறைவு ஆகிய பொருள்களை ஏற்கக்கூடும். நவீன மருத்துவ அல்லது மாற்றுத்திறன் வகைப்பாட்டை வசனத்தில் சேர்க்காமல் அந்தத் திறந்த பொருளை இத்தேர்வு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘விடுவிக்கப்பட்டிருக்கிறாய்’ என்பது சற்றே முறையான அமைப்பாக இருந்தாலும், கிரேக்க நிறைவு காலச் செயப்பாட்டின் முடிந்த செயலும் தொடரும் நிலையும் இரண்டையும் தெளிவாகக் காக்கிறது.
