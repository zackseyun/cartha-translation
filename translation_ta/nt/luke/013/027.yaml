source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: ta
  text: அவர் உங்களிடம், ‘நீங்கள் எங்கிருந்து வந்தவர்கள் என்று எனக்குத் தெரியாது. அநீதியைச் செய்கிற நீங்கள் அனைவரும் என்னைவிட்டு விலகிப்போங்கள்’ என்று கூறுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: ‘அநியாயத்தைச் செய்கிற நீங்கள் அனைவரும்’ அல்லது ‘தீச்செயல் புரிகிற நீங்கள் அனைவரும்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: அவர் உங்களிடம் … என்று கூறுவார்
  rationale: ἐρεῖ என்பதுடன் வந்துள்ள λέγων என்ற பொருள்மீளும் பங்கேற்புவினையைத் தமிழில் தனியே இருமுறை மொழிபெயர்க்காமல், நேரடி உரையை அறிமுகப்படுத்தும் இயல்பான ஒரே தொடராக வழங்குகிறது.
- source_word: οἶδα
  choice: எனக்குத் தெரியாது
  rationale: அறிதல் அல்லது அங்கீகரித்தல் மறுக்கப்படுகிற சூழல் நிழலைத் தீர்மானமாக விளக்காமல், οἶδα என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: πόθεν ἐστέ
  choice: நீங்கள் எங்கிருந்து வந்தவர்கள்
  rationale: πόθεν குறிக்கும் தோற்றம் அல்லது வருகையின் மூலத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: என்னைவிட்டு விலகிப்போங்கள்
  rationale: தீர்மானமான பிரிவைக் கட்டளையிடும் வினையின் வலிமையை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: πάντες ἐργάται ἀδικίας
  choice: அநீதியைச் செய்கிற நீங்கள் அனைவரும்
  rationale: πάντες என்பதன் முழுமையையும், ἐργάται என்பதன் செயலில் ஈடுபடுகிறவர்கள் என்ற உணர்வையும், ἀδικία என்பதன் நீதியின்மை சார்ந்த பரந்த நெறிப்பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சொல்லில் ἀδικίας என்பதன் பொருள்
  choice: அநீதி
  alternative: அநியாயம்; தீச்செயல்; சட்டமீறல்
  rationale: ἀδικία என்பது நீதியின்மை, அநியாயம், தவறான செயல் ஆகியவற்றைக் குறிக்கலாம். ‘அநீதி’ என்பது அதன் பரந்த நெறி வலிமையையும் δικαιοσύνη என்ற சொற்குடும்பத்துடனான எதிர்மறைத் தொடர்பையும் காக்கிறது; ‘சட்டமீறல்’ என்று மொழிபெயர்த்து νόμος சார்ந்த குறிப்பிட்ட கருத்தைத் தேவையின்றி புகுத்துவதையும் தவிர்க்கிறது.
- issue: ‘எனக்குத் தெரியாது’ என்பதன் உறவுசார் நிழல்
  choice: நேரடியான அறிதல் மறுப்பாகவே வைக்கப்பட்டது
  alternative: ‘நான் உங்களை ஏற்றுக்கொள்ளவில்லை’ அல்லது ‘உங்களை அடையாளம் காணவில்லை’
  rationale: சூழலில் உறவு அல்லது அங்கீகார மறுப்பு உட்பொருளாக இருக்கலாம்; ஆனால் οἶδα என்ற சொல்லை விளக்கவுரையாக விரிவுபடுத்தாமல் மூலத்தின் இறுக்கத்தையும் பலபொருள் வாய்ப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடி உரையின் எடையையும் நியாயத்தீர்ப்பின் தீவிரத்தையும் காக்கும் கண்ணியமான நடை. பொருள்மீளும் கிரேக்கச் சொல்லமைப்பு தமிழில் இயல்பாக ஒருங்கிணைக்கப்பட்டுள்ளது.
