  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: ta
  text: இல்லை, நான் உங்களுக்குச் சொல்கிறேன்; ஆனால் நீங்கள் மனந்திரும்பாவிட்டால், நீங்கள் எல்லாரும் அவ்வாறே[a] அழிந்துபோவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதே விதத்தில் அழிந்துபோவீர்கள்.” முந்தைய நிகழ்வுகளின் பின்னணியில், கிரேக்கச் சொல் ஒத்த வகையான தீர்ப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: இல்லை
  rationale: முந்தைய சூழலில் உட்குறிப்பாக எழும் கேள்விக்கு இயேசு அளிக்கும் நேரடியான, வலியுறுத்தப்பட்ட மறுப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: லூக்காவில் வழக்கமாக வரும் கூற்றைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: ஆனால் ... ஆவிட்டால்
  rationale: எதிர்மறையான நிபந்தனையுடன் வரும் வலுவான திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: μετανοῆτε
  choice: நீங்கள் மனந்திரும்பாவிட்டால்
  rationale: வெறும் எண்ணமாற்றம் அல்லது வருத்தம் என்று குறுக்காமல், கடவுளுக்கு முன்பான மனந்திரும்புதலின் முழு வேதாகமச் சுமையையும் தக்கவைக்கிறது.
- source_word: πάντες
  choice: நீங்கள் எல்லாரும்
  rationale: எச்சரிக்கை கேட்போர் அனைவரையும் உள்ளடக்குகிறது என்பதை வெளிப்படையாகக் காட்டுகிறது.
- source_word: ὡσαύτως
  choice: அவ்வாறே
  rationale: முந்தைய நிகழ்வுகளோடு ஒப்புமையைத் தக்கவைக்கிறது; அந்த ஒப்புமை முறை, உறுதி, அல்லது வேறு அம்சத்தையா குறிக்கிறது என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: ἀπολεῖσθε
  choice: அழிந்துபோவீர்கள்
  rationale: வெறும் உடல் மரணம் என்று குறுக்காமல், அழிவு அல்லது நாசம் என்ற கடுமையான எச்சரிக்கையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் எச்சரிக்கையில் μετανοῆτε என்பதன் பொருள்
  choice: மனந்திரும்புதல்
  alternative: மனதை மாற்றுதல்; திரும்புதல்
  rationale: இது வெறும் அறிவுசார் எண்ணமாற்றமோ உணர்ச்சிசார் வருத்தமோ என்று வரையறுக்காமல், மனந்திரும்புதலின் வேதாகம-இறையியல் நிறையைத் தக்கவைக்கிறது.
- issue: ὡσαύτως ἀπολεῖσθε என்பதன் வலிமை
  choice: அவ்வாறே அழிந்துபோவீர்கள்
  alternative: அதே விதத்தில் அழிந்துபோவீர்கள்; அதுபோல இறந்துபோவீர்கள்
  rationale: முந்தைய நிகழ்வுகளின் தீர்ப்போடு உள்ள ஒப்புமையைப் பாதுகாக்கிறது; ஒப்புமை அழிவின் முறை, திடீர்மை, அல்லது உறுதி ஆகியவற்றில் எதைக் குறிப்பதாகும் என்பதை மிகையாகக் குறிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், இயல்பான, கண்ணியமான நடை. ‘மனந்திரும்புதல்’ மற்றும் ‘அழிந்துபோதல்’ ஆகியவை வசனத்தின் இறையியல் தீவிரத்தையும் உண்மையான பொருள் விரிவையும் தக்கவைக்கின்றன.
