  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: ta
  text: அவர் அவள்மேல் தம் கைகளை வைத்தார்; உடனே அவள் நிமிர்ந்தாள்[a], கடவுளை மகிமைப்படுத்தினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவள் நிமிர்ந்து நின்றாள்’ அல்லது ‘அவள் நேராக்கப்பட்டாள்.’
    reason: ἀνωρθώθη என்பது நேரான நிலைக்கு மீட்கப்படுதல், நிமிர்ந்து நிற்றல், அல்லது நேராக்கப்படுதல் என்ற நுணுக்கங்களைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: அவர் அவள்மேல் தம் கைகளை வைத்தார்
  rationale: கைகளை ஒருவர்மேல் வைக்கும் செயலைத் தமிழில் இயல்பாகவும் நேரடியாகவும் கூறுகிறது. கிரேக்கத்தில் உடல் உறுப்புடன் வரும் இடத்தில் தமிழுக்கு இயல்பான உடைமைச் சுட்டாக ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: குணமடைதல் தாமதமின்றி நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀνωρθώθη
  choice: நிமிர்ந்தாள்
  rationale: கூனியிருந்த பெண் நேரான உடல் நிலைக்கு வந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கிரேக்கச் சொல்லின் passive வடிவத்தைத் தமிழில் சொற்சொல்லாக ‘நேராக்கப்பட்டாள்’ என வழங்குவது இயந்திரத்தனமாக இருப்பதால், நிகழ்ந்த விளைவு முன்னிலைப்படுத்தப்பட்டுள்ளது; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἐδόξαζεν
  choice: மகிமைப்படுத்தினாள்
  rationale: δοξάζω என்பதின் இறையியல் நிறையைத் தக்கவைக்கிறது. கிரேக்க imperfect வடிவத்தின் தொடர்ச்சியான நுணுக்கம் சூழலில் இருக்கக்கூடியதாயினும், தமிழ் கதைநடையில் எளிய இறந்தகாலம் இயல்பானது.
- source_word: τὸν θεόν
  choice: கடவுளை
  rationale: சொல்லின் நேரடியான பொருளையும், நவீன பொதுத் தமிழில் பரவலாகப் புரியும் பயன்பாட்டையும் தருகிறது.
theological_decisions:
- issue: ἀνωρθώθη விவரிக்கும் குணமடைதலின் விளைவு
  choice: ‘அவள் நிமிர்ந்தாள்’ என்று உடல் நிலை மீட்கப்பட்டதை வெளிப்படுத்துதல்
  alternative: ‘அவள் நிமிர்ந்து நின்றாள்’ அல்லது ‘அவள் நேராக்கப்பட்டாள்’
  rationale: முந்தைய சூழலில் அவள் கூனியிருந்து தன்னால் நிமிர முடியாதவளாக இருந்தாள். இவ்வாக்கியம் உடல் சார்ந்த மீட்பைக் குறிக்கிறது; குணமாக்கப்பட்ட விதம் குறித்து மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘அவள்மேல் தம் கைகளை வைத்தார்’ என்பது தெளிவான உடல் செயலைக் காட்டுகிறது; ‘நிமிர்ந்தாள்’ என்பது அன்றாட வாசகருக்குப் புரியும் வகையில் குணமடைதலின் விளைவைச் சொல்கிறது.
