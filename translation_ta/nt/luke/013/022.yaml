    reason: lexical_alternative
  revision_rationale: The revision retains the distinction between settlements, the accompanying activity of teaching, and the directional sense of travel toward Jerusalem. It changes the principal travel verb to a progressive past form to represent the imperfect aspect of διεπορεύετο more faithfully. The footnote continues to present “to Jerusalem” as a legitimate rendering of εἰς Ἱεροσόλυμα, with aspect aligned to the revised sentence.
