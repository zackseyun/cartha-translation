revisions:
- from: அவர் பட்டணங்கள் மற்றும் கிராமங்கள் வழியாகச் சென்று, கற்பித்துக்கொண்டே எருசலேமை நோக்கிப் பயணம் செய்தார்.[a]
  to: அவர் பட்டணங்கள் மற்றும் கிராமங்கள் வழியாகப் பயணித்து, கற்பித்துக்கொண்டே எருசலேமை நோக்கிச் சென்றுகொண்டிருந்தார்.[a]
  rationale: The revision retains the distinction between settlements, the accompanying activity of teaching, and the directional sense of travel toward Jerusalem. It changes the principal travel verb to a progressive past form to represent the imperfect aspect of διεπορεύετο more faithfully. The footnote continues to present “to Jerusalem” as a legitimate rendering of εἰς Ἱεροσόλυμα, with aspect aligned to the revised sentence.
