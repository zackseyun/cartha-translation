  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: ta
  text: அவர் பட்டணங்கள் மற்றும் கிராமங்கள் வழியாகப் பயணித்து, கற்பித்துக்கொண்டே எருசலேமை நோக்கிச் சென்றுகொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமுக்குப் பயணம் செய்துகொண்டிருந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: வழியாகச் சென்று
  rationale: இறந்தகாலத் தொடர்நிலை வினை, பல இடங்கள் வழியாக நடைபெற்று வந்த பயணத்தைக் குறிக்கிறது; தமிழில் இயல்பான வாக்கிய அமைப்பில் இதைத் தொடர்ச்சியான பயணமாக வெளிப்படுத்துகிறது.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: பட்டணங்கள் மற்றும் கிராமங்கள் வழியாக
  rationale: κατά இங்கு பல பெரிய மற்றும் சிறிய குடியிருப்புகள் வழியாகச் சென்றதைப் பகிர்வாகக் குறிக்கிறது; πόλεις–κώμας வேறுபாட்டை ‘பட்டணங்கள்–கிராமங்கள்’ காக்கிறது.
- source_word: διδάσκων
  choice: கற்பித்துக்கொண்டே
  rationale: பயணத்துடன் இணைந்து தொடர்ந்து நடந்த செயலை நிகழ்காலப் பெயரெச்சம் குறிக்கிறது; ‘கற்பித்துக்கொண்டே’ அந்த உடன்நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πορείαν ποιούμενος
  choice: பயணம் செய்தார்
  rationale: ‘பயணத்தை மேற்கொள்தல்’ என்ற மூலமொழி மரபுத்தொடரின் நோக்கமுள்ள முன்னேற்றத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமை நோக்கி
  rationale: εἰς இலக்கை நோக்கிய திசையையும் இறுதி இலக்கையும் குறிக்கலாம்; இங்கு பயணம் தொடர்ந்துகொண்டிருப்பதால் ‘நோக்கி’ என்பது உடனடி வருகையைச் சொல்லாமல் திசையைப் பாதுகாக்கிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
theological_decisions:
- issue: இயேசுவின் எருசலேம் பயணத்தின் கதைத் திசை
  choice: எருசலேமை நோக்கி
  alternative: எருசலேமுக்குப்
  rationale: வசனம் வருகையை அல்ல, தொடர்ந்து முன்னேறும் பயணத்தை விவரிக்கிறது. ‘நோக்கி’ என்பது அந்தக் கதைத் தொடர்ச்சியைக் காக்கிறது; εἰς என்பதன் ‘எருசலேமுக்கு’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பயணத் தொடர்ச்சியும், பயணத்தோடு இணைந்த கற்பித்தலும் காக்கப்பட்டுள்ளன; ‘நோக்கி/க்கு’ என்ற உண்மையான பொருள் நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
