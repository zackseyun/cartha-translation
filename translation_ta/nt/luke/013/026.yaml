source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: ta
  text: அப்போது நீங்கள், ‘உங்கள் முன்னிலையில் நாங்கள் சாப்பிட்டோம், குடித்தோம்; எங்கள் தெருக்களில்[a] நீங்கள் கற்பித்தீர்கள்’ என்று சொல்லத் தொடங்குவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் பொதுச் சதுக்கங்களில்.’ கிரேக்கச் சொல் நகரத்திலுள்ள அகன்ற தெருக்களையோ திறந்த பொதுவிடங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: உரையாடலில் அடுத்த நிகழ்வைக் குறிக்கும் கால வினையடை; இயல்பானவும் சுருக்கமானவும் உள்ள தமிழ் இணைச்சொல்.
- source_word: ἄρξεσθε λέγειν
  choice: சொல்லத் தொடங்குவீர்கள்
  rationale: ἄρχω என்பதன் எதிர்கால வடிவமும் λέγειν என்ற துணை வினையெச்சமும் சேர்ந்து தொடக்கநிலையைத் தெளிவாகக் காட்டுகின்றன; அதைத் தமிழிலும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: Ἐφάγομεν
  choice: நாங்கள் சாப்பிட்டோம்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த உணவு உண்ட செயலை இயல்பான நவீன தமிழில் கூறுகிறது.
- source_word: ἐνώπιόν σου
  choice: உங்கள் முன்னிலையில்
  rationale: வெறும் இடநிலையை மட்டுமல்லாமல், அந்த நபரின் நேரடி முன்னிலையிலும் தொடர்பிலும் நடந்ததாக அவர்கள் முன்வைக்கும் வாதத்தைப் பாதுகாக்கிறது.
- source_word: ἐπίομεν
  choice: குடித்தோம்
  rationale: சாப்பிட்டோம் என்பதோடு இணையும் எளிய இறந்தகால வடிவம்; சேர்ந்து உணவருந்திய வெளிப்புற தொடர்பைக் காட்டுகிறது.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: எங்கள் தெருக்களில்
  rationale: πλατεῖα என்பது நகரத்தின் அகன்ற தெருக்களையோ திறந்த பொதுவிடங்களையோ குறிக்கலாம். ‘தெருக்களில்’ என்பது இயல்பான தமிழ்; உள்ளூர் பொதுவெளி என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: ἐδίδαξας
  choice: நீங்கள் கற்பித்தீர்கள்
  rationale: அவர்கள் வாழ்ந்த பொதுவிடங்களில் அவர் போதித்த வரலாற்றுச் செயலை எளிய இறந்தகாலத்தில் தெரிவிக்கிறது.
theological_decisions:
- issue: பேசுகிறவர்கள் இயேசுவிடம் முன்வைக்கும் உறவுக் கோரிக்கையின் தன்மை
  choice: அவர்கள் அவரோடு வெளிப்புறத் தொடர்பு கொண்டிருந்ததாகச் சொல்வதை மட்டும் மொழிபெயர்ப்பு தெரிவிக்கிறது; அவர் அவர்களை ஏற்றுக்கொண்டார் என்று உணர்த்தவில்லை.
  alternative: அவர்கள் சொல்வது அங்கீகரிக்கப்பட்ட ஐக்கியத்தையோ இரட்சிப்புக்குரிய உறவையோ குறிக்கிறது எனத் தெளிவுபடுத்துதல்.
  rationale: மூலவாக்கியம் அவருடைய முன்னிலையில் உண்டு குடித்ததையும் அவர் அவர்களுடைய தெருக்களில் கற்பித்ததையும் ஆதாரமாக அவர்கள் கூறுவதை மட்டுமே பதிவு செய்கிறது. அந்தக் கூற்றை இயேசு ஏற்றுக்கொள்கிறார் என்று சேர்க்காமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மேற்கோள் அமைப்பு தமிழுக்கேற்றவாறு வாக்கியத்தின் இறுதியில் ‘என்று சொல்லத் தொடங்குவீர்கள்’ என அமைக்கப்பட்டுள்ளது. மரியாதைப் பன்மையான ‘நீங்கள்/உங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
