id: LUK.13.24
reference: Luke 13:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: ta
  text: “குறுகிய கதவு வழியாக நுழையப் பாடுபடுங்கள்[a]. ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன், பலர் நுழைய நாடுவார்கள்; ஆனால் அவர்களால் முடியாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறுகிய வாசல் வழியாக.’ இங்கு லூக்கா பயன்படுத்தும் கிரேக்கச் சொல் θύρα பொதுவாக ‘கதவு’ என்று பொருள்படும்; மத்தேயுவின் இணையான பகுதியில் ‘வாசல்’ என்பதற்கான வேறு கிரேக்கச் சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: போராடுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தீவிரமான முயற்சியையும் போராட்டத்தையும் குறிக்கிறது. ‘போராடுங்கள்’ என்பது அதன் வலிமையைத் தணிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: εἰσελθεῖν
  choice: நுழைய
  rationale: εἰσέρχομαι என்பதன் வினையெச்சப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லாக்கம் பேணப்படுகிறது.
- source_word: διὰ τῆς στενῆς θύρας
  choice: இடுக்கமான கதவின் வழியாக
  rationale: θύρα என்பதற்கு முதன்மையாக ‘கதவு’ என்பதே பொருள்; στενός குறிக்கும் குறுகிய, நெருக்கமான தன்மையை ‘இடுக்கமான’ தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளைப் பேணுகிறது.
- source_word: πολλοί
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழிக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்க உரையாடல் சூத்திரத்தைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: ζητήσουσιν
  choice: தேடுவார்கள்
  rationale: ζητέω என்பதன் ‘தேடு’ என்ற அடிப்படைப் பொருளைப் பேணி, தொடக்கத்திலுள்ள ‘போராடுங்கள்’ என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டைக் காக்கிறது.
- source_word: οὐκ ἰσχύσουσιν
  choice: அவர்களால் முடியாது
  rationale: ஒரு செயலை நிறைவேற்றும் வல்லமை அல்லது திறன் இல்லாமையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மனித முயற்சியும் மீட்பு மொழியும்
  choice: ‘போராடுங்கள்’ என்ற வலிமையான கட்டளையைத் தணிக்காமல் வைத்தல்
  alternative: ‘முழு முயற்சி செய்யுங்கள்’ அல்லது ‘முயலுங்கள்’
  rationale: வசனம் தீவிர முயற்சியைக் கட்டளையிடுவதோடு சிலரால் நுழைய முடியாது என்றும் எச்சரிக்கிறது. தகுதி, செயல்கள், இறையாண்மை அல்லது மனிதப் பொறுப்பு பற்றிய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இந்த இறையியல் பதற்றம் அப்படியே பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘போராடுங்கள்’ மூலத்தின் தீவிரத்தையும், ‘தேடுவார்கள்’ அதன் தனித்த சொற்பொருளையும் காக்கின்றன. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
