revisions:
- from: “இடுக்கமான கதவின் வழியாக நுழையப் போராடுங்கள்[a]. ஏனெனில், பலர் நுழையத் தேடுவார்கள், ஆனால் அவர்களால் முடியாது என்று நான் உங்களுக்குச் சொல்கிறேன்.”
  to: “குறுகிய கதவு வழியாக நுழையப் பாடுபடுங்கள்[a]. ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன், பலர் நுழைய நாடுவார்கள்; ஆனால் அவர்களால் முடியாது.”
  rationale: The revision uses idiomatic modern standard Tamil while retaining the Greek’s earnest imperative, causal explanation, and distinction between strenuous striving (Ἀγωνίζεσθε) and seeking (ζητήσουσιν). It translates θύρα as ‘கதவு’ and preserves the lexical alternative in a correctly anchored footnote. The final contrast is expressed naturally without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the imperative, the causal connection, the two occurrences of ‘enter,’ and the warning that many will seek entry but lack the ability to enter. However, ‘போராடுங்கள்’ can suggest fighting rather than sustained exertion, and ‘இடுக்கமான கதவு’ is less precise and less natural than ‘குறுகிய கதவு.’
  naturalness: The current final clause is grammatically understandable, but placing ‘என்று நான் உங்களுக்குச் சொல்கிறேன்’ after the warning is less natural than positioning the discourse formula before the reported statement. ‘நுழைய நாடுவார்கள்’ is a more idiomatic elevated-modern rendering of ζητήσουσιν than ‘நுழையத் தேடுவார்கள்,’ while retaining the distinction from the imperative.
  terminology: ‘கதவு’ rightly represents θύρα rather than importing Matthew’s ‘gate.’ ‘குறுகிய’ is the normal modern Tamil spatial equivalent for στενή here. ‘பாடுபடுங்கள்’ conveys earnest striving without the potentially combative association of ‘போராடுங்கள்.’
  issues:
  - severity: medium
    issue: ‘போராடுங்கள்’ may over-specify the image as combat.
    rationale: Ἀγωνίζεσθε denotes strenuous effort or striving in this context; it need not imply a fight or conflict with an opponent. ‘பாடுபடுங்கள்’ preserves serious exertion more neutrally.
  - severity: low
    issue: ‘இடுக்கமான கதவு’ is less idiomatic and less spatially exact.
    rationale: For a physically narrow door, modern standard Tamil normally uses ‘குறுகிய கதவு.’ ‘இடுக்கமான’ can suggest crampedness or distress and is less direct here.
  - severity: low
    issue: The placement of the discourse formula is awkward in Tamil.
    rationale: Moving ‘நான் உங்களுக்குச் சொல்கிறேன்’ before the proposition yields a smoother rendering while preserving λέγω ὑμῖν.
  revised_text: “குறுகிய கதவு வழியாக நுழையப் பாடுபடுங்கள்[a]. ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன், பலர் நுழைய நாடுவார்கள்; ஆனால் அவர்களால் முடியாது.”
