  to: வருங்காலத்தில் அது கனி கொடுத்தால், நல்லது; இல்லையென்றால்[a], அதை வெட்டிவிடுவீர்.
  rationale: The revision retains the source’s deliberately general temporal expression and the parable’s conditional contrast. It uses a more exact Tamil equivalent for cutting down a tree, regularizes clause punctuation, and removes unmatched closing quotation marks. The footnote continues to identify “அடுத்த ஆண்டு” as a contextual interpretive alternative rather than a statement explicit in this verse’s Greek wording.
