review_pass:
  verdict: revise
  source_fidelity: The conditional contrast, fruit-bearing idiom, general future reference of εἰς τὸ μέλλον, and the second-person future action are substantially conveyed. However, “வெட்டிப்போடுவீர்” can suggest cutting and throwing away, whereas ἐκκόψεις specifically denotes cutting the tree down; “வெட்டிவிடுவீர்” is closer and more idiomatic here.
  naturalness: The Tamil is clear and appropriately dignified. Adding commas around the conditional and contrastive clauses improves modern Tamil readability. The terminal ’” is unmatched/overlapping quotation punctuation in the supplied standalone verse and should be removed.
  terminology: “கனி கொடுத்தால்” is a natural agricultural rendering of ποιήσῃ καρπόν. “வருங்காலத்தில்” appropriately retains the nonspecific future sense without importing “next year.”
  issues:
  - severity: low
    issue: The rendering “வெட்டிப்போடுவீர்” is slightly more expansive than the Greek horticultural verb.
    rationale: ἐκκόπτω means cut down/out. “வெட்டிவிடுவீர்” preserves the felling/removal sense without adding the notion of throwing away.
  - severity: low
    issue: The final quotation marks are structurally irregular in this standalone text.
    rationale: The sequence ’” has no matching opening quotation mark in the supplied verse and is not required by the Greek source.
  revised_text: வருங்காலத்தில் அது கனி கொடுத்தால், நல்லது; இல்லையென்றால்[a], அதை வெட்டிவிடுவீர்.
