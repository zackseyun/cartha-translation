id: LUK.13.9
reference: Luke 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: ta
  text: வருங்காலத்தில் அது கனி கொடுத்தால், நல்லது; இல்லையென்றால்[a], அதை வெட்டிவிடுவீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடுத்த ஆண்டு”; சில மொழிபெயர்ப்புகள் முந்தைய வசனத்திலுள்ள காலக் குறிப்பை இங்கும் வெளிப்படையாகக் கொடுக்கின்றன. ஆனால் இங்குள்ள கிரேக்கச் சொற்றொடர் இன்னும் நேரடியாக, “வருங்காலத்தில்” அல்லது “வரும் காலத்தில்” என்று பொருள்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: அது ... கொடுத்தால்
  rationale: καί + ἐάν ஆகியவற்றின் நிபந்தனைப் பொருளையும், μέν...δέ அமைப்பின் முதல் பகுதியையும் இயல்பான தமிழ் நிபந்தனை வாக்கியமாகக் கொடுக்கிறது; முந்தைய வசனத்துடன் தொடரும் இணைப்பு தமிழில் சூழலால் தெளிவாகிறது.
- source_word: ποιήσῃ καρπὸν
  choice: கனி கொடுத்தால்
  rationale: ποιέω + καρπός என்பதன் வேளாண்மைச் சொல்வழக்குப் பொருள் ‘கனி கொடுத்தல்’; அத்திமர உருவகத்துக்கு இயல்பான நவீனத் தமிழ்.
- source_word: εἰς τὸ μέλλον
  choice: வருங்காலத்தில்
  rationale: கிரேக்கச் சொற்றொடரின் பொதுவான ‘வரும் காலத்தில்/எதிர்காலத்தில்’ என்ற பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அடுத்த ஆண்டு’ என்பதை முதன்மை உரையில் சேர்ப்பதில்லை.
- source_word: εἰ δὲ μήγε
  choice: இல்லாவிட்டால்
  rationale: முந்தைய நிபந்தனைக்கு எதிரான முடிவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκκόψεις αὐτήν
  choice: அதை வெட்டிப்போடுவீர்
  rationale: பலனற்ற மரத்தை வெட்டி அகற்றும் தோட்டக்கலைச் சூழலைப் பாதுகாக்கிறது; இரண்டாம் நபர் ஒருமைக்கு மரியாதை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: உரிமையாளரின் தாமதிக்கப்பட்ட தீர்ப்புக்குரிய காலக் குறிப்பு
  choice: காலத்தைப் பொதுவாக ‘வருங்காலத்தில்’ என்று வைத்தல்
  alternative: முந்தைய வசனத்தின் காலச் சூழலைக் கொண்டு ‘அடுத்த ஆண்டு’ என்று மொழிபெயர்த்தல்
  rationale: இவ்வசனத்தின் கிரேக்க உரை ‘அடுத்த ஆண்டு’ என்று வெளிப்படையாகக் கூறாமல் εἰς τὸ μέλλον என்று பொதுவாகக் கூறுகிறது. ஆகவே நிபந்தனை, அவகாசம், பின்னர் வரக்கூடிய தீர்ப்பு ஆகிய பதற்றங்களைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான ஆனால் கண்ணியமான நடையுடன், உவமையின் வேளாண்மைச் சித்திரமும் கிரேக்க உரையின் காலத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
