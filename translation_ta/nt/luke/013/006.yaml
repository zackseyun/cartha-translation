source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: ta
  text: 'அவர் இந்த உவமையையும் சொன்னார்: “ஒருவர்[a] தமது திராட்சைத்தோட்டத்தில் நடப்பட்டிருந்த ஓர் அத்திமரத்தை வைத்திருந்தார். அவர் அதில் பழம் தேடி வந்தார்; ஆனால் பழம் எதையும் காணவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனிதர்.” கிரேக்கச் சொல் பொதுவாக ‘ஒருவர்’ என்று பொருள்படும்; கதையின் பாணியில் ‘ஒரு மனிதர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: அவர் இந்த உவமையையும் சொன்னார்
  rationale: δέ முந்தைய உரையுடன் மென்மையான தொடர்ச்சியைச் சுட்டுகிறது; அதைத் தமிழில் ‘-யும்’ இயல்பாக வெளிப்படுத்துகிறது. ἔλεγεν இறந்தகால imperfect என்றாலும், இங்கு உவமையை அறிமுகப்படுத்தும் வினையாக இருப்பதால் எளிய இறந்தகாலம் நவீனத் தமிழில் இயல்பானது; ‘சொல்லிக்கொண்டிருந்தார்’ என மொழிபெயர்ப்பது தேவையற்ற தொடர்நிலை உணர்வைத் தரக்கூடும்.
- source_word: παραβολήν
  choice: உவமை
  rationale: இயேசுவின் உருவகப் போதனைக் கதையைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் வேதாகமச் சொல்.
- source_word: Συκῆν
  choice: ஓர் அத்திமரம்
  rationale: இச்சொல் குறிப்பாக அத்திமரத்தைக் குறிக்கிறது; ஒருமை மற்றும் நிர்ணயமற்ற அறிமுகம் ‘ஓர்’ என்பதால் இயல்பாக வெளிப்படுகின்றன.
- source_word: εἶχέν τις
  choice: ஒருவர் ... நட்டு வைத்திருந்தார்
  rationale: τις என்பது நிர்ணயமற்ற ஒருவரைக் குறிக்கிறது. பாலினத்தை கிரேக்கம் இங்கு வெளிப்படையாகக் குறிப்பிடாததால் ‘ஒருவர்’ பொருத்தமானது. εἶχεν மற்றும் அடுத்துள்ள perfect passive participle இணைந்து, அந்த மரம் அங்கே நடப்பட்ட நிலை நீடித்ததைத் தெரிவிக்கின்றன.
- source_word: πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: தமது திராட்சைத்தோட்டத்தில் ஓர் அத்திமரத்தை நட்டு வைத்திருந்தார்
  rationale: Perfect passive participle மரம் நடப்பட்டு அங்கே நிலைத்திருந்த நிலையைக் காட்டுகிறது. ‘நட்டு வைத்திருந்தார்’ அந்த நிறைவுற்று நீடிக்கும் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தமது’ என்பது αὐτοῦ-வை முதன்மைப் பாத்திரத்துடன் தெளிவாக இணைக்கிறது.
- source_word: ἦλθεν ζητῶν
  choice: பழம் தேடி வந்தார்
  rationale: முதன்மை வினையுடன் நிகழும் தேடல் நடவடிக்கையை இயல்பான தமிழ் வினைத்தொகை காக்கிறது.
- source_word: καρπὸν ἐν αὐτῇ
  choice: அதில் பழம்
  rationale: καρπός என்பதற்கான நேரடியான பொருள் ‘பழம்’; உவமையின் உருவகத் தொடர்பையும் இது காக்கிறது. மரத்தைக் குறிக்கும் ἐν αὐτῇ தமிழில் இயல்பாக ‘அதில்’ என வருகிறது.
- source_word: καὶ οὐχ εὗρεν
  choice: ஆனால் பழம் எதையும் காணவில்லை
  rationale: இரண்டாவது καί இங்கு எதிர்பார்ப்புக்கு மாறான முடிவை இணைப்பதால் ‘ஆனால்’ இயல்பாக அமைகிறது. ‘பழம்’ என்பதை மீண்டும் கூறுவது தமிழில் சுட்டுப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: உவமையில் வரும் நிர்ணயமற்ற பொருள் τις
  choice: ஒருவர்
  alternative: ஒரு மனிதர்
  rationale: τις பாலினத்தைத் தனியாகக் குறிக்காத நிர்ணயமற்ற சுட்டுப்பெயர். ‘ஒருவர்’ எந்தத் தேவையற்ற இறையியல் அல்லது பாலின விளக்கத்தையும் சேர்க்காமல் கதாபாத்திரத்தை இயல்பாக அறிமுகப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திராட்சைத்தோட்டம்,’ ‘அத்திமரம்,’ ‘உவமை’ ஆகியவை துல்லியமும் பரவலான புரிதலும் கொண்ட சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
