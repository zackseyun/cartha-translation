source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: ta
  text: அவர் இவற்றைச் சொல்லிக்கொண்டிருந்தபோது, அவருக்கு எதிராக இருந்தவர்கள்[a] அனைவரும் அவமானமடைந்தார்கள்; அவர் செய்துகொண்டிருந்த மாட்சிமையான அனைத்தையும் குறித்து மக்கள் கூட்டம் முழுவதும் மகிழ்ந்துகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய எதிரிகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: அவர் இவற்றைச் சொல்லிக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பெயரெச்சத்துடன் அமைந்த தனி உடைமை வேற்றுமைத் தொடரின் ஒரே நேரத்தில் நீடித்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: அவரை எதிர்த்துக்கொண்டிருந்தவர்கள்
  rationale: ἀντίκειμαι என்பதிலுள்ள செயல்படும், தொடர்ச்சியான எதிர்ப்பை பெயர்ச்சொல்லாகச் சுருக்காமல் காக்கிறது.
- source_word: κατῃσχύνοντο
  choice: வெட்கத்துக்குள்ளானார்கள்
  rationale: அவர்கள் வெறுமனே உள்ளத்தில் வெட்கப்பட்டார்கள் என்பதைக் காட்டிலும், இயேசுவின் சொற்களால் பொதுவில் வெட்கமடையச் செய்யப்பட்டார்கள் என்ற செயப்பாட்டு நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: ஒருமை கூட்டுப்பெயரின் முழுமையைக் காட்டும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: ἔχαιρεν
  choice: மகிழ்ந்துகொண்டிருந்தது
  rationale: முற்றுப்பெறாத காலவினையின் தொடர்ச்சியான மகிழ்ச்சியை வெளிப்படுத்துகிறது.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: மாட்சிமையான செயல்கள் அனைத்தையும் குறித்து
  rationale: மகிழ்ச்சிக்கான காரணம் அல்லது பொருளை ἐπί சுட்டுகிறது; ἔνδοξος என்பதன் பரந்த ‘மாட்சிமையான’ பொருளை அற்புதங்கள் என்று குறுக்காமல் காக்கிறது.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: அவரால் செய்யப்பட்டுவந்த
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியையும் ὑπό குறிக்கும் இயேசுவின் நேரடி செயலாண்மையையும் காக்கிறது.
theological_decisions:
- issue: ‘மாட்சிமையான செயல்கள்’ என்பவற்றின் இயல்பு
  choice: ἐνδόξοις என்பதை ‘மாட்சிமையான’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்
  alternative: ‘அற்புதமான’ அல்லது ‘வியத்தகு’ என்று மொழிபெயர்த்தல்
  rationale: சூழலில் குணமாக்குதல் இடம்பெற்றாலும், கிரேக்கச் சொல் அற்புதங்களை மட்டும் குறிப்பிடுவதில்லை; மாட்சிமை வாய்ந்த, சிறப்பான செயல்கள் என்ற பரப்பைத் திறந்தே வைக்கிறது.
- issue: ὑπ’ αὐτοῦ என்பதில் செயலாண்மை
  choice: ‘அவரால்’
  alternative: ‘அவர் மூலமாக’
  rationale: ὑπό உடைமை வேற்றுமையுடன் வந்து இயேசுவே செயல்களைச் செய்தவர் என்று நேரடியாகக் குறிக்கிறது; கருவிப் பொருளைத் தேவையின்றி புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க முற்றுப்பெறாத வினைகளின் நீடித்த தன்மை ‘சொல்லிக்கொண்டிருந்தபோது,’ ‘செய்யப்பட்டுவந்த,’ ‘மகிழ்ந்துகொண்டிருந்தது’ என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளது.
