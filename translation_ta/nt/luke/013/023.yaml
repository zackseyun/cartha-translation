    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: அப்போது / அதற்கு
  rationale: முதல் இடத்தில் கதைநிகழ்வை இயல்பாக முன்னெடுக்கும் மென்மையான இணைப்பாகவும், இரண்டாம் இடத்தில் பதிலை அறிமுகப்படுத்தும் இணைப்பாகவும் சூழலுக்கேற்ப மொழிபெயர்க்கப்பட்டுள்ளது; தேவையற்ற எதிர்மறை மாறுபாடு சேர்க்கப்படவில்லை.
- source_word: τις
  choice: ஒருவர்
  rationale: அடையாளம் குறிப்பிடப்படாத ஒரு நபரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: மூலத்தில் உள்ள பிரதிப்பெயரைப் பாதுகாக்கிறது; இந்த வசனத்துக்குள் ‘இயேசு’ என்ற பெயரை விளக்கமாகச் சேர்க்கவில்லை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பாகவும் ஆழ்ந்த கிறிஸ்தவப் பொருளுடைய பட்டமாகவும் அமையக்கூடிய κύριε என்பதன் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: εἰ ὀλίγοι
  choice: சிலர் மட்டும்தானா
  rationale: சிறிய எண்ணிக்கையைப் பற்றிய நேரடிக் கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘மட்டும்’ என்பது கேள்வியில் உள்ள கட்டுப்படுத்தும் உட்பொருளைத் தெளிவாக்குகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οἱ σῳζόμενοι
  choice: இரட்சிக்கப்படுகிறவர்கள்
  rationale: பெயர்ச்சொல் தன்மையுடைய நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தைப் பிரதிபலித்து, இரட்சிப்பின் தொடரும்/நடைபெறும் அம்சத்தையும் செயப்பாட்டு நிலையையும் காக்கிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: மூலத்தின் பன்மைப் பிரதிப்பெயரை அப்படியே பாதுகாக்கிறது; அவர் கேள்வி கேட்ட ஒருவருக்கு மட்டுமல்ல, பலரிடம் பதிலளிக்கிறார் என்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவை அழைக்கும் κύριε என்பதன் வலிமை
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சொல் வெறும் மரியாதை அழைப்பாகவோ, அதிக கிறிஸ்தவ முக்கியத்துவமுள்ள பட்டமாகவோ கேட்கலாம். ‘ஆண்டவரே’ என்பது லூக்காவின் பயன்பாட்டிலுள்ள இந்த இறையியல் திறந்தநிலையை ஒடுக்காமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: σῳζόμενοι என்பதன் நிகழ்காலச் செயப்பாட்டு அம்சம்
  choice: இரட்சிக்கப்படுகிறவர்கள்
  alternative: இரட்சிக்கப்பட்டவர்கள்
  rationale: மூலத்தின் நிகழ்கால வினையெச்சம் நடைபெறும் நிலை அல்லது செயல்முறையை உணர்த்த முடியும். நிறைவுற்ற முடிவாக மட்டும் புரிந்துகொள்ள வைக்கும் சொல்லைத் தவிர்த்து, குறிப்பிட்ட இரட்சிப்பியல் அமைப்பை உரைக்குள் திணிக்காமல் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வாசிப்புக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘இரட்சிக்கப்படுகிறவர்கள்’ என்பது இறையியல் துல்லியத்தையும் மூலத்தின் செயப்பாட்டு/தொடரும் அம்சத்தையும் காக்கிறது. இறுதியில் வரும் முக்காற்புள்ளி அடுத்த வசனத்தில் தொடரும் இயேசுவின் பதிலை அறிமுகப்படுத்துகிறது.
