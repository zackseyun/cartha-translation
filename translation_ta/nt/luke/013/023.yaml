  text: 'அப்போது ஒருவர் அவரிடம், “ஆண்டவரே[a], இரட்சிக்கப்படுகிறவர்கள் சிலர் மட்டும்தானா[b]?” என்று கேட்டார். அதற்கு அவர் அவர்களிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்டவரே” என்பதை இங்கு மரியாதையான அழைப்பாக “ஐயா” என்றும் புரிந்துகொள்ளலாம்; கிரேக்கச் சொல் அதன் முழு வலிமையைத் திறந்தே வைக்கிறது.
