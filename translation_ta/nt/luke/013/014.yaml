id: LUK.13.14
reference: Luke 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: ta
  text: ஆனால், இயேசு ஓய்வுநாளில் குணமாக்கியதால் சினமடைந்த ஜெபக்கூடத் தலைவர் மக்கள் கூட்டத்திடம், “வேலை செய்ய வேண்டிய நாட்கள் ஆறு இருக்கின்றன; ஆகவே, அந்த நாட்களில் வந்து குணமடையுங்கள்; ஓய்வுநாளில் அல்ல” என்று மறுமொழியாகக் கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: ஆனால் ... சொன்னார்
  rationale: ἀποκριθεὶς உரையாடலில் எதிர்வினையைக் குறிக்கிறது; தமிழில் தனியாக ‘பதிலளித்து’ எனச் சேர்ப்பது இயல்பற்ற மறுபதிப்பை உண்டாக்குவதால், δέ-யின் மிதமான முரண்பாட்டை ‘ஆனால்’ என்றும் பிரதான வினையை ‘சொன்னார்’ என்றும் இயல்பாக வழங்குகிறது.
- source_word: ἀρχισυνάγωγος
  choice: ஜெபக்கூடத் தலைவர்
  rationale: ஜெபக்கூடத்தின் செயல்பாடுகளை மேற்பார்வையிட்ட பொறுப்பாளரைக் குறிக்கிறது; ‘தலைவர்’ என்பது குடியாட்சி அதிகாரத்தைச் சுட்டாமல் பொறுப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγανακτῶν
  choice: கோபமடைந்த
  rationale: கடுமையான அதிருப்தியையும் தவறு நடந்ததாகக் கருதும் சினத்தையும் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: இயேசு ஓய்வுநாளில் குணமாக்கியதால்
  rationale: ὅτι-யின் காரணப் பொருளையும், தலைவரின் கோபத்துக்கு முன்பே நிகழ்ந்த குணமாக்குதலையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: மக்கள் கூட்டத்திடம் ... என்று சொன்னார்
  rationale: ὄχλος கூடியிருந்த மக்களைக் குறிக்கிறது. ἔλεγεν இறந்தகாலத் தொடர்நிலையைக் கொண்டிருந்தாலும், இச்சூழலில் தமிழின் எளிய ‘சொன்னார்’ இயல்பாக உரையைக் கொண்டுவருகிறது; மீண்டும் மீண்டும் சொன்னார் என்ற பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: வேலை செய்ய வேண்டிய நாட்கள் ஆறு இருக்கின்றன
  rationale: δεῖ வெளிப்படுத்தும் கடமை அல்லது அவசியத்தை ‘வேண்டிய’ காக்கிறது; கிரேக்க வாக்கியத்தின் வலியுறுத்தலையும் இயல்பான தமிழ்ச் சொல்வரிசையையும் இணைக்கிறது.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: ஆகவே, அந்த நாட்களில் வந்து குணமடையுங்கள்
  rationale: οὖν-இன் முடிவுறுத்தும் தொடர்பை ‘ஆகவே’ காக்கிறது; ἐρχόμενοι மற்றும் θεραπεύεσθε ஆகியவற்றை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ஓய்வுநாளில் அல்ல
  rationale: முந்தைய கட்டளையோடு இணைந்த தடைமறுப்பைச் சுருக்கமாகவும் வலுவாகவும் காக்கிறது; ‘ஓய்வுநாளின் நாளில்’ போன்ற இயல்பற்ற மறுபதிப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: வேலைக்கும் குணமாக்குதலுக்கும் உரிய நாட்கள் பற்றிய தலைவரின் கூற்று
  choice: 'அவரது விதிமுறை சார்ந்த எதிர்ப்பாகவே நேரடியாக வழங்கப்பட்டது: ‘வேலை செய்ய வேண்டிய நாட்கள் ஆறு இருக்கின்றன; ஆகவே, அந்த நாட்களில் வந்து குணமடையுங்கள்.’'
  alternative: அவரது பாசாங்கை வெளிப்படையாகச் சேர்த்து விளக்கும் உரைமாற்றம்
  rationale: இது ஜெபக்கூடத் தலைவரின் பார்வையைப் பதிவு செய்கிறது; அதை இறை அங்கீகாரமாகவோ, அடுத்த வசனத்தின் தீர்ப்பை முன்கூட்டியே சேர்த்தோ மொழிபெயர்க்காமல் உரையின் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘ஜெபக்கூடம்’ மற்றும் ‘ஓய்வுநாள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; தேவையற்ற பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
