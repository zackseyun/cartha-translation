source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: ta
  text: இல்லை, உங்களுக்குச் சொல்கிறேன்; ஆனால் நீங்கள் மனந்திரும்பாவிட்டால், நீங்கள் எல்லாரும் அதுபோலவே[a] அழிந்துபோவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதே விதமாக.’ ‘அதுபோலவே’ என்பது முற்றிலும் அதே முறையிலான மரணத்தை அவசியம் குறிக்காமல், அதேபோன்ற திடீர் தீர்ப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: இல்லை
  rationale: முந்தைய சூழலில் மறைமுகமாக முன்வைக்கப்பட்ட கருத்தை உறுதியாக மறுக்கிறது; இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: லூக்காவில் வரும் நேரடியும் வலியுறுத்தலுமுள்ள உரையாடல் முறையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: மறுக்கப்பட்ட கருத்துக்கும் தொடர்ந்து வரும் எச்சரிக்கைக்கும் இடையிலான முரண்பாட்டைக் குறிக்கிறது.
- source_word: ἐὰν μὴ
  choice: மனந்திரும்பாவிட்டால்
  rationale: எதிர்மறை நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘unless’ என்பதன் நிபந்தனை வலிமையை காக்கிறது.
- source_word: μετανοῆτε
  choice: மனந்திரும்பு
  rationale: வெறும் அறிவுசார் எண்ணமாற்றம் அல்லாமல், கடவுளை நோக்கிய ஒழுக்க மற்றும் ஆன்மிகத் திருப்பத்தையும் உள்ளடக்கும் நிலைபெற்ற, புரியத்தக்க தமிழ் சொல்.
- source_word: πάντες
  choice: நீங்கள் எல்லாரும்
  rationale: இயேசுவைக் கேட்போர் அனைவருக்கும் எச்சரிக்கை பொருந்துவதைத் தெளிவாக வலியுறுத்துகிறது.
- source_word: ὁμοίως
  choice: அதுபோலவே
  rationale: முந்தைய நிகழ்வுகளோடு உள்ள ஒப்பீட்டைத் தக்கவைக்கிறது; முற்றிலும் அதே விதமான மரணத்தை அவசியம் குறிக்காது.
- source_word: ἀπολεῖσθε
  choice: அழிந்துபோவீர்கள்
  rationale: உடல் மரணம் மட்டுமென்றோ நித்தியத் தண்டனை மட்டுமென்றோ குறுக்காமல், வரவிருக்கும் அழிவு அல்லது கேட்டைத் திறந்த நிலையில் காக்கிறது.
theological_decisions:
- issue: ἀπολεῖσθε என்பதன் தீர்ப்பு சார்ந்த பரப்பு
  choice: அழிந்துபோவீர்கள்
  alternative: இறந்துபோவீர்கள் / நித்திய தண்டனை அடைவீர்கள்
  rationale: கிரேக்கச் சொல் இங்கு அழிவையும் தீர்ப்பின் தீவிரத்தையும் உணர்த்துகிறது; ஆனால் அதன் துல்லியமான வடிவத்தையோ இறுதி பரப்பையோ குறிப்பிடவில்லை. எனவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: μετανοῆτε என்பதன் பொருள்
  choice: மனந்திரும்பாவிட்டால்
  alternative: உங்கள் சிந்தனையை மாற்றாவிட்டால்
  rationale: μετανοέω என்பது இச்சூழலில் வெறும் கருத்துமாற்றத்தைவிட கடவுளை நோக்கிய மனமும் வாழ்வும் திரும்புதலைக் குறிக்கிறது; ‘மனந்திரும்புதல்’ இதன் ஒழுக்க மற்றும் ஆன்மிக வலிமையை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி நடை. ‘மனந்திரும்பு’ என்பது வேதாகமப் பயன்பாட்டில் நிலைபெற்றிருந்தாலும் இன்றைய வாசகருக்கும் இயல்பாகப் புரியும். ஒப்பீட்டின் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
