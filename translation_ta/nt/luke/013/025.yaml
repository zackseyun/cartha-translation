- from: வீட்டுத் தலைவர் எழுந்து கதவை மூடிய பிறகு[a], நீங்கள் வெளியே நின்று கதவைத் தட்டத் தொடங்கி, ‘ஆண்டவரே, எங்களுக்குக் கதவைத் திறந்தருளும்’ என்று சொல்வீர்கள். அப்போது அவர் உங்களுக்குப் பதிலாக, ‘நீங்கள் எங்கிருந்து வந்தவர்கள் என்று எனக்குத் தெரியாது[b]’ என்பார்.
  to: வீட்டுத் தலைவர் எழுந்து கதவை மூடிய பிறகு[a], நீங்கள் வெளியே நின்றுகொண்டு கதவைத் தட்டத் தொடங்குவீர்கள்; ‘ஆண்டவரே[b], எங்களுக்குக் கதவைத் திறக்கவும்’ என்று சொல்வீர்கள். அப்போது அவர் உங்களுக்குப் பதிலளித்து, ‘உங்களை எனக்குத் தெரியாது; நீங்கள் எங்கிருந்து வந்தவர்கள் என்பதும் தெரியாது[c]’ என்பார்.
