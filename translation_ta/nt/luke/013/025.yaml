id: LUK.13.25
reference: Luke 13:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: ta
  text: வீட்டுத் தலைவர் எழுந்து கதவை மூடிய பிறகு[a], நீங்கள் வெளியே நின்றுகொண்டு கதவைத் தட்டத் தொடங்குவீர்கள்; ‘ஆண்டவரே[b], எங்களுக்குக் கதவைத் திறக்கவும்’ என்று சொல்வீர்கள். அப்போது அவர் உங்களுக்குப் பதிலளித்து, ‘உங்களை எனக்குத் தெரியாது; நீங்கள் எங்கிருந்து வந்தவர்கள் என்பதும் தெரியாது[c]’ என்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “வீட்டுத் தலைவர் எழுந்து கதவை மூடிய பின்பு.”'
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க κύριε என்பதற்கு வழக்கமாக “ஆண்டவரே”; உவமையின் சூழலில் “தலைவரே” அல்லது “ஐயா” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: 'கிரேக்கத்தில் இன்னும் சொற்சொல்லாக: “உங்களை எனக்குத் தெரியாது, நீங்கள் எங்கிருந்து வந்தவர்கள் என்று.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: பிறகு
  rationale: காலத்தை அறிமுகப்படுத்தும் இக்கட்டமைப்பு ‘எப்போது/ஒருமுறை/பிறகு’ என்ற பொருளைத் தருகிறது; தமிழில் தொடர்ச்சியை இயல்பாகக் காட்ட ‘பிறகு’ பொருத்தமானது.
- source_word: ἐγερθῇ
  choice: எழுந்து
  rationale: இங்கு உயிர்த்தெழுதலை அல்ல, அமர்ந்த அல்லது சாய்ந்த நிலையிலிருந்து எழுவதைக் குறிக்கிறது.
- source_word: ὁ οἰκοδεσπότης
  choice: வீட்டுத் தலைவர்
  rationale: வீட்டின் மீது அதிகாரமுள்ளவரைக் குறிக்கும்; ‘வீட்டு உரிமையாளர்’ என்பதைக் காட்டிலும் அதிகார நுணுக்கத்தைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: கதவை மூடிய
  rationale: கதவை மூடி அணுகலைத் தடுக்கும் தீர்மானமான செயலைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἔξω ἑστάναι
  choice: வெளியே நின்று
  rationale: வெளியில் நிலைத்திருக்கும் நிலையைக் கூறும் கிரேக்கத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: κρούειν τὴν θύραν
  choice: கதவைத் தட்ட
  rationale: κρούω என்பதன் வழக்கமான பொருளையும் தொடர்ந்த வேண்டுகோளையும் மிகைப்படுத்தாமல் தருகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் முதன்மையான வேதாகமத் தமிழாக்கத்தைப் பாதுகாக்கிறது; உவமையின் சூழலில் ‘ஐயா’ அல்லது ‘தலைவரே’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
- source_word: ἄνοιξον ἡμῖν
  choice: எங்களுக்குக் கதவைத் திறந்தருளும்
  rationale: தமிழில் வேண்டுகோளை இயல்பாகவும் மரியாதையுடனும் வெளிப்படுத்துகிறது; ‘கதவை’ என்பது சூழலிலிருந்து தெளிவாக நிரப்பப்பட்டுள்ளது.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: நீங்கள் எங்கிருந்து வந்தவர்கள் என்று எனக்குத் தெரியாது
  rationale: கிரேக்கத்தில் ‘உங்களை’ என்பதும் ‘எங்கிருந்து வந்தவர்கள்’ என்பதும் உள்ளன; சொற்சொல்லான இடைநிறுத்தத்தை விட இவ்வாக்கியம் தமிழில் இயல்பாக இருந்து, அடையாளம்/தோற்றம் அறியாமை என்ற முழுப் பொருளையும் தருகிறது.
theological_decisions:
- issue: உவமைக்குள் κύριε என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: ஐயா / தலைவரே
  rationale: ‘ஆண்டவரே’ என்பது κύριος என்பதன் வழக்கமான வேதாகம இணைப்பையும் லூக்காவின் பரந்த இறையியல் ஒலியையும் பாதுகாக்கிறது; அதே நேரம் இங்கு மரியாதை அழைப்பாகவும் இருக்கக்கூடிய ambiguity-ஐ அடிக்குறிப்பு சுட்டுகிறது.
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ என்பதன் தொடர்பு
  choice: நீங்கள் எங்கிருந்து வந்தவர்கள் என்று எனக்குத் தெரியாது
  alternative: உங்களை எனக்குத் தெரியாது—நீங்கள் எங்கிருந்து வந்தவர்கள் என்பதும் தெரியாது
  rationale: முதன்மை உரை இயல்பான நவீன தமிழைத் தருகிறது; கிரேக்கத்தின் அசல், சற்றுக் கடினமான அமைப்பை அடிக்குறிப்பு பாதுகாக்கிறது. இதனால் நிராகரிப்பின் வலிமை குறைக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திறந்தருளும்’ என்பது வேண்டுகோளின் மரியாதைத் தொனியைத் தருகிறது. பிரதான உரையில் இயல்பான தமிழ் தொடரமைப்பு முன்னிலைப்படுத்தப்பட்டு, கிரேக்கத்தின் கடினமான சொற்சொல் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
