  source_fidelity: திருத்தம் தேவை. வரைவின் இறுதிப் பதில் கிரேக்கத்தின் வெளிப்படையான ὑμᾶς (‘உங்களை’) என்பதை முதன்மை உரையில் விடுத்துவிடுகிறது; அடிக்குறிப்பு மட்டும் அதை ஈடு செய்யக் கூடாது. மேலும், ‘உங்களுக்குப் பதிலாக’ என்பது ‘உங்களுக்குப் பதில்’ என்ற பொருளைத் தராமல் ‘உங்களுக்குப் பதிலாக/உங்கள் இடத்தில்’ என்ற தவறான பொருளைத் தருகிறது. ‘பதிலளித்து’ என்பது ἀποκριθεὶς ἐρεῖ என்பதற்கு இயல்பானதும் துல்லியமானதும் ஆகும்.
  naturalness: ‘வெளியே நின்றுகொண்டு கதவைத் தட்டத் தொடங்குவீர்கள்’ என்பது நிலைத்து வெளியே நிற்றல் மற்றும் பின்னர் தட்டத் தொடங்குதல் என்ற தொடரை நவீன தரத்தமிழில் தெளிவாகக் காட்டுகிறது. ‘எங்களுக்குக் கதவைத் திறக்கவும்’ மரியாதையான வேண்டுகோளாக உள்ளது; ‘திறந்தருளும்’ என்ற சொல் மூலத்தில் இல்லாத அருளல் நுணுக்கத்தைத் தவிர்க்கிறது.
