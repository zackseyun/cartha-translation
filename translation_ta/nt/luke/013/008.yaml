id: LUK.13.8
reference: Luke 13:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: ta
  text: அதற்கு அவன் அவரிடம், “ஆண்டவரே, இந்த ஆண்டும் இதை விட்டுவிடுங்கள்[a]; நான் இதன் சுற்றிலும் தோண்டி, சாண எரு இடும்வரை[b],” என்று பதிலளித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதை அப்படியே இருக்க விடுங்கள்” அல்லது “இதை விட்டுவையுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “சாணம்/மல உரம் இடும்வரை”; பொதுவாக, “எருவிடும்வரை.”
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: அதற்கு அவன் அவரிடம் … என்று பதிலளித்தான்
  rationale: கிரேக்கத்தின் வழக்கமான ‘பதிலளித்து, சொல்கிறான்’ என்ற கதைநடையை நவீன தமிழில் இயல்பாக ஒருங்கிணைக்கிறது; αὐτῷ என்பதையும் ‘அவரிடம்’ என்று வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதைக்குரிய அழைப்பாகவும் κύριος என்பதற்கான நிலையான வேதாகமத் தமிழாக்கமாகவும் பொருந்துகிறது; உவமையின் சூழலில் இது உரிமையாளரை அழைக்கும் மரியாதைச் சொல்லாகச் செயல்படலாம்.
- source_word: ἄφες αὐτὴν
  choice: இதை விட்டுவிடுங்கள்
  rationale: மரத்தை இப்போதைக்கு அப்படியே இருக்க அனுமதிக்க வேண்டும் என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; ‘வெட்டாமல் காப்பாற்றுங்கள்’ என்ற உட்குறிப்பை நேரடியாக உரையில் சேர்ப்பதில்லை.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: இந்த ஆண்டும்
  rationale: கூடுதலாக இந்த ஆண்டையும் அளிக்குமாறு கேட்கும் καί-யின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἕως ὅτου
  choice: …வரை
  rationale: தோட்டக்காரன் செய்யவிருக்கும் செயல்கள் நிறைவேறும் கால எல்லையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: σκάψω περὶ αὐτὴν
  choice: இதைச் சுற்றிலும் கொத்தி
  rationale: மரத்தைச் சுற்றியுள்ள மண்ணைக் கொத்திக் கிளறுதல் என்ற வேளாண்மைச் செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; வெறும் ‘தோண்டி’ என்பதைவிட இச்சூழலில் துல்லியமானது.
- source_word: βάλω κόπρια
  choice: எருவிடு
  rationale: κόπρια என்பது உரமாகப் பயன்படுத்தப்படும் சாணம் அல்லது இயற்கை எருவைக் குறிக்கிறது. ‘எருவிடு’ என்பது தமிழில் இயல்பான வேளாண்மைச் சொல்; அடிக்குறிப்பு அதன் குறிப்பான பொருளைத் தருகிறது.
theological_decisions:
- issue: உவமையில் κύριος என்ற அழைப்பின் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா / எஜமானே
  rationale: இங்கு திராட்சைத்தோட்ட உரிமையாளருக்கான மரியாதை அழைப்பாக இருக்க முடிந்தாலும், κύριος என்பதன் வழக்கமான வேதாகம ஒற்றுமையை ‘ஆண்டவரே’ காக்கிறது. இதனால் அந்தப் பாத்திரமே நேரடியாகத் தெய்வீக நபர் என்று உரை தீர்மானிப்பதாகக் கொள்ள வேண்டியதில்லை.
- issue: ἄφες என்பதில் அடங்கியுள்ள அவகாசம்
  choice: விட்டுவிடுங்கள்
  alternative: வெட்டாமல் காப்பாற்றுங்கள் / இன்னும் ஓராண்டு அவகாசம் கொடுங்கள்
  rationale: முந்தைய வசனத்தின் வெட்டும் கட்டளையால் ‘காப்பாற்றுங்கள்’ என்ற கருத்து உட்குறிப்பாக இருந்தாலும், வினைச்சொல் நேரடியாக ‘விடு, அப்படியே இருக்க அனுமதி’ என்பதையே கூறுகிறது; ஆகவே உட்குறிப்பை முதன்மை உரையில் மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நிகழ்காலக் கதைவினை தமிழில் இயல்பான இறந்தகாலமாக மாற்றப்பட்டுள்ளது. ‘கொத்தி’ மற்றும் ‘எருவிடு’ என்ற பொதுவாகப் புரியும் வேளாண்மைச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
