  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: ta
  text: அந்த நேரத்திலேயே[a] பரிசேயர்களில் சிலர் அவரிடம் வந்து, “வெளியேறி இங்கிருந்து போய்விடுங்கள்[b]; ஏனெனில் ஏரோது உம்மைக் கொல்ல விரும்புகிறான்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதே நேரத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெளியேறி இங்கிருந்து புறப்பட்டுப் போங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: அந்த நேரத்திலேயே
  rationale: αὐτῇ தரும் குறிப்பிட்ட நேரத்தையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσῆλθάν
  choice: அவரிடம் வந்து
  rationale: இயேசுவை அணுகி வந்தார்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: τινες Φαρισαῖοι
  choice: பரிசேயர்களில் சிலர்
  rationale: τινες குறிக்கும் குறிப்பிடப்படாத சிலரைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λέγοντες αὐτῷ
  choice: அவரிடம் வந்து … என்றார்கள்
  rationale: முதன்மை வினையுடன் ஒரே நேரத்தில் நிகழும் பங்கேற்பு வினையை வாசிக்க எளிதான தமிழ் வாக்கியமாக மாற்றுகிறது.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: வெளியேறி இங்கிருந்து போய்விடும்
  rationale: இரு கட்டளை வினைகளையும் தக்கவைத்து, அந்த இடத்தை விட்டு நீங்குமாறு கூறும் வலியுறுத்தலை இயல்பான மரியாதை ஒருமை நடையில் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள எச்சரிக்கைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: Ἡρῴδης
  choice: ஏரோது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: θέλει
  choice: விரும்புகிறான்
  rationale: θέλω என்பதன் விருப்பம் அல்லது ஆசை என்ற அடிப்படைப் பொருளைத் தருகிறது; திட்டமிட்ட நோக்கம் என மிகைப்படுத்தவில்லை.
- source_word: ἀποκτεῖναι
  choice: கொல்ல
  rationale: முறையான மரணதண்டனையை அவசியம் குறிக்காமல், உயிரைக் கொல்லுதல் என்ற பொதுவான பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: பரிசேயர்களின் எச்சரிக்கையின் நோக்கம்
  choice: அவர்களுடைய கூற்றை எச்சரிக்கையாக மட்டும் நேரடியாக மொழிபெயர்த்து, அவர்களின் உள்நோக்கத்தைத் தீர்மானிக்காமல் விடுதல்
  alternative: அவர்கள் உண்மையான அக்கறையால் எச்சரித்தார்கள் அல்லது இயேசுவை அச்சுறுத்தி அனுப்ப முயன்றார்கள் என்று வெளிப்படையாகக் காட்டுதல்
  rationale: கிரேக்க உரை அவர்கள் கூறியதைப் பதிவு செய்கிறது; அவர்கள் நேர்மையானவர்களா, வஞ்சகமானவர்களா, ஏரோதுடன் இணைந்தவர்களா என்பதை வெளிப்படையாகச் சொல்லவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமைக் கட்டளைக்கு மரியாதை வினைமுற்றான “போய்விடும்” என்பதும், அவரைக் குறிக்க “உம்மை” என்பதும் பயன்படுத்தப்பட்டுள்ளன; பரிசேயர்களின் நோக்கம் விளக்கிச் சேர்க்கப்படவில்லை.
