id: LUK.13.11
reference: Luke 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: ta
  text: இதோ, பதினெட்டு ஆண்டுகளாகப் பலவீனத்தின் ஆவியைக் கொண்டிருந்த ஒரு பெண் இருந்தாள். அவள் கூனியிருந்தாள்; முழுமையாக நிமிர முடியாதவளாக இருந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் புதிய நபரின் மீது கவனத்தை ஈர்க்கும் இடைச்சொல்லின் உயிரோட்டத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: இச்சூழலில் முதன்முறையாக அறிமுகப்படுத்தப்படும் பெண்ணைக் குறிக்கும் வரையறையற்ற சொல்லாக்கம்.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: பலவீனப்படுத்தும் ஓர் ஆவியால் பாதிக்கப்பட்டிருந்த
  rationale: πνεῦμα என்ற வெளிப்படையான ‘ஆவி’ குறிப்பைத் தக்கவைத்து, அந்த ஆவி அவளுடைய நீண்டகால உடல் இயலாமையோடு தொடர்புடையது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பிடித்திருந்தது’ என்று மொழிபெயர்த்து பேய்ப்பிடித்தல் என்ற குறிப்பிட்ட விளக்கத்தைத் திணிப்பதைத் தவிர்க்கிறது.
- source_word: ἔτη δεκαοκτώ
  choice: பதினெட்டு ஆண்டுகளாக
  rationale: கால நீடிப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: συγκύπτουσα
  choice: கூனிப்போய்
  rationale: அவளுடைய உடல் வளைந்திருந்த நிலையைத் தெளிவாகவும் சுருக்கமாகவும் எடுத்துரைக்கிறது.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: நிமிர முடியாமல்
  rationale: வளைந்த நிலையிலிருந்து நேராக நிமிர்வதற்கான இயலாமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ παντελές
  choice: முழுமையாக
  rationale: அவளால் முழு அளவில் நிமிர இயலவில்லை என்பதைச் சொல்லும் தீவிரப்படுத்தும் தொடரைப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: πνεῦμα ἀσθενείας என்பது வெறும் மருத்துவக் குறைபாட்டைக் குறிக்கிறதா அல்லது ஆவிக்குரிய காரணத்தைக் குறிக்கிறதா
  choice: முதன்மை உரையில் ‘ஆவி’ என்பதை வெளிப்படையாகத் தக்கவைத்து, ‘பலவீனப்படுத்தும் ஓர் ஆவியால் பாதிக்கப்பட்டிருந்த’ என்று மொழிபெயர்த்தல்
  alternative: ‘பலவீனத்தின் ஆவியைக் கொண்டிருந்தாள்’ அல்லது ஆவியைக் குறிப்பிடாமல் ‘நோயுற்றிருந்தாள்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை πνεῦμα என்பதைத் தெளிவாகக் குறிப்பிடுவதால் அதை நீக்கக்கூடாது. அதேவேளையில், இந்த வசனம் கூறுவதைவிட மேலாகப் பேய்ப்பிடித்தல் என்ற குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பு உறுதிப்படுத்தக்கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘இதோ’ என்ற இலக்கியப் பயன்பாடு கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘பேய்ப்பிடித்த’ போன்ற அதிகப்படியான விளக்கச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
