    reason: πνεῦμα (‘ஆவி’) மற்றும் ἀσθενείας (‘பலவீனம்/உடல் இயலாமை’) ஆகியவற்றைத் தக்கவைத்து, மாற்று இயல்பான சொல்லாக்கம் ஓரளவு விளக்கமளிப்பது என்பதைத் தெரிவிக்கிறது.
