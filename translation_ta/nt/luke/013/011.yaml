revisions:
- from: இதோ, பதினெட்டு ஆண்டுகளாகப் பலவீனப்படுத்தும் ஓர் ஆவியால்[a] பாதிக்கப்பட்டிருந்த ஒரு பெண் அங்கே இருந்தாள். அவள் கூனிப்போய், முழுமையாக நிமிர முடியாமல் இருந்தாள்.
  to: இதோ, பதினெட்டு ஆண்டுகளாகப் பலவீனத்தின் ஆவியைக் கொண்டிருந்த ஒரு பெண் இருந்தாள். அவள் கூனியிருந்தாள்; முழுமையாக நிமிர முடியாதவளாக இருந்தாள்.
  rationale: 'The revision restores the Greek expression’s form and ambiguity: the woman is described as having a spirit of weakness, rather than as explicitly being afflicted by a disabling spirit. It retains the narrative attention marker, indefinite introduction of the woman, eighteen-year duration, bent posture, and inability to straighten fully. The footnote is retained only to clarify the source wording and identify the causal-sounding alternative as interpretive.'
