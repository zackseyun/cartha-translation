  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: ta
  text: ஆபிரகாமின் மகளான இந்தப் பெண்ணைச் சாத்தான் இதோ, பதினெட்டு ஆண்டுகளாகக் கட்டிவைத்திருக்கிறான்; இவளை இந்தப் பிணைப்பிலிருந்து ஓய்வுநாளில் விடுவிக்க வேண்டாமா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: ஆபிரகாமின் மகள்
  rationale: உறவுமுறை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; இது உடன்படிக்கை மக்களுக்குரியவர் என்ற உட்பொருளையும் தக்கவைக்கிறது.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: கட்டிவைத்திருந்தான் / விடுவிக்க / கட்டு
  rationale: மூலத்தில் தொடர்ந்து வரும் கட்டுதல்–அவிழ்த்தல் சொற்பிணைப்பை தமிழில் இயன்றவரை காக்கிறது; இயல்பான தமிழுக்காக λυθῆναι என்பதற்கு ‘விடுவிக்க’ பயன்படுத்தப்பட்டது.
- source_word: ἰδού
  choice: இதோ
  rationale: கேட்போரின் கவனத்தை பதினெட்டு ஆண்டுகள் என்ற கால அளவுக்கு ஈர்க்கும் உரையாடல் வலியுறுத்தலை வெளிப்படையாகக் காக்கிறது.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ஓய்வுநாளில்
  rationale: தமிழ் வேதாகம நடையில் பரவலாகப் புரியக்கூடிய சொல்; ‘சபத்தின் நாளில்’ என்பதைக் காட்டிலும் இயல்பானது.
theological_decisions:
- issue: சாத்தானின் செயற்பாடு மற்றும் பெண்ணின் நிலை
  choice: ‘சாத்தான் ... கட்டிவைத்திருந்தான்’ என்று மூலத்தின் நேரடி காரணக் குறிப்பைப் பாதுகாத்தல்
  alternative: நோயை மட்டும் குறிப்பிட்டு சாத்தானின் செயற்பாட்டை மென்மையாக்குதல்
  rationale: ὁ Σατανᾶς தான் ἔδησεν என்ற வினையின் வெளிப்படையான எழுவாய்; உரையின் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கக் கூடாது.
- issue: ‘ஆபிரகாமின் மகள்’ என்பதன் பொருள்
  choice: உருவகத்தை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: ‘ஆபிரகாமின் வழிவந்த யூதப் பெண்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்தச் சொற்றொடர் வம்சம், உடன்படிக்கைச் சேர்ந்திருத்தல், மதிப்பு ஆகிய நுணுக்கங்களைத் தாங்கக்கூடும்; ஒன்றை மட்டும் தேர்ந்து உரையில் திணிக்காமல் ambiguity பாதுகாக்கப்படுகிறது.
- issue: οὐκ ἔδει என்பதின் கட்டாய/தகுதி நுணுக்கம்
  choice: ‘விடுவிக்க வேண்டாமா?’
  alternative: ‘விடுவிப்பது தகுந்ததல்லவா?’
  rationale: ἔδει வெளிப்படுத்தும் அவசியம் அல்லது தகுந்த கடமை என்ற வலிமையை இயல்பான தமிழில் கேள்வி வடிவில் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ். கிரேக்க வாக்கியத்தின் வாதமிக்க எதிர்மறைக் கேள்வி வடிவமும் ‘இதோ’ என்ற கவன ஈர்ப்பும் பாதுகாக்கப்பட்டுள்ளன. ‘இந்தப் பெண்ணை’ தொடக்கத்துக்கு கொண்டு வந்து இயல்பான தமிழ் தொடரமைப்பு பயன்படுத்தப்பட்டது.
