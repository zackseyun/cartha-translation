id: LUK.13.19
reference: Luke 13:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: ta
  text: அது கடுகு விதையைப் போன்றது. ஒரு மனிதன் அதை எடுத்து தன் தோட்டத்தில் எறிந்தான். அது வளர்ந்து ஒரு மரமாக ஆனது[a]. வானத்துப் பறவைகள்[b] அதன் கிளைகளில் தங்கின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘ஒரு மரமாக ஆனது’ என்றே உள்ளது; வளர்ச்சியைப் பற்றிய உவமையின் பெரிதாக்கப்பட்ட படிமம் இவ்வாறு காக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வானத்துப் பறவைகள்’ என்பதை ‘ஆகாயத்துப் பறவைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: அது … போன்றது
  rationale: அரசைக் குறித்த உவமைகளில் வரும் ஒப்புமைச் சொற்றொடரை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: κόκκῳ σινάπεως
  choice: கடுகு விதை
  rationale: κόκκος என்பது தானியம் அல்லது விதை எனப் பொருள்படலாம்; இச்செடியின் சூழலில் ‘கடுகு விதை’ என்பதே இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ஒரு மனிதன் அதை எடுத்து
  rationale: உவமையில் ஒரு தனிப்பட்ட ஆண் பாத்திரமாக வரும் ἄνθρωπος என்பதன் ஒருமையையும் பாலினத்தையும் காக்கிறது.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: தன் தோட்டத்தில் எறிந்தான்
  rationale: βάλλω என்பதன் உயிரோட்டமான ‘எறிதல்’ பொருளையும், κῆπος என்பதன் குறிப்பான ‘தோட்டம்’ பொருளையும் காக்கிறது; ‘விதைத்தான்’ என்று மூலத்தில் இல்லாத வினையைப் புகுத்தவில்லை.
- source_word: ηὔξησεν
  choice: அது வளர்ந்து
  rationale: இச்சூழலில் உள்ள இயல்பான வளர்ச்சிப் பொருளை எளிய நவீனத் தமிழில் தருகிறது.
- source_word: ἐγένετο εἰς δένδρον
  choice: ஒரு மரமாக ஆனது
  rationale: δένδρον என்பதன் ‘மரம்’ என்ற உருவகத்தைத் தாவரவியல் காரணத்தால் மென்மைப்படுத்தாமல், உவமையின் வியப்பூட்டும் வளர்ச்சிப் படிமத்தைக் காக்கிறது.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: οὐρανός இங்கு மேலுள்ள வான்வெளியைக் குறிப்பதால், இறையியல் சார்ந்த விளக்கமின்றி இயல்பான தமிழில் மொழிபெயர்க்கிறது.
- source_word: κατεσκήνωσεν
  choice: தங்கின
  rationale: இவ்வினை குடியிருத்தல் அல்லது தங்குதல் என்ற படிமத்தைக் கொண்டது; பறவைகள் கிளைகளில் தங்கின என்பது இயல்பானதும், ‘கூடு கட்டின’ என்ற கூடுதல் குறிப்பைத் தவிர்ப்பதும் ஆகும்.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: அதன் கிளைகளில்
  rationale: κλάδοις என்பதற்கு நேரான ‘கிளைகள்’ என்ற பொருளைத் தருகிறது; ‘அதன்’ என்பது மரமாக வளர்ந்த கடுகுச் செடியைக் குறிக்கிறது.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பாலினக் குறிப்பு
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தில் உவமையின் பாத்திரம் ஆண்பால் ஒருமையில் வருவதால், பாலினத்தை நடுநிலைப்படுத்தாமல் காக்கப்பட்டது.
- issue: கடுகுச் செடியைக் குறிக்கும் δένδρον உருவகம்
  choice: மரம்
  alternative: பெரிய செடி அல்லது புதர்
  rationale: மூலம் வெளிப்படையாக δένδρον (‘மரம்’) என்கிறது. தாவரவியல் இயல்புக்கேற்ப படிமத்தைச் சுருக்காமல், உவமையின் மிகைப்படுத்தப்பட்ட வளர்ச்சியையும் இறையியல் பதற்றத்தையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியைத் தெளிவாக்கச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘எறிந்தான்’ என்ற உயிரோட்டமான வினையும் ‘மரம்’ என்ற வியப்பூட்டும் படிமமும் திட்டமிட்டு காக்கப்பட்டுள்ளன.
