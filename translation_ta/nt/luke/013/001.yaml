base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: ta
  text: அதே நேரத்தில் அங்கிருந்த சிலர், பிலாத்து கலிலேயர்களின் இரத்தத்தை அவர்களுடைய பலிகளோடு கலந்ததைப் பற்றி அவரிடம் தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய பலிகளுடன் இரத்தத்தை ஒன்றுசேர்த்ததை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: அங்கிருந்த சிலர்
  rationale: பாரῆσαν என்பதன் இறந்தகாலத் தொடர்நிலை இங்கு வருகையைவிட அங்கு இருந்த நிலையைக் குறிக்கிறது. δέ-யின் மென்மையான தொடர்பு அடுத்துள்ள காலக்குறிப்புடன் இயல்பாக வெளிப்படுவதால் தனியாக ஒரு வலுவான இணைப்புச்சொல் சேர்க்கப்படவில்லை.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: அதே நேரத்தில்
  rationale: குறிப்பிட்ட அதே காலத்தைச் சுட்டும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: அவரிடம் தெரிவித்தார்கள்
  rationale: ஒரு செய்தியை அல்லது நிகழ்வைப் பற்றிய அறிக்கையைச் சொல்வதைக் குறிக்கும் பங்கேற்புவினை, தமிழில் இயல்பான முறையில் முதன்மை வினையாக வழங்கப்பட்டுள்ளது.
- source_word: περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα
  choice: கலிலேயர்கள் சிலருடைய இரத்தத்தைப் ... பற்றி
  rationale: τινες அறிக்கை அளித்தவர்களைக் குறிக்கிறது; τῶν Γαλιλαίων என்பது குறிப்பிட்ட கலிலேயர்களைக் குறித்தாலும் தமிழில் இயல்பாகவும் தவறான பொதுமைப்படுத்தலைத் தவிர்க்கவும் ‘கலிலேயர்கள் சிலர்’ என வழங்கப்பட்டுள்ளது.
- source_word: Πιλᾶτος ἔμιξεν
  choice: பிலாத்து ... கலந்ததை
  rationale: μίγνυμι என்பதன் நேரடியான ‘கலத்தல்’ பொருள் காக்கப்படுகிறது; சம்பவம் எவ்வாறு நடந்தது என்பதை விளக்கும் கூடுதல் சொற்கள் சேர்க்கப்படவில்லை.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: அவர்களுடைய பலிகளோடு
  rationale: μετά என்பதன் ‘உடன்/ஓடு’ பொருளையும் αὐτῶν என்பதன் உடைமைத் தொடர்பையும் காக்கிறது. அவர்கள் பலி செலுத்திக்கொண்டிருந்தார்கள் என்ற விளக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பிலாத்தின் செயலின் வரலாற்று மற்றும் அறநெறி சார்ந்த உட்பொருள்
  choice: கலிலேயர்களின் இரத்தத்தை அவர்களுடைய பலிகளோடு பிலாத்து கலந்ததாக நேரடியாக வழங்குதல்
  alternative: ‘அவர்கள் பலி செலுத்திக்கொண்டிருந்தபோது பிலாத்து அவர்களைக் கொன்றான்’ என்று விளக்கி விரித்துரைத்தல்
  rationale: மூலவசனம் அதிர்ச்சியூட்டும் நிகழ்வைத் தெரிவிக்கிறது; ஆனால் அது நடந்த விதத்தையோ அதன் இறையியல் பொருளையோ இங்கே விளக்கவில்லை. ஆகவே மூலத்தின் கடுமையான, சுருக்கமான சொல்லாக்கம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அவரிடம்’ என்ற சுட்டுப்பெயர் மூலத்தின் αὐτῷ-ஐப் பின்பற்றி, சூழலில் இயேசுவைக் குறிக்கிறது. பலி செலுத்தும் நிகழ்வின் நடைமுறையை விளக்கிச் சேர்க்காமல் மூலத்தின் சுருக்கமும் பதற்றமும் காக்கப்பட்டுள்ளன.
