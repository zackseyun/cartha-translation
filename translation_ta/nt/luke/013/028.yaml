id: LUK.13.28
reference: Luke 13:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: ta
  text: ஆபிரகாமும் ஈசாக்கும் யாக்கோபும் இறைவாக்கினர்கள் அனைவரும் கடவுளின் அரசில் இருப்பதையும், நீங்களோ வெளியே தள்ளப்படுவதையும்[a] நீங்கள் காணும்போது, அங்கே அழுகையும் பற்கடிப்பும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘வெளியே துரத்தப்படுவதையும்.’ கிரேக்கச் சொற்றொடர் வலுக்கட்டாயமாக விலக்கப்படுவதை வலியுறுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: நியாயத்தீர்ப்பில் விலக்கப்படும் இடத்தைச் சுட்டும் இடவினையடை; தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ὁ κλαυθμὸς
  choice: அழுகை
  rationale: துயரத்தின் வெளிப்பாட்டை மிகைப்படுத்தாமல் சொல்லும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: வேதனை அல்லது சீற்றத்தை வெளிப்படுத்தும் கிரேக்க மரபுத்தொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ὅταν ὄψησθε
  choice: நீங்கள் காணும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் இங்கு எதிர்கால நிகழ்வைச் சுட்டுகிறது; தமிழ் சூழலில் ‘காணும்போது’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντας τοὺς προφήτας
  choice: இறைவாக்கினர்கள் அனைவரும்
  rationale: πάντας என்பதன் முழுமையைக் காத்து, προφήτας என்பதற்கு பொதுவாகப் புரியும் மரியாதையான நவீனத் தமிழ் சொல்லைப் பயன்படுத்துகிறது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: கடவுளின் அரசில்
  rationale: βασιλεία என்பதன் அரசு/ஆட்சிப்பரப்பு சார்ந்த திறந்த பொருளைத் தேவையின்றி விளக்காமல் காக்கிறது.
- source_word: ὑμᾶς δὲ
  choice: நீங்களோ
  rationale: δέ குறிக்கும் முரண்பாட்டையும் வெளிப்படையாக உள்ள ὑμᾶς என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκβαλλομένους ἔξω
  choice: வெளியே தள்ளப்படுவதையும்
  rationale: செயப்பாட்டு வினையையும் வலுக்கட்டாயமான விலக்குதலையும் காக்கிறது; ‘அனுப்பப்படுதல்’ போன்ற மென்மையான சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பின் உருவகம்
  choice: அரசிலிருந்து வெளியே தள்ளப்படுதல், அழுகை, பற்கடிப்பு ஆகிய உறுதியான உருவகங்களையே அப்படியே வைத்தல்
  alternative: ‘இறுதி ஆக்கினை’ அல்லது ‘மிகுந்த துயரம்’ போன்ற விளக்கப் பரிமாற்றம்
  rationale: வசனம் விலக்கப்படுதலையும் அதனோடு தொடர்புடைய வேதனையையும் காட்டுகிறது; ஆனால் இறுதி நியாயத்தீர்ப்பைப் பற்றிய முழுக் கோட்பாட்டை இவ்வசனம் தனியாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தில் ‘காண்பீர்கள்’ என்பதன் இரு நேரடி பொருட்களாக முற்பிதாக்களும் இறைவாக்கினர்களும், வெளியே தள்ளப்படும் கேட்போரும் அமைவதைத் தமிழில் தெளிவாக்க வாக்கிய உறுப்புகள் இயல்பான வரிசையில் மாற்றப்பட்டுள்ளன.
