revisions:
- from: 'இதோ, உங்கள் வீடு உங்களிடமே விட்டுவிடப்படுகிறது.[a][b] நான் உங்களுக்குச் சொல்கிறேன்: ‘ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்!’ என்று நீங்கள் சொல்லும் காலம் வரும்வரை,[c][d] நீங்கள் என்னை நிச்சயமாகக் காணமாட்டீர்கள்.'
  to: 'இதோ, உங்கள் வீடு உங்களுக்கே கைவிடப்படுகிறது.[a][b] நான் உங்களுக்குச் சொல்கிறேன்: நீங்கள், ‘ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்!’ என்று சொல்லும் காலம் வரும்வரை, என்னை நிச்சயமாகக் காணமாட்டீர்கள்.[c][d]'
  rationale: The revision improves idiomatic Tamil and restores the source’s assertion-then-temporal-limit sequence. It retains the ambiguity of “your house,” the passive/judicial potential of ἀφίεται, the force of οὐ μή, and the open temporal reference of the final quotation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal lexical elements and the emphatic future negation. However, placing the temporal clause before the negated main clause makes the Tamil sentence less direct than the Greek sequence and weakens its rhetorical progression. “உங்களிடமே விட்டுவிடப்படுகிறது” is also needlessly awkward: “விட்டுவிடு” can sound like a casual or reflexive act rather than the solemn passive/judicial abandonment expressed by ἀφίεται.'
  naturalness: The revised wording follows natural modern Tamil syntax while retaining a dignified scriptural register. “உங்களுக்கே கைவிடப்படுகிறது” clearly retains the dative relation and passive construction; “காலம் வரும்வரை” naturally renders the future-oriented temporal expression.
  terminology: “ஆண்டவர்,” “ஆசீர்வதிக்கப்பட்டவர்,” and “வருகிறவர்” are suitable and retain the Psalm 118:26 resonance. The footnotes appropriately preserve the broad referent of “your house” and avoid deciding the disputed temporal reference of the final acclamation.
  issues:
  - severity: medium
    issue: The temporal clause is fronted ahead of the main negated assertion.
    rationale: 'Although not strictly mistranslated, this order is less natural and less faithful to the Greek rhetorical sequence: first, “you will certainly not see me,” then the limiting “until” clause.'
  - severity: medium
    issue: “உங்களிடமே விட்டுவிடப்படுகிறது” is awkward and semantically diffuse.
    rationale: The expression can sound colloquial or reflexive in Tamil. “உங்களுக்கே கைவிடப்படுகிறது” better expresses the passive abandonment/being left over to them without importing “desolate.”
  - severity: low
    issue: Footnote a’s wording should correspond to the revised main-text verb.
    rationale: Once “கைவிடப்படுகிறது” is used in the text, the alternative should be given as “விட்டுவிடப்படுகிறது,” while retaining the judicial-passive nuance.
