  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: ta
  text: 'இதோ, உங்கள் வீடு உங்களுக்கே கைவிடப்படுகிறது.[a][b] நான் உங்களுக்குச் சொல்கிறேன்: நீங்கள், ‘ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்!’ என்று சொல்லும் காலம் வரும்வரை, என்னை நிச்சயமாகக் காணமாட்டீர்கள்.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கைவிடப்படுகிறது” என்பதை “விட்டுவிடப்படுகிறது” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் செயப்பாட்டு வடிவம் தீர்ப்பாக ஒப்புக்கொடுக்கப்படும் நுணுக்கத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் வீடு” என்பது எருசலேமையும், குறிப்பாக அதன் ஆலயத்தையும் குறிக்க வாய்ப்புள்ளது; ஆனால் கிரேக்க உரை வெறுமனே “உங்கள் வீடு” என்றே கூறுகிறது.
    reason: alternative_reading
  - marker: c
    text: “ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்” என்பது சங்கீதம் 118:26-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: d
    text: சிலர் இதை இயேசுவின் வெற்றிப் பவனியைக் குறிப்பதாகவும், வேறு சிலர் எதிர்காலத்தில் அவரை ஏற்றுக்கொள்வதைக் குறிப்பதாகவும் புரிந்துகொள்கிறார்கள். கிரேக்க உரை குறிப்பிட்ட ஒரு காலத்தை மட்டும் கட்டாயப்படுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து ஒரு முக்கிய அறிவிப்பை அறிமுகப்படுத்தும் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἀφίεται
  choice: விட்டுவிடப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தைக் காக்கிறது; ‘கைவிடப்படுகிறது’ என்று பொருளைச் சற்றுக் கூர்மையாக்காமல், விடப்படுதல் அல்லது ஒப்புக்கொடுக்கப்படுதல் என்ற உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: ὁ οἶκος ὑμῶν
  choice: உங்கள் வீடு
  rationale: கிரேக்கத்தின் நேரடியான சொற்றொடரைப் பாதுகாக்கிறது; எருசலேம் அல்லது ஆலயம் என்று முதன்மை உரையிலேயே விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὑμῖν
  choice: உங்களிடமே
  rationale: ‘உங்களுக்கு விடப்படுகிறது’ என்பதைக் காட்டிலும் தமிழில் இயல்பாக இருந்து, வீடு அவர்களிடமே விடப்படுகிறது என்ற தத்த உறவை வெளிப்படுத்துகிறது.
- source_word: λέγω δὲ ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்குள்ள மென்மையான தொடர்ச்சி அல்லது மாற்றத்தை தமிழில் கட்டாயமாக ‘ஆனால்’ என்று வலுப்படுத்தாமல் இயல்பாகக் காட்டுகிறது.
- source_word: οὐ μὴ ἴδητέ με
  choice: நீங்கள் என்னை நிச்சயமாகக் காணமாட்டீர்கள்
  rationale: οὐ μή தரும் வலுவான எதிர்கால மறுப்பை ‘நிச்சயமாகக் ... மாட்டீர்கள்’ என்று தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἕως ἥξει ὅτε
  choice: காலம் வரும்வரை
  rationale: கிரேக்கக் காலவியல் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தமிழில் தருகிறது; அதைத் தொடர்ந்து வரும் மேற்கோள் எதிர்காலச் சொல்லுதலின் உள்ளடக்கமாக அமைகிறது.
- source_word: εἴπητε
  choice: நீங்கள் சொல்லும்
  rationale: ἕως உடன் வரும் எதிர்கால நோக்குடைய அசைநிலை வினையின் பொருளை தமிழின் தொடர்பெச்ச அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: Εὐλογημένος
  choice: ஆசீர்வதிக்கப்பட்டவர்
  rationale: வேதாகம ஆசிவாழ்த்துச் சூத்திரத்தின் மரபான ஒலிப்பையும் சங்கீதம் 118:26 உடனான தொடர்பையும் காக்கிறது.
- source_word: ὁ ἐρχόμενος
  choice: வருகிறவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்பை இயல்பான தமிழில் தருகிறது; இதைத் தனிப்பட்ட பட்டப்பெயராக மிகைப்படுத்தவில்லை.
- source_word: ἐν ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: அறியப்பட்ட வேதாகமச் சொற்றொடரைத் தெளிவாகவும் சுருக்கமாகவும் காக்கிறது.
theological_decisions:
- issue: ‘உங்கள் வீடு’ என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் ‘உங்கள் வீடு’ என்ற பரந்த சொற்றொடரே வைக்கப்பட்டது.
  alternative: ஆலயம்; எருசலேம்; இஸ்ரவேலின் வீடு அல்லது தேசம்
  rationale: சூழல் எருசலேமையும் குறிப்பாக அதன் ஆலயத்தையும் நினைவூட்டினாலும், கிரேக்க உரை சுட்டுப்பொருளை வெளிப்படையாகக் குறுக்கவில்லை. எனவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறுதி மேற்கோள் குறிக்கும் காலம்
  choice: ஒரு குறிப்பிட்ட வரலாற்று அல்லது இறுதிக்கால நிகழ்வாகத் தீர்மானிக்காமல் எதிர்கால வரம்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இயேசுவின் வெற்றிப் பவனி; எருசலேம் அல்லது இஸ்ரவேலின் எதிர்கால ஏற்றுக்கொள்ளுதல்; இயேசுவின் திரும்பிவருகையில் நிகழும் அங்கீகாரம்
  rationale: கிரேக்கச் சொற்றொடர் இவற்றுள் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால், மூலத்தின் இறையியல் பதற்றமும் காலவியல் திறந்த தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம அறிவிப்பிற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’, ‘ஆண்டவர்’, ‘ஆசீர்வதிக்கப்பட்டவர்’ ஆகியவை வேதாகம ஒலிப்பைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு தெளிவுக்காக இயல்பான தமிழ்ச்சொல் வரிசையில் தரப்பட்டுள்ளது.
