  source_fidelity: மூலத்தின் தொடர்ச்சியான இறந்தகாலக் கற்பித்தல் (Ἦν ... διδάσκων), ‘வழிபாட்டுக்கூடங்களில் ஒன்றில்’ என்ற பகுதிப்பொருள் அமைப்பு, மற்றும் σάββασιν-ன் இடவியல் பயன்பாடு ஆகியவை துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. δέ-யின் மென்மையான கதைத் தொடர்ச்சி தமிழில் வெளிப்படையாகச் சேர்க்கப்படாதது இயல்பானதும் பொருளுக்கு ஏற்றதுமாகும்.
  naturalness: ‘அவர் ஓய்வுநாளில் யூத வழிபாட்டுக்கூடங்களில் ஒன்றில் கற்பித்துக்கொண்டிருந்தார்’ என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. சொல் வரிசையும் தொடர்ச்சிச் செயலைக் காட்டும் வினை அமைப்பும் இயல்பாக உள்ளன.
  terminology: ‘யூத வழிபாட்டுக்கூடம்’ συναγωγή என்பதன் வரலாற்று-சமயக் குறிப்பைத் தக்கவைக்கிறது; தேவையற்ற விளக்கமோ பிரிவுசார் சொல்லாட்சியோ இல்லை. ‘ஓய்வுநாள்’ σάββατον என்பதற்கான நிலையான புரிந்துகொள்ளத்தக்க தமிழ் வழங்கல். அடிக்குறிப்பு பன்மை வடிவத்தையும் அதன் இடியமாட்டிக் ஒருமைப் பயன்பாட்டையும் சரியாகப் பாதுகாக்கிறது.
