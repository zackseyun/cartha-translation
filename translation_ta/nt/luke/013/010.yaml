translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘யூத வழிபாட்டுக்கூடம்’ என்பது வரலாற்று அமைப்பைத் தெளிவுபடுத்துகிறது; ‘கற்பித்துக்கொண்டிருந்தார்’ என்பது தொடர்ச்சியான கடந்தகாலச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
