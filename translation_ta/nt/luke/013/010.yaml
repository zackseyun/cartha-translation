  yaml_path: translation/nt/luke/013/010.yaml
  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: ta
  text: அவர் ஓய்வுநாளில்[a] யூத வழிபாட்டுக்கூடங்களில் ஒன்றில் கற்பித்துக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓய்வுநாட்களில்’; கிரேக்கத்தில் பன்மை வடிவம் உள்ளது. ஆனால் அது பொதுவாக ஒருமையான ‘ஓய்வுநாள்’ என்ற பொருளிலும் மரபுத்தொடராகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: εἰμί என்பதன் இறந்தகால வடிவமும் நிகழ்காலப் பங்கேற்புவினையும் சேர்ந்து, கடந்த காலத்தில் தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கின்றன. எனவே இயல்பான தமிழில் ‘கற்பித்துக்கொண்டிருந்தார்’ என மொழிபெயர்க்கப்பட்டது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சி இடைச்சொல்; தமிழில் தனிச் சொல்லால் வெளிப்படுத்தாமல் விடுவது இயல்பானது.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: யூத வழிபாட்டுக்கூடங்களில் ஒன்றில்
  rationale: இது ‘வழிபாட்டுக்கூடங்களில் ஒன்றில்’ என்ற பகுதிப்பொருள் அமைப்பு. συναγωγή குறிக்கும் குறிப்பிட்ட யூத நிறுவனத்தைத் தெளிவாகவும் சாதாரண வாசகருக்குப் புரியுமாறும் ‘யூத வழிபாட்டுக்கூடம்’ என வழங்கப்பட்டது.
- source_word: ἐν τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: σάββασιν வடிவத்தில் பன்மையாக இருந்தாலும், கொய்னே கிரேக்கத்தில் ஒருமையான ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடராக இது பொதுவாகப் பயன்படுகிறது. சூழலும் ஒரு குறிப்பிட்ட ஓய்வுநாள் நிகழ்வை அறிமுகப்படுத்துவதால் ஒருமை முதன்மை உரையில் பயன்படுத்தப்பட்டது; வடிவியல் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
