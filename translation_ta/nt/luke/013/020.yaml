  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: ta
  text: 'மேலும் அவர் மீண்டும் கூறினார்: “இறைவனுடைய அரசை எதற்கு ஒப்பிடுவேன்?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: அவர் … என்றார்
  rationale: கிரேக்கத்தின் எளிய இணைப்பைத் தமிழில் இயல்பான தொடர்வாக்கியமாக அளிக்கிறது; தனியாக ‘மேலும்’ சேர்ப்பது πάλιν உடன் தேவையற்ற மிகைப்பாகும்.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: சொல் அல்லது செயல் திரும்ப நிகழ்வதை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேர்க்கூற்றை அறிமுகப்படுத்தும் λέγω வினையின் இறந்தகாலத்தை நவீன தமிழில் இயல்பாகக் கூறுகிறது; எழுவாய் சூழலிலிருந்து இயேசுவைக் குறிக்கிறது.
- source_word: Τίνι
  choice: எதற்கு
  rationale: இங்கு ஆளைக் கேட்காமல் ஒப்பீட்டுக்குரிய பொருளைக் கேட்கும் நடுநிலை ஒருமை வினாப்பெயரைப் பிரதிபலிக்கிறது.
- source_word: ὁμοιώσω
  choice: ஒப்பிடுவேன்
  rationale: முதலாம் நபர் எதிர்கால வடிவத்தையும் ஆலோசனைத் தொனியுள்ள சொல்லாட்சியையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: இறைவனுடைய அரசு
  rationale: βασιλεία என்பதன் ஆட்சி மற்றும் அரசருக்குரிய ஆளுகை/அரசு என்ற பரப்பைத் தக்கவைக்கும் இயல்பான, மரியாதையான தமிழாக்கம்.
theological_decisions:
- issue: βασιλεία என்பதைக் கடவுளின் அரசாட்சியைக் குறிக்கும் சொல்லாக மொழிபெயர்த்தல்
  choice: இறைவனுடைய அரசு
  alternative: இறைவனுடைய ஆட்சி
  rationale: ‘அரசு’ என்பது அரசரின் ஆட்சி, ஆளுகை, அதன் வெளிப்பாடு ஆகியவற்றை உள்ளடக்கும் பரந்த சொல்லாக உள்ளது; ‘ஆட்சி’ என்பது செயல்படும் ஆளுகையை மட்டும் முன்னிறுத்தி பொருளைச் சற்றுக் குறுக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடையில் நேர்க்கூற்று அமைக்கப்பட்டுள்ளது. சூழலில் பேசுபவர் இயேசு என்பதால் மரியாதைப் பன்மை ‘அவர்/என்றார்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்புகள் தேவையில்லை.
