source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “இந்த ஆலயத்தை இடித்துப்போடுங்கள்; மூன்று நாட்களில் நான் இதை எழுப்புவேன்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த ஆலயத்தைத் தகர்த்துப்போடுங்கள்; மூன்று நாட்களில் நான் இதை மீண்டும் கட்டுவேன்” என்றும் மொழிபெயர்க்கலாம். “எழுப்புவேன்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க வினை, இச்சூழலில் உயிர்த்தெழுதலை நினைவூட்டக்கூடும்; இயேசு தமது உடலாகிய ஆலயத்தைப் பற்றிப் பேசினார் என்று யோவான் பின்னர் விளக்குகிறார் (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: பதிலளித்தார்
  rationale: இரு கிரேக்க வினைகளும் சேர்ந்து பதிலுரையை அறிமுகப்படுத்தும் வழக்குச் சொற்றொடராக உள்ளன. தமிழில் இரண்டையும் தனித்தனியாக மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், பொருளை இயல்பாகத் தரும் ஒரே வினை பயன்படுத்தப்பட்டது.
- source_word: Λύσατε
  choice: இடித்துப்போடுங்கள்
  rationale: இங்கு λύω என்பது ஆலயத்தைக் கலைத்தல் அல்லது அழித்தல் என்ற பொருளில் வருகிறது. கட்டிடச் சூழலில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் இந்தச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸν ναὸν τοῦτον
  choice: இந்த ஆலயத்தை
  rationale: ναός குறிப்பாக ஆலயப் புனித இடத்தைக் குறிக்கக்கூடும்; ஆனால் இவ்வசனத்தின் திட்டமிட்ட மறைபொருளை முன்கூட்டியே குறுக்காமல், பொதுவாகப் புரியும் ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: ἐν τρισὶν ἡμέραις
  choice: மூன்று நாட்களில்
  rationale: கிரேக்க காலச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்; ‘மூன்று நாட்களுக்குள்’ என்று கால எல்லையை அளவுக்கு மீறித் துல்லியப்படுத்தவில்லை.
- source_word: ἐγερῶ αὐτόν
  choice: இதை நான் எழுப்புவேன்
  rationale: ἐγείρω என்பதன் ‘எழுப்புதல்’ என்ற அடிப்படைப் பொருளையும் உயிர்த்தெழுதல் சார்ந்த எதிரொலியையும் காக்கிறது; ‘மீண்டும் கட்டுவேன்’ என்று கட்டிடப் பொருளுக்குள் மட்டும் சுருக்கவில்லை.
theological_decisions:
- issue: ‘ஆலயம்’ என்பது இயேசுவின் உடலைக் குறிக்கிறது என்பதை இவ்வசனத்திலேயே வெளிப்படையாகச் சொல்லலாமா?
  choice: மூலத்தைப் போல ‘இந்த ஆலயம்’ என்ற மறைபொருளை அப்படியே வைத்தல்.
  alternative: ‘என் உடலாகிய இந்த ஆலயம்’ என்று விளக்குதல்.
  rationale: யோவான் 2:21-ல்தான் இதற்கான விளக்கம் தரப்படுகிறது. அதை இங்கே முன்கூட்டியே சேர்த்தால் கதையின் திட்டமிட்ட இருபொருள் தன்மையும் இறையியல் அழுத்தமும் மறைந்துவிடும்.
- issue: ἐγερῶ என்பதை கட்டிட மொழியிலா, உயிர்த்தெழுதல் எதிரொலியுடனா மொழிபெயர்ப்பது?
  choice: ‘எழுப்புவேன்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘மீண்டும் கட்டுவேன்.’
  rationale: ‘எழுப்புவேன்’ என்பது ஆலய உருவகத்தோடும் பொருந்தி, பின்னர் வெளிப்படும் உயிர்த்தெழுதல் சார்ந்த பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. இயல்பான தமிழுக்காக ‘பதிலளித்து அவர்களிடம் சொன்னார்’ என்ற மீளுரைத்தலைத் தவிர்த்தாலும், மூலத்தின் கருத்து முழுமையாகக் காக்கப்பட்டது.
