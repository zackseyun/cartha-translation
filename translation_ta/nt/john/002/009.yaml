base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: ta
  text: விருந்துப் பொறுப்பாளர் திராட்சரசமாக மாறியிருந்த தண்ணீரைச் சுவைத்தார். அது எங்கிருந்து வந்தது என்று அவருக்குத் தெரியவில்லை; ஆனால் அந்தத் தண்ணீரை மொண்டு எடுத்த பணியாளர்களுக்குத் தெரிந்திருந்தது. அப்போது விருந்துப் பொறுப்பாளர் மணமகனை அழைக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘அழைக்கிறார்’ என்ற வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது; தமிழில் வழக்கமான இறந்தகால நடையில் ‘அழைத்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: விருந்துப் பொறுப்பாளர்
  rationale: விருந்தின் ஏற்பாடுகளையும் பரிமாறுதலையும் மேற்பார்வையிட்டவரைக் குறிக்கிறது; நவீன வாசகருக்கு இயல்பாகவும், பணியின் எல்லையை மிகக் குறுக்காமலும் கூறுகிறது.
- source_word: ἐγεύσατο
  choice: சுவைத்தார்
  rationale: சுவைத்துப் பார்த்த செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: திராட்சரசமாக மாறியிருந்த தண்ணீர்
  rationale: மாற்றம் ஏற்கெனவே நிறைவடைந்து அதன் விளைவு நீடித்திருப்பதை perfect participle சுட்டுவதால் ‘மாறியிருந்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: அது எங்கிருந்து வந்தது என்று அவருக்குத் தெரியவில்லை
  rationale: πόθεν குறிக்கும் தோற்றுவாயை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διάκονοι
  choice: பணியாளர்கள்
  rationale: இச்சூழலில் விருந்தில் சேவை செய்தவர்களைக் குறிக்கிறது; திருச்சபைப் பதவியான ‘திருத்தொண்டர்’ என்ற பொருளை இங்கு இறக்குமதி செய்யவில்லை.
- source_word: ἠντληκότες
  choice: மொண்டு எடுத்த
  rationale: தண்ணீரை முகந்து அல்லது மொண்டு எடுத்த செயலைச் சூழலுக்கு ஏற்ற தமிழில் தெரிவிக்கிறது.
- source_word: φωνεῖ
  choice: அழைக்கிறார்
  rationale: யோவான் பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: νυμφίον
  choice: மணமகன்
  rationale: திருமணச் சூழலில் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: ὡς δὲ
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: δὲ-யின் மென்மையான நிகழ்வுத் தொடர்ச்சியை தனியான ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்காமல் தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அற்புதத்தில் நிகழ்ந்த மாற்றத்தின் வருணனை
  choice: ‘திராட்சரசமாக மாறியிருந்த தண்ணீர்’ என்று உண்மையான மாற்றமாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘திராட்சரசம் போலிருந்த தண்ணீர்’ அல்லது ‘திராட்சரசமாக மாற்றப்பட்ட தண்ணீர்’
  rationale: கிரேக்க வாசகம் தண்ணீர் திராட்சரசமாக ஆகியிருந்ததை வெளிப்படையாகக் கூறுகிறது. தோற்றம் மட்டுமே என்று பலவீனப்படுத்தாமலும், செய்பவரை இலக்கணத்தில் இல்லாதபடி வெளிப்படையாகச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: மரியாதை வினைமுற்றுகளுடன் கூடிய நவீன பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியம் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; அடைப்புக்குறிக் கருத்து தனி முரண்பாட்டு வாக்கியமாக வழங்கப்பட்டுள்ளது. ‘திராட்சரசம்’ என்பது οἶνος என்பதற்கான தெளிவான, கண்ணியமான வேதாகமத் தமிழ்.
