id: JHN.2.15
reference: John 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: ta
  text: கயிறுகளைக் கொண்டு ஒரு சாட்டையைச் செய்து, அங்கிருந்த எல்லாரையும்[b]—ஆடுகளையும் மாடுகளையும் கூட—கோவில் வளாகத்திலிருந்து[a] வெளியே ஓட்டினார்; பணம் மாற்றுபவர்களின் நாணயங்களைக் கொட்டினார்; மேசைகளைக் கவிழ்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் (ἱερόν) கோவிலின் உள் திருத்தலத்தை மட்டும் அல்ல, கோவில் வளாகத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: கிரேக்க வாசகம் முதலில் ‘எல்லாரையும்’ என்று கூறி, பின்னர் ‘ஆடுகளையும் மாடுகளையும்’ என்று குறிப்பிடுகிறது. சாட்டை மனிதர்கள்மீது பயன்படுத்தப்பட்டது என்று அது வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: செய்து
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மைச் செயலுக்கு முன் நிகழ்ந்ததைச் சுட்டுகிறது; தமிழில் ‘செய்து’ என்பது அந்தச் செயல்வரிசையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: கயிறுகளால் ஒரு சாட்டை
  rationale: φραγέλλιον என்பது அடிப்பதற்கான சாட்டையையும், σχοινία என்பது கயிறுகள் அல்லது வடங்களையும் குறிக்கிறது; இத்தொடர் பொருளையும் கருவியையும் தெளிவாகத் தருகிறது.
- source_word: πάντας
  choice: அவர்கள் அனைவரையும்
  rationale: ஆண்பால் பன்மை வடிவத்தின் விரிவான சுட்டலைப் பேணுகிறது; அடுத்து ஆடுகளும் மாடுகளும் குறிப்பிடப்படுவதால் உருவாகும் இலக்கணத் தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐξέβαλεν
  choice: வெளியே ஓட்டினார்
  rationale: வலுக்கட்டாயமாக வெளியேற்றும் செயலை இச்சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῦ ἱεροῦ
  choice: கோவில் வளாகத்திலிருந்து
  rationale: ἱερόν என்பது உள் திருத்தலத்தை மட்டும் அல்லாமல் முழுக் கோவில் வளாகத்தையும் குறிக்கிறது.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: ஆடுகளையும் மாடுகளையும் சேர்த்து
  rationale: இரு விலங்கு வகைகளும் வெளியே ஓட்டப்பட்டவர்களோடு அல்லது பொருட்களோடு சேர்த்துக் குறிப்பிடப்படுவதைத் தெளிவாக்குகிறது; βοῦς என்பதற்கு இங்கு பொதுவாகப் புரியும் ‘மாடுகள்’ பொருத்தமானது.
- source_word: κολλυβιστῶν
  choice: பணம் மாற்றுபவர்கள்
  rationale: கோவில் சூழலில் நாணயங்களை மாற்றிக் கொடுத்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: நாணயங்களைக் கொட்டிவிட்டு
  rationale: ἐκχέω என்பதன் ‘ஊற்றுதல்/கொட்டுதல்’ உருவகத்தை நாணயங்கள் தொடர்பான இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀνέστρεψεν
  choice: கவிழ்த்தார்
  rationale: மேசைகளைத் தலைகீழாக்கிய வலுவான செயலைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் வெளியேற்றும் செயலின் வரம்பும் சாட்டையின் பயன்பாடும்
  choice: ‘அவர்கள் அனைவரையும்’ என்று பரந்த சுட்டலை வைத்திருந்து, ஆடுகளும் மாடுகளும் அதில் சேர்த்துக் குறிப்பிடப்படுகின்றன; சாட்டை மனிதர்கள்மீது பயன்படுத்தப்பட்டது என்று மொழிபெயர்ப்பு கூறவில்லை.
  alternative: மனிதர்களையும் விலங்குகளையும் எல்லாரையும் வெளியே ஓட்டினார்; அல்லது விலங்குகளை மட்டும் வெளியே ஓட்டினார்.
  rationale: πάντας என்பதற்குப் பின் ஆடுகளும் மாடுகளும் வருகின்றன; ஆனால் சாட்டை மனிதர்கள்மீது பயன்படுத்தப்பட்டதாக கிரேக்க வாசகம் வெளிப்படையாகச் சொல்லவில்லை. ஆகவே உரையின் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கோவில் வளாகம்’, ‘பணம் மாற்றுபவர்கள்’ போன்ற சொற்கள் வரலாற்றுச் சூழலைத் தெளிவாக்குகின்றன; கிரேக்கத்தில் உள்ள செயல்வரிசையும் சாட்டையின் பயன்பாட்டைப் பற்றிய தெளிவின்மையும் பேணப்பட்டுள்ளன.
