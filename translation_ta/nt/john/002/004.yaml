id: JHN.2.4
reference: John 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: ta
  text: இயேசு அவரிடம், “பெண்ணே,[a] இதற்கும் எனக்கும் உங்களுக்கும் என்ன சம்பந்தம்?[b] என் வேளை இன்னும் வரவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலமொழியில் உள்ள அழைப்புச் சொல் சொற்சொல்லாக ‘பெண்ணே’ என்பதாகும். அக்காலச் சூழலில் அது அவசியமாக மரியாதையற்ற அழைப்பு அல்ல; ஆனால் இன்றைய தமிழில் அது கடுமையாக ஒலிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: இன்னும் சொற்சொல்லாக, “எனக்கும் உங்களுக்கும் என்ன?” இது அக்கறை அல்லது பொறுப்பில் ஓர் இடைவெளியை உணர்த்தும் மரபுத்தொடர்; அவசியமாகப் பகைமையை உணர்த்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகால வினை இயல்பாக இருப்பதால் ‘என்றார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: இதற்கும் எனக்கும் உங்களுக்கும் என்ன சம்பந்தம்?
  rationale: இது சொற்சொல்லாகப் புரிந்துகொள்ள வேண்டிய கேள்வியல்ல; அக்கறை அல்லது பொறுப்பில் ஒரு இடைவெளியைச் சுட்டும் மரபுத்தொடர். பகைமையையோ உறவுமுறிவையோ மிகைப்படுத்தாமல் அதன் விலகல் தொனியைத் தக்கவைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: γύναι
  choice: அம்மா
  rationale: சொற்சொல்லான ‘பெண்ணே’ என்பது இன்றைய தமிழில் தேவையற்ற கடுமையையோ இழிவையோ உணர்த்தக்கூடும். ‘அம்மா’ என்பது ஒரு பெண்ணை மரியாதையுடன் அழைக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்; இது கிரேக்கத்தில் இல்லாத அளவுக்கு அன்புத் தொனியைச் சேர்த்ததாகப் புரிந்துகொள்ளாதபடி அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: οὔπω
  choice: இன்னும் வரவில்லை
  rationale: குறிப்பிட்ட நேரம் இதுவரை வந்தடையவில்லை என்பதைக் ‘இன்னும்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἥκει
  choice: வரவில்லை
  rationale: ἥκει என்பது வந்தடைதல் அல்லது வந்திருத்தலைக் குறிக்கிறது; ‘வேளை’ என்பதுடன் ‘வருதல்’ இயல்பான தமிழ்ப் பயன்பாடு.
- source_word: ἡ ὥρα μου
  choice: என் வேளை
  rationale: யோவான் நற்செய்தியில் ‘வேளை’ என்பது இயேசுவின் பணி, பாடுகள் மற்றும் மகிமைப்படுதல் தொடர்பான ஆழ்ந்த கருத்தொலியைக் கொண்டுள்ளது. பொதுவான ‘நேரம்’ என்பதற்குப் பதிலாக ‘வேளை’ அந்த இலக்கிய-இறையியல் தொடுப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசு தம் தாயிடம் பேசியதன் தொனியும் வலிமையும்
  choice: மரியாதையைத் தக்கவைத்தபடியே இடைவெளியை உணர்த்தும் பதில்
  alternative: கடுமையான கண்டிப்பு; அல்லது வெளிப்படையான பாசம் நிறைந்த அழைப்பு
  rationale: Τί ἐμοὶ καὶ σοί என்ற மரபுத்தொடர் சூழ்நிலை அல்லது அக்கறையில் இடைவெளியை ஏற்படுத்துகிறது; γύναι என்பது அச்சூழலில் அவசியமாக அவமரியாதையான அழைப்பு அல்ல. மொழிபெயர்ப்பு இயேசுவை முரட்டுத்தனமாகவோ அளவுக்கு மீறிய பாசத்தோடோ சித்தரிக்காமல் இந்தப் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: யோவான் நற்செய்தியில் ‘என் வேளை’ என்பதன் பொருள்
  choice: உடனடி நிகழ்வைக் கடந்த, இயேசுவுக்காக நிர்ணயிக்கப்பட்ட வேளையின் விரிந்த கருத்தொலியைத் திறந்த நிலையில் வைத்தல்
  alternative: இந்த அடையாளத்தைச் செய்வதற்கான தருணம் மட்டும்; அல்லது இறையியல் முக்கியத்துவமற்ற பொதுவான நேரக் குறிப்பு
  rationale: யோவான் நற்செய்தியில் ‘வேளை’ என்பது இயேசுவின் பணி மற்றும் மகிமைப்படுதலோடு மீண்டும் மீண்டும் தொடர்புபடுத்தப்படுகிறது. மூலத்தின் சுருக்கத்தையும் விளக்கத் திறப்பையும் காக்க ‘என் வேளை’ என்றே வைக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மரியாதைப் பன்மையான ‘உங்களுக்கும்’ தாயிடம் பேசும் சூழலுக்கு ஏற்றது. ‘அம்மா’ தமிழில் மரியாதையான அழைப்பாக இயங்கினாலும், மூலத்தின் சொற்சொல்லான வடிவத்தையும் அதன் தொனிசார் வேறுபாட்டையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
