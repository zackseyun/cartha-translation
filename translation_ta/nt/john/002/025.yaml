id: JHN.2.25
reference: John 2:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: ta
  text: மேலும், மனிதனைப் பற்றி யாரும் சாட்சி சொல்ல வேண்டிய தேவை அவருக்கு இருக்கவில்லை; ஏனெனில் மனிதனுக்குள் என்ன இருந்தது என்பதை அவரே அறிந்திருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதனைப் பற்றி’ என்றும் ‘மனிதனுக்குள்’ என்றும் வரும் கிரேக்கச் சொல் ஒருமையில் இருந்தாலும், ஒரு மனிதரையோ பொதுவாக மனிதகுலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: தேவை அவருக்கு இருக்கவில்லை
  rationale: χρείαν ἔχειν என்ற சொற்றொடரின் ‘தேவை இருத்தல்’ என்ற பொருளை இயல்பான நவீன தமிழில் எதிர்மறையாகப் பாதுகாக்கிறது.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: யாரும் சாட்சி சொல்ல வேண்டிய
  rationale: τις என்பதன் வரையறுக்கப்படாத நபர் குறிப்பையும், μαρτυρέω என்பதன் சாட்சியமளிக்கும் வலிமையையும் காக்கிறது; தேவை குறிக்கும் முதன்மைத் தொடருக்குப் பின் ἵνα இயல்பான தமிழில் ‘வேண்டிய’ என வழங்கப்படுகிறது.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: மனிதனைப் பற்றி
  rationale: ἄνθρωπος இங்கு ஒருமையில் பொதுப்பொருளில் மனிதனை அல்லது மனிதகுலத்தின் பிரதிநிதியைச் சுட்டுகிறது. ‘மனிதனை’ என்பது பாலின வரம்பின்றி அந்தப் பொதுமையையும் ஒருமை வடிவையும் காக்கிறது.
- source_word: αὐτὸς γὰρ
  choice: ஏனெனில் ... அவரே
  rationale: γάρ தரும் விளக்கத் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது; வலியுறுத்தப்பட்ட αὐτός என்பதைக் ‘அவரே’ பாதுகாக்கிறது.
- source_word: ἐγίνωσκεν
  choice: அறிந்திருந்தார்
  rationale: நிலைபெற்ற அல்லது தொடர்ச்சியான அறிவைக் குறிக்கும் இறந்தகால imperfect வடிவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: மனிதனுக்குள் என்ன இருந்தது
  rationale: உள்ளார்ந்தது எது என்ற மூலத்தின் விரிவான, தீர்மானிக்கப்படாத கருத்தையும், முந்தைய ἄνθρωπος ஒருமையுடனான ஒத்திசைவையும் காக்கிறது.
theological_decisions:
- issue: மனிதரைப் பற்றிய இயேசுவின் அறிவின் பரப்பு
  choice: மனிதனுக்குள் என்ன இருந்தது என்பதை அவரே அறிந்திருந்தார்
  alternative: ஒவ்வொரு நபரின் உள்ளத்தையும் அவர் அறிந்திருந்தார் / மனித இயல்பை முழுமையாக அவர் அறிந்திருந்தார்
  rationale: கிரேக்க ஒருமை ἀνθρώπῳ தனிநபரையும் பொதுவான மனித நிலையையும் உள்ளடக்கக்கூடும். மொழிபெயர்ப்பு இதை தனிப்பட்ட மனவறிவாக மட்டும் சுருக்காமலும், மனித இயல்பைப் பற்றிய கோட்பாட்டு விளக்கமாக விரிவாக்காமலும் அதன் பரப்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான உரைநடை. ‘அவரே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘மனிதன்’ பொதுப்பொருளில் பயன்படுத்தப்படுவதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
