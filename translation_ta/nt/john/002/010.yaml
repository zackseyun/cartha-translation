source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: ta
  text: அவர் அவனிடம், “எல்லாரும் முதலில் நல்ல திராட்சரசத்தைப் பரிமாறுவார்கள்; அவர்கள் போதையாகிவிட்ட பிறகு[a], தரம் குறைந்த திராட்சரசத்தைப் பரிமாறுவார்கள். ஆனால் நீரோ நல்ல திராட்சரசத்தை இதுவரை வைத்திருந்தீரே!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போதையாகிவிட்ட பிறகு” என்பதற்கு “போதையில் இருக்கும்போது” என்றும் மொழிபெயர்க்கலாம். சில மொழிபெயர்ப்புகள் இதை “தாராளமாகக் குடித்த பிறகு” என்று மென்மையாகக் கூறுகின்றன; ஆனால் கிரேக்க வினை பொதுவாகக் குடிபோதையடைவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: அவர் அவனிடம் ... என்றார்
  rationale: வரலாற்று நிகழ்காலமான λέγει என்பதைத் தமிழின் இயல்பான கதைநடை இறந்தகாலத்தில் மொழிபெயர்த்து, யாரிடம் கூறப்பட்டது என்பதையும் காத்திருக்கிறது.
- source_word: Πᾶς ἄνθρωπος
  choice: எல்லாரும்
  rationale: இது ஆண்களை மட்டும் குறிக்காத பொதுமைப்படுத்தும் ஒருமைச் சொற்றொடர்; நவீனத் தமிழில் ‘எல்லாரும்’ இயல்பாக அதன் பரந்த பொருளைத் தருகிறது.
- source_word: τὸν καλὸν οἶνον
  choice: நல்ல திராட்சரசத்தை
  rationale: καλός இங்கு தரத்தைக் குறிக்கிறது; ‘நல்ல திராட்சரசம்’ என்பது பின்னர் வரும் தரம் குறைந்த திராட்சரசத்தோடு உள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: τίθησιν
  choice: பரிமாறுவார்கள்
  rationale: விருந்துச் சூழலில் τίθημι என்பதன் ‘வைத்து வழங்குதல்’ என்ற செயல்பாட்டை இயல்பான தமிழில் ‘பரிமாறுதல்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: ὅταν μεθυσθῶσιν
  choice: மக்கள் போதையாகிவிட்ட பிறகு
  rationale: μεθύω என்பதன் குடிபோதையடைதல் என்ற நேரடியான பொருளை மென்மையாக்காமல் தெரிவிக்கிறது; ὅταν உடன் வரும் நிகழ்வுக்குப் பிந்தைய நிலையும் காக்கப்படுகிறது.
- source_word: τὸν ἐλάσσω
  choice: தரம் குறைந்ததை
  rationale: ἐλάσσων இங்கு அளவை அல்ல, முன்பு கூறிய திராட்சரசத்தைவிடக் குறைந்த தரத்தைச் சுட்டுகிறது; ‘திராட்சரசம்’ சூழலிலிருந்து விளங்குவதால் மீண்டும் சொல்லப்படவில்லை.
- source_word: τετήρηκας
  choice: வைத்திருந்தீரே
  rationale: நல்ல திராட்சரசத்தை இந்நேரம்வரை பாதுகாத்து வைத்த செயலையும் அதன் தற்போதைய விளைவையும் கிரேக்க நிறைவுக்காலத்துக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἕως ἄρτι
  choice: இதுவரை
  rationale: கதையில் பேசப்படும் அந்தக் கணம் வரையிலான காலத்தை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
theological_decisions:
- issue: திராட்சரச அற்புதச் சூழலில் μεθυσθῶσιν என்பதன் பொருள்
  choice: போதையாகிவிட்ட பிறகு
  alternative: தாராளமாகக் குடித்த பிறகு / போதுமான அளவு குடித்த பிறகு
  rationale: கிரேக்க வினை பொதுவாகக் குடிபோதையடைவதைக் குறிக்கிறது. நெறியியல் அல்லது கோட்பாட்டுக் காரணத்திற்காக அதை மென்மையாக்காமல், விருந்து மேற்பார்வையாளரின் பொதுக் கவனிப்பாகவே மொழிபெயர்க்கப்பட்டுள்ளது; இது குடிபோதையை அங்கீகரிப்பதாகச் சேர்த்துப் பொருள்கொள்ளவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. விருந்து மேற்பார்வையாளருக்கு மரியாதை காட்டும் வகையில் ‘நீரோ’, ‘வைத்திருந்தீரே’ எனப்பட்டுள்ளது; இயேசுவை முன் வாக்கியத்தில் ‘அவர்’ என்றும், அவரிடம் பேசப்பட்ட பணியாளரை ‘அவன்’ என்றும் சூழலுக்கேற்ப குறிக்கிறது. அடிக்குறி குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
