id: JHN.2.22
reference: John 2:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: ta
  text: ஆகவே, அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டபோது[a], அவர் இதைச் சொல்லிக்கொண்டிருந்தார்[b] என்பதை அவருடைய சீடர்கள் நினைவுகூர்ந்தார்கள்; மேலும், அவர்கள் வேதவாக்கியத்தையும் இயேசு சொன்ன வார்த்தையையும்[c] நம்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இறந்தோரிலிருந்து எழுந்தபோது.” கிரேக்க வினை செயலற்ற வடிவில் இருப்பதால், முதன்மை உரையில் “எழுப்பப்பட்டபோது” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் இதைச் சொன்னார்” அல்லது “அவர் இதைச் சொல்லியிருந்தார்.” கிரேக்க இறந்தகாலத் தொடர்வினை முந்தைய நடைபெற்று வந்த அல்லது மீண்டும் கூறப்பட்ட பேச்சைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “வார்த்தை” என்பதற்கு மாற்றாக, “கூற்று” அல்லது “செய்தி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ஆகவே, ... போது
  rationale: ὅτε என்பதன் காலப் பொருளையும் οὖν என்பதன் தொடர்ச்சி/விளைவு சார்ந்த இணைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἠγέρθη ἐκ νεκρῶν
  choice: அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டபோது
  rationale: உயிர்த்தெழுதல் சூழலைத் தெளிவாகக் காட்டுவதோடு, கிரேக்கச் செயலற்ற வினை வடிவத்தையும் பாதுகாக்கிறது.
- source_word: ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள் நினைவுகூர்ந்தார்கள்
  rationale: முன்பு கூறப்பட்டதைப் பின்னர் நினைவுக்கு கொண்டுவந்தார்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: அவர் இதைச் சொல்லியிருந்தார் என்பதை
  rationale: முந்தைய உரையைச் சுட்டும் imperfect வினையைத் தமிழில் இயல்பான முன்இறந்தகால வடிவில் தருகிறது; தொடர்ச்சிப் பொருள் கட்டாயமாக்கப்படவில்லை.
- source_word: ἐπίστευσαν τῇ γραφῇ
  choice: வேதவாக்கியத்தை ... நம்பினார்கள்
  rationale: γραφή ஒருமையைப் பாதுகாத்து, அதிகாரமுள்ள திருமறை உரை என்ற சூழற்பொருளைத் தருகிறது.
- source_word: τῷ λόγῳ ὃν εἶπεν ὁ Ἰησοῦς
  choice: இயேசு சொன்ன வார்த்தையை
  rationale: λόγος இங்கு இயேசு கூறிய குறிப்பிட்ட சொல்லை அல்லது கூற்றைக் குறிக்கிறது; 'வார்த்தை' அதன் சொற்பிணைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் செயலற்ற வடிவம்
  choice: எழுப்பப்பட்டபோது
  alternative: எழுந்தபோது
  rationale: ἠγέρθη என்பது இலக்கணப்படி செயலற்ற வடிவம்; அதை அப்படியே காப்பது உரையின் மொழிநயத்தையும் மறைமுகச் செய்பவரைக் குறிப்பிடாமல் இருப்பதையும் பாதுகாக்கிறது.
- issue: πιστεύω என்பதுடன் வரும் வேதவாக்கியமும் இயேசுவின் வார்த்தையும்
  choice: வேதவாக்கியத்தையும் ... வார்த்தையையும் நம்பினார்கள்
  alternative: வேதவாக்கியத்தின் மீதும் ... வார்த்தையின் மீதும் விசுவாசம் வைத்தார்கள்
  rationale: '''நம்பினார்கள்'' என்பது உரையில் உள்ள நம்புதலை மிகைப்படுத்தாமல் நேரடியாகக் காட்டுகிறது.'
- issue: γραφή ஒருமையின் பொருள்
  choice: வேதவாக்கியம்
  alternative: வேதம்
  rationale: கிரேக்க ஒருமையை வெளிப்படுத்தி, ஒரு குறிப்பிட்ட திருமறை உரையையோ திருமறைச் சாட்சியையோ குறிக்கும் வாய்ப்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. 'வேதவாக்கியம்' என்பது γραφή ஒருமையை வெளிப்படுத்துகிறது; 'எழுப்பப்பட்டார்' என்பது மூலத்தின் செயலற்ற வடிவத்தைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
