reference: John 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: ta
  text: அதற்கு யூதர்கள் அவரிடம், “நீர் இவற்றைச் செய்கிறீர் என்பதற்கு எங்களுக்கு என்ன அடையாளத்தைக் காட்டுகிறீர்?” என்று சொன்னார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’ என்றும் பொருள்படலாம். யோவான் நற்செய்தியில் ‘யூதர்கள்’ என்பது சூழலுக்கேற்ப முழு யூத மக்களையும் அல்லாமல், குறிப்பாக யூதேய அதிகாரிகள் போன்ற ஒரு பிரதிநிதிக் குழுவைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν ... καὶ εἶπαν αὐτῷ
  choice: ஆகவே ... அவரிடம் ... என்று கேட்டார்கள்
  rationale: ἀπεκρίθησαν ... καὶ εἶπαν என்ற செமித்தியத் தாக்கமுள்ள இரட்டைச் சொல்லாக்கத்தைத் தமிழில் இயல்பான உரையாடல் அறிமுகமாகச் சுருக்குகிறது; οὖν முந்தைய நிகழ்வின் விளைவுத் தொடர்ச்சியை ‘ஆகவே’ எனக் காட்டுகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் வெளிப்படையான பொருளை முதன்மை உரையில் காக்கிறது; யோவானில் சூழலுக்கேற்ப குறுகிய குழுவைக் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Τί σημεῖον
  choice: என்ன அடையாளம்
  rationale: σημεῖον என்பது வெறும் அற்புதம் மட்டுமல்லாமல் அதிகாரத்தை உறுதிப்படுத்தி அதற்கு அப்பாற்பட்ட ஒன்றைச் சுட்டும் யோவானிய சொல்; ‘அடையாளம்’ அந்த நுணுக்கத்தைக் காக்கிறது.
- source_word: δεικνύεις ἡμῖν
  choice: எங்களுக்கு ... காட்டுகிறீர்
  rationale: நேரடியான சவாலின் வடிவத்தையும் ἡμῖν என்ற மறைமுக வேற்றுமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: நீர் இவற்றைச் செய்வதற்கு
  rationale: ὅτι இங்கு அவருடைய செயல்களைச் செய்வதற்கான அதிகாரச் சான்றை அவர்கள் கோருவதை வெளிப்படுத்துகிறது. தமிழில் ‘செய்வதற்கு’ என்பது ‘இவற்றைச் செய்ய உமக்கு என்ன அதிகாரச் சான்று?’ என்ற தொடர்பை இயல்பாகவும், மிகையாக விளக்காமலும் தருகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என வைத்தல்
  alternative: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’
  rationale: இச்சூழலில் அதிகாரிகள் அல்லது பிரதிநிதிக் குழு குறிக்கப்பட்டிருக்கலாம்; ஆனாலும் கிரேக்க உரை வெளிப்படையாக அந்த வரம்பைச் சொல்லவில்லை. ஆகவே முதன்மை உரை மூலத்தின் பரந்த சொல்லை வைத்துக் கொண்டு, சூழல்சார் குறுகிய பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: ὅτι உடைய தொடர்பு
  choice: செயல்களுக்கான அதிகாரச் சான்றைக் கோரும் தொடர்பாக ‘செய்வதற்கு’
  alternative: ‘நீர் இவற்றைச் செய்கிறபடியால்’ அல்லது மிக நேரடியாக ‘நீர் இவற்றைச் செய்கிறீர் என்பதற்கு’
  rationale: இது காலத்தைக் குறிக்கும் ‘போது’ அல்ல; இயேசு இவற்றைச் செய்வதை அடிப்படையாகக் கொண்ட சவால். தமிழ் வாக்கியத்தில் காரணம், அதிகாரம், சான்று ஆகிய தொடர்பை இயல்பாக வைத்திருக்கிறது; தேவையற்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்/காட்டுகிறீர்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள ‘பதிலளித்து, சொன்னார்கள்’ என்ற இரட்டிப்பை தமிழின் இயல்புக்கேற்ப ‘என்று கேட்டார்கள்’ என வழங்கியுள்ளது. அடிக்குறிப்பு குறி வசனத்தின் முடிவில் தெளிவாக இடப்பட்டுள்ளது.
