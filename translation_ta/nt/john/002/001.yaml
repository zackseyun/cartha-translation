source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: ta
  text: மூன்றாம் நாளில், கலிலேயாவிலுள்ள கானாவில் ஒரு திருமணம்[a] நடைபெற்றது. இயேசுவின் தாயும் அங்கே இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமண விருந்து.” கிரேக்கச் சொல் திருமண நிகழ்வையும் அதன் கொண்டாட்டத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: மூன்றாம் நாளில் / தாயும்
  rationale: வசனத்தின் தொடக்கத்தில் வரும் இணைப்புச்சொல், தமிழின் இயல்பான கதைநடைக்காகத் தனிச்சொல்லாக மொழிபெயர்க்கப்படவில்லை; இரண்டாவது καὶ, ‘தாயும்’ என்பதிலுள்ள ‘-உம்’ மூலம் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: மூன்றாம் நாளில்
  rationale: குறிப்பிட்ட காலத்தைக் காட்டும் சொற்றொடரை இயல்பான தமிழில் நேரடியாகத் தருகிறது; ‘அதற்குப் பிறகு’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: γάμος
  choice: திருமணம்
  rationale: திருமண நிகழ்வையும் அதனுடன் தொடர்புடைய கொண்டாட்டத்தையும் குறிக்கக்கூடிய கிரேக்கச் சொல்லுக்கு இயல்பான, பரந்த தமிழ்ச் சொல்; ‘திருமண விருந்து’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐγένετο
  choice: நடைபெற்றது
  rationale: ஒரு நிகழ்வு நடந்ததைத் தெரிவிக்கும் இச்சூழலில், ‘நடைபெற்றது’ என்பது இயல்பானதும் கண்ணியமானதுமான தமிழ் நடை.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள கானாவில்
  rationale: கானா கலிலேயாவில் அமைந்திருந்ததை நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: இயேசுவின் தாய்
  rationale: கிரேக்கத்தின் உறவுமுறை அமைப்பைத் தெளிவாகவும் சுருக்கமாகவும் பிரதிபலிக்கிறது.
- source_word: ἦν ... ἐκεῖ
  choice: அங்கே இருந்தார்
  rationale: பின்னணித் தகவலாகக் கூறப்படும் எளிய இருப்பிடக் குறிப்பை விரிவாக்கமின்றி இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ‘மூன்றாம் நாள்’ என்ற காலக்குறிப்பின் பொருள்
  choice: எளிய காலக்குறிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இயேசுவின் உயிர்த்தெழுதலை முன்குறிக்கும் அடையாளமாக மொழிபெயர்ப்பிலேயே விளக்குவது.
  rationale: இச்சொற்றொடர் உயிர்த்தெழுதல் சார்ந்த ஒலிப்பை வாசகர்களுக்கு ஏற்படுத்தக்கூடும்; எனினும் இந்த வசனத்தில் அது நேரடியாகக் காலத்தைக் குறிக்கிறது. ஆகவே சாத்தியமான இறையியல் ஒலிப்பை மறுக்காமலும் மொழிபெயர்ப்பில் திணிக்காமலும் அசல் சொல் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தாயும்’ என்ற வடிவம் இரண்டாவது இணைப்புச் சொல்லின் பொருளை இயல்பாகத் தக்கவைக்கிறது; தேவையற்ற விளக்கச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
