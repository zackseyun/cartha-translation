review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' command, the plural addressees, the filling with water, and the completion 'to the brim.' However, 'தொட்டிகள்' normally denotes tanks, troughs, or larger fixed receptacles and is not a suitable rendering of ὑδρίαι, which denotes portable water jars/pots.
  naturalness: The narrative is clear and modern, but replacing 'தண்ணீர்த் தொட்டிகளில்' with 'தண்ணீர்க் குடங்களைத்' gives a more idiomatic and contextually accurate Tamil expression. 'விளிம்புவரை' is natural for ἕως ἄνω.
  terminology: Use 'குடங்கள்' for the water jars. This retains the vessel sense without importing 'stone,' which belongs to the preceding verse rather than being repeated in the Greek of this verse.
  issues:
  - severity: medium
    issue: ‘தண்ணீர்த் தொட்டிகளில்’ renders ὑδρίας as tanks/troughs rather than jars.
    rationale: Ὑδρία refers to a water jar or water pot. In modern Tamil, ‘தொட்டி’ commonly suggests a tank, basin, or trough, potentially changing the pictured vessels and their use in the narrative.
  revised_text: இயேசு அவர்களிடம், “தண்ணீர்க் குடங்களைத் தண்ணீரால் நிரப்புங்கள்” என்றார். அவர்கள் அவற்றை விளிம்புவரை நிரப்பினார்கள்.
  revised_footnotes: []
  revision_rationale: The sole revision replaces ‘தொட்டிகள்’ with ‘குடங்கள்’ to represent the Greek water jars faithfully. The instrumental expression ‘தண்ணீரால் நிரப்புங்கள்’ is idiomatic Tamil and preserves the content indicated by ὕδατος. No footnote is needed, since ‘விளிம்புவரை’ adequately expresses ἕως ἄνω without introducing a disputed interpretation.
