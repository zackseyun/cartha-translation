translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை. கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக்கப்பட்டது. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டன.
