revisions:
- from: இயேசு அவர்களிடம், “தண்ணீர்த் தொட்டிகளில் தண்ணீரை நிரப்புங்கள்” என்றார். அவர்கள் அவற்றை விளிம்புவரை நிரப்பினார்கள்.
  to: இயேசு அவர்களிடம், “தண்ணீர்க் குடங்களைத் தண்ணீரால் நிரப்புங்கள்” என்றார். அவர்கள் அவற்றை விளிம்புவரை நிரப்பினார்கள்.
  rationale: The sole revision replaces ‘தொட்டிகள்’ with ‘குடங்கள்’ to represent the Greek water jars faithfully. The instrumental expression ‘தண்ணீரால் நிரப்புங்கள்’ is idiomatic Tamil and preserves the content indicated by ὕδατος. No footnote is needed, since ‘விளிம்புவரை’ adequately expresses ἕως ἄνω without introducing a disputed interpretation.
