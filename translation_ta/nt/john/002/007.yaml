reference: John 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: ta
  text: இயேசு அவர்களிடம், “தண்ணீர்க் குடங்களைத் தண்ணீரால் நிரப்புங்கள்” என்றார். அவர்கள் அவற்றை விளிம்புவரை நிரப்பினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இயேசுவின் பேச்சு யாரை நோக்கியது என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Γεμίσατε
  choice: நிரப்புங்கள்
  rationale: பன்மையினரை நோக்கிய நேரடிக் கட்டளையை மரியாதையும் இயல்பும் கொண்ட தமிழ் ஏவல் வடிவில் தருகிறது.
- source_word: τὰς ὑδρίας
  choice: தண்ணீர்த் தொட்டிகளில்
  rationale: ὑδρία தண்ணீர் வைக்கும் பெரிய பாத்திரத்தைக் குறிக்கிறது; முந்தைய வசனச் சூழலிலுள்ள கொள்ளளவுக்கு ஏற்ற வகையில் ‘தொட்டிகள்’ தெளிவாக உள்ளது. இவ்வசனத்தில் மீண்டும் இல்லாத ‘கல்’ என்பது சேர்க்கப்படவில்லை.
- source_word: ὕδατος
  choice: தண்ணீரை
  rationale: γεμίζω என்பதுடன் வரும் உள்ளடக்கத்தைக் குறிக்கும் மரபைத் தமிழில் நேரடி செயப்படுபொருளாக இயல்பாக வழங்குகிறது.
- source_word: ἐγέμισαν αὐτάς
  choice: அவர்கள் அவற்றை ... நிரப்பினார்கள்
  rationale: பணியாளர்களின் நிறைவேற்றப்பட்ட செயலைத் தெளிவாகக் கூறுகிறது; பெண்பால் பன்மைச் சுட்டுப்பெயருக்கு தமிழில் ‘அவற்றை’ இயல்பான இணை.
- source_word: ἕως ἄνω
  choice: விளிம்புவரை
  rationale: பாத்திரங்கள் மேற்பகுதி வரை முழுமையாக நிரப்பப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
