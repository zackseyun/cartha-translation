source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: ta
  text: ஆலயத்தில்[a] மாடுகள், செம்மறியாடுகள், புறாக்கள் ஆகியவற்றை விற்றுக்கொண்டிருந்தவர்களையும், நாணயம் மாற்றுபவர்கள் அங்கே அமர்ந்திருந்ததையும் அவர் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என்பதற்குப் பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் ἱερόν; அது உள் பரிசுத்த இடத்தை மட்டும் அல்ல, ஆலய வளாகத்தையும் அதன் முற்றங்களையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: கண்டார்
  rationale: இங்கு இயேசு ஆலயத்திற்குள் வந்தபோது எதிர்கொண்ட காட்சியை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பார்த்தார்’ என்பதைவிட மூலச்சொல்லின் ‘கண்டடைதல்/காணுதல்’ பொருளுக்கு நெருக்கமானது.
- source_word: ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது. பொதுவாசிப்புக்கு ‘ஆலயம்’ இயல்பானது; அதன் பரந்த இடப்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: πωλοῦντας
  choice: விற்றுக்கொண்டிருந்தவர்களையும்
  rationale: நிகழ்ந்துகொண்டிருந்த செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான தன்மையைப் பாதுகாக்கிறது.
- source_word: βόας
  choice: மாடுகளையும்
  rationale: βοῦς கால்நடைகளை, குறிப்பாக மாடுகளை, குறிக்கலாம். ‘எருதுகள்’ என்று பாலினம் அல்லது பயன்பாட்டை மிகையாகக் குறிப்பதைத் தவிர்த்து, இயல்பான பொதுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: πρόβατα
  choice: செம்மறியாடுகளையும்
  rationale: πρόβατα என்பதற்கான தெளிவான நவீனத் தமிழ் இணை; ‘ஆடுகள்’ என்பதில் வெள்ளாடுகளும் சேர்ந்து புரிந்துகொள்ளப்படக்கூடியதால் இது துல்லியமானது.
- source_word: περιστερὰς
  choice: புறாக்களையும்
  rationale: περιστερά புறா வகையைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் புரியும் சொல்.
- source_word: κερματιστὰς
  choice: நாணயம் மாற்றுகிறவர்கள்
  rationale: வெவ்வேறு நாணயங்களை மாற்றிக் கொடுப்பவர்களை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: καθημένους
  choice: உட்கார்ந்திருந்ததையும்
  rationale: அவர்கள் அமர்ந்த நிலையில் அங்கே பணியாற்றிய நிலையான இருப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எருசலேம் ஆலயம் தொடர்பாக ἱερόν என்பதன் இடப்பரப்பு
  choice: முதன்மை உரையில் ‘ஆலயத்தில்’ என்று மொழிபெயர்த்து, அது ஆலய வளாகத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெரிவித்தல்
  alternative: ‘ஆலய முற்றங்களில்’ அல்லது ‘ஆலய வளாகத்தில்’
  rationale: விலங்கு விற்பவர்களும் நாணயம் மாற்றுபவர்களும் இருந்த இடம் உள் திருத்தலம் அல்ல, விரிந்த ஆலய வளாகம். வாசிப்பின் இயல்புக்காக பொதுவான சொல்லை உரையில் வைத்து, வரலாற்று மற்றும் இடவியல் நுட்பத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியலின் இணைப்புகளும் தொடர்ச்சியான செயல்களும் மூலத்தின் வாக்கிய ஓட்டத்துக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
