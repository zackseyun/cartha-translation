review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the invitees and the destination. However, அழைக்கப்பட்டிருந்தார்கள் is a past-perfect/progressive-perfect form (“had been invited”), whereas ἐκλήθη is an aorist passive and is best represented here by the simple past passive “were invited.” The -உம் forms naturally convey both coordination and the additive sense in context.
  naturalness: The wording is clear and modern. Replacing the past-perfect form with அழைக்கப்பட்டனர் yields a more direct, idiomatic narrative statement without introducing an unwarranted temporal nuance.
  terminology: இயேசு, சீடர்கள், and திருமணம் are appropriate established terms in modern standard Tamil. அந்தத் is acceptable as a contextual rendering of τόν and does not over-specify the referent.
  issues:
  - severity: low
    issue: Past-perfect verbal form
    rationale: அழைக்கப்பட்டிருந்தார்கள் can imply that the invitations had already occurred before another past event. The Greek aorist passive ἐκλήθη merely states that Jesus and his disciples were invited; a simple past passive preserves this more closely.
  revised_text: இயேசுவும் அவருடைய சீடர்களும் அந்தத் திருமணத்திற்கு அழைக்கப்பட்டனர்.
  revised_footnotes: []
  revision_rationale: The revision changes only the Tamil verb from a past-perfect form to a simple past passive, matching the Greek aorist passive without adding temporal sequencing. The coordinated -உம் construction retains the source’s additive and coordinating force.
