  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: ta
  text: இயேசுவும் அவருடைய சீடர்களும் அந்தத் திருமணத்திற்கு அழைக்கப்பட்டனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: அழைக்கப்பட்டிருந்தார்கள்
  rationale: சமூக நிகழ்வில் கலந்துகொள்வதற்கான அழைப்பை இச்சூழல் குறிக்கிறது. இயேசுவையும் அவருடைய சீடர்களையும் இணைந்த எழுவாயாகத் தமிழில் இயல்பாகக் கூறுவதால் பன்மை வினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: δὲ καὶ
  choice: -உம்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களுடன் இயேசுவையும் அவருடைய சீடர்களையும் சேர்த்துக் காட்டும் மென்மையான இணைப்பு மற்றும் சேர்க்கைப் பொருளைத் தமிழ் இணைப்பிடைச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: μαθηταί என்பதிலுள்ள கற்றுக்கொள்பவர்கள் மற்றும் இயேசுவைச் சார்ந்த குழுவினர் என்ற இரு கூறுகளையும் ‘சீடர்கள்’ பாதுகாக்கிறது; αὐτοῦ மரியாதைமிக்க இயல்பான தமிழில் ‘அவருடைய’ என வழங்கப்பட்டது.
- source_word: εἰς τὸν γάμον
  choice: அந்தத் திருமணத்திற்கு
  rationale: γάμος இங்கு திருமண நிகழ்வைக் குறிக்கிறது. கிரேக்க வரையறைச் சுட்டின் சூழல்சார் தன்மையை ‘அந்த’ வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘விருந்து’ சேர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. கிரேக்கத்தின் ஒருமைச் செயலற்ற வினையை சொற்சொல்லாகப் பின்பற்றாமல், இணைந்த எழுவாய்க்கேற்ற இயல்பான தமிழ் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது; பொருள் மாற்றப்படவில்லை.
