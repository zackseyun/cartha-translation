revisions:
- from: இயேசுவும் அவருடைய சீடர்களும் அந்தத் திருமணத்திற்கு அழைக்கப்பட்டிருந்தார்கள்.
  to: இயேசுவும் அவருடைய சீடர்களும் அந்தத் திருமணத்திற்கு அழைக்கப்பட்டனர்.
  rationale: The revision changes only the Tamil verb from a past-perfect form to a simple past passive, matching the Greek aorist passive without adding temporal sequencing. The coordinated -உம் construction retains the source’s additive and coordinating force.
