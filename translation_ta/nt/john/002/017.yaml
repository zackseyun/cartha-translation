source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: ta
  text: அவருடைய சீடர்கள், “உமது வீட்டின்மேலுள்ள ஆர்வம் என்னை அழித்துவிடும்[a]” என்று எழுதப்பட்டிருக்கிறது என்பதை நினைவுகூர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை அழித்துவிட்டது.” சங்கீதம் 69:9-இன் சில உரைமரபுகளில் இவ்வாறு உள்ளது; யோவானின் கிரேக்க உரையில் “அழித்துவிடும்” என்ற எதிர்கால வடிவமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: நினைவுகூர்ந்தார்கள்
  rationale: இறந்தகால நிகழ்வாகிய ‘நினைத்தார்கள்/நினைவுகூர்ந்தார்கள்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; வெளிப்புறமாக நினைவூட்டப்பட்டார்கள் என்று தேவையின்றி கூறுவதில்லை.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: μαθητής என்பதற்கான நிலையான புதிய ஏற்பாட்டுத் தமிழ் ‘சீடர்கள்’; αὐτοῦ-வின் உறவையும் தெளிவாகக் காக்கிறது.
- source_word: γεγραμμένον ἐστίν
  choice: எழுதியிருப்பதை
  rationale: எழுதப்பட்ட வசனம் தொடர்ந்து நிலைத்திருப்பதைக் குறிக்கும் நிறைவு வினையின் கருத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: Ὁ ζῆλος
  choice: வைராக்கியம்
  rationale: இங்கு கடவுளின் வீட்டின்மீதான தீவிர அக்கறையையும் அர்ப்பணிப்பையும் குறிக்கிறது. ‘பொறாமை’ இச்சூழலில் தவறான பொருளைத் தரக்கூடும்.
- source_word: τοῦ οἴκου σου
  choice: உமது வீட்டைக் குறித்த
  rationale: மேற்கோளின் ‘வீடு’ என்ற உருவகத்தைத் தக்கவைக்கிறது; சூழலுக்கேற்ப ‘ஆலயம்’ என்று விளக்கி மொழிபெயர்த்து பழைய ஏற்பாட்டு மேற்கோளின் சொல்வடிவத்தை மறைக்கவில்லை.
- source_word: καταφάγεταί με
  choice: என்னை விழுங்கிவிடும்
  rationale: எதிர்கால வினை வடிவத்தையும், முற்றிலும் உட்கொள்ளும் வலுவான உருவகத்தையும் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் உள்ள எதிர்கால வினை இயேசுவுக்குப் பொருத்தப்படுவது
  choice: “என்னை விழுங்கிவிடும்” என்ற எதிர்கால வாசகத்தைத் தக்கவைத்தல்
  alternative: “என்னை விழுங்கிவிட்டது”
  rationale: யோவானின் கிரேக்க உரையில் καταφάγεταί என்பது எதிர்கால வடிவம். ஆகவே வேறு சங்கீத உரைமரபுகளின் இறந்தகால வாசகத்துடன் ஒத்திசைக்காமல் யோவானின் சொல்வடிவமே பின்பற்றப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. வேதாகம மேற்கோளுக்குரிய உயர்ந்த தொனிக்காக ‘உமது’, ‘வைராக்கியம்’ ஆகியவை வைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
