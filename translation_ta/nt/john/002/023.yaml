revisions:
- from: அவர் பஸ்கா பண்டிகையின்போது[a] எருசலேமில் இருந்தபோது, அவர் செய்துகொண்டிருந்த அடையாளங்களைக் கண்டு, பலர் அவருடைய பெயரில் நம்பிக்கை வைத்தார்கள்.[b]
  to: அவர் பஸ்கா பண்டிகையின்போது[a] எருசலேமில் இருந்தபோது, அவர் செய்துகொண்டிருந்த அடையாளங்களைக் கண்டு, பலர் அவருடைய பெயரின்மேல் நம்பிக்கை வைத்தார்கள்.[b]
  rationale: Only the Tamil postposition governing ‘name’ has been changed. This preserves the Greek πιστεύω εἰς (‘believe in/upon’) construction, avoids the misleading Tamil sense ‘in his name,’ and retains the translation’s deliberate refusal to prejudge the quality of the belief in light of the following verse. The existing footnote anchors are structurally valid and remain attached to the terms they explain.
