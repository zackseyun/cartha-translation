id: JHN.2.23
reference: John 2:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: ta
  text: அவர் பஸ்கா பண்டிகையின்போது[a] எருசலேமில் இருந்தபோது, அவர் செய்துகொண்டிருந்த அடையாளங்களைக் கண்டு, பலர் அவருடைய பெயரின்மேல் நம்பிக்கை வைத்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பஸ்கா’ என்பது இஸ்ரவேலர் எகிப்திலிருந்து விடுவிக்கப்பட்டதை நினைவுகூரும் பண்டிகை.
    reason: cultural_context
  - marker: b
    text: ‘அவருடைய பெயரின்மேல் நம்பிக்கை வைத்தார்கள்’ என்பதை ‘அவரை நம்பினார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘பெயர்’ என்பது வெளிப்படுத்தப்பட்ட அவரது ஆளுமையையும் அடையாளத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: அவர் எருசலேமில் இருந்தபோது
  rationale: ὡς என்பதன் காலத் தொடர்பையும் δέ என்பதன் மென்மையான தொடர்ச்சியையும் தமிழில் இயல்பான காலவாக்கியத்தால் வெளிப்படுத்துகிறது; தேவையற்ற ‘இப்போது’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: பஸ்கா பண்டிகையின்போது
  rationale: இரு சொற்றொடர்களும் ஒரே பண்டிகைச் சூழலைக் குறிக்கின்றன. தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து, πάσχα மற்றும் ἑορτή ஆகிய இரண்டின் தகவலையும் ஒருங்கிணைக்கிறது.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயரில் நம்பிக்கை வைத்தார்கள்
  rationale: யோவானுக்கே உரிய ‘அவருடைய பெயரில் நம்புதல்’ என்ற சொல்லாட்சியைத் தக்கவைத்து, வெளிப்படுத்தப்பட்ட அவருடைய அடையாளத்தின்மீது செலுத்தப்படும் நம்பிக்கையை இயல்பான தமிழில் கூறுகிறது.
- source_word: θεωροῦντες
  choice: கண்டு
  rationale: அவர்கள் அடையாளங்களை நேரில் கவனித்ததே நம்பிக்கைக்கான சூழல் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὰ σημεῖα ἃ ἐποίει
  choice: அவர் செய்துகொண்டிருந்த அடையாளங்கள்
  rationale: σημεῖα என்பதற்கு யோவானின் முக்கிய சொல்லான ‘அடையாளங்கள்’ என்பதைக் காத்து, ἐποίει என்ற இறந்தகாலத் தொடர்நிலையை ‘செய்துகொண்டிருந்த’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ குறிக்கும் நம்பிக்கையின் தன்மை
  choice: பலர் அவருடைய பெயரில் நம்பிக்கை வைத்தார்கள்
  alternative: பலர் அற்புதங்களால் ஈர்க்கப்பட்டு மேலோட்டமாக நம்பினார்கள்
  rationale: இந்த வசனம் அந்த நம்பிக்கையை நேரடியாகக் கூறுகிறது; அதன் போதாமையை மொழிபெயர்ப்பிலேயே முன்கூட்டியே சேர்க்காமல், அடுத்த வசனம் தரும் பதற்றத்தையும் நுட்பத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அடையாளங்கள்’ என்ற யோவானிய சொல் ‘அற்புதங்கள்’ என விரிவாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் [a], [b] முதன்மை உரையில் இடம்பெற்றுள்ளன.
