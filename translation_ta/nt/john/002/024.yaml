base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: ta
  text: ஆனால் இயேசுவோ தம்மை அவர்களிடம் ஒப்படைக்கவில்லை[a]; ஏனெனில் அவர் அனைவரையும் அறிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முந்தைய வசனத்தில் பலர் இயேசுவின்மேல் “நம்பிக்கை வைத்தார்கள்” என்று சொல்லப்பட்ட இடத்திலும், இங்கு அவர் தம்மை அவர்களிடம் “ஒப்படைக்கவில்லை” என்று சொல்லப்படும் இடத்திலும் கிரேக்கத்தில் ஒரே வினை பயன்படுத்தப்பட்டுள்ளது.
