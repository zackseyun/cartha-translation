lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: ஆனால் இயேசுவோ
  rationale: δέ காட்டும் எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ வெளிப்படுத்துகிறது; αὐτός தரும் அழுத்தத்தையும் முந்தைய வசனத்தில் நம்பியவர்களுக்கும் இயேசுவுக்கும் உள்ள மாறுபாட்டையும் ‘இயேசுவோ’ இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: οὐκ ἐπίστευεν
  choice: ஒப்படைக்கவில்லை
  rationale: இங்கு πιστεύω என்பது தன்னை ஒருவரிடம் நம்பி ஒப்படைப்பதைக் குறிக்கிறது. தமிழில் ‘தம்மை ஒப்படைக்கவில்லை’ என்பது இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது; கிரேக்க இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது நிலைப்பாட்டுத் தன்மையைச் சூழல் ஏந்துகிறது.
- source_word: αὑτὸν αὐτοῖς
  choice: அவர்களிடம் தம்மை
  rationale: தற்சுட்டுப் பெயரையும் கொடைவேற்றுமைப் பொருளையும் இயல்பான தமிழ் சொல்வரிசையில் அளித்து, இயேசு தம்மையே அவர்களிடம் ஒப்படைக்கவில்லை என்ற தனிப்பட்ட அர்ப்பணிப்பு மறுப்பைத் தக்கவைக்கிறது.
- source_word: διὰ τὸ
  choice: ஏனெனில்
  rationale: διά உடன் வரும் articular infinitive இங்கு காரணத்தைக் குறிக்கிறது; ‘ஏனெனில்’ நவீன செம்மையான தமிழில் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτὸν γινώσκειν
  choice: அவர் ... அறிந்திருந்தார்
  rationale: கிரேக்க infinitive அமைப்பு தமிழில் இயல்பான காரண வாக்கியமாக மாற்றப்பட்டுள்ளது. ‘அறிந்திருந்தார்’ என்பது அந்நேரத்துக்கு முன்பே நிலவிய முழுமையான அறிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντας
  choice: எல்லாரையும்
  rationale: ஆண்பால் பன்மை இச்சூழலில் மக்களைப் பொதுவாகக் குறிக்கிறது. ‘எல்லாரையும்’ பாலினத்தால் வரையறுக்காமல் அதன் பரந்த அளவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: 23–24ஆம் வசனங்களில் πιστεύω என்ற ஒரே வினையின் சொல்விளையாட்டு
  choice: 23ஆம் வசனத்தில் ‘நம்பினர்’ என்ற பொருளுக்கும் இங்கு ‘தம்மை ஒப்படைக்கவில்லை’ என்ற பொருளுக்கும் உள்ள தொடர்பை அடிக்குறிப்பில் தெரிவித்து, இவ்வசனத்தில் இயல்பான தமிழ்ப் பொருளைப் பயன்படுத்துதல்
  alternative: இரு வசனங்களிலும் ‘நம்பு’ என்ற ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தில் ஒரே வினை திட்டமிட்ட மாறுபாட்டை உருவாக்குகிறது; ஆனால் ‘இயேசு தம்மை அவர்களுக்கு நம்பவில்லை’ என்பது தமிழில் இயல்பற்றதும் பொருள் மங்கலானதும் ஆகும். ஆகவே பிரதான உரையில் பொருள் தெளிவும் அடிக்குறிப்பில் சொல் தொடர்பும் பாதுகாக்கப்படுகின்றன.
- issue: πάντας என்பதன் வரம்பு
  choice: எல்லாரையும்
  alternative: அந்த மக்களையெல்லாம்
  rationale: கிரேக்க உரை ஒரு குறிப்பிட்ட துணைக்குழுவாக வரம்பிடாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்தப் பொதுமையைத் தக்கவைக்கிறது; வசனம் கூறுவதைவிட விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இயேசுவோ’ எதிர்மறை மாறுபாட்டையும் அழுத்தத்தையும் சுருக்கமாகத் தருகிறது. வசன முடிவிலுள்ள காற்புள்ளி தனித்து வழங்கப்பட்ட ஆதாரத்தின் தொடர்ச்சித் தன்மையைச் சுட்டினாலும், தமிழில் முழுமையான வசனமாக முற்றுப்புள்ளி இடப்பட்டுள்ளது.
