reference: John 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: ta
  text: எனவே யூதர்கள்[a], “இந்த ஆலயம் நாற்பத்தாறு ஆண்டுகளில் கட்டப்பட்டது; நீயோ இதை மூன்று நாட்களில் எழுப்புவாயா[b]?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதேயர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘யூதர்கள்’ என்று உள்ளது; யோவான் இந்தச் சொல்லைச் சூழலுக்கு ஏற்ப வெவ்வேறு வரம்புகளில் பயன்படுத்துகிறார்.
    reason: alternative_reading
  - marker: b
    text: ‘மீண்டும் கட்டுவாயா’ என்றும் புரிந்துகொள்ளலாம். பேசுவோர் இதைக் கட்டுமானத்தைக் குறித்ததாகப் புரிந்துகொள்கிறார்கள்; ஆனால் ‘எழுப்புவாயா’ என்ற மொழிபெயர்ப்பு, பின்னர் யோவான் இயேசுவின் உயிர்த்தெழுதலோடு இணைக்கும் சொல் நயத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் இயேசு கூறியதற்கு அவர்களின் பதிலை இயல்பான தமிழில் தொடர்ச்சியாகக் காட்டுகிறது; இங்கு கடுமையான தர்க்க முடிவைக் குறிக்கும் ‘ஆகவே’ என்பதைவிட உரையாடல் தொடர்ச்சியான ‘அப்போது’ பொருத்தமானது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் நேரடியான, பொதுவாகப் புரியும் தமிழ் இணை. ‘யூதேயர்கள்’ என்பதும் சாத்தியம்; ‘யூதத் தலைவர்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத குறுகிய அடையாளத்தைச் சேர்க்கும்.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: நாற்பத்தாறு ஆண்டுகளில்
  rationale: கட்டுமானம் நிறைவேற எடுத்த கால அளவைச் சுட்டும் கால வேற்றுமையைப் பாதுகாக்கிறது.
- source_word: οἰκοδομήθη
  choice: கட்டப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது; நீண்ட கட்டுமானப் பணியை மூலத்தைவிட விரிவாக விளக்கவில்லை.
- source_word: ὁ ναὸς οὗτος
  choice: இந்த ஆலயம்
  rationale: ναός குறிப்பாக ஆலயத்தின் பரிசுத்தக் கட்டிடத்தைக் குறிக்கலாம். ‘ஆலயம்’ நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ‘ஆலய வளாகம்’ என விரிவாக்கப்படவில்லை.
- source_word: καὶ σὺ
  choice: நீயோ
  rationale: σὺ என்பதன் வலியுறுத்தலையும் பேச்சாளர்களின் நம்பமுடியாத கேள்வித் தொனியையும் தமிழின் ‘-ஓ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τρισὶν ἡμέραις
  choice: மூன்று நாட்களில்
  rationale: கால எல்லையை இயல்பான தமிழில் தருகிறது; அடுத்த வசனத்தில் வெளிப்படும் உயிர்த்தெழுதல் தொடர்பை முன்னதாக விளக்கவில்லை.
- source_word: ἐγερεῖς
  choice: எழுப்புவாயா
  rationale: ἐγείρω என்பதன் ‘எழுப்பு’ என்ற அடிப்படைச் சொல்லையும் பின்னர் இயேசுவின் உயிர்த்தெழுதலோடு உருவாகும் சொல் தொடர்பையும் காக்கிறது. ‘மீண்டும் கட்டுவாயா’ என்பது கேட்போரின் புரிதலை மட்டும் வெளிப்படுத்தி யோவானின் இரட்டைப் பொருள் நயத்தைத் தட்டையாக்கும்.
- source_word: αὐτόν
  choice: இதை
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆலயத்தை இயல்பான தமிழ் சுட்டுப்பெயரால் குறிக்கிறது.
theological_decisions:
- issue: யோவான் நூலில் οἱ Ἰουδαῖοι என்பதால் எழக்கூடிய யூதவிரோதப் பொதுமைப்படுத்தல்
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று வைத்தல்
  alternative: ‘யூதேயர்கள்’ அல்லது ‘யூதத் தலைவர்கள்’
  rationale: ‘யூதர்கள்’ என்பது மூலத்தின் நேரடி பொருளைப் பாதுகாக்கிறது. இந்தச் சூழலில் யூதேயாவில் ஆலயத்தில் பேசுவோர் குறிக்கப்படலாம்; ஆனால் ‘தலைவர்கள்’ எனக் குறுக்குவது வசனத்தில் வெளிப்படையாக இல்லாத தகவலைச் சேர்க்கும். சொல்லின் சூழல்சார் வரம்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἐγερεῖς என்பதற்கும் உயிர்த்தெழுதல் உருவகத்திற்கும் உள்ள தொடர்பு
  choice: ‘எழுப்புவாயா’
  alternative: ‘மீண்டும் கட்டுவாயா’
  rationale: பேச்சாளர்கள் கட்டிடத்தைக் குறித்து புரிந்துகொள்கிறார்கள்; அடுத்த வசனத்தில் யோவான் இயேசுவின் உடலைக் குறித்ததாக விளக்குகிறார். ‘எழுப்பு’ இந்த இறையியல் இரட்டைப் பொருளையும் பதற்றத்தையும் முன்கூட்டியே தீர்க்காமல் பாதுகாக்கிறது.
