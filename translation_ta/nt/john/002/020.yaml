  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. ‘நீயோ’ என்பது வியப்பும் நம்பமுடியாமையும் கலந்த வினாத் தொனியை இயல்பாகக் காட்டுகிறது. ‘ஆலயம்’ மற்றும் ‘எழுப்பு’ ஆகியவை மூலத்தின் சொல் தொடர்புகளையும் திட்டமிட்ட இரட்டைப் பொருளையும் காக்கின்றன.
