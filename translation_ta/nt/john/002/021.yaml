revisions:
- from: ஆனால் அவர் தமது உடலாகிய ஆலயத்தைப் பற்றியே பேசிக்கொண்டிருந்தார்.[a]
  to: ஆனால் அவர் தமது உடலாகிய ஆலயத்தைப் பற்றி பேசிக்கொண்டிருந்தார்.[a]
  rationale: The revision removes an added emphatic suffix while retaining the source’s contrast, ongoing past sense, and direct metaphorical identification of Jesus’ body as the temple. The footnote is stylistically standardized without changing its lexical content.
  reviewer_model: gpt-5.6-terra
