id: JHN.2.21
reference: John 2:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: ta
  text: ஆனால் அவர் தமது உடலாகிய ஆலயத்தைப் பற்றி பேசிக்கொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது உடலாகிய திருத்தலம்.” இங்குள்ள கிரேக்கச் சொல் ναός; அது முழு ஆலய வளாகத்தைக் காட்டிலும் குறிப்பாக அதன் புனித உட்பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: சூழலில் இது இயேசுவைக் குறிக்கிறது; தமிழில் மரியாதை ஒருமைப் பெயர்ச்சொல் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் ஏற்பட்ட தவறான புரிதலுக்கு எதிரான மென்மையான வேறுபாட்டை இது காட்டுகிறது.
- source_word: ἔλεγεν
  choice: பேசிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் நீடித்த அல்லது விளக்கவுரைத் தன்மையுள்ள செயலைக் குறிக்கும் imperfect வடிவத்தின் கூறை இயன்றவரை காக்கிறது.
- source_word: περὶ
  choice: பற்றியே
  rationale: περί உடன் வரும் genitive-இன் ‘பற்றி’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘-ஏ’ இந்த விளக்கத்தின் எதிர்மறை வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: ναοῦ
  choice: ஆலயம்
  rationale: ναός முழுக் கோவில் வளாகத்தைவிடக் குறிப்பாக ஆலயத்தின் புனித உட்பகுதியைக் குறிக்கலாம்; பொதுவாசிப்பில் இயல்பான ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σώματος
  choice: உடல்
  rationale: இயேசுவின் உடலைக் குறிக்கும் நேரடியானதும் இறையியல் முக்கியத்துவமுள்ளதுமான சொல்.
- source_word: αὐτοῦ
  choice: தமது
  rationale: உடல் இயேசுவுக்கே உரியது என்பதைத் தெளிவாக்கும் மரியாதைத் தற்சுட்டுப் possessive; வாக்கியத்தின் எழுவாயான ‘அவர்’ என்பதையே மீண்டும் சுட்டுகிறது.
theological_decisions:
- issue: இயேசுவின் உடலும் ஆலயமும் இடையிலான உருவக அடையாளம்
  choice: ‘தமது உடலாகிய ஆலயம்’ என்று உருவக அடையாளத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘தமது உடல் என்னும் ஆலயம்’ அல்லது ‘தமது உடலை ஆலயமாகக் குறித்து’
  rationale: யோவானின் விளக்கம் இயேசுவின் உடலை ஆலயத்துடன் அடையாளப்படுத்துகிறது. கூடுதல் கோட்பாட்டு விளக்கமின்றி அந்தக் கிறிஸ்துவியல் உருவகத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அவர்/தமது’ மரியாதை ஒருமையைப் பேணுகின்றன; ‘ஆலயம்’ வாசிப்புக்கு இயல்பானதாகவும் ‘திருத்தலம்’ அடிக்குறிப்பில் சொற்பொருள் நுணுக்கத்தைப் பாதுகாப்பதாகவும் உள்ளது.
