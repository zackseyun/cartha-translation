  terminology: ‘திராட்சை மது’ clearly denotes wine and avoids the possible modern ambiguity of ‘திராட்சரசம்’ as non-alcoholic grape juice. ‘இயேசுவின் தாய்’ appropriately follows John’s designation, and respectful singular reference to Jesus is retained.
