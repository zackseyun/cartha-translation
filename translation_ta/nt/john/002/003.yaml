source:
  edition: SBLGNT
  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: ta
  text: திராட்சை மது தீர்ந்துபோனபோது[a], இயேசுவின் தாய் அவரிடம், “அவர்களிடம் திராட்சை மது இல்லை” என்று சொல்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, ‘திராட்சை மது இல்லாமல் போனபோது.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் வரலாற்று நிகழ்காலமான ‘சொல்கிறார்’ பயன்படுத்தப்பட்டுள்ளது. சில மொழிபெயர்ப்புகள் இதை ‘சொன்னார்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: திராட்சரசம் தீர்ந்துபோனபோது
  rationale: இறந்தகால வினையெச்சத்துடன் அமைந்த தனி உடைமைவேற்றுமைத் தொடர், முதன்மை வினைக்கு முன்னதாக ஏற்பட்ட சூழ்நிலையைச் சுட்டுகிறது. ‘தீர்ந்துபோனபோது’ என்பது பற்றாக்குறை ஏற்பட்டதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்கக் கதைநடையில் இது வரலாற்று நிகழ்காலமாக உள்ளது. தமிழிலும் நிகழ்காலக் கதைநடை இயல்பாக அமையக்கூடியதால், யோவானின் உயிரோட்டமான நிகழ்கால வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: இயேசுவின் தாய்
  rationale: கிரேக்கச் சொல்லமைப்பை நெருக்கமாகப் பின்பற்றி, இப்பகுதியில் யோவான் அவரைக் குறிப்பிடும் தனித்துவமான முறையைப் பாதுகாக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: பேச்சு யாரை நோக்கிக் கூறப்பட்டது என்பதை இயல்பான தமிழில் குறிக்கிறது; மரியாதை ஒருமை இயேசுவைக் குறிப்பிடும் வழக்கமான கண்ணியமான நடைக்கு ஏற்றது.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: அவர்களிடம் திராட்சரசம் இல்லை
  rationale: பன்மை வினையில் மறைந்துள்ள எழுவாயை ‘அவர்கள்’ என்று மட்டும் காட்டுகிறது. திருமண விருந்தை நடத்துவோர் அல்லது விருந்தினர் என்று வெளிப்படையாக நிர்ணயிக்காமல், மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: οἶνος
  choice: திராட்சரசம்
  rationale: சூழலில் திராட்சையிலிருந்து தயாரிக்கப்படும் மதுவைக் குறிக்கும் வழக்கமான பொருள் இது; சொல்லின் பொருளை மெலிதாக்காமல் நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: யோவான் கதைநடையில் வரலாற்று நிகழ்காலம்
  choice: ‘சொல்கிறார்’ என்று நிகழ்காலத்தைப் பாதுகாத்தல்
  alternative: தமிழ் இறந்தகாலக் கதைநடைக்காக ‘சொன்னார்’ என்று மொழிபெயர்த்தல்
  rationale: இது முதன்மையாக உரைநடை சார்ந்த முடிவு. நிகழ்காலத்தைப் பாதுகாப்பது இறையியல் பொருளை மாற்றாமல் கிரேக்கக் கதைநடையின் உயிரோட்டத்தை பிரதிபலிக்கிறது.
- issue: ‘அவர்களிடம் திராட்சரசம் இல்லை’ என்பதில் மறைந்துள்ள பன்மை எழுவாயின் குறிப்பு
  choice: ‘அவர்கள்’ என்று மட்டும் கூறி, அதன் குறிப்பைச் சூழலிலேயே விடுதல்
  alternative: ‘திருமண விருந்தை நடத்துகிறவர்களிடம்’ அல்லது ‘திருமண வீட்டாரிடம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்க உரை அந்தப் பன்மை எழுவாய் யாரென்று வெளிப்படையாகச் சொல்லவில்லை. ஆகவே கூடுதல் விவரத்தைப் புகுத்தாமல் உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதை ஒருமை கையாளப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
