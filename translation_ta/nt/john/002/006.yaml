  - severity: low
    issue: The capacity clause can more clearly express the object held and agree naturally with the plural jars.
    rationale: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς denotes the capacity of each jar. “ஒவ்வொன்றும் இரண்டு அல்லது மூன்று அளவு தண்ணீர் கொள்ளக்கூடியவையாக இருந்தன” preserves the distributive sense and reads naturally.
