  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: ta
  text: அங்கே யூதர்களின் தூய்மைப்படுத்தும் சடங்குகளுக்காக[a] கல்லால் ஆன ஆறு தண்ணீர்க் குடங்கள் வைக்கப்பட்டிருந்தன. அவை ஒவ்வொன்றும் இரண்டு அல்லது மூன்று அளவு தண்ணீர் கொள்ளக்கூடியவையாக இருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களின் தூய்மைப்படுத்தும் வழக்கத்தின்படி.” இது சடங்குசார் தூய்மைப்படுத்தும் பழக்கங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அளவு” என்பதற்கான கிரேக்கச் சொல் மெத்ரேத்தேஸ் (metretēs). இது ஒரு பண்டைய திரவ அளவு; தோராயமாக 35–40 லிட்டர்.
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  choice: கல்லால் ஆன தண்ணீர்க் குடங்கள்
  rationale: λίθιναι என்பது குடங்கள் கல்லால் செய்யப்பட்டவை என்பதையும், ὑδρίαι என்பது தண்ணீர் வைக்கும் குடங்களையும் குறிக்கிறது. இந்தத் தமிழ் நடை பொருளையும் பாத்திர வகையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἦσαν δὲ ἐκεῖ ... κείμεναι
  choice: அங்கே ... வைக்கப்பட்டிருந்தன
  rationale: δέ-யின் மெலிந்த இணைப்புப் பணி தமிழில் தனிச் சொல்லால் வெளிப்படுத்தப்படவில்லை. ἐκεῖ ‘அங்கே’ என்று காக்கப்படுகிறது; κείμεναι இங்கு குடங்கள் ஓர் இடத்தில் வைக்கப்பட்டிருந்த நிலையைச் சுட்டுகிறது.
- source_word: ἓξ
  choice: ஆறு
  rationale: எண்ணிக்கையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: யூதர்களின் சடங்குமுறைத் தூய்மைப்படுத்தலுக்காக
  rationale: καθαρισμός இச்சூழலில் சடங்குசார்ந்த தூய்மைப்படுத்தலைக் குறிக்கிறது. κατά நோக்கம் அல்லது வழக்கத்துடனான ஒத்திசைவு ஆகிய இரண்டையும் உணர்த்தக்கூடும்; முதன்மை உரையில் நோக்கப் பொருள் தேர்ந்தெடுக்கப்பட்டு, மாற்று சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χωροῦσαι
  choice: கொள்ளக்கூடியதாக இருந்தது
  rationale: இங்கு χωρέω என்பது ஒரு பாத்திரத்தின் கொள்ளளவைக் குறிக்கிறது.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: ஒவ்வொரு குடமும் இரண்டு அல்லது மூன்று அளவுகள்
  rationale: ἀνά-வின் பகிர்ந்தளிக்கும் பொருள் ‘ஒவ்வொரு குடமும்’ என்பதால் வெளிப்படுத்தப்படுகிறது. μετρητής என்ற பண்டைய அலகு துல்லியமற்ற நவீன மாற்றீட்டால் மாற்றப்படாமல் ‘அளவு’ என்று வைக்கப்பட்டு, தோராயமான மதிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யோவான் நூலில் τῶν Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இங்கு குறிப்பு பிராந்திய அடையாளத்தைவிட யூதர்களின் அங்கீகரிக்கப்பட்ட சடங்குமுறைத் தூய்மைப்படுத்தும் பழக்கத்தைப் பற்றியது. ஆகவே ‘யூதர்களின்’ என்பது இச்சூழலுக்குப் பொருத்தமானது; தேவையற்ற எதிர்மறை அல்லது சர்ச்சைத் தொனியையும் சேர்ப்பதில்லை.
- issue: κατά என்பதன் நோக்கம் அல்லது ஒத்திசைவு சார்ந்த நுணுக்கம்
  choice: தூய்மைப்படுத்தலுக்காக
  alternative: தூய்மைப்படுத்தும் வழக்கத்தின்படி
  rationale: குடங்கள் அந்தச் சடங்குப் பயன்பாட்டுக்காக இருந்தன என்ற நோக்கப் பொருள் சூழலில் இயல்பானது. எனினும் மூலமொழி வழக்கத்துக்கு ஏற்ப அமைந்திருப்பதையும் உணர்த்தக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடங்கள்,’ ‘வைக்கப்பட்டிருந்தன,’ ‘கொள்ளக்கூடியது’ போன்ற இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; பண்டைய அளவின் நவீன மதிப்பு முதன்மை உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
