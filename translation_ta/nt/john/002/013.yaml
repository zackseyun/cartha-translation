source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: ta
  text: யூதர்களின் பஸ்கா பண்டிகை நெருங்கியிருந்தது[a]; இயேசு எருசலேமுக்கு ஏறிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதேயர்களின் பஸ்கா பண்டிகை’ என்றும் மொழிபெயர்க்கலாம். யோவான் நூலில் Ἰουδαῖοι என்ற சொல் சில சூழல்களில் ‘யூதேயர்கள்’ என்று பொருள்படலாம்; இங்கு அது இயல்பாக யூதர்களின் பண்டிகையையே அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: நெருங்கியிருந்தது
  rationale: இங்கு காலம் நெருங்கியிருப்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πάσχα
  choice: பஸ்கா பண்டிகை
  rationale: யூதர்களின் பஸ்கா விழாவைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்; ‘பண்டிகை’ என்பது சூழலில் பொருளைத் தெளிவாக்குகிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: இங்கு பஸ்காவை யூதர்களுக்குரிய பண்டிகையாக அடையாளப்படுத்துகிறது. ‘யூதேயர்களின்’ என்ற சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀνέβη
  choice: சென்றார்
  rationale: எருசலேமுக்குச் செல்லுதலைக் குறிக்கும் இயல்பான தமிழ். கிரேக்க வினையின் ‘மேலே சென்றார்’ என்ற வடிவமும் யாத்திரை மற்றும் நில உயர்வு நிழற்பொருளும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: நகரின் பெயருக்கான நிலைபெற்ற தமிழ் வடிவம்.
- source_word: Καὶ
  choice: வாக்கியத் தொடர்ச்சியாக வெளிப்படுத்தப்பட்டது
  rationale: முதல் καί கதைத்தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தேவையற்ற ‘மேலும்/அப்போது’ சேர்க்காமல் இயல்பான தொடர்ச்சியால் காட்டப்படுகிறது. இரண்டாவது καί இரண்டு தனி வாக்கியங்களின் தொடர்ச்சியால் வெளிப்படுகிறது.
theological_decisions:
- issue: யோவானில் Ἰουδαῖοι என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இந்த வசனத்தில் அந்தச் சொல் குறுகிய பிராந்திய அல்லது எதிர்மறைக் குழுவை அல்ல, பஸ்காவை யூதப் பண்டிகையாக அடையாளப்படுத்துவதே இயல்பான பொருள். இருப்பினும் யோவானில் சொல்லுக்குள்ள சூழல்சார் இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ἀνέβη என்பதிலுள்ள ‘மேலே’ என்ற கூறு
  choice: முதன்மை உரையில் ‘சென்றார்’
  alternative: ‘மேலே சென்றார்’
  rationale: தமிழில் ‘எருசலேமுக்கு மேலே சென்றார்’ என்பது இயல்பற்றதாகவோ திசை சார்ந்ததாகவோ ஒலிக்கலாம். எனவே நிகழ்வின் பொருள் முதன்மை உரையில் இயல்பாக வழங்கப்பட்டு, மூலத்தின் நில உயர்வு/யாத்திரை நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான நடை. நீண்ட இணைப்புவாக்கியத்தை இரண்டு இயல்பான தமிழ் வாக்கியங்களாகப் பிரித்துள்ளது. ‘பஸ்கா’ என்ற நிலைபெற்ற சமய-வரலாற்றுச் சொல்லுடன் தெளிவுக்காக ‘பண்டிகை’ சேர்க்கப்பட்டுள்ளது.
