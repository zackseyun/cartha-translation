reference: John 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: ta
  text: இதற்குப் பிறகு, அவர் தம் தாயோடும், தம் சகோதரர்களோடும்[a], தம் சீடர்களோடும் கப்பர்நகூமுக்கு இறங்கிச் சென்றார். அவர்கள் அங்கே அதிக நாட்கள் தங்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உறவினர்களோடும்’ அல்லது ‘நெருங்கிய உறவினர்களோடும்’; கிரேக்கச் சொல் குறுகிய பொருளில் சகோதரர்களையும், சில சூழல்களில் விரிந்த குடும்ப உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: இதற்குப் பிறகு
  rationale: இது இயல்பான கால மாற்றத்தைக் குறிக்கிறது; τοῦτο என்பதன் ஒருமைச் சுட்டுப்பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: κατέβη
  choice: சென்றார்
  rationale: கிரேக்க வினைச்சொல் கீழ்நோக்கிய நிலப்பரப்பு இயக்கத்தைக் குறிக்கலாம். ஆனால் தமிழில் இச்சூழலில் ‘கீழே சென்றார்’ என்பது இயல்பற்றதாகவோ திசையை அளவுக்கு மீறி வலியுறுத்துவதாகவோ அமையலாம்; இலக்கை நோக்கிய பயணம் இயல்பாகக் கூறப்படுகிறது.
- source_word: εἰς Καφαρναοὺμ
  choice: கப்பர்நகூமுக்கு
  rationale: நகரத்தை இலக்காகக் குறிக்கும் εἰς என்பதற்கு தமிழில் ‘-க்கு’ இயல்பான வேற்றுமை உருபு; இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: αὐτὸς καὶ ἡ μήτηρ αὐτοῦ
  choice: அவர் தம் தாயோடும்
  rationale: கிரேக்கத்தில் இயேசுவும் அவருடைய தாயும் பயணக் குழுவில் தனித்தனியாகக் குறிப்பிடப்படுகின்றனர். மரியாதை ஒருமைக்கு ஏற்ற ‘அவர்/தம்’ பயன்படுத்தப்பட்டு, மூலத்தில் இல்லாத ‘மரியா’ சேர்க்கப்படவில்லை.
- source_word: οἱ ἀδελφοὶ
  choice: தம் சகோதரர்களோடும்
  rationale: ἀδελφοί என்பது ஆண்பால் பன்மை; இங்கு நேரடியாக ‘சகோதரர்கள்’ என மொழிபெயர்ப்பது சொற்பொருளையும் பாலினக் குறிப்பையும் பேணுகிறது. விரிந்த உறவுமுறைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: தம் சீடர்களோடும்
  rationale: யோவான் நற்செய்தியின் முக்கியச் சொல்லான μαθηταί என்பதற்கு வழக்கமான, கண்ணியமான தமிழ் இணை ‘சீடர்கள்’.
- source_word: ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας
  choice: அவர்கள் அங்கே அதிக நாட்கள் தங்கவில்லை
  rationale: பன்மை வினை முழுக் குழுவையும் குறிக்கிறது. கிரேக்கத்தின் எதிர்மறை வடிவை இயல்பான நவீன தமிழில் பேணுகிறது; ‘சில நாட்கள் மட்டுமே’ என்று நேர்மறையாக மாற்றவில்லை.
theological_decisions:
- issue: இயேசுவுடன் தொடர்புடைய ἀδελφοί என்போரின் உறவுமுறை
  choice: முதன்மை உரையில் ‘சகோதரர்கள்’
  alternative: உறவினர்கள் / நெருங்கிய உறவினர்
  rationale: கிரேக்க ஆண்பால் பன்மைச் சொல்லின் மிக நேரடியான பொருள் ‘சகோதரர்கள்’. பின்னாளைய மரியாளைப் பற்றிய கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல், விரிந்த உறவுமுறைப் பொருளுக்கான வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இயேசுவைக் குறிக்க மரியாதை ஒருமையான ‘அவர்/தம்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பட்டியலை தமிழின் இயல்பான உடனிகழ்ச்சி அமைப்பில் வழங்கி, இறுதி பன்மை வினை மூலம் குழுவின் செயல் தெளிவாக்கப்பட்டுள்ளது.
