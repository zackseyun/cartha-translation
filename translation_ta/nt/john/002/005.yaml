  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: ta
  text: அவருடைய தாய் விருந்துப் பணியாளர்களிடம், “அவர் உங்களிடம் என்ன சொன்னாலும் அதைச் செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: அவருடைய தாய்
  rationale: உடைமைத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்தி, கதையில் இயேசுவுடனான குடும்ப உறவைத் தக்கவைக்கிறது.
- source_word: διακόνοις
  choice: பணிவிடை செய்தவர்களிடம்
  rationale: திருமண விருந்தில் பணியாற்றியவர்களையே சூழல் குறிக்கிறது; பிற்காலத் திருச்சபைப் பதவியான ‘உதவிக்காரர்கள்’ என்ற பொருளைத் தவிர்க்க, சூழலுக்கேற்ற பொதுவான சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: Ὅ τι ἂν
  choice: என்ன ... ஆனாலும்
  rationale: ἄν உடனான வரையறையற்ற தொடர்புக் கட்டமைப்பு திறந்த சாத்தியத்தை உணர்த்துகிறது; தமிழில் ‘என்ன சொன்னாலும்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγῃ ὑμῖν
  choice: உங்களிடம் ... சொன்னாலும்
  rationale: நிகழ்காலத் துணைவினை வடிவத்தின் வரையறையற்ற எதிர்காலப் பொருளைத் தமிழின் நிபந்தனைத் தொடரால் இயல்பாகக் காட்டுகிறது.
- source_word: ποιήσατε
  choice: அதைச் செய்யுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் உறுதியான கட்டளையை மரியாதையான நவீனத் தமிழில் தருகிறது; ‘அதை’ என்பது முன் கூறப்பட்ட எதையும் இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: λέγῃ என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: ‘அவர்’ என்று மொழிபெயர்த்து, சூழலில் இயேசுவைக் குறிக்கச் செய்தல்
  alternative: ‘இயேசு’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் எழுவாய் மறைமுகமாக இருந்தாலும் சூழல் இயேசுவைத் தெளிவாகக் குறிக்கிறது. பெயரைச் சேர்க்காமல் ‘அவர்’ என வழங்குவது மூலத்தின் சுருக்கத்தையும் சூழல் தெளிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. திருமண விருந்துச் சூழலில் διακόνοις என்பதன் பணிசார் பொருளை மட்டும் வெளிப்படுத்தி, திருச்சபைப் பதவிப் பொருள் தவிர்க்கப்பட்டது.
