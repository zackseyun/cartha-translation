revisions:
- from: புறாக்களை விற்றுக்கொண்டிருந்தவர்களிடம் அவர், “இவற்றை இங்கிருந்து எடுத்துச் செல்லுங்கள்; என் தந்தையின் வீட்டை வணிக வீடாக[a] ஆக்காதீர்கள்” என்றார்.
  to: புறாக்களை விற்பவர்களிடம் அவர், “இவற்றை இங்கிருந்து எடுத்துச் செல்லுங்கள்; என் தந்தையின் வீட்டை வணிக இல்லமாக[a] ஆக்காதீர்கள்” என்றார்.
  rationale: The revision retains the source’s commands, its reference to doves, and Jesus’ explicit “my Father.” It improves modern Tamil flow in the description of the sellers and in the commercial-house expression, while the footnote transparently supplies the smoother alternative “சந்தையாக” and explains the Greek repetition.
