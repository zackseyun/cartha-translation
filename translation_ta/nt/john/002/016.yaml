id: JHN.2.16
reference: John 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: ta
  text: புறாக்களை விற்பவர்களிடம் அவர், “இவற்றை இங்கிருந்து எடுத்துச் செல்லுங்கள்; என் தந்தையின் வீட்டை வணிக இல்லமாக[a] ஆக்காதீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்தையாக.” கிரேக்கத்தில் “வணிகத்தின் வீடு” என்று உள்ளது; வாக்கியத்தில் “வீடு” என்ற சொல் மீண்டும் வருவதை இது காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: புறாக்களை
  rationale: பலிக்காக விற்கப்பட்ட பறவைகளை இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘புறாக்கள்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: πωλοῦσιν
  choice: விற்றுக்கொண்டிருந்தவர்களிடம்
  rationale: நிகழ்காலப் பங்கேற்புவினை, தொடர்ந்து விற்பனையில் ஈடுபட்டிருந்தவர்களை அடையாளப்படுத்துகிறது; இந்தத் தமிழ் வடிவம் அந்த நீடித்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἄρατε ταῦτα ἐντεῦθεν
  choice: இவற்றை இங்கிருந்து எடுத்துச் செல்லுங்கள்
  rationale: தீர்மானமான கட்டளையின் வலிமையையும், அங்கிருந்து அகற்றிச் செல்லும் இயக்கத்தையும் தெளிவாகக் காக்கிறது; ‘இவை’ எதைக் குறிக்கின்றன என்பதை மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: μὴ ποιεῖτε
  choice: ஆக்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளையின் தடையுத்தரவை நேரடியாக வெளிப்படுத்துகிறது; ‘மாற்றாதீர்கள்’ போன்ற விளக்கவுரையைத் தவிர்க்கிறது.
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: என் தந்தையின் வீட்டை
  rationale: μου என்ற ஒருமை உடைமையையும் இயேசு வெளிப்படையாக உரைக்கும் தந்தை–மகன் உறவையும் மாற்றமின்றிக் காக்கிறது.
- source_word: οἶκον ἐμπορίου
  choice: வணிக வீடாக
  rationale: ἐμπόριον என்பதன் வணிகம்/வர்த்தகம் என்ற பொருளைக் காத்து, கிரேக்கத்தில் உள்ள ‘வீடு … வீடு’ என்ற சொல் மீட்டலையும் தமிழில் வெளிப்படுத்துகிறது; இயல்பான மாற்றாக ‘சந்தை’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஆலயத்தை இயேசு ‘என் தந்தையின் வீடு’ என்று குறிப்பிடுதல்
  choice: ‘என் தந்தையின் வீடு’ என்ற வெளிப்படையான தனிப்பட்ட உறவைக் காத்தல்
  alternative: ‘நம் தந்தையின் வீடு’ அல்லது ‘கடவுளின் வீடு’
  rationale: கிரேக்கத்தில் πατρός உடன் வரும் μου ஒருமை உடைமைச்சொல் இயேசுவின் தனித்துவமான மகனுக்குரிய உறவையும் இச்சூழலில் அவருடைய அதிகாரத்தையும் வெளிப்படுத்துகிறது. மொழிபெயர்ப்பு இதை மென்மைப்படுத்தவோ விரிவாக்கவோ கூடாது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும், இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் கட்டளை வலிமையும் ‘வீடு … வீடு’ என்ற சொல்லாட்சியும் காக்கப்பட்டுள்ளன. மேற்கோளுக்குள் தொடர்புடைய இரு கட்டளைகள் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
