revisions:
- from: இயேசு கலிலேயாவிலுள்ள கானாவில் இதைத் தமது அடையாளங்களின் தொடக்கமாகச் செய்தார்[a]. இவ்வாறு தமது மகிமையை வெளிப்படுத்தினார்; அவருடைய சீடர்கள் அவர்மேல் நம்பிக்கை வைத்தார்கள்.
  to: இயேசு கலிலேயாவிலுள்ள கானாவில் இதைத் தமது அடையாளங்களின் தொடக்கமாகச் செய்தார்; தமது மகிமையை வெளிப்படுத்தினார்; அவருடைய சீடர்கள் அவர்மேல் நம்பிக்கை வைத்தார்கள்.[a]
  rationale: The revision removes the non-source adverb ‘இவ்வாறு’ and retains the Greek’s direct coordination of Jesus’ action, revelation of glory, and the disciples’ belief. It preserves the established Johannine terminology and improves the alternative footnote’s Tamil idiom without changing its scope.
