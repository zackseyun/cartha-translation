source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: ta
  text: இயேசு கலிலேயாவிலுள்ள கானாவில் இதைத் தமது அடையாளங்களின் தொடக்கமாகச் செய்தார்; தமது மகிமையை வெளிப்படுத்தினார்; அவருடைய சீடர்கள் அவர்மேல் நம்பிக்கை வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது அடையாளங்களில் முதலாவதாக இதைச் செய்தார்.”
    reason: ἀρχή என்பது ‘தொடக்கம்’ என்றும், இச்சூழலில் ‘முதலாவது’ என்றும் புரிந்துகொள்ளப்படலாம்; இரு சாத்தியங்களும் பாதுகாக்கப்படுகின்றன.
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: இதைச் செய்தார்
  rationale: ταύτην என்பது முன்பு விவரிக்கப்பட்ட செயலைச் சுட்டும் பெயர்ப்பதிலி; கிரேக்கத்தில் இல்லாத ‘அற்புதம்’ அல்லது ‘அடையாளம்’ என்பதை இங்கே சேர்க்காமல் எளிமையாக மொழிபெயர்க்கப்பட்டது. ἐποίησεν என்பதன் பொதுவான ‘செய்தார்’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: ἀρχὴν τῶν σημείων
  choice: தமது அடையாளங்களின் தொடக்கமாக
  rationale: ἀρχή என்பதன் ‘தொடக்கம்’ என்ற அடிப்படைப் பொருளைக் காத்து, தமிழில் வாக்கியத் தொடர்பு இயல்பாக அமைய ‘தொடக்கமாக’ என வழங்கப்பட்டது. இவை இயேசு செய்த அடையாளங்கள் என்பது சூழலிலிருந்து தெளிவாக இருப்பதால் ‘தமது’ சேர்க்கப்பட்டது.
- source_word: σημείων
  choice: அடையாளங்கள்
  rationale: யோவான் நற்செய்தியில் σημεῖον, வல்ல செயலை மட்டும் அல்லாமல் இயேசுவின் அடையாளத்தையும் மகிமையையும் வெளிப்படுத்தும் குறியாகவும் செயல்படுகிறது; எனவே ‘அற்புதங்கள்’ என்பதற்குப் பதிலாக ‘அடையாளங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள கானாவில்
  rationale: இடத்தொடர்பை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐφανέρωσεν
  choice: வெளிப்படுத்தினார்
  rationale: φανερόω என்பதன் காணும்படி அல்லது அறியும்படி செய்தல் என்ற பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: τὴν δόξαν αὐτοῦ
  choice: தமது மகிமையை
  rationale: δόξα என்ற யோவானிய இறையியல் சொல்லுக்கு நிலையான ‘மகிமை’ பயன்படுத்தப்பட்டது; எழுவாய் இயேசுவையே குறிக்கும் காரணத்தால் தமிழ் இயல்புக்கு ஏற்ப ‘தமது’ என வழங்கப்பட்டது.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  rationale: πιστεύω εἰς என்ற சொற்றொடரின் இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: கிரேக்கப் பெயர்த்தொடரின் இயல்பான, தெளிவான தமிழாக்கம்.
theological_decisions:
- issue: யோவான் நற்செய்தியில் σημεῖον என்ற சொல்
  choice: ‘அடையாளங்கள்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அற்புதங்கள்’
  rationale: இந்தச் செயல்கள் வல்லமையின் நிகழ்வுகள் மட்டுமல்ல; இயேசு யார் என்பதையும் அவருடைய மகிமையையும் சுட்டிக்காட்டுகின்றன. ‘அடையாளங்கள்’ அந்த வெளிப்பாட்டு பரிமாணத்தைக் காக்கிறது.
- issue: ἀρχὴν τῶν σημείων என்பதன் பொருள்
  choice: ‘தமது அடையாளங்களின் தொடக்கமாக’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தாம் செய்த அடையாளங்களில் முதலாவதாக’
  rationale: முதன்மை உரை ἀρχή என்பதன் ‘தொடக்கம்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது; இது வரிசையில் முதலாவது என்பதைக் கூறும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் தெளிவுபடுத்த ‘இவ்வாறு’ சேர்க்கப்பட்டுள்ளது; புதிய நிகழ்வோ இறையியல் விளக்கமோ சேர்க்கப்படவில்லை.
