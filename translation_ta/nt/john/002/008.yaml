translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மொண்டு’ என்பது சூழலில் திரவத்தை எடுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; விருந்துப் பொறுப்பாளரின் துல்லியமான சமூகப் பங்கு அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
