  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: ta
  text: அவர் அவர்களிடம், “இப்போது மொண்டு, விருந்தின் மேற்பார்வையாளரிடம்[a] கொண்டுபோங்கள்” என்றார். அவர்களும் அதைக் கொண்டுபோனார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருந்து நிர்வாகியிடம்.” இந்தக் கிரேக்கச் சொல் விருந்தை மேற்பார்வையிட்ட நபரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதைக் கொண்டுவந்தார்கள்.” கிரேக்க வினைச்சொல் எடுத்துச் செல்லுதல் அல்லது கொண்டுவருதல் என்ற இரு பார்வைகளிலும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
