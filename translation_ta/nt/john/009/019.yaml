id: JHN.9.19
reference: John 9:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ta
  text: அவர்களிடம், “பார்வையற்றவனாகப் பிறந்தான் என்று நீங்கள் சொல்கிற உங்கள் மகன் இவன்தானா? அப்படியானால், இப்போது இவன் எப்படிப் பார்க்கிறான்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: அவர்களிடம் … என்று கேட்டார்கள்
  rationale: தமிழில் இயல்பான நேரடிக் கூற்று அமைப்பைப் பயன்படுத்துகிறது. λέγοντες என்பதைக் தனியாக ‘சொல்லி’ என்று மொழிபெயர்க்காமல், மேற்கோளை முடிக்கும் ‘என்று’ என்பதில் அதன் பணியை வெளிப்படுத்துகிறது.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: இவன் உங்கள் மகன்தானா?
  rationale: வடிவத்தில் கூற்றாக இருந்தாலும், சூழலில் இது கேள்வியாகச் செயல்படுகிறது. ‘தானா’ அடையாளத்தை உறுதிப்படுத்தும் கேள்வியின் இயல்பான தமிழ் வடிவம்.
- source_word: ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη
  choice: இவன் பிறவியிலேயே பார்வையற்றவன் என்று நீங்கள்தானே சொல்கிறீர்கள்?
  rationale: τυφλὸς ἐγεννήθη என்பதை இயல்பாக ‘பிறவியிலேயே பார்வையற்றவன்’ என வழங்குகிறது. ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்கள்தானே’ காக்கிறது; λέγετε-க்கு சந்தேகத்தைச் சேர்க்கும் ‘கூறிக்கொள்கிறீர்கள்’ என்பதற்குப் பதிலாக நடுநிலையான ‘சொல்கிறீர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πῶς οὖν
  choice: அப்படியானால் … எப்படி
  rationale: முந்தைய கூற்றிலிருந்து எழும் முடிவுசார் கேள்வியை οὖν குறிக்கிறது; ‘அப்படியானால்’ அந்தத் தர்க்கத் தொடர்பை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: βλέπει ἄρτι
  choice: இப்போது இவன் எப்படிப் பார்க்கிறான்?
  rationale: ἄρτι-யின் நிகழ்கால மாறுபாட்டை ‘இப்போது’ காக்கிறது. βλέπει என்பது இப்போது உண்மையில் பார்க்கிற நிலையைக் குறிக்கிறது; வெறும் திறனை மட்டும் குறிக்கும் ‘பார்க்க முடிகிறது’ என மாற்றப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘குருடன்’ என்பதற்குப் பதிலாக மனிதரை மதிக்கும் தற்போதைய வழக்கான ‘பார்வையற்றவன்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் தொடர்ச்சியான ஒரே கேள்வி அமைப்பு இருந்தாலும், தமிழில் புரிதலுக்காக தொடர்புடைய இரண்டு கேள்விகளாகப் பிரிக்கப்பட்டுள்ளது; பொருள் மாற்றப்படவில்லை.
