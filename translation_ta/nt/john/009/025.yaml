  source_fidelity: மூலத்தின் உரையாடல் தொடர்ச்சியும் (οὖν), முன்பு குருடனாக இருந்த மனிதனைச் சுட்டும் வெளிப்படையான குறிப்பும் (ἐκεῖνος), ‘அவர் பாவியா’ என்ற மறைமுகக் கேள்வியும், ‘எனக்குத் தெரியாது/ஒன்று மட்டும் தெரியும்’ என்ற எதிர்மறை வலியுறுத்தலும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘நான் குருடனாயிருந்தேன்; இப்போது பார்க்கிறேன்’ என்பது τυφλὸς ὢν ... ἄρτι βλέπω என்ற முன்னைய நிலை/தற்போதைய நிலை முரணை இயல்பாகத் தருகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. மேற்கோளுக்குப் பின் ‘என்று பதிலளித்தான்’ அமைப்பு தமிழின் சாதாரண உரையாடல் நடைக்கு ஏற்றது. ‘குருடனாயிருந்தேன்’ வேதாகமப் பதிவுக்கேற்ற கண்ணியமான, இன்னும் புரிந்துகொள்ளத்தக்க வடிவமாகும்.
  terminology: ‘பாவி’, ‘குருடன்’, ‘பார்க்கிறேன்’ ஆகியவை சூழலுக்கும் பொதுவான தமிழ் வேதாகமப் பயன்பாட்டுக்கும் ஏற்றவை. ‘அவர் பாவியா என்பது’ பேச்சாளரின் வரையறுக்கப்பட்ட அறிவையே தெரிவிக்கிறது; இயேசுவைப் பற்றி மொழிபெயர்ப்பாளர் தீர்ப்பைச் சேர்ப்பதில்லை.
