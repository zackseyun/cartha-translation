id: JHN.9.25
reference: John 9:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: ta
  text: 'அதற்கு அந்த மனிதன், “அவர் பாவியா என்பது எனக்குத் தெரியாது. ஒன்று மட்டும் எனக்குத் தெரியும்: நான் குருடனாயிருந்தேன்; இப்போது பார்க்கிறேன்” என்று பதிலளித்தான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தான்
  rationale: யோவானின் உரையாடல் நடையில் வரும் வழக்கமான பதிலுரை வினைச்சொல்லை நேராகவும் கண்ணியமாகவும் தருகிறது.
- source_word: οὖν
  choice: அதற்கு
  rationale: முந்தைய கேள்விக்கும் இப்பதிலுக்கும் உள்ள உரையாடல் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; தனியே ‘ஆகவே’ என மொழிபெயர்ப்பதைவிட இச்சூழலில் பொருத்தமானது.
- source_word: ἐκεῖνος
  choice: அந்த மனிதன்
  rationale: முன்பு குருடனாயிருந்த மனிதனைச் சுட்டும் கிரேக்கச் சுட்டுப்பெயரின் வலிமையைத் தக்கவைக்கிறது.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: அவர் பாவியா என்பது
  rationale: அறிதலைக் குறிக்கும் வினையுடன் வரும் εἰ-ஐ தமிழில் மறைமுகக் கேள்வியாக இயல்பாக வெளிப்படுத்துகிறது; நிபந்தனைப் பொருளைத் தேவையின்றி வலியுறுத்தாது.
- source_word: ἁμαρτωλός
  choice: பாவி
  rationale: சூழலில் முன்வைக்கப்பட்ட குற்றச்சாட்டைச் சுருக்கமாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: நிகழ்கால அறியாமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἓν οἶδα
  choice: ஒன்று மட்டும் எனக்குத் தெரியும்
  rationale: முந்தைய ‘தெரியாது’ என்பதற்கு எதிராக ஒரே உறுதியான உண்மையை வலியுறுத்துகிறது.
- source_word: τυφλὸς ὢν
  choice: நான் குருடனாயிருந்தேன்
  rationale: முன்னைய நிலையைத் தெளிவாகக் காட்டி, இப்போதைய பார்வையுடன் உள்ள கால முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: ἄρτι
  choice: இப்போது
  rationale: முன்னைய குருட்டுத்தன்மைக்கும் தற்போதைய பார்வைக்கும் இடையிலான தெளிவான வேறுபாட்டைக் காட்டுகிறது.
- source_word: βλέπω
  choice: பார்க்கிறேன்
  rationale: எளிய நிகழ்கால வினையாக மூலத்தின் நேர்மையையும் சாட்சியின் வலிமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசு பாவியா என்ற குற்றச்சாட்டைப் பற்றி குணமடைந்த மனிதன் கூறும் வரையறுக்கப்பட்ட அறிவை எவ்வாறு மொழிபெயர்ப்பது
  choice: அவர் பாவியா என்பது எனக்குத் தெரியாது.
  alternative: அவர் பாவியாக இருந்தால், எனக்குத் தெரியாது.
  rationale: இது பேசிய மனிதனின் அப்போதைய அறிவு வரம்பைக் காட்டுகிறது; இயேசுவைப் பற்றிய விவரிப்பாளரின் இறையியல் தீர்ப்பாக மாற்றுவதில்லை. மறைமுகக் கேள்வி வடிவம் மூலத்தின் பதற்றத்தை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘அவர்’ என்பது சூழலில் இயேசுவைக் குறிக்கும் மரியாதை ஒருமை; ‘அந்த மனிதன்’ கிரேக்கச் சுட்டுப்பெயரை வெளிப்படையாகக் காக்கிறது.
