id: JHN.9.18
reference: John 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: ta
  text: பார்வை பெற்றவனுடைய பெற்றோரை அவர்கள் அழைக்கும் வரை, அவன் பார்வையற்றவனாக இருந்தான், பார்வை பெற்றான் என்பதை யூதர்கள்[a] நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலுக்கேற்ப ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: நம்பவில்லை
  rationale: ὅτι எனும் உள்ளடக்க வாக்கியத்துடன் வரும் πιστεύω, ஒரு செய்தியை உண்மை என்று ஏற்றுக்கொள்வதைக் குறிக்கிறது; ஆகவே ‘நம்பவில்லை’ இயல்பானதும் துல்லியமானதும்.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருளை முதன்மை உரை காக்கிறது. யோவானில் இது சூழலுக்கேற்ப யூதத் தலைவர்களையோ யூதேயர்களையோ குறிக்கக்கூடும் என்பதால் அந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περὶ αὐτοῦ
  choice: அவன் ... என்பதை
  rationale: தமிழில் ‘அவனைப் பற்றி ... என்பதை நம்பவில்லை’ என்பது சற்றுக் கடினமாக ஒலிக்கும். மனிதனைப் பற்றிய மறுக்கப்பட்ட கூற்றை நேரடி உள்ளடக்க வாக்கியமாக அமைப்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: ἦν τυφλὸς
  choice: முன்பு பார்வையற்றவனாக இருந்து
  rationale: ἦν என்பது இறந்தகால நிலையைச் சொல்கிறது. குணம்பெற்ற தற்போதைய நிலையிலிருந்து முந்தைய பார்வையின்மையைத் தெளிவுபடுத்த ‘முன்பு’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀνέβλεψεν
  choice: இப்போது பார்வை பெற்றான்
  rationale: ἀναβλέπω இங்கு குணமாகிப் பார்வை பெறுதலைக் குறிக்கிறது. ‘மீண்டும் பார்வை பெற்றான்’ என்பது அவனுக்கு முன்பு பார்வை இருந்ததாகத் தவறாக உணர்த்தலாம்; ‘இப்போது’ நிகழ்வுகளின் கால உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἕως ὅτου
  choice: அழைத்த பின்னரே
  rationale: ‘வரை’ என்று மட்டும் மொழிபெயர்த்தால் தமிழில் வாக்கியம் முழுமையற்றதாகவோ, அழைத்ததும் அவர்களின் நம்பிக்கை மாறியதாகத் தவறாகத் தோன்றவோ வாய்ப்புள்ளது. ‘பின்னரே’ கால எல்லையை இயல்பாகக் குறிக்கிறது; இது அவர்கள் அப்போது உண்மையில் நம்பினார்கள் என்று கட்டாயப்படுத்தாது.
- source_word: ἐφώνησαν
  choice: அழைத்த
  rationale: φωνέω இங்கு ஒருவரை வரவழைப்பதைக் குறிக்கிறது; ‘அழைத்த’ நவீன தமிழில் இயல்பான, அளவுக்கு மீறாத சொல்.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: γονεῖς என்பதற்கான துல்லியமான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: τοῦ ἀναβλέψαντος
  choice: பார்வை பெற்றவனுடைய
  rationale: உறுப்புடன் வரும் இறந்தகாலப் பங்கேற்புச் சொல்லின் அடையாளப்படுத்தும் தன்மையை ‘பார்வை பெற்றவன்’ இயல்பாகப் பாதுகாக்கிறது; சூழலில் அவன் ஆண் என்பது தெளிவாக இருப்பதால் இந்த வடிவம் பொருத்தமானது.
theological_decisions:
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு மற்றும் நுணுக்கம்
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள்; யூதேயர்கள்
  rationale: கிரேக்க மூலத்தில் உள்ள பரந்த சொல்லை முதன்மை உரை குறுக்காமல் காக்கிறது. அதேவேளை, விசாரணை நடத்தும் குழுவைக் குறிக்கும் உடனடிச் சூழலும் யோவானின் மாறுபடும் பயன்பாடும் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன; இதனால் ஒட்டுமொத்த யூத மக்களைப் பற்றிய பொதுமைப்படுத்தலாக வாசிக்க வேண்டிய அவசியம் இல்லை.
- issue: ἕως ὅτου நம்பிக்கை பின்னர் ஏற்பட்டதாகக் குறிக்கிறதா?
  choice: அழைத்த பின்னரே நம்பினார்கள்
  alternative: அழைக்கும் வரை நம்பவில்லை
  rationale: தமிழில் இயல்பாகவும் முழுமையாகவும் வாக்கியத்தை அமைக்க இவ்வாறு தரப்பட்டுள்ளது. இந்த ‘வரை’ அமைப்பு பெற்றோரை அழைத்ததும் அவர்கள் உண்மையில் நம்பினார்கள் என்று அவசியமாக உறுதிப்படுத்தாது; அடுத்த நடவடிக்கை வரை நீடித்த அவநம்பிக்கையையே முதன்மையாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குருடன்’ என்பதற்குப் பதிலாக மரியாதையான ‘பார்வையற்றவன்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கிய அமைப்பை அப்படியே பின்பற்றாமல், அதன் கருத்துறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் optimal-equivalence அணுகுமுறை பின்பற்றப்பட்டுள்ளது.
