revisions:
- from: எனவே, அவன் முன்பு பார்வையற்றவனாக இருந்து இப்போது பார்வை பெற்றான் என்பதை யூதர்கள்[a] நம்பவில்லை; பார்வை பெற்றவனுடைய பெற்றோரை அவர்கள் அழைத்த பின்னரே நம்பினார்கள்.
  to: பார்வை பெற்றவனுடைய பெற்றோரை அவர்கள் அழைக்கும் வரை, அவன் பார்வையற்றவனாக இருந்தான், பார்வை பெற்றான் என்பதை யூதர்கள்[a] நம்பவில்லை.
  rationale: The temporal clause has been moved to the beginning and rendered “அழைக்கும் வரை,” preserving the source’s statement that disbelief continued up to the calling of the parents without claiming that belief followed. The remaining wording and the contextual footnote are retained with only minor punctuation and stylistic normalization.
