id: JHN.9.41
reference: John 9:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “நீங்கள் குருடர்களாக இருந்திருந்தால், உங்களுக்குப் பாவம்[a] இருந்திருக்காது. ஆனால் இப்போதோ, ‘நாங்கள் பார்க்கிறோம்’ என்று சொல்கிறீர்கள்; உங்கள் பாவம் நீடிக்கிறது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றப்பொறுப்பு.” கிரேக்க மூலத்தில் “பாவம்” என்றே உள்ளது; இங்கு அது குற்றப்பொறுப்பு என்ற பொருளையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: குருடர்களாக
  rationale: இச்சொல் நேரடியாக ‘குருடர்கள்’ என்று பொருள்படும். இங்கு ஆன்மீகப் பார்வையின்மை உருவகமாக இருந்தாலும், அதை விளக்கச் சொல்லால் விரிவுபடுத்தாமல், அதிகாரம் முழுவதும் தொடரும் குருட்டுத்தன்மை–பார்வை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: οὐκ ἂν εἴχετε
  choice: இருந்திருக்காது
  rationale: ἄν உடன் வரும் இறந்தகால வினை, உண்மைக்கு மாறான நிபந்தனையின் விளைவைச் சுட்டுகிறது. ‘இருந்திருக்காது’ என்பது அதை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: ἁμαρτίαν / ἡ ἁμαρτία
  choice: பாவம்
  rationale: ‘பாவம்’ என்பது ἁμαρτία என்பதற்கான நேரடி இணை. இச்சூழலில் குற்றப்பொறுப்பு என்ற நுண்பொருளும் இருக்கலாம்; ஆனால் அதை முதன்மை உரையில் மட்டும் காட்டுவது மூலத்தின் பொருள் விரிவைக் குறுக்கும்.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: கற்பனையான நிபந்தனைக்கும் தற்போது நிலவும் உண்மைக்கும் இடையிலான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: ‘நாங்கள் பார்க்கிறோம்’ என்று சொல்கிறீர்கள்
  rationale: இரண்டாம் நபர் பன்மையிலிருந்து நேரடி மேற்கோளின் முதலாம் நபர் பன்மைக்கு மாறும் கிரேக்கச் சொல்லமைப்பையும், பார்க்குதல் குறித்த இயேசுவின் கூற்றிலுள்ள நயமான முரணையும் பாதுகாக்கிறது.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: உங்கள் பாவம் நிலைத்திருக்கிறது
  rationale: μένει என்பது தொடர்ந்து நீடிக்கும் நிலையைக் குறிக்கிறது; யோவான் நூலில் முக்கியமான இவ்வினையின் தொடர்ச்சிப் பொருளை ‘நிலைத்திருக்கிறது’ பாதுகாக்கிறது.
theological_decisions:
- issue: ‘குருடர்கள்’ என்பது ஆன்மீகக் குருட்டுத்தன்மையையும் ‘பாவம்’ என்பது கடவுள்முன் குற்றப்பொறுப்பையும் குறிக்கிறது என்பதை வெளிப்படையாகச் சேர்ப்பதா
  choice: முதன்மை உரையில் ‘குருடர்கள்’, ‘பாவம்’ என்ற நேரடியான சொற்களையே வைத்தல்.
  alternative: “நீங்கள் ஆன்மீகக் குருடர்களாக இருந்திருந்தால், பாவக்குற்றம் உங்களுக்கு இருந்திருக்காது” என்று விரிவாக மொழிபெயர்த்தல்.
  rationale: இந்த அதிகாரத்தில் உடல் குருட்டுத்தன்மை மற்றும் ஆன்மீகப் பார்வை ஆகியவற்றுக்கு இடையிலான உருவகத் தொடர்பை இயேசுவின் சொற்கள் நோக்கத்துடன் தக்கவைக்கின்றன. விளக்கத்தை உரைக்குள் சேர்ப்பது அந்த உருவகத்தையும் ἁμαρτία என்பதன் பொருள் விரிவையும் தேவையின்றிக் குறுக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க தொனியுடனும் அமைக்கப்பட்டது. ‘நாங்கள் பார்க்கிறோம்’ என்ற நேரடி மேற்கோள், மூலத்தின் சொல்விளையாட்டையும் உருவகத்தையும் பாதுகாக்கிறது. இறுதி உட்கூற்றுக்கு முன் கிரேக்கத்தில் வெளிப்படையான ‘ஆகவே’ இல்லாததால், காரண இணைப்பைச் சேர்க்காமல் அரைப்புள்ளி பயன்படுத்தப்பட்டது.
