id: JHN.9.24
reference: John 9:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: ta
  text: எனவே, முன்பு பார்வையற்றிருந்த அந்த மனிதனை அவர்கள் இரண்டாவது முறையாக அழைத்தார்கள்; அவனிடம்[a], “கடவுளுக்கு மகிமை கொடு; இந்த மனிதன் பாவி என்று நாங்கள் அறிவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இது ஆணையுரையாகப் பயன்படும் மரபுத்தொடராக இருக்கலாம்: “கடவுளுக்கே மகிமை கொடு”; அதாவது, “கடவுளுக்கு முன்பாக உண்மையைச் சொல்” அல்லது “கடவுளுக்கு முன்பாக வெளிப்படையாக ஒப்புக்கொள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: அழைத்து
  rationale: இங்கு அதிகாரிகள் குணமடைந்த மனிதனை மீண்டும் தங்களிடம் வருமாறு அழைப்பதைக் குறிக்கிறது. ‘வரவழைத்து’ என்பதும் சாத்தியம்; ஆனால் மூல வினைச்சொல்லில் வெளிப்படையாக இல்லாத அதிகாரபூர்வ கட்டாயத்தை அது சற்றே அதிகமாக உணர்த்தலாம்.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் நிகழ்வையும் அதன் விளைவையும் இணைக்கும் சொல்லாக வருகிறது; ‘எனவே’ அந்த இணைப்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: τὸν ἄνθρωπον
  choice: அந்த மனிதனை
  rationale: குறிப்பிட்ட ஓர் ஆணைக் குறிக்கிறது. தமிழ் உரையில் முன்பே அறிமுகமானவரை இயல்பாகச் சுட்டுவதற்காக ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐκ δευτέρου
  choice: இரண்டாவது முறையாக
  rationale: இந்தச் சொற்றொடரின் நேரடியான பொருள் ‘இரண்டாவது முறையாக’; ‘மீண்டும்’ என்பதைவிட எண்ணிக்கையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὃς ἦν τυφλός
  choice: முன்பு பார்வையற்றிருந்த
  rationale: அந்த மனிதன் இப்போது குணமடைந்துள்ள சூழலைக் கருத்தில் கொண்டு, இது அவனுடைய முந்தைய நிலையைக் குறிக்கிறது என்பதை ‘முன்பு’ தெளிவாக்குகிறது. ‘குருடனாயிருந்த’ என்பதைக் காட்டிலும் ‘பார்வையற்றிருந்த’ என்பது தற்போதைய மரியாதையான பொதுத் தமிழுக்கு ஏற்றது.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: கடவுளுக்கு மகிமை செலுத்து
  rationale: கிரேக்கச் சொற்களின் வெளிப்படையான வடிவத்தைத் தக்கவைக்கிறது. இது உண்மையைச் சொல்லுமாறு வலியுறுத்தும் ஆணையுரை அல்லது வெளிப்படையாக ஒப்புக்கொள்ளச் சொல்லும் மரபுத்தொடராகவும் இருக்கலாம்; அந்தச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡμεῖς οἴδαμεν
  choice: எங்களுக்குத் தெரியும்
  rationale: வலியுறுத்தப்பட்ட ‘நாங்கள்’ என்பதையும் பேசுவோரின் உறுதியான கூற்றையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: இந்த மனிதன்
  rationale: சுட்டுப்பெயருடனான பெயர்ச்சொல்லை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது; மூலத்தில் வெளிப்படையாக இல்லாத இகழ்ச்சித் தொனியைச் சேர்க்கவில்லை.
- source_word: ἁμαρτωλός
  choice: ஒரு பாவி
  rationale: இங்கு குற்றச்சாட்டாகப் பயன்படுத்தப்படும் பெயர்ச்சொல் சார்ந்த பொருளைத் தெளிவாகத் தருகிறது; ‘பாவமுள்ளவன்’ என்பதைக் காட்டிலும் மூலத்தின் வகைப்படுத்தும் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ என்ற சொற்றொடரின் மரபுத்தொடர்சார் வலிமை
  choice: முதன்மை உரையில் ‘கடவுளுக்கு மகிமை செலுத்து’ என்ற நேரடி வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘கடவுளுக்கு முன்பாக உண்மையைச் சொல்’ அல்லது ‘கடவுளுக்கு முன்பாக வெளிப்படையாக ஒப்புக்கொள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இச்சொற்றொடர் உண்மையாகப் பேசுமாறு செய்யப்படும் ஓர் ஆணையுரையாக இருக்கக்கூடும்; ஆயினும் கிரேக்கத்தின் வெளிப்படையான சொல்வடிவம் கடவுளுக்கு மகிமை செலுத்துவதைச் சொல்கிறது. உண்மையான இருபொருள் வாய்ப்பைத் தீர்த்துவிடாமல், நேரடி வடிவம் முதன்மை உரையிலும் மரபுத்தொடர்சார் பொருள் அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பார்வையற்றிருந்த’ என்பது தற்போதைய மரியாதையான வழக்கை பிரதிபலிக்கிறது. உரையாடலில் உள்ள கட்டளையின் ஒருமைத் தொனியை ‘செலுத்து’ தக்கவைக்கிறது; வசனத்தின் குற்றச்சாட்டு மென்மையாக்கப்படவில்லை.
