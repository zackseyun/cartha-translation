reference: John 9:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: ta
  text: அவருடைய சீடர்கள் அவரிடம், “ரபீ, இவன் குருடனாகப் பிறக்கும்படி யார் பாவம் செய்தார்—இவனா அல்லது இவனுடைய பெற்றோரா?” என்று கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவன் குருடனாகப் பிறந்ததற்கு யார் பாவம் செய்தார்—இவனா அல்லது இவனுடைய பெற்றோரா?” கிரேக்கச் சொற்றொடர் சீடர்கள் கருதிய நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பை வெளிப்படுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: கேட்டார்கள்
  rationale: ἐρωτάω என்பதன் இறந்தகால வினை இங்கு இயேசுவிடம் நேரடியாகக் கேள்வி கேட்டதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: ஆசிரியரைப் பின்பற்றிக் கற்றுக்கொள்பவர்களைக் குறிக்கும் நற்செய்தி நூல்களின் நிலைபெற்ற, துல்லியமான சொல்.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: யூத வரலாற்றுச் சூழலையும் நேரடி அழைப்பின் தன்மையையும் காக்க ஒலிபெயர்க்கப்பட்டது; ‘போதகரே’ என்பது சாத்தியமான பொருள் மொழிபெயர்ப்பு.
- source_word: ἥμαρτεν
  choice: பாவம் செய்ததால்
  rationale: அடிப்படை வினைப் பொருள் ‘பாவம் செய்தான்’; தமிழ்க் கேள்வியின் இயல்புக்காக ἵνα உடன் உள்ள கருதப்பட்ட தொடர்பு ‘செய்ததால்’ என இணைக்கப்படுகிறது, ஆனால் அது சீடர்களின் முன்கருத்தாகவே வைக்கப்படுகிறது.
- source_word: οὗτος
  choice: இவன்
  rationale: சூழலில் அருகிலுள்ள அந்த மனிதனைக் குறிக்கும் சுட்டுப்பெயர்; ‘இந்த மனிதனா’ என்பதைக் காட்டிலும் உரையாடலில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: தந்தை, தாய் இருவரையும் குறிக்கும் γονεῖς என்பதற்கான நேரான நவீனத் தமிழ் இணைச்சொல்.
- source_word: ἵνα ... γεννηθῇ
  choice: குருடனாகப் பிறந்தான்
  rationale: சீடர்கள் கருதிய பாவம்–பிறவிக்குருடுத்தன்மை தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ἵνα-வின் நோக்கம்/விளைவு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τυφλὸς
  choice: குருடனாக
  rationale: பிறப்பிலிருந்த நிலையை நேரடியாகவும் பொதுவாகப் புரியும் வகையிலும் குறிக்கிறது.
theological_decisions:
- issue: சீடர்களின் கேள்வியில் ἵνα காட்டும் காரணம்/நோக்கம்/விளைவு தொடர்பு
  choice: ‘யார் பாவம் செய்ததால் ... குருடனாகப் பிறந்தான்?’ என்று சீடர்கள் கருதிய காரணத் தொடர்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இவன் குருடனாகப் பிறக்கும்படி யார் பாவம் செய்தார்?’
  rationale: இது சீடர்களின் கேள்வியைப் பதிவு செய்கிறது; பாவமே பிறவிக்குருடுத்தன்மைக்கான காரணம் என்று உரையாளர் உறுதிப்படுத்துவதாக மாற்றப்படவில்லை. கிரேக்கத்தின் நோக்கம்/விளைவு சார்ந்த தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல் வரிசையை அப்படியே பின்பற்றாமல் தமிழில் இயல்பான கேள்வி அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘ரபீ’ வரலாற்றுச் சூழலைக் காக்கிறது; அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
