source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: ta
  text: அவர், “ஆண்டவரே[a], நான் நம்புகிறேன்” என்றார்; அவரை வழிபட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஐயா.” கிரேக்க κύριε என்பது மரியாதையான அழைப்பாகவும் இருக்கலாம்; இங்கு நம்பிக்கை அறிக்கையும் வழிபாடும் உச்சநிலையாக வருவதால் “ஆண்டவரே” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது “அவர் முன் பணிந்து விழுந்தார்” / “அவருக்கு வணக்கம் செலுத்தினார்.” கிரேக்க வினை பணிந்து விழுவதையோ மரியாதை செலுத்துவதையோ குறிக்கலாம்; இங்கு சூழலைக் கருத்தில் கொண்டு “வழிபட்டார்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: அதற்கு அவர்
  rationale: ὁ என்பது முன்பு பார்வை பெற்ற மனிதரைக் குறிக்கும் பதிலிப்பெயர்போல் செயல்படுகிறது. δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல், இயேசுவின் கேள்விக்கான பதிலைத் தொடர்வதால் இயல்பான தமிழில் “அதற்கு” என மொழிபெயர்க்கப்பட்டது.
- source_word: ἔφη
  choice: என்றார்
  rationale: φημί என்பதன் இறந்தகால வடிவம் உரையாடலை அறிமுகப்படுத்தும் சாதாரண கதைநடைச் சொல்; நேரடி உரைக்குப் பின் “என்றார்” என்பது இயல்பான தமிழ்.
- source_word: Πιστεύω
  choice: நான் நம்புகிறேன்
  rationale: πιστεύω என்பது இயேசுவின் வெளிப்பாட்டுக்கான நேரடிப் பதிலாக இங்கு வருகிறது. யோவான் நற்செய்தியில் தொடரும் ‘நம்புதல்’ என்ற கருத்துச் சொல்லுடன் உள்ள தொடர்பையும் இது காக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பது மரியாதையான “ஐயா” என்றும் பொருள்படலாம். ஆனால் மனிதரின் நம்பிக்கை அறிக்கையும் அதைத் தொடர்ந்து வரும் προσκυνέω செயலும் சேர்ந்த சூழலில், உயர்ந்த அழைப்புமுறையான “ஆண்டவரே” முதன்மை உரையில் பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: προσεκύνησεν
  choice: வழிபட்டார்
  rationale: προσκυνέω என்பது பணிந்து விழுதல் அல்லது மரியாதை செலுத்துதல் என்பதையும் குறிக்கலாம். இங்கு இயேசுவை நோக்கிய நம்பிக்கை அறிக்கையைத் தொடர்ந்து வருவதால் “வழிபட்டார்” என்பது சூழலின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது; சொல்லியல் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: αὐτῷ
  choice: அவரை
  rationale: προσκυνέω உடன் வரும் வேற்றுமை உருபுடைய αὐτῷ, தமிழில் வினையின் நேரடிச் செயப்படுபொருளாக “அவரை” என்று இயல்பாகக் கூறப்படுகிறது.
theological_decisions:
- issue: κύριε என்பதை வெறும் மரியாதை அழைப்பான “ஐயா” என்று மொழிபெயர்ப்பதா, அல்லது கிறிஸ்துவியல் நிறையுடைய “ஆண்டவரே” என்று மொழிபெயர்ப்பதா
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இயேசு தம்மை வெளிப்படுத்திய உடனே அந்த மனிதர் நம்பிக்கை அறிக்கை செய்து அவரை வழிபடுகிறார். ஆகவே “ஆண்டவரே” என்பது சூழலின் உயர்ந்த தன்மையைப் பாதுகாக்கிறது; இருப்பினும் கிரேக்கச் சொல்லின் மரியாதை அழைப்பு என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: προσεκύνησεν என்பதை “வழிபட்டார்” என்று தெளிவாகக் கூறுவதா, அல்லது உடல் வணக்கச் செயலாக மட்டுமே மொழிபெயர்ப்பதா
  choice: வழிபட்டார்
  alternative: அவர்முன் பணிந்து விழுந்தார் / அவருக்கு வணக்கம் செலுத்தினார்
  rationale: இந்தச் செயலின் பொருள் இயேசு; மேலும் இது வெளிப்படையான நம்பிக்கை அறிக்கையைத் தொடர்ந்து வருகிறது. எனவே “வழிபட்டார்” சூழலில் மிகவும் இயல்பான பொருள். ஆயினும் கிரேக்க வினையின் பரந்த பொருள் வரம்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. குணமடைந்த மனிதரையும் இயேசுவையும் குறிக்க மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டு தொடர்ச்சியான செயல்களையும் தெளிவாகக் காட்ட அரைப்புள்ளி இடப்பட்டுள்ளது; genuine சொல்லியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
