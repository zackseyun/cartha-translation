source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: ta
  text: பாவிகளுக்குக் கடவுள் செவிகொடுப்பதில்லை என்பது நமக்குத் தெரியும். ஆனால், ஒருவர் கடவுளுக்கு பயபக்தியுள்ளவராக[a] இருந்து, அவருடைய விருப்பத்தைச் செய்தால், அவருக்குக் கடவுள் செவிகொடுப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளை வழிபடுகிறவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: நமக்குத் தெரியும்
  rationale: οἶδα நிறைவுக்கால வடிவிலிருந்தாலும் கோயினே கிரேக்கத்தில் நிகழ்காலப் பொருளைக் கொண்டது; தமிழில் இயல்பாகவும் கூட்டறிவை வெளிப்படுத்தவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἁμαρτωλῶν
  choice: பாவிகளுக்கு
  rationale: இது ἀκούει என்பதுடன் வரும் பன்மை உரிமைவேற்றுமை வடிவம்; குறிக்கப்படும் மனித வகுப்பின் அற-சமய வலிமையை ‘பாவிகள்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀκούει
  choice: செவிகொடுப்பதில்லை / செவிகொடுப்பார்
  rationale: இங்கு வெறுமனே ஒலி கேட்பதைவிட ஒருவரின் வேண்டுதலை ஏற்று கவனிப்பதைக் குறிக்கிறது. ‘செவிகொடு’ அந்த உறவுசார் பொருளைப் பாதுகாக்கிறது; ‘பதிலளி’ என்று மிகையாக விளக்கவில்லை.
- source_word: θεοσεβὴς
  choice: கடவுளுக்கு அஞ்சி
  rationale: θεοσεβής என்பது கடவுளிடம் பயபக்தி கொண்டிருப்பதைக் குறிக்கிறது. ‘கடவுளுக்கு அஞ்சி’ என்பது வெளிப்படையான கடவுள்-குறிப்பையும் விரிந்த பயபக்திப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: அவருடைய விருப்பத்தின்படி நடந்தால்
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய விருப்பத்தைச் செய்தால்’ என்பதன் பொருளை, நவீன தமிழில் இயல்பாகவும் நடத்தை சார்ந்த வலிமையுடனும் வெளிப்படுத்துகிறது.
- source_word: τούτου ἀκούει
  choice: அவருக்குக் கடவுள் செவிகொடுப்பார்
  rationale: τούτου முன் குறிப்பிடப்பட்ட கடவுளுக்கு அஞ்சுகிற நபரை வலியுறுத்திச் சுட்டுகிறது. எழுவாயான கடவுளை மீண்டும் வெளிப்படையாகக் கூறுவது தமிழில் தெளிவளிக்கிறது.
- source_word: ἀλλ’ ἐάν τις
  choice: ஆனால், ஒருவர் … நடந்தால்
  rationale: முரண்பாட்டைக் காட்டும் நிபந்தனை அமைப்பையும், வரையறுக்கப்படாத ஒருமை நபரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘பாவிகளுக்குக் கடவுள் செவிகொடுப்பதில்லை’ என்ற கூற்றின் வரம்பு
  choice: பேசுகிறவர் கூறியபடியே கூற்றின் வலிமையைத் தணிக்காமலும் கோட்பாட்டு விளக்கம் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பாவிகளின் ஜெபங்களைக் கடவுள் கேட்பதில்லை’ அல்லது ‘பாவிகளைக் கடவுள் அங்கீகரிப்பதில்லை.’
  rationale: கிரேக்கத்தில் கடவுள் பாவிகளுக்குச் ‘செவிகொடுப்பதில்லை’ என்ற பொதுவான கூற்றே உள்ளது. கடவுள் எந்த அர்த்தத்திலும் பாவிகளைக் கேட்பதில்லை என்ற விரிந்த கோட்பாட்டையோ, ‘ஜெபங்கள்’ என்ற வெளிப்படையாக இல்லாத சொல்லையோ மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
- issue: θεοσεβής என்பதன் பொருள்
  choice: கடவுளுக்கு அஞ்சி
  alternative: கடவுளை வழிபடுகிறவர்
  rationale: முதன்மை மொழிபெயர்ப்பு இச்சொல்லின் விரிந்த பயபக்திப் பொருளைப் பாதுகாக்கிறது. வழிபாட்டை மையப்படுத்தும் மாற்றுப் பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘செவிகொடு’ என்பது வெறும் உடல்சார் கேட்டலைவிட சாதகமாகக் கவனித்தலைக் குறிக்கிறது. அடிக்குறிப்பு குறியீடு θεοσεβής என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
