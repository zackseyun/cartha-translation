  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: ta
  text: ஆகவே அவர்கள் அவனிடம், “அவன் உனக்கு என்ன செய்தான்? உன் கண்களை எப்படி திறந்தான்?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: என்று கேட்டார்கள்
  rationale: λέγω என்பதன் அடிப்படைப் பொருள் ‘சொன்னார்கள்’ என்றாலும், இங்கு தொடர்ந்து வரும் இரண்டு நேரடிக் கேள்விகளை இயல்பான தமிழில் அறிமுகப்படுத்த ‘கேட்டார்கள்’ என்பது சூழலுக்கேற்ற தெளிவான மொழிபெயர்ப்பு.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் விளைவு அல்லது தர்க்கத் தொடர்பை οὖν குறிக்கிறது; ‘ஆகவே’ அந்த இணைப்பைத் தக்கவைக்கிறது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: பார்வை பெற்ற மனிதனைக் குறிக்கும் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் ‘அவனிடம்’ என வழங்குகிறது.
- source_word: Τί ἐποίησέν σοι
  choice: அவன் உனக்கு என்ன செய்தான்?
  rationale: ποιέω உடன் வரும் σοι, ‘உனக்கு/உன்னிடம் என்ன செய்தான்?’ என்ற பொருள் வரம்பைக் கொண்டது. ‘உனக்கு என்ன செய்தான்?’ என்பது நன்மை என்ற கருத்தைத் தேவையின்றி வலியுறுத்தாமல் கிரேக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: செயலின் முறை அல்லது வழியைக் கேட்கும் வினாவடையின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: உன் கண்களை எப்படி திறந்தான்?
  rationale: உடல் உறுப்பைக் குறிக்கும் கிரேக்க உடைமை அமைப்பை இயல்பான தமிழில் ‘உன் கண்கள்’ என வழங்கி, ἀνοίγω என்பதன் செய்பாட்டு அர்த்தத்தையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் நேரடியானவும் கண்ணியமானவும் உள்ள உரை. விசாரணைத் தொனி கேள்விகளின் சுருக்கமான வடிவால் தக்கவைக்கப்பட்டுள்ளது.
