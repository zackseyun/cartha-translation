  source_fidelity: கருத்து சரியாக உள்ளது; κρίμα-வை ‘நியாயத்தீர்ப்பு’ என்றும், βλέπειν-சொல்லின் நேரடி/உருவக இரட்டைப் பொருளை ‘காணாதவர்கள் / காண்பவர்கள்’ என்றும் வழங்குவது மூலத்துக்கு நெருக்கமானது. ஆனால் வரைவு வாக்கியத்தில் இரண்டாம் ‘வந்தேன்’ ἦλθον-ஐத் தவறாக மீண்டும் இணைக்கிறது; ἵνα-நோக்கத்தைக் காட்டும் ‘ஆகும்படி’ முழு இணைத் தொடரையும் ஆள வேண்டும்.
  naturalness: ‘பார்வையற்றவர்கள் பார்வை பெறவும், பார்வையுள்ளவர்கள் குருடராகவும் வந்தேன்’ என்பது நவீன தமிழில் இலக்கணரீதியாகத் தெளிவற்றது; இயேசு ‘குருடராக வந்தார்’ என்ற தவறான தொடர்பை ஏற்படுத்தலாம். ‘காணாதவர்கள் காணவும், காண்பவர்கள் குருடராகவும் ஆகும்படி’ என்பது சுருக்கமாகவும் இயல்பாகவும் இணையான சொல்லமைப்பைத் தக்கவைத்தும் உள்ளது.
