source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: ta
  text: 'இயேசு சொன்னார்: “காணாதவர்கள் காணவும், காண்பவர்கள் குருடராகவும் ஆகும்படி, நான் இந்த உலகத்திற்கு நியாயத்தீர்ப்புக்காக வந்தேன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு நியாயத்தீர்ப்புக்காக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க εἰς κρίμα, தண்டனையை மட்டும் அல்லாமல், இயேசுவின் வருகையால் ஏற்படும் நீதிசார் தீர்ப்பின் விளைவையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: நியாயத்தீர்ப்பு
  rationale: இங்கு இயேசுவின் வருகையால் வெளிப்படும் நீதித்தீர்ப்பின் விளைவையும் பிரித்தறிதலையும் குறிக்கிறது. ‘தண்டனைத் தீர்ப்பு’ என்பது பொருளை அளவுக்கு மீறிக் குறுக்கும்.
- source_word: κόσμον
  choice: உலகம்
  rationale: யோவான் எழுத்தில் மனித உலகைக் குறிக்கும் வழக்கமான, சூழலுக்கேற்ற சொல்.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: பார்வையற்றவர்கள் / பார்வையுள்ளவர்கள்
  rationale: காணுதல் என்ற உருவகத்தின் உடல்சார், ஆன்மீக இரு பரிமாணங்களையும் தக்கவைத்துக் கொண்டு இணையான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: βλέπωσιν
  choice: பார்வை பெறவும்
  rationale: உடல்சார் பார்வை கிடைப்பதையும் ஆன்மீகமாகக் காணத் தொடங்குவதையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ்.
- source_word: τυφλοὶ γένωνται
  choice: குருடராகவும்
  rationale: γίνομαι-யின் ‘ஆகுதல்’ என்ற விளைவுப் பொருளையும் கூற்றின் கூர்மையான தலைகீழ் மாற்றத்தையும் காக்கிறது.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: இந்த உலகத்திற்குள் வந்தேன்
  rationale: εἰς என்பதன் ‘உள்ளே/உள்ளிற்குள்’ இயக்கத்தையும் யோவானின் வருகை மொழியையும் இயல்பாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: யோவான் 3:17-இல் வரும் ‘உலகத்தை நியாயந்தீர்க்க அல்ல’ என்ற கூற்றுடன் இவ்வசனத்தின் தொடர்பு
  choice: κρίμα என்பதை ‘நியாயத்தீர்ப்பு’ என்று மொழிபெயர்த்து, பதற்றத்தைத் தணிக்காமல் வைத்தல்
  alternative: ‘பிரிவினை’ அல்லது ‘தண்டனைத் தீர்ப்பு’ என்று மொழிபெயர்த்தல்
  rationale: இயேசுவின் வருகை மனிதர்களின் உண்மையான நிலையை வெளிப்படுத்தி நீதிசார் பிரிவை ஏற்படுத்துவதாக வசனம் கூறுகிறது. வேறு யோவானிய கூற்றுகளோடு செயற்கையாக ஒத்திசைக்காமல் மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாய்வழி வாசிப்புக்கும் ஏற்ற நடை. ‘பார்வை’/‘குருடர்’ என்ற இணைச்சொற்கள் மூலம் உடல்சார் மற்றும் ஆன்மீக அர்த்தங்களின் இரட்டைத்தன்மை காக்கப்பட்டுள்ளது.
