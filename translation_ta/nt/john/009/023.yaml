id: JHN.9.23
reference: John 9:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: ta
  text: இதனால்தான் அவனுடைய பெற்றோர், “அவன் வயதுவந்தவன்; அவனிடமே கேளுங்கள்”[a] என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் பதில் சொல்லும் வயதுடையவன்; அவனிடமே விசாரியுங்கள்.”
    reason: Ἡλικίαν ἔχει மற்றும் ἐπερωτήσατε ஆகியவற்றின் சாத்தியமான சொற்பொருள் நுணுக்கங்களைப் பதிவு செய்யும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட காரணத்தைப் பின்னோக்கிச் சுட்டும் தொடரின் காரணப் பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: அவனுடைய பெற்றோர்
  rationale: அந்த மனிதனின் தந்தையையும் தாயையும் கூட்டாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: εἶπαν
  choice: சொன்னார்கள்
  rationale: கிரேக்கத்தில் உள்ள பொதுவான பேசுதல் வினையின் எளிய பொருளைப் பாதுகாக்கிறது; ‘பதிலளித்தார்கள்’ போன்ற கூடுதல் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: Ἡλικίαν ἔχει
  choice: அவன் வயதுவந்தவன்
  rationale: சொல்லடியாக ‘அவனுக்கு வயது உள்ளது’ என்றாலும், இச்சூழலில் தானே பதிலளிக்கத் தகுந்த வயதுடையவன் என்பதே பொருள். ‘வயதுவந்தவன்’ என்பது சமூக/சட்டத் தகுதியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: αὐτὸν ἐπερωτήσατε
  choice: அவனிடமே கேளுங்கள்
  rationale: αὐτόν என்பதன் வலியுறுத்தலை ‘-இடமே’ வெளிப்படுத்துகிறது; கட்டளை வடிவமான ἐπερωτήσατε என்பதற்கு ‘கேளுங்கள்’ இயல்பான மரியாதைப் பன்மை வடிவமாகும்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. கிரேக்கத்தின் காரணத் தொடர்பும் αὐτόν என்பதன் வலியுறுத்தலும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
