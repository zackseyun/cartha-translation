  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: ta
  text: இவற்றைச் சொன்னபின், அவர் தரையில் உமிழ்ந்து, அதனால் சேறு உண்டாக்கி, அந்தச் சேற்றை அவனுடைய கண்களின்மேல் பூசினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேற்றை அவனுடைய கண்களின்மேல் அபிஷேகம் செய்தார்.” இங்குள்ள கிரேக்க வினைச்சொல் “பூசுதல்,” “தடவுதல்,” அல்லது “அபிஷேகம் செய்தல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: இவற்றைச் சொன்னபின்
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மைச் செயல்களுக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. இந்தத் தமிழாக்கம் காலவரிசையை இயல்பாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: ἔπτυσεν χαμαί
  choice: அவர் தரையில் உமிழ்ந்து
  rationale: χαμαί என்பது ‘தரையில்’ அல்லது ‘தரையை நோக்கி’ என்பதைக் குறிக்கிறது. ‘உமிழ்ந்து’ என்பது செயலை நேரடியாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: அந்த உமிழ்நீரால் சேறு உண்டாக்கி
  rationale: πηλός என்பதற்கு களிமண் அல்லது ஈரச்சேறு எனப் பொருள் வரலாம். இச்சூழலில் மண்ணும் உமிழ்நீரும் கலந்து உருவான பொருளை ‘சேறு’ தெளிவாகக் குறிக்கிறது; ‘அந்த உமிழ்நீரால்’ என்பது முன் கூறிய உமிழ்தலோடு தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἐπέχρισεν
  choice: பூசினார்
  rationale: ἐπιχρίω என்பது ஒரு பொருளை மேலே பூசுதல், தடவுதல், அல்லது அபிஷேகம் செய்தல் எனப் பொருள்படலாம். சேற்றைக் கண்களின்மேல் இடும் இச்சூழலில் ‘பூசினார்’ என்பது செயலை இயல்பாகக் காட்டுவதோடு தேவையற்ற சடங்கு சார்ந்த பொருளையும் சேர்ப்பதில்லை.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: அந்தச் சேற்றை அவனுடைய கண்களின்மேல்
  rationale: ‘அந்தச் சேறு’ முன்பு உண்டாக்கப்பட்ட சேற்றையே சுட்டுகிறது. αὐτοῦ சூழலில் பார்வையற்ற மனிதனைக் குறிக்கிறது; ‘அவனுடைய கண்களின்மேல்’ கிரேக்கத் தொடரின் உறவையும் திசையையும் காக்கிறது.
theological_decisions:
- issue: ἐπέχρισεν என்பதில் இருக்கக்கூடிய சடங்கு அல்லது அபிஷேக நுட்பப்பொருள்
  choice: முதன்மை உரையில் ‘பூசினார்’
  alternative: ‘அவனுடைய கண்களுக்குச் சேற்றால் அபிஷேகம் செய்தார்’
  rationale: வினைச்சொல்லுக்கு ‘அபிஷேகம் செய்தல்’ என்ற பொருள் சாத்தியமானாலும், இங்கு சேற்றை உடல்மீது இடும் செயல் நேரடியாக விவரிக்கப்படுகிறது. ஆகவே வசனம் வெளிப்படையாகக் கூறாத சடங்கு அல்லது மேசியா சார்ந்த கருத்தைச் சேர்க்காமல், சொற்பொருள் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சேறு,’ ‘உமிழ்நீர்,’ ‘பூசினார்’ ஆகியவை காட்சியின் உடல்சார்ந்த செயலைத் தெளிவாகக் காட்டுகின்றன; ‘அபிஷேகம்’ என்ற சாத்தியமான நுட்பப்பொருள் முதன்மை உரையில் திணிக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
