translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் உரையாடல் சுட்டுப்பெயருக்கு மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள சுருக்கமான மூன்று செயல்களின் வரிசை அரைப்புள்ளிகளால் பாதுகாக்கப்பட்டுள்ளது.
