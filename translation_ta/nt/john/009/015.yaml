source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: ta
  text: எனவே, பரிசேயர்களும் அவனிடம், அவன் எப்படிப் பார்வை பெற்றான்[a] என்று மீண்டும் கேட்டார்கள். அதற்கு அவன், “அவர் என் கண்களின்மேல் சேற்றை[b] வைத்தார்; நான் கழுவினேன்; பார்க்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “எப்படி பார்க்கத் தொடங்கினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ἀναβλέπω இச்சூழலில் பார்வை பெறுதல் அல்லது பார்க்கத் தொடங்குதல் என்ற பொருளைத் தருகிறது.
  - marker: b
    text: அல்லது “களிமண்ணை.”
    reason: πηλός என்ற சொல் சேறு அல்லது களிமண் எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: கேள்வி கேட்கப்படுவது திரும்பவும் நிகழ்வதை இயல்பாகக் குறிக்கிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதைத் தொடர்பைக் காட்டுகிறது; மிகக் கடுமையான தர்க்க முடிவாக மாற்றவில்லை.
- source_word: ἠρώτων
  choice: கேட்டார்கள்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்ச்சி அல்லது மறுமுறைத் தன்மை ‘மீண்டும்’ என்பதுடன் தெளிவாக வெளிப்படுகிறது.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: பரிசேயர்களும்
  rationale: καί குறிக்கும் சேர்க்கைப் பொருளை தமிழின் ‘-உம்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: πῶς ἀνέβλεψεν
  choice: எப்படிப் பார்வை பெற்றான்
  rationale: குணமாக்கப்பட்ட சூழலில் ἀναβλέπω என்பது மேலே பார்ப்பதை அல்ல, பார்வை பெறுவதைக் குறிக்கிறது; பிறவியிலேயே பார்வையற்றிருந்தவனைப் பற்றி ‘பார்வையை மீண்டும் பெற்றான்’ என்று கூறுவதைத் தவிர்க்கிறது.
- source_word: Πηλὸν
  choice: சேற்றை
  rationale: πηλός ஈரமான மண் அல்லது களிமண்ணைக் குறிக்கலாம்; இச்சூழலில் ‘சேறு’ சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: என் கண்களின்மேல் சேற்றை வைத்தார்
  rationale: ἐπιτίθημι என்பதன் ‘மேல் வைத்தல்’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது; ‘பூசினார்’ என்ற சூழல் சார்ந்த கூடுதல் விவரத்தைத் திணிக்கவில்லை.
- source_word: ἐνιψάμην
  choice: நான் கழுவினேன்
  rationale: நடுத்தர வடிவின் தற்சுட்டுப் பொருள் தமிழில் சூழலால் புரிவதால் ‘என்னைக் கழுவிக்கொண்டேன்’ என்று தேவையின்றி விரிக்கப்படவில்லை.
- source_word: βλέπω
  choice: இப்போது பார்க்கிறேன்
  rationale: நிகழ்கால வினை காட்டும் தற்போதைய விளைவைத் தெளிவுபடுத்தி, கிரேக்கத்தின் உயிரோட்டமான உடனடித் தன்மையைப் பாதுகாக்கிறது.
