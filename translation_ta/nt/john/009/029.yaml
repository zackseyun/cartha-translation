  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: ta
  text: “தேவன் மோசேயிடம் பேசியிருக்கிறார் என்பது எங்களுக்குத் தெரியும்; ஆனால், இந்த மனிதர் எங்கிருந்து வந்தவர் என்பது எங்களுக்குத் தெரியாது.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் எங்கிருந்து வருகிறார்” என்றும் மொழிபெயர்க்கலாம். யோவான் நற்செய்தியில் இயேசுவின் தோற்றுவாயைப் பற்றிய கேள்விகள் சாதாரணமான பொருளோடும் ஆழமான இறையியல் பொருளோடும் ஒலிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: எங்களுக்கு
  rationale: வெளிப்படையாகக் கொடுக்கப்பட்டுள்ள பன்மைத் தன்மைப் பெயர், பேச்சாளர்கள் தங்கள் அறிவை வலியுறுத்துவதைக் காட்டுகிறது; தமிழில் ‘எங்களுக்குத் தெரியும்’ என்ற இயல்பான தொடரே அந்த முரண்பாட்டைப் போதுமான அளவு வெளிப்படுத்துகிறது.
- source_word: οἴδαμεν
  choice: தெரியும்
  rationale: இங்கு உறுதியாக அறிந்திருப்பதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொல்லால் மொழிபெயர்த்து, மூலத்தின் மீளுரையைப் பேணுகிறது.
- source_word: Μωϋσεῖ
  choice: மோசேயிடம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்; உடன் வரும் வினைச்சொல்லுக்கேற்ப ‘-யிடம்’ வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: λελάληκεν
  choice: பேசியிருக்கிறார்
  rationale: நிறைவேற்றுக் காலம், கடந்த காலத்தில் நிகழ்ந்த தேவனுடைய பேச்சை தற்போது நிலைபெற்ற உண்மையாக முன்வைக்கிறது; ‘பேசியிருக்கிறார்’ அந்த நுணுக்கத்தை இயல்பாகக் காக்கிறது.
- source_word: ὁ θεός
  choice: தேவன்
  rationale: மூலத்தின் ஒருமை, குறிப்பிட்ட இறைக் குறிப்பு ஆகியவற்றைத் தமிழ் வேதாகம நடைக்கு ஏற்ற dignified வடிவில் தருகிறது.
- source_word: τοῦτον
  choice: இந்த மனிதர்
  rationale: இயேசுவைத் தள்ளி நிறுத்திப் பேசும் சுட்டுத் தன்மையைப் பேணுகிறது; ‘இவர்’ என்பதைவிட ‘இந்த மனிதர்’ மூலத்தின் தொனியை தெளிவாக வெளிப்படுத்துகிறது, ஆனால் தேவையற்ற இழிவுச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: மோசேயைப் பற்றிய உறுதியான அறிவுக்கும் இயேசுவைப் பற்றியதாகக் கூறப்படும் அறியாமைக்கும் இடையிலான முரண்பாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: οὐκ οἴδαμεν
  choice: எங்களுக்குத் தெரியாது
  rationale: முன்னர் வந்த ‘எங்களுக்குத் தெரியும்’ என்பதற்கு நேரான எதிர்மறை வடிவமாக இருந்து, மூலத்தின் சொல்லாட்சிச் சமநிலையைப் பேணுகிறது.
- source_word: πόθεν ἐστίν
  choice: எங்கிருந்து வந்தவர்
  rationale: புவியியல் பிறப்பிடம், தோற்றுவாய் அல்லது அதிகாரத்தின் மூலம் ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல், யோவான் நற்செய்தியில் உள்ள அடுக்கான பொருளுக்கான இடத்தைத் திறந்துவைக்கிறது.
theological_decisions:
- issue: πόθεν ἐστίν என்பதில் இயேசுவின் தோற்றுவாயின் பொருள்
  choice: ‘எங்கிருந்து வந்தவர்’ என்று விரிவான பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் எங்கிருந்து வருகிறார்’ அல்லது ‘அவருடைய தோற்றுவாய் என்ன’
  rationale: பேச்சாளர்கள் சாதாரணமான ஊர் அல்லது பின்னணியை எண்ணியிருக்கலாம்; ஆனால் யோவான் நற்செய்தியில் இயேசு எங்கிருந்து வந்தவர் என்ற கேள்வி ஆழமான இறையியல் முக்கியத்துவத்தையும் கொண்டிருக்கிறது. மொழிபெயர்ப்பு இந்த இரட்டைப் பொருளைத் தீர்த்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ், கண்ணியமான வேதாகம நடை. ‘பேசியிருக்கிறார்’ நிறைவேற்றுக் கால நுணுக்கத்தைக் காக்கிறது. ‘இந்த மனிதர்’ பேச்சாளர்களின் விலகிய தொனியைத் தருகிறது; மரியாதையற்ற கடுமையைச் சேர்க்காமல் ‘வந்தவர்’ என்ற மரியாதை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
