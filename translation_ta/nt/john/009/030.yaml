reference: John 9:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: ta
  text: 'அந்த மனிதன் அவர்களுக்குப் பதிலளித்தார்: “இதில்தான் வியப்புக்குரிய காரியம் இருக்கிறது: அவர் எங்கிருந்து வந்தவர் என்பது உங்களுக்குத் தெரியவில்லை; இருந்தும் அவர் என் கண்களைத் திறந்தார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: அந்த மனிதர் அவர்களிடம் மறுமொழியாக ... என்றார்
  rationale: கிரேக்க மொழியின் பதிலுரைக் கட்டமைப்பைப் பொருள் இழக்காமல், நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் வழங்குகிறது; சூழலில் முன்பே அறிமுகமான மனிதரைக் குறிக்க ‘அந்த மனிதர்’ பொருத்தமானது.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: இதுதான் வியப்புக்குரிய காரியம்
  rationale: ἐν τούτῳ என்ற சுட்டுவலியுறுத்தலையும் θαυμαστόν என்பதன் வியப்பு/ஆச்சரியப் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது. γάρ-இன் விளக்கத் தொடர்பை அடுத்துவரும் இரட்டைப்புள்ளி வெளிப்படுத்துகிறது.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியவில்லை
  rationale: வலியுறுத்தப்பட்ட ὑμεῖς என்பதை ‘உங்களுக்கு’ என வெளிப்படையாக வைத்துப், οἶδα என்பதன் அறிவுசார் பொருளை நேரடியாகக் கூறுகிறது.
- source_word: πόθεν ἐστίν
  choice: அவர் எங்கிருந்து வந்தவர்
  rationale: இயேசுவின் தோற்றம் அல்லது வருகையின் மூலத்தைப் பற்றிய கேள்வியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதற்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: இருந்தும் அவர் என் கண்களைத் திறந்தார்
  rationale: καί என்பதன் சூழல்சார் எதிர்மறை முரணை ‘இருந்தும்’ வெளிப்படுத்துகிறது. ‘என் கண்களைத் திறந்தார்’ உடல் குணமாக்குதலை நேரடியாகக் கூறுவதோடு யோவானின் விரிந்த பார்வை/குருட்டுத்தன்மை ஒலிப்பையும் கட்டாய விளக்கமின்றி தக்கவைக்கிறது.
theological_decisions:
- issue: ‘என் கண்களைத் திறந்தார்’ என்பதிலுள்ள நேரடி குணமாக்குதலும் ஆன்மீகப் பார்வை குறித்த சாத்தியமான ஒலிப்பும்
  choice: உடல் குணமாக்குதலைக் குறிக்கும் நேரடி சொற்றொடரை அப்படியே வைத்தல்
  alternative: ஆன்மீக அறிவொளியை முன்னிறுத்தும் வகையில் மொழிபெயர்த்தல்
  rationale: உடனடி சூழலில் குருடனாய்ப் பிறந்த மனிதரின் உடல் குணமாக்குதலே குறிக்கப்படுகிறது. ஆன்மீகப் பார்வை பற்றிய யோவானிய ஒலிப்பு சூழலிலிருந்து வெளிப்பட அனுமதிக்கப்படுகிறது; அது மொழிபெயர்ப்பில் சேர்த்துரைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான ஒருமைச் சுட்டாக ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. குணமடைந்த மனிதரின் வியப்பும் மறைமுகமான கண்டனமும் இயல்பான, கண்ணியமான நடையில் தக்கவைக்கப்பட்டுள்ளன. தனிப்பட்ட சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
