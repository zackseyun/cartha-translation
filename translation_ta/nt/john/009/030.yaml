revisions:
- from: 'அந்த மனிதர் அவர்களிடம் மறுமொழியாக, “இதுதான் வியப்புக்குரிய காரியம்: அவர் எங்கிருந்து வந்தவர் என்று உங்களுக்குத் தெரியவில்லை; இருந்தும் அவர் என் கண்களைத் திறந்தார்!” என்றார்.'
  to: 'அந்த மனிதன் அவர்களுக்குப் பதிலளித்தார்: “இதில்தான் வியப்புக்குரிய காரியம் இருக்கிறது: அவர் எங்கிருந்து வந்தவர் என்பது உங்களுக்குத் தெரியவில்லை; இருந்தும் அவர் என் கண்களைத் திறந்தார்.”'
