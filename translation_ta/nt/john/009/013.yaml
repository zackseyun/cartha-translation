  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: ta
  text: முன்பு பார்வையற்றவராக இருந்த அந்த மனிதரைப் பரிசேயர்களிடம் கொண்டுபோனார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: கொண்டுபோனார்கள்
  rationale: கிரேக்கத்தில் இது வரலாற்று நிகழ்காலமாக இருந்தாலும், தமிழ் கதைநடையில் இயல்பாக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டுள்ளது. சூழலில் அவரைப் பரிசேயர்களிடம் அழைத்துச் சென்றதைக் குறிக்கிறது.
- source_word: αὐτὸν
  choice: அந்த மனிதரை
  rationale: αὐτόν என்பதன் நேரடிப் பொருள் ‘அவரை’. ஆனால் தொடர்ந்து வரும் substantival சொற்றொடருடன் இணைத்து, தமிழில் குறிப்புப் பொருள் தெளிவாக இருக்க ‘அந்த மனிதரை’ என வழங்கப்பட்டுள்ளது.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: பரிசேயர்களிடம்
  rationale: πρός + accusative இங்கு நபர்களை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘பரிசேயர்களிடம்’ என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: Φαρισαίους
  choice: பரிசேயர்கள்
  rationale: இந்த யூத சமயக் குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற வடிவம்.
- source_word: τόν ποτε τυφλόν
  choice: முன்பு பார்வையற்றவராக இருந்த அந்த மனிதரை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இச்சொற்றொடர் ‘முன்பு பார்வையற்றிருந்தவர்’ என்று பொருள்படும். முன் நிலைக்கும் தற்போதைய மாற்றத்திற்கும் இடையிலான வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ποτε
  choice: முன்பு
  rationale: இங்கு கடந்தகால நிலையைச் சுட்டுகிறது; சூழலின் கால வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: τυφλόν
  choice: பார்வையற்றவராக
  rationale: உடல் நிலையைக் குறிக்கும் τυφλός என்பதற்கு நவீன, மரியாதையான தமிழ் வடிவம்.
