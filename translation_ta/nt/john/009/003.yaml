revisions:
- from: இயேசு மறுமொழியாக, “இவனும் பாவம் செய்யவில்லை; இவனுடைய பெற்றோரும் பாவம் செய்யவில்லை. ஆனால் கடவுளின் செயல்கள் இவனில் வெளிப்படுவதற்காகவே இப்படி நேர்ந்தது[a]” என்றார்.
