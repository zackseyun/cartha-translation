id: JHN.9.3
reference: John 9:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “இவனும் பாவம் செய்யவில்லை; இவனுடைய பெற்றோரும் பாவம் செய்யவில்லை. ஆனால், கடவுளின் செயல்கள் இவனில் வெளிப்படுவதற்காகவே இது நிகழ்ந்தது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: இயேசு மறுமொழியாக … என்றார்
  rationale: உரையாடலில் பதிலளிப்பதைக் குறிக்கும் இயல்பான தமிழ் கதைநடை; கிரேக்க வினையின் உரையாடல் செயல்பாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: Οὔτε ... οὔτε
  choice: …உம் … இல்லை; …உம் … இல்லை
  rationale: இரண்டு முன்மொழிவுகளையும் சமமாகவும் வலியுறுத்தியும் மறுக்கும் கிரேக்க இணை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: οὗτος
  choice: இவன்
  rationale: சூழலில் பார்வையற்ற மனிதனைக் குறிக்கும் சுட்டுப்பெயர்; அவமதிப்பில்லாத, நேரடியான தமிழ் வடிவம்.
- source_word: ἥμαρτεν
  choice: பாவம் செய்யவில்லை
  rationale: ἁμαρτάνω என்பதன் இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: இவனுடைய பெற்றோர்
  rationale: γονεῖς என்பதற்கான சுருக்கமான, துல்லியமான நவீனத் தமிழ் இணை.
- source_word: ἀλλ’ ἵνα
  choice: ஆனால் … வெளிப்படுவதற்காகவே இப்படி நேர்ந்தது
  rationale: தமிழில் தனித்து விடப்படும் நோக்கத் துணைவாக்கியத்தின் இடர்ப்பாட்டைத் தவிர்க்க, சூழலில் பேசப்படும் நிலைமையை ‘இப்படி நேர்ந்தது’ என்று வெளிப்படையாகச் சேர்க்கிறது; ἵνα-வின் நோக்குப் பொருளை ‘வதற்காகவே’ காக்கிறது.
- source_word: φανερωθῇ
  choice: வெளிப்படுவதற்கு
  rationale: செயப்பாட்டு பொருளையும் மறைந்திருந்த ஒன்று தெளிவாகத் தெரியவரும் நுண்ணுணர்வையும் காக்கிறது.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: கடவுளின் செயல்கள்
  rationale: யோவான் நூலின் ἔργα சொல்லாட்சியை இயல்பான நவீனத் தமிழில் காக்கும் வெளிப்பாடு.
- source_word: ἐν αὐτῷ
  choice: இவனில்
  rationale: கிரேக்க ἐν αὐτῷ என்பதன் நேரடியான தெளிவின்மையைப் பாதுகாக்கிறது; ‘இவன் மூலமாக’ என்று கருவிப்பொருளை மட்டும் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இந்தக் குறிப்பிட்ட பார்வையின்மைக்கும் பாவத்திற்கும் உள்ள காரணத் தொடர்பை மட்டும் இயேசு மறுக்கிறாரா, அல்லது எல்லாத் துன்பங்களுக்கும் பொருந்தும் பொதுவிதியை அறிவிக்கிறாரா?
  choice: இவனும் இவனுடைய பெற்றோரும் பாவம் செய்ததே இந்த நிலைக்கு காரணம் என்ற இரு குறிப்பிட்ட முன்மொழிவுகளை மட்டும் மறுக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: எந்தத் துன்பத்துக்கும் தனிப்பட்ட அல்லது பெற்றோரின் பாவம் ஒருபோதும் காரணமல்ல என்று பொதுமைப்படுத்துதல்.
  rationale: வசனம் சீடர்களின் குறிப்பிட்ட கேள்விக்கே பதிலளிக்கிறது; மூலத்தில் இல்லாத உலகளாவிய கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கக் கூடாது.
- issue: ἵνα என்பது நோக்கத்தையா, விளைவையா குறிக்கிறது?
  choice: ‘வெளிப்படுவதற்காகவே’ என்று நோக்குப் பொருளுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அதன் விளைவாக … வெளிப்பட்டன’ என்று வெறும் விளைவாக மொழிபெயர்த்தல்.
  rationale: ἵνα + துணைநிலை வினையின் மிக நேரடியான வாசிப்பு நோக்கத்தைக் குறிக்கிறது. இது எழுப்பும் இறையியல் பதற்றத்தைத் தணிக்கும் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: ἐν αὐτῷ என்பது ‘இவனில்’ என்பதா, ‘இவன் மூலமாக’ என்பதா?
  choice: ‘இவனில்’ என்று வடிவரீதியாக நெருக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இவன் மூலமாக’ என்று கருவி அல்லது வழிமுறைப் பொருளைத் தெளிவாக்குதல்.
  rationale: ἐν சூழலின்படி தளம் அல்லது வழிமுறையைக் குறிக்கலாம்; ‘இவனில்’ என்பது மூலத்தின் உண்மையான பொருள் விரிவை முன்கூட்டியே சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’, ‘பாவம்’, ‘செயல்கள்’, ‘வெளிப்படுதல்’ ஆகியவை பொதுவாகப் புரியும் சொற்கள். மூலத்தின் நோக்குக் கட்டமைப்பும் ἐν αὐτῷ என்பதிலுள்ள பொருள் விரிவும் பாதுகாக்கப்பட்டுள்ளன.
