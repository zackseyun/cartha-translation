base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: ta
  text: பிறவியிலேயே பார்வையற்ற ஒருவருடைய கண்களை யாராவது திறந்ததாகத் தொன்றுதொட்டு கேள்விப்பட்டதே இல்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகம் தோன்றியதுமுதல், பிறவியிலேயே பார்வையற்ற ஒருவருடைய கண்களை யாராவது திறந்ததாக ஒருபோதும் கேள்விப்பட்டதில்லை.”
    reason: ἐκ τοῦ αἰῶνος என்ற கால மரபுத்தொடரின் பாரம்பரியமான, சற்றே விளக்கமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: தொன்றுதொட்டு
  rationale: ‘அந்தக் காலத்திலிருந்து’ என்ற சொற்பொருளைக் கொண்ட இம்மரபுத்தொடர், நினைவுக்கெட்டிய பழங்காலம் முதல் இதுவரையான மனித அனுபவத்தைக் குறிக்கிறது. ‘தொன்றுதொட்டு’ என்பது இயல்பான தமிழில் அந்த வரலாற்று விரிவைத் தருகிறது; ‘நித்தியத்திலிருந்து’ என்ற மெய்யியல் பொருளைச் சேர்ப்பதில்லை.
- source_word: οὐκ ἠκούσθη
  choice: கேள்விப்பட்டதே இல்லை
  rationale: இதுபோன்ற நிகழ்வு நடந்ததாக இதுவரை அறியப்பட்டதில்லை என்ற முன்னுதாரணமின்மையை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: ὅτι
  choice: திறந்ததாக
  rationale: கேள்விப்படாத செய்தியின் உள்ளடக்கத்தைத் தமிழின் ‘என்று/தாக’ அமைப்பில் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἠνέῳξέν
  choice: திறந்த
  rationale: ἀνοίγω என்பதன் நேரான பொருளையும் ‘கண்களைத் திறத்தல்’ என்ற மூலமொழி உருவகத்தையும் காக்கிறது; ‘பார்வையளித்தல்’ என்று விளக்கி விரிவாக்கவில்லை.
- source_word: τις
  choice: யாராவது
  rationale: எதிர்மறையான பொதுக்கூற்றில் வரும் வரையறுக்கப்படாத செய்பவரை இயல்பாகக் குறிக்கிறது.
- source_word: ὀφθαλμοὺς
  choice: கண்களை
  rationale: மூலத்தின் உடல் உறுப்பைக் குறிக்கும் சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τυφλοῦ γεγεννημένου
  choice: பிறவியிலேயே பார்வையற்ற ஒருவருடைய
  rationale: பிறந்தது முதல் இருந்த பார்வையின்மையைத் தெளிவாகச் சொல்கிறது. கிரேக்க ஆண்பால் ஒருமையைத் தமிழில் தேவையின்றி ‘ஒரு மனிதன்’ என்று சேர்க்காமல், நபரைக் குறிக்கும் மரியாதையான நடையில் வழங்குகிறது.
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος என்பதன் கால எல்லை
  choice: மனித நினைவுக்கும் அறியப்பட்ட வரலாற்றுக்கும் எட்டிய பழங்காலம் முதல்—‘தொன்றுதொட்டு’
  alternative: ‘உலகம் தோன்றியதுமுதல்’ அல்லது ‘நித்தியத்திலிருந்து’
  rationale: பேசுபவர் எந்த முன்னுதாரணமும் கேள்விப்பட்டதில்லை என்ற மனித அனுபவம் சார்ந்த வாதத்தை முன்வைக்கிறார்; நித்தியத்தைப் பற்றிய மெய்யியல் கூற்றை அல்ல. பிரதான மொழிபெயர்ப்பு அந்த வலிமையை மிகைப்படுத்தாமல் காக்கிறது; மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘பார்வையற்ற’ என்பது இன்றைய மரியாதையான பயன்பாடு; ‘கண்களைத் திறந்தார்’ என்ற மூலமொழி வெளிப்பாடு அப்படியே காக்கப்பட்டுள்ளது. வாக்கியத்தின் ‘கேள்விப்பட்டதே இல்லை’ என்ற வலியுறுத்தல் மூலத்தின் முன்னுதாரணமின்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
