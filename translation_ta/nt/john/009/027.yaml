id: JHN.9.27
reference: John 9:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: ta
  text: 'அவன் அவர்களுக்குப் பதிலளித்தான்: “நான் ஏற்கெனவே உங்களிடம் சொன்னேன்; ஆனால் நீங்கள் செவிகொடுக்கவில்லை.[a] மறுபடியும் ஏன் கேட்க விரும்புகிறீர்கள்? நீங்களும்கூட அவருடைய சீடர்களாக ஆக விரும்பவில்லைதானே?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் கேட்கவில்லை.” கிரேக்க வினைச்சொல் ‘கேள்’ என்றும் ‘செவிகொடு’ என்றும் பொருள்படலாம்; இங்கு சொன்னதை அவர்கள் ஏற்றுக்கொள்ளவில்லை என்பதே பெரும்பாலும் கருத்து.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிச்சயமாக நீங்களும்கூட அவருடைய சீடர்களாக ஆக விரும்பவில்லை, அல்லவா?” கிரேக்க வினா எதிர்மறையான பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: அவன் அவர்களுக்குப் பதிலளித்தான்
  rationale: கிரேக்கக் கதையாடல் வினையின் வழக்கமான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: முன்பே நிகழ்ந்த செயலை வலியுறுத்தும் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: οὐκ ἠκούσατε
  choice: நீங்கள் செவிகொடுக்கவில்லை
  rationale: ἀκούω என்பதன் அடிப்படைப் பொருள் ‘கேள்’ என்றாலும், இச்சூழலில் சொன்னதை ஏற்றுக்கொள்ளாமை அல்லது கவனிக்காமை குறிக்கப்படுகிறது; ‘செவிகொடுக்கவில்லை’ அந்தக் கண்டிக்கும் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: மறுபடியும் ஏன் கேட்க விரும்புகிறீர்கள்?
  rationale: τί இங்கு சூழலுக்கேற்றவாறு காரணம் கேட்கும் ‘ஏன்’ எனப் புரிகிறது; πάλιν என்பதன் மறுமுறைப் பொருளும் காக்கப்படுகிறது.
- source_word: μὴ καὶ ὑμεῖς
  choice: நீங்களும்கூட ... விரும்பவில்லைதானே?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைக் குறிக்கிறது; தமிழின் ‘இல்லைதானே?’ அமைப்பு அந்த நையாண்டித் தொனியுள்ள எதிர்பார்ப்பை வெளிப்படுத்துகிறது.
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: அவருடைய சீடர்களாக ஆக
  rationale: αὐτοῦ என்பதற்கு இயல்பான உடைமைத் தொடர் பயன்படுத்தப்படுகிறது; γενέσθαι குறிக்கும் ஒரு நிலைக்கு வருதல் என்ற உட்புகும் பொருளை ‘ஆக’ காக்கிறது.
theological_decisions:
- issue: இறுதி வினாவின் சொல்லாற்றல்
  choice: எதிர்மறைப் பதிலை எதிர்பார்க்கும் நையாண்டி வினாவாக ‘நீங்களும்கூட ... விரும்பவில்லைதானே?’
  alternative: ‘ஒருவேளை நீங்களும்கூட அவருடைய சீடர்களாக ஆக விரும்புகிறீர்களா?’
  rationale: நேரடி வினாவில் μή பொதுவாக எதிர்மறைப் பதிலை எதிர்பார்க்கச் செய்கிறது. ஆகவே குணமடைந்தவனின் நையாண்டித் தொனியைத் தமிழிலும் வெளிப்படுத்துவது இலக்கணச் சான்றுக்கு ஏற்றது; இதனால் தனிப்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் மரியாதையான வேதாகமக் கதையாடல் நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘செவிகொடுக்கவில்லை’ என்பது வெறும் ஒலி கேட்காமையைவிட சொன்னதை ஏற்காத சூழல்சார் பொருளைத் தருகிறது. இறுதி வினாவில் உள்ள நையாண்டியும் எதிர்மறைப் பதில் எதிர்பார்ப்பும் ‘விரும்பவில்லைதானே?’ மூலம் காக்கப்பட்டுள்ளன.
