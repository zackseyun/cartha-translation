  source_fidelity: 'மூலக் கிரேக்கத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: ἤδη என்பதன் ‘ஏற்கெனவே’, πάλιν என்பதன் ‘மறுபடியும்’, μαθηταὶ γενέσθαι என்பதன் ‘சீடர்களாக ஆக’ ஆகியவை பொருத்தமானவை. οὐκ ἠκούσατε என்பதற்கு ‘செவிகொடுக்கவில்லை’ என்பது சூழலிலுள்ள கவனிக்காத/செவிமடுக்காத பொருளை நன்றாகத் தருகிறது. இறுதி μή-வினாவின் எதிர்மறைப் பதில் எதிர்பார்ப்பும் காக்கப்பட்டுள்ளது.'
