translation:
  language: ta
  text: இயேசு சேற்றைச்[a] செய்து, அவனுடைய கண்களைத் திறந்த[b] நாள் ஓர் ஓய்வுநாளாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “களிமண்ணைச்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “அவனுடைய கண்களைத் திறந்தார்”; இது குணமாக்குதலைக் குறிக்கும் உடல்சார்ந்த சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: ஓர் ஓய்வுநாள்
  rationale: இது ஒரு குறிப்பிட்ட வாராந்திர ஓய்வுநாள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்துவரும் சர்ச்சையை விளக்கமாகச் சேர்க்காமல் காலக் குறிப்பை மட்டும் தருகிறது.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: … நாள்
  rationale: கிரேக்கத்தின் காலத்தைக் குறிக்கும் தொடர்புத் தொடரைத் தமிழின் இயல்பான பெயரெச்ச அமைப்பில் வழங்குகிறது.
- source_word: πηλόν
  choice: சேறு
  rationale: உமிழ்நீரையும் மண்ணையும் கலந்து செய்த பொருளைக் குறிக்கும் சூழலில் ‘சேறு’ எளிய, இயல்பான சொல்; ‘களிமண்’ என்பதும் சாத்தியம்.
- source_word: ἐποίησεν
  choice: குழைத்து
  rationale: தமிழில் ‘சேற்றைச் செய்தார்’ என்பதைவிட, சூழலில் மண்ணையும் உமிழ்நீரையும் கலந்து சேறு உருவாக்கிய செயலை ‘குழைத்து’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνέῳξεν
  choice: திறந்த
  rationale: யோவானின் தெளிவான உடல்சார்ந்த உருவகத்தைப் பேணி, விளக்கமாக ‘பார்வையைக் கொடுத்த’ என்று மாற்றவில்லை.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: அவனுடைய கண்களை
  rationale: மூலத்தில் உள்ள உடல்சார்ந்த குறிப்பையும் தன்மைச் சுட்டையும் நேரடியாகப் பேணுகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக ஏந்துவதால் ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ஓய்வுநாளில் இயேசு குணமாக்கியதன் பொருள்
  choice: நிகழ்வு ஓய்வுநாளில் நடந்தது என்ற காலக் குறிப்பை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: ஓய்வுநாள் சட்டம் மீறப்பட்டதா அல்லது நிறைவேற்றப்பட்டதா என விளக்கத்தைச் சேர்த்தல்
  rationale: இந்த வசனம் அடுத்துவரும் விவாதத்திற்கான நிகழ்வுப் பின்னணியை மட்டுமே அளிக்கிறது; அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பே முன்கூட்டியே தீர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இயேசுவைக் குறிக்கும் வினைமுற்று தமிழின் மரியாதை வழக்கிற்கு ஏற்றவாறு புரிந்துகொள்ளப்படும் பெயரெச்ச வடிவில் அமைந்துள்ளது; குணமாக்குதல் என விளக்கிப் பொருளை விரிவாக்காமல் மூலத்தின் ‘கண்களைத் திறத்தல்’ என்ற சொற்றொடர் நிலைநிறுத்தப்பட்டுள்ளது.
