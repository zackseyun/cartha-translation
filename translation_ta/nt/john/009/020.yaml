  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: ta
  text: அதற்கு, அவனுடைய பெற்றோர் பதிலளித்து, “இவன் எங்கள் மகன் என்பதும், இவன் பார்வையற்றவனாகப் பிறந்தான் என்பதும் எங்களுக்குத் தெரியும்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவன் பிறவியிலிருந்தே பார்வையற்றவனாக இருந்தான்.”
    reason: ‘பார்வையற்றவனாகப் பிறந்தான்’ என்பதற்கான இயல்பான மாற்றுச் சொல்லாக்கம்; ஆங்கில POB ஆய்வுக் குறிப்புடன் ஒத்திசைகிறது.
lexical_decisions:
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய விசாரணையிலிருந்து தொடரும் காரணவியல் மற்றும் கதைநகர்வை இயல்பான தமிழில் குறிக்கிறது.
- source_word: γονεῖς
  choice: பெற்றோர்
  rationale: தந்தை, தாய் இருவரையும் கூட்டாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: மறுமொழியாக ... என்றார்கள்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து கூறினர்’ என்ற இரட்டை வினை வடிவத்தின் பதிலுரைக் கூறைத் தக்கவைத்தபடி, தமிழில் தேவையற்ற மறுகூறலைத் தவிர்க்கிறது.
- source_word: Οἴδαμεν
  choice: எங்களுக்குத் தெரியும்
  rationale: பெற்றோர் உறுதியாக அறிந்திருப்பதை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: இவன் எங்கள் மகன்
  rationale: அடையாளப்படுத்தும் demonstrative வலிமையை ‘இவன்’ மூலம் தக்கவைத்து, இயல்பான தமிழாக்கமாக அமைகிறது.
- source_word: τυφλὸς ἐγεννήθη
  choice: பிறவியிலேயே பார்வையற்றவனாக இருந்தான்
  rationale: பிறந்த காலத்திலிருந்தே இருந்த நிலையை நவீன, மரியாதையான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘குருடன்’ என்பதைக் காட்டிலும் ‘பார்வையற்றவன்’ தற்போதைய பொதுப் பயன்பாட்டில் கண்ணியமானது.
