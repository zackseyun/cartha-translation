base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: ta
  text: சிலர், “இவர்தான் அவர்” என்று சொல்லிக்கொண்டிருந்தார்கள். மற்றவர்கள், “இல்லை; மாறாக, இவர் அவரைப் போல இருக்கிறார்” என்று சொல்லிக்கொண்டிருந்தார்கள். அவரோ, “நான்தான் அவர்[a]” என்று தொடர்ந்து சொல்லிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொற்சார்ந்தபடி, “நான் இருக்கிறேன்.” இங்கே அவர், பேசப்படுகிற நபர் அவரே என்று அடையாளப்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: சிலர் … வேறு சிலரோ
  rationale: கூட்டத்தில் மாறுபட்ட கருத்துகளைக் கொண்ட இரு தரப்பினரை இயல்பான தமிழில் தெளிவாக வேறுபடுத்துகிறது.
- source_word: ἔλεγον … ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் உரையாடல் தொடர்ந்து நடந்த காட்சியைச் சுட்டுவதால், தொடர்நிலையைத் தமிழ் இயல்பில் வெளிப்படுத்துகிறது.
- source_word: Οὗτός ἐστιν
  choice: இவர்தான் அவர்
  rationale: சுட்டிக்காட்டி அடையாளம் காணும் கிரேக்கக் கூற்றின் சுருக்கத்தையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: Οὐχί, ἀλλὰ
  choice: இல்லை, ஆனால்
  rationale: வலியுறுத்திய மறுப்பையும் அதைத் தொடர்ந்து வரும் முரண்பாட்டையும் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: இவர் அவரைப் போல இருக்கிறார்
  rationale: அடையாள ஒற்றுமையல்ல, தோற்ற ஒற்றுமையே கூறப்படுகிறது என்பதைத் தெளிவாகக் காக்கிறது.
- source_word: ἐκεῖνος ἔλεγεν
  choice: அவரோ … தொடர்ந்து சொல்லிக்கொண்டிருந்தார்
  rationale: விவாதிக்கப்படும் மனிதனை எதிர்மறைத் தொடுப்புடன் சுட்டி, முற்றுப்பெறாத வினையின் மீளுரைத்தல் அல்லது விடாப்பிடியான உறுதிப்படுத்தலை வெளிப்படுத்துகிறது.
- source_word: Ἐγώ εἰμι
  choice: நான்தான் அவர்
  rationale: இச்சூழலில் அந்த மனிதர் தாமே பேசப்படுகிற நபர் என்று அடையாளப்படுத்துகிறார். தமிழில் இயல்பான பொருளைத் தருகிறது; அதேவேளை சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யோவான் நூலில் Ἐγώ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: நான்தான் அவர்
  alternative: நான் இருக்கிறேன் / நானே
  rationale: உடனடிச் சூழல் குணமடைந்த மனிதரின் அடையாளத்தைப் பற்றிய விவாதமாகும்; இது கிறிஸ்துவைப் பற்றிய உரிமைக்கோரல் அல்ல. ஆகவே சாதாரண சுயஅடையாளப்படுத்தலே முதன்மை உரையில் தரப்படுகிறது; கிரேக்கத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. ‘இவர்/அவர்’ வடிவங்கள் காட்சியிலுள்ள சுட்டுதலையும் மரியாதையான இயல்பையும் காக்கின்றன; முற்றுப்பெறாத வினைகள் தொடர்ச்சியான கூட்ட விவாதத்தையும் மனிதரின் மீள்மீள் உறுதிப்படுத்தலையும் வெளிப்படுத்துகின்றன.
