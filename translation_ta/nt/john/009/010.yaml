  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: ta
  text: எனவே அவர்கள் அவனிடம், “உன் கண்கள் எப்படித் திறக்கப்பட்டன?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: என்று கேட்டார்கள்
  rationale: இது இறந்தகாலத் தொடர்நிலை வினை. உரையாடலில் நேரடிக் கேள்வி வருவதால், தமிழில் ‘என்று கேட்டார்கள்’ என்பது இயல்பானது. தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கக்கூடிய கிரேக்க வடிவத்தைச் சூழல் வெளிப்படுத்துகிறது; ‘கேட்டுக்கொண்டிருந்தார்கள்’ என்பது இங்கு தேவையற்ற வலியுறுத்தலாக இருக்கும்.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்விலிருந்து எழும் தொடர்ச்சியையும் விளைவையும் காட்டும் இணைப்புச் சொல்; ‘எனவே’ அதன் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Πῶς
  choice: எப்படி
  rationale: நிகழ்ந்த முறையைப் பற்றிய நேரடியான கேள்வியை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἠνεῴχθησάν
  choice: திறக்கப்பட்டன
  rationale: இது இறந்தகாலச் செயப்பாட்டு வடிவம். செயலைச் செய்தவர் யார் என்பதை வசனம் கூறாமல் விடும் கிரேக்கத்தின் செயப்பாட்டுத் தன்மையைத் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: σου οἱ ὀφθαλμοί
  choice: உன் கண்கள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமையையும் ‘கண்கள்’ என்ற பெயர்ச்சொல்லையும் இயல்பான தமிழ் வரிசையில் தருகிறது.
theological_decisions:
- issue: கண்களைத் திறந்த செயலைச் செய்தவர்
  choice: ‘திறக்கப்பட்டன’ என்ற செயப்பாட்டு வடிவத்தில் செய்பவர் குறிப்பிடப்படவில்லை.
  alternative: ‘யார் உன் கண்களைத் திறந்தார்?’ அல்லது ‘உன் கண்களை அவர் எப்படித் திறந்தார்?’
  rationale: கிரேக்க மூலமும் இவ்வசனத்தில் செய்பவரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே மறைமுகமாக இறையியல் முடிவொன்றைச் சேர்க்காமல் அந்தத் தெளிவின்மையைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடையில் அமைந்துள்ளது. நேரடிக் கேள்வியில் கிரேக்கச் செயப்பாட்டு வடிவம் பாதுகாக்கப்பட்டுள்ளது.
