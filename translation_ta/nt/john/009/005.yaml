  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: ta
  text: நான் உலகத்தில் இருக்கும் வரை, நானே உலகத்தின் ஒளி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν ἐν τῷ κόσμῳ ὦ
  choice: நான் உலகத்தில் இருக்கும் வரை
  rationale: ὅταν உடன் நிகழ்கால subjunctive இங்கு இயேசு உலகத்தில் இருக்கும் காலப்பகுதியைக் குறிக்கிறது. சூழலில் இயல்பான தமிழுக்காக ‘இருக்கும் வரை’ என மொழிபெயர்க்கப்பட்டது; ‘எப்போதெல்லாம்’ என்ற சொற்சார்ந்த வடிவம் இங்கு தேவையற்ற மறுமுறைப் பொருளைத் தரக்கூடும்.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: நானே உலகத்தின் ஒளி
  rationale: ‘உலகத்தின் ஒளி’ என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது. வினைமுற்றில் உள்ள முதலாம் நபர் வலியுறுத்தலை இயல்பான தமிழில் ‘நானே’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு ‘உலகத்தின் ஒளி’யாக இருப்பதற்கான கால வரம்பு
  choice: நான் உலகத்தில் இருக்கும் வரை
  alternative: நான் உலகத்தில் இருக்கும்போதெல்லாம்
  rationale: ὅταν இலக்கண ரீதியாக ‘எப்போதெல்லாம்/எப்போது’ என்ற நுணுக்கத்தைக் கொள்ள முடிந்தாலும், இச்சூழலில் பூமியிலுள்ள அவருடைய பணிக்காலத்தைச் சுட்டும் ‘இருக்கும் வரை’ என்பதே இயல்பானதும் பொருத்தமானதும். இது அவருடைய அடையாளத்தைப் பற்றிய விரிவான இறையியல் முடிவைச் சேர்க்காமல், இவ்வசனத்தின் காலச்சார்ந்த கூற்றைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான நடை. மூலத்தின் உருவகமும் இரு பகுதிகளின் சமநிலையும் காக்கப்பட்டுள்ளன.
