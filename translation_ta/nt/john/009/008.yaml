source:
  edition: SBLGNT
  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: ta
  text: ஆகவே, அக்கம் பக்கத்தினரும், முன்பு அவரைப் பிச்சைக்காரராகக் கண்டவர்களும், “உட்கார்ந்து பிச்சை கேட்டுவந்தவர்[a] இவர் அல்லவா?” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “உட்கார்ந்தும் பிச்சை கேட்டும் இருந்தவர் இவர் அல்லவா?” கிரேக்கத்தில், அவரை முன்பு வழக்கமாகச் செய்த செயல்களால் அடையாளப்படுத்தும் வகையில், ‘உட்கார்ந்திருப்பவர்’, ‘பிச்சை கேட்பவர்’ என்னும் பங்கேற்புச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக அடுத்த காட்சியைத் தொடரும் கதை இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: γείτονες
  choice: அக்கம் பக்கத்தினர்
  rationale: அவருக்கு அருகில் வாழ்ந்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: முன்பு அவரைப் ... பார்த்துவந்தவர்கள்
  rationale: முன்னர் அவரை வழக்கமாகக் கண்டுவந்ததால் அடையாளம் அறிந்தவர்களைக் குறிக்கும் பங்கேற்புவினையின் தொடர்ச்சியான நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ὅτι προσαίτης ἦν
  choice: பிச்சைக்காரராக
  rationale: ὅτι இங்கே காரணத்தைத் திட்டவட்டமாக நிர்ணயிப்பதைவிட, அவர்கள் அவரை முன்பு எந்த நிலையில் அறிந்திருந்தார்கள் என்பதைக் காட்டுவதாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔλεγον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் நீடித்த அல்லது பலரிடையே நிகழ்ந்த உரையாடல் நுணுக்கத்தைப் பாதுகாக்கிறது; கூறியது கேள்வி என்பதால் தமிழில் 'கேட்டுக்கொண்டிருந்தார்கள்' இயல்பானது.
- source_word: Οὐχ οὗτός ἐστιν
  choice: இவர் அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறைக் கேள்வியின் வடிவத்தையும் தொனியையும் காக்கிறது.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: உட்கார்ந்து பிச்சை கேட்டுக்கொண்டிருந்தவர்
  rationale: அவரை அடையாளப்படுத்திய முந்தைய வழக்கமான செயல்களை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கப் பங்கேற்புவினைகளின் வடிவத்துக்கும் நெருக்கமாக உள்ளது.
