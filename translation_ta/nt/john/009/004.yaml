source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: ta
  text: பகல் இருக்கும் வரை, என்னை அனுப்பியவரின் செயல்களை நாம் செய்ய வேண்டும்; யாராலும் வேலை செய்ய முடியாத இரவு வருகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “என்னை அனுப்பியவரின் செயல்களை நான் செய்ய வேண்டும்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: நாம்
  rationale: SBLGNT-இன் முதலாம் நபர் பன்மை வடிவத்தைப் பின்பற்றி, δεῖ உடன் இயல்பான தமிழில் ‘நாம் ... வேண்டும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவை அல்லது கட்டாயத்தின் வலிமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: செயல்களை ... செய்ய
  rationale: ஒரே வேர்ச்சொல்லின் மீளுரையைச் சொற்சொல்லாகக் கொண்டுவராமல், பொருளையும் யோவான் நற்செய்தியில் உள்ள ‘செயல்கள்’ என்ற தொடர்பையும் காக்கிறது.
- source_word: τοῦ πέμψαντός με
  choice: என்னை அனுப்பியவருடைய
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பங்கேற்புவினை வடிவத்தைத் தெளிவாக மொழிபெயர்க்கிறது; அனுப்பியவர் யார் என்பதை உரையில் கூடுதலாக விளக்கவில்லை.
- source_word: ἕως ἡμέρα ἐστίν
  choice: பகலாக இருக்கும்வரை
  rationale: வரவிருக்கும் இரவுடன் உள்ள கால எதிர்மறையைப் பாதுகாத்து, செயலாற்றக் கிடைக்கும் காலத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἔρχεται νὺξ
  choice: இரவு வருகிறது
  rationale: நிகழ்கால வடிவத்தின் நெருங்கிவரும் கால உணர்வைப் பாதுகாக்கிறது.
- source_word: οὐδεὶς δύναται ἐργάζεσθαι
  choice: ஒருவரும் செயல்பட முடியாத
  rationale: பாலினம் சுட்டாத οὐδεὶς என்பதையும், பொதுவான செயலாற்றும் திறனைக் குறிக்கும் வினையையும் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: வசனத்தின் தொடக்கத்தில் உள்ள ἡμᾶς (‘நாம்’) / ἐμέ (‘நான்’) என்ற பாடவேறுபாடு
  choice: என்னை அனுப்பியவருடைய செயல்களை நாம் செய்ய வேண்டும்
  alternative: என்னை அனுப்பியவருடைய செயல்களை நான் செய்ய வேண்டும்
  rationale: கொடுக்கப்பட்ட SBLGNT மூலப்பாடம் ἡμᾶς என்று வாசிப்பதால் முதன்மை உரையில் ‘நாம்’ பயன்படுத்தப்பட்டுள்ளது. பரவலாகக் காணப்படும் ஒருமைப் பாடம் வெளிப்படைத்தன்மைக்காக அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘கிரியைகள்’ போன்ற பழைய அல்லது சமயச் சிறப்புச் சொற்களுக்கு மாற்றாக ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது; முதல் மற்றும் இரண்டாம் ἐργάζεσθαι இடையிலான பயன்பாட்டு வேறுபாடு முறையே ‘செய்ய’ மற்றும் ‘செயல்பட’ எனத் தெரிவிக்கப்பட்டுள்ளது.
