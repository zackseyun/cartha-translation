id: JHN.9.22
reference: John 9:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: ta
  text: அவனுடைய பெற்றோர் யூதர்களுக்குப்[a] பயந்ததால் இவற்றைச் சொன்னார்கள். ஏனெனில், யாராவது அவனை மேசியா[b] என்று அறிக்கையிட்டால், அவன் தொழுகைக்கூடத்திலிருந்து விலக்கப்படுவான் என்று யூதர்கள் ஏற்கெனவே உடன்பட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “யூதர்கள்.” இச்சூழலில் எல்லா யூத மக்களையும் பொதுவாகக் குறிப்பிடாமல், தொழுகைக்கூடத்திலிருந்து வெளியேற்றும் அதிகாரம் கொண்ட யூதத் தலைவர்களையே இது குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “கிறிஸ்து” என்றும் “அவரே கிறிஸ்து என்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: இவற்றைச் சொன்னார்கள்
  rationale: ταῦτα என்பதன் பன்மையையும், முந்தைய கூற்றுகளை அது சுட்டுவதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: அவனுடைய பெற்றோர்
  rationale: γονεῖς என்பதற்கு இயல்பான நவீனத் தமிழ் இணை; αὐτοῦ என்பதையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: ἐφοβοῦντο
  choice: பயந்ததால்
  rationale: நீடித்திருந்த அச்சத்தையும், ὅτι அறிமுகப்படுத்தும் காரணத் தொடர்பையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்க மூலத்தின் பொதுவான சொல்லை முதன்மை உரையில் காக்கிறது; இச்சூழலில் அதிகாரம் செலுத்திய யூதத் தலைவர்களே குறிக்கப்படலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἤδη ... συνετέθειντο
  choice: ஏற்கெனவே முடிவுசெய்திருந்தார்கள்
  rationale: முன்பே எட்டப்பட்ட கூட்டு உடன்பாடு அல்லது தீர்மானத்தை pluperfect வடிவுக்கு ஏற்ற தமிழில் தெரிவிக்கிறது.
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ
  choice: யாராவது அவனை ... என்று அறிக்கையிட்டால்
  rationale: பொதுவெளியில் ஏற்றுக்கொள்வது அல்லது ஒப்புக்கொள்வது என்ற ὁμολογέω சொல்லின் வலிமையையும் நிபந்தனையையும் காக்கிறது.
- source_word: χριστόν
  choice: மேசியா
  rationale: இங்கு Χριστός ஒரு பெயராக அல்ல, அபிஷேகம் பெற்ற மீட்பரைக் குறிக்கும் பட்டமாகப் பயன்படுகிறது.
- source_word: ἀποσυνάγωγος γένηται
  choice: யூதர்களின் தொழுகைக்கூடத்திலிருந்து வெளியேற்றப்பட வேண்டும்
  rationale: சினகோகின் சமூக மற்றும் சமயக் கூட்டுறவிலிருந்து நீக்கப்படுவதை சாதாரண வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து / கிறிஸ்துவாக
  rationale: இச்சூழலில் இது இயேசுவைப் பற்றிய மேசியானியப் பட்டத்தை அறிக்கையிடுவதைக் குறிக்கிறது; அதனால் யூதப் பின்னணியைத் தெளிவாகக் காக்கும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: οἱ Ἰουδαῖοι என்பதன் குறிப்பிடம்
  choice: முதன்மை உரையில் ‘யூதர்கள்’; அடிக்குறிப்பில் சூழல்சார் விளக்கம்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூலத்தின் சொல்வடிவத்தையும் அதன் உண்மையான குறிப்பிடத் தெளிவின்மையையும் காக்கிறது; அதேவேளை எல்லா யூத மக்களையும் வேறுபாடின்றிக் குறிக்கிறது என்ற தவறான புரிதலை அடிக்குறிப்பு தவிர்க்கிறது.
- issue: ἀποσυνάγωγος என்பதன் தண்டனைத் தன்மை
  choice: தொழுகைக்கூடத்திலிருந்து வெளியேற்றப்படுதல்
  alternative: சினகோகிலிருந்து விலக்கப்படுதல்
  rationale: ஒரு குறிப்பிட்ட பிற்கால ஒழுங்குமுறைத் தண்டனையை உரைக்குள் இறக்குமதி செய்யாமல், உரை கூறும் வெளியேற்றத்தை மட்டும் இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டது. ‘சினகோகு’ என்ற ஒலிபெயர்ப்புக்குப் பதிலாக ‘யூதர்களின் தொழுகைக்கூடம்’ என்று கூறி அமைப்பின் தன்மையைத் தெளிவாக்கியுள்ளோம்; வாக்கிய ஓட்டத்திற்காக காரணம் முதலில் தரப்பட்டாலும், மூலத்தின் காரணத் தொடர்பும் முன்தீர்மானத்தின் காலநிலையும் காக்கப்பட்டுள்ளன.
