source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: ta
  text: ஆகவே அவர்கள் பார்வையற்ற அந்த மனிதனிடம் மீண்டும், “அவர் உன் கண்களைத் திறந்ததால், அவரைப் பற்றி நீ என்ன சொல்கிறாய்?” என்று கேட்டார்கள். அதற்கு அவன், “அவர் ஒரு தீர்க்கதரிசி[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தீர்க்கதரிசி.” கிரேக்கச் சொற்றொடரைப் பட்டப்பெயர் போன்ற வலிமையுடனும் புரிந்துகொள்ளலாம்; ஆனால் “ஒரு தீர்க்கதரிசி” என்ற பொருளும் சூழலுக்கு ஏற்றது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் காரணத் தொடர்பையும் கதைத் தொடர்ச்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: τῷ τυφλῷ
  choice: பார்வையற்ற அந்த மனிதனிடம்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் கிரேக்கப் பெயரடையை மரியாதையான, இன்றைய தமிழில் தருகிறது; இந்தக் கூறில் வெளிப்படையாக இல்லாத ‘முன்பு பார்வையற்றிருந்த’ என்ற காலநிலையைச் சேர்க்கவில்லை.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: விசாரணையில் கேள்வி மறுபடியும் கேட்கப்படுவதை நேரடியாகப் பாதுகாக்கிறது.
- source_word: Τί σὺ λέγεις
  choice: நீ என்ன சொல்கிறாய்
  rationale: தமிழில் எழுவாயை விடக்கூடியிருந்தும் ‘நீ’ என்று வெளிப்படையாகச் சொல்வதால் σὺ தரும் வலியுறுத்தல் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றி
  rationale: περί + மரபுவேற்றுமையின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὅτι
  choice: திறந்ததால்
  rationale: கேள்விக்கான காரணம் அல்லது அடிப்படையை அறிமுகப்படுத்தும் ὅτι என்பதன் இங்குள்ள காரணப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: அவர் உன் கண்களைத் திறந்தார்
  rationale: இறந்தகாலச் செயலை எளிமையாகவும் மூலத்தின் உருவகத்தை மாற்றாமலும் தருகிறது.
- source_word: Προφήτης
  choice: ஒரு தீர்க்கதரிசி
  rationale: இயேசுவைப் பற்றிய அந்த மனிதனின் இந்நிலைக் கருத்தை ஒரு தீர்க்கதரிசி என்ற வகைப்பாடாகத் தருகிறது; அதேவேளை சாத்தியமான பட்டப்பெயர் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: Προφήτης என்பதை பொதுப்பெயராகவா, பட்டப்பெயர் போன்ற வலிமையுடனா மொழிபெயர்ப்பது
  choice: ஒரு தீர்க்கதரிசி
  alternative: தீர்க்கதரிசி
  rationale: சூழலில் அந்த மனிதன் இயேசுவைப் பற்றிய தனது வளர்ந்து வரும் புரிதலைத் தெரிவிக்கிறான். கிரேக்கத்தில் சுட்டுச்சொல் இல்லாத பயனிலைப் பெயர்ச்சொல் வகை அல்லது பண்புப் பொருளைக் கொண்டிருக்கலாம்; குறிப்பிட்ட மெசியப் பட்டத்தை உரை கட்டாயப்படுத்தவில்லை. எனினும் பட்டப்பெயர் போன்ற வாசிப்பின் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பார்வையற்ற அந்த மனிதன்’ என்பது இன்றைய மரியாதையான பயன்பாடு; வெளிப்படையான ‘நீ’ கிரேக்க வலியுறுத்தலை இயல்பாகக் காக்கிறது.
