  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “அந்த மனிதர் எங்கே இருக்கிறார்?” என்று கேட்டார்கள். அவர், “எனக்குத் தெரியாது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπαν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்று கேட்டார்கள்
  rationale: καί முன்னைய நிகழ்வுடன் எளிய தொடர்பை ஏற்படுத்துகிறது; தமிழில் தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்க்காமல் வாக்கியத் தொடரால் அந்த இணைப்பு இயல்பாக வெளிப்படுகிறது. εἶπαν என்பதன் அடிப்படைப் பொருள் ‘சொன்னார்கள்’ என்றாலும், நேரடிப் பேச்சு கேள்வியாக இருப்பதால் நவீன தமிழில் ‘கேட்டார்கள்’ இயல்பான சமச்சீரான மொழிபெயர்ப்பு.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: அவர் எங்கே?
  rationale: ποῦ இடத்தைக் கேட்கிறது. ἐκεῖνος சுட்டுப்பெயராக இயேசுவைக் குறிக்கிறது; இச்சூழலில் ‘அவர்’ என்பது மரியாதையுடனும் இயல்பாகவும் உள்ளது. ‘அந்த மனிதர்’ என்பது கிரேக்கச் சுட்டுத்தன்மையை வெளிப்படுத்தினாலும் தமிழில் தேவையற்ற தொலைவு அல்லது இழிவுத் தொனியை உண்டாக்கக்கூடும்.
- source_word: λέγει
  choice: அதற்கு அவர் … என்றார்
  rationale: யோவான் நற்செய்தியில் வரும் வரலாற்று நிகழ்காலத்தைத் தமிழ்க் கதைநடையின் இயல்புக்கேற்ப இறந்தகாலமாக வழங்குகிறது. ‘அதற்கு’ என்பது பதிலின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: Οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: οἶδα என்பதன் இச்சூழலிலான பொருளை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கும் வழக்கு.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுட்டுப்பெயரான ἐκεῖνος தமிழில் இயல்பான மரியாதைப் பெயரான ‘அவர்’ என வழங்கப்பட்டுள்ளது; தனி அடிக்குறிப்பு அவசியமில்லை.
