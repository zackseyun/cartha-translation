  to: அவர்கள் அவரிடம், “அந்த மனிதர் எங்கே இருக்கிறார்?” என்று கேட்டார்கள். அவர், “எனக்குத் தெரியாது” என்றார்.
  rationale: The revision only restores the demonstrative sense of ἐκεῖνος as “அந்த மனிதர்.” The question form naturally warrants “என்று கேட்டார்கள்” in Tamil, and the narrative past tense remains natural Tamil treatment of the Greek historical present.
