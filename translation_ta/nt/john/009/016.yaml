  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: ta
  text: ஆகவே, பரிசேயர்களில் சிலர், “இந்த மனிதர் கடவுளிடமிருந்து வந்தவர் அல்ல; ஏனெனில் இவர் ஓய்வுநாளைக் கடைப்பிடிப்பதில்லை” என்று சொல்லிக்கொண்டிருந்தார்கள். ஆனால் மற்றவர்கள், “பாவமுள்ள ஒரு மனிதனால் இப்படிப்பட்ட அடையாளங்களை எப்படிச் செய்ய முடியும்?”[a] என்று சொல்லிக்கொண்டிருந்தார்கள். அவர்களிடையே பிளவு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவமுள்ள ஒரு மனிதன்’ என்பது கிரேக்கத்தில் ‘மனிதன்’ என்ற பெயர்ச்சொல்லை விளக்கும் பெயரடையாக உள்ளது; ‘ஒரு பாவி’ என்றும் பொருள் கொள்ளலாம். ‘அடையாளங்கள்’ என்பதற்கு ‘அற்புத அடையாளங்கள்’ என்றும் மொழிபெயர்க்கலாம்; யோவான் இச்சொல்லை இயேசுவின் செயல்கள் வெளிப்படுத்தும் ஆழ்ந்த பொருளைச் சுட்டப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: சிலர் ... சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வினையான ἔλεγον, அந்தக் காட்சியில் தொடர்ந்து அல்லது திரும்பத் திரும்பக் கூறப்பட்டதைச் சுட்டுகிறது; ‘சொல்லிக்கொண்டிருந்தார்கள்’ அந்த வினைநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் விளைவு அல்லது கருத்துத் தொடர்பை οὖν குறிக்கிறது; ‘ஆகவே’ அதன் இணைப்பாற்றலைத் தக்கவைக்கிறது.
- source_word: ἐκ τῶν Φαρισαίων
  choice: பரிசேயர்களில் சிலர்
  rationale: பரிசேயர் குழுவிலிருந்து ஒரு பகுதியினரை இச்சொற்றொடர் அடையாளப்படுத்துகிறது; தமிழில் இவ்வமைப்பு இயல்பானது.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: இந்த மனிதர்
  rationale: குறிப்பிட்ட ஆண் நபரைச் சுட்டும் கிரேக்கச் சொற்றொடரின் நேரடியான பொருளை மரியாதையான நவீன தமிழில் தருகிறது; இழிவான தொனியை கூடுதலாகச் சேர்க்கவில்லை.
- source_word: παρὰ θεοῦ
  choice: கடவுளிடமிருந்து வந்தவர்
  rationale: παρά + பிறப்புவேற்றுமை தோற்றுவாய் அல்லது மூலம் என்ற பொருளைக் கொண்டது. தமிழில் முழுமையான பயனிலையாக அமைய ‘வந்தவர்’ தேவைப்படுகிறது; ‘அனுப்பப்பட்டவர்’ என விரிவாக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τὸ σάββατον οὐ τηρεῖ
  choice: ஓய்வுநாளைக் கடைப்பிடிப்பதில்லை
  rationale: τηρεῖ இங்கு ஓய்வுநாள் விதியை அனுசரிப்பதைக் குறிக்கிறது; ‘கடைப்பிடி’ நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: ἁμαρτωλὸς ἄνθρωπος
  choice: பாவமுள்ள ஒரு மனிதன்
  rationale: ἁμαρτωλός என்பது ἄνθρωπος என்பதைக் குறிக்கும் பெயரடை. ஆகவே ‘பாவி’ என்று பெயர்ச்சொல்லாக்காமல் கிரேக்க இலக்கண அமைப்பைத் தக்கவைக்கிறது.
- source_word: τοιαῦτα σημεῖα
  choice: இப்படிப்பட்ட அடையாளங்கள்
  rationale: யோவானில் σημεῖα, செயல்களின் அற்புத இயல்பை மட்டுமல்லாமல் அவை சுட்டிக்காட்டும் வெளிப்பாட்டு அர்த்தத்தையும் கொண்டுள்ளது; ‘அடையாளங்கள்’ அந்தச் சிறப்பைத் தக்கவைக்கிறது.
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: அவர்களிடையே பிளவு ஏற்பட்டது
  rationale: σχίσμα கருத்து வேறுபாட்டால் உண்டான பிரிவைக் குறிக்கிறது. ‘பிளவு ஏற்பட்டது’ இயல்பான தமிழில் அந்த உறவியல் முறிவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவானின் σημεῖα என்ற சொல்லை மொழிபெயர்த்தல்
  choice: அடையாளங்கள்
  alternative: அற்புதங்கள் / அற்புத அடையாளங்கள்
  rationale: ‘அடையாளங்கள்’ என்பது செயல்கள் தம்மைத் தாண்டிய உண்மையைச் சுட்டுவதைப் பாதுகாக்கிறது; ‘அற்புதங்கள்’ என்று மட்டும் கூறுவது யோவானின் வெளிப்பாட்டு நுணுக்கத்தைத் தட்டையாக்கும், ‘அற்புத’ என்பதைச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரைக்குள் கொண்டுவரும்.
- issue: இயேசு கடவுளிடமிருந்து வந்தவர் என்ற கூற்று
  choice: கடவுளிடமிருந்து வந்தவர்
  alternative: கடவுளால் அனுப்பப்பட்டவர்
  rationale: இக்கூற்று தெய்வீகத் தோற்றுவாய் அல்லது அதிகாரத்தைப் பற்றியது. ‘அனுப்பப்பட்டவர்’ என்பது யோவானின் வேறு இடங்களில் காணப்படும் அனுப்புதல் மொழியை இங்கு வெளிப்படையாகச் சேர்த்துவிடும்; தேர்ந்த வடிவம் மூலத்தின் பதற்றத்தையும் பரப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடை. உரையாடலில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்,’ ‘அடையாளங்கள்,’ ‘பிளவு’ ஆகிய சொற்கள் வேதாகமச் சூழலின் துல்லியத்தையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகின்றன.
