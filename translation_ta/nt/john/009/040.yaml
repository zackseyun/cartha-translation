language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: ta
  text: அவருடன் இருந்த பரிசேயர்களில் சிலர் இவற்றைக் கேட்டு, அவரிடம், “நாங்களும் குருடர்கள் அல்ல, அல்லவா?”[a] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாங்களுமா குருடர்கள்?” என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: கேட்டு
  rationale: இங்கு இயேசு கூறியவற்றைக் கேட்டதைச் சுட்டுகிறது; கதைநடையில் இயல்பான இறந்தகால வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐκ τῶν Φαρισαίων
  choice: பரிசேயர்களில் சிலர்
  rationale: ἐκ உடன் வரும் பகுதிப்பொருள் எல்லாப் பரிசேயர்களையும் அல்ல, அவர்களில் ஒரு பகுதியினரை மட்டுமே குறிக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முந்தைய வசனத்தில் இயேசு கூறிய பல கருத்துகளைச் சுட்டும் பன்மைச் சொல்லைத் தக்கவைக்கிறது.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: அவருடன் இருந்த
  rationale: இயேசுவுடன் அப்போது இருந்த பரிசேயர்களை அடையாளப்படுத்தும் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: εἶπον αὐτῷ
  choice: அவரிடம் … என்றார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் λέγω என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, தமிழின் இயல்பான நேர்கூற்று அமைப்பைப் பயன்படுத்துகிறது.
- source_word: Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
  choice: நாங்களுமா குருடர்கள்?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வியை அறிமுகப்படுத்துகிறது. ‘நாங்களுமா’ என்பது அவர்களின் நம்பாமையையும் ‘இல்லை’ என்ற பதிலை எதிர்பார்ப்பதையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: முன்னர் குறிப்பிடப்பட்ட குருடர்களுடன் ‘நாங்கள்’ என்பதையும் இணைக்கும் ‘கூட/மேலும்’ என்ற பொருளை விகுதி வழியாகத் தருகிறது.
- source_word: τυφλοί
  choice: குருடர்கள்
  rationale: உருவகப் பொருள் சூழலில் தெளிவாக இருந்தாலும், மூலத்தில் உள்ள அடைமொழியை விளக்கச் சொல் சேர்க்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: τυφλοί என்பதன் உருவகப் பொருளை வெளிப்படையாகச் சொல்வதா
  choice: முதன்மை உரையில் ‘குருடர்கள்’ என்று மட்டும் தரப்பட்டுள்ளது
  alternative: ‘ஆவிக்குரிய பார்வையற்றவர்கள்’ அல்லது ‘ஆன்மீகக் குருடர்கள்’
  rationale: மூல கிரேக்கம் உருவகத்தை விளக்கிச் சொல்லவில்லை. சுருக்கமான சொல்லைத் தக்கவைப்பது யோவான் நற்செய்தியின் இரட்டைப் பொருளையும் நையாண்டித் தன்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நாங்களுமா’ என்ற கேள்வியமைப்பு கிரேக்க μή தரும் எதிர்மறைப் பதில் எதிர்பார்ப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது; உருவகமான ‘குருடர்கள்’ விளக்கமின்றித் தக்கவைக்கப்பட்டுள்ளது.
