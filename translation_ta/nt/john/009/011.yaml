source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: ta
  text: 'அவர் பதிலளித்தார்: “இயேசு என்று அழைக்கப்படும் அந்த மனிதர் சேற்றைக் குழைத்து, அதை என் கண்களின்மேல் பூசி[a], ‘சீலோவாமுக்குப் போய்க் கழுவு’ என்று என்னிடம் சொன்னார். ஆகவே நான் போய்க் கழுவினேன்; பார்வை பெற்றேன்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கண்களில் தடவினார்.” இங்குள்ள கிரேக்க வினைச்சொல் பூசுதல் அல்லது தடவுதல் என்று பொருள்படும்; சில மொழிபெயர்ப்புகள் இதை “அபிஷேகம் செய்தார்” என்றும் மொழிபெயர்க்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பார்க்கத் தொடங்கினேன்.” இச்சூழலில் கிரேக்க வினைச்சொல் குருடாயிருந்த ஒருவர் பார்வை பெறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: அதற்கு அவர் ... என்றார்
  rationale: தமிழ் உரையாடல் நடையில் பதிலை இயல்பாகக் குறிக்கிறது; ἐκεῖνος என்பதைச் சூழலுக்கேற்ற ‘அவர்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: இயேசு என்று அழைக்கப்படும் அந்த மனிதர்
  rationale: பேசுகிறவர் இந்நிலையில் இயேசுவை வெறுமனே ஒரு மனிதராக அடையாளப்படுத்துவதைப் பாதுகாக்கிறது; மேலதிக இறையியல் பட்டத்தைச் சேர்க்கவில்லை.
- source_word: πηλὸν ἐποίησεν
  choice: சேற்றைக் குழைத்து
  rationale: πηλός என்பது சேறு அல்லது களிமண்ணைக் குறிக்கலாம். முந்தைய சூழலில் மண்ணும் உமிழ்நீரும் கலக்கப்படுவதால், இயல்பான தமிழில் செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: அதை என் கண்களின்மேல் பூசி
  rationale: ἐπιχρίω என்பதன் பூசுதல்/தடவுதல் என்ற உடல்சார் செயலைத் தெளிவாக வெளிப்படுத்தி, மூலத்தில் கட்டாயமில்லாத சடங்குசார் பொருளைத் தவிர்க்கிறது.
- source_word: εἶπέν μοι ὅτι
  choice: என்னிடம் சொன்னார்
  rationale: நேரடிக் கட்டளையை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: சீலோவாமுக்குப் போய்க் கழுவு
  rationale: இயக்கத்தையும் கட்டளையையும் சுருக்கமாகப் பாதுகாக்கிறது. மூலத்தில் இவ்வசனத்தில் ‘குளம்’ மீண்டும் கூறப்படாததால் அதைச் சேர்க்கவில்லை.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: ஆகவே நான் போய்க் கழுவினேன்
  rationale: οὖν குறிக்கும் விளைவுத் தொடர்பையும் தொடர்ச்சியான இரு செயல்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀνέβλεψα
  choice: பார்வை பெற்றேன்
  rationale: பிறவிக் குருடனின் குணமடைதல் சூழலில் ‘மேலே பார்த்தேன்’ என்பதல்ல, காணும் திறனைப் பெற்றதையே குறிக்கிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றி பேசுகிறவரின் அடையாளப்படுத்தல்
  choice: இயேசு என்று அழைக்கப்படும் அந்த மனிதர்
  alternative: இயேசு என்ற மனிதர்
  rationale: குணமடைந்தவர் இந்நேரத்தில் இயேசுவைப் பற்றிக் கொண்டுள்ள வரையறுக்கப்பட்ட புரிதலைப் பாதுகாக்கிறது; பிற்கால உயர்ந்த அறிக்கையை இங்கு முன்கூட்டியே புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான உரைநடை. உரையாடலின் எளிமையும் சாட்சியின் நேரடியான தொனியும் காக்கப்பட்டுள்ளன. πηλός என்பதற்கான ‘சேறு/களிமண்’ வேறுபாடு பிரதான உரையில் இயல்பான ‘சேறு’ மூலம் தரப்பட்டுள்ளது; தனிக் குறிப்பைச் சேர்க்காமல் செயல்வடிவமான ‘குழைத்து’ மூலம் உடனடிச் சூழல் வெளிப்படுத்தப்பட்டுள்ளது.
