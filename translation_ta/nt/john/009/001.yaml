id: JHN.9.1
reference: John 9:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: ta
  text: மேலும், அவர் கடந்து சென்றுகொண்டிருந்தபோது,[a] பிறவியிலிருந்தே பார்வையற்ற ஒரு மனிதரைக் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடந்து செல்லும்போது”; இயேசு கடந்து சென்றுகொண்டிருந்தபோதே அந்த மனிதரைக் கண்டார் என்பதை கிரேக்க வினையெச்சம் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: அப்போது
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து புதிய காட்சியை இயல்பாக அறிமுகப்படுத்தும் இணைப்பாக இங்கு மொழிபெயர்க்கப்பட்டுள்ளது; கிரேக்கத்தின் எளிய தொடர் இணைப்பைத் தமிழில் சொற்சொல்லாகக் காட்டாமல் அதன் கதையோட்டச் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: παράγων
  choice: வழியே போய்க்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த பின்னணிச் செயலைக் காட்டும் நிகழ்கால வினையெச்சத்தின் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் இறந்தகால வினையை நேரடியாகவும் கூடுதல் விளக்கமின்றியும் மொழிபெயர்க்கிறது.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதரை
  rationale: ἄνθρωπος இங்கு கதையில் வரும் ஒரு குறிப்பிட்ட நபரைக் குறிக்கிறது. தமிழில் மரியாதையுடனும் இயல்பாகவும் ‘மனிதர்’ பயன்படுத்தப்பட்டுள்ளது; பாலினத்தைத் தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: τυφλὸν
  choice: பார்வையற்றிருந்த
  rationale: குருடு என்ற நிலையை நவீன, மரியாதையான தமிழில் தெளிவாகச் சொல்கிறது; இது மனிதரை அந்த இயல்பால் மட்டும் அடையாளப்படுத்தாமல் அவரது நிலையைக் குறிப்பிடுகிறது.
- source_word: ἐκ γενετῆς
  choice: பிறவியிலிருந்தே
  rationale: பிறந்த காலமுதல் அந்த நிலை இருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: ἄνθρωπον என்பதன் பாலின வெளிப்பாடு
  choice: ஒரு மனிதரை
  alternative: ஒரு ஆணை
  rationale: ἄνθρωπος தனியாக ஆண்பாலைக் கட்டாயப்படுத்தாது; பின்னுள்ள சூழல் அந்த நபரை ஆணாகக் காட்டினாலும், இவ்வசனத்தின் சொல் ‘மனிதர்/நபர்’ என்ற பொதுப் பொருளைத் தாங்குகிறது. ஆகவே மூலத்தின் சொற்பொருள் அகலத்தைப் பாதுகாக்க ‘மனிதர்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான கதையுரை. பார்வைக் குறைபாட்டைச் சுட்டுவதற்கு மரியாதையான நபர்-மையச் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
