id: JHN.9.36
reference: John 9:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: ta
  text: 'அவன் பதிலளித்துச் சொன்னான்: “ஆண்டவரே[a], நான் அவர்மேல் விசுவாசம் வைக்கும்படி, அவர் யார்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் κύριε மரியாதையான அழைப்பாகவும் “ஆண்டவரே” என்ற பொருளிலும் வரலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: அவன் மறுமொழியாக ... என்றான்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து கூறினான்’ என்ற வழக்கமான இரட்டைச் சொல்லாக்கத்தை, பொருளைக் காத்து இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: Καὶ τίς ἐστιν
  choice: அவர் யார்?
  rationale: தொடக்க καί இங்கு உரையாடலின் தொடர்ச்சியையும் வினாவின் உடனடித் தன்மையையும் குறிக்கிறது; தமிழில் தனியே ‘மேலும்’ எனச் சேர்ப்பது செயற்கையாக இருப்பதால் இயல்பான நேரடி வினாவாக வழங்கப்பட்டுள்ளது. மரியாதை ஒருமை சூழலுக்கு ஏற்றது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பதற்கான வழக்கமான இறையியல் மொழிபெயர்ப்பைத் தக்கவைக்கிறது; இச்சூழலில் அது மரியாதை அழைப்பான ‘ஐயா’ என்றும் பொருள்படக்கூடும் என்பதால் அந்த உண்மையான இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: நான் அவர்மேல் நம்பிக்கை வைக்கவேண்டும்
  rationale: ἵνα உடன் வரும் இறந்தகாலத் துணைவினையின் நோக்கப் பொருளையும், πιστεύω εἰς என்பதன் ஒருவர்மேல் நம்பிக்கை வைக்கும் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: குணமடைந்த மனிதன் அடுத்த வசனத்தில் வெளிப்படையாக அறிக்கையிடுவதற்கு முன் κύριε என்பதை எவ்வாறு வழங்குவது
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: κύριε என்பது ‘ஆண்டவரே’ என்றும் மரியாதை அழைப்பாக ‘ஐயா’ என்றும் பொருள்படலாம். கதைச்சூழல் அவனுடைய புரிதலின் அளவை இங்கே தீர்மானமாகச் சொல்லாததால், முதன்மை உரையில் வழக்கமான மொழிபெயர்ப்பும் அடிக்குறிப்பில் மாற்றுப் பொருளும் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். உரையாடல் இயல்புக்காக கிரேக்க இரட்டைச் சொல்லாக்கம் சுருக்கப்பட்டுள்ளது; κύριε என்பதிலுள்ள சூழல்சார் இறையியல் இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
