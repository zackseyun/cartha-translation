  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: ta
  text: இவர் கடவுளிடமிருந்து வந்தவராக இல்லையென்றால்,[a] இவரால் எதையும் செய்ய முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இவர் கடவுளிடமிருந்து வந்தவர் இல்லையென்றால்.’
    reason: εἰ μὴ-இன் நிபந்தனை அமைப்பைத் தமிழில் சற்றே சுருக்கமாக வெளிப்படுத்தும் மாற்று வாசகம்.
lexical_decisions:
- source_word: εἰ μὴ
  choice: இல்லையென்றால்
  rationale: இறந்தகால எதிர்நிலை நிபந்தனையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது; ‘அல்லாமல்’ என்பதும் சாத்தியம்.
- source_word: ἦν
  choice: வந்தவர்
  rationale: παρὰ θεοῦ என்பதுடன் சேர்ந்து மூலத்தையோ தோற்றுவாயையோ குறிக்கிறது. தமிழில் ‘கடவுளிடமிருந்து வந்தவர்’ என்பது இயல்பானது; ‘அனுப்பப்பட்டவர்’ என்று விரிவுபடுத்தவில்லை.
- source_word: οὗτος
  choice: இவர்
  rationale: சூழலில் ஏற்கெனவே பேசப்பட்ட இயேசுவை மரியாதையான, இயல்பான தனிநபர் சுட்டுப்பெயரால் குறிக்கிறது.
- source_word: παρὰ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: παρά + genitive குறிக்கும் மூலம்/தோற்றுவாயை நேரடியாகப் பாதுகாக்கிறது; ‘கடவுளால் அனுப்பப்பட்டவர்’ என்பது கூடுதல் விளக்கம் ஆகும்.
- source_word: οὐκ ἠδύνατο
  choice: முடிந்திருக்காது
  rationale: எதிர்நிலை நிபந்தனையின் விளைவாகக் கூறப்படும் இயலாமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ποιεῖν
  choice: செய்ய
  rationale: ποιέω என்பதன் பரந்த பொருளைப் பாதுகாக்கிறது; ‘அற்புதங்களைச் செய்ய’ என்று சூழலிலிருந்து சொல்லைச் சேர்க்கவில்லை.
- source_word: οὐδέν
  choice: ஒன்றும்
  rationale: எதிர்மறை வினையுடன் சேர்ந்து முழுமையான இயலாமையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசு ‘கடவுளிடமிருந்து’ வந்தவர் என்பதன் பொருள்
  choice: ‘கடவுளிடமிருந்து வந்தவர்’ என்ற மூலமொழியின் பரந்த சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘கடவுளால் அனுப்பப்பட்டவர்’ அல்லது ‘கடவுளின் அதிகாரம் பெற்றவர்’
  rationale: வசனம் தெய்வீக மூலத்தையோ தொடர்பையோ வலியுறுத்துகிறது; ஆனால் பணி, அதிகாரம், அல்லது இயல்பு குறித்த மேலும் குறிப்பான கோட்பாட்டுச் சொல்லாக்கத்தை இங்கு வெளிப்படையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘இவர்’ மரியாதையையும் சூழலின் தனிநபர் குறிப்பையும் காக்கிறது. எதிர்நிலை நிபந்தனை ‘முடிந்திருக்காது’ என்பதால் தெளிவாக வெளிப்படுகிறது.
