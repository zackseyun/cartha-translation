  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: ta
  text: அவர்கள் அவனை வெளியேற்றிவிட்டதை இயேசு கேள்விப்பட்டார். அவர் அவனைக் கண்டபோது, “நீ மானிடமகனை நம்புகிறாயா?” என்று கேட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “மானிடமகன்” என்பதற்குப் பதிலாக “தேவனுடைய மகன்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: வெளியே துரத்திவிட்டதை
  rationale: ἐκβάλλω என்பதுடன் ἔξω சேர்ந்து வருவது வலியுறுத்தப்பட்ட வெளியேற்றத்தைக் குறிக்கிறது. ‘வெளியே துரத்திவிட்டனர்’ என்பது சமூக விலக்கலின் வலிமையையும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: εὑρὼν
  choice: அவர் அவனைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு காலத் தொடர்பைக் காட்டுகிறது; இயேசு அவனைக் கண்ட பின்பு பேசிய செயல்முறையை இயல்பாகத் தருகிறது.
- source_word: Σὺ πιστεύεις
  choice: நீ ... நம்பிக்கை வைக்கிறாயா?
  rationale: வெளிப்படையாக வரும் Σὺ என்பதன் தனிப்பட்ட வலியுறுத்தலை ‘நீ’ தக்கவைக்கிறது; πιστεύω இங்கு வெறும் கருத்து ஒப்புதலைவிட ஒருவர்மீது வைக்கும் நம்பிக்கையைக் குறிக்கிறது.
- source_word: εἰς
  choice: -இடம்
  rationale: πιστεύω என்பதுடன் வரும் εἰς நம்பிக்கை ஒருவரை நோக்கியிருப்பதைக் குறிக்கிறது. ‘மானிடமகனிடம் நம்பிக்கை வை’ என்பது அந்தத் தனிப்பட்ட நம்பிக்கையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: யோவான் நற்செய்தியிலும் தானியேல் 7 பின்னணியிலும் பட்டப்பெயராக வரும் இச்சொற்றொடரின் வேதாகமத் தொடர்பைத் தக்கவைக்கும், நவீனத் தமிழில் புரியக்கூடிய வடிவம்.
theological_decisions:
- issue: கேள்வியிலுள்ள கிறிஸ்துவியல் பட்டப்பெயரின் வாசகம்
  choice: மானிடமகன்
  alternative: தேவமகன்
  rationale: SBLGNT முதன்மை உரை ἀνθρώπου (‘மனிதன்/மானிடம்’) என்று வாசிப்பதால் அது முதன்மை உரையில் பின்பற்றப்படுகிறது. வரலாற்று முக்கியத்துவமுள்ள ‘தேவமகன்’ என்ற மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘துரத்திவிட்டதை’ வெளியேற்றத்தின் வலிமையைத் தருகிறது; ‘நம்பிக்கை வைக்கிறாயா’ என்பது ஒருவரை நோக்கிய நம்பிக்கையை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு மேற்கோள் முடிந்த உடனே வைக்கப்பட்டுள்ளது.
