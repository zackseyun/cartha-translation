source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: ta
  text: அவர்கள் அவரை வசைபாடி, “நீ அந்த மனிதனின்[a] சீடன்; நாங்களோ மோசேயின் சீடர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீ அவருடைய சீடன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘அந்த ஒருவருடைய’ என்ற தொலைவுச் சுட்டு உள்ளது; இச்சூழலில் அது ஒதுக்கித்தள்ளும் தொனியைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: இகழ்ந்து
  rationale: λοιδορέω என்பது ஒருவரை வசைபாடி அவமதிப்பதைக் குறிக்கிறது. சூழலின் கடுமையையும் பகைமைத் தொனியையும் இயல்பான நவீனத் தமிழில் ‘இகழ்ந்து’ வெளிப்படுத்துகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: பார்வை பெற்ற மனிதனைச் சுட்டும் நேரடி செயப்படுபொருள்; தமிழ் மரியாதை ஒருமைச் சுட்டுப்பெயர் சூழலுக்கு இயல்பானது.
- source_word: καὶ εἶπον
  choice: என்றார்கள்
  rationale: கிரேக்கத்தில் உள்ள உரைத்தல் வினையை நேரடி உரையின் முடிவில் இயல்பான தமிழ் கூறுமுறையில் அமைக்கிறது.
- source_word: Σὺ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் முன்வைக்கப்பட்டும் உள்ள சுட்டுப்பெயரின் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: μαθητὴς / μαθηταί
  choice: சீடன் / சீடர்கள்
  rationale: μαθητής வெறும் மாணவனைக் காட்டிலும் ஒருவரோடு பற்றுறுதியுடன் இணைந்த சீடனைக் குறிக்கிறது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது வசனத்தின் எதிர்மறை ஒப்பீட்டைத் தெளிவாக்குகிறது.
- source_word: ἐκείνου
  choice: அந்த மனிதனுடைய
  rationale: தொலைவைச் சுட்டும் demonstrative-ஐப் பாதுகாத்து, பகைமையான சூழலில் உள்ள ஒதுக்கித்தள்ளும் தொனியையும் உணர்த்துகிறது; ‘அவனுடைய’ என்பதைவிட பொருள் தெளிவாக உள்ளது.
- source_word: ἡμεῖς δὲ
  choice: நாங்களோ
  rationale: δέ தரும் முரண்பாட்டையும் ἡμεῖς என்பதிலுள்ள அழுத்தத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: மோசேயின் சீடர்கள்
  rationale: சீடத்துவ உறவைக் குறிக்கும் பிறப்புப்பொருள் அமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது; ‘இருக்கிறோம்’ என்பது தமிழில் தேவையில்லாமல் இருப்பதால் விடப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் ἐκείνου என்பதன் தொனி
  choice: ‘அந்த மனிதனுடைய’ என்று மொழிபெயர்த்து, பேசுகிறவர்களின் ஒதுக்கித்தள்ளும் பகைமைத் தொனியைப் பாதுகாத்தல்
  alternative: ‘அவருடைய’ அல்லது ‘அவனுடைய’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  rationale: ἐκείνου தன்னளவில் தொலைவுச் சுட்டாக இருக்கலாம்; ஆனால் இங்கு அவர்கள் அந்த மனிதனை இகழும் வாதச் சூழல் இருப்பதால் அவமதிப்பான இடைவெளி உணரப்படுகிறது. இருப்பினும் அந்தத் தொனி சூழல்சார்ந்தது என்பதைக் குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: μαθητής என்பதன் இரு பயன்பாடுகள்
  choice: இரண்டையும் ‘சீடன்/சீடர்கள்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  alternative: ‘பின்பற்றுபவன்’ அல்லது ‘மாணவன்’
  rationale: இந்தச் சொல் கற்றலை மட்டுமல்ல, ஒருவரோடு கொண்ட பற்றுறுதியையும் பின்பற்றுதலையும் குறிக்கிறது. ஒரே தமிழ்ச் சொல் இயேசுவுக்கும் மோசேக்கும் உரிய சீடத்துவங்களுக்கிடையிலான திட்டமிட்ட முரண்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாங்களோ’ என்பது உரையாடலின் வலுவான முரண்பாட்டை இயல்பாகத் தருகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முழு கூற்றின் முடிவில் வைக்கப்பட்டுள்ளது.
