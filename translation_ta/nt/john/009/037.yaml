source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: ta
  text: இயேசு அவனிடம், “நீ அவரைக் கண்டிருக்கிறாய்; உன்னோடு பேசிக்கொண்டிருப்பவரே அவர்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: கதைநடை உரையாடலில் εἶπεν என்பதற்கு ‘என்றார்’ இயல்பான தமிழ் இணை; αὐτῷ உரையின் பெறுநரை ‘அவனிடம்’ என்று குறிக்கிறது.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: நீ அவரைக் கண்டிருக்கிறாய்
  rationale: ἑώρακας நிறைவுற்ற செயல் தற்போதும் பொருத்தமுடையது என்பதைக் காட்டும் perfect வடிவம்; ‘கண்டிருக்கிறாய்’ அந்த நுணுக்கத்தை இயல்பாகக் காக்கிறது. வாக்கியத் தொடக்க Καί தமிழில் வெளிப்படையாக ‘மேலும்’ என மொழிபெயர்க்கப்பட்டால் செயற்கையாக இருப்பதால், அரைப்புள்ளி வழியாக இரு கூற்றுகளின் இணைப்பு காக்கப்படுகிறது.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: உன்னோடு பேசிக்கொண்டிருப்பவர்
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள நிகழ்காலப் பங்கேற்புச் சொல்லையும் μετά + genitive-இன் ‘உடன்’ பொருளையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐκεῖνός ἐστιν
  choice: அவரே அவர்
  rationale: முந்தைய வசனத்தில் கேட்கப்பட்ட நபருடன் பேசுகிறவரை நேரடியாக அடையாளப்படுத்தும் கிரேக்க வலியுறுத்தலை ‘-ஏ’ காக்கிறது; பட்டத்தை இவ்வசனத்தில் தேவையின்றி மீண்டும் சேர்ப்பதில்லை.
theological_decisions:
- issue: முந்தைய சூழலில் குறிப்பிடப்பட்ட மனிதகுமாரனுடன் இயேசு தம்மை அடையாளப்படுத்துதல்
  choice: “உன்னோடு பேசிக்கொண்டிருப்பவரே அவர்” என நேரடியாகவும் விரிவாக்கமின்றியும் மொழிபெயர்த்தல்
  alternative: “உன்னிடம் பேசுகிற நானே மனிதகுமாரன்”
  rationale: கிரேக்கம் தெளிவான சுய அடையாளத்தை வழங்குகிறது; ஆனால் முந்தைய பட்டத்தை மீண்டும் சொல்லவோ முதல் நபர் வடிவத்தைச் சேர்க்கவோ இல்லை. எனவே வெளிப்பாட்டின் வலிமையையும் மூலத்தின் சுருக்கத்தையும் ஒருசேர காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் கதைநடை. ‘அவர்’ என்பது இயேசு குறிப்பிடும் நபருக்கான மரியாதை ஒருமை; ‘அவன்’ என்பது கதைசொல்லி அந்த மனிதனைச் சுட்டும் வழக்கமான மூன்றாம் நபர் வடிவம். ‘உன்னோடு’ என்பது μετὰ σοῦ என்பதன் ‘with you’ நுணுக்கத்தை இயல்பாகப் பாதுகாக்கிறது.
