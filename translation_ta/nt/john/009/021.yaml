source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: ta
  text: ஆனால், இப்போது அவன் எப்படிப் பார்க்கிறான் என்று எங்களுக்குத் தெரியாது; அல்லது, அவனுடைய கண்களைத் திறந்தவர் யார் என்று எங்களுக்குத் தெரியாது. அவனிடமே கேளுங்கள்; அவன் வயது வந்தவன். தன்னைப் பற்றி அவனே பேசுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் சார்பாகப் பேச முடியும்.” கிரேக்க மொழியிலுள்ள எதிர்கால வினை, அவன் தானே பதிலளிக்கக்கூடியவன் அல்லது பதிலளிக்க வேண்டியவன் என்ற நடைமுறைப் பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: ஆனால் இப்போது அவன் எப்படிப் பார்க்கிறான்
  rationale: πῶς என்பதன் ‘எப்படி’ என்ற கேள்விப் பொருளையும், δέ என்பதன் மிதமான எதிர்மறைத் தொடர்ச்சியையும், νῦν βλέπει என்பதன் நிகழ்காலமான ‘இப்போது பார்க்கிறான்’ என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐκ οἴδαμεν
  choice: எங்களுக்குத் தெரியாது
  rationale: ‘அறியவில்லை’ என்பதைக் காட்டிலும் உரையாடல் சூழலில் இயல்பாக உள்ளது. கிரேக்கத்தில் இருமுறை வரும் சொற்றொடரின் வலியுறுத்தலைத் தமிழிலும் இருமுறை வைத்துள்ளது.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: அவனுடைய கண்களைத் திறந்தவர் யார்
  rationale: ἀνοίγω என்பதன் நேரடியான ‘திற’ என்ற பொருளையும், இக்கதையில் மீண்டும் வரும் ‘கண்களைத் திறத்தல்’ என்ற சொல்லாட்சியையும் காக்கிறது. தமிழில் இயல்பான இணைப்புக்காக ἤ தனியாக ‘அல்லது’ என்று மொழிபெயர்க்கப்படாமல் ‘என்பதும்’ மூலம் மாற்றுக் கேள்வி இணைக்கப்படுகிறது.
- source_word: αὐτὸν ἐρωτήσατε
  choice: அவனிடமே கேளுங்கள்
  rationale: பன்மை ஏவலை மரியாதை/பன்மை வடிவமான ‘கேளுங்கள்’ காட்டுகிறது. ‘-இடமே’ என்பது கேள்வியை அவனிடமே திருப்பும் αὐτόν என்பதன் சூழல்சார் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡλικίαν ἔχει
  choice: அவன் வயதுவந்தவன்
  rationale: இங்கு ἡλικία உடல் உயரத்தை அல்ல, தனியாகப் பதிலளிக்கப் போதிய வயதை அடைந்த நிலையைக் குறிக்கிறது. ‘வயதுவந்தவன்’ என்பது இன்றைய பொதுத் தமிழில் தெளிவானதும் சுருக்கமானதும் ஆகும்.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: அவன் தன்னைப் பற்றித் தானே பேசுவான்
  rationale: αὐτός என்பதன் வலியுறுத்தலை ‘தானே’ என்பதும், περὶ ἑαυτοῦ என்பதன் ‘தன்னைப் பற்றி’ என்ற பொருளும், λαλήσει என்பதன் எதிர்கால வடிவத்தை ‘பேசுவான்’ என்பதும் காக்கின்றன.
