source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: ta
  text: அவர்கள் அவனுக்குப் பதிலளித்து, “நீ முற்றிலும் பாவங்களிலேயே பிறந்தவன்; நீயா எங்களுக்குப் போதிக்கிறாய்?” என்று சொன்னார்கள். பிறகு அவர்கள் அவனை வெளியேற்றினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளியேற்றினார்கள்” என்பது அவர்கள் இருந்த இடத்திலிருந்து அவனை வெளியேற்றியதைக் குறிக்கலாம்; சூழலில், தொழுகைக்கூடச் சமூகத்திலிருந்து அவனை விலக்கியதையும் உட்குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: அவர்கள் அவனுக்குப் பதிலளித்து, … என்று சொன்னார்கள்
  rationale: யோவானின் இரட்டை வினை அமைப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தக்கவைக்கிறது.
- source_word: Ἐν ἁμαρτίαις
  choice: பாவங்களிலேயே
  rationale: மூலத்தின் பன்மை வடிவத்தைப் பாதுகாத்து, பேசுகிறவர்களின் கடுமையான குற்றச்சாட்டை மெலிதாக்காமல் வெளிப்படுத்துகிறது.
- source_word: ἐγεννήθης ὅλος
  choice: நீ முழுவதும் … பிறந்தவன்
  rationale: ὅλος என்பதன் முழுமை வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அது பிறப்பின் செயலை அல்ல, பிறப்பிலிருந்தே அவனுடைய முழு நிலையைச் சுட்டுவதாக வாசிக்கப்படுகிறது.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: நீயா எங்களுக்குப் போதிக்கிறாய்?
  rationale: வெளிப்படையான σὺ தரும் இகழ்ச்சியும் சினமும் கலந்த வலியுறுத்தலை ‘நீயா’ என்ற கேள்வி வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: அவனை வெளியே தள்ளிவிட்டார்கள்
  rationale: வலுக்கட்டாயமான வெளியேற்றத்தைத் தெளிவாகக் காட்டும் இயல்பான நடப்புத் தமிழ்; அதன் துல்லியமான சமூக அல்லது நிறுவன எல்லையைத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: பிறவிக் குருட்டுத்தன்மையின் சூழலில் ‘பாவங்களில் பிறந்தவன்’ என்ற குற்றச்சாட்டின் பொருள்
  choice: அந்த மனிதன் பிறப்பிலிருந்தே முழுவதும் பாவங்களால் குறிக்கப்பட்டவன் என்று எதிரிகள் இகழ்ந்து குற்றஞ்சாட்டுவதாக மொழிபெயர்க்கப்பட்டுள்ளது; எந்தப் பாவம் அல்லது யாருடைய பாவம் என்பது குறிப்பிடப்படவில்லை.
  alternative: ‘பாவத்தில் பிறந்தவன்’, ‘முழுப் பாவியாகப் பிறந்தவன்’, அல்லது ‘பெற்றோரின் பாவக்குற்றத்துடன் பிறந்தவன்’.
  rationale: கிரேக்க உரை குற்றச்சாட்டைப் பதிவு செய்கிறது; அது அவனுடைய சொந்தப் பாவமா, மரபாக வந்த பாவமா, பெற்றோரின் பாவமா என்பதைத் தீர்மானிக்கவில்லை. எனவே அந்த இறையியல் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: ‘வெளியே தள்ளிவிட்டார்கள்’ என்பதன் எல்லை
  choice: விரோதமான வெளியேற்றம் என்று பிரதான உரையில் தரப்பட்டுள்ளது.
  alternative: அவர்கள் இருந்த இடத்திலிருந்து மட்டும் வெளியேற்றுதல் அல்லது தொழுகைக்கூடச் சமூகத்திலிருந்து நீக்குதல்.
  rationale: ἐξέβαλον αὐτὸν ἔξω வலுக்கட்டாய வெளியேற்றத்தைக் குறிக்கிறது; உடனடி இடத்திலிருந்து வெளியேற்றமா அல்லது தொழுகைக்கூடச் சமூக விலக்கா என்பதை இவ்வசனம் மட்டும் முடிவாகக் கூறவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் அதேவேளை கண்ணியமான வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. ‘பாவங்களிலேயே’ என்ற சற்று குறியிடப்பட்ட பன்மை, மூலத்தின் குற்றஞ்சாட்டும் சொற்தொடரை திட்டமிட்டு பாதுகாக்கிறது.
