reference: John 9:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: ta
  text: அவர் அவனிடம், “நீ போய் சீலோவாம் (இதன் மொழிபெயர்ப்பு, ‘அனுப்பப்பட்டது’) குளத்தில் கழுவு” என்றார். எனவே அவன் போய்க் கழுவினான்; பார்வை பெற்றவனாகத் திரும்பி வந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὕπαγε
  choice: நீ போய்
  rationale: நகர்ந்து செல்லும்படியான நேரடியான கட்டளையை இயல்பான நவீன தமிழில் தருகிறது; கிரேக்கத்தில் இல்லாத கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: νίψαι / ἐνίψατο
  choice: கழுவு / கழுவினான்
  rationale: νίπτω என்பது பொதுவாக உடலின் ஒரு பகுதியைக் கழுவுவதைக் குறிக்கலாம். இச்சூழலில் முகத்தில் பூசப்பட்டதை கழுவுதல் உட்பொருளாக இருப்பதால், ‘கழுவு’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: εἰς τὴν κολυμβήθραν
  choice: குளத்தில்
  rationale: κολυμβήθρα ஒரு குளம் அல்லது நீர்த்தேக்கத்தைக் குறிக்கிறது. கழுவுதல் என்னும் வினையுடன் ‘குளத்தில்’ என்பது இயல்பான தமிழ் வழக்கு; εἰς என்பதைக் கட்டாயமாக ‘குளத்திற்குள்’ என்று மரபுசார்ந்து மாற்றவில்லை.
- source_word: Σιλωάμ
  choice: சீலோவாம்
  rationale: இடப்பெயரின் கிரேக்க வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; பரவலாக அறியப்பட்ட வேதாகமப் பெயர் வடிவத்தையும் பேணுகிறது.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: சீலோவாம் என்பதற்கு “அனுப்பப்பட்டவர்” என்று மொழிபெயர்க்கப்படுகிறது
  rationale: ἑρμηνεύεται என்பதன் வெளிப்படையான மொழிபெயர்ப்பு விளக்கத்தைப் பேணுகிறது. Ἀπεσταλμένος ஆண்பால் ஒருமை இறந்தகால செயப்பாட்டு வினையெச்சமாக இருப்பதால், பெயராக்கப்பட்ட ‘அனுப்பப்பட்டவர்’ அதன் வடிவத்தையும் சாத்தியமான யோவானிய ஒலிப்பையும் காக்கிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய கட்டளைக்குப் பின்வரும் நிகழ்வை விளைவாக இணைக்கிறது. ‘எனவே’ தெளிவான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἀπῆλθεν
  choice: போய்
  rationale: எளிய கதைநடைச் செல்லுதலை இயல்பாக வெளிப்படுத்துகிறது; ‘புறப்பட்டுச் சென்றான்’ போன்ற தேவையற்ற வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: ἦλθεν βλέπων
  choice: பார்வை பெற்றவனாகத் திரும்பி வந்தான்
  rationale: βλέπων என்பதன் தொடர்நிலை/விளைவைக் காட்டி, குணமடைந்த நிலையில் அவன் வந்ததைத் தெளிவாக்குகிறது. சூழலால் குறிக்கப்படும் திரும்பிவருதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீலோவாம் பற்றிய விளக்கத்தை யோவானின் அடையாளப் பொருளை மிகைப்படுத்தாமல் தருதல்
  choice: ‘அனுப்பப்பட்டவர்’ என்ற ஆசிரியரின் விளக்கத்தை அடைப்புக்குறிக்குள் முதன்மை உரையிலேயே வைத்தல்
  alternative: பிதாவால் அனுப்பப்பட்ட இயேசுவோடு உள்ள தொடர்பை மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரையே இவ்விளக்கத்தை வழங்குவதால் அது முதன்மை உரையில் இருக்க வேண்டும். ஆனால் இவ்வசனம் வெளிப்படையாகச் சொல்லாத கிறிஸ்தியல் அடையாளப் பொருளை மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
- issue: βλέπων என்பதன் பொருள்
  choice: ‘பார்வை பெற்றவனாக’ என்று குணமடைந்த நிலையை வெளிப்படுத்துதல்
  alternative: ‘பார்த்துக்கொண்டே’ அல்லது சொல் நெருக்கமாக ‘பார்ப்பவனாக’ என்று மொழிபெயர்த்தல்
  rationale: பிறவிக்குருடனான மனிதனின் சூழலில் βλέπων என்பது இப்போது காணக்கூடியவனான விளைவைச் சுட்டுகிறது. ‘பார்வை பெற்றவனாக’ என்பது அதைக் கூறுகிறது; குணப்படுத்தலின் காரணம் அல்லது முறை குறித்து மேலதிக கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. கிரேக்க உரையின் அடைப்புக்குறி விளக்கம் பேணப்பட்டுள்ளது. இவ்வசனத்திற்கு தனி அடிக்குறிப்பு தேவையில்லை; ஆகவே முதன்மை உரையில் அடிக்குறிப்பு குறியீடு சேர்க்கப்படவில்லை.
