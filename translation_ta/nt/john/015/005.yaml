  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: ta
  text: நானே திராட்சைக்கொடி; நீங்கள் அதன் கிளைகள். என்னில் நிலைத்திருக்கிறவன்[a]—நானும் அவனில் நிலைத்திருக்கிறேன்—அவனே[b] மிகுந்த கனி கொடுக்கிறான். ஏனெனில், என்னைவிட்டுப் பிரிந்து உங்களால் எதுவுமே செய்ய இயலாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னில் தொடர்ந்து தங்கியிருப்பவன்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல், குறிப்பாக யோவான் நூலில், தொடர்ச்சியான உறவில் நீடித்திருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனே’ என்பதற்கான கிரேக்க வடிவம் ஆண்பால் ஒருமையில் இருந்தாலும், இயேசுவில் நிலைத்திருக்கும் எந்தச் சீடனையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: திராட்சைக்கொடி
  rationale: திராட்சைச் செடியின் முழுக் கொடியைக் குறிக்கும் சொல்லாக இது தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து உருவகத்தைப் பாதுகாக்கிறது.
- source_word: κλήματα
  choice: அதன் கிளைகள்
  rationale: திராட்சைக்கொடியிலிருந்து வளரும் கிளைகளைக் குறிக்கிறது. ‘அதன்’ என்பது கொடிக்கும் கிளைகளுக்கும் உள்ள தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: ὁ μένων
  choice: நிலைத்திருக்கிறவன்
  rationale: μένω என்பதன் தொடர்ந்திருத்தல், உறவில் நீடித்திருத்தல் ஆகிய பொருள்களை ‘நிலைத்திருக்கிறவன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: என்னில் ... அவனில்
  rationale: பரஸ்பர உள்ளிருப்பைக் குறிக்கும் ἐν என்ற முன்னிடைச்சொல்லின் வலிமையை ‘-இல்’ அமைப்பு காக்கிறது; ‘என்னோடு/அவனோடு’ என்று மாற்றி அதன் ஆழத்தைக் குறைக்கவில்லை.
- source_word: κἀγώ
  choice: நானும்
  rationale: ‘நானும்’ என்பது ‘καὶ ἐγώ’ என்பதன் பரஸ்பர அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φέρει καρπὸν πολύν
  choice: மிகுந்த கனி கொடுக்கிறான்
  rationale: திராட்சைக்கொடி உருவகத்துக்கேற்ற இயல்பான தமிழ் சொற்றொடர்; καρπὸν πολύν என்பதன் அளவையும் காக்கிறது.
- source_word: χωρὶς ἐμοῦ
  choice: என்னைவிட்டுப் பிரிந்து
  rationale: இது உதவி இல்லாமையை மட்டும் அல்லாமல் இயேசுவிலிருந்து பிரிந்திருக்கும் நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: உங்களால் எதுவுமே செய்ய இயலாது
  rationale: இத்தொடர் தடையை அல்ல, இயலாமையைச் சொல்கிறது. ‘எதுவுமே’ என்பது கிரேக்க மறுப்பின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யோவான் நூலுக்குரிய பரஸ்பர உள்ளிருப்பு மொழி
  choice: ‘என்னில் ... அவனில்’ என்ற வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘என்னோடு ... அவனோடு’
  rationale: இயேசுவுக்கும் சீடனுக்கும் இடையிலான பரஸ்பர உள்ளிருப்பை கிரேக்கம் வெளிப்படுத்துகிறது. ‘-இல்’ என்பதைத் தக்கவைப்பது இந்த இறையியல் ஆழத்தையும் பதற்றத்தையும் விளக்கிச் சுருக்காமல் பாதுகாக்கிறது.
- issue: αὐτῷ என்பதிலுள்ள ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாடு
  choice: முதன்மை உரையில் ‘அவனில்/அவனே’ என்று ஆண்பால் ஒருமையை வைத்தல்
  alternative: ‘அந்த நபரில்/அவரே’ அல்லது பன்மை வடிவம்
  rationale: கிரேக்க வடிவம் இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும் பொதுவாக எந்தச் சீடனையும் குறிக்கிறது. மூலத்தின் வடிவம் உரையில் காக்கப்பட்டு அதன் பொதுப்பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையுடன், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. இடைக்கோடுகள் கிரேக்கத்தின் சுருக்கமான பரஸ்பர அமைப்பைத் தமிழில் தேவையற்ற நிபந்தனைச் சொல்லைச் சேர்க்காமல் தெளிவாக்குகின்றன.
