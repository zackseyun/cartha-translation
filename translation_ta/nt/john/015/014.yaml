  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: ta
  text: நான் உங்களுக்குக் கட்டளையிடுவதை நீங்கள் செய்தால், நீங்கள் என் நண்பர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் முறையாக: “நான் உங்களுக்குக் கட்டளையிடுகிற காரியங்களை நீங்கள் செய்தால், நீங்கள் என் நண்பர்கள்.”'
    reason: ἃ என்ற நடுநிலைப் பன்மை உறவுப்பெயரை ‘காரியங்களை’ என்று வெளிப்படையாக மொழிபெயர்க்கும் மாற்று வடிவம்.
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: இது இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்; கிரேக்கத்தில் வலியுறுத்தப்பட்டிருந்தாலும், நவீனத் தமிழில் ‘நீங்கள்’ என்பதே இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: φίλοι μού
  choice: என் நண்பர்கள்
  rationale: φίλοι நெருக்கமான உறவைக் குறிக்கிறது; μού உடைமை அல்லது உறவைக் காட்டுகிறது. ‘என் நண்பர்கள்’ என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: ἐστε
  choice: (தமிழில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: நிகழ்கால ‘இருக்கிறீர்கள்’ என்ற பொருள் தமிழின் பெயர்ப் பயனிலை வாக்கியத்தில் இயல்பாக மறைந்துள்ளது; ‘நீங்கள் என் நண்பர்கள்’ என்பதே நடப்புத் தமிழில் செம்மையான வடிவம்.
- source_word: ἐὰν
  choice: செய்தால்
  rationale: துணைவினை வடிவில் உள்ள நிபந்தனையைத் தமிழில் ‘-ஆல்’ விகுதி தெளிவாக வெளிப்படுத்துகிறது; இதை வெறும் காலக் குறிப்பாக மாற்றாமல் நிபந்தனையாகவே காக்கிறது.
- source_word: ποιῆτε
  choice: நீங்கள் செய்தால்
  rationale: ποιέω இங்கு கட்டளையை நிறைவேற்றுவதைக் குறிக்கிறது. ‘செய்தால்’ இயல்பான மொழியாகும்; தொடர்ச்சியை மிகைப்படுத்தும் ‘தொடர்ந்து செய்துகொண்டிருந்தால்’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
- source_word: ἃ
  choice: -வதை
  rationale: நடுநிலைப் பன்மை உறவுப்பெயரின் பொருளைத் தமிழில் ‘கட்டளையிடுவதை’ என்ற இயல்பான பெயரெச்சத் தொகர் தெரிவிக்கிறது. மேலும் முறையான ‘காரியங்களை’ என்ற வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் முதலாம் நபர் பெயர்ச்சொல் வலியுறுத்தலைக் கொண்டுள்ளது; தமிழிலும் ‘நான்’ வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: ἐντέλλομαι
  choice: கட்டளையிடுகிறேன்
  rationale: அதிகாரப்பூர்வமாக ஆணையிடும் பொருளை ‘கட்டளையிடு’ துல்லியமாகக் காக்கிறது; ‘அறிவுறுத்து’ என்பது அதன் வலிமையைத் தளர்த்தக்கூடும்.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் பன்மை மறைமுகச் செயப்படுபொருளை ‘உங்களுக்கு’ நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கீழ்ப்படிதலுக்கும் இயேசுவின் நண்பர்களாக இருப்பதற்கும் இடையிலான நிபந்தனை உறவு
  choice: ‘செய்தால்’ என்று நேரடியான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘செய்யும்போது’ என்று கால அல்லது நிகழ்வு உறவாக மொழிபெயர்த்தல்.
  rationale: ἐὰν உடன் வரும் subjunctive வடிவம் இயல்பாக நிபந்தனையைத் தெரிவிக்கிறது. நட்புக்கும் கீழ்ப்படிதலுக்கும் வசனம் கூறும் தொடர்பை மொழிபெயர்ப்பு காக்கிறது; தகுதி, இரட்சிப்பு, அல்லது நிலைத்திருத்தல் குறித்த விரிவான கோட்பாட்டை இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பெயர்ப் பயனிலை வாக்கியத்தில் ‘இருக்கிறீர்கள்’ என்பதைச் சேர்க்காமல் விடுவது இயல்பான தமிழ். கிரேக்க மூலத்தின் நிபந்தனைத் தன்மையும் இயேசுவின் கட்டளையின் அதிகாரத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
