id: JHN.15.20
reference: John 15:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: ta
  text: 'நான் உங்களிடம் சொன்ன வார்த்தையை நினைவில் வைத்துக்கொள்ளுங்கள்: ‘அடிமை[a] தன் எஜமானைவிடப் பெரியவன் அல்ல.’ அவர்கள் என்னைத் துன்புறுத்தினார்கள் என்றால், உங்களையும் துன்புறுத்துவார்கள்; அவர்கள் என் வார்த்தையைக் கடைப்பிடித்தார்கள்[b] என்றால், உங்கள் வார்த்தையையும் கடைப்பிடிப்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேவகர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் δοῦλος சூழலுக்கு ஏற்ப ‘அடிமை’ அல்லது ‘சேவகர்’ எனப் பொருள்படும்; இங்கு எஜமானுடனான நிலை ஒப்பீடு கீழ்ப்பட்ட உறவை வலியுறுத்துவதால் ‘அடிமை’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘கீழ்ப்படிந்தார்கள்’ என்றும் பொருள்படலாம். யோவான் எழுதிய நூல்களில் ‘வார்த்தையைக் கடைப்பிடித்தல்’ என்பது இயேசுவின் செய்தியை ஏற்றுக்கொண்டு அதற்குக் கீழ்ப்படிந்து வாழ்வதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: நினைவில் வைத்துக்கொள்ளுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவத்தின் தொடர்ச்சியான நினைவுகூரும் அழைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λόγου
  choice: வார்த்தை
  rationale: இங்கு இயேசு முன்பு கூறிய குறிப்பிட்ட கூற்றைக் குறிக்கிறது; மேலும் வசனத்துக்குள் வரும் λόγος என்பதுடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: κύριος என்பவருக்குக் கீழ்ப்பட்ட சமூக நிலையை அடிப்படையாகக் கொண்ட ஒப்பீடு என்பதால், ‘பணியாளர்’ என்பதைவிட ‘அடிமை’ மூலச்சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: μείζων
  choice: பெரியவன்
  rationale: நிலை அல்லது மேன்மை குறித்த ஒப்பீட்டின் பரந்த பொருளைத் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: κυρίου
  choice: எஜமான்
  rationale: இங்கு தெய்வீகப் பட்டப்பெயர் அல்லாமல் அடிமைக்கு மேலான அதிகாரமுள்ளவரைக் குறிக்கிறது; ‘அடிமை—எஜமான்’ இணை இயல்பான தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: ἐδίωξαν / διώξουσιν
  choice: துன்புறுத்தினார்கள் / துன்புறுத்துவார்கள்
  rationale: இயேசுவுக்கும் சீடர்களுக்கும் எதிரான பகைமையை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: கடைப்பிடித்தார்கள் / கடைப்பிடிப்பார்கள்
  rationale: τηρέω என்பதில் உள்ள செய்தியை ஏற்றுக்கொண்டு அதற்குக் கீழ்ப்படிதல் என்ற பொருளைத் தக்கவைக்கிறது; ஒரே வினைச்சொல்லை இருமுறையும் பயன்படுத்தி மூலத்தின் இணை அமைப்பைக் காக்கிறது.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: என் வார்த்தை ... உங்கள் வார்த்தை
  rationale: இயேசுவின் வார்த்தைக்கும் சீடர்கள் அறிவிக்கும் வார்த்தைக்கும் இடையிலான மூலத்தின் நேரான இணைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: δοῦλος என்பதன் சமூக நிலை சார்ந்த பொருள்
  choice: அடிமை
  alternative: பணியாளர்
  rationale: இந்தப் பழமொழியின் வாதம் δοῦλος மற்றும் κύριος இடையிலான சமமற்ற நிலையைச் சார்ந்தது. ஆகவே ‘அடிமை’ என்பது உறவின் தீவிரத்தையும் கீழ்ப்பட்ட நிலையையும் மறைக்காமல் தருகிறது.
- issue: κύριος என்பதன் சூழல்சார் பொருள்
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இங்கு κύριος கிறிஸ்துவுக்கான தெய்வீகப் பட்டப்பெயராக அல்ல, அடிமைக்கு மேலான அதிகாரமுள்ளவராக வருகிறது; எனவே ‘எஜமான்’ பொருத்தமானது.
- issue: τηρέω என்பதன் யோவானிய விரிவு
  choice: கடைப்பிடித்தல்
  alternative: கீழ்ப்படிதல்
  rationale: ‘கடைப்பிடித்தல்’ என்பது வார்த்தையை ஏற்றுக்கொள்வதும் அதன்படி வாழ்வதும் ஆகிய இரு கூறுகளுக்கும் இடமளித்து, பொருளை ஒரே பரிமாணமாகச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. ‘நினைவில் வைத்துக்கொள்ளுங்கள்’ என்ற பன்மை மரியாதைக் கட்டளை, சீடர்கள் அனைவரிடமும் சொல்லப்படும் தொடர்ச்சியான அழைப்பை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் உள்ள இரு நிபந்தனை வாக்கியங்களும் தீர்மானிக்கப்படாமல் ‘என்றால்’ எனப் பாதுகாக்கப்பட்டுள்ளன.
