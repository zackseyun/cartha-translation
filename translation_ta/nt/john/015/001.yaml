id: JHN.15.1
reference: John 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: ta
  text: “நானே உண்மையான திராட்சைக்கொடி; என் தந்தை திராட்சைத் தோட்டக்காரர்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயிரிடுகிறவர்.” கிரேக்கச் சொல் நிலத்தைப் பயிரிட்டு பராமரிப்பவரைக் குறிக்கிறது; இங்குள்ள திராட்சைக்கொடி உருவகத்தில், திராட்சைக் கொடிகளை வளர்த்துப் பராமரிப்பவர் என்பது அதன் குறிப்பான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடப்பட்ட Ἐγώ தரும் வலியுறுத்தலைத் தமிழில் இயல்பாக ‘நானே’ வெளிப்படுத்துகிறது; ‘இருக்கிறேன்’ என்பதைச் சேர்க்காமல் பெயர்ப்பயனிலையைக் கொண்ட தமிழ் வாக்கியமாக அமைப்பது இயல்பானது.
- source_word: ἄμπελος
  choice: திராட்சைக்கொடி
  rationale: திராட்சை தரும் கொடியையே குறிக்கும் உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: ἀληθινή
  choice: உண்மையான
  rationale: ‘மெய்யானது, நிஜமானது, முழுமையாகக் கடவுளின் உண்மைக்கு ஒத்தது’ என்ற யோவானிய சொல்லின் பொருள் விரிவைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- source_word: ὁ πατήρ μου
  choice: என் தந்தை
  rationale: இயேசுவுக்கும் கடவுளுக்கும் இடையிலான தனிப்பட்ட உறவை நேரடியாகக் கூறுகிறது; தமிழில் மரியாதையும் கண்ணியமும் உடைய இயல்பான வடிவம்.
- source_word: ὁ γεωργός
  choice: திராட்சைத் தோட்டக்காரர்
  rationale: γεωργός என்பது நிலத்தைப் பயிரிடுபவரைக் குறிக்கிறது. இங்குள்ள திராட்சைக்கொடி உருவகச் சூழலில் ‘திராட்சைத் தோட்டக்காரர்’ என்பது பொருத்தமானதும் சாதாரண வாசகருக்குப் புரியக்கூடியதுமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: இயேசுவின் ‘நானே’ கூற்றிலுள்ள உருவக அடையாளம்
  choice: ‘நானே உண்மையான திராட்சைக்கொடி’ என்று உருவகத்தை நேரடியாக வைத்தல்
  alternative: ‘நானே நிஜமான திராட்சைக்கொடி’
  rationale: மூலவசனத்தின் உருவகத்தையும் ‘உண்மையான’ என்ற யோவானிய இறையியல் எதிரொலியையும் விளக்கவுரையால் விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- issue: தந்தையை γεωργός என்று குறிப்பிடுதல்
  choice: திராட்சைத் தோட்டக்காரர்
  alternative: பயிரிடுகிறவர்
  rationale: தந்தையின் செயற்பங்கைத் திராட்சைக்கொடி உருவகத்தோடு இணைத்தே காட்டுகிறது; அதேவேளையில் இந்தச் சொல்லை ஒரு குறிப்பிட்ட இறையியல் கோட்பாட்டாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘நானே’ மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; உருவகம் விளக்கவுரையாக விரிக்கப்படவில்லை. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
