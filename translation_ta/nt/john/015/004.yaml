id: JHN.15.4
reference: John 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: ta
  text: என்னில் நிலைத்திருங்கள்[a]; நானும் உங்களில்[b]. திராட்சைக்கொடியில் நிலைத்திருக்காவிட்டால், கிளை தானாகவே கனி கொடுக்க முடியாது. அவ்வாறே, நீங்கள் என்னில் நிலைத்திருக்காவிட்டால் கனி கொடுக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னில் தொடர்ந்து தங்கியிருங்கள்’ என்றும் மொழிபெயர்க்கலாம். மூலச்சொல் உறவில் தொடர்ந்து நீடித்திருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘நானும் உங்களில்.’ கிரேக்கத்தில் இங்கே வினைச்சொல் வெளிப்படையாக இல்லை; முந்தைய கூற்றின் கருத்து சுருக்கமாகத் தொடர்கிறது.
    reason: source_ellipsis
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: நிலைத்திருங்கள் / நிலைத்திராவிட்டால்
  rationale: μένω என்பதன் தொடர்ந்து தங்குதல், உறவில் நீடித்திருத்தல் ஆகிய பொருள்களை நவீனத் தமிழில் இயல்பாகவும் ஒரே சொல்லால் தொடர்ச்சியாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοί
  choice: என்னில்
  rationale: ἐν என்பதிலுள்ள உள்ளார்ந்த இணைவு அல்லது பங்கேற்பைத் தக்கவைக்கிறது; ‘என்னோடு’ என்பது வெறும் உடனிருப்பாகக் குறுகிவிடலாம்.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: நானும் உங்களில் நிலைத்திருப்பேன்
  rationale: தமிழில் முழுமையான வாக்கியத்திற்காக விடுபட்டுள்ள μένω கருத்து நிரப்பப்படுகிறது; எதிர்கால வடிவம் தமிழ் கட்டளை–பதில் அமைப்பில் இயல்பாக உள்ளது, ஆனால் கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: τὸ κλῆμα
  choice: ஒரு கொம்பு
  rationale: திராட்சைச் செடியிலிருந்து வளரும் கனிகொடுக்கும் கிளையை சாதாரணத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: கனி கொடுக்க முடியாது
  rationale: δύναμαι என்பதன் இயலாமையையும் καρπὸν φέρειν என்ற வேளாண்மை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀφ’ ἑαυτοῦ
  choice: தானாக
  rationale: தன்னிலிருந்தே அல்லது தனித்துச் செயல்பட்டு என்பதைக் கொம்பு உருவகத்துக்கு ஏற்ற சுருக்கமான தமிழில் தருகிறது.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: திராட்சைக்கொடி செடியில்
  rationale: ἄμπελος என்பது முழுத் திராட்சைத் தாவரத்தைக் குறிக்கும்; கொம்புடன் வேறுபாடு தெளிவாக இருக்க ‘செடி’ சேர்க்கப்பட்டுள்ளது.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: அவ்வாறே, நீங்களும் ... முடியாது
  rationale: முந்தைய οὐ δύναται என்பதிலுள்ள ‘கனி கொடுக்க முடியாது’ என்ற கருத்தைத் தமிழில் வெளிப்படையாக மீண்டும் கூறி ஒப்புமையை நிறைவு செய்கிறது.
theological_decisions:
- issue: சீடத்துவம் மற்றும் இணைவு சூழலில் μένω-வின் பொருள்
  choice: நிலைத்திருங்கள்
  alternative: தங்கியிருங்கள்
  rationale: தொடர்ந்து உறவில் நீடித்திருத்தல், பற்றியிருத்தல் ஆகிய இறையியல் அழுத்தத்தை ‘நிலைத்திருங்கள்’ காக்கிறது; ‘தங்கியிருங்கள்’ இடவியல் பொருளாக மட்டும் கேட்கக்கூடும்.
- issue: κἀγὼ ἐν ὑμῖν என்ற வினைச்சொல்லற்ற பரஸ்பரக் கூற்று
  choice: நானும் உங்களில் நிலைத்திருப்பேன்
  alternative: நானும் உங்களில்
  rationale: மூலத்தில் வினைச்சொல் விடுபட்டிருப்பதை அடிக்குறிப்பில் தெரிவித்து, தமிழில் புரியும் முழு வாக்கியமாக்குகிறது. இது இயேசுவுக்கும் சீடர்களுக்கும் இடையிலான பரஸ்பர நிலைத்திருத்தலை வெளிப்படுத்துகிறது; காலம் குறித்த தெளிவை மூலத்திற்கு மேல் கட்டாயப்படுத்தாமல் மாற்று வடிவமும் குறிப்பிடப்படுகிறது.
- issue: கனி கொடுக்கும் திறனின் சார்பு
  choice: என்னில் நிலைத்திராவிட்டால் கனி கொடுக்க முடியாது
  alternative: என்னில் நிலைத்திராவிட்டால் நீங்களும் முடியாது
  rationale: மூலத்தில் இரண்டாம் பாதியில் ‘கனி கொடுக்க’ என்பது விடுபட்டிருந்தாலும் முந்தைய கூற்றிலிருந்து தெளிவாக எடுத்துக்கொள்ளப்படுகிறது; தமிழில் தெளிவுக்காக அதை மீண்டும் வழங்குகிறது, எந்தக் குறிப்பிட்ட இறையியல் கனியையும் தனியே வரையறுக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘திராட்சைக்கொடி செடி—கொம்பு—கனி’ என்ற உருவகத் தொடர்ச்சி காக்கப்பட்டுள்ளது. ‘என்னில்’ என்பது வெறும் அருகாமையைவிட உள்ளார்ந்த உறவைத் தக்கவைக்கிறது.
