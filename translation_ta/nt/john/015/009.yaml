id: JHN.15.9
reference: John 15:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: ta
  text: தந்தை என்மீது அன்புகூர்ந்திருப்பதுபோல[a], நானும் உங்கள்மீது அன்புகூர்ந்திருக்கிறேன்; என் அன்பில் நிலைத்திருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தந்தை என்மீது அன்புகூர்ந்ததுபோல, நானும் உங்கள்மீது அன்புகூர்ந்தேன்; என் அன்பில் நிலைத்திருங்கள்.” கிரேக்கத்தில் இரு வினைகளும் இறந்தகால வடிவில் உள்ளன; அவற்றைத் தமிழில் எளிய இறந்தகாலத்திலும் மொழிபெயர்க்கலாம். முதன்மை உரை, அந்த அன்பின் தொடரும் பொருத்தத்தைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: …போல
  rationale: தந்தை இயேசுவின்மீது கொண்ட அன்புக்கும் இயேசு சீடர்கள்மீது கொண்ட அன்புக்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἠγάπησέν με
  choice: என்மீது அன்புகூர்ந்திருக்கிறார்
  rationale: கிரேக்க இறந்தகால வினையின் நிகழ்ந்து முடிந்த தன்மையையும், அந்த அன்பின் தொடரும் பொருத்தத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; με என்பதன் செயப்படுபொருள் உறவை ‘என்மீது’ தெளிவாகக் காட்டுகிறது.
- source_word: ὁ πατήρ
  choice: தந்தை
  rationale: யோவான் நற்செய்தியில் கடவுளை இயேசுவின் தந்தையாகக் குறிக்கும் பட்டப்பெயர்சார் பயன்பாட்டைச் சுருக்கமாகவும் மரியாதையாகவும் தருகிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: இணைப்பையும் வலியுறுத்தலையும் ஒப்புமையின் தொடர்ச்சியையும் இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: ὑμᾶς ἠγάπησα
  choice: உங்கள்மீது அன்புகூர்ந்திருக்கிறேன்
  rationale: ὑμᾶς என்பது பன்மை என்பதை ‘உங்கள்’ காக்கிறது; முதல் அன்புக் கூற்றுடன் இணையான வடிவில், கடந்த செயலும் அதன் தொடரும் பொருத்தமும் வெளிப்படுகின்றன.
- source_word: μείνατε
  choice: நிலைத்திருங்கள்
  rationale: μένω என்பதன் யோவானியக் கருத்தான தொடர்ந்து தங்கியிருத்தலை, நவீன தமிழில் கண்ணியமாகவும் தெளிவாகவும் தரும் பன்மை கட்டளை வடிவம்.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: என் அன்பில்
  rationale: சொந்தக்குறிப்பைச் சுருக்கமான இயல்பான தமிழில் காக்கிறது; ‘என் அன்பு’ என்பது இயேசு காட்டும் அன்பையா அவருடன் தொடர்புடைய அன்பின் வட்டத்தையா குறிக்கிறது என்ற உரையின் இயல்பான பரப்பை தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: ἀγάπη என்பதன் மொழிபெயர்ப்பு
  choice: அன்பு
  alternative: நேசம்; தர்ம அன்பு
  rationale: ‘அன்பு’ என்பது நவீன தமிழில் இயல்பானதும் பரந்த பொருளுடையதும் ஆகும்; குறிப்பிட்ட சமய மரபின் தனிப்பட்ட பொருளைச் சேர்க்காது.
- issue: ἠγάπησέν / ἠγάπησα என்ற இரு aorist வினைகளின் கால-காட்சிநிலை
  choice: அன்புகூர்ந்திருக்கிறார் / அன்புகூர்ந்திருக்கிறேன்
  alternative: அன்புகூர்ந்தார் / அன்புகூர்ந்தேன்
  rationale: மூலத்தின் கடந்தகால நோக்கை அழிக்காமல், இந்த உரையாடல் சூழலில் அந்த அன்பின் தொடரும் பொருத்தத்தைத் தமிழில் வெளிப்படுத்துகிறது. எளிய இறந்தகாலமும் இலக்கண ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘என் அன்பில்’ என்ற சொந்தக்குறிப்பின் பொருள்
  choice: தெளிவுபடுத்தாமல் ‘என் அன்பில்’ எனக் காத்தல்
  alternative: நான் உங்கள்மீது கொண்ட அன்பில்; நீங்கள் என்மீது கொண்ட அன்பில்
  rationale: கிரேக்க சொந்தக்குறிப்பு எந்தத் திசையிலான அன்பு என்பதைத் தனியாக விளக்கவில்லை. ஒரு விளக்கத்தை மட்டும் உரைக்குள் புகுத்தாமல் அதன் உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூர்தல்’ உரையின் உயர்ந்த உறவுசார் தொனியைத் தக்கவைக்கிறது; ‘நிலைத்திருங்கள்’ யோவான் 15-இல் மீண்டும் வரும் μένω கருத்தோட்டத்தை ஒரே சொல்லால் தொடர உதவுகிறது.
