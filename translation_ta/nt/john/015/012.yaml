id: JHN.15.12
reference: John 15:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: ta
  text: நான் உங்களிடம் அன்புகூர்ந்ததுபோல, நீங்களும் ஒருவருக்கொருவர் அன்புகூர வேண்டும் என்பதே என் கட்டளை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களிடம் அன்புகூர்ந்திருக்கிறதுபோல, நீங்களும் ஒருவருக்கொருவர் அன்புகூர வேண்டும் என்பதே என் கட்டளை.”
    reason: ἠγάπησα என்பதைத் தமிழில் எளிய இறந்தகாலமாகவோ, கடந்த அன்பின் இன்றைய பொருத்தத்தை வெளிப்படுத்தும் நிகழ்நிறை வடிவமாகவோ இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: என்பதே என் கட்டளை
  rationale: கிரேக்கத்தின் அடையாளப்படுத்தும் வாக்கிய அமைப்பை இயல்பான நவீன தமிழில் தருகிறது; ‘என்’ என்பது இயேசுவின் அதிகாரத்தையும் கட்டளையின் உரிமையையும் காக்கிறது.
- source_word: ἵνα ἀγαπᾶτε
  choice: அன்புகூர வேண்டும் என்பது
  rationale: இங்கு ἵνα கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழ் ‘வேண்டும்’ கட்டளையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது; நிகழ்கால வினை வடிவத்தின் தொடர்ச்சியான நடைமுறையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரச் செயலைத் தெளிவாகவும் இயல்பாகவும் குறிக்கும் நிலையான தமிழ் வடிவம்.
- source_word: καθὼς
  choice: போல
  rationale: இயேசுவின் அன்பை சீடர்களின் அன்பிற்கான முன்மாதிரியாகவும் அளவுகோலாகவும் காட்டும் ஒப்பீட்டை இயல்பாகக் காக்கிறது.
- source_word: ἠγάπησα ὑμᾶς
  choice: நான் உங்களிடம் அன்புகூர்ந்தேன்
  rationale: கிரேக்க இறந்தகால வினையின் நேரடியான மதிப்பைத் தக்கவைக்கிறது. ‘உங்களிடம்’ என்பது தமிழில் அன்பின் இலக்கை இயல்பாகக் குறிக்கிறது; ‘நான்’ வினைச்சொல்லின் எழுவாயை வலியுறுத்துகிறது.
theological_decisions:
- issue: ἀγαπάω என்பதன் மொழிபெயர்ப்பு
  choice: அன்புகூர்
  alternative: நேசி
  rationale: ‘அன்புகூர்’ என்பது dignified ஆனாலும் புரிந்துகொள்ளக்கூடிய நவீனத் தமிழ்; இப்பகுதியில் அன்பு சார்ந்த சொல் தொடர்ச்சியையும் காக்கிறது. குறிப்பிட்ட தனிப்பட்ட அல்லது சமயப்பிரிவு சார்ந்த அன்புக் கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: இயேசுவின் அன்பைக் குறிக்கும் ἠγάπησα என்பதன் காலவியல்
  choice: அன்புகூர்ந்தேன்
  alternative: அன்புகூர்ந்திருக்கிறேன்
  rationale: அோரிஸ்ட் வடிவத்தை நேரடியாக இறந்தகாலத்தில் தருகிறது; சூழலில் அதன் தொடரும் பொருத்தம் இருப்பதை மறுப்பதில்லை. நிகழ்நிறை வடிவமும் தமிழில் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- issue: கட்டளையின் அதிகார வலிமை
  choice: வேண்டும் என்பதே என் கட்டளை
  alternative: அன்புகூருங்கள்; இதுவே என் கட்டளை
  rationale: ἵνα அறிமுகப்படுத்தும் கட்டளையின் உள்ளடக்கத்தையும் ‘என் கட்டளை’ என்ற இயேசுவின் அதிகார உரிமையையும் காக்கிறது; மூலத்தில் இல்லாத நேரடி ஏவல் வடிவமாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையும் உரைநடைக் கண்ணியமும் கொண்ட நடை. ‘கட்டளை’, ‘அன்புகூர்’, ‘ஒருவருக்கொருவர்’ ஆகியவை யோவான் உரையின் அதிகாரம், சொல் தொடர்ச்சி, பரஸ்பரத் தன்மை ஆகியவற்றைத் தெளிவாகக் காக்கின்றன.
