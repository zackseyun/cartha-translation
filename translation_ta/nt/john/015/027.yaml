  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: ta
  text: நீங்களும் சாட்சி கூறுகிறீர்கள்[a]; ஏனெனில் தொடக்கத்திலிருந்தே என்னோடு இருக்கிறீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்களும் சாட்சி கூறுங்கள்.” கிரேக்க வினைவடிவம் கூற்றாகவும் கட்டளையாகவும் வாசிக்கப்படலாம்.
    reason: grammatical_alternative
  - marker: b
    text: “தொடக்கம்” என்பது இச்சூழலில் சீடர்கள் இயேசுவோடு இருந்த காலத்தின் தொடக்கத்தைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்; மூலவாசகம் அதை மேலும் குறிப்பாக வரையறுக்கவில்லை.
    reason: contextual_clarification
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: நீங்களும்
  rationale: முந்தைய வசனத்தில் தூய ஆவியானவர் சாட்சி கூறுவதோடு சீடர்களும் சாட்சி கூறுவதை, வலியுறுத்தப்பட்ட ὑμεῖς மற்றும் தொடர்ச்சி/மென்மையான மாறுபாட்டைக் காட்டும் δὲ ஆகியவற்றின் பொருளுடன் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μαρτυρεῖτε
  choice: சாட்சி கூறுகிறீர்கள்
  rationale: சான்றளித்தல் அல்லது சாட்சி பகர்தல் என்ற தடயவியல் சார்ந்த பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது. இவ்வடிவம் இலக்கணரீதியாகக் கட்டளையாகவும் வாசிக்கப்படக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: சீடர்கள் சாட்சி கூறுவதற்கான காரணத்தை அறிமுகப்படுத்தும் இயல்பான பொருள் இதுவாகும்.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்தே
  rationale: ‘தொடக்கத்திலிருந்து’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘-ஏ’ தொடர்ந்த உடனிருப்பை வலியுறுத்துகிறது, ஆனால் எந்தத் தொடக்கம் என்பதை மொழிபெயர்ப்பில் குறிப்பாக நிர்ணயிக்கவில்லை.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: உடனிருப்பையும் தொடர்பையும் எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐστε
  choice: இருக்கிறீர்கள்
  rationale: கிரேக்க நிகழ்காலத்தை முறையாகப் பின்பற்றுகிறது. ‘தொடக்கத்திலிருந்தே’ என்பதுடன் தமிழில் இது கடந்தகாலத்தில் தொடங்கி இப்போதும் தொடரும் நிலையை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ‘தொடக்கத்திலிருந்தே’ என்பதன் வரம்பு
  choice: எந்தத் தொடக்கம் என்பதை விளக்கிச் சேர்க்காமல் மூலத்தின் பொதுவான சொல்லாட்சியே வைக்கப்பட்டுள்ளது.
  alternative: இயேசுவின் பொதுப்பணியின் தொடக்கத்திலிருந்து என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: உடனடி சூழல் சீடர்கள் இயேசுவோடு வரலாற்றில் உடனிருந்ததைச் சுட்டினாலும், மூலவாசகம் ‘தொடக்கம்’ என்பதை அதற்கு மேல் வரையறுக்கவில்லை.
- issue: μαρτυρεῖτε என்பதன் வினைமுறை
  choice: ‘சாட்சி கூறுகிறீர்கள்’ என்ற கூற்றாக முதன்மை உரையில் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘நீங்களும் சாட்சி கூறுங்கள்’ என்ற கட்டளையாக வாசித்தல்.
  rationale: சூழலும் ஆலோசனை அடுக்கான ஆங்கில உரையும் கூற்றை ஆதரிக்கின்றன; எனினும் கிரேக்க வடிவம் நிகழ்காலக் கூற்றாகவும் கட்டளையாகவும் ஒரே வடிவில் இருப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சியளிக்கிறீர்கள்’ என்பதைக் காட்டிலும் ‘சாட்சி கூறுகிறீர்கள்’ இயல்பாகவும் தெளிவாகவும் இருப்பதால் தேர்ந்தெடுக்கப்பட்டது; கிரேக்க நிகழ்காலத்தின் தொடர்நிலையை தமிழ் நிகழ்காலமே நன்றாகத் தருகிறது.
