revisions:
- from: நான் உங்களிடம் பேசிய வார்த்தையினால் நீங்கள் ஏற்கெனவே சுத்தமானவர்களாய் இருக்கிறீர்கள்.[a]
  to: நான் உங்களிடம் பேசிய வார்த்தையின் காரணமாக நீங்கள் ஏற்கெனவே சுத்தமானவர்கள்.[a]
  rationale: The revision makes the causal force of διά + accusative explicit in the main text, while retaining a natural Tamil alternative corresponding to the English audit trail’s ‘through the word.’ It preserves the metaphorical and theological openness of ‘clean.’
