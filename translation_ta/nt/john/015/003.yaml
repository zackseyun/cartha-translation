  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: ta
  text: நான் உங்களிடம் பேசிய வார்த்தையின் காரணமாக நீங்கள் ஏற்கெனவே சுத்தமானவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களிடம் பேசிய வார்த்தையினால்.”
    reason: ‘வார்த்தையினால்’ என்பது தமிழில் வார்த்தையின் வழியாக அல்லது அதன் காரணமாக என்ற நுணுக்கத்தைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: தற்போது நிலவிவரும் ஒரு நிலையைச் சுட்டுகிறது; சுற்றியுள்ள சுத்தப்படுத்துதல்/கிளைகழித்தல் உருவகத்துடன் இயல்பாகப் பொருந்துகிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வலியுறுத்தலுக்காக வெளிப்படையாக வந்துள்ள பன்மைப் பெயர்ச்சொல்; தமிழில் எழுவாயை வெளிப்படையாகக் கூறுவதால் அந்த வலியுறுத்தல் ஓரளவு காக்கப்படுகிறது.
- source_word: καθαροί
  choice: சுத்தமானவர்களாய்
  rationale: ‘தூயவர்கள்’ என்பதைக் காட்டிலும், முந்தைய வசனத்தின் καθαίρει என்ற சுத்தப்படுத்துதல்/கிளைகழித்தல் சொல்லுடன் உள்ள சொல் மற்றும் உருவகத் தொடர்பை இது நன்றாகக் காக்கிறது.
- source_word: διὰ τὸν λόγον
  choice: வார்த்தையினால்
  rationale: διά + வேற்றுமை உருபு இங்கு காரணத்தையோ வழிமுறையையோ குறிக்கலாம்; ‘-இனால்’ இரு நுணுக்கங்களையும் இயல்பாகத் தாங்கி, மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: λόγον
  choice: வார்த்தை
  rationale: யோவானின் சொற்பயன்பாட்டை நேரடியாகக் காக்கிறது; ‘செய்தி’ அல்லது ‘போதனை’ என்பவை சற்றே விளக்கவுரையானவை.
- source_word: ὃν λελάληκα ὑμῖν
  choice: நான் உங்களிடம் பேசிய
  rationale: λελάληκα என்பதின் நிறைவேற்றப்பட்ட செயலும் தொடரும் விளைவும் தமிழ் உறவெச்ச அமைப்பில் இயல்பாக வெளிப்படுகிறது; ὑμῖν என்பதற்கு ‘உங்களிடம்’ நடப்பு தமிழில் பொருத்தமானது.
theological_decisions:
- issue: சீடர்களின் சுத்தத்தின் தன்மை
  choice: அவர்கள் இப்போது சுத்தமானவர்களாய் இருப்பதாக உருவக மொழியிலேயே மொழிபெயர்த்தல்
  alternative: இதனை குறிப்பாகத் திருச்சடங்கு சுத்திகரிப்பு அல்லது நீதிமானாக்குதல் என்ற தொழில்நுட்பக் கோட்பாட்டுச் சொல்லால் விளக்குதல்
  rationale: உடனடி சூழல் திராட்சைக்கொடி, கிளைகழித்தல், சுத்தப்படுத்துதல் ஆகிய உருவகங்களைப் பயன்படுத்துகிறது; அந்த இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு குறுக்கக்கூடாது.
- issue: διά என்பதின் காரணம்/வழிமுறை நுணுக்கம்
  choice: ‘வார்த்தையினால்’ என்று இரு சாத்தியங்களுக்கும் இடமளித்தல்
  alternative: ‘வார்த்தையின் காரணமாக’ என்று காரணப் பொருளை மட்டும் வெளிப்படையாகத் தேர்ந்தெடுத்தல்
  rationale: இச்சூழலில் காரணப் பொருள் வலுவாக இருந்தாலும், கிரேக்கத் தொடர் வழிமுறை நுணுக்கத்தையும் அனுமதிக்கிறது; தமிழ் ‘-இனால்’ இந்தத் தெய்வவியல் மற்றும் இலக்கணத் தளர்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிய புரிதலும் கொண்ட நடை. ‘சுத்தமானவர்களாய்’ என்பது உடல் சுத்தத்தை மட்டும் குறிக்காமல் சூழலின் உருவகப் பொருளையும் தாங்குகிறது. வசன முடிவில் [a] குறியீடு இடம்பெற்றுள்ளது.
