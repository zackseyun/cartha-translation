  source_fidelity: மூலக் கிரேக்கத்தின் எதிர்மறை இணைப்பு (ἀλλὰ), எதிர்கால வினை, ‘இவை அனைத்தும்’ என்ற முழுமை, சீடர்களை நோக்கிய εἰς ὑμᾶς, ‘என் பெயரின் காரணமாக’ என்ற காரணவியல், மற்றும் ‘என்னை அனுப்பியவர்’ என்ற மறைமுகக் குறிப்பு ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அறியவில்லை’ என்பது οὐκ οἴδασιν-ன் நிகழ்கால உறவுசார் அறியாமையை நவீன தமிழில் ஏற்றவாறு வெளிப்படுத்துகிறது.
  naturalness: ‘இவை அனைத்தையும் உங்களுக்குச் செய்வார்கள்’ என்பது வேதாகமக் கண்ணியத்துடனும் நவீன பொதுத்தமிழிலும் புரியத்தக்க வகையிலும் உள்ளது. வாக்கியப் பிரிப்பு மற்றும் ‘ஏனெனில்’ பயன்பாடு காரண விளக்கத்தைத் தெளிவாக்குகின்றன.
  terminology: ‘என் பெயர்’ ὄνομα-வின் யோவானிய பிரதிநிதித்துவப் பொருளைத் தேவையின்றி விளக்கமாக்காமல் காக்கிறது. ‘என்னை அனுப்பியவர்’ மூலத்தில் வெளிப்படையாக இல்லாத ‘பிதா’ என்ற சொல்லைச் சேர்க்காமல் துல்லியமாக உள்ளது. அடிக்குறிப்பு ‘உங்களுக்கு எதிராக’ என்ற சூழலுக்கேற்ற மாற்றைச் சரியாகக் குறிக்கிறது.
