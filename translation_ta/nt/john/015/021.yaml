id: JHN.15.21
reference: John 15:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: ta
  text: ஆனால் என் பெயரின் காரணமாக இவை அனைத்தையும் உங்களுக்குச் செய்வார்கள்[a]. ஏனெனில், என்னை அனுப்பியவரை அவர்கள் அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு எதிராகச் செய்வார்கள்.” கிரேக்கச் சொற்றொடர் சீடர்களை நோக்கிப் பகைமையுடன் செய்யப்படும் செயல்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: சுட்டுப்பெயரின் குறிப்புத்தன்மையையும் πᾶς தரும் முழுமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ποιήσουσιν
  choice: செய்வார்கள்
  rationale: எதிர்காலச் செயலை நேரடியாகக் காட்டுகிறது; வினையின் பரந்த பொருளைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்குச்
  rationale: சீடர்களை நோக்கிச் செய்யப்படும் செயல்களைக் குறிக்கும் பரந்த வாசிப்பைப் பாதுகாக்கிறது; சூழலில் பகைமை இருந்தாலும் அதை முதன்மை உரையில் மிகைப்படுத்தவில்லை.
- source_word: διὰ τὸ ὄνομά μου
  choice: என் பெயரின் காரணமாக
  rationale: διά + accusative குறிக்கும் காரணத்தைத் தெளிவாகக் காட்டுவதோடு, ὄνομα என்பதன் பிரதிநிதித்துவ மற்றும் உறவுசார் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: ὄνομά
  choice: பெயர்
  rationale: வெறும் புகழ் அல்லது நற்பெயர் என்று சுருக்காமல், இயேசுவின் ஆளுமை மற்றும் அடையாளத்தைக் குறிக்கும் யோவானிய சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அவர்கள் செய்யும் செயல்களுக்கான விளக்கக் காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: οὐκ οἴδασιν
  choice: அவர்கள் அறியவில்லை
  rationale: தகவல் அறிவை மட்டுமல்ல, உறவுசார் அறிதலையும் உள்ளடக்கக்கூடிய எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: τὸν πέμψαντά με
  choice: என்னை அனுப்பியவரை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்பு வடிவத்தை இயல்பாகத் தருகிறது; மூலத்தில் இல்லாத ‘பிதா’ என்ற பட்டத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘என்னை அனுப்பியவர்’ என்பவரின் குறிப்பு
  choice: மூலத்தில் உள்ளபடி ‘என்னை அனுப்பியவர்’ என மறைமுகமாகவே வைத்தல்
  alternative: ‘என்னை அனுப்பிய பிதா’ என்று வெளிப்படையாக்குதல்
  rationale: யோவான் நற்செய்தியின் சூழலில் குறிப்பு பிதாவைச் சுட்டுவது தெளிவாக இருந்தாலும், கிரேக்க உரையில் ‘பிதா’ என்ற பெயர்ச்சொல் இல்லை. ஆகவே மறைமுகக் குறிப்பை அப்படியே பாதுகாக்கிறது.
- issue: εἰς ὑμᾶς என்பதன் பகைமைத் திசை
  choice: முதன்மை உரையில் ‘உங்களுக்குச்’ என்று பரந்த பொருளில் தருதல்
  alternative: ‘உங்களுக்கு எதிராக’ என்று வெளிப்படையான பகைமைப் பொருளில் தருதல்
  rationale: சூழல் துன்புறுத்தலைக் குறிப்பதால் பகைமைப் பொருள் உண்மையானது; எனினும் εἰς தானாகவே ‘எதிராக’ என்பதை மட்டும் கட்டாயப்படுத்தாது. அந்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘பெயர்,’ ‘அறியவில்லை,’ ‘என்னை அனுப்பியவர்’ ஆகிய மூல உருவகங்களும் யோவானிய இறையியல் நுணுக்கங்களும் விளக்கச் சேர்க்கையின்றிப் பாதுகாக்கப்பட்டுள்ளன.
