  source_fidelity: 'மூல கிரேக்கத்தின் ταῦτα (பன்மை: “இவற்றை”), ἐντέλλομαι ("கட்டளையிடுகிறேன்"), ὑμῖν ("உங்களுக்குக்"), மற்றும் ἵνα-வின் நோக்க/விளைவு நுணுக்கம் ஆகியவை உரையில் துல்லியமாகப் பேணப்பட்டுள்ளன. “ஒருவருக்கொருவர் அன்புகூரும்படி” என்பது ἀγαπᾶτε ἀλλήλους என்பதற்குச் சரியானதும், தேவையற்ற தொடர்நிலை அல்லது கட்டாய நுணுக்கத்தைச் சேர்க்காததுமாகும்.'
  naturalness: வாக்கிய அமைப்பு நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது. “அன்புகூரும்படி” சற்றே உயர்நடையாக இருந்தாலும், இச்சூழலில் இயல்பாகப் புரியக்கூடிய நிறுவப்பட்ட பயன்பாடாகும். தொடக்கத்தில் உள்ள “நீங்கள்” நோக்கத் தொடரின் செய்பவர்களைத் தெளிவாக்குகிறது.
