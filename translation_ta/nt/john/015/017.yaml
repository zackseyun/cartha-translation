  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: ta
  text: நீங்கள் ஒருவருக்கொருவர் அன்புகூரும்படி, இவற்றை நான் உங்களுக்குக் கட்டளையிடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இவற்றை நான் உங்களுக்குக் கட்டளையிடுகிறேன்: ஒருவருக்கொருவர் அன்புகூருங்கள்.” கிரேக்கத் தொடர் நோக்கத்தைக் குறிப்பதாகவோ, கட்டளையின் உள்ளடக்கத்தை விளக்குவதாகவோ புரிந்துகொள்ளப்படலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: இது பன்மைச் சுட்டுப்பெயர் என்பதால், முந்தைய அறிவுறுத்தல்களைச் சுட்டும் பன்மைப் பொருளைத் தெளிவாகப் பேணுகிறது.
- source_word: ἐντέλλομαι
  choice: கட்டளையிடுகிறேன்
  rationale: கட்டளையிடுதல் அல்லது ஆணையிடுதல் என்ற நேரடியான வலிமையையும், நிகழ்கால உரையாடல் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் பன்மை வேற்றுமைப் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: ἵνα
  choice: அன்புகூரும்படி
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை ‘-ம்படி’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; அதேவேளையில் உள்ளடக்கப் பொருளுக்கு அருகிலுள்ள மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀγαπᾶτε
  choice: அன்புகூர
  rationale: ἀγαπάω என்பதன் பொருளை கண்ணியமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழில் தருகிறது; தொடர்ச்சியை அளவுக்கு மீறி வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: சீடர் குழுவினரிடையே உள்ள பரஸ்பரச் செயலை இயல்பான நவீன தமிழில் குறிக்கிறது.
theological_decisions:
- issue: கட்டளைக்கும் ἵνα தொடருக்கும் இடையிலான உறவு
  choice: இயேசு இவற்றைக் கட்டளையிடுவதன் நோக்கம் சீடர்கள் ஒருவருக்கொருவர் அன்புகூர வேண்டும் என்பதாக முதன்மை உரை காட்டுகிறது.
  alternative: '‘இவற்றை நான் உங்களுக்குக் கட்டளையிடுகிறேன்: ஒருவருக்கொருவர் அன்புகூருங்கள்’ என்று கட்டளையின் உள்ளடக்கமாகவும் புரிந்துகொள்ளலாம்.'
  rationale: ἵνα பொதுவாக நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைக் குறித்தாலும், யோவானின் நடையில் அது கட்டளையின் உள்ளடக்கத்தை விளக்கும் பொருளுக்கு நெருங்கக்கூடும். முதன்மை உரை நோக்கப் பொருளைப் பேணுகிறது; மாற்றுப் புரிதலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவற்றை’ என்ற பன்மை மூலமொழியின் சுட்டுப்பெயரைப் பேணுகிறது; ‘ஒருவருக்கொருவர் அன்புகூரும்படி’ என்பது இயல்பான தமிழ் வாக்கிய அமைப்பில் நோக்கப் பொருளை வெளிப்படுத்துகிறது.
