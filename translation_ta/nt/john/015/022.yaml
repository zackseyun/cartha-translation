base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: ta
  text: நான் வந்து அவர்களிடம் பேசியிருக்காவிட்டால், அவர்களுக்குப் பாவம் இருந்திருக்காது[a]. ஆனால் இப்போதோ, அவர்களுடைய பாவத்தைப் பற்றி அவர்களுக்குச் சாக்குப்போக்கு எதுவும் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு பாவக் குற்றம் இருந்திருக்காது.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “அவர்களுக்குப் பாவம் இருந்திருக்காது.”
    reason: lexical_alternative
  - marker: b
    text: “சாக்குப்போக்கு” என்பதற்கு “சாக்கு” அல்லது “போலிக் காரணம்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: நான் வந்து அவர்களிடம் பேசியிருக்காவிட்டால்
  rationale: கடந்தகாலத்தில் நிகழாத ஒன்றை முன்வைக்கும் எதிர்நிலை நிபந்தனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘வந்து’ மற்றும் ‘பேசியிருக்காவிட்டால்’ என்பவை இரு கிரேக்க வினைகளையும் காக்கின்றன.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: அவர்களுக்குப் பாவம் இருந்திருக்காது
  rationale: ‘பாவம் கொண்டிருத்தல்’ என்ற யோவானியச் சொல்லாட்சியைத் தமிழில் இயல்பாகக் காக்கிறது; ‘குற்றவாளிகளாக இருந்திருக்கமாட்டார்கள்’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: கற்பனையான கடந்த நிலைக்கும் தற்போதைய உண்மை நிலைக்கும் இடையிலான கூர்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: எந்தச் சாக்குப்போக்கும் இல்லை
  rationale: πρόφασις என்பதன் ‘சாக்கு/போலிக் காரணம்’ என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; வெறும் ‘காரணம்’ என்பதைக் காட்டிலும் எதிர்மறை நுண்பொருளைக் காக்கிறது.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: தங்கள் பாவத்தைப் பற்றிச் சொல்ல
  rationale: περί + genitive என்பதன் ‘பற்றி/குறித்து’ என்ற தொடர்பைத் தக்கவைத்து, ‘சாக்குப்போக்கு இல்லை’ என்பதுடன் இயல்பான தமிழ் தொடரை உருவாக்குகிறது.
theological_decisions:
- issue: ἁμαρτίαν οὐκ εἴχοσαν என்பது முழுமையான பாவமின்மையையா, இயேசுவின் வெளிப்பாட்டை நிராகரித்ததற்கான குற்றப்பொறுப்பு இல்லாமையையா குறிக்கிறது?
  choice: அவர்களுக்குப் பாவம் இருந்திருக்காது
  alternative: இந்தப் பாவத்திற்காக அவர்கள் குற்றவாளிகளாக இருந்திருக்கமாட்டார்கள்
  rationale: உடனடிச் சூழல் இயேசு வந்து பேசிய பின்னர் அவரை நிராகரித்ததற்கான பொறுப்பைக் குறித்தாலும், கிரேக்கம் நேரடியாக ‘பாவம் இருந்திருக்காது’ என்கிறது. ஆகவே இறையியல் இழுபறியைத் தீர்மானித்து விடாமல் மூலச் சொல்லாட்சியை முதன்மை உரையில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பாவம் இருந்திருக்காது’ என்ற சற்று தனித்துவமான யோவானியச் சொல்லாட்சி நோக்கத்துடன் காக்கப்பட்டுள்ளது.
