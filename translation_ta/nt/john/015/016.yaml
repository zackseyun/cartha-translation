id: JHN.15.16
reference: John 15:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: ta
  text: நீங்கள் என்னைத் தேர்ந்தெடுக்கவில்லை[a]; நான்தான் உங்களைத் தேர்ந்தெடுத்து நியமித்தேன்—நீங்கள் போய்க் கனி கொடுக்கவும், உங்கள் கனி நிலைத்திருக்கவும்[b], என் பெயரில் நீங்கள் பிதாவிடம்[c] எதைக் கேட்டாலும் அவர் உங்களுக்குக் கொடுக்கும்படியாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேர்ந்தெடுக்க’ என்பதற்கு ‘தெரிந்துகொள்ள’ அல்லது ‘தேர்வு செய்ய’ என்றும் மொழிபெயர்க்கலாம். இங்கு பிற்கால இறையியல் கலைச்சொல்லை முதன்மை உரைக்குள் சேர்க்காமல், உடனடிச் சூழலுக்கு இயல்பாக இருப்பதால் ‘தேர்ந்தெடுக்க’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தங்கியிருக்கவும்’ என்றும் மொழிபெயர்க்கலாம். யோவான் இந்த வினைச்சொல்லை உறவில் தொடர்தல் அல்லது காலப்போக்கில் நீடித்தல் என்ற பொருள்களில் அடிக்கடி பயன்படுத்துகிறார்; இங்கு நவீனத் தமிழில் தெளிவாக இருக்க ‘நிலைத்திருக்கவும்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க உரையில் ‘பிதா’ என்றே உள்ளது; ‘என் பிதா’ என்று இல்லை.
    reason: textual_clarification
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: தேர்ந்தெடுக்கவில்லை / தேர்ந்தெடுத்தேன்
  rationale: ἐκλέγομαι என்பதன் இயல்பான பொருள் ‘தேர்ந்தெடு’. உடனடிச் சூழலில் உள்ள சீடத்துவம் மற்றும் பணியனுப்புதலின் எதிர்மறை–நேர்மறை முரணை இது தெளிவாகக் காக்கிறது; பிற்கால இறையியல் கலைச்சொல்லை முதன்மை உரைக்குள் திணிப்பதையும் தவிர்க்கிறது.
- source_word: ἔθηκα
  choice: நியமித்தேன்
  rationale: τίθημι அடிப்படையில் ‘வை’ அல்லது ‘நிறுத்து’ எனப் பொருள்படலாம். இங்கு போதல், கனி கொடுத்தல் ஆகிய நோக்கங்களுக்காகச் சீடர்களை அமைத்தல் அல்லது பொறுப்பளித்தல் குறிக்கப்படுவதால் ‘நியமித்தேன்’ தெளிவான நவீனத் தமிழாக உள்ளது; இதை ஒரு குறிப்பிட்ட திருச்சபைப் பதவிக்கான அருட்பொழிவாகக் குறுக்குவதில்லை.
- source_word: ἵνα
  choice: …வும் / அப்படிச் செய்தேன்
  rationale: இரு ἵνα தொடர்களின் நோக்கச் சார்பைத் தமிழில் இயல்பாக வெளிப்படுத்த, இணையான ‘…வும்’ அமைப்புகளும் அவற்றை முன்னைய ‘தேர்ந்தெடுத்து நியமித்தேன்’ என்பதோடு இணைக்கும் ‘அப்படிச் செய்தேன்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ὑπάγητε
  choice: போய்
  rationale: ὑπάγω என்பது போதல் அல்லது புறப்படுதல் என்று பொருள்படும். இங்கு பணி அல்லது செயல்பாட்டிற்குச் செல்வதை உள்ளடக்கக்கூடிய, ஆனால் தேவையின்றி அதை விளக்காத பரந்த இயல்பான சொல்லாக ‘போய்’ உள்ளது.
- source_word: καρπὸν φέρητε
  choice: கனி கொடுக்கவும்
  rationale: யோவான் நற்செய்தியில் தொடரும் கனி உருவகத்தைத் தமிழில் வழக்கமான வேதாகம மற்றும் பொதுப் பயன்பாட்டுடன் காக்கிறது.
- source_word: μένῃ
  choice: நிலைத்திருக்கவும்
  rationale: μένω என்பது தங்குதல், தொடர்தல், நிலைத்திருத்தல் ஆகிய கருத்துகளைக் கொண்ட யோவானிய முக்கியச் சொல். இங்கு கனியின் நீடித்த தன்மையை இயல்பாகத் தெரிவிக்க ‘நிலைத்திருக்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: எதைக் கேட்டாலும்
  rationale: ὅ τι ἂν தரும் வரையறுக்கப்படாத பரப்பை ‘எதைக்…ஆலும்’ இயல்பாக வெளிப்படுத்துகிறது; ஜெபச் சூழலில் αἰτέω என்பதற்கு ‘கேள்’ பொருத்தமானது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: சொற்றொடரின் இறையியல் மற்றும் உறவுசார் செறிவை அதிக விளக்கமின்றிக் காக்கும் நிலையான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: δῷ
  choice: கொடுக்கவும்
  rationale: இறுதி ἵνα உட்பிரிவிலுள்ள aorist subjunctive-ன் நோக்கம்/விளைவு சார்பை எளிய எதிர்கால வாக்குறுதியாக மாற்றாமல், ‘…கொடுக்கவும் அப்படிச் செய்தேன்’ என்ற கட்டமைப்பு காக்கிறது.
- source_word: τὸν πατέρα
  choice: பிதாவிடம்
  rationale: கிரேக்கத்தில் உள்ள ‘the Father’ என்பதையே பின்பற்றுகிறது; ‘என் பிதா’ என்று உரையில் இல்லாத உடைமைத் தொடர்பைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ἐξελεξάμην என்பதைத் தொழில்நுட்பமான ‘தேர்ந்தெடுத்தல்’ கோட்பாட்டுச் சொல்லாக வாசிக்கும் சாத்தியம்
  choice: உடனடியான சீடத்துவம் மற்றும் பணியனுப்புதல் சூழலில் ‘நான்தான் உங்களைத் தேர்ந்தெடுத்தேன்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ஒரு பிற்கால முறைமை இறையியல் கருத்தை முன்னிறுத்தும் தொழில்நுட்பச் சொல்லைப் பயன்படுத்துதல்.
  rationale: வசனம் இயேசுவின் முன்முயற்சியைத் தெளிவாகக் கூறுகிறது; ஆனால் கிரேக்க வினைச்சொல் தானாகவே பிற்கால முறைமை இறையியலின் முழுக் கருத்தையும் குறிக்கவில்லை. ஆகவே உரையின் வலிமையும் விளக்கத் திறந்த தன்மையும் இரண்டும் காக்கப்படுகின்றன.
- issue: ἔθηκα ὑμᾶς என்பதன் பொருள்
  choice: பணி மற்றும் கனி கொடுத்தலுக்கான நியமனம் அல்லது பொறுப்பளித்தல் எனப் புரிந்துகொள்ளப்பட்டது.
  alternative: ‘உங்களை வைத்தேன்’ என்ற மிக நேரடி வடிவம் அல்லது ஒரு குறிப்பிட்ட திருச்சபைப் பதவிக்கான அருட்பொழிவு எனக் குறுக்குதல்.
  rationale: தொடரும் நோக்க வாக்கியங்கள் போதல், கனி கொடுத்தல், ஜெபித்தல் ஆகியவற்றைச் சுட்டுகின்றன. ‘நியமித்தேன்’ நோக்கமுள்ள அமைத்தலைத் தெரிவிக்கிறது; பதவிசார் பொருளைத் தேவையின்றிச் சேர்ப்பதில்லை.
- issue: இறுதி ἵνα உட்பிரிவின் வலிமை
  choice: முதன்மை வினையோடு இணைந்த நோக்கம்/விளைவு உட்பிரிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் உங்களுக்குக் கொடுப்பார்’ என்ற தனித்த, நிபந்தனையற்ற நேரடி எதிர்கால வாக்குறுதியாக மாற்றுதல்.
  rationale: கிரேக்க இலக்கணம் ஜெபம் குறித்த கூற்றை நியமித்தல் மற்றும் கனி கொடுத்தலோடு ἵνα மூலம் இணைக்கிறது. தமிழ் கட்டமைப்பு அந்தச் சார்பைத் தக்கவைத்து, அதைத் தனியான சூத்திரமாகத் தட்டையாக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் இலக்கிய ஓட்டமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘நான்தான்’ என்பது οὐχ ὑμεῖς … ἀλλ’ ἐγώ என்ற வலியுறுத்தப்பட்ட முரணைக் காக்கிறது. நீண்ட கிரேக்க வாக்கியத்தின் தர்க்க ஓட்டத்தைத் தக்கவைத்தபடியே, கோடு மற்றும் ‘அப்படிச் செய்தேன்’ மூலம் தமிழ் வாசிப்புத் தெளிவு வழங்கப்பட்டுள்ளது.
