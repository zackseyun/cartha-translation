id: JHN.15.15
reference: John 15:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: ta
  text: இனிமேல் நான் உங்களை அடிமைகள்[a] என்று அழைப்பதில்லை; ஏனெனில், தன் எஜமான்[b] என்ன செய்கிறார் என்பது அடிமைக்குத் தெரியாது. ஆனால் நான் உங்களை நண்பர்கள் என்று அழைத்திருக்கிறேன்; ஏனெனில், என் தந்தையிடமிருந்து நான் கேட்ட அனைத்தையும் உங்களுக்குத் தெரியப்படுத்தினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊழியர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் δοῦλος ஓர் ஊழியரையோ அடிமையையோ குறிக்கலாம்; இங்கு நண்பர்களுடன் செய்யப்படும் வேறுபாடு கீழ்ப்பட்ட நிலையைக் குறிப்பதால் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் κύριος ‘ஆண்டவர்’ அல்லது ‘எஜமான்’ என்று பொருள்படலாம்; இங்கு அடிமை–எஜமான் உறவைக் குறிக்கும் ஒப்புமை இருப்பதால் ‘எஜமான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: இனி ... இல்லை
  rationale: முன்பு இருந்த நிலை இப்போது தொடரவில்லை என்பதைக் காட்டும் கால மறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμᾶς
  choice: உங்களை ... என்று அழைப்பதில்லை
  rationale: இங்கு λέγω ஒருவரை ஒரு பெயரால் அல்லது நிலையால் குறிப்பிடும் பொருளில் வருகிறது; நிகழ்கால வினையின் வலிமையும் காக்கப்படுகிறது.
- source_word: δούλους / δοῦλος
  choice: அடிமைகள் / அடிமை
  rationale: நண்பர்களுக்கு எதிராகக் காட்டப்படும் கீழ்ப்பட்ட சமூக நிலையையும், எஜமானின் செயல்களை அறியாத நிலையையும் ‘அடிமை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: οἶδεν τί ποιεῖ
  choice: என்ன செய்கிறார் என்பது ... தெரியாது
  rationale: οἶδα அறிவதைக் குறிக்கிறது; நிகழ்கால ποιεῖ எஜமான் செய்து கொண்டிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτοῦ ὁ κύριος
  choice: தன் எஜமான்
  rationale: இங்கு κύριος தெய்வீகப் பட்டப்பெயராக அல்லாமல் அடிமை உறவிலுள்ள அதிகாரியைக் குறிக்கிறது; ‘தன்’ என்பது αὐτοῦ-வின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἴρηκα
  choice: அழைத்திருக்கிறேன்
  rationale: கிரேக்க நிறைவுக்காலம், முன்பு வழங்கப்பட்ட ‘நண்பர்கள்’ என்ற அழைப்பு இப்போதும் நிலைப்பதை உணர்த்துகிறது.
- source_word: φίλους
  choice: நண்பர்கள்
  rationale: பகிரப்பட்ட அறிவினால் உருவாகும் நெருக்கத்தையும், அடிமைகள் என்பதற்கு எதிரான உறவையும் நேரடியாகக் காட்டுகிறது.
- source_word: πάντα ἃ
  choice: அனைத்தையும்
  rationale: தந்தையிடமிருந்து கேட்டவற்றின் முழுமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: என் தந்தையிடமிருந்து நான் கேட்ட
  rationale: ἀκούω என்பதன் ‘கேள்’ என்ற நேரடியான பொருளையும், παρά உடன் வரும் மூலத்தைக் குறிக்கும் ‘இடமிருந்து’ என்ற உறவையும் காக்கிறது.
- source_word: ἐγνώρισα ὑμῖν
  choice: உங்களுக்குத் தெரியப்படுத்தியிருக்கிறேன்
  rationale: γνωρίζω என்பதன் ‘அறியச் செய்’ என்ற பொருளைத் தெளிவாகத் தருகிறது. கிரேக்கத்தில் இது இறந்தகால நிறைவேற்றுச் செயலைக் குறிக்கும் அஓரிஸ்ட் வடிவம்; தமிழின் இவ்வடிவு அந்தச் செயல் முடிந்ததையும் அதன் விளைவு தொடர்வதையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: சீடர்களின் நிலையைச் சுட்டும் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: ஊழியர் / பணியாளர்
  rationale: இவ்வசனத்தின் எதிர்மறை இணை ‘நண்பர்கள்’ என்பதாகும். மேலும், எஜமானின் நோக்கங்களை அறியாத கீழ்ப்பட்ட நிலை வலியுறுத்தப்படுவதால், சமூக அசமத்துவத்தையும் கட்டுப்பட்ட நிலையையும் ‘அடிமை’ மறைக்காமல் காக்கிறது.
- issue: வீட்டு-சமூக ஒப்புமையில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இங்கு இது இயேசுவுக்கான தெய்வீக அல்லது மேசியப் பட்டப்பெயர் அல்ல; அடிமைக்கு மேலுள்ள அதிகாரியைக் குறிக்கிறது. ஆகவே ‘எஜமான்’ ஒப்புமையைத் தெளிவாகக் காக்கிறது.
- issue: εἴρηκα மற்றும் ἐγνώρισα ஆகியவற்றின் காலம் மற்றும் விளைவு
  choice: அழைத்திருக்கிறேன் ... தெரியப்படுத்தியிருக்கிறேன்
  alternative: அழைத்தேன் ... தெரியப்படுத்தினேன்
  rationale: εἴρηκα உண்மையான நிறைவுக்கால வடிவம்; அதன் தற்போதைய விளைவு காக்கப்படுகிறது. ἐγνώρισα அஓரிஸ்ட் என்ற வேறுபாட்டை உணர்ந்தபோதும், வெளிப்படுத்தப்பட்ட அறிவு சீடர்களிடம் இப்போது உள்ளதென்ற உரைநடைத் தொடர்பை இயல்பான தமிழில் ‘தெரியப்படுத்தியிருக்கிறேன்’ வெளிப்படுத்துகிறது; இது அந்த வினையை இலக்கண ரீதியாக நிறைவுக்காலம் எனக் கூறுவதல்ல.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையாகவும் அமைக்கப்பட்டுள்ளது. ‘அடிமை’ என்ற சமூக ரீதியாகக் கடினமான சொல்லை மென்மைப்படுத்தாமல் மூல உரையின் பதற்றம் காக்கப்பட்டுள்ளது; ‘தந்தை’ மற்றும் ‘நண்பர்கள்’ போன்ற உறவுச் சொற்கள் இயல்பாக வைக்கப்பட்டுள்ளன.
