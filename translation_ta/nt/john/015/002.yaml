- from: என்னில் இருந்து கனிகொடுக்காத ஒவ்வொரு கிளையையும் அவர் அகற்றிவிடுகிறார்[a]; கனிகொடுக்கிற ஒவ்வொரு கிளையும் இன்னும் அதிகமாகக் கனிகொடுக்கும்படி அதைச் செதுக்கிச் சீராக்குகிறார்[b].
  to: என்னிலுள்ள கனிகொடுக்காத ஒவ்வொரு கிளையையும் அவர் அகற்றிவிடுகிறார்[a]; கனிகொடுக்கிற ஒவ்வொரு கிளையும் இன்னும் அதிகமாகக் கனிகொடுக்கும்படி அதை வெட்டிச் சீராக்குகிறார்[b].
  rationale: 'The revision corrects the significant directional error in the rendering of ἐν ἐμοὶ: “என்னிலுள்ள” means ‘in me,’ while the draft’s “என்னில் இருந்து” means ‘from me.’ It also slightly sharpens the horticultural sense of καθαίρει without losing its lexical link with cleansing, which remains explicitly noted. No doctrinal inference is added.'
