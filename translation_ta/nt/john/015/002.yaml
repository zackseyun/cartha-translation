  - marker: a
    text: அல்லது, ‘எடுத்துவிடுகிறார்’; αἴρει என்பதற்கு இங்கே ‘தூக்கிவிடுகிறார்’ என்றும் சிலர் பொருள் கொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘வெட்டிச் சீராக்குகிறார்’ என்று மொழிபெயர்க்கப்பட்ட வினைச்சொல் ‘தூய்மைப்படுத்துகிறார்’ என்றும் பொருள்படும். இங்கே திராட்சைத்தோட்ட உருவகத்திற்கு வெட்டிச் சீராக்குதல் பொருந்துகிறது; அடுத்த வசனத்தில் வரும் ‘தூய்மையானவர்கள்’ என்ற மொழியையும் இது முன்னுணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: ஒவ்வொரு கிளையையும்
  rationale: ஒருமை பெயர்ச்சொல்லுடன் வரும் πᾶν பகிர்ந்தளிக்கும் பொருளைக் கொண்டதால், ஒவ்வொரு கிளையையும் தனித்தனியாகக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐν ἐμοὶ
  choice: என்னில் இருந்து
  rationale: யோவானின் ‘என்னில்’ என்ற உறவு சார்ந்த மொழியைப் பாதுகாக்கிறது; தமிழில் கிளை ஒருவரில் இருப்பதைக் கூறும்போது தேவையான இயல்புக்காக ‘இருந்து’ சேர்க்கப்பட்டுள்ளது, ஆனால் ‘இணைந்திருக்கும்’ போன்ற விளக்க விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
- source_word: μὴ φέρον καρπὸν
  choice: கனிகொடுக்காத
  rationale: தொடர்ந்து கனியை விளைவிப்பதைக் குறிக்கும் பங்கேற்புச் சொல்லை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: αἴρει
  choice: அகற்றிவிடுகிறார்
  rationale: திராட்சைத்தோட்ட உருவகத்தில் கனியற்ற கிளைக்கு செய்யப்படும் செயலை ‘அகற்றுதல்’ தெளிவாகக் காட்டுகிறது. ‘எடுத்துவிடுகிறார்’ அல்லது ‘தூக்கிவிடுகிறார்’ என்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: καρπός
  choice: கனி
  rationale: திராட்சைக்கொடி உருவகத்திற்கும் யோவானின் பயன்பாட்டிற்கும் ஏற்ற நிலையான, சுருக்கமான தமிழ் சொல்.
- source_word: καθαίρει
  choice: செதுக்கிச் சீராக்குகிறார்
  rationale: தமிழில் தோட்டக்கலைச் சூழலில் கிளையை வெட்டி ஒழுங்குபடுத்தும் செயலை இயல்பாக உணர்த்துகிறது; கிரேக்க வினையின் ‘தூய்மைப்படுத்துதல்’ என்ற தொடர்புடைய பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: இன்னும் அதிகமாகக் கனிகொடுக்கும்படி
  rationale: ἵνα குறிக்கும் நோக்கத்தையும் πλείονα குறிக்கும் ஒப்பீட்டு அளவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτό / αὐτὸ
  choice: அதை / -ஐ
  rationale: நடுநிலை ஒருமைச் சுட்டுப்பெயர் κλῆμα என்பதையே குறிக்கிறது; தமிழின் வேற்றுமை அமைப்பின்படி முதல் இடத்தில் பெயர்ச்சொல்லின் ‘-ஐ’ உருபாகவும் இரண்டாவது இடத்தில் ‘அதை’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: கனிகொடுக்கிற ஒவ்வொரு கிளையும்
  rationale: கிரேக்கத்தில் முன் வந்த κλῆμα மறைமுகமாகத் தொடர்வதால், தமிழில் தெளிவுக்காக ‘கிளை’ மீண்டும் கூறப்பட்டு இணையான அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: முதல் கூறிலுள்ள αἴρει என்பதன் பொருள்
  choice: அகற்றிவிடுகிறார்
  alternative: எடுத்துவிடுகிறார்; தூக்கிவிடுகிறார்
  rationale: உடனடியான திராட்சைக்கொடி உருவகத்தில் கனியற்ற கிளையை அகற்றுவதும் கனியுள்ள கிளையைச் செதுக்குவதும் எதிரெதிராக நிற்கின்றன. ஆகவே ‘அகற்றிவிடுகிறார்’ முதன்மை உரைக்கு ஏற்றது. விசுவாசத்திலிருந்து விலகுதல் அல்லது நிலைத்திருத்தல் குறித்த எந்தச் சமயப் பிரிவு விளக்கத்தையும் உரைக்குள் இறக்குமதி செய்யாமல், ‘தூக்குதல்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: καθαίρει என்பதில் வெட்டிச் செதுக்குதல் மற்றும் தூய்மைப்படுத்துதல் ஆகிய பொருட்களின் தொடர்பு
  choice: செதுக்கிச் சீராக்குகிறார்
  alternative: தூய்மைப்படுத்துகிறார்
  rationale: திராட்சைத்தோட்டச் சூழலில் தோட்டக்கலைச் செயல் முதன்மையானது. அதேவேளை அடுத்த வசனத்தின் καθαροί (‘தூய்மையானவர்கள்’) என்பதோடு உள்ள சொல் தொடர்பு மறையாதபடி மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு தெளிவானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டது. ‘கனி’, ‘கிளை’, ‘செதுக்கிச் சீராக்குதல்’ ஆகிய சொற்கள் உருவகத்தைத் தெளிவாக வைத்திருக்கின்றன. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
