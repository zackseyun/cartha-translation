  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: ta
  text: என்னிலுள்ள கனிகொடுக்காத ஒவ்வொரு கிளையையும் அவர் அகற்றிவிடுகிறார்[a]; கனிகொடுக்கிற ஒவ்வொரு கிளையும் இன்னும் அதிகமாகக் கனிகொடுக்கும்படி அதை வெட்டிச் சீராக்குகிறார்[b].
  philosophy: optimal-equivalence
