  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: ta
  text: நீங்கள் என்னில் நிலைத்திருந்து, என் வார்த்தைகளும் உங்களில் நிலைத்திருந்தால்[a], நீங்கள் விரும்புவது எதுவாக இருந்தாலும்[b] கேளுங்கள்; அது உங்களுக்குச் செய்யப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீங்கள் என்னில் தொடர்ந்து தங்கியிருந்து, என் வார்த்தைகளும் உங்களில் தொடர்ந்து தங்கியிருந்தால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீங்கள் எதை விரும்பினாலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: நிலைத்திருந்து / நிலைத்திருந்தால்
  rationale: யோவான் நற்செய்தியில் முக்கியமான இந்தச் சொல், உறவில் தொடர்ந்து இருப்பதையும் நிலைத்திருப்பதையும் குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே தமிழ் வேர்ச்சொல்லைப் பயன்படுத்துவது கிரேக்க மூலத்தின் மறுபயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἐν ἐμοὶ
  choice: என்னில்
  rationale: ἐν என்பதன் நேரடியான ‘இல்’ உறவைப் பாதுகாத்து, இயேசுவோடு உள்ள ஒன்றிப்பையும் உறவையும் ‘என்னோடு’ என்று தளர்த்தாமல் வெளிப்படுத்துகிறது.
- source_word: τὰ ῥήματά μου
  choice: என் வார்த்தைகள்
  rationale: ῥήματα என்பது பேசப்பட்ட சொற்கள் அல்லது கூற்றுகளைக் குறிக்கிறது. ‘என் வார்த்தைகள்’ என்பது நேரடியானதும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதுமான மொழிபெயர்ப்பு.
- source_word: ὃ ἐὰν θέλητε
  choice: நீங்கள் விரும்புவது எதுவாக இருந்தாலும்
  rationale: இந்த அமைப்பு விருப்பத்தின் பொருளை வரையறுக்காமல் பொதுவாகக் குறிப்பிடுகிறது. தமிழ் சொற்றொடர் மூலத்தின் விரிவை கூடுதல் நிபந்தனை சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: αἰτήσασθε
  choice: கேளுங்கள்
  rationale: இது வேண்டுகோள் விடுப்பதற்கான கட்டளை. பிரார்த்தனை அல்லது வேண்டுதல் சூழலில் ‘கேளுங்கள்’ நேரடியான, இயல்பான தமிழ்.
- source_word: γενήσεται ὑμῖν
  choice: அது உங்களுக்குச் செய்யப்படும்
  rationale: γίνομαι இங்கு வேண்டிய ஒன்று நிறைவேறுவதையோ நிகழ்வதையோ குறிக்கிறது. ‘உங்களுக்குச் செய்யப்படும்’ என்பது பதிலளிக்கப்படும் வேண்டுதலின் விளைவை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வேண்டுதலைப் பற்றிய வாக்குறுதியின் நிபந்தனை அமைப்பு
  choice: இயேசுவில் நிலைத்திருப்பதும் அவரது வார்த்தைகள் சீடர்களில் நிலைத்திருப்பதும் வேண்டுதலுக்கான வாக்குறுதியின் வெளிப்படையான நிபந்தனையாக வைக்கப்பட்டுள்ளது.
  alternative: இந்த வாக்குறுதியை நிபந்தனையற்றதாக ஒலிக்கச் செய்யும் சுதந்திரமான மொழிபெயர்ப்பு.
  rationale: கிரேக்க வாக்கியத்தில் ἐὰν தொடங்கும் நிபந்தனைத் துணைவாக்கியத்தின் கீழ் கேட்பதற்கான வாக்குறுதி வருகிறது. ஆகவே வசனம் கூறாத நிபந்தனைகளைச் சேர்க்காமலும், அது கூறும் நிபந்தனையை நீக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘நிலைத்திரு’ என்ற சொல் யோவானின் கருத்தியல் மறுபயன்பாட்டையும் உறவின் தொடர்ச்சியையும் பாதுகாக்கிறது; மூலத்தின் நிபந்தனை–வாக்குறுதி அமைப்பு மாற்றப்படவில்லை.
