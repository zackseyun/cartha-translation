base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: ta
  text: வேறு எவரும் செய்யாத செயல்களை நான் அவர்கள் நடுவில் செய்திருக்காவிட்டால், அவர்களுக்குப் பாவம் இருந்திருக்காது[a]. ஆனால் இப்போதோ அவர்கள் என்னையும் என் தந்தையையும் கண்டும் வெறுத்தும் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவம் இருந்திருக்காது’ என்பது கிரேக்கத்தின் நேரடியான சொல்லாட்சி; ‘பாவக்குற்றம் உடையவர்களாக இருந்திருக்கமாட்டார்கள்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: செயல்களை
  rationale: ‘செயல்கள்’ என்பது ἔργα என்பதன் இயல்பான பொருளைப் பாதுகாக்கிறது; யோவான் நற்செய்தியில் இயேசுவின் அடையாளம் மற்றும் பணியை வெளிப்படுத்தும் அவரது செயல்களையும் இது குறிக்க முடியும்.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: நான் அவர்கள் நடுவில் செய்திருக்காவிட்டால்
  rationale: ἐν αὐτοῖς என்பது இங்கு அவர்களுடைய முன்னிலையில் அல்லது அவர்களிடையே என்பதால் ‘அவர்கள் நடுவில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. இறந்தகால எதிர்மறை நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘செய்திருக்காவிட்டால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: வேறு எவரும் செய்யாத
  rationale: இயேசுவின் செயல்களின் ஒப்பற்ற தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: அவர்களுக்குப் பாவம் இருந்திருக்காது
  rationale: ‘பாவம் கொண்டிருத்தல்’ என்ற யோவானிய சொல்லாட்சியைப் பாதுகாத்து, அதை ‘குற்றவாளிகளாக இருந்திருக்கமாட்டார்கள்’ என்று குறுகிய விளக்கமாக மாற்றாமல் விடுகிறது.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: கற்பனையான எதிர்நிலைக்கும் தற்போதைய உண்மைநிலைக்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: கண்டிருக்கிறார்கள்; வெறுத்தும் இருக்கிறார்கள்
  rationale: இரண்டு வினைகளையும் இணைக்கும் καὶ ... καὶ வலியுறுத்தலைத் தமிழில் ‘வெறுத்தும்’ என்பதன் மூலம் காட்டுகிறது; நிறைவுற்றும் தற்போதும் பொருந்தும் செயல்நிலையை ‘இருக்கிறார்கள்’ வடிவம் உணர்த்துகிறது.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: என்னையும் என் தந்தையையும்
  rationale: மீண்டும் வரும் καὶ ... καὶ அமைப்பின் இரட்டை வலியுறுத்தலை இயல்பான தமிழ் ‘-ஐயும் ... -ஐயும்’ அமைப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவர்களுக்குப் பாவம் இருந்திருக்காது’ என்பதன் குற்றப்பொறுப்பு சார்ந்த பொருள்
  choice: ‘பாவம் இருந்திருக்காது’ என்ற மூலமொழியின் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘அவர்கள் பாவக்குற்றம் உடையவர்களாக இருந்திருக்கமாட்டார்கள்’
  rationale: இயேசுவின் தனித்துவமான வெளிப்படுத்தும் செயல்களைக் கண்டபின் அவர்களின் பொறுப்பு தீவிரமடைவதை வசனம் உணர்த்துகிறது. ஆயினும், ‘பாவம் கொண்டிருத்தல்’ என்ற உரையின் இறையியல் நெருக்கடியை மொழிபெயர்ப்பு குறுகிய கோட்பாட்டு விளக்கமாகத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்கள் நடுவில்’ மற்றும் ‘என்னையும் என் தந்தையையும்’ போன்ற அமைப்புகள் மூலத்தின் உறவுகளையும் வலியுறுத்தலையும் தெளிவாகக் காக்கின்றன.
