review_pass:
  verdict: approve
  source_fidelity: The Tamil accurately represents the conditional clause (ἐὰν … τηρήσητε), the future consequence (μενεῖτε), the comparison (καθὼς), and the perfect-plus-present pattern in Jesus’ example (τετήρηκα καὶ μένω). The repeated terms for keeping commandments and remaining are consistently retained.
  naturalness: The wording is clear, dignified modern standard Tamil. “கட்டளைகளைக் கடைப்பிடித்தால்,” “என் அன்பில் நிலைத்திருப்பீர்கள்,” and the corresponding first-person clauses read naturally. The sentence break after the first clause does not obscure the comparative connection introduced by “அதுபோலவே.”
  terminology: “கட்டளைகள்,” “கடைப்பிடி,” “அன்பு,” and “நிலைத்திரு” are suitable and consistent renderings. “என் தந்தையின்” naturally conveys τοῦ πατρός μου in Tamil without adding theological interpretation; Tamil capitalization cannot reproduce English title capitalization.
