id: JHN.15.10
reference: John 15:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: ta
  text: நீங்கள் என் கட்டளைகளைக் கடைப்பிடித்தால், என் அன்பில் நிலைத்திருப்பீர்கள். அதுபோலவே, நான் என் தந்தையின் கட்டளைகளைக் கடைப்பிடித்திருக்கிறேன்; அவருடைய அன்பில் நிலைத்திருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: -த்தால்
  rationale: இறந்தகால நிபந்தனை விகுதியான ‘-த்தால்’ இங்கு நிபந்தனைப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தொடர்ச்சியாக நிகழும் ஒவ்வொரு முறையையும் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐντολάς
  choice: கட்டளைகள்
  rationale: அதிகாரத்துடன் வழங்கப்படும் ஆணைகள் என்ற பொருளைத் தெளிவாகக் காக்கிறது; யோவான் எழுத்துகளில் வரும் அறநெறி மற்றும் உறவுசார் வலிமையையும் தக்கவைக்கிறது.
- source_word: τηρήσητε / τετήρηκα
  choice: கடைப்பிடித்தால் / கடைப்பிடித்திருக்கிறேன்
  rationale: τηρέω என்பதன் கட்டளைகளை உண்மையுடன் பேணி நடக்கும் பொருளை இயல்பாகத் தருகிறது. இரு இடங்களிலும் ஒரே வேர்ச்சொல் பயன்படுத்தப்பட்டு கிரேக்கத்தின் சொல் இணைப்பு காக்கப்படுகிறது; τετήρηκα என்பதன் நிறைவேற்றப்பட்டும் தொடர்ந்து பொருந்தும் நிலையைக் ‘கடைப்பிடித்திருக்கிறேன்’ வெளிப்படுத்துகிறது.
- source_word: μενεῖτε / μένω
  choice: நிலைத்திருப்பீர்கள் / நிலைத்திருக்கிறேன்
  rationale: யோவான் நற்செய்தியில் முக்கியமான μένω என்பதன் தொடர்ந்து ஓர் உறவுசார் நிலையில் இருப்பது என்ற கருத்தை ‘நிலைத்திரு’ இயல்பாகவும் ஒரேசீராகவும் தருகிறது.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: என் அன்பில் / அவருடைய அன்பில்
  rationale: ‘அன்பில்’ என்ற இடவெளி உருவகத்தை நேரடியாகக் காத்து, அன்பு ஒரு உறவுசார் சூழலாக இருப்பதைச் சுருக்கவோ விளக்கவோ செய்யாமல் தருகிறது.
- source_word: καθὼς
  choice: அதுபோலவே
  rationale: சீடர்களின் கட்டளைக் கடைப்பிடிப்பையும் இயேசுவின் முன்மாதிரியையும் ஒப்பிடும் தொடர்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: τοῦ πατρός μου
  choice: என் தந்தையின்
  rationale: உடைமைத் தொடர்பை இயல்பான தமிழில் தருவதோடு, இயேசு குறிப்பிடும் தந்தையைத் தெளிவாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: கீழ்ப்படிதலுக்கும் இயேசுவின் அன்பில் நிலைத்திருப்பதற்கும் உள்ள தொடர்பு
  choice: வாக்கியத்தை உண்மையான நிபந்தனைத் தொடர்பாக நேரடியாக மொழிபெயர்த்தல்
  alternative: கீழ்ப்படிதல் அன்பைச் சம்பாதிக்கிறது என்றோ, அது வெறும் வெளிப்புறச் சான்று மட்டுமே என்றோ விளக்கிச் சேர்த்தல்
  rationale: கிரேக்கம் நிபந்தனையையும் இயேசுவின் சொந்தக் கடைப்பிடிப்புடனான ஒப்புமையையும் முன்வைக்கிறது. ஆனால் தகுதி, இரட்சிப்பை இழத்தல், நிலைத்திருத்தல் போன்ற விரிவான கோட்பாட்டு விவாதங்களை இவ்வசனம் வெளிப்படையாகத் தீர்ப்பதில்லை; ஆகவே அந்த இறையியல் அழுத்தம் அப்படியே காக்கப்படுகிறது.
- issue: ἀγάπη என்பதன் பொருள் மற்றும் உடைமைத் தெளிவின்மை
  choice: அன்பு; ‘என் அன்பில்’ மற்றும் ‘அவருடைய அன்பில்’ என்ற வடிவங்களைப் பேணுதல்
  alternative: ‘நான் உங்கள்மீது வைத்துள்ள அன்பில்’ அல்லது ‘நீங்கள் என்மீது வைத்துள்ள அன்பில்’ என்று ஒரே திசையில் விளக்குதல்
  rationale: கிரேக்க உடைமைத் தொடர் அன்பின் திசையை வெளிப்படையாகக் குறுக்கவில்லை. தமிழ் உடைமைத் தொடர்களும் அந்த இயல்பான தெளிவின்மையைப் பேணுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடைப்பிடி’ மற்றும் ‘நிலைத்திரு’ ஆகியவை இயல்பானவையாகவும், மூலத்தின் மீளுரைப்பையும் கருத்துத் தொடர்பையும் காக்கும்வகையிலும் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தில் இல்லாத இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
