source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: ta
  text: “நான் தந்தையிடமிருந்து உங்களிடம் அனுப்பப்போகிற துணைநிற்பவர்[a] வரும்போது—தந்தையிடமிருந்து புறப்படுகிற உண்மையின் ஆவியானவர்[c]—அவர் என்னைக் குறித்து சாட்சி அளிப்பார்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உதவியாளர்,’ ‘ஆலோசகர்,’ ‘ஆறுதலளிப்பவர்’ என்றும் மொழிபெயர்க்கலாம்; அல்லது கிரேக்கச் சொல்லை ஒலிபெயர்த்து ‘பாரக்லேத்து’ எனலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என்னைக் குறித்துச் சாட்சி சொல்வார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க மூலத்தில், ‘தந்தையிடமிருந்து புறப்படுகிற’ என்று உள்ளது. இந்தச் சொல்லாட்சி பிற்காலத் திரித்துவ இறையியல் விவாதங்களில் முக்கியத்துவம் பெற்றது.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: வரும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் இங்கு எதிர்காலத்தில் எதிர்பார்க்கப்படும் நிகழ்வைக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘வரும்போது’ இதைத் தெளிவாகத் தருகிறது.
- source_word: ὁ παράκλητος
  choice: துணைநிற்பவர்
  rationale: παράκλητος என்பது உதவவும், ஒருவருக்காகப் பேசவும், அவருக்கு ஆதரவாக நிற்கவும் அழைக்கப்பட்ட ஒருவரைக் குறிக்கலாம். ‘துணைநிற்பவர்’ அதன் தனிப்பட்ட மற்றும் பிரதிநிதித்துவப் பொருளை இயல்பான தமிழில் தருகிறது; சொல்லின் பிற சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: நான் உங்களிடம் அனுப்பப்போகிற
  rationale: πέμψω எதிர்காலச் செயலைக் குறிக்கிறது; ὑμῖν பெறுநர்களைக் குறிக்கிறது. ‘உங்களிடம்’ இயல்பான தமிழில் இலக்கையும் பெறுநரையும் வெளிப்படுத்துகிறது.
- source_word: παρὰ τοῦ πατρός
  choice: தந்தையிடமிருந்து
  rationale: παρά உடன் வரும் உறவுவேற்றுமை வடிவம் தோற்றுவாயை அல்லது ஒருவரின் பக்கத்திலிருந்து வருதலைக் குறிக்கிறது; ‘தந்தையிடமிருந்து’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: உண்மையின் ஆவியான அவர்
  rationale: மூலத்தின் ‘உண்மையின் ஆவி’ என்ற உறவுவேற்றுமை அமைப்பு காக்கப்படுகிறது. ‘அவர்’ என்பது அடுத்து வரும் தனிப்பட்ட, ஆண்பால் சுட்டுப்பெயரான ἐκεῖνος-க்கு ஏற்ப ஆவியானவரைத் தனிப்பட்டவராகக் காட்டுகிறது.
- source_word: ἐκπορεύεται
  choice: புறப்படுகிற
  rationale: ἐκπορεύομαι என்பதன் ‘வெளியே புறப்படுதல்/புறப்பட்டு வருதல்’ என்ற குறிப்பான இயக்கப் பொருளை இது காக்கிறது; வெறுமனே ‘வருகிற’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: என்னைக் குறித்துச் சாட்சி அளிப்பார்
  rationale: μαρτυρέω என்பதன் சாட்சி மற்றும் நீதிமன்றத் தொடர்புடைய நுணுக்கத்தை ‘சாட்சி அளிப்பார்’ காக்கிறது; περί உடன் வரும் உறவுவேற்றுமை ‘என்னைக் குறித்து’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: παράκλητος என்பதன் பலபொருள் தன்மை
  choice: துணைநிற்பவர்
  alternative: உதவியாளர்; ஆலோசகர்; ஆறுதலளிப்பவர்; பாரக்லேத்து
  rationale: உடனடி சூழலில் ஆவியானவர் இயேசுவைக் குறித்துச் சாட்சி அளிப்பதால், ஆதரவாக நின்று செயல்படும் தனிப்பட்டவரின் கருத்தை ‘துணைநிற்பவர்’ நன்றாகத் தருகிறது. சொல்லின் முழுப் பொருள் வரம்பையும் ஒரே தமிழ்ச்சொல் தீர்மானித்துவிட்டதாகக் காட்டாமல் மாற்றுகள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- issue: ஆவியானவரைக் குறிக்கும் தனிப்பட்ட சுட்டல்
  choice: ஆவியான அவர் … சாட்சி அளிப்பார்
  alternative: ஆவி … அது சாட்சி அளிக்கும்
  rationale: πνεῦμα இலக்கணப்படி நடுநிலைப்பாலாக இருந்தாலும், ἐκεῖνος என்ற ஆண்பால் சுட்டுப்பெயர் துணைநிற்பவராகிய ஆவியானவரை வலியுறுத்துகிறது. ஆகவே தமிழ் மரியாதை ஒருமையான ‘அவர்’ மூலத்தின் தனிப்பட்ட சித்தரிப்பைக் காக்கிறது.
- issue: ἐκπορεύεται என்பதன் இறையியல் முக்கியத்துவம்
  choice: தந்தையிடமிருந்து புறப்படுகிற
  alternative: தந்தையிடமிருந்து வருகிற
  rationale: கிரேக்க வினையின் குறிப்பான சொல்லாட்சியைப் பாதுகாக்கிறது; அதே நேரத்தில் பிற்கால திரித்துவக் கோட்பாட்டு விவாதங்களின் முடிவுகளை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘தேற்றரவாளன்’ போன்ற இன்று அரிதாகப் பயன்படும் சொல்லைத் தவிர்த்து ‘துணைநிற்பவர்’ பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் இடைச்செருகலை கோடுகளால் தெளிவுபடுத்தி, தந்தையிடமிருந்து அனுப்பப்படுதல் மற்றும் தந்தையிடமிருந்து புறப்படுதல் ஆகிய இரு தனித்த தொடர்களும் பாதுகாக்கப்பட்டுள்ளன.
