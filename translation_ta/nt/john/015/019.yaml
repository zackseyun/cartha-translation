base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: ta
  text: நீங்கள் உலகத்தைச் சேர்ந்தவர்களாக[a] இருந்திருந்தால், உலகம் தனக்குரியவர்களை நேசித்திருக்கும். ஆனால் நீங்கள் உலகத்தைச் சேர்ந்தவர்கள் அல்ல; மாறாக, நான் உங்களை உலகத்திலிருந்து தேர்ந்தெடுத்தேன். இதனால்தான் உலகம் உங்களை வெறுக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலகத்திலிருந்து வந்தவர்களாக.’ கிரேக்கச் சொற்றொடர் தோற்றத்தையோ சார்பையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: உலகத்திலிருந்து வந்தவர்கள்
  rationale: ἐκ என்பதன் ‘இருந்து’ என்ற மூலப்பொருளைத் தெளிவாக வைத்துக்கொண்டு, யோவான் எழுத்தில் உள்ள தோற்றம்/சார்பு ஆகிய இரு நுட்பங்களுக்கும் இடமளிக்கிறது. மூலத்தில் வரும் தொடர்ச்சியான பயன்பாடுகளும் தமிழில் காணப்படுகின்றன.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவானில் இச்சொல் கடவுளுக்கு எதிராக நிற்கும் மனித ஒழுங்கையும் குறிக்கக்கூடும்; ‘உலகம்’ என்று மொழிபெயர்ப்பது அதன் விரிந்த இறையியல் பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: ἂν ... ἐφίλει
  choice: நேசித்திருக்கும்
  rationale: நடைபெறாத நிபந்தனையின் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ἴδιον
  choice: தனக்குரியவர்களை
  rationale: சூழலில் சீடர்களோடு ஒப்பிடப்படும் உலகத்துக்குரிய மக்களைக் குறிக்கிறது. சொற்சொல்லான ‘தனக்குச் சொந்தமானதை’ தமிழில் இங்கு இயல்பாக இல்லை.
- source_word: φιλέω
  choice: நேசித்திருக்கும்
  rationale: μισέω என்பதற்கு எதிராக நிற்கும் பாசம் அல்லது நேசம் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ὅτι δὲ
  choice: ஆனால் ... அல்ல
  rationale: முந்தைய நிகழாத நிபந்தனைக்கும் சீடர்களின் உண்மை நிலைக்கும் இடையிலான முரண்பாட்டைத் தெளிவாக்குகிறது; அடுத்த வாக்கியத்தின் காரண உறவையும் தொடர்ச்சி வெளிப்படுத்துகிறது.
- source_word: ἐξελεξάμην
  choice: தேர்ந்தெடுத்தேன்
  rationale: இயேசுவின் தனிப்பட்ட செயலை நேரடியாகச் சொல்கிறது; மத்திய வினைவடிவத்தை ‘எனக்காக’ என்று மிகையாக விரித்துரைக்கவில்லை.
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: வெறுப்பிற்கான காரணத்தை வலியுறுத்தும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: μισεῖ
  choice: வெறுக்கிறது
  rationale: நிகழ்காலத்தின் தொடரும் உண்மையையும் கிரேக்கச் சொல்லின் கடுமையான எதிர்மறைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: யோவான் சூழலில் ‘உலகம்’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘உலகம்’ என வைத்தல்
  alternative: கடவுளுக்கு எதிரான உலக அமைப்பு; கடவுளை எதிர்க்கும் மனித சமூகம்
  rationale: இங்கு ‘உலகம்’ என்பது இயேசுவுக்கு எதிரான ஒழுக்க-ஆவிக்குரிய வட்டத்தைக் குறித்தாலும், அதன் பொருளை ஒரே விளக்கத்துக்குள் சுருக்காமல் யோவானின் விரிந்த இறையியல் சொல்லாட்சியை மொழிபெயர்ப்பு காக்கிறது.
- issue: ἐξελεξάμην என்பதில் உள்ள தேர்ந்தெடுத்தல்
  choice: ‘நான் உங்களை உலகத்திலிருந்து தேர்ந்தெடுத்தேன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: பிற்கால முன்நியமனக் கோட்பாடுகளின் சொற்களால் விரிவுபடுத்துதல்
  rationale: இயேசு சீடர்களைத் தேர்ந்தெடுத்தார் என்று வசனம் தெளிவாகக் கூறுகிறது; ஆனால் கிறிஸ்தவ மரபுகளுக்கிடையிலான பிற்கால விவாதங்களை இவ்வசனம் தனியே தீர்ப்பதாக மொழிபெயர்ப்பு காட்டக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இருந்திருந்தால் ... நேசித்திருக்கும்’ என்பது நிகழாத நிபந்தனையை இயல்பாகக் காட்டுகிறது; ‘இதனால்தான்’ காரண வலியுறுத்தலைத் தக்கவைக்கிறது.
