review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the unreal condition, the world's love for its own, Jesus' choosing of the disciples, and the world's present hatred. However, ‘உலகத்திலிருந்து வந்தவர்கள்’ is unnecessarily awkward in Tamil and can suggest ordinary physical origin. In this Johannine contrast, ‘உலகத்தைச் சேர்ந்தவர்கள்’ more naturally expresses belonging while the selection clause appropriately retains ‘உலகத்திலிருந்து’ for ἐκ with ἐξελεξάμην.
  naturalness: The proposed revision uses idiomatic modern standard Tamil. ‘மாறாக’ clearly represents the adversative ἀλλά, and ‘இதனால்தான்’ retains the explicit causal consequence of διὰ τοῦτο.
  terminology: ‘உலகம்,’ ‘நேசித்திருக்கும்,’ ‘தேர்ந்தெடுத்தேன்,’ and ‘வெறுக்கிறது’ are suitable, consistent renderings. ‘தனக்குரியவர்களை’ naturally renders τὸ ἴδιον in this context without making an unwarranted doctrinal expansion.
  issues:
  - severity: medium
    issue: ‘உலகத்திலிருந்து வந்தவர்களாக’ is used for the first two instances of ἐκ τοῦ κόσμου.
    rationale: Although formally possible, this wording is unnatural in modern Tamil and may be read as physical provenance. The contrast concerns belonging to the world; ‘உலகத்தைச் சேர்ந்தவர்கள்’ communicates this idiomatically. The final instance, governed by ‘தேர்ந்தெடுத்தேன்,’ rightly retains ‘உலகத்திலிருந்து’ to express separation.
  - severity: low
    issue: The adversative ἀλλά is rendered as ‘நானோ’ rather than explicitly contrasted.
    rationale: ‘நானோ’ can mark contrast, but ‘மாறாக’ makes the source's contrast clearer and reads more naturally in this sentence.
  revised_text: நீங்கள் உலகத்தைச் சேர்ந்தவர்களாக[a] இருந்திருந்தால், உலகம் தனக்குரியவர்களை நேசித்திருக்கும். ஆனால் நீங்கள் உலகத்தைச் சேர்ந்தவர்கள் அல்ல; மாறாக, நான் உங்களை உலகத்திலிருந்து தேர்ந்தெடுத்தேன். இதனால்தான் உலகம் உங்களை வெறுக்கிறது.
