  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: ta
  text: 'ஆனால், அவர்களுடைய சட்டத்தில் எழுதப்பட்டுள்ள வாக்கு நிறைவேறும்படி இது நடந்தது: “அவர்கள் காரணமின்றி என்னை வெறுத்தார்கள்.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் முறையில்: “ஆனால், அவர்களுடைய சட்டத்தில் எழுதப்பட்டுள்ள வாக்கு நிறைவேறும்படி.” கிரேக்கத்தில் முதன்மை வாக்கியம் சொல்லப்படாமல் விடப்பட்டுள்ளது; சூழலிலிருந்து புரியும் “இது நடந்தது” என்பது தமிழில் சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: '“அவர்களுடைய சட்டம்” என்பது இங்கு யூத வேதநூல்களை விரிவாகக் குறிக்கிறது; மேற்கோள் சங்கீதங்களிலிருந்து வருகிறது (ஒப்பிடுக: சங் 35:19; 69:4).'
    reason: cross_reference
  - marker: c
    text: 'வேறு மொழிபெயர்ப்பு: “எந்தக் காரணமும் இல்லாமல்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்துடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα πληρωθῇ
  choice: நிறைவேறும்படி
  rationale: ἵνα உடன் வரும் இறந்தகாலச் செயலப்பாட்டு subjunctive-இல் உள்ள நோக்கம்/விளைவு சார்ந்த நுணுக்கத்தைத் தீர்மானமாக்காமல் காக்கிறது.
- source_word: ὁ λόγος
  choice: வாக்கு
  rationale: இங்கு λόγος என்பது யோவான் 1-இன் தனிப்பட்ட இறையியல் பட்டப்பெயர் அல்ல; மேற்கோள் காட்டப்படும் ஒரு குறிப்பிட்ட வேதவாக்கைக் குறிக்கிறது. ‘வாக்கு’ தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: அவர்களுடைய திருச்சட்டத்தில் எழுதப்பட்டுள்ள
  rationale: γεγραμμένος என்பதன் ‘எழுதப்பட்டு நிலைத்திருப்பது’ என்ற நிறைவுநிலையை ‘எழுதப்பட்டுள்ள’ காக்கிறது; αὐτῶν என்பதையும் ‘அவர்களுடைய’ என்று நேரடியாகத் தக்கவைக்கிறது.
- source_word: νόμῳ
  choice: திருச்சட்டம்
  rationale: மூலத்தின் ‘சட்டம்’ என்ற சொல்லைத் தக்கவைத்தபடியே இது சாதாரண மனிதச் சட்டமல்ல, புனித எழுத்துகளின் தொகுப்பைக் குறிக்கிறது என்பதைத் தமிழில் உணர்த்துகிறது. சங்கீதத்திலிருந்து மேற்கோள் வருவதால் இதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: வேதவாக்கின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι-யைத் தமிழில் இயல்பாக ஒரு முக்காற்புள்ளி வழியாகக் காட்டுகிறது.
- source_word: Ἐμίσησάν με
  choice: அவர்கள் என்னை வெறுத்தார்கள்
  rationale: இறந்தகால aorist வினையை எளிய இறந்தகாலமாகத் தருகிறது; மேற்கோளின் நேரடியான சொற்தொடரையும் காக்கிறது.
- source_word: δωρεάν
  choice: காரணமின்றி
  rationale: வெறுப்புக்கு நியாயமான காரணம் எதுவும் இல்லை என்ற அற/நீதி நுணுக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் ‘அவர்களுடைய திருச்சட்டம்’ என்பதன் பொருள்
  choice: νόμος என்பதை ‘திருச்சட்டம்’ என்று மொழிபெயர்த்து, இங்கு சங்கீதங்களையும் உள்ளடக்கும் விரிவான யூத வேதநூல் பயன்பாடாகப் புரிந்துகொள்ளுதல்.
  alternative: விரிவான பொருளை நேரடியாக்க ‘அவர்களுடைய வேதத்தில்’ என்று மொழிபெயர்த்தல்.
  rationale: மூலத்தில் νόμος என்று இருப்பதால் ‘சட்டம்’ என்ற வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதே நேரத்தில் மேற்கோள் சங்கீதங்களிலிருந்து வருவது, இச்சொல் ஐந்நூலுக்கு மட்டும் வரையறுக்கப்படவில்லை என்பதைக் காட்டுகிறது; அந்தத் தளராத பதற்றம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ἀλλ’ ἵνα என்ற நீள்விடுபட்ட கிரேக்கக் கட்டமைப்பில் மறைந்துள்ள முதன்மை வாக்கியம்
  choice: இயல்பான தமிழுக்காக ‘இது நடந்தது’ என்று வெளிப்படையாகச் சேர்த்தல்.
  alternative: ‘ஆனால், ... வாக்கு நிறைவேறும்படி’ என்று கிரேக்கத்தின் நீள்விடுபாட்டை அப்படியே வைத்தல்.
  rationale: கிரேக்கத்தில் முதன்மை வாக்கியம் சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது. ‘இது நடந்தது’ என்பது புதிய காரணவியல் அல்லது கோட்பாட்டைச் சேர்க்காமல், தமிழில் வாக்கியத்தை முழுமையாகவும் தெளிவாகவும் ஆக்குகிறது.
- issue: ἵνα πληρωθῇ-இல் நோக்கமா விளைவா என்ற நுணுக்கம்
  choice: ‘நிறைவேறும்படி’ என்று இரு சாத்தியங்களையும் அனுமதிக்கும் வடிவம்.
  alternative: ‘நிறைவேறுவதற்காக’ என்று தெளிவாக நோக்கத்தை மட்டும் முன்னிறுத்துதல்.
  rationale: ἵνα கட்டமைப்பு நோக்கம்/விளைவு ஆகிய நுணுக்கங்களைத் தாங்க முடியும். தமிழில் ‘நிறைவேறும்படி’ என்பது தேவையற்ற நிர்ணயவாத விளக்கத்தைச் சேர்க்காமல் நிறைவேற்றல் கருத்தைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதே நேரத்தில் வேத மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற இன்றைய வாசகர்களுக்கு பழமையாகவோ ஐந்நூலுக்கு மட்டும் உரியதாகவோ தோன்றக்கூடிய சொல்லுக்குப் பதிலாக ‘திருச்சட்டம்’ தேர்ந்தெடுக்கப்பட்டது. மேற்கோளில் தமிழ் நிறுத்தக்குறிகளும் இயல்பான சொல்வரிசையும் பயன்படுத்தப்பட்டுள்ளன.
