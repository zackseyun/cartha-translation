  source_fidelity: The Tamil accurately renders the substantival present participle ὁ ... μισῶν as a generic person (‘வெறுக்கிறவன்’), preserves both occurrences of μισέω with the same Tamil verb root, and correctly expresses the linked object of hatred through ‘என் தந்தையையும்.’ The present-tense general assertion is retained.
  naturalness: ‘என்னை வெறுக்கிறவன் என் தந்தையையும் வெறுக்கிறான்’ is concise, idiomatic modern standard Tamil with an appropriately dignified register. The -யையும் construction naturally conveys the additive force of καί in this context.
  terminology: ‘தந்தை’ is an appropriate contemporary Tamil equivalent for πατήρ here. It preserves Jesus’ relational reference to the Father without unnecessarily importing a more tradition-bound term such as ‘பிதா.’
