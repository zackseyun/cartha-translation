id: JHN.15.23
reference: John 15:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: ta
  text: என்னை வெறுக்கிறவன் என் தந்தையையும் வெறுக்கிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: வெறுக்கிறவன்
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டுடன் வரும் நிகழ்காலப் பங்கேற்புவினை பெயர்ச்சொல்லாகச் செயல்பட்டு, அந்தச் செயலால் அடையாளப்படுத்தப்படும் ஒருவனைக் குறிக்கிறது. ‘வெறுக்கிறவன்’ என்பது பொதுமை ஒருமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐμὲ
  choice: என்னை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் வலியுறுத்தப்பட்ட தனிப்பெயர் வடிவம். தமிழில் ‘என்னை’ என்பது பொருத்தமான நேரடி இணை.
- source_word: μισῶν / μισεῖ
  choice: வெறுக்கிறவன் / வெறுக்கிறான்
  rationale: μισέω என்பதன் பொருள் ‘வெறு, கடுமையாகப் பகை கொள்.’ ஒரே தமிழ் வினைவேர் இரு இடங்களிலும் பயன்படுத்தப்பட்டதால் மூலத்தின் சொல் மறுபயன்பாடு காக்கப்படுகிறது; நிகழ்கால வடிவங்கள் பொதுவான உண்மையைக் காட்டுகின்றன.
- source_word: καὶ
  choice: -யையும்
  rationale: இங்கு καί இரண்டாவது செயப்படுபொருளை ‘கூட/மேலும்’ என்ற பொருளில் இணைக்கிறது. ‘தந்தையையும்’ என்ற வடிவம் இயல்பான தமிழில் ‘தந்தையையும் கூட’ என்ற உள்ளடக்கத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τὸν πατέρα μου
  choice: என் தந்தை
  rationale: πατέρα உடன் வரும் μου இயல்பாக ‘என் தந்தை’ என்று மொழிபெயர்க்கப்படுகிறது. சூழலில் இது இயேசு தேவனைத் தமது தந்தையாகக் குறிப்பிடுவதைக் குறிக்கிறது; தமிழில் பொருளை அறிய ஆங்கிலத்தைப் போன்ற பெரிய எழுத்து வேறுபாடு கிடையாது.
theological_decisions:
- issue: ‘தந்தை’ என்பது தேவனைக் குறிக்கும் உறவுப்பெயர்
  choice: என் தந்தை
  alternative: என் பிதா
  rationale: ‘தந்தை’ என்பது தற்போதைய பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது; யோவான் நற்செய்தியில் இயேசுவுக்கும் தேவனுக்கும் இடையிலான உறவைத் தெளிவாகக் காக்கிறது. ‘பிதா’ என்ற சமய வழக்குச் சொல்லைத் தேர்ந்தெடுக்க வேண்டிய கட்டாயம் மூலத்தில் இல்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை. மூலத்தின் சுருக்கமும், ‘வெறுக்க’ என்ற வினையின் மறுபயன்பாடும், இயேசுவை வெறுப்பதும் அவருடைய தந்தையை வெறுப்பதும் இணைந்திருக்கும் கருத்தும் காக்கப்பட்டுள்ளன.
