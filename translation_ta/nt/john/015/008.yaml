revisions:
- from: நீங்கள் மிகுந்த கனிகொடுத்து என் சீடர்களாக ஆகுவதில் என் தந்தை மகிமைப்படுத்தப்பட்டிருக்கிறார்.
  to: 'இதிலே என் தந்தை மகிமைப்படுகிறார்: நீங்கள் மிகுந்த கனி கொடுத்து என் சீடர்களாக ஆவதில்.'
  rationale: The revision restores “இதிலே” for ἐν τούτῳ, uses idiomatic Tamil for the Father's glorification, and preserves both “much fruit” and the becoming-language of γένησθε. The colon permits the following clause to explain what constitutes the Father's glorification, without overdetermining the debated nuance of ἵνα.
  reviewer_model: gpt-5.6-terra
