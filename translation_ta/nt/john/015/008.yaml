id: JHN.15.8
reference: John 15:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: ta
  text: 'இதிலே என் தந்தை மகிமைப்படுகிறார்: நீங்கள் மிகுந்த கனி கொடுத்து என் சீடர்களாக ஆவதில்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதில்
  rationale: முன்னரும் பின்னரும் உள்ள கருத்தோடு இணையும் கிரேக்கச் சொற்றொடரின் சுட்டும் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐδοξάσθη
  choice: மகிமைப்படுத்தப்பட்டிருக்கிறார்
  rationale: இறந்தகால passive வடிவத்தைப் பிரதிபலிக்கிறது; தமிழில் விளைவுநிலை உணர்வையும் தருகிறது.
- source_word: καρπὸν πολὺν φέρητε
  choice: மிகுந்த கனிகொடுத்து
  rationale: திராட்சச்செடி உருவகத்தின் ‘கனி’ என்ற சொல்லைத் தக்கவைத்து, அளவைக் குறிக்கும் πολύν என்பதையும் வெளிப்படுத்துகிறது.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: என் சீடர்களாக ஆகுவதில்
  rationale: γένησθε என்பதின் ‘ஆகுதல்’ பொருளை அழிக்காமல், ἐμοί என்பதைக் இயல்பாக ‘என்’ என்று தருகிறது.
theological_decisions:
- issue: ἵνα என்பதின் பொருள்—நோக்கமா, விளக்கமா/விளைவா
  choice: '‘இதில் ...: நீங்கள் ...’ என்ற கருத்தை தமிழில் ‘... கொடுத்து ... ஆகுவதில்’ என ஒருங்கிணைத்தல்'
  alternative: ‘நீங்கள் ... ஆகும்படியாக’
  rationale: இங்கு ἵνα தந்தை எதில் மகிமைப்படுகிறார் என்பதை விளக்கவும் முடியும்; வெறும் நோக்கமாக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: γένησθε என்பதைக் ‘இருப்பது/நிரூபிப்பது’ என மாற்றலாமா
  choice: ஆகுவதில்
  alternative: சீடர்கள் என்று நிரூபிப்பதில்
  rationale: மூலத்தில் உள்ள γίνομαι என்ற வினையின் நேரடியான ‘ஆகுதல்’ நுணுக்கத்தையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ். வசனத்தின் திராட்சச்செடி–கனி உருவகம் காக்கப்பட்டுள்ளது; சிக்கலான கிரேக்க வாக்கிய அமைப்பு வாசிக்கத்தக்க ஒரே தமிழ் வாக்கியமாக வழங்கப்பட்டுள்ளது.
