review_pass:
  verdict: revise
  source_fidelity: The draft adds “கொடியிலிருந்து வெட்டியெறியப்பட்ட” (“cut/thrown off from the vine”), although the verse says only that the person is thrown out like a branch; cutting from the vine is supplied rather than stated. The final clause is better rendered passively, reflecting καίεται (“is burned”), rather than intransitively “they burn.”
  naturalness: The revised wording is natural modern standard Tamil and keeps the movement from the individual illustration to the plural gathering of such branches. “ஒருவர்” avoids unnecessarily male-specific wording in a generic conditional statement.
  terminology: “என்னில் நிலைத்திருக்க” appropriately expresses μένῃ ἐν ἐμοί. “கிளை,” “வெளியே தள்ளப்பட்டு,” “நெருப்பு,” and “எரிக்கப்படுகின்றன” retain the metaphor and judgment language without doctrinal expansion.
  issues:
  - severity: medium
    issue: The translation introduces cutting from the vine.
    rationale: “கொடியிலிருந்து வெட்டியெறியப்பட்ட” adds an action and detail not expressed in ἐβλήθη ἔξω ὡς τὸ κλῆμα. The immediate wider context concerns a vine, but this verse itself should not add “cut.”
  - severity: low
    issue: The final burning clause is rendered intransitively.
    rationale: καίεται is passive (“is burned”). Tamil passive wording more closely preserves the source, while pluralizing naturally after αὐτὰ (“them”).
