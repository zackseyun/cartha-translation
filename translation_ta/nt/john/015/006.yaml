revisions:
- from: ஒருவன் என்னில் நிலைத்திராவிட்டால்[a], அவன் கொடியிலிருந்து வெட்டியெறியப்பட்ட கிளையைப் போல வெளியே எறியப்பட்டு உலர்ந்துபோகிறான். அத்தகைய கிளைகளை மக்கள் ஒன்றுசேர்த்து நெருப்பில் எறிகிறார்கள்[b]; அவை எரிகின்றன.
