source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: ta
  text: ஒருவர் என்னில் நிலைத்திருக்காவிட்டால்[a], அவர் கிளையைப்போல் வெளியே தள்ளப்பட்டு உலர்ந்துபோகிறார். பின்னர் அத்தகைய கிளைகளை ஒன்று சேர்த்து நெருப்பில் போடுகிறார்கள்[b]; அவை எரிக்கப்படுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னில் தங்கியிருக்காவிட்டால்.’ கிரேக்க வினை தொடர்ந்து இருப்பதையும் உறவில் நிலைத்திருப்பதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த உருவகம் விலக்கப்படுதலையும் எரிக்கப்படுதலையும் குறித்து எச்சரிக்கிறது. ஆனால் இது உண்மையான சீடத்துவத்தை இழப்பதைக் குறிக்கிறதா, அல்லது வெளிப்புறமாக மட்டுமே இணைந்திருந்த நிலை வெளிப்படுவதைக் குறிக்கிறதா என்பதை இந்த வசனம் தனியாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: நிலைத்திரு
  rationale: யோவான் எழுத்துகளில் முக்கியமான μένω என்பது தொடர்ந்து இருப்பதையும் உறவில் நிலைத்திருப்பதையும் குறிக்கிறது; ‘நிலைத்திரு’ நவீனத் தமிழில் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοί
  choice: என்னில்
  rationale: இயேசுவுடனான உறவு மற்றும் ஒன்றிப்பின் வலிமையைப் பாதுகாக்க, கிரேக்க முன்மொழித் தொடரின் நேரடியான வடிவம் தக்கவைக்கப்படுகிறது.
- source_word: ἐβλήθη ἔξω
  choice: வெளியே எறியப்பட்டு
  rationale: இறந்தகால வடிவம் நிபந்தனையின் விளைவை உயிரோட்டமாக முன்வைக்கிறது; செயப்பாட்டு வினையும் வெளியேற்றப்படுதல் என்ற உருவகமும் தக்கவைக்கப்படுகின்றன.
- source_word: ὡς τὸ κλῆμα
  choice: கொடியிலிருந்து வெட்டியெறியப்பட்ட கிளையைப் போல
  rationale: κλῆμα என்பது திராட்சைக்கொடியின் கிளை. தமிழில் ‘கிளை’ மட்டும் எந்த மரத்தின் கிளை எனத் தெளிவில்லாமல் இருக்கலாம்; உடனடி திராட்சைக்கொடி உருவகத்தையும் வெளியே எறிதலுக்கான இயல்பான நிலையையும் தெளிவுபடுத்த இந்த வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἐξηράνθη
  choice: உலர்ந்துபோகிறான்
  rationale: கிளை காய்ந்து உலர்வதை இயல்பான தமிழில் கூறுகிறது; மனிதரைக் குறிக்கும் ஒருமை உருவகத்துடனும் பொருந்துகிறது.
- source_word: συνάγουσιν
  choice: மக்கள் ஒன்றுசேர்த்து
  rationale: கிரேக்கத்தின் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘மக்கள்’ பயன்படுத்தப்படுகிறது; செய்பவர்கள் யார் என்று வசனம் குறிப்பிடாத நிலை பாதுகாக்கப்படுகிறது.
- source_word: αὐτὰ
  choice: அத்தகைய கிளைகளை
  rationale: நடுநிலைப் பன்மைப் பெயர்ச்சுட்டை தமிழில் தெளிவாக வெளிப்படுத்துகிறது; முன்னுள்ள ஒருமைக் கிளை பொதுவான எடுத்துக்காட்டாக இருப்பதால் பன்மைக்கு மாறுவது இயல்பாக்கப்படுகிறது.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: நெருப்பில் எறிகிறார்கள்
  rationale: நவீனத் தமிழில் நேரடியான, காட்சிப்பூர்வமான மொழிபெயர்ப்பு.
- source_word: καίεται
  choice: அவை எரிகின்றன
  rationale: கிரேக்க வினை ஒருமையாக இருந்தாலும், முன் வந்த பன்மை αὐτὰ-வைத் தொடர்ந்து தமிழில் பன்மை இயல்பாக உள்ளது. ‘எரிகின்றன’ என்பது கிரேக்கச் செயப்பாட்டு வடிவத்தின் பொருளை தேவையற்ற விளக்கமின்றி இயல்பாகக் கூறுகிறது.
- source_word: τις
  choice: ஒருவன்
  rationale: பொதுவான நிபந்தனையில் வரும் காலவரையற்ற ஒருமையை மரியாதையான நவீனத் தமிழில் சுருக்கமாகக் காட்டுகிறது; சூழலில் பாலினக் கட்டுப்பாட்டை நோக்கமாக விதிப்பதில்லை.
theological_decisions:
- issue: இந்த எச்சரிக்கை விசுவாசத்தை உண்மையாக இழப்பதையா அல்லது பொய்யான இணைப்பு வெளிப்படுவதையா குறிக்கிறது?
  choice: பிற்கால கோட்பாட்டு முடிவைச் சேர்க்காமல், விலக்கப்படுதல் மற்றும் எரிதல் பற்றிய உருவக எச்சரிக்கையை நேரடியாக மொழிபெயர்த்தல்
  alternative: உண்மையான சீடர் வீழ்வதாகவோ, ஒருபோதும் உண்மையாக இணைக்கப்படாதவர் வெளிப்படுவதாகவோ வெளிப்படையாக விளக்குதல்
  rationale: வசனம் தீர்ப்பின் தீவிரத்தைத் தெளிவாகக் கூறுகிறது; ஆனால் விவரிக்கப்படும் நபரின் முந்தைய ஆன்மிக நிலையைத் தனியாக வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் பேச்சுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நிலைத்திரு’ என்ற முக்கிய யோவானியச் சொல் தொடர்ந்து ஒரே கருத்தோட்டத்தில் பயன்படுத்தத்தக்கது. உருவகத்தின் தீர்ப்புத் தீவிரம் மென்மைப்படுத்தப்படவில்லை; அதேவேளை எந்தச் சமயப்பிரிவின் விளக்கமும் உரைக்குள் சேர்க்கப்படவில்லை.
