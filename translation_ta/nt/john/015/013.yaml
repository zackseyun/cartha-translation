id: JHN.15.13
reference: John 15:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: ta
  text: 'இதைக் காட்டிலும் மேலான அன்பு ஒருவரிடமும் இல்லை: ஒருவர் தம் நண்பர்களுக்காகத் தம் உயிரைக் கொடுப்பதே அது.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிர்’ என்பதற்கான கிரேக்கச் சொல் ψυχή; அதற்கு ‘ஆத்துமா’ அல்லது ‘தன்னையே’ என்றும் பொருள் இருக்கலாம். இங்கு மரணத்தில் ஒப்புக்கொடுக்கப்படும் ஒருவரின் உயிரையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நண்பர்களுக்காக’ என்பதை ‘நண்பர்களின் சார்பாக’ அல்லது ‘நண்பர்களின் நன்மைக்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: இதைக் காட்டிலும் மேலான அன்பு
  rationale: மείζονα என்பது ஒப்பீட்டுப் பொருளைக் கொண்டது; ταύτης என்பது ஒப்பீட்டு வேற்றுமையில் ‘இதைக் காட்டிலும்’ எனவும், ἀγάπην என்பது இயல்பாக ‘அன்பு’ எனவும் மொழிபெயர்க்கப்படுகிறது.
- source_word: οὐδεὶς ἔχει
  choice: ஒருவரிடமும் இல்லை
  rationale: தமிழில் அன்பை ஒருவர் ‘கொண்டிருக்கிறார்’ என்று நேரடியாகச் சொல்வதைவிட, ‘ஒருவரிடமும் இல்லை’ என்பது இயல்பாகவும் மூலத்தின் மறுப்புப் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: ἵνα τις
  choice: ஒருவர் … கொடுப்பதே அது
  rationale: ἵνα இங்கு நோக்கத்தைக் காட்டுவதைக் காட்டிலும் முன்சொன்ன ‘இது’ எதைக் குறிக்கிறது என்பதை விளக்குகிறது; τις பாலினம் குறிப்பிடாத பொதுவான ஒருமை, ஆகவே ‘ஒருவர்’ என வழங்கப்பட்டது.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: தம் உயிரைக் கொடுப்பது
  rationale: ψυχή இச்சூழலில் மரணத்திற்கு ஒப்புக்கொடுக்கப்படும் உயிரைக் குறிக்கிறது. τίθημι உடனான சொற்றொடரை இயல்பான நவீன தமிழில் ‘உயிரைக் கொடுப்பது’ என வழங்குவது பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: தம் நண்பர்களுக்காக
  rationale: ὑπέρ இங்கு பிறரின் நன்மைக்காக அல்லது அவர்கள் சார்பாகச் செய்யப்படுவதைச் சுட்டுகிறது; ‘க்காக’ அதன் பொருளைத் தேவையற்ற கோட்பாட்டு மிகை இல்லாமல் தருகிறது. φίλων என்பது ‘நண்பர்கள்’.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: ‘உயிர்’ என்று வழங்கப்பட்டது.
  alternative: ‘ஆத்துமா’ அல்லது ‘தன்னையே’
  rationale: இங்கு ஒருவர் மரணம் வரையிலும் தம்மை ஒப்புக்கொடுக்கும் செயல் பேசப்படுகிறது; உடல்–ஆத்துமா பிரிவை உரைக்காமல் சூழலுக்குரிய பொருளை ‘உயிர்’ தெளிவாகத் தருகிறது.
- issue: ὑπέρ என்பதன் இறையியல் வீச்சு
  choice: முதன்மை உரையில் ‘நண்பர்களுக்காக’ என்று வழங்கப்பட்டது.
  alternative: ‘நண்பர்களின் சார்பாக’ அல்லது ‘நண்பர்களுக்குப் பதிலாக’
  rationale: ὑπέρ நன்மைக்காக அல்லது சார்பாக என்ற பொருளைக் கொள்ளலாம்; ‘பதிலாக’ என்ற பதிலீட்டுப் பொருளை இவ்வசனம் மட்டும் கட்டாயப்படுத்தாததால் அது முதன்மை உரையில் மிகைப்படுத்தப்படவில்லை.
- issue: ἵνα தொடங்கும் பகுதியின் தொடர்பு
  choice: ‘கொடுப்பதே அது’ என முன்சொன்ன அன்பின் தன்மையை விளக்கும் வகையில் வழங்கப்பட்டது.
  alternative: ‘கொடுப்பதற்காக’ என்ற நோக்கப் பொருள்
  rationale: இங்கு ἵνα முன் வரும் ‘இது’ என்ன என்பதை விளக்கும் இயைபுடையதாக உள்ளது; நோக்கமாக மட்டும் எடுத்தால் வாக்கியத்தின் தருக்கம் மங்கும்.
translation_notes:
  register: நவீன தரமான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாலினம் குறிப்பிடாத கிரேக்க τις மற்றும் αὐτοῦ ஆகியவற்றை ‘ஒருவர்/தம்’ என வழங்கி பொதுப்பொருள் காக்கப்பட்டுள்ளது. ‘உயிரை வைப்பது’ என்ற சொல்லுக்குச் சொல் வடிவைத் தவிர்த்து, தமிழில் வழக்கமான ‘உயிரைக் கொடுப்பது’ பயன்படுத்தப்பட்டுள்ளது.
