  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: ta
  text: நான் இவற்றை உங்களிடம் பேசியிருக்கிறேன்; என் மகிழ்ச்சி உங்களுக்குள் இருக்கவும்[a], உங்கள் மகிழ்ச்சி நிறைவடையவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் மகிழ்ச்சி உங்கள் நடுவில் இருக்கவும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் மகிழ்ச்சி முழுமையடையவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரைத் தெளிவாகக் காத்து, இதற்கு முன் இயேசு கூறியவற்றைக் குறிக்கிறது.
- source_word: λελάληκα
  choice: பேசியிருக்கிறேன்
  rationale: நிகழ்காலத்திற்குரிய விளைவைக் கொண்ட நிறைவுற்ற செயலைக் காட்டும் கிரேக்க perfect வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: இரண்டாம் நபர் பன்மை தத்திவேற்றுமையையும் உரையின் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: ἵνα
  choice: இருக்கவும் … நிறைவடையவும்
  rationale: இயேசு பேசியதன் நோக்கத்தைத் தமிழில் இயல்பான இணை நோக்கவாக்கியங்களால் வெளிப்படுத்துகிறது.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: என் மகிழ்ச்சி
  rationale: இயேசுவுக்குரிய மகிழ்ச்சி என்ற பொருளை விளக்கவுரை சேர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: ἐν என்பதன் முதன்மையான ‘உள்ளில்’ என்ற பொருளைக் காக்கிறது; ‘உங்கள் நடுவில்’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ᾖ
  choice: இருக்கவும்
  rationale: ἵνα-வுக்குப் பின்வரும் subjunctive வடிவத்தின் நோக்க நுணுக்கத்தைத் தமிழின் இணை வினையெச்ச அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: καὶ
  choice: மேலும் தனிச் சொலாக மொழிபெயர்க்காமல் இணை ‘-வும்’ அமைப்பு
  rationale: இரு நோக்கக் கூறுகளையும் தமிழில் ‘இருக்கவும் … நிறைவடையவும்’ என்று இணைப்பது καὶ-யின் கூட்டிணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ χαρὰ ὑμῶν
  choice: உங்கள் மகிழ்ச்சி
  rationale: ‘என் மகிழ்ச்சி’ என்பதுடன் உள்ள எதிரிணையை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: πληρωθῇ
  choice: நிறைவடையவும்
  rationale: மகிழ்ச்சி முழு அளவை அடைவதைக் குறிக்கும் பொருளை இயல்பான தமிழில் தருகிறது; ‘முழுமையடையவும்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யோவான் உரையாடலில் ‘என் மகிழ்ச்சி’ என்பதன் இயல்பு
  choice: ‘என் மகிழ்ச்சி’ என்று விளக்க விரிவாக்கமின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நான் தரும் மகிழ்ச்சி’ அல்லது ‘என்னைப் பற்றிய மகிழ்ச்சி’
  rationale: கிரேக்கம் இயேசுவுக்குரிய மகிழ்ச்சியை மட்டுமே நேரடியாகக் கூறுகிறது. அது இயேசுவின் சொந்த மகிழ்ச்சி சீடர்களுடன் பகிரப்படுவதையோ, அவரோடு ஒன்றிப்பதால் வரும் மகிழ்ச்சியையோ குறிக்கலாம்; மொழிபெயர்ப்பு இவ்விருப்பங்களைச் சுருக்கி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பேசியிருக்கிறேன்’ என்பது perfect வினையின் தொடரும் விளைவைக் காட்டுகிறது; நோக்கத்தைச் சுட்டும் இரு கூறுகளும் ‘-வும்’ அமைப்பால் சமநிலையுடன் இணைக்கப்பட்டுள்ளன.
