source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: ta
  text: உலகம் உங்களை வெறுத்தால், அது உங்களுக்கு முன்பே என்னை வெறுத்திருக்கிறது என்பதை அறிந்துகொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது முதலில் என்னை வெறுத்தது—உங்களை வெறுப்பதற்கு முன்பே” என மொழிபெயர்க்கலாம். கிரேக்கத்தில் “முதலில்” என்பது “உங்களை” என்பதுடன் சேர்ந்து கால முன்னுரிமையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவான் நற்செய்தியில் இச்சொல் பல இடங்களில் கடவுளுக்கு எதிராக நிற்கும் மனித உலகைக் குறிக்கும் நிழற்பொருளைக் கொண்டிருந்தாலும், மூலத்தின் விரிவையும் தெளிவின்மையையும் காக்க இயல்பான “உலகம்” பயன்படுத்தப்பட்டது.
- source_word: μισεῖ
  choice: வெறுத்தால்
  rationale: நிபந்தனை வாக்கியத்திற்குள் வரும் நிகழ்கால வினையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; பொதுவாக அல்லது தொடர்ந்து நிகழக்கூடிய எதிர்ப்பையும் இது அனுமதிக்கிறது.
- source_word: γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: இவ்வடிவம் இலக்கணரீதியாகக் கூற்று அல்லது கட்டளை என இருவிதமாகப் புரியக்கூடியது. சூழலில் சீடர்களை அறிவுறுத்தும் ஏவலாக எடுத்துக்கொள்வது உரையோட்டத்திற்கு இயல்பாக இருப்பதால் மரியாதைப் பன்மை ஏவல் பயன்படுத்தப்பட்டது.
- source_word: πρῶτον ὑμῶν
  choice: உங்களுக்கு முன்பே
  rationale: இங்கு πρῶτον உடன் வரும் ὑμῶν கால முன்னுரிமையைத் தெரிவிக்கிறது. “உங்களுக்கு முன்பே” என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: μεμίσηκεν
  choice: வெறுத்திருக்கிறது
  rationale: நிறைவேறிய செயல் தற்போதும் தொடர்புடையதாக இருப்பதை கிரேக்க நிறைவுக் காலம் சுட்டுகிறது; தமிழின் “வெறுத்திருக்கிறது” அந்தத் தொடரும் பொருத்தத்தைப் பாதுகாக்கிறது.
- source_word: ἐμέ
  choice: என்னை
  rationale: மூலத்தில் வலியுறுத்தப்பட்டுள்ள முதலாம் நபர் சுட்டுப்பெயர், தமிழ் வாக்கியத்தில் “உங்களுக்கு முன்பே என்னை” என்ற அமைப்பில் இயல்பாக முன்னிறுத்தப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் κόσμος என்பதன் பொருள்
  choice: முதன்மை உரையில் “உலகம்” என்றே வைத்தல்
  alternative: “கடவுளுக்கு எதிரான மனித உலகம்” அல்லது “உலக அமைப்பு” என்று விரித்துரைத்தல்
  rationale: இவ்வசனத்தில் இயேசுவுக்கும் அவருடைய சீடர்களுக்கும் எதிரான பகைமை கருத்தில் இருந்தாலும், மூலச்சொல் அந்தப் பொருளை விளக்கவுரையாக விரித்துச் சொல்லவில்லை. “உலகம்” என்பது இறையியல் நிழற்பொருளையும் மூலத்தின் பரப்பையும் ஒருசேர காக்கிறது.
- issue: γινώσκετε என்பதின் கூற்று–கட்டளை தெளிவின்மை
  choice: “அறிந்துகொள்ளுங்கள்” என்ற அறிவுறுத்தலாக மொழிபெயர்த்தல்
  alternative: “நீங்கள் அறிந்திருக்கிறீர்கள்” என்ற கூற்றாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வடிவம் இரண்டையும் அனுமதித்தாலும், நிபந்தனைத் தொடருக்குப் பின் வரும் உரையோட்டத்தில் அறிவுறுத்தல் இயல்பாகப் பொருந்துகிறது. இது கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டது. “அறிந்துகொள்ளுங்கள்” என்பது சீடர்களை நோக்கிய மரியாதைப் பன்மையையும் அறிவுறுத்தல் தொனியையும் தருகிறது; விளக்கவுரையான இறையியல் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
