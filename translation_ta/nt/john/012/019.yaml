id: JHN.12.19
reference: John 12:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: ta
  text: எனவே பரிசேயர்கள் ஒருவருக்கொருவர், “நீங்கள் எதையும் சாதிக்கவில்லை என்பது உங்களுக்கே தெரிகிறதே. பாருங்கள், உலகம்[a] அவனைப் பின்தொடர்ந்து போய்விட்டது!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாரும் அவனைப் பின்தொடர்ந்து போய்விட்டார்கள்.” கிரேக்கத்தில் “உலகம்” என்று உள்ளது; இது மிகைப்படுத்திக் கூறப்பட்டதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய நிகழ்விலிருந்து வரும் விளைவு அல்லது முடிவை இயல்பான தமிழில் குறிக்கிறது.
- source_word: πρὸς ἑαυτούς
  choice: ஒருவருக்கொருவர்
  rationale: பரிசேயர்கள் தங்கள் குழுவினரிடையே பரஸ்பரம் பேசிக்கொண்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: Θεωρεῖτε
  choice: பார்க்கிறீர்களே
  rationale: இது பன்மை நிகழ்காலக் குறிப்பு வினை; விரக்தியுடன் ஒருவருக்கொருவர் உணர்த்தும் சொல்லின் தொனியைத் தக்கவைக்கிறது.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: நீங்கள் ஒன்றும் சாதிக்கவில்லை
  rationale: இயேசுவைத் தடுக்க அவர்கள் எடுத்த முயற்சிகள் பயனளிக்கவில்லை என்ற நடைமுறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: கவனத்தைத் திடீரென ஈர்க்கும் இடைச்சொல்லின் வலிமையை நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: கிரேக்கச் சொல்லின் உருவகத்தைத் தக்கவைத்து, அதை முதன்மை உரையிலேயே ‘எல்லாரும்’ என்று விளக்கமாகச் சுருக்கவில்லை.
- source_word: ὀπίσω αὐτοῦ
  choice: அவனுக்குப் பின்னால்
  rationale: ஒருவரைப் பின்தொடர்வதைக் குறிக்கும் கிரேக்கப் படிமத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἀπῆλθεν
  choice: போய்விட்டது
  rationale: நிகழ்ந்து முடிந்த செயலின் தற்போதைய விளைவைப் பரிசேயர்கள் சுட்டிக்காட்டும் தொனியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பரிசேயர்களின் கூற்றில் κόσμος என்பதன் வரம்பு
  choice: ‘உலகம்’ என்ற சொல்லை மிகைப்படுத்தப்பட்ட பேச்சாக முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘எல்லாரும்’ அல்லது ‘கூட்டம் முழுவதும்’ என்று மொழிபெயர்த்தல்
  rationale: விரக்தியில் பேசும் பரிசேயர்கள் மிகைப்படுத்திக் கூறுகின்றனர். ‘உலகம்’ என்பதைத் தக்கவைப்பது கிரேக்கச் சொல்லையும் யோவான் நற்செய்தியின் பரந்த சொற்பயன்பாட்டையும் பாதுகாக்கிறது; அதேவேளையில் எல்லா மனிதர்களும் உண்மையில் சீடர்களாகிவிட்டார்கள் என்ற கோட்பாட்டுக் கூற்றாக இதை மாற்றுவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரையாடலின் விரக்தி மற்றும் மிகைப்படுத்தல் உணர்வைத் தக்கவைக்கும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. இயேசுவைக் குறிப்பிடும் பரிசேயர்களின் நேரடி பேச்சில் இயல்பான ‘அவன்’ பயன்படுத்தப்பட்டுள்ளது.
