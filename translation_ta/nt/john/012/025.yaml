id: JHN.12.25
reference: John 12:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: ta
  text: தன் உயிரை[a] நேசிக்கிறவர் அதை இழக்கிறார்; இந்த உலகத்தில் தன் உயிரை வெறுக்கிறவர்[b] அதை நித்திய வாழ்வுக்காகக் காத்துக்கொள்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆத்துமாவை’ அல்லது ‘தன்னையே’; கிரேக்கச் சொல் ψυχή சூழலுக்கேற்ப ‘உயிர்,’ ‘தன்னிலை,’ அல்லது ‘ஆத்துமா’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் உயிரை வெறுப்பது’ என்பது இந்த உலகில் தன் உயிரைப் பற்றிக்கொள்வதை மறுப்பதைக் குறிக்கும் திட்டமிட்ட முரண்பாட்டுக் கூற்று; ஒத்த சொல்லாட்சிக்கு லூக்கா 14:26-ஐ ஒப்பிடுக. இது தன்னையே வெறுக்கும்படி போதிப்பதல்ல.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: நேசிக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் பொதுவான ஒருமை அர்த்தத்தையும் தொடரும் மனப்பாங்கையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ψυχὴν
  choice: உயிரை
  rationale: இச்சூழலில் ψυχή என்பது முதன்மையாக உடலிலிருந்து பிரிந்த ஆன்மாவை அல்ல, ஒருவருடைய உயிரை அல்லது வாழ்வையே குறிக்கிறது. இழத்தல்–காத்துக்கொள்ளுதல் என்ற எதிரிணைக்கும் ‘உயிர்’ இயல்பாகப் பொருந்துகிறது.
- source_word: ἀπολλύει
  choice: இழக்கிறார்
  rationale: இது நிகழ்காலச் செயப்பாட்டு வினை; தன் உயிரை நேசிப்பதன் விளைவைப் பொதுவான உண்மையாகக் கூறுகிறது. ‘அழிக்கிறார்’ என்பதைவிட ‘இழக்கிறார்’ சூழலுக்குப் பொருத்தமானது.
- source_word: ὁ μισῶν
  choice: வெறுக்கிறவர்
  rationale: μισέω என்ற வலிமையான சொல்லை மென்மையாக்காமல், மூலத்தின் திட்டமிட்ட முரண்பாட்டுத் தாக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: இந்த உலகத்தில்
  rationale: யோவானில் காணப்படும் தற்போதைய உலக ஒழுங்குக்கும் நித்திய வாழ்வுக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φυλάξει
  choice: காத்துக்கொள்வார்
  rationale: எதிர்கால வினையின் அர்த்தத்தையும், ‘இழக்கிறார்’ என்பதற்கு எதிரான பாதுகாத்து வைத்திருக்கும் எண்ணத்தையும் தெளிவாகத் தருகிறது.
- source_word: εἰς ζωὴν αἰώνιον
  choice: நித்திய வாழ்வுக்காக
  rationale: εἰς இங்கு குறிக்கோள் அல்லது இறுதி விளைவைச் சுட்டுகிறது. ‘நித்திய வாழ்வுக்காக’ என்பது அந்த நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτοῦ
  choice: தன்
  rationale: ஒரே நபருடைய உயிரையே இரு இடங்களிலும் குறிக்கிறது என்பதைத் தமிழின் இயல்பான தற்சுட்டுப் பெயரால் தெளிவாக்குகிறது; தேவையற்ற பாலினக் குறிப்பையும் தவிர்க்கிறது.
theological_decisions:
- issue: ‘தன் உயிரை வெறுப்பது’ என்பதன் பொருள்
  choice: ‘வெறுக்கிறவர்’ என்ற கூர்மையான சொல்லை அப்படியே வைத்திருந்து, தற்போதைய உலகில் உயிர்ப்பற்றைத் துறப்பதைக் குறிக்கும் முரண்பாட்டுக் கூற்றாகப் புரிந்துகொள்ளுதல்
  alternative: ‘தன் உயிரைக் குறைவாக நேசிக்கிறவர்’ அல்லது ‘தன் உயிரைப் பெரிதாகக் கருதாதவர்’
  rationale: மூலத்தில் μισέω என்ற வலிமையான வினை உள்ளது. அதன் இறையியல் மற்றும் சொல்லாட்சித் தீவிரத்தை முதன்மை உரையில் மென்மையாக்கக் கூடாது. ‘இந்த உலகத்தில்’ என்ற வரம்பிடும் சொற்றொடரும் அடிக்குறிப்பும் இது சுயவெறுப்பை ஊக்குவிப்பதல்ல என்பதை விளக்குகின்றன.
- issue: ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: இரு கூறுகளிலும் ‘உயிர்’
  alternative: ‘ஆத்துமா’ அல்லது ‘தன் இருப்பு’
  rationale: இழக்கவும் காத்துக்கொள்ளவும் கூடிய ஒருவருடைய உயிர் அல்லது வாழ்வு என்பதே உடனடிச் சூழலுக்குப் பொருத்தம். ‘ஆத்துமா’ என்பது மூலவசனம் கட்டாயப்படுத்தாத உடல்–ஆத்துமா பிரிவை வாசகனிடம் தூண்டக்கூடும்; சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நேசிக்கிறவர்/வெறுக்கிறவர்’ என்ற இணையான அமைப்பு மூலத்தின் சமச்சீரைத் தக்கவைக்கிறது; மரியாதை ஒருமை தமிழில் இயல்பான பொதுப்படையான நபர் குறிப்பாகப் பயன்படுத்தப்பட்டுள்ளது.
