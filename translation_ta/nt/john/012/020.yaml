  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: ta
  text: பண்டிகைக்கு வழிபடச் சென்றவர்களில் சில கிரேக்கர்கள் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறிப்பிட்ட சில கிரேக்கர்கள்.” இவர்கள் யார் என்பதை வசனம் மேலும் விளக்கவில்லை; பண்டிகையில் வழிபடச் சென்றதாக மட்டுமே கூறுகிறது.
    reason: ‘Ἕλληνές τινες’ என்பதன் மாற்றுச் சொல்வரிசையையும், அவர்களின் துல்லியமான அடையாளம் குறிப்பிடப்படாததையும் காட்டுகிறது.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: இருந்தார்கள்
  rationale: ἦσαν இருப்பைச் சுட்டுகிறது; δέ இங்கு மென்மையான உரைத்தொடர்ச்சி மாற்றத்தைக் காட்டுகிறது. தமிழில் தனியாக ‘ஆனால்’ அல்லது ‘இப்போது’ சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்; ‘சிலரும் இருந்தார்கள்’ என்பதில் தொடர்ச்சிச் சார்பு இயல்பாக வெளிப்படுகிறது.
- source_word: Ἕλληνές τινες
  choice: கிரேக்கர்கள் சிலர்
  rationale: Ἕλληνες என்பதன் நேரடியான இன/பண்பாட்டு குறிப்பு ‘கிரேக்கர்கள்’; τινες குறிப்பிடப்படாத சிலரைச் சுட்டுகிறது. ‘யூதரல்லாதவர்கள்’ எனப் பொதுமைப்படுத்தாமல் மூலத்தின் தெளிவையும் தெளிவின்மையையும் காக்கிறது.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: எருசலேமுக்குச் சென்றவர்களுள்
  rationale: ἐκ என்பது அந்தப் பயணக் குழுவினரில் இவர்கள் அடங்கியிருந்ததைச் சுட்டுகிறது. ἀναβαίνω பண்டிகைக்காக எருசலேமுக்குச் செல்லும் யாத்திரை வழக்கில் ‘மேலே செல்லுதல்’ என்ற கருத்தைக் கொண்டது; தமிழில் இயல்புக்காக இலக்கை வெளிப்படையாகக் கூறி ‘எருசலேமுக்குச் சென்றவர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἵνα προσκυνήσωσιν
  choice: வழிபடுவதற்காக
  rationale: ἵνα உடன் வரும் இறந்தகால வாய்ப்புவினை நோக்கத்தைச் சுட்டுகிறது; προσκυνέω இங்கு சமய வழிபாட்டைக் குறிக்கிறது. ‘வழிபடுவதற்காக’ நோக்கத்தை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐν τῇ ἑορτῇ
  choice: பண்டிகையின்போது
  rationale: ἑορτή யூதப் பண்டிகை நிகழ்வைக் குறிக்கிறது. ‘பண்டிகையின்போது’ என்பது காலச் சூழலை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது; பண்டிகையின் பெயரை மூலத்தை மீறிச் சேர்க்கவில்லை.
theological_decisions:
- issue: Ἕλληνες என்பவர்களின் அடையாளம்
  choice: ‘கிரேக்கர்கள்’ என்ற இன/பண்பாட்டு அடையாளம் தக்கவைக்கப்பட்டது.
  alternative: ‘யூதரல்லாதவர்கள்’ அல்லது அவர்கள் கிரேக்க மொழி பேசும் யூதர்கள், யூத மதத்தைத் தழுவியவர்கள், தேவபக்தர்கள் என்று குறிப்பாக்குதல்
  rationale: மூலம் அவர்களை Ἕλληνες என்று மட்டுமே அழைத்து, பண்டிகையில் வழிபட வந்ததாகக் கூறுகிறது. அவர்களின் துல்லியமான சமய நிலையைத் தீர்மானிக்காததால், மொழிபெயர்ப்பும் அந்தத் தெளிவின்மையையும் இறையியல் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேலே சென்றவர்கள்’ என்ற சொற்சொற் வடிவத்திற்குப் பதிலாக தமிழ் வாசகருக்குத் தெளிவாக ‘எருசலேமுக்குச் சென்றவர்கள்’ என யாத்திரைச் சூழல் வெளிப்படுத்தப்பட்டுள்ளது; அடையாளம் குறித்த மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
