review_pass:
  verdict: revise
  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் பெரும்பாலும் தக்கவைக்கப்பட்டுள்ளது: சில கிரேக்கர்கள் பண்டிகையில் வழிபடச் சென்றோர் கூட்டத்தில் இருந்தனர். ஆனால் ἀναβαινόντων என்பதன் நிகழ்காலப் பயணப் பங்கேற்பு ‘சென்றவர்களுள்’ என்பதில் முடிவுற்ற பயணமாக மாறுகிறது; மேலும் எருசலேமை வெளிப்படையாகச் சேர்ப்பது சூழலால் புரியக்கூடியதாயினும் இவ்வசனத்தில் சொல்லப்படாத தகவலை மொழிபெயர்ப்பில் சேர்க்கிறது.'
  naturalness: ‘பண்டிகையின்போது வழிபடுவதற்காக ... சென்றவர்களுள்’ இயல்பாக உள்ளது; ஆயினும் ‘பண்டிகைக்கு வழிபடச் சென்றவர்களில்’ என்பது சுருக்கமாகவும் நவீன தரத் தமிழில் நேர்த்தியாகவும் உள்ளது. ‘கிரேக்கர்கள் சிலரும்’ என்பது δέ-ஐ ‘also’ எனத் தேவையின்றி வலுப்படுத்தக்கூடும்; ‘சில கிரேக்கர்கள் இருந்தனர்’ போதுமானது.
  terminology: ‘கிரேக்கர்கள்’ என்பது Ἕλληνές τινες என்பதற்குச் சரியான, நடுநிலையான மொழிபெயர்ப்பு. ‘வழிபட’ என்பது προσκυνήσωσιν-க்கு ஏற்றது. அடிக்குறிப்பில் ‘யூதரல்லாதவர்கள்’ என்பது சாத்தியத்தை மட்டும் கூறினாலும், ‘கிரேக்கர்கள்’ என்பதைக் கலைத்து விளக்கும் அபாயம் உள்ளது; மூலத்தின் அடையாளத் தெளிவின்மையை மிகத் துல்லியமாகக் காக்க மறுசீரமைக்க வேண்டும்.
  issues:
  - severity: medium
    issue: ‘எருசலேமுக்குச் சென்றவர்களுள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத இலக்கைச் சேர்க்கிறது; ‘சென்றவர்கள்’ நிகழ்கால ἀναβαινόντων-ஐ நிறைவுபெற்ற செயலாகவும் மாற்றுகிறது.
