    rationale: Ἕλληνες-ன் அடிப்படைச் சொற்பொருள் ‘கிரேக்கர்கள்.’ அவர்களின் மத/சமூக அடையாளம் குறித்து உரை தீர்மானிக்கவில்லை; அந்தத் தெளிவின்மையை எந்த ஒரு அடையாளத்தையும் முன்னிலைப்படுத்தாமல் குறிப்பிட வேண்டும்.
