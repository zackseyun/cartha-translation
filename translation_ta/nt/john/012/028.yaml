source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: ta
  text: '“தந்தையே, உமது பெயரை மகிமைப்படுத்தும்.” அப்போது வானத்திலிருந்து ஒரு குரல் வந்தது: “நான் அதை மகிமைப்படுத்தினேன்; மீண்டும் மகிமைப்படுத்துவேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: தந்தையே
  rationale: கடவுளை நேரடியாக அழைக்கும் விளிவேற்றுமை வடிவம். கிரேக்கத்தில் ‘என்’ என்ற உடைமைச்சொல் இல்லாததால் அதைச் சேர்க்காமல், இயல்பான மரியாதைமிக்க தமிழில் ‘தந்தையே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δόξασόν
  choice: மகிமைப்படுத்தும்
  rationale: δοξάζω என்பதன் கட்டளை வடிவம். யோவான் நற்செய்தியில் தேவ மகிமை வெளிப்படுதல் என்ற கருத்துத் தொடர்பை ‘மகிமைப்படுத்தும்’ காக்கிறது; ‘கனப்படுத்தும்’ என்பது இங்கு பொருளைச் சுருக்கக்கூடும்.
- source_word: σου τὸ ὄνομα
  choice: உமது பெயரை
  rationale: பெயர் என்பது வெறும் அழைப்புப்பெயரை மட்டும் அல்லாமல், கடவுளின் வெளிப்படுத்தப்பட்ட தன்மையையும் புகழையும் சுட்டுகிறது. ‘உமது பெயரை’ என்பது இதை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἦλθεν οὖν
  choice: அப்போது ... வந்தது
  rationale: οὖν இங்கு கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்த முன்னேற்றத்தை வெளிப்படுத்துகிறது.
- source_word: φωνὴ
  choice: ஒரு குரல்
  rationale: φωνή என்பதற்கு ‘ஒலி’ என்றும் பொருள் இருக்கலாம்; ஆனால் அதைத் தொடர்ந்து நேரடி உரை வருவதால் இங்கு பேசும் ‘குரல்’ என்பது தெளிவு.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: குரலின் தெய்வீக மூலத்தைச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: நான் அதை மகிமைப்படுத்தினேன்; மீண்டும் மகிமைப்படுத்துவேன்
  rationale: ἐδόξασα என்பது இறந்தகால நிறைவுச் செயலைக் குறிக்கும் அஓரிஸ்ட்; தமிழில் ‘மகிமைப்படுத்தினேன்’ அதன் வடிவத்தையும் பொருளையும் நேரடியாகக் காக்கிறது. முன் வந்த ‘பெயரை’ மீண்டும் சுட்ட இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது. πάλιν எதிர்கால வினையுடன் ‘மீண்டும்’ என இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தெய்வீக பதிலில் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: ‘அதை’ என்று சேர்த்து, ‘உமது பெயரை’ என்பதையே சுட்டுதல்
  alternative: செயப்படுபொருளைச் சேர்க்காமல், ‘நான் மகிமைப்படுத்தினேன்; மீண்டும் மகிமைப்படுத்துவேன்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் சூழலிலிருந்து புரிவதால் விடப்பட்டுள்ளது. தமிழிலும் அதை விட முடிந்தாலும், ‘அதை’ என்பது எந்தப் புதிய கருத்தையும் சேர்க்காமல் முந்தைய ‘பெயரை’ தெளிவாகச் சுட்டி இயல்பான நடையைத் தருகிறது.
- issue: யோவானின் இறையியல் சார்ந்த சூழலில் δοξάζω என்பதன் மொழிபெயர்ப்பு
  choice: மகிமைப்படுத்து
  alternative: கனப்படுத்து; மகிமையை வெளிப்படுத்து
  rationale: தந்தையும் மகனும் தொடர்பான யோவானின் ‘மகிமை’ கருத்துத் தொடரை ‘மகிமைப்படுத்து’ காக்கிறது; அதை வெறும் மரியாதை அல்லது புகழ் என்ற அளவுக்குக் குறைக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; கடவுளை அழைக்கும் இடத்திலும் அவருடைய உரையிலும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘என்’ சேர்க்கப்படவில்லை. கிரேக்க அஓரிஸ்ட் தமிழில் இயல்பான இறந்தகாலமாக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
