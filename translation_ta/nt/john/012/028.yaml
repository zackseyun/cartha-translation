  source_fidelity: மூலக் கிரேக்கத்தின் விளிவேற்றுமை அழைப்பு (πάτερ), மரியாதைமிக்க கட்டளை (δόξασόν), ‘உமது பெயரை’ என்ற செயப்படுபொருள், வானத்திலிருந்து வந்த குரல், மற்றும் இறந்தகாலம்–எதிர்காலம் கொண்ட தெய்வீகப் பதில் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. பதிலில் உள்ள ‘அதை’ என்பது முன்வந்த ‘பெயரை’ மட்டுமே சுட்டுகிறது; புதிய பொருளைச் சேர்ப்பதில்லை.
  naturalness: நடை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தந்தையே’ மற்றும் ‘மகிமைப்படுத்தும்’ ஆகியவை கடவுளை நேரடியாக அழைக்கும் சூழலுக்கேற்ற மரியாதைமிக்க வேதாகம நடையாகும். ‘அப்போது’ கதைநடைத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
  terminology: ‘மகிமைப்படுத்து’ யோவானில் δοξάζω-வின் முக்கியமான இறையியல் சொல்லாட்சியைச் சரியாகப் பாதுகாக்கிறது. ‘உமது பெயர்,’ ‘வானத்திலிருந்து,’ மற்றும் ‘ஒரு குரல்’ ஆகிய தேர்வுகளும் நிலையான, புரியத்தக்க பயன்பாடுகள்.
