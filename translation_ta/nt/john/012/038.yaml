id: JHN.12.38
reference: John 12:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: ta
  text: 'இறைவாக்கினர் ஏசாயா கூறிய வார்த்தை நிறைவேறும்படி: “ஆண்டவரே, எங்கள் செய்தியை[a] நம்பியவர் யார்? ஆண்டவரின் கரம் யாருக்கு வெளிப்படுத்தப்பட்டது?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் கேட்டது”; அல்லது, “எங்களுடைய அறிவிப்பு.”
    reason: ἀκοή என்பது கேட்கப்பட்டதையும், அறிவிக்கப்பட்ட செய்தியையும் குறிக்கலாம்.
lexical_decisions:
- source_word: ἵνα
  choice: நிறைவேறும்படி இது நடந்தது
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கம்/விளைவு நுட்பத்தைத் தீர்மானித்துவிடாமல், முந்தைய வசனத்தின் நம்பாமையோடு இயல்பாக இணைக்கிறது.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: இறைவாக்கினராகிய ஏசாயா சொன்ன வார்த்தை
  rationale: λόγος என்பதன் ‘வார்த்தை’ பொருளையும், ஏசாயாவின் இறைவாக்கினர் பட்டத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: πληρωθῇ
  choice: நிறைவேறும்படி
  rationale: மேற்கோள் நிறைவேறுதல் என்ற யோவானின் கருத்தைத் தெளிவாகக் காக்கிறது; இறை நோக்கமா விளைவா என்பதை மிகுதியாகத் தீர்மானிக்கவில்லை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் விளிவேற்றுமையை வழக்கமான, கண்ணியமான வேதாகமத் தமிழில் வழங்குகிறது.
- source_word: ἐπίστευσεν
  choice: நம்பியவர்
  rationale: கிரேக்க இறந்தகால வினையின் சொல்லாட்சியையும் வினாவுக்குரிய பொதுவான வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: நாங்கள் அறிவித்த செய்தியை
  rationale: ἀκοή இங்கு கேட்கப்பட்ட/அறிவிக்கப்பட்ட செய்தியைக் குறிக்க முடியும். ‘நாங்கள் அறிவித்த செய்தி’ என்பது தமிழில் தெளிவாகவும் மேற்கோளின் புலம்பல் தொனிக்கு ஏற்றவாறும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὁ βραχίων κυρίου
  choice: ஆண்டவரின் கரம்
  rationale: இறை வல்லமையையும் செயலையும் குறிக்கும் மூல உருவகத்தை விளக்கிச் சிதைக்காமல் அப்படியே காக்கிறது.
- source_word: ἀπεκαλύφθη
  choice: வெளிப்படுத்தப்பட்டது
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: நிறைவேற்ற மொழியில் இறை நோக்கமும் விளைவும்
  choice: ‘நிறைவேறும்படி இது நடந்தது’ என்று மொழிபெயர்த்து நோக்கம்/விளைவு இரண்டையும் திறந்த நிலையில் வைத்தல்
  alternative: ‘அதன் விளைவாக ... நிறைவேறியது’ அல்லது ‘நிறைவேறுவதற்காக’
  rationale: யோவானின் ἵνα கட்டமைப்பு நோக்கம் அல்லது விளைவு, அல்லது இரண்டின் நுட்பத்தையும் தாங்கலாம். மொழிபெயர்ப்பு நம்பாமைக்கு அப்பாற்பட்ட நிர்ணயவாத விளக்கத்தைச் சேர்க்காமல் அந்த இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
- issue: ஏசாயா மேற்கோளிலுள்ள ἀκοή என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நாங்கள் அறிவித்த செய்தி’
  alternative: ‘நாங்கள் கேட்டது’ அல்லது ‘எங்களுடைய அறிவிப்பு’
  rationale: இச்சொல் கேட்டல், கேட்கப்பட்டது, அறிவிக்கப்பட்ட செய்தி ஆகிய பொருள்களை ஏற்கலாம். சூழலில் செய்தி என்ற பொருள் இயல்பானது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஆண்டவரின் கரம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
