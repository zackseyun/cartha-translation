source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: ta
  text: ஆகவே, அவர் லாசருவைக் கல்லறையிலிருந்து அழைத்து, இறந்தோரிலிருந்து எழுப்பியபோது அவருடன் இருந்த மக்கள் கூட்டம் அதைக் குறித்துத் தொடர்ந்து சாட்சி கூறிவந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சி அளித்துவந்தது.” கிரேக்க வினைச்சொல் சாட்சி கூறுதல் அல்லது சாட்சியம் அளித்தல் எனப் பொருள்படலாம்; இது யோவான் நூலில் மீண்டும் மீண்டும் வரும் ஒரு கருப்பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: தொடர்ந்து சாட்சி கூறிவந்தது
  rationale: இறந்தகால நிறைவுறா வினை வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த சாட்சியைக் குறிக்கிறது; யோவானில் திரும்பத் திரும்ப வரும் சாட்சி என்ற கருத்தையும் இச்சொற்றொடர் பாதுகாக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள கதைநடை மற்றும் விளைவுசார் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὁ ὄχλος
  choice: மக்கள் கூட்டம்
  rationale: குறிப்பிட்ட ஒரு திரளான மக்களை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: அவருடன் இருந்த
  rationale: முந்தைய நிகழ்வின்போது இயேசுவுடன் இருந்த குறிப்பிட்ட மக்கள் கூட்டத்தை அடையாளப்படுத்துகிறது; கிரேக்கத் தொடரின் காலத் தெளிவின்மையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: ἐφώνησεν
  choice: அழைத்து
  rationale: இங்கு இயேசு லாசருவை அழைத்ததைக் குறிக்கும் நேரடியான, இயல்பான சொல்; மூலத்தில் இல்லாத கூடுதல் உரத்த குரல் வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: ἐκ τοῦ μνημείου
  choice: கல்லறையிலிருந்து
  rationale: μνημεῖον இச்சூழலில் அடக்கம் செய்யப்பட்ட கல்லறையைக் குறிக்கிறது; ἐκ குறிக்கும் வெளியேற்ற இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து உயிருடன் எழுப்பிய
  rationale: எழுப்புதல் என்ற உயிர்த்தெழுதல் சார்ந்த பொருளைப் பாதுகாக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘உயிருடன்’ சேர்க்கப்பட்டுள்ளது, ஆனால் அற்புதக் கூற்றை மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: லாசருவை இறந்தோரிலிருந்து எழுப்பியதாகக் கூறும் உயிர்த்தெழுதல் மொழி
  choice: இறந்தோரிலிருந்து உயிருடன் எழுப்பிய
  alternative: மரித்தவர்களிடமிருந்து எழுப்பிய
  rationale: இயேசு லாசருவை இறந்தோரிலிருந்து எழுப்பினார் என்ற கிரேக்க உரையின் நேரடியான அற்புதக் கூற்றைப் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சி கூறிவந்தது’ என்பது யோவானின் சாட்சி சார்ந்த சொல்லாட்சியையும் கிரேக்க இறந்தகால நிறைவுறா வினையின் தொடர்ச்சியான அம்சத்தையும் ஒருங்கே வெளிப்படுத்துகிறது.
