source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: ta
  text: மேலும், அவருடைய கட்டளை நித்திய வாழ்வு என்பதை நான் அறிவேன்.[a] ஆகவே, நான் பேசுகிறவற்றைத் தந்தை என்னிடம் கூறியபடியே பேசுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய கட்டளை நித்திய வாழ்வுக்கு வழிநடத்துகிறது’ அல்லது ‘அவருடைய கட்டளை நித்திய வாழ்வைப் பற்றியது’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் இன்னும் நேரடியாக, ‘அவருடைய கட்டளை நித்திய வாழ்வு’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: கட்டளை
  rationale: அதிகாரத்துடன் கொடுக்கப்பட்ட ஆணை என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘கற்பனை’ இன்றைய வழக்கில் வேறு பொருள் தரக்கூடும்.
- source_word: ζωὴ αἰώνιος
  choice: நித்திய வாழ்வு
  rationale: யோவான் நூலின் நிலையான இறையியல் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: οἶδα
  choice: நான் அறிவேன்
  rationale: இயேசுவின் உறுதியான அறிவை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἃ ... λαλῶ
  choice: நான் பேசுகிறவற்றை ... பேசுகிறேன்
  rationale: ἃ என்பதன் பன்மைத் தன்மையைத் தமிழில் இயல்பாகக் காட்டுவதோடு, λαλῶ என்ற வினையின் மறுபடியும் வருதலையும் காக்கிறது.
- source_word: καθὼς εἴρηκέν μοι ὁ πατήρ
  choice: தந்தை என்னிடம் கூறியபடியே
  rationale: καθὼς காட்டும் துல்லியமான ஒத்திசைவையும், perfect வடிவத்தின் தொடரும் பொருத்தத்தையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் தர்க்கத் தொடர்பை மரியாதையான நவீன நடையில் காட்டுகிறது.
theological_decisions:
- issue: ‘அவருடைய கட்டளை நித்திய வாழ்வாக இருக்கிறது’ என்பதன் பொருள்
  choice: கிரேக்கத்தின் நேரடி சமன்பாட்டு அமைப்பைத் தக்கவைத்து ‘நித்திய வாழ்வாக இருக்கிறது’ என்று மொழிபெயர்த்தல்
  alternative: ‘நித்திய வாழ்வுக்கு வழிநடத்துகிறது’ அல்லது ‘நித்திய வாழ்வைப் பற்றியது’
  rationale: ἐστιν என்பது நேரடியாக ‘இருக்கிறது’ என்கிறது. விளைவு அல்லது பொருள் சார்ந்த ஒரு குறிப்பிட்ட விளக்கத்தை உரைக்குள் புகுத்தாமல், யோவான் உரையின் இறையியல் செறிவையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. ‘தந்தை’ என்பது கிரேக்கத்தின் ὁ πατήρ என்பதைப் பின்பற்றுகிறது; ‘என் தந்தை’ என்று விரிவாக்கப்படவில்லை. அடிக்குறி குறியீடு வாக்கிய முடிவில் இடப்பட்டு, முதல் கூற்றின் பொருள் மாற்றுகளை விளக்குகிறது.
