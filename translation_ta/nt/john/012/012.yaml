lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ὁ ὄχλος πολὺς
  choice: பெருந்திரளான மக்கள்
  rationale: ὄχλος என்ற கூட்டுப் பெயரையும் πολὺς குறிக்கும் பெரும் எண்ணிக்கையையும் இயல்பாக வெளிப்படுத்துகிறது; தொடரும் பன்மை வினையெச்சத்தோடும் பொருந்துகிறது.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: பண்டிகைக்கு வந்திருந்த
  rationale: பெயரடைத் தன்மையுள்ள வினையெச்சத்தை இயல்பான தமிழ்த் தொடர்புத் தொடராகவும், முன்பே நிகழ்ந்த வருகையை நிறைவுற்ற நிலையாகவும் காட்டுகிறது.
- source_word: ἀκούσαντες
  choice: கேள்விப்பட்டபோது
  rationale: ஆரிஸ்ட் வினையெச்சத்தின் காலத் தொடர்பை இயல்பாகக் காட்டி, கூட்டத்தில் இருந்த மக்களைக் குறிக்கும் பன்மைப் பொருளையும் சூழல் மூலம் தக்கவைக்கிறது.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: இயேசு ... வருகிறார் என்று
  rationale: மூலத்தின் வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, இயேசுவின் அணுகிவரும் இயக்கத்தை உயிரோட்டமாக வெளிப்படுத்துகிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: இயக்கத்தின் இலக்கை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
