translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் சார்பு வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘பண்டிகை’ என்பது ἑορτή என்பதற்கான இயல்பான பரந்த தமிழ் இணைச்சொல்; இச்சூழலில் பஸ்கா பண்டிகையைக் குறிக்கிறது.
