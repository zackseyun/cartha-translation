  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வரலாற்று நாணயப் பெயரான ‘தினார்’ முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
