source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: ta
  text: “இந்த நறுமணத் தைலம் ஏன் முந்நூறு தினாருக்கு விற்கப்பட்டு, அந்தப் பணம் ஏழைகளுக்குக் கொடுக்கப்படவில்லை?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தினார் என்பது பொதுவாக ஒரு தொழிலாளியின் ஒருநாள் கூலி. வேலை செய்யாத நாட்களையும் கணக்கில் கொண்டால், முந்நூறு தினார் ஏறக்குறைய ஓராண்டு வருமானத்துக்குச் சமம்.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் கிரேக்கச் சொற்றொடரின் இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: μύρον
  choice: நறுமணத் தைலம்
  rationale: விலையுயர்ந்த வாசனைமிக்க அபிஷேகத் தைலத்தைச் சுட்டுகிறது; சூழலுக்கேற்ற தெளிவான தமிழாக்கம்.
- source_word: οὐκ ἐπράθη
  choice: விற்காதது
  rationale: கிரேக்க இறந்தகாலச் செயப்பாட்டு வடிவத்தின் எதிர்மறை வினாவைத் தமிழில் இயல்பான சொல்லாட்சியுடன் தருகிறது.
- source_word: τριακοσίων δηναρίων
  choice: முந்நூறு தினாருக்கு
  rationale: விலையைக் குறிக்கும் உருபைத் தக்கவைத்து, வரலாற்று நாணயப் பெயரை விளக்கக் குறிப்புடன் பாதுகாக்கிறது.
- source_word: ἐδόθη
  choice: கொடுக்காதது
  rationale: முந்தைய எதிர்மறை வினாவுடன் இணையும் இரண்டாவது செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; பொருள் ஏழைகளுக்குக் கொடுக்கப்படுதல்.
- source_word: πτωχοῖς
  choice: ஏழைகளுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழியின் சமூகப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
