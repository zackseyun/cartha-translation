id: JHN.12.49
reference: John 12:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: ta
  text: ஏனெனில், நான் நானாகப் பேசவில்லை[a]. மாறாக, என்னை அனுப்பிய தந்தையே நான் எதைச் சொல்ல வேண்டும், எதைப் பேச வேண்டும்[b] என்று எனக்கு ஒரு கட்டளை கொடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சொந்தமாக” அல்லது “என் சொந்த அதிகாரத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூலத்தில் இங்கு “சொல்,” “பேசு” என இரண்டு வேறு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மொழிபெயர்ப்பு அந்த வேறுபாட்டைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: நானாக
  rationale: இயேசு தன்னிச்சையாக அல்லது தமது சொந்த அதிகாரத்தின் பேரில் பேசவில்லை என்ற மூலமொழியின் கருத்தை, தேவையற்ற விளக்கத்தைச் சேர்க்காமல் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: οὐκ ἐλάλησα
  choice: பேசவில்லை
  rationale: கிரேக்க இறந்தகால வினை வடிவைத் தமிழ் உரையாடல் சூழலுக்கு இயல்பாகப் பொருந்தும் வகையில் மொழிபெயர்த்து, இயேசுவின் இதுவரையான பேச்சைப் பற்றிய கூற்றைத் தெரிவிக்கிறது.
- source_word: ὁ πέμψας με πατὴρ
  choice: என்னை அனுப்பிய தந்தை
  rationale: பெயரெச்சத் தொடரையும் ‘தந்தை’ என்ற இறை உறவுப் பெயரையும் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: αὐτός
  choice: தந்தையே
  rationale: αὐτός தரும் வலியுறுத்தலைத் தமிழ் வலியுறுத்தும் ஏகாரத்தின் மூலம் காக்கிறது.
- source_word: ἐντολήν
  choice: ஒரு கட்டளை
  rationale: அதிகாரபூர்வமான உத்தரவைக் குறிக்கும் சொல்லின் வலிமையை இயல்பாகப் பாதுகாக்கிறது; ‘அறிவுரை’ என்பது அந்த வலிமையைக் குறைத்துவிடும்.
- source_word: δέδωκεν
  choice: கொடுத்திருக்கிறார்
  rationale: கிரேக்க நிறைவுக்காலம் காட்டும், முன்பு கொடுக்கப்பட்டு இப்போதும் செல்லுபடியாகும் கட்டளையின் தொடரும் விளைவைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί εἴπω
  choice: நான் எதைச் சொல்ல வேண்டும்
  rationale: கட்டளையின் உள்ளடக்கத்தையும் அதன் வழிநடத்தும் வலிமையையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: καὶ τί λαλήσω
  choice: எதைப் பேச வேண்டும்
  rationale: λέγω, λαλέω என்ற இரு வேறு கிரேக்க வினைகளின் வேறுபாட்டை ‘சொல்’, ‘பேசு’ என ஓரளவு பாதுகாக்கிறது.
theological_decisions:
- issue: மகனுடைய பேச்சுக்கும் தந்தையின் கட்டளைக்கும் உள்ள உறவு
  choice: இயேசு தன்னிச்சையாகப் பேசாமல், தம்மை அனுப்பிய தந்தையின் கட்டளைக்கு ஏற்ப பேசுகிறார் என்ற பணிசார் உறவை உரை பாதுகாக்கிறது.
  alternative: இயேசு வெறும் மனிதத் தீர்க்கதரிசியாக மட்டுமே பேசுகிறார் என்றோ, தந்தையிடமிருந்து முற்றிலும் சுயாதீனமாகச் செயல்படுகிறார் என்றோ பொருள் கொள்ளுதல்.
  rationale: ‘நானாகப் பேசவில்லை’ என்பதும் தந்தை கட்டளை கொடுத்தார் என்பதும் பணியிலும் பேச்சிலும் உள்ள சார்பைத் தெளிவாக்குகின்றன; அதற்கு அப்பாற்பட்ட இயல்புசார் தாழ்வை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
- issue: πατήρ என்பதன் மொழிபெயர்ப்பு
  choice: தந்தை
  alternative: பிதா
  rationale: யோவான் நற்செய்தியின் சூழலில் கடவுளைக் குறிக்கும் உறவுப் பெயரை, பொதுவான நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘தந்தையே’ என்ற வடிவம் மூலத்தின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது; ‘சொல்ல வேண்டும் / பேச வேண்டும்’ என்ற இணை அமைப்பு மூலத்திலுள்ள இரண்டு வினைகளையும் பாதுகாக்கிறது.
