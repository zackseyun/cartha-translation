base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: ta
  text: இப்போது இந்த உலகம் நியாயத்தீர்ப்புக்கு உள்ளாகிறது; இப்போது இந்த உலகத்தின் ஆட்சியாளர்[a] வெளியே துரத்தப்படுவார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த உலகத்தின் அதிபதி.’
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த உலகத்தின் ஆட்சியாளர்’ என்பது பொதுவாகச் சாத்தானைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: இப்போது
  rationale: இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி, கிரேக்கத்தின் கால அழுத்தத்தையும் இணை அமைப்பையும் காக்கிறது.
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: இந்த உலகம் நியாயத்தீர்ப்புக்கு உள்ளாகிறது
  rationale: κρίσις என்பதன் தீர்ப்புச் சார்ந்த பொருளைக் காக்கும் அதேவேளையில், இயல்பான நவீன தமிழில் genitive கட்டமைப்பை வெளிப்படுத்துகிறது. இது உலகமே தீர்ப்பின் பொருளா அல்லது அதன் ஒழுங்கு தீர்ப்புக்குள்ளாகிறதா என்ற சூழல்சார் ஆழத்தை அளவுக்கு மீறி விளக்குவதில்லை.
- source_word: κόσμου τούτου
  choice: இந்த உலகம் / இந்த உலகத்தின்
  rationale: τούτου என்ற சுட்டுப்பெயரின் வலிமையையும் யோவான் நூலுக்குரிய ‘இந்த உலகம்’ என்ற எதிர்நிலையையும் காக்கிறது.
- source_word: ἄρχων
  choice: ஆட்சியாளர்
  rationale: அதிகாரம் செலுத்துகிறவரைக் குறிக்கும் தெளிவான, நடப்பு தமிழ் சொல்; ‘அதிபதி’ என்பது சாத்தியமான மாற்றுச் சொல்.
- source_word: ἐκβληθήσεται ἔξω
  choice: வெளியே துரத்தப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், ἔξω வலியுறுத்தும் வெளியேற்றத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘இந்த உலகத்தின் ஆட்சியாளர்’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் பட்டப்பெயரை மட்டும் வைத்திருத்தல்
  alternative: சாத்தான் / பிசாசு என்று நேரடியாக அடையாளப்படுத்துதல்
  rationale: யோவான் நூலின் சூழலில் இது பொதுவாகச் சாத்தானைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டாலும், கிரேக்க மூலவுரை பெயரைச் சொல்லாமல் பட்டப்பெயரையே பயன்படுத்துகிறது. எனவே முதன்மை உரை அந்த மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- issue: κρίσις ἐστὶν τοῦ κόσμου τούτου என்பதன் இலக்கண வெளிப்பாடு
  choice: ‘இந்த உலகம் நியாயத்தீர்ப்புக்கு உள்ளாகிறது’
  alternative: ‘இந்த உலகத்திற்கு நியாயத்தீர்ப்பு உண்டாகிறது’
  rationale: தீர்ப்பு நிகழ்வின் நிகழ்காலத் தீவிரத்தை இயல்பாகத் தெரிவிக்கிறது; ‘கண்டனம்’ என்று மொழிபெயர்த்து தீர்ப்பின் முடிவை மட்டும் முன்கூட்டியே குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இப்போது’ என்ற மறுமொழியும் இரு அரைவாக்கியங்களின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
