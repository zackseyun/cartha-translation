source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: ta
  text: என்னை நம்புகிற ஒவ்வொருவரும்[b] இருளில் நிலைத்திருக்காதபடி, நான் ஒளியாக[a] உலகத்திற்குள் வந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓர் ஒளியாக.’ கிரேக்கத்தில் இச்சொல்லுக்கு முன் கட்டுரைச் சொல் இல்லை; இதை பண்புசார் பொருளில் ‘ஒளியாக’ என்றும், இன்னும் சொல்லுக்கு நெருக்கமாக ‘ஓர் ஒளியாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னை நம்புகிற எவரும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ஒளியாக
  rationale: கட்டுரைச் சொல் இல்லாத φῶς இங்கு இயேசுவின் அடையாளத்தையும் பணியையும் பண்புசார் முறையில் குறிக்கிறது. ‘ஒளியாக’ என்பது உருவகத்தை விளக்கவுரையாக விரிவுபடுத்தாமல் இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: εἰς + வேற்றுமை உருபு ஒரு வட்டத்திற்குள் வரும் இயக்கத்தை வெளிப்படுத்துகிறது; ‘உலகத்திற்குள்’ அந்த வருகையின் திசையையும் அவதாரப் பின்னணியையும் காக்கிறது.
- source_word: ἐλήλυθα
  choice: வந்திருக்கிறேன்
  rationale: நிறைவுக்கால வினை, நிகழ்ந்த வருகையின் தற்போதைய விளைவைச் சுட்டுகிறது; ‘வந்திருக்கிறேன்’ இதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: …நிலைத்திருக்காதபடியே
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கத்தைத் தமிழில் தெளிவாகக் காட்ட, இறுதி வாக்கியத்தில் ‘வந்தேன்’ என்பதோடு நோக்கக் கட்டமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: πᾶς ὁ πιστεύων
  choice: நம்புகிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லுடன் πᾶς சேர்ந்து நம்புகிற அனைவரையும் பொதுவாகக் குறிக்கிறது; இத்தொடர் அதன் பரப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: πιστεύων εἰς ἐμέ
  choice: என்னை நம்புகிற
  rationale: ஒரு நபரை நோக்கிய πιστεύω εἰς என்பது தனிப்பட்ட நம்பிக்கையைச் சுட்டுகிறது. ‘என்னை நம்புகிற’ என்பது பொதுவாகப் புரியும் இயல்பான தமிழ்; வெறும் கருத்தொன்றை உண்மை என ஏற்றுக்கொள்வதாக இதைக் குறுக்கவில்லை.
- source_word: ἐν τῇ σκοτίᾳ
  choice: இருளில்
  rationale: யோவானின் மொழிநடையில் இது அறநெறி மற்றும் ஆவிக்குரிய ஆட்சிப்பரப்பைக் குறிக்கும் உருவகம். தமிழில் ‘இருளில்’ என்பதே அந்த உருவகத்தை இயல்பாகக் காக்கிறது; கிரேக்கக் கட்டுரை தமிழில் தனியே மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: μὴ μείνῃ
  choice: நிலைத்திருக்காதபடி
  rationale: ἵνα என்பதற்குப் பின் வரும் எதிர்மறை துணைவினை நோக்கப்பட்ட விளைவைத் தெரிவிக்கிறது. ‘நிலைத்திருக்காதபடி’ என்பது இருளில் தொடர்ந்திருப்பதைத் தவிர்ப்பதே நோக்கம் என்ற பொருளைக் காக்கிறது.
theological_decisions:
- issue: யோவானின் ஒளி உருவகத்தில் கிறிஸ்துவின் சுயஅடையாளம்
  choice: இயேசு ‘ஒளியாக’ உலகத்திற்குள் வந்ததாக உருவகத்தை நேரடியாகக் காத்தல்
  alternative: ‘உலகத்திற்கு ஒளியைக் கொண்டுவர வந்தேன்’ என்று பணியை மட்டும் விளக்கிப் பரிமாற்றுதல்
  rationale: மூலவாக்கியம் இயேசுவை ஒளியோடு அடையாளப்படுத்தும் வலிமையான உருவகத்தைப் பயன்படுத்துகிறது. அதை வெறும் ஒளியைக் கொண்டுவரும் பணியாக மாற்றாமல், அதேவேளை கூடுதல் கோட்பாட்டு விளக்கமும் சேர்க்காமல் காக்கப்பட்டுள்ளது.
- issue: πᾶς ὁ πιστεύων என்பதன் பரப்பு
  choice: ‘நம்புகிற ஒவ்வொருவரும்’ என்று பொதுவான முழுப் பரப்பை வெளிப்படுத்துதல்
  alternative: ‘நம்புகிற எவரும்’
  rationale: வசனம் நம்புகிறவர்களின் முழு வகுப்பையும் குறிக்கிறது; நம்பிக்கை எவ்வாறு உருவாகிறது என்ற தேர்தல் அல்லது சுயசித்தம் சார்ந்த விவாதத்தை இங்கு தீர்மானிப்பதில்லை. மொழிபெயர்ப்பு அந்தத் திறந்த தத்துவத் திணறலை அப்படியே விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஒளி–இருள்’ என்ற யோவானிய எதிர்மறை இணை அப்படியே காக்கப்பட்டுள்ளது. மூலத்தின் நோக்கத் தொடர்பைத் தெளிவாக்க இறுதியில் ‘வந்தேன்’ மீண்டும் சொல்லப்பட்டுள்ளது; இது தமிழில் இயல்பை மேம்படுத்தினாலும் புதிய கருத்தைச் சேர்ப்பதில்லை.
