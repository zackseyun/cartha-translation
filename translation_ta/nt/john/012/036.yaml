revisions:
- from: ஒளி உங்களிடம் இருக்கும்போதே, ஒளியின்மேல் நம்பிக்கை வையுங்கள்; அப்போது நீங்கள் ஒளியின் மகன்களாக[a] ஆகலாம். இயேசு இவற்றைச் சொன்னார். பின்பு அவர் அங்கிருந்து சென்று, அவர்களிடமிருந்து மறைந்துகொண்டார்.[b]
  to: ஒளி உங்களிடம் இருக்கும்போதே, ஒளியின்மேல் நம்பிக்கை வையுங்கள்; நீங்கள் ஒளியின் மகன்களாக[a] ஆகும்படி. இயேசு இவற்றைச் சொன்னார்; பின்னர் அவர் விலகிச் சென்று, அவர்களிடமிருந்து மறைந்துகொண்டார்.[b]
  rationale: The revision restores the telic force of ἵνα γένησθε through ‘நீங்கள் ... ஆகும்படி,’ retaining the sense of becoming rather than simply being or possibly becoming. It also removes the unrequired locative sense in ‘அங்கிருந்து,’ while preserving the contextual middle-like main rendering of ἐκρύβη and retaining a footnote for its formal passive reading.
