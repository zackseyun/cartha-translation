  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: ta
  text: ஒளி உங்களிடம் இருக்கும்போதே, ஒளியின்மேல் நம்பிக்கை வையுங்கள்; நீங்கள் ஒளியின் மகன்களாக[a] ஆகும்படி. இயேசு இவற்றைச் சொன்னார்; பின்னர் அவர் விலகிச் சென்று, அவர்களிடமிருந்து மறைந்துகொண்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒளியின் பிள்ளைகளாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்கு சொல் ‘ஒளியின் மகன்கள்’; இது ஒளியால் பண்புருவாக்கப்பட்ட மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க வினை வடிவை வெளிப்படையான செயப்பாட்டு வடிவில் எடுத்தால், ‘அவர்களிடமிருந்து மறைக்கப்பட்டார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: ஒளி உங்களிடம் இருக்கும்போதே
  rationale: ὡς உடன் வரும் நிகழ்கால வினை இங்கு காலப் பொருளைத் தருகிறது. ‘இருக்கும்போதே’ என்பது வாய்ப்பின் குறுகிய காலத்தையும் அவசரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: யோவான் நற்செய்தியில் தொடரும் ‘ஒளி’ உருவகத்தையும் அதன் கிறிஸ்துவைச் சுட்டும் ஒலிப்பையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: ஒளியின்மேல் நம்பிக்கை வையுங்கள்
  rationale: πιστεύω εἰς என்பதன் நம்பிக்கையையும் அதன் நோக்குநிலையையும் ‘நம்பிக்கை வையுங்கள்’ என்ற இயல்பான நவீனத் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: இங்கு நோக்கத்துடனான விளைவைக் காட்டும் ἵνα-வாக்கியத்தை தமிழில் இயல்பாக இணைக்கிறது; ‘நீங்கள் ... ஆகலாம்’ என்பதுடன் சேர்ந்து நோக்கம்/விளைவு இரண்டின் நுணுக்கத்தையும் விடுகிறது.
- source_word: υἱοὶ φωτός
  choice: ஒளியின் மகன்கள்
  rationale: υἱοί என்ற ஆண்பால் பன்மை வடிவத்தை நேரடியாகக் காக்கிறது; இது ஒளியால் பண்புருவாக்கப்பட்ட மக்களைச் சுட்டும் செமித்திய மரபுத்தொடர்.
- source_word: γένησθε
  choice: ஆகலாம்
  rationale: γίνομαι என்பதன் ‘ஆகுதல்’ நுணுக்கத்தையும், subjunctive வடிவத்தின் சாத்தியம்/நோக்கச் சார்பையும் காக்கிறது.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: இயேசு இவற்றைச் சொன்னார்
  rationale: தமிழில் ‘இவற்றைப் பேசினார்’ என்பதைவிட ‘இவற்றைச் சொன்னார்’ இயல்பாகவும், λαλέω-வின் உரைத்தல் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: ἀπελθὼν
  choice: பின்பு அவர் அங்கிருந்து சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழும் aorist participle செயலை ‘பின்பு ... சென்று’ என இயல்பான தமிழ் நிகழ்வோட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: ἐκρύβη ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து மறைந்துகொண்டார்
  rationale: வடிவில் passive ஆனாலும் இச்சூழலில் நடுநிலைப் பொருளுடன் தாமே மறைந்த செயலைக் குறிக்க இயலும். ‘மறைந்துகொண்டார்’ அந்தக் கதையோட்டத்தை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: υἱοὶ φωτός என்ற பாலினம் கொண்ட குடும்ப மரபுத்தொடர்
  choice: ஒளியின் மகன்கள்
  alternative: ஒளியின் பிள்ளைகள்
  rationale: மூலத்தின் υἱοί என்ற ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது. அதேவேளை, மரபுத்தொடர் ஒளியால் பண்புருவாக்கப்பட்ட அனைவரையும் குறிக்கக்கூடும் என்பதால் உள்ளடக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πιστεύω εἰς என்ற யோவானிய நம்பிக்கைச் சொற்றொடர்
  choice: ஒளியின்மேல் நம்பிக்கை வையுங்கள்
  alternative: ஒளியை நம்புங்கள்
  rationale: ‘ஒளியின்மேல் நம்பிக்கை வையுங்கள்’ என்பது εἰς தரும் நோக்குநிலையைத் தெளிவாகக் காக்கிறது; ஒளி குறித்த யோவானிய இறையியல் ஒலிப்பை கூடுதல் விளக்கமின்றி விடுகிறது.
- issue: ἐκρύβη என்பதன் passive வடிவமும் சூழல்சார் நடுநிலைப் பொருளும்
  choice: மறைந்துகொண்டார்
  alternative: மறைக்கப்பட்டார்
  rationale: கதையின் சூழல் இயேசு விலகிச் சென்று தம்மை மறைத்துக்கொண்டதைக் குறிக்கிறது. இருப்பினும் கிரேக்க வடிவின் வெளிப்படையான passive வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘ஒளி’ என்ற யோவானிய மைய உருவகம் ஒரே வடிவில் காக்கப்பட்டுள்ளது. மிகப் பழமையான சமயச் சொல்லாட்சியான ‘விசுவாசியுங்கள்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘நம்பிக்கை வையுங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ஆனால் மூலத்தின் திசைநோக்குப் பொருள் தக்கவைக்கப்பட்டுள்ளது.
