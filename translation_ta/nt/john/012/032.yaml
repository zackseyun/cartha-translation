id: JHN.12.32
reference: John 12:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: ta
  text: நானோ, பூமியிலிருந்து உயர்த்தப்பட்டால்[a][b], எல்லாரையும்[c] என்னிடமாக இழுத்துக்கொள்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயர்த்தப்படும்போது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நிபந்தனை வடிவம் உள்ளது; ஆனால் சூழலில் இது நெருங்கிவரும் இயேசுவின் மரணத்தை உறுதியான நிகழ்வாகச் சுட்டுகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘உயர்த்தப்படுதல்’ என்பது ‘மேன்மைப்படுத்தப்படுதல்’ அல்லது ‘மகிமைப்படுத்தப்படுதல்’ என்ற பொருளையும் தரலாம்; இதனால் சிலுவையும் மகிமையும் பற்றிய யோவானின் இரட்டைப் பொருள் காக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘எல்லாரையும்’ என்பதே உள்ளது; இது மக்களைக் குறிக்கிறது. இரட்சிப்பின் பரப்பைப் பற்றிய பின்னைய இறையியல் விவாதத்தை இவ்வசனம் தனியே எவ்வாறு தீர்க்கிறது என்பதை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: நானோ
  rationale: καί + ἐγώ ஆகியவற்றின் இணைவு தொடர்ச்சியோடு தனிப்பட்ட வலியுறுத்தலையும் தருகிறது. ‘நானோ’ என்பது சூழலிலுள்ள மிதமான எதிர்நிலையையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐὰν
  choice: -ப்பட்டால்
  rationale: ἐάν உடன் வரும் subjunctive வடிவின் நிபந்தனைத் தன்மையை ‘-ஆல்’ காக்கிறது; அதேவேளையில், சூழலில் நிச்சயமாக நெருங்கிவரும் நிகழ்வைப் பற்றிய குறிப்பையும் இது மறுப்பதில்லை.
- source_word: ὑψωθῶ
  choice: உயர்த்தப்பட்டால்
  rationale: சிலுவையில் உடலாக உயர்த்தப்படுதல், மகிமைப்படுத்தப்படுதல் என்ற யோவானின் இரட்டைப் பொருளையும் ‘உயர்த்தப்படுதல்’ காக்கிறது.
- source_word: ἐκ τῆς γῆς
  choice: பூமியிலிருந்து
  rationale: γῆ இங்கு குறிப்பிட்ட ஒரு நாட்டைவிட பூமி அல்லது நிலத்திலிருந்து மேலே உயர்த்தப்படுவதைக் குறிக்கிறது; அடுத்த வசனத்தின் சிலுவை மரண விளக்கத்துக்கும் இது பொருந்துகிறது.
- source_word: πάντας
  choice: எல்லாரையும்
  rationale: ஆண்பால் பன்மை accusative இங்கு பொதுவாக மனிதர்களைக் குறிக்கிறது. ‘எல்லாரையும்’ என்பது மனிதப் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது; பின்னைய இரட்சிப்பியல் விவாதங்களைத் தீர்மானிப்பதில்லை.
- source_word: ἑλκύσω
  choice: இழுத்துக்கொள்வேன்
  rationale: ἕλκω என்பதின் இழுத்தல் அல்லது தம்மிடம் கொண்டுவருதல் என்ற வலிமையை இது காக்கிறது; அந்தச் செயலின் துல்லியமான முறையை கூடுதலாக வரையறுப்பதில்லை.
- source_word: πρὸς ἐμαυτόν
  choice: என்னிடமாக
  rationale: πρός உடன் வரும் வலியுறுத்தப்பட்ட reflexive pronoun, இயக்கத்தின் இலக்கு இயேசுவே என்பதைச் சுட்டுகிறது. ‘என்னிடமாக’ அந்தத் திசையையும் தனிப்பட்ட வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: இரட்சிப்புடன் தொடர்புடைய πάντας என்பதன் பரப்பு
  choice: எல்லாரையும்
  alternative: அனைத்தையும்; வேறுபாடின்றி எல்லாரையும்; விதிவிலக்கின்றி ஒவ்வொருவரையும்
  rationale: ஆண்பால் பன்மை வடிவம் இயல்பாக மனிதர்களைக் குறிக்கிறது. இயேசுவின் இழுக்கும் செயலின் பரந்த பரப்பை வசனம் கூறுகிறது; ஆனால் அது ஒவ்வொரு தனிநபரையும் விதிவிலக்கின்றி குறிக்கிறதா அல்லது எல்லா வகை மக்களையும் குறிக்கிறதா என்ற பின்னைய இறையியல் விவாதத்தை வசனத்துக்குள் இறக்குமதி செய்யாமல் விடுகிறது.
- issue: ὑψωθῶ என்பதிலுள்ள யோவானின் இரட்டைப் பொருள்
  choice: உயர்த்தப்பட்டால்
  alternative: மகிமைப்படுத்தப்பட்டால்
  rationale: சிலுவையில் உயர்த்தப்படுதலையும் மகிமைப்படுத்தப்படுதலையும் ஒருங்கே ஒலிக்கச் செய்யும் சொல்லாட்சியை ‘உயர்த்தப்பட்டால்’ காக்கிறது. ‘மகிமைப்படுத்தப்பட்டால்’ என்று மட்டும் மொழிபெயர்த்தால் உடல்சார்ந்த சிலுவைக் குறிப்பை மறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘இழுத்துக்கொள்வேன்’ மூலவினையின் வலிமையைத் தக்கவைக்கிறது; ‘ஈர்ப்பேன்’ என மென்மையாக்கவில்லை. நிபந்தனைத் தன்மை, சிலுவை–மகிமை இரட்டைப் பொருள், ‘எல்லார்’ என்பதன் இறையியல் பரப்பு ஆகியவை குறிப்புகள் மூலம் திறந்தவையாக வைக்கப்பட்டுள்ளன.
