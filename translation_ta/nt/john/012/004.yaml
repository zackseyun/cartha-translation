  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: ta
  text: 'ஆனால், அவருடைய சீடர்களில் ஒருவனாகிய யூதாஸ் இஸ்காரியோத்து[a]—அவரைக் காட்டிக்கொடுக்கவிருந்தவன்—சொன்னான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “அவரை ஒப்படைக்கவிருந்தவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: சொன்னான்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தொடர்ச்சியான தமிழ் கதைநடையில் இறந்தகாலமான ‘சொன்னான்’ இயல்பாக உள்ளது; அதே உரையாடல் அறிமுகப் பணியைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: மரியாளின் செயலுக்கும் இப்போது எழும் எதிர்ப்புக்கும் இடையிலான மென்மையான முரண்பாட்டை δέ குறிக்கிறது; ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: யூதாஸ் இஸ்காரியோத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்; பெயரின் அடையாளத் தன்மையையும் காக்கிறது.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் ஒருவன்
  rationale: μαθητής என்பதிலுள்ள ஆசிரியர்–சீடர் உறவை ‘சீடர்’ துல்லியமாகக் காக்கிறது.
- source_word: ὁ μέλλων
  choice: கொடுக்கவிருந்தவன்
  rationale: μέλλω வரவிருக்கும் செயலைச் சுட்டுகிறது; ‘விருந்தவன்’ என்பது தமிழில் அந்த எதிர்நோக்கைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: παραδιδόναι
  choice: காட்டிக்கொடுக்க
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருள் ‘ஒப்படைக்க’ என்றாலும், யூதாஸ் இயேசுவை பகைவர்களிடம் துரோகமாக ஒப்படைத்த சூழலில் ‘காட்டிக்கொடுக்க’ என்பது இயல்பான, சூழலுக்கேற்ற தமிழ் சொல்லாகும்; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யூதாஸ் இயேசுவுக்கு செய்த செயலைக் குறிக்கும் παραδιδόναι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுக்க
  alternative: ஒப்படைக்க
  rationale: ‘ஒப்படைக்க’ என்பது வினையின் பரந்த, நேரடியான பொருளைத் தக்கவைக்கிறது. ஆனால் இச்சூழலில் செயல் நடுநிலையான ஒப்படைப்பு அல்ல, துரோகச் செயலாகும்; ‘காட்டிக்கொடுக்க’ அதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது. பரந்த சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடரின் பல அடைமொழிகள் வாசிக்கத் தெளிவாக ‘ஒருவனும் ... வனுமான’ என்ற கட்டமைப்பில் இணைக்கப்பட்டுள்ளன; அடுத்த வசனத்தில் வரும் நேரடி உரைக்காக இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
