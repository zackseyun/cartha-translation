  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: ta
  text: பிலிப்பு அந்திரேயாவிடம் வந்து தெரிவிக்கிறார்; அந்திரேயாவும் பிலிப்பும் இயேசுவிடம் வந்து தெரிவிக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நான்கு வினைகளும் ‘வருகிறார் … தெரிவிக்கிறார் … வருகிறார்கள் … தெரிவிக்கிறார்கள்’ என்ற வரலாற்று நிகழ்கால வடிவில் உள்ளன; இது கதையாடலுக்கு உடனடித் தன்மையை அளிக்கிறது. தமிழில் இயல்பான ஓட்டத்திற்காக ‘வருதல்’ ‘வந்து’ என இணைவினையெச்சமாக அமைந்துள்ளது; தெரிவிக்கும் வினைகள் நிகழ்காலத்தில் உள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்து
  rationale: நகர்வை இயல்பான தமிழில் அடுத்த தகவல் பரிமாற்றச் செயலுடன் இணைக்கிறது; நிகழ்கால வினைமுற்று ‘தெரிவிக்கிறார்’ என்பதில் வரலாற்று நிகழ்காலம் காக்கப்படுகிறது.
- source_word: λέγει
  choice: தெரிவிக்கிறார்
  rationale: ஒருவரிடம் ஒரு வேண்டுகோள் அல்லது செய்தியை எடுத்துரைக்கும் சூழலை இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘சொல்கிறார்’ என்பதைக் காட்டிலும் தகவல் பரிமாற்றத்தைத் தெளிவாக்குகிறது.
- source_word: τῷ Ἀνδρέᾳ
  choice: அந்திரேயாவிடம்
  rationale: கிரேக்க வேற்றுமையின் பெறுநர் பொருளை ‘-இடம்’ மூலம் இயல்பான தமிழில் காட்டுகிறது; பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: Ἀνδρέας καὶ Φίλιππος
  choice: அந்திரேயாவும் பிலிப்பும்
  rationale: இருவரும் சேர்ந்து அடுத்த செயலைச் செய்வதை இணைப்புச் சுட்டான ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγουσιν τῷ Ἰησοῦ
  choice: இயேசுவிடம் வந்து தெரிவிக்கிறார்கள்
  rationale: பன்மை வினை வடிவத்தையும் தகவலைப் பெறுபவரையும் தெளிவாகக் காக்கிறது.
- source_word: καί
  choice: ; / -உம்
  rationale: கிரேக்கத்தின் தொடர்ச்சியான இணைப்பை தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்கேற்ப அரைப்புள்ளி மற்றும் இணைப்பு விகுதி மூலம் வெளிப்படுத்துகிறது; கூடுதல் காலவியல் அல்லது காரணவியல் பொருள் சேர்க்கப்படவில்லை.
