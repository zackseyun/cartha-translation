translation:
  language: ta
  text: எவ்வகையான மரணத்தால் தாம் இறக்கவிருந்தார் என்பதைச் சுட்டிக்காட்டி அவர் இதைச் சொன்னார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவ்வகையான மரணத்தின் மூலம் இறக்கவிருந்தார்.” கிரேக்கத் தொடர் மரணத்தின் முறையை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இதை
  rationale: முந்தைய வசனத்தில் இயேசு கூறியதைக் குறிக்கும் ஒருமை நடுநிலைச் சுட்டுப்பெயருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான உரைத் தொடர்பை மட்டுமே தருகிறது; தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது. ‘ஆனால்’ என்று மொழிபெயர்ப்பது தேவையற்ற முரண்பாட்டை உருவாக்கும்.
- source_word: ἔλεγεν
  choice: சொன்னார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலைப் பார்வையை தமிழில் ‘சொல்லிக்கொண்டிருந்தார்’ என்று நேரடியாகக் காட்டுவது இச்சூழலில் செயற்கையாக இருக்கும்; இயல்பான கதைநடை வடிவமான ‘சொன்னார்’ சூழலிலுள்ள செயலைத் தெளிவாகத் தருகிறது.
- source_word: σημαίνων
  choice: குறிப்பிடவே
  rationale: ஒரு குறிப்பின்மூலம் உணர்த்துதல் அல்லது சுட்டிக்காட்டுதல் என்ற யோவானியப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ποίῳ θανάτῳ
  choice: எத்தகைய மரணத்தால்
  rationale: மரணத்தின் வெறும் நிகழ்வை அல்ல, அதன் வகை அல்லது முறையை வலியுறுத்தும் கிரேக்கத் தத்திவை ‘மரணத்தால்’ தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: ἤμελλεν
  choice: இறக்கவிருந்தார்
  rationale: எதிர்வரும் செயலைக் குறிக்கும் μέλλω என்பதைக் காட்டுகிறது; ‘விதிக்கப்பட்டிருந்தது’ போன்ற வலுவான இறையியல் கருத்தைச் சேர்க்கவில்லை.
- source_word: ἀποθνῄσκειν
  choice: இறக்க
  rationale: ἤμελλεν என்பதோடு இணையும் வினையெச்சத்தின் நேரடியான, இயல்பான தமிழ் பொருள்.
theological_decisions:
- issue: இந்த மரணம் சிலுவை மரணம் என்பதை வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘எத்தகைய மரணத்தால் இறக்கவிருந்தார்’ என்ற மறைமுகமான மூலச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘சிலுவையில் எவ்வாறு இறக்கவிருந்தார்’ அல்லது ‘எவ்வாறு கொல்லப்படவிருந்தார்’
  rationale: சூழல் சிலுவை மரணத்தைக் குறித்தாலும், இவ்வசனம் அதை நேரடியாகப் பெயரிடவில்லை. எனவே மூலத்தின் மறைமுகத் தன்மையும் இறையியல் நெருக்கடியும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒரே வாக்கியத்தில் இயேசுவைக் குறிக்கும் இரு இடங்களையும் குழப்பமின்றி வேறுபடுத்த ‘தாம்’ மற்றும் ‘அவர்’ பயன்படுத்தப்பட்டுள்ளன.
