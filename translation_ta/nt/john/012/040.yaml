source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: ta
  text: “அவர் அவர்களுடைய கண்களைக் குருடாக்கியிருக்கிறார்; அவர்களுடைய இதயத்தைக் கடினப்படுத்தினார். அவர்கள் தங்கள் கண்களால் காணாமலும், இதயத்தால் புரிந்துகொள்ளாமலும், திரும்பி நான் அவர்களைக் குணமாக்காதபடிக்கும் இவ்வாறு செய்தார்.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: இந்த வசனம் ஏசாயா 6:10-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: குருடாக்கி ... இருக்கிறார்
  rationale: நிறைவேற்றுக் காலம், செய்து முடிக்கப்பட்ட செயலால் தொடரும் தற்போதைய நிலையை உணர்த்துகிறது; தமிழ் தொடரமைப்பில் அடுத்த வினையுடன் இணைத்து அந்த விளைவு நீடிப்பைப் பேணுகிறது.
- source_word: ἐπώρωσεν
  choice: கடினப்படுத்தியிருக்கிறார்
  rationale: உணர்வற்ற அல்லது மழுங்கிய நிலைக்கு ஆக்குதல் என்ற பொருளை உள்ளடக்கினாலும், தீர்ப்புசார் இறுக்கத்தை இயல்பாகவும் தெளிவாகவும் ‘கடினப்படுத்தினார்’ வெளிப்படுத்துகிறது.
- source_word: καρδίαν / καρδίᾳ
  choice: இதயம் / இதயத்தால்
  rationale: அறிவாற்றலையும் உள்ளார்ந்த உணர்வையும் குறிக்கும் வேதாகமப் படிமத்தை ‘இதயம்’ பேணுகிறது; நோέω வினையின் மொழிபெயர்ப்பு அறிவுசார் நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ
  choice: அதனால் ... காணாமலும் ... உணராமலும் ... திரும்பாமலும் இருக்கிறார்கள்
  rationale: இந்த மேற்கோளில் நோக்கம்/விளைவு இரண்டிற்கும் இடமளிக்கும் அமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; கடினமான இறைச் செயலாண்மையை மென்மைப்படுத்தவில்லை.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: தங்கள் கண்களால் காணாமல்
  rationale: கண்கள் என்ற நேரடியான படிமத்தையும், இதயத்தால் உணருதல் என்பதுடனான இணை அமைப்பையும் பேணுகிறது.
- source_word: νοήσωσιν
  choice: உணராமல்
  rationale: இங்கு மனதால் புரிந்துகொள்ளுதல் அல்லது உள்ளுணர்தல் என்பதைக் குறிக்கிறது; ‘இதயத்தால் உணருதல்’ தமிழில் இயல்பாக இருந்து அறிவு மற்றும் உள்ளார்ந்த புரிதல் ஆகிய இரு நுணுக்கங்களையும் தாங்குகிறது.
- source_word: στραφῶσιν
  choice: என்னிடம் திரும்பாமல்
  rationale: வினையின் பரந்த ‘திரும்புதல்’ பொருளைப் பேணுகிறது. மேற்கோளின் சூழலில் மறைமுகமாக உள்ள இறைநோக்கை ‘என்னிடம்’ தெளிவாக்குகிறது; ‘மனந்திரும்புதல்’ அல்லது ‘மதமாற்றம் அடைதல்’ போன்ற குறுகிய கோட்பாட்டுச் சொற்களைத் தவிர்க்கிறது.
- source_word: ἰάσομαι
  choice: நான் அவர்களைக் குணமாக்குவேன்
  rationale: கிரேக்க எதிர்கால வடிவத்தை நேரடியாகப் பேணுகிறது. தமிழில் நிபந்தனை நுட்பத்தை ‘இல்லையெனில்’ வெளிப்படுத்துவதால் எதிர்கால வினையை மாற்றத் தேவையில்லை.
- source_word: αὐτῶν τὴν καρδίαν
  choice: அவர்களுடைய இதயத்தை
  rationale: கிரேக்கத்தில் உள்ள ஒருமையைப் பேணி, மக்களை ஒருங்கிணைந்த குழுவாகக் குறிக்கும் கூட்டுப்பொருளுக்கு இடமளிக்கிறது.
theological_decisions:
- issue: குருடாக்குதலிலும் இதயத்தைக் கடினப்படுத்துதலிலும் இறைச் செயலாண்மை
  choice: ‘அவர் ... குருடாக்கி ... கடினப்படுத்தியிருக்கிறார்’ என்று வெளிப்படையான ஒருமை எழுவாயைப் பேணுதல்
  alternative: செயப்படுவினை அல்லது எழுவாயற்ற வடிவால் இறைச் செயலாண்மையை மென்மைப்படுத்துதல்
  rationale: கிரேக்க உரை ஏசாயா மேற்கோளில் இச்செயல்களை ஒருமை எழுவாய்க்கே வெளிப்படையாகக் கூறுகிறது. தீர்ப்புசார் கடினப்படுத்துதல் குறித்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கக் கூடாது.
- issue: στραφῶσιν என்பதன் மனமாற்ற மொழி
  choice: முதன்மை உரையில் ‘என்னிடம் திரும்பாமல்’
  alternative: ‘மனந்திரும்பாமல்’ அல்லது ‘மாற்றப்படாமல்’
  rationale: கிரேக்க வினை பரந்த திரும்புதல் பொருளுடையது. ‘திரும்புதல்’ அதன் தெளிவின்மையையும் தீர்க்கதரிசன வழக்கையும் பேணுகிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἰάσομαι என்பதன் எதிர்காலமும் நிபந்தனை நுட்பமும்
  choice: ‘இல்லையெனில் நான் ... குணமாக்குவேன்’
  alternative: ‘நான் ... குணமாக்கியிருப்பேன்’ அல்லது ‘குணமாக்குவேன்’ என்பதை இணைப்பின்றி விடுதல்
  rationale: கிரேக்க எதிர்காலத்தைப் பேணிக்கொண்டே, ἵνα அமைப்பில் தோன்றும் தவிர்க்கப்பட்ட விளைவின் நுட்பத்தை இயல்பான தமிழில் ‘இல்லையெனில்’ காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் கூட்டுப்பொருளுடைய ஒருமை ‘இதயம்’ பேணப்பட்டுள்ளது. மேற்கோளின் நோக்கம்/விளைவு நுட்பமும் இறைச் செயலாண்மை குறித்த பதற்றமும் மென்மைப்படுத்தப்படவில்லை.
