  to: “அவர் அவர்களுடைய கண்களைக் குருடாக்கியிருக்கிறார்; அவர்களுடைய இதயத்தைக் கடினப்படுத்தினார். அவர்கள் தங்கள் கண்களால் காணாமலும், இதயத்தால் புரிந்துகொள்ளாமலும், திரும்பி நான் அவர்களைக் குணமாக்காதபடிக்கும் இவ்வாறு செய்தார்.”[c]
  rationale: The revision removes the unsupported ‘என்னிடம்’ and the added conditional ‘இல்லையெனில்.’ It renders the entire negative purpose/result sequence in Tamil as ‘...குணமாக்காதபடிக்கும்,’ which reflects the Greek quotation naturally without resolving its judicial-purpose tension. Footnotes retain the lexical alternative for ‘turn,’ document the future form of ἰάσομαι, and anchor the Isaiah echo.
