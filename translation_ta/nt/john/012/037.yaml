  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: ta
  text: அவர் அவர்கள் கண்முன்னே இத்தனை அடையாளங்களைச் செய்திருந்தபோதிலும், அவர்கள் அவர்மேல் நம்பிக்கை வைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்கள் தொடர்ந்து அவர்மேல் நம்பிக்கை வைக்காமல் இருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த நம்பாமையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: இத்தனை
  rationale: அடையாளங்களின் மிகுந்த எண்ணிக்கையை வலியுறுத்தும் அளவுச் சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δὲ
  choice: —போதிலும்
  rationale: δέ குறிக்கும் எதிர்மறைத் திருப்பம், தனிச் சொல்லாக அல்லாமல் concessive அமைப்பான ‘செய்திருந்தபோதிலும்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: யோவான் நூலில் இச்செயல்கள் தங்களைக் கடந்த வெளிப்படுத்தும் பொருளைச் சுட்டுவதால், பொதுவான ‘அற்புதங்கள்’ என்பதைக் காட்டிலும் ‘அடையாளங்கள்’ கிரேக்கச் சொல்லின் தனித்துவத்தைப் பேணுகிறது.
- source_word: πεποιηκότος
  choice: செய்திருந்த
  rationale: முதன்மை வினைக்கு முந்திய செயலும் அதன் தொடர்ந்த பொருத்தமும் perfect participle-இல் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔμπροσθεν αὐτῶν
  choice: அவர்கள் கண்முன்னே
  rationale: அடையாளங்கள் அவர்களுடைய நேரடி பார்வையில், வெளிப்படையாகச் செய்யப்பட்டன என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: οὐκ ἐπίστευον
  choice: நம்பிக்கை வைக்கவில்லை
  rationale: இறந்தகாலத் தொடர்நிலை நம்பாமையை இயல்பான தமிழில் தெரிவிக்கிறது; திட்டமிட்ட மறுப்பு என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: εἰς αὐτόν
  choice: அவர்மேல்
  rationale: πιστεύω εἰς என்பதன் ஒருவரை நோக்கிய நம்பிக்கை அல்லது சார்ந்திருத்தல் என்ற உறவுசார் நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: யோவான் குறிப்பிடும் நம்பாமையை imperfect வினையுடன் மொழிபெயர்த்தல்
  choice: அவர்கள் அவர்மேல் நம்பிக்கை வைக்கவில்லை
  alternative: அவர்கள் தொடர்ந்து அவர்மேல் நம்பிக்கை வைக்காமல் இருந்தார்கள்
  rationale: முதன்மை உரை இயல்பான தமிழை முன்னிறுத்துகிறது; imperfect வடிவம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த நம்பாமையைக் குறிக்கக்கூடும் என்ற உண்மையான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ‘நம்ப மறுத்தார்கள்’ என்று கூறி வலுவான மனவுறுதியை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அடையாளங்கள்’ என்ற யோவானுக்குரிய முக்கியச் சொல் நிலைநிறுத்தப்பட்டுள்ளது; δέ-யின் எதிர்மறைத் தொடர்பு தமிழின் ‘—போதிலும்’ அமைப்பில் ஒருங்கிணைக்கப்பட்டுள்ளது.
