id: JHN.12.14
reference: John 12:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: ta
  text: 'அப்போது இயேசு ஓர் இளம் கழுதையைக்[a] கண்டு, அதன்மேல் அமர்ந்தார்; எழுதியிருக்கிறபடியே:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கழுதைக்குட்டியை.” கிரேக்கச் சொல் ὀνάριον ஒரு கழுதையைக் குறிக்கிறது; பெரும்பாலும் இளம் கழுதையைக் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: கண்டுபிடித்து
  rationale: இது இறந்தகாலச் செயப்பாட்டு வினையெச்சம்; இயேசு கழுதையைக் கண்ட செயல், அவர் அதன்மேல் அமர்ந்ததற்கு முன் நிகழ்ந்ததை இயல்பான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு δέ எதிர்மறை முரண்பாட்டை வலியுறுத்தாமல் கதையை அடுத்த நிகழ்வுக்கு நகர்த்தும் மென்மையான இணைப்பாக உள்ளது.
- source_word: ὀνάριον
  choice: ஓர் இளம் கழுதை
  rationale: ὀνάριον என்பது கழுதையைக் குறிக்கும் சிறுமைப்பொருள் வடிவம்; பெரும்பாலும் இளம் கழுதையைச் சுட்டும். “இளம் கழுதை” நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; “கழுதைக்குட்டி” என்ற சாத்தியமும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: அதன்மேல் அமர்ந்தார்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருளை இயல்பான, கண்ணியமான தமிழில் காக்கிறது; “அதில் ஏறினார்” என்பதைக் காட்டிலும் குறைவான விளக்கவுரையைக் கொண்டது.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: எழுதப்பட்டுள்ளபடியே
  rationale: வேதவசன மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர். καθώς என்பதன் ஒப்புமைப் பொருளையும் γεγραμμένον என்பதன் தொடரும் விளைவையும் சுருக்கமான இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: கிரேக்கக் கதைநடையில் இயற்பெயருக்கு முன் வரும் சுட்டுச் சொல்லைத் தமிழில் தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
theological_decisions:
- issue: இயேசுவின் செயலுக்கும் தொடர்ந்து மேற்கோள் காட்டப்படும் வேதவசனத்துக்கும் உள்ள தொடர்பு
  choice: இயேசுவின் செயல் எழுதப்பட்டுள்ள வேதவசனத்துடன் பொருந்துவதாகக் காட்டப்படுகிறது; அவர் தீர்க்கதரிசனத்தை வேண்டுமென்றே நிறைவேற்றினார் என்ற நோக்கம் இவ்வசனத்தில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: தீர்க்கதரிசனத்தை நிறைவேற்றுவதற்காகவே இயேசு இவ்வாறு செய்தார் எனத் தெளிவாக விளக்கி மொழிபெயர்த்தல்.
  rationale: மூலவசனம் முதலில் செயலைக் கூறி, பின்னர் வேதமேற்கோட்டு வாய்பாட்டை அறிமுகப்படுத்துகிறது. தீர்க்கதரிசனத் தொடர்பு உள்ளது; ஆனால் இயேசுவின் நோக்கத்தை இவ்வசனம் தனியே வெளிப்படையாக விளக்காததால் அந்தத் தன்னடக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் வரும் வேதமேற்கோளை அறிமுகப்படுத்துவதற்காக இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
