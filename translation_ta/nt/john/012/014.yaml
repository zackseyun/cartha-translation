review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the participial sequence (Jesus first finds the animal and then sits on it), the diminutive donkey term without excessive specificity, and the Scripture-citation formula. Replacing கண்டுபிடித்து with கண்டு avoids the added nuance of locating/discovering and more directly reflects εὑρών.
  naturalness: The final citation formula in the draft is somewhat awkward after a full finite clause. எழுதியிருக்கிறபடியே is a more idiomatic modern Tamil Scripture-introduction formula while retaining the sense of καθώς ἐστιν γεγραμμένον.
  terminology: இளம் கழுதை is a suitable main rendering for ὀνάριον, with கழுதைக்குட்டி appropriately supplied as a lexical alternative. இயேசு and அதன்மேல் அமர்ந்தார் are standard and suitably dignified.
  issues:
  - severity: low
    issue: கண்டுபிடித்து may imply a more purposeful discovery than εὑρών requires.
    rationale: The Greek participle simply says that Jesus found the animal. கண்டு preserves this with less added implication.
  - severity: low
    issue: The wording எழுதப்பட்டுள்ளபடியே is less idiomatic in this citation setting.
    rationale: எழுதியிருக்கிறபடியே is natural modern Tamil for the conventional formula “just as it is written,” and the colon appropriately introduces the quotation continuing in the next verse.
  revised_text: 'அப்போது இயேசு ஓர் இளம் கழுதையைக்[a] கண்டு, அதன்மேல் அமர்ந்தார்; எழுதியிருக்கிறபடியே:'
