    issue: The locative relative clause is recast as a separate sentence.
    rationale: This does not alter the meaning, but “லாசரு இருந்த பெத்தானியாவுக்கு” provides a more fluent and source-shaped Tamil rendering of ὅπου ἦν Λάζαρος.
