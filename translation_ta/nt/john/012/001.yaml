id: JHN.12.1
reference: John 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: ta
  text: ஆகவே, பஸ்கா பண்டிகைக்கு ஆறு நாட்களுக்கு முன்பு, லாசரு இருந்த பெத்தானியாவுக்கு இயேசு வந்தார்; அவனை இயேசு இறந்தவர்களிடையிலிருந்து எழுப்பியிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “இறந்தவர்களின் நடுவிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளுடன் உள்ள கதைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கடுமையான தர்க்க முடிவாக மட்டும் ஒலிக்காமல் இணைப்புச் சக்தியைப் பேணுகிறது.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: பஸ்கா பண்டிகைக்கு ஆறு நாட்களுக்கு முன்பு
  rationale: கிரேக்க காலக் குறிப்பைத் தெளிவான நவீன தமிழில் தருகிறது; πάσχα யூதப் பண்டிகையைக் குறிப்பதால் ‘பண்டிகை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: பெத்தானியாவுக்கு வந்தார்
  rationale: ἔρχομαι என்பதன் இயல்பான கதைநடைப் பொருளையும் இடத்தை நோக்கிய இயக்கத்தையும் பேணுகிறது.
- source_word: ὅπου ἦν Λάζαρος
  choice: அங்கே லாசரு இருந்தான்
  rationale: மூலத்தில் இருப்பிடம் மட்டுமே கூறப்படுகிறது; ‘வாழ்ந்தான்’ அல்லது ‘தங்கியிருந்தான்’ என்று கூடுதல் தகவல் சேர்க்கப்படவில்லை.
- source_word: ἤγειρεν
  choice: எழுப்பியிருந்தார்
  rationale: லாசருவை எழுப்பிய நிகழ்வு இயேசுவின் வருகைக்கு முன்பே நடந்தது என்பதைத் தமிழில் இயல்பாகத் தெளிவாக்குகிறது; உயிர்த்தெழுதல் சூழலில் ἐγείρω என்பதன் பொருளைப் பேணுகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தவர்களிடையிலிருந்து
  rationale: ἐκ மற்றும் νεκρῶν என்பவற்றின் ‘இறந்தவர்களின் நடுவிலிருந்து’ என்ற வடிவத்தைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: லாசருவை எழுப்பியவர் குறித்த வெளிப்படையான அடையாளம்
  choice: அவனை இயேசு ... எழுப்பியிருந்தார்
  alternative: அவனை அவர் ... எழுப்பியிருந்தார்
  rationale: கிரேக்க உரை உறவுச் சொற்றொடரின் முடிவில் Ἰησοῦς என்று பெயரை மீண்டும் வெளிப்படையாகக் கூறுகிறது; அதனால் ‘இயேசு’ என்பது தக்கவைக்கப்பட்டது.
- issue: ἐκ νεκρῶν என்ற உயிர்த்தெழுதல் மொழி
  choice: இறந்தவர்களிடையிலிருந்து
  alternative: மரணத்திலிருந்து
  rationale: மூலத்தின் பன்மை வடிவத்தையும் ‘இறந்தவர்களின் நடுவிலிருந்து’ என்ற கருத்தையும் சுருக்காமல் பேணுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நபர் மற்றும் இடப்பெயர்கள் பொதுவான தமிழ் வேதாகம மரபுக்கு ஒத்த வடிவில் தரப்பட்டுள்ளன; மூலத்தில் இல்லாத தங்குமிடம் அல்லது வசிப்பிடம் பற்றிய விவரம் சேர்க்கப்படவில்லை.
