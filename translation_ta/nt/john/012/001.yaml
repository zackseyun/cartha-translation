  naturalness: The prose is generally clear and modern. A relative construction more closely mirrors the Greek and reads more smoothly than separating “அங்கே லாசரு இருந்தான்” into an independent sentence. The footnote wording should be idiomatic Tamil.
  terminology: “பஸ்கா பண்டிகை,” “பெத்தானியா,” “லாசரு,” and “இறந்தவர்களிடையிலிருந்து” are suitable. The latter retains the Greek plural and is appropriately supported by a literal-alternative footnote.
  issues:
