source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: ta
  text: 'இயேசு மறுமொழியாகக் கூறினார்: “இந்தக் குரல் எனக்காக வந்ததல்ல; உங்களுக்காக வந்தது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் குரல் என் காரணமாக ஏற்பட்டதல்ல; உங்கள் காரணமாக ஏற்பட்டது.” கிரேக்க முன்னிடைச்சொல் காரணத்தையும் குறிக்கக்கூடும்; ஆயினும் இச்சூழலில் “ஒருவருக்காக” அல்லது “ஒருவரின் நன்மைக்காக” என்ற பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: மறுமொழியாகக் கூறினார்
  rationale: இரு கிரேக்க வினைகளின் உரையாடல் செயல்பாட்டையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது; ‘பதிலளித்துச் சொன்னார்’ என்ற சொற்சொறான வடிவத்தின் தேவையற்ற கடினத்தன்மையைத் தவிர்க்கிறது.
- source_word: ἡ φωνὴ αὕτη
  choice: இந்தக் குரல்
  rationale: முந்தைய வசனத்தில் கேட்கப்பட்ட பரலோக உரைப்பைக் குறிப்பதால், பொதுவான ‘ஒலி’ என்பதைவிட ‘குரல்’ சூழலுக்குப் பொருத்தமானது.
- source_word: γέγονεν
  choice: வந்தது
  rationale: γίνομαι என்பதன் நிறைவு வடிவம் இங்கு குரல் நிகழ்ந்ததையும் அதன் தற்போதைய பொருத்தத்தையும் குறிக்கிறது. ‘குரல் வந்தது’ என்பது தமிழில் இயல்பான நிகழ்வுச் சொல்லாக்கம்.
- source_word: δι’ ἐμὲ … δι’ ὑμᾶς
  choice: எனக்காக … உங்களுக்காகவே
  rationale: διά + குற்றுவேற்றுமை இச்சூழலில் நோக்கம் அல்லது பயன் சார்ந்த பொருளைத் தருகிறது. ‘வே’ எதிர்மறை–நேர்மறை வேறுபாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Οὐ … ἀλλὰ
  choice: அல்ல; … வே
  rationale: ‘எனக்காக அல்ல, உங்களுக்காக’ என்ற நேரடியான முரண்பாட்டை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பரலோகக் குரலின் நோக்கம்
  choice: அந்தக் குரல் இயேசுவின் நன்மைக்காக அல்ல, அங்கிருந்த கேட்போரின் நன்மைக்காக வந்தது.
  alternative: அந்தக் குரல் இயேசுவின் காரணமாக அல்ல, கேட்போரின் காரணமாக ஏற்பட்டது.
  rationale: இரு இடங்களிலும் வரும் διά + குற்றுவேற்றுமையைச் சூழல் நோக்கம்/பயன் என்ற பொருளில் வாசிப்பதை ஆதரிக்கிறது. அதேவேளையில் சாத்தியமான காரணப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இயேசுவுக்கு உறுதிப்படுத்தல் தேவையில்லை என்பதற்கு மேல் எந்தக் கோட்பாட்டுக் கூற்றும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘மறுமொழியாகக் கூறினார்’ என்பது யோவானில் காணப்படும் இரட்டை உரையாடல் சூத்திரத்தைத் தமிழில் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது. ‘இந்தக் குரல் … வந்தது’ என்பது சாதாரண வாசகருக்கு இயல்பானது; கிரேக்கத்தின் காரணப் பொருள் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
