source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: ta
  text: இதன் காரணமாக, கூட்டமும் அவரைச் சந்திக்கச் சென்றது[a]; ஏனெனில், அவர் இந்த அடையாளத்தைச் செய்திருந்தார் என்று அவர்கள் கேள்விப்பட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூட்டம் அவரைச் சந்தித்தது” அல்லது “அவரைச் சந்திக்க வெளியே சென்றது.” கிரேக்க வினைச்சொல்லில் ஒருவரைச் சந்திப்பதற்காகச் செல்வது என்ற பொருள் அடங்கியுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள வெளிப்படையான காரணத் தொடர்பைப் பாதுகாக்கிறது; ‘வே’ அந்தத் தொடர்பை இயல்பாக வலியுறுத்துகிறது.
- source_word: καὶ
  choice: கூட்டத்தினரும்
  rationale: கிரேக்கத்தின் சேர்க்கைப் பொருளைத் தமிழில் ‘-உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπήντησεν αὐτῷ
  choice: அவரைச் சந்திக்கச் சென்றார்கள்
  rationale: ὑπαντάω என்பதில் ஒருவரைச் சந்திப்பதற்காகச் செல்லும் திசைநோக்கிய பொருள் உள்ளது; வெறுமனே ‘சந்தித்தார்கள்’ என்பதைவிட இது அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ὁ ὄχλος
  choice: கூட்டத்தினர்
  rationale: ஒருங்குகூடிய மக்களைச் சுட்டும் ὄχλος என்பதற்கு நவீனத் தமிழில் இயல்பான மனிதப் பன்மை வடிவம்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கூட்டத்தினர் செயல்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது.
- source_word: ἤκουσαν
  choice: கேள்விப்பட்டிருந்தார்கள்
  rationale: அடையாளம் செய்யப்பட்டதைக் குறித்த செய்தி அவர்களிடம் முன்பே வந்திருந்ததைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: அவர் இந்த அடையாளத்தை செய்திருந்தார்
  rationale: முடிந்த செயலும் அதன் தொடரும் பொருத்தமும் அடங்கிய perfect infinitive-ன் வலிமையை ‘செய்திருந்தார்’ வெளிப்படுத்துகிறது; τοῦτο குறிப்பிட்ட அந்தச் செயலையே சுட்டுகிறது.
- source_word: τὸ σημεῖον
  choice: அடையாளம்
  rationale: யோவானின் தனிச்சிறப்பான பயன்பாட்டில், இயேசுவின் அடையாளத்தையும் பணியையும் சுட்டிக்காட்டும் வல்ல செயல் என்ற கருத்தை ‘அடையாளம்’ பாதுகாக்கிறது.
theological_decisions:
- issue: யோவான் பயன்படுத்தும் σημεῖον என்பதன் மொழிபெயர்ப்பு
  choice: அடையாளம்
  alternative: அற்புதம்
  rationale: ‘அற்புதம்’ வியப்பூட்டும் தன்மையை மட்டும் முன்னிலைப்படுத்தக்கூடும்; ‘அடையாளம்’ அந்தச் செயல் தன்னைக் கடந்த ஓர் உண்மையைச் சுட்டுகிறது என்ற யோவானின் இறையியல் நுணுக்கத்தை விளக்கவுரை சேர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல் அதன் காரணத் தொடர்பு, சேர்க்கைப் பொருள், சந்திக்கச் செல்லும் திசைநோக்கு ஆகியவை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
