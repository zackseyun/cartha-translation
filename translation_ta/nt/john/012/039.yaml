id: JHN.12.39
reference: John 12:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: ta
  text: 'இதன் காரணமாக அவர்களால் நம்ப முடியவில்லை; ஏனெனில் ஏசாயா மீண்டும் இவ்வாறு சொன்னார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: διά + accusative இங்கு காரணத்தைக் குறிக்கிறது. முந்தைய சூழலுடன் உள்ள வெளிப்படையான காரணத் தொடர்பை இந்தச் சொற்றொடர் தெளிவாகக் காக்கிறது.
- source_word: οὐκ ἠδύναντο
  choice: அவர்களால் ... முடியவில்லை
  rationale: δύναμαι என்பதன் இறந்தகால வடிவம் இயலாமையைச் சொல்கிறது. வெறும் விருப்பமின்மையாக மென்மைப்படுத்தாமல், கிரேக்கத்தின் இயலாமை உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: πιστεύειν
  choice: நம்ப
  rationale: யோவான் நற்செய்தியில் πιστεύω என்பதற்குப் பொருத்தமான, இயல்பான தமிழ் வினைச்சொல் ‘நம்ப’ ஆகும்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு ὅτι அடுத்துவரும் ஏசாயாவின் மேற்கோளை அவர்களுடைய இயலாமைக்கான காரணமாக அறிமுகப்படுத்துகிறது; ஆகவே காரணப் பொருள் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய ஏசாயா மேற்கோளைத் தொடர்ந்து இன்னொரு மேற்கோள் வருவதைக் குறிக்கும் πάλιν என்பதன் நேரடியான பொருளைத் தருகிறது.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: மேற்கோளை அறிமுகப்படுத்தும் λέγω வினைக்கு இயல்பான மரியாதை ஒருமைத் தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἠσαΐας
  choice: ஏசாயா
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: நம்புவதற்கான இயலாமையின் தன்மை
  choice: ‘அவர்களால் நம்ப முடியவில்லை’ என்று இயலாமையை நேரடியாகக் கூறுதல்
  alternative: ‘அவர்கள் நம்ப விரும்பவில்லை’ என்று விருப்பமின்மையாக மாற்றுதல்
  rationale: கிரேக்க உரை இயலாமையைச் சொல்கிறது; வெறும் விருப்பமின்மையை அல்ல. அதேவேளையில், அந்த இயலாமை எவ்வாறு செயல்படுகிறது என்பது குறித்த குறிப்பிட்ட இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்காமல், தெய்வீகச் செயலும் மனிதப் பொறுப்பும் இடையிலான உரையின் பதற்றம் அப்படியே விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. அடுத்த வசனத்தில் வரும் மேற்கோளுக்கான அறிமுகம் என்பதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
