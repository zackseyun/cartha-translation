base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: ta
  text: ஏசாயா அவருடைய மகிமையைக் கண்டு, அவரைக் குறித்துப் பேசியதால்தான் இவற்றைச் சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவானின் உடனடிச் சூழலில் “அவருடைய,” “அவரைக்” என்பவை இயேசுவைக் குறிப்பதாகத் தெரிகிறது. ஆனால் ஏசாயாவின் விரிந்த பின்னணியில் இது ஆண்டவருடைய மகிமையைக் கண்ட காட்சியைக் குறிக்கிறது (ஏசா 6:1). ஆகவே, “கடவுளுடைய மகிமையைக் கண்டு, அவரைக் குறித்துப் பேசினார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்பு மேற்கோள் காட்டப்பட்ட தீர்க்கதரிசனக் கூற்றுகளைச் சுட்டும் நடுநிலைப் பன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: λέγω என்பதன் இறந்தகாலச் செயலை நேரடியாகத் தருகிறது; பின்னர் வரும் ἐλάλησεν என்பதிலிருந்து சொல்வேறுபாட்டையும் ஓரளவு காக்கிறது.
- source_word: Ἠσαΐας
  choice: ஏசாயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற தீர்க்கதரிசியின் பெயர் வடிவம்.
- source_word: ὅτι
  choice: பேசியதால்தான்
  rationale: இங்கு ὅτι காரணத்தை அறிமுகப்படுத்துவது இயல்பானது; ‘தான்’ காரணத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἶδεν
  choice: கண்டு
  rationale: ὁράω என்பதன் எளிய பொருளான ‘காணுதல்’ என்பதைத் தருகிறது; இணை வினையெச்ச வடிவம் தமிழில் வாக்கியத்தை இயல்பாக்குகிறது.
- source_word: τὴν δόξαν
  choice: மகிமையை
  rationale: யோவான் நூலில் δόξα தாங்கும் இறையியல் நிறையையும் தமிழ் வேதாகம மரபையும் காக்கிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: ஆண்பால் ஒருமை உடைமைச் சுட்டுப்பெயரை மரியாதையான இயல்பான தமிழில் தருகிறது; மூலத்தில் பெயர் வெளிப்படையாக இல்லை.
- source_word: ἐλάλησεν
  choice: பேசிய
  rationale: λαλέω என்பதற்கு ‘பேசுதல்’ என்று வழங்கி, முன் வரும் εἶπεν / ‘சொன்னார்’ என்பதிலிருந்து நுட்பமான வேறுபாட்டைக் காக்கிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமையின் ‘அவரைப் பற்றி/அவரைக் குறித்து’ என்ற பொருளை dignified, current Tamil-ல் தருகிறது.
theological_decisions:
- issue: αὐτοῦ / αὐτοῦ ஆகிய சுட்டுப்பெயர்களின் குறிப்பு
  choice: முதன்மை உரையில் ‘அவருடைய / அவரைக் குறித்து’ என்று சுட்டுப்பெயர்களையே காத்து, யோவானின் உடனடிச் சூழலில் அவை இயேசுவைக் குறிப்பதாக அடிக்குறிப்பில் விளக்கப்பட்டது.
  alternative: ‘இயேசுவின் மகிமை’ என்று பெயரை உரையிலேயே வெளிப்படையாகச் சேர்த்தல், அல்லது ‘கடவுளுடைய மகிமை’ என்று பொதுப்படுத்தல்.
  rationale: மூல கிரேக்க உரை பெயரை வெளிப்படையாகச் சொல்லாமல் சுட்டுப்பெயர்களைப் பயன்படுத்துகிறது. உடனடிச் சூழல் இயேசுவை வலுவாகச் சுட்டினாலும், ஏசாயா 6 பின்னணி ஆண்டவரின் மகிமைக் காட்சியாக இருப்பதால், அந்த உண்மையான விளக்கத் தளர்வை முதன்மை உரையில் தீர்த்துவிடாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தின் இரு வேறு பேச்சு வினைகள் ‘சொன்னார்’ மற்றும் ‘பேசிய’ என்று வேறுபடுத்தப்பட்டன. சுட்டுப்பெயரின் கிறிஸ்துவியல் குறிப்பை உரையில் பெயரிட்டு முடிவுசெய்யாமல், அதன் சூழல்சார் வலிமையையும் ஏசாயா பின்னணியையும் அடிக்குறிப்பு காக்கிறது.
