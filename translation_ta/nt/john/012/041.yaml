  source_fidelity: மூலத்தின் ταῦτα, εἶπεν, ὅτι (காரணப் பொருள்), εἶδεν, δόξαν, மற்றும் περὶ αὐτοῦ ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அவருடைய / அவரைக்’ என்ற சுட்டுப்பெயர்களை பெயரிட்டு விளக்காமல் வைத்திருப்பது கிரேக்கத்தின் வெளிப்பாட்டையும் அதன் சூழல்சார் குறிப்பு-நுட்பத்தையும் பாதுகாக்கிறது.
  naturalness: «ஏசாயா அவருடைய மகிமையைக் கண்டு, அவரைக் குறித்துப் பேசியதால்தான் இவற்றைச் சொன்னார்» என்பது நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் உள்ளது. ‘சொன்னார்’ மற்றும் ‘பேசிய’ என்பவை இரு கிரேக்க வினைகளின் சிறிய வேறுபாட்டையும் ஏற்ற அளவில் வெளிப்படுத்துகின்றன.
  terminology: «ஏசாயா», «மகிமை», «அவரைக் குறித்து» ஆகியவை நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் வேதாகமப் பயன்பாடுகளாகும். கிறிஸ்துவியல் அடையாளத்தை உரையில் வலுக்கட்டாயமாகத் தீர்மானிக்காமல், அடிக்குறிப்பில் சூழல் மற்றும் ஏசாயா 6 பின்னணி இரண்டையும் சமநிலையுடன் விளக்குகிறது.
