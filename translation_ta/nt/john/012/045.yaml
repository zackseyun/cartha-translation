  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: ta
  text: மேலும், என்னைக் காண்கிறவர் என்னை அனுப்பியவரைக் காண்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உற்றுப் பார்க்கிறவர்’; கிரேக்க வினைச்சொல் வெறும் உடல் பார்வையை மட்டுமல்லாமல், கவனத்துடன் பார்த்து உணர்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி வசனத்தில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது முந்தைய சூழலோடு இணைக்கும் எளிய இடைச்சொல். தனி வசனமாகத் தமிழில் ‘மேலும்’ அல்லது ‘அப்படியே’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உருவாக்கலாம்; தொடர்ச்சியான வாசிப்பில் இணைப்பு சூழலால் தெளிவாகிறது.
- source_word: ὁ θεωρῶν ἐμὲ
  choice: என்னைக் காண்கிறவர்
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள நிகழ்காலப் பங்கேற்புச் சொல் பொதுவாக இச்செயலைச் செய்கிற ஒருவரைக் குறிக்கிறது. ‘காண்கிறவர்’ இயல்பான நவீனத் தமிழில் இதைத் தக்கவைக்கிறது.
- source_word: θεωρεῖ
  choice: காண்கிறார்
  rationale: θεωρέω என்பது வெறுமனே உடல் பார்வையை மட்டுமல்லாமல் கவனித்துப் பார்த்தல் அல்லது உணர்ந்து காணுதல் என்ற நிழற்பொருளையும் தரக்கூடும். ‘காண்கிறார்’ இயல்பாகவும், முதல் வினையுடனான மறுபயன்பாட்டையும் காக்கும் வகையிலும் உள்ளது.
- source_word: τὸν πέμψαντά με
  choice: என்னை அனுப்பியவரை
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் உறவுசார் குறிப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது. மூலத்தில் இல்லாத ‘பிதா’ என்ற பட்டத்தைச் சேர்க்காமல் அனுப்பியவரை அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவைக் காண்பதற்கும் அவரை அனுப்பியவரைக் காண்பதற்கும் உள்ள உறவு
  choice: ‘என்னைக் காண்கிறவர் என்னை அனுப்பியவரைக் காண்கிறார்’ என்ற நேரடியான இணைவு பாதுகாக்கப்பட்டது.
  alternative: இயேசுவின் மூலம் அனுப்பியவரைப் பற்றி அறிந்துகொள்வதாக மெலிதாக்குதல், அல்லது இருவரும் ஒரே நபர் என்று விரிவாக்கிப் பொருளுரைத்தல்.
  rationale: மூலம் வெளிப்பாட்டுச் சார்ந்த ஆழமான ஒருமைப்பாட்டை நேரடியாகக் கூறுகிறது; ஆனால் அதன் எல்லையை விளக்கவோ தனிப்பட்ட அடையாள ஒன்றிப்பாக மாற்றவோ இல்லை. மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் நுண்ணிய வேறுபாட்டையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானாலும் கண்ணியமான நடை. ‘காண்’ என்ற வினை இரு இடங்களிலும் மீண்டும் பயன்படுத்தப்பட்டு மூலத்தின் சொல்லமைப்பும் இறையியல் வலிமையும் காக்கப்பட்டுள்ளன.
