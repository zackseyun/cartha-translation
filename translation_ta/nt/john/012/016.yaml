source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: ta
  text: இவற்றை அவரது சீடர்கள் முதலில் புரிந்துகொள்ளவில்லை.[a] ஆனால் இயேசு மகிமைப்படுத்தப்பட்டபோது,[b] இவை அவரைக் குறித்து எழுதப்பட்டிருந்தன[c] என்பதையும், இவற்றை அவர்கள் அவருக்குச் செய்தார்கள் என்பதையும் அப்போது நினைவுகூர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றை முதலில் அறிந்துகொள்ளவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: யோவான் நற்செய்தியில் “மகிமைப்படுத்தப்படுதல்” என்பது பொதுவாக இயேசுவின் மரணம், உயிர்த்தெழுதல், உயர்த்தப்படுதல் ஆகியவற்றின் வழியாக அவர் மகிமை பெறுவதைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “அவரைப் பற்றி எழுதப்பட்டிருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: இங்கே சீடர்கள் நிகழ்வுகளை அறியாதிருந்தார்கள் என்பதைக் காட்டிலும் அவற்றின் பொருளை அப்போது உணரவில்லை என்பதே சூழலுக்கு ஏற்றது; அதேவேளை அடிக்குறிப்பில் ‘அறிந்துகொள்ளவில்லை’ என்ற நேரடி மாற்றும் தரப்படுகிறது.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: அவருடைய சீடர்கள்
  rationale: உடைமை/உறவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: τὸ πρῶτον
  choice: முதலில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: ἐδοξάσθη
  choice: மகிமைப்படுத்தப்பட்டபோது
  rationale: யோவானில் δοξάζω பெற்றுள்ள ஆழமான இறையியல் நிறையைத் தக்கவைக்கிறது; ‘கனப்படுத்தப்பட்டார்’ என்று தட்டையாக்கவில்லை.
- source_word: ἐμνήσθησαν
  choice: நினைவுகூர்ந்தார்கள்
  rationale: நிகழ்வுகளையும் எழுதப்பட்டிருந்தவற்றையும் பின்னர் நினைவில் கொண்டு அவற்றின் தொடர்பை உணர்ந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: அவரைக் குறித்து எழுதப்பட்டிருந்தன
  rationale: ἐπί + dative இங்கே இடத்தைக் குறிக்காமல் ‘குறித்து/சம்பந்தமாக’ என்பதைக் குறிக்கிறது; எழுதுதல் முன்பே நிகழ்ந்திருந்ததையும் தமிழ் வினைவடிவம் காட்டுகிறது.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: இவற்றையே அவர்கள் அவருக்குச் செய்தார்கள்
  rationale: மூலத்தின் மீளுரையையும் αὐτῷ என்பதையும் தக்கவைக்கிறது. ‘அவர்கள்’ என்பதன் சுட்டுப்பொருளை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
- source_word: ταῦτα
  choice: இவை / இவற்றை / இவற்றையே
  rationale: நடந்த செயல்களையும் வேதாகம விவரங்களையும் தொகுப்பாகச் சுட்டும் பன்மையைத் தக்கவைத்து, தமிழின் வேற்றுமை உருபுகளுக்கு ஏற்ப வடிவம் மாறுகிறது.
theological_decisions:
- issue: யோவானின் சூழலில் இயேசு ‘மகிமைப்படுத்தப்படுதல்’ என்பதன் பொருள்
  choice: ‘மகிமைப்படுத்தப்பட்டபோது’ என்ற சொல்லை விளக்கவுரையின்றி மூல உரையில் தக்கவைத்தல்
  alternative: ‘உயிர்த்தெழுந்து உயர்த்தப்பட்டபோது’ அல்லது ‘கனப்படுத்தப்பட்டபோது’
  rationale: இது இயேசுவின் மரணம், உயிர்த்தெழுதல், உயர்த்தப்படுதல் ஆகியவற்றோடு தொடர்புடைய யோவானின் பல அடுக்குகள் கொண்ட சொல்லாட்சி. மொழிபெயர்ப்பு அதை ஒரு நிகழ்வுக்கு மட்டும் சுருக்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ταῦτα ἐποίησαν αὐτῷ என்பதில் ‘அவர்கள்’ யாரைக் குறிக்கிறது
  choice: ‘அவர்கள்’ என்ற பொதுச் சுட்டைத் தக்கவைத்தல்
  alternative: ‘மக்கள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் மறைமுகமாக உள்ளது; சூழல் கூட்டத்தாரைச் சுட்டினாலும், மொழிபெயர்ப்பில் அதை வெளிப்படையாகத் தீர்மானிக்காமல் மூலத்தின் சுட்டு அமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க மூலத்தின் ‘இவை’ என்ற மீளுரை, கால வரிசை, ‘மகிமைப்படுத்தப்பட்டார்’ என்ற யோவானுக்குரிய இறையியல் சொல்லாட்சி ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
