  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: ta
  text: ஆயினும், தலைவர்களிலும்கூட பலர் அவரை நம்பினார்கள். ஆனால் பரிசேயர்களின் காரணமாக, தாங்கள் ஜெபக்கூடச் சமூகத்திலிருந்து விலக்கப்படாதபடி[a], அதை ஒப்புக்கொள்ளாமல் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஜெபக்கூடத்திலிருந்து வெளியேற்றப்படாதபடி” அல்லது “ஜெபக்கூடத்திலிருந்து துரத்தப்படாதபடி.” கிரேக்கச் சொல் ஜெபக்கூடச் சமூகத்திலிருந்து விலக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: ஆயினும்
  rationale: இணைந்துள்ள இரு கிரேக்க இடைச்சொற்களின் வலியுறுத்தப்பட்ட எதிர்மறைத் திருப்பத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: தலைவர்களிலும்கூட பலர்
  rationale: ἐκ உடன் வரும் பன்மைச் சொல் ஒரு குழுவைச் சேர்ந்தவர்களைக் குறிக்கிறது; ἄρχοντες இச்சூழலில் பொதுவான அரசர்களை அல்ல, அதிகாரமுள்ள தலைவர்களைக் குறிக்கிறது.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: அவரை நம்பினார்கள்
  rationale: யோவானின் வழக்கமான πιστεύω εἰς பயன்பாட்டில் இயேசுவை நோக்கிய நம்பிக்கையை இயல்பாகத் தெரிவிக்கிறது; அவர்களுடைய நம்பிக்கையின் இறையியல் தரத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: διὰ τοὺς Φαρισαίους
  choice: பரிசேயர்களின் காரணமாக
  rationale: διά + குற்றுவேற்றுமை இங்கு காரணத்தைக் குறிக்கிறது. பயம் சூழலில் மறைமுகமாக இருந்தாலும், மூலச்சொற்றொடரில் வெளிப்படையாக இல்லை.
- source_word: οὐχ ὡμολόγουν
  choice: அதை ஒப்புக்கொள்ளாமல் இருந்தார்கள்
  rationale: வினையின் இறந்தகாலத் தொடர்நிலை, நீடித்த அல்லது வழக்கமான ஒப்புக்கொள்ளாமையைச் சுட்டுகிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால், முந்தைய நம்பிக்கையைச் சுட்டும் “அதை” தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
- source_word: ἵνα μὴ
  choice: விலக்கப்படாதபடி
  rationale: தவிர்க்க விரும்பிய விளைவை நோக்கிய நோக்கப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: ஜெபக்கூடச் சமூகத்திலிருந்து விலக்கப்பட
  rationale: சொல் வெறும் கட்டடத்திலிருந்து வெளியேற்றப்படுவதைவிட ஜெபக்கூடச் சமூக வாழ்விலிருந்து விலக்கப்படுவதைக் குறிக்கிறது; தமிழில் “சமூகத்திலிருந்து” என்பது அந்த உறவுசார் பரப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: யோவானின் இறையியலில் தலைவர்களின் நம்பிக்கையின் தன்மை
  choice: “அவரை நம்பினார்கள்” என்று நேரடியாக மொழிபெயர்த்து, அதே நேரத்தில் அவர்கள் அதை ஒப்புக்கொள்ளவில்லை என்ற பதற்றத்தையும் அப்படியே வைத்தல்
  alternative: அவர்களுடைய நம்பிக்கையை வெறும் வெளிப்புற நம்பிக்கை எனக் குறைத்தல் அல்லது இரட்சிப்பளிக்கும் உண்மையான விசுவாசம் என வலுப்படுத்தல்
  rationale: வசனம் அவர்கள் நம்பினார்கள் என்றும், அதை ஒப்புக்கொள்ளவில்லை என்றும் இரண்டையும் கூறுகிறது. அவர்களுடைய ஆன்மிக நிலையை மூலவசனம் தீர்மானிப்பதைவிட அதிகமாக மொழிபெயர்ப்பு தீர்மானிக்கக் கூடாது.
translation_notes:
  register: மொழிநடை நவீன, கண்ணியமான பொதுத்தமிழாக வைக்கப்பட்டுள்ளது. “தலைவர்கள்” என்பது சூழலிலுள்ள அதிகாரமுள்ளவர்களைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத “யூத” என்ற அடையாளம் முதன்மை உரையில் சேர்க்கப்படவில்லை. “ஜெபக்கூடச் சமூகம்” என்பது கட்டடத்தை மட்டும் அல்லாமல் சமூக-மத உறுப்புரிமையையும் பங்கேற்பையும் உணர்த்துகிறது.
