id: JHN.12.21
reference: John 12:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: ta
  text: ஆகவே இவர்கள், கலிலேயாவிலுள்ள பெத்சாயிதாவைச் சேர்ந்த பிலிப்பிடம் வந்து, அவரிடம், “ஐயா[a], நாங்கள் இயேசுவைக் காண விரும்புகிறோம்” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆண்டவரே.” கிரேக்கத்தில் κύριε என்பது ஒருவரை மரியாதையுடன் அழைக்கும் “ஐயா” என்றும், “ஆண்டவரே” என்றும் பொருள்படலாம். இங்கு அது பிலிப்பை நோக்கிச் சொல்லப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கிரேக்கர்களைச் சுட்டும் பன்மைச் சுட்டுப்பெயரின் உரையாடல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: கதை நகர்வையும் முந்தைய செய்தியோடு உள்ள தொடர்பையும் இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: προσῆλθον
  choice: பிலிப்பிடம் வந்து
  rationale: προσέρχομαι என்பதன் அணுகுதல் அல்லது ஒருவரிடம் வருதல் என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள பெத்சாயிதாவைச் சேர்ந்த
  rationale: பிலிப்பின் ஊரை அடையாளப்படுத்தும் கிரேக்கத் தொடரைத் தெளிவான தமிழில் வழங்குகிறது.
- source_word: ἠρώτων
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வடிவத்திலுள்ள தொடர்ச்சி அல்லது நீடித்த வேண்டுகோளின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: Κύριε
  choice: ஐயா
  rationale: இங்கு பிலிப்பை நோக்கிச் சொல்லப்படுவதால், κύριε என்பது மரியாதையான நேரடி அழைப்பாக இயங்குகிறது; தமிழில் ‘ஐயா’ அதனை இயல்பாக வெளிப்படுத்துகிறது. ‘ஆண்டவரே’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θέλομεν
  choice: விரும்புகிறோம்
  rationale: θέλω என்பதன் விருப்பம் அல்லது நோக்கம் என்ற பொருளை நேர்த்தியான நவீன தமிழில் தருகிறது.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: இயேசுவைக் காண
  rationale: ‘காண’ என்பது ἰδεῖν என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; சந்திக்க அல்லது பேச விரும்பினர் என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பிலிப்பை நோக்கிய κύριε என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஐயா
  alternative: ஆண்டவரே
  rationale: இந்தச் சொல்லை அவர்கள் பிலிப்பிடம் கூறுவதால், இச்சூழலில் இது இறையியல் அறிக்கையாக அல்லாமல் மரியாதை அழைப்பாக இருப்பதே இயல்பானது. ஆயினும் κύριος என்பதற்கு ‘ஆண்டவர்’ என்ற பொருளும் இருப்பதால், அந்தச் சொற்பொருள் சார்ந்த தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘இவர்கள்’ முந்தைய வசனத்துடனான சுட்டுத் தொடர்பைத் தக்கவைக்கிறது; ‘கேட்டுக்கொண்டிருந்தார்கள்’ கிரேக்க imperfect வினையின் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
