reference: John 12:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: ta
  text: இப்போது என் உள்ளம் கலங்கியிருக்கிறது. நான் என்ன சொல்வேன்? தந்தையே, இந்த வேளையிலிருந்து என்னைக் காப்பாற்றும்.[a] ஆனால் இதற்காகவே நான் இந்த வேளைக்கு வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை, ‘நான் என்ன சொல்வேன்? “தந்தையே, இந்த வேளையிலிருந்து என்னைக் காப்பாற்றும்” என்று சொல்வேனா?’ என்றும் வாசிக்கலாம். கிரேக்க உரையை நேரடி வேண்டுதலாக அல்லாமல் வினாவாகவும் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: இப்போது
  rationale: இயேசுவின் தற்போதைய கலக்கத்தின் உடனடித் தன்மையை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ψυχή
  choice: உள்ளம்
  rationale: இங்கு இயேசுவின் உள்நிலையையும் முழு ஆளுமையின் ஆழ்ந்த கலக்கத்தையும் குறிக்கிறது; ‘ஆன்மா’ என்பதைக் காட்டிலும் ‘உள்ளம்’ இயல்பான தமிழாக இருந்து, தேவையற்ற உடல்–ஆன்மா பிரிவையும் திணிக்காது.
- source_word: τετάρακται
  choice: கலங்கியிருக்கிறது
  rationale: கலக்கப்பட்டதன் விளைவாகத் தொடரும் தற்போதைய நிலையை கிரேக்க நிறைவுக்கால வடிவுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: τί εἴπω
  choice: நான் என்ன சொல்வேன்?
  rationale: ஆலோசனை அல்லது உள்ளார்ந்த திகைப்பைக் காட்டும் deliberative subjunctive-இன் திறந்த கேள்வித் தன்மையைப் பேணுகிறது.
- source_word: πάτερ
  choice: தந்தையே
  rationale: தேவனை நேரடியாக அழைக்கும் விளிப்பை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: இந்த வேளையிலிருந்து என்னைக் காப்பாற்றும்
  rationale: வரவிருக்கும் சோதனை நிறைந்த வேளையிலிருந்து விடுவிக்கும்படியான வேண்டுகோளை நெருக்கமாகவும் கண்ணியமாகவும் மொழிபெயர்க்கிறது.
- source_word: ὥρα
  choice: வேளை
  rationale: யோவானில் இயேசுவின் பாடு, மரணம், மகிமைப்படுதல் ஆகியவற்றுடன் தொடர்புடைய நியமிக்கப்பட்ட தீர்மானகரமான காலத்தைச் சுட்டும் சொல்லின் கருப்பொருள் வலிமையைப் பேணுகிறது; ‘மணிநேரம்’ இங்கு மிக இயந்திரமானதாக இருக்கும்.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: ஆனால் இதற்காகவே
  rationale: முந்தைய வேண்டுகோளோடு உள்ள முரண்பாட்டையும், நோக்கம் அல்லது காரணத்தைச் சுட்டும் வலியுறுத்தலையும் சுருக்கமாகத் தருகிறது.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: நான் இந்த வேளைக்கு வந்தேன்
  rationale: ‘இந்த வேளைக்குள்/வேளைக்கு வந்தேன்’ என்ற கிரேக்க அமைப்பை நோக்கப் பொருளாக முழுமையாக மாற்றாமல் பேணுகிறது; தமிழில் ‘இந்த வேளைக்கு வந்தேன்’ என்பது நியமிக்கப்பட்ட கட்டத்தை அடைந்ததைக் காட்டுகிறது.
theological_decisions:
- issue: ‘தந்தையே, இந்த வேளையிலிருந்து என்னைக் காப்பாற்றும்’ என்பது நேரடி வேண்டுதலா, அல்லது ‘நான் என்ன சொல்வேன்?’ என்பதுடன் தொடரும் எதிர்மறை வினாவா?
  choice: அதை நேரடி வேண்டுதலாக முதன்மை உரையில் அமைத்தல்.
  alternative: ‘நான் என்ன சொல்வேன்? “தந்தையே, இந்த வேளையிலிருந்து என்னைக் காப்பாற்றும்” என்றா?’ என்று எதிர்மறை வினாவாக வாசித்தல்.
  rationale: பழமையான கையெழுத்துப் பிரதிகளின் நிறுத்தக்குறிகள் மூல உரையின் பகுதியல்ல; எனவே இரு வாசிப்புகளும் இலக்கண ரீதியாகச் சாத்தியம். SBLGNT நிறுத்தக்குறிப்பைத் தொடர்ந்து முதன்மை உரை நேரடி வேண்டுதலாக அமைக்கப்படுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுவதால் இயேசுவின் உண்மையான கலக்கத்திற்கும் அவர் ஏற்றுக்கொண்ட பணிக்கும் இடையிலான வேதவியல் இழுபறி மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘உள்ளம்’, ‘வேளை’, ‘காப்பாற்றும்’ ஆகிய சொற்கள் சாதாரண வாசகர்களுக்குப் புரியும்படியும், யோவான் நற்செய்தியின் சொல் மற்றும் கருத்து எதிரொலிகளைப் பேணும்படியும் தேர்ந்தெடுக்கப்பட்டன.
