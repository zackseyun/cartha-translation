source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: ta
  text: 'என்னை நிராகரித்து, என் வார்த்தைகளை ஏற்றுக்கொள்ளாதவனுக்கு நியாயந்தீர்ப்பவர் ஒருவர் இருக்கிறார்: நான் பேசிய அந்த வார்த்தையே[a][b] கடைசி நாளில் அவனை நியாயந்தீர்க்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வார்த்தைகளைப் பெற்றுக்கொள்ளாதவனை.’ கிரேக்க வினைச்சொல் பெற்றுக்கொள்ளுதல், வரவேற்றல், ஏற்றுக்கொள்ளுதல் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் பேசிய அந்தச் செய்தியே.’ கிரேக்க logos என்ற சொல் சூழலுக்கேற்ப ‘வார்த்தை’ அல்லது ‘செய்தி’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: நிராகரித்து
  rationale: இங்கு வினைச்சொல் இயேசுவை வெறுமனே பொருட்படுத்தாமல் இருப்பதைவிட அவரைத் திட்டவட்டமாக மறுத்து ஒதுக்குவதைக் குறிக்கிறது; ‘நிராகரித்து’ என்பது அந்த வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: என் வார்த்தைகளை ஏற்றுக்கொள்ளாதவனை
  rationale: λαμβάνω இங்கு வெறுமனே எடுத்துக்கொள்வதை அல்ல, இயேசுவின் உரைகளை வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘ஏற்றுக்கொள்ளாத’ என்பது தமிழில் அந்த உறவுசார் மற்றும் பதிலளிக்கும் நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὰ ῥήματά μου
  choice: என் வார்த்தைகளை
  rationale: ῥῆμα இங்கு பேசப்பட்ட உரைகளைக் குறிக்கிறது. ‘வார்த்தைகள்’ என்பது பன்மையையும் பேச்சின் உள்ளடக்கத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: அவனை நியாயந்தீர்ப்பது ஒன்று இருக்கிறது
  rationale: மூலத்தில் உள்ள சற்றே மறைபொருளான அமைப்பையும், நிராகரிப்பவனுக்கு ஏற்கெனவே ஒரு நியாயந்தீர்க்கும் காரணி இருப்பதையும் இச்சொற்றொடர் பாதுகாக்கிறது; அடுத்து அந்தக் காரணி இயேசு பேசிய வார்த்தை என்று விளக்கப்படுகிறது.
- source_word: ὁ λόγος
  choice: வார்த்தை
  rationale: λόγος இங்கு இயேசு பேசிய வெளிப்பாட்டை ஒருமையில், வலிமையாகவும் ஓரளவு ஆளுருவாக்கப்பட்டதாகவும் முன்வைக்கிறது. ‘வார்த்தை’ அந்த வடிவத்தைக் காக்கிறது; ‘செய்தி’ என்பதும் சூழலுக்கேற்ற சாத்தியமான பொருள்.
- source_word: ὃν ἐλάλησα
  choice: நான் பேசிய
  rationale: ἐλάλησα என்பது இறந்தகாலத்தில் நிகழ்ந்த பேச்சை நேரடியாகக் குறிக்கிறது; ‘நான் பேசிய’ என்பது இயல்பானதும் மூலத்திற்கு நெருக்கமானதும் ஆகும்.
- source_word: ἐκεῖνος
  choice: வார்த்தையே
  rationale: ἐκεῖνος முன் கூறப்பட்ட λόγος-ஐ வலியுறுத்திச் சுட்டுகிறது. தமிழின் ‘-ஏ’ வலியுறுத்தல், ‘அந்த வார்த்தைதான்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κρινεῖ
  choice: நியாயந்தீர்க்கும்
  rationale: κρίνω என்பதன் பரந்த பொருள் ‘தீர்ப்பளித்தல்’; ‘குற்றவாளியாகத் தீர்க்கும்’ என்று மொழிபெயர்ப்பது முடிவை மூலத்தைவிட அதிகமாகக் குறிப்பிட்டுவிடும்.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: கடைசி நாளில்
  rationale: இது யோவான் நூலில் காணப்படும் முடிவுக்காலத் தீர்ப்பைக் குறிக்கும் நிலையான சொற்றொடர். ‘கடைசி நாளில்’ என்பது கூடுதல் கோட்பாட்டு விவரங்களைச் சேர்க்காமல் காலக் குறிப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: நியாயந்தீர்க்கும் காரணி யார் அல்லது எது?
  choice: இயேசு பேசிய வார்த்தையே கடைசி நாளில் நியாயந்தீர்க்கும் என்று வசனம் கூறும் விதம் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: இயேசுவே நேரடியாக நியாயாதிபதி; ‘வார்த்தை’ என்பது அவர் பயன்படுத்தும் அளவுகோலுக்கான சுருக்கக் குறிப்பு என்று வெளிப்படையாக விளக்குதல்.
  rationale: முதலில் நிராகரிப்பவனை நியாயந்தீர்ப்பது ஒன்று இருப்பதாகவும், பின்னர் அது இயேசு பேசிய வார்த்தை என்றும் வாக்கிய அமைப்பு கூறுகிறது. வேறு இடங்களில் இயேசுவின் நியாயத்தீர்ப்புப் பங்கைப் பற்றிய கூற்றுகளோடு இதைச் செயற்கையாக இசைவாக்காமல், மூலத்தின் ஆளுருவாக்கத்தையும் இறையியல் இழுபறியையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘நியாயந்தீர்க்கும்’ மற்றும் ‘கடைசி நாள்’ ஆகியவை வேதாகமச் சூழலுக்குரிய கருத்துத் துல்லியத்தைப் பாதுகாக்கும் பரவலாக அறியப்பட்ட சொற்களாக வைக்கப்பட்டுள்ளன.
