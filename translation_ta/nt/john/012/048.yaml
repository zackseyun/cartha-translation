  to: 'என்னை நிராகரித்து, என் வார்த்தைகளை ஏற்றுக்கொள்ளாதவனுக்கு நியாயந்தீர்ப்பவர் ஒருவர் இருக்கிறார்: நான் பேசிய அந்த வார்த்தையே[a][b] கடைசி நாளில் அவனை நியாயந்தீர்க்கும்.'
