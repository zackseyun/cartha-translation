source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: ta
  text: ஆகவே, யூதர்களிலிருந்து ஒரு பெருங்கூட்டம் அவர் அங்கே இருப்பதை அறிந்துகொண்டார்கள்.[a] அவர்கள் இயேசுவின் காரணமாக மட்டுமல்ல, அவர் இறந்தோரிலிருந்து எழுப்பிய லாசருவையும் பார்ப்பதற்காக வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயர்களிலிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவாக யூத மக்களைக் குறிக்கலாம்; யோவான் நற்செய்தியின் சில சூழல்களில் குறிப்பாக யூதேயாவைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: அறிந்துகொண்டார்கள்
  rationale: இறந்தகால வினை இங்கு ஏற்கெனவே அறிந்திருந்த நிலையை அல்ல, ஒரு செய்தியைத் தெரிந்துகொண்ட நிகழ்வைக் குறிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள விளைவு அல்லது தொடர்ச்சித் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ὄχλος πολὺς
  choice: பெருந்திரளான மக்கள்
  rationale: கணிசமான எண்ணிக்கையுள்ள மக்கள் கூட்டத்தைக் குறிக்கும் கிரேக்கச் சொல்லாட்சியை இயல்பான தமிழில் அளிக்கிறது.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: யூதர்களில்
  rationale: அந்த மக்கள் கூட்டம் யூதர்களிலிருந்து அமைந்தது என்ற ἐκ என்பதன் பகுதி சார்ந்த பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: அவர் அங்கே இருப்பதை
  rationale: கிரேக்கத்தில் உள்ள நிகழ்காலத்தைப் பாதுகாக்கும் அதேவேளை, சூழலிலிருந்து இயேசுவே மறைமுக எழுவாய் என்பதை மரியாதைப் பன்மையுடன் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: இயேசுவுக்காக மட்டுமல்ல
  rationale: διά + வேற்றுமை வடிவம் காட்டும் காரணம் அல்லது நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: '...யும் பார்ப்பதற்காக'
  rationale: மாறுபாட்டையும் கூடுதல் நோக்கத்தையும் தமிழின் ‘மட்டுமல்ல ... -யும்’ கட்டமைப்பால் இயல்பாகப் பாதுகாக்கிறது.
- source_word: Λάζαρον
  choice: லாசரு
  rationale: தனிப்பெயர் நவீனத் தமிழில் பரவலாக அறியப்பட்ட வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபுடன் ‘லாசருவையும்’ என வருகிறது.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: அவர் இறந்தோரிலிருந்து உயிருடன் எழுப்பிய
  rationale: ἐγείρω இச்சூழலில் லாசருவை மீண்டும் உயிரடையச் செய்ததைக் குறிக்கிறது; ‘உயிருடன்’ என்பது தமிழில் அந்தப் பொருளைத் தெளிவாக்குகிறது, ‘இறந்தோரிலிருந்து’ மூலத்தின் ἐκ νεκρῶν வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களில்
  alternative: யூதேயர்களில்
  rationale: இச்சூழலில் சொல் யூத மக்களைப் பொதுவாகக் குறிக்கலாம்; அதே நேரத்தில் யூதேயா பகுதியைச் சேர்ந்தவர்களைக் குறிப்பதற்கான சாத்தியமும் உள்ளது. முதன்மை உரை பரந்த இன-சமயப் பொருளைத் தருகிறது; அடிக்குறிப்பு உண்மையான புவியியல் மாற்றுப் பொருளைப் பாதுகாக்கிறது.
- issue: ἤγειρεν என்பதில் செய்பவரின் அடையாளம்
  choice: அவர் ... உயிருடன் எழுப்பிய
  alternative: இயேசு ... உயிருடன் எழுப்பிய
  rationale: கிரேக்க மூலத்தைப் போலவே மறைமுக எழுவாயைப் பாதுகாக்கிறது; உடனடிச் சூழலில் அது இயேசுவைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அவர்’ என்பது இயேசுவைக் குறிக்கும் மரியாதைப் பன்மை. மூலத்தின் நோக்கக் கட்டமைப்பும் Ἰουδαίων என்பதிலுள்ள பொருள் இரட்டுறுதலும் பாதுகாக்கப்பட்டுள்ளன.
