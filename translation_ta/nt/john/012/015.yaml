id: JHN.12.15
reference: John 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: ta
  text: “சீயோன் மகளே, அஞ்சாதே! இதோ, உன் அரசர் கழுதைக்குட்டியின்மேல் அமர்ந்து வருகிறார்.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீயோன் மகள்’ என்பது சீயோன் அல்லது எருசலேமை ஒரு மகளாகச் சித்தரிக்கும் தீர்க்கதரிசன உருவகம்.
    reason: cultural_note
  - marker: b
    text: இவ்வார்த்தைகள் சகரியா 9:9-ஐ எதிரொலித்து, இயேசுவைச் சீயோனுக்கு வாக்களிக்கப்பட்ட அரசராக முன்வைக்கின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: அஞ்சாதே
  rationale: μή உடன் வரும் φοβέομαι என்பதன் நிகழ்கால ஏவல் வடிவம் பயப்படுவதைத் தடைசெய்கிறது. ‘அஞ்சாதே’ என்பது சுருக்கமான, இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: θυγάτηρ Σιών
  choice: சீயோன் மகளே
  rationale: θυγάτηρ என்ற அழைப்புவேற்றுமையும் Σιών என்ற சார்புவேற்றுமையும் சீயோன்/எருசலேமை மகளாக உருவகப்படுத்தும் தீர்க்கதரிசன மொழியைத் தக்கவைக்கின்றன.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் ἰδού என்பதன் உரையாடல் செயல்பாட்டை ‘இதோ’ இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ βασιλεύς σου
  choice: உன் அரசர்
  rationale: உறவுச் சுட்டுப்பெயருடன் கூடிய திட்டவட்டமான பெயர்ச்சொல்லை நேரடியாக வெளிப்படுத்துகிறது. தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் மேசிய அரசத்தன்மை சூழலால் புலப்படுகிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: நிகழ்கால வினைச்சொல்லின் உயிரோட்டமான உடனடித் தன்மையைத் தக்கவைக்கிறது; அரசரைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை இயல்பான தமிழாகும்.
- source_word: καθήμενος
  choice: அமர்ந்து
  rationale: அவர் எவ்வாறு வருகிறார் என்பதைச் சொல்லும் நிகழ்காலப் பங்கேற்பு வடிவத்தைப் பாதுகாக்கிறது; ‘சவாரிசெய்து’ என மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்க்கும்.
- source_word: ἐπὶ πῶλον ὄνου
  choice: கழுதைக்குட்டியின்மேல்
  rationale: πῶλος குறிப்பிடும் இளம் விலங்கையும் ὄνος குறிப்பிடும் கழுதையையும் இயல்பான தமிழில் ஒரே கூட்டுச்சொல்லால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சகரியா 9:9-ஐ எதிரொலிக்கும் மேசிய அரசர் குறிப்பு
  choice: ‘சீயோன் மகளே’ மற்றும் ‘உன் அரசர்’ என்ற தீர்க்கதரிசன மொழியை முதன்மை உரையில் அப்படியே தக்கவைத்தல்
  alternative: சீயோன் என்பது எருசலேம் என்றும், வருகிற அரசர் இயேசு என்றும் முதன்மை உரையிலேயே விளக்குதல்
  rationale: மூல உரை தீர்க்கதரிசன உருவகத்தையும் அரசருக்குரிய மொழியையும் பயன்படுத்துகிறது; அதன் பொருளை உரைக்குள் விரிவுபடுத்தாமல், பின்னணியை அடிக்குறிப்பில் விளக்குவது உரையின் இறுக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ‘அரசர்’ என்பதன் மேசியப் பட்டப்பெயர் தன்மை
  choice: ‘உன் அரசர்’ என்று மொழிபெயர்த்து, மரியாதை வினைமுற்றைப் பயன்படுத்துதல்
  alternative: ‘உன் ராஜா’ அல்லது விளக்கமாக ‘உன் மேசிய அரசர்’ என்று மொழிபெயர்த்தல்
  rationale: βασιλεύς என்பதற்கு ‘அரசர்’ நேரான, கண்ணியமான நவீனத் தமிழ். ‘மேசிய’ என்பதைச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரைக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடையைப் பயன்படுத்துகிறது. ‘அஞ்சாதே’, ‘இதோ’ ஆகியவை மூலத்தின் நேரடி அழைப்பையும் கவன ஈர்ப்பையும் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
