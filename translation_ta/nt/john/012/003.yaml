source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: ta
  text: அப்போது மரியா, விலையுயர்ந்த தூய[b] ஜடாமாஞ்சி நறுமணத் தைலம் ஒரு லித்ரா[a] எடுத்து, இயேசுவின் பாதங்களில் பூசி, தன் கூந்தலால் அவருடைய பாதங்களைத் துடைத்தாள். அந்த நறுமணத் தைலத்தின் நறுமணம் வீடு முழுவதும் நிறைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: லித்ரா என்பது ரோமர்களின் ஓர் எடை அலகு; அது சுமார் 327 கிராம், அதாவது ஒரு கிலோகிராமில் ஏறக்குறைய மூன்றில் ஒரு பங்கு.
    reason: cultural_note
  - marker: b
    text: “தூய” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல்லின் துல்லியமான பொருள் விவாதத்திற்குரியது; “உண்மையான” அல்லது “கலப்படமற்ற” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து கதை நகர்வதைக் காட்டுகிறது; காரணவிளைவைக் கடுமையாக வலியுறுத்தாமல் இணைப்பின் இயல்பைத் தக்கவைக்கிறது.
- source_word: λαβοῦσα
  choice: எடுத்து
  rationale: முதன்மைச் செயல்களுக்கு முன் நிகழ்ந்த செயலை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: λίτραν
  choice: ஒரு லித்ரா
  rationale: பண்டைய ரோம எடை அலகை நவீன அலகாகத் தோராயமாக மாற்றாமல் ஒலிபெயர்த்து, அதன் அளவை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: μύρου
  choice: நறுமணத் தைலம்
  rationale: அபிஷேகத்திற்குப் பயன்படுத்தப்பட்ட மணமுள்ள எண்ணெய் அல்லது களிம்பை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: νάρδου
  choice: ஜடாமாஞ்சி
  rationale: குறிப்பிட்ட நறுமணப் பொருளைக் குறிக்கும் தாவரப் பெயரைப் பயன்படுத்தி மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- source_word: πιστικῆς
  choice: தூய
  rationale: சூழலில் உயர்தரமான, கலப்படமற்ற ஜடாமாஞ்சியைக் குறிக்கும் சாத்தியமான பொருள்; சொல்லின் பொருள் விவாதத்திற்குரியது என்பதை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: πολυτίμου
  choice: விலையுயர்ந்த
  rationale: அதன் மிகுந்த பணமதிப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἤλειψεν
  choice: பூசி
  rationale: நறுமணத் தைலத்தை உடலில் தடவிய செயலை நேரடியாகக் கூறுகிறது; தேவையற்ற சடங்கு அல்லது அரசாபிஷேகப் பொருளை மொழிபெயர்ப்பே கட்டாயப்படுத்துவதில்லை.
- source_word: τοὺς πόδας τοῦ Ἰησοῦ
  choice: இயேசுவின் பாதங்களில்
  rationale: செயல் நிகழ்ந்த உடற்பகுதியைத் தெளிவாகவும் மரியாதையான நடையிலும் வழங்குகிறது.
- source_word: ἐξέμαξεν
  choice: துடைத்தாள்
  rationale: கூந்தலைப் பயன்படுத்தி துடைத்த அல்லது உலர்த்திய செயலை நேரடியாகக் குறிக்கிறது.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: தன் கூந்தலால்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை இயல்பான தமிழில் தருவதோடு, கூந்தல் மரியாவின் சொந்தக் கூந்தல் என்பதையும் தெளிவாக்குகிறது.
- source_word: ἐπληρώθη
  choice: வீடு முழுவதும் நிறைந்தது
  rationale: நறுமணம் வீட்டின் எல்லாப் பகுதிகளிலும் பரவியதைக் காட்டும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ἤλειψεν என்பதில் அபிஷேகக் கருத்தை அளவுக்கு மீறி வாசிக்கும் சாத்தியம்
  choice: உடலில் நறுமணத் தைலம் இடும் நேரடிச் செயலைக் குறிக்க “பூசி” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “அபிஷேகம் செய்தாள்” என்று மொழிபெயர்த்தல்.
  rationale: இச்செயலுக்குச் சின்னார்த்தம் இருக்கக்கூடும்; ஆனால் வசனமே வெளிப்படையாகக் கூறாத சடங்கு, அரசாபிஷேகம் அல்லது குறிப்பிட்ட இறையியல் பொருளை மொழிபெயர்ப்பு கட்டாயப்படுத்தக் கூடாது.
translation_notes:
  register: நடை நவீன, தெளிவான, மரியாதையான பொதுத்தமிழில் அமைக்கப்பட்டுள்ளது. “பாதங்கள்” என்பது dignified register-ஐக் காக்கிறது; “ஜடாமாஞ்சி” மூலத்தில் குறிப்பிடப்பட்ட நறுமணப் பொருளைத் துல்லியமாக அடையாளப்படுத்துகிறது. பண்டைய அலகான “லித்ரா” உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
