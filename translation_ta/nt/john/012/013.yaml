  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: ta
  text: 'அவர்கள் பேரீச்சமரக் கிளைகளை எடுத்துக்கொண்டு, அவரைச் சந்திக்க வெளியே சென்றார்கள். அவர்கள் தொடர்ந்து உரக்கக் கூவினார்கள்: “ஓசன்னா![a] ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்![b] மேலும், இஸ்ரவேலின் அரசர்!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓசன்னா” என்பது எபிரேய மொழியிலிருந்து வந்த ஆரவாரச் சொல். இதன் அடிப்படைப் பொருள் “இப்போதே காப்பாற்றும்” அல்லது “தயவுசெய்து காப்பாற்றும்” என்பதாகும்; இக்காலத்தில் இது புகழ்ச்சிக் கூக்குரலாகவும் பயன்பட்டது.
    reason: lexical_alternative
  - marker: b
    text: இந்த ஆரவாரம் சங்கீதம் 118:26-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “இஸ்ரவேலின் அரசரும்!” இச்சொற்றொடர் “வருகிறவர்” என்பவருக்கு இணையாக வரும் பட்டமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: பேரீச்சமரக் கிளைகள்
  rationale: βάϊον என்பது கிளையையும் φοῖνιξ இச்சூழலில் பேரீச்சமரத்தையும் குறிக்கிறது. தமிழில் இயல்பாகவும் இரு சொற்களின் பொருளையும் தெளிவாகவும் தருகிறது.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: அவரைச் சந்திக்க வெளியே சென்றார்கள்
  rationale: அவரை எதிர்கொண்டு சந்திப்பதற்காக வெளியே சென்ற செயலை நேரடியாகத் தருகிறது; ‘வரவேற்க’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத நோக்கம் சேரக்கூடும்.
- source_word: ἐκραύγαζον
  choice: தொடர்ந்து உரக்கக் கூவினார்கள்
  rationale: வினைச்சொல்லின் imperfect வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த கூக்குரலைக் காட்டுகிறது; ‘தொடர்ந்து’ அதன் காலநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ὡσαννά
  choice: ஓசன்னா
  rationale: எபிரேய மொழியிலிருந்து வந்த இந்த வழிபாட்டு ஆரவாரச் சொல்லை ஒலிபெயர்ப்பது அதன் வரலாற்றுப் பயன்பாட்டையும் புகழ்ச்சிக் கூக்குரல் தன்மையையும் காக்கிறது; அடிப்படைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் பங்கேற்பு வினையை இயல்பான நவீனத் தமிழில் தருகிறது; சங்கீதம் 118:26-இன் எதிரொலியையும் காக்கிறது.
- source_word: ἐν ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: ἐν ὀνόματι என்ற வேதாகமச் சொற்றொடரை முறையாகப் பாதுகாக்கிறது; κυρίου என்பதற்கு ‘ஆண்டவர்’ இயல்பான மரியாதைமிக்க தமிழாக்கம்.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் அரசரும் ஆசீர்வதிக்கப்பட்டவர்
  rationale: καί என்பதை ‘-உம்’ எனப் பொருள்படுத்தி, முன் வரும் ‘ஆசீர்வதிக்கப்பட்டவர்’ என்பதை இயல்பாக நிரப்புகிறது. இதனால் அரச பட்டத்தின் உச்சக்கட்ட வலிமை நிலைத்தாலும், καί-யின் ‘மற்றும்’ என்ற உண்மையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோள் சார்ந்த κυρίου என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா
  rationale: கிரேக்க மூலத்தில் κυρίου என்றே உள்ளது. சங்கீதம் 118:26-இன் எபிரேயப் பின்னணியில் தேவனுடைய தனிப்பெயர் இருந்தாலும், அதை இங்கு பிரதான உரையில் சேர்ப்பது கிரேக்க வடிவத்தைவிடக் குறிப்பானதாகிவிடும்.
- issue: கூட்டத்தின் அரச-மேசியா சார்ந்த ஆரவாரம்
  choice: இஸ்ரவேலின் அரசர்
  alternative: இஸ்ரவேலின் ராஜா
  rationale: மூலத்தின் வெளிப்படையான βασιλεύς பட்டத்தை மெலிதாக்காமலும் விளக்கிச் சேர்க்காமலும் காக்கிறது. ‘அரசர்’ என்பது நவீன, கண்ணியமான பொதுத்தமிழ்.
- issue: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ என்பதன் தொடரியல் உறவு
  choice: இஸ்ரவேலின் அரசரும் ஆசீர்வதிக்கப்பட்டவர்
  alternative: மற்றும் இஸ்ரவேலின் அரசர்
  rationale: καί இங்கு ‘வருகிறவர்’ என்பவரை ‘இஸ்ரவேலின் அரசர்’ என உச்சமாக அடையாளப்படுத்தும் இணைப்பாகவோ, தொடர்ந்த ஆரவார உறுப்பாகவோ புரியலாம். பிரதான உரை இயல்பான தமிழில் முன்னதைக் காட்டுகிறது; நேரடி இணைப்பு மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தொடர்ந்த கூக்குரலைக் காட்ட ‘தொடர்ந்து’ பயன்படுத்தப்பட்டுள்ளது. ‘ஓசன்னா’ வழிபாட்டு ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டு அதன் இரட்டைச் செயல்பாடு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
