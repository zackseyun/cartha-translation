reference: John 12:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: ta
  text: அவன் இப்படிச் சொன்னது, ஏழைகளைக் குறித்து அவனுக்கு அக்கறை இருந்ததால் அல்ல; அவன் திருடனாய் இருந்து, பணப்பெட்டியை வைத்திருந்தவனாய், அதில் போடப்பட்டவற்றை எடுத்துக்கொள்வது அவனுக்கு வழக்கமாக இருந்ததாலே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எடுத்துக்கொள்வது” என்பதற்கு மாற்றாக, “எடுத்துச் சென்றான்” அல்லது சூழலின்படி “திருடிவந்தான்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை பொதுவாகச் சுமத்தல் அல்லது எடுத்துச் செல்லுதலைக் குறிக்கலாம்; ஆனால் “அவன் திருடன்” என்ற இங்குள்ள சூழல் முறைகேடாக எடுத்துக்கொண்டதைக் காட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: அவன் இப்படிச் சொன்னது
  rationale: δέ இங்கு மென்மையான இணைப்புச்சொல்; தமிழில் தனியாக மொழிபெயர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் உணர்த்தப்பட்டுள்ளது. τοῦτο என்பது ‘இப்படி’ எனச் சூழலோடு இணைக்கப்படுகிறது.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: '... இருந்ததால் அல்ல; ... இருந்ததால்தான்'
  rationale: மறுக்கப்படும் காரணத்தையும் உண்மையான காரணத்தையும் தெளிவாக எதிர்நிறுத்தும் இயல்பான தமிழ் அமைப்பு.
- source_word: περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: ஏழைகள்மேல் அவனுக்கு அக்கறை இருந்தது
  rationale: μέλει உடன் வரும் περί சொற்றொடர் ஒருவரைக் குறித்த அக்கறையைத் தெரிவிக்கிறது; ‘அக்கறை இருந்தது’ நவீனத் தமிழில் தெளிவானது.
- source_word: κλέπτης ἦν
  choice: அவன் திருடனாக ... இருந்தான்
  rationale: κλέπτης மறைவாகத் திருடுகிறவனைக் குறிக்கிறது; ‘திருடன்’ நேரடியான பொருத்தம்.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: பணப்பெட்டியைத் தன் பொறுப்பில் வைத்துக்கொண்டு
  rationale: γλωσσόκομον பணம் வைக்கப்பட்ட பெட்டி அல்லது பையைக் குறிக்கலாம். ἔχων இங்கு வெறுமனே உடைமையைவிட அதைக் கையாளும் பொறுப்பையும் கட்டுப்பாட்டையும் சூழலில் உணர்த்துகிறது.
- source_word: τὰ βαλλόμενα
  choice: அதில் போடப்பட்டவற்றை
  rationale: பெட்டியில் இடப்பட்ட பணம் அல்லது பொருட்களைச் சுட்டுகிறது; இலக்கிடம் தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐβάσταζεν
  choice: எடுத்துக்கொள்பவனாக இருந்தான்
  rationale: βαστάζω பொதுவாக ‘சுமத்தல்/எடுத்துச் செல்லுதல்’ எனப் பொருள்படலாம்; ஆனால் ‘திருடன்’ என்ற உடனடிச் சூழல் தனக்காக எடுத்துக்கொண்டதைச் சுட்டுகிறது. தொடர்ச்சியான வழக்கத்தை இறந்தகால அமைப்பு உணர்த்துகிறது.
theological_decisions:
- issue: யூதாசின் திருட்டுடன் தொடர்புடைய ἐβάσταζεν என்பதன் பொருள்
  choice: அதில் போடப்பட்டவற்றை எடுத்துக்கொள்பவனாக இருந்தான்
  alternative: அதில் போடப்பட்டவற்றைச் சுமந்து சென்றான் / அதில் போடப்பட்டவற்றைத் திருடிவந்தான்
  rationale: ‘அவன் திருடன்’ என்ற உடனடிச் சூழல் முறைகேடாக எடுத்துக்கொள்வதைக் காட்டுகிறது. அதேவேளை வினைச்சொல்லை நேரடியாக ‘திருடினான்’ என்று மிகத் துல்லியப்படுத்தாமல், அதன் இயல்பான ‘எடுத்தல்’ நிழலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். கிரேக்க வாக்கியத்தின் காரண–எதிர்க்காரண அமைப்பு பாதுகாக்கப்பட்டுள்ளது. γλωσσόκομον என்பதற்கு முதன்மை உரையில் ‘பணப்பெட்டி’ பயன்படுத்தப்பட்டுள்ளது; பெட்டி/பை என்ற பொருள் வேறுபாடு வசனத்தின் கருத்தை மாற்றாததால் தனிக் குறிப்பாகச் சேர்க்கப்படவில்லை. அடிக்குறி குறியீடு தொடர்புடைய வினைச்சொல் கருத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
