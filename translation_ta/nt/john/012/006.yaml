revisions:
- from: அவன் இப்படிச் சொன்னது ஏழைகள்மேல் அவனுக்கு அக்கறை இருந்ததால் அல்ல; அவன் திருடனாகவும், பணப்பெட்டியைத் தன் பொறுப்பில் வைத்துக்கொண்டு, அதில் போடப்பட்டவற்றை எடுத்துக்கொள்பவனாகவும் இருந்ததால்தான்.[a]
  to: அவன் இப்படிச் சொன்னது, ஏழைகளைக் குறித்து அவனுக்கு அக்கறை இருந்ததால் அல்ல; அவன் திருடனாய் இருந்து, பணப்பெட்டியை வைத்திருந்தவனாய், அதில் போடப்பட்டவற்றை எடுத்துக்கொள்வது அவனுக்கு வழக்கமாக இருந்ததாலே.[a]
  rationale: The revision retains the source’s not-because/but-because contrast while recasting the latter portion into natural Tamil. It distinguishes Judas’s being a thief from his habitual taking of the contents, and it represents ἔχων as an attendant participial circumstance. The footnote remains attached to the interpretively difficult verb and preserves alternatives without imposing an unwarranted lexical certainty.
