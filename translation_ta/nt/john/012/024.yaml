  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: ta
  text: '“உண்மையாகவே, உண்மையாகவே[a], நான் உங்களுக்குச் சொல்கிறேன்: கோதுமை மணி நிலத்தில் விழுந்து இறக்காவிட்டால், அது தனியாகவே இருக்கும்; ஆனால் அது இறந்தால்[b], மிகுந்த கனியைத் தரும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “ஆமென், ஆமென்”; இது சொல்லப்போகும் கருத்தின் உறுதியையும் முக்கியத்துவத்தையும் வலியுறுத்தும் தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இந்த உருவகத்தில், நிலத்தில் இடப்பட்ட கோதுமை மணி கனி தருவதற்கு முன் இறக்க வேண்டும். சூழலில், இயேசு இந்த முறையைத் தமது மரணத்துடனும் தம்மைப் பின்பற்றுவோருடனும் தொடர்புபடுத்துகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: யோவானில் வரும் வலியுறுத்தலான இரட்டிப்பை அப்படியே காத்து, இன்றைய வாசகருக்குத் தெளிவான தமிழில் தருகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: முதலாம் நபர் உரையையும் பன்மை நேரடி அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐὰν μὴ
  choice: இறக்காவிட்டால்
  rationale: ‘அப்படி நிகழாவிட்டால்’ என்ற நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: கோதுமை மணி
  rationale: κόκκος என்பதன் தனித்த தானியமணி அல்லது விதை என்ற பொருளைக் காத்து, வேளாண் உருவகத்திற்கு ஏற்ற வழக்கமான தமிழைப் பயன்படுத்துகிறது.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: நிலத்தில் விழுந்து
  rationale: முதலில் நிலத்தில் விழுதல், பின்னர் இறத்தல் என்ற கிரேக்கத் தொடரைச் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: ἀποθάνῃ
  choice: இறக்காவிட்டால் / இறந்தால்
  rationale: ஒரே கிரேக்க வினைச்சொல் இரு நிபந்தனைகளிலும் மீண்டும் வருவதைக் காத்து, இயேசுவின் மரணத்துடனான சூழல்சார் தொடர்பை மங்கச் செய்யாமல் தருகிறது.
- source_word: αὐτὸς μόνος μένει
  choice: அது தனியாகவே இருக்கும்
  rationale: αὐτός என்பதன் வலியுறுத்தலையும் μόνος என்பதன் ‘தனியாக’ என்ற பொருளையும் தேவையற்ற சொற்பெருக்கமின்றிக் காக்கிறது.
- source_word: πολὺν καρπὸν φέρει
  choice: மிகுந்த கனியைத் தரும்
  rationale: ‘கனி தருதல்’ என்ற உருவகத்தை ‘விளைச்சல்’ அல்லது ‘பலன்’ என்று விளக்கிவிடாமல் காத்து, πολύν என்பதன் மிகுதியையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வேளாண் உருவகத்தில் மறைமுகமாக உள்ள கிறிஸ்துவியல் மற்றும் சீடத்துவப் பொருள்
  choice: முதன்மை உரையில் வேளாண் உருவகத்தை அப்படியே வைத்து, அதன் பொருளை வெளிப்படையாக விரிவாக்கவில்லை.
  alternative: இது இயேசுவின் மரணத்தையும் அதனால் பலருக்கு உண்டாகும் வாழ்வையும் குறிக்கிறது என்று முதன்மை உரையிலேயே சேர்த்தல்.
  rationale: சுற்றியுள்ள வசனங்கள் இயேசுவின் மரணத்தையும் அவரைப் பின்பற்றுவோரையும் நோக்கிச் சுட்டினாலும், இவ்வசனம் தானாகவே உருவகத்தின் முழு விளக்கத்தைச் சொல்லவில்லை. எனவே அந்த இறையியல் அழுத்தமும் மறைமுகத் தன்மையும் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘இறத்தல்’ மற்றும் ‘கனி தருதல்’ ஆகிய மீளுருவங்களைக் காத்து, மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் விளக்கிவிடாமல் வைத்துள்ளது.
