id: JHN.12.8
reference: John 12:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ta
  text: ஏனெனில், ஏழைகள் எப்போதும் உங்களோடு இருக்கிறார்கள்; ஆனால் நான் எப்போதும் உங்களோடு இருப்பதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πτωχούς
  choice: ஏழைகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள இந்தப் பெயரடை, ஏழ்மை நிலையில் உள்ள மக்களை ஒரு பொதுப் பிரிவாகக் குறிக்கிறது. தமிழில் “ஏழைகள்” இயல்பாகவும் சுருக்கமாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; “ஏனெனில்” அதன் இணைப்புச் செயல்பாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்திருக்கும் நிலை அல்லது கிடைக்கக்கூடிய வாய்ப்பைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது கிரேக்கத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἔχετε
  choice: உங்களோடு இருக்கிறார்கள் / உங்களோடு இருப்பதில்லை
  rationale: இங்கு உடைமையைக் காட்டிலும் உடனிருத்தல் அல்லது அணுகக்கூடியிருத்தலே பொருள். இயல்பான தமிழுக்காக முதல் வாக்கியத்தில் எழுவாய்க்கேற்ற பன்மையும், இரண்டாவது வாக்கியத்தில் இயேசுவைக் குறிக்கும் ஒருமையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: μεθ’ ἑαυτῶν
  choice: உங்களோடு
  rationale: சீடர்களின் உடனிருப்பையும் சூழலில் தொடர்ந்து காணப்படுவதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐμέ
  choice: நான்
  rationale: கிரேக்கத்தில் இது வினையின் நேரடி செயப்படுபொருளாக இருந்தாலும், தமிழின் இயல்பான இருப்புக் கட்டமைப்பில் முதலாம் நபர் எழுவாயாக “நான்” வருகிறது; குறிப்பு இயேசுவையே சுட்டுகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: ஏழைகளின் தொடர்ந்திருக்கும் உடனிருப்புக்கும் இயேசுவின் வரையறுக்கப்பட்ட உடனிருப்புக்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐ πάντοτε
  choice: எப்போதும் ... இருப்பதில்லை
  rationale: மறுப்பையும் “எப்போதும்” என்ற காலவினையடையையும் இயல்பான தமிழில் வெளிப்படுத்தி, முதல் கூறுடன் உள்ள சொல் ஒற்றுமையையும் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் கூற்று ஏழைகளுக்கான அக்கறையைக் குறைத்துக் காட்டுவதாகத் தவறாகப் பயன்படுத்தப்படக்கூடிய சாத்தியம்
  choice: ஏழைகளின் தொடர்ந்திருக்கும் உடனிருப்பையும் இயேசுவின் உடனிருப்பு எப்போதும் நீடிக்காது என்பதையும் நேரடியான முரண்பாடாக மொழிபெயர்த்தல்
  alternative: ஏழைகள் முக்கியமற்றவர்கள் என்று உணர்த்தும் விளக்கமொழிபெயர்ப்பு, அல்லது முரண்பாட்டை மழுங்கடிக்கும் மென்மைப்படுத்தப்பட்ட மொழிபெயர்ப்பு
  rationale: கிரேக்க உரை உடனிருப்பு மற்றும் காலவாய்ப்பின் வேறுபாட்டை மட்டுமே நேரடியாகக் கூறுகிறது. அது ஏழைகளுக்கான அக்கறையை மதிப்பிழக்கச் சொல்லவில்லை; அதேவேளை இயேசுவின் உடனிருப்புக்குரிய அந்தத் தனித்த நேரத்தின் அவசரத்தையும் மறைக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் காரண இணைப்பும் இரு கூறுகளின் முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன. தமிழில் “ஏழைகள்” என்பதே “poor people” என்ற விரிவாக்கம் இன்றியே தெளிவாக இருப்பதால் அடிக்குறிப்பு தேவையில்லை.
