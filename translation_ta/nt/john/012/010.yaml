lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: முடிவுசெய்தார்கள்
  rationale: இவ்வினைச்சொல் ஆலோசனையை மட்டுமல்லாமல், ஒரு செயலை மேற்கொள்ளும் உறுதியான முடிவையும் இங்கு குறிக்கிறது. ‘முடிவுசெய்தார்கள்’ என்பது அந்த நோக்கமுள்ள தீர்மானத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: δὲ
  choice: எனவே
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் காரணவிளைவு சார்ந்த கதை முன்னேற்றத்தை இங்கு δέ இணைக்கிறது. ‘எனவே’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; வலுவான முரண்பாட்டைத் தேவையின்றி உருவாக்குவதில்லை.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: நற்செய்தி நூல்களில் இப்பன்மைச் சொல் ஒரே பிரதான ஆசாரியரை அல்ல, தலைமை வகித்த குருத்துவத் தலைவர்களைக் குறிக்கிறது. ‘தலைமைக் குருக்கள்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: ἵνα
  choice: கொன்றுவிட முடிவுசெய்தார்கள் என்ற வினையெச்ச அமைப்பு
  rationale: தீர்மானத்தைக் குறிக்கும் வினைக்குப் பின் ἵνα மற்றும் subjunctive அந்தத் தீர்மானத்தின் நோக்கம் அல்லது உள்ளடக்கத்தைக் காட்டுகின்றன. தமிழில் ‘கொன்றுவிட முடிவுசெய்தார்கள்’ என்ற அமைப்பு இதை இயல்பாகத் தருகிறது.
- source_word: καὶ
  choice: -யும்
  rationale: இங்கு καί, இயேசுவுடன் லாசருவும் கொல்லப்பட வேண்டியவராகச் சேர்க்கப்பட்டதைச் சுட்டும் சேர்க்கைப் பொருளில் வருகிறது. தமிழின் ‘லாசருவையும்’ இதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: τὸν Λάζαρον
  choice: லாசரு
  rationale: பெயர் நவீனத் தமிழ் வேதாகம வழக்குக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது; வேற்றுமை உருபுடன் ‘லாசருவையும்’ என வருகிறது.
- source_word: ἀποκτείνωσιν
  choice: கொன்றுவிட
  rationale: ἀποκτείνω என்பதன் நேரடியான பொருள் ‘கொல்’. ‘கொன்றுவிட’ என்பது மரணத்தை நோக்கிய செயலைத் தெளிவாகக் காட்டுகிறது; நீதிமுறை தண்டனை அல்லது ‘கொலைசெய்’ என்பதிலுள்ள கூடுதல் ஒழுக்கத் தீர்ப்பை இறக்குமதி செய்வதில்லை.
theological_decisions:
- issue: லாசருவைக் குறித்த தலைமைக் குருக்களின் நோக்கத்தை விவரித்தல்
  choice: லாசருவையும் கொல்ல அவர்கள் முடிவுசெய்ததாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘சதித்திட்டம் தீட்டினார்கள்’ அல்லது ‘சூழ்ச்சி செய்தார்கள்’ போன்ற வலுவான முன்திட்ட மொழியைப் பயன்படுத்துதல்
  rationale: மூலவாக்கியம் திட்டமிட்ட, பகைமையான தீர்மானத்தைக் காட்டுகிறது; ஆனால் சதி அல்லது சூழ்ச்சிக்கான சிறப்பு சொல்லைப் பயன்படுத்தவில்லை. ஆகவே அதன் தீவிரத்தைப் பேணியபடியே கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தலைமைக் குருக்கள்’ வழக்கமான மதச்சூழல் சொல்லாக இருந்தாலும் எளிதில் புரிகிறது. மூலத்தின் திட்டமிட்ட தீர்மானமும் ‘லாசருவையும்’ என்பதிலுள்ள சேர்க்கைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
