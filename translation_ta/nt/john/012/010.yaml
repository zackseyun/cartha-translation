- from: எனவே, தலைமைக் குருக்கள் லாசருவையும் கொன்றுவிட முடிவுசெய்தார்கள்.[a]
  to: எனவே, தலைமைக் குருக்கள் லாசருவையும் கொல்ல முடிவு செய்தார்கள்.[a]
  rationale: மூலத்தின் திட்டமிட்ட தீர்மானம், லாசருவைச் சேர்த்துக் குறிக்கும் καί-யின் சேர்க்கைப் பொருள், மற்றும் கொல்லும் நோக்கம் ஆகியவை மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளன. இயல்பற்ற வினை அமைப்பு மட்டும் நவீனத் தரமான தமிழில் திருத்தப்பட்டுள்ளது.
