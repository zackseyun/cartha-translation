id: JHN.12.29
reference: John 12:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: ta
  text: ஆகவே, அங்கே நின்றுகொண்டிருந்த கூட்டத்தினர் அதைக் கேட்டு, “இடி முழங்கியது”[a] என்று சொல்லிக்கொண்டிருந்தார்கள். வேறு சிலரோ, “ஒரு வானதூதர் அவரிடம் பேசியிருக்கிறார்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடிப் பொருளில், “இடி ஏற்பட்டது.”
    reason: βροντὴν γεγονέναι என்ற கிரேக்கச் சொற்றொடரின் வடிவத்தை நெருக்கமாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கேட்ட வானத்திலிருந்து வந்த குரலுக்கும் கூட்டத்தினரின் எதிர்வினைக்கும் இடையிலான தொடர்ச்சியையும் விளைவையும் காட்டுகிறது.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: அங்கே நின்றுகொண்டிருந்த கூட்டத்தினர்
  rationale: ἑστὼς என்பதன் நிறைவேற்றுநிலை அம்சத்தையும் காட்சியின் இடச்சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀκούσας
  choice: அதைக் கேட்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த கேட்டல் செயலைக் காட்டுகிறது; ‘அதை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட குரல் அல்லது ஒலியைச் சூழலிலிருந்து குறிக்கிறது.
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறா இறந்தகாலத்தின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘கூட்டத்தினர்’ என்பதற்கேற்ப பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: βροντὴν γεγονέναι
  choice: இடி முழங்கியது
  rationale: ‘இடி ஏற்பட்டது’ என்ற கிரேக்கக் கட்டமைப்பை இயல்பான நவீன தமிழில் வழங்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἄλλοι
  choice: வேறு சிலரோ
  rationale: கூட்டத்திற்குள் வேறொரு கருத்தைக் கொண்ட இரண்டாவது குழுவைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: Ἄγγελος
  choice: ஒரு வானதூதர்
  rationale: இச்சூழலில் மனிதத் தூதரை விட வானுலகத் தூதரையே கூட்டத்தினர் கருதியிருப்பதால் ‘வானதூதர்’ பொருத்தமானது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: λαλέω உடன் வரும் மறைமுகச் செயப்படுபொருளை இயல்பாகக் காட்டுகிறது; இங்கு சுட்டப்படுபவர் இயேசு.
- source_word: λελάληκεν
  choice: பேசியிருக்கிறார்
  rationale: முடிந்த செயல் தற்போதும் பொருத்தமுடையதாக இருப்பதை கிரேக்க நிறைவேற்றுக்காலத்திற்கு ஏற்ப வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வானத்திலிருந்து பேசியதாகக் கூட்டத்தினர் கருதியவரின் இயல்பு
  choice: ஒரு வானதூதர் அவரிடம் பேசியிருக்கிறார்
  alternative: ஒரு தூதர் அவரிடம் பேசியிருக்கிறார்
  rationale: முந்தைய வசனத்தின் வானத்திலிருந்து வந்த குரலைக் கூட்டத்தினர் விளக்கும் சூழலில் ἄγγελος என்பது வானுலகத் தூதரைக் குறிக்கும் வாய்ப்பே மிகுந்தது; உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கூட்டத்தைச் சுட்டும் ஒருமை கிரேக்க வினை, தமிழில் ‘கூட்டத்தினர்’ என்பதற்கேற்ப மரியாதை கலந்த பன்மையாக வழங்கப்பட்டுள்ளது; இயேசுவைக் குறிக்கும் சுட்டுப்பெயரும் ‘அவரிடம்’ என மரியாதை வடிவில் தரப்பட்டுள்ளது.
