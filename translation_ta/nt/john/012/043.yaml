id: JHN.12.43
reference: John 12:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: ta
  text: ஏனெனில், அவர்கள் கடவுளின் மகிமையைவிட மனிதர்களின் மகிமையையே[a] அதிகம் நேசித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதர்களிடமிருந்து வரும் பாராட்டு’ அல்லது ‘மனித அங்கீகாரம்.’
    reason: δόξα இச்சூழலில் ‘பாராட்டு’ அல்லது ‘அங்கீகாரம்’ என்ற பொருளையும் தரலாம்; τῶν ἀνθρώπων என்பதை மூலாதாரமாகவும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: நேசித்தார்கள்
  rationale: ἀγαπάω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம்; வெறும் ‘விரும்பினார்கள்’ என்பதைவிட வலுவான பற்றுதலைக் காட்டுவதோடு, மூலத்தின் ‘அன்பு/நேசம்’ சார்ந்த சொல்லிணைப்பையும் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: δόξα என்பதற்குள்ள மகிமை, கனம், புகழ், அங்கீகாரம் ஆகிய பொருள் வாய்ப்புகளில் ஒன்றை மட்டும் குறுக்காமல், இரண்டு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி யோவான் நூலின் சொல்லியல் மற்றும் இறையியல் தொடர்பைக் காக்கிறது.
- source_word: τῶν ἀνθρώπων
  choice: மனிதர்களின்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்களின்’ என்பது அந்த உள்ளடக்கப் பொருளைத் துல்லியமாகத் தருவதோடு, உருபின் உடைமை/மூலாதார நெகிழ்வையும் ஓரளவு காக்கிறது.
- source_word: μᾶλλον ἤπερ
  choice: …விட …அதிகமாக
  rationale: இரண்டு பொருட்களுக்கு இடையிலான ஒப்பீட்டையும் முன்னுரிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘-யையே’ என்னும் வலியுறுத்தல் மனித மகிமைக்குக் கொடுக்கப்பட்ட முன்னுரிமையைத் தெளிவாக்குகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: இணையான கிரேக்க உருபமைப்பை ‘மனிதர்களின் / கடவுளின்’ எனக் காத்து, மகிமை கடவுளிடமிருந்து வருவதா அல்லது அவருக்குரியதா என்ற நுண்ணிய பொருள் நெகிழ்வைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: மனிதர்/கடவுள் என்ற எதிர்மறை இணைப்பில் δόξα என்பதன் பொருள்
  choice: மகிமை
  alternative: பாராட்டு; அங்கீகாரம்; கனம்
  rationale: ‘மகிமை’ என்பது யோவான் நூலின் விரிந்த இறையியல் சொல்லிணைப்பைக் காக்கிறது. ‘பாராட்டு’ அல்லது ‘அங்கீகாரம்’ இச்சூழலில் சாத்தியமான விளக்கங்கள் என்றாலும், அவை கிரேக்கச் சொல்லின் பொருளைச் சற்றுக் குறுக்குகின்றன.
- issue: τῶν ἀνθρώπων மற்றும் τοῦ θεοῦ ஆகியவற்றின் உருபுப் பொருள்
  choice: மனிதர்களின் மகிமை / கடவுளின் மகிமை
  alternative: மனிதர்களிடமிருந்து வரும் மகிமை / கடவுளிடமிருந்து வரும் மகிமை
  rationale: மூலத்தில் இரண்டும் ஒரே வகை உருபமைப்பில் உள்ளன; தமிழிலும் இணை அமைப்பைக் காப்பது, அது ‘அவர்களுக்குரிய மகிமை’ என்பதா அல்லது ‘அவர்களிடமிருந்து வரும் கனம்/அங்கீகாரம்’ என்பதா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதர்கள்’ என்பது பாலினம் சாராத பொதுப்பொருளைத் தெளிவாகக் காட்டுகிறது. மூலத்தின் காரணத் தொடர்பு, ஒப்பீட்டு வலியுறுத்தல், இருமுறை வரும் δόξα ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
