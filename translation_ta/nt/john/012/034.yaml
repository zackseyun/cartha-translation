id: JHN.12.34
reference: John 12:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: ta
  text: 'ஆகவே கூட்டத்தினர் அவருக்குப் பதிலளித்தார்கள்: “மேசியா[b] என்றென்றும் நிலைத்திருப்பார் என்று திருச்சட்டத்திலிருந்து நாங்கள் கேள்விப்பட்டிருக்கிறோம். அப்படியிருக்க, ‘மானிடமகன் உயர்த்தப்பட வேண்டும்[a]’ என்று நீர் எப்படிச் சொல்லலாம்? இந்த மானிடமகன் யார்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேன்மைப்படுத்தப்பட வேண்டும்.” யோவான் நற்செய்தியில் “உயர்த்தப்படுதல்” என்பது உடலளவில் மேலே உயர்த்தப்படுவதையும் மேன்மைப்படுத்தப்படுவதையும் ஒருசேர உணர்த்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “கிறிஸ்து”; இங்கு அது ஒரு பட்டமாக வருவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν
  choice: ஆகவே ... பதிலளித்தார்கள்
  rationale: οὖν என்பதன் தொடர்ச்சி அல்லது முடிவுறுத்தும் தொடர்பை ‘ஆகவே’ இயல்பாகக் காட்டுகிறது; ἀπεκρίθη என்பதற்கு ‘பதிலளித்தார்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: ὁ ὄχλος
  choice: கூட்டத்தினர்
  rationale: கூடியிருந்த மக்களைச் சுட்டும் ὄχλος என்பதற்கு இயல்பான, நடுநிலையான கூட்டுப்பெயர்.
- source_word: Ἡμεῖς ἠκούσαμεν
  choice: நாங்கள் கேள்விப்பட்டிருக்கிறோம்
  rationale: முன்பு பெற்ற போதனை இப்போதும் தொடர்புடையதாக இருப்பதைத் தமிழின் நிறைவுநிலை வினை இயல்பாக வெளிப்படுத்துகிறது; ἡμεῖς என்பதன் வெளிப்படையான வலியுறுத்தலும் ‘நாங்கள்’ மூலம் காக்கப்படுகிறது.
- source_word: ἐκ τοῦ νόμου
  choice: திருச்சட்டத்திலிருந்து
  rationale: νόμος இங்கு யூதர்களின் அதிகாரப்பூர்வ வேதச்சாட்சியைக் குறிக்கிறது. ‘திருச்சட்டம்’ அதன் சமயச் சூழலையும் ‘இலிருந்து’ கிரேக்க முன்னிடைச்சொல்லையும் காக்கிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: χριστός இங்கு தனிப்பெயராக அல்லாமல் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரின் பட்டமாகச் செயல்படுகிறது; ‘மேசியா’ யூத மெசியானியச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: என்றென்றும் நிலைத்திருப்பார்
  rationale: μένει என்பதன் தொடர்ச்சியையும் εἰς τὸν αἰῶνα என்பதன் நிலையான காலப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πῶς λέγεις σὺ
  choice: நீர் எப்படிச் சொல்லலாம்?
  rationale: இது வெறும் தகவல் கேள்வியல்ல, வியப்பும் எதிர்ப்பும் கலந்த சவால். ‘எப்படிச் சொல்லலாம்’ அந்தத் தொனியை வெளிப்படுத்துகிறது; மரியாதை ஒருமையான ‘நீர்’ இயேசுவை நேரடியாகச் சுட்டுகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: δεῖ குறிக்கும் அவசியத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑψωθῆναι
  choice: உயர்த்தப்பட
  rationale: சிலுவையில் உடலளவில் மேலே உயர்த்தப்படுதல் மற்றும் மேன்மைப்படுத்தப்படுதல் ஆகிய யோவானிய இரட்டைப் பொருளுக்கும் ‘உயர்த்தப்பட’ இடமளிக்கிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இது இயேசுவின் பட்டம்சார் சுயக்குறிப்பாகவும் தானியேல் நூலுடனான எதிரொலியுடனும் செயல்படுவதால், ஒரே சொல்லாக அமைந்த ‘மானிடமகன்’ அந்தப் பட்டத்தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் பட்டப்பொருள்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ‘மேசியா என்றென்றும் நிலைத்திருப்பார்’ என்பது யூதர்களின் எதிர்பார்ப்பிலுள்ள பட்டத்தைச் சுட்டுகிறது. ஆகவே அதன் எபிரேய-யூதச் சூழலை ‘மேசியா’ தெளிவாகப் பாதுகாக்கிறது.
- issue: யோவான் நற்செய்தியில் ὑψωθῆναι என்பதன் அடுக்குப் பொருள்
  choice: உயர்த்தப்பட
  alternative: மேன்மைப்படுத்தப்பட / மேலே தூக்கப்பட
  rationale: ஒரே பொருளை மட்டும் தீர்மானிக்காமல், சிலுவையில் உயர்த்தப்படுதலையும் மகிமையான மேன்மைப்படுத்துதலையும் தாங்கக்கூடிய சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்பதன் தன்மை
  choice: மானிடமகன்
  alternative: மனிதனின் மகன்
  rationale: சொற்சொல் விளக்கமாகக் கரைத்துவிடாமல், இயேசுவின் அடையாளப் பட்டமாகவும் வேதாகம எதிரொலியுடைய தொடராகவும் அதன் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ என்பது மரியாதை ஒருமையாகும். மூலத்தின் கேள்வித் தொனியும் யோவானிய இரட்டைப் பொருளும் விளக்கமாகத் தீர்த்துவிடப்படாமல் காக்கப்பட்டுள்ளன.
