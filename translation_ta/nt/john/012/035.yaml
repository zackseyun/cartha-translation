id: JHN.12.35
reference: John 12:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: ta
  text: ஆகவே இயேசு அவர்களிடம், “இன்னும் சிறிது காலம் ஒளி உங்களிடையே[a] இருக்கும். இருள் உங்களைப் பிடித்துவிடாதபடி, ஒளி உங்களிடம் இருக்கும்போதே நடங்கள். இருளில் நடப்பவர் தாம் எங்கே செல்கிறார் என்பதை அறியார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களுக்குள்” அல்லது “உங்களுடன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ள முடியும்; இங்கு இயேசு அவர்களிடையே வெளிப்படையாக இருந்த உடனடிச் சூழலுக்கு “உங்களிடையே” என்பது மிகப் பொருத்தமாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலுடன் இயேசுவின் பதிலை இயல்பாக இணைக்கிறது; கடுமையான காரணவியல் முடிவாக மாற்றவில்லை.
- source_word: Ἔτι μικρὸν χρόνον
  choice: இன்னும் சிறிது காலமே
  rationale: ἔτι என்பதன் ‘இன்னும்’ என்ற பொருளையும், மீதமுள்ள காலத்தின் குறுகிய தன்மையையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: யோவான் நற்செய்தியின் உருவக மற்றும் கிறிஸ்துவைச் சுட்டும் ஆழத்தை விளக்கவுரையால் மாற்றாமல், மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: இங்கு இயேசுவின் பொது முன்னிலை குறிக்கப்படுவது உடனடிச் சூழலுக்கு மிகப் பொருத்தம்; கிரேக்கத்தின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: περιπατεῖτε
  choice: நடங்கள்
  rationale: வாழ்க்கை நடத்தையை உணர்த்தும் வேதாகம உருவகத்தைத் தட்டையாக்காமல் பாதுகாக்கிறது.
- source_word: ὡς τὸ φῶς ἔχετε
  choice: ஒளி உங்களிடம் இருக்கும்போதே
  rationale: ὡς என்பதை இங்கு காலப்பொருளில் கொண்டு, அழைப்பின் அவசரத்தையும் ‘ஒளி இருக்கும் காலத்திலேயே’ என்ற கருத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ
  choice: …ஆதபடி
  rationale: எதிர்மறை நோக்கத்தைத் தெளிவான, நடப்பு தமிழில் தெரிவிக்கிறது.
- source_word: σκοτία
  choice: இருள்
  rationale: ஒளி–இருள் எதிர்மறையை நேரடியாகவும் இலக்கிய நயத்துடனும் பாதுகாக்கிறது.
- source_word: καταλάβῃ
  choice: பிடித்துக்கொள்ளாதபடி
  rationale: இருள் ஒருவரை எட்டிப் பிடித்து ஆட்கொள்ளும் இயக்கமுள்ள படிமத்தைப் பாதுகாக்கிறது; வெறும் ‘வெல்லுதல்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: ὁ περιπατῶν
  choice: நடக்கிறவர்
  rationale: பொதுவான ஒருமை நபரைக் குறிக்கும் கிரேக்கப் பெயரெச்ச அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: தாம் எங்கே போகிறார் என்பதை அறியார்
  rationale: செல்லும் திசையை அறியாமை என்ற நிகழ்காலக் கருத்தை மரியாதையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஒளி’ தொடர்பான ἐν ὑμῖν என்பதன் பொருள்
  choice: உங்களிடையே
  alternative: உங்களுக்குள்; உங்களுடன்
  rationale: உடனடி கதைச்சூழலில், உலகின் ஒளியாகிய இயேசு கூட்டத்தாரிடையே இன்னும் சிறிது காலம் வெளிப்படையாக இருப்பதை இது குறிக்கிறது. உள்ளார்ந்த வாசத்தை மொழிபெயர்ப்பிலேயே முன்கூட்டித் திணிக்காமல், கிரேக்கச் சொற்றொடரின் உண்மையான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒளி’, ‘இருள்’, ‘நடங்கள்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. ‘அறியார்’ மற்றும் ‘தாம்’ என்பவை பொதுவான ஒருமை நபரைக் குறிக்கும் மரியாதைமிக்க இலக்கியப் பயன்பாடுகள்.
