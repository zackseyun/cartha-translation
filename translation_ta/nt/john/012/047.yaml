revisions:
- from: யாராவது என் வார்த்தைகளைக் கேட்டும் அவற்றைக் கடைப்பிடிக்காவிட்டால், நான் அவரைத் தீர்ப்பிடுவதில்லை[a]. ஏனெனில், உலகைத் தீர்ப்பிடுவதற்காக நான் வரவில்லை; உலகைக் காப்பாற்றுவதற்காகவே வந்தேன்.
