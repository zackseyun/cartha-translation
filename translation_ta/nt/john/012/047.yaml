source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: ta
  text: யாராவது என் வார்த்தைகளைக் கேட்டு, அவற்றைக் கடைப்பிடிக்காவிட்டால், நான் அவரைத் தீர்ப்பிடுவதில்லை[a]. ஏனெனில், உலகைத் தீர்ப்பிடுவதற்காக நான் வரவில்லை; உலகைக் காப்பாற்றுவதற்காகவே வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவரைக் கண்டனம் செய்வதில்லை.” கிரேக்க வினைச்சொல் ‘தீர்ப்பிடு’ என்றும், சூழலுக்கேற்ப பாதகமான தீர்ப்பு அல்லது கண்டனம் வழங்கு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: யாராவது ... -ஆவிட்டால்
  rationale: பொதுவான, வரையறுக்கப்படாத நிபந்தனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; இது எந்த ஒருவருக்கும் பொருந்தும் என்ற திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἀκούσῃ
  choice: கேட்டும்
  rationale: அடிப்படைப் பொருளான ‘கேட்பது’ என்பதையே தருகிறது; கவனமாகச் செவிசாய்த்தல் அல்லது கீழ்ப்படிதல் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: τῶν ῥημάτων
  choice: என் வார்த்தைகளை
  rationale: இயேசு பேசிய சொற்களையும் உரைகளையும் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: φυλάξῃ
  choice: அவற்றைக் கடைப்பிடிக்காவிட்டால்
  rationale: φυλάσσω என்பதன் ‘காத்தல், பேணுதல், அனுசரித்தல்’ என்ற பொருள் வட்டத்தில், இச்சூழலில் இயேசுவின் வார்த்தைகளுக்கு உண்மையுடன் நடப்பதைக் குறிக்கிறது. ‘கீழ்ப்படியாவிட்டால்’ என்பதைவிடப் பரந்த நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: οὐ κρίνω αὐτόν
  choice: நான் அவரைத் தீர்ப்பிடுவதில்லை
  rationale: κρίνω என்பதை அடுத்த நோக்கவாக்கியத்திலும் ஒரேபோல் மொழிபெயர்த்து, ‘தீர்ப்பிடு’ என்ற அடிப்படைப் பொருளையும் யோவானின் தீர்ப்பு மொழியில் உள்ள இறையியல் இழுபறியையும் தக்கவைக்கிறது. αὐτόν என்பது முன் வரும் வரையறுக்கப்படாத நபரைக் குறிக்கிறது; தமிழில் ‘அவரை’ இயல்பாக எந்தப் பாலினத்தவருக்கும் பொருந்தும்.
- source_word: ἦλθον
  choice: நான் வரவில்லை ... வந்தேன்
  rationale: இயேசுவின் வருகையையும் பணியையும் தொகுத்துக் கூறும் இறந்தகாலத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα κρίνω
  choice: தீர்ப்பிடுவதற்காக
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது; முன்னர் வந்த κρίνω உடனான சொல் ஒற்றுமையையும் காக்கிறது.
- source_word: κόσμον
  choice: உலகை
  rationale: யோவானில் மனித உலகையும் அதன் நிலைமையையும் பரவலாகக் குறிக்கும் வழக்கமான சொல்; இங்கு பொருளை ‘மக்கள்’ என்று குறுக்கவில்லை.
- source_word: σώσω
  choice: காப்பாற்றுவதற்காகவே
  rationale: σῴζω என்பதன் மீட்பு சார்ந்த மையப் பொருளைத் தக்கவைக்கிறது; ‘-வே’ என்பது ‘அல்ல ... ஆனால்’ என்ற எதிர்மறை-நேர்மறை வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நான் அவரைத் தீர்ப்பிடுவதில்லை’ என்பதற்கும் யோவான் நூலின் பிற தீர்ப்பு மொழிக்கும் உள்ள தொடர்பு
  choice: κρίνω என்பதை இரு இடங்களிலும் ‘தீர்ப்பிடு’ என்று ஒரேபோல் மொழிபெயர்த்து, காலம் அல்லது பணிக்கட்டம் குறித்த விளக்கத்தை உரைக்குள் சேர்க்காமல் விடுதல்.
  alternative: ‘கண்டனம் செய்வதில்லை’ என்று மொழிபெயர்த்தல் அல்லது ‘இப்போது தீர்ப்பிடுவதில்லை’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: இந்த வசனம் இயேசுவின் வருகையின் நோக்கம் தீர்ப்பு அல்ல, இரட்சிப்பு என்று கூறுகிறது. ‘தீர்ப்பிடு’ என்பது அருகிலுள்ள யோவான் பகுதிகளோடு உள்ள உண்மையான இறையியல் இழுபறியைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயந்தீர்க்கிறதில்லை’ போன்ற பழைய திருச்சபை வழக்கைத் தவிர்த்து ‘தீர்ப்பிடுவதில்லை’ என வழங்கப்பட்டுள்ளது. மூலத்தில் ஒரே κρίνω வினை இருமுறை வருவதால், தமிழிலும் அதே சொல் இருமுறை தக்கவைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் உள்ளடக்கத்துடன் இடமாறியிருப்பதாகத் தோன்றுவதால், கிரேக்க மூலத்தோடு நேரடியாகப் பொருந்தும் ‘தீர்ப்பிடு/கண்டனம் செய்’ மாற்று மட்டும் [a] ஆகச் சரியான இடத்தில் தரப்பட்டுள்ளது.
