source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: ta
  text: 'ஆகவே இயேசு சொன்னார்: “அவளை விட்டுவிடுங்கள்; என் அடக்கத்தின் நாளுக்காக அவள் அதை வைத்திருக்கட்டும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அவளை விட்டுவிடுங்கள்; என் அடக்கத்தின் நாளுக்காக அவள் அதை வைத்திருந்தாள்.” அல்லது, “அவளை விட்டுவிடுங்கள்; என் அடக்கத்தின் நாள் வரை அவள் அதை வைத்திருக்கட்டும்.” கிரேக்க வாக்கிய அமைப்பை இவ்வாறும் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் யூதாஸ் கூறியதற்கான இயேசுவின் பதிலைத் தொடர்ச்சியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Ἄφες αὐτήν
  choice: அவளை விட்டுவிடுங்கள்
  rationale: அவளுடைய செயலில் குறுக்கிடுவதை நிறுத்தும்படி கூறும் கட்டளையின் சூழல்சார் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: —ட்டும்
  rationale: ἵνα உடன் வரும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழ் ஏவல் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν ἡμέραν
  choice: நாளுக்காக
  rationale: எதிர்நோக்கப்படும் குறிப்பிட்ட சந்தர்ப்பத்திற்கென வைத்திருத்தல் என்ற பொருளைத் தருகிறது; ‘நாள் வரை’ என்ற கால எல்லைப் பொருளை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: ἐνταφιασμοῦ
  choice: அடக்க
  rationale: இறந்தவரை அடக்கம் செய்வதைக் குறிக்கும் தெளிவான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: τηρήσῃ
  choice: வைத்திருக்கட்டும்
  rationale: ஒரு குறிப்பிட்ட நோக்கத்திற்காக ஒன்றை ஒதுக்கி வைத்திருத்தல் என்ற τηρέω-வின் பொருளையும் ἵνα உடனான வினை அமைப்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: αὐτό
  choice: அதை
  rationale: கிரேக்க மூலத்தின் சுட்டுப்பெயரைப் பாதுகாத்து, மூலத்தில் இல்லாத ‘நறுமணத் தைலம்’ என்ற பெயர்ச்சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவின் அடக்கத்துக்கும் மரியாளின் செயலுக்கும் உள்ள தொடர்பு
  choice: இயேசுவின் வரவிருக்கும் அடக்க நாளுக்காக அவள் அதை வைத்திருக்க அனுமதிக்க வேண்டும் என்ற முன்னோக்கிய நோக்கக் கூற்றாக மொழிபெயர்த்தல்.
  alternative: “என் அடக்க நாளுக்காக அவள் இதை வைத்திருந்தாள்” அல்லது “என் அடக்க நாள் வரை அவள் அதை வைத்திருக்கட்டும்” என்று புரிந்துகொள்ளலாம்.
  rationale: கிரேக்க வாக்கிய அமைப்பு கடினமானதும் ஒன்றுக்கு மேற்பட்ட பொருள் கொள்ளக்கூடியதும் ஆகும். முதன்மை உரை Ἄφες... ἵνα... τηρήσῃ என்பதன் நேரடியான நோக்க அமைப்பைப் பின்பற்றுகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாகப் புரியும், கண்ணியமான நடை. கிரேக்க மூலத்தில் உள்ள தொடரியல் தெளிவின்மையை முதன்மை உரையில் மிகையாக விளக்காமல், அடிக்குறிப்பில் உண்மையான மாற்றுப் புரிதல்களுடன் பாதுகாக்கிறது.
