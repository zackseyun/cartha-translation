  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: ta
  text: 'ஆனால் இயேசு உரக்கக் கூவிச் சொன்னார்: “என்னை நம்புகிறவர்[a], என்னை நம்புவதில்லை; ஆனால் என்னை அனுப்பியவரை நம்புகிறார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை நம்புகிற எவரும்.”
    reason: lexical_alternative
  - marker: b
    text: இது இயேசுவை நம்புவது மறுக்கப்படுகிறது என்பதல்ல; அவரை நம்புவது, அவரை அனுப்பிய தந்தையை நம்புவதிலிருந்து பிரிக்க முடியாதது என்பதை வெளிப்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: உரத்த குரலில் கூறினார்
  rationale: κράζω என்பதன் உரத்த, பொதுவான அறிவிப்பின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘கூறினார்’ என்பதைவிட மூலத்தின் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: Ὁ πιστεύων
  choice: நம்புகிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புச் சொல்லின் பொதுவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πιστεύων / πιστεύει
  choice: நம்புகிறவர் / நம்புகிறார்
  rationale: யோவானின் பயன்பாட்டில் πιστεύω εἰς குறிக்கும் ஒருவரை நோக்கிய நம்பிக்கையை ‘நம்பு’ இயல்பாகத் தருகிறது; ஒரே வேர்ச்சொல்லின் மீளுரைப்பையும் காக்கிறது.
- source_word: εἰς ἐμέ
  choice: என்னை
  rationale: தமிழில் ஒருவரை நம்புவதை ‘என்னை நம்பு’ என்று இயல்பாகச் சொல்வதால், கிரேக்க εἰς என்பதைக் கட்டாயமாகத் தனியே மொழிபெயர்க்காமல் அதன் உறவுப்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: என்னை அனுப்பியவரையே
  rationale: ἀλλά தரும் வலுவான எதிர்மறை மாறுபாட்டை ‘அல்ல ... அவரையே’ என்ற தமிழ் அமைப்பு வெளிப்படுத்துகிறது; மூலத்தைப் போல அனுப்பியவர் யார் என்பதை முதன்மை உரையில் நேரடியாக ‘தந்தை’ என்று குறிப்பிடவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலிலிருந்து வரும் மிதமான மாற்றத்தையும் எதிர்மறைத் தொடர்பையும் காட்டுகிறது.
theological_decisions:
- issue: ‘என்னை அல்ல, என்னை அனுப்பியவரையே நம்புகிறார்’ என்பது இயேசு நம்பிக்கைக்குரியவர் அல்ல என்று தவறாகப் புரிந்துகொள்ளப்படலாம்.
  choice: மூலத்தின் பதற்றமுள்ள சொற்றொடர் மாற்றமின்றி வைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
  alternative: ‘என்னை மட்டும் நம்பவில்லை’ என்று ‘மட்டும்’ சேர்த்தல், அல்லது முதன்மை உரையிலேயே ‘தந்தையை’ என்று குறிப்பிடுதல்.
  rationale: கிரேக்கத்தில் ‘மட்டும்’ இல்லை. அதைச் சேர்ப்பது உண்மையான இறையியல் பதற்றத்தை மொழிபெயர்ப்பிலேயே தீர்த்துவிடும். இங்கு இயேசுவை நம்புவதும் அவரை அனுப்பியவரை நம்புவதும் பிரிக்க முடியாதவை என்பதே கூற்றின் நோக்கம்; இயேசுவை நம்பிக்கையின் உரிய இலக்காக மறுப்பது அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உரத்த குரலில் கூறினார்’ என்பது இயல்பையும் மூலத்தின் பொது அறிவிப்பு வலிமையையும் சமநிலைப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய பதற்றமுள்ள கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
