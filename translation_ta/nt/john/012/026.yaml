id: JHN.12.26
reference: John 12:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: ta
  text: யாராவது எனக்குச் சேவை செய்தால்[a], அவர் என்னைப் பின்பற்றட்டும். நான் எங்கே இருக்கிறேனோ, அங்கே என் சேவகரும் இருப்பார். யாராவது எனக்குச் சேவை செய்தால், தந்தை அவரைக் கௌரவிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை இலக்கண அமைப்பு உள்ளது: “யாராவது எனக்குச் சேவை செய்தால் ... தந்தை அவரைக் கௌரவிப்பார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: சேவை செய்தால்
  rationale: இங்கு இயேசுவுக்குச் செய்யும் பொதுவான சேவையைக் குறிக்கிறது. ‘ஊழியம் செய்தால்’ என்பது திருச்சபைப் பதவி அல்லது சமயப் பணியின் குறுகிய பொருளைத் தரக்கூடும்.
- source_word: ἀκολουθείτω
  choice: பின்பற்றட்டும்
  rationale: கிரேக்க நிகழ்காலக் கட்டளையின் சீடத்துவ அழைப்பையும் கட்டளை வலிமையையும் இயல்பான தமிழில் காக்கிறது; தொடர்ச்சியைக் கட்டாயமாக வெளிப்படுத்தி மிகையாக விளக்கவில்லை.
- source_word: διάκονος
  choice: பணியாளர்
  rationale: இங்கு பிற்காலத் திருச்சபைப் பதவியான ‘உதவிக்காரர்’ அல்லது ‘டீக்கன்’ அல்ல, இயேசுவுக்குச் சேவை செய்பவரையே குறிக்கிறது. ‘பணியாளர்’ வினையுடன் உள்ள தொடர்பையும் பொதுவான பொருளையும் தக்கவைக்கிறது.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: நான் எங்கே இருக்கிறேனோ
  rationale: வெளிப்படையாக வரும் ἐγώ-வின் வலியுறுத்தலை இயல்பான தமிழ் வாக்கிய அமைப்பில் வைத்திருக்கிறது.
- source_word: ἐκεῖ καὶ
  choice: அங்கே ... உம்
  rationale: இடத்தைக் குறிக்கும் ‘அங்கே’ என்பதையும் சேர்க்கைப் பொருளுடைய καί-ஐ ‘உம்’ என்பதாலும் காக்கிறது.
- source_word: τιμήσει
  choice: கௌரவிப்பார்
  rationale: தந்தை அளிக்கும் மதிப்பையும் மரியாதையையும் குறிக்கும் எதிர்கால வாக்குறுதியைத் தெளிவாகக் கூறுகிறது; அதன் வடிவத்தை மேலும் வரையறுக்கவில்லை.
- source_word: ὁ πατήρ
  choice: தந்தை
  rationale: கிரேக்கத்தில் ‘என் தந்தை’ என்ற உடைமைச்சொல் இல்லை. ஆகவே இல்லாத உடைமைப் பொருளைச் சேர்க்காமல் யோவானின் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: τις
  choice: யாராவது
  rationale: பாலின வரம்பின்றி பொதுவாக ஒருவரைக் குறிக்கும் கிரேக்க நிபந்தனை அமைப்புக்கு இயல்பான நவீனத் தமிழ்.
- source_word: αὐτόν
  choice: அவரை
  rationale: முன்னர் வரும் ‘யாராவது’ என்பவரை ஒருமையில் மரியாதையுடனும் பாலினம் குறிப்பிடாமலும் இயல்பான தமிழில் சுட்டுகிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஒருமை ஆண்பால் இலக்கண அமைப்பு
  choice: ‘யாராவது’ என்றும், தொடர்ந்து ‘அவர்/அவரை’ என்றும் மொழிபெயர்த்தல்
  alternative: ஆண் பாலைக் குறிப்பாக வெளிப்படுத்தும் ‘அவன்/அவனை’ அல்லது பன்மை வடிவைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை இலக்கண ஒத்திசைவு இருந்தாலும் τις இங்கு பொதுப்பொருளுடையது. தமிழ் மரியாதை ஒருமையான ‘அவர்’ மூலத்தின் ஒருமையையும் பொதுப்பொருளையும் இயல்பாகக் காக்கிறது; இதை அடிக்குறிப்பு விளக்குகிறது.
- issue: சேவைக்குக் கிடைக்கும் தெய்வீக கௌரவத்தின் தன்மை
  choice: ‘தந்தை அவரைக் கௌரவிப்பார்’ என்று விரிவாக்கமின்றி கூறுதல்
  alternative: அதை பரலோக வெகுமதி அல்லது இறுதிக்கால மகிமைப்படுத்தல் என்று குறிப்பாக்குதல்
  rationale: வசனம் கௌரவத்தை வாக்களிக்கிறது; ஆனால் அதன் துல்லியமான வடிவத்தை இங்கே வரையறுக்கவில்லை. எனவே அதன் இறையியல் விரிவைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சேவை’, ‘பின்பற்றட்டும்’, ‘பணியாளர்’, ‘கௌரவிப்பார்’ ஆகியவை திருச்சபைப் பதவி சார்ந்த குறுகிய பொருள்களைத் தவிர்த்து மூலத்தின் உறவுசார் மற்றும் சீடத்துவப் பொருளை காக்கின்றன.
