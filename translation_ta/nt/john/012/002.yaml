  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பரிமாறிக்கொண்டிருந்தாள்’ என்பது தொடர்ச்சியான செயலைக் காட்டுகிறது; ‘பந்தியில் சாய்ந்திருந்தவர்கள்’ என்பது மூலத்தின் பண்பாட்டு விவரத்தை அழிக்காமல் தருகிறது.
