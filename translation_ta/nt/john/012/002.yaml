source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: ta
  text: ஆகவே, அங்கே அவர்கள் அவருக்காக ஒரு உணவைத் தயாரித்தார்கள். மார்த்தாள் பரிமாறிக்கொண்டிருந்தாள்; லாசரோ அவருடன் உணவுப் பந்தியில் சாய்ந்திருந்தவர்களில் ஒருவனாக இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அக்காலத்தில் உணவின்போது பந்தியைச் சுற்றிச் சாய்ந்திருந்து உண்பது வழக்கமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: ஏற்பாடு செய்தார்கள்
  rationale: δεῖπνον என்பதுடன் வரும் ποιέω, உணவைச் செய்தல் அல்லது ஏற்பாடு செய்தல் என்று பொருள்படும். விருந்தளித்தவர்கள் யார் என்பதை ஊகிக்காமல், இயல்பான தமிழில் செயலைத் தெரிவிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய சூழலிலிருந்து தொடரும் நிகழ்வையும் அதன் தொடர்பையும் குறிக்கும் இணைப்பைத் தக்கவைக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்காக
  rationale: இந்த வேற்றுமை வடிவம், இயேசுவுக்காக உணவு ஏற்பாடு செய்யப்பட்டதைக் குறிக்கிறது.
- source_word: δεῖπνον
  choice: ஓர் இரவு உணவு
  rationale: அன்றைய முக்கிய உணவை, பொதுவாக மாலை வேளையில் உண்ணப்பட்ட உணவை, இயல்பான நவீன தமிழில் குறிக்கிறது; ‘விருந்து’ என்பது அளவுக்கு மீறிய பெருமையை உணர்த்தக்கூடும்.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட பெத்தானியாவைக் குறிக்கும் இடவினையடை.
- source_word: διηκόνει
  choice: பரிமாறிக்கொண்டிருந்தாள்
  rationale: முற்றுப்பெறாமல் நடந்துகொண்டிருந்த செயலைக் காட்டும் இறந்தகால வடிவத்தின் தொடர்ச்சித் தன்மையை வெளிப்படுத்துகிறது; இங்கு உணவு பரிமாறுவதே பொருள்.
- source_word: δὲ
  choice: -வோ
  rationale: மார்த்தாளின் பரிமாறும் செயலுக்கும் லாசருவின் பந்தியிருப்புக்கும் இடையிலான மென்மையான வேறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἷς ἦν ἐκ
  choice: ஒருவனாக இருந்தான்
  rationale: லாசரு அந்தக் குழுவில் ஒருவன் என்பதை மூலத்தின் அமைப்புக்கு நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: ἀνακειμένων
  choice: பந்தியில் சாய்ந்திருந்தவர்களில்
  rationale: உணவின்போது சாய்ந்து அமர்ந்திருந்த அக்கால வழக்கத்தைப் பாதுகாக்கிறது. ‘பந்தியில்’ என்பது உணவு மேசைச் சூழலை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: σὺν αὐτῷ
  choice: அவருடன்
  rationale: இயேசுவுடனான உடனிருப்பை நேரடியாகக் குறிக்கிறது.
