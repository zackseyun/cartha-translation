  source_fidelity: ‘ஓர் இரவு உணவு’ என்பது δεῖπνον-ஐ விடக் குறிப்பானது; இவ்வசனம் உணவு மாலை/இரவில் நடந்தது என்று நேரடியாகக் கூறவில்லை. ‘உணவு’ அல்லது ‘விருந்துணவு’ என்பதே மூலத்தின் பரப்பைச் சரியாகக் காக்கும். மற்ற முக்கிய கூறுகள்—οὖν-இன் தொடர்ச்சி, மார்த்தாளின் தொடர்ச்சியான பரிமாறுதல், லாசரு இயேசுவுடன் சாய்ந்திருந்து உண்பவர்களில் ஒருவன்—நன்றாக வெளிப்படுகின்றன.
  naturalness: வரைவு பொதுவாக இயல்பானது. இருப்பினும் ‘பந்தியில் சாய்ந்திருந்தவர்கள்’ என்பதை ‘உணவுப் பந்தியில் சாய்ந்திருந்தவர்கள்’ எனச் சொல்வது காட்சியையும் தொடர்பையும் தெளிவாக்கும். ‘தயாரித்தார்கள்’ இங்கு ‘ஏற்பாடு செய்தார்கள்’ என்பதைக் காட்டிலும் ποιέω + δεῖπνον-க்கு நெருக்கமாகவும் எளிமையாகவும் உள்ளது.
  terminology: ‘மார்த்தாள்’, ‘லாசரு’, ‘அவருக்காக’, ‘பரிமாறிக்கொண்டிருந்தாள்’ ஆகியவை தகுந்தவை. ἀνάκειμαι என்பதற்கான ‘சாய்ந்திருந்த’ என்ற பண்பாட்டு விவரம் பாதுகாக்கப்பட வேண்டும்; அதை வெறுமனே ‘உணவருந்திய’ என்று மாற்றக் கூடாது.
  issues:
