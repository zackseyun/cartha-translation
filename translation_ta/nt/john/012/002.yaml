  to: ஆகவே, அங்கே அவர்கள் அவருக்காக ஒரு உணவைத் தயாரித்தார்கள். மார்த்தாள் பரிமாறிக்கொண்டிருந்தாள்; லாசரோ அவருடன் உணவுப் பந்தியில் சாய்ந்திருந்தவர்களில் ஒருவனாக இருந்தான்.[a]
  rationale: ‘இரவு’ என்ற மூலத்தில் வெளிப்படையாக இல்லாத காலக் குறிப்பை நீக்கி, δεῖπνον-ன் பொருளைப் பரந்தவாறே வைத்துள்ளேன். ἀνακειμένων-ன் பண்பாட்டு அர்த்தத்தை உரையிலும் அடிக்குறிப்பிலும் பாதுகாத்து, தமிழில் உணவு நிகழ்வு தெளிவாகத் தெரிய ‘உணவுப் பந்தியில்’ என அமைத்துள்ளேன். எந்த விளக்கவியல் அல்லது பிரிவுசார் கருத்தும் சேர்க்கப்படவில்லை.
