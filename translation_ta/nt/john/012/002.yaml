    rationale: δεῖπνον பெரும்பாலும் நாளின் முக்கிய உணவைக் குறிக்கலாம்; ஆனால் இந்தச் சொல் மட்டுமே அது ‘இரவு’ உணவு எனக் கட்டாயப்படுத்தாது. தமிழில் ‘ஒரு உணவு’ எனக் கூறுவது தேவையற்ற காலக் குறிப்பைத் தவிர்க்கிறது.
