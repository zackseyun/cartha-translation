  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: இயேசுவின் பதில், நிறைவுபெற்ற ‘வந்துவிட்டது,’ யோவானிய ‘வேளை,’ செயலற்ற ‘மகிமைப்படுத்தப்படுதல்,’ மற்றும் பட்டப்பெயர் ஆகியவை காக்கப்பட்டுள்ளன. இருப்பினும், நேரடி உரையுடன் ‘மறுமொழியாக’ என்பதைக் கூட்டியிருப்பது சற்றுக் கனமாக உள்ளது; ‘பதிலளித்துச் சொன்னார்’ என்பது ἀποκρίνεται αὐτοῖς λέγων என்பதற்கு இயல்பாகவும் முழுமையாகவும் அமையும்.'
  naturalness: ‘இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான கதைநடையாகும். பட்டப்பெயருக்கான அடிக்குறி அந்தப் பட்டப்பெயருக்குப் பிறகே வர வேண்டும்; வாக்கிய முடிவில் இருப்பது தவறான இணைப்பை உருவாக்குகிறது.
  terminology: ‘மனிதகுமாரன்,’ ‘மகிமைப்படுத்தப்படுதல்,’ ‘வேளை’ ஆகியவை நிலையான மற்றும் பொருத்தமான தேர்வுகள். அடிக்குறிப்பு a-இல் ‘பாடும்’ என்பது பொருளிலும் இலக்கணத்திலும் பொருந்தாது; ‘பாடும் மகிமையும்’ என்பதற்குப் பதில் ‘பாடும் மகிமையும்’ அல்ல, ‘பாடும்’ என்ற வினைச்சொல் தவிர்க்கப்பட்டு ‘பாடும்’ கருத்தை ‘பாடு மற்றும் மகிமை’ எனத் தர வேண்டும். மேலும் ‘மனிதகுமாரன் என்ற கிரேக்கப் பட்டப்பெயர்’ என்பது துல்லியமற்றது; மனிதகுமாரன் என்பது தமிழ் வடிவம், கிரேக்கச் சொல் அல்ல.
