source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “மனிதகுமாரன்[b] மகிமைப்படுத்தப்படுவதற்கான வேளை[a] வந்துவிட்டது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேரம்.” கிரேக்கத்தில் “வேளை” என்று உள்ளது; யோவான் நற்செய்தியில் இது இயேசுவின் பாடு மற்றும் மகிமையோடு தொடர்புடைய, அவருக்காக நியமிக்கப்பட்ட தீர்மானமான நேரத்தைக் குறிக்கும் தொடர்ச்சியான சொல்.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கிரேக்கப் பட்டப்பெயரை “மனித மகன்” அல்லது “மனிதரானவர்” என்றும் மொழிபெயர்க்கலாம். தானியேல் 7-ஐ எதிரொலிக்கும் அதன் இறையியல் மற்றும் இடைநூல் வலிமையைத் தக்கவைக்க இங்கே பாரம்பரியப் பட்டப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: அவர்களிடம் மறுமொழியாக ... என்றார்
  rationale: கிரேக்கத்தில் உள்ள நிகழ்கால வினையும் தொடர்ந்து வரும் ‘சொல்லி’ என்ற பங்கேற்புவினையும், தமிழ் கதைநடைக்கு இயல்பாக ஒரே இறந்தகால உரையறிவிப்பு அமைப்பில் தரப்பட்டுள்ளன; αὐτοῖς என்பதன் ‘அவர்களிடம்’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: Ἐλήλυθεν
  choice: வந்துவிட்டது
  rationale: முற்றுப்பெற்ற கிரேக்க வினை, வேளை வந்து இப்போது நிலவுகிறது என்ற விளைவுநிலையை உணர்த்துகிறது; ‘வந்துவிட்டது’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ ὥρα
  choice: வேளை
  rationale: ‘வேளை’ என்பது குறிப்பிட்ட, நியமிக்கப்பட்ட நேரத்தைச் சுட்டும் இயல்பான தமிழ் சொல்; யோவானில் மீண்டும் வரும் தீர்மானமான ‘வேளை’ என்ற கருத்தையும் தக்கவைக்கிறது.
- source_word: ἵνα δοξασθῇ
  choice: மகிமைப்படுத்தப்படுவதற்கான
  rationale: ἵνα இங்கு அந்த வேளையின் நோக்கம் அல்லது உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; இறைப்பாட்டு வினைமுறை மற்றும் δοξάζω என்பதன் செறிவான மகிமைச் சார்ந்த பொருள் இரண்டும் காக்கப்படுகின்றன.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இது இயேசுவின் நிலைபெற்ற பட்டப்பெயராகவும் தானியேல் 7-ஐ எதிரொலிப்பதாகவும் இருப்பதால், பொதுவான ‘மனிதர்’ என்ற விளக்கமாகச் சுருக்காமல் பாரம்பரியமான தமிழ்ச் சொல்லாக்கம் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனித மகன் / மனிதரானவர்
  rationale: இது வெறும் மனிதத்தன்மையைக் குறிக்கும் பொதுப்பெயர் அல்ல; கிறிஸ்துவியல் பட்டப்பெயராகவும் தானியேல் 7 சார்ந்த இடைநூல் எதிரொலியுடனும் செயல்படுகிறது. ‘மனிதகுமாரன்’ அந்தத் திறந்த இறையியல் வலிமையைத் தக்கவைக்கிறது.
- issue: Ἐλήλυθεν ἡ ὥρα என்பதன் காலவினைத் தன்மையும் யோவானிய கருத்தும்
  choice: வேளை வந்துவிட்டது
  alternative: நேரம் வந்தது / வேளை வந்திருக்கிறது
  rationale: கிரேக்க முற்றுவினை, தீர்மானமான வேளை வந்து தற்போது நிலவுகிறது என்பதை வலியுறுத்துகிறது. ‘வந்துவிட்டது’ அந்த விளைவுநிலையையும் இயேசுவின் பாடு மற்றும் மகிமையுடன் தொடர்புடைய யோவானிய ‘வேளை’ கருத்தையும் இயல்பாகத் தருகிறது.
- issue: δοξασθῇ என்ற இறைப்பாட்டு வினையின் இறையியல் செறிவு
  choice: மகிமைப்படுத்தப்படுவதற்கான
  alternative: மகிமை பெறுவதற்கான / மேன்மைப்படுத்தப்படுவதற்கான
  rationale: ‘மகிமைப்படுத்தப்படுதல்’ என்பது இயேசுவின் மரணம், உயிர்த்தெழுதல், உயர்த்தப்படுதல் ஆகியவற்றை உள்ளடக்கக்கூடிய யோவானிய பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது; செய்பவர் இங்கு வெளிப்படையாகக் குறிப்பிடப்படாததும் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘மறுமொழியாக ... என்றார்’ என்பது கிரேக்க அமைப்பைச் சொற்சொறாகப் பின்பற்றாமல் தமிழ் உரைநடைக்கு இயல்பாக்குகிறது. ‘வேளை’, ‘மனிதகுமாரன்’, ‘மகிமைப்படுத்தப்படுதல்’ ஆகிய முக்கிய யோவானிய சொற்கள் இறையியல் செறிவைத் தக்கவைக்கின்றன.
