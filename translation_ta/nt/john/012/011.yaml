source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: ta
  text: ஏனெனில், யூதர்களில் பலர்[a] லாசருவின் காரணமாக விலகிச் சென்றுகொண்டிருந்தார்கள்[b], இயேசுவை நம்பிக்கொண்டிருந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களில் பலர்.” யோவான் நூலில் “யூதர்கள்” என்பது சூழலைப் பொறுத்து யூதேயர்களையோ யூதத் தலைவர்களையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “போய்க்கொண்டிருந்தார்கள்” அல்லது “விட்டுப் போய்க்கொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். இச்சொல் தொடர்ந்து நிகழ்ந்த விலகுதலைக் காட்டுகிறது; இயேசுவை எதிர்த்த தலைவர்களின் நிலைப்பாட்டிலிருந்தோ செல்வாக்கிலிருந்தோ விலகியதைச் சூழல் உணர்த்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “இயேசுவின்மேல் நம்பிக்கை வைத்துக்கொண்டிருந்தார்கள்” அல்லது “இயேசுவை நம்பி இருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் லாசருவைக் கொல்லத் தலைமைக் குருக்கள் திட்டமிட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: யூதர்களில் பலர்
  rationale: முழுக் குழுவையும் அல்ல, அதிலுள்ள பலரைச் சுட்டும் பகுதிப்பொருள் கொண்ட கிரேக்கத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: δι’ αὐτὸν
  choice: லாசருவின் காரணமாக
  rationale: διά + குற்றுவேற்றுமை இங்கு காரணத்தைக் குறிக்கிறது. சூழலில் αὐτόν என்பது லாசருவையே சுட்டுவதால், தமிழில் சுட்டுப்பெயரால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑπῆγον
  choice: அவர்களைவிட்டு விலகிச் சென்று
  rationale: இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலை வெளிப்படுத்துகிறது. சூழலில் எதிர்த்த யூதத் தலைவர்களின் செல்வாக்கிலிருந்து விலகுவதை 'அவர்களைவிட்டு' தெளிவாக்குகிறது; முறையான மதமாற்றம் போன்ற மிகை விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: இயேசுவை நம்பிக்கொண்டிருந்தார்கள்
  rationale: இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையையும், இறந்தகாலத் தொடர்நிலையின் நீடித்த செயலையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: யோவான் நூலில் Ἰουδαίων என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று மொழிபெயர்க்கப்பட்டது; இங்கு யூத மக்களுள் ஒரு பகுதியைக் குறிக்கிறது.
  alternative: ‘யூதேயர்கள்’ அல்லது சூழலைப் பொறுத்து ‘யூதத் தலைவர்கள்’
  rationale: ‘யூதர்களில் பலர்’ என்ற அமைப்பு எல்லா யூதர்களையும் குற்றஞ்சாட்டாமல் ஒரு துணைக்குழுவையே குறிப்பிடுகிறது. புவியியல் பொருளான ‘யூதேயர்கள்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πιστεύω εἰς என்பதன் வலிமை
  choice: ‘இயேசுவை நம்பிக்கொண்டிருந்தார்கள்’
  alternative: ‘இயேசுவின்மேல் நம்பிக்கை வைத்துக்கொண்டிருந்தார்கள்’ அல்லது ‘இயேசுவைச் சார்ந்துகொண்டிருந்தார்கள்’
  rationale: இயேசுவை நோக்கிய நம்பிக்கையை வசனம் கூறுகிறது; ‘சீடர்களானார்கள்’ அல்லது ‘இரட்சிக்கப்பட்டார்கள்’ போன்ற வசனத்தில் நேரடியாக இல்லாத இறையியல் முடிவுகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களைவிட்டு’ என்பது முந்தைய வசனத்திலுள்ள தலைமைக் குருக்களைச் சுட்டுகிறது; ‘லாசருவின் காரணமாக’ என்பது கிரேக்கச் சுட்டுப்பெயரின் சூழல்சார் முன்னிலையைத் தெளிவாக்குகிறது.
