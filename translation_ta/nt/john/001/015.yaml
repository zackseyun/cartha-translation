  to: '(யோவான் அவரைக் குறித்து சாட்சி அளிக்கிறார்; அவர் உரக்கக் கூவியிருக்கிறார்: “இவரைக் குறித்துத்தான் நான், ‘எனக்குப் பின்னால் வருகிறவர் எனக்கு முன்பானவராகியிருக்கிறார்[a]; ஏனெனில் அவர் எனக்கு முன்னரே இருந்தார்[b]’ என்று கூறினேன்.”)'
  rationale: 'The revision makes only safe, source-driven adjustments: it restores the cry-out force of κέκραγεν and smooths the Tamil quotation frame. The intentionally open renderings of ἔμπροσθέν μου γέγονεν and πρῶτός μου ἦν are retained, with footnotes preserving legitimate alternatives. Footnote markers remain attached to the relevant phrases.'
