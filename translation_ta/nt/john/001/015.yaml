source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: ta
  text: '(யோவான் அவரைக் குறித்து சாட்சி அளிக்கிறார்; அவர் உரக்கக் கூவியிருக்கிறார்: “இவரைக் குறித்துத்தான் நான், ‘எனக்குப் பின்னால் வருகிறவர் எனக்கு முன்பானவராகியிருக்கிறார்[a]; ஏனெனில் அவர் எனக்கு முன்னரே இருந்தார்[b]’ என்று கூறினேன்.”)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைவிட முன்னிடம் பெற்றிருக்கிறார்” / “என்னைவிட மேலானவராகியிருக்கிறார்.” கிரேக்கச் சொற்றொடர் வரிசையில் முந்துவதையும், நிலையில் அல்லது தரத்தில் மேலாக இருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் எனக்கு முன்பே இருந்தார்.” முதன்மை உரை கிரேக்கச் சொல்லமைப்புக்கு நெருக்கமாக இருந்து, சூழலில் முன் இருப்பு என்ற பொருளுக்கும் இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: சாட்சி அளிக்கிறார்
  rationale: நிகழ்காலத்தின் தொடரும் அல்லது காட்சிப்படுத்தும் தன்மையையும், சாட்சியளித்தல் என்ற சட்டவியல் நுணுக்கத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைக் குறித்து
  rationale: περί + மரபுவேற்றுமையின் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: κέκραγεν
  choice: உரத்த குரலில் அறிவித்திருக்கிறார்
  rationale: கூவி அறிவித்தல் என்ற வலிமையையும், கிரேக்க நிறைவுக்காலத்தின் முடிந்தும் விளைவு நீடிக்கும் நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: λέγων
  choice: 'அறிவித்திருக்கிறார்:'
  rationale: தமிழில் இயல்பாக அமைய, முதன்மை வினையோடு இணைக்கப்பட்டுள்ளது; தொடர்ந்து வரும் நேரடி கூற்றைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: இவரைக் குறித்தே நான் ... என்று சொன்னேன்
  rationale: இறந்தகாலக் குறிப்பைத் தக்கவைத்து, தமிழில் இயல்பில்லாத சொற்சொல் சார்ந்த உறவுப்பெயர் அமைப்பைத் தவிர்க்கிறது; ‘இவரைக் குறித்தே’ என்பதில் வலியுறுத்தல் காக்கப்படுகிறது.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: எனக்குப் பின்னால் வருகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பையும், காலவரிசை அல்லது ஊழிய வரிசை ஆகிய இரண்டுக்கும் இடமளிக்கும் ‘பின்னால்’ என்பதையும் காக்கிறது.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: எனக்கு முன்பானவராகியிருக்கிறார்
  rationale: γίνομαι என்பதன் நிறைவுக்காலத்தையும் ἔμπροσθεν என்பதன் ‘முன்’ உருவகத்தையும் காக்கிறது; ‘என்னைவிட உயர்ந்தவர்’ என்று ஒரே பொருளில் முடிவுசெய்யவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: πρῶτός μου ἦν
  choice: அவர் எனக்கு முன்னரே இருந்தார்
  rationale: முன்னுரிமை மற்றும் முன் இருப்பு ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது; ‘இருந்தார்’ என்பது மூலத்தின் ἦν-ஐ நேரடியாகக் காக்கிறது, ‘முன்னரே’ கால முன்னுரிமையை இயல்பான தமிழில் உணர்த்துகிறது.
theological_decisions:
- issue: இறுதிக் கூற்றை கிறிஸ்துவின் முன் இருப்போடு எவ்வளவு வெளிப்படையாக இணைப்பது
  choice: ‘அவர் எனக்கு முன்னரே இருந்தார்’ என்று மொழிபெயர்த்து, ‘அவர் எனக்கு முன்பே வாழ்ந்து கொண்டிருந்தார்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்த்தல்.
  alternative: ‘அவர் எனக்கு முன்பே இருந்துவந்தார்’ அல்லது ‘அவர் என்னைவிட முன்னதாகவே இருந்தார்.’
  rationale: சூழல் கிறிஸ்துவின் முன் இருப்பையும் மேன்மையையும் வலுவாக உணர்த்தினாலும், கிரேக்கச் சொல்லமைப்பில் உள்ள முன்னுரிமை/முன் இருப்பு சார்ந்த இறுக்கத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக்கூடாது.
- issue: ἔμπροσθέν μου γέγονεν என்பதில் வரிசையா, நிலையா, மேன்மையா என்பதைக் குறிப்பிடுவது
  choice: ‘எனக்கு முன்பானவராகியிருக்கிறார்’ என்று உருவகத்தைத் தக்கவைத்தல்.
  alternative: ‘என்னைவிட முன்னிடம் பெற்றிருக்கிறார்’ அல்லது ‘என்னைவிட உயர்ந்தவராகியிருக்கிறார்.’
  rationale: மாற்று மொழிபெயர்ப்புகள் தரம் அல்லது முன்னுரிமையைத் தெளிவாக்கினாலும், மூலத்தில் உள்ள இட/வரிசை உருவகத்தையும் அதன் உண்மையான பல்பொருள் வாய்ப்பையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் அடைப்புக்குறிகள் மூலப் பதிப்பில் உள்ளதுபோலத் தக்கவைக்கப்பட்டுள்ளன. ‘சாட்சி அளிக்கிறார்’, ‘அறிவித்திருக்கிறார்’ ஆகியவை யோவான் நற்செய்தியின் சாட்சிய மொழியையும் நிறைவுக்கால நுணுக்கத்தையும் காக்கின்றன; ‘முன்பானவராகியிருக்கிறார்’ என்பது சிறிது உயர்ந்த நடையாயினும் மூலத்தின் திட்டமிட்ட இரட்டைப் பொருளை பாதுகாக்கிறது.
