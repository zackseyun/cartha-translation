  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: ta
  text: அவர் அந்த ஒளி அல்ல; மாறாக, அந்த ஒளியைக் குறித்து சாட்சி சொல்லவே வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லாக: ‘அவர் அந்த ஒளி அல்ல; மாறாக, அந்த ஒளியைக் குறித்து சாட்சி சொல்லும்படியாக [வந்தார்].’ இரண்டாம் கூறில் வேண்டிய வினைச்சொல்லை கிரேக்க மொழி சூழலிலிருந்து புரிந்துகொள்ளும்படி விட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: அல்ல
  rationale: εἰμί என்பதன் மறுப்புடன் கூடிய இறந்தகால வடிவம் இங்கு யோவானின் அடையாளத்தை மறுக்கிறது. தமிழில் அடையாளப் பயனிலையில் காலத்தை வெளிப்படையாகக் குறிக்காத ‘அல்ல’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: சுட்டுப்பெயர் வடிவமானாலும், இங்கு முன்னர் குறிப்பிடப்பட்ட யோவானைக் குறிக்கும் வலியுறுத்தப்பட்ட தனிப்பட்ட சுட்டாக உள்ளது. ‘அவர்’ நவீனத் தமிழில் இயல்பும் கண்ணியமும் உடையது.
- source_word: τὸ φῶς
  choice: அந்த ஒளி
  rationale: குறிப்பிட்ட, முன்னுரையில் அறிமுகப்படுத்தப்பட்ட ஒளியைக் குறிக்கும் definite article-ன் சுட்டுத்தன்மையை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: ἀλλ’ ἵνα
  choice: சாட்சி சொல்லவே வந்தார்
  rationale: ἀλλά என்பதற்குப் பின் வினைச்சொல் விடுபட்டு, ἵνα நோக்கத்தைத் தெரிவிக்கிறது. முந்தைய வசனச் சூழலிலிருந்து ‘வந்தார்’ என்பதை நிரப்பி, நோக்கத்தை ‘-வே’ மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μαρτυρήσῃ
  choice: சாட்சி சொல்ல
  rationale: μαρτυρέω என்பதன் சாட்சியமளிக்கும் பொருளையும் யோவான் நற்செய்தியில் அதன் தொடர்ச்சியான பயன்பாட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: περὶ τοῦ φωτός
  choice: அந்த ஒளியைக் குறித்து
  rationale: περί + genitive என்பதன் ‘குறித்து’ என்ற பொருளை நவீன, கண்ணியமான தமிழில் நேராக வழங்குகிறது.
theological_decisions:
- issue: ஒளிக்கும் யோவானுக்கும் இடையிலான அடையாளமும் பங்கும்
  choice: யோவான் அந்த ஒளி அல்ல என்று மறுத்து, அந்த ஒளியைக் குறித்து சாட்சி சொல்வதே அவர் வந்த நோக்கம் என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் அந்த ஒளி அல்ல; மாறாக, அந்த ஒளியைக் குறித்து சாட்சி சொல்லும்படியாக [வந்தார்]’ என்று கிரேக்கத்தின் சொல்லமைப்பை இன்னும் நெருக்கமாகப் பின்பற்றலாம்.
  rationale: சாட்சிக்கும் ஒளிக்கும் இடையிலான வேறுபாட்டைப் பாதுகாக்கிறது; அதற்கு மேற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை. ‘வந்தார்’ என்பது சூழலிலிருந்து நிரப்பப்பட்ட வினை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சாட்சியளிக்க’ என்பதைக் காட்டிலும் ‘சாட்சி சொல்ல’ இயல்பானதாகத் தேர்ந்தெடுக்கப்பட்டது; ‘அந்த ஒளி’ குறிப்பிட்ட ஒளியைக் குறிக்கும் சுட்டுத்தன்மையைப் பாதுகாக்கிறது.
