id: JHN.1.2
reference: John 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: ta
  text: அவரே தொடக்கத்தில் கடவுளோடு இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவரே தொடக்கத்தில் கடவுளோடு இருந்தார்.”
    reason: οὗτος என்பதன் நேரடியான சுட்டுப்பெயர்ப் பொருளை மாற்று மொழிபெயர்ப்பாகக் காட்டுகிறது.
lexical_decisions:
- source_word: οὗτος
  choice: அவரே
  rationale: இது முந்தைய வசனத்திலுள்ள λόγος (‘வார்த்தை’) என்பவரைச் சுட்டுகிறது. தமிழில் ‘அவர்’ என்பது இயல்பான தனிப்பட்ட சுட்டுப்பெயர்; ‘-ஏ’ முந்தைய கூற்றை மீண்டும் வலியுறுத்தும் οὗτος என்பதன் சுட்டும் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: εἰμί என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம் இங்கு நிலைத்திருந்த நிலையைக் குறிக்கிறது. ‘இருந்தார்’ இயல்பான தமிழாகவும் தனிப்பட்ட குறிப்புக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἐν ἀρχῇ
  choice: தொடக்கத்தில்
  rationale: இச்சொற்றொடர் யோவான் 1:1-ஐ மீண்டும் எடுத்துரைப்பதோடு ஆதியாகமம் 1:1-ன் எதிரொலியையும் காக்கிறது. ‘தொடக்கத்தில்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: πρὸς
  choice: -ஓடு
  rationale: πρός இங்கு அருகிருப்பையும் உறவுநிலையையும் வேறுபாட்டையும் குறிக்கிறது. ‘கடவுளோடு’ என்பது இவற்றை மிகையாக விளக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸν θεόν
  choice: கடவுள்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு முன் உருபு இருந்தாலும், தமிழில் இங்கு தனி உறுதிப்படுத்தும் உருபு தேவையில்லை. ‘கடவுள்’ குறிப்பிட்ட இறை referent-ஐ இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: யோவான் 1:1-இன் λόγος என்பவருடன் οὗτος கொண்டுள்ள குறிப்பு
  choice: ‘அவரே’ என்று தனிப்பட்ட முறையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இவரே’ அல்லது ‘இந்த ஒருவரே’
  rationale: οὗτος முந்தைய வசனத்திலுள்ள வார்த்தையையே மீண்டும் சுட்டுகிறது. ‘அவரே’ என்பது தமிழில் இயல்பாக இருந்து, மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டுச் சொல்லாடலைச் சேர்க்காமல் அந்தத் தனிப்பட்ட குறிப்பையும் வலியுறுத்தலையும் காக்கிறது.
- issue: πρὸς τὸν θεόν என்பதன் உறவுநிலைப் பொருள்
  choice: ‘கடவுளோடு’
  alternative: ‘கடவுளை நோக்கி’ அல்லது ‘கடவுளின் முன்னிலையில்’
  rationale: இச்சொற்றொடர் வார்த்தைக்கும் கடவுளுக்கும் இடையிலான உறவையும் வேறுபாட்டையும் குறிக்கிறது. ‘கடவுளோடு’ என்பது அந்த இறையியல் அழுத்தத்தை அளவுக்கு மீறி வரையறுக்காமல் இயல்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. முந்தைய வசனத்துடனான தொடர்ச்சியை ‘அவரே’ வலியுறுத்துகிறது; ‘கடவுளோடு’ என்பது உறவையும் வேறுபாட்டையும் இயல்பாகக் காக்கிறது.
