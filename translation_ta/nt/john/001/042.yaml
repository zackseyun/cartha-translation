  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: ta
  text: அவன் அவரை இயேசுவிடம் அழைத்து வந்தான். இயேசு அவரை உற்றுப் பார்த்து, “நீ யோவானின்[a] மகன் சீமோன்; நீ கேபா[b] என்று அழைக்கப்படுவாய்” (அதன் மொழிபெயர்ப்பு பேதுரு) என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘யோவான்’ என்பதற்குப் பதிலாக ‘யோனா’ என்று உள்ளது; SBLGNT உரையில் ‘யோவான்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘கேபா’ என்பது ‘பேதுரு’ என்பதற்கு இணையான செமித்தியப் பெயர்; இரண்டிற்கும் ‘பாறை’ அல்லது ‘கல்’ என்ற பொருள் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: அவன் அவரை இயேசுவிடம் அழைத்து வந்தான்
  rationale: ἄγω என்பதன் இறந்தகால வடிவம் இங்கு ஒருவரை இன்னொருவரிடம் கொண்டு வருவதைக் குறிக்கிறது. ‘அழைத்து வந்தான்’ என்பது நிறைவுற்ற செயலையும் இயல்பான தமிழ்நடையையும் வெளிப்படுத்துகிறது.
- source_word: ἐμβλέψας αὐτῷ
  choice: அவரை உற்றுப் பார்த்து
  rationale: ἐμβλέπω சாதாரணமாகப் பார்ப்பதைவிட கவனமாக அல்லது ஆழ்ந்து பார்ப்பதைக் குறிக்கக்கூடும்; ‘உற்றுப் பார்த்து’ அந்த நுட்பத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: நீ யோவானின் மகன் சீமோன்
  rationale: மூலத்தின் நேரடியான அடையாளப்படுத்தும் கூற்றைப் பாதுகாக்கிறது. SBLGNT-இன் Ἰωάννου என்ற வாசகத்தின்படி ‘யோவான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: நீ கேபா என்று அழைக்கப்படுவாய்
  rationale: κληθήσῃ என்பதன் எதிர்காலச் செயப்பாட்டு பொருளையும், Κηφᾶς ஒரு தனிப்பெயராக இருப்பதையும் நேரடியாகக் காக்கிறது.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: கேபா என்பது பேதுரு என்று மொழிபெயர்க்கப்படுகிறது
  rationale: கிரேக்க உரையே செமித்தியப் பெயரான கேபாவுக்கு Πέτρος என்ற கிரேக்கப் பெயரை விளக்கமாகத் தருகிறது. இரண்டையும் தமிழில் வழக்கமான தனிப்பெயர்களாக ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: Κηφᾶς/Πέτρος என்ற பெயர்களின் விளக்கத்தை எவ்வாறு வழங்குவது
  choice: முதன்மை உரையில் ‘கேபா’ மற்றும் ‘பேதுரு’ ஆகிய இரண்டையும் தனிப்பெயர்களாக வைத்தல்
  alternative: இரண்டின் பொருளையும் ‘பாறை’ அல்லது ‘கல்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இந்த வசனத்தில் புதிய பெயர் சூட்டப்படுவதே முன்னிலையில் உள்ளது. பெயர்களை பெயர்களாகப் பாதுகாப்பது மூலத்தின் அமைப்பைக் காக்கிறது; அவற்றின் சொற்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது. இதனால் பிற்கால இறையியல் முடிவுகள் உரைக்குள் புகுத்தப்படுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. இயேசுவைக் குறிக்கும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், மூலத்தின் நேரடித் தன்மையைப் பாதுகாக்க மேற்கோளில் ‘நீ’ வைக்கப்பட்டுள்ளது. அடிக்குறி [a] உரைவேறுபாடு உள்ள ‘யோவான்’ என்பதன் அருகிலும், [b] பெயரின் சொற்பொருளை விளக்கும் ‘கேபா’ என்பதன் அருகிலும் வைக்கப்பட்டுள்ளன.
