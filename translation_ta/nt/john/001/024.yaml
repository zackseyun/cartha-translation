  text: And they had been sent from the Pharisees[a].
translation:
  language: ta
  text: மேலும், அவர்கள் பரிசேயர்களிடமிருந்து அனுப்பப்பட்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் பரிசேயர்களால் அனுப்பப்பட்டிருந்தார்கள்.” கிரேக்கத்தில் இன்னும் நேரடியாக, அவர்கள் பரிசேயர்களிடமிருந்து வந்தவர்கள் எனக் கூறப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இவ்வசனம் முந்தைய உரையோட்டத்துடன் இணைந்திருப்பதைத் தமிழின் தொடரமைப்பே இயல்பாக உணர்த்துகிறது; ‘மேலும்’ என்று சேர்ப்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: அனுப்பப்பட்டவர்களாக அவர்கள் இருந்தார்கள்
  rationale: நிறைவு வினையெச்சத்துடன் ἦσαν வரும் சுற்றுவழிக் கட்டமைப்பு, முன்பு அனுப்பப்பட்டதன் விளைவாக அவர்கள் அந்த நிலையில் இருந்ததைச் சுட்டுகிறது. தமிழ் வடிவம் அந்த நிலைநிறைவு நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἐκ
  choice: இடமிருந்து
  rationale: ἐκ முதன்மையாக மூலம் அல்லது தோற்றத்தைச் சுட்டுகிறது. ‘ஆல்’ என்று மொழிபெயர்த்தால் நேரடி செயற்பாட்டை கிரேக்கம் கூறுவதைவிட வலுவாகக் காட்டிவிடும்.
- source_word: τῶν Φαρισαίων
  choice: பரிசேயர்கள்
  rationale: Φαρισαῖοι என்ற குழுப்பெயருக்கான வழக்கமான, தெளிவான தமிழ் வடிவம்.
theological_decisions:
- issue: அனுப்பப்பட்டவர்களுக்கும் பரிசேயர்களுக்கும் இடையிலான உறவு
  choice: அவர்கள் பரிசேயர்களிடமிருந்து அனுப்பப்பட்டவர்கள்; இது குழுவின் மூலம் அல்லது தோற்றத்தை முன்னிறுத்துகிறது.
  alternative: அவர்கள் பரிசேயர்களால் அனுப்பப்பட்டவர்கள்; இது பரிசேயர்களின் நேரடி செயற்பாட்டை முன்னிறுத்துகிறது.
  rationale: ἐκ + பிறப்புவேற்றுமை நேரடி செயற்பாட்டைவிட மூலம் அல்லது தோற்றத்தையே தெளிவாகக் குறிக்கிறது. ஆகவே பரிசேயர்களின் பங்கை அளவுக்கு மீறி உறுதிப்படுத்தாமல் மூலத்தின் நுணுக்கம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. மூலத்தின் சுற்றுவழி நிறைவு அமைப்பையும் ἐκ என்பதன் மூலத்தைக் குறிக்கும் நுணுக்கத்தையும் இயன்றவரை பாதுகாக்கிறது.
