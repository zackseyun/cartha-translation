revisions:
- from: மறுநாள் இயேசு தம்மிடம் வருவதை அவர் கண்டு, “இதோ, உலகத்தின் பாவத்தைப் போக்குகிற தேவ ஆட்டுக்குட்டி!” என்றார்.
  to: மறுநாள், இயேசு யோவானிடம் வருவதை அவர் கண்டு, “இதோ, உலகத்தின் பாவத்தைப் போக்குகிற தேவனுடைய ஆட்டுக்குட்டி!” என்றார்.
  rationale: The sole necessary change is to resolve the pronominal-reference problem by identifying John, the immediate discourse antecedent, as the person toward whom Jesus comes. ‘தேவனுடைய’ also states the Greek genitive explicitly. No footnotes are required.
  reviewer_model: gpt-5.6-terra
