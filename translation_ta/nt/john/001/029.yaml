id: JHN.1.29
reference: John 1:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ta
  text: மறுநாள், இயேசு யோவானிடம் வருவதை அவர் கண்டு, “இதோ, உலகத்தின் பாவத்தைப் போக்குகிற தேவனுடைய ஆட்டுக்குட்டி!” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: காலக் குறிப்பை இயல்பான, சுருக்கமான நவீனத் தமிழில் தருகிறது.
- source_word: βλέπει ... ἐρχόμενον πρὸς αὐτόν
  choice: தம்மிடம் வருவதை அவர் கண்டு
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடையில் தருகிறது; πρὸς αὐτόν என்பதன் திசையையும் காக்கிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கட்டளையின் வலிமையை dignified மற்றும் வழக்கமான வேதாகமத் தமிழில் காக்கிறது.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: தேவ ஆட்டுக்குட்டி
  rationale: ἀμνός என்பதன் பலியாட்டு உருவகத்தைத் தெளிவாகக் காக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: ὁ αἴρων
  choice: போக்குகிற
  rationale: αἴρω என்பதன் இச்சூழலுக்குரிய ‘அகற்றுதல்/நீக்குதல்’ பொருளை இயல்பாக வெளிப்படுத்துகிறது; செயல் தொடரும் தன்மையையும் நிகழ்கால வடிவம் காக்கிறது.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: உலகத்தின் பாவத்தை
  rationale: மூலத்தின் ஒருமை ‘பாவம்’ என்பதையும் κόσμος என்பதன் பரந்த பரப்பையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ‘தேவ ஆட்டுக்குட்டி’ என்ற கிறிஸ்துவியல் உருவகம்
  choice: உருவகத்தை விளக்காமல் அப்படியே வைத்தல்
  alternative: ‘தேவன் அளித்த பலியாட்டு’ என்று பொருளை விரித்தல்
  rationale: மூலவசனம் பலி, பஸ்கா, அல்லது பிற பின்னணிகளில் ஒன்றை வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை; எனவே அதன் செறிவும் திறந்த தன்மையும் காக்கப்படுகின்றன.
- issue: αἴρων என்பதன் பொருள்
  choice: ‘போக்குகிற’
  alternative: ‘சுமக்கிற’
  rationale: இரு பொருள்களும் வினையின் பரந்த பயன்பாட்டில் சாத்தியமானவை என்றாலும், இவ்வாக்கிய அமைப்பில் பாவத்தை அகற்றும் கருத்து நேரடியாகவும் இயல்பாகவும் உள்ளது; ‘சுமக்கிற’ எனத் தேர்வது குறிப்பிட்ட பரிகார விளக்கத்தை முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைக்காக இயேசுவைக் குறிக்கும் ‘தம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் சுருக்கமாகவும் உரத்த அறிவிப்பின் தாக்கத்துடனும் அமைக்கப்பட்டுள்ளது.
