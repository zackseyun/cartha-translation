  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: ta
  text: கடவுளிடமிருந்து அனுப்பப்பட்ட ஒரு மனிதர் இருந்தார்; அவருடைய பெயர் யோவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: வந்தார்
  rationale: இங்கு γίνομαι கதையில் ஒரு புதிய நபரின் வருகையை அறிமுகப்படுத்துகிறது. ‘வந்தார்’ என்பது ‘தோன்றினார்’ அல்லது ‘உருவாக்கப்பட்டார்’ என்று மிகையாகப் பொருள் கொள்ளாமல், இயல்பான தமிழில் அந்தக் கதைநடைச் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: இது யோவான் என்ற தனிப்பட்ட ஆண் நபரைக் குறிக்கிறது. மரியாதையும் இயல்பான நவீன தமிழ் நடையும் கருதி ‘மனிதர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπεσταλμένος
  choice: அனுப்பப்பட்ட
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சம் யோவான் அனுப்பப்பட்டவர் என்பதையும் அவருடைய பணியின் மூலத்தையும் காட்டுகிறது. ‘அனுப்பப்பட்ட’ செயப்பாட்டு வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: παρὰ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: γενική வேற்றுமையுடன் வரும் παρά இங்கு மூலம் அல்லது புறப்படும் இடத்தைக் குறிக்கிறது. ‘கடவுளிடமிருந்து’ என்பது செய்பவரை மட்டும் வலியுறுத்தும் ‘கடவுளால்’ என்பதைக் காட்டிலும் மூலத்தைக் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: அவருடைய பெயர் யோவான்
  rationale: கிரேக்க மொழியின் ‘அவருக்கு பெயர்—யோவான்’ என்ற அடையாளப்படுத்தும் சொற்றொடரை நவீன தமிழில் இயல்பாகவும் முழுமையாகவும் தருகிறது.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக நிலைபெற்றுள்ள பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யோவானுடைய பணியின் தன்மை
  choice: யோவான் கடவுளிடமிருந்து அனுப்பப்பட்டவராக முன்வைக்கப்படுகிறார்.
  alternative: யோவான் கடவுளால் அனுப்பப்பட்டார்.
  rationale: ἀπεσταλμένος என்பதோடு வரும் παρὰ θεοῦ தெய்வீக மூலத்தையும் பணியனுப்புதலையும் காட்டுகிறது. ‘கடவுளிடமிருந்து’ என்பது மூலத்தைக் காக்கிறது; இதற்கு அப்பால் குறிப்பிட்ட தீர்க்கதரிசனப் பதவி போன்ற பிற்கால இறையியல் கருத்துகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘ஒரு மனிதர் வந்தார்’ என்பது யோவானை புதிய கதைமாந்தராக அறிமுகப்படுத்துகிறது; ‘கடவுளிடமிருந்து அனுப்பப்பட்ட’ என்பது கிரேக்கத்தின் மூலத்தையும் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
