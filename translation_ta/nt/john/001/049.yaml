id: JHN.1.49
reference: John 1:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ta
  text: 'நாத்தானியேல் அவருக்குப் பதிலளித்தார்: “ரபி, நீரே தேவனுடைய மகன்; நீரே இஸ்ரவேலின் அரசர்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: உரையாடலில் வரும் ἀποκρίνομαι என்பதற்கான இயல்பான நவீனத் தமிழ் நடை; மரியாதை வினைமுற்றும் சூழலுக்கு ஏற்றது.
- source_word: Ῥαββί
  choice: ரபி
  rationale: முதலாம் நூற்றாண்டு யூதச் சூழலையும் நேரடி அழைப்புப் பட்டத்தின் தன்மையையும் காக்க, பொருள் மொழிபெயர்ப்பான ‘போதகரே’ என்பதற்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: கிரேக்கத்தின் வரையறுக்கப்பட்ட கிறிஸ்துவியல் பட்டத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது; ‘ஒரு மகன்’ என்று பலவீனப்படுத்தவில்லை.
- source_word: βασιλεὺς
  choice: அரசர்
  rationale: βασιλεύς என்பதன் நேரடியான அரசப் பட்டம்; நவீனத் தமிழில் கண்ணியமான வடிவம்.
- source_word: τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின்
  rationale: உரிமை வேற்றுமையைச் சுருக்கமான தமிழில் காத்து, ‘இஸ்ரவேலை ஆளுகிற’ என்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: நீரே … நீரே
  rationale: இருமுறை வரும் வெளிப்படையான σὺ-வின் வலியுறுத்தலையும் இணை அமைப்பையும் ‘நீரே’ என்ற மறுபதிப்பால் காக்கிறது.
- source_word: Ναθαναήλ
  choice: நாத்தானியேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: ‘தேவனுடைய மகன்’ என்ற நாத்தானியேலின் அறிக்கையின் கிறிஸ்துவியல் வலிமை
  choice: தேவனுடைய மகன்
  alternative: தேவனுடைய ஒரு மகன்
  rationale: ὁ υἱὸς τοῦ θεοῦ என்ற வரையறுக்கப்பட்ட பட்டத்தை பலவீனப்படுத்தாமலும் பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் அப்படியே காக்கிறது.
- issue: ‘இஸ்ரவேலின் அரசர்’ என்பதன் அரச-மேசியா சார்ந்த பொருள்
  choice: இஸ்ரவேலின் அரசர்
  alternative: இஸ்ரவேலை ஆளுகிற அரசர்
  rationale: மூலத்தின் பட்ட வடிவத்தையும் அதன் மேசியா சார்ந்த ஒலிப்பையும் காக்கிறது; ஆட்சி உறவை விளக்கமாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ். இயேசுவை நோக்கிய நேரடி உரையில் மரியாதை ஒருமை ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. எந்த அடிக்குறிப்பும் தேவையில்லை.
