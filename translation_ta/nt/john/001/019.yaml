source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: ta
  text: யூதர்கள்[a] எருசலேமிலிருந்து ஆசாரியர்களையும் லேவியர்களையும், “நீர் யார்?” என்று யோவானிடம் கேட்கும்படி அனுப்பியபோது, யோவான் அளித்த சாட்சி இதுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யூதத் தலைவர்கள்” அல்லது “யூதேயர்கள்.” யோவான் நற்செய்தியில் “யூதர்கள்” என்பது பல இடங்களில் யூத மக்கள் அனைவரையும் குறிக்காமல், குறிப்பாக யூதேய மத அதிகாரிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: சாட்சி
  rationale: சட்டம் மற்றும் சான்றுரைத்தல் சார்ந்த யோவான் நற்செய்தியின் கருத்தோட்டத்தைத் தக்கவைத்துக்கொள்ளும் இயல்பான தமிழ் சொல்.
- source_word: τοῦ Ἰωάννου
  choice: யோவான் அளித்த
  rationale: இந்தப் பிறப்புவேற்றுமை யோவானைப் பற்றிய சாட்சியைக் குறிக்காமல், யோவான் அளித்த சாட்சியைக் குறிக்கிறது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτε
  choice: அப்போது
  rationale: சாட்சி அளிக்கப்பட்ட நிகழ்வின் காலச்சூழலை அறிமுகப்படுத்தும் காலப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπέστειλαν
  choice: அனுப்பி
  rationale: ἀποστέλλω என்பதன் நேரடியான நிகழ்வுப் பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் வெளிப்படையான வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; இங்கு அதன் குறிப்பு குறிப்பாக யூதேய மதத் தலைவர்களாக இருக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐξ Ἱεροσολύμων
  choice: எருசலேமிலிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் ἐξ என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: ஆசாரியர்களையும் லேவியர்களையும்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய இரண்டு தனித்த குழுக்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: அவரிடம் … என்று கேட்கச்
  rationale: அவர்கள் அனுப்பப்பட்ட நோக்கம் யோவானிடம் கேள்வி கேட்பதே என்பதைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: Σὺ τίς εἶ;
  choice: நீர் யார்?
  rationale: Σὺ தரும் நேரடி முகமுகமான வலியுறுத்தலை, மரியாதையும் கண்ணியமும் கொண்ட இயல்பான தமிழ் வினாவாகத் தருகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “யூதர்கள்” என்று மொழிபெயர்த்து, அதன் சூழல்சார் குறுகிய பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: “யூதத் தலைவர்கள்” அல்லது “யூதேயர்கள்”
  rationale: இது மூலமொழியின் வடிவத்தைப் பாதுகாக்கிறது; அதே நேரத்தில், எருசலேமிலிருந்து ஆசாரியர்களும் லேவியர்களும் அனுப்பப்பட்ட சூழலில் எல்லா யூத மக்களையும் அல்லாமல் குறிப்பாக யூதேய மத அதிகாரிகளை இது சுட்டக்கூடும் என்பதைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “நீர்” என்பது நேரடிக் கேள்வியின் மரியாதைமிக்க தொனியைத் தக்கவைக்கிறது; “சாட்சி” யோவான் நற்செய்தியின் சான்றுரைத்தல் சார்ந்த கருத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
