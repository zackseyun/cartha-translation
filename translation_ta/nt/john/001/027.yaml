id: JHN.1.27
reference: John 1:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: ta
  text: எனக்குப் பின் வருகிறவர், அவருடைய செருப்பின் வாரை அவிழ்க்க நான் தகுதியானவன் அல்ல.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: எனக்குப் பின் வருகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான வருகை நுணுக்கத்தையும், ὀπίσω μου என்பதன் காலமுறை அல்லது பணிவரிசை சார்ந்த ‘எனக்குப் பின்’ என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὗ
  choice: அவருடைய
  rationale: உறவுப்பெயரின் உடைமை வேற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்தி, செருப்பின் வார் அவருக்குரியது என்பதைத் தெளிவாக்குகிறது.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: நான் தகுதியானவன் அல்ல
  rationale: ἄξιος என்பதிலுள்ள தகுதி அல்லது பாத்திரத்தன்மை என்ற கருத்தையும் யோவானின் தாழ்மையையும், கூடுதல் விளக்கம் புகுத்தாமல் காக்கிறது.
- source_word: ἵνα λύσω
  choice: அவிழ்ப்பதற்குக்கூட
  rationale: தகுதியைக் குறிக்கும் சொல்லுக்குப் பின் வரும் ἵνα மற்றும் துணைவினை அமைப்பை இயல்பான தமிழ் நோக்க வினையெச்சமாகத் தருகிறது. ‘கூட’ என்பது மிகச் சிறிய அடிமைப் பணியைக்கூடச் செய்யத் தகுதியில்லை என்ற வாக்கியத்தின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἱμάντα
  choice: வார்
  rationale: செருப்பைக் கட்டும் தோல் அல்லது பட்டை போன்ற பகுதியைக் குறிக்கும் தெளிவான, நடைமுறையிலுள்ள தமிழ்ச் சொல்.
- source_word: τοῦ ὑποδήματος
  choice: செருப்பு
  rationale: பண்டைய சூழலில் காலில் அணிந்து வாரால் கட்டப்படும் footwear-ஐ இயல்பாகவும் போதிய துல்லியத்துடனும் குறிக்கிறது.
theological_decisions:
- issue: ‘எனக்குப் பின்’ என்பதற்கும் வருகிறவருக்கும் உள்ள உறவு
  choice: ஊழிய வரிசை அல்லது காலமுறையைக் குறிக்கும் ‘எனக்குப் பின் வருகிறவர்’
  alternative: எனக்குப் பின்னால் வருகிறவர்
  rationale: இந்தச் சொற்றொடர் முதன்மையாக யோவானுக்குப் பின்வரும் ஒருவரைக் குறிப்பிடுகிறது. அருகிலுள்ள வசனங்களில் வெளிப்படும் அவருடைய மேன்மையை இக்கூற்றுக்குள் வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதைமிக்க நடை. ‘செருப்பின் வார்’ என்பது வரலாற்றுச் சூழலை இயல்பாக உணர்த்துகிறது. மூலத்தில் இல்லாத விளக்கக் குறிப்புகள் சேர்க்கப்படவில்லை.
