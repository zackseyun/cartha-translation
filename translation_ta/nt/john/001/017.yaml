reference: John 1:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், மோசேயின் வழியாகத் திருச்சட்டம் கொடுக்கப்பட்டது; அருளும் உண்மையும் மெசியாவாகிய இயேசுவின் வழியாக வந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “இயேசு கிறிஸ்துவின் வழியாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: Χριστός என்பதற்கான பரவலாக அறியப்பட்ட பாரம்பரிய ஒலிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கருத்துக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணவிளக்க வலிமையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: இங்கு மோசேயுடன் தொடர்புடைய உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கிறது; பொதுவான சட்டம் என்று தவறாகப் புரிந்துகொள்ளாமல், அறியப்பட்ட தெய்வீகச் சட்டத்தைக் குறிக்கிறது.
- source_word: διὰ Μωϋσέως
  choice: மோசேயின் வழியாக
  rationale: διά + மரபுவேற்றுமை இடைமுகச் செயற்பாட்டைக் காட்டுகிறது; இயேசுவைப் பற்றிய இணையான தொடரின் அமைப்பையும் காக்கிறது.
- source_word: ἐδόθη
  choice: கொடுக்கப்பட்டது
  rationale: δίδωμι என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் அளிக்கிறது; கொடுத்தவர் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: யோவானின் சூழலில் தெய்வீக கிருபை அல்லது இரக்கமிக்க தயவைச் சுமக்கும் இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: ἡ ἀλήθεια
  choice: உண்மை
  rationale: யோவான் 1:14-ஐ எதிரொலிக்கும் வகையில் வெளிப்படுத்தப்பட்ட சத்தியம் அல்லது யதார்த்தம் என்ற பொருள் வளத்தைப் பாதுகாக்கிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின் வழியாக
  rationale: διά இடைமுகத்தைச் சுட்டுகிறது; Χριστός இங்கு பட்டமாக இருப்பதால் அதன் மெசியா பொருள் ஒலிபெயர்ப்பால் வெளிப்படுகிறது.
- source_word: ἐγένετο
  choice: வந்தன
  rationale: அருளும் உண்மையும் இயேசுவின் வழியாக வரலாற்றில் வெளிப்பட்டு வந்தன என்ற கருத்தை இயல்பாகத் தருகிறது; ἐδόθη என்பதிலிருந்து உள்ள சொல்வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வை மொழிபெயர்த்தல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இச்சூழலில் பட்டப்பெயரின் பொருளைக் கொண்டிருப்பதால், அதன் யூத மெசியா கருத்தை வெளிப்படுத்த ‘மெசியா’ பயன்படுத்தப்பட்டது; பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சட்டத்திற்கும் அருள் மற்றும் உண்மைக்கும் இடையிலான உறவு
  choice: மூலத்திலுள்ள இணைமாறுபாட்டை மட்டும் காத்தல்
  alternative: சட்டம் அருளுக்கும் உண்மைக்கும் எதிரானது என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரை சட்டம் ‘கொடுக்கப்பட்டது’ என்றும் அருளும் உண்மையும் ‘வந்தன’ என்றும் கூறுகிறது; சட்டம் பொய்யானது அல்லது அருளற்றது என்ற மேலதிக முடிவை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையும் இலக்கியத் தெளிவும் கொண்ட நடை. கிரேக்க வாக்கியத்தின் இரு இணையான ‘வழியாக’ தொடர்களும், ‘கொடுக்கப்பட்டது/வந்தன’ என்ற வினைச்சொல் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி தொடர்புடைய ‘மெசியா’ சொல்லுக்குப் பின் வைக்கப்பட்டது.
