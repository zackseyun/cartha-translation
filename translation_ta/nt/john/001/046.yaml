source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: ta
  text: நாத்தான்வேல் அவரிடம், “நாசரேத்திலிருந்து ஏதாவது நல்லது வர முடியுமா?” என்று கேட்டார்.[a] பிலிப்பு அவரிடம், “வந்து பார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லர்த்தத்திற்கு நெருக்கமாக, “நாசரேத்தைச் சேர்ந்த ஏதாவது நல்லது இருக்க முடியுமா?”
    reason: εἶναι என்பதன் அடிப்படைப் பொருள் ‘இருக்க’ என்பதாகும்; முதன்மை உரையிலுள்ள ‘வர’ என்பது ἐκ (‘இலிருந்து’) உடன் இயல்பான தமிழில் தோற்றுவாயை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: நாத்தான்வேல் அவரிடம் … என்று கேட்டார்
  rationale: καί இங்கு முந்தைய வசனத்துடன் கதையை எளிமையாக இணைக்கிறது; தனியாக ‘மேலும்’ அல்லது ‘பிறகு’ என்று மொழிபெயர்ப்பது தமிழ் நடையில் தேவையில்லை. கேள்வி வடிவ உரையை அறிமுகப்படுத்துவதால் εἶπεν என்பதற்கு இயல்பான தமிழில் ‘கேட்டார்’ பயன்படுத்தப்பட்டது.
- source_word: Ἐκ Ναζαρὲτ
  choice: நாசரேத்திலிருந்து
  rationale: ἐκ என்பது ஊற்றிடம் அல்லது தோற்றுவாயைக் குறிக்கிறது; ‘நாசரேத்திலிருந்து’ அதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: நல்லது ஏதாவது வர முடியுமா?
  rationale: δύναται சாத்தியத்தைக் குறிக்கிறது; τι ἀγαθόν என்பது ‘நல்லது ஏதாவது’ என இயல்பாக வருகிறது. ἐκ உடன் சேர்ந்த εἶναι-ஐ தமிழில் ‘வர’ என வழங்குவது தோற்றுவாயைக் குறிக்கும் கேள்வியை இயல்பாக்குகிறது; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: பிலிப்பு அவரிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலமான λέγει, தமிழ் கதைநடையின் இயல்புக்காக இறந்தகாலமாக வழங்கப்பட்டுள்ளது.
- source_word: Ἔρχου καὶ ἴδε
  choice: வந்து பார்
  rationale: இரண்டு கட்டளைகளையும் தமிழ் மொழியின் இயல்பான தொடர்வினை அமைப்பில் வெளிப்படுத்துகிறது. ‘பார்’ என்பது நேரடியாகக் காணவும் உணர்ந்து அறியவும் அழைக்கும் யோவானியச் சொல்லாட்சியின் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: நாசரேத்தைப் பற்றிய நாத்தான்வேலின் கேள்வியின் தொனி
  choice: சந்தேகத்தை வெளிப்படுத்தும் நேரடியான வினாவாக மொழிபெயர்க்கப்பட்டது; கேலி அல்லது இகழ்ச்சியைத் தனியாகச் சேர்க்கவில்லை.
  alternative: இகழ்ச்சித் தொனியை வெளிப்படையாகக் கூட்டி மொழிபெயர்த்தல்.
  rationale: கிரேக்க வாக்கியம் சந்தேகத்தை உணர்த்தினாலும், கேலி அல்லது கடுமையான இகழ்ச்சிக்கான தனிப்பட்ட குறியீட்டை வழங்கவில்லை. எனவே உரையில் உள்ள மறைமுக அழுத்தம் மட்டும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நாத்தான்வேலின் சந்தேகம் அதிகப்படுத்தப்படவில்லை. நிலைபெற்ற தமிழ் வேதாகமப் பெயர்வடிவங்களான ‘நாத்தான்வேல்,’ ‘நாசரேத்,’ ‘பிலிப்பு’ பயன்படுத்தப்பட்டுள்ளன.
