source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: ta
  text: சீமோன் பேதுருவின் சகோதரனான அந்திரேயா, யோவானிடமிருந்து கேட்டும் அவரைப் பின்தொடர்ந்தும் இருந்த அந்த இருவரில் ஒருவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரைப்” என்பது இங்குள்ள சூழலில் இயேசுவைக் குறிக்கிறது.
    reason: சுட்டுப்பெயரின் சூழல்சார் குறிப்பைத் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: ἦν
  choice: ஒருவர்
  rationale: தமிழில் அடையாளப்படுத்தும் பெயர்ப் பயனிலை வாக்கியத்தில் தனியான ‘இருந்தார்’ தேவையில்லை; ‘இருவரில் ஒருவர்’ என்பது இயல்பாகவே ἦν என்பதன் இணைப்புச் செயல்பாட்டைத் தருகிறது.
- source_word: Ἀνδρέας
  choice: அந்திரேயா
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: சீமோன் பேதுருவின் சகோதரனான
  rationale: சொந்த உறவையும் ἀδελφός குறிக்கும் உடன்பிறந்த சகோதர உறவையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἷς ἐκ τῶν δύο
  choice: அந்த இருவரில் ஒருவர்
  rationale: கிரேக்கப் பகுதிப்பொருள் அமைப்பைத் துல்லியமான நவீன தமிழில் வழங்குகிறது; ‘அந்த’ என்பது சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட இருவரைக் குறிக்கிறது.
- source_word: τῶν ἀκουσάντων
  choice: கேட்டபின்
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லை, முதலில் கேட்டதும் பின்னர் பின்தொடர்ந்ததும் ஆகிய இயல்பான நிகழ்வுவரிசையைக் காட்டும் தமிழ்ச் சொல்லாட்சியாக வழங்குகிறது.
- source_word: παρὰ Ἰωάννου
  choice: யோவானிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமை குறிக்கும் மூலத்தை நேரடியாகப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘திருமுழுக்கு யோவான்’ அல்லது ‘யோவானின் வார்த்தைகள்’ என்பவற்றைச் சேர்க்கவில்லை.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: அவரைப் பின்தொடர்ந்த
  rationale: ἀκολουθέω என்பதற்கு நேரான ‘பின்தொடர்’ பயன்படுத்தப்பட்டுள்ளது; αὐτῷ என்பதன் ஆண்பால் ஒருமைச் சுட்டை ‘அவரை’ என வைத்து, பெயரை மூலவசனத்திற்கு மேலாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: αὐτῷ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘அவரை’ என்று மட்டும் வழங்குதல்; சூழலில் அது இயேசுவைக் குறிக்கிறது
  alternative: ‘இயேசுவைப் பின்தொடர்ந்த’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல், அல்லது இலக்கண ரீதியாக யோவானைக் குறிக்கும் என வாசித்தல்
  rationale: யோவான் 1:35–39 நிகழ்வோட்டத்தில் சீடர்கள் யோவானின் சாட்சியைக் கேட்டு இயேசுவைப் பின்தொடர்கிறார்கள். இருப்பினும் கிரேக்கம் αὐτῷ என்ற சுட்டுப்பெயரையே பயன்படுத்துவதால் முதன்மை உரையில் அந்த வடிவம் பாதுகாக்கப்பட்டு, அதன் சூழல்சார் குறிப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் அடையாளப்படுத்தும் அமைப்பு இயல்பான தமிழ் பெயர்ப் பயனிலை வடிவில் தரப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
