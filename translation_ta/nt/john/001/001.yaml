  source_fidelity: 'கருத்து மூன்று கூறுகளிலும் மூலக் கிரேக்கத்துக்கு நெருக்கமாக உள்ளது: Ἐν ἀρχῇ-ன் தொடக்கக் குறிப்பு, λόγος-ன் மீள்வருகை, πρὸς τὸν θεόν-ன் உறவுநிலை, இறுதிக் கூறிலுள்ள θεός-ன் பண்புத்தன்மை ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் மூலத்தில் λόγος இலக்கண ரீதியாக ஆண்பால் பெயர்ச்சொல்லாக இருப்பது தமிழில் மரியாதைப் பால் வினைமுற்றை அவசியப்படுத்தாது; அது உரையில் தேவையற்ற தனிப்பட்ட விளக்கத்தைச் சேர்க்கிறது.'
  naturalness: ‘வார்த்தை இருந்தார்’ மற்றும் ‘வார்த்தை கடவுளாக இருந்தார்’ நவீன நிலையான தமிழில் இலக்கண மற்றும் நடையளவில் இயல்பற்றவை; ‘வார்த்தை’க்கு ‘இருந்தது’ பொருத்தமானது. ‘கடவுளாய் இருந்தது’ என்பது இவ்வகைப் பெயர்நிலைப் பயனிலைக்கு ‘கடவுளாக இருந்தது’ என்பதைக் காட்டிலும் செறிவாகவும் இயல்பாகவும் உள்ளது. ‘அந்த’ என்பது மூலத்தில் இல்லாத சுட்டுச்சொல்; தமிழில் மீண்டும் வரும் ‘வார்த்தை’ மட்டும் போதுமானது.
  terminology: ‘வார்த்தை’ மற்றும் ‘கடவுள்’ நிலையான, புரிந்துகொள்ளத்தக்க தேர்வுகள். ‘தெய்வீக இயல்புடையவராக’ என்ற அடிக்குறிப்பு மொழி மரியாதைப் பால் சிக்கலைத் தொடர்கிறது; அதற்குப் பதிலாக வார்த்தையின் இயல்பைப் பற்றிய விளக்கமாக அமைத்தல் சிறந்தது. இறுதிக் கூறை ‘தெய்வீகமானது’ என்று முதன்மை உரையில் மாற்றுவது θεός-ன் முழு வலிமையைக் குறைக்கக்கூடும்; ஆகவே முதன்மை உரையில் ‘கடவுளாய் இருந்தது’ காக்கப்படுகிறது.
