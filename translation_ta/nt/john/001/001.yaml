revisions:
- from: தொடக்கத்தில்[b] வார்த்தை இருந்தார்; அந்த வார்த்தை கடவுளோடு இருந்தார்; அந்த வார்த்தை கடவுளாக இருந்தார்.[a]
  to: ஆரம்பத்தில்[b] வார்த்தை இருந்தது; வார்த்தை கடவுளோடு இருந்தது; வார்த்தை கடவுளாய் இருந்தது.[a]
  rationale: மரியாதைப் பால் வினைமுற்றுகள் நீக்கப்பட்டு, நவீன நிலையான தமிழுக்கு இயல்பான நடுநிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது. இது λόγος-ஐ ஒரு அடையாளப்பெயராக வைத்துக்கொண்டே, தமிழில் மூலத்தில் வெளிப்படையாக இல்லாத இலக்கண வழித் தனிப்பட்ட விளக்கத்தைத் திணிப்பதைத் தவிர்க்கிறது. ‘கடவுளாய் இருந்தது’ இறுதிக் கூறின் வலிமையைத் தக்கவைத்து, முந்தைய ‘கடவுளோடு இருந்தது’ என்ற உறவு-வேறுபாட்டையும் குலைக்காது. அடிக்குறிப்பு அ, மாற்று விளக்கத்தை மாற்று மொழிபெயர்ப்பாகக் குறித்தாலும், அதன் பண்புத்தன்மை நுணுக்கத்தைத் தெளிவுபடுத்துகிறது.
