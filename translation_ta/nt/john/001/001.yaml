id: JHN.1.1
reference: John 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ta
  text: ஆரம்பத்தில்[b] வார்த்தை இருந்தது; வார்த்தை கடவுளோடு இருந்தது; வார்த்தை கடவுளாய் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: அல்லது, ‘வார்த்தை தெய்வீகமானது’ அல்லது ‘கடவுள் எப்படிப்பட்டவரோ, வார்த்தையும் அப்படிப்பட்டது’ என்றும் விளக்கலாம். கிரேக்க இறுதிக் கூறில் ‘கடவுள்’ என்பது வார்த்தையின் இயல்பை வலியுறுத்துகிறது; அதேவேளையில் முந்தைய கூறில் குறிப்பிடப்படும் கடவுளிடமிருந்து வார்த்தையை வேறுபடுத்திக் காட்டுகிறது.
    reason: alternative_reading
  - marker: b
    text: இந்தத் தொடக்கச் சொற்றொடர் ஆதியாகமம் 1:1-ஐ எதிரொலித்து, வார்த்தையைப் படைப்பின் தொடக்கத்தோடு இணைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: தொடக்கத்தில்
  rationale: இது இயல்பான நவீனத் தமிழில் காலத்தின் ஆரம்பத்தைக் குறிக்கிறது; அதேவேளையில் ஆதியாகமம் 1:1-ன் தொடக்கத்தை எதிரொலிக்கிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: εἰμί வினையின் இறந்தகாலத் தொடர்நிலை உணர்வை எளிமையாகத் தருகிறது. இங்கு ‘வார்த்தை’ தனிப்பட்டவராக முன்வைக்கப்படுவதால் மரியாதைப் பால் வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; ‘உருவானார்’ என்று மொழிபெயர்த்து படைக்கப்பட்ட தொடக்கம் இருப்பதாகச் சொல்லப்படவில்லை.
- source_word: ὁ λόγος
  choice: வார்த்தை
  rationale: λόγος என்பதிலுள்ள பேச்சு, வெளிப்பாடு, செய்தி ஆகிய தொடர்புகளைத் தக்கவைத்துக்கொண்டு, யோவான் முன்னுரையில் இது ஒரு தனிப்பட்ட அடையாளப்பெயராகச் செயல்படுவதையும் இயல்பாகக் காட்டுகிறது. ‘செய்தி’ என்பது பொருளைச் சுருக்கும்; ‘லோகோஸ்’ சாதாரண வாசகருக்கு விளக்கமின்றி புரியாது.
- source_word: πρὸς τὸν θεόν
  choice: கடவுளோடு
  rationale: πρός இங்கு அண்மை, உறவு, தனிப்பட்ட வேறுபாடு ஆகியவற்றை உணர்த்துகிறது. ‘கடவுளை நோக்கி’ என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பாக இருந்தாலும் தமிழில் இந்த உறவை இயல்பாகத் தெரிவிக்காது.
- source_word: τὸν θεόν
  choice: கடவுள்
  rationale: குறிப்பிட்ட ஒரே கடவுளைக் குறிக்கும் articular வடிவத்தை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: θεὸς ἦν ὁ λόγος
  choice: வார்த்தை கடவுளாக இருந்தார்
  rationale: 'வினைக்கு முன் வரும் article இல்லாத θεός பண்புத்தன்மை சார்ந்த வலிமையைக் கொண்டுள்ளது: வார்த்தையின் இயல்பு கடவுளுடையதே என்பதை உறுதிப்படுத்துகிறது; அதே நேரத்தில் முந்தைய கூறிலுள்ள கடவுளும் வார்த்தையும் ஒரே நபர் என்று கலந்து விடுவதில்லை.'
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள article இல்லாத θεός என்பதன் மொழிபெயர்ப்பு
  choice: வார்த்தை கடவுளாக இருந்தார்
  alternative: வார்த்தை தெய்வீக இயல்புடையவராக இருந்தார்; அல்லது, கடவுள் எப்படிப்பட்டவரோ, வார்த்தையும் அப்படிப்பட்டவராக இருந்தார்
  rationale: முதன்மை வாசகம் θεός என்பதன் முழு வலிமையைத் தக்கவைக்கிறது. அடிக்குறிப்பு அதன் பண்புத்தன்மை சார்ந்த இலக்கண நுட்பத்தையும், முந்தைய கூறில் காணப்படும் நபர் வேறுபாட்டையும் வெளிப்படுத்துகிறது; எந்த ஒரு பக்கத்தையும் குறைத்து இறையியல் இழுபறியைத் தீர்த்துவிடவில்லை.
- issue: வார்த்தைக்கும் கடவுளுக்கும் இடையிலான πρὸς உறவு
  choice: கடவுளோடு இருந்தார்
  alternative: கடவுளை நோக்கி இருந்தார்; கடவுளின் முன்னிலையில் இருந்தார்
  rationale: ‘கடவுளோடு’ என்பது நெருங்கிய உறவையும் உடனிருப்பையும் இயல்பான தமிழில் காட்டுகிறது. அதே சமயம் இரண்டு குறிப்புகளுக்கிடையிலான வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தேவன்’ என்பதற்குப் பதில் பரவலாகப் புரியும் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தை’ இலக்கணப்படி உயிரற்ற பெயராக இருந்தாலும், இப்பகுதியில் தனிப்பட்டவரைக் குறிக்கும் அடையாளப்பெயராக இருப்பதால் ‘இருந்தார்’ என்ற மரியாதைப் பால் வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
