  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: ta
  text: அவர் தமக்குரியவற்றிடம் வந்தார்[a]; ஆனால் அவருக்குரிய மக்கள் அவரை ஏற்றுக்கொள்ளவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்குரிய இடத்திற்கு வந்தார்.” கிரேக்க மொழியில் இங்குள்ள முதல் சொற்றொடர் நடுநிலைப் பன்மையில் உள்ளது; அது அவருக்குரிய இடம், வீடு, ஆளுகைப்பரப்பு அல்லது உடைமைகளைக் குறிக்கலாம். அடுத்து வரும் “அவருக்குரிய மக்கள்” என்பது ஆண்பால் பன்மையில் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவரை வரவேற்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: தமக்குரிய இடத்திற்கு
  rationale: τὰ ἴδια என்பது நடுநிலைப் பன்மை; அது அவருக்குச் சொந்தமான இடம், வீடு, ஆளுகைப்பரப்பு அல்லது உடைமைகள் ஆகியவற்றைக் குறிக்கக்கூடும். தமிழில் இயல்பாக இருக்க ‘தமக்குரிய இடத்திற்கு’ என மொழிபெயர்த்து, அதன் பரந்த பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: ἔρχομαι என்பதன் இறந்தகால வடிவம் இங்கு எளிய நிகழ்வாக ‘வந்தார்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: οἱ ἴδιοι
  choice: அவருக்குரிய மக்கள்
  rationale: ஆண்பால் பன்மையான οἱ ἴδιοι மனிதர்களைக் குறிக்கிறது. முந்தைய நடுநிலைப் பன்மையிலிருந்து உள்ள வேறுபாட்டைத் தெளிவாகக் காட்ட ‘மக்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: παρέλαβον
  choice: ஏற்றுக்கொள்ளவில்லை
  rationale: ஒருவரை ஏற்றுக்கொள்ளுதல் அல்லது வரவேற்றல் என்ற பொருளை இச்சொல் தருகிறது. ‘ஏற்றுக்கொள்ளவில்லை’ என்பது இவ்விரு நுணுக்கங்களையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ் நடை.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் ‘வார்த்தை’ என்று குறிப்பிடப்பட்டவரையே இப்பெயர்ச்சுட்டு குறிக்கிறது; மரியாதை ஒருமையில் ‘அவரை’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἴδιος என்ற சொல்லின் இரு பயன்பாடுகளுக்கிடையிலான வேறுபாடு
  choice: முதல் சொற்றொடர் அவருக்குரிய இடம் அல்லது ஆளுகைப்பரப்பையும், இரண்டாவது சொற்றொடர் அவருக்குரிய மக்களையும் குறிக்கிறது.
  alternative: இரு சொற்றொடர்களும் அவருடைய மக்களையே குறிக்கின்றன; அல்லது முதல் சொற்றொடர் குறிப்பாக அவருடைய வீட்டைக் குறிக்கிறது.
  rationale: மூலமொழி முதலில் நடுநிலைப் பன்மையையும் பின்னர் ஆண்பால் பன்மையையும் பயன்படுத்துவதால், உடைமை/இடம் மற்றும் மக்கள் ஆகியவற்றுக்கிடையில் திட்டமிட்ட வேறுபாடு உள்ளது. முதற்பகுதியை ஒரு குறிப்பிட்ட வீடு அல்லது தேசமாகச் சுருக்காமல் அடிக்குறிப்பு அதன் பொருள் விரிவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தமக்குரிய’ என்பது எழுவாயாகிய அவரையே சுட்டுகிறது; ‘அவருக்குரிய மக்கள்’ என்பது மனிதர்களைக் குறிக்கும் இரண்டாவது கிரேக்கப் பயன்பாட்டைத் தெளிவாக்குகிறது. ‘இடம்’ எனும் இயல்பான தமிழ்ச் சொல் பயன்படுத்தப்பட்டாலும், மூலத்தின் பொருள் விரிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
