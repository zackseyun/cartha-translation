  to: அவர் தமக்குரியவற்றிடம் வந்தார்[a]; ஆனால் அவருக்குரிய மக்கள் அவரை ஏற்றுக்கொள்ளவில்லை[b].
  rationale: முதற்பகுதியில் உள்ள நடுநிலைப் பன்மையின் பொருள் விரிவை முதன்மை உரையிலேயே பாதுகாக்க “தமக்குரிய இடத்திற்கு” என்பதற்குப் பதிலாக “தமக்குரியவற்றிடம்” பயன்படுத்தப்பட்டுள்ளது. இரண்டாவது ஆண்பால் பன்மைக்கு “அவருக்குரிய மக்கள்” என்பதும், παραλαμβάνω என்பதற்கு “ஏற்றுக்கொள்ளவில்லை” என்பதும் மாற்றமின்றி பொருத்தமானவை.
