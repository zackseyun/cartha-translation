revisions:
- from: எல்லாம் அவர் மூலமாக உண்டாயின; உண்டானவற்றில் ஒன்றுகூட அவர் இல்லாமல் உண்டாகவில்லை.[a]
  to: எல்லாம் அவர் மூலமாக உண்டாயின; அவர் இல்லாமல் உண்டானது ஒன்றுகூட இல்லை.[a]
  rationale: 'The revision retains the adopted reading that ὃ γέγονεν belongs with verse 3, but renders its comprehensive force in idiomatic Tamil: ‘apart from him, not even one thing that has come into being exists/came into being.’ The footnote continues to preserve the genuine punctuation alternative beginning verse 4.'
