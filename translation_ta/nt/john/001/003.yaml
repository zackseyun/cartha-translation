id: JHN.1.3
reference: John 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: ta
  text: எல்லாம் அவர் மூலமாக உண்டாயின; அவர் இல்லாமல் உண்டானது ஒன்றுகூட இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, 4ஆம் வசனத்தை இவ்வாறு தொடங்கலாம்: “அவரில் உண்டானது உயிராக இருந்தது.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: எல்லாம்
  rationale: நடுநிலைப் பன்மையான πάντα படைப்பின் முழுத் தொகுதியையும் உள்ளடக்குகிறது. இயல்பான நவீனத் தமிழில் அதன் பரந்த பொருளை ‘எல்லாம்’ தெளிவாகக் காட்டுகிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: Genitive உடன் வரும் διά வழிமுறை அல்லது இடைநிலையான செயற்பாட்டைக் குறிக்கிறது. ‘அவர் மூலமாக’ என்பது அந்த உறவைத் தெளிவாகப் பாதுகாக்கிறது; நேரடி செயற்பாட்டை மட்டும் உணர்த்தக்கூடிய ‘அவரால்’ என்பதைத் தவிர்க்கிறது.
- source_word: ἐγένετο
  choice: உண்டாயின / உண்டாகவில்லை
  rationale: γίνομαι இங்கு ஏற்கெனவே இருந்த பொருள் வடிவமைக்கப்பட்டதைக் காட்டாமல், இருப்புக்கு வருதலைக் குறிக்கிறது. ‘உண்டாதல்’ தமிழில் இந்த இருப்புத் தொடக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χωρὶς αὐτοῦ
  choice: அவர் இல்லாமல்
  rationale: χωρίς பிரிவை அல்லது ஒருவரின் பங்கின்றி நிகழ்வதைச் சுட்டுகிறது. ‘அவர் இல்லாமல்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὐδὲ ἕν
  choice: ஒன்றுகூட
  rationale: οὐδέ + ἕν என்பதன் வலியுறுத்தப்பட்ட முழுமையான மறுப்பை ‘ஒன்றுகூட’ சுருக்கமாகவும் வலுவாகவும் வெளிப்படுத்துகிறது.
- source_word: ὃ γέγονεν
  choice: உண்டானவற்றில்
  rationale: இறுதி உறவுப்பெயர் தொடரை 3ஆம் வசனத்தோடு இணைத்து, இருப்புக்கு வந்த அனைத்தின் தொகுதியைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது. γέγονεν என்பதின் நிகழ்ந்து நிலைத்துள்ள விளைவு தமிழில் சூழலால் இயல்பாக உணரப்படுகிறது.
theological_decisions:
- issue: ὃ γέγονεν என்ற இறுதித் தொடரின் தொடர்பு
  choice: அதை 3ஆம் வசனத்தோடு இணைத்து, ‘உண்டானவற்றில் ஒன்றுகூட ... உண்டாகவில்லை’ என்று வாசித்தல்
  alternative: அதை 4ஆம் வசனத்தின் தொடக்கத்தோடு இணைத்து, ‘அவரில் உண்டானது வாழ்வாக இருந்தது’ என்று வாசித்தல்
  rationale: பண்டைய கிரேக்கக் கையெழுத்துப் பிரதிகளில் மூல நிறுத்தற்குறிகள் இல்லாததால் இரு தொடர்புகளும் இலக்கணரீதியாகச் சாத்தியம். முதன்மை உரை SBLGNT நிறுத்தற்குறிப்பைப் பின்பற்றுகிறது; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். யோவான் முன்னுரையின் உயர்ந்த நடையைத் தக்கவைத்தபடியே, சாதாரண வாசகருக்குப் புரியும் இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ‘அவர்’ என்பது லோகோஸைக் குறிக்கும் மரியாதை ஒருமை.
