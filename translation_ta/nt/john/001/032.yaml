id: JHN.1.32
reference: John 1:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: ta
  text: 'யோவான் சாட்சி கூறினார்: “ஆவியானவர் வானத்திலிருந்து புறாவைப் போல இறங்கி வந்து இயேசுவின்மேல் நிலைத்திருந்ததை நான் கண்டிருக்கிறேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: சாட்சி கூறி
  rationale: μαρτυρέω என்பதன் சாட்சி அளித்தல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: Τεθέαμαι
  choice: நான் கண்டிருக்கிறேன்
  rationale: நேரில் கண்ட நிகழ்வின் தொடரும் முக்கியத்துவத்தை உணர்த்தும் கிரேக்க நிறைவுக்கால வினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: உடனடிச் சூழலில் இது பரிசுத்த ஆவியைக் குறிக்கிறது; தமிழில் தெய்வீக நபரைக் குறிக்கும் மரியாதை வடிவம் இயல்பானது.
- source_word: καταβαῖνον
  choice: இறங்கி வருவதை
  rationale: கீழ்நோக்கிய இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὡς περιστερὰν
  choice: புறாவைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையைத் தெளிவாக வைத்திருந்து, ஆவியானவர் சொற்பொருளில் புறாவாக மாறினார் என்று கூறுவதில்லை.
- source_word: ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: தோன்றிய இடம் அல்லது மூலத்திலிருந்து இறங்கிவந்த இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔμεινεν
  choice: நிலைத்திருந்தார்
  rationale: யோவான் நூலில் முக்கியமான μένω வினையின் தொடர்ந்திருத்தல் அல்லது நிலைத்திருத்தல் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: ἐπ’ αὐτόν
  choice: இவர்மேல்
  rationale: ἐπί குறிக்கும் ‘மேல்’ என்ற உறவைத் தக்கவைக்கிறது; நேரடிச் சுட்டுச் சூழலில் இயேசுவைக் குறிக்கும் ‘இவர்’ தெளிவாகவும் மரியாதையாகவும் உள்ளது.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் அடையாளம்
  choice: பரிசுத்த ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: ‘ஆவி’
  rationale: யோவான் 1:32–33 சூழல் இதைத் தெய்வீக ஆவியாக அடையாளப்படுத்துகிறது; ‘பரிசுத்த’ என்ற மூலத்தில் இல்லாத சொல்லை வசனத்திற்குள் சேர்க்காமல் குறிப்பு தெளிவைப் பேணுகிறது.
- issue: ὡς περιστερὰν என்பதன் வலிமை
  choice: ஒப்புமையாக ‘புறாவைப் போல’
  alternative: ‘புறாவாக’
  rationale: கிரேக்க ὡς இயல்பாக ஒப்புமையைக் குறிக்கிறது; வெளிப்பாட்டின் இயல்பைத் தேவையற்ற விதத்தில் தீர்மானிக்காமல் உருவகத்தைப் பாதுகாக்கிறது.
- issue: πνεῦμα-ஐத் தொடரும் ἔμεινεν வினைக்கான தமிழ்ப் பால்/மரியாதை
  choice: ‘அவர் ... நிலைத்திருந்தார்’
  alternative: ‘அது ... நிலைத்திருந்தது’
  rationale: கிரேக்க இலக்கணப் பால் நடுநிலையாக இருந்தாலும், தமிழில் ‘ஆவியானவர்’ என்ற தெய்வீக நபர்ச் சுட்டுக்கு ‘அவர்’ இயல்பானது; இது கிரேக்கத்தில் ஆண்பால் சுட்டுப்பெயர் இருப்பதாகக் கூறுவதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சாட்சி கூறி ... என்றார்’ என்பது கிரேக்க λέγων அமைப்பைத் தமிழில் இயல்பாக இணைக்கிறது. ‘நிலைத்திருந்தார்’ என்பது யோவான் நூலின் μένω சொல்லாட்சித் தொடர்ச்சியைப் பேணுகிறது.
