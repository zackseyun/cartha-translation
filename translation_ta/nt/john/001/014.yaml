id: JHN.1.14
reference: John 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: ta
  text: வார்த்தை மனித உடலெடுத்து நம்மிடையே வாழ்ந்தார்[a]. அவருடைய மகிமையை நாங்கள் கண்டோம்—தந்தையிடமிருந்து வந்த ஒரே மகனுக்குரிய மகிமையை[b]. அவர் அருளும் உண்மையும் நிறைந்தவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மிடையே கூடாரமிட்டு வாழ்ந்தார்”; இவ்வினைச்சொல் திருக்கூடாரப் படிமத்தை நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, “தந்தையிடமிருந்து வந்த ஒரே பேறான மகனுக்குரிய மகிமை”; வேறொரு மொழிபெயர்ப்பு: “தனித்துவமான மகனுக்குரிய மகிமை.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: வார்த்தை
  rationale: யோவான் முன்னுரையில் ஆளுமையைக் குறிக்கும் வளமான பட்டப்பெயரைத் தக்கவைக்கும், தமிழில் நிலைபெற்ற இயல்பான மொழிபெயர்ப்பு.
- source_word: σὰρξ ἐγένετο
  choice: மனித உடலெடுத்து
  rationale: σάρξ குறிக்கும் உண்மையான உடல்சார்ந்த மனித இருப்பையும் ἐγένετο குறிக்கும் மாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் மனித இயல்பு என்ற கருத்தாக்கமாகச் சுருக்கவில்லை.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: நம்மிடையே வாழ்ந்தார்
  rationale: முதன்மை உரையில் தெளிவான நவீனத் தமிழைப் பயன்படுத்துகிறது; கூடாரம்/திருக்கூடாரப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐθεασάμεθα
  choice: நாங்கள் கண்டோம்
  rationale: நேரடியான சாட்சியைக் குறிக்கும் இயல்பான, எளிதில் புரியும் தமிழ்.
- source_word: δόξαν
  choice: மகிமை
  rationale: யோவான் நூலிலும் வேதாகமப் பயன்பாட்டிலும் உள்ள கருத்துச் செறிவைத் தக்கவைக்கும் நிலைபெற்ற சொல்.
- source_word: μονογενοῦς
  choice: ஒரே தனித்துவமிக்க மகன்
  rationale: இச்சூழலில் முதன்மையாகத் தனித்தன்மையையும் ஒப்பற்ற மகன் உறவையும் குறிக்கும் சொல்லின் பொருளைத் தெளிவாக்குகிறது; ‘ஒரே பேறான மகன்’ என்ற வரலாற்றுச் சிறப்புடைய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρὰ πατρός
  choice: தந்தையிடமிருந்து வந்த
  rationale: παρά குறிக்கும் தோற்றுவாய்/உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் தந்தை கடவுளைக் குறிக்கிறது.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: அருளும் உண்மையும் நிறைந்தவர்
  rationale: கிரேக்கத்தின் இணைந்த பண்புகளை இயல்பான தமிழில் தக்கவைத்து, அந்த விவரிப்பு வார்த்தை/மகனைச் சார்வதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: μονογενοῦς என்பதன் கிறிஸ்துவியல் உணர்வுள்ள மொழிபெயர்ப்பு
  choice: ஒரே தனித்துவமிக்க மகன்
  alternative: ஒரே பேறான மகன்
  rationale: கிரேக்கச் சொல்லின் சாத்தியமான முதன்மைப் பொருளான தனித்தன்மையை முன்னிறுத்துகிறது; ‘பேறான’ என்பதில் உள்ள வரலாற்று இறையியல் மரபை மறைக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ἐσκήνωσεν என்பதில் திருக்கூடாரப் படிமத்தை முதன்மைப்படுத்தலாமா
  choice: நம்மிடையே வாழ்ந்தார்
  alternative: நம்மிடையே கூடாரமிட்டு வாழ்ந்தார்
  rationale: முதன்மை உரையை நவீன வாசகருக்கு இயல்பாக வைத்துக்கொண்டு, பழைய ஏற்பாட்டுத் திருக்கூடாரத்தை நினைவூட்டக்கூடிய சொற்படிமத்தை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
- issue: πλήρης என்ற ஆண்பால் ஒருமை பெயரெச்சத்தின் தொடர்பு
  choice: அவர் அருளும் உண்மையும் நிறைந்தவர்
  alternative: அருளும் உண்மையும் நிறைந்த மகிமை
  rationale: கிரேக்கத்தில் πλήρης இயல்பாக வார்த்தை/மகனை விவரிப்பதைத் தமிழில் தெளிவாக்குகிறது; அதை ‘மகிமை’ என்பதோடு இணைத்து இறையியல் பதற்றத்தைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘வார்த்தை’, ‘மகிமை’, ‘அருள்’, ‘உண்மை’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் கருத்துச் செறிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன. கிரேக்கத்தின் நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
