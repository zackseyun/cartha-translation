id: JHN.1.16
reference: John 1:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: ta
  text: ஏனெனில், அவருடைய நிறைவிலிருந்து நாம் அனைவரும் பெற்றிருக்கிறோம்; மேலும், அருளுக்குப் பதிலாக அருளைப் பெற்றிருக்கிறோம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அருள்மேல் அருள்” அல்லது “ஒன்றன்பின் ஒன்றாக அருள்.” கிரேக்கச் சொற்றொடர், ஓர் அருளைத் தொடர்ந்து மற்றோர் அருள் வருவதைக் குறிக்கலாம்; எனினும் ἀντί என்பதன் நேரடியான பொருள் “பதிலாக” அல்லது “இடத்தில்” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: அவருடைய நிறைவிலிருந்து
  rationale: πλήρωμα என்பதன் ‘நிறைவு/முழுமை’ என்ற பொருளையும், பெறப்படுவது அவருக்குரிய நிறைவிலிருந்து வருகிறது என்ற உறவையும் காக்கிறது.
- source_word: ἡμεῖς πάντες
  choice: நாம் அனைவரும்
  rationale: வெளிப்படையாக இடம்பெறும் ἡμεῖς மற்றும் πάντες ஆகியவற்றின் வலியுறுத்தலைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐλάβομεν
  choice: பெற்றிருக்கிறோம்
  rationale: இறந்தகாலத்தில் பெற்றதன் தற்போதைய விளைவு அல்லது உடைமையை இயல்பான தமிழில் உணர்த்துகிறது; கிரேக்க இறந்தகால வடிவை அளவுக்கு மீறி விளக்குவதில்லை.
- source_word: καὶ
  choice: —
  rationale: இரண்டாம் சொற்றொடர் பெற்றதன் உள்ளடக்கத்தை விரித்துரைப்பதாகத் தமிழில் இயல்பாக இணைக்க கோடு பயன்படுத்தப்பட்டுள்ளது; καί-யின் இணைப்புச் செயல்பாடு தொடர்கிறது.
- source_word: χάριν ἀντὶ χάριτος
  choice: அருளுக்குப் பதிலாக அருளை
  rationale: ἀντί என்பதன் அடிப்படையான ‘பதிலாக/இடத்தில்’ என்ற பொருளைக் காத்து, மாற்றீடும் தொடர்ச்சியும் இடையிலான மூலமொழியின் திட்டமிட்ட தெளிவின்மையைத் தீர்த்துவிடாமல் விடுகிறது.
theological_decisions:
- issue: χάριν ἀντὶ χάριτος என்பதன் விளக்கம்
  choice: அருளுக்குப் பதிலாக அருளை
  alternative: அருள்மேல் அருள்; ஒன்றன்பின் ஒன்றாக அருள்
  rationale: ἀντί பொதுவாக ‘பதிலாக’ என்பதைக் குறித்தாலும், இங்கு ஒரு அருள் மற்றொன்றைத் தொடர்ந்து வருதல் அல்லது அதன் இடத்தை ஏற்றல் என்ற நுணுக்கமும் இருக்கலாம். முதன்மை உரை மாற்றீடு–தொடர்ச்சி சார்ந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது; இயல்பான மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘நிறைவு’ மற்றும் ‘அருள்’ ஆகியவை யோவான் உரையின் கருத்துச் செறிவைத் தக்கவைக்கின்றன. இறுதி சொற்றொடரின் உண்மையான தெளிவின்மையை முதன்மை உரையும் அடிக்குறிப்பும் இணைந்து பாதுகாக்கின்றன.
