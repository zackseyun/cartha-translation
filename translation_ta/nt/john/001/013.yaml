  source_fidelity: மூலக் கிரேக்கத்தின் மூவகை மறுப்பும் (οὐκ … οὐδὲ … οὐδὲ), இறுதியிலுள்ள ἀλλά எதிர்மறைத் திருப்பமும், ἐγεννήθησαν என்ற செயப்பாட்டு பிறப்புக் கருத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. “இரத்தங்கள்” என்பது αἱμάτων என்ற அசாதாரண பன்மையை வெளிப்படுத்துகிறது; அடிக்குறிப்பு அதன் மரபுவழி/மனிதப் பெற்றோர்வழிப் பொருளைத் தெளிவுபடுத்துகிறது. “மாம்சத்தின் விருப்பம்” மற்றும் “ஓர் ஆணின் விருப்பம்” ஆகியவை இயல்பான மனிதப் பிறப்பிற்கு எதிராகத் தேவனிடமிருந்து வரும் பிறப்பைச் சுட்டுகின்றன; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
  naturalness: “இவர்கள் … பிறந்தவர்கள் அல்ல; மாறாக, தேவனிடமிருந்து பிறந்தவர்கள்” என்ற அமைப்பு நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “இரத்தங்கள்” வழக்கத்திற்கு மாறானதாக இருப்பது மூலத்திலும் உள்ள குறியீட்டப்பட்ட அசாதாரணத்தன்மையை நோக்கத்துடன் காக்கிறது; அதற்கான வாசிப்புத் துணை அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
  terminology: “மாம்சம்,” “விருப்பம்,” “ஆண்,” “தேவனிடமிருந்து,” “பிறந்தவர்கள்” ஆகிய தெரிவுகள் மூலத்தின் சொல்-தொடர் வேறுபாடுகளையும் தெய்வீக/மனித மூலங்களின் எதிர்மறை அமைப்பையும் நன்றாகக் காக்கின்றன. “ஓர் ஆண்” ἀνδρός என்பதன் ஆண்-குறிப்பைத் தக்கவைக்கிறது; அதைத் தேவையின்றி பாலினநடுநிலையாக்கவில்லை.
