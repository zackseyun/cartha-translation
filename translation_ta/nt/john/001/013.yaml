source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: ta
  text: இவர்கள் இரத்தங்களிலிருந்தோ[a], மாம்சத்தின் விருப்பத்தினாலோ, ஓர் ஆணின் விருப்பத்தினாலோ பிறந்தவர்கள் அல்ல; மாறாக, தேவனிடமிருந்து பிறந்தவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் இயல்பாக, “வம்சவழியிலிருந்தோ.” கிரேக்கத்தில் “இரத்தங்கள்” என்ற வழக்கத்திற்கு மாறான பன்மை உள்ளது; அது இயற்கையான வம்சவழி அல்லது மனிதப் பெற்றோர் வழியான பிறப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: இவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைத் தொடர்புபடுத்தும் சார்புப்பெயரின் பணியைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: ἐξ αἱμάτων
  choice: இரத்தங்களிலிருந்து
  rationale: αἱμάτων என்பதன் வியப்பூட்டும் பன்மையைப் பாதுகாக்கிறது; இது இயற்கையான வம்சவழி அல்லது மனிதப் பெற்றோர் வழியான பிறப்பைக் குறிக்கும் மரபுத்தொடராகத் தெரிகிறது.
- source_word: θελήματος
  choice: விருப்பம்
  rationale: மனித இனப்பெருக்க விருப்பம் அல்லது சித்தத்தை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; இருமுறை வரும் மூலச்சொல்லுக்கும் ஒரே சொல்லைப் பயன்படுத்துகிறது.
- source_word: σαρκὸς
  choice: மாம்சம்
  rationale: மனித இயல்பான உடல்சார்ந்த இனப்பெருக்க உந்துதலைக் குறிக்கும் மூலப்படிமத்தைப் பாதுகாக்கிறது; இதை ‘பாவ இயல்பு’ என்று விளக்கி விடவில்லை.
- source_word: ἀνδρὸς
  choice: ஓர் ஆண்
  rationale: இங்கு ἀνήρ குறிப்பாக ஆண் மனிதரின் இனப்பெருக்கச் செயல்பாட்டைக் குறிக்கக்கூடும்; ஒருமையையும் பாலினக் குறிப்பையும் பாதுகாக்கிறது.
- source_word: ἐκ θεοῦ
  choice: தேவனிடமிருந்து
  rationale: முந்தைய மனித மூலங்களோடு உள்ள முரண்பாட்டைப் பாதுகாத்து, பிறப்பின் மூலம் அல்லது தோற்றம் தேவன் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγεννήθησαν
  choice: பிறந்தவர்கள்
  rationale: γεννάω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘பெறப்பட்டவர்கள்’ போன்ற தெளிவற்ற அல்லது செயற்கையான வடிவத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: மனித மூலத்துக்கும் தெய்வீக மூலத்துக்கும் இடையிலான வேறுபாடு
  choice: இயற்கை வம்சவழி, மனித உடல்சார்ந்த விருப்பம், ஆண் மனிதரின் விருப்பம் ஆகியவற்றால் அல்லாமல் தேவனிடமிருந்து உண்டான பிறப்பை வசனம் குறிப்பிடுகிறது.
  alternative: இதை இன அல்லது குல வம்சத்தை மட்டும் மறுக்கும் கூற்றாகக் குறுகலாக வாசிக்கலாம்; பிற்கால மரபுகளில் இதற்குச் சடங்கியல் அல்லது மெய்யியல் விளக்கங்களும் வழங்கப்படுகின்றன.
  rationale: மூன்று மனித மூலங்களை மறுத்து தேவனை மூலமாக வைக்கும் கிரேக்க அமைப்பைப் பாதுகாக்கிறது; அதேவேளையில் குறிப்பிட்ட மறுபிறப்பு கோட்பாட்டையோ சமயப்பிரிவு சார்ந்த விளக்கத்தையோ மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் மூவகை மறுப்பும் இறுதியிலுள்ள வலுவான எதிர்மறை மாற்றமும் ‘அல்ல; மாறாக’ என்ற அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளன. ‘இரத்தங்கள்’ என்ற அசாதாரண பன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
