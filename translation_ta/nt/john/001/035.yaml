  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: ta
  text: மறுநாள், யோவான் மீண்டும் நின்றுகொண்டிருந்தார்; அவருடைய சீடர்களில் இருவர் அவருடன் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: இந்தக் காலக்குறிப்பு ‘அடுத்த நாள்’ அல்லது ‘மறுநாள்’ என்று பொருள்படும். முந்தைய நிகழ்வுடன் இயல்பாகத் தொடரும் சுருக்கமான நவீனத் தமிழ் வடிவமாக ‘மறுநாள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய காட்சியில் நடந்ததுபோல் நிகழ்வு திரும்ப நடைபெறுவதை இது குறிக்கிறது; ‘மீண்டும்’ அந்தக் கதைத் தொடர்ச்சியை இயல்பாகக் காக்கிறது.
- source_word: εἱστήκει
  choice: அங்கே நின்றுகொண்டிருந்தார்
  rationale: இது கடந்தகாலத்தில் தொடர்ந்த நிலை அல்லது தோற்றநிலையைச் சுட்டுகிறது. ‘நின்றுகொண்டிருந்தார்’ அதன் நீடித்த தன்மையை வெளிப்படுத்துகிறது; இயல்பான தமிழுக்காக மூலத்தில் வெளிப்படையாக இல்லாத ‘அங்கே’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: ὁ Ἰωάννης
  choice: யோவான்
  rationale: பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம். சூழலில் இவர் திருமுழுக்கு யோவான் என்றாலும், மூலத்தில் ‘யோவான்’ என்று மட்டும் இருப்பதால் விரிவாக்கப்படவில்லை.
- source_word: καὶ
  choice: ; … உம்
  rationale: மூலத்தின் இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த அரைப்புள்ளியும் ‘இருவரும்’ என்பதிலுள்ள ‘உம்’ இணைப்பும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: அவருடைய சீடர்களில் இருவரும் அவருடன் இருந்தார்கள்
  rationale: ‘அவருடைய சீடர்களிலிருந்து இருவர்’ என்ற பகுதி-முழுமை உறவை ‘சீடர்களில் இருவர்’ தெளிவாகக் காக்கிறது. தமிழில் முழுமையான வாக்கியமாக அமைய, சூழலில் உள்ள உடனிருப்பை ‘அவருடன் இருந்தார்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
