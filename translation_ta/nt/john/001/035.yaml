  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மரியாதைப் பன்மை யோவானுக்குப் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் எளிய கதைநடை பேணப்பட்டு, தமிழுக்குத் தேவையான வினைச்சொற்கள் மட்டும் சூழலிலிருந்து நிரப்பப்பட்டுள்ளன.
