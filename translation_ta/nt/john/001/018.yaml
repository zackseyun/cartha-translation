  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: ta
  text: கடவுளை ஒருவரும் ஒருபோதும் கண்டதில்லை. தந்தையின் மார்பில் இருப்பவரான தனித்துவமிக்க கடவுள்[a][b] அவரை அறியச் செய்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘தனித்துவமிக்க கடவுள்’ என்பதற்குப் பதிலாக ‘ஒரே மகன்’ (அல்லது ‘ஒரேபேறான மகன்’) என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘தந்தையின் அருகில் இருப்பவர்.’ கிரேக்க மூலத்தில் சொல்லுக்குச் சொல் ‘தந்தையின் மார்பில் இருப்பவர்’ என்று உள்ளது; இது மிக நெருக்கமான உறவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவரை விளக்கிக் காட்டினார்’ அல்லது ‘அவரை வெளிப்படுத்தினார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: கடவுளை
  rationale: θεός இங்கு ἑώρακεν என்பதன் நேர்செயப்படுபொருளாக, கடவுளைக் குறிக்கும் வழக்கமான முழுமையான பொருளில் வருகிறது.
- source_word: οὐδεὶς … πώποτε
  choice: ஒருவரும் ஒருபோதும் … இல்லை
  rationale: உலகளாவிய மறுப்பையும் ‘எந்தக் காலத்திலும்’ என்ற வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ἑώρακεν
  choice: கண்டதில்லை
  rationale: முடிவுற்ற செயலும் இதுவரை நிலவும் விளைவும் உள்ள கிரேக்க நிறைவுக்காலத்தின் பொருள், πώποτε உடனான மறுப்பு அமைப்பில் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: μονογενὴς θεὸς
  choice: தனித்துவமிக்க ஒரே கடவுள்
  rationale: SBLGNT-இன் θεός வாசகத்தைப் பின்பற்றி, μονογενής என்பதன் ‘ஒரே வகையானவர்/தனித்துவமானவர்’ என்ற பொருளை வெளிப்படுத்துகிறது; ‘பிறப்பிக்கப்பட்ட’ என்ற சொற்பிறப்பியல் விளக்கத்தைத் தேவையின்றி உட்புகுத்தவில்லை.
- source_word: ὁ ὢν
  choice: இருப்பவரான
  rationale: முன் குறிப்பிடப்பட்டவரை விளக்கும் பெயரெச்சத் தொடராக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: தந்தையின் நெஞ்சோடு அணைந்திருப்பவரான
  rationale: κόλπος தரும் நெஞ்சு/மார்பு உருவகத்தையும் மிக நெருக்கமான உறவையும், தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκεῖνος
  choice: (வாக்கிய எழுவாயின் வலியுறுத்தலில் வெளிப்படுத்தப்பட்டது)
  rationale: தனியான ‘அவரே’ என்பதைச் சேர்ப்பது தமிழில் சாத்தியமானாலும், ‘தனித்துவமிக்க ஒரே கடவுள்’ என்ற எழுவாய் அமைப்பே இங்கு தேவையான வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ἐξηγήσατο
  choice: அவரை அறியச் செய்தார்
  rationale: விவரித்தல், விளக்குதல், வெளிப்படுத்துதல் ஆகிய பொருள் வரம்பில், இச்சூழலின் இறைவெளிப்பாட்டுச் செயலை தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: μονογενὴς θεὸς மற்றும் ὁ μονογενὴς υἱός ஆகிய உரைவேறுபாடுகள்
  choice: முதன்மை உரையில் SBLGNT வாசகத்தின்படி ‘தனித்துவமிக்க ஒரே கடவுள்’
  alternative: ‘ஒரே மகன்’ அல்லது ‘ஒரேபேறான மகன்’
  rationale: கொடுக்கப்பட்ட மூலப் பதிப்பு μονογενὴς θεός என்று வாசிப்பதால் அதுவே முதன்மை உரையில் மொழிபெயர்க்கப்படுகிறது; முக்கியமான கிறிஸ்தியல் உரைவேறுபாடு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- issue: μονογενής என்பதன் பொருள்
  choice: ‘தனித்துவமிக்க ஒரே’
  alternative: ‘ஒரேபேறான’ / ‘ஒரே பிறப்பான’
  rationale: இன்றைய சொல்லியல் சான்றுகள் இச்சொல்லுக்கு ‘ஒப்பற்ற, ஒரே வகையான’ என்ற பொருளை ஆதரிக்கின்றன. ‘பிறப்பிக்கப்பட்ட’ என்ற கருத்தை அந்தச் சொல்லின் நேரடி அகராதிப் பொருளாகத் திணிக்காமல், பாரம்பரிய மாற்றை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: ἐξηγήσατο வெளிப்படுத்தும் இறைவெளிப்பாடு
  choice: ‘அவரை அறியச் செய்தார்’
  alternative: ‘அவரை விளக்கினார்’ அல்லது ‘அவரை வெளிப்படுத்தினார்’
  rationale: குமாரர் தந்தையை அறிவிக்கிறார் என்ற சூழற்பொருளைத் தெளிவாகத் தருகிறது; வெறும் சொல்விளக்கமாகச் சுருக்குவதையும், கிரேக்க வினையின் பொருள் வரம்பை ஒரே இறையியல் சொல்லுக்குள் அடைப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நெஞ்சோடு அணைந்திருப்பவர்’ என்பது மூல உருவகத்தையும் உறவின் நெருக்கத்தையும் காக்கும் இயல்பான தமிழ். இறைவனைச் சுட்டும் ‘அவர்’ மரியாதை ஒருமையில் தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளது.
