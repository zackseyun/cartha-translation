  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: ta
  text: “இவரே, ‘எனக்குப் பின் ஒரு மனிதர் வருகிறார்; அவர் என்னை விட முன்னிலை பெற்றிருக்கிறார்[a], ஏனெனில் அவர் எனக்கு முன்பே இருந்தார்[b]’ என்று நான் கூறியவர்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் எனக்கு முன்னால் வந்துள்ளார்.” கிரேக்கச் சொற்றொடர் காலவரிசை முன்னுரிமையையோ மேலான நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் முன்பே இருந்தார்.” இச்சொற்கள் இயேசுவின் முன் இருப்பைக் குறிப்பதாகத் தோன்றினாலும், கிரேக்கத்தில் இது சுருக்கமாகவே கூறப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: இவரைத்தான்
  rationale: சுட்டுப்பெயரும் வினையும் தரும் வலியுறுத்தப்பட்ட அடையாளப்படுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: என்னைப் பற்றி நான் சொன்னது
  rationale: εἶπον உடன் வரும் ὑπέρ இங்கு ‘பற்றி/குறித்து’ என்ற பொருளைத் தருகிறது; முதல் நபர் வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: Ὀπίσω μου ἔρχεται
  choice: எனக்குப் பின் ... வருகிறார்
  rationale: ὀπίσω இங்கு இடத்தைக் காட்டுவதைவிட வருகையின் காலவரிசையைக் குறிக்கிறது.
- source_word: ἀνὴρ
  choice: ஒரு மனிதர்
  rationale: இயேசுவை ஓர் ஆண் மனிதராகக் குறிப்பிடும் சொல்லின் தன்மையை மரியாதையான இயல்புத் தமிழில் காக்கிறது.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: அவர் எனக்கு முன்னானவராகியிருக்கிறார்
  rationale: perfect வினை வடிவின் விளைவுநிலையையும், முன்னுரிமை அல்லது மேலான நிலை என்ற இரு சாத்தியங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை நேரடியாகக் காட்டுகிறது.
- source_word: πρῶτός μου ἦν
  choice: அவர் எனக்கு முன்பே இருந்தார்
  rationale: கால முன்னிருப்பையும் மேன்மை சார்ந்த நுட்பத்தையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொற்றொடரின் சுருக்கமான இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதிக் கூறு கிறிஸ்துவின் முன் இருப்பை எவ்வளவு வெளிப்படையாகச் சொல்ல வேண்டும்
  choice: அவர் எனக்கு முன்பே இருந்தார்
  alternative: அவர் எனக்கு முன்பே இருந்துவந்தார் / அவர் என்னைவிட முன்னிலை பெற்றவர்
  rationale: யோவான் நற்செய்தியின் சூழல் இயேசுவின் முன் இருப்பை வலுவாகக் குறித்தாலும், மூலத்தின் சுருக்கத்தையும் கால முன்னுரிமை–மேன்மை இடையேயான பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
- issue: ἔμπροσθέν μου γέγονεν என்பதிலுள்ள முன்னுரிமையின் இயல்பு
  choice: எனக்கு முன்னானவராகியிருக்கிறார்
  alternative: என்னைவிட முன்னிலை பெற்றிருக்கிறார்
  rationale: தரநிலை மேன்மையை மட்டும் கட்டாயப்படுத்தாமல், முன்னே வந்த நிலை மற்றும் முன்னுரிமை இரண்டிற்கும் இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். மேற்கோளுக்குள் யோவானின் சாட்சியத்தின் ஒப்பீட்டு அமைப்பு காக்கப்பட்டுள்ளது. ‘மனிதர்’ என்பது ἀνήρ என்பதன் ஆண்பால் குறிப்பை இயல்பாகத் தக்கவைக்கிறது; அடிக்குறிப்புகள் மூலத்தின் உண்மையான சொற்பொருள் மற்றும் இறையியல் நுட்பங்களைத் திறந்தவையாக வைக்கின்றன.
