id: JHN.1.31
reference: John 1:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: ta
  text: நானும் அவரை அறியவில்லை[a]. ஆனால், அவர் இஸ்ரவேலுக்கு வெளிப்படுத்தப்படும்படியாக, இந்த நோக்கத்திற்காகவே நான் தண்ணீரில் திருமுழுக்கு கொடுக்க வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை அடையாளம் கண்டிருக்கவில்லை.’ கிரேக்கச் சொல் அறிமுகமின்மையையோ அடையாளம் காணாமையையோ குறிக்கலாம்; முதன்மை உரை அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதன் தொடர்ச்சி மற்றும் மென்மையான வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: அவரை அறிந்திருக்கவில்லை
  rationale: கடந்தகாலத்தில் நிலவிய அறியாமையைத் தெரிவிக்கிறது; தனிப்பட்ட அறிமுகமின்மையா அடையாளம் காணாமையா என்பதைத் தீர்மானிக்காமல் கிரேக்கத்தின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய அறியாமைக்கும் திருமுழுக்குப் பணியின் நோக்கத்திற்கும் இடையிலான முரண்பாட்டைக் குறிக்கிறது.
- source_word: ἵνα φανερωθῇ
  choice: வெளிப்படுத்தப்படுவதற்காக
  rationale: ἵνα-வின் நோக்கப் பொருளையும் φανερόω-வின் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
- source_word: τῷ Ἰσραὴλ
  choice: இஸ்ரவேலுக்கு
  rationale: மூலத்தின் தந்தைவேற்றுமையை நேரடியாகவும் இயல்பாகவும் தருகிறது; இஸ்ரவேலை ஒரு கூட்டுச் சமூகமாகக் குறிப்பிடுகிறது.
- source_word: διὰ τοῦτο
  choice: அதற்காகவே
  rationale: இதுவே யோவான் வந்ததற்கான காரணம்/நோக்கம் என்பதை வலியுறுத்தி, தமிழில் அடுத்த நோக்கக் கூறுடன் இயல்பாக இணைக்கிறது.
- source_word: ἦλθον ἐγὼ
  choice: நான் ... வந்தேன்
  rationale: இறந்தகாலச் செயலை நேரடியாகத் தருகிறது; வெளிப்படையான ἐγώ-வின் வலியுறுத்தல் தமிழ் எழுவாயால் தக்கவைக்கப்படுகிறது.
- source_word: ἐν ὕδατι
  choice: தண்ணீரில்
  rationale: ἐν என்பதன் இடப்பொருளை நேரடியாகப் பாதுகாக்கிறது; 'தண்ணீரால்' என கருவிப்பொருளாக மட்டும் சுருக்கவில்லை.
- source_word: βαπτίζων
  choice: திருமுழுக்குக் கொடுத்துக்கொண்டு
  rationale: முதன்மை வினையோடு ஒரே காலத்தில் தொடர்ந்த செயலைப் பங்கேற்பு வடிவத்திற்கேற்ப காட்டுகிறது; வழக்கிலுள்ள மரியாதையான தமிழ் வேதாகமச் சொல்லைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: யோவான் இயேசுவை ‘அறிந்திருக்கவில்லை’ என்பதன் பொருள்
  choice: தனிப்பட்ட அறிமுகமின்மை அல்லது மேசியாவாக அடையாளம் காணாமை என்று குறிப்பாகத் தீர்மானிக்காமல் ‘அறிந்திருக்கவில்லை’ என மொழிபெயர்த்தல்
  alternative: அவரை அடையாளம் கண்டிருக்கவில்லை
  rationale: வசனம் அந்த அறியாமையின் தன்மையை விளக்கவில்லை. பரந்த மொழிபெயர்ப்பு உண்மையான தெளிவின்மையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘திருமுழுக்கு’ என்பது βαπτίζω-வுக்கான நிலைபெற்ற சமயச் சொல்; ‘தண்ணீரில்’ என்பது மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது. நோக்கக் கூறு தமிழில் இயல்பாக அமைய முன்வைக்கப்பட்டுள்ளது.
