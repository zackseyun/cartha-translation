- from: நானும் அவரை அறிந்திருக்கவில்லை[a]. ஆனால் அவர் இஸ்ரவேலுக்கு வெளிப்படுத்தப்படுவதற்காகவே நான் தண்ணீரில் திருமுழுக்குக் கொடுத்துக்கொண்டு வந்தேன்.
  to: நானும் அவரை அறியவில்லை[a]. ஆனால், அவர் இஸ்ரவேலுக்கு வெளிப்படுத்தப்படும்படியாக, இந்த நோக்கத்திற்காகவே நான் தண்ணீரில் திருமுழுக்கு கொடுக்க வந்தேன்.
