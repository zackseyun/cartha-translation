id: JHN.1.25
reference: John 1:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: ta
  text: அவர்கள் அவரிடம் கேள்வி எழுப்பி, “அப்படியானால், நீர் மேசியாவும் அல்ல, எலியாவும் அல்ல, அந்தத் தீர்க்கதரிசியும் அல்ல என்றால், ஏன் திருமுழுக்கு அளிக்கிறீர்?” என்று சொன்னார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தத் தீர்க்கதரிசி” என்பது மோசேயைப் போன்ற ஒரு தீர்க்கதரிசியைப் பற்றிய எதிர்பார்ப்பைக் குறிக்கலாம் (உபாகமம் 18:15 பார்க்க).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: அவரிடம் கேள்வி எழுப்பி ... என்று கேட்டார்கள்
  rationale: கிரேக்கத்தில் ‘கேட்டார்கள்’ மற்றும் ‘அவரிடம் சொன்னார்கள்’ என்ற இரு வினைகள் இருந்தாலும், அவற்றைத் தமிழில் அப்படியே இரட்டிப்பது செயற்கையாக ஒலிக்கும். ‘கேள்வி எழுப்பி ... என்று கேட்டார்கள்’ என்பது இரு வினைகளின் உரையாடல் அறிமுகப் பணியையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: Τί οὖν βαπτίζεις
  choice: அப்படியானால் ... ஏன் திருமுழுக்குக் கொடுக்கிறீர்?
  rationale: இங்கு τί என்பது செயலுக்கான காரணம் அல்லது அதிகார அடிப்படையை வினவுகிறது; οὖν முந்தைய மறுப்புகளிலிருந்து வரும் முடிவைச் சுட்டுகிறது. நிகழ்கால βαπτίζεις யோவானின் தொடரும் நடைமுறையைக் குறிக்கிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: Χριστός இங்கு ஒரு பெயராக அல்ல, யூதர்களால் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவருக்குரிய பட்டமாக வருகிறது. ‘மேசியா’ அந்த வரலாற்றுச் சூழலைத் தக்கவைக்கிறது.
- source_word: Ἠλίας
  choice: எலியா
  rationale: வேதாகமத் தமிழில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ προφήτης
  choice: அந்தத் தீர்க்கதரிசி
  rationale: குறிப்பிட்ட, உரையாடுபவர்களுக்கு ஏற்கெனவே அறியப்பட்ட எதிர்பார்க்கப்பட்ட நபரை கிரேக்க உருபு சுட்டுகிறது. தமிழில் ‘அந்த’ என்பது இந்தக் குறிப்புத்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδὲ ... οὐδὲ
  choice: '...வும் அல்ல, ...வும் அல்ல'
  rationale: முந்தைய மறுப்புடன் இணைக்கப்பட்ட மூன்று மாற்றுகளையும் கிரேக்கத்தின் தொடர்ச்சியான மறுப்பு அமைப்புக்கு ஏற்ற தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: βαπτίζεις
  choice: திருமுழுக்குக் கொடுக்கிறீர்
  rationale: வழிபாட்டு மரபுகளில் பரவலாகப் புரியப்படும் நவீன தமிழ்ச் சொற்றொடர்; செயலை வெறும் நீராட்டலாகக் குறுக்காமல் அதன் சடங்குசார் பொருளை எடுத்துரைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதை யோவான் நற்செய்தியின் அடையாளக் கேள்வியில் எவ்வாறு வழங்குவது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் ஒரு தனிப்பெயராக அல்ல, எதிர்பார்க்கப்பட்ட பட்டமாகச் செயல்படுகிறது. ‘மேசியா’ யூத மேசிய எதிர்பார்ப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: ὁ προφήτης ஒரு குறிப்பிட்ட எதிர்பார்க்கப்பட்ட நபரைக் குறிக்கிறதா
  choice: அந்தத் தீர்க்கதரிசி
  alternative: தீர்க்கதரிசி
  rationale: கிரேக்கத்தின் வரையறை உருபும் சூழலில் எலியாவிலிருந்து தனியாகப் பட்டியலிடப்படுவதும் ஒரு குறிப்பிட்ட எதிர்பார்க்கப்பட்ட நபரைச் சுட்டுகின்றன. இது உபாகமம் 18:15-இல் மோசேயைப் போன்ற தீர்க்கதரிசியைப் பற்றிய எதிர்பார்ப்புடன் தொடர்புடையதாக இருக்கலாம்; அந்த அடையாளத்தை முதன்மை உரையில் உறுதியாகத் தீர்மானிக்கவில்லை.
- issue: βαπτίζεις என்பதற்கான தமிழாக்கம்
  choice: திருமுழுக்குக் கொடுக்கிறீர்
  alternative: ஞானஸ்நானம் கொடுக்கிறீர்
  rationale: ‘திருமுழுக்கு’ இயல்பான தற்போதைய தமிழில் செயலைக் குறிக்கிறது; குறிப்பிட்ட திருச்சபை மரபின் சொற்பயன்பாட்டை கட்டாயப்படுத்தாது. கிரேக்கச் சொல் தண்ணீரில் ஆழ்த்துதல் அல்லது கழுவுதல் சார்ந்த பரப்பைக் கொண்டிருந்தாலும், இங்கு யோவானின் அறியப்பட்ட சடங்குச் செயல் குறிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் ‘நீர்/கொடுக்கிறீர்’ வடிவம் கண்ணியமான தொனியைத் தருகிறது. ‘மேசியா’ பட்டத்தன்மையையும் ‘அந்தத் தீர்க்கதரிசி’ கிரேக்க வரையறை உருபின் குறிப்புத்தன்மையையும் காக்கின்றன. தமிழில் செயற்கையான ‘கேட்டு அவரிடம் சொன்னார்கள்’ என்ற இரட்டிப்பைத் தவிர்த்து, இரண்டு கிரேக்க வினைகளின் செயல்பாடு இயல்பான ஒரே வாக்கிய அமைப்பில் பாதுகாக்கப்பட்டுள்ளது.
