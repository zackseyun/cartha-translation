id: JHN.1.47
reference: John 1:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ta
  text: இயேசு நத்தனியேல் தம்மிடம் வருவதைக் கண்டு, அவரைக் குறித்து, “இதோ, உண்மையிலேயே ஒரு இஸ்ரவேலர்; இவரிடம் வஞ்சகம் இல்லை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கக் கட்டளையின் இயல்பையும், இச்சூழலில் இயேசு நத்தனியேலைச் சுட்டிக்காட்டுவதையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: உண்மையிலேயே ஒரு இஸ்ரவேலர்
  rationale: ἀληθῶς என்பதன் வலியுறுத்தலைக் காத்து, நத்தனியேலின் உண்மைத்தன்மையைச் சுட்டும் சொல்லமைப்பைத் தெளிவாக அளிக்கிறது.
- source_word: δόλος
  choice: வஞ்சகம்
  rationale: ஏமாற்றும் நோக்கமுள்ள சூழ்ச்சி அல்லது கபடம் என்ற கிரேக்கச் சொல்லின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν ᾧ ... οὐκ ἔστιν
  choice: இவரிடம் ... இல்லை
  rationale: சொல்லுக்கு சொல் 'இவரில்' என்பதைக் காட்டிலும் நபரின் குணத்தில் அது இல்லை என்ற பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: “உண்மையான இஸ்ரவேலர்” என வகைப்படுத்தலாமா, அல்லது ἀληθῶς என்பதை வினையடைப் பொருளில் காக்கலாமா
  choice: “உண்மையிலேயே ஒரு இஸ்ரவேலர்” என்று வினையடைப் பொருளைக் காத்தல்
  alternative: “உண்மையான இஸ்ரவேலர்”
  rationale: கிரேக்கத்தில் ἀληθῶς தனியாக வலியுறுத்தும் வினையடையாக உள்ளது; அதை 'உண்மையான' என்ற பெயரடையாக மாற்றி, 'மெய்யான இஸ்ரவேலர்' என்ற தனிப்பட்ட இறையியல் வகையைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “தம்மிடம்” இயேசுவை மரியாதையுடன் மீள்சுட்டுகிறது; “அவரைக் குறித்து” நத்தனியேலைக் குறிக்கிறது. மூலத்தின் நிகழ்கால λέγει, கதைசொல்லும் தமிழில் இயல்பான இறந்தகாலமான “என்றார்” என வழங்கப்பட்டது.
