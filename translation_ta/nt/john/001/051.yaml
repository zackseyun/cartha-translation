id: JHN.1.51
reference: John 1:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: ta
  text: 'அவர் அவனிடம், “உறுதியாக, உறுதியாக நான் உங்களுக்குச் சொல்கிறேன்[a]: வானம் திறந்திருக்கிறதையும், கடவுளின் தூதர்கள் மானிடமகன்மேல் ஏறிச் செல்வதையும் இறங்கி வருவதையும் நீங்கள் காண்பீர்கள்” என்றார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களுக்குச்’ என்றும் ‘நீங்கள் காண்பீர்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ள சொற்கள் கிரேக்கத்தில் பன்மை; இயேசு நத்தனியேலிடம் பேசத் தொடங்கினாலும், இங்கு உரை பலரை நோக்கி விரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்தப் படிமம் ஆதியாகமம் 28:12-ல் யாக்கோபு கண்ட கனவை எதிரொலிக்கிறது; இங்கு தூதர்களின் ஏறி இறங்குதல் மானிடமகன்மேல் மையங்கொள்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: இருமுறை கூறப்படும் வலியுறுத்தலையும் உரையின் ஆணித்தரமான தொடக்கத்தையும் காக்கிறது; ‘ஆமென், ஆமென்’ என்பதை மொழிபெயர்க்காமல் விடுவதைக் காட்டிலும் இன்றைய வாசகருக்கு பொருள் தெளிவாகிறது.
- source_word: ὑμῖν / ὄψεσθε
  choice: உங்களுக்குச் / நீங்கள் காண்பீர்கள்
  rationale: இரண்டும் கிரேக்கத்தில் பன்மை. தமிழ் வடிவமே பன்மையை வெளிப்படையாகக் காட்டுவதால், நத்தனியேலைத் தாண்டிய கேட்போர் வட்டமும் பிரதான உரையிலேயே பாதுகாக்கப்படுகிறது.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: வானம் திறந்திருக்கிறதை
  rationale: நிறைவுற்ற வினையெச்சம், திறக்கப்பட்டு அந்த நிலையில் இருக்கும் வானத்தைச் சுட்டுகிறது; ‘திறந்திருக்கிறது’ அந்த நிலைத்த விளைவை இயல்பான தமிழில் தருகிறது.
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: கடவுளின் தூதர்கள்
  rationale: ‘தூதர்கள்’ என்பது ἄγγελοι என்பதன் அடிப்படைப் பொருளைத் தருகிறது; இந்தத் தரிசனச் சூழலில் அவர்கள் வானதூதர்கள் என்பது தெளிவாக உள்ளது.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: ஏறிச் செல்வதையும் இறங்கி வருவதையும்
  rationale: இரு திசை இயக்கத்தையும் இயல்பான நவீனத் தமிழில் காத்து, ஆதியாகமம் 28:12-ன் எதிரொலியையும் மறைக்கவில்லை.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மானிடமகன்மேல்
  rationale: ἐπί + வேற்றுமை வடிவத்தின் ‘மேல்’ என்ற படிமத்தை அப்படியே காக்கிறது; இயக்கம் மானிடமகனைச் சார்ந்ததாக இருப்பதை விளக்கவுரையால் தீர்மானிக்காமல் விடுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் தனிச்சிறப்பான சுயக்குறிப்பையும் அதன் வேதாகம எதிரொலிகளையும் சுருக்கமாகவும் மரியாதையான நவீனத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: தொடக்கத்தில் ஒருமை αὐτῷ (‘அவனிடம்’) இருந்தும், நேர்க் கூற்றில் ὑμῖν மற்றும் ὄψεσθε பன்மையாக மாறுகின்றன.
  choice: ‘அவனிடம்’ என்ற ஒருமையையும் ‘உங்களுக்குச்... நீங்கள்’ என்ற பன்மையையும் பிரதான உரையில் வெளிப்படையாகக் காட்டுதல்.
  alternative: முழுவதையும் ஒருமையாக மொழிபெயர்த்து, பன்மையை அடிக்குறிப்பில் மட்டும் குறிப்பிடுதல்.
  rationale: தமிழ் எண் வேறுபாட்டைத் தெளிவாகக் காட்டுவதால், கிரேக்க உரையின் நோக்கமுள்ள மாற்றத்தை இயல்பாகவும் துல்லியமாகவும் பிரதான உரையிலேயே பாதுகாக்க முடிகிறது.
- issue: ஏறி இறங்கும் தூதர்களின் படிமம் யாக்கோபின் கனவை எதிரொலித்து, இயக்கத்தை மானிடமகன்மேல் மையப்படுத்துகிறது.
  choice: படிமத்தை விளக்கவுரை சேர்க்காமல் பிரதான உரையில் காத்து, தொடர்பை அடிக்குறிப்பில் சுட்டுதல்.
  alternative: மானிடமகனே வானத்துக்கும் பூமிக்கும் இடையிலான வழி என்று பிரதான உரையில் விளக்கிப் பொருளுரைத்தல்.
  rationale: அத்தகைய கருத்து சாத்தியமான விளக்கமாக இருந்தாலும், கிரேக்க உரை படிமத்தின் உறவை மட்டும் கூறுகிறது; அதன் முழுத் தத்துவப் பொருளை மொழிபெயர்ப்பு தீர்மானிக்கக் கூடாது.
- issue: ἐπί என்பதன் தொடர்பு ‘மேல்’, ‘மீது’, அல்லது ‘சார்ந்து’ எனப் புரிந்துகொள்ளப்படலாம்.
  choice: ‘மானிடமகன்மேல்’ என்று படிமத்தை நேரடியாகக் காத்தல்.
  alternative: ‘மானிடமகனிடம்’ அல்லது ‘மானிடமகன் வழியாக’ என்று விளக்குதல்.
  rationale: ‘மேல்’ என்பது மூலத்தின் உருவகத் திறந்த தன்மையைக் காக்கிறது; மற்ற வடிவங்கள் உறவின் தன்மையை அதிகமாக விளக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் மரியாதையும் வேதாகமப் படிமத்தின் செறிவும் காக்கப்பட்டுள்ளன. ‘வானம் திறந்திருக்கிறது’ என்பது நிறைவுற்ற நிலையைத் தருகிறது; ‘மானிடமகன்’ நிறுவப்பட்ட தலைப்பின் இறையியல் மற்றும் இலக்கிய எதிரொலிகளைப் பாதுகாக்கிறது.
