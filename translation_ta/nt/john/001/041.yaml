source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: ta
  text: அவர் முதலில் தம் சொந்தச் சகோதரரான சீமோனைக் கண்டுபிடித்து, அவரிடம், “நாங்கள் மேசியாவைக் கண்டுபிடித்திருக்கிறோம்” என்றார். (‘மேசியா’ என்பதன் மொழிபெயர்ப்பு ‘கிறிஸ்து’ ஆகும்.)
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: கண்டுபிடித்து
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலத் தொடராக வழங்குகிறது.
- source_word: οὗτος
  choice: அவர்
  rationale: சூழலில் இது அந்திரேயாவைக் குறிக்கிறது; ‘இவர்’ என்று சொற்சொல்லாக வழங்குவதைவிடத் தமிழ் உரைநடையில் இயல்பாக உள்ளது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: அந்திரேயா செய்த முதல் செயல் இதுவே என்ற காலவரிசை வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: தன் சொந்த சகோதரனாகிய
  rationale: ἴδιον தரும் வலியுறுத்தலை ‘சொந்த’ என்பதன் மூலம் பாதுகாக்கிறது.
- source_word: Σίμωνα
  choice: சீமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: λέγει αὐτῷ
  choice: அவரிடம் … என்றார்
  rationale: வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலமாக மாற்றியும், ‘சொன்னார்’ என்பதற்குப் பதிலாக நேரடி உரையைத் தெளிவாக இணைக்கிறது.
- source_word: Εὑρήκαμεν
  choice: கண்டுகொண்டோம்
  rationale: முன்னர் நிகழ்ந்த கண்டடைதலின் தற்போதைய விளைவை உணர்த்தும் கிரேக்க நிறைவுக்காலத்தின் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Μεσσίαν
  choice: மேசியா
  rationale: செமித்திய பட்டத்தை ஒலிபெயர்த்து, யூத மேசிய எதிர்பார்ப்பின் வரலாற்றுச் சூழலைப் பாதுகாக்கிறது.
- source_word: μεθερμηνευόμενον
  choice: என்பதன் மொழிபெயர்ப்பு
  rationale: செமித்தியப் பட்டத்திற்கான கிரேக்க மொழிபெயர்ப்பை யோவான் தருகிறார் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: χριστός
  choice: கிறிஸ்து
  rationale: மூலத்தில் Μεσσίας என்பதற்குக் கொடுக்கப்பட்ட கிரேக்கப் பட்டத்தின் மரபாக நிலைபெற்ற தமிழ் வடிவத்தைப் பாதுகாக்கிறது; அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மேசியப் பட்டங்களான Μεσσίας மற்றும் χριστός ஆகியவற்றின் தொடர்பு
  choice: முதன்மை உரையில் ‘மேசியா … கிறிஸ்து’ என்று இரு வேறுபட்ட மொழிவடிவங்களையும் வைத்திருக்கிறது.
  alternative: ‘மேசியா … அபிஷேகம் பெற்றவர்’ அல்லது இரண்டையும் ‘மேசியா’ என்று வழங்குதல்.
  rationale: யோவானின் அடைப்புக்குறிப்பு செமித்திய Μεσσίας என்பதற்கு கிரேக்க χριστός இணை என்று விளக்குகிறது. இரண்டையும் ‘மேசியா’ என வழங்குவது விளக்கத்தின் நோக்கத்தை மறைக்கும்; ‘அபிஷேகம் பெற்றவர்’ மட்டும் என வழங்குவது வாசகர்களுக்குப் பரிச்சயமான ‘கிறிஸ்து’ பட்டத்தை மூல உரையிலிருந்து அகற்றும். ஆகவே ‘கிறிஸ்து’ முதன்மை உரையிலும் அதன் சொற்பொருள் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கதைசொல்லலில் கிரேக்க வரலாற்று நிகழ்காலம் இயல்பான தமிழ் இறந்தகாலமாக வழங்கப்பட்டுள்ளது; பெயர்களும் நிலைபெற்ற பட்டங்களும் வழக்கமான தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
