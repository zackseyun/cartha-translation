revisions:
- from: அவர் முதலில் தன் சொந்த சகோதரனாகிய சீமோனைக் கண்டுபிடித்து, அவரிடம், “மேசியாவைக் கண்டுகொண்டோம்” என்றார். (‘மேசியா’ என்பதன் மொழிபெயர்ப்பு ‘கிறிஸ்து’[a].)
  to: அவர் முதலில் தம் சொந்தச் சகோதரரான சீமோனைக் கண்டுபிடித்து, அவரிடம், “நாங்கள் மேசியாவைக் கண்டுபிடித்திருக்கிறோம்” என்றார். (‘மேசியா’ என்பதன் மொழிபெயர்ப்பு ‘கிறிஸ்து’ ஆகும்.)
  rationale: The revision improves the Tamil rendering of the Greek perfect and makes the authorial translation gloss explicit. It preserves the distinction and relationship between Μεσσίας and χριστός, while the footnote retains the semantic explanation of χριστός. The footnote marker is retained on ‘கிறிஸ்து.’
  reviewer_model: gpt-5.6-terra
