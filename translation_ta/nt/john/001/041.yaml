    text: ‘கிறிஸ்து’ என்றால் ‘அபிஷேகம் பெற்றவர்’ என்று பொருள்.
    reason: ‘மேசியா’ என்பதற்கான கிரேக்க இணையான χριστός என்ற பட்டத்தின் சொற்பொருளை விளக்குகிறது.
  revision_rationale: The revision improves the Tamil rendering of the Greek perfect and makes the authorial translation gloss explicit. It preserves the distinction and relationship between Μεσσίας and χριστός, while the footnote retains the semantic explanation of χριστός. The footnote marker is retained on ‘கிறிஸ்து.’
