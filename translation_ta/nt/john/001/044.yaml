translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் மீளுரைப்பை அப்படியே கடினமாகப் பிரதிபலிக்காமல், பெத்சாயிதாவே அந்திரேயா மற்றும் பேதுருவுடன் தொடர்புடைய ஊர் என்பதைத் தெளிவாகவும் இயல்பாகவும் அளிக்கிறது.
