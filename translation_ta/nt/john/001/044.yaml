base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: ta
  text: பிலிப்பு பெத்சாயிதாவைச் சேர்ந்தவர்; அது அந்திரேயா மற்றும் பேதுருவின் ஊர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்திரேயா மற்றும் பேதுருவின் நகரம்”; அதாவது, அவர்களுடைய சொந்த ஊர்.
    reason: ‘அந்திரேயா மற்றும் பேதுருவின் ஊர்’ என்ற மூலத்தின் சுருக்கமான உடைமை/தொடர்பை வேறுவிதமாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: ἦν
  choice: சேர்ந்தவர்
  rationale: இங்கு εἰμί என்பதன் இறந்தகால வடிவம் பிலிப்புவின் பிறப்பிடம் அல்லது சொந்த ஊரைச் சுட்டுகிறது. தமிழில் ‘பெத்சாயிதாவைச் சேர்ந்தவர்’ என்பது இயல்பாகவும் துல்லியமாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ ஒரு மென்மையான உரைத் தொடர்பை ஏற்படுத்துகிறது. இவ்வசனத்தின் தமிழ்நடை ஓட்டத்தில் தனி இணைப்புச்சொல் இல்லாமலேயே அந்தத் தொடர்பு இயல்பாகப் புலப்படுகிறது.
- source_word: Φίλιππος
  choice: பிலிப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: ἀπὸ Βηθσαϊδά
  choice: பெத்சாயிதாவைச் சேர்ந்தவர்
  rationale: ἀπό இங்கு மூலம் அல்லது ஊர்ச் சார்பைக் குறிக்கிறது; தமிழில் இந்த அமைப்பு இயல்பானது.
- source_word: ἐκ τῆς πόλεως
  choice: ஊர்
  rationale: πόλις என்பதற்கு நகரம் அல்லது ஊர் என்று பொருள் கொள்ளலாம். இங்கு நபர்களின் சொந்த இடத்தை இயல்பாகக் குறிப்பிட ‘ஊர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: அந்திரேயாவும் பேதுருவும் வாழ்ந்த
  rationale: πόλεως என்பதோடு இணையும் வேற்றுமை வடிவம் அவர்களுடன் அந்த ஊருக்குள்ள தொடர்பைச் சுட்டுகிறது. ‘வாழ்ந்த’ என்பது அவர்களுடைய ஊர் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; பிறப்பிடம் என்று தேவையின்றி குறுக்குவதில்லை.
