id: JHN.1.9
reference: John 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: ta
  text: ஒவ்வொரு மனிதருக்கும் ஒளியளிக்கும் உண்மையான ஒளி[a] உலகத்திற்குள் வந்து கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உலகத்திற்குள் வரும் ஒவ்வொரு மனிதருக்கும் ஒளியளிக்கும் உண்மையான ஒளி இருந்தது.” ‘வரும்’ என்ற கிரேக்கப் பங்கேற்பெயரை ‘உண்மையான ஒளி’ என்பதற்குப் பதிலாக ‘ஒவ்வொரு மனிதர்’ என்பதோடும் இணைத்துப் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ஒளி
  rationale: யோவானின் சூழலில் கிறிஸ்துவைக் குறித்தாலும், கிரேக்கத்தின் பொதுப்பெயரை இயல்பாகவும் உருவக வலிமையுடனும் தருகிறது.
- source_word: ἀληθινόν
  choice: உண்மையான
  rationale: வெறுமனே பொய்யல்லாதது என்பதைவிட மெய்யானதும் முழுநிறைவானதுமான ஒளி என்ற யோவானிய நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: φωτίζει
  choice: ஒளியளிக்கிற
  rationale: ஒளி தருதல் என்ற அடிப்படை உருவகத்தைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது; ‘அறிவொளியூட்டுகிற’ என்பது பொருளை அறிவுசார் திசையில் குறுக்கக்கூடும்.
- source_word: πάντα ἄνθρωπον
  choice: ஒவ்வொரு மனிதருக்கும்
  rationale: தனித்த ஒருமை வடிவத்தின் பகிர்ந்தளிக்கும் பொருளைத் தக்கவைத்து, பாலின வேறுபாடின்றி மனிதர் ஒவ்வொருவரையும் குறிக்கிறது.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: உலகத்திற்குள் வந்துகொண்டிருந்தது
  rationale: முதன்மை வாசிப்பில் பங்கேற்பெயரை உண்மையான ஒளியோடு பொருளடிப்படையில் இணைத்து, ἦν உடன் தொடர்நிலை வருகையாகத் தருகிறது.
- source_word: κόσμον
  choice: உலகம்
  rationale: κόσμος என்பதற்கான இயல்பான யோவானிய இணை; இங்கு குறுகிய பொருள் தேவைப்படவில்லை.
- source_word: ἦν
  choice: இருந்தது (வந்துகொண்டிருந்தது என்பதில் இணைக்கப்பட்டது)
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலையைத் தமிழில் ‘வந்துகொண்டிருந்தது’ என்ற வினைத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐρχόμενον (‘வருகிற/வந்துகொண்டிருந்த’) என்பதன் தொடரியல் இணைப்பு
  choice: '‘உண்மையான ஒளி’ என்பதோடு பொருளடிப்படையில் இணைத்தல்: ஒளி உலகத்திற்குள் வந்துகொண்டிருந்தது.'
  alternative: '‘ஒவ்வொரு மனிதர்’ என்பதோடு இலக்கணரீதியாக இணைத்தல்: உலகத்திற்கு வரும் ஒவ்வொரு மனிதருக்கும் உண்மையான ஒளி ஒளியளிக்கிறது.'
  rationale: ἐρχόμενον என்பது இலக்கணரீதியாக ἄνθρωπον என்பதோடு இணையக்கூடும். எனினும் முன்னுரையின் சூழலும் யோவானில் ‘உலகத்திற்குள் வருதல்’ என்ற கிறிஸ்துவியல் பயன்பாடும் ஒளியின் வருகையை முதன்மை வாசிப்பாக ஆதரிக்கின்றன. உண்மையான இருபொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘ஒளி’ சிற்றெழுத்து/பொதுப்பெயராக வைக்கப்பட்டுள்ளது. ‘மனிதர்’ என்பது இங்கு ஆண்-பெண் அனைவரையும் உள்ளடக்கும் பொதுப்பெயர். அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
