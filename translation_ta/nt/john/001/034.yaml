    text: சில கையெழுத்துப் பிரதிகளில், “கடவுளின் தேர்ந்தெடுக்கப்பட்டவர்” என்பதற்குப் பதிலாக “கடவுளுடைய மகன்” என்று உள்ளது.
    reason: textual_variant
  revision_rationale: The revision changes only the rendering of τοῦ θεοῦ from an instrumental phrase to a genitive phrase, preserving the Greek title’s form and avoiding an unnecessary interpretive recasting. The textual-variant footnote is retained and updated so that its lemma exactly matches the revised main text.
