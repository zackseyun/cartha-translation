id: JHN.1.34
reference: John 1:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: ta
  text: நானும் கண்டிருக்கிறேன்; இவரே கடவுளின் தேர்ந்தெடுக்கப்பட்டவர் என்று சாட்சி அளித்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “கடவுளின் தேர்ந்தெடுக்கப்பட்டவர்” என்பதற்குப் பதிலாக “கடவுளுடைய மகன்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: நானும்
  rationale: καί + ἐγώ என்பதன் தொடர்ச்சியையும் வலியுறுத்தப்பட்ட எழுவாயையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἑώρακα
  choice: கண்டிருக்கிறேன்
  rationale: நிறைவேற்றுக் காலத்தின் கடந்த நிகழ்வும் தொடரும் விளைவும் தமிழின் ‘-இருக்கிறேன்’ அமைப்பால் பாதுகாக்கப்படுகின்றன.
- source_word: μεμαρτύρηκα
  choice: சாட்சி அளித்திருக்கிறேன்
  rationale: நிறைவேற்றப்பட்ட சாட்சியின் தொடரும் செல்லுபடித்தன்மையைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இங்கு சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கவில்லை.
- source_word: οὗτός
  choice: இவரே
  rationale: இயேசுவை நேரடியாகச் சுட்டுவதையும் வலியுறுத்தலையும் மரியாதையான, இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ ἐκλεκτός
  choice: தேர்ந்தெடுக்கப்பட்டவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையைத் தெளிவான தமிழில் நபரைக் குறிக்கும் வடிவில் தருகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளால்
  rationale: தேர்ந்தெடுப்பவராகிய கடவுளுடனான உறவை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘கடவுளுடைய தேர்ந்தெடுக்கப்பட்டவர்’ என்பதைக் காட்டிலும் எளிதில் புரிகிறது.
theological_decisions:
- issue: யோவான் 1:34-இல் கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயர்
  choice: கடவுளால் தேர்ந்தெடுக்கப்பட்டவர்
  alternative: கடவுளுடைய மகன்
  rationale: வழங்கப்பட்ட SBLGNT உரையில் ὁ ἐκλεκτὸς τοῦ θεοῦ என்று இருப்பதால் அதையே முதன்மை உரையில் மொழிபெயர்க்கிறது. முக்கியமான ‘கடவுளுடைய மகன்’ என்ற மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. இரண்டு கிரேக்க நிறைவேற்றுக் கால வினைகளும் ‘-இருக்கிறேன்’ வடிவில் இணையாகக் காக்கப்பட்டுள்ளன.
