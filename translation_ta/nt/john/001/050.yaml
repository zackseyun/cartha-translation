id: JHN.1.50
reference: John 1:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்துச் சொன்னார்: “நான் உன்னை அத்திமரத்தின் கீழே கண்டேன் என்று உனக்குச் சொன்னதால் நீ நம்புகிறாயா?[a] இவற்றைவிடப் பெரியவற்றை நீ காண்பாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நான் உன்னை அத்திமரத்தின் கீழே கண்டேன் என்று உனக்குச் சொன்னதால்தானா நீ நம்புகிறாய்?”'
    reason: முதல் ὅτι-யால் தொடங்கும் கேள்வியை, காரணத்தின்மீது மேலும் வெளிப்படையான அழுத்தத்துடன் அமைக்கவும் முடியும்.
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: அவனுக்குப் பதிலளித்துச் சொன்னார்
  rationale: கிரேக்க உரையாடல் நடைமுறையிலுள்ள இரு வினைகளையும் இயல்பான நவீனத் தமிழில் பிரதிபலிக்கிறது; தேவையற்ற மறுமொழியை உருவாக்கவில்லை.
- source_word: Ὅτι
  choice: சொன்னதால்
  rationale: முதல் ὅτι காரணத்தைக் குறிக்கிறது. கேள்வியின் காரணத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இரண்டாம் ὅτι, இயேசு சொன்னதன் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழின் இயல்பான மேற்கோள் இணைப்பான ‘என்று’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἶδόν σε
  choice: நான் உன்னை … கண்டேன்
  rationale: இறந்தகாலச் செயலை நேரடியாகக் கூறுகிறது; சூழல் கோராத முன் இறந்தகாலப் பொருள் சேர்க்கப்படவில்லை.
- source_word: ὑποκάτω τῆς συκῆς
  choice: அத்திமரத்தின் கீழே
  rationale: கிரேக்கத்தின் தெளிவான இடப் படிமத்தைச் சாதாரண நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: πιστεύεις
  choice: நீ நம்புகிறாயா?
  rationale: நிகழ்கால வினாவையும் யோவான் நற்செய்தியில் முக்கியமான ‘நம்புதல்’ என்ற கருத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μείζω τούτων
  choice: இவற்றைவிடப் பெரியவற்றை
  rationale: ஒப்பீட்டையும் நடுநிலைப் பன்மையின் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὄψῃ
  choice: நீ காண்பாய்
  rationale: எதிர்காலத்தைக் கண்ணியமான, தெளிவான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: πιστεύεις என்பதன் வினா வலிமை
  choice: ‘நீ நம்புகிறாயா?’ என்ற உண்மையான சொல்லாட்சிக் கேள்வி
  alternative: ‘இதனால்தானா நீ நம்புகிறாய்?’ என்ற மென்மையான கண்டிப்பை வலுப்படுத்தும் வாசிப்பு, அல்லது வாக்கியமாக வாசித்தல்
  rationale: கிரேக்கச் சொல் வரிசையும் சூழலும் கேள்வியை ஆதரிக்கின்றன. நாத்தான்வேலின் நம்பிக்கையைப் பற்றிய கண்டிப்பை உரை கூறுவதைவிட அதிகமாகக் கூர்மைப்படுத்தாமல், தொடர்ந்து வரும் பெரிய வெளிப்பாட்டின் வாக்குறுதியோடு உள்ள பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான சொற்களுடன் கண்ணியமான வேதாகம நடை. ‘அத்திமரம்’, ‘நம்புகிறாயா’, ‘காண்பாய்’ ஆகியவை தெளிவையும் மூலத்தின் உருவகத்தையும் காலவலிமையையும் காக்கின்றன.
