  source_fidelity: மூலக் கிரேக்கத்தின் உரையாடல் வடிவமான ἀπεκρίθη … καὶ εἶπεν இயல்பாக ‘பதிலளித்துச் சொன்னார்’ எனத் தரப்பட்டுள்ளது. முதல் ὅτι-யின் காரணப் பொருளும் இரண்டாம் ὅτι-யின் மேற்கோள்/உள்ளடக்கப் பொருளும் சரியாக வேறுபடுத்தப்பட்டுள்ளன. ‘அத்திமரத்தின் கீழே’, ‘நம்புகிறாயா?’, ‘இவற்றைவிடப் பெரியவற்றை நீ காண்பாய்’ ஆகியவை முறையே ὑποκάτω τῆς συκῆς, πιστεύεις, μείζω τούτων ὄψῃ என்பவற்றைத் துல்லியமாகக் காட்டுகின்றன.
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘நான் உன்னை … கண்டேன் என்று உனக்குச் சொன்னதால் நீ நம்புகிறாயா?’ என்பது தமிழில் தெளிவான சொல்லாட்சிக் கேள்வியாக அமைகிறது. எதிர்கால வாக்குறுதியான ‘நீ காண்பாய்’ பொருத்தமானது.
  terminology: ‘இயேசு’, ‘அத்திமரம்’, ‘நம்புகிறாயா’, ‘காண்பாய்’ ஆகியவை நிலையான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ்ச் சொற்கள். ‘நம்புதல்’ என்பதன் யோவானிய இறையியல் வலிமையை தேவையற்ற விளக்கமோ கோட்பாட்டுச் சாய்வோ இன்றி பாதுகாக்கிறது.
