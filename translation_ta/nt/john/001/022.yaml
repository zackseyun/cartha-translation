id: JHN.1.22
reference: John 1:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “நீர் யார்? எங்களை அனுப்பியவர்களுக்கு நாங்கள் பதில் சொல்லும்படி, உம்மைப் பற்றி நீர் என்ன சொல்கிறீர்?” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் மாற்றத்தையும் அதன் விளைவான கேள்வியையும் இயல்பான தமிழில் காட்டுகிறது; கடுமையான தர்க்க முடிவாக மட்டும் மாற்றவில்லை.
- source_word: εἶπαν ... αὐτῷ
  choice: அவர்கள் அவரிடம் ... என்று கேட்டார்கள்
  rationale: λέγω நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. தமிழில் கேள்விகளைத் தொடர்ந்து ‘என்று கேட்டார்கள்’ என்பது இயல்பான உரையாடல் வடிவம்; அவரிடம் என்பதும் αὐτῷ-ஐப் பிரதிபலிக்கிறது.
- source_word: Τίς εἶ;
  choice: நீர் யார்?
  rationale: சுருக்கமான நேரடி அடையாளக் கேள்வியை அப்படியே காக்கிறது. மரியாதையுடனும் கண்ணியமான நவீன நடையுடனும் ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: நாங்கள் பதில் சொல்ல வேண்டும்
  rationale: ἵνα கூறும் நோக்கத்தை தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘பதில் கொடுக்கும்படியாக’ என்பதைக் காட்டிலும் உரையாடலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: எங்களை அனுப்பியவர்களுக்கு
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள இறந்தகாலப் பங்கேற்பைத் தெளிவாகவும் சுருக்கமாகவும் மொழிபெயர்க்கிறது.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: உம்மைப் பற்றி நீர் என்ன சொல்கிறீர்?
  rationale: περί உடன் வரும் பொருள் ‘பற்றி’ என்றும், பிரதிபெயரின் தற்சுட்டுப் பொருள் ‘உம்மைப்’ என்றும் நேரடியாகக் காக்கப்படுகிறது; யோவான் தன்னை எவ்வாறு அடையாளப்படுத்துகிறார் என்பதைக் கேட்கும் திறந்த வடிவமும் நிலைக்கிறது.
