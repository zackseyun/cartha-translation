id: JHN.1.33
reference: John 1:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: ta
  text: நானும் அவரை அறியவில்லை[a]. ஆனால் தண்ணீரில் திருமுழுக்கு கொடுக்கும்படி என்னை அனுப்பியவர் என்னிடம், “ஆவியானவர் யார்மேல் இறங்கி அவர்மேல் நிலைத்திருப்பதை நீ காண்பாயோ, அவரே பரிசுத்த ஆவியில் திருமுழுக்கு கொடுப்பவர்[c]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை அடையாளம் கண்டுகொள்ளவில்லை.” இங்குள்ள கிரேக்க வினை, அவரை அறியாதிருந்ததையோ, சூழலுக்கு ஏற்ப அவரை அடையாளம் கண்டுகொள்ளாதிருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “தண்ணீரில்” மற்றும் “பரிசுத்த ஆவியில்” என்ற இரு சொற்றொடர்களிலும் கிரேக்கத்தில் ஒரே முன்னிடைச்சொல் பயன்படுத்தப்பட்டுள்ளது. அவற்றை “தண்ணீரால்” மற்றும் “பரிசுத்த ஆவியால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: நானும் அவரை அறிந்திருக்கவில்லை
  rationale: κἀγώ என்பதிலுள்ள தொடர்ச்சி/வலியுறுத்தலை ‘நானும்’ வெளிப்படுத்துகிறது. οὐκ ᾔδειν என்பது சூழலில் முன்பு அறியாமையையோ அடையாளம் கண்டுகொள்ளாமையையோ குறிக்கலாம்; முதன்மை உரை அதன் நேரடியான பொருளான ‘அறிந்திருக்கவில்லை’ என்பதை வைத்திருக்கிறது.
- source_word: ὁ πέμψας με βαπτίζειν ἐν ὕδατι
  choice: தண்ணீரால் திருமுழுக்கு கொடுக்கும்படி என்னை அனுப்பியவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினை ‘என்னை அனுப்பியவர்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது. βαπτίζειν என்பதற்கு நவீன வாசகர்களுக்குப் புரியும் ‘திருமுழுக்கு கொடுக்க’ பயன்படுத்தப்பட்டுள்ளது; ἐν ὕδατι இங்கு நீரை ஊடகம்/சாதனமாகக் காட்டுவதால் இயல்பான தமிழில் ‘தண்ணீரால்’ என வழங்கப்பட்டுள்ளது.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: யார்மேல் ... நீ காண்கிறாயோ
  rationale: அடையாளம் காட்டும் நிபந்தனைத் தொடர்பமைப்பை தமிழில் இயல்பான ‘யார்மேல் ... காண்கிறாயோ’ என்ற வடிவம் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: ஆவியானவர் யார்மேல் இறங்கி, அவர்மேல் நிலைத்திருப்பதை
  rationale: இறங்குதல் மற்றும் தொடர்ந்து தங்கியிருத்தல் ஆகிய இரு கூறுகளும் காக்கப்பட்டுள்ளன. μένω என்ற யோவானிய முக்கிய வினைக்கு தெளிவான, நவீன ‘நிலைத்திரு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: அவரே தூய ஆவியானவரால் திருமுழுக்கு கொடுப்பவர்
  rationale: οὗτός ἐστιν என்பதன் அடையாளப்படுத்தும் வலிமையை ‘அவரே’ காக்கிறது. πνεύματι ἁγίῳ தனிப்பட்ட தெய்வீக ஆவியைக் குறிப்பதால் ‘தூய ஆவியானவர்’ என வழங்கப்பட்டுள்ளது; ‘-ஆல்’ இயல்பான தமிழில் திருமுழுக்கின் ஊடகத்தைக் காட்டுகிறது.
theological_decisions:
- issue: πνεῦμα / πνεύματι ἁγίῳ என்பதன் தனிப்பட்ட தெய்வீகக் குறிப்பு
  choice: ஆவியானவர் ... தூய ஆவியானவர்
  alternative: ஆவி ... தூய ஆவி
  rationale: இறுதியில் வரும் πνεύματι ἁγίῳ, இறங்குகிற ஆவி யார் என்பதைத் தெளிவுபடுத்துகிறது. ‘ஆவியானவர்’ என்பது தமிழில் அந்தத் தனிப்பட்ட தெய்வீகக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது; உரையில் இல்லாத மேலதிக கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: திருமுழுக்குச் சொற்றொடர்களில் ἐν என்பதன் மொழிபெயர்ப்பு
  choice: தண்ணீரால் ... தூய ஆவியானவரால்
  alternative: தண்ணீரில் ... தூய ஆவியானவரில்
  rationale: ஒரே கிரேக்க முன்னிடைச்சொல் இரு இடங்களிலும் இருப்பதை கருத்தில் கொண்டு, தமிழில் ஒரே வேற்றுமை உருபான ‘-ஆல்’ பயன்படுத்தப்பட்டுள்ளது. இது ஊடகம்/சாதனம் என்ற சாத்திய பொருளை இயல்பாகத் தருகிறது; இடம்/களம் என்ற ‘-இல்’ வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஞானஸ்நானம்’ போன்ற மரபுசார் சொற்களைத் தவிர்த்து ‘திருமுழுக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது. தொடர்பமைப்பு தமிழில் இயல்பாக மாற்றப்பட்டாலும், ஆவியானவர் இறங்குவதும் அவர்மேல் நிலைத்திருப்பதும் என்ற கிரேக்க உரையின் இரு கூறுகளும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
