id: JHN.1.45
reference: John 1:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: ta
  text: 'பிலிப்பு நத்தானியேலைக் கண்டு, அவரிடம் கூறினார்: “திருச்சட்டத்தில் மோசே யாரைக் குறித்து எழுதியிருக்கிறாரோ, அவரைக் குறித்தே இறைவாக்கினர்களும் எழுதியிருக்கிறார்கள். அவரை நாம் கண்டுபிடித்திருக்கிறோம்: நாசரேத்தைச் சேர்ந்த யோசேப்பின் மகன் இயேசுவை.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: கண்டுபிடித்து
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகால வினையெச்சமாகத் தருகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலக் கூற்றுவினையாகத் தருகிறது.
- source_word: Ὃν ... ἔγραψεν
  choice: யாரைக் குறித்து எழுதினாரோ
  rationale: உறவுப்பெயரின் மனிதக் குறிப்பையும் γράφω வினையின் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: பொதுவான சட்டத்தை அல்லாமல் மோசேயுடன் தொடர்புடைய வேதத் தொகுதியைக் குறிக்கிறது.
- source_word: οἱ προφῆται
  choice: இறைவாக்கினர்களும்
  rationale: வேத சாட்சிகளான தீர்க்கதரிசிகளை நவீன, புரிந்துகொள்ளத்தக்க தமிழில் குறிக்கிறது.
- source_word: εὑρήκαμεν
  choice: நாம் கண்டுகொண்டோம்
  rationale: கிரேக்க நிறைவுக்காலத்தின் தற்போதைய விளைவைக் கொண்ட கண்டுபிடிப்பை இயல்பாக உணர்த்துகிறது.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: யோசேப்பின் மகன்
  rationale: வசனத்தில் பிலிப்பு தரும் சமூக அடையாளத்தை எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்காமல் அப்படியே காக்கிறது.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: நாசரேத்தைச் சேர்ந்த
  rationale: ἀπό குறிக்கும் ஊர்த் தோற்றம் அல்லது தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘யோசேப்பின் மகன்’ என்பதன் கிறிஸ்துவியல் தொடர்பு
  choice: பிலிப்பு கூறும் அடையாளமாக ‘யோசேப்பின் மகன்’ அப்படியே வைக்கப்பட்டது.
  alternative: ‘யோசேப்பின் மகன் என்று கருதப்பட்டவர்’
  rationale: கன்னிப் பிறப்புடன் ஒத்திசைக்க மொழிபெயர்ப்பில் விளக்கம் புகுத்தாமல், பேச்சாளரின் சொற்களைப் பாதுகாக்கிறது.
- issue: மோசேயும் இறைவாக்கினர்களும் அளிக்கும் வேதச் சாட்சியின் அமைப்பு
  choice: மோசே திருச்சட்டத்தில் எழுதியதையும் இறைவாக்கினர்கள் எழுதியதையும் ஒரே நபரைச் சுட்டும் இணைச் சாட்சிகளாகத் தரப்பட்டது.
  alternative: ‘திருச்சட்டத்தில் மோசேயும் இறைவாக்கினர்களும் யாரைக் குறித்து எழுதினார்களோ’
  rationale: இறைவாக்கினர்கள் திருச்சட்டத்திற்குள் எழுதினார்கள் என்ற தவறான புரிதலைத் தவிர்த்து, கிரேக்கத்தின் இரு எழுவாய்களையும் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ். ‘கண்டுபிடித்து’ மற்றும் ‘கண்டுகொண்டோம்’ என்ற வேறுபாடு நிகழ்வின் ஓட்டத்தையும் நிறைவுக்காலத்தின் தற்போதைய விளைவையும் காட்டுகிறது. பெயர்கள் வழக்கமான தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
