source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: ta
  text: அவர் அறிவித்தார்; மறுக்கவில்லை; மாறாக, “நான் மெசியா அல்ல” என்று அறிவித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டம் Χριστός (கிறிஸ்தோஸ்). இங்கு அது மெசியாவைக் குறிக்கும் பட்டமாக இருப்பதால், முதன்மை உரையில் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: வெளிப்படையாக ஒப்புக்கொண்டார்
  rationale: இங்கு ὁμολογέω என்பது வெளிப்படையான, பொதுவான ஒப்புதலைக் குறிக்கிறது. முதல் இடத்தில் ‘வெளிப்படையாக’ என்பது அதன் வலிமையைத் தெரிவிக்கிறது; இறுதியில் ‘ஒப்புக்கொண்டார்’ என்பதை மீண்டும் பயன்படுத்துவது கிரேக்கத்தின் வலியுறுத்தும் மறுபடியுரையைப் பேணுகிறது.
- source_word: οὐκ ἠρνήσατο
  choice: மறுக்கவில்லை
  rationale: யோவானின் பயன்பாட்டில் ἀρνέομαι என்பதன் நேரடியான பொருளான ‘மறு/மறுத்தல்’ இங்கு இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: καὶ ... καὶ ... καὶ
  choice: …; …வில்லை. … என்று …
  rationale: மீண்டும் வரும் καί தொடர்கள் தமிழில் இயல்பான குறுவாக்கியங்களாக அமைக்கப்பட்டுள்ளன. இதனால் ஒப்புதல்—மறுக்காமை—மீண்டும் ஒப்புதல் என்ற வலியுறுத்தும் படிநிலை நிலைக்கிறது.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: நான் … அல்ல
  rationale: வெளிப்படையாக இடம்பெறும் Ἐγώ-வின் அழுத்தத்தை ‘நான்’ தெளிவாகத் தருகிறது; ‘நானே’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்ற எதிர்மறை ஒப்பீட்டை உருவாக்கக்கூடும்.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இச்சூழலில் Χριστός ஒரு பெயராக அல்ல, எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது. ஆகவே ‘மெசியா’ என்பது யூத எதிர்பார்ப்பையும் பட்டத்தின் தன்மையையும் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: யோவான் தானே எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்ற மீட்பர் அல்ல என்று மறுக்கிறார். இங்கு இந்தச் சொல் பெயர் போன்ற பயன்பாட்டில் அல்லாமல் பட்டமாக இருப்பதால், முதன்மை உரையில் ‘மெசியா’ என வழங்கப்பட்டுள்ளது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் வலியுறுத்தும் மறுபடியுரை இயல்பான தமிழ் வாக்கிய ஓட்டத்துடன் பேணப்பட்டுள்ளது; ‘வெளிப்படையாக’ என்பது ὡμολόγησεν என்பதன் பொதுவான அறிவிப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது.
