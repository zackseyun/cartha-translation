  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: ta
  text: இயேசு நடந்துபோவதை அவர் உற்றுப் பார்த்து, “இதோ, கடவுளின் ஆட்டுக்குட்டி!” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: உற்றுப் பார்த்து
  rationale: வெறுமனே பார்ப்பதைவிடக் கூர்ந்து, கவனமாக நோக்குதல் என்ற வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περιπατοῦντι
  choice: நடந்துபோவதை
  rationale: இயேசு அப்போது நடந்துகொண்டிருந்தார் என்ற நிகழ்நிலைச் சூழலை இயல்பான தமிழில் தருகிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: ஒருவரின் கவனத்தை உடனடியாக ஈர்க்கும் கிரேக்கக் கட்டளையின் வலிமையைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: கடவுளின் ஆட்டுக்குட்டி
  rationale: யோவான் நற்செய்தியின் உருவகத்தையும் τοῦ θεοῦ என்பதன் திட்டமிட்ட தெளிவின்மையையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க நிகழ்காலத்தைத் தமிழ் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்குகிறது; மரியாதைப் பன்மை இயேசுவைக் குறிக்காமல் பேசுபவருக்கான வழக்கமான கண்ணிய நடையைப் பேணுகிறது.
theological_decisions:
- issue: “கடவுளின் ஆட்டுக்குட்டி” என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை நேரடியாக வைத்தல்
  alternative: “கடவுள் அளித்த பலியாடு” போன்ற விளக்க மொழிபெயர்ப்பு
  rationale: இந்தச் சொற்றொடர் பலியிடுதல், விடுதலை, குற்றமின்மை போன்ற பல வேதாகம எதிரொலிகளைத் தாங்கக்கூடும்; ஒரு விளக்கத்தை மட்டும் உரைக்குள் திணிக்காமல் மூலத்தின் இறையியல் செறிவையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன, எளிதில் புரியும், கண்ணியமான தமிழ். “உற்றுப் பார்த்து” மூலத்தின் தீவிர நோக்கைத் தருகிறது; “இதோ” வேதாகமத் தொனியைப் பேணினாலும் இன்றைய வாசகருக்கும் தெளிவாக உள்ளது.
