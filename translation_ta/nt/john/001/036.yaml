  source_fidelity: 'கிரேக்க மூலத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: இயேசுவை அவர் நடந்துகொண்டிருக்கையில் உற்றுநோக்குதல் (ἐμβλέψας ... περιπατοῦντι), அறிவிப்புச் செயல் (λέγει), கவன ஈர்ப்புச் சொல் (Ἴδε), மற்றும் உருவகமான “கடவுளின் ஆட்டுக்குட்டி” (ὁ ἀμνὸς τοῦ θεοῦ) ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. தமிழ்க் கதைநடையில் நிகழ்கால λέγει-யை “என்றார்” என இறந்தகாலத்தில் தருவது இயல்பானது.'
