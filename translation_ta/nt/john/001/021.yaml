id: JHN.1.21
reference: John 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “அப்படியானால் என்ன? நீர் எலியாவா?” என்று கேட்டார்கள். அதற்கு அவர், “நான் அல்ல” என்கிறார்.[b] “நீர் அந்தத் தீர்க்கதரிசியா?”[a] அவர், “இல்லை” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தத் தீர்க்கதரிசி” என்பது குறிப்பிட்ட எதிர்பார்க்கப்பட்ட ஒருவரைக் குறிக்கிறது; இது உபாகமம் 18:15, 18-ல் கூறப்படும் மோசேயைப் போன்ற தீர்க்கதரிசியைக் குறிக்கலாம்.
    reason: contextual_note
  - marker: b
    text: 'கிரேக்கத்தில் இங்கு வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது: “என்கிறார்.” இது கதைசொல்லலை உயிரோட்டமாக்கும் நடை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: கேட்டார்கள்
  rationale: நேரடியான கேள்வியை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் வினைச்சொல்; கிரேக்கத்தில் இல்லாத கடுமையையோ விசாரணைத் தொனியையோ சேர்ப்பதில்லை.
- source_word: Τί οὖν;
  choice: அப்படியானால் என்ன?
  rationale: முந்தைய மறுப்புகளைத் தொடர்ந்து எழும் சுருக்கமான அடுத்த கேள்வியின் தர்க்கத்தையும் திடீர்த் தன்மையையும் காக்கிறது.
- source_word: σὺ Ἠλίας εἶ
  choice: நீர் எலியாவா?
  rationale: தமிழில் இயல்பான நேரடிக் கேள்வியாகவும், யோவானிடம் பேசுவதற்கேற்ற மரியாதை ஒருமையுடனும் அமைக்கப்பட்டுள்ளது.
- source_word: Οὐκ εἰμί
  choice: நான் அல்ல
  rationale: கிரேக்கத்தின் சுருக்கமான மறுப்பை, உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல் காக்கிறது.
- source_word: Ὁ προφήτης
  choice: அந்தத் தீர்க்கதரிசி
  rationale: குறிப்பிட்ட, எதிர்பார்க்கப்பட்ட ஒருவரை கிரேக்கச் சுட்டுப்பெயர் அடையாளப்படுத்துவதால், பொதுவான ஒரு தீர்க்கதரிசி என்ற பொருளைத் தவிர்க்கிறது.
- source_word: λέγει
  choice: என்கிறார்
  rationale: யோவான் நற்செய்தியின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: கேள்விக்கான நேரடியான பதிலைச் சுட்டும் வழக்கமான கதைநடைச் சொல்.
- source_word: Οὔ
  choice: இல்லை
  rationale: தனித்து நிற்கும் கிரேக்க மறுப்புச் சொல்லின் சுருக்கத்தையும் நேரடித் தன்மையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘அந்தத் தீர்க்கதரிசி’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘அந்தத் தீர்க்கதரிசி’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: உபாகமம் 18:15, 18-ல் மோசேயைப் போன்றவர் என எதிர்பார்க்கப்பட்ட தீர்க்கதரிசி என்று உரையிலேயே விரிவுபடுத்துவது.
  rationale: கிரேக்க உரை குறிப்பிட்ட ஓர் எதிர்பார்க்கப்பட்ட நபரைச் சுட்டினாலும், அவருடைய அடையாளத்தை இங்கே வெளிப்படையாகத் தீர்மானிக்கவில்லை; அந்தத் தெளிவின்மை முதன்மை உரையில் காக்கப்படுகிறது.
- issue: எலியாவைக் குறித்த யோவானின் மறுப்பு
  choice: ‘நான் அல்ல’ என்ற மறுப்பு எந்த விளக்கச் சேர்க்கையும் இல்லாமல் தரப்பட்டது.
  alternative: ‘நான் உண்மையில் எலியா அல்ல’ என்று விரிவுபடுத்துவது அல்லது பிற நற்செய்திப் பகுதிகளோடு வெளிப்படையாக ஒத்திசைப்பது.
  rationale: இவ்வசனம் யோவானின் நேரடியான மறுப்பை முன்வைக்கிறது; பிற பகுதிகளின் அடிப்படையில் அதை மாற்றியோ மென்மைப்படுத்தியோ விடாமல் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்விகளின் சுருக்கமும் பதில்களின் நேரடித் தன்மையும் காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறி தவறான இடத்தில் இருந்ததாகத் தோன்றுவதால், அதன் குறிப்புரைக்கு பொருந்தும் ‘அந்தத் தீர்க்கதரிசி’ என்பதற்குப் பின்னர் வைக்கப்பட்டது; [b] வரலாற்று நிகழ்காலமான ‘என்கிறார்’ என்பதற்குப் பின்னர் வைக்கப்பட்டது.
