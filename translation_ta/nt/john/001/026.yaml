source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: ta
  text: யோவான் அவர்களுக்குப் பதிலளித்து, “நான் தண்ணீரில்[a] திருமுழுக்கு கொடுக்கிறேன்; உங்கள் நடுவில் நீங்கள் அறியாத ஒருவர் நிற்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீரால்.”
    reason: ἐν ὕδατι என்ற சொற்றொடர் இச்சூழலில் இடப்பொருளாக ‘தண்ணீரில்’ என்றும், கருவிப்பொருளாக ‘தண்ணீரால்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: யோவான் அவர்களிடம் … என்று பதிலளித்தார்
  rationale: தமிழில் இயல்பான நேரடி உரை அமைப்பைப் பயன்படுத்தி, ‘பதிலளித்தார்’ என்பதில் ἀπεκρίθη என்பதையும், மேற்கோளைத் தொடர்ந்து வரும் ‘என்று’ என்பதில் λέγων என்பதன் உரையறிமுகப் பணியையும் வெளிப்படுத்துகிறது.
- source_word: βαπτίζω
  choice: திருமுழுக்கு கொடுக்கிறேன்
  rationale: கிறிஸ்தவச் சூழலில் பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொற்றொடர். வெறும் ‘மூழ்கடிக்கிறேன்’ என்று கூறி சடங்கின் முறையைத் தேவையின்றி வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: ἐν ὕδατι
  choice: தண்ணீரில்
  rationale: ἐν உடன் வரும் இடப்பொருளை நேரடியாகப் பேணுகிறது; தமிழ் வழக்கில் ‘தண்ணீரால்’ என்பதும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μέσος ὑμῶν
  choice: உங்கள் நடுவில்
  rationale: அந்த நபர் அவர்களிடையே இருப்பதை இயல்பாகவும் மூலத்தின் படிமத்தைப் பேணியும் தெரிவிக்கிறது.
- source_word: ἕστηκεν
  choice: நிற்கிறார்
  rationale: கிரேக்க நிறைவுக்கால வடிவம் காட்டும் தற்போதைய நிலையை இயல்பான தமிழ் நிகழ்காலத்தில் தெரிவிக்கிறது.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: நீங்கள் அறியாத ஒருவர்
  rationale: οἶδα என்பதன் பொதுவான ‘அறிதல்’ பொருளைப் பேணுகிறது; ‘அடையாளம் காணாத’ என்று சூழலைக் குறுக்கி விளக்கவில்லை.
theological_decisions:
- issue: அவர்களின் நடுவில் நிற்கும் பெயர் குறிப்பிடப்படாத நபரின் அடையாளம்
  choice: ‘ஒருவர்’ என்று மட்டும் குறிப்பிடப்பட்டது.
  alternative: ‘மேசியா’ அல்லது ‘இயேசு’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: விரிந்த சூழல் இயேசுவைச் சுட்டினாலும், இந்த வசனம் அந்த நபரின் பெயரைச் சொல்லாமல் விட்டு உருவாக்கும் கதையியல் எதிர்பார்ப்பை மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத எதிர்மறை இணைப்புச் சொல் சேர்க்கப்படவில்லை; அரைப்புள்ளி இரு கூற்றுகளின் தொடர்ச்சியைப் பேணுகிறது.
