source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: ta
  text: இயேசு திரும்பி, அவர்கள் தம்மைப் பின்தொடர்ந்து வருவதைக் கண்டு, அவர்களிடம், “நீங்கள் எதைத் தேடுகிறீர்கள்?[a]” என்று கேட்டார். அதற்கு அவர்கள், “ரபி[b]” (மொழிபெயர்த்தால் “ஆசிரியர்” என்று பொருள்), “நீங்கள் எங்கே தங்கியிருக்கிறீர்கள்?[c]” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீங்கள் எதைத் தேடிக்கொண்டிருக்கிறீர்கள்?” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சாதாரணமாக ஒன்றைத் தேடுவதைக் குறிக்கலாம்; இங்கு ஆழமான ஒன்றை நாடுதல் என்ற நுண்ணுணர்வும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ரபி” என்பது “ஆசிரியர்” என்று பொருள்படும் எபிரேய/அரமேய அழைப்புப் பட்டம்.
    reason: cultural_note
  - marker: c
    text: “நீங்கள் எங்கே நிலைத்திருக்கிறீர்கள்?” என்றும் சொற்சார்ந்து மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினை யோவான் நற்செய்தியின் பிற இடங்களில் “நிலைத்திரு” என்ற பொருளிலும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: திரும்பி
  rationale: இயேசு பேசுவதற்கு முன் செய்த செயலை இயல்பான தமிழில் சுருக்கமாகக் காட்டுகிறது; அவர் எந்தத் திசையில் திரும்பினார் என்பதைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: θεασάμενος
  choice: கண்டு
  rationale: வெறும் பார்வையை மட்டுமல்லாமல், அவர்கள் பின்தொடர்வதை இயேசு கவனித்ததையும் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκολουθοῦντας
  choice: பின்தொடர்ந்து வருவதை
  rationale: தொடர்ந்து நடந்துகொண்டிருந்த செயலைக் காட்டுவதோடு, நேரடியாகப் பின்னால் வருதல் மற்றும் சீடராகப் பின்பற்றுதல் ஆகிய இரு சாத்தியமான நுண்ணுணர்வுகளையும் திறந்தவையாக வைக்கிறது.
- source_word: Τί ζητεῖτε;
  choice: நீங்கள் எதைத் தேடுகிறீர்கள்?
  rationale: ζητέω என்பதன் சாதாரண தேடல் பொருளையும் யோவான் நற்செய்தியில் ஒலிக்கக்கூடிய ஆழமான நாடுதல் பொருளையும் பாதுகாக்கிறது.
- source_word: Ῥαββί
  choice: ரபி
  rationale: மூலத்திலுள்ள யூத அழைப்புப் பட்டத்தை ஒலிபெயர்த்து வைக்கிறது; வசனமே உடனடியாக அதன் பொருளை விளக்குகிறது.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: மொழிபெயர்த்தால், “ஆசிரியரே” என்று பொருள்
  rationale: ஆசிரியரின் அடைப்புக்குறி விளக்கத்தைத் தெளிவாகக் காட்டுகிறது. Διδάσκαλε என்பது நேரடி அழைப்புமுறை என்பதால் “ஆசிரியரே” என வழங்கப்படுகிறது.
- source_word: ποῦ μένεις;
  choice: நீங்கள் எங்கே தங்கியிருக்கிறீர்கள்?
  rationale: உடனடிச் சூழலில் இயேசு தங்கியிருக்கும் இடத்தைப் பற்றிய நடைமுறைக் கேள்வியை இயல்பான நவீன தமிழில் தருகிறது; μένω என்பதன் விரிவான யோவானிய பயன்பாடு அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் பின்னர் இறையியல் முக்கியத்துவம் பெறும் μένω வினையை இங்கு வழங்குதல்
  choice: நீங்கள் எங்கே தங்கியிருக்கிறீர்கள்?
  alternative: நீங்கள் எங்கே நிலைத்திருக்கிறீர்கள்?
  rationale: இந்த உடனடிச் சூழலில் சீடர்கள் இயேசு தங்கியிருக்கும் இடத்தையே கேட்கிறார்கள். “தங்கியிருக்கிறீர்கள்” என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது; அதே நேரத்தில், மூல வினையின் பரந்த பயன்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ζητέω என்பதில் இருக்கக்கூடிய யோவானிய இரட்டைப் பொருள்
  choice: நீங்கள் எதைத் தேடுகிறீர்கள்?
  alternative: நீங்கள் எதைப் பார்க்கிறீர்கள்? / உங்களுக்கு என்ன வேண்டும்?
  rationale: “தேடுகிறீர்கள்” என்பது சாதாரணமாக ஒன்றைத் தேடுவதையும் ஆழமாக ஒன்றை நாடுவதையும் வெளிப்படுத்த முடியும். ஆகவே கேள்வியின் உடனடிப் பொருளையும் கதையிலுள்ள சாத்தியமான ஆழத்தையும் முன்கூட்டியே தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதையான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதை நவீன தமிழில் இயல்பாக ஒலிக்க “நீங்கள்” என்ற வடிவில் தரப்பட்டுள்ளது. “ஆசிரியரே” என்பது புரிந்துகொள்ள எளிதானதும், குறிப்பிட்ட திருச்சபைப் பதவியையோ பிரிவுசார் பொருளையோ சுமத்தாததும் ஆகும்.
