source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: ta
  text: 'நாத்தான்வேல் அவரிடம், “என்னை உமக்கு எப்படித் தெரியும்?[a]” என்றார். இயேசு அவருக்குப் பதிலளித்துக் கூறினார்: “பிலிப்பு உன்னை அழைப்பதற்கு முன்பே, நீ அத்திமரத்தின் கீழே இருந்தபோது நான் உன்னைப் பார்த்தேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “எங்கிருந்து என்னை அறிந்திருக்கிறீர்?”
    reason: Πόθεν என்பதன் நேரடிப் பொருளையும் கிரேக்கக் கேள்வியின் வடிவத்தையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: என்னை உமக்கு எப்படித் தெரியும்?
  rationale: Πόθεν என்பதன் அடிப்படைப் பொருள் ‘எங்கிருந்து’ என்றாலும், γινώσκεις உடன் இங்கு இயேசு தம்மை அறிந்திருப்பதற்கான வழி அல்லது அடிப்படையை நாத்தான்வேல் கேட்கிறார். நவீனத் தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: பதிலளித்துக் கூறினார்
  rationale: மூலத்தில் உள்ள ‘பதிலளித்தார்’ மற்றும் ‘கூறினார்’ ஆகிய இரு வினைகளையும் யோவானின் உரையாடல் நடைக்கு ஏற்ப தமிழில் இயல்பாக இணைத்துப் பாதுகாக்கிறது.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: பிலிப்பு உன்னை அழைப்பதற்கு முன்பே
  rationale: Πρὸ τοῦ உடன் வரும் வினையெச்ச அமைப்பு முந்திய காலத்தைச் சுட்டுகிறது. φωνέω இச்சூழலில் ‘அழைத்தல்’ என இயல்பாகப் பொருள்படுகிறது; ‘முன்பே’ என்பது கால முன்னுரிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: நீ அத்திமரத்தின் கீழே இருந்தபோது
  rationale: ὄντα என்பது ‘உன்னை’ விளக்கி, இயேசு கண்டபோது இருந்த சூழ்நிலையைத் தருகிறது. συκῆν என்பதற்கான வழக்கமான தமிழ் ‘அத்திமரம்’ ஆகும்.
- source_word: εἶδόν σε
  choice: நான் உன்னைப் பார்த்தேன்
  rationale: இறந்தகால நிகழ்வை நேரடியாகக் கூறும் அஓரிஸ்ட் வினையை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது. நிகழ்வு பிலிப்பின் அழைப்புக்கு முன் நடந்தது என்பது ஏற்கெனவே காலத் தொடரால் தெளிவாகிறது.
theological_decisions:
- issue: நாத்தான்வேலைப் பற்றிய இயேசுவின் அறிவின் இயல்பு
  choice: இயேசு முன்பே நாத்தான்வேலைப் பார்த்ததாகக் கூறும் வாக்கியத்தை நேரடியாக மொழிபெயர்த்து, அது எவ்வாறு நிகழ்ந்தது என்பதை விளக்காமல் விடுதல்
  alternative: அதை வெளிப்படையாக அற்புத அறிவாகவோ, தீர்க்கதரிசன அறிவாகவோ, சாதாரணமான முன்காணலாகவோ விளக்குதல்
  rationale: இயேசு எவ்வாறு நாத்தான்வேலை அறிந்தார் அல்லது பார்த்தார் என்பதை இந்த வசனம் விளக்கவில்லை. ஆகவே அதன் இறையியல் பதற்றத்தையும் திறந்த தன்மையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. இயேசுவை நோக்கிப் பேசும்போது ‘உமக்கு’ என்ற மரியாதை வடிவமும், இயேசுவின் பதிலில் ‘உன்னை’ என்ற ஒருமை வடிவமும் பயன்படுத்தப்பட்டுள்ளன. ‘நாத்தான்வேல்’, ‘பிலிப்பு’, ‘அத்திமரம்’ ஆகியவை தமிழ்க் கிறிஸ்தவ வாசகர்களுக்கு அறிமுகமான வடிவங்களில் தரப்பட்டுள்ளன.
