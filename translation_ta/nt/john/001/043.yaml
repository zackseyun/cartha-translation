source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: ta
  text: மறுநாள், இயேசு கலிலேயாவுக்குப் புறப்பட்டுச் செல்ல[a] விரும்பினார். அவர் பிலிப்பைக் காண்கிறார்; அவரிடம், “என்னைப் பின்பற்று”[c] என்று கூறுகிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கலிலேயாவுக்குள் செல்ல” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஓர் இடத்தை நோக்கிச் செல்லுதலையோ அதற்குள் செல்லுதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “காண்கிறார்,” “கூறுகிறார்” ஆகிய வினைகள் கிரேக்கத்தில் நிகழ்காலத்தில் உள்ளன; கடந்த நிகழ்வை உயிரோட்டமாக விவரிக்கும் வரலாற்று நிகழ்காலம் இது.
    reason: lexical_alternative
  - marker: c
    text: “என்னைப் பின்பற்று” என்பது இயேசுவுடன் உடன்செல்லுதல் மற்றும் அவருடைய சீடராகுதல் ஆகிய இரண்டையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: இது நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἠθέλησεν
  choice: விரும்பினார்
  rationale: θέλω என்பதிலுள்ள விருப்பம் அல்லது நோக்கம் என்ற பொருளைப் பாதுகாக்கிறது; ‘தீர்மானித்தார்’ என்று மொழிபெயர்த்து திட்டவட்டமான முடிவை மிகைப்படுத்தவில்லை.
- source_word: ἐξελθεῖν
  choice: புறப்பட்டுச் செல்ல
  rationale: ἐξέρχομαι என்பதிலுள்ள ஓரிடத்திலிருந்து வெளியேறிச் செல்லும் இயக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கும் εἰς என்பதற்கு இயல்பான தமிழ் வடிவம்; இடத்திற்குள் செல்லுதல் என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εὑρίσκει
  choice: காண்கிறார்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து உரையாடலுக்கு உயிரோட்டம் தருகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: மூலத்தில் உள்ள வரலாற்று நிகழ்காலத்தைத் தொடர்ந்து பாதுகாக்கிறது; இயேசுவின் நேரடியான அழைப்புக்கு ஏற்ற கண்ணியமான இயல்புத் தமிழ்.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்று
  rationale: உடன்செல்லுதல் மற்றும் சீடராகத் தொடருதல் ஆகிய இரு சாத்தியமான பரிமாணங்களையும் விளக்கிச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: Φίλιππον
  choice: பிலிப்பு
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: மூலத்தில் வெளிப்படையாக வரும் எழுவாயைப் பாதுகாக்கிறது; முதல் வாக்கியத்தின் மறைமுக எழுவாயையும் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: பிலிப்புக்கு இயேசு கொடுத்த கட்டளையின் வலிமை
  choice: “என்னைப் பின்பற்று” என்ற நேரடியான அழைப்பு
  alternative: இயேசுவுடன் அந்தப் பயணத்தில் உடன்செல்லுமாறு கொடுக்கப்பட்ட சாதாரண அழைப்பு
  rationale: உடனடியான சூழலில் உடலளவில் உடன்செல்லுதல் அடங்கினாலும், நற்செய்திகளில் இந்தச் சொற்றொடர் சீடராக வாழ்வதற்கான அழைப்பையும் சுமக்கிறது. மொழிபெயர்ப்பு இரு பரிமாணங்களையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் வரலாற்று நிகழ்காலம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; முதல் வாக்கியத்தின் மறைமுக எழுவாய் தமிழில் தெளிவுக்காக ‘இயேசு’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
