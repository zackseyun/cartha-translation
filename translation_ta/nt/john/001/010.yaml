id: JHN.1.10
reference: John 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: ta
  text: அவர் உலகத்தில் இருந்தார்; உலகம் அவர் மூலமாக உண்டானது[a]; உலகம் அவரை அறியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகம் அவர் மூலமாக இருப்புக்கு வந்தது.” கிரேக்க வினைச்சொல் ‘உண்டாகுதல்,’ ‘இருப்புக்கு வருதல்’ என்ற பொருள்களைத் தருகிறது; “அவர் மூலமாகப் படைக்கப்பட்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவரை அறியவில்லை” என்பது “அவரை அடையாளம் காணவில்லை” அல்லது “அவரை ஏற்றுக்கொள்ளவில்லை” என்ற பொருள்களையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: உலகம்
  rationale: இந்த வசனத்தில் κόσμος மூன்று முறை வருகிறது. ‘உலகம்’ என்ற ஒரே சொல்லைத் தொடர்ந்து பயன்படுத்துவது படைக்கப்பட்ட உலகம், அதில் வாழும் மனிதர்கள், தேவனை ஏற்றுக்கொள்ளாத மனித உலகம் ஆகிய பொருள் அடுக்குகளை முன்கூட்டியே குறுக்காமல் காக்கிறது.
- source_word: ἦν
  choice: இருந்தார்
  rationale: εἰμί என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம் இங்கு அவருடைய தொடர்ந்திருந்த நிலையை எளிமையாகக் கூறுகிறது. தனிப்பட்ட ஆண்பால் குறிப்பு உடனடியான சூழலில் உள்ள ‘வார்த்தை’யைக் குறிக்கிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά உடன் வரும் உருபுவடிவம் வழிமுறை அல்லது இடைமுகச் செயற்பாட்டைத் தெரிவிக்கிறது. ‘அவர் மூலமாக’ என்பது யோவான் 1:3 உடனான தொடர்பையும் இயல்பாகப் பேணுகிறது.
- source_word: ἐγένετο
  choice: உண்டானது
  rationale: γίνομαι இங்கு இல்லாமையிலிருந்து இருப்புக்கு வருதலைக் குறிக்கிறது. ‘உண்டானது’ என்பது முன் வரும் ἦν என்பதற்கான ‘இருந்தார்’ என்பதிலிருந்து வேறுபட்டு, யோவான் அமைத்துள்ள இருந்தல்–உண்டாதல் வேறுபாட்டைப் பேணுகிறது.
- source_word: ἔγνω
  choice: அறியவில்லை
  rationale: γινώσκω என்பதன் அடிப்படைப் பொருள் ‘அறிதல்.’ சூழலில் அடையாளங்காணுதல் அல்லது ஏற்றுக்கொள்ளுதல் என்ற நிழற்பொருள்களும் இருக்கலாம்; ‘அறியவில்லை’ அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் செறிவைப் பேணுகிறது.
- source_word: αὐτόν / αὐτοῦ
  choice: அவரை / அவர்
  rationale: இந்தப் பிரதிப்பெயர்கள் முந்தைய சூழலில் உள்ள லோகோஸாகிய ‘வார்த்தை’யைக் குறிக்கின்றன. மரியாதைமிக்க மனிதரைக் குறிக்கும் தமிழ் வடிவம் அந்தத் தனிப்பட்ட குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வெளிப்படையாகக் கூறப்படாத எழுவாயின் குறிப்பு
  choice: உடனடியான சூழலில் உள்ள லோகோஸைக் குறிக்கும் தனிப்பட்ட ஆண்பால் வடிவமாக ‘அவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘வார்த்தை’ என்ற சொல்லின் இலக்கணத் தோற்றத்தை மட்டும் முன்னிறுத்தி உயிரற்ற ஒன்றைக் குறிக்கும் வடிவத்தைப் பயன்படுத்துதல்
  rationale: இந்த வசனத்தில் எழுவாய்ப் பெயர்ச்சொல் மீண்டும் வராவிட்டாலும், யோவான் 1:1–9 இன் உரையாடல் சூழல் லோகோஸைத் தனிப்பட்டவராகக் காட்டுகிறது. ‘அவர்’ என்பது அந்தச் சூழல் குறிப்பைப் பேணுகிறது; பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்ப்பதில்லை.
- issue: லோகோஸுக்கும் உலகின் தோற்றத்துக்கும் உள்ள உறவு
  choice: ‘உலகம் அவர் மூலமாக உண்டானது’ என்று கூறி, அவர் இருந்ததையும் உலகம் உண்டானதையும் வேறுபடுத்துதல்
  alternative: ‘உலகம் அவரால் படைக்கப்பட்டது’
  rationale: ἦν மற்றும் ἐγένετο ஆகிய வினைகளுக்கிடையே முன்னுரையில் திட்டமிட்டு அமைக்கப்பட்ட வேறுபாட்டை இம்மொழிபெயர்ப்பு வெளிப்படுத்துகிறது. அதேவேளை διά தெரிவிக்கும் ‘மூலமாக’ என்ற இடைமுக உறவையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிமையும் கண்ணியமும் கொண்ட நடை. மூன்று இடங்களிலும் ‘உலகம்’ என்பதைக் காத்து, கடைசி கூறில் இயல்பான எதிர்மறைத் திருப்பத்தைக் காட்ட ‘உலகமோ’ பயன்படுத்தப்பட்டுள்ளது. ‘இருந்தார்’ மற்றும் ‘உண்டானது’ ஆகியவை மூலத்திலுள்ள ἦν / ἐγένετο வேறுபாட்டைத் தெளிவாகப் பேணுகின்றன. ஆங்கில ஆலோசனை உரையில் அடிக்குறியீடுகள் உள்ளடக்கத்துடன் பொருந்தாத இடங்களில் இருந்ததால், [a] உண்டாதல் குறித்த மாற்று மொழிபெயர்ப்பின் பின்னும் [b] அறிதல் குறித்த மாற்றுப் பொருளின் பின்னும் வைக்கப்பட்டுள்ளன.
