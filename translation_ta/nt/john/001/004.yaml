  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: ta
  text: அவரில் வாழ்வு இருந்தது; அந்த வாழ்வு மனிதர்களின் ஒளியாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ἐν என்பதன் இயல்பான பொருளான ‘-இல்’ என்பதையும், முந்தைய சூழலில் λόγος தனிப்பட்டவராகச் சித்தரிக்கப்படுவதையும் காக்கிறது.
- source_word: ζωὴ
  choice: வாழ்வு
  rationale: ζωή என்பதன் எளிய பொருளைத் தக்கவைத்து, யோவானின் சூழல் அதற்குரிய ஆழமான இறையியல் பொருளை வழங்க இடமளிக்கிறது; இங்கு ‘நித்திய வாழ்வு’ என்று விரித்துரைக்கப்படவில்லை.
- source_word: ἦν
  choice: இருந்தது
  rationale: εἰμί வினையின் இறந்தகாலத் தொடர்நிலை வடிவத்தை இயல்பான தமிழில் தருகிறது; ‘நிலைத்திருந்தது’ போன்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
- source_word: ἡ ζωὴ
  choice: அந்த வாழ்வு
  rationale: முன்னர் குறிப்பிடப்பட்ட வாழ்வையே மீண்டும் சுட்டும் கிரேக்கச் சுட்டுநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: φῶς என்பதற்கான நேரான, யோவான் நற்செய்தியின் உருவகச் செறிவைக் காக்கும் தமிழ்ச் சொல்.
- source_word: τῶν ἀνθρώπων
  choice: மனிதர்களின்
  rationale: ἄνθρωποι இங்கு ஆண் பாலினத்தவரை மட்டும் அல்லாமல் மனிதர்களை பொதுவாகக் குறிக்கிறது; மரபுப் பாலினக் குறுக்கத்தை உருவாக்காமல், உடைமை வேற்றுமையான கிரேக்க genitive அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: αὐτῷ என்பதன் சுட்டுப்பொருளும் தனிப்பட்டவரைக் குறிக்கும் தன்மையும்
  choice: வார்த்தையைக் குறிக்கும் தனிப்பட்ட சுட்டாக ‘அவரில்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: λόγος என்பதை அருவமான கருத்தாக எடுத்தால் ‘அதில்’ எனலாம்.
  rationale: உடனடிச் சூழலில் வார்த்தை தேவனோடு உறவுடைய தனிப்பட்டவராகச் சித்தரிக்கப்படுகிறது. ‘அவரில்’ என்பது அந்தத் தன்மையைக் காக்கிறது; அதேவேளை இவ்வசனத்துக்குள் பிற்காலக் கோட்பாட்டு சொற்களைச் சேர்ப்பதில்லை.
- issue: ἀνθρώπων என்பதன் பொதுமனிதக் குறிப்பு
  choice: ‘மனிதர்களின்’ என்று அனைவரையும் உள்ளடக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மனுக்குலத்தின்’ என்று ஒருமொத்த மனிதகுலத்தைக் குறிக்கலாம்.
  rationale: கிரேக்கச் சொல் இலக்கண வடிவில் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் ‘மனிதர்களின்’ என்பது பொருளையும் பன்மை வடிவத்தையும் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வாழ்வு’ மற்றும் ‘ஒளி’ என்ற சுருக்கமான முக்கியச் சொற்கள் விளக்கமின்றித் தக்கவைக்கப்பட்டுள்ளன; அரைப்புள்ளி இரு நெருக்கமான கூற்றுகளின் தொடர்பை வெளிப்படுத்துகிறது.
