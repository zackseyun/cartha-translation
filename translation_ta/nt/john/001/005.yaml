id: JHN.1.5
reference: John 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: ta
  text: அந்த ஒளி இருளில் ஒளிர்கிறது; இருள் அதை வெல்லவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இருள் அதைப் புரிந்துகொள்ளவில்லை” அல்லது “பற்றிக்கொள்ளவில்லை.” இங்குள்ள கிரேக்க வினைச்சொல் வெல்லுதல்/கைப்பற்றுதல் என்ற பொருளையும், பற்றிக்கொள்ளுதல்/புரிந்துகொள்ளுதல் என்ற பொருளையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: அந்த ஒளி
  rationale: கிரேக்க மொழியிலுள்ள வரையறைச் சுட்டையும், யோவானின் முன்னுரையில் ஏற்கெனவே அறிமுகப்படுத்தப்பட்ட கருப்பொருள்சார் ஒளியையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: σκοτίᾳ / σκοτία
  choice: இருள்
  rationale: தமிழில் ‘இருள்’ என்பதே இங்கு வரையறுக்கப்பட்ட, உருவகப்படுத்தப்பட்ட எதிர்நிலையை இயல்பாக வெளிப்படுத்துகிறது; தனியாகச் சுட்டுச்சொல் சேர்க்க வேண்டியதில்லை.
- source_word: φαίνει
  choice: ஒளிர்கிறது
  rationale: நிகழ்கால வினையின் தொடரும், உயிரோட்டமான செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: κατέλαβεν
  choice: வெல்லவில்லை
  rationale: ஒளிக்கும் இருளுக்கும் இடையிலான உருவக மோதலில் ‘மேற்கொள்ளுதல்/வெல்லுதல்’ என்ற பொருள் பொருத்தமாக உள்ளது; இருப்பினும் புரிந்துகொள்ளுதல் அல்லது பற்றிக்கொள்ளுதல் என்ற உண்மையான பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: αὐτὸ
  choice: அதை
  rationale: இது இலக்கணப்படி ‘ஒளி’ என்பதைக் குறிக்கிறது; ஆகவே ஆளைக் குறிக்கும் வடிவத்தை விட ‘அதை’ நேரடியான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ஒளி–இருள் எதிர்மறையில் κατέλαβεν என்பதன் பொருள்
  choice: இருள் அதை வெல்லவில்லை
  alternative: இருள் அதைப் புரிந்துகொள்ளவில்லை / பற்றிக்கொள்ளவில்லை
  rationale: இந்தக் கிரேக்க வினைச்சொல் பகைமையான முறையில் வெல்லுதல் அல்லது கைப்பற்றுதல் என்றும், அறிவுசார் முறையில் புரிந்துகொள்ளுதல் என்றும் பொருள்படலாம். உடனடிச் சூழலின் ஒளி–இருள் உருவகம் ‘வெல்லவில்லை’ என்பதற்கு ஆதரவளிக்கிறது; மற்ற பொருள் வாய்ப்புகளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த ஒளி’ என்பது முன்னுரையில் அடையாளப்படுத்தப்பட்ட ஒளியைச் சுட்டுகிறது; ‘இருள்’ தமிழில் இயல்பாகவே கருப்பொருள்சார் வரையறுக்கப்பட்ட பெயராகச் செயல்படுகிறது.
