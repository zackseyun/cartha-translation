id: JHN.1.23
reference: John 1:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “ஏசாயா தீர்க்கதரிசி சொன்னபடியே, நான் வனாந்தரத்தில் உரக்கக் கூவுகிற ஒருவனின் குரல்: ‘ஆண்டவருடைய வழியை நேராக்குங்கள்.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: அவர் சொன்னார்
  rationale: உரையாடல் சூழலுக்கு இயல்பான கதைநடைப் பேச்சு அறிமுகம்; கிரேக்கச் சொல்லின் எளிய பொருளைத் தக்கவைக்கிறது.
- source_word: Ἐγὼ
  choice: நான்
  rationale: வெளிப்படையாக உள்ள முதலாம் நபர் சுட்டுப்பெயரை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது; சூழலிலேயே தன்னடையாள வலியுறுத்தல் தெளிவாகிறது.
- source_word: φωνὴ
  choice: குரல்
  rationale: யோவான் தன்னை ஒரு நபராக அல்ல, கூப்பிடுகிறவனின் குரலாக உருவகப்படுத்தும் தீர்க்கதரிசனப் படிமத்தைப் பாதுகாக்கிறது; தமிழில் இங்கு எண்ணுப்பெயர் சேர்க்கத் தேவையில்லை.
- source_word: βοῶντος
  choice: உரக்கக் கூப்பிடுகிற ஒருவனின்
  rationale: மரபுத்தொடர்பை வெளிப்படுத்தும் கிரேக்கப் பிறப்புவேற்றுமைப் பங்கேற்புச் சொல்லைத் தெளிவாகக் காட்டி, அதன் தீவிரத்தையும் தீர்க்கதரிசனத் தொனியையும் தக்கவைக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: மக்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகமத் தமிழில், குடியிருப்பற்ற பாழ்நிலத்தையும் தீர்க்கதரிசனப் பின்னொலியையும் வெளிப்படுத்துகிறது.
- source_word: Εὐθύνατε
  choice: நேராக்குங்கள்
  rationale: பன்மை கட்டளையின் நேரடியான செயற்பாட்டை இயல்பான தமிழில் தருகிறது; வழியைச் செவ்வைப்படுத்தும் ஏசாயா படிமத்தைப் பாதுகாக்கிறது.
- source_word: τὴν ὁδὸν
  choice: வழியை
  rationale: நேரடியான பாதை என்ற உருவகத்தையும் அதன் விரிவான ஆன்மீகப் பொருள் சாத்தியத்தையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதன் மதிப்பும் ஏசாயா மேற்கோளின் உடன்படிக்கை சார்ந்த இறையியல் நிறையும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: καθὼς
  choice: சொன்னபடியே
  rationale: யோவானின் தன்னடையாளத்துக்கும் ஏசாயாவின் உரைக்கும் உள்ள துல்லியமான ஒத்திசைவை இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: ஏசாயா தீர்க்கதரிசி
  rationale: கிரேக்க வரிசையையும் அடையாளத்தையும் கண்ணியமான, பரவலாக அறியப்பட்ட தமிழில் தருகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் κυρίου என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இது ஏசாயா மேற்கோளின் இறைநாமத் தொடர்பையும் உடன்படிக்கை சார்ந்த நிறையையும் காக்கிறது; சாதாரண மனித எஜமானைக் குறிக்கும் வகையில் பொருளைத் தளர்த்துவதில்லை.
- issue: “வனாந்தரத்தில்” என்பது எதனுடன் தொடர்புடையது
  choice: வனாந்தரத்தில் உரக்கக் கூப்பிடுகிற ஒருவனின் குரல்
  alternative: வனாந்தரத்தில் இருக்கும் குரல்—உரக்கக் கூப்பிடுகிற ஒருவனின் குரல்
  rationale: கிரேக்கச் சொற்றொடரின் மிகவும் இயல்பான இணைப்பு, வனாந்தரத்தில் கூப்பிடுகிறவன் என்று வாசிக்கிறது. மாற்று இலக்கண இணைப்பு சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. “வனாந்தரம்,” “ஆண்டவர்,” “தீர்க்கதரிசி” ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் மூலத்தின் தீர்க்கதரிசனத் தொனியைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக வைக்கப்பட்டுள்ளது.
