lexical_decisions:
- source_word: ταῦτα
  choice: இவை
  rationale: முந்தைய உரையாடலையும் நிகழ்வுகளையும் சுட்டும் பன்மைச் சுட்டுப்பெயராக இருப்பதால், கிரேக்க பன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν Βηθανίᾳ
  choice: பெத்தானியாவில்
  rationale: இடப்பெயருடன் வரும் ἐν என்பதன் நேரடியான இடப்பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐγένετο
  choice: நிகழ்ந்தன
  rationale: இங்கு γίνομαι நிகழ்வுகள் நடந்ததைக் குறிக்கிறது; எழுவாயான பன்மை ‘இவை’ என்பதோடு பொருந்துமாறு பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தானுக்கு அக்கரையில்
  rationale: கதைசொல்லியின் பார்வையிலிருந்து ஆற்றின் மறுபுறத்திலுள்ள இடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ὅπου
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்தைத் தொடர்ந்து சுட்டும் இடத்தொடராக நவீன தமிழில் இயல்பாக அமைகிறது.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: யோவான் திருமுழுக்கு கொடுத்துக்கொண்டிருந்தார்
  rationale: ἦν உடன் வரும் நிகழ்காலப் பங்கேற்புவினை தொடர்ச்சியாக நடந்த செயலைக் குறிக்கிறது; ‘கொடுத்துக்கொண்டிருந்தார்’ அந்த நீடித்த செயற்பாட்டை வெளிப்படுத்துகிறது. ‘திருமுழுக்கு’ என்பது இச்சூழலில் நிலைபெற்ற, பொதுவாகப் புரியும் தமிழ் வேதாகமச் சொல்.
theological_decisions:
- issue: Βηθανίᾳ (‘பெத்தானியா’) என்பதற்குப் பதிலாக சில கையெழுத்துப் பிரதிகளிலும் பிற்கால மொழிபெயர்ப்பு மரபுகளிலும் காணப்படும் Βηθαβαρᾷ (‘பெத்தபாரா’) என்ற வாசகம்
  choice: பெத்தானியா
  alternative: பெத்தபாரா
  rationale: வழங்கப்பட்ட SBLGNT மூல உரை Βηθανίᾳ என்று வாசிப்பதால் முதன்மை உரையில் ‘பெத்தானியா’ வைக்கப்பட்டுள்ளது; வரலாற்றில் அறியப்பட்ட மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘இவை’ என்ற பன்மையும் தொடர்ச்சிச் செயலைக் காட்டும் ‘கொடுத்துக்கொண்டிருந்தார்’ என்பதும் கிரேக்க வடிவத்தின் முக்கிய நுணுக்கங்களைப் பாதுகாக்கின்றன.
