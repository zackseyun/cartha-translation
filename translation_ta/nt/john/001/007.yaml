source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: ta
  text: அவர் சாட்சியாக வந்தார்; ஒளியைக் குறித்து சாட்சி சொல்லவும், அவர் மூலமாக[a] எல்லாரும் நம்பவும் வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் மூலமாக” என்பது சூழலில் இயல்பாக யோவானின் சாட்சியின் மூலமாக என்பதைக் குறிக்கிறது; சிலர் இதை ஒளியின் மூலமாக என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: அவர்
  rationale: முந்தைய வசனத்தில் அறிமுகப்படுத்தப்பட்ட யோவானைக் குறிக்கும் சுட்டுப்பெயர். தமிழில் தனித்து ‘இவர்’ என்பதைக் காட்டிலும் ‘அவர்’ இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: சாட்சியாக வந்தார்
  rationale: εἰς μαρτυρίαν என்பது இச்சூழலில் யோவான் வந்த நோக்கத்தையும் அவரது சாட்சிப் பங்கையும் குறிக்கிறது; இவ்வடிவம் இயல்பான தமிழில் அந்த இரண்டையும் தருகிறது.
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: ஒளியைக் குறித்துச் சாட்சி சொல்லும்படி
  rationale: ἵνα நோக்கத்தையும், μαρτυρέω சாட்சி அளிக்கும் செயலையும், περί + genitive ‘குறித்து’ என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: τοῦ φωτός
  choice: ஒளி
  rationale: யோவான் நற்செய்தியின் சூழலில் இது வரவிருக்கும் கிறிஸ்துவைக் குறிக்கும் உருவகச் சொல்; மொழிபெயர்ப்பில் பொருளை விளக்கிச் சேர்க்காமல் ‘ஒளி’ என்றே வைக்கப்படுகிறது.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: எல்லாரும் நம்பிக்கை கொள்ளவே
  rationale: இரண்டாவது ἵνα உட்கூறு நோக்கத்தைத் தெரிவிக்கிறது; πάντες என்பதன் பரந்த பொருளையும் πιστεύω என்பதன் நம்புதல் சார்ந்த பொருளையும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά + genitive கருவி அல்லது இடைமுகத்தைக் குறிக்கிறது. சூழலில் ‘அவர்’ முதன்மையாக யோவானைக் குறித்தாலும், கிரேக்கப் பிரதிப்பெயரின் இலக்கண வாய்ப்பை மொழிபெயர்ப்பு நீக்குவதில்லை.
theological_decisions:
- issue: δι’ αὐτοῦ என்பதில் ‘அவர்’ யாரைக் குறிக்கிறது?
  choice: முதன்மையாகச் சாட்சியான யோவானைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘அவர்’ என்பது ஒளியாகிய கிறிஸ்துவைக் குறிக்கிறது எனப் புரிந்துகொள்ளலாம்
  rationale: வசனத்தின் இலக்கண எழுவாயும் உரையாடலின் மைய நபரும் யோவான் என்பதால் அவரே இயல்பான முன்னிடைச் சுட்டு. எனினும் αὐτοῦ ஆண்பால் பிரதிப்பெயராக இருப்பதால் ‘ஒளி’ குறிக்கும் நபரையும் சிலர் தொடர்புபடுத்தலாம்; இதை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் இரு நோக்க உட்கூறுகளும் பாதுகாக்கப்பட்டுள்ளன; தமிழில் இறுதிக் கூற்றின் நோக்கத்தைத் தெளிவாக்க ‘அவர் வந்தார்’ மீண்டும் கூறப்பட்டுள்ளது.
