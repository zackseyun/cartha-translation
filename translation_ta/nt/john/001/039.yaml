id: JHN.1.39
reference: John 1:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: ta
  text: அவர் அவர்களிடம், “வாருங்கள், பார்ப்பீர்கள்” என்றார். ஆகவே அவர்கள் சென்று, அவர் எங்கே தங்கியிருந்தார் என்பதைக் கண்டார்கள்; அன்று அவரோடு தங்கினார்கள். அப்போது ஏறக்குறையப் பத்தாம் மணியாக இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூரிய உதயத்திலிருந்து கணக்கிடப்பட்டால் இது மாலை சுமார் 4:00 மணி; சிலர் இதை ரோமக் கணக்குமுறையின்படி காலை சுமார் 10:00 மணி என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலமாகத் தருகிறது.
- source_word: Ἔρχεσθε καὶ ὄψεσθε
  choice: வாருங்கள், பார்ப்பீர்கள்
  rationale: அழைப்பின் நேரடித்தன்மையையும் ὄψεσθε என்பதன் எதிர்கால வடிவத்தையும் காக்கிறது.
- source_word: ἦλθαν οὖν
  choice: ஆகவே அவர்கள் சென்று
  rationale: οὖν காட்டும் இயல்பான விளைவையும், கதையில் சீடர்களின் நகர்வையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἶδαν ποῦ μένει
  choice: அவர் எங்கே தங்கியிருந்தார் என்பதைக் கண்டார்கள்
  rationale: μένω இச்சூழலில் தங்குமிடத்தைக் குறிக்கிறது; ‘கண்டார்கள்’ என்பது முன் வரும் ‘பார்ப்பீர்கள்’ உடனான சொல் எதிரொலியையும் ஓரளவு காக்கிறது.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: அவரோடு தங்கினார்கள்
  rationale: παρά உடனிருப்பதையும் ἔμειναν தங்கியிருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: அன்று
  rationale: மூலத்தில் இல்லாத ‘மீதமுள்ள’ அல்லது ‘முழுவதும்’ என்ற விளக்கத்தைச் சேர்க்காமல் காலத்தைக் குறிக்கிறது.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: அப்போது ஏறக்குறைய பத்தாம் மணி
  rationale: ὡς என்பதன் தோராயத்தையும், எந்த நேரக்கணிப்பு முறை என்பது தெளிவில்லாத நிலையில் மூலத்தின் ‘பத்தாம் மணி’ என்ற வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘பத்தாம் மணி’ என்பதற்கான நேரக்கணிப்பு முறை
  choice: முதன்மை உரையில் ‘பத்தாம் மணி’ என்று மூல வடிவத்தைப் பாதுகாத்தல்
  alternative: சூரிய உதயத்திலிருந்து கணக்கிட்டால் மாலை சுமார் 4:00 மணி; ரோமக் கணக்குமுறை எனப் புரிந்துகொண்டால் காலை சுமார் 10:00 மணி
  rationale: கிரேக்க உரை எந்த நேரக்கணிப்பு முறையைப் பயன்படுத்துகிறது என்று குறிப்பிடவில்லை; எனவே விவாதத்துக்குரிய பொருளை முதன்மை உரையில் தீர்மானிக்காமல், வாய்ப்புகளை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாருங்கள், பார்ப்பீர்கள்’ என்ற சுருக்கமான அமைப்பு கிரேக்க அழைப்பின் நேரடித்தன்மையையும் உண்மையான எதிர்கால வடிவத்தையும் காக்கிறது; நேரக்கணிப்பின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
