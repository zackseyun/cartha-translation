source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: ta
  text: ஆனால், அவரை ஏற்றுக்கொண்ட அனைவருக்கும்—அதாவது, அவருடைய பெயரின்மேல் நம்பிக்கை வைப்பவர்களுக்கு—கடவுளுடைய பிள்ளைகளாக ஆகும் உரிமையை[a] அவர் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘அதிகாரத்தை’ அல்லது ‘வல்லமையை.’ ἐξουσία என்ற கிரேக்கச் சொல் வழங்கப்பட்ட அதிகாரம், உரிமை அல்லது செயலாற்றும் திறன் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: அனைவருக்கும்
  rationale: பன்மையில் ‘அவரை ஏற்றுக்கொண்ட எல்லாரையும்’ உள்ளடக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிராகரிப்புக்கும் இங்கே கூறப்படும் ஏற்றுக்கொள்ளுதலுக்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔλαβον αὐτόν
  choice: அவரை ஏற்றுக்கொண்ட
  rationale: இங்கு λαμβάνω என்பது உடல்ரீதியாக எடுத்துக்கொள்வதை அல்ல, அவரை வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கிறது; ‘ஏற்றுக்கொண்ட’ என்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: ἔδωκεν
  choice: அவர் கொடுத்தார்
  rationale: δίδωμι என்ற வினையின் நேரடியான பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: ἐξουσίαν
  choice: உரிமையை
  rationale: இச்சூழலில் கடவுளுடைய பிள்ளைகளாக ஆவதற்காக அளிக்கப்படும் உரிமை அல்லது அங்கீகாரத்தைக் குறிக்கிறது; வெறும் ஆற்றல் என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: τέκνα θεοῦ
  choice: கடவுளுடைய பிள்ளைகளாக
  rationale: τέκνα என்பது ஆண் மக்களை மட்டும் குறிக்காமல் இருபாலரையும் உள்ளடக்கும் ‘பிள்ளைகள்’ என்பதால், மூலத்தின் பரந்த உறவுமுறைப் பொருளைப் பாதுகாக்கிறது.
- source_word: γενέσθαι
  choice: ஆகும்
  rationale: ஒரு புதிய நிலைக்கு வருதல் என்ற γίνομαι வினையின் மாற்றப் பொருளைப் பாதுகாக்கிறது.
- source_word: τοῖς πιστεύουσιν
  choice: நம்பிக்கை வைக்கிறவர்களுக்கு
  rationale: தொடர்ந்து நம்புகிறவர்களாக அடையாளப்படுத்தப்படும் மக்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயரில்
  rationale: நம்பிக்கை அவரது வெளிப்படுத்தப்பட்ட ஆளுமை மற்றும் அடையாளத்தை நோக்கியது என்பதை ‘பெயர்’ என்ற மூலச் சொல்லை நீக்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘அவரை ஏற்றுக்கொண்டவர்கள்’ என்பதற்கும் ‘அவருடைய பெயரில் நம்பிக்கை வைக்கிறவர்கள்’ என்பதற்கும் உள்ள உறவு
  choice: இரு தொடர்களையும் வைத்திருந்து, இரண்டாவது தொடரை முதலாவது குழுவை விளக்கும் இணைப்பாகக் காட்டுதல்
  alternative: இரண்டையும் முற்றிலும் ஒரே பொருளாகக் கருதி ஒரு தொடரை மட்டும் மொழிபெயர்த்தல்
  rationale: கிரேக்கம் இரு வெளிப்பாடுகளையும் வைத்திருக்கிறது; ‘அதாவது’ மற்றும் இடைக்கோடுகள் இரண்டாவது தொடர் பெறுபவர்களை விளக்குவதாகக் காட்டுகின்றன, ஆனால் மூலத்தின் இரு உருவகங்களையும் அழிக்கவில்லை.
- issue: τέκνα θεοῦ என்ற இறை உறவுச் சொல்
  choice: கடவுளுடைய பிள்ளைகள்
  alternative: கடவுளுடைய மகன்கள்
  rationale: மூலத்தில் பாலினம் குறிப்பாக ஆண்களுக்கு மட்டும் வரையறுக்கும் υἱοί அல்ல, இருபாலரையும் உள்ளடக்கும் τέκνα பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘அதாவது’ மற்றும் இடைக்கோடுகள் இறுதி பங்கேற்புத் தொடரின் விளக்கப் பங்கைத் தெளிவாக்குகின்றன. அடிக்குறிப்பு குறி அதன் உண்மையான தொடர்புச் சொல்லான ‘உரிமையை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
