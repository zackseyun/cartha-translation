- from: ஆனால், அவரை ஏற்றுக்கொண்ட அனைவருக்கும்—அதாவது, அவருடைய பெயரில் நம்பிக்கை வைக்கிறவர்களுக்கு—கடவுளுடைய பிள்ளைகளாக ஆகும் உரிமையை[a] அவர் கொடுத்தார்.
