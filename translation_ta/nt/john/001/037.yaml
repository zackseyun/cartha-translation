id: JHN.1.37
reference: John 1:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: ta
  text: அந்த இரண்டு சீடர்களும்[a] அவர் பேசுவதைக் கேட்டு, இயேசுவைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலமொழியில், “அவருடைய இரண்டு சீடர்கள்”; இங்குள்ள “அவருடைய” என்பது திருமுழுக்கு யோவானைக் குறிக்கிறது.
    reason: மூலத்தின் சொற்சார்ந்த வடிவத்தையும் αὐτοῦ என்பதன் சூழல்சார் குறிப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ἤκουσαν
  choice: கேட்டு
  rationale: இறந்தகால நிகழ்வாக அவர்கள் கேட்டதைக் குறிக்கிறது; தொடர்ந்து கவனமாகக் கேட்டார்கள் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: அந்த இரண்டு சீடர்களும்
  rationale: முந்தைய வசனத்தில் திருமுழுக்கு யோவானுடன் நின்றிருந்த குறிப்பிட்ட இரண்டு சீடர்களை இயல்பான தமிழில் சுட்டுகிறது. மூலத்தில் உள்ள αὐτοῦ (‘அவருடைய’) என்பதன் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: λαλοῦντος
  choice: அவர் பேசுவதைக்
  rationale: λαλέω என்பதன் நிகழ்கால வினையெச்சம், அவர்கள் கேட்டபோது அவர் பேசிக்கொண்டிருந்தார் என்ற உடனிகழ்வைத் தெரிவிக்கிறது. ‘பேசுவது’ என்பது நடுநிலையான, இயல்பான நடை.
- source_word: ἠκολούθησαν
  choice: பின்தொடர்ந்தார்கள்
  rationale: இங்கு முதலில் இயேசுவின் பின்னால் சென்ற உடல்சார் செயலைக் குறித்தாலும், அவருடைய சீடர்களாகத் தொடங்கும் கதைநயத்தையும் தக்கவைக்கிறது.
- source_word: τῷ Ἰησοῦ
  choice: இயேசுவைப்
  rationale: ἀκολουθέω உடன் வரும் நான்காம் வேற்றுமை வடிவம் பின்தொடரப்பட்ட நபரைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருளாக வழங்குவது இயல்பு.
theological_decisions:
- issue: οἱ δύο μαθηταὶ αὐτοῦ என்பதில் αὐτοῦ (‘அவருடைய’) யாரைக் குறிக்கிறது?
  choice: திருமுழுக்கு யோவானைக் குறிக்கும் எனப் புரிந்துகொள்ளப்பட்டு, முதன்மை உரையில் ‘அந்த இரண்டு சீடர்கள்’ என்று வழங்கப்பட்டுள்ளது.
  alternative: ‘அவருடைய இரண்டு சீடர்கள்’ என்று சொற்சார்பாக வழங்கலாம்; ஆனால் தமிழில் அது இயேசுவைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
  rationale: யோவான் 1:35–36-இன் உடனடிச் சூழலில், திருமுழுக்கு யோவான் தம் சீடர்கள் இருவருடன் நின்று இயேசுவைப் பற்றிப் பேசுகிறார். எனவே αὐτοῦ என்பது யோவானையே குறிக்கிறது; இருப்பினும் மூலத்தின் சொல் அமைப்பு அடிக்குறிப்பில் வெளிப்படையாகக் காட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பின்தொடர்ந்தார்கள்’ என்பது உடனடியாக அவருக்குப் பின்னால் சென்ற செயலும் சீடத்துவத்தை நோக்கிய கதைநயமும் ஆகிய இரண்டையும் தக்கவைக்கிறது.
