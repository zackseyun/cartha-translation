  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: ta
  text: ஆகவே, அந்தச் சீடர் இறக்கமாட்டார் என்ற இந்தச் செய்தி[a] சகோதரர்களிடையே[b] பரவியது. ஆனால் இயேசு அவரிடம், “அவர் இறக்கமாட்டார்” என்று சொல்லவில்லை; மாறாக, “நான் வரும்வரை அவர் நிலைத்திருக்க வேண்டுமென்று நான் விரும்பினால், அதைப் பற்றி உனக்கு என்ன?”[c] என்றே சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் கூற்று.” கிரேக்க λόγος என்பதற்கு “வார்த்தை,” “கூற்று,” அல்லது “செய்தி” என்று பொருள் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள “சகோதரர்கள்” என்பது சீடர்களின் சமூகத்தைக் குறிக்கிறது; கிரேக்கத்தில் ஆண்பால் பன்மையான ἀδελφοί பயன்படுத்தப்பட்டுள்ளது.
    reason: cultural_note
  - marker: c
    text: அதாவது, அந்தச் சீடர் ஒருபோதும் இறக்கமாட்டார் என்று இயேசு வாக்குறுதி அளிக்கவில்லை; “நான் விரும்பினால்” என்ற நிபந்தனையுடன்தான் கூறினார்.
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: பரவியது
  rationale: ஒரு செய்தி ஒரு குழுவினரிடையே சென்றடைந்து பரவியதைக் குறிக்கும் கிரேக்கச் சொல்லாட்சியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: οὗτος ὁ λόγος
  choice: இந்தச் செய்தி
  rationale: இங்கு λόγος என்பது இறையியல் சிறப்புப் பொருளுடைய ‘வார்த்தை’ அல்ல; சீடர்களிடையே பரவிய கூற்று அல்லது செய்தியைக் குறிக்கிறது. அடிக்குறிப்பில் ‘கூற்று’ என்ற மாற்றும் தரப்படுகிறது.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: சகோதரர்களிடையே
  rationale: செய்தி ஒரு சமூகத்திற்குள் பரவிய பொருளை ‘இடையே’ தெளிவாகத் தருகிறது; ἀδελφοί என்பதன் ஆண்பால் பன்மை வடிவமும் காக்கப்படுகிறது.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: அந்தச் சீடர்
  rationale: குறிப்பிட்ட சீடரைச் சுட்டும் ἐκεῖνος என்பதன் தனித்தன்மையையும் தமிழுக்குரிய மரியாதை ஒருமையையும் காக்கிறது.
- source_word: οὐκ ἀποθνῄσκει
  choice: இறக்கமாட்டார்
  rationale: பரவிய செய்தியின் உள்ளடக்கமாகக் கூறப்படும் எதிர்காலக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ εἶπεν δὲ
  choice: ஆனால் ... சொல்லவில்லை
  rationale: பரவிய தவறான புரிதலை ஆசிரியர் திருத்தும் முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: அவர் நிலைத்திருக்க வேண்டுமென்று நான் விரும்பினால்
  rationale: θέλω என்பதன் விருப்பத்தையும் μένειν என்பதன் ‘நிலைத்திரு/தங்கியிரு’ பொருளையும் யோவான் நடைக்கு ஏற்ற கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἕως ἔρχομαι
  choice: நான் வரும்வரை
  rationale: கிரேக்கத்தின் நேரடியான அமைப்பையும் அதன் எதிர்கால நோக்கையும் தேவையற்ற விளக்கமின்றிக் காக்கிறது.
- source_word: τί πρὸς σέ
  choice: அதைப் பற்றி உனக்கு என்ன?
  rationale: மற்ற சீடரின் நிலை பேதுருவுக்குரிய கவலை அல்ல என்பதை உணர்த்தும் சுருக்கமான கிரேக்க மரபுத்தொடரை இயல்பான நேரடித் தமிழில் தருகிறது.
theological_decisions:
- issue: அன்புச் சீடர் இறக்கமாட்டார் எனப் பரவிய கூற்றின் தன்மை
  choice: அது இயேசுவின் வாக்குறுதி அல்ல, சீடர்களிடையே பரவிய செய்தி என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இந்த வார்த்தை வெளியே சென்றது’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்.
  rationale: வசனமே அந்தப் புரிதலைத் தெளிவாகத் திருத்துகிறது. ‘செய்தி’ என்பது பரவிய கூற்றைச் சுட்டுகிறது; அடுத்த வாக்கியம் இயேசு அப்படிச் சொல்லவில்லை என்பதையும் நிபந்தனை வடிவையும் அப்படியே காக்கிறது.
- issue: இயேசுவின் நிபந்தனைக்குரிய கூற்றின் பொருள்
  choice: ‘விரும்பினால்’ என்ற நிபந்தனை மாற்றமின்றிக் காக்கப்பட்டது.
  alternative: அந்தச் சீடர் இயேசு வரும்வரை நிச்சயமாக உயிரோடு இருப்பார் எனப் பொருள் விளக்குதல்.
  rationale: ἐάν கொண்ட கிரேக்க வாக்கியம் ஓர் அனுமான நிபந்தனை; அதை வாக்குறுதியாகவோ தீர்க்கதரிசன உறுதியாகவோ மாற்றுவது மூலத்தின் இறையியல் அழுத்தத்தைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அந்தச் சீடர்’ என்பதில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனையும் ஆசிரியரின் திருத்தமும் தெளிவாகக் காக்கப்பட்டுள்ளன.
