    issue: The inferential connective οὖν is omitted.
    rationale: οὖν is present in the Greek and corresponds to ‘So’ in the English POB. Tamil ஆகவே restores this discourse connection without adding interpretive content.
  revised_text: ஆகவே, பேதுரு அவனைப் பார்த்தபோது இயேசுவிடம், “ஆண்டவரே, இவனைப் பற்றி என்ன?” என்று கேட்கிறார்.
