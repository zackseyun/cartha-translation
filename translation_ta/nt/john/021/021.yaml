  verdict: revise
  source_fidelity: The draft accurately conveys Peter seeing the other man, addressing Jesus as Lord, and asking the deliberately elliptical question. However, it omits οὖν (‘therefore/so’), which links Peter’s question to the immediately preceding scene and is represented in the English audit trail.
  naturalness: The Tamil is clear, idiomatic modern standard Tamil, and the use of கேட்கிறார் naturally expresses a spoken question. Adding ஆகவே preserves the connective without making the sentence unnatural.
  terminology: பேதுரு, இயேசு, and ஆண்டவரே are appropriate standard forms. இவனைப் பற்றி என்ன? suitably retains the open-ended force of οὗτος δὲ τί; without specifying the man’s future or fate.
  issues:
