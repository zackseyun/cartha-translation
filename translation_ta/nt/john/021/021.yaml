  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: ta
  text: ஆகவே, பேதுரு அவனைப் பார்த்தபோது இயேசுவிடம், “ஆண்டவரே, இவனைப் பற்றி என்ன?” என்று கேட்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: அவனைப் பார்த்தபோது
  rationale: Greek participial construction naturally indicates the circumstance in which Peter speaks; ‘அவனை’ preserves the masculine demonstrative reference without adding an identity absent from this verse.
- source_word: λέγει
  choice: கேட்கிறார்
  rationale: Although the historical present literally means ‘says,’ the quoted interrogative is most naturally expressed in modern Tamil as ‘asks’; the present tense retains the narrative vividness.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: Standard dignified Tamil vocative for addressing Jesus as Lord.
- source_word: οὗτος δὲ τί;
  choice: இவனைப் பற்றி என்ன?
  rationale: The elliptical Greek question is idiomatically rendered ‘What about this man?’ without supplying a specific fate or duty.
theological_decisions:
- issue: The ellipsis in οὗτος δὲ τί;
  choice: இவனைப் பற்றி என்ன?
  alternative: இவனுக்கு என்ன ஆகும்?
  rationale: The source leaves the precise concern unstated. The chosen wording preserves that ambiguity rather than specifying that Peter asks about the man’s future.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நேரடி உரை. மூலத்தின் சுருக்கமான கேள்வியும் அதன் பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
