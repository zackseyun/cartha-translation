id: JHN.21.11
reference: John 21:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: ta
  text: எனவே சீமோன் பேதுரு படகில் ஏறி[a], நூற்று ஐம்பத்து மூன்று பெரிய மீன்கள் நிறைந்திருந்த வலையைக் கரைக்கு[b] இழுத்தார். அவ்வளவு மீன்கள் இருந்தபோதிலும் வலை கிழியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலே ஏறினார்.’ கிரேக்க வினைச்சொல் சொற்பொருளில் ‘ஏறினார்’ என்று பொருள்படும்; இச்சூழலில் பேதுரு படகில் ஏறியதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்பொருளில், ‘நிலத்திற்கு’; இங்கு ‘கரைக்கு’ என்பது சூழலுக்கேற்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: படகில் ஏறி
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘ஏறினார்’ என்பதாகும். முந்தைய வசனத்தின் படகுச் சூழலில், பேதுரு வலையை இழுப்பதற்காகப் படகில் ஏறியதைக் குறிக்கும் இயல்பான தமிழாக்கமாக இது அமைகிறது; கிரேக்கத்தில் ‘படகு’ வெளிப்படையாக இல்லாததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய கட்டளைக்கும் பேதுருவின் செயலுக்கும் இடையிலான விளைவு அல்லது தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἵλκυσεν
  choice: இழுத்தார்
  rationale: வலையை நீரிலிருந்து கரைக்குக் கொண்டுவரும் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸ δίκτυον
  choice: வலையை
  rationale: மீன்பிடி வலையைக் குறிக்கும் வழக்கமான, நேரடியான தமிழ்ச் சொல்.
- source_word: εἰς τὴν γῆν
  choice: கரைக்கு
  rationale: γῆ என்பதன் அடிப்படைப் பொருள் ‘நிலம்’; இங்கு நீருக்கு எதிரான நிலப்பகுதியைக் குறிப்பதால் ‘கரை’ சூழலுக்கேற்ற இயல்பான சொல்.
- source_word: μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν
  choice: நூற்று ஐம்பத்து மூன்று பெரிய மீன்கள் நிறைந்திருந்த
  rationale: வலையின் உள்ளடக்கத்தையும் மீன்களின் அளவையும் துல்லியமான எண்ணிக்கையையும் தெளிவான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: τοσούτων ὄντων
  choice: அவ்வளவு மீன்கள் இருந்தபோதிலும்
  rationale: அதிக எண்ணிக்கையால் வலை கிழியக்கூடிய நிலையிருந்தும் அது கிழியவில்லை என்ற விட்டுக்கொடுப்பு உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐσχίσθη
  choice: கிழியவில்லை
  rationale: வலை சேதமடையாமல் இருந்ததை இயல்பான தமிழில் கூறுகிறது; கிரேக்கச் செயலப்பாட்டு வடிவத்தின் விளைவு மாறாமல் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. கிரேக்கத்தில் மறைமுகமாக உள்ள ‘படகு’ சூழலின் அடிப்படையில் முதன்மை உரையில் சேர்க்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
