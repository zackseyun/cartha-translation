  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: ta
  text: இயேசு அவனிடம், “அவன் நான் வரும்வரை நிலைத்திருக்க நான் விரும்பினால்[a], அதைப் பற்றி உனக்கு என்ன? நீ என்னைப் பின்பற்று” என்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் நான் வரும்வரை நிலைத்திருக்கும்படி நான் தீர்மானித்தால்.” கிரேக்க வினைச்சொல் விருப்பத்தையோ மனவுறுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நான் வரும்வரை” என்பது வேண்டுமென்றே திறந்த பொருளுடன் விடப்பட்டுள்ளது; இது வரலாற்றில் நிகழும் இயேசுவின் பிற்கால வருகையையா அல்லது அவரது இறுதி வருகையையா குறிக்கிறது என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐὰν
  choice: விரும்பினால்
  rationale: நிபந்தனைப் பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தின் அனுமானத் தன்மையை மிகைப்படுத்தவில்லை.
- source_word: θέλω
  choice: நான் விரும்புகிறேன்
  rationale: விருப்பம் அல்லது மனவுறுதியைக் குறிக்கும் வினை; இங்கு இயல்பான நவீனத் தமிழில் ‘விரும்பு’ பொருத்தமானது. ‘சித்தங்கொண்டால்’ என்பதும் சாத்தியம்.
- source_word: μένειν
  choice: நிலைத்திருக்க
  rationale: μένω என்பதன் ‘தங்கியிரு/நிலைத்திரு’ என்ற பரந்த பொருளையும் யோவான் நூலிலுள்ள சொல்லிணைப்பையும் காக்கிறது; ‘உயிரோடிருக்க’ என்று சூழலை விளக்கி முடிவுசெய்வதைத் தவிர்க்கிறது.
- source_word: ἕως ἔρχομαι
  choice: நான் வரும்வரை
  rationale: வருகையின் தன்மையையோ காலத்தையோ குறிப்பிடாமல் மூலத்தின் திறந்த பொருளைக் காக்கிறது; ‘திரும்பி வரும்வரை’ என்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: τί πρὸς σέ;
  choice: அதைப் பற்றி உனக்கு என்ன?
  rationale: மற்ற சீடனுடைய நிலை பேதுருவின் கவலையாக இருக்க வேண்டியதில்லை என்ற நேரடியான இடைமறிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σύ
  choice: நீ
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட முன்னிலைப்பெயரைப் பாதுகாத்து, ‘இவன்’ என்பதற்கு எதிரான கவனத்தை பேதுருவின்மேல் வைக்கிறது.
- source_word: μοι ἀκολούθει
  choice: என்னைப் பின்பற்று
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான நிழற்பொருளை சூழல் உணர்த்துகிறது; ‘தொடர்ந்து பின்பற்று’ என்று விரிவுபடுத்தாமல் இயல்பான கட்டளையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை தமிழ் கதைநடைக்கு ஏற்ற இறந்தகால வடிவில் வழங்குகிறது.
theological_decisions:
- issue: ἕως ἔρχομαι என்பதில் இயேசுவின் ‘வருகை’ எதைக் குறிக்கிறது
  choice: ‘நான் வரும்வரை’ என்று பொதுவாகவும் திறந்ததாகவும் மொழிபெயர்க்கப்பட்டது.
  alternative: உயிர்த்தெழுந்த பின்பான தோற்றம், எருசலேமின்மீதான நியாயத்தீர்ப்பு, அல்லது இறுதி வருகை என்று குறிப்பாக்குதல்.
  rationale: இந்த வசனம் வருகையின் குறிக்கோளைத் தானே வரையறுக்கவில்லை; ஆகவே ஒரு வரலாற்று அல்லது இறுதிக்கால விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை. ‘இவன்’ சூழலில் அருகிலுள்ள மற்ற சீடனைச் சுட்டும் இயல்பான வடிவமாகவும், ‘நீ’ கிரேக்கத்தின் வலியுறுத்தலைக் காக்கவும் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி [a] தொடர்புடைய சொற்றொடருக்குப் பின்பும், [b] ‘வரும்வரை’ என்ற திறந்த பொருளுடைய கூற்றை விளக்கும் வசன முடிவிலும் இடப்பட்டுள்ளது.
