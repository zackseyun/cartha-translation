revisions:
- from: இயேசு அவனிடம், “நான் வரும்வரை இவன் நிலைத்திருக்க வேண்டுமென்று நான் விரும்பினால்[a], அதைப் பற்றி உனக்கு என்ன? நீ என்னைப் பின்பற்று” என்றார்.[b]
  to: இயேசு அவனிடம், “அவன் நான் வரும்வரை நிலைத்திருக்க நான் விரும்பினால்[a], அதைப் பற்றி உனக்கு என்ன? நீ என்னைப் பின்பற்று” என்றார்.[b]
  rationale: The revision removes the added necessity nuance from the translation of θέλω + infinitive while preserving the conditional construction and the deliberate ambiguity of Jesus’ coming. It also uses a neutral pronoun for αὐτόν and updates footnote a to present ‘determination’ as a genuine lexical alternative rather than introducing an unwarranted ‘must’ construction.
