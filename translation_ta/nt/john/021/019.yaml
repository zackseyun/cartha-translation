source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: ta
  text: எப்படிப்பட்ட மரணத்தினால் அவர் கடவுளை மகிமைப்படுத்துவார் என்பதைச் சுட்டிக்காட்டி, இயேசு இதைச் சொன்னார்[a]. இதைச் சொன்னபின் அவர் பேதுருவிடம், “என்னைப் பின்பற்று” என்றார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எத்தகைய மரணத்தின் மூலம்.”
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்க மூலத்தில் இங்கே வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது: “அவர் பேதுருவிடம் சொல்கிறார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: குறிப்பிடுவதற்காகவே
  rationale: ஒரு காரியத்தை நேரடியாக விரிவாகச் சொல்லாமல் சுட்டிக்காட்டி உணர்த்தும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இங்கு பங்கேற்புவினை முன் கூறியதன் நோக்கத்தை விளக்குகிறது.
- source_word: ποίῳ θανάτῳ
  choice: எப்படிப்பட்ட மரணத்தினால்
  rationale: ποίῳ என்பதிலுள்ள வகை அல்லது தன்மை சார்ந்த நுட்பத்தையும், கருவி/வழியைக் குறிக்கும் வேற்றுமைப் பொருளையும் பாதுகாக்கிறது.
- source_word: δοξάσει τὸν θεόν
  choice: கடவுளை மகிமைப்படுத்தப்போகிறார்
  rationale: எதிர்கால வினையின் நோக்கைத் தெளிவாக வைத்திருக்கிறது; இறப்பின் மூலம் கடவுள் மகிமைப்படுவார் என்ற இறையியல் செறிவை விளக்கிச் சேர்க்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: καὶ τοῦτο εἰπὼν
  choice: இதைச் சொன்னபின்
  rationale: முன்னிகழ்வைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையை இயல்பான காலத் துணைவாக்கியமாகத் தருகிறது.
- source_word: λέγει αὐτῷ
  choice: அவர் பேதுருவிடம் ... என்றார்
  rationale: αὐτῷ என்பதன் சூழல்சார் சுட்டுப்பொருள் பேதுரு என்பதைத் தெளிவாக்குகிறது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழில் இயல்பான கதைநடை இறந்தகாலமாக வழங்கப்படுகிறது; அதற்கான மாற்று அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்று
  rationale: உடனடியான அழைப்பையும் தொடர்ந்த சீடத்துவத்தையும் தாங்கக்கூடிய, இயல்பான மற்றும் கண்ணியமான கட்டளை வடிவம்.
theological_decisions:
- issue: பேதுருவின் மரணம் கடவுளை மகிமைப்படுத்துவது எவ்வாறு என்பது
  choice: “கடவுளை மகிமைப்படுத்த” என்ற சொற்றொடர் விளக்க விரிவாக்கமின்றி வைக்கப்பட்டது.
  alternative: பேதுருவின் இரத்தசாட்சிய மரணம் அவரது உண்மையுள்ள சாட்சியத்தின் மூலம் கடவுளை மகிமைப்படுத்தும் என்று வெளிப்படையாக விரிவாக்குதல்.
  rationale: பேதுருவின் மரணம் கடவுளை மகிமைப்படுத்தும் என்று வசனம் கூறினாலும், அது எவ்வாறு நிகழும் என்பதைத் தானே விளக்கவில்லை. ஆகவே குறிப்பிட்ட சமயவியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. “இயேசு” மற்றும் “பேதுரு” ஆகிய பெயர்கள் சூழலிலுள்ள மறைசுட்டுகளைக் குழப்பமின்றித் தெளிவாக்குகின்றன. கிரேக்கத்தின் வரலாற்று நிகழ்காலத்தை முதன்மை உரையில் அசாதாரணமாகத் திணிக்காமல், இயல்பான தமிழ் கதைநடையாகத் தந்து அதன் வடிவத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
