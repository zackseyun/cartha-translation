    reason: lexical_alternative
  revision_rationale: The revision renders σημαίνων directly as “சுட்டிக்காட்டி,” removes unsupported emphasis, and retains the future sense of δοξάσει without interpretive expansion. It preserves the contextual identification of Jesus and Peter, maintains natural Tamil narrative style for λέγει, and keeps the historical-present note. Footnote a is adjusted to retain the Greek noun ‘death.’
