revisions:
- from: பொழுது ஏற்கெனவே விடிந்திருந்தபோது, இயேசு கரையில் நின்றார். ஆனாலும், அவர் இயேசு என்று சீடர்கள் அறிந்திருக்கவில்லை.[a]
  to: ஏற்கெனவே பொழுது விடிந்திருந்தபோது, இயேசு கரையில் நின்றார்; ஆனாலும், அவர் இயேசு என்பதைச் சீடர்கள் அறிந்திருக்கவில்லை.[a]
