source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: ta
  text: ஏற்கெனவே பொழுது விடிந்திருந்தபோது, இயேசு கரையில் நின்றார்; ஆனாலும், அவர் இயேசு என்பதைச் சீடர்கள் அறிந்திருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இயேசு என்பதை அடையாளம் கண்டுகொள்ளவில்லை.” கிரேக்கத்தில் இன்னும் சொற்சொல்லாக, “அவர் இயேசு என்பதை அறிந்திருக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: பொழுது ஏற்கெனவே விடிந்திருந்தபோது
  rationale: இந்த வேற்றுமைத் தனிநிலைத் தொடர் காலச் சூழலைக் குறிக்கிறது. πρωΐα அதிகாலை அல்லது பொழுது விடியும் நேரத்தைக் குறிக்கிறது; ἤδη என்பதன் ‘ஏற்கெனவே’ என்ற வலியுறுத்தலையும் γενομένης என்பதன் நிறைவுற்ற காலநிலையையும் இச்சொற்றொடர் இயல்பான தமிழில் தக்கவைக்கிறது. δέ ஒரு மென்மையான கதைத் தொடர்ச்சிக் கூறாக இருப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: ἔστη
  choice: நின்றார்
  rationale: ἵστημι என்பதன் இறந்தகால நிகழ்வை எளிமையாகக் குறிக்கிறது; ‘நின்றுகொண்டிருந்தார்’ என்ற தொடர்நிலைப் பொருளையோ ‘வந்து நின்றார்’ என்ற கூடுதல் நகர்வையோ சேர்க்கவில்லை.
- source_word: εἰς τὸν αἰγιαλόν
  choice: கரையில்
  rationale: நிற்றலைக் குறிக்கும் வினையுடன் εἰς இங்கு இடநிலையை இயல்பாகக் காட்டுகிறது; αἰγιαλός நீர்நிலையின் கரையைக் குறிக்கிறது.
- source_word: οὐ μέντοι
  choice: ஆனாலும்
  rationale: இயேசு கரையில் இருந்ததற்கும் சீடர்கள் அவரை அறியாததற்கும் இடையிலான எதிர்மறைத் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ᾔδεισαν
  choice: அறிந்திருக்கவில்லை
  rationale: οἶδα என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காக்கிறது. சூழலில் ‘அடையாளம் கண்டுகொள்ளுதல்’ என்ற பொருள் சாத்தியமானாலும் அதை முதன்மை உரையில் விளக்கமாகத் திணிக்கவில்லை.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: அறியப்பட்ட சீடர் குழுவைத் தமிழ் இயல்புப்படி குறிக்கிறது; மூலத்தில் இல்லாத ‘அவருடைய’ என்ற உடைமைச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: அவர் இயேசு என்று
  rationale: அடையாளப்படுத்தும் கிரேக்க வாக்கியத்தை இயல்பான தமிழில் தருகிறது; கடந்தகாலக் கதைச் சூழலுடன் பொருந்தும்படி பிரதான வினை ‘அறிந்திருக்கவில்லை’ என்பதில் காலம் வெளிப்படுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவைச் சீடர்கள் அறியாதிருத்தல்
  choice: அவர்கள் அவரை அறியவில்லை என்ற நிகழ்வை மட்டும் கூறுதல்
  alternative: ‘அவர் இயேசு என்பதை அடையாளம் கண்டுகொள்ளவில்லை’ என்று இன்னும் விளக்கமாக மொழிபெயர்த்தல்
  rationale: அவர்கள் ஏன் அவரை அறியவில்லை என்பதை வசனம் விளக்குவதில்லை. ஆகவே இயேசுவின் தோற்றம் அல்லது சீடர்களின் பார்வை குறித்து எந்தக் கோட்பாட்டு விளக்கத்தையும் மொழிபெயர்ப்பு சேர்க்காமல், மூலத்தின் இறையியல் பதற்றத்தையும் கதைசார் கட்டுப்பாட்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘பொழுது விடிதல்,’ ‘கரை,’ ‘அறிதல்’ போன்ற பொதுவான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; காரணம் கூறாத மூலத்தின் சுருக்கமும் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
