  text: இயேசு அவர்களிடம், “நீங்கள் இப்போது பிடித்த மீன்களில் சிலவற்றைக் கொண்டுவாருங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் முறையில்: “நீங்கள் இப்போது பிடித்த மீன்களிலிருந்து கொண்டுவாருங்கள்.”'
    reason: ἀπό என்பதன் நேரடியான ‘இலிருந்து’ என்ற வடிவம் மூலத்தில் உள்ளது; முதன்மை உரை அதன் பகுதி சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க மொழியில் இது வரலாற்று நிகழ்காலமாக இருந்தாலும், கடந்த நிகழ்வை இயல்பான தமிழ் கதைநடையில் எடுத்துரைக்க இறந்தகால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Ἐνέγκατε
  choice: கொண்டுவாருங்கள்
  rationale: இது பன்மை ஏவல் வடிவம்; மீன்களை இயேசு இருந்த இடத்திற்குக் கொண்டுவரும்படியான நேரடியான கட்டளையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: மீன்களில் சிலவற்றை
  rationale: ἀπό இங்கு மொத்தப் பிடிப்பிலிருந்து ஒரு பகுதியைக் குறிக்கும் பொருளில் வருகிறது; தமிழில் ‘மீன்களில் சிலவற்றை’ என்பது அந்தப் பகுதி சார்ந்த பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὀψαρίων
  choice: மீன்கள்
  rationale: இந்தச் சூழலில் கடலிலிருந்து அப்போதுதான் பிடிக்கப்பட்டவற்றைக் குறிக்கிறது; அவற்றின் அளவையோ சமைத்த நிலையையோ தேவையின்றி குறிப்பதைக் தவிர்க்க ‘மீன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὧν ἐπιάσατε νῦν
  choice: நீங்கள் இப்போது பிடித்த
  rationale: சார்பு வாக்கியம் எந்த மீன்கள் என அடையாளப்படுத்துகிறது; νῦν என்பதன் நேரத்தையும் உடனடித்தன்மையையும் ‘இப்போது’ நேரடியாகப் பாதுகாக்கிறது.
