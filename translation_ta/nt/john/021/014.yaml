  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: ta
  text: இதுவரை, இயேசு இறந்தோரிலிருந்து எழுப்பப்பட்ட பின்பு சீடர்களுக்குத் தம்மை வெளிப்படுத்திய மூன்றாவது முறை இது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதுவரை, இயேசு இறந்தோரிலிருந்து எழுப்பப்பட்ட பின்பு சீடர்களுக்குத் தோன்றிய மூன்றாவது முறை இது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இது
  rationale: இப்போது விவரிக்கப்பட்ட வெளிப்பாட்டைச் சுட்டுகிறது; தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ἤδη τρίτον
  choice: மூன்றாவது முறை
  rationale: இது நிகழ்வுகளின் எண்ணிக்கையில் மூன்றாவது என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ἤδη-யின் இந்நேரத்திற்குள் எட்டிய எண்ணிக்கை என்ற நுணுக்கம் வாக்கியச் சூழலில் வெளிப்படுகிறது.
- source_word: ἐφανερώθη
  choice: தம்மை வெளிப்படுத்தியது
  rationale: கிரேக்கச் சொல்லின் ‘வெளிப்படுதல்/வெளிப்படுத்தப்படுதல்’ என்ற யோவானியச் சொல் நயத்தைப் பேணுகிறது. தமிழ் வாக்கியத்தில் இயல்புக்காகத் தன்னிலைப் பொருளுடன் அமைக்கப்பட்டுள்ளது; ‘தோன்றினார்’ என்பதும் சூழலுக்கேற்ற மாற்று.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: பெயர்ச்சொல்லின் வழக்கமான தமிழ் வடிவம்.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களுக்கு
  rationale: கிரேக்கத்தில் ‘அவருடைய’ என்பது வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், தத்திவுப் பொருளை நேரடியாகக் கொடுக்கிறது.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து எழுப்பப்பட்ட பின்பு
  rationale: முதன்மை வினைக்கு முன்பான செயலைத் தெளிவுபடுத்துவதோடு, கிரேக்க இறந்தகாலச் செயப்பாட்டு எச்சத்தின் செயப்பாட்டு வடிவத்தையும் பேணுகிறது.
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶν என்பதிலுள்ள உயிர்த்தெழுதல் மொழிநடை
  choice: இறந்தோரிலிருந்து எழுப்பப்பட்ட பின்பு
  alternative: இறந்தோரிலிருந்து உயிர்த்தெழுந்த பின்பு
  rationale: கிரேக்கத்தில் எச்சம் செயப்பாட்டு வடிவில் இருப்பதால், ‘எழுப்பப்பட்ட’ என்று அதை முதன்மை உரையில் பேணுகிறது; மாற்று வடிவம் பொருளில் ஏற்றதாயினும் இலக்கணக் குரலை மாற்றுகிறது.
- issue: ἐφανερώθη என்பதின் பொருள் நயம்
  choice: தம்மை வெளிப்படுத்தியது
  alternative: தோன்றினார்
  rationale: முதன்மை வடிவம் ‘வெளிப்படுத்துதல்/வெளிப்படுதல்’ என்ற சொல்லின் நயத்தைப் பேணுகிறது; ‘தோன்றினார்’ என்பது சூழலில் இயல்பானதாயினும் அந்தச் சொல் நயத்தைச் சற்றுக் குறைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘வெளிப்படுத்தியது’ என்ற வடிவம் மூலத்தின் சொல் நயத்தைப் பேணுகிறது; அடிக்குறிப்பில் இயல்பான ‘தோன்றியது’ மாற்று தரப்பட்டுள்ளது.
