  source_fidelity: 'The draft accurately conveys the principal referents, Peter''s recognition of Jesus as Lord, the outer garment, and his entering the sea. A small revision restores the Greek narrative order more clearly: Peter first girds the garment, with his light clothing given parenthetically as the explanation, and then jumps into the sea.'
