id: JHN.21.7
reference: John 21:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: ta
  text: ஆகவே, இயேசு அன்புகூர்ந்த அந்தச் சீடர் பேதுருவிடம், “ஆண்டவர்தான்!” என்றார். சீமோன் பேதுரு அவர் ஆண்டவர் என்று கேட்டதும், தன் மேலாடையை இடுப்பில் கட்டிக்கொண்டார் (ஏனெனில் அவர் லேசாக ஆடை அணிந்திருந்தார்[a]); கடலில் குதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் நிர்வாணமாக இருந்தார்.” கிரேக்கச் சொல் சூழலைப் பொறுத்து முற்றிலும் நிர்வாணமாக இருப்பதையோ, போதிய ஆடை அணியாமல் இருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: ஆகவே ... என்றார்
  rationale: οὖν காட்டும் முந்தைய நிகழ்விலிருந்து வரும் உணர்தலையும் கதைத் தொடர்ச்சியையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: இயேசு அன்புகூர்ந்த அந்தச் சீடர்
  rationale: ἐκεῖνος என்பதன் சுட்டுப் பொருளை ‘அந்த’ எனவும், யோவானுக்கே உரிய அடையாளப்படுத்தலை இயல்பாகவும் காக்கிறது.
- source_word: Ὁ κύριός ἐστιν
  choice: அவர் ஆண்டவர்தான்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்று வழங்கி, அடையாளம் கண்டுகொள்ளும் வலியுறுத்தலை ‘தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκούσας
  choice: கேட்டதும்
  rationale: முன்னிகழ்வையும் உடனடியாகத் தொடரும் செயலையும் சுருக்கமான இயல்பான தமிழில் காட்டுகிறது.
- source_word: τὸν ἐπενδύτην
  choice: தன் மேலாடையை
  rationale: ἐπενδύτης குறிக்கும் வெளிப்புற ஆடையைத் தேவையற்ற ஆடைச்சிறப்பு ஊகமின்றி வழங்குகிறது.
- source_word: διεζώσατο
  choice: இடுப்பில் கட்டிக்கொண்டு
  rationale: ஆடையைத் தன்னைச் சுற்றி இறுக்கிக் கட்டும் செயலை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἦν γὰρ γυμνός
  choice: தான் குறைவாக ஆடை அணிந்திருந்ததால்
  rationale: γυμνός என்பதற்கு முற்றிலும் நிர்வாணம் என்றும் போதிய ஆடையின்றி என்றும் பொருள் வரக்கூடிய சூழல்சார் நெகிழ்வைக் கருத்தில் கொண்டு, முதன்மை உரையில் மீன்பிடிப் பணிச்சூழலுக்கு ஏற்ற பொருளை வழங்குகிறது; நேரடியான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: கடலில் குதித்தார்
  rationale: சொல்லுக்குச் சொல் ‘தன்னைக் கடலில் எறிந்தார்’ என்பதற்குப் பதிலாக, அதே விரைவான நோக்கமுள்ள செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவை அடையாளம் காணும் கூற்றில் κύριος
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ‘ஆண்டவர்’ என்பது சாதாரண மரியாதைப் பட்டத்தையும் இச்சூழலின் கிறிஸ்துவியல் கனத்தையும் கூடுதல் விளக்கமின்றி காக்கிறது.
- issue: பேதுருவின் ஆடைநிலையைக் குறிக்கும் γυμνός
  choice: குறைவாக ஆடை அணிந்திருந்தார்
  alternative: நிர்வாணமாக இருந்தார்
  rationale: கிரேக்கச் சொல்லின் இரு சாத்தியங்களையும் அமைதியாகத் தீர்த்துவிடாமல், பணிச்சூழலுக்கு ஏற்ற பொருளை உரையில் வழங்கி நேரடியான பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. உரை கண்ணியமாகவும் பொதுவாசகர்களுக்குப் புரியுமாறும் அமைக்கப்பட்டுள்ளது; கிரேக்கத்தின் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
