revisions:
- from: ஆகவே, இயேசு அன்புகூர்ந்த அந்தச் சீடர் பேதுருவிடம், “அவர் ஆண்டவர்தான்” என்றார். அவர் ஆண்டவர் என்று சீமோன் பேதுரு கேட்டதும், தான் குறைவாக ஆடை அணிந்திருந்ததால்[a] தன் மேலாடையை இடுப்பில் கட்டிக்கொண்டு, கடலில் குதித்தார்.
