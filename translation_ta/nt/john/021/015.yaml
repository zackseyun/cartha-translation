  source_fidelity: கிரேக்க மூலத்தின் காலத் தொடர்பு, யோவானின் மகன் என்ற தந்தைப்பெயர், நேசிப்பு வினைச்சொற்களின் மாற்றம், ஆண்டவரே, மற்றும் ஆட்டுக்குட்டிகளுக்கு உணவளி என்ற கட்டளை ஆகியவை மொத்தத்தில் உண்மையோடு மொழிபெயர்க்கப்பட்டுள்ளன. ஆனால் “இவர்களைவிட” என்பது πλέον τούτων என்பதன் திறந்த சுட்டலை மனிதர்களாக மட்டும் கட்டுப்படுத்துகிறது. கிரேக்கத்தின் நடுநிலைப் பன்மைச் சுட்டல் மனிதர்களையோ அருகிலுள்ள பொருள்களையோ குறிக்கலாம்; மேலும் ஒப்பீடு மற்றவர்களின் அன்புடனும் இருக்கலாம். முதன்மை உரையில் நடுநிலைச் சுட்டலை வைத்தும் அடிக்குறிப்பில் வாய்ப்புகளைத் தெளிவுபடுத்தியும் இதைச் சரிசெய்யலாம்.
  naturalness: நடை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “காலை உணவு உண்டபின்,” “ஆம், ஆண்டவரே,” மற்றும் “என் ஆட்டுக்குட்டிகளுக்கு உணவளி” இயல்பானவை. “இவற்றைவிட” என்பது கிரேக்க நடுநிலைச் சுட்டலுக்கு நெருக்கமானது; அடிக்குறிப்புடன் சேர்ந்து வாசகருக்கு தேவையான விளக்கத்தை அளிக்கிறது.
  terminology: “யோவானின் மகனான சீமோனே,” “ஆண்டவரே,” “நேசிக்கிறாயா/நேசிக்கிறேன்,” மற்றும் “ஆட்டுக்குட்டிகள்” ஆகியவை பொருத்தமானவை. ἀγαπάω/φιλέω இரண்டையும் முதன்மை உரையில் “நேசி” குடும்பச் சொல்லால் தருவது, சர்ச்சைக்குரிய அர்த்தப் படிநிலையைத் திணிக்காமல் இருப்பதால் ஏற்றது. βόσκω-வின் குறிப்பான ‘உணவளி’ என்பதும் துல்லியமானது.
