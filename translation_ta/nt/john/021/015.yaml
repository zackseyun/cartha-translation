source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: ta
  text: அவர்கள் காலை உணவு உண்டபின், இயேசு சீமோன் பேதுருவிடம், “யோவானின் மகனான சீமோனே, இவற்றைவிட அதிகமாக என்னை நேசிக்கிறாயா?”[a] என்று கேட்டார். அதற்கு அவன், “ஆம், ஆண்டவரே, நான் உம்மை நேசிக்கிறேன் என்பது உமக்குத் தெரியும்” என்றான். இயேசு அவனிடம், “என் ஆட்டுக்குட்டிகளுக்கு உணவளி” என்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவற்றைவிட அதிகமாக” என்பதற்கான கிரேக்கச் சொற்றொடர் ஒப்பீட்டை முழுமையாகச் சொல்லாமல் விடுகிறது. இதற்கு “மற்றவர்கள் என்னை நேசிப்பதைவிட அதிகமாக” என்றும், “இவர்களை அல்லது இங்குள்ளவற்றை நேசிப்பதைவிட அதிகமாக” என்றும் பொருள் கொள்ளலாம். மேலும், இயேசுவின் கேள்வியில் ἀγαπάω என்ற வினையும் பேதுருவின் பதிலில் φιλέω என்ற வினையும் வருகின்றன. சிலர் இவற்றுக்கிடையில் அர்த்த வேறுபாட்டைக் காண்கிறார்கள்; மற்றவர்கள் இதை நடையியல் மாறுபாடாகக் கருதுகிறார்கள். முதன்மை உரை இரண்டையும் “நேசி” என்ற சொல்லால் மொழிபெயர்க்கிறது.
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: “உணவளி” என்பதற்கான βόσκω என்ற கிரேக்க வினை, பொதுவான மேய்ப்புப் பணியைவிட குறிப்பாக உணவூட்டுவதை வலியுறுத்துகிறது.
    reason: lexical_precision
lexical_decisions:
- source_word: ἠρίστησαν
  choice: காலை உணவு உண்டபின்
  rationale: ἀριστάω காலை நேர உணவை உண்பதைக் குறிக்கிறது; காலத் தொடர்பையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: λέγει
  choice: கேட்டார் / என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடையில் இறந்தகாலமாக்கி, கேள்வி வரும் இடத்தில் ‘கேட்டார்’ என்றும் கட்டளை வரும் இடத்தில் ‘என்றார்’ என்றும் சூழலுக்கேற்றவாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Σίμων Ἰωάννου
  choice: யோவானின் மகனான சீமோனே
  rationale: Ἰωάννου என்ற உரிமை வேற்றுமை வடிவம் இங்கு தந்தையின் பெயரைக் குறிக்கிறது; ‘யோனாவின் மகன்’ என்ற வேறு மரபு வாசகத்தை இங்கு சேர்க்கவில்லை.
- source_word: ἀγαπᾷς / φιλῶ
  choice: நேசிக்கிறாயா / நேசிக்கிறேன்
  rationale: இரண்டு கிரேக்க வினைகளின் வேறுபாடு இச்சூழலில் திட்டவட்டமான தரநிலை வேறுபாட்டைக் காட்டுகிறதா என்பது உறுதியல்ல. ஆகவே முதன்மை உரையில் இரண்டுக்கும் இயல்பான ஒரே தமிழ் வினை பயன்படுத்தப்பட்டு, வேறுபாடு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
- source_word: πλέον τούτων
  choice: இவர்களைவிட அதிகமாக
  rationale: தமிழில் இயல்பான ஒப்பீட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் ஒப்பீட்டின் துல்லியமான பொருள் மறைவாக இருப்பதால், அதன் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: யோவான் நற்செய்தியின் சூழலில் இயேசுவை நோக்கிய மரியாதையும் அதிகார அங்கீகாரமும் வெளிப்படுவதால் κύριε என்பதற்கு ‘ஆண்டவரே’ பொருத்தமானது.
- source_word: οἶδας
  choice: உமக்குத் தெரியும்
  rationale: பேதுரு இயேசுவின் தனிப்பட்ட அறிவைச் சார்ந்து கூறுவதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Βόσκε
  choice: உணவளி
  rationale: βόσκω என்பது பொதுவாக மேய்ப்புப் பராமரிப்பு முழுவதையும் அல்ல, குறிப்பாக உணவூட்டுதலைக் குறிக்கிறது; எனவே ‘உணவளி’ துல்லியமானது.
- source_word: τὰ ἀρνία μου
  choice: என் ஆட்டுக்குட்டிகள்
  rationale: ἀρνία இளம் ஆடுகளைக் குறிக்கும் மேய்ப்பர் உருவகத்தைத் தக்கவைக்கிறது; μου என்ற உரிமைச் சொல்லும் ‘என்’ என்று நேரடியாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ἀγαπάω மற்றும் φιλέω ஆகியவற்றை முதன்மை உரையில் வேறுபடுத்த வேண்டுமா
  choice: இரண்டையும் ‘நேசி’ என்ற ஒரே தமிழ் வினையால் மொழிபெயர்த்து, கிரேக்கச் சொல் மாற்றத்தை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ἀγαπάω என்பதற்கு ‘நேசி’ என்றும் φιλέω என்பதற்கு ‘பாசம் வைத்திரு’ அல்லது ‘அன்புகொள்’ என்றும் வேறுபடுத்துதல்.
  rationale: இச்சொல் மாற்றம் நோக்கமுள்ள அர்த்தப் படிநிலையா அல்லது யோவானின் நடையியல் மாறுபாடா என்பது விவாதத்திற்குரியது. ‘உயர்ந்த அன்பு/தாழ்ந்த அன்பு’ என்ற இறையியல் அமைப்பை உரைக்குள் இறக்காமல், உண்மையான தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- issue: πλέον τούτων என்பதிலுள்ள ஒப்பீடு
  choice: முதன்மை உரையில் சுருக்கமான ஒப்பீட்டை வைத்துக்கொண்டு, கிரேக்கத்தின் மறைபொருள் வாய்ப்புகளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘இவர்கள் என்னை நேசிப்பதைவிட நீ அதிகமாக நேசிக்கிறாயா?’ அல்லது ‘இவற்றை நேசிப்பதைவிட என்னை அதிகமாக நேசிக்கிறாயா?’ என்று ஒரு பொருளை மட்டும் தேர்ந்தெடுத்தல்.
  rationale: கிரேக்கம் ஒப்பிடப்படுவது மற்ற சீடர்களின் அன்பா, பேதுரு அவர்கள்மீது அல்லது அருகிலுள்ளவற்றின்மீது கொண்ட பற்றா என்பதை வெளிப்படையாகக் கூறவில்லை; ஆகவே ஒரு விளக்கத்தை இறுதியானதாக மாற்றக்கூடாது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிப் பேதுரு பேசும் இடத்தில் ‘உம்’ மரியாதை வடிவமும், கதைநடையில் ‘அவன்’ என்ற மூலத்துக்கு நெருக்கமான சுட்டுப்பெயரும் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் உண்மையான தெளிவின்மைகள் முதன்மை உரையைச் சிக்கலாக்காமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
