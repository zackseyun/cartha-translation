  revised_text: அவர்கள் காலை உணவு உண்டபின், இயேசு சீமோன் பேதுருவிடம், “யோவானின் மகனான சீமோனே, இவற்றைவிட அதிகமாக என்னை நேசிக்கிறாயா?”[a] என்று கேட்டார். அதற்கு அவன், “ஆம், ஆண்டவரே, நான் உம்மை நேசிக்கிறேன் என்பது உமக்குத் தெரியும்” என்றான். இயேசு அவனிடம், “என் ஆட்டுக்குட்டிகளுக்கு உணவளி” என்றார்.[b]
