source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: ta
  text: இயேசு வந்து, அப்பத்தை எடுத்து அவர்களுக்குக் கொடுக்கிறார்[a]; மீனையும் அவ்வாறே கொடுக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு வந்து, அப்பத்தை எடுத்து அவர்களுக்குக் கொடுத்தார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் வரலாற்று நிகழ்கால வினைகள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: 'நேரடியாக: ‘மீனையும் அவ்வாறே.’ மீனுக்கும் அதே செயலைச் செய்தார் என்பது கிரேக்கத்தில் குறிப்பால் உணர்த்தப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்து … கொடுக்கிறார்
  rationale: கிரேக்கத்தில் நிகழ்கால வடிவில் வரும் வரலாற்று நிகழ்காலத்தைத் தமிழிலும் உயிரோட்டமான நிகழ்கால நடையில் தக்கவைக்கிறது; ‘வந்து’ என்பது தொடர்ச்சியான செயல்களை இயல்பாக இணைக்கிறது.
- source_word: λαμβάνει
  choice: எடுத்து
  rationale: உணவைப் பகிர்ந்தளிப்பதற்கு முன் அதை எடுக்கும் எளிய செயலைத் தெளிவாகக் குறிக்கிறது; ‘பெற்று’ என்பது இச்சூழலில் பொருந்தாது.
- source_word: τὸν ἄρτον
  choice: அப்பத்தை
  rationale: குறிப்பிட்ட உணவில் அங்கே இருந்த அப்பத்தைக் குறிக்கும் கிரேக்கச் சுட்டை வேற்றுமை உருபுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δίδωσιν αὐτοῖς
  choice: அவர்களுக்குக் கொடுக்கிறார்
  rationale: கிரேக்கத்தின் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘பரிமாறுகிறார்’ என்பதில் உள்ள கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
- source_word: τὸ ὀψάριον
  choice: மீனையும்
  rationale: யோவான் நூலின் இச்சூழலில் உணவாக உள்ள மீனைக் குறிக்கிறது. ‘சுட்ட மீன்’ போன்ற கூடுதல் விவரம் சொல்லில் கட்டாயமாக இல்லை.
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: அப்பத்திற்குச் செய்ததையே மீனுக்கும் செய்தார் என்ற இணைச்செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலுக்குப் பிந்தைய தோற்றத்தின் வர்ணனையில் வரலாற்று நிகழ்கால வினைகள்
  choice: ‘கொடுக்கிறார்’ என்ற நிகழ்காலக் கதைநடையைத் தக்கவைத்தல்
  alternative: ‘கொடுத்தார்’ என்று இறந்தகாலத்தில் சீராக்குதல்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; கிரேக்க மூலத்தின் உயிரோட்டமான கதைநடையைத் தமிழில் இயன்றவரைத் தக்கவைக்கும் மொழிபெயர்ப்புத் தீர்மானம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது. கிரேக்கத்தின் வரலாற்று நிகழ்காலம் பிரதான உரையில் பாதுகாக்கப்பட்டு, இயல்பான இறந்தகால மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
