- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதற்கான மரியாதையும் யோவானிய இறையியல் ஒலியும் உள்ள வழக்கமான தமிழ் இணை.
- source_word: ὁ παραδιδούς σε
  choice: உம்மைக் காட்டிக்கொடுக்கப்போகிறவன்
  rationale: பாடுபாட்டு நிகழ்வுச் சூழலில் παραδίδωμι துரோகமாக ஒப்படைத்தலைக் குறிக்கிறது; நிகழவிருக்கும் செயலை இயல்பான தமிழ் கேள்வியாக வழங்குகிறது.
