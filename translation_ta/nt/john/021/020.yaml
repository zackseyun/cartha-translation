source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: ta
  text: பேதுரு திரும்பி, இயேசு அன்புகூர்ந்த சீடர் பின்தொடர்ந்து வந்துகொண்டிருந்ததைக் கண்டார்[a]. அந்தச் சீடரே இரவு உணவின்போது இயேசுவின் மார்பில் சாய்ந்திருந்தவரும், “ஆண்டவரே, உம்மைக் காட்டிக்கொடுப்பவன் யார்?” என்று கேட்டவரும் ஆவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரைப் பின்தொடர்ந்து” அல்லது “அவர்களைப் பின்தொடர்ந்து” என்றும் பொருள் கொள்ளலாம்; கிரேக்கப் பெயரெச்சம் யாரைப் பின்தொடர்ந்தார் என்பதை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: திரும்பிப் பார்த்தபோது
  rationale: இறந்தகாலப் பெயரெச்சம் பேதுருவின் திரும்புதலை அடுத்த பார்வையுடன் இணைக்கிறது; தமிழில் இயல்பான நிகழ்வுத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: βλέπει
  choice: கண்டார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்கப்படுகிறது.
- source_word: τὸν μαθητὴν
  choice: சீடர்
  rationale: யோவான் நூலில் வழக்கமாக வரும் சீடத்துவச் சொல்லின் தொடர்ச்சியையும் மரியாதையான தமிழ் நடையையும் காக்கிறது.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: இயேசு அன்புகூர்ந்த
  rationale: உறவுநிலை வாக்கியத்தின் பொருளைச் சுருக்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἀκολουθοῦντα
  choice: பின்னால் வருவதை
  rationale: பின்தொடர்ந்து வந்த இயக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தில் இல்லாத செயப்படுபொருள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: ἀνέπεσεν
  choice: சாய்ந்துகொண்டு
  rationale: விருந்தில் சாய்ந்து அமர்ந்த உணவுமுறையையும் யோவான் 13-இல் கூறப்பட்ட குறிப்பிட்ட அசைவையும் வாசகருக்கு இயல்பாக உணர்த்துகிறது.
- source_word: ἐν τῷ δείπνῳ
  choice: இரவு உணவின்போது
  rationale: δεῖπνον குறிக்கும் உணவு நிகழ்வை நவீன, தெளிவான தமிழில் கூறுகிறது; வழிபாட்டியல் தொழில்நுட்பச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: இயேசுவின் மார்பருகே
