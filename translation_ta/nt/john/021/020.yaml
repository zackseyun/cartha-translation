revisions:
- from: பேதுரு திரும்பிப் பார்த்தபோது, இயேசு அன்புகூர்ந்த சீடர் பின்னால் வருவதைக் கண்டார்[a]. அந்தச் சீடரே இரவு உணவின்போது இயேசுவின் மார்பருகே சாய்ந்துகொண்டு, “ஆண்டவரே, உம்மைக் காட்டிக்கொடுக்கப்போகிறவன் யார்?” என்று கேட்டவர்.
  to: பேதுரு திரும்பி, இயேசு அன்புகூர்ந்த சீடர் பின்தொடர்ந்து வந்துகொண்டிருந்ததைக் கண்டார்[a]. அந்தச் சீடரே இரவு உணவின்போது இயேசுவின் மார்பில் சாய்ந்திருந்தவரும், “ஆண்டவரே, உம்மைக் காட்டிக்கொடுப்பவன் யார்?” என்று கேட்டவரும் ஆவார்.
  rationale: The revision retains the source’s ambiguity concerning the unstated object of ‘following.’ It strengthens the physical sense of reclining ‘on/against’ Jesus’ chest, distinguishes the two remembered past actions, and renders the present participle παραδιδούς without introducing an explicit future tense.
