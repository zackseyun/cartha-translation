  alternative: “காண்கிறார்”
  rationale: இது கொள்கைத் தீர்மானமல்ல; தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதுடன் மூல நிகழ்வின் பொருள் மாறுவதில்லை.
- issue: ἀκολουθοῦντα என்பதன் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: செயப்படுபொருளைச் சேர்க்காமல் “பின்னால் வருவதை”
  alternative: “அவர்களைப் பின்தொடர்ந்து வருவதை” அல்லது “அவரைப் பின்தொடர்ந்து வருவதை”
  rationale: கிரேக்கம் யாரைப் பின்தொடர்ந்தார் என்பதை வெளிப்படையாகக் கூறாததால், இயேசுவையா இயேசுவும் பேதுருவுமா என்ற சிறிய தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: ὁ παραδιδούς என்பதன் காலநிலை
  choice: “காட்டிக்கொடுக்கப்போகிறவன்”
  alternative: “காட்டிக்கொடுக்கிறவன்”
  rationale: முந்தைய இரவு உணவின்போது கேட்கப்பட்ட கேள்வியாக இது நினைவுகூரப்படுவதால், தமிழில் எதிர்நோக்கிய செயலைத் தெளிவாகச் சொல்கிறது; துரோகத்தின் கருத்து காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் மரியாதையான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. “சீடர்,” “ஆண்டவரே,” “உம்மை” ஆகியவை கண்ணியத்தைக் காக்கின்றன; தேவையற்ற பழமையான வடிவங்களும் சமயப்பிரிவு சார்ந்த சொற்களும் தவிர்க்கப்பட்டுள்ளன.
