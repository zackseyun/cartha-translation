  - severity: low
    issue: Footnote b uses an awkward alternative expression.
    rationale: For ἐξετάσαι, ‘ஆராய்ந்து விசாரிக்க’ naturally communicates the possible nuance of questioning or examining closely; ‘துருவிக் கேட்க’ is less idiomatic in this context.
