source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: ta
  text: இயேசு அவர்களிடம், “வாருங்கள், காலை உணவருந்துங்கள்[a]” என்றார். ஆனால் சீடர்களில் ஒருவரும் அவரிடம், “நீர் யார்?” என்று கேட்கத்[b] துணியவில்லை; அவர் ஆண்டவர் என்று அவர்கள் அறிந்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கிரேக்க வினை குறிப்பாகக் காலையில் உண்ணும் உணவைக் குறிக்கிறது; “காலை உணவு உண்ணுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கேட்க” என்று மொழிபெயர்க்கப்பட்டுள்ள வினை, “விசாரிக்க” அல்லது “ஆராய்ந்து விசாரிக்க” என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: வாருங்கள்
  rationale: அழைப்பு அல்லது வருமாறு கூறும் கட்டளைப் பொருளை இயல்பான, மரியாதையான பன்மை வடிவில் தருகிறது.
- source_word: ἀριστήσατε
  choice: காலை உணவு உண்ணுங்கள்
  rationale: பொதுவாக உண்பதை மட்டும் அல்லாமல், காலையில் உண்ணும் உணவைச் சுட்டும் வினையின் தனிப்பொருளைப் பாதுகாக்கிறது.
- source_word: οὐδεὶς δὲ
  choice: ஆனால் ... ஒருவரும்
  rationale: δέ குறிக்கும் மென்மையான மாறுபாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐτόλμα
  choice: துணியவில்லை
  rationale: அந்தக் கேள்வியைக் கேட்க மனத்துணிவு கொள்ளாத நிலையைத் தெளிவாகத் தருகிறது.
- source_word: ἐξετάσαι
  choice: கேட்க
  rationale: நேரடிக் கேள்வி தொடரும் இச்சூழலில் இயல்பான தமிழ்; விசாரித்தல் அல்லது துருவிக் கேட்டல் என்ற வலுவான நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Σὺ τίς εἶ;
  choice: நீர் யார்?
  rationale: Σὺ தரும் நேரடியான வலியுறுத்தலை மரியாதையான ஒருமைச் சுட்டுப்பெயருடன் இயல்பாகப் பாதுகாக்கிறது.
- source_word: εἰδότες ὅτι
  choice: என்று அவர்கள் அறிந்திருந்தார்கள்
  rationale: கிரேக்க இறந்தகாலப் பெயரெச்சத்தின் சூழ்நிலைத் தொடர்பை வெளிப்படுத்துகிறது; காரணப் பொருளை ‘ஏனெனில்’ என்று கட்டாயமாக்காமல் விடுகிறது.
- source_word: ὁ κύριός
  choice: ஆண்டவர்
  rationale: உயிர்த்தெழுந்த இயேசுவைக் குறிக்கும் κύριος என்பதன் கிறிஸ்துவியல் நிறையையும் தமிழ் வேதாகம நடையின் இயல்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமானர்
  rationale: உயிர்த்தெழுதல் தோற்றத்தின் இச்சூழலில் ‘ஆண்டவர்’ என்பது அடையாளப்படுத்தும் கிறிஸ்துவியல் நிறையைப் பாதுகாக்கிறது; ‘எஜமானர்’ என்பது பொருளை மனித உறவுக்குள் சுருக்கக்கூடும்.
- issue: εἰδότες என்ற பெயரெச்சத்தின் தொடர்பு
  choice: அவர் ஆண்டவர் என்று அவர்கள் அறிந்திருந்தார்கள்
  alternative: அவர் ஆண்டவர் என்று அறிந்திருந்ததால்
  rationale: பெயரெச்சம் காரணத்தைக் குறிப்பதாகப் புரிந்துகொள்ள இயன்றாலும், மூலத்தில் வெளிப்படையான காரண இணைப்புச் சொல் இல்லை; எனவே அந்தத் தொடர்பைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ‘நீர்’ மரியாதையான ஒருமையைத் தருகிறது. εἰδότες என்பதற்கு வெளிப்படையான காரண இணைப்பைச் சேர்க்காமல் மூலத்தின் இலக்கணத் திறந்தநிலையைப் பாதுகாத்துள்ளது.
