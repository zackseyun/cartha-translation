  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: ta
  text: அவர் மூன்றாவது முறையாக[a] அவனிடம், “யோவானின் மகனான சீமோனே, நீ என்னை நேசிக்கிறாயா?” என்று கேட்டார். “நீ என்னை நேசிக்கிறாயா?” என்று அவர் மூன்றாவது முறையாகத் தன்னிடம் கேட்டதால் பேதுரு துயரமடைந்தான். அவன் அவரிடம், “ஆண்டவரே, நீர் எல்லாவற்றையும் அறிவீர்; நான் உம்மை நேசிக்கிறேன் என்பதை நீர் அறிந்திருக்கிறீர்[b]” என்றான். இயேசு அவனிடம், “என் ஆடுகளை மேய்த்து உணவளி” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே இயேசு φιλέω என்ற கிரேக்க வினைச்சொல்லைப் பயன்படுத்துகிறார்; முந்தைய இரண்டு கேள்விகளில் அவர் ἀγαπάω என்பதைப் பயன்படுத்தினார். சிலர் இவற்றுக்கிடையே பொருளுள்ள வேறுபாட்டைக் காண்கிறார்கள்; மற்றவர்கள் இச்சூழலில் இரண்டும் ஒரே பொருள் வட்டத்துக்குள் வருவதாகக் கருதுகிறார்கள். மொழிபெயர்ப்பு இரண்டையும் ‘நேசி’ என்றே வழங்கி, கிரேக்கம் தெளிவாகக் கோராத கூர்மையான வேறுபாட்டைத் திணிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: பேதுருவின் பதிலில் ‘அறிதல்’ என்பதற்கு οἶδα, γινώσκω என்ற இரண்டு கிரேக்க வினைச்சொற்கள் வருகின்றன. தமிழில் அவை ‘அறிவீர்’, ‘அறிந்திருக்கிறீர்’ என்று இயல்பாக வழங்கப்பட்டுள்ளன. சொல்மாற்றத்தில் நுணுக்கம் இருக்கலாம்; ஆனால் அதைக் குறிப்பிட்ட கருத்தியல் வேறுபாடாகத் தீர்மானிக்க முடியாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: மூன்றாவது முறையாக
  rationale: இந்தச் சொற்றொடர் கேள்வி மூன்றாம் முறை கேட்கப்பட்டதைக் குறிக்கிறது; தமிழில் இயல்பான காலவினையடை வடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: Σίμων Ἰωάννου
  choice: யோவானின் மகனான சீமோனே
  rationale: Ἰωάννου என்ற உரிமை வேற்றுமை இங்கு தந்தைவழி அடையாளமாக இருப்பதால் ‘யோவானின் மகன்’ என்று மொழிபெயர்க்கப்பட்டது; இந்தக் கிரேக்க வாசகத்தில் இல்லாத ‘யோனாவின் மகன்’ என்ற பாரம்பரிய வடிவம் புகுத்தப்படவில்லை.
- source_word: φιλεῖς / φιλῶ
  choice: நேசிக்கிறாயா / நேசிக்கிறேன்
  rationale: φιλέω அன்பையும் பாசத்தையும் குறிக்கிறது. இங்கு ‘நேசி’ உறவின் ஆழத்தையும் உரையாடலின் கண்ணியத்தையும் இயல்பாக வெளிப்படுத்துகிறது; ἀγαπάω உடனான சாத்தியமான வேறுபாடு அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: ἐλυπήθη
  choice: துயரமடைந்தான்
  rationale: பேதுருவுக்கு ஏற்பட்ட ஆழ்ந்த வருத்தத்தையும் மனவேதனையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: உயிர்த்தெழுந்த இயேசுவை பேதுரு அழைக்கும் இச்சூழலில் வெறும் மரியாதை அழைப்பை விட ‘ஆண்டவர்’ பொருத்தமானது.
- source_word: πάντα σὺ οἶδας
  choice: உமக்கு எல்லாம் தெரியும்
  rationale: πάντα என்பதன் விரிவைச் சுருக்காமல், இயல்பான தமிழில் பேதுருவின் வலுவான கூற்றைப் பாதுகாக்கிறது.
- source_word: οἶδας ... γινώσκεις
  choice: தெரியும் ... அறிந்திருக்கிறீர்
  rationale: இரண்டு கிரேக்க வினைச்சொற்களும் அறிதலைக் குறித்தாலும், தமிழில் இயல்பாகக் கிடைக்கும் ‘தெரியும்’ மற்றும் ‘அறிந்திருக்கிறீர்’ என்ற சொற்கள் மீளுரையையும் மென்மையான சொல்வேறுபாட்டையும் பாதுகாக்கின்றன; அவற்றுக்கிடையே கடுமையான கருத்தியல் வேறுபாடு திணிக்கப்படவில்லை.
- source_word: Βόσκε
  choice: உணவளி
  rationale: βόσκω குறிப்பாக உணவூட்டுதல் அல்லது மேய்ச்சல் அளித்தலைக் குறிக்கிறது; ποιμαίνω என்பதற்குரிய விரிவான ‘மேய்த்து பராமரி’ என்ற கருத்தை இங்கு புகுத்தாமல் குறிப்பான கட்டளையைப் பாதுகாக்கிறது.
- source_word: πρόβατά
  choice: ஆடுகள்
  rationale: πρόβατα என்பது செம்மறியாடுகளைக் குறிக்கிறது; 15ஆம் வசனத்திலுள்ள ἀρνία என்பதுபோல் குறிப்பாக ஆட்டுக்குட்டிகளைக் குறிக்காது. தமிழில் பொதுவாகவும் இயல்பாகவும் ‘ஆடுகள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இயேசுவும் பேதுருவும் பயன்படுத்தும் φιλέω மற்றும் ἀγαπάω ஆகிய வினைச்சொற்களுக்கிடையே கூர்மையான வேறுபாட்டை மொழிபெயர்ப்பில் காட்ட வேண்டுமா?
  choice: இவ்வசனத்திலுள்ள φιλέω என்பதையும் ‘நேசி’ என்றே மொழிபெயர்த்து, வேறுவகையான அன்பை முதன்மை உரையில் திணிக்காமல் இருப்பது
  alternative: ‘அன்பு செலுத்து’ மற்றும் ‘பாசம் வை’ போன்ற வேறுபட்ட தமிழ் வினைச்சொற்களைப் பயன்படுத்தி சொல்மாற்றத்தை கருத்தியல் வேறுபாடாகக் காட்டுவது
  rationale: கொய்னே கிரேக்கப் பயன்பாட்டில் இவ்விரு வினைச்சொற்களும் பல சூழல்களில் பொருள் மேல்விரிப்பைக் கொண்டுள்ளன. எனவே விவாதத்திற்குரிய இறையியல் வேறுபாட்டை மொழிபெயர்ப்பே முடிவு செய்யாமல், சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: ‘உமக்கு எல்லாம் தெரியும்’ என்ற பேதுருவின் அறிக்கையின் வலிமை
  choice: இயேசுவின் விரிவான அறிவைப் பற்றிய வலுவான கூற்றாக உள்ளபடியே மொழிபெயர்ப்பது
  alternative: ‘இதைப் பற்றிய அனைத்தும் உமக்குத் தெரியும்’ என்று சூழலுக்குள் சுருக்குவது அல்லது வெளிப்படையான இறையியல் விளக்கத்தைச் சேர்ப்பது
  rationale: கிரேக்கத்தில் πάντα என்ற சொல் நேரடியாக ‘எல்லாம்’ என்கிறது. அதன் வலிமையைச் சுருக்காமலும் அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் வசனத்தின் சொந்த பதற்றம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. இயேசுவிடம் பேதுரு பேசும் இடத்தில் மரியாதைப் பன்மை (‘உமக்கு’, ‘நீர்’, ‘அறிந்திருக்கிறீர்’) பயன்படுத்தப்பட்டது; கதைசொல்லி பேதுருவைக் குறிப்பிடும் இடத்தில் இயல்பான ஒருமை நடை வைக்கப்பட்டது. நேரடியான உரையாடலின் உணர்ச்சித் தீவிரமும் மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
