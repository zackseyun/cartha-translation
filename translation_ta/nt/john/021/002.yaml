  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: ta
  text: சீமோன் பேதுரு, இரட்டையர் என்று அழைக்கப்பட்ட தோமா, கலிலேயாவிலுள்ள கானாவைச் சேர்ந்த நத்தான்வேல், செபெதேயுவின் மகன்கள், இயேசுவின் சீடர்களில் வேறு இருவர் ஆகியோர் ஒன்றாக இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: ஒன்றாக இருந்தார்கள்
  rationale: ἦσαν என்பது கடந்தகால நிலையைச் சுட்டுகிறது; ὁμοῦ என்பது ஒரே இடத்தில் ஒன்றாக இருந்ததைக் குறிக்கிறது. இரண்டையும் இணைத்து இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: Σίμων Πέτρος
  choice: சீமோன் பேதுரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: திதிமு என்று அழைக்கப்பட்ட தோமா[a]
  rationale: λεγόμενος என்பதன் ‘என்று அழைக்கப்பட்ட’ என்ற பொருளையும், Δίδυμος என்ற கிரேக்கப் பெயர் வடிவத்தையும் நேரடியாகப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள கானாவைச் சேர்ந்த நாத்தான்வேல்
  rationale: ἀπό குறிக்கும் பிறப்பிடம் அல்லது ஊர்ச் சார்பை ‘சேர்ந்த’ என்று இயல்பாக வெளிப்படுத்தி, கானா கலிலேயாவில் இருப்பதையும் தெளிவாக்குகிறது.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: செபெதேயுவின் மகன்கள்
  rationale: கிரேக்க மொழியின் சுருக்கமான உடைமைத் தொடரில் சூழலால் உறுதியாக உணர்த்தப்படும் ‘மகன்கள்’ என்பதைத் தமிழில் வெளிப்படையாக வழங்குகிறது.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: அவருடைய சீடர்களில் வேறு இருவர்
  rationale: ἐκ என்பதன் பகுதிப்பொருளையும், பெயர் குறிப்பிடப்படாத மற்ற இரண்டு சீடர்களையும் துல்லியமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: καί … καί
  choice: காற்புள்ளிகளால் இணைக்கப்பட்ட பட்டியல்; இறுதியில் ‘ஆகியோர்’
  rationale: மீண்டும் மீண்டும் வரும் καί அனைத்துப் பெயர்களையும் ஒரே பட்டியலாக இணைக்கிறது; தமிழில் தேவையற்ற ‘மற்றும்’ மறுமொழியைத் தவிர்த்து ‘ஆகியோர்’ மூலம் இயல்பாகத் தொகுக்கப்படுகிறது.
