id: JHN.21.24
reference: John 21:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: ta
  text: இவற்றைக் குறித்து சாட்சி அளிக்கிறவரும் இவற்றை எழுதியவரும் இந்தச் சீடரே[a]. அவருடைய சாட்சி உண்மையானது என்று நாம் அறிந்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவற்றைக் குறித்து சாட்சி பகர்கிறவரும் … அவருடைய சாட்சியம் உண்மையானது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இவ்வசனம் முழுவதும் ஒரே சொல்வேரைக் கொண்ட ‘சாட்சி அளித்தல்/சாட்சி’ என்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: இந்தச் சீடரே
  rationale: முன்னர் குறிப்பிடப்பட்ட சீடரைச் சுட்டி அடையாளப்படுத்தும் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαθητὴς
  choice: சீடர்
  rationale: இயேசுவைப் பின்பற்றுகிறவரைக் குறிக்கும் யோவான் நூலின் வழக்கமான சொல்லுக்கு ஏற்ற, தெளிவான தமிழ்.
- source_word: μαρτυρῶν
  choice: சாட்சி அளிக்கிறவர்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது இயல்புக்கூறான செயலைக் காட்டுகிறது; μαρτυρία என்பதுடனான ஒரே சொல்வேர்த் தொடர்பையும் தமிழில் காக்கிறது.
- source_word: περὶ τούτων
  choice: இவற்றைக் குறித்து
  rationale: நற்செய்தியில் சொல்லப்பட்டவற்றோடு உள்ள சுட்டுத் தொடர்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὁ γράψας ταῦτα
  choice: இவற்றை எழுதியவர்
  rationale: எழுதும் செயல் நிறைவுற்றதை உணர்த்தும் இறந்தகாலப் பங்கேற்புவினையின் பொருளை இயல்பான தமிழ் உறவுத்தொடராக வழங்குகிறது.
- source_word: οἴδαμεν
  choice: நாம் அறிந்திருக்கிறோம்
  rationale: கிரேக்க நிறைவுக்கால வடிவத்தின் நிகழ்கால அறிவுநிலையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; பன்மை முதலாம் நபரை மாற்றாமல் காக்கிறது.
- source_word: ἀληθὴς
  choice: உண்மையானது
  rationale: சாட்சியின் உண்மைத்தன்மையைக் குறிக்கும் நேரடியான பொருளை வழங்குகிறது; ‘நம்பத்தக்கது’ என்று மட்டும் சுருக்கவில்லை.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: அவருடைய சாட்சி
  rationale: உடைமைத் தொடர்பை இயல்பான தமிழில் தருவதோடு, μαρτυρῶν என்பதுடனான சாட்சி என்ற ஒரே சொல்வேர்த் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘நாம் அறிந்திருக்கிறோம்’ என்பதில் பேசுகிறவர்களின் அடையாளம்
  choice: பேசுகிறவர்கள் யார் என்று குறிப்பிடாமல் முதலாம் நபர் பன்மையை அப்படியே மொழிபெயர்த்தல்
  alternative: நற்செய்தியாளர் தம்மைப் பன்மையில் குறிப்பிடுகிறார் அல்லது ஒரு சாட்சிக் குழு அன்புச் சீடரின் சாட்சியை உறுதிப்படுத்துகிறது என்று விளக்குதல்
  rationale: οἴδαμεν என்பது ‘நாம் அறிந்திருக்கிறோம்’ என்று தெளிவாகக் கூறினாலும், அந்த ‘நாம்’ யார் என்பதை உரை நிர்ணயிக்கவில்லை. ஆசிரியத்துவம் அல்லது சமூகச் சாட்சி குறித்த தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சாட்சி அளிக்கிறவர்/சாட்சி’ என ஒரே சொல்வேர்த் தொடர்பு முதன்மை உரையில் காக்கப்பட்டுள்ளது. ‘இந்தச் சீடரே’ என்ற வலியுறுத்தல் அடையாளப்படுத்தும் கிரேக்க அமைப்பை இயல்பாகத் தருகிறது.
