translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சீமோன் பேதுருவுக்கு சீடர்கள் அளிக்கும் மரியாதையை வெளிப்படுத்த ‘உம்முடன்’ பயன்படுத்தப்பட்டுள்ளது; அளவுக்கு மீறிய செம்மொழிநடை தவிர்க்கப்பட்டுள்ளது.
