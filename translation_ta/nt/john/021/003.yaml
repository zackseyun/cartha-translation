source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: ta
  text: சீமோன் பேதுரு அவர்களிடம், “நான் மீன்பிடிக்கப் போகிறேன்” என்றார்.[a] அவர்கள் அவரிடம், “நாங்களும் உன்னுடன் வருகிறோம்” என்றார்கள். அவர்கள் புறப்பட்டு, படகில் ஏறினார்கள். அந்த இரவில் அவர்கள் ஒன்றும் பிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்க மூலத்தில் வரலாற்று நிகழ்காலம் உள்ளது: ‘சீமோன் பேதுரு அவர்களிடம் சொல்கிறார் … அவர்கள் அவரிடம் சொல்கிறார்கள்.’ இது கிரேக்கக் கதைநடையில் பொதுவான ஓர் அம்சம்; தமிழில் இங்கு இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: என்றார் ... என்றார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது; இதை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: Ὑπάγω ἁλιεύειν
  choice: நான் மீன்பிடிக்கப் போகிறேன்
  rationale: செல்லும் நோக்கத்தையும் மீன்பிடிக்கும் செயலையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: நாங்களும் உம்முடன் வருகிறோம்
  rationale: καὶ ἡμεῖς என்பதன் வலியுறுத்தலான ‘நாங்களும்’ என்பதையும் σύν குறிக்கும் உடனிருப்பையும் பாதுகாக்கிறது.
- source_word: ἐξῆλθον
  choice: புறப்பட்டு
  rationale: சூழலில் அவர்கள் இருந்த இடத்தைவிட்டு வெளியே செல்வதை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: படகில் ஏறினார்கள்
  rationale: மீன்பிடிச் சூழலில் படகுக்குள் சென்று பயணம் தொடங்குவதற்கான இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: πλοῖον
  choice: படகு
  rationale: கலிலேயக் கடலின் மீன்பிடிச் சூழலுக்கு ‘கப்பல்’ என்பதைவிட ‘படகு’ பொருத்தமானது.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: அந்த இரவில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்கத் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐπίασαν οὐδέν
  choice: ஒன்றும் பிடிக்கவில்லை
  rationale: மீன்பிடிச் சூழலில் πιάζω என்பதற்கு ‘பிடி’ பொருத்தமானது; οὐδέν முழுமையான தோல்வியைத் தெரிவிக்கிறது.
