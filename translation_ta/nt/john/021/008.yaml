  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால அளவீடு மூலப்பண்பாட்டைத் தக்கவைக்க முதன்மை உரையில் வைக்கப்பட்டு, இன்றைய அளவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
