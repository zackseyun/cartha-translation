  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: ta
  text: மற்ற சீடர்களோ சிறுபடகில் வந்தார்கள்; அவர்கள் கரையிலிருந்து வெகுதொலைவில் இல்லை; ஏறக்குறைய இருநூறு முழம்[a] தொலைவிலேயே இருந்தார்கள். மீன்கள் இருந்த வலையை இழுத்துக்கொண்டே வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இருநூறு முழம் என்பது ஏறக்குறைய 90 மீட்டர்.
    reason: cultural_note
  - marker: b
    text: சொல்லுக்குச் சொல்லாக, ‘மீன்களின் வலை’ என்று மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் மீன்கள் உள்ள அல்லது மீன்களைக் கொண்ட வலையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: மற்ற சீடர்களோ
  rationale: δέ, முந்தைய வசனத்தில் பேதுரு தனியாகச் செய்த செயலுடன் மற்ற சீடர்களின் செயலை மென்மையாக வேறுபடுத்துகிறது; தமிழில் ‘-ஓ’ அந்த மாறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: τῷ πλοιαρίῳ
  choice: சிறுபடகில்
  rationale: πλοιάριον என்பதிலுள்ள சிறிய படகு என்ற நுணுக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: ἦλθον
  choice: வந்தார்கள்
  rationale: ἔρχομαι என்பதன் இறந்தகாலக் கதைநடைப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: அவர்கள் கரையிலிருந்து வெகுதொலைவில் இல்லாமல்
  rationale: γάρ தரும் விளக்க உறவைத் தமிழில் இயல்பான காரணச்சூழலாக வெளிப்படுத்துகிறது. நீருக்கு எதிரான γῆ இச்சூழலில் ‘கரை’ எனத் தெளிவாகப் பொருள்படுகிறது.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: ஏறக்குறைய இருநூறு முழம் தொலைவிலேயே
  rationale: ὡς என்பதன் தோராயத்தையும் ἀλλά தரும் ‘அவ்வளவு தூரமல்ல, இவ்வளவே’ என்ற கட்டுப்படுத்தும் எதிர்மறை வலியுறுத்தலையும் பாதுகாக்கிறது; பழங்கால அளவான πῆχυς ‘முழம்’ என வைக்கப்படுகிறது.
- source_word: σύροντες
  choice: இழுத்துக்கொண்டு வந்தார்கள்
  rationale: அவர்கள் வந்துகொண்டிருந்தபோதே வலையை இழுத்தார்கள் என்ற ஒரேநேர உடன்நிகழ்வை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: மீன்கள் இருந்த வலையை
  rationale: மீன்களை உள்ளடக்கமாகக் கொண்ட வலை என்ற சூழல்பொருளைத் தருகிறது; கிரேக்கம் வெளிப்படையாக ‘நிறைந்த’ என்று சொல்லாததால் அந்த மேலதிக வலியுறுத்தலைத் தவிர்க்கிறது.
