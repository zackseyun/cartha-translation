  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, இயேசு திபேரியாக் கடலருகே சீடர்களுக்குத் தம்மை மீண்டும் வெளிப்படுத்தினார்.[a] அவர் தம்மை வெளிப்படுத்தியது இவ்வாறுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோன்றினார்”; கிரேக்க வினைச்சொல் ஒருவர் தம்மைக் காணக்கூடியவராக அல்லது அறியக்கூடியவராகச் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரையும் யோவானின் கதைத் தொடரமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: தம்மை வெளிப்படுத்தினார்
  rationale: φανερόω என்பதிலுள்ள காணக்கூடியவராகச் செய்தல் அல்லது தம்மை அறியச் செய்தல் என்ற பொருள் பரப்பையும், ἑαυτόν என்பதன் தற்சுட்டுப் பொருளையும் காக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய உயிர்த்தெழுதல் தோற்றங்களுக்குப் பின் நிகழும் இன்னொரு வெளிப்பாட்டைக் குறிக்கும் வழக்கமான வினையடைப் பொருள்.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களுக்கு
  rationale: கிரேக்கத்தில் உடைமைப்பொருள் வெளிப்படையாக இல்லாததால் ‘தமது சீடர்களுக்கு’ என்று சேர்க்காமல் மூலத்தை நெருக்கமாகப் பின்பற்றுகிறது.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: திபேரியாக் கடலருகே
  rationale: இக்கதைச் சூழலில் ἐπί + genitive குறிக்கும் இடத்தை இயல்பான தமிழில் ‘அருகே’ எனத் தருகிறது; யோவான் பயன்படுத்தும் இடப்பெயரும் காக்கப்படுகிறது.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: அவர் தம்மை வெளிப்படுத்தியது இவ்வாறுதான்
  rationale: முதற் கூறிலுள்ள வினையை மீண்டும் கொண்டு இலக்கியத் தொடர்பைக் காக்கிறது; οὕτως அடுத்து வரும் நிகழ்வின் முறையை அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவின் தோற்றத்தைக் குறிக்கும் மொழி
  choice: தம்மை வெளிப்படுத்தினார்
  alternative: தோன்றினார்; தம்மை அறியச் செய்தார்
  rationale: இது வெறும் காட்சித் தோற்றம் என்று சுருக்காமல், உயிர்த்தெழுந்த இயேசு தம்மைக் காணவும் அறியவும் செய்த சுயவெளிப்பாட்டை உணர்த்துகிறது; அதேவேளையில் கிரேக்கச் சொல்லின் பொருள் நெகிழ்வை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தம்மை’ என்பது இயேசுவைக் குறிக்கும் மரியாதைத் தற்சுட்டு வடிவம். முதல் வாக்கியத்தின் நீளத்தைத் தமிழில் தெளிவாகப் படிக்குமாறு இரு வாக்கியங்களாக அமைத்தபோதும், மூலத்தின் வினைமீட்சி காக்கப்பட்டுள்ளது.
