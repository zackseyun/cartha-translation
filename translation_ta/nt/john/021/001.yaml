  terminology: “இயேசு,” “சீடர்கள்,” “தம்மை வெளிப்படுத்தினார்,” மற்றும் “திபேரியாக் கடல்” ஆகியவை பொருத்தமானவை. “வெளிப்படுத்தினார்” என்பது φανερόω-வின் சுயவெளிப்பாடு/தெளிவாக்குதல் என்ற பொருளைத் தக்கவைக்கிறது; அடிக்குறிப்பிலுள்ள “தோன்றினார்” மாற்றுவழி பொருத்தமானது.
