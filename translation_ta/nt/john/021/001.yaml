  source_fidelity: மூலக் கிரேக்கத்தின் காலத் தொடர்ச்சி (Μετὰ ταῦτα), மீள்நிகழ்வைக் குறிக்கும் πάλιν, தற்சுட்டுச் சுயவெளிப்பாடு (ἐφανέρωσεν ἑαυτόν), சீடர்களுக்கான தத்திவ உறவு, திபேரியாக் கடல் எனும் இடக்குறிப்பு, மற்றும் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் οὕτως ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. இரண்டாம் வாக்கியத்தில் வினை மீளுரையும் முறையாகப் பிரதிபலிக்கிறது.
