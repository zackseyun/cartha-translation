base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: ta
  text: ஆகவே இயேசு அவர்களிடம், “பிள்ளைகளே[a], உண்பதற்கு மீன் ஒன்றும் உங்களிடம் இல்லையே?” என்று கேட்டார். அவர்கள் அவருக்குப் பதிலளித்து, “இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உண்பதற்கு ஏதாவது.’ கிரேக்கச் சொல் προσφάγιον அப்பத்துடன் உண்ணும் துணை உணவைக் குறிப்பதாகும்; இந்த மீன்பிடிப்புச் சூழலில் அது மீனைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் தொடர்புடைய கதை நகர்வை இயல்பாகக் காட்டுகிறது; இங்கு கடுமையான தர்க்க முடிவைக் குறிக்கவில்லை.
- source_word: Παιδία
  choice: பிள்ளைகளே
  rationale: அன்பும் நெருக்கமும் கலந்த அழைப்பை நேரடியாகப் பாதுகாக்கிறது; வயதைத் துல்லியமாக நிர்ணயிப்பதில்லை.
- source_word: μή τι
  choice: ஒன்றும் இல்லையே?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσφάγιον
  choice: சாப்பிட மீன்
  rationale: இச்சொல் அப்பத்துடன் உண்ணும் துணை உணவைக் குறிக்கும்; மீன்பிடிப்புச் சூழலில் மீனைக் குறிப்பது மிகச் சாத்தியம். ‘சாப்பிட’ என்பது உணவாகப் பயன்படுத்தும் பொருளைத் தெளிவாக்குகிறது.
- source_word: ἔχετε
  choice: உங்களிடம் ... இல்லை
  rationale: உடைமை அல்லது கைவசம் இருப்பதைக் குறிக்கும் எளிய நிகழ்காலப் பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: அவர்கள் அவருக்கு ... பதிலளித்தார்கள்
  rationale: மூலத்தின் வழக்கமான கதைசார் பதில் அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Οὔ
  choice: இல்லை
  rationale: கிரேக்கத்தின் சுருக்கமான மறுப்புக்குச் சமமான இயல்பான தமிழ் பதில்.
