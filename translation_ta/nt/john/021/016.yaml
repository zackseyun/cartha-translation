  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: ta
  text: அவர் மீண்டும், இரண்டாம் முறையாக, அவனிடம், “யோவானின் மகனான சீமோனே, நீ என்னை நேசிக்கிறாயா?” என்று கேட்டார். அவன் அவரிடம், “ஆம், ஆண்டவரே; நான் உம்மை நேசிக்கிறேன் என்பது உமக்குத் தெரியும்” என்றான். அவர் அவனிடம், “என் ஆடுகளை மேய்ப்பாயாக” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இந்த உரையாடலில் ‘நேசித்தல்’ என்பதற்கு கிரேக்கத்தில் இரு வேறு வினைகள் வருகின்றன: இயேசு ἀγαπάω என்ற வினையைப் பயன்படுத்துகிறார்; பேதுரு φιλέω என்ற வினையைப் பயன்படுத்துகிறார். சிலர் இவற்றுக்கிடையே பொருள் வேறுபாட்டைக் காண்கிறார்கள்; மற்றவர்கள் இதை நடையியல் மாற்றமாகக் கருதுகிறார்கள். வேறுபாட்டை மிகைப்படுத்தாமல் இருக்க முதன்மை உரையில் இரண்டும் ‘நேசி’ என்றே மொழிபெயர்க்கப்பட்டுள்ளன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: மீண்டும் இரண்டாவது முறையாக
  rationale: πάλιν, δεύτερον ஆகிய இரு கூறுகளையும் காத்து, கிரேக்கத்தின் மறுபடியும் நிகழ்வதற்கான வலியுறுத்தலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Σίμων Ἰωάννου
  choice: யோவானின் மகனான சீமோனே
  rationale: Ἰωάννου என்ற உறவுமுறை வேற்றுமையைத் தந்தை–மகன் அடையாளமாக இயல்பாகத் தருகிறது; இவ்வாசகத்தில் இல்லாத ‘யோனா’ என்பதை இறக்குமதி செய்யவில்லை.
- source_word: ἀγαπᾷς / φιλῶ
  choice: நேசிக்கிறாயா / நேசிக்கிறேன்
  rationale: இரு கிரேக்க வினைகளுக்கும் இச்சூழலில் பொருள் மேற்படிவு உண்டு. முதன்மை உரையில் செயற்கையான வேறுபாட்டைத் திணிக்காமல் ஒரே இயல்பான தமிழ் வினை பயன்படுத்தப்பட்டுள்ளது; சொல் வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: பேதுரு இயேசுவை மரியாதையுடனும் அங்கீகாரத்துடனும் அழைக்கும் யோவான் நற்செய்திச் சூழலுக்கு ஏற்ற வழக்கமான இறையியல் அழைப்பு.
- source_word: σὺ οἶδας
  choice: உமக்குத் தெரியும்
  rationale: வெளிப்படையான σὺ தரும் மிதமான வலியுறுத்தலை மரியாதை ஒருமையுடன் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: Ποίμαινε
  choice: மேய்த்து பராமரி
  rationale: ποιμαίνω என்பது உணவளிப்பதை மட்டும் அல்லாமல் மேய்ப்பனாக வழிநடத்துதல், பாதுகாத்தல், கவனித்தல் ஆகியவற்றையும் குறிக்கிறது; இந்த இரட்டை வினை மேய்ப்பர் உருவகத்தின் பரப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ πρόβατά μου
  choice: என் ஆடுகளை
  rationale: ‘மந்தை’ என்று பொதுமைப்படுத்தாமல் πρόβατα என்பதன் தெளிவான ஆடு உருவகத்தையும் இயேசுவுக்குரிய உடைமையையும் காக்கிறது.
theological_decisions:
- issue: ἀγαπάω மற்றும் φιλέω ஆகியவற்றை வேறு தமிழ் வினைகளால் வேறுபடுத்த வேண்டுமா?
  choice: முதன்மை உரையில் இரண்டையும் ‘நேசி’ என்று மொழிபெயர்த்து, சொல் மாற்றத்தை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ἀγαπάω என்பதை ‘அன்புகூரு’ என்றும் φιλέω என்பதை ‘நேசி’ என்றும் வேறுபடுத்துதல்.
  rationale: யோவானின் பயன்பாட்டில் இவ்விரு வினைகளும் கணிசமாக மேற்படிவதால், உறுதியற்ற உளவியல் அல்லது இறையியல் படிநிலையை முதன்மை உரையில் திணிப்பது பொருத்தமல்ல. அதேவேளை உண்மையான சொல் மாற்றம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. இயேசுவிடம் பேசும்போது ‘உம்’ மரியாதை ஒருமையும், கதைசொல்லலில் இயல்பான ‘அவன்/அவர்’ வேறுபாடும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘மீண்டும் இரண்டாவது முறையாக’ என்ற வலியுறுத்தல் சற்று மீளுரைப்பாக இருந்தாலும் நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
