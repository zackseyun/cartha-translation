translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் εὑρήσετε என்பதற்குச் செயப்படுபொருள் இல்லாததால், முதன்மை உரையிலும் ‘மீன்கள்’ என்பதை வெளிப்படையாகச் சேர்க்காமல் அந்த மறைபொருள் பாதுகாக்கப்பட்டுள்ளது.
