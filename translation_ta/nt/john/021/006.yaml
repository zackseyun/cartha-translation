review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the boat’s right side, the net, the inability to haul it in, and the causal abundance of fish. However, «கிடைக்கும்» is an impersonal expression (“there will be [something] available/found”) and does not retain the explicit second-person plural force of εὑρήσετε (“you will find”). The Greek leaves the object unstated; Tamil can preserve that omission while retaining the addressees as the finders.
  naturalness: The revision uses natural modern Tamil. «நீங்கள் கண்டடைவீர்கள்» is clear in the immediate fishing context, and the omitted object remains understandable without adding “fish” to the main text.
  terminology: «வலை», «படகு», «வலப்பக்கம்», and «இழுத்தெடுக்க» are suitable, clear renderings. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: «கிடைக்கும்» does not represent the grammatical subject of εὑρήσετε.
    rationale: εὑρήσετε is second-person plural active, “you will find.” The impersonal Tamil construction shifts the action away from the disciples. Replacing it with «நீங்கள் கண்டடைவீர்கள்» preserves both the verbal person and the Greek’s unstated object.
  revised_text: அவரோ அவர்களிடம், “வலையைப் படகின் வலப்பக்கத்தில் வீசுங்கள்; நீங்கள் கண்டடைவீர்கள்[a]” என்றார். ஆகவே அவர்கள் வலையை வீசினார்கள். மீன்கள் மிகுதியாக இருந்ததால், இனி அவர்களால் அதை இழுத்தெடுக்க முடியவில்லை.
