source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: ta
  text: அவரோ அவர்களிடம், “வலையைப் படகின் வலப்பக்கத்தில் வீசுங்கள்; நீங்கள் கண்டடைவீர்கள்[a]” என்றார். ஆகவே அவர்கள் வலையை வீசினார்கள். மீன்கள் மிகுதியாக இருந்ததால், இனி அவர்களால் அதை இழுத்தெடுக்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிடைக்கும்.” கிரேக்கத்தில் எதைக் கண்டடைவார்கள் என்பது வெளிப்படையாகச் சொல்லப்படவில்லை; மீன்பிடிச் சூழல் அது மீன்களைக் குறிக்கிறது என்பதை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: வீசுங்கள்
  rationale: மீன்பிடி வலையை எறியும் செயலைத் தமிழில் இயல்பாகக் குறிக்கும் கட்டளை வடிவம்.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: படகின் வலப்பக்கத்தில்
  rationale: μέρη என்பதன் சொற்பொருள் ‘பகுதிகள்’ என்றாலும், இச்சூழலில் படகின் வலதுபுறத்தைக் குறிக்கிறது; கடல்சார் தொழில்நுட்பச் சொல்லைத் தவிர்த்து தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ δίκτυον
  choice: வலையை
  rationale: மீன்பிடி வலையைக் குறிக்கும் ஒருமைச் சொல்லின் நேரான தமிழ் இணை.
- source_word: εὑρήσετε
  choice: கிடைக்கும்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. மீன்பிடிச் சூழலில் மீன் கிடைக்கும் என்பது புரிவதால், தமிழிலும் செயப்படுபொருளைச் சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: οὐκέτι
  choice: இனி ... முடியவில்லை
  rationale: வலையை வீசிய பின்பு நிலை மாறி, அதன்பின் அதை இழுக்க இயலாததைக் காட்டும் காலநிலை மறுப்பு.
- source_word: ἑλκύσαι
  choice: இழுத்தெடுக்க
  rationale: மீன்கள் நிறைந்த வலையைத் தங்களிடம் இழுக்கும் உடல் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἴσχυον
  choice: அவர்களால் ... முடியவில்லை
  rationale: இங்கு வலிமை அல்லது திறன் போதாமையைத் தெரிவிக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: மீன்கள் மிகுதியாக இருந்ததால்
  rationale: ἀπό இங்குக் காரணத்தையும் πλῆθος பெரும் எண்ணிக்கையையும் குறிக்கின்றன; தெளிவான நவீன தமிழில் இரண்டையும் வெளிப்படுத்துகிறது.
