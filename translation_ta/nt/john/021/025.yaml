  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: ta
  text: இயேசு செய்த வேறு பல செயல்களும் இருக்கின்றன. அவை ஒவ்வொன்றாக எழுதப்பட்டால், எழுதப்படும் புத்தகங்களுக்கு உலகமேகூட இடம் போதாது என்று நான் நினைக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எழுதப்படவிருக்கும் புத்தகங்களை உலகமேகூடக் கொள்ளாது.” கிரேக்க வினைச்சொல் “இடம் போதுதல்” அல்லது “கொள்ளுதல்” என்று பொருள்படலாம்; பங்கேற்புச் சொல்லை இங்கு எதிர்கால விளைவைக் காட்டும் விதமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: வேறு பல செயல்களும் இருக்கின்றன
  rationale: δὲ இங்கு மென்மையான தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனியாக ஒரு காலச்சொல்லைச் சேர்க்காமல், ‘-உம்’ வழியாக அந்தத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது. ἄλλα πολλὰ என்பது முன்பு பதிவு செய்யப்பட்டவற்றுக்கு அப்பாற்பட்ட பல செயல்களைக் குறிக்கிறது.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: இயேசு செய்த
  rationale: ποιέω இச்சூழலில் இயேசுவின் செயல்களைப் பொதுவாகக் குறிக்கிறது; ‘செய்த’ என்பது அகன்ற பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: அவை ஒவ்வொன்றாக எழுதப்பட்டால்
  rationale: ἐάν உடனான நிகழ்காலச் செயப்பாட்டு வினை, கற்பனை நிபந்தனையைத் தருகிறது; καθ’ ἕν என்பதன் பகிர்வுப் பொருள் ‘ஒவ்வொன்றாக’ எனத் தெளிவாக வருகிறது.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: உலகமேகூட
  rationale: αὐτόν தரும் வலியுறுத்தலை ‘-மே’ காக்கிறது; οὐδέ என்பதின் ‘கூட’ என்ற வலியுறுத்தலும் சேர்க்கப்பட்டுள்ளது.
- source_word: οἶμαι
  choice: நான் நினைக்கிறேன்
  rationale: ஆசிரியரின் தனிப்பட்ட, சொல்லாட்சிசார் இடைக்குறிப்பை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: χωρήσειν
  choice: இடம் போதாது
  rationale: χωρέω என்பதிலுள்ள இடவசதி என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கொள்ளாது’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ γραφόμενα βιβλία
  choice: எழுதப்படும் புத்தகங்கள்
  rationale: செயப்பாட்டு நிகழ்காலப் பங்கேற்புச் சொல்லை, கற்பனை நிபந்தனையால் விளையவிருக்கும் புத்தகங்களாகத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: உலகின் கொள்ளளவைப் பற்றிய சொல்லாட்சிசார் மிகைப்படுத்தல்
  choice: ‘எழுதப்படும் புத்தகங்களுக்கு உலகமேகூட இடம் போதாது’ என்ற உருவகத்தை அப்படியே காத்தல்
  alternative: ‘எண்ணற்ற புத்தகங்கள் தேவைப்படும்’ என்று பொதுப்பொருளாகச் சுருக்குதல்
  rationale: நற்செய்தியின் முடிவில் வரும் வலியுறுத்தலையும் மிகைப்படுத்தல் உருவகத்தையும் காக்கிறது; அதை நேரடிப் புவியியல் கூற்றாகவோ வெறும் ‘எண்ணற்றவை’ என்ற மங்கலான கருத்தாகவோ தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அதன் கருத்துத் தொடர்ச்சியும் இறுதி மிகைப்படுத்தலின் வலிமையும் காக்கப்பட்டுள்ளன.
