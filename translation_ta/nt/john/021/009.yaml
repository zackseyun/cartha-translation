source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: ta
  text: அவர்கள் கரைக்கு இறங்கியதும்[a], அங்கே கரி நெருப்பு இருந்ததையும், அதன்மேல் ஒரு மீன் இருந்ததையும்[b], அப்பம் இருந்ததையும் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் நிலத்திற்கு வந்ததும்.’ கிரேக்கத்தில் இன்னும் நேரடியாக, ‘அவர்கள் நிலத்திற்கு இறங்கியதும்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘கரி நெருப்பு’ என்பதற்கான இதே கிரேக்கச் சொல் யோவான் 18:18-லும் வருகிறது; அது பேதுருவின் முன்பிருந்த மறுதலிப்பின் காட்சியுடன் இந்த நிகழ்வைச் சொல் வழியாக இணைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: அவர்கள் ... இறங்கியபோது
  rationale: ὡς என்பதன் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; οὖν தரும் கதைத் தொடர்ச்சி தனியாக மொழிபெயர்க்கப்படாவிட்டாலும் சூழலில் வெளிப்படுகிறது.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: கரையில் இறங்கியபோது
  rationale: படகிலிருந்து நிலத்துக்கு இறங்கிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது. γῆ என்பதன் நேரடி பொருள் ‘நிலம்’; இச்சூழலில் ‘கரை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: βλέπουσιν
  choice: கண்டார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலமாக வழங்குகிறது.
- source_word: ἀνθρακιὰν κειμένην
  choice: கரித்தீ மூட்டப்பட்டிருப்பதை
  rationale: ἀνθρακιά குறிக்கும் கரியால் உண்டாக்கப்பட்ட நெருப்பையும், κειμένην குறிக்கும் அங்கே தயார் நிலையில் இருந்த நிலைமையையும் தெளிவாகச் சொல்கிறது.
- source_word: ὀψάριον ἐπικείμενον
  choice: அதன்மேல் மீன் இருப்பதை
  rationale: மீன் கரித்தீயின்மேல் இருந்த இடத்தொடர்பை வெளிப்படுத்துகிறது; மீன் சுடப்பட்டதா அல்லது சுடப்பட்டுக்கொண்டிருந்ததா என்பதை மூலத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: ἄρτον
  choice: அப்பம்
  rationale: எண்ணிக்கையையோ வடிவத்தையோ தேவையின்றி குறிப்பாக்காமல், யோவான் நூலின் உணவுச் சூழலுக்கு ஏற்ற பொதுவான தமிழ் வேதாகமச் சொல்லைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: வரலாற்று நிகழ்காலம்
  choice: βλέπουσιν என்பதை ‘கண்டார்கள்’ என்ற இறந்தகாலத்தில் மொழிபெயர்த்தல்
  alternative: ‘காண்கிறார்கள்’ என்று நிகழ்காலத்தைத் தக்கவைத்தல்
  rationale: இது கொள்கை சார்ந்த தீர்மானம் அல்ல; இயல்பான நவீன தமிழ் கதைநடைக்காக இறந்தகாலம் பயன்படுத்தப்படுகிறது.
- issue: கரித்தீ பற்றிய யோவான் நூலின் சொல் இணைப்பு
  choice: ἀνθρακιά என்பதற்கு ‘கரித்தீ’ என்று மொழிபெயர்த்து யோவான் 18:18 உடனான சொல் தொடர்பைத் தக்கவைத்தல்
  alternative: பொதுவாக ‘நெருப்பு’ என்று மொழிபெயர்த்தல்
  rationale: அரிய ஆனால் குறிப்பான மூலச்சொல்லின் பொருளையும் பேதுருவின் மறுதலிப்புக் காட்சியுடனான இலக்கிய எதிரொலியையும் பாதுகாக்கிறது; அதற்கு மேலான இறையியல் விளக்கத்தை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கரித்தீ’ என்ற குறிப்பான சொல் மூலத்தின் lexical இணைப்பைத் தக்கவைக்கிறது; ‘அப்பம்’ என்பது பரவலாக அறியப்படும் தமிழ் வேதாகமப் பயன்பாடு.
