id: JHN.21.18
reference: John 21:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: ta
  text: '“உண்மையாகவே, உண்மையாகவே உனக்குச் சொல்கிறேன்: நீ இளமையாக இருந்தபோது, நீயே உன் உடையை இடுப்பில் கட்டிக்கொண்டு, விரும்பிய இடத்துக்குச் சென்றாய். ஆனால் நீ முதுமையடையும்போது, உன் கைகளை நீட்டுவாய்; வேறொருவன் உனக்கு இடுப்புக்கச்சை கட்டுவான்; நீ விரும்பாத இடத்துக்கு உன்னைக் கொண்டுபோவான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: வலியுறுத்தும் இரட்டிப்பு மாறாமல் காக்கப்படுகிறது; ஒலிபெயர்ப்பை விட நவீனத் தமிழில் பொருள் தெளிவாகவும் உரையின் solemn தன்மை குன்றாமலும் வருகிறது.
- source_word: λέγω σοι
  choice: உனக்குச் சொல்கிறேன்
  rationale: நேரடியான தனிப்பட்ட முகவரியையும் யோவான் நற்செய்தியின் சொல்லாக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὅτε ἦς νεώτερος
  choice: நீ இளமையாக இருந்தபோது
  rationale: νεώτερος என்பதன் ஒப்பீட்டுக் கருத்து பின்னர் வரும் முதுமையோடு அமைந்த எதிர்மறை இணைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἐζώννυες σεαυτόν
  choice: நீயே உன் உடையை இடுப்பில் கட்டிக்கொண்டு
  rationale: ζώννυμι என்பதன் உடையை இடுப்பில் கட்டும் அடிப்படைப் படிமத்தையும், பேதுருவின் முந்தைய தன்னாட்சியையும் தெளிவாகக் காக்கிறது.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: விரும்பிய இடங்களுக்கெல்லாம் நடந்து சென்றாய்
  rationale: இங்கு περιπατέω அறநெறி சார்ந்த உருவகம் அல்ல; வழக்கமான இடப்பெயர்ச்சியையும் சுதந்திரத்தையும் குறிக்கிறது.
- source_word: ὅταν δὲ γηράσῃς
  choice: ஆனால் நீ முதுமையடையும்போது
  rationale: ὅταν உடன் வரும் இறந்தகால வினைமுற்றின் எதிர்கால நோக்கை இயல்பாக வெளிப்படுத்தி, δέ குறிக்கும் மிதமான முரண்பாட்டையும் காக்கிறது.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: உன் கைகளை நீட்டுவாய்
  rationale: அடுத்த வசனத்தின் விளக்கத்தை முன்கூட்டியே முதன்மை உரைக்குள் கொண்டுவராமல், கிரேக்கச் சொற்றொடரின் படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἄλλος σε ζώσει
  choice: வேறொருவன் உன் உடையை இடுப்பில் கட்டி
  rationale: முந்தைய ἐζώννυες உடனான சொல் மற்றும் படிமத் தொடர்பைத் தக்கவைத்து, தன்னாட்சியிலிருந்து பிறரைச் சார்ந்த நிலைக்கு வரும் மாற்றத்தைக் காட்டுகிறது.
- source_word: οἴσει
  choice: உன்னைக் கொண்டுபோவான்
  rationale: φέρω இங்கு ஒருவரை அவர் விரும்பாத இடத்துக்கு எடுத்துச் செல்வதைக் குறிக்கிறது; ‘கொண்டுபோவான்’ என்பது ‘சுமப்பான்’ என்பதைக் காட்டிலும் சூழலுக்கு இயல்பானதும், மூலத்தின் வலுக்கட்டாயச் சாயலைத் தீர்மானமாக மிகைப்படுத்தாததும் ஆகும்.
- source_word: ὅπου οὐ θέλεις
  choice: நீ விரும்பாத இடத்துக்கு
  rationale: இலக்கு குறித்த விருப்பமின்மையைச் சுருக்கமாகவும் இயல்பாகவும் கூறுகிறது; கிரேக்கத்தில் உள்ளார்ந்து உணர்த்தப்படும் செல்லுதலைத் தமிழில் வாக்கிய அமைப்பு தெளிவாக்குகிறது.
theological_decisions:
- issue: இந்தக் கூற்றை முதன்மை உரையிலேயே சிலுவை மரணத்தைக் குறிக்கும் வெளிப்படையான முன்னறிவிப்பாக மொழிபெயர்ப்பதா
  choice: படிம மொழியை முதன்மை உரையில் விளக்கமின்றி அப்படியே வைத்தல்
  alternative: ‘கைகளை நீட்டுவாய்’ மற்றும் ‘வேறொருவன் உன் உடையை இடுப்பில் கட்டுவான்’ என்பதைச் சிலுவையில் அறையப்படுவதை நேரடியாகச் சொல்லும் வகையில் மொழிபெயர்த்தல்
  rationale: அடுத்த வசனமே இயேசு எந்த வகையான மரணத்தைச் சுட்டினார் என்று விளக்குகிறது. ஆகவே உரையின் சொந்த முன்னேற்றத்தையும் அதன் உண்மையான மறைபொருள் அழுத்தத்தையும் காக்க, இந்த வசனத்தில் படிமம் வெளிப்படையாகத் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. “உடையை இடுப்பில் கட்டுதல்” என்ற சொற்றொடர் பழமையான “அரைக்கச்சை கட்டுதல்” போன்ற அரிதான சொல்லாக்கத்தைத் தவிர்த்து, மூலப் படிமத்தைக் காக்கிறது. ஒருமை நெருக்கமான இரண்டாம் நபரைக் குறிக்க “நீ/உன்/உன்னை” பயன்படுத்தப்பட்டுள்ளது.
