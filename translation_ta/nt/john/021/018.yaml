  naturalness: மொழிநடை நவீனத் தரத் தமிழுக்கும் வேதாகமக் கண்ணியத்துக்கும் ஏற்றது. ‘உன் உடையை இடுப்பில் கட்டி’ என்பதை விட ‘உனக்கு இடுப்புக்கச்சை கட்டுவான்’ என்பது கிரேக்க ζώννυμι-யின் ஒரே சொல்லின் மீளுரையையும், பிறர் செய்யும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
