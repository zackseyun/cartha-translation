revisions:
- from: '“உண்மையாகவே, உண்மையாகவே உனக்குச் சொல்கிறேன்: நீ இளமையாக இருந்தபோது, நீயே உன் உடையை இடுப்பில் கட்டிக்கொண்டு[a], விரும்பிய இடங்களுக்கெல்லாம் நடந்து சென்றாய். ஆனால் நீ முதுமையடையும்போது, உன் கைகளை நீட்டுவாய்[b]; வேறொருவன் உன் உடையை இடுப்பில் கட்டி, நீ விரும்பாத இடத்துக்கு உன்னைக் கொண்டுபோவான்[c].”'
  to: '“உண்மையாகவே, உண்மையாகவே உனக்குச் சொல்கிறேன்: நீ இளமையாக இருந்தபோது, நீயே உன் உடையை இடுப்பில் கட்டிக்கொண்டு, விரும்பிய இடத்துக்குச் சென்றாய். ஆனால் நீ முதுமையடையும்போது, உன் கைகளை நீட்டுவாய்; வேறொருவன் உனக்கு இடுப்புக்கச்சை கட்டுவான்; நீ விரும்பாத இடத்துக்கு உன்னைக் கொண்டுபோவான்.”'
