id: JHN.7.17
reference: John 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: ta
  text: எவராவது அவருடைய விருப்பத்தைச் செய்ய விரும்பினால், இந்தப் போதனை கடவுளிடமிருந்து வந்ததா அல்லது நான் என்னிடமிருந்தே பேசுகிறேனா[a] என்பதை அவர் அறிந்துகொள்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “என்னிடமிருந்து.” “என் சொந்தமாக” அல்லது “என் சொந்த அதிகாரத்தில்” என்றும் பொருள்கொள்ளலாம்.
    reason: ἀπ’ ἐμαυτοῦ என்ற கிரேக்கச் சொற்றொடரின் நேரடிப் பொருளையும் அதன் சாத்தியமான நுண்பொருள்களையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: எவராவது ... விரும்பினால்
  rationale: ἐάν உடன் வரும் subjunctive பொதுவான நிபந்தனையைச் சுட்டுகிறது; θέλω என்பதன் விருப்பம் அல்லது மனவிருப்பம் என்ற பொருளை இயல்பான நவீன தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: அவருடைய விருப்பத்தை நிறைவேற்ற
  rationale: αὐτοῦ என்ற பிரதிப்பெயரை வெளிப்படையாக ‘கடவுளுடைய’ என்று மாற்றாமல் காக்கிறது. θέλημα ποιεῖν என்ற சொற்றொடரின் பொருளை தமிழில் இயல்பாகச் சொல்ல ‘விருப்பத்தை நிறைவேற்ற’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: γνώσεται
  choice: அறிந்துகொள்வார்
  rationale: எதிர்காலத்தில் விளையும் அறிவையோ தெளிவையோ குறிக்கும் சொல்லை, தமிழில் இயல்பான ஒருமை மரியாதை வடிவில் தருகிறது.
- source_word: περὶ τῆς διδαχῆς
  choice: இந்தப் போதனை ... என்பதை
  rationale: சூழலில் விவாதிக்கப்படும் இயேசுவின் போதனையைக் குறிக்கிறது. περί என்பதன் ‘குறித்து’ என்ற தொடர்பு, தமிழின் மறைமுக வினா அமைப்பில் ‘என்பதை’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: πότερον ... ἢ
  choice: '...ஆ அல்லது ...ஆ என்பதை'
  rationale: இரண்டு மாற்று வாய்ப்புகளுக்கு இடையிலான கேள்வியைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: கடவுளிடமிருந்து வந்ததா
  rationale: ἐκ குறிக்கும் மூலத்தோற்றத்தை ‘கடவுளிடமிருந்து’ தெளிவாகக் காக்கிறது; தமிழில் போதனையின் மூலத்தைப் பற்றி கேட்க ‘வந்ததா’ இயல்பான நடை.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  choice: நான் நானாகவே பேசுகிறேனா
  rationale: பேச்சு இயேசுவிடமே தோன்றுகிறதா என்ற மூலப் பொருளை இயல்பான தமிழில் தருகிறது. கிரேக்கத்தின் நேரடியான வடிவமும் அதிகாரம் சார்ந்த சாத்தியமான நுண்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: αὐτοῦ என்பதன் சுட்டுப்பொருள்
  choice: சூழலில் இது கடவுளைக் குறிக்கிறது; ஆனாலும் முதன்மை உரையில் ‘அவருடைய’ என்ற பிரதிப்பெயர் காக்கப்பட்டுள்ளது.
  alternative: ‘கடவுளுடைய விருப்பத்தை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: போதனை கடவுளிடமிருந்து வந்ததா என்பதே உடனடிச் சூழல் என்பதால் சுட்டுப்பொருள் தெளிவாக உள்ளது. மூலத்தில் உள்ள பிரதிப்பெயரை காப்பது தேவையற்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- issue: ἀπ’ ἐμαυτοῦ என்பதன் வலிமை
  choice: முதன்மை உரையில் ‘நானாகவே’ என்று மொழிபெயர்த்து, மூலத்தோற்றம் அல்லது சுயமாகப் பேசுதல் என்ற கருத்தைத் திறந்த நிலையில் வைத்துள்ளது.
  alternative: ‘என் சொந்த அதிகாரத்தில்’ அல்லது நேரடியாக ‘என்னிடமிருந்து’ என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் நேரடியாக மூலத்தோற்றத்தைக் கூறுகிறது; சுய அதிகாரம் என்ற உட்பொருள் இருக்கலாம் என்றாலும், அதை மட்டும் உறுதிப்படுத்துவது உரையை அளவுக்கு மீறி விளக்குவதாகும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாலினத்தை வரையறுக்காத τις என்பதற்காக ‘எவராவது’ என்றும், பின்னர் தமிழில் ஏற்ற ஒருமை மரியாதை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறி அது விளக்கும் ‘நானாகவே பேசுகிறேனா’ என்ற சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
