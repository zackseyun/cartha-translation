reference: John 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: ta
  text: உங்களை உலகம் வெறுக்க இயலாது; ஆனால் அது என்னை வெறுக்கிறது. ஏனெனில் அதன் செயல்கள் தீயவை என்று அதைக் குறித்து நான் சாட்சி கூறுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “உலகம்” என்பது படைக்கப்பட்ட பிரபஞ்சத்தை அல்ல, கடவுளுக்கு எதிராக நிற்கும் மனித உலக ஒழுங்கைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: வெறுக்க இயலாது
  rationale: δύναμαι என்பதில் உள்ள இயலாமையின் கருத்தைத் தெளிவாகப் பாதுகாக்கிறது; இயல்பான நவீன தமிழிலும் பொருந்துகிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: யோவானின் பயன்பாட்டில் கடவுளுக்கு எதிராக நிற்கும் மனித உலக ஒழுங்கைக் குறிக்கக்கூடிய அடுக்குப் பொருளை விளக்கிப் பரப்பாமல் அப்படியே வைத்திருக்கிறது.
- source_word: μισεῖν / μισεῖ
  choice: வெறுக்க / வெறுக்கிறது
  rationale: ஒரே கிரேக்க வினையை ஒரே தமிழ்ச் சொல்லால் அளித்து, ‘உங்கள்’ மற்றும் ‘என்னை’ என்பவற்றுக்கிடையிலான கூர்மையான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἐμὲ δὲ
  choice: ஆனால் அது என்னை
  rationale: δέ குறிக்கும் முரண்பாட்டையும் ἐμέ பெறும் வலியுறுத்தலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαρτυρῶ
  choice: நான் சாட்சி கூறுகிறேன்
  rationale: μαρτυρέω என்பதன் சாட்சியமளிக்கும் பொருளையும் அதன் நீதிமன்றச் சாயலையும் காக்கும் தெளிவான நவீனத் தமிழ்.
- source_word: περὶ αὐτοῦ
  choice: அதைக் குறித்து
  rationale: αὐτοῦ என்பதன் முன்னிடுபொருளான κόσμος-ஐத் தமிழில் உயிரற்ற ஒருமையாகக் குறிப்பிட்டு, தேவையற்ற தனிப்பட்ட ஆளாக்கத்தைத் தவிர்க்கிறது.
- source_word: τὰ ἔργα αὐτοῦ
  choice: அதன் செயல்கள்
  rationale: ἔργα என்பதன் செயல்/செய்கை என்ற நெறிசார் பொருளை இயல்பான தமிழில் தருகிறது; ‘கிரியைகள்’ என்பது இங்கு அதிக மரபுசார் நடையாக இருக்கும்.
- source_word: πονηρά
  choice: தீயவை
  rationale: இது வெறும் மோசமானவை என்பதல்ல, நெறிசார் தீமையைக் குறிக்கிறது; ‘தீயவை’ அந்த வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவானின் சூழலில் ‘உலகம்’ என்பதன் குறிப்பு மற்றும் இறையியல் வலிமை
  choice: முதன்மை உரையில் விளக்க விரிவாக்கமின்றி ‘உலகம்’ என்று வைத்தல்
  alternative: கடவுளுக்கு எதிரான உலக ஒழுங்கு / கடவுளுக்கு எதிராகக் கிளர்ந்த மனிதகுலம்
  rationale: κόσμος யோவானில் பல அடுக்குப் பொருள் கொண்டது. இயேசு அதன் தீய செயல்களை வெளிப்படுத்துவதால் அது அவரை வெறுக்கிறது என்ற பதற்றத்தை வசனம் வைத்திருக்கிறது; குறுகிய இறையியல் விளக்கமாக மொழிபெயர்த்து அதைத் தீர்த்துவிடாமல் இருப்பது பொருத்தம்.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடை. ‘சாட்சி கூறுகிறேன்’ என்பது மூலத்தின் சாட்சியச் சாயலைக் காக்கிறது. ஒரே குறிப்பு மட்டுமே சேர்க்கப்பட்டு, அதன் குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
