  text: ἀπεκρίθη ὁ ⸀ὄχλος· Δαιμόνιον ἔχεις· τίς σε ζητεῖ ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: ta
  text: 'மக்கள் கூட்டம் அவருக்குப் பதிலளித்தது: “உனக்குப் பேய் பிடித்திருக்கிறது.[a] உன்னைக் கொல்ல முயலுகிறவன் யார்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உனக்குப் பேய் இருக்கிறது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தது
  rationale: உரையாடலில் வரும் வழக்கமான பதில்வினையை இயல்பான, கண்ணியமான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ὄχλος
  choice: மக்கள் கூட்டம்
  rationale: குறிப்பிட்ட இடத்தில் கூடியிருந்த திரளான மக்களைக் குறிக்கிறது; ‘கூட்டம்’ என்பதைக் காட்டிலும் ‘மக்கள் கூட்டம்’ தெளிவாக உள்ளது.
- source_word: Δαιμόνιον ἔχεις
  choice: உனக்குப் பேய் பிடித்திருக்கிறது
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘உனக்குப் பேய் இருக்கிறது’ என்றாலும் அது நவீனத் தமிழில் இயல்பாக அதே குற்றச்சாட்டைத் தெரிவிக்காது. ‘பேய் பிடித்திருக்கிறது’ என்பது மூலத்தின் பழமொழிவழக்குப் பொருளை இயல்பாகக் கடத்துகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τίς
  choice: யார்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள வினாப்பெயரைத் தக்கவைத்து, கூட்டத்தின் மறுப்புணர்வுள்ள வினாவைப் பாதுகாக்கிறது.
- source_word: ζητεῖ
  choice: முயலுகிறவன்
  rationale: இங்கு கொல்ல நாடுதல் அல்லது முயற்சி செய்தல் என்ற தொடர்ச்சியான நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀποκτεῖναι
  choice: கொல்ல
  rationale: கூடுதல் சட்ட அல்லது அறநெறி நுணுக்கத்தைச் சேர்க்காமல் வினையின் நேரடிப் பொருளைத் தருகிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான Δαιμόνιον ἔχεις என்ற குற்றச்சாட்டை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘உனக்குப் பேய் பிடித்திருக்கிறது’ என்று இயல்பான தமிழ் பழமொழிவழக்கில் தருதல்; நேரடி வடிவத்தை அடிக்குறிப்பில் காட்டுதல்.
  alternative: ‘உனக்குப் பேய் இருக்கிறது.’
  rationale: இது கூட்டம் கூறிய பகைமையான குற்றச்சாட்டு; உரை அதை உண்மையென அங்கீகரிப்பதில்லை. இயல்பான தமிழ் வாசகத்தைப் பயன்படுத்தினாலும், மூலத்தின் நேரடி அமைப்பை அடிக்குறிப்பில் பாதுகாப்பதால் அதன் சொற்பொருளும் இறையியல் பதற்றமும் மறைக்கப்படுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபருக்கான ‘உன்/உன்னை’ வடிவங்கள் கூட்டத்தின் நேரடியான, மரியாதையற்ற குற்றச்சாட்டைத் தக்கவைக்கின்றன.
