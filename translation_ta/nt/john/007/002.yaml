    text: அல்லது, இன்னும் நேரடியாக, ‘குடிசைப் பண்டிகை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான கதைத் தொடர்ச்சி இணைப்புச்சொல். இவ்வசனத்தில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற கால அல்லது எதிர்மறை நுணுக்கத்தை உண்டாக்கும்; தமிழில் வாக்கியத் தொடர்ச்சியே அதன் பணியைச் செய்கிறது.
- source_word: ἐγγὺς
  choice: நெருங்கியிருந்தது
  rationale: கால அண்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: யூதர்களின் பண்டிகை
  rationale: இது யூத மக்களுக்குரிய சமயப் பண்டிகை என்பதைத் தெளிவாகவும் மூலத்தின் உறவுநிலை அமைப்புக்கு நெருக்கமாகவும் காட்டுகிறது.
- source_word: σκηνοπηγία
  choice: கூடாரப் பண்டிகை
  rationale: தற்காலிகத் தங்குமிடங்கள் அமைப்பதுடன் தொடர்புடைய இப்பண்டிகையின் பொருளை, தமிழில் பரவலாக அறியப்படும் பெயரால் வழங்குகிறது.
theological_decisions:
- issue: τῶν Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதப்
  rationale: இங்கு இச்சொற்றொடர் பண்டிகையை யூத மக்களுடன் அடையாளப்படுத்துகிறது; யூதர்களைப் பற்றிய எதிர்மறை அல்லது விவாதத் தொனி இதில் இல்லை. ‘யூதர்களின்’ என்பது மூலத்தின் உறவுநிலையையும் தெளிவாக வைத்திருக்கிறது.
- issue: σκηνοπηγία பண்டிகையின் பெயர்
  choice: கூடாரப் பண்டிகை
  alternative: குடிசைகளின் பண்டிகை
  rationale: முதன்மை உரையில் அறிமுகமான பெயரைப் பயன்படுத்தி, கிரேக்கச் சொல்லின் மேலும் சொற்பொருள் சார்ந்த மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘கூடாரப் பண்டிகை’ என்ற அறிமுகமான பெயர் வாசிப்புத் தெளிவுக்காகப் பயன்படுத்தப்பட்டுள்ளது; சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
