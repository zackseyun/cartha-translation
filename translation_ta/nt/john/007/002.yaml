  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: ta
  text: யூதர்களின் பண்டிகையான கூடாரப் பண்டிகை[a] நெருங்கியிருந்தது.
  philosophy: optimal-equivalence
