source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: ta
  text: பண்டிகையின் கடைசி நாளாகிய பெருநாளில், இயேசு நின்றுகொண்டு உரக்கக் கூவி, “யாருக்காவது தாகமாயிருந்தால், அவர் என்னிடம் வந்து அருந்தட்டும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς
  choice: பண்டிகையின் கடைசி நாளாகிய அந்தப் பெருநாளில்
  rationale: காலத்தைக் குறிக்கும் ἐν மற்றும் ‘கடைசி நாள்’, ‘பெருநாள்’ என்ற இரு விளக்கங்களையும் இயல்பான தமிழில் பாதுகாக்கிறது. δέ மென்மையான இணைப்புச்சொல் என்பதால் தேவையற்ற வலுவான எதிர்மறை இணைப்பு சேர்க்கப்படவில்லை.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: இயேசு நின்று
  rationale: εἱστήκει இங்கு இயேசுவின் நிற்கும் நிலையைச் சுட்டுகிறது; ‘எழுந்து நின்று’ என மூலத்தில் இல்லாத எழுதல் செயலைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔκραξεν λέγων
  choice: உரத்த குரலில் ... என்று கூறினார்
  rationale: κράζω குறிக்கும் வலுவான பொதுவான அழைப்பை ‘உரத்த குரலில்’ வெளிப்படுத்துகிறது; λέγων அறிமுகப்படுத்தும் நேரடிக் கூற்றும் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: Ἐάν τις διψᾷ
  choice: யாருக்காவது தாகமாயிருந்தால்
  rationale: τις என்பதன் வரையறுக்கப்படாத, அனைவரையும் உள்ளடக்கும் ஒருமைப் பொருளையும், διψᾷ என்பதன் தாக உருவகத்தையும் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: அவர் என்னிடம் வந்து அருந்தட்டும்
  rationale: இரு நிகழ்காலக் கட்டளை வடிவங்களின் அழைப்பு/கட்டளை வலிமையை ஒருமையில் வைத்திருக்கிறது. ‘அருந்தட்டும்’ என்பது கண்ணியமான நவீனத் தமிழில் πινέτω-வின் பொருளைத் தருகிறது.
theological_decisions:
- issue: தாகம் மற்றும் அருந்துதல் ஆகியவற்றின் உருவகப் பொருள்
  choice: ‘தாகம்’, ‘அருந்துதல்’ என்ற உருவகங்களை அப்படியே வைத்தல்
  alternative: அவற்றை ‘வாழ்வை விரும்புதல்’, ‘விசுவாசித்தல்’ அல்லது ‘ஆவியைப் பெறுதல்’ என்று விளக்கி மொழிபெயர்த்தல்
  rationale: இவ்வசனம் உருவகத்தைத் திறந்த நிலையில் வைக்கிறது; அதன் விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பது யோவான் உரையின் இறையியல் பதற்றத்தையும் தொடர்ச்சியையும் முன்கூட்டியே தீர்த்துவிடும்.
- issue: τις மற்றும் ஒருமை கட்டளைகளின் பொதுப்பொருள்
  choice: ‘யாருக்காவது ... அவர் ... அருந்தட்டும்’ என்ற பொதுவான ஒருமை அமைப்பு
  alternative: பன்மையாக அல்லது பாலினத்தைக் குறிப்பாகச் சொல்லும் அமைப்பு
  rationale: தமிழின் ‘அவர்’ மரியாதைமிக்க பொதுவான ஒருமையாக இயங்கி, கிரேக்கத்தின் இலக்கண ஒருமையையும் எல்லாருக்குமான அழைப்பையும் இயல்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘விழா’ என்பதற்குப் பதிலாக யூத சமயச் சூழலைத் தெளிவாகத் தரும் ‘பண்டிகை’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
