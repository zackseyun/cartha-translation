source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: ta
  text: ஆகவே, அவர்கள் அவரைப் பிடிக்க முயன்றுகொண்டிருந்தார்கள்[a]; ஆனால் ஒருவரும் அவர்மேல் கை வைக்கவில்லை, ஏனெனில் அவருடைய வேளை இன்னும் வந்திருக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைக் கைது செய்ய முயன்றுகொண்டிருந்தார்கள்.’ ‘பிடிக்க’ என்பதற்கான கிரேக்க வினைச்சொல் பற்றிக்கொள்வது அல்லது கைப்பற்றுவதைக் குறிக்கிறது; இச்சூழலில் அது கைது செய்வதைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய வேளை’ என்பது யோவான் நற்செய்தியில் இயேசுவின் பணியில் இறைவனால் நியமிக்கப்பட்ட காலத்தைக் குறிக்கும் மீண்டும் மீண்டும் வரும் சொற்றொடர்; குறிப்பாக அவரது பாடு, மரணம், உயிர்த்தெழுதல், மகிமைப்படுதல் ஆகியவற்றோடு அது தொடர்புடையது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: முயன்றார்கள்
  rationale: இறந்தகாலத் தொடர்ச்சியான முயற்சியைச் சூழல் காட்டுகிறது. தமிழில் ‘பிடிக்க முயன்றார்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் விளைவு அல்லது தொடர்ச்சியைத் தெளிவாகக் குறிக்கிறது.
- source_word: πιάσαι
  choice: பிடிக்க
  rationale: அடிப்படைப் பொருளான ‘பற்றிப் பிடித்தல்/கைப்பற்றுதல்’ என்பதைக் காக்கிறது; சூழலில் கைது செய்வது உட்பொருளாக இருந்தாலும், அதை முதன்மை உரையில் சட்டரீதியாகக் குறுக்கவில்லை.
- source_word: οὐδεὶς
  choice: ஒருவரும் ... இல்லை
  rationale: எதிர்மறை வாக்கியத்தில் இயல்பான நவீனத் தமிழ் அமைப்பு.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: அவர்மேல் கை வைக்கவில்லை
  rationale: ஒருவரைப் பிடிக்க அல்லது தீங்கு செய்ய முனைவதைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் மரபுத்தொடர்; ஒருமையான ‘கை’ என்பதையும் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: யாரும் செயல்படாததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: οὔπω
  choice: இன்னும் ... இல்லை
  rationale: காலத்தைக் குறிக்கும் மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐληλύθει
  choice: வரவில்லை
  rationale: அந்தக் கடந்தகாலக் கட்டத்தில் தீர்மானிக்கப்பட்ட நேரம் இன்னும் வந்திருக்கவில்லை என்ற முற்பட்ட இறந்தகாலப் பொருள் தமிழ்ச் சூழலால் தெளிவாகிறது.
- source_word: ἡ ὥρα αὐτοῦ
  choice: அவருடைய நேரம்
  rationale: ‘ὥρα’ என்பதன் காலப்பொருளையும் யோவானில் அதன் சிறப்பான இறையியல் நிறையையும் காக்கிறது. தமிழில் ‘அவருடைய நேரம்’ என்பது இயல்பாக இருந்து, அதன் பொருளை மிகக் குறுகியதாக வரையறுக்காமல் விடுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் ‘அவருடைய நேரம்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அவருடைய நேரம்’ என்று விரிவாக்கமின்றி வைத்தல்
  alternative: ‘அவர் மரிப்பதற்கான நியமிக்கப்பட்ட நேரம்’ அல்லது ‘அவருடைய வேளை’
  rationale: இச்சொற்றொடர் இயேசுவின் பாடு, மரணம், உயிர்த்தெழுதல், மகிமைப்படுதல் ஆகியவற்றோடு தொடர்புடைய இறைநியமிக்கப்பட்ட கட்டத்தைச் சுட்டுகிறது; ஆனால் இவ்வசனம் அதை மரணம் அல்லது கைது என மட்டும் வரையறுப்பதில்லை. ஆகவே அதன் இறையியல் அகலமும் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘கை வைக்கவில்லை’ என்ற இயல்பான மரபுத்தொடர் பயன்படுத்தப்பட்டுள்ளது. ‘நேரம்’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் யோவானின் பலபொருள் நிறைந்த சொல்லாட்சியைத் திறந்ததாகவும் வைத்திருக்கிறது.
