- from: ஆகவே, அவர்கள் அவரைப் பிடிக்க முயன்றார்கள்[a]. ஆனால் ஒருவரும் அவர்மேல் கை வைக்கவில்லை; ஏனெனில் அவருடைய நேரம் இன்னும் வரவில்லை[b].
  to: ஆகவே, அவர்கள் அவரைப் பிடிக்க முயன்றுகொண்டிருந்தார்கள்[a]; ஆனால் ஒருவரும் அவர்மேல் கை வைக்கவில்லை, ஏனெனில் அவருடைய வேளை இன்னும் வந்திருக்கவில்லை[b].
