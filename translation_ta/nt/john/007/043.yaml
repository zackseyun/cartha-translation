base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ta
  text: ஆகவே, அவரால் கூட்டத்தினரிடையே பிரிவு ஏற்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: பிளவு
  rationale: மக்களிடையே ஏற்பட்ட கருத்து வேறுபாட்டையும் அதனால் உண்டான பிரிவையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய விவாதத்தின் விளைவைச் சுட்டுகிறது; கிரேக்க இணைப்புச் சொல்லின் முடிவுறுத்தும் வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἐγένετο
  choice: ஏற்பட்டது
  rationale: ஒரு பிளவு உருவானது என்ற நிகழ்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ὄχλῳ
  choice: மக்கள் கூட்டத்தில்
  rationale: ὄχλος என்பது அங்கு கூடியிருந்த மக்களைக் குறிக்கிறது; இத்தொடர் கூட்டத்தினுள் ஏற்பட்ட பிளவைத் தெளிவுபடுத்துகிறது.
- source_word: δι’ αὐτόν
  choice: அவரால்
  rationale: διά + accusative இங்கு காரணத்தைக் குறிக்கிறது. 'அவரால்' என்பது இயேசுவை முன்னிட்டு ஏற்பட்ட பிளவு என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; பிரதிப்பெயரின் மறைமுகத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: αὐτόν என்பதன் குறிப்பு
  choice: '''அவர்'' என்பது சூழலில் இயேசுவைக் குறிக்கிறது; பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.'
  alternative: “இயேசுவால்” என்று வெளிப்படுத்துதல்
  rationale: மூலத்தில் பிரதிப்பெயரே இருப்பதால் அதையே காப்பது இயல்பானது; சூழல் அதன் குறிப்பைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. 'பிளவு' சமூக மற்றும் கருத்து வேறுபாட்டின் தீவிரத்தைப் பாதுகாக்கிறது.
