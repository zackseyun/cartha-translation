source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: ta
  text: “என்னில் நம்பிக்கை வைக்கிறவர்—வேதவசனம் கூறியிருப்பதுபோல்—அவருடைய[a] உள்ளத்திலிருந்து[b] உயிருள்ள நீரின் ஆறுகள் பாயும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய’ என்பது இயல்பாக நம்பிக்கை வைக்கிறவரைக் குறிக்கிறது; சிலர் இதை மெசியாவாகிய இயேசுவைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கச் சொல்லின் நேர்ப்பொருள் ‘வயிறு’ அல்லது ‘கருப்பை’; இங்கு அது ஒருவரின் அகமையத்தைக் குறிக்கும் உருவகமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: என்னில் நம்பிக்கை வைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, நம்பிக்கை வைப்பதால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது. εἰς ἐμέ என்பது இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையைத் தெரிவிக்கிறது.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: வேதவசனம் கூறியிருப்பதுபோல்
  rationale: இது வேதத்தின் சான்றை அறிமுகப்படுத்துகிறது. கிரேக்கத்தில் இறந்தகால வடிவம் இருந்தாலும், முன்பு கூறப்பட்டதும் இன்றும் பொருந்துவதுமான வேதவாக்கை இயல்பான தமிழில் ‘கூறியிருக்கிறது/கூறியிருப்பதுபோல்’ என வழங்கலாம். ஒருமை ἡ γραφή என்பதற்காக ‘வேதவசனம்’ பயன்படுத்தப்பட்டது.
- source_word: ποταμοὶ
  choice: ஆறுகள்
  rationale: சிறிய ஓடைகளைவிடப் பெருகிய நீரோட்டத்தைக் குறிக்கும் பன்மை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: அவருடைய உள்ளத்திலிருந்து
  rationale: κοιλία என்பதன் நேர்ப்பொருள் ‘வயிறு’ அல்லது ‘கருப்பை’; இங்கு ஒருவரின் அகமையத்தை உருவகமாகக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘உள்ளம்’ முதன்மை உரையில் வைக்கப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ῥεύσουσιν
  choice: பாயும்
  rationale: எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் இல்லாத கூடுதல் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: ὕδατος ζῶντος
  choice: உயிருள்ள நீர்
  rationale: யோவான் நற்செய்தியில் முக்கியமான உருவகத் தொடரை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது; ஓடும் நீர் மற்றும் உயிரோடு தொடர்புடைய இறையியல் எதிரொலி இரண்டும் நீடிக்கின்றன.
theological_decisions:
- issue: αὐτοῦ (‘அவருடைய’) என்பதன் சுட்டுப்பொருள்
  choice: இது மிக அருகிலுள்ள இலக்கண முன்னிலையான நம்பிக்கை வைக்கிறவரைக் குறிக்கிறது.
  alternative: இது மெசியாவாகிய இயேசுவைக் குறிக்கலாம்; அப்படியானால் உயிருள்ள நீர் அவரிடமிருந்து பாய்கிறது.
  rationale: வாக்கிய அமைப்பில் நம்பிக்கை வைக்கிறவரே இயல்பான முன்னிலை; அடுத்த வசனம் விசுவாசிகள் பெறவிருந்த ஆவியைப் பற்றிக் கூறுவதும் இதற்கு ஒத்துள்ளது. எனினும் மெசியாவைக் குறிக்கும் வாசிப்பு சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: κοιλία என்பதன் உருவகப் பொருள்
  choice: உள்ளம்
  alternative: வயிறு; கருப்பை
  rationale: உடற்கூறு சார்ந்த நேர்ப்பொருள் நவீன வாசகரைத் தவறாக வழிநடத்தக்கூடும். ‘உள்ளம்’ என்பது ஒருவரின் அகமையத்தைக் குறிக்கும் உருவகத்தை இயல்பான தமிழில் தெரிவிக்கிறது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் அசாதாரண வாக்கிய ஓட்டத்தையும் வேதவசனச் சான்றின் இடத்தையும் ஓரளவு பாதுகாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன. ‘ஜீவத்தண்ணீர்’ போன்ற பழைய திருச்சபை வழக்குக்குப் பதிலாக இயல்பான ‘உயிருள்ள நீர்’ தேர்ந்தெடுக்கப்பட்டது.
