  register: நவீன பொதுத்தரத் தமிழ்; எளிமையானதும் கண்ணியமானதும். ‘அவரோ’ என்பது αὐτός-இன் அழுத்தத்தை இயல்பாகக் காக்கிறது; ‘தங்கியிருந்தார்’ என்பது கதைச் சூழலுக்கு ஏற்ற தொடர்நிலையை உணர்த்துகிறது.
