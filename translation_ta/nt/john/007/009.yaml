  text: After saying these things, he himself remained in Galilee.
translation:
  language: ta
  text: இவற்றைச் சொன்ன பிறகு, அவரோ கலிலேயாவில் தங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முந்தைய வசனங்களில் சொல்லப்பட்ட பல கருத்துகளைச் சுட்டும் நடுநிலைப் பன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: δὲ … εἰπὼν
  choice: சொன்ன பிறகு
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் முதன்மை வினைக்கு முந்திய காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; δέ தரும் மென்மையான தொடர்ச்சி/வேறுபாடு அடுத்துள்ள ‘அவரோ’ என்பதில் பிரதிபலிக்கிறது.
- source_word: αὐτὸς
  choice: அவரோ
  rationale: எளிய எழுவாய்க்குத் தேவையற்ற வெளிப்படையான αὐτός தரும் அழுத்தத்தையும், சகோதரர்களின் செயலுடன் உள்ள பின்னணிச் சார்ந்த வேறுபாட்டையும் மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: ἔμεινεν
  choice: தங்கியிருந்தார்
  rationale: இந்த நிகழ்வுரையில் μένω என்பதன் ‘அங்கேயே தொடர்ந்து இருத்தல்/தங்குதல்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: கலிலேயாவிலேயே
  rationale: இடப்பொருளைத் தெளிவாகக் காட்டுவதோடு, αὐτός மற்றும் சூழல் உணர்த்தும் ‘அவர் அங்கேயே இருந்தார்’ என்ற கவனக்குவிப்பை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
