base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: ta
  text: இதன் காரணமாக மோசே உங்களுக்கு விருத்தசேதனத்தைக் கொடுத்திருக்கிறார்—அது மோசேயிடமிருந்து வந்ததல்ல, முற்பிதாக்களிடமிருந்து வந்தது[a]—நீங்களும் ஓய்வுநாளில் ஒரு ஆணுக்கு விருத்தசேதனம் செய்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது மோசேயிடமிருந்து வந்தது என்பதால் அல்ல, முற்பிதாக்களிடமிருந்து வந்தது.” இந்த இடைச்செருகல், விருத்தசேதனம் மோசேயிடமிருந்து தோன்றியது அல்ல; முற்பிதாக்களிடமிருந்து வந்தது என்பதை விளக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முன்னுள்ள கருத்தைத் தொடர்ந்து இயேசு அளிக்கும் விளக்கத்தின் காரணத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: δέδωκεν
  choice: கொடுத்திருக்கிறார்
  rationale: கடந்த காலத்தில் கொடுக்கப்பட்டு, கேட்போரின் நிகழ்கால நடைமுறையில் தொடர்ந்து நிலவும் ஏற்பாட்டை கிரேக்க நிறைவேற்றுக் காலத்தின் நோக்குக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: τὴν περιτομήν
  choice: விருத்தசேதனம்
  rationale: உடன்படிக்கை சார்ந்த சடங்கு மற்றும் அதன் நடைமுறையைக் குறிக்கும் நிலைபெற்ற, துல்லியமான தமிழ்ச் சொல்.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: அது மோசேயிடமிருந்து வந்தது என்பதால் அல்ல, முற்பிதாக்களிடமிருந்து வந்தது
  rationale: ἐκ என்பதன் தோற்றமூலப் பொருளை ‘இடமிருந்து வந்தது’ எனத் தெளிவாக்கி, இடைச்செருகல் விளக்கத்தின் அமைப்பையும் காக்கிறது. ‘முற்பிதாக்கள்’ என்பது இங்கு மோசேக்கு முந்திய பிதாமகர்களைக் குறிக்கிறது.
- source_word: ἐν σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: ஒரு குறிப்பிட்ட நாளை அல்லாமல் பொதுவான ஓய்வுநாள் நடைமுறையைக் குறிக்கும் காலப் பயன்பாட்டை இயல்பாக வழங்குகிறது.
- source_word: περιτέμνετε
  choice: விருத்தசேதனம் செய்கிறீர்கள்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்காலத்தை நேரடியாகக் காத்து, வழக்கமாக ஏற்றுக்கொள்ளப்பட்ட செயலைக் காட்டுகிறது.
- source_word: ἄνθρωπον
  choice: ஒருவனுக்கு
  rationale: விருத்தசேதனத்தின் சூழலில் ஆண் நபரைக் குறிப்பது தெளிவாக இருப்பதால் பாலினச் சிறப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘முற்பிதாக்கள்’ என்பதன் குறிப்பு
  choice: விருத்தசேதனம் மோசேக்கு முன்பே இருந்தது என்பதைக் காட்டும் பிதாமக மூதாதையர்
  alternative: இஸ்ரவேலின் மூதாதையர் அனைவரையும் பொதுவாகக் குறித்தல்
  rationale: விருத்தசேதனம் மோசேயிடமிருந்து தோன்றவில்லை என்ற வரலாற்று-சட்டக் கருத்தை உரை வலியுறுத்துகிறது; மொழிபெயர்ப்பு இதைத் தக்கவைக்கிறது, ஆனால் உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘விருத்தசேதனம்,’ ‘ஓய்வுநாள்,’ ‘முற்பிதாக்கள்’ ஆகிய நிலைபெற்ற சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; கோடுகள் கிரேக்கத்தின் இடைச்செருகல் அமைப்பைக் காட்டுகின்றன.
