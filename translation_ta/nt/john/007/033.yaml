id: JHN.7.33
reference: John 7:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: ta
  text: ஆகவே இயேசு, “இன்னும் சிறிது காலம் நான் உங்களோடு இருக்கிறேன்; என்னை அனுப்பினவரிடம்[a] செல்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவானின் விரிந்த சூழலில், “என்னை அனுப்பினவர்” என்பது தந்தையைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து வரும் விளைவு அல்லது தொடர்ச்சியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Ἔτι χρόνον μικρόν
  choice: இன்னும் சிறிது காலம்
  rationale: ἔτι என்பதன் ‘இன்னும்’ என்ற பொருளையும் χρόνον μικρόν என்பதன் குறுகிய கால அளவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: நான் உங்களோடு இருப்பேன்
  rationale: தமிழில் மீதமுள்ள குறுகிய காலத்தைப் பற்றிய இயல்பான உரையாக எதிர்கால வடிவம் பயன்பட்டாலும், இயேசுவின் தொடரும் உடனிருப்பையே தெரிவிக்கிறது.
- source_word: καὶ ὑπάγω
  choice: பிறகு ... செல்கிறேன்
  rationale: முதலில் சிறிது காலம் உடனிருத்தல், அதைத் தொடர்ந்து செல்லுதல் என்ற இயல்பான காலவரிசையைத் தமிழில் தெளிவாக்குகிறது; ὑπάγω என்பதன் எளிய இயக்கப் பொருளை ‘செல்கிறேன்’ காக்கிறது.
- source_word: πρὸς τὸν πέμψαντά με
  choice: என்னை அனுப்பினவரிடம்
  rationale: பெயராக்கப்பட்ட இறந்தகால வினையெச்சத்தின் உறவுசார் வடிவத்தைப் பாதுகாத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘தந்தை’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘என்னை அனுப்பினவர்’ யார் என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘என்னை அனுப்பினவர்’ என்ற மறைமுகக் குறிப்பையே வைத்தல்
  alternative: ‘என்னை அனுப்பிய தந்தையிடம்’
  rationale: யோவானின் விரிந்த சூழலில் இது தந்தையைக் குறிக்கிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரை அவரை நேரடியாகப் பெயரிடாததால் அந்த வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானதும் கண்ணியமானதும். மேற்கோளின் முடிவில் உள்ள [a] குறிப்பு ‘என்னை அனுப்பினவர்’ என்ற முழுச் சொற்றொடருக்குப் பொருந்துகிறது.
