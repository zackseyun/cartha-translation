  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: ta
  text: நான் அவரை அறிவேன்[a]; ஏனெனில் நான் அவரிடமிருந்து வந்தவன்[b], அவரே என்னை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவரிடமிருந்து வந்தவன் என்பதை நான் அறிவேன்.” கிரேக்க இணைப்புச்சொல் உள்ளடக்கத்தையோ காரணத்தையோ அறிமுகப்படுத்தலாம்; இங்கு சூழல் காரணப் பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் அவரிடமிருந்து வந்தேன்” அல்லது “நான் அவருடைய முன்னிலையிலிருந்து வந்தவன்.” கிரேக்கத் தொடர் வெறுமனே ‘அவரிடமிருந்து’ என்பதைக் காட்டிலும் குறிப்பாக மூலம் அல்லது தோற்றத்தைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: οἶδα
  choice: அறிந்திருக்கிறேன்
  rationale: தற்போது நிலவும் அறிவைக் குறிக்கும் οἶδα என்பதன் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் பிதாவைக் குறிக்கும் தனிப்பட்ட சுட்டுப்பெயரை விளக்கச் சொல் சேர்க்காமல் மரியாதைத் தமிழில் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு இயேசு அவரை அறிந்திருப்பதற்கான காரணத்தை அறிமுகப்படுத்துவதாகச் சூழல் ஆதரிக்கிறது; ‘என்று’ என்ற உள்ளடக்கப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρ’ αὐτοῦ εἰμι
  choice: நான் அவரிடமிருந்து வந்தவன்
  rationale: παρά + உரிய வேற்றுமை காட்டும் மூலம்/தோற்ற உறவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வந்தேன்’ என்று வெறும் பயண நிகழ்வாகக் குறுக்காமல், εἰμι என்பதின் நிலைசார் வலிமையையும் ‘வந்தவன்’ தக்கவைக்கிறது.
- source_word: κἀκεῖνός
  choice: அவரே
  rationale: καί + ἐκεῖνος என்பதிலுள்ள தொடர்ச்சியையும் சுட்டுவலியையும் தமிழில் ‘அவரே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: με
  choice: என்னை
  rationale: ἀπέστειλεν என்பதன் நேர்பொருள் சுட்டுப்பெயரை நேரடியாகத் தருகிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: இறந்தகாலச் செயலை இயல்பாகத் தருவதோடு யோவான் நூலின் அனுப்பப்படுதல் கருத்தையும் காக்கிறது.
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι என்பதில் இயேசுவுக்கும் பிதாவுக்கும் உள்ள உறவு
  choice: நான் அவரிடமிருந்து வந்தவன்
  alternative: நான் அவரிடமிருந்து வந்தேன்; நான் அவருடைய முன்னிலையிலிருந்து வந்தவன்
  rationale: இத்தொடர் மூலம் அல்லது தோற்றத்தைச் சுட்டுகிறது. ‘வந்தவன்’ என்பது வெறும் பணி அனுப்புதலாகவோ இடமாற்றமாகவோ பொருளைக் குறுக்காமல், உறவு மற்றும் தோற்றம் குறித்த இறையியல் ஆழத்தையும் பதற்றத்தையும் திறந்தவாறு வைக்கிறது.
- issue: ὅτι என்பதன் இலக்கணப் பங்கு
  choice: ஏனெனில் என்ற காரணப் பொருள்
  alternative: என்று என்ற உள்ளடக்கப் பொருள்
  rationale: உடனடி சூழல் காரணப் பொருளை ஆதரிக்கிறது; எனினும் கிரேக்கச் சொல் உள்ளடக்க வாக்கியத்தையும் அறிமுகப்படுத்தக்கூடியதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் தமிழ். பிதாவைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தலும் இறையியல் திறந்த தன்மையும் காக்கப்பட்டுள்ளன.
