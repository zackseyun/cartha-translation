id: JHN.7.6
reference: John 7:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: ta
  text: ஆகவே இயேசு அவர்களிடம், “எனக்குரிய காலம் இன்னும் வரவில்லை[a]; ஆனால் உங்களுக்குரிய காலம் எப்போதும் தயாராகவே உள்ளது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் குறிக்கப்பட்ட காலம் இன்னும் வந்தடையவில்லை.” கிரேக்கச் சொல் பொதுவான காலத்தை மட்டுமல்ல, பொருத்தமான அல்லது குறிக்கப்பட்ட காலத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து வரும் முடிவையோ தொடர்ச்சியையோ இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: இயேசு ... என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பன்மை மறைமுகப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: καιρός
  choice: காலம்
  rationale: இங்கு பொதுவான காலப்போக்கை மட்டுமல்ல, பொருத்தமான அல்லது குறிக்கப்பட்ட தருணத்தையும் குறிக்கக்கூடிய சொல்லாகும்; ‘காலம்’ அந்தப் பொருளை விரிவுபடுத்தாமல் தக்கவைக்கிறது.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: எனக்குரிய காலம்
  rationale: இயேசுவுக்கும் அவர்களுக்கும் உரிய காலங்களுக்கிடையிலான வலியுறுத்தப்பட்ட வேறுபாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: οὔπω πάρεστιν
  choice: இன்னும் வரவில்லை
  rationale: ‘இன்னும் வந்தடையவில்லை/இப்போது இல்லை’ என்ற காலப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இயேசுவின் காலத்துக்கும் அவர்களுடைய காலத்துக்கும் இடையிலான எதிர்மறை ஒப்புமையை வெளிப்படுத்துகிறது.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: உங்களுக்குரிய காலம்
  rationale: முதல் கூறின் அமைப்பை எதிரொலித்து, இரு தரப்புகளுக்கிடையிலான வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: πάντοτέ
  choice: எப்போதும்
  rationale: ‘எல்லா நேரங்களிலும்’ என்ற நேரடியான பொருளை வழங்குகிறது.
- source_word: ἕτοιμος
  choice: ஆயத்தமாக இருக்கிறது
  rationale: ‘தயாராக/ஆயத்தமாக உள்ளது’ என்ற அடிப்படை உருவகத்தைத் தக்கவைக்கிறது; ‘ஏற்றதாக உள்ளது’ என விளக்கிப் பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியின் சூழலில் இயேசுவின் ‘காலம்’ என்பதன் பொருள்
  choice: ‘எனக்குரிய காலம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எனக்குக் குறிக்கப்பட்ட காலம்’ அல்லது ‘என் வேளை’
  rationale: இந்தச் சொற்றொடர் இயேசுவின் பணி மற்றும் மகிமைப்படுதல் சார்ந்த இறையியல் முக்கியத்துவத்தைக் கொண்டிருக்கக்கூடும். எனினும், மூலத்தில் καιρός என்பதே உள்ளது; ὥρα அல்ல. ஆகவே அந்த இறையியல் தொடர்பை முதன்மை உரையில் வெளிப்படையாக விரிவுபடுத்தாமல், உள்ளார்ந்த அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயத்தமாக இருக்கிறது’ என்பது தமிழில் சற்றே உருவகத் தன்மை கொண்டிருந்தாலும், மூலத்தின் ‘தயாராக உள்ளது’ என்ற வெளிப்பாட்டை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
