  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: ta
  text: 'அவர்களுக்குப் பரிசேயர்கள் பதிலளித்தார்கள்: “நீங்களும்கூட வழிதவறிவிட்டீர்களா?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்களும்கூட ஏமாற்றப்பட்டுவிட்டீர்களா?” இங்குள்ள வினைச்சொல் வழிதவறச் செய்யப்படுதல் அல்லது ஏமாற்றப்படுதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: கேட்டார்கள்
  rationale: இங்கு ἀποκρίνομαι உரையாடலில் பதிலளிப்பதைக் குறிக்கிறது. தமிழில் தொடர்ந்து வரும் நேரடி வினாவுடன் ‘என்று கேட்டார்கள்’ இயல்பாக அமைகிறது; ‘பதிலளித்தார்கள்’ என்பதும் சாத்தியம், ஆனால் இச்சூழலில் சற்று இறுக்கமானது.
- source_word: οὖν
  choice: அதற்கு
  rationale: முந்தைய கூற்றுக்கான பதில் அல்லது தொடர்ச்சியை இயல்பான தமிழில் இணைக்கிறது; ‘ஆகவே’ என்பதிலுள்ள வலுவான தர்க்க முடிவைத் தவிர்க்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பதில் யாரை நோக்கிக் கூறப்பட்டது என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: யூத மதக்குழுவின் வழக்கமான தமிழ்ப் பெயர். தமிழில் பன்மைச் சுட்டுக்கு தனி definite article தேவையில்லை.
- source_word: Μὴ καὶ ὑμεῖς
  choice: நீங்களுமா
  rationale: καί என்பதன் ‘நீங்களும்கூட’ என்ற வலியுறுத்தலையும், μή வினா எதிர்மறைப் பதிலை எதிர்பார்ப்பதையும் சுருக்கமான, இயல்பான தமிழ்ச் சொல்லமைப்பு உணர்த்துகிறது.
- source_word: πεπλάνησθε
  choice: தவறான வழியில் நடத்தப்பட்டிருக்கிறீர்கள்
  rationale: πλανάω என்பதன் வழிதவறச் செய்தல் அல்லது ஏமாற்றி பிழைக்குள் இட்டுச் செல்லுதல் என்ற பொருளையும், perfect passive வடிவத்தின் ஏற்பட்டுள்ள நிலை உணர்வையும் காக்கிறது.
theological_decisions:
- issue: μή கொண்டு தொடங்கும் வினாவின் சொல்லாட்சிச் சக்தி
  choice: எதிர்மறைப் பதிலை எதிர்பார்க்கும் ஏளனத் தொனியை ‘நீங்களுமா...?’ என்ற வினாவால் உணர்த்துதல்
  alternative: ‘நிச்சயமாக நீங்களும் ஏமாற்றப்படவில்லை அல்லவா?’
  rationale: μή பேச்சாளர்கள் ‘இல்லை’ என்ற பதிலை எதிர்பார்ப்பதைக் காட்டுகிறது. ‘நிச்சயமாக’ போன்ற கூடுதல் சொல்லைச் சேர்க்காமல் தமிழின் வினா அமைப்பே அந்த எதிர்பார்ப்பையும் பரிசேயர்களின் இகழ்ச்சித் தொனியையும் சுமக்கிறது.
- issue: πεπλάνησθε என்பதிலுள்ள வழிதவறுதல் மற்றும் ஏமாற்றப்படுதல் ஆகிய பொருள் நிழல்கள்
  choice: முதன்மை உரையில் ‘தவறான வழியில் நடத்தப்பட்டிருக்கிறீர்கள்’
  alternative: ‘ஏமாற்றப்பட்டிருக்கிறீர்கள்’
  rationale: முதன்மைத் தேர்வு ஒருவரால் பிழைக்குள் வழிநடத்தப்பட்ட passive உணர்வைக் காக்கிறது; ‘ஏமாற்றப்பட்டிருக்கிறீர்கள்’ என்பது செல்லத்தக்க சுருக்கமான மாற்று, ஆனால் வழிதவறச் செய்யும் இயக்கப் படிமத்தைச் சற்றுக் குறைக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழ்; மரியாதைப் பன்மையான ‘நீங்கள்’ மூலத்தின் பன்மைச் சுட்டைத் தெளிவாகக் காக்கிறது. உரை எளிமையாகவும் கண்ணியமாகவும் உள்ளது; ‘நீங்களுமா’ பரிசேயர்களின் வியப்பும் இகழ்ச்சியும் கலந்த சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
