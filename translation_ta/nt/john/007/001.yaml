  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு இயேசு கலிலேயாவில் நடமாடிக்கொண்டிருந்தார். யூதேயாவில் நடமாட அவர் விரும்பவில்லை; ஏனெனில் யூதர்கள்[a] அவரைக் கொல்ல முயன்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயர்கள்” அல்லது “யூதத் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம். யோவான் நற்செய்தியில் “யூதர்கள்” என்பது பல இடங்களில் யூத மக்கள் அனைவரையும் அல்லாமல், கதைச் சூழலில் யூதேயாவைச் சேர்ந்த யூத அதிகாரிகளையோ இயேசுவை எதிர்த்தவர்களையோ இன்னும் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரையும் யோவானின் நிகழ்வுத் தொடரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: περιεπάτει / περιπατεῖν
  choice: சுற்றி நடந்துகொண்டிருந்தார் / சுற்றி நடக்க
  rationale: முதல் வினையின் தொடர்நிலைப் பொருளையும் ஒரே கிரேக்க வினைச்சொல் இருமுறை வருவதையும் தமிழில் இயன்றவரை பாதுகாக்கிறது; ஒரு பிரதேசத்தில் நடமாடிய பொருளையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: கலிலேயாவில்
  rationale: எல்லையை மிகைப்படுத்தாமல் இடப்பொருளை நேரடியாக வழங்குகிறது.
- source_word: οὐ γὰρ ἤθελεν
  choice: அவர் விரும்பவில்லை; ஏனெனில்
  rationale: ἤθελεν என்பது இயலாமையை அல்ல, விருப்பமின்மையைக் குறிக்கிறது; γάρ தரும் விளக்க உறவு தமிழில் இயல்பான வாக்கிய ஒழுங்கில் வெளிப்படுகிறது.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: யூதேயாவில்
  rationale: புவியியல் பெயரையும் இடப்பொருளையும் நேரடியாகக் கொடுக்கிறது.
- source_word: ἐζήτουν
  choice: தேடிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த பகைமை நோக்கத்தைப் பாதுகாக்கிறது; தொடர்ந்து வரும் infinitive அந்தத் தேடலின் நோக்கத்தைக் குறிப்பிடுகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: மூலத்தின் வழக்கமான நேரடி வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; இச்சூழலில் அது எல்லா யூத மக்களையும் அல்லாமல் யூதேயப் பகுதியைச் சேர்ந்த எதிர்ப்பாளர்களை, குறிப்பாக அதிகாரிகளை, குறிக்கக்கூடும் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀποκτεῖναι
  choice: அவரைக் கொல்ல
  rationale: நோக்க infinitive-ஐ நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “யூதர்கள்” என்று வைத்து, சூழல்சார் வரம்பை அடிக்குறிப்பில் விளக்குதல்
  alternative: “யூதத் தலைவர்கள்” அல்லது “யூதேயர்கள்” என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: மூலச்சொல்லின் பொதுவடிவத்தைப் பாதுகாக்கும் அதேவேளையில், இதை எல்லா யூத மக்கள்மீதும் சுமத்தப்படும் இனக்குழுக் குற்றச்சாட்டாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது. குறிப்பிட்ட எதிர்ப்புக் குழு அல்லது அதிகாரிகள் என்ற சூழல்சார் சாத்தியத்தைத் தீர்மானமாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. περιπατέω என்ற சொல்லின் மறுபயன்பாட்டைக் காட்ட “சுற்றி நட” இருமுறையும் வைக்கப்பட்டுள்ளது; தமிழில் தொடர்ச்சியும் பிரதேசத்துக்குள் நடமாட்டமும் தெளிவாக இருக்க “சுற்றி நடந்துகொண்டிருந்தார்” பயன்படுத்தப்பட்டுள்ளது.
