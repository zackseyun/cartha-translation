  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “ஒரே ஒரு செயலை[a] நான் செய்தேன்; நீங்கள் எல்லாரும் வியப்படைகிறீர்கள்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வேலை.” கிரேக்கச் சொல் இரு பொருள்களையும் தரக்கூடும்; இங்கு “செயல்” என்பது இயேசு செய்த குறிப்பிட்ட செய்கையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது ஓய்வுநாளில் நோயுற்ற ஒருவரை இயேசு குணமாக்கிய நிகழ்வைக் குறிக்கலாம் (யோவான் 5:1–18).
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: மூலத்தில் உள்ள இரு வினைகளையும் காக்கும் அதேவேளையில், நவீனத் தமிழில் இயல்பாக ஒலிக்கும் தொடர்.
- source_word: Ἓν
  choice: ஒரே ஒரு
  rationale: இயேசு செய்த ஒற்றைச் செயலையே வலியுறுத்தும் முன்னிலை எண்ணின் அழுத்தத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔργον
  choice: செயல்
  rationale: இங்கு குறிப்பிட்ட செய்கையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; யோவானில் இயேசுவின் செயல்களைக் குறிக்கும் இச்சொல்லின் தொடர்ச்சியான கருத்தையும் தக்கவைக்கிறது.
- source_word: ἐποίησα
  choice: நான் செய்தேன்
  rationale: எளிய இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: πάντες
  choice: நீங்கள் எல்லாரும்
  rationale: பேசப்படுகிற முழுக் குழுவையும் குறிக்கும் பொருளையும் இரண்டாம் நபர் பன்மையையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: θαυμάζετε
  choice: வியப்படைகிறீர்கள்
  rationale: நிகழ்காலத்தையும், நேர்மறையான பாராட்டு என்று மட்டும் தீர்மானிக்காமல் வியப்பு அல்லது திகைப்பை உள்ளடக்கும் பொருள் நெகிழ்வையும் காக்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் ἔργον என்பதன் கருத்துச் சிறப்பு
  choice: செயல்
  alternative: வேலை / கிரியை
  rationale: ‘செயல்’ என்பது சாதாரண வாசகருக்கு இயல்பாக இருப்பதுடன், இயேசுவின் அர்த்தமிக்க செயல்களைக் குறிக்கும் யோவானிய பயன்பாட்டையும் தாங்குகிறது. ‘கிரியை’ இன்றைய பொதுத் தமிழில் சமயச் சிறப்புச் சொல்லாகவும் பழமையானதாகவும் ஒலிக்கக்கூடும்; ‘வேலை’ இச்சூழலில் தொழில் என்ற பொருளை முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளித்துச் சொன்னார்’ என்பது மூலத்தின் இரட்டை வினை அமைப்பைக் காக்கிறது; ‘ஒரே ஒரு’ என்பது Ἓν என்பதன் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
