revisions:
- from: ஆகவே, காவலர்கள் முதன்மைக் குருமார்களிடமும் பரிசேயர்களிடமும் திரும்பி வந்தார்கள். அவர்கள் இவர்களிடம், “நீங்கள் ஏன் அவனைக் கொண்டுவரவில்லை?” என்று கேட்டார்கள்.
  to: ஆகவே, காவலர்கள் முதன்மைக் குருமார்களிடமும் பரிசேயர்களிடமும் வந்தார்கள். அந்தத் தலைவர்கள் காவலர்களிடம், “நீங்கள் ஏன் அவனைக் கொண்டுவரவில்லை?” என்று கேட்டார்கள்.
  rationale: The revision explicitly identifies the chief priests and Pharisees as the questioners and the officers as those addressed, preserving the marked Greek demonstrative without relying on potentially unclear Tamil pronouns. It also renders Ἦλθον directly as “வந்தார்கள்.”
