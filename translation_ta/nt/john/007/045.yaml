id: JHN.7.45
reference: John 7:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: ta
  text: ஆகவே, காவலர்கள் முதன்மைக் குருமார்களிடமும் பரிசேயர்களிடமும் வந்தார்கள். அந்தத் தலைவர்கள் காவலர்களிடம், “நீங்கள் ஏன் அவனைக் கொண்டுவரவில்லை?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக காவலர்கள் திரும்பி வந்ததைச் சுட்டும் தொடர்ச்சிச் சொல்லின் காரணவிளைவு நயத்தைப் பாதுகாக்கிறது.
- source_word: ὑπηρέται
  choice: காவலர்கள்
  rationale: இங்கு இயேசுவைப் பிடிக்க அனுப்பப்பட்ட அதிகாரிகளைக் குறிக்கிறது; பொதுவான ‘ஊழியர்கள்’ என்பதைவிட சூழலுக்கு ஏற்ற இயல்பான சொல்.
- source_word: ἀρχιερεῖς
  choice: முதன்மைக் குருமார்கள்
  rationale: யூதர்களின் தலைமை ஆசாரிய அதிகாரக் குழுவைக் குறிக்கும் பன்மையைத் தெளிவாகவும் வழக்காகவும் தருகிறது.
- source_word: Φαρισαίους
  choice: பரிசேயர்கள்
  rationale: இந்த யூத சமயக் குழுவின் தமிழில் நிலைபெற்ற பெயர்.
- source_word: Ἦλθον ... πρὸς
  choice: இடமும் ... திரும்பி வந்தார்கள்
  rationale: ἦλθον என்பது ‘வந்தார்கள்’ என்றாலும், அவர்கள் முன்பு அனுப்பப்பட்டிருந்த சூழலில் தமிழில் ‘திரும்பி வந்தார்கள்’ என்பது இலக்கையும் நிகழ்வின் ஓட்டத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκεῖνοι
  choice: அவர்கள்
  rationale: வலியுறுத்தப்பட்ட சுட்டுப்பெயர் முதன்மைக் குருமார்களையும் பரிசேயர்களையும் குறிக்கிறது. அடுத்த ‘இவர்களிடம்’ என்பதுடன் சேர்ந்து இரு குழுக்களையும் இயல்பாக வேறுபடுத்துகிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணம் கேட்கும் கிரேக்க வினாத்தொடரின் இயல்பான தமிழ் இணை.
- source_word: ἠγάγετε
  choice: கொண்டுவரவில்லை
  rationale: வினைச்சொல்லுக்கு ‘வழிநடத்துதல்’ அல்லது ‘கொண்டுவருதல்’ என்ற பொருள் இருக்கலாம்; இயேசுவைப் பிடித்துக் கொண்டுவர அனுப்பப்பட்ட சூழலில் ‘கொண்டுவருதல்’ பொருத்தமானது.
- source_word: αὐτόν
  choice: அவனை
  rationale: இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருளை இயல்பாகத் தருகிறது.
