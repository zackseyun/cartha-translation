translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘அவர்கள்’ என்பது முதன்மைக் குருமார்களையும் பரிசேயர்களையும், ‘இவர்கள்’ என்பது காவலர்களையும் குறிக்குமாறு அண்மைய/தொலைவுச் சுட்டுப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; இதனால் கிரேக்க ἐκεῖνοι-ன் குறிப்பு தெளிவாகிறது.
