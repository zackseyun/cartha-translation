  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: ta
  text: நீங்கள் என்னைத் தேடுவீர்கள்; என்னைக் கண்டடையமாட்டீர்கள்[a]; நான் இருக்கும் இடத்திற்கு உங்களால் வர இயலாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நீங்கள் என்னைத் தேடுவீர்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “நீங்கள் வர முடியாது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσετέ με
  choice: நீங்கள் என்னைத் தேடுவீர்கள்
  rationale: ζητέω என்பதன் தேடுதல் என்ற நேரடியான பொருளையும், இரண்டாம் நபர் பன்மை எதிர்கால வினை வடிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ οὐχ εὑρήσετε
  choice: ஆனால் என்னைக் கண்டடையமாட்டீர்கள்
  rationale: எதிர்மறை எதிர்காலத்தைக் கூடுதல் வலியுறுத்தல் சேர்க்காமல் தருகிறது. எதிர்மறைக் கூறுக்கு முன் வரும் καί, தமிழில் கருத்து மாறுபாட்டை இயல்பாகக் காட்டும் ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: நான் இருக்கும் இடத்திற்கு
  rationale: ὅπου என்பதன் இடப்பொருளையும், வெளிப்படையாக இடம்பெறும் ἐγώ தரும் ‘நான்—நீங்கள்’ என்ற வேறுபாட்டையும் காக்கிறது; மூலத்தில் இல்லாத ‘அங்கே’ என்பதைக் கூட்டவில்லை.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: உங்களால் வர இயலாது
  rationale: δύνασθε அனுமதியின்மையை அல்ல, இயலாமையைக் குறிக்கிறது. ‘உங்களால்’ என்பது வெளிப்படையான பன்மை எழுவாயையும் திறன்/இயலாமை உணர்வையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘நான் இருக்கும் இடத்திற்கு உங்களால் வர இயலாது’ என்பதில் இயலாமையின் தன்மை
  choice: காரணத்தை விளக்காமல் இயலாமை என்றே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீங்கள் அங்கு வரக்கூடாது’ என்று தடையாக அல்லது அனுமதி மறுப்பாக மொழிபெயர்த்தல்.
  rationale: δύνασθε என்பது இயலுதல்/வல்லமை பற்றியது; இந்த வசனம் அந்த இயலாமை அறநெறி சார்ந்ததா, ஆன்மீகமானதா, தீர்ப்பினாலானதா, அல்லது தற்காலிகமானதா என்பதைத் தானாக விளக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘கண்டடைதல்’ மற்றும் ‘இயலாது’ ஆகியவை மூலத்தின் பொருளைத் தெளிவாகவும் சற்றே முறையான வேதாகம நடையிலும் காக்கின்றன.
