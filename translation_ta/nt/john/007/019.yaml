source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: ta
  text: மோசே உங்களுக்குச் சட்டத்தைக் கொடுக்கவில்லையா? ஆனாலும் உங்களில் ஒருவரும் அந்தச் சட்டத்தைக் கடைப்பிடிப்பதில்லை.[a] நீங்கள் ஏன் என்னைக் கொல்ல முயல்கிறீர்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அந்தச் சட்டத்தைச் செய்வதில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: கொடுக்கவில்லையா?
  rationale: οὐ தொடங்கும் கேள்வி ஆம் என்ற பதிலை எதிர்பார்க்கிறது. கிரேக்க இறந்தகால நிறைவு வடிவத்தின் விளைவு தொடர்வதைத் தமிழில் இயல்பாக வெளிப்படுத்த இவ்வினா வடிவம் போதுமானது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபிலும் நவீன பொதுப் பயன்பாட்டிலும் அறியப்பட்ட பெயர் வடிவம்.
- source_word: τὸν νόμον
  choice: மோசேயின் சட்டம் / அந்தச் சட்டம்
  rationale: முதலில் வரும் இடத்தில் மோசே கொடுத்த குறிப்பிட்ட சட்டத் தொகுப்பைத் தெளிவுபடுத்த ‘மோசேயின் சட்டம்’ என்றும், மீண்டும் வரும் இடத்தில் இயல்பான இணைப்புக்காக ‘அந்தச் சட்டம்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: καὶ
  choice: ஆனாலும்
  rationale: இங்கு καί வெறும் இணைப்பை விட, சட்டம் கொடுக்கப்பட்டிருந்தும் அவர்கள் அதைக் கடைப்பிடிக்கவில்லை என்ற முரண்பாட்டைச் சுட்டுகிறது.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: உங்களில் ஒருவரும் ... இல்லை
  rationale: முழுமையான மறுப்பை இயல்பான நவீன தமிழில் வலியுறுத்துகிறது.
- source_word: ποιεῖ τὸν νόμον
  choice: சட்டத்தைக் கடைப்பிடிக்கிறார்
  rationale: சொல்லுக்கு சொல் ‘சட்டத்தைச் செய்கிறார்’ என்பது தமிழில் இயல்பல்ல; சட்டத்தின்படி நடப்பதைக் குறிக்கும் வழக்கமான சமமான சொற்றொடர் இது.
- source_word: τί
  choice: ஏன்
  rationale: நோக்கத்துடன் கூடிய தேடல் வினைக்கு முன் காரணத்தை வினவும் இயல்பான தமிழ் வடிவம்.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: கொல்ல முயல்கிறீர்கள்
  rationale: ζητέω இங்கு ஒருவரைக் கொல்லுவதற்கான செயலில் ஈடுபட்ட நோக்கத்தை குறிக்கிறது; ‘முயல்கிறீர்கள்’ நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
theological_decisions:
- issue: ‘சட்டம்’ என்பதன் குறிப்பு
  choice: மோசே வழியாக இஸ்ரவேலருக்குக் கொடுக்கப்பட்ட மோசேயின் சட்டம்
  alternative: பொதுவான அறநெறிச் சட்டம்
  rationale: மோசே நேரடியாகப் பெயரிடப்படுவதால் νόμος இங்கு பொதுவான சட்டக் கருத்தை அல்ல, மோசேயுடன் தொடர்புடைய தோரா/சட்டத்தைச் சுட்டுகிறது; ‘மோசேயின் சட்டம்’ என மொழிபெயர்ப்பது குறிப்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும் மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கடைப்பிடித்தல்’ என்பது சட்டத்தைக் ‘செய்தல்’ என்ற கிரேக்கச் சொல்லாட்சியின் இயல்பான தமிழ் இணை. வினாக்களின் நேரடியான குற்றச்சாட்டுத் தொனி பாதுகாக்கப்பட்டுள்ளது.
