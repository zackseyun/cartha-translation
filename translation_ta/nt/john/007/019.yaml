  source_fidelity: முதல் வாக்கியத்தில் τὸν νόμον என்பதற்கு ‘மோசேயின் சட்டம்’ என மொழிபெயர்த்திருப்பது மூலத்தில் இல்லாத உடைமைத் தொடர்பை வெளிப்படையாகச் சேர்க்கிறது. மோசே கொடுத்த சட்டமே குறிப்பு என்பது சூழலால் தெளிவாகினும், ‘மோசே உங்களுக்கு மோசேயின் சட்டத்தைக்...’ என்ற வடிவம் தேவையற்ற மறுசொல்லாகவும் உள்ளது. ‘சட்டம்’ எனக் கொடுத்தால் மூலத்தின் குறிப்புத்தன்மையும் காக்கப்படுகிறது.
