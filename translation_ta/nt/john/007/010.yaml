  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: ta
  text: ஆனால், அவருடைய சகோதரர்கள் பண்டிகைக்குச் மேலே சென்றபின், அவரும் அப்போது மேலே சென்றார்; வெளிப்படையாக அல்ல, மறைவாகச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைவில் இருப்பதுபோல்.” கிரேக்கச் சொற்றொடர் சொல்லுக்கு சொல் “மறைவில் இருப்பதுபோல்” என்று அமைகிறது; இது அவர் மறைவாகச் சென்றார் என்ற கூற்றைச் சற்றுத் தகுதிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ஆனால் ... போனபின்
  rationale: ὡς இறந்தகால வினையுடன் காலத்தைக் குறிக்கும் உட்பிரிவை அறிமுகப்படுத்துகிறது; δέ முந்தைய சூழலுடன் மென்மையான மாறுபாட்டைக் காட்டுகிறது. தமிழில் ‘ஆனால் ... போனபின்’ என்பது காலவரிசையையும் மாறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: போனபின் ... போனார்
  rationale: ἀναβαίνω என்பதற்கு நேரடியாக ‘மேலே போ’ என்ற பொருள் இருந்தாலும், இங்கு பண்டிகைக்கான பயணத்தைக் குறிக்கிறது. தமிழில் ‘ஏறிப்போ’ என்பது தவறாக உடல்சார்ந்த ஏற்றத்தை முன்னிறுத்தக்கூடும்; ஆகவே இயல்பான ‘போ’ பயன்படுத்தப்பட்டு, முதல் செயல் முடிந்தபின் இரண்டாவது நடந்தது என்ற வரிசை தெளிவாக்கப்பட்டுள்ளது.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: அவருடைய சகோதரர்கள்
  rationale: உடனடி சூழலில் இயேசுவின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கும் பன்மைச் சொல் என்பதால், பாலினத் துல்லியமுள்ள ‘சகோதரர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἰς τὴν ἑορτήν
  choice: பண்டிகைக்குப்
  rationale: ἑορτή இச்சூழலில் யூதப் பண்டிகையைக் குறிக்கிறது. ‘பண்டிகை’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τότε καὶ αὐτὸς
  choice: அவரும் அப்போது
  rationale: τότε அடுத்த நிகழ்வின் நேரத்தையும் καὶ αὐτός இயேசுவும் அதேபோல் சென்றார் என்ற சேர்க்கை வலியுறுத்தலையும் தருகின்றன.
- source_word: οὐ φανερῶς
  choice: வெளிப்படையாக அல்ல
  rationale: φανερῶς என்பதன் ‘பகிரங்கமாக, வெளிப்படையாக’ என்ற பொருளை நேரடியாகத் தருகிறது; தொடர்ந்து வரும் எதிர்மறை ஒப்பீட்டுடனும் இயல்பாக இணைகிறது.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: இரகசியமாகப் போவது போல
  rationale: ὡς என்பதை விடாமல் ‘போல’ என்று மொழிபெயர்ப்பதால், வெறுமனே ‘இரகசியமாக’ என்று உறுதியாகக் கூறுவதைவிட மூலத்திலுள்ள சிறு தளர்வும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: முன்பு பண்டிகைக்குப் போவதில்லை என்று இயேசு கூறியதற்கும் இங்கு அவர் போனதற்கும் உள்ள தொடர்பு
  choice: அவருடைய சகோதரர்கள் சென்றபின் அவர் வெளிப்படையாக அல்லாமல் சென்றார் என்று மட்டும் உரையை நேரடியாக மொழிபெயர்த்தல்
  alternative: அவர் மனதை மாற்றிக்கொண்டார் என்றோ, முந்தைய கூற்றுடன் வெளிப்படையாக ஒத்திசையும் வகையிலோ விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை நிகழ்வை மட்டும் விவரிக்கிறது; தோன்றும் பதற்றத்திற்கான விளக்கத்தை வழங்கவில்லை. ஆகவே மொழிபெயர்ப்பு எந்தக் கோட்பாட்டுச் சமரசத்தையும் சேர்க்காமல் அந்தப் பதற்றத்தை அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அங்கே’ என்பது ஒரே வாக்கியத்தில் ‘பண்டிகைக்குப் போனார்’ என்பதைக் கனமாக மீண்டும் கூறுவதைத் தவிர்க்கிறது; சூழலிலுள்ள பண்டிகை இடத்தையே சுட்டுகிறது. ‘இரகசியமாகப் போவது போல’ என்பது சற்றே வழக்கத்திற்கு மாறானதாக இருந்தாலும், மூலத்தின் ὡς தரும் உண்மையான நுணுக்கத்தைப் பாதுகாக்கிறது.
