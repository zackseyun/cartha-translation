reference: John 7:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: ta
  text: “மேசியா[a] தாவீதின் சந்ததியிலிருந்தும், தாவீது இருந்த பெத்லகேம் என்னும் கிராமத்திலிருந்தும் வருகிறார் என்று வேதம் சொல்லவில்லையா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டப்பெயர் ὁ χριστός.
    reason: மூல கிரேக்கப் பட்டப்பெயருக்கான மரபுவழி மாற்று மொழிபெயர்ப்பைத் தருகிறது.
lexical_decisions:
- source_word: ἡ γραφή
  choice: வேதம்
  rationale: யோவான் எழுதிய நூலில் இது அதிகாரமுள்ள பரிசுத்த எழுத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘வேதம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: εἶπεν
  choice: சொல்லவில்லையா
  rationale: இது எதிர்மறை வடிவிலான வினாவாக இருப்பதால், வேதத்தின் நிலையான சாட்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: தாவீதின் சந்ததியிலிருந்தும்
  rationale: σπέρμα இங்கே நேரடியான ‘விதை’ என்பதைக் குறிக்காமல் வம்சவழிச் சந்ததியைக் குறிக்கிறது; ‘சந்ததி’ அந்தப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ἀπὸ Βηθλέεμ
  choice: பெத்லகேம் ... கிராமத்திலிருந்தும்
  rationale: ἀπό தோற்ற இடத்தைக் குறிக்கிறது; ‘இலிருந்து’ என்பது இயல்பான தமிழ் இணை.
- source_word: τῆς κώμης
  choice: என்னும் கிராமம்
  rationale: κώμη ஒரு சிறிய குடியிருப்பு அல்லது கிராமத்தைக் குறிக்கிறது; ‘கிராமம்’ சொற்பொருளுக்கு நெருக்கமானது.
- source_word: ὅπου ἦν Δαυίδ
  choice: தாவீது இருந்த
  rationale: மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது; ‘வாழ்ந்த’ அல்லது ‘பிறந்த’ என்று கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: மேசியாவைக் குறிக்கும் மரியாதை ஒருமையுடன், பொதுவான வேதவாக்கிய நிகழ்காலத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இச்சூழலில் இது யூதர்கள் எதிர்பார்த்த அரசரான மீட்பரைக் குறிக்கும் பட்டப்பெயர்; பெயரைப் போல ஒலிபெயர்ப்பதைவிட அதன் பட்டப்பொருளை மொழிபெயர்ப்பது தெளிவானது.
theological_decisions:
- issue: ὁ χριστός என்னும் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவின் பெயருடன் இணைந்த பெயர்போன்ற பயன்பாடு அல்ல; விவாதிக்கப்படும் யூத மேசியப் பட்டப்பெயர். ஆகவே ‘மேசியா’ என்பது சூழலையும் பட்டப்பொருளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. மூலத்தில் உள்ள எதிர்மறை வினா வடிவமும் ‘தாவீது இருந்த’ என்ற விளக்கப்படாத சொற்றொடரும் பாதுகாக்கப்பட்டுள்ளன.
