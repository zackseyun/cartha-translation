  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: ta
  text: எனவே யூதர்கள்[a] வியந்து, “இவர் கற்றுக்கொள்ளாதிருந்தும் எழுத்துகளை எப்படி அறிந்திருக்கிறார்?[b]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “யூதர்கள்” என்பது எல்லா யூத மக்களையும் பொதுவாகக் குறிக்கவில்லை; எருசலேமில் இயேசுவோடு உரையாடிய அல்லது அவரை எதிர்த்த யூதர்களை—அவர்களில் யூதேயத் தலைவர்களும் இருந்திருக்கலாம்—சூழல் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: “எழுத்துகளை அறிந்திருக்கிறார்” என்பது இங்கு வெறும் எழுத்தறிவை மட்டும் அல்லாமல், நூலறிவு அல்லது கல்விப் புலமையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: வியந்து
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்நிலை உணர்வைத் தமிழ் வாக்கிய ஓட்டத்தில் இயல்பாக வெளிப்படுத்துகிறது; அவர்களுடைய ஆச்சரியத்தையும் காக்கிறது.
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதைத் தொடர்பை இயல்பான நவீனத் தமிழில் குறிக்கிறது; இங்கு கடுமையான காரணவிளைவைக் காட்டும் ‘ஆகவே’ தேவையில்லை.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் நேரடியான இன-சமயக் குறிப்பை முதன்மை உரையில் காக்கிறது; சூழலுக்குரிய வரம்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: நேரடிக் கேள்வியை அறிமுகப்படுத்தும் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் முழு வினையாக வழங்குகிறது.
- source_word: Πῶς
  choice: எப்படி
  rationale: அறிவு வந்த விதத்தைப் பற்றிய நேரடியான கேள்வியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὗτος
  choice: இவருக்கு
  rationale: ‘இந்த மனிதன்’ என்பதைக் காட்டிலும் தமிழில் இயல்பான குறிப்பு; இகழ்ச்சியுணர்வை தேவையின்றி சேர்க்காமல் சுட்டுப்பொருளைக் காக்கிறது.
- source_word: γράμματα οἶδεν
  choice: இவ்வளவு கல்வியறிவு எப்படி வந்தது
  rationale: ‘எழுத்துகளை அறிந்திருக்கிறார்’ என்ற நேரடி கிரேக்க மரபுத்தொடர் இங்கு எழுத்தறிவை மட்டும் அல்ல, நூல்/வேதக் கல்விப் புலமையைக் குறிக்கிறது. தமிழ் வாசகருக்கு நோக்கமான பொருளை இயல்பாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ μεμαθηκώς
  choice: முறையாகக் கற்றுக்கொள்ளாத
  rationale: அங்கீகரிக்கப்பட்ட ஆசிரியரிடமோ கல்விமுறையிலோ பயிலாத நிலையை, குறிப்பிட்ட ரபீனிய நிறுவனத்தை உரையில் சேர்க்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: மூலத்தின் பரந்த சொல்வடிவத்தை முதன்மை உரையில் காக்கிறது. அதேவேளை இது எல்லா யூத மக்களையும் குறிக்கும் பொதுப்படுத்தல் அல்ல என்பதை அடிக்குறிப்பு சூழலடிப்படையில் விளக்குகிறது.
- issue: γράμματα என்பதன் பொருள்
  choice: கல்வியறிவு
  alternative: எழுத்துகள் / வேதநூல்கள்
  rationale: இச்சூழலில் கேள்வி இயேசுவின் வெறும் எழுத்தறிவைப் பற்றி அல்ல, முறையான பயிற்சி இல்லாமலேயே அவர் வெளிப்படுத்திய நூல் அல்லது வேதக் கல்விப் புலமையைப் பற்றியது. எந்த ஓர் குறிப்பிட்ட கல்வி அமைப்பையும் உரைத் தீர்மானமாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்க மரபுத்தொடரை சொற்சொல்லாகச் சுமத்தாமல் அதன் சூழல்பொருள் உரையில் வழங்கப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
