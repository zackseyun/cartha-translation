    issue: The footnote calls ἐπίστευον an ‘இறந்தகால இடைநிலை வினை.’
    rationale: ἐπίστευον is an imperfect indicative form. The issue being noted is its imperfective past aspect, not a ‘middle/intermediate’ verbal category. The terminology should be corrected for linguistic accuracy.
  - severity: low
    issue: The footnote’s alternative, ‘நம்பிக்கை வைத்துக்கொண்டிருக்கவில்லை,’ is not especially natural Tamil.
    rationale: A more idiomatic alternative can indicate an ongoing or characteristic state of non-belief while the explanatory note preserves the Greek imperfect’s ambiguity.
