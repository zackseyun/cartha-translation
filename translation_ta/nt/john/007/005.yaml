  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: ta
  text: ஏனெனில், அவருடைய சகோதரர்கள்கூட அவர்மீது நம்பிக்கை வைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய சகோதரர்கள்கூட அவர்மீது நம்பிக்கை கொண்டிருக்கவில்லை.” கிரேக்க மொழியில் உள்ள இறந்தகாலத் தொடர்நிலை வினை, எளிய கடந்தகாலச் செயலையோ அப்போது தொடர்ந்துகொண்டிருந்த அல்லது வழக்கமான நிலையையோ குறிக்கலாம்.
    reason: ἐπίστευον என்ற கிரேக்க இறந்தகாலத் தொடர்நிலை வினையின் கால-நிலை நுணுக்கத்தைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οὐδὲ
  choice: கூட ... இல்லை
  rationale: இங்கு οὐδὲ வெறும் இணைப்பைக் காட்டாமல், எதிர்பாராதவர்களையும் உள்ளடக்கும் வலியுறுத்தலைத் தருகிறது; தமிழில் ‘சகோதரர்கள்கூட ... இல்லை’ என்பது இயல்பாக அந்த அழுத்தத்தை வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய உரைக்கு இந்த வாக்கியம் காரணவிளக்கம் தருவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: அவருடைய சகோதரர்கள்
  rationale: இச்சூழலில் ஆண்பால் பன்மையான ἀδελφοί இயேசுவின் சகோதரர்களைக் குறிக்கிறது; பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலத்தின் வடிவத்தையும் கதைச்சூழலையும் காக்கிறது.
- source_word: ἐπίστευον
  choice: நம்பிக்கை வைக்கவில்லை
  rationale: πιστεύω என்பதன் தனிப்பட்ட நம்பிக்கை/சார்ந்திருத்தல் சார்ந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது. இறந்தகால இடைநிலை வினையின் தொடர்நிலை நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς αὐτόν
  choice: அவர்மீது
  rationale: πιστεύω உடன் வரும் εἰς, ஒருவரை நோக்கிய தனிப்பட்ட நம்பிக்கையைக் குறிக்கிறது; ‘அவர்மீது நம்பிக்கை வைப்பது’ என்பது தமிழில் தெளிவான இயல்பான இணைச்சொல்.
theological_decisions:
- issue: யோவான் பயன்பாட்டில் πιστεύω εἰς αὐτόν என்பதன் பொருள்
  choice: இயேசுவின்மீது தனிப்பட்ட நம்பிக்கை வைத்தல்
  alternative: அவரை நம்புதல் / அவர்மீது விசுவாசம் வைத்தல்
  rationale: இந்தச் சொற்றொடர் இயேசுவை நோக்கிய நம்பிக்கையைக் குறிக்கிறது. அவர்களுடைய நம்பிக்கையின்மைக்கான காரணத்தையோ அதன் முழு இறையியல் விளைவுகளையோ வசனம் கூறாததால், மொழிபெயர்ப்பும் அவற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிதில் புரியும், கண்ணியமான நடை. ‘விசுவாசம்’ என்பதற்குப் பதிலாகப் பொதுவாகப் புரியும் ‘நம்பிக்கை’ பயன்படுத்தப்பட்டுள்ளது; ‘அவர்மீது’ என்பது εἰς αὐτόν என்பதின் திசைநோக்கிய தனிப்பட்ட நம்பிக்கையை இயல்பாக வெளிப்படுத்துகிறது.
