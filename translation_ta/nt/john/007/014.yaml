  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: ta
  text: பண்டிகை ஏற்கெனவே பாதி முடிந்திருந்தபோது[a], இயேசு ஆலய வளாகத்திற்குச் சென்று[b] போதித்துக்கொண்டிருந்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பண்டிகையின் நடுப்பகுதி வந்திருந்தபோது.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “ஆலய வளாகம்” என்பது முற்றங்கள் உட்பட ஆலயப் பகுதியைக் குறிக்கிறது; ஆலயத்தின் அகப் பரிசுத்த அறையை மட்டும் குறிக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: கிரேக்க வினைச்சொல் அப்போது தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கலாம்; அல்லது, “போதித்தார்.”
    reason: lexical_alternative
