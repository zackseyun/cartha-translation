- source_word: τῆς ἑορτῆς μεσούσης
  choice: பண்டிகை பாதி முடிந்திருந்தபோது
  rationale: மூலத்தின் genitive absolute அமைப்பை காலத் துணைவாக்கியமாகத் தருகிறது; μεσόω குறிக்கும் நடுப்பகுதி அல்லது பாதிநிலையை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀνέβη
  choice: சென்று
  rationale: எருசலேம் அல்லது ஆலயத்தை நோக்கிச் செல்வதில் உள்ள உயர்நோக்கிய இயக்கம் சூழலில் புரிந்துகொள்ளப்படுகிறது; தமிழில் ‘மேலேறினார்’ என்பது இவ்விடத்தில் தேவையற்ற உடல் ஏற்றத்தை முன்னிறுத்தக்கூடும் என்பதால் இயல்பான ‘சென்று’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: εἰς τὸ ἱερὸν
  choice: ஆலய வளாகத்திற்குச் சென்று
  rationale: ἱερόν என்பது அகப் பரிசுத்த அறையை மட்டும் அல்லாமல் ஆலயத்தின் மொத்த வளாகத்தையும் முற்றங்களையும் குறிக்கிறது; ‘ஆலய வளாகம்’ அந்த வேறுபாட்டை முதன்மை உரையிலேயே தெளிவாக்குகிறது.
- source_word: ἐδίδασκεν
  choice: போதித்துக்கொண்டிருந்தார்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான செயற்பாட்டை, தொடங்கினார் என்ற மூலத்தில் இல்லாத நுணுக்கத்தைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἱερόν என்பதன் குறிப்பு
  choice: ஆலய வளாகம்
  alternative: ஆலயம்
  rationale: இச்சொல் ஆலயத்தின் உட்பரிசுத்த அறையைச் சிறப்பாகக் குறிக்கும் ναός அல்ல; முற்றங்கள் உட்பட விரிந்த ஆலயப் பகுதியைக் குறிக்கிறது. இது காட்சியின் இடத்தைத் தெளிவுபடுத்தும் சொற்பொருள்-பண்பாட்டு வேறுபாடு.
- issue: ἐδίδασκεν என்பதன் காலநிலை
  choice: போதித்துக்கொண்டிருந்தார்
  alternative: போதித்தார்
  rationale: தொடர்ந்து நடைபெற்ற செயலைக் காட்டும் imperfect நுணுக்கம் பாதுகாக்கப்படுகிறது; ‘போதிக்கத் தொடங்கினார்’ என்று வெளிப்படையாக இல்லாத தொடக்க நுணுக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘ஆலய வளாகம்’ பண்பாட்டு துல்லியத்தையும் ‘போதித்துக்கொண்டிருந்தார்’ மூலத்தின் தொடர்ச்சியான வினைநிலையையும் காக்கின்றன.
