source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: ta
  text: தன்னிடமிருந்தே பேசுகிறவன் தனக்குரிய மகிமையைத் தேடுகிறான்[a]. ஆனால் தன்னை அனுப்பினவருடைய மகிமையைத் தேடுகிறவரே உண்மையானவர்[b]; அவரில் அநீதி இல்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தானாகவே” அல்லது “தன் சொந்த அதிகாரத்தின்படி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உண்மையுள்ளவர்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அநியாயம்” அல்லது “தவறு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: தன்னிடமிருந்தே
  rationale: ‘தன்னிடமிருந்து’ என்ற மூல உருவகத்தையும், அனுப்பினவரிடமிருந்து பெற்ற செய்திக்கு எதிரான யோவானின் கருத்து வேறுபாட்டையும் காக்கிறது; ‘தன் அதிகாரத்தினாலே’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: λαλῶν
  choice: பேசுகிறவன்
  rationale: பெயர்ச்சொல் பணியில் வரும் நிகழ்காலப் பங்கேற்பு வினையை, பொதுவான பண்பைக் குறிக்கும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δόξαν τὴν ἰδίαν
  choice: தனக்குரிய மகிமையை
  rationale: ἴδιος குறிக்கும் சொந்தத்தன்மையைக் காத்து, δόξα என்பதன் யோவானிய இறையியல் ஒலியையும் ‘மகிமை’ தக்கவைக்கிறது.
- source_word: ζητεῖ
  choice: தேடுகிறான் / தேடுகிறவர்
  rationale: இரு பகுதிகளிலும் மீண்டும் வரும் ζητέω வினையின் இணை அமைப்பை ‘தேடு’ என்பதன் மூலம் காக்கிறது; மரியாதை விகுதி இரண்டாம் குறிப்பின் சூழலுக்கேற்ப பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: தன்னை அனுப்பினவருடைய
  rationale: அனுப்பியவரின் தனிப்பட்ட செயலையும், அனுப்பப்பட்டவருடனான உறவையும் சுருக்காமல் வெளிப்படுத்துகிறது.
- source_word: οὗτος
  choice: உண்மையானவர்
  rationale: தமிழில் தனியே ‘இவரே’ என்று சேர்ப்பது வாக்கியத்தைச் சற்றுக் கனமாக்கும்; எழுவாய்–பயனிலை அமைப்பும் மரியாதை ஒருமையும் கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பாகச் சுமக்கின்றன.
- source_word: ἀληθής
  choice: உண்மையானவர்
  rationale: ‘உண்மை பேசுகிறவர்’ என்பதைக் காட்டிலும் பரந்த நம்பகத்தன்மை மற்றும் நேர்மையைப் பாதுகாக்கிறது; ‘உண்மையுள்ளவர்’ என்பதும் சாத்தியம்.
- source_word: ἀδικία
  choice: அநீதி
  rationale: நீதி இன்மை, தவறு, அநியாயம் ஆகியவற்றை உள்ளடக்கக்கூடிய ἀδικία என்பதன் நெறி சார்ந்த பரப்பைச் சுருக்காமல் தருகிறது.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: அவரிடம் ... இல்லை
  rationale: உள்ளார்ந்த நெறிப் பண்பைப் பற்றிய கிரேக்க இருப்புக் கட்டமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தன்னிடமிருந்தே பேசுதல்’ மற்றும் அனுப்பினவரின் மகிமையைத் தேடுதல் ஆகியவற்றின் முரண்
  choice: சுயத்திலிருந்து வரும், சுயமகிமையை நாடும் பேச்சையும் அனுப்பினவரின் மகிமையை நாடும் நிலைப்பாட்டையும் எதிரெதிராக வைத்தல்
  alternative: ‘தன் சொந்த அதிகாரத்தில் பேசுதல்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: உடனடிச் சூழல் போதனையின் மூலத்தையும் நோக்கத்தையும் பற்றியது. ‘தன்னிடமிருந்தே’ என்பது உண்மையான மூலமொழி உருவகத்தையும் அதன் கருத்துத் திறப்பையும் காக்கிறது; பின்னைய கோட்பாட்டுக் கூறுகளைச் சேர்க்கவில்லை.
- issue: ἀληθής என்பதன் பரப்பு
  choice: உண்மையானவர்
  alternative: உண்மையுள்ளவர் / உண்மை பேசுகிறவர்
  rationale: இந்தச் சொல் பேச்சின் வாய்மையை மட்டும் அல்லாமல் நபரின் நம்பகத்தன்மை மற்றும் நேர்மையையும் குறிக்கக்கூடும்; பரந்த பொருளைத் திறந்துவைக்கிறது.
- issue: ἀδικία என்பதன் பொருள்
  choice: அநீதி
  alternative: அநியாயம் / தவறு
  rationale: சமூக அநியாயம் அல்லது தனித்த தவறான செயல் என்று மட்டும் குறுக்காமல், நெறி மற்றும் நீதிசார் குறை முழுவதையும் சுட்டும் வகையில் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாய் இருந்தும் வேதாகம உரைக்குரிய கண்ணியத்தைத் தக்கவைக்கும் நடை. முதல் பொதுக் குறிப்புக்கு ‘பேசுகிறவன்’, சூழலில் இயேசுவைக் குறிக்கும் இரண்டாம் குறிப்புக்கு ‘தேடுகிறவர்/உண்மையானவர்/அவரிடம்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
