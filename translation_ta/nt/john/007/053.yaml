translation:
  language: ta
  text: மேலும்[a] ஒவ்வொருவரும் தம் வீட்டிற்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் தொடக்கமாகும் (யோவான் 7:53–8:11). இந்த முழுப் பகுதியும் மூன்றாம் நூற்றாண்டுப் பபைரஸ் கையெழுத்துப் பிரதிகள் மற்றும் நான்காம் நூற்றாண்டின் சினாய்ட்டிக்கஸ், வத்திக்கானஸ் ஆகியவை உட்பட மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளிலும், ஆரம்பகால காப்டிக் மற்றும் சிரியாக் மொழிபெயர்ப்புகளிலும் இல்லை. ஆனால் இது ஐந்தாம் நூற்றாண்டின் கோடெக்ஸ் பெசே, இலத்தீன் மரபு, பிற்கால பைசாந்தியப் பெரும்பான்மை மரபு ஆகியவற்றில் உள்ளது. சில கையெழுத்துப் பிரதிகளில் இந்த நிகழ்ச்சி யோவான் 21:25-க்குப் பின்னரோ, லூக்கா 21:38-க்குப் பின்னரோ போன்ற வேறு இடங்களில் காணப்படுகிறது. இவ்வாறான இடமாற்றங்கள், இக்கதை முதலில் தனித்த மரபாக இருந்து பின்னர் உரைப்பிரதி மரபில் சேர்க்கப்பட்டிருக்கலாம் என்ற கருத்துக்கு முக்கியமான சான்றாகக் கருதப்படுகின்றன. கிறிஸ்தவ வாசிப்பிலும் மேய்ப்புப்பணியிலும் சுமார் 1,500 ஆண்டுகளாக இப்பகுதி விரும்பிப் போற்றப்பட்டு வந்திருப்பதால், இது இங்கே சேர்க்கப்பட்டுள்ளது.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: பின்பு
  rationale: இங்கு கதைத் தொடரில் அடுத்த நிகழ்வை இணைக்கிறது; இயல்பான தமிழில் ‘பின்பு’ பொருத்தமாக உள்ளது.
- source_word: ἐπορεύθη
  choice: சென்றார்கள்
  rationale: கூடியிருந்தவர்கள் கலைந்து தத்தம் வீட்டுக்குச் செல்வதைச் சூழல் குறிக்கிறது. கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும், ‘ஒவ்வொருவரும்’ என்பதுடன் மரியாதை/பொதுப் பன்மை வினை நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: குழுவிலுள்ள ஆட்கள் தனித்தனியாகச் சென்றதை வலியுறுத்தும் இயல்பான தமிழ் இணை.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: தமது வீட்டிற்கு
  rationale: இச்சொற்றொடர் வெறும் கட்டிடத்தைவிட ஒருவர் தம் வீட்டுக்குத் திரும்பிச் செல்வதைக் குறிக்கும் வழக்குச் சொற்றொடர்; ‘தமது’ என்பது எழுவாயைக் குறிக்கும் இயல்பான தற்சுட்டுப் பெயர்.
theological_decisions:
- issue: யோவான் 7:53–8:11 பகுதியின் மூலபாட நிலை
  choice: பெற்றுள்ள பைசாந்திய மூலபாடத்தின்படி வசனத்தை முதன்மைப் பனுவலில் வைத்துக் கொண்டு, அதன் முக்கியமான கையெழுத்துப் பிரதி வேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: இப்பகுதியை முதன்மைப் பனுவலிலிருந்து நீக்குதல் அல்லது அடைப்புக்குறிக்குள் மட்டும் தருதல்
  rationale: இந்த வசனம் Robinson–Pierpont பைசாந்திய பதிப்பில் உள்ளது; அதேவேளை முழுப் பகுதியும் மிகப் பழமையான சாட்சிகளில் இல்லாதது வாசகர்கள் அறிய வேண்டிய முக்கிய மூலபாடத் தகவல். அடிக்குறிப்பு சாட்சிகளின் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘ஒவ்வொருவரும் தமது வீட்டிற்குச் சென்றார்கள்’ என்பது கிரேக்கத்தின் தனிநபர் வலியுறுத்தலையும் தமிழ் இயல்பையும் ஒருங்கிணைக்கிறது.
