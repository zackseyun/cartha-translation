source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: ta
  text: ஆனாலும், யூதர்களுக்குப் பயந்து, யாரும் அவரைக் குறித்து வெளிப்படையாகப் பேசவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சூழலில் குறிப்பாக, “யூதத் தலைவர்கள்” அல்லது “யூதேய அதிகாரிகள்” என்றும் பொருள் கொள்ளலாம். யோவான் நற்செய்தியில் “யூதர்கள்” என்பது சில இடங்களில் யூத மக்களைப் பொதுவாகவும், வேறு சில இடங்களில் இயேசுவை எதிர்த்த எருசலேமை மையமாகக் கொண்ட அதிகாரிகளையும் குறிக்கலாம்.
    reason: மூலச்சொல்லின் குறிப்புத் தெளிவின்மையையும் இச்சூழலுக்குரிய சாத்தியமான குறுகிய பொருளையும் வெளிப்படுத்துதல்.
lexical_decisions:
- source_word: οὐδεὶς
  choice: ஒருவரும் ... இல்லை
  rationale: மறுப்புடன் சேர்ந்து, அங்கிருந்தவர்களில் எவரும் விதிவிலக்கல்ல என்ற முழுமையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: μέντοι
  choice: ஆனாலும்
  rationale: முந்தைய வசனத்தில் இயேசுவைக் குறித்த மாறுபட்ட பேச்சுகள் இருந்தபோதிலும் அவை வெளிப்படையாகச் சொல்லப்படவில்லை என்ற மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: மறைவின்றி, பொதுவில் பேசுதல் என்ற சூழல்சார் பொருளைத் தருகிறது; துணிவுடன் அல்லது தைரியமாக என்று மட்டும் குறுக்கவில்லை.
- source_word: ἐλάλει
  choice: பேசிக்கொண்டிருக்கவில்லை
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது அச்சூழலில் நடந்துகொண்டிருந்த செயல் அம்சத்தைப் பாதுகாக்கிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைக் குறித்து
  rationale: περί + genitive என்பதன் பொருளை dignified, இயல்பான நவீன தமிழில் தருகிறது.
- source_word: διὰ τὸν φόβον
  choice: பயந்து
  rationale: காரணத்தைக் காட்டும் διά + accusative கட்டமைப்பை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது; அச்சத்தினால் என்பதும் சாத்தியம்.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களுக்கு
  rationale: கிரேக்கச் சொல்லின் நேரடியான பரந்த வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது; யோவானின் இச்சூழலில் அதிகாரமுள்ள யூதத் தலைவர்களைக் குறிப்பதாக இருக்கக்கூடிய நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் τῶν Ἰουδαίων என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “யூதர்கள்” என்பதைத் தக்கவைத்து, சூழல்சார் குறுகிய பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: யூதத் தலைவர்கள்; யூதேய அதிகாரிகள்
  rationale: மூலத்தின் சொற்பரப்பையும் உண்மையான குறிப்புத் தெளிவின்மையையும் பாதுகாக்கிறது. அதேவேளை, இது எல்லா யூத மக்களையும் பொதுப்படுத்த வேண்டிய இடமல்ல என்றும், எருசலேமை மையமாகக் கொண்ட எதிர்ப்பாளரான அதிகாரிகளைச் சுட்டக்கூடும் என்றும் அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. “பேசிக்கொண்டிருக்கவில்லை” என்பது imperfect அம்சத்தை வெளிப்படுத்துகிறது. “யூதர்கள்” என்ற நேரடி மொழிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டாலும், வரலாற்றுப் பொருளைத் தவறாகப் பொதுப்படுத்தாமல் இருக்க அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
