revisions:
- from: ஆகவே, இயேசு ஆலயத்தில் கற்பித்துக்கொண்டிருக்கும்போது உரத்த குரலில், “என்னை உங்களுக்குத் தெரியும்; நான் எங்கிருந்து வந்தவன் என்பதும் உங்களுக்குத் தெரியும்.[a] நான் என் சொந்தமாக வந்தவனல்ல.[b] என்னை அனுப்பியவர் உண்மையானவர்;[c] அவரை உங்களுக்குத் தெரியாது” என்றார்.
  to: 'ஆகவே இயேசு ஆலயத்தில் கற்பித்துக்கொண்டே உரக்கக் கூறினார்: “என்னை உங்களுக்குத் தெரியும்; நான் எங்கிருந்து வந்தவன் என்பதும் உங்களுக்குத் தெரியும்.[a] நான் என் சொந்த விருப்பத்தின்படி வந்தவன் அல்ல.[b] என்னை அனுப்பியவர் மெய்யானவர்;[c] அவரை உங்களுக்குத் தெரியாது.”'
  rationale: The revision retains the source’s declarative ambiguity and rhetorical repetition without adding an explicit ironic tone, heavenly origin, or an identification of the sender. It improves the Johannine semantic range of ἀληθινός and more directly represents Jesus’ loud utterance while teaching. Footnote anchors remain attached to the relevant clauses and all three notes remain structurally valid.
