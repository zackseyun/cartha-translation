reference: John 7:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: ta
  text: 'ஆகவே இயேசு ஆலயத்தில் கற்பித்துக்கொண்டே உரக்கக் கூறினார்: “என்னை உங்களுக்குத் தெரியும்; நான் எங்கிருந்து வந்தவன் என்பதும் உங்களுக்குத் தெரியும்.[a] நான் என் சொந்த விருப்பத்தின்படி வந்தவன் அல்ல.[b] என்னை அனுப்பியவர் மெய்யானவர்;[c] அவரை உங்களுக்குத் தெரியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கூற்று சூழலில் நையாண்டியாகவோ சவாலாகவோ கேட்கலாம்; ஆனால் கிரேக்கத்தில் இது வினாவாக அல்ல, அறிவிப்பாக அமைந்துள்ளது.
    reason: alternative_reading
  - marker: b
    text: “என் சொந்த விருப்பத்தின்படி” என்பதை “என்னாலே” அல்லது “என் சொந்த முன்முயற்சியால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மெய்யானவர்” என்பதற்கு “உண்மையானவர்,” “நிஜமானவர்,” அல்லது சூழலுக்கு ஏற்ப “உண்மையுள்ளவர்” என்ற பொருள் நிழல்களும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: உரத்த குரலில்
  rationale: துயரத்தால் அழுதார் என்ற பொருளை ஏற்படுத்தாமல், ஆலயத்தில் பொதுவாக உரக்கப் பேசியதன் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையும் குறிக்கலாம்; ‘ஆலயத்தில்’ என்பது இயல்பாகவும் போதுமான பரப்புடனும் உள்ளது.
- source_word: διδάσκων ... καὶ λέγων
  choice: கற்பித்துக்கொண்டிருக்கும்போது ... என்றார்
  rationale: கற்பித்தல் நடைபெற்றுக்கொண்டிருந்த சூழலையும் அதைத் தொடர்ந்து வந்த உரையையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Κἀμὲ οἴδατε
  choice: என்னை உங்களுக்குத் தெரியும்
  rationale: Κἀμέ தரும் ‘என்னையும்/என்னை’ என்ற வலியுறுத்தலைத் தமிழ் சொல்வரிசை வெளிப்படுத்துகிறது; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: οἴδατε ... οἴδατε
  choice: தெரியும் ... தெரியும்
  rationale: யோவானின் நடையில் முக்கியமான மறுபடியும் சொல்லுதலைத் தக்கவைத்து, கூற்றின் சவாலான அல்லது நையாண்டியான தொனியைச் சூழலே உணரச் செய்கிறது.
- source_word: πόθεν εἰμί
  choice: நான் எங்கிருந்து வந்தவன்
  rationale: இது புவியியல் பிறப்பிடத்தையோ ஆழ்ந்த தெய்வீகத் தோற்றத்தையோ தனியாகத் தீர்மானிக்காமல், மூலத்தின் அடுக்கான பொருளைத் திறந்தே வைக்கிறது.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: என் சொந்தமாக
  rationale: இயேசு தம்முடைய சொந்த முன்முயற்சியின்படி வரவில்லை என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது; ‘என்னிடமிருந்து’ என்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: οὐκ ἐλήλυθα
  choice: வந்தவனல்ல
  rationale: வருகையின் தற்போதைய விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது; சொற்சொல்லான காலவடிவத்தை வற்புறுத்தாமல் நிறைவுற்ற வருகையைப் பாதுகாக்கிறது.
- source_word: ἀληθινὸς
  choice: உண்மையானவர்
  rationale: ‘உண்மையுள்ளவர்’, ‘மெய்யானவர்’, ‘நிஜமானவர்’ ஆகிய நிழற்பொருள்களைத் திறந்தே வைத்துக்கொண்டு, யோவானின் பயன்பாட்டுக்கு ஏற்ற கண்ணியமான பொதுத் தமிழை வழங்குகிறது.
- source_word: ὁ πέμψας με
  choice: என்னை அனுப்பியவர்
  rationale: அனுப்பியவரின் தனிப்பட்ட செயல்திறனைத் தக்கவைக்கிறது; மூலத்தில் இங்கு இல்லாத ‘தந்தை’ என்ற அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: அவரை உங்களுக்குத் தெரியாது
  rationale: நேரடியான குற்றச்சாட்டையும், ஒருவரை அறிதல் என்ற தனிப்பட்ட உறவுசார் கருத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘என்னை உங்களுக்குத் தெரியும்; நான் எங்கிருந்து வந்தவன் என்பதும் உங்களுக்குத் தெரியும்’ என்பது நேரடியான கூற்றா, நையாண்டியா, அல்லது கேள்வியா?
  choice: மூலத்தின் இலக்கண வடிவத்திற்கு ஏற்ப பிரதான உரையில் நேரடியான அறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என்னை உங்களுக்குத் தெரியுமா? நான் எங்கிருந்து வந்தவன் என்பதும் உங்களுக்குத் தெரியுமா?’ என்ற வினாவாகவோ, வெளிப்படையான நையாண்டியாகவோ மொழிபெயர்த்தல்.
  rationale: கிரேக்க வடிவம் அறிவிப்பு வாக்கியம்; சூழல் நையாண்டி அல்லது சவாலை உணர்த்தக்கூடும். அந்தத் தொனியை மொழிபெயர்ப்பில் தீர்மானித்து விடாமல் அடிக்குறிப்பில் குறிப்பிடுவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ‘எங்கிருந்து வந்தவன்’ மற்றும் ‘என் சொந்தமாக வந்தவனல்ல’ என்பதில் இயேசுவின் தோற்றத்தின் பொருள்
  choice: மனிதர்களுக்குத் தெரிந்த வெளிப்புறத் தோற்றத்தையும் தெய்வீக அனுப்புதலையும் உள்ளடக்கக்கூடிய அகலத்துடன் வைக்கப்பட்டது.
  alternative: இதை வெறும் புவியியல் பிறப்பிடமாக மட்டுப்படுத்துதல் அல்லது ‘வானத்திலிருந்து’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: யோவான் இயேசுவின் தோற்றத்தைப் பல அடுக்குகளில் பேசுகிறார். இவ்வாக்கியத்தில் மூலமொழி வெளிப்படையாகச் சொல்லாத ஒன்றைச் சேர்க்காமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ‘என்னை அனுப்பியவர்’ என்பவரின் அடையாளம்
  choice: ‘என்னை அனுப்பியவர்’ என்ற உறவுசார் விளக்கம் அப்படியே வைக்கப்பட்டது.
  alternative: ‘என்னை அனுப்பிய பிதா’ என்று பெயரிட்டு விளக்குதல்.
  rationale: யோவானின் விரிந்த சூழலில் குறிப்பு தந்தையை நோக்கினாலும், இவ்வசனத்தின் கிரேக்க உரை அந்தப் பட்டத்தைச் சொல்லவில்லை; ஆகவே அது சேர்க்கப்படவில்லை.
- issue: ἀληθινός என்பதன் இறையியல் நிழற்பொருள்
  choice: ‘உண்மையானவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மெய்யானவர்’, ‘நிஜமானவர்’ அல்லது ‘உண்மையுள்ளவர்’.
  rationale: இச்சொல் நம்பத்தகுந்தவர் என்பதையும் மெய்யாக/நிஜமாக இருப்பவர் என்பதையும் ஒலிக்கச் செய்யலாம். பிரதான உரை ஒரு பொருளை மட்டும் பூட்டிவிடாமல், அடிக்குறிப்பு மாற்றுப் பொருள்களைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘கற்பித்தல்’, ‘அனுப்பியவர்’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; மிகப் பழமையான சொல்வடிவங்களும் பிரிவுசார் விளக்கங்களும் தவிர்க்கப்பட்டுள்ளன. கிரேக்கத்தின் அறிவிப்பு வடிவம், மறுபடியும் வரும் ‘தெரியும்’, மற்றும் இயேசுவின் தோற்றத்தைச் சார்ந்த திட்டமிட்ட இரட்டைப்பொருள் பாதுகாக்கப்பட்டுள்ளன.
