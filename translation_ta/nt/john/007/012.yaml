source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: ta
  text: மக்கள் கூட்டங்களிடையே அவரைப் பற்றிய முணுமுணுப்பு அதிகமாக இருந்தது.[a] சிலர், “அவர் நல்லவர்” என்றார்கள். வேறு சிலரோ, “இல்லை; மாறாக, அவர் மக்கள் கூட்டத்தைத் தவறாக வழிநடத்துகிறார்”[b] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பற்றிய குறைகூறல்” அல்லது “அவரைப் பற்றிய தாழ்ந்த குரலிலான பேச்சு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் மக்கள் கூட்டத்தை ஏமாற்றுகிறார்” அல்லது “வழிதவறச் செய்கிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: முணுமுணுப்பு
  rationale: வெளிப்படையான விவாதத்தைக் காட்டிலும் தாழ்ந்த குரலில் பேசுதல், குறைகூறுதல், இரகசியமாகப் பரவும் பேச்சு ஆகிய நிழற்பொருள்களைத் தக்கவைக்கிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைப் பற்றிய
  rationale: இயல்பான நவீனத் தமிழில் கிரேக்கத் தொடரின் நேரடியான பொருளை அளிக்கிறது.
- source_word: πολύς
  choice: அதிகமாக இருந்தது
  rationale: முணுமுணுப்பின் பரவலையும் அளவையும் இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: ἐν τοῖς ὄχλοις
  choice: மக்கள் கூட்டங்களிடையே
  rationale: ὄχλοις என்பதன் பன்மையைப் பேணி, திருவிழாவில் திரண்டிருந்த பல்வேறு கூட்டங்களுக்குள் பேச்சு பரவியிருந்ததை வெளிப்படுத்துகிறது.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: சிலர் ... வேறு சிலரோ
  rationale: கூட்டங்களுக்குள் இருந்த எதிரெதிரான கருத்துடைய இரு பிரிவுகளைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Ἀγαθός ἐστιν
  choice: அவர் நல்லவர்
  rationale: ‘நல்லவர்’ என்பது மனிதரின் பண்பைப் பற்றிய மதிப்பீட்டைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; கிரேக்கத்தில் இல்லாத கூடுதல் பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
- source_word: Οὔ, ἀλλὰ
  choice: இல்லை; மாறாக
  rationale: முதற் கருத்தை நேரடியாக மறுத்து அதற்கு எதிரான திருத்தத்தை முன்வைக்கும் வலிமையைப் பேணுகிறது.
- source_word: πλανᾷ
  choice: தவறாக வழிநடத்துகிறார்
  rationale: ஒருவரைத் தவறான பாதைக்கு இட்டுச் செல்லுதல் அல்லது தவறாகப் புரிந்துகொள்ளச் செய்தல் என்ற பொருளைத் தருகிறது; திட்டமிட்ட ஏமாற்றத்தை அவசியமாக முன்கூட்டியே தீர்மானிப்பதில்லை.
- source_word: τὸν ὄχλον
  choice: மக்கள் கூட்டத்தை
  rationale: இங்கு வரும் ஒருமை வடிவைத் தக்கவைத்து, மக்களை ஒரு கூட்டு அலகாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய மக்கள் கூட்டத்தின் முரண்பட்ட மதிப்பீடுகள்
  choice: நேர்மறை மற்றும் எதிர்மறை கூற்றுகள் இரண்டையும் உரையாளர் ஆதரிப்பதாகக் காட்டாமல் நேரடியாகப் பதிவு செய்தல்
  alternative: ஒரு கூற்றை மென்மைப்படுத்துதல் அல்லது உண்மையான மதிப்பீடாக விளக்குதல்
  rationale: வசனம் இயேசுவைப் பற்றிய பிளவுபட்ட பொதுக் கருத்தை அறிக்கையிடுகிறது; எந்தக் கூற்றையும் இங்கு உரையாளர் வெளிப்படையாக ஏற்றுக்கொள்வதில்லை.
- issue: πλανᾷ என்பதில் நோக்கமுள்ள வஞ்சனையா அல்லது விளைவாகத் தவறுவித்தலா
  choice: முதன்மை உரையில் ‘தவறாக வழிநடத்துகிறார்’ என்று திறந்த பொருளில் தருதல்
  alternative: ‘ஏமாற்றுகிறார்’ என்று திட்டமிட்ட வஞ்சனையை முன்னிறுத்துதல்
  rationale: கிரேக்கச் சொல் ஏமாற்றுதல் அல்லது வழிதவறச் செய்தல் ஆகிய இரு நிழற்பொருள்களையும் கொள்ளக்கூடும்; முதன்மை மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘முணுமுணுப்பு’ தாழ்ந்த குரலிலான பேச்சையும் குறைகூறலையும் சுமக்கிறது. ‘நல்லவர்’ இயல்பான தமிழில் நபரின் பண்பைக் குறிக்கிறது. அடிக்குறிப்பு குறிகள் அனைத்தும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
