- from: பரிசேயர்கள், மக்கள் அவரைப் பற்றி இவற்றை முணுமுணுத்துக்கொண்டிருப்பதைக் கேட்டார்கள்.[a] ஆகவே, தலைமைக் குருக்களும் பரிசேயர்களும் அவரைப் பிடிப்பதற்காகக் காவலர்களை அனுப்பினார்கள்.[b][c]
