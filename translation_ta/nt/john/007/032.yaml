id: JHN.7.32
reference: John 7:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: ta
  text: பரிசேயர்கள், கூட்டத்தினர் அவரைக் குறித்து இந்தக் காரியங்களை முணுமுணுத்ததைக் கேட்டார்கள்.[a] அப்போது தலைமை ஆசாரியர்களும் பரிசேயர்களும் அவரைப் பிடிப்பதற்காகக் காவலர்களை அனுப்பினார்கள்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முணுமுணுத்தது” என்பதற்கு “தாழ்ந்த குரலில் பேசிக்கொண்டது,” “அதிருப்தியுடன் பேசிக்கொண்டது,” அல்லது “குறைகூறிக்கொண்டது” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அடக்கமான, அதிருப்தி கலந்த பேச்சைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “காவலர்கள்” என்பதற்கு “அதிகாரப் பணியாளர்கள்” என்றும் மொழிபெயர்க்கலாம்; “ஆலயக் காவலர்கள்” என்பது ஒரு குறிப்பான வரலாற்று விளக்கம். கிரேக்கச் சொல் அதிகாரிகளால் அனுப்பப்பட்ட அதிகாரப்பூர்வ உதவியாளர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “பிடிப்பதற்காக” என்பதற்கு சூழலின்படி “கைது செய்வதற்காக” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நேரடியாக “பிடிப்பது” அல்லது “கைப்பற்றுவது” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: கேட்டார்கள்
  rationale: இங்கு ἀκούω என்பது மக்கள் பேசிக்கொண்டிருந்த செய்தி பரிசேயர்களின் செவிக்கு எட்டியதைக் குறிக்கிறது; நவீனத் தமிழில் ‘கேட்டார்கள்’ இயல்பான இணை.
- source_word: τοῦ ὄχλου
  choice: மக்கள்
  rationale: ὄχλος இங்கு கூடியிருந்த மக்கள் கூட்டத்தைக் குறிக்கிறது. ‘மக்கள்’ இயல்பான தமிழாகவும் சூழலில் தெளிவாகவும் உள்ளது.
- source_word: γογγύζοντος
  choice: முணுமுணுத்துக்கொண்டிருப்பதை
  rationale: γογγύζω தாழ்ந்த குரலில், ஓரளவு அதிருப்தியோடு பேசுவதைக் குறிக்கலாம். ‘முணுமுணுத்தல்’ அந்த ஒலிநயத்தையும் மறைவான பேச்சின் தன்மையையும் காக்கிறது.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: அவரைப் பற்றி இவற்றை
  rationale: περί உடன் வரும் மரபுத்தொடரை ‘அவரைப் பற்றி’ என்றும், பன்மையான ταῦτα-வை ‘இவற்றை’ என்றும் நேரடியாகக் காக்கிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: இப்பன்மை அக்காலத் தலைமைக் குருத்துவ வட்டாரத்தைக் குறிக்கிறது; பல ‘பிரதான ஆசாரியர்’ பதவியாளர்கள் இருந்ததாகப் பொருள் கொள்ளாமல் நிறுவனத் தலைமையைச் சுட்டுகிறது.
- source_word: ὑπηρέτας
  choice: காவலர்கள்
  rationale: யூத அதிகாரிகளின் கீழ் செயல்பட்ட அதிகாரப்பூர்வப் பணியாளர்களை இங்கு குறிக்கிறது. ‘காவலர்கள்’ அவர்கள் மேற்கொள்ள அனுப்பப்பட்ட பிடித்தல் பணியைத் தெளிவாகத் தருகிறது; நிறுவனச் சரியான அடையாளம் அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: அவரைப் பிடிப்பதற்காக
  rationale: ἵνα நோக்கத்தையும் πιάζω உடலாரப் பிடித்தல் அல்லது கைப்பற்றுதல் என்ற அடிப்படைப் பொருளையும் தருகின்றன. சட்டரீதியான ‘கைது’ என்பதை முதன்மை உரையில் அதிகமாக நிர்ணயிக்காமல் உள்ளது.
theological_decisions:
- issue: ὑπηρέτας என்போரின் நிறுவன அடையாளம்
  choice: காவலர்கள்
  alternative: அதிகாரப் பணியாளர்கள்; ஆலயக் காவலர்கள்
  rationale: இது இயேசுவைப் பிடிக்க மேற்கொள்ளப்பட்ட அதிகாரப்பூர்வ நடவடிக்கை. கிரேக்கம் இவர்களைப் பணியாளர்கள்/அதிகார உதவியாளர்கள் எனக் குறிப்பிடுகிறது; ‘ஆலயக் காவலர்கள்’ என்பது சாத்தியமான வரலாற்று விளக்கம் என்றாலும் மூலச்சொல்லைவிடக் குறிப்பானது.
- issue: πιάσωσιν என்பதின் சட்டரீதியான நயம்
  choice: பிடிப்பதற்காக
  alternative: கைது செய்வதற்காக
  rationale: சூழலில் கைது நோக்கம் தெளிவாக இருந்தாலும், πιάζω என்பதன் நேரடியான ‘பிடி/கைப்பற்று’ நயத்தை முதன்மை உரை காக்கிறது; சட்டரீதியான வாசிப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுமக்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘ஆகவே’ என்பது இரண்டு அதிகாரக் குழுக்களும் எடுத்த நடவடிக்கையை முன் வாக்கியத்தோடு இயல்பாக இணைக்கிறது. இறையியல் அல்லது பிரிவுசார் விளக்கங்களைச் சேர்க்காமல், மூலத்தின் நிறுவன மற்றும் சட்டரீதியான தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
