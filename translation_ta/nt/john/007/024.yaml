  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: ta
  text: வெளித்தோற்றத்தை வைத்து தீர்ப்பளிக்காதீர்கள்[a]; ஆனால் நீதியான தீர்ப்பை வழங்குங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கண்ணுக்குத் தெரிவதை வைத்து தீர்ப்பளிக்காதீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: தீர்ப்பளிக்காதீர்கள்
  rationale: μή உடனான நிகழ்காலக் கட்டளை இங்கு இயல்பாகத் தடையைத் தெரிவிக்கிறது. ‘தீர்ப்பளிக்காதீர்கள்’ என்பது நீதித்தீர்ப்பு சார்ந்த சூழலைத் தெளிவாகக் காட்டுகிறது; வினையின் கால அம்சத்தை ‘இனி நிறுத்துங்கள்’ என்று மிகையாக விளக்கவில்லை.
- source_word: κατ’ ὄψιν
  choice: வெளித்தோற்றத்தை வைத்து
  rationale: ὄψις இங்கு கண்ணுக்குத் தெரியும் தோற்றம் அல்லது மேலோட்டமான அபிப்பிராயத்தைக் குறிக்கிறது. ‘வெளித்தோற்றத்தை வைத்து’ என்பது அந்த அடிப்படையில் தீர்ப்பிடுவதைக் கூறும் இயல்பான நவீனத் தமிழ்.
- source_word: ἀλλὰ
  choice: ஆனால் என்பதற்குப் பதிலாக அரைப்புள்ளியால் வெளிப்படுத்தப்பட்ட முரண்பாடு
  rationale: கிரேக்கத்தின் வலுவான எதிர்மறை மாறுபாடு தமிழில் இரண்டு இணையான கட்டளைகளுக்கிடையிலான அரைப்புள்ளியால் இயல்பாக வெளிப்படுகிறது; இரண்டாம் கட்டளை முதலாம் முறைக்கு மாற்றாக நிற்கிறது.
- source_word: τὴν δικαίαν κρίσιν
  choice: நீதியான தீர்ப்பை
  rationale: δικαίαν என்பதன் நெறிசார் மற்றும் நீதிசார் தன்மையை ‘நீதியான’ காக்கிறது; κρίσιν என்பதன் நேரடி செயப்படுபொருள் அமைப்பை ‘தீர்ப்பை’ தக்கவைக்கிறது.
- source_word: κρίνετε
  choice: அளியுங்கள்
  rationale: முதல் இடத்தில் வரும் அதே கிரேக்க வினையின் தீர்ப்பிடும் பொருள் ‘தீர்ப்பை அளியுங்கள்’ என்ற இயல்பான தமிழ்ச் சேர்க்கையில் பாதுகாக்கப்படுகிறது. சொல் வடிவ மறுபதிப்பு குறைந்தாலும் கருத்து மற்றும் கட்டளை இணைநிலை நீடிக்கின்றன.
theological_decisions:
- issue: δικαίαν என்பதன் நெறிசார்-நீதிசார் பொருள்
  choice: நீதியான
  alternative: நியாயமான
  rationale: ‘நீதியான’ என்பது வெறும் நடைமுறைச் சமநிலையை மட்டும் அல்லாமல், δίκαιος கொண்டுள்ள நெறிசார் நேர்மையையும் நீதியையும் காக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
- issue: தீர்ப்பிடுதலுக்கான முழுத் தடையா அல்லது தீர்ப்பிடும் முறைக்கான திருத்தமா
  choice: வெளித்தோற்றத்தின் அடிப்படையிலான தீர்ப்பைத் தடைசெய்து, நீதியான தீர்ப்பை கட்டளையிடுதல்
  alternative: எல்லா வகையான தீர்ப்பிடுதலுக்கும் முழுத் தடை
  rationale: ἀλλά மூலம் இணைக்கப்பட்ட இரு கட்டளைகளும் தீர்ப்பிடுதலையே முற்றிலும் தடைசெய்யாமல், அதன் தவறான அடிப்படையை நீதியான அடிப்படையால் மாற்றுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைப் பன்மைக் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் எதிர்மறை-நேர்மறை இணைநிலையும் நீதித்தீர்ப்பு நயமும் காக்கப்பட்டுள்ளன.
