review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition against judging on the basis of outward appearance and the command to make a just/righteous judgment. However, rendering the explicit adversative ἀλλά only through a semicolon leaves the contrast less explicit than in the Greek.
  naturalness: ‘வெளித்தோற்றத்தை வைத்து தீர்ப்பளிக்காதீர்கள்’ is idiomatic modern Tamil. ‘நீதியான தீர்ப்பை அளியுங்கள்’ is understandable, but ‘நீதியான தீர்ப்பை வழங்குங்கள்’ is a more natural collocation in this judicial context.
  terminology: ‘வெளித்தோற்றம்’ suitably renders κατ’ ὄψιν, and ‘நீதியான தீர்ப்பு’ preserves the ethical and judicial force of δικαία κρίσις without importing a doctrinal interpretation.
  issues:
  - severity: low
    issue: The explicit adversative ἀλλά is not represented lexically.
    rationale: A semicolon can join the clauses, but it does not reliably convey the Greek’s explicit ‘but/rather’ contrast. Adding ‘ஆனால்’ preserves the syntactic and rhetorical opposition.
  - severity: low
    issue: ‘தீர்ப்பை அளியுங்கள்’ is slightly less idiomatic than ‘தீர்ப்பை வழங்குங்கள்.’
    rationale: Both are intelligible, but ‘நீதியான தீர்ப்பை வழங்குங்கள்’ is smoother modern standard Tamil while retaining κρίσιν as the object of the command.
  revised_text: வெளித்தோற்றத்தை வைத்து தீர்ப்பளிக்காதீர்கள்[a]; ஆனால் நீதியான தீர்ப்பை வழங்குங்கள்.
  revised_footnotes:
