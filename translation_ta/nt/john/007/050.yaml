id: JHN.7.50
reference: John 7:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: ta
  text: 'முன்பு அவரிடம்[அ] வந்தவரும், அவர்களில் ஒருவருமான நிக்கொதேமு அவர்களிடம் சொன்னார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: அ
    text: ‘அவரிடம்’ என்பது பரந்த சூழலில் இயேசுவைக் குறிக்கிறது (யோவான் 3:1–2). அல்லது, ‘முன்பு அவரிடம் வந்தவர்.’
    reason: The Greek pronoun is retained in the text, while its contextual referent and the alternative appositional rendering are supplied in a note.
lexical_decisions:
- source_word: λέγει
  choice: சொன்னார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ்க் கதைநடையில் இறந்தகாலமான ‘சொன்னார்’ இயல்பாக உள்ளது; உரையாடலை அறிமுகப்படுத்தும் செயல்பாட்டையும் காக்கிறது.
- source_word: Νικόδημος
  choice: நிக்கொதேமு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: பேச்சு வினையுடன் வரும் πρός, பேச்சு யாரை நோக்கியது என்பதைக் குறிக்கிறது; தமிழில் ‘அவர்களிடம்’ இயல்பான இணை.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: முன்பு இயேசுவிடம் வந்தவருமான
  rationale: பெயரெச்சத் தொடர் நிக்கொதேமுவை அடையாளப்படுத்துகிறது. πρότερον என்பதற்கு ‘முன்பு’ இயல்பானது. αὐτόν என்ற பிரதிப்பெயரின் சூழல்சார் குறிப்பு இயேசுவே (யோவான் 3:1–2); தமிழ் வாக்கியத்தில் வெறும் ‘அவரிடம்’ என்பது குழப்பத்தை ஏற்படுத்துவதால் பெயர் வெளிப்படுத்தப்பட்டது.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: அவர்களில் ஒருவரும்
  rationale: நிக்கொதேமு அந்தக் குழுவைச் சேர்ந்தவர் என்ற பின்னணித் தகவலைக் காக்கிறது; காரணப் பொருளைச் சேர்க்காமல் பெயரெச்சத் தொடர்பாக வழங்குகிறது.
theological_decisions:
- issue: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον என்பதில் αὐτόν யாரைக் குறிக்கிறது
  choice: மொழிபெயர்ப்பில் ‘இயேசுவிடம்’ என்று வெளிப்படுத்தப்பட்டது.
  alternative: ‘முன்பு அவரிடம் வந்தவர்’ என்று பிரதிப்பெயரை அப்படியே வைத்திருக்கலாம்.
  rationale: யோவான் 3:1–2-ன் கதைத்தொடர்பில் குறிக்கப்படுபவர் இயேசு. தமிழில் ‘அவரிடம்’ என்ற வடிவம் உடனிருக்கும் பன்மை ‘அவர்கள்’ குறிப்புடன் எளிதில் குழம்பக்கூடும்; ஆகவே சூழல் தெளிவாக்கப்பட்டது, புதிய இறையியல் தகவல் சேர்க்கப்படவில்லை.
- issue: εἷς ὢν ἐξ αὐτῶν என்ற தொடரின் உறவு
  choice: அடையாளம் தரும் பின்னணித் தகவலாக ‘அவர்களில் ஒருவரும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களில் ஒருவராக இருந்ததால்’ என்று காரணப் பொருளில் மொழிபெயர்க்கலாம்.
  rationale: கிரேக்கப் பெயரெச்சம் தானாகவே காரண உறவைத் தெளிவாகக் கூறவில்லை; எனவே காரணப் பொருள் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் இயல்பான கதைநடையும் கொண்ட வாக்கியம். கிரேக்கத்தின் இடைச்செருகல் தகவல்கள் தமிழில் புரியும் வகையில் ஒருங்கிணைக்கப்பட்டுள்ளன; வசனம் அடுத்த வசனத்தில் தொடரும் பேச்சை அறிமுகப்படுத்துவதால் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
