source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: ta
  text: ஏனெனில், வெளிப்படையாக இருக்க[a] நாடுகிற யாரும் எதையும் மறைவாகச் செய்வதில்லை. நீ இவற்றைச் செய்கிறாய் என்றால், உலகத்திற்கு உன்னை வெளிப்படுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளிப்படையாக இருக்க’ என்பதற்கு, ‘பொதுவெளியில் அறியப்பட’ அல்லது ‘எல்லாரும் காணும்படி இருக்க’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொற்றொடர் பொதுவெளியில் வெளிப்படையாக அல்லது எல்லாரும் காணும்படி இருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: ஏனெனில் ... எவனும் ... செய்வதில்லை
  rationale: γάρ என்பதன் விளக்கக் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது; οὐδεὶς உடன் வரும் பொதுவான எதிர்மறைக் கூற்றை இயல்பான தமிழில் ‘எவனும் ... செய்வதில்லை’ என வழங்குகிறது.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: எதையும் மறைவாகச் செய்வதில்லை
  rationale: τι என்னும் காலவரையற்ற செயப்படுபொருளையும், ἐν κρυπτῷ என்னும் மறைவு அல்லது இரகசிய நிலைமையையும் தெளிவாகப் பேணுகிறது.
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: வெளிப்படையாக இருக்க நாடுகிற
  rationale: ζητεῖ என்பதன் நோக்கமுள்ள முயற்சியை ‘நாடுகிற’ காட்டுகிறது. ἐν παρρησίᾳ என்பது இச்சூழலில் பொதுமக்கள் முன் வெளிப்படையாக இருப்பதைக் குறிக்கிறது. தமிழில் வாக்கியத்தை இயல்பாக்க உடன்பாட்டு அமைப்பு தொடர்புப் பெயரெச்சமாக மாற்றப்பட்டுள்ளது; αὐτός தரும் எழுவாய் வலியுறுத்தல் தனிச் சொல்லாகச் சேர்க்கப்படவில்லை.
- source_word: εἰ ταῦτα ποιεῖς
  choice: நீ இவற்றைச் செய்கிறாய் என்றால்
  rationale: கிரேக்கத்தின் நிகழ்கால நிபந்தனையை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: φανέρωσον σεαυτὸν
  choice: உன்னை வெளிப்படுத்து
  rationale: முடிவான பொதுவெளிப்பாட்டைக் கோரும் கட்டளையின் நேரடித் தன்மையைப் பேணுகிறது.
- source_word: τῷ κόσμῳ
  choice: உலகத்திற்கு
  rationale: உடனடிச் சூழலில் பொதுமக்களைக் குறித்தாலும், யோவான் நூலில் κόσμος என்பதற்குள்ள இலக்கிய மற்றும் இறையியல் எதிரொலியை ‘உலகம்’ பேணுகிறது.
theological_decisions:
- issue: யோவான் நூலின் சூழலில் κόσμος என்பதன் பொருள்
  choice: உலகத்திற்கு
  alternative: பொதுமக்களுக்கு
  rationale: இங்கு பொதுவெளியில் தெரிவது உடனடிக் கருத்தாக இருந்தாலும், ‘உலகம்’ என்பது யோவானின் முக்கியச் சொற்பயன்பாட்டையும் அதன் விரிந்த கருத்தொலியையும் தேவையின்றிக் குறுக்காமல் பேணுகிறது.
- issue: சகோதரர்கள் இயேசுவை அழைக்கும் ஒருமை வடிவம்
  choice: நீ / உன்னை
  alternative: நீர் / உம்மை
  rationale: கிரேக்க உரை மரியாதை நிலையை இலக்கணமாகக் குறிக்கவில்லை. சகோதரர்களின் நேரடியான, சவாலான குடும்பப் பேச்சை நவீன தமிழில் இயல்பாக வெளிப்படுத்த ஒருமை ‘நீ’ பயன்படுத்தப்பட்டுள்ளது; இதனால் இயேசுவைப் பற்றிய இறையியல் மதிப்பீடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நேரடித் தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் கிரேக்க இணைப்பு தமிழின் இயல்புக்கேற்ப தொடர்புப் பெயரெச்ச அமைப்பாக மாற்றப்பட்டுள்ளது. அடிக்குறி குறியீடு உரையில் இடம்பெற்றுள்ளது.
