id: JHN.7.26
reference: John 7:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: ta
  text: இதோ, இவர் வெளிப்படையாகப் பேசிக்கொண்டிருக்கிறார்; அவர்களோ இவரிடம் ஒன்றும் சொல்வதில்லை. இவர்தான் மெசியா என்று தலைவர்கள் உண்மையிலேயே அறிந்துகொண்டார்களோ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்தான் மெசியா என்று தலைவர்கள் உண்மையிலேயே அறிந்திருக்க முடியுமா?”
    reason: μήποτε என்ற சொல்லால் குறிக்கப்படும் வியப்புடனான ஊகத்தை அவநம்பிக்கை வினாவாகவும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: ἴδε
  choice: இதோ
  rationale: பேசுபவர் கேட்போரின் கவனத்தைத் திருப்பும் இடைச்சொல்லாக இருப்பதால், இயல்பானதும் கண்ணியமானதுமான ‘இதோ’ பயன்படுத்தப்பட்டது.
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: இங்கு துணிச்சலைவிட பொதுவில் தடையின்றிப் பேசுவதையே சூழல் வலியுறுத்துகிறது.
- source_word: λαλεῖ
  choice: பேசிக்கொண்டிருக்கிறார்
  rationale: நடந்துகொண்டிருக்கும் காட்சியைச் சுட்டும் நிகழ்காலச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: இவரிடம் ஒன்றும் சொல்வதில்லை
  rationale: αὐτῷ என்பதிலுள்ள ‘இவரிடம்’ என்ற பொருளை நேரடியாகத் தக்கவைக்கிறது; ‘எதிராக’ என்ற சூழல்சார் பொருளை உரைக்குள் சேர்க்கவில்லை.
- source_word: μήποτε
  choice: அறிந்துகொண்டார்களோ?
  rationale: வியப்பும் ஐயமும் கலந்த ஊக வினாவைத் தமிழின் ‘-ஓ?’ வினைமுற்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀληθῶς
  choice: உண்மையிலேயே
  rationale: ஊகம் உண்மையாக இருக்குமோ என்ற வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔγνωσαν
  choice: அறிந்துகொண்டார்கள்
  rationale: தலைவர்கள் இந்த அடையாளத்தை உணர்ந்து அறிந்த நிலைக்கு வந்திருக்கிறார்களோ என்ற இறந்தகால வினைவடிவின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: οἱ ἄρχοντες
  choice: தலைவர்கள்
  rationale: சூழலில் யூத மக்களின் ஆளும் தலைவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: இவர்தான் மெசியா என்று
  rationale: χριστός இங்கு பெயராக அல்ல, எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக இருப்பதால் ‘மெசியா’ பயன்படுத்தப்பட்டது; ‘-தான்’ அடையாள வாக்கியத்தின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ὁ χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு கூட்டத்தார் எதிர்பார்த்திருந்த யூத மெசியாவைக் குறிக்கும் பட்டமாக χριστός வருகிறது; ஆகவே பெயர்போன்ற ‘கிறிஸ்து’ என்பதற்குப் பதில் பட்டத்தின் பொருளையும் பின்னணியையும் காக்கும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: μήποτε கொண்ட வினாவின் தொனி
  choice: 'ஐயமும் வியப்பும் கலந்த ஊகம்: ‘அறிந்துகொண்டார்களோ?’'
  alternative: ‘அறிந்திருக்க முடியுமா?’ என்ற அவநம்பிக்கை வினா
  rationale: கிரேக்க வினா வியப்புடனான சாத்திய ஊகத்துக்கும் எதிர்பாராததால் எழும் அவநம்பிக்கைக்கும் இடமளிக்கிறது; முதன்மை உரை அந்தத் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இதோ’ கவன ஈர்ப்புச் சொல்லாகவும், ‘அவர்களோ’ எதிர்மறை மாறுபாட்டைக் காட்டவும் பயன்படுத்தப்பட்டுள்ளது; சமயப் பிரிவுக்குரிய தனிப்பட்ட விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
