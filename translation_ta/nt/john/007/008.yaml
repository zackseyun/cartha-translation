  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: ta
  text: நீங்கள் பண்டிகைக்குப் போங்கள். நான் இந்தப் பண்டிகைக்குப் போவதில்லை[a]. ஏனென்றால், என் காலம்[b] இன்னும் நிறைவேறவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “நான் இன்னும் இந்தப் பண்டிகைக்குப் போவதில்லை” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “எனக்குக் குறிக்கப்பட்ட காலம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: போங்கள்
  rationale: எருசலேமுக்குச் செல்வதில் உள்ள உயரே செல்லும் திசைநுட்பம் கிரேக்கச் சொல்லில் இருந்தாலும், தமிழில் ‘பண்டிகைக்குப் போங்கள்’ என்பதே இயல்பான நடை; ‘ஏறிப்போங்கள்’ என்பது இச்சூழலில் செயற்கையாக ஒலிக்கும்.
- source_word: ἑορτή
  choice: பண்டிகை
  rationale: மதச்சார்புடைய திருவிழாவைக் குறிக்கும் இயல்பான, பரவலாகப் புரியும் தமிழ்ச்சொல்.
- source_word: οὐκ ἀναβαίνω
  choice: நான் ... போவதில்லை
  rationale: உடனடிச் சூழலில் நிகழவிருக்கும் செயலை மறுக்கும் நிகழ்கால வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. மூலத்தின் οὐκ என்பதற்கேற்ப ‘இன்னும்’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: καιρός
  choice: என் காலம்
  rationale: குறித்த அல்லது ஏற்ற நேரம் என்ற உட்பொருளைத் திறந்தவாறே வைத்துக்கொண்டு, மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- source_word: πεπλήρωται
  choice: நிறைவேறவில்லை
  rationale: πληρόω என்ற வினையின் நிறைவு/முழுமை நுட்பத்தை வெறும் ‘வரவில்லை’ என்று தட்டையாக்காமல் காக்கிறது.
theological_decisions:
- issue: பண்டிகைக்குச் செல்வதைப் பற்றிய இயேசுவின் கூற்றில் உள்ள பாட வேறுபாடு
  choice: SBLGNT-இன் οὐκ (‘இல்லை’) என்ற வாசகத்தை முதன்மை உரையில் பின்பற்றி, ‘நான் இந்தப் பண்டிகைக்குப் போவதில்லை’ என்று மொழிபெயர்த்தல்.
  alternative: 'οὔπω (‘இன்னும் இல்லை’): ‘நான் இன்னும் இந்தப் பண்டிகைக்குப் போகவில்லை.’'
  rationale: வழங்கப்பட்ட மூலப்பதிப்பு οὐκ என்று வாசிப்பதால் அதுவே முதன்மை உரையில் உள்ளது. பின்னர் இயேசு பண்டிகைக்குச் செல்வதோடு தோன்றும் பதற்றத்தை மொழிபெயர்ப்பில் மறைமுகமாகத் தீர்க்காமல், குறிப்பிடத்தக்க மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘போவதில்லை’ என்பது உடனடியாக நிகழவிருக்கும் செயலை மறுக்கும் இயல்பான தமிழ் வடிவம்; ‘நிறைவேறவில்லை’ என்பது மூலத்தின் நிறைவு நுட்பத்தைத் தக்கவைக்கிறது.
