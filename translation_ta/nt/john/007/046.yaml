base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: ta
  text: 'காவலர்கள் பதிலளித்தார்கள்: “ஒரு மனிதனும்[a] இதுபோல் ஒருபோதும் பேசியதில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவரும் இதுபோல் ஒருபோதும் பேசியதில்லை.” கிரேக்க மொழியில் ஒருமை வடிவில் “ஒரு மனிதன்” என்று உள்ளது; இங்கு அது பொதுவாக எந்த மனிதரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: பதிலளித்தார்கள்
  rationale: உரையாடல் சூழலில் ἀποκρίνομαι என்பதன் இயல்பான இறந்தகாலப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οἱ ὑπηρέται
  choice: காவலர்கள்
  rationale: இவர்கள் இயேசுவைப் பிடிக்க அனுப்பப்பட்ட பணியாளர்கள் (யோவான் 7:32, 45); தமிழில் அவர்களின் இச்சூழல்சார் பணியை இயல்பாகக் குறிக்கிறது. ‘ஆலயக் காவலர்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: Οὐδέποτε
  choice: ஒருபோதும் … பேசியதில்லை
  rationale: காலம் முழுவதற்குமான முழுமையான மறுப்பைத் தமிழின் இயல்பான எதிர்மறை வாக்கிய அமைப்பில் தருகிறது.
- source_word: ἐλάλησεν
  choice: பேசியதில்லை
  rationale: கிரேக்க இறந்தகால வினையையும் Οὐδέποτε உடன் சேர்ந்த மறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὕτως
  choice: இதுபோல்
  rationale: பேசிய முறையைச் சுட்டும் οὕτως என்பதற்கு இயல்பான, தெளிவான தமிழ் இணை.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதனும்
  rationale: மூலத்தின் ஒருமை மனிதப் பெயர்ச்சொல்லைப் பாதுகாக்கிறது; எதிர்மறைத் தமிழ் வாக்கியத்தில் ‘-உம்’ இணைப்பு இயல்பாகவும் பிரதிநிதித்துவப் பொருளுடனும் அமைகிறது.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பிரதிநிதித்துவ ஒருமை
  choice: ஒரு மனிதனும்
  alternative: எவரும்
  rationale: மூலத்தில் உள்ள ஒருமை மனிதப் பெயர்ச்சொல்லைத் தக்கவைத்தபடியே, இங்கு பொதுவான மனிதரைக் குறிக்கும் அதன் விரிவான பொருளையும் தமிழ் எதிர்மறை அமைப்பு உணர்த்துகிறது. ‘எவரும்’ பொருளில் சாத்தியமானது, ஆனால் மூல வடிவத்தைச் சற்றே பொதுமைப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் வியப்பும் முழுமையான மறுப்பும் இயல்பான தமிழ் சொற்றொடரால் பாதுகாக்கப்பட்டுள்ளன.
