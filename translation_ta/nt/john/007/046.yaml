  source_fidelity: 'மூலத்தின் அனைத்து முக்கிய கூறுகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: οἱ ὑπηρέται என்பதற்கு சூழலுக்கேற்ற «காவலர்கள்», ἀπεκρίθησαν என்பதற்கு «பதிலளித்தார்கள்», Οὐδέποτε என்பதற்கு «ஒருபோதும் ... இல்லை», οὕτως என்பதற்கு «இதுபோல்», மற்றும் ἄνθρωπος என்பதன் பிரதிநிதித்துவ ஒருமைக்கு «ஒரு மனிதனும்» வழங்கப்பட்டுள்ளன. எதிர்மறை வாக்கியத்தில் «-உம்» பயன்பாடு முழுமையான மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.'
  naturalness: '«காவலர்கள் பதிலளித்தார்கள்: “ஒரு மனிதனும் இதுபோல் ஒருபோதும் பேசியதில்லை.”» என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம உரைநடைப் பதிவிலும் இயல்பாகவும் உள்ளது. சொல் வரிசை வலியுறுத்தலையும் வியப்பையும் காக்கிறது.'
