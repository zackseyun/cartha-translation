id: JHN.7.36
reference: John 7:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: ta
  text: “‘நீங்கள் என்னைத் தேடுவீர்கள்; என்னைக் காணமாட்டீர்கள்; நான் எங்கே இருக்கிறேனோ அங்கே உங்களால் வர முடியாது’ என்று அவர் சொன்ன இந்தக் கூற்று என்ன?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர் சொன்ன இந்தச் சொல்லின் பொருள் என்ன?’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க λόγος என்பது சூழலுக்கேற்ப ‘சொல்,’ ‘கூற்று,’ ‘செய்தி,’ அல்லது ‘சொல்லப்பட்டது’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: கூற்று
  rationale: இங்கு λόγος என்பது தனியொரு சொல்லைக் காட்டிலும் இயேசு கூறிய முழுக் கருத்தைக் குறிக்கிறது. ‘கூற்று’ என்பது நவீனத் தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: இந்தக் கூற்றின் பொருள் என்ன?
  rationale: சொல்லுக்குச் சொல் அமைப்பு தமிழில் இயல்பற்றதாக இருப்பதால், கேள்வியின் நோக்கத்தைத் தெளிவாக வெளிப்படுத்தும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: Ζητήσετέ με
  choice: நீங்கள் என்னைத் தேடுவீர்கள்
  rationale: ζητέω என்பதன் நேரடியான பொருளையும் யோவான் நூலில் வரும் தொடர்ச்சியான சொல்லாட்சியையும் ‘தேடுவீர்கள்’ காக்கிறது.
- source_word: οὐχ εὑρήσετε
  choice: என்னைக் கண்டுபிடிக்க மாட்டீர்கள்
  rationale: எதிர்கால மறுப்பைத் தெளிவாகக் காட்டுகிறது; தமிழில் பொருள் தெளிவடைய ‘என்னை’ மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: நான் எங்கே இருக்கிறேனோ, அங்கே
  rationale: மூலத்தின் நிகழ்காலமான ‘நான் இருக்கிறேன்’ என்பதைக் காக்கிறது; ‘நான் எங்கே போகிறேனோ’ என்று விளக்கமாக மாற்றவில்லை. தமிழ் இணைநிலை அமைப்புக்காக ‘அங்கே’ சேர்க்கப்பட்டுள்ளது.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: உங்களால் வர முடியாது
  rationale: δύνασθε குறிக்கும் இயலாமையை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: 'இயேசுவின் கூற்றிலுள்ள நிகழ்காலம்: ‘நான் எங்கே இருக்கிறேனோ’'
  choice: நிகழ்காலத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘நான் எங்கே போகிறேனோ’ என்று எதிர்கால இலக்காக மொழிபெயர்த்தல்
  rationale: கிரேக்க மூலத்தில் εἰμί நிகழ்காலத்தில் உள்ளது. யோவான் நற்செய்தியில் இது இயேசுவின் அடையாளம், தோற்றம், தந்தையுடனான உறவு ஆகியவற்றைச் சார்ந்த ஆழத்தையும் திட்டமிட்ட பதற்றத்தையும் கொண்டிருக்கலாம்; ஆகவே அதை விளக்கமாகத் தீர்த்துவிடாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் ஒரே தொடர்ச்சியான மேற்கோள் அமைப்பும் ‘நான் எங்கே இருக்கிறேனோ’ என்ற திட்டமிட்ட இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
