base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: ta
  text: மோசேயின் சட்டம் மீறப்படாதபடி[b] ஒருவன் ஓய்வுநாளில் விருத்தசேதனம் பெறுகிறான்[a] என்றால், ஓய்வுநாளில் ஒரு மனிதனை முழுமையாக நலமாக்கினேன் என்பதற்காக[c] என்மீது கோபப்படுகிறீர்களா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘விருத்தசேதனத்தைப் பெறுகிறான்’; ‘விருத்தசேதனம் செய்யப்படுகிறான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒதுக்கிவைக்கப்படாமல்’ அல்லது ‘செல்லாததாக்கப்படாமல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஒரு மனிதனை முழுமையாக’ என்ற சொற்றொடர், உடலின் ஒரு பகுதியில் விருத்தசேதனம் செய்வதற்கும் முழு மனிதனையும் நலமாக்குவதற்கும் இடையிலான இயேசுவின் ஒப்பீட்டை வலியுறுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: விருத்தசேதனம் செய்துகொள்கிறான்
  rationale: கிரேக்கச் சொற்றொடர் சொல்லர்த்தமாக ‘விருத்தசேதனத்தைப் பெறுகிறான்’ என இருந்தாலும், தமிழில் ‘விருத்தசேதனம் செய்துகொள்கிறான்’ என்பது இயல்பாகவும் அதன் பெறுநிலைப் பொருளைத் தெளிவாகவும் தெரிவிக்கிறது.
