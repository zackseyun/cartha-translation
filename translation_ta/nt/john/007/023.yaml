- source_word: ὅλον ἄνθρωπον
  choice: ஒரு மனிதனை முழுவதுமாக
  rationale: உடலின் ஒரு பகுதியில் செய்யப்படும் விருத்தசேதனத்துக்கும் மனிதன் முழுவதையும் நலமாக்கியதற்கும் இடையிலான இயேசுவின் சொல்லாட்சிசார் முரண்பாட்டைப் பாதுகாக்கிறது.
