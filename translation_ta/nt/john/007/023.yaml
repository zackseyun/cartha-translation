  rationale: விருத்தசேதனம் குறித்த முதல் இடத்தில் ஆண் ஒருவரையே குறிப்பதால் ‘ஒருவன்’ பயன்படுத்தப்பட்டுள்ளது; குணமாக்கப்பட்டவரைக் குறிக்கும் இரண்டாம் இடத்தில் ‘ஒரு மனிதன்’ என்பது ὅλον ἄνθρωπον என்ற சொல்லமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐν σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க வேற்றுமையின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: மோசேயின் சட்டம் மீறப்படாமல் இருப்பதற்காக
  rationale: சட்டச் சூழலில் λύω என்பது சட்டத்தை மீறுதல், ஒதுக்கிவைத்தல் அல்லது செல்லாததாக்குதல் ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம். முதன்மை உரையில் ‘மீறப்படாமல்’ என்பது தெளிவான தமிழ்; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
