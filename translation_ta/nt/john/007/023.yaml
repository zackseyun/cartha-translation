  choice: நலமாக்கியதற்காக
  rationale: ‘குணப்படுத்தினேன்’ என்பதைவிட, ‘நலமுள்ளவராக ஆக்கினேன்’ என்ற கிரேக்கக் கட்டமைப்பையும் ὅλον என்பதுடனான தொடர்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஓய்வுநாளில் விருத்தசேதனம் செய்வதையும் நலமாக்குவதையும் இயேசு ஒப்பிடுவதன் பொருள்
  choice: மோசேயின் சட்டம் மீறப்படாதபடி ஓய்வுநாளிலும் ஏற்றுக்கொள்ளப்பட்ட விருத்தசேதனத்தை அடிப்படையாகக் கொண்டு, ஒரு மனிதனை முழுவதுமாக நலமாக்குவது அதைவிட நியாயமானது என இயேசு வாதிடுகிறார்.
  alternative: சடங்குச் சட்டத்துக்கும் இரக்கச் செயலுக்கும் இடையிலான பொதுவான எதிர்மறை ஒப்பீடாக இதைப் புரிந்துகொள்ளலாம்.
  rationale: வசனத்தின் வாதம், ஓய்வுநாளில் விருத்தசேதனம் செய்வதை ஏற்றுக்கொண்ட நடைமுறையிலிருந்து முழு மனிதனை நலமாக்குவதன் நியாயத்திற்குச் செல்கிறது. மொழிபெயர்ப்பு இந்த அதிக வலுவுள்ள ஒப்பீட்டைத் தக்கவைக்கிறது; மோசேயின் சட்டத்திற்கு எதிரான பிற்காலக் கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஓய்வுநாள்’, ‘விருத்தசேதனம்’ ஆகியவை துல்லியத்திற்காகப் பயன்படுத்தப்பட்டுள்ளன. வாக்கியத்தின் வாத அமைப்பும் இறுதி வினாவின் கண்டனத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
