source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: ta
  text: எனவே யூதர்கள்[a] தங்களுக்குள், “நாம் அவனைக் காணமாட்டோமே என்று இவன் எங்கே போகப்போகிறான்? கிரேக்கர்களிடையே சிதறி வாழும் யூதர்களிடம்[b] போய்க் கிரேக்கர்களுக்குப் போதிக்கப்போகிறானா என்ன?” என்று பேசிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்கள்.” கிரேக்கச் சொல் பொதுவாக யூதர்களையோ, சில சூழல்களில் யூதேயாவைச் சேர்ந்தவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது கிரேக்க மொழி பேசும் மக்களிடையே சிதறி வாழ்ந்த யூதர்களைக் குறிக்கிறது; சிதறியிருந்த கிரேக்கர்களைக் குறிப்பதல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல் இங்கு இன–சமூகக் குழுவை இயல்பாகக் குறிக்கிறது; உரையில் இல்லாத ‘தலைவர்கள்’ என்ற வரம்பைச் சேர்க்காமல் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: πρὸς ἑαυτούς
  choice: ஒருவருக்கொருவர்
  rationale: அவர்கள் தங்கள் குழுவினருக்குள் பரஸ்பரம் பேசுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ποῦ οὗτος
  choice: இவர் எங்கே
  rationale: οὗτος என்பதன் சுட்டுப்பொருளைப் பாதுகாக்கிறது; தமிழில் இயல்பில்லாத அளவுக்கு இழிவுத் தொனியை வலுக்கட்டாயமாகச் சேர்க்கவில்லை.
- source_word: μέλλει πορεύεσθαι
  choice: போகப்போகிறார்
  rationale: எதிர்வரும் செயல் அல்லது எண்ணம் குறித்த ஊகத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: நாம் இவரைக் கண்டுபிடிக்க முடியாதபடி
  rationale: சொற்றொடரின் விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது; ‘முடியாது’ என்பது இங்கு தேடியும் காண இயலாத நிலையைத் தெளிவாக்குகிறது.
- source_word: μὴ
  choice: போகப்போகிறாரோ?
  rationale: எதிர்மறை விடையை எதிர்பார்க்கும் ஊகக் கேள்வியைத் தமிழின் ‘-ஓ’ கேள்வியமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: கிரேக்கர்களிடையே சிதறி வாழும் யூதர்களிடம்
  rationale: இது கிரேக்கர்களால் ஆன ஒரு சிதறலை அல்ல, கிரேக்க மக்களிடையே வாழும் யூதப் புலம்பெயர் சமூகத்தைக் குறிக்கிறது என்பதைத் தெளிவாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: Ἕλληνας
  choice: கிரேக்கர்களுக்கு
  rationale: சொல்லின் நேரடியான இன–பண்பாட்டு பொருளைப் பாதுகாக்கிறது; உரையில் இல்லாத பரந்த ‘புறவினத்தார்’ என்ற பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαῖοι என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: இவ்வசனத்தின் வேறுபாடு பிராந்தியத்தை விட யூதர்களுக்கும் கிரேக்கர்களுக்கும் இடையிலான இன–சமூக வேறுபாடாக உள்ளது. ஆகவே பொதுவான நேரடிப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு, சாத்தியமான பிராந்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: διασπορὰν τῶν Ἑλλήνων என்பதன் தொடர்பு
  choice: கிரேக்கர்களிடையே சிதறி வாழும் யூதர்கள்
  alternative: கிரேக்கர்களின் சிதறல்
  rationale: யூதப் பயன்பாட்டில் διασπορά நாடுகளிடையே சிதறி வாழும் யூதர்களைக் குறிக்கிறது; τῶν Ἑλλήνων இங்கு அவர்கள் வாழும் கிரேக்கச் சூழலைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புலம்பெயர் சமூகம்’ போன்ற தொழில்நுட்பச் சொல்லுக்குப் பதிலாக ‘சிதறி வாழும் யூதர்கள்’ எனப் பொருள் வெளிப்படையாகத் தரப்பட்டுள்ளது.
