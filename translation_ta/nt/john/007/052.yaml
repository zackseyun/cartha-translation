base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: ta
  text: அவர்கள் அவருக்குப் பதிலளித்து, “நீயும் கலிலேயாவைச் சேர்ந்தவனோ?[a] ஆராய்ந்து பார்; கலிலேயாவிலிருந்து எந்தத் தீர்க்கதரிசியும் எழும்புவதில்லை[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீயும் கலிலேயாவைச் சேர்ந்தவன் அல்லவே?” கிரேக்கக் கேள்வி எதிர்மறையான பதிலை எதிர்பார்க்கும் வகையில் அமைந்துள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கலிலேயாவிலிருந்து எந்தத் தீர்க்கதரிசியும் எழுப்பப்படுவதில்லை.” தீர்க்கதரிசிகளைக் கடவுள் எழுப்புகிறார் என்ற சாத்தியமான பொருள் நிழலை இவ்வாறு வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: அவர்கள் அவருக்குப் பதிலளித்து ... என்றார்கள்
  rationale: யோவானின் இரட்டை வினைச்சொல் அமைப்பைத் தமிழில் இயல்பாகவும் அதன் கதையோட்ட வலிமையைத் தக்கவைத்தும் வெளிப்படுத்துகிறது.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: நீயும் கலிலேயாவைச் சேர்ந்தவனோ?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் ஏளனக் கேள்வி என்பதைச் சூழலும் ‘-ஓ?’ வடிவமும் உணர்த்துகின்றன; தமிழ் நடையில் இயல்பாக உள்ளது.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து
  rationale: ஒருவர் அல்லது ஒன்று தோன்றும் இடத்தைக் குறிக்கும் ἐκ என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: ἐραύνησον καὶ ἴδε
  choice: ஆராய்ந்து பார்
  rationale: இரு கட்டளை வினைகளையும் சுருக்காமல், செயலில் விசாரித்து உணர வேண்டும் என்ற சவாலை இயல்பான தமிழில் தருகிறது.
- source_word: προφήτης
  choice: எந்தத் தீர்க்கதரிசியும்
  rationale: கட்டுரையில்லாத பெயர்ச்சொல்லையும் οὐκ உடனான பொதுமறுப்பையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; குறிப்பிட்ட இறுதிக்காலத் தீர்க்கதரிசியைச் சுட்டுவதாக மாற்றவில்லை.
- source_word: οὐκ ἐγείρεται
  choice: எழும்புவதில்லை
  rationale: ஒரு தீர்க்கதரிசி தோன்றுதல் என்ற பொருளையும், கடவுள் எழுப்புதல் என்ற சாத்தியமான மறைநிழலையும் முழுமையாகத் தீர்மானிக்காமல் ‘எழும்பு’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: μή கொண்ட கேள்வியின் எதிர்மறைப் பதில் எதிர்பார்ப்பு
  choice: நீயும் கலிலேயாவைச் சேர்ந்தவனோ?
  alternative: நீயும் கலிலேயாவைச் சேர்ந்தவன் அல்லவே?
  rationale: மூலத்தின் ஏளனத்தையும் எதிர்மறைப் பதில் எதிர்பார்ப்பையும் தமிழ் கேள்வி வடிவமும் சூழலும் தெரிவிக்கின்றன; இன்னும் வெளிப்படையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐγείρεται என்பதின் செய்பாட்டு அல்லது இறையியல் நிழல்
  choice: எழும்புவதில்லை
  alternative: எழுப்பப்படுவதில்லை
  rationale: நடுநிலை/செயப்பாட்டு வடிவம் ஒரு தீர்க்கதரிசி தோன்றுவதையும் கடவுளால் எழுப்பப்படுவதையும் சுட்டக்கூடும். முதன்மை உரை அந்தப் பொருள் விரிவைத் திறந்தவாறே வைக்கிறது; செயப்பாட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘தீர்க்கதரிசி’ என்பது தமிழ் கிறிஸ்தவ வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட சொல். குற்றஞ்சாட்டும் சபையின் ஏளனத் தொனி மிகைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
