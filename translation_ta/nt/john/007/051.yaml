id: JHN.7.51
reference: John 7:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: ta
  text: “நமது சட்டம் ஒரு மனிதரை, முதலில் அவரிடமிருந்து கேட்டு அவர் என்ன செய்கிறார் என்பதை அறியாமல், தீர்ப்பதில்லையே?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “ஒருவரை.” கிரேக்கத்தில் உள்ள “ஒரு மனிதரை” என்பது பொதுவாக எந்த மனிதரையும் குறிக்கும் ஒருமை வடிவமாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: தீர்ப்பதில்லையே?
  rationale: வாக்கியத்தின் தொடக்கத்திலுள்ள μή, எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைக் குறிக்கிறது. தமிழில் எதிர்மறை வினைமுற்றுடன் வரும் ‘-யே?’ இதன் வாதவினா வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ νόμος ἡμῶν
  choice: நமது சட்டம்
  rationale: இது நிக்கொதேமு முன்வைக்கும் யூதச் சட்ட நெறியைக் குறிக்கிறது. ‘நமது சட்டம்’ என்பது இயல்பானதும், இதை மோசேயின் ஐந்நூல்கள் மட்டுமே என்று தேவையின்றிக் குறுக்காததுமாகும்.
- source_word: κρίνει
  choice: தீர்ப்பது
  rationale: κρίνω என்பது இங்கு சட்டரீதியாகத் தீர்ப்பு வழங்குவதைக் குறிக்கிறது. ‘தண்டனைத் தீர்ப்பளிப்பது’ என்று மொழிபெயர்த்தால் மூலத்தில் கட்டாயமில்லாத கண்டனப் பொருள் சேரும்.
- source_word: τὸν ἄνθρωπον
  choice: ஒரு மனிதரை
  rationale: ἄνθρωπον ஒருமையில் பொதுவாக எந்த மனிதரையும் குறிக்கிறது. நவீனத் தமிழில் ‘ஒரு மனிதரை’ என்பது அந்தப் பிரதிநிதி ஒருமையையும் பொதுப் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: ἐὰν μὴ
  choice: -ஆமல்
  rationale: முதலில் விசாரித்து அறிதல் தீர்ப்புக்கு அவசியமான நிபந்தனை என்பதைத் தமிழின் எதிர்மறை வினையெச்ச அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: அவரிடம் முதலில் விசாரித்து
  rationale: παρ’ αὐτοῦ என்பது சம்பந்தப்பட்டவரிடமிருந்தே கேட்டு அறிதலைக் குறிக்கிறது. சட்ட விசாரணைச் சூழலில் ‘அவரிடம் விசாரித்து’ என்பது வெறும் ஒலியைக் கேட்பதைவிட நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது; ‘முதலில்’ πρῶτον என்பதைக் காக்கிறது.
- source_word: γνῷ
  choice: அறிந்துகொண்டு
  rationale: γινώσκω இங்கு வழக்கின் உண்மைகளை விசாரணையால் தெரிந்துகொள்வதைக் குறிக்கிறது. ‘அறிந்துகொண்டு’ அந்தப் பெறுபொருளை வெளிப்படுத்துகிறது.
- source_word: τί ποιεῖ
  choice: அவர் என்ன செய்கிறார் என்பதை
  rationale: ποιεῖ நிகழ்காலத்தில் இருப்பதால் ‘என்ன செய்கிறார்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘என்ன செய்தார்’ என்று இறந்தகாலமாக மாற்றப்படவில்லை.
