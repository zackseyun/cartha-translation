  rationale: The revision replaces the potentially stronger “விசாரித்து” with “அவரிடமிருந்து முதலில் கேட்டு,” which directly represents hearing from the person. It also simplifies “அறிந்துகொள்ளாமல்” to the natural “அறியாமல்,” while preserving the necessary condition, procedural order, generic singular, and rhetorical question. The footnote now supplies a genuine lexical alternative for the generic singular rather than restating a less precise wording.
