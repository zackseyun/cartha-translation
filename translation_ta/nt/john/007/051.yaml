translation_notes:
  register: மரியாதைமிக்க நவீனத் தமிழில், சட்ட விசாரணைச் சூழல் தெளிவாகத் தோன்றுமாறு வடிவமைக்கப்பட்டது. ‘அவர்’ பொதுவான ஒருமை மனிதரைக் குறிக்கிறது. வாதவினாவின் எதிர்மறைப் பதில் எதிர்பார்ப்பை ‘தீர்ப்பதில்லையே?’ காக்கிறது.
