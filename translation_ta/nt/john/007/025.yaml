  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: ta
  text: ஆகவே, எருசலேம்வாசிகளில் சிலர், “அவர்கள் கொல்லத் தேடிக்கொண்டிருக்கிறவர் இவர்தானே?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினை வடிவம், அந்தக் காட்சியில் தொடர்ந்து அல்லது மீண்டும் மீண்டும் பேசப்பட்டதை உணர்த்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து வரும் கதைத் தொடர்ச்சியையும் தர்க்கத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: எருசலேம் நகரத்தாரில் சிலர்
  rationale: எருசலேமில் வாழ்ந்தவர்களில் குறிப்பிடப்படாத ஒரு பகுதியினரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: Οὐχ οὗτός ἐστιν
  choice: இவர்தானே?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் வலிமையைத் தமிழின் ‘தானே’ அமைப்பு இயல்பாகப் பாதுகாக்கிறது.
- source_word: ζητοῦσιν ἀποκτεῖναι
  choice: கொல்லத் தேடிக்கொண்டிருப்பவர்
  rationale: தற்போது தொடரும் நோக்கத்தையும் ‘கொல்லத் தேடுதல்’ என்ற மூலமொழியின் நேரடியான கருத்தையும் காக்கிறது; நீதித்துறை சார்ந்த கூடுதல் பொருளைச் சேர்க்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. இயேசுவைச் சுட்டும் ‘இவர்’ மரியாதையான இயல்பான பயன்பாடாகும்; ‘அவர்கள்’ என்பது மூலத்தில் வினைமுற்றிலேயே உள்ள குறிப்பிடப்படாத பன்மை எழுவாயை வெளிப்படுத்துகிறது.
