id: JHN.7.11
reference: John 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: ta
  text: ஆகவே, யூதர்கள்[a] பண்டிகையின்போது அவரைத் தேடிக்கொண்டிருந்தார்கள்; “அவன் எங்கே?” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யூதேயர்கள்.” யோவானின் கதைச் சூழலில் இது இன்னும் குறிப்பாக யூதேயாவைச் சேர்ந்த யூத அதிகாரிகளைக் குறிக்கக்கூடும்.
    reason: மூலச்சொல் யூதர்களைப் பொதுவாகவோ, யூதேயர்களையோ, சூழலுக்கேற்ப யூத அதிகாரிகளையோ குறிக்கக்கூடியது.
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வோடு இவ்வசனத்தை இணைக்கும் தொடர்ச்சி மற்றும் விளைவு சார்ந்த இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: மூலச்சொல்லின் பொதுவான பொருளை முதன்மை உரையில் காக்கிறது; யூதேயர்கள் அல்லது யூதத் தலைவர்கள் என்ற சூழல்சார் குறுகிய பொருளை உரைக்குள் கட்டாயப்படுத்தவில்லை.
- source_word: ἐζήτουν
  choice: தேடிக்கொண்டிருந்து
  rationale: முற்றுப்பெறாமல் தொடர்ந்து நடந்த செயலைக் காட்டும் கிரேக்க இறந்தகாலத் தொடர்நிலையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ἑορτῇ
  choice: பண்டிகையின்போது
  rationale: முன்னரே குறிப்பிடப்பட்ட பண்டிகை நடைபெற்ற காலத்திற்குள் இச்செயல் நடந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔλεγον
  choice: என்று கேட்டுக்கொண்டிருந்தார்கள்
  rationale: நேரடிக் கூற்று கேள்வி வடிவில் இருப்பதால், தமிழில் ‘கேட்டுக்கொண்டிருந்தார்கள்’ என்பது இயல்பாக உள்ளது; தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சையும் காக்கிறது.
- source_word: ἐκεῖνος
  choice: அவன்
  rationale: எளிய ‘அவர்’ என்பதைக் காட்டிலும் கிரேக்கச் சுட்டுப்பெயரின் தொலைவுப்படுத்தும் தன்மையை இயல்பான தமிழில் பிரதிபலிக்கிறது; ‘மனிதன்’ போன்ற பெயர்ச்சொல்லை மூலத்தில் இல்லாமல் சேர்ப்பதையும் தவிர்க்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’
  alternative: ‘யூதேயர்கள்’ அல்லது, இச்சூழலில் இன்னும் குறிப்பாக, ‘யூதேய யூத அதிகாரிகள்’
  rationale: இந்த வசனம் தானாகவே குறிப்பிட்ட ஒரு குறுகிய குழுவை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே பொதுவான சொற்பொருள் முதன்மை உரையில் வைக்கப்பட்டு, சூழல்சார் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு தொடர்நிலை வினைகளின் நீடித்த அம்சமும் பாதுகாக்கப்பட்டுள்ளது; ‘அவன்’ என்பது மேற்கோளுக்குள் பேசுவோரின் தொலைவுப்படுத்தும் சுட்டலை இயல்பாகக் காட்டுகிறது.
