source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: ta
  text: அதனால் அவருடைய சகோதரர்கள் அவரிடம், “இங்கிருந்து புறப்பட்டு, உம்முடைய சீடர்களும் நீர் செய்கிற செயல்களைக் காணும்படி யூதேயாவுக்குச் செல்லுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய வசனத்துடன் உள்ள காரணவியல்/தொடர்ச்சி உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: அவருடைய சகோதரர்கள்
  rationale: இலக்கண ரீதியாக ஆண்பால் பன்மையையும், சூழலில் இயேசுவின் ஆண் குடும்ப உறுப்பினர்களைக் குறிக்கும் பொருளையும் நேரடியாகப் பேணுகிறது.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: நீர் இங்கிருந்து புறப்பட்டு
  rationale: தற்போதைய இடத்தைவிட்டு நீங்கும்படி கூறும் நேரடியான கட்டளையை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: யூதேயாவுக்குப் போம்
  rationale: இலக்கை நோக்கிய நகர்வைத் தெளிவாகக் காட்டுகிறது; ஒருமை மரியாதை ஏவல் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἵνα καὶ
  choice: அப்போது ... உம்
  rationale: நோக்கத்தையும் ‘கூட/உம்’ என்ற சேர்க்கைப் பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταί σου
  choice: உம்முடைய சீடர்கள்
  rationale: ஆசிரியர்–சீடர் உறவைப் பேணும் யோவான் நற்செய்தியின் வழக்கமான சொல்லாக்கம்.
- source_word: θεωρήσουσιν
  choice: காண்பார்கள்
  rationale: SBLGNT இல் உள்ள எதிர்காலக் குறிப்பு வடிவத்தை நேரடியாகப் பேணுகிறது; இச்சொல் வெறுமனே பார்ப்பதைவிட கவனித்துக் காணும் நுணுக்கத்தையும் கொண்டிருக்கலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: நீர் செய்துவரும் செயல்களை
  rationale: நிகழ்ந்து கொண்டிருக்கும் செயலை இயல்பான தமிழில் காட்டுகிறது; ἔργα என்பதன் யோவான் சார்ந்த கருப்பொருள் முக்கியத்துவத்தைப் பேண ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவருடைய சகோதரர்கள்’ என்பதன் குறிப்பு
  choice: கதையில் பேசுகிறவர்கள் இயேசுவின் ஆண் குடும்ப உறுப்பினர்கள் என்று உரை நேரடியாகக் குறிப்பிடும் அளவிலேயே மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: விரிவான உறவினர்கள் அல்லது குலத்தார்
  rationale: ἀδελφοί என்ற குடும்பச் சொல்லை நேரடியாகப் பேணுகிறது; அவர்களின் துல்லியமான உயிரியல் அல்லது கோட்பாட்டு நிலையை மொழிபெயர்ப்பு கூடுதலாகத் தீர்மானிக்கவில்லை.
- issue: ἵνα உடன் வரும் θεωρήσουσιν என்ற எதிர்கால வினை
  choice: “காண்பார்கள்” என்று எதிர்காலத் தொனியைப் பேணி, வாக்கிய அமைப்பின் மூலம் நோக்கத்தை உணர்த்தப்பட்டுள்ளது.
  alternative: “காணும்படி” அல்லது “காணலாம்”
  rationale: மூலத்தில் உள்ள எதிர்காலக் குறிப்பு வடிவத்தையும் நோக்க வாக்கியத்தின் செயல்பாட்டையும் ஒன்றாகப் பேணுகிறது; சாத்தியம் மட்டுமே என்ற பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்/உம்முடைய/போம்’ பயன்படுத்தப்பட்டுள்ளன; மிகப் பழமையான அல்லது பேச்சுவழக்குச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
