review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the speakers, commands to leave and go to Judea, the disciples, and Jesus’ ongoing works. However, “அப்போது” means “then/at that time” and does not adequately represent the purpose force of ἵνα. The future form θεωρήσουσιν in this purpose construction can be naturally expressed in Tamil with “காணும்படி,” while a footnote preserves the possible future-oriented rendering.
  naturalness: “போம்” is understandable but is not the most natural modern-standard respectful imperative. “செல்லுங்கள்” is clear, dignified modern Tamil. Recasting the sentence with “காணும்படி” produces an idiomatic and complete purpose construction.
  terminology: “சகோதரர்கள்,” “யூதேயா,” “சீடர்கள்,” and “செயல்கள்” are appropriate. “நீர் செய்கிற செயல்கள்” more directly reflects ποιεῖς than “நீர் செய்துவரும் செயல்கள்.”
  issues:
  - severity: medium
    issue: “அப்போது” is used for ἵνα καὶ.
    rationale: It supplies a temporal/consequential sense (“then”) rather than the source’s explicit purpose sense (“so that/in order that”), and it leaves the purpose relation underrepresented.
  - severity: low
    issue: The footnote’s alternative does not correspond coherently to the main rendering.
    rationale: The draft’s main text uses “காண்பார்கள்,” but the footnote begins “அல்லது, ‘காணும்படி,’” even though the latter better represents the purpose construction in Tamil. Reversing the main and alternative renderings resolves this.
  - severity: low
    issue: “போம்” is less natural in modern standard Tamil.
    rationale: “செல்லுங்கள்” is the ordinary respectful imperative and maintains the intended dignified register.
  revised_text: அதனால் அவருடைய சகோதரர்கள் அவரிடம், “இங்கிருந்து புறப்பட்டு, உம்முடைய சீடர்களும் நீர் செய்கிற செயல்களைக் காணும்படி யூதேயாவுக்குச் செல்லுங்கள்” என்றார்கள்.
  revised_footnotes:
