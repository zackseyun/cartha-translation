revisions:
- from: அதனால் அவருடைய சகோதரர்கள் அவரிடம், “நீர் இங்கிருந்து புறப்பட்டு யூதேயாவுக்குப் போம்; அப்போது நீர் செய்துவரும் செயல்களை உம்முடைய சீடர்களும் காண்பார்கள்[a]” என்றார்கள்.
  to: அதனால் அவருடைய சகோதரர்கள் அவரிடம், “இங்கிருந்து புறப்பட்டு, உம்முடைய சீடர்களும் நீர் செய்கிற செயல்களைக் காணும்படி யூதேயாவுக்குச் செல்லுங்கள்” என்றார்கள்.
  rationale: The revision explicitly renders ἵνα καὶ as a purpose clause (“...காணும்படி”), retains the inclusive sense of καὶ through “சீடர்களும்,” and uses a natural modern respectful imperative. The footnote now gives the future rendering as the alternative and explains the Greek future form without overstating its syntactic force.
  reviewer_model: gpt-5.6-terra
