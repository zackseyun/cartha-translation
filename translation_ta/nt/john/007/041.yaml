source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: ta
  text: வேறு சிலர், “இவரே மெசியா[a]” என்று சொல்லிக்கொண்டிருந்தனர். ஆனால் மற்ற சிலர், “மெசியா கலிலேயாவிலிருந்து வருவாரா என்ன?” என்று சொல்லிக்கொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெசியா” என்பதற்கு “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  choice: வேறு சிலர்
  rationale: கூட்டத்திலிருந்த ஒரு வேறுபட்ட குழுவைக் குறிக்கும் பன்மைச் சொல்லின் இயல்பான தமிழ் வடிவம்.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தனர்
  rationale: முற்றுப்பெறாத இறந்தகால வினை கூட்டத்தினரிடையே தொடர்ந்து நிகழ்ந்த அல்லது திரும்பத் திரும்பக் கேட்கப்பட்ட பேச்சைக் காட்டுகிறது.
- source_word: Οὗτός ἐστιν
  choice: இவரே
  rationale: ஒருவரைச் சுட்டி அடையாளப்படுத்தும் கிரேக்கத் தொடரை இயல்பாகவும் வலியுறுத்தலுடனும் தருகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு Χριστός தனிப்பெயராக அல்ல, எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ δὲ
  choice: ஆனால் மற்ற சிலர்
  rationale: δέ காட்டும் முரண்பாட்டையும், வேறொரு குழுவினர் பேசுவதாக உள்ள பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: Μὴ γὰρ
  choice: வருவாரா என்ன?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; γάρ-இன் வாதத் தொனியும் தனிச் சொல்லால் அல்லாமல் கேள்வியின் அமைப்பில் பிரதிபலிக்கிறது.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து
  rationale: இடத்திலிருந்து தோன்றுதல் அல்லது வருதல் என்ற மூலப்பொருளை நேரடியாகத் தருகிறது.
- source_word: ἔρχεται
  choice: வருவார்
  rationale: மெசியாவின் வருகையைப் பற்றிய பொதுவான எதிர்பார்ப்பைத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: விவாதத்தின் பொருள் எதிர்பார்க்கப்பட்ட மெசியா யார், அவர் எங்கிருந்து வருவார் என்பதே. எனவே எபிரேய மெசியானியப் பின்னணியைத் தெளிவாகக் காக்கும் “மெசியா” முதன்மை உரையில் பயன்படுத்தப்பட்டு, வழக்கமான “கிறிஸ்து” அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கலிலேயாவைப் பற்றிய கேள்வியின் எதிர்பார்க்கப்பட்ட பதில்
  choice: “வருவாரா என்ன?” என்று எதிர்மறைப் பதிலை எதிர்பார்க்கும் கேள்வியாக வைத்தல்
  alternative: “கலிலேயாவிலிருந்து வரமாட்டார்” என்ற உறுதிக் கூற்று
  rationale: μή உடைய கிரேக்கக் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்த்தாலும், அது இலக்கண ரீதியில் கேள்வியாகவே உள்ளது. பேசுவோரின் ஐயத்தையும் வாதத் தொனியையும் தீர்மானமான கூற்றாக மாற்றாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் வடிவமைக்கப்பட்டது. “வருவாரா என்ன?” என்பது எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாவை இயல்பாக வெளிப்படுத்துகிறது; பேச்சுவழக்காக மிகத் தாழாமல் இருக்கிறது.
