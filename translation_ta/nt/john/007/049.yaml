base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: ta
  text: ஆனால், திருச்சட்டத்தை[b] அறியாத இந்த மக்கள் கூட்டத்தினர் சபிக்கப்பட்டவர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபத்துக்குள்ளானவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “திருச்சட்டம்” என்பது யூதரின் தோரா, அதாவது மோசேயின் சட்டத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துக்கு எதிர்மாறான பரிசேயர்களின் மதிப்பீட்டை இயல்பாக இணைக்கும் எதிர்மறை இடைச்சொல்.
- source_word: ὁ ὄχλος οὗτος
  choice: இந்த மக்கள் கூட்டம்
  rationale: ὄχλος என்பதன் ‘கூட்டம்/திரள்’ பொருளைத் தருகிறது; ‘கும்பல்’ என்பதில் இல்லாத எதிர்மறைச் சாயலைச் சேர்ப்பதைத் தவிர்க்க ‘மக்கள் கூட்டம்’ பயன்படுத்தப்பட்டது.
- source_word: ὁ μὴ γινώσκων
  choice: அறியாத
  rationale: பெயரடைப்பண்பில் வரும் நிகழ்காலப் பங்கேற்புச் சொல்லைத் தமிழில் இயல்பான பெயரெச்சமாக வழங்குகிறது.
- source_word: τὸν νόμον
  choice: திருச்சட்டத்தை
  rationale: இங்கு யூதர்களின் தோரா/மோசேயின் சட்டத்தைக் குறிக்கும் குறிப்பிட்ட சமயச் சட்டம் என்பதைக் காட்டுகிறது; பொதுவான சட்டம் என்று தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: ἐπάρατοί εἰσιν
  choice: சபிக்கப்பட்டது
  rationale: ἐπάρατος என்பதன் கடுமையான ‘சாபத்துக்குள்ளான/சபிக்கப்பட்ட’ தீர்ப்பைத் தக்கவைக்கிறது. ‘மக்கள் கூட்டம்’ ஒருமைத் தொகுப்புப்பெயராக இருப்பதால் தமிழ் வினைமுற்றும் ஒருமையில் அமைந்துள்ளது.
theological_decisions:
- issue: பேசுபவர்களின் பகைமையான தீர்ப்பை உரையாசிரியரின் இறையியல் கூற்றாகக் காட்ட வேண்டுமா
  choice: பரிசேயர்களின் நேரடிக் கண்டனமாக எந்த மென்மைப்படுத்தலும் இன்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இந்த மக்கள் கூட்டம் சபிக்கப்பட்டதாக அவர்கள் கூறுகிறார்கள்’ என்று உரையாசிரியரை வெளிப்படையாக விலக்கிக் காட்டுதல்.
  rationale: மூலத்தில் இது இயேசுவின் எதிரிகளுடைய நேரடிப் பேச்சு. அவர்களுடைய கடுமையான தீர்ப்பை மொழிபெயர்ப்பு தக்கவைக்க வேண்டும்; அதேவேளை மூலத்தில் இல்லாத விளக்கச் சொற்களைச் சேர்த்து அதை ஆதரிக்கவோ விலக்கவோ கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ என்பது இங்கு யூதர்களின் தோரா, அதாவது மோசேயின் சட்டத்தைக் குறிக்கிறது; வசனத்தின் ஓட்டத்தைச் சுமையாக்காமல் இருக்க இந்த விளக்கம் குறிப்பில் அல்லாது மொழிபெயர்ப்புச் சொல்லிலேயே தெளிவுபடுத்தப்பட்டது.
