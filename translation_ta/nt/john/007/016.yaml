  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: ta
  text: 'ஆகவே இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “என் போதனை என்னுடையது அல்ல; அது என்னை அனுப்பியவருடையது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது என்னை அனுப்பியவரிடமிருந்து வந்தது.” கிரேக்க வேற்றுமை வடிவம் உடைமையையும் மூலத்தையும் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς καὶ εἶπεν
  choice: ஆகவே இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்
  rationale: οὖν என்பதன் தொடர்ச்சி/விளைவு சார்ந்த இணைப்பை ‘ஆகவே’ காக்கிறது. ἀπεκρίθη மற்றும் καὶ εἶπεν ஆகிய இரு வினைகளையும் இயல்பான தமிழில் ‘பதிலளித்துச் சொன்னார்’ என வெளிப்படையாகக் காக்கிறது.
- source_word: Ἡ ἐμὴ διδαχὴ
  choice: என் போதனை
  rationale: διδαχή என்பதற்கு நவீனத் தமிழில் தெளிவாகவும் சமயத் தொழில்நுட்பச் சுமை குறைவாகவும் உள்ள ‘போதனை’ பொருந்துகிறது; ἐμὴ-யின் வலியுறுத்தல் ‘என்’ என்பதில் இயல்பாகத் தெரிவிக்கப்படுகிறது.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: என்னுடையது அல்ல
  rationale: உடைமை அல்லது தன்மூலத் தோற்றத்தை மறுக்கும் கிரேக்கச் சொற்றொடரின் சுருக்கமான எதிர்மறையைத் தக்கவைக்கிறது.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: அது என்னை அனுப்பியவருடையது
  rationale: கிரேக்க வேற்றுமை வடிவம் சுட்டும் உடைமை/மூலம் ஆகிய இரண்டிற்கும் இடமளித்து, முந்தைய ‘என்னுடையது’ என்பதுடனான நேரடியான எதிர்மறை இணைப்பைப் பாதுகாக்கிறது. தமிழில் வாக்கியம் முழுமையடைய ‘அது’ சேர்க்கப்பட்டுள்ளது.
- source_word: πέμψαντός
  choice: அனுப்பிய
  rationale: πέμπω என்பதன் அடிப்படைப் பொருளை நேரடியாகத் தருகிறது; ‘பணியமர்த்திய’ போன்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் போதனைக்கும் அவரை அனுப்பியவருக்கும் உள்ள உறவு
  choice: ‘என்னுடையது அல்ல; அது என்னை அனுப்பியவருடையது’ என்று மூலம்/உடைமை சார்ந்த எதிர்மறையை அப்படியே வைத்தல்
  alternative: ‘என்னை அனுப்பியவரிடமிருந்து வந்தது’ என்று மூலத்தை மட்டும் வெளிப்படையாக்குதல்
  rationale: இயேசு தன்னிச்சையான மூலத்தை மறுப்பதையே கிரேக்கம் கூறுகிறது; அவரது அதிகாரத்தையோ இயல்பையோ குறித்து வசனம் கூறுவதைக் காட்டிலும் அதிகமாக மொழிபெயர்ப்பு தீர்மானிக்கக் கூடாது. ஆகவே நபர்களின் வேறுபாடும் பணியின் ஒருமையும் குறித்த உரையின் இறுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘கோட்பாடு’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘போதனை’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள ‘பதிலளித்து… சொன்னார்’ என்ற இரட்டை அறிமுகமும் தமிழில் இயல்பாகக் காக்கப்பட்டுள்ளது.
