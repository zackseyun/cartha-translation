id: JHN.7.31
reference: John 7:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: ta
  text: ஆனால் கூட்டத்திலிருந்த பலர் அவர்மேல் நம்பிக்கை வைத்தார்கள். அவர்கள், “மேசியா[a] வரும்போது, இவர் செய்த அடையாளங்களைவிட அதிகமான அடையாளங்களை அவர் செய்வாரா என்ன?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கச் சொல்லான Χριστός இங்கு யூதர்களின் மேசிய எதிர்பார்ப்புச் சூழலில் ஒரு பட்டமாகப் பயன்படுத்தப்படுவதால், முதன்மை உரையில் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: ஆனால் கூட்டத்திலிருந்த பலர்
  rationale: ἐκ τοῦ ὄχλου என்பது பெரிய கூட்டத்திலிருந்து ஒரு பகுதியினரைச் சுட்டுகிறது; ‘கூட்டத்திலிருந்த பலர்’ என்பது அந்தப் பகுதிப்பொருளை இயல்பாகத் தருகிறது. δέ சூழலில் காட்டும் மென்மையான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  rationale: εἰς உடன் வரும் πιστεύω, ஒருவரை நோக்கிய தனிப்பட்ட நம்பிக்கையைக் குறிக்கிறது. ‘அவர்மேல் நம்பிக்கை வைத்தார்கள்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வினையான ἔλεγον, தொடர்ந்து அல்லது மீண்டும் மீண்டும் பேசிக்கொண்டிருந்ததைக் காட்டுகிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: இங்கு χριστός ஒரு பெயராக அல்ல, யூத மேசிய எதிர்பார்ப்பின் பட்டமாகப் பயன்படுகிறது; ஆகவே ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὅταν ἔλθῃ
  choice: வரும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை எதிர்காலத்தில் நிகழக்கூடிய வருகையைச் சுட்டுகிறது; தமிழில் ‘வரும்போது’ என்பது இயல்பான வடிவம்.
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: அதிகமான அடையாளங்களை அவர் செய்வாரா என்ன?
  rationale: μή கொண்ட வினா எதிர்மறையான பதிலை எதிர்பார்க்கிறது. தமிழின் ‘செய்வாரா என்ன?’ என்ற அமைப்பு அந்த வினாவியல் எதிர்பார்ப்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: πλείονα σημεῖα
  choice: அதிகமான அடையாளங்கள்
  rationale: πλείονα இங்கு தரத்தைவிட எண்ணிக்கை அல்லது அளவின் ஒப்பீட்டைக் குறிக்கிறது. யோவானில் σημεῖα என்பதற்குள்ள வெளிப்படுத்தும் இறையியல் முக்கியத்துவத்தை ‘அடையாளங்கள்’ காக்கிறது.
- source_word: ὧν οὗτος ἐποίησεν
  choice: இவர் செய்த அடையாளங்களைவிட
  rationale: οὗτος இயேசுவை பொதுமக்கள் சுட்டிப் பேசும் முறையில் குறிக்கிறது; மரியாதைமிக்க நவீன தமிழில் ‘இவர்’ இயல்பானது. ஒப்பீட்டு அமைப்பு தமிழில் தெளிவாக மறுவடிவமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ‘வரும்போது’ என்ற மேசிய எதிர்பார்ப்புச் சூழலில் இது பட்டமாகவே செயல்படுகிறது. ‘மேசியா’ அந்த யூதச் சூழலைக் காக்கிறது; ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
- issue: μή கொண்ட வினாவின் வினாவியல் வலிமை
  choice: எதிர்மறைப் பதிலை எதிர்பார்க்கும் ‘செய்வாரா என்ன?’
  alternative: நடுநிலையான ‘செய்வாரா?’
  rationale: கிரேக்க μή பொதுவாக ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது. கூட்டத்தார் இயேசுவின் அடையாளங்களை மேசியாவுக்குப் போதுமான சான்றாகக் காணும் நுட்பத்தைத் தீர்த்துவிடாமல் இந்த வடிவம் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அடையாளங்கள்’ என்ற சொல் யோவான் நற்செய்தியின் தொடர்ச்சியான சொல்லாட்சியைப் பாதுகாக்கிறது; ‘சொல்லிக்கொண்டிருந்தார்கள்’ கிரேக்க இறந்தகாலத் தொடர்நிலையை வெளிப்படுத்துகிறது.
