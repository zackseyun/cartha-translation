  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: ta
  text: ஆகவே, கூட்டத்திலிருந்த சிலர் இந்த வார்த்தைகளைக் கேட்டபோது, “இவர்தான் உண்மையாகவே அந்தத் தீர்க்கதரிசி[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தத் தீர்க்கதரிசி” என்பது மோசேயைப் போன்ற தீர்க்கதரிசி என்று எதிர்பார்க்கப்பட்டவரைக் குறிக்கலாம் (உபாகமம் 18:15 பார்க்கவும்). சிலர் இதைக் குறிப்பிட்ட எதிர்பார்ப்புப் பட்டப்பெயராக அல்லாமல், பொதுவான பொருளில் “தீர்க்கதரிசி” என்றும் புரிந்துகொள்கிறார்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: கூட்டத்திலிருந்த சிலர்
  rationale: இச்சொற்றொடர் முழுக் கூட்டத்தையும் அல்ல, அதிலுள்ள ஒரு பகுதியினரைக் குறிக்கிறது; இதை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து எழும் விளைவு அல்லது தொடர்ச்சியை இணைப்புச் சொல் வெளிப்படுத்துகிறது.
- source_word: ἀκούσαντες
  choice: கேட்டபோது
  rationale: முதன்மை வினைக்கு முன்னோடு தொடர்புடைய செயலை இயல்பான காலத் துணைவாக்கியமாகக் காட்டுகிறது.
- source_word: τῶν λόγων τούτων
  choice: இந்த வார்த்தைகளை
  rationale: உடனடியாக முந்திய இயேசுவின் பேச்சைக் குறிக்கும் λόγοι என்பதற்கான நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடரும் அல்லது பலரிடையே நிகழும் பேச்சுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: Οὗτός ἐστιν
  choice: இவர்தான்
  rationale: இயேசுவைச் சுட்டும் வலியுறுத்தலை மரியாதையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀληθῶς
  choice: உண்மையாகவே
  rationale: கூற்றின் உறுதியையும் மெய்ம்மையையும் கண்ணியமான நடையில் வலியுறுத்துகிறது.
- source_word: ὁ προφήτης
  choice: அந்தத் தீர்க்கதரிசி
  rationale: குறிப்பிட்ட எதிர்பார்க்கப்பட்ட தீர்க்கதரிசியைச் சுட்டும் கிரேக்க வரையறை உருபின் தன்மையைப் பாதுகாக்கிறது; தமிழில் பெரிய எழுத்தால் பட்டப்பெயரை வேறுபடுத்த இயலாததால் ‘அந்த’ என்பது அத்தன்மையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘ὁ προφήτης’ என்பவர் யார் என்பது
  choice: ‘அந்தத் தீர்க்கதரிசி’ என்று பட்டப்பெயர் போன்ற குறிப்பிட்ட சொல்லாக்கமாக மொழிபெயர்க்கப்பட்டது; அவரை மேசியாவோடு வெளிப்படையாக ஒரே நபராக அடையாளப்படுத்தவில்லை.
  alternative: பொதுவாக ‘ஒரு தீர்க்கதரிசி’ என்று கொள்ளுதல், அல்லது ‘மேசியா’ என்று நேரடியாக விளக்குதல்.
  rationale: இது மோசேயைப் போன்ற எதிர்பார்க்கப்பட்ட தீர்க்கதரிசியைச் சுட்டக்கூடும்; ஆனால் வசனம் அந்த அடையாளத்தை முழுமையாக வரையறுக்கவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான வேதாகம நடை. ‘தீர்க்கதரிசி’ என்பது பரவலாக அறியப்பட்ட சமயச் சொல் என்பதால் வைக்கப்பட்டது; ‘இவர்தான்’ சுட்டுதலின் வலிமையையும் மரியாதையையும் இணைக்கிறது.
