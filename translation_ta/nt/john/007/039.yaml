id: JHN.7.39
reference: John 7:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: ta
  text: அவர்மேல் நம்பிக்கை கொண்டவர்கள் பெற்றுக்கொள்ளவிருந்த ஆவியைக் குறித்து அவர் இதைச் சொன்னார்; ஏனெனில் இயேசு இன்னும் மகிமைப்படுத்தப்படாததால், ஆவி இன்னும் இருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை வெளிப்படையாகக் கூறினால், “ஆவி இன்னும் கொடுக்கப்படவில்லை.” கிரேக்க மூலத்தில், “ஆவி இன்னும் இருக்கவில்லை” என்றே உள்ளது; இது இயேசு இன்னும் மகிமைப்படுத்தப்படாததோடு இணைக்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: ஆவி
  rationale: சூழலில் இது விசுவாசிகள் பெற்றுக்கொள்ளவிருந்த கடவுளுடைய ஆவியைக் குறிக்கிறது. மூலத்தில் ἅγιον (‘பரிசுத்த’) இல்லாததால் ‘பரிசுத்த ஆவி’ என்று விரிவாக்கப்படவில்லை.
- source_word: οὗ
  choice: ஆவியை
  rationale: தமிழில் தொடர்புப் பெயர்ச்சொல்லைத் தனியே மொழிபெயர்ப்பதைவிட, ‘பெற்றுக்கொள்ளவிருந்த ஆவியைக் குறித்து’ என்ற அமைப்பு இயல்பாகவும் மூலத்தின் தொடர்பைத் தெளிவாகவும் தருகிறது.
- source_word: ἔμελλον λαμβάνειν
  choice: பெற்றுக்கொள்ளவிருந்த
  rationale: μέλλω + infinitive தரும் எதிர்நோக்கிய நிகழ்வை, வெறும் எதிர்காலமாகக் குறைக்காமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: தம்மைக் குறித்து நம்பிக்கை கொண்டவர்கள்
  rationale: πιστεύω εἰς என்பதன் இயேசுவை நோக்கிய நம்பிக்கைப் பொருளைத் தருகிறது; இறந்தகால வினையெச்சத்தின் காலநிலையை தமிழில் தேவையற்ற முறையில் மிகத் துல்லியப்படுத்தவில்லை.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: ஆவி இன்னும் இருக்கவில்லை
  rationale: ‘கொடுக்கப்படவில்லை’ என்ற மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல், கிரேக்கத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- source_word: ἐδοξάσθη
  choice: மகிமைப்படுத்தப்படாததால்
  rationale: யோவானில் δοξάζω என்பதற்குரிய நிலையான ‘மகிமைப்படுத்து’ சொல்லைத் தக்கவைத்து, காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμα என்பது ஆவி அப்போது இருப்பிலேயே இல்லை என்று தோன்றக்கூடிய சிக்கல்.
  choice: முதன்மை உரையில் ‘ஆவி இன்னும் இருக்கவில்லை’ என்ற மூலத்திற்கு நெருக்கமான பதற்றத்தைத் தக்கவைத்தல்.
  alternative: ஆவி இன்னும் கொடுக்கப்படவில்லை.
  rationale: ‘கொடுக்கப்பட்டது’ என்பது பொருளை விளக்கும் நியாயமான வாசிப்பு என்றாலும், அந்த வினைச்சொல் கிரேக்கத்தில் இல்லை. ஆகவே முதன்மை உரை மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு விளக்கமான மாற்றை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இறையியல் பதற்றம் விளக்கச் சேர்க்கையால் மறைக்கப்படாமல், அடிக்குறிப்பில் மாற்று வாசிப்பு தரப்பட்டுள்ளது.
