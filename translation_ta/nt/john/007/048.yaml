  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: ta
  text: தலைவர்களிலோ பரிசேயர்களிலோ யாராவது அவரை நம்பினார்களா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில், μή கொண்டு அமைக்கப்பட்ட இந்தக் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: யாராவது ... நம்பியிருக்கிறார்களா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. அதன் மறைபொருளை நேரடி மறுப்பாக மாற்றாமல், இயல்பான தமிழ் வினா வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: ἐκ τῶν ἀρχόντων
  choice: தலைவர்களிலோ
  rationale: இச்சூழலில் ἄρχοντες என்பது யூத சமூகத்தின் அங்கீகரிக்கப்பட்ட ஆளும் தலைவர்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது இயல்பாகவும் போதிய அளவு விரிவாகவும் உள்ளது; ‘-இலோ’ குழுவைச் சேர்ந்தவர் என்ற பொருளையும் மாற்றுச் சேர்க்கையையும் வெளிப்படுத்துகிறது.
- source_word: ἐπίστευσεν
  choice: நம்பியிருக்கிறார்களா
  rationale: கடந்த காலத்தில் நம்பிக்கை கொண்ட நிலை இப்போதும் தொடர்புடையதாக இருப்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது. ‘யாராவது’ என்பதுடன் மரியாதை/மனிதர் குறிக்கும் பன்மை வினைமுற்று வழக்கமான தமிழாகும்.
- source_word: εἰς αὐτόν
  choice: அவரை
  rationale: πιστεύω εἰς என்பதற்கு தமிழில் ‘அவரை நம்புதல்’ இயல்பான இணைவு. கிரேக்க முன்னிடைச்சொல்லை சொல்லுக்குச் சொல் பின்பற்றாமல் அதன் உறவுப்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: ἢ
  choice: -லோ ... -லோ
  rationale: தமிழின் இணை மாற்று அமைப்பு கிரேக்கத்தின் எளிய ‘அல்லது’ தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν Φαρισαίων
  choice: பரிசேயர்களிலோ
  rationale: குழுவின் வழக்கமான பெயரைப் பயன்படுத்தி, அதன் உறுப்பினர்களில் ஒருவரைச் சுட்டும் ἐκ என்பதன் பொருளை ‘-இல்’ வேற்றுமை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எதிர்மறைப் பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி
  choice: ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கும் கேள்வியாகவே மொழிபெயர்த்தல்
  alternative: ‘தலைவர்களிலும் பரிசேயர்களிலும் ஒருவர்கூட அவரை நம்பவில்லை’ என்று நேரடி மறுப்பாக மொழிபெயர்த்தல்
  rationale: μή τις பேசுபவர்கள் ‘இல்லை’ என்ற பதிலை எதிர்பார்ப்பதைக் காட்டினாலும், கிரேக்க உரை கேள்வி வடிவிலேயே உள்ளது. அந்த வடிவம் அவர்களின் இகழ்ச்சியான சொல்லாட்சியையும் உரையின் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தலைவர்கள்’ சூழலுக்குரிய ஆளும் அதிகாரிகளைப் போதிய தெளிவுடன் குறிக்கிறது; கேள்வியின் மறைமுக எதிர்மறை வலிமை அடிக்குறிப்பில் விளக்கப்படுகிறது.
