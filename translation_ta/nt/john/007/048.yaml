  source_fidelity: கிரேக்கத்தின் μή τις அமைப்பிலுள்ள எதிர்மறைப் பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி, இரு குழுக்களிலிருந்தும் ஒருவராவது என்ற பொருள், மற்றும் ‘அவரை நம்புதல்’ என்ற உறவு ஆகியவை சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் ἐπίστευσεν அஓரிஸ்ட் ஒருமை வினை; தமிழில் ‘நம்பினார்களா?’ என்ற எளிய இறந்தகால வினா அதற்கு நெருக்கமானது. ‘நம்பியிருக்கிறார்களா?’ தற்போதுவரை நீடிக்கும் நிலையைச் சிறிது அதிகமாக உணர்த்தலாம்.
  naturalness: ‘தலைவர்களிலோ பரிசேயர்களிலோ யாராவது ...?’ என்பது நவீன பொதுத்தமிழில் இயல்பான கேள்வி வடிவம். ‘நம்பினார்களா?’ இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. பன்மை மரியாதை வினைமுற்று, குறிப்பிடப்படாத ஒருவரைக் குறிக்கும் ‘யாராவது’ உடன் ஏற்றது.
  terminology: ‘தலைவர்கள்’ ἄρχοντες என்பதற்கான போதிய பொதுவான மொழிபெயர்ப்பு; ‘பரிசேயர்கள்’ நிலையான குழுப்பெயர். ‘அவரை நம்புதல்’ πιστεύω εἰς αὐτόν என்பதற்கு இயல்பான தமிழ் இணைவு. அடிக்குறிப்பு μή-வினாவின் எதிர்பார்க்கப்படும் மறுப்புப் பதிலைத் துல்லியமாகக் குறிப்பிடுகிறது.
