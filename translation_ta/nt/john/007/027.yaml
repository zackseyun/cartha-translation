id: JHN.7.27
reference: John 7:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: ta
  text: ஆனால், இவர் எங்கிருந்து வந்தவர் என்று நமக்குத் தெரியும்; மேசியா வரும்போதோ, அவர் எங்கிருந்து வருகிறார் என்பது யாருக்கும் தெரியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய உரையாடலுடன் உள்ள முரண்பாட்டை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: τοῦτον
  choice: இவர்
  rationale: இயேசுவைச் சுட்டும் குறிப்புப்பெயரை நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் வெளிப்படுத்துகிறது.
- source_word: οἴδαμεν
  choice: நமக்குத் தெரியும்
  rationale: பேசுகிறவர்கள் தங்களிடம் இருப்பதாகக் கூறும் அறிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πόθεν ἐστίν
  choice: எங்கிருந்து வந்தவர் / எங்கிருந்து வருகிறார்
  rationale: ஒருவரின் தோற்றுவாய் அல்லது வந்த இடத்தைக் குறிக்கும் πόθεν என்பதைக் காக்கிறது; தமிழில் காலச் சூழலுக்கு ஏற்ற வினை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ὁ δὲ χριστὸς
  choice: மேசியா ... -வோதோ
  rationale: χριστός இங்கு எதிர்பார்க்கப்படும் அபிஷேகம் செய்யப்பட்டவரைக் குறிக்கும் பட்டம்; 'மேசியா' யூத எதிர்பார்ப்புச் சூழலைக் காக்கிறது. -வோதோ இரண்டாம் முரண்பாட்டைக் காட்டுகிறது.
- source_word: ὅταν ἔρχηται
  choice: வரும்போது
  rationale: எதிர்காலத்தில் எதிர்பார்க்கப்படும் வருகையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδεὶς γινώσκει
  choice: யாருக்கும் தெரியாது
  rationale: முழுமையான மறுப்பைத் தெளிவான நவீனத் தமிழில் அளிக்கிறது.
theological_decisions:
- issue: χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து / அபிஷேகம் செய்யப்பட்டவர்
  rationale: இங்கு இது பெயராக அல்ல, மக்கள் எதிர்பார்த்திருந்த மீட்பருக்குரிய பட்டமாகச் செயல்படுகிறது; 'மேசியா' அந்த யூத மற்றும் இறுதிக்கால எதிர்பார்ப்புச் சூழலைக் காக்கிறது.
- issue: மேசியாவின் தோற்றுவாய் குறித்த மக்களின் கூற்று
  choice: மக்களின் கூற்றை விளக்கச் சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘மேசியா எந்த இடத்திலிருந்து வருவார் என்பது யாருக்கும் தெரியாது’ என்று விளக்கமாக விரித்தல்
  rationale: இது கதைசொல்லியின் இறையியல் உறுதிப்படுத்தல் அல்ல; கூட்டத்தினரின் எதிர்பார்ப்பு அல்லது தவறான புரிதலைப் பதிவு செய்கிறது. அதன் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகருக்கு புரியும், கண்ணியமான உரைநடை. முதல் கூறில் ‘வந்தவர்’ என்பது அவர்களுக்குத் தெரிந்ததாகக் கூறப்படும் இயேசுவின் மனித ஊர்த் தோற்றத்தை இயல்பாகச் சொல்கிறது; இரண்டாம் கூறில் ‘வருகிறார்’ என்பது கிரேக்கத்தின் மீளுருவாக்கத்தையும் எதிர்பார்க்கப்படும் மேசியாவின் தோற்றுவாயையும் காக்கிறது.
