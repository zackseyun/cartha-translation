source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: ta
  text: நிக்கொதேமு அவரிடம், “ஒரு மனிதன்[a] முதியவனாக இருக்கும்போது எப்படிப் பிறக்க முடியும்? அவன் தன் தாயின் கருப்பைக்குள் இரண்டாவது முறையாக[b] நுழைந்து பிறக்க முடியாது அல்லவா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒருவர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இலக்கண ஆண்பால் ஒருமைச் சொல் பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘இரண்டாவது முறையாக’ என்று உள்ளது; நிக்கொதேமு இயேசுவின் வார்த்தைகளைச் சொற்பொருளில் புரிந்துகொள்கிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: அவரிடம் ... என்று கேட்டார்
  rationale: யோவானின் வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடையாக அளிக்கிறது; உரை கேள்விகளாக இருப்பதால் ‘கேட்டார்’ என்பது பேச்சின் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: Νικόδημος
  choice: நிக்கொதேமு
  rationale: தமிழ் வேதாகம மரபிலும் நவீனத் தமிழ் உச்சரிப்பிலும் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: Πῶς δύναται
  choice: எப்படிப் ... முடியும்?
  rationale: சாத்தியத்தைப் பற்றிய கிரேக்கக் கேள்விக்கான இயல்பான தமிழ் அமைப்பு.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: கிரேக்கத்தின் ஒருமை பொதுப்பொருளையும் இலக்கண ஆண்பால் வடிவத்தையும் நெருக்கமாகக் காக்கிறது; இது ஆண்களை மட்டும் குறிக்காமல் மனிதரைப் பொதுவாகக் குறிக்கிறது.
- source_word: γεννηθῆναι
  choice: பிறக்க
  rationale: இச்சூழலில் γεννάω என்பதன் செயப்பாட்டு வினையெச்சம் பிறப்பைக் குறிக்கிறது; முந்தைய வசனத்தின் ἄνωθεν குறித்த விளக்கத்தை இங்கே சேர்க்கவில்லை.
- source_word: γέρων ὤν
  choice: முதியவனாக இருக்கும்போது
  rationale: பங்கேற்புவினை அமைப்பை இயல்பான காலச் சூழ்நிலைத் தொடராக மொழிபெயர்க்கிறது.
- source_word: μὴ δύναται
  choice: முடியாது அல்லவா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் μή கேள்வியின் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κοιλίαν
  choice: கருப்பை
  rationale: ‘தாய்’ என்ற சூழலில் κοιλία வயிற்றை பொதுவாக அல்ல, கருப்பையையே குறிக்கிறது.
- source_word: δεύτερον
  choice: இரண்டாவது முறையாக
  rationale: ‘மறுபடியும்’ என்ற விரிவான சொல்லைவிட ‘இரண்டாவது முறை’ என்ற கிரேக்கப் பொருளைத் துல்லியமாகக் காத்து, நிக்கொதேமுவின் நேரடிப் புரிதலை வெளிப்படுத்துகிறது.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: நுழைந்து பிறக்க
  rationale: இரண்டு இணைந்த வினைச்செயல்களையும் வெளிப்படையாக வைத்திருந்து கேள்வியின் தெளிவான தர்க்கத்தைக் காக்கிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஆண்பால் ἄνθρωπος என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஒருமை பிரதிநிதித்துவ ஆண்பால் வடிவத்தைத் தக்கவைக்கிறது; அதேவேளையில் அது ஆண்களை மட்டும் குறிக்கும் என்று விளங்காதபடி அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: யோவான் 3:3-இன் ‘மறுபடியும்/மேலிருந்து’ என்ற பொருளை இவ்வசனத்தில் சேர்ப்பதா
  choice: பிறக்க ... இரண்டாவது முறையாக
  alternative: மறுபடியும் பிறக்க
  rationale: இவ்வசனத்தில் δεύτερον என்பது வெளிப்படையாக ‘இரண்டாவது முறை’ என்று பொருள்படுகிறது. நிக்கொதேமுவின் நேரடிப் புரிதலைக் காத்து, முந்தைய வசனத்தின் ἄνωθεν குறித்த இறையியல் மற்றும் மொழியியல் பதற்றத்தைச் செயற்கையாகத் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முடியாது அல்லவா?’ என்பது எதிர்மறைப் பதிலை எதிர்பார்க்கும் கேள்வியை இயல்பாகக் காட்டுகிறது; ‘கருப்பை’ என்பது இச்சூழலுக்குரிய துல்லியமான நடப்புச் சொல்.
