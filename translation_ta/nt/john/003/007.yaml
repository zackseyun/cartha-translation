  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: ta
  text: ‘நீங்கள் மேலிருந்து[a] பிறக்க வேண்டும்’ என்று நான் உன்னிடம்[b] சொன்னதைக் குறித்து வியப்படையாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மறுபடியும் பிறக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἄνωθεν என்பதற்கு ‘மேலிருந்து’ அல்லது ‘மறுபடியும்/புதிதாக’ என்று பொருள் வரலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘உன்னிடம்’ என்பது கிரேக்கத்தில் ஒருமை (σοι); ஆனால் ‘நீங்கள் பிறக்க வேண்டும்’ என்பதில் உள்ள ‘நீங்கள்’ கிரேக்கத்தில் பன்மை (ὑμᾶς).
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: வியப்படையாதே
  rationale: μή உடன் வரும் aorist subjunctive தடைப் பொருளைத் தருகிறது. ‘வியப்படையாதே’ என்பது இயல்பான நவீனத் தமிழில் θαυμάζω என்பதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: ὅτι
  choice: என்று … சொன்னதைக் குறித்து
  rationale: ὅτι இங்கு இயேசு சொன்னவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோள் அமைப்புடன் ‘என்று’ பயன்படுத்துவது இயல்பானது; வியப்பின் தொடர்பை ‘சொன்னதைக் குறித்து’ தெளிவாக்குகிறது.
- source_word: εἶπόν σοι
  choice: நான் உன்னிடம் சொன்னது
  rationale: σοι ஒருமை என்பதால் ‘உன்னிடம்’ என மொழிபெயர்க்கப்பட்டது. ‘சொன்னேன்’ என்பதைக் காட்டிலும் பெயரெச்ச அமைப்பு முழு வாக்கியத்தைத் தமிழில் இயல்பாக்குகிறது.
- source_word: Δεῖ
  choice: வேண்டும்
  rationale: Δεῖ குறிக்கும் அவசியத்தை ‘வேண்டும்’ சுருக்கமாகவும் இயல்பாகவும் வலுவாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑμᾶς
  choice: நீங்கள்
  rationale: ὑμᾶς பன்மை. ‘நீங்கள்’ பன்மையையும் மரியாதை ஒருமையையும் குறிக்கக்கூடும் என்பதால், இங்கு உண்மையான பன்மை என்பது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: γεννηθῆναι
  choice: பிறக்க
  rationale: யோவான் 3-ன் சூழலில் γεννάω என்பதற்கு ‘பிறத்தல்’ இயல்பானதும் பொருத்தமானதும் ஆகும்; செயப்பாட்டு வடிவத்தின் கருத்து ‘பிறக்க வேண்டும்’ என்ற தமிழ் அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἄνωθεν
  choice: மேலிருந்து
  rationale: ἄνωθεν என்பதன் முதன்மை உரைத் தேர்வாக மேலுலக/தேவ மூலத்தை உணர்த்தும் ‘மேலிருந்து’ வைக்கப்பட்டுள்ளது. ‘மறுபடியும்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: புதிய பிறப்பைக் குறிக்கும் ἄνωθεν என்பதன் பொருள்
  choice: மேலிருந்து
  alternative: மறுபடியும்; புதிதாக
  rationale: யோவான் நூலின் பரந்த சொற்பயன்பாடும் கடவுளிடமிருந்து வரும் பிறப்பின் வலியுறுத்தலும் ‘மேலிருந்து’ என்பதை முதன்மை வாசகமாக ஆதரிக்கின்றன. அதேவேளை, நிக்கொதேமுவுடனான உரையாடலில் உள்ள இரட்டைப் பொருள் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: σοι என்ற ஒருமைக்கும் ὑμᾶς என்ற பன்மைக்கும் இடையிலான வேறுபாடு
  choice: ‘உன்னிடம்’ என்ற ஒருமையையும் ‘நீங்கள்’ என்ற பன்மையையும் உரையில் தக்கவைத்தல்
  alternative: இரண்டையும் மரியாதை ஒருமையாக வாசித்தல்
  rationale: கிரேக்க உரை முதலில் நிக்கொதேமுவை ஒருமையில் நேரடியாகக் குறிப்பிட்டு, பின்னர் பிறப்பின் அவசியத்தைப் பன்மையில் விரிவுபடுத்துகிறது. தமிழில் ‘நீங்கள்’ தெளிவற்றதாக இருக்கக்கூடும் என்பதால் அடிக்குறிப்பு அவசியம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நீ’/‘நீங்கள்’ வேறுபாடு கிரேக்க எண் வேறுபாட்டைக் காட்டுவதற்காக நோக்கத்துடன் பயன்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளன.
