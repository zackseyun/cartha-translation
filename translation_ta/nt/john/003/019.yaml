id: JHN.3.19
reference: John 3:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: ta
  text: 'தீர்ப்பு இதுதான்: ஒளி உலகத்திற்குள் வந்திருக்கிறது; மக்கள் ஒளியைவிட இருளையே அதிகமாக நேசித்தார்கள்; ஏனெனில் அவர்களுடைய செயல்கள் தீயவையாக இருந்தன.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: தீர்ப்பு
  rationale: தீர்ப்பிடும் மதிப்பீட்டையும் அதன் எதிர்மறையான விளைவையும் உள்ளடக்கக்கூடிய பரந்த பொருளைத் தக்கவைக்கிறது; இங்கேயே ‘தண்டனைத் தீர்ப்பு’ என்று குறுக்கவில்லை.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: யோவானின் நிலையான உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: ἐλήλυθεν
  choice: வந்திருக்கிறது
  rationale: ஒளி வந்த நிகழ்வையும் அதன் தொடரும் விளைவையும் கிரேக்க நிறைவுக்காலத்திற்கு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κόσμον
  choice: உலகத்திற்குள்
  rationale: யோவானின் வழக்கமான ‘உலகம்’ என்ற சொல்லைத் தக்கவைத்து, εἰς என்பதன் இயக்கத்தையும் காட்டுகிறது.
- source_word: οἱ ἄνθρωποι
  choice: மக்கள்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் உள்ளடக்கிய பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἠγάπησαν ... μᾶλλον ... ἢ
  choice: ஒளியைவிட இருளையே அதிகமாக நேசித்தார்கள்
  rationale: ‘நேசித்தார்கள்’ என்ற வினையின் அறச்சார்ந்த வலிமையையும், ஒப்பீட்டுத் தேர்வைக் குறிக்கும் μᾶλλον ... ἢ அமைப்பையும் பாதுகாக்கிறது.
- source_word: τὸ σκότος
  choice: இருள்
  rationale: ‘ஒளி’ என்பதற்கு எதிரான யோவானிய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: πονηρὰ τὰ ἔργα
  choice: செயல்கள் தீயவையாக
  rationale: ἔργα என்பதற்கு இயல்பான ‘செயல்கள்’ என்பதையும், πονηρά என்பதன் அறரீதியான தீமையையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘ஒளி’ என்பதன் குறிப்பு
  choice: ‘ஒளி’ என்ற உருவகம் விளக்கமின்றித் தக்கவைக்கப்பட்டது.
  alternative: ‘இயேசு’ அல்லது ‘கிறிஸ்துவாகிய ஒளி’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: சூழல் ஒளியை மகனோடு நெருக்கமாக அடையாளப்படுத்தினாலும், கிரேக்க வசனம் உருவகத்தையே பயன்படுத்துகிறது; அதைத் தக்கவைப்பது யோவானிய இறையியல் அடர்த்தியையும் உண்மையான உரை வடிவத்தையும் பாதுகாக்கிறது.
- issue: κρίσις என்பதன் பொருள்
  choice: ‘தீர்ப்பு’
  alternative: ‘கண்டனத் தீர்ப்பு’ அல்லது ‘தண்டனைத் தீர்ப்பு’
  rationale: வசனம் தீர்ப்பின் தன்மையையோ அடிப்படையையோ விளக்குகிறது; அதன் முடிவை மட்டும் முன்னதாகத் தீர்மானிக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- issue: οἱ ἄνθρωποι என்பதன் பொதுப்பொருள்
  choice: ‘மக்கள்’
  alternative: ‘மனிதர்கள்’ அல்லது ஆண்களை மட்டும் குறிக்கும் சொல்
  rationale: இங்கு சொல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மக்கள்’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் அளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் காரண உறவு தெளிவாக இருக்க ‘செயல்கள் தீயவையாக இருந்ததால்’ என்று இயல்பான தமிழ்ச் சொல் வரிசை பயன்படுத்தப்பட்டது. ‘ஆனால்’ என்பது δέ-யின் மென்மையான எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது.
