id: JHN.3.13
reference: John 3:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: ta
  text: ஒருவரும் பரலோகத்திற்குள் ஏறிச் சென்றதில்லை; பரலோகத்திலிருந்து இறங்கி வந்தவராகிய மானிடமகனைத் தவிர[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்திலிருந்து கீழே வந்தவர்.”
    reason: lexical_alternative
  - marker: b
    text: “மானிடமகன்” என்பது இயேசு தம்மைக் குறிக்கப் பொதுவாகப் பயன்படுத்திய தனிச்சிறப்பான பெயர்; இது தானியேல் 7:13–14-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: ஒருவரும் ... இல்லை
  rationale: எவரையும் விலக்காத கிரேக்க எதிர்மறைப் பொதுப்பெயரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀναβέβηκεν
  choice: ஏறிச் சென்றதில்லை
  rationale: நிறைவுற்ற செயலையும் அதன் தற்போதைய பொருத்தத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மேல்நோக்கிய இயக்கத்தையும் காக்கிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: பரலோகத்திற்குள்
  rationale: εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: முந்திய முழுமையான மறுப்பிலிருந்து ஒரே விதிவிலக்கை இயல்பாகச் சுட்டுகிறது.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: பரலோகத்திலிருந்து இறங்கி வந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினைத் தொடரையும், ஏறுதல்–இறங்குதல் எதிரிணையையும் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: நற்செய்திகளில் இயேசுவின் நிலையான தற்குறிப்புப் பட்டமாகவும் தானியேல் 7-ஐ எதிரொலிப்பதாகவும் இச்சொல் பயன்படுவதால், பொதுவான மனிதர் எனப் பொருளுரைக்காமல் பட்ட வடிவில் தரப்படுகிறது.
theological_decisions:
- issue: “மானிடமகன்” என்ற சொல்லின் கிறிஸ்துவியல் வலிமை
  choice: அங்கீகரிக்கப்பட்ட பட்டமாக “மானிடமகன்” என்று மொழிபெயர்த்தல்
  alternative: மனிதனானவர்
  rationale: யோவான் சூழலில் இத்தொடர் வழக்குச் சொல்லாகவும் வெளிப்பாட்டு நூல்சார் பட்டமாகவும் ஒலிக்கிறது; அதைப் பொதுவான மனிதக் குறிப்பாகத் தீர்த்துவிடாமல் அதன் இடைநூல் மற்றும் இறையியல் இறுக்கத்தைப் பாதுகாக்கிறது.
- issue: ஏறுதல் மற்றும் இறங்குதல் மொழியின் கால/செயற்பாங்கு
  choice: “ஏறிச் சென்றதில்லை” மற்றும் “இறங்கி வந்தவர்”
  alternative: மேலே போனதில்லை ... கீழே வந்தவர்
  rationale: பரலோகத் தோற்றத்தையும் தனித்துவமான அணுகலையும் குறித்த வசனத்தின் வலுவான கூற்றை மேலதிக கோட்பாட்டு விளக்கமின்றி காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். “ஏறிச் சென்றார்/இறங்கி வந்தார்” என்ற இயல்பான இணை, மூலத்தின் இயக்க எதிரிணையைப் பாதுகாக்கிறது; “மானிடமகன்” பட்டச் சொல்லாகத் தொடர்ச்சியாகப் பயன்படுத்தப்படுகிறது.
