source:
  edition: SBLGNT
  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: ta
  text: அவர் தாம் கண்டதையும் கேட்டதையும் அதற்குச் சாட்சி கூறுகிறார்; ஆனாலும் அவருடைய சாட்சியை ஒருவரும் ஏற்றுக்கொள்வதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒருவரும் ஏற்றுக்கொள்வதில்லை” என்பது வலுவான ஒரு பொதுக்கூற்று; அடுத்த வசனமோ அவருடைய சாட்சியை ஏற்றுக்கொள்பவரைப் பற்றிப் பேசுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ ἑώρακεν καὶ ἤκουσεν
  choice: தாம் கண்டதையும் கேட்டதையும்
  rationale: ὃ என்பது கண்டதும் கேட்டதுமான செய்தியின் உள்ளடக்கத்தைக் குறிக்கிறது. ἑώρακεν என்பதன் நிறைவுற்ற செயலும் தொடரும் தொடர்பும் தமிழில் இயல்பாக ‘கண்ட’ என்பதில் வெளிப்படுகிறது; ἤκουσεν உடன் இணைந்த அமைப்பும் காக்கப்படுகிறது.
- source_word: τοῦτο μαρτυρεῖ
  choice: அதைக் குறித்துச் சாட்சி கூறுகிறார்
  rationale: τοῦτο முன் சொல்லப்பட்ட உள்ளடக்கத்தை மீண்டும் சுட்டுகிறது. ‘சாட்சி கூறுகிறார்’ என்பது μαρτυρεῖ என்பதிலுள்ள சாட்சியளிக்கும், நீதிமன்றச் சாயலையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: τὴν μαρτυρίαν αὐτοῦ
  choice: அவருடைய சாட்சியை
  rationale: μαρτυρία என்பதற்கு ‘சாட்சி’ என்று மொழிபெயர்ப்பது அதே வேர் கொண்ட μαρτυρεῖ உடனான சொல் தொடர்பைக் காக்கிறது.
- source_word: οὐδεὶς λαμβάνει
  choice: ஒருவரும் ஏற்றுக்கொள்வதில்லை
  rationale: λαμβάνει இங்கு சாட்சியை வெறுமனே பெற்றுக்கொள்வதைவிட அதை ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘ஒருவரும்’ என்பது οὐδεὶς கூறும் வலுவான பொதுமறுப்பை மென்மைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: ‘ஒருவரும் அவருடைய சாட்சியை ஏற்றுக்கொள்வதில்லை’ என்ற பொதுமறுப்பின் எல்லை
  choice: வசனத்தின் வலுவான பொதுமறுப்பை அப்படியே வைத்தல்
  alternative: மிகச் சிலரே அவருடைய சாட்சியை ஏற்றுக்கொள்கிறார்கள்
  rationale: கிரேக்கம் οὐδεὶς என்று நேரடியாகப் பொதுமறுப்பைக் கூறுகிறது. அடுத்த வசனம் அதை ஏற்றுக்கொள்பவரைப் பற்றிப் பேசுவதால் எழும் யோவானிய விறைப்பை விளக்கமிட்டு நீக்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘தாம்’ மரியாதையுடனும் இயல்பாகவும் எழுவாயைத் தெளிவுபடுத்துகிறது. கிரேக்கத்தின் மீள்சுட்டும் அமைப்பை தமிழில் கனமாக்காமல், ‘அதைக் குறித்துச்’ என்ற பொருளை வினை அமைப்புக்குள் இயல்பாக இணைத்துள்ளது.
