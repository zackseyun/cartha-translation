- from: அவர் தாம் கண்டதையும் கேட்டதையும் குறித்துச் சாட்சி கூறுகிறார்; ஆனாலும் அவருடைய சாட்சியை ஒருவரும் ஏற்றுக்கொள்வதில்லை.[a]
