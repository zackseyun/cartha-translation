  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: ta
  text: அவரில்[b] நம்பிக்கை வைக்கிற ஒவ்வொருவரும்[a] நித்திய வாழ்வை உடையவர்களாக இருக்கும்படியாக.
