  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கை வைக்கிற எவரும்.”
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகள் இதை “அவருக்குள்” என்று தருகின்றன; ஆனால் இங்குள்ள கிரேக்க வாசகம் ἐν αὐτῷ, அதாவது “அவரில்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: பெறும்படியாக
  rationale: முந்தைய கூற்றுடன் இவ்வசனத்தை இணைக்கும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ πιστεύων
  choice: நம்பிக்கை வைக்கிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: πιστεύων
  choice: நம்பிக்கை வைக்கிற
  rationale: யோவானின் பயன்பாட்டில் உள்ள நம்புதல் என்ற கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் அறிவுசார் ஒப்புதலாகக் குறுக்கவில்லை.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: மூலத்தில் εἰς அல்ல, ἐν இருப்பதால், அதன் இடைச்சொல் வடிவத்தை நேரடியாகக் காக்கிறது.
- source_word: ἔχῃ
  choice: பெற
  rationale: ἵνα-வுடன் வரும் subjunctive வடிவத்தை நோக்கத்தைக் காட்டும் தமிழ் வினையெச்ச அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ஐயத்தைச் சேர்க்கவில்லை.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவான் நூலின் சூழலில் காலமற்ற நீடிப்பையும் வரவிருக்கும் காலத்துக்குரிய வாழ்வின் தன்மையையும் சுமக்கும் நிலைபெற்ற, தெளிவான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: ἐν αὐτῷ கொண்ட யோவானிய நம்பிக்கைச் சொற்றொடர்
  choice: அவரில்
  alternative: அவருக்குள்
  rationale: மூல கிரேக்கத்தில் ἐν αὐτῷ என்று இருப்பதால், அதிகம் காணப்படும் εἰς αὐτόν அமைப்பை இங்கு இறக்குமதி செய்யாமல் மூல வாசகத்துக்கு முன்னுரிமை அளிக்கப்படுகிறது.
- issue: πᾶς ὁ πιστεύων என்பதன் பரப்பு
  choice: நம்பிக்கை வைக்கிற ஒவ்வொருவரும்
  alternative: நம்பிக்கை வைக்கிற எவரும்
  rationale: இந்தச் சொற்றொடரின் பொதுவான, அனைவரையும் உள்ளடக்கும் பரப்பைத் தெளிவாக வெளிப்படுத்துகிறது; மூலத்தில் ஆண்களுக்கு மட்டும் உரிய குறிப்பு இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இது முந்தைய வசனத்தைச் சார்ந்த நோக்கக் கிளவி என்பதால், “பெறும்படியாக” என்று முடிக்கப்பட்டுள்ளது.
