review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys every major element of the Greek: Jesus'' response, the doubled solemn affirmation, the singular generic condition, birth from water and spirit, inability, entry, and God''s kingdom. The uncapitalized Tamil «ஆவி» appropriately avoids deciding a disputed referent in a script without case distinction. «தண்ணீராலும் ஆவியாலும்» is a conventional and acceptably close Tamil rendering of the source phrase, without forcing a particular interpretation.'
  naturalness: «இயேசு மறுமொழியாக, … என்றார்» is not fully natural Tamil narrative syntax; «இயேசு பதிலளித்தார்» is direct, idiomatic, and retains the responsive force. «மெய்யாகவே, மெய்யாகவே» gives the emphatic doubled Ἀμὴν naturally in a dignified modern register.
  terminology: «ஆவி» and «தண்ணீராலும் ஆவியாலும்» preserve the interpretive openness of πνεύματος and the coordinated phrase. «கடவுளுடைய அரசாட்சி» is a sound modern rendering of βασιλεία τοῦ θεοῦ and does not reduce it to a merely geographical realm. The footnote anchor correctly follows «ஆவியாலும்».
  issues:
  - severity: low
    issue: The introductory attribution is syntactically awkward.
    rationale: «மறுமொழியாக» ordinarily needs a following speech verb in a construction such as «மறுமொழியாகக் கூறினார்»; «பதிலளித்தார்» is more natural and directly renders ἀπεκρίθη.
  revised_text: 'இயேசு பதிலளித்தார்: “மெய்யாகவே, மெய்யாகவே உனக்குச் சொல்கிறேன்: ஒருவர் தண்ணீராலும் ஆவியாலும்[a] பிறக்காவிட்டால், அவர் கடவுளுடைய அரசாட்சிக்குள் நுழைய முடியாது.”'
