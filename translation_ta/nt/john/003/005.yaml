id: JHN.3.5
reference: John 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “மெய்யாகவே, மெய்யாகவே உனக்குச் சொல்கிறேன்: ஒருவர் தண்ணீராலும் ஆவியாலும்[a] பிறக்காவிட்டால், அவர் கடவுளுடைய அரசாட்சிக்குள் நுழைய முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆவி’ என்பது இங்கு பரிசுத்த ஆவியைக் குறிக்கலாம்; மனித ஆவி அல்லது பொதுவான ஆன்மிகக் கருத்தைக் குறிப்பதாகவும் வாசிக்க முடியும். ‘தண்ணீராலும் ஆவியாலும்’ என்பது சுத்திகரிப்பையும் புதுப்பிப்பையும் குறிக்கும் உருவகம், உடல் பிறப்பும் ஆன்மிகப் பிறப்பும், அல்லது திருமுழுக்கு ஆகியவற்றைக் குறிப்பதாகப் பலவாறு புரிந்துகொள்ளப்பட்டுள்ளது. மொழிபெயர்ப்பு எந்த ஒரு விளக்கத்தையும் முதன்மை உரையில் தீர்மானிக்காமல் கிரேக்கச் சொல்லமைப்பைப் பாதுகாக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: மறுமொழியாக ... என்றார்
  rationale: உரையாடலில் பதிலளிக்கும் பொருளை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: Ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: இரட்டிக்கப்பட்ட வலியுறுத்தலைக் காத்து, நவீன வாசகருக்குப் பொருளை நேரடியாகத் தெரிவிக்கிறது.
- source_word: λέγω σοι
  choice: உனக்குச் சொல்கிறேன்
  rationale: தனிநபர் ஒருமையான σοι என்பதையும் கூற்றின் நேரடித்தன்மையையும் காக்கிறது.
- source_word: ἐὰν μή τις
  choice: ஒருவர் ... பிறக்காவிட்டால்
  rationale: பாலினக் குறிப்பில்லாத பொதுமையான நிபந்தனையை இயல்பான தமிழில் தருகிறது.
- source_word: γεννηθῇ
  choice: பிறக்காவிட்டால்
  rationale: இங்கே ἄνωθεν இல்லை; ஆகவே ‘மறுபடியும்’ அல்லது ‘மேலிருந்து’ என்பதைச் சேர்க்காமல், இறைவினைச் செயப்பாட்டு கருத்தை இயல்பாகக் காக்கிறது.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: தண்ணீராலும் ஆவியாலும்
  rationale: ἐκ என்பதன் தோற்றுவாய்/மூல உறவைத் தமிழின் கருவி-மூல வேற்றுமையால் இயல்பாக வெளிப்படுத்தி, இரண்டு கூறுகளின் தொடர்பை விளக்கவுரையால் தீர்மானிக்கவில்லை.
- source_word: οὐ δύναται εἰσελθεῖν
  choice: நுழைய முடியாது
  rationale: இயல்பான தமிழில் இயலாமையையும் நுழைதல் என்ற செயலையும் தெளிவாகக் காக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசாட்சி
  rationale: βασιλεία என்பதிலுள்ள ஆட்சி/இறையாண்மை கருத்தை நவீன தமிழில் தருகிறது; அதை வெறும் புவியியல் ‘ராஜ்யம்’ என்று மட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: πνεύματος என்பதன் குறிப்பு
  choice: ஆவி—இங்கு பரிசுத்த ஆவியைக் குறிக்கும் வாய்ப்புள்ள வாசிப்பு
  alternative: மனித ஆவி அல்லது பொதுவான ஆன்மிகக் கோட்பாட்டைக் குறிக்கும் ‘ஆவி’
  rationale: யோவானின் சூழலில் பரிசுத்த ஆவியைக் குறிப்பது இயல்பானது. ஆனால் கிரேக்கச் சொல் உருபில்லாமல் இருப்பதாலும் தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததாலும், மாற்று வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது.
- issue: ‘தண்ணீராலும் ஆவியாலும்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் கிரேக்க உருவகத்தை விளக்கத் தீர்மானமின்றி பாதுகாத்தல்
  alternative: சுத்திகரிப்பும் புதுப்பிப்பும்; உடல் பிறப்பும் ஆன்மிகப் பிறப்பும்; குறிப்பாகத் திருமுழுக்கும் எனும் விளக்கங்கள்
  rationale: மூலவாக்கியம் விளக்கத்தைத் தெளிவாகத் தீர்மானிக்காததால், எந்தச் சமயப்பிரிவின் தனிப்பட்ட sacramental அல்லது பிற கோட்பாட்டையும் முதன்மை உரையில் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியக்கூடிய, கண்ணியமான நடை. ‘அரசாட்சி’ என்பது இயல்பும் கருத்துத் துல்லியமும் சமநிலைப்படுத்தத் தேர்ந்தெடுக்கப்பட்டது. முதன்மை உரையில் உள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
