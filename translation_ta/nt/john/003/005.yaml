revisions:
- from: 'இயேசு மறுமொழியாக, “உறுதியாக, உறுதியாக உனக்குச் சொல்கிறேன்: ஒருவர் தண்ணீராலும் ஆவியாலும்[a] பிறக்காவிட்டால், அவர் கடவுளுடைய அரசாட்சிக்குள் நுழைய முடியாது” என்றார்.'
