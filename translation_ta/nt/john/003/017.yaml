id: JHN.3.17
reference: John 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: ta
  text: ஏனெனில், கடவுள் மகனை உலகத்திற்குள் அனுப்பியது உலகத்தை நியாயந்தீர்ப்பதற்காக அல்ல[a]; மாறாக, அவர் மூலமாக உலகம் மீட்கப்படுவதற்காகவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உலகத்துக்குத் தண்டனைத் தீர்ப்பளிப்பதற்காக.” கிரேக்க வினைச்சொல் இச்சூழலில் இவ்வாறு குறுகிய பொருளில் வழங்கப்படலாம்; ஆனால் அதன் அடிப்படைப் பொருள் “நியாயந்தீர்ப்பது.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... இல்லை
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைக் காட்டுகிறது; ‘ஏனெனில்’ அந்தத் தொடர்பை இயல்பான தமிழில் காக்கிறது, οὐ வினையை மறுக்கிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: ἀποστέλλω என்பதன் இயல்பான பொருள் ‘அனுப்பு’; பணியமர்த்துதல் போன்ற கூடுதல் நுணுக்கத்தைத் திணிக்காமல் யோவானின் அனுப்புதல் கருப்பொருளைக் காக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: குறிப்பிட்ட θεός இங்கு இயல்பான நவீன தமிழில் ‘கடவுள்’ என வழங்கப்படுகிறது.
- source_word: τὸν υἱὸν
  choice: மகனை
  rationale: கிரேக்கத்தில் வெளிப்படையான உடைமைச் சொல் இல்லாமல் ‘மகன்’ என்ற பட்டமுறை உறவுச் சொல் உள்ளது; சூழலில் அவர் கடவுளின் மகன் என்பது தெளிவு.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: εἰς உலகம் என்னும் வட்டத்திற்குள் வருதலைக் குறிக்கிறது; ‘உலகத்திற்குள்’ அதன் இயக்க நுணுக்கத்தை நேரடியாகக் காக்கிறது.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: உலகத்தை நியாயந்தீர்ப்பதற்காக
  rationale: κρίνω என்பதன் அடிப்படைப் பரந்த பொருள் ‘நியாயந்தீர்/தீர்ப்பளி’; ‘தண்டனைத் தீர்ப்பளி’ என்று குறுக்காமல் மூலத்தின் பொருள் விரிவையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- source_word: ἀλλ’ ἵνα
  choice: மாறாக ... செய்வதற்காகவே
  rationale: ἀλλά இரு நோக்கங்களுக்கிடையிலான வலுவான முரணைக் காட்டுகிறது; இரண்டாம் ἵνα கூறின் நோக்கத்தையும் வலியுறுத்தலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σωθῇ
  choice: மீட்கப்படுவதற்காக
  rationale: σῴζω இங்கு இறையியல் பரப்புள்ள இரட்சிப்பு/மீட்பைக் குறிக்கிறது; செயப்பாட்டு வடிவத்தை ‘மீட்கப்பட’ காக்கிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: κόσμος என்ற சொல்லின் மறுமொழியைத் தொடர்ந்து ‘உலகம்’ எனக் காக்கிறது; அதை ‘மனிதகுலம்’ என்று விளக்கமாகக் குறுக்கவில்லை.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά + genitive வழிமுறை அல்லது முகமையைச் சுட்டுகிறது; ‘அவர் மூலமாக’ என்பது இதை இயல்பாகவும் அதிக விளக்கமின்றியும் தருகிறது.
theological_decisions:
- issue: σωθῇ என்பதற்கான தமிழ் தெரிவு
  choice: மீட்கப்பட
  alternative: இரட்சிக்கப்பட
  rationale: ‘மீட்கப்பட’ என்பது பொதுவாசகருக்குப் புரியும் தற்போதைய தமிழில் காப்பாற்றுதல்/விடுவித்தல் என்ற பரப்பைத் தருகிறது; குறிப்பிட்ட திருச்சபை வழக்குச் சொல்லை மட்டும் சாராமல் மூலத்தின் இறையியல் பொருளைக் காக்கிறது.
- issue: σωθῇ உடன் முரணில் κρίνῃ என்பதன் பொருள்
  choice: நியாயந்தீர்க்க
  alternative: தண்டனைத் தீர்ப்பளிக்க
  rationale: κρίνω அடிப்படையில் பரந்த ‘நியாயந்தீர்’ என்ற பொருளுடையது. சூழலில் ‘கண்டனம்/தண்டனைத் தீர்ப்பு’ எனப் புரிந்துகொள்ளலாம் என்றாலும், அதை முதன்மை உரையிலேயே குறுக்குவது இறையியல் பதற்றத்தைத் தீர்த்துவிடும்; ஆகவே அந்த மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயந்தீர்ப்பு’ மூலத்தின் பரந்த κρίνω பொருளைக் காக்கிறது; ‘மீட்கப்படுதல்’ இயல்பான மொழியில் σῴζω என்பதன் காப்பு/இரட்சிப்பு பரப்பை வெளிப்படுத்துகிறது. மூலத்தின் இரண்டு நோக்கக் கூறுகளும் தமிழில் தெளிவாகவும் முரண்பாட்டுடன் அமையவும், இரண்டாவது கூறில் சூழலால் விளங்கும் ‘அனுப்பினார்’ மீண்டும் இடப்பட்டுள்ளது.
