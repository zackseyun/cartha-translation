review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents γάρ, God’s sending of the Son into the world, the contrasting purpose clauses, the broad sense of κρίνῃ (''judge''), the passive sense of σωθῇ, and δι’ αὐτοῦ (''through him''). However, repeating ‘அனுப்பினார்’ in the second clause makes the Tamil syntax less exact: the Greek contrasts purposes of the one sending, rather than stating a second sending action.'
  naturalness: The wording is generally modern and clear. Recasting the sentence around ‘அனுப்பியது ... அல்ல; மாறாக ...’ gives a more natural and unambiguous Tamil purpose contrast. ‘அவர் மூலமாக’ appropriately refers to the Son in the immediate context.
  terminology: ‘நியாயந்தீர்ப்பது’ suitably retains the broader force of κρίνω, while the footnote supplies the contextually narrower ‘condemn’ reading. ‘மீட்கப்பட’ is an acceptable modern-standard rendering of σωθῇ and retains the passive form without imposing a confessional register.
  issues:
  - severity: medium
    issue: The second clause repeats ‘அனுப்பினார்’.
    rationale: The Greek has one main verb, ἀπέστειλεν ('sent'), with two contrasting ἵνα purpose clauses. The repeated Tamil verb can be understood correctly, but it unnecessarily recasts the second purpose as another sending statement and weakens the tight contrast.
  revised_text: ஏனெனில், கடவுள் மகனை உலகத்திற்குள் அனுப்பியது உலகத்தை நியாயந்தீர்ப்பதற்காக அல்ல[a]; மாறாக, அவர் மூலமாக உலகம் மீட்கப்படுவதற்காகவே.
