  to: ஏனெனில், கடவுள் மகனை உலகத்திற்குள் அனுப்பியது உலகத்தை நியாயந்தீர்ப்பதற்காக அல்ல[a]; மாறாக, அவர் மூலமாக உலகம் மீட்கப்படுவதற்காகவே.
