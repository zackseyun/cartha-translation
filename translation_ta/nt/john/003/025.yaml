id: JHN.3.25
reference: John 3:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: ta
  text: அப்போது யோவானுடைய சீடர்களுக்கும் ஒரு யூதருக்கும் இடையே தூய்மைப்படுத்துதல்[a] குறித்து ஒரு வாக்குவாதம் எழுந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூய்மையாக்குதல்” அல்லது “சடங்குமுறைத் தூய்மைப்படுத்துதல்.” கிரேக்கச் சொல் பொதுவாகத் தூய்மையாக்குதலைக் குறிக்கலாம்; இச்சூழலில் அது சடங்குசார் பொருளையும் கொண்டிருக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: எழுந்தது
  rationale: ஒரு நிகழ்வு உருவானதை இங்கு குறிக்கிறது; ‘வாக்குவாதம் எழுந்தது’ என்பது இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: οὖν
  choice: அப்போது
  rationale: கதையின் தொடர்ச்சியைக் காட்டும் இடைச்சொல்லாக உள்ளது; ‘எனவே’ என்று மொழிபெயர்த்து தர்க்கரீதியான விளைவை மிகைப்படுத்தாமல், நிகழ்வின் முன்னேற்றத்தைக் காட்டுகிறது.
- source_word: ζήτησις
  choice: வாக்குவாதம்
  rationale: இச்சொல் கலந்துரையாடல் முதல் சர்ச்சை வரை குறிக்கலாம்; சூழலில் கருத்து மோதல் இருப்பதால் ‘வாக்குவாதம்’ பொருத்தமானது.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου ... μετὰ Ἰουδαίου
  choice: யோவானுடைய சீடர்களுக்கும் ஒரு யூதருக்கும்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘யோவானின் சீடர்களிலிருந்து ... ஒரு யூதருடன்’ என்றாலும், விவாதத்தில் ஈடுபட்ட இரு தரப்பையும் தமிழில் இயல்பாகக் குறிக்க இணைப்புவேற்றுமை பயன்படுத்தப்பட்டுள்ளது; Ἰουδαίου ஒருமை என்பதும் பாதுகாக்கப்படுகிறது.
- source_word: περὶ καθαρισμοῦ
  choice: தூய்மைப்படுத்துதல் குறித்து
  rationale: καθαρισμός பொதுவான தூய்மையாக்கத்தையும் சடங்குசார் தூய்மையாக்கத்தையும் குறிக்கக்கூடும். ‘தூய்மைப்படுத்துதல்’ அந்தப் பரப்பைத் திறந்தவாறே வைத்திருக்கிறது.
theological_decisions:
- issue: καθαρισμός என்பதன் சடங்குசார் பொருளை முதன்மை உரையில் வெளிப்படையாகச் சேர்ப்பதா
  choice: தூய்மைப்படுத்துதல்
  alternative: சடங்குமுறைத் தூய்மைப்படுத்துதல் / சுத்திகரிப்பு
  rationale: யோவான் நற்செய்தியின் அருகிலுள்ள சூழல் யூதர்களின் சடங்குசார் தூய்மைப்படுத்துதலை நினைவூட்டினாலும், இந்த வசனம் விவாதத்தின் துல்லியமான வரம்பை வரையறுக்கவில்லை. ஆகவே சடங்குசார் நிழற்பொருளை அடிக்குறிப்பில் தெரிவித்து, முதன்மை உரையில் பொதுவான சொல்லை வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஒரு யூதர்’ என ஒருமை தக்கவைக்கப்பட்டது; எந்தக் குழுவையும் பொதுப்படுத்தவில்லை. அடிக்குறிப்பு குறியீடு உரையில் தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
