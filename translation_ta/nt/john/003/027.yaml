  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: ta
  text: 'யோவான் பதிலளித்துக் கூறினார்: “ஒரு மனிதன்[a], தனக்குப் பரலோகத்திலிருந்து கொடுக்கப்பட்டிருக்காவிட்டால், ஒன்றைக்கூடப் பெற்றுக்கொள்ள முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஒருவர்.” கிரேக்கச் சொல் (ἄνθρωπος) இங்கு ஆணை மட்டும் குறிக்காமல், பொதுவாக ஒரு மனிதரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: யோவான் பதிலளித்துக் கூறினார்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து கூறினார்’ என்ற இரட்டை உரையறிமுக அமைப்பை, தமிழில் இயல்பாகவும் அதன் வடிவம் புலப்படுமாறும் தக்கவைக்கிறது.
- source_word: Οὐ δύναται
  choice: முடியாது
  rationale: δύναμαι என்பதிலுள்ள ஆற்றல் அல்லது இயலாமை என்ற கருத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: ஒருமையில் வரும் பொதுப் பிரதிநிதித்துவச் சொல்லை நெருக்கமாகத் தருகிறது; இது ஆண்களை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: λαμβάνειν
  choice: பெற்றுக்கொள்ள
  rationale: அடுத்துவரும் ‘கொடுக்கப்பட்டிருத்தல்’ என்ற கருத்துடன் பொருந்தி, கைப்பற்றுவதைவிட வழங்கப்பட்டதைப் பெறுதல் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: οὐδὲ ἓν
  choice: ஒன்றைக்கூட
  rationale: ‘ஒன்றும் அல்ல’ என்ற வலியுறுத்தப்பட்ட குறைந்தபட்ச மறுப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐὰν μὴ
  choice: அன்றி
  rationale: கிரேக்கத்தின் விதிவிலக்குக் கூறும் நிபந்தனையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ᾖ δεδομένον
  choice: கொடுக்கப்பட்டிருந்தால்
  rationale: முன்னர் கொடுக்கப்பட்டதன் விளைவு தற்போதும் நிலவுகிறது என்ற சுற்றுவழிப் பூரணச் செயப்பாட்டு வடிவத்தின் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: αὐτῷ
  choice: தனக்கு
  rationale: வாக்கியத்தின் எழுவாயான பொதுமையான ‘ஒரு மனிதன்’ என்பதையே திரும்பச் சுட்டி, தமிழில் தேவையற்ற பாலினச் சுட்டுப்பெயரைத் தவிர்க்கிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: பரலோகத்திலிருந்து
  rationale: இறைமூலத்தைக் குறிப்பாக உணர்த்தக்கூடிய யோவானியச் சொற்றொடரை ‘கடவுளிடமிருந்து’ என்று விளக்கிவிடாமல், அதன் உருவகத்தையும் அகலத்தையும் காக்கிறது.
theological_decisions:
- issue: யோவானின் கூற்றில் பரலோகத்திலிருந்து கொடுக்கப்படுவதன் வரம்பு
  choice: ஒருவர் பெறுவது பரலோகத்திலிருந்து கொடுக்கப்பட்டிருந்தாலன்றி பெற முடியாது என்ற அகன்ற கூற்றை அப்படியே வைத்தல்
  alternative: இதை ஊழியப் பங்கு அல்லது ஆன்மிக அதிகாரத்திற்கு மட்டும் கட்டுப்படுத்துதல்; அல்லது முழுமையான நிர்ணயவாதக் கூற்றாக விரிவாக்குதல்
  rationale: உடனடிச் சூழல் யோவானின் ஊழியத்தையும் இயேசுவின் உயர்வையும் பற்றியது; இருப்பினும் வசனத்தின் சொற்கள் பொதுவான கொடை என்ற கோட்பாட்டையும் தாங்குகின்றன. மொழிபெயர்ப்பு எந்த ஓர் இறையியல் அமைப்பையும் திணிக்காமல் இந்த அகலத்தையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளித்துக் கூறினார்’ என்பது மூலத்தின் இரட்டை உரையறிமுகத்தைத் தக்கவைக்கிறது; ‘தனக்கு’ என்பது பொதுமையான ஒருமையைப் பாதுகாத்தபடி தமிழில் இயல்பாக அமைகிறது.
