    text: 'இன்னும் நேரடியாக: “கடவுள் உண்மையுள்ளவர் என்பதற்கு முத்திரையிட்டுள்ளார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: ஏற்றுக்கொண்டவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் இறந்தகாலப் பங்கேற்புவினை, அந்தச் சாட்சியை ஏற்றுக்கொள்ளும் எவரையும் பொதுவாகக் குறிக்கிறது; தமிழில் ‘ஏற்றுக்கொண்டவர்’ இயல்பாகவும் நிறைவுற்ற செயலை உணர்த்துவதாகவும் உள்ளது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: சூழலில் இது விண்ணிலிருந்து வந்தவர்/மகன் அளிக்கும் சாட்சியைக் குறிக்கிறது; மரியாதைமிக்க நவீன தமிழில் ‘அவருடைய’ இயல்பானது.
- source_word: μαρτυρίαν
  choice: சாட்சியை
  rationale: யோவான் நூலில் காணப்படும் சாட்சி அளித்தல் என்ற சட்டவியல் கருத்தோட்டத்தை ‘சாட்சி’ நேரடியாகவும் புரியத்தக்கவாறும் தக்கவைக்கிறது.
- source_word: ἐσφράγισεν
  choice: உறுதிப்படுத்தியுள்ளார்
  rationale: சொல்லின் நேர்ப்பொருள் ‘முத்திரையிட்டார்’; இங்கு ஒருவர் ஏற்றுக்கொண்டதை அதிகாரபூர்வமாக உறுதிசெய்தல் என்ற உருவகப் பொருள் உள்ளது. முதன்மை உரையில் தெளிவான பொருள் தரப்பட்டு, நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: இது காரணத்தைக் காட்டாமல் உறுதிப்படுத்தப்படும் கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: வரையறுக்கப்பட்ட எழுவாயை நவீன நிலையான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: ἀληθής
  choice: உண்மையுள்ளவர்
  rationale: இச்சூழலில் கடவுள் உண்மை பேசுபவர், நம்பத்தகுந்தவர் என்பதே முதன்மையான கருத்து; ‘உண்மையுள்ளவர்’ இதை இயல்பாகத் தெரிவிக்கிறது, அதேவேளையில் ‘உண்மையானவர்’ என்ற பொருள் நிழலையும் முற்றிலும் நீக்காது.
theological_decisions:
- issue: முத்திரையிடுதல் என்ற உருவகத்தின் வலிமை
  choice: முதன்மை உரையில் ‘உறுதிப்படுத்தியுள்ளார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுள் உண்மையுள்ளவர் என்பதற்கு முத்திரையிட்டுள்ளார்’
  rationale: சாட்சியை ஏற்றுக்கொள்வது கடவுளின் உண்மைத்தன்மையை அதிகாரபூர்வமாக ஏற்று உறுதிசெய்வதாக வசனம் கூறுகிறது. நவீன வாசகருக்குப் பொருள் தெளிவாக இருக்க முதன்மை உரையில் உருவகத்தின் நோக்கம் தரப்படுகிறது; மூல உருவகம் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
- issue: ἀληθής என்பதன் பொருள் பரப்பு
  choice: ‘உண்மையுள்ளவர்’
  alternative: ‘உண்மையானவர்’
  rationale: சூழலில் கடவுளின் சாட்சி நம்பத்தக்கது, அவர் உண்மை பேசுகிறார் என்ற கருத்து முன்னிலையில் உள்ளது. இருப்பினும் சொல்லின் விரிவான ‘உண்மையான’ பொருளை இறுக்கமாக மறுக்கும் வகையில் மொழிபெயர்க்கப்படவில்லை.
