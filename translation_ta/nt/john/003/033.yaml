  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: ta
  text: அவருடைய சாட்சியை ஏற்றுக்கொண்டவர், கடவுள் உண்மையுள்ளவர் என்பதை உறுதிப்படுத்தியுள்ளார்[a].
  philosophy: optimal-equivalence
