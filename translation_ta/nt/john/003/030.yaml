translation:
  language: ta
  text: அவர் பெருக வேண்டும்[a]; நானோ குறைய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மேலும் நேரடியாக: “அந்த ஒருவர் பெருக வேண்டும்; ஆனால் நான் குறைய வேண்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: அவர்
  rationale: சூழலில் இது இயேசுவைக் குறிக்கிறது. தமிழில் மரியாதையுடனும் இயல்பாகவும் ஆண்பால் ஒருமைச் சுட்டுப்பெயராக ‘அவர்’ அமைகிறது; கிரேக்கத்தின் சுட்டுத்தன்மையைச் சொற்சொல்லாகத் திணிக்காமல் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவை, தவிர்க்க முடியாத ஒழுங்கு ஆகிய வலிமையை இயல்பான தமிழில் ‘வேண்டும்’ காக்கிறது; அந்தத் தேவையின் இயல்பை வசனம் கூறுவதைக் கடந்து வரையறுக்கவில்லை.
- source_word: αὐξάνειν
  choice: பெருக
  rationale: தொடர்ந்து அதிகரித்தல், பெருமை அல்லது செல்வாக்கில் உயர்தல் ஆகிய விரிந்த பொருளை ‘பெருக’ தாங்குகிறது; எண்ணிக்கை வளர்ச்சியாக மட்டும் கட்டுப்படுத்துவதில்லை.
- source_word: ἐμὲ
  choice: நான்
  rationale: முடிவிலியின் கருத்தெழுவாயாக வரும் கிரேக்க வேற்றுமை வடிவம், இயல்பான தமிழில் எழுவாய் வடிவமான ‘நான்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: δὲ
  choice: நானோ
  rationale: இரு உறுப்புகளுக்கிடையிலான மாறுபாட்டைத் தமிழில் ‘-ஓ’ என்னும் எதிர்நிலைத் துகள் இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐλαττοῦσθαι
  choice: குறைய
  rationale: குறைந்து போதல் அல்லது சிறியதாகுதல் என்ற பொருளைத் தருகிறது; ‘பெருக’ என்பதற்கு இணையான சுருக்கமான எதிர்சொல்லாக இருந்து மூலத்தின் சமநிலையைக் காக்கிறது.
theological_decisions:
- issue: δεῖ வெளிப்படுத்தும் தேவையின் இயல்பு
  choice: இருவரையும் சார்ந்த ‘வேண்டும்’ என்ற அமைப்பால் அவசியமான ஒழுங்கு வெளிப்படுத்தப்படுகிறது; அது எத்தகைய அவசியம் என்பது மேலதிகமாக வரையறுக்கப்படவில்லை.
  alternative: இதை வெறும் நடைமுறைத் தேவையாகவோ, வெளிப்படையாகக் கூறப்பட்ட தெய்வீக ஆணையாகவோ விரிவுபடுத்துதல்.
  rationale: சூழலில் இரட்சிப்பு வரலாற்றுக்குரிய தெய்வீகப் பொருத்தம் உணரப்படலாம்; ஆயினும் கிரேக்க வாசகம் அந்தத் தேவையின் செயல்முறையைத் தெளிவாகக் கூறவில்லை. ‘வேண்டும்’ அதன் இறையியல் எடையையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, கண்ணியமான, எளிதில் நினைவில் நிற்கும் வாக்கிய அமைப்பு. ‘அவர்’ என்பது சூழலுக்கேற்ற மரியாதை வடிவம்; மூல கிரேக்கத்தில் பெரிய எழுத்து மூலம் காட்டப்படும் தனிச்சிறப்பு எதுவும் இல்லை. அடிக்குறி குறியீடு தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
