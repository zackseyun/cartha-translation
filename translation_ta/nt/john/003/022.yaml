source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, இயேசு தம் சீடர்களுடன் யூதேயா நாட்டிற்குச் சென்றார். அங்கே அவர் அவர்களோடு தங்கியிருந்து, திருமுழுக்கு அளித்துக்கொண்டிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவான் 4:2-ல், இயேசு தாமே திருமுழுக்கு அளிக்கவில்லை; அவருடைய சீடர்களே அளித்தார்கள் என்று பின்னர் தெளிவுபடுத்தப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரையும் யோவானின் கதைத் தொடர்ச்சியையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἦλθεν
  choice: சென்றார்கள்
  rationale: இலக்கணத்தில் வினை ஒருமையாக இருந்தாலும், இயேசுவும் சீடர்களும் இணைந்து குறிப்பிட்ட இடத்தை நோக்கிச் சென்ற நிகழ்வைத் தமிழில் இயல்பாகத் தெரிவிக்கப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: யூதேயா நாட்டுப்புறத்திற்கு
  rationale: γῆ இங்கு எருசலேம் நகரத்துக்கு வெளியேயுள்ள யூதேயப் பகுதியைக் குறிக்கக்கூடும்; ‘நாட்டுப்புறம்’ அந்தப் பிராந்திய நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διέτριβεν
  choice: சில காலம் தங்கி
  rationale: நிறைவுறாத கால வினையின் தொடர்ச்சியையும், ஓரிடத்தில் காலம் செலவிட்டல் அல்லது தங்கியிருத்தல் என்ற பொருளையும் தருகிறது.
- source_word: μετ’ αὐτῶν
  choice: அவர்களோடு
  rationale: சீடர்களுடன் இருந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: ἐβάπτιζεν
  choice: திருமுழுக்குக் கொடுத்துவந்தார்
  rationale: தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட, கண்ணியமான சொற்றொடர்; வினையின் தொடர்ச்சியான செயற்பாட்டையும் ‘கொடுத்துவந்தார்’ காட்டுகிறது. செய்முறையின் குறிப்பிட்ட வடிவத்தைத் தனியாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: யோவான் 4:2-ஐ முன்னிட்டு திருமுழுக்குக் கொடுத்த செயலின் கர்த்தா
  choice: இந்த வசனத்தின் இலக்கணப்படி இயேசுவையே கர்த்தாவாக வைத்து மொழிபெயர்த்து, பின்னர் வரும் விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையிலேயே சீடர்களைச் செய்பவர்களாக மாற்றுதல்
  rationale: ἐβάπτιζεν என்ற ஒருமை வினையின் இயல்பான கர்த்தா இயேசு. யோவான் 4:2 இயேசு தாமே நேரடியாகச் செய்யவில்லை, சீடர்களே செய்தார்கள் என்று பின்னர் தெளிவுபடுத்துகிறது; ஆகவே 3:22-ன் மொழியைக் குலைக்காமல் இரு கூற்றுகளின் பதற்றமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘யூதேயா நாட்டுப்புறம்’ என்பது நகரத்துக்கு அப்பாலுள்ள யூதேயப் பகுதியை உணர்த்துகிறது; ‘சில காலம் தங்கி’ என்பது διέτριβεν என்பதன் நீடித்த செயல்பாட்டை இயல்பாகத் தருகிறது.
