source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: ta
  text: யோவானும் சாலீமுக்கு அருகிலுள்ள ஐனோனில் திருமுழுக்கு கொடுத்துக்கொண்டிருந்தார்[a], ஏனெனில் அங்கே நிறைய தண்ணீர் இருந்தது[b]; மக்களும் அங்கு வந்து திருமுழுக்கு பெற்றுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திருமுழுக்கு கொடுத்தல்” என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க வினைச்சொல்லை “முழுக்குதல்” என்றும் மொழிபெயர்க்கலாம். இங்கு நிலைபெற்ற சமயச்சொல் பயன்படுத்தப்பட்டுள்ளது; அது திருமுழுக்கு கொடுக்கப்பட்ட முறையைத் தானாகவே முடிவுசெய்வதில்லை.
    reason: lexical_alternative
  - marker: b
    text: “மிகுந்த தண்ணீர் இருந்தது” என்றும் மொழிபெயர்க்கலாம்; சொற்சார்ந்து, “பல நீர்கள் இருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: யோவானும் … திருமுழுக்குக் கொடுத்துக்கொண்டிருந்தார்
  rationale: δέ-க்கு வலுவான எதிர்மறைப் பொருளையோ, மூலத்தில் இல்லாத காலக்குறிப்பையோ சேர்க்காமல், καί-ன் ‘யோவானும்’ என்ற இணைப்புப் பொருள் காட்டப்படுகிறது. ἦν + நிகழ்காலப் பெயரெச்சம் கடந்தகாலத்தில் தொடர்ந்த செயலைக் குறிப்பதால் ‘கொடுத்துக்கொண்டிருந்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: சாலீமுக்கு அருகிலுள்ள ஐனோனில்
  rationale: இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டு, ἐγγύς குறிக்கும் அண்மையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: ஏனெனில் அங்கே நிறைய தண்ணீர் இருந்தது
  rationale: ὅτι இங்கு காரணத்தைக் காட்டுகிறது. பன்மையான ὕδατα πολλὰ என்பதன் நடைமுறைப் பொருளை இயல்பான தமிழில் ‘நிறைய தண்ணீர்’ எனத் தருகிறது; சொற்சார்ந்த பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: παρεγίνοντο
  choice: மக்களும் அங்கு வந்து
  rationale: எழுவாய் கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், பன்மை வினைச்சொல்லின் மனிதக் குறிப்பை இயல்பான தமிழில் ‘மக்கள்’ என வெளிப்படுத்துகிறது. முற்றுப்பெறாத காலம் காட்டும் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த வருகை ‘வந்து … கொண்டிருந்தார்கள்’ என்ற அமைப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐβαπτίζοντο
  choice: திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத காலத்தின் தொடர்ச்சியையும், செயப்பாட்டு வடிவத்தில் மக்கள் திருமுழுக்கைப் பெற்றதையும் காக்கிறது.
theological_decisions:
- issue: βαπτίζω என்பதன் மொழிபெயர்ப்பு
  choice: திருமுழுக்குக் கொடுத்தல் / திருமுழுக்குப் பெறுதல்
  alternative: முழுக்குதல் / முழுக்கப்படுதல்
  rationale: ‘திருமுழுக்கு’ என்பது தற்போதைய தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற சமயச்சொல். கிரேக்க வினைச்சொல்லை ‘முழுக்குதல்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் முதன்மை உரையில் அந்தச் சொல்லைப் பயன்படுத்துவது சடங்கின் முறை குறித்த ஒரு பிரிவுசார் முடிவை தேவையின்றி முன்னிறுத்தக்கூடும். மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὕδατα πολλὰ என்ற பன்மை
  choice: நிறைய தண்ணீர்
  alternative: பல நீர்நிலைகள் / ஏராளமான நீர்கள்
  rationale: கிரேக்கத்தின் பன்மை வடிவம் பல நீராதாரங்களையோ மிகுதியான தண்ணீரையோ குறிக்கக்கூடும். முதன்மை உரை இயல்பான தமிழில் அளவின் மிகுதியைக் காட்டுகிறது; பன்மையால் உண்டாகும் சாத்தியமான வேறுபாடு அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் எளிய வாசிப்புத் தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘யோவானும்’ என்பது சூழலிலுள்ள இணைப்பைச் சுருக்கமாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘இப்போது/அப்போது’ சேர்க்கப்படவில்லை. இடப்பெயர்கள் ‘ஐனோன்’, ‘சாலீம்’ என ஒலிபெயர்க்கப்பட்டுள்ளன.
