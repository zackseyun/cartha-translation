source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: ta
  text: மகனில் நம்பிக்கை வைக்கிறவருக்கு நித்திய வாழ்வு உண்டு. ஆனால் மகனுக்குக் கீழ்ப்படியாதவர்[a] வாழ்வைக் காணமாட்டார்; மாறாக, கடவுளின் கோபம் அவர்மேல் நிலைத்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகனை நம்ப மறுப்பவர்.” கிரேக்க வினைச்சொல் கீழ்ப்படியாமையையும் நம்ப மறுப்பதையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν
  choice: மகனில் நம்பிக்கை வைக்கிறவர்
  rationale: εἰς உடன் வரும் πιστεύω, மகனை நோக்கிய தனிப்பட்ட நம்பிக்கையையும் சார்ந்திருத்தலையும் குறிக்கிறது. தமிழில் ‘நம்பிக்கை வைக்கிறவர்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது; ‘மகன்’ என்ற யோவானிய பட்டத்தையும் கூடுதல் உடைமைச்சொல் இன்றி காக்கிறது.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: நிலைவாழ்வு உண்டு
  rationale: நிகழ்கால ἔχει, இது எதிர்கால வாக்குறுதி மட்டுமல்ல, இப்போதே உள்ள உடைமை என்பதைக் காட்டுகிறது. ‘நிலைவாழ்வு’ காலநீட்சியையும் வரவிருக்கும் காலத்துக்குரிய வாழ்வின் தன்மையையும் சுருக்கமாகத் தருகிறது.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: ஆனால் மகனுக்குக் கீழ்ப்படியாதவர்
  rationale: ἀπειθέω என்பதில் கீழ்ப்படியாமையும் நம்ப மறுப்பதும் அடங்கலாம். முதன்மை உரை அதன் விரிவான ‘கீழ்ப்படியாதவர்’ என்ற பொருளைக் காக்கிறது; நம்ப மறுத்தல் என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐκ ὄψεται ζωήν
  choice: வாழ்வைக் காணமாட்டார்
  rationale: ὁράω என்பதன் எதிர்கால வடிவத்தை ‘காணமாட்டார்’ என்று வழங்குவது யோவானிய சொற்றொடரைப் பாதுகாக்கிறது; அதை ‘வாழ்வு இருக்காது’ என்று சமப்படுத்துவதில்லை.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: கடவுளின் கோபம்
  rationale: தெய்வீக நியாயத்தீர்ப்பைக் குறிக்கும் ὀργή என்பதைக் மென்மைப்படுத்தாமல் நேரடியாக ‘கோபம்’ என்று மொழிபெயர்க்கிறது.
- source_word: μένει ἐπ’ αὐτόν
  choice: அவர்மேல் நிலைத்திருக்கிறது
  rationale: நிகழ்கால μένει தொடரும் நிலையைக் காட்டுகிறது. ‘நிலைத்திருக்கிறது’ என்பது யோவானிய μένω வினையின் தொடர்ச்சியான கருத்தையும் ἐπί குறிக்கும் ‘மேல்’ என்ற உறவையும் காக்கிறது.
theological_decisions:
- issue: πιστεύων என்பதற்கு எதிராக வரும் ἀπειθῶν என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘கீழ்ப்படியாதவர்’; அடிக்குறிப்பில் ‘மகனை நம்ப மறுப்பவர்’
  alternative: ‘நம்பாதவர்’ அல்லது ‘நம்ப மறுப்பவர்’ என்பதை மட்டும் முதன்மை உரையில் இடுதல்
  rationale: சூழலில் நம்பிக்கையும் மறுப்பும் எதிரெதிராக இருந்தாலும், ἀπειθέω என்பதிலுள்ள கீழ்ப்படியாமையின் வலிமையை அழிக்காமல், இரு பொருள் வாய்ப்புகளும் காக்கப்படுகின்றன.
- issue: நிலைவாழ்வும் கடவுளின் கோபமும் குறிக்கும் காலநிலை
  choice: நிலைவாழ்வு இப்போது ‘உண்டு’; கோபம் இப்போது ‘நிலைத்திருக்கிறது’
  alternative: இரண்டையும் எதிர்கால நிலைகளாக மட்டும் விளக்குதல்
  rationale: ἔχει மற்றும் μένει இரண்டும் நிகழ்கால வினைகள். அதே நேரத்தில் ‘வாழ்வைக் காணமாட்டார்’ என்பது எதிர்காலத்தைச் சுட்டுகிறது; உரையிலுள்ள இந்தக் காலவியல் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘மகன்’ என்ற பட்டம் விளக்கச் சேர்க்கையின்றி வைக்கப்பட்டுள்ளது. ஒருமை வடிவங்கள் பொதுவாக எந்த மனிதரையும் குறிக்கின்றன.
