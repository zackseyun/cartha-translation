  terminology: ‘பூமிக்குரியவை’ / ‘பரலோகத்துக்குரியவை’ preserves the deliberate contrast well. ‘பரலோகம்’ is established, comprehensible Tamil biblical usage and does not overdefine the referent. ‘நம்பவில்லை’ is a suitable unexpanded rendering of πιστεύετε.
