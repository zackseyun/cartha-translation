id: JHN.3.12
reference: John 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: ta
  text: பூமிக்குரியவற்றை நான் உங்களிடம் சொன்னபோதும் நீங்கள் நம்பவில்லை என்றால், பரலோகத்துக்குரியவற்றை உங்களிடம் சொன்னால் எப்படி நம்புவீர்கள்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: பூமிக்குரியவற்றை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை நடுநிலைப் பெயரடை. எதிரிலுள்ள τὰ ἐπουράνια என்பதுடனான நேரான முரண்பாட்டைப் பேணுவதோடு, அதன் பொருளை ‘பூமியில் நிகழ்பவை’ அல்லது ‘பூமிசார் உவமைகள்’ என்று குறுக்காமல் விடுகிறது.
- source_word: εἶπον
  choice: நான் ... சொன்னபோதும்
  rationale: λέγω என்பதன் இறந்தகால வடிவம் இயேசு முன்பு கூறியதைக் குறிக்கிறது. καὶ οὐ πιστεύετε உடன் இணையும் வாக்கிய உறவை இயல்பான தமிழில் ‘சொன்னபோதும் ... நம்பவில்லை’ எனத் தருகிறது.
- source_word: οὐ πιστεύετε
  choice: நீங்கள் நம்பவில்லை
  rationale: நிகழ்கால வினை வடிவம் இங்கு அவர்களுடைய தற்போதைய நம்பாமையைச் சுட்டுகிறது. சூழலில் இயல்பான தமிழில் ‘நம்பவில்லை’ என்று மொழிபெயர்க்கப்படுகிறது; ‘நம்பிக்கை வைக்கவில்லை’ என விரிவாக்கப்படவில்லை.
- source_word: πῶς ... πιστεύσετε
  choice: எப்படி நம்புவீர்கள்?
  rationale: πῶς தொடங்கும் வினாவையும் எதிர்கால πιστεύσετε வடிவத்தையும் நேரடியாகப் பேணி, நம்புவதற்கான சாத்தியத்தைச் சுட்டும் வினாவை விளக்கவுரை இன்றி தருகிறது.
- source_word: ἐὰν εἴπω
  choice: சொன்னால்
  rationale: ἐὰν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்கால நிபந்தனையைச் சுட்டுகிறது; தமிழில் ‘சொன்னால்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τὰ ἐπουράνια
  choice: பரலோகத்துக்குரியவற்றை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை நடுநிலைப் பெயரடை. ‘பூமிக்குரியவை’ என்பதற்கு இணையான எதிர்ச் சொல்லாக இருந்து, ‘பரலோகத்தில் உள்ளவை’ அல்லது ‘ஆழ்ந்த தெய்வீக இரகசியங்கள்’ என்று பொருளை வரையறுக்காமல் பேணுகிறது.
theological_decisions:
- issue: ‘பூமிக்குரியவை’ மற்றும் ‘பரலோகத்துக்குரியவை’ ஆகியவற்றுக்கிடையிலான வேறுபாட்டின் பொருள்
  choice: இரு வகைகளையும் நேராக மொழிபெயர்த்து, அவை எதைக் குறிப்பதாகும் என்பதை வசனத்துக்கு அப்பால் வரையறுக்காமல் வைத்தல்.
  alternative: ‘பூமிக்குரியவை’ என்பதை பூமிசார் உவமைகள் அல்லது பூமியில் நிகழும் உண்மைகள் என்றும், ‘பரலோகத்துக்குரியவை’ என்பதை ஆழ்ந்த தெய்வீக இரகசியங்கள் என்றும் விளக்குதல்.
  rationale: கிரேக்க உரை இரு வகை வெளிப்பாடுகளை வேறுபடுத்துகிறது; ஆனால் அவற்றுக்கான குறுகிய விளக்கத்தைத் திணிப்பதில்லை. பரந்த சொற்களைப் பேணுவது உரையின் உண்மையான தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. ‘பரலோகம்’ என்பது யோவான் சூழலிலும் தமிழ் வேதாகமப் பயன்பாட்டிலும் இயல்பான சொல்லாகும். பொருளில் உண்மையான மாற்றைத் தேவைப்படுத்தும் அடிக்குறிப்பு இல்லாததால் குறியீடுகள் சேர்க்கப்படவில்லை.
