source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: ta
  text: அவர்மேல் நம்பிக்கை வைக்கிறவர் தீர்ப்புக்கு உட்படுவதில்லை[a]. ஆனால் நம்பிக்கை வைக்காதவர் ஏற்கெனவே தீர்ப்புக்கு உட்பட்டிருக்கிறார்; ஏனெனில் அவர் கடவுளின் ஒரே மகனின்[b] பெயரில் நம்பிக்கை வைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீர்ப்புக்கு உட்படுவதில்லை’ என்பதற்கு ‘தண்டனைத் தீர்ப்புக்கு உட்படுவதில்லை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் κρίνω, சூழலுக்கேற்ப ‘தீர்ப்பிடு’ அல்லது ‘தண்டனைத் தீர்ப்பளி’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரே மகன்’ என்பதற்கு ‘ஒப்பற்ற மகன்’ என்றும் மொழிபெயர்க்கலாம்; மரபாக, ‘ஒரேபேறான மகன்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: அவர்மேல் நம்பிக்கை வைக்கிறவர்
  rationale: பெயரெச்சத் தொடரின் பொதுவான, தொடர்நிலைச் சாயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; εἰς என்பதன் ஒருவரை நோக்கிய நம்பிக்கையையும் ‘மேல்’ காட்டுகிறது.
- source_word: οὐ κρίνεται
  choice: தீர்ப்புக்குள்ளாவதில்லை
  rationale: κρίνω என்பதன் அடிப்படை நீதித்துறைப் பொருளான ‘தீர்ப்பிடுதல்’ என்பதைக் காக்கிறது; சூழலில் உள்ள தண்டனைத் தீர்ப்பின் சாயலை முற்றிலும் மறைக்காமலும் ‘தண்டிக்கப்படுவதில்லை’ என்று பொருளைச் சுருக்காமலும் உள்ளது.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: ஆனால் நம்பிக்கை வைக்காதவர்
  rationale: δέ குறிக்கும் முரண்பாட்டையும், பெயர்ச்சொல்லாகச் செயல்படும் பெயரெச்சத்தின் பொதுவான குறிப்பையும் இயல்பாகத் தருகிறது.
- source_word: ἤδη κέκριται
  choice: ஏற்கெனவே தீர்ப்புக்குள்ளாகியிருக்கிறார்
  rationale: நிறைவுக்காலம் காட்டும், முன்பே நிகழ்ந்த செயலில் இருந்து தொடரும் தற்போதைய நிலையை ‘ஆகியிருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: ஏனெனில் … நம்பிக்கை வைக்கவில்லை
  rationale: ὅτι காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் எதிர்மறை நிறைவுநிலையை இயல்பாகத் தெரிவிக்க ‘நம்பிக்கை வைக்கவில்லை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς τὸ ὄνομα
  choice: பெயர்மேல்
  rationale: யோவானின் சொற்பயன்பாட்டிலுள்ள ‘பெயர்’ என்பதை விளக்கவுரை செய்து மாற்றாமல் காக்கிறது; அந்த நபரின் வெளிப்படுத்தப்பட்ட அடையாளத்தை நோக்கிய நம்பிக்கையை ‘மேல்’ காட்டுகிறது.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: கடவுளின் ஒரே தனித்துவமுள்ள மகன்
  rationale: μονογενής குறிக்கும் ஒப்பற்ற தனித்துவத்தையும் ஒரே மகன் என்ற உறவையும் வெளிப்படுத்துகிறது; கிரேக்கச் சொல்லில் கட்டாயமில்லாத உயிரியல் பிறப்புப் பொருளை முதன்மை உரையில் புகுத்தவில்லை.
theological_decisions:
- issue: κρίνω என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘தீர்ப்புக்குள்ளாதல்’
  alternative: ‘தண்டனைத் தீர்ப்புக்குள்ளாதல்’ அல்லது ‘கண்டனம் செய்யப்படுதல்’
  rationale: யோவான் 3:17–19 சூழலில் எதிர்மறைத் தீர்ப்பின் சாயல் இருந்தாலும், κρίνω என்பதன் அகன்ற ‘தீர்ப்பிடு’ பொருளையும் உரையின் உண்மையான பொருள் விரிவையும் இத்தேர்வு காக்கிறது.
- issue: μονογενής என்பதன் பொருள்
  choice: ‘ஒரே தனித்துவமுள்ள’
  alternative: ‘ஒரே மகன்’, ‘ஒப்பற்ற மகன்’, மரபாக ‘ஒரேபேறான மகன்’
  rationale: மகனுடைய ஒப்பற்ற தனித்துவத்தை வெளிப்படுத்துகிறது; பிற்கால சமயக் கோட்பாட்டுச் சொல்லாக்கத்தை மூலச்சொல்லில் கட்டாயமாக ஏற்றாமல், மரபு மொழிபெயர்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் மரியாதைமிக்க நடை. ‘விசுவாசிக்கிறவர்’ என்பதற்குப் பதிலாக பொதுவாசகர்களுக்குத் தெளிவான ‘நம்பிக்கை வைக்கிறவர்’ பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’ என்பது நவீன நிலையான தமிழில் இயல்பான பொதுப்பெயர்.
