source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: ta
  text: ஆனால் உண்மையைச் செய்கிறவர்[a], தம் செயல்கள் கடவுளில் செய்யப்பட்டிருக்கின்றன என்பது வெளிப்படும்படி[b][c] ஒளியிடம் வருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உண்மையின்படி நடக்கிறவர்’ அல்லது ‘உண்மையானதைச் செய்கிறவர்.’ கிரேக்கச் சொற்றொடரின் நேர்ப்பொருள் ‘உண்மையைச் செய்கிறவர்.’
    reason: lexical_alternative
  - marker: b
    text: ‘என்பது’ என்பதற்குப் பதிலாக, ‘ஏனெனில் அவை கடவுளில் செய்யப்பட்டிருக்கின்றன’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க இணைப்புச்சொல், வெளிப்படுகிறதன் உள்ளடக்கத்தையோ அதற்கான காரணத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘கடவுளில்’ என்பதை ‘கடவுளால்’ அல்லது ‘கடவுள் மூலமாக’ என்றும் புரிந்துகொள்ளலாம்; கிரேக்கச் சொல்லாக்கம் இவற்றில் ஒன்றை மட்டும் தெளிவாக நிர்ணயிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: ஆனால் உண்மையைச் செய்கிறவர்
  rationale: δέ முந்தைய வசனத்துடன் உள்ள மென்மையான முரண்பாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. ‘உண்மையைச் செய்கிறவர்’ என்ற சொல்லாக்கம் யோவானின் தனித்துவமான சொற்றொடரைப் பாதுகாத்து, உண்மை செயல்படுத்தப்படுவதையும் உணர்த்துகிறது.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: ஒளியிடம் வருகிறார்
  rationale: πρός இயக்கத்தின் இலக்கைச் சுட்டுவதால் ‘ஒளியிடம்’ என வழங்கப்பட்டது; ‘ஒளிக்குள்’ என்று பொருளை விரிவுபடுத்தாமல், ஒளியை அணுகும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: தமது செயல்கள் ... என்பது வெளிப்படும்படி
  rationale: ἵνα நோக்கத்தைக் குறிக்கிறது; φανερωθῇ என்பதன் இறைச்செயப்பாட்டு நுணுக்கத்தை ‘வெளிப்படும்படி’ காக்கிறது. தமிழின் இயல்பான வாக்கிய அமைப்புக்காக நோக்கத் தொடர் முன்வைக்கப்பட்டது.
- source_word: ὅτι
  choice: என்பது
  rationale: இங்கு ὅτι, வெளிப்படுகிறதன் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்ளப்பட்டது. காரணத்தைக் குறிக்கும் ‘ஏனெனில்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν θεῷ
  choice: கடவுளில்
  rationale: ἐν என்பதன் திறந்த பொருளை அப்படியே வைத்திருக்கிறது; ‘கடவுளால்’ அல்லது ‘கடவுள் மூலமாக’ எனக் குறுக்கி விளக்கவில்லை.
- source_word: ἐστιν εἰργασμένα
  choice: செய்யப்பட்டவை
  rationale: நிறைவேற்றப்பட்டு நிலைத்திருக்கும் முடிவைச் சுட்டும் perfect passive கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ποιῶν τὴν ἀλήθειαν என்ற சொற்றொடரின் பொருள்
  choice: உண்மையைச் செய்கிறவர்
  alternative: உண்மையின்படி நடக்கிறவர்; உண்மையானதைச் செய்கிறவர்
  rationale: மூலத்தின் திட்டமிட்டுச் செறிவான சொல்லாக்கத்தைப் பாதுகாக்கிறது; ‘உண்மை’ வெறுமனே அறியப்படுவது மட்டுமல்ல, செயலில் நிறைவேற்றப்படுவதும் என்ற யோவானிய நுணுக்கத்தை முன்கூட்டியே ஒரே விளக்கமாகக் குறுக்கவில்லை.
- issue: ὅτι என்பதன் தொடர்பு
  choice: வெளிப்படுவதன் உள்ளடக்கமாக ‘என்பது’
  alternative: வெளிப்படுவதற்கான காரணமாக ‘ஏனெனில்’
  rationale: இரு இலக்கணப் புரிதல்களும் சாத்தியம். முதன்மை உரை உள்ளடக்க வாசிப்பை ஏற்கிறது; காரண வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν θεῷ என்பதன் நுணுக்கம்
  choice: கடவுளில்
  alternative: கடவுளால்; கடவுள் மூலமாக; கடவுளோடு இணைந்து
  rationale: தெய்வீகச் செயலாற்றல், ஆளுகை அல்லது உறவு ஆகிய நுணுக்கங்களில் ஒன்றை மட்டும் நிர்ணயிக்காமல் கிரேக்கத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் எளிமையும் பேணப்பட்டுள்ளன. பொதுவான ஒருவரைக் குறிக்கும் மரியாதை ஒருமை (‘செய்கிறவர்’, ‘வருகிறார்’, ‘தமது’) பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இறையியல் செறிவை காக்க ‘உண்மையைச் செய்கிறவர்’ மற்றும் ‘கடவுளில்’ என்ற சற்றே தனித்துவமான சொல்லாக்கங்கள் திட்டமிட்டு வைக்கப்பட்டுள்ளன.
