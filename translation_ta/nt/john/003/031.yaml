base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: ta
  text: மேலிருந்து வருகிறவர் எல்லாவற்றிற்கும் மேலானவர்.[a] பூமியைச் சேர்ந்தவர் பூமியைச் சேர்ந்தவரே; அவர் பூமியிலிருந்தே பேசுகிறார்.[b] பரலோகத்திலிருந்து வருகிறவர் எல்லாவற்றிற்கும் மேலானவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் சொற்றொடரில் ‘மேலிருந்து’ என்பதற்குப் பதிலாக ‘பரலோகத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மேலிருந்து வரும் மூலத்தைக் குறிக்கிறது; பின்னர் வரும் ‘பரலோகத்திலிருந்து’ என்பது இதைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியைப் பற்றிப் பேசுகிறார்.’ கிரேக்கத்தில் ‘பூமியிலிருந்து’ என்பது சொல்லுக்குச் சொல் மீண்டும் வருகிறது; அது பேச்சின் தோற்றுவாய், எல்லை அல்லது பேசுபொருளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: மேலிருந்து
  rationale: இங்கு மீண்டும் வருதல் அல்ல, மேலான இடத்திலிருந்து தோன்றும் மூலத்தைக் குறிக்கிறது. இது ‘பூமியிலிருந்து’ என்பதுடன் உள்ள எதிர்மறை ஒப்புமையைக் காத்து, பின்னர் வரும் ‘பரலோகத்திலிருந்து’ என்பதால் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἐρχόμενος
  choice: வருகிறவர்
  rationale: பெயர்ச்சொல் போன்று செயல்படும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் விளக்குகிறது; தொடர்ச்சியான விவரிப்பு நயத்தையும் காக்கிறது.
- source_word: ἐπάνω πάντων
  choice: எல்லாருக்கும் மேலானவர்
  rationale: சூழலில் நபர்களுக்கிடையிலான மேன்மையையும் அதிகார உயர்வையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘மேல்’ என்ற செங்குத்து உருவகமும் காக்கப்படுகிறது.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: பூமியிலிருந்து இருப்பவர்
  rationale: பூமியை மூலமாகக் கொண்டிருப்பதைத் தெரிவித்து, கிரேக்கத்தின் பங்கேற்புவினைக் கட்டமைப்பையும் தொடர்ந்துவரும் மறுமொழியையும் நெருக்கமாகக் காக்கிறது.
- source_word: γῆ
  choice: பூமி
  rationale: இங்கு பரலோகத்திற்கு எதிரான உலகளாவிய இணையாக இருப்பதால் ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: பூமியிலிருந்து வந்தவர்
  rationale: தமிழில் ‘பூமியிலிருந்து இருப்பவர் பூமியிலிருந்து இருப்பவர்’ என்ற இயல்பற்ற இரட்டிப்பைத் தவிர்க்க, மூலத்தோற்றக் கருத்தை ‘வந்தவர்’ என இயல்பாகத் தருகிறது; அதேவேளை ‘பூமியிலிருந்து’ என்ற மறுமொழி காக்கப்படுகிறது.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: பூமியிலிருந்தே பேசுகிறார்
  rationale: ἐκ என்பதன் மூல/சூழல் நயத்தைத் திறந்தவாறே வைத்து, அது பேசுபொருளையா, தோற்றுவாயையா, கண்ணோட்டத்தையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது. ‘-ஏ’ மறுமொழியின் வலியுறுத்தலை இயல்பாக உணர்த்துகிறது.
- source_word: οὐρανός
  choice: பரலோகம்
  rationale: யோவானின் இச்சூழலில் இது வெறும் வானத்தை அல்ல, தெய்வீகமான பரலோக உலகைச் சுட்டுகிறது.
theological_decisions:
- issue: ‘மேலிருந்து’ மற்றும் ‘பரலோகத்திலிருந்து’ ஆகியவற்றின் உறவு
  choice: ἄνωθεν என்பதை ‘மேலிருந்து’ என்றும், ἐκ τοῦ οὐρανοῦ என்பதை ‘பரலோகத்திலிருந்து’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்.
  alternative: இரண்டையும் ‘பரலோகத்திலிருந்து’ என மொழிபெயர்த்தல்.
  rationale: மூலத்தில் தொடர்புடையதாயினும் வேறுபட்ட இரண்டு சொற்றொடர்கள் உள்ளன. இந்த வேறுபாடு, முதல் சொல்லின் யோவானிய நயத்தையும் பின்னைய சொற்றொடரின் விளக்கத் தன்மையையும் காக்கிறது.
- issue: பூமியைப் பற்றிய மும்முறை மறுமொழியின் வலிமை
  choice: ‘பூமியிலிருந்து ... பூமியிலிருந்து ... பூமியிலிருந்தே’ என்ற மறுமொழியைப் பேணுதல்.
  alternative: ‘பூமிக்குரியவர் பூமிக்குரிய விதத்தில் பேசுகிறார்’ எனச் சுருக்குதல்.
  rationale: மறுமொழி பூமிக்குரிய மூலத்திற்கும் பரலோக மூலத்திற்கும் இடையிலான வேறுபாட்டை வலியுறுத்துகிறது. அதைச் சுருக்குவது மூலத்தின் சொல்லாட்சித் தாக்கத்தையும் உண்மையான பொருள் நெகிழ்வையும் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிய புரிதலும் இணைந்த நடை. மூலத்தின் இணை அமைப்பும் பூமி குறித்த மறுமொழியும் திட்டமிட்டு காக்கப்பட்டுள்ளன. ‘பரலோகம்’ பொதுவான வேதாகம வழக்கைத் தொடர்கிறது; அரிதான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
