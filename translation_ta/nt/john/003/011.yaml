id: JHN.3.11
reference: John 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: ta
  text: '“உண்மையாக, உண்மையாக உனக்குச் சொல்கிறேன்: நாங்கள் அறிந்ததைப் பேசுகிறோம்; நாங்கள் கண்டதற்குச் சாட்சி அளிக்கிறோம். மேலும், நீங்கள் எங்கள் சாட்சியை ஏற்றுக்கொள்வதில்லை.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாங்கள்,” “எங்கள்” என்பவை யாரைக் குறிக்கின்றன என்பது தெளிவாகக் கூறப்படவில்லை.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: இரட்டிக்கப்பட்ட வலியுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் சத்திய உறுதிப்பாட்டைத் தக்கவைக்கிறது.
- source_word: λέγω σοι
  choice: உனக்குச் சொல்கிறேன்
  rationale: ஒருமை இரண்டாம் நபர் σοι என்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: நாங்கள் அறிந்ததையே பேசுகிறோம்
  rationale: மூலத்தின் பன்மையையும், அறிந்ததே பேசப்படும் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: நாங்கள் கண்டதையே சாட்சியாகச் சொல்கிறோம்
  rationale: ἑωράκαμεν என்பதன் நிறைவு சார்ந்த பொருத்தத்தையும் μαρτυροῦμεν என்பதன் சாட்சி அளிக்கும் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: எங்கள் சாட்சியை
  rationale: முதல் நபர் பன்மையைத் தக்கவைத்து, μαρτυροῦμεν உடனான சொற்பொருள் தொடர்பையும் பாதுகாக்கிறது.
- source_word: οὐ λαμβάνετε
  choice: நீங்கள் ஏற்றுக்கொள்வதில்லை
  rationale: λαμβάνω இங்கு சாட்சியை வரவேற்று ஏற்றுக்கொள்வதைக் குறிக்கிறது; தமிழில் வெறும் உடல் சார்ந்த ‘பெறுதல்’ என்பதைக் காட்டிலும் இது சூழலுக்கு இயல்பானது.
- source_word: καὶ
  choice: ஆனால்
  rationale: இணைப்புச்சொல்லின் சூழல்சார் முரண்பாட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொற்படி ‘மேலும்/மற்றும்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: ‘நாங்கள் ... எங்கள்’ என்ற முதல் நபர் பன்மையின் குறிப்பு
  choice: பன்மை வடிவங்கள் அப்படியே தக்கவைக்கப்பட்டன.
  alternative: இயேசு தம்மையும் சீடர்களையும், தெய்வீகச் சாட்சிகளையும், அல்லது சொல்லாட்சிப் பன்மையையும் குறிப்பதாக விளக்குதல்.
  rationale: கிரேக்க மூலத்தில் பன்மை தெளிவாக இருந்தாலும் அது யாரைக் குறிக்கிறது என்பது விவாதத்திற்குரியது; மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, நேரடியான நடை. σοι ஒருமை என்பதால் ‘உனக்கு’; λαμβάνετε பன்மை என்பதால் ‘நீங்கள்’ பயன்படுத்தப்பட்டன. சாட்சி சார்ந்த யோவானிய சொற்பொருள் தொடர்பு பாதுகாக்கப்பட்டது.
