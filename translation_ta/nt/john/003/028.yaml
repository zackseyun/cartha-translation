  to: “நான் மேசியா அல்ல; அவருக்கு முன்னதாக அனுப்பப்பட்டிருக்கிறேன்” என்று நான் சொன்னதற்கு நீங்களே எனக்குச் சாட்சி அளிக்கிறீர்கள்.
