id: JHN.3.28
reference: John 3:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: ta
  text: “நான் மேசியா அல்ல; அவருக்கு முன்னதாக அனுப்பப்பட்டிருக்கிறேன்” என்று நான் சொன்னதற்கு நீங்களே எனக்குச் சாட்சி அளிக்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: நீங்களே
  rationale: இரட்டைப் பிரதிப்பெயர் தரும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: μοι μαρτυρεῖτε
  choice: எனக்குச் சாட்சி கூறுகிறீர்கள்
  rationale: μοι என்ற தத்தி வேற்றுமையையும் யோவான் நூலின் சாட்சியமளித்தல் சார்ந்த சொல்லாட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι εἶπον
  choice: என்று நான் சொன்னதற்கு
  rationale: சாட்சியின் உள்ளடக்கத்தை நேரடிக் கூற்றாக இணைத்து, εἶπον என்பதன் இறந்தகாலக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக இருப்பதால், பொருளைத் தாங்கும் வழக்கமான தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: அனுப்பப்பட்டிருக்கிறேன்
  rationale: முன்பு நிகழ்ந்த அனுப்புதல் விளைவாகத் தற்போது நிலவும் பணிநிலையை உணர்த்தும் சுற்றுவழிப் பூரணப் பயனிலையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἔμπροσθεν ἐκείνου
  choice: அவருக்கு முன்னதாக
  rationale: காலத்திலும் பணியிலும் முன்சென்று ஆயத்தப்படுத்தும் உறவைத் தெளிவாகக் காட்டுகிறது; மேன்மை அல்லது அந்தஸ்து என்ற தேவையற்ற பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு யோவான், தானே எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவர் என்பதை மறுக்கிறார்; ஆகவே பெயர்போன்ற வடிவைவிட பட்டத்தின் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பொருத்தமானது.
- issue: Ἀπεσταλμένος εἰμὶ என்பதில் யோவானின் அனுப்பப்பட்ட நிலை
  choice: அனுப்பப்பட்டிருக்கிறேன்
  alternative: அனுப்பப்பட்டவன் நான் / அனுப்பப்பட்டேன்
  rationale: யோவானின் கீழ்ப்பட்ட, முன்னோடி பணியை மட்டும் உரை கூறும் அளவில் வெளிப்படுத்தி, நிறைவேற்றப்பட்ட அனுப்புதலின் தற்போதைய விளைவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, எளிதில் புரியும் நடை. மூலத்தின் ‘நீங்களே’ என்ற வலியுறுத்தலும் சாட்சி சார்ந்த மொழியும் பாதுகாக்கப்பட்டுள்ளன. தேவையற்ற விளக்கச் சொற்கள் அல்லது சமயப்பிரிவு சார்ந்த சொற்றொடர்கள் சேர்க்கப்படவில்லை.
