source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: ta
  text: மோசே பாலைவனத்தில்[a] பாம்பை உயர்த்தியதுபோலவே, மனிதகுமாரனும் உயர்த்தப்பட வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மோசே பாலைவனத்தில் பாம்பை உயர்த்திய நிகழ்வுக்கு எண்ணாகமம் 21:8–9-ஐப் பார்க்கவும்.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘மேன்மைப்படுத்தப்பட வேண்டும்.’ கிரேக்க வினை உடலளவில் மேலே உயர்த்தப்படுவதையும் மேன்மைப்படுத்தப்படுவதையும் குறிக்கலாம்; இங்கு யோவான் இரு பொருள்களையும் நோக்கமாகக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: …போலவே
  rationale: மோசேயின் செயலுக்கும் மனிதகுமாரனுக்கு நிகழ வேண்டியதற்கும் இடையிலான நேரடியான ஒப்புமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὕψωσεν
  choice: உயர்த்திய
  rationale: எண்ணாகம நிகழ்வில் பாம்பு நிஜமாக மேலே தூக்கி வைக்கப்பட்டதைச் சொல்வதோடு, அதற்கான இணை வினையுடன் வசனத்தின் சொல்விளையாட்டையும் காக்கிறது.
- source_word: τὸν ὄφιν
  choice: பாம்பை
  rationale: நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும் சொல்; எண்ணாகமம் 21-இன் குறிப்புக்கும் பொருந்துகிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: பாலைவனத்தில்
  rationale: இஸ்ரவேலரின் வனாந்தரப் பயணச் சூழலை இன்றைய வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: οὕτως
  choice: …போலவே
  rationale: καθὼς … οὕτως என்ற இணை ஒப்புமையைத் தமிழில் ஒருங்கிணைந்த ‘…போலவே’ அமைப்பால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑψωθῆναι
  choice: உயர்த்தப்பட
  rationale: சிலுவையில் உடலளவில் மேலே உயர்த்தப்படுதல், மேன்மைப்படுத்தப்படுதல் ஆகிய இரு சாத்தியமான யோவானிய அர்த்தங்களையும் ஒரே அளவுக்கு திறந்துவைக்கிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: வெறும் எதிர்கால நிகழ்வை அல்லாமல், அது நிகழ வேண்டிய அவசியத்தை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற வேதாகமத் தன்னழைப்பையும் அதன் தானியேல் மற்றும் யோவானிய எதிரொலிகளையும் காக்கிறது.
theological_decisions:
- issue: ὑψόω என்ற வினையின் யோவானிய இரட்டைப் பொருள்
  choice: இரு இடங்களிலும் ‘உயர்த்து’ என்ற ஒரே வேர்ச்சொல்லைப் பயன்படுத்துதல்.
  alternative: ‘மேலே தூக்குதல்’ அல்லது ‘மேன்மைப்படுத்துதல்’ என்று ஒரே பொருளை மட்டும் வெளிப்படையாகத் தேர்ந்தெடுத்தல்.
  rationale: மோசே பாம்பை உடலளவில் உயர்த்தியதையும், மனிதகுமாரன் சிலுவையில் உயர்த்தப்பட்டு மேன்மைப்படுத்தப்படுவதையும் வசனம் ஒன்றோடொன்று இணைக்கிறது. ‘உயர்த்து’ இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘…போலவே’ ஒப்புமையை இயல்பாக்குகிறது; ‘உயர்த்திய/உயர்த்தப்பட’ என்ற சொல் மீளுருவாக்கம் மூலத்தின் கருத்தியல் இணைப்பைப் பாதுகாக்கிறது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்புகளின் உள்ளடக்கத்துக்கும் அவை பொருந்தும் சொற்களுக்கும் இடையில் குறியீட்டு இடமாற்றம் இருந்ததால், குறுக்கு மேற்கோள் பாலைவனத்துடனும் சொற்பொருள் மாற்று ‘உயர்த்தப்பட’ என்பதுடனும் பொருத்தப்பட்டுள்ளது.
