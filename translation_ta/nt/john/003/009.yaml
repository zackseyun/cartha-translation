  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: ta
  text: நிக்கொதேமு அவருக்குப் பதிலளித்து, “இவை எப்படி நிகழ[a] முடியும்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை எப்படி உண்டாக முடியும்?”
    reason: γενέσθαι என்பதற்கு ‘நிகழ’ என்பதோடு ‘உண்டாகுதல்/இருத்தல்’ என்ற நெருக்கமான மாற்று வாய்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்து
  rationale: உரையாடலில் ἀποκρίνομαι வழக்கமாக ‘பதிலளி’ என்ற பொருளைத் தருகிறது. அடுத்துள்ள εἶπεν என்பதுடன் இயல்பான தமிழில் இணைக்க வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: Νικόδημος
  choice: நிக்கொதேமு
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: εἶπεν αὐτῷ
  choice: அவருக்கு … என்று கேட்டார்
  rationale: αὐτῷ என்பதன் சுட்டுப்பெயரை ‘அவருக்கு’ என்று காத்து, இயேசு என்ற பெயரை உரையில் சேர்க்கவில்லை. கேள்வி வாக்கியத்தை இயல்பான தமிழில் அறிமுகப்படுத்த εἶπεν ‘என்று கேட்டார்’ என வழங்கப்பட்டது.
- source_word: Πῶς
  choice: எப்படி
  rationale: முறை அல்லது சாத்தியத்தை வினவும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: δύναται
  choice: முடியும்
  rationale: திறன் அல்லது சாத்தியத்தைத் தெரிவிக்கும் δύναμαι என்பதற்கு இயல்பான தமிழ் இணை.
- source_word: ταῦτα
  choice: இவை
  rationale: முன்பு கூறப்பட்ட பல கருத்துகளைச் சுட்டும் நடுநிலைப் பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: γενέσθαι
  choice: நிகழ
  rationale: γίνομαι என்பதின் இவ்விடத்திலுள்ள ‘நடக்குதல்/உருவாதல்’ என்ற நிகழ்வுப் பொருளை, மிகையாக விளக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: புதிய பிறப்பைப் பற்றிய நிக்கொதேமுவின் கேள்வியில் γενέσθαι என்பதன் பொருள்
  choice: இவை எப்படி நிகழ முடியும்?
  alternative: இவை எப்படி உண்டாக முடியும்?
  rationale: ‘நிகழ’ என்பது கூறப்பட்டவற்றின் சாத்தியத்தையும் அவை நடந்தேறும் விதத்தையும் இயல்பாகக் காட்டுகிறது; அவற்றின் இறையியல் இயல்பைத் தீர்மானித்து விடவில்லை. ‘உண்டாக’ என்பது ‘come to be’ என்ற நுணுக்கத்தை அதிகமாக முன்னிறுத்தும் மாற்று.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரையாடல் நடை. கிரேக்கத்தின் ‘பதிலளித்து அவரிடம் சொன்னார்’ என்ற இரட்டைச் சொல்லாக்கம், தமிழில் இயல்பாக ‘அவருக்குப் பதிலளித்து … என்று கேட்டார்’ என அமைக்கப்பட்டது.
