- from: நிக்கொதேமு அவருக்குப் பதிலளித்து, “இவை எப்படி நிகழ முடியும்?” என்று கேட்டார்.
  to: நிக்கொதேமு அவருக்குப் பதிலளித்து, “இவை எப்படி நிகழ[a] முடியும்?” என்றார்.
