id: JHN.3.10
reference: John 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: ta
  text: 'இயேசு அவரிடம் பதிலளித்துச் சொன்னார்: “நீரே இஸ்ரவேலின் போதகர்; இவற்றை அறியவில்லையா?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் ஒரு போதகர்.” கிரேக்கத்தில் “போதகர்” என்பதற்கு உறுதியான குறிப்பு உள்ளது (“அந்தப் போதகர்”); இது இயேசுவின் கேள்விக்கு சுட்டிக்காட்டும், கண்டிக்கும் வலிமையைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: கிரேக்க மொழியின் இரு வினைச்சொல் உரையாடல் சூத்திரத்தை இயல்பான தமிழில் சுருக்காமல் பிரதிபலிக்கிறது.
- source_word: Σὺ
  choice: நீர் … இருந்தும்
  rationale: வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட முன்னிலைப் பெயரின் சுட்டுத்தன்மையை மரியாதை ஒருமையாலும் ‘இருந்தும்’ என்ற முரண்பாட்டு அமைப்பாலும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ διδάσκαλος τοῦ Ἰσραὴλ
  choice: இஸ்ரவேலின் போதகர்
  rationale: உறுப்புடன் வரும் ஒருமைச் சொல்லின் குறிப்பிட்ட தன்மையையும், இஸ்ரவேல் மக்களிடையே நிக்கொதேமுவின் அங்கீகரிக்கப்பட்ட போதக நிலையைச் சுட்டும் உறவையும் காக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முந்தைய உரையாடலில் கூறப்பட்டவற்றைச் சுட்டும் பன்மைச் சுட்டுப்பெயரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: οὐ γινώσκεις
  choice: அறியாமல் இருக்கிறீரா?
  rationale: γινώσκω என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காத்து, சூழலில் உள்ள புரிந்துகொள்ளாமை என்னும் நுண்பொருளை வாசகர் உணர இடமளிக்கிறது.
theological_decisions:
- issue: ὁ διδάσκαλος τοῦ Ἰσραὴλ என்பதன் குறிப்பிட்ட மற்றும் சொல்லாட்சியுள்ள வலிமை
  choice: ‘இஸ்ரவேலின் போதகர்’ என்று குறிப்பிட்ட ஒருமைத் தன்மையுடன் மொழிபெயர்த்தல்
  alternative: ‘இஸ்ரவேலின் ஒரு போதகர்’
  rationale: ὁ என்னும் உறுப்பு நிக்கொதேமுவை வெறுமனே பல போதகர்களில் ஒருவராக அல்லாமல் அங்கீகரிக்கப்பட்ட போதகராகச் சுட்டுகிறது. தமிழில் ‘ஒரு’ என்பதைச் சேர்க்காமல் இருப்பது அந்தச் சொல்லாட்சிக் கூர்மையைக் காக்கிறது; அதேவேளை அவரே இஸ்ரவேலின் ஒரே போதகர் என்று அளவுக்கு மீறி முடிவுசெய்யவில்லை.
translation_notes:
  register: நிக்கொதேமுவை நோக்கிய ஒருமை மரியாதைக்காக ‘நீர்/இருக்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமும் கண்ணியமுமானது. கிரேக்கத்தின் சொற்படியான இணைப்பைத் திணிக்காமல், கேள்வியின் வலியுறுத்தலும் மென்மையான கண்டனத் தொனியும் காக்கப்பட்டுள்ளன.
