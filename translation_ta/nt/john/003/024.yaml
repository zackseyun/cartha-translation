  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: ta
  text: ஏனெனில், யோவான் இன்னும் சிறையில் தள்ளப்பட்டிருக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, திருமுழுக்கு கொடுத்த யோவான்.
    reason: சூழலில் குறிப்பிடப்படும் யோவானின் அடையாளத்தைத் தெளிவுபடுத்தும் குறுக்கு மேற்கோள் சார்ந்த விளக்கம்.
lexical_decisions:
- source_word: οὔπω
  choice: இன்னும் ... இல்லை
  rationale: கதையின் இந்தக் கட்டம் வரை அந்த நிகழ்வு நடைபெறவில்லை என்பதைக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள நிகழ்வுக்கு விளக்கப் பின்னணியை வழங்கும் இணைப்புச் சொல்லின் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἦν βεβλημένος
  choice: தள்ளப்பட்டிருக்கவில்லை
  rationale: முந்தைய நிலையில் நிறைவேற்றப்பட்ட செயலைக் குறிக்கும் சுற்றுவழி இறந்தகாலச் செயப்பாட்டு அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘தள்ளப்பட்ட’ என்பது βάλλω என்பதன் வலிமையையும் காக்கிறது.
- source_word: εἰς τὴν φυλακήν
  choice: சிறையில்
  rationale: இங்கு φυλακή சிறை அல்லது சிறைவாசத்தைக் குறிக்கிறது. இயக்கத்தைக் குறிக்கும் εἰς, ‘தள்ளப்பட்டிருக்கவில்லை’ என்ற வினையுடன் தமிழில் ‘சிறையில்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: ὁ Ἰωάννης
  choice: யோவான்
  rationale: கிரேக்க உரை பெயரை மட்டும் தருகிறது; ‘திருமுழுக்கு கொடுத்தவர்’ என்ற அடையாளத்தை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பேணுகிறது.
theological_decisions:
- issue: ὁ Ἰωάννης என்பவரின் அடையாளம்
  choice: யோவான்
  alternative: திருமுழுக்கு கொடுத்த யோவான்
  rationale: சூழலில் இவர் திருமுழுக்கு கொடுத்த யோவான் என்பது தெளிவாக இருந்தாலும், இவ்வசனத்தின் கிரேக்க உரை ‘யோவான்’ என்று மட்டுமே கூறுகிறது. எனவே கூடுதல் அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘சிறையில் தள்ளப்பட்டிருக்கவில்லை’ என்பது மூலத்தின் செயப்பாட்டு வடிவத்தையும் காலத் தொடர்பையும் பேணுகிறது.
