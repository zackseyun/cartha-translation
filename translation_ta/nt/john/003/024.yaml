  verdict: approve
  source_fidelity: மூலத்தின் οὔπω γάρ, ἦν βεβλημένος, εἰς τὴν φυλακήν ஆகியவற்றின் விளக்கப் பின்னணி, ‘இன்னும்’ என்ற காலக் குறிப்பு, நிறைவேற்றப்பட்ட செயப்பாட்டு நிலை, மற்றும் சிறையிடப்படுதல் ஆகியவை தமிழில் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘தள்ளப்பட்டிருக்கவில்லை’ என்பது pluperfect passive-இன் பொருளை ஏற்றுக்கொள்ளத்தக்க வகையில் வெளிப்படுத்துகிறது.
  naturalness: ‘ஏனெனில், யோவான் இன்னும் சிறையில் தள்ளப்பட்டிருக்கவில்லை’ என்பது நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை. சொல்லமைப்பு சற்றே முறையானதாக இருந்தாலும் வேதாகம உரைக்குப் பொருத்தமானது.
  terminology: ‘யோவான்’ பெயர்வழக்கு நிலையானது. முதன்மை உரையில் மூலத்தில் இல்லாத ‘திருமுழுக்கு கொடுத்தவர்’ என்ற அடையாளம் சேர்க்கப்படாமல், அடிக்குறிப்பில் மட்டும் தரப்பட்டுள்ளது. ‘திருமுழுக்கு கொடுத்த யோவான்’ அடிக்குறிப்பும் அடையாளப்படுத்தும் நோக்கத்திற்குப் பொருத்தமானது.
