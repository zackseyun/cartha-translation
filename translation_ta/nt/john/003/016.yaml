- from: 'ஏனெனில், கடவுள் உலகத்தின் மீது இவ்விதமாக அன்புகூர்ந்தார்: அவர் தமது ஒரே மகனை[a] கொடுத்தார். அவர்மீது நம்பிக்கை வைக்கிற ஒவ்வொருவரும் அழிந்துபோகாமல் நிலைவாழ்வைப் பெறவேண்டும் என்பதற்காகவே அப்படிச் செய்தார்.[b]'
