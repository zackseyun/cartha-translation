source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: ta
  text: 'ஏனெனில், கடவுள் உலகத்தை இவ்விதமாக[b] அன்புகூர்ந்தார்: தமது ஒரே மகனை[a] கொடுத்தார்; அவர்மீது நம்பிக்கை வைக்கிற எவரும் அழிந்துபோகாமல் நித்திய வாழ்வைப் பெறும்படியாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது ஒரேபேறான மகனை”; “தமது தனித்துவமான மகனை” என்றும் பொருள்கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: மரபுவழியாக, “கடவுள் உலகத்தை இவ்வளவாக அன்புகூர்ந்தார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இங்கு கடவுள் அன்புகூர்ந்த முறையை—தமது மகனைக் கொடுத்ததை—முதன்மையாகச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: இவ்விதமாக
  rationale: இங்கு இச்சொல் அன்பின் அளவை முதன்மையாக அல்ல, கடவுள் தமது மகனைக் கொடுத்த விதத்தைச் சுட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுடன் இணைக்கும் விளக்க அல்லது காரணத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἠγάπησεν
  choice: அன்புகூர்ந்தார்
  rationale: இறந்தகால வினையை இயல்பாகவும், கண்ணியமான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: τὸν κόσμον
  choice: உலகத்தின் மீது
  rationale: κόσμος என்பதன் விரிவை மனிதகுலம் என்று மட்டும் குறுக்காமல் ‘உலகம்’ எனத் தக்கவைக்கிறது; தமிழ் வினைத்தொடருக்கேற்ப வேற்றுமை அமைக்கப்பட்டுள்ளது.
- source_word: ὥστε ... ἔδωκεν
  choice: அவர் தமது ... மகனை கொடுத்தார்
  rationale: கடவுள் எவ்விதமாக அன்புகூர்ந்தார் என்பதைத் தொடர்ந்து வரும் வாக்கியம் நேரடியாக விளக்குகிறது; இரட்டைப்புள்ளி அந்த உறவைத் தெளிவாக்குகிறது.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: தமது ஒரே மகனை
  rationale: μονογενής சுட்டும் தனித்தன்மையையும் ஒரே மகன் என்ற உறவையும் எளிய நவீனத் தமிழில் தருகிறது; ‘ஒரேபேறான’ என்ற மரபுவழி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἵνα
  choice: என்பதற்காகவே
  rationale: நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; முந்தைய வாக்கியத்துடன் இயல்பாக இணைக்க ‘அப்படிச் செய்தார்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: அவர்மீது நம்பிக்கை வைக்கிற ஒவ்வொருவரும்
  rationale: அனைவரையும் உள்ளடக்கும் பொதுவான நிகழ்காலக் கருத்தைத் தக்கவைத்து, πιστεύω εἰς என்பதைக் இயல்பான தமிழில் வழங்குகிறது.
- source_word: μὴ ἀπόληται
  choice: அழிந்துபோகாமல்
  rationale: ἀπόλλυμι என்பதன் தீவிரத்தைத் தக்கவைக்கிறது; அழிவின் இயல்பை மொழிபெயர்ப்பிலேயே மேலதிகமாக வரையறுப்பதில்லை.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: நிலைவாழ்வைப் பெறவேண்டும்
  rationale: ἔχω என்பதன் ‘உடையவராக இருத்தல்/பெறுதல்’ பொருளை இயல்பான தமிழில் காட்டுகிறது; αἰώνιος என்பதற்கு வெறும் முடிவின்மையை விட காலந்தோறும் நிலைக்கும் வாழ்வு என்ற பரப்பை ‘நிலைவாழ்வு’ சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: Οὕτως என்பதன் பொருள்
  choice: 'முறை: ‘இவ்விதமாக’'
  alternative: 'அளவு அல்லது தீவிரம்: ‘இவ்வளவாய்’'
  rationale: ὥστε தொடர்ந்து மகனைக் கொடுத்த செயலை எடுத்துரைப்பதால், கடவுளின் அன்பு வெளிப்பட்ட முறையே முதன்மையாக வலியுறுத்தப்படுகிறது; அளவுப் பொருள் முற்றிலும் மறுக்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: μονογενής என்பதன் மொழிபெயர்ப்பு
  choice: ‘ஒரே மகன்’
  alternative: ‘ஒரேபேறான மகன்’ அல்லது ‘தனித்துவமான மகன்’
  rationale: இச்சொல் மகனின் தனித்துவமான உறவைச் சுட்டுகிறது. உடல்சார்ந்த பிறப்பை தேவையின்றி முன்னிறுத்தாமல், வரலாற்று முக்கியத்துவமுள்ள மாற்றை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: πᾶς ὁ πιστεύων என்பதன் வரம்பு
  choice: ‘நம்பிக்கை வைக்கிற ஒவ்வொருவரும்’
  alternative: ‘நம்புகிற எவரும்’
  rationale: கிரேக்கத்தின் உள்ளடக்கமான, பொதுவான அழைப்பைத் தக்கவைக்கிறது; தேர்ந்தெடுத்தல், மீட்பின் வரம்பு, மனிதப் பதில் ஆகிய பிற்கால இறையியல் விவாதங்களை வசனத்துக்குள் தீர்மானிப்பதில்லை.
- issue: ζωὴ αἰώνιος என்பதன் பொருள்
  choice: ‘நிலைவாழ்வு’
  alternative: ‘நித்திய வாழ்வு’
  rationale: முடிவில்லாத காலநீளத்தையும் வரவிருக்கும் யுகத்துக்குரிய வாழ்வின் தன்மையையும் சுருக்கமாக வெளிப்படுத்துகிறது; பரவலாக அறியப்பட்ட மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடை. ‘அன்புகூர்ந்தார்’, ‘நிலைவாழ்வு’ போன்ற சொற்கள் வேதாகமத் தொனியைத் தக்கவைத்தாலும் பழமையான அல்லது மிகச் சமயவழக்குச் சொற்களைத் தவிர்க்கின்றன. கிரேக்க வாக்கியத்தின் தர்க்க ஓட்டத்தைத் தமிழில் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
