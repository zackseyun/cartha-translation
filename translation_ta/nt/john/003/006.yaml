  terminology: ‘மாம்சம்’ is the suitable primary rendering here, since ‘பாவ இயல்பு’ would overinterpret the context. ‘ஆவியார்’ for the source and ‘ஆவி’ for the predicate preserve the intended distinction. The alternative-note wording is adjusted to use more idiomatic Tamil and to explain the qualitative predicate accurately.
