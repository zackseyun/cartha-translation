  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: ta
  text: மாம்சத்திலிருந்து பிறந்தது மாம்சமே[a]; ஆவியாரிடமிருந்து பிறந்தது ஆவியே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மாம்சத்திலிருந்து பிறந்தது மனித இயல்பே.’ கிரேக்கச் சொல் சில சூழல்களில் வீழ்ச்சியடைந்த அல்லது பாவமுள்ள மனித இயல்பைக் குறிக்கலாம்; ஆனால் இங்கு முதன்மையான வேறுபாடு இயற்கையான மனிதப் பிறப்புக்கும் ஆவியாரிடமிருந்து வரும் பிறப்புக்கும் இடையேயானது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆவியாரிடமிருந்து பிறந்தது ஆவிக்குரியதே.’ கிரேக்க மூலத்தில் ‘ஆவியே’ என்ற பெயர்ச்சொல் வடிவமே உள்ளது; இது ‘மாம்சம்’ என்பதற்கு எதிரான தரத்தன்மையைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: பிறந்தது
  rationale: நபுஞ்சக ஒருமை வினையெச்ச அமைப்பு ஒரு குறிப்பிட்ட நபரை அல்லாமல் பொதுவான வகையைச் சுட்டுகிறது. ‘பிறந்தது’ என்பது இந்தப் பொதுமைப்படுத்தும் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ
  choice: -இலிருந்து / -இடமிருந்து
  rationale: இங்கு பிறப்பின் மூலம் அல்லது தோற்றுவாயைக் குறிக்கிறது. மாம்சத்துக்கு ‘மாம்சத்திலிருந்து’ என்றும், ஆவியாரை தனிப்பட்ட செயலாளராகத் தெளிவுபடுத்த ‘ஆவியாரிடமிருந்து’ என்றும் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: σάρξ / σαρκὸς
  choice: மாம்சம் / மாம்சத்திலிருந்து
  rationale: இயற்கையான மனிதப் பிறப்புக்கும் ஆவியாரால் உண்டாகும் பிறப்புக்கும் உள்ள யோவானிய முரண்பாட்டை ‘மாம்சம்’ நேரடியாகப் பாதுகாக்கிறது; ‘பாவ இயல்பு’ என்று மொழிபெயர்ப்பது இச்சூழல் கூறுவதைவிடக் குறுகிய ஒழுக்கவியல் பொருளைத் திணிக்கும்.
- source_word: πνεύματος
  choice: ஆவியாரிடமிருந்து
  rationale: உறுப்புடன் வரும் முதல் பயன்பாடு இச்சூழலில் பரிசுத்த ஆவியாரைக் குறிக்கிறது. தமிழ் மரியாதை ஒருமையும் ‘-இடமிருந்து’ என்ற உயிருள்ள மூலத்தைக் குறிக்கும் வடிவமும் அந்தக் குறிப்பைத் தெளிவாக்குகின்றன.
- source_word: πνεῦμά
  choice: ஆவி
  rationale: உறுப்பில்லாத பயனிலைப் பெயர்ச்சொல் விளைவின் இயல்பைத் தரமாகக் குறிக்கிறது. ‘ஆவிக்குரியது’ என்று விளக்கமாக மாற்றாமல், கிரேக்கத்தின் ‘ஆவியாயிருக்கிறது’ என்ற இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐστιν
  choice: ஆயிருக்கிறது
  rationale: வரையறைபோன்ற, காலத்தைக் கடந்த கூற்றையும் இரு கூறுகளின் இணை அமைப்பையும் தமிழில் காக்கிறது.
theological_decisions:
- issue: முதல் கூறில் σάρξ என்பதன் பொருள்
  choice: இயற்கையான மனிதப் பிறப்பின் தளத்தைக் குறிக்கும் ‘மாம்சம்’
  alternative: ‘மனித இயல்பு’ அல்லது ‘பாவ இயல்பு’
  rationale: σάρξ சில சூழல்களில் விழுந்துபோன அல்லது பாவமுள்ள மனித இயல்பைக் குறிக்கலாம். ஆனால் இங்கு முதன்மையான எதிரிடை இயற்கைப் பிறப்புக்கும் ஆவியாரிடமிருந்து வரும் பிறப்புக்கும் இடையே உள்ளது; எனவே ஒழுக்கவியல் பொருளைத் திணிக்காமல் மூலச்சொல்லின் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: இரண்டாம் கூறிலுள்ள பயனிலை πνεῦμα என்பதன் குறிப்பு
  choice: விளைவின் ஆவிக்குரிய இயல்பைக் காக்கும் ‘ஆவி’
  alternative: ‘ஆவியார்’ அல்லது ‘ஆவிக்குரியது’
  rationale: மூலத்தில் முதல் πνεῦμα ஆவியாரைப் பிறப்பின் மூலமாகக் குறிக்கிறது; இரண்டாவது உறுப்பில்லாத பயனிலைப் பெயர்ச்சொல் தரத்தன்மையை வலியுறுத்துகிறது. ‘ஆவி’ என்பது பிறந்தது பரிசுத்த ஆவியாரே என ஒன்றாக்காமல் இந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’ மற்றும் ‘ஆவி’ என்ற இணையான பெயர்ச்சொல் அமைப்பு மூலத்தின் சுருக்கமான, மொழிமுறைத் தன்மையைப் பாதுகாக்கிறது. பரிசுத்த ஆவியாரைக் குறிக்கும் இடத்தில் ‘ஆவியார்’ என்றும், விளைவின் இயல்பைக் குறிக்கும் இடத்தில் ‘ஆவி’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
