source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: ta
  text: தீமையானவற்றைச் செய்துவருகிற ஒவ்வொருவரும்[b] ஒளியை வெறுக்கிறார்கள்; தங்கள் செயல்கள் வெளிப்படுத்தப்படாதபடி[a], அவர்கள் ஒளியிடம் வருவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெளிப்படுத்தப்படுதல்” என்பதற்கு “தவறென்று காட்டப்படுதல்,” “கண்டிக்கப்படுதல்,” அல்லது “குற்றம் நிரூபிக்கப்படுதல்” என்றும் பொருள் கொள்ளலாம். கிரேக்க வினை, தவறை வெளிக்கொணர்ந்து அதன் குற்றத்தன்மையைக் காட்டும் பொருள் வரம்பைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இக்கூற்று ஒருமை ஆண்பால் வடிவில் இருந்தாலும், தீமை செய்கிற எந்த நபரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: ஒவ்வொருவரும்
  rationale: குறிப்பிட்ட செயலில் ஈடுபடும் யாரையும் பொதுவாகக் குறிக்கும் πᾶς + பெயராக்கப்பட்ட பங்கேற்புவினையின் பொருளை இது இயல்பான தமிழில் தருகிறது. γάρ முன்னைய வசனத்திற்கான விளக்கத் தொடர்பை அளிக்கிறது; தமிழில் வாக்கிய ஓட்டத்தால் அந்தத் தொடர்பு தெளிவாக இருப்பதால் தனிச் சொல் சேர்க்கப்படவில்லை.
- source_word: φαῦλα
  choice: தீமையானவற்றை
  rationale: யோவானின் ஒளி–இருள் எதிர்மறை அமைப்பில் இச்சொல் அறநெறி சார்ந்த தீமையைக் குறிக்கிறது; வெறும் ‘கெட்டவற்றை’ அல்லது ‘பயனற்றவற்றை’விட இது பொருத்தமானது.
- source_word: πράσσων
  choice: செய்துவருகிற
  rationale: நிகழ்காலப் பங்கேற்புவினை குறிக்கும் தொடர்ச்சியான அல்லது ஒருவரை வகைப்படுத்தும் நடத்தையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μισεῖ
  choice: வெறுக்கிறார்கள்
  rationale: μισέω என்பதன் வலுவான எதிர்ப்புணர்வை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: யோவான் நூலில் வெளிப்பாடு, உண்மை, இறை வெளிப்படுத்தல் ஆகியவற்றோடு தொடர்புடைய முக்கிய உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே வைத்திருக்கிறது.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: ஒளியிடம் வருவதில்லை
  rationale: ஒளியை நோக்கி வருதல் என்ற யோவானிய இயக்க உருவகத்தை எளிய, இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἵνα μὴ
  choice: வெளிப்படுத்தப்படாதபடி
  rationale: எதிர்மறை நோக்கம் அல்லது தவிர்க்கும் எண்ணத்தைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐλεγχθῇ
  choice: வெளிப்படுத்தப்படாதபடி
  rationale: ஒளி செயல்களை வெளிக்கொணரும் சூழலில் ἐλέγχω என்பதன் ‘தவறை வெளிப்படுத்துதல்’ என்ற பொருளை முன்னிலைப்படுத்துகிறது; கண்டித்தல் அல்லது குற்றவாளியென நிரூபித்தல் என்ற சாத்தியங்களும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τὰ ἔργα αὐτοῦ
  choice: தங்கள் செயல்கள்
  rationale: ἔργα என்பதற்கு ‘செயல்கள்’ இயல்பான தமிழ். ஒருமை ஆண்பால் பொதுப்பயன்பாட்டைத் தமிழ் வழக்கில் பாலினம் சுட்டாத ‘ஒவ்வொருவரும் … தங்கள்’ என்ற கட்டமைப்பு இயல்பாக எடுத்துரைக்கிறது.
theological_decisions:
- issue: பொதுவான கூற்றிலுள்ள ஒருமை ஆண்பால் வடிவம்
  choice: ஒவ்வொருவரும் … தங்கள் செயல்கள்
  alternative: ஒவ்வொருவனும் … அவனுடைய செயல்கள்
  rationale: கிரேக்க ஒருமை ஆண்பால் இலக்கண வடிவம் இங்கு ஆண்களை மட்டும் அல்ல, தீமை செய்கிற எந்த நபரையும் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் பாலினம் சுட்டாத வடிவம் அதே பொதுமையைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- issue: ஒளியுடன் தொடர்புடைய ἐλεγχθῇ என்பதன் பொருள்
  choice: வெளிப்படுத்தப்படுதல்
  alternative: கண்டிக்கப்படுதல் அல்லது குற்றம் நிரூபிக்கப்படுதல்
  rationale: ஒளி மறைந்த செயல்களை வெளிக்கொணரும் உருவகம் இச்சூழலில் முதன்மையானது. அதே நேரத்தில் கிரேக்க வினையின் கண்டித்தல் மற்றும் குற்றத்தை உணர்த்துதல் சார்ந்த பொருள் வரம்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒளி’ என்ற யோவானிய உருவகமும், தொடர்ச்சியான நடத்தையை உணர்த்தும் ‘செய்துவருகிற’ என்பதும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் பிரதான உரையில் இடப்பட்டுள்ளன.
