id: JHN.3.1
reference: John 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: ta
  text: பரிசேயரைச் சேர்ந்த ஒரு மனிதர் இருந்தார். அவருடைய பெயர் நிக்கொதேமு. அவர் யூதர்களின்[a] ஒரு தலைவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின் ஒரு தலைவர்.” கிரேக்கச் சொல் பொதுவாக யூதர்களைக் குறிக்கலாம்; சில சூழல்களில் குறிப்பாக யூதேயர்களையோ யூத அதிகாரிகளையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: இருந்தார்
  rationale: ἦν என்பதன் இருப்பை அறிமுகப்படுத்தும் பொருளை இயல்பான தமிழில் தருகிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சிக் குறி என்பதால், மூலத்தில் இல்லாத வெளிப்படையான காலச்சொல்லைச் சேர்க்காமல் வாக்கிய அமைப்பின் வழியே அதன் தொடர்ச்சி உணர்த்தப்படுகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: குறிப்பிட்ட ஓர் ஆண் நபரைச் சுட்டுகிறது; மரியாதையும் இயல்பும் கொண்ட நவீனத் தமிழ் வடிவம்.
- source_word: ἐκ τῶν Φαρισαίων
  choice: பரிசேயரைச் சேர்ந்த
  rationale: ἐκ உடன் வரும் பன்மைச் சொல், அந்தக் குழுவுக்குள் சேர்ந்தவர் என்ற தொடர்பை இங்கு குறிக்கிறது.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: அவருடைய பெயர் நிக்கொதேமு
  rationale: கிரேக்கப் பெயரிடும் தொடரைத் தெளிவான, இயல்பான தமிழில் அளிக்கிறது.
- source_word: ἄρχων
  choice: தலைவர்களில் ஒருவர்
  rationale: அதிகாரப் பதவி வகிப்பவரைக் குறிக்கும் ἄρχων என்பதன் பொருளைத் தருகிறது. தமிழ் வழக்கில் பன்மைக் குழுவோடு இணையும் இந்த வடிவம், நிக்கொதேமு ஒரே தலைவர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: இச்சூழலில் யூதச் சமூகத்தையோ அதன் தலைமையையோ குறிக்கும் விரிந்த பொருளை இயல்பாகத் தருகிறது; சாத்தியமான யூதேயர்/யூத அதிகாரிகள் என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதேயர்களின்; யூத அதிகாரிகளின்
  rationale: இச்சொல் இன, சமய, பிராந்திய அல்லது அதிகாரத் தலைமைக் குறிப்பைக் கொண்டிருக்கலாம். நிக்கொதேமு ஒரு பரிசேயரும் அதிகாரம் வகிப்பவருமாக அறிமுகப்படுத்தப்படுவதால், முதன்மை உரையில் விரிந்த பொருளை வைத்துக்கொண்டு, குறுகிய சாத்தியங்களை அடிக்குறிப்பில் தெரிவிப்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க அறிமுக வாக்கியம் தமிழின் இயல்புக்கேற்ப மூன்று குறுகிய வாக்கியங்களாகப் பிரிக்கப்பட்டது; கருத்துச் சார்பு பாதுகாக்கப்பட்டது.
