source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: ta
  text: இவர் இரவில்[a] இயேசுவிடம் வந்து, “ரபி, நீர் கடவுளிடமிருந்து ஆசிரியராக வந்திருக்கிறீர் என்று நாங்கள் அறிந்திருக்கிறோம். ஏனெனில், நீர் செய்கிற இந்த அடையாளங்களை[b], கடவுள் அவரோடு இல்லாவிட்டால் எவராலும் செய்ய முடியாது[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரவு நேரத்தில்’ என்றும் மொழிபெயர்க்கலாம். யோவான் நூலில் இரவும் இருளும் சில இடங்களில் குறியீட்டுப் பொருளையும் கொண்டிருப்பதால், இச்சொல்லுக்கு அத்தகைய கருத்தொலியும் இருக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த அற்புத அடையாளங்களை’ என்றும் மொழிபெயர்க்கலாம். யோவான் நூலில் கிரேக்கச் சொல் σημεῖα, தம்மைத் தாண்டிய உண்மையைச் சுட்டும் செயல்களைக் குறிப்பதால், இங்கு ‘அடையாளங்கள்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், ‘கடவுள் அவரோடு இல்லாவிட்டால்’ என்று மூன்றாம் நபர் வடிவமே உள்ளது. ‘கடவுள் உம்மோடு இல்லாவிட்டால்’ என்று நேரடி அழைப்பாகவும் தமிழில் இயல்பாக்கலாம்.
    reason: source_texture
lexical_decisions:
- source_word: οὗτος
  choice: இவர்
  rationale: முந்தைய வசனத்தில் அறிமுகப்படுத்தப்பட்ட நிக்கொதேமுவைச் சுட்டுகிறது; தமிழில் ஆண் ஒருவரைக் கண்ணியமாகச் சுட்டும் இயல்பான வடிவம்.
- source_word: νυκτός
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் இச்சொல் தமிழில் இயல்பாக ‘இரவில்’ என வருகிறது; யோவான் நூலில் இரவு/இருள் பெறக்கூடிய கருத்தொலியை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: Ῥαββί
  choice: ரபி
  rationale: கிரேக்க உரையே தக்கவைத்துள்ள யூத அழைப்புப் பட்டத்தை ஒலிபெயர்த்து, வரலாற்றுச் சூழலைப் பாதுகாக்கிறது.
- source_word: οἴδαμεν
  choice: நாங்கள் அறிந்திருக்கிறோம்
  rationale: முதல் நபர் பன்மையை ஒருமையாக மாற்றாமல் தக்கவைக்கிறது; இது ஒரு குழுவின் சார்பான கூற்றாக இருக்கலாம்.
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: நீர் கடவுளிடமிருந்து போதகராக வந்திருக்கிறீர்
  rationale: ‘வந்திருக்கிறீர்’ என்பது நிறைவுற்ற வருகையின் தற்போதைய தொடர்பைப் பிரதிபலிக்கிறது; ‘அனுப்பப்பட்டீர்’ என்ற உரையில் இல்லாத வலுவான கருத்தைச் சேர்க்கவில்லை.
- source_word: ταῦτα τὰ σημεῖα
  choice: இந்த அடையாளங்கள்
  rationale: யோவான் நூலில் இச்செயல்கள் தம்மைத் தாண்டிய உண்மையைச் சுட்டுவதால், வெறும் ‘அற்புதங்கள்’ என்பதற்குப் பதிலாக ‘அடையாளங்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: நீர் செய்கிற ... எவராலும் செய்ய முடியாது
  rationale: மூலத்தில் ποιέω திரும்பத் திரும்ப வருவதைத் தமிழிலும் ‘செய்’ என்ற வினையால் தக்கவைக்கிறது.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: கடவுள் அவரோடு இல்லாவிட்டால்
  rationale: நிக்கொதேமு இயேசுவை நேரடியாக ‘நீர்’ என்று அழைத்தபின் மூன்றாம் நபரான ‘அவரோடு’ என்று கூறும் மூல உரையின் மாற்றத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவான் நூலில் σημεῖα என்பதன் மொழிபெயர்ப்பு
  choice: அடையாளங்கள்
  alternative: அற்புதங்கள் / அற்புத அடையாளங்கள்
  rationale: இச்செயல்களின் அற்புதத் தன்மையை மறுக்காமல், அவை இயேசுவின் அடையாளத்தையும் பணியையும் சுட்டும் செயல்கள் என்ற யோவானின் கருத்துச் செறிவைப் பாதுகாக்கிறது.
- issue: நேரடி இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கு மாறுதல்
  choice: கடவுள் அவரோடு இல்லாவிட்டால்
  alternative: கடவுள் உம்மோடு இல்லாவிட்டால்
  rationale: கிரேக்கத்தில் உள்ள αὐτοῦ என்ற மூன்றாம் நபர் வடிவத்தை இயல்பாக்கி மறைக்காமல், நிக்கொதேமுவின் பேச்சிலுள்ள முறையான அல்லது மறைமுகமான தொனியைத் தக்கவைக்கிறது.
- issue: ἀπὸ θεοῦ ἐλήλυθας என்பது முறையான அனுப்புதலைக் குறிக்கிறதா
  choice: கடவுளிடமிருந்து ... வந்திருக்கிறீர்
  alternative: கடவுளால் அனுப்பப்பட்டிருக்கிறீர்
  rationale: இவ்வசனம் கடவுளிடமிருந்து வந்ததைக் கூறுகிறது; ‘அனுப்பு’ என்ற வினை இங்கு இல்லாததால், அதைவிட வலுவான இறையியல் கருத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நேரடி அழைப்புக்கு ‘நீர்/வந்திருக்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘இவர்’ மற்றும் ‘என்றார்’ ஆகியவை நிக்கொதேமுவைக் கண்ணியமாகக் குறிப்பிடுகின்றன. உரை பொதுவாசகர்களுக்குப் புரியும்படி இயல்பாக அமைந்தாலும், ‘அடையாளங்கள்’ மற்றும் மூன்றாம் நபர் ‘அவரோடு’ போன்ற யோவானிய உரைத் தன்மைகள் பாதுகாக்கப்பட்டுள்ளன.
