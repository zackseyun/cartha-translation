source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: ta
  text: மணமகளை உடையவர் மணமகன். மணமகனின் நண்பரோ, நின்று அவரைக் கேட்டு, மணமகனுடைய குரலினிமித்தம் மிகவும் மகிழ்கிறார்[a]. ஆகவே, என்னுடைய இந்த மகிழ்ச்சி நிறைவடைந்துள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “மகிழ்ச்சியால் மகிழ்கிறார்”; இந்தக் கிரேக்கச் சொற்றொடர் மிகுந்த மகிழ்ச்சியை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிறைவு பெற்றுள்ளது.” இந்தக் கிரேக்க வினைச்சொல் முழுமை அல்லது நிறைவை எட்டிய நிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: மணமகளை உடையவரே
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் பொதுமையான ஒருமையைத் தக்கவைத்து, மணவிழா உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νυμφίος
  choice: மணமகன்
  rationale: νύμφη என்பதற்கான ‘மணமகள்’ என்பதோடு நேரான இணைப்பை ஏற்படுத்தி, திருமண உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: φίλος τοῦ νυμφίου
  choice: மணமகனின் நண்பர்
  rationale: கிரேக்கத்தில் உள்ள ‘நண்பர்’ என்ற சொல்லை நேரடியாகப் பாதுகாக்கிறது; ‘மாப்பிள்ளைத் தோழன்’ போன்ற குறிப்பிட்ட பண்பாட்டு பதவியை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: நின்று அவர் பேசுவதைக் கேட்டு
  rationale: ἑστηκὼς காட்டும் நிலைத்திருக்கும்/அருகில் நிற்கும் நிலையை ‘நின்று’ எனப் பாதுகாக்கிறது. αὐτοῦ உடன் வரும் ἀκούων, அவரைக் கேட்பதைக் குறிக்கிறது; தமிழில் பொருள் இயல்பாக அமைய ‘அவர் பேசுவதைக் கேட்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: χαρᾷ χαίρει
  choice: மிகவும் மகிழ்கிறார்
  rationale: ஒரே வேர் கொண்ட பெயர்ச்சொல்–வினைச்சொல் சேர்க்கையின் வலியுறுத்தலை, தமிழில் செயற்கையாக இல்லாமல் ‘மிகவும்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: மணமகனுடைய குரலினிமித்தம்
  rationale: διά + குற்றுவேற்றுமை காட்டும் காரணத்தைத் தக்கவைத்து, φωνή என்பதை ‘குரல்’ என நேரடியாக மொழிபெயர்க்கிறது.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: ஆகவே, என்னுடைய இந்த மகிழ்ச்சி
  rationale: οὖν-இன் முடிவு/விளைவு தொடர்பையும், αὕτη மற்றும் வலியுறுத்தப்பட்ட உடைமையையும் பாதுகாக்கிறது.
- source_word: πεπλήρωται
  choice: இப்போது நிறைவடைந்துள்ளது
  rationale: நிறைவை எட்டிய தற்போதைய நிலையைச் சுட்டும் நிறைவுற்ற வினை வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இப்போது’ என்பது சூழலில் வந்தடைந்த நிலையைத் தெளிவாக்குகிறது, புதிய காலக் கருத்தைத் திணிப்பதில்லை.
theological_decisions:
- issue: மணவிழா உருவகமும் யோவானின் நிலையும்
  choice: மணமகன், மணமகள், மணமகனின் நண்பர் என்ற உருவகச் சொற்கள் விளக்க விரிவாக்கமின்றிப் பாதுகாக்கப்பட்டன.
  alternative: ‘மணமகள்’ என்பவரை சபை அல்லது தேவமக்கள் என்று வெளிப்படையாக அடையாளப்படுத்துதல்; ‘நண்பர்’ என்பதை ஒரு குறிப்பிட்ட திருமணப் பதவியாக மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் மணமகள் யாரைக் குறிக்கிறார் என்பதை வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே பிற்கால திருச்சபையியல் முடிவுகளையோ குறிப்பிட்ட பண்பாட்டு பங்கையோ மொழிபெயர்ப்புக்குள் சேர்க்காமல் உருவகத்தின் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘மணமகனின் நண்பர்’ என்பது மூலத்தின் சொற்பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட பண்பாட்டு பதவி சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
