source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: ta
  text: அவர்கள் யோவானிடம் வந்து, அவரிடம், “ரபீ, யோர்தானுக்கு அக்கரையில் உம்முடன் இருந்தவர்—நீர் யாரைக் குறித்து சாட்சி கூறினீரோ[a]—இதோ, இவர்தான் திருமுழுக்கு அளிக்கிறார்[b]; எல்லாரும் அவரிடம் போகிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் யாருக்குச் சாட்சி கூறினீரோ.” கிரேக்க வேற்றுமை அமைப்பு, சாட்சி அவரைக் குறித்துக் கூறப்பட்டதாகவோ அவருக்குக் கூறப்பட்டதாகவோ மொழிபெயர்க்க இடமளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இவர்தான்’ என்பது கிரேக்கத்தில் உள்ள சுட்டுப்பெயரின் அழுத்தத்தை வெளிப்படுத்துகிறது. குறைந்த அழுத்தத்துடன், “அவர் திருமுழுக்கு அளிக்கிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: யோவானிடம் வந்து
  rationale: ἔρχομαι சூழலின்படி ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படலாம். இங்கு யோவானை அணுகுவதை இயல்பான தமிழ் நடையில் ‘யோவானிடம் வந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: யூதச் சூழலையும் யோவான் நற்செய்தியின் வழக்கையும் காக்க, பட்டப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: யோர்தானுக்கு அக்கரையில் உம்முடன் இருந்தவர்
  rationale: உறவுப்பெயர்ச்சொல் தமிழில் இயல்பாக ‘இருந்தவர்’ என வழங்கப்பட்டுள்ளது; πέραν என்பது ஆற்றின் மறுபக்கத்தைக் குறிக்கும் ‘அக்கரையில்’ எனத் தரப்பட்டுள்ளது.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: நீர் யாரைக் குறித்து சாட்சி கூறினீரோ
  rationale: μαρτυρέω என்பதன் யோவானிய ‘சாட்சி’ சொல்லாட்சியைத் தக்கவைத்து, நிறைவுக்கால வினையின் முன் நிகழ்ந்தும் இப்போது பொருத்தமுள்ள செயலைத் தமிழ் உறவுத்தொடர் இயல்பாக வெளிப்படுத்துகிறது. கிரேக்க வேற்றுமைத் தொடரின் மாற்று புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἴδε οὗτος
  choice: இதோ, இவர்தான்
  rationale: ἴδε என்பதன் கவன ஈர்ப்பையும் οὗτος என்பதன் சுட்டிக்காட்டும் அழுத்தத்தையும் இயல்பான நவீன தமிழில் இவ்வாறு காக்கிறது.
- source_word: βαπτίζει
  choice: திருமுழுக்கு அளிக்கிறார்
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைத் தமிழ் நிகழ்கால வடிவம் வெளிப்படுத்துகிறது; ‘திருமுழுக்கு’ என்பது செயலைத் தெளிவாகவும் மரியாதையான நடையிலும் குறிக்கிறது.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: எல்லாரும் அவரிடம் போகிறார்கள்
  rationale: πάντες என்பதிலுள்ள பேச்சாளர்களின் மிகைப்படுத்திய பொதுமைப்படுத்தலை ‘எல்லாரும்’ காக்கிறது; அவர்களது பார்வையில் அந்த நபரை நோக்கிச் செல்லும் இயக்கம் ‘போகிறார்கள்’ என இயல்பாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: யோவான் நற்செய்தியின் சாட்சி சொல்லாட்சி
  choice: சாட்சி கூறினீரோ
  alternative: சான்றளித்தீரோ
  rationale: μαρτυρέω என்ற சொல்லின் யோவானிய இறையியல் தொடர்பையும் முக்கியச் சொல்லின் தொடர்ச்சியையும் ‘சாட்சி’ தெளிவாகக் காக்கிறது; சட்ட மொழிபோல் ஒலிக்கக்கூடிய மாற்று தவிர்க்கப்பட்டுள்ளது.
- issue: ᾧ என்ற வேற்றுமை வடிவத்தின் தொடர்பு
  choice: யாரைக் குறித்து
  alternative: யாருக்குச் சாட்சி கூறினீரோ
  rationale: சூழலில் சாட்சியின் பொருள் அந்த நபரைப் பற்றியதாக இருப்பது இயல்பான வாசிப்பு. எனினும் கிரேக்க தத்திவ் வடிவம் சாட்சி அவருக்குக் கூறப்பட்டதாகவும் வடிக்கப்படலாம்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: οὗτος என்பதன் சுட்டும் அழுத்தம்
  choice: இவர்தான்
  alternative: அவர்
  rationale: சீடர்களின் கூற்றிலுள்ள சுட்டிக்காட்டும் அல்லது குறைபாட்டுத் தொனியை முற்றிலும் தணிக்காமல் காக்கிறது; அதேவேளை தமிழில் அவமரியாதையான சொல் பயன்படுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. யோவானை நோக்கிய உரையில் ‘உம்முடன்’, ‘கூறினீரோ’ என்ற மரியாதை ஒருமை காக்கப்பட்டுள்ளது. ‘இதோ, இவர்தான்’ என்பது மூலத்தின் கவன ஈர்ப்பையும் சுட்டும் அழுத்தத்தையும் இயல்பாகத் தருகிறது.
