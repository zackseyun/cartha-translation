source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: ta
  text: காற்று தான் விரும்பும் இடத்தில் வீசுகிறது[a]. அதன் ஓசையை நீ கேட்கிறாய்; ஆனால் அது எங்கிருந்து வருகிறது, எங்கே போகிறது என்பது உனக்குத் தெரியாது[b]. ஆவியிலிருந்து பிறந்த ஒவ்வொருவரும் இப்படித்தான் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் πνεῦμα என்ற ஒரே சொல் ‘காற்று’ என்றும் ‘ஆவி’ என்றும் பொருள்படலாம். இந்த வசனத்தின் முதல் பகுதியிலும் இறுதிப் பகுதியிலும் இயேசு அதே சொல்லைப் பயன்படுத்துவதால் ஒரு சொல்விளையாட்டு உருவாகிறது; தமிழில் அதை முழுமையாக ஒரே சொல்லால் காட்ட முடியாது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஓசை’ என்பதற்குப் பதிலாக ‘குரல்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் இரு பொருள்களையும் தரக்கூடும். இங்கு அது காற்றினால் கேட்கப்படும் ஒலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (முதல் நிகழ்வு)
  choice: காற்று
  rationale: πνεῖ (‘வீசுகிறது’) என்பதுடனும் கேட்கப்படும் φωνή என்பதுடனும் இணைந்திருப்பதால், இங்கு வானிலைச் சார்ந்த ‘காற்று’ என்ற பொருள் இயல்பானது. இறுதியில் வரும் πνεῦμα ‘ஆவி’ என மொழிபெயர்க்கப்பட்டு, மூலத்தின் சொல்விளையாட்டு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: ὅπου θέλει
  choice: தான் விரும்பும் இடத்தில்
  rationale: θέλει-இன் விருப்பம் அல்லது சித்தம் என்ற கருத்தை இயல்பான நவீன தமிழில் காட்டுகிறது; காற்றை ஆளுருவாக்கும் கிரேக்க நடையையும் தக்கவைக்கிறது.
- source_word: πνεῖ
  choice: வீசுகிறது
  rationale: πνεῦμα இங்கு ‘காற்று’ என்பதால், வானிலைப் படிமத்திற்கு ‘வீசுகிறது’ என்பதே இயல்பான தமிழ்.
- source_word: φωνήν
  choice: ஓசை
  rationale: φωνή ‘குரல்’ அல்லது ‘ஓசை’ எனப் பொருள்படலாம். காற்று கேட்கப்படுவது இங்கு கருத்தாக இருப்பதால் ‘ஓசை’ தெளிவும் இயல்பும் உடையது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: அது எங்கிருந்து வருகிறது, எங்கே போகிறது என்பது உனக்குத் தெரியாது
  rationale: πόθεν/ποῦ என்ற இணையான இடவினாக்களையும் ἔρχεται/ὑπάγει என்ற இயக்கத்தையும் இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: οὕτως ἐστίν
  choice: இப்படித்தான் இருக்கிறார்
  rationale: முன்னுள்ள காற்றின் உவமையை ஆவியினால் பிறந்தவருக்குப் பொருத்தும் ஒப்புமை வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ γεγεννημένος
  choice: பிறந்த ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் தன்மையுள்ள பொதுப்படையான கட்டமைப்பை உள்ளடக்கிய தமிழில் காட்டுகிறது. γεγεννημένος என்னும் நிறைவேற்றப் பங்கேற்புச் சொல்லின் விளைவுநிலையை ‘பிறந்த’ இயல்பாகச் சுமக்கிறது.
- source_word: ἐκ τοῦ πνεύματος (இறுதி நிகழ்வு)
  choice: ஆவியினால்
  rationale: யோவான் 3-இன் மறுபிறப்பு சூழலில் πνεῦμα தேவ ஆவியைக் குறிக்கிறது. ἐκ காட்டும் மூலத்தையும் செயலாக்கும் காரணத்தையும் ‘ஆவியினால்’ இயல்பாக வெளிப்படுத்துகிறது; ‘ஆவியிடமிருந்து’ என்பதும் இலக்கண ரீதியாக சாத்தியம்.
theological_decisions:
- issue: ஒரே வசனத்தில் இருபொருளுடன் மீளும் πνεῦμα
  choice: முதல் நிகழ்வை ‘காற்று’ என்றும் இறுதி நிகழ்வை ‘ஆவி’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘ஆவி’ அல்லது இரண்டையும் ‘காற்று’ என மொழிபெயர்த்தல்; அல்லது முதல் நிகழ்வை ‘ஆவி’ என வைத்து ‘காற்று’ என்பதை அடிக்குறிப்பில் தருதல்
  rationale: முதல் பகுதியின் ‘வீசுதல்’ மற்றும் கேட்கப்படும் ஓசை காற்றைப் படமாக்குகின்றன; இறுதிப் பகுதி ஆவியினால் உண்டாகும் பிறப்பைக் குறிக்கிறது. கிரேக்கத்தின் ஒரே சொல் தாங்கும் இருபொருளை ஒரே இயல்பான தமிழ்ச் சொல்லால் முழுமையாகத் தக்கவைக்க முடியாததால், உரையில் சூழலுக்கேற்ற வேறுபாட்டையும் அடிக்குறிப்பில் சொல்விளையாட்டையும் பாதுகாக்கிறது.
- issue: ἐκ τοῦ πνεύματος காட்டும் உறவு
  choice: ‘ஆவியினால் பிறந்த’
  alternative: ‘ஆவியிடமிருந்து பிறந்த’ அல்லது ‘ஆவியால் பிறந்த’
  rationale: ἐκ அடிப்படையில் மூலத்தையோ தோற்றத்தையோ குறிக்கிறது. தமிழில் ‘ஆவியினால் பிறந்த’ என்பது ஆவியைப் பிறப்பின் மூலமும் செயல்படுத்துபவருமாக இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் உறவை ஒரு தனிப்பட்ட கோட்பாட்டு விளக்கமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘நீ’ என்பது கிரேக்க இரண்டாம் நபர் ஒருமையைத் தக்கவைக்கிறது. ‘தான் விரும்பும்’ என்பது காற்றின் ஆளுருவாக்கத்தை மிகைப்படுத்தாமல் காட்டுகிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
