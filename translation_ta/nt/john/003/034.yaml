id: JHN.3.34
reference: John 3:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: ta
  text: கடவுள் அனுப்பியவர் கடவுளின் வார்த்தைகளைப் பேசுகிறார். ஏனெனில் கடவுள் ஆவியை அளவின்றிக் கொடுக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் கடவுள் அனுப்பியவர் ஆவியை அளவின்றிக் கொடுக்கிறார்.” கிரேக்கத்தில் ‘கொடுக்கிறார்’ என்பதற்கான எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: அனுப்பியவர்
  rationale: உறவுப்பெயரின் ஆண்பால் ஒருமைச் சுட்டுதலை இயல்பான தமிழில் ‘கடவுள் அனுப்பியவர்’ என்ற பெயராக்கப்பட்ட தொடரால் வெளிப்படுத்துகிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பியவர்
  rationale: யோவான் நூலில் காணப்படும் அனுப்புதல் என்ற நேரடியான கருத்தையும் இறந்தகாலச் செயலையும் காக்கிறது.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: கடவுளின் வார்த்தைகளை
  rationale: பேசப்பட்ட சொற்கள் அல்லது உரைகளைச் சுட்டும் பன்மையையும் மூலத்தின் உடைமைத் தொடர்பையும் காக்கிறது.
- source_word: λαλεῖ
  choice: பேசுகிறார்
  rationale: நிகழ்காலத்தில் தொடரும் அல்லது பொதுவாக உண்மையான பேசுதலை இயல்பான மரியாதைத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐκ μέτρου
  choice: அளவின்றி
  rationale: மறுப்புடன் வரும் கிரேக்கச் சொற்றொடரின் ‘வரையறுக்கப்பட்ட அளவில் அல்ல’ என்ற உருவகப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: δίδωσιν
  choice: கொடுக்கிறார்
  rationale: நிகழ்கால வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியை
  rationale: இச்சூழலில் கடவுளின் ஆவியைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘தூய’ என்ற அடைமொழியைச் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: δίδωσιν (‘கொடுக்கிறார்’) என்பதன் எழுவாய்
  choice: முதன்மை உரையில் கடவுளை எழுவாயாக வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: கடவுள் அனுப்பியவரே ஆவியை அளவின்றிக் கொடுக்கிறார்
  rationale: கிரேக்கத்தில் எழுவாய் மறைந்துள்ளது. வாக்கிய ஓட்டத்தில் கடவுள் ஆவியைக் கொடுப்பதால் அவர் அனுப்பியவர் கடவுளின் வார்த்தைகளைப் பேசுகிறார் என்ற தொடர்பு பொருத்தமாக உள்ளது; அடுத்த வசனத்தில் தந்தை மகனுக்குக் கொடுப்பதும் இதற்கு ஆதரவாகிறது. இருப்பினும் அனுப்பப்பட்டவரை எழுவாயாகக் கொள்ளும் இலக்கண வாய்ப்பு உண்மையானது என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவியானவர்’ அல்லது ‘தூய ஆவி’ என்று விரிவாக்காமல் மூலத்தின் சுருக்கம் காக்கப்பட்டுள்ளது; மறைந்துள்ள எழுவாயின் இறையியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
