id: JHN.3.3
reference: John 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்துக் கூறினார்: “உறுதியாக, உறுதியாக உனக்குச் சொல்கிறேன்: ஒருவர் மேலிருந்து பிறக்காவிட்டால்,[a] அவரால் கடவுளுடைய அரசாட்சியைக் காண முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறுபடியும்.’ கிரேக்க வினையடை ‘மேலிருந்து’ என்றும் ‘மறுபடியும்’ என்றும் பொருள்படலாம்; அடுத்த வசனத்தில் வரும் உரையாடல் இந்த இரட்டைப் பொருளைச் சார்ந்துள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: மறுமொழியாக … என்றார்
  rationale: கிரேக்கத்தின் பதிலளித்தல் மற்றும் கூறுதல் ஆகிய இரு கூறுகளையும் இயல்பான நவீனத் தமிழில் சுருக்கமின்றிப் பிரதிபலிக்கிறது.
- source_word: Ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: இரட்டிப்பு தரும் வலியுறுத்தலைத் தக்கவைத்து, பொதுவான வாசகருக்கு உடனடியாகப் புரியும் தமிழைப் பயன்படுத்துகிறது.
- source_word: ἐὰν μή τις
  choice: ஒருவர் … பிறக்காவிட்டால்
  rationale: பாலினத்தைக் குறிப்பாக வரையறுக்காமல், நிபந்தனையின் பொதுவான தன்மையை இயல்பாகக் காட்டுகிறது.
- source_word: γεννηθῇ
  choice: பிறக்காவிட்டால்
  rationale: செயப்பாட்டு வடிவமான ‘பிறக்கப்படுதல்’ தமிழில் இயல்பற்றதால், அதே பொருளை இயல்பான பிறவினை வடிவில் தருகிறது; ‘மறுபடியும்’ என்பதைக் கிரியைக்குள் சேர்த்து ἄνωθεν என்பதைக் முன்கூட்டியே விளக்கவில்லை.
- source_word: ἄνωθεν
  choice: மேலிருந்து
  rationale: யோவான் நற்செய்தியின் மேலுலகத் தோற்றம் சார்ந்த கருத்தோட்டத்துக்கு ஏற்ற முதன்மைப் பொருள்; ‘மறுபடியும்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐ δύναται
  choice: அவரால் … முடியாது
  rationale: இயலாமையைக் குறிக்கும் கிரேக்க அமைப்பைத் தெளிவான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰδεῖν
  choice: காண
  rationale: நேரடியான சொற்பொருளைத் தக்கவைத்து, பார்த்தல், உணர்தல், பங்குபெறுதல் ஆகிய யோவானியப் பொருள் வாய்ப்புகளைத் திறந்தவையாக வைக்கிறது.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: βασιλεία என்பதிலுள்ள ஆட்சி மற்றும் ஆட்சிக்குட்பட்ட நிலை ஆகிய பொருள் பரப்பைத் தேவையின்றிக் குறுக்காமல் நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: ἄνωθεν என்பதன் பொருள்
  choice: மேலிருந்து
  alternative: மறுபடியும்; புதிதாக
  rationale: இச்சொல் ‘மேலிருந்து’ என்றும் ‘மறுபடியும்’ என்றும் பொருள்படக்கூடியது. யோவானின் மேலிருந்து/விண்ணிலிருந்து வரும் கருப்பொருள் முதன்மை உரையில் ‘மேலிருந்து’ என்பதை ஆதரிக்கிறது; அடுத்த வசனத்தில் நிக்கொதேமு புரிந்துகொள்ளும் விதம் ‘மறுபடியும்’ என்ற பொருளையும் உரையாடலில் செயல்படச் செய்கிறது. எனவே இரட்டைப் பொருள் அடிக்குறிப்பால் பாதுகாக்கப்படுகிறது.
- issue: ‘கடவுளுடைய அரசைக் காணுதல்’ என்பதன் பரப்பு
  choice: காண
  alternative: உணர்ந்தறிய; அனுபவிக்க
  rationale: ‘காண’ என்பது மூலச்சொல்லுக்கு நேரான இணை; அதை ‘உணர்ந்தறிதல்’ அல்லது ‘அனுபவித்தல்’ என்று விளக்கமாக மாற்றாமல், இறையரசை உணர்தல் அல்லது அதில் பங்குபெறுதல் என்ற சாத்தியமான உட்பொருளைத் திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘உறுதியாக, உறுதியாக’ என்ற இரட்டிப்பு மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது. ‘அவன்’ என்பது முந்தைய சூழலில் குறிப்பிடப்பட்ட நிக்கொதேமுவைச் சுட்டும் மூலப் பிரதிப்பெயரைப் பிரதிபலிக்கிறது; பொதுவான τις என்பதற்கு பாலினம் சுட்டாத ‘ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது.
