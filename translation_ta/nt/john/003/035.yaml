  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: ta
  text: தந்தை மகனை நேசிக்கிறார்; எல்லாவற்றையும் அவருடைய கையில் ஒப்படைத்திருக்கிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருடைய கையில் கொடுத்திருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் சொற்படியாக “அவருடைய கையில்” என்கிறது; இது அதிகாரம் அல்லது உடைமையை ஒருவரிடம் ஒப்படைப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: தந்தை
  rationale: யோவான் நற்செய்தியின் சூழலில் இது கடவுளை, மகனோடு உள்ள உறவில் குறிக்கும் தனிப்பட்ட உறவுப்பெயர். தமிழ் எழுத்தில் பெரிய எழுத்து வேறுபாடு இல்லாததால், சூழலே இத்தலைப்பின் சிறப்புப் பொருளைத் தெளிவாக்குகிறது.
- source_word: ἀγαπᾷ
  choice: அன்புகூருகிறார்
  rationale: நிகழ்கால வினை வடிவம் தொடர்ந்து நிலவும் அன்பை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: τὸν υἱόν
  choice: மகனிடம்
  rationale: இங்கு இயேசுவைத் தந்தையோடு உள்ள தனித்த உறவில் குறிக்கிறது. ‘அன்புகூரு’ என்பதோடு ‘-இடம்’ இயல்பான தமிழ் வேற்றுமை உருபாகும்.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மையான கிரேக்கச் சொல் கொடுக்கப்பட்டவற்றின் முழுமையான பரப்பைத் தக்கவைக்கிறது.
- source_word: δέδωκεν
  choice: ஒப்படைத்திருக்கிறார்
  rationale: கிரேக்க நிறைவுக்காலம் முடிவுற்ற செயலையும் அதன் தொடரும் விளைவையும் குறிக்கிறது. ‘ஒப்படைத்திருக்கிறார்’ அந்த நீடித்த நிலையைத் தமிழில் தெரிவிப்பதோடு, இச்சூழலில் உள்ள அதிகாரம் மற்றும் பொறுப்பு அளித்தல் என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: அவருடைய கையில்
  rationale: ‘அவருடைய கையில்’ என்பது கிரேக்க உருவகத்தைத் தக்கவைக்கிறது; அதேவேளை அதிகாரம் அல்லது உடைமை ஒருவரிடம் ஒப்படைக்கப்படுவதைத் தமிழிலும் புரிந்துகொள்ளக்கூடிய வகையில் சொல்கிறது.
theological_decisions:
- issue: தந்தைக்கும் மகனுக்கும் இடையிலான உறவு
  choice: ‘தந்தை’, ‘மகன்’ என்ற தனிப்பட்ட உறவுப்பெயர்கள் அப்படியே வைக்கப்பட்டுள்ளன.
  alternative: பொதுவான குடும்ப உறவைக் குறிக்கும் விதமாக அல்லது விளக்கவுரையாக மாற்றுதல்
  rationale: மூலவசனம் தந்தை–மகன் உறவை நேரடியாக முன்வைக்கிறது. அதைத் தக்கவைத்தல் கிறிஸ்துவைப் பற்றிய வசனத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: மகனிடம் ஒப்படைக்கப்பட்டவற்றின் பரப்பும் தொடரும் நிலையும்
  choice: πάντα என்பது ‘எல்லாவற்றையும்’ என்றும், δέδωκεν என்பது ‘ஒப்படைத்திருக்கிறார்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘எல்லாவற்றையும் கொடுத்தார்’
  rationale: இத்தேர்வு முழுமையான பரப்பையும், நிறைவுற்ற செயலின் தொடரும் விளைவையும் பாதுகாக்கிறது; ஆனால் வசனம் நேரடியாகக் கூறாத பிற்கால கோட்பாட்டு விவரங்களைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூருகிறார்’ மற்றும் ‘ஒப்படைத்திருக்கிறார்’ என்பவை இயல்புத்தன்மையையும் மூலத்தின் நிகழ்கால/நிறைவுக்கால நுணுக்கங்களையும் சமநிலைப்படுத்துகின்றன. மகனைக் குறிக்கும் மரியாதைப் பன்மை ‘அவருடைய’ பயன்படுத்தப்பட்டுள்ளது.
