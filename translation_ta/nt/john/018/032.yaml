id: JHN.18.32
reference: John 18:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: ta
  text: இயேசு தாம் எத்தகைய மரணத்தால் இறக்கவிருந்தார் என்பதைச் சுட்டிக்காட்டிச் சொன்ன வார்த்தை[a] நிறைவேறும்படி இது நடந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவின் கூற்று.”
    reason: λόγος இங்கு இயேசு கூறிய சொல்லையோ கூற்றையோ குறிக்கலாம்.
  - marker: b
    text: அதாவது, இயேசு தாம் இறக்கும் முறையை முன்பே சுட்டிக்காட்டியிருந்தார்; இது சிலுவை மரணத்தைக் குறிப்பதாகத் தெரிகிறது. யோவான் 12:32–33-ஐ ஒப்பிடுக.
    reason: ‘எத்தகைய மரணம்’ என்ற சொற்றொடரின் சூழல் சார்ந்த பொருளையும் தொடர்புடைய வசனத்தையும் வழங்குகிறது.
lexical_decisions:
- source_word: ἵνα
  choice: நிறைவேறும்படியாகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிகழ்வுடன் இவ்வசனத்தை இணைக்கும் நோக்கம்/விளைவு சார்ந்த தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘வே’ என்பது நிகழ்வுக்கும் இயேசுவின் முன்னுரைக்கும் உள்ள தொடர்பை வலியுறுத்துகிறது.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: இயேசு ... சொன்ன வார்த்தை
  rationale: இங்கு λόγος என்பது யோவான் 1:1-இல் உள்ள பட்டப்பெயரான ‘வார்த்தை’ அல்ல; இயேசு முன்பு கூறிய உரையைக் குறிக்கிறது. ‘சொன்ன வார்த்தை’ என்பது இதைத் தெளிவாக்குகிறது.
- source_word: πληρωθῇ
  choice: நிறைவேறும்படியாக
  rationale: யோவான் நற்செய்தியில் முக்கியமான நிறைவேற்ற மொழிநடையைத் தக்கவைக்கிறது; ‘உண்மையாகும்படி’ என்பதைக் காட்டிலும் மூலத்தின் வேதாகமச் சார்பை நன்றாகப் பாதுகாக்கிறது.
- source_word: σημαίνων
  choice: சுட்டிக்காட்டிச் சொன்ன
  rationale: இயேசுவின் முந்தைய சொல் அவருடைய மரணத்தின் வகையைச் சுட்டியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கப் பெயரெச்சத்தின் தொடர்பையும் காக்கிறது.
- source_word: ποίῳ θανάτῳ
  choice: எத்தகைய மரணத்தால்
  rationale: ποίῳ என்பது மரணம் நிகழும் என்பதையே அல்ல, அதன் வகை அல்லது முறையைக் கேட்கிறது; கருவிப்பொருள் வேற்றுமையையும் ‘மரணத்தால்’ தக்கவைக்கிறது.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: இறக்கவிருந்தார்
  rationale: வரவிருந்த மரணத்தை இயல்பாகக் குறிக்கிறது; ‘இறக்கும்படி விதிக்கப்பட்டிருந்தார்’ போன்ற அதிக வலுவான முன்நியமனப் பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: இயேசுவின் முந்தைய சொல்லுக்கும் அதன் நிறைவேற்றத்துக்கும் உள்ள தொடர்பு
  choice: ‘சொன்ன வார்த்தை நிறைவேறும்படியாக’ என்ற நிறைவேற்ற மொழிநடை தக்கவைக்கப்பட்டது.
  alternative: ‘இயேசு சொன்னது உண்மையாகும்படி’
  rationale: πληρωθῇ என்பதன் இறையியல் நிறைவேற்றச் சார்பை மெலிதாக்காமல் காக்கிறது; அதேவேளையில் வசனம் கூறாத கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: μέλλω என்பதன் வலிமை
  choice: ‘இறக்கவிருந்தார்’
  alternative: ‘இறக்கும்படி விதிக்கப்பட்டிருந்தார்’
  rationale: மூலம் எதிர்வரும் நிகழ்வைக் குறிக்கிறது; இந்தச் சொல் மட்டும் கோரும் அளவைவிட வலுவான முன்நியமனக் கருத்தை மொழிபெயர்ப்பில் புகுத்தாமல் இருக்கிறது.
- issue: ‘எத்தகைய மரணம்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் சிலுவை மரணம் என்று வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் மறைசுட்டைத் தக்கவைத்தல்
  alternative: ‘சிலுவை மரணத்தால்’
  rationale: யோவான் 12:32–33 ஒப்பீட்டில் சிலுவை மரணம் நோக்கமாக இருப்பது தெளிவாகினும், இவ்வசனத்தின் கிரேக்க உரை அதை நேரடியாகப் பெயரிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ἵνα முந்தைய வசனத்தைச் சார்ந்திருப்பதால், தமிழில் தனிவசனமாக முழுமையாக ஒலிக்க ‘இது நடந்தது’ என்பது சூழலிலிருந்து வெளிப்படையாக நிரப்பப்பட்டுள்ளது. ‘தாம்’ என்பது இயேசுவையே திரும்பச் சுட்டி மரியாதை மற்றும் தெளிவை வழங்குகிறது.
