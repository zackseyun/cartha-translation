base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: ta
  text: சீமோன் பேதுரு நின்றபடியே குளிர்காய்ந்து கொண்டிருந்தார். ஆகவே அவர்கள் அவரிடம்[a], “நீயும் அவருடைய சீடர்களில் ஒருவன் அல்லவா?” என்று கேட்டார்கள். அவர் அதை மறுத்து, “நான் அல்ல” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீயும் அவருடைய சீடர்களில் ஒருவன் அல்ல, இல்லையா?” μή இடம்பெறும் கிரேக்கக் கேள்வி எதிர்மறையான பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: சீமோன் பேதுரு ... கொண்டிருந்தார்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் தனியான இணைப்புச்சொல் இல்லாமலேயே இயல்பாகத் தொடர முடிவதால், வெளிப்படையான கால அல்லது முரண்பாட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: நின்றுகொண்டு குளிர்காய்ந்துகொண்டிருந்தார்
  rationale: இரண்டு பங்கேற்பு வடிவங்களும் தொடர்ந்த நிலையையும் செயலையும் காட்டுகின்றன. ‘குளிர்காய்தல்’ என்பது நெருப்பருகில் உடலைச் சூடாக்கிக்கொள்வதற்கான இயல்பான நவீனத் தமிழ் சொல்; இந்த வசனத்தில் வெளிப்படையாக இல்லாத ‘நெருப்பருகில்’ சேர்க்கப்படவில்லை.
- source_word: εἶπον οὖν αὐτῷ
  choice: ஆகவே அவர்கள் அவரிடம் ... என்று கேட்டார்கள்
  rationale: οὖν காட்டும் விளைவு அல்லது தொடர்பை ‘ஆகவே’ தக்கவைக்கிறது. கேள்வி உரையை அறிமுகப்படுத்துவதால் εἶπον என்பதற்கு இயல்பான தமிழாக ‘கேட்டார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: நீயும் ... அல்ல, இல்லையா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வியை உருவாக்குகிறது; தமிழின் ‘அல்ல, இல்லையா?’ அமைப்பு அந்த எதிர்பார்ப்பை இயல்பாகக் காட்டுகிறது. καὶ σὺ என்பதிலுள்ள ‘நீயும்’ பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் ஒருவன்
  rationale: ἐκ + உரிமை வேற்றுமை ஒரு குழுவின் உறுப்பினராக இருப்பதைக் குறிக்கிறது; ‘சீடர்களில் ஒருவன்’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: அவர் அதை மறுத்து
  rationale: மறுக்கப்பட்ட கேள்வி அல்லது கூற்றைத் தமிழில் தெளிவுபடுத்த ‘அதை’ சேர்க்கப்பட்டது. ἐκεῖνος-இன் மென்மையான வலியுறுத்தலை மிகைப்படுத்தாமல் மரியாதை ஒருமை ‘அவர்’ பயன்படுத்தப்பட்டது.
- source_word: Οὐκ εἰμί
  choice: நான் அல்ல
  rationale: கிரேக்கத்தின் சுருக்கமான, நேரடியான மறுப்பைத் தக்கவைக்கிறது; ‘இல்லை’ அல்லது ‘அவர்களில் ஒருவன் அல்ல’ போன்ற விரிவாக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பேதுருவின் மறுப்பின் வரம்பு
  choice: இயேசுவின் சீடர்களில் ஒருவனாக இருப்பதைப் பற்றிய கேள்வியை நேரடியாக மறுப்பதாக மட்டும் மொழிபெயர்த்தல்
  alternative: ‘நான் அவர்களில் ஒருவன் அல்ல’ என்று விரிவுபடுத்துதல் அல்லது இயேசுவையே மறுத்ததாக வெளிப்படையாகக் கூறுதல்
  rationale: Οὐκ εἰμί என்பது கேள்வியின் சொற்களைச் சார்ந்த சுருக்கமான பதில். அதன் கதையியல் மற்றும் இறையியல் தாக்கத்தைத் தக்கவைத்தபடியே, மூலத்தில் இல்லாத விரிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், எளிமையானவும் கண்ணியமானவும் உள்ள உரைநடை பயன்படுத்தப்பட்டுள்ளது. பேதுருவைக் குறிப்பிட மரியாதை ஒருமை கையாளப்பட்டுள்ளது. கேள்வியின் எதிர்மறைப் பதில் எதிர்பார்ப்பை முதன்மை உரையும் அடிக்குறிப்பும் பாதுகாக்கின்றன.
