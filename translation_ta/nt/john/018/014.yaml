source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: ta
  text: மக்களுக்காக[b] ஒரே ஒரு மனிதன் இறப்பது நல்லது என்று யூதர்களுக்கு[a] ஆலோசனை கூறியிருந்தவர் காய்பாதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதத் தலைவர்களுக்கு” அல்லது “யூதேயர்களுக்கு”; யோவான் பயன்படுத்தும் “யூதர்கள்” என்ற சொல் இந்தச் சூழலில் எவ்வாறு புரிந்துகொள்ளப்படுகிறது என்பதைப் பொறுத்தது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மக்களின் சார்பாக”; இச்சொற்றொடர் இந்தச் சூழலில் பிரதிநிதித்துவ அல்லது பலியிடுதல் சார்ந்த உட்பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: … காய்பாதான்
  rationale: δέ இங்கு வலுவான எதிர்மறைத் திருப்பத்தை அல்ல, மென்மையான கதைத் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘ஆனால்’ என்பதைக் கூட்டாமல், ‘-தான்’ அமைப்பு அடையாளப்படுத்தும் வாக்கிய ஓட்டத்தை இயல்பாகத் தருகிறது.
- source_word: Καϊάφας
  choice: காய்பா
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
- source_word: ὁ συμβουλεύσας
  choice: ஆலோசனை கூறியிருந்தவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள இறந்தகாலப் பங்கேற்பு காய்பாவை அவர் முன்பு செய்த செயலால் அடையாளப்படுத்துகிறது; ‘கூறியிருந்தவர்’ அந்த முந்திய கால உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களுக்கு
  rationale: கிரேக்கத்தில் வரம்பிடும் கூடுதல் சொல் இல்லாததால் பொதுவான வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; சூழலில் ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’ என்று புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὅτι συμφέρει
  choice: … நல்லது என்று
  rationale: συμφέρει பயன் அல்லது சாதகத்தன்மையைக் குறிக்கிறது. ‘நல்லது’ என்பது இயல்பான நவீனத் தமிழ்; யாருக்கு நன்மை என்று மூலத்தில் இல்லாததைச் சேர்க்கவில்லை.
- source_word: ἕνα ἄνθρωπον
  choice: ஒரே ஒரு மனிதன்
  rationale: ‘ஒரே ஒரு’ என்பது எண்ணிக்கையான ஒருமையைத் தெளிவுபடுத்துகிறது; ‘மனிதன்’ இயேசுவைக் குறிக்கும் ஆண்பால் ஒருமையையும் காக்கிறது.
- source_word: ἀποθανεῖν
  choice: இறப்பது
  rationale: மூலத்தின் இறத்தல் கருத்தை விரிவாக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: மக்களுக்காக
  rationale: ὑπέρ இங்கு நன்மை, சார்பாகச் செயல், அல்லது பிரதிநிதித்துவம் ஆகிய நிழற்பொருள்களைத் தாங்க முடியும். ‘மக்களுக்காக’ இவற்றைத் திறந்தவாறு வைக்கிறது.
- source_word: λαοῦ
  choice: மக்கள்
  rationale: இந்த வசனத்தில் λαός என்பதே உள்ளது; ἔθνος அல்ல. ஆகவே ‘தேசம்’ என்பதைக் காட்டிலும் ‘மக்கள்’ மூலச்சொல்லுக்கு அணுக்கமானது.
theological_decisions:
- issue: ὑπὲρ τοῦ λαοῦ என்பதில் உள்ள பாவநிவாரண அல்லது பதிலீட்டு நிழற்பொருள்
  choice: மக்களுக்காக
  alternative: மக்களின் சார்பாக; மக்களுக்குப் பதிலாக
  rationale: ὑπέρ நன்மைக்காக அல்லது சார்பாக என்ற பொருளைக் கொண்டிருக்கலாம்; யோவானின் விரிந்த கதைச்சூழலில் பலி அல்லது பதிலீட்டு ஒலியும் இருக்கலாம். காய்பாவின் அரசியல் ஆலோசனையைப் பதிவு செய்யும் இந்த வசனத்தில் ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: யோவானில் τοῖς Ἰουδαίοις என்பதன் குறிப்பு
  choice: யூதர்களுக்கு
  alternative: யூதத் தலைவர்களுக்கு; யூதேயர்களுக்கு
  rationale: மூலத்தில் Ἰουδαῖοι என்பதைக் குறுக்கும் சொல் இல்லை. சூழல்சார்ந்த பிற புரிதல்கள் உண்மையானவையாக இருக்கக்கூடியதால் அவை அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் மரியாதைமிக்க கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பழமையான ‘மரிப்பது’, ‘ஜனங்கள்’ போன்ற வடிவங்களுக்கு பதிலாக ‘இறப்பது’, ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத தொடக்க இணைப்புச் சொல் சேர்க்கப்படவில்லை.
