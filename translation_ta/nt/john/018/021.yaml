  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: ta
  text: “நீ ஏன் என்னை விசாரிக்கிறாய்?[a] நான் அவர்களிடம் பேசியதைக் கேட்டவர்களிடம் விசாரி. இதோ, நான் என்ன சொன்னேன் என்பது இவர்களுக்குத் தெரியும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ ஏன் என்னிடம் கேட்கிறாய்? … நான் அவர்களிடம் பேசியதைக் கேட்டவர்களிடம் கேள்.” கிரேக்க வினைச்சொல்லை பொதுவாக “கேள்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள அதிகாரப்பூர்வ விசாரணைச் சூழலைக் காட்ட “விசாரி” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: நீ ஏன் என்னை விசாரிக்கிறாய்?
  rationale: ἐρωτάω என்பதற்கு பொதுவாக ‘கேள்’ என்று பொருள் கொள்ளலாம்; ஆனால் தலைமைக் குருவின் அதிகாரப்பூர்வ விசாரணைச் சூழலில் ‘விசாரிக்கிறாய்’ என்பது கேள்வியின் நீதித்துறைத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐρώτησον
  choice: விசாரி
  rationale: முந்தைய ἐρωτᾷς உடனான சொல் இணைப்பையும் நேரடியான கட்டளையையும் காக்கிறது. ‘ஆராய்ந்து பார்’ என்பது மூலத்தைவிட அதிக பொருள் சேர்க்கும்.
- source_word: τοὺς ἀκηκοότας
  choice: அதைக் கேட்டவர்களிடம்
  rationale: நிறைவேற்றுக் காலப் பங்கேற்புச் சொல், இயேசு பேசியதைக் கேட்டவர்களைக் குறிக்கிறது. தமிழில் ‘அதைக் கேட்டவர்கள்’ என்பது அவர்கள் கேட்ட செய்தியுடன் இயல்பாக இணைகிறது.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: நான் அவர்களிடம் என்ன பேசினேன் என்பதை
  rationale: λαλέω என்பதன் அடிப்படைப் பொருளான ‘பேசு’ என்பதைக் காத்து, உள்ளடக்க வாக்கியத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இடைச்சொல்லின் சுட்டும் வலிமையைச் சுருக்கமாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: οὗτοι οἴδασιν
  choice: இவர்களுக்குத் தெரியும்
  rationale: οὗτοι என்பதன் அருகாமைச் சுட்டுத்தன்மையை ‘இவர்கள்’ காக்கிறது; தமிழில் அறிவைத் தெரிவிக்கும் இயல்பான அமைப்பு ‘இவர்களுக்குத் தெரியும்’ ஆகும்.
- source_word: ἃ εἶπον ἐγώ
  choice: நான் என்ன சொன்னேன் என்பது
  rationale: உள்ளடக்கத்தை இயல்பாகத் தருகிறது. வெளிப்படையாக உள்ள ἐγώ-வின் முதல் நபர் வலியுறுத்தலை ‘நான்’ காக்கிறது; ‘நானே’ என்பது இங்கு தமிழில் தேவைக்கு அதிகமான எதிர்மறை ஒப்புமையை ஏற்படுத்தக்கூடும்.
theological_decisions:
- issue: தலைமைக் குருவுக்கு முன் இயேசு அளிக்கும் பதிலின் விசாரணைத் தொனி
  choice: ἐρωτάω வரும் இரு இடங்களிலும் ‘விசாரி’ என்ற சொல்லைப் பயன்படுத்துதல்
  alternative: இரு இடங்களிலும் ‘கேள்’ என்ற பொதுவான சொல்லைப் பயன்படுத்துதல்
  rationale: கிரேக்க வினைச்சொல் பொதுவான ‘கேள்’ என்ற பொருளையும் அனுமதிக்கிறது. எனினும், அதிகாரப்பூர்வ விசாரணை நடைபெறும் சூழலில் ‘விசாரி’ என்பது சட்டரீதியான தொனியைப் பாதுகாக்கிறது; அதே நேரத்தில் ‘குற்றம் சாட்டு’ போன்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நடை நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழில் உள்ளது. ஒருமை வினை வடிவங்கள் கிரேக்க மூலத்தின் நேரடியான ஒருமை அழைப்பையும் இயேசுவின் சவாலான பதிலையும் காக்கின்றன. ‘இவர்கள்’ என்பது மூலத்தின் சுட்டுப்பெயர் வலிமையைப் பாதுகாக்கிறது.
