  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: ta
  text: அவரைக் காட்டிக்கொடுக்கிற யூதாசும் அந்த இடத்தை அறிந்திருந்தான்; ஏனெனில் இயேசு தம் சீடர்களோடு அங்கே அடிக்கடி கூடிவந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் இயேசு தம் சீடர்களோடு அங்கே அடிக்கடி சந்தித்துவந்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: அறிந்திருந்தான்
  rationale: οἶδα இங்கு அந்த இடத்தைப் பற்றிய முன் அறிவையும் பழக்கத்தையும் குறிக்கிறது; தமிழ் கதைநடையில் ‘அறிந்திருந்தான்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: δὲ καὶ
  choice: யூதாசும்
  rationale: δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; καί-யின் சேர்க்கைப் பொருளை ‘-உம்’ தெளிவாகத் தருகிறது. தமிழில் தேவையற்ற தனி தொடக்க இணைப்பைச் சேர்க்கவில்லை.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: அவரைக் காட்டிக்கொடுத்துக்கொண்டிருந்த
  rationale: நிகழ்காலப் பங்கேற்புவினை யூதாசின் அப்போது தொடர்ந்துகொண்டிருந்த செயற்பாத்திரத்தைச் சுட்டுகிறது. பாடுபொருள் சூழலில் παραδίδωμι-யின் துரோகத் தன்மையை ‘காட்டிக்கொடு’ இயல்பாக உணர்த்துகிறது.
- source_word: τὸν τόπον
  choice: அந்த இடத்தை
  rationale: முந்தைய வசனத்தில் அடையாளப்படுத்தப்பட்ட குறிப்பிட்ட இடத்தைச் சுட்டுவதால், தமிழில் ‘அந்த இடம்’ இயல்பான குறிப்புச் சொற்றொடராகும்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: யூதாசு அந்த இடத்தை அறிந்திருந்ததற்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: πολλάκις
  choice: அடிக்கடி
  rationale: மீண்டும் மீண்டும் நிகழ்ந்ததை நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: συνήχθη
  choice: கூடிவந்தார்
  rationale: செயப்பாட்டு வடிவம் இச்சூழலில் செயப்படுபொருளற்ற ‘கூடு/ஒன்றுகூடு’ என்ற பொருளில் இயங்குகிறது. ‘கூடிவந்தார்’ கடந்த காலத்தில் வழக்கமாக நிகழ்ந்த சந்திப்பை இயல்பாகக் காட்டுகிறது.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: தம் சீடர்களோடு
  rationale: μετά-வின் உடனிருப்புப் பொருளையும் ஆசிரியர்–சீடர் உறவையும் காக்கிறது. எழுவாய் இயேசு என்பதால் மரியாதைத் தற்சுட்டான ‘தம்’ பொருத்தமானது.
theological_decisions:
- issue: யூதாசைக் குறிக்கும் παραδιδοὺς என்பதன் பொருள்
  choice: காட்டிக்கொடுத்துக்கொண்டிருந்த
  alternative: ஒப்படைத்துக்கொண்டிருந்த
  rationale: பாடுபொருள் கதையில் இது நடுநிலையான ஒப்படைப்பை அல்ல, யூதாசின் துரோகச் செயலைக் குறிக்கிறது. அதே நேரத்தில் வினைச்சொல் தன்மையையும் தொடர்நிலை அம்சத்தையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- issue: συνήχθη என்பதன் செயப்பாட்டு வடிவம்
  choice: இயேசு ... கூடிவந்தார்
  alternative: இயேசு ... சந்தித்துவந்தார் / அங்கே கூடச் செய்யப்பட்டார்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவம் இங்கு செயப்படுபொருளற்ற ஒன்றுகூடல் பொருளில் புரிந்துகொள்ளப்படலாம். செயற்கையான சொற்சொல் செயப்பாட்டைத் தவிர்த்து, திரும்பத் திரும்ப நிகழ்ந்த கூடுகையை வெளிப்படுத்துகிறது; ‘சந்தித்தார்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘காட்டிக்கொடுத்துக்கொண்டிருந்த’ என்பது சற்றே நீளமானதாயினும் கிரேக்க நிகழ்காலப் பங்கேற்புவினையின் தொடர்நிலையைப் பாதுகாக்கிறது. வசனத்தின் காரணவியல் அமைப்பும் ‘யூதாசும்’ என்பதிலுள்ள சேர்க்கைப் பொருளும் தக்கவைக்கப்பட்டுள்ளன.
