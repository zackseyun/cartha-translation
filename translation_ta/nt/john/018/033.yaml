  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: ta
  text: ஆகவே பிலாத்து மீண்டும் ஆளுநரின் தலைமையகத்துக்குள்[a] சென்று, இயேசுவை அழைத்து, அவரிடம், “நீ யூதர்களின்[b] அரசனா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரைத்தோரியத்துக்குள்”; இது ரோம ஆளுநரின் அதிகாரப்பூர்வ இல்லம் அல்லது தலைமையகம்.
    reason: lexical_alternative
  - marker: b
    text: “யூதர்கள்” என்பதற்குப் பதிலாக “யூதேயர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவாக யூதர்களையோ, சில சூழல்களில் யூதேயா பகுதி மக்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν … πάλιν
  choice: மீண்டும் … உள்ளே சென்று
  rationale: இச்சொற்றொடர் முன்பு இருந்த இடத்துக்குத் திரும்பிச் செல்வதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் மூலத்தின் மீள்நுழைவு கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள கதைத் தொடர்ச்சி மற்றும் விளைவுத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: πραιτώριον
  choice: ஆளுநரின் தலைமையகம்
  rationale: ரோம ஆளுநரின் அதிகாரப்பூர்வ இருப்பிடம் அல்லது நிர்வாகத் தலைமையகத்தைக் குறிக்கும் சொல்லை சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வழங்குகிறது; பாரம்பரிய ‘பிரைத்தோரியம்’ என்பதைக் காட்டிலும் தெளிவானது.
- source_word: ἐφώνησεν
  choice: அழைத்து
  rationale: இங்கு இயேசுவைத் தன்னிடம் வரும்படி அழைத்தல் அல்லது வரவழைத்தல் என்ற பொருள்; ‘அழைத்து’ என்பது இயல்பானதும் அளவுக்கு மீறிய அதிகாரத் தொனி இல்லாததும் ஆகும்.
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் … என்று கேட்டான்
  rationale: மூல வினைச்சொல் பொதுவாக ‘சொன்னான்’ என்றாலும், தொடர்ந்து வருவது நேரடியான கேள்வி. தமிழில் ‘என்று கேட்டான்’ என்பதே இயல்பான உரையாடல் வடிவம்; கேள்வியின் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: Σὺ εἶ
  choice: நீ … அரசனா?
  rationale: வெளிப்படையான σύ என்பதின் வலியுறுத்தலை ‘நீ’ தக்கவைக்கிறது; தமிழ் வினாவடிவம் இயல்பாக உள்ளது.
- source_word: ὁ βασιλεὺς
  choice: அரசன்
  rationale: அடையாளம் அல்லது பட்டத்தைச் சுட்டும் குறிப்பிட்ட பெயர்ச்சொல். தமிழில் வினாவுடன் ‘அரசனா?’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: விசாரணைச் சூழலில் ரோம அரசியல் குற்றச்சாட்டாக நிலைபெற்ற ‘யூதர்களின் அரசன்’ என்ற பொருளுக்கு இது மிகவும் பொருத்தமானது; ‘யூதேயர்கள்’ என்ற புவியியல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: அரசப் பட்டத்தில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: பிலாத்துவின் முன் முன்வைக்கப்பட்ட அரசியல் குற்றச்சாட்டின் வரலாற்று மற்றும் கதைச் சூழலுக்கு ‘யூதர்களின் அரசன்’ பொருந்துகிறது. எனினும், கிரேக்கச் சொல் சில சூழல்களில் யூதேயா பகுதி மக்களைக் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆளுநரின் தலைமையகம்’ மூலம் நிர்வாகச் சூழல் தெளிவாக்கப்பட்டுள்ளது; மூலத்தில் உள்ள Ἰουδαίων என்பதன் பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
