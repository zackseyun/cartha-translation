id: JHN.18.17
reference: John 18:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: ta
  text: அப்போது, வாயில்காவலாளியாக இருந்த பணிப்பெண்[a] பேதுருவிடம், “நீயும் இந்த மனிதனுடைய சீடர்களில் ஒருவன் அல்லவே?” என்று கேட்டாள். அவன், “நான் அல்ல” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாயில்காவலாளியாக இருந்த அடிமைப் பெண்.”
    reason: παιδίσκη என்பது பணிப்பெண்ணையோ அடிமைப் பெண்ணையோ குறிக்கக்கூடும் என்ற சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: இங்கு கதை நிகழ்வின் தொடர்ச்சியைக் குறிக்கிறது. ‘அப்போது’ என்பது தமிழில் இயல்பாக இருந்து, கிரேக்க இணைப்புச் சொல்லின் முன்னேற்றத் தன்மையைப் பாதுகாக்கிறது.
- source_word: παιδίσκη
  choice: பணிப்பெண்
  rationale: இச்சொல் இளம் பெண் பணியாளரையோ அடிமைப் பெண்ணையோ குறிக்கலாம். இச்சூழலில் அவளுடைய பணி முன்னிலைப்படுவதால் ‘பணிப்பெண்’ முதன்மை உரையில் இயல்பாக உள்ளது; அடிமை நிலை சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θυρωρός
  choice: வாயில்காவலாளியாக இருந்த
  rationale: நுழைவாயிலைக் கவனித்த அவளுடைய பொறுப்பைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: Μὴ καὶ σὺ
  choice: நீயும் … அல்லவே?
  rationale: μή தொடங்கும் கேள்வி எதிர்மறையான பதிலை எதிர்பார்ப்பதைத் தமிழின் ‘அல்லவே?’ என்ற வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν μαθητῶν
  choice: சீடர்களில் ஒருவன்
  rationale: ஒரு குழுவில் உறுப்பினராக இருப்பதைக் குறிக்கும் ἐκ என்பதன் பகுதிப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: இந்த மனிதனுடைய
  rationale: ἄνθρωπος என்பதை பட்டப்பெயராக மாற்றாமல் சாதாரண ‘மனிதன்’ என்ற பொருளிலும், τούτου என்பதன் சற்றே விலகிய சுட்டுதலுடனும் வழங்குகிறது.
- source_word: ἐκεῖνος
  choice: அவன்
  rationale: இச்சூழலில் இது பேதுருவைக் குறிக்கிறது; தமிழில் இயல்பான மூன்றாம் நபர் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Οὐκ εἰμί
  choice: நான் அல்ல
  rationale: கிரேக்கத்தின் சுருக்கமான, நேரடியான மறுப்பை கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: μή தொடங்கும் எதிர்மறைக் கேள்வியின் வலிமை
  choice: ‘நீயும் … அல்லவே?’ என்று, எதிர்மறைப் பதிலை எதிர்பார்க்கும் கேள்வியாக மொழிபெயர்த்தல்
  alternative: எந்தப் பதிலையும் எதிர்பார்ப்பதாகக் காட்டாத ‘நீயும் … ஒருவனா?’ என்ற பொதுவான கேள்வி
  rationale: கிரேக்க இலக்கணத்தில் கேள்வி எதிர்மறைப் பதிலை எதிர்பார்க்கிறது. ‘அல்லவே?’ அந்த எதிர்பார்ப்பைக் காட்டுகிறது; ஆனால் பேசுபவளின் உணர்ச்சித் தொனியை மிகைப்படுத்தவில்லை.
- issue: παιδίσκη குறிக்கும் சமூக நிலை
  choice: முதன்மை உரையில் ‘பணிப்பெண்’
  alternative: ‘அடிமைப் பெண்’
  rationale: இச்சொல் பணிப்பெண் அல்லது அடிமைப் பெண் என இருவகையாகப் பொருள்படலாம். இங்கு அவளுடைய வாயில்காவல் பணி முன்னிலைப்படுவதால் ‘பணிப்பெண்’ தேர்ந்தெடுக்கப்படுகிறது; சட்ட அல்லது சமூக அடிமை நிலையின் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அல்லவே?’ என்பது எதிர்மறைப் பதிலை எதிர்பார்க்கும் கேள்வியை இயல்பாக வெளிப்படுத்துகிறது; ‘நான் அல்ல’ என்பது பேதுருவின் மறுப்பின் சுருக்கத்தைக் காக்கிறது.
