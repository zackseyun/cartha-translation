source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: ta
  text: அவர் இவற்றைச் சொன்னபோது, அருகில் நின்றுகொண்டிருந்த காவலர்களில் ஒருவன்[a] இயேசுவை அடித்து[b], “தலைமை ஆசாரியருக்கு இப்படியா பதில் சொல்கிறாய்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காவலர்கள்” என மொழிபெயர்க்கப்பட்ட சொல் பணியாளர்கள், ஏவலர்கள் அல்லது உதவியாளர்கள் என்றும் பொருள்படலாம்; இச்சூழலில் இது அதிகாரப்பூர்வ ஆலயக் காவல் பணியாளர்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அறைந்தான்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் கையால் கொடுக்கப்பட்ட அறை அல்லது அதுபோன்ற அடியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரைப் பாதுகாத்து, இயேசு முன்பு சொன்னவற்றைக் குறிக்கிறது.
- source_word: αὐτοῦ εἰπόντος
  choice: அவர் இவற்றைச் சொன்னபோது
  rationale: இறந்தகாலப் பங்கேற்புடன் அமைந்த genitive absolute-ஐ இயல்பான காலவாக்கியமாகத் தருகிறது.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: அருகில் நின்றுகொண்டிருந்த காவலர்களில் ஒருவன்
  rationale: ὑπηρέτης என்பதன் அதிகாரப்பூர்வப் பணியாளர் என்ற சூழல்சார் பொருளையும், παρεστηκώς என்பதன் அங்கு நின்றிருந்த நிலையையும் வெளிப்படுத்துகிறது.
- source_word: ἔδωκεν ῥάπισμα
  choice: இயேசுவை அடித்து
  rationale: கையால் கொடுக்கப்பட்ட அறை அல்லது அதுபோன்ற அடியைக் குறிக்கும் கிரேக்கச் சொல்லின் பரப்பை தேவையின்றி குறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: Οὕτως ἀποκρίνῃ
  choice: இப்படியா பதில் சொல்கிறாய்?
  rationale: முறையைச் சுட்டும் οὕτως என்பதையும் கண்டனத் தொனியுள்ள கேள்வியையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: τῷ ἀρχιερεῖ
  choice: தலைமைக் குருவுக்கு
  rationale: அந்தக் கால யூத மதத் தலைமைப் பதவியைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் இணைச்சொல்.
theological_decisions:
- issue: ὑπηρετῶν என்பவர்களின் அடையாளம்
  choice: காவலர்கள்
  alternative: பணியாளர்கள் / ஏவலர்கள் / உதவியாளர்கள்
  rationale: யோவானின் விசாரணைச் சூழலில் இவர்கள் தலைமைக் குருத்துவ அமைப்புடன் தொடர்புடைய அதிகாரப்பூர்வக் காவல் பணியாளர்களாகத் தோன்றுகின்றனர்; எனினும் மூலச்சொல் பொதுவாகக் கீழ்நிலைப் பணியாளர்களையும் குறிக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் மரியாதைமிக்க விவிலிய நடையுடனும் வடிவமைக்கப்பட்டது. நேரடி உரையின் கண்டனத் தொனி இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது; மூலத்தின் சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
