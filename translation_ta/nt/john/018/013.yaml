id: JHN.18.13
reference: John 18:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: ta
  text: அவர்கள் இயேசுவை முதலில் அன்னாவிடம் அழைத்துச் சென்றார்கள். ஏனெனில், அந்த ஆண்டில் தலைமை ஆசாரியராக இருந்த காய்பாவுக்கு அன்னா மாமனாராக இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: அழைத்துச் சென்றார்கள்
  rationale: ἄγω என்பது ‘அழைத்துச் செல்’ அல்லது ‘கொண்டுசெல்’ எனப் பொருள்படும். கைது செய்யப்பட்ட இயேசு காவலில் கொண்டுசெல்லப்படும் சூழலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது; கிரேக்கத்தில் சூழலால் விளங்கும் செயப்படுபொருள் தமிழில் ‘இயேசுவை’ என்று வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: πρὸς Ἅνναν
  choice: அன்னாவிடம்
  rationale: πρός + வேற்றுமை உருபு இங்கு ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘அன்னாவிடம்’ என்பது இலக்கையும் அவர்முன் கொண்டுசெல்லப்பட்டதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: இது வினையடையாக வந்து நிகழ்வுகளின் வரிசையைக் குறிக்கிறது.
- source_word: πενθερός
  choice: மாமனார்
  rationale: இச்சொல் குறிப்பாக மனைவியின் தந்தையைக் குறிக்கிறது; ‘மாமனார்’ என்பது துல்லியமான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἀρχιερεύς
  choice: தலைமைக் குரு
  rationale: யூதர்களின் பிரதான ஆசாரியப் பதவியைக் குறிக்கும் சொல்லாக, நவீன தமிழில் புரிந்துகொள்ளக்கூடிய மரியாதையான வடிவம்.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: அந்த ஆண்டின்
  rationale: கிரேக்கத்தின் காலக் குறிப்பைத் தமிழில் இயல்பாகப் பாதுகாத்து, ‘தலைமைக் குரு’ என்பதுடன் தெளிவாக இணைக்கிறது.
- source_word: Ἅνναν
  choice: அன்னா
  rationale: தனிப்பெயர் தமிழ் ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளது.
- source_word: Καϊάφα
  choice: காய்பா
  rationale: தனிப்பெயர் தமிழ் ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அந்த ஆண்டின் தலைமைக் குருவாக இருந்தவர்’ யாரைக் குறிக்கிறது?
  choice: இத்தொடர் காய்பாவைக் குறிக்கும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது.
  alternative: தமிழில் கவனமின்றி அமைத்தால் இது அன்னாவைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
  rationale: கிரேக்கத்தில் ὃς என்பது மிக அருகிலுள்ள முன்னிலையான Καϊάφα-வை இயல்பாகக் குறிக்கிறது. ‘அந்த ஆண்டின் தலைமைக் குருவாக இருந்த காய்பா’ என்ற அமைப்பு மூலத்தின் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒரே நீண்ட வாக்கியமாக அமைந்த கிரேக்க உரை, உறவுத் தொடர்பும் பதவித் தொடர்பும் குழப்பமின்றி விளங்குவதற்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
