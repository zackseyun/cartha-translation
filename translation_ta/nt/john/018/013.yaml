  to: அவர்கள் இயேசுவை முதலில் அன்னாவிடம் அழைத்துச் சென்றார்கள். ஏனெனில், அந்த ஆண்டில் தலைமை ஆசாரியராக இருந்த காய்பாவுக்கு அன்னா மாமனாராக இருந்தார்.
