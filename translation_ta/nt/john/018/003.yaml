source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: ta
  text: ஆகவே யூதாஸ், படைப்பிரிவையும்[a] தலைமைக் குருக்களிடமிருந்தும் பரிசேயர்களிடமிருந்தும் வந்த காவலர்களையும்[b] அழைத்துக்கொண்டு, விளக்குகளோடும் தீப்பந்தங்களோடும் ஆயுதங்களோடும் அங்கே வருகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படைப்பிரிவு” என்பதற்குப் “படைவீரர் அணி” அல்லது “படைவீரர்களின் ஒரு பிரிவு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஓர் இராணுவப் பிரிவைக் குறிக்கலாம்; அந்தப் பிரிவு முழுவதும் அங்கு வந்ததாக இது கட்டாயமாகக் குறிப்பிடுவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: “காவலர்கள்” என்பதற்குப் “அதிகாரப் பணியாளர்கள்” அல்லது “ஆலயக் காவலர்கள்” என்றும் மொழிபெயர்க்கலாம். இச்சொல் யூத அதிகாரிகளின் கீழ் பணியாற்றிய அதிகாரப்பூர்வ உதவியாளர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள தொடர்ச்சியையும் அதன் விளைவாக நிகழும் அடுத்த செயலையும் குறிக்கிறது.
- source_word: λαβὼν
  choice: அழைத்துக்கொண்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இயல்பான தமிழில் காட்டுகிறது; இங்கு மனிதர்களைத் தன்னுடன் கூட்டிவருதல் என்பதே சூழலுக்குப் பொருந்துகிறது.
- source_word: σπεῖραν
  choice: படைப்பிரிவை
  rationale: ஒரு ஒழுங்கமைந்த இராணுவப் பிரிவைக் குறிக்கும் வரலாற்றுச் சார்பைத் தக்கவைக்கிறது; முழுப் படைப்பிரிவும் வந்ததாகக் கட்டாயப்படுத்தாது.
- source_word: ὑπηρέτας
  choice: காவலர்களை
  rationale: யூத அதிகாரிகளின் பணியில் இருந்த அதிகாரப்பூர்வ உதவியாளர்கள் அல்லது காவலர்கள் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀρχιερέων
  choice: தலைமைக் குருக்கள்
  rationale: யூதர்களின் முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் நிலையான, தெளிவான தமிழ் சொற்றொடர்.
- source_word: Φαρισαίων
  choice: பரிசேயர்கள்
  rationale: குழுவின் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἔρχεται
  choice: வருகிறான்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: முன்னரே குறிப்பிடப்பட்ட இடத்தைச் சுட்டும் இயல்பான இடவினையடை.
- source_word: φανῶν
  choice: விளக்குகள்
  rationale: எடுத்துச் செல்லக்கூடிய ஒளிக்கருவியைக் குறிக்கிறது; அடுத்துள்ள தீப்பந்தங்களிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: λαμπάδων
  choice: தீப்பந்தங்கள்
  rationale: எரியும் கையடக்கப் பந்தங்களைக் குறிக்கும் தெளிவான நவீன தமிழ் சொல்.
- source_word: ὅπλων
  choice: ஆயுதங்கள்
  rationale: போருக்கோ வன்முறைக்கோ பயன்படும் கருவிகளைப் பொதுவாகக் குறிக்கும் நேரடியான சொல்.
theological_decisions:
- issue: கைதுசெய்ய வந்த குழுவின் அடையாளமும் அமைப்பும்
  choice: σπεῖρα என்பதற்கு ‘படைப்பிரிவு’ என்றும் ὑπηρέται என்பதற்கு ‘காவலர்கள்’ என்றும் மொழிபெயர்த்து, இராணுவத்தினரும் யூத அதிகாரிகளின் பணியாளர்களும் அடங்கிய இருவகைக் குழுவைக் காட்டுதல்.
  alternative: ‘படைவீரர்களின் ஒரு குழுவையும் ஆலயக் காவலர்களையும்’ என்று பொதுவாக மொழிபெயர்த்தல்.
  rationale: வசனம் படைப்பிரிவையும் தலைமைக் குருக்கள் மற்றும் பரிசேயர்களிடமிருந்து வந்த காவலர்களையும் தனித்தனியாகக் குறிப்பிடுகிறது. வந்த வீரர்களின் துல்லிய எண்ணிக்கையையோ முழுப் படைப்பிரிவே வந்ததையோ உரை உறுதிப்படுத்தாததால் அதைக் கூடுதலாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘வருகிறான்’ என்ற நிகழ்காலம் யோவானின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைப் பாதுகாக்கிறது; ‘விளக்குகள்’ மற்றும் ‘தீப்பந்தங்கள்’ என்று இரு ஒளிக்கருவிகளின் வேறுபாடும் தக்கவைக்கப்பட்டுள்ளது.
