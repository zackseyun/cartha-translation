reference: John 18:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: ta
  text: ஆகவே பிலாத்து அவர்களிடம், “நீங்களே இவனை எடுத்துக்கொண்டு, உங்கள் சட்டத்தின்படி இவனைத் தீர்ப்பிடுங்கள்” என்றான். யூதர்கள்[a] அவனிடம், “யாரையும் கொல்ல எங்களுக்கு அனுமதி இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘யூதர்கள்’ (hoi Ioudaioi). இச்சூழலில் இது ஒட்டுமொத்த யூத மக்களையும் அல்ல, பிலாத்துடன் பேசிக்கொண்டிருந்த யூத அதிகாரிகள் அல்லது குற்றஞ்சாட்டிகளைக் குறிக்கிறது.
    reason: சூழல்சார் குறிப்பைத் தெளிவுபடுத்தி, முழு யூத மக்களையும் குறிக்கும் தவறான புரிதலைத் தவிர்ப்பதற்காக.
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் முடிவையும் கதை ஓட்டத்தையும் இயல்பாக இணைக்கிறது.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: நீங்களே இவனை அழைத்துச் சென்று
  rationale: வெளிப்படையாக இடம்பெறும் ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்களே’ தக்கவைக்கிறது; சூழலில் Λάβετε என்பது பொறுப்பேற்று அழைத்துச் செல்வதைக் குறிக்கிறது.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: உங்கள் சட்டத்தின்படி
  rationale: κατά இங்கு தரநிலை அல்லது ஒத்திசைவைச் சுட்டுவதால் இவ்வடிவம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: κρίνατε
  choice: தீர்ப்பிடுங்கள்
  rationale: நீதிசார் சூழலைத் தக்கவைத்தபடி, முறையான ரோம விசாரணை என்ற குறுகிய பொருளைத் திணிக்காமல் κρίνω என்பதன் பரந்த பொருளை வழங்குகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் முறையான வடிவை முதன்மை உரையில் தக்கவைக்கிறது; இச்சூழலில் அதன் குறுகிய குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἔξεστιν
  choice: அனுமதி இல்லை
  rationale: சட்ட அல்லது அதிகார அனுமதி மறுக்கப்படுவதை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀποκτεῖναι οὐδένα
  choice: யாரையும் கொலைசெய்ய
  rationale: ἀποκτείνω என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; சூழல் நீதித்துறை மரணதண்டனையைக் குறிப்பிட்டாலும் ‘மரணதண்டனை நிறைவேற்ற’ என்று மிகக் குறுகலாக்கவில்லை.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று மொழிபெயர்த்து, இங்கு பிலாத்துடன் பேசும் யூத அதிகாரிகள் அல்லது குற்றஞ்சாட்டிகள் குறிக்கப்படுகிறார்கள் என்று அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
  alternative: யூதத் தலைவர்கள்; யூதேயர்கள்
  rationale: மூலத்தின் சொல்வடிவத்தையும் அதன் சூழல்சார் பதற்றத்தையும் காக்கிறது; அதே நேரத்தில் எல்லா யூத மக்களையும் பொதுவாகக் குறிக்கும் தவறான வாசிப்பைத் தவிர்க்கிறது.
- issue: ἀποκτεῖναι என்பதன் நீதித்துறை நுணுக்கம்
  choice: கொலைசெய்ய
  alternative: மரணதண்டனை விதிக்க; மரணதண்டனையை நிறைவேற்ற
  rationale: பிலாத்தின் முன்னிலையிலான சூழல் அரசால் அங்கீகரிக்கப்பட்ட மரணதண்டனையை உணர்த்துகிறது; எனினும் கிரேக்க வினையின் பரந்த ‘கொல்லுதல்’ பொருளை முதன்மை உரை தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டது. பிலாத்தின் விலகிநிற்கும் தொனியை ‘உங்கள் சட்டத்தின்படி’ என்பதும், ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்களே’ என்பதும் தக்கவைக்கின்றன.
