  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: ta
  text: ஆனால் பேதுரு வெளியே வாசலருகே நின்றுகொண்டிருந்தார். ஆகவே, தலைமைக் ஆசாரியருக்குத் தெரிந்தவராயிருந்த[a] அந்த மற்ற சீடர் வெளியே சென்று, வாசல் காக்கும் பெண்ணிடம்[b] பேசி, பேதுருவை உள்ளே அழைத்துச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தலைமை ஆசாரியரின் அறிமுகமானவராயிருந்த.” கிரேக்கச் சொல் அவர்களுடைய உறவு எவ்வளவு நெருக்கமானது என்பதைத் தெளிவுபடுத்தவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நுழைவாயிலைக் காக்கும் பெண்ணிடம்.” இச்சொல் நுழைவிடத்தில் காவலுக்கு இருந்தவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: நின்றுகொண்டிருந்தார்
  rationale: இங்கு வினை வடிவம் பேதுருவின் தொடர்ந்த நிலையைக் காட்டுகிறது; நவீன தமிழில் ‘நின்றுகொண்டிருந்தார்’ அதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: வாசலுக்கு வெளியே
  rationale: நுழைவிடத்திற்கு அருகிலிருந்ததையும் வெளியே இருந்ததையும் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: அந்த மற்ற சீடர்
  rationale: யோவான் நற்செய்தியின் சீடத்துவச் சூழலை ‘சீடர்’ துல்லியமாகப் பேணுகிறது; சுட்டுச் சொல் முன் குறிப்பிடப்பட்ட சீடரை இயல்பாக அடையாளப்படுத்துகிறது.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: தலைமைக் குருவுக்கு அறிமுகமானவராயிருந்த
  rationale: γνωστός குறிக்கும் உறவின் நெருக்கத்தை மிகைப்படுத்தாமல், அவர்களுக்குள் அறிமுகம் இருந்ததைத் தெரிவிக்கிறது.
- source_word: ἀρχιερεύς
  choice: தலைமைக் குரு
  rationale: யூத உயர்குருத்துவப் பதவிக்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: θυρωρῷ
  choice: வாசல் காக்கும் பெண்
  rationale: பெண்பால் கட்டுரை அந்த நுழைவிடக் காவலர் பெண் என்பதை வெளிப்படுத்துகிறது; பணியையும் இயல்பான தமிழில் கூறுகிறது.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: வாசல் காக்கும் பெண்ணிடம் பேசி
  rationale: நேரடி உரை தரப்படாததால், ‘பேசி’ என்பது λέγω என்பதற்கான இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: பேதுருவை உள்ளே அழைத்து வந்தார்
  rationale: εἰσάγω என்பதன் ‘உள்ளே கொண்டு வருதல்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அழைத்து’ என்பது இங்கு கட்டாயப்படுத்தியதாகச் சொல்லாமல் உடன் உள்ளே வரச் செய்ததை உணர்த்துகிறது.
