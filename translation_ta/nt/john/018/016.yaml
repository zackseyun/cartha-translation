translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை இயல்பும் பேணப்பட்டுள்ளன. கிரேக்கத்தில் பெண்பால் தெளிவாக இருப்பதால் ‘வாசல் காக்கும் பெண்’ என வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது. அறிமுகத்தின் நெருக்கம் உறுதியாக்கப்படாமல் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
