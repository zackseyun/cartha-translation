id: JHN.18.24
reference: John 18:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: ta
  text: ஆகவே, அன்னா அவரைக் கட்டப்பட்ட நிலையில் தலைமை ஆசாரியரான காய்பாவிடம் அனுப்பினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சூழலைக் கருத்தில் கொண்டு, முந்தைய நிகழ்வுகளை விளக்கும் இடைச்செருகல் குறிப்பாக: “அன்னா அவரைக் கட்டப்பட்ட நிலையில் தலைமை ஆசாரியரான காய்பாவிடம் அனுப்பியிருந்தார்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: ἀποστέλλω என்பதன் இறந்தகால நிகழ்வை இயல்பான நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள கதைத் தொடர்ச்சி அல்லது முடிவுறு தொடர்பைக் காக்கிறது; இங்கு வெறும் காலவரிசைச் சொல்லாக மட்டும் சுருக்கப்படவில்லை.
- source_word: δεδεμένον
  choice: கட்டப்பட்ட நிலையிலேயே
  rationale: Perfect passive participle சுட்டும், அனுப்பப்பட்டபோது அவர் கட்டுண்ட நிலையில் இருந்தார் என்ற தொடர்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘இன்னும்’ என்ற கூடுதல் வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: πρὸς Καϊάφαν
  choice: காய்பாவிடம்
  rationale: ஒரு நபரை நோக்கிய அனுப்புதலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ὁ Ἅννας
  choice: அன்னா
  rationale: Ἅννας என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: τὸν ἀρχιερέα
  choice: தலைமை ஆசாரியரான
  rationale: தனிப்பட்ட யூதத் தலைமை ஆசாரியப் பதவியைக் குறிக்கிறது; காய்பாவை அடையாளப்படுத்தும் apposition-ஐ தமிழில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: சுற்றியுள்ள நிகழ்வுகளோடு இந்த வசனத்தின் காலவரிசைத் தொடர்பு
  choice: அன்னா அப்போது இயேசுவைக் கட்டப்பட்ட நிலையிலேயே காய்பாவிடம் அனுப்பினார் என்ற எளிய இறந்தகால நிகழ்வாக முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: முன்னர் நடந்த அனுப்புதலை விளக்கும் இடைச்செருகல் குறிப்பாக, ‘அன்னா அவரைக் கட்டப்பட்ட நிலையிலேயே காய்பாவிடம் அனுப்பியிருந்தார்’ என்று கொள்ளலாம்.
  rationale: ἀπέστειλεν இயல்பாக ஒரு கதை நிகழ்வைக் குறிக்கும் aorist indicative ஆகும். ஆயினும் சூழலில் இதை முன்னோக்கிய பின்னோக்கு விளக்கமாகப் புரிந்துகொள்ளும் வாய்ப்பும் உள்ளது. அந்தத் தெளிவின்மையை முதன்மை உரையில் ஒற்றைப்படையாகத் தீர்க்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. ‘தலைமை ஆசாரியர்’ என்பது பதவியைத் தெளிவாகக் காட்டுகிறது; ‘கட்டப்பட்ட நிலையிலேயே’ என்பது கிரேக்க participle-இன் நிலைத்தன்மையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
