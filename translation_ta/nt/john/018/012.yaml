  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: ta
  text: எனவே, படைப்பிரிவும் அதன் தளபதியும் யூதர்களின்[a] காவலர்களும் இயேசுவைப் பிடித்து அவரைக் கட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதத் தலைவர்களின் காவலர்கள்”; அல்லது சூழலுக்கேற்ப, “யூதேயர்களின் காவலர்கள்.” யோவான் நூலில் “யூதர்கள்” என்பது பல இடங்களில் யூத மக்கள் அனைவரையும் அல்லாமல் ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்வின் தொடர்ச்சியையும் அதன் விளைவாக நடந்த செயலையும் குறிக்கும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: σπεῖρα
  choice: படைப்பிரிவு
  rationale: ஒரு குறிப்பிட்ட இராணுவப் பிரிவைக் குறிக்கும் சொல்லாகும்; மூலத்தில் வெளிப்படையாக இல்லாத ‘ரோமப்’ என்ற விளக்கத்தைச் சேர்க்காமல் இராணுவப் பொருளைப் பாதுகாக்கிறது.
- source_word: χιλίαρχος
  choice: அதன் தளபதி
  rationale: அந்தப் படைப்பிரிவுக்குத் தலைமை வகித்த அதிகாரியை இயல்பான நவீனத் தமிழில் குறிக்கிறது; ‘அதன்’ என்பது வாக்கிய உறவைத் தெளிவாக்குகிறது.
- source_word: ὑπηρέται
  choice: காவலர்கள்
  rationale: இச்சூழலில் வீட்டு வேலைக்காரர்களை அல்ல, கைது நடவடிக்கையில் ஈடுபட்ட அதிகாரப்பூர்வப் பணியாளர்களைக் குறிக்கிறது; ‘ஆலயக் காவலர்கள்’ என்று மூலத்தை மீறிக் குறிப்பாக்கவில்லை.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: கிரேக்க உரையின் பிறப்புப்பொருள் அமைப்பை வெளிப்படையாகப் பாதுகாக்கிறது; யோவானில் இது சில சூழல்களில் யூதத் தலைவர்களையோ யூதேயர்களையோ குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: συνέλαβον
  choice: பிடித்து
  rationale: உடல்ரீதியாகப் பற்றிப் பிடித்து காவலில் கொண்ட செயலைக் காட்டுகிறது; சட்ட நடைமுறையை மட்டும் முன்னிறுத்தும் ‘கைது செய்து’ என்பதைக் காட்டிலும் மூல வினையின் உடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἔδησαν
  choice: கட்டினார்கள்
  rationale: ஒருவரைப் பிணைத்த செயலைத் தெளிவான, இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: யோவான் நூலில் τῶν Ἰουδαίων என்பதன் குறிப்பு மற்றும் நுட்பம்
  choice: முதன்மை உரையில் ‘யூதர்களின்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘யூதத் தலைவர்களின்’ அல்லது ‘யூதேயர்களின்’
  rationale: இந்த வசனம் தானாகவே குறிப்பைத் தலைவர்களென வரையறுக்காததால் மூலத்தின் பரந்த சொல்லாட்சி பாதுகாக்கப்படுகிறது. அதேவேளை, முழு யூத மக்களையும் குற்றஞ்சாட்டுவதாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க சூழல்சார்ந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. இராணுவப் பதவிகளின் தேவையற்ற ஒலிபெயர்ப்பைத் தவிர்த்து, வரலாற்று மற்றும் நிறுவனப் பொருள் தெளிவாக வைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘ரோமப்’ அல்லது ‘ஆலய’ போன்ற குறிப்புகள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
