source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: ta
  text: பிலாத்து அவரிடம், “உண்மை என்ன?” என்று கேட்டான். இதைச் சொல்லிவிட்டு, அவன் மீண்டும் வெளியே யூதர்களிடம்[a] சென்று, அவர்களிடம், “இவனுக்கு எதிராகக் குற்றம் சாட்டுவதற்கான எந்த அடிப்படையும் நான் காணவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதத் தலைவர்களிடம்.” யோவான் நற்செய்தியில் “யூதர்கள்” என்பது சில இடங்களில், உடனடிச் சூழலில் இயேசுவை எதிர்த்த யூதேய அதிகாரிகளையோ பிரதிநிதிக் குழுவையோ இன்னும் குறிப்பாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: பிலாத்து அவரிடம் ... என்று கேட்டான்
  rationale: λέγει என்பது வரலாற்று நிகழ்காலம்; இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டது. கேள்வி உரையை அறிமுகப்படுத்துவதால் ‘கேட்டான்’ என்பது தமிழில் இயல்பாக உள்ளது.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: உண்மை என்றால் என்ன?
  rationale: ἀλήθεια என்பதற்கு வரையறைச் சுட்டு இல்லை; ஆகவே பொதுவான, சிந்தனைக்குரிய கேள்வியாக உள்ள தெளிவின்மையை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: இதைச் சொன்னபின்
  rationale: இறந்தகால வினையெச்சமான εἰπών, அடுத்த செயல் நிகழ்ந்த காலவரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πάλιν ἐξῆλθεν
  choice: மீண்டும் ... வெளியே சென்று
  rationale: πάλιν மீண்டும் நிகழ்ந்த செயலைக் குறிக்கிறது; ἐξῆλθεν உள்ளிருந்து வெளியே சென்ற இயக்கத்தை நேரடியாகக் காட்டுகிறது.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: யூதர்களிடம்
  rationale: மூலத்தின் lexical வடிவை முதன்மை உரையில் காக்கிறது. யோவானில் இச்சொல் சூழல்படி குறுகிய குழுவைக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: καὶ λέγει αὐτοῖς
  choice: அவர்களிடம் ... என்றான்
  rationale: வரலாற்று நிகழ்காலமான λέγει, இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலத்தில் தரப்பட்டுள்ளது.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: இவனுக்கு எதிராக எந்தக் குற்றச்சாட்டுக்கும் ஆதாரம் இருப்பதாக நான் காணவில்லை
  rationale: நீதித்துறைச் சூழலில் αἰτία என்பது பொதுவான ஒழுக்கக் ‘குறை’ என்பதைவிட குற்றச்சாட்டு அல்லது வழக்குக்கான காரணத்தைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் சட்டரீதியான பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவானின் பாடு வரலாற்றில் Ἰουδαίους என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்களிடம்’ என்று வைத்து, சூழல்சார் குறுகிய பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘யூதத் தலைவர்களிடம்’ அல்லது ‘யூதேயர்களிடம்’
  rationale: மூலச்சொல்லின் வெளிப்படையான வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது. அதேவேளை, இச்சூழலில் அது அனைத்து யூத மக்களையும் வேறுபாடின்றிக் குறிக்காமல், இயேசுவை எதிர்த்த அதிகாரிகள் அல்லது அங்கு இருந்த பிரதிநிதிக் குழுவைக் குறிக்கக்கூடும் என்ற விளக்க வாய்ப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பிலாத்துக்கு ‘அவன்/கேட்டான்’ என்றும் இயேசுவுக்கு மரியாதைச் சுட்டான ‘அவரிடம்’ என்றும் இயல்பான தமிழ் பயன்பாடு பின்பற்றப்பட்டுள்ளது; நீதித்துறைச் சூழல் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
