  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: ta
  text: ஆகவே பிலாத்து வெளியே அவர்களிடம் சென்று, “இந்த மனிதனுக்கு எதிராக என்ன குற்றச்சாட்டைக் கொண்டுவருகிறீர்கள்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: வெளியே ... சென்று
  rationale: ἐξέρχομαι என்பதன் வெளியே செல்லும் இயக்கத்தையும் ἔξω தரும் இடக் குறிப்பையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; ஆளுநர் மாளிகையின் உள்ளிருந்து குற்றஞ்சாட்டியவர்களிடம் பிலாத்து சென்ற சூழலுக்கும் பொருந்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் அவர்கள் ஆளுநர் மாளிகைக்குள் நுழைய மறுத்ததன் விளைவாக பிலாத்து வெளியே சென்றதை இணைக்கும் காரண-விளைவு நுணுக்கத்தைப் பேணுகிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களிடம்
  rationale: நபர்களை நோக்கிச் சென்று அவர்களைச் சந்திக்கும் இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: φησίν
  choice: என்று கேட்டான்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக வழங்குகிறது; தொடர்ந்து வரும் வினாவால் ‘கேட்டான்’ என்பது பேச்சுச் செயலின் தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: Τίνα κατηγορίαν
  choice: என்ன குற்றச்சாட்டை
  rationale: κατηγορία என்பதன் நீதிமன்றம் சார்ந்த குற்றஞ்சாட்டுதல் என்ற பொருளைத் தெளிவாகப் பேணுகிறது.
- source_word: φέρετε
  choice: கொண்டுவருகிறீர்கள்
  rationale: ஒருவருக்கு எதிரான குற்றச்சாட்டை அதிகாரியிடம் முன்வைக்கும் சட்டச் சூழலில் φέρω என்பதன் ‘கொண்டுவருதல்/முன்வைத்தல்’ பொருளைப் பேணுகிறது.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: இந்த மனிதனுக்கு எதிராக
  rationale: κατά + genitive என்பதன் நீதித்துறைச் சூழலிலான ‘எதிராக’ என்ற பொருளையும், ἄνθρωπος இங்கு குறிப்பிட்ட ஆண் நபரைக் குறிப்பதையும் துல்லியமாக வெளிப்படுத்துகிறது.
