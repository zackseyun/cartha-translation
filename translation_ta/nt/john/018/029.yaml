translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிலாத்து’ என்ற பரவலாக அறியப்பட்ட தமிழ் பெயர்வடிவம் வைக்கப்பட்டுள்ளது. வசனத்தில் உரைவேறுபாடு அல்லது விளக்கத்துக்குத் தேவையான உண்மையான குழப்பம் இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
