id: JHN.18.30
reference: John 18:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “இந்த மனிதன் தீமை செய்பவனாக இல்லாதிருந்தால், இவரை உங்களிடம் ஒப்படைத்திருக்க மாட்டோம்” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: அவர்கள் அவரிடம் ... என்று பதிலளித்தார்கள்
  rationale: ‘பதிலளித்து, சொன்னார்கள்’ என்பது தமிழில் தேவையற்ற இரட்டிப்பாக ஒலிக்கும். ‘பதிலளித்தார்கள்’ என்பது இரு கிரேக்க வினைகளின் உரையாடல் செயலையும் இயல்பான நவீன தமிழில் தருகிறது; ‘அவரிடம்’ என்பது பிலாத்துவைக் குறிக்கிறது.
- source_word: Εἰ μὴ ἦν
  choice: இல்லாதிருந்தால்
  rationale: நிகழ்ந்த உண்மைக்கு எதிரான நிபந்தனையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οὗτος
  choice: இவர்
  rationale: இயேசுவைக் குறிக்கும் சுட்டுப்பெயரை இயல்பாகத் தருகிறது. ‘இவன்’ என்பதில் மூலத்தில் கட்டாயமில்லாத இழிவுத்தொனி கூடிவிடும்.
- source_word: κακὸν ποιῶν
  choice: தீமை செய்பவராக
  rationale: ποιῶν என்பதன் செயற்பாட்டு வலிமையையும் κακόν என்பதன் அறநெறிசார் தீவிரத்தையும் காக்கிறது; ‘குற்றவாளி’ போன்ற குறிப்பிட்ட சட்டக் குற்றச்சாட்டைச் சேர்க்கவில்லை.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: இவரை உங்களிடம் ஒப்படைத்திருக்க மாட்டோம்
  rationale: நிகழ்ந்த உண்மைக்கு எதிரான விளைவைக் காட்டும் கிரேக்க அமைப்பைத் துல்லியமாகத் தருகிறது. நீதித்துறைச் சூழலில் παραδίδωμι என்பதற்கு ‘ஒப்படைத்தல்’ இயல்பானது; பிலாத்துவுக்கான ஒருமை முன்னிலையைத் தமிழின் மரியாதைப் பன்மையான ‘உங்களிடம்’ தருகிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான குற்றச்சாட்டின் தன்மை
  choice: ‘தீமை செய்பவர்’ என்ற பொதுவான குற்றச்சாட்டாக மொழிபெயர்த்தல்
  alternative: ‘குற்றவாளி’ அல்லது ‘தீயவன்’
  rationale: κακὸν ποιῶν என்பது குறிப்பிட்ட சட்டக் குற்றத்தைச் சொல்லாமல் தீமை செய்வதைப் பொதுவாகக் குறிக்கிறது. ஆகவே குற்றஞ்சாட்டியவர்களின் தெளிவற்ற பதிலைத் தெளிவாக்கிச் சொல்லாமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இரட்டை உரையாடல் சூத்திரம் தமிழில் இயல்பாக ‘பதிலளித்தார்கள்’ என்று சுருக்கப்பட்டுள்ளது. மூல ஆதாரத்தில் இவ்வசனத்திற்குத் தேவையான பொருளுள்ள அடிக்குறிப்பு இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
