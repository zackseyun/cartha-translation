revisions:
- from: அப்போது சீமோன் பேதுரு, தன்னிடமிருந்த வாளை உருவி, தலைமை ஆசாரியரின் அடிமையை[a]த் தாக்கி, அவனுடைய வலது காதை வெட்டிவிட்டார். அந்த அடிமையின் பெயர் மல்குஸ்.
  to: அப்போது சீமோன் பேதுரு, தன்னிடமிருந்த வாளை உருவி, தலைமை ஆசாரியரின் அடிமையை[a] அடித்து, அவனுடைய வலது காதை வெட்டினார். அந்த அடிமையின் பெயர் மல்குஸ்.
