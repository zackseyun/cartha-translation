id: JHN.18.10
reference: John 18:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: ta
  text: அப்போது சீமோன் பேதுரு, தன்னிடமிருந்த வாளை உருவி, தலைமை ஆசாரியரின் அடிமையை[a] அடித்து, அவனுடைய வலது காதை வெட்டினார். அந்த அடிமையின் பெயர் மல்குஸ்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளரை.” கிரேக்கச் சொல் δοῦλος (தூலோஸ்), சூழலைப் பொறுத்து “அடிமை” அல்லது “பணியாளர்” என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து கதை நகர்வதைக் காட்டுகிறது; அளவுக்கு மீறிய தர்க்கத் தொடர்பை உருவாக்காமல் கிரேக்க இணைப்புச் சொல்லின் வலிமையை இயல்பாகத் தருகிறது.
- source_word: ἔχων μάχαιραν
  choice: தன்னிடமிருந்த வாளை
  rationale: ἔχων என்பதன் உடைமைப் பொருளையும் μάχαιρα என்பதன் பொதுவான ஆயுதப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; அது குறுவாளா நீள்வாளா என்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: εἵλκυσεν αὐτὴν
  choice: உருவி
  rationale: உறையிலிருந்து வாளை வெளியே எடுத்த செயலைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἔπαισεν
  choice: தாக்கி
  rationale: ஆயுதத்தால் அடித்த செயலைத் தெளிவாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: தலைமை ஆசாரியரின் அடிமையை
  rationale: δοῦλος என்பது இங்கு தலைமை ஆசாரியருக்குச் சொந்தமாகக் கட்டுப்பட்ட நிலையைக் குறிக்கக்கூடும்; எனவே ‘அடிமை’ முதன்மை உரையில் வைக்கப்பட்டு, ‘பணியாளர்’ அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
- source_word: ἀπέκοψεν
  choice: வெட்டிவிட்டார்
  rationale: வெட்டிப் பிரித்துவிட்ட நிறைவுற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὠτάριον τὸ δεξιόν
  choice: வலது காதை
  rationale: ὠτάριον என்பதிலுள்ள சிறுமைப் பின்னொட்டு இச்சூழலில் தனியாக மொழிபெயர்க்கப்பட வேண்டியதில்லை; ‘காது’ என்பது இயல்பான பொதுப் பொருள், τὸ δεξιόν எந்தக் காது என்பதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: அந்த அடிமையின் பெயர் மல்குஸ்
  rationale: கிரேக்க தத்திவுக் கட்டமைப்பை இயல்பான தமிழ் உடைமைக் கட்டமைப்பாகத் தருகிறது; δέ இங்கு புதிய அடையாளத் தகவலை அறிமுகப்படுத்துவதால் தனி இணைப்புச் சொல் அவசியமில்லை.
theological_decisions:
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளர்
  rationale: இந்தச் சொல் ‘அடிமை’ அல்லது ‘பணியாளர்’ எனச் சூழலுக்கேற்ப பொருள்படலாம். தலைமை ஆசாரியருடனான உடைமை/கட்டுப்பாட்டு உறவு இங்கு வெளிப்படுவதால் ‘அடிமை’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; சூழல் அந்த நபரின் சட்ட அல்லது சமூக நிலையை முழுமையாக விளக்காததால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உருவி’ என்பது வாளை உறையிலிருந்து எடுப்பதைச் சுருக்கமாகக் காட்டுகிறது. மரியாதை வினைமுற்றுகள் பேதுருவைக் குறிக்க இலக்கண மரபுப்படி பயன்படுத்தப்பட்டுள்ளன; அவை செயலுக்கு ஒப்புதல் அல்லது சிறப்பு மரியாதை சேர்ப்பதில்லை.
