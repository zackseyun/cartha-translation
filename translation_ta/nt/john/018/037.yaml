  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: ta
  text: அப்போது பிலாத்து அவரிடம், “அப்படியானால், நீ ஒரு அரசனா?” என்று கேட்டான். இயேசு, “நான் அரசன் என்று நீயே சொல்கிறாய்.[a] இதற்காகவே நான் பிறந்திருக்கிறேன்; இதற்காகவே உலகத்திற்கு வந்திருக்கிறேன்—உண்மைக்குச் சாட்சி கொடுப்பதற்காக. உண்மையிலிருந்து வந்த ஒவ்வொருவரும் என் குரலுக்குச் செவிகொடுக்கிறார்கள்” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “நீ அப்படிச் சொல்கிறாய்: நான் அரசன்”; அல்லது, “நான் அரசன் என்று நீ சரியாகச் சொல்கிறாய்.” கிரேக்க வாசகம் சுருக்கமானது; தகுதிப்படுத்தப்பட்ட ஓர் உறுதிப்படுத்தலாகவும் இதைப் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: அப்படியானால்
  rationale: முந்தைய உரையாடலிலிருந்து பிலாத்து ஒரு முடிவை வருவிப்பதைக் காட்டும் காரணவிளைவு நுணுக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: βασιλεὺς
  choice: அரசன்
  rationale: ரோம ஆட்சியின் விசாரணைச் சூழலில் அரசியல் மற்றும் மேசியா சார்ந்த இரு ஒலிப்புகளையும் தேவையற்ற விளக்கமின்றித் தக்கவைக்கும் வழக்கமான தமிழ் சொல்.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: நான் அரசன் என்று நீயே சொல்கிறாய்
  rationale: சுருக்கமான கிரேக்கக் கூற்றை நேரடியாகவும் இயல்பாகவும் தருகிறது; அதை முழுமையான உறுதிப்படுத்தலாகவோ மறுப்பாகவோ தீர்மானிக்காமல் அதன் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: γεγέννημαι
  choice: நான் பிறந்திருக்கிறேன்
  rationale: நிறைவேற்றுக் காலத்தின் தற்போதைய தொடர்பைத் தமிழில் தக்கவைக்கிறது; இச்சூழல் கட்டாயப்படுத்தாத ‘பெறப்பட்டேன்’ போன்ற இறையியல் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: உலகத்திற்கு வந்திருக்கிறேன்
  rationale: நிறைவேற்றுக் காலத்தின் தொடரும் பொருத்தத்தையும் யோவானின் பணி/தோற்றம் சார்ந்த ஒலிப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: உண்மைக்குச் சாட்சி கொடுப்பதற்காக
  rationale: ἵνα கூறும் நோக்கத்தையும் யோவானின் சட்டவியல் சாட்சி மொழியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: உண்மையைச் சார்ந்த ஒவ்வொருவரும்
  rationale: ἐκ குறிக்கும் மூல/உறவு கருத்தை சொற்சொல்லான அசட்டுத்தன்மையின்றி வெளிப்படுத்துகிறது; ‘உண்மைக்குரிய’ என்பதைக் காட்டிலும் சாதாரண வாசகருக்குத் தெளிவானது.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: என் குரலுக்குச் செவிகொடுக்கிறார்கள்
  rationale: வெறுமனே ஒலி கேட்பதைவிட ஏற்றுக்கொண்டு கேட்கும் பதிலளிப்பை உணர்த்துகிறது; அதேவேளை ‘என் குரல்’ என்ற யோவானிய உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: Σὺ λέγεις ὅτι βασιλεύς εἰμι என்ற இயேசுவின் பதிலின் நுணுக்கம்
  choice: தகுதிப்படுத்தப்பட்ட உறுதிப்படுத்தலுக்கான வாய்ப்பைத் திறந்தவாறு, ‘நான் அரசன் என்று நீயே சொல்கிறாய்’ என வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘நான் அரசன் என்று நீ சரியாகச் சொல்கிறாய்’ என்ற வலுவான உறுதிப்படுத்தல்; அல்லது ‘அது உன் சொல்’ என்ற விலகிய பதில்
  rationale: கிரேக்க வாசகம் பல நுணுக்கங்களுக்கு இடமளிக்கிறது; வலுவான உறுதிப்படுத்தலையோ மறுப்பையோ வெளிப்படையாகக் கூறவில்லை. எனவே முதன்மை உரை அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது; மாற்று புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ‘நான் பிறந்திருக்கிறேன்’ மற்றும் ‘உலகத்திற்கு வந்திருக்கிறேன்’ என்ற பணி மொழி
  choice: இரு கூற்றுகளையும் தனித்தனியாகத் தக்கவைத்தல்
  alternative: இரண்டையும் ஒன்றாகச் சுருக்கி ஒரே பணிக் கூற்றாக மொழிபெயர்த்தல்
  rationale: யோவானின் சொற்கள் பிறப்பையும் உலகத்திற்கு வருதலையும் வேறுபடுத்துகின்றன; இது அவதாரப் பொருளொலியைக் கொண்டிருக்கலாம். உரை கூறுவதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க ஆனால் சாதாரண வாசகருக்குப் புரியும் நடையமைப்பு. உரையாடலில் பிலாத்தை ‘கேட்டான்’ என்றும் இயேசுவை ‘பதிலளித்தார்’ என்றும் தமிழ் வேதாகம மரபில் வழக்கமான நபர்-மரியாதை வேறுபாடு பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘சாட்சி கொடு’, ‘செவிகொடு’ ஆகியவை அரசியல், சட்டவியல், யோவானிய குரல் உருவகம் ஆகியவற்றை இயல்பாகத் தக்கவைக்கின்றன.
