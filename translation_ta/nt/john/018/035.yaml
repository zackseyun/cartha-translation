- from: பிலாத்து மறுமொழியாக, “நான் ஒரு யூதனா என்ன?[a] உன் சொந்த மக்களும் தலைமைக் குருமார்களுமே உன்னை என்னிடம் ஒப்படைத்தார்கள். நீ என்ன செய்தாய்?” என்றான்.
  to: 'பிலாத்து பதிலளித்தான்: “நான் யூதனா என்ன?[a] உன் சொந்த மக்களும் தலைமை ஆசாரியர்களும் உன்னை என்னிடம் ஒப்படைத்தார்கள். நீ என்ன செய்தாய்?”'
  rationale: The revision removes an unsupported emphasis, uses an idiomatic Tamil rhetorical question that retains μήτι's expectation of a negative answer, and adopts the standard precise term for the chief-priestly leadership. The footnote preserves the genuine lexical ambiguity of Ἰουδαῖος without altering the main contextual rendering.
