id: JHN.18.35
reference: John 18:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: ta
  text: 'பிலாத்து பதிலளித்தான்: “நான் யூதனா என்ன?[a] உன் சொந்த மக்களும் தலைமை ஆசாரியர்களும் உன்னை என்னிடம் ஒப்படைத்தார்கள். நீ என்ன செய்தாய்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் யூதேயனா என்ன?” கிரேக்கச் சொல் சூழலைப் பொறுத்து இன/மத அடையாளமான “யூதன்” என்பதையோ, பிராந்திய அடையாளமான “யூதேயன்” என்பதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: மறுமொழியாக ... என்றான்
  rationale: உரையாடலில் பதிலளித்தலை இயல்பான நவீனத் தமிழில் காட்டுகிறது; கிரேக்கக் கதைநடை வினையின் பொருளையும் தக்கவைக்கிறது.
- source_word: Μήτι
  choice: நான் ... ஆனா என்ன?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சியைத் தமிழின் இயல்பான ஏளனத் தொனியுள்ள வினாவாக வெளிப்படுத்துகிறது.
- source_word: Ἰουδαῖός
  choice: யூதன்
  rationale: இங்கு பிலாத்து தன்னை இயேசுவின் இன-தேசிய மக்களிடமிருந்து வேறுபடுத்திக் காட்டுவதால், பரந்த இன/மத அடையாளத்தைக் குறிக்கும் ‘யூதன்’ பொருத்தமானது; ‘யூதேயன்’ என்பதும் மொழியியல் சாத்தியம்.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: உன் சொந்த மக்கள்
  rationale: ἔθνος இங்கு இயேசுவின் மக்கள் சமூகத்தைக் கூட்டாகக் குறிக்கிறது; τὸ σὸν என்பதிலுள்ள வலியுறுத்தலையும் ‘சொந்த’ வெளிப்படுத்துகிறது. ‘தேசம்’ என்பதைவிட உரையாடலில் இயல்பானது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருமார்கள்
  rationale: எருசலேமின் உயர்நிலை ஆசாரியத் தலைமைக் குழுவைக் குறிக்கும் பன்மையைத் தெளிவாகவும் சமயப் பிரிவு சாராமலும் வழங்குகிறது.
- source_word: παρέδωκάν
  choice: ஒப்படைத்தார்கள்
  rationale: அதிகாரியிடம் காவல்/விசாரணைக்காகக் கையளித்த நீதித்துறைச் சூழலைக் காட்டுகிறது; இங்கே தேவையற்ற ‘காட்டிக்கொடுத்தார்கள்’ என்ற துரோகச் சுமையைச் சேர்ப்பதில்லை.
- source_word: τί ἐποίησας
  choice: நீ என்ன செய்தாய்?
  rationale: கிரேக்க இறந்தகால வினாவைத் தமிழில் நேராகவும் இயல்பாகவும் வழங்கி, தற்போதைய விசாரணைக்கு காரணமான செயலைக் கேட்கிறது.
theological_decisions:
- issue: யோவானில் Ἰουδαῖος என்பதன் பொருள்
  choice: யூதன்
  alternative: யூதேயன்
  rationale: பிலாத்துவின் வினாவும் தொடர்ந்து வரும் ‘உன் சொந்த மக்கள்’ என்ற குறிப்பும் பரந்த இன-தேசிய அடையாளத்தை முன்னிறுத்துகின்றன. எனினும், இச்சொல் பிராந்திய அடையாளத்தையும் குறிக்கக்கூடியதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நீதிமன்ற உரையாடலுக்கேற்ற கண்ணியமான அதேவேளையில் இயல்பான நடை. பிலாத்துவின் எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாத்தொனி ‘ஆனா என்ன?’ எனப் பாதுகாக்கப்பட்டுள்ளது.
