source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: ta
  text: ஆகவே இயேசு பேதுருவிடம், “வாளை அதன் உறைக்குள்[a] போடு. தந்தை எனக்குக் கொடுத்திருக்கும் கிண்ணத்தை[b] நான் குடிக்காமல் இருப்பேனா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறை’ என்பதை ‘வாளுறை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கிண்ணம்’ என்பது தேவனால் நியமிக்கப்பட்ட துன்பத்தையோ முடிவையோ குறிக்கும் வேதாகம உருவகம்; கெத்செமனேயில் இயேசு செய்த ஜெபத்துடன் ஒப்பிடுக (மத் 26:39; மாற் 14:36; லூக் 22:42).
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் தொடர்ச்சியையும் அதிலிருந்து எழும் இயேசுவின் பதிலையும் இணைக்கிறது; கிரேக்க இணைப்புச் சொல்லின் தர்க்க மற்றும் கதைத் தொடர்ச்சி வலிமையைத் தக்கவைக்கிறது.
- source_word: Βάλε
  choice: போடு
  rationale: இந்தச் சூழலில் βάλλω என்பதன் கட்டளை வடிவம் எறிவதைக் குறிக்காமல், ஒரு பொருளை அதற்குரிய இடத்திற்குள் வைப்பதைக் குறிக்கிறது. நவீன தமிழில் இயல்பான நேரடிக் கட்டளை.
- source_word: μάχαιραν
  choice: வாள்
  rationale: μάχαιρα ஒரு கூராயுதத்தைக் குறிக்கிறது. அதன் அளவை தேவையின்றிக் குறிப்பிட்டு ‘குறுவாள்’ என்று சுருக்காமல், கைது நிகழ்வில் தெளிவான பொதுச் சொல்லான ‘வாள்’ பயன்படுத்தப்படுகிறது.
- source_word: θήκην
  choice: உறை
  rationale: வாளை வைத்திருக்கும் உறையைக் குறிக்கும் தெளிவான, இயல்பான தமிழ்ச் சொல். ‘வாளுறை’ என்பது சாத்தியமான வெளிப்படையான மாற்று.
- source_word: ποτήριον
  choice: கிண்ணம்
  rationale: தேவன் நியமித்த துன்பம் அல்லது பங்கைச் சுட்டும் வேதாகம உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே தக்கவைக்கிறது.
- source_word: δέδωκέν
  choice: கொடுத்திருக்கும்
  rationale: முடிவுற்ற செயலின் தற்போதைய பொருத்தத்தை உணர்த்தும் கிரேக்க நிறைவுக்காலத்தின் நுணுக்கத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ πατήρ
  choice: தந்தை
  rationale: கிரேக்கத்தில் உடைமைப் பெயர் இல்லாததால் ‘என் தந்தை’ என்று சேர்க்காமல், யோவானின் தனித்துவமான பயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: οὐ μὴ πίω αὐτό;
  choice: நான் குடிக்காமல் இருப்பேனா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியின் வலிமையைத் தக்கவைக்கிறது; இயேசு அந்தக் கிண்ணத்தை ஏற்றுக்கொள்வார் என்பதைக் கேள்வி வடிவிலேயே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கிண்ணம்’ என்பதன் பொருள்
  choice: தந்தையால் நியமிக்கப்பட்ட துன்பத்தையும் பணியையும் குறிக்கும் உருவகமாக ‘கிண்ணம்’ என்றே வைத்தல்
  alternative: ‘துன்பம்’, ‘விதிக்கப்பட்ட முடிவு’, அல்லது ‘தேவ கோபத்தின் கிண்ணம்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: உடனடிச் சூழலும் வேதாகமத்தின் பரந்த பயன்பாடும் நியமிக்கப்பட்ட துன்பத்தைக் காட்டினாலும், இவ்வசனம் உருவகத்தை அதைவிடக் குறுகிய கோட்பாட்டுச் சொல்லால் வரையறுக்கவில்லை. எனவே உண்மையான இறையியல் பரப்பும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
- issue: தந்தையுடன் இயேசுவின் உறவு
  choice: தந்தைக்கான இயேசுவின் மனமுவந்த கீழ்ப்படிதலை எளிமையாக மொழிபெயர்த்தல்
  alternative: ‘என் தந்தை இதை எனக்கு நியமித்தார்’ போன்ற விளக்கத்தைச் சேர்த்தல்
  rationale: வசனம் குமாரனின் கண்ணியத்தைக் குறைக்காமல் தந்தையின் சித்தத்துக்கு அவர் கீழ்ப்படிவதை முன்வைக்கிறது. மூலத்தில் இல்லாத உடைமைச் சொல்லையோ கோட்பாட்டு விளக்கத்தையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிண்ணத்தைக் குடித்தல்’ என்ற சற்றே குறியீட்டுத்தன்மையுள்ள சொல்லாட்சி, மூலத்தின் உருவகத்தைத் திறந்தவாறே பாதுகாக்கிறது. வழங்கப்பட்ட ஆங்கில ஆலோசனைப் பிரதியில் குறிப்புக்குறிகள் இடம் மாறியிருந்ததால், [a] ‘உறை’ என்பதற்கும் [b] ‘கிண்ணம்’ என்பதற்கும் பொருத்தமாக இணைக்கப்பட்டுள்ளன.
