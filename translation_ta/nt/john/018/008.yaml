id: JHN.18.8
reference: John 18:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “நான்தான்[a] என்று உங்களிடம் சொன்னேன். ஆகவே, நீங்கள் என்னைத் தேடுகிறீர்கள் என்றால், இவர்களைப் போக விடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இருக்கிறேன்.” கிரேக்கத்தில் “அவன்” போன்ற நிறைவுச் சொல் இல்லை; இங்கு இயேசு தாமே அவர்கள் தேடும் நபர் என்பதைச் சூழல் காட்டுவதால், முதன்மை உரையில் “நான்தான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: மறுமொழியாக … என்றார்
  rationale: உரையாடலில் பதிலளிப்பதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் நடை; வாக்கியத்தின் முடிவில் வரும் ‘என்றார்’ என்பதுடன் இணைத்து கிரேக்கக் கதைநடையைத் தமிழில் சரளமாக்குகிறது.
- source_word: Εἶπον ὑμῖν
  choice: உங்களிடம் சொன்னேன்
  rationale: முன்பு கூறியதை நினைவூட்டும் இறந்தகாலக் கூற்றை இயல்பாக வெளிப்படுத்துகிறது; ὑμῖν என்பதையும் தெளிவாகக் காக்கிறது.
- source_word: ἐγώ εἰμι
  choice: நான்தான்
  rationale: தன்னைத் தேடுகிறவர்களுக்கு இயேசு தம்மை அடையாளப்படுத்தும் உடனடிச் சூழலில் இயல்பான தமிழ். கிரேக்கத்தின் சொற்படியான வடிவத்திலுள்ள சாத்தியமான யோவான் நற்செய்தித் தெய்வவியல் எதிரொலி அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ζητεῖτε
  choice: தேடுகிறீர்கள்
  rationale: நிகழ்ந்துகொண்டிருக்கும் தேடலைக் குறிக்கும் நிகழ்காலச் செயலைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄφετε
  choice: போகவிடுங்கள்
  rationale: இங்கு ἀφίημι என்பது இவர்களைச் செல்ல அனுமதிப்பதைக் குறிக்கிறது; ‘விடுதலை செய்யுங்கள்’ என்று காவல் நிலையைக் கூடுதலாகக் குறிப்பதைத் தவிர்க்கிறது.
- source_word: τούτους
  choice: இவர்களை
  rationale: இயேசுவுடன் இருந்தவர்களைச் சுட்டும் அண்மைச் சுட்டுப்பெயரைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: ὑπάγειν
  choice: போக
  rationale: அவர்கள் அங்கிருந்து செல்ல அனுமதிக்கப்பட வேண்டும் என்ற பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியின் சூழலில் ἐγώ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘நான்தான்’
  alternative: ‘நான் இருக்கிறேன்’
  rationale: உடனடிச் சூழலில் இது தேடப்படும் நபர் தாமே என்று இயேசு அடையாளப்படுத்துவதே முதன்மைப் பொருள். அதேவேளையில், முன்னிலைச் சொல்லில்லாத கிரேக்க ἐγώ εἰμι வடிவம் யோவான் நற்செய்தியில் ஆழமான தெய்வவியல் எதிரொலியைத் தரக்கூடும்; அதை அடிக்குறிப்பில் வெளிப்படையாகக் காத்து, பொருளை ஒருதலைப்பட்சமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நான்தான்’ என்பது அடையாளச் சூழலில் இயல்பானது; சொற்படியான கிரேக்க வடிவத்தின் திட்டமிட்ட தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
