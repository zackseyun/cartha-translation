id: JHN.18.39
reference: John 18:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: ta
  text: ஆனால், பஸ்கா பண்டிகையின்போது நான் உங்களுக்காக ஒருவனை விடுதலை செய்யும் வழக்கம் உங்களிடம் இருக்கிறது. ஆகவே, யூதர்களின் அரசனை[a] நான் உங்களுக்காக விடுதலை செய்ய வேண்டுமென்று விரும்புகிறீர்களா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின் அரசன்.” கிரேக்கச் சொல் சூழலுக்கு ஏற்ப யூதர்களையோ யூதேயர்களையோ குறிக்கலாம்; இங்கு அது பாடுபாட்டு நிகழ்வுகளில் பயன்படுத்தப்படும் நிலையான பட்டத்தின் ஒரு பகுதியாகத் தோன்றுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: வழக்கம்
  rationale: ஒரு தனிநபரின் பழக்கத்தைக் காட்டிலும், பண்டிகை மற்றும் நீதித்துறைச் சூழலில் நிலைபெற்ற சமூக நடைமுறையை இயல்பாகக் குறிக்கிறது.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: நான் உங்களுக்காக ஒருவனை விடுதலை செய்யும்
  rationale: ἕνα என்பதன் மனிதக் குறிப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘ஒருவனை’ பயன்படுத்தப்பட்டுள்ளது; கைதியை விடுவிக்கும் சட்டச் சூழலை ‘விடுதலை செய்யும்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἀπολύω
  choice: விடுதலை செய்
  rationale: ஆளுநர் ஒரு கைதியை விடுவிக்கும் சட்டச் சூழலுக்கு துல்லியமாகப் பொருந்துகிறது; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லாட்சி பேணப்பட்டுள்ளது.
- source_word: ἐν τῷ πάσχα
  choice: பஸ்கா பண்டிகையின்போது
  rationale: பண்டிகைக் காலத்தில் கடைப்பிடிக்கப்பட்ட வழக்கம் என்ற காலப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: βούλεσθε οὖν
  choice: ஆகவே, ... விரும்புகிறீர்களா?
  rationale: οὖν என்பதன் முடிவுரைக்கும் தொடர்பை ‘ஆகவே’ காட்டுகிறது; βούλεσθε என்பதற்கு ‘விரும்புகிறீர்களா’ என்பது கண்ணியமான நவீனத் தமிழ்.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: யூதர்களின் அரசன்
  rationale: யோவானின் பாடுபாட்டு நிகழ்வுகளில் இயேசுவுக்குப் பயன்படுத்தப்படும் நிலையான அரசியல்-அரசுரிமைப் பட்டத்தைப் பேணுகிறது. தமிழில் ‘அரசன்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
theological_decisions:
- issue: τῶν Ἰουδαίων என்பதை அரசுப் பட்டத்தில் மொழிபெயர்த்தல்
  choice: யூதர்களின் அரசன்
  alternative: யூதேயர்களின் அரசன்
  rationale: யோவானின் பாடுபாட்டு நிகழ்வுகளில் இச்சொற்றொடர் இயேசுவுக்கு எதிராக முன்வைக்கப்படும் அறியப்பட்ட அரசுரிமைக் குற்றச்சாட்டு அல்லது பட்டமாகச் செயல்படுகிறது. Ἰουδαῖοι என்பது சூழலுக்கு ஏற்ப ‘யூதர்கள்’ அல்லது ‘யூதேயர்கள்’ எனப் பொருள்படக்கூடியதால், மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மீளுரைப்பும் கேள்வித் தொனியும் பேணப்பட்டுள்ளன.
