  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் துல்லியமாக உள்ளன: παρρησίᾳ/ἐν κρυπτῷ என்ற வெளிப்படை–மறைவு எதிர்வு, λελάληκα-வின் நிறைவுக் கால நுட்பம், மற்றும் Ἰουδαῖοι என்பதற்கான சூழல்சார் அடிக்குறிப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. எனினும், ‘யூதர்கள் அனைவரும் கூடிவரும்’ என்பது கிரேக்கத்தில் தொழுகைக்கூடமும் ஆலயமும் ஆகிய இரு இடங்களுக்கும் தொடர்புடையதாக அமைகிறது; நடப்பு தமிழ் சொற்தொடர் அதை தொழுகைக்கூடத்திற்கு மட்டும் இயல்பாக இணைக்கும் வாய்ப்புள்ளது.'
