id: JHN.18.20
reference: John 18:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்தார்: “நான் உலகத்திற்கு வெளிப்படையாகப் பேசியிருக்கிறேன். யூதர்கள்[b] அனைவரும் கூடிவரும் யூதர்களின் தொழுகைக்கூடங்களிலும் ஆலயத்திலும்[a] நான் எப்போதும் போதித்தேன். மறைவாக நான் எதுவும் பேசவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலய வளாகத்தில்.’ கிரேக்கச் சொல் ἱερόν என்பது ஆலயத்தின் உள்ளகப் பரிசுத்த இடத்தை மட்டும் அல்ல, முழு ஆலய வளாகத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யூத மக்கள்’; யோவானின் சில சூழல்களில், ‘யூதேயர்கள்.’ கிரேக்கச் சொல் Ἰουδαῖοι சூழலைப் பொறுத்துப் பொருள் பெறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: ἐν κρυπτῷ (‘மறைவாக’) என்பதற்கு நேரான எதிர்மறை இணையாக இருந்து, பொதுவெளியில் மறைக்காமல் பேசியதைக் காட்டுகிறது; துணிவுடன் பேசியது என்ற கருத்தைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: λελάληκα
  choice: பேசியிருக்கிறேன்
  rationale: நிறைவுக் கால வினையின் நிகழ்காலத் தொடர்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τῷ κόσμῳ
  choice: உலகத்திற்கு
  rationale: யோவானின் κόσμος என்ற பரந்த சொற்பயன்பாட்டைப் பாதுகாக்கிறது; அதை ‘பொதுமக்களுக்கு’ என்று சுருக்கவில்லை.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து நிலவிய பொதுப் போதனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐδίδαξα
  choice: கற்பித்தேன்
  rationale: இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐν συναγωγῇ
  choice: தொழுகைக்கூடத்தில்
  rationale: ஒருமையைப் பேணுகிறது; இங்கு அது யூதர்களின் பொதுப் போதனை நடைபெறும் இடத்தை வகைப்பொதுமையாகக் குறிக்கலாம்.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: சுருக்கமான வழக்கமான மொழிபெயர்ப்பு; ἱερόν என்பது உள்ளகப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கும் என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: யூதர்கள் அனைவரும்
  rationale: இச்சூழலில் வழிபாட்டிற்கும் போதனைக்கும் கூடும் பரந்த யூத சமூகத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு; சொல்லின் சூழல்சார்ந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: συνέρχονται
  choice: கூடிவரும்
  rationale: மக்கள் ஒன்றாகச் சேர்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν κρυπτῷ
  choice: மறைவாக
  rationale: παρρησίᾳ (‘வெளிப்படையாக’) என்பதுடனான வெளிப்படை/மறைவு எதிர்வைத் தெளிவாகப் பேணுகிறது.
- source_word: ἐλάλησα οὐδέν
  choice: நான் எதுவும் பேசவில்லை
  rationale: வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἀπεκρίθη αὐτῷ
  choice: அவனுக்கு மறுமொழியாக
  rationale: கதைநடையில் இயல்பாக இருந்து, இயேசு விசாரித்தவனுக்குப் பதிலளித்ததைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: யோவானில் Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று மொழிபெயர்க்கப்பட்டு, இங்கு பொதுவாகக் கூடிவரும் யூத மக்களைக் குறிப்பதாக விடப்பட்டுள்ளது.
  alternative: ‘யூத மக்கள்’ அல்லது, சில யோவான் சூழல்களில், ‘யூதேயர்கள்’
  rationale: யோவானில் இச்சொல் சூழலைப் பொறுத்து யூத மக்கள், யூதேயர்கள் அல்லது யூதத் தலைவர்கள் எனக் குறிக்கலாம். இவ்வசனத்தில் தொழுகைக்கூடமும் ஆலயமும் கூறப்படுவதால் பரந்த சமூகக் குறிப்பு பொருத்தமானது; எனினும் மூலத்தின் சூழல்சார்ந்த நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெளிப்படையாக/மறைவாக’ என்ற எதிர்வு தெளிவாகப் பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
