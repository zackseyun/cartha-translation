id: JHN.18.4
reference: John 18:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: ta
  text: ஆகவே, இயேசு தனக்கு நேரிடவிருந்த அனைத்தையும் அறிந்தவராய், வெளியே சென்று அவர்களிடம், “யாரைத் தேடுகிறீர்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளுடன் உள்ள கதைத் தொடர்ச்சியையும் தர்க்கரீதியான தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἰδὼς
  choice: அறிந்தவராய்
  rationale: இயேசுவின் முன்கூட்டிய முழு விழிப்புணர்வை வலியுறுத்தாமல் குறைக்காமல், வாக்கியத்தின் துணைவினை அமைப்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: தனக்கு நேரிடவிருந்த அனைத்தையும்
  rationale: πάντα என்பதன் முழுமையையும், வரவிருந்த நிகழ்வுகள் இயேசுவை வந்தடையும் பொருளையும் தெளிவான நவீன தமிழில் தருகிறது; அந்த நிகழ்வுகள் என்னவென்று மூலத்தைவிட அதிகமாகக் குறிப்பிடவில்லை.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்று
  rationale: ἐξέρχομαι என்பதன் பொதுவான இயக்கப் பொருளை கூடுதல் நாடகத் தன்மை சேர்க்காமல் வழங்குகிறது.
- source_word: λέγει
  choice: கேட்டார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலக் கதையாடலாக மாற்றுகிறது; தொடர்ந்து வரும் வினாவினால் தமிழில் ‘கேட்டார்’ என்பது இயல்பானது.
- source_word: Τίνα
  choice: யாரை
  rationale: வினைச்சொல்லின் நேரடிச் செயப்படுபொருளாக உள்ள ஒருமை வினாப்பெயரின் வேற்றுமையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ζητεῖτε
  choice: தேடுகிறீர்கள்
  rationale: நிகழ்காலத் தொடர்ச்சிப் பொருளையும் ζητέω என்பதன் கண்ணியமான தொனியையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: கதையில் இயேசுவின் முன்அறிவு
  choice: தனக்கு நேரிடவிருந்த அனைத்தையும் இயேசு அறிந்திருந்தார் என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை வெளிப்படையாக ‘முழுமையான முன்அறிவு’ என்ற கோட்பாட்டு மொழியில் விரிவாக்கலாம்.
  rationale: வசனம் வரவிருந்த அனைத்தையும் இயேசு அறிந்திருந்ததாகத் தெளிவாகச் சொல்கிறது; ஆனால் அதன் எல்லையைப் பற்றி மூலத்தில் இல்லாத முறைமையான இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. இவ்வசனத்தில் தனியாகக் குறிக்க வேண்டிய உண்மையான உரை அல்லது பொருள் மாற்று இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
