  source_fidelity: '‘ஆகவே’ appropriately renders οὖν as a connective. ‘தனக்கு நேரிடவிருந்த அனைத்தையும் அறிந்தவராய்’ faithfully conveys Jesus’ knowledge of all that was coming upon him, without expanding the nature of that knowledge. ‘வெளியே சென்று’ renders ἐξῆλθεν, and the direct question accurately retains the singular object and present-force sense: ‘யாரைத் தேடுகிறீர்கள்?’'
  naturalness: The sentence is natural modern standard Tamil and maintains a suitably dignified narrative register. ‘கேட்டார்’ is the idiomatic Tamil narrative verb for introducing the question and does not alter the source meaning.
