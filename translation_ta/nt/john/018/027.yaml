  text: πάλιν οὖν ⸀ἠρνήσατο Πέτρος· καὶ εὐθέως ἀλέκτωρ ἐφώνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: ta
  text: அப்போது பேதுரு மீண்டும் மறுத்தார்[a]. உடனே சேவல் கூவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது பேதுரு அதை மீண்டும் மறுத்தார்.” கிரேக்கத்தில் அவர் எதை மறுத்தார் என்பது வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய கேள்வியிலிருந்து சூழல் அதை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: பேதுருவின் மறுப்பு மீண்டும் நிகழ்ந்ததை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய கேள்விக்கும் இந்த மறுப்புக்கும் இடையிலான தொடர்ச்சியையும் கதையின் கால முன்னேற்றத்தையும் இயல்பாகக் காட்டுகிறது; வலுவான காரணவியல் பொருளைத் திணிக்கவில்லை.
- source_word: ἠρνήσατο
  choice: அதை மறுத்தார்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய கேள்வியைச் சூழல் சுட்டுவதால் தமிழின் இயல்புக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு மூலத்தின் மறைபொருள் தன்மையைப் பதிவு செய்கிறது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: καὶ
  choice: உடனே
  rationale: தனி ‘மற்றும்’ என்பதைக் காட்டிலும் அடுத்து வரும் εὐθέως உடன் இணைந்து நிகழ்வுகளின் நெருக்கமான தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: பேதுருவின் மறுப்பைத் தொடர்ந்து சேவல் கூவிய கால உடனடித்தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: ἀλέκτωρ
  choice: ஒரு சேவல்
  rationale: ஆண் கோழியைக் குறிக்கும் தெளிவான, இன்றைய பொதுத்தமிழ்ச் சொல்; கிரேக்கத்தில் உறுதியற்ற பெயர்ச்சொல்லாக இருப்பதால் தமிழில் ‘ஒரு’ இயல்பாகச் சேர்க்கப்படுகிறது.
- source_word: ἐφώνησεν
  choice: கூவியது
  rationale: வினைச்சொல் பொதுவாக ஒலி எழுப்புதலைக் குறித்தாலும், சேவல் எழுப்பும் ஒலிக்கு ‘கூவியது’ என்பதே இயல்பான தமிழாக்கம்.
