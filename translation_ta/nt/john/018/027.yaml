translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள் முதன்மை உரையில் இயல்பான தமிழுக்காக வழங்கப்பட்டு, அதன் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
