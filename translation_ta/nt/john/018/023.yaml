reference: John 18:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்தார்: “நான் தவறாகப் பேசியிருந்தால், அந்தத் தவறைப் பற்றிச் சாட்சி சொல்; ஆனால் சரியாகப் பேசியிருந்தால், என்னை ஏன் அடிக்கிறாய்?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடிக்கிறாய்” என்பதற்கான கிரேக்க வினைச்சொல் பொதுவாகத் தாக்குதல் அல்லது அடித்தலைக் குறிக்கும்; சில சூழல்களில் அடித்துத் துன்புறுத்துதலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: இயேசு அவனுக்குப் பதிலளித்தார்
  rationale: கதைநடையில் இயல்பான தமிழைத் தருவதோடு, பதில் யாருக்கு அளிக்கப்பட்டது என்பதையும் கிரேக்க மூலத்தின்படி வெளிப்படுத்துகிறது.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: நான் தவறாகப் பேசியிருந்தால்
  rationale: κακῶς என்பதன் ‘தவறாக’ என்ற பொருளையும், முன்பு பேசியதைச் சுட்டும் நிபந்தனை அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: அந்தத் தவறு என்னவென்று சாட்சி சொல்
  rationale: μαρτύρησον என்பதன் நீதிமன்றச் சாயலை ‘சாட்சி சொல்’ காக்கிறது; பெயர்ச்சொல் தன்மையுள்ள τοῦ κακοῦ என்பதை மிகையாக விளக்காமல், தமிழில் புரியும்படி வழங்குகிறது.
- source_word: εἰ δὲ καλῶς
  choice: ஆனால் சரியாகப் பேசியிருந்தால்
  rationale: κακῶς/καλῶς என்ற எதிரிணையை ‘தவறாக/சரியாக’ என்று தெளிவாகப் பிரதிபலிக்கிறது; தமிழில் விடுபட்ட வினையை நிரப்புவது இயல்பான வாசிப்பைத் தருகிறது.
- source_word: τί με δέρεις;
  choice: ஏன் என்னை அடிக்கிறாய்?
  rationale: τί இங்கு காரணம் கேட்கும் ‘ஏன்’ என இயங்குகிறது. δέρεις என்பதற்கு ‘அடிக்கிறாய்’ என்பது அடி, தாக்குதல் அல்லது தொடர்ச்சியான அடித்தல் ஆகியவற்றைச் சூழலுக்கேற்ப உள்ளடக்கக்கூடிய பொதுவான தமிழ் சொல்.
theological_decisions:
- issue: அநியாயமான வன்முறைக்கு இயேசு அளிக்கும் பதிலின் தன்மை
  choice: முறையான சாட்சியைக் கோரும் நீதிசார் சவாலாக மொழிபெயர்க்கப்பட்டது.
  alternative: அநீதியைக் கண்டிக்கும் கருத்தை விளக்கமாகச் சேர்த்தல் அல்லது நீதிமன்றச் சாயலை மென்மையாக்குதல்.
  rationale: கிரேக்க உரை, தவறு இருந்தால் அதற்குச் சாட்சி சொல்ல வேண்டும் என்றும், இல்லையெனில் அடிப்பதற்கான காரணம் என்ன என்றும் கேட்கிறது. உரையில் வெளிப்படையாக இல்லாத கோட்பாட்டு அல்லது அறநெறி விளக்கத்தைச் சேர்க்காமல் அந்தத் தர்க்கம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘சாட்சி சொல்’ என்பது நீதிசார் தொனியைப் பாதுகாக்கிறது; ‘தவறாக/சரியாக’ என்ற எதிரிணை மூலத்தின் அமைப்பைத் தெளிவாகக் காக்கிறது.
