id: JHN.18.9
reference: John 18:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: ta
  text: 'அவர் சொன்ன வார்த்தை நிறைவேறும்படி இது நடந்தது: “நீர் எனக்குத் தந்தவர்களில் ஒருவரைக்கூட[a] நான் இழந்துவிடவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களில் எவரையும்” அல்லது “அவர்களில் ஒருவரைக்கூட.”
    reason: ἐξ αὐτῶν οὐδένα என்ற கிரேக்கச் சொற்றொடரின் பகுதிப்பொருளை தமிழில் பல இயல்பான முறைகளில் வழங்க முடியும்.
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: நிறைவேறும்படி
  rationale: ἵνα உடன் வரும் இறைப்பாட்டு வினைச்சொல்லின் நோக்கம்/விளைவு சார்ந்த வலிமையை இயல்பான தமிழில் காக்கிறது; வெறுமனே ‘உண்மையானது’ என்று தளர்த்தவில்லை.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: அவர் சொன்ன வார்த்தை
  rationale: λόγος இங்கு ஒரு குறிப்பிட்ட கூற்றைக் குறிக்கிறது; கிறிஸ்துவுக்கான பட்டப்பெயரான ‘வார்த்தை’ என்ற பொருளை இங்கு ஏற்றாமல், யோவானின் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: Οὓς δέδωκάς μοι
  choice: நீர் எனக்குத் தந்தவர்களில்
  rationale: மூலத்தின் பன்மை உறவுப்பெயரையும், தொடர்ந்து வரும் பகுதிப்பொருளையும் இயல்பாக இணைக்கிறது. δέδωκάς என்பதன் நிறைவுற்ற கொடையின் விளைவு தமிழில் இவ்வமைப்பால் போதுமான அளவு வெளிப்படுகிறது.
- source_word: οὐκ ἀπώλεσα
  choice: நான் இழந்துவிடவில்லை
  rationale: சீடர்களைப் பாதுகாக்கும் உடனடி சூழலில் ἀπόλλυμι அழித்தலைவிட இழப்பைக் குறிக்கிறது. ‘இழந்துவிடவில்லை’ என்பது பாதுகாப்பின் கருத்தையும் சொற்றொடரின் வலிமையையும் இயல்பாகத் தருகிறது.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: ஒருவரைக்கூட
  rationale: ‘அவர்களிலிருந்து ஒருவரும் இல்லை’ என்ற வலியுறுத்தப்பட்ட பகுதிப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் சொல் நிறைவேறுதல்
  choice: ‘நிறைவேறும்படி’ என்று மொழிபெயர்த்து, இயேசு முன்பு சொன்ன வார்த்தையின் நிகழ்வுசார் நிறைவேற்றமாகக் காட்டப்பட்டது.
  alternative: ‘உண்மையாகும்படி’ அல்லது ‘நடந்தேறும்படி’
  rationale: யோவான் வேதாகம வசனங்களுக்கு மட்டுமல்ல, இயேசுவின் சொற்களுக்கும் நிறைவேற்ற மொழியைப் பயன்படுத்துகிறார். இத்தேர்வு அதற்குரிய இறையியல் எடையைத் தக்கவைக்கிறது; அதேவேளை இதை வெளிப்படையாகத் தீர்க்கதரிசன சூத்திரம் என்று கூடுதலாக வரையறுக்கவில்லை.
- issue: ἀπώλεσα என்பதன் பொருள்
  choice: ஒப்படைக்கப்பட்டவர்களை இயேசு பாதுகாத்தார் என்ற சூழலில் ‘இழந்துவிடவில்லை’ என வழங்கப்பட்டது.
  alternative: ‘அழிக்கவில்லை’ அல்லது ‘அழிந்துபோக விடவில்லை’
  rationale: கைது நிகழ்வில் சீடர்களைப் பாதுகாப்பதே உடனடி சூழல்; இது யோவான் 17:12-ஐயும் எதிரொலிக்கிறது. ‘இழந்துவிடவில்லை’ என்பது குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்காமல் யோவானிய பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. பிதாவை ஒருமையில் மரியாதையுடன் சுட்ட ‘நீர்’ பயன்படுத்தப்பட்டது. முந்தைய வசனத்துடன் இலக்கண ரீதியாக இணையும் ἵνα தொடர், தனி வசனமாகவும் தெளிவாக இருக்க ‘இது நடந்தது’ என்ற இயல்பான தமிழ் இணைப்புடன் வழங்கப்பட்டது.
