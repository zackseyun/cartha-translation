source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: ta
  text: பேதுரு காதை வெட்டிய மனிதனின் உறவினனாகிய தலைமை ஆசாரியனுடைய அடிமைகளில் ஒருவன்[a], “நான் உன்னை அவரோடு தோட்டத்தில் பார்த்தேனல்லவா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளர்களில் ஒருவன்.” கிரேக்கச் சொல் சூழலுக்கேற்ப அடிமைகளையோ பணியாளர்களையோ குறிக்கலாம்; இங்கு அந்தக் கட்டுப்பட்ட சமூக நிலையைக் காட்ட “அடிமைகள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: அடிமைகளில்
  rationale: இச்சூழலில் தலைமை ஆசாரியனின் வீட்டைச் சேர்ந்த, கட்டுப்பட்ட சமூக நிலையிலிருந்தவர்களைக் குறிக்கிறது. ஆகவே பொதுவான ‘பணியாளர்கள்’ என்பதைவிட ‘அடிமைகள்’ மூலச்சொல்லின் சமூக உண்மையைத் தெளிவாகக் காக்கிறது.
- source_word: ἀρχιερέως
  choice: தலைமை ஆசாரியனுடைய
  rationale: யோவானின் பாடுபாட்டு நிகழ்வுகளில் ἀρχιερεύς குறிக்கும் பிரதான ஆசாரியப் பதவிக்கான தெளிவான, வழக்கமான தமிழ் வடிவம்.
- source_word: συγγενὴς ὢν
  choice: உறவினனான
  rationale: பேசியவன் காது வெட்டப்பட்ட மனிதனின் உறவினர் என்பதை இயல்பான தமிழில் பங்கேற்புச் சொற்றொடராகத் தெரிவிக்கிறது.
- source_word: οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον
  choice: பேதுருவால் காது வெட்டப்பட்டவனின்
  rationale: காது யாருக்குச் சொந்தமானது என்பதைத் தமிழில் தெளிவாக்கி, பேதுருவின் செயல் இதற்கு முன்பு நடந்தது என்பதையும் இயல்பாக உணர்த்துகிறது.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: நான் உன்னை ... பார்த்தேனல்லவா?
  rationale: οὐκ தொடங்கும் கேள்வி ‘ஆம்’ என்ற பதிலை எதிர்பார்க்கிறது; ‘அல்லவா?’ அதைக் காக்கிறது. ‘நான்’ வெளிப்படையாக இடம்பெறுவதால் ἐγώவின் வலியுறுத்தலும் நீங்கவில்லை.
- source_word: ἐν τῷ κήπῳ μετ’ αὐτοῦ
  choice: அவரோடு தோட்டத்தில்
  rationale: κήπος என்பதற்கு ‘தோட்டம்’ இயல்பான பொருள்; αὐτοῦ சூழலில் இயேசுவைக் குறிப்பதால் மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: வீட்டுச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளர்
  rationale: இங்கு உருவகப் பயன்பாடு அல்ல; தலைமை ஆசாரியனின் வீட்டைச் சேர்ந்த கட்டுப்பட்ட நிலையிலுள்ள ஒருவரைக் குறிக்கிறது. ‘அடிமை’ அந்த சமூக நிலையைக் குறைக்காமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடையில் அமைக்கப்பட்டுள்ளது. ‘பார்த்தேனல்லவா?’ என்பது நேர்மறைப் பதிலை எதிர்பார்க்கும் வினாவின் இயல்பையும் குற்றஞ்சாட்டும் தொனியையும் காக்கிறது.
