  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: ta
  text: சீமோன் பேதுரு இயேசுவைப் பின்தொடர்ந்து சென்றுகொண்டிருந்தார்; இன்னொரு சீடரும் அப்படியே சென்றார்.[a] அந்தச் சீடர் தலைமைக் குருவுக்கு அறிமுகமானவராக இருந்தார்; அவர் இயேசுவுடன் தலைமைக் குருவின் முற்றத்திற்குள் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல் அமைப்புக்கு நெருக்கமாக: ‘சீமோன் பேதுருவும் இன்னொரு சீடரும் இயேசுவைப் பின்தொடர்ந்து சென்றுகொண்டிருந்தார்கள்.’ இரண்டாவது சீடரும் அதே செயலைச் செய்தார் என்பதை கிரேக்கம் மறைமுகமாக விட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: பின்தொடர்ந்து சென்றுகொண்டிருந்தார்
  rationale: நிறைவுறா இறந்தகால வினை, அப்போது தொடர்ந்து நடைபெற்ற செயலைக் காட்டுகிறது; ஆகவே வெறும் ‘பின்தொடர்ந்தார்’ என்பதைவிட இத்தேர்வு அதன் காலநிலையைத் தெளிவாகக் காக்கிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதை நகர்வை மெதுவாக இணைக்கும் இடைச்சொல். தமிழில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது இல்லாத கால அல்லது முரண்பாட்டுப் பொருளை உண்டாக்கலாம்; வாக்கிய ஓட்டமே இணைப்பை வெளிப்படுத்துகிறது.
- source_word: καὶ ἄλλος μαθητής
  choice: இன்னொரு சீடரும் அப்படியே சென்றார்
  rationale: இரண்டாவது சீடரும் இயேசுவைப் பின்தொடர்ந்தார் என்பது கிரேக்கத்தில் மறைமுகமாகப் பகிரப்படும் வினையால் உணர்த்தப்படுகிறது. இயல்பான தமிழுக்காக அந்தச் செயல் வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
- source_word: μαθητής
  choice: சீடர்
  rationale: யோவான் நற்செய்தியில் இயேசுவிடம் கற்று அவரைப் பின்பற்றுபவரைக் குறிக்கும் நிலையான, பொருத்தமான சொல்.
- source_word: ἐκεῖνος
  choice: அந்த
  rationale: முன்பு குறிப்பிடப்பட்ட ‘இன்னொரு சீடரை’ மீண்டும் சுட்டுகிறது.
- source_word: γνωστὸς
  choice: அறிமுகமானவர்
  rationale: தலைமைக் குரு அந்தச் சீடரை அறிந்திருந்தார் என்ற உறவை இயல்பாகக் குறிக்கிறது; ‘நன்கு அறியப்பட்டவர்’ என்று கூறி நெருக்கத்தின் அளவை மிகைப்படுத்தவில்லை.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: தலைமைக் குரு / தலைமைக் குருவின்
  rationale: இச்சூழலில் ஒருமையிலுள்ள ἀρχιερεύς என்பதற்கான தெளிவான நவீனத் தமிழ் இணை.
- source_word: συνεισῆλθεν
  choice: இயேசுவுடன் ... சென்றார்
  rationale: σύν கொண்ட கூட்டு வினை, இயேசுவோடு சேர்ந்து உள்ளே நுழைந்ததைச் சுட்டுகிறது; ‘முற்றத்திற்குள்’ என்பதுடன் இப்பொருள் முழுமையாக வெளிப்படுகிறது.
- source_word: αὐλήν
  choice: முற்றம்
  rationale: தலைமைக் குருவின் இல்லத்தோடு இணைந்த மூடப்பட்ட வெளிப்புறப் பகுதியைக் குறிக்கிறது; ‘அரண்மனை முற்றம்’ என்று ஆதாரத்தை மீறி விரிவாக்கவில்லை.
theological_decisions:
- issue: ‘இன்னொரு சீடர்’ யார் என்பது
  choice: பெயரிடாமல் ‘இன்னொரு சீடர்’ என்றே வைக்கப்பட்டது
  alternative: யோவான் என்று அடையாளப்படுத்துதல்
  rationale: மூலவசனம் அந்தச் சீடரின் பெயரைச் சொல்லவில்லை; எனவே ஒரு மரபுவழி அடையாளத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்போட்டமும் காக்கப்பட்டுள்ளன. பேதுருவுக்கும் பெயரிடப்படாத சீடருக்கும் ஒரே மரியாதைப் பன்மை வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் வாக்கியம் தொடர்வதால் இறுதியில் முற்றுப்புள்ளி வைக்கப்பட்டாலும் அடுத்த வசனத்தோடு உள்ள கதைத் தொடர்ச்சி பாதிக்கப்படவில்லை.
