revisions:
- from: ஆகவே அவர்கள் மீண்டும் உரக்கக் கத்தி, “இவனை வேண்டாம்; பரபாஸை விடுதலை செய்யும்!” என்றார்கள். பரபாஸ் ஒரு கொள்ளைக்காரன்.[a]
  to: ஆகவே அவர்கள் மீண்டும் கூச்சலிட்டு, “இவனை அல்ல, பரபாஸை!” என்றார்கள். பரபாஸ் ஒரு கொள்ளைக்காரன்.[a]
  rationale: The revision removes the supplied imperative in order to preserve the Greek’s deliberately elliptical contrast, while retaining the contextual implication without making it explicit. It also uses more natural modern Tamil for the crowd’s renewed shout and refines the lexical footnote to state the broader possible range of λῃστής without overdetermining Barabbas’s role.
