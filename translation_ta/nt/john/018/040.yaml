source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: ta
  text: ஆகவே அவர்கள் மீண்டும் கூச்சலிட்டு, “இவனை அல்ல, பரபாஸை!” என்றார்கள். பரபாஸ் ஒரு கொள்ளைக்காரன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழிப்பறிக்காரன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சில சூழல்களில் கொள்ளைக்காரனையோ, வன்முறையில் ஈடுபட்ட கிளர்ச்சியாளரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: உரக்கக் கத்தி
  rationale: வலுவான, உரத்த கூக்குரலைக் குறிக்கும் வினையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் விளைவு அல்லது தொடர்பைச் சுட்டுகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் மறுபடியும் நிகழ்ந்ததை நேரடியாகக் காட்டுகிறது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: கத்தலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்பு வினையின் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: இவனை வேண்டாம்; பரபாஸை விடுதலை செய்யும்
  rationale: τοῦτον என்பதன் சுட்டுப்பொருளை ‘இவனை’ எனக் காக்கிறது; முந்தைய வசனத்தில் பிலாத்து கேட்ட விடுதலை குறித்த கேள்வியால் கிரேக்கத்தில் விடுபட்டுள்ள வினையைத் தமிழில் தெளிவுக்காக நிரப்புகிறது.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: பரபாஸ்
  rationale: தமிழ் வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: ἦν δὲ
  choice: பரபாஸ் ஒரு ...
  rationale: δέ அறிமுகப்படுத்தும் பின்னணித் தகவலைத் தமிழில் தேவையற்ற இணைப்புச்சொல் இன்றி இயல்பாக அளிக்கிறது.
- source_word: λῃστής
  choice: கொள்ளைக்காரன்
  rationale: அடிப்படைப் பொருளான கொள்ளையன் அல்லது வழிப்பறிக்காரன் என்பதை பொதுவாகப் புரியும் தமிழில் தருகிறது; ஆயுதக் குழுவினர் அல்லது வன்முறைக் கிளர்ச்சியாளர் என்றிருக்கக்கூடிய சூழல் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பரபாஸை விவரிக்கும் λῃστής என்பதன் பொருள் நுட்பம்
  choice: கொள்ளைக்காரன்
  alternative: வழிப்பறிக் கொள்ளையன்; ஆயுதக் குழுவைச் சேர்ந்தவன்; வன்முறைக் கிளர்ச்சியாளர்
  rationale: இச்சொல்லின் மையப் பொருள் கொள்ளையன் அல்லது வழிப்பறிக்காரன். முதல் நூற்றாண்டு யூதேயச் சூழலில் அது வன்முறைச் செயல்களில் ஈடுபட்ட ஆயுதக் குழுவினரையும் சில வேளைகளில் குறிக்கலாம்; ஆனால் இந்த வசனம் மட்டும் ‘கிளர்ச்சியாளர்’ என்று உறுதியாகத் தீர்மானிக்கவில்லை. ஆகவே முதன்மை உரை பொதுப் பொருளைக் கொண்டு, விரிந்த பொருள் வரம்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதும். நேரடிப் பேச்சின் வலிமை காக்கப்பட்டுள்ளது. கிரேக்கத்தில் சூழலால் புரிந்துகொள்ளப்படும் ‘விடுதலை செய்யும்’ என்ற கருத்து தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது; λῃστής என்பதன் வரலாற்றுச் சாத்தியம் முதன்மை உரையில் மிகையாக நிர்ணயிக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
