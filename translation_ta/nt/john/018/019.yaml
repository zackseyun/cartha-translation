id: JHN.18.19
reference: John 18:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: ta
  text: ஆகவே தலைமை ஆசாரியர் இயேசுவிடம் அவருடைய சீடர்களைப் பற்றியும் அவருடைய போதனையைப் பற்றியும் விசாரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசுவிடம் கேட்டார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ‘கேட்டார்’ அல்லது ‘விசாரித்தார்’ என இருவகையிலும் பொருள்படலாம்; முறையான விசாரணைச் சூழலை வெளிப்படுத்த இங்கு ‘விசாரித்தார்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளுடன் இவ்வாக்கியத்தை இணைக்கும் தொடர்ச்சி அல்லது விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூதர்களின் பிரதான குருத்துவப் பதவிக்கான வழக்கமான தமிழாக்கம். சூழலில் அன்னா குறிக்கப்படுவதாக இருந்தாலும், மூலத்தில் உள்ள பதவிப் பெயரையே மொழிபெயர்க்கிறது.
- source_word: ἠρώτησεν
  choice: விசாரித்தார்
  rationale: வினைச்சொல் ‘கேட்டார்’ அல்லது ‘விசாரித்தார்’ எனப் பொருள்படலாம்; முறையான விசாரணைச் சூழலை மிகைப்படுத்தாமல் வெளிப்படுத்த ‘விசாரித்தார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: περὶ
  choice: பற்றி
  rationale: கேள்வியின் பொருளைக் குறிக்கும் இச்சொல் இருமுறை வருவதைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: μαθητῶν
  choice: சீடர்கள்
  rationale: ஆசிரியர்–சீடர் உறவைத் துல்லியமாகக் காக்கும், நற்செய்தி நூல்களில் நிலைபெற்ற தமிழ்ச் சொல்.
- source_word: διδαχῆς
  choice: போதனை
  rationale: பிற்காலக் கோட்பாட்டு நுணுக்கங்களைச் சேர்க்காமல், இயேசு கற்பித்தவற்றைக் குறிக்கும் இயல்பான மற்றும் புரிந்துகொள்ளத்தக்க சொல்.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: இரு இடங்களிலும் இயேசுவையே சுட்டுகிறது; மரியாதையான நவீனத் தமிழில் உரிய உடைமை வடிவம்.
theological_decisions:
- issue: சூழலில் ரோமரால் அங்கீகரிக்கப்பட்ட அப்போதைய தலைமைக் குருவான காய்பாவுக்குப் பதிலாக அன்னா இடம்பெறும்போது ἀρχιερεύς என்ற பதவிப் பெயரை எவ்வாறு மொழிபெயர்ப்பது
  choice: மூல கிரேக்கப் பதவிப் பெயரை நேரடியாக ‘தலைமைக் குரு’ என்று மொழிபெயர்த்தல்
  alternative: ‘தலைமைக் குருவான அன்னா’ அல்லது ‘முதன்மைக் குரு’
  rationale: வரலாற்றுச் சூழலை முதன்மை உரைக்குள் இணைத்துச் சமரசப்படுத்தாமல், யோவானின் கதைச் சித்தரிப்பையும் மூலத்தின் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘விசாரித்தார்’ என்பது ‘கேட்டார்’ என்பதைவிட முறையான சூழலை உணர்த்துகிறது; ஆனால் ‘கடுமையாகக் குறுக்குவிசாரணை செய்தார்’ என்ற மிகை அர்த்தத்தைத் தவிர்க்கிறது.
