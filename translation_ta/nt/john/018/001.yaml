translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. நீளமான கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பெயர் ‘கீதரோன்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; χείμαρρος என்பதிலுள்ள உண்மையான நிலவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
