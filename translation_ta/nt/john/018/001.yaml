source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: ta
  text: இவற்றைச் சொன்னபின், இயேசு தம் சீடர்களுடன் வெளியேறி, கீதரோன் நீரோடையைக்[a] கடந்து சென்றார். அங்கே ஒரு தோட்டம் இருந்தது; அவரும் அவருடைய சீடர்களும் அதற்குள் நுழைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கீதரோன் பள்ளத்தாக்கை’ அல்லது ‘கீதரோன் பருவகால ஓடையை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மழைக்காலத்தில் நீர் ஓடும் ஓடை அல்லது அதன் பள்ளத்தாக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: இவற்றைச் சொன்னபின்
  rationale: இறந்தகால வினையெச்சம் நிகழ்வுகளின் வரிசையைத் தெரிவிக்கிறது. இந்தத் தமிழ் வடிவம் சுருக்கமாகவும் இயல்பாகவும் இருந்து, ‘இவற்றைச் சொன்ன பிறகு’ என்ற பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἐξῆλθεν
  choice: வெளியேறி
  rationale: வெளியே செல்லும் உறுதியான அசைவைப் பாதுகாக்கிறது; வெறுமனே ‘புறப்பட்டார்’ என்று பொருளைத் தளர்த்தவில்லை.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களுடன்
  rationale: σύν கூட்டாகச் செல்வதைக் குறிக்கிறது. ‘தம்’ என்பது எழுவாயான இயேசுவையே இயல்பாகச் சுட்டுகிறது.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: கீதரோன் நீரோடையைக் கடந்து
  rationale: πέραν மறுகரைக்குச் செல்லும் அசைவைக் குறிக்கிறது. χείμαρρος பருவகாலத்தில் நீர் ஓடும் ஓடை அல்லது பள்ளத்தாக்கைக் குறிக்கக்கூடும்; வாசிக்க இயல்பான ‘நீரோடை’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ὅπου ἦν κῆπος
  choice: அங்கே ஒரு தோட்டம் இருந்தது
  rationale: κῆπος என்பதன் பொதுவான பொருளான ‘தோட்டம்’ காக்கப்படுகிறது; தமிழில் இயல்பான இருப்புத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: அதற்குள் நுழைந்தார்கள்
  rationale: εἰς குறிக்கும் உள்ள்நோக்கிய அசைவை ‘அதற்குள்’ வெளிப்படையாகக் காக்கிறது.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: அவரும் அவருடைய சீடர்களும்
  rationale: இயேசுவும் சீடர்களும் நுழைந்தனர் என்ற இரு கூறுகளையும் கிரேக்க உரைக்கு ஏற்றவாறு வெளிப்படையாகக் கூறுகிறது; αὐτός என்பதற்கு தேவையற்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
