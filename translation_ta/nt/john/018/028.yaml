source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: ta
  text: ஆகவே, அவர்கள் இயேசுவைக் காய்பாவிடமிருந்து ஆளுநரின் தலைமையகத்துக்கு[a] அழைத்துச் சென்றார்கள். அப்போது அதிகாலையாக இருந்தது. தாங்கள் தீட்டுப்படாமல்[b] பஸ்காவை உண்ணுவதற்காக[c], அவர்களே அந்தத் தலைமையகத்துக்குள் செல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரைத்தோரியம்’; இது ரோம ஆளுநரின் அதிகாரப்பூர்வ இருப்பிடமும் நீதி விசாரணைத் தலைமையகமும் ஆகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘தீட்டுப்படுதல்’ என்பது சடங்குமுறைப்படி தூய்மையற்றவர்களாக ஆவதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘பஸ்காவை உண்ணுதல்’ என்பது குறிப்பாகப் பஸ்கா விருந்தை அல்லது விரிவாகப் பஸ்காக் காலப் பண்டிகை உணவுகள் மற்றும் அனுசரிப்புகளைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: அழைத்துச் சென்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக வழங்குகிறது; காவலில் இயேசுவை ஓரிடத்திலிருந்து மற்றோரிடத்துக்கு நடத்திச் சென்ற சூழலுக்கும் பொருந்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதைத் தொடர்பையும் விளைவையும் தெளிவாகக் காட்டுகிறது.
- source_word: πραιτώριον
  choice: ஆளுநரின் தலைமையகம்
  rationale: ரோம ஆளுநரின் அதிகாரப்பூர்வ இருப்பிடத்தையும் நீதி விசாரணை நடைபெற்ற நிர்வாக மையத்தையும் சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் பொருள்பட மொழிபெயர்க்கிறது.
- source_word: πρωΐ
  choice: அதிகாலை
  rationale: நாளின் தொடக்கப்பகுதியைக் குறிக்கும் சொல்லை இயல்பாக வழங்குகிறது; துல்லியமாக விடியற்காலம் என்று வரையறுப்பதில்லை.
- source_word: αὐτοὶ
  choice: அவர்களே
  rationale: இயேசுவை உள்ளே கொண்டுசென்ற நடவடிக்கைக்கும் அவர்களுடைய சொந்த நுழையாமைக்கும் இடையிலான வலியுறுத்தப்பட்ட வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: μὴ μιανθῶσιν
  choice: தீட்டுப்படாமல்
  rationale: சாதாரண அழுக்கை அல்ல, சடங்குமுறை சார்ந்த தூய்மையின்மையைக் குறிக்கும் சமயப் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: φάγωσιν τὸ πάσχα
  choice: பஸ்காவை உண்ணுவதற்காக
  rationale: பஸ்கா உணவை மட்டுமா அல்லது பண்டிகைக் கால உணவு மற்றும் அனுசரிப்புகளை விரிவாகவா குறிக்கிறது என்ற விவாதத்தை முதன்மை உரையில் தீர்மானிக்காமல், மூலத்தின் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: Καϊάφα
  choice: காய்பா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியின் காலவரிசையில் ‘பஸ்காவை உண்பது’ என்பதன் துல்லியமான பொருள்
  choice: ‘பஸ்காவை உண்ணுதல்’ என்ற விரிவைத் திறந்துவைக்கும் சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘பஸ்கா விருந்து உணவை உண்ணுதல்’ அல்லது ‘பண்டிகைப் பலி உணவுகளை உண்ணுதல்’ என்று குறிப்பாக்குதல்
  rationale: இச்சொற்றொடர் பஸ்கா விருந்தை மட்டும் குறிக்கிறதா, பஸ்காக் காலத்தின் பிற உணவுகள் அல்லது அனுசரிப்புகளையும் குறிக்கிறதா என்பது விவாதத்திற்குரியது. ஆகவே காலவரிசை சார்ந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆளுநரின் தலைமையகம்’ என்பது நிர்வாக மற்றும் நீதித்துறைச் சூழலைத் தெளிவாக்குகிறது; ‘பிரைத்தோரியம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘தீட்டுப்படாமல்’ என்பது சடங்குமுறைப் பொருளைக் கொண்டிருந்தாலும் அதன் விளக்கம் அடிக்குறிப்பில் சேர்க்கப்பட்டுள்ளது.
