  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: ta
  text: அவர்கள் அவரிடம், “நாசரேத்தூர் இயேசுவை” என்று பதிலளித்தார்கள். அவர் அவர்களிடம், “நான்தான்” என்றார். அவரைக் காட்டிக்கொடுத்துக்கொண்டிருந்த யூதாசும் அவர்களோடு நின்றுகொண்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: நாசரேத்தூர் இயேசுவை
  rationale: தேடப்படும் நபரைச் சுட்டும் குற்றுவினை வடிவைத் தமிழில் இயல்பாகப் பேணுகிறது; Ναζωραῖος என்பதைக் குடியூர் அடையாளமாகத் தருகிறது.
- source_word: Ἐγώ εἰμι
  choice: நான்தான்
  rationale: இச்சூழலில் ‘நீங்கள் தேடுவது நானே’ என்ற அடையாளப் பதிலை இயல்பான தமிழில் தருகிறது; மூலத்தின் சுருக்கத்தையும் வலியுறுத்தலையும் பேணுகிறது.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: அவரைக் காட்டிக்கொடுத்துக்கொண்டிருந்த
  rationale: நிகழ்ந்துகொண்டிருக்கும் துரோகச் செயலில் யூதாசின் பங்கை நிகழ்காலத் தன்மையுடன் வெளிப்படுத்துகிறது.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: அவர்களோடு நின்றுகொண்டிருந்தான்
  rationale: யூதாசு எதிரணியினரோடு உடல்ரீதியாக நின்றிருந்ததைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
theological_decisions:
- issue: Ἐγώ εἰμι என்பதன் கிறிஸ்தியல் எதிரொலி
  choice: நான்தான்
  alternative: நான் இருக்கிறேன்
  rationale: இங்கு கேட்கப்பட்ட நபரின் அடையாளத்தை உறுதிப்படுத்துவதே நேரடி உரையாடல் பொருள். அதே நேரத்தில் வலியுறுத்தப்பட்ட ‘நான்’ என்ற தன்மையை ‘தான்’ பேணுகிறது; தெய்வீகப் பெயரைக் குறித்த ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. இயேசுவைக் குறிக்க மரியாதைப் பன்மையும், யூதாசைக் குறிக்க ஒருமையும் பயன்படுத்தப்பட்டுள்ளன.
