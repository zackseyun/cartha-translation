source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: ta
  text: எனவே அவர் மீண்டும் அவர்களிடம், “யாரைத் தேடுகிறீர்கள்?” என்று கேட்டார். அதற்கு அவர்கள், “நாசரேனாகிய இயேசுவை[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாசரேத்தைச் சேர்ந்த இயேசுவை.” கிரேக்க மொழியில், “நாசரேனாகிய இயேசுவை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு கேட்ட கேள்வி திரும்பக் கேட்கப்படுவதை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் விளைவு அல்லது தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπηρώτησεν αὐτούς
  choice: அவர் மீண்டும் அவர்களிடம் ... என்று கேட்டார்
  rationale: ἐπερωτάω இங்கு நேரடியாகக் கேள்வி கேட்பதைக் குறிக்கிறது; αὐτούς என்பதன் உறவைத் தமிழில் இயல்பாக ‘அவர்களிடம்’ என்று வழங்குகிறது.
- source_word: Τίνα ζητεῖτε
  choice: யாரைத் தேடுகிறீர்கள்?
  rationale: Τίνα என்பதன் செயப்படுபொருள் நிலையை ‘யாரை’ துல்லியமாகக் காட்டுகிறது; நிகழ்கால ζητεῖτε என்பதற்கு ‘தேடுகிறீர்கள்’ இயல்பான இணை.
- source_word: οἱ δὲ εἶπαν
  choice: அதற்கு அவர்கள் ... என்றார்கள்
  rationale: δέ குறிக்கும் உரையாடல் முன்னேற்றத்தையும் பதிலின் தொடர்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: நாசரேனாகிய இயேசுவை
  rationale: Ναζωραῖος என்ற அடைமொழி வடிவத்தைப் பாதுகாத்து, Ἰησοῦν என்பதன் செயப்படுபொருள் நிலையைத் தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: Ναζωραῖος என்பதை இயேசுவுக்கான அடைமொழியாக மொழிபெயர்த்தல்
  choice: நாசரேனாகிய இயேசு
  alternative: நாசரேத்தைச் சேர்ந்த இயேசு
  rationale: இது முதன்மையாக இடத்தோடு தொடர்புடைய வரலாற்று அடையாளம்; தனிப்பட்ட கோட்பாட்டுப் பொருளைச் சேர்க்காமல் கிரேக்க அடைமொழி வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது. தமிழில் பொதுவாகப் புரியும் இடத்தொடர்பான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்பும் கேள்வி–பதில் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
