language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “என் ராஜ்யம் இந்த உலகத்திலிருந்து வந்ததல்ல. என் ராஜ்யம் இந்த உலகத்திலிருந்து வந்திருந்தால், நான் யூதர்களிடம்[a] ஒப்படைக்கப்படாமல் இருக்கும்படி எனக்குச் சேவை செய்பவர்கள் போராடிக்கொண்டிருப்பார்கள். ஆனால் உண்மையில், என் ராஜ்யம் இங்கிருந்து வந்ததல்ல.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களிடம்”; இங்கே குறிப்பாக யூதேய அதிகாரிகளைக் குறிக்கக்கூடும்.
    reason: Ἰουδαῖοι என்பது பொதுவாக யூதர்களைக் குறிக்கலாம்; யோவானின் இச்சூழலில் யூதேயர்களை, குறிப்பாக யூதேய அதிகாரிகளை, குறிக்கும் சாத்தியமும் உள்ளது.
lexical_decisions:
- source_word: βασιλεία
  choice: ராஜ்யம்
  rationale: இச்சொல் அரசரின் ஆட்சியையும் அவரது ஆளுகைக்குரிய களத்தையும் குறிக்கக்கூடிய கிரேக்கச் சொல்லின் இருபொருள் வாய்ப்பையும் தமிழில் ஓரளவு தக்கவைக்கிறது; இச்சூழலில் இயல்பாகவும் நிலைபெற்றும் உள்ளது.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: இந்த உலகத்திலிருந்து வந்தது
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தைத் தெளிவாக வெளிப்படுத்துகிறது; ராஜ்யம் உலகத்தில் இல்லை என்று கூறாமல், அது இந்த உலக ஒழுங்கிலிருந்து தோன்றியது அல்ல என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவானின் பயன்பாட்டில் கடவுளுக்கு எதிரான தற்போதைய மனித ஒழுங்கு என்ற நிழற்பொருள் இருக்கக்கூடும்; அதை விளக்கமாகச் சேர்க்காமல் நேரடியான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: ὑπηρέται
  choice: பணியாளர்கள்
  rationale: அதிகாரத்திற்குக் கீழ் சேவை செய்பவர்களைக் குறிக்கிறது; காவல் அதிகாரிகள் என்ற அளவுக்கு பொருளைக் குறுக்காமல், ராஜ்யச் சூழலுக்கும் பொருந்துகிறது.
- source_word: ἠγωνίζοντο ἄν
  choice: போராடிக்கொண்டிருப்பார்கள்
  rationale: உண்மைக்கு மாறான நிபந்தனையில் நிகழ்ந்துகொண்டிருக்கும் போராட்டத்தை imperfect மற்றும் ἄν வெளிப்படுத்துவதால், தொடர்நிலைத் தன்மையை இவ்வடிவம் காக்கிறது.
- source_word: ἵνα μὴ παραδοθῶ
  choice: நான் … ஒப்படைக்கப்படாமல் இருக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα அமைப்பையும், ஒருவரை பிறரது கட்டுப்பாட்டில் ஒப்படைக்கும் παραδίδωμι என்பதன் நீதிமுறைச் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களிடம்
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருளை முதன்மை உரையில் வைத்திருக்கிறது; சூழலில் யூதேயர்களையோ யூதத் தலைமை அதிகாரிகளையோ குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: νῦν δὲ
  choice: ஆனால் உண்மையில்
  rationale: முன்னுள்ள உண்மைக்கு மாறான நிபந்தனைக்கும் தற்போதைய மெய்நிலைக்கும் இடையிலான முரணைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐντεῦθεν
  choice: இங்கிருந்து வந்தது
  rationale: ‘இங்கிருந்து’ என்ற சுட்டிட வினையடையின் வடிவத்தைத் தக்கவைத்து, முன் வந்த ‘இந்த உலகத்திலிருந்து’ என்பதோடு தொடர்பை வெளிப்படுத்துகிறது; ‘வந்தது’ தமிழில் மூலத்தைக் குறிக்கும் கருத்தை இயல்பாக்குகிறது.
theological_decisions:
- issue: இயேசுவின் ராஜ்யத்துக்கும் உலகத்துக்கும் உள்ள உறவு
  choice: “இந்த உலகத்திலிருந்து வந்தது அல்ல” என்று மூலத்தையோ தோற்றத்தையோ குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: “இந்த உலகத்துக்குரியது அல்ல” அல்லது “இந்த உலகத்தின் ஒரு பகுதி அல்ல”
  rationale: இயேசுவின் ராஜ்யம் உலகில் செயல்படுவதை வசனம் மறுக்கவில்லை; அதன் மூலமும் இயல்பும் உலக ஒழுங்கிலிருந்து வருவதில்லை என்பதையே முன்னிறுத்துகிறது. இதனால் உரையிலுள்ள இறையியல் இழுபறி தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
- issue: யோவானில் Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “யூதர்கள்”; சூழலுக்குரிய குறுகிய பொருள் அடிக்குறிப்பில்.
  alternative: “யூதேயர்கள்” அல்லது “யூதத் தலைமை அதிகாரிகள்”
  rationale: சொல்லின் பொதுவான இன-மதப் பொருளை மறைக்காமலும், இச்சூழலில் அது குறுகிய அதிகாரக் குழுவைக் குறிக்கக்கூடிய சாத்தியத்தைப் புறக்கணிக்காமலும் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. “ராஜ்யம்” என்ற நிலைபெற்ற சொல் ஆட்சி மற்றும் ஆளுகைக் களம் ஆகிய இரு நிழற்பொருள்களையும் காக்கிறது. கிரேக்கத்தில் மூலத்தைக் குறிக்கும் ἐκ இரண்டு இடங்களிலும் தமிழில் “-லிருந்து வந்தது” எனத் தெளிவாக்கப்பட்டுள்ளது.
