revisions:
- from: 'இயேசு பதிலளித்தார்: “என் ராஜ்யம் இந்த உலகத்திலிருந்து வந்தது அல்ல. என் ராஜ்யம் இந்த உலகத்திலிருந்து வந்ததாக இருந்தால், நான் யூதர்களிடம்[a] ஒப்படைக்கப்படாமல் இருக்கும்படி என் பணியாளர்கள் போராடிக்கொண்டிருப்பார்கள். ஆனால் உண்மையில், என் ராஜ்யம் இங்கிருந்து வந்தது அல்ல.”'
  to: 'இயேசு பதிலளித்தார்: “என் ராஜ்யம் இந்த உலகத்திலிருந்து வந்ததல்ல. என் ராஜ்யம் இந்த உலகத்திலிருந்து வந்திருந்தால், நான் யூதர்களிடம்[a] ஒப்படைக்கப்படாமல் இருக்கும்படி எனக்குச் சேவை செய்பவர்கள் போராடிக்கொண்டிருப்பார்கள். ஆனால் உண்மையில், என் ராஜ்யம் இங்கிருந்து வந்ததல்ல.”'
  rationale: திருத்தம் கிரேக்கத்தின் உண்மைக்கு மாறான நிபந்தனை (ἦν … ἠγωνίζοντο ἄν) மற்றும் ὑπηρέται என்பதன் அரசவை/சேவைச் சூழலை நவீன நிலையான தமிழில் இயல்பாக வெளிப்படுத்துகிறது. “இந்த உலகத்திலிருந்து” மற்றும் இறுதியிலுள்ள “இங்கிருந்து” என்ற வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. Ἰουδαῖοι பற்றிய அடிக்குறிப்பு மாற்றுவாய்ப்பைக் காக்கிறது; ஆனால் குறிப்பிட்ட வரலாற்று அதிகாரக் குழுவை உறுதியாகத் திணிக்கவில்லை.
