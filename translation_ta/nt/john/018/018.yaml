base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: ta
  text: அடிமைகளும்[a] அலுவலர்களும்[b] குளிர் இருந்ததால் கரித்தீயை மூட்டி, நின்றுகொண்டு குளிர்காய்ந்துகொண்டிருந்தார்கள். பேதுருவும் அவர்களோடு நின்றுகொண்டு குளிர்காய்ந்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளர்கள்.” இங்கு கிரேக்கச் சொல் வீட்டாருக்குக் கீழ்ப்பட்ட பிணைப்புநிலையிலிருந்தவர்களைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “காவலர்கள்.” இச்சொல் அதிகாரப்பூர்வ அலுவல் உதவியாளர்களைக் குறிக்கலாம்; இச்சூழலில் அவர்கள் காவல் பணியிலும் ஈடுபட்டிருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: இச்சொல் வீட்டாருக்குக் கீழ்ப்பட்ட பிணைப்புநிலையிலிருந்த பணியாளர்களைக் குறிக்கக்கூடும். அவர்களுடைய சமூக நிலையை மறைக்காமல் இருக்க ‘அடிமைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὑπηρέται
  choice: காவலர்கள்
  rationale: யோவான் நற்செய்தியில் இச்சொல் பொதுவாக அதிகார அமைப்புடன் தொடர்புடைய, கட்டளைகளை நிறைவேற்றும் பணியாளர்களைக் குறிக்கிறது. இச்சூழலில் ‘காவலர்கள்’ அவர்களுடைய பணியை இயல்பாக வெளிப்படுத்துகிறது; எனினும் கிரேக்கச் சொல் இதைவிடப் பரந்த பொருளும் கொள்ளலாம்.
- source_word: ἀνθρακιὰν
  choice: கரித்தீ
  rationale: விறகுத்தீ அல்ல, கரியால் எரிக்கப்பட்ட தீ என்ற குறிப்பிட்ட காட்சிவிவரத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: πεποιηκότες
  choice: மூட்டி
  rationale: தீயை ஏற்கெனவே ஏற்படுத்தி வைத்ததன் தற்போதைய விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ὅτι ψῦχος ἦν
  choice: குளிராக இருந்ததால்
  rationale: தீ மூட்டியதற்கும் குளிர்காய்ந்ததற்கும் கொடுக்கப்பட்ட காரணத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἐθερμαίνοντο
  choice: குளிர்காய்ந்துகொண்டிருந்தார்கள்
  rationale: நீடித்துக்கொண்டிருந்த செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: பேதுருவும் அவர்களோடு
  rationale: καί என்பதன் சேர்க்கைப் பொருளை ‘உம்’ காக்கிறது; பேதுரு அதே கூட்டத்தோடு இருந்ததையும் தெளிவுபடுத்துகிறது.
- source_word: ἑστὼς
  choice: நின்று
  rationale: பேதுருவின் உடல்நிலையை நேரடியாகக் காட்டி, தமிழில் தொடர்ச்சியான வினையமைப்போடு இயல்பாக இணைகிறது.
- source_word: θερμαινόμενος
  choice: குளிர்காய்ந்துகொண்டிருந்தான்
  rationale: பேதுருவின் தொடர்ந்த செயலை முன்னைய குழுவின் செயலோடு இணையாகக் காக்கிறது.
- source_word: δέ
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான உரைத்தொடர்பு இணைப்பாக மட்டுமே செயல்படுகிறது. தமிழில் தனியாக ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ சேர்ப்பது மூலத்தில் இல்லாத கால அல்லது முரண்பாட்டு வலிமையை உருவாக்கும்.
