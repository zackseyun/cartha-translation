translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையைக் கடைப்பிடிக்கிறது. குழுவினரும் பேதுருவும் ‘நின்று குளிர்காய்ந்த’ இணையான காட்சியை மீளுரைப்பதன் மூலம் மூலத்தின் கட்டமைப்பு காக்கப்பட்டுள்ளது. ‘கரித்தீ’ என்ற சொல் யோவானின் குறிப்பிட்ட காட்சிவிவரத்தைத் தக்கவைக்கிறது.
