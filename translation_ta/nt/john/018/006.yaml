id: JHN.18.6
reference: John 18:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: ta
  text: ஆகவே, “நான்தான்”[a] என்று அவர் அவர்களிடம் சொன்னபோது, அவர்கள் பின்னோக்கிச் சென்று தரையில் விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்படியாக, “நான் இருக்கிறேன்.” இந்தக் கிரேக்கச் சொற்றொடர், யோவான் நற்செய்தியிலுள்ள தனித்துவமான ‘நான் இருக்கிறேன்’ கூற்றுகளையும் எதிரொலிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: ஆகவே, …போது
  rationale: οὖν என்பதன் தொடர்ச்சியையும் ὡς என்பதன் காலப்பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் சொன்னபோது
  rationale: λέγω மற்றும் αὐτοῖς ஆகியவற்றின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Ἐγώ εἰμι
  choice: நான்தான்
  rationale: தேடப்படுகிற நபர் தாமே என்று இயேசு அடையாளப்படுத்தும் உடனடிச் சூழலைத் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் கிரேக்கத்தின் சொற்படியான வடிவமும் யோவானில் அதன் சாத்தியமான எதிரொலியும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: பின்னோக்கிச் சென்று
  rationale: பின்திசையில் நகர்ந்ததை நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; காரணம் அல்லது உளவியல் எதிர்வினையை உரையில் சேர்க்கவில்லை.
- source_word: ἔπεσαν χαμαί
  choice: தரையில் விழுந்தார்கள்
  rationale: χαμαί குறிக்கும் தரையை நோக்கிய உடல் வீழ்ச்சியை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் சாத்தியமான ஆழ்ந்த எதிரொலியைக் கொண்ட Ἐγώ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: நான்தான்
  alternative: நான் இருக்கிறேன்
  rationale: உடனடி உரையாடல் சூழலில் இது தம்மை அடையாளப்படுத்தும் பதிலாகச் செயல்படுவதால் முதன்மை உரையில் இயல்பான தமிழான “நான்தான்” பயன்படுத்தப்படுகிறது. ஆனால், சொற்படியான “நான் இருக்கிறேன்” என்பதும் யோவானின் தனித்துவமான ‘நான் இருக்கிறேன்’ கூற்றுகளோடு இருக்கக்கூடிய எதிரொலியும் அடிக்குறிப்பில் வைக்கப்பட்டு theological tension பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், இயல்பான, கண்ணியமான நடை. “பின்னோக்கிச் சென்று” என்பது மூலத்தின் இயக்கத்தைக் காக்கிறது; “பின்வாங்கி” எனும் நோக்கவிளக்கத்தைத் தவிர்க்கிறது. அடிக்குறி அது விளக்கும் கூற்றுக்குப் பின் அல்லாமல் ஆங்கில ஆலோசனை உரையின் அமைப்பைப் பின்பற்றி சொல்லும் வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
