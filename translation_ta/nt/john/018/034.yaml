id: JHN.18.34
reference: John 18:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “இதை நீங்களாகவே சொல்கிறீர்களா[a], அல்லது மற்றவர்கள் என்னைப் பற்றி உங்களிடம் சொன்னார்களா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “உங்களிடமிருந்தே.” பிலாத்துவின் கூற்று அவரிடமிருந்தே தோன்றியதா என்பதே கேள்வி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: கேள்விக்குப் பதிலுரைப்பதைக் குறிக்கும் வழக்கமான கதைநடை வினைச்சொல்; நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: Ἀπὸ σεαυτοῦ
  choice: நீங்களாகவே
  rationale: பிலாத்துவின் கூற்று அவரிடமிருந்தே தோன்றியதா என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது. மூலத்தின் ‘உங்களிடமிருந்து’ என்ற தோற்றுவாய் சார்ந்த பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: σὺ
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை ‘நீங்களாகவே’ என்ற அமைப்பு தக்கவைக்கிறது; பிலாத்துவிடம் பேசுவதற்கு ஏற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῦτο λέγεις
  choice: இதை ... சொல்கிறீர்களா
  rationale: முந்தைய கேள்வியைச் சுட்டும் τοῦτο என்பதற்கு ‘இதை’ என்றும், நேரடி உரையாடலிலுள்ள நிகழ்கால λέγεις என்பதற்கு இயல்பான ‘சொல்கிறீர்களா’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἄλλοι εἶπόν σοι
  choice: மற்றவர்கள் ... உங்களிடம் சொன்னார்களா
  rationale: ἄλλοι என்பதன் பொதுவான ‘மற்றவர்கள்’ என்ற பொருளையும், இறந்தகாலச் செயலைக் குறிக்கும் εἶπον என்பதையும் தெளிவாகத் தருகிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைப் பற்றி
  rationale: περί உடன் வரும் பிறப்புவேற்றுமையின் ‘என்னைப் பற்றியதாக’ என்ற பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் கேள்வி பிலாத்துவின் கூற்றின் தோற்றுவாயைக் குறிக்கிறதா அல்லது அவனுடைய நோக்கத்தை விளக்குகிறதா
  choice: பிலாத்து இதைத் தானாகச் சொல்கிறாரா, அல்லது பிறரிடமிருந்து கேட்டுச் சொல்கிறாரா என்ற இரு வாய்ப்புகளையும் மட்டும் வெளிப்படுத்துதல்
  alternative: “உங்கள் சொந்த முன்முயற்சியால் இதைக் கேட்கிறீர்களா?” என்று நோக்கத்தை விரிவாக விளக்குதல்
  rationale: கிரேக்க வாசகம் கூற்று எங்கிருந்து வந்தது என்பதிலேயே கவனம் செலுத்துகிறது; பிலாத்துவின் உள்நோக்கத்தையோ விரிவான இறையியல் விளக்கத்தையோ உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. பிலாத்துவை நோக்கிய இரண்டாம் நபருக்கு மரியாதைப் பன்மையான ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது; பழமையான ‘நீர்’ தவிர்க்கப்பட்டுள்ளது.
