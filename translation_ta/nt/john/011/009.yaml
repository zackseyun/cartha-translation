source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “பகலில் பன்னிரண்டு மணிநேரங்கள் இருக்கின்றன அல்லவா? ஒருவர் பகலில் நடந்தால், அவர் இடறுவதில்லை; ஏனெனில் அவர் இந்த உலகத்தின் ஒளியைக் காண்கிறார்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த உலகத்தின் ஒளி” என்ற சொற்றொடர் உடனடியாகப் பகல்வெளியின் படிமத்துடன் தொடர்புடையது; யோவான் நூலில் ஒளி பற்றிய பரந்த இறையியல் எதிரொலியும் இதில் இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: மறுமொழியாக ... என்றார்
  rationale: கதைநடையில் இயல்பான தமிழை வழங்குவதோடு, இயேசு முந்தைய பேச்சுக்குப் பதிலளிக்கிறார் என்பதையும் காக்கிறது.
- source_word: Οὐχὶ
  choice: இருக்கின்றன அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் சொல்லாட்சிச் சக்தியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: பகலுக்குப் பன்னிரண்டு மணிநேரங்கள் இருக்கின்றன
  rationale: இங்கு ἡμέρα என்பது இருபத்துநான்கு மணி நாளை அல்ல, வெளிச்சமுள்ள பகற்பொழுதைக் குறிக்கிறது; பன்னிரண்டு பகுதிகளாகப் பிரிக்கப்பட்ட கால அளவையும் தெளிவாகக் காக்கிறது.
- source_word: ἐάν τις περιπατῇ
  choice: ஒருவர் ... நடந்தால்
  rationale: τις என்பதன் பொதுவான, பிரதிநிதித்துவ ஒருமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: பகலில்
  rationale: முதல் வாக்கியத்திலுள்ள பகற்பொழுதோடு இணைப்பைக் காத்து, தமிழில் இயல்பாக உள்ளது.
- source_word: προσκόπτει
  choice: இடறுவதில்லை
  rationale: நடக்கும்போது தடையில் மோதி இடறும் நேரடிப் படிமத்தையும் அதன் விரிவான உருவகச் சாத்தியத்தையும் காக்கிறது.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: அடிப்படைச் சொற்பொருளைத் தருகிறது; யோவான் நூலின் இறையியல் எதிரொலியை மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்கிவிடாமல் விடுகிறது.
- source_word: τοῦ κόσμου τούτου
  choice: இவ்வுலகத்தின்
  rationale: τούτου என்பதன் சுட்டுப் பொருளைக் காத்து, இயல்பான தமிழில் genitive உறவை வெளிப்படுத்துகிறது.
- source_word: βλέπει
  choice: காண்கிறார்
  rationale: நிகழ்கால வினையின் நேரடிப் பொருளைக் காக்கிறது; ‘காண முடிகிறது’ போன்ற விளக்க விரிவைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘இவ்வுலகத்தின் ஒளி’ என்பதன் யோவானிய அடையாளப் பொருள்
  choice: முதன்மை உரையில் சாதாரணப் படிமத்தை அப்படியே வைத்துப் பரந்த இறையியல் எதிரொலியை அடிக்குறிப்பில் மட்டும் சுட்டிக்காட்டுதல்
  alternative: அதை இயேசு அல்லது தெய்வீக வழிகாட்டுதலை நேரடியாகக் குறிக்கும் விதத்தில் வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழலில் இது பகலில் பாதுகாப்பாக நடப்பதைக் கூறும் பழமொழி போன்ற படிமமாகச் செயல்படுகிறது; அதேவேளையில் யோவான் நூலில் ‘ஒளி’ ஆழமான இறையியல் எதிரொலியைக் கொண்டிருக்கலாம். உரை தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்காமல் காக்கிறது.
- issue: τις ... βλέπει என்பதிலுள்ள பொதுவான ஒருமை
  choice: ‘ஒருவர் ... அவர்’ என்ற பிரதிநிதித்துவ ஒருமை
  alternative: பன்மை அல்லது பாலினக் குறியீடற்ற வேறு கட்டமைப்பு
  rationale: கிரேக்கத்தின் ஒருமை அமைப்பைத் தமிழின் இயல்பான பொதுமைச் சொல்லாட்சியால் காக்கிறது; தேவையற்ற ஆண்பால் குறியீட்டைத் தமிழில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட உரை. ‘மறுமொழியாக ... என்றார்’ என்பது தமிழ் கதைநடைக்கேற்ற சொல் வரிசை; ‘பகல்’, ‘இடறு’, ‘ஒளி’ ஆகியவை நேரடிப் படிமத்தையும் சாத்தியமான உருவகப் பொருளையும் ஒருங்கே காக்கின்றன. மூலத்தின் பொதுவான ஒருமை ‘ஒருவர் ... அவர்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
