  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: ta
  text: இயேசு அவளிடம், “நீ நம்பினால் கடவுளுடைய மகிமையைக் காண்பாய் என்று நான் உன்னிடம் சொல்லவில்லையா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: சூழலில் இது மார்த்தாளைக் குறிக்கும் மறைமுகச் செயப்படுபொருள்; ‘அவளிடம்’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: Οὐκ εἶπόν σοι
  choice: நான் உன்னிடம் சொல்லவில்லையா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் கிரேக்க வினாவைத் தமிழ் எதிர்மறை வினாவாக நேர்த்தியாகப் பாதுகாக்கிறது.
- source_word: ἐὰν πιστεύσῃς
  choice: நீ நம்பினால்
  rationale: πιστεύω என்பதன் யோவான் நற்செய்தி முழுவதுமான வினைச்சொல் தொடர்பை ‘நம்பு’ பாதுகாக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ὄψῃ
  choice: காண்பாய்
  rationale: ὁράω என்பதன் எதிர்கால வடிவத்தை இயல்பான ஒருமை முன்னிலை எதிர்காலமாக வழங்குகிறது.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: கடவுளுடைய மகிமையை
  rationale: δόξα என்பதற்கு நிலைபெற்ற இறையியல் நிறைவுள்ள ‘மகிமை’ பயன்படுத்தப்பட்டுள்ளது; τοῦ θεοῦ என்பதன் உரிமை/தொடர்பு பொருளை ‘கடவுளுடைய’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நம்பிக்கைக்கும் கடவுளுடைய மகிமையைக் காண்பதற்கும் உள்ள தொடர்பு
  choice: இயேசு மார்த்தாளிடம் கூறும் நிபந்தனை வாக்குறுதியாக உள்ளபடியே மொழிபெயர்க்கப்பட்டது.
  alternative: இதை எல்லாக் காலங்களுக்கும் பொருந்தும் அற்புதக் கொள்கையாகவோ, லாசருவை உயிர்த்தெழுப்பும் நிகழ்வுக்கு மட்டும் உரியதாகவோ விளக்குதல்.
  rationale: மூலவசனம் இதன் விரிவான இறையியல் எல்லையைத் தீர்மானிக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அந்தத் திறந்த நிலையையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் அதேவேளை கண்ணியமான வேதாகம நடையுடனும் அமைக்கப்பட்டது. ‘நீர்/உம்மிடம்’ என்ற உயர்நடை வடிவங்களுக்குப் பதிலாக, ஒருமை உரையாடலைத் தெளிவாகக் காட்டும் ‘நீ/உன்னிடம்’ பயன்படுத்தப்பட்டது.
