id: JHN.11.17
reference: John 11:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ta
  text: ஆகவே, இயேசு வந்து சேர்ந்தபோது, லாசரு ஏற்கெனவே நான்கு நாட்களாகக் கல்லறையில் இருந்ததைத் தெரிந்துகொண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: வந்து சேர்ந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முன்னதாக நிகழ்ந்த வருகையைச் சுட்டுகிறது; நவீனத் தமிழில் கால உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளுடன் இவ்வசனத்தை இணைக்கும் உரையாடல் தொடுப்பைத் தக்கவைக்கிறது; இங்கு கடுமையான தர்க்க முடிவைக் காட்டாமல் தொடர்ச்சியையும் உணர்த்துகிறது.
- source_word: εὗρεν
  choice: அறிந்தார்
  rationale: இங்கு வந்தபின் ஒரு நிலைமையைத் தெரிந்துகொண்டார் என்பதே பொருள்; தமிழில் ‘கண்டார்’ என்பது நேரடியாக லாசருவைக் கண்டதாகத் தவறாகப் புரியக்கூடும்.
- source_word: αὐτὸν
  choice: லாசரு
  rationale: கிரேக்கப் பிரதிப்பெயரின் குறிப்பு முந்தைய சூழலில் தெளிவாக இருப்பதால், தமிழிலும் குழப்பம் தவிர்க்க பெயர் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: ஏற்கெனவே நான்கு நாட்களாக ... இருந்ததை
  rationale: ‘ஏற்கெனவே நான்கு நாட்கள் கொண்டிருந்தான்’ என்ற சொற்சொல் அமைப்பின் காலநீட்சி பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ μνημείῳ
  choice: கல்லறையில்
  rationale: μνημεῖον இச்சூழலில் உடல் வைக்கப்பட்ட அடக்க இடத்தைக் குறிக்கிறது; ‘கல்லறை’ என்பது துல்லியமான, வழக்கமான தமிழ் சொல்.
theological_decisions:
- issue: αὐτόν என்பதன் குறிப்பு
  choice: பிரதிப்பெயருக்குப் பதிலாக ‘லாசரு’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: ‘அவர் அவனை... கண்டார்/அறிந்தார்’ என்று பிரதிப்பெயரைத் தக்கவைத்தல்
  rationale: இது கொள்கை சார்ந்த தீர்மானம் அல்ல; முந்தைய சூழலில் தெளிவாக உள்ள குறிப்பைத் தமிழில் குழப்பமின்றி தெரிவிக்கும் மொழிபெயர்ப்பு முடிவு.
- issue: εὗρεν என்பதன் உணர்வு
  choice: ‘அறிந்தார்’
  alternative: ‘கண்டார்’
  rationale: இயேசு வந்தபோது லாசரு கல்லறையில் நான்கு நாட்களாக இருந்த நிலையைத் தெரிந்துகொண்டார் என்பதே கட்டமைப்பின் பொருள்; ‘அறிந்தார்’ என்பது இயேசுவின் அறிவைப் பற்றிய கூடுதல் கோட்பாட்டுத் தீர்ப்பை விதிக்காமல், நிகழ்வில் கிடைத்த தகவலைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. கிரேக்கத்தின் காலநீட்சி மற்றும் ‘ஏற்கெனவே’ என்ற வலியுறுத்தல் தக்கவைக்கப்பட்டுள்ளன.
