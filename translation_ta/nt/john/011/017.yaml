revisions:
- from: ஆகவே, இயேசு வந்து சேர்ந்தபோது, லாசரு ஏற்கெனவே நான்கு நாட்களாகக் கல்லறையில் இருந்ததை அறிந்தார்.
  to: ஆகவே, இயேசு வந்து சேர்ந்தபோது, லாசரு ஏற்கெனவே நான்கு நாட்களாகக் கல்லறையில் இருந்ததைத் தெரிந்துகொண்டார்.
  rationale: The revision changes only the rendering of εὗρεν, from a general ‘knew’ to ‘came to know/discovered,’ preserving the Greek narrative sense and natural Tamil usage. No footnote is needed because the explicit naming of Lazarus is a clear contextual clarification rather than a textual variant or unresolved ambiguity.
  reviewer_model: gpt-5.6-terra
