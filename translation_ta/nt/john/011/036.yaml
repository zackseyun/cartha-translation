base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: ta
  text: ஆகவே, யூதர்கள்[a], “பாருங்கள், அவர் அவரை எவ்வளவு நேசித்தார்!” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்கள்.” இங்கு அங்கிருந்த யூதப் பார்வையாளர்களைக் குறிப்பாகப் பிராந்திய அடிப்படையில் சுட்டுவதாக எடுத்துக்கொண்டால் இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம், காட்சியில் அவர்கள் தொடர்ந்து அல்லது பலர் இவ்வாறு கூறியதைக் காட்டும் கிரேக்க imperfect கூறை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் இயேசு கண்ணீர் விட்டதைக் கண்ட பின் எழுந்த இந்தக் கூற்றை இயல்பான கதைத் தொடர்ச்சியாக இணைக்கிறது; இங்கு கடுமையான தர்க்க முடிவைக் குறிக்கும் ‘ஆகையால்’ என்பதைவிடப் பொருத்தமானது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: யோவான் நூலில் வரும் வழக்கமான பெயரிடலை நேரடியாகத் தக்கவைக்கிறது. உடனடிச் சூழலில் இது அங்கிருந்த யூதத் துக்கம் விசாரிப்பவர்களையும் பார்வையாளர்களையும் குறிக்கிறது.
- source_word: Ἴδε
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் கட்டளைச்சொல்லை இயல்பான, மரியாதைப் பன்மை வடிவிலான தமிழ் நேர்பேச்சாக வழங்குகிறது.
- source_word: πῶς
  choice: எவ்வளவு
  rationale: இங்கு இயேசுவின் அன்பின் தீவிரத்தை வியந்து கூறுவது தமிழில் இயல்பாக வெளிப்படுகிறது; கிரேக்கச் சொல்லில் முறை அல்லது அளவு இரண்டும் சாத்தியமானாலும், சூழல் அளவுக்கான வியப்பை முன்னிறுத்துகிறது.
- source_word: ἐφίλει
  choice: அன்பு வைத்திருந்தார்
  rationale: லாசருவின்மேல் இருந்த தனிப்பட்ட பாசத்தை இயல்பாக வெளிப்படுத்துவதோடு, imperfect வடிவின் கடந்தகாலத் தொடர்நிலையையும் தமிழில் உணர்த்துகிறது.
- source_word: αὐτόν
  choice: இவன்மேல்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர் லாசருவைக் குறிக்கிறது; ‘அன்பு வை’ என்ற தமிழ் தொடருடன் இயல்பாக வரும் வேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யோவான் நூலில் οἱ Ἰουδαῖοι என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: மூலத்தின் பொதுவான இன/மத அடையாளச் சொல்லை முதன்மை உரை வெளிப்படையாகத் தக்கவைக்கிறது. அதேவேளை, இவ்வசனத்தின் உடனடிக் குறிப்பு எல்லா யூதர்களையும் அல்ல, அங்கிருந்த குறிப்பிட்ட யூதப் பார்வையாளர்களையே சார்ந்தது; பிராந்தியப் பொருளாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேர்பேச்சு நடை. ‘சொல்லிக்கொண்டிருந்தார்கள்’ மற்றும் ‘அன்பு வைத்திருந்தார்’ ஆகியவை கிரேக்க imperfect கூறுகளை அளவுக்கு மீறாமல் வெளிப்படுத்துகின்றன.
