id: JHN.11.8
reference: John 11:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: ta
  text: சீடர்கள் அவரிடம், “ரபீ, இப்போதுதானே யூதர்கள்[a] உங்களைக் கல்லெறிய முயன்றார்கள்; நீங்கள் மறுபடியும் அங்கே போகிறீர்களா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யூதேயாவைச் சேர்ந்தவர்கள்”; சூழல்படி, “யூதத் தலைவர்கள்.” யோவான் பல இடங்களில் “யூதர்கள்” என்ற சொல்லை யூத மக்கள் அனைவரையும் குறிக்காமல், யூதேயாவில் இயேசுவை எதிர்த்தவர்களைக் குறிக்கப் பயன்படுத்துகிறார்.
    reason: மூலச்சொல்லான οἱ Ἰουδαῖοι என்பதன் சாத்தியமான இடவியல் அல்லது சூழல்சார் குறுகிய குறிப்பைத் தெளிவுபடுத்தும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: λέγουσιν
  choice: என்று கேட்டார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலத்தில் தருகிறது; கேள்வி உரையை அறிமுகப்படுத்தும் சூழலில் ‘கேட்டார்கள்’ இயல்பாக உள்ளது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: கிரேக்கத்தில் ஒலிபெயர்க்கப்பட்ட செமித்திய அழைப்புப் பட்டத்தைத் தமிழிலும் ஒலிபெயர்த்து, யோவானின் நடை மற்றும் சீடர்களின் அழைப்புமுறையைப் பாதுகாக்கிறது.
- source_word: νῦν
  choice: இப்போதுதானே
  rationale: வெறும் நிகழ்காலத்தைக் காட்டாமல், அச்சுறுத்தல் மிக அண்மையில் நடந்ததை வலியுறுத்துகிறது; தமிழ் கேள்விநடையில் ‘-தானே’ அந்த முரண்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: ἐζήτουν
  choice: முயன்றார்கள்
  rationale: முற்றுப்பெறாத இறந்தகாலச் செயல் அல்லது முயற்சியை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தேடினார்கள்’ என்பது இச்சூழலில் தவறான பொருளுணர்வைத் தரக்கூடும்.
- source_word: λιθάσαι
  choice: கல்லெறிந்து கொல்ல
  rationale: ‘கல்லெறிதல்’ என்ற தண்டனைச் செயலின் நோக்கத்தை நவீன வாசகருக்குத் தெளிவாக்குகிறது; தனியாக ‘கல்லெறிய’ என்பது சாதாரண தாக்குதலாகப் புரிய வாய்ப்புள்ளது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: சொல்லின் பொதுவான நேரடி இணை. யோவானில் இது யூதேயாவைச் சேர்ந்த எதிரிகள் அல்லது யூதத் தலைவர்களைச் சூழல்படி குறிக்கக்கூடும் என்பதால் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: மீண்டும் அதே இடத்திற்குச் செல்வதை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: ὑπάγεις
  choice: போகிறீர்களா
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்திற்குச் செல்வதைக் குறிக்கும் இச்சூழலில் தெளிவான, இயல்பான தமிழ் வினை.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட யூதேயா என்ற இடத்தைச் சுட்டும் இயல்பான இடவினையடை.
theological_decisions:
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்கள்
  alternative: யூதேயர்கள்; அல்லது சூழல்படி யூதத் தலைவர்கள்
  rationale: மூலச்சொல்லின் பொதுவான பொருளை முதன்மை உரையில் பாதுகாக்கிறது. அதேவேளை, இது யூத மக்கள் அனைவரையும் குறிக்காமல் யூதேயாவில் இயேசுவை எதிர்த்த குறிப்பிட்ட குழுவைக் குறிக்கக்கூடிய யோவானின் பயன்பாட்டை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதை ஒருமை வடிவங்களுடன், இயல்பான நேரடி உரையாடல் நடையில் வடிவமைக்கப்பட்டது. ‘ரபீ’ என்ற மூலப் பட்டம் தக்கவைக்கப்பட்டது; முதன்மை உரையில் [a] குறியீடு இடம்பெற்றுள்ளது.
