source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: ta
  text: இயேசு இன்னும் கிராமத்துக்குள் வந்திருக்கவில்லை; ஆனால், மார்த்தா அவரைச் சந்தித்த[a] இடத்திலேயே அவர் இன்னும் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மார்த்தா அவரைச் சந்திக்க வெளியே சென்ற இடத்தில்.”
    reason: ὑπαντάω என்பதற்கு ‘சந்தித்தாள்’ என்றும், சூழலுக்கு ஏற்ப ‘சந்திக்கச் சென்றாள்’ என்றும் பொருள் வரலாம்; யோவான் 11:20-ல் மார்த்தா இயேசுவைச் சந்திக்க வெளியே சென்றதாகக் கூறப்படுகிறது.
lexical_decisions:
- source_word: οὔπω
  choice: இன்னும் ... இல்லை
  rationale: ஒரு நிகழ்வு அந்த நேரம்வரை நடைபெறவில்லை என்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ சேர்ப்பது மூலத்தில் இல்லாத கால அல்லது முரண்பாட்டு அழுத்தத்தை ஏற்படுத்தலாம்; வாக்கியத் தொடரே அதன் பணியைச் செய்கிறது.
- source_word: ἐληλύθει
  choice: வந்திருக்கவில்லை
  rationale: சுற்றியுள்ள கதைநேரத்திற்கு முன்புவரை இயேசு கிராமத்துக்குள் வராதிருந்த நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κώμην
  choice: கிராமத்துக்குள்
  rationale: κώμη என்பது பொதுவாகச் சிறிய குடியிருப்பான ‘கிராமம்’ என்பதைக் குறிக்கிறது; εἰς உடன் வருவதால் ‘கிராமத்துக்குள்’ என இடநுழைவு தெளிவாக்கப்படுகிறது.
- source_word: ἀλλ’
  choice: ; ... அவர்
  rationale: கிராமத்துக்குள் வராத நிலைக்கும் வேறொரு இடத்தில் தொடர்ந்து இருந்த நிலைக்கும் உள்ள முரண்பாடு தமிழில் அரைப்புள்ளி மற்றும் அடுத்த கூற்றின் அமைப்பால் இயல்பாக வெளிப்படுகிறது; ‘ஆனால்’ என்பதையும் பயன்படுத்தலாம்.
- source_word: ἔτι
  choice: இன்னும்
  rationale: அதே இடத்தில் தொடர்ந்து இருந்ததைத் தெளிவாகக் குறிக்கிறது.
- source_word: τόπῳ
  choice: இடத்திலேயே
  rationale: τόπος என்பதன் பொதுவான பொருள் ‘இடம்’; ஏற்கெனவே குறிப்பிடப்பட்ட அதே இடம் என்பதை ‘-லேயே’ இயல்பாக வலியுறுத்துகிறது.
- source_word: ὅπου
  choice: '... இடத்தில்'
  rationale: இடத்தைக் குறிக்கும் உறவுத்தொடரை நவீனத் தமிழில் இயல்பாகப் பெயரெச்சத் தொடராக அமைக்கிறது.
- source_word: ὑπήντησεν
  choice: சந்தித்த
  rationale: இங்கு அந்த இடத்தை அடையாளப்படுத்தும் சந்திப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘சந்திக்க வந்த’ என்ற இயக்க நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: αὐτῷ
  choice: அவரை
  rationale: ὑπαντάω உடன் வரும் தந்தைவேற்றுமைத் தொடர்பைத் தமிழில் ‘சந்தித்த’ என்பதன் இயல்பான செயப்படுபொருளாக வழங்குகிறது.
- source_word: Μάρθα
  choice: மார்த்தா
  rationale: Μάρθα என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
