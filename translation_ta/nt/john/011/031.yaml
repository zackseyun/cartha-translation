id: JHN.11.31
reference: John 11:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: ta
  text: எனவே, வீட்டில் அவளோடு இருந்து, அவளுக்கு ஆறுதல் கூறிக்கொண்டிருந்த யூதர்கள்[a], மரியா விரைவாக எழுந்து வெளியே சென்றதைக் கண்டு, அவள் அங்கே அழுவதற்காகக் கல்லறைக்குச் செல்கிறாள் என்று எண்ணி, அவளைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதேயர்கள்.’ யோவான் நற்செய்தியில் Ἰουδαῖοι என்ற சொல் சில இடங்களில் யூதேயாவைச் சேர்ந்தவர்களையோ யூதத் தலைவர்களையோ குறுகிய பொருளில் குறிக்கலாம்; ஆனால் இங்கு அது மரியாவுடன் துக்கம் அனுசரித்துக்கொண்டிருந்த குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: அப்போது ... யூதர்கள்
  rationale: οὖν இங்கு கதை நிகழ்வின் தொடர்ச்சியை இயல்பாகக் காட்டுவதால் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது. Ἰουδαῖοι என்பது இச்சூழலில் மரியாவுடன் துக்கம் அனுசரித்த யூதர்களைக் குறிக்கிறது; ‘யூதேயர்கள்’ என்ற புவியியல் சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: வீட்டில் அவளோடு இருந்து அவளுக்கு ஆறுதல் சொல்லிக்கொண்டிருந்த
  rationale: இப்பங்கேற்புச் சொற்றொடர் எந்த யூதர்கள் குறிக்கப்படுகின்றனர் என்பதை அடையாளப்படுத்துகிறது. παραμυθέομαι என்பது துக்கத்தில் ஆறுதலளிப்பதைக் குறிக்கும்; ‘ஆறுதல் சொல்லிக்கொண்டிருந்த’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἰδόντες τὴν Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: மரியா விரைவாக எழுந்து வெளியே சென்றதைக் கண்டு
  rationale: ἰδόντες காரணமான அடுத்த செயலுக்கு முன் நிகழ்ந்த பார்வையைச் சுட்டுகிறது. ἀνέστη இங்கு உயிர்த்தெழுதலை அல்ல, இருந்த இடத்திலிருந்து எழுவதைக் குறிக்கிறது.
- source_word: ἠκολούθησαν αὐτῇ
  choice: அவளைப் பின்தொடர்ந்தார்கள்
  rationale: இங்கு ἀκολουθέω என்பது சீடத்துவம் சார்ந்த சிறப்புப் பொருளின்றி, உடல்ரீதியாக ஒருவரைப் பின்தொடர்வதைக் குறிக்கிறது.
- source_word: δόξαντες
  choice: என்று நினைத்து
  rationale: δόξαντες அவர்கள் உண்மை என ஊகித்ததை அல்லது கருதியதை வெளிப்படுத்துகிறது; ‘நினைத்து’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: கல்லறைக்குச் சென்று
  rationale: ὑπάγει என்பது அவள் சென்றுகொண்டிருப்பதாக அவர்கள் நினைத்ததைக் குறிக்கிறது. யோவானின் அடக்கச் சூழலில் μνημεῖον என்பதற்கு ‘கல்லறை’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: அங்கே அழப்போகிறாள்
  rationale: ἵνα உடன் வரும் வினை நோக்கத்தைக் காட்டுகிறது. தமிழில் ‘அங்கே அழப்போகிறாள்’ என்பது அவர்கள் கருதிய நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαῖοι என்பதன் பொருள்
  choice: இவ்வசனத்தில் மரியாவுடன் துக்கம் அனுசரித்த குழுவைக் குறிக்கும் வகையில் ‘யூதர்கள்’
  alternative: யூதேயர்கள்
  rationale: யோவானில் Ἰουδαῖοι சூழலுக்கேற்ப யூத மக்களையோ, யூதேயர்களையோ, சில இடங்களில் யூதத் தலைவர்களையோ குறிக்கலாம். இங்கு வீட்டில் மரியாவுடன் இருந்து ஆறுதல் கூறியவர்களே நேரடியான குறிப்பு; சொல்லை பகைமை அல்லது முழு இனக்குழுவைக் குறிக்கும் பொதுப்பெயராக விரிவுபடுத்தாமல், மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது மூலத்தின் நெகிழ்வை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் துக்கச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட அமைப்பு தமிழில் வாசிக்கத் தக்கவாறு ஒழுங்குபடுத்தப்பட்டாலும், நிகழ்வுகளின் வரிசையும் அவர்கள் செய்த ஊகமும் பாதுகாக்கப்பட்டுள்ளன.
