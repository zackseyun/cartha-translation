    rationale: διά + accusative இங்கு ‘காரணமாக/on account of’ என்பதைக் நேரடியாகக் குறிக்கிறது. அடுத்த ἵνα வாக்கியமே கூட்டத்தினருக்கான நோக்கத்தை வெளிப்படுத்துகிறது. ‘காரணமாக’ எனத் தருவது இரு கூறுகளையும் வேறுபடுத்தி மூலத்தின் தர்க்கத்தைத் தெளிவாகக் காக்கும்.
