revisions:
- from: ஆனால், நீர் எப்போதும் எனக்குச் செவிகொடுக்கிறீர் என்று நான் அறிந்திருந்தேன். இருந்தாலும், சுற்றி நின்றுகொண்டிருக்கும் மக்கள் கூட்டத்திற்காகவே[a] இதைச் சொன்னேன்; நீரே என்னை அனுப்பினீர்[b] என்று அவர்கள் நம்பும்படியாகச் சொன்னேன்.
  to: ஆனால், நீர் எப்போதும் எனக்குச் செவிகொடுக்கிறீர் என்று நான் அறிந்திருந்தேன். இருந்தாலும், சுற்றி நின்றுகொண்டிருந்த மக்கள் கூட்டத்தின் காரணமாக, நீரே என்னை அனுப்பினீர் என்று அவர்கள் நம்பும்படியாக இதைச் சொன்னேன்.[a]
  rationale: முதன்மை உரையில் διά + accusative-ன் காரணப் பொருளை ‘மக்கள் கூட்டத்தின் காரணமாக’ என நேரடியாக்கினேன். ἵνα நோக்கவாக்கியத்தை ‘அவர்கள் நம்பும்படியாக’ என ஒரே εἶπον வினையுடன் இணைத்து, தமிழின் தேவையற்ற வினை மறுமொழியை நீக்கினேன். பழைய அடிக்குறிப்பு a, மூலத்தில் இல்லாத மாற்று வாசிப்பை முன்வைத்ததால் நீக்கப்பட்டது; மீதமுள்ள σύ வலியுறுத்தல் குறிப்பு புதிய [a] இடத்தில் சரியாக இணைக்கப்பட்டுள்ளது.
