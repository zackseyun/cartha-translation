source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: ta
  text: ஆனால், நீர் எப்போதும் எனக்குச் செவிகொடுக்கிறீர் என்று நான் அறிந்திருந்தேன். இருந்தாலும், சுற்றி நின்றுகொண்டிருந்த மக்கள் கூட்டத்தின் காரணமாக, நீரே என்னை அனுப்பினீர் என்று அவர்கள் நம்பும்படியாக இதைச் சொன்னேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்க மூலத்தில் “நீர்” என்பது வெளிப்படையாக இடம்பெற்று வலியுறுத்தப்பட்டுள்ளது: “நீரே என்னை அனுப்பினீர்.”'
    reason: σύ என்ற வலியுறுத்தப்பட்ட எழுவாய்ப் பிரதிப்பெயரின் அழுத்தத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ᾔδειν
  choice: நான் அறிந்திருந்தேன்
  rationale: οἶδα என்பதன் கடந்தகாலச் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முன்பே நிலைத்திருந்த அறிவைச் சுட்டுகிறது, ஆனால் தேவையற்ற காலநுட்பத்தைத் திணிக்கவில்லை.
- source_word: πάντοτέ μου ἀκούεις
  choice: நீர் எப்போதும் எனக்குச் செவிகொடுக்கிறீர்
  rationale: தந்தை இயேசுவின் வேண்டுதலைக் கேட்பதை வெறும் ஒலி கேட்டல் என அல்லாமல் ஏற்றுக்கொண்டு கேட்டல் என்ற சூழல்சார் பொருளுடன் தருகிறது; ‘எப்போதும்’ πάντοτε என்பதைக் காக்கிறது.
- source_word: ἀλλὰ
  choice: இருந்தாலும்
  rationale: முன்னர் கூறிய உறுதியான அறிவுக்கும் மக்கள் கூட்டத்திற்காக வெளிப்படையாகச் சொன்னதற்கும் இடையிலான எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: διὰ τὸν ὄχλον
  choice: மக்கள் கூட்டத்திற்காகவே
  rationale: διά + accusative இங்கு காரணம் அல்லது அவர்களின் நலன்/நோக்கம் ஆகிய நெருங்கிய நிழற்பொருள்களை உடையது; தொடரும் நோக்கவாக்கியத்துக்கு ஏற்றவாறு ‘காகவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν περιεστῶτα
  choice: சுற்றி நின்றுகொண்டிருக்கும்
  rationale: περιΐστημι என்பதன் இடவியல் கருத்தையும் அங்கு தற்போது சூழ்ந்து நிற்கும் கூட்டத்தின் நிலையையும் தெளிவாகக் காக்கிறது.
- source_word: εἶπον
  choice: இதைச் சொன்னேன்
  rationale: முந்தைய வெளிப்படையான வேண்டுதலையே இயேசு குறிப்பிடுகிறார் என்பதை இயல்பான தமிழில் குறைந்த அளவு வெளிப்படுத்துகிறது.
- source_word: ἵνα πιστεύσωσιν
  choice: அவர்கள் நம்பும்படியாக
  rationale: ἵνα + subjunctive என்பதன் நோக்கப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: நீரே என்னை அனுப்பினீர்
  rationale: வெளிப்படையாக உள்ள σύ என்பதன் வலியுறுத்தலை ‘நீரே’ காக்கிறது; ἀπέστειλας என்பதற்கு நேரான கடந்தகாலமான ‘அனுப்பினீர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: தந்தை இயேசுவுக்குச் செவிகொடுப்பதன் பொருள்
  choice: தந்தை எப்போதும் இயேசுவுக்குச் செவிகொடுக்கிறார் என்றும், மக்கள் கூட்டத்தின் நிமித்தம் இயேசு வெளிப்படையாகப் பேசினார் என்றும் வசனம் கூறும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: இதைப் பொதுவாக வேண்டுதலுக்குப் பதில் கிடைப்பது பற்றிய கூற்றாக மட்டும் புரிந்துகொள்ளலாம்.
  rationale: உடனடிச் சூழல் லாசருவை எழுப்புவதற்கு முன் இயேசு செய்த வேண்டுதல். தந்தை-மகன் உறவையும் பொது வெளியில் கூறப்பட்டதன் நம்பிக்கை நோக்கத்தையும் உரை கூறும் அளவிலேயே வைத்திருக்கிறது.
- issue: பொதுவில் கூறப்பட்ட வேண்டுதலின் நோக்கம்
  choice: தந்தையே இயேசுவை அனுப்பினார் என்று சுற்றியிருந்தவர்கள் நம்புவதே நோக்கம் எனத் தெளிவாக வைக்கப்பட்டது.
  alternative: இந்த குறிப்பிட்ட அற்புதத்தை மட்டும் உறுதிப்படுத்தும் குறுகிய நோக்கமாக இதைப் புரிந்துகொள்ளலாம்.
  rationale: ἵνα நோக்கவாக்கியம் நேரடியாக ‘நீரே என்னை அனுப்பினீர்’ என்பதை அவர்கள் நம்புவதில் மையங்கொள்கிறது; இதை மொழிபெயர்ப்பு குறுக்கவோ விரிவாக்கவோ இல்லை.
translation_notes:
  register: மரியாதைமிக்க, நவீன பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. தந்தையிடம் உரையாடுவதற்கு ‘நீர்/செவிகொடுக்கிறீர்/அனுப்பினீர்’ என்ற உயர்திணை மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘செவிகொடுக்கிறீர்’ என்பது வேண்டுதல் சூழலில் ἀκούω என்பதன் ஏற்றுக்கொண்டு கேட்டல் என்ற நுட்பத்தை இயல்பாகக் காக்கிறது. இரு அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
