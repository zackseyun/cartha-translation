source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: ta
  text: ஆகவே, இயேசு யூதர்களிடையே[a] இனி வெளிப்படையாக நடமாடவில்லை. மாறாக, அவர் அங்கிருந்து புறப்பட்டு, வனாந்தரத்துக்கு அருகிலுள்ள பகுதிக்கு, எப்பிராயீம் எனப்படும் நகரத்துக்குச் சென்றார்; அங்கே சீடர்களுடன் தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதேயர்களிடையே.’ யோவான் நற்செய்தியில் ‘யூதர்கள்’ என்பது சூழலுக்கேற்ப யூதேயர்களையோ யூதத் தலைவர்களையோ சில வேளைகளில் குறிப்பாகக் குறிக்கலாம்.
    reason: Ἰουδαῖοι என்பதற்குச் சாத்தியமான பிராந்தியப் பொருளைப் பாதுகாத்து, இதை எல்லா யூதர்களையும் பற்றிய பொதுக்கூற்றாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் இயேசுவைக் கொல்லத் திட்டமிட்டதன் விளைவாக நிகழ்ந்ததைச் சுட்டுகிறது; இயல்பான தமிழில் காரணவிளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκέτι
  choice: இனி ... இல்லை
  rationale: முன்பு இருந்த நடைமுறை முடிவுக்கு வந்ததை உணர்த்தும் கால மறுப்பை இயல்பான தமிழில் தருகிறது.
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: இங்கு துணிச்சலைவிட, பொதுமக்களின் பார்வையில் மறைவின்றி செயல்படுவதையே குறிக்கிறது.
- source_word: περιεπάτει
  choice: நடமாடவில்லை
  rationale: சொல்லின் நடப்பது என்ற உருவகத்தைத் தக்கவைத்தபடியே, ஓரிடத்தில் நடப்பதை மட்டும் அல்லாமல் பொதுவெளியில் சென்று வருவதையும் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: யூதர்களிடையே
  rationale: இது இங்கு ஒரு புவியியல்-சமூகச் சூழலில் இயேசுவின் வெளிப்படையான நடமாட்டத்தைக் குறிக்கிறது. யோவானில் இச்சொல் சூழலுக்கேற்ப யூதர்களை, யூதேயர்களை அல்லது யூதத் தலைவர்களைக் குறிக்கக்கூடும் என்பதால் பிராந்திய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: அங்கிருந்து புறப்பட்டு
  rationale: முந்தைய இடத்தைவிட்டு நீங்கிச் சென்றதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χώραν
  choice: பகுதி
  rationale: நவீன தேசிய நாட்டை அல்ல, ஓர் நிலப்பரப்பு அல்லது வட்டாரத்தைக் குறிக்கிறது.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: வனாந்தரத்துக்கு அருகிலுள்ள
  rationale: மக்கள் குடியிருப்பு குறைந்த வறண்ட வெளிப்பகுதியைக் குறிக்கும் வேதாகமப் புவியியல் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: எப்பிராயீம் எனப்படும் நகரத்தில்
  rationale: πόλις என்பதற்கு நேரான இணையாக ‘நகரம்’ பயன்படுத்தப்பட்டுள்ளது; தமிழில் இலக்கைச் சென்றடைந்து அங்கே தங்கியதை அடுத்த வினையுடன் இயல்பாக இணைக்க ‘நகரத்தில்’ என அமைக்கப்பட்டுள்ளது.
- source_word: κἀκεῖ ἔμεινεν
  choice: தங்கினார்
  rationale: பயணச் சூழலில் μένω என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அங்கே’ என்ற கருத்து ‘நகரத்தில்’ என்பதில் அடங்கியுள்ளது.
- source_word: μετὰ τῶν μαθητῶν
  choice: சீடர்களுடன்
  rationale: கிரேக்கத்தில் இல்லாத ‘தமது’ அல்லது ‘தம்’ என்ற உடைமைச்சொல்லைச் சேர்க்காமல் மூலத்தின் வடிவத்துடன் நெருக்கமாக உள்ளது.
theological_decisions:
- issue: யோவானில் Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்களிடையே
  alternative: யூதேயர்களிடையே
  rationale: யோவான் நற்செய்தியில் இச்சொல் இன, பிராந்திய அல்லது தலைமை சார்ந்த பொருளில் சூழலுக்கேற்ப வரலாம். இவ்வசனம் எல்லா யூதர்களையும் குறித்த ஒரு இறையியல் தீர்ப்பை வழங்காமல், அப்பகுதியில் இயேசு பொதுவெளியில் நடமாடிய நிலையை விவரிக்கிறது. பழக்கமான மொழிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டு, பிராந்திய நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘நடமாடவில்லை’ பொதுவெளியில் சென்று வருதல் என்ற கருத்தை இயல்பாகத் தருகிறது; ‘வனாந்தரம்’ வேதாகமப் புவியியல் பதிவுக்கேற்ற சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
