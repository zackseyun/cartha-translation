    issue: Direct-speech word order and punctuation are slightly awkward.
    rationale: In Tamil, ‘வெளிப்படையாகச் சொன்னார்’ naturally modifies the speech verb when placed after the quotation, and a colon more clearly introduces the direct statement.
  revised_text: அப்போது இயேசு அவர்களிடம், “லாசரு இறந்துவிட்டான்” என்று வெளிப்படையாகச் சொன்னார்.
