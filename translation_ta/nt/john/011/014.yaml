base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: ta
  text: அப்போது இயேசு அவர்களிடம், “லாசரு இறந்துவிட்டான்” என்று வெளிப்படையாகச் சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: அப்போது
  rationale: இரு சொற்களும் சேர்ந்து உரையாடலின் அடுத்த கட்டத்தைக் குறிக்கின்றன. தமிழில் இயல்பாக ‘அப்போது’ என வழங்குவது காலத் தொடர்ச்சியையும் சூழலால் விளங்கும் முடிவுறுத்தும் நகர்வையும் தெரிவிக்கிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... சொன்னார்
  rationale: கிரேக்கத்தின் இயல்பான பேச்சுச் சூத்திரத்தை நவீனத் தமிழில் நேரடியாகவும் மரியாதையான நடையிலும் வழங்குகிறது.
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: முன்பு கூறப்பட்ட ‘தூக்கம்’ என்ற மறைமுகச் சொல்லுக்கு மாறாக, இப்போது இயேசு மறைக்காமல் நேரடியாகப் பேசுவதை இச்சொல் குறிக்கிறது.
- source_word: Λάζαρος
  choice: லாசரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπέθανεν
  choice: இறந்துவிட்டான்
  rationale: இறப்பு நிகழ்ந்து முடிந்ததையும் அதன் தற்போதைய விளைவு தொடர்வதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: லாசருவின் நிலையைப் பற்றிய இயேசுவின் கூற்று
  choice: உடல் மரணத்தைத் தெளிவாகக் குறிக்கும் நேரடிக் கூற்று
  alternative: முந்தைய ‘தூக்கம்’ என்ற உருவகத்தைத் தொடர்வது
  rationale: ἀπέθανεν என்பது ‘இறந்தான்’ என்று வெளிப்படையாகக் கூறி, முந்தைய உருவகத்தின் பொருளை மூலவாக்கியமே தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான உரைநடை. ‘வெளிப்படையாக’ என்பது παρρησίᾳ என்பதன் திறந்த, நேரடியான பேச்சு நுணுக்கத்தைப் பாதுகாக்கிறது.
