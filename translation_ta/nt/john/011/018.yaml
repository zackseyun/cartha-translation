  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஸ்தாதி’ என்ற மூலப் பண்பாட்டு அளவு முதன்மை உரையில் வைக்கப்பட்டு, வாசகருக்குப் புரியும் நவீன அளவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
