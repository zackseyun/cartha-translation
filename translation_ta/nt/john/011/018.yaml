  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: ta
  text: பெத்தானியா எருசலேமுக்கு அருகில், எருசலேமிலிருந்து ஏறக்குறைய பதினைந்து ஸ்தாதி தொலைவில் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சுமார் இரண்டு மைல், அதாவது ஏறக்குறைய மூன்று கிலோமீட்டர்.
    reason: பழங்காலத் தூர அலகுக்கு நவீன அளவை விளக்கும் பண்பாட்டுக் குறிப்பு.
lexical_decisions:
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல், பின்னணித் தகவலை மென்மையாக அறிமுகப்படுத்துகிறது. தமிழில் தனி இணைப்புச்சொல் இல்லாமலேயே இந்த உரையோட்டம் இயல்பாகத் தெளிவாகிறது.
- source_word: Βηθανία
  choice: பெத்தானியா
  rationale: இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: எருசலேமுக்கு அருகில்
  rationale: ἐγγύς குறிக்கும் இடரீதியான அண்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; எருசலேம் என்ற இடப்பெயர் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: ὡς
  choice: ஏறக்குறைய
  rationale: அளவைக் குறிக்கும் தொடருடன் வரும் ὡς தோராயத்தைக் குறிக்கிறது; இதை ‘ஏறக்குறைய’ துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: பதினைந்து ஸ்தாதி தூரத்தில்
  rationale: மூலப் பண்பாட்டின் பழங்காலத் தூர அலகை முதன்மை உரையில் தக்கவைத்து, ἀπό உணர்த்தும் இடைவெளியை ‘தூரத்தில்’ என வெளிப்படுத்துகிறது.
theological_decisions: []
