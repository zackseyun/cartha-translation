source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: ta
  text: இயேசு லாசரின் மரணத்தைப் பற்றிப் பேசியிருந்தார்; ஆனால் சீடர்களோ, அவர் தூக்கத்தைப் பற்றிப் பேசுகிறார் என்று நினைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “தூக்கத்தின் உறக்கம்”; அதாவது, மரணத்தைக் குறிக்கும் உருவகமான உறக்கம் அல்ல, நேரடியான தூக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: பேசியிருந்தார்
  rationale: இறந்தகாலத்தில் அதற்கு முன்பே நிகழ்ந்த பேச்சைக் குறிக்கும் நிறைவிறந்தகால வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: லாசரின் மரணத்தைப் பற்றி
  rationale: αὐτοῦ என்பதன் சூழல்சார் முன்னிலையைத் தெளிவுபடுத்த ‘லாசரின்’ என வழங்குவது தமிழில் குழப்பத்தைத் தவிர்க்கிறது; περί உடன் மரபுவழி வேற்றுமை ‘பற்றி’ என இயல்பாக வருகிறது.
- source_word: ἐκεῖνοι
  choice: சீடர்களோ
  rationale: சூழலில் சுட்டப்படுபவர்கள் சீடர்கள். ‘-ஓ’ எதிர்மறை வேறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ἔδοξαν
  choice: நினைத்தார்கள்
  rationale: சீடர்களின் தவறான புரிதலை எளிய நவீன தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: இயல்பான தூக்கத்தைப் பற்றி
  rationale: கிரேக்கத்தில் ஒரே பொருட்களத்தில் உள்ள இரண்டு பெயர்ச்சொற்கள் சேர்ந்து மரணத்துக்கு உருவகமான ‘உறக்கம்’ அல்ல, நேரடியான உடல் தூக்கம் என்பதைக் குறிப்பிடுகின்றன. சொற்சொற் மீளுரைப்பை விட இவ்வாக்கியம் தமிழில் இயல்பானது.
- source_word: λέγει
  choice: பேசுகிறார்
  rationale: δοκέω-க்கு உட்பட்ட வரலாற்று நிகழ்காலத்தை, சீடர்கள் அப்போது கொண்டிருந்த எண்ணத்தின் உள்ளடக்கமாக நிகழ்காலத்தில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘உறக்கம்’ என்ற உருவகம் இறந்தவர்களின் நிலையைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை உணர்த்துமா?
  choice: இயேசு குறிப்பிட்டது மரணம் என்றும், சீடர்கள் புரிந்துகொண்டது இயல்பான தூக்கம் என்றும் கதையிலுள்ள வேறுபாட்டை மட்டும் வெளிப்படுத்துதல்
  alternative: ‘உறக்கம்’ என்பதைக் கொண்டு மரணத்திற்குப் பிந்தைய ஆன்மாவின் நிலையைக் குறித்த கோட்பாட்டை விளக்குதல்
  rationale: இந்த வசனத்தின் நோக்கம் சீடர்களின் தவறான புரிதலை விளக்குவதே; மரணத்திற்குப் பிந்தைய நிலையை வரையறுப்பது அல்ல.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். αὐτοῦ என்பதைக் ‘அவருடைய’ என மொழிபெயர்த்தால் இயேசுவின் மரணம் என்று தவறாகப் புரிய வாய்ப்புள்ளதால், சூழலின் தெளிவுக்காக ‘லாசரின்’ பயன்படுத்தப்பட்டது. முதலாம் δέ-க்கு தனி இணைப்புச்சொல் சேர்க்கப்படவில்லை; இரண்டாம் δέ ‘ஆனால் ... -ஓ’ மூலம் வெளிப்படுத்தப்பட்டது.
