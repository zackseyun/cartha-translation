  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: ta
  text: ஆனால், இப்போதுகூட, நீர் கடவுளிடம் எதைக் கேட்டாலும், கடவுள் அதை உமக்குக் கொடுப்பார் என்று எனக்குத் தெரியும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: ஆனால் இப்போதும்கூட
  rationale: καί அடிப்படையில் ‘மற்றும்’ என்று பொருள்படலாம்; இங்கு முந்தைய வசனத்தில் லாசருவின் மரணத்தைப் பற்றிய மார்த்தாவின் கூற்றுக்குப் பின் ஒரு முரண்பாட்டு/நம்பிக்கையான திருப்பத்தை ஏற்படுத்துகிறது. νῦν என்பதின் காலப் பொருளையும் ‘இப்போதும்கூட’ காக்கிறது.
- source_word: οἶδα
  choice: எனக்குத் தெரியும்
  rationale: Perfect வடிவிலிருந்தாலும் நிகழ்காலப் பொருளில் வரும் οἶδα என்பதற்கு இயல்பான நவீனத் தமிழ் இணை இது; ‘நான் உறுதியாக நம்புகிறேன்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: ὅσα ἂν
  choice: எதைக் ... ஆனாலும்
  rationale: ἄν உடன் வரும் உறவுப்பெயர் வரையறுக்கப்படாத, திறந்த பரப்பைக் குறிக்கிறது. தமிழில் ‘எதைக் கேட்டாலும்’ என்பது ‘whatever’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἰτήσῃ τὸν θεόν
  choice: நீர் கடவுளிடம் ... கேட்டாலும்
  rationale: கிரேக்கத்தில் θεόν நேரடி செயப்படுபொருளாக இருந்தாலும், வேண்டுதலின் சூழலில் தமிழில் ஒருவரிடம் கேட்பதை ‘கடவுளிடம் கேட்பது’ என்று சொல்வதே இயல்பு. இயேசுவை நோக்கிய மரியாதையான ஒருமை ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: δώσει σοι ὁ θεός
  choice: கடவுள் அதை உமக்குக் கொடுப்பார்
  rationale: எதிர்கால வினையையும் வெளிப்படையான எழுவாய் ὁ θεός என்பதையும் நேரடியாகக் காக்கிறது. தமிழில் ‘கொடுப்பார்’ என்பதற்குத் தேவையான செயப்படுபொருளாக, முன் வந்த ‘எதை’ என்பதைக் குறிக்கும் ‘அதை’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசு கடவுளிடம் கேட்பதாகவும் கடவுள் அவருக்குக் கொடுப்பதாகவும் மார்த்தா கூறுவது, இயேசுவின் தெய்வீகத்தை மறுப்பதாக மிகைப்படுத்திப் படிக்கப்படக்கூடும்.
  choice: 'மார்த்தாவின் கூற்றை doctrinal விரிவாக்கமின்றி அப்படியே வைத்தல்: ‘நீர் கடவுளிடம் எதைக் கேட்டாலும், கடவுள் அதை உமக்குக் கொடுப்பார்.’'
  alternative: ‘கடவுள்’ என்பதை ‘பிதாவாகிய கடவுள்’ என்று விரிவாக்குதல் அல்லது கீழ்ப்படிதல் போன்ற தோற்றத்தைத் தவிர்க்க உரையை மறுசொல்லுதல்.
  rationale: இது மார்த்தாவின் உரையாக வரும் யோவான் நற்செய்தியின் கதைச்சூழல். மூலத்தில் உள்ள குமாரன்–கடவுள் உறவின் மொழியையும் கதையின் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு மென்மையாக்கவோ, அதிலிருந்து தனிப்பட்ட கோட்பாட்டை உருவாக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிப் பேசுவதால் ‘நீர்/உமக்கு’ என்ற மரியாதையான ஒருமை தேர்ந்தெடுக்கப்பட்டது. வாக்கியத்தின் திருப்பமும் மார்த்தாவின் தொடரும் நம்பிக்கையும் தெளிவாக இருக்க ‘ஆனால் இப்போதும்கூட’ பயன்படுத்தப்பட்டது.
