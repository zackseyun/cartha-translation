  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: ta
  text: பின்பு, இதற்குப் பிறகு அவர் சீடர்களிடம், “நாம் மீண்டும் யூதேயாவுக்குப்[a] போவோம்” என்று கூறுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயாவுக்குள்.” இச்சூழலில் கிரேக்க முன்னிடைச்சொல் இலக்கை நோக்கிச் செல்வதையோ ஓர் எல்லைக்குள் நுழைவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: பின்பு
  rationale: நிகழ்வுகளின் காலவரிசையைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: μετὰ τοῦτο
  choice: இதற்குப் பிறகு
  rationale: முந்தைய நிகழ்வைச் சுட்டும் தொடரை வெளிப்படையாக வைத்திருக்கிறது. ἔπειτα என்பதுடன் வரும் மூலமொழியின் இரட்டை காலக் குறிப்பையும் நீக்காமல் காக்கிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: யோவான் பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாகக் காத்து, கதைசொல்லலின் உயிரோட்டத்தைப் பிரதிபலிக்கிறது.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களிடம்
  rationale: இடப்பொருள் வேற்றுமையில் உள்ள மறைமுகப் பெறுநரை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தமது’ என்பதைக் கூட்டவில்லை.
- source_word: Ἄγωμεν
  choice: நாம் ... போவோம்
  rationale: முதல் நபர் பன்மைத் தூண்டல் வினைமுறையை, சேர்ந்து செல்லுமாறு அழைக்கும் இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: யூதேயாவுக்குப்
  rationale: இலக்கை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது. சூழலில் ‘யூதேயாவுக்குள்’ என்பதும் சாத்தியமானதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு சென்ற பகுதிக்குத் திரும்பிச் செல்வதை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: யோவானின் கதைசொல்லலில் வரும் வரலாற்று நிகழ்காலம்
  choice: ‘கூறுகிறார்’ என்று நிகழ்காலத்தைத் தக்கவைத்தல்
  alternative: ‘கூறினார்’ என்று தமிழ் கதைநடையின் இறந்தகாலமாக மாற்றுதல்
  rationale: மூலத்தின் நிகழ்கால வடிவத்தையும் யோவானின் கதைசொல்லல் உயிரோட்டத்தையும் காக்கிறது; எந்தத் தனிப்பட்ட கோட்பாட்டு விளக்கத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் அடுத்தடுத்து வரும் ἔπειτα மற்றும் μετὰ τοῦτο ஆகிய இரு காலக் குறிப்புகளும் ‘பின்பு, இதற்குப் பிறகு’ என்று நோக்கத்துடன் தக்கவைக்கப்பட்டுள்ளன; இது தமிழில் சற்றே மீளுரைப்பாகத் தோன்றினாலும் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
