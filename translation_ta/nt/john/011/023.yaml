id: JHN.11.23
reference: John 11:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: ta
  text: இயேசு அவளிடம், “உன் சகோதரன் உயிர்த்தெழுவான்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: யோவான் பயன்படுத்தும் வரலாற்று நிகழ்காலம் தமிழில் இயல்பான கதைநடைக்கேற்ப இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது; “கூறுகிறார்” என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: சொல்லுதல் வினையுடன் வரும் தத்திவைப் பொருளை இயல்பான தமிழில் மறைமுகச் செயப்படுபொருளாக வெளிப்படுத்துகிறது.
- source_word: Ἀναστήσεται
  choice: உயிர்த்தெழுவான்
  rationale: எதிர்கால நடுவினை வடிவம் இச்சூழலில் இறந்தோரிலிருந்து எழுவதைக் குறிக்கிறது. “உயிர்த்தெழுவான்” என்பது தமிழில் உயிர்த்தெழுதல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; “உயிர்த்தெழுப்பப்படுவான்” என்று மொழிபெயர்த்தால் கிரேக்கம் வெளிப்படையாகக் கூறாத தெய்வீகச் செயற்பாட்டை முன்னிறுத்தும்.
- source_word: ὁ ἀδελφός σου
  choice: உன் சகோதரன்
  rationale: இது மார்த்தாளின் உடன்பிறந்த ஆணாகிய லாசருவைக் குறிக்கும் எளிய உடைமைத் தொடர்.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள இயேசுவின் பெயர் வடிவம் பயன்படுத்தப்பட்டது; கிரேக்க வரையறைச் சுட்டு தனியே மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த சொற்றொடர்
  choice: உயிர்த்தெழுவான்
  alternative: எழுவான்; உயிர்த்தெழுப்பப்படுவான்
  rationale: இவ்வசனம் சகோதரன் எழுவான் என்று உறுதியளிக்கிறது; அது உடனடி உயிர்ப்பித்தலையா அல்லது இறுதி நாளின் உயிர்த்தெழுதலையா என்பதை இங்கே வெளிப்படையாகத் தீர்மானிப்பதில்லை. தேர்ந்த வடிவம் அந்தத் தெய்வியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. கிரேக்க வரலாற்று நிகழ்காலம் தமிழின் வழக்கமான விவிலியக் கதைநடைக்கேற்ப இறந்தகாலமாக்கப்பட்டுள்ளது. ஆங்கிலத்தில் தேவைப்படும் “again” சார்ந்த அடிக்குறிப்பு தமிழில் தேவையில்லை; “உயிர்த்தெழு” என்பதே இறப்பிலிருந்து எழும் பொருளை இயல்பாகத் தெரிவிக்கிறது.
