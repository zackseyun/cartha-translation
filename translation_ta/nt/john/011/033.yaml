  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: ta
  text: ஆகவே, இயேசு அவள் அழுதுகொண்டிருப்பதையும், அவளோடு வந்திருந்த யூதர்கள்[a] அழுதுகொண்டிருப்பதையும் கண்டபோது, தமது ஆவியில் ஆழ்ந்த மனக்கிளர்ச்சி அடைந்து[b], தம்மையே கலங்கச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதேயர்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு மரியாளோடு வந்திருந்த யூதர்களே குறிக்கப்படுகின்றனர்; ஒட்டுமொத்த யூத மக்களும் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: இவ்வினைச்சொல் ‘வெகுண்டார்’ அல்லது ‘உள்ளத்தில் கடுமையாகக் கொந்தளித்தார்’ என்ற பொருளையும் தரக்கூடும். இது தீவிரமான உள்ளக் கிளர்ச்சியை வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள தர்க்கரீதியான தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது; வெறும் காலத்தொடரான ‘அப்போது’ என்று குறுக்கவில்லை.
- source_word: ὡς εἶδεν
  choice: கண்டபோது
  rationale: ὡς என்பதன் காலப்பொருளையும், கண்ட நிகழ்வைத் தொடர்ந்து ஏற்பட்ட எதிர்வினையையும் இயல்பான தமிழில் தருகிறது.
- source_word: κλαίουσαν / κλαίοντας
  choice: அழுதுகொண்டிருப்பதையும் / அழுதுகொண்டிருப்பதையும்
  rationale: κλαίω குறிக்கும் வெளிப்படையான அழுகையைச் சொல்கிறது; ‘ஒப்பாரி வைத்தல்’ என்று சடங்குசார்ந்த நுண்பொருளை மிகைப்படுத்துவதில்லை.
- source_word: συνελθόντας αὐτῇ
  choice: அவளோடு வந்திருந்த
  rationale: மரியாளுடன் சேர்ந்து வந்தவர்களைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰουδαίους
  choice: யூதர்கள்
  rationale: நேரடியான இன-சமய அடையாளச் சொல்லைத் தக்கவைக்கிறது; இங்கு எல்லா யூத மக்களும் அல்ல, மரியாளோடு வந்த துக்கங்கொண்டாடியவர்களே குறிக்கப்படுகின்றனர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἐνεβριμήσατο
  choice: கடுமையாகக் கிளர்ந்தெழுந்து
  rationale: ஆழ்ந்த உணர்ச்சி மட்டுமல்லாமல் கடுமையான உள்ளக் கொந்தளிப்பு அல்லது சினம் இருக்கக்கூடிய வினைச்சொல்லின் வலிமையைக் காக்கிறது; உணர்ச்சியின் துல்லியமான தன்மையை முடிவுசெய்யவில்லை.
- source_word: τῷ πνεύματι
  choice: தமது ஆவியில்
  rationale: உணர்ச்சிக் கிளர்ச்சி நிகழ்ந்த உள்ளார்ந்த தளத்தைக் குறிக்கும் கிரேக்க வேற்றுமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐτάραξεν ἑαυτόν
  choice: தம்மையே கலங்கச் செய்தார்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள தன்வினைச் சுட்டைத் தக்கவைத்து, இதை வெறும் ‘கலங்கினார்’ என்ற செயல்படுபொருளற்ற நிலையாக மாற்றாமல் தருகிறது.
theological_decisions:
- issue: ἐνεβριμήσατο என்பதில் இயேசுவின் உணர்ச்சியின் தன்மை
  choice: ‘கடுமையாகக் கிளர்ந்தெழுந்து’ என்று மொழிபெயர்த்து, வலுவான உள்ளக் கொந்தளிப்பைக் காக்கவும் அதன் காரணத்தையோ தன்மையையோ நிர்ணயிக்காமல் விடவும் செய்யப்பட்டுள்ளது.
  alternative: ‘வெகுண்டார்’, ‘ஆழமாக நெகிழ்ந்தார்’, அல்லது ‘மிகவும் கலக்கமடைந்தார்’.
  rationale: இவ்வினைச்சொல் சினம், கடுமையான மனக்கிளர்ச்சி, அல்லது ஆழ்ந்த உணர்ச்சி அசைவு ஆகிய நுண்பொருள்களைத் தாங்கலாம். வசனம் எந்த உணர்ச்சியை முதன்மையாகக் குறிக்கிறது என்பது விவாதத்திற்குரியது; ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் மற்றும் விளக்கவியல் பதற்றத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தமது/தம்மையே’ என்பது இயேசுவைக் குறிக்கும் மரியாதைப் பன்மையையும் கிரேக்கத் தன்வினை அமைப்பையும் காக்கிறது. ஒரே κλαίω வினை இரு குழுக்களுக்கும் பயன்படுத்தப்பட்டிருப்பதால் தமிழிலும் ஒரே சொல்லாக்கம் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
