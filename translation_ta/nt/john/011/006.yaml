id: JHN.11.6
reference: John 11:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: ta
  text: ஆகவே, அவர் நோயுற்றுள்ளார்[a] என்று இயேசு கேள்விப்பட்டபோது, அவர் அப்போது தாம் இருந்த இடத்திலேயே இரண்டு நாட்கள் தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் நோயுற்றிருந்தார்.” கிரேக்கத்தில் இங்கு நிகழ்கால வினை உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: ஆகவே, ... போது
  rationale: οὖν குறிக்கும் முந்தைய சூழலுடனான தொடர்பை ‘ஆகவே’ என்பதும், ὡς என்பதன் காலப்பொருளை ‘போது’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: ἤκουσεν
  choice: கேள்விப்பட்டபோது
  rationale: ἀκούω என்பதன் சாதாரண ‘கேள்’ என்ற பொருளைத் தக்கவைத்து, செய்தி அறிந்த நிகழ்வை இயல்பான தமிழில் சொல்கிறது.
- source_word: ὅτι ἀσθενεῖ
  choice: அவர் நோயுற்றிருக்கிறார்
  rationale: இங்கு ἀσθενέω உடல்நோயைக் குறிக்கிறது. கிரேக்க நிகழ்காலத்தைத் தக்கவைக்கும் ‘நோயுற்றிருக்கிறார்’ என்பது தமிழில் இயல்பாகவும் உள்ளது.
- source_word: τότε μὲν
  choice: அப்போது என்பதைக் தனியே மீளுரைக்காமல், ‘மேலும்’ உடன் நிகழ்வோட்டத்தில் வெளிப்படுத்தப்பட்டது
  rationale: μέν இங்கு மென்மையான வலியுறுத்தலோடு பின்னர் வரும் நிகழ்வை எதிர்நோக்குகிறது. சொற்சொல்லான மீளுரை தமிழில் செயற்கையாக இருப்பதால், தொடர்ச்சியும் தாமதத்தின் வலியுறுத்தலும் இயல்பாகக் காக்கப்பட்டன.
- source_word: ἔμεινεν
  choice: தங்கினார்
  rationale: ஒரு இடத்தில் தொடர்ந்து இருப்பதைக் குறிக்கும் μένω என்பதற்கு இச்சூழலில் இயல்பான தமிழ்.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: தாம் இருந்த இடத்திலேயே
  rationale: கிரேக்கத்தின் இடவலியுறுத்தலை ‘இடத்திலேயே’ காக்கிறது; இயேசுவையே திரும்பச் சுட்டுவதால் மரியாதையான ‘தாம்’ பயன்படுத்தப்பட்டது.
- source_word: δύο ἡμέρας
  choice: இரண்டு நாட்கள்
  rationale: காலநீட்சியைக் குறிக்கும் நேரடியான சொற்றொடர்.
theological_decisions:
- issue: லாசருவின் நோயைக் கேட்ட பிறகும் இயேசு தாமதித்ததன் கதைசார் இறுக்கம்
  choice: அவர் அங்கே மேலும் இரண்டு நாட்கள் தங்கியதாக எந்த விளக்கமோ மென்மைப்படுத்தலோ இன்றி நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அந்தத் தாமதம் கருணையுள்ள திட்டத்தின் பகுதி என்று முதன்மை உரையிலேயே விளக்குதல்.
  rationale: மூல உரை உருவாக்கும் இறையியல் மற்றும் கதைசார் இறுக்கத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை. ‘தாம்’ இயேசுவைத் திரும்பச் சுட்டும் மரியாதைத் தற்சுட்டுப் பெயராகப் பயன்படுத்தப்பட்டுள்ளது; ‘இடத்திலேயே’ என்பது அவர் அங்கிருந்து உடனே புறப்படாததை வலியுறுத்துகிறது.
