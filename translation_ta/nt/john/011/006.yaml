revisions:
- from: ஆகவே, அவர் நோயுற்றிருக்கிறார்[a] என்று இயேசு கேள்விப்பட்டபோது, தாம் இருந்த இடத்திலேயே மேலும் இரண்டு நாட்கள் தங்கினார்.
  to: ஆகவே, அவர் நோயுற்றுள்ளார்[a] என்று இயேசு கேள்விப்பட்டபோது, அவர் அப்போது தாம் இருந்த இடத்திலேயே இரண்டு நாட்கள் தங்கினார்.
  rationale: Removed the unsupported additive «மேலும்», supplied «அப்போது» for τότε, and revised the footnote so that it identifies a genuine Tamil contextual-tense alternative while noting the Greek present tense. The verse continues to state the delay plainly, without explaining or softening it.
