  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: ta
  text: ஆனால் அவர்களில் சிலர் பரிசேயர்களிடம் போய், இயேசு செய்தவற்றை அவர்களுக்குத் தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு செய்ததை அவர்களிடம் எடுத்துச் சொன்னார்கள்.” பரிசேயர்களிடம் சென்றவர்களின் நோக்கம் என்னவென்று கிரேக்க உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: ஆனால் அவர்களில் சிலர்
  rationale: முந்தைய வசனத்தில் நம்பிக்கை கொண்டவர்களுடன் உள்ள வேறுபாட்டை δὲ காட்டுகிறது; τινὲς ἐξ αὐτῶν என்பது முன் குறிப்பிடப்பட்ட கூட்டத்திலிருந்து ஒரு பகுதியினரைக் குறிக்கிறது.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: பரிசேயர்களிடம் போய்
  rationale: ἀπέρχομαι இங்கு நிகழ்விடத்தைவிட்டு பரிசேயர்களிடம் சென்றதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘போய்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἶπαν αὐτοῖς
  choice: அவர்களுக்குத் தெரிவித்தார்கள்
  rationale: λέγω என்ற வினை இச்சூழலில் நடந்தவற்றை எடுத்துச் சொல்வதைக் குறிக்கிறது. ‘தெரிவித்தார்கள்’ என்பது பகைமை நோக்கத்தைச் சேர்க்காமல் அறிக்கையிடும் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: இயேசு செய்தவற்றை
  rationale: நடந்து முடிந்த இயேசுவின் செயல்களைக் குறிக்கும் பன்மை உறவுப்பெயரின் பொருளைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: பரிசேயர்களிடம் சென்றவர்களின் நோக்கம்
  choice: நோக்கத்தைச் சேர்க்காத நடுநிலையான அறிக்கை மொழி
  alternative: இயேசுவுக்கு எதிராக முறையிட்டார்கள் / அவரைக் காட்டிக்கொடுத்தார்கள்
  rationale: கிரேக்க உரை அவர்கள் சென்றதையும் இயேசு செய்தவற்றைத் தெரிவித்ததையும் மட்டுமே கூறுகிறது; அவர்களின் நோக்கம் பகைமையானது என்று இவ்வசனம் வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பரிசேயர்கள்’ என்ற வழக்கமான குழுப்பெயர் பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத பகைமை நோக்கம் சேர்க்கப்படவில்லை.
