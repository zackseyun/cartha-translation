id: JHN.11.57
reference: John 11:57
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: ta
  text: தலைமை ஆசாரியர்களும் பரிசேயர்களும் அவரைப் பிடிப்பதற்காக, அவர் எங்கே இருக்கிறார் என்று யாருக்காவது தெரிந்தால் அதைத் தங்களுக்குத் தெரிவிக்க வேண்டும் என்று உத்தரவிட்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிடிப்பதற்காக” என்பதை இச்சூழலில் “கைது செய்வதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: உத்தரவிட்டிருந்தார்கள்
  rationale: இறந்தகாலக் கதையாடல் நிலையுக்கு முன்பே உத்தரவு கொடுக்கப்பட்டிருந்ததை கிரேக்க முற்றிறந்தகால வடிவம் காட்டுகிறது; தமிழ் முற்றிறந்தகால அமைப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறையைக் காட்டாமல் கதையாடலைத் தொடர்கிறது; தமிழில் செயற்கையான இணைப்புச்சொல் சேர்க்காமல் தொடர்வது இயல்பானது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: இது பல தலைமைக்குருக்களைக் குறிக்காமல், அக்கால யூதச் சமூகத்தின் முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: யூத சமயக் குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἐντολὰς
  choice: உத்தரவிட்டிருந்தார்கள்
  rationale: அதிகாரபூர்வமான கட்டளைகளை வழங்கிய நிர்வாகச் சூழலை ‘உத்தரவு’ தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα ἐάν τις γνῷ
  choice: யாருக்காவது தெரிந்தால் … தெரிவிக்க வேண்டும் என்று
  rationale: உத்தரவின் உள்ளடக்கத்தையும் அதிலுள்ள பொதுவான நிபந்தனையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ποῦ ἐστιν
  choice: அவர் எங்கே இருக்கிறார்
  rationale: கிரேக்கத்தின் நிகழ்காலத்தைத் தமிழிலும் இயல்பாக நேரடியாகக் காக்க முடிகிறது; ஆங்கிலத்தில் தேவைப்படக்கூடிய காலப் பின்னகர்வு தமிழில் தேவையில்லை.
- source_word: μηνύσῃ
  choice: அதைத் தங்களுக்குத் தெரிவிக்க வேண்டும்
  rationale: அதிகாரிகளுக்கு தகவலை அறிவிக்க வேண்டும் என்ற பொருளை வெளிப்படுத்துகிறது; ‘தங்களுக்குத்’ என்பது மறைமுகப் பெறுநர்களான தலைவர்களைத் தெளிவாக்குகிறது.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: அவரைப் பிடிப்பதற்காக
  rationale: நோக்கத்தைத் தெளிவாகக் காட்டுவதோடு, πιάζω என்பதன் பரந்த ‘பிடி/கைப்பற்று’ பொருளையும் காக்கிறது.
