translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் மரியாதைப் பன்மை ஒருமையாக ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; அதிகாரிகளைக் குறிக்கும் ‘தங்களுக்குத்’ என்பதும் சூழலைத் தெளிவாக்குகிறது.
