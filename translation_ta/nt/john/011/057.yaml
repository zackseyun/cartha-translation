  verdict: revise
  source_fidelity: The draft accurately represents the pluperfect ('had issued orders'), the conditional content, Jesus' present location, reporting to the authorities, and the purpose of seizure. However, the Tamil placement of the purpose phrase can attach it to the person reporting rather than to the chief priests and Pharisees, whereas πιάσωσιν is explicitly plural and refers to those authorities.
  naturalness: The register is modern and clear. A small reordering makes the intended agent of 'seize' unambiguous in natural Tamil.
  terminology: ‘தலைமை ஆசாரியர்கள்,’ ‘பரிசேயர்கள்,’ ‘உத்தரவிட்டிருந்தார்கள்,’ and ‘பிடிப்பதற்காக’ are suitable. The alternative ‘கைது செய்வதற்காக’ remains an appropriate contextual footnote, without narrowing the main rendering.
  issues:
  - severity: medium
    issue: Ambiguous controller of ‘அவரைப் பிடிப்பதற்காக’
    rationale: In the draft, the final purpose phrase follows ‘யாருக்காவது ... தெரிவிக்க வேண்டும்’ and may naturally be understood as the informant's purpose in reporting or seizing. The Greek plural πιάσωσιν identifies the chief priests and Pharisees as the intended agents. Reordering the phrase resolves this without adding interpretation.
