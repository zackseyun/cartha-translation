source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: ta
  text: இயேசு அவளிடம், “உயிர்த்தெழுதலும் வாழ்வும் நானே. என்னை நம்புகிறவர் இறந்தாலும் வாழ்வார்,” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: இயேசு அவளிடம் … என்றார்
  rationale: தமிழ் உரையாடல் நடையில் இயல்பான மேற்கோள் அமைப்பைப் பயன்படுத்தி, αὐτῇ என்பதன் பெண்பால் ஒருமையையும் தெளிவாகக் காக்கிறது.
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வலியுறுத்தப்பட்ட Ἐγώ என்பதையும் இணைப்புவினையான εἰμι என்பதையும் இயல்பான தமிழில் வலியுறுத்திக் காட்டுகிறது.
- source_word: ἡ ἀνάστασις
  choice: உயிர்த்தெழுதல்
  rationale: இச்சூழலில் இறந்தோரின் உயிர்த்தெழுதலைக் குறிக்கிறது; வெறும் எழுதல் என்ற பொதுப்பொருளைத் தவிர்க்கிறது.
- source_word: ἡ ζωή
  choice: வாழ்வு
  rationale: ἀνάστασις என்பதற்கு இணையான இயேசுவின் நேரடி சுயஅடையாளக் கூற்றைத் தக்கவைக்கிறது; வெறுமனே ‘வாழ்வை அளிப்பவர்’ என்று விளக்கிவிடவில்லை.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: என்னை நம்புகிறவர்
  rationale: நம்பிக்கையின் தொடர்புமிக்க பொருளையும், பொதுவான ஒருமை நபரைக் குறிக்கும் substantival participle அமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: κἂν ἀποθάνῃ
  choice: இறந்தாலும்
  rationale: κἄν தரும் விட்டுக்கொடுப்பு நிபந்தனையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ζήσεται
  choice: வாழ்வார்
  rationale: கிரேக்கம் கூறும் எதிர்கால ‘வாழ்வார்’ என்ற பரந்த பொருளைக் காக்கிறது; ‘மீண்டும்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ὁ πιστεύων மற்றும் அதைத் தொடரும் ஒருமை வினைகளின் பிரதிநிதித்துவ ஒருமை
  choice: என்னை நம்புகிறவர் இறந்தாலும் வாழ்வார்
  alternative: என்னை நம்புகிற எவரும் இறந்தாலும் வாழ்வார்கள்
  rationale: தமிழில் மரியாதை ஒருமையான ‘வர்/வார்’ பாலினத்தைச் சுட்டாமல் அனைவரையும் உள்ளடக்க முடிவதால், கிரேக்கத்தின் ஒருமையையும் பொதுப்பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- issue: Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή என்பதில் இயேசுவின் சுயஅடையாளக் கூற்று
  choice: உயிர்த்தெழுதலும் வாழ்வும் நானே
  alternative: உயிர்த்தெழுதலையும் வாழ்வையும் அளிப்பவர் நானே
  rationale: மூலத்தின் நேரடி அடையாளக் கூற்றையும் அதன் கிறிஸ்துவியல் அழுத்தத்தையும் காக்கிறது; செயல்பாட்டு விளக்கமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தமிழ் வாக்கிய இயல்புக்கேற்ப ‘நானே’ இறுதியில் வைக்கப்பட்டுள்ளது. ‘நம்புகிறவர்’ என்பது பாலின வேறுபாடின்றி பிரதிநிதித்துவ ஒருமையை இயல்பாக வெளிப்படுத்துவதால் அடிக்குறிப்பு தேவையில்லை.
