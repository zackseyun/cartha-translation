revisions:
- from: ஆகவே அந்தச் சகோதரிகள் அவரிடம் ஆள் அனுப்பி, “ஆண்டவரே, பாருங்கள், நீங்கள் அன்புகூருகிறவர் நோயுற்றிருக்கிறார்” என்று சொல்லச் செய்தார்கள்.
  to: ஆகவே, அந்தச் சகோதரிகள் அவரிடம் செய்தி அனுப்பி, “ஆண்டவரே, இதோ, நீங்கள் நேசிக்கிறவர் நோயுற்றிருக்கிறார்” என்று தெரிவித்தார்கள்.
  rationale: The revision retains the source’s sequence, respectful address, attention-getting «ἴδε», personal affection, and present state of illness. It removes the unnecessary specification of a messenger and the causative wording, rendering the act as sending a message.
