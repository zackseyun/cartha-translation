review_pass:
  verdict: revise
  source_fidelity: The draft communicates the sisters’ message and the illness accurately. However, «ஆள் அனுப்பி ... சொல்லச் செய்தார்கள்» explicitly supplies a messenger and frames the quoted words as something the sisters caused another person to say. The Greek states that the sisters sent to Jesus with this message, without requiring this added causative formulation.
  naturalness: «செய்தி அனுப்பி ... என்று தெரிவித்தார்கள்» is more natural modern standard Tamil for sending a message and avoids the somewhat cumbersome «ஆள் அனுப்பி ... சொல்லச் செய்தார்கள்».
  terminology: «ஆண்டவரே» appropriately renders Κύριε as a respectful direct address. «நேசிக்கிறவர்» naturally conveys φιλεῖς without importing a technical contrast between Greek words for love. «இதோ» is a concise and idiomatic equivalent of ἴδε in this alerting expression.
  issues:
  - severity: medium
    issue: The phrase «ஆள் அனுப்பி ... சொல்லச் செய்தார்கள்» over-specifies the means of communication and uses a causative construction.
    rationale: ἀπέστειλαν ... λέγουσαι indicates that the sisters sent word/message to Jesus, with the following words. It does not explicitly identify a single person or require that the sisters caused a messenger to utter the quotation. A message-based rendering is both closer and more idiomatic.
  revised_text: ஆகவே, அந்தச் சகோதரிகள் அவரிடம் செய்தி அனுப்பி, “ஆண்டவரே, இதோ, நீங்கள் நேசிக்கிறவர் நோயுற்றிருக்கிறார்” என்று தெரிவித்தார்கள்.
  revised_footnotes: []
  revision_rationale: The revision retains the source’s sequence, respectful address, attention-getting «ἴδε», personal affection, and present state of illness. It removes the unnecessary specification of a messenger and the causative wording, rendering the act as sending a message.
