id: JHN.11.3
reference: John 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ta
  text: ஆகவே, அந்தச் சகோதரிகள் அவரிடம் செய்தி அனுப்பி, “ஆண்டவரே, இதோ, நீங்கள் நேசிக்கிறவர் நோயுற்றிருக்கிறார்” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν λέγουσαι
  choice: அவரிடம் ஆள் அனுப்பி ... சொல்லச் செய்தார்கள்
  rationale: சகோதரிகள் தாங்களே சென்றார்கள் என்று பொருள்படாமல், ஒருவர்மூலம் செய்தி அனுப்பிய செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதைமிக்க விளிப்பைத் தக்கவைக்கிறது.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் கட்டளை வடிவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὃν φιλεῖς
  choice: நீங்கள் அன்புகூருகிறவர்
  rationale: φιλέω என்பதன் தனிப்பட்ட பாசத்தை வெளிப்படுத்துகிறது; இங்கு வேறு கிரேக்க அன்புச் சொல்லுடனான வேறுபாட்டை மிகைப்படுத்தவில்லை.
- source_word: ἀσθενεῖ
  choice: நோயுற்றிருக்கிறார்
  rationale: தற்போது நோய்வாய்ப்பட்டிருக்கும் நிலையை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: φιλέω என்ற வினையின் மொழிபெயர்ப்பு
  choice: அன்புகூருகிறவர்
  alternative: நேசிக்கிறவர்
  rationale: இயேசுவின் தனிப்பட்ட பாசத்தைப் பாதுகாக்கும் பொதுவான, கண்ணியமான சொல்; குறிப்பிட்ட கோட்பாட்டு வேறுபாட்டை இறக்குமதி செய்யவில்லை.
- issue: ἴδε என்பதின் செயல்பாடு
  choice: பாருங்கள்
  alternative: இதோ
  rationale: மூலத்தின் இரண்டாம் நபர் கட்டளைத் தன்மையைத் தக்கவைக்கிறது; அது வெறும் அறிமுகச் சொல்லாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதைப் பன்மை மூலம் இயேசுவை நோக்கிய உரை இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அந்தச் சகோதரிகள்’ என்பது முன் வசனங்களில் அறிமுகமான மரியாளையும் மார்த்தாளையும் குறிக்கிறது.
