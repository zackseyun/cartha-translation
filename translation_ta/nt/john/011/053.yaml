base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ta
  text: அதனால், அந்த நாளிலிருந்து அவர்கள் அவரைக் கொல்லத் திட்டமிட்டனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: அந்த நாள்முதல்
  rationale: ἀπό உடன் வரும் காலக் குறிப்பு, அன்றிலிருந்து தொடங்கிய தொடர்ச்சியான நிலையைச் சுட்டுகிறது. ‘அந்த நாள்முதல்’ என்பது இதை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய ஆலோசனையின் விளைவாக நிகழ்ந்த தீர்மானத்தை οὖν இணைக்கிறது; ‘ஆகவே’ அதன் காரணவிளைவு தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐβουλεύσαντο
  choice: திட்டமிட்டார்கள்
  rationale: இவ்விடத்தில் இந்த வினை ஆலோசித்து ஒரு திட்டத்தை வகுத்ததைக் குறிக்கிறது. ‘திட்டமிட்டார்கள்’ என்பது வெறும் எண்ணம் அல்லது கலந்துரையாடல் என்பதைக் காட்டிலும் உறுதியான சதிநோக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα ἀποκτείνωσιν
  choice: கொல்ல
  rationale: ἵνα உடன் வரும் வினை இங்கு திட்டத்தின் நோக்கம் அல்லது உள்ளடக்கத்தைத் தெரிவிக்கிறது. ‘கொல்ல’ என்பது ἀποκτείνω என்பதன் நேரடியான பொருளை, நீதிமன்ற நடைமுறை போன்ற கூடுதல் கருத்துகளைச் சேர்க்காமல் தருகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இப்பெயர்ப்பதிலி உடனடியான சூழலில் இயேசுவைக் குறிக்கிறது. மரியாதை ஒருமைக்கேற்ற ‘அவரை’ இயல்பான தமிழாகும்; மூலத்தில் பெயர் இல்லாததால் ‘இயேசுவை’ என்று வெளிப்படையாகச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான தலைவர்களின் நோக்கத்தின் தன்மை
  choice: இயேசுவைக் கொல்ல அவர்கள் உறுதியான திட்டம் வகுத்ததாக மொழிபெயர்த்தல்
  alternative: அவரைக் கொல்வது குறித்து அவர்கள் ஆலோசித்தார்கள் / அவரைக் கொல்லலாமா என்று சிந்தித்தார்கள்
  rationale: கிரேக்க வாக்கியம் முந்தைய ஆலோசனைக்குப் பின் ஏற்பட்ட தீர்மானகரமான சதித்திட்டத்தைக் காட்டுகிறது. ஆகவே நோக்கத்தின் தீவிரத்தை மென்மைப்படுத்தாமலும், சட்ட அல்லது கோட்பாட்டுச் சார்ந்த கூடுதல் விளக்கத்தைப் புகுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் காரணவிளைவு தொடர்பும், அன்றிலிருந்து தொடர்ந்த கொலைத்திட்டமும் பாதுகாக்கப்பட்டுள்ளன.
