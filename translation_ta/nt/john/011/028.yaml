id: JHN.11.28
reference: John 11:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: ta
  text: இதைச் சொன்னபின், அவள் அங்கிருந்து சென்று, தன் சகோதரி மரியாளைத் தனியாக அழைத்து, “ஆசிரியர் இங்கே இருக்கிறார்; உன்னை அழைக்கிறார்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: இதைச் சொன்னபின்
  rationale: இறந்தகாலப் பங்கேற்புவினையும் τοῦτο என்பதையும் இயல்பான தமிழில் காலவரிசையைக் காட்டுமாறு மொழிபெயர்க்கிறது.
- source_word: ἀπῆλθεν
  choice: அவள் போய்
  rationale: அவ்விடத்திலிருந்து சென்றதைக் குறிக்கிறது; தொடரும் வினையுடன் இணைந்து இயல்பான தமிழ் நடையை அளிக்கிறது.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: தன் சகோதரி மரியாளைத் தனியாக அழைத்து
  rationale: மரியாள் அவளுடைய சகோதரி என்பதைத் தெளிவாகக் காட்டுகிறது; φωνέω இங்கு ஒருவரை வருமாறு அழைப்பதைக் குறிக்கிறது.
- source_word: λάθρᾳ
  choice: தனியாக
  rationale: பிறர் கேட்காதவாறு தனிப்பட்ட முறையில் பேசியதை இயல்பாகத் தெரிவிக்கிறது; மறைமுகமான அல்லது வஞ்சகமான நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: Ὁ διδάσκαλος
  choice: போதகர்
  rationale: διδάσκαλος என்பதன் கற்பிப்பவர் என்ற நேரடி பொருளையும் மரியாதைத் தலைப்பின் தன்மையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: πάρεστιν
  choice: இங்கே இருக்கிறார்
  rationale: ஒருவர் இப்போது அருகில் வந்திருந்து இருப்பதை நேரடியான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: φωνεῖ σε
  choice: உன்னை அழைக்கிறார்
  rationale: நிகழ்கால வடிவைப் பாதுகாத்து, மரியாளைத் தம்மிடம் வருமாறு இயேசு அழைக்கிறார் என்ற சூழலுக்குரிய பொருளை இயல்பாக அளிக்கிறது.
theological_decisions:
- issue: διδάσκαλος என்ற இயேசுவின் பட்டப்பெயர்
  choice: போதகர்
  alternative: ஆசிரியர்; எஜமான்
  rationale: மூலச்சொல்லின் முதன்மைப் பொருள் கற்பிப்பவர் என்பதாகும். ‘எஜமான்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத அதிகார அல்லது உரிமை நுணுக்கத்தைச் சேர்க்கக்கூடும்; ‘போதகர்’ இச்சூழலில் இயேசுவுக்கான மரியாதைத் தலைப்பாக இயல்பாக அமைகிறது.
- issue: λάθρᾳ என்பதன் நுணுக்கம்
  choice: தனியாக
  alternative: இரகசியமாக
  rationale: சுற்றியிருந்தவர்கள் கேட்காதவாறு தனிப்பட்ட முறையில் தெரிவிப்பதை இது காட்டுகிறது; வஞ்சகம், பயம், அல்லது மறைக்க வேண்டிய நோக்கம் இருந்ததாக உரை கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நிகழ்வுவரிசை காக்கப்பட்டாலும், பங்கேற்புவினைகள் தமிழுக்கு இயல்பான தொடர்வினை அமைப்பில் தரப்பட்டுள்ளன.
