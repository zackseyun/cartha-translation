base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: ta
  text: ஆகவே, இயேசு வந்துகொண்டிருக்கிறார்[a] என்று மார்த்தாள் கேள்விப்பட்டபோது, அவரைச் சந்திக்கச் சென்றாள்; ஆனால் மரியாள் வீட்டில் உட்கார்ந்திருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு வருகிறார்.” கிரேக்கத்தில், அவள் கேட்ட செய்தியில் நிகழ்கால வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதைத் தொடர்பையும் விளைவையும் இயல்பாகக் காட்டுகிறது.
- source_word: ὡς
  choice: கேள்விப்பட்டதும்
  rationale: காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; ‘உடனே’ என்ற கூடுதல் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: ἤκουσεν
  choice: கேள்விப்பட்டாள்
  rationale: ἀκούω என்பதன் நேரடியான பொருளைப் பேணுகிறது; இச்சூழலில் தகவலைக் கேட்டறிந்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔρχεται
  choice: வந்துகொண்டிருக்கிறார்
  rationale: மறைமுகக் கூற்றிலுள்ள கிரேக்க நிகழ்காலத்தையும், இயேசு அப்போது அணுகிக்கொண்டிருந்த தொடர்நிலையையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: ὑπήντησεν
  choice: சந்திக்கச் சென்றாள்
  rationale: ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்லும் திசைநோக்கிய நுண்பொருளைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வெளியே’ என்பதைச் சேர்க்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: மார்த்தாளின் செயலுக்கும் மரியாளின் நிலைக்கும் இடையிலான மென்மையான மாறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: ἐν τῷ οἴκῳ
  choice: வீட்டில்
  rationale: மூலத்தின் இடக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκαθέζετο
  choice: உட்கார்ந்திருந்தாள்
  rationale: இறந்தகாலத்தில் தொடர்ந்திருந்த நிலையைக் காட்டும் imperfect வடிவின் அம்சத்தைப் பேணுகிறது; ‘அங்கேயே இருந்தாள்’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: மார்த்தாள் / மரியாள் / இயேசு
  rationale: நவீனத் தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
