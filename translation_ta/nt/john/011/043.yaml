  source_fidelity: மூலத்தின் ταῦτα பன்மைச் சுட்டு ‘இவற்றை’ எனவும், முன்னுரிமை காட்டும் εἰπών ‘சொன்ன பின்பு’ எனவும் சரியாக வழங்கப்பட்டுள்ளது. φωνῇ μεγάλῃ ἐκραύγασεν என்பதன் உரத்த அழைப்புத் தன்மை ‘உரத்த குரலில் … கூப்பிட்டார்’ என்பதில் பாதுகாக்கப்படுகிறது. δεῦρο ἔξω என்பதன் நேரடியான, வலுவான கட்டளை ‘வெளியே வா!’ என்பதும் துல்லியமானது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. மேற்கோளுக்குள் உள்ள அழைப்பு தெளிவாகவும் தாக்கமிக்கதாகவும் உள்ளது. ‘லாசருவே’ என்ற அழைப்புவேற்றுமை இயல்பானது.
  terminology: ‘லாசருவே’ என்பது பெயருக்கும் அழைப்புவேற்றுமைக்கும் பொருத்தமான வடிவம். ‘உரத்த குரலில்’ மற்றும் ‘வெளியே வா’ ஆகியவை மூலத்தின் வலிமையையும் எளிய நவீன நடையையும் காக்கின்றன; தேவையற்ற இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
