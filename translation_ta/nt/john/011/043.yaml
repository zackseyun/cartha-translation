  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: ta
  text: இவற்றைச் சொன்ன பின்பு, அவர் உரத்த குரலில், “லாசருவே, வெளியே வா!” என்று கூப்பிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மை நடுநிலைச் சுட்டுப்பெயரின் பொருளைத் தக்கவைத்து, முந்தைய சொற்களை இயல்பாகச் சுட்டுகிறது.
- source_word: εἰπὼν
  choice: சொன்ன பின்பு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவத்தின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: குரலின் வலிமையையும் ஒலியளவையும் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ἐκραύγασεν
  choice: கூப்பிட்டார்
  rationale: உரத்த குரலில் அழைத்தல் என்ற வினையின் பொருளை, முன்வரும் ‘உரத்த குரலில்’ என்பதுடன் தேவையற்ற மீளுரையின்றி இயல்பாகத் தருகிறது.
- source_word: Λάζαρε
  choice: லாசருவே
  rationale: பெயரின் அழைப்புவேற்றுமையைத் தமிழின் ‘-வே’ வடிவால் தெளிவாகக் காட்டுகிறது.
- source_word: δεῦρο ἔξω
  choice: வெளியே வா
  rationale: ஒருவரைத் தம்மிடம் வெளியே வரும்படி அழைக்கும் வலுவான கட்டளையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: பாரம்பரிய உயர்நடைச் சொல்லாக்கத்தைச் சேர்க்காமல் அற்புதக் கட்டளையை மொழிபெயர்த்தல்
  choice: வெளியே வா
  alternative: வெளிப்பட்டு வா
  rationale: δεῦρο ἔξω என்பதன் நேரடியான அழைப்பை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது; மூலத்தில் இல்லாத பழமையான அல்லது தனிப்பட்ட இறையியல் நுணுக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான, உரத்த கட்டளையின் வலிமையைத் தக்கவைக்கும் நடை. மூலத்தின் பன்மைச் சுட்டும் செயல் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
