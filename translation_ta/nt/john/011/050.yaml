source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: ta
  text: ஒரு மனிதன் மக்களுக்காக[a] இறப்பது, தேசம் முழுவதும் அழிவதைவிட உங்களுக்கு நன்மையானது என்பதையும் நீங்கள் கருத்தில் கொள்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்கள் சார்பாக’; இந்தச் சொற்றொடர் ‘மக்களுக்குப் பதிலாக’ என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: ὑπέρ என்பதன் பிரதிநிதித்துவம், நன்மை, மற்றும் பதிலீடு சார்ந்த பொருள் வாய்ப்புகளைப் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: οὐδὲ
  choice: என்பதைக்கூட … இல்லை
  rationale: முந்தைய கண்டனத்துடன் இணையும் எதிர்மறைத் தொடர்ச்சியையும், ‘இதைக்கூட எண்ணவில்லை’ என்ற வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λογίζεσθε
  choice: சிந்தித்துப் பார்ப்பதில்லை
  rationale: கணக்கிட்டு ஆராய்தல் அல்லது பரிசீலித்தல் என்ற பொருளை, இங்குள்ள அரசியல் சார்ந்த ஆலோசனைச் சூழலில் இயல்பாகத் தருகிறது.
- source_word: συμφέρει
  choice: நன்மையானது
  rationale: சுயநல அல்லது நடைமுறை ஆதாயம் என்ற கருத்தைத் தெளிவாகக் காட்டுகிறது; ‘பயனுள்ளது’ என்பதைக் காட்டிலும் இவ்வாக்கிய அமைப்பில் இயல்பாக உள்ளது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: ஆதாயம் பெறுபவரைக் குறிக்கும் வேற்றுமைப் பொருளையும் காய்பாவின் கூற்றிலுள்ள சுயநல நோக்கையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἵνα
  choice: இறப்பதும் … அழிந்துபோகாமல் இருப்பதுமே
  rationale: எது நன்மையானது என்ற உட்பொருளைத் தமிழில் பெயரெச்சத் தொழிற்பெயர் அமைப்பால் இயல்பாகத் தருகிறது.
- source_word: εἷς ἄνθρωπος
  choice: ஒரே ஒரு மனிதன்
  rationale: ஒரு தனி மனிதனை முழுத் தேசத்தோடு எதிரெதிராக நிறுத்தும் கிரேக்கத்தின் ஒருமை வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἀποθάνῃ
  choice: இறப்பதும்
  rationale: ἵνα சார்ந்த துணைவாக்கியத்தின் நிகழ்வைத் தமிழில் இயல்பான தொழிற்பெயர் வடிவில் தருகிறது; தேவையற்ற சாத்தியப்பாட்டு நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: மக்களுக்காக
  rationale: மக்களின் நன்மைக்காக, அவர்கள் சார்பாக, அல்லது அவர்களுக்குப் பதிலாக என்ற நுணுக்கங்களை முன்கூட்டியே ஒன்றாகக் குறுக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: λαοῦ
  choice: மக்கள்
  rationale: இச்சூழலில் உடன்படிக்கை மற்றும் தேசியக் குழுவாகிய யூத மக்களைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: ὅλον τὸ ἔθνος
  choice: தேசம் முழுவதும்
  rationale: அரசியல்-இன முழுமையாகிய தேசத்தைக் குறிக்கிறது; இங்கு ‘புறவினத்தார்’ என்ற பொருள் இல்லை.
- source_word: ἀπόληται
  choice: அழிந்துபோகாமல்
  rationale: முழுமையான அழிவு அல்லது நாசம் என்ற தீவிரத்தைப் பாதுகாக்கிறது; அழிவின் குறிப்பிட்ட முறையைத் தேவையின்றி வரையறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் மரணத்துடன் தொடர்புடைய ὑπέρ என்பதன் பொருள்
  choice: முதன்மை உரையில் பரந்த பொருளுடைய ‘மக்களுக்காக’
  alternative: ‘மக்கள் சார்பாக’ அல்லது ‘மக்களுக்குப் பதிலாக’
  rationale: காய்பா உடனடியாக அரசியல் ஆதாயத்தைப் பேசுகிறார்; ஆனால் யோவான் 11:51 அவரது சொற்களை அவர் அறியாமலேயே உரைத்த தீர்க்கதரிசனமாகக் காட்டுகிறது. ஆகவே இந்த மொழிபெயர்ப்பு உடனடி அரசியல் பொருளையும் ஆழமான பலி/பதிலீட்டு ஒலியையும் கட்டாயமாக ஒன்றில் அடக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஒரே ஒரு மனிதன்’ என்பதும் ‘தேசம் முழுவதும்’ என்பதும் மூலத்தில் உள்ள தனி மனிதன்–முழுத் தேசம் என்ற எதிர்நிலையைத் தெளிவாகப் பாதுகாக்கின்றன. அடிக்குறிப்பு குறியீடு உரையில் உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
