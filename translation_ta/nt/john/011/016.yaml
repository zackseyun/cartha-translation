  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: ta
  text: எனவே, திதிமு என்று அழைக்கப்பட்ட தோமா[a] தன் சக சீடர்களிடம், “அவரோடு இறக்கும்படி நாமும் போவோம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: திதிமு என்பது கிரேக்கப் பெயர்; அதாவது, ‘இரட்டையன்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் தர்க்கரீதியான தொடர்ச்சியை இயல்பாகக் குறிக்கிறது.
- source_word: Θωμᾶς
  choice: தோமா
  rationale: தனிப்பெயரைத் தமிழில் நிலைபெற்ற வேதாகம மரபுப்படி ஒலிபெயர்க்கிறது.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: திதிமு என்று அழைக்கப்பட்ட
  rationale: Δίδυμος என்பதைப் பெயர் வடிவில் ஒலிபெயர்த்து, அதன் ‘இரட்டையர்’ என்ற பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: τοῖς συμμαθηταῖς
  choice: தன் உடன் சீடர்களிடம்
  rationale: Thomas உடன் சீடத்துவத்தில் இருப்பவர்களைக் குறிக்கும் சொல்லை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: நாமும் போவோம்
  rationale: முதல் நபர் பன்மை ஏவல் சார்ந்த subjunctive-ஐத் தமிழின் கூட்டழைப்பு வடிவில் தருகிறது; καὶ ἡμεῖς என்பதன் உள்ளடக்க வலியுறுத்தலை ‘நாமும்’ காக்கிறது.
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: அவரோடு இறப்போம்
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘அவரோடு’ என்பது இயேசுவைக் குறிக்கிறது, ஆனால் உரையில் பெயரைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தோமாவின் கூற்றின் தொனியும் நோக்கமும்
  choice: கூற்றை விளக்க நிறம் சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: துணிச்சலான விசுவாசம், விதிவசமான மனச்சோர்வு, அல்லது நையாண்டிப் pessimism எனத் தெளிவுபடுத்துதல்
  rationale: கிரேக்க உரை தோமாவின் உளநிலையையோ தொனியையோ வெளிப்படையாக நிர்ணயிக்கவில்லை; ஆகவே அந்தப் பொருள் மயக்கத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: ἵνα கூறின் நோக்கம்/விளைவு உறவு
  choice: தமிழில் இயல்பான இணைப்பால் நோக்கத்தை உணர்த்துதல்
  alternative: ‘அதனால் நாம் அவரோடு இறக்கும்படி’ என்று வடிவரீதியாக வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: ‘நாமும் போவோம்; அவரோடு இறப்போம்’ என்பது நோக்கத் தொடர்பை சூழலில் தெளிவாக வைத்தபடியே இயல்பான தமிழாக உள்ளது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன; தோமாவின் மனநிலையை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
