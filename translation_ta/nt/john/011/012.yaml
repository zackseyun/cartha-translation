  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: ta
  text: எனவே சீடர்கள் அவரிடம், “ஆண்டவரே, அவன் தூங்கிவிட்டால்[a], நலம் பெறுவான்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “தூங்கப் போயிருந்தால்” என்றும் மொழிபெயர்க்கலாம். இயேசு லாசருவின் மரணத்தை உறக்கம் என்று உருவகமாகக் கூறினார்; சீடர்களோ அதைச் சாதாரண உறக்கம் என்று புரிந்துகொண்டார்கள்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான கிரேக்க வினைச்சொல்லை “காப்பாற்றப்படுவான்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு அது நோயிலிருந்து மீண்டு நலம் பெறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: எனவே
  rationale: இயேசுவின் முந்தைய கூற்றிலிருந்து சீடர்கள் செய்த முடிவைச் சுட்டுகிறது; தமிழில் இயல்பான தர்க்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: கிரேக்கத்தில் உள்ள குறிப்புச் சுட்டு சூழலில் தெளிவாக இருப்பதால், தமிழில் ‘சீடர்கள்’ என்பதே இயல்பாகவும் போதுமானதாகவும் உள்ளது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: மூலத்தில் பெயருக்குப் பதிலாகச் சுட்டுப்பெயர் உள்ளது; சூழலில் அது இயேசுவைக் குறிக்கிறது. மரியாதைமிக்க தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: நேரடி அழைப்பில் மரியாதையையும் யோவான் நற்செய்தியின் கிறிஸ்துவியல் ஒலியையும் தக்கவைக்கிறது.
- source_word: εἰ
  choice: -ஆல் / இருந்தால்
  rationale: சீடர்கள் முன்வைக்கும் நேரடியான நிபந்தனையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κεκοίμηται
  choice: தூங்கிவிட்டிருந்தால்
  rationale: Perfect வடிவின் விளைவுநிலையை வெளிப்படுத்துவதோடு, சீடர்கள் அதை சாதாரண உறக்கமாகப் புரிந்துகொண்டதை முதன்மை உரையில் காக்கிறது.
- source_word: σωθήσεται
  choice: நலம் பெறுவான்
  rationale: நோயின் சூழலில் σῴζω உடல்நலம் மீள்வதைக் குறிக்கிறது. ‘நலம் பெறுவான்’ என்பது இரட்சிப்பு என்ற தேவையற்ற பொருளை முதன்மை உரையில் புகுத்தாமல் இயல்பாக உள்ளது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா / போதகரே
  rationale: மரியாதைமிக்க நேரடி அழைப்பையும், யோவான் நற்செய்தியில் இருக்கக்கூடிய ஆழமான கிறிஸ்துவியல் பொருளையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- issue: κεκοίμηται என்பதிலுள்ள உறக்கம்/மரணம் என்ற இரட்டைப் பொருள்
  choice: முதன்மை உரையில் சாதாரண உறக்கத்தைக் குறிக்கும் மொழி
  alternative: இளைப்பாறிக்கொண்டிருந்தால்
  rationale: இயேசு மரணத்தை உறக்கமாக உருவகித்ததை சீடர்கள் நேரடி அர்த்தத்தில் தவறாகப் புரிந்துகொள்வதே இங்குள்ள கதைநிகழ்வு. அதனைத் தொடர்ந்து வரும் வசனங்கள் தெளிவுபடுத்த அனுமதிக்கப்படுகிறது.
- issue: σωθήσεται என்பதன் இரட்சிப்பு/உடல்நலம் மீட்பு பொருள்
  choice: நலம் பெறுவான்
  alternative: காப்பாற்றப்படுவான்
  rationale: நோயுற்ற லாசருவைப் பற்றிய சீடர்களின் கருத்தில் உடல்நலம் மீள்வதே உடனடிப் பொருள்; இருப்பினும் மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆண்டவரே’ என்பது பாரம்பரிய வேதாகமச் செறிவைத் தக்கவைக்கிறது; மற்ற சொற்றொடர்கள் தற்போதைய இயல்பான தமிழில் அமைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
