source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: ta
  text: அந்த தேசத்திற்காக மட்டுமல்ல,[a] சிதறிக்கிடக்கும் கடவுளின் பிள்ளைகளையும் ஒன்றாகச் சேர்ப்பதற்காகவும் அவர் இறப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலமொழியில் இந்த வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடர்கிறது; எனவே, ‘அவர் இறப்பார்’ என்பது அங்கிருந்து இங்கே வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது. ‘அந்த தேசம்’ என்பது இச்சூழலில் யூத தேசத்தைக் குறிக்கிறது.
    reason: contextual_and_cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: தேசம்
  rationale: உடனடிச் சூழலில் இது யூத தேசத்தைக் குறிக்கிறது; ஒருமைச் சமூகப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἵνα
  choice: சேர்ப்பதற்காகவும்
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα கூறை இயல்பான தமிழில் வினைப்பெயர் அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: τέκνα τοῦ θεοῦ
  choice: கடவுளின் பிள்ளைகள்
  rationale: τέκνα பாலினத்தைச் சுருக்காத ‘பிள்ளைகள்’ என்பதைக் குறிக்கிறது.
- source_word: διεσκορπισμένα
  choice: சிதறியிருக்கிற
  rationale: சிதறடிக்கப்பட்டதன் விளைவாகத் தொடரும் நிலையைக் காட்டும் perfect passive participle-இன் பொருளைத் தக்கவைக்கிறது.
- source_word: συναγάγῃ
  choice: சேர்ப்பார்
  rationale: ἵνα நோக்கக் கூறுக்குள் வரும் செயலை, முந்தைய வசனத்திலிருந்து தொடரும் ‘அவர் இறப்பார்’ என்ற கருத்தோடு இயல்பாக இணைக்கிறது.
- source_word: εἰς ἕν
  choice: ஒன்றாக
  rationale: ‘ஒரே உடலாக’ அல்லது ‘ஒற்றுமைக்குள்’ என்று விளக்கிச் சேர்க்காமல், கிரேக்கத்தின் சுருக்கத்தையும் பரந்த பொருளையும் காக்கிறது.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: அந்த தேசத்திற்காக மட்டுமல்ல ... -ஐயும்
  rationale: முந்தைய வசனத்தில் உள்ள இயேசுவின் இறப்பைத் தொடர்ந்து, ὑπέρ என்பதன் ‘சார்பாக/நலனுக்காக’ என்ற பொருளை ‘-க்காக’ மூலம் தருகிறது; தமிழ் எதிர்மறை இணைப்பை இயல்பாக அமைக்கிறது.
theological_decisions:
- issue: ‘கடவுளின் பிள்ளைகள்’ என்பவர்களின் அடையாளம்
  choice: யூத தேசத்தைத் தாண்டி, சிதறியுள்ள கடவுளின் மக்களை இயேசுவின் மரணம் ஒன்றாகச் சேர்க்கும் என்ற பரந்த குறிப்பாகவே விடப்பட்டுள்ளது.
  alternative: இவர்கள் புலம்பெயர்ந்த யூதர்கள் மட்டுமே; அல்லது யூதர் மற்றும் பிற இனத்தவரிலுள்ள தேர்ந்தெடுக்கப்பட்ட விசுவாசிகள் என்று குறிப்பாக வரையறுத்தல்.
  rationale: கிரேக்கம் ‘தேசம்’ என்பதையும் பரந்த சிதறிய குழுவையும் வேறுபடுத்தினாலும், அந்தக் குழுவின் துல்லியமான எல்லையை வரையறுக்கவில்லை.
- issue: வசனத்தில் வெளிப்படையாக இல்லாத ‘இறப்பார்’ என்பதன் சேர்க்கை
  choice: தமிழில் முழுமையான வாக்கியமாகவும் முந்தைய வசனத்தின் தொடர்ச்சியைத் தெளிவாக்கவும் ‘அவர் இறப்பார்’ சேர்க்கப்பட்டுள்ளது.
  alternative: ‘அந்த தேசத்திற்காக மட்டுமல்ல, ... ஒன்றாகச் சேர்ப்பதற்காகவும்’ என்று சார்பு வாக்கியமாக மட்டும் விடுதல்.
  rationale: கிரேக்க வசனம் 51ஆம் வசனத்தின் ‘இயேசு இறக்கவிருந்தார்’ என்ற வினைக்கருத்தைத் தொடர்ந்து நிற்கிறது. சேர்க்கை புதிய கருத்தை உருவாக்காமல் அந்த மறைந்த வினையை வெளிப்படுத்துகிறது; இதற்கான குறிப்பு வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘ஒன்றாக’ என்பது εἰς ἕν-இன் திட்டமிட்ட சுருக்கத்தைப் பாதுகாக்கிறது. ‘சிதறியிருக்கிற’ தொடரும் சிதறிய நிலையைக் காட்டுகிறது.
