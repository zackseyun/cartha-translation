  source_fidelity: 'மூலத்தின் நிகழ்வுத் தொடரும் கால உறவும் துல்லியமாகக் காக்கப்பட்டுள்ளன: மரியா இயேசு இருந்த இடத்திற்கு வருதல், அவரைக் காணுதல், அவரது காலடியில் விழுதல், பின்னர் கடந்தகால உண்மைக்கு மாறான நிபந்தனையைச் சொல்லுதல் அனைத்தும் சரியாகத் தரப்பட்டுள்ளன. “இறந்திருக்க மாட்டான்” என்பது εἰ + imperfect / οὐκ ἄν + aorist அமைப்பின் கடந்தகால எதிர்மறை விளைவுக்கு இயல்பான தமிழ் வடிவமாகும்.'
