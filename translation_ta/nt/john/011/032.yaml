  terminology: இயேசுவை நோக்கிய κύριε என்பதற்கு “ஆண்டவரே” என்பது திட்டத்தின் இயல்புநிலைத் தேர்வுடனும் யோவான் நற்செய்தியின் மொழிநடையுடனும் பொருந்துகிறது. இது மரியாவின் அழைப்பை முழுமையான கோட்பாட்டு அறிக்கையாக மிகைப்படுத்தவில்லை; “ஐயா” என்ற சாத்தியமான மாற்றை அடிக்குறிப்பு சமநிலையாகக் குறிப்பிடுகிறது. மரியாதைப் பன்மையான “நீர்/அவருடைய” பயன்பாடும் பொருத்தமானது.
