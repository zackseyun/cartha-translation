reference: John 11:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: ta
  text: ஆகவே மரியா, இயேசு இருந்த இடத்துக்கு வந்து அவரைக் கண்டபோது, அவருடைய காலடியில் விழுந்து, “ஆண்டவரே[a], நீர் இங்கே இருந்திருந்தால் என் சகோதரன் இறந்திருக்க மாட்டான்” என்று அவரிடம் சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் κύριε மரியாதையான அழைப்பாகவும் பயன்படலாம்; இங்கு அது “ஆண்டவரே” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதைத் தொடர்பையும் அதன் விளைவையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: ὡς ἦλθεν ὅπου ἦν Ἰησοῦς
  choice: இயேசு இருந்த இடத்துக்கு வந்து
  rationale: ὡς என்பதன் காலத் தொடர்பையும் ὅπου என்பதன் இடப் பொருளையும் சுருக்கமின்றித் தெளிவாகத் தருகிறது.
- source_word: ἰδοῦσα αὐτόν
  choice: அவரைக் கண்டபோது
  rationale: சூழ்நிலைப் பங்கேற்புவினையை இயல்பான தமிழ்க் காலத் தொடராக வழங்குகிறது.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: அவருடைய காலடியில் விழுந்து
  rationale: இயேசுவின் காலடியில் விழுந்த செயலை இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் தெரிவிக்கிறது; அது வழிபாடா அல்லது துயரத்தில் சரிந்துவிழுதலா என்பதைத் தனியாகத் தீர்மானிப்பதில்லை.
- source_word: λέγουσα αὐτῷ
  choice: என்று அவரிடம் சொன்னாள்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் பங்கேற்புவினையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்ற அழைப்பின் மரியாதையையும் யோவான் நற்செய்தியில் அதற்கிருக்கக்கூடிய ஆழமான பொருளையும் காக்கிறது.
- source_word: εἰ ἦς ὧδε
  choice: நீர் இங்கே இருந்திருந்தால்
  rationale: கடந்தகால உண்மைக்கு மாறான நிபந்தனையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: இறந்திருக்க மாட்டான்
  rationale: கடந்தகால உண்மைக்கு மாறான விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μου ὁ ἀδελφός
  choice: என் சகோதரன்
  rationale: மூலத்திலுள்ள உடைமைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பை மொழிபெயர்த்தல்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இந்தச் சொல் வெறும் மரியாதை அழைப்பாகவும் அமையலாம்; எனினும் ‘ஆண்டவரே’ என்பது அதன் இறையியல் மற்றும் கதைசார் நிறையை மங்கச் செய்யாமல் காக்கிறது. அதேவேளை மரியாவின் நோக்கத்தை முழுமையான இறையியல் அறிக்கையாகத் தீர்மானித்து விடாமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இயேசுவைச் சுட்டும் மரியாதைப் பன்மை தமிழ் வழக்குக்கு ஏற்ப பயன்படுத்தப்பட்டது. மரியாவின் கூற்றின் துயரமும் கடந்தகால உண்மைக்கு மாறான நிபந்தனையும் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளன.
