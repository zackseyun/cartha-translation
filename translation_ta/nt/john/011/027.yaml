id: JHN.11.27
reference: John 11:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: ta
  text: அவள் அவரிடம், “ஆம், ஆண்டவரே; நீரே மெசியா[a], தேவனுடைய மகன், உலகத்திற்கு வருகிறவர்[b] என்று நான் நம்பியிருக்கிறேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டமான Χριστός (கிறிஸ்தோஸ்), “அபிஷேகம் செய்யப்பட்டவர்” என்ற பொருளுடைய “மெசியா” என்பதற்கு இணையானது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உலகத்திற்கு வருபவர்.” கிரேக்க நிகழ்கால வினையெச்சம் வருகையின் இயக்கத்தையோ, வருகிறவர் என்ற நிலையான அடையாளத்தையோ வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: அவள் அவரிடம் … என்றாள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது. சூழலிலிருந்து எழுவாய் மார்த்தாள் என்பது தெளிவாகிறது.
- source_word: Ναί
  choice: ஆம்
  rationale: நேரடியான உறுதிப்படுத்தும் பதிலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: இது வெறும் மரியாதை அழைப்பாக மட்டுமல்லாமல், இயேசுவைப் பற்றிய மார்த்தாளின் விசுவாச அறிக்கையின் சூழலில் பயபக்தியையும் அடையாளங்காணுதலையும் வெளிப்படுத்துகிறது.
- source_word: πεπίστευκα
  choice: நான் நம்பியிருக்கிறேன்
  rationale: கிரேக்க நிறைவுக்காலம், முன்பே உருவான நம்பிக்கை இப்போதும் நிலைத்திருப்பதைச் சுட்டுகிறது; தமிழ் நிறைவுநிலை வடிவம் அந்தத் தொடரும் விளைவைப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: காரணத்தை அல்ல, நம்பிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு பெயர்போல அல்ல, அபிஷேகம் செய்யப்பட்ட எதிர்பார்க்கப்பட்ட அரசர்-மீட்பரைக் குறிக்கும் பட்டமாக வருகிறது; ‘மெசியா’ அந்தப் பொருளைப் பாதுகாக்கிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: உறுதியான கிறிஸ்துவியல் பட்டத்தைத் துல்லியமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: உலகத்திற்கு வருகிறவர்
  rationale: பெயர்ச்சொல் மதிப்பில் வரும் நிகழ்கால வினையெச்சத்தை இயல்பான தமிழ் தொடர்பெயர் அமைப்பில் தருகிறது; இயேசுவை உலகத்திற்கு வரும் எதிர்பார்க்கப்பட்டவராக அடையாளப்படுத்துகிறது.
- source_word: κόσμον
  choice: உலகம்
  rationale: யோவான் நற்செய்தியில் மனித வாழ்வின் உலகத்தைப் பொதுவாகக் குறிக்கும் இயல்பான இணைச்சொல் இதுவாகும்.
theological_decisions:
- issue: Χριστός என்ற அறிக்கைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனம் இயேசுவின் அடையாளத்தைப் பற்றிய முறையான அறிக்கை. பட்டத்தின் யூத எதிர்பார்ப்பு மற்றும் அபிஷேகிக்கப்பட்டவர் என்ற கருத்தை ‘மெசியா’ தெளிவாகப் பாதுகாக்கிறது; பழக்கமான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: κύριε என்ற அழைப்பின் வலிமை
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: மெசியாவும் தேவனுடைய மகனுமாக இயேசுவை அறிக்கையிடும் உடனடி சூழலில், ‘ஆண்டவரே’ என்பது பயபக்தி நிறைந்த வலிமையைப் பாதுகாக்கிறது; அதே நேரத்தில் வசனம் கூறுவதைக் கடந்து மேலதிக விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: πεπίστευκα என்பதன் நிறைவுக்கால அம்சம்
  choice: நான் நம்பியிருக்கிறேன்
  alternative: நான் நம்புகிறேன்
  rationale: முன்னரே ஏற்பட்ட நம்பிக்கையின் விளைவு தற்போது தொடர்வதைத் தமிழ் நிறைவுநிலை வடிவம் எடுத்துக்காட்டுகிறது.
- issue: ἐρχόμενος என்பதன் நிகழ்கால வினையெச்சப் பொருள்
  choice: உலகத்திற்கு வருகிறவர்
  alternative: உலகத்திற்கு வருபவர்
  rationale: முதல் வடிவம் கிரேக்க நிகழ்காலத்தின் இயக்க உணர்வைத் தக்கவைக்கிறது; மாற்று வடிவம் எதிர்பார்க்கப்பட்டவரின் நிலையான அடையாளத்தை வலியுறுத்தலாம். மூலத்தின் சாத்தியமான இரு நுணுக்கங்களும் திறந்தவையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம அறிக்கைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நீரே’ என்பது வலியுறுத்தப்பட்ட σὺ என்பதையும் மரியாதை ஒருமையையும் தருகிறது. வாக்கியத்தின் அறிக்கைத் தன்மையும் மூலத்தின் பட்டங்களின் வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
