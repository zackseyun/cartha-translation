  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: ta
  text: இயேசு, “கல்லை அகற்றுங்கள்” என்றார். இறந்தவரின்[a] சகோதரியான மார்த்தா அவரிடம், “ஆண்டவரே, ஏற்கெனவே அவனிடமிருந்து துர்நாற்றம் வீசுகிறது; ஏனெனில் அவன் இறந்து நான்கு நாட்கள் ஆகிவிட்டன[c]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்துபோனவரின்.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “அவன் நான்காம் நாள் மனிதன்”; அதாவது, அவன் இறந்து நான்கு நாட்கள் ஆகிவிட்டன.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε τὸν λίθον
  choice: கல்லை அகற்றுங்கள்
  rationale: αἴρω என்பதன் பன்மை ஏவல் வடிவம் அங்கிருந்தவர்களிடம் கல்லை அப்புறப்படுத்தும்படி கூறுகிறது. கல்லறைச் சூழலில் ‘கல்லை அகற்றுங்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τοῦ τετελευτηκότος
  choice: இறந்துபோனவரின்
  rationale: τελευτάω என்பதன் நிறைவுநிலைப் பெயரெச்சம் இறந்துவிட்ட நிலையில் உள்ளவரைக் குறிக்கிறது. ‘இறந்துபோனவர்’ அந்த நிகழ்வையும் அதன் தொடரும் நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος இங்கு இயேசுவை நோக்கிய மரியாதையும் ஆழ்ந்த அங்கீகாரமும் கொண்ட அழைப்பு. ‘ஆண்டவரே’ அதன் யோவான் நற்செய்திசார் நிறையைப் பாதுகாக்கிறது.
- source_word: ἤδη ὄζει
  choice: இப்போது நாற்றமடிக்குமே
  rationale: ἤδη தற்போதைக்குள் அந்த நிலை ஏற்பட்டிருப்பதைக் குறிக்கிறது; ὄζει நாற்றம் வீசுவதைச் சொல்கிறது. ‘நாற்றமடிக்குமே’ மார்த்தாவின் தயக்கத்தையும் சூழலின் விரும்பத்தகாத மணத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: அவன் இறந்து நான்கு நாட்கள் ஆகிவிட்டன
  rationale: τεταρταῖος என்பதன் சொற்சுருக்கமான கிரேக்க வடிவத்தைத் தெளிவான நவீன தமிழில் விரித்து மொழிபெயர்க்கிறது; γάρ தரும் விளக்கக் காரணம் அரைப்புள்ளியின் மூலம் இயல்பாக இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: மார்த்தா இயேசுவை κύριος என்று அழைப்பது
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இந்தச் சூழலில் அது வெறும் மரியாதை அழைப்பாக மட்டும் இருக்கக்கூடும் என்ற சாத்தியத்தை முற்றிலும் நீக்காமல், யோவான் நற்செய்தியில் இயேசுவுக்குக் கொடுக்கப்படும் ‘ஆண்டவர்’ என்ற ஆழமான பொருளையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, பொதுநிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரையாடல் இயல்பாக இருக்க ‘நாற்றமடிக்குமே’ என்ற வடிவம் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் பன்மை ஏவல் ‘அகற்றுங்கள்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது. இறந்த சகோதரனைப் பற்றிய மார்த்தாவின் நேரடி பேச்சில் இயல்பான ‘அவன்’ பயன்படுத்தப்பட்டுள்ளது.
