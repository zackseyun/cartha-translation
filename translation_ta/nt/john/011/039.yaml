revisions:
- from: இயேசு, “கல்லை அகற்றுங்கள்” என்றார். இறந்துபோனவரின்[a] சகோதரியான மார்த்தா அவரிடம், “ஆண்டவரே, இப்போது நாற்றமடிக்குமே[b]; அவன் இறந்து நான்கு நாட்கள் ஆகிவிட்டன[c]” என்றாள்.
  to: இயேசு, “கல்லை அகற்றுங்கள்” என்றார். இறந்தவரின்[a] சகோதரியான மார்த்தா அவரிடம், “ஆண்டவரே, ஏற்கெனவே அவனிடமிருந்து துர்நாற்றம் வீசுகிறது; ஏனெனில் அவன் இறந்து நான்கு நாட்கள் ஆகிவிட்டன[c]” என்றாள்.
  rationale: The revision renders ἤδη as “ஏற்கெனவே,” retains the present force of ὄζει with “துர்நாற்றம் வீசுகிறது,” and expresses γάρ with “ஏனெனில்.” It preserves the plural command, Martha's relationship to the deceased, and the respectful rendering of κύριε. Footnote c is corrected to explain the Greek idiom accurately. Footnote b is omitted because the revised main text already explicitly gives the contextual unpleasant sense, and no additional Tamil lexical alternative is needed.
