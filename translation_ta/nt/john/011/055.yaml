base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: ta
  text: யூதர்களின் பஸ்கா பண்டிகை[a] நெருங்கியிருந்தது. பஸ்கா பண்டிகைக்கு முன்பாகத் தங்களைத் தூய்மைப்படுத்திக்கொள்வதற்காக[b], நாட்டுப்புறத்திலிருந்து பலர் எருசலேமுக்கு ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதப் பஸ்கா’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் இன்னும் சொல்லுக்குச் சொல்லாக, ‘யூதர்களின் பஸ்கா’ என்று உள்ளது; யோவான் நூலில் இந்தச் சொற்றொடர் மீண்டும் மீண்டும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பஸ்கா பண்டிகைக்காக ஆயத்தமாகும் வகையில் சடங்குமுறைத் தூய்மைப்படுத்தலை மேற்கொள்வதற்காக.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: நெருங்கியிருந்தது (தனி இணைப்புச்சொல் இன்றி)
  rationale: δέ இங்கு மென்மையான உரை இணைப்பாக உள்ளது; தமிழில் தேவையற்ற எதிர்மறைத் திருப்பையோ வெளிப்படையான காலக் குறிப்பையோ சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் அதன் பணி வெளிப்படுகிறது.
- source_word: ἐγγὺς
  choice: நெருங்கியிருந்தது
  rationale: இங்கு கால அளவில் ‘அருகில் இருந்தது’ என்பதே பொருள்; நவீன தமிழில் ‘நெருங்கியிருந்தது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: யூதர்களின் பஸ்கா பண்டிகை
  rationale: மூலத்தின் உருபுடைமை அமைப்பைத் தெளிவாகப் பேணுகிறது; ‘பண்டிகை’ என்பது ‘பஸ்கா’வை பொதுவாசகர் உடனடியாகப் புரிந்துகொள்ள உதவுகிறது.
- source_word: ἀνέβησαν
  choice: ஏறிச் சென்றார்கள்
  rationale: எருசலேமுக்குச் செல்லும் புவியியல் உயர்வையும் வழக்கமான யாத்திரைச் சொல்லாட்சியையும் பேணுகிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்தப் பன்மை உருபை இயல்பான தமிழில் சுருக்கமாக வழங்குகிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: நகரத்தை நோக்கிய பயணத்தின் திசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐκ τῆς χώρας
  choice: நாட்டுப்புறத்திலிருந்து
  rationale: நகரத்திற்கு வெளியேயுள்ள ஊரகப் பகுதிகளைச் சுட்டும் χώρα என்பதன் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: πρὸ τοῦ πάσχα
  choice: பஸ்கா பண்டிகைக்கு முன்பாக
  rationale: கால உறவை நேராகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: தங்களைத் தூய்மைப்படுத்திக்கொள்வதற்காக
  rationale: ἵνα கூறும் நோக்கத்தையும் ἑαυτούς கூறும் தற்சுட்டுப் பொருளையும் பேணுகிறது; சடங்குசார் பின்னணியை முதன்மை உரையில் அளவுக்கு மீறி விளக்கவில்லை.
theological_decisions:
- issue: பஸ்காவுக்கு முன் செய்யப்படும் தூய்மைப்படுத்தலின் தன்மை
  choice: தங்களைத் தூய்மைப்படுத்திக்கொள்வதற்காக
  alternative: சடங்குமுறைப்படி தங்களைத் தூய்மைப்படுத்திக்கொள்வதற்காக
  rationale: சூழலில் இது பஸ்காவுக்கான யூதச் சடங்குசார் ஆயத்தத்தைக் குறிக்கிறது. முதன்மை உரை ‘தூய்மை’ என்ற மூலத்தின் சொல்லைத் தக்கவைத்து, பின்னாளைய கிறிஸ்தவச் சடங்கு அல்லது உள்ளார்ந்த ஒழுக்கத் தூய்மை என்ற குறிப்பிட்ட கருத்தைத் திணிக்கவில்லை; வரலாற்றுப் பின்னணி அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘பஸ்கா’ என்ற பரவலான வேதாகமச் சொல்லுடன் புரிதலுக்காக ‘பண்டிகை’ சேர்க்கப்பட்டுள்ளது. ‘ஏறிச் சென்றார்கள்’ என்பது எருசலேமுக்கான பயணத்தின் மூலமொழி நுணுக்கத்தைப் பேணுகிறது.
