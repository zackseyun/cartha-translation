  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: ta
  text: ஆனால், ஒருவன் இரவில் நடந்தால், ஒளி அவனுக்குள் இல்லாததால் இடறுகிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒளி அவனோடு இல்லை’ என்றும் மொழிபெயர்க்கலாம். ஆனால் கிரேக்கத்தில் இன்னும் நேரடியாக ‘அவனுக்குள் இல்லை’ என்று உள்ளது; இது வெளிப்புற ஒளி இல்லாமையைத் தாண்டிய பொருளையும் சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: ஆனால், ஒருவன் … நடந்தால்
  rationale: δέ குறிக்கும் முந்தைய வசனத்துடனான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; ἐὰν உடைய நிபந்தனைப் பொருளை ‘நடந்தால்’ தருகிறது; τις என்பதன் பொதுவான, வரையறுக்கப்படாத மனிதக் குறிப்பை ‘ஒருவன்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: περιπατῇ ἐν τῇ νυκτί
  choice: இரவில் நடந்தால்
  rationale: περιπατέω என்பதன் நேரடியான ‘நட’ உருவகத்தைத் தக்கவைத்து, யோவான் எழுத்தில் இருக்கக்கூடிய மறைபொருளையும் திறந்தவாறே வைக்கிறது. ‘இரவில்’ என்பது νύξ-ஐ முன்கூட்டியே ‘இருள்’ என்று விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: προσκόπτει
  choice: இடறுகிறான்
  rationale: உடல்சார்ந்த தடுமாற்றத்தையும் உருவகமான வீழ்ச்சியையும் ஏற்கும் இயல்பான தமிழ் சொல்.
- source_word: ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ
  choice: அவனுக்குள் ஒளி இல்லாததால்
  rationale: ὅτι-யின் காரணப்பொருளை ‘இல்லாததால்’ தெரிவிக்கிறது. ἐν αὐτῷ என்பதன் நேரடியான ‘அவனுக்குள்’ பொருளைத் தக்கவைத்து, வெளிப்புற ஒளியின்மை மட்டுமல்லாமல் உள்ளார்ந்த ஒளியையும் சுட்டக்கூடிய யோவானிய இரட்டைப் பொருளைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஒளி அவனுக்குள் இல்லை’ என்பதன் குறிப்பு மற்றும் வலிமை
  choice: ‘அவனுக்குள் ஒளி இல்லை’ என்ற உள்ளார்ந்த சொற்றொடரைத் தக்கவைத்தல்
  alternative: ‘அவனிடம் ஒளி இல்லை’ அல்லது ‘அவனோடு ஒளி இல்லை’ என்று வெளிப்புற வெளிச்சம் இல்லாத நிலையைக் குறிப்பது
  rationale: கிரேக்க ἐν αὐτῷ இயல்பாக ‘அவனுக்குள்’ என்று பொருள்படும். யோவானில் ஒளி–இருள் உருவகம் ஆன்மீக ஆழத்தையும் கொண்டிருக்கலாம்; ஆகவே இதை வெறும் வெளிப்புற வெளிச்சமாகவோ முழுக்க ஆன்மீகமாகவோ குறுக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘நடந்தால்’, ‘இடறுகிறான்’ ஆகியவை நேரடியான காட்சியையும் உருவகத் திறனையும் காக்கின்றன. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
