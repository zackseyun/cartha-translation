reference: John 11:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: ta
  text: நீங்கள் நம்பும்படியாக, நான் அங்கே இல்லாதிருந்தது உங்கள் நன்மைக்காக எனக்கு மகிழ்ச்சி அளிக்கிறது. ஆனால், நாம் அவனிடம் போவோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρω
  choice: எனக்கு மகிழ்ச்சி
  rationale: நிகழ்கால உணர்வை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘நான் மகிழ்கிறேன்’ என்பதைக் காட்டிலும் இச்சூழலில் சரளமாக உள்ளது.
- source_word: δι’ ὑμᾶς
  choice: உங்கள் நன்மைக்காக
  rationale: διά + குற்றுவேற்றுமை இங்கு சீடர்களுக்குக் கிடைக்கும் நன்மையைச் சுட்டுகிறது; வெறும் காரணப் பொருளாகத் தோன்றக்கூடிய ‘உங்களால்’ என்பதைத் தவிர்க்கிறது.
- source_word: ἵνα πιστεύσητε
  choice: நீங்கள் நம்பும்படிக்கே
  rationale: ἵνα உடன் வரும் aorist subjunctive நோக்கத்தைக் காட்டுகிறது. ‘நம்ப’ என்ற வினை யோவானின் நடைக்கு இயல்பானது; தொடக்கநிலைப் பொருளை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: நான் அங்கே இல்லாதிருந்தது
  rationale: ὅτι அறிமுகப்படுத்தும் மகிழ்ச்சியின் உள்ளடக்கத்தையும், இறந்தகால நிலையாகிய οὐκ ἤμην என்பதையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀλλὰ ἄγωμεν
  choice: ஆனால் வாருங்கள், நாம் ... போவோம்
  rationale: ἀλλά காட்டும் திருப்பத்தையும், ἄγωμεν என்பதன் முதலாம் நபர் பன்மை ஊக்குவிப்பு/அழைப்பு வலிமையையும் தமிழில் தெளிவாகத் தருகிறது.
- source_word: πρὸς αὐτόν
  choice: அவனிடம்
  rationale: ஒரு நபரை நோக்கிய இயக்கத்தை இயல்பான தமிழில் குறிக்கிறது; சூழலில் சுட்டுப்பெயரின் குறிப்பு தெளிவாக உள்ளது.
theological_decisions:
- issue: யோவான் சூழலில் πιστεύσητε என்பதன் வலிமை
  choice: நம்பும்படிக்கே
  alternative: நம்பிக்கை கொள்ளும்படிக்கே
  rationale: aorist subjunctive நம்பிக்கைக்குள் வருதலைக் குறிக்கக்கூடும்; ஆனால் சீடர்கள் இதற்கு முன் நம்பாதவர்கள் என்ற வலுவான முடிவை வசனம் கட்டாயப்படுத்தவில்லை. ஆகவே பொதுவான ‘நம்ப’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘அவனிடம்’ என்பது மூலத்தின் சுட்டுப்பெயரைப் பாதுகாக்கிறது. நோக்கம் மற்றும் நம்பிக்கையின் தொடக்கநிலை குறித்த மூலமொழி நுட்பம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
