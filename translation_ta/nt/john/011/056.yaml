  source_fidelity: The draft accurately represents the ongoing actions (ἐζήτουν, ἔλεγον), reciprocal conversation, the temple precincts (ἱερόν), and the emphatic negation οὐ μή. The question form preserves the Greek's conversational uncertainty without forcing a particular expected answer.
