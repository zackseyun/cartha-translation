source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: ta
  text: ஆகவே அவர்கள் இயேசுவைத் தேடிக்கொண்டிருந்தார்கள்; ஆலய வளாகத்தில் நின்றபடி, ஒருவருக்கொருவர், “உங்களுக்கு என்ன தோன்றுகிறது? அவர் பண்டிகைக்கு வரவே மாட்டாரா?”[a] என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வரவே மாட்டாரா?” என்பது கிரேக்கத்தில் வலியுறுத்தப்பட்ட மறுப்பாக உள்ளது; “அவர் பண்டிகைக்கு ஒருபோதும் வர மாட்டார் என்று நினைக்கிறீர்களா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: தேடிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாமல் தொடர்ந்த செயலைக் காட்டும் இறந்தகால வடிவத்தின் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய சூழலிலிருந்து வரும் கதைத் தொடர்ச்சியையும் விளைவையும் குறிக்கிறது.
- source_word: ἔλεγον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: தொடர்ந்து அல்லது பலமுறை பேசப்பட்டதை இறந்தகாலத் தொடர்வினை வடிவில் காட்டுகிறது; நேரடி உரை கேள்விகளாக இருப்பதால் ‘கேட்டுக்கொண்டிருந்தார்கள்’ இயல்பாக உள்ளது.
- source_word: μετ’ ἀλλήλων
  choice: ஒருவருக்கொருவர்
  rationale: குழுவினரிடையே நிகழ்ந்த பரஸ்பர உரையாடலைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலயத்தின் முழு வளாகத்தையும் குறிக்கிறது.
- source_word: ἑστηκότες
  choice: நின்றபடி
  rationale: அவர்கள் நின்ற நிலையில் பேசிக்கொண்டிருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: உங்களுக்கு என்ன தோன்றுகிறது?
  rationale: கருத்தைக் கேட்கும் கிரேக்கச் சொற்றொடரின் இயல்பான, மரியாதையான தமிழ் வடிவம்.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: அவர் பண்டிகைக்கு வரவே மாட்டாரா?
  rationale: ὅτι அறிமுகப்படுத்தும் கருத்தைக் கேள்வியின் தொடர்ச்சியாகத் தருகிறது; ‘வரவே மாட்டார்’ என்பது οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς τὴν ἑορτήν
  choice: பண்டிகைக்கு
  rationale: சூழலில் பஸ்கா பண்டிகையைக் குறிக்கும் ἑορτή என்பதற்கு பொதுவாகப் புரியும், இயல்பான தமிழ்.
theological_decisions:
- issue: οὐ μή உடைய வலியுறுத்தப்பட்ட மறுப்பு கேள்விக்குள் எவ்வாறு புரியப்பட வேண்டும்
  choice: “அவர் பண்டிகைக்கு வரவே மாட்டாரா?” என்று எதிர்பார்ப்பும் ஐயமும் கலந்த நேரடிக் கேள்வியாக வழங்கப்பட்டது.
  alternative: “அவர் பண்டிகைக்கு நிச்சயமாக வர மாட்டார் என்று நினைக்கிறீர்களா?”
  rationale: கிரேக்கத்தின் வலுவான மறுப்பைக் காக்கும் அதேவேளையில், கேள்வியின் சரியான எதிர்பார்ப்பைத் தேவையின்றித் தீர்மானிக்காமல் அதன் உரையாடல் சார்ந்த ஐயத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலய வளாகம்’ என்பதே ἱερόν மற்றும் ναός ஆகியவற்றுக்கிடையிலான வேறுபாட்டை உரையிலேயே தெளிவாக்குவதால் தனி பண்பாட்டு அடிக்குறிப்பு தேவையில்லை.
