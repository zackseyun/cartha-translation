  terminology: “ஆலய வளாகம்” appropriately distinguishes ἱερόν, the temple complex, from the inner sanctuary. “பண்டிகை” is a natural rendering of ἑορτή. “வரவே மாட்டாரா?” idiomatically conveys the force of the emphatic negative in the question.
