  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: ta
  text: ஆகவே அவர்கள் அந்தக் கல்லை அகற்றினார்கள். இயேசு தம் கண்களை மேலே உயர்த்தி[a], “தந்தையே, நீர் எனக்குச் செவிகொடுத்ததற்காக[b] உமக்கு நன்றி செலுத்துகிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலே பார்த்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் என்னைக் கேட்டதற்காக.” கிரேக்க அஓரிஸ்ட் வினை வடிவத்தை இவ்வாறும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: அகற்றினார்கள்
  rationale: கல்லறையின் வாயிலிலிருந்த கல்லை அப்புறப்படுத்திய செயலைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது; வெறுமனே ‘தூக்கினார்கள்’ என்பது செயலை முழுமையாகக் காட்டாது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கட்டளையின் விளைவாக அவர்கள் செய்ததைச் சுட்டும் தர்க்கரீதியான கதைத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: τὸν λίθον
  choice: அந்தக் கல்லை
  rationale: கல்லறையை மூடியிருந்த, ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட கல்லை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: தம் கண்களை மேலே உயர்த்தி
  rationale: மேல்நோக்கிப் பார்ப்பதைக் குறிக்கும் கிரேக்க உருவகத்தைப் பாதுகாக்கிறது; தமிழிலும் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: Πάτερ
  choice: தந்தையே
  rationale: நேரடியான விளிவேற்றுமை அழைப்பையும் ஜெபத்தின் நெருக்கத்தையும் மரியாதையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: εὐχαριστῶ σοι
  choice: உமக்கு நன்றி செலுத்துகிறேன்
  rationale: நிகழ்கால நன்றியறிதலைக் கண்ணியமான, பொதுவாகப் புரியும் தமிழில் தெரிவிக்கிறது.
- source_word: ὅτι ἤκουσάς μου
  choice: நீர் எனக்குச் செவிகொடுத்ததற்காக
  rationale: வெறுமனே ஒலி கேட்டது என்பதைக் காட்டிலும், ஜெபத்தை ஏற்றுக் கேட்டதைக் குறிக்கும் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; இதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: இயேசு இறைவனை ஜெபத்தில் அழைக்கும் முறை
  choice: தந்தையே
  alternative: தந்தையே! / ஓ தந்தையே
  rationale: கிரேக்க விளி அழைப்பை நேரடியாகப் பாதுகாக்கிறது; தேவையற்ற வழிபாட்டு அலங்காரத்தையோ பழமையான நடையையோ சேர்க்கவில்லை.
- issue: ἤκουσάς μου என்பதன் ஜெபச் சூழல் பொருள்
  choice: நீர் எனக்குச் செவிகொடுத்ததற்காக
  alternative: நீர் நான் சொன்னதைக் கேட்டதற்காக
  rationale: பிதா இயேசுவின் வேண்டுதலை ஏற்றுக் கேட்டார் என்ற வசனத்தின் கருத்தைத் தெரிவிக்கிறது; அது எவ்வாறு நிகழ்ந்தது அல்லது அதன் விரிவான இறையியல் விளைவுகள் என்ன என்பவற்றை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஜெபச் சூழலுக்குரிய கண்ணியத்தைப் பேண ‘நீர்/உமக்கு’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் இயல்பாக இருக்கும்போதும், கண்களை மேலே உயர்த்துதல் என்ற மூலமொழி உருவகம் தக்கவைக்கப்பட்டுள்ளது.
