reference: John 11:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: ta
  text: எனவே, தலைமை ஆசாரியர்களும் பரிசேயர்களும் ஒரு மன்றத்தைக்[a] கூட்டி, “நாம் என்ன செய்கிறோம்? ஏனெனில், இந்த மனிதன் பல அடையாளங்களைச் செய்கிறான்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சன்ஹெட்ரின்,” யூதர்களின் ஆட்சிமன்றம்.
    reason: சυνέδριον என்பது பொதுவாக ஒரு மன்றத்தைக் குறிக்கலாம்; இச்சூழலில் அது யூதர்களின் தலைமை ஆட்சிமன்றமான சன்ஹெட்ரினைக் குறிக்கவும் வாய்ப்புள்ளது.
lexical_decisions:
- source_word: συνήγαγον
  choice: கூட்டி
  rationale: இறந்தகாலச் செயலை இயல்பான தமிழில் காட்டுகிறது; συνέδριον என்பதைக் கருமப் பொருளாகக் கொண்ட ‘மன்றத்தைக் கூட்டினர்’ என்ற பொருளையும் தெளிவாகத் தருகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்வின் விளைவாக இந்த நடவடிக்கை எடுக்கப்பட்டதைச் சுட்டுகிறது; தர்க்கத் தொடர்பையும் கதையோட்டத்தையும் காக்கிறது.
- source_word: ἀρχιερεῖς
  choice: முதன்மைக் குருக்கள்
  rationale: இது ஒரே தலைமைக் குருவைக் குறிக்காமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மைச் சொல்லாக இருப்பதை வெளிப்படுத்துகிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவுக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: συνέδριον
  choice: ஒரு மன்றம்
  rationale: மூலத்தில் பெயர்ச்சொல்லுடன் சுட்டுருபு இல்லாததை மிகையாகத் தீர்மானிக்காமல் காக்கிறது. இது யூத ஆட்சிமன்றத்தைக் குறிக்கக்கூடிய வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔλεγον
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது பரிமாற்றமான பேச்சு நயத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: Τί ποιοῦμεν
  choice: நாம் என்ன செய்துகொண்டிருக்கிறோம்?
  rationale: மூலத்தின் நிகழ்கால வினாவைத் தக்கவைத்து, தங்களது செயலின்மையைப் பற்றிய பதற்றத்தையும் சூழலில் உணர்த்துகிறது; ‘நாம் என்ன செய்ய வேண்டும்?’ என்று வெளிப்படையாக மாற்றவில்லை.
- source_word: ὅτι
  choice: …கிறானே!
  rationale: தமிழில் காரணத்தையும் அவசரமான உணர்வையும் இயல்பாக வெளிப்படுத்தும் ஏகார அமைப்பு பயன்படுத்தப்பட்டுள்ளது; தனியாக ‘ஏனெனில்’ சேர்ப்பது நேரடி உரையில் செயற்கையாக ஒலிக்கும்.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: இந்த மனிதன்
  rationale: பேசுகிறவர்கள் இயேசுவைக் குறிப்பிடும் நேரடியான, ஓரளவு இகழ்வுநயம் கொண்ட சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: பல அடையாளச் செயல்களைச் செய்துகொண்டிருக்கிறான்
  rationale: யோவான் நூலில் σημεῖα என்பது இயேசுவின் அடையாளத்தை வெளிப்படுத்தும் செயல்களைக் குறிக்கும் நயத்தைப் பாதுகாக்கிறது. நிகழ்காலத் தொடர்ச்சியும் தமிழில் வெளிப்படுகிறது.
theological_decisions:
- issue: யோவான் நூலில் σημεῖα என்பதன் மொழிபெயர்ப்பு
  choice: அடையாளச் செயல்கள்
  alternative: அற்புதங்கள்; அற்புத அடையாளங்கள்
  rationale: இயேசுவின் செயல்கள் வெறும் வல்லமையான அற்புதங்களாக மட்டுமல்லாமல், அவருடைய அடையாளத்தைச் சுட்டும் வெளிப்படுத்தும் செயல்களாகவும் இருப்பதை இச்சொல் காக்கிறது; ‘அற்புத’ என்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- issue: συνέδριον என்பதன் நிறுவன அடையாளம்
  choice: ஒரு மன்றம்
  alternative: சன்ஹெட்ரின்; அந்த மன்றம்
  rationale: மூலச்சொல்லின் பொதுவான பொருளை முதன்மை உரையில் வைத்துக் கொண்டு, அது எருசலேமின் யூத ஆட்சிமன்றத்தைக் குறிக்கலாம் என்ற வரலாற்று அடையாளத்தை அடிக்குறிப்பில் வழங்குகிறது; மூலத்தின் வடிவம் அனுமதிப்பதைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மன்றத்தைக் கூட்டி’ மற்றும் ‘பேசிக்கொண்டிருந்தார்கள்’ ஆகியவை இயல்பான தமிழையும் கிரேக்க வினைகளின் செயற்பாங்கையும் இணைக்கின்றன. நேரடி உரையின் பதற்றத்தை ஏகார வாக்கிய முடிவு இயல்பாக வெளிப்படுத்துகிறது.
