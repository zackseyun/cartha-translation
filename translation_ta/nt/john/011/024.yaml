source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: ta
  text: மார்த்தா அவரிடம், “கடைசி நாளில் நடைபெறும் உயிர்த்தெழுதலில்[a] அவன் உயிர்த்தெழுவான் என்று எனக்குத் தெரியும்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிர்த்தெழுதலில், கடைசி நாளில்.”
    reason: கிரேக்கத்தில் உள்ள இரண்டு ἐν சொற்றொடர்களை இணையான காலக் குறிப்புகளாகப் புரிந்துகொள்ளும் மாற்று அமைப்பு.
lexical_decisions:
- source_word: λέγει
  choice: என்றாள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், நவீனத் தமிழ் கதைநடையில் உரையாடலை இயல்பாக அறிமுகப்படுத்த இறந்தகாலப் பெண்பால் வடிவம் பொருத்தமானது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: பேச்சின் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் காட்டுகிறது; இயேசுவைக் குறிக்கும் மரியாதைப் பன்மையும் காக்கப்படுகிறது.
- source_word: ἡ Μάρθα
  choice: மார்த்தா
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Οἶδα
  choice: எனக்குத் தெரியும்
  rationale: மார்த்தாவின் உறுதியான அறிவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀναστήσεται
  choice: அவன் உயிர்த்தெழுவான்
  rationale: எதிர்கால வடிவத்தையும் உயிர்த்தெழுதல் சூழலையும் காக்கிறது; கிரேக்க வினையின் பார்வையைத் தேவையின்றி செயப்பாட்டுவினையாக மாற்றவில்லை.
- source_word: ἐν τῇ ἀναστάσει
  choice: நிகழும் உயிர்த்தெழுதலில்
  rationale: ἐν என்பதன் கால/நிகழ்வு சார்ந்த பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; 'உயிர்த்தெழுதல்' என்பது பொதுவான இறுதிக்கால நிகழ்வைக் குறிக்கிறது.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: கடைசி நாளில்
  rationale: குறிப்பிட்ட இறுதி நாளைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: இறுதிக்கால உயிர்த்தெழுதல் குறிப்பு
  choice: “கடைசி நாளில் நிகழும் உயிர்த்தெழுதல்” என எதிர்காலப் பொதுவான உயிர்த்தெழுதல் நிகழ்வைத் தெளிவாகக் குறித்தல்.
  alternative: மரணத்துக்குப் பிந்தைய வாழ்வைப் பற்றிய பொதுவான நம்பிக்கை என மங்கலாக மொழிபெயர்த்தல்.
  rationale: ἀναστήσεται, ἀνάστασις ஆகிய இரட்டை உயிர்த்தெழுதல் மொழியும் “கடைசி நாள்” என்ற குறிப்பும் இறுதிக்கால உயிர்த்தெழுதலைச் சுட்டுகின்றன; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விவரங்கள் சேர்க்கப்படவில்லை.
- issue: இரு ἐν சொற்றொடர்களின் தொடர்பு
  choice: “கடைசி நாளில் நிகழும் உயிர்த்தெழுதலில்” என்று ‘கடைசி நாள்’ உயிர்த்தெழுதலை வரையறுப்பதாக முதன்மை உரையில் அமைத்தல்.
  alternative: “உயிர்த்தெழுதலில், கடைசி நாளில்” என்று இரு காலச் சொற்றொடர்களையும் இணையாக வைத்தல்.
  rationale: கிரேக்கத்தில் இரு ἐν சொற்றொடர்களின் துல்லியமான தொடரியல் தொடர்பில் சிறு நெகிழ்வு உள்ளது. முதன்மை வடிவம் தமிழில் இயல்பாக உள்ளது; மேலும் சொற்தொடர் அமைப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “அவரிடம்” இயேசுவுக்குரிய மரியாதை வழக்கைத் தக்கவைக்கிறது; மேற்கோளுக்குள் லாசரைக் குறிக்க “அவன்” பயன்படுத்தப்பட்டுள்ளது. இறுதிக்காலக் குறிப்பின் தனித்தன்மை காக்கப்பட்டாலும் கூடுதல் சமயப் பிரிவுசார் விளக்கங்கள் சேர்க்கப்படவில்லை.
