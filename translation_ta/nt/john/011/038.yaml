  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: ta
  text: அப்போது இயேசு[a] மீண்டும் தமக்குள் ஆழமாகக் கலங்கியவராய் கல்லறைக்கு வந்தார். அது ஒரு குகை; அதன் வாயிலுக்கு எதிராக ஒரு கல் வைக்கப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்குள் சீற்றமடைந்தவராய்” அல்லது “தமக்குள் மிகவும் கலங்கியவராய்.” கிரேக்க வினைச்சொல் மிகுந்த வலிமையுடையது; அது துயரத்தை மட்டும் அல்லாமல் வேறொரு தீவிரமான உணர்ச்சியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய நிகழ்விலிருந்து கதையின் தொடர்ச்சியையும் விளைவையும் இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய சூழலில் காணப்பட்ட இயேசுவின் தீவிர உணர்ச்சிப் பதில் இங்கும் தொடர்வதை நேரடியாகக் காட்டுகிறது.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: தமக்குள் மிகவும் மனக்கலக்கம் அடைந்தவராய்
  rationale: வினைச்சொல்லின் தீவிரத்தைத் தக்கவைத்தபடி, அது துயரமா சினமா என்பதை முதன்மைப் பாடத்தில் அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἔρχεται
  choice: வந்தார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலமாக இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: இங்கு குகை வடிவிலான அடக்க இடத்தைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: σπήλαιον
  choice: குகை
  rationale: மூலச்சொல்லின் நேரடியான, இயல்பான பொருள்.
- source_word: λίθος
  choice: கல்
  rationale: கல்லறையை மூடுவதற்குப் பயன்படுத்தப்பட்ட கல்லைக் குறிக்கும் எளிய நேரடி இணைச்சொல்.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: அதன் வாயிலில் ஒரு கல் வைக்கப்பட்டிருந்தது
  rationale: குகைக் கல்லறையின் நுழைவாயிலை கல் அடைத்திருந்த நடைமுறை அமைப்பைத் தமிழில் தெளிவுபடுத்துகிறது; ‘வாயில்’ என்பது சூழலிலிருந்து பெறப்படும் விளக்கச் சொல்.
theological_decisions:
- issue: இயேசுவைப் பற்றிய ἐμβριμώμενος என்பதன் உணர்ச்சி வலிமை
  choice: தீவிரமான உள்ளக் கலக்கமாகக் காட்டி, அதன் சரியான உணர்ச்சி இயல்பை முதன்மைப் பாடத்தில் திறந்துவைத்தல்
  alternative: தமக்குள் சினமடைந்தார்; தமக்குள் மிகவும் கலங்கினார்
  rationale: இச்சொல் சாதாரண துயரத்தைவிட வலிமையான உணர்ச்சியையும் சினத்தின் சாயலையும் குறிக்கக்கூடும். ஆனால் இவ்வசனம் மட்டும் அதன் உணர்ச்சி வகையைத் திட்டவட்டமாக நிர்ணயிக்காததால், மொழிபெயர்ப்பு அந்த விளக்கத் தளர்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதையைக் காட்ட இயேசுவைக் குறிக்கும் இடத்தில் ‘தமக்குள்’, ‘வந்தார்’ ஆகிய உயர்திணை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. உணர்ச்சியின் தீவிரம் காக்கப்பட்டாலும் அதன் துல்லியமான சாயல் அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
