id: JHN.11.34
reference: John 11:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: ta
  text: அவர், “அவனை எங்கே வைத்திருக்கிறீர்கள்?” என்றார். அவர்கள் அவரிடம், “ஆண்டவரே[a], வந்து பாருங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் மரியாதையான அழைப்பாகவும் பயன்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: என்றார்
  rationale: λέγω என்பதன் பொதுவான ‘சொல்’ என்ற பொருளைத் தக்கவைக்கிறது; தொடர்ந்து வரும் கேள்வை விளக்கமாக ‘கேட்டார்’ என்று மாற்றாமல், தமிழில் இயல்பான நேர்கூற்று அமைப்பில் தருகிறது.
- source_word: Ποῦ
  choice: எங்கே
  rationale: இடத்தைப் பற்றிய நேரடி வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τεθείκατε
  choice: வைத்திருக்கிறீர்கள்
  rationale: τίθημι என்பதன் நிறைவேற்றப்பட்ட செயலும் அதன் தற்போதைய விளைவும் வெளிப்படும் வகையில் கிரேக்க நிறைவுக்காலத்தைப் பிரதிபலிக்கிறது; அடக்கச் சூழலில் உடலை வைத்த இடத்தைக் குறிக்கிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: லாசருவைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை நேரடியாகத் தருகிறது.
- source_word: λέγουσιν
  choice: என்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்குகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நோக்கிய மரியாதையான அழைப்பையும் சாத்தியமான கிறிஸ்துவியல் ஒலியையும் தக்கவைக்கிறது; வெறும் ‘ஐயா’ என்று குறுக்கவில்லை.
- source_word: ἔρχου
  choice: வந்து
  rationale: ‘வா’ என்ற கட்டளைப் பொருளை அடுத்த வினையுடன் இணைத்து, தமிழில் இயல்பான ‘வந்து பாருங்கள்’ என்ற அழைப்பாகத் தருகிறது.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: ὁράω என்பதன் கட்டளை வடிவை நவீன மரியாதைத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சொல் மரியாதை அழைப்பாக மட்டும் அமையக்கூடிய தெளிவின்மையை அடிக்குறிப்பில் காட்டியபடியே, இயேசுவைப் பற்றிய மேலதிக இறையியல் ஒலியையும் இழக்காத முதன்மை மொழிபெயர்ப்பாக ‘ஆண்டவரே’ வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிய, கண்ணியமான கதைநடை. இயேசுவிடம் பேசும் பன்மை மரியாதை வினைவடிவம் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் ‘ஆண்டவரே’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
