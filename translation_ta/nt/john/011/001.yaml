  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: ta
  text: மரியாளும் அவரது சகோதரி மார்த்தாளும் வாழ்ந்த பெத்தானியா கிராமத்தைச் சேர்ந்த லாசரு என்னும் ஒருவர் நோயுற்றிருந்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவர் நோயுற்றிருந்தார்; அவர் பெத்தானியாவைச் சேர்ந்த லாசரு; அது மரியாளும் அவரது சகோதரி மார்த்தாளும் வாழ்ந்த கிராமம்.”
    reason: கிரேக்க மூலத்தின் அறிமுகத் தொடரையும் இடத் தகவலின் படிப்படியான அமைப்பையும் நெருக்கமாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Ἦν δέ
  choice: இருந்தார்
  rationale: Ἦν என்பது நிலையைச் சுட்டுகிறது; δέ இங்கு மென்மையான கதைத் தொடர்ச்சிக் குறி. தமிழில் தனியாக ‘இப்போது’ அல்லது வலுவான எதிர்மறை இணைப்பைச் சேர்க்காமல் இயல்பான வாக்கியத் தொடரால் அதன் உரையாடல் செயல்பாடு வெளிப்படுகிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: குறிப்பிட்டவராக இருந்தாலும் இதுவரை அறிமுகப்படுத்தப்படாத ஓர் ஆணைக் குறிக்கும் இயல்பான, மரியாதையான தமிழ் வடிவம்.
- source_word: ἀσθενῶν
  choice: நோயுற்றிருந்தார்
  rationale: இச்சூழலில் உடல் பலவீனத்தை மட்டும் அல்லாமல் நோயுற்ற நிலையைக் குறிக்கிறது; நிகழ்ந்து கொண்டிருந்த நிலையைத் தமிழ் வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: Λάζαρος
  choice: லாசரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: ἀπὸ Βηθανίας
  choice: பெத்தானியாவைச் சேர்ந்த
  rationale: ἀπό குறிக்கும் பிறப்பிடம் அல்லது ஊர்ச் சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τῆς κώμης
  choice: கிராமம்
  rationale: κώμη என்பது பெரிய நகரத்தைவிடச் சிறிய குடியிருப்பைக் குறிக்கிறது; ‘கிராமம்’ நேரான நவீன இணைச்சொல்.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: மரியாளும் அவளுடைய சகோதரி மார்த்தாளும் வாழ்ந்த
  rationale: மார்த்தாள் மரியாளின் சகோதரி என்பதைக் கிரேக்கத் தொடருக்கு ஏற்பத் தெளிவாக்குகிறது. ஊர் அவர்களோடு தொடர்புடையது என்ற பொருளைத் தமிழில் இயல்பாகக் கூற ‘வாழ்ந்த’ பயன்படுத்தப்பட்டுள்ளது.
