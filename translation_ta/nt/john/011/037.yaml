source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: ta
  text: ஆனால் அவர்களில் சிலர், “பார்வையற்றவனுடைய கண்களைத் திறந்த இவர், இந்த மனிதனும் இறந்துபோகாதபடி செய்திருக்க முடியாதா?” என்றார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர் இந்த மனிதனையும் இறக்காமல் காப்பாற்றியிருக்க முடியாதா?”
    reason: ποιῆσαι ἵνα என்ற சொல்லாக்கத்தை விளைவைக் ஏற்படுத்துவதாக அல்லாமல், மரணத்தைத் தடுக்கும் செயலாக இயல்பாக வழங்கலாம்.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: ஆனால் அவர்களில் சிலர்
  rationale: τινές ἐξ αὐτῶν என்பதன் இயல்பான பொருள் ‘அவர்களில் சிலர்’; δέ முந்தைய எதிர்வினையுடன் உள்ள வேறுபாட்டைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: இறந்தகாலக் கதைநடையில் வரும் aorist வினை எளிய இறந்தகாலமாக இயல்பாக வழங்கப்பட்டது.
- source_word: Οὐκ ἐδύνατο
  choice: செய்திருக்க முடியாதா?
  rationale: கடந்தகாலத்தில் இருந்த திறனைப் பற்றிய எதிர்மறை வினா தமிழில் இயல்பான சந்தேகத் தொனியுள்ள வினாவாக வழங்கப்பட்டது.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: பார்வையற்றவனுடைய கண்களைத் திறந்த இவர்
  rationale: பங்கேற்பு வடிவம் இயல்பான தொடர்புச் சொல்லாக்கமாக மாற்றப்பட்டது; ‘இவர்’ இயேசுவைச் சுட்டும் நேரடியான demonstrative தன்மையைப் பேணுகிறது.
- source_word: ποιῆσαι ἵνα
  choice: இறந்துபோகாதபடி செய்திருக்க
  rationale: ποιέω + ἵνα தரும் காரணவிளைவு உறவு ‘...படி செய்திருக்க’ என்ற இயல்பான தமிழ்ச் சொல்லாக்கத்தில் பாதுகாக்கப்பட்டது.
- source_word: καὶ οὗτος
  choice: இவனும்
  rationale: καί என்பதன் ‘மேலும்/கூட’ உணர்வு ‘-உம்’ மூலம் தரப்படுகிறது; இரண்டாவது οὗτος லாசருவை நேரடியாகச் சுட்டுகிறது.
- source_word: μὴ ἀποθάνῃ
  choice: இறந்துபோகாதபடி
  rationale: ἵνα சார்ந்த எதிர்மறை விளைவு அல்லது நோக்கம் தீர்மானிக்கப்படாமல், ‘இறந்துபோகாதபடி’ எனப் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: பேசுகிறவர்களின் வினாத் தொனி
  choice: இயேசுவால் லாசருவின் மரணத்தைத் தடுத்திருக்க முடியுமே என்ற விமர்சனத் தொனியுள்ள வினாவாக வழங்குதல்
  alternative: நடுநிலையான தகவல் வினாவாக வழங்குதல்
  rationale: Οὐκ ἐδύνατο என்ற எதிர்மறை வினா அவர் அதைச் செய்திருக்க முடியும் என்ற எதிர்பார்ப்பையும் மறைமுகக் குறைகூறலையும் உணர்த்துகிறது; ஆனால் வெளிப்படையான குற்றச்சாட்டு எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இயேசுவுக்கும் லாசருவுக்கும் முறையே ‘இவர்’, ‘இவன்’ பயன்படுத்தப்பட்டதால் கிரேக்கத்தின் இரு நேரடிச் சுட்டுப்பெயர்களும் தெளிவாக வேறுபடுகின்றன.
