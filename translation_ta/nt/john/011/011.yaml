source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: ta
  text: இவற்றைச் சொன்ன பிறகு அவர் அவர்களிடம், “நம் நண்பன் லாசரு தூங்கிவிட்டான்[a]; ஆனால் அவனை எழுப்புவதற்காக நான் போகிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தூங்கிவிட்டான்” என்பது “இறந்துவிட்டான்” என்பதைக் குறிக்கும் உருவகம். அடுத்த வசனங்களில் சீடர்கள் இதை நேரடியான தூக்கம் என்று தவறாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: இவற்றைச் சொன்ன பிறகு
  rationale: முன்னர் கூறிய பலவற்றைச் சுட்டும் ταῦτα என்பதன் பன்மையையும், உரையின் காலவரிசையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: λέγει αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடையில் இறந்தகாலமாக வழங்குகிறது.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: நம் நண்பன் லாசரு
  rationale: உறவின் நெருக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; பெயர் கிரேக்க வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்படுகிறது.
- source_word: κεκοίμηται
  choice: தூங்கிவிட்டான்
  rationale: இறப்பைக் குறிக்கும் உருவகத்தை முன்கூட்டியே விளக்கிவிடாமல் காக்கிறது; வினையின் நிறைவுற்ற நிலையையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: ἀλλὰ πορεύομαι
  choice: ஆனால் ... நான் போகிறேன்
  rationale: லாசருவின் நிலைக்கும் இயேசுவின் நோக்கமுள்ள செயலுக்கும் இடையிலான மாறுபாட்டையும் நிகழ்கால உணர்வையும் காக்கிறது.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: அவனை எழுப்புவதற்காக
  rationale: ἵνα என்பதன் நோக்கப் பொருளையும் தூக்க உருவகத்தின் தொடர்ச்சியையும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: κεκοίμηται என்பதை நேரடியாக ‘இறந்துவிட்டான்’ என்று விளக்குவதா அல்லது தூக்க உருவகத்தைக் காப்பதா
  choice: முதன்மை உரையில் ‘தூங்கிவிட்டான்’ என்று உருவகத்தைக் காத்தல்
  alternative: ‘இறந்துவிட்டான்’
  rationale: அடுத்த வசனங்களில் சீடர்கள் இதைத் தவறாகப் புரிந்துகொள்வதால், இயேசுவின் திட்டமிட்ட உருவக மொழியையும் கதைநடையின் பதற்றத்தையும் முதன்மை உரை காக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நம் நண்பன்’ என்பது இயல்பான உறவுமொழி; ‘தூங்கிவிட்டான்/எழுப்ப’ என்ற சொற்கள் மூலத்தின் உருவக இணைப்பைக் காக்கின்றன.
