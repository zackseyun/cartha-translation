  source_fidelity: 'மூலக் கிரேக்கத்தின் பொருள் துல்லியமாகத் தரப்பட்டுள்ளது: இயேசு அன்புகூர்ந்த மூவரான மார்த்தாள், அவளுடைய சகோதரி, லாசரு ஆகியோர் சமநிலையுடன் பட்டியலிடப்பட்டுள்ளனர். ἠγάπα என்ற முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ந்த மனநிலை, தமிழில் இயல்பான எளிய இறந்தகாலமான “நேசித்தார்” மூலம் சூழலுக்கேற்றவாறு வெளிப்படுகிறது. δέ-யின் மென்மையான இணைப்பைத் தனிச் சொல்லாகக் காட்டாமல் விட்டது பொருளிழப்பை ஏற்படுத்தவில்லை.'
