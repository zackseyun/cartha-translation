  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: ta
  text: இயேசு மார்த்தாளையும் அவளுடைய சகோதரியையும் லாசருவையும் நேசித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: நேசித்தார்
  rationale: ἀγαπάω என்பதன் முற்றுப்பெறாத இறந்தகால வடிவம், கடந்தகாலத்தில் தொடர்ந்திருந்த இயேசுவின் அன்பைச் சுட்டுகிறது. தமிழில் இயல்பாகவும் மரியாதையாகவும் இதை “நேசித்தார்” என்று கூறலாம்; “நேசித்துக்கொண்டிருந்தார்” என்பது இங்கு தேவையற்ற அளவு செயல்-தொடர்ச்சியை வலியுறுத்தும்.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான உரையாடல் இணைப்பாகச் செயல்படுகிறது; எதிர்மறை முரணையோ வெளிப்படையான காலக் குறிப்பையோ கட்டாயப்படுத்துவதில்லை. தனிச் சொல்லைச் சேர்க்காமல் விடுவது நவீன தமிழில் இயல்பான ஓட்டத்தைத் தருகிறது.
- source_word: τὴν Μάρθαν
  choice: மார்த்தாளை
  rationale: Μάρθα என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம் “மார்த்தாள்”; வேற்றுமை உருபுடன் “மார்த்தாளை” என வருகிறது.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: அவளுடைய சகோதரியை
  rationale: சொற்றொடரின் பொருளை இயல்பான தமிழில் துல்லியமாகத் தருகிறது. இவ்வசனத்தில் சகோதரியின் பெயர் கூறப்படாததால் அதைச் சேர்க்கவில்லை.
- source_word: τὸν Λάζαρον
  choice: லாசருவை
  rationale: Λάζαρος என்ற பெயரின் பொதுவான தமிழ் வேதாகம வடிவமான “லாசரு” வேற்றுமை உருபுடன் வழங்கப்படுகிறது.
- source_word: καὶ ... καὶ
  choice: -யும் ... -யும் ... -யும்
  rationale: மூவரையும் ஒரே அளவில் இணைக்கும் கிரேக்கத் தொடரமைப்பைத் தமிழின் இணைப்பும்மையால் இயல்பாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ἠγάπα என்ற முற்றுப்பெறாத இறந்தகால வினையின் பொருள்
  choice: மார்த்தாள், அவளுடைய சகோதரி, லாசரு ஆகியோர்மீது இயேசுவுக்கு தொடர்ந்து இருந்த அன்பைப் பற்றிய எளிய கூற்று
  alternative: “நேசிக்கத் தொடங்கினார்” அல்லது வலியுறுத்தப்பட்ட “நேசித்துக்கொண்டிருந்தார்”
  rationale: இவ்விடத்தில் வினை கடந்தகாலத்தில் நீடித்த மனநிலையை இயல்பாகக் குறிக்கிறது. அன்பு தொடங்கிய தருணத்தையோ சிறப்பான உணர்ச்சி தீவிரத்தையோ உரை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையான, கண்ணியமான நடையில், இயேசுவைக் குறிக்கும் வினைக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூன்று நபர்களையும் இணைப்பும்மை மூலம் சமநிலையுடன் பட்டியலிடுகிறது.
