  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: ta
  text: நாம் இவரை இப்படியே விட்டுவிட்டால், எல்லாரும் இவரை நம்புவார்கள்; ரோமர்கள் வந்து நம்முடைய இடத்தையும்[a] நாட்டையும்[b] பறித்துக்கொள்வார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தையும்.” கிரேக்கத்தில் “இடம்” என்று உள்ளது; இது குறிப்பாக ஆலயத்தையோ, அல்லது இன்னும் விரிவாக அவர்களுடைய இடம் அல்லது அதிகார நிலையையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மக்களையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: இவரை இப்படியே விட்டுவிட்டால்
  rationale: ἀφίημι இங்கு அனுமதித்தல் அல்லது தலையிடாமல் விடுதல் என்ற பொருளில் வருகிறது; οὕτως என்பதன் ‘இப்படியே’ என்ற சுட்டுப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: பொதுவான, அனைவரையும் உள்ளடக்கும் பன்மைப் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: இவர்மேல் நம்பிக்கை வைப்பார்கள்
  rationale: யோவான் எழுத்துகளில் πιστεύω εἰς என்பதற்குரிய ஒருவரை நோக்கிய நம்பிக்கை/சார்பு என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: ரோமர்கள் வந்து
  rationale: எளிய எதிர்கால விளைவுத் தொடரில் ‘ரோமர்கள் வருவார்கள்’ என்ற பொருளைத் தமிழ் வாக்கிய ஓட்டத்துக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: ἀροῦσιν
  choice: கைப்பற்றிவிடுவார்கள்
  rationale: αἴρω என்பதன் எடுத்துப்போடுதல்/அகற்றுதல் என்ற கருத்தை, ரோம அரசியல் நடவடிக்கையைப் பற்றிய அச்சம் என்னும் சூழலில் இயல்பாகக் கூறுகிறது; ‘அழித்துவிடுவார்கள்’ என வலுப்படுத்தவில்லை.
- source_word: τόπον
  choice: இடம்
  rationale: சொல்லின் அடிப்படைப் பொருளைக் காத்து, ஆலயம், வாழ்விடம் அல்லது அதிகார நிலை ஆகிய சாத்தியமான குறிப்புகளை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἔθνος
  choice: நாட்டினம்
  rationale: மக்கள் இனத்தையும் அரசியல் சமூகத்தையும் குறிக்கக்கூடிய ἔθνος என்பதன் இரு பரிமாணங்களையும் ‘நாட்டினம்’ ஓரளவு காக்கிறது.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: நம்முடைய இடத்தையும் நம்முடைய நாட்டினத்தையும்
  rationale: ἡμῶν இரு பெயர்ச்சொற்களுக்கும் உரியது என்பதையும், மீண்டும் வரும் καί இரண்டையும் இணைப்பதையும் தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: τόπον என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘இடம்’ என்று பொதுவாக வைக்கப்பட்டது
  alternative: ஆலயம்; அதிகார நிலை
  rationale: சூழலில் ஆலயமோ தலைவர்களின் நிறுவன நிலைப்பாடோ கருதப்பட்டிருக்கலாம்; ஆனால் கிரேக்கச் சொல் குறிப்பைத் திறந்தே வைப்பதால், மொழிபெயர்ப்பும் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ἔθνος என்பதன் சமூக-அரசியல் பொருள்
  choice: நாட்டினம்
  alternative: மக்கள்
  rationale: யூத மக்களையும் அவர்களின் அரசியல்-தேசிய அமைப்பையும் குறிக்கக்கூடிய மூலச்சொல்லின் பரப்பை ஒரே பக்கமாகச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மேற்கோள் உரையில் பேசுபவர்கள் இயேசுவை நேரில் சுட்டுவதால் ‘இவரை/இவர்மேல்’ பயன்படுத்தப்பட்டது. ‘அப்போது’ என்பது καί குறிக்கும் விளைவுத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
