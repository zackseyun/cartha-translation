lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: கண்ணீர் விட்டார்
  rationale: δακρύω என்பதன் இறந்தகாலச் செயப்பாட்டு வினை வடிவம்; கண்ணீர் சிந்துதலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் இதைத் தெரிவிக்கும் சொற்றொடர் இது; ‘அழத் தொடங்கினார்’ என்ற, வினைவடிவத்தில் கட்டாயமில்லாத தொடக்கநிலைக் கருத்தைச் சேர்க்கவில்லை.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: குறிப்புச் சுட்டுடன் வரும் இயேசுவின் பெயரே வாக்கியத்தின் எழுவாய். தமிழில் தனிப்பெயருக்கு அந்தக் குறிப்புச் சுட்டைத் தனியாக மொழிபெயர்க்கத் தேவையில்லை.
theological_decisions:
- issue: இயேசுவின் உணர்ச்சி வெளிப்பாடு
  choice: இயேசு கண்ணீர் விட்டார்
  alternative: இயேசு அழுதார்
  rationale: இயேசுவின் உண்மையான மனித உணர்ச்சியை உரை எளிமையாக வெளிப்படுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு அதைத் தணிக்காமலும், சூழலில் வேறிடத்தில் காணப்படும் உரத்த புலம்பலாக வலுப்படுத்தாமலும், கிரேக்க வினையின் தனித்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான, மிகச் சுருக்கமான நடையைப் பயன்படுத்துகிறது. ‘கண்ணீர் விட்டார்’ என்பது மூல வினையின் குறிப்பான பொருளைத் தெளிவாகத் தருகிறது; பரவலாக அறியப்பட்ட ‘அழுதார்’ அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
