source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: ta
  text: ஆகவே, மரியாளிடம் வந்திருந்த யூதர்களில் பலர், அவர் செய்ததைப் பார்த்து, அவர்மேல் நம்பிக்கை வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதர்களில் பலர்” என்பதற்கு “யூதர்களிலிருந்து பலர்” என்றும் சொல்லலாம். Ἰουδαῖοι என்பதை யோவான் நற்செய்தியில் உள்ள சில சூழல்களில் “யூதேயர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: பலர்
  rationale: குறிப்பிடப்படாத, ஆனால் கணிசமான எண்ணிக்கையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: லாசருவை உயிரோடு எழுப்பிய முந்தைய நிகழ்வின் விளைவாக இது நடந்தது என்ற தர்க்கரீதியான தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: யூதர்களில்
  rationale: கிரேக்கத்தின் பகுதி-முழுமை பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; அதாவது யூதர்களில் பலர்.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: மரியாளிடம் வந்திருந்த
  rationale: இங்கு குறிக்கப்படும் யூதர்கள் யார் என்பதை அடையாளப்படுத்துகிறது; முதன்மைச் செயலுக்கு முன்பே அவர்கள் வந்திருந்ததைத் தமிழ் வினை வடிவம் தெளிவாக்குகிறது.
- source_word: θεασάμενοι
  choice: பார்த்து
  rationale: நிகழ்ந்த செயலை நேரில் கண்டார்கள் என்ற பொருளை இயல்பாகத் தருகிறது; சூழலில் கவனித்துப் பார்த்தல் என்ற நுணுக்கமும் இதில் அடங்குகிறது.
- source_word: ἃ ἐποίησεν
  choice: அவர் செய்ததை
  rationale: நடுநிலைப் பன்மை உறவுப்பெயரைத் தமிழில் இயல்பான ஒருமைத் தொகுப்புப்பொருளாக வழங்கி, இயேசுவின் செயலைக் குறிக்கிறது.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  rationale: யோவானின் πιστεύω εἰς கட்டமைப்பில் இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: யோவானின் இரட்சிப்பு சார்ந்த சூழலில் πιστεύω εἰς αὐτόν என்பதன் மொழிபெயர்ப்பு
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  alternative: அவரை விசுவாசித்தார்கள்
  rationale: இத்தொடர் ஒரு செய்தியை உண்மையென ஏற்றுக்கொள்வதை மட்டும் அல்லாமல், இயேசுவை நோக்கிய நம்பிக்கையையும் குறிக்கிறது. தேர்ந்த வடிவம் இதைத் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் கூடுதல் சமயக்கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. “யூதர்களில்” என்பது ἐκ என்ற பகுதியைக் குறிக்கும் அமைப்பை இயல்பாகப் பாதுகாக்கிறது; அடிக்குறிப்பு மாற்று இன-புவியியல் வாசிப்பை வெளிப்படையாகக் குறிப்பிடுகிறது.
