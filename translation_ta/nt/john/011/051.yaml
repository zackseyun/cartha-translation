revisions:
- from: அவர் இதைத் தாமாகச் சொல்லவில்லை[a]; ஆனால் அந்த ஆண்டின் தலைமைக் குருவாக இருந்ததால், இயேசு அந்த நாட்டிற்காக[c] இறக்கவிருந்தார்[b] என்று தீர்க்கதரிசனமாகச் சொன்னார்.
  to: அவர் இதைத் தன் சொந்தமாகச் சொல்லவில்லை[a]; ஆனால் அந்த ஆண்டில் தலைமைக் குருவாக இருந்தபடியால், இயேசு அந்த தேசத்திற்காக[c] இறக்கவிருந்தார்[b] என்று தீர்க்கதரிசனம் உரைத்தார்.
  rationale: The revision improves Tamil idiom and lexical precision without altering the verse’s meaning. It retains the Greek participial connection of Caiaphas’s office, avoids adding claims about his intent or inspiration, and preserves the non-technical breadth of ‘for’ (ὑπέρ). Footnote markers remain correctly anchored to their respective expressions.
