  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: ta
  text: அவர் இதைத் தன் சொந்தமாகச் சொல்லவில்லை[a]; ஆனால் அந்த ஆண்டில் தலைமைக் குருவாக இருந்தபடியால், இயேசு அந்த தேசத்திற்காக[c] இறக்கவிருந்தார்[b] என்று தீர்க்கதரிசனம் உரைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாமாக’ அல்லது ‘தன் சொந்த முன்முயற்சியால்’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறக்கப்போகிறார்’; சூழலைப் பொறுத்து, ‘இறக்கும்படி நிர்ணயிக்கப்பட்டிருந்தார்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அந்த தேசத்தின் சார்பாக’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: தாமாக
  rationale: இக்கூற்று காய்பாவின் சொந்த மூலத்திலிருந்தோ முன்முயற்சியிலிருந்தோ எழவில்லை என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தன்னிடமிருந்து’ என்ற வடிவத்தைவிட தெளிவானது.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: அந்த ஆண்டின் தலைமைக் குருவாக இருந்ததால்
  rationale: ὢν என்ற பங்கேற்புவினையின் பின்னணி/காரணத் தொடர்பையும், குறிப்பிட்ட அந்த ஆண்டின் பதவியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπροφήτευσεν
  choice: தீர்க்கதரிசனமாகச் சொன்னார்
  rationale: வெறும் முன்னறிவிப்பு அல்லாமல் தீர்க்கதரிசனப் பேச்சு என்ற வினையின் வலிமையைப் பாதுகாக்கிறது; நவீன வாசகருக்கு ‘தீர்க்கதரிசனம் உரைத்தார்’ என்பதைக் காட்டிலும் இயல்பானது.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: இறக்கவிருந்தார்
  rationale: நிகழவிருந்த மரணத்தைச் சுட்டுகிறது; உடனடி அண்மை அல்லது தவிர்க்க முடியாத விதி என்ற கருத்தைத் தேவையின்றி வலுப்படுத்தாது.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: அந்த நாட்டிற்காக
  rationale: ὑπέρ என்பதன் நன்மை/பிரதிநிதித்துவ வரம்பைத் திறந்தவாறே வைத்து, ἔθνος என்பதை உடனடி சூழலில் குறிப்பிட்ட யூத நாட்டைக் குறிக்கும் வகையில் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: காய்பாவின் கூற்று தீர்க்கதரிசனம் எனப்படுவதன் பொருள்
  choice: அவர் தலைமைக் குருவாக இருந்ததுடன் தொடர்புபடுத்தி, அவரது சொற்கள் தீர்க்கதரிசனமானவை என்று உரை கூறுவதை நேரடியாகப் பாதுகாத்தல்
  alternative: காய்பா தெய்வீக ஏவுதலை முழுமையாக உணர்ந்து தீர்க்கதரிசனம் சொன்னார்; அல்லது இது வெறும் யோவானிய நையாண்டி மட்டுமே
  rationale: மூலம் வெளிப்படையாக ἐπροφήτευσεν என்கிறது; ஆனால் காய்பாவின் உள்ளுணர்வு, நீதிநிலை அல்லது ஏவுதலின் முறை குறித்து மேலதிகக் கூற்றுகளைச் சேர்க்கவில்லை.
- issue: இயேசுவின் மரணத்துடன் தொடர்புடைய ὑπέρ என்பதன் வலிமை
  choice: ‘அந்த நாட்டிற்காக’ என்று பரந்த நன்மை/பிரதிநிதித்துவப் பொருளை நிலைநிறுத்தல்
  alternative: ‘அந்த நாட்டின் சார்பாக’ அல்லது ‘அந்த நாட்டுக்குப் பதிலாக’
  rationale: இவ்வசனம் அனுமதிக்கும் இறையியல் வலிமையைப் பாதுகாத்தாலும், ὑπέρ என்பதற்கு இங்கே ஒரே தொழில்நுட்பப் பரிகாரக் கோட்பாட்டைத் திணிக்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘தலைமைக் குரு’ பொதுவாகப் புரியக்கூடிய திருச்சொல்; ‘தீர்க்கதரிசனமாகச் சொன்னார்’ என்பது மூலத்தின் இறையியல் வலிமையையும் இயல்பான தமிழ் நடையையும் இணைக்கிறது. δέ-க்கு தேவையற்ற தொடக்கக் காலவினையடை சேர்க்கப்படவில்லை; ‘ஆனால்’ உள் முரண்பாட்டை வெளிப்படுத்துகிறது.
