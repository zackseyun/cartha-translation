source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: ta
  text: ஆண்டவருக்கு நறுமணத் தைலத்தைப் பூசி[a], அவருடைய கால்களைத் தன் கூந்தலால் துடைத்தவள் மரியாள்தான்; அவளுடைய சகோதரன் லாசரு நோயுற்றிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நறுமணக் களிம்பு’ அல்லது ‘வாசனை எண்ணெய்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் மணமுள்ள எண்ணெயையோ களிம்பையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: இந்த மரியாள்தான்
  rationale: δέ-யின் தொடர்ச்சி உணர்வைத் தமிழில் கட்டாய இணைப்புச்சொல் இன்றி சூழல் வெளிப்படுத்துகிறது; ἦν மற்றும் அடையாளப்படுத்தும் அமைப்பின் வலியுறுத்தலை ‘இந்த ... தான்’ இயல்பாகத் தருகிறது.
- source_word: ἡ ἀλείψασα
  choice: பூசி ... துடைத்தவள்
  rationale: பெயர்ச்சொல்லை விளக்கும் கிரேக்க இறந்தகாலப் பெயரெச்ச அமைப்பை இயல்பான தமிழ் தொடர்பெயர் அமைப்பாக மாற்றுகிறது; நிகழ்வு பிரதான சூழ்நிலைக்கு முந்தியது என்பது இவ்வடையாள விளக்கத்திலேயே தெளிவாகிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவருக்கு
  rationale: κύριος என்பதன் மரியாதை மற்றும் இறையியல் நிறையைத் தக்கவைக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு; தமிழ் வினையமைப்புக்கேற்ப வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: μύρῳ
  choice: நறுமணத் தைலம்
  rationale: μύρον என்பது மணமுள்ள எண்ணெய் அல்லது களிம்பைக் குறிக்கிறது; ‘நறுமணத் தைலம்’ இச்சூழலில் தெளிவான, நவீன, மரியாதையான தமிழ்.
- source_word: ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: அவருடைய கால்களை ... துடைத்தவள்
  rationale: ἐκμάσσω-வின் துடைத்தல் அல்லது துடைத்து உலர்த்துதல் என்ற பொருளை, தேவையற்ற விளக்கச் சேர்க்கையின்றி நேரடியாக வழங்குகிறது.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: தன் கூந்தலால்
  rationale: கருவிப் பொருளுடைய தத்திவை ‘-ஆல்’ மூலம் வழங்குகிறது; ஒரே எழுவாயைச் சுட்டுவதால் ‘தன்’ இயல்பானது, ‘கூந்தல்’ மனிதத் தலைமுடியைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: அவளுடைய சகோதரன் லாசரு
  rationale: மரியாளுக்கும் லாசருவுக்கும் இடையிலான உடன்பிறப்பு உறவைத் தெளிவாகத் தக்கவைக்கிறது; Λάζαρος என்பதற்கு வழக்கமான தமிழ் வடிவமான ‘லாசரு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἠσθένει
  choice: நோயுற்றிருந்தான்
  rationale: தொடர்ந்து நிலவிய உடல்நோயை உணர்த்தும் இறந்தகாலப் பின்னணியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ‘ஆண்டவர்’ என்பது பட்டத்தின் கதைசார் மரியாதையையும் இறையியல் நிறையையும் தக்கவைக்கிறது; அதை வெறும் சமூக எஜமான் என்ற பொருளுக்குள் குறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையான வேதாகம நடையில் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்தது வாசிப்புத் தெளிவுக்காக; மரியாளை அடையாளப்படுத்தும் விளக்கமும் லாசருவின் நோயும் இடையிலான தொடர்பு தொடர்ந்து பாதுகாக்கப்பட்டுள்ளது.
