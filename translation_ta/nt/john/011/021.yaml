id: JHN.11.21
reference: John 11:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: ta
  text: ஆகவே மார்த்தா இயேசுவிடம், “ஆண்டவரே,[a] நீர் இங்கே இருந்திருந்தால், என் சகோதரன் இறந்திருக்க மாட்டான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா”; கிரேக்கச் சொல்லான κύριε மரியாதையான அழைப்பாகவும் பயன்படலாம். “ஆண்டவரே” என்பது யோவான் நற்செய்தியில் சாத்தியமான இறையியல் பொருளையும் காக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து மார்த்தாவின் பேச்சுக்குச் செல்லும் கதைத் தொடர்பையும் ஓரளவு முடிவுறுத்தும் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶπεν
  choice: என்றாள்
  rationale: பேசுபவர் மார்த்தா என்பதால், மேற்கோள் உரைக்குப் பின் வரும் இயல்பான தமிழ் பெண்பால் வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: இயேசுவிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பையும் யோவான் நற்செய்தியில் இருக்கக்கூடிய கிறிஸ்தியல் நிறையையும் காக்கிறது; தமிழில் நேரடி அழைப்புக்குரிய வடிவம் இது.
- source_word: εἰ ἦς ὧδε
  choice: நீர் இங்கே இருந்திருந்தால்
  rationale: கடந்தகால உண்மைக்கு மாறான நிபந்தனையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; மரியாதையான ஒருமை முன்னிலைப் பெயர் இயேசுவை நோக்கிய உரைக்கு ஏற்றது.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: இறந்திருக்க மாட்டான்
  rationale: நிறைவேறாத கடந்தகால விளைவை இயல்பான தமிழ் எதிர்மறை நிபந்தனை வடிவில் தெரிவிக்கிறது.
- source_word: ὁ ἀδελφός μου
  choice: என் சகோதரன்
  rationale: இங்கு மார்த்தாவின் ஆண் உடன்பிறப்பான லாசருவையே குறிக்கிறது; ‘சகோதரன்’ என்பது தெளிவான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: இயேசுவை நோக்கி மார்த்தா பயன்படுத்தும் κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: ‘ஆண்டவரே’ என்பது மரியாதையான அழைப்பையும் சாத்தியமான கிறிஸ்தியல் பொருளையும் ஒருங்கே காக்கிறது. வசனம் தனியாக அந்தப் பொருளை முழுமையாகத் தீர்மானிக்காததால், ‘ஐயா’ என்ற சாத்தியமும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கி ‘நீர்’ என்ற மரியாதையான ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது; கடந்தகால உண்மைக்கு மாறான நிபந்தனை தமிழ் மொழியின் இயல்பான ‘இருந்திருந்தால் ... இறந்திருக்க மாட்டான்’ அமைப்பில் தரப்பட்டுள்ளது.
