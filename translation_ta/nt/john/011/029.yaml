  source_fidelity: மூலத்தின் காலத் தொடர்பு (ὡς ἤκουσεν), உடனடியான எழுதல் (ἠγέρθη ταχὺ), மற்றும் இயேசுவை நோக்கிய நகர்வு (ἤρχετο πρὸς αὐτόν) அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. “அதைக்” என்பது முந்தைய வசனத்தில் தெரிவிக்கப்பட்ட செய்தியை இயல்பாகச் சுட்டுகிறது. ἤρχετο என்ற imperfect-ஐ தமிழ் கதைநடைக்கு ஏற்றவாறு “சென்றாள்” என வழங்குவது பொருளை மாற்றவில்லை.
  naturalness: “அவள் அதைக் கேட்டதும், விரைவாக எழுந்து அவரிடம் சென்றாள்” என்பது நவீன நிலையான தமிழில் தெளிவான, இயல்பான, கண்ணியமான கதைநடையாக உள்ளது. “அவரிடம்” இயேசுவுக்கான மரியாதை வழக்கையும் இயக்கத்தின் இலக்கையும் நன்றாக வெளிப்படுத்துகிறது.
  terminology: பெயர்கள் அல்லது தனிப்பட்ட இறையியல் சொற்கள் இவ்வசனத்தில் இல்லை. “அவள்” மரியாளைத் தெளிவாகக் குறிக்கிறது; “அவரிடம்” சூழலுக்கு ஏற்ற மரியாதைப் பதிலிப்பெயராக உள்ளது.
