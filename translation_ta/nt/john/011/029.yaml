  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை. கிரேக்கத்தின் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், அதன் காலத் தொடர்பு, விரைவு, நகர்வு ஆகியவை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
