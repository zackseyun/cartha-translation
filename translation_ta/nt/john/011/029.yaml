  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: ta
  text: அவள் அதைக் கேட்டதும், விரைவாக எழுந்து அவரிடம் சென்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: அவள்
  rationale: உடனடி சூழலில் இந்தச் சுட்டுப்பெயர் மரியாளைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகப் பெண்பால் பதிலிப்பெயர் பயன்படுத்தப்படுகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது; தமிழில் வாக்கியத் தொடர்ச்சியால் அது இயல்பாக வெளிப்படுவதால் தனிச் சொல் தேவையில்லை.
- source_word: ὡς ἤκουσεν
  choice: அதைக் கேட்டதும்
  rationale: ὡς இங்கு காலத் தொடர்பைக் குறிக்கிறது. “கேட்டதும்” என்பது அடுத்த செயல் உடனடியாக நிகழ்ந்ததை இயல்பாக உணர்த்துகிறது; “அதை” என்பது முந்தைய வசனத்தில் மரியாள் கேட்ட செய்தியைக் குறிக்கிறது.
- source_word: ἠγέρθη
  choice: எழுந்து
  rationale: வடிவில் செயல்பாட்டுப்பாங்கற்றதாக இருந்தாலும், இச்சூழலில் தானே எழுதல் என்ற அகச்செயற்பொருளைக் கொண்டுள்ளது; வெளிப்புறச் செய்பவரை உணர்த்தும் மொழிபெயர்ப்பு தவிர்க்கப்படுகிறது.
- source_word: ταχὺ
  choice: விரைவாக
  rationale: செயலின் வேகத்தையும் தாமதமின்மையையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἤρχετο
  choice: சென்றாள்
  rationale: இறந்தகாலத் தொடர்ச்சியைச் சுட்டும் கிரேக்க imperfect, அவரை நோக்கிய நகர்வை நடைபெற்று வந்த செயலாகக் காட்டுகிறது; தமிழ் கதைநடையில் “சென்றாள்” இயல்பான சமமான வடிவம்.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: ஒரு நபரை நோக்கிய நகர்வையும் அவரை அணுகுவதையும் தமிழில் இயல்பாகக் குறிக்கிறது. இயேசுவைக் குறிக்கும் பதிலிப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
