base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ta
  text: வாழ்கிறவரும் என்னை நம்புகிறவருமான ஒவ்வொருவரும் என்றென்றும் சாகவே மாட்டார். இதை நீ நம்புகிறாயா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: வாழ்கிறவரும் என்னை நம்புகிறவருமான ஒவ்வொருவரும்
  rationale: இரண்டு நிகழ்காலப் பங்கேற்புச் சொற்களையும் ஒரே நபரை விவரிக்கும் இணைந்த பண்புகளாக இயல்பான தமிழில் வெளிப்படுத்துகிறது; εἰς ἐμέ என்பதின் தனிப்பட்ட நம்பிக்கை நோக்கை ‘என்னை நம்புகிற’ எனக் காக்கிறது.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: சாகவே மாட்டார்
  rationale: οὐ μή எனும் வலுவான மறுப்பை ‘-வே மாட்டார்’ மூலம் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: காலவரையற்ற/நித்திய மறுப்பைக் குறிக்கும் வழக்குச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அதை நீக்காமல் மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
- source_word: πιστεύεις τοῦτο;
  choice: இதை நீ நம்புகிறாயா?
  rationale: நேரடியான இரண்டாம் நபர் ஒருமை வினாவையும் τοῦτο என்பதையும் இயல்பான தமிழ்ச் சொல்லமைப்பில் காக்கிறது.
theological_decisions:
- issue: நம்புகிறவர் ‘என்றென்றும் சாக மாட்டார்’ என்பது உடல் மரணத்தையா அல்லது இறுதியான மரணத்தையா குறிக்கிறது
  choice: மூலத்தின் நேரடியான, வலுவான மறுப்பை விளக்கச் சேர்க்கையின்றி வைத்தல்
  alternative: ‘ஆவிக்குரிய மரணத்தை அடைய மாட்டார்’ அல்லது ‘இறுதியில் மரிக்க மாட்டார்’ என்று விளக்குதல்
  rationale: உடனடியான சூழலில் உயிர்த்தெழுதலும் மரணமும் உள்ளதால் கூற்றில் நோக்கமுள்ள தெய்வவியல் பதற்றம் உள்ளது. மொழிபெயர்ப்பு அதை ஒரு குறிப்பிட்ட விளக்கத்திற்கு உட்படுத்தாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிமையும் கொண்ட நேரடி உரை. இயேசு மார்த்தாளிடம் ஒருமையில் பேசுவதால் ‘நீ நம்புகிறாயா?’ பயன்படுத்தப்பட்டுள்ளது.
