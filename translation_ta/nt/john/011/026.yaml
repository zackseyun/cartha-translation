  source_fidelity: மூலத்தின் πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ என்ற இணைந்த நிகழ்காலப் பங்கேற்புத் தொடரை, ‘வாழ்கிறவரும் என்னை நம்புகிறவருமான ஒவ்வொருவரும்’ என ஒரே நபருக்குரிய இரு பண்புகளாகத் தக்கவைக்கிறது. οὐ μὴ ἀποθάνῃ என்பதன் வலுவான மறுப்பும், εἰς τὸν αἰῶνα என்பதன் காலவரையற்ற வலியுறுத்தலும் ‘என்றென்றும் சாகவே மாட்டார்’ என்பதில் காக்கப்படுகின்றன. எந்த விளக்கவுரையும் சேர்க்கப்படாததால் மூலத்தில் உள்ள நோக்கமுள்ள தெய்வவியல் பதற்றம் பாதுகாக்கப்படுகிறது.
  naturalness: நவீன நிலையான தமிழில் தெளிவாகவும் வாசிக்க இயலுமாறும் உள்ளது. ‘ஒவ்வொருவரும் ... மாட்டார்’ என்பது பொதுமைப்படுத்தப்பட்ட ஒருமைக்குச் சரியான நடை; மார்த்தாளிடம் நேரடியாகக் கேட்கும் ‘நீ நம்புகிறாயா?’ என்பதும் சூழலுக்கேற்றது.
  terminology: ‘என்னை நம்புகிற’ என்பது εἰς ἐμέ-யின் தனிப்பட்ட நம்பிக்கை நோக்கத்தை இயல்பாகத் தருகிறது. ‘சாகவே மாட்டார்’ οὐ μή-யின் வலுவை நன்றாகக் காட்டுகிறது; ‘என்றென்றும்’ εἰς τὸν αἰῶνα-க்கு பொருத்தமானது. சிறப்புச் சொற்கள் அல்லது பெயர்கள் தொடர்பான சிக்கல் இல்லை.
