source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: ta
  text: இயேசுவோ அதைக் கேட்டபோது, “இந்த நோய் மரணத்தில் முடிவதற்கானது அல்ல[a]; மாறாக, இதன் மூலம் தேவனுடைய மகன் மகிமைப்படும்படி, இது தேவனுடைய மகிமைக்காக இருக்கிறது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்துக்கு வழிநடத்துவது அல்ல.” கிரேக்கத் தொடர், மரணம் இந்த நோயின் இறுதி முடிவோ நோக்கமோ அல்ல என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: இயேசுவோ அதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் காலச் சூழலை ‘கேட்டபோது’ இயல்பாக வெளிப்படுத்துகிறது. முந்தைய செய்தியைக் குறிக்க ‘அதை’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; δὲ-யின் மென்மையான கதைநடை மாற்றத்தை ‘இயேசுவோ’ காட்டுகிறது.
- source_word: ἀσθένεια
  choice: நோய்
  rationale: லாசருவின் உடல்நிலையைக் குறிக்கும் பரந்த, இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: மரணத்தில் முடிவதற்கானது அல்ல
  rationale: πρὸς என்பதிலுள்ள முடிவு அல்லது நோக்கு சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. லாசரு இடைக்காலத்தில் இறப்பார் என்ற பின்னணியுடன் உள்ள உரையின் பதற்றத்தை அழிக்காமல், மரணம் இறுதி முடிவு அல்ல என்பதற்கான இடத்தை வைக்கிறது.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: தேவனுடைய மகிமைக்காக
  rationale: ὑπέρ இங்கு நோக்கம் அல்லது பயன் சார்ந்த பொருளைக் கொண்டுள்ளது; ‘மகிமை’ δόξα-வின் இறையியல் நிறையைத் தக்கவைக்கிறது.
- source_word: ἵνα δοξασθῇ
  choice: மகிமைப்படும்படி
  rationale: ἵνα கூறும் நோக்கத்தையும் δοξασθῇ-யின் செயப்பாட்டு வடிவத்தையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: கிறிஸ்துவைக் குறிக்கும் பட்டத்தைத் தெளிவாகவும் வழக்கமான தமிழிலும் மொழிபெயர்க்கிறது.
- source_word: δι’ αὐτῆς
  choice: இதன் மூலம்
  rationale: διά + எழுவாயல்லா உருபின் கருவி அல்லது வழிமுறைப் பொருளைத் தருகிறது; ‘இதன்’ என்பது நோயைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: லாசரு பின்னர் உண்மையில் இறப்பதன் வெளிச்சத்தில் ‘மரணத்தை நோக்கியது அல்ல’ என்பதன் பொருள்
  choice: மரணம் இந்நோயின் இறுதி முடிவோ நோக்கமோ அல்ல எனப் புரிந்துகொள்ள இடமளிக்கும் வகையில் ‘மரணத்தில் முடிவதற்கானது அல்ல’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: லாசரு எவ்விதத்திலும் இறக்கமாட்டார் என்ற நேரடி முன்னறிவிப்பு; அல்லது ‘உயிருக்கு ஆபத்தான நோய் அல்ல’ என்ற மருத்துவக் கூற்று.
  rationale: யோவான் 11:14-இல் லாசரு இறந்ததாகக் கதை கூறுவதால், πρὸς என்பதன் முடிவு/நோக்கு நுணுக்கத்தைப் பாதுகாப்பது உரையின் உண்மையான பதற்றத்தைத் தக்கவைக்கிறது.
- issue: ‘தேவனுடைய மகிமை’க்கும் ‘தேவனுடைய மகன் மகிமைப்படுதல்’க்கும் உள்ள உறவு
  choice: தேவனுடைய மகிமையையும், இதன் மூலம் தேவனுடைய மகன் மகிமைப்படுவதையும் தனித்தனி ஆனால் தொடர்புடைய நோக்கங்களாக உரை வெளிப்படுத்துகிறது.
  alternative: இரண்டையும் பொதுவான ‘தெய்வீக மகிமை’ என்ற ஒரே கூற்றாகச் சுருக்குதல்.
  rationale: கிரேக்க உரை இரண்டு கூற்றுகளையும் வெளிப்படையாக வைத்திருப்பதால், அவற்றைத் தனித்தனியாகத் தக்கவைப்பது உரையின் கிறிஸ்துவியல் வலிமையைச் சேர்த்துரைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான கதைநடை. ‘மரணத்தில் முடிவதற்கானது’ என்பது சற்றே விளக்கமுடையதாக இருந்தாலும், மூலத்தின் முடிவு/நோக்கு நுணுக்கத்தையும் கதையில் உள்ள இறையியல் பதற்றத்தையும் இயல்பாகத் தக்கவைக்கிறது.
