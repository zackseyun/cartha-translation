- from: யூதர்களில் பலர் மார்த்தாளிடமும் மரியாளிடமும் வந்து, அவர்களுடைய சகோதரனைக் குறித்து அவர்களுக்கு ஆறுதல் சொல்லிக்கொண்டிருந்தார்கள்.[a]
  to: யூதர்களில் பலர், அவர்களுடைய சகோதரனைக் குறித்து அவர்களுக்கு ஆறுதல் கூறுவதற்காக, மார்த்தாளிடமும் மரியாளிடமும் வந்திருந்தார்கள்.[a]
  rationale: The revision renders ἐληλύθεισαν with “வந்திருந்தார்கள்,” preserving its prior-completed force, and renders ἵνα παραμυθήσωνται with “ஆறுதல் கூறுவதற்காக,” preserving the stated purpose. No theological or contextual interpretation beyond the source's wording has been added. The existing footnote’s ambiguity concerning Ἰουδαίων is retained and its anchor remains in place.
