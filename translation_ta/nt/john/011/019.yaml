source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: ta
  text: யூதர்களில் பலர், அவர்களுடைய சகோதரனைக் குறித்து அவர்களுக்கு ஆறுதல் கூறுவதற்காக, மார்த்தாளிடமும் மரியாளிடமும் வந்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களில் பலர் மார்த்தாளிடமும் மரியாளிடமும் வந்திருந்தார்கள்.” கிரேக்கச் சொல் பொதுவாக யூதர்களையோ, யோவான் நூலின் சில சூழல்களில் குறிப்பாக யூதேயர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ ἐκ τῶν Ἰουδαίων
  choice: யூதர்களில் பலர்
  rationale: πολλοί மற்றும் பகுதியைக் குறிக்கும் ἐκ τῶν ஆகியவற்றை இயல்பான தமிழில் தருகிறது. δέ மென்மையான இணைப்புச்சொல் என்பதால் இங்கு தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: ἐληλύθεισαν
  choice: வந்து ... சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுவினையானது கதை நிகழும் நேரத்துக்கு முன்பே அவர்கள் வந்திருந்ததைச் சுட்டுகிறது; தமிழில் அடுத்த நோக்கவினையுடன் இணைத்த தொடர்வடிவம் சூழலுக்கு இயல்பாக உள்ளது.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: மார்த்தாளிடமும் மரியாளிடமும்
  rationale: πρός உடன் வரும் நபர்களைச் சந்திக்கச் சென்றதைக் குறிக்கும் பொருளை இயல்பான தமிழ் வேற்றுமை வடிவத்தில் தருகிறது.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: அவர்களுக்கு ஆறுதல் சொல்ல
  rationale: ἵνα நோக்கத்தையும் παραμυθέομαι துயரத்தில் ஆறுதல் கூறுவதையும் குறிக்கிறது.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: அவர்களுடைய சகோதரனைக் குறித்து
  rationale: περί உடன் வரும் மரணமடைந்த சகோதரனைப் பற்றிய துயரச் சூழலை முறையாகத் தருகிறது; ஒரே சகோதரன் இரு சகோதரிகளுக்கும் உரியவர் என்பதால் உடைமை பன்மையில் வழங்கப்படுகிறது.
theological_decisions:
- issue: யோவான் நூலில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: இங்கு எதிர்ப்பாளர்களையோ தலைவர்களையோ அல்லாமல் துக்கம் விசாரிக்க வந்த மக்களைப் பற்றிய விளக்கம் வருவதால், பரந்த இன-சமயப் பொருளான ‘யூதர்கள்’ இயல்பாகப் பொருந்துகிறது. இருப்பினும் யோவானில் சில சூழல்களில் ‘யூதேயர்கள்’ என்ற நிலப்பகுதி சார்ந்த பொருள் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், துயரச் சூழலுக்கேற்ற கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம வழக்கிற்கு ஏற்ப மார்த்தாள், மரியாள் என வழங்கப்பட்டுள்ளன.
