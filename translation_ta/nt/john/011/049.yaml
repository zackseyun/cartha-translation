  choice: அந்த ஆண்டில் தலைமைக் குருவாக இருந்தவர்
  alternative: அந்த ஆண்டின் தலைமைக் குருவாக இருந்தவர்
  rationale: வரலாற்று விளக்கத்தை நேரடியாகத் தருகிறது; தலைமைக் குருத்துவத்தின் காலவரம்பையோ யோவானின் கதையாடல் நையாண்டியையோ மொழிபெயர்ப்பிலேயே விளக்கி முடிவுசெய்யவில்லை.
