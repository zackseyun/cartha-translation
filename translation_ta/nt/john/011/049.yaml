translation:
  language: ta
  text: ஆனால், அவர்களில் ஒருவரான காய்பா, அந்த ஆண்டில் தலைமை ஆசாரியராக இருந்தவர், அவர்களிடம், “நீங்கள் ஒன்றுமே அறியவில்லை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: ஆனால் அவர்களில் ஒருவரான
  rationale: εἷς ... τις என்பதைத் தமிழில் இயல்பாக ‘அவர்களில் ஒருவர்’ என்று தருகிறது; δέ முந்தைய ஆலோசனையிலிருந்து வரும் மெல்லிய மாறுபாட்டைக் காட்ட ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Καϊάφας
  choice: காய்பா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: ஒரே பதவியாளரைக் குறிக்கும் ἀρχιερεύς என்பதற்குத் துல்லியமான, நவீனத் தமிழில் புரியக்கூடிய இணை.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: அந்த ஆண்டில் தலைமைக் குருவாக இருந்தவர்
  rationale: பங்கேற்புவினைத் தொடரை காய்பாவை விளக்கும் இயல்பான தமிழ்ச் சார்புத்தொடராக மாற்றுகிறது; காலக் குறிப்பை விளக்கவோ மறுபொருளாக்கவோ செய்யவில்லை.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... என்றார்
  rationale: λέγω மற்றும் மறைமுகப் பொருளின் எளிய பொருளை மரியாதையான உரைநடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ὑμεῖς
  choice: உங்களுக்கு
  rationale: வெளிப்படையாக வரும் பன்மை இரண்டாம் நபரைத் தமிழில் இயல்பாகக் காட்டுகிறது; கண்டனத்தின் வலிமை முழு வாக்கிய அமைப்பால் வெளிப்படுகிறது.
- source_word: οὐκ οἴδατε οὐδέν
  choice: ஒன்றுமே தெரியாது
  rationale: கிரேக்க இரட்டை எதிர்மறையின் வலியுறுத்தலைத் தமிழில் இயல்பான ‘ஒன்றுமே’ என்பதால் தக்கவைக்கிறது; இது தர்க்கரீதியான இரட்டை மறுப்பு அல்ல, கடுமையான கண்டனம்.
theological_decisions:
