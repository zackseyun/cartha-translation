id: JHN.11.44
reference: John 11:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ta
  text: இறந்திருந்தவர் வெளியே வந்தார்; அவருடைய கால்களும் கைகளும் அடக்கத் துணிகளால் கட்டப்பட்டிருந்தன; அவருடைய முகம் ஒரு துணியால் சுற்றப்பட்டிருந்தது. இயேசு அவர்களிடம், “இவருடைய கட்டுகளை அவிழ்த்து, இவரைப் போகவிடுங்கள்” என்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: இறந்திருந்தவர்
  rationale: 'Perfect participle, substantivized: the one who had died. This preserves the prior state while using dignified, natural Tamil.'
- source_word: κειρίαις
  choice: அடக்கத் துணிகளால்
  rationale: Refers to strips or bands of cloth used in burial; this is clearer in context than a generic ‘cloth strips’.
- source_word: ἡ ὄψις αὐτοῦ
  choice: அவருடைய முகம்
  rationale: In context ὄψις denotes the visible face or countenance; ‘முகம்’ is natural modern Tamil.
- source_word: σουδαρίῳ
  choice: ஒரு துணியால்
  rationale: A cloth or face-cloth; the context does not require a more technical Tamil term.
- source_word: Λύσατε αὐτόν
  choice: இவருடைய கட்டுகளை அவிழ்த்து
  rationale: Conveys unbinding the person without the potentially awkward literal form ‘இவரை அவிழ்த்து’; the supplied object ‘கட்டுகளை’ is explicit from the immediate context.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: இவரைப் போகவிடுங்கள்
  rationale: Directly expresses the causative-permissive sense ‘let him go’.
- source_word: λέγει
  choice: என்கிறார்
  rationale: Preserves the Greek historical present rather than silently converting it to past tense.
theological_decisions:
- issue: Historical present in λέγει
  choice: என்கிறார்
  alternative: என்றார்
  rationale: The source shifts to a present-tense narrative verb. Tamil can preserve this vivid historical present intelligibly, without altering the event’s historical setting.
- issue: Referent and force of ‘let him go’
  choice: இவரைப் போகவிடுங்கள்
  alternative: இவரைச் செல்ல அனுமதியுங்கள்
  rationale: Retains the straightforward command and does not assign an additional symbolic or theological meaning to ‘go’.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. இறந்தவரைக் குறிக்க மரியாதைப் பன்மை வினை மற்றும் சுட்டுப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலம் ‘என்கிறார்’ என்று பாதுகாக்கப்பட்டுள்ளது.
