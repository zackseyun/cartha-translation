  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: ta
  text: அந்த ஒருவர் வரும்போது[a], பாவத்தைக் குறித்தும் நீதியைக் குறித்தும் நியாயத்தீர்ப்பைக் குறித்தும் உலகம் தவறில் இருப்பதை வெளிப்படுத்துவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “அந்த ஒருவர்” என்ற வலியுறுத்தப்பட்ட சுட்டுப்பெயர் உள்ளது; அது முன்பு குறிப்பிடப்பட்ட துணையாளரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உலகம் தவறு செய்திருப்பதை நிரூபிப்பார்”; “கண்டித்து உணர்த்துவார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: வரும்போது
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு காலத்தைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் “வரும்போது” அந்தத் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: ἐκεῖνος
  choice: அவரோ
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் “-ஓ” விகுதி இயல்பாக வெளிப்படுத்துகிறது; முந்தைய சூழலில் குறிப்பிடப்பட்ட துணையாளரையே இது குறிக்கிறது.
- source_word: ἐλέγξει
  choice: தவறில் இருப்பதை வெளிப்படுத்துவார்
  rationale: ஒருவரின் குற்றத்தையோ தவற்றையோ அம்பலப்படுத்துதல் அல்லது அவர் தவறானவர் எனக் காட்டுதல் என்ற ἐλέγχω என்பதன் ஒழுக்கவியல்-நீதிமன்றத் தன்மையை இது வெளிப்படுத்துகிறது; வெறும் உள்ளார்ந்த குற்றவுணர்ச்சியாக இதைச் சுருக்கவில்லை.
- source_word: τὸν κόσμον
  choice: உலகம்
  rationale: யோவான் எழுத்துகளில் உள்ள பரந்த இறையியல் ஒலிப்பைத் தக்கவைத்து, “மக்கள்” அல்லது “கலகம் செய்யும் உலக அமைப்பு” என்று தேவையின்றி விளக்கவில்லை.
- source_word: περὶ
  choice: குறித்தும்
  rationale: மூன்று முறை வரும் கிரேக்கச் சொல்லின் இணை அமைப்பையும் சொல்லாட்சித் தாளத்தையும் தமிழில் தக்கவைக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவம்
  rationale: ஒருமையைத் தக்கவைக்கும் வழக்கமான, தெளிவான இணைச்சொல்; அடுத்த வசனம் அதன் குறிப்பிட்ட பொருளை விளக்க இடமளிக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதி
  rationale: தமிழில் “நீதி” என்பது நேர்மை/நீதித்தன்மை மற்றும் நியாயம் ஆகிய பொருள் பரப்புகளைக் கொண்டிருப்பதால், இச்சூழலில் கிரேக்கச் சொல்லின் செறிவை இயல்பாகத் தக்கவைக்கிறது.
- source_word: κρίσεως
  choice: நியாயத்தீர்ப்பு
  rationale: சட்டவியல் மற்றும் இறுதிக்காலத் தீர்ப்பு ஆகிய ஒலிப்புகளைத் தக்கவைக்கிறது; அதை முன்கூட்டியே “தண்டனைத் தீர்ப்பு” என்று குறுக்கவில்லை.
theological_decisions:
- issue: ἐκεῖνος என்பதன் குறிப்பு மற்றும் வலியுறுத்தல்
  choice: முந்தைய சூழலில் வரும் துணையாளரைக் குறிக்கும் வலியுறுத்தப்பட்ட “அவரோ”
  alternative: வலியுறுத்தல் வெளிப்படாத எளிய “அவர்” அல்லது சொற்சொல்லான “அந்த ஒருவர்”
  rationale: உடனடியான உரைச்சூழல் வருகிறவரைத் துணையாளராக அடையாளப்படுத்துகிறது. “அவரோ” என்பது கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்காமல் கிரேக்க வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நீதித்தன்மை; நியாயம்
  rationale: அடுத்த வசனத்தில் இயேசு தந்தையிடம் செல்வதோடு இது தொடர்புபடுத்தப்படுவதால், “நீதி” என்ற பரந்த சொல் ஏற்றது; “நியாயம்” மட்டும் என்று மொழிபெயர்த்தால் நீதிநிர்வாகப் பொருளுக்கு அளவுக்கு மீறிச் சுருங்கலாம்.
- issue: ἐλέγξει என்பதன் செயல்
  choice: உலகம் தவறில் இருப்பதை வெளிப்படுத்துதல்
  alternative: உலகத்தைக் கண்டித்து உணர்த்துதல்; உலகம் தவறு என நிரூபித்தல்
  rationale: இந்த வினை குற்றத்தை அம்பலப்படுத்துதல், தவறை நிரூபித்தல், கண்டித்தல் ஆகிய அர்த்தங்களை ஏற்கலாம். முதன்மை உரை அதன் பொருள் பரப்பைத் தக்கவைத்து, உலகம் மனத்தில் அவசியம் குற்றவுணர்வு அடையும் என்று கூறவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. மூன்று “குறித்தும்” தொடர்களால் மூலத்தின் சொல்நய இணை அமைப்பு தக்கவைக்கப்பட்டுள்ளது. “அவரோ” என்பது சொற்சொல்லான “அந்த ஒருவர்” என்பதைக் காட்டிலும் தமிழில் இயல்பாக இருந்து, மூலத்தின் வலியுறுத்தலையும் காக்கிறது.
