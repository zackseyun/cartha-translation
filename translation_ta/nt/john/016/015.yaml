  source_fidelity: மூலத்தின் முழுமைப்படுத்தும் πάντα ὅσα, தந்தையின் உடைமை, மகனுக்குரிய உடைமைக்கூற்று, காரணத் தொடர்பு, λαμβάνει-இன் நிகழ்காலம், ἀναγγελεῖ-இன் எதிர்காலம், மற்றும் பன்மை ‘உங்களுக்கு’ ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘எனக்குரியவற்றிலிருந்து’ என்பது ἐκ τοῦ ἐμοῦ என்பதன் உடைமைச் சுட்டலைச் சரியாக வெளிப்படுத்துகிறது.
