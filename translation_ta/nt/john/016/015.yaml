id: JHN.16.15
reference: John 16:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: ta
  text: தந்தையிடம் உள்ளவை அனைத்தும் எனக்குரியவை. அதனால்தான், அவர் எனக்குரியவற்றிலிருந்து எடுத்துக்கொள்கிறார்[a] என்றும், உங்களுக்கு அறிவிப்பார் என்றும் சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெற்றுக்கொள்கிறார்.”
    reason: λαμβάνει என்பது இச்சூழலில் ‘எடுத்துக்கொள்கிறார்’ அல்லது ‘பெற்றுக்கொள்கிறார்’ என்று பொருள்படலாம்.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: உள்ளவை அனைத்தும்
  rationale: முழுமையையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχει ὁ πατὴρ
  choice: தந்தையிடம் உள்ளவை
  rationale: ἔχω என்பதன் உடைமைப் பொருளை அளவுக்கு மீறிய சட்டரீதியான சொல்லாட்சியின்றித் தெளிவாகக் காட்டுகிறது.
- source_word: ἐμά ἐστιν
  choice: எனக்குரியவை
  rationale: பன்மை நடுநிலை உடைமைப் பொருளைத் தமிழில் இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: διὰ τοῦτο
  choice: அதனால்தான்
  rationale: முந்தைய கூற்றிலிருந்து வரும் காரணவிளக்கத் தொடர்பை நவீன தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: எனக்குரியவற்றிலிருந்து
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான உடைமைச் சொற்றொடரை இயல்பான தமிழில் வெளிப்படையாக்குகிறது; ‘என்னிடமிருந்து’ என்று மாற்றி மூலத்தின் நுணுக்கத்தை இழக்கவில்லை.
- source_word: λαμβάνει
  choice: எடுத்துக்கொள்கிறார்
  rationale: நிகழ்கால வடிவத்தையும் ‘எடுத்தல்’ என்ற அடிப்படை நுணுக்கத்தையும் காக்கிறது; ‘பெற்றுக்கொள்கிறார்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀναγγελεῖ
  choice: அறிவிப்பார்
  rationale: எதிர்காலத்தையும் வெளிப்படுத்தி அறிவிக்கும் கருத்தையும் தெளிவாகக் காக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: சீடர்களை நோக்கிய பன்மை மறைமுகச் செயப்படுபொருளை நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: தந்தையிடம் உள்ள அனைத்திற்கும் மகனுக்கும் உள்ள உறவு
  choice: தந்தையிடம் உள்ளவை அனைத்தும் எனக்குரியவை
  alternative: தந்தைக்கு உரிய அனைத்தும் என்னுடையவை
  rationale: மகனின் வலிமையான உடைமைக்கூற்றைப் பாதுகாக்கிறது; ஆனால் மூலத்தில் இல்லாத பிற்கால இறையியல் சொற்களைச் சேர்க்கவில்லை.
- issue: ஆவியானவர் மகனுக்குரியவற்றிலிருந்து எடுப்பது அல்லது பெறுவது
  choice: எடுத்துக்கொள்கிறார்
  alternative: பெற்றுக்கொள்கிறார்
  rationale: λαμβάνει இரு நுணுக்கங்களையும் கொள்ளக்கூடியதால் முதன்மை உரையில் ‘எடுத்துக்கொள்கிறார்’ என்றும் மாற்றுப் பொருளை அடிக்குறிப்பிலும் வைத்து இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘தந்தை’ என்பது யோவான் நற்செய்தியின் இறையியல் சூழலில் பட்டப்பெயராகப் புரியுமாறு வைக்கப்பட்டுள்ளது. கிரேக்கத்தின் நிகழ்கால ‘எடுத்துக்கொள்கிறார்’ மற்றும் எதிர்கால ‘அறிவிப்பார்’ ஆகிய கால வேறுபாடுகள் பாதுகாக்கப்பட்டுள்ளன.
