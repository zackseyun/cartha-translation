translation:
  language: ta
  text: பாவத்தைக் குறித்து[a]—அவர்கள் என்னில் நம்பிக்கை வைக்காததால்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் என்னில் நம்பிக்கை வைக்காததைப் பற்றி.’ கிரேக்க இணைப்புச்சொல்லை ‘ஏனெனில்’ என்ற காரணப் பொருளிலும், ‘என்று’ விளக்கும் வகையிலும் மொழிபெயர்க்கலாம்; இச்சூழலில் காரணப் பொருள் பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: குறித்து
  rationale: இங்கு மரபுவழி ஆவியானவர் எதைக் குறித்து கண்டித்து உணர்த்துவார் என்பதைக் அறிமுகப்படுத்துகிறது; அடுத்த வசனங்களின் இணை அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவம்
  rationale: ஒருமைச் சுருக்கப்பெயரைத் தனிப்பட்ட பாவச்செயல்களாக விரிவாக்காமல், பொதுப் பொருள் வகையாகவே காக்கிறது.
- source_word: μέν
  choice: தனிச் சொல் இணைக்கப்படவில்லை
  rationale: இது 10–11ஆம் வசனங்களில் தொடரும் பட்டியலின் முதல் உறுப்பைக் குறிக்கிறது; தமிழில் கோடும் இணை அமைப்பும் அதன் உரையாடல் பணியைப் போதுமான அளவு வெளிப்படுத்துகின்றன.
- source_word: ὅτι
  choice: -ஆதால்
  rationale: முந்தைய ‘பாவத்தைக் குறித்து’ என்பதற்கான காரணம் அல்லது விளக்க அடிப்படையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘என்பதை’ என்ற மாற்று மொழிபெயர்ப்பும் இலக்கண ரீதியாகச் சாத்தியம்.
- source_word: οὐ πιστεύουσιν
  choice: நம்பிக்கை வைக்காத
  rationale: நிகழ்காலத்தில் தொடரும் அவநம்பிக்கையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰς ἐμέ
  choice: என்னில்
  rationale: யோவானின் πιστεύω εἰς கட்டமைப்பில் இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையைச் சுருக்கமாகவும் மரியாதையான தமிழிலும் காக்கிறது.
theological_decisions:
- issue: இந்த வசனத்தில் குறிப்பிடப்படும் பாவத்தின் தன்மை
  choice: இச்சூழலில் இயேசுவில் நம்பிக்கை வைக்காததே ‘பாவம்’ குறித்த கண்டித்துணர்த்தலுக்கான காரணம் அல்லது தீர்மானமான வெளிப்பாடு என உரையின் நேரடி இணைப்பைக் காக்கிறது.
  alternative: மனிதரின் பொதுவான பாவநிலையைக் குறித்துச் சொல்லி, அவநம்பிக்கையை அதன் ஓர் எடுத்துக்காட்டாக மட்டும் கொள்ளுதல்.
  rationale: ὅτι என்ற இணைப்புச்சொல் ‘பாவத்தைக் குறித்து’ என்பதை ‘அவர்கள் என்னில் நம்பிக்கை வைக்கவில்லை’ என்பதுடன் நேரடியாக இணைக்கிறது; ஆனால் வசனம் கூறுவதைக் கடந்து ஒரு விரிவான கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பான, கண்ணியமான நடை. அடுத்த வசனங்களோடு தொடரும் இணை அமைப்பை மனதில் கொண்டு சுருக்கமான சொற்றொடர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
