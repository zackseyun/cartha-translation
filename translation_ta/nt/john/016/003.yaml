  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: ta
  text: அவர்கள் பிதாவையும் என்னையும் அறியாததால், இவற்றைச் செய்வார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிதாவையும் என்னையும் அவர்கள் அறிந்திருக்காததால்” அல்லது “பிதாவையும் என்னையும் அவர்கள் அறிந்துகொள்ளாததால்.” இங்குள்ள கிரேக்க வினைச்சொல்லைத் தமிழில் ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: முந்தைய வசனத்தோடு உள்ள இணைப்பைத் தமிழில் இயல்பான தொடர்ச்சியே காட்டுகிறது; தொடக்கத்தில் ‘மேலும்’ சேர்த்தால் தேவையற்ற கனத்த தன்மை ஏற்படும்.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முந்தைய சூழலில் கூறப்பட்ட பகைமையான செயல்களைப் பன்மையில் பின்னோக்கிச் சுட்டுகிறது.
- source_word: ποιήσουσιν
  choice: செய்வார்கள்
  rationale: ποιέω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: -ஆதால்
  rationale: அவர்கள் செய்யப்போகும் செயல்களுக்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὐκ ἔγνωσαν
  choice: அறிந்துகொள்ளாததால்
  rationale: γινώσκω என்பதிலுள்ள அறிதல் அல்லது உறவுபூர்வமாக அறிந்துகொள்ளுதல் என்ற நுணுக்கத்தைத் தக்கவைக்கிறது; கிரேக்க இறந்தகால வடிவத்தின் தமிழாக்க வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τὸν πατέρα
  choice: பிதாவை
  rationale: யோவான் நற்செய்தியில் தேவனை இயேசுவோடு உள்ள உறவில் குறிக்கும் தனிப்பட்ட பட்டப்பெயராக இருப்பதால் ‘பிதா’ பயன்படுத்தப்படுகிறது.
- source_word: οὐδὲ ἐμέ
  choice: என்னையும்
  rationale: மறுக்கப்பட்ட இரண்டாவது பொருளைத் தமிழில் ‘பிதாவையும் என்னையும்’ என்ற இயல்பான இணை அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனையும் இயேசுவையும் ‘அறிதல்’ குறித்த யோவானிய மொழி
  choice: பிதாவையும் என்னையும் அறிந்துகொள்ளாததால்
  alternative: பிதாவையோ என்னையோ அவர்கள் அறியாததால்
  rationale: இது வெறும் தகவல் அறியாமையை மட்டும் அல்லாமல் உறவுபூர்வமான அறிதலின்மையையும் குறிக்கக்கூடும். மொழிபெயர்ப்பு அந்த நுணுக்கத்தைத் தக்கவைக்கிறது; அதை விரிவான கோட்பாட்டு விளக்கமாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பிதா’ என்பது யோவானிய சூழலின் உறவுப்பெயரைத் தக்கவைக்கிறது; ‘அறிந்துகொள்ளாததால்’ என்பது காரணத் தொடர்பையும் உறவுபூர்வ அறிதலின் சாத்திய நுணுக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
