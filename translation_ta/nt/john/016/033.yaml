id: JHN.16.33
reference: John 16:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: ta
  text: என்னில் உங்களுக்குச் சமாதானம் இருக்கும்படி இவற்றை உங்களிடம் பேசியிருக்கிறேன். உலகத்தில் உங்களுக்குத் துன்பம்[a] உண்டு; ஆனாலும் தைரியமாயிருங்கள்[b]; நான் உலகத்தை வென்றிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துன்பம்” என்பதை “நெருக்கடி,” “வேதனை,” அல்லது “இக்கட்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தைரியமாயிருங்கள்” என்பதை “மனந்தளராதிருங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரின் வடிவத்தைப் பாதுகாத்து, இயேசு முன்பு பேசியவற்றைக் கூட்டாகக் குறிக்கிறது.
- source_word: λελάληκα
  choice: பேசியிருக்கிறேன்
  rationale: நிறைவுபெற்ற பேச்சுச் செயலின் தொடரும் முக்கியத்துவத்தை கிரேக்க நிறைவுக்காலத்துக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἐν ἐμοὶ
  choice: என்னில்
  rationale: யோவான் நற்செய்தியின் முக்கியமான உறவுநிலை மொழியை விளக்கவுரையாக விரிவாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰρήνην ἔχητε
  choice: உங்களுக்குச் சமாதானம் இருக்கும்படி
  rationale: நோக்கத்தையும் தொடர்ந்து நிலவும் சமாதானத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῷ κόσμῳ
  choice: உலகத்தில்
  rationale: κόσμος என்பதன் பல அடுக்குப் பொருளை ‘உலக அமைப்பு’ போன்ற விளக்கச் சேர்க்கையால் குறுக்காமல் பாதுகாக்கிறது.
- source_word: θλῖψιν
  choice: துன்பம்
  rationale: அழுத்தம், வேதனை, நெருக்கடி ஆகிய பொருள் பரப்பைக் கொண்ட சொல்லுக்கு பொதுவாகப் புரியும், போதிய கனமுள்ள தமிழ்ச் சொல்.
- source_word: θαρσεῖτε
  choice: தைரியமாயிருங்கள்
  rationale: துன்பத்தின் நடுவில் துணிவுடன் இருக்கும்படி கூறும் கட்டளையின் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: νενίκηκα
  choice: வென்றிருக்கிறேன்
  rationale: முடிவுற்றும் தொடர்ந்து விளைவுடைய வெற்றியை கிரேக்க நிறைவுக்காலத்துக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் κόσμος என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘உலகம்’ என்றே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உலக அமைப்பு’ அல்லது ‘வீழ்ந்த உலகம்’
  rationale: தேவனுக்கு எதிரான மனித ஒழுங்கு என்ற கருத்து சூழலில் புலப்பட்டாலும், ‘உலகம்’ என்ற சொல் கொண்டுள்ள விரிந்த யோவானிய பொருளை மொழிபெயர்ப்பு முன்கூட்டியே குறுக்கவில்லை.
- issue: இயேசுவின் நிறைவுக்கால வினைகளின் வலிமை
  choice: ‘பேசியிருக்கிறேன்’ மற்றும் ‘வென்றிருக்கிறேன்’ எனத் தொடரும் விளைவைக் காட்டும் வடிவங்கள் பயன்படுத்தப்பட்டன.
  alternative: ‘பேசினேன்’ மற்றும் ‘வென்றேன்’
  rationale: கிரேக்க நிறைவுக்காலம் நிறைவுற்ற செயல்களையும் அவற்றின் நீடிக்கும் முக்கியத்துவத்தையும் காட்டுகிறது; குறிப்பாக சிலுவை நிகழ்வுக்கு முன்பே இயேசு அறிவிக்கும் வெற்றியின் இலக்கிய மற்றும் இறையியல் அழுத்தம் இதனால் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘உபத்திரவம்’ போன்ற மரபுவழிச் சொல்லுக்குப் பதிலாக இயல்பான ‘துன்பம்’ பயன்படுத்தப்பட்டது; யோவானிய ‘என்னில்’ என்ற சொற்றொடர் மட்டும் அதன் இறையியல் செறிவுக்காக நேரடியாகப் பாதுகாக்கப்பட்டது.
