source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: ta
  text: நீதியைக் குறித்தும்[a]—ஏனெனில், நான் தந்தையிடம் செல்கிறேன்; நீங்கள் இனி என்னைக் காண்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயத்தைக் குறித்தும்.’ கிரேக்கச் சொல் நீதி மற்றும் நியாயம் ஆகிய இரு பொருள்களையும் குறிக்கலாம். இங்கு இயேசு தந்தையிடம் செல்வதன் மூலம் அவருடைய நேர்மை மெய்ப்பிக்கப்படுவது சூழலின் மையமாக இருப்பதால், முதன்மை உரையில் ‘நீதி’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δικαιοσύνης δέ
  choice: நீதியைக் குறித்தும்
  rationale: முந்தையதும் அடுத்ததும் ஆகிய இணையான பட்டியல் உறுப்புகளுடன் தொடர்ச்சியைப் பேணுகிறது. δικαιοσύνη என்பதன் அறநெறிசார் சரியான தன்மை மற்றும் நியாயம் ஆகிய பொருள் எல்லையைத் தமிழின் ‘நீதி’ இயல்பாகத் தாங்குகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு இயேசு தந்தையிடம் செல்வதையும் சீடர்கள் இனி அவரைக் காணாததையும் விளக்கக் காரணமாக அறிமுகப்படுத்துகிறது.
- source_word: πρὸς τὸν πατέρα ὑπάγω
  choice: நான் தந்தையிடம் செல்கிறேன்
  rationale: πρός உடன் வரும் நகர்வையும் ὑπάγωவின் நிகழ்கால வடிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘என்’ என்பதைச் சேர்க்கவில்லை.
- source_word: οὐκέτι θεωρεῖτέ με
  choice: நீங்கள் இனி என்னைக் காண்பதில்லை
  rationale: οὐκέτι என்பதின் ‘இனிமேல் இல்லை’ என்ற பொருளையும் θεωρέωவின் பார்வையால் காணுதல் என்ற நேரடிப் பொருளையும் பேணுகிறது; கிரேக்க நிகழ்காலத்தைத் தேவையின்றி வெளிப்படையான எதிர்காலமாக மாற்றவில்லை.
theological_decisions:
- issue: δικαιοσύνη என்ற இறையியல் முக்கியத்துவமுள்ள சொல்லின் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இச்சூழலில் இயேசு தந்தையிடம் செல்வதன் மூலம் வெளிப்படும் அவருடைய சரியான நிலை அல்லது மெய்ப்பிப்பு முன்னிலையில் இருப்பதால் ‘நீதி’ பொருத்தமானது. அதே நேரத்தில், கிரேக்கச் சொல்லின் நியாயம் சார்ந்த பொருள் அடிக்குறிப்பில் பேணப்படுகிறது; உரை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்துக்குள் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. இவ்வசனம் முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலின் ஒரு பகுதியாக இருந்தாலும், தனியே வாசிக்கும்போதும் தெளிவாக இருக்க நீண்ட கோட்டுக்குப் பின் காரணவாக்கியம் தரப்பட்டுள்ளது.
