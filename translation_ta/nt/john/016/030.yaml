id: JHN.16.30
reference: John 16:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: ta
  text: “இப்போது, உமக்கு எல்லாம் தெரியும் என்றும், யாரும் உம்மிடம் கேள்வி கேட்க வேண்டிய தேவை உமக்கு இல்லை என்றும் நாங்கள் அறிகிறோம். இதனால் நீர் கடவுளிடமிருந்து வந்தீர் என்று நம்புகிறோம்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: இப்போது
  rationale: சீடர்கள் தற்போது அடைந்த புரிதலைக் குறிக்கும் கால வினையடை; நவீனத் தமிழில் இயல்பான நேரடி இணை.
- source_word: οἴδαμεν
  choice: நாங்கள் அறிந்திருக்கிறோம்
  rationale: οἶδα நிகழ்காலப் பொருளில் ‘அறிதல்’ என்பதைக் குறிக்கிறது; தமிழில் நிலைத்திருக்கும் தற்போதைய அறிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἶδας πάντα
  choice: உமக்கு எல்லாம் தெரியும்
  rationale: πάντα என்பதன் முழுமையான பரப்பைத் தக்கவைத்து, சாதாரண நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: οὐ χρείαν ἔχεις
  choice: தேவை உமக்கு இல்லை
  rationale: கிரேக்கத்தின் பெயர்ச்சொல் சார்ந்த ‘தேவை இல்லை’ அமைப்பையும் அதன் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: யாரும் உம்மிடம் கேள்வி கேட்க வேண்டிய
  rationale: இயேசுவின் அறிவையும் சீடர்களின் கேட்கப்படாத எண்ணங்களையும் பற்றிய உடனடிச் சூழலில் ἐρωτάω என்பதன் ‘கேட்பது/வினவுவது’ என்ற பொருளை ‘கேள்வி கேட்க’ தெளிவாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τούτῳ
  choice: இதனால்
  rationale: சீடர்களின் நம்பிக்கைக்கான ஆதாரம் அல்லது அடிப்படையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πιστεύομεν
  choice: நம்புகிறோம்
  rationale: இந்த அறிக்கையின் ஒப்புதல் சார்ந்த சூழலில் πιστεύω என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணை.
- source_word: ἀπὸ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: மூலத்தில் உள்ள θεός என்பதை நேரடியாகத் தருகிறது; ‘தந்தையிடமிருந்து’ என்று சூழலிலிருந்து கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: ἐξῆλθες
  choice: வந்தீர்
  rationale: கடவுளிடமிருந்து வந்த தோற்றத்தையும் அனுப்பப்பட்ட பணியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘புறப்பட்டீர்’ என்பது இச்சூழலில் இயல்புக் குறைவானது.
theological_decisions:
- issue: οἶδας πάντα என்பதன் கிறிஸ்தியல் வலிமை
  choice: உமக்கு எல்லாம் தெரியும்
  alternative: நீர் அனைத்தையும் அறிந்த சர்வஞானி
  rationale: சீடர்களின் அறிக்கையை அதன் முழு வலிமையுடன் தக்கவைக்கிறது; ஆனால் மூலத்தில் இல்லாத விளக்கமான கோட்பாட்டுச் சொல்லைச் சேர்க்கவில்லை.
- issue: ἀπὸ θεοῦ ἐξῆλθες என்பதன் பொருள்
  choice: நீர் கடவுளிடமிருந்து வந்தீர்
  alternative: நீர் தந்தையிடமிருந்து வந்தீர்
  rationale: தெய்வீகத் தோற்றம் அல்லது பணியனுப்புதலை நேரடியாகக் கூறுகிறது. அருகிலுள்ள சூழலோடு ஒத்திசைக்க ‘தந்தை’ என்பதை இறக்குமதி செய்யாமல், இவ்வசனத்தின் θεός என்ற சொல்லைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய மரியாதை ஒருமை வடிவங்களான ‘நீர்/உமக்கு/உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் சற்றே சுருக்கமான வாக்கிய அமைப்பு தமிழில் புரியும்படி அமைக்கப்பட்டாலும், கேட்பது/கேள்வி கேட்பது என்ற உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
