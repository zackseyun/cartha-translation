  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: ta
  text: சிறிது நேரத்தில் நீங்கள் இனி என்னைக் காணமாட்டீர்கள்; மீண்டும் சிறிது நேரத்தில் என்னைக் காண்பீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இங்கு ‘காணுதல்’ என்பதற்குக் கிரேக்கத்தில் இரண்டு வெவ்வேறு வினைகள் பயன்படுத்தப்பட்டுள்ளன: முதல் கூறில் θεωρέω; இரண்டாவது கூறில் ὁράω. அவற்றுக்கு இடையில் நுண்ணிய பொருள் வேறுபாடு இருக்கக்கூடும். ஆனால் இவ்வசனத்தில் முதன்மையான முரண் காலநிலையைச் சார்ந்தது என்பதால், இரண்டுமே ‘காணுதல்’ என மொழிபெயர்க்கப்பட்டுள்ளன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: சிறிது நேரம்
  rationale: இங்கு நடுநிலை ஒருமை பெயரடை வினையடைப் பொருளில் வந்து, குறுகிய காலப்பகுதியைக் குறிக்கிறது. ‘சிறிது நேரம்’ என்பது இயல்பான நவீனத் தமிழாகவும் காலத்தின் சுருக்கத்தைத் தெளிவாகவும் தருகிறது.
- source_word: οὐκέτι
  choice: இனி ... காணமாட்டீர்கள்
  rationale: ஒரு குறிப்பிட்ட கட்டத்திற்குப் பின் நிலை தொடராது என்பதைக் குறிக்கும் οὐκέτι என்பதற்கு எதிர்காலச் சூழலில் ‘இனி ... காணமாட்டீர்கள்’ இயல்பான தமிழாக்கம்.
- source_word: θεωρεῖτέ
  choice: காணமாட்டீர்கள்
  rationale: θεωρέω கவனித்துப் பார்த்தல் அல்லது நேரில் காணுதல் என்ற நுணுக்கம் கொள்ளக்கூடும்; இச்சூழலில் பொதுவான ‘காணுதல்’ பொருள் தெளிவாக உள்ளது.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: அடுத்ததாக நிகழும் மாற்றத்தையும் மீண்டும் காண்பதையும் πάλιν குறிக்கிறது; ‘மறுபடியும்’ இணை அமைப்பைப் பேணுகிறது.
- source_word: ὄψεσθέ
  choice: காண்பீர்கள்
  rationale: ὁράω என்பதன் எதிர்கால வடிவம் இங்கு எதிர்காலத்தில் காண்பதைக் குறிக்கிறது. முதல் வினையோடு செயற்கையான வேறுபாட்டை உருவாக்காமல் ‘காண்பீர்கள்’ என வழங்கப்படுகிறது.
- source_word: με
  choice: என்னை
  rationale: இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: καὶ
  choice: அதன்பின் / மறுபடியும்
  rationale: மீண்டும் வரும் καὶ இரண்டு காலக் கூறுகளையும் இணைக்கிறது. தமிழின் இயல்புக்காக முதல் இடத்தில் காலத் தொடரை வெளிப்படுத்தும் ‘அதன்பின்’ என்றும், πάλιν உடன் அடுத்த இடத்தில் ‘மறுபடியும்’ என்றும் அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: θεωρέω, ὁράω ஆகிய இரண்டு ‘காணுதல்’ வினைகளையும் தமிழில் வேறுபடுத்த வேண்டுமா?
  choice: முதன்மை உரையில் இரண்டையும் ‘காணுதல்’ என மொழிபெயர்த்தல்
  alternative: ‘என்னைப் பார்க்கமாட்டீர்கள் ... என்னைக் காண்பீர்கள்’ என்று இரு வேறு தமிழ் வினைகளைப் பயன்படுத்துதல்
  rationale: யோவான் எழுத்தில் இவ்விரு கிரேக்க வினைகளின் பொருள் பரவலாக ஒன்றோடொன்று ஒட்டுகிறது. அவற்றுக்கு வலுவான இறையியல் வேறுபாட்டைத் தமிழில் திணிப்பதைவிட, இவ்வசனத்தின் காலநிலை எதிர்மறையைப் பேணுவது பொருத்தமானது; சொல் வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சமச்சீர் கால அமைப்பைத் தமிழில் இயல்பாகக் காட்ட ‘அதன்பின்’ சேர்க்கப்பட்டுள்ளது; உரையில் இல்லாத குறிப்பிட்ட நிகழ்வியல் அல்லது சமயவியல் விளக்கம் புகுத்தப்படவில்லை.
