reference: John 16:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: ta
  text: '“மெய்யாகவே, மெய்யாகவே உங்களுக்குச் சொல்கிறேன்: நீங்கள் அழுது புலம்புவீர்கள்; உலகமோ மகிழும். நீங்கள் துயரப்படுவீர்கள்; ஆனால் உங்கள் துயரம் மகிழ்ச்சியாக மாறும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் துயரம் மகிழ்ச்சியாக ஆகும்.”
    reason: γενήσεται என்பதன் ‘ஆகும்’ என்ற நேரடியான வடிவத்தையும், ‘மாறும்’ என்ற இயல்பான தமிழாக்கத்தையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: மெய்யாகவே, மெய்யாகவே
  rationale: இயேசுவின் கூற்றை வலியுறுத்தும் இரட்டிப்பைத் தக்கவைத்து, நவீனத் தமிழிலும் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையை வழங்குகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி அழைப்பையும் யோவான் நற்செய்தியில் திரும்பத் திரும்ப வரும் கூற்று வடிவத்தையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: அழுது புலம்புவீர்கள்
  rationale: κλαύω என்பதின் அழுகையையும் θρηνέω என்பதின் வெளிப்படையான புலம்பலையும் வேறுபாடு மங்காமல் இணைக்கிறது.
- source_word: ὁ δὲ κόσμος χαρήσεται
  choice: உலகமோ மகிழும்
  rationale: δέ குறிக்கும் முரண்பாட்டை ‘-ஓ’ என்ற தமிழ்ச் சொல்லுருபால் இயல்பாக வெளிப்படுத்தி, κόσμος என்பதை விளக்கவுரை சேர்க்காமல் ‘உலகம்’ என்றே வைத்திருக்கிறது.
- source_word: λυπηθήσεσθε
  choice: நீங்கள் துயரப்படுவீர்கள்
  rationale: வரவிருக்கும் மனவேதனையை இயல்பான நவீனத் தமிழில் தெரிவிப்பதோடு, அடுத்துள்ள λύπη என்பதுடனான சொற்பொருள் தொடர்பையும் தக்கவைக்கிறது.
- source_word: ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται
  choice: உங்கள் துயரம் மகிழ்ச்சியாக மாறும்
  rationale: εἰς உடன் வரும் γενήσεται குறிக்கும் ஒரு நிலையிலிருந்து இன்னொரு நிலைக்கு ஏற்படும் மாற்றத்தை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் κόσμος என்பதன் பொருள்
  choice: உலகம்
  alternative: நம்பாத உலகம்; உலக அமைப்பு
  rationale: இங்கு இயேசுவுக்கும் சீடர்களுக்கும் எதிராக மகிழும் மனிதக் கூட்டத்தைக் குறிக்கும் எதிர்மறை நிழல் இருக்கலாம். எனினும் வசனம் அதை வெளிப்படையாக வரையறுக்காததால், விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் பரந்த சொல்லையும் அதன் இறையியல் அழுத்தத்தையும் தக்கவைக்கிறது.
- issue: λύπη மகிழ்ச்சியாகும் விதம்
  choice: துயரம் மகிழ்ச்சியாக மாறும்
  alternative: துயரத்திற்குப் பதிலாக மகிழ்ச்சி வரும்
  rationale: மூலத்தில் சீடர்களின் துயரமே மகிழ்ச்சியாக ஆகும் எனச் சொல்லப்படுகிறது; வெறும் மாற்றீடு வருவது போலப் பொருளைத் தளர்த்தாமல் அந்த வலிமையான மாற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மெய்யாகவே’ என்ற தொடர் இயேசுவின் வலியுறுத்தலைத் தக்கவைக்கிறது; ‘உலகமோ’ என்பது முரண்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
