  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: ta
  text: நான் தந்தையிடமிருந்து புறப்பட்டு உலகத்திற்குள் வந்திருக்கிறேன். மறுபடியும், உலகத்தைவிட்டு நீங்கி தந்தையிடம் செல்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: தந்தையிடமிருந்து புறப்பட்டு
  rationale: ἐξέρχομαι மற்றும் ἐκ ஆகியவை தந்தையை மூலமாகக் கொண்ட புறப்பாட்டைக் குறிக்கின்றன. ‘புறப்பட்டு’ என்பது இயல்பான நவீன தமிழில் இயக்கத்தையும் மூலத்தையும் காக்கிறது; தேவையற்ற கோட்பாட்டு விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: உலகத்திற்குள் வந்திருக்கிறேன்
  rationale: நிறைவுவினையின் முடிந்த செயலும் அதன் நிகழ்காலத் தொடர்பும் ‘வந்திருக்கிறேன்’ என்பதில் வெளிப்படுகின்றன. εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தை ‘உலகத்திற்குள்’ காக்கிறது.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: முதல் இயக்கத்துக்கு எதிரான அடுத்த இயக்கத்தைத் தொடர் வரிசையில் குறிக்கிறது. தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀφίημι τὸν κόσμον
  choice: உலகத்தைவிட்டு நீங்கி
  rationale: இங்கு ἀφίημι உலகத்தை விட்டுச் செல்லும் உடனடியான செயலைக் குறிக்கிறது. ‘நீங்கி’ என்பது வெறுமனே கைவிடுதல் என்ற தவறான நிழற்பொருளைத் தவிர்த்து, புறப்படுதலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: தந்தையிடம் செல்கிறேன்
  rationale: πρός குறிக்கும் இலக்கு நோக்கிய இயக்கத்தை ‘தந்தையிடம்’ துல்லியமாகத் தருகிறது; ‘செல்கிறேன்’ நிகழ்காலத்தில் நெருங்கிய புறப்பாட்டை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: ‘தந்தையிடமிருந்து புறப்பட்டு’ என்பதில் இயேசுவுக்கும் தந்தைக்கும் உள்ள உறவு
  choice: தந்தையை இயேசுவின் புறப்பாட்டின் மூலமாக நேரடியாகக் கூறுதல்
  alternative: இதை ‘கடவுளிடமிருந்து வந்தேன்’ என்று பொதுமைப்படுத்துதல் அல்லது முன்இருப்பு/மனிதராதல் பற்றிய விளக்கத்தை வசனத்துக்குள் சேர்த்தல்
  rationale: கிரேக்க உரை தந்தையிடமிருந்து வந்ததையும் தந்தையிடம் திரும்பிச் செல்வதையும் கூறுகிறது. அதன் உயர்ந்த கிறிஸ்தியல் வலிமையைப் பாதுகாத்து, உரையில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ்ச் சார்ந்த பொதுநடை; கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதும். மூலத்தின் இணையான இரு இயக்கங்கள்—தந்தையிடமிருந்து உலகத்திற்குள் வருதல், உலகத்தைவிட்டு தந்தையிடம் செல்லுதல்—தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
