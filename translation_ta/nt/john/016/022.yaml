id: JHN.16.22
reference: John 16:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: ta
  text: அதுபோல, இப்போது நீங்களும் துயரத்தில் இருக்கிறீர்கள். ஆனால் நான் உங்களை மீண்டும் காண்பேன்; அப்போது உங்கள் உள்ளம் மகிழும். உங்கள் மகிழ்ச்சியை யாரும் உங்களிடமிருந்து பறித்துக்கொள்ள மாட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: அதுபோல, ... நீங்களும்
  rationale: முந்தைய பிரசவ உவமையிலிருந்து சீடர்களின் நிலைக்கு வரும் தொடர்பையும், ὑμεῖς என்பதன் ‘நீங்களும்’ என்ற இணைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: இப்போது ... துயரத்தில் இருக்கிறீர்கள்
  rationale: λύπη குறிக்கும் ஆழ்ந்த துயரத்தைத் தெளிவாகத் தருகிறது; μέν-க்கு இணையான எதிர்மறைத் தொடர்பு அடுத்துள்ள ‘ஆனால்’ என்பதால் வெளிப்படுகிறது.
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: ஆனால் நான் உங்களை மீண்டும் காண்பேன்
  rationale: கிரேக்கத்தில் இயேசுவே வினையின் எழுவாய்; ‘உங்களை’ அதன் செயப்படுபொருள். இதை அருகிலுள்ள வசனங்களின் சொற்றொடருக்கு ஏற்ப மாற்றாமல் அப்படியே காக்கிறது.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: உங்கள் உள்ளம் மகிழும்
  rationale: ‘உள்ளம்’ என்பது καρδία-வின் உணர்வு மற்றும் அகமனிதன் சார்ந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது; χαρήσεται-யின் வினைச்செயலையும் காக்கிறது.
- source_word: τὴν χαρὰν ὑμῶν
  choice: உங்கள் மகிழ்ச்சி
  rationale: χαρά என்பதற்கான நேரான, இயல்பான பெயர்ச்சொல்; முந்தைய ‘மகிழும்’ என்பதுடனான சொற்பொருள் தொடர்பையும் தக்கவைக்கிறது.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: யாரும் உங்களிடமிருந்து பறித்துக்கொள்ள மாட்டார்கள்
  rationale: வருங்கால நோக்கமுள்ள சூழலில் நிகழ்கால கிரேக்க வினையின் உறுதியான கருத்தை இயல்பான தமிழில் வருங்காலமாகத் தருகிறது. ‘பறித்துக்கொள்ள’ என்பது ஒருவரிடமிருந்து மகிழ்ச்சியை அகற்றுவதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: எதிர்காலச் சந்திப்பில் காண்பவர் யார்?
  choice: நான் உங்களை மீண்டும் காண்பேன்
  alternative: நீங்கள் என்னை மீண்டும் காண்பீர்கள்
  rationale: கிரேக்க மூலத்தில் முதல் நபர் எழுவாயும் இரண்டாம் நபர் செயப்படுபொருளும் தெளிவாக உள்ளன. ஆகவே அருகிலுள்ள வசனங்களோடு ஒத்திசைப்பதற்காக எழுவாய்–செயப்படுபொருள் உறவை மாற்றாமல், இயேசுவின் முன்முயற்சியை உள்ளபடியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இதயம்’ என்பதற்குப் பதிலாக உணர்வின் மையத்தைக் குறிக்கும் இயல்பான ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. மூலத்தில் தெளிவாக உள்ள ‘நான் உங்களை காண்பேன்’ என்ற அமைப்பு மாற்றப்படவில்லை.
