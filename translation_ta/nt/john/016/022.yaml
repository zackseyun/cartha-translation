  terminology: “துயரம்,” “உள்ளம்,” and “மகிழ்ச்சி” are suitable, accessible choices. “பறித்துக்கொள்ள மாட்டார்கள்” naturally expresses taking joy away from someone and fits the emphatic assurance. No doctrinally loaded or nonstandard terminology is introduced.
