  source_fidelity: 'The Tamil accurately preserves the discourse connection (οὖν), the disciples'' present sorrow, the contrastive future reunion, and—especially—the Greek subject-object relation in πάλιν δὲ ὄψομαι ὑμᾶς: “நான் உங்களை மீண்டும் காண்பேன்.” It also appropriately renders the future-oriented assurance of the final clause without changing its sense.'
