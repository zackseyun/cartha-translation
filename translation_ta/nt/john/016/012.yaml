  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: ta
  text: நான் உங்களிடம் சொல்ல வேண்டியவை இன்னும் பல உள்ளன. ஆனால் இப்போது உங்களால் அவற்றைத் தாங்க முடியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை இப்போது சுமந்து செல்ல முடியாது” அல்லது “அவற்றை இப்போது சகித்துக்கொள்ள முடியாது.” கிரேக்க வினைச்சொல் சுமந்து செல்லுதல், தாங்குதல், அல்லது சகித்தல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: இன்னும்
  rationale: தொடர்ந்து சொல்லப்பட வேண்டியவை மீதமுள்ளன என்ற காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: πολλὰ
  choice: பல
  rationale: பன்மை நடுநிலைப் பெயரடை இங்கு பெயர்ச்சொல் போல் செயல்படுகிறது; ‘சொல்ல வேண்டியவை’ என்பதுடன் இணைந்து ‘பல காரியங்கள்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔχω ὑμῖν λέγειν
  choice: நான் உங்களிடம் சொல்ல வேண்டியவை ... உள்ளன
  rationale: கிரேக்கத்தின் ‘சொல்வதற்கு வைத்திருக்கிறேன்’ என்ற அமைப்பைச் சொற்சொல்லாக அல்லாமல், இன்னும் சொல்ல வேண்டியவை உள்ளன என்ற இயல்பான தமிழில் தருகிறது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: எதிர்மறைத் திருப்பத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: οὐ δύνασθε
  choice: உங்களால் ... முடியாது
  rationale: தற்போதைய இயலாமையைத் தமிழின் வழக்கமான திறன் அமைப்பில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: βαστάζειν
  choice: தாங்கிக்கொள்ள
  rationale: சுமத்தல், தாங்குதல், சகித்தல் ஆகிய பொருள் நிழல்களை உள்ளடக்கி, வெறும் ‘புரிந்துகொள்ளுதல்’ என்று பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: ἄρτι
  choice: இப்போது
  rationale: பின்வரும் வசனங்களில் வரவிருப்பதுடன் வேறுபடும் தற்போதைய நேரத்தைக் குறிக்கிறது.
theological_decisions:
- issue: சீடர்களின் தற்போதைய இயலாமையை βαστάζειν எவ்வாறு விவரிக்கிறது
  choice: மேலும் சொல்லப்படவிருப்பவற்றை அவர்கள் இப்போது ‘தாங்கிக்கொள்ள’ முடியாது
  alternative: அவற்றை இப்போது முழுமையாகப் புரிந்துகொள்ள முடியாது; அல்லது அவற்றைக் கேட்டு சகித்துக்கொள்ள முடியாது
  rationale: βαστάζω அறிவுசார் புரிதலை மட்டுமோ உணர்ச்சிசார் சகிப்பை மட்டுமோ குறிப்பதாகத் தீர்மானிக்கவில்லை. ‘தாங்கிக்கொள்ள’ என்பது போதனையின் பாரத்தை ஏற்கும் திறன் என்ற உருவகத்தையும் அதன் அறிவுசார் மற்றும் ஆன்மிகப் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாங்கிக்கொள்ள’ என்ற சொல் கிரேக்க உருவகத்தையும் அதன் நோக்கமுள்ள தெளிவின்மையையும் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
