  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: ta
  text: அவர் என்னை மகிமைப்படுத்துவார்; ஏனெனில், எனக்குரியவற்றிலிருந்து எடுத்துக்கொண்டு[a] உங்களுக்கு அறிவிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்குரியவற்றிலிருந்து பெற்றுக்கொண்டு.’
    reason: λήμψεται என்பது சூழலுக்கேற்ப ‘எடுத்துக்கொள்வார்’ அல்லது ‘பெற்றுக்கொள்வார்’ என்று பொருள்படலாம்.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: உடனடி சூழலில் பரிசுத்த ஆவியானவரைக் குறிக்கிறது. தமிழில் மரியாதையுடனும் இயல்பாகவும் தனிநபரைக் குறிக்க ‘அவர்’ பொருத்தமானது; ‘அந்த ஒருவர்’ என்ற வலியுறுத்தல் இங்கு தேவையில்லை.
- source_word: ἐμὲ
  choice: என்னை
  rationale: ‘மகிமைப்படுத்துவார்’ என்பதன் நேரடியான செயப்படுபொருளாக உள்ள முதல் நபர் ஒருமைச் சுட்டுப்பெயர்.
- source_word: δοξάσει
  choice: மகிமைப்படுத்துவார்
  rationale: யோவான் நூலில் δοξάζω கொண்டுள்ள இறையியல் செறிவைப் பாதுகாக்கிறது; வெறும் மனித மரியாதையைக் காட்டிலும் இயேசுவின் மகத்துவத்தை வெளிப்படுத்தும் கருத்தைத் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: ஆவியானவர் இயேசுவை மகிமைப்படுத்துவதற்கான காரணத்தை இங்கு அறிமுகப்படுத்துகிறது.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: எனக்குரியவற்றிலிருந்து
  rationale: ‘என்னுடையதிலிருந்து’ என்ற கிரேக்கச் சொல்லமைப்பின் பரந்த பொருளைப் பாதுகாக்கிறது; அது போதனையா, அதிகாரமா, வெளிப்பாடா என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: λήμψεται
  choice: எடுத்துக்கொண்டு
  rationale: λαμβάνω என்பதன் ‘எடு’ என்ற செயற்பாட்டுப் பொருளையும் அதைத் தொடர்ந்து வரும் அறிவித்தலுடனான தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘பெற்றுக்கொண்டு’ என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀναγγελεῖ
  choice: அறிவிப்பார்
  rationale: அறிவித்தல், தெரிவிக்கல், வெளிப்படுத்தல் ஆகிய பொருள் வரம்பை இயல்பான நவீன தமிழில் தருகிறது. முந்தைய சொற்றொடரே அறிவிக்கப்படும் பொருளை உணர்த்துவதால் தனியாக ‘அதை’ சேர்க்கப்படவில்லை.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: சீடர்களை நோக்கிய இரண்டாம் நபர் பன்மை வேற்றுமையைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐκ τοῦ ἐμοῦ λήμψεται என்பதில் ஆவியானவருக்கும் இயேசுவுக்கும் உள்ள உறவை மொழிபெயர்த்தல்
  choice: எனக்குரியவற்றிலிருந்து எடுத்துக்கொண்டு
  alternative: எனக்குரியவற்றிலிருந்து பெற்றுக்கொண்டு
  rationale: ஆவியானவர் குமாரனுக்குரியவற்றைத் தெரிவிக்கிறார் என்ற பரந்த யோவானிய கருத்தைப் பாதுகாக்கிறது; இதைப் பிற்காலக் கோட்பாட்டுச் சூத்திரமாகக் குறுக்கவோ விரிவாக்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மகிமைப்படுத்துவார்’ என்ற வேதாகமச் செறிவுள்ள சொல் பாதுகாக்கப்பட்டு, மற்ற சொற்றொடர்கள் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளன.
