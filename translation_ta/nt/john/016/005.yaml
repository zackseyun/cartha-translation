  terminology: ‘என்னை அனுப்பியவரிடம்’ என்பது τὸν πέμψαντά με-க்கு நேர்மையானதும் இயல்பானதும் ஆகும்; மூலத்தில் இல்லாத ‘தந்தை’ என்ற அடையாளம் சேர்க்கப்படவில்லை. ‘கேட்பதில்லை’ ἐρωτᾷ με-க்கு சூழலுக்கு ஏற்ற சொல்.
