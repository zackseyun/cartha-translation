id: JHN.16.5
reference: John 16:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: ta
  text: ஆனால் இப்போது நான் என்னை அனுப்பியவரிடம் போகிறேன். உங்களில் ஒருவரும், ‘நீர் எங்கே போகிறீர்?’ என்று என்னிடம் கேட்பதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: ஆனால் இப்போது
  rationale: δέ குறிக்கும் முந்தைய உரையுடனான வேறுபாட்டை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ὑπάγω
  choice: நான் ... போகிறேன்
  rationale: யோவான் நற்செய்தியின் இச்சூழலில் உள்ள நகர்வு மற்றும் உடனடி எதிர்கால நிழலை இயல்பாக வெளிப்படுத்துகிறது; வெறுமனே ‘புறப்படுகிறேன்’ என்று சுருக்கவில்லை.
- source_word: πρὸς τὸν πέμψαντά με
  choice: என்னை அனுப்பியவரிடம்
  rationale: கிரேக்கச் சொல்லமைப்பிலுள்ள பெயராக்கப்பட்ட பங்கேற்புச் சொல்லை இயல்பாகத் தருகிறது; மூலத்தில் இங்கு வெளிப்படையாக இல்லாத ‘தந்தை’ என்பதைச் சேர்க்கவில்லை.
- source_word: πέμψαντά
  choice: அனுப்பிய
  rationale: யோவானில் காணப்படும் அனுப்புதல் சார்ந்த பணி மொழியை நேரடியாகவும் பொதுவாகவும் வெளிப்படுத்துகிறது.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: உங்களில் ஒருவரும் ... இல்லை
  rationale: பகுதிப்பொருள் கொண்ட கிரேக்கத் தொடரையும் முழுமையான மறுப்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐρωτᾷ με
  choice: என்னிடம் கேட்பதில்லை
  rationale: இங்கு வேண்டுதல் அல்ல, கேள்வி கேட்பதையே குறிக்கிறது.
- source_word: Ποῦ ὑπάγεις;
  choice: நீர் எங்கே போகிறீர்?
  rationale: நேரடிக் கேள்வியின் நகர்வுப் பொருளை கண்ணியமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘என்னை அனுப்பியவர்’ என்பவரின் அடையாளம்
  choice: ‘என்னை அனுப்பியவரிடம்’ என்று பொதுவாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என்னை அனுப்பிய தந்தையிடம்’
  rationale: யோவானின் பரந்த சூழலில் குறிக்கப்படுபவர் தந்தை என்பது தெளிவாயினும், இந்தக் கிரேக்க வாக்கியத்தில் ‘தந்தை’ என்று வெளிப்படையாக இல்லை. ஆகவே அந்த அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்காமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. இயேசுவை நோக்கிய நேரடிப் பேச்சில் ‘நீர்/போகிறீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
