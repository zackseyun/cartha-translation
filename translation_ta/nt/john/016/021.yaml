source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: ta
  text: ஒரு பெண் குழந்தை பெற்றெடுக்கும்போது, அவளுடைய நேரம் வந்துவிட்டதால் அவளுக்குத் துயரம் உண்டாகிறது. ஆனால் குழந்தையைப் பெற்றெடுத்த பிறகு, ஓர் மனித உயிர்[a] உலகில் பிறந்துவிட்டது என்ற மகிழ்ச்சியால் அவள் அந்த வேதனையை இனி நினைப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு மனிதன் உலகில் பிறந்துவிட்டான்.’ கிரேக்க ἄνθρωπος ‘மனிதன்’ என்றும், பொதுவாக ‘மனித உயிர்’ என்றும் பொருள்படும்; இங்கு அது குறிப்பாக ஆண் குழந்தையைக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ஒரு பெண்
  rationale: இது பிரசவத்தைப் பற்றிய பொதுவான உவமை; எனவே ‘மனைவி’ என்பதைவிட ‘பெண்’ என்பதே பொருத்தமானது.
- source_word: ὅταν τίκτῃ
  choice: குழந்தை பெற்றெடுக்கும்போது
  rationale: நிகழ்ந்துகொண்டிருக்கும் பிரசவச் சூழலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λύπην ἔχει
  choice: அவளுக்குத் துயரம் உண்டாகிறது
  rationale: λύπη உடல் வலியை மட்டும் அல்லாமல் துயரத்தையும் மனவருத்தத்தையும் குறிக்கக்கூடும்; சுற்றியுள்ள துயரம்–மகிழ்ச்சி எதிர்மறையையும் இது காக்கிறது.
- source_word: ἡ ὥρα αὐτῆς
  choice: அவளுடைய நேரம்
  rationale: பிரசவத்திற்குரிய நேரத்தையும் யோவான் நூலில் ὥρα பெறும் கருத்துச் செறிவையும் அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: γεννήσῃ τὸ παιδίον
  choice: குழந்தையைப் பெற்றெடுத்த பிறகு
  rationale: பிரசவம் நிறைவடைந்த நிகழ்வாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐκέτι μνημονεύει τῆς θλίψεως
  choice: அவள் அந்த வேதனையை இனி நினைப்பதில்லை
  rationale: μνημονεύει என்பதன் ‘நினைத்தல்’ பொருளையும், பிரசவச் சூழலில் θλῖψις குறிக்கும் கடும் இடுக்கண் அல்லது வேதனையையும் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τὴν χαράν
  choice: மகிழ்ச்சியால்
  rationale: διά + accusative குறிப்பிடும் காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ὅτι ἐγεννήθη
  choice: பிறந்துவிட்டது என்ற
  rationale: மகிழ்ச்சியின் காரணம் அல்லது உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι என்பதன் திறந்த நுணுக்கத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἄνθρωπος
  choice: ஓர் உயிர்
  rationale: இங்கு ஆண் குழந்தையைத் தனிப்படக் குறிக்காமல் புதிதாகப் பிறந்த மனித உயிரைக் குறிக்கிறது; ‘மனிதன்’ தரக்கூடிய ஆண்பால் தவறுணர்வையும் ‘மனித உயிர்’ என்பதன் சற்றுக் கடினமான நடையையும் தவிர்க்கிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகில்
  rationale: தமிழில் பிறப்பைக் குறிக்க ‘உலகில் பிறத்தல்’ இயல்பானது; கிரேக்கத்தின் ‘உலகிற்குள்’ என்ற இயக்கக் கருத்து பொருளில் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பொதுப்பால் பொருள்
  choice: ஓர் உயிர்
  alternative: ஒரு மனிதர் / ஒரு மனிதன் / ஒரு குழந்தை
  rationale: இச்சூழலில் ἄνθρωπος ஒரு குறிப்பிட்ட ஆணை அல்ல, பிறந்த மனித உயிரைப் பொதுவாகக் குறிக்கிறது. ‘ஓர் உயிர்’ பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் சூழலுக்கேற்ற மனிதப் பிறப்பை வெளிப்படுத்துகிறது; ‘குழந்தை’ என்பது உடனடி சூழலால் சரியானதாக இருந்தாலும், மூலத்தில் παιδίον என்பதிலிருந்து ἄνθρωπος என மாறுவதை முற்றிலும் அழித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் துயரம்–மகிழ்ச்சி எதிர்மறையும் ‘நேரம்’ என்ற யோவானிய ஒலிப்பும் பாதுகாக்கப்பட்டுள்ளன.
