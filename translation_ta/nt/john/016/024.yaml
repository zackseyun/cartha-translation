source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: ta
  text: இதுவரை நீங்கள் என் பெயரில்[b] எதையும் கேட்டதில்லை. கேளுங்கள்[a]; பெற்றுக்கொள்வீர்கள்; உங்கள் மகிழ்ச்சி நிறைவுபெறும்படி[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ந்து கேளுங்கள்.” இங்குள்ள நிகழ்காலக் கட்டளை, சூழலில் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்படும் செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் பெயரில்” என்பது இயேசுவின் நபர், அதிகாரம், பணி ஆகியவற்றுடன் தொடர்புடைய வேண்டுதலைக் குறிக்கலாம். ஒரே விளக்கத்திற்குள் அதன் பொருளைக் குறுக்காமல் மூலத்தின் சொற்றொடர் அப்படியே வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உங்கள் மகிழ்ச்சி முழுமையடையும்படி.” மூலச்சொல் நிறைவு பெற்ற நிலையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: இதுவரை
  rationale: இச்சொற்றொடர் பேசப்படும் தற்போதைய நேரம் வரையிலான காலத்தைக் குறிக்கிறது; ‘இதுவரை’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: எதையும் கேட்டதில்லை
  rationale: இரட்டை எதிர்மறைக் கட்டமைப்பின் பொருளை இயல்பான தமிழில் ‘எதையும் ... இல்லை’ என்று வழங்குகிறது; αἰτέω இங்கு ஒன்றை வேண்டிக் கேட்பதைக் குறிக்கிறது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் நபர், அதிகாரம், பணி ஆகியவற்றுடனான தொடர்பைக் கொண்ட செறிவான யோவானிய சொற்றொடரை விளக்கிக் குறுக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: αἰτεῖτε
  choice: கேளுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்படும் செயலைக் குறிக்கக்கூடும்; பொதுவான கட்டளையாக உள்ள தெளிவை ‘கேளுங்கள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: λήμψεσθε
  choice: பெற்றுக்கொள்வீர்கள்
  rationale: வருங்கால வினையின் பொருளையும், கேட்டதற்குக் கிடைக்கும் பதிலையும் மரியாதையான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: அப்போது ... நிறைவடையும்
  rationale: மூலத்தில் நோக்கம் அல்லது விளைவு ஆகிய இரண்டிற்கும் இடமளிக்கும் ἵνα அமைப்பைத் தமிழில் இயல்பான விளைவு சார்ந்த தொடராக வழங்குகிறது.
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: உங்கள் மகிழ்ச்சி நிறைவடையும்
  rationale: πεπληρωμένη குறிக்கும் நிறைவு பெற்ற நிலையைப் பாதுகாத்து, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: ‘என் பெயரில்’ வேண்டுதல் என்பதன் பொருள்
  choice: ‘என் பெயரில்’ என்ற நேரடிச் சொற்றொடரைப் பாதுகாத்தல்
  alternative: ‘என் சார்பாக’, ‘என் அதிகாரத்தின்கீழ்’ அல்லது ‘என்னோடு ஒன்றிப்பட்டு’ என்று விளக்குதல்
  rationale: இந்தச் சொற்றொடர் இயேசுவின் நபர், அதிகாரம், பணி ஆகியவற்றுடன் தொடர்புடைய பல அடுக்குப் பொருளைக் கொண்டது. ஒரே விளக்கத்திற்குள் அதைக் குறுக்காமல் மூலத்தின் இறையியல் செறிவையும் திறந்த தன்மையையும் பாதுகாக்கிறது.
- issue: ἵνα தொடரின் நோக்கம் அல்லது விளைவு
  choice: ‘அப்போது ... நிறைவடையும்’ என்று விளைவை முன்னிறுத்தியும் தொடர்பைத் திறந்தவாறும் வழங்குதல்
  alternative: ‘நிறைவடையும்படி’ என்று நோக்கத்தை மட்டும் முன்னிறுத்துதல்
  rationale: ἵνα நோக்கத்தையும் விளைவையும் குறிக்கக்கூடும். இச்சூழலில் கேட்டுப் பெறுவதற்கும் மகிழ்ச்சியின் நிறைவுக்கும் உள்ள தொடர்பை இயல்பான தமிழில் காட்டுகிறது; காரணவியல் அல்லது இறையியல் தொடர்பை மிகுதியாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பன்மை இரண்டாம் நபருக்கான மரியாதையான ‘நீங்கள்’ வடிவமும், ஜெபச் சூழலுக்கேற்ற ‘கேளுங்கள்/பெற்றுக்கொள்வீர்கள்’ சொற்களும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்புக் குறியீடுகள் அவை விளக்கும் சொற்றொடர்களின் உடனருகே வைக்கப்பட்டுள்ளன.
