  text: I have spoken these things to you so that you may not fall away.
translation:
  language: ta
  text: நீங்கள் இடறி விழாதபடி[a] இவற்றை உங்களிடம் பேசியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தை விட்டு விலகாதபடி,” “இடறச் செய்யப்படாதபடி,” அல்லது “மனத்தாங்கல் அடையாதபடி.” கிரேக்க வினைச்சொல், ஒருவர் இடறச் செய்யப்பட்டு அவிசுவாசத்திற்கோ விசுவாசத்திலிருந்து விலகுவதற்கோ செல்லுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: முன்பு இயேசு கூறிய பல செய்திகளைச் சுட்டும் நடுநிலைப் பன்மையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: λελάληκα
  choice: பேசியிருக்கிறேன்
  rationale: λαλέω என்பதன் இறந்தகால நிறைவுற்ற செயற்பாட்டு வடிவத்தின் தற்போதைய தொடர்பைத் தமிழின் நிறைவுநிலை வினைவடிவம் வெளிப்படுத்துகிறது.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: இரண்டாம் நபர் பன்மை வேற்றுமைப் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα μὴ
  choice: விழாதபடி
  rationale: எதிர்மறையான நோக்கத்தைத் தெரிவிக்கும் கிரேக்கத் தொடரை இயல்பான தமிழ் நோக்கத் தொடராக வழங்குகிறது.
- source_word: σκανδαλισθῆτε
  choice: இடறி விழாதபடி
  rationale: இடறுதல் என்ற கிரேக்கச் சொல்லுருவைத் தக்கவைத்தபடியே, வரவிருக்கும் துன்புறுத்தலால் சீடத்துவத்தில் கடுமையாகத் தடுமாறுதல் அல்லது விசுவாசத்தை விட்டு விலகுதல் வரை செல்லக்கூடிய பொருள் வலிமையையும் உணர்த்துகிறது.
theological_decisions:
- issue: துன்புறுத்தல் சூழலில் σκανδαλισθῆτε என்பதன் பொருள்
  choice: இடறி விழாதபடி
  alternative: விசுவாசத்தை விட்டு விலகாதபடி
  rationale: “விசுவாசத்தை விட்டு விலகுதல்” என்பது உடனடிச் சூழலில் சாத்தியமான விளக்கமாக இருந்தாலும், அதை மட்டும் முதன்மை உரையில் வைப்பது கிரேக்கச் சொல்லின் உருவகத்தையும் பொருள் அகலத்தையும் சுருக்கிவிடும். “இடறி விழுதல்” உருவகத்தையும் ஆன்மீகச் சரிவின் தீவிரத்தையும் ஒருங்கே தக்கவைக்கிறது; விளக்க மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “பேசியிருக்கிறேன்” நிறைவுநிலையைப் பாதுகாக்கிறது; “இடறி விழுதல்” பொதுவாகப் புரியக்கூடிய உருவகமாக இருந்து, மூலத்தின் உண்மையான பொருள் அகலத்தைத் திறந்தே வைக்கிறது.
