  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “இப்போது நம்புகிறீர்களா?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போது நம்புகிறீர்கள்.” கிரேக்க வாக்கியத்தை ஒரு கூற்றாகவும் வாசிக்கலாம்; ஆனால் சூழல் இதை வினாவுரையாக வாசிப்பதை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: ἀποκρίνομαι என்பதன் இறந்தகால நிகழ்வுரு; உரையாடலில் இயல்பாகவும் மரியாதையான நடையிலும் ‘பதிலளித்தார்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: இது பன்மை மறைமுகச் செயப்படுபொருளைக் குறிக்கும் வேற்றுமை வடிவம்; தமிழில் ‘அவர்களுக்குப் பதிலளித்தார்’ என்பது இயல்பான அமைப்பு.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: Ἄρτι
  choice: இப்போது
  rationale: தற்போதைய உடனடித் தருணத்தைச் சுட்டுகிறது; ‘இப்போது’ என்பது அதன் காலச்சுட்டை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: πιστεύετε
  choice: நம்புகிறீர்கள்
  rationale: πιστεύω என்பதன் நிகழ்காலச் செயப்பாட்டு, இரண்டாம் நபர் பன்மை வடிவம். யோவான் நற்செய்தியின் பயன்பாட்டுக்கு ‘நம்பு’ நேரடியான, தெளிவான இணைச்சொல்; கேள்வி வடிவில் ‘நம்புகிறீர்களா?’ என வருகிறது.
theological_decisions:
- issue: Ἄρτι πιστεύετε; என்பதன் வாக்கிய வலிமை
  choice: “இப்போது நம்புகிறீர்களா?” என்ற சொல்லாட்சிக் கேள்வியாக மொழிபெயர்த்தல்
  alternative: “இப்போது நம்புகிறீர்கள்.”
  rationale: கிரேக்கச் சொற்களே கேள்வியையோ கூற்றையையோ இலக்கண ரீதியாகத் தீர்மானிப்பதில்லை; நிறுத்தற்குறி ஆசிரியர் முடிவு. அடுத்த வசனத்தில் சீடர்கள் சிதறிப்போவார்கள் என்று இயேசு கூறும் சூழல், கேள்வி வாசிப்பை வலுப்படுத்துகிறது. எனினும் கூற்று வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதே நேரத்தில் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும், கேள்விக்கும் கூற்றுக்கும் இடையிலான உண்மையான ambiguity-யும் அடிக்குறிப்பின் மூலம் காக்கப்பட்டுள்ளன.
