id: JHN.16.19
reference: John 16:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: ta
  text: அவர்கள் தன்னிடம் கேட்க விரும்பியதை இயேசு அறிந்து, அவர்களிடம், “நான், ‘இன்னும் சிறிது காலம்; நீங்கள் இனி என்னைக் காணமாட்டீர்கள். மறுபடியும் சிறிது காலம்; நீங்கள் என்னைக் காண்பீர்கள்[b]’ என்று சொன்னதைப் பற்றித்தானா[a] நீங்கள் ஒருவரோடு ஒருவர் பேசிக்கொண்டிருக்கிறீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் … என்று சொன்னதாலா.” கிரேக்கச் சொல் அவர்கள் விவாதித்த கூற்றின் உள்ளடக்கத்தையோ, அதை விவாதித்ததற்கான காரணத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: 'இங்கு ‘காணுதல்’ என்பதற்கு கிரேக்கத்தில் இரண்டு வெவ்வேறு வினைகள் பயன்படுத்தப்பட்டுள்ளன: முதலாவது உற்றுநோக்குதல் அல்லது கண்ணால் பார்த்திருத்தல் என்ற நிழற்பொருளையும், இரண்டாவது பொதுவாகக் காணுதல் என்ற பொருளையும் கொண்டிருக்கலாம். இணையான வாக்கிய அமைப்பைக் காக்க தமிழில் இரண்டும் ‘காண்’ என மொழிபெயர்க்கப்பட்டுள்ளன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: அறிந்து
  rationale: இயேசு சீடர்களின் நோக்கத்தை உணர்ந்ததை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: அவர்கள் தன்னிடம் கேள்வி கேட்க விரும்பியதை
  rationale: ἐρωτάω இங்கு எதிர்மறையான விசாரணையைக் குறிக்காமல் ஒருவரிடம் கேள்வி கேட்பதைக் குறிக்கிறது; αὐτόν என்பதன் இலக்கு இயேசு என்பதும் தெளிவாக வைக்கப்பட்டுள்ளது.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: இதைக் குறித்து நீங்கள் ஒருவரோடு ஒருவர் விசாரித்துக்கொண்டிருக்கிறீர்கள்
  rationale: ζητέω என்பதன் அடிப்படைப் பொருள் ‘தேடுதல்’ என்றாலும், இச்சூழலில் சீடர்கள் ஒருவரோடு ஒருவர் அந்தக் கூற்றின் பொருளை ஆராய்வதைக் குறிக்கிறது. ‘விசாரித்துக்கொண்டிருக்கிறீர்கள்’ என்பது அந்த முயற்சியையும் தொடர்நிலையையும் தருகிறது.
- source_word: ὅτι εἶπον
  choice: நான் … என்று சொன்னதைக் குறித்து
  rationale: ὅτι என்பதை முதன்மையாக உரையாடலின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக எடுத்துக்கொண்டு, இயல்பான தமிழ் வாக்கிய அமைப்பில் இணைக்கிறது; காரணப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Μικρὸν
  choice: இன்னும் சிறிது காலத்தில்
  rationale: கால இடைவெளியைக் குறிக்கும் மொழிவழக்கைத் தெளிவாகத் தருகிறது. முதல் இடத்தில் ‘இன்னும்’ என்பது நெருங்கிய வருங்காலத்தை இயல்பாக உணர்த்துகிறது.
- source_word: οὐ θεωρεῖτέ με
  choice: நீங்கள் என்னைக் காணமாட்டீர்கள்
  rationale: சிறிது காலத்திற்குப் பின் ஏற்படும் காணாமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்க நிகழ்கால வடிவத்தை இயந்திரமாகப் பின்பற்றாமல் சூழலின் வருங்காலத் தொடர்பைத் தருகிறது.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: மறுபடியும் சிறிது காலத்தில் என்னைக் காண்பீர்கள்
  rationale: இரண்டாவது குறுகிய கால இடைவெளியையும் அதன் பின் நிகழும் காணுதலையும் தெளிவாகவும் இணையான அமைப்பிலும் தருகிறது.
theological_decisions:
- issue: θεωρέω மற்றும் ὁράω ஆகிய இரு காணுதல் வினைகளின் நுண்ணிய வேறுபாடு
  choice: இரண்டையும் முதன்மை உரையில் ‘காண்’ என்ற ஒரே தமிழ் வேரால் மொழிபெயர்த்தல்
  alternative: முதலாவதை ‘உற்றுப்பார்த்தல்’ என்றும் இரண்டாவதை ‘காணுதல்’ என்றும் வேறுபடுத்துதல்
  rationale: இவ்விடத்தின் முதன்மை எதிர்நிலை தற்காலிகப் பிரிவும் மீண்டும் காணுதலும் ஆகும். தமிழில் இரு வேறு வினைகளைப் பயன்படுத்துவது மூலத்தில் உறுதியாகக் கோரப்படாத ஒரு தீவிர பொருள் வேறுபாட்டை உண்டாக்கலாம்; சொல் வேறுபாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ὅτι என்பதன் உள்ளடக்க அல்லது காரணப் பொருள்
  choice: ‘என்று சொன்னதைக் குறித்து’ என உள்ளடக்கத்தை முன்னிறுத்துதல்
  alternative: ‘நான் … என்று சொன்னதாலா’ என காரணத்தை முன்னிறுத்துதல்
  rationale: நேரடி மேற்கோளைத் தொடர்ந்து வரும் ὅτι, அவர்கள் ஆராய்ந்த கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக இயல்பாகப் புரிகிறது. இருப்பினும் காரணப் பொருளும் இலக்கண ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: இயேசுவின் இறுதி சொற்றொடரின் வினா வலிமை
  choice: நேரடி கேள்வியாக மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் இதைக் குறித்து ஒருவரோடு ஒருவர் விசாரித்துக்கொண்டிருந்தீர்கள்’ என்ற உறுதிக் கூற்று
  rationale: ζητεῖτε இங்கு சீடர்களின் தனிப்பட்ட உரையாடலை வெளிக்கொணரும் வினாவாகச் செயல்படுகிறது; கேள்விக்குறியுடன் அதைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஒருவரோடு ஒருவர்’ என்பது பரஸ்பரச் செயலைத் தெளிவாகக் காட்டுகிறது; ‘விசாரித்துக்கொண்டிருக்கிறீர்கள்’ என்பது மிகப் பேச்சுவழக்காகவோ மிகப் பண்டிதநடையாகவோ இல்லாமல் சீடர்கள் பொருளை ஆராய்ந்ததைக் காட்டுகிறது.
