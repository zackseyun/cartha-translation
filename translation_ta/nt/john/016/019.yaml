  terminology: ‘இயேசு,’ ‘காணுதல்,’ மற்றும் ‘ஒருவரோடு ஒருவர்’ பொருத்தமாக உள்ளன. θεωρέω/ὁράω வேறுபாட்டை முதன்மை உரையில் செயற்கையாக வற்புறுத்தாமல், அடிக்குறிப்பில் பாதுகாப்பது சரியானது.
