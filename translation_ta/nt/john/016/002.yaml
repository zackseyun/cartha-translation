  to: அவர்கள் உங்களை யூத வழிபாட்டுக்கூடங்களிலிருந்து விலக்கிவிடுவார்கள்[a]. ஆனால், அதுமட்டுமல்ல, உங்களைக் கொல்லும் ஒவ்வொருவனும் தான் கடவுளுக்கு வழிபாட்டுச் சேவை ஆற்றுவதாக எண்ணும் காலம் வருகிறது[b].
