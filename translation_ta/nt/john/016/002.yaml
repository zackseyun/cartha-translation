base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: ta
  text: அவர்கள் உங்களை யூத வழிபாட்டுக்கூடங்களிலிருந்து விலக்கிவிடுவார்கள்[a]. ஆனால், அதுமட்டுமல்ல, உங்களைக் கொல்லும் ஒவ்வொருவனும் தான் கடவுளுக்கு வழிபாட்டுச் சேவை ஆற்றுவதாக எண்ணும் காலம் வருகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உங்களை வழிபாட்டுக்கூடங்களைவிட்டு வெளியேற்றுவார்கள்” அல்லது “வழிபாட்டுக்கூடங்களின் சமூகத்திலிருந்து ஒதுக்கிவைப்பார்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “கடவுளுக்கு வழிபாடு செலுத்துவதாக” அல்லது “கடவுளுக்குச் சமயச் சேவை செய்வதாக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: உங்களை யூத வழிபாட்டுக்கூடங்களிலிருந்து விலக்கிவைப்பார்கள்
  rationale: இந்தக் கூறு வழிபாட்டுக்கூடத்திலிருந்தும் அதனுடன் இணைந்த சமூகத்திலிருந்தும் வெளியேற்றப்படுவதைக் குறிக்கிறது. ‘விலக்கிவைப்பார்கள்’ என்பது நிறுவன மற்றும் சமூக ஒதுக்குதலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தின் பன்மையும் காக்கப்படுகிறது.
- source_word: ἀλλ’
  choice: அதுமட்டுமல்ல
  rationale: இங்கு இது வெறும் எதிர்மறை இணைப்பாக இல்லாமல், விலக்கிவைப்பதிலிருந்து கொலைசெய்வதுவரை துன்புறுத்தல் தீவிரமாவதைக் காட்டுகிறது.
- source_word: ἔρχεται ὥρα
  choice: காலம் வருகிறது
  rationale: யோவான் நூலுக்குரிய வரவிருக்கும் ‘வேளை’ என்ற கருத்தை, தமிழில் இயல்பாகவும் தெளிவாகவும் ‘காலம் வருகிறது’ தெரிவிக்கிறது.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: உங்களைக் கொல்லுகிற ஒவ்வொருவனும்
  rationale: பெயர்ச்சொல் தன்மையுள்ள கிரேக்கப் பங்கேற்புவினையின் பொதுப்படையான தனிநபர் குறிப்பையும் πᾶς என்பதன் முழுமையான வீச்சையும் இது காக்கிறது.
- source_word: δόξῃ
  choice: எண்ணும்
  rationale: செய்கிறவன் தன் செயலைப் பற்றி கொண்டிருக்கும் தவறான நம்பிக்கை அல்லது மதிப்பீட்டை இயல்பான தமிழில் இது குறிக்கிறது.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: தான் கடவுளுக்குத் திருப்பணி ஆற்றுவதாக
  rationale: λατρεία என்பதிலுள்ள சமய வழிபாடு அல்லது புனித சேவை என்ற நுணுக்கத்தையும் προσφέρειν என்பதிலுள்ள அர்ப்பணித்து அளிக்கும் கருத்தையும் ‘திருப்பணி ஆற்றுதல்’ சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: கொலைசெய்பவர்களின் சமயத் தன்னுணர்வை எவ்வாறு மொழிபெயர்ப்பது
  choice: தான் கடவுளுக்குத் திருப்பணி ஆற்றுவதாக எண்ணும்
  alternative: தான் கடவுளுக்கு வழிபாடு செலுத்துவதாக எண்ணும்
  rationale: கொலையையே கடவுளுக்குச் செய்யும் முறையான சமயச் சேவையாக அவர்கள் தவறாகக் கருதுவார்கள் என்ற அதிர்ச்சியூட்டும் முரண்பாட்டை மொழிபெயர்ப்பு காக்கிறது; அவர்களுடைய எண்ணத்துக்குக் கடவுளின் ஒப்புதல் இருப்பதாகக் கூறவில்லை.
- issue: πᾶς ὁ ἀποκτείνας என்பதிலுள்ள இலக்கண ஒருமை மற்றும் ஆண்பால்
  choice: கொல்லுகிற ஒவ்வொருவனும், தான்... எண்ணும்
  alternative: கொல்கிற எவரும், தாங்கள்... என எண்ணுவார்கள்
  rationale: மூலத்தின் பொதுப்படையான ஆண்பால் ஒருமை வடிவையும் தனிநபர் பொறுப்பையும் தமிழில் இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யூத வழிபாட்டுக்கூடம்’ என்பது ‘synagogue’ என்பதைக் குழப்பமின்றி அடையாளப்படுத்துகிறது; ‘திருப்பணி’ சமயச் சேவையின் நுணுக்கத்தைக் காக்கிறது. மூலத்தில் உள்ள துன்புறுத்தலின் தீவிர உயர்வும் கொலைசெய்பவர்களின் தவறான பக்தி எண்ணமும் மென்மையாக்கப்படவில்லை.
