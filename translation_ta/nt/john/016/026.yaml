base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: ta
  text: அந்நாளில்[a] நீங்கள் என் பெயரில் கேட்பீர்கள்[b]; உங்களைக் குறித்து[c] நான் தந்தையிடம் வேண்டிக்கொள்வேன் என்று உங்களுக்குச் சொல்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அந்த நாளில்.”'
    reason: lexical_alternative
  - marker: b
    text: 'இவ்வசனத்தில் “கேட்பது” என்பதற்கு கிரேக்கம் இரண்டு வெவ்வேறு வினைச்சொற்களைப் பயன்படுத்துகிறது: சீடர்கள் கேட்பதற்கு αἰτέω; இயேசு தந்தையிடம் வேண்டிக்கொள்வதற்கு ἐρωτάω.'
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: “உங்களுக்காக” / “உங்கள் சார்பாக.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்நாளில்
  rationale: காலத்தைக் குறிக்கும் இத்தொடரின் சுட்டுவலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் ஆளுமையோடும் அதிகாரத்தோடும் உள்ள உறவைச் சுட்டும் யோவானிய சொற்றொடரை விளக்கவுரையாக விரிக்காமல் தக்கவைக்கிறது.
- source_word: αἰτήσεσθε
  choice: கேட்பீர்கள்
  rationale: எதிர்கால, இரண்டாம் நபர் பன்மை வினையை இயல்பான தமிழில் தருகிறது; வேண்டுதல் அல்லது கோருதல் என்ற சூழல்சார் பொருளைத் திறந்தே வைக்கிறது.
- source_word: οὐ λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்வதில்லை
  rationale: நிகழ்கால மறுப்பை இறந்தகாலமாக மாற்றாமல், இயல்பும் கண்ணியமும் உள்ள தமிழில் தருகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இங்கு காரணத்தைக் காட்டாமல், சொல்லப்படாத கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἐρωτήσω
  choice: வேண்டிக்கொள்வேன்
  rationale: தந்தையிடம் இயேசு முன்வைக்கும் வேண்டுகோளை இயல்பாகத் தருவதோடு, இவ்வசனத்தில் முதலில் வரும் αἰτέω என்பதிலிருந்து கிரேக்கத்தில் உள்ள சொல்வேறுபாட்டையும் ஓரளவு வெளிப்படுத்துகிறது.
- source_word: τὸν πατέρα
  choice: தந்தையிடம்
  rationale: கிரேக்கத்தில் தனிப்பட்ட உடைமைச்சொல் இல்லாததால் ‘என் தந்தை’ என்று விரிவாக்காமல் ‘தந்தை’ என்பதைத் தக்கவைக்கிறது; தமிழில் வேண்டுகோளின் இலக்கை ‘-இடம்’ உருபு இயல்பாகக் காட்டுகிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: ‘உங்களுக்காக’ என்ற பரிந்துபேசும் பொருள் சாத்தியமாக இருந்தாலும், கிரேக்கத்தின் விரிந்த ‘குறித்து/சார்பாக’ என்ற பொருள் எல்லையைச் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசு இனி ஒருபோதும் பரிந்துபேச மாட்டார் என்று இவ்வசனம் மறுக்கிறதா, அல்லது இச்சூழலில் சீடர்களின் அணுகலை அவ்வாறு விளக்கவில்லை என்பதையே கூறுகிறதா?
  choice: ‘நான் ... வேண்டிக்கொள்வேன் என்று உங்களுக்குச் சொல்வதில்லை’ என நேரடியாக மொழிபெயர்த்து, இச்சூழலில் அவர் சொல்லாததை மட்டும் வெளிப்படுத்துதல்.
  alternative: இயேசு அவர்களுக்காக இனி பரிந்துபேசவே மாட்டார் என்றோ, எந்த மத்தியஸ்தமும் இன்றி அவர்கள் தந்தையை அணுகுகிறார்கள் என்றோ தெளிவாக்கிப் பொருளுரைத்தல்.
  rationale: உடனடிச் சூழல் சீடர்கள் இயேசுவின் பெயரில் கேட்பதை வலியுறுத்துகிறது; ஆனால் இச்சொற்றொடர் இயேசுவின் எல்லா எதிர்காலப் பரிந்துபேசுதலையும் வெளிப்படையாக மறுப்பதில்லை. ஆகவே வேதாகமத்தில் உள்ள இறையியல் இழுவையை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் பெயரில்’ என்ற யோவானிய சொற்றொடர் விளக்கவுரையின்றித் தக்கவைக்கப்பட்டுள்ளது; இரண்டு கிரேக்க வினைகளின் வேறுபாடு ‘கேட்பீர்கள்’ மற்றும் ‘வேண்டிக்கொள்வேன்’ என இயல்பான தமிழில் பிரதிபலிக்கப்பட்டுள்ளது.
