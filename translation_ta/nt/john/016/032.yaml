source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: ta
  text: இதோ, ஒரு நேரம் வருகிறது; அது வந்துவிட்டது. அப்போது நீங்கள் சிதறிப்போய், ஒவ்வொருவரும் அவரவர் இடங்களுக்குச் சென்று[a], என்னைத் தனியே விட்டுவிடுவீர்கள். ஆனாலும் நான் தனியாக இல்லை; ஏனெனில் தந்தை என்னோடு இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வொருவரும் அவரவருக்குரியவற்றிடத்திற்குச் சென்று.’ கிரேக்கச் சொற்றொடர் ஒரு குறிப்பிட்ட இடத்தை மட்டும் குறிக்காது; வீடு, இடம், உடைமைகள், அல்லது ஒருவருக்குரிய காரியங்கள் எனப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சொல்லாகவும், இயேசுவின் அறிவிப்புக்குரிய கண்ணியமான தீவிரத்தைக் காக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்லாகவும் உள்ளது.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: ஒரு நேரம் வருகிறது; அது வந்துவிட்டது
  rationale: வரவிருக்கும் நேரமும் ஏற்கெனவே வந்துவிட்ட நேரமும் என்ற கிரேக்க நிகழ்கால–நிறைவுக்கால இழுவிசையைத் தீர்த்துவிடாமல் காக்கிறது. ὥρα இங்கு அறுபது நிமிடங்களைக் குறிக்காமல் தீர்மானமான காலத்தைக் குறிக்கிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: ‘ஒரு நேரம் வருகிறது’ என்பதன் உள்ளடக்கத்தையும் கால உறவையும் இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; இதை நோக்கத்தைக் குறிக்கும் ‘அதற்காக’ என்று கடினமாக்கவில்லை.
- source_word: σκορπισθῆτε
  choice: நீங்கள் சிதறிப்போய்
  rationale: சீடர்கள் பிரிந்து பல திசைகளுக்குச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்கத்தின் இறப்புவினை வடிவத்தைத் தமிழில் சொற்சொல்லாகக் கடினப்படுத்தாமல், நிகழ்வின் விளைவைத் தெளிவாகக் காக்கிறது.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: ஒவ்வொருவரும் தமக்குரியவற்றை நோக்கிச் சென்று[a]
  rationale: ἕκαστος என்பதன் பகிர்வுத் தன்மையை ‘ஒவ்வொருவரும்’ காக்கிறது. τὰ ἴδια என்பதை ‘வீடு’ அல்லது ‘இடம்’ என்று மட்டும் வரையறுக்காமல், ஒருவருக்குச் சொந்தமான தளம், இடம், உடைமைகள் அல்லது காரியங்கள் ஆகியவற்றைக் குறிக்கக்கூடிய விரிவைத் தக்கவைக்கிறது.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: என்னைத் தனியே விட்டுவிடுவீர்கள்
  rationale: சீடர்கள் இயேசுவை விட்டுச் செல்லும் எதிர்கால நிகழ்வையும் அதன் உணர்ச்சிசார் வலிமையையும் காக்கிறது; ‘கைவிடுவீர்கள்’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: ஆனாலும் நான் தனியாக இல்லை
  rationale: சீடர்கள் இயேசுவைத் தனியே விட்டுச் செல்வதற்கும் அவர் உண்மையில் தனியாக இல்லாததற்கும் இடையிலான மென்மையான எதிர்மறைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: ஏனெனில் தந்தை என்னோடு இருக்கிறார்
  rationale: ὅτι தரும் காரணத்தையும், யோவான் நற்செய்தியில் முக்கியமான ‘தந்தை’ என்னும் உறவுப் பெயரையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ἕκαστος என்பதன் ஒருமை பகிர்வுப் பொருள்
  choice: ஒவ்வொருவரும் தமக்குரியவற்றை நோக்கிச் சென்று
  alternative: ஒவ்வொருவரும் தங்கள் வீட்டிற்குச் சென்று
  rationale: தமிழில் இயல்பான பகிர்வுச் சுட்டாக ‘ஒவ்வொருவரும்’ பயன்படுத்தப்படுகிறது. ‘தமக்குரியவை’ என்பது கிரேக்கத்தின் விரிவைத் தக்கவைத்து, அதை வீடு என்று மட்டும் கட்டுப்படுத்துவதில்லை.
- issue: சீடர்கள் விட்டுச் செல்வதற்கும் தந்தையின் உடனிருப்புக்கும் இடையிலான உறவு
  choice: ஆனாலும் நான் தனியாக இல்லை; ஏனெனில் தந்தை என்னோடு இருக்கிறார்
  alternative: நான் தனியாக இல்லை; தந்தை என்னோடு இருக்கிறார்
  rationale: சீடர்கள் இயேசுவை உண்மையாகத் தனியே விட்டுச் செல்வதையும், அதேவேளையில் தந்தை அவரோடு இருப்பதால் அவர் முற்றிலும் தனியாக இல்லாததையும் வசனம் தரும் பதற்றத்தோடு காக்கிறது; இதற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாட்டு முடிவுகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற வேதாகம உரைநடைச் சொல் இங்கு அறிவிப்பின் தீவிரத்திற்காகத் தக்கவைக்கப்பட்டுள்ளது; மற்ற வாக்கிய அமைப்பு இயல்பான தற்போதைய தமிழில் உள்ளது.
