  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: ta
  text: ஆனால் நான் இவற்றை உங்களிடம் பேசியதால், துக்கம் உங்கள் இதயத்தை நிரப்பியிருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் இதயங்களை.” கிரேக்கத்தில் “உங்கள்” என்பது பன்மையிலும் “இதயம்” என்பது ஒருமையிலும் உள்ளன; இது அந்தக் குழுவினர் பகிர்ந்துகொண்ட உள்ளார்ந்த துக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள முரண்பாட்டைக் குறிக்கும் இயல்பான எதிர்மறை இணைப்புச்சொல்.
- source_word: ὅτι
  choice: பேசியதால்
  rationale: இங்கு ὅτι சீடர்களின் துக்கத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘-தால்’ காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: இயேசு முன்பு பேசிய பல செய்திகளைக் குறிக்கும் பன்மைச் சுட்டுப்பெயரின் பொருளைத் தக்கவைக்கிறது.
- source_word: λελάληκα
  choice: நான் ... பேசியதால்
  rationale: λαλέω என்பதன் ‘பேசுதல்’ என்ற பொருளைத் தருகிறது. கிரேக்க நிறைவுக்காலத்தின் கடந்த செயலும் தற்போதைய விளைவும், காரண வினையெச்சத்துடனும் அடுத்துள்ள ‘நிரப்பியிருக்கிறது’ என்பதுடனும் இயல்பாக வெளிப்படுகின்றன.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: பன்மை இரண்டாம் நபருக்குச் சொல்லப்பட்டதை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἡ λύπη
  choice: துக்கம்
  rationale: ஆழ்ந்த மனவேதனை அல்லது வருத்தத்தைக் குறிக்கும் λύπη என்பதற்கு கண்ணியமான, பொதுவாகப் புரியும் சொல்.
- source_word: πεπλήρωκεν
  choice: நிரப்பியிருக்கிறது
  rationale: ‘நிரப்பியுள்ளது’ என்ற அடிப்படை உருவகத்தையும், நிறைவுக்காலத்தின் தொடரும் விளைவையும் தக்கவைக்கிறது; ‘ஆட்கொண்டது’ போன்ற விளக்கமிகு மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: ὑμῶν τὴν καρδίαν
  choice: உங்கள் இதயத்தை
  rationale: கிரேக்கத்தில் பன்மை உடைமைச் சொல்லுடன் ஒருமை ‘இதயம்’ வருகிறது. தமிழிலும் ‘உங்கள் இதயம்’ என்று கூறுவது குழுவினர் பகிரும் உள்ளார்ந்த நிலையை வெளிப்படுத்தி, ஒருமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: கூட்டுத் தன்மையுள்ள ஒருமை ‘இதயம்’ அல்லது பகிர்ந்தளிக்கும் பன்மை ‘இதயங்கள்’
  choice: உங்கள் இதயத்தை
  alternative: உங்கள் இதயங்களை
  rationale: மூலத்தில் καρδίαν ஒருமையில் இருப்பதால், சீடர்கள் அனைவரும் பகிரும் ஒரே உள்ளார்ந்த துக்கநிலையை முன்வைக்கும் வாய்ப்பை மொழிபெயர்ப்பு திறந்தவாறு வைத்திருக்கிறது. தமிழில் பன்மை உடைமையுடன் ஒருமை பெயர்ச்சொல் ஏற்றதாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘துக்கம் ... இதயத்தை நிரப்பியது’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘பேசியதால்’ இயல்பான தமிழ் சொற்றொடரில் காரணத் தொடர்பைத் தெளிவாக்குகிறது.
