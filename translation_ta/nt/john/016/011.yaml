lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: தீர்ப்பைக் குறித்தும்
  rationale: περί + பிறப்புவேற்றுமை பேசுபொருளைச் சுட்டுகிறது; δέ இங்கு தொடர்ச்சியை உணர்த்துவதால் ‘-உம்’ மூலம் இயல்பாகக் கொண்டுவரப்பட்டுள்ளது. κρίσις என்பதற்கு நேரடியான ‘தீர்ப்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ':'
  rationale: முந்தைய சூழலில் கூறப்பட்ட ‘தீர்ப்பைக் குறித்து’ என்பதற்கான காரணத்தை ὅτι அறிமுகப்படுத்துகிறது. தமிழில் முக்காற்புள்ளி அடுத்த காரணவிளக்கத்தை இயல்பாக இணைக்கிறது; ‘ஏனெனில்’ என்பதும் சாத்தியம்.
- source_word: ὁ ἄρχων
  choice: ஆளுநன்
  rationale: ἄρχων என்பது ஆட்சி அல்லது அதிகாரம் செலுத்துபவரைக் குறிக்கிறது. ‘ஆளுநன்’ அதிகாரத்தின் கருத்தைப் பாதுகாக்கிறது; அரச மரபைத் தேவையின்றி உணர்த்தக்கூடிய ‘இளவரசன்’ தவிர்க்கப்பட்டுள்ளது.
- source_word: τοῦ κόσμου τούτου
  choice: இந்த உலகத்தின்
  rationale: யோவானின் பயன்பாட்டுக்கும் கிரேக்கச் சொற்றொடரின் அமைப்புக்கும் ஏற்ப κόσμος ‘உலகம்’ என நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κέκριται
  choice: தீர்ப்பளிக்கப்பட்டிருக்கிறான்
  rationale: κρίνω வின் நிறைநிலைச் செயப்பாட்டு வடிவமான κέκριται, தீர்ப்பு நிகழ்ந்து அதன் விளைவு தொடர்ந்து நிலவுவதை உணர்த்துகிறது. ‘தண்டிக்கப்பட்டிருக்கிறான்’ என்று குறுக்காமல், தீர்ப்பு என்ற பரந்த பொருள் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘இந்த உலகத்தின் ஆளுநன்’ என்பவரின் அடையாளம்
  choice: மூலத்தில் உள்ள பட்டப்பெயரைப் பிரதான உரையில் அப்படியே வைத்தல்
  alternative: ‘இந்த உலகத்தின் ஆளுநனாகிய சாத்தான்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: யோவான் 12:31; 14:30 ஆகியவற்றின் அடிப்படையில் இது சாத்தானைக் குறிக்கும் எனப் பொதுவாகப் புரிந்துகொள்ளப்பட்டாலும், இவ்வசனம் பெயரைச் சொல்லாமல் பட்டப்பெயரையே பயன்படுத்துகிறது. ஆகவே அடையாளம் அடிக்குறிப்பில் மட்டும் குறிப்பிடப்படுகிறது.
- issue: κέκριται என்பதன் தீர்ப்பியல் நுட்பம்
  choice: ‘தீர்ப்பளிக்கப்பட்டிருக்கிறான்’
  alternative: ‘தண்டனைத் தீர்ப்புக்குள்ளாக்கப்பட்டிருக்கிறான்’
  rationale: சூழலில் கண்டனத் தீர்ப்பு உட்பொருளாக இருந்தாலும், κρίνω என்பதன் சொற்பொருளை ‘தண்டனை’ எனக் குறுக்காமல் பாதுகாக்கிறது; நிறைநிலையின் தொடரும் விளைவும் வெளிப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய தொடரின் ஒரு பகுதி என்பதால் ‘-உம்’ இணைப்பு வைக்கப்பட்டுள்ளது. காரணவிளக்கத்தை இயல்பாக்க முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது; இறையியல் அடையாளமும் தீர்ப்பின் தன்மையும் பிரதான உரையில் அளவுக்கு மீறி விளக்கப்படவில்லை.
