  to: தீர்ப்பைக் குறித்தும், ஏனெனில் இந்த உலகத்தின் ஆளுநன்[a][b] தீர்ப்புக்கு உட்படுத்தப்பட்டிருக்கிறான்[c].
  rationale: The revision explicitly renders ὅτι with ‘ஏனெனில்’ and replaces the less idiomatic passive expression with ‘தீர்ப்புக்கு உட்படுத்தப்பட்டிருக்கிறான்.’ It retains the Greek perfect’s completed judgment with continuing result, keeps the title nonspecific in the main text, and preserves all footnote anchors and their functions.
