  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: ta
  text: தந்தை தாமே உங்களை அன்புகூருகிறார்; ஏனெனில் நீங்கள் என்னை அன்புகூர்ந்திருக்கிறீர்கள்; நான் கடவுளிடமிருந்து வந்தேன்[a] என்று நம்பியிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளிடமிருந்து புறப்பட்டு வந்தேன்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொற்றொடர் கடவுளின் முன்னிலையிலிருந்து வந்ததையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς … ὁ πατὴρ
  choice: தந்தையே
  rationale: αὐτός தரும் வலியுறுத்தலை இயல்பான தமிழில் ‘-ஏ’ மூலம் வெளிப்படுத்துகிறது; தந்தை தாமே அன்புகூருகிறார் என்ற பொருள் காக்கப்படுகிறது.
- source_word: γὰρ
  choice: ஏனெனில் … அதனால்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் தொடர்பையும், இவ்வசனத்திற்குள் வரும் காரண–விளைவு உறவையும் இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: φιλεῖ
  choice: அன்புகூருகிறார்
  rationale: தனிப்பட்ட பாசத்தையும் உறவுசார் அன்பையும் கண்ணியமான, வழக்கிலுள்ள தமிழில் தெரிவிக்கிறது.
- source_word: πεφιλήκατε
  choice: அன்புகூர்ந்திருக்கிறீர்கள்
  rationale: நிறைவேற்றுக் காலத்தின் கடந்த செயலும் அதன் தற்போதைய நிலைத்த விளைவும் தமிழில் இயன்றவரை காக்கப்படுகின்றன.
- source_word: πεπιστεύκατε
  choice: நம்பியிருக்கிறீர்கள்
  rationale: முன்பு தொடங்கி தற்போதும் நிலைக்கும் நம்பிக்கையை நிறைவேற்றுக் காலத்திற்கேற்ற வகையில் தெரிவிக்கிறது.
- source_word: παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: கடவுளிடமிருந்து வந்தேன்
  rationale: இயேசுவின் தோற்றமும் அனுப்பப்படுதலும் குறித்த மூலமொழியின் சுருக்கமான கூற்றை விரிவான கோட்பாட்டு விளக்கமின்றி காக்கிறது; παρά என்பதிலுள்ள ‘அருகிலிருந்து/முன்னிலையிலிருந்து’ என்ற சாத்திய நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘நான் கடவுளிடமிருந்து வந்தேன்’ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: கடவுளிடமிருந்து வந்தேன்
  alternative: கடவுளிடமிருந்து புறப்பட்டு வந்தேன் / கடவுளின் முன்னிலையிலிருந்து வந்தேன்
  rationale: இயேசுவின் தெய்வீகத் தொடர்பு, தோற்றம், பணி ஆகியவற்றை வசனம் உறுதிப்படுத்துகிறது; ஆனால் மூலவாக்கியத்தைத் தாண்டிய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அதன் பொருள் விரிவைத் திறந்தவாறே வைக்கிறது.
- issue: தந்தையின் அன்புக்கும் சீடர்களின் அன்பு மற்றும் நம்பிக்கைக்கும் உள்ள காரணத் தொடர்பு
  choice: மூலத்தில் உள்ள காரணத் தொடர்பை நேரடியாகக் காக்கிறது
  alternative: சீடர்களின் அன்பும் நம்பிக்கையும் தந்தையின் அன்பைச் சம்பாதித்தன என விளக்கிப் பரவலாக்குவது
  rationale: ὅτι இலக்கண ரீதியாகக் காரணத்தைத் தெரிவிக்கிறது. அந்தத் தொடர்பை மொழிபெயர்ப்பு காக்கிறது; அதேவேளை தெய்வீக அன்பின் முழுக் கோட்பாட்டை இந்த ஒரு வாக்கியத்திலிருந்து தீர்மானித்து விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தையே’ என்பது αὐτός தரும் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது. காரணத்தைக் குறிக்கும் நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், அதன் தர்க்கத் தொடர்பு ‘ஏனெனில் … அதனால்’ என்பதால் காக்கப்பட்டுள்ளது.
