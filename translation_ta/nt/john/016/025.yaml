  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: ta
  text: இவற்றை நான் உங்களிடம் மறைமுகமாகப் பேசியிருக்கிறேன்[a]. நான் இனிமேல் உங்களிடம் மறைமுகமாகப் பேசாமல், தந்தையைப் பற்றி வெளிப்படையாக[c] உங்களுக்கு அறிவிக்கும் ஒரு நேரம்[b] வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உருவகமாக,” “மறைபொருளாக”; கிரேக்கச் சொல் உருவகமான அல்லது நேரடியல்லாத பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு வேளை வருகிறது.” யோவான் நூலில் “வேளை” என்பது பல இடங்களில் இறையியல் முக்கியத்துவம் உடையது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தெளிவாக,” “ஒளிவுமறைவின்றி”; இங்கு நேரடியான, உருவகமற்ற பேச்சே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: மறைபொருளான பேச்சில்
  rationale: யோவானின் பயன்பாட்டில் இது உவமை என்ற குறிப்பிட்ட இலக்கிய வடிவத்தை மட்டும் அல்லாமல், உருவகமான அல்லது மறைமுகமான பேச்சைக் குறிக்கிறது. இச்சொற்றொடர் அந்த மறைமுகத் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: λελάληκα
  choice: சொல்லியிருக்கிறேன்
  rationale: நிறைவுற்ற செயல் தற்போதும் பொருத்தமுடையதாக இருப்பதைத் தமிழ் நிறைவு வடிவம் காட்டுகிறது.
- source_word: ἔρχεται ὥρα
  choice: ஒரு நேரம் வருகிறது
  rationale: தமிழில் 'ஒரு மணி வருகிறது' என்பது இங்கு இயல்பாகாது. 'ஒரு நேரம்' என்பது காலப்புள்ளியைத் தெளிவாகக் கூறுகிறது; யோவானில் உள்ள 'வேளை' சார்ந்த இறையியல் ஒலிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: οὐκέτι
  choice: இனி ... பேசாமல்
  rationale: வரவிருக்கும் மாற்றத்தைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் காட்டுகிறது.
- source_word: λαλήσω
  choice: பேசாமல்
  rationale: முந்தைய சொல்லுதலுக்கும் பின்னர் வரும் நேரடியான அறிவித்தலுக்கும் இடையிலான பேச்சுச் செயல் தொடர்ச்சியைப் பேணுகிறது.
- source_word: παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: இங்கு துணிவைக் காட்டிலும் மறைமுகப் பேச்சுக்கு மாறான நேரடியான, தெளிவான வெளிப்பாடே முதன்மை.
- source_word: ἀπαγγελῶ
  choice: அறிவிக்கும்
  rationale: வெறும் உரையாடலைவிட வெளிப்படுத்தித் தெரிவிக்கும் பொருளை dignified ஆனாலும் எளிய தமிழில் தருகிறது.
- source_word: περὶ τοῦ πατρὸς
  choice: தந்தையைப் பற்றி
  rationale: இது இயல்பான நவீன தமிழ்; πατήρ என்பதன் உறவுசார் மற்றும் இறையியல் முக்கியத்துவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவானியச் சூழலில் ὥρα என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு நேரம் வருகிறது
  alternative: ஒரு வேளை வருகிறது / அந்த வேளை வருகிறது
  rationale: கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததால் 'அந்த வேளை' என்று மிகையாகக் குறிப்பாக்கவில்லை. இயல்பான தமிழுக்காக 'நேரம்' பயன்படுத்தப்பட்டாலும், யோவானிய இறையியல் ஒலிப்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- issue: ἐν παροιμίαις என்பதற்கு எதிர்மாறாக παρρησίᾳ என்பதன் பொருள்
  choice: வெளிப்படையாக
  alternative: தெளிவாக / ஒளிவுமறைவின்றி
  rationale: இவ்வசனத்தின் மைய எதிர்மறை மறைமுக அல்லது உருவகப் பேச்சுக்கும் நேரடியான வெளிப்பாட்டுக்கும் இடையிலானது; பொதுவெளித் துணிவு என்ற வேறு கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. 'மறைபொருளான பேச்சு' என்பது 'உவமை' என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் மூலத்தின் பரந்த பொருளைப் பேணுகிறது. அடிக்குறிப்பு குறிகள் உரையில் அனைத்தும் இடம்பெற்றுள்ளன.
