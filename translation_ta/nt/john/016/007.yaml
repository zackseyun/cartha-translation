id: JHN.16.7
reference: John 16:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: ta
  text: 'ஆனால் நான் உங்களிடம் உண்மையைச் சொல்கிறேன்: நான் பிரிந்து போவது உங்களுக்கு நன்மையானது. ஏனெனில் நான் போகாவிட்டால், உங்களுக்குத் துணைநிற்பவர்[a] உங்களிடம் நிச்சயமாக வரமாட்டார்; ஆனால் நான் சென்றால், அவரை உங்களிடம் அனுப்புவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வழக்காடுபவர்,’ ‘உதவியாளர்,’ ‘ஆலோசகர்,’ அல்லது ‘ஆறுதலளிப்பவர்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘பராக்லேட்டோஸ்.’
    reason: παράκλητος என்ற சொல்லின் பரந்த பொருள் வரம்பையும் முக்கிய மொழிபெயர்ப்பு மாற்றுகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய சூழலில் சீடர்களின் துயரத்துக்கு மாறாக இயேசு கூறும் உண்மையை இயல்பான எதிர்மறை இணைப்பால் அறிமுகப்படுத்துகிறது.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: நான் உங்களிடம் உண்மையைச் சொல்கிறேன்
  rationale: உண்மையை வலியுறுத்தும் மூலமொழி தொடரை இயல்பான நவீன தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: συμφέρει ὑμῖν
  choice: உங்களுக்கு நன்மையானது
  rationale: பயன் அல்லது சாதகம் என்ற பொருளைத் தெளிவாகவும் பொதுவாசகருக்கு இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: நான் போவது
  rationale: எது அவர்களுக்கு நன்மையானது என்பதைத் தெரிவிக்கும் ἵνα தொடரின் உள்ளடக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: ஏனெனில் நான் போகவில்லை என்றால்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும் நிபந்தனை அமைப்பையும், முந்தைய வினையின் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: ὁ παράκλητος
  choice: துணைநிற்பவர்
  rationale: பிறருக்காக அருகில் நின்று உதவும் அல்லது ஆதரிக்கும் தனிப்பட்ட முகவர் என்ற யோவானியச் சொல்லின் பரப்பை, சட்டத்துறைப் பொருளுக்குள் மட்டும் சுருக்காமல் தெரிவிக்கிறது; பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: οὐ μὴ ἔλθῃ
  choice: நிச்சயமாக வரமாட்டார்
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: சீடர்களை நோக்கிய வருகை அல்லது அனுப்புதலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἐὰν δὲ πορευθῶ
  choice: ஆனால் நான் சென்றால்
  rationale: முந்தைய நிபந்தனைக்கு எதிரான நிலையை δέ குறிக்கிறது; πορεύομαι என்பதற்கு இச்சூழலில் இயல்பான ‘செல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πέμψω αὐτὸν
  choice: அவரை உங்களிடம் அனுப்புவேன்
  rationale: πέμπω என்பதன் சாதாரண ‘அனுப்பு’ பொருளைக் காக்கிறது; αὐτόν குறிக்கும் தனிப்பட்ட ஆண்பால் சுட்டை ‘அவரை’ என மரியாதையுடனும் தனிநபர் குறிப்புடனும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவானிய உரையில் παράκλητος என்பதன் மொழிபெயர்ப்பு
  choice: துணைநிற்பவர்
  alternative: உதவியாளர்; ஆலோசகர்; ஆறுதலளிப்பவர்; பராக்லேத்தோஸ்
  rationale: இச்சொல் இயேசுவின் சார்பாக வந்து சீடர்களுக்கு உதவி செய்து அவர்களுக்காக நிற்கும் தனிப்பட்ட முகவரைக் குறிக்கிறது. எந்த ஒரு தமிழ்ச் சொல்லும் அதன் முழுப் பொருள் பரப்பையும் கொண்டிருக்காததால், முதன்மை உரையில் பரந்த பொருளுள்ள சொல்லும் அடிக்குறிப்பில் முக்கிய மாற்றுகளும் தரப்பட்டுள்ளன.
- issue: παράκλητος குறித்த தனிப்பட்ட சுட்டுப்பெயர்
  choice: அவரை
  alternative: அதை
  rationale: மூல உரையின் αὐτόν என்பது παράκλητος என்பவரைத் தனிப்பட்டவராகச் சுட்டுகிறது. ‘அவரை’ என்பது அந்தத் தனிப்பட்ட மொழியைப் பிரதிபலிக்கிறது; ஆளற்ற சக்தியாகப் புரியுமாறு மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உங்களுக்குத் துணைநிற்பவர்’ என்பதில் புணர்ச்சி இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது. வலியுறுத்தப்பட்ட மறுப்பு ‘நிச்சயமாக வரமாட்டார்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது; மூலத்தின் இரண்டு நிபந்தனை வாக்கியங்களும் எதிர்மறைத் தொடர்பும் காக்கப்பட்டுள்ளன.
