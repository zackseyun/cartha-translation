source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: ta
  text: 'அந்த நாளில் நீங்கள் என்னிடம் எதுவும் கேட்கமாட்டீர்கள்.[a] உறுதியாக, உறுதியாக உங்களுக்குச் சொல்கிறேன்: நீங்கள் தந்தையிடம் என் பெயரில் எதைக் கேட்டாலும், அவர் அதை உங்களுக்குக் கொடுப்பார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் ‘கேட்பது’ என்பதற்கு இரண்டு கிரேக்க வினைகள் வருகின்றன. இங்கு ἐρωτάω என்பது ஒருவரிடம் கேள்வி கேட்பதைக் குறிக்கக்கூடும்; பின்னர் தந்தையிடம் கேட்பதற்கு வரும் αἰτέω என்பது கோருவது அல்லது வேண்டுவது என்ற பொருளைத் தெளிவாகக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘என் பெயரில்’ என்ற சொற்றொடர் வாக்கியத்தின் இறுதியில் வருகிறது. தமிழில் பொருள் தெளிவுக்காக, அது தந்தையிடம் செய்யப்படும் வேண்டுதலோடு இணைக்கப்பட்டுள்ளது.
    reason: syntactic_clarification
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: கிரேக்கத்தின் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருவதோடு, யோவான் நூலில் அதற்குள்ள எதிர்நோக்கையும் காக்கிறது.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: நீங்கள் என்னிடம் எதுவும் கேட்கமாட்டீர்கள்
  rationale: ἐμέ என்பதைக் ‘என்னிடம்’ என வெளிப்படையாக வைத்தும், οὐδέν என்பதன் முழுமையான மறுப்பைக் காத்தும் மொழிபெயர்க்கிறது. ἐρωτάω இங்கு கேள்வி கேட்பதையும் பொதுவாகக் கேட்பதையும் குறிக்கக்கூடும்; ஆகவே முதன்மை உரையில் ‘கேள்வி’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: யோவான் நற்செய்தியின் வலியுறுத்தும் இரட்டிப்பைத் தக்கவைத்து, சாதாரண வாசகருக்குப் புரியும் dignified Tamil வடிவை வழங்குகிறது.
- source_word: ἄν τι αἰτήσητε
  choice: எதைக் கேட்டாலும்
  rationale: ἄν τι உடனான திறந்த, வரையறுக்கப்படாத கோரிக்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் நிபந்தனை போலக் குறுக்குவதில்லை.
- source_word: τὸν πατέρα
  choice: தந்தையிடம்
  rationale: கிரேக்கத்தில் உள்ள ‘தந்தை’ என்பதையே தருகிறது; மூலத்தில் இல்லாத ‘என்’ என்ற உடைமைச்சொல்லைச் சேர்க்கவில்லை.
- source_word: δώσει ὑμῖν
  choice: அதை உங்களுக்குக் கொடுப்பார்
  rationale: தமிழில் வாக்கியம் இயல்பாக அமைய, முன் கூறிய கோரிக்கையிலிருந்து புரிந்துகொள்ளப்படும் செயப்படுபொருளை ‘அதை’ என்று வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: யோவான் நூலின் முக்கியமான சொற்றொடரை அதன் பிரதிநிதித்துவம் மற்றும் உறவு சார்ந்த பொருள் அகலத்துடன் வைத்திருக்கிறது; அதன் துல்லியமான இறையியல் செயல்முறையை விளக்கிப் பொருள் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἐρωτάω மற்றும் αἰτέω ஆகிய இரு ‘கேட்பது’ வினைகளின் வேறுபாடு
  choice: முதன்மை உரையில் இரண்டையும் ‘கேட்பது’ என்ற இயல்பான தமிழ் வினையால் தருதல்; வேறுபாட்டை அடிக்குறிப்பில் பதிவு செய்தல்
  alternative: முதலாவதை ‘கேள்வி கேட்பது’ என்றும் இரண்டாவதை ‘வேண்டிக்கொள்வது’ என்றும் வெளிப்படையாக வேறுபடுத்துதல்
  rationale: சூழலில் முதலாவது கேள்வி கேட்பதைச் சுட்டலாம்; இரண்டாவது கோரிக்கையைக் குறிக்கிறது. எனினும் கிரேக்கச் சொற்களின் பொருள் எல்லைகள் ஒன்றோடொன்று தொடுவதால், முதன்மை உரையில் மிகக் கூர்மையான வேறுபாட்டைத் திணிக்காமல் உள்ளார்ந்த ambiguity-ஐக் காக்கிறது.
- issue: ἐν τῷ ὀνόματί μου எந்த வினையோடு தொடர்புபடுகிறது என்பது
  choice: SBLGNT-இல் அச்சிடப்பட்ட சொல் வரிசைப்படி ‘அவர் என் பெயரில் ... கொடுப்பார்’ என்று இணைத்தல்
  alternative: ‘நீங்கள் என் பெயரில் தந்தையிடம் எதைக் கேட்டாலும்’ என்று ‘கேட்பது’ என்பதோடு இணைத்தல்
  rationale: அச்சிடப்பட்ட கிரேக்க உரையில் இச்சொற்றொடர் δώσει ὑμῖν என்பதற்குப் பிறகு வருகிறது; எனவே அந்த அண்மையை முதன்மை உரை காக்கிறது. வேறு சொல் வரிசையைக் கொண்ட சான்றுகளும், பரவலான மாற்று இணைப்பும் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகின்றன.
- issue: ‘என் பெயரில்’ செய்யப்படும் வேண்டுதலுக்கான வாக்குறுதியின் வரம்பு
  choice: வசனம் கூறும் வாக்குறுதியை கூடுதல் நிபந்தனைகள் இன்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: இயேசுவின் சித்தத்துடன் ஒத்த கோரிக்கைகளுக்கு மட்டுமே என்று முதன்மை உரையிலேயே விளக்கிச் சேர்த்தல்
  rationale: பரந்த யோவானியச் சூழல் விளக்கத்திற்கு உதவினாலும், இந்த வசனத்தில் வெளிப்படையாக இல்லாத இறையியல் நிபந்தனையை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘உறுதியாக, உறுதியாக’ என்ற இரட்டிப்பு யோவானின் வலியுறுத்தலைக் காக்கிறது. முதன்மை உரை SBLGNT அச்சிட்ட சொல் வரிசையை முன்னிலைப்படுத்துகிறது; சொற்பொருள் மற்றும் தொடரியல் ambiguity-கள் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகின்றன.
