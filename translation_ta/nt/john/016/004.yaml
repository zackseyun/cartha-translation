  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: ta
  text: ஆனால், அவற்றின் நேரம் வரும்போது, அவற்றைக் குறித்து நான்தான் உங்களிடம் சொன்னேன் என்பதை நீங்கள் நினைவுகூரும்படி இவற்றை உங்களிடம் சொல்லியிருக்கிறேன்.[a] நான் உங்களோடு இருந்ததால், தொடக்கத்திலிருந்து இவற்றை உங்களிடம் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மூல கிரேக்கத்தில் αὐτῶν (‘அவற்றின்/அவற்றை’) என்பது இருமுறை வருகிறது. இன்னும் சொற்சொல்லாக: ‘அவற்றின் நேரம் வரும்போது, அவற்றை நினைவுகூருங்கள்—நானே உங்களிடம் சொன்னேன் என்பதை.’ இவை எதைச் சுட்டுகின்றன என்பதும், இரண்டாவது சொல் பின்வரும் கூற்றுடன் எவ்வாறு தொடர்புபடுகிறது என்பதும் சற்றுத் தெளிவற்றவை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: சொல்லியிருக்கிறேன்
  rationale: நிறைவுற்ற செயல் இப்போதும் பொருத்தமுடையதாக இருப்பதை உணர்த்தும் கிரேக்க நிறைவுக்காலத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: இயேசு சற்று முன் கூறிய எச்சரிக்கைகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: அவற்றின் நேரம் வரும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலைக் குறிக்கும் ὅταν மற்றும் நியமிக்கப்பட்ட காலம் என்ற நிழற்பொருள் கொண்ட ὥρα ஆகியவற்றைப் பாதுகாக்கிறது; αὐτῶν என்பதன் தெளிவின்மையையும் தீர்த்துவிடாமல் வைத்திருக்கிறது.
- source_word: μνημονεύητε
  choice: நீங்கள் நினைவுகூரும்படி
  rationale: ἵνα உடன் வரும் நோக்கப்பொருளைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν
  choice: அவற்றைக் குறித்து நான்தான் உங்களிடம் சொன்னேன் என்பதை
  rationale: இரண்டாவது αὐτῶν என்பதைக் கைவிடாமல் இயல்பான தமிழில் இணைக்கிறது; ἐγώ என்பதன் வலியுறுத்தலை ‘நான்தான்’ என வெளிப்படுத்துகிறது.
- source_word: ἐξ ἀρχῆς
  choice: தொடக்கத்திலேயே
  rationale: ‘தொடக்கத்திலிருந்து’ என்ற அடிப்பொருளை, முன்பே சொல்லாததைக் குறிக்கும் இச்சூழலில் இயல்பான தமிழாக வழங்குகிறது.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: நான் உங்களோடு இருந்ததால்
  rationale: உடனிருத்தலை நேரடியாகத் தெரிவித்து, ὅτι என்பதன் காரணப்பொருளையும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: இருமுறை வரும் αὐτῶν என்பதன் சுட்டுப்பொருளும் தொடரியல் தொடர்பும்
  choice: ‘அவற்றின் நேரம்’ என்றும் ‘அவற்றைக் குறித்து ... சொன்னேன்’ என்றும் இரு நிகழ்வுகளையும் முதன்மை உரையில் வெளிப்படுத்தப்பட்டது.
  alternative: இரண்டாவது αὐτῶν என்பதை வெளிப்படையாக மொழிபெயர்க்காமல், ‘நான் உங்களிடம் சொன்னேன் என்பதை நினைவுகூரும்படி’ என்று மொழிபெயர்க்கலாம்.
  rationale: SBLGNT உரையில் இரு நிகழ்வுகளும் இருப்பதால் அவற்றை முடிந்தவரை பாதுகாப்பது மூலச்சான்றுக்கு நெருக்கமானது. அதேவேளை அவை எதைச் சுட்டுகின்றன என்பதைத் திட்டவட்டமாக நிர்ணயிக்காமல், கிரேக்கத்தின் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்கிறது.
