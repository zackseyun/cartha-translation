  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சொல்லியிருக்கிறேன்’, ‘நினைவுகூரும்படி’, ‘தொடக்கத்திலேயே’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் நடையில் உள்ளன; ‘நான்தான்’ மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
