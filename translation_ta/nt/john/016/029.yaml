source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: ta
  text: அவருடைய சீடர்கள், “இதோ, இப்போது நீங்கள் வெளிப்படையாகப் பேசுகிறீர்கள்[a]; எந்த உருவகமான பேச்சையும் பேசவில்லை[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தெளிவாக” அல்லது “மனந்திறந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வெளிப்படையாக, தெளிவாக, அல்லது ஒளிவுமறைவின்றிப் பேசுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பழமொழி,” “உவமை,” அல்லது “மறைமுகமான கூற்று” என்றும் மொழிபெயர்க்கலாம். இங்கு உருவகமான அல்லது மறைமுகமான பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: என்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை, நவீனத் தமிழின் இயல்பான கதைநடை இறந்தகாலமாக மொழிபெயர்க்கிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: உடைமை உறவையும் இயேசுவையே சுட்டும் குறிப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இடைச்சொல்லின் வலிமையை, கண்ணியமான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: இயேசுவின் பேச்சுமுறையில் ஏற்பட்டதாகச் சீடர்கள் கருதும் தற்போதைய மாற்றத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐν παρρησίᾳ
  choice: வெளிப்படையாக
  rationale: இங்கு மறைமுகமான அல்லது உருவகப் பேச்சுடன் வரும் எதிர்மறை ஒப்பீட்டில், திறந்தும் தெளிவாகவும் பேசுதல் முதன்மையான பொருள்.
- source_word: λαλεῖς
  choice: பேசுகிறீர்கள்
  rationale: நடப்பிலுள்ள உரையாடலைக் குறிக்கும் நிகழ்காலத்தையும் மரியாதை விகுதியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παροιμίαν
  choice: மறைபொருளான பேச்சு
  rationale: யோவானின் சூழலில் இது சாதாரண பழமொழியைவிட உருவகமான, மறைமுகமான அல்லது பொருள் மறைந்த கூற்றைக் குறிக்கிறது.
- source_word: οὐδεμίαν λέγεις
  choice: எதையும் பேசவில்லை
  rationale: முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்தி, λέγεις என்பதன் ‘பேசு/சொல்’ என்ற சொல்லாட்சியையும் காக்கிறது.
theological_decisions:
- issue: παρρησία என்பதற்கும் παροιμία என்பதற்கும் இடையிலான எதிர்மறை ஒப்பீடு
  choice: வெளிப்படையான பேச்சை மறைபொருளான அல்லது மறைமுகமான பேச்சுடன் வேறுபடுத்திக் காட்டுதல்
  alternative: துணிவாக அல்லது மனந்திறந்து பேசுதல்
  rationale: உடனடி சூழலில் παρρησία என்பது παροιμίαν οὐδεμίαν என்பதற்கு எதிராக நிறுத்தப்பட்டுள்ளது. ஆகவே பேச்சின் துணிவைவிட அதன் வெளிப்படைத்தன்மை இங்கு முதன்மை; எனினும் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிப் பேசுவதால் மரியாதைப் பன்மையான “நீங்கள்” வைக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
