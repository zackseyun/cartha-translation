revisions:
- from: 'எனவே, அவருடைய சீடர்களில் சிலர் ஒருவருக்கொருவர், “அவர் நம்மிடம் சொல்கிற இந்த வார்த்தையின் பொருள் என்ன: ‘இன்னும் சிறிது காலம், நீங்கள் என்னைக் காணமாட்டீர்கள்; மறுபடியும் சிறிது காலம், நீங்கள் என்னைக் காண்பீர்கள்’ என்பதும், ‘நான் தந்தையிடம் போவதால்தான்’[a] என்பதும் என்ன?” என்று கேட்டுக்கொண்டார்கள்.'
  to: 'எனவே, அவருடைய சீடர்களில் சிலர் ஒருவருக்கொருவர் இப்படிச் சொல்லிக்கொண்டார்கள்: “அவர் நம்மிடம் சொல்வது என்ன: ‘இன்னும் சிறிது காலம், நீங்கள் என்னைக் காணமாட்டீர்கள்; மறுபடியும் சிறிது காலம், நீங்கள் என்னைக் காண்பீர்கள்’? மேலும், ‘நான் தந்தையிடம் போவதால்தான்’[a] என்பது என்ன?”'
  rationale: The revision corrects the narrative speech verb, streamlines the disciples’ question to correspond more closely to the Greek, and preserves both the causal main-text reading and the alternative syntactic analysis of ὅτι in the anchored footnote. No theological referent is specified beyond the source text.
