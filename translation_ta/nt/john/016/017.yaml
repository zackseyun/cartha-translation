source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: ta
  text: 'எனவே, அவருடைய சீடர்களில் சிலர் ஒருவருக்கொருவர் இப்படிச் சொல்லிக்கொண்டார்கள்: “அவர் நம்மிடம் சொல்வது என்ன: ‘இன்னும் சிறிது காலம், நீங்கள் என்னைக் காணமாட்டீர்கள்; மறுபடியும் சிறிது காலம், நீங்கள் என்னைக் காண்பீர்கள்’? மேலும், ‘நான் தந்தையிடம் போவதால்தான்’[a] என்பது என்ன?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் தந்தையிடம் போகிறேன் என்பது.” கிரேக்க இணைப்புச்சொல் மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாகவோ, “போவதால்” என்ற காரணப்பொருளிலோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய வசனத்தில் இயேசு கூறியதிலிருந்து சீடர்களின் எதிர்வினைக்குச் செல்லும் காரணவிளைவு சார்ந்த உரையோட்டத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் சிலர்
  rationale: ἐκ என்ற பகுதிச் சுட்டு, சீடர்கள் அனைவரையும் அல்லாமல் அவர்களில் ஒரு பகுதியினரைக் குறிக்கிறது.
- source_word: πρὸς ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: சீடர்களுக்கிடையிலான பரஸ்பர உரையாடலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: அவர் நம்மிடம் சொல்கிற இந்த வார்த்தையின் பொருள் என்ன
  rationale: கிரேக்க அமைப்பிலுள்ள ‘இது என்ன?’ என்ற குழப்பத்தைத் தக்கவைத்தபடி, தமிழில் கேள்வியின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Μικρὸν
  choice: சிறிது காலம்
  rationale: சொல்லுக்குச் சொல் ‘சிறிது’ என்றாலும், இங்கு காலப்பொருள் உட்கிடையாக இருப்பதால் ‘சிறிது காலம்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: θεωρεῖτέ
  choice: காணமாட்டீர்கள்
  rationale: இச்சூழலில் நேரடியான காணுதல் அல்லது உணர்தலைக் குறிக்கிறது; இணை வாக்கியத்துடனான சொல்லொற்றுமைக்காக ‘காண்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὄψεσθέ
  choice: காண்பீர்கள்
  rationale: எதிர்காலக் காணுதலைக் குறிக்கிறது; கிரேக்கத்தில் வேறு வினைச்சொல் இருந்தாலும் தமிழில் முன் வினையுடன் உள்ள சொல்லாட்சி ஒற்றுமையைப் பேணுகிறது.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: மீண்டும் நிகழ்வதை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: நான் தந்தையிடம் போவதால்தான்
  rationale: ὅτι-யின் காரணப்பொருளைத் தக்கவைத்து, முந்தைய வசனத்தில் இயேசு கூறியதின் ஒரு பகுதியாக மேற்கோளிடுகிறது; உள்ளடக்கத்தை அறிமுகப்படுத்தும் ‘நான் தந்தையிடம் போகிறேன் என்பது’ என்ற வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πατέρα
  choice: தந்தை
  rationale: மூலத்தில் ‘என் தந்தை’ என்று இல்லாமல் குறிப்பிட்ட ‘தந்தை’ என்று இருப்பதை இணக்கப்படுத்தாமல் பேணுகிறது.
theological_decisions:
- issue: இயேசு போவதும் சீடர்கள் மீண்டும் அவரைக் காண்பதும் எதைக் குறிக்கிறது
  choice: வசனத்தில் சீடர்களுக்கு உள்ள தெளிவின்மை அப்படியே விடப்பட்டுள்ளது.
  alternative: இது மரணம் மற்றும் உயிர்த்தெழுதல், விண்ணேற்றம் மற்றும் ஆவிக்குரிய பிரசன்னம், அல்லது உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சிகளைக் குறிப்பதாக வெளிப்படையாக விளக்குதல்.
  rationale: இந்த வசனம் குறிப்பின் பொருளைத் தீர்மானிக்காமல் சீடர்களின் குழப்பத்தையே முன்வைக்கிறது; ஆகவே மொழிபெயர்ப்பு எந்த ஒரு இறையியல் விளக்கத்தையும் பிரதான உரைக்குள் சேர்க்கவில்லை.
- issue: ὅτι என்பதன் இலக்கணப் பணி
  choice: ‘போவதால்தான்’ என்ற காரணப்பொருள் பிரதான உரையில் வைக்கப்பட்டுள்ளது.
  alternative: ‘நான் தந்தையிடம் போகிறேன் என்பது’ என்று மேற்கோள் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக வாசித்தல்.
  rationale: இரண்டு வாசிப்புகளும் இலக்கண ரீதியாகச் சாத்தியமானவை; பிரதான உரையில் காரணப்பொருளைத் தேர்ந்தெடுத்து, உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தந்தை’ என்ற யோவானிய இறையியல் அழைப்பு தக்கவைக்கப்பட்டுள்ளது. கேள்வியின் உள்ளே உள்ள இரண்டு மேற்கோள் கூறுகளும் தெளிவாக அமைக்கப்பட்டுள்ளன.
