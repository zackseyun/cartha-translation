id: JHN.16.13
reference: John 16:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: ta
  text: ஆனால் அவர், சத்தியத்தின் ஆவியானவர், வரும்போது, முழுச் சத்தியத்திற்குள் உங்களை வழிநடத்துவார்.[a] ஏனெனில், அவர் தம்மிடமிருந்து பேசமாட்டார்;[b] ஆனால் தாம் கேட்பவற்றையே பேசுவார். வரவிருப்பவற்றை உங்களுக்கு அறிவிப்பார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுச் சத்தியத்தில் உங்களை வழிநடத்துவார்.” கிரேக்கத்தில் ἐν என்பது பொதுவாக “இல்” என்று பொருள்படும்; ஆனால் “வழிநடத்துதல்” என்ற வினையுடன் இலக்கு அல்லது இயக்க நுணுக்கமும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: 'அல்லது, “தாமாகவே பேசமாட்டார்.” சொல்லுக்குச் சொல்: “தம்மிடமிருந்து பேசமாட்டார்.”'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வரப்போகிறவற்றை” / “வரவிருக்கும் காரியங்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால் ... வரும்போது
  rationale: ὅταν என்பதன் எதிர்கால நோக்குடைய காலப் பொருளை ‘வரும்போது’ இயல்பாகத் தருகிறது; δέ முந்தைய சூழலுடன் உள்ள மென்மையான மாறுபாட்டைக் காட்ட ‘ஆனால்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἔλθῃ ἐκεῖνος
  choice: அவர் ... வரும்போது
  rationale: ἐκεῖνος ஆண்பால் சுட்டுப்பெயராக இருந்து ஆவியானவரைத் தனிப்பட்ட முறையில் சுட்டுகிறது; தமிழில் மரியாதையும் தனிநபர் குறிப்பும் கொண்ட ‘அவர்’ இதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: சத்தியத்தின் ஆவியானவர்
  rationale: யோவான் நூலின் சிறப்புப் பெயரான இந்த உருபுடைத் தொடரை முறையாகப் பாதுகாக்கிறது; ‘ஆவியானவர்’ என்பது சூழலில் பரிசுத்த ஆவியானவரைக் குறிக்கும் தனிப்பட்ட குறிப்பை வெளிப்படுத்துகிறது.
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: முழுச் சத்தியத்திற்குள்ளும் உங்களை வழிநடத்துவார்
  rationale: ὁδηγέωவின் வழிநடத்தும் உருவகத்தையும் ἐν என்பதன் இட/இலக்கு நுணுக்கத்தையும் ‘சத்தியத்திற்குள்ளும்’ தக்கவைக்கிறது. πάσῃ மற்றும் பெயர்ச்சொல்லின் உருபு சேர்ந்து குறிக்கும் முழுமையை ‘முழுச் சத்தியம்’ தெரிவிக்கிறது.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: ஏனெனில், அவர் தம்மிடமிருந்து பேசமாட்டார்
  rationale: ἀφ’ ἑαυτοῦ என்பதன் நேரடியான ‘தம்மிடமிருந்து’ என்ற பொருளைப் பாதுகாத்து, இப்பகுதியில் உள்ள சார்புறவின் இறையியல் பதற்றத்தை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: தாம் கேட்பவற்றையே பேசுவார்
  rationale: ὅσα என்பதன் உள்ளடக்க விரிவை ‘கேட்பவற்றை’ என்றும், ἀλλά கொண்ட எதிர்மறை மாறுபாட்டை தமிழில் இயல்பான ‘-ஏ’ வலியுறுத்தலாலும் தருகிறது. எதிர்காலச் சூழலில் ‘கேட்பவை’ என்பது ἀκούσειயை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ ἐρχόμενα
  choice: வரவிருப்பவை
  rationale: பெயர்ச்சொல்லாக்கப்பட்ட நிகழ்காலப் பங்கேற்பு எதிர்வரும் காரியங்கள் அல்லது நிகழ்வுகளைத் திறந்த நிலையில் குறிக்கிறது; அவை என்னவென்று மேலதிகமாக வரையறுக்கவில்லை.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: உங்களுக்கு அறிவிப்பார்
  rationale: ἀναγγέλλωவின் அறிவித்தல்/தெரிவித்தல் பொருளை நவீன, கண்ணியமான தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ஆவியானவரைக் குறிக்கும் தனிப்பட்ட சுட்டுப்பெயர்
  choice: ‘அவர்’ மற்றும் ‘தாம்’ பயன்படுத்தப்பட்டன
  alternative: ‘அது’ பயன்படுத்துதல் அல்லது ஒவ்வொரு முறையும் ‘ஆவி’ என்று மீண்டும் கூறுதல்
  rationale: πνεῦμα இலக்கண ரீதியாக இடைப்பாலாக இருந்தாலும், ἐκεῖνος ஆண்பால் சுட்டுப்பெயராக உள்ளது. ஆகவே மூல உரையின் தனிப்பட்ட குறிப்பைத் தமிழில் ‘அவர்’ பாதுகாக்கிறது; இது தேவையற்ற கோட்பாட்டு விரிவாக்கமல்ல.
- issue: ἐν τῇ ἀληθείᾳ πάσῃ என்பதன் இட/இலக்கு நுணுக்கம்
  choice: ‘முழுச் சத்தியத்திற்குள்ளும்’
  alternative: ‘முழுச் சத்தியத்தில்’
  rationale: ἐν என்பதன் அடிப்படை இடப்பொருளையும் ὁδηγέωவுடன் வரும் இயக்க நுணுக்கத்தையும் ‘-க்குள்ளும்’ ஒருங்கே தெரிவிக்கிறது. ‘-த்தில்’ என்ற மேலும் முறையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀφ’ ἑαυτοῦ என்பதன் சார்புறவு
  choice: ‘தம்மிடமிருந்து பேசமாட்டார்’
  alternative: ‘தாமாகவே பேசமாட்டார்’ அல்லது ‘தமது சொந்த அதிகாரத்தால் பேசமாட்டார்’
  rationale: நேரடியான மூல வடிவம் பாதுகாக்கப்படுகிறது. ‘சொந்த அதிகாரத்தால்’ என்பது சாத்தியமான விளக்கம் என்றாலும், மூலத்தில் வெளிப்படையாக இல்லாத இறையியல் விளக்கத்தைச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சத்தியம்’, ‘ஆவியானவர்’, ‘வழிநடத்துவார்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன; வாக்கிய அமைப்பு தமிழின் இயல்பான ஓட்டத்திற்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
