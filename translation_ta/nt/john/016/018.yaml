translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் தொடர்நிலை அம்சமும் நேரடிக் கேள்வி வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
