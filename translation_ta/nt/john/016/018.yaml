id: JHN.16.18
reference: John 16:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: ta
  text: ஆகவே, அவர்கள், “‘சிறிது காலம்’ என்று அவர் சொல்வது என்ன? அவர் என்ன சொல்கிறார் என்று நமக்குத் தெரியவில்லை” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கலாம்; தமிழ் தொடர்நிலை வடிவம் அந்த அம்சத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் சீடர்கள் எழுப்பிய குழப்பத்திலிருந்து தொடரும் விளைவு அல்லது தொடர்பைச் சுட்டுகிறது.
- source_word: Τί ἐστιν τοῦτο
  choice: இது என்ன?
  rationale: ‘இதன் பொருள் என்ன?’ என்று விளக்கமாக்காமல், கிரேக்கக் கேள்வியின் நேரடி வடிவத்தையும் சீடர்களின் குழப்பத்தையும் காக்கிறது.
- source_word: ὃ λέγει μικρόν
  choice: அவர் ‘இன்னும் சிறிது காலம்’ என்று சொல்கிறாரே
  rationale: சீடர்கள் இயேசு பயன்படுத்திய சொற்றொடரையே மேற்கோளாகக் கேள்விக்குள்ளாக்குகிறார்கள்; தமிழில் இயல்பான கேள்வித் தொடர்புக்காக ‘சொல்கிறாரே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μικρόν
  choice: இன்னும் சிறிது காலம்
  rationale: இங்கு கால அளவைச் சுட்டும் சுருக்கமான பயன்பாடு. சூழலில் மீண்டும் வரும் காலப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: οὐκ οἴδαμεν
  choice: நமக்குத் தெரியவில்லை
  rationale: οἶδα என்பதன் தற்போதைய அறிவுநிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί λαλεῖ
  choice: அவர் என்ன சொல்கிறார்
  rationale: λαλεῖ என்பதின் பேச்சுச் சார்ந்த அடிப்படை அர்த்தத்தை நேரடியாகக் காக்கிறது; ‘என்ன அர்த்தத்தில் சொல்கிறார்’ என விளக்கமாக்கவில்லை.
