  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: ta
  text: தந்தை எல்லாவற்றையும் இயேசுவின் கைகளில் கொடுத்திருந்ததையும், தாம் தேவனிடமிருந்து வந்ததையும்[a], தாம் தேவனிடம் செல்கிறார் என்பதையும்[b] இயேசு அறிந்திருந்தார்.
