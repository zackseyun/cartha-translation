lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்திருந்தார்
  rationale: இந்தப் பங்கேற்புவினை, அடுத்து வரும் செயலுக்கான பின்னணிச் சூழலைக் குறிக்கிறது. தமிழில் ‘அறிந்திருந்தார்’ என்பது முன்பே நிலைத்திருந்த அறிவையும் உரையின் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மையின் முழுமையான பரப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔδωκεν
  choice: கொடுத்திருந்ததையும்
  rationale: வடிவில் இறந்தகால வினையாக இருந்தாலும், காட்சியில் இயேசு அறிந்திருந்ததற்கு முந்திய நிறைவு பெற்ற செயலைத் தமிழில் இந்த வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς τὰς χεῖρας
  choice: தமது கைகளில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் மூலமொழியின் உருவகத்தைச் சுருக்கி விளக்காமல் அப்படியே காக்கிறது; ‘தமது’ என்பது இயேசுவையே சுட்டுகிறது.
- source_word: ὁ πατὴρ
  choice: தந்தை
  rationale: மூலத்தில் உடைமைப்பெயர் இல்லாமல் பட்டப்பெயராக வரும் ‘தந்தை’ என்பதைக் காக்கிறது.
- source_word: ἀπὸ θεοῦ
  choice: தேவனிடமிருந்து
  rationale: மூலத்தில் ‘தந்தையிடமிருந்து’ அல்ல, ‘தேவனிடமிருந்து’ என்று இருப்பதைத் துல்லியமாகப் பேணுகிறது.
- source_word: ἐξῆλθεν
  choice: வந்ததையும்
  rationale: யோவான் உரையில் தோற்றம் அல்லது அனுப்பப்படுதல் சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘புறப்பட்டு வந்தார்’ என்ற வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸς τὸν θεὸν
  choice: தேவனிடம்
  rationale: இலக்கு அல்லது தேவனுடனான தொடர்பை மிகைப்படுத்தாமல், மூலமொழியின் நேரடியான இயக்கப் பொருளைக் காக்கிறது.
- source_word: ὑπάγει
  choice: செல்கிறதையும்
  rationale: நிகழ்கால வடிவம் சுட்டும் நெருங்கிய புறப்பாட்டை இயல்பாகக் காட்டுகிறது; ‘திரும்பிச் செல்கிறார்’ என்று உரையில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀπὸ θεοῦ ἐξῆλθεν என்பதில் கிறிஸ்துவின் தோற்றம் அல்லது அனுப்பப்படுதல் பற்றிய மொழி
  choice: தாம் தேவனிடமிருந்து வந்ததையும்
  alternative: தாம் தேவனிடமிருந்து புறப்பட்டு வந்ததையும்
  rationale: இயேசுவின் தேவனிடமிருந்தான தோற்றம் அல்லது பணியனுப்புதலின் வலிமையைப் பேணுகிறது; ஆனால் வசனம் வெளிப்படையாகச் சொல்லாத பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: πρὸς τὸν θεὸν ὑπάγει என்பதில் இலக்கு அல்லது திரும்புதல்
  choice: தேவனிடம் செல்கிறதையும்
  alternative: தேவனிடம் திரும்பிச் செல்கிறதையும்
  rationale: சூழலிலிருந்து ‘திரும்பி’ என்ற நுணுக்கத்தை உணர முடிந்தாலும், இந்தக் கிரேக்கச் சொற்றொடர் நேரடியாக ‘தேவனிடம் செல்கிறார்’ என்றே கூறுகிறது. ஆகவே அந்தத் தெளிவின்மை உரையில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாகப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த செயலுக்கான பின்னணியை அமைக்கும் தொடர்வாக்கியமாக இருந்தாலும், தனியாக வாசிக்க ஏற்றவாறு முழுமையான வாக்கியமாக வடிவமைக்கப்பட்டுள்ளது. ‘தமது’ மற்றும் ‘தாம்’ ஆகிய மரியாதைத் தற்சுட்டுப் பெயர்கள் இயேசுவைத் தெளிவாகச் சுட்டுகின்றன.
