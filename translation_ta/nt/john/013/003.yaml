    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தேவனிடம் திரும்பிச் செல்கிறார் என்பதையும்”; கிரேக்க மூலத்தில் நேரடியாக “தேவனிடம் செல்கிறார்” என்றே உள்ளது.
