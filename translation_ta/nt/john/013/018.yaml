source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: ta
  text: '“உங்கள் அனைவரைக் குறித்தும் நான் பேசவில்லை.[a] நான் யாரைத் தேர்ந்தெடுத்தேன் என்பதை அறிவேன். ஆனால், வேதவசனம் நிறைவேறும்படி: ‘என் அப்பத்தை உண்பவன் எனக்கு எதிராகத் தன் குதிகாலை உயர்த்தியிருக்கிறான்.’[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் முறையில்: “உங்கள் எல்லாரையும் பற்றிப் பேசவில்லை.”'
    reason: lexical_alternative
  - marker: b
    text: சங்கீதம் 41:9-இன் மேற்கோள் அல்லது மறைமுகச் சுட்டு.
    reason: cross_reference
  - marker: c
    text: “எனக்கு எதிராகத் தன் குதிகாலைத் தூக்கினான்” என்றும் மொழிபெயர்க்கலாம். இது பகைமையையும் துரோகத்தையும் குறிக்கும் உருவகச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: உங்கள் எல்லாரையும் குறித்து நான் பேசவில்லை
  rationale: περὶ என்பதன் ‘குறித்து’ என்ற பொருளையும் மறுப்பின் எல்லையையும் தெளிவாகக் காத்து, இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: οἶδα
  choice: எனக்குத் தெரியும்
  rationale: வடிவில் நிறைவுக்காலமாக இருந்தாலும், கொய்னே கிரேக்கத்தில் நிகழ்காலப் பொருள் தரும் οἶδα என்பதற்கு இயல்பான தமிழாக்கம்.
- source_word: τίνας ἐξελεξάμην
  choice: நான் யாரைத் தேர்ந்தெடுத்தேன்
  rationale: τίνας என்பதன் நபரைக் குறிக்கும் வினாப் பொருளையும் ἐκλέγομαι என்பதன் ‘தேர்ந்தெடு’ என்ற அடிப்படைப் பொருளையும் காக்கிறது; தேர்ந்தெடுத்ததன் இறையியல் தன்மையை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
- source_word: ἀλλ’ ἵνα
  choice: ஆனால் ... நிறைவேறும்படியாகவே இது நடக்கிறது
  rationale: தமிழில் முழுமையான, இயல்பான வாக்கியத் தொடர்பை உருவாக்குகிறது; நோக்கம் அல்லது விளைவு என்ற இரு சாத்தியங்களையும் மிகையாகத் தீர்மானிக்காமல் நிறைவேற்றக் கூற்றை முன்னிறுத்துகிறது.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: வேதவசனம் நிறைவேறும்படியாக
  rationale: யோவான் நூலில் γραφή புனித எழுத்தைக் குறிப்பதால் ‘வேதவசனம்’ பொருத்தமானது; πληρωθῇ என்பதன் நிறைவேற்றப்படுதல் என்ற கருத்து காக்கப்படுகிறது.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: என் அப்பத்தை உண்பவன்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது; μου என்பதை ἄρτον உடன் இணைத்து ‘என் அப்பம்’ என மொழிபெயர்க்கிறது.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: எனக்கு எதிராகத் தன் குதிகாலை உயர்த்தினான்
  rationale: சங்கீத மேற்கோளின் உடலுறுப்பு உருவகத்தையும் பகைமை மற்றும் துரோகச் சாயலையும் விளக்கவுரையாகத் தட்டையாக்காமல் காக்கிறது.
theological_decisions:
- issue: இயேசு தேர்ந்தெடுத்தவர்களுக்கும் துரோகிக்கும் உள்ள தொடர்பு
  choice: ‘நான் யாரைத் தேர்ந்தெடுத்தேன்’ என்று நேரடியாக மொழிபெயர்த்து, தேர்ந்தெடுத்தல் என்பதன் இறையியல் வகையை வரையறுக்காமல் விடப்பட்டுள்ளது.
  alternative: இது இரட்சிப்புக்கான தேர்ந்தெடுத்தல் என்றோ, அப்போஸ்தலப் பணிக்கான நியமனம் மட்டுமே என்றோ வெளிப்படையாகக் கூறுதல்.
  rationale: வசனம் தேர்ந்தெடுத்தல் என்ற சொல்லைப் பயன்படுத்துகிறது; ஆனால் அதன் இறையியல் எல்லையை இங்கே வரையறுக்கவில்லை. எனவே உரையிலுள்ள பதற்றமும் தெளிவின்மையும் காக்கப்படுகின்றன.
- issue: ἀλλ’ ἵνα என்பதற்கும் துரோகம் மற்றும் வேதவசன நிறைவேற்றத்திற்கும் உள்ள தொடர்பு
  choice: ‘வேதவசனம் நிறைவேறும்படியாகவே இது நடக்கிறது’ என்று வழங்கப்பட்டுள்ளது.
  alternative: துரோகம் நிகழ வேண்டுமென்று வேதவசனம் அதை நிர்ப்பந்தித்ததாக விரிவுபடுத்துதல்.
  rationale: கிரேக்கம் வேதவசன நிறைவேற்றத்தைத் தெளிவாகச் சொல்கிறது; ஆனால் காரணவியல் அல்லது நிர்ணயவாதம் பற்றிய மேலதிக விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம மேற்கோளின் உருவக வலிமையும் காக்கப்பட்டுள்ளன. ‘அப்பம்,’ ‘வேதவசனம்,’ ‘குதிகால்’ போன்ற சொற்கள் பொதுவாகப் புரிந்துகொள்ளக்கூடியவையாகவும் மூலத்தின் உருவகத்தைத் தக்கவைத்தவையாகவும் உள்ளன.
