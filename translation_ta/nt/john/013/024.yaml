translation:
  language: ta
  text: எனவே சீமோன் பேதுரு, அவர் யாரைக் குறித்துப் பேசுகிறார் என்று விசாரிக்கும்படி அந்தச் சீடருக்குச் சைகை செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “எனவே சீமோன் பேதுரு, அவர் யாரைக் குறித்துப் பேசுகிறார்—அவர் யாராக இருக்கக்கூடும் என்று—விசாரிக்கும்படி அந்தச் சீடருக்குச் சைகை செய்கிறார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: சைகை செய்தார்
  rationale: வார்த்தையின்றி உடல் அசைவால் குறிப்புத் தெரிவிப்பதை இச்சொல் குறிக்கிறது. குறிப்பாகத் தலையசைத்தார் என்று தேவையின்றி வரையறுக்காமல், பொதுவான சைகையின் பொருளைப் பாதுகாக்கிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய வசனத்திலிருந்து எழும் நிகழ்வின் தொடர்ச்சியையும் விளைவையும் குறிக்கிறது.
- source_word: τούτῳ
  choice: அந்தச் சீடருக்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சீடரையே சுட்டுகிறது. தமிழில் வெறும் ‘இவருக்கு’ என்பதைவிட, சூழலோடு தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: πυθέσθαι
  choice: கேட்கும்படி
  rationale: பேதுருவின் சைகையின் நோக்கம், அந்தச் சீடர் இயேசுவிடம் விசாரிப்பதாகும்; ‘கேட்கும்படி’ என்பது இயல்பான தமிழில் அதைப் பிரதிபலிக்கிறது.
- source_word: τίς ἂν εἴη
  choice: யாரைக்
  rationale: இச்சொற்றொடர் கேள்விக்குரிய நபரின் அடையாளத்தைத் தெளிவுபடுத்துகிறது. கிரேக்கத்தில் உள்ள தயக்கம்/தீர்மானமின்மை தமிழ்க் கேள்விச் சூழலில் இயல்பாக உட்பொதிந்துள்ளது; ‘யாராக இருக்கக்கூடும்’ என்பது இங்கு கனமாக இருக்கும்.
- source_word: περὶ οὗ
  choice: யாரைக் குறித்து
  rationale: பேச்சின் பொருளாக இருக்கும் நபரைத் தெளிவாகக் குறிக்கிறது; கிரேக்க உறவுப்பெயரின் பொருளையும் காக்கிறது.
- source_word: λέγει
  choice: பேசுகிறார்
  rationale: கிரேக்க நிகழ்காலத்தைத் தக்கவைத்து, அச்சமயத்தில் நடைபெறும் இயேசுவின் பேச்சைக் குறிக்கிறது; தமிழிலும் இயல்பாக உள்ளது.
