id: JHN.13.26
reference: John 13:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “நான் அப்பத்துண்டைத் தோய்த்து யாருக்குக் கொடுப்பேனோ, அவன்தான்.” பின்பு, அப்பத்துண்டைத் தோய்த்து, சீமோன் இஸ்கரியோத்தின் மகனான யூதாசிடம்[a] கொடுத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீமோனின் மகனான யூதாஸ் இஸ்கரியோத்திடம்.” கிரேக்கச் சொற்றொடரை இரு விதமாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: மறுமொழியாக ... என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடையில் வழங்குகிறது; பதிலுரைக்கும் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: Ἐκεῖνός ἐστιν
  choice: அவன்தான்
  rationale: ஒரு நபரை அடையாளம் காட்டும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: நான் அப்பத்துண்டைத் தோய்த்து யாருக்குக் கொடுப்பேனோ
  rationale: எதிர்கால வினைகளையும் தொடர்புப்பெயரின் பெறுநர் பொருளையும் தமிழுக்குரிய யார்...-ஓ அமைப்பில் காக்கிறது.
- source_word: ψωμίον
  choice: அப்பத்துண்டு
  rationale: சிறிய அப்பத்துண்டு அல்லது உணவுத் துண்டு என்ற சூழல்சார் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: βάψας οὖν
  choice: பின்பு, அப்பத்துண்டைத் தோய்த்து
  rationale: முதலில் தோய்த்ததும் அதன்பின் கொடுத்ததும் என்ற செயல்வரிசையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: δίδωσιν
  choice: கொடுத்தார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக மாற்றுகிறது; இயேசுவுக்குரிய மரியாதைப் பன்மையையும் பயன்படுத்துகிறது.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: சீமோன் இஸ்கரியோத்தின் மகனான யூதாசிடம்
  rationale: உடனடியான கிரேக்கச் சொற்றொடர் வரிசைப்படி ‘இஸ்கரியோத்து’ என்பதை சீமோனோடு இணைக்கிறது; மாற்றாக யூதாசோடு இணைக்கும் வாய்ப்பை அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: இறுதிச் சொற்றொடரில் ‘இஸ்கரியோத்து’ யாரைக் குறிக்கிறது
  choice: சீமோன் இஸ்கரியோத்தின் மகனான யூதாஸ்
  alternative: சீமோனின் மகனான யூதாஸ் இஸ்கரியோத்து
  rationale: Σίμωνος Ἰσκαριώτου என்ற தொடரின் உடனடியான இலக்கண அமைப்பு ‘சீமோன் இஸ்கரியோத்து’ எனப் படிக்க இடமளிக்கிறது; ஆனால் பாரம்பரிய அடையாள அமைப்பில் அடைமொழி யூதாசைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம். முதன்மை உரை முதல் வாய்ப்பைப் பின்பற்றி, உண்மையான ஐயத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை உள்ளது. ‘தோய்த்து’ என்பது உணவுத் துண்டைச் சாற்றில் அல்லது கலவையில் அமிழ்த்தும் செயலைக் குறிக்கிறது; சடங்குசார் பொருள் சேர்க்கப்படவில்லை.
