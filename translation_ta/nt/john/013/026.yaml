  terminology: “அப்பத்துண்டு” suitably renders ψωμίον in this context, and “தோய்த்து” properly denotes dipping food without ritual connotations. “யூதாஸ்,” “சீமோன்,” and “இஸ்கரியோத்து” are retained consistently. The footnote preserves the syntactic ambiguity without forcing a traditional interpretation.
