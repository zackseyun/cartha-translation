  verdict: revise
  source_fidelity: The ongoing mutual action in ἔβλεπον εἰς ἀλλήλους is accurately represented by “ஒருவரையொருவர் பார்த்துக்கொண்டிருந்தார்கள்.” The indirect question “யாரைக் குறித்துச் சொல்கிறார்” faithfully conveys περὶ τίνος λέγει, including the Greek present’s immediacy. However, “புரியாமல்” can merely mean ‘not understanding’; ἀπορούμενοι more specifically depicts being perplexed or at a loss.
  naturalness: The sentence is natural modern standard Tamil and has an appropriate narrative register. “குழப்பமடைந்து” is a more exact and still natural expression for their perplexity in this context.
  terminology: “சீடர்கள்” is the established, suitable rendering of οἱ μαθηταί. No theological terminology or interpretive additions are involved.
  issues:
