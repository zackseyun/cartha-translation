  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: ta
  text: யாரைக் குறித்துச் சொல்கிறார் என்று குழப்பமடைந்து, சீடர்கள் ஒருவரையொருவர் பார்த்துக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “யாரைக் குறித்துச் சொல்கிறார் என்று புரியாமல், சீடர்கள் ஒருவரையொருவர் பார்த்துக்கொண்டிருந்தார்கள்.”'
    reason: ἀπορούμενοι என்பது யார் என்று அறிய முடியாமல் திகைத்திருத்தல் அல்லது குழப்பமடைந்திருத்தல் என்ற பொருளைக் கொண்டது; “புரியாமல்” என்பது இயல்பான, சற்றுக் குறைவான வலிமையுள்ள மாற்றாகும்.
lexical_decisions:
- source_word: ἔβλεπον
  choice: பார்த்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால முற்றுப்பெறா வினை வடிவம், அப்போது தொடர்ந்து நடந்த பரஸ்பரப் பார்வையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: சீடர்கள் தங்களுக்குள் பரஸ்பரம் பார்த்ததைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட சீடர் குழுவைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘அவருடைய’ என்பது சேர்க்கப்படவில்லை.
- source_word: ἀπορούμενοι
  choice: புரியாமல்
  rationale: யாரைக் குறித்துச் சொன்னார் என்பதை அறிய முடியாமல் அவர்கள் குழம்பியிருந்த நிலையை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: περὶ τίνος
  choice: யாரைக் குறித்து
  rationale: பேச்சில் குறிப்பிடப்பட்ட நபர் யார் என்ற மறைமுகக் கேள்வியைத் துல்லியமாகக் காட்டுகிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க மூலத்தின் நிகழ்காலத்தைப் பாதுகாக்கிறது; அப்போது இயேசு யாரைக் குறிப்பிடுகிறார் என்ற சீடர்களின் உடனடி ஐயத்தை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
