translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்த்துக்கொண்டிருந்தார்கள்’ என்பது தொடர்ச்சியான செயலைக் காக்கிறது; ‘சொல்கிறார்’ என்பது மூலத்தின் நிகழ்கால வடிவத்தைப் பாதுகாக்கிறது.
