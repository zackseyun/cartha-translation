id: JHN.13.6
reference: John 13:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: ta
  text: அப்போது அவர் சீமோன் பேதுருவிடம் வருகிறார். பேதுரு அவரிடம், “ஆண்டவரே[a], நீரா என் கால்களைக் கழுவுகிறீர்?” என்று கேட்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் மரியாதையான அழைப்பாகவும் பயன்படலாம்; இங்கு “ஆண்டவரே” என்பது முதன்மை மொழிபெயர்ப்பாக வைக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: யோவானின் நிகழ்காலக் கதைநடையின் உயிரோட்டத்தைத் தக்கவைக்க வரலாற்று நிகழ்காலமாக மொழிபெயர்க்கப்பட்டுள்ளது; πρός என்பதன் திசையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: அப்போது
  rationale: இங்கு முடிவுரையைவிடக் கதை நகர்வைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக இணைக்கிறது.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: சீமோன் பேதுருவிடம்
  rationale: πρός + வேற்றுமை இங்கு ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘-ிடம்’ இயல்பான வடிவம்.
- source_word: λέγει αὐτῷ
  choice: பேதுரு அவரிடம் … என்று கேட்கிறான்
  rationale: மேற்கோள் ஒரு கேள்வியாக இருப்பதால் ‘கேட்கிறான்’ இயல்பான தமிழ். கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், உரையின் உள்ளடக்கத்தால் பேசுபவர் பேதுரு என்பது தெளிவு; ‘அவரிடம்’ αὐτῷ என்பதைக் காட்டுகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நோக்கிய மரியாதைமிக்க அழைப்பையும் யோவான் நற்செய்தியில் இருக்கக்கூடிய கிறிஸ்துவியல் ஆழத்தையும் தக்கவைக்கிறது.
- source_word: σύ
  choice: நீரா
  rationale: வெளிப்படையாக வந்துள்ள σύ என்பதன் வலியுறுத்தலை, தமிழில் இயல்பான வினாவடிவமான ‘நீரா’ வெளிப்படுத்துகிறது.
- source_word: μου
  choice: என்
  rationale: கால்களோடு உடைமை உறவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: νίπτεις
  choice: கழுவுகிறீர்
  rationale: உடலின் ஒரு பகுதியைக் கழுவுதல் என்ற νίπτω என்பதன் குறிப்பான பொருளையும் நிகழ்காலச் செயலையும் தக்கவைக்கிறது.
- source_word: τοὺς πόδας
  choice: கால்களை
  rationale: தமிழில் உடைமைச் சொல்லுடன் ‘என் கால்களை’ என்பது இயல்பான அமைப்பு.
theological_decisions:
- issue: பேதுரு இயேசுவை Κύριε என்று அழைப்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: Κύριε மரியாதை அழைப்பாக ‘ஐயா’ என்று பொருள்படக்கூடும். இருப்பினும் ‘ஆண்டவரே’ என்பது அந்த மரியாதையையும் யோவான் நற்செய்தியின் சாத்தியமான கிறிஸ்துவியல் எதிரொலியையும் தீர்மானித்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் வினை மற்றும் சுட்டுப்பெயர்களில் மரியாதை வடிவம் பயன்படுத்தப்பட்டு, பேதுருவின் பேச்சுச் செயலில் சாதாரண மூன்றாம் நபர் வடிவம் வைக்கப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டம் தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
