id: JHN.13.32
reference: John 13:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: ta
  text: கடவுள் அவரில் மகிமைப்படுத்தப்பட்டிருந்தால்[a], கடவுளும் அவரைத் தம்மில்[b] மகிமைப்படுத்துவார்; உடனே அவரை மகிமைப்படுத்துவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள் அவரில் மகிமைப்படுத்தப்பட்டதால்.’ கிரேக்கத்தில் ‘என்றால்’ (εἰ) என்ற நிபந்தனைச் சொல் உள்ளது; ஆனால் சூழலில் அந்த நிபந்தனை உண்மையெனக் கொள்ளப்பட்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘தம்மில்’ என்பதை ‘தம்முடன்’ அல்லது ‘தாமே’ என்றும் புரிந்துகொள்ளலாம்; கிரேக்கத் தொடர் சுருக்கமாகவும் இறையியல் செறிவுடனும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: -ப்பட்டிருந்தால்
  rationale: கிரேக்க நிபந்தனைச் சொல்லான εἰ-ஐ இயல்பான தமிழ் நிபந்தனை விகுதியால் வெளிப்படுத்துகிறது. சூழலில் இது உண்மையெனக் கொள்ளப்பட்ட நிபந்தனையாக இருக்கலாம்; எனினும் ‘ஏனெனில்’ என்று காரணப் பொருளாகத் தீர்மானிக்காமல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐδοξάσθη
  choice: மகிமைப்படுத்தப்பட்டிருந்தால்
  rationale: δοξάζω என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. தொடர்ந்து வரும் எதிர்கால வினையுடன் கால உறவு தமிழில் இயல்பாகத் தெரிய ‘இருந்தால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ἐν என்பதன் அடிப்படை ‘இல்’ பொருளையும் யோவான் நூலின் செறிவான மொழிநடையையும் பாதுகாக்கிறது; ‘அவர் மூலமாக’ என்பது சாத்தியமானாலும் அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: δοξάσει
  choice: மகிமைப்படுத்துவார்
  rationale: எதிர்கால வினையையும் முந்தைய δοξάζω உடனான சொல் தொடர்ச்சியையும் காக்கிறது; ‘கனப்படுத்துவார்’ என்பது இச்சூழலில் பொருளைச் சுருக்கக்கூடும்.
- source_word: ἐν αὑτῷ
  choice: தம்மிலேயே
  rationale: பதிப்பில் உள்ள தற்சுட்டுப் பிரதிப்பெயர் கடவுளையே திரும்பச் சுட்டுவதை மரியாதை ஒருமையுடன் காட்டுகிறது. ‘-லேயே’ கிரேக்கத் தொடரின் செறிவைத் தக்கவைக்கிறது.
- source_word: εὐθύς
  choice: உடனடியாகவே
  rationale: உடன்நிகழும் தன்மையைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது; ‘வே’ வலியுறுத்தலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு ஏற்கெனவே நிகழ்வில் அமையப்பெற்ற உண்மையைப் பேசும் சூழலில் εἰ என்பதன் நிபந்தனை வலிமை
  choice: முதன்மை உரையில் ‘கடவுள் அவரில் மகிமைப்படுத்தப்பட்டிருந்தால்’ என்று நிபந்தனையைத் தக்கவைத்தல்
  alternative: ‘கடவுள் அவரில் மகிமைப்படுத்தப்பட்டிருப்பதால்’
  rationale: சூழல் அந்த நிபந்தனையை உண்மையெனக் கருதுவதாக வலுவாகக் காட்டினாலும், மூலத்தில் வெளிப்படையாக εἰ உள்ளது. நிபந்தனை வடிவத்தைப் பாதுகாப்பது தொடரின் இறையியல் இறுக்கத்தை முன்கூட்டியே தீர்க்காமல் வைக்கிறது; சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν αὑτῷ என்பதன் தொடர்பு மற்றும் செயற்பொருள்
  choice: ‘தம்மிலேயே’ என்று கடவுளைக் குறிக்கும் தற்சுட்டுப் பொருளைப் பாதுகாத்தல்
  alternative: ‘தம்முடன்’ அல்லது ‘தாமே’
  rationale: கிரேக்கத் தற்சுட்டுப் பிரதிப்பெயர் கடவுளைத் திரும்பச் சுட்டுகிறது. ‘தம்மிலேயே’ மூலத்தின் இடவியல் வடிவத்தையும் இறையியல் செறிவையும் காக்கிறது; மற்ற வாசிப்புகள் சாத்தியமான விளக்கங்களாக அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified வேதாகம நடையைப் பேணுகிறது. ‘கடவுள்’ மற்றும் மரியாதை ஒருமையான ‘தம்மிலேயே/மகிமைப்படுத்துவார்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நிபந்தனை, செயலப்பாட்டு வடிவம், δοξάζω சொல்லின் மீளுரைத்தல், ἐν தொடரின் நோக்கமுள்ள தெளிவின்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
