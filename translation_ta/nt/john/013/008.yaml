id: JHN.13.8
reference: John 13:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: ta
  text: பேதுரு அவரிடம், “நீர் ஒருபோதும் என் கால்களைக் கழுவவே மாட்டீர்” என்றார். இயேசு அவருக்குப் பதிலளித்து, “நான் உன்னைக் கழுவாவிட்டால், என்னோடு உனக்குப் பங்கு இல்லை[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு உனக்குப் பகுதி இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: ஒருபோதும் … கழுவக் கூடாது
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும் εἰς τὸν αἰῶνα என்பதன் ‘ஒருபோதும் இல்லை’ என்ற மரபுத்தொடர் வலிமையையும், பேதுருவின் உறுதியான மறுப்பாக இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μου τοὺς πόδας
  choice: என் கால்களை
  rationale: கிரேக்கத்தில் உள்ள நேரடியான உடைமைத் தொடர்பையும் பன்மைச் சொல்லையும் அப்படியே காக்கிறது.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: இயேசு அவருக்குப் பதிலளித்தார்
  rationale: வழக்கமான கதைநடைப் பதிலுரையை இயல்பாகவும் மரியாதைமிக்க நடையிலும் தருகிறது.
- source_word: Ἐὰν μὴ νίψω σε
  choice: நான் உன்னைக் கழுவாவிட்டால்
  rationale: நிபந்தனை அமைப்பையும் ‘உன்னை’ என்று முழு நபரைக் குறிக்கும் பொருளையும் காக்கிறது; முந்தைய ‘கால்கள்’ என்பதை இங்கு தேவையின்றி மீண்டும் சேர்க்கவில்லை.
- source_word: οὐκ ἔχεις μέρος
  choice: உனக்குப் பங்கு இல்லை
  rationale: μέρος என்பதிலுள்ள பங்கு, பங்கேற்பு, உரிமைப் பகுதி ஆகிய அர்த்தச் சாத்தியங்களை ‘பங்கு’ இயல்பாகத் தாங்குகிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: μετά + பிறப்புவேற்றுமையின் இணைவு அல்லது உடனிருப்பு பொருளைக் காக்கிறது; ‘என்னில்’ என்று யோவானின் வேறொரு கருத்தாக்கத்தை இங்கு புகுத்தவில்லை.
theological_decisions:
- issue: இயேசுவோடு μέρος இருப்பதன் பொருள்
  choice: ‘என்னோடு உனக்குப் பங்கு இல்லை’ என்று பரந்த, உறவுசார் பங்கேற்பைக் குறிக்கும் மொழி
  alternative: திருவருட்சாதனச் சுத்திகரிப்பு, தாழ்மையான சேவை, அல்லது இரட்சிப்புக்குரிய சேர்ந்திருத்தல் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இயேசுவின் கழுவுதல் அவசியம் என்று வசனம் தெளிவாகச் சொன்னாலும், அதன் துல்லியமான இறையியல் செயல்முறையை இங்கே வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றமும் பலஅர்த்தத் திறனும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், கண்ணியமான நற்செய்தி உரைநடை பயன்படுத்தப்பட்டுள்ளது. பேதுரு இயேசுவிடம் பேசுவதால் ‘நீர்’ என்ற மரியாதை ஒருமையும், இயேசு பேதுருவிடம் பேசுவதால் மூலத்தின் ஒருமையைத் தெளிவாகக் காட்டும் ‘உன்னை/உனக்கு’ வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன.
