review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Peter's emphatic refusal, the explicit object “my feet,” Jesus' conditional “if I do not wash you,” and the broad relational force of μέρος μετ’ ἐμοῦ. However, “கழுவக் கூடாது” is primarily a deontic prohibition (“must not wash”) in Tamil, whereas Peter's οὐ μή ... εἰς τὸν αἰῶνα is an emphatic declaration/refusal concerning a future action. “கழுவவே மாட்டீர்” more accurately conveys that force.
  naturalness: The narration and honorific address are natural modern standard Tamil. The revised future-negative construction is more idiomatic and preserves the dialogue's force without suggesting that Peter is issuing a moral rule.
  terminology: “பங்கு” appropriately retains the intentionally broad sense of μέρος (“share/part/portion”) without imposing a theological interpretation. For the alternative, “பகுதி” is more natural and current than the Sanskritic/less idiomatic “பாகம்.”
  issues:
  - severity: medium
    issue: “நீர் ஒருபோதும் என் கால்களைக் கழுவக் கூடாது” uses a deontic prohibition.
    rationale: 'This can mean “You must never wash my feet,” while the Greek emphatic οὐ μή with εἰς τὸν αἰῶνα expresses Peter''s forceful refusal/prediction: “You will never wash my feet.” A future-negative form better preserves the source force.'
  - severity: low
    issue: The footnote alternative “பாகம்” is less natural in modern standard Tamil.
    rationale: “பகுதி” supplies a clear lexical alternative for “part” while retaining the same ambiguity as μέρος.
