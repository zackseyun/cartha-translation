revisions:
- from: இனிமுதல், அது நிகழ்வதற்கு முன்பே உங்களிடம் சொல்லுகிறேன்; அது நிகழும்போது, நானே அவர்[a] என்று நீங்கள் நம்புவதற்காகச் சொல்கிறேன்.
  to: இனி முதல், அது நிகழ்வதற்கு முன்பே, அது நிகழும்போது நானே அவர் என்று நீங்கள் நம்பும்படியாக உங்களிடம் சொல்கிறேன்.
  rationale: The revision retains the source’s single present-tense act of speaking and attaches the purpose clause directly to it. It preserves the unspecified event, the future sense of “when it happens,” and the interpretively restrained rendering “நானே அவர்,” with the more literal absolute expression retained in the footnote.
  reviewer_model: gpt-5.6-terra
