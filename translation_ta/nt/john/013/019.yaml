id: JHN.13.19
reference: John 13:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: ta
  text: இனி முதல், அது நிகழ்வதற்கு முன்பே, அது நிகழும்போது நானே அவர் என்று நீங்கள் நம்பும்படியாக உங்களிடம் சொல்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: இனிமுதல்
  rationale: தற்போதைய தருணத்திலிருந்து தொடரும் காலப்பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களிடம் சொல்லுகிறேன்
  rationale: நேரடியாகச் சீடர்களிடம் நிகழ்காலத்தில் கூறுவதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πρὸ τοῦ γενέσθαι
  choice: அது நிகழ்வதற்கு முன்பே
  rationale: πρό உடனான infinitive குறிக்கும் முந்திய காலத்தைப் பாதுகாக்கிறது; ‘அது’ என்பது மூலத்தில் குறிப்பிடப்படாமல் உள்ள நிகழ்வைக் குறிக்கிறது.
- source_word: ἵνα
  choice: நீங்கள் நம்புவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα-வின் பொருளைத் தமிழில் இயல்பான நோக்கத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: πιστεύσητε
  choice: நீங்கள் நம்புவதற்காக
  rationale: πιστεύω என்பதன் வழக்கமான ‘நம்பு’ என்ற பொருளையும் aorist subjunctive-இன் நோக்கச் சூழலையும் பாதுகாக்கிறது.
- source_word: ὅταν γένηται
  choice: அது நிகழும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் காரியத்தைச் சுட்டும் ὅταν + subjunctive அமைப்பை இயல்பாகத் தருகிறது.
- source_word: ὅτι ἐγώ εἰμι
  choice: நானே அவர்
  rationale: வெளிப்படையான பயனிலை இல்லாத கிரேக்கத் தன்னடையாளச் சொல்லை வாசிக்கத்தக்க தமிழில் தருகிறது; அதேவேளையில் ‘நானே’ என்பது வலியுறுத்தலைப் பாதுகாக்கிறது. சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் இறைத் தன்னடையாள மொழியை எதிரொலிக்கக்கூடிய ἐγώ εἰμι என்ற முழுமையான சொற்றொடரை மொழிபெயர்த்தல்
  choice: நானே அவர்
  alternative: நானே இருக்கிறேன்
  rationale: மூலத்தில் வெளிப்படையான பயனிலை இல்லாததால் ஒரு குறிப்பிட்ட பட்டத்தையோ கோட்பாட்டு விளக்கத்தையோ சேர்க்கவில்லை. ‘நானே அவர்’ என்பது தமிழில் புரிந்துகொள்ளத்தக்க தன்னடையாளக் கூற்றாக இருக்கிறது; ‘நானே இருக்கிறேன்’ என்ற சொற்சொல்லான வடிவமும் அதன் சாத்தியமான இறையியல் எதிரொலியும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் முன்னறிவிப்பு–நம்பிக்கை அமைப்பும் ἐγώ εἰμι என்பதிலுள்ள உண்மையான இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
