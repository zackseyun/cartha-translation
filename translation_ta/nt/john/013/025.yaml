  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: ta
  text: அவர்[a] அவ்வாறே இயேசுவின் மார்பில் சாய்ந்துகொண்டு, அவரிடம், “ஆண்டவரே, அது யார்?” என்று கேட்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசுவின் மார்பில் சாய்ந்து படுத்தபடி.’ கிரேக்கச் சொற்றொடர், உணவருந்தும்போது மேசையருகே சாய்ந்து படுத்திருந்த முறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: சாய்ந்துகொண்டு
  rationale: விருந்தின்போது சாய்ந்து படுத்திருந்த நிலையையும், இங்கு இயேசுவின் மார்பை நோக்கிச் சாயும் அசைவையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சீடரையே சுட்டுகிறது; மூலத்தில் இல்லாத ‘சீடர்’ என்பதைச் சேர்க்காமல் சுட்டுப்பெயரின் இயல்பைத் தக்கவைக்கிறது.
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்டிருந்த உணவுப் பந்தி நிலையோடு இந்தச் செயலை இணைக்கிறது.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: இயேசுவின் மார்பில்
  rationale: στῆθος என்பதற்கு இயல்பான தமிழ் ‘மார்பு’; ἐπί உடல் சார்ந்திருக்கும் நிலையை இங்கு ‘மார்பில்’ எனச் சுருக்கமாகக் காட்டுகிறது.
- source_word: λέγει αὐτῷ
  choice: அவரிடம் ... என்று கேட்கிறார்
  rationale: வரலாற்று நிகழ்காலமான λέγει-ஐ நிகழ்காலத்திலேயே தக்கவைக்கிறது; கேள்வி உரை என்பதால் தமிழில் ‘கேட்கிறார்’ இயல்பாக உள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதன் மரியாதையையும் கிறிஸ்துவியல் ஒலிப்பையும் திறந்தவாறு தக்கவைக்கிறது.
- source_word: τίς ἐστιν;
  choice: அது யார்?
  rationale: இயேசு குறிப்பிட்ட நபரின் அடையாளத்தைக் கேட்கும் தமிழின் இயல்பான கேள்வி வடிவம்; கிரேக்கத்தின் பாலினத் தெளிவின்மையையும் தேவையின்றித் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா / குருவே
  rationale: இது மரியாதை அழைப்பாகவும் யோவான் நற்செய்தியின் விரிந்த கிறிஸ்துவியல் பொருளோடும் வாசிக்கப்படலாம்; ‘ஆண்டவரே’ அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. கிரேக்க வரலாற்று நிகழ்காலம் ‘கேட்கிறார்’ எனப் பாதுகாக்கப்பட்டுள்ளது; உணவுப் பந்தியின் சாய்ந்திருக்கும் உடல் நிலை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
