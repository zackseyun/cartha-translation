  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: ta
  text: இரவு உணவு நடந்துகொண்டிருந்தபோது[a], பிசாசு ஏற்கெனவே சீமோனின் மகனான யூதாஸ் இஸ்கரியோத்தின் இதயத்தில் அவரைக் காட்டிக்கொடுக்க[c] வேண்டும் என்ற எண்ணத்தை வைத்திருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரவு உணவு நடைபெற்றுக்கொண்டிருக்கையில்.’ கிரேக்க வாசகம் உணவு ஏற்கெனவே முடிந்துவிட்டதாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஏற்கெனவே தூண்டியிருந்தான்.’ சொல்லுக்குச் சொல், ‘இதயத்தில் ஏற்கெனவே போட்டிருந்தான்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவரை ஒப்படைக்க.’ இச்சூழலில் ‘காட்டிக்கொடுக்க’ என்பது அந்தச் செயலின் துரோகத் தன்மையை வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: இரவு உணவு நடந்துகொண்டிருந்தபோது
  rationale: மரபணுவாக்கியத் தனிநிலை அமைப்பு, உணவு முடிந்துவிட்டதை அல்ல, அது நடந்துகொண்டிருந்த அதே நேரத்தைச் சுட்டுகிறது.
- source_word: διάβολος
  choice: பிசாசு
  rationale: யோவான் நற்செய்தியின் சூழலில் இது தனிப்பட்ட தீயவனைச் சுட்டும் வழக்கமான பட்டப்பெயர்.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: ஏற்கெனவே ... இதயத்தில் ... எண்ணத்தை வைத்திருந்தான்
  rationale: கிரேக்கத்தின் ‘இதயத்தில் போடுதல்’ என்ற உருவகத்தை இயல்பான தமிழில் காத்து, முன்பே நிகழ்ந்த செயலை ‘ஏற்கெனவே ... வைத்திருந்தான்’ என வெளிப்படுத்துகிறது.
- source_word: καρδίαν
  choice: இதயம்
  rationale: உணர்ச்சியை மட்டும் அல்லாமல் எண்ணம், மனவுறுதி, நோக்கம் ஆகியவற்றையும் உள்ளடக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἵνα παραδοῖ
  choice: காட்டிக்கொடுக்க வேண்டும்
  rationale: யூதாஸ் குறித்த இச்சூழலில் παραδίδωμι என்பது ஒருவரை எதிரிகளிடம் ஒப்படைப்பதன் துரோகத் தன்மையை உணர்த்துகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இச்சுட்டுப்பெயர் இயேசுவைக் குறிக்கிறது; தமிழில் அவருக்குரிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: சீமோனின் மகனான யூதாஸ் இஸ்கரியோத்து
  rationale: பெயர்த் தொடரைத் தெளிவாக அமைத்து, ‘இஸ்கரியோத்து’ என்பது யூதாஸை அடையாளப்படுத்துவதாகக் காட்டுகிறது; அது சீமோனைச் சுட்டுவதாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: யூதாஸின் துரோகத்தில் செயலாற்றும் பொறுப்பு
  choice: பிசாசு யூதாஸின் இதயத்தில் அந்த எண்ணத்தை வைத்ததாகவும், யூதாஸ் இயேசுவைக் காட்டிக்கொடுப்பவனாகவும் உரை கூறுகிறது.
  alternative: பிசாசு யூதாஸை ஏற்கெனவே தூண்டியிருந்தான்.
  rationale: கிரேக்கம் பிசாசின் தாக்கத்தையும் யூதாஸின் செயலையும் ஒன்றாக முன்வைக்கிறது. தீர்மானவாதம் அல்லது முழுமையான வெளிப்புறக் கட்டுப்பாடு குறித்த கேள்வியை மொழிபெயர்ப்பு தீர்த்து வைக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. ‘இதயம்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; ‘எண்ணத்தை வைத்திருந்தான்’ என்பது தமிழில் பொருள் தெளிவுக்காகச் சேர்க்கப்பட்ட இயல்பான நிறைவு. அடிக்குறி குறிகள் அனைத்தும் தொடர்புடைய சொற்றொடர்களின் அருகில் வைக்கப்பட்டுள்ளன.
