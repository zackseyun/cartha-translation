reference: John 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: ta
  text: ஆகவே, அவர் அவர்களுடைய கால்களைக் கழுவி, தமது ஆடைகளை எடுத்துக்கொண்டு, உணவுப் பந்தியில் மீண்டும் சாய்ந்து அமர்ந்தபின்[a], அவர்களிடம், “நான் உங்களுக்குச் செய்தது என்னவென்று புரிந்துகொள்கிறீர்களா[b]?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் அமர்ந்தபின்”; இங்குள்ள கிரேக்க வினை உணவுப் பந்தியில் சாய்ந்து அமர்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நான் உங்களுக்குச் செய்தது” என்பதை, “நான் உங்களிடம் செய்தது” என்றும் புரிந்துகொள்ளலாம்; கிரேக்க வேற்றுமை இரு பொருள்களுக்கும் இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: ஆகவே, ... பின்
  rationale: Ὅτε என்பதன் காலத் தொடர்பையும் οὖν என்பதன் கதைத் தொடர்ச்சி/விளைவு உணர்வையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: அவர்களுடைய கால்களைக் கழுவி
  rationale: வினையின் நிறைவுற்ற செயலும் உடைமைத் தொடர்பும் தமிழில் நேரடியாகவும் இயல்பாகவும் தரப்படுகின்றன.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: தமது ஆடைகளை எடுத்துக்கொண்டு
  rationale: ἔλαβεν என்பதன் அடிப்படைப் பொருளான ‘எடுத்தார்’ என்பதைக் காக்கிறது; ‘அணிந்துகொண்டு’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை. தமது என்பது இயேசுவையே திரும்பச் சுட்டுகிறது.
- source_word: καὶ ἀνέπεσεν
  choice: மீண்டும் பந்தியில் சாய்ந்தமர்ந்தபின்
  rationale: உணவு வேளையில் மேசை/பந்தியருகே சாய்ந்து அமரும் பழங்கால வழக்கை ἀναπίπτω குறிக்கிறது. தமிழில் வெறும் ‘அமர்ந்தார்’ என்பதைவிட வரலாற்றுப் படிமத்தைத் தெளிவாகக் காக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்னிருந்த இடத்திற்கோ நிலையிற்கோ திரும்பியதை நேரடியாகக் காட்டுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... என்று கேட்டார்
  rationale: கிரேக்கத்தில் ‘அவர்களிடம் சொன்னார்’ என்றாலும் நேரடி உரை கேள்வியாக இருப்பதால் தமிழில் ‘கேட்டார்’ என்பது இயல்பான உரையாடல் வடிவம்; உரையின் வலிமை மாறவில்லை.
- source_word: Γινώσκετε
  choice: புரிந்துகொள்கிறீர்களா
  rationale: இங்கு செயலை அறிந்திருக்கிறார்களா என்பது மட்டுமல்ல, அதன் பொருளை உணர்கிறார்களா என்பதே கேள்வி; எனவே ‘புரிந்துகொள்கிறீர்களா’ சூழல்சார் பொருளைத் தருகிறது.
- source_word: τί πεποίηκα ὑμῖν
  choice: நான் உங்களுக்குச் செய்தது என்னவென்று
  rationale: πεποίηκα-வின் முடிந்த செயலுக்கு தற்போதும் உள்ள முக்கியத்துவம் தமிழ்ச் சூழலில் இயல்பாக வெளிப்படுகிறது. ὑμῖν என்பதற்கு இங்கு நன்மைநோக்குப் பொருளில் ‘உங்களுக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கால்களைக் கழுவிய பின் இயேசு எடுத்த உணவுப்பந்தி நிலை
  choice: மீண்டும் பந்தியில் சாய்ந்தமர்ந்தபின்
  alternative: மீண்டும் அமர்ந்தபின்; மீண்டும் பந்தியில் தமது இடத்தை ஏற்றபின்
  rationale: ἀνέπεσεν பழங்கால உணவு முறையில் சாய்ந்தமர்வதைக் குறிக்கிறது. இது கோட்பாட்டுச் சேர்க்கையின்றி வரலாற்று-பண்பாட்டு படிமத்தைக் காக்கிறது.
- issue: τί πεποίηκα ὑμῖν என்பதில் ὑμῖν-இன் பொருள்
  choice: நான் உங்களுக்குச் செய்தது
  alternative: நான் உங்களிடம் செய்தது
  rationale: கிரேக்க வேற்றுமை நன்மைநோக்காகவும் தொடர்புடைய நபர்களைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படலாம். பணிவிடைச் சூழலில் ‘உங்களுக்கு’ இயல்பாகப் பொருந்துகிறது; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும், ஆனால் கண்ணியமான வேதாகம நடையைக் கொண்டது. ‘பந்தியில் சாய்ந்தமர்ந்த’ என்பது பழங்கால உணவு முறையைச் சுருக்கமாக விளக்குகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
