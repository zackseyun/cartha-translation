id: JHN.13.15
reference: John 13:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: ta
  text: ஏனெனில், நான் உங்களுக்குச் செய்ததுபோல நீங்களும் செய்யும்படி உங்களுக்கு ஒரு முன்மாதிரியைக்[a] கொடுத்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பின்பற்றத்தக்க எடுத்துக்காட்டு’ அல்லது ‘மாதிரி’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: முன்மாதிரி
  rationale: பின்பற்றுவதற்காகக் கொடுக்கப்படும் எடுத்துக்காட்டு அல்லது மாதிரி என்பதைக் குறிக்கிறது. இச்சூழலில் இயேசுவின் செயலைப் பின்பற்ற வேண்டிய தன்மையை ‘முன்மாதிரி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் இயேசு கூறிய போதனைக்கு இவ்வசனம் விளக்கம் அளிப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔδωκα
  choice: கொடுத்தேன்
  rationale: கிரேக்க இறந்தகால வினைவடிவை நேரடியாகப் பிரதிபலிக்கிறது; அந்தச் செயலின் தொடரும் பொருத்தம் சூழலிலேயே தெளிவாகிறது.
- source_word: ἵνα
  choice: செய்யும்படி
  rationale: சீடர்கள் தாம் செய்ததற்கு ஒத்தவாறு செயல்பட வேண்டும் என்ற நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καθὼς
  choice: செய்ததுபோல
  rationale: இயேசுவின் செயலுக்கும் சீடர்களின் செயலுக்கும் இடையிலான ஒப்புமையைத் தெளிவாகப் பேணுகிறது.
- source_word: ἐποίησα ὑμῖν
  choice: நான் உங்களுக்குச் செய்தது
  rationale: ὑμῖν என்ற வேற்றுமை வடிவத்தை ‘உங்களுக்கு’ எனப் பிரதிபலிக்கிறது; இதனால் தமிழில் இயல்பாகவும், செயல் அவர்களை நோக்கியது அல்லது அவர்களுக்காக அமைந்தது என்ற மூலத்தின் பரப்பை மிகையாகக் குறுக்காமலும் உள்ளது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: இயேசுவோடு ஒத்த வகையில் சீடர்களும் செயல்பட வேண்டும் என்ற சேர்க்கை வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ποιῆτε
  choice: செய்யும்படி
  rationale: ἵνα உடன் வரும் நோக்கவியல் சார்ந்த வினை வடிவத்தைப் பேணுகிறது; நேரடி கட்டளையாக மாற்றாமல் எதிர்பார்க்கப்படும் செயலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் செயலைச் சீடர்கள் பின்பற்ற வேண்டிய விதம்
  choice: இயேசு செய்த செயலை சீடர்கள் ஒத்த முறையில் பின்பற்றுவதற்கான முன்மாதிரியாக உரை கூறுகிறது.
  alternative: இது எல்லாச் சூழல்களிலும் கட்டாயமான பாதக்கழுவும் சடங்கு என்றோ, எந்தக் குறிப்பிட்ட செயல்வடிவமும் இல்லாத வெறும் குறியீடு என்றோ மொழிபெயர்ப்பிலேயே தீர்மானித்தல்.
  rationale: வசனம் பின்பற்றுதலைத் தெளிவாகக் கோருகிறது; ஆனால் அந்தப் பின்பற்றுதல் எப்போதும் சடங்காகவே அமைய வேண்டுமா என்ற சமயப்பிரிவு சார்ந்த முடிவை உரை இங்கே வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை. ‘முன்மாதிரி’ என்பது சாதாரண வாசகருக்குப் புரியக்கூடியதோடு பின்பற்றத்தக்க மாதிரி என்ற பொருளையும் தருகிறது. கிரேக்கச் சொல் வரிசையை அப்படியே நகலெடுக்காமல், நோக்கவியல் உட்பிரிவை இயல்பான தமிழ்ச் சொல்லமைப்பில் முன்வைக்கிறது.
