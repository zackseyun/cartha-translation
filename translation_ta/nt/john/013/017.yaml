  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: ta
  text: இவற்றை நீங்கள் அறிந்திருக்கிறீர்கள் என்றால், அவற்றைச் செய்தால் நீங்கள் பேறுபெற்றவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகிழ்ச்சியுள்ளவர்கள்’ அல்லது ‘நற்பேறு பெற்றவர்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல், வெறுமனே மகிழ்ச்சியாக உணர்வதை அல்லாமல், நன்மை நிறைந்த சாதகமான நிலையில் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: நிபந்தனையை அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், கிரேக்க வாக்கிய அமைப்பை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: இயேசு முன்பு காட்டிய முன்மாதிரியையும் போதித்தவற்றையும் குறிக்கும் நடுநிலைப் பன்மையைத் தக்கவைக்கிறது.
- source_word: οἴδατε
  choice: நீங்கள் அறிந்திருக்கிறீர்கள்
  rationale: οἶδα அறிவதையோ உணர்ந்திருப்பதையோ குறிக்கிறது; ‘புரிந்துகொண்டிருக்கிறீர்கள்’ என்று பொருளை விரிவாக்காமல், நிகழ்கால அறிவுநிலையை வெளிப்படுத்துகிறது.
- source_word: μακάριοί
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனமகிழ்ச்சியை அல்லாமல், நன்மையும் அருளும் நிறைந்த சாதகமான நிலையில் இருப்பதைக் குறிக்கிறது; பழமையான அல்லது பாலினக் குறியீடுள்ள சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: ἐὰν
  choice: செய்தால்
  rationale: ποιῆτε என்பதுடன் இணைந்து செயல்பாட்டைச் சார்ந்த நிபந்தனையைக் காட்டுகிறது; தமிழில் வினையுடன் சேர்ந்த நிபந்தனை விகுதி இயல்பானது.
- source_word: ποιῆτε αὐτά
  choice: அவற்றைச் செய்தால்
  rationale: அறிந்தவற்றை நடைமுறையில் செய்வதைச் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது; ‘கடைப்பிடித்தால்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: சீடத்துவச் சூழலில் μακάριοι என்பதன் மொழிபெயர்ப்பு
  choice: பேறுபெற்றவர்கள்
  alternative: மகிழ்ச்சியுள்ளவர்கள்; நற்பேறு பெற்றவர்கள்; ஆசீர்பெற்றவர்கள்
  rationale: அறிவதோடு நிற்காமல் செய்கிறவர்களின் சாதகமான, செழிப்பான நிலையை இந்தச் சொல் குறிக்கிறது. ‘மகிழ்ச்சியுள்ளவர்கள்’ என்பது இதை உணர்ச்சியாக மட்டும் சுருக்கக்கூடும்; ‘ஆசீர்பெற்றவர்கள்’ என்பது கிரேக்கத்தில் வெளிப்படையாகக் கூறப்படாத செய்பவரை மறைமுகமாகச் சேர்க்கக்கூடும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள இரு நிபந்தனைகளும் தக்கவைக்கப்பட்டுள்ளன; ‘அறிதல்’ மற்றும் ‘செய்தல்’ ஆகியவற்றுக்கிடையிலான இறையியல் அழுத்தம் விளக்கமாகத் தீர்த்துவைக்கப்படவில்லை.
