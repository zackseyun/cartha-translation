  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: ta
  text: ஏனெனில், தம்மைக் காட்டிக்கொடுக்கிறவனை[a] அவர் அறிந்திருந்தார்; அதனால்தான், “நீங்கள் எல்லாரும் சுத்தமானவர்கள் அல்ல” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காட்டிக்கொடுக்கிறவன்” என்பதற்குச் சொல்லுக்கு இன்னும் நெருக்கமாக, “அவரை ஒப்படைக்கிறவன்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் இது யூதாசின் துரோகச் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: அறிந்திருந்தார்
  rationale: இயேசுவுக்கு ஏற்கெனவே இருந்து வந்த அறிவைத் தமிழ் இறந்தகாலக் கதைநடையில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: தம்மைக் காட்டிக்கொடுக்கிறவனை
  rationale: παραδίδωμι என்பதன் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’ என்றாலும், இச்சூழலில் துரோகமாக அதிகாரிகளிடம் காட்டிக்கொடுப்பதைக் குறிக்கிறது; நிகழ்நிலைப் பங்கேற்பெச்சத்தின் தன்மையையும் இவ்வடிவம் காக்கிறது.
- source_word: διὰ τοῦτο
  choice: அதனால்தான்
  rationale: அவருடைய அறிவுக்கும் அவர் கூறிய வார்த்தைக்கும் இடையிலான காரணத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶπεν ὅτι
  choice: என்று சொன்னார்
  rationale: ὅτι அறிமுகப்படுத்தும் நேரடிக் கூற்றைத் தமிழின் இயல்பான மேற்கோள் அமைப்பால் தருகிறது.
- source_word: Οὐχὶ πάντες
  choice: எல்லாரும் ... அல்ல
  rationale: முழுக் குழுவையும் மறுப்பதல்ல, குழுவிலுள்ள அனைவருக்கும் அந்த நிலை பொருந்தாது என்பதைக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: καθαροί
  choice: சுத்தமானவர்கள்
  rationale: கால்கழுவும் உடல்சார் படிமத்தையும் உள்ளார்ந்த அல்லது ஆன்மிக நிலையையும் ஒருசேர ஒலிக்கவிடுகிறது; ‘தூயவர்கள்’ என மொழிபெயர்த்து பொருளை முற்றிலும் அறநெறிசார் திசையில் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἐστε
  choice: நீங்கள் ... சுத்தமானவர்கள்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்கால நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: παραδιδόντα என்பது யூதாசின் செயலுடன் கொண்டுள்ள பொருள்
  choice: காட்டிக்கொடுக்கிறவனை
  alternative: ஒப்படைக்கிறவனை
  rationale: ‘ஒப்படைத்தல்’ என்பது சொல்லுக்கு நெருக்கமான மாற்றாக இருந்தாலும், யோவானின் பாடுகளின் கதைச்சூழலில் துரோகமாக இயேசுவை அதிகாரிகளிடம் காட்டிக்கொடுக்கும் செயல் குறிக்கப்படுகிறது. தேர்ந்த சொல் சூழற்பொருளைத் தெளிவாக்குகிறது; அடிப்படைச் சொல்லாக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: கால்கழுவும் உரையாடலில் καθαροί என்பதன் பொருள்
  choice: சுத்தமானவர்கள்
  alternative: தூயவர்கள்
  rationale: ‘சுத்தம்’ என்பது கழுவுதலின் நேரடிப் படிமத்தையும் ஆன்மிக அல்லது உள்ளார்ந்த நிலையையும் காக்கிறது; வசனத்தின் இரட்டைப் பொருள் அழுத்தத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘அதனால்தான்’ இயல்பான காரணத் தொடர்பை வழங்குகிறது. அடிக்குறி [a] பிரதான உரையில் இடம்பெற்றுள்ளது; அது தொடர்புடைய ‘காட்டிக்கொடுக்கிறவனை’ என்பதற்குப் பின் அல்லாமல் வாக்கிய முடிவில் வைக்கப்பட்டாலும் முழுக் கூற்றின் சொல் விளக்கமாக தெளிவாகச் செயல்படுகிறது.
