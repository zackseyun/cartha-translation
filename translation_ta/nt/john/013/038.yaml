id: JHN.13.38
reference: John 13:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “எனக்காக உன் உயிரைக் கொடுப்பாயா? உண்மையாகவே, உண்மையாகவே உனக்குச் சொல்கிறேன்: நீ என்னை மூன்று முறை மறுதலிக்கும்வரை சேவல் கூவவே கூவாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: பதிலளித்தார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடை இறந்தகாலத்தில் வழங்குகிறது.
- source_word: ψυχήν
  choice: உயிரை
  rationale: τίθημι τὴν ψυχήν என்ற சொற்றொடர் இங்கு ஒருவருக்காக உயிரைக் கொடுப்பதைக் குறிக்கிறது; ‘ஆத்துமா’ என்ற குறுகிய மானுடவியல் பொருளைத் திணிக்கவில்லை.
- source_word: ὑπὲρ ἐμοῦ
  choice: எனக்காக
  rationale: பிரதிநிதித்துவம் அல்லது நன்மைக்காக என்ற ὑπέρ சொல்லின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: θήσεις
  choice: கொடுப்பாயா
  rationale: உயிருடன் சேரும் τίθημι என்பதன் வழக்குச் சொற்றொடர்ப் பொருள் ‘உயிரைக் கொடுத்தல்’; சொற்பொருளான ‘வைப்பாயா’ தமிழில் இயல்பாகாது.
- source_word: ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: யோவான் நற்செய்தியில் இயேசுவுக்கே உரிய வலியுறுத்தும் இரட்டிப்பு வடிவத்தைத் தெளிவான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: οὐ μὴ
  choice: கூவவே கூவாது
  rationale: οὐ μή என்பதன் மிக வலுவான மறுப்பைத் தமிழ் வினைமீட்சி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀλέκτωρ
  choice: சேவல்
  rationale: நவீனத் தமிழில் ஆண் கோழியைக் குறிக்கும் பொதுவான, தெளிவான சொல்.
- source_word: φωνήσῃ
  choice: கூவாது
  rationale: சேவலின் ஒலியைத் தமிழில் இயல்பாகக் குறிக்கும் வினைச்சொல் ‘கூவு’.
- source_word: ἕως οὗ
  choice: வரை
  rationale: மறுக்கப்பட்ட செயல் நிகழாதிருக்கும் கால எல்லையை நேரடியாகக் குறிக்கிறது.
- source_word: ἀρνήσῃ με
  choice: நீ என்னை ... மறுதலிக்கும்வரை
  rationale: ἀρνέομαι என்பது ஒருவரை அறிந்திருப்பதையோ அவருடனான உறவையோ மறுப்பதை இங்கு குறிக்கிறது; ‘மறுதலித்தல்’ அந்தத் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: τρίς
  choice: மூன்று முறை
  rationale: எண்ணிக்கையை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: சீடத்துவம் மற்றும் தன்னலமற்ற பலி என்ற சூழலில் ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: பேதுரு இயேசுவுக்காக இறக்கத் தயார் எனக் கூறிய சூழல் இது. ஆகவே ‘உயிர்’ என்பது konkreட் பலிப்பொருளைப் பாதுகாத்து, மூலத்தில் கட்டாயமில்லாத உடலற்ற ஆத்துமா குறித்த தனிப்பட்ட கோட்பாட்டைத் திணிக்காமல் இருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் கதைநடை இயல்பும் பேணப்பட்டுள்ளன. இயேசுவின் வினாவில் உள்ள கண்டனத் தொனியும், இரட்டித்த உறுதிமொழியும், οὐ μή என்பதன் வலுவான மறுப்பும் தெளிவாக வைக்கப்பட்டுள்ளன.
