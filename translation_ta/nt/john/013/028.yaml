lexical_decisions:
- source_word: τοῦτο
  choice: இதை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட இயேசுவின் சொல்லைச் சுட்டுகிறது; கிரேக்கச் சுட்டுப்பெயரின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் மென்மையான முரண்பாட்டை ஏற்படுத்தி, பந்தியில் இருந்தவர்கள் புரிந்துகொள்ளாததை எடுத்துக்காட்டுகிறது.
- source_word: οὐδεὶς
  choice: ஒருவருக்கும் … தெரியவில்லை
  rationale: முழுமையான மறுப்பைத் தமிழின் இயல்பான எதிர்மறை வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἔγνω
  choice: தெரியவில்லை
  rationale: இங்கு குறிப்பிட்ட சொல்லின் நோக்கத்தை அவர்கள் அறியவில்லை அல்லது புரிந்துகொள்ளவில்லை என்பதைக் குறிக்கிறது; இரண்டையும் தீர்மானிக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἀνακειμένων
  choice: உணவுப் பந்தியில் சாய்ந்திருந்தவர்களில்
  rationale: முதல் நூற்றாண்டில் உணவருந்தும்போது சாய்ந்திருந்த வழக்கைத் துல்லியமாகக் காட்டுகிறது; ‘உணவுப் பந்தியில்’ என்பது சூழலை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: πρὸς τί
  choice: எதற்காக
  rationale: காரணம் அல்லது நோக்கம் ஆகிய இரண்டையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ்ச் சொல்; கிரேக்கத்தின் சாத்தியமான நுணுக்கத்தைத் திறந்தே வைக்கிறது.
- source_word: εἶπεν αὐτῷ
  choice: அவர் இதை அவனிடம் … சொன்னார்
  rationale: சொன்னவர் மற்றும் சொல்லப்பட்டவர் ஆகிய இருவரையும் மூலத்தின் சுட்டுப்பெயர்களைப் போலவே பெயரிட்டு விளக்காமல் வைத்திருக்கிறது; தமிழில் அவர்களைத் தெளிவாக வேறுபடுத்த மரியாதை ஒருமையும் சாதாரண ஒருமையும் பயன்படுத்தப்பட்டுள்ளன.
