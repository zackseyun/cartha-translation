id: JHN.13.10
reference: John 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: ta
  text: இயேசு அவனிடம்[a], “குளித்தவனுக்குத் தன் கால்களைக் கழுவுவதைத் தவிர வேறு எதுவும் தேவையில்லை; அவன் முற்றிலும் சுத்தமாக இருக்கிறான். நீங்களும் சுத்தமாக இருக்கிறீர்கள்; ஆனால் உங்களில் அனைவரும் சுத்தமாக இல்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் கழுவுதலைக் குறிக்க இரண்டு வெவ்வேறு வினைச்சொற்கள் உள்ளன: λούω என்பது பொதுவாக முழு உடலையும் குளித்தல் அல்லது கழுவுதலைக் குறிக்கிறது; νίπτω என்பது கால்கள் போன்ற உடலின் ஒரு பகுதியைக் கழுவுதலைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: குளித்தவன்
  rationale: λελουμένος என்பது λούω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம்; முழு உடலைக் குளிப்பாட்டியதால் ஏற்பட்டிருக்கும் நிலையைக் குறிக்கிறது. ‘குளித்தவன்’ என்பது நிறைவு பெற்ற செயலையும் தொடரும் நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔχει χρείαν
  choice: வேறொன்றும் தேவையில்லை
  rationale: ἔχει χρείαν என்ற மரபுத்தொடரின் இயல்பான தமிழ் வடிவம் ‘தேவையில்லை.’ εἰ μὴ கூறும் ஒரே விதிவிலக்குடன் இவ்வாக்கியம் தெளிவாக அமைய ‘வேறொன்றும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: முந்திய மறுப்புக்கு ஒரே விதிவிலக்கை அறிமுகப்படுத்தும் εἰ μὴ என்பதற்கு இச்சூழலில் ‘தவிர’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: τοὺς πόδας νίψασθαι
  choice: தன் கால்களைக் கழுவுவதை
  rationale: νίπτω பொதுவாக உடலின் ஒரு பகுதியைக் கழுவுவதைக் குறிக்கிறது. ‘தன்’ என்பது ஒருமை எழுவாயுடனான தொடர்பைத் தமிழில் தெளிவாக்குகிறது; ‘கழுவு’ என்பது λούω-க்கு பயன்படுத்திய ‘குளி’ என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: καθαρὸς ὅλος
  choice: உடல் முழுவதும் சுத்தமாக
  rationale: ὅλος முழுமையை வலியுறுத்துகிறது. குளிக்கும் உருவகத்தின் உடல்சார்ந்த தளத்தைத் தெளிவாக்கும் வகையில் ‘உடல் முழுவதும்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘சுத்தம்’ என்பது இதன் உடல்சார்ந்த மற்றும் ஆவிக்குரிய உட்பொருள் இரண்டையும் திறந்தவையாக வைத்திருக்கிறது.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: நீங்களும் சுத்தமாக இருக்கிறீர்கள்
  rationale: பன்மை முன்னிலையைப் பாதுகாத்து, முன்வந்த καθαρός என்ற சொல்லை அதே ‘சுத்தம்’ என்ற சொல்லால் மீண்டும் வழங்குகிறது.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: ஆனால் உங்களில் எல்லாரும் அல்ல
  rationale: சீடர்களின் குழுவுக்குள் உள்ள விதிவிலக்கைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: λέγει வரலாற்று நிகழ்காலமாக இருந்தாலும், நவீன தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பானது. αὐτῷ என்பதன் ஒருமை ‘அவனிடம்’ என்று பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: நேரடியான கழுவுதல் உருவகமும் ஆவிக்குரிய சுத்தமும்
  choice: ‘குளித்தவன்,’ ‘கால்களைக் கழுவுதல்,’ ‘சுத்தம்’ என்ற உருவகச் சொற்களை விளக்க விரிவாக்கமின்றிப் பாதுகாத்தல்
  alternative: ‘ஆவிக்குரிய விதத்தில் சுத்தமானவர்’ என்று விளக்கிச் சேர்த்தல் அல்லது λούω, νίπτω இரண்டையும் ஒரே ‘கழுவு’ என்ற சொல்லால் மொழிபெயர்த்தல்
  rationale: வசனம் நேரடியான உடல் கழுவுதலையும் குறியீட்டு ஆவிக்குரிய சுத்தத்தையும் ஒரே நேரத்தில் செயல்படுத்துகிறது. மொழிபெயர்ப்பு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்காமல் அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ஆண்பால் ஒருமை வினையெச்சத்தின் பொதுவான பயன்பாடு
  choice: குளித்தவன்
  alternative: குளித்த ஒருவர்
  rationale: கிரேக்க வினையெச்சம் இலக்கணப்படி ஆண்பால் ஒருமையில் இருந்தாலும் பொதுவான கூற்றாகச் செயல்படுகிறது. தமிழில் ‘குளித்தவன்’ ஒருமையை நெருக்கமாகப் பாதுகாக்கிறது; இங்கு இயேசு பேதுருவுடன் பேசும் உடனடிச் சூழலும் இதற்கு ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குளி/கழுவு’ என்ற சொல் வேறுபாடு மூலத்தின் முக்கியமான சொற்பொருள் வேறுபாட்டைப் பாதுகாக்கிறது. வசனத்தின் உடல்சார்ந்த உருவகமும் மறைமுகமான ஆவிக்குரிய பொருளும் விளக்கத்தால் தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளன.
