  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: ta
  text: இயேசு அன்புகூர்ந்த அவருடைய சீடர்களில் ஒருவர் இயேசுவின் மார்பருகே[a] சாய்ந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘இயேசுவின் மார்பில்.’ விருந்தின்போது ஒருவர் மற்றொருவருக்கு அருகில் சாய்ந்திருந்த நிலையை விவரிக்கும் சொற்றொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: சாய்ந்து அமர்ந்திருந்தார்
  rationale: பண்டைய விருந்துகளில் உணவருந்திய சாய்ந்திருக்கும் உடல் நிலையை இயல்பான நவீனத் தமிழில் குறிக்கிறது; வெறுமனே ‘அமர்ந்திருந்தார்’ என்பதைக் காட்டிலும் வரலாற்றுக் காட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் ஒருவர்
  rationale: கிரேக்கத்தின் பகுதிப்பொருள் அமைப்பைத் துல்லியமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: இயேசுவின் மார்பருகே
  rationale: κόλπος என்பதன் மார்பு சார்ந்த படிமத்தைப் பாதுகாத்தபடியே, விருந்தில் இயேசுவுக்கு மிக அருகில் சாய்ந்திருந்த இடநிலையைத் தமிழில் தவறான உடல்நெருக்கக் கருத்து தோன்றாதவாறு தெரிவிக்கிறது.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: இயேசு அன்புகூர்ந்த
  rationale: ἀγαπάω என்பதன் அடிப்படைப் பொருளான அன்பை நேரடியாகக் காக்கிறது; தொடர்புத் தொடரைத் தமிழின் இயல்பான பெயரெச்ச வடிவில் தருகிறது.
theological_decisions:
- issue: இயேசுவுக்கும் அன்புக்குரிய சீடருக்கும் இடையிலான விருந்து இருக்கைநிலையை மொழிபெயர்த்தல்
  choice: மார்பருகே
  alternative: மார்பில்; அருகில்
  rationale: இச்சொற்றொடர் முதன்மையாக விருந்தின்போது அவர்கள் சாய்ந்திருந்த இடநிலையை விவரிக்கிறது. ‘மார்பருகே’ என்பது மூலத்தின் மார்பு படிமத்தையும் நெருக்கத்தையும் காக்கிறது; அதேவேளை ‘மார்பில்’ என்பதால் நவீன வாசகருக்கு ஏற்படக்கூடிய தவறான காட்சியைத் தவிர்க்கிறது. சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. பண்டைய விருந்து உடல் நிலையை விளக்க ‘சாய்ந்து அமர்ந்திருந்தார்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் κόλπος படிமம் ‘மார்பருகே’ என்றும் அடிக்குறிப்பிலுள்ள சொற்சொல் வடிவத்தாலும் பாதுகாக்கப்பட்டுள்ளது.
