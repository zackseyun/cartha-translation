id: JHN.13.31
reference: John 13:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: ta
  text: 'எனவே, அவன் வெளியே சென்றதும், இயேசு கூறினார்: “இப்போது மனிதகுமாரன் மகிமைப்படுத்தப்பட்டிருக்கிறார்; கடவுளும் மனிதகுமாரனில்[a] மகிமைப்படுத்தப்பட்டிருக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் மூலமாக.” கிரேக்கச் சொற்றொடர், கடவுள் மனிதகுமாரனில் மகிமைப்படுத்தப்பட்டார் என்றும், மனிதகுமாரன் மூலமாக மகிமைப்படுத்தப்பட்டார் என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: அவன் வெளியே சென்றதும்
  rationale: ὅτε குறிக்கும் காலத் தொடர்பையும் οὖν குறிக்கும் நிகழ்வின் முன்னேற்றத்தையும், தமிழில் இயல்பாக ‘சென்றதும்’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்றதும்
  rationale: ἐξέρχομαι என்பதிலுள்ள இடத்தைவிட்டு வெளியே செல்லும் நுணுக்கத்தைப் பாதுகாக்கிறது; முந்தைய சூழலில் இதன் எழுவாய் யூதாஸ்.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை நவீனத் தமிழ் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்குகிறது.
- source_word: Νῦν
  choice: இப்போது
  rationale: யூதாஸ் வெளியேறியதைத் தொடர்ந்து தொடங்கியுள்ள தீர்மானமான தருணத்தை நேரடியாகக் குறிக்கிறது.
- source_word: ἐδοξάσθη
  choice: மகிமைப்படுத்தப்பட்டிருக்கிறார்
  rationale: இறந்தகாலச் செயல் இப்போது நிறைவேறிய நிலையையும் தொடரும் பொருத்தத்தையும் கொண்டதாகச் சொல்லப்படும் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வினையின் செயப்பாட்டு வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற சுயக்குறிப்பையும் தானியேல் 7 உட்பட அதன் வேதப் பின்னொலியையும் பாதுகாக்கும் மரபான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: θεός என்பதற்கான தெளிவான, பொதுவாகப் புரிந்துகொள்ளப்படும் நவீனத் தமிழ் இணை.
- source_word: ἐν αὐτῷ
  choice: அவரில்
  rationale: ἐν என்பதன் நேரடியான உறவுசார்/இடம்சார் பொருளைப் பாதுகாக்கிறது; கருவிசார் பொருளான ‘அவர் மூலமாக’ என்பதும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மனிதகுமாரன் மகிமைப்படுத்தப்படுதல் குறிக்கும் நிகழ்வு
  choice: சிலுவை, உயிர்த்தெழுதல், உயர்த்தப்படுதல் ஆகியவற்றில் ஒன்றுக்கு மட்டும் சுருக்காமல், ஏற்கெனவே தொடங்கியுள்ள மகிமைப்படுத்துதலாக மொழிபெயர்த்தல்
  alternative: சிலுவையை மட்டும் அல்லது உயிர்த்தெழுதல்/உயர்த்தப்படுதலை மட்டும் குறிப்பதாகத் தெளிவுபடுத்துதல்
  rationale: வசனம் எந்த ஓர் நிகழ்வையும் தனியாகச் சுட்டுவதில்லை. யோவானின் விரிந்த இறையியல் பதற்றத்தையும் பொருள் அகலத்தையும் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
- issue: ἐν αὐτῷ என்பதன் பொருள்
  choice: அவரில்
  alternative: அவர் மூலமாக
  rationale: இச்சொற்றொடர் உறவுசார் பொருளிலும் கருவிசார் பொருளிலும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை நேரடியான வடிவத்தை வைத்துக்கொண்டு, மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற பட்டமும் ‘மகிமைப்படுத்தப்பட்டிருக்கிறார்’ என்ற செயப்பாட்டு நிறைவு வடிவமும் மூலத்தின் சொல்லாட்சியையும் இப்போதைய பொருத்தத்தையும் பாதுகாக்கின்றன.
