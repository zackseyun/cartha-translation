  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: ta
  text: அவர் பந்தியிலிருந்து எழுந்து, தமது மேலாடைகளைக் கழற்றி வைத்தார்; பின்னர் ஒரு துவாலையை எடுத்து, அதைத் தமது இடுப்பில் கட்டிக்கொண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται
  choice: எழுந்து
  rationale: கதையாடலில் வரும் நிகழ்கால வடிவத்தின் உயிரோட்டத்தைத் தமிழில் இயல்பான தொடர் வினையெச்சமாக வெளிப்படுத்துகிறது; எழுந்த செயலை நேரடியாகக் குறிக்கிறது.
- source_word: ἐκ τοῦ δείπνου
  choice: பந்தியிலிருந்து
  rationale: δεῖπνον இங்கு மாலை நேரத்தைத் துல்லியமாகக் குறிப்பிடுவதைவிட நடைபெறும் உணவுப் பந்தியைக் குறிக்கிறது. ‘பந்தியிலிருந்து’ என்பது உணவிடத்திலிருந்து எழுந்தார் என்ற இயல்பான தமிழ் பொருளைத் தருகிறது.
- source_word: τίθησιν τὰ ἱμάτια
  choice: தமது மேலாடைகளைக் கழற்றி வைத்தார்
  rationale: τίθημι இச்சூழலில் வெறுமனே ‘வைத்தார்’ என்பதல்ல, அணிந்திருந்தவற்றை அகற்றி வைத்தார் என்பதைக் குறிக்கிறது. ἱμάτια என்பதற்கு ‘மேலாடைகள்’ என்று மொழிபெயர்ப்பது முழுமையாக ஆடையைக் களைந்தார் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: λαβὼν λέντιον
  choice: ஒரு துண்டை எடுத்து
  rationale: λέντιον என்பது சேவைக்குப் பயன்படுத்தப்படும் துணி அல்லது துவாலை. நவீனத் தமிழில் ‘துண்டு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: διέζωσεν ἑαυτόν
  choice: அதைத் தமது இடுப்பில் கட்டிக்கொண்டார்
  rationale: διαζώννυμι என்பது ஒருவரைச் சுற்றி, குறிப்பாக இடுப்பைச் சுற்றிக் கட்டுவதைக் குறிக்கிறது. முன்னர் குறிப்பிடப்பட்ட துண்டையே கட்டினார் என்பதை ‘அதை’ தெளிவாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. வரலாற்று நிகழ்காலத்தைத் தமிழில் அசட்டையாக நிகழ்கால வாக்கியமாக்காமல், தொடர்ச்சியான செயல்களாக இயல்பாக வழங்கப்பட்டுள்ளது. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
