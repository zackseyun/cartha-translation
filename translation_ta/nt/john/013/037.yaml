id: JHN.13.37
reference: John 13:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: ta
  text: பேதுரு அவரிடம், “ஆண்டவரே, இப்போது ஏன் என்னால் உம்மைப் பின்பற்ற முடியாது? உமக்காக என் உயிரைக் கொடுப்பேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: என்றான்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும், சொல்லின் சாத்தியமான இறையியல் நிறையையும் இது தக்கவைக்கிறது.
- source_word: οὐ δύναμαί
  choice: ஏன் என்னால் ... முடியாது?
  rationale: இயலாமையைச் சுட்டும் கிரேக்க அமைப்பை இயல்பான நவீன தமிழில் கேள்வியாகத் தருகிறது.
- source_word: σοι ἀκολουθῆσαι
  choice: உம்மைப் பின்பற்ற
  rationale: உடன் செல்வது, சீடராகப் பின்பற்றுவது ஆகிய இரு நுணுக்கங்களையும் ‘பின்பற்ற’ தக்கவைக்கிறது.
- source_word: ἄρτι
  choice: இப்போது
  rationale: உடனடியான காலக் குறிப்பை எளிமையாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: τὴν ψυχήν μου
  choice: என் உயிரை
  rationale: இங்கு ψυχή என்பது தனி ஆன்மீகப் பொருளைக் காட்டாமல், மரணத்திற்குத் தன்னை ஒப்புக்கொடுக்கும் பொருளில் ஒருவரின் உயிரைக் குறிக்கிறது.
- source_word: ὑπὲρ σοῦ
  choice: உமக்காக
  rationale: ஒருவரின் நன்மைக்காக அல்லது அவர் சார்பாகச் செய்வது என்ற பரந்த நுணுக்கத்தைத் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: θήσω
  choice: கொடுப்பேன்
  rationale: ψυχή என்பதுடன் சேர்ந்துள்ள ‘உயிரைத் தியாகம் செய்தல்’ என்ற மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: ‘என் உயிரை’ என்று மொழிபெயர்த்தல்
  alternative: ‘என் ஆத்துமாவை’
  rationale: இந்தச் சூழலில் பேதுரு இயேசுவுக்காக இறக்கத் தயாராக இருப்பதாகக் கூறுகிறான்; ஆகவே metaphysical ஆன்மாவைவிட வாழ்வையே இழப்பது பொருத்தமான பொருள்.
- issue: ἀκολουθέω என்பதன் நுணுக்கம்
  choice: ‘பின்பற்ற’ என்று மொழிபெயர்த்தல்
  alternative: ‘உம்முடன் வர’
  rationale: யோவான் நற்செய்தியில் இச்சொல் இடமாற்றத்தையும் சீடத்துவத்தையும் ஒருங்கே நினைவூட்டுகிறது; ‘பின்பற்ற’ இந்த இறையியல் இழுவையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. இயேசுவை நோக்கிய மரியாதையை ‘உம்மை/உமக்காக’ வடிவங்கள் வெளிப்படுத்துகின்றன; பேதுருவுக்கான மூன்றாம் நபர் வினை கதைநடைக்கு ஏற்றவாறு அமைக்கப்பட்டுள்ளது.
