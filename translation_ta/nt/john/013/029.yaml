id: JHN.13.29
reference: John 13:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: ta
  text: சிலர், பணப்பெட்டி யூதாசிடம் இருந்ததால், இயேசு அவனிடம், “பண்டிகைக்குத் தேவையானவற்றை வாங்கு” என்றோ, ஏழைகளுக்கு ஏதாவது கொடுக்கச் சொன்னார் என்றோ நினைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: அங்கிருந்த சிலர்
  rationale: குறிப்பிடப்படாத பன்மை; சூழலில் அங்கு இருந்த சீடர்களில் சிலரைக் குறிக்கிறது. தமிழில் இயல்பான தெளிவுக்காக ‘அங்கிருந்த’ சேர்க்கப்பட்டது.
- source_word: ἐδόκουν
  choice: நினைத்தார்கள்
  rationale: அவர்கள் கொண்டிருந்த ஊகத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இறந்தகாலக் கதைநடைக்கு ஏற்றது.
- source_word: ἐπεὶ
  choice: …இருந்ததால்
  rationale: யூதாசைப் பற்றிய அவர்களுடைய ஊகத்திற்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: γλωσσόκομον
  choice: பணப்பெட்டி
  rationale: குழுவின் பொதுப் பணம் வைக்கப்பட்டிருந்த கொள்கலனைக் குறிக்கும் சொல்லுக்கு நெருக்கமான, எளிதில் புரியும் தமிழ்.
- source_word: εἶχεν
  choice: யூதாசிடம் இருந்ததால்
  rationale: கிரேக்கத்தின் அடிப்படைப் பொருளான ‘வைத்திருந்தான்/அவனிடம் இருந்தது’ என்பதைக் காக்கிறது; பணத்துக்குப் பொறுப்பானவன் என்ற விளக்கத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றோ
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ்க் கதைநடையில் இயல்பான இறந்தகால மறைமுகக் கூற்றாக வழங்குகிறது.
- source_word: Ἀγόρασον
  choice: வாங்கு
  rationale: எளிய கட்டளையை நேரடியாகவும் தற்போதைய வழக்கிலும் தெரிவிக்கிறது.
- source_word: ὧν χρείαν ἔχομεν
  choice: தேவையானவற்றை
  rationale: ‘நமக்குத் தேவையானவை’ என்ற கருத்தை மேற்கோளின் சூழலில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὴν ἑορτήν
  choice: பண்டிகைக்கு
  rationale: மதப் பண்டிகையைப் பொதுவாகக் குறிக்கும் ἑορτή என்பதற்கு ஏற்றது; வசனத்தில் வெளிப்படையாக இல்லாத ‘பஸ்கா’வைச் சேர்க்கவில்லை.
- source_word: τοῖς πτωχοῖς
  choice: ஏழைகளுக்கு
  rationale: பொருளுதவி தேவைப்படுகிற மக்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டை நேரடியாக வழங்குகிறது.
- source_word: ἵνα τι δῷ
  choice: ஏதாவது கொடுக்கச் சொன்னார்
  rationale: சீடர்கள் புரிந்துகொண்ட மாற்று நோக்கத்தைத் தமிழில் இயல்பான மறைமுகக் கட்டளையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἑορτή என்பதன் குறிப்பிட்ட அடையாளம்
  choice: பண்டிகை
  alternative: பஸ்கா பண்டிகை
  rationale: இப்பகுதியின் சூழல் பஸ்காவைக் குறித்தாலும், இவ்வசனத்தின் கிரேக்க உரை பொதுவான ‘பண்டிகை’ என்ற சொல்லையே பயன்படுத்துகிறது. ஆகவே குறிப்பிட்ட பெயரை உரைக்குள் சேர்க்காமல் மூலத்தின் வெளிப்பாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். நீண்ட கிரேக்க வாக்கியத்தின் காரணத் தொடர்பும் இரண்டு மாற்று ஊகங்களும் தெளிவாக இருக்கும்படி தமிழ் சொல் வரிசை அமைக்கப்பட்டுள்ளது.
