base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: ta
  text: '“மெய்யாகவே, மெய்யாகவே உங்களுக்குச் சொல்கிறேன்: ஓர் அடிமை[a] தன் எஜமானைவிட[b] மேலானவன் அல்ல; ஓர் அப்போஸ்தலனும்[c] தன்னை அனுப்பியவரைவிட மேலானவன் அல்ல.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாள்.” கிரேக்கச் சொல் அடிமை–எஜமான் உறவின் கீழிருப்பவரைக் குறிக்கிறது; அந்த வலுவான சமூக உறவைப் பாதுகாக்க இங்கு “அடிமை” எனப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆண்டவர்.” இங்கு அடிமை–எஜமான் ஒப்புமைக்கு ஏற்ப சமூக உறவுப் பொருளில் “எஜமான்” எனப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அனுப்பப்பட்டவர்” அல்லது “தூதன்.” கிரேக்கச் சொல் பணியுடன் அனுப்பப்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: மெய்யாகவே, மெய்யாகவே
  rationale: யோவான் நற்செய்தியில் வரும் solemn emphatic formula-வின் இரட்டிப்பையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நிகழ்காலப் பேச்சுச் சூத்திரத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: எஜமானின் அதிகாரத்திற்குக் கீழ்ப்பட்ட நிலையை ‘வேலைக்காரன்’ என்பதைக் காட்டிலும் வலுவாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: μείζων
  choice: பெரியவன்
  rationale: பதவி அல்லது அதிகார நிலையில் மேலானவன் என்ற பரந்த ஒப்பீட்டுப் பொருளை இரு கூறுகளிலும் காக்கிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: இங்கு அடிமை–எஜமான் என்ற சமூக உறவே நேரடியான சூழல்; பட்டப்பெயரான ‘ஆண்டவர்’ என்று மொழிபெயர்ப்பதைவிட இது ஒப்புமையைத் தெளிவாகக் காக்கிறது.
- source_word: ἀπόστολος
  choice: அனுப்பப்பட்டவன்
  rationale: இச்சூழலில் சொல்லின் அடிப்படையான ‘ஒருவரால் பணியுடன் அனுப்பப்பட்டவர்’ என்ற பொருளையும் அடுத்துள்ள அனுப்பியவர் என்ற இணைப்பையும் தெளிவாக்குகிறது; இது தொழில்நுட்பப் பட்டப்பெயராக மட்டும் பொருளைச் சுருக்காது.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: தன்னை அனுப்பியவர்
  rationale: கிரேக்க வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் கொடுத்து, அனுப்பப்பட்டவர்–அனுப்பியவர் என்ற இணைநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: κύριος என்பதைக் பட்டப்பெயராகவா சமூக உறவுச் சொல்லாகவா மொழிபெயர்ப்பது
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: உடனடிச் சூழலில் அடிமை–எஜமான் மற்றும் அனுப்பப்பட்டவர்–அனுப்பியவர் என்ற இரண்டு அதிகார உறவுகள் இணையாக நிற்கின்றன. ஆகவே நேரடி கிறிஸ்தியல் பட்டப்பெயரைத் திணிக்காமல் சமூகப் பொருள் காக்கப்படுகிறது.
- issue: ἀπόστολος என்பதைக் தொழில்நுட்பத் திருச்சபைப் பட்டமாகவா பொதுவான பணியனுப்பப்பட்டவராகவா மொழிபெயர்ப்பது
  choice: அனுப்பப்பட்டவன்
  alternative: அப்போஸ்தலன்
  rationale: ‘தன்னை அனுப்பியவர்’ என்ற அடுத்த சொற்றொடர் இங்கு அனுப்புதல் சார்ந்த பொதுப் பொருளை முன்னிறுத்துகிறது. ஆயினும் ‘அப்போஸ்தலன்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. இரட்டிக்கப்பட்ட உறுதிப்பாட்டு மொழியும் இரண்டு ஒப்பீட்டுக் கூறுகளின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
