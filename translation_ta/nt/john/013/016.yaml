    rationale: Although the word can mean one sent, the main-text wording omits the conventional lexical term “அப்போஸ்தலன்” and its resonance in this saying. The English POB audit trail selects “apostle”; retaining it in Tamil while noting the more general sense best preserves source fidelity without excluding the contextual nuance.
