review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ response, Peter’s present lack of knowledge, the contrastive future realization, and the open temporal force of μετὰ ταῦτα. However, “நான் செய்வது என்னவென்று” slightly recasts the direct object construction, and the speech introduction is less natural than a direct Tamil equivalent that retains both response and speech.
  naturalness: “அவனுக்கு மறுமொழியாக” is awkward in modern standard Tamil. “அவனுக்குப் பதிலளித்துக் கூறினார்” is natural, dignified, and suitable for biblical narrative. The revised main clause is also more direct and idiomatic.
  terminology: Using “அறியவில்லை” for οἶδας and “அறிந்துகொள்வாய்” for γνώσῃ preserves the lexical distinction without forcing a doctrinal or overly interpretive sense. The note supplies “புரிந்துகொள்வாய்” as a contextually valid alternative.
  issues:
  - severity: low
    issue: Awkward speech introduction
    rationale: “அவனுக்கு மறுமொழியாக” is not the most natural modern Tamil construction. A participial response verb followed by “கூறினார்” expresses ἀπεκρίθη … καὶ εἶπεν smoothly.
  - severity: low
    issue: The future verb’s note is oriented around the less source-transparent main rendering
    rationale: The main text uses “புரிந்துகொள்வாய்,” whereas “அறிந்துகொள்வாய்” better represents γινώσκω and preserves its distinction from οἶδα. The contextual ‘understand’ sense can appropriately be retained in the footnote.
  revised_text: 'இயேசு அவனுக்குப் பதிலளித்துக் கூறினார்: “நான் செய்வதை நீ இப்போது அறியவில்லை; ஆனால் இவற்றுக்குப் பிறகு அறிந்துகொள்வாய்[a].”'
