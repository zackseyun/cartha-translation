revisions:
- from: இயேசு அவனுக்கு மறுமொழியாக, “நான் செய்வது என்னவென்று இப்போது உனக்குத் தெரியாது; ஆனால் இவற்றுக்குப் பிறகு புரிந்துகொள்வாய்[a]” என்றார்.
  to: 'இயேசு அவனுக்குப் பதிலளித்துக் கூறினார்: “நான் செய்வதை நீ இப்போது அறியவில்லை; ஆனால் இவற்றுக்குப் பிறகு அறிந்துகொள்வாய்[a].”'
  rationale: The revision replaces an awkward response formula with natural modern Tamil while retaining the source’s two-part speech introduction. It renders the object clause more directly and uses “அறியவில்லை … அறிந்துகொள்வாய்” to reflect the distinct Greek verbs without overdetermining the nature or timing of Peter’s later realization. The footnote preserves the contextual ‘understand’ alternative and the deliberately open scope of “after these things.”
