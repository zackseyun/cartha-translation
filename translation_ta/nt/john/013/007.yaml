  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்துக் கூறினார்: “நான் செய்வதை நீ இப்போது அறியவில்லை; ஆனால் இவற்றுக்குப் பிறகு அறிந்துகொள்வாய்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறிந்துகொள்வாய்” என்பதற்கு “புரிந்துகொள்வாய்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இங்கு ‘அறிதல்’ தொடர்பான இரண்டு வேறு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன. “இவற்றுக்குப் பிறகு” என்பது இந்நிகழ்ச்சியில் அடுத்து நடப்பவற்றையோ, இயேசுவின் செயலின் பொருளைப் பின்னர் தெளிவாக்கும் நிகழ்வுகளையோ குறிக்கலாம்.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: மறுமொழியாக … என்றார்
  rationale: கிரேக்கத்தில் உள்ள இரட்டை பேச்சு அறிமுகத்தைச் சொற்சொல்லாக ‘பதிலளித்து அவனிடம் சொன்னார்’ என வழங்குவது தமிழில் செயற்கையாக இருக்கும். ‘மறுமொழியாக … என்றார்’ என்பது பதிலின் தன்மையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: சூழலில் இது பேதுருவைக் குறிக்கும் மறைமுகச் செயப்படுபொருள்; தமிழில் ‘அவனுக்கு மறுமொழியாக’ இயல்பாக அமைகிறது.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: நான் செய்வது என்னவென்று
  rationale: நடந்துகொண்டிருக்கும் இயேசுவின் செயலைக் குறிக்கும் நிகழ்காலத்தையும், அதன் பொருளை அறிதல் என்ற கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ οἶδας ἄρτι
  choice: இப்போது உனக்குத் தெரியாது
  rationale: οἶδας என்பதன் அடிப்படை ‘அறிதல்/தெரிதல்’ பொருளை காத்து, ἄρτι என்பதைக் ‘இப்போது’ எனத் தெளிவாக வழங்குகிறது.
- source_word: γνώσῃ
  choice: புரிந்துகொள்வாய்
  rationale: பின்னர் இயேசுவின் செயலின் பொருளை உணர்ந்து அறிதலைக் குறிக்கிறது; மேலும் οἶδας மற்றும் γνώσῃ என்ற வேறுபட்ட கிரேக்க வினைகளின் நுண்வேறுபாட்டை தமிழில் ஓரளவு காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: தற்போதைய அறியாமைக்கும் பின்னர் ஏற்படும் புரிதலுக்கும் இடையிலான எதிர்மறை மாறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: ‘பின்னர்’ என்று பொதுமைப்படுத்தாமல், கிரேக்கச் சொற்றொடரின் பன்மைச் சுட்டையும் அதன் காலவட்டத் திறந்த தன்மையையும் காக்கிறது.
theological_decisions:
- issue: ‘இவற்றுக்குப் பிறகு’ என்பதன் கால மற்றும் நிகழ்வு வரம்பு
  choice: எந்த ஒரு குறிப்பிட்ட பின்னைய நிகழ்வையும் நிர்ணயிக்காமல் ‘இவற்றுக்குப் பிறகு’ என்று திறந்தவாறு வழங்கப்பட்டது.
  alternative: கால் கழுவுதல் முடிந்த பிறகு, உயிர்த்தெழுதலுக்குப் பிறகு, அல்லது ஆவியானவரின் வழியாக பின்னர் என்று குறிப்பாக்குதல்.
  rationale: μετὰ ταῦτα எந்த ஒரு விளக்கத்தையும் வெளிப்படையாகத் தேர்ந்தெடுக்கவில்லை. ஆகவே நிகழ்ச்சியின் உடனடி தொடர்ச்சியையோ பிற்கால மீட்பு நிகழ்வுகளையோ மட்டும் வலியுறுத்தாமல் மூலத்தின் இறையியல் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் காக்கப்பட்டுள்ளது. ‘உனக்குத் தெரியாது … புரிந்துகொள்வாய்’ என்பது மூலத்தில் வரும் இரு வேறு அறிதல் வினைகளின் வேறுபாட்டை வாசிக்கத்தக்க தமிழில் பிரதிபலிக்கிறது; ‘இவற்றுக்குப் பிறகு’ என்பது மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
