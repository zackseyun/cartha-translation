base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: ta
  text: நீங்கள் ஒருவருக்கொருவர் அன்பு கொண்டிருந்தால்,[b] இதன் மூலம்[a] நீங்கள் என்னுடைய சீடர்கள் என்பதை எல்லாரும் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதனால் எல்லாரும் அறிந்துகொள்வார்கள்” அல்லது “இதில் எல்லாரும் அறிந்துகொள்வார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “ஒருவருக்கொருவர் இடையில் அன்பு வைத்திருத்தல்”; அதாவது, பரஸ்பரம் அன்பு காட்டுதல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: இதன் மூலம்
  rationale: இந்த அன்பே சீடர்களை அடையாளம் காணச் செய்யும் சான்று அல்லது வழி என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இதில்’ என்பதும் சொற்பொருள் வாய்ப்பாக இருந்தாலும் இச்சூழலில் தெளிவு குறைவு.
- source_word: γνώσονται
  choice: அறிந்துகொள்வார்கள்
  rationale: வருங்கால வினை வடிவத்தையும், ஒரு உண்மையை அறிதல் அல்லது அடையாளம் கண்டுகொள்ளுதல் என்ற பரந்த பொருளையும் தக்கவைக்கிறது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: பாலினக் கட்டுப்பாடின்றி கிரேக்கச் சொல்லின் பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: நீங்கள் என்னுடைய சீடர்கள்
  rationale: இங்குள்ள உடைமைப் பொருளுடைய ἐμοὶ என்பதையும், μαθηταί என்பதன் ஆசிரியர்–சீடர் உறவையும் தெளிவாகத் தருகிறது.
- source_word: ἐὰν
  choice: கொண்டிருந்தால்
  rationale: கிரேக்கத்தின் நிபந்தனை வடிவத்தைப் பாதுகாக்கிறது; இது சீடத்துவத்தைச் சம்பாதிக்கும் வழி என்று கூறாமல், அதை அடையாளப்படுத்தும் நிபந்தனை அல்லது சான்றாகவே நிற்கிறது.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: நீங்கள் ஒருவருக்கொருவர் அன்பு கொண்டிருந்தால்
  rationale: ‘ஒருவருக்கொருவர் இடையே அன்பைக் கொண்டிருத்தல்’ என்ற பரஸ்பர உறவுப் பொருளை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐὰν அறிமுகப்படுத்தும் நிபந்தனையின் தன்மை
  choice: நீங்கள் ஒருவருக்கொருவர் அன்பு கொண்டிருந்தால்
  alternative: நீங்கள் ஒருவருக்கொருவர் அன்பு காட்டும்போது
  rationale: ‘-ஆல்’ என்ற நிபந்தனை வடிவம் கிரேக்கத்தை நேரடியாகப் பாதுகாக்கிறது. அன்பைச் சீடத்துவத்தைச் சம்பாதிக்கும் காரணமாக அல்லாமல், அதை வெளிப்படுத்தும் அடையாளமாக வாசிக்க இடமளிக்கிறது.
- issue: πάντες என்பதன் பொதுப்பால் குறிப்பு
  choice: எல்லாரும்
  alternative: எல்லா மக்களும்
  rationale: கிரேக்கப் பன்மை இங்கு ஆண்களை மட்டும் குறிக்காது; ‘எல்லாரும்’ அதன் உலகளாவிய நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் முடிவில் வரும் நிபந்தனைத் துணைவாக்கியம் தமிழின் இயல்பான ஓட்டத்திற்காக முன்னிலைப்படுத்தப்பட்டுள்ளது; கருத்து வலிமை மாற்றப்படவில்லை.
