  terminology: “சீமோன் பேதுரு” is an established Tamil biblical name form. “ஆண்டவரே” is an appropriate rendering of Κύριε and preserves its respectful and potentially weighty Johannine force without forcing a doctrinal interpretation. The footnote responsibly records “எஜமானரே” as a lexical alternative.
