id: JHN.13.9
reference: John 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: ta
  text: சீமோன் பேதுரு அவரிடம், “ஆண்டவரே,[a] என் கால்களை மட்டுமல்ல, என் கைகளையும் தலையையும்கூடக் கழுவுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “எஜமானரே.” கிரேக்கம்: “குரியோஸ்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கக் கதைநடையில் வரும் வரலாற்று நிகழ்காலத்தை, இயல்பான நவீனத் தமிழ் கதைநடைக்கேற்ப இறந்தகாலமாக வழங்குகிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: மூலத்திலுள்ள பிரதிப்பெயரைப் பாதுகாக்கிறது; சூழலிலிருந்து அது இயேசுவைக் குறிக்கிறது.
- source_word: Σίμων Πέτρος
  choice: சீமோன் பேதுரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவங்கள்.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான நேரடி அழைப்பையும் யோவான் நூலிலுள்ள இறையியல் ஒலிப்பையும் காக்கிறது.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: மட்டுமல்ல ... -யும்கூட
  rationale: ஒரு பொருளோடு மேலும் இரண்டைச் சேர்க்கும் கிரேக்க எதிர்மறை-விரிவாக்க அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: τοὺς πόδας μου
  choice: என் கால்களை
  rationale: உடைமைப் பிரதிப்பெயருடன் பன்மை உறுப்பை நேரடியாக வழங்குகிறது.
- source_word: τὰς χεῖρας
  choice: என் கைகளையும்
  rationale: கிரேக்கத்தில் முன் வந்த μου ஒருங்கிணைக்கப்பட்ட உடல் உறுப்புகளுக்கும் பொருந்துவதால், தமிழில் இயல்பாக உடைமைச் சொல்லை மீண்டும் வழங்குகிறது.
- source_word: τὴν κεφαλήν
  choice: தலையையும்கூட
  rationale: ஒருங்கிணைப்பால் புரியப்படும் முதல் நபர் உடைமையைத் தமிழில் முன்னுள்ள 'என்' என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: ellipsis of washing verb from context
  choice: கழுவுங்கள்
  rationale: இவ்வசனத்தில் வினைச்சொல் வெளிப்படையாக இல்லை; முந்தைய வசனங்களில் இயேசு பேதுருவின் கால்களைக் கழுவுவது பற்றிய உரையாடலிலிருந்து அது தெளிவாகப் புரிகிறது. முழுமையான இயல்பான தமிழ் வாக்கியத்திற்காக வினைச்சொல் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவை அழைக்கும் κύριος என்ற பட்டம்
  choice: ஆண்டவரே
  alternative: போதகரே / எஜமானே
  rationale: κύριος என்பதன் வழக்கமான புதிய ஏற்பாட்டு வலிமையையும் மரியாதையையும் காக்கிறது; உடனடிச் சூழலைத் தாண்டி பொருளைச் சுருக்கவோ விரிவாக்கவோ செய்யவில்லை.
- issue: மூலத்தில் மறைந்துள்ள கழுவுதல் என்ற செயல்
  choice: கழுவுங்கள் என்று உரையில் வெளிப்படுத்தல்
  alternative: “என் கால்களை மட்டுமல்ல, என் கைகளையும் தலையையும்கூட” என்று வினையின்றி விடுதல்
  rationale: கிரேக்கத்தில் முந்தைய உரையாடலிலிருந்து வினை எளிதில் நிரப்பப்படுகிறது. தமிழில் அதை விடுவது முழுமையற்ற நேரடி உரையாக ஒலிப்பதால், சூழல் தரும் செயலை வெளிப்படையாகச் சொல்வது பொருளை மாற்றாமல் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. இயேசுவைக் குறிக்கும் பிரதிப்பெயருக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; பேதுருவின் திடீர், மிகைப்படியான பதிலின் வலிமை ‘மட்டுமல்ல ... -யும்கூட’ என்ற அமைப்பில் பாதுகாக்கப்பட்டுள்ளது.
