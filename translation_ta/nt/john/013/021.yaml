source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: ta
  text: 'இவற்றைச் சொன்னபின், இயேசு தமது ஆவியில் கலக்கமடைந்து, சாட்சியளித்துச் சொன்னார்: “உண்மையாக, உண்மையாக உங்களுக்குச் சொல்கிறேன்: உங்களில் ஒருவன் என்னைக் காட்டிக்கொடுப்பான்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக, “என்னை ஒப்படைப்பான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: இவற்றைச் சொன்னபின்
  rationale: இறந்தகாலப் பங்கேற்புவினையும் ταῦτα என்பதையும் இயல்பான தமிழில் காலத்தொடரைக் காட்டும் சொற்றொடராக வழங்குகிறது.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: தமது ஆவியில் கலக்கமடைந்து
  rationale: ἐταράχθη குறிக்கும் உள்ளார்ந்த கலக்கத்தையும், τῷ πνεύματι என்பதன் ‘ஆவியில்’ என்ற மரியாதை/தளப் பொருளையும் கூடுதல் தீவிரம் சேர்க்காமல் காக்கிறது.
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: சாட்சியளித்துச் சொன்னார்
  rationale: யோவான் பயன்படுத்தும் சாட்சி மொழியையும் கூற்றின் ஆணித்தரமான தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἀμὴν ἀμὴν
  choice: உண்மையாக, உண்மையாக
  rationale: இருமுறை வரும் வலியுறுத்தலையும் இயேசுவின் ஆணித்தரமான அறிமுகச் சூத்திரத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடித் தன்மையை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: εἷς ἐξ ὑμῶν
  choice: உங்களில் ஒருவன்
  rationale: பகுதிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருவதோடு, சீடர்களில் ஒருவனைக் குறிக்கும் அதிர்ச்சியையும் காக்கிறது.
- source_word: παραδώσει με
  choice: என்னைக் காட்டிக்கொடுப்பான்
  rationale: இச்சூழலில் துரோகமாக ஒப்படைக்கும் செயலைத் தெளிவாக உணர்த்துகிறது; ‘ஒப்படைப்பான்’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் உள்ளார்ந்த கலக்கத்தை மொழிபெயர்த்தல்
  choice: தமது ஆவியில் கலக்கமடைந்து
  alternative: தமது உள்ளத்தில் கலக்கமடைந்து
  rationale: இயேசுவின் உண்மையான உள்ளார்ந்த துயரத்தை மறைக்காமல், πνεῦμα என்பதைக் ‘உள்ளம்’ என்று முழுமையாக உளவியல் பொருளுக்குள் சுருக்காமல் விடுகிறது.
- issue: துரோக முன்னறிவிப்பில் παραδίδωμι என்பதைக் கூறுதல்
  choice: என்னைக் காட்டிக்கொடுப்பான்
  alternative: என்னை ஒப்படைப்பான்
  rationale: உடனடிச் சூழலில் சீடனின் துரோகச் செயலை முதன்மை உரை தெளிவுபடுத்துகிறது; அதே நேரத்தில் ‘ஒப்படைத்தல்’ என்ற மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சாட்சியளித்துச் சொன்னார்’ யோவானின் சாட்சி சார்ந்த சொல்லாட்சியைப் பேணுகிறது; ‘தமது ஆவியில்’ மூலத்தின் பொருள்திறப்பை தேவையின்றி குறுக்கவில்லை.
