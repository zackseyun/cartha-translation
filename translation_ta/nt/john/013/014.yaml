source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: ta
  text: ஆகவே, ஆண்டவரும் ஆசிரியருமான நானே உங்கள் கால்களைக் கழுவியிருக்கிறேன் என்றால், நீங்களும் ஒருவருடைய கால்களை ஒருவர் கழுவக் கடமைப்பட்டிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: ஆகவே ... இருந்தால்
  rationale: εἰ என்பதன் நிபந்தனையையும் οὖν என்பதன் முடிவுரைத் தொடர்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγὼ
  choice: நானே
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் வலியுறுத்தப்பட்ட தனிப்பெயரைத் தக்கவைத்து, இயேசுவின் செயலும் சீடர்களின் கடமையும் இடையிலான ஒப்பீட்டைத் தெளிவாக்குகிறது.
- source_word: ἔνιψα
  choice: கழுவியிருந்தால்
  rationale: சற்றுமுன் நிறைவேற்றப்பட்ட செயலைக் குறிக்கும் அஓரிஸ்டை, நிபந்தனை வாக்கியத்தில் இயல்பாகவும் முடிந்த செயலின் தொடர்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: ὑμῶν τοὺς πόδας
  choice: உங்கள் கால்களை
  rationale: உடைமைத் தொடர்பையும் நேரடிப் பொருளையும் இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இயேசு தம்மைக் குறித்துப் பயன்படுத்தும் பட்டப்பெயராக κύριος அமைவதால், வழக்கமான கிறிஸ்தவத் தமிழில் தெளிவான ‘ஆண்டவர்’ தேர்ந்தெடுக்கப்படுகிறது.
- source_word: ὁ διδάσκαλος
  choice: போதகர்
  rationale: கற்பிப்பவர் என்ற பட்டப்பெயரின் பொருளைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது; ‘ஆசிரியர்’ என்பதைக் காட்டிலும் இச்சூழலில் மதப் போதனைக் கூறு தெளிவாகிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: καί என்பதன் ‘உம்’ பொருளையும், வலியுறுத்தப்பட்ட ὑμεῖς என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὀφείλετε
  choice: கடமைப்பட்டிருக்கிறீர்கள்
  rationale: கடன்பட்ட நிலையை அடிப்படையாகக் கொண்ட ஒழுக்கக் கடமையைத் தெரிவிக்கும் ὀφείλετε என்பதன் வலிமையை, நேரடி கட்டளையாக மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἀλλήλων ... τοὺς πόδας
  choice: ஒருவருடைய கால்களை ஒருவர்
  rationale: பரஸ்பரச் செயலைத் தமிழில் குழப்பமின்றி வெளிப்படுத்துகிறது.
- source_word: νίπτειν
  choice: கழுவ
  rationale: முழு உடலைக் குளிப்பாட்டுவதை அல்ல, உடலின் ஒரு பகுதியைக் கழுவும் குறிப்பிட்ட செயலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: κύριος என்பதைக் கிறிஸ்துவைப் பற்றிய பட்டப்பெயராக மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் இயேசுவின் உயர்ந்த நிலைக்கும் அவர் செய்த தாழ்மையான செயலுக்கும் உள்ள எதிர்மறை ஒப்பீட்டை ‘ஆண்டவர்’ தெளிவாகக் காக்கிறது; அதேவேளையில் ‘எஜமான்’ என்ற பொருள்நிழல் சூழலில் சாத்தியமானதாக இருந்தாலும் அதை முதன்மை உரையில் திணிக்கவில்லை.
- issue: கால்களைக் கழுவுதல் பற்றிய கடமையின் இயல்பு
  choice: குறிப்பிட்ட ‘கால்களைக் கழுவ’ என்ற செயலை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ஒருவருக்கொருவர் தாழ்மையுடன் பணிசெய்யுங்கள்
  rationale: கிரேக்க உரை கால்களைக் கழுவுவதை நேரடியாகக் குறிப்பிடுகிறது. அதன் விரிவான முன்மாதிரிப் பொருள் சூழலில் இருந்தாலும், இந்த வசனத்திலேயே அதை பொதுவான சேவை என்ற கருத்துரையாக மாற்றவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் நிபந்தனை, தர்க்கத் தொடர்ச்சி, வலியுறுத்தல், பரஸ்பரக் கடமை ஆகியவை இயல்பான தமிழ்ச் சொல்லமைப்பில் காக்கப்பட்டுள்ளன.
