review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential conditional structure, the emphatic ‘I,’ Jesus’ paired titles, the reciprocal object, and the obligation expressed by ὀφείλετε. However, கழுவியிருந்தால் can readily sound like a remote or contrary-to-fact past condition in contemporary Tamil, whereas Jesus refers to the act just completed and treats it as established.
  naturalness: The sentence is generally clear and idiomatic. Replacing கழுவியிருந்தால் with கழுவியிருக்கிறேன் என்றால் better conveys a completed, presently relevant action in a natural Tamil factual condition. ஆசிரியர் is the direct, neutral modern equivalent of διδάσκαλος; போதகர் can suggest a religious preacher, a specification not supplied by the Greek term itself.
  terminology: ஆண்டவர் appropriately renders κύριος as a title in this context. ஆசிரியர் more precisely and naturally renders διδάσκαλος without importing a specifically clerical or preaching role. கடமைப்பட்டிருக்கிறீர்கள் suitably communicates moral obligation without turning it into an unqualified imperative.
  issues:
  - severity: medium
    issue: கழுவியிருந்தால் may imply a remote/counterfactual past condition.
    rationale: The Greek εἰ ... ἔνιψα invokes an act Jesus has in fact just performed. கழுவியிருக்கிறேன் என்றால் retains the conditional argument while expressing completed action with current relevance.
  - severity: low
    issue: போதகர் is narrower than διδάσκαλος.
    rationale: διδάσκαλος means ‘teacher.’ In modern standard Tamil, ஆசிரியர் is the ordinary title and avoids adding the connotation of a religious preacher.
  revised_text: ஆகவே, ஆண்டவரும் ஆசிரியருமான நானே உங்கள் கால்களைக் கழுவியிருக்கிறேன் என்றால், நீங்களும் ஒருவருடைய கால்களை ஒருவர் கழுவக் கடமைப்பட்டிருக்கிறீர்கள்.
