id: JHN.13.27
reference: John 13:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: ta
  text: அப்பத்துண்டுக்குப்[a] பிறகு, அப்போது சாத்தான் அவனுக்குள் புகுந்தான். ஆகவே இயேசு அவனிடம், “நீ செய்துகொண்டிருப்பதை இன்னும் விரைவாகச் செய்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உணவுத் துண்டு.’ கிரேக்கச் சொல் ψωμίον ஒரு சிறிய உணவுத் துண்டைக் குறிக்கிறது; இங்கு அது உணவின்போது கொடுக்கப்பட்ட அப்பத்துண்டாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விரைவாகச் செய்.’ கிரேக்கச் சொல் τάχιον ஒப்பீட்டுப் படிவத்தில் இருப்பதால், மூலவடிவத்தின் நுணுக்கத்தை ‘இன்னும் விரைவாக’ என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: அப்பத்துண்டு
  rationale: இது சிறிய உணவுத் துண்டைக் குறிக்கிறது; இங்கு உணவின்போது கொடுக்கப்பட்ட அப்பத்துண்டு என்பதே சூழலுக்கு ஏற்ற தெளிவான பொருள்.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: அவனுக்குள் புகுந்தான்
  rationale: εἰσέρχομαι + εἰς என்ற நேரடியான இயக்கத்தைத் தக்கவைத்து, சாத்தானின் தனிப்பட்ட நுழைவை மெலிதாக்காமல் சொல்கிறது.
- source_word: ὁ Σατανᾶς
  choice: சாத்தான்
  rationale: புதிய ஏற்பாட்டுத் தமிழில் நிலைபெற்ற பெயர்/பட்டப்பெயர்; சொற்பிறப்பை மட்டும் முன்னிறுத்தும் ‘எதிராளி’ என்பதைக் காட்டிலும் இயல்பானது.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: ஆகவே இயேசு அவனிடம் ... என்றார்
  rationale: οὖν என்பதன் விளைவுத் தொடர்பை ‘ஆகவே’ காட்டுகிறது; யோவானின் வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலமாக வழங்குகிறது.
- source_word: Ὃ ποιεῖς
  choice: நீ செய்துகொண்டிருப்பதை
  rationale: நிகழ்காலச் செயற்பாட்டின் தொடர்ச்சி அல்லது உடனடித் தன்மையைப் பாதுகாக்கிறது; ‘நீ செய்யப்போவதை’ என்று எதிர்கால அர்த்தத்தைச் சேர்க்கவில்லை.
- source_word: ποίησον
  choice: செய்
  rationale: முடிவான செயலைக் கோரும் கட்டளையின் சுருக்கத்தையும் நேரடித்தன்மையையும் தக்கவைக்கிறது.
- source_word: τάχιον
  choice: இன்னும் விரைவாக
  rationale: ஒப்பீட்டுப் படிவத்தின் நுணுக்கத்தைத் தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘விரைவாக’ என்று சமப்படுத்தவில்லை.
theological_decisions:
- issue: யூதாசிடம் சாத்தான் செய்த செயலின் இயல்பு
  choice: ‘சாத்தான் அவனுக்குள் புகுந்தான்’ என்ற நேரடி மொழியைத் தக்கவைத்தல்
  alternative: ‘சாத்தான் அவனைத் தன் கட்டுப்பாட்டுக்குள் கொண்டுவந்தான்’ அல்லது ‘யூதாஸ் தன்னைச் சாத்தானுக்கு ஒப்புக்கொடுத்தான்’
  rationale: வசனம் தனிப்பட்ட சாத்தானிய நுழைவை நேரடியாகக் கூறுகிறது. அதை வெறும் உருவகமாகக் குறைக்காமலும், வசனம் கூறுவதற்கு அப்பாற்பட்ட ஆட்கொள்ளுதல் பற்றிய விரிவான கோட்பாட்டைச் சேர்க்காமலும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பத்துண்டுக்குப் பிறகு’ என்ற அமைப்பு கிரேக்கத்தின் சுருக்கமான தொடக்கத்தைப் பாதுகாக்கிறது; ‘அப்போது’ τότε என்பதையும், ‘ஆகவே’ οὖν என்பதன் தர்க்கத் தொடர்பையும் வெளிப்படுத்துகிறது.
