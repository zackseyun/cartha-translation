  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: ψωμίον என்பதற்கு ‘அப்பத்துண்டு,’ εἰσῆλθεν εἰς ἐκεῖνον என்பதற்கு ‘அவனுக்குள் புகுந்தான்,’ மற்றும் τάχιον-இன் ஒப்பீட்டு நுணுக்கத்திற்கு ‘இன்னும் விரைவாக’ வழங்கப்பட்டுள்ளன. ‘செய்துகொண்டிருப்பதை’ என்பது நிகழ்கால ποιεῖς-ஐ இயல்பாக வெளிப்படுத்துகிறது. λέγει எனும் வரலாற்று நிகழ்காலத்தைத் தமிழ்க் கதைநடைத் தேவைக்கேற்ப ‘என்றார்’ என இறந்தகாலத்தில் கொடுத்திருப்பது பொருளை மாற்றவில்லை.'
