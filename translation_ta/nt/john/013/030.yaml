  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: ta
  text: ஆகவே, அந்த அப்பத் துண்டை[a] எடுத்துக்கொண்டபின், அந்த மனிதன்[b] உடனே வெளியே சென்றான். இரவாக இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த சிறு உணவுத் துண்டை’ என்றும் மொழிபெயர்க்கலாம். ψωμίον என்பது உணவின்போது கொடுக்கப்படும் சிறிய அப்பத் துண்டையையோ உணவுத் துண்டையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘அந்த ஒருவன்’ என்ற வலியுறுத்தப்பட்ட சுட்டுப்பெயர் உள்ளது; இது சாதாரண ‘அவன்’ என்பதைவிட யூதாசின் மீது கவனத்தைச் செலுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘இரவு’ என்பது இங்கு நேரத்தைக் குறிக்கிறது. அதேவேளையில், யோவான் நற்செய்தியின் ஒளி–இருள் கருப்பொருளையும் இது எதிரொலிக்கக்கூடும்.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: பெற்றுக்கொண்டதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதலில் அப்பத் துண்டைப் பெற்றுக்கொண்டு பின்னர் வெளியே சென்ற நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காட்டுகிறது. இச்சூழலில் இயேசுவிடமிருந்து பெற்றதையும் தெளிவுபடுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக அடுத்த செயல் நடைபெறுவதைக் காட்டும் οὖν என்பதன் தொடர்ச்சி மற்றும் முடிவுணர்வைப் பாதுகாக்கிறது.
- source_word: τὸ ψωμίον
  choice: அந்த அப்பத் துண்டை
  rationale: ψωμίον என்பது உணவின்போது கொடுக்கப்படும் சிறிய அப்பத் துண்டையோ உணவுத் துண்டையோ குறிக்கிறது. ‘அப்பத் துண்டு’ என்பது தெளிவான, இக்காலத் தமிழ் நடை.
- source_word: ἐκεῖνος
  choice: அவனே
  rationale: சாதாரண ‘அவன்’ என்பதைவிட சுட்டிக்காட்டும் வலியுறுத்தலைத் தக்கவைத்து, யூதாசின் மேல் கதை கவனத்தைச் செலுத்துகிறது; ‘அந்த மனிதன்’ என்ற இயல்பற்ற தமிழைத் தவிர்க்கிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்றான்
  rationale: ἐξέρχομαι என்பதன் இடம்சார் பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εὐθύς
  choice: உடனே
  rationale: செயல் தாமதமின்றி நடைபெற்றதைக் குறிக்கும் εὐθύς என்பதன் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: ἦν δὲ νύξ
  choice: அப்போது இரவாக இருந்தது
  rationale: இரவு நேரம் என்ற நேரடிக் காலக் குறிப்பை இயல்பான தமிழில் தருகிறது; அதில் இருக்கக்கூடிய இலக்கிய அல்லது குறியீட்டு ஒலிப்பை முதன்மை உரையில் விளக்கமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: யோவான் நற்செய்தியில் ‘இரவு’ என்பதற்கிருக்கக்கூடிய குறியீட்டுப் பொருள்
  choice: ‘அப்போது இரவாக இருந்தது’ என்று நேரடிக் காலக் குறிப்பாக மொழிபெயர்த்தல்
  alternative: முதன்மை உரையிலேயே அதை ஆவிக்குரிய இருளின் குறியீடாக வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க வாக்கியம் முதலில் நேரத்தைக் குறிக்கும் எளிய கூற்று. யோவானின் ஒளி–இருள் கருப்பொருளுடன் தொடர்பு இருக்கலாம்; ஆனால் அதை முதன்மை உரையில் வெளிப்படையாக்குவது மூலத்தின் அர்த்தத் திறப்பை முன்கூட்டியே தீர்மானித்துவிடும்.
- issue: யூதாசைக் குறிக்கும் ἐκεῖνος என்பதன் வலியுறுத்தல்
  choice: ‘அவனே’ என்று வலியுறுத்தலைத் தக்கவைத்தல்
  alternative: ‘அவன்’ என்று சாதாரணப் பதிலிடுபெயராக மொழிபெயர்த்தல்
  rationale: சுட்டுப்பெயரின் குறியிடப்பட்ட வலிமையை முழுமையாகச் சமப்படுத்தாமல், இயல்பான தமிழில் யூதாசின் மேல் விழும் கதை கவனத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டது. ‘அவனே’ என்பது கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது; ‘இரவாக இருந்தது’ என்பது குறியீட்டுப் பொருளை உரைக்குள் திணிக்காமல் மூலத்தின் சுருக்கமான இலக்கிய வலிமையைத் தக்கவைக்கிறது.
