reference: John 13:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: ta
  text: “நீங்கள் என்னை ‘ஆசிரியர்’ என்றும் ‘ஆண்டவர்’[a] என்றும் அழைக்கிறீர்கள்; நீங்கள் சொல்வது சரியே, ஏனெனில் நான் அப்படியே இருக்கிறேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஜமான்.” கிரேக்கச் சொல் சமூக அல்லது அதிகார உறவில் எஜமானைக் குறிக்கலாம்; இங்கு இயேசுவுக்கான பட்டப்பெயராக “ஆண்டவர்” பயன்படுத்தப்பட்டுள்ளது.
    reason: κύριος என்பதற்கான உண்மையான சொற்பொருள் மாற்றைச் சுட்டிக்காட்டுதல்.
lexical_decisions:
- source_word: φωνεῖτέ
  choice: அழைக்கிறீர்கள்
  rationale: ஒருவரை ஒரு பட்டப்பெயரால் அழைப்பதைக் குறிக்கும் இக்கட்டமைப்பில், ‘அழைக்கிறீர்கள்’ என்பது நேரடியும் இயல்பானதுமான தமிழ் வழக்கு.
- source_word: Ὁ διδάσκαλος
  choice: ஆசிரியர்
  rationale: διδάσκαλος என்பதன் கற்பிப்பவர் என்ற பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது. கிரேக்கக் கட்டுரையால் பட்டப்பெயர் வலியுறுத்தப்படுவதை மேற்கோள் குறிகள் வெளிப்படுத்துகின்றன.
- source_word: Ὁ κύριος
  choice: ஆண்டவர்
  rationale: அதிகாரத்தையும் ஆண்டகைத்தன்மையையும் தாங்கிய κύριος என்ற பட்டப்பெயருக்கான வழக்கமான புதிய ஏற்பாட்டுத் தமிழ் இணைச்சொல். ‘எஜமான்’ என்ற சமூக அதிகார நுணுக்கமுள்ள மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καλῶς λέγετε
  choice: நீங்கள் சொல்வது சரியே
  rationale: சீடர்கள் பயன்படுத்திய பட்டப்பெயர்கள் சரியானவை என்ற இயேசுவின் மதிப்பீட்டை இயல்பான நவீனத் தமிழில் தருகிறது; ‘நன்றாகச் சொல்கிறீர்கள்’ என்பதில் எழக்கூடிய பேச்சுத் திறன் குறித்த தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: εἰμὶ γάρ
  choice: ஏனெனில் நான் அவ்வாறே இருக்கிறேன்
  rationale: இயேசுவின் சுருக்கமான சுய உறுதிப்பாட்டைப் பேணுகிறது; அவர் அந்தப் பட்டப்பெயர்களுக்கு உரியவர் என்பதற்கு மேலான விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவுக்குரிய κύριος என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இவ்வசனத்தில் சீடர்கள் தமக்குப் பயன்படுத்தும் κύριος என்ற பட்டப்பெயரை இயேசு உறுதிப்படுத்துகிறார். ‘ஆண்டவர்’ அதன் புதிய ஏற்பாட்டுத் தெய்வவியல் நிறையையும் அதிகாரப் பொருளையும் காக்கிறது; அதேவேளையில் ‘எஜமான்’ என்ற சாத்தியமான சமூக உறவுப் பொருள் அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. பட்டப்பெயர்கள் மேற்கோள் குறிகளால் வேறுபடுத்தப்பட்டுள்ளன; கிரேக்கத்தின் சுருக்கமும் இறையியல் பதற்றமும் தேவையற்ற விளக்கமின்றி காக்கப்பட்டுள்ளன.
