source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: ta
  text: சிறு பிள்ளைகளே, இன்னும் சிறிது காலம் நான் உங்களோடு இருக்கிறேன். நீங்கள் என்னைத் தேடுவீர்கள். ‘நான் போகிற இடத்திற்கு நீங்கள் வர இயலாது[b]’ என்று யூதர்களிடம்[a] நான் சொன்னதுபோல, இப்போது உங்களிடமும் சொல்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதத் தலைவர்களிடம்.’ யோவான் நற்செய்தியில் ‘யூதர்கள்’ என்ற சொல் சில சூழல்களில் குறிப்பாக யூதேய அதிகாரிகளைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது இன்னும் எளிமையாக, ‘நீங்கள் வர முடியாது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: சிறு பிள்ளைகளே
  rationale: அழைப்புவடிவிலுள்ள இச்சொல் குடும்ப உறவையும் கனிவான பாசத்தையும் காட்டும் சிறுமைப்பொருளையும் கொண்டது. ‘சிறு பிள்ளைகளே’ என்பது அந்த உருவகத்தையும் பாசத் தொனியையும் காக்கிறது.
- source_word: ἔτι μικρόν
  choice: இன்னும் சிறிது காலமே
  rationale: மீதமுள்ள காலம் மிகக் குறுகியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘மே’ என்பது அந்தக் குறுகிய காலத்தை வலியுறுத்துகிறது.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: நான் உங்களோடு இருப்பேன்
  rationale: கிரேக்கத்தில் நிகழ்காலமாக இருந்தாலும், ἔτι μικρόν என்பதுடன் சேர்ந்து மீதமுள்ள குறுகிய காலத்தைச் சுட்டுகிறது. தமிழில் ‘இருப்பேன்’ என்பது இந்த உடனடியான எதிர்காலக் காலவரம்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ζητήσετέ με
  choice: நீங்கள் என்னைத் தேடுவீர்கள்
  rationale: ζητέω என்பதன் எதிர்கால வடிவை நேரடியாகவும் யோவானின் கருத்து நிறைந்த பயன்பாட்டிற்கு ஏற்றவாறும் மொழிபெயர்க்கிறது.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: யூதர்களிடம் நான் சொன்னதுபோல
  rationale: Ἰουδαίοις என்பதைச் சூழல் கட்டாயப்படுத்தாமல் ‘யூதத் தலைவர்கள்’ என்று குறுக்காமல், அதன் நேரடிப் பொருளான ‘யூதர்கள்’ எனக் காக்கிறது; καθώς என்பதன் ஒப்பீடும் தெளிவாகிறது.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: நான் போகிற இடத்திற்கு
  rationale: ὑπάγω இங்கு புறப்பட்டுச் செல்வதைக் குறிக்கிறது. தமிழில் ‘நான் போகிற இடம்’ என்பது இயல்பாகவும் போதுமான தெளிவுடனும் உள்ளது.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: நீங்கள் வர இயலாது
  rationale: δύνασθε என்பதிலுள்ள இயலாமை அல்லது அணுக முடியாமை என்ற கருத்தை ‘வர முடியாது’ என்பதைக் காட்டிலும் சற்று முறையான வகையில் காக்கிறது.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: இப்போது உங்களிடமும் சொல்கிறேன்
  rationale: முன்பு யூதர்களிடம் கூறியதை இப்போது சீடர்களிடமும் கூறுகிறார் என்ற இணைப்பை ‘உங்களிடமும்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியின் சூழலில் Ἰουδαίοις என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள்
  rationale: கிரேக்கச் சொல் நேரடியாக ‘யூதர்கள்’ என்று பொருள்படும். யோவானில் சில இடங்களில் அது குறிப்பாக யூதேய அதிகாரிகளைச் சுட்டக்கூடும்; ஆனால் இந்த வசனம் மட்டும் அதன் பொருளை அவ்வாறு குறுக்கக் கட்டாயப்படுத்தவில்லை. ஆகவே பிரதான உரை மூலத்தின் பரந்த சொல்லாட்சியைக் காக்கிறது; சூழல்சார் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: οὐ δύνασθε ἐλθεῖν என்பதில் இயலாமையின் தன்மை
  choice: நீங்கள் வர இயலாது
  alternative: நீங்கள் வர முடியாது
  rationale: இயலாமை நடைமுறை சார்ந்ததா, அனுமதி அல்லது அணுகல் சார்ந்ததா, வேறு வகையானதா என்பதை வசனம் இங்கே விரிவாகத் தீர்மானிக்கவில்லை. எனவே காரணத்தைச் சேர்க்காமல் மூலத்தின் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவின் கனிவான அழைப்பு ‘சிறு பிள்ளைகளே’ எனக் காக்கப்படுகிறது. மேற்கோளுக்குள் [b] இயலாமைச் சொற்றொடருக்குப் பின்னரும், [a] ‘யூதர்களிடம்’ என்பதற்குப் பின்னரும் வைக்கப்பட்டுள்ளன; இவ்வாறு ஒவ்வொரு அடிக்குறிப்பும் அது விளக்கும் சொல்லோடு சரியாக இணைகிறது.
