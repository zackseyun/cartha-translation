  naturalness: The Tamil is generally clear, modern, and appropriately respectful. ‘இன்னும் சிறிது காலம் நான் உங்களோடு இருக்கிறேன்’ is both natural Tamil and closer to the Greek temporal-present construction than ‘இருப்பேன்.’
  terminology: ‘சிறு பிள்ளைகளே,’ ‘யூதர்கள்,’ ‘வர இயலாது,’ and ‘யூதத் தலைவர்கள்’ are suitable. The footnotes are correctly anchored to the words they explain and preserve the contextual uncertainty surrounding Ἰουδαίοις.
