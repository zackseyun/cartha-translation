source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: ta
  text: '“நான் உங்களுக்கு ஒரு புதிய கட்டளையை[a] கொடுக்கிறேன்: நீங்கள் ஒருவருக்கொருவர் அன்புகூர வேண்டும். நான் உங்களை அன்புகூர்ந்ததுபோல, நீங்களும் ஒருவருக்கொருவர் அன்புகூர வேண்டும்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டளை’ என்பதற்கான கிரேக்கச் சொல் அதிகாரபூர்வமான அறநெறி ஆணையைக் குறிக்கிறது; இதை ‘ஆணை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதனை, “நான் உங்களை அன்புகூர்ந்ததுபோல, நீங்களும் ஒருவருக்கொருவர் அன்புகூரும்படியாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: கட்டளையை
  rationale: யோவானின் பயன்பாட்டில் உள்ள அதிகாரபூர்வமான அறநெறி வலிமையைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: καινὴν
  choice: புதிய
  rationale: கட்டளை எந்த வகையில் புதிது என்பதை விளக்கிச் சேர்க்காமல், கிரேக்கச் சொல்லின் நேரடியான பொருளையும் அதன் திறந்த தன்மையையும் காக்கிறது.
- source_word: δίδωμι ὑμῖν
  choice: நான் உங்களுக்குக் கொடுக்கிறேன்
  rationale: நிகழ்கால வினையையும், கட்டளையைப் பெறுகிறவர்களாகச் சீடர்கள் நேரடியாகக் குறிப்பிடப்படுவதையும் தக்கவைக்கிறது.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: நீங்கள் ஒருவருக்கொருவர் அன்புகூர வேண்டும்
  rationale: ἵνα இங்கு கட்டளையின் உள்ளடக்கத்தையும் நோக்கத்தையும் தெரிவிக்கிறது; ‘வேண்டும்’ என்பது தமிழில் அதன் கட்டளை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: அன்புகூர வேண்டும் / அன்புகூர்ந்தேன்
  rationale: ஒரே வேர்ச்சொல்லின் மறுபயன்பாட்டையும் வசனத்தின் அன்பு சார்ந்த வலியுறுத்தலையும் காக்க ஒரே தமிழ் வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பரச் செயலைத் தெளிவாகவும் dignified modern Tamil register-இலும் தெரிவிக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: καθὼς
  choice: அன்புகூர்ந்ததுபோல
  rationale: இயேசுவின் அன்பு சீடர்களுடைய அன்புக்கு ஒப்புமையாகவும் அளவுகோலாகவும் இருப்பதை ‘போல’ தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: நீங்களும் ஒருவருக்கொருவர் அன்புகூர வேண்டும்
  rationale: καὶ ὑμεῖς என்பதிலுள்ள ‘நீங்களும்’ என்ற வலியுறுத்தலையும், தொடரின் அறிவுறுத்தல் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘புதிய கட்டளை’ எந்தப் பொருளில் புதியது?
  choice: முதன்மை உரையில் ‘ஒரு புதிய கட்டளை’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: காலத்தில் புதியது; தரத்தில் புதியது; இயேசுவின் அன்பினால் புதிய நிறைவேற்றம் பெற்றது.
  rationale: இந்த வசனம் கட்டளையைப் ‘புதியது’ என்று அழைக்கிறது; ஆனால் அதன் புதுமையின் துல்லியமான இயல்பை இங்கே வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதை விளக்கிச் சேர்க்காமல் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: இரண்டாவது ἵνα தொடரின் இலக்கண உறவு
  choice: ‘நீங்களும் ... அன்புகூர வேண்டும்’ என்று அறிவுறுத்தல் வலிமையுடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீங்களும் ... அன்புகூரும்படியாக’ என்று நோக்கம் அல்லது விளைவை முன்னிறுத்தலாம்.
  rationale: ἵνα தொடரில் கட்டளை சார்ந்த அறிவுறுத்தலும் நோக்கம்/விளைவு சார்ந்த நிழற்பொருளும் இருக்க முடியும். முதன்மை உரை தமிழில் இயல்பான கட்டளை வலிமையை அளிக்கிறது; மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூர’ என்பது இயல்பான பேச்சுத் தமிழைவிட ஓரளவு உயர்ந்ததாக இருந்தாலும், வேதாகம உரைக்கு ஏற்றதும் ἀγαπάω வினையின் மறுபயன்பாட்டைத் தெளிவாகக் காக்கக்கூடியதுமாகும்.
