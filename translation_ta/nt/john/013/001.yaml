source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: ta
  text: பஸ்கா பண்டிகைக்கு முன்பு, இந்த உலகத்தை விட்டு தந்தையிடம் செல்ல வேண்டிய தமது நேரம் வந்துவிட்டது என்பதை அறிந்திருந்த இயேசு, உலகத்தில் இருந்த தமக்குரியவர்களிடம் அன்புகூர்ந்த அவர், அவர்களை முடிவுவரை[a] அன்புகூர்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுமையாக” அல்லது “உச்ச அளவுக்கு.” இந்தக் கிரேக்கச் சொற்றொடர் இறுதி நேரம்வரை நீடித்த அன்பையும் அதன் முழு அளவையும் ஒருங்கே குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: பஸ்கா பண்டிகைக்கு முன்பு
  rationale: πρό காலத்துக்கு முந்தியதைக் குறிக்கிறது; δέ மென்மையான உரையாடல் இணைப்பாக இருப்பதால் தமிழில் தனிச்சொல்லாகக் கட்டாயப்படுத்தப்படவில்லை. ἑορτή என்பதன் பண்டிகைப் பொருளும் πάσχα என்ற பெயரும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: εἰδὼς
  choice: அறிந்திருந்தார்
  rationale: இயேசுவின் அந்நேர விழிப்புணர்வைக் காட்டும் பங்கேற்புவினையை இயல்பான தமிழ் வாக்கியமாக வழங்குகிறது.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: தமது நேரம் வந்துவிட்டது
  rationale: யோவான் நூலில் வரும் தீர்மானிக்கப்பட்ட ‘நேரம்’ என்ற உருவகத்தையும், அது ஏற்கெனவே வந்திருந்தது என்ற நிலையையும் காக்கிறது.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: இந்த உலகத்தைவிட்டுத் தந்தையிடம் செல்லவேண்டிய
  rationale: μεταβαίνω குறிக்கும் இவ்வுலகிலிருந்து தந்தையிடம் நிகழும் மாற்றத்தைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; மரணம் அல்லது மகிமைப்படுதல் என்று தனியே விளக்கி வரையறுக்கவில்லை.
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: உலகத்தில் இருந்த தமக்குரியவர்கள்மேல் அன்புகூர்ந்த அவர்
  rationale: τοὺς ἰδίους என்பதைக் ‘சீடர்கள்’ என்று குறுக்காமல் அதன் பரந்த உறவுப்பொருளுடன் வழங்குகிறது; பங்கேற்புவினை அமைப்பும் இயல்பான தமிழில் காக்கப்படுகிறது.
- source_word: εἰς τέλος
  choice: முடிவுவரை
  rationale: சொற்றொடரின் நேரகாலப் பொருளை முதன்மை உரையில் காக்கிறது; ‘முழுமையாக/உச்ச அளவுக்கு’ என்ற தரப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἠγάπησεν αὐτούς
  choice: அவர்கள்மேல் அன்புகூர்ந்தார்
  rationale: ἀγαπάω என்பதன் நேரடியான அன்புப் பொருளைச் செயற்பாட்டு வடிவில் காக்கிறது.
theological_decisions:
- issue: εἰς τέλος என்பதன் கால மற்றும் நிறைவு சார்ந்த இரட்டைப் பொருள்
  choice: முதன்மை உரையில் ‘முடிவுவரை’
  alternative: ‘முழுமையாக’ அல்லது ‘உச்ச அளவுக்கு’
  rationale: கிரேக்கச் சொற்றொடர் இறுதிவரை நீடித்த அன்பையும் அன்பின் முழு அளவையும் குறிக்கக்கூடும். முதன்மை உரை நேரடியான வடிவை வைத்துக்கொண்டு, மற்ற உண்மையான பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தமக்குரியவர்கள்’ என்பது சீடர்களாக மட்டும் பொருளைக் குறுக்காமல் கிரேக்கத்தின் உறவுசார் பரப்பைத் தக்கவைக்கிறது. ‘தந்தை’ என்பது யோவானின் இறையியல் தலைப்பை இயல்பாகக் காக்கிறது.
