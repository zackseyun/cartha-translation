source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: ta
  text: சீமோன் பேதுரு அவரிடம், “ஆண்டவரே, நீர் எங்கே போகிறீர்?” என்று கேட்கிறார். இயேசு, “நான் போகும் இடத்திற்கு இப்போது உன்னால் என்னைப் பின்பற்ற முடியாது[a]; ஆனால் பிற்பாடு என்னைப் பின்பற்றுவாய்[b]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போது நீ என்னைப் பின்பற்ற இயலாது.” கிரேக்க மொழியில் திறன் அல்லது இயலாமையைக் குறிக்கும் வினைச்சொல் வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பிற்பாடு என்னைப் பின்பற்றுவாய்” என்பது பேதுரு பின்னர் இயேசுவைப் பின்பற்றித் துன்பப்படுவதையோ மரிப்பதையோ சுட்டிக்காட்டலாம்; ஆனால் இந்தச் சொற்றொடர் அது எவ்வாறு நிகழும் என்று குறிப்பிடவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: கேட்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்காலமாக வைத்திருக்கிறது. பேதுருவின் சொல் கேள்வியாக இருப்பதால், இயல்பான தமிழில் ‘கேட்கிறார்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை மரியாதையுடன் நேரடியாக அழைக்கும் பட்டத்தையும் அதன் இறையியல் ஒலிநயத்தையும் காக்கிறது.
- source_word: ποῦ ὑπάγεις
  choice: நீர் எங்கே போகிறீர்?
  rationale: ὑπάγω என்பதன் பொதுவான ‘போ’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இலக்கை விளக்கிச் சேர்க்கவில்லை.
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: உரையாடலில் ἀποκρίνομαι என்பதற்கான தெளிவான, மரியாதைமிக்க தமிழ் நடை.
- source_word: Ὅπου ὑπάγω
  choice: நான் போகும் இடத்திற்கு
  rationale: பேதுருவின் கேள்வியிலுள்ள ‘போகிறீர்’ என்ற வினையுடன் உள்ள சொல் தொடர்பைக் காத்து, பின்பற்றிச் செல்லும் இலக்கைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: இப்போது உன்னால் என்னைப் பின்பற்ற முடியாது
  rationale: δύναμαι குறிப்பிடும் திறன் அல்லது இயலாமையை ‘உன்னால்… முடியாது’ என்று வெளிப்படையாகக் காக்கிறது. ‘என்னைப் பின்பற்ற’ என்பது உடன் செல்லுதல் மற்றும் சீடராகப் பின்பற்றுதல் ஆகிய இரு சாத்திய நிழற்பொருள்களையும் திறந்துவைக்கிறது.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: ஆனால் பிற்பாடு என்னைப் பின்பற்றுவாய்
  rationale: எதிர்கால வினையையும், ‘இப்போது இல்லை—பிற்பாடு’ என்ற δέ குறிக்கும் முரண்பாட்டையும் காக்கிறது. யோவான் 13:36-இன் சூழலில் புரியும் பொருளைத் தெளிவுபடுத்த ‘என்னைப்’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பேதுரு பிற்பாடு இயேசுவைப் பின்பற்றுவார் என்பதன் குறிப்பு
  choice: அது எவ்வகையில் நிறைவேறும் என்பதை முதன்மை உரையில் குறிப்பிடாமல், ‘பிற்பாடு என்னைப் பின்பற்றுவாய்’ என்று திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
  alternative: பேதுருவின் பிற்காலத் துன்பம் அல்லது மரணம், உயிர்த்தெழுதலுக்குப் பிந்தைய சீடத்துவம், அல்லது இறுதியில் இயேசுவுடன் சேர்தல் என்று குறிப்பாக விளக்குதல்.
  rationale: கிரேக்க வாசகம் பின்பற்றுதல் எவ்வாறு நிகழும் என்று சொல்லவில்லை. ஆகவே அதன் கதைசார் மற்றும் இறையியல் பன்முகத்தன்மை மொழிபெயர்ப்பில் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவிடம் பேசும்போது ‘நீர்’ என்றும், இயேசு பேதுருவிடம் பேசும்போது இயல்பான ஒருமை ‘உன்/உன்னை’ வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் வரலாற்று நிகழ்காலமும் பின்னர் வரும் இறந்தகாலப் பதிலும் இயன்றவரை காக்கப்பட்டுள்ளன.
