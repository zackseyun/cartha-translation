base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: ta
  text: '“மெய்யாகவே, மெய்யாகவே, நான் உங்களுக்குச் சொல்கிறேன்: நான் யாரை அனுப்பினாலும், அவரை ஏற்றுக்கொள்கிறவர் என்னை ஏற்றுக்கொள்கிறார்; என்னை ஏற்றுக்கொள்கிறவர் என்னை அனுப்பியவரை[a] ஏற்றுக்கொள்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “என்னை அனுப்பியவர்” என்பது பிதாவைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: மெய்யாகவே, மெய்யாகவே
  rationale: இருமுறை வரும் வலியுறுத்தலையும் இயேசுவின் சிறப்பான உறுதிமொழித் தொடக்கத்தையும் இயல்பான, மரியாதையான தமிழில் காக்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நிகழ்கால வினையையும் பன்மை இரண்டாம் நபர் சுட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὁ λαμβάνων ἄν τινα πέμψω
  choice: நான் யாரை அனுப்பினாலும், அவரை ஏற்றுக்கொள்கிறவர்
  rationale: ἄν, τινα, மற்றும் subjunctive πέμψω ஆகியவை தரும் வரையறுக்கப்படாத, திறந்த பொதுப்பொருளை ‘யாரை … அனுப்பினாலும்’ தெளிவாக வெளிப்படுத்துகிறது; ஆண்பாலுக்கு மட்டும் பொருந்துவது போன்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
- source_word: λαμβάνει
  choice: ஏற்றுக்கொள்கிறார்
  rationale: ஒரு நபரை வரவேற்று அங்கீகரித்து ஏற்றுக்கொள்ளும் பொருளைத் தருகிறது. வசனம் முழுவதும் ஒரே சொல்லை மீண்டும் பயன்படுத்தி, அனுப்பப்பட்டவர்–இயேசு–அனுப்பியவர் என்ற பிரதிநிதித்துவச் சங்கிலியைப் பாதுகாக்கிறது.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: என்னை ஏற்றுக்கொள்கிறவர்
  rationale: δέ இங்கு வலுவான எதிர்மறை இணைப்பாக அல்லாமல் தொடர்ச்சியை முன்னெடுக்கும் மென்மையான இணைப்பாக உள்ளது; தமிழில் அரைப்புள்ளி அந்த இணைநிலையை இயல்பாகக் காட்டுகிறது.
- source_word: τὸν πέμψαντά με
  choice: என்னை அனுப்பியவர்
  rationale: மூலத்தின் தொடர்புசார் சொல்லாக்கத்தைத் தக்கவைக்கிறது; வசனத்தில் வெளிப்படையாக இல்லாத ‘பிதா’ என்ற பட்டத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘என்னை அனுப்பியவர்’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘என்னை அனுப்பியவர்’; அடிக்குறிப்பில் பிதா என்று விளக்கம்
  alternative: ‘என்னை அனுப்பிய பிதா’
  rationale: யோவான் நற்செய்தியின் சூழலில் இது பிதாவைக் குறிக்கிறது. ஆனால் இவ்வசனம் தானே ‘பிதா’ என்ற பட்டத்தைப் பயன்படுத்தாமல் அனுப்பியவர் என்ற தொடர்புசார் மொழியையே பயன்படுத்துவதால், அந்த மொழி முதன்மை உரையில் காக்கப்படுகிறது.
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமை participle-கள்
  choice: ‘யாரை … அனுப்பினாலும்’ மற்றும் ‘ஏற்றுக்கொள்கிறவர்’
  alternative: ‘ஏற்றுக்கொள்கிற மனிதன்’ அல்லது ஆண்பால் குறிப்புள்ள வடிவம்
  rationale: இங்குள்ள இலக்கண ஆண்பால் ஆண்களை மட்டும் குறிப்பதல்ல; எல்லாருக்கும் பொருந்தும் பொதுப்பொருள் தமிழில் பாலின வரம்பின்றி வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைக் கொண்டுள்ளது. ‘மெய்யாகவே’ என்பது யோவானில் மீண்டும் வரும் ἀμήν சூத்திரத்தின் தனித்தன்மையைப் பேணுகிறது; ‘ஏற்றுக்கொள்கிறார்’ என்ற மீளுரைத்தல் மூலத்தின் கருத்துச் சங்கிலியைத் தெளிவாக்குகிறது.
