id: JHN.13.5
reference: John 13:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: ta
  text: பின்பு அவர் ஒரு கழுவும் பாத்திரத்தில் தண்ணீர் ஊற்றி, சீடர்களுடைய கால்களைக் கழுவவும், தாம் இடுப்பில் கட்டியிருந்த துண்டால் அவற்றைத் துடைக்கவும் தொடங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα
  choice: பின்பு
  rationale: கதையில் அடுத்தடுத்து நிகழும் செயலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: βάλλει ὕδωρ εἰς τὸν νιπτῆρα
  choice: ஒரு கழுவும் பாத்திரத்தில் தண்ணீர் ஊற்றி
  rationale: βάλλει என்பதன் பொதுப்பொருள் ‘இடுதல்’ என்றாலும், தண்ணீரைப் பாத்திரத்தில் செலுத்தும் சூழலில் ‘ஊற்றி’ என்பது இயல்பான பொருள்; νιπτήρ கழுவுவதற்குரிய பாத்திரத்தைக் குறிக்கிறது.
- source_word: ἤρξατο νίπτειν
  choice: கழுவவும் … தொடங்கினார்
  rationale: ἤρξατο உடன் வரும் நிகழ்கால infinitive செயல் தொடங்கியதைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: சீடர்களுடைய கால்களை
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐκμάσσειν
  choice: துடைக்கவும்
  rationale: தேய்த்துத் துடைத்தல் அல்லது உலர்த்துதல் என்னும் பொருளைச் சூழலுக்கேற்ற பொதுவான தமிழில் தருகிறது.
- source_word: τῷ λεντίῳ
  choice: துண்டால்
  rationale: λεντίον இங்கு துடைப்பதற்கும் இடுப்பில் கட்டிக்கொள்வதற்கும் பயன்படுத்தப்பட்ட துணியைக் குறிக்கிறது; ‘துண்டு’ இயல்பான நவீனத் தமிழ்.
- source_word: ᾧ ἦν διεζωσμένος
  choice: தாம் இடுப்பில் கட்டியிருந்த
  rationale: διαζώννυμι குறிக்கும் சுற்றிக் கட்டிக்கொள்ளும் செயலை, பழமையான ‘அரைக்கச்சை கட்டுதல்’ போன்ற சொல்லாட்சியின்றி தெளிவாக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. கிரேக்கத்தில் βάλλει நிகழ்காலமாகவும் ἤρξατο இறந்தகாலமாகவும் வரும் காலமாற்றம் யோவானின் உயிரோட்டமான கதைநடை அம்சம்; தமிழில் இயல்பான ஒருங்கிணைந்த இறந்தகாலத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது. ‘கால்’ தமிழில் பாதத்தையும் உள்ளடக்குவதால் பொதுவாசகருக்கு இயல்பானதாகத் தேர்ந்தெடுக்கப்பட்டது.
