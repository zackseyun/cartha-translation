base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: ta
  text: நிக்கொதேமுவும் வந்தார்; முன்பு இரவில் இயேசுவிடம் வந்தவரே அவர். அவர் வெள்ளைப்போளமும் அலோய மரப்பொருளும் கலந்த கலவையை, ஏறக்குறைய நூறு லித்ரா[a] அளவு கொண்டுவந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு லித்ரா என்பது ஏறக்குறைய 327 கிராம் எடையுள்ள ரோமப் பவுண்டு. நூறு லித்ரா என்பது சுமார் 32–33 கிலோகிராம்.
    reason: cultural_note
  - marker: b
    text: இது நிக்கொதேமு முன்பு இரவில் இயேசுவிடம் வந்த நிகழ்வை நினைவூட்டுகிறது; யோவான் 3:1–2ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ Νικόδημος
  choice: நிக்கொதேமுவும் வந்தார்
  rationale: καί என்பதன் சேர்க்கைப் பொருளை ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது; δέ இங்கு மென்மையான தொடரிணைப்பு என்பதால் தனிச் சொல்லாக மிகைப்படுத்தப்படவில்லை.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: இவர்தான் முன்பு இரவில் இயேசுவிடம் வந்தவர்
  rationale: பெயரெச்சத் தொடர் நிக்கொதேமுவை அடையாளப்படுத்தி யோவான் 3:1–2 நிகழ்வை நினைவூட்டுகிறது. τὸ πρῶτον என்பதற்கு இச்சூழலில் ‘முன்பு’ இயல்பானது. αὐτόν குறிக்கும் நபரைத் தமிழில் தெளிவுபடுத்த ‘இயேசு’ பயன்படுத்தப்பட்டது.
- source_word: φέρων
  choice: கொண்டுவந்தார்
  rationale: நிக்கொதேமு வரும்போது உடன் எடுத்துவந்ததை இயல்பான தமிழில் attendant circumstance ஆகக் காட்டுகிறது.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: வெள்ளைப்போளமும் அகிலும் கலந்த கலவை
  rationale: σμύρνη என்பது நறுமணப் பிசினான வெள்ளைப்போளம்; ἀλόη இங்கு அடக்கத்திற்குப் பயன்படுத்திய நறுமணமிக்க அகில் மரப்பொருளைக் குறிக்கிறது, நவீன சோற்றுக்கற்றாழையை அல்ல. μίγμα என்பதன் ‘கலவை’ பொருள் காக்கப்பட்டது.
- source_word: ὡς λίτρας ἑκατόν
  choice: ஏறக்குறைய நூறு லித்ரா
  rationale: ὡς அளவின் தோராயத்தைக் குறிக்கிறது. பழங்கால ரோம எடை அலகை நவீன அலகாகத் தவறாக ஒப்பாக்காமல் ‘லித்ரா’ என ஒலிபெயர்த்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: அடையாளத் தொடரிலுள்ள αὐτόν யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘இயேசுவிடம்’ என்று தெளிவுபடுத்தப்பட்டது
  alternative: ‘அவரிடம்’ என்று மூலத்தின் பிரதிப்பெயர் வடிவத்தையே வைத்தல்
  rationale: யோவான் 3:1–2ஐ நினைவூட்டும் கதைச் சூழலில் αὐτόν இயேசுவையே தெளிவாகக் குறிக்கிறது; தமிழில் ‘அவரிடம்’ என்பது நிக்கொதேமுவைக் குறிக்கிறதுபோல் தற்காலிக குழப்பத்தை ஏற்படுத்தலாம்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தாவரப் பொருட்களின் அடக்கச் சூழலைத் தெளிவாகக் காட்ட ‘வெள்ளைப்போளம்’, ‘அகில்’ ஆகிய மரபான தமிழ் சொற்கள் தேர்ந்தெடுக்கப்பட்டன. எல்லா அடிக்குறிப்புக் குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
