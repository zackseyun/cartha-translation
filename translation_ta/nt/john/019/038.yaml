source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, அரிமத்தியாவைச் சேர்ந்த யோசேப்பு, இயேசுவின் சீடராக இருந்தும் யூதர்களுக்குப் பயந்து[a] தம் சீடத்துவத்தை மறைத்து வைத்திருந்தவர், இயேசுவின் உடலை எடுத்துச் செல்ல அனுமதிக்கும்படி பிலாத்துவிடம் வேண்டினார். பிலாத்து அனுமதி அளித்தான். ஆகவே யோசேப்பு வந்து இயேசுவின் உடலை எடுத்துச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “யூதர்கள்” என்பது, சூழலின்படி இன்னும் குறிப்பாக இயேசுவை எதிர்த்த யூதேய/யூத அதிகாரிகளைக் குறிக்கலாம். யோவான் இச்சொல்லை எல்லா யூத மக்களையும் வேறுபாடின்றிக் குறிப்பதற்காக எப்போதும் பயன்படுத்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: ταῦτα என்பதன் பன்மையையும் யோவானின் நிகழ்வுத் தொடரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: அரிமத்தியாவைச் சேர்ந்த
  rationale: ἀπό குறிக்கும் ஊர்/பிறப்பிடத் தொடர்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: அவர் இயேசுவின் சீடராக இருந்தும்
  rationale: பங்கேற்புவினை அமைப்பை வாசிக்க எளிய தொடர்புடைய கூறாக மாற்றி, μαθητής என்பதற்கு வழக்கமான ‘சீடர்’ என்பதைப் பயன்படுத்துகிறது.
- source_word: κεκρυμμένος
  choice: அதை மறைத்து வைத்திருந்தவர்
  rationale: மறைக்கப்பட்டிருந்தது அவருடைய சீடத்துவம் என்பதைச் சூழலிலிருந்து தெளிவாக்கி, நிறைவுற்று தொடரும் நிலையை ‘மறைத்து வைத்திருந்த’ எனக் காட்டுகிறது.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: யூதர்களுக்குப் பயந்து
  rationale: காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; Ἰουδαίων என்ற மூலச்சொல்லின் பரந்த/சிக்கலான குறிப்பை முதன்மை உரையில் குறுக்கவில்லை.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: இயேசுவின் உடலை எடுத்துச் செல்ல அனுமதி கேட்டுப்
  rationale: ἵνα நோக்கத்தையும் αἴρω இங்கு உடலை அகற்றி எடுத்துச் செல்வதைக் குறிக்கும் பொருளையும் இயல்பான தமிழ் வேண்டுகோள் அமைப்பில் தருகிறது.
- source_word: ἠρώτησεν τὸν Πιλᾶτον
  choice: பிலாத்துவிடம் வேண்டினார்
  rationale: இது தகவல் கேள்வி அல்ல, அதிகாரியிடம் வைக்கும் வேண்டுகோள் என்பதைக் காட்டுகிறது; மரியாதைச் சொல் யோசேப்பைக் குறிக்கிறது.
- source_word: ἐπέτρεψεν ὁ Πιλᾶτος
  choice: பிலாத்து அனுமதி கொடுத்தான்
  rationale: வினையின் அனுமதி வழங்கும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: ஆகவே அவர் வந்து இயேசுவின் உடலை எடுத்துச் சென்றார்
  rationale: οὖν என்பதன் விளைவு/தொடர்ச்சி தொடர்பையும் மீண்டும் வரும் αἴρω வினையின் பொருளையும் காக்கிறது; αὐτοῦ-வின் குறிப்பு குழப்பமின்றி இருக்க ‘இயேசுவின்’ என வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் τῶν Ἰουδαίων என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று மொழிபெயர்த்து, சூழலுக்குரிய குறுகிய பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’ என்று முதன்மை உரையிலேயே குறுக்குதல்
  rationale: மூலத்தின் உண்மையான சொல் மற்றும் அதன் யோவானியச் சிக்கலைப் பாதுகாக்கிறது; அதே நேரத்தில் எல்லா யூத மக்களையும் வேறுபாடின்றிக் குறிக்கிறது என்ற தவறான புரிதலை அடிக்குறிப்பு தடுக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. யோசேப்புக்கு மரியாதைப் பன்மையும் பிலாத்துக்கு ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறி தொடர்புடைய ‘யூதர்கள்’ என்பதற்குப் பின் வர வேண்டும் என்பதால் வெளியீட்டு உரையில் குறியை அந்தச் சொல்லுடன் இணைப்பது விரும்பத்தக்கது.
