source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: ta
  text: ஆகவே, இயேசு சிலுவையில் அறையப்பட்ட இடம் நகரத்திற்கு அருகில் இருந்ததால், யூதர்களில் பலர் அந்த அறிவிப்பைப் படித்தார்கள். அது எபிரெய மொழியிலும்[a], இலத்தீன் மொழியிலும், கிரேக்க மொழியிலும் எழுதப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரமேய மொழியில்’ என்றும் பொருளாகலாம்; யோவான் உள்ளூர் செமித்திய மொழியைக் குறிப்பிட ‘எபிரெய’ என்ற சொல்லைப் பயன்படுத்துகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: அறிவிப்பு
  rationale: சிலுவையில் அறையப்பட்டவரைப் பற்றிக் காட்சிக்கு வைக்கப்பட்ட எழுத்துப் பலகையின் செய்தியை இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘அறிவிப்பு’ இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: யூதர்களில் பலர்
  rationale: முழுக் குழுவையும் பொதுமைப்படுத்தாமல், பகுதியைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளைத் துல்லியமாகப் பேணுகிறது.
- source_word: ἀνέγνωσαν
  choice: படித்தார்கள்
  rationale: எழுதப்பட்டிருந்த செய்தியை வாசித்த எளிய செயலைக் குறிக்கிறது; ‘சத்தமாக வாசித்தார்கள்’ என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: இடம் நகரத்திற்கு அருகில் இருந்ததால்
  rationale: கிரேக்கத்தின் காரணவாக்கியத் தொடர்பையும் ‘நகரத்திற்கு அருகில்’ என்ற நேரடியான பொருளையும் இயல்பான தமிழில் தருகிறது; நகரவாசல் போன்ற கூடுதல் விவரம் சேர்க்கப்படவில்லை.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: இயேசு சிலுவையில் அறையப்பட்ட இடம்
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, செயலைச் செய்தவர்களை வெளிப்படையாகச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: ἦν γεγραμμένον
  choice: எழுதப்பட்டிருந்தது
  rationale: எழுதி வைக்கப்பட்டதன் தொடரும் நிலையை உணர்த்தும் நிறைவுப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἑβραϊστί
  choice: எபிரெய மொழியில்
  rationale: மூலத்தின் நேரடியான மொழிப்பெயரை முதன்மை உரையில் பேணுகிறது; யோவானின் பயன்பாட்டில் அரமேய மொழியைக் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ῥωμαϊστί
  choice: இலத்தீன் மொழியில்
  rationale: சொல்லளவில் ‘ரோம மொழியில்’ என்றாலும், குறிக்கப்படும் மொழி இலத்தீன் என்பதால் தமிழில் தெளிவாக இவ்வாறு தரப்படுகிறது.
- source_word: Ἑλληνιστί
  choice: கிரேக்க மொழியில்
  rationale: மொழியைக் குறிக்கும் கிரேக்க வினையடையின் நேரடியான, தெளிவான தமிழ் வடிவம்.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்துடனான கதை மற்றும் காரணத் தொடர்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவானின் பயன்பாட்டில் Ἑβραϊστί என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘எபிரெய மொழி’
  alternative: ‘அரமேய மொழி’
  rationale: கிரேக்க உரை நேரடியாக ‘எபிரெய’ எனக் கூறுவதால் அதையே முதன்மை உரை பேணுகிறது. அக்கால உள்ளூர் செமித்திய பேச்சுமொழியான அரமேயத்தைக் குறித்திருக்கலாம் என்ற உண்மையான மொழியியல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதர்களில் பலர்’ என்பது பகுதியைக் குறிக்கும் மூல அமைப்பைப் பேணுகிறது. மூன்று மொழிகளும் தமிழில் வழக்கமான பெயர்களால் குறிப்பிடப்பட்டுள்ளன; உண்மையான மொழியியல் ஐயம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
