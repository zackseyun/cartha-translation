  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: ta
  text: ஆனால், படைவீரர்களில் ஒருவன் ஈட்டியால்[a] இயேசுவின் பக்கவாட்டைக் குத்தினான்; உடனே இரத்தமும் தண்ணீரும் வெளியே வந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேலால்.’
    reason: lexical_alternative
  - marker: b
    text: ‘இரத்தமும் தண்ணீரும்’ என்பதைச் சில விளக்கவுரையாளர்கள் குறியீட்டு அல்லது திருச்சடங்கு சார்ந்த பொருளில் புரிந்துகொள்கிறார்கள்; மற்றவர்கள் இதை ஓர் உடலியல் விவரிப்பாகக் கருதுகிறார்கள். இங்கே இதன் முக்கியத்துவத்தை மூல கிரேக்க உரை விளக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் இயேசுவின் கால்கள் முறிக்கப்படவில்லை என்று கூறப்பட்டதற்கு மாறாக அடுத்து நடந்ததை இயல்பாகக் காட்டுகிறது.
- source_word: εἷς τῶν στρατιωτῶν
  choice: படைவீரர்களில் ஒருவன்
  rationale: கிரேக்க மொழியிலுள்ள பகுதிப்பொருள் அமைப்பைப் பாதுகாத்து, ‘ஒரு படைவீரன்’ என்று பொதுமைப்படுத்தாமல் மொழிபெயர்க்கிறது.
- source_word: λόγχῃ
  choice: ஈட்டியால்
  rationale: ஒரு படைவீரன் பயன்படுத்திய குத்தும் ஆயுதத்தைக் குறிக்கும் தெளிவான, நவீனத் தமிழ்ச் சொல்.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: அவருடைய பக்கவாட்டை
  rationale: பிரதிப்பெயரைத் தக்கவைத்து, πλευρά என்பதன் ‘உடலின் பக்கம்’ என்ற பொருளை ‘விலா’ அல்லது குறிப்பிட்ட உடற்கூறு என மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: ἔνυξεν
  choice: குத்தினான்
  rationale: கூர்மையான ஆயுதத்தால் துளைத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; காயத்தின் தன்மையை மூலத்தைவிட அதிகமாக விவரிக்கவில்லை.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: உடனே ... வெளியே வந்தன
  rationale: εὐθύς என்பதன் உடனடி காலப்பொருளையும், நிகழ்வின் தொடர்ச்சியையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: αἷμα καὶ ὕδωρ
  choice: இரத்தமும் தண்ணீரும்
  rationale: வழக்கத்திற்கு மாறான மூலச் சொற்றொடரை எந்த மருத்துவ அல்லது சமயவிளக்கமும் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘இரத்தமும் தண்ணீரும்’ என்பதைத் திருவருட்சாதனக் குறியீடாகவோ உடலியல் நிகழ்வாகவோ முதன்மை உரையில் விளக்குவதா
  choice: எந்த விளக்கமும் சேர்க்காமல் ‘இரத்தமும் தண்ணீரும்’ என்ற நேரடிச் சொற்றொடரைத் தக்கவைத்தல்
  alternative: இதைத் திருமுழுக்கு மற்றும் திருவிருந்து சார்ந்த குறியீடாகவோ, காயத்தின் உடலியல் விளைவாகவோ வெளிப்படையாக விளக்குதல்
  rationale: இவ்வசனம் நிகழ்வைக் கூறுகிறது; அதன் முக்கியத்துவத்தைத் தானாக விளக்கவில்லை. எனவே மூல உரையிலுள்ள இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு தீர்மானித்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘பக்கவாட்டு’ என்பது உடலின் பக்கத்தைக் குறித்தாலும் தேவையற்ற உடற்கூறியல் துல்லியத்தைத் தவிர்க்கிறது; விளக்கவுரை அடிக்குறிப்புக்கு மட்டும் ஒதுக்கப்பட்டுள்ளது.
