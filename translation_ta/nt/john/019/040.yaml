source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: ta
  text: ஆகவே, அவர்கள் இயேசுவின் உடலை எடுத்து, நறுமணப் பொருள்களுடன் துணிப் பட்டைகளால் சுற்றிக் கட்டினார்கள்; யூதர்களின்[a] அடக்க வழக்கத்தின்படி அவ்வாறு செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயர்களின் அடக்க வழக்கம்” என்றும் மொழிபெயர்க்கலாம்; இங்கு யூத மக்களின் பொதுவான அடக்க வழக்கைக் குறிப்பதே சூழலுக்கு அதிகம் பொருந்துகிறது.
    reason: Ἰουδαῖοι என்ற சொல் இன-மத அடையாளமான “யூதர்கள்” அல்லது புவியியல் அடையாளமான “யூதேயர்கள்” என்று பொருள்படக்கூடியது.
lexical_decisions:
- source_word: ἔλαβον
  choice: எடுத்தார்கள்
  rationale: அடக்கத்திற்காக இயேசுவின் உடலைத் தங்கள் பொறுப்பில் எடுத்துக்கொண்டதைக் குறிக்கிறது; இச்சூழலில் இயல்பான தமிழாக்கம்.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தின் நிகழ்விலிருந்து வரும் விளைவைச் சுட்டும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: இறந்த உடலைக் குறித்தாலும், கிரேக்கம் கடுமையான ‘பிணம்’ என்ற சொல்லை வேண்டவில்லை; ‘உடல்’ துல்லியமும் கண்ணியமும் உடையது.
- source_word: ἔδησαν
  choice: சுற்றினார்கள்
  rationale: அடக்கத் துணிகளால் கட்டிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘கட்டினார்கள்’ என்பதைக் காட்டிலும் இச்சடங்குச் சூழலில் பொருத்தமானது.
- source_word: ὀθονίοις
  choice: துணிப் பட்டைகளால்
  rationale: பன்மையில் வரும் சிறிய துணிகள் அல்லது துணிப் பட்டைகளைக் குறிக்கிறது. கிரேக்கச் சொல் தானாகவே துணியின் மூலப்பொருளை வெளிப்படையாகக் கூறாததால் ‘லினன்’ என்று சேர்க்கப்படவில்லை.
- source_word: ἀρώματα
  choice: நறுமணப் பொருள்கள்
  rationale: அடக்கத்தில் பயன்படுத்தப்பட்ட மணமுள்ள கலவைகள் அல்லது பொருள்களைப் பொதுவாகவும் தெளிவாகவும் குறிக்கிறது; ‘நறுமணத் திரவியங்கள்’ என்பதைக் காட்டிலும் நவீன வாசகருக்கு இயல்பானது.
- source_word: καθὼς
  choice: இது ... வழக்கம்
  rationale: அவர்கள் செய்த செயல் நிலவும் அடக்க வழக்கத்துக்கு ஏற்ப இருந்தது என்ற ஒப்புமையை இயல்பான இரண்டு தமிழ் வாக்கியங்களில் வெளிப்படுத்துகிறது.
- source_word: ἔθος ἐστὶν
  choice: வழக்கம்
  rationale: தொடர்ந்து கடைப்பிடிக்கப்படும் மரபுச் செயலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்கள்
  rationale: இங்கு யூத மக்களின் பொதுவான அடக்க நடைமுறையே குறிக்கப்படுகிறது; யூதேயப் பகுதி மக்களை மட்டும் அல்ல.
- source_word: ἐνταφιάζειν
  choice: அடக்கம் செய்யும்
  rationale: இச்சொல் உடலை அடக்கத்திற்காக ஆயத்தப்படுத்துவதையும் அடக்கம் செய்வதையும் உள்ளடக்கலாம்; தமிழில் இந்தச் சொற்றொடர் அந்த இறுதிச்சடங்குச் சூழலை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: τοῖς Ἰουδαίοις என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: இங்கு புவியியல் அடையாளத்தைவிட யூத மக்களிடையே நிலவிய அடக்க வழக்கமே மையமாக உள்ளது. மாற்றுப் பொருள் உண்மையான சொற்பொருள் வாய்ப்பாக இருப்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐνταφιάζειν என்பதன் செயல்வட்டம்
  choice: அடக்கம் செய்யும்
  alternative: அடக்கத்திற்காக ஆயத்தப்படுத்தும்
  rationale: சூழல் உடலைத் துணிகளாலும் நறுமணப் பொருள்களாலும் ஆயத்தப்படுத்துவதை விவரித்தாலும், வினைச்சொல் இறுதிச்சடங்கு மற்றும் அடக்கச் செயலின் விரிந்த பொருளைக் கொண்டிருக்கலாம்; எனவே அதை ஓர் கட்டத்துக்கு மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. கிரேக்கத்தின் ஒரு வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
