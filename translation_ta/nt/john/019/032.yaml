id: JHN.19.32
reference: John 19:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: ta
  text: ஆகவே படைவீரர்கள் வந்து, முதலாமவனுடைய கால்களையும், அவரோடு சிலுவையில் அறையப்பட்டிருந்த மற்றவனுடைய கால்களையும் முறித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கட்டளையின் விளைவாக நிகழ்ச்சி தொடர்வதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἱ στρατιῶται
  choice: படைவீரர்கள்
  rationale: இச்சூழலில் ரோமப் படையினரைத் தெளிவாகக் குறிக்கும் வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: τοῦ μὲν πρώτου
  choice: முதலாமவனுடைய
  rationale: இயேசுவுடன் சிலுவையில் அறையப்பட்ட இருவரில் முதலில் அணுகப்பட்டவனைக் குறிக்கிறது; கிரேக்கத்தில் மறைந்துள்ள ஆண் நபர் குறிப்பு தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: κατέαξαν τὰ σκέλη
  choice: கால்களை முறித்தார்கள்
  rationale: தண்டனை நிறைவேற்றும் இச்சூழலில் வினையின் நேரடியான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῦ ἄλλου
  choice: மற்றவனுடைய
  rationale: இயேசுவுடன் சிலுவையில் அறையப்பட்ட இரண்டாவது நபரைக் குறிக்கிறது; முதல் உறுப்புடன் இணையான தமிழ் அமைப்பை வழங்குகிறது.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: அவரோடு சிலுவையில் அறையப்பட்டிருந்த
  rationale: அந்த நபர் இயேசுவுடன் சேர்ந்து சிலுவையில் அறையப்பட்டிருந்ததை அடையாளப்படுத்தும் பெயரெச்சத் தொடராக இயல்பாக மொழிபெயர்க்கிறது; நிகழ்வுக்கு முன்பே அறையப்பட்டிருந்த நிலையைத் தமிழ் இறந்தகாலத் தொடர் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: அவரோடு = இயேசுவோடு
  alternative: முதலாமவனோடு
  rationale: யோவான் விவரிக்கும் சிலுவைக் காட்சியில் மற்ற இருவரும் இயேசுவுடனான தொடர்பிலேயே அடையாளப்படுத்தப்படுகிறார்கள்; எனவே இங்கு ஒருமைச் சுட்டுப்பெயர் இயல்பாக இயேசுவைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இணை அமைப்பைத் தமிழில் தெளிவாக்க இரு நபர்களுக்கும் ‘கால்கள்’ என்ற சொல் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது; தேவையற்ற விளக்க அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
