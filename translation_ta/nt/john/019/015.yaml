id: JHN.19.15
reference: John 19:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: ta
  text: 'ஆகவே அவர்களோ உரக்கக் கத்தினார்கள்: “அவனை அகற்றுங்கள்! அகற்றுங்கள்! அவனைச் சிலுவையில் அறையுங்கள்!” பிலாத்து அவர்களிடம், “உங்கள் அரசனை நான் சிலுவையில் அறைய வேண்டுமா?” என்று கேட்டான். தலைமைக் குருக்கள், “சீசரைத் தவிர எங்களுக்கு அரசன் இல்லை” என்று பதிலளித்தார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: உரக்கக் கத்தினார்கள்
  rationale: வெறும் பேசுதலை அல்ல, கூட்டத்தினரின் பலத்த கூக்குரலைக் குறிக்கும் வினைச்சொல்லின் தீவிரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக எழும் இந்தக் கூக்குரலைச் சுட்டும் தொடர்ச்சி மற்றும் காரணவிளைவு உறவைப் பேணுகிறது.
- source_word: ἐκεῖνοι
  choice: அவர்களோ
  rationale: சுட்டுப்பெயரில் உள்ள வலியுறுத்தலைத் தமிழின் ‘-ஓ’ எதிர்மறை/முன்னிறுத்தும் துகள் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἆρον ἆρον
  choice: அவனை அகற்றிவிடும்! அகற்றிவிடும்!
  rationale: மீண்டும் மீண்டும் வரும் கட்டளையின் அவசரத்தையும் ஒருவரை அங்கிருந்து அகற்றக் கோரும் பொருளையும் பேணுகிறது; தமிழில் தெளிவுக்காகச் சூழலில் உள்ள செயப்படுபொருள் முதல் கட்டளையில் மட்டும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: σταύρωσον αὐτόν
  choice: அவனைச் சிலுவையில் அறையும்
  rationale: ரோமரின் மரணதண்டனை முறையைக் குறிக்கும் நிலையான, வரலாற்றுக்கு ஏற்ற தமிழ்ச் சொற்றொடர்.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: பிலாத்து அவர்களிடம் ... என்று கேட்டான்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடை இறந்தகாலமாக மாற்றி, கேள்வி உரையின் செயலையும் தெளிவாக்குகிறது.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω
  choice: உங்கள் அரசனை நான் சிலுவையில் அறைய வேண்டுமா?
  rationale: முதலாம் நபர் ஆலோசனைவகை வினைமுற்றின் சவாலான வினாவையும் ‘உங்கள் அரசன்’ என்பதிலுள்ள கூர்மையான வலியுறுத்தலையும் பேணுகிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: பலரில் முன்னணி வகித்த ஆசாரிய அதிகாரிகளைக் குறிக்கிறது; ஒரே தலைமைக் குரு என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: சீசரைத் தவிர எங்களுக்கு அரசன் இல்லை
  rationale: εἰ μὴ என்பதன் விலக்கு மற்றும் முழுமையான தன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தலைமைக் குருக்கள் சீசருக்கு மட்டுமே அரசுரிமை இருப்பதாக அறிவித்தல்
  choice: சீசரைத் தவிர எங்களுக்கு அரசன் இல்லை
  alternative: சீசர் அன்றி எங்களுக்கு அரசன் இல்லை
  rationale: உடனடி கதைச்சூழலில் வேறு எந்த அரசுரிமையையும் மறுக்கும் அவர்களின் கடுமையான கூற்றை அப்படியே பேணுகிறது; அதன் விரிவான இறையியல் விளைவுகளை மொழிபெயர்ப்பே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதே நேரத்தில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கூட்டத்தின் கூக்குரலில் குறுகிய கட்டளைகளும் மீளுரையும் பேணப்பட்டுள்ளன. ‘தலைமைக் குருக்கள்’ என்பது வழக்கில் புரியக்கூடியதாகவும் பன்மை ἀρχιερεῖς என்பதைக் துல்லியமாகக் காட்டுவதாகவும் தேர்ந்தெடுக்கப்பட்டது.
