id: JHN.19.36
reference: John 19:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: ta
  text: 'ஏனெனில், வேதவாக்கியம் நிறைவேறும்படி இவை நிகழ்ந்தன: “அவருடைய எலும்புகளில் ஒன்றும் முறிக்கப்படாது.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மொழியில், “அவருடைய எலும்பு முறிக்கப்படாது.” இங்குள்ள ஒருமை ‘எலும்பு’ கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: நிகழ்ந்தன
  rationale: முன்பு விவரிக்கப்பட்ட நிகழ்வுகளைக் குறிக்கும் இறந்தகால வினையாக இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தைத் தரும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ταῦτα
  choice: இவை
  rationale: முன்னர் கூறப்பட்ட பல நிகழ்வுகளைச் சுட்டும் நடுநிலைப் பன்மையின் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: ἵνα
  choice: நிறைவேறும்படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ γραφή
  choice: வேதவாக்கியம்
  rationale: இங்கு பரிசுத்த வேதத்தின் குறிப்பிட்ட வாக்கைக் குறிக்கும் யோவானியப் பயன்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πληρωθῇ
  choice: நிறைவேற
  rationale: செயப்பாட்டு கருத்தைத் தமிழின் ‘நிறைவேறும்படி’ என்ற இயல்பான அமைப்பில் காக்கிறது.
- source_word: Ὀστοῦν
  choice: எலும்புகளில் ஒன்றும்
  rationale: கிரேக்க ஒருமை கூட்டுப்பொருளில் வருவதால், தமிழில் இயல்பாகவும் அதன் முழுப் பொருளைச் சிதைக்காமலும் கூறப்படுகிறது.
- source_word: οὐ συντριβήσεται
  choice: முறிக்கப்படாது
  rationale: எலும்பைப் பற்றிய சூழலில் συντρίβω என்பதன் பொருத்தமான பொருளையும் எதிர்காலச் செயப்பாட்டு வடிவையும் காக்கிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: கிரேக்க உரையின் ஆண்பால் ஒருமை உடைமை உறவை இயல்பான மரியாதைத் தமிழில் தருகிறது.
theological_decisions:
- issue: யாத்திராகமம் 12:46; எண்ணாகமம் 9:12; சங்கீதம் 34:20 ஆகியவற்றுடனான மறைநூல் தொடர்பைக் கொண்ட மேற்கோளில் உள்ள ஒருமை ‘எலும்பு’ என்பதைக் தமிழில் வெளிப்படுத்துதல்
  choice: அவருடைய எலும்புகளில் ஒன்றும் முறிக்கப்படாது
  alternative: அவருடைய எலும்பு முறிக்கப்படாது
  rationale: கிரேக்கத்தில் ‘எலும்பு’ ஒருமையில் இருந்தாலும் அது கூட்டுப்பொருளில் செயல்படுகிறது. தேர்ந்த வடிவம் எந்த எலும்பும் முறிக்கப்படாது என்ற பொருளை இயல்பான தமிழில் தருகிறது; பழைய ஏற்பாட்டுத் தொடர்பையோ நிறைவேற்றக் கருத்தையோ தேவையின்றி விளக்கித் தீர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்தியுள்ளது. ‘வேதவாக்கியம்’ என்பது குறிப்பிட்ட மறைநூல் வாக்கைக் குறிக்கிறது; ‘முறிக்கப்படாது’ என்பது எலும்பு தொடர்பான சூழலுக்கு இயல்பான செயப்பாட்டு வடிவம்.
