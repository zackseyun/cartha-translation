  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ta
  text: பின்பு அவர் அந்தச் சீடரிடம், “இதோ, உன் தாய்” என்றார். அந்த நேரத்திலிருந்து அந்தச் சீடர் அவரைத் தன்னிடத்தில் ஏற்றுக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன்னிடத்தில்’ என்பது ‘தன் வீட்டில்’ அல்லது ‘தனக்குச் சொந்தமானவற்றோடு’ என்றும் பொருள்படலாம்.
    reason: εἰς τὰ ἴδια என்ற கிரேக்கச் சொற்றொடரின் உண்மையான பொருள் பரப்பைத் தெரிவிக்கிறது; ‘வீடு’ என்பது சூழலுக்கு ஏற்ற பொருள் என்றாலும் மூலத்தில் வெளிப்படையாக இல்லை.
lexical_decisions:
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கக் கட்டளையின் சுருக்கத்தையும் இயல்பான வேதாகமத் தமிழின் கண்ணியத்தையும் காக்கிறது.
- source_word: εἰς τὰ ἴδια
  choice: தன்னிடத்தில்
  rationale: இந்தச் சொற்றொடர் சொந்த வீடு, உடைமைகள், அல்லது இல்லச் சூழல் என்பவற்றைக் குறிக்கக்கூடும்; ‘தன் வீட்டிற்குள்’ என்று பொருளை அளவுக்கு மீறிக் குறுக்காமல் தமிழில் அதன் பரப்பைத் தக்கவைக்கிறது.
- source_word: ἔλαβεν
  choice: ஏற்றுக்கொண்டார்
  rationale: வெறும் அழைத்துச் சென்றார் என்பதைக் காட்டிலும், அவரைத் தனது பராமரிப்பிலும் இல்லச் சூழலிலும் சேர்த்துக்கொண்ட கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மரியாளுக்கும் சீடருக்கும் இடையே இயேசு நிறுவிய உறவின் தன்மை
  choice: ‘இதோ, உன் தாய்’ என்ற நேரடியான உறவுமொழி மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதனை உலகளாவிய ஆன்மிகத் தாய்மை அல்லது வெறும் நடைமுறைப் பராமரிப்பு என்று விளக்கமாக விரிவாக்குதல்.
  rationale: மூலவசனம் விளக்கத்தைத் தராமல் உறவை அறிவிக்கிறது; அதன் இறையியல் பரப்பையும் பதற்றத்தையும் மொழிபெயர்ப்பு திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை. இயேசுவைச் சுட்டும் மரியாதைப் பன்மையும் சீடருக்கான ஒருமை அழைப்பும் இயல்பாகப் பேணப்பட்டுள்ளன.
