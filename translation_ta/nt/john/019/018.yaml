base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: ta
  text: அங்கே அவர்கள் அவரைச் சிலுவையில் அறைந்தார்கள்; அவரோடு வேறு இருவரையும் அறைந்தார்கள்—ஒருவர் இப்பக்கத்திலும், ஒருவர் அப்பக்கத்திலும், இயேசு நடுவில் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சுருக்கமாக: “இயேசு அவர்களுக்கு நடுவில் இருந்தார்.”'
    reason: சொல்லமைப்பு மாற்று
lexical_decisions:
- source_word: ὅπου
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் தொடர்பு வினையடை; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இடத்தை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: ἐσταύρωσαν
  choice: சிலுவையில் அறைந்தார்கள்
  rationale: யோவானின் பாடுகளின் சூழலில் சிலுவையில் ஏற்றிக் கொல்வதைக் குறிக்கிறது; செய்முறையின் எல்லா விவரங்களையும் தேவையின்றி சேர்க்காமல் வழக்கமான தமிழ்ப் பயன்பாட்டைப் பின்பற்றுகிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவரோடு
  rationale: μετά + உரிமை வேற்றுமையின் உடனிருப்புப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄλλους δύο
  choice: வேறு இருவரையும்
  rationale: கிரேக்கம் வெளிப்படையாக ‘ஆண்கள்’ என்று சேர்க்காததால், அதைப் புதிதாகச் சேர்க்காமல் இரு வேறு நபர்களைக் குறிக்கிறது.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: ஒருவர் இப்பக்கத்திலும் ஒருவர் அப்பக்கத்திலும்
  rationale: இருவரும் எதிரெதிர் பக்கங்களில் வைக்கப்பட்ட பகிர்ந்தளிக்கும் அமைப்பை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: நடுவில் இயேசுவும் இருந்தார்
  rationale: இயேசுவின் மைய இடத்தை இயல்பான தமிழில் தருகிறது; ‘அவர்களுக்கு இடையில்’ என்று பொருளைச் சுருக்கித் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசு மற்ற இருவருக்கிடையில் இருந்தார் என்பதை எவ்வளவு வெளிப்படையாகச் சொல்வது
  choice: இரு பக்கங்களையும் தனித்தனியாகக் குறிப்பிட்டு, ‘நடுவில் இயேசு’ என்ற கிரேக்கச் சொல்லமைப்பைப் பாதுகாத்தல்
  alternative: ‘இயேசு அவர்களுக்கு இடையில் இருந்தார்’ என்று மொழிபெயர்த்தல்
  rationale: மாற்று வாசகம் சூழலுக்குச் சரியானதாயிருந்தாலும், மூலத்தில் உள்ள பக்கவாட்டு அமைப்பையும் மைய இடத்தையும் தனித்தனியாகக் காட்டுவது காட்சியின் வடிவத்தையும் உண்மையான சொல்லமைப்பையும் நன்றாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டது. கிரேக்கத்தில் இரண்டாவது ‘சிலுவையில் அறைந்தார்கள்’ விடுபட்டுச் சுட்டப்படுவதால், தமிழில் தெளிவுக்காக அது மீண்டும் கூறப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
