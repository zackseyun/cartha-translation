- from: அங்கே அவர்கள் அவரைச் சிலுவையில் அறைந்தார்கள்; அவரோடு வேறு இருவரையும் சிலுவையில் அறைந்தார்கள்—ஒருவர் இப்பக்கத்திலும் ஒருவர் அப்பக்கத்திலும், நடுவில் இயேசுவும் இருந்தார்.[a]
  to: அங்கே அவர்கள் அவரைச் சிலுவையில் அறைந்தார்கள்; அவரோடு வேறு இருவரையும் அறைந்தார்கள்—ஒருவர் இப்பக்கத்திலும், ஒருவர் அப்பக்கத்திலும், இயேசு நடுவில் இருந்தார்.[a]
  rationale: 'The revision preserves the Greek sequence and spatial picture: Jesus is crucified there, two others are crucified with him, one on each side, with Jesus centrally positioned. It avoids treating δέ as strongly additive and replaces the imprecise alternative footnote with a natural compact rendering that remains contextually equivalent.'
