id: JHN.19.14
reference: John 19:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: ta
  text: அன்று பஸ்காவுக்கான ஆயத்த நாள்; நேரம் சுமார் ஆறாம் மணி[a]. பிலாத்து யூதர்களிடம்[b], “இதோ, உங்கள் அரசன்!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பண்டைய மணிக் கணக்கிடும் முறையைப் பொறுத்து, நவீன நேரத்தில் இது ‘சுமார் நண்பகல்’ என்று இருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: ‘யூதர்கள்’ என்பது இச்சூழலில் இன்னும் குறிப்பாக யூதேய அதிகாரிகளையோ யூதத் தலைவர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: பஸ்காவுக்கான ஆயத்த நாள்
  rationale: παρασκευή என்பதன் நாள் சார்ந்த பொருளைத் தெளிவாகக் காட்டி, τοῦ πάσχα என்ற தொடர்பை இயல்பான தமிழில் ‘பஸ்காவுக்கான’ என்று வழங்குகிறது. இது பஸ்கா விருந்துக்கான ஆயத்தமா அல்லது பஸ்கா காலத்திலுள்ள ஆயத்த நாளா என்ற சூழல் சார்ந்த பதற்றத்தை தேவையின்றி விரிவாக்கவில்லை.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: சுமார் ஆறாம் மணி
  rationale: ὡς என்பதிலுள்ள தோராயத்தையும், மூலப் பண்பாட்டின் மணி கணக்கையும் பாதுகாக்கிறது; நேரடியாக ‘நண்பகல்’ என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: λέγει
  choice: என்றான்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை அப்படியே தமிழில் நிகழ்காலமாக்குவது இந்த வாக்கியத்தில் இயல்பற்றதாக இருக்கும். மரியாதைமிக்க நவீனத் தமிழின் கதைநடைக்கு ஏற்ற இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது; பேசுபவர் சூழலிலிருந்து பிலாத்து எனத் தெளிவுபடுத்தப்பட்டுள்ளார்.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களிடம்
  rationale: மூலத்தின் பொதுவான குறிப்பை நேரடியாகப் பாதுகாக்கிறது; அது இச்சூழலில் யூதேய அதிகாரிகளையோ யூதத் தலைவர்களையோ குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் Ἴδε என்பதின் பொதுமக்கள் முன் அறிவிக்கும் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: உங்கள் ராஜா
  rationale: உடைமைச் சுட்டையும் பிலாத்துவின் கூற்றிலுள்ள அரசியல் நையாண்டி அல்லது கூர்மையையும் பாதுகாக்கிறது. ‘ராஜா’ என்பது சாதாரண வாசகர்களுக்குத் தெளிவான நிலையான வேதாகமச் சொல்.
theological_decisions:
- issue: யோவான் நற்செய்தியில் ‘யூதர்கள்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என வைத்தல்
  alternative: ‘யூதேய அதிகாரிகள்’ அல்லது ‘யூதத் தலைவர்கள்’
  rationale: τοῖς Ἰουδαίοις என்பதை இந்த வசனம் வெளிப்படையாகக் குறுக்கவில்லை. ஆகவே விளக்கவுரையான குறுக்கத்தை முதன்மை உரையில் புகுத்தாமல், சூழல் சார்ந்த சாத்தியத்தை அடிக்குறிப்பில் வைத்துள்ளது.
- issue: ‘ஆறாம் மணி’ என்ற பண்டைய நேரக் குறிப்பு
  choice: மூலப் பண்பாட்டின் ‘சுமார் ஆறாம் மணி’ என்பதைக் காத்தல்
  alternative: ‘சுமார் நண்பகல்’
  rationale: மணி கணக்கிடும் முறையைத் தீர்மானித்து காலவரிசை விவாதத்தை மௌனமாக முடிவுசெய்யாமல், ὡς என்ற தோராயத்துடன் மூல வடிவைப் பாதுகாக்கிறது.
- issue: παρασκευὴ τοῦ πάσχα என்பதன் தொடர்பு
  choice: ‘பஸ்காவுக்கான ஆயத்த நாள்’
  alternative: ‘பஸ்காவின் ஆயத்த நாள்’ அல்லது ‘பஸ்கா காலத்து ஆயத்த நாள்’
  rationale: இயல்பான தமிழில் பஸ்காவுடன் உள்ள தொடர்பை வெளிப்படுத்துகிறது; அதேவேளை இந்தச் சொற்றொடரின் காலண்டர் சார்ந்த விளக்கத்தை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
translation_notes:
  register: 'நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் பிலாத்துவைக் குறிக்கும் சுட்டுப்பெயர் மட்டுமே இருந்தாலும், தமிழில் பொருள் தெளிவாக இருக்கப் பெயர் மீண்டும் குறிப்பிடப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறி இடப்பிழை திருத்தப்பட்டுள்ளது: நேரக் குறிப்பு ஆறாம் மணியுடனும், ‘யூதர்கள்’ குறித்த விளக்கம் அந்தச் சொல்லுடனும் பொருத்தப்பட்டுள்ளது.'
