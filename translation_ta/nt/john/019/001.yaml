id: JHN.19.1
reference: John 19:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: ta
  text: அப்போது பிலாத்து இயேசுவை அழைத்துக்கொண்டு, சாட்டையால் அடித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ஒப்படைக்கப்பட்ட செயற்பாட்டை வெளிப்படையாகக் காட்டி: “அப்போது பிலாத்து இயேசுவை அழைத்துக்கொண்டு, அவரைச் சாட்டையால் அடிக்கச் செய்தான்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: கதையில் அடுத்த நிகழ்வைக் குறிக்கும் கால வினையடை; இயல்பான நவீனத் தமிழ் இணை.
- source_word: οὖν
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: தர்க்கரீதியான அல்லது கதைநகர்வின் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் ‘அப்போது’ என்பதும் வாக்கிய ஓட்டமும் சேர்ந்து அதன் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἔλαβεν
  choice: கொண்டுபோய்
  rationale: λαμβάνω என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்/கொண்டு செல்லுதல்’ என்பதை இச்சூழலில் இயல்பாகத் தருகிறது; ‘பிடித்துக்கொண்டான்’ என்பது மூலத்தில் இல்லாத வன்முறையைச் சேர்க்கக்கூடும்.
- source_word: ὁ Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்; முன்னரே அறிமுகமான நபர் என்பதால் முழுப் பெயர் தேவையில்லை.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவை
  rationale: பெயரின் நிலைபெற்ற தமிழ் வடிவத்தை நேரடிப் பொருளாகத் தருகிறது.
- source_word: ἐμαστίγωσεν
  choice: சாட்டையால் அடித்தான்
  rationale: μαστιγόω குறிக்கும் சாட்டையடி தண்டனையைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது; பொதுவான ‘அடித்தான்’ என்பதைவிட கருவியையும் கடுமையையும் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ἔλαβεν ... ἐμαστίγωσεν என்பவற்றில் பிலாத்துவின் நேரடி அல்லது ஒப்படைக்கப்பட்ட செயற்பாடு
  choice: மூல கிரேக்கத்தைப் போல இரு செயல்களுக்கும் பிலாத்துவையே இலக்கண எழுவாயாக வைத்தல்
  alternative: ‘பிலாத்து இயேசுவைக் கொண்டுபோய், அவரைச் சாட்டையால் அடிக்கச் செய்தான்’
  rationale: கிரேக்கத்தில் பிலாத்துவே இரு வினைகளுக்கும் எழுவாய். தமிழ் முதன்மை உரையும் இதைத் தக்கவைத்து, அவன் தானே அடித்தானா அல்லது அதிகாரத்தால் பிறரைக் கொண்டு அடிக்கச் செய்தானா என்பதைத் தீர்மானிக்கவில்லை; மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குத் தெளிவானதுமான நடை. ‘அடிக்கச் செய்தான்’ என்று முதன்மை உரையிலேயே விளக்காமல், கிரேக்கத்தின் செயற்பாட்டு இருபொருள்தன்மை பாதுகாக்கப்பட்டுள்ளது.
