id: JHN.19.8
reference: John 19:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: ta
  text: எனவே, பிலாத்து இந்தக் கூற்றைக் கேட்டபோது, இன்னும் அதிகமாகப் பயந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: கேட்டபோது
  rationale: காலச் சூழலை அறிமுகப்படுத்தும் இணைப்பை இயல்பான நவீனத் தமிழில் ‘-போது’ என்ற அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட குற்றச்சாட்டுக்கும் பிலாத்துவின் எதிர்வினைக்கும் இடையிலுள்ள தொடர்ச்சி மற்றும் விளைவுறவை வெளிப்படையாகக் காட்டுகிறது.
- source_word: ἤκουσεν
  choice: கேட்டபோது
  rationale: இங்கு ἀκούω, சொல்லப்பட்ட தகவலைக் கேட்டு அறிந்ததைக் குறிக்கிறது; ‘கேட்டான்’ சார்ந்த வடிவம் சூழலுக்கு இயல்பானது.
- source_word: ὁ Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் அறியப்பட்ட பெயர் வடிவம்.
- source_word: τοῦτον τὸν λόγον
  choice: இந்தக் கூற்றை
  rationale: λόγος இங்கு முந்தைய வசனத்தில் சொல்லப்பட்ட குறிப்பிட்ட உரிமைக் கூற்றைக் குறிக்கிறது; தனித்த ‘வார்த்தை’ என்பதைவிட ‘கூற்று’ சூழலுக்குத் துல்லியமானது.
- source_word: μᾶλλον
  choice: இன்னும் அதிகமாக
  rationale: பிலாத்துவுக்கு ஏற்கெனவே இருந்த பயம் மேலும் அதிகரித்ததை ஒப்பீட்டு வலிமையுடன் தெரிவிக்கிறது.
- source_word: ἐφοβήθη
  choice: பயந்தான்
  rationale: φοβέομαι என்பதன் நேரடியான உளவியல் பொருளை இயல்பான தமிழில் தருகிறது; μᾶλλον உடன் சேர்ந்து பயம் அதிகரித்த நிகழ்வைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: பிலாத்துவின் பயத்தின் தன்மை
  choice: அவனுடைய பயம் அதிகரித்ததாக மட்டும் மொழிபெயர்த்து, அதன் காரணவகையைத் தீர்மானிக்காமல் விடுதல்
  alternative: அரசியல் அச்சம் அல்லது தெய்வீக விளைவுகளைப் பற்றிய அச்சம் என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை பிலாத்து மேலும் பயந்தான் என்று மட்டுமே கூறுகிறது; அந்தப் பயம் அரசியல் சார்ந்ததா, மூடநம்பிக்கை சார்ந்ததா, இறையியல் சார்ந்ததா என்பதை விளக்கவில்லை. ஆகவே கதையின் தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘கூற்று’ என்பது குறிப்பிட்டுச் சொல்லப்பட்ட கருத்தைத் துல்லியமாகக் காட்டுகிறது; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
