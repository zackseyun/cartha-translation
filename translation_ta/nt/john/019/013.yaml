source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: ta
  text: ஆகவே, பிலாத்து இந்த வார்த்தைகளைக் கேட்டபோது, இயேசுவை வெளியே கொண்டுவந்து, ‘கல் பதித்த தளம்’ என்று அழைக்கப்பட்ட அந்த இடத்தில் நியாயத்தீர்ப்பு மேடையில் அமர்ந்தான்[a]. எபிரெய மொழியில்[b] அந்த இடம் ‘கப்பத்தா’ எனப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை நியாயத்தீர்ப்பு மேடையில் அமர்த்தினான்.” கிரேக்க வினையைச் செயப்படுபொருளை ஏற்கும் வினையாகவும் புரிந்துகொள்ள முடியும்; ஆனாலும் இங்கு பிலாத்தே நியாயத்தீர்ப்பு மேடையில் அமர்ந்தான் என்பதே அதிகம் சாத்தியமான பொருள்.
    reason: alternative_reading
  - marker: b
    text: “எபிரெய மொழியில்” என்பது யோவானின் மற்ற இடங்களில் இருப்பதுபோல, அப்பகுதியில் பேசப்பட்ட செமித்திய மொழியை—அநேகமாக அரமேய மொழியை—குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் நிகழ்வையும் அதன் விளைவையும் இயல்பாகக் குறிக்கிறது.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: இந்த வார்த்தைகளைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையை காலத் தொடர்பாக வெளிப்படுத்துகிறது; λόγων என்பது இப்போது சொல்லப்பட்ட வார்த்தைகளைக் குறிக்கிறது.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: இயேசுவை வெளியே கொண்டுவந்து
  rationale: ἄγω மற்றும் ἔξω ஆகியவற்றின் வெளிநோக்கிய இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: நியாயத்தீர்ப்பு மேடையில் அமர்ந்தான்
  rationale: βῆμα இச்சூழலில் நீதிபதி அமரும் அதிகாரப்பூர்வ மேடை அல்லது இருக்கையைக் குறிக்கிறது; வினையின் எழுவாய் பிலாத்து என்பதே மிக இயல்பான வாசிப்பு.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: ‘கல் பதித்த தளம்’ என்று அழைக்கப்பட்ட இடத்தில்
  rationale: Λιθόστρωτον என்பதன் வெளிப்படையான பொருளை மொழிபெயர்த்து, அந்த இடத்தின் பெயர் அல்லது விளக்கப்பெயரை இயல்பான தமிழில் தருகிறது.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: எபிரெய மொழியில் அந்த இடம் ‘கப்பத்தா’ எனப்பட்டது
  rationale: மூலத்தில் உள்ள ‘எபிரெய மொழியில்’ என்பதைக் காக்கிறது; Γαββαθα இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ἐκάθισεν என்ற வினையின் எழுவாய் மற்றும் செயப்படுபொருள்
  choice: பிலாத்து நியாயத்தீர்ப்பு மேடையில் அமர்ந்தான்
  alternative: பிலாத்து இயேசுவை நியாயத்தீர்ப்பு மேடையில் அமரச் செய்தான்
  rationale: கிரேக்க வினையை தன்வினையாகவோ பிறவினையாகவோ புரிந்துகொள்ள முடியும். நீதித்தீர்ப்பு சூழலும் வழக்கமான தொடரமைப்பும் பிலாத்தே மேடையில் அமர்ந்தான் என்ற வாசிப்பை ஆதரிக்கின்றன; எனினும் உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீதித்துறைச் சூழலைத் தெளிவாக்க βῆμα என்பதற்கு ‘நியாயத்தீர்ப்பு மேடை’ என்றும், Λιθόστρωτον என்பதற்கு புரிந்துகொள்ள எளிதான ‘கல் பதித்த தளம்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
