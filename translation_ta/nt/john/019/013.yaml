  source_fidelity: 'முதன்மை உரை கிரேக்க மூலத்தின் நிகழ்வுவரிசையையும் முக்கிய சொற்களையும் துல்லியமாகக் கொண்டுள்ளது: பிலாத்து கேட்டான், இயேசுவை வெளியே கொண்டுவந்தான், நீதித்தீர்ப்பு மேடையில் அமர்ந்தான், அந்த இடம் Λιθόστρωτον என்றும் எபிரெய மொழியில் Γαββαθα என்றும் அழைக்கப்பட்டது. ἐκάθισεν பற்றிய உண்மையான இலக்கண மாற்றுவாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
