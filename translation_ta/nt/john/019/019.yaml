source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: ta
  text: பிலாத்து ஓர் அறிவிப்பையும் எழுதி, அதைச் சிலுவையின்மேல் வைத்தான். அதில், “நாசரேயனாகிய இயேசு, யூதர்களின் அரசர்[a]” என்று எழுதப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின் அரசர்.” கிரேக்கச் சொல் சூழலைப் பொறுத்து யூத மக்களைப் பொதுவாகவோ, குறிப்பாக யூதேயர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: அறிவிப்பு
  rationale: சிலுவையில் அறையப்பட்டவரைக் குறித்துப் பொதுமக்கள் அறியும்படி வைக்கப்பட்ட எழுத்துப் பலகையை இச்சூழலில் குறிக்கிறது. ‘அறிவிப்பு’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: அதைச் சிலுவையின்மேல் வைத்தான்
  rationale: ἐπί என்பதன் நேரடியான இடப்பொருளைத் தக்கவைத்து, சிலுவைக்கு மேலே தனியாக வைத்ததாக ஊகிக்காமல் ‘சிலுவையின்மேல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἦν ... γεγραμμένον
  choice: என்று எழுதப்பட்டிருந்தது
  rationale: இந்த இறந்தகால சுற்றுவழி வினையமைப்பின் முடிவுநிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ναζωραῖος
  choice: நாசரேயனாகிய
  rationale: வெளிப்படையான ‘நாசரேத்தைச் சேர்ந்த’ என்ற கட்டமைப்பைச் சேர்க்காமல், கிரேக்க அடையாளப் பெயரடை வடிவைத் தக்கவைக்கிறது.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: யூதர்களின் அரசர்
  rationale: பாடுபட்ட வரலாற்றுச் சூழலில் இது பொதுமக்களுக்கான அரச பட்டமாகவும் இயேசுவுக்கு எதிரான குற்றச்சாட்டாகவும் வருகிறது. ‘அரசர்’ என்பது dignified, current Tamil; ‘யூதேயர்களின் அரசர்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δὲ καὶ
  choice: -உம்
  rationale: தொடர்ச்சியோடு சேர்ந்த கூடுதல் செயலைத் தமிழில் ‘அறிவிப்பையும்’ என்ற இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: Πιλᾶτος
  choice: பிலாத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: σταυροῦ
  choice: சிலுவை
  rationale: நற்செய்திகளின் பாடுபட்ட வரலாற்றுச் சூழலில் σταυρός என்பதற்கான நிலைபெற்ற, பொருத்தமான தமிழ் சொல்.
theological_decisions:
- issue: பலகை வாசகத்தில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இங்கு அந்தச் சொல் இயேசுவைக் குறித்த பொதுவான அரச பட்டத்திலும் அரசியல்-மதக் குற்றச்சாட்டிலும் வருகிறது; எனவே ‘யூதர்களின்’ என்பது சூழலுக்கு மிகவும் பொருத்தமானது. இருப்பினும், கிரேக்கச் சொல் குறிப்பிட்ட சூழல்களில் யூதேயப் பகுதியினரையும் குறிக்கக்கூடும் என்பதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவான அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு வாக்கிய அமைப்பும் அறிவிப்பின் நேரடி வாசகமும் பாதுகாக்கப்பட்டுள்ளன.
