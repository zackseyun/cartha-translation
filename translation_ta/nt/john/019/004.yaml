source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: ta
  text: பிலாத்து மீண்டும் வெளியே சென்று அவர்களிடம், “இதோ, அவர்மீது எந்தக் குற்றச்சாட்டையும் நான் காணவில்லை என்பதை நீங்கள் அறிந்துகொள்ளும்படி, உங்களிடம் அவரை வெளியே கொண்டுவருகிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: வெளியே சென்று
  rationale: வெளிப்புற இடத்தை நோக்கிய நகர்வை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது; கிரேக்கத்தில் வினையோடு வரும் ἔξω என்பதன் இடச்சார்ந்த வலியுறுத்தலையும் காக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு நிகழ்ந்த வெளியே செல்லுதலின் மறுநிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: λέγει
  choice: என்றான்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக மாற்றுகிறது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கட்டளைக்குறிப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: அவரை உங்களிடம் வெளியே கொண்டுவருகிறேன்
  rationale: ἄγω என்பதன் ‘அழைத்து/கொண்டுவருதல்’ பொருளையும், கூட்டத்தாரின் முன்னிலையில் இயேசுவை வெளியே கொண்டுவரும் உடனடி செயலையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα γνῶτε
  choice: நீங்கள் அறிந்துகொள்ளும்படி
  rationale: ἵνα கூறும் நோக்கத்தையும் γνῶτε கூறும் அறிதலையும் இயல்பான தமிழ் நோக்கத் தொடரால் காக்கிறது.
- source_word: οὐδεμίαν αἰτίαν
  choice: சுமத்தத்தக்க எந்தக் குற்றச்சாட்டையும்
  rationale: αἰτία இச்சூழலில் கொண்டுள்ள நீதித்துறைப் பொருளை வெளிப்படுத்துகிறது. ‘சுமத்தத்தக்க’ என்பது செல்லத்தக்க குற்றச்சாட்டு எதுவும் இல்லை என்ற பிலாத்துவின் சட்ட மதிப்பீட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: அவர்மீது ... நான் காணவில்லை
  rationale: கிரேக்கச் சொற்றொடரின் நீதித்துறைச் சார்ந்த பொருளைத் தமிழில் வழக்கமான ‘அவர்மீது குற்றச்சாட்டைக் காணுதல்’ என்ற அமைப்பில் தருகிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய பிலாத்துவின் அறிவிப்பை நீதித்துறை மொழியில் வழங்குதல்
  choice: அவர்மீது சுமத்தத்தக்க எந்தக் குற்றச்சாட்டையும் நான் காணவில்லை
  alternative: அவரிடம் எந்தக் குற்றத்தையும் நான் காணவில்லை
  rationale: இவ்வசனத்தில் பிலாத்து ஒரு சட்ட மதிப்பீட்டை அறிவிக்கிறான். ஆகவே αἰτία என்பதன் நீதித்துறைப் பொருளை முதன்மைப்படுத்துகிறது; அதேவேளையில் இயேசுவின் குற்றமின்மையைப் பற்றிய விரிவான இறையியல் முடிவை மொழிபெயர்ப்பில் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ நேரடிப் பேச்சின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; சட்டச்சூழல் தெளிவாக இருந்தாலும் தேவையற்ற சட்டக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
