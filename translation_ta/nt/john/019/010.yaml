source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: ta
  text: ஆகவே பிலாத்து அவரிடம், “நீ என்னிடம் பேசமாட்டாயா? உன்னை விடுதலை செய்ய எனக்கு அதிகாரம் உண்டு; உன்னைச் சிலுவையில் அறையவும் எனக்கு அதிகாரம் உண்டு[a] என்பது உனக்குத் தெரியாதா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகாரம்’ என்பதற்குப் பதிலாக ‘வல்லமை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἐξουσία அதிகாரம், உரிமை அல்லது வல்லமை ஆகியவற்றைக் குறிக்கக்கூடும். இங்கு பிலாத்து சட்டம் மற்றும் ஆட்சி சார்ந்த சூழலில் பேசுவதால் ‘அதிகாரம்’ என்பது பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: ஆகவே பிலாத்து அவரிடம் ... என்றான்
  rationale: οὖν முந்தைய நிகழ்விலிருந்து வரும் விளைவு/தொடர்ச்சியை உணர்த்துவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது. αὐτῷ என்பதும் வெளிப்படையாக ‘அவரிடம்’ என்று வைக்கப்பட்டுள்ளது.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: நீ என்னிடம் பேசமாட்டாயா?
  rationale: முன்னிறுத்தப்பட்ட Ἐμοὶ பிலாத்துவின் புண்பட்ட அகந்தையையும் வலியுறுத்தலையும் காட்டுகிறது. தமிழ் கேள்வி வடிவம் கண்டிக்கும் தொனியை இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὐκ οἶδας ὅτι
  choice: என்பது உனக்குத் தெரியாதா?
  rationale: οἶδα என்பதன் நேரான பொருளான ‘தெரிதல்/அறிதல்’ காக்கப்படுகிறது; ὅτι அறிமுகப்படுத்தும் முழு கருத்தும் கேள்வியின் முடிவில் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளது.
- source_word: ἐξουσίαν ἔχω
  choice: எனக்கு அதிகாரம் உண்டு
  rationale: சட்டம் மற்றும் ஆட்சிசார் சூழலில் ἐξουσία என்பது வெறும் வலிமையைவிட அதிகாரத்தைக் குறிக்கிறது. கிரேக்கத்தில் இருமுறை வரும் சொற்றொடர், இரு முடிவுகளையும் வலியுறுத்துவதற்காக தமிழிலும் இருமுறை வைக்கப்பட்டுள்ளது.
- source_word: ἀπολῦσαί σε
  choice: உன்னை விடுதலை செய்ய
  rationale: நீதித்துறைச் சூழலில் ἀπολύω என்பது ஒருவரை விடுவிப்பதைக் குறிக்கிறது; குற்றமற்றவர் என்று தீர்ப்பளிப்பதாக மேலதிகமாகப் பொருள் சேர்க்கப்படவில்லை.
- source_word: σταυρῶσαί σε
  choice: உன்னைச் சிலுவையில் அறைய
  rationale: வினையின் நேரான பொருள் காக்கப்படுகிறது. பிலாத்து பிறர்மூலம் தண்டனையை நிறைவேற்றுவான் என்ற நிர்வாக விவரம் வசனத்தில் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பிலாத்து தன்னிடம் இருப்பதாகக் கூறும் ἐξουσία என்பதன் இயல்பு
  choice: ‘அதிகாரம்’ என்று மொழிபெயர்த்து, அது சட்டபூர்வமானதா அல்லது முழுமையானதா என்பதை இவ்வசனத்தில் தீர்மானிக்காமல் விடுதல்
  alternative: ‘வல்லமை’ அல்லது ‘உரிமை’
  rationale: இது பிலாத்துவின் கூற்று; அவனுடைய அதிகாரம் தன்னிச்சையானதும் முழுமையானதும் என்று கதைசொல்லி உறுதிப்படுத்துவதாக மொழிபெயர்க்கக் கூடாது. அடுத்த வசனத்தில் இயேசு அளிக்கும் பதிலுக்கான இறையியல் பதற்றம் அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. பிலாத்துவின் அதிகாரத் தொனியைப் பாதுகாக்க ‘எனக்கு அதிகாரம் உண்டு’ என்ற மறுபடியும் வரும் அமைப்பு தக்கவைக்கப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் இடத்தில் மரியாதை ஒருமை (‘அவரிடம்’) பயன்படுத்தப்பட்டாலும், பிலாத்துவின் நேரடி பேச்சில் கிரேக்க ஒருமை மற்றும் அதிகாரத் தொனிக்கு ஏற்ப ‘நீ/உன்னை’ பயன்படுத்தப்பட்டுள்ளது.
