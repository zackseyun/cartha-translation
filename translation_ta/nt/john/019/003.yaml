id: JHN.19.3
reference: John 19:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: ta
  text: அவர்கள் அவரிடம் வந்து, “யூதர்களின் அரசரே, வாழ்க![a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.[b] மேலும், அவரை அறைந்துகொண்டிருந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாழ்க!” என்பதற்கு “வணக்கம்!” என்றும் மொழிபெயர்க்கலாம். இங்கு அது அரசருக்கு மரியாதை செலுத்துவதுபோல் கூறப்பட்ட ஏளன வாழ்த்து.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க முற்றுப்பெறா வினைகள், அவர்கள் அவரிடம் மீண்டும் மீண்டும் வந்து இவ்வாறு சொல்லிக்கொண்டிருந்தார்கள் என்றும் பொருள்படலாம்.
    reason: aspectual_ambiguity
  - marker: c
    text: இதற்கு “அவரைக் கையால் அடித்துக்கொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரின் நேரடிப்பொருள் “அவருக்கு அடிகளைக் கொடுத்துக்கொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  choice: அவர்கள் அவரிடம் வந்து
  rationale: இயேசுவை நோக்கி அவர்கள் அணுகியதை இயல்பான தமிழில் தெரிவிக்கிறது. இறந்தகால முற்றுப்பெறா வினையின் தொடர்ச்சி அல்லது மீள்நிகழ்வு அடுத்த அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἔλεγον
  choice: என்று சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முறிவிடாத அல்லது மீண்டும் மீண்டும் நிகழ்ந்த ஏளனப் பேச்சைத் தமிழ் தொடர்வினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Χαῖρε
  choice: வாழ்க!
  rationale: அரசருக்கு வழங்கப்படும் முறையான வாழ்த்தொலியைச் சூழலிலுள்ள ஏளனத் தொனியுடன் எடுத்துரைக்கிறது; வெறும் “வணக்கம்” என்பதைக் காட்டிலும் அரச மரியாதையின் பாவனையை நன்றாகப் பாதுகாக்கிறது.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: யூதர்களின் அரசரே
  rationale: அரசியல் மற்றும் மேசியா சார்ந்த இருபொருள் ஒலியைக் குறைக்காமல் பட்டத்தை நேரடியாகவும் இயல்பான விளிவடிவிலும் தருகிறது.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: அவரை அறைந்துகொண்டிருந்தார்கள்
  rationale: δίδωμι உடன் வரும் ῥαπίσματα என்பது அறைகள் அல்லது கையால் கொடுக்கப்படும் அடிகளைக் குறிக்கும் மரபுத்தொடர். தொடர்வினை, முற்றுப்பெறா வினையின் நீடித்த அல்லது மீள்நிகழ்ந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய வாழ்த்தின் தொனி
  choice: அரச மரியாதையைப் போல நடித்த ஏளன வாழ்த்தாக “வாழ்க!” என்று மொழிபெயர்த்தல்
  alternative: நடுநிலையான “வணக்கம், யூதர்களின் அரசரே”
  rationale: பாடுகளின் உடனடிச் சூழல் இந்த வாழ்த்து இகழ்ச்சியானது என்பதைக் காட்டுகிறது. “வாழ்க!” என்பது உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல் அரச வாழ்த்தின் வடிவத்தையும் அதன் ஏளனத்தையும் உணர்த்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. “அரசர்” என்பது தற்போதைய நிலையான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; தொடர்வினைகள் காட்சியின் நீடித்த, மீள்நிகழ்ந்த வன்முறையை வெளிப்படுத்துகின்றன.
