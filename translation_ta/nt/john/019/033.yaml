source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: ta
  text: ஆனால் அவர்கள் இயேசுவிடம் வந்தபோது[a], அவர் ஏற்கெனவே இறந்திருந்ததைக் கண்டு[b], அவருடைய கால்களை முறிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பின்னர் யோவான் இந்தச் செயலை, “அவருடைய எலும்புகளில் ஒன்றும் முறிக்கப்படாது” என்ற வேதவாக்குடன் தொடர்புபடுத்துகிறார் (யோவான் 19:36; ஒப்பிடுக: யாத்திராகமம் 12:46; எண்ணாகமம் 9:12; சங்கீதம் 34:20).'
    reason: cross_reference
  - marker: b
    text: அல்லது, “அவர் ஏற்கெனவே இறந்துவிட்டதைக் கண்டபோது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: ஆனால் அவர்கள் இயேசுவிடம் வந்தபோது
  rationale: δέ முந்தையவர்களுக்கு நடந்ததிலிருந்து இயேசுவுக்கு நடந்ததை மென்மையாக வேறுபடுத்துகிறது; இறந்தகால வினையெச்சத் தொடரைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்த்துள்ளது.
- source_word: ὡς εἶδον
  choice: கண்டு
  rationale: இது அவர்கள் உணர்ந்த சூழ்நிலையையும் அதனை அடிப்படையாகக் கொண்ட அடுத்த செயலையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: அவர்கள் இயேசுவிடம் வருவதற்கு முன்பே மரணம் நிகழ்ந்திருந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: τεθνηκότα
  choice: இறந்திருந்ததை
  rationale: τεθνηκότα என்ற நிறைவுநிலை வினையெச்சம் மரணம் நிகழ்ந்ததையும் அதன் தொடரும் நிலையையும் குறிக்கிறது; ‘இறந்திருந்தார்’ என்ற தமிழ் வடிவம் இரண்டையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὐ κατέαξαν
  choice: முறிக்கவில்லை
  rationale: κατάγνυμι இச்சூழலில் எலும்புடைய உறுப்பை முறிப்பதைக் குறிக்கிறது; ‘முறிக்கவில்லை’ என்பது துல்லியமான, இயல்பான தமிழ்.
- source_word: αὐτοῦ τὰ σκέλη
  choice: அவருடைய கால்களை
  rationale: σκέλη என்பது கால்களைக் குறிக்கிறது. எலும்புகளை முறிப்பதே செயல் என்றாலும், ‘கால்களை முறித்தல்’ என்பது தமிழில் இயல்பான கூறாகவும் மூலத்தின் உடற்கூறு சொல்லுக்கு நேரான இணையாகவும் உள்ளது.
theological_decisions:
- issue: இயேசுவின் கால்கள் முறிக்கப்படாதது வேதவாக்கு நிறைவேறியதைக் குறிப்பது
  choice: முதன்மை உரையை நேரடியான நிகழ்ச்சிக் கூற்றாகவே வைத்தல்
  alternative: யோவான் 19:36-ஐ முன்னிறுத்தும் வகையில் ‘கால் எலும்புகள்’ என்று மொழிபெயர்த்தல்
  rationale: வேதவாக்கு நிறைவேறிய தொடர்பை யோவான் 19:36 வெளிப்படையாகக் கூறுகிறது. இவ்வசனம் படைவீரர்களின் செயலை மட்டும் விவரிப்பதால், அந்த இறையியல் விளக்கத்தை முதன்மை உரைக்குள் முன்கூட்டியே சேர்க்காமல் அடிக்குறிப்பில் தருவது பொருத்தம்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆனால்’ முந்தைய வசனச் செயலுடன் உள்ள மென்மையான வேறுபாட்டைக் காட்டுகிறது; ‘இறந்திருந்ததை’ நிறைவுநிலையையும் விளைவுநிலையையும் பாதுகாக்கிறது.
