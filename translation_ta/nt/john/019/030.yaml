source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: ta
  text: ஆகவே, இயேசு புளித்த திராட்சை மதுவைப் பெற்றுக்கொண்டபோது[a], “முடிந்தது”[b] என்றார்; தலையைச் சாய்த்து, தமது ஆவியை ஒப்படைத்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காடியை” அல்லது “மது வினிகரை.” ὄξος என்ற கிரேக்கச் சொல் புளித்த திராட்சை மதுவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிறைவேறிவிட்டது” அல்லது “நிறைவு பெற்றது.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கடைசி மூச்சை விட்டார்.” கிரேக்கத்தில் இன்னும் நேரடியாக, “ஆவியை ஒப்படைத்தார்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ஆகவே, ...போது
  rationale: ὅτε என்பதன் காலத் தொடர்பையும் οὖν என்பதன் கதைத் தொடர்ச்சி மற்றும் முடிவுறுத்தும் தொடர்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἔλαβεν
  choice: பெற்றுக்கொண்டபோது
  rationale: இங்கு கடற்பஞ்சில் அளிக்கப்பட்ட பானத்தை இயேசு ஏற்றுக்கொண்டதை λαμβάνω குறிக்கிறது; ‘எடுத்தபோது’ என்பதைவிட ‘பெற்றுக்கொண்டபோது’ சூழலுக்கு இயல்பானது.
- source_word: τὸ ὄξος
  choice: புளித்த திராட்சை மது
  rationale: ὄξος என்பது புளிப்படைந்த மலிவான திராட்சை மதுவைக் குறிக்கிறது. ‘வினிகர்’ அல்லது பாரம்பரியமான ‘காடி’ என்பவற்றைவிட இச்சொற்றொடர் இன்றைய வாசகருக்குப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: Τετέλεσται
  choice: முடிந்தது
  rationale: τελέω என்பதன் நிறைவுற்ற செயலும் அதன் தொடரும் விளைவும் சுருக்கமாக வெளிப்படுகின்றன; எது முடிந்தது என்பதைச் சேர்க்காமல் மூலத்தின் தெளிவின்மையையும் காக்கிறது.
- source_word: κλίνας τὴν κεφαλήν
  choice: தலையைச் சாய்த்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் பங்கேற்புவினைச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: தமது ஆவியை ஒப்படைத்தார்
  rationale: παραδίδωμι என்பதன் ‘ஒப்படைத்தல்’ என்ற உருவகத்தையும் πνεῦμα என்பதன் ‘ஆவி’ என்ற பொருளையும் காத்து, வெறும் ‘இறந்தார்’ என்று பொதுமைப்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα என்பதை மரணத்திற்கான சாதாரண மரபுத்தொடராக மட்டும் மொழிபெயர்ப்பதா, அல்லது இயேசு தமது ஆவியை ஒப்படைத்தார் என்ற மூலத்தின் தனித்துவமான மொழியைப் பாதுகாப்பதா?
  choice: தமது ஆவியை ஒப்படைத்தார்
  alternative: இறந்தார்; கடைசி மூச்சை விட்டார்
  rationale: மூலவாக்கியம் வெறும் மரண அறிவிப்பைவிடக் குறிப்பானது. இம்மொழிபெயர்ப்பு இயேசுவின் செயல் தன்னார்வத் தன்மை கொண்டதாக ஒலிக்க இடமளிக்கிறது; அதேவேளையில் வசனம் வெளிப்படையாகச் சொல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: Τετέλεσται என்பதில் நிறைவேற்றப்பட்டதன் பொருள் எது என்பதை வெளிப்படையாக நிர்ணயிப்பதா?
  choice: முடிந்தது
  alternative: நிறைவேறிவிட்டது; நிறைவு பெற்றது
  rationale: கிரேக்கத்தில் வெளிப்படையான எழுவாய் அல்லது செயப்படுபொருள் இல்லை. ‘முடிந்தது’ இறுதியையும் நிறைவையும் தெரிவித்து, எது முடிந்தது என்ற பொருள் சார்ந்த திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் நிகழ்வின் கண்ணியமும் சுருக்கமும் காக்கப்படும் வகையிலும் வடிவமைக்கப்பட்டது. ‘தமது’ என்பது இயேசுவையே திரும்பச் சுட்டும் மரியாதைமிக்க இயல்பான வடிவம். பாரம்பரியமான ஆனால் இப்போது பலருக்குத் தெளிவில்லாத ‘காடி’ முதன்மை உரையில் அல்லாமல் அடிக்குறிப்பில் வைக்கப்பட்டது.
