source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: ta
  text: புளித்த திராட்சைமது[a] நிறைந்த ஒரு பாத்திரம் அங்கே இருந்தது. ஆகவே, புளித்த திராட்சைமது நிறைந்த ஒரு கடற்பஞ்சை ஈசோப்பில்[b] பொருத்தி, அவருடைய வாய்க்குக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வினிகர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் புளித்த திராட்சைமதுவையோ வினிகரையோ குறிக்கலாம்; இங்கே அது படைவீரர்களிடம் வழக்கமாக இருந்த புளிப்பான திராட்சைமது பானத்தைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஈசோப்புக் கிளையில்’ அல்லது ‘ஈசோப்பைக் கொண்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘ஈசோப்பில்/ஈசோப்பைக் கொண்டு’ என்று மட்டுமே உள்ளது; நிகழ்ந்த செயல் துல்லியமாக எப்படிப்பட்டது என்பது விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: பாத்திரம்
  rationale: பொருளை அளவுக்கு மீறிக் குறிப்பிட்டுவிடாமல், திரவத்தை வைத்திருக்கும் பொதுவான கலனைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἔκειτο
  choice: அங்கே இருந்தது
  rationale: அந்தப் பாத்திரம் அங்கு அமைந்திருந்த நிலையை இயல்பாகத் தெரிவிக்கிறது; அது எப்படியோ யாராலோ வைக்கப்பட்டது என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: ὄξους
  choice: புளித்த திராட்சைமது
  rationale: இச்சூழலில் குடிக்கப் பயன்படுத்தப்பட்ட மலிவான புளித்த திராட்சைமதுவைக் குறிக்கிறது; வெறும் சமையல் வினிகர் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: μεστόν
  choice: நிறைந்த
  rationale: பாத்திரத்தையும் கடற்பஞ்சையும் குறிக்கும் இரு இடங்களிலும் நிறைவைக் குறிக்கும் பெயரடையின் மறுமொழியைப் பேணுகிறது.
- source_word: σπόγγον
  choice: கடற்பஞ்சு
  rationale: திரவத்தை உறிஞ்சும் இயற்கை sponge-ஐத் துல்லியமாகக் குறிக்கிறது; சாதாரண பருத்திப் பஞ்சுடன் குழப்பம் ஏற்படுவதைத் தவிர்க்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய சூழ்நிலையிலிருந்து தொடரும் கதைநிகழ்வின் விளைவைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ὑσσώπῳ
  choice: ஈசோப்பில்
  rationale: கிரேக்க வேற்றுமை உருபு கருவியையோ இணைப்பையையோ குறிக்கலாம். மூலத்தில் இல்லாத ‘கிளை’ என்பதைச் சேர்க்காமல் அதன் தெளிவின்மையைப் பேணுகிறது.
- source_word: περιθέντες
  choice: பொருத்தி
  rationale: கடற்பஞ்சை ஈசோப்புடன் இணைத்த முந்திய செயலை இயல்பான தமிழ் வினையெச்சமாக வெளிப்படுத்துகிறது.
- source_word: προσήνεγκαν
  choice: கொண்டுவந்தார்கள்
  rationale: இயேசுவின் வாயை நோக்கி அதைக் கொண்டுவந்த உடல் செயலைக் காட்டுகிறது; ‘கொடுத்தார்கள்’ அல்லது ‘குடிக்கச் செய்தார்கள்’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: αὐτοῦ τῷ στόματι
  choice: அவருடைய வாய்க்கு
  rationale: இலக்காகக் குறிக்கப்பட்ட வாயைத் தமிழில் இயல்பான நான்காம் வேற்றுமை வடிவில் தருகிறது.
theological_decisions:
- issue: ὑσσώπῳ என்பதன் வரலாற்று மற்றும் வழிபாட்டுச் சார்ந்த எதிரொலி
  choice: முதன்மை உரையில் ‘ஈசோப்பு’ என்பதை வைத்திருந்து, அதன் அடையாளப் பொருளை விளக்கிச் சேர்க்கவில்லை.
  alternative: ‘ஈசோப்புக் கிளை’ என்று விரித்துரைப்பது அல்லது பொதுவான ஒரு தண்டு என மாற்றுவது.
  rationale: யோவானின் சொல் பஸ்கா அல்லது தூய்மைப்படுத்தல் தொடர்புகளை நினைவூட்டக்கூடும்; ஆனால் இவ்வசனம் அந்த அடையாளப் பொருளை வெளிப்படையாகக் கூறவில்லை. ‘ஈசோப்பு’ என்பது சொல்லின் சாத்தியமான இறையியல் எதிரொலியையும் அதன் தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் உள்ள சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘புளித்த திராட்சைமது’ வரலாற்றுச் சூழலை விளக்குகிறது; ‘ஈசோப்பில்’ மூலத்தின் உண்மையான தெளிவின்மையைப் பேணுகிறது.
