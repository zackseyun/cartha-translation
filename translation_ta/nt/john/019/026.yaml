reference: John 19:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: ta
  text: ஆகவே, இயேசு தம் தாயையும் அருகில் நின்றிருந்த தாம் அன்புகூர்ந்த சீடரையும் கண்டு, தம் தாயிடம், “பெண்ணே[a], இதோ, உன் மகன்” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெண்ணே” என்ற கிரேக்க அழைப்பு இங்கு மரியாதையானது; அவமதிப்போ கடுமையோ கொண்டதல்ல. “அம்மையாரே” என்றும் பொருள்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் இவ்வசனத்தை இணைக்கும் தொடர்ச்சி அல்லது விளைவு சார்ந்த இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἰδὼν
  choice: கண்டு
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலச்சார்ந்த பொருளைத் தமிழின் இயல்பான வினையெச்ச வடிவில் தருகிறது.
- source_word: τὴν μητέρα
  choice: தம் தாயை
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் இவர் இயேசுவின் தாய் என்பதால் தமிழில் இயல்பாக உடைமைச் சுட்டு சேர்க்கப்படுகிறது.
- source_word: τὸν μαθητὴν
  choice: சீடரை
  rationale: குறிப்பிட்ட, ஏற்கெனவே அடையாளம் காணக்கூடிய சீடரைச் சுட்டுகிறது; தமிழ் மரியாதை ஒருமை இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρεστῶτα
  choice: அருகே நின்றுகொண்டிருந்த
  rationale: அந்தச் சீடர் அங்கே அருகில் நின்றிருந்த காட்சியையும் தொடர்நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὃν ἠγάπα
  choice: தாம் அன்புகூர்ந்த
  rationale: அன்புகூர்ந்தவர் இயேசு என்பதையும், இத்தொடர் சீடரை அடையாளப்படுத்துவதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: யோவான் பயன்படுத்தும் வரலாற்று நிகழ்காலத்தின் காட்சித்தன்மையைத் தமிழிலும் நிகழ்கால வடிவில் காக்கிறது.
- source_word: Γύναι
  choice: பெண்ணே
  rationale: நேரடியான அழைப்பை விளக்கவுரையாக மாற்றாமல் தருகிறது. இன்றைய தமிழில் இது கடுமையாகக் கேட்கக்கூடும் என்பதால் அடிக்குறிப்பு அதன் மரியாதையான மூலநடையை விளக்குகிறது.
- source_word: ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து ஒருவரைச் சுட்டிக்காட்டும் கட்டளையின் இலக்கிய வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ υἱός σου
  choice: உன் மகன்
  rationale: அந்தச் சீடரைத் தாயுடன் மகன் என்ற புதிய உறவில் அடையாளப்படுத்தும் நேரடியான கூற்றைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Γύναι என்று இயேசு தம் தாயை அழைக்கும் தொனி
  choice: மூலத்தின் நேரடியான வடிவைப் பாதுகாக்க “பெண்ணே” என்று முதன்மை உரையில் வைத்து, அது அவமரியாதையான அழைப்பு அல்ல என்பதை அடிக்குறிப்பில் விளக்குதல்.
  alternative: “அம்மா” அல்லது “அன்புள்ள பெண்ணே” என்று மொழிபெயர்த்தல்.
  rationale: Γύναι மரியாதையற்றதல்ல; ஆனால் அதில் “அம்மா” என்ற உறவுமுறை அழைப்போ “அன்புள்ள” என்ற வெளிப்படையான பாசச் சொல்லோ இல்லை. அவற்றைச் சேர்ப்பது மூலத்தின் தொனியைத் தேவையின்றி விளக்கிவிடும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் “சொல்கிறார்” எனப் பாதுகாக்கப்பட்டுள்ளது. “பெண்ணே” இன்றைய தமிழில் தவறாகக் கடுமையாகப் புரிந்துகொள்ளப்படலாம் என்பதால் அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
