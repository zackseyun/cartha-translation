source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: ta
  text: ஆகவே அவர்கள் ஒருவருக்கொருவர், “அதை நாம் கிழிக்க வேண்டாம்; ஆனால், அது யாருக்குக் கிடைக்கும் என்று சீட்டுப் போட்டு தீர்மானிப்போம்” என்றார்கள். “அவர்கள் என் ஆடைகளைத் தங்களுக்குள் பங்கிட்டுக்கொண்டார்கள்; என் உடைக்காக அவர்கள் சீட்டுப் போட்டார்கள்” என்று சொல்லுகிற வேதவாக்கியம் நிறைவேறும்படி படைவீரர்கள் இவற்றைச் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சங்கீதம் 22:18-லிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: கிழிக்காமல்
  rationale: துணியைப் பிளப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; எதிர்மறை வேண்டுகோள் அமைப்பையும் காக்கிறது.
- source_word: αὐτόν
  choice: இதை
  rationale: இலக்கணத்தில் ஆண்பாலாக இருந்தாலும், சூழலில் முன் குறிப்பிடப்பட்ட உடையையே சுட்டுவதால் தமிழில் பொருளுக்கேற்ற நடுநிலைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: λάχωμεν
  choice: சீட்டுப்போட்டுத் தீர்மானிப்போம்
  rationale: உடை யாருக்குச் சேரும் என்பதைச் சீட்டின் மூலம் முடிவு செய்வதே இங்கு பொருள்; தமிழில் தெளிவாகவும் இயல்பாகவும் கூறப்பட்டுள்ளது.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: இது யாருக்கு என்று
  rationale: சீட்டுப்போடுவதன் நோக்கம் உரிமையாளரைத் தீர்மானிப்பது என்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: வேதவாக்கியம் நிறைவேறும்படி
  rationale: யோவானின் நிறைவேற்றச் சூத்திரத்தைப் பாதுகாக்கிறது; தெய்வ நோக்கத்துக்கும் மனிதச் செயலுக்கும் இடையிலான உறவை மேலதிகமாக விளக்கவில்லை.
- source_word: ἡ γραφή
  choice: வேதவாக்கியம்
  rationale: இது பொதுவான எழுத்தை அல்ல, மேற்கோள் காட்டப்படும் பரிசுத்த வேதப்பகுதியைக் குறிக்கிறது.
- source_word: ἡ λέγουσα
  choice: என்று சொல்லுகிற
  rationale: மேற்கோளை அறிமுகப்படுத்தும் கிரேக்கப் பெயரெச்சத்தின் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: Διεμερίσαντο
  choice: பங்கிட்டுக்கொண்டார்கள்
  rationale: பலரிடையே பொருட்களைப் பிரித்துக்கொள்வதைக் குறிக்கும் வினையின் பகிர்வு உணர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἱμάτιά
  choice: ஆடைகளை
  rationale: பன்மையில் உள்ள பொதுவான உடைகளைக் குறிக்க இயல்பான தமிழ்ச் சொல்.
- source_word: ἑαυτοῖς
  choice: தங்களுக்குள்
  rationale: படைவீரர்கள் அந்த ஆடைகளைத் தங்களிடையே பகிர்ந்துகொண்டார்கள் என்ற தற்சுட்டுப் பகிர்வு பொருளைக் காக்கிறது.
- source_word: ἱματισμόν
  choice: உடைக்காக
  rationale: முந்தைய ἱμάτιά என்பதிலிருந்து ஓரளவு சொல்வேறுபாட்டைத் தக்கவைத்து, ஒருமை வடிவையும் பிரதிபலிக்கிறது.
- source_word: ἔβαλον κλῆρον
  choice: சீட்டுப்போட்டார்கள்
  rationale: κλῆρος ஒருமையில் இருந்தாலும், சீட்டின் மூலம் முடிவுசெய்யும் வழக்கைத் தமிழில் இயல்பாகக் குறிக்கும் நிலையான சொற்றொடர்.
theological_decisions:
- issue: ἵνα ἡ γραφὴ πληρωθῇ என்பதில் படைவீரர்களின் செயலுக்கும் வேதவாக்கிய நிறைவேற்றத்துக்கும் உள்ள உறவு
  choice: “வேதவாக்கியம் நிறைவேறும்படி” என்று நேரடியான நிறைவேற்றக் கூற்றாக மொழிபெயர்த்தல்
  alternative: “அதன் விளைவாக வேதவாக்கியம் நிறைவேறியது” என்று முடிவை மட்டும் வலியுறுத்துதல்
  rationale: ἵνα என்பதன் நோக்கம்/விளைவு சார்ந்த திறந்த தன்மையையும் யோவானின் நிறைவேற்ற மொழியையும் காக்கிறது; தெய்வத் தீர்மானம் மற்றும் மனிதப் பொறுப்பு பற்றிய தத்துவ இயங்குமுறையை உரை கூறுவதைவிட அதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேத மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. “ஆடைகள் / உடை” என்ற சொல்வேறுபாடு கிரேக்கத்தின் ἱμάτια / ἱματισμός வேறுபாட்டை ஓரளவு காக்கிறது.
