revisions:
- from: அப்போது பிலாத்து அவரைச் சிலுவையில் அறையும்படி அவர்களிடம் ஒப்படைத்தான்.[a] எனவே, அவர்கள் இயேசுவைத் தங்கள் பொறுப்பில் ஏற்றுக்கொண்டார்கள்.[b]
  to: அதன்பின் பிலாத்து அவரைச் சிலுவையில் அறையப்படுவதற்காக அவர்களிடம் ஒப்படைத்தான்.[a] அவர்கள் இயேசுவை எடுத்துக்கொண்டார்கள்.[b]
  rationale: “அதன்பின்” நிகழ்வுத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. பெறுபவர்களைப் பெயரிடாமல் வைத்திருக்கும் மூலத்தின் தெளிவின்மை காக்கப்பட்டுள்ளது. “அறையப்படுவதற்காக” செயலப்பாட்டு நிலையையும் நோக்க உறவையும் வெளிப்படுத்துகிறது; “எடுத்துக்கொண்டார்கள்” தேவையற்ற விளக்கச் சேர்க்கையின்றி Παρέλαβον-ஐ மொழிபெயர்க்கிறது.
