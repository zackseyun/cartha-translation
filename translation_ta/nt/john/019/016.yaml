  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: ta
  text: அதன்பின் பிலாத்து அவரைச் சிலுவையில் அறையப்படுவதற்காக அவர்களிடம் ஒப்படைத்தான்.[a] அவர்கள் இயேசுவை எடுத்துக்கொண்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிலுவையில் அறையப்படுவதற்காக” என்பது, அவர் சிலுவையில் அறையப்பட வேண்டும் என்ற நோக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களிடம்” என்றும் “அவர்கள்” என்றும் குறிப்பிடப்படுபவர்கள் இந்த வசனத்தில் வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை; உடனுள்ள சூழலிலிருந்து வாசகர் அவர்களைப் புரிந்துகொள்கிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வைக் குறிக்கும் இயல்பான கால அடைமொழி.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்வுகளோடு தொடர்ச்சியையும் விளைவையும் இணைக்கும் இடைச்சொல்; தமிழில் இரண்டாம் வாக்கியத்தின் தொடக்கத்தில் இயல்பாக அமைக்கப்பட்டது.
- source_word: παρέδωκεν
  choice: ஒப்படைத்தான்
  rationale: மற்றவர்களின் அதிகாரத்திற்கோ பொறுப்பிற்கோ ஒருவரைக் கையளிக்கும் நீதித்துறைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτὸν αὐτοῖς
  choice: அவரை ... அவர்களிடம்
  rationale: இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், பெற்றுக்கொண்ட குழுவை மூலத்தைப் போலவே பெயரிடாமல் விடுகிறது.
- source_word: ἵνα σταυρωθῇ
  choice: சிலுவையில் அறையும்படி
  rationale: ἵνα உடன் வரும் இறந்தகாலச் செயலப்பாட்டு வினையின் நோக்கப் பொருளையும் செயலப்பாட்டு நிலையையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: Παρέλαβον
  choice: தங்கள் பொறுப்பில் ஏற்றுக்கொண்டார்கள்
  rationale: இச்சூழலில் இயேசுவைத் தங்கள் கட்டுப்பாட்டில் எடுத்துக்கொண்டதைக் குறிக்கிறது; வெறும் ‘அழைத்துச் சென்றார்கள்’ என்று மூலத்தில் இல்லாத நகர்வைச் சேர்க்கவில்லை.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்; வேற்றுமை உருபுடன் ‘இயேசுவை’ என வருகிறது.
theological_decisions:
- issue: αὐτοῖς என்பதும் Παρέλαβον என்பதன் மறைந்த எழுவாயும் யாரைக் குறிக்கின்றன?
  choice: முதன்மை உரையில் ‘அவர்களிடம் / அவர்கள்’ என்று பொதுவாகவே வைக்கப்பட்டது.
  alternative: தலைமைக் குருக்களும் அவர்களுடைய காவலர்களும் என்று குறிப்பிடுதல்; அல்லது ரோமப் படைவீரர்கள் என்று குறிப்பிடுதல்.
  rationale: இந்த வசனத்தின் கிரேக்க உரை அந்தக் குழுவைப் பெயரிட்டு அடையாளப்படுத்தவில்லை. குறிப்பிட்ட குழுவைச் சேர்ப்பது மூலத்தின் சுட்டுப்பெயர் தெளிவின்மையை மொழிபெயர்ப்பிலேயே தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதை நடை பின்பற்றப்பட்டது. கிரேக்கத்தின் இரு οὖν இடைச்சொற்களையும் தமிழில் இயந்திரமாக இருமுறை கூறாமல், அதன் தொடர்ச்சி/விளைவு உறவு ‘எனவே’ மூலம் தெளிவாகக் காக்கப்பட்டது.
