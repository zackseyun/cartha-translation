id: JHN.19.12
reference: John 19:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: ta
  text: அதுமுதல் பிலாத்து அவரை விடுதலை செய்ய முயன்று கொண்டிருந்தான்.[a] ஆனால் யூதர்கள்[b], “இவனை விடுதலை செய்தால், நீ சீசரின் நண்பன் அல்ல. தன்னையே அரசனாக்கிக் கொள்கிறவன் எவனும் சீசரை எதிர்க்கிறான்.[c]” என்று கூக்குரலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதன் காரணமாகப் பிலாத்து அவரை விடுதலை செய்யத் தொடர்ந்து முயன்றான்.” ἐκ τούτου என்ற கிரேக்கச் சொற்றொடர் காலப் பொருளில் “அதுமுதல்” என்றும் காரணப் பொருளில் “இதன் காரணமாக” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: யோவான் நற்செய்தியில் “யூதர்கள்” என்பது பல இடங்களில் யூத மக்கள் அனைவரையும் அல்லாமல், சூழலுக்கேற்ப யூதேய அதிகாரிகளையோ இயேசுவை எதிர்த்த குறிப்பிட்ட யூதர்களையோ குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “சீசருக்கு எதிராகப் பேசுகிறான்” அல்லது “சீசருக்கு எதிராக நிற்கிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: அதுமுதல்
  rationale: இச்சூழலில் இச்சொற்றொடர் முந்தைய உரையாடலுக்குப் பின் நிகழ்ந்த தொடர்ச்சியைச் சுட்டும் காலப் பொருளில் இயல்பாகப் புரிகிறது; காரணப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐζήτει
  choice: முயன்றுகொண்டிருந்தான்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது திரும்பத் திரும்ப மேற்கொள்ளப்பட்ட முயற்சியைக் காட்டுகிறது.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: விடுதலை செய்ய / விடுதலை செய்தால்
  rationale: காவலிலிருந்து அதிகாரபூர்வமாக விடுவிக்கும் நீதித்துறைச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: ஆனால் யூதர்கள்
  rationale: மூலத்தில் உள்ள பொதுவான இன-மதச் சொல்லை உரையில் குறுக்காமல் காக்கிறது; இச்சூழலில் அதன் குறிப்பிட்ட சுட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐκραύγασαν λέγοντες
  choice: என்று கூக்குரலிட்டார்கள்
  rationale: உரத்த பொதுக் கூச்சலையும் நேரடிக் கூற்றின் அறிமுகத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: τοῦτον
  choice: இவனை
  rationale: சுட்டுப்பெயரின் நேரடியான, இச்சூழலில் சற்றே இழிவான தொனியையும் சுருக்கமாகக் காக்கிறது.
- source_word: φίλος τοῦ Καίσαρος
  choice: சீசரின் நண்பன்
  rationale: அரசியல் விசுவாசத்தைப் பற்றிய குற்றச்சாட்டை மிகைப்படுத்தாமல், உடைமை வேற்றுமையின் வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: தன்னை அரசனாக்கிக்கொள்கிற எவனும்
  rationale: ‘தன்னை அரசனாக்குகிறவன்’ என்ற கிரேக்க அமைப்பை நெருக்கமாகவும் இயல்பாகவும் காக்கிறது; ‘அரசன் என்று உரிமைகோருகிறவன்’ என விளக்கிப் பொருள் குறுக்கப்படவில்லை.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: சீசரை எதிர்க்கிறான்
  rationale: இச்சட்ட-அரசியல் சூழலில் வினைச்சொல் வெறும் வாய்மொழி மறுப்பை விட எதிர்ப்பைக் குறிக்கிறது; அதன் மொழிசார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் ‘யூதர்கள்’ என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று மூலத்தின் பரப்பைத் தக்கவைத்தல்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: οἱ Ἰουδαῖοι என்பதை முதன்மை உரையிலேயே ஒரு குறிப்பிட்ட குழுவாகக் குறுக்குவது விளக்கவுரையாகிவிடும். அதேவேளை, யூத மக்கள் அனைவரையும் இது குறிக்க வேண்டியதில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἀντιλέγει என்பதன் அரசியல் வலிமை
  choice: எதிர்க்கிறான்
  alternative: எதிராகப் பேசுகிறான் / முரண்படுகிறான்
  rationale: சீசருக்கு எதிரான அரசதுரோகக் குற்றச்சாட்டின் சூழலில் பரந்த எதிர்ப்புப் பொருள் பொருத்தமானது; சொற்படியான மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. பிலாத்தைக் குறிக்க ஒருமை ஆண்பால் வடிவமும் இயேசுவைக் குறிக்க மரியாதை வடிவமும் பயன்படுத்தப்பட்டுள்ளன. ‘சீசர்’ என்பது இங்கு ரோமப் பேரரசருக்கான பட்டப்பெயராகத் தக்கவைக்கப்பட்டுள்ளது.
