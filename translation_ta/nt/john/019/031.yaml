id: JHN.19.31
reference: John 19:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: ta
  text: ஆகவே, யூதர்கள்[a], அது ஆயத்த நாளாக இருந்ததாலும், அந்த ஓய்வுநாள் சிறப்புமிக்க நாளாக இருந்ததாலும், ஓய்வுநாளில் உடல்கள் சிலுவையில் இருக்காதபடி, அந்த உடல்களின் கால்கள் முறிக்கப்பட்டு உடல்கள் அகற்றப்பட வேண்டும் என்று பிலாத்துவிடம் கேட்டுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவான் நூலின் சில சூழல்களில் ‘யூதர்கள்’ என்பது இன்னும் குறிப்பாக யூதேய அதிகாரிகளையோ யூதத் தலைவர்களையோ குறிக்கலாம்.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: ஆகவே, யூதர்கள்
  rationale: οὖν இங்கு முந்தைய நிகழ்விலிருந்து தொடரும் விளைவைக் காட்டுகிறது. Ἰουδαῖοι என்பதன் அடிப்படைப் பொருளை முதன்மை உரையில் காத்து, யோவானில் சூழலுக்கேற்ப அது அதிகாரிகளைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: அது ஆயத்த நாளாக இருந்ததாலும்
  rationale: παρασκευή என்பது ஓய்வுநாளுக்கு முந்தைய ஆயத்த நாளைக் குறிக்கிறது. ‘ஆயத்த நாள்’ என்பது தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: ஓய்வுநாளில் உடல்கள் சிலுவைகளில் இருக்காதபடி
  rationale: ἵνα உடன் வரும் வினைமுறை நோக்கத்தை வெளிப்படுத்துகிறது. பல உடல்களும் அவற்றுக்குரிய சிலுவைகளும் உள்ள சூழலை இயல்பான தமிழில் ‘சிலுவைகளில்’ எனக் கூறுகிறது.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: அந்த ஓய்வுநாள் சிறப்புமிக்க நாளாக இருந்ததாலும்
  rationale: μεγάλη என்பதன் ‘பெரிய/முக்கியத்துவமிக்க’ கருத்தை இயல்பான தமிழில் ‘சிறப்புமிக்க’ என வழங்குகிறது; அந்த ஓய்வுநாளின் விசேஷ முக்கியத்துவத்தை இதுவே தெரிவிக்கிறது.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: பிலாத்துவிடம் கேட்டுக்கொண்டார்கள்
  rationale: ἠρώτησαν இங்கு சாதாரண வினாவை அல்ல, அதிகாரியிடம் வைக்கப்பட்ட வேண்டுகோளைக் குறிக்கிறது; ‘கேட்டுக்கொண்டார்கள்’ அதற்கு இயல்பான தமிழ்.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: அவர்களுடைய கால்கள் முறிக்கப்பட்டு
  rationale: κατάγνυμι என்பதன் முறித்தல் என்ற நேரடிப் பொருளையும், கிரேக்கச் செயலப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: καὶ ἀρθῶσιν
  choice: உடல்கள் அங்கிருந்து அகற்றப்பட வேண்டும்
  rationale: αἴρω இங்கு உடல்களைச் சிலுவைகளிலிருந்து அகற்றுவதைக் குறிக்கிறது. கிரேக்கத்தில் பொருள் சூழலிலிருந்து புரிந்தாலும், தமிழில் தெளிவுக்காக ‘உடல்கள்’ மீண்டும் குறிப்பிடப்படுகிறது; ‘அங்கிருந்து’ என்பது ‘சிலுவையிலிருந்து’ என்ற சூழல் சார்ந்த பொருளை மிகையாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’
  alternative: ‘யூதேயர்கள்’ அல்லது ‘யூதத் தலைவர்கள்’
  rationale: யோவான் நூலில் இச்சொல்லின் குறிப்பு சூழலுக்கு ஏற்ப மாறுகிறது. இங்கு அதிகாரிகளே நேரடியாகச் செயல்பட்டிருக்கலாம்; ஆனாலும் மூல உரை ‘தலைவர்கள்’ என்று வெளிப்படையாகக் குறுக்காததால், அந்த விளக்கத்தை முதன்மை உரையில் புகுத்தாமல் அடிக்குறிப்பில் வைக்கிறது.
- issue: μεγάλη என வர்ணிக்கப்படும் ஓய்வுநாள்
  choice: ‘சிறப்புமிக்க நாள்’
  alternative: ‘பெரிய நாள்’ அல்லது ‘மிக முக்கியமான ஓய்வுநாள்’
  rationale: சொல்லின் அடிப்படை ‘பெரிய’ என்றாலும், இங்கு அளவை அல்ல விசேஷ முக்கியத்துவத்தைச் சுட்டுகிறது. ‘சிறப்புமிக்க’ என்பது அதைப் புரியத்தக்க தமிழில் தருகிறது; அந்தச் சிறப்பின் தன்மையை உரை கூறாததால் மேலதிக சமய விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் காரணம்–நோக்கம்–வேண்டுகோள் உறவு தமிழில் தெளிவாக இருக்கும்படி அமைக்கப்பட்டுள்ளது. ‘ஓய்வுநாள்’, ‘ஆயத்த நாள்’ ஆகியவை நிலையான வேதாகமச் சொற்களாக இருந்தாலும் அடிக்குறிப்பின் உதவியுடன் எளிதில் புரியும் வகையில் பயன்படுத்தப்பட்டுள்ளன.
