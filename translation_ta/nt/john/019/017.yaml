source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: ta
  text: அவர் தாமே சிலுவையைச் சுமந்துகொண்டு வெளியே புறப்பட்டு, “மண்டையோட்டு இடம்” என்று அழைக்கப்படும் இடத்திற்குச் சென்றார். அது எபிரெய மொழியில்[a] கொல்கொதா என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரமேய மொழியில்” என்றும் பொருளாகலாம். யோவான் பயன்படுத்தும் “எபிரெய மொழியில்” என்ற சொற்றொடர் யூதேயாவின் உள்ளூர் செமித்திய மொழியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: சுமந்துகொண்டு
  rationale: உடலால் தூக்கிச் சுமக்கும் செயலை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: αὑτῷ τὸν σταυρόν
  choice: அவர் தாமே சிலுவையை
  rationale: αὑτῷ என்பதன் தன்வினை வலியுறுத்தலை ‘அவர் தாமே’ என வெளிப்படுத்துகிறது; ஆதாரத்தில் இல்லாத உடைமைப் பொருளைச் சேர்க்காமல், இயேசுவே அதைச் சுமந்தார் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: σταυρός
  choice: சிலுவை
  rationale: பாடுகளின் சூழலில் நிலைபெற்ற, தெளிவான தமிழ் இணைச்சொல்; ‘குறுக்குமரம்’ என்ற வரலாற்று ரீதியான குறுகிய விளக்கத்தை கிரேக்கம் கட்டாயப்படுத்தவில்லை.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: வெளியே சென்றார் என்ற இயக்கத்தை இயல்பான தமிழில் தருகிறது; சூழலில் நகரத்திலிருந்து வெளியேறிய திசையையும் உணர்த்துகிறது.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: மண்டையோட்டு இடம் என்று அழைக்கப்பட்ட இடம்
  rationale: κρανίον மற்றும் τόπος ஆகிய இரு கூறுகளையும் வெளிப்படையாக வைத்திருந்து, பெயரிடும் தொடரை தமிழில் புரியுமாறு வழங்குகிறது.
- source_word: Ἑβραϊστί
  choice: எபிரெய மொழியில்
  rationale: கிரேக்கச் சொல்லின் நேரடியான மொழிக் குறிப்பைப் பிரதான உரையில் பாதுகாக்கிறது; அரமேய மொழியைக் குறிக்கக்கூடிய பயன்பாட்டு நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Γολγοθα
  choice: கொல்கொதா
  rationale: செமித்திய இடப்பெயரின் கிரேக்க ஒலிபெயர்ப்பைத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: Ἑβραϊστί குறிக்கும் மொழி
  choice: எபிரெய மொழியில்
  alternative: அரமேய மொழியில்
  rationale: மூல கிரேக்க உரை வெளிப்படையாக ‘எபிரெய மொழியில்’ எனக் கூறுவதால் அதையே பிரதான உரை பின்பற்றுகிறது. யோவானின் பயன்பாடு யூதேயாவின் உள்ளூர் செமித்திய மொழியான அரமேயத்தையும் குறிக்கக்கூடும் என்பதால், அந்த உண்மையான மொழியியல் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர் தாமே’ என்பது தன்வினை வலியுறுத்தலைத் தக்கவைக்கிறது; பாரம்பரியமாக அறியப்பட்ட ‘சிலுவை’ மற்றும் ‘கொல்கொதா’ வடிவங்கள் தொடர்கின்றன.
