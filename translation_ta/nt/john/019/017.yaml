revisions:
- from: அவர் தாமே சிலுவையைச் சுமந்துகொண்டு, மண்டையோட்டு இடம் என்று அழைக்கப்பட்ட இடத்திற்குப் புறப்பட்டுச் சென்றார். அது எபிரெய மொழியில்[a] கொல்கொதா என்று அழைக்கப்படுகிறது.
