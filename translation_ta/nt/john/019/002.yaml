source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: ta
  text: படைவீரர்கள் முட்களால் ஒரு கிரீடத்தைப் பின்னி, அதை அவருடைய தலையில் வைத்து, அவருக்கு ஓர் ஊதா நிற மேலாடையை அணிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: படைவீரர்கள்
  rationale: ரோம இராணுவ வீரர்களைக் குறிக்கும் இயல்பான, துல்லியமான நவீனத் தமிழ்ச் சொல்.
- source_word: πλέξαντες
  choice: பின்னி
  rationale: முட்களை ஒன்றோடொன்று பின்னிச் செய்த செயலை இயல்பாகத் தெரிவிக்கிறது; வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைப் பாதுகாக்கிறது.
- source_word: στέφανον
  choice: கிரீடம்
  rationale: இங்கு அரசருக்குரிய அடையாளத்தைப் பரிகாசமாகப் பயன்படுத்தும் சூழலைத் தெளிவாகக் காட்டுகிறது; 'மாலை' என்பது அந்த அரச அடையாளத்தை மங்கச் செய்யலாம்.
- source_word: ἐξ ἀκανθῶν
  choice: முட்களால்
  rationale: கிரீடம் செய்யப்பட்ட பொருளைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: அதை அவருடைய தலையில் வைத்து
  rationale: கிரேக்கச் சொற்றொடரின் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் தெளிவாக வழங்குகிறது.
- source_word: ἱμάτιον
  choice: மேலாடை
  rationale: ἱμάτιον குறிக்கும் வெளிப்புற ஆடையை 'அங்கி' அல்லது அரச உடை என்று மிகக் குறிப்பாக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: πορφυροῦν
  choice: ஊதா நிற
  rationale: நிறத்தைக் நேரடியாகக் குறித்துப் பின்னணியிலுள்ள அரசச் சாயலை விளக்கம் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: περιέβαλον αὐτόν
  choice: அவருக்கு ... அணிவித்தார்கள்
  rationale: ஒருவர்மேல் ஆடையைப் போர்த்துதல் அல்லது அணிவித்தல் என்ற பொருளை இச்சூழலில் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: படைவீரர்களின் செயல்களில் உள்ள பரிகாச அரச அடையாளங்கள்
  choice: கிரீடம் மற்றும் ஊதா நிற மேலாடை என்ற செயல்களை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: '''அரசரைப்போல் பரிகசித்து'' போன்ற விளக்கத்தைச் சேர்த்தல்'
  rationale: பரிகாசம் சூழலிலிருந்து விளங்குகிறது; ஆனால் இவ்வசனம் அதை நேரடியாக விளக்காததால் மொழிபெயர்ப்பில் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் செயல்முறை வரிசையும் தெளிவும் காக்கப்பட்டுள்ளன.
