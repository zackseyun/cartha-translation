source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: ta
  text: கண்டவர் சாட்சி அளித்திருக்கிறார்; அவருடைய சாட்சி உண்மையானது. தாம் உண்மையைச் சொல்கிறார் என்பதை அந்தவர் அறிவார். நீங்களும் நம்பும்படியாக[a] அவர் சாட்சி அளித்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீங்களும் தொடர்ந்து நம்பும்படியாக.’ நிகழ்கால துணைவினை வடிவம் தொடரும் நம்பிக்கையைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: இதைக் கண்டவர்
  rationale: நிறைவேறிய காணுதல் இப்போதும் தொடர்புடையதாக இருப்பதை கிரேக்க இறந்தகால நிறைவு வினையெச்சம் உணர்த்துகிறது. தமிழில் இயல்பாக இருக்கவும், முந்தைய நிகழ்வை நேரில் கண்டவர் என்ற பொருளைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: μεμαρτύρηκεν
  choice: சாட்சி அளித்திருக்கிறார்
  rationale: சாட்சி ஏற்கெனவே அளிக்கப்பட்டு அதன் செல்லுபடி தொடர்வதை கிரேக்க நிறைவு காலம் உணர்த்துவதால், தமிழின் நிறைவு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: அவருடைய சாட்சி உண்மையானது
  rationale: சாட்சியின் உண்மைத்தன்மையையும் நம்பகத்தன்மையையும் நேரடியாகக் கூறும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: தமிழில் ‘அந்த ஒருவர்’ என்பது இவ்விடத்தில் செயற்கையாக ஒலிக்கும். மரியாதை ஒருமையான ‘அவர்’ சுட்டப்படும் சாட்சியாளரைத் தெளிவாகக் குறிக்கிறது; ஆனால் அவர் யார் என்பதைத் தீர்மானிப்பதில்லை.
- source_word: οἶδεν
  choice: அறிந்திருக்கிறார்
  rationale: οἶδα வடிவத்தில் நிறைவு காலமாக இருந்தாலும் நிகழ்கால நிலைபொருளைக் கொண்டது. ‘அறிந்திருக்கிறார்’ தமிழில் அந்த நிலையான அறிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀληθῆ λέγει
  choice: உண்மையைச் சொல்வதாக
  rationale: சொல்லப்படுவது உண்மை என்ற கிரேக்க வழக்கை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: நீங்களும் நம்பும்படியாக
  rationale: ἵνα கூறும் நோக்கத்தையும், καί கூறும் வாசகர்களின் இணைப்பையும் பாதுகாக்கிறது. πιστεύητε என்பதின் காலநீட்சி நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வலியுறுத்தப்பட்ட மூன்றாம் நபர் குறிப்புகளின் சுட்டுப்பொருள்
  choice: சாட்சியாளர் யார் என்பதை அடையாளப்படுத்தாமல், ‘இதைக் கண்டவர்’ மற்றும் ‘அவர்’ என்ற மூன்றாம் நபர் வடிவங்கள் வைக்கப்பட்டுள்ளன.
  alternative: கதைசொல்லி அல்லது அன்பான சீடர் தம்மையே மூன்றாம் நபரில் குறிப்பிடுகிறார்; அல்லது வேறொரு நேரடிச் சாட்சியாளர் குறிப்பிடப்படுகிறார்.
  rationale: கிரேக்க உரை சாட்சியாளரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: πιστεύητε என்பதின் பொருள் நுணுக்கம்
  choice: நம்பும்படியாக
  alternative: தொடர்ந்து நம்பிக்கைகொள்ளும்படியாக
  rationale: நிகழ்கால துணைவினை வடிவம் தொடர்ச்சியான நம்பிக்கையை உணர்த்தக்கூடும்; ஆனால் இங்கு தொடக்க நம்பிக்கையா தொடரும் நம்பிக்கையா என்பது உறுதியாகத் தீர்மானிக்க முடியாது. முதன்மை உரை பொதுவான வடிவத்தையும் அடிக்குறிப்பு மாற்று நுணுக்கத்தையும் தருகிறது.
- issue: இறுதி நோக்க வாக்கியத்துடன் சாட்சி அளித்தலை இணைத்தல்
  choice: ‘அவர் சாட்சி அளித்திருக்கிறார்’ என்பது இறுதியில் மீண்டும் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
  alternative: கிரேக்கச் சொல்வரிசையை நெருக்கமாகப் பின்பற்றி, ‘நீங்களும் நம்பும்படியாக’ என்பதுடன் வசனத்தை முடித்தல்.
  rationale: கிரேக்கத்தில் நோக்க வாக்கியம் முன் கூறிய சாட்சி அளித்தலையே சார்கிறது. தமிழில் நீளமான இடைச்செருகலுக்குப் பின் அந்த வினையை மீண்டும் கூறுவது தொடர்பைத் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சி அளித்திருக்கிறார்’ என்ற வடிவம் யோவான் நூலின் சாட்சி சார்ந்த சொற்தொடரைக் காக்கிறது. சாட்சியாளர் யார் என்ற தெளிவின்மை தீர்க்கப்படவில்லை; மரியாதை ஒருமை தமிழின் இயல்பான மனிதர் குறிப்பு மட்டுமே, சிறப்பு அடையாளமோ தெய்வீக நிலையோ விதிப்பதில்லை.
