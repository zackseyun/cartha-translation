  text: ἀπεκρίθη ὁ Πιλᾶτος· Ὃ γέγραφα γέγραφα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/022.yaml
  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: ta
  text: 'பிலாத்து பதிலளித்தான்: “நான் எழுதியது எழுதியதுதான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தான்
  rationale: ἀποκρίνομαι என்பதன் இறந்தகால வடிவம் இங்கு உரையாடலில் ‘பதிலளித்தான்’ என்று இயல்பாகப் பொருள்படுகிறது.
- source_word: ὁ Πιλᾶτος
  choice: பிலாத்து
  rationale: கிரேக்க மொழியின் கதைநடையில் பெயருக்கு முன் வரும் குறிப்புச் சுட்டு தமிழில் தேவையில்லை; பெயர் வழக்கமான தமிழ் வடிவில் தரப்படுகிறது.
- source_word: Ὃ
  choice: நான் எழுதியது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் சார்புப்பெயர் ‘எது/எதை’ என்ற பொருளைத் தருகிறது; முழுத் தொடரில் ‘நான் எழுதியது’ என்பது இயல்பான தமிழ்.
- source_word: γέγραφα γέγραφα
  choice: நான் எழுதியது எழுதியதுதான்
  rationale: இருமுறை வரும் நிறைவுநிலை வினைச்சொல்லின் வலியுறுத்தலையும், எழுதப்பட்டது மாற்றப்படாமல் நிலைத்திருக்கும் இறுதித்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: γέγραφα γέγραφα என்ற இரட்டிப்பு நிறைவுநிலையின் வலிமை
  choice: “நான் எழுதியது எழுதியதுதான்” என்று இறுதியான, மாற்றமற்ற முடிவை உணர்த்துதல்
  alternative: “நான் எழுதியதை எழுதிவிட்டேன்”
  rationale: தேர்ந்தெடுக்கப்பட்ட வடிவம் கிரேக்கச் சொல்லின் இரட்டிப்பைத் தெளிவாகக் காத்து, பிலாத்து வாசகத்தை மாற்ற மறுப்பதை மேலதிக விளக்கம் சேர்க்காமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கதைநடை. மூலத்தின் வலியுறுத்தும் இரட்டிப்பு தமிழில் இயல்பாக ஒலிக்க ‘எழுதியது எழுதியதுதான்’ என அமைக்கப்பட்டுள்ளது.
