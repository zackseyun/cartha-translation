  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: ta
  text: 'மேலும், வேறொரு வேதவசனம் இவ்வாறு கூறுகிறது[a]: “அவர்கள் குத்தியவரை அவர்கள் நோக்கிப் பார்ப்பார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் குத்தியவரை அவர்கள் நோக்குவார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் ஒருவரை நோக்கிப் பார்ப்பதைக் குறிக்கிறது; இது சகரியா 12:10-ஐ எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மேலும்
  rationale: இங்கு இன்னொரு வேதவசனச் சான்றை அறிமுகப்படுத்துவதால், நவீனத் தமிழில் இயல்பான இணைப்புச் சொல்லாக ‘மேலும்’ அமைகிறது.
- source_word: ἑτέρα γραφή
  choice: வேறொரு வேதவசனம்
  rationale: γραφή இங்கு அதிகாரமுள்ள வேத எழுத்தைக் குறிக்கிறது; ‘வேறொரு வேதவசனம்’ என்பது கூடுதல் வேதச் சான்று என்ற பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: λέγει
  choice: இவ்வாறு கூறுகிறது
  rationale: வேதவசனம் நிகழ்காலத்தில் பேசுவதாக அமைந்துள்ள கிரேக்க மேற்கோள் முறையைப் பேணுகிறது; ‘இவ்வாறு’ நேரடி மேற்கோளை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: Ὄψονται
  choice: நோக்கிப் பார்ப்பார்கள்
  rationale: வெறும் காணுதலைவிட ஒருவரை நோக்கித் திரும்பிப் பார்ப்பது என்ற திசைப்பட்ட பார்வையை வெளிப்படுத்துகிறது.
- source_word: εἰς ὃν
  choice: தாங்கள் குத்தினவரை
  rationale: εἰς என்பதன் திசைநோக்கிய நுணுக்கம் ‘நோக்கிப்’ என்பதில் வெளிப்படுகிறது; ὃν என்பது தனிப்பட்ட நபரைக் குறிக்கும் வகையில் ‘குத்தினவரை’ என இயல்பாக அமைகிறது.
- source_word: ἐξεκέντησαν
  choice: குத்தின
  rationale: கூரிய ஆயுதத்தால் ஊடுருவிக் காயப்படுத்திய செயலைத் தெளிவாகக் குறிக்கிறது; உடனடியான சிலுவை மரணச் சூழலுக்கும் தீர்க்கதரிசன எதிரொலிக்கும் பொருந்துகிறது.
theological_decisions:
- issue: சகரியா 12:10-ன் எதிரொலியை, யோவானின் சொற்களை மீறி மூலத் தீர்க்கதரிசனத்தின் முதலாம் நபர் வடிவத்தைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: “தாங்கள் குத்தினவரை அவர்கள் நோக்கிப் பார்ப்பார்கள்”
  alternative: “தாங்கள் குத்தினவரை அவர்கள் நோக்குவார்கள்”
  rationale: யோவானின் கிரேக்க வாசகமே இந்த வசனத்தின் மொழிபெயர்ப்பை நிர்ணயிக்க வேண்டும். தேர்ந்த வடிவம் குத்தப்பட்ட நபரைத் தெளிவாகக் காட்டுவதோடு, சூழலில் அவர் இயேசு என்பதையும் வாசகர் உணர இடமளிக்கிறது; சகரியாவின் எபிரெய முதலாம் நபர் வடிவத்தை இங்கே இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வேதவசனம்’ என்பது மேற்கோள் காட்டப்படும் தனிப்பட்ட Scripture passage-ஐ இயல்பாகக் குறிக்கிறது. ‘தாங்கள்’ என்பது வாக்கியத்தின் உட்பொருளில் செய்பவர்களையே மீண்டும் சுட்டி, தேவையற்ற வெளிப்புற அடையாளத்தைச் சேர்க்காமல் உள்ளது.
