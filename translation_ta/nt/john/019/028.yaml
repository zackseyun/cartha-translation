source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: ta
  text: இதற்குப் பிறகு, எல்லாம் ஏற்கெனவே நிறைவடைந்துவிட்டது என்பதை இயேசு அறிந்து, வேதவாக்கியம் நிறைவேறும்படி, “எனக்குத் தாகமாக இருக்கிறது”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழக்கில், “தாகமாயிருக்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: இதற்குப் பிறகு
  rationale: τοῦτο என்ற ஒருமைச் சுட்டுப்பெயரைப் பாதுகாத்து, யோவானின் கதைநடையில் இயல்பான காலத் தொடர்ச்சியைத் தருகிறது.
- source_word: εἰδὼς
  choice: அறிந்து
  rationale: இயேசுவின் செயலைச் சூழ்நிலையாக விளக்கும் பங்கேற்புவினையின் ஒரேகாலத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἤδη πάντα τετέλεσται
  choice: எல்லாம் ஏற்கெனவே நிறைவடைந்துவிட்டது
  rationale: πάντα என்பதை ‘எல்லாம்’ என வெளிப்படையாகக் காட்டுகிறது; perfect வடிவமான τετέλεσται குறிக்கும் நிறைவுற்று நிலைத்திருக்கும் நிலையையும் ‘நிறைவடைந்துவிட்டது’ எடுத்துரைக்கிறது.
- source_word: ἵνα τελειωθῇ
  choice: நிறைவேறும்படி
  rationale: வேதவாக்கியத்தை எழுவாயாகக் கொண்ட இவ்விடத்தில் ‘நிறைவேறு’ என்பது இயல்பான தமிழ் வேதாகமப் பயன்பாடு; ἵνα தரும் நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கத்தைத் தீர்மானமாகக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: ἡ γραφή
  choice: வேதவாக்கியம்
  rationale: இங்கு γραφή புனித வேதத்தின் குறிப்பிட்ட வாக்கியத்தைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகால மரியாதை வினையாக வழங்குகிறது.
- source_word: Διψῶ
  choice: எனக்குத் தாகமாயிருக்கிறது
  rationale: நிகழ்காலத் தாகநிலையை ordinary modern Tamil-இல் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; சுருக்கமான மரபுவழி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் அறிவு, எல்லாம் நிறைவடைந்த நிலை, வேதவாக்கியத்தின் நிறைவேற்றம் ஆகியவற்றின் தொடர்பு
  choice: எல்லாம் ஏற்கெனவே நிறைவடைந்துவிட்டதை இயேசு அறிந்தார்; பின்னர் வேதவாக்கியம் நிறைவேறும்படி அவர் பேசினார் என்ற கிரேக்க வாக்கிய அமைப்பு பாதுகாக்கப்பட்டது.
  alternative: ἵνα தொடர் நோக்கத்தை மட்டுமல்லாமல் விளைவையும் சுட்டுவதாகப் புரிந்துகொள்ளலாம்; இதன் மூலம் விரிவான இறையியல் அமைப்பு எதையும் வசனம் தானாகக் கூறுவதாகக் கொள்ள வேண்டியதில்லை.
  rationale: τετέλεσται என்பதையும் τελειωθῇ என்பதையும் ஒரேபோல் கலக்காமல், முறையே ‘நிறைவடைந்துவிட்டது’ மற்றும் ‘நிறைவேறும்படி’ என வேறுபடுத்துகிறது. முன்னறிவு அல்லது முன்நியமனம் குறித்த பிற்காலக் கோட்பாட்டை உரைக்குள் சேர்க்காமல், மூலத்தின் இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எனக்குத் தாகமாயிருக்கிறது’ இயல்பான தற்போதைய வழக்கு; ‘தாகமாயிருக்கிறேன்’ என்ற சுருக்கமான மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
