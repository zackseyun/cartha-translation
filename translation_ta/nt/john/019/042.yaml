source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: ta
  text: ஆகவே, அன்று யூதர்களின் ஆயத்த நாளாக இருந்ததாலும்[a], அந்தக் கல்லறை அருகில் இருந்ததாலும், அவர்கள் இயேசுவை அங்கே வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களின் ஆயத்த நாளின் காரணமாக”; அல்லது, “அது யூதர்களின் ஆயத்த நாளாக இருந்ததால்.”
    reason: παρασκευή என்பது ‘ஆயத்த நாள்’ என்ற காலண்டர் பெயராகவும், ‘ஆயத்தம்’ என்ற சொல்லாகவும் புரிந்துகொள்ளப்படலாம்; கிரேக்கத் தொடரின் காரணப் பொருளைத் தமிழில் ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் தர முடியும்.
lexical_decisions:
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கும் இடவினையடை; தமிழில் வாக்கியத்தின் இறுதியில் அமைப்பது இயல்பாக உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுகளிலிருந்து தொடரும் முடிவையும் காரணத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τὴν παρασκευὴν
  choice: ஆயத்த நாளாக இருந்ததாலும்
  rationale: διά உடன் வரும் குற்றுவேற்றுமை காரணத்தைக் குறிக்கிறது; παρασκευή ஓய்வுநாளுக்கு முந்தைய ஆயத்த நாளைக் குறிக்கும் காலண்டர் சொல்லாக இங்கு பயன்படுகிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: மூலத்தின் உரிமைத் தொடர்பைக் காக்கிறது; இன, சமய அல்லது வழக்கத் தொடர்பைத் தேவையின்றி மேலும் வரையறுக்கவில்லை.
- source_word: ὅτι
  choice: இருந்ததாலும்
  rationale: குறிப்பிட்ட கல்லறையைத் தேர்ந்தெடுத்ததற்கான கூடுதல் காரணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγγὺς
  choice: அருகில்
  rationale: கல்லறையின் அண்மையை எளிய, இயல்பான தமிழில் குறிக்கிறது.
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: இச்சூழலில் உடலை வைக்கும் அடக்க இடத்தைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: ἔθηκαν
  choice: வைத்தார்கள்
  rationale: இயேசுவின் உடலைக் கல்லறையில் வைத்த செயலை இயல்பாகச் சொல்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அடக்கம் செய்தார்கள்’ என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: τὸν Ἰησοῦν
  choice: இயேசுவை
  rationale: வினையின் நேர்செயப்படுபொருளாக உள்ள பெயரைத் தமிழின் வேற்றுமை அமைப்புக்கு ஏற்ப தருகிறது.
theological_decisions:
- issue: பாடுபட்ட வரலாற்றுச் சூழலில் παρασκευή என்பதன் மொழிபெயர்ப்பு
  choice: ஆயத்த நாள்
  alternative: ஆயத்தம்
  rationale: இச்சொல் ஒரு குறிப்பிட்ட நாளுக்கான நிலையான காலண்டர் பெயராகவும் அமையலாம். ‘ஆயத்த நாள்’ என்பது நவீன வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது; எந்த ஓய்வுநாள் அல்லது பண்டிகை குறித்த மேலதிக முடிவையும் வசனத்தில் சேர்ப்பதில்லை.
- issue: யோவான் உரையில் τῶν Ἰουδαίων என்பதன் மொழிபெயர்ப்பு
  choice: யூதர்களின்
  alternative: யூத ஆயத்த நாள்
  rationale: கிரேக்க உரையின் உரிமைத் தொடர்பை வெளிப்படையாகக் காத்து, யூத மக்களைப் பற்றிய இறையியல் மதிப்பீடு எதையும் சேர்க்காமல் அந்நாளின் யூதச் சூழலை மட்டும் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. காரணத் தொடர்கள் இயல்பாக இணைக்கப்பட்டுள்ளன; மூலத்தில் உள்ள ஒரே ἐκεῖ என்பதற்கு வாக்கிய இறுதியில் ‘அங்கே’ பயன்படுத்தப்பட்டுள்ளது.
