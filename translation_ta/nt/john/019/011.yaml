id: JHN.19.11
reference: John 19:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: ta
  text: இயேசு அவரிடம், “மேலிருந்து[a] உமக்குக் கொடுக்கப்பட்டிருக்காவிட்டால், என்மேல் உமக்கு எந்த அதிகாரமும் இருந்திருக்காது. ஆகவே, என்னை உம்மிடம் ஒப்படைத்தவனுக்கு[b] உம்மைவிடப் பெரிய பாவம் உண்டு” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வானத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நேரடியாக “மேலிருந்து” என்று பொருள்படும்; யோவான் எழுதிய நூலில் இது பெரும்பாலும் தெய்வீக மூலத்தைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இயேசுவை ஒப்படைத்தவர் யார் என்று இங்கு வெளிப்படையாகக் கூறப்படவில்லை. இது யூதாஸ், காய்பா அல்லது யூதத் தலைமை ஆகியோரில் யாரைக் குறிக்கிறது என்பதில் வெவ்வேறு புரிதல்கள் உள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: பிலாத்துவின் ஆட்சிசார் மற்றும் நீதித்துறை அதிகாரத்தைக் குறிக்கிறது; வெறும் வலிமை அல்லது ஆற்றல் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: என்மேல் ... எந்த அதிகாரமும்
  rationale: κατά உடன் வரும் நீதித்துறைச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘எந்த ... உம்’ என்பது οὐδεμίαν என்பதன் முழுமையான மறுப்பையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: δεδομένον σοι
  choice: உமக்குக் கொடுக்கப்பட்டிருக்காவிட்டால்
  rationale: பிலாத்துவின் தற்போதைய அதிகாரத்திற்கு முன்பே அது வழங்கப்பட்டிருப்பதை நிறைவுற்ற வினை வடிவம் உணர்த்துகிறது.
- source_word: ἄνωθεν
  choice: மேலிருந்து
  rationale: யோவானின் பயன்பாட்டில் காணப்படும் தெய்வீக மூலத்தைக் குறிக்கும் சொல்லை நேரடியாகக் காக்கிறது; ‘வானத்திலிருந்து’ என்று விளக்கமாகத் தீர்மானிப்பதை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் காரண-முடிவு தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ παραδούς μέ σοι
  choice: என்னை உம்மிடம் ஒப்படைத்தவன்
  rationale: παραδίδωμι என்பதன் இச்சூழலுக்குரிய பொருளைக் காக்கிறது; அந்த நபர் யூதாஸ், காய்பா அல்லது யூதத் தலைமை என்று உரையிலேயே தீர்மானிக்கவில்லை.
- source_word: μείζονα ἁμαρτίαν
  choice: உம்மைவிடப் பெரிய பாவம்
  rationale: ஒப்பீட்டின் மறைமுக இரண்டாம் தரப்பான பிலாத்துவைத் தமிழில் தெளிவுபடுத்தி, குற்றப்பொறுப்பின் அளவிலான ஒப்பீட்டை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ἄνωθεν என்பதில் சுட்டப்படும் பிலாத்துவின் அதிகாரத்தின் மூலம்
  choice: ‘மேலிருந்து’ என்று மொழிபெயர்த்து, அதிகாரம் உயர்ந்த தெய்வீக மூலத்திலிருந்து வழங்கப்பட்டது என்பதைச் சுட்டுதல்
  alternative: ‘வானத்திலிருந்து’ அல்லது பொதுவாக ‘உயர்ந்த இடத்திலிருந்து’
  rationale: இங்கு தெய்வீக மூலம் சுட்டப்பட்டாலும், இந்த ஒரே நிகழ்வுக்கு அப்பாற்பட்ட முழுமையான அரசியல் இறையியலை வசனத்தில் சேர்க்காமல் இருக்கிறது.
- issue: ὁ παραδούς μέ σοι என்பவரின் அடையாளம்
  choice: அடையாளத்தைத் தீர்மானிக்காமல் ‘என்னை உம்மிடம் ஒப்படைத்தவன்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: யூதாஸ், காய்பா அல்லது யூதத் தலைமை
  rationale: கிரேக்க மூலவுரை அந்த நபரை இங்கு பெயரிட்டு அடையாளப்படுத்தவில்லை; எனவே அதன் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
- issue: μείζονα ἁμαρτίαν குறிக்கும் ஒப்பீடு
  choice: ஒப்படைத்தவனின் பாவம் பிலாத்துவினுடையதைவிடப் பெரியது என்று மொழிபெயர்த்தல்
  alternative: ஒப்பீட்டின் மறைமுகத் தரப்பைக் குறிப்பிடாமல் ‘பெரிய பாவம்’ அல்லது ‘அதிகமான பாவம்’ என்று மொழிபெயர்த்தல்
  rationale: μείζονα என்பது ஒப்பீட்டு வடிவம். சூழலில் ஒப்பிடப்படுபவர் பிலாத்து என்பது தெளிவு; அதேவேளை இந்த ஒப்பீடு பிலாத்துவை பாவமற்றவராக அறிவிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. பிலாத்துவை நோக்கிய ஒருமை உரையாடலில் சமூகச் சூழலுக்கேற்ற மரியாதை வடிவமான ‘உமக்கு/உம்மிடம்’ பயன்படுத்தப்பட்டது. மூலவுரையின் அடையாளத் தெளிவின்மையும் குற்றப்பொறுப்பின் ஒப்பீடும் காக்கப்பட்டுள்ளன.
