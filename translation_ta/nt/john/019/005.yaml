language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: ta
  text: ஆகவே இயேசு முள் கிரீடத்தையும் ஊதா நிற மேலங்கியையும் அணிந்தவராக வெளியே வந்தார். பிலாத்து அவர்களிடம், “இதோ, இந்த மனிதன்!”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாருங்கள், இந்த மனிதன்!” கிரேக்கச் சொல் Ἰδοὺ கவனத்தை ஈர்க்கும் ஒரு வெளிப்பாடு; இதை “இதோ,” “பாருங்கள்,” அல்லது “பாருங்கள்” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: ஆகவே ... வெளியே வந்தார்
  rationale: οὖν நிகழ்வின் தொடர்ச்சியையும் விளைவையும் குறிக்கிறது; ἐξῆλθεν மற்றும் ἔξω ஆகியவற்றின் இயல்பான தமிழாக்கம் ‘வெளியே வந்தார்’. மரியாதை வினைமுற்று நவீனத் தமிழ் வேதாகம நடைக்கு ஏற்றது.
- source_word: φορῶν
  choice: அணிந்தவராக
  rationale: கிரீடமும் மேலங்கியும் உடலில் அணிந்திருந்த நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: முள் கிரீடத்தை
  rationale: ἀκάνθινος என்பது முட்களால் செய்யப்பட்டதைச் சுட்டுகிறது; ‘முள் கிரீடம்’ இதனைச் சுருக்கமாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: ஊதா நிற மேலங்கியை
  rationale: ἱμάτιον வெளிப்புற ஆடையைக் குறிக்கும் பொதுச் சொல். ‘மேலங்கி’ வடிவத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல் பொருளைத் தருகிறது; πορφυροῦν என்பதற்கு ‘ஊதா நிற’ இயல்பான தமிழாகும்.
- source_word: λέγει
  choice: என்றான்
  rationale: கிரேக்கத்தின் வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடையாக வழங்குகிறது. எழுவாய் சூழலிலிருந்து பிலாத்து எனத் தெளிவாக இருப்பதால், தமிழில் வெளிப்படையாகக் குறிப்பிடுவது வாசிப்புத் தெளிவை அளிக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து முன்னிறுத்தும் இடைச்சொல்; ‘இதோ’ பொது அறிவிப்பின் வலிமையையும் காட்சிச் சுட்டுதலையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதன்
  rationale: கூட்டத்தின்முன் நிறுத்தப்பட்ட குறிப்பிட்ட ஆணாகிய இயேசுவைச் சுட்டுகிறது. ‘அந்த மனிதன்’ தமிழில் தனிநபர் சுட்டைத் தெளிவாக்கி, விரிவான இறையியல் பொருளை முதன்மை உரைக்குள் திணிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: பிலாத்தின் அறிவிப்பிலுள்ள ὁ ἄνθρωπος என்பதன் பொருள்
  choice: அந்த மனிதன்
  alternative: மனிதன் / அந்த மனிதர் / மனிதப் பிறவி
  rationale: இங்கு நேரடியாகக் கூட்டத்தின்முன் காட்டப்படும் இயேசுவையே சொற்றொடர் குறிக்கிறது. பிரதிநிதித்துவமான மனிதகுலம் போன்ற விரிவான எதிரொலிகள் இருக்கக்கூடும்; ஆனால் அவற்றை முதன்மைப் பொருளுக்குப் பதிலாக மொழிபெயர்ப்பில் தீர்மானித்து நுழைக்காமல், குறிப்பிட்ட நபரைக் குறிக்கும் இயல்பான வாசிப்பை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் காட்சியின் பொது அறிவிப்பு மற்றும் பரிகாச அரசத் தோற்றத்தின் கனத்தை காக்கிறது. அடிக்குறிப்பு குறியீடு உரையில் அறிவிப்புக்குப் பின் இடப்பட்டுள்ளது.
