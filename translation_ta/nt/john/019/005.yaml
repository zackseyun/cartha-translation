revisions:
- from: ஆகவே இயேசு, முள் கிரீடத்தையும் ஊதா நிற மேலங்கியையும் அணிந்தவராக வெளியே வந்தார். பிலாத்து அவர்களிடம், “இதோ, அந்த மனிதன்!”[a] என்றான்.
  to: ஆகவே இயேசு முள் கிரீடத்தையும் ஊதா நிற மேலங்கியையும் அணிந்தவராக வெளியே வந்தார். பிலாத்து அவர்களிடம், “இதோ, இந்த மனிதன்!”[a] என்றார்.
  rationale: The revision removes the unsupported distal sense in “அந்த” and uses the natural presentational Tamil expression “இதோ, இந்த மனிதன்!” The footnote is adjusted to remove the informal singular alternative. All other wording is retained because it faithfully and naturally represents the Greek narrative.
