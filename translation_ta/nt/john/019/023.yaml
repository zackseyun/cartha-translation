source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: ta
  text: அப்போது படைவீரர்கள் இயேசுவைச் சிலுவையில் அறைந்தபின், அவருடைய மேலாடைகளை[a] எடுத்து நான்கு பங்குகளாகப் பிரித்து, ஒவ்வொரு படைவீரனுக்கும் ஒரு பங்கைக் கொடுத்தார்கள்; அங்கியையும் எடுத்தார்கள். அந்த அங்கியோ தையலே இல்லாததாக, மேலிருந்து[b] முழுவதும் நெய்யப்பட்டிருந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆடைகளை.’ கிரேக்கச் சொல் பொதுவாக உடைகளைக் குறிக்கலாம்; ஆனால் இங்கு அங்கி தனியே குறிப்பிடப்படுவதால், மேலாடைகள் என்று பொருள்பட வாய்ப்பு அதிகம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேல்பகுதியிலிருந்து.’ இச்சூழலில் ஆடையின் மேல்பகுதியிலிருந்து கீழ்நோக்கி நெய்யப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘முழு ஆடையும் தொடர்ச்சியாக நெய்யப்பட்டிருந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: ஆகவே, படைவீரர்கள்
  rationale: οὖν இங்கு நிகழ்ச்சியைத் தொடர்ந்து முன்னெடுக்கும் இணைப்புச்சொல்; ‘ஆகவே’ முந்தைய நிகழ்வுடன் உள்ள தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: இயேசுவைச் சிலுவையில் அறைந்தபின்
  rationale: ὅτε உடன் வரும் இறந்தகால வினை, அடுத்த செயல்களுக்கு முன் சிலுவையில் அறைதல் நடந்ததைத் தெளிவுபடுத்துகிறது.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: அவருடைய மேலாடைகளை
  rationale: ἱμάτια பொதுவாக ஆடைகளைக் குறிக்கலாம்; இங்கு தனியே சொல்லப்படும் χιτών என்பதிலிருந்து வேறுபடுத்த ‘மேலாடைகள்’ பொருத்தமானது.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: நான்கு பங்குகளாகப் பிரித்து, ஒவ்வொரு படைவீரனுக்கும் ஒரு பங்கைக் கொடுத்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘நான்கு பங்குகளைச் செய்தார்கள்’ என்றாலும், பகிர்ந்துகொண்ட செயலை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: καὶ τὸν χιτῶνα
  choice: உள்ளாடையையும் எடுத்தார்கள்
  rationale: χιτών உடலுக்கு அண்மையில் அணியப்பட்ட ஆடையைக் குறிக்கிறது. தமிழில் ‘உள்ளாடை’ வேறுபாட்டைத் தெளிவாக்குகிறது; ‘எடுத்தார்கள்’ என்பது முன் வினையிலிருந்து இயல்பாக நிறைவு செய்யப்பட்டுள்ளது.
- source_word: ἄραφος
  choice: தையலில்லாமல்
  rationale: ἄραφος என்பதன் நேர்ப்பொருள் தைக்கப்படாதது அல்லது தையல் இணைப்பு இல்லாதது; இயல்பான தமிழில் ‘தையலில்லாமல்’.
- source_word: ἐκ τῶν ἄνωθεν
  choice: மேலிருந்து
  rationale: ἄνωθεν என்பதில் ‘மேலிருந்து’ என்ற இயல்பான பொருளைத் தக்கவைக்கிறது; சூழலில் ஆடையின் மேற்பகுதியிலிருந்து நெய்யப்பட்டதைக் குறிக்க வாய்ப்புள்ளது.
- source_word: ὑφαντὸς δι’ ὅλου
  choice: முழுவதும் ஒரே துணியாக நெய்யப்பட்டிருந்தது
  rationale: ὑφαντός ‘நெய்யப்பட்ட’ என்றும் δι’ ὅλου முழு அளவிலும் தொடர்ச்சியாக இருப்பதையும் குறிக்கிறது; ‘ஒரே துணியாக’ கட்டுமானத்தின் தொடர்ச்சியை இயல்பாக விளக்குகிறது.
theological_decisions:
- issue: தையலில்லாத உள்ளாடைக்கு அடையாள அல்லது கோட்பாட்டுப் பொருள் சேர்த்தல்
  choice: ஆடையின் அமைப்பை மட்டும் விளக்கமாக மொழிபெயர்த்தல்
  alternative: ஆசாரிய ஆடை அல்லது திருச்சபை ஒற்றுமையின் அடையாளம் என்று மொழிபெயர்ப்பிலேயே சுட்டுதல்
  rationale: மூல வசனம் படைவீரர்களின் செயலையும் ஆடையின் அமைப்பையும் மட்டுமே விவரிக்கிறது; சாத்தியமான அடையாளப் பொருளை முதன்மை உரையில் சேர்ப்பது உரை கூறாத கோட்பாட்டை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆடைகளுக்கிடையிலான வேறுபாடு தெளிவாக்கப்பட்டாலும், மூலத்தின் ‘மேலிருந்து’ என்ற சாத்தியமான இரட்டைப் பொருள் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
