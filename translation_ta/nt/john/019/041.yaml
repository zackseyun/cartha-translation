source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ta
  text: அவர் சிலுவையில் அறையப்பட்ட இடத்தில் ஒரு தோட்டம் இருந்தது; அந்தத் தோட்டத்தில் ஒரு புதிய கல்லறை இருந்தது. அதில் அதுவரை யாரும் வைக்கப்பட்டிருக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் இன்றி இயல்பான தொடர்ச்சி
  rationale: இங்கு δὲ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனியாக ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ சேர்ப்பது இல்லாத கால அல்லது முரண்பாட்டு நுணுக்கத்தை உண்டாக்கும்.
- source_word: τόπῳ
  choice: இடத்தில்
  rationale: τόπος என்பதற்கான நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: ὅπου ἐσταυρώθη
  choice: அவர் சிலுவையில் அறையப்பட்ட
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவத்தைப் பேணி, சூழலிலிருந்து இயேசுவைக் குறிக்கும் மரியாதைப் பெயர்ச்சொல் வழங்கப்பட்டுள்ளது.
- source_word: κῆπος
  choice: தோட்டம்
  rationale: κῆπος என்பதன் பொதுவான பொருளைத் துல்லியமாகக் கொடுக்கிறது; ‘பழத்தோட்டம்’ என்பது தேவையற்ற குறிப்பாக்கம்.
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: அடக்கம் செய்யப்படும் இடத்தைக் குறிக்கும் வழக்கமான, புரியத்தக்க தமிழ்ச் சொல்; வெறும் புதைகுழி என்ற எண்ணத்துக்கு மட்டும் கட்டுப்படுத்தாது.
- source_word: καινόν
  choice: புதிய
  rationale: καινός என்பதன் நேரடிப் பொருள்; அது இதுவரை பயன்படுத்தப்படாதது என்பதை அடுத்த வாக்கியம் தனியே விளக்குகிறது.
- source_word: ἐν ᾧ
  choice: அதில்
  rationale: முன்னர் சொல்லப்பட்ட கல்லறையைத் தெளிவாகச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: οὐδέπω οὐδεὶς
  choice: அதுவரை யாரும் ... இல்லை
  rationale: οὐδέπω என்பதன் கால நுணுக்கத்தையும் οὐδείς என்பதன் முழுமையான மறுப்பையும் இயல்பாகப் பேணுகிறது.
- source_word: ἦν τεθειμένος
  choice: வைக்கப்பட்டிருக்கவில்லை
  rationale: முன்னரே நிகழ்ந்து நிலைத்திருக்க வேண்டிய அடக்க நிலையை மறுக்கும் சுற்றுவினை அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘அடக்கம் செய்யப்பட்டிருக்கவில்லை’ என்று மூலத்தில் இல்லாத அளவுக்கு விளக்கவில்லை.
theological_decisions:
- issue: ἐσταυρώθη என்பதன் செயப்பாட்டு வடிவம்
  choice: அவர் சிலுவையில் அறையப்பட்ட
  alternative: அவர்கள் அவரைச் சிலுவையில் அறைந்த
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தைப் பேணி, இவ்வாக்கியத்தில் குறிப்பிடப்படாத செய்பவர்களை வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: அடக்கச் சூழலில் μνημεῖον மற்றும் τεθειμένος
  choice: கல்லறை ... வைக்கப்பட்டிருக்கவில்லை
  alternative: புதைகுழி ... அடக்கம் செய்யப்பட்டிருக்கவில்லை
  rationale: உறுதியான அடக்கச் சூழலைத் தெளிவாக வைத்துக்கொண்டு, கல்லறையின் வடிவத்தையோ அடக்கச் செயலைவிட அதிகமான விளக்கத்தையோ மூலத்திற்கு அப்பால் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான கதைநடை. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், தோட்டம்–கல்லறை என்ற இடத் தொடர்பும் புதிய கல்லறை இதுவரை பயன்படுத்தப்படாதது என்ற கருத்துத் தொடர்ச்சியும் பேணப்பட்டுள்ளன.
