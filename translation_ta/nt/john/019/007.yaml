source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: ta
  text: யூதர்கள் அவரிடம், “எங்களுக்கு ஒரு சட்டம் இருக்கிறது; அந்தச் சட்டத்தின்படி[a] அவன் இறக்க வேண்டும். ஏனெனில், அவன் தன்னை தேவனுடைய மகனாக ஆக்கிக்கொண்டான்” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சட்டத்தின்படி.” கிரேக்கத்தில் “சட்டம்” என்ற சொல் மீண்டும் வருகிறது; இரண்டாவது முறை அது முதலில் குறிப்பிடப்பட்ட சட்டத்தையே சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: பதிலளித்தார்கள்
  rationale: கதைநடையில் இயல்பாகப் பயன்படுத்தப்படும் பதில்வினையைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கத்தில் உள்ள குழுப்பெயரை நேரடியாகப் பிரதிபலிக்கிறது; இந்த வசனம் தலைவர்களை மட்டும் தனியாகக் குறிப்பிடவில்லை.
- source_word: νόμον ἔχομεν
  choice: எங்களுக்கு ஒரு சட்டம் இருக்கிறது
  rationale: முதல் νόμον கிரேக்கத்தில் சுட்டிடைச்சொல் இன்றி வருவதைப் பிரதிபலிப்பதுடன், நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: κατὰ τὸν νόμον
  choice: அந்தச் சட்டத்தின்படி
  rationale: இரண்டாவது νόμον முன்பு குறிப்பிடப்பட்ட சட்டத்தையே சுட்டுவதால், அதன் பின்னோக்கிச் சுட்டும் தன்மையைப் பாதுகாக்கிறது.
- source_word: ὀφείλει ἀποθανεῖν
  choice: இவன் சாக வேண்டும்
  rationale: சட்டரீதியான கடமை அல்லது கட்டாயத்தை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் குற்றஞ்சாட்டப்படுகிற இயேசுவைச் சுட்ட ‘இவன்’ பொருத்தமானது.
- source_word: υἱὸν θεοῦ
  choice: தேவனுடைய மகன்
  rationale: சுட்டிடைச்சொல் இல்லாவிட்டாலும், இங்கு தனித்துவமான தெய்வீக மகத்துவத்தைக் குறிக்கும் பட்டப்பெயர்சார் பொருளைத் தக்கவைக்கிறது.
- source_word: ἑαυτὸν ἐποίησεν
  choice: தன்னை ... ஆக்கிக்கொண்டான்
  rationale: குற்றஞ்சாட்டுவோரின் சொற்றொடரை விளக்கமாக மாற்றாமல், கிரேக்க மொழிநடையைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான குற்றச்சாட்டில் υἱὸν θεοῦ என்பதன் பொருள்
  choice: தேவனுடைய மகன்
  alternative: தேவனின் ஒரு மகன்
  rationale: யோவான் நூலின் சூழலில் இது பலரில் ஒருவன் என்ற வகைப்பாட்டை அல்ல, இயேசு தமக்கென உரிமைகொண்டதாக எதிரிகள் கருதிய தனித்துவமான தெய்வீக மகத்துவத்தைக் குறிக்கிறது. அதேவேளையில், இது எதிரிகளின் குற்றச்சாட்டாகவே மொழிபெயர்க்கப்படுகிறது; கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமாகக் கேட்கும் ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டது. குற்றஞ்சாட்டுவோரின் வாய்மொழிச் சூழலைக் காட்ட ‘இவன்’ பயன்படுத்தப்பட்டுள்ளது.
