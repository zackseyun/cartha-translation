revisions:
- from: ஆகவே, யூதர்களின்[a] தலைமைக் குருக்கள் பிலாத்துவிடம், “நீர், ‘யூதர்களின் அரசர்’ என்று எழுதாமல், ‘நான் யூதர்களின் அரசர் என்று அவன் சொன்னான்’ என எழுதும்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
