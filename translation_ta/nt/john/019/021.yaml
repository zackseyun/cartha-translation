  rationale: The revision resolves the embedded-quotation ambiguity while retaining the source’s ongoing imperfect (‘தொடர்ந்து கூறிக்கொண்டிருந்தார்கள்’), its prohibition and requested alternative, and the neutral reporting verb ‘சொன்னான்.’ It also uses the conventional and precise term ‘தலைமை ஆசாரியர்கள்’ for ἀρχιερεῖς. No additional footnote is needed for the Greek article variation, since Tamil does not mark this distinction in the same way.
