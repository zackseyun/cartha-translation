base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: ta
  text: 'எனவே, யூதர்களின்[a] தலைமை ஆசாரியர்கள் பிலாத்துவிடம் தொடர்ந்து கூறிக்கொண்டிருந்தார்கள்: “யூதர்களின் அரசர் என்று எழுதாதீர்கள்; அதற்கு பதிலாக, ‘நான் யூதர்களின் அரசர்’ என்று அவன் சொன்னான் என்று எழுதுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின்” / “யூதேயர்களின் அரசர்.” கிரேக்கச் சொல் சூழலுக்கேற்ப பொதுவாக யூதர்களையோ, குறிப்பாக யூதேயர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலையைக் குறிக்கும் imperfect வினைவடிவம், அவர்கள் தொடர்ந்து அல்லது மீண்டும் கூறியதை உணர்த்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக உரையாடல் தொடர்வதைச் சுட்டும் இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே நேரத்தில் பல தலைமைப் பூசாரிகள் இருந்தனர் என்ற தவறான பொருளைத் தவிர்த்து, முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மையைத் தருகிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: இச்சூழலில் நிலையான அரசியல்-மதப் பட்டமான ‘யூதர்களின் அரசர்’ என்பதைக் காக்கிறது; ‘யூதேயர்களின்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Μὴ γράφε
  choice: எழுதாமல் ... என எழுதும்
  rationale: தடை மற்றும் வேண்டிய மாற்று வாசகத்தை இயல்பான தமிழ் நேரடி உரையில் ஒருங்கிணைக்கிறது.
- source_word: ἐκεῖνος εἶπεν
  choice: அவன் சொன்னான்
  rationale: ἐκεῖνος என்பதன் சுட்டுப்பெயர் வலிமையை ‘அவன்’ தக்கவைக்கிறது; ‘கூறிக்கொண்டான்’ அல்லது ‘உரிமைகோரினான்’ போன்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: நான் யூதர்களின் அரசர்
  rationale: வாக்கியப் பயனிலையில் வரும் பட்டத்தை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் இங்கு தனியான definite article இல்லாததால் தமிழில் செயற்கையான வேறுபாடு உருவாக்கப்படவில்லை.
theological_decisions:
- issue: யோவானின் பாடுபாட்டு நிகழ்வில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: சில சூழல்களில் இச்சொல் யூதேயர்களைக் குறிப்பாகக் குறிக்கலாம். ஆனால் இங்கு சிலுவை அறிவிப்பிலுள்ள நிலையான பட்டம் மற்றும் யூதத் தலைமைக் குருக்கள் குறித்த சூழல் காரணமாக ‘யூதர்களின்’ என்பது முதன்மை வாசகமாக வைக்கப்படுகிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: குற்றச்சாட்டுக்கும் இயேசுவின் சொந்தக் கூற்றுக்கும் இடையிலான வேறுபாடு
  choice: ‘யூதர்களின் அரசர்’ என்பதற்குப் பதிலாக ‘நான் யூதர்களின் அரசர் என்று அவன் சொன்னான்’
  alternative: ‘யூதர்களின் அரசன் என்று தன்னைக் கூறிக்கொண்டவன்’
  rationale: தலைமைக் குருக்கள் விரும்பிய திருத்தத்தை நேரடியாகக் காட்டுகிறது; ‘தன்னைக் கூறிக்கொண்டவன்’ என்பது கல்வெட்டு வடிவத்தை ஊகித்து விரிவுபடுத்தும் என்பதால் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க பிலாத்து முகவரிக்கு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான வேண்டுகோளை ‘சொல்லிக்கொண்டிருந்தார்கள்’ தக்கவைக்கிறது. மேற்கோளுக்குள் மேற்கோள் வருவதால், தமிழ் வாக்கிய அமைப்பு வாசிப்பிற்கு தெளிவாக மறுசீரமைக்கப்பட்டுள்ளது.
