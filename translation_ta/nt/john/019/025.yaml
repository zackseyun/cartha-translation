source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: ta
  text: இயேசுவின் சிலுவைக்கு அருகே அவருடைய தாயும், அவருடைய தாயின் சகோதரியும், குளோப்பாவின் மரியாளும்[a][b], மகதலேனா மரியாளும் நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குளோப்பாவின் மனைவி மரியாள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் குளோப்பாவுடன் அவருக்கு இருந்த உறவு வெளிப்படையாகக் கூறப்படவில்லை; அவர் குளோப்பாவின் மனைவி என்பது பொதுவான புரிதல்.
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனம் நான்கு பெண்களுக்குப் பதிலாக மூன்று பெண்களைக் குறிப்பிடுவதாகவும் வாசிக்கலாம்; அப்படியானால் ‘அவருடைய தாயின் சகோதரி’ என்பதும் ‘குளோப்பாவின் மரியாள்’ என்பதும் ஒரே பெண்ணைக் குறிக்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நிலவிய உடல்நிலையை இவ்வடிவம் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் கதை நகர்வை மெதுவாகக் குறிக்கிறது; தமிழில் பட்டியலின் இயல்பான அமைப்பே அந்த நகர்வைத் தருவதால் ‘ஆனால்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது தேவையில்லை.
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: இயேசுவின் சிலுவைக்கு அருகே
  rationale: παρά + வேற்றுமை உருபு குறிக்கும் அண்மையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இயேசுவுக்கும் சிலுவைக்கும் இடையிலான நேரடியான உடைமைத் தொடர்பையும் காக்கிறது.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: அவருடைய தாய்
  rationale: மூலத்தின் நேரடியான பெயர்ச்சொல் தொடரை இயல்பான மரியாதைநிறைந்த தமிழில் தருகிறது.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: அவருடைய தாயின் சகோதரி
  rationale: ἀδελφή என்பதில் ‘சகோதரி’ என்ற உறவைப் பேணுகிறது; மூலத்தில் இல்லாத கூடுதல் அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: குளோப்பாவுக்குரிய மரியாள்
  rationale: கிரேக்கச் சொற்றொடர் குளோப்பாவுடன் உள்ள உறவைக் குறிப்பிடுகிறது; ஆனால் அந்த உறவு மனைவி, மகள் அல்லது வேறொன்று என்று வெளிப்படையாகச் சொல்லாததால் பொதுவான ‘உரிய’ என்ற வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: மகதலா மரியாள்
  rationale: மகதலா ஊரைச் சேர்ந்த மரியாளைக் குறிக்கும், தமிழில் பரவலாக அறியப்படும் இயல்பான பெயர்வடிவம்.
theological_decisions:
- issue: சிலுவைக்கு அருகே இருந்த பெண்களின் எண்ணிக்கையும் அடையாளமும்
  choice: 'முதன்மை உரை நான்கு பெண்களைப் பட்டியலிடுவதாக அமைக்கப்பட்டுள்ளது: இயேசுவின் தாய், அவருடைய தாயின் சகோதரி, குளோப்பாவுக்குரிய மரியாள், மகதலா மரியாள்.'
  alternative: ‘அவருடைய தாயின் சகோதரி’ என்பதும் ‘குளோப்பாவுக்குரிய மரியாள்’ என்பதும் ஒரே பெண்ணைக் குறிக்கும் இணைப்பெயராக வாசித்து, மொத்தம் மூன்று பெண்கள் என்று கொள்ளலாம்.
  rationale: கிரேக்கத் தொடரின் ஒருங்கிணைக்கப்பட்ட அமைப்பு நான்கு பேரைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது; எனினும் அதன் செறிவான இலக்கண அமைப்பு மூன்று பேர் என்ற வாசிப்பையும் அனுமதிக்கிறது. ஆகவே முதன்மை உரை ஒரு வாசிப்பைப் பின்பற்றி, மாற்று வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: குளோப்பாவுக்கும் மரியாளுக்கும் உள்ள உறவு
  choice: ‘குளோப்பாவுக்குரிய மரியாள்’ என்று உறவைப் பொதுவாகவே வைத்துள்ளது.
  alternative: ‘குளோப்பாவின் மனைவி மரியாள்’ என்று மொழிபெயர்க்கலாம்.
  rationale: τοῦ Κλωπᾶ என்ற உரிமைவேற்றுமைத் தொடர் உறவைச் சுட்டுகிறது; ஆனால் ‘மனைவி’ என்பதற்கான சொல் மூலத்தில் வெளிப்படையாக இல்லை. பொதுவான மொழிபெயர்ப்பு உண்மையான தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைநிறைந்த நடையில் அமைக்கப்பட்டுள்ளது. ‘நின்றுகொண்டிருந்தார்கள்’ தொடர்நிலையை இயல்பாகத் தருகிறது. ‘குளோப்பாவுக்குரிய’ என்பது சற்றே செம்மையானதாயினும், மூலத்தில் வெளிப்படையாக இல்லாத திருமண உறவை உரைக்குள் சேர்க்காமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
