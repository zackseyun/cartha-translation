id: JHN.19.6
reference: John 19:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: ta
  text: ஆகவே, தலைமைக் குருக்களும் காவலர்களும் அவரைக் கண்டபோது, “சிலுவையில் அறையும்! சிலுவையில் அறையும்!” என்று கூச்சலிட்டார்கள். பிலாத்து அவர்களிடம், “நீங்களே[a] இவரைக் கொண்டுபோய்ச் சிலுவையில் அறையுங்கள்; ஏனென்றால் இவர்மீது எந்தக் குற்றச்சாட்டையும் நான் காணவில்லை[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் “நீங்கள்” என்பது வெளிப்படையாக இடம்பெற்று வலியுறுத்தப்படுகிறது: “நீங்களே இவரைக் கொண்டுபோய்ச் சிலுவையில் அறையுங்கள்.”'
    reason: lexical_emphasis
  - marker: b
    text: அல்லது, “இவரிடம் எந்தக் குற்றத்தையும் நான் காணவில்லை.” கிரேக்கச் சொல் ஒரு சட்டரீதியான குற்றச்சாட்டையோ குற்றம் சாட்டுவதற்கான அடிப்படையையோ குறிக்கலாம்; இங்கு நீதித்துறைப் பொருள் முதன்மையானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ஆகவே … கண்டபோது
  rationale: ὅτε என்பதன் காலப் பொருளையும் οὖν என்பதன் தொடர்ச்சி/விளைவுப் பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: எருசலேமின் முதன்மை ஆசாரியத் தலைவர்களைக் குறிக்கும் பன்மையைத் துல்லியமாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: ὑπηρέται
  choice: காவலர்கள்
  rationale: யோவான் நற்செய்தியின் சூழலில் யூத அதிகாரிகளுக்குக் கீழ்ப்பட்டுப் பணியாற்றிய காவல் பணியாளர்களைக் குறிக்கிறது; வசனம் சொல்லாத கூடுதல் நிறுவன விவரத்தைச் சேர்ப்பதில்லை.
- source_word: ἐκραύγασαν λέγοντες
  choice: என்று கூச்சலிட்டார்கள்
  rationale: உரத்த பொதுக் கூக்குரலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; λέγοντες அறிமுகப்படுத்தும் கூற்றும் ஒரே அமைப்பில் அடங்குகிறது.
- source_word: Σταύρωσον σταύρωσον
  choice: சிலுவையில் அறையும்! சிலுவையில் அறையும்!
  rationale: கிரேக்கத்தில் சூழலால் விளங்கும் செயப்படுபொருளைத் தமிழில் வெளிப்படையாகச் சேர்க்காமல் கட்டளை வடிவத்தின் தீவிரத்தையும் மறுமொழியையும் காக்கிறது.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: நீங்களே இவரைக் கொண்டுபோய்
  rationale: வெளிப்படையாக இடம்பெறும் ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்களே’ காக்கிறது; Λάβετε என்பதன் நடைமுறைப் பொருளை இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: σταυρώσατε
  choice: சிலுவையில் அறையுங்கள்
  rationale: கட்டளையின் நேரடித் தன்மையையும் சிலுவைத் தண்டனையின் துல்லியமான பொருளையும் காக்கிறது.
- source_word: αἰτίαν
  choice: குற்றச்சாட்டு
  rationale: பிலாத்துவின் நீதித்துறைச் சூழலில் சட்டரீதியான குற்றச்சாட்டு அல்லது குற்றம் சாட்டுவதற்கான அடிப்படையே முதன்மைப் பொருள்.
theological_decisions:
- issue: இயேசுவைப் பற்றிய பிலாத்துவின் தீர்ப்பு
  choice: இவர்மீது எந்தக் குற்றச்சாட்டையும் நான் காணவில்லை
  alternative: இவரிடம் எந்தக் குற்றத்தையும் நான் காணவில்லை
  rationale: இது பொதுவான ஒழுக்கக் குறையின்மையைப் பற்றிய இறையியல் அறிக்கையாக விரிவுபடுத்தாமல், உடனடியான விசாரணைச் சூழலிலுள்ள சட்டரீதியான மதிப்பீட்டை முன்னிறுத்துகிறது; அதேவேளையில் கிரேக்கச் சொல்லின் பரந்த சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களே’ என்ற வடிவம் பிலாத்து தன்னையும் எதிரே நிற்பவர்களையும் வேறுபடுத்திக் காட்டும் வலியுறுத்தலை இயல்பாகக் காக்கிறது. நேரடி உரையின் தீவிரத்திற்காக மறுமொழியும் வியப்புக்குறிகளும் பாதுகாக்கப்பட்டுள்ளன.
