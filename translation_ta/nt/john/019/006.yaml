  source_fidelity: Greek narrative sequence, the plural groups ('chief priests and officers'), the forceful repeated singular cry, Pilate's emphatic 'you' command, and the forensic sense of αἰτία are faithfully represented. ‘சிலுவையில் அறையும்’ appropriately preserves the terse, repeated cry without unnecessarily supplying an object.
