source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: ta
  text: அவர் மீண்டும் ஆளுநரின் தலைமையகத்துக்குள்[a] சென்று இயேசுவிடம், “நீர் எங்கிருந்து வந்தவர்?” என்று கேட்டார். ஆனால் இயேசு அவருக்கு பதில் எதுவும் அளிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரைத்தோரியம்’; ரோம ஆளுநரின் அதிகாரப்பூர்வ இல்லம் அல்லது தலைமையகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: உள்ளே சென்று
  rationale: εἰσέρχομαι ஓர் இடத்திற்குள் செல்வதைக் குறிக்கிறது. ‘தலைமையகத்துக்குள் சென்று’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πραιτώριον
  choice: ஆளுநரின் தலைமையகம்
  rationale: இச்சொல் ரோம ஆளுநரின் அதிகாரப்பூர்வ இல்லம் அல்லது தலைமையகத்தைக் குறிக்கிறது. அதன் செயல்பாட்டை நவீன வாசகர்கள் உடனடியாகப் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் மறுபடியும் நிகழ்வதை நேரடியாகக் குறிக்கிறது.
- source_word: λέγει
  choice: கேட்டார்
  rationale: கிரேக்கத்தில் பொதுவாக ‘சொல்கிறார்’ என்ற வரலாற்று நிகழ்காலம் இருந்தாலும், இங்கு தொடர்ந்து வரும் நேரடிக் கேள்விக்கு ஏற்ற இயல்பான தமிழ் கதைநடையில் ‘கேட்டார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Πόθεν εἶ σύ
  choice: நீர் எங்கிருந்து வந்தவர்?
  rationale: Πόθεν தோற்றம் அல்லது வந்த இடத்தை விசாரிக்கிறது. இந்தத் தமிழ் வடிவம் கேள்வியின் திறந்த தன்மையைப் பாதுகாத்து, இயல்பாக ஒலிக்கிறது.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: அவருக்கு மறுமொழி எதுவும் கொடுக்கவில்லை
  rationale: ‘அவருக்கு ஒரு பதிலைக் கொடுக்கவில்லை’ என்ற கிரேக்கச் சொல்லமைப்பைத் தெளிவான, dignified தமிழ் நடையில் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாதது
  choice: சூழலில் பிலாத்துவைக் குறிக்கும் ‘அவர்’ என்பதைக் பயன்படுத்துதல்
  alternative: முதன்மை உரையில் ‘பிலாத்து’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் எழுவாய் மறைமுகமாக உள்ளது; முந்தைய சூழல் அது பிலாத்து என்பதைத் தெளிவாக்குகிறது. ‘அவர்’ என்பது மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- issue: Πόθεν என்ற கேள்வியின் பரப்பு
  choice: ‘நீர் எங்கிருந்து வந்தவர்?’ என்று திறந்த கேள்வியாக வைத்தல்
  alternative: இயேசுவின் தெய்வீகத் தோற்றத்தை வெளிப்படையாகக் குறிக்கும் விளக்க மொழியைச் சேர்த்தல்
  rationale: கேள்வி புவியியல் பிறப்பிடம் அல்லது ஆழமான தோற்றம் ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை வசனம் தானாகத் தீர்மானிக்கவில்லை; எனவே அந்தப் பொருள் நெருக்கடியை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் ‘நீர்’ எனும் கண்ணியமான ஒருமை வடிவம் இடம்பெறுகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘ஆளுநரின் தலைமையகம்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
