source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: ta
  text: 'யூதர்கள் அவருக்குப் பதிலளித்தார்கள்: “ஒரு நல்ல செயலுக்காக நாங்கள் உம்மைக் கல்லெறிவதில்லை; தேவதூஷணத்திற்காகத்தான் கல்லெறிகிறோம். ஏனெனில், நீர் மனிதராக இருந்தும் உம்மையே கடவுளாக்கிக்கொள்கிறீர்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மையே ஒரு கடவுளாக்கிக்கொள்கிறீர்.” கிரேக்கத்தில் θεόν என்பதற்கு முன் திட்டவட்டக் குறிப்பைக் காட்டும் உறுப்புச்சொல் இல்லை. எனினும், இங்கு தேவதூஷணக் குற்றச்சாட்டு முன்வைக்கப்படுவதால் “கடவுள்” என்பதே பெரும்பாலும் கருதப்படும் பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது. இச்சூழலில் இயேசுவை எதிர்கொள்ளும் குழுவை இது குறித்தாலும், ‘யூதத் தலைவர்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாகக் கூறப்படாத ஒரு குறுகிய அடையாளத்தை நிர்ணயித்துவிடும்.
- source_word: Περὶ καλοῦ ἔργου
  choice: ஒரு நல்ல செயலுக்காக
  rationale: περί உடன் வரும் இக்கட்டமைப்பு காரணத்தையோ விவாதப் பொருளையோ குறிக்கிறது; ἔργου என்பதன் ஒருமையையும் καλοῦ என்பதன் நன்மைசார் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: λιθάζομέν
  choice: கல்லெறிகிறோம்
  rationale: நிகழ்கால வினையின் உடனடி செயல் அல்லது உறுதியான நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வாக்கியத்தின் இரண்டாம் பகுதியில் வினையை மீண்டும் சேர்ப்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: βλασφημίας
  choice: தேவதூஷணம்
  rationale: கடவுளை அவமதிக்கும் பேச்சு அல்லது உரிமைகோரலைக் குறிக்கும் வழக்கமான, சுருக்கமான தமிழ் இறையியல் சொல்.
- source_word: ἄνθρωπος ὢν
  choice: மனிதராக இருந்தும்
  rationale: பங்கேற்புவினையின் விட்டுக்கொடுப்பு சார்ந்த வலிமையை வெளிப்படுத்தி, குற்றஞ்சாட்டுவோரின் பார்வையில் இயேசு மனிதராக இருந்தும் இவ்வாறு செய்கிறார் என்ற முரண்பாட்டைக் காக்கிறது.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: நீர் உம்மையே கடவுளாக்கிக்கொள்கிறீர்
  rationale: ποιέω உடன் தன்மறுமைப் பெயரும் பயனிலை வேற்றுமையும் சேர்ந்த கட்டமைப்பின் ‘தன்னையே X ஆக்கிக்கொள்/காட்டிக்கொள்’ என்ற பொருளை வழங்குகிறது. வலியுறுத்தப்பட்ட σὺ என்பதை ‘நீர்’ என்றும் σεαυτόν என்பதை ‘உம்மையே’ என்றும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ποιεῖς σεαυτὸν θεόν என்பதில் θεόν-ஐ மொழிபெயர்த்தல்
  choice: கடவுள்
  alternative: ஒரு கடவுள்
  rationale: θεόν என்பதற்கு கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததால் தனித்து நோக்கும்போது இரு வாசிப்புகளும் இலக்கண ரீதியாகச் சாத்தியம். ஆயினும் தேவதூஷணக் குற்றச்சாட்டும் யோவான் நற்செய்தியின் ஒரே கடவுள் சார்ந்த சூழலும், இஸ்ரவேலின் கடவுளுக்குரிய நிலையை இயேசு தமக்கெனக் கோருவதாக குற்றஞ்சாட்டுவோர் புரிந்துகொண்டதைக் காட்டுகின்றன. ஆகவே முதன்மை உரையில் ‘கடவுள்’ வைக்கப்பட்டு, உண்மையான இலக்கண மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் ‘நீர்/உம்மை’ என்ற மரியாதை ஒருமை உள்ளது; குற்றஞ்சாட்டுவோரின் கடுமையான தொனி மங்காமல் காக்கப்பட்டுள்ளது.
