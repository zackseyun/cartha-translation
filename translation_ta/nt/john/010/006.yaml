source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: ta
  text: இயேசு இந்த உருவகமான சொல்லை அவர்களிடம் கூறினார்[a]. ஆனால், அவர் அவர்களிடம் கூறியவை என்ன என்பதை அவர்கள் புரிந்துகொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உவமை,’ ‘விளக்க உருவகம்,’ அல்லது ‘பழமொழி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் உருவகப் பொருளுடைய கூற்றைப் பொதுவாகக் குறிக்கலாம்; இங்கு இயேசு மேய்ப்பனைப் பற்றிக் கூறியவை நேர்ப்பொருளில் அல்ல என்பதை இது சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: உருவகப் பேச்சை
  rationale: இச்சொல் பழமொழி, உவமை அல்லது மறைபொருளுள்ள உருவகக் கூற்று எனப் பரந்த பொருள் தரலாம். இங்கு முன் கூறப்பட்ட மேய்ப்பன் தொடர்பான சொல்லாடல் நேர்ப்பொருளில் அல்லாமல் உருவகமாக இருப்பதை ‘உருவகப் பேச்சு’ இயல்பாகக் காட்டுகிறது; அதைத் தொழில்நுட்பமான ‘உவமை’ என்ற ஒரே வகைக்குள் கட்டுப்படுத்தவில்லை.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: λέγω என்பதன் பொதுவான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘உருவகப் பேச்சை ... சொன்னார்’ என்பது தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: ἐκεῖνοι δὲ
  choice: ஆனால் ... அவர்கள்
  rationale: ἐκεῖνοι இயேசுவுக்கும் கேட்பவர்களுக்கும் இடையிலான வேறுபாட்டைச் சுட்டுகிறது; δέ இங்கு எதிர்மறைத் தொடர்பைக் காட்டுவதால் ‘ஆனால்’ பொருத்தமானது.
- source_word: οὐκ ἔγνωσαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: சொல்லப்பட்டதன் பொருளைக் கேட்பவர்கள் உணரத் தவறியதே சூழலின் கருத்து; ஆகவே ‘அறியவில்லை’ என்பதைவிட ‘புரிந்துகொள்ளவில்லை’ துல்லியமானது.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: அவர் தங்களிடம் சொன்னவற்றின் பொருள் என்ன என்பதை
  rationale: 'கிரேக்கத் தொடர் சொற்படியாகச் சற்றே கடினமானது: அவர் அவர்களிடம் பேசிக்கொண்டிருந்தவை என்ன என்பதே அதன் அமைப்பு. தமிழில் புரிதல் குறித்த சூழலைத் தெளிவாக்கி, ‘சொன்னவற்றின் பொருள் என்ன’ என்று இயல்பாக வழங்கப்படுகிறது.'
- source_word: αὐτοῖς
  choice: அவர்களிடம் / தங்களிடம்
  rationale: பேச்சைப் பெற்றவர்களைக் குறிக்கும் மறைமுகச் செயப்படுபொருளாக உள்ளது. முதல் இடத்தில் ‘அவர்களிடம்’ என்றும், அவர்களின் பார்வையை இயல்பாகக் காட்ட அடுத்த இடத்தில் ‘தங்களிடம்’ என்றும் வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உருவகப் பேச்சு’ என்பது மூலச்சொல்லின் பரந்த பொருளையும் இப்பகுதியின் மறைபொருள் தன்மையையும் காக்கிறது.
