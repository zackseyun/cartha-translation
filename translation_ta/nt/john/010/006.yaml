revisions:
- from: இயேசு இந்த உருவகப் பேச்சை அவர்களிடம் சொன்னார்[a]. ஆனால் அவர் தங்களிடம் சொன்னவற்றின் பொருள் என்ன என்பதை அவர்கள் புரிந்துகொள்ளவில்லை.
  to: இயேசு இந்த உருவகமான சொல்லை அவர்களிடம் கூறினார்[a]. ஆனால், அவர் அவர்களிடம் கூறியவை என்ன என்பதை அவர்கள் புரிந்துகொள்ளவில்லை.
  rationale: The revision consistently renders both instances of αὐτοῖς as ‘அவர்களிடம்,’ avoiding a misleading reflexive nuance. It uses ‘உருவகமான சொல்’ for the singular figurative saying while preserving the draft’s meaning, register, and lexical footnote alternatives.
  reviewer_model: gpt-5.6-terra
