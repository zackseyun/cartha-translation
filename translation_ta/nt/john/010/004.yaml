  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: ta
  text: அவன் தனக்குரியவை அனைத்தையும் வெளியே கொண்டுவந்ததும்[a], அவற்றுக்கு முன்னால் செல்கிறான்; ஆடுகள் அவனுடைய குரலை அறிந்திருப்பதால் அவனைப் பின்தொடர்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியே துரத்திய பின்பு’ அல்லது ‘வெளியே நடத்திவந்த பின்பு’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினை, ஓர் அடைப்பிலிருந்து துரத்தி வெளியேற்றுதல் அல்லது வெளியே கொண்டுவருதல் என்ற பொருளைக் கொள்ளக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: … பின்பு
  rationale: இறந்தகால வினையெச்சத்துடன் இணைந்து, காலத்தைச் சுட்டும் பொதுநிலை உட்பிரிவை இயல்பான தமிழில் தெரிவிக்கிறது; இங்கு ‘எப்போதெல்லாம்’ என்று கூறி மீள்நிகழ்வை மிகைப்படுத்தவில்லை.
- source_word: τὰ ἴδια πάντα
  choice: தனக்குரிய அனைத்தையும்
  rationale: சூழலில் இது மேய்ப்பனுக்குரிய ஆடுகளைக் குறித்தாலும், கிரேக்கத்தின் நடுநிலைப் பன்மைச் சொல்லமைப்பைப் பாதுகாக்கிறது; பின்னரே வெளிப்படையாக வரும் ‘ஆடுகள்’ என்பதை முன்கூட்டியே சேர்க்கவில்லை.
- source_word: ἐκβάλῃ
  choice: வெளியே கொண்டுவந்த
  rationale: அடைப்பிலிருந்து வெளிப்புறம் கொண்டுவரும் இயக்கத்தைத் தெளிவாகச் சொல்கிறது. கிரேக்க வினை ‘துரத்தி வெளியேற்றுதல்’ என்ற வலுவான பொருளையும் கொள்ளக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: அவற்றுக்கு முன்னால் செல்கிறான்
  rationale: மேய்ப்பன் முன்னே சென்று வழிநடத்தும் இடம்சார் காட்சியை இயல்பான தமிழில் காக்கிறது; முன்வந்த நடுநிலைப் பன்மையோடு ‘அவற்றுக்கு’ ஒத்திசைகிறது.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: அந்த ஆடுகள் … அவனைப் பின்தொடர்கின்றன
  rationale: πρόβατα என்பதற்கு வழக்கமான ‘ஆடுகள்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் நடுநிலைப் பன்மை எழுவாயுடன் ஒருமை வினை வருவது இயல்பு; தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்படுகிறது.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: அவனுடைய குரலை அறிந்திருப்பதால்
  rationale: ὅτι தரும் காரண உறவை ‘-தால்’ தெளிவாக வெளிப்படுத்துகிறது. οἶδα என்பதன் ‘அறிதல்’ பொருளைக் காத்து, சூழலில் உள்ள குரலை அடையாளம் காணும் நுணுக்கத்தையும் அனுமதிக்கிறது.
theological_decisions:
- issue: மேய்ப்பன் உருவகத்தில் ἐκβάλῃ என்பதன் வலிமை
  choice: வெளியே கொண்டுவந்த
  alternative: துரத்தி வெளியேற்றிய / வெளியே நடத்திக்கொண்டு வந்த
  rationale: உடனடிச் சூழல் மேய்ப்பன் தன் ஆடுகளைத் தொழுவத்திலிருந்து வெளியே கொண்டுவருவதைச் சித்தரிக்கிறது; பகைமையான வெளியேற்றத்தையோ வற்புறுத்தலைப் பற்றிய இறையியல் கருத்தையோ மொழிபெயர்ப்பு தானாகச் சேர்க்கக்கூடாது. அதேவேளை, வினையின் வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தனக்குரிய அனைத்தையும்’ என்பது மூலத்தின் திட்டமிட்ட பொதுமையைப் பாதுகாக்கிறது; தெளிவுக்காக இரண்டாம் வாக்கியத்தில் ‘அந்த ஆடுகள்’ பயன்படுத்தப்பட்டுள்ளது.
