  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ta
  text: ஏனெனில், அவன் கூலிக்காரன்; ஆடுகள்மேல் அவனுக்கு அக்கறை இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றில் கூலிக்காரன் ஓடிப்போவதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: μισθωτός
  choice: கூலிக்காரன்
  rationale: சொந்தக்காரனாக அல்லாமல் கூலிக்காக வேலை செய்பவனைக் குறிக்கிறது. மேய்ப்புத் தொழில் சூழலில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: அவனுக்கு அக்கறை இல்லை
  rationale: μέλει என்பதன் அக்கறை அல்லது கவலை கொள்ளுதல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, கூற்றின் அறநெறி சார்ந்த வலிமையையும் காக்கிறது.
- source_word: τῶν προβάτων
  choice: ஆடுகள்மேல்
  rationale: πρόβατα என்பதன் நேரடியான மேய்ப்புச் சித்திரத்தைப் பேணுகிறது; ‘மந்தை’ என்று பொதுமைப்படுத்தவில்லை.
theological_decisions:
- issue: நல்ல மேய்ப்பனுக்கு எதிர்மாறாக μισθωτός பற்றிய வருணனை
  choice: கூலிக்காரனுக்கு ஆடுகள்மேல் அக்கறை இல்லை என்ற வசனத்தின் நேரடியான அறநெறிக் கூற்றை மட்டும் மொழிபெயர்த்தல்
  alternative: கூலிக்காரனை ஒரு குறிப்பிட்ட வகை பொய்த் தலைவர்களோடு அடையாளப்படுத்துதல், அல்லது இதை வெறும் தொழில்சார் பற்றின்மையாக மென்மைப்படுத்துதல்
  rationale: வசனம் அவன் கூலிக்காரன் என்பதையும் ஆடுகள்மேல் அக்கறையில்லாதவன் என்பதையும் நேரடியாகக் கூறுகிறது. உரை வெளிப்படையாகச் சொல்லாத குறிப்பிட்ட அடையாளத்தையோ விரிவான கோட்பாட்டு முடிவையோ மொழிபெயர்ப்பில் சேர்க்காமல், நல்ல மேய்ப்பனுடனான வேறுபாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான நடை. ‘ஆடுகள்மேல்’ என்பது இயல்பான அக்கறைத் தொடர்பைக் காட்டுகிறது; இறையியல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கமும் வலிமையும் பேணப்பட்டுள்ளன.
