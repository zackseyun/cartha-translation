source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “நான் உங்களுக்குச் சொன்னேன்; நீங்கள் நம்பவில்லை. என் தந்தையின் பெயரில்[a] நான் செய்கிற செயல்களே என்னைக் குறித்துச் சாட்சி கூறுகின்றன[b]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் தந்தையின் அதிகாரத்தால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இவை என்னைப்பற்றிச் சான்றளிக்கின்றன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: உரையாடல் சூழலில் இயல்பான நவீனத் தமிழ்; இயேசுவைக் குறிக்கும் மரியாதை வினைமுற்றும் பேணப்படுகிறது.
- source_word: Εἶπον ὑμῖν
  choice: நான் உங்களுக்குச் சொன்னேன்
  rationale: முன்பு அவர்களிடம் கூறியதைச் சுட்டும் இறந்தகால வலிமையை நேரடியாகப் பேணுகிறது.
- source_word: οὐ πιστεύετε
  choice: நீங்கள் நம்பவில்லை
  rationale: யோவான் நற்செய்தியில் πιστεύω என்பதன் தொடர்ச்சியான இறையியல் சொல்லாட்சியைப் பேணும் இயல்பான தமிழ்.
- source_word: ἔργα
  choice: செயல்கள்
  rationale: இயேசுவின் செயல்கள் அல்லது அடையாளங்களை உள்ளடக்கக்கூடிய பரந்த பொருளைத் தருகிறது; ‘கிரியைகள்’ என்பதைவிட இன்றைய பொதுவாசகருக்கு இயல்பானது.
- source_word: ἐν τῷ ὀνόματι
  choice: பெயரில்
  rationale: பிரதிநிதித்துவம், அங்கீகாரம், அதிகாரம் ஆகிய பொருள் வாய்ப்புகளைத் திறந்தவாறே கிரேக்கச் சொற்றொடரைப் பேணுகிறது.
- source_word: πατρός μου
  choice: என் தந்தை
  rationale: இங்கு கடவுளுடனான இயேசுவின் உறவைக் குறிக்கும் தலைப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: செயல்களே என்னைக் குறித்துச் சாட்சி கூறுகின்றன
  rationale: ταῦτα என்பதன் வலியுறுத்தலை ‘செயல்களே’ என்பதால் வெளிப்படுத்தி, யோவானில் முக்கியமான சாட்சி சொல்லாட்சியையும் பேணுகிறது.
theological_decisions:
- issue: இயேசுவின் செயல்களுக்கும் தந்தையின் அதிகாரத்திற்கும் இடையிலான உறவு
  choice: என் தந்தையின் பெயரில்
  alternative: என் தந்தையின் அதிகாரத்தால்
  rationale: மூலத்தின் சொற்றொடர் வெளிப்படுத்தும் பிரதிநிதித்துவம் மற்றும் அதிகாரம் ஆகிய இரண்டையும் ஒரு பொருளாக மட்டும் சுருக்காமல், அதன் இறையியல் விரிவையும் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. ‘செயல்கள்’, ‘சாட்சி கூறுகின்றன’ ஆகியவை யோவானின் முக்கிய சொல்லாட்சியை இயல்பான தமிழில் பேணுகின்றன.
