  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: ta
  text: ஆனால் கதவு வழியாக நுழைகிறவர் ஆடுகளின் மேய்ப்பர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆடுகளின் ஒரு மேய்ப்பர்.” கிரேக்கத்தில் ποιμήν (“மேய்ப்பர்”) என்ற பயனிலைப் பெயர்ச்சொல்லுக்கு முன்னர் நிர்ணய உருபு இல்லை; எனினும், சட்டவிரோதமாக நுழைவோருக்கு மாறாக உரிமையுள்ள மேய்ப்பரைக் குறிப்பிடுவதாகச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: ஆனால் ... நுழைகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, வழக்கமாக இவ்வாறு நுழையும் நபரைக் குறிக்கிறது. முந்தைய வசனத்திலுள்ள திருடன் மற்றும் கொள்ளைக்காரனுக்கு எதிரான வேறுபாட்டை δέ காட்டுவதால், அது ‘ஆனால்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: διὰ τῆς θύρας
  choice: கதவு வழியாக
  rationale: διά என்பதுடன் ஆறாம் வேற்றுமை வருவது, ஒன்றின் ஊடாகச் செல்லும் இயக்கத்தை இங்கு குறிக்கிறது. இயல்பான நவீனத் தமிழில் இதை ‘கதவு வழியாக’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ποιμήν
  choice: மேய்ப்பர்
  rationale: ποιμήν என்பது ஆடுகளை மேய்த்துப் பராமரிப்பவரைக் குறிக்கிறது. மரியாதையும் இயல்பும் கொண்ட ‘மேய்ப்பர்’ என்ற சொல் உருவகத்தைத் தக்கவைக்கிறது. கிரேக்கத்தில் இச்சொல்லுக்கு சுட்டுச்சொல் இல்லாததால், அதன் உறுதிப்பாடு குறித்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τῶν προβάτων
  choice: ஆடுகளின்
  rationale: πρόβατα என்பதன் நேரடியான பொருள் ‘ஆடுகள்’; ‘மந்தை’ என்று விளக்கமாக மாற்றாமல் மூல உருவகம் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ποιμήν என்ற பயனிலைப் பெயர்ச்சொல்லின் உறுதிப்பாடு
  choice: ஆடுகளின் மேய்ப்பர்
  alternative: ஆடுகளுக்கு ஒரு மேய்ப்பர்
  rationale: கதவு வழியாக நுழைகிறவரை, முந்தைய வசனத்தின் சட்டவிரோதமாக நுழைவோருக்கு மாறான உரிமையான மேய்ப்பராகச் சூழல் அடையாளப்படுத்துகிறது. அதேவேளை, கிரேக்க பயனிலைப் பெயர்ச்சொல்லில் சுட்டுச்சொல் இல்லாததால், ‘ஒரு மேய்ப்பர்’ என்ற இலக்கண ரீதியான மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; பின்னைய கிறிஸ்தியல் விளக்கத்தை வசனத்திற்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கதவு வழியாக’ என்பது இடவியல் இயக்கத்தை இயல்பாகத் தெரிவிக்கிறது; ‘மேய்ப்பர்’ என்பது வேதாகம உருவகத்தையும் பொதுவான புரிதலையும் தக்கவைக்கிறது.
