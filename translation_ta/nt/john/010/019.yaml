  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: ta
  text: இந்த வார்த்தைகளால் யூதர்களிடையே[a] மீண்டும் ஒரு பிளவு ஏற்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதேயர்களிடையே’ என்றும், யோவான் நற்செய்தியின் சில சூழல்களில் ‘யூதத் தலைவர்களிடையே’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘யூதர்கள்’ என்பது கிரேக்கச் சொல்லின் நேரடியான மொழிபெயர்ப்பு. ஆனால் யோவான் நற்செய்தியில் அது பெரும்பாலும் யூத மக்கள் அனைவரையும் அல்ல, சூழலில் உள்ள ஒரு குறிப்பிட்ட குழுவையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: பிளவு
  rationale: இச்சொல் அடிப்படையில் கிழிவு அல்லது பிரிவைக் குறிக்கிறது; இங்கு இயேசுவின் வார்த்தைகளுக்கு மக்கள் காட்டிய மாறுபட்ட எதிர்வினையால் உண்டான கருத்துப் பிரிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: இத்தகைய பிளவு இதற்கு முன்பும் ஏற்பட்டிருந்ததைச் சுட்டும் மறுநிகழ்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγένετο
  choice: ஏற்பட்டது
  rationale: ஒரு நிலை அல்லது நிகழ்வு உருவானது என்ற நிகழ்வுச் சார்ந்த பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: யூதர்களிடையே
  rationale: கிரேக்கச் சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைக்கிறது. யோவான் நற்செய்தியில் இச்சொல் சூழலுக்கேற்ப யூதேயர்களையோ யூதத் தலைவர்களையோ குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் நுணுக்கம் விளக்கப்படுகிறது.
- source_word: διὰ
  choice: காரணமாக
  rationale: குற்றுப்பொருள் வேற்றுமையுடன் வரும் διά இங்கு காரணத்தைக் குறிக்கிறது; ‘காரணமாக’ என்பது அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகள்
  rationale: இயேசு முன்பு பேசியவற்றைக் குறிக்கிறது; ‘வார்த்தைகள்’ என்பது நேரடியான, புரிந்துகொள்ள எளிய தமிழாக்கம்.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று மொழிபெயர்த்து, அதன் சூழல் சார்ந்த பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘யூதேயர்கள்’ அல்லது ‘யூதத் தலைவர்கள்’
  rationale: நேரடியான கிரேக்கச் சொல்லை உரையில் பாதுகாக்கிறது; அதேவேளையில் இதை எல்லா யூத மக்களையும் பொதுப்படுத்தும் சொல்லாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க, யோவானின் சூழல் சார்ந்த பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சுருக்கமான மற்றும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘யூதர்களிடையே’ என்ற நேரடி மொழிபெயர்ப்பு தக்கவைக்கப்பட்டு, தேவையற்ற இனப் பொதுமைப்படுத்தலைத் தவிர்க்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
