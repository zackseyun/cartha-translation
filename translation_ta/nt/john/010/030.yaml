  edition: SBLGNT
  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: ta
  text: நானும் பிதாவும் ஒன்றாயிருக்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒன்று’ என்பதற்கான கிரேக்கச் சொல் நடுநிலை வடிவில் உள்ளது; ஆகவே அது இயேசுவையும் பிதாவையும் ஒரே நபராக அடையாளப்படுத்தாமல் அவர்களுடைய ஒன்றிப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: நான்
  rationale: முதல் நபர் ஒருமைச் சுட்டுப்பெயர் கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தலுடனும் உள்ளது; தமிழிலும் தனியே வைக்கப்பட்டுள்ளது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: இரு எழுவாய்களையும் இயல்பான தமிழில் இணைக்கும் இணைப்புமுறை; கூடுதல் பொருள் எதையும் சேர்க்கவில்லை.
- source_word: ὁ πατὴρ
  choice: பிதா
  rationale: யோவான் நூலின் சூழலில் இயேசுவின் தந்தையைக் குறிக்கும் சிறப்புப் பெயர்போன்ற பயன்பாடு; ‘பிதா’ என்பது மரியாதையும் வேதாகமப் பரிச்சயமும் கொண்ட தெளிவான தமிழ் வடிவம்.
- source_word: ἕν
  choice: ஒன்றாய்
  rationale: கிரேக்கத்தில் இது நடுநிலை ஒருமை வடிவம். ‘ஒரே நபர்’ என்று சொல்லாமல் உண்மையான ஒன்றிப்பைத் தெரிவிக்க ‘ஒன்றாய்’ இயல்பாக உள்ளது.
- source_word: ἐσμεν
  choice: இருக்கிறோம்
  rationale: முதல் நபர் பன்மை நிகழ்கால வினை; ‘நான்’ மற்றும் ‘பிதா’ ஆகியோரின் வேறுபாட்டைத் தக்கவைத்தபடி ஒன்றிப்பை உரைக்கிறது.
theological_decisions:
- issue: நடுநிலை ἕν என்பதும் பன்மை ἐσμεν என்பதும் இணைந்து தரும் கிறிஸ்துவியல் பொருள்
  choice: இயேசுவுக்கும் பிதாவுக்கும் இடையிலான உண்மையான ஒன்றிப்பையும், அதே நேரத்தில் அவர்களின் தனித்தன்மையையும் தக்கவைக்கும் வகையில் ‘நானும் பிதாவும் ஒன்றாயிருக்கிறோம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நானும் பிதாவும் ஒரே நபர்’ அல்லது ‘நானும் பிதாவும் ஒருமனப்பட்டிருக்கிறோம்’
  rationale: ‘ஒரே நபர்’ என்பது நடுநிலை வடிவத்தையும் பன்மை வினையையும் மீறி நபர் வேறுபாட்டை அழித்துவிடும். ‘ஒருமனப்பட்டிருக்கிறோம்’ என்பது வசனத்தின் வலிமையை வெறும் கருத்தொற்றுமையாகக் குறைத்துவிடலாம். தேர்ந்த வடிவம் மூலத்தின் இறையியல் இறுக்கத்தை விளக்கித் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதும் வழிபாட்டு வாசிப்புக்கு ஏற்றதுமான நடை. ‘பிதா’ என்பது இச்சூழலில் நிலைபெற்ற இறையியல் அழைப்பாகத் தக்கவைக்கப்பட்டது; ‘ஒன்றாயிருக்கிறோம்’ என்பது மூலத்தின் ஒன்றிப்பு–வேறுபாடு இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
