  terminology: “நல்ல மேய்ப்பர்” is the suitable established metaphorical expression and avoids importing an ecclesial office. “எனக்குரியவர்கள்” retains relational belonging without unnecessary doctrinal expansion. The footnote accurately supplies “என் ஆடுகள்” as a contextual alternative and explains the Greek’s literal wording.
