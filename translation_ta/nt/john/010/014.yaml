id: JHN.10.14
reference: John 10:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: ta
  text: நானே நல்ல மேய்ப்பர்; எனக்குரியவர்களை[a] நான் அறிந்திருக்கிறேன்; எனக்குரியவர்களும் என்னை அறிந்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் ஆடுகளை நான் அறிந்திருக்கிறேன்; என் ஆடுகளும் என்னை அறிந்திருக்கின்றன’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இரண்டு இடங்களிலும் சொல்லுக்குச் சொல் ‘எனக்குரியவை’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: நானே
  rationale: வலியுறுத்தப்பட்ட ἐγώ என்பதையும் நிகழ்காலத் தன்னடையாளக் கூற்றையும் இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது. பெயர்ப் பயனிலை வாக்கியத்தில் ‘இருக்கிறேன்’ என்பதைச் சேர்க்காமல் இருப்பது நவீன தமிழுக்கு இயல்பானது.
- source_word: ποιμὴν ὁ καλός
  choice: நல்ல மேய்ப்பர்
  rationale: ποιμήν என்பதன் உடனடியான ஆடு மேய்க்கும் உருவகத்தை ‘மேய்ப்பர்’ காக்கிறது; ‘போதகர்’ என்பது பிற்காலத் திருச்சபைப் பதவிப் பொருளைத் தேவையின்றி கொண்டுவரும். καλός என்பதிலுள்ள நன்மை, தகுதி, மேன்மை ஆகிய நிழற்பொருள்களை இச்சூழலில் இயல்பாக ‘நல்ல’ வெளிப்படுத்துகிறது.
- source_word: γινώσκω / γινώσκουσί
  choice: அறிந்திருக்கிறேன் / அறிந்திருக்கிறார்கள்
  rationale: இவை வெறும் தகவலறிவை மட்டுமல்லாமல் தனிப்பட்ட, உறவுசார் அறிதலையும் குறிக்கின்றன. தமிழில் நிலைத்த உறவை இயல்பாக உணர்த்த நிறைவுநிலை வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: எனக்குரியவர்கள்
  rationale: கிரேக்கத்தின் நடுநிலைப் பன்மை உடைமைச் சொல் சூழலில் இயேசுவுக்குரிய மக்களைக் குறிக்கிறது. ‘எனக்குரியவர்கள்’ என்பது சொந்தத்தையும் உறவையும் காத்து, இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘ஆடுகள்’ என்பதை மூலவாக்கியத்துக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: καί
  choice: ; / -உம்
  rationale: முதல் καί இணைப்பைத் தமிழில் இயல்பான அரைப்புள்ளிக் கட்டமைப்பு காட்டுகிறது; இரண்டாவது இணைப்பின் பரஸ்பரத் தன்மையை ‘எனக்குரியவர்களும்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவுக்கும் அவருக்குரியவர்களுக்கும் இடையிலான பரஸ்பர அறிதலைப் பிற்காலக் கோட்பாட்டு விரிவாக்கமின்றி மொழிபெயர்த்தல்
  choice: எனக்குரியவர்கள்
  alternative: என் ஆடுகள்
  rationale: இந்தத் தேர்வு மூலத்தின் சுருக்கமான உடைமை வெளிப்பாட்டையும் உறவுசார் பொருளையும் காக்கிறது. சுற்றியுள்ள மேய்ப்பர் உருவகத்தின்படி ‘என் ஆடுகள்’ என்பது பொருத்தமான விளக்க மொழிபெயர்ப்பு என்றாலும், இவ்வசனத்தின் கிரேக்கத்தில் ‘ஆடுகள்’ மீண்டும் வெளிப்படையாகக் கூறப்படவில்லை.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மேய்ப்பர்’ உருவகத்தைத் தக்கவைக்கிறது; ‘எனக்குரியவர்கள்’ சாதாரண வாசகருக்குப் புரியும் வகையில் கிரேக்கத்தின் சுருக்கத்தையும் உறவுசார் உடைமையையும் சமநிலைப்படுத்துகிறது.
