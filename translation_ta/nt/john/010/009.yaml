  revised_text: “நானே வாசல்.[a] என் வழியாக யாராவது நுழைந்தால், அவர் இரட்சிக்கப்படுவார்; அவர் உள்ளே செல்வார், வெளியே செல்வார், மேய்ச்சலைக் கண்டடைவார்.”
