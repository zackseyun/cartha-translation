source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: ta
  text: “நானே வாசல்.[a] என் வழியாக யாராவது நுழைந்தால், அவர் இரட்சிக்கப்படுவார்; அவர் உள்ளே செல்வார், வெளியே செல்வார், மேய்ச்சலைக் கண்டடைவார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கதவு.” கிரேக்கச் சொல் கதவையோ நுழைவாயிலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: வாசல்
  rationale: θύρα என்பது கதவு அல்லது நுழைவாயிலைக் குறிக்கலாம். ஆட்டுமந்தை உருவகச் சூழலில் “வாசல்” இயல்பாகவும், இயேசுவே நுழைவதற்கான வழி என்ற உருவகத்தைத் தெளிவாகவும் தெரிவிக்கிறது. “கதவு” என்ற நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δι’ ἐμοῦ
  choice: என் வழியாக
  rationale: διά + மரபுவேற்றுமை இங்கு வழிமுறை அல்லது இடைமுகத்தைக் குறிக்கிறது. “என் வழியாக” என்பது இயேசுவே நுழைவதற்கான வழி என்பதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐάν τις εἰσέλθῃ
  choice: யாராவது நுழைந்தால்
  rationale: ἐάν + இறந்தகாலச் சார்புநிலை வினை பொதுவான நிபந்தனையைத் தருகிறது; τις என்பதன் வரையறுக்கப்படாத, அனைவருக்கும் திறந்த தன்மையை “யாராவது” காக்கிறது.
- source_word: σωθήσεται
  choice: மீட்கப்படுவார்
  rationale: σῴζω என்பது காப்பாற்றுதல், விடுவித்தல், மீட்பளித்தல் ஆகிய பரப்பைக் கொண்டது. “மீட்கப்படுவார்” என்பது உடல் பாதுகாப்பாக மட்டும் பொருளைக் குறுக்காமலும், வசனம் கூறுவதைவிட விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் யோவானின் இரட்சிப்பு சார்ந்த ஆழத்தைத் தக்கவைக்கிறது.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: உள்ளே செல்வார், வெளியே செல்வார்
  rationale: கிரேக்கத்தில் உள்ள இணையான இரு இயக்கங்களையும் இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது; பாதுகாப்பு அல்லது சுதந்திரம் பற்றிய விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: νομὴν
  choice: மேய்ச்சல்
  rationale: νομή என்பது மேயும் இடம் அல்லது மேய்ச்சலைக் குறிக்கிறது. சுற்றியுள்ள ஆடு-மேய்ப்பர் உருவகத்தில் “மேய்ச்சல்” சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: εὑρήσει
  choice: கண்டடைவார்
  rationale: εὑρίσκω என்பதன் எளிய பொருளான “கண்டடைதல்” என்பதைக் காக்கிறது; பெறுதல் போன்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: மேய்ப்புச் சூழலில் θύρα உருவகத்தின் மொழிபெயர்ப்பு
  choice: வாசல்
  alternative: கதவு
  rationale: இது இயேசுவின் “நானே” உருவகங்களில் ஒன்று. “வாசல்” நுழைவாயில் என்ற கருத்தையும் ஆட்டுமந்தைச் சூழலையும் இயல்பாகக் காக்கிறது; அதேவேளை θύρα என்பதற்கான “கதவு” என்ற நேரடி மாற்று உண்மையான சொற்பொருள் சாத்தியமாக இருப்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: σωθήσεται என்பதன் பொருள் பரப்பு
  choice: மீட்கப்படுவார்
  alternative: காப்பாற்றப்படுவார்; இரட்சிக்கப்படுவார்
  rationale: இந்தச் சொல்லை வெறும் உடல் ஆபத்திலிருந்து காப்பாற்றுதல் என்று குறுக்கவும் கூடாது; குறிப்பிட்ட ஒரு முறைப்படுத்தப்பட்ட இரட்சிப்புக் கோட்பாட்டை வசனத்துக்குள் விரித்துச் சேர்க்கவும் கூடாது. “மீட்கப்படுவார்” மேய்ப்புச் சூழலின் பாதுகாப்பையும் யோவான் நற்செய்தியின் ஆன்மிக மீட்பு ஆழத்தையும் திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைய “நானே,” “என் வழியாக,” “யாராவது” போன்ற தெளிவான வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ஒருமைப்பட்ட τις-ஐத் தொடர்ந்து “அவர்” பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் தொடர்ச்சியான எதிர்கால வினைகளும் மேய்ப்புச் சார்ந்த உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
