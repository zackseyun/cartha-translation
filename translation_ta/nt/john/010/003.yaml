reference: John 10:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: ta
  text: அவனுக்கு வாயிற்காவலன் கதவைத் திறக்கிறான்; செம்மறியாடுகள் அவனுடைய குரலைக் கேட்கின்றன. அவன் தனக்குச் சொந்தமான செம்மறியாடுகள் ஒவ்வொன்றையும் பெயர் சொல்லி அழைத்து, அவற்றை வெளியே நடத்திச் செல்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை வெளியே கொண்டுவருகிறான்.”
    reason: ἐξάγει என்பதற்கான பொருத்தமான மாற்று மொழிபெயர்ப்பு. குறியீடு அது சார்ந்த இறுதி வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: τούτῳ
  choice: அவனுக்கு
  rationale: முந்தைய வசனத்தில் வரும் மேய்ப்பனைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் நான்காம் வேற்றுமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ θυρωρός
  choice: வாயிற்காவலன்
  rationale: நுழைவாயிலைக் காத்துத் திறப்பவனைக் குறிக்கிறது; ஆட்டுத்தொழுவத்தின் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: ἀνοίγει
  choice: கதவைத் திறக்கிறான்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் இயல்புக்கும் சூழலின் தெளிவுக்கும் ‘கதவை’ சேர்க்கப்பட்டுள்ளது.
- source_word: τὰ πρόβατα
  choice: செம்மறியாடுகள்
  rationale: πρόβατα என்பதன் மேய்ப்பியல் பொருளைத் துல்லியமாகக் காட்டி, வெள்ளாடுகளிலிருந்து வேறுபடுத்துகிறது.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: அவனுடைய குரலைக் கேட்கின்றன
  rationale: குரலைக் கேட்டு அறியும் உறவுசார் படிமத்தை நேரடியாகப் பாதுகாக்கிறது. கிரேக்கத்தில் பன்மை நடுநிலை எழுவாயுடன் ஒருமை வினை வந்தாலும், தமிழில் பொருளுக்கேற்ற பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὰ ἴδια πρόβατα
  choice: தனக்குச் சொந்தமான செம்மறியாடுகள்
  rationale: ἴδια காட்டும் உடைமையையும் தனிப்பட்ட உறவையும் வெளிப்படுத்துகிறது.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: ஒவ்வொன்றையும் பெயர் சொல்லி அழைத்து
  rationale: ஒவ்வொரு ஆட்டையும் அதனதன் பெயரால் அழைப்பது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐξάγει αὐτά
  choice: அவற்றை வெளியே நடத்திச் செல்கிறான்
  rationale: மேய்ப்பன் வழிநடத்தும் படிமத்தைப் பாதுகாக்கிறது; ἐξάγω என்பதற்கு ‘வெளியே கொண்டுவருகிறான்’ என்றும் பொருள் கொள்ள முடியும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: மேய்ப்பன் படிமமும் செயற்பாட்டாளரின் அடையாளமும்
  choice: வாயிற்காவலன் அவனுக்குக் கதவைத் திறப்பதும், ஆடுகள் அவனுடைய குரலைக் கேட்பதும், அவன் தன் ஆடுகளை அழைத்து வெளியே நடத்திச் செல்வதும் உருவகத்தின் சொற்களிலேயே தரப்பட்டுள்ளன.
  alternative: இந்த வசனத்திலேயே மேய்ப்பனை இயேசு என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: உரையின் சூழல் கிறிஸ்துவை நோக்கினாலும், கிரேக்க வசனம் இங்கு பெயரை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் உருவகத்தின் இயல்பான இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘வாயிற்காவலன்,’ ‘பெயர் சொல்லி அழைத்து,’ ‘வெளியே நடத்திச் செல்கிறான்’ ஆகியவை மேய்ப்பியல் காட்சியை இயல்பாகத் தக்கவைக்கின்றன.
