id: JHN.10.32
reference: John 10:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “தந்தையிடமிருந்து[b] பல நல்ல செயல்களை நான் உங்களுக்குக் காட்டினேன். அவற்றில் எந்தச் செயலுக்காக என்னைக் கல்லெறிகிறீர்கள்?[a]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றில் எந்தச் செயலின் காரணமாக என்னைக் கல்லெறிகிறீர்கள்?”
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகள் “என் தந்தையிடமிருந்து” என்று தருகின்றன; ஆனால் இங்குள்ள கிரேக்க மூலத்தில் “தந்தையிடமிருந்து” என்று மட்டுமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: உரையாடலில் மறுமொழி கூறுவதை இயல்பாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
- source_word: Πολλὰ ἔργα καλὰ
  choice: பல நல்ல செயல்கள்
  rationale: ἔργα என்பதன் ‘செயல்கள்’ என்ற பொருளையும், καλὰ தரும் நல்லதும் பயனளிப்பதுமான தன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: ἔδειξα
  choice: நான் உங்களுக்குக் காட்டினேன்
  rationale: இறந்தகால வினையை நேரடியாகக் காட்டுவதோடு, இயேசுவின் செயல்கள் அவர்கள் காணும்படி வெளிப்பட்டன என்ற கருத்தையும் இயல்பாகத் தருகிறது.
- source_word: ἐκ τοῦ πατρός
  choice: தந்தையிடமிருந்து
  rationale: ἐκ குறிக்கும் மூலத்தைத் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘என்’ என்ற உடைமைச் சொல்லைச் சேர்க்கவில்லை.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: அவற்றில் எந்தச் செயலுக்காக
  rationale: διά + accusative குறிக்கும் காரணம் அல்லது அடிப்படையைத் தெரிவித்து, முன்பு சொல்லப்பட்ட பல செயல்களில் ஒன்றை ஒருமையில் சுட்டுகிறது.
- source_word: ἐμὲ λιθάζετε
  choice: என்னைக் கல்லெறிகிறீர்கள்
  rationale: நிகழ்கால மோதல் சூழலில் வினையின் நேரடியான பொருளைக் காக்கிறது; ‘கொல்ல முயல்கிறீர்கள்’ போன்ற வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் பேச்சில் ‘தந்தை’ என்ற குறிப்பு
  choice: ‘தந்தையிடமிருந்து’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘என் தந்தையிடமிருந்து’
  rationale: கிரேக்க மூலத்தில் μου (‘என்’) இல்லை. ஆகவே உறவை மூலத்தைவிடத் தீவிரப்படுத்தாமல், சூழலில் உள்ள கிறிஸ்துவியல் அழுத்தத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதும் மரியாதைமிக்கதுமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்கிரியைகள்’ போன்ற சமயக்குழு சார்ந்த பழைய சொற்றொடருக்குப் பதிலாக ‘நல்ல செயல்கள்’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [a] குறியீடு தவறான இடத்தில் தோன்றினாலும், அதன் அடிக்குறிப்பு சார்ந்துள்ள கேள்வித் தொடரின் பின்னரே தமிழில் வைக்கப்பட்டுள்ளது.
