reference: John 10:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: ta
  text: மேய்ப்பன் அல்லாத, ஆடுகள் தனக்குச் சொந்தமல்லாத கூலியாள், வரும் ஓநாயைக் கண்டு, ஆடுகளை விட்டுவிட்டு[a] ஓடிப்போகிறான்; ஓநாய் அவற்றைப் பறித்துக்கொண்டு சிதறடிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆடுகளைக் கைவிட்டுவிட்டு.” இங்குள்ள வினைச்சொல், ஆபத்தில் அவற்றைக் கைவிடுதல் என்ற வலுவான பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: கூலியாள்
  rationale: கூலிக்காக வேலை செய்பவனைக் குறிக்கிறது. உண்மையான மேய்ப்பனுடன் உள்ள வேறுபாட்டைப் பேணும் இயல்பான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: οὐκ ὢν ποιμήν
  choice: மேய்ப்பனாக இல்லாதவனும்
  rationale: கிரேக்கப் பங்கேற்புவினை அமைப்பைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்கி, அவன் உண்மையில் மேய்ப்பன் அல்ல என்ற கருத்தைப் பேணுகிறது.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: ஆடுகள் தனக்குச் சொந்தமில்லாதவனுமான
  rationale: ஆடுகள் அவனுக்குச் சொந்தமானவை அல்ல என்பதையும், அவற்றுடன் அவனுக்குள்ள தனிப்பட்ட உரிமை உறவு இல்லாமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: θεωρεῖ
  choice: கண்டு
  rationale: நெருங்கிவரும் ஆபத்தைப் பார்ப்பதைக் கருத்துக்கு அதிக விளக்கம் சேர்க்காமல் இயல்பாகக் குறிக்கிறது.
- source_word: τὸν λύκον ἐρχόμενον
  choice: ஓநாய் வருவதைக்
  rationale: வருகின்ற ஓநாயை என்ற கிரேக்கத்தின் உயிரோட்டமான இயக்கத்தை இயல்பான தமிழில் பேணுகிறது.
- source_word: ἀφίησιν
  choice: விட்டுவிட்டு
  rationale: அடிப்படையான ‘விடுதல்’ என்ற பொருளைத் தருகிறது; சூழலில் அது ஆபத்தில் கைவிடுதல் என்ற வலுவான நிழற்பொருளையும் கொள்ளலாம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: φεύγει
  choice: ஓடிப்போகிறான்
  rationale: ஆபத்திலிருந்து தப்பி ஓடுவதை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἁρπάζει
  choice: பிடித்து
  rationale: ஓநாய் ஆடுகளை வன்மையாகப் பற்றிக்கொள்வதைச் சூழல் தெளிவாக்குகிறது; தமிழில் அடுத்துவரும் ‘சிதறடிக்கிறது’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: σκορπίζει
  choice: சிதறடிக்கிறது
  rationale: ஆடுகள் ஒன்றாக இருக்க முடியாமல் ஓநாய் அவற்றைச் சிதறச் செய்வதை வலுவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πρόβατα
  choice: ஆடுகள்
  rationale: கூட்டம் என்ற தொகுப்புச் சொல்லுக்குப் பதிலாக மூலத்தின் பன்மையான, உருவகத்துக்கு அடிப்படையான நேரடி சொல்லைப் பேணுகிறது.
theological_decisions:
- issue: மேய்ப்பன் உருவகத்தின் தன்மை
  choice: ‘மேய்ப்பன்’, ‘கூலியாள்’, ‘ஆடுகள்’, ‘ஓநாய்’ ஆகிய மேய்ச்சல் சார்ந்த சொற்களை அவற்றின் உருவக விளக்கத்தை உரைக்குள் சேர்க்காமல் அப்படியே பேணுதல்
  alternative: ‘தலைவர்’, ‘பாதுகாவலர்’ போன்ற விளக்கச் சொற்களைப் பயன்படுத்துதல்
  rationale: யோவான் 10 முழுவதும் தொடரும் மேய்ப்பன் உருவகம் இச்சொற்களைச் சார்ந்துள்ளது. அவற்றை விளக்கக் கருத்துகளால் மாற்றுவது உருவகத்தைத் தட்டையாக்கி, கிரேக்க மூலம் கூறாத பொருளை உரைக்குள் சேர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட கிரேக்கப் பெயரெச்ச அமைப்பு தமிழில் இயல்பாக அமைய ‘மேய்ப்பனாக இல்லாதவனும் ... கூலியாள்’ என வடிவமைக்கப்பட்டது; மூலத்தின் மேய்ச்சல் உருவகமும் நிகழ்கால உயிரோட்டமும் பேணப்பட்டுள்ளன.
