revisions:
- from: மேய்ப்பனாக இல்லாதவனும், ஆடுகள் தனக்குச் சொந்தமில்லாதவனுமான கூலியாள், ஓநாய் வருவதைக் கண்டு, ஆடுகளை விட்டுவிட்டு[a] ஓடிப்போகிறான்; ஓநாய் அவற்றைப் பிடித்துச் சிதறடிக்கிறது.
  to: மேய்ப்பன் அல்லாத, ஆடுகள் தனக்குச் சொந்தமல்லாத கூலியாள், வரும் ஓநாயைக் கண்டு, ஆடுகளை விட்டுவிட்டு[a] ஓடிப்போகிறான்; ஓநாய் அவற்றைப் பறித்துக்கொண்டு சிதறடிக்கிறது.
