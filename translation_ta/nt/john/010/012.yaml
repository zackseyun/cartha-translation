  source_fidelity: 'The draft accurately preserves the sequence and main contrasts of the Greek: the hired worker is not a shepherd, the sheep are not his own, he sees the wolf, leaves the sheep and flees, and the wolf then acts against and scatters them. However, ‘பிடித்து’ is too weak for ἁρπάζει, which denotes forcefully seizing or snatching away.'
