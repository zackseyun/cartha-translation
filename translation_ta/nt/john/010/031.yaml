source:
  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: ta
  text: ஆகவே, யூதர்கள் அவரைக் கல்லெறிய மறுபடியும் கற்களை எடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில், ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’ என்று பொருள்படலாம். யோவான் பயன்படுத்தும் ‘யூதர்கள்’ என்ற சொற்றொடர், யூத மக்கள் அனைவரையும் குறிக்காமல், இயேசுவை எதிர்த்த குறிப்பிட்ட யூதர்களை அடிக்கடி குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: எடுத்தார்கள்
  rationale: βαστάζω என்பதற்கு ‘சுமத்தல்/சுமத்திச் செல்லுதல்’ என்ற பொருள்கள் இருந்தாலும், உடனடியாகக் கல்லெறியும் நோக்கில் கற்களைக் கையில் எடுக்கும் இச்சூழலில் ‘எடுத்தார்கள்’ என்பது இயல்பான தமிழ்.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் விளைவு அல்லது தொடர்ச்சியை οὖν குறிக்கிறது; ‘ஆகவே’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: மீண்டும் நிகழும் செயலை πάλιν குறிக்கிறது; ‘மறுபடியும்’ இதை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: λίθους
  choice: கற்களை
  rationale: λίθος என்பதன் நேரடிப் பொருள் ‘கல்’; பன்மை மற்றும் வேற்றுமையைத் தமிழில் ‘கற்களை’ என இயல்பாகத் தருகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருளை முதன்மை உரை தக்கவைக்கிறது; யோவான் நூலில் இதன் சூழல்சார் குறுகிய பயன்பாட்டை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἵνα
  choice: கல்லெறிய
  rationale: ἵνα + subjunctive இங்கு நோக்கத்தைக் குறிக்கிறது; தமிழில் வினையெச்ச வடிவான ‘கல்லெறிய’ நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λιθάσωσιν
  choice: கல்லெறிய
  rationale: λιθάζω என்பது ஒருவர்மீது கற்களை எறிந்து தண்டிப்பதைக் குறிக்கிறது; ‘கல்லெறிய’ மூல வினையின் தனித்துவத்தைத் தக்கவைக்கிறது, ‘கொல்ல’ என்பதை விளக்கமாகச் சேர்ப்பதில்லை.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்; மரியாதைமிக்க இயல்பான தமிழில் ‘அவரை’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு மற்றும் வரம்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று நேரடியாக மொழிபெயர்த்து, சூழலுக்குரிய குறுகிய பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’.
  rationale: இவ்வசனம் தானாகவே ‘தலைவர்கள்’ என்று குறிப்பிடாததால், முதன்மை உரை கிரேக்கச் சொல்லின் வெளிப்படையான வடிவத்தைத் தக்கவைக்கிறது. அதேவேளை, யோவானின் பயன்பாடு பல இடங்களில் யூத மக்கள் அனைவரையும் அல்லாமல் இயேசுவை எதிர்த்த குறிப்பிட்ட குழுவைக் குறிக்கக்கூடும்; அடிக்குறிப்பு இந்தத் தெளிவின்மையைப் பாதுகாத்து தவறான பொதுமைப்படுத்தலைத் தவிர்க்க உதவுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘கல்லெறிய’ என்பது நோக்கத்தையும் மூலமொழியின் குறிப்பான வினையையும் இயல்பாகத் தருகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
