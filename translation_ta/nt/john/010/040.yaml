source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: ta
  text: அவர் மீண்டும் யோர்தானைக் கடந்து, யோவான் முதலில் திருமுழுக்கு கொடுத்துக்கொண்டிருந்த இடத்திற்குச் சென்று, அங்கே தங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: சென்றார்
  rationale: ἀπέρχομαι இங்கு இருந்த இடத்தைவிட்டு வேறோர் இடத்திற்குச் செல்வதைக் குறிக்கிறது; இலக்கு தொடர்ந்து குறிப்பிடப்படுவதால் தமிழில் ‘சென்றார்’ இயல்பாகவும் போதுமான தெளிவுடனும் உள்ளது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு நிகழ்ந்த இடமாற்றம் இப்போது மறுபடியும் நிகழ்வதை நேரடியாகக் குறிக்கிறது.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தானைக் கடந்து
  rationale: πέραν + மரபுவேற்றுமை யோர்தானின் மறுபக்கத்தை நோக்கிய இடமாற்றத்தைக் குறிக்கிறது; ‘யோர்தானைக் கடந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: εἰς τὸν τόπον
  choice: இடத்திற்கு
  rationale: εἰς இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘இடத்திற்கு’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: யோவான் முதலில் திருமுழுக்குக் கொடுத்துக்கொண்டிருந்த
  rationale: ἦν ... βαπτίζων என்ற சுற்றுவடிவம் அக்காலத்தில் தொடர்ந்து நடந்த செயலைக் காட்டுகிறது; ‘கொடுத்துக்கொண்டிருந்த’ அந்த நீடித்த அம்சத்தைப் பாதுகாக்கிறது. τὸ πρῶτον என்பதற்கு ‘முதலில்’ நேரான இணை.
- source_word: ἔμεινεν
  choice: தங்கினார்
  rationale: μένω இங்கு ஓர் இடத்தில் தொடர்ந்து இருப்பதைக் குறிக்கிறது; ‘தங்கினார்’ இயல்பான சமகாலத் தமிழ்.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் நேரான தமிழ் இணை.
theological_decisions:
- issue: βαπτίζω என்பதற்கான தமிழ் சொல்
  choice: திருமுழுக்குக் கொடு
  alternative: ஞானஸ்நானம் கொடு / முழுக்காட்டு
  rationale: ‘திருமுழுக்கு’ என்பது நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய, கண்ணியமான, பரவலான வேதாகமச் சொல்; குறிப்பிட்ட திருச்சபை மரபின் கோட்பாட்டுச் சொல்லாக்கத்தைத் தவிர்க்கிறது. மூலச் சொல்லின் சடங்கு சார்ந்த செயலை மொழிபெயர்க்கிறது; அதன் முறை குறித்த விவாதத்தை இங்கு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியான அமைப்பு ஒரே வாக்கியமாகப் பேணப்பட்டுள்ளது. யோர்தான் என்பது நதியைக் குறிக்கும் என்பது சூழலில் தெளிவாக இருப்பதால் ‘ஆறு’ சேர்க்கப்படவில்லை.
