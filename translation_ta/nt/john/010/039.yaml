base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: ta
  text: எனவே, அவர்கள் மீண்டும் அவரைப் பிடிக்க முயன்றார்கள்; ஆனால் அவர் அவர்களுடைய கையிலிருந்து தப்பிச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτουν
  choice: பிடிக்க முயன்றார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் நடந்துகொண்டிருந்த அல்லது நிறைவேறாமல் முயற்சிக்கப்பட்ட செயலைக் காட்டுகிறது. தமிழில் ‘முயன்றார்கள்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய உரையாடலின் விளைவாக அடுத்து நடந்ததை இணைக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: இதே செயல் மறுபடியும் முயற்சிக்கப்பட்டதை நேரடியாகக் காட்டுகிறது.
- source_word: πιάσαι
  choice: பிடிக்க
  rationale: வலுக்கட்டாயமாகப் பற்றிக்கொள்ளுதல் அல்லது கைப்பற்றுதல் என்ற பொருளைத் தருகிறது; ‘கைதுசெய்ய’ என்பதிலுள்ள சட்டரீதியான நுணுக்கத்தை தேவையின்றிச் சேர்க்கவில்லை.
- source_word: ἐξῆλθεν
  choice: வெளியேறினார்
  rationale: கிரேக்க வினைச்சொல்லின் அடிப்படைப் பொருளான ‘வெளியே சென்றார்’ என்பதைப் பாதுகாக்கிறது; ‘தப்பினார்’ என்று விளக்கத்தை நேரடியாக முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: அவர்களுடைய கையிலிருந்து
  rationale: கிரேக்கத்தில் ஒருமையில் உள்ள ‘கை’ என்ற உருவகச் சொல்லை நெருக்கமாகப் பாதுகாக்கிறது; அது இங்கு பிடி, கட்டுப்பாடு அல்லது அதிகாரத்தைக் குறிக்கிறது.
theological_decisions:
- issue: இயேசு விடுபட்டதை ‘தப்பினார்’ என்று வெளிப்படையாகக் கூறுவதா, அல்லது மூலத்தின் ‘அவர்களுடைய கையிலிருந்து வெளியேறினார்’ என்ற சொல்லமைப்பைப் பாதுகாப்பதா
  choice: அவர்களுடைய கையிலிருந்து வெளியேறினார்
  alternative: அவர்களுடைய பிடியிலிருந்து தப்பினார்
  rationale: சூழல் அவர் பிடிபடாமல் சென்றதைக் காட்டினாலும், கிரேக்க உரை ‘தப்பினார்’ என்பதற்கான தனிப்பட்ட வினைச்சொல்லைப் பயன்படுத்தவில்லை. ஆகவே நிகழ்வின் உட்குறிப்பை வாசகர் உணருமாறு விட்டுவிட்டு, மூல உருவகத்தையும் வினைச்சொல்லையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழில் எளிதாகப் புரியும், கண்ணியமான நடை. ‘பிடிக்க முயன்றார்கள்’ என்பது தொடர்ந்த அல்லது நிறைவேறாத முயற்சியை இயல்பாகத் தெரிவிக்கிறது; ‘கையிலிருந்து வெளியேறினார்’ என்பது சற்றே மூலநெருக்கமான உருவகமாக இருப்பதால் அடிக்குறிப்பால் தெளிவுபடுத்தப்பட்டுள்ளது.
