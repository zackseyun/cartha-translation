  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ta
  text: என் ஆடுகள் என் குரலைக் கேட்கின்றன; நானும் அவற்றை அறிவேன்; அவை என்னைப் பின்பற்றுகின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: என் ஆடுகள்
  rationale: மேய்ப்பன்–ஆடுகள் உருவகத்தை இயல்பாகத் தக்கவைக்கிறது. τὰ ἐμὰ தரும் உடைமைப் பொருள் தமிழில் ‘என்’ என்பதால் தெளிவாகிறது; ‘எனக்குச் சொந்தமான’ என்பது தேவையற்ற கனத்தைச் சேர்க்கும்.
- source_word: τῆς φωνῆς μου
  choice: என் குரலை
  rationale: தனிப்பட்ட மேய்ப்பனின் குரலைக் குறிக்கும் சூழலில் φωνή என்பதற்கு ‘குரல்’ துல்லியமான, இயல்பான இணை.
- source_word: ἀκούουσιν
  choice: கேட்கின்றன
  rationale: நிகழ்கால வினை வடிவம் ஆடுகளின் தொடர்ச்சியான அல்லது இயல்பான செயலைக் காட்டுகிறது. ‘செவிகொடுக்கின்றன’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத கவனமுள்ள கீழ்ப்படிதல் நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: நான் அவற்றை அறிந்திருக்கிறேன்
  rationale: γινώσκω என்பதன் உறவுசார் ஆழத்தைத் தமிழில் இயல்பாகச் சுமக்கும் வகையில் ‘அறிந்திருக்கிறேன்’ பயன்படுத்தப்பட்டுள்ளது; ‘தனிப்பட்ட முறையில் அறிந்திருக்கிறேன்’ என விரிவாக்கப்படவில்லை. κἀγώ-இன் இணைப்புப் பொருள் அரைப்புள்ளி அமைப்பில் தொடர்ச்சியாகத் தக்கவைக்கப்படுகிறது.
- source_word: ἀκολουθοῦσίν μοι
  choice: அவை என்னைப் பின்பற்றுகின்றன
  rationale: நிகழ்காலத்தின் தொடர்ச்சியான/பண்புசார் செயலையும் μοι குறிக்கும் இயேசுவை நோக்கிய பின்பற்றுதலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மேய்ப்பன்–ஆடுகள் உருவகத்தில் γινώσκω என்பதன் உறவுசார் வலிமை
  choice: ‘அறிந்திருக்கிறேன்’ என்று விரிவாக்கமின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தனிப்பட்ட முறையில் அறிந்திருக்கிறேன்’ அல்லது ‘அடையாளம் கண்டுகொள்கிறேன்’.
  rationale: மூலச்சொல் ஆழமான உறவுப் பொருளை ஏற்கக்கூடியது; ஆனால் அந்தப் பொருளை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகச் சுருக்காமல், தமிழ்ச் சொல்லிலேயே அதன் திறந்த ஆழம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி நடை. ‘ஆடுகள்’ உயிரற்ற பன்மையைப் போல இலக்கண ஒத்திசைவு பெறுவதால் ‘கேட்கின்றன/அவை’ பயன்படுத்தப்பட்டுள்ளன. மூன்று நிகழ்கால வினைகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
