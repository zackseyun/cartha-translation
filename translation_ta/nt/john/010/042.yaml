  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: ta
  text: அங்கே பலர் அவர்மீது நம்பிக்கை வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: முந்தைய நிகழ்வின் தொடர்ச்சியைத் தமிழ்ச் சொல்வரிசையும் சூழலும் இயல்பாக உணர்த்துகின்றன; இங்கு «மேலும்» அல்லது «அப்போது» எனச் சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கலாம்.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல் போலப் பயன்படும் பன்மைச் சொல் பல மனிதர்களைக் குறிக்கிறது; «பலர்» சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐπίστευσαν
  choice: நம்பிக்கை வைத்தார்கள்
  rationale: πιστεύω என்ற வினை இங்கு இயேசுவை நோக்கிய நம்பிக்கையைக் குறிக்கிறது. «நம்பினார்கள்» என்பதும் சாத்தியம்; ஆனால் εἰς αὐτόν என்பதுடன் «அவர்மீது நம்பிக்கை வைத்தார்கள்» என்பது நவீனத் தமிழில் இயல்பாகத் தனிப்பட்ட நம்பிக்கையின் திசையை வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτόν
  choice: அவர்மீது
  rationale: πιστεύω εἰς என்ற கட்டமைப்பு ஒருவரை நோக்கிய நம்பிக்கை அல்லது சார்ந்திருத்தலைக் குறிக்கிறது. «அவர்மீது» என்பது தமிழில் இயல்பான இணைவு; கிரேக்க முன்னிடைச்சொல்லை இடவியல் பொருளில் மிகச்சொல்லுக்குச் சொல் மொழிபெயர்க்கவில்லை.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: நம்பிக்கை ஏற்பட்ட இடத்தைச் சுட்டும் இடவினையடை; «அங்கே» கதையின் இடக் குறிப்பை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: πιστεύω εἰς αὐτόν என்பதன் இறையியல் வலிமை
  choice: அவர்மீது நம்பிக்கை வைத்தார்கள்
  alternative: அவரை நம்பினார்கள்
  rationale: தேர்ந்தெடுக்கப்பட்ட வடிவம் இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் «விசுவாசம் கொண்டார்கள்» போன்ற சமயப் பதிவுச் சொல்லைத் திணிக்கவோ, இரட்சிப்பின் முழு தன்மையை வசனம் கூறுவதைக் கடந்துத் தீர்மானிக்கவோ இல்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். குறுகிய கிரேக்க வாக்கியத்தின் எளிமையும் இடவலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
