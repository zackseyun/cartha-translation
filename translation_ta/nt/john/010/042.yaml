  source_fidelity: மூலத்தின் πολλοὶ, ἐπίστευσαν εἰς αὐτόν, ἐκεῖ ஆகிய அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. «அவர்மீது நம்பிக்கை வைத்தார்கள்» என்பது πιστεύω εἰς αὐτόν என்பதன் ஒருவரை நோக்கிய நம்பிக்கை என்ற பொருளைச் சரியாகக் காக்கிறது. καὶ-யைத் தனிச் சொல்லாக விடுத்திருப்பது தமிழில் இயல்பான தொடர்நடையில் ஏற்றுக்கொள்ளத்தக்கது; பொருளில் இழப்பு இல்லை.
  naturalness: «அங்கே பலர் அவர்மீது நம்பிக்கை வைத்தார்கள்» நவீன தரநிலைத் தமிழில் தெளிவான, கண்ணியமான, இயல்பான வாக்கியம். மூலத்தின் சுருக்கமும் இடக்குறிப்பின் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
  terminology: «நம்பிக்கை வைத்தார்கள்» சமயத் தொழில்நுட்பச் சொல்லைத் தேவையின்றித் திணிக்காமல், இயேசுவை நோக்கிய நம்பிக்கையை இயல்பாக வெளிப்படுத்துகிறது. «அவர்மீது» இச்சூழலில் பொருத்தமானது.
