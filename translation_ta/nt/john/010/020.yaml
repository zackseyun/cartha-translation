id: JHN.10.20
reference: John 10:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: ta
  text: ஆனால் அவர்களில் பலர், “இவனுக்குள் ஒரு பிசாசு இருக்கிறது; இவன் பைத்தியமாக இருக்கிறான். இவன் சொல்வதை ஏன் கேட்கிறீர்கள்?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்வினை வடிவம், காட்சியில் தொடர்ந்து அல்லது பலமுறை கூறப்பட்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் காணப்படும் கருத்துக்கு மாறான எதிர்வினையைச் சுட்டும் எதிர்மறை இணைப்பாக இங்கு அமைகிறது.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: அவர்களில் பலர்
  rationale: முழுக் குழுவிலிருந்து ஒரு பகுதியினரைச் சுட்டும் பகுதிப்பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: Δαιμόνιον ἔχει
  choice: இவனுக்குள் ஒரு பேய் இருக்கிறது
  rationale: ‘ஒரு பேயைக் கொண்டிருக்கிறான்’ என்ற செயற்கையான சொல்லாட்சியைத் தவிர்த்து, குற்றச்சாட்டின் நேரடிப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; ‘பேய் பிடித்திருக்கிறது’ என்பதைவிட மூலத்தின் அமைப்புக்கு நெருக்கமானது.
- source_word: μαίνεται
  choice: பைத்தியமாக இருக்கிறான்
  rationale: மனநிலை பிறழ்ந்திருப்பதாக எதிரிகள் கூறும் பழியை, ‘வெறிபிடித்தவன்’ போன்ற குழப்பமளிக்கும் சொல்லைவிடத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: இவன் சொல்வதை ஏன் கேட்கிறீர்கள்?
  rationale: τί இங்கு ‘ஏன்?’ என்றும், பிறப்புவேற்றுமையுடன் வரும் ἀκούω ஒருவருக்குச் செவிகொடுப்பதையும் குறிக்கிறது. தமிழில் குற்றஞ்சாட்டும் கேள்வியின் வலிமையை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இயேசுவின் நிலையைப் பற்றிய பகைமையான குற்றச்சாட்டை மொழிபெயர்த்தல்
  choice: இவனுக்குள் ஒரு பேய் இருக்கிறது; இவன் பைத்தியமாக இருக்கிறான்
  alternative: இவனுக்குப் பேய் பிடித்திருக்கிறது; இவன் மதிகெட்டவன்
  rationale: பேசுவோரின் பழியை மென்மைப்படுத்தாமலும், அதை உண்மை என உறுதிப்படுத்தாமலும், கிரேக்கச் சொற்களின் நேரடித் தன்மையையும் கதையின் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதே நேரத்தில் கண்ணியமான நடை. எதிரிகளின் இழிவான பேச்சைக் காட்ட ‘இவன்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு தேவையில்லை; மாற்று வாசகம் மூலத்தில் உள்ள உண்மையான உரை அல்லது பொருள் ஐயத்தைக் காட்டுவதில்லை.
