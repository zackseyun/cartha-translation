  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: ta
  text: என் தந்தையின் செயல்களை நான் செய்யவில்லை என்றால், என்னை[a] நம்பாதீர்கள்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சொல்வதை நம்பாதீர்கள்.”
    reason: πιστεύω + μοι என்பது நேரடியாக ‘என்னை நம்புதல்’ என்பதைக் குறிக்கும்; சூழலில் ஒருவரின் கூற்றை நம்புதல் என்ற நுணுக்கமும் சாத்தியமாகும்.
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: நிபந்தனைத் துணைவாக்கியத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: οὐ ποιῶ
  choice: செய்யவில்லை
  rationale: முதல் நபர் நிகழ்கால வினையையும் அதன் மறுப்பையும் நேரடியாக வெளிப்படுத்துகிறது; சூழலில் தொடர்ந்து செய்யும் செயல்களும் உள்ளடங்கலாம்.
- source_word: τὰ ἔργα
  choice: செயல்களை
  rationale: ἔργα என்பதன் செயல்/செய்கை என்ற பரந்த பொருளை இயல்பாகத் தருகிறது; யோவானில் இயேசுவின் அடையாளச் செயல்களையும் பிற செயல்களையும் உள்ளடக்க முடியும்.
- source_word: τοῦ πατρός μου
  choice: என் தந்தையின்
  rationale: உடைமைத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது; தமிழில் இறைவனைக் குறிக்கும் உறவுப்பெயராகவும் இயல்பாக உள்ளது.
- source_word: μὴ πιστεύετέ
  choice: நம்பாதீர்கள்
  rationale: μή உடனான நிகழ்காலக் கட்டளை வடிவத்தின் தடைப் பொருளை மரியாதைப் பன்மையில் இயல்பாகத் தருகிறது.
- source_word: μοι
  choice: என்னை
  rationale: πιστεύω + dative என்பதன் ‘ஒருவரை நம்புதல்’ என்ற நேரடியான தனிநபர் நோக்கைத் தக்கவைக்கிறது; ‘நான் சொல்வதை’ என்ற விரிவாக்கத்தை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: πιστεύω என்பதுடன் வரும் μοι என்பதன் பொருள் வலிமை
  choice: என்னை நம்பாதீர்கள்
  alternative: நான் சொல்வதை நம்பாதீர்கள்
  rationale: கிரேக்கத்தில் தனிநபர்மீதான நம்பிக்கையும் அவர் கூறுவதற்கு அளிக்கும் நம்பகத்தன்மையும் ஒன்றோடொன்று தொடர்புடையவை. நேரடியான தனிநபர் வடிவம் மூலத்தின் சுருக்கத்தையும் பொருள் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘தந்தை’ என்பது ‘பிதா’வைக் காட்டிலும் பொதுவாசகர்களுக்கு எளிதாகப் புரியும்; மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் வசனம் சுருக்கமாக வைக்கப்பட்டுள்ளது.
