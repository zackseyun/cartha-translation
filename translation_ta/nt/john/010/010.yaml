source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: ta
  text: திருடன் திருடவும், அறுத்துக் கொல்லவும்[a], அழிக்கவும் மட்டுமே வருகிறான். நானோ, அவர்கள் வாழ்வு பெறவும், அதை மிகுதியாகப் பெறவும்[b] வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லவும்.” கிரேக்க வினைச்சொல் பொதுவாக விலங்குகளை அறுப்பதைக் குறிக்கிறது; இங்குள்ள ஆட்டு உருவகத்துக்கு அது பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வாழ்வை மிகுதியாகப் பெறவும்” அல்லது “வாழ்வை முழுமையாகப் பெறவும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: திருடன்
  rationale: குறிப்பிட்ட/பொதுப்படையான ஒருமையைத் தமிழில் இயல்பாகக் காட்டுகிறது; மேய்ப்பன் உரையில் ஒரு பிரதிநிதி உருவமாகச் செயல்படுகிறது.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: மட்டுமே வருகிறான்
  rationale: ‘அன்றி வருவதில்லை’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, பிரத்தியேக நோக்கின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἵνα κλέψῃ
  choice: திருடவும்
  rationale: தொடர்ந்து வரும் மூன்று நோக்கச் செயல்களின் இணையான அமைப்பைப் பாதுகாக்கிறது.
- source_word: θύσῃ
  choice: வெட்டிக் கொல்லவும்
  rationale: θύω என்பதன் விலங்குகளை அறுக்கும்/வெட்டிக் கொல்லும் நுண்பொருளை, சூழலிலுள்ள ஆட்டு உருவகத்துக்கு ஏற்றபடி வெளிப்படுத்துகிறது.
- source_word: ἀπολέσῃ
  choice: அழிக்கவும்
  rationale: திருடுதல், கொல்லுதல் ஆகியவற்றைத் தொடர்ந்து வரும் முழுமையான நாசத்தை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: ἐγὼ ἦλθον
  choice: நானோ … வந்தேன்
  rationale: ἐγώ-வின் வலியுறுத்தலையும் திருடனுடனான முரண்பாட்டையும் ‘நானோ’ தெளிவாகக் காட்டுகிறது; இறந்தகால வினை அஓரிஸ்டை இயல்பாக வழங்குகிறது.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: அவர்கள் வாழ்வு பெறவும்
  rationale: யோவானின் முக்கியச் சொல்லான ζωή-ஐ ‘நித்திய வாழ்வு’ என்று விளக்கி விரிவாக்காமல், நோக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: περισσὸν ἔχωσιν
  choice: அதை நிறைவாகப் பெறவும்
  rationale: περισσόν குறிக்கும் மிகுதி/நிறைவை ‘வாழ்வு’ என்பதோடு இணைத்து, பொருளாதார வளம் என்ற தவறான குறுக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோவானின் பயன்பாட்டில் ζωή என்பதன் பரப்பு
  choice: வாழ்வு
  alternative: நித்திய வாழ்வு; உண்மையான வாழ்வு
  rationale: மூலத்தில் ‘நித்திய’ என்ற அடைமொழி இல்லை. ‘வாழ்வு’ என்பது யோவானிய ஆழத்தைத் திறந்தவாறு வைத்திருந்து, வசனத்தில் இல்லாத குறிப்பாக்கத்தைச் சேர்க்காது.
- issue: περισσόν என்பதன் வலிமை
  choice: நிறைவாக
  alternative: மிகுதியாக; பரிபூரணமாக
  rationale: இயேசு அளிக்கும் வாழ்வின் நிறைவைச் சுட்டுகிறது; இதை பொருளாதார செழிப்பு அல்லது உலக வெற்றி என்று மாற்றிவிடாமல் காக்கிறது.
- issue: θύσῃ என்பதன் உருவக வலிமை
  choice: வெட்டிக் கொல்லவும்
  alternative: கொல்லவும்
  rationale: ஆடுகள் குறித்த உடனடி சூழலில் விலங்கை அறுப்பதற்கான வினையின் வலிமையைப் பாதுகாக்கிறது; அடிக்குறிப்பில் பொதுவான மாற்று தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நானோ’ என்பது கிரேக்க உரையின் வலியுறுத்தப்பட்ட எதிர்மறை ஒப்பீட்டைத் தெளிவாக்குகிறது. மூன்று அழிவுச் செயல்களிலும், இரு வாழ்வு நோக்கங்களிலும் இணை வினையெச்ச அமைப்பு பேணப்பட்டுள்ளது.
