language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: ta
  text: 'ஆகவே இயேசு மீண்டும் அவர்களிடம் கூறினார்: “உண்மையாகவே, உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: நானே ஆடுகளின் வாசல்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் தர்க்கரீதியான தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: இயேசு மறுபடியும் கூறியதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: யோவான் நற்செய்தியில் வரும் இரட்டிப்பு வலியுறுத்தலையும் அறிவிப்பின் solemn force-ஐயும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: மூலத்தின் நிகழ்காலப் பேச்சுச் சூத்திரத்தை நெருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: தமிழில் நேரடி கூற்றை அறிமுகப்படுத்த தனிச்சொல் தேவையில்லை; நிறுத்தக்குறி உள்ளடக்க வாக்கியத்தின் உறவைத் தெளிவாக்குகிறது.
- source_word: ἐγώ εἰμι
  choice: நானே
  rationale: வெளிப்படையாக வரும் ἐγώ அளிக்கும் தன்வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: θύρα
  choice: வாசல்
  rationale: கதவு அல்லது நுழைவாயில் என்ற இரு நிழற்பொருள்களையும் தாங்கக்கூடிய, ஆட்டுத்தொழுவ உருவகத்திற்குப் பொருத்தமான இயல்பான தமிழ்ச் சொல்.
- source_word: τῶν προβάτων
  choice: ஆடுகளின்
  rationale: மூலத்திலுள்ள பிறப்புவேற்றுமைத் தொடர்பை விளக்கிப் பரிமாறாமல் அப்படியே திறந்த நிலையில் வைத்திருக்கிறது.
theological_decisions:
- issue: ‘நான்’ கூற்றிலுள்ள உருவகத் தன்னடையாளம்
  choice: நானே ஆடுகளின் வாசல்
  alternative: நானே ஆடுகளுக்கான வாசல்
  rationale: இயேசுவை நுழைவிடமாகச் சித்தரிக்கும் உருவகத்தை doctrinal paraphrase இன்றி பாதுகாக்கிறது; τῶν προβάτων என்பதன் உறவை ‘ஆடுகளின்’ என்று திறந்த நிலையில் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடை. இரட்டிப்பு வலியுறுத்தலும் ஆடுகளுடன் வாசலுக்குள்ள தெளிவுறாத பிறப்புவேற்றுமைத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
