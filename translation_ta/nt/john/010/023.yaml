lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் இவ்வசனம் முந்தைய சூழலுடன் இயல்பாகத் தொடர்வதால், καί என்பதை கட்டாயமாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று மொழிபெயர்ப்பது தேவையற்ற நுண்பொருளைச் சேர்க்கக்கூடும்.
- source_word: περιεπάτει
