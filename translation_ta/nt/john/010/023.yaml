  rationale: στοά என்பது தூண்களுடன் கூடிய மூடப்பட்ட நடைவழியைக் குறிக்கிறது. தமிழில் ‘மண்டபம்’ வாசிக்க இயல்பான இடப்பெயராக அமைவதுடன், அடிக்குறிப்பு அதன் கட்டிட அமைப்பைத் தெளிவுபடுத்துகிறது.
- source_word: τοῦ Σολομῶνος
  choice: சாலொமோனின்
  rationale: இடப்பெயருடன் வரும் கிரேக்க உரிமை வேற்றுமையைத் தமிழில் இயல்பான உரிமைத் தொடராக வழங்குகிறது.
