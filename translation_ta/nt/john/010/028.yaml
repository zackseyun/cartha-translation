id: JHN.10.28
reference: John 10:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ta
  text: நான் அவற்றுக்கு நித்திய வாழ்வைக் கொடுக்கிறேன்; அவை என்றென்றும் அழிந்துபோகவே மாட்டா; ஒருவரும் அவற்றை என் கையிலிருந்து பறித்துக்கொள்ள மாட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: காலவரையற்ற, வரவிருக்கும் யுகத்துக்குரிய வாழ்வு என்ற யோவானிய கருத்தை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: என்றென்றும் அழிந்துபோகவே மாட்டா
  rationale: οὐ μή என்பதன் வலுவான மறுப்பையும் εἰς τὸν αἰῶνα என்பதன் நிரந்தரத் தன்மையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἁρπάσει
  choice: பறித்துக்கொள்ள மாட்டார்
  rationale: வலுக்கட்டாயமாகக் கைப்பற்றுதல் அல்லது பிடுங்குதல் என்ற வினையின் கருத்தை இயல்பாகத் தருகிறது.
- source_word: ἐκ τῆς χειρός μου
  choice: என் கையிலிருந்து
  rationale: மூலத்தின் கை என்ற உருவகத்தையும் பாதுகாப்பு மற்றும் அதிகாரம் குறித்த உட்பொருளையும் மாற்றாமல் வைத்திருக்கிறது.
theological_decisions:
- issue: οὐ μή மற்றும் εἰς τὸν αἰῶνα ஆகியவற்றின் கூட்டு வலிமை
  choice: என்றென்றும் அழிந்துபோகவே மாட்டா
  alternative: ஒருபோதும் அழிந்துபோக மாட்டா
  rationale: உறுதியான மறுப்பையும் காலநீட்சியையும் இரண்டையும் மொழிபெயர்த்து, வசனத்தின் பாதுகாப்பு குறித்த வலியுறுத்தலைக் குறைக்கவோ அதற்கு மேலான கோட்பாட்டுத் தீர்மானத்தைச் சேர்க்கவோ இல்லை.
- issue: αὐτοῖς / αὐτά என்பவற்றின் இலக்கணப் பாலின மாற்றம்
  choice: அவற்றுக்கு / அவற்றை
  alternative: அவர்களுக்கு / அவர்களை
  rationale: முந்தைய வசனங்களிலுள்ள ‘ஆடுகள்’ என்பதே நேரடி குறிப்பு; ஆகவே உருவகத் தொடர்ச்சிக்காக அஃறிணைப் பன்மை வைக்கப்படுகிறது. இது குறிக்கப்படும் மனிதர்களின் மதிப்பைக் குறைப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு தெளிவான, கண்ணியமான நடை. ‘அவை’ என்பது முந்தைய சூழலில் வரும் ஆடுகள் என்ற உருவகத்தைத் தொடர்கிறது. மூலத்தின் மூன்று இணை வாக்கியங்களும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
