  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: ta
  text: ஆனால் நான் அவற்றைச் செய்கிறேன் என்றால், நீங்கள் என்னை நம்பாவிட்டாலும், தந்தை என்னில் இருக்கிறார், நானும் தந்தையில் இருக்கிறேன் என்பதை நீங்கள் அறியவும் தொடர்ந்து அறிந்திருக்கவும், அந்தச் செயல்களை நம்புங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறியவும் தொடர்ந்து அறிந்திருக்கவும்” என்பதில் கிரேக்கத்தில் இரண்டு வேறுபட்ட வினைவடிவங்கள் உள்ளன; அவை முதலில் அறிதலையும், பின்னர் அந்த அறிதலில் தொடர்ந்திருப்பதையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: நான் அவற்றைச் செய்கிறேன்
  rationale: நிகழ்கால வினை; முந்தைய சூழலில் கூறப்பட்ட இயேசுவின் செயல்களையே மறைமுகச் செயப்படுபொருள் குறிக்கிறது. தமிழில் தெளிவுக்காக ‘அவற்றை’ சேர்க்கப்பட்டது.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: நீங்கள் என்னை நம்பாவிட்டாலும்
  rationale: πιστεύω உடன் வரும் ἐμοί, இயேசுவின் சாட்சியத்தை ஏற்றுக்கொள்வதான ‘என்னை நம்புதல்’ என்ற பொருளை இங்கு இயல்பாகத் தருகிறது; ‘என்னில் விசுவாசம் வைக்காவிட்டாலும்’ என்பதும் இலக்கண ரீதியில் சாத்தியம்.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: அந்தச் செயல்களை நம்புங்கள்
  rationale: இயேசுவை நேரடியாக நம்பாவிட்டாலும், அவருடைய செயல்கள் தரும் சாட்சியை ஏற்குமாறு கூறப்படுகிறது. ‘செயல்களில் விசுவாசம் வையுங்கள்’ என்பது செயல்களையே விசுவாசத்தின் இலக்காகக் காட்டக்கூடும்.
- source_word: ἔργοις
  choice: செயல்கள்
  rationale: ἔργα என்பது இயேசுவின் வெளிப்படுத்தும் செயல்களைக் குறிக்கும் யோவானியச் சொல். ‘அடையாளங்கள்’ என்பது σημεῖα என்ற வேறு சொல்லின் கருத்தை தேவையின்றி புகுத்தும்.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: அறிந்து, தொடர்ந்து அறிந்துகொள்வீர்கள்
  rationale: இறந்தகாலத் தோற்றம் கொண்ட γνῶτε மற்றும் நிகழ்காலத் தோற்றம் கொண்ட γινώσκητε ஆகிய இரு வடிவங்களின் வேறுபாட்டை, அறிதலும் தொடர்ந்த அறிதலும் என வெளிப்படுத்துகிறது. ἵνα இங்கு நோக்கத்தோடு விளைவையும் இயல்பாகச் சுட்டுவதால் ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: தந்தை என்னில் இருக்கிறார், நானும் தந்தையில் இருக்கிறேன்
  rationale: திரும்பத் திரும்ப வரும் ἐν-ஐ ‘இல்’ என்று நேரடியாக மொழிபெயர்த்து, பரஸ்பர உள்ளிருப்பின் வலிமையையும் அதன் கருத்தியல் பதற்றத்தையும் விளக்கவுரையின்றிப் பாதுகாக்கிறது.
- source_word: πατήρ
  choice: தந்தை
  rationale: மூலத்தில் உள்ள குறிப்புப்பெயர்ச்சொல் ‘தந்தை’ என்பதையே தருகிறது; ‘என் தந்தை’ என்று இல்லாத உடைமைச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தந்தையும் மகனும் ஒருவரில் ஒருவர் இருத்தல்
  choice: ‘தந்தை என்னில் இருக்கிறார், நானும் தந்தையில் இருக்கிறேன்’ என்ற நேரடி உறவுமொழியைத் தக்கவைத்தல்
  alternative: ‘தந்தை என்னோடு ஒன்றுபட்டிருக்கிறார், நானும் தந்தையோடு ஒன்றுபட்டிருக்கிறேன்’ அல்லது ‘தந்தை என்னில் வாசம்பண்ணுகிறார், நானும் தந்தையில் வாசம்பண்ணுகிறேன்’
  rationale: மூலத்தின் பரஸ்பர ἐν மொழி உயர்ந்த கிறிஸ்துவியல் கூற்றைத் தாங்குகிறது. பிற்காலக் கோட்பாட்டு சொற்களை உரைக்குள் சேர்க்காமலும், இதை வெறும் நோக்க ஒற்றுமையாகக் குறுக்காமலும் நேரடியாகப் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரமான தமிழ்; பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைந்த நடை. ‘கிரியைகள்’ என்பதற்குப் பதில் இயல்பான ‘செயல்கள்’, ‘பிதா’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘தந்தை’ பயன்படுத்தப்பட்டன. மூலத்தின் சுருக்கமும் பரஸ்பர ‘இல்’ அமைப்பும் பாதுகாக்கப்பட்டன.
