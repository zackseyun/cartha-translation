revisions:
- from: ஆனால் நான் அவற்றைச் செய்கிறேன் என்றால், நீங்கள் என்னை நம்பாவிட்டாலும், அந்தச் செயல்களை நம்புங்கள்; அப்போது தந்தை என்னில் இருக்கிறார், நானும் தந்தையில் இருக்கிறேன் என்பதை நீங்கள் அறிந்து, தொடர்ந்து அறிந்துகொள்வீர்கள்.[a]
  to: ஆனால் நான் அவற்றைச் செய்கிறேன் என்றால், நீங்கள் என்னை நம்பாவிட்டாலும், தந்தை என்னில் இருக்கிறார், நானும் தந்தையில் இருக்கிறேன் என்பதை நீங்கள் அறியவும் தொடர்ந்து அறிந்திருக்கவும், அந்தச் செயல்களை நம்புங்கள்.[a]
  rationale: The revision replaces the temporal ‘அப்போது’ with an explicit Tamil purpose construction corresponding to ἵνα. It retains the distinction between the aorist γνῶτε and present γινώσκητε without overstating that distinction, and it preserves the source’s direct mutual-indwelling language.
