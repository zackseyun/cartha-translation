  terminology: ‘அந்நியன்,’ ‘பின்தொடருதல்,’ and ‘குரல்’ are suitable in context. ‘அறிந்துகொள்வதில்லை’ retains the Greek sense of knowing/recognizing without over-specifying it; the footnote appropriately notes the recognition sense.
