id: JHN.10.5
reference: John 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: ta
  text: ஆனால், அந்நியனை அவை ஒருபோதும் பின்தொடராது[a]; மாறாக, அவனைவிட்டு ஓடிப்போகும். ஏனெனில், அந்நியர்களின் குரலை அவை அறிந்துகொள்வதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிச்சயமாகப் பின்தொடராது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் வலியுறுத்தப்பட்ட மறுப்பு (οὐ μή) பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘குரலை அறிந்துகொள்வதில்லை’ என்பதை ‘குரலை அடையாளம் காண்பதில்லை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: அந்நியனை
  rationale: மேய்ப்பன்–ஆடுகள் உருவகத்தில், ஆடுகளுக்குச் சொந்தமானவரல்லாத ஒருவரைக் குறிக்கிறது. இனத்தையோ நாட்டையோ வலியுறுத்தாமல், ‘அந்நியன்’ அந்த உறவின்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: ஒருபோதும் பின்தொடராது
  rationale: οὐ μή உடன் வரும் எதிர்கால வினைச்சொல்லின் வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவான நவீன தமிழில் காட்டுகிறது.
- source_word: ἀκολουθήσουσιν
  choice: பின்தொடராது
  rationale: ஆடுகள் ஒருவரைப் பின்பற்றிச் செல்வதைச் சூழலுக்கு இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: அவனைவிட்டு ஓடிப்போகும்
  rationale: அந்நியனிடமிருந்து விலகித் தப்பியோடும் வலுவான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἴδασι
  choice: அறிந்துகொள்வதில்லை
  rationale: οἶδα என்பதன் ‘அறிதல்’ மற்றும் சூழலில் சாத்தியமான ‘அடையாளம் காணுதல்’ ஆகிய நுணுக்கங்களை ஓரளவு திறந்தவாறே வைத்திருக்கிறது.
- source_word: τῶν ἀλλοτρίων
  choice: அந்நியர்களின்
  rationale: ஒரே அந்நியனை மட்டும் அல்லாமல், அத்தகைய அந்நியர்களின் வகுப்பைச் சுட்டும் பன்மை உருபை நேரடியாகப் பாதுகாக்கிறது.
- source_word: φωνήν
  choice: குரலை
  rationale: மேய்ப்பனையோ அந்நியனையோ அடையாளப்படுத்தும் குரல் அல்லது அழைப்பைக் குறிக்கும் உருவக மற்றும் நேரடி பரிமாணங்களைப் பாதுகாக்கிறது.
- source_word: δὲ ... ἀλλὰ
  choice: ஆனால் ... மாறாக
  rationale: அந்நியனைப் பின்தொடராததற்கும் அவனைவிட்டு ஓடுவதற்கும் இடையிலான வலுவான மாறுபாட்டை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ஆடுகள்–மேய்ப்பன் உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்கவுரையின்றி அப்படியே வைத்தல்
  alternative: ‘அந்நியன்’ என்பதைப் பொய்ப் போதகர் அல்லது சட்டவிரோதத் தலைவர் என்று முதன்மை உரையிலேயே வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் உருவகத்திற்குள்ளேயே பேசுகிறது; ‘அந்நியன்’ யாரைக் குறிக்கிறார் என்பதை இங்கே வெளிப்படையாகச் சொல்லவில்லை. அதை விரிவாக்குவது மூல உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ஆடுகளைப் பன்மை அஃறிணையாகக் கொண்டு ‘அவை’ மற்றும் ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; உருவகம் விளக்கமாக விரிவாக்கப்படவில்லை.
