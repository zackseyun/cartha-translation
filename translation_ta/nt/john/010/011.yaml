  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘தன் உயிரை வைக்கிறார்’; இது தன் உயிரைக் கொடுப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வெளிப்படையாக வரும் Ἐγώ என்பதன் வலியுறுத்தலை இயல்பான தமிழில் ‘நானே’ எனக் காட்டுகிறது; அதே நேரத்தில் தெய்வீகப் பெயருக்கான சுட்டுதலை மொழிபெயர்ப்பில் மிகைப்படுத்தவில்லை.
- source_word: ποιμήν
  choice: மேய்ப்பன்
  rationale: ஆடுகளை மேய்த்துப் பராமரிப்பவரைக் குறிக்கும் நேரடியான, சூழலுக்கு ஏற்ற சொல்; ‘போதகர்’ என்பது பிற்கால திருச்சபைச் சார்புகளை இங்கு தேவையின்றி சேர்க்கும்.
- source_word: καλός
  choice: நல்ல
  rationale: நன்மை, மேன்மை, முன்மாதிரித்தன்மை ஆகிய நிழற்பொருள்களைத் தாங்கக்கூடிய இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: தன் உயிரைக் கொடுக்கிறார்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘தன் உயிரை வைக்கிறார்’ என்றாலும், இக்கிரேக்க மரபுத்தொடர் உயிரைத் தியாகமாக அளிப்பதைக் குறிக்கிறது; தமிழில் ‘உயிரைக் கொடுக்கிறார்’ என்பதே தெளிவான இயல்பான இணை.
- source_word: ὑπὲρ
  choice: ஆடுகளுக்காக
  rationale: நன்மைக்காகவும் சார்பாகவும் என்ற இரு சாத்தியங்களையும் குறுகிய இயல்பான தமிழில் திறந்தவையாக வைத்திருக்கிறது.
- source_word: τῶν προβάτων
  choice: ஆடுகள்
  rationale: கிரேக்கத்தில் உடைமைப் பெயர் இல்லாததால் ‘தன் ஆடுகள்’ என்று சேர்க்காமல், குறிப்பிட்ட ஆடுகளைத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: Ἐγώ εἰμι என்ற இயேசுவின் தன்னை அடையாளப்படுத்தும் கூற்றின் வலிமை
  choice: ‘நானே’ என்று மொழிபெயர்த்தல்
  alternative: ‘நான்’ அல்லது தெய்வீகப் பெயருடனான தொடர்பை வெளிப்படையாக விளக்கும் விரிவாக்கம்
  rationale: தமிழில் ‘நானே’ வெளிப்படையான Ἐγώ தரும் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது. யோவான் நூலின் விரிவான இறையியல் எதிரொலி சாத்தியமானதாயினும், அதை இந்த வசனத்தின் மொழிபெயர்ப்பிலேயே தீர்மானமாக விரிவாக்கவில்லை.
- issue: καλός என்ற சொல்லின் பொருள்
  choice: ‘நல்ல மேய்ப்பன்’
  alternative: ‘மேன்மையான மேய்ப்பன்’ அல்லது ‘முன்மாதிரியான மேய்ப்பன்’
  rationale: ‘நல்ல’ என்பது பழக்கமானதும் துல்லியமானதும்; சொல்லில் உள்ள மேன்மை மற்றும் முன்மாதிரித்தன்மையை அடிக்குறிப்பு சுட்டுகிறது.
- issue: ὑπὲρ τῶν προβάτων என்பதற்கும் இயேசுவின் மரணத்திற்கும் உள்ள தொடர்பு
  choice: ‘ஆடுகளுக்காக’
  alternative: ‘ஆடுகளின் சார்பாக’ அல்லது ‘ஆடுகளின் நன்மைக்காக’
  rationale: கிரேக்க முன்னிடைச்சொல்லின் பிரதிநிதித்துவ மற்றும் நன்மைசார் பரப்பைத் திறந்தவையாக வைத்திருந்து, குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டை வசனத்தில் புகுத்தவில்லை.
