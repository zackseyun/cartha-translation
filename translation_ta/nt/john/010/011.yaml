  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: ta
  text: “நானே நல்ல மேய்ப்பன்.[a] நல்ல மேய்ப்பன் ஆடுகளுக்காக[b] தன் உயிரைக் கொடுக்கிறார்.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேன்மையான மேய்ப்பன்’ என்றும் மொழிபெயர்க்கலாம்; καλός என்பது நல்லவர், மேன்மையானவர், முன்மாதிரியானவர் என்ற பொருட்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆடுகளின் சார்பாக’ என்றும் மொழிபெயர்க்கலாம்.
