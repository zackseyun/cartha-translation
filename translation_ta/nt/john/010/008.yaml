  naturalness: ‘எனக்கு முன்பு வந்த அனைவரும் திருடர்களும் கொள்ளையர்களுமாய் இருக்கிறார்கள்’ என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அவர்களுக்குச் செவிகொடுக்கவில்லை’ என்பது செம்மறியாடுகள் மேய்ப்பரின் குரலை ஏற்றுக்கொள்ளாத உருவகத்திற்கும் இயல்பான பயன்பாட்டிற்கும் ஏற்றது.
