source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: ta
  text: எனக்கு முன்பு வந்த அனைவரும் திருடர்களும் கொள்ளையர்களுமாய் இருக்கிறார்கள்[a]. ஆனால் செம்மறியாடுகள் அவர்களுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்கு முன்னே.’ இந்தச் சொற்றொடர் கால அடிப்படையில் ‘எனக்கு முன்பு’ என்றும், இயேசுவிடமிருந்து தனியே அதிகாரம் கோரி அவருக்கு முன்னதாக வந்தவர்கள் என்ற பொருளிலும் புரிந்துகொள்ளப்படலாம். சூழல், தேவனுடைய முந்தைய ஊழியர்கள் எல்லாரையும் அல்ல, பொய்யான மேய்ப்பர்களையே சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: வந்த அனைவரும்
  rationale: இந்தக் கூட்டுச்சொல் குறிப்பிட்டுள்ள குழுவினர் அனைவரையும் உள்ளடக்குகிறது; ‘அனைவரும்’ அதன் விரிவான பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἦλθον
  choice: வந்த
  rationale: இறந்தகால வினைச்செயலை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸ ἐμοῦ
  choice: எனக்கு முன்பு
  rationale: முதன்மையாகக் காலத்தைக் குறிக்கும் ‘எனக்கு முன்பு’ என்ற பொருளைக் காக்கிறது; ‘எனக்கு முன்னே’ என்ற இட/முன்னுரிமை சார்ந்த நுட்பமும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κλέπται
  choice: திருடர்கள்
  rationale: κλέπτης என்பதற்கான வழக்கமான தமிழ் இணை; மறைவாகப் பறித்துக்கொள்வோரைச் சுட்டுகிறது.
- source_word: λῃσταί
  choice: கொள்ளையர்கள்
  rationale: κλέπται என்பதிலிருந்து வேறுபட்டு, வன்முறை அல்லது வெளிப்படையான பறிப்பின் நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: வாக்கியத்தின் தெளிவான எதிர்மறைத் திருப்பத்தை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: அவர்களுக்குச் செவிகொடுக்கவில்லை
  rationale: இங்கு ἀκούω வெறுமனே ஒலியைக் கேட்பதைவிட, ஒருவரின் குரலை ஏற்று அதன்படி நடப்பதைக் குறிக்கிறது; மேய்ப்பன்–செம்மறியாடு உருவகத்திற்கு ‘செவிகொடுக்கவில்லை’ பொருத்தமானது.
- source_word: τὰ πρόβατα
  choice: செம்மறியாடுகள்
  rationale: மேய்ப்பன் உரையாடலில் πρόβατα குறிக்கும் விலங்கைத் துல்லியமாகவும் பொதுவாகப் புரியும் வகையிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘எனக்கு முன்பு வந்த அனைவரும்’ என்பதன் வரம்பும் பொருளும்
  choice: கிரேக்கத்தின் விரிவான வடிவைச் சுருக்காமல், ‘எனக்கு முன்பு வந்த அனைவரும்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எனக்கு முன்னே வந்த அனைவரும்’; அல்லது இயேசுவிடமிருந்து தனியே அதிகாரம் கோரிய பொய்யான மேய்ப்பர்களை மட்டும் முதன்மை உரையிலேயே வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: இயேசுவுக்கு முன்பிருந்த தேவனால் அனுப்பப்பட்ட எல்லாரையும் கண்டிப்பதாக எடுத்துக்கொள்ளக் கூடாது என்று சூழல் உணர்த்தினாலும், அந்த வரம்பு கிரேக்க வாக்கியத்தில் வெளிப்படையாகக் கூறப்படவில்லை. ஆகவே இறையியல் பதற்றத்தை முதன்மை உரையில் தீர்த்துவிடாமல், சூழல் சார்ந்த விளக்கத்தை அடிக்குறிப்பில் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுக்கவில்லை’ என்பது மேய்ப்பனின் குரலை ஏற்று பின்பற்றாத கருத்தை இயல்பாகத் தருகிறது; ‘திருடர்கள்—கொள்ளையர்கள்’ என்ற இரட்டைச் சொல் மூலத்தின் வேறுபாட்டைக் காக்கிறது.
