  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: ta
  text: அப்போது எருசலேமில் அர்ப்பணிப்பு விழா[a] நடைபெற்றது. அது குளிர்காலமாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஹனுக்கா’ என்றும் அழைக்கப்படும் இந்த யூத விழா, ஆலயம் மீண்டும் அர்ப்பணிக்கப்பட்டதை நினைவுகூர்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: நடைபெற்றது
  rationale: இங்கு γίνομαι ஒரு நிகழ்வு நடந்ததைக் குறிக்கிறது; விழாவைப் பற்றிய சூழலில் ‘நடைபெற்றது’ இயல்பான நவீனத் தமிழாகவும் நிகழ்வுச் சார்ந்த பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: τότε
  choice: அப்போது
  rationale: τότε குறிக்கும் கால மாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰ ἐγκαίνια
  choice: அர்ப்பணிப்பு விழா
  rationale: இது ஆலயத்தின் மறுஅர்ப்பணிப்பை நினைவுகூரும் விழாவைக் குறிக்கிறது. ‘அர்ப்பணிப்பு விழா’ கிரேக்கச் சொல்லின் பொருளை மொழிபெயர்த்து, அறிமுகமில்லாத வாசகருக்கும் புரியும்படி செய்கிறது; ‘ஹனுக்கா’ என்ற பொதுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடருக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: χειμὼν ἦν
  choice: அது குளிர்காலம்
  rationale: எளிய பின்னணிக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது. ‘அது’ என்பது அந்தக் காலத்தைச் சுட்டி, தமிழில் தனித்த வாக்கியமாக இயல்பாக அமைகிறது.
theological_decisions:
- issue: τὰ ἐγκαίνια என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘அர்ப்பணிப்பு விழா’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஹனுக்கா’ அல்லது ‘மறுஅர்ப்பணிப்பு விழா’
  rationale: முதன்மை உரை கிரேக்கச் சொல்லின் பொருளை நேரடியாகத் தருகிறது; பிற்காலத்திலும் பொதுவழக்கிலும் பயன்படும் ‘ஹனுக்கா’ என்ற பெயரும் ஆலய மறுஅர்ப்பணிப்பு பற்றிய பண்பாட்டுப் பின்னணியும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், இயல்பானதும் கண்ணியமானதுமான நடை. மூலத்தின் இரண்டு சுருக்கமான காலக் குறிப்புகளும் தனித்த வாக்கியங்களாகப் பாதுகாக்கப்பட்டுள்ளன; பண்பாட்டுச் சொல்லுக்கான விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
