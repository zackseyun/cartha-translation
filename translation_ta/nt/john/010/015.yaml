id: JHN.10.15
reference: John 10:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: ta
  text: தந்தை என்னை அறிந்திருப்பதுபோல, நானும் தந்தையை அறிந்திருக்கிறேன்; என் உயிரை[a] ஆடுகளுக்காக[b] ஒப்புக்கொடுக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வாழ்வை.’ தன்னையே தியாகமாக அளிக்கும் இச்சூழலில் கிரேக்கச் சொல் ஒருவரின் உயிர் அல்லது வாழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஆடுகளின் சார்பாக.’ கிரேக்க முன்னிடைச்சொல் பிரதிநிதித்துவ அல்லது தியாகப் பொருளையும் தாங்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: அறிந்திருப்பதுபோல
  rationale: முந்தைய கருத்தோடு தொடரும் வலுவான ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γινώσκει / γινώσκω
  choice: அறிந்திருப்பது / அறிந்திருக்கிறேன்
  rationale: தந்தைக்கும் மகனுக்கும் இடையிலான ஆழ்ந்த உறவுசார் அறிவைக் கூடுதல் விளக்கமின்றி ‘அறி’ என்ற ஒரே சொல்லால் பாதுகாக்கிறது.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: தந்தை / தந்தையை
  rationale: கிரேக்கத்தில் உள்ள அடைமொழியற்ற ‘தந்தை’ என்ற யோவானிய வழக்கையும் இரு கூறுகளின் இணை அமைப்பையும் காக்கிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதன் இணைப்பையும் முந்தைய கூறுக்கு எதிரொலிக்கும் சமநிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ψυχήν μου
  choice: என் உயிரை
  rationale: தன்னையே பலியாக அளிக்கும் சூழலில் ψυχή என்பது உயிர் அல்லது வாழ்க்கையைக் குறிக்கிறது; ‘என் உயிரை’ என்பது தமிழில் இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: τίθημι
  choice: கொடுக்கிறேன்
  rationale: ψυχήν உடன் வரும் ‘உயிரைக் கொடுத்தல்’ என்ற தன்னார்வத் தியாகப் பொருளை இயல்பான தமிழில் எடுத்துரைக்கிறது; ‘வைக்கிறேன்’ என்பது இச்சூழலில் செயற்கையாக இருக்கும்.
- source_word: ὑπὲρ
  choice: ஆடுகளுக்காக
  rationale: பயனுக்காகவும் சார்பாகவும் செய்யப்படும் தியாகத்தின் பரந்த பொருளை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகச் சுருக்காமல் காக்கிறது.
- source_word: τῶν προβάτων
  choice: ஆடுகள்
  rationale: பத்தியின் மையமான மேய்ப்பன் உருவகத்தை ‘மந்தை’ எனப் பொதுமைப்படுத்தாமல் மூலப்பெயர்ச்சொல்லுக்கு நேர்மையாகக் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் தன்னளிப்பில் ὑπὲρ என்பதன் வலிமை
  choice: ஆடுகளுக்காக
  alternative: ஆடுகளின் சார்பாக; ஆடுகளுக்குப் பதிலாக
  rationale: இச்சொல் ஆடுகளின் நன்மைக்காகவும் அவர்களின் சார்பாகவும் நிகழும் தியாகத்தைச் சுட்டுகிறது. ‘ஆடுகளுக்காக’ என்பது அதன் பிரதிநிதித்துவ அல்லது பதிலீட்டுச் சாத்தியத்தை மறுக்காமலும், ஒரு தொழில்நுட்பக் கோட்பாடாக மட்டும் வரையறுக்காமலும் விடுகிறது.
- issue: இச்சூழலில் ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: வாழ்வு; ஆத்துமா
  rationale: நல்ல மேய்ப்பன் மரிப்பதைப் பற்றிய இச்சூழலில், இச்சொல் உடலற்ற ஓர் உள்ளார்ந்த பகுதியை மட்டும் அல்லாமல் இயேசுவின் உயிரையே குறிக்கிறது. ‘உயிர்’ தன்னார்வத் தியாகத்தையும் தமிழின் இயல்பான சொல்லாட்சியையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம நடையும் காக்கப்பட்டுள்ளன. ‘அறிந்திருப்பது’ என்ற மீளுரை மூலத்தின் இணை அமைப்பையும் உறவுசார் ஆழத்தையும் பாதுகாக்கிறது; ‘என் உயிரைக் கொடுக்கிறேன்’ என்பது தமிழில் இயல்பான தன்னளிப்பு மொழியாகும்.
