source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: ta
  text: ஒருவரும் அதை என்னிடமிருந்து எடுத்துக்கொள்வதில்லை. மாறாக, நானாகவே அதை விட்டுக்கொடுக்கிறேன்.[a] அதை விட்டுக்கொடுக்க எனக்கு அதிகாரம் உண்டு; அதை மீண்டும் எடுத்துக்கொள்ளவும் எனக்கு அதிகாரம் உண்டு.[b][c] இந்தக் கட்டளையை என் தந்தையிடமிருந்து பெற்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நானாகவே’ என்பதை ‘என் சொந்த விருப்பத்தின்படி’ அல்லது ‘என் சொந்த முன்முயற்சியால்’ என்றும் மொழிபெயர்க்கலாம். இயேசு தம் உயிரைத் தன்னார்வமாகக் கொடுப்பதை இச்சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அதிகாரம்’ என்பதற்கு ‘வல்லமை’ அல்லது ‘உரிமை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் செயலாற்றும் திறனையும் அதற்கான உரிமையுள்ள அங்கீகாரத்தையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: ‘அதை’ என்பது இயேசுவின் உயிரைக் குறிக்கிறது; இதே சூழலில் மீண்டும் மீண்டும் வரும் ‘என் உயிர்’ என்பதைக் காண்க (யோவான் 10:17).
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει
  choice: பறித்துக்கொள்வதில்லை
  rationale: ἀπ’ ἐμοῦ என்பதோடு வரும் இச்சொல், இயேசுவின் உயிரை அவரிடமிருந்து பிறர் எடுத்துக்கொள்வதைக் குறிக்கிறது. ‘பறித்துக்கொள்’ என்பது வலுக்கட்டாயமாக எடுத்துக்கொள்ளும் கருத்தையும், அடுத்து வரும் அவருடைய தன்னார்வச் செயலுடனான எதிர்மறை ஒப்பீட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τίθημι αὐτὴν / θεῖναι αὐτήν
  choice: அதை விட்டுக்கொடுக்கிறேன் / அதை விட்டுக்கொடுக்க
  rationale: தமிழில் ‘உயிரை வைத்தல்’ இயல்பான சொற்றொடர் அல்ல. ‘விட்டுக்கொடுக்க’ என்பது இயேசு தம் உயிரைத் தாமே ஒப்புக்கொடுக்கும் கருத்தை இயல்பாகத் தெரிவிக்கிறது; ஒரே கிரேக்க வினையின் மீள்வருகையும் தமிழில் ஒரே சொல்லால் காக்கப்படுகிறது.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: நானாகவே
  rationale: இது இயேசுவின் தன்னார்வமான செயற்பாட்டைச் சுருக்கமாகக் காட்டுகிறது. ‘என் தந்தையைச் சாராமல்’ என்ற பொருளைச் சேர்க்காமல், அவருடைய சொந்தச் செயலாண்மையை மட்டும் காக்கிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: இச்சொல் வெறும் ஆற்றலை மட்டுமல்லாமல் உரிமையுடனும் அங்கீகாரத்துடனும் செயல்படும் அதிகாரத்தையும் குறிக்கலாம். தந்தையிடமிருந்து பெற்ற கட்டளையுடன் இதற்கு உள்ள தொடர்பை ‘அதிகாரம்’ நன்றாகக் காக்கிறது.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: அதை மீண்டும் பெற்றுக்கொள்ள
  rationale: λαμβάνω என்பதற்கு ‘எடுத்துக்கொள்’ அல்லது ‘பெற்றுக்கொள்’ என இரு நுணுக்கங்கள் இருக்கலாம். உயிரை மீண்டும் அடைவதைக் குறிக்கும் தமிழில் ‘மீண்டும் பெற்றுக்கொள்ள’ இயல்பாக உள்ளது; πάλιν என்பதும் வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐντολήν
  choice: கட்டளை
  rationale: ἐντολή என்பதன் நேரடியான வலிமையை இது காக்கிறது; ‘பணி’ அல்லது ‘பொறுப்பு’ என்று மென்மையாக்கவில்லை.
- source_word: παρὰ τοῦ πατρός μου
  choice: என் தந்தையிடமிருந்து
  rationale: παρά + மரபுவேற்றுமை இங்கு மூலத்தைக் குறிக்கிறது. ‘என் தந்தை’ என்ற தனிப்பட்ட உறவுமொழியும் அப்படியே காக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் மரணமும் உயிரை மீண்டும் பெறுதலும் தொடர்பான ἐξουσία
  choice: அதிகாரம்
  alternative: வல்லமை; உரிமை
  rationale: வசனம் இயேசுவின் வல்லமையை மட்டும் அல்லாமல், தந்தையின் கட்டளையோடு இசைந்த உரிமையுள்ள செயலையும் காட்டுகிறது. ‘அதிகாரம்’ அவருடைய செயலாண்மையையும் தந்தையுடனான ஒழுங்கமைந்த உறவையும் ஒன்றைக் குறைத்து மற்றொன்றை உயர்த்தாமல் காக்கிறது.
- issue: ἀπ’ ἐμαυτοῦ என்பதன் வலிமை
  choice: நானாகவே
  alternative: என் சொந்த விருப்பத்தின்படி; என் சொந்த முன்முயற்சியால்
  rationale: இது இயேசு தம் உயிரைத் தன்னார்வமாகக் கொடுப்பதைக் காட்டுகிறது. அதேவேளையில், அவர் தந்தையிடமிருந்து பெற்ற கட்டளைக்கு எதிராகவோ தந்தையைச் சாராமலோ செயல்படுகிறார் என்ற தேவையற்ற கருத்தை உருவாக்காது.
- issue: αὐτήν என்ற பிரதிப்பெயரின் குறிப்பு
  choice: அதை
  alternative: என் உயிரை
  rationale: உடனடியான முந்தைய சூழலில் (யோவான் 10:17) இதன் குறிப்பு ‘என் உயிர்’ என்பது தெளிவு. பிரதிப்பெயரை வைத்திருப்பது கிரேக்க உரையின் இணைப்பையும் உண்மையான சொற்றொடர் அமைப்பையும் காக்கிறது; அடிக்குறிப்பு குறிப்பைத் தெளிவுபடுத்துகிறது.
- issue: πάλιν λαβεῖν என்பதில் செயற்பாடு மற்றும் பெறுதல் இடையிலான நுணுக்கம்
  choice: மீண்டும் பெற்றுக்கொள்ள
  alternative: மீண்டும் எடுத்துக்கொள்ள
  rationale: கிரேக்க λαμβάνω இரு பொருள் நிழல்களையும் தாங்கலாம். ‘பெற்றுக்கொள்ள’ என்பது தமிழில் உயிரை மீண்டும் அடைவதற்கு இயல்பாக இருக்கிறது; இயேசுவின் செயற்பாட்டை அழிக்காமல், தந்தையிடமிருந்து பெற்ற கட்டளையுடன் உள்ள உறவையும் தேவையின்றித் தீர்மானிக்காது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘விட்டுக்கொடுக்கிறேன்’ என்பது சொல்லுக்குச் சொல் ‘வைக்கிறேன்’ என்பதைக் காட்டிலும் தமிழில் உயிரைத் தன்னார்வமாக ஒப்புக்கொடுக்கும் கருத்தைத் தெளிவாகக் கூறுகிறது. வாக்கியங்களின் எதிர்மறை ஒப்பீடு, மீள்வருகை, தந்தை–மகன் உறவின் இறுக்கம் ஆகியவை காக்கப்பட்டுள்ளன.
