  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் பெரும்பாலும் பாதுகாக்கப்பட்டுள்ளன: தந்தை பரிசுத்தப்படுத்துதல், உலகத்திற்குள் அனுப்புதல், இறைநிந்தனைக் குற்றச்சாட்டு, மற்றும் ‘இறைவனின் மகன்’ என்ற கூற்று. ஆனால் தற்போதைய இரண்டு தனி வினாக்கள் அமைப்பு, இரண்டாவது ὅτι-யின் காரணத் தொடர்பைத் துண்டிக்கிறது. அதை ஒரே வினாவாக இணைப்பது மூல வாக்கியத்தின் தருக்கத் தொடர்பைத் தெளிவாகக் காக்கும்.'
