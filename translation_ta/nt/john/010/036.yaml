id: JHN.10.36
reference: John 10:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: ta
  text: தந்தை பரிசுத்தப்படுத்தி[a] உலகத்திற்குள் அனுப்பியவரிடம், ‘நான் இறைவனின் மகன்’ என்று நான் சொன்னதற்காக, ‘நீ இறைவனை நிந்திக்கிறாய்’ என்று நீங்கள் சொல்கிறீர்களா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்தப்படுத்தி” என்பதற்கு “அர்ப்பணித்து” அல்லது “தனியே பிரித்துவைத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: பரிசுத்தப்படுத்தி
  rationale: மூலச்சொல்லின் பரிசுத்தம், அர்ப்பணிப்பு, தனியே பிரித்துவைத்தல் ஆகிய பொருள் எல்லைகளைத் திறந்தவாறே வைத்திருக்கிறது. இச்சூழலில் பணிக்கென அர்ப்பணித்தார் அல்லது தனியே பிரித்துவைத்தார் என்ற நுணுக்கம் இருக்கலாம்; அதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பிய
  rationale: யோவான் நற்செய்தியில் காணப்படும் அனுப்புதல் சார்ந்த பணிமொழியை நேரடியாகப் பாதுகாக்கிறது; ‘பணியமர்த்திய’ என்பது தேவையற்ற விளக்கமாகிவிடும்.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குள்
  rationale: εἰς என்பதன் இயக்கத்தை வெளிப்படுத்துவதுடன், κόσμος என்பதற்கான யோவானிய ‘உலகம்’ என்ற வழக்கமான சொல்லையும் பாதுகாக்கிறது.
- source_word: Βλασφημεῖς
  choice: நீ இறைவனைப் பழித்துப் பேசுகிறாய்
  rationale: தமிழில் தனித்து வரும் ‘தூஷிக்கிறாய்’ என்பதைக் காட்டிலும் குற்றச்சாட்டின் இறைநிந்தனைப் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: இறைவனுடைய மகன்
  rationale: உடனடியான கிறிஸ்தியல் சூழலில் முக்கியமான உறவுமுறைப் பட்டப்பெயரின் வலிமையைப் பாதுகாக்கிறது; தமிழில் இயல்பான உடைமைத் தொடராக அமைகிறது.
- source_word: ὃν ὁ πατὴρ
  choice: தந்தை ... அனுப்பியவரைப் பார்த்து
  rationale: மூலத்தின் தொடர்புப்பெயர் அமைப்பை தமிழில் இயல்பாக மாற்றி, குறிக்கப்படுபவர் இயேசுவே என்பதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ὅτι ... ὅτι
  choice: … என்று … சொல்கிறீர்களா? … சொன்னதற்காகவா?
  rationale: முதல் ὅτι மேற்கோள் குற்றச்சாட்டை அறிமுகப்படுத்துவதையும், இரண்டாவது ὅτι அந்தக் குற்றச்சாட்டிற்கான காரணத்தைக் குறிப்பதையும் இயல்பான தமிழ் வினா அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மகனைப் பற்றிய ἡγίασεν என்பதன் பொருள்
  choice: பரிசுத்தப்படுத்தி
  alternative: அர்ப்பணித்து / தனியே பிரித்துவைத்து
  rationale: மூலத்தின் பரிசுத்தம் சார்ந்த சொல்லிணைப்பையும் அதன் இறையியல் அழுத்தத்தையும் பிரதான உரையில் பாதுகாக்கிறது. இது முன்னர் பரிசுத்தமற்ற நிலையிலிருந்து ஒழுக்கரீதியாக மேம்படுத்தப்பட்டார் என்று கட்டாயப்படுத்தாது; பணிக்கென அர்ப்பணித்தல் அல்லது பிரித்துவைத்தல் என்ற சூழல்சார் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: Υἱὸς τοῦ θεοῦ என்பதன் கிறிஸ்தியல் வலிமை
  choice: இறைவனுடைய மகன்
  alternative: இறைவனின் மகன்
  rationale: இறைநிந்தனைக் குற்றச்சாட்டும் இயேசுவின் பதிலும் அமைந்த உடனடிச் சூழலில் உள்ள முக்கிய உறவுமுறைப் பட்டப்பெயரைப் பாதுகாக்கிறது; பிற்காலக் கோட்பாட்டு விளக்கங்களை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’ என்பது யோவானிய உறவுமுறைப் பெயராகவும், ‘இறைவன்’ என்பது θεός என்பதற்கான இயல்பான உயர்நடைச் சொல்லாகவும் வழங்கப்பட்டுள்ளன. குற்றச்சாட்டை வாசிக்க எளிதாக்க இரண்டாவது ὅτι தனி வினாவாக அமைக்கப்பட்டுள்ளது; அதன் காரணவியல் தொடர்பு மாற்றப்படவில்லை. அடிக்குறிப்பு குறி பிரதான உரையில் [a] என இடம்பெற்றுள்ளது.
