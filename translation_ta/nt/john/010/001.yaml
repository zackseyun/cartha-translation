  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: ta
  text: '“உண்மையாகவே, உண்மையாகவே, நான் உங்களுக்குச் சொல்கிறேன்: ஆட்டுத் தொழுவத்தின்[a] வாசல்[b] வழியாக நுழையாமல், வேறோர் இடத்திலிருந்து ஏறி உள்ளே வருகிறவன், அவன் திருடனும் கொள்ளைக்காரனும் ஆவான்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆடுகளின் அடைப்பிடம்” அல்லது “ஆடுகளின் முற்றம்.” கிரேக்கச் சொல் சூழப்பட்ட முற்றத்தையோ தொழுவத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கதவு.” கிரேக்கச் சொல் சூழலுக்கேற்ப கதவு அல்லது வாசல் என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் “திருடன்” (κλέπτης), “கொள்ளைக்காரன்” (λῃστής) என்ற இரு வேறு சொற்கள் உள்ளன; இரண்டாவது சொல் பலவந்தமாகவோ வன்முறையோடோ கொள்ளையிடுகிறவனைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: இரட்டிக்கப்பட்ட வலியுறுத்தலையும் இயேசுவின் ஆணித்தரமான அறிமுகக் கூற்றையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடிப் பேச்சுச் சூத்திரத்தை தெளிவாகவும் மரியாதையான நடையிலும் வழங்குகிறது.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: நுழையாமல் ... வருகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ஒருமை ஆண்பால் வினையெச்சத்தின் பொதுவான குறிப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: διὰ τῆς θύρας
  choice: வாசல் வழியாக
  rationale: θύρα என்பதன் ‘கதவு/வாசல்’ பொருள்களில், கால்நடை அடைப்பிடச் சூழலுக்கு ‘வாசல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: ஆட்டுத் தொழுவத்தின் ... உள்ளே
  rationale: αὐλή குறிக்கும் சூழப்பட்ட ஆட்டு அடைப்பிடத்தை சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: வேறொரு பக்கமாக ஏறி உள்ளே வருகிறவன்
  rationale: ἀναβαίνων என்பதிலுள்ள ஏறுதல் படிமத்தையும் ἀλλαχόθεν என்பதிலுள்ள வேறு இடம் அல்லது பக்கம் என்ற கருத்தையும் காக்கிறது.
- source_word: ἐκεῖνος
  choice: அவன் (வாக்கியத்தில் எழுவாயாக உள்ள ‘வருகிறவன்’ மூலம் வெளிப்படுத்தப்பட்டது)
  rationale: தமிழில் தனியே சுட்டுப்பெயரை மீண்டும் இடாமல் அதே நபரைத் தொடர்வது இயல்பானது; கிரேக்கத்தின் அடையாளப்படுத்தும் வலிமை இறுதிப் பயனிலை மூலம் காக்கப்படுகிறது.
- source_word: κλέπτης
  choice: திருடன்
  rationale: மறைவாகத் திருடுகிறவனைக் குறிக்கும் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: λῃστής
  choice: வழிப்பறிக்காரன்
  rationale: κλέπτης என்பதிலிருந்து வேறுபட்டு, பலவந்தமாக அல்லது வன்முறையோடு கொள்ளையிடும் நபர் என்ற நுணுக்கத்தை அணுகத்தக்க தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: αὐλή/θύρα உருவகத்தின் பொருள்
  choice: ‘ஆட்டுத் தொழுவம்’ மற்றும் ‘வாசல்’ என்ற திடமான காட்சிப் படிமங்களாக மொழிபெயர்த்து, உருவக விளக்கத்தைச் சேர்க்கவில்லை.
  alternative: ‘ஆடுகளின் முற்றம்’ மற்றும் ‘கதவு’ என்று மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் உருவகத்தை அறிமுகப்படுத்துகிறது; அதன் பின்னணிப் பொருளை முன்கூட்டியே இயேசு, இரட்சிப்பு அல்லது தலைவர்கள் ஆகியோருடன் விளக்கி இணைக்காமல் மூலத்தின் படிமத்தைப் பாதுகாக்க வேண்டும்.
- issue: ஒருமை ஆண்பால் பெயர்ச்சொல் வினையெச்சம்
  choice: ‘வருகிறவன்’ என ஒருமை ஆண்பால் வடிவில் வழங்கப்பட்டது.
  alternative: பாலினம் குறிப்பிடாத ‘வருகிறவர்’ அல்லது ‘யார் ... வருகிறாரோ அவர்’ என்ற வடிவம்.
  rationale: கிரேக்கத்தின் ஒருமை ஆண்பால் இலக்கண வடிவையும் பிரதிநிதித்துவப் பொதுமையையும் தமிழில் வாசிக்கத்தக்க முறையில் காக்கிறது.
- issue: κλέπτης மற்றும் λῃστής இடையிலான வேறுபாடு
  choice: ‘திருடன்; வழிப்பறிக்காரனும்கூட’ என வேறுபடுத்தப்பட்டது.
  alternative: ‘திருடனும் கொள்ளைக்காரனுமாய் இருக்கிறான்.’
  rationale: இரு சொற்களையும் ஒன்றாக்காமல், இரண்டாவது சொல்லிலுள்ள பலவந்தமான கொள்ளை என்ற சாத்திய நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடிநடை பயன்படுத்தப்பட்டது. ‘உண்மையாகவே’ என்ற இரட்டிப்பு மூலத்தின் வலியுறுத்தலைக் காக்கிறது. மேய்ப்புச் சூழலுக்கேற்ற ‘வாசல்’ மற்றும் ‘ஆட்டுத் தொழுவம்’ தேர்ந்தெடுக்கப்பட்டுள்ளன; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
