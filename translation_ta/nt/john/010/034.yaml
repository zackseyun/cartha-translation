source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “உங்கள் சட்டத்தில் ‘நான் சொன்னேன்: நீங்கள் தேவர்கள்[a]’ என்று எழுதப்பட்டிருக்கவில்லையா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெய்வீக உயிரினங்கள்.” இயேசு சங்கீதம் 82:6-ஐ மேற்கோள் காட்டுகிறார். அங்குள்ள இந்தச் சொல்லின் பொருள் குறித்து விளக்கவுரைகளில் கருத்து வேறுபாடு உள்ளது; மேற்கோளின் நேரடிச் சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: அவர்களுக்குப் பதிலளித்தார்
  rationale: யோவானின் உரையாடல் நடையில் இயல்பாக அமையும் பதிலுரைக்கும் வினைச்சொல்; αὐτοῖς என்பதன் பன்மை மறைமுகச் செயப்படுபொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: எழுதப்பட்டிருக்கவில்லையா?
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடரின் நிறைவு நிலையையும் எதிர்மறைக் கேள்வி வடிவையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: உங்கள் சட்டத்தில்
  rationale: νόμος என்பதைக் ‘சட்டம்’ என்று நேரடியாக மொழிபெயர்க்கிறது. இங்கு மேற்கோள் சங்கீதத்திலிருந்து வந்தாலும், இயேசு ‘சட்டம்’ என்ற சொல்லை யூதர்களின் வேத எழுத்துகளைக் குறிக்கும் விரிவான பொருளில் பயன்படுத்துகிறார்.
- source_word: Ἐγὼ εἶπα
  choice: நான் சொன்னேன்
  rationale: வெளிப்படையாக உள்ள Ἐγὼ என்ற தன்மைப் பெயரையும் εἶπα என்ற இறந்தகால வினையையும் தேவையற்ற கூடுதல் வலியுறுத்தலின்றி நேரடியாகக் காட்டுகிறது.
- source_word: Θεοί
  choice: தெய்வங்கள்
  rationale: θεοί என்ற பன்மைப் பெயர்ச்சொல்லின் நேரடியான பொருளைப் பாதுகாத்து, சங்கீத மேற்கோளின் விவாதத்திற்குரிய பொருளை விளக்கவுரையால் முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἐστε
  choice: நீங்கள் … [ஆக இருக்கிறீர்கள்]
  rationale: தமிழ் பெயர்ப்பயனிலை வாக்கியத்தில் நிகழ்கால ‘இரு’ வினை இயல்பாக விடுபடுவதால், ‘நீங்கள் தெய்வங்கள்’ என்பது ἐστε என்பதைக் கூடுதல் ‘அழைக்கப்பட்டீர்கள்’ போன்ற விளக்கமின்றி துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதம் 82:6 மேற்கோளில் θεοί என்பதன் மொழிபெயர்ப்பு
  choice: தெய்வங்கள்
  alternative: தெய்வீகமானவர்கள்
  rationale: நேரடியான சொற்பொருள் இயேசுவின் வாதத்தின் சொல்லாட்சிச் செறிவையும் இறையியல் பதற்றத்தையும் காக்கிறது. அந்தச் சொல் யாரைக் குறிக்கிறது என்பதை முதன்மை உரையிலேயே தீர்மானிக்காமல், மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள் சட்டம்’ என்பது மூலத்தின் நேரடி வடிவைத் தக்கவைக்கிறது; ‘தெய்வங்கள்’ என்ற சொல் மென்மைப்படுத்தப்படாமல், அதன் உண்மையான தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
