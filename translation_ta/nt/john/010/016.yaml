source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: ta
  text: இந்தத் தொழுவத்தைச் சேர்ந்திராத வேறு ஆடுகளும் எனக்கு உண்டு. அவற்றையும் நான் கொண்டுவர வேண்டும்; அவை என் குரலுக்குச் செவிகொடுக்கும்.[a] அப்போது ஒரே மந்தையும் ஒரே மேய்ப்பரும் இருப்பார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை என் குரலைக் கேட்கும்.” கிரேக்க வினைச்சொல் ‘கேள்’ என்றும் ‘செவிகொடு’ என்றும் பொருள்படலாம்; இங்கு பதிலளிக்கும் விதத்தில் கேட்பது குறிக்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூலத்தில் ‘தொழுவம்’ (αὐλή)—ஆடுகள் அடைக்கப்படும் இடம்—என்பதும் ‘மந்தை’ (ποίμνη)—ஆடுகளின் கூட்டம்—என்பதும் வெவ்வேறு சொற்கள். ஆகவே இறுதியில் “ஒரே தொழுவம்” என்று அல்ல, “ஒரே மந்தை” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: வேறு ஆடுகள்
  rationale: πρόβατα என்பது பொதுவாக ஆடுகளைக் குறிக்கிறது; குறிப்பாக ஆட்டுக்குட்டிகளை அல்ல. ἄλλα, ஏற்கெனவே குறிப்பிடப்பட்ட ஆடுகளுக்கு மேலாக வேறு ஆடுகளும் இருப்பதைக் காட்டுகிறது.
- source_word: αὐλή
  choice: தொழுவம்
  rationale: மேய்ப்பர் உருவகச் சூழலில் αὐλή ஆடுகள் அடைக்கப்படும் பாதுகாப்பான இடத்தைக் குறிக்கிறது. நவீன தமிழில் ‘தொழுவம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κἀκεῖνα
  choice: அவற்றையும்
  rationale: இது முன் கூறப்பட்ட ‘வேறு ஆடுகளை’ மீண்டும் சுட்டுகிறது; ‘அவற்றையும்’ என்பது தமிழில் இயல்பாகவும் καί என்பதன் ‘கூட/உம்’ நுணுக்கத்தைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: δεῖ με ἀγαγεῖν
  choice: நான் கொண்டுவர வேண்டும்
  rationale: δεῖ தேவையையோ கட்டாயத்தையோ வலுவாகக் குறிக்கிறது; ‘வேண்டும்’ அதைத் தக்கவைக்கிறது. ἀγαγεῖν இச்சூழலில் ‘கொண்டுவருதல்’ அல்லது ‘வழிநடத்திக் கொண்டுவருதல்’ என்று பொருள்படலாம்; சுருக்கமான ‘கொண்டுவர’ மூலத்தின் பரப்பை அதிகமாகக் குறுக்கவில்லை.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: அவை என் குரலுக்குச் செவிகொடுக்கும்
  rationale: ἀκούω கேட்டலை மட்டுமல்ல, கவனித்து ஏற்றுக்கொள்ளும் கேட்டலையும் குறிக்கலாம். யோவானின் மேய்ப்பர் உருவகத்தில் ‘செவிகொடுக்கும்’ அந்தப் பதிலளிக்கும் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது; ‘என் குரலைக் கேட்கும்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: γενήσονται
  choice: அப்போது ... இருப்பார்கள்
  rationale: γενήσονται உருவாகும் விளைவு நிலையைச் சுட்டுகிறது. ‘அப்போது ... இருப்பார்கள்’ என்பது எதிர்கால விளைவைத் தெளிவாகத் தரும் இயல்பான தமிழ்; ‘ஆவார்கள்’ என்பது அதிக சொற்சார்ந்த மாற்று.
- source_word: μία ποίμνη
  choice: ஒரே மந்தை
  rationale: ποίμνη என்பது ஆடுகள் அடைக்கப்படும் இடத்தை அல்ல, ஆடுகளின் கூட்டத்தைச் சுட்டுகிறது. ‘மந்தை’ இந்த வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἷς ποιμήν
  choice: ஒரே மேய்ப்பர்
  rationale: ποιμήν என்பதன் நேரடியான பொருள் ‘மேய்ப்பர்’. ‘ஒரே’ என்பது εἷς வலியுறுத்தும் ஒன்றுமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: αὐλή மற்றும் ποίμνη ஆகியவற்றின் வேறுபாடு
  choice: இந்தத் தொழுவம் ... ஒரே மந்தை
  alternative: இந்த மந்தை ... ஒரே மந்தை / இந்தத் தொழுவம் ... ஒரே தொழுவம்
  rationale: கிரேக்கத்தில் αὐλή என்பது அடைப்பு இடம்; ποίμνη என்பது ஆடுகளின் கூட்டம். இரண்டையும் ஒரே சொல்லால் மொழிபெயர்ப்பது, ஒரே மேய்ப்பரின் கீழுள்ள ஒரே மந்தை என்ற மூல உருவகத்தை மங்கச் செய்யும்.
- issue: δεῖ என்பதன் வலிமை
  choice: நான் கொண்டுவர வேண்டும்
  alternative: நான் கொண்டுவர வேண்டியுள்ளது / நான் கொண்டுவருவது அவசியம்
  rationale: δεῖ வலுவான தேவையைக் குறிக்கிறது; யோவானில் அது இறைத் திட்டத்தோடு தொடர்புடைய நுணுக்கத்தையும் கொண்டிருக்கலாம். ‘வேண்டும்’ அந்த வலிமையைப் பாதுகாக்கிறது; ஆனால் அதன் காரணத்தை ஒரு குறிப்பிட்ட கோட்பாடாக விளக்கவில்லை.
- issue: ἀκούω என்பதில் கேட்பதா, செவிகொடுப்பதா
  choice: என் குரலுக்குச் செவிகொடுக்கும்
  alternative: என் குரலைக் கேட்கும்
  rationale: சூழல் பதிலளிக்கும் கேட்டலைச் சுட்டுவதால் ‘செவிகொடுக்கும்’ தேர்ந்தெடுக்கப்பட்டது. இருப்பினும் வினைச்சொல்லின் அடிப்படை ‘கேட்கும்’ பொருளும் உண்மையான சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொழுவம்’ மற்றும் ‘மந்தை’ என்ற வேறுபாடு திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது. ஆடுகளைச் சுட்டுவதால் ‘அவை’ பயன்படுத்தப்பட்டுள்ளது; மேய்ப்பரைச் சுட்டும் மரியாதைப் பன்மை காரணமாக இறுதி கூட்டு எழுவாய்க்கு ‘இருப்பார்கள்’ அமைக்கப்பட்டுள்ளது.
