source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: ta
  text: ஆனால் நீங்கள் என் ஆடுகளைச் சேர்ந்தவர்கள் அல்லாததால் நம்புவதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் நீங்கள் என் ஆடுகளைச் சேர்ந்தவர்கள் அல்ல என்று நம்புவதில்லை.” கிரேக்க இணைப்புச்சொல் காரணத்தைக் குறிப்பதற்குப் பதிலாக, நம்பப்படாத கருத்தை அறிமுகப்படுத்துவதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள முரண்பாட்டை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள, ஓரளவு வலியுறுத்தப்பட்ட பன்மை முன்னிலைப் பெயரைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: οὐ πιστεύετε
  choice: நம்புவதில்லை
  rationale: எதிர்மறை நிகழ்கால வினையை இயல்பாகத் தருகிறது; யோவான் நற்செய்தியின் சூழலில் ‘நம்புதல்’ பொருத்தமானது.
- source_word: ὅτι
  choice: அல்லாததால்
  rationale: முதன்மை வாசிப்பில் காரணப் பொருளை வெளிப்படுத்துகிறது; ‘என்று’ என்னும் உள்ளடக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐκ ἐστὲ ἐκ τῶν προβάτων τῶν ἐμῶν
  choice: நீங்கள் என் ஆடுகளைச் சேர்ந்தவர்கள் அல்ல
  rationale: ἐκ குறிக்கும் குழுச் சேர்ந்திருத்தலை இயல்பான தமிழில் ‘சேர்ந்தவர்கள்’ என்று தெரிவிக்கிறது; ‘என்’ என்பது உடைமையைச் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: ὅτι என்பது நம்பாமைக்கும் இயேசுவின் ஆடுகளைச் சேர்ந்திராமைக்கும் இடையே காரணத்தையா, கூறப்படும் கருத்தையா குறிக்கிறது?
  choice: 'காரண வாசிப்பு: ‘என் ஆடுகளைச் சேர்ந்தவர்கள் அல்லாததால்’'
  alternative: 'உள்ளடக்க வாசிப்பு: ‘நீங்கள் என் ஆடுகளைச் சேர்ந்தவர்கள் அல்ல என்று நம்புவதில்லை’'
  rationale: உடனடிச் சூழலில் இயேசுவின் ஆடுகள் அவரது குரலைக் கேட்பதற்கும் எதிர்ப்பாளர்கள் நம்பாதிருப்பதற்கும் உள்ள வேறுபாட்டை காரண வாசிப்பு நன்றாக இணைக்கிறது. இருப்பினும் கிரேக்க ὅτι உள்ளடக்கத்தையும் அறிமுகப்படுத்தக்கூடும்; ஆகவே இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘மந்தை’ என்று விரிவுபடுத்தாமல், மூலத்தில் உள்ள ‘ஆடுகள்’ என்ற உருவகத்தைப் பேணுகிறது; ‘சேர்ந்தவர்கள்’ என்பது ἐκ காட்டும் குழு உறுப்புரிமையைத் தெளிவாகத் தருகிறது.
