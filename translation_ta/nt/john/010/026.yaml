  source_fidelity: மூலக் கிரேக்கத்தின் எதிர்மறை முரண்பாடு (ἀλλά), வெளிப்படையான பன்மைச் சுட்டுப்பெயர், நிகழ்கால ‘நம்புவதில்லை,’ மற்றும் ‘என் ஆடுகளைச் சேர்ந்தவர்கள் அல்ல’ என்ற குழு-சேர்க்கைப் பொருள் ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ὅτι-யின் முதன்மையான காரணப் பொருளும் சரியாகத் தரப்பட்டுள்ளது.
  naturalness: ‘ஆனால் நீங்கள் என் ஆடுகளைச் சேர்ந்தவர்கள் அல்லாததால் நம்புவதில்லை’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. மூலத்தில் போலவே ‘நம்புதல்’ என்பதன் பொருள் சூழலால் நிரப்பப்படுமாறு விடப்பட்டுள்ளது.
  terminology: ‘என் ஆடுகள்,’ ‘சேர்ந்தவர்கள்,’ ‘நம்புவதில்லை’ ஆகிய சொற்கள் யோவான் 10-ன் உருவகத்திற்கும் கண்ணியமான நவீன நடைக்கும் பொருத்தமானவை. தேவையற்ற இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
