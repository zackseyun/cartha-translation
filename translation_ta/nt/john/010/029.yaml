id: JHN.10.29
reference: John 10:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: ta
  text: அவர்களை எனக்குத் தந்த என் தந்தை[a] அனைத்தையும்விடப் பெரியவர்; என் தந்தையின் கையிலிருந்து யாராலும் அவர்களைப் பறித்துக்கொள்ள முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “என் தந்தை, எனக்குத் தந்தது அனைத்தையும்விடப் பெரியது.” இங்குள்ள கிரேக்கச் சொல்லமைப்பு கடினமானது. சிலர், கொடுக்கப்பட்ட நபர்களுக்குப் பதிலாக, கொடுக்கப்பட்டதையே ஒப்பீட்டின் எழுவாயாகப் புரிந்துகொள்கிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: என் தந்தை
  rationale: இயேசுவுக்கும் கடவுளுக்கும் உள்ள மகன்–தந்தை உறவை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὃ δέδωκέν μοι
  choice: அவர்களை எனக்குத் தந்த
  rationale: ὃ என்பது நடுநிலை ஒருமை வடிவமாக இருந்தாலும், முந்தைய வசனங்களில் பேசப்படும் ஆட்களே இங்கு குறிக்கப்படுகின்றனர். தமிழில் தனிப்பட்ட சுட்டைத் தெளிவாக்க ‘அவர்களை’ பயன்படுத்தப்பட்டுள்ளது; δέδωκεν என்பதின் நிறைவுற்ற, தொடர்ந்து நிலைக்கும் விளைவை ‘தந்த’ இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் வேறு சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: πάντων μεῖζων
  choice: அனைத்தையும்விடப் பெரியவர்
  rationale: πάντων என்பதைக் குறிப்பாக மனிதர்களுக்கோ பொருட்களுக்கோ மட்டும் வரையறுக்காமல், பரந்த ஒப்பீட்டின் வலிமையைப் பாதுகாக்கிறது.
- source_word: οὐδεὶς δύναται
  choice: யாராலும் … முடியாது
  rationale: செய்யும் ஆற்றல் எவருக்கும் இல்லை என்ற δύναται-யின் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἁρπάζειν
  choice: பறித்துக்கொள்ள
  rationale: திடீரெனவும் வலுக்கட்டாயமாகவும் ஒருவரை பாதுகாப்பிலிருந்து அகற்றும் கருத்தை, முந்தைய வசனத்தின் சூழலோடு ஒத்தவாறு தெரிவிக்கிறது.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: தந்தையின் கையிலிருந்து
  rationale: ἐκ என்பதன் ‘உள்ளிருந்து/இடத்திலிருந்து அகற்றுதல்’ என்ற பொருளையும், பாதுகாப்பு மற்றும் அதிகாரத்தைக் குறிக்கும் ‘கை’ உருவகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ὃ δέδωκέν μοι என்பதிலுள்ள உரை மற்றும் வாக்கிய அமைப்புச் சிக்கல்
  choice: சூழலில் தந்தையால் மகனுக்குக் கொடுக்கப்பட்ட ஆட்களைக் குறிக்கும் வகையில் ‘அவர்களை எனக்குத் தந்த என் தந்தை’ என்று மொழிபெயர்த்தல்
  alternative: ‘என் தந்தை எனக்குத் தந்தது அனைத்தையும்விடப் பெரியது’
  rationale: அச்சிடப்பட்ட கிரேக்க வாசகம் இலக்கண ரீதியாகக் கடினமானது; கையெழுத்துப் பிரதிகளிலும் வேறுபாடுகள் உள்ளன. யோவான் 10:27–28-இன் ஆடுகள் குறித்த சூழல் மனிதர்களைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது. ஆயினும், கொடுக்கப்பட்ட ‘ஒன்றையே’ ஒப்பீட்டின் எழுவாயாகக் கொள்ளும் சாத்தியம் உண்மையானது; ஆகவே அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πάντων μεῖζων என்ற ஒப்பீட்டின் வரம்பு
  choice: ‘அனைத்தையும்விடப் பெரியவர்’ என்ற பரந்த சொல்லாட்சியைப் பயன்படுத்துதல்
  alternative: ‘எல்லா மனிதர்களையும்விடப் பெரியவர்’ அல்லது ‘எல்லாப் பொருட்களையும்விடப் பெரியவர்’
  rationale: πάντων மனிதர்களையோ பொருட்களையோ மட்டும் குறிக்கிறது என்று மூலவாசகம் கட்டாயப்படுத்தவில்லை. குறிப்பிட்ட ஒரு வரம்பைச் சேர்க்காமல் அதன் பரந்த, முழுமையான ஒப்பீட்டை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பறித்துக்கொள்ள’ என்பது வலுக்கட்டாயமாக அகற்றும் உருவகத்தை எளிதில் புரியும்படி தருகிறது. மூலத்தில் உள்ள உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
