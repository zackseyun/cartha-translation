- from: கடவுளுடைய வார்த்தை யாரிடம் வந்ததோ அவர்களை அவர் ‘கடவுள்கள்’ என்று அழைத்தாரென்றால்—வேதவாக்கியத்தைச் செல்லாததாக்க முடியாது—[a][b]
  to: கடவுளுடைய வார்த்தை யாரிடம் வந்ததோ, அவர்களைக் ‘கடவுள்கள்’ என்று அழைத்தார் என்றால்—வேதவாக்கியத்தை ரத்து செய்ய முடியாது—[a][b]
