    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: இயேசுவின் வாதத்தில் வரும் நிபந்தனை அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐκείνους
  choice: அவர்களை
  rationale: வேதவாக்கியத்தில் குறிப்பிடப்பட்டவர்களைச் சுட்டுகிறது; மூலத்தில் இல்லாத ‘மனிதர்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: εἶπεν
  choice: அழைத்தார்
  rationale: ‘கடவுள்கள் என்று சொன்னார்’ என்பதைக் காட்டிலும், ஒருவரை ஒரு பெயரால் குறிப்பிடும் இக்கட்டமைப்பின் பொருளை இயல்பாகத் தருகிறது.
- source_word: θεοὺς
  choice: ‘கடவுள்கள்’
  rationale: சங்கீதம் 82:6-ன் சொற்களை அப்படியே எதிரொலிக்கச் செய்து, ‘நீதிபதிகள்’ போன்ற விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் விடுகிறது.
- source_word: πρὸς οὓς
  choice: யாரிடம்
  rationale: வார்த்தை சில நபர்களை நோக்கி அல்லது அவர்களிடம் வந்தது என்ற திசை சார்ந்த பொருளைத் தருகிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தை
  rationale: இங்கு தனிப்பட்ட லோகோஸைக் குறிப்பதாகத் தீர்மானிக்காமல், கடவுளின் உரை அல்லது அறிவிப்பைக் குறிக்கும் தெளிவான நடை.
- source_word: ἐγένετο
  choice: வந்ததோ
  rationale: ‘வார்த்தை ஒருவரிடம் வந்தது’ என்ற இயல்பான தமிழ் வழக்கில் நிகழ்வுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: οὐ δύναται λυθῆναι
  choice: செல்லாததாக்க முடியாது
  rationale: λυθῆναι என்பதன் இச்சூழலிலான ரத்து செய்தல், ஒதுக்கிவைத்தல், அதிகாரத்தை நீக்குதல் ஆகிய கருத்துகளைத் தெளிவாகத் தருகிறது.
- source_word: ἡ γραφή
  choice: வேதவாக்கியம்
  rationale: அதிகாரப்பூர்வமான எழுதப்பட்ட வேத உரையை ஒருமையில் சுட்டுகிறது; நவீன தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘கடவுள்கள்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘கடவுள்கள்’ என்ற நேரடி சொல்லையே வைத்தல்
  alternative: ‘நீதிபதிகள்’ அல்லது ‘தெய்வீகமானவர்கள்’
  rationale: இயேசுவின் வாதம் சங்கீதம் 82:6-ன் சரியான சொல்லாட்சியைச் சார்ந்துள்ளது. குறிப்பிட்ட விளக்கத்தைத் தேர்ந்தெடுத்து இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ‘வேதவாக்கியத்தை அவிழ்க்க முடியாது’ என்பதன் வலிமை
  choice: ‘வேதவாக்கியத்தைச் செல்லாததாக்க முடியாது’
  alternative: ‘வேதவாக்கியத்தை முறிக்க முடியாது’ அல்லது ‘ஒதுக்கிவைக்க முடியாது’
  rationale: வேதவாக்கியத்தின் அதிகாரத்தை ரத்து செய்யவோ, அதன் கட்டுப்பாட்டை நீக்கவோ முடியாது என்ற சூழல்சார் பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் வேதவாக்கியத்துக்குரிய கண்ணியமும் கொண்ட நடை. மேற்கோள் சொல்லான ‘கடவுள்கள்’ விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டது; இடைச்செருகல் போன்ற இறுதிக் கூற்று கோடுகளால் காட்டப்பட்டது.
