translation:
  language: ta
  text: கடவுளுடைய வார்த்தை யாரிடம் வந்ததோ, அவர்களைக் ‘கடவுள்கள்’ என்று அழைத்தார் என்றால்—வேதவாக்கியத்தை ரத்து செய்ய முடியாது—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெய்வீகமானோர்.’ கிரேக்கத்தில் ‘கடவுள்கள்’ என்றே உள்ளது; இது சங்கீதம் 82:6-ஐ எதிரொலிக்கிறது. இங்கு குறிப்பிடப்படுபவர்கள் மனித நீதிபதிகள் என்று சிலர் புரிந்துகொள்கிறார்கள்.
