source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: ta
  text: இதனால்தான் தந்தை என்னை அன்புகூருகிறார்; ஏனெனில் நான் என் உயிரை[a] விட்டுக்கொடுக்கிறேன்—அதை மீண்டும் எடுத்துக்கொள்வதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆன்மாவை.” இங்கு ψυχή என்பது இயேசு மரணத்தில் விட்டுக்கொடுத்து பின்னர் மீண்டும் எடுத்துக்கொள்ளும் ‘உயிரை’ இயல்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முன்னும் பின்னும் உள்ள கருத்துகளோடு காரணத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘தான்’ காரணத்தை வலியுறுத்துகிறது.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: தந்தை என்னிடம் அன்புகூருகிறார்
  rationale: கிரேக்கத்தில் உள்ள ‘தந்தை’ என்ற குறிப்பிட்ட எழுவாயையும் ‘என்னை’ என்ற பொருளையும் பாதுகாக்கிறது; ‘என் தந்தை’ என்ற உடைமைப்பொருளைச் சேர்க்கவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: தந்தை அன்புகூருவதற்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாகத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τίθημι τὴν ψυχήν μου
  choice: நான் என் உயிரை விட்டுக்கொடுக்கிறேன்
  rationale: இச்சூழலில் இயேசு தம் உயிரைத் தாமாகவே மரணத்திற்கு ஒப்புக்கொடுப்பதை வெளிப்படுத்துகிறது. சொற்சொல்லான ‘வைக்கிறேன்’ தமிழில் இப்பொருளை இயல்பாகத் தராது.
- source_word: τὴν ψυχήν μου
  choice: என் உயிரை
  rationale: ψυχή இங்கு உடலிலிருந்து வேறான ‘ஆன்மா’ என்பதை முதன்மையாகக் குறிக்காமல், மரணத்தில் விடப்படும் உயிரைக் குறிக்கிறது.
- source_word: ἵνα
  choice: அதை … எடுத்துக்கொள்வதற்காக
  rationale: நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது; நோக்கமா விளைவா என்ற நுண்ணிய தொடர்பை தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: πάλιν λάβω αὐτήν
  choice: அதை மீண்டும் எடுத்துக்கொள்வதற்காக
  rationale: விடப்பட்ட அதே உயிரை மறுபடியும் எடுத்துக்கொள்ளுதல் என்ற தொடர்ச்சியைப் பாதுகாக்கிறது. ‘பெற்றுக்கொள்வது’ என்பதைக் காட்டிலும் λάβω என்பதன் செயற்பாட்டுத் தன்மையை இச்சூழலில் நன்றாகக் காட்டுகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் தன்னார்வ மரணத்தைச் சொல்லும் சூழலில் ψυχή என்பதன் பொருள்
  choice: ‘ஆன்மா’ என்பதற்குப் பதிலாக ‘உயிர்’
  alternative: என் ஆன்மா
  rationale: இவ்வசனம் இயேசு தம் உயிரை மரணத்தில் விட்டுக்கொடுத்து மீண்டும் எடுத்துக்கொள்வதைப் பற்றியது. ‘ஆன்மா’ என்பது வசனம் முன்னிறுத்தாத உடல்–ஆன்மா பிரிவைத் தவறாக உணர்த்தக்கூடும்.
- issue: ἵνα + λάβω என்பதன் நோக்க/விளைவு நுணுக்கம்
  choice: ‘அதை மீண்டும் எடுத்துக்கொள்வதற்காக’ என்று நோக்கத் தொடர்பைப் பாதுகாத்தல்
  alternative: அதை மீண்டும் எடுத்துக்கொள்வேன் என்பதால்
  rationale: கிரேக்க நோக்க வாக்கியத்தின் வலிமையை எதிர்கால உறுதிமொழியாக மட்டும் மாற்றாமல் வைத்திருக்கிறது; அதேவேளை உயிரை மீண்டும் எடுத்துக்கொள்ளும் செயலைத் தெளிவாகக் கூறுகிறது.
- issue: தந்தையின் அன்புக்கும் இயேசுவின் உயிரளிப்புக்கும் உள்ள காரணத் தொடர்பு
  choice: ‘இதனால்தான் … ஏனெனில்’ என்று காரணத் தொடர்பை வெளிப்படையாக வைத்தல்
  alternative: தந்தை என்னிடம் அன்புகூருவதாவது, நான்…
  rationale: ὅτι இங்கு உள்ளடக்கத்தைக் காட்டுவதைவிட காரணத்தை அறிமுகப்படுத்துகிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தை விளக்கிச் சமப்படுத்தாமல் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூருகிறார்’ யோவானின் உயர்ந்த நடைக்கு ஏற்றதாகவும் இன்னும் தெளிவாகவும் உள்ளது. நீண்ட காரண வாக்கியத்தை வாசிக்க எளிதாக்க அரைப்புள்ளியும் நோக்கக் கூற்றைத் தெளிவுபடுத்த நீள்கோடும் பயன்படுத்தப்பட்டுள்ளன.
