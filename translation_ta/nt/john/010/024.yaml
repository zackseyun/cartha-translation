language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: ta
  text: ஆகவே, யூதர்கள்[b] அவரைச் சூழ்ந்துகொண்டு, “இன்னும் எவ்வளவு காலம் எங்களைத் தவிப்பில் வைத்திருப்பீர்?[a] நீரே மெசியா என்றால், எங்களுக்குத் தெளிவாகச் சொல்லுங்கள்” என்று அவரிடம் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “எங்கள் உயிரை எவ்வளவு காலம் தூக்கிவைத்திருப்பீர்?” இது ஒருவரை நிச்சயமின்மையிலோ தவிப்பிலோ வைத்திருப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: யோவான் நற்செய்தியில் “யூதர்கள்” என்பது சில சூழல்களில் யூத மக்கள் அனைவரையும் அல்லாமல், யூதேய அதிகாரிகளையோ இயேசுவை எதிர்த்த குறிப்பிட்டவர்களையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: சூழ்ந்துகொண்டு
  rationale: சுற்றி நிற்றல் அல்லது சூழ்தல் என்ற நேரடியான பொருளையும், இச்சூழலில் உள்ள எதிர்கொள்ளும் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள கதைத் தொடர்பையும் விளைவுத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் வெளிப்படையான வடிவத்தைப் பாதுகாக்கிறது; இங்கே அது யூத மக்கள் அனைவரையும் குறிக்காமல் குறிப்பிட்ட எதிர்ப்பாளர்களைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத வினை வடிவம் காட்டும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சை வெளிப்படுத்துகிறது.
- source_word: Ἕως πότε
  choice: இன்னும் எவ்வளவு காலம்
  rationale: தமிழில் இயல்பாக ஒலிக்கும் காலவினாவாகவும், பேசுவோரின் பொறுமையின்மையை உணர்த்துவதாகவும் உள்ளது.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: எங்களை ஐயப்பாட்டில் வைத்திருப்பீர்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தெளிவில்லாத இந்த மரபுத்தொடரின் பொருளான நிச்சயமின்மை அல்லது எதிர்பார்ப்பில் வைத்திருத்தலை இயல்பான தமிழில் தருகிறது; நேரடியான உருவகம் குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கே இது தனிப்பெயரைப் போல அல்லாமல், யூத எதிர்பார்ப்பில் உள்ள அபிஷேகம் பெற்ற அரசர்-மீட்பர் பட்டமாகப் பயன்படுத்தப்படுகிறது.
- source_word: εἰπὲ ἡμῖν
  choice: எங்களுக்குத் சொல்லும்
  rationale: நேரடியான கட்டளையின் வலிமையை இயல்பான, மரியாதை ஒருமைத் தமிழில் தருகிறது.
- source_word: παρρησίᾳ
  choice: தெளிவாக
  rationale: இச்சூழலில் அவர்கள் கோருவது ஐயத்திற்கு இடமில்லாத வெளிப்படையான பதில்; ‘தெளிவாக’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: கேள்விக்குட்படுத்தப்படும் யூத அரசர்-மீட்பர் பட்டமாக இச்சொல் செயல்படுவதால், பட்டத்தின் பொருளையும் வரலாற்றுச் சூழலையும் ‘மெசியா’ தெளிவாகப் பாதுகாக்கிறது.
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: இந்த வசனம் தலைவர்கள் என்று வெளிப்படையாகக் குறுக்கவில்லை. ஆகவே மூலத்தின் பொதுவான சொற்றொடர் முதன்மை உரையில் வைக்கப்பட்டு, சூழலுக்கேற்ற குறுகிய குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவிடம் பேசும் இடத்தில் மரியாதை ஒருமையான ‘நீர்/சொல்லும்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான பேச்சு ἔλεγον என்பதற்காக ‘சொல்லிக்கொண்டிருந்தார்கள்’ வைக்கப்பட்டுள்ளது; மரபுத்தொடர் பொருள்வழியாக மொழிபெயர்க்கப்பட்டு அதன் நேரடி உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
