id: JHN.10.21
reference: John 10:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: ta
  text: மற்றவர்கள், “இந்த வார்த்தைகள் பேய் பிடித்த ஒருவருடையவை அல்ல. ஒரு பேய் பார்வையற்றவர்களின் கண்களைத் திறக்க முடியுமா?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: வேறு சிலர்
  rationale: முந்தைய வசனத்தில் பேசியவர்களிலிருந்து வேறுபட்ட மற்றொரு குழுவைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை கூட்டத்தில் தொடர்ந்து அல்லது மீண்டும் கூறப்பட்ட பேச்சைக் காட்டுகிறது.
- source_word: Ταῦτα τὰ ῥήματα
  choice: இந்த வார்த்தைகள்
  rationale: இயேசு பேசியவற்றை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: பேய் பிடித்தவனுடையவை அல்ல
  rationale: மூலத்தின் உடைமைவேற்றுமை அமைப்பையும், இவ்வார்த்தைகள் எத்தகைய பேச்சாளரிடமிருந்து வர முடியாது என்ற கருத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: μὴ ... δύναται
  choice: முடியுமா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவின் வலிமை தமிழில் சூழலாலும் வினாவடிவாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: δαιμόνιον
  choice: ஒரு பேய்
  rationale: கிரேக்கச் சொல்லை நேரடியாகத் தருகிறது; ‘தீய ஆவி’ என்ற விளக்கமான மாற்றத்தைத் தவிர்க்கிறது.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: பார்வையற்றவர்களின் கண்களை
  rationale: மூலத்தின் கண்களைத் திறக்கும் உருவகத்தைப் பாதுகாத்து, பிறவிக் குருடனுக்குக் கிடைத்த சுகத்தைச் சூழலில் நினைவூட்டுகிறது.
- source_word: ἀνοῖξαι
  choice: திறக்க
  rationale: கிரேக்க வினையின் நேரடியான பொருளையும் கண்கள் திறக்கப்படும் தெளிவான படிமத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: δαιμονίζομαι / δαιμόνιον என்பவற்றின் மொழிபெயர்ப்பு
  choice: பேய் பிடித்தவன் / ஒரு பேய்
  alternative: பேயின் ஆட்கொள்ளுதலுக்கு உள்ளானவன் / ஒரு தீய ஆவி
  rationale: வசனம் இயேசுவின் வார்த்தைகளும் செயலும் பேயின் செயலோடு பொருந்தாது என்ற மக்களின் வாதத்தை முன்வைக்கிறது. வழக்கமான தமிழ் சொல்லாட்சியைப் பயன்படுத்துகிறது; அதேவேளையில் ஆட்கொள்ளுதலின் முறை பற்றி மூலத்தைவிட அதிகமான கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: μή அறிமுகப்படுத்தும் எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினா
  choice: பார்வையற்றவர்களின் கண்களை ஒரு பேயால் திறக்க முடியுமா?
  alternative: ஒரு பேயால் பார்வையற்றவர்களின் கண்களைத் திறக்க முடியாது, அல்லவா?
  rationale: தமிழில் இயல்பான வினாவடிவம் சூழலில் ‘முடியாது’ என்ற எதிர்பார்க்கப்பட்ட பதிலைத் தெளிவாக உணர்த்துகிறது; மக்களின் தர்க்கத்தை மிகையாக விளக்காமல் காக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘குருடர்கள்’ என்பதற்குப் பதில் ‘பார்வையற்றவர்கள்’ என்பது இயல்பானதும் மரியாதையானதும்; ‘பேய் பிடித்தவன்’ என்பது வாசகர்களுக்கு உடனடியாகப் புரியும் வழக்கமான வேதாகமச் சொல்லாட்சி.
