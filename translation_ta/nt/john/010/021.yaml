revisions:
- from: வேறு சிலர், “இந்த வார்த்தைகள் பேய் பிடித்தவனுடையவை அல்ல. பார்வையற்றவர்களின் கண்களை ஒரு பேயால் திறக்க முடியுமா?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  to: மற்றவர்கள், “இந்த வார்த்தைகள் பேய் பிடித்த ஒருவருடையவை அல்ல. ஒரு பேய் பார்வையற்றவர்களின் கண்களைத் திறக்க முடியுமா?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  rationale: The revision preserves the imperfect sense of ἔλεγον, the rhetorical question that expects a negative answer, and the direct “open the eyes” imagery. It corrects the Tamil grammatical role of the demon from instrument to subject and removes the unsupported “some.”
