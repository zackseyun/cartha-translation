  source_fidelity: 'The Tamil accurately represents the Greek: பலர் renders πολλοί; அவரிடம் வந்து reflects ἦλθον πρὸς αὐτόν; சொல்லிக்கொண்டிருந்தார்கள் appropriately conveys the imperfect ἔλεγον; எந்த அடையாளத்தையும் செய்யவில்லை preserves the negated σημεῖον ἐποίησεν; and சொன்ன அனைத்தும் உண்மையாக இருந்தன fully reflects πάντα δὲ ὅσα … ἀληθῆ ἦν. இவரைக் குறித்து naturally retains the demonstrative force of περὶ τούτου without adding interpretive content.'
