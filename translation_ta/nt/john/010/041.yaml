id: JHN.10.41
reference: John 10:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: ta
  text: பலர் அவரிடம் வந்து, “யோவான் எந்த அடையாளத்தையும் செய்யவில்லை; ஆனால் இவரைக் குறித்து யோவான் சொன்ன அனைத்தும் உண்மையாக இருந்தன” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மை அடைமொழியை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἦλθον πρὸς αὐτόν
  choice: அவரிடம் வந்து
  rationale: πρός உடன் வரும் இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சு அம்சத்தைப் பாதுகாக்கிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: யோவான் நற்செய்தியில் அற்புதத்தை மட்டும் அல்லாமல் அதற்கு அப்பாற்பட்ட உண்மையைச் சுட்டும் கருப்பொருள் நிறைந்த சொல்லாக இருப்பதால் ‘அடையாளம்’ எனத் தரப்படுகிறது.
- source_word: ἐποίησεν οὐδέν
  choice: எந்த அடையாளத்தையும் செய்யவில்லை
  rationale: கிரேக்கத்தின் மறுப்புப் பொருளைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: πάντα δὲ ὅσα
  choice: ஆனால் ... சொன்ன அனைத்தும்
  rationale: கட்டமைப்பின் முழுமையான, விதிவிலக்கற்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: περὶ τούτου
  choice: இவரைக் குறித்து
  rationale: τούτου என்பதன் சுட்டுப்பெயர்த் தன்மையைப் பாதுகாத்து, இயேசுவைக் குறிக்கும் மரியாதையான மற்றும் இயல்பான தமிழை வழங்குகிறது.
- source_word: ἀληθῆ ἦν
  choice: உண்மையாக இருந்தன
  rationale: பன்மைப் பொருளான ‘அனைத்தும்’ என்பதுடன் இயல்பாக இசைந்து, பின்னர் நிரூபிக்கப்பட்டது போன்ற கூடுதல் கருத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் σημεῖον என்ற சொல்லின் கருப்பொருள் சார்ந்த பயன்பாடு
  choice: அடையாளம்
  alternative: அற்புதம்
  rationale: ‘அற்புதம்’ நிகழ்வின் வியப்பூட்டும் தன்மையை மட்டும் முன்னிறுத்தக்கூடும்; ‘அடையாளம்’ யோவானின் கருப்பொருள் சார்ந்த பயன்பாட்டையும் அது வேறொரு உண்மையைச் சுட்டும் தன்மையையும் பாதுகாக்கிறது.
- issue: περὶ τούτου என்பதிலுள்ள சுட்டுப்பெயரின் வலிமை
  choice: இவரைக் குறித்து
  alternative: அவரைக் குறித்து
  rationale: ‘இவர்’ கிரேக்கச் சுட்டுப்பெயரின் அருகாமை/சுட்டும் வலிமையை இயல்பான தமிழில் பாதுகாக்கிறது; ‘அவர்’ என்றும் பொருள் கொள்ள முடியும் என்றாலும் அது சுட்டுத்தன்மையைத் தளர்த்தும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடை. கிரேக்கத்தின் தொடர்ச்சிப் பேச்சு அம்சமும் யோவானுக்குரிய ‘அடையாளம்’ என்ற முக்கியச் சொல்லும் பாதுகாக்கப்பட்டுள்ளன.
