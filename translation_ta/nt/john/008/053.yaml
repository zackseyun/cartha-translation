source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: ta
  text: இறந்த எங்கள் தந்தை ஆபிரகாமைவிட நீ பெரியவன் அல்லவே?[a] தீர்க்கதரிசிகளும் இறந்தார்கள். உன்னை நீ யாராகக் காட்டிக்கொள்கிறாய்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: ‘எங்கள் தந்தை ஆபிரகாமைவிட நீ பெரியவன் அல்லவா...?’ கிரேக்கக் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கும் வகையில் அமைந்துள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீ யாரென்று உரிமைகோருகிறாய்?’ இச்சொற்றொடர் ஒருவர் தம்மை யாராகக் காட்டிக்கொள்கிறார் அல்லது கூறிக்கொள்கிறார் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: நீ ... அல்லவே?
  rationale: μή தொடங்கும் கேள்வி எதிர்மறையான பதிலை எதிர்பார்க்கிறது. ‘அல்லவே?’ என்பது அந்த எதிர்பார்ப்பையும் சவாலான தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μείζων
  choice: பெரியவன்
  rationale: ஒப்பீட்டு வடிவம் அந்தஸ்து, முக்கியத்துவம், மேன்மை ஆகியவற்றை உள்ளடக்கக்கூடும்; ‘பெரியவன்’ அந்த விரிவைத் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: எங்கள் தந்தை ஆபிரகாமைவிட
  rationale: ஒப்பீட்டுக்குப் பின்வரும் கிரேக்க வேற்றுமைத் தொடர்பை ‘-விட’ இயல்பாகத் தருகிறது; ‘எங்கள் தந்தை’ யூதர்களின் மூதாதை உரிமைக்கூற்றையும் மரியாதையையும் காக்கிறது.
- source_word: ὅστις ἀπέθανεν
  choice: இறந்துபோன
  rationale: ஆபிரகாம் இறந்தார் என்ற வரலாற்று உண்மையை நேரடியாகக் குறிக்கிறது; தமிழில் பெயருக்கு முன் வினையெச்சமாக அமைப்பது கேள்வியின் ஓட்டத்தை இயல்பாக்குகிறது.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: தீர்க்கதரிசிகளும் இறந்துபோனார்கள்
  rationale: 'καί தரும் இணைச் சான்றை ‘-உம்’ தெளிவாக வெளிப்படுத்துகிறது: ஆபிரகாம் இறந்ததுபோல தீர்க்கதரிசிகளும் இறந்தார்கள்.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: உன்னை நீ யாரென்று காட்டிக்கொள்கிறாய்?
  rationale: ஒருவர் தம்மை யாராக முன்வைக்கிறார் அல்லது உரிமைகோருகிறார் என்ற குற்றஞ்சாட்டும் இடியத்தை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ஆபிரகாமையும் தீர்க்கதரிசிகளையும் விட இயேசுவின் நிலை குறித்த சொல்லாளர்களின் சவால்
  choice: எதிர்மறைப் பதிலை எதிர்பார்க்கும் பகைமையான வினாவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எங்கள் தந்தை ஆபிரகாமைவிட நீ பெரியவனா?’ என்ற நடுநிலையாகத் தோன்றக்கூடிய கேள்வி.
  rationale: கிரேக்க μή எதிர்மறைப் பதிலை எதிர்பார்க்கிறது. இயேசுவின் அதிகாரமும் அடையாளமும் குறித்த பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது; அதற்கான இறையியல் விடையை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தீர்க்கதரிசிகள்’ மற்றும் ‘எங்கள் தந்தை ஆபிரகாம்’ ஆகியவை வேதாகமச் சூழலின் பரிச்சயமான சொற்களாகத் தக்கவைக்கப்பட்டன; சொல்லாளர்களின் மோதல் தொனி மென்மையாக்கப்படவில்லை.
