id: JHN.8.51
reference: John 8:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ta
  text: '“உண்மையாகவே, உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: யாராவது என் வார்த்தையைக் கடைப்பிடித்தால், அவர் என்றென்றும் மரணத்தைக் காணவே மாட்டார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: இரட்டிப்பை அப்படியே காத்து, இயேசுவின் உரையின் உறுதியான வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν ἐμὸν λόγον
  choice: என் வார்த்தையை
  rationale: λόγος இங்கு இயேசுவின் போதனை அல்லது செய்தியைக் குறிக்கிறது; ஒருமையையும் பரந்த பொருளையும் காக்கும் வழக்கமான தமிழ் தெரிவு.
- source_word: τηρήσῃ
  choice: கடைப்பிடித்தால்
  rationale: வெறுமனே கேட்பது அல்லது நினைவில் வைப்பது அல்லாமல், சொல்லைப் பற்றிக்கொண்டு அதன்படி நடப்பதையும் குறிக்கிறது.
- source_word: θάνατον ... θεωρήσῃ
  choice: மரணத்தைக் காண ... மாட்டார்
  rationale: மூலத்தின் ‘மரணத்தைக் காணுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: என்றென்றும் ... காணவே மாட்டார்
  rationale: οὐ μή என்பதன் வலுவான மறுப்பையும் εἰς τὸν αἰῶνα என்பதன் கால நீட்சியையும் தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: விசுவாசி உடல் மரணத்தை அனுபவிப்பாரா அல்லது இறுதி மரணத்தை அனுபவிக்க மாட்டாரா என்பதன் பொருள்
  choice: ‘மரணத்தைக் காணவே மாட்டார்’ என்ற மூல உருவகத்தை விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘நித்திய மரணத்தை அனுபவிக்க மாட்டார்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனத்தின் திட்டமிட்ட பதற்றத்தையும் உடனடி சூழலில் எழும் தவறான புரிதலுக்கான வாய்ப்பையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நேரடி உரை. மூலத்தின் இரட்டிப்பு, நிபந்தனை அமைப்பு, வலுவான மறுப்பு, ‘மரணத்தைக் காணுதல்’ என்ற உருவகம் ஆகியவை காக்கப்பட்டுள்ளன.
