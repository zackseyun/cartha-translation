source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: ta
  text: நான் பேசும் விதத்தை நீங்கள் ஏன் புரிந்துகொள்வதில்லை?[a] என் வார்த்தையைக் கேட்க உங்களால் முடியாததால்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பேச்சை” அல்லது “என் மொழியை.” இங்குள்ள கிரேக்கச் சொல் இயேசு பேசும் முறையைக் குறிக்கலாம்; அடுத்த பகுதியில் வரும் “என் வார்த்தை” என்பதிலிருந்து இது வேறுபட்டது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் வார்த்தையை நீங்கள் கேட்க முடியாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: நான் பேசும் விதத்தை
  rationale: இச்சொல் பேச்சின் உள்ளடக்கத்தைவிட பேசும் முறை அல்லது பாங்கைக் குறிக்கலாம். அடுத்துள்ள λόγος என்பதிலிருந்து வேறுபாட்டைக் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: γινώσκετε
  choice: புரிந்துகொள்வதில்லை
  rationale: இச்சூழலில் இது வெறுமனே அறிதலை அல்ல, இயேசுவின் பேச்சைப் புரிந்துகொள்வதைக் குறிக்கிறது.
- source_word: ἀκούειν
  choice: கேட்க
  rationale: அடிப்படைப் பொருளான ‘கேட்க’ என்பதைக் காக்கிறது; ஏற்றுக்கொள்ளுதல் என்ற உட்கருத்தை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: λόγον
  choice: வார்த்தையை
  rationale: இது இயேசுவின் வார்த்தை அல்லது செய்தியைக் குறிக்கிறது. ‘வார்த்தை’ என்பது இயல்பாகவும் இறையியல் ஒலிநயத்துடனும் இருந்து, λαλιά உடனான வேறுபாட்டைக் காக்கிறது.
- source_word: οὐ δύνασθε
  choice: உங்களால் முடியாதது
  rationale: வெறும் விருப்பமின்மையைக் காட்டாமல், மூலத்தில் கூறப்படும் இயலாமையை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: காரணம்
  rationale: முந்தைய கேள்விக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பான காரணவாக்கியமாக அமைக்கப்பட்டது.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: நான் / என்
  rationale: தமிழின் இயல்புக்கேற்ப ‘நான் பேசும் விதம்’ என்றும் ‘என் வார்த்தை’ என்றும் உடைமைத் தொடர்பு வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘என் வார்த்தையைக் கேட்க உங்களால் முடியாது’ என்பதில் இயலாமையின் தன்மை
  choice: எந்தக் கோட்பாட்டு விளக்கத்தையும் சேர்க்காமல் இயலாமையை நேரடியாகக் கூறுதல்
  alternative: அதை ஒழுக்கரீதியான விருப்பமின்மை, நீதித்தீர்ப்பினால் ஏற்பட்ட கடினப்படுதல், அல்லது ஆவிக்குரிய இயலாமை என்று வெளிப்படையாக விளக்குதல்
  rationale: இவ்வசனம் இயலாமையைக் கூறுகிறது; ஆனால் அதன் முழு இறையியல் காரணத்தை இங்கே வரையறுக்கவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை. λαλιά மற்றும் λόγος இடையிலான வேறுபாட்டை ‘பேசும் விதம்’ / ‘வார்த்தை’ எனக் காக்கிறது. காரணவாக்கியம் தமிழில் இயல்பாக அமைய வாக்கிய இறுதியில் அமைக்கப்பட்டுள்ளது.
