  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: ta
  text: ஆகவே, அவர்மேல் எறிவதற்காக அவர்கள் கற்களை எடுத்தார்கள். ஆனால் இயேசு தம்மை மறைத்துக்கொண்டு, ஆலய வளாகத்தை விட்டு வெளியேறினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ἱερόν என்பது ஆலயத்தின் உட்புறத் திருத்தலத்தை மட்டும் அல்ல, அதன் முற்றங்களையும் பிற பகுதிகளையும் உள்ளடக்கிய ஆலய வளாகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: எடுத்தார்கள்
  rationale: αἴρω இச்சூழலில் தாக்குவதற்காகக் கற்களைக் கையில் எடுத்தலைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘எடுத்தார்கள்’ தெளிவாக உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றின் விளைவு அல்லது அதற்கான எதிர்வினை என்பதை உணர்த்தும் தர்க்கத் தொடர்பைப் பேணுகிறது.
- source_word: λίθους
  choice: கற்களை
  rationale: λίθος என்பதற்கான நேரடியான, இச்சூழலுக்கு ஏற்ற பொதுத் தமிழ்ச் சொல்; கல்லெறியும் வன்முறை நோக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: அவர்மேல் எறிவதற்காக
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ἐπί உடன் βάλλω என்பதன் தாக்குதல் சார்ந்த பொருளையும் பேணுகிறது.
- source_word: ἐκρύβη
  choice: மறைந்துகொண்டு
  rationale: வடிவில் செயல்பாட்டு எதிர்மறை வினையாக இருந்தாலும், இங்கு இயேசு தம்மை மறைத்துக்கொண்டார் என்ற இடைநிலைப் பொருளில் இயல்பாகப் புரிகிறது; வேறொருவர் அவரை மறைத்தார் என்ற கருத்தை உருவாக்காது.
- source_word: ἐξῆλθεν
  choice: வெளியே சென்றார்
  rationale: ἐξέρχομαι குறிக்கும் இடத்தைவிட்டு வெளியேறும் இயக்கத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: ஆலய வளாகத்தைவிட்டு
  rationale: ἱερόν என்பது உட்புறப் பரிசுத்த ஆலயக் கட்டிடத்தை மட்டும் அல்லாமல் ஆலயத்தின் விரிந்த வளாகத்தைக் குறிக்கிறது; ஆகவே மூலத்தின் இடவியல் துல்லியத்தை முதன்மை உரையிலேயே பேணுகிறது.
theological_decisions:
- issue: இயேசு தப்பிச் சென்ற விதம்
  choice: இயேசு மறைந்துகொண்டு ஆலய வளாகத்தைவிட்டு வெளியே சென்றார் என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: அவர் அற்புதமாக அவர்களது நடுவே கடந்தார் அல்லது கண்ணுக்குத் தெரியாமல் போனார் என்று சேர்த்துரைத்தல்.
  rationale: SBLGNT உரை இயேசு மறைந்து வெளியே சென்றார் என்று மட்டுமே கூறுகிறது. பிற்காலக் கையெழுத்துப் பிரதிகளில் காணப்படும் விரிவாக்கங்களையோ அற்புதம் குறித்த ஊகங்களையோ மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆகவே’ முந்தைய வசனத்துடனான காரண-விளைவுத் தொடர்பைத் தெளிவுபடுத்துகிறது. ἱερόν என்பதன் துல்லியமான பொருளுக்காக ‘ஆலய வளாகம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, விளக்கக் குறிப்பு இணைக்கப்பட்டுள்ளது.
