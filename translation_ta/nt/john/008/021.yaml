source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: ta
  text: 'ஆகவே அவர் மீண்டும் அவர்களிடம் கூறினார்: “நான் போகிறேன்; நீங்கள் என்னைத் தேடுவீர்கள்; உங்கள் பாவத்தில் இறப்பீர்கள்.[a] நான் போகும் இடத்திற்கு உங்களால் வர முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘பாவம்’ என்பது ஒருமையில் உள்ளது. இது தனித்தனி பாவச்செயல்களைவிடத் தொடரும் பாவநிலையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் கருத்துத் தொடர்பையும் விளைவையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் திரும்ப நடைபெறுவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὑπάγω
  choice: போய்விடுகிறேன்
  rationale: வெறும் இடமாற்றத்தைவிடப் பிரிந்து செல்வதன் நிழற்பொருளையும் நிகழ்கால உணர்வையும் காக்கிறது; தந்தையிடம் திரும்புவதை வெளிப்படையாகச் சேர்த்து மிகைவிளக்கம் அளிக்கவில்லை.
- source_word: ζητήσετέ με
  choice: நீங்கள் என்னைத் தேடுவீர்கள்
  rationale: ζητέω என்பதன் ஒருவரைத் தேடுதல் என்ற பொருளை இயல்பாக வழங்குவதோடு, யோவானில் இருக்கக்கூடிய ஆழமான ஆன்மீக நிழற்பொருளையும் திறந்தவாறு வைக்கிறது.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: உங்கள் பாவத்திலேயே
  rationale: மூலத்தின் ஒருமையான ‘பாவம்’ என்பதையும் ἐν என்பதன் நிலைசார் பொருளையும் காக்கிறது. ‘-லேயே’ என்பது அந்த நிலையில் இறப்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἀποθανεῖσθε
  choice: இறந்துபோவீர்கள்
  rationale: எதிர்கால வினையின் உறுதியை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: நான் போகும் இடத்திற்கு
  rationale: தமிழின் இயல்பான இலக்கணத்திற்கேற்ப இலக்கு வேற்றுமையைப் பயன்படுத்தி, இயேசு செல்லும் இடத்தைச் சுட்டுகிறது.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: உங்களால் வர முடியாது
  rationale: δύνασθε என்பதிலுள்ள இயலாமை அல்லது ஆற்றலின்மை சார்ந்த வலிமையை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἁμαρτίᾳ என்ற ஒருமையைப் பாதுகாப்பதா அல்லது தமிழில் பன்மையாக வழங்குவதா
  choice: முதன்மை உரையில் ‘உங்கள் பாவத்திலேயே’ என்று ஒருமையில் வழங்கப்பட்டது.
  alternative: ‘உங்கள் பாவங்களிலேயே’
  rationale: கிரேக்க மூலத்தில் பெயர்ச்சொல் ஒருமையில் உள்ளது. இது தனித்தனி பாவச்செயல்களின் பட்டியலைவிடத் தொடரும் பாவநிலையைக் குறிக்கக்கூடும்; அந்த விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தாமல் ஒருமையைப் பாதுகாக்கிறது.
- issue: ὑπάγω என்பதில் இயேசுவின் புறப்பாட்டின் பொருள்
  choice: ‘நான் போய்விடுகிறேன்’
  alternative: ‘நான் போகிறேன்’ அல்லது ‘நான் புறப்படுகிறேன்’
  rationale: யோவானில் இது இயேசுவின் மரணம், உயிர்த்தெழுதல், தந்தையிடம் திரும்புதல் ஆகியவற்றை நோக்கக்கூடும். ஆனால் இலக்கை வெளிப்படையாக விளக்காமல், பிரிந்து செல்லும் உடனடிப் பொருளையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: οὐ δύνασθε என்பதிலுள்ள இயலாமையின் தன்மை
  choice: ‘உங்களால் வர முடியாது’ என்று காரணத்தை விளக்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீங்கள் வரமாட்டீர்கள்’
  rationale: மூலம் விருப்பமின்மையை மட்டும் அல்ல, வர இயலாமையைச் சொல்கிறது. அந்த இயலாமை தற்காலிகமா, நெறிசார் நிலையாலா, இறுதி விலக்கலாலா என்பதை இவ்வசனம் தனியே விளக்காததால் மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘போய்விடுகிறேன்’, ‘தேடுவீர்கள்’, ‘உங்களால் வர முடியாது’ ஆகியவை இயல்பான பேச்சு-எழுத்துத் தமிழின் சமநிலையைப் பேணுகின்றன. ஒருமையான ‘பாவம்’ இயல்பாகத் தோன்ற ‘-த்திலேயே’ பயன்படுத்தப்பட்டுள்ளது.
