id: JHN.8.38
reference: John 8:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: ta
  text: நான் பிதாவுடன் கண்டவற்றைப் பேசுகிறேன்; நீங்களும், அப்படியானால், உங்கள் தந்தையிடமிருந்து கேட்டவற்றைச் செய்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“செய்கிறீர்கள்” என்பதற்குப் பதிலாக, கிரேக்க வடிவத்தை “செய்யுங்கள்” என்றும் புரிந்துகொள்ளலாம். மேலும் முறையான மொழிபெயர்ப்பு: “நான் பிதாவுடன் கண்டவற்றைப் பேசுகிறேன்; நீங்களும், ஆகவே, தந்தையிடமிருந்து கேட்டவற்றைச் செய்யுங்கள்.” கிரேக்கத்தில் இரண்டாவது இடத்தில் “உங்கள்” என்பது வெளிப்படையாக இல்லை; அந்தத் தந்தை யார் என்பதைப் பின்னுள்ள சூழல் தெளிவுபடுத்துகிறது (வச. 44).'
    reason: ποιεῖτε என்ற வடிவத்தின் அறிக்கை/கட்டளை இலக்கணத் தெளிவின்மையையும், இரண்டாவது “தந்தை” குறித்த மறைமுகத்தன்மையையும் குறிக்கிறது.
lexical_decisions:
- source_word: ἃ
  choice: கண்டவற்றை / கேட்டவற்றை
  rationale: நபுஞ்சகப் பன்மை உறவுப்பெயரைத் தமிழில் இயல்பான பொருள்-தொடராக வழங்குகிறது.
- source_word: ἑώρακα
  choice: கண்ட
  rationale: கடந்தகாலக் காட்சியின் தொடரும் பொருத்தத்தைச் சூழல் உணர்த்துவதால், இயல்பான தமிழ் வினையெச்சம் போதுமானது.
- source_word: παρὰ τῷ πατρὶ
  choice: பிதாவிடம்
  rationale: παρά + வேற்றுமை இங்கு பிதாவின் அருகாமை அல்லது முன்னிலையைக் குறிக்கிறது; ‘பிதாவிடமிருந்து’ என்ற மூலப்பொருளாக மட்டும் மாற்றப்படவில்லை.
- source_word: λαλῶ
  choice: பேசுகிறேன்
  rationale: நிகழ்காலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: οὖν
  choice: -உம்
  rationale: தமிழின் இணைப்பு விகுதி இங்குள்ள தொடர்பையும் ஒப்புமையையும் இயல்பாக வெளிப்படுத்துகிறது; கடுமையான காரணவிளைவைக் கட்டாயப்படுத்தவில்லை.
- source_word: ἠκούσατε
  choice: கேட்ட
  rationale: அவர்களின் தற்போதைய செயலுக்கு அடிப்படையான முந்தைய கேள்வியை இயல்பான தமிழில் தருகிறது.
- source_word: παρὰ τοῦ πατρὸς
  choice: உங்கள் தந்தையிடம்
  rationale: παρά + பிறப்புவேற்றுமை மூலத்தைச் சுட்டுகிறது. கிரேக்கத்தில் உடைமைப்பெயர் வெளிப்படையாக இல்லாவிட்டாலும், உரையாடலின் எதிர்மறை ஒப்புமை ‘உங்கள்’ என்பதை வலுவாக உணர்த்துகிறது.
- source_word: ποιεῖτε
  choice: செய்கிறீர்கள்
  rationale: நிகழ்கால வடிவத்தை அறிக்கை வாக்கியமாகப் பாதுகாக்கிறது; கட்டளையாக மாற்றவில்லை.
- source_word: πατήρ / πατρὸς
  choice: பிதா / தந்தை
  rationale: முதல் குறிப்பு இயேசுவுக்கும் தேவனுக்கும் உள்ள உறவைக் குறிக்க ‘பிதா’ என்றும், இரண்டாவது குறிப்பின் வேறுபாட்டை முன்கூட்டியே முழுமையாக விளக்காமல் ‘தந்தை’ என்றும் வழங்கப்படுகிறது.
theological_decisions:
- issue: இரண்டாவது ‘தந்தை’ யார் என்பதை இவ்வசனத்திலேயே வெளிப்படையாக அடையாளப்படுத்தலாமா
  choice: ‘உங்கள் தந்தை’ என்று மறைமுகத்தன்மையைப் பாதுகாத்தல்
  alternative: ‘பிசாசாகிய உங்கள் தந்தை’ அல்லது ‘அந்தத் தந்தை’
  rationale: வசனம் 44-ல் வரும் வெளிப்படையான அடையாளத்தை வசனம் 38-க்குள் முன்கூட்டியே கொண்டுவராமல், யோவானின் உரையாடல் முன்னேற்றத்தையும் இறையியல் நெருக்கடியையும் பாதுகாக்கிறது.
- issue: ποιεῖτε என்பது கட்டளையா அல்லது அறிக்கையா
  choice: ‘செய்கிறீர்கள்’ என்ற அறிக்கை
  alternative: ‘செய்யுங்கள்’ என்ற கட்டளை
  rationale: சூழலில் இயேசு தமது பிதாவுடன் தொடர்புடைய செயலை எதிரிகளின் தந்தையுடன் தொடர்புடைய செயலுக்கு எதிராக அமைக்கிறார்; நிகழ்கால அறிக்கை இந்த எதிர்மறை ஒப்புமைக்கு சிறப்பாகப் பொருந்துகிறது. எனினும் கிரேக்க வடிவம் எழுத்தில் கட்டளையாகவும் புரிந்துகொள்ளக்கூடியதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். ‘பிதா’ என்பது இயேசு தேவனைச் சுட்டும் முதல் குறிப்புக்கு மரபுவழி தெளிவைத் தருகிறது; ‘தந்தை’ என்பது இரண்டாவது குறிப்பின் சொல்லாடல் வேறுபாட்டையும் படிப்படியான வெளிப்பாட்டையும் காக்கிறது. வாக்கியம் மூலத்தின் இணையான அமைப்பை இயன்றவரை பேணுகிறது.
