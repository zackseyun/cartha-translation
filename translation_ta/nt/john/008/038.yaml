review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the twofold contrast and renders ποιεῖτε plausibly as a present indicative. However, “உங்கள் தந்தையிடம் கேட்டவற்றை” represents παρά with the dative (‘at/with your father’) rather than παρά with the genitive, which denotes source (‘from your father’). The first “பிதாவிடம்” is also needlessly ambiguous in Tamil for the intended ‘with the Father.’
  naturalness: The proposed revision uses clear, modern standard Tamil while retaining the compact parallelism of the Greek.
  terminology: “பிதா” for Jesus’ Father and “தந்தை” for the second, still-unidentified father appropriately preserves both reverent register and the discourse’s deliberate ambiguity. “உங்கள் தந்தையிடமிருந்து” accurately marks the latter as a source without identifying him prematurely.
  issues:
  - severity: medium
    issue: The second παρά phrase is rendered as “உங்கள் தந்தையிடம் கேட்டவற்றை.”
    rationale: παρὰ τοῦ πατρός uses παρά with the genitive and means ‘from [the] father.’ Tamil “-இடம் கேட்ட” normally means ‘heard at/from the presence of’ and does not reliably convey the required source relation. It should be “உங்கள் தந்தையிடமிருந்து கேட்டவற்றை.”
  - severity: low
    issue: “பிதாவிடம் கண்டவற்றை” is ambiguous for the first παρά phrase.
    rationale: The first phrase, παρὰ τῷ πατρί, uses the dative and conveys being with/in the presence of the Father. “பிதாவுடன்” expresses this more directly in modern Tamil.
  - severity: low
    issue: The footnote calls an expanded paraphrase ‘சொற்சொல்லாக’ and its alternative changes both verbal force and connective nuance.
    rationale: The note should distinguish the grammatical alternative (imperative) from a formal rendering, rather than characterize “ஆகவே ... அந்தத் தந்தையிடமிருந்து” as literal.
  revised_text: நான் பிதாவுடன் கண்டவற்றைப் பேசுகிறேன்; நீங்களும், அப்படியானால், உங்கள் தந்தையிடமிருந்து கேட்டவற்றைச் செய்கிறீர்கள்.[a]
