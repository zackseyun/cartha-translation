source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: ta
  text: நம்முடைய திருச்சட்டத்தில்[a] இப்படிப்பட்ட பெண்களைக் கல்லெறிந்து கொல்ல வேண்டும் என்று மோசே கட்டளையிட்டார். அப்படியானால், நீர் என்ன சொல்கிறீர்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் தொடர்ச்சி (யோவான் 7:53–8:11). யோவான் 7:53-இன் குறிப்பைக் காண்க.
    reason: textual_critical
lexical_decisions:
- source_word: τῷ νόμῳ ἡμῶν
  choice: நம்முடைய திருச்சட்டத்தில்
  rationale: νόμος இங்கு மோசேயின் சட்டத்தைக் குறிக்கிறது. சாதாரண ‘சட்டம்’ என்பதைக் காட்டிலும் ‘திருச்சட்டம்’ இந்த வேதாகமச் சூழலைத் தெளிவாகக் காட்டுகிறது; ἡμῶν என்பதற்கான ‘நம்முடைய’ என்பதும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τὰς τοιαύτας
  choice: இப்படிப்பட்ட பெண்களை
  rationale: பெண்பால் பன்மை வேற்றுமை வடிவம் சூழலில் விபசாரத்தில் பிடிபட்ட பெண்ணைப் போன்ற பெண்களைக் குறிக்கிறது. ‘இப்படிப்பட்டவர்கள்’ என்பதைவிட பாலினக் குறிப்பு இதில் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: λιθοβολεῖσθαι
  choice: கல்லெறிந்து கொல்ல வேண்டும்
  rationale: இது வெறுமனே கற்களை எறிவதை அல்ல, கல்லெறியும் மரண தண்டனையைக் குறிக்கிறது. இயல்பான தமிழில் தண்டனையின் உயிர்க்கொல்லும் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐνετείλατο
  choice: கட்டளையிட்டிருக்கிறார்
  rationale: மோசே வழங்கிய அதிகாரபூர்வமான கட்டளையை எடுத்துரைக்கிறது. இறந்தகால கிரேக்க வடிவத்தின் விளைவு தற்போதும் பொருந்துவதாகப் பேச்சாளர்கள் முன்வைப்பதைத் தமிழ் நிறைவுவினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σὺ οὖν τί λέγεις;
  choice: அப்படியானால், நீர் என்ன சொல்கிறீர்?
  rationale: οὖν-இன் முடிவுறுத்தும் தொடர்பை ‘அப்படியானால்’ இயல்பாகக் காட்டுகிறது. σὺ என்பதின் வலியுறுத்தல் மரியாதை ஒருமையான ‘நீர்’ மூலம் தெளிவாகத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: மோசேயின் சட்டம் துல்லியமாக என்ன கட்டளையிட்டது என்ற கேள்வி
  choice: பேச்சாளர்களின் கூற்றை அவர்கள் சொன்னபடியே மொழிபெயர்த்தல்
  alternative: உபாகமச் சட்டங்களுடன் ஒத்திசைக்க வசனத்துக்குள் விளக்கம் சேர்த்தல்
  rationale: இந்த வசனம் குற்றஞ்சாட்டுவோரின் கூற்றைப் பதிவு செய்கிறது; மொழிபெயர்ப்பு அதை உறுதிப்படுத்தவோ திருத்தவோ கூடாது. மூலத்தின் பதற்றமும் அடுத்த வசனத்தின் சூழலும் அப்படியே விடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நேரடியாக அழைக்கும் ஒருமைக்கு மரியாதை வடிவமான ‘நீர்/சொல்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது; தொடக்கத்தில் வைத்து தமிழ் வாசிப்பைத் தடுமாறச் செய்வது தவிர்க்கப்பட்டது.
