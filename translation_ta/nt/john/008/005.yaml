  to: நம்முடைய திருச்சட்டத்தில்[a] இப்படிப்பட்ட பெண்களைக் கல்லெறிந்து கொல்ல வேண்டும் என்று மோசே கட்டளையிட்டார். அப்படியானால், நீர் என்ன சொல்கிறீர்?
