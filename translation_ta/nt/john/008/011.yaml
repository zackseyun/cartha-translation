  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: ta
  text: அவள்[a], “ஒருவரும் இல்லை, ஆண்டவரே” என்றாள். இயேசு, “நானும் உன்னைக் குற்றவாளி எனத் தீர்ப்பிடவில்லை; போ, இனி பாவம் செய்யாதே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் (யோவான் 7:53–8:11) இறுதி வசனம் இது. யோவான் 7:53-இன் குறிப்பைக் காண்க.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: விளிவேற்றுமையில் வரும் இச்சொல் மரியாதையான அழைப்பாகவும் அதிகாரத்தை ஏற்றுக்கொள்ளும் அழைப்பாகவும் இருக்கலாம். இங்கு இயேசுவின் அதிகாரத்தைப் பிரதிபலிக்கும் மரபான, இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: κατακρίνω
  choice: தண்டனைத் தீர்ப்பளிக்கவில்லை
  rationale: சூழலில் கல்லெறிந்து கொல்லத் தீர்ப்பு கோரப்பட்டுள்ளதால், குற்றவாளி எனத் தீர்த்து தண்டனை விதிக்கும் நீதித்துறைப் பொருளை இது தெளிவாகக் காட்டுகிறது.
- source_word: μηκέτι ἁμάρτανε
  choice: இனி பாவம் செய்யாதே
  rationale: μηκέτι குறிக்கும் ‘இப்போதுமுதல் இனிமேல் வேண்டாம்’ என்ற காலப்பொருளையும், நிகழ்காலக் கட்டளையின் நேரடியான வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: πορεύου
  choice: நீ போ
  rationale: கிரேக்கக் கட்டளையின் எளிய, நேரடியான பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: κύριε என்பதன் அழைப்புப் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: ‘ஐயா’ என்பது மொழியியல் ரீதியாகச் சாத்தியமானாலும், மூலச்சொல்லிலுள்ள மரியாதை மற்றும் அதிகார அங்கீகாரம் ஆகிய இரண்டையும் திறந்தவையாக வைத்திருக்க ‘ஆண்டவரே’ பயன்படுத்தப்பட்டது; இதனால் அந்தப் பெண்ணின் முழுமையான கிறிஸ்தியல் புரிதல் தனியே நிர்ணயிக்கப்படவில்லை.
- issue: இயேசு கண்டனம் செய்யாததற்கும் பாவத்தை நிறுத்துமாறு கூறுவதற்கும் இடையிலான பதற்றம்
  choice: இரு கூற்றுகளும் நேரடியாகவும் சமநிலையுடனும் வைக்கப்பட்டன
  alternative: ‘மன்னிக்கிறேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: κατακρίνω என்பது இங்கு நேரடியாக ‘மன்னித்தல்’ என்று சொல்லவில்லை. தண்டனைத் தீர்ப்பளிக்காமையையும் இனி பாவம் செய்ய வேண்டாமென்ற கட்டளையையும் மூலத்தில் உள்ளபடியே அருகருகே வைத்துப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. உரையாடலின் நேரடித்தன்மை காக்கப்பட்டது; நீதித்துறைச் சூழலைத் தெளிவுபடுத்த ‘தண்டனைத் தீர்ப்பளிக்கவில்லை’ பயன்படுத்தப்பட்டது.
