id: JHN.8.42
reference: John 8:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “கடவுள் உங்கள் தந்தையாக இருந்திருந்தால், நீங்கள் என்னை அன்புகூர்ந்திருப்பீர்கள். ஏனெனில் நான் கடவுளிடமிருந்து புறப்பட்டு வந்து இங்கே இருக்கிறேன்.[a] ஏனெனில் நான் என் சொந்தமாக வரவில்லை; அவரே என்னை அனுப்பினார்.[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்நெருக்கமாக: “நான் கடவுளிடமிருந்து புறப்பட்டு வந்தேன்; இப்போது இங்கே இருக்கிறேன்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னிடமிருந்தே நான் வரவில்லை.” கிரேக்கத் தொடர் மூலத்தையோ சுய முனைப்பையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: கடவுள் உங்கள் தந்தையாக இருந்திருந்தால், நீங்கள் என்னிடம் அன்புகூர்ந்திருப்பீர்கள்
  rationale: இறந்தகால வினைகளுடன் ἄν சேர்ந்துள்ள இந்த நிபந்தனை உண்மைக்கு மாறான நிலையைச் சுட்டுகிறது; தமிழில் ‘இருந்திருந்தால் ... அன்புகூர்ந்திருப்பீர்கள்’ என்பது அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: கடவுள் உங்கள் தந்தை
  rationale: இங்கு கடவுளுக்கும் அவர்களுக்கும் உரிய உறவைக் குறிக்கும் தந்தை உருவகம் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἠγαπᾶτε
  choice: அன்புகூர்ந்திருப்பீர்கள்
  rationale: ἀγαπάω என்பதன் இயல்பான பொருளான ‘அன்புகூர்’ பாதுகாக்கப்பட்டு, உண்மைக்கு மாறான நிபந்தனைக்கேற்ற வினை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἐγὼ γὰρ
  choice: ஏனெனில் நான்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத்தை வழங்குகிறது; ‘ஏனெனில்’ அதன் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: நான் கடவுளிடமிருந்து புறப்பட்டு வந்து இங்கே இருக்கிறேன்
  rationale: ἐκ ... ἐξῆλθον என்பதிலுள்ள மூலத்தையும் புறப்படுதலையும், ἥκω என்பதிலுள்ள வந்து சேர்ந்ததன் தற்போதைய நிலையையும் இந்த மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: நான் என் சொந்தமாக வரவில்லை
  rationale: ἀπ’ ἐμαυτοῦ என்பது தன்னிலிருந்து வருதலையோ சுய முனைப்பையோ குறிக்கக்கூடும்; இயல்பான தமிழில் ‘என் சொந்தமாக’ என்பது சுய முனைப்பின்மையைத் தெரிவிக்கிறது, மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: அவரே என்னை அனுப்பினார்
  rationale: ἐκεῖνος என்பதன் வலியுறுத்தலை ‘அவரே’ காட்டுகிறது; ἀπέστειλεν என்பதன் அனுப்புதல்/பணி மொழி நேரடியாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசு கடவுளிடமிருந்து வந்ததைப் பிற்காலத் தொழில்நுட்ப இறையியல் சொற்களால் மிகையாக வரையறுக்காமல் மொழிபெயர்த்தல்
  choice: கடவுளிடமிருந்து புறப்பட்டு வந்து இங்கே இருக்கிறேன்
  alternative: கடவுளிடமிருந்து வெளிவந்து வந்திருக்கிறேன்
  rationale: வசனம் இயேசுவின் கடவுள் சார்ந்த மூலத்தையும் அனுப்பப்பட்ட பணியையும் உறுதிப்படுத்துகிறது; அதேவேளையில் கிரேக்கத்தின் சாதாரண வருகை வினைகளுக்கு அப்பாற்பட்ட பிற்கால கோட்பாட்டு சொல்லாட்சியை முதன்மை உரை திணிப்பதில்லை.
- issue: ἀπ’ ἐμαυτοῦ என்பதன் பொருள்
  choice: என் சொந்தமாக வரவில்லை
  alternative: என்னிடமிருந்தே நான் வரவில்லை
  rationale: இந்தத் தொடர் சுய முனைப்பையும் மூலத்தையும் இரண்டையும் உணர்த்தக்கூடும். இயல்பான தமிழுக்காக சுய முனைப்பு முதன்மை உரையில் தரப்பட்டு, மூலத்தை முன்னிறுத்தும் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அன்புகூர்ந்திருப்பீர்கள்’ உண்மைக்கு மாறான நிபந்தனையைத் தெளிவாக்குகிறது; ‘அவரே’ மூலத்திலுள்ள வலியுறுத்தலைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
