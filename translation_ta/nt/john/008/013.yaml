  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: ta
  text: ஆகவே பரிசேயர்கள் அவரிடம், “நீரே உம்மைக் குறித்து சாட்சி கூறுகிறீர்; உமது சாட்சி உண்மையல்ல[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது சாட்சி செல்லத்தக்கதல்ல.” கிரேக்கத்தில் “உண்மையல்ல” என்று உள்ளது; இச்சூழலில் அது சட்டப்படி செல்லத்தக்கதல்ல என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் இயேசு கூறியதற்குப் பரிசேயர்கள் தரும் எதிர்வினையையும் தர்க்கத் தொடர்ச்சியையும் குறிக்கிறது.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: பரிசேயர்கள் அவரிடம் ... என்றார்கள்
  rationale: தமிழின் இயல்பான நேர்கூற்று அமைப்பில் எழுவாயையும் உரையையும் வைத்து, αὐτῷ என்பதையும் ‘அவரிடம்’ என்று வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: Σὺ ... σεαυτοῦ
  choice: நீர் உம்மைக் குறித்து நீரே
  rationale: Σὺ மற்றும் reflexive வடிவத்தின் வலியுறுத்தலை ‘நீரே’ என்பதன் மூலம் இயல்பாக வெளிப்படுத்துகிறது; மரியாதையான ஒருமையைப் பேணுகிறது.
- source_word: μαρτυρεῖς
  choice: சாட்சி கூறுகிறீர்
  rationale: நிகழ்காலச் செயலை இயல்பான நவீனத் தமிழில் தருவதோடு, உரையின் சான்றளிப்பு மற்றும் சட்டச்சார்ந்த நிழற்பொருளையும் பேணுகிறது.
- source_word: ἡ μαρτυρία σου
  choice: உமது சாட்சி
  rationale: μαρτυρεῖς என்பதுடன் சொற்பொருள் தொடர்பைப் பேணி, சான்று அல்லது சாட்சியத்தின் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: οὐκ ἔστιν ἀληθής
  choice: உண்மையானதல்ல
  rationale: ἀληθής என்பதன் நேரடியான பொருளைப் பேணுகிறது; இச்சூழலில் உள்ள ‘செல்லத்தக்கதல்ல’ என்ற சட்டச்சார்ந்த நுட்பத்துக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: தன்னைப்பற்றிய சாட்சிக்கு எதிரான பரிசேயர்களின் மறுப்பின் பொருள்
  choice: உமது சாட்சி உண்மையானதல்ல
  alternative: உமது சாட்சி செல்லத்தக்கதல்ல
  rationale: இங்கு சட்டச்சார்ந்த பின்னணி இருந்தாலும், ἀληθής என்பது வெறும் சட்டச் செல்லுபடியாக்கத்தைவிட விரிந்த சொல். ‘உண்மையானதல்ல’ என்பது உண்மை குறித்த குற்றச்சாட்டையும் சட்டச்சார்ந்த நிழற்பொருளையும் திறந்த நிலையில் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர், உம்மை, உமது’ பயன்படுத்தப்பட்டுள்ளன; சொற்சொல்லான விறைப்பைத் தவிர்த்து மூலத்தின் வலியுறுத்தலும் சாட்சிய மொழியும் பேணப்பட்டுள்ளன.
