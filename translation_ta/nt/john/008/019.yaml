id: JHN.8.19
reference: John 8:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: ta
  text: அதனால் அவர்கள் அவரிடம், “உங்கள் தந்தை எங்கே?” என்று கேட்டுக்கொண்டிருந்தார்கள். இயேசு அவர்களிடம், “நீங்கள் என்னையும் அறியவில்லை, என் தந்தையையும் அறியவில்லை. நீங்கள் என்னை அறிந்திருந்தால், என் தந்தையையும் அறிந்திருப்பீர்கள்” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால முற்றுப்பெறா வினை வடிவம், அவர்கள் அப்போது தொடர்ந்து அல்லது மீண்டும் கேட்டுக்கொண்டிருந்ததைச் சுட்டுகிறது. தமிழில் இந்தத் தொடர்நிலை வடிவம் அதைக் கட்டாயமான பலமுறை நிகழ்வாக மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய கூற்றிலிருந்து எழும் தொடர்ச்சி அல்லது விளைவை இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: உங்கள் தந்தை எங்கே?
  rationale: கேள்வியின் நேரடியான வடிவத்தைப் பாதுகாக்கிறது. தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால், தெய்வீகக் குறிப்பைச் சுட்ட தனியான எழுத்தாக்கம் செய்யப்படவில்லை; சூழலே பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: நீங்கள் என்னையும் அறியவில்லை, என் தந்தையையும் அறியவில்லை
  rationale: οὔτε...οὔτε என்பதன் இரட்டை மறுப்பை இயல்பான தமிழில் தெளிவாகக் காக்கிறது. ‘அறிதல்’ என்பது அறிவு, அடையாளங்காணுதல், உறவுசார் அறிதல் ஆகிய சாத்தியங்களைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: οἶδατε / ᾔδειτε
  choice: அறியவில்லை / அறிந்திருந்தால் / அறிந்திருப்பீர்கள்
  rationale: ஒரே கிரேக்க வேர்ச்சொல்லின் தொடர்ச்சியைத் தமிழிலும் ‘அறி’ என்ற ஒரே வினையால் பாதுகாக்கிறது; நிபந்தனைப் பகுதியில் உள்ள வடிவங்கள் நிகழ்நிலைக்கு மாறான கருத்தை இயல்பாகத் தெரிவிக்கின்றன.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: நீங்கள் என்னை அறிந்திருந்தால், என் தந்தையையும் அறிந்திருப்பீர்கள்
  rationale: இது நிகழ்நிலைக்கு மாறான நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; καί என்பதன் ‘-யும்’ பொருளையும் காக்கிறது.
theological_decisions:
- issue: ‘தந்தை’ என்பது கடவுளைக் குறிக்கிறதா என்பதை மொழிபெயர்ப்பில் வெளிப்படுத்துதல்
  choice: ‘என் தந்தை’ என்ற இயேசுவின் சொற்களையே வைத்தல்
  alternative: ‘கடவுளாகிய என் தந்தை’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: யோவான் நற்செய்தியின் சூழலில் குறிப்பு கடவுளை நோக்கியிருந்தாலும், கிரேக்க வசனத்தில் ‘கடவுள்’ என்ற விளக்கச்சொல் இல்லை. அதைச் சேர்க்காமல் இருப்பது உரையாடலில் உள்ள தவறான புரிதலையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: இயேசுவையும் தந்தையையும் ‘அறிதல்’ என்பதன் நுணுக்கம்
  choice: ‘அறி’ என்ற விரிந்த பொருளுள்ள சொல்லைப் பயன்படுத்துதல்
  alternative: ‘அடையாளம் காண்’ அல்லது ‘புரிந்துகொள்’
  rationale: ‘அறி’ என்பது வெறும் அறிவுசார் புரிதலாகவோ அடையாளம் காணுதலாகவோ கருத்தைக் குறுக்காமல், இயேசுவை அறிதலுக்கும் தந்தையை அறிதலுக்கும் இடையிலான யோவானியத் தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை இரண்டாம் நபர், இயல்பான தமிழ் மரியாதை வழக்கின்படி ‘உங்கள்’ என வழங்கப்பட்டுள்ளது; இயேசுவின் பதிலில் கூட்டத்தைக் குறிக்கும் ‘நீங்கள்’ தொடர்கிறது.
