id: JHN.8.29
reference: John 8:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: ta
  text: என்னை அனுப்பியவர் என்னுடன் இருக்கிறார். அவர் என்னைத் தனியே விட்டுவிடவில்லை; ஏனெனில் அவருக்குப் பிரியமானவற்றை நான் எப்போதும் செய்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: என்னை அனுப்பியவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புவினையை இயல்பான தமிழில் உறவுசார் தொடராக வழங்குகிறது; சூழலில் தந்தையைக் குறித்தாலும், மூலத்தில் இல்லாத ‘தந்தை’ என்பதைச் சேர்க்கவில்லை.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: என்னுடன் இருக்கிறார்
  rationale: μετά + genitive குறிக்கும் உடனிருப்பை இயல்பாகவும் நிகழ்காலத் தொடர்ச்சியுடனும் தெரிவிக்கிறது.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: அவர் என்னைத் தனியே விட்டுவிடவில்லை
  rationale: ἀφῆκεν என்பதன் இறந்தகால வடிவையும், μόνον என்பதன் ‘தனியே’ என்ற பயனையும் காக்கிறது. தமிழில் ‘விட்டுவிடவில்லை’ என்பது கைவிட்டு தனியாக இருக்கச் செய்யவில்லை என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் காரணப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: அவருக்குப் பிரியமானவற்றை
  rationale: நடுநிலைப் பன்மை பெயர்ச்சொல் தொடரான ‘அவருக்குப் பிரியமான காரியங்கள்’ என்ற வடிவைச் சுருக்கமாகவும் இயல்பாகவும் வழங்கி, மதிப்பீட்டுப் பொருளைக் காக்கிறது.
- source_word: ποιῶ πάντοτε
  choice: நான் எப்போதும் செய்கிறேன்
  rationale: நிகழ்கால வினையின் வழக்கமான/தொடர்ச்சியான செயற்பொருளையும் πάντοτε என்பதன் முழுமையான கால வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: ‘என்னை அனுப்பியவர்’ என்பவர் யார்?
  choice: மூலத்தின் உறவுசார் சொல்லாட்சியான ‘என்னை அனுப்பியவர்’ என்பதே வைக்கப்பட்டது.
  alternative: ‘என்னை அனுப்பிய பிதா’ அல்லது ‘தந்தை’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: யோவான் நற்செய்தியின் சூழலில் இது தந்தையைக் குறிக்கிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரை அவரை நேரடியாகப் பெயரிடாததால், மூலத்தின் யோவானிய சொல்லாட்சி பாதுகாக்கப்பட்டது.
- issue: ἀφῆκεν என்பதன் காலமும் தொடரும் விளைவும்
  choice: ‘விட்டுவிடவில்லை’ என்று இறந்த செயலும் தற்போதைய உடனிருப்பும் இயல்பாக உணரப்படும் தமிழாக்கம்.
  alternative: ‘என்னைத் தனியே விடவில்லை’ என்று எளிய வடிவில் வழங்குதல்.
  rationale: கிரேக்க இறந்தகாலத்தை அழிக்காமல், முதல் வாக்கியத்தில் கூறப்படும் தற்போதைய உடனிருப்புடன் அதன் தொடரும் விளைவைத் தமிழ் வடிவம் இணைக்கிறது.
- issue: ὅτι அறிமுகப்படுத்தும் காரணத் தொடர்பு
  choice: ‘ஏனெனில்’ என்று காரணமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என்று’ என உள்ளடக்கக் கூற்றாகப் புரிதல்.
  rationale: சூழலும் வாக்கிய அமைப்பும், தந்தை இயேசுவைத் தனியே விடாததற்கான காரணத்தை அடுத்த கூற்று தருகிறது என்பதற்கு ஆதரவாக உள்ளன; இருப்பினும் இது இயேசுவின் கீழ்ப்படிதலை ஒரு தனிமைப்படுத்தப்பட்ட சம்பாதிப்பு கோட்பாடாக விரிவாக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகப் புரியும், அதேவேளையில் கண்ணியமான நடை. ‘பிரியமானவற்றை’ என்பது சற்று இலக்கிய நயமுடையதாயினும் இயல்பாகவும் மூலத்தின் τὰ ἀρεστά என்ற பன்மைத் தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
