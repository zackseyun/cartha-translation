  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: ta
  text: எனவே, மகன் உங்களை விடுதலை செய்தால், நீங்கள் உண்மையிலேயே விடுதலையானவர்களாக இருப்பீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மையாகவே சுதந்திரமானவர்களாக இருப்பீர்கள்’ அல்லது ‘மெய்யாகவே விடுதலையானவர்களாக இருப்பீர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினையுரிச்சொல் இந்த விடுதலை உண்மையானது என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: எனவே, …ஆனால்
  rationale: οὖν முந்தைய வாதத்திலிருந்து வரும் முடிவைச் சுட்டுவதால் ‘எனவே’ என்றும், ἐὰν நிபந்தனையை அறிமுகப்படுத்துவதால் தமிழ் நிபந்தனை விகுதி ‘-ஆல்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: ὁ υἱὸς
  choice: மகன்
  rationale: யோவான் நற்செய்தியின் சூழலில் இது இயேசுவைக் குறிக்கும் தனிப்பட்ட கிறிஸ்துவியல் பட்டம். தமிழில் ‘மகன்’ இயல்பாகவும் நேரடியாகவும் இதைப் பாதுகாக்கிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: கிரேக்கச் சொல் இரண்டாம் நபர் பன்மை. மரியாதை அல்லது பன்மை இரண்டையும் இயல்பாகத் தாங்கும் ‘உங்களை’ தமிழ் சூழலுக்கு ஏற்றது.
- source_word: ἐλευθερώσῃ
  choice: விடுதலையாக்கினால்
  rationale: விடுவிக்கும் செயலைத் தெளிவாகக் காட்டி, ἐὰν உடன் வரும் நிபந்தனை அமைப்பையும் பாதுகாக்கிறது.
- source_word: ὄντως
  choice: உண்மையிலேயே
  rationale: அந்த விடுதலை மெய்யானது என்பதை வலியுறுத்தும் கிரேக்க வினையுரிச்சொல்லின் அழுத்தத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλεύθεροι ἔσεσθε
  choice: விடுதலை பெற்றவர்களாய் இருப்பீர்கள்
  rationale: ἐλεύθεροι என்பது செயலை மட்டும் அல்ல, அதன் விளைவான சுதந்திர நிலையைக் குறிக்கும் பெயரடை; ἔσεσθε எதிர்காலத்தைச் சுட்டுகிறது. தமிழ் சொற்றொடர் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மகன்’ என்பவரின் அடையாளம்
  choice: இயேசுவைத் தனித்துவமாகக் குறிக்கும் கிறிஸ்துவியல் பட்டமாக ‘மகன்’
  alternative: பொதுவான பொருளில் ஒரு மகன்
  rationale: யோவான் 8-ன் சூழலில் வீட்டில் நிலைத்திருக்கும் மகனின் அதிகாரத்தைத் தம்மோடு தொடர்புபடுத்தி இயேசு பேசுகிறார். ஆகவே பொதுவான அல்லது குறிப்பிடப்படாத ஒரு மகன் என்ற பொருள் இங்கு பொருந்தாது.
- issue: இங்கு கூறப்படும் விடுதலையின் இயல்பு
  choice: அரசியல், சமூக அல்லது உள்ளார்ந்த விடுதலை என்று குறுக்காமல், மெய்யான விடுதலை எனப் பரந்தவாறு வைத்தல்
  alternative: ஆவிக்குரிய விடுதலை மட்டும் அல்லது சமூக விடுதலை மட்டும் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: உடனடி சூழல் பாவத்திற்கு அடிமையாயிருப்பதைப் பற்றிப் பேசினாலும், இவ்வசனத்தின் முடிவு விடுதலையைப் பரந்த சொல்லால் அறிவிக்கிறது. மொழிபெயர்ப்பு அந்த இறையியல் நிறையைக் குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘எனவே’ முந்தைய உரையோடு உள்ள தர்க்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; ‘விடுதலையாக்கினால் … விடுதலை பெற்றவர்களாய்’ என்பது மூலத்தில் உள்ள ஒரே சொல்வேரின் தொடர்பை இயன்றவரை பாதுகாக்கிறது.
