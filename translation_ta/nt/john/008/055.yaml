source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: ta
  text: ஆனால் நீங்கள் அவரை அறிந்துகொள்ளவில்லை[a]; நானோ அவரை அறிவேன். நான் அவரை அறியவில்லை என்று சொன்னால்[b], உங்களைப் போல நானும் ஒரு பொய்யனாக இருப்பேன். ஆனால் நான் அவரை அறிவேன்; அவருடைய வார்த்தையைக் கடைப்பிடிக்கிறேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அவரை அறியவில்லை.” கிரேக்க வினைச்சொல் நிறைவுவினை வடிவில் உள்ளது; அது அவரை உண்மையாக அறியாத நிலை தொடர்ந்து இருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இந்த நிபந்தனை அனுமானமான ஒரு கூற்றைக் குறிக்கிறது: “நான் அவரை அறியவில்லை என்று சொல்ல நேர்ந்தால்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: c
    text: “கடைப்பிடிக்கிறேன்” என்பதை “கீழ்ப்படிகிறேன்,” “அனுசரிக்கிறேன்,” அல்லது “காத்துக்கொள்கிறேன்” என்றும் மொழிபெயர்க்கலாம். யோவானில் இவ்வினைச்சொல் கடவுளுடைய வார்த்தைக்கு உண்மையாக இருந்து அதைக் காத்துக் கடைப்பிடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: அறிந்துகொள்ளவில்லை
  rationale: இறந்தகால நிறைவுவினை வடிவம், இதுவரை அவரை உண்மையாக அறிந்துகொள்ளாததன் தொடரும் நிலையைச் சுட்டுகிறது. நவீன தமிழில் இயல்பாக இருக்கும்படி இந்தத் தெரிவு செய்யப்பட்டது.
- source_word: οἶδα
  choice: அறிந்திருக்கிறேன்
  rationale: வடிவத்தில் நிறைவுவினையாக இருந்தாலும் நிகழ்கால நிலையை, அதாவது ‘அறிவேன்/அறிந்திருக்கிறேன்’ என்ற பொருளைத் தருகிறது. ‘அறிந்திருக்கிறேன்’ என்பது எதிர்மறையான ἐγνώκατε உடனான வேறுபாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: κἂν εἴπω
  choice: நான் சொன்னால்
  rationale: இந்த நிபந்தனைக் கட்டமைப்பு ஓர் அனுமானமான கூற்றை முன்வைக்கிறது. தமிழில் ‘சொன்னால்’ இயல்பாகவே அந்த அனுமானப் பொருளை வெளிப்படுத்துகிறது; ‘ஒருவேளை’ போன்ற சேர்க்கை அவசியமில்லை.
- source_word: ἔσομαι
  choice: இருப்பேன்
  rationale: எதிர்கால வடிவம் நிபந்தனையின் விளைவைக் குறிக்கிறது; தமிழில் ‘சொன்னால் ... இருப்பேன்’ என்பது அதன் வடிவத்தையும் இயல்பான நிபந்தனைத் தொடர்பையும் காக்கிறது.
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: உங்களைப் போல நானும் ஒரு பொய்யனாக
  rationale: நேரடியான ஒப்பீட்டையும் எதிராளிகளை நோக்கிய கடுமையான மோதலையும் காக்கிறது. தமிழின் இயல்புக்காக ‘நானும்’ சேர்க்கப்பட்டுள்ளது; புதிய கருத்து எதுவும் சேர்க்கப்படவில்லை.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: அனுமானப் பொய்யுக்கும் இயேசு கூறும் உண்மை நிலைக்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: τὸν λόγον αὐτοῦ
  choice: அவருடைய வார்த்தை
  rationale: ‘வார்த்தை’ என்பது யோவானின் சொல்லாட்சியைப் பாதுகாத்து, கடவுளின் சொல் மற்றும் செய்தி ஆகிய இரு பொருள் நிழல்களுக்கும் இடமளிக்கிறது.
- source_word: τηρῶ
  choice: கடைப்பிடிக்கிறேன்
  rationale: τηρέω என்பதில் காத்தல், அனுசரித்தல், கீழ்ப்படிதல் ஆகிய பொருள் நிழல்கள் உள்ளன. ‘கடைப்பிடிக்கிறேன்’ என்பது தமிழில் இயல்பாகவும், வெறும் பாதுகாத்து வைத்தல் என்ற தவறான புரிதலைத் தவிர்த்தும், சொல்லுக்கு உண்மையாக வாழும் கருத்தைத் தருகிறது.
- source_word: καὶ ... δὲ
  choice: ஆனால் ... நானோ
  rationale: தொடக்கத்திலுள்ள எதிர்மறை ஓட்டத்தையும் இயேசுவுக்கும் எதிராளிகளுக்கும் இடையிலான வேறுபாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தம்மை எதிர்ப்பவர்களுக்கு மாறாக இயேசு கடவுளை உண்மையாக அறிந்திருப்பதாகக் கூறுதல்
  choice: அறிதலும் அவருடைய வார்த்தையைக் கடைப்பிடித்தலும் குறித்த கூற்றை அதன் நேரடியான, கூர்மையான வடிவில் மொழிபெயர்த்தல்
  alternative: தனித்துவமான தெய்வீக குமாரத்துவத்தை விளக்கும் சொற்களைச் சேர்த்தல், அல்லது ‘அறிதல்’ என்பதை வெறும் பரிச்சயமாக மென்மைப்படுத்தல்
  rationale: வசனமே இயேசுவுக்கும் அவரை எதிர்ப்பவர்களுக்கும் இடையே கடவுளை அறிதல் மற்றும் அவரது வார்த்தையைக் கடைப்பிடித்தல் குறித்த தெளிவான வேறுபாட்டை முன்வைக்கிறது. அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் அதன் வலிமையைக் குறைக்காமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நானோ’ மற்றும் ‘உங்களைப் போல நானும்’ ஆகியவை வசனத்தின் நேரடியான மோதலையும் ஒப்பீட்டையும் இயல்பான தமிழில் காக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
