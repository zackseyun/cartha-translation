id: JHN.8.40
reference: John 8:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ta
  text: ஆனால் இப்போதோ, கடவுளிடமிருந்து நான் கேட்ட உண்மையை உங்களுக்குச் சொல்லியிருக்கிற மனிதனாகிய என்னைக் கொல்ல நீங்கள் முயல்கிறீர்கள். ஆபிரகாம் இப்படிச் செய்யவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: νῦν என்பதன் காலக் குறிப்பையும் δέ என்பதன் எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: என்னைக் கொல்ல நீங்கள் முயல்கிறீர்கள்
  rationale: ζητέω + infinitive இங்கு ஒரு செயலைச் செய்ய நோக்கத்துடன் முயல்வதைக் குறிக்கிறது; நிகழ்காலத் தொடர்ச்சியும் காக்கப்படுகிறது.
- source_word: ἄνθρωπον
  choice: மனிதனாகிய என்னை
  rationale: இயேசு தம்மையே ஒரு மனிதன் என்று குறிப்பிடும் வெளிப்படையான பொருளைக் காக்கிறது; தமிழில் வாக்கியத்துடன் இயல்பாக இணைக்க ‘மனிதனாகிய என்னை’ பயன்படுத்தப்பட்டது.
- source_word: τὴν ἀλήθειαν
  choice: உண்மையை
  rationale: குறிப்பிட்ட செய்தியாகிய ‘உண்மை’ என்னும் யோவானிய வலியுறுத்தலைத் தெளிவாகக் காக்கிறது.
- source_word: ὑμῖν λελάληκα
  choice: உங்களுக்குச் சொல்லியிருக்கிற
  rationale: λελάληκα என்பதன் நிறைவேற்றப்பட்டும் தற்போதும் பொருத்தமுள்ள செயல்நிலையை ‘சொல்லியிருக்கிற’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து நான் கேட்ட
  rationale: παρά + genitive குறிக்கும் மூலத்தை ‘கடவுளிடமிருந்து’ எனத் துல்லியமாகக் காட்டுகிறது; ‘கேட்ட’ என்பது ἤκουσα என்பதன் நேரடிப் பொருளைக் காக்கிறது.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: ஆபிரகாம் இப்படிச் செய்யவில்லை
  rationale: ஆபிரகாமின் நடத்தையுடனான முரண்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது; τοῦτο குறிக்கும் முன்சொன்ன செயலை ‘இப்படி’ தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: ἄνθρωπον என்பதில் இயேசுவின் மனிதத் தன்மையை வெளிப்படுத்துதல்
  choice: மனிதனாகிய என்னை
  alternative: மனிதராகிய என்னை / ஒரு மனிதனான என்னை
  rationale: மூலத்தில் இயேசு தம்மை ἄνθρωπον என்று வெளிப்படையாகக் குறிப்பிடுவதை மறைக்காமல் காக்கிறது; அதேவேளையில் இவ்வசனம் கூறாத வேறு கிறிஸ்தியல் முடிவுகளைச் சேர்க்கவில்லை.
- issue: παρὰ τοῦ θεοῦ என்பதில் செய்தியின் மூலம்
  choice: கடவுளிடமிருந்து
  alternative: பிதாவிடமிருந்து
  rationale: மூல உரை τοῦ θεοῦ என்று கூறுவதால் ‘கடவுள்’ என்பதே மொழிபெயர்க்கப்படுகிறது; இவ்விடத்தில் இல்லாத ‘பிதா’ என்ற குறிப்பை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மதிப்புமிக்க தொனியிலும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட தொடர்பு இயன்றவரை ஒரே தமிழ் வாக்கியமாகக் காக்கப்பட்டாலும், தமிழின் இயல்பான சொல்வரிசை பின்பற்றப்பட்டது.
