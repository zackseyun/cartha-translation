  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: ta
  text: அவர்களோ[a] அதைக் கேட்டு, தங்கள் மனச்சாட்சியால் குற்றம் உணர்த்தப்பட்டு, மூத்தவர்களில் தொடங்கி கடைசியானவர்கள்வரை ஒவ்வொருவராக வெளியே சென்றார்கள். இயேசு மட்டும் விடப்பட்டார்; அந்தப் பெண் நடுவில் நின்றுகொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய பகுதியின் தொடர்ச்சி (யோவான் 7:53–8:11). யோவான் 7:53-ன் குறிப்பைக் காண்க.
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: மனச்சாட்சி
  rationale: நன்மை தீமையை உணர்ந்து ஒருவருக்குள் சாட்சி கூறும் ஒழுக்க உணர்வைக் குறிக்கும் இயல்பான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ἐλέγχω
  choice: குற்றம் உணர்த்தப்பட்டு
  rationale: மனச்சாட்சி அவர்களுடைய குற்றத்தை உள்ளார்ந்த விதத்தில் உணரச் செய்ததை வெளிப்படுத்துகிறது; வெளிப்புறக் கண்டிப்பாக மட்டும் பொருள் கொள்ளாமல் மூலத்தின் செயலற்ற வினை வடிவத்தையும் காக்கிறது.
- source_word: πρεσβύτερος
  choice: மூத்தவர்கள்
  rationale: இங்கு ஒரு பதவிப் பெயரைக் காட்டிலும் வயதிலும் முதிர்ச்சியிலும் மூத்தவர்களைச் சுட்டுவது சூழலுக்கு ஏற்றது.
- source_word: εἷς καθ' εἷς
  choice: ஒவ்வொருவராக
  rationale: ஒருவர் பின் ஒருவராகத் தனித்தனியே வெளியேறிய வரிசையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: நடுவில் நின்றுகொண்டிருந்தாள்
  rationale: பெண் தொடர்ந்து நடுவில் நின்றிருந்த நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι என்பதன் உள்ளார்ந்த ஒழுக்கத் தீர்ப்பு
  choice: தங்கள் மனச்சாட்சியால் குற்றம் உணர்த்தப்பட்டு
  alternative: தங்கள் மனச்சாட்சியால் கண்டிக்கப்பட்டு
  rationale: இந்த வாசகம் அவர்களுக்குள் ஏற்பட்ட குற்ற உணர்வை வலியுறுத்துகிறது; அதேவேளை இறுதி தெய்வீகத் தீர்ப்பைப் பற்றிய கூடுதல் விளக்கத்தை உரையில் சேர்க்கவில்லை.
- issue: πρεσβύτεροι என்பதன் பொருள்
  choice: மூத்தவர்கள்
  alternative: மூப்பர்கள்
  rationale: இளையோர் அல்லது வரிசையின் இறுதியில் இருந்தோருடன் காணப்படும் எதிரிணை வயது/முதிர்ச்சியைக் குறிப்பதாகத் தோன்றுகிறது; அதிகாரப்பூர்வ மதப் பதவியைத் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அவர்களோ’ என்பது முந்தைய வசனத்துடனான தொடர்ச்சியையும் எதிர்மாற்றத்தையும் காட்டுகிறது. ‘இயேசு மட்டும் அங்கே விடப்பட்டார்’ என்பது κατελείφθη μόνος என்பதன் செயலற்ற வடிவத்தைப் பேணுகிறது; ‘நடுவில்’ என்பது முந்தைய நிகழ்விடச் சூழலைத் தொடர்ந்து காட்டுகிறது.
