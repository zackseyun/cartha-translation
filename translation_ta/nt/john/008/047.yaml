source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: ta
  text: தேவனிடமிருந்து வந்தவர் தேவனுடைய வார்த்தைகளைக் கேட்கிறார்.[a] இந்தக் காரணத்தினால்தான் நீங்கள் கேட்பதில்லை; ஏனெனில் நீங்கள் தேவனிடமிருந்து வந்தவர்கள் அல்ல.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கேட்கிறார்’ என்பது இங்கு வெறும் ஒலியைக் கேட்பதை மட்டுமல்லாமல், ஏற்றுக்கொண்டு செவிசாய்ப்பதையும் உணர்த்தலாம்.
    reason: semantic_range
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘நீங்கள் தேவனிடமிருந்து வந்தவர்கள் அல்ல என்பதை நீங்கள் கேட்பதில்லை.’ கிரேக்க ὅτι என்பதற்கு ‘என்பதை’ என்றும் பொருள் கொள்ளலாம்; ஆனால் இச்சூழலில் ‘ஏனெனில்’ என்ற காரணப் பொருள் சிறப்பாகப் பொருந்துகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: வந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல் ஒரு வகை மனிதரைக் குறிக்கிறது. தமிழில் ‘தேவனிடமிருந்து வந்தவர்’ என்பது இயல்பாக இருந்து, மூலத்தையும் தோற்றத்தையும் குறிக்கும் ἐκ என்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ θεοῦ
  choice: தேவனிடமிருந்து வந்தவர் / வந்தவர்கள்
  rationale: ἐκ இங்கு உடைமையைவிட மூலம் அல்லது தோற்றத்தைச் சுட்டுகிறது. ‘தேவனிடமிருந்து’ அந்த உறவைத் தீர்மானிக்காமல் காக்கிறது.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: தேவனுடைய வார்த்தைகள்
  rationale: ῥήματα என்பதன் பன்மைத் தன்மையை ‘வார்த்தைகள்’ நேரடியாகக் காக்கிறது; τοῦ θεοῦ இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἀκούει / ἀκούετε
  choice: கேட்கிறார் / கேட்பதில்லை
  rationale: இரு இடங்களிலும் ‘கேள்’ என்ற ஒரே வினையைப் பயன்படுத்துவது கிரேக்கச் சொல் மறுபயன்பாட்டைக் காக்கிறது. சூழலில் ஏற்றுக்கொண்டு செவிசாய்த்தல் அடங்கினாலும், ‘கீழ்ப்படிதல்’ என்று விளக்கமாக்கப்படவில்லை.
- source_word: διὰ τοῦτο
  choice: அதனால்தான்
  rationale: காரணத்திலிருந்து வரும் முடிவை இயல்பான நவீன தமிழில் வலியுறுத்துகிறது.
- source_word: ὅτι
  choice: என்பதால்
  rationale: 'இங்கு காரணப் பொருள் சூழலுக்கு ஏற்றது: அவர்கள் தேவனிடமிருந்து வந்தவர்கள் அல்லாததால் கேட்பதில்லை. மாற்றாக அறிவிப்புப் பொருளும் இலக்கணரீதியாக சாத்தியம்; அது அடிக்குறிப்பில் தரப்படுகிறது.'
theological_decisions:
- issue: ‘தேவனிடமிருந்து’ என்பதன் யோவானியப் பொருள்
  choice: மூலம்/தோற்றத்தைக் குறிக்கும் மொழியை அப்படியே வைத்தல்
  alternative: தேவனுக்குச் சொந்தமானவர்; குறிப்பாக மறுபிறப்பு பெற்றவர்
  rationale: வசனம் குறிப்பிடாத தேர்ந்தெடுப்பு, மறுபிறப்பு அல்லது உடன்படிக்கை உறுப்பினர் போன்ற பிற்கால கோட்பாட்டு வகையைத் திணிக்காமல், யோவானின் மொழியையும் இறையியல் இழுபறியையும் காக்கிறது.
- issue: ἀκούω என்பதன் வலிமை
  choice: கேள்
  alternative: செவிசாய்; கீழ்ப்படி
  rationale: உண்மையாகக் கேட்பதில் ஏற்றுக்கொள்ளும் பதில் உட்பொருளாக இருக்கலாம்; எனினும் ‘கீழ்ப்படி’ என்பது மூல வினையை மொழிபெயர்ப்பதைவிட அதன் விளைவைக் குறிப்பதாகிவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. ஒருமை ‘வந்தவர்’ மற்றும் பன்மை ‘வந்தவர்கள்’ ஆகியவை கிரேக்க எண்ணிக்கையைப் பிரதிபலிக்கின்றன. இரண்டாம் வாக்கியம் தமிழில் இயல்பாக அமைய பொருள் மீளுரையாக ‘அவற்றைக்’ சேர்க்கப்பட்டது.
