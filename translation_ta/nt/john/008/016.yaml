source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: ta
  text: ஆனால் நான் தீர்ப்பளித்தாலும்[a], என் தீர்ப்பு உண்மையானது; ஏனெனில் நான் தனியாக இல்லை; நானும் என்னை அனுப்பிய தந்தையும் இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் தீர்ப்பளித்தால்” அல்லது “நான் தீர்ப்பளிக்க நேர்ந்தால்.” கிரேக்க நிபந்தனைத் தொடர் முறையாக இவ்வாறும் மொழிபெயர்க்கப்படலாம்; ஆனால் இங்கே அது “தீர்ப்பளித்தாலும்” என்ற சலுகைப் பொருளைக் கொண்டிருக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: நான் தீர்ப்பளித்தாலும்
  rationale: ἐὰν + நிகழ்காலத் துணைவினை வடிவம் ஒரு நிபந்தனைச் சாத்தியத்தைக் காட்டுகிறது; முந்தைய வசனத்தோடு உள்ள தொடர்பில் சலுகைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. முறையான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் மாறுபாட்டை அல்லது எதிர்மறைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: என் தீர்ப்பு
  rationale: உரிமையைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பாக வழங்குவதோடு, κρίσις என்பதன் நீதித்துறை சார்ந்த நுணுக்கத்தையும் காக்கிறது.
- source_word: ἀληθινή
  choice: உண்மையானது
  rationale: ‘உண்மையானது’, ‘நம்பத்தக்கது/செல்லத்தக்கது’ ஆகிய பொருள் வாய்ப்புகளில், யோவான் நூலுக்குரிய ‘உண்மை’ என்ற ஒலிப்பைத் தக்கவைத்து, உண்மைத்தன்மையையும் செல்லுபடித்தன்மையையும் உள்ளடக்க அனுமதிக்கிறது.
- source_word: μόνος οὐκ εἰμί
  choice: நான் தனியாக இல்லை
  rationale: இயேசுவின் தீர்ப்பு தனித்து நிற்பதல்ல என்ற உறவுசார் கருத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: நானும் என்னை அனுப்பிய தந்தையும் இருக்கிறோம்
  rationale: இயேசுவையும் அவரை அனுப்பிய தந்தையையும் ஒன்றாக முன்வைக்கும் கிரேக்க அமைப்பைத் தமிழில் முழுமையான, இயல்பான வாக்கியமாக வழங்குகிறது; ‘என்னை அனுப்பிய’ என்பது பங்கேற்புவினையின் அடையாளப்படுத்தும் பணியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் தீர்ப்புக்கும் தந்தையின் சாட்சிக்கும் உள்ள உறவு
  choice: இயேசுவின் தீர்ப்பு, அவரை அனுப்பிய தந்தையிலிருந்து தனிப்பட்டு வழங்கப்படாததால் உண்மையானது என்று வசனம் கூறுகிறது.
  alternative: இதை விரிந்த இறையியல் உட்பொருள் இல்லாத, சட்டரீதியான இரு சாட்சிகள் குறித்த கூற்றாக மட்டும் வாசிக்கலாம்.
  rationale: இயேசு தனியாக இல்லை என்பதையும் அவரை அனுப்பிய தந்தையையும் மூலவாக்கியம் நேரடியாக இணைக்கிறது. மொழிபெயர்ப்பு இதை பிற்காலக் கோட்பாட்டு விளக்கங்களால் விரிவுபடுத்தாமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தீர்ப்பளித்தல்’ என்பது நீதித்துறை நுணுக்கத்தைப் பாதுகாக்கிறது. இறுதியில் ‘இருக்கிறோம்’ சேர்க்கப்பட்டது தமிழில் வாக்கியத்தை இயல்பாக நிறைவு செய்ய; அது மூலத்தின் பொருளை விரிவுபடுத்தவில்லை.
