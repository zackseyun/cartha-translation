id: JHN.8.25
reference: John 8:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ta
  text: ஆகவே அவர்கள் அவரிடம், “நீர் யார்?” என்று கேட்டார்கள். இயேசு அவர்களிடம், “தொடக்கத்திலிருந்தே நான் உங்களிடம் சொல்லிவருவதுதான்.[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கிரேக்க வாக்கியத்தின் பொருள் உறுதியாக இல்லை. இதை, “நான் உங்களிடம் ஏன் பேசிக்கொண்டிருக்க வேண்டும்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: Τὴν ἀρχὴν மற்றும் ὅ τι ஆகியவற்றின் இணைப்பு பலவாறு புரிந்துகொள்ளப்படுவதால், மூலத்திலுள்ள உண்மையான இலக்கணப் பலபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἔλεγον
  choice: கேட்டார்கள்
  rationale: வடிவில் ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்ற இறந்தகாலத் தொடர்நிலை இருந்தாலும், நேரடிக் கேள்வியை அறிமுகப்படுத்தும் இயல்பான தமிழில் ‘கேட்டார்கள்’ என்பது கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: Σὺ τίς εἶ;
  choice: நீர் யார்?
  rationale: Σὺ வலியுறுத்தலைத் தமிழ் வாக்கியத்தின் நேரடி அமைப்பு இயல்பாகத் தாங்குகிறது; இயேசுவை நோக்கிய உரையாதலால் மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டது.
- source_word: Τὴν ἀρχὴν
  choice: தொடக்கத்திலிருந்தே
  rationale: இதை காலப்பொருளில் எடுத்துக்கொள்ளும் பழமையான, சூழலுக்குப் பொருந்தும் வாசிப்பைத் தருகிறது; ‘-ஏ’ தொடக்கத்திலிருந்து தொடர்ந்து கூறப்பட்ட அதே செய்தி என்பதைக் காட்டுகிறது.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: நான் உங்களிடம் சொல்லிவருவதுதான்
  rationale: இயேசுவின் பதிலில் உள்ள சுருக்கமான, சற்றே முற்றுப்பெறாத கிரேக்க அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அதுவே நான்’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் பதிலில் அவரது அடையாளம் வெளிப்படையாக நிறைவு செய்யப்படுகிறதா?
  choice: ‘சொல்லிவருவதுதான்’ என்று சுருக்கமான பதிலை வைத்திருக்கிறது.
  alternative: ‘நான் தொடக்கத்திலிருந்தே உங்களிடம் சொல்லிவருகிறவரே’ அல்லது ‘அதுவே நான்’ என்று நிறைவு செய்தல்.
  rationale: மூல கிரேக்கத்தில் அத்தகைய நிறைவு வெளிப்படையாக இல்லை. அதைச் சேர்ப்பது பொருளை விளக்கினாலும், உரையின் உண்மையான இலக்கண இறுக்கத்தையும் பலபொருள் வாய்ப்பையும் தேவையின்றித் தீர்த்துவிடும்.
- issue: Τὴν ἀρχὴν என்பதன் பலபொருள் வாய்ப்பு
  choice: முதன்மை உரையில் ‘தொடக்கத்திலிருந்தே’ என்ற காலப்பொருள்.
  alternative: ‘நான் உங்களிடம் ஏன் பேசவேண்டும்?’ அல்லது ‘நான் உங்களிடம் பேசுவதுதான் ஏன்?’ என்ற ‘எதற்கும்/முற்றிலும்’ சார்ந்த கேள்வி வாசிப்பு.
  rationale: சொற்றொடரின் இலக்கணம் கடினமானது; காலப்பொருள் சூழலுடனும் பாரம்பரியப் புரிதலுடனும் பொருந்துகிறது. எனினும் மற்றொரு முக்கியமான மூலமொழி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘நீர்’ உரையாடலின் கண்ணியத்தைப் பேணுகிறது; பதிலின் சுருக்கமும் மூலத்தின் இறுக்கமும் காக்கப்பட்டுள்ளன.
