source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் தொடர்ந்து சொன்னார்: “நீங்கள் கீழிருந்து வந்தவர்கள்; நான் மேலிருந்து வந்தவன். நீங்கள் இந்த உலகிலிருந்து வந்தவர்கள்[a]; நான் இந்த உலகிலிருந்து வந்தவன் அல்ல.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவான் நற்செய்தியில் “உலகம்” என்பது புவியைக் குறித்து மட்டும் அல்லாமல், பல இடங்களில் கடவுளிடமிருந்து விலகியிருக்கும் மனித ஒழுங்கையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து சொன்னார்
  rationale: இறந்தகாலத் தொடர்நிலை வினை வடிவத்தின் தொடர்ச்சியான அம்சத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலில் ஒரே கூற்றை மீண்டும் மீண்டும் சொன்னார் எனத் தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: Ὑμεῖς / ἐγὼ
  choice: நீங்கள் / நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள அழுத்தமுள்ள பதிலிப்பெயர்களைத் தக்கவைத்து, இயேசுவுக்கும் அவரைக் கேட்டவர்களுக்கும் இடையிலான முரண்பாட்டைக் கூர்மையாக்குகிறது.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: கீழிருந்து வந்தவர்கள் / மேலிருந்து வந்தவர்
  rationale: ἐκ குறிக்கும் தோற்றம் அல்லது மூலத்தைத் தமிழில் இயல்பாக வெளிப்படுத்தி, கீழ்–மேல் என்ற யோவானிய உருவக எதிர்மறையை விளக்கவுரை இன்றி தக்கவைக்கிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: κόσμος என்பதன் பரந்த பொருளையும் யோவான் நற்செய்தியில் அதற்குள்ள இறையியல் நுட்பத்தையும் தக்கவைக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: ἐκ τούτου τοῦ κόσμου / ἐκ τοῦ κόσμου τούτου
  choice: இந்த உலகத்தைச் சேர்ந்தவர்கள் / இந்த உலகத்தைச் சேர்ந்தவர் அல்ல
  rationale: தமிழில் ‘இந்த உலகிலிருந்து வந்தவர்கள்’ என்பது வெறும் புவியியல் பிறப்பிடமாகத் தவறாகப் புரியக்கூடும். ‘சேர்ந்தவர்’ என்பது ἐκ-இன் தோற்றம்/வட்டாரம் சார்ந்த கருத்தை இயல்பாகக் கூறுகிறது; சுட்டுப்பெயரான ‘இந்த’ இரு இடங்களிலும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: ‘கீழிருந்து/மேலிருந்து’ மற்றும் ‘இந்த உலகம்’ என்பவற்றின் முரண்பாடு
  choice: தோற்றம் மற்றும் சார்பு குறித்த உருவகத்தை ‘கீழிருந்து வந்தவர்கள் / மேலிருந்து வந்தவர்’ என்றும் ‘இந்த உலகத்தைச் சேர்ந்தவர்கள்’ என்றும் வைத்திருக்கிறது.
  alternative: இதை வெளிப்படையாக ‘பூமிக்குரியவர்கள் / பரலோகத்துக்குரியவர்’ அல்லது ஒழுக்கரீதியான நல்லவர்–தீயவர் முரண்பாடாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் செங்குத்தான இடவுருவகத்தையும் உலகத்துடனான உறவையும் முன்வைக்கிறது; அதன் கிறிஸ்துவியல் பதற்றத்தை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகச் சுருக்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மரியாதைப் பன்மை ‘அவர்கள்’ சூழலுக்கேற்ப பயன்படுத்தப்பட்டாலும், இயேசுவின் தனித்துவத்தைச் சொல்லும் பயனிலை ஒருமையில் வைக்கப்பட்டுள்ளது. ‘தொடர்ந்து சொன்னார்’ என்பது கிரேக்க இறந்தகாலத் தொடர்நிலையைச் சுமக்கிறது. ‘வந்தவர்கள்/வந்தவர்’ என்பது கீழ்–மேல் மூல உருவகத்தை இயல்பாக்குகிறது; ‘சேர்ந்தவர்’ உலகத்துடனான சார்பைக் காட்டுகிறது.
