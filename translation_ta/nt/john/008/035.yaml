id: JHN.8.35
reference: John 8:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: ta
  text: அடிமையோ வீட்டில் என்றென்றும் நிலைத்திருப்பதில்லை; மகனோ என்றென்றும் நிலைத்திருக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “மகன்” என்பது வீட்டிலுள்ள மகனைப் பற்றிய பொதுக்கூற்றாகவும், சுற்றியுள்ள உரையாடலின் பின்னணியில் இயேசுவை மறைமுகமாகச் சுட்டுவதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: அடிமை
  rationale: மகனுடன் ஒப்பிடப்படும் குடும்ப நிலையைச் சூழல் வலியுறுத்துவதால், பொதுவான ‘பணியாள்’ என்பதைவிட கட்டுப்பட்டதும் நிரந்தர உரிமையற்றதுமான நிலையைக் காட்டும் ‘அடிமை’ பொருத்தமானது.
- source_word: μένει
  choice: நிலைத்திரு
  rationale: இரண்டு இடங்களிலும் ஒரே வினைச்சொல்லைப் பயன்படுத்தி, வீட்டில் தொடர்ந்திருக்கும் நிலை மற்றும் நிரந்தரத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: οἰκία
  choice: வீடு
  rationale: தமிழில் ‘வீடு’ என்பது கட்டிடத்தை மட்டுமல்லாமல் அதனுடன் தொடர்புடைய குடும்பத்தையும் குடும்பச் சூழலையும் குறிக்கக்கூடும்; இங்கு அடிமை–மகன் என்ற குடும்ப நிலை வேறுபாட்டை இயல்பாகத் தாங்குகிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: முடிவில்லாத நிலைத்திருப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இரு கூறுகளிலும் மீண்டும் பயன்படுத்தப்பட்டு மூலத்தின் இணை அமைப்பு காக்கப்படுகிறது.
- source_word: υἱός
  choice: மகன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் இருப்பதையும், வீட்டில் அடிமைக்கும் மகனுக்கும் உள்ள நிலை வேறுபாட்டையும் நேரடியாகக் காக்கிறது.
- source_word: δὲ
  choice: –ஓ (அடிமையோ)
  rationale: தனியான காலச்சுட்டுச் சொல்லைச் சேர்க்காமல், தமிழின் எதிர்மறை ஒப்புமைப் பின்னொட்டான ‘–ஓ’ மூலம் உரையாடல் தொடர்ச்சியையும் அடிமை–மகன் வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மகன்’ என்பதன் கிறிஸ்துவியல் எதிரொலி
  choice: ‘மகன்’ என்பதைப் பொதுவான குடும்பச் சொல்லாகவே முதன்மை உரையில் வைத்திருக்கிறது; இயேசுவைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
  alternative: இதை நேரடியாக இயேசுவுக்கான பட்டமாக விளக்குதல்
  rationale: இந்த வசனத்தின் சொற்றொடர் அடிமை மற்றும் மகனின் குடும்ப நிலையைப் பற்றிய பொதுக்கூற்று போலச் செயல்படுகிறது; அதேவேளையில் அடுத்த வசனத்தில் இயேசு செய்யும் பயன்பாட்டை முன்னறிவிக்கிறது. ஆகவே இரு சாத்தியங்களுக்கிடையேயான பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ். ‘அடிமையோ … மகனோ’ என்ற இணை அமைப்பு மூலத்தின் கூர்மையான நிலை வேறுபாட்டையும், ‘நிலைத்திரு’ என்ற மறுபயன்பாடு அதன் சொல் மீளுருவாக்கத்தையும் காக்கின்றன.
