  source_fidelity: மூலத்தின் δοῦλος/υἱός நிலை-எதிர்மறை, οἰκίᾳ என்பதன் வீட்டுச் சூழல், μένει என்ற இருமுறை வரும் வினை, மற்றும் εἰς τὸν αἰῶνα என்ற நிரந்தரக் காலக் குறிப்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அடிமையோ … மகனோ’ என்ற அமைப்பு δέ-யின் இணை/முரண்பாட்டு ஓட்டத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: ‘அடிமையோ வீட்டில் என்றென்றும் நிலைத்திருப்பதில்லை; மகனோ என்றென்றும் நிலைத்திருக்கிறான்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதையான வேதாகமப் பதிவுக்கு ஏற்றதாகவும் உள்ளது. ‘நிலைத்திரு’ என்ற சொல் மீளுருவாக்கம் சற்றே முறையான நடையாயினும் இயல்பானது; மூலத்தில் உள்ள μένει-யின் மறுபயன்பாட்டையும் காக்கிறது.
