  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: ta
  text: என்னைப் பற்றி சாட்சி கூறுகிறவர் நானே; என்னை அனுப்பிய தந்தையும் என்னைப் பற்றி சாட்சி கூறுகிறார்.[a]
  philosophy: optimal-equivalence
