  naturalness: ‘என்னைப் பற்றி சாட்சி கூறுகிறவர் நானே; என்னை அனுப்பிய தந்தையும் என்னைப் பற்றி சாட்சி கூறுகிறார்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘நானே’ ἐγώ-வின் வலியுறுத்தலைச் செயற்கையில்லாமல் வெளிப்படுத்துகிறது.
  terminology: ‘சாட்சி கூறு’ இரு இடங்களிலும் தொடர்ச்சியாகப் பயன்படுவதால் யோவானின் சான்று/சாட்சிச் சொல்லாட்சித் தொடர்பு காக்கப்படுகிறது. ‘தந்தை’ என்பது இத்திட்டத்தின் நவீன, எளிதில் புரியக்கூடிய பதிவுக்கு ஏற்றது; தேவையற்ற இறையியல் விரிவாக்கம் இல்லை. அடிக்குறிப்பு ‘சாட்சி அளிக்கிறார்’ என்ற ஏற்றுக்கொள்ளத்தக்க சொற்தேர்வு மாற்றைக் குறிக்கிறது.
