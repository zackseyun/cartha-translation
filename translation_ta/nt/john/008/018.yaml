lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: சாட்சி கூறுகிறவர் நானே
  rationale: கட்டுரையுடன் வரும் நிகழ்காலப் பங்கேற்புவினை பெயர்ச்சொல் செயல்பாட்டில் இருப்பதை ‘சாட்சி கூறுகிறவர்’ எனக் காட்டுகிறது; ἐγώ என்பதன் வலியுறுத்தலை இயல்பான தமிழில் ‘நானே’ தக்கவைக்கிறது.
- source_word: περὶ ἐμαυτοῦ
  choice: என்னைப் பற்றி
  rationale: περί + பிறப்புவேற்றுமை இங்கு ‘பற்றி/குறித்து’ எனப் பொருள்படும்; தன் சார்பாக என்று சட்ட நுணுக்கத்தை மிகைப்படுத்தாமல், தற்சுட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαρτυρεῖ
  choice: சாட்சி கூறுகிறார்
  rationale: யோவானில் உள்ள சான்றளிக்கும் அல்லது நீதிமன்றச் சாயலைத் தக்கவைக்கும் தெளிவான நவீனத் தமிழ்; முதல் கூறிலுள்ள அதே வினையுடன் சொல் தொடர்பையும் காக்கிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைப் பற்றி
  rationale: ‘என்னைக் குறித்து’ என்பதும் சாத்தியம்; ‘என்னைப் பற்றி’ என்பது இயல்பான சமகாலத் தமிழ்.
- source_word: ὁ πέμψας με πατήρ
  choice: என்னை அனுப்பிய தந்தை
  rationale: கட்டுரையுடன் வரும் இறந்தகாலப் பங்கேற்புவினை πατήρ என்பதை வரையறுப்பதால், ‘என்னை அனுப்பிய தந்தை’ என உறவுநிலைத் தொடராக மொழிபெயர்க்கப்படுகிறது; மூலத்தில் இல்லாத ‘என்’ அல்லது ‘தேவனாகிய’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: யோவான் சூழலில் ‘தந்தை’ என்பவரின் குறிப்பு
  choice: ‘என்னை அனுப்பிய தந்தை’ என்று மட்டும் வழங்குதல்
  alternative: ‘என் தந்தை’ அல்லது ‘பிதாவாகிய தேவன்’
  rationale: கிரேக்கத்தில் ‘என்னை அனுப்பிய தந்தை’ என்றே உள்ளது. இயேசுவை அனுப்பியவராகிய தந்தை என்ற உறவையும் இறையியல் கூற்றையும் விரிவாக்கமின்றி காக்கிறது.
- issue: சாட்சி மொழியின் சட்ட/சான்றளிப்பு வலிமை
  choice: μαρτυρέω என்பதற்கு தொடர்ந்து ‘சாட்சி கூறு’ பயன்படுத்துதல்
  alternative: ‘சான்றளி’ அல்லது ‘சாட்சி பகர்’
  rationale: ‘சாட்சி கூறு’ சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் இருந்து, இரு சாட்சிகளைக் குறிக்கும் நீதிமன்றச் சாயலையும் மீளுரையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘பிதா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு வசன முடிவில் இடம்பெற்றுள்ளது.
