  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: ta
  text: அவர்கள் அவரிடம் தொடர்ந்து கேள்வி கேட்டுக்கொண்டிருந்தபோது,[a] அவர் நிமிர்ந்து அவர்களிடம், “உங்களில் பாவம் இல்லாதவர் முதலில் அவள்மேல் கல்லை எறியட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் விபச்சாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் ஒரு பகுதி (யோவான் 7:53–8:11). மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் இந்தப் பகுதி இல்லை. யோவான் 7:53-இன் குறிப்பைப் பார்க்கவும்.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: தொடர்ந்து கேள்வி கேட்டுக்கொண்டிருந்தபோது
  rationale: இறந்தகாலத் தொடர்நிலை வினையும் நிகழ்காலப் பெயரெச்சமும் இணைந்து, அவர்கள் விடாமல் தொடர்ந்து கேட்டுக்கொண்டிருந்த செயலைக் குறிக்கின்றன.
- source_word: ἀνακύψας
  choice: நிமிர்ந்து
  rationale: முந்தைய வசனத்தில் குனிந்து தரையில் எழுதிக்கொண்டிருந்த நிலையிலிருந்து இயேசு உடலை நிமிர்த்திய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀναμάρτητος
  choice: பாவம் இல்லாதவர்
  rationale: அரிதான இச்சொல்லின் ‘பாவமற்றவர்’ என்ற பொருளை எளிய, இயல்பான தமிழில் தருகிறது; சூழலிலுள்ள ஒழுக்க மற்றும் நீதிசார் வலிமையையும் தக்கவைக்கிறது.
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: முதலில் அவள்மேல் கல்லை எறியட்டும்
  rationale: கிரேக்கச் சொற்றொடரின் கட்டளையையும், கல்லெறிதலை முதலில் தொடங்குவதற்கான சவாலையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀναμάρτητος என்பதன் வரம்பு
  choice: ‘பாவம் இல்லாதவர்’ எனப் பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இந்தப் பாவத்தில் குற்றமில்லாதவர்’ அல்லது ‘அவளைக் குற்றஞ்சாட்டுவதற்கு தகுதியுள்ளவர்’
  rationale: கிரேக்கத்தில் குறிப்பிட்ட ஒரு பாவம் வெளிப்படையாக வரையறுக்கப்படவில்லை. ஆகவே அதன் பொருளை அந்தப் பெண்ணின் குற்றத்திற்கோ சட்டத் தகுதிக்கோ மட்டும் சுருக்காமல் மூலத்தின் பரந்த, பதற்றமுள்ள சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘விடாமல்’ என்பதைக் கூட்டாமல், தொடர்ச்சியை ‘தொடர்ந்து… கேட்டுக்கொண்டிருந்தபோது’ என்ற வினையமைப்பால் வெளிப்படுத்துகிறது. மேற்கோள் இயல்பான நேரடி உரையாக வைக்கப்பட்டுள்ளது.
