base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: ta
  text: அவர்கள்[a] அவரைச் சோதித்து, அவருக்கு எதிராகக் குற்றச்சாட்டு சுமத்துவதற்கான காரணம் அவர்களுக்குக் கிடைக்கும்படி இப்படிச் சொல்லிக்கொண்டிருந்தார்கள். ஆனால் இயேசு குனிந்து, தம் விரலால் தரையில் எழுதிக்கொண்டிருந்தார்; அவர்களைப் பொருட்படுத்தாதவர்போல் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது விபச்சாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் தொடர்ச்சி (யோவான் 7:53–8:11). யோவான் 7:53-ன் குறிப்பைப் பார்க்கவும்.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: சோதித்து
  rationale: இங்கு அவர்கள் இயேசுவின் பதிலைப் பயன்படுத்தி அவர்மீது குற்றஞ்சாட்ட முயல்வதால், ‘சோதித்து’ என்பது சொல்லின் பொருளையும் சூழலில் உள்ள தீய நோக்கத்தையும் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: κατηγορίαν
  choice: குற்றஞ்சாட்ட வழி
  rationale: குற்றச்சாட்டு அல்லது சட்டரீதியான குற்றம் சுமத்துவதற்கான அடிப்படையை அவர்கள் தேடினார்கள் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κάτω κύψας
  choice: குனிந்து
  rationale: இயேசு கீழ்நோக்கிக் குனிந்த உடல் நிலையைக் குறிக்கும் கிரேக்கப் பங்கேற்புவினையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔγραφεν
  choice: எழுதிக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்து நடந்த செயலைக் காட்டுவதால், தமிழில் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: μὴ προσποιούμενος
  choice: அவர்களைக் கவனிக்காதவர்போல்
  rationale: கவனிக்காதது அல்லது கேட்காதது போல நடந்துகொண்டார் என்ற பங்கேற்புவினையின் நுட்பத்தைப் பாதுகாக்கிறது; அவர் உண்மையில் கேட்கவில்லை என்று தீர்மானித்துவிடாது.
