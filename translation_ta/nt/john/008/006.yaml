  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்களைக் கவனிக்காதவர்போல்’ என்பது மூலத்தின் திட்டமிட்ட புறக்கணிப்பு நுட்பத்தைத் தக்கவைக்கிறது; ‘எழுதிக்கொண்டிருந்தார்’ என்பது கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியைக் காட்டுகிறது.
