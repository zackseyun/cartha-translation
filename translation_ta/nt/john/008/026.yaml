source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: ta
  text: உங்களைக் குறித்து சொல்வதற்கும் தீர்ப்பளிப்பதற்கும் என்னிடம் பல காரியங்கள் உள்ளன.[a] ஆனால் என்னை அனுப்பியவர் உண்மையானவர்; அவரிடமிருந்து நான் கேட்டவற்றை—அவற்றை உலகத்திற்குச் சொல்கிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைப் பற்றி.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவரிடமிருந்து நான் கேட்டவற்றை—அவற்றை உலகத்திற்குச் சொல்கிறேன்.” கிரேக்கத்தில் தொடர்புப்பெயர்ச் சொற்றொடருக்குப் பின் “அவற்றை” என்ற சுட்டுப்பெயர் வெளிப்படையாக மீண்டும் வந்து வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: பல காரியங்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: περί உடன் வரும் பிறப்புவேற்றுமையின் பொருள் தலைப்பு அல்லது தொடர்பு என்பதைக் காக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: λαλεῖν
  choice: சொல்வதற்கு
  rationale: κρίνειν என்பதுடன் இணைந்த முதலாம் வினையெச்சத்தில் இயல்பாக ஒலிக்கிறது; வாய்மொழியாக உரைப்பதன் பொருளையும் காக்கிறது.
- source_word: κρίνειν
  choice: தீர்ப்பளிப்பதற்கு
  rationale: கண்டனம் என்ற குறுகிய பொருளைத் திணிக்காமல், நீதித்தீர்ப்பு சார்ந்த κρίνω என்பதன் பரந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: ὁ πέμψας με
  choice: என்னை அனுப்பியவர்
  rationale: மூலத்திலுள்ள பெயர்ச்சொல் தன்மையுடைய பங்கேற்புவினையை இயல்பாக மொழிபெயர்த்து, பிதா என்ற சொல்லை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἀληθής
  choice: உண்மையானவர்
  rationale: உண்மை, நம்பகத்தன்மை ஆகிய இரு ஒலிப்புகளையும் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: அவரிடமிருந்து நான் கேட்டவை
  rationale: அனுப்பியவரிடமிருந்து பெற்ற செய்தியின் உள்ளடக்கத்தைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ταῦτα
  choice: அவற்றையே
  rationale: முந்தைய தொடர்புப்பெயர்ச் சொற்றொடரை மீண்டும் சுட்டும் ταῦτα என்பதன் வலியுறுத்தலை இயல்பான தமிழில் -ஏ மூலம் காக்கிறது.
- source_word: λαλῶ
  choice: சொல்கிறேன்
  rationale: நிகழ்காலப் பொது அறிவிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν κόσμον
  choice: உலகத்திற்குச்
  rationale: பேச்சு செலுத்தப்படும் திசை அல்லது கேட்போரைச் சுட்டும் εἰς என்பதற்கான இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: “என்னை அனுப்பியவர்” என்பதன் சுட்டுப்பொருள்
  choice: பிதா என்பதை வெளிப்படையாகச் சேர்க்காமல் மறைமுகக் குறிப்பை அப்படியே வைத்தல்
  alternative: என்னை அனுப்பிய பிதா உண்மையானவர்
  rationale: யோவான் நற்செய்தியின் சூழலில் சுட்டுப்பொருள் தெளிவாக இருந்தாலும், இவ்வசனத்தின் கிரேக்கம் ‘பிதா’ என்ற பெயர்ச்சொல்லைப் பயன்படுத்தவில்லை.
- issue: κρίνειν என்பதன் வலிமை
  choice: தீர்ப்பளிப்பதற்கு
  alternative: கண்டனம் செய்வதற்கு
  rationale: κρίνω என்பதன் பரந்த நீதித்தீர்ப்பு சார்ந்த பொருளைக் காக்கிறது; இங்கு அவசியமில்லாத ‘கண்டனம்’ என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணைந்த நடை. நீதித்தீர்ப்பு சார்ந்த தொனியைப் பேணியபடியே தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன; கிரேக்கத்தின் மீள்சுட்டும் வலியுறுத்தல் தமிழின் ‘-ஏ’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
