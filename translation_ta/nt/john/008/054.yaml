    issue: Unnecessary focus particle in அவரைத்தான்
    rationale: The Greek ὃν is simply the object of the relative clause ('whom'); தான் introduces an additional contrastive or exclusive emphasis.
  - severity: low
    issue: Footnote anchor is placed after the entire reporting clause
    rationale: The variant concerns ἡμῶν/ὑμῶν, rendered எங்கள்/உங்கள், so the marker should immediately follow எங்கள்.
  - severity: low
    issue: Opening reporting expression is awkward
    rationale: 'இயேசு மறுமொழியாக … என்றார் is understandable but less idiomatic than இயேசு பதிலளித்தார்: for ἀπεκρίθη.'
