  to: 'இயேசு பதிலளித்தார்: “நான் என்னையே மகிமைப்படுத்தினால், என் மகிமை ஒன்றுமில்லை. என்னை மகிமைப்படுத்துகிறவர் என் தந்தை; அவரை நீங்கள் ‘அவர் எங்கள்[a] கடவுள்’ என்று சொல்கிறீர்கள்.”'
