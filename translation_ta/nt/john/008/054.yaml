id: JHN.8.54
reference: John 8:54
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “நான் என்னையே மகிமைப்படுத்தினால், என் மகிமை ஒன்றுமில்லை. என்னை மகிமைப்படுத்துகிறவர் என் தந்தை; அவரை நீங்கள் ‘அவர் எங்கள்[a] கடவுள்’ என்று சொல்கிறீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “எங்கள்” என்பதற்குப் பதிலாக “உங்கள்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: மறுமொழியாக … என்றார்
  rationale: உரையாடலில் பதிலளிப்பதைக் குறிக்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் நடை.
- source_word: δοξάσω / δοξάζων
  choice: மகிமைப்படுத்தினால் / மகிமைப்படுத்துகிறவர்
  rationale: யோவான் நற்செய்தியில் தொடரும் ‘மகிமை’ கருப்பொருளையும் ஒரே கிரேக்க வேர்ச்சொல்லின் மீளுரைப்பையும் காக்கிறது.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: என் மகிமை ஒன்றுமில்லை
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான வலிமையைக் காத்து, தமிழிலும் இயல்பாக உள்ளது.
- source_word: ὁ πατήρ μου
  choice: என் தந்தை
  rationale: உறவுப்பெயரின் தனிப்பட்ட வலிமையை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὁ δοξάζων με
  choice: என்னை மகிமைப்படுத்துகிறவர்
  rationale: பெயர்ச்சொல் தன்மை கொண்ட நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான அல்லது பண்புரைக்கும் நயத்தைத் தக்கவைக்கிறது.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: அவரைத்தான் நீங்கள் ‘அவர் எங்கள் கடவுள்’ என்று சொல்கிறீர்கள்
  rationale: ὃν என்பதன் சுட்டுதலை ‘அவரைத்தான்’ மூலம் தெளிவாகக் காத்து, ὅτι உடன் வரும் கூற்றை இயல்பான தமிழ் நேர்கூற்றாக வழங்குகிறது.
- source_word: θεὸς
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளே குறிக்கப்படுவதால் நவீன பொதுத் தமிழில் பரவலாகப் புரியும் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: ἡμῶν
  choice: எங்கள்
  rationale: வழங்கப்பட்ட SBLGNT முதன்மை வாசகமான ἡμῶν என்பதைப் பின்பற்றுகிறது; ὑμῶν என்ற மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: θεὸς ἡμῶν/ὑμῶν ἐστιν என்பதில் உள்ள சுட்டுப்பெயர் வேறுபாடு
  choice: எங்கள் கடவுள்
  alternative: உங்கள் கடவுள்
  rationale: SBLGNT மூலப்பாடத்தில் ἡμῶν (‘எங்கள்/நமது’) உள்ளது. விவாதச் சூழலில் பொருள்சார் முக்கியத்துவமுள்ள ὑμῶν (‘உங்கள்’) என்ற கையெழுத்துப் பிரதி வேறுபாட்டை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மகிமை/மகிமைப்படுத்து’ என்ற சொல்லிணைப்பு யோவானின் கருப்பொருள் மற்றும் மூலத்தின் மீளுரைப்பைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய உரைமாற்றத்தின் உடனேயே வைக்கப்பட்டுள்ளது.
