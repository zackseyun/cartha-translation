id: JHN.8.22
reference: John 8:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: ta
  text: அதனால் யூதர்கள்[a], “அவன் தன்னையே கொன்றுகொள்வானோ? ‘நான் போகும் இடத்திற்கு நீங்கள் வர முடியாது’ என்று சொல்கிறானே!” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, யோவான் நற்செய்தியின் சூழலைப் பொறுத்து, “யூதேயர்கள்” அல்லது “யூதத் தலைவர்கள்.” இங்கு யோவான் யாரை எந்த அளவுக்குக் குறிப்பிடுகிறார் என்பது தெளிவாகக் குறுக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கிறது; தமிழில் இயல்பாக அந்த நிகழ்நிலைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய வசனத்தில் இயேசு கூறியதிலிருந்து எழும் எதிர்வினை அல்லது முடிவை இணைக்கிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் நேரடியான, பரந்த பொருள் இதுவே. யோவான் சூழலில் யூதேயர்களையோ யூதத் தலைவர்களையோ குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Μήτι
  choice: ஒருவேளை ... கொன்றுகொள்வானோ?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் ஐயவினாவை, இயல்பான தமிழ் கேள்வி வடிவில் வெளிப்படுத்துகிறது; அவர்கள் இதை உறுதியாக நம்பியதாகக் காட்டவில்லை.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: தன்னையே கொன்றுகொள்வானோ
  rationale: செயல் செய்பவரிடமே திரும்புவதைத் தெளிவாகவும் தற்போதைய தமிழிலும் தெரிவிக்கிறது.
- source_word: ὅτι λέγει
  choice: என்று சொல்கிறானே
  rationale: ὅτι இங்கு அவர்களுடைய ஊகத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘-னே’ அவர்களின் மேற்கோளை அந்த ஊகத்திற்கான ஆதாரமாக இயல்பாக இணைக்கிறது.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: தான் போகும் இடத்திற்கு
  rationale: உள்ளடக்கப்பட்ட மேற்கோளில் முதல் நபரை அப்படியே வைத்திருப்பதற்குப் பதிலாகத் தமிழ் மறைமுக மேற்கோள் அமைப்புக்கு இயல்பான ‘தான்’ பயன்படுத்தப்பட்டுள்ளது; ὑπάγω என்பதன் செல்லுதல்/புறப்படுதல் கருத்தை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: நீங்கள் வர முடியாது
  rationale: δύνασθε என்பதிலுள்ள இயலாமையின் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்று வைத்தல்
  alternative: ‘யூதேயர்கள்’ அல்லது ‘யூதத் தலைவர்கள்’
  rationale: இச்சொற்றொடர் சொற்பொருளில் பரந்தது; இவ்வசனம் மட்டும் அதன் குறிப்பைத் தலைவர்களாகவோ யூதேயப் பகுதியினராகவோ வெளிப்படையாகக் குறுக்கவில்லை. குறிப்பை இனக்குழு முழுவதற்கும் அளவுக்கு மீறிப் பொதுமைப்படுத்தாமல் இருக்கச் சூழல்சார் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க நிறைவுறா இறந்தகாலத்தின் தொடர்ச்சித் தன்மை ‘பேசிக்கொண்டிருந்தார்கள்’ என்பதில் காக்கப்பட்டுள்ளது. கேள்வியின் சந்தேகத் தொனி இயல்பான தமிழ் வாக்கிய வரிசையில் தரப்பட்டுள்ளது.
