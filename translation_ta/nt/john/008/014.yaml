reference: John 8:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “நான் என்னைக் குறித்து சாட்சி சொன்னாலும் கூட, என் சாட்சி உண்மையானது. ஏனெனில், நான் எங்கிருந்து வந்தேன் என்பதையும் எங்கே போகிறேன் என்பதையும் அறிவேன். ஆனால், நான் எங்கிருந்து வருகிறேன் அல்லது[a] எங்கே போகிறேன் என்பதை நீங்கள் அறியவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அல்லது” என்பதற்குப் பதிலாக “மற்றும்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: யோவான் பயன்படுத்தும் இரட்டை வினை அமைப்பைப் பாதுகாக்கிறது; அதே நேரத்தில் இயல்பான நவீனத் தமிழாக உள்ளது.
- source_word: Κἂν
  choice: சாட்சி சொன்னாலும்
  rationale: நிபந்தனையுடன் கூடிய விட்டுக்கொடுக்கும் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαρτυρῶ / μαρτυρία
  choice: சாட்சி சொன்னாலும் / சாட்சி
  rationale: சட்ட அல்லது சான்றளிப்பு சார்ந்த நுண்ணர்த்தத்தைப் பாதுகாத்து, பொதுவாசகர்களுக்கும் எளிதில் புரிகிறது.
- source_word: περὶ ἐμαυτοῦ
  choice: என்னைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமையின் நேரடியான ‘என்னைப் பற்றி’ என்ற பொருளைத் தருகிறது; ‘என் சார்பாக’ என்ற கூடுதல் சட்ட நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἀληθής
  choice: உண்மையானது
  rationale: யோவானின் உண்மை பற்றிய மொழியையும், இங்கு சாட்சியின் உண்மைத்தன்மையையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: நான் எங்கிருந்து வந்தேன், எங்கே போகிறேன்
  rationale: கடந்த வருகையையும் நோக்கமுள்ள புறப்பாட்டையும் தமிழில் தெளிவாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: ஆனால் ... உங்களுக்குத் தெரியாது
  rationale: இயேசுவின் அறிவுக்கும் அவர்களுடைய அறியாமைக்கும் இடையிலான வலுவான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: πόθεν ἔρχομαι
  choice: நான் எங்கிருந்து வருகிறேன்
  rationale: கிரேக்க நிகழ்காலத்தைத் தக்கவைத்து, முந்தைய ἦλθον என்பதிலிருந்து உள்ள கால வேறுபாட்டை அழிக்காமல் காட்டுகிறது.
theological_decisions:
- issue: இயேசுவின் தம்மைக் குறித்த சாட்சியின் தன்மை
  choice: அவருடைய தோற்றமும் செல்லும் இடமும் பற்றிய தனித்த அறிவின் அடிப்படையில் அவரது சாட்சி உண்மையானது என மொழிபெயர்க்கப்பட்டது.
  alternative: சாட்சியைச் சட்டப்படி ‘செல்லுபடியாகும்’ என்று குறுகலாக மொழிபெயர்ப்பது அல்லது பரலோகத் தோற்றத்தை வசனத்திலேயே வெளிப்படையாகச் சேர்ப்பது.
  rationale: மூலவசனம் ‘உண்மையானது’ என்று கூறி, அதற்கான காரணமாக இயேசுவின் அறிவைக் குறிப்பிடுகிறது. விரிவான கிறிஸ்தியல் கருத்தைச் சூழல் வெளிப்படுத்த அனுமதித்து, மொழிபெயர்ப்பில் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ். ‘பதிலளித்துச் சொன்னார்’ என்பது மூலத்தின் இரட்டை வினையைத் தக்கவைக்கிறது. வாக்கியங்களைச் சுருக்கமாகப் பிரித்தது வாசிப்புத் தெளிவுக்காக; கருத்துத் தொடர்பு மாற்றப்படவில்லை. மூலத்தின் இறுதிப் பகுதியில் உள்ள ἢ (‘அல்லது’) முதன்மை உரையில் தமிழ் பட்டியல் அமைப்புக்கேற்ப காற்புள்ளியால் இயல்பாக்கப்பட்டு, καί (‘மற்றும்/என்பதும்’) என்ற கையெழுத்து வேறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
