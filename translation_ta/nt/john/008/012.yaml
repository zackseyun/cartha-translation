  source_fidelity: முதல் வாக்கியத்தின் ‘அப்போது’ கிரேக்க οὖν-இன் உரையாடல் இணைப்பை ஓரளவு மட்டுமே காட்டி, தேவையற்ற காலக் குறிப்பையும் சேர்க்கிறது. மேலும் ἕξει (‘உடையிருப்பார் / will have’) என்பதற்கு ‘பெற்றிருப்பார்’ என்பது பெறுதல் முடிந்த நிலையைக் குறிக்கும் நிழலைத் தருகிறது. இவ்விரண்டையும் சரிசெய்தால் மூலத்தின் பொருளும் காலமும் துல்லியமாகும்.
  naturalness: ‘நான் உலகத்தின் ஒளி,’ ‘என்னைப் பின்பற்றுகிறவர்,’ ‘இருளில் ஒருபோதும் நடக்கமாட்டார்’ ஆகியவை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளன. ‘வாழ்வின் ஒளியை உடையவராயிருப்பார்’ என்பது ‘பெற்றிருப்பார்’ என்பதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானது; வேதாகமப் பதிவுக்கு ஏற்ற இயல்பான நடையும் ஆகும்.
