id: JHN.8.12
reference: John 8:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: ta
  text: 'மீண்டும் இயேசு அவர்களிடம் பேசினார்: “நான் உலகத்தின் ஒளி. என்னைப் பின்பற்றுகிறவர் இருளில் ஒருபோதும் நடக்கமாட்டார்[a]; மாறாக, வாழ்வின் ஒளியை உடையவராயிருப்பார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இருளில் நிச்சயமாக நடக்கமாட்டார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் οὐ μή என்ற வலுவான மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘வாழ்வின் ஒளி’ என்பதை ‘வாழ்வு அளிக்கும் ஒளி’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: அப்போது ... மீண்டும்
  rationale: Πάλιν என்பதன் மறுபடியும் நிகழும் தன்மையை ‘மீண்டும்’ நேரடியாகக் காட்டுகிறது; οὖν இங்கு வலுவான தர்க்க முடிவைக் காட்டுவதற்குப் பதிலாக உரையின் தொடர்ச்சியை இணைப்பதால், இயல்பான தமிழில் ‘அப்போது’ என வழங்கப்பட்டது.
- source_word: ἐλάλησεν ... λέγων
  choice: 'பேசினார்:'
  rationale: λαλέω என்பதற்கு ‘பேசினார்’ இயல்பான இணை; தொடர்ந்து வரும் λέγων நேரடி மேற்கோளை அறிமுகப்படுத்துவதால், தமிழில் தேவையற்ற ‘சொல்லி’ என்ற இரட்டிப்பைத் தவிர்த்து முற்றுப்புள்ளிக்குப் பதிலாக முக்காற்புள்ளி பயன்படுத்தப்பட்டது.
- source_word: Ἐγώ εἰμι
  choice: நான்
  rationale: தமிழில் நிகழ்கால இணைப்புவினை வெளிப்படையாகத் தேவையில்லை; ‘நான் உலகத்தின் ஒளி’ என்பது கிரேக்க வாக்கியத்தின் இயல்பான, நேரடியான வடிவத்தைத் தருகிறது. ‘நானே’ என்று மொழிபெயர்த்து மூலத்தில் தேவைப்படாத விலக்குப் பொருள் வலுப்படுத்தப்படவில்லை.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: உலகத்தின் ஒளி
  rationale: கிரேக்கப் பெயர்ச்சொல்-உரிமை அமைப்பைத் தெளிவாகவும் இயல்பாகவும் காக்கும் மொழிபெயர்ப்பு.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: என்னைப் பின்பற்றுகிறவர்
  rationale: பெயர்ச்சொல் செயல்பாட்டில் உள்ள ஒருமை வினையெச்சத்தின் பொதுவான பிரதிநிதித்துவப் பொருளைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: இருளில் ஒருபோதும் நடக்கமாட்டார்
  rationale: οὐ μή உடன் வரும் வலுவான மறுப்பை ‘ஒருபோதும் ... மாட்டார்’ தெளிவாக வெளிப்படுத்துகிறது; ‘நடத்தல்’ என்ற யோவானிய உருவகத்தையும் காக்கிறது.
- source_word: ἀλλ’ ἕξει
  choice: மாறாக ... பெற்றிருப்பார்
  rationale: ἀλλά குறிக்கும் கூர்மையான முரண்பாட்டை ‘மாறாக’ காட்டுகிறது. ‘பெற்றிருப்பார்’ என்பது எதிர்காலத்தில் ஒளியை உடையவராக இருப்பதைக் காலத்துக்கும் சூழலுக்கும் ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: வாழ்வின் ஒளி
  rationale: மூலத்தின் சுருக்கமான உரிமைத்தொடரை அப்படியே காத்து, அது வாழ்விலிருந்து வரும் ஒளியா, வாழ்வை அளிக்கும் ஒளியா, வாழ்வோடு அடையாளப்படுத்தப்படும் ஒளியா என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: Ἐγώ εἰμι என்ற இயேசுவின் தன்னடையாளக் கூற்றின் வலிமை
  choice: ‘நான் உலகத்தின் ஒளி’ என்று எளிய பயனிலை வாக்கியமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நானே உலகத்தின் ஒளி’ என்று வலியுறுத்தி, தனித்த ‘நான் இருக்கிறேன்’ கூற்றோடு தொடர்பைத் தெளிவாக்குதல்.
  rationale: இவ்வசனத்தில் Ἐγώ εἰμι என்பதோடு ‘உலகத்தின் ஒளி’ என்ற பயனிலை நேரடியாக இணைந்துள்ளது. ஆகவே இலக்கணத்தைப் பின்பற்றி, தெய்வீகப் பெயருக்கான சாத்தியமான எதிரொலியை மொழிபெயர்ப்பிலேயே கட்டாயப்படுத்தவில்லை.
- issue: ‘வாழ்வின் ஒளி’ என்பதில் τῆς ζωῆς என்ற உரிமைத்தொடரின் பொருள்
  choice: ‘வாழ்வின் ஒளி’ என்ற திறந்த பொருளுள்ள வடிவம் தக்கவைக்கப்பட்டது.
  alternative: ‘வாழ்வு அளிக்கும் ஒளி’ அல்லது ‘வாழ்வளிக்கும் ஒளி’.
  rationale: கிரேக்க உரிமைத்தொடர் மூலத்தையோ, தன்மையையோ, விளைவையோ குறிக்கக்கூடும். ஒரே விளக்கமாகச் சுருக்காமல் அதன் இறையியல் செறிவும் உண்மையான தெளிவின்மையும் காக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. பழமையான இணைப்புவினை வடிவங்களும் தேவையற்ற வடமொழிச் சொற்களும் தவிர்க்கப்பட்டன; ‘ஒளி/இருள்’, ‘பின்பற்றுதல்’, ‘நடத்தல்’ ஆகிய யோவானிய உருவகங்கள் காக்கப்பட்டன.
