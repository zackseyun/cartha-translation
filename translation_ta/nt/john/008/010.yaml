  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: ta
  text: இயேசு[a] நிமிர்ந்து, அந்தப் பெண்ணைத் தவிர வேறு யாரையும் காணாமல், அவளிடம், “பெண்ணே, உன் மீது குற்றம் சாட்டியவர்கள் எங்கே? ஒருவரும் உன்னைக் குற்றவாளி எனத் தீர்ப்பளிக்கவில்லையா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் விபசாரத்தில் பிடிக்கப்பட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் (யோவான் 7:53–8:11) ஒரு பகுதியாகும். இந்த நிகழ்ச்சி மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் இல்லை. யோவான் 7:53-இன் குறிப்பைப் பார்க்கவும்.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: நிமிர்ந்து
  rationale: முந்தைய வசனங்களில் குனிந்து தரையில் எழுதிக்கொண்டிருந்த இயேசு தமது உடலை நிமிர்த்தியதைக் குறிக்கிறது; ‘எழுந்து நின்று’ என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: θεασάμενος
  choice: காணாததால்
  rationale: கூட்டம் சென்றுவிட்டதை இயேசு பார்வையால் உணர்ந்ததைக் காட்டுகிறது; காரணநிலைப் பெயரெச்சத்தின் இயல்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κατήγοροί
  choice: குற்றம் சாட்டியவர்கள்
  rationale: சட்டம் சார்ந்த சூழலில் குற்றச்சாட்டு முன்வைத்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: κατέκρινεν
  choice: தண்டனைத் தீர்ப்பு அளிக்கவில்லையா
  rationale: வெறும் ‘நியாயந்தீர்த்தல்’ என்பதைக் காட்டிலும், குற்றவாளி எனத் தீர்ப்பளிக்கும் சட்டரீதியான பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: κατακρίνω என்பதன் சட்டரீதியான வலிமை
  choice: தண்டனைத் தீர்ப்பு அளிக்கவில்லையா
  alternative: கண்டனம் செய்யவில்லையா / தீர்ப்பளிக்கவில்லையா
  rationale: இங்கு குற்றம் சாட்டப்பட்ட பெண்ணுக்கு எதிராகக் குற்றத்தீர்ப்பும் தண்டனையும் விதிக்கும் சூழல் உள்ளது; ‘கண்டனம்’ என்பது வாய்மொழிக் குற்றச்சாட்டாக மட்டுமே புரிந்துகொள்ளப்படலாம், ‘தீர்ப்பளித்தல்’ என்பது குற்றமற்றவர் என்ற தீர்ப்பையும் உள்ளடக்கலாம்.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘பெண்ணே’ என்பது Ἡ γυνή என்பதற்கான மரியாதையான நேரடி அழைப்பு; தமிழில் இழிவாகத் தோன்றாத வகையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் இரண்டு கேள்விகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
