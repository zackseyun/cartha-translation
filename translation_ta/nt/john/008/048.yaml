source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: ta
  text: யூதர்கள் அவருக்குப் பதிலளித்து, “நீ சமாரியன் என்றும், உனக்குள் ஒரு பேய் இருக்கிறது என்றும் நாங்கள் சொல்வது சரிதானே?” என்றார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “யூதர்கள்” என்பது ஒட்டுமொத்த யூத மக்களையும் குறிக்க வேண்டியதில்லை. யோவான் நற்செய்தியில், சூழலுக்கு ஏற்ப இது இயேசுவை எதிர்த்த ஒரு குறிப்பிட்ட யூதக் குழுவைக் குறிக்கலாம். சில சூழல்களில் “யூதேயர்கள்” அல்லது “யூதத் தலைவர்கள்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: “உனக்குள் ஒரு பேய் இருக்கிறது” என்பது கிரேக்கத்தில் சொல்லர்த்தமாக “நீ ஒரு பேயை உடையிருக்கிறாய்” என்பதாகும்; பொருளை விளக்கி “உனக்குப் பேய் பிடித்திருக்கிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: பதிலளித்து
  rationale: இது வடிவத்தில் இறந்தகாலச் செயப்பாட்டுவினையாக இருந்தாலும், இங்கு ‘பதிலளித்தார்கள்’ என்ற பொருளுடைய வினை. அடுத்து வரும் ‘சொன்னார்கள்’ என்பதோடு தமிழில் இயல்பாக இணைய ‘பதிலளித்து … கேட்டார்கள்’ என அமைக்கப்பட்டது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான இன-மத அடையாளம் இதுவே. ‘யூதத் தலைவர்கள்’ என்று மூலத்தில் இல்லாத குறிப்பை முதன்மை உரையில் சேர்க்காமல், சூழல் சார்ந்த வரம்பை அடிக்குறிப்பில் விளக்குவது பொருத்தம்.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: நாங்கள் சொல்வது சரிதானே?
  rationale: οὐ உடன் வரும் இவ்வினா ஆம் என்ற பதிலை எதிர்பார்க்கிறது; καλῶς என்பதன் ‘சரியாக/நியாயமாக’ என்ற வலிமையை இயல்பான நவீன தமிழில் ‘சரிதானே?’ என்பது வெளிப்படுத்துகிறது.
- source_word: Σαμαρίτης
  choice: ஒரு சமாரியன்
  rationale: இங்கு இனம் மற்றும் மதச் சமூகத்தைக் குறிக்கும் பெயர் இழிவாகப் பயன்படுத்தப்படுகிறது; தமிழில் பயனிலை அமைப்புக்கு ‘ஒரு’ இயல்பானது.
- source_word: δαιμόνιον ἔχεις
  choice: உனக்குள் ஒரு பேய் இருக்கிறது
  rationale: சொல்லுக்குச் சொல் ‘நீ ஒரு பேயை உடையவனாய் இருக்கிறாய்.’ தமிழில் அது இயல்பற்றதால், ‘பேய் பிடித்திருக்கிறது’ என்ற விளக்கமான மொழியாக்கத்தைத் தவிர்த்து, ‘உனக்குள் ஒரு பேய் இருக்கிறது’ என மூலத்தின் ‘உண்டு/கொண்டிரு’ உருவகத்தை நெருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்கள்
  alternative: யூதேயர்கள்; யூதத் தலைவர்கள்
  rationale: மூலம் இங்கு தலைவர்கள் என்று வெளிப்படையாகக் குறிப்பிடவில்லை. அதேவேளை, யோவானின் கதையாடலில் இச்சொல் பல இடங்களில் இயேசுவை எதிர்க்கும் ஒரு குறிப்பிட்ட குழுவைக் குறிக்கலாம்; எல்லா யூத மக்களையும் விதிவிலக்கின்றிக் குறிக்க வேண்டியதில்லை. அந்தச் சூழல் நுட்பம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: δαιμόνιον ἔχεις என்பதன் பொருள் வடிவம்
  choice: உனக்குள் ஒரு பேய் இருக்கிறது
  alternative: உனக்குப் பேய் பிடித்திருக்கிறது
  rationale: ‘பேய் பிடித்திருக்கிறது’ என்பது விளக்கமான தமிழ் வழக்கு; ஆனால் கிரேக்கம் நேரடியாக ‘ஒரு பேயை உடையிருக்கிறாய்’ என்கிறது. மூலத்தின் வெளிப்பாட்டைத் தெளிவாகப் பேணும் இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள ‘பதிலளித்து … சொன்னார்கள்’ என்ற இரட்டை வினை தமிழில் தேவையற்ற கனத்தை ஏற்படுத்தாதபடி ‘பதிலளித்து … என்று கேட்டார்கள்’ என இயல்பாக்கப்பட்டுள்ளது. வினாவின் உறுதிப்படுத்தும் தொனி ‘சரிதானே?’ என்பதால் பேணப்பட்டுள்ளது.
