id: JHN.8.44
reference: John 8:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: ta
  text: நீங்கள் உங்கள் தந்தையாகிய பிசாசிடமிருந்து வந்தவர்கள்; உங்கள் தந்தையின் ஆசைகளைச் செய்யவே விரும்புகிறீர்கள். அவன் தொடக்கத்திலிருந்தே கொலைகாரன்; அவன் உண்மையில் நிலைத்து நின்றதில்லை, ஏனெனில் அவனுக்குள் உண்மை இல்லை. அவன் பொய்யைப் பேசும்போதெல்லாம், தனக்குரியவற்றிலிருந்தே பேசுகிறான்[a]; ஏனெனில் அவன் பொய்யனும் பொய்யின் தந்தையுமாய் இருக்கிறான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “தனக்குரியவற்றிலிருந்து பேசுகிறான்.” அதாவது, தனக்கே சொந்தமான இயல்பு அல்லது குணத்திலிருந்து பேசுகிறான் என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “அதன் தந்தை.” இது முன் கூறப்பட்ட “பொய்” என்பதைக் குறிக்கிறது. சிலர் இதைப் பொதுப்படுத்தி, “பொய்களின் தந்தை” என்று மொழிபெயர்க்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: உங்கள் தந்தையாகிய பிசாசிடமிருந்து வந்தவர்கள்
  rationale: ἐκ என்பது மூலம் அல்லது தோற்றத்தைக் குறிக்கிறது. இந்தத் தமிழாக்கம் பிசாசை அவர்களுடைய தந்தை என்று தெளிவாக அடையாளப்படுத்தி, மூலத்திலிருந்து வந்தவர்கள் என்ற கடுமையான கருத்தையும் காக்கிறது.
- source_word: ἐπιθυμίας
  choice: ஆசைகளை
  rationale: இங்கு பாலியல் பொருளுக்கு மட்டும் கட்டுப்படாத பரந்த விருப்பங்களைக் குறிக்கிறது; ‘ஆசைகள்’ இயல்பான நவீனத் தமிழ்.
- source_word: θέλετε ποιεῖν
  choice: செய்யவே விரும்புகிறீர்கள்
  rationale: செய்யும் மனவிருப்பத்தையும் நோக்கத்தையும் வெளிப்படுத்துகிறது; ‘வே’ அதன் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
- source_word: ἀνθρωποκτόνος
  choice: கொலைகாரன்
  rationale: மனித உயிரைக் கொல்பவனைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் சொல்.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்தே
  rationale: யோவானின் காலக்குறிப்பை நேரடியாகக் காத்து, தமிழில் இயல்பாக உள்ளது.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: உண்மையில் நிலைத்ததில்லை
  rationale: ‘நிற்குதல்/நிலைபெறுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. அவன் முன்பு உண்மையில் இருந்து பின்னர் விலகினான் என்று கட்டாயமாகத் தீர்மானிக்காமல் இருக்க ‘தொடர்ந்து நிலைக்கவில்லை’ போன்ற மொழி தவிர்க்கப்பட்டது.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: அவன் பொய்யைப் பேசும்போதெல்லாம்
  rationale: τὸ ψεῦδος என்பதன் ஒருமை மற்றும் உருபுடை வடிவத்தை ‘பொய்யை’ என்று காத்து, ὅταν என்பதன் வழக்கமான நிகழ்வை ‘போதெல்லாம்’ வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: தனக்குரியவற்றிலிருந்தே பேசுகிறான்
  rationale: கிரேக்கத்தின் ‘தனக்குச் சொந்தமானவற்றிலிருந்து’ என்ற முழுமையற்றதாயினும் கருத்துச்செறிந்த சொல்லாட்சியை நெருக்கமாகக் காக்கிறது; ‘இயல்பிலிருந்து’ என்று விளக்கிப் பொருளை அதிகமாக நிர்ணயிக்கவில்லை.
- source_word: ψεύστης
  choice: பொய்யன்
  rationale: நேரடியான, இயல்பான பெயர்ச்சொல் இணை.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: பொய்க்குத் தந்தை
  rationale: αὐτοῦ என்பதற்கு அருகிலுள்ள τὸ ψεῦδος என்பதை முன்னிலையாகக் கொண்டு, பிசாசு பொய்யின் மூலமென்ற கருத்தை இயல்பான தமிழில் தருகிறது; ‘பொய்களின் தந்தை’ என்று ஒருமையைப் பன்மையாக்கவில்லை.
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ என்பதில் αὐτοῦ எதைக் குறிக்கிறது
  choice: '‘பொய்’ என்பதைக் குறிக்கிறது: ‘பொய்க்குத் தந்தை’'
  alternative: ‘அவனுடைய தந்தை’ அல்லது பொதுப்படுத்தி ‘பொய்களின் தந்தை’
  rationale: அருகிலுள்ள இயல்பான முன்னிலை τὸ ψεῦδος. ‘அவனுடைய தந்தை’ என்பது சூழலில் தேவையற்ற இறையியல் ஊகத்தை உருவாக்கும்; ‘பொய்களின் தந்தை’ பொருளைச் சொன்னாலும் கிரேக்க ஒருமையை விரிவாக்குகிறது. மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: பிசாசு ஒருகாலத்தில் உண்மையில் நிலைத்திருந்தான் என்று வசனம் குறிக்கிறதா
  choice: முன்னைய நிலையைத் தீர்மானிக்காமல் ‘உண்மையில் நிலைத்ததில்லை’
  alternative: ‘உண்மையில் தொடர்ந்து நிலைக்கவில்லை’ அல்லது ‘உண்மையை விட்டு விலகினான்’
  rationale: οὐκ ἔστηκεν அவன் உண்மையில் நிலைபெற்றிராததைச் சொல்கிறது; முன்னர் அதில் இருந்த பின்னர் விழுந்தான் என்பதை வெளிப்படையாகச் சேர்ப்பதில்லை. ஆகவே அந்த இறையியல் கேள்வி மொழிபெயர்ப்பில் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தந்தையாகிய பிசாசு,’ ‘உண்மையில் நிலைத்ததில்லை,’ ‘பொய்க்குத் தந்தை’ ஆகியவை மூலத்தின் கடுமை, உருவகம், மற்றும் இறையியல் பதற்றத்தைத் தக்கவைக்கின்றன. வசனத்தின் பிரதான உரையில் உள்ள [a], [b] குறிகள் அடிக்குறிப்புகளுடன் பொருந்துகின்றன.
