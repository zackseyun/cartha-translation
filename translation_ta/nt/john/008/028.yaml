source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: ta
  text: ஆகவே இயேசு, “நீங்கள் மனிதகுமாரனை உயர்த்தும்போது[b], ‘நானே அவர்’[a] என்பதையும், நான் என் சொந்தமாக எதையும் செய்வதில்லை; மாறாக, தந்தை எனக்குக் கற்றுக்கொடுத்தபடியே இவற்றைப் பேசுகிறேன் என்பதையும் அப்போது அறிந்துகொள்வீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நான் இருக்கிறேன்.” கிரேக்கில் வெளிப்படையான பயனிலை இல்லாமல் ἐγώ εἰμι (“நான் இருக்கிறேன்”) என்று மட்டுமே உள்ளது.'
    reason: alternative_reading
  - marker: b
    text: “உயர்த்துதல்” என்பது உடலளவில் மேலே உயர்த்தப்படுவதையும், யோவானின் பயன்பாட்டில் மேன்மைப்படுத்தப்படுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் முடிவு அல்லது தொடர்பைக் காட்டுகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ὅταν
  choice: எப்போது
  rationale: திரும்பத் திரும்ப நிகழ்வதை அல்லாமல், எதிர்காலத்தில் நிகழவிருக்கும் குறிப்பிட்ட நிகழ்வைச் சுட்டுகிறது; இணைந்த வினையமைப்பில் ‘உயர்த்தும்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὑψώσητε
  choice: உயர்த்தும்போது
  rationale: உடலளவில் மேலே உயர்த்தப்படுவதையும் மேன்மைப்படுத்தப்படுவதையும் குறிக்கக்கூடிய யோவானிய இரட்டைப் பொருளைப் பாதுகாக்கிறது; ‘சிலுவையில் அறையும்போது’ என்று ஒரே பொருளுக்குள் சுருக்கவில்லை.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரனை
  rationale: இயேசுவின் தனிச்சிறப்பான சுயக் குறிப்பையும் அதன் வேதாகமப் பின்னொலிகளையும் பாதுகாக்கும் நிலையான தமிழ் வடிவம்.
- source_word: γνώσεσθε
  choice: அறிந்துகொள்வீர்கள்
  rationale: பின்னர் ஏற்படும் உணர்தல் அல்லது அடையாளங்காணுதலின் நுட்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγώ εἰμι
  choice: நானே அவர்
  rationale: கிரேக்கில் வெளிப்படையான பயனிலை இல்லாததால் உருவாகும் மறைபொருளையும் கனத்தையும் ஓரளவு காத்தபடி தமிழில் புரியக்கூடிய வாக்கியமாக்குகிறது; இன்னும் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: நான் நானாக எதையும் செய்வதில்லை
  rationale: செயலின் மூலமும் தனிப்பட்ட முன்முயற்சியும் இயேசுவிடமிருந்து தனித்து எழுவதில்லை என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλὰ καθὼς ἐδίδαξέν με ὁ πατὴρ
  choice: மாறாக, தந்தை எனக்குக் கற்றுக்கொடுத்தபடியே
  rationale: ἀλλά குறிக்கும் எதிர்மறை மாறுபாட்டையும் καθώς குறிக்கும் துல்லிய ஒத்திசைவையும் வெளிப்படுத்துகிறது.
- source_word: ταῦτα λαλῶ
  choice: இவற்றைப் பேசுகிறேன்
  rationale: ταῦτα என்ற சுட்டுச் சொல்லைத் தக்கவைத்து, இயேசு உரைக்கும் சொற்களை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: பயனிலை வெளிப்படையாக இல்லாத ἐγώ εἰμι என்பதன் மொழிபெயர்ப்பு
  choice: நானே அவர்
  alternative: நான் இருக்கிறேன்
  rationale: இந்தச் சொற்றொடரை நேரடியாகத் தெய்வீகப் பெயராக மட்டுமே தீர்மானிக்காமலும், சாதாரண அடையாளக் கூற்றாக அதன் கனத்தை நீக்காமலும் மொழிபெயர்க்கிறது. கிரேக்கின் திறந்த தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ὑψώσητε என்பதன் யோவானிய இரட்டைப் பொருள்
  choice: உயர்த்தும்போது
  alternative: சிலுவையில் அறையும்போது / மேன்மைப்படுத்தும்போது
  rationale: சிலுவையில் உடலளவில் உயர்த்தப்படுதல் மற்றும் மேன்மைப்படுத்தப்படுதல் ஆகிய இரு சாத்தியமான ஒலிப்புகளையும் ஒரே சொல்லில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘நான் நானாக’ என்பது சற்று வலியுறுத்தலுடன் இருந்தாலும் ἀπ’ ἐμαυτοῦ என்பதன் தன்மூல அல்லது தனிமுனைவு நுட்பத்தை இயல்பாகக் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
