  text: அப்போது[a] வேத அறிஞர்களும் பரிசேயர்களும், விபசாரத்தில் பிடிபட்ட ஒரு பெண்ணை அவரிடம் கொண்டுவந்து, அவளை நடுவில் நிறுத்தி,
