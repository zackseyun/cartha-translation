translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியைக் காட்ட δὲ என்பதற்கு ‘அப்போது’ என மொழிபெயர்க்கப்பட்டு, உரை விமர்சனக் குறிப்புக்கான [a] குறியீடு அதனுடன் இணைக்கப்பட்டுள்ளது. வசனம் கிரேக்க மூலத்தைப் போல அடுத்த வசனத்திற்குத் தொடரும் வகையில் காற்புள்ளியுடன் முடிகிறது.
