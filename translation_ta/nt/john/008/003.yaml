lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: கொண்டுவந்து
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது. இயல்பான தமிழ் கதைநடைக்காக இறந்தகால வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது; அவர்கள் அவளை இயேசுவிடம் அழைத்து வந்ததையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: யூதத் திருமறையையும் சட்டத்தையும் நன்கு அறிந்து போதித்தவர்களைக் குறிக்கும் சொல். நவீன வாசகருக்கு வெறும் எழுத்தர்களாகத் தவறாகப் புரியாதவாறு அவர்களின் பங்கை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: விபசாரத்தில் பிடிபட்ட
  rationale: κατειλημμένην என்னும் நிறைவுப் passive வினையெச்சம், விபசாரச் செயலில் கண்டுபிடித்துப் பிடிக்கப்பட்ட நிலையைச் சுட்டுகிறது; தமிழ் வழக்கிலும் இச்சூழலுக்கு இது இயல்பான சொற்றொடர்.
- source_word: στήσαντες (ἵστημι)
  choice: நிறுத்தி
  rationale: அவர்கள் அவளை அங்கிருந்தவர்களின் நடுவில் நிற்க வைத்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν μέσῳ
  choice: நடுவில்
  rationale: கூடியிருந்தவர்களின் மத்தியில் அவள் நிறுத்தப்பட்டதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
