source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: ta
  text: 'எனவே, அவரை நம்பியிருந்த[a] யூதர்களிடம் இயேசு சொல்லிக்கொண்டிருந்தார்: “நீங்கள் என் வார்த்தையில் நிலைத்திருந்தால், நீங்கள் உண்மையாகவே என் சீடர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மீது விசுவாசம் வைத்திருந்த யூதர்களிடம்.” கிரேக்கத்தில், முன்னிடைச்சொல் இல்லாமல், சொல்லுக்குச் சொல் “அவரை நம்பியிருந்த” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: கூறிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வடிவத்தின் கூறுநிலையைத் தக்கவைக்கிறது; எளிய ‘கூறினார்’ என்பதைவிட மூலத்தின் aspect-ஐ வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையுடன் உள்ள தொடர்ச்சியையும் முடிவுறுத்தும் தொடர்பையும் இயல்பான நவீன தமிழில் காட்டுகிறது; அளவுக்கு மீறிய தர்க்க வலிமையைச் சேர்ப்பதில்லை.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: தம்மை நம்பியிருந்த யூதர்களிடம்
  rationale: Perfect participle முன்பே தொடங்கி அப்போதும் தொடர்புடைய நம்பிக்கையைச் சுட்டுவதால் ‘நம்பியிருந்த’ என மொழிபெயர்க்கப்பட்டது. αὐτῷ என்பது முன்னிடைச்சொல் இல்லாத dative என்பதால், ‘தம்மீது விசுவாசம் வைத்திருந்த’ என விரிவாக்காமல் ‘தம்மை நம்பியிருந்த’ என்று நேரடியாக வைக்கப்பட்டுள்ளது.
- source_word: Ἐὰν
  choice: -ஆல் (நிலைத்திருந்தால்)
  rationale: Subjunctive உடன் வரும் நிபந்தனையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள வலியுறுத்தப்பட்ட பன்மை முன்னிலையைத் தக்கவைக்கிறது.
- source_word: μείνητε
  choice: நிலைத்திருந்தால்
  rationale: μένω என்பதிலுள்ள தொடர்ந்து இருப்பது, கைவிடாமல் பற்றியிருப்பது ஆகிய யோவான் நற்செய்திக்குரிய நுண்ணுணர்வுகளை ‘நிலைத்திரு’ இயல்பாகக் காக்கிறது.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: என் வார்த்தையில்
  rationale: λόγος இங்கு இயேசுவின் செய்தி அல்லது போதனையைக் குறித்தாலும், ‘வார்த்தை’ என்பது யோவானின் சொற்பயன்பாட்டையும் அதன் விரிந்த எதிரொலியையும் காக்கிறது.
- source_word: ἀληθῶς
  choice: உண்மையாகவே
  rationale: சீடத்துவத்தின் உண்மைத்தன்மையையும் மெய்ம்மையையும் இயல்பான, கண்ணியமான தமிழில் வலியுறுத்துகிறது.
- source_word: μαθηταί μού ἐστε
  choice: என் சீடர்கள்
  rationale: ἐστε நிகழ்காலத்தை எதிர்காலமாக மாற்றாமல், தமிழின் இயல்பான பெயர்ப்பயனிலை வாக்கியத்தில் ‘நீங்கள் ... என் சீடர்கள்’ எனத் தருகிறது.
theological_decisions:
- issue: πιστεύω என்பதுடன் வரும் dative αὐτῷ-ஐ மொழிபெயர்த்தல்
  choice: தம்மை நம்பியிருந்த
  alternative: தம்மீது விசுவாசம் வைத்திருந்த
  rationale: கிரேக்கத்தில் εἰς போன்ற வெளிப்படையான முன்னிடைச்சொல் இல்லாமல் dative pronoun வருகிறது. ஆகவே, மூலத்தில் சொல்லப்பட்டதைவிட முழுமையான இறையியல் பொருளை முதன்மை உரையில் சேர்க்காமல் நேரடியான கட்டமைப்பு காக்கப்படுகிறது; யோவான் நற்செய்தியின் வழக்கமான ‘அவரில்/அவர்மீது விசுவாசம்’ என்ற புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: நிபந்தனையின் விளைவிலுள்ள ἐστε நிகழ்காலம்
  choice: உண்மையாகவே என் சீடர்கள்
  alternative: உண்மையாகவே என் சீடர்களாக இருப்பீர்கள்
  rationale: மூலம் எதிர்கால வினையை அல்ல, நிகழ்கால ἐστε-ஐப் பயன்படுத்துகிறது. சீடத்துவம் தொடர்ச்சியால் நிரூபிக்கப்படுகிறதா அல்லது அதில் நிலைத்திருப்போர் இப்போதே உண்மையான சீடர்களா என்ற இறையியல் அழுத்தத்தை எதிர்காலமாக மாற்றிச் சமப்படுத்தாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘சீடர்கள்,’ ‘வார்த்தை,’ ‘நிலைத்திரு’ ஆகியவை யோவான் நற்செய்தியின் சொல் மற்றும் கருத்துத் தொடர்புகளைப் பாதுகாக்கின்றன. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
