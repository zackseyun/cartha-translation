  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: ta
  text: அவர் அவர்களிடம் பிதாவைப் பற்றிப் பேசிக்கொண்டிருந்தார் என்பதை அவர்கள் புரிந்துகொள்ளவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவர்களிடம் பிதாவைப் பற்றிப் பேசிக்கொண்டிருந்தார் என்பதை அவர்கள் அறியவில்லை.”
    reason: οὐκ ἔγνωσαν என்பதற்கு ‘அறியவில்லை’ என்ற நேரடியான மொழிபெயர்ப்பும் சாத்தியம்.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: γινώσκω பொதுவாக ‘அறிதல்’ என்று பொருள்படலாம்; ஆனால் இச்சூழலில் இயேசு யாரைக் குறிப்பிட்டார் என்பதை அவர்கள் விளங்கிக்கொள்ளத் தவறியதே கருத்து. ஆகவே இயல்பான நவீனத் தமிழில் ‘புரிந்துகொள்ளவில்லை’ என்பது பொருத்தமானது.
- source_word: ὅτι
  choice: என்பதை
  rationale: அவர்கள் புரிந்துகொள்ளாத செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக ὅτι வருகிறது; தமிழில் ‘என்பதை’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: τὸν πατέρα
  choice: பிதாவைப் பற்றி
  rationale: யோவான் நற்செய்தியின் உடனடிச் சூழலில் இது இயேசு கடவுளைக் குறிக்கப் பயன்படுத்தும் தனித்துவமான அழைப்பு. ‘பிதா’ என்பது இங்கு தெய்வீகக் குறிப்பை மரியாதையுடனும் சுருக்கமாகவும் தக்கவைக்கிறது.
- source_word: αὐτοῖς
  choice: தங்களிடம்
  rationale: λέγω உடன் வரும் αὐτοῖς, பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கிறது. தமிழில் எழுவாயாகிய ‘அவர்கள்’ உடன் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க ‘தங்களிடம்’ இயல்பாக உள்ளது.
- source_word: ἔλεγεν
  choice: பேசிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலையை உணர்த்தும் imperfect வினையின் தொடர்ச்சியான அம்சத்தை ‘பேசிக்கொண்டிருந்தார்’ தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ‘பிதா’ என்பதன் குறிப்பு
  choice: இயேசு கடவுளாகிய பிதாவைப் பற்றிப் பேசினார்.
  alternative: மனிதத் தந்தை ஒருவரைப் பற்றிப் பேசினார்.
  rationale: உடனடியாகச் சூழ்ந்துள்ள யோவானியப் பயன்பாட்டில் ‘பிதா’ என்பது கடவுளைக் குறிக்கிறது. இது பிற்காலக் கோட்பாட்டு விரிவாக்கத்தைச் சேர்க்காமல், சூழல் காட்டும் குறிப்பை மட்டும் வெளிப்படுத்துகிறது.
- issue: இச்சூழலில் γινώσκω என்பதன் தமிழ் மொழிபெயர்ப்பு
  choice: ‘அறியவில்லை’ என்பதற்குப் பதிலாக ‘புரிந்துகொள்ளவில்லை’.
  alternative: அறியவில்லை; அடையாளம் கண்டுகொள்ளவில்லை.
  rationale: கேட்டவர்களுக்கு முன்தகவல் இல்லை என்பதைக் காட்டிலும், இயேசுவின் குறிப்பை அவர்கள் விளங்கிக்கொள்ளவில்லை என்பதே இங்கு முதன்மையான கருத்து. எனினும் ‘அறியவில்லை’ என்ற நேரடியான சொற்பொருள் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’ என்ற மரியாதைமிக்க வேதாகமச் சொல் சூழலின் தெய்வீகக் குறிப்பைத் தக்கவைக்கிறது; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக இருக்கும்படி வடிவமைக்கப்பட்டுள்ளது.
