source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: ta
  text: 'இயேசு அவர்களிடம், “உறுதியாக, உறுதியாக உங்களுக்குச் சொல்கிறேன்: ஆபிரகாம் உண்டாவதற்கு முன்பே[a], நான் இருக்கிறேன்[b]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆபிரகாம் பிறப்பதற்கு முன்பே’ என்றும் மொழிபெயர்க்கலாம். ஆனால் கிரேக்க வினைச்சொல் அதைவிடப் பரந்தது; ‘உண்டாகுதல்’ அல்லது ‘இருப்புக்கு வருதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நான் இருந்து வருகிறேன்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நேரடியாக ‘நான் இருக்கிறேன்’ என்ற நிகழ்கால வடிவமே உள்ளது; அதன் சாத்தியமான இறையியல் எதிரொலியைக் காக்க இங்கே அந்த வடிவம் தக்கவைக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: இயேசு அவர்களிடம் … என்றார்
  rationale: கிரேக்கக் கதைநடையின் பொருளை நேரடியாகக் காக்கிறது; தமிழ் மேற்கோள் அமைப்புக்கேற்ப வினைச்சொல் மேற்கோளின் முடிவில் வைக்கப்பட்டுள்ளது.
- source_word: Ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: இருமுறை வரும் வலியுறுத்தலைக் காத்து, இன்றைய வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் இயேசுவின் ஆணித்தரமான கூற்றை வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: யோவான் நூலில் மீண்டும் வரும் நேரடி, ஆணித்தரமான உரைமுறையை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: πρὶν
  choice: முன்பே
  rationale: காலத்தைக் குறிக்கும் ‘முன்பு’ என்ற அடிப்படைப் பொருளைக் காக்கிறது; ‘-ஏ’ இவ்வாக்கியத்தின் கூர்மையான கால முரணை இயல்பான தமிழில் எடுத்துக்காட்டுகிறது.
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: γενέσθαι
  choice: உண்டாவதற்கு
  rationale: γίνομαι என்பதன் ‘உண்டாதல்/இருப்புக்கு வருதல்’ என்ற பரந்த பொருளைக் காக்கிறது; அதை உடல் பிறப்பாக மட்டும் குறுக்காமல், தொடர்ந்து வரும் ‘நான் இருக்கிறேன்’ என்பதுடனான வினைச்சொல் முரணையும் ஓரளவு வெளிப்படுத்துகிறது.
- source_word: ἐγὼ εἰμί
  choice: நான் இருக்கிறேன்
  rationale: கிரேக்க நிகழ்கால வடிவத்தை நேரடியாகக் காத்து, சூழலில் அதன் திடுக்கிடும் தனித்துவத்தையும் சாத்தியமான இறையியல் எதிரொலியையும் விளக்கித் தீர்த்துவிடாமல் விடுகிறது.
theological_decisions:
- issue: கிறிஸ்துவைப் பற்றிய ஆழ்ந்த பொருள் கொண்ட சூழலில் ἐγὼ εἰμί என்பதன் மொழிபெயர்ப்பு
  choice: நான் இருக்கிறேன்
  alternative: நான் இருந்து வருகிறேன்; நான் இருந்தேன்
  rationale: மூலத்தில் நிகழ்காலமும் தனித்து நிற்கும் கூற்றும் உள்ளன. ‘நான் இருக்கிறேன்’ என்பது அந்த இலக்கண வடிவத்தையும் ஆபிரகாமின் தோற்றத்துடன் உள்ள திட்டமிட்ட முரணையும் காக்கிறது; அதேவேளை தெய்வீகத் தன்னடையாளத்துடனான சாத்தியமான எதிரொலியை உரையிலேயே கோட்பாட்டு விளக்கமாக மாற்றுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, மரியாதையும் ஆணித்தரமும் கொண்ட நடை. மூலத்தின் அசாதாரண நிகழ்காலக் கூற்று மென்மைப்படுத்தப்படவில்லை. எல்லா அடிக்குறிப்புக் குறிகளும் உரையில் உரிய சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
