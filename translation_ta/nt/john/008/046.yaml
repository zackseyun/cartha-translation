source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: ta
  text: உங்களில் யார் என்னைப் பாவம் செய்தவன் என்று நிரூபிக்க முடியும்?[a] நான் உண்மையைச் சொல்கிறேன் என்றால், நீங்கள் ஏன் என்னை நம்புவதில்லை?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களில் யார் என்னைப் பாவத்தின் பேரில் குற்றவாளி என்று நிலைநாட்டுகிறார்?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் ஏன் என்மேல் நம்பிக்கை வைப்பதில்லை?” கிரேக்கச் சொல், ஒருவர் சொல்வதை நம்புதல் மற்றும் அவர்மேல் நம்பிக்கை வைத்தல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: உங்களில் யார்
  rationale: ‘உங்களுள் யார்’ என்ற நேரடியான சவாலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλέγχει
  choice: நிரூபிக்க முடியும்
  rationale: இங்கு குற்றத்தை வெளிப்படுத்துவது அல்லது குற்றவாளி என நிலைநாட்டுவது என்ற நீதிமன்றச் சாயல் உள்ளது; கேள்வியின் சவாலான தன்மையைத் தமிழில் இயல்பாகக் காட்ட ‘நிரூபிக்க முடியும்’ பயன்படுத்தப்பட்டது.
- source_word: περὶ ἁμαρτίας
  choice: பாவம் செய்தவன் என்று
  rationale: περί உடன் வரும் ἁμαρτία பாவம் குறித்த குற்றச்சாட்டைக் குறிக்கிறது; தமிழில் ‘என்னைப் பாவம் செய்தவன் என்று நிரூபி’ என்பது இயல்பான குற்றநிறுவல் மொழி.
- source_word: εἰ ἀλήθειαν λέγω
  choice: நான் உண்மையைச் சொல்கிறேன் என்றால்
  rationale: εἰ என்பதன் நிபந்தனை வடிவத்தை ‘என்றால்’ எனப் பாதுகாக்கிறது; அதை விளக்கமாக ‘உண்மையைச் சொல்வதால்’ என்று மாற்றவில்லை.
- source_word: διὰ τί
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் கிரேக்கத் தொடருக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: πιστεύετέ μοι
  choice: என்னை நம்புவதில்லை
  rationale: μοι உடன் வரும் πιστεύω, ஒருவரின் சொல்லை நம்புதல் மற்றும் அவர்மேல் நம்பிக்கை வைத்தல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம்; ‘என்னை நம்புதல்’ இரண்டையும் ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: இயேசுவின் பாவமின்மை மற்றும் உண்மைத்தன்மை குறித்த கேள்விகளின் வலிமை
  choice: இரு கேள்விகளையும் நேரடியாகவும் விளக்கச் சேர்க்கையின்றியும் மொழிபெயர்த்தல்.
  alternative: ‘என்னிடம் எந்தப் பாவத்தையாவது உங்களில் யாரால் நிரூபிக்க முடியும்?’ என்று உள்ளடங்கிய பொருளை விரித்துரைத்தல்.
  rationale: கிரேக்க உரை இயேசுவின் சவாலை வலுவாக முன்வைக்கிறது; ‘எந்தப் பாவமும் இல்லை’ போன்ற விளக்கத்தைச் சேர்க்காமல் அந்த வலிமையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பாவம் செய்தவன் என்று நிரூபிக்க’ என்பது சட்ட/குற்றச்சாட்டு நிழலை இயல்பாகத் தருகிறது; இரண்டாம் கேள்வியில் உள்ள நிபந்தனை வடிவம் அப்படியே பாதுகாக்கப்பட்டது.
