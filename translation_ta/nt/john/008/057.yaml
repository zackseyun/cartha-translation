id: JHN.8.57
reference: John 8:57
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: ta
  text: ஆகவே யூதர்கள்[a] அவரிடம், “உனக்கு இன்னும் ஐம்பது வயதுகூட ஆகவில்லையே; நீ ஆபிரகாமைப் பார்த்திருக்கிறாயா?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்கள்”; சூழலைக் குறுகலாகப் புரிந்துகொண்டால், “யூதத் தலைவர்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லின் நேரடியான, வழக்கமான பொருள். இச்சூழலில் தலைவர்களை மட்டுமே குறிக்கிறது என்று உரை தெளிவாக வரையறுக்காததால் பொதுவான சொல்லே வைக்கப்பட்டுள்ளது; சூழல்சார் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து எழும் விளைவு அல்லது பதிலைச் சுட்டும் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: உனக்கு இன்னும் ஐம்பது வயதுகூட ஆகவில்லையே
  rationale: கிரேக்கத்தில் வயதை ‘கொண்டிருத்தல்’ எனச் சொல்லும் மரபை, இயல்பான தமிழில் வயது ‘ஆகுதல்’ என மொழிபெயர்க்கிறது. ‘கூட’ மற்றும் ‘ஆகவில்லையே’ பேசுவோரின் வியப்பையும் நம்பாமையையும் வெளிப்படுத்துகின்றன.
- source_word: ἑώρακας
  choice: பார்த்திருக்கிறாயா
  rationale: ὁράω வினையின் நிறைவுநிலை வடிவத்தைத் தமிழின் ‘பார்த்திருக்கிறாய்’ அமைப்பு இயல்பாகப் பிரதிபலிக்கிறது; கேள்விக்குறி அதன் வியப்புக் கேள்வித் தன்மையைத் தெளிவாக்குகிறது.
- source_word: καὶ
  choice: ;
  rationale: கிரேக்க καὶ இரு கூற்றுகளை இணைக்கிறது. தமிழில் அதே எதிர்மறை வியப்புத் தொடர்பை அரைப்புள்ளியும் தொடர்ந்த கேள்வியும் இயல்பாக வெளிப்படுத்துகின்றன; தனியாக ‘மற்றும்’ சேர்ப்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
theological_decisions:
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்கள்
  alternative: யூதேயர்கள்; யூதத் தலைவர்கள்
  rationale: இங்கு மூலவுரை பரந்த அடையாளச் சொல்லைப் பயன்படுத்துகிறது; தலைவர்களை மட்டுமே குறிக்கும் எனச் சுருக்குவது விளக்கத்தை உரைக்குள் கொண்டுவரும். ஆகவே நேரடி வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, சூழலால் சாத்தியமான மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: ἑώρακας என்பதன் நிறைவுநிலையும் கேள்வியின் வியப்பும்
  choice: பார்த்திருக்கிறாயா?
  alternative: பார்த்தாயா?
  rationale: நிறைவுநிலையின் பொருளைத் தமிழில் இயல்பாகத் தக்கவைத்து, இயேசுவின் கூற்றை நம்ப முடியாததாகக் கருதும் பேசுவோரின் வினாவையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; நேரடியான உரையாடல் நடையில் இருந்தாலும் கண்ணியமான வேதாகம மொழிநடை காக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘உனக்கு/நீ’ வடிவங்கள் கிரேக்க ஒருமையையும் எதிர்வினையின் நேரடித்தன்மையையும் பிரதிபலிக்கின்றன.
