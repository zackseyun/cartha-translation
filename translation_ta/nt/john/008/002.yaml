  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: ta
  text: விடியற்காலையில் அவர் மீண்டும் ஆலயத்துக்கு வந்தார். மக்கள் அனைவரும் அவரிடம் வந்து கொண்டிருந்தார்கள்; அவர் உட்கார்ந்து அவர்களுக்குப் போதிக்கத் தொடங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம், விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் (யோவான் 7:53–8:11) தொடர்ச்சியாகும். இந்தப் பகுதி மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் இல்லை. யோவான் 7:53-இன் குறிப்பைப் பார்க்கவும்.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: விடியற்காலையில்
  rationale: சூரிய உதயத்துக்கு முன்போ அதையொட்டியோ உள்ள நேரத்தைக் குறிக்கும் கால வேற்றுமையை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: παρεγένετο
  choice: வந்தார்
  rationale: ஒரு குறிப்பிட்ட இடத்துக்கு வந்து சேர்ந்ததை இங்கு குறிக்கிறது; இலக்கான ஆலயத்துடன் ‘வந்தார்’ இயல்பாகப் பொருந்துகிறது.
- source_word: ἱερόν
  choice: ஆலயம்
  rationale: உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல், பொதுவாகப் போதிக்கக்கூடிய ஆலய வளாகம் முழுவதையும் குறிக்கும்; தமிழில் வழக்கமான வேதாகமச் சொல் ‘ஆலயம்’.
- source_word: πᾶς ὁ λαὸς ἤρχετο
  choice: மக்கள் அனைவரும் அவரிடம் வந்துகொண்டிருந்தார்கள்
  rationale: ἤρχετο என்ற நிறைவுறா இறந்தகால வடிவத்தின் தொடர்ச்சியான நிகழ்வைத் தக்கவைத்து, மக்கள் வந்து சேர்ந்துகொண்டிருந்த காட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθίσας
  choice: அவர் உட்கார்ந்து
  rationale: போதிப்பதற்கு முன் அவர் அமர்ந்த செயலை வரிசைப்படி காட்டுகிறது.
- source_word: ἐδίδασκεν
  choice: போதிக்கத் தொடங்கினார்
  rationale: நிறைவுறா இறந்தகாலம் தொடக்கநிலை அல்லது தொடர்நிலையை உணர்த்தக்கூடும்; முன்னுள்ள இறந்தகாலப் பங்கேற்புவினையுடன் சூழலில் தொடக்கநிலை இயல்பாக இருந்தாலும், மூலத்தின் காலவகைச் சாத்தியத்தை குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: ἐδίδασκεν என்ற நிறைவுறா இறந்தகாலத்தின் நுண்பொருள்
  choice: போதிக்கத் தொடங்கினார்
  alternative: போதித்துக்கொண்டிருந்தார்
  rationale: இரு வாசிப்புகளும் இலக்கண ரீதியாகச் சாத்தியம். அவர் முதலில் உட்கார்ந்தார் என்ற நிகழ்வைத் தொடர்ந்து போதனை ஆரம்பித்ததாக உரையின் நிகழ்வுவரிசை இயல்பாக உணர்த்துவதால் தொடக்கநிலைத் தெரிவு செய்யப்பட்டது; இது தனிப்பட்ட கோட்பாட்டுத் தீர்மானம் அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோவில்’ என்பதற்குப் பதிலாக யூத ஆலயத்தைக் குறிக்கும் வழக்கமான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. அடிக்குறி குறியீடு வசனத்தின் முடிவில் வைக்கப்பட்டுள்ளது; அது முழு வசனமும் சேர்ந்துள்ள உரைப்பகுதியின் கையெழுத்துப் பிரதி நிலையைச் சுட்டுகிறது.
