source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: ta
  text: யூதர்கள் அவரிடம், “இப்போது நீ பேய் பிடித்தவன் என்று எங்களுக்குத் தெரிந்துவிட்டது.[a] ஆபிரகாம் இறந்தார்; தீர்க்கதரிசிகளும் இறந்தார்கள். ஆனால் நீயோ, ‘எவராவது என் வார்த்தையைக் கடைப்பிடித்தால், அவர் என்றென்றைக்கும் மரணத்தைச் சுவைக்கவே மாட்டார்’[b] என்று சொல்கிறாய்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “உன்னிடம் ஒரு பேய் இருக்கிறது.”'
    reason: lexical_alternative
  - marker: b
    text: “என்றென்றைக்கும் மரணத்தைச் சுவைக்கவே மாட்டார்” என்பது கிரேக்கத்தில் மிகவும் வலியுறுத்தப்பட்ட மறுப்பு; எந்தக் காலத்திலும் மரணத்தைச் சுவைக்க மாட்டார் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: இங்கு இயேசுவை எதிர்த்துப் பேசும் குழுவை மூலமொழி நேரடியாக ‘யூதர்கள்’ எனக் குறிப்பிடுகிறது; ‘யூதத் தலைவர்கள்’ என்பது விளக்கச் சேர்க்கையாகிவிடும்.
- source_word: Νῦν ἐγνώκαμεν
  choice: இப்போது ... எங்களுக்குத் தெரிந்துவிட்டது
  rationale: முன்னர் ஏற்பட்ட உணர்தலின் தற்போதைய விளைவை கிரேக்க நிறைவுக்காலம் காட்டுகிறது; தமிழில் ‘தெரிந்துவிட்டது’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δαιμόνιον ἔχεις
  choice: நீ பேய் பிடித்தவன்
  rationale: இது ‘உன்னிடம் ஒரு பேய் இருக்கிறது’ என்ற கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் இணை; அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: ஆபிரகாம் இறந்தார்; தீர்க்கதரிசிகளும் இறந்தார்கள்
  rationale: இரு தரப்பினரும் இறந்தார்கள் என்ற எதிராளிகளின் வாதத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த வினை மீண்டும் கூறப்படுகிறது.
- source_word: καὶ σὺ λέγεις
  choice: ஆனால் நீயோ ... என்று சொல்கிறாய்
  rationale: சூழலில் καί எதிர்மறை மாறுபாட்டைச் சுட்டுகிறது; ‘நீயோ’ அந்த வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: என் வார்த்தையைக் கடைப்பிடிக்கிற
  rationale: ‘வார்த்தை’ λόγος-ஐத் தக்கவைக்கிறது; ‘கடைப்பிடி’ என்பது τηρέω-வின் காத்தல்/பின்பற்றுதல் பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: ஒருபோதும் மரணத்தைச் சுவைக்கவே மாட்டார்
  rationale: οὐ μή-யின் வலிய மறுப்பை ‘-வே மாட்டார்’ என்றும், εἰς τὸν αἰῶνα-வின் காலமுழுவதுமான மறுப்பை ‘ஒருபோதும்’ என்றும் வெளிப்படுத்துகிறது; ‘மரணத்தைச் சுவைத்தல்’ என்ற உருவகம் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் வாக்குறுதியில் ‘மரணத்தைச் சுவைத்தல்’ என்பதன் குறிப்பு
  choice: ‘மரணத்தைச் சுவைத்தல்’ என்ற உருவகத்தை விளக்காமல் அப்படியே தக்கவைத்தல்
  alternative: உடல் மரணம், ஆவிக்குரிய மரணம், அல்லது இறுதி/நித்திய மரணம் என்று குறிப்பாக்குதல்
  rationale: எதிராளிகள் இதை உடல் மரணத்தோடு தொடர்புபடுத்துகிறார்கள்; யோவான் நற்செய்தி பல அடுக்குப் பொருளை அனுமதிக்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் இழுபறியைத் தீர்மானித்துவிடக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘பேய் பிடித்தவன்’ என்பது இயல்பான தமிழ் குற்றச்சாட்டு; மூலத்தின் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. ‘தீர்க்கதரிசிகள்’ மற்றும் ‘வார்த்தை’ ஆகியவை யோவான் மரபுச் சொல்லாட்சியுடன் ஒத்திருக்கின்றன.
