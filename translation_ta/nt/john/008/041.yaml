source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: ta
  text: “நீங்கள் உங்கள் தந்தையின் செயல்களைச் செய்துவருகிறீர்கள்” என்றார். அவர்கள் அவரிடம், “நாங்கள் பாலியல் ஒழுக்கக்கேட்டிலிருந்து பிறந்தவர்கள் அல்ல[a]. கடவுளே எங்கள் ஒரே தந்தை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் முறைதவறிப் பிறந்த பிள்ளைகள் அல்ல.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “நாங்கள் பாலியல் ஒழுக்கக்கேட்டிலிருந்து பிறக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: செய்துவருகிறீர்கள்
  rationale: நிகழ்கால வினையின் தொடரும் செயற்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ ἔργα
  choice: செயல்களையே
  rationale: ἔργα என்பதன் ‘செயல்கள்/செய்கைகள்’ என்ற பொருளைப் பேணுவதோடு, தந்தையின் செயல்களுடன் அவர்களுடைய செயலை அடையாளப்படுத்தும் அழுத்தத்தையும் ‘-ஏ’ வெளிப்படுத்துகிறது.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: உங்கள் தந்தையின்
  rationale: உறவு, தோற்றுவாய், ஆன்மிக வழித்தோன்றல் ஆகிய அர்த்தத் தளங்களின் பதற்றத்தைத் தீர்க்காமல் ‘தந்தை’ என்ற உருவகத்தைப் பேணுகிறது.
- source_word: ἐκ πορνείας
  choice: பாலியல் ஒழுக்கக்கேட்டினால்
  rationale: πορνεία என்பதன் பரந்த பாலியல் ஒழுக்கக்கேடு என்ற பொருளையும், பிறப்பின் சூழலைக் குறிக்கும் ἐκ என்பதையும் தெளிவாக வழங்குகிறது.
- source_word: οὐ γεγεννήμεθα
  choice: பிறந்தவர்கள் அல்ல
  rationale: முற்றுப்பெற்ற செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான பிறப்பு குறித்த கூறாக வழங்குகிறது.
- source_word: ἕνα πατέρα ἔχομεν
  choice: எங்களுக்கு ஒரே தந்தை உண்டு
  rationale: ἕνα என்பதன் ஒருமைத்துவ அழுத்தத்தை ‘ஒரே’ தெளிவாகக் காட்டுகிறது.
- source_word: τὸν θεόν
  choice: அவரே கடவுள்
  rationale: ‘ஒரே தந்தை’ யார் என்பதை அடையாளப்படுத்தும் apposition-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκ πορνείας οὐ γεγεννήμεθα என்பது முறைகேடான பிறப்பை நேரடியாக விளக்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘பாலியல் ஒழுக்கக்கேட்டினால் பிறந்தவர்கள் அல்ல’ என்ற மூலத்திற்கு நெருக்கமான கூற்றைப் பேணுதல்
  alternative: ‘நாங்கள் முறைதவறிப் பிறந்தவர்கள் அல்ல’
  rationale: இந்தச் சொற்றொடர் முறைகேடான பிறப்பை உட்பொருளாகக் கொண்டிருக்கலாம்; ஆனால் கிரேக்க உரை பாலியல் ஒழுக்கக்கேட்டிலிருந்து/அதனால் பிறத்தலை நேரடியாகக் கூறுகிறது. முதன்மை உரை அந்தத் தெளிவின்மையையும் விவாதத் தொனியையும் பேணுகிறது; இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உங்கள் தந்தை’ யாரைக் குறிக்கிறது என்பதை இவ்வசனத்திலேயே வெளிப்படையாக்க வேண்டுமா?
  choice: ‘உங்கள் தந்தை’ என்ற உருவகக் குறிப்பை விளக்கமின்றிப் பேணுதல்
  alternative: பின்னர் வரும் வசனத்தின் அடிப்படையில் தந்தையின் அடையாளத்தை இங்கேயே வெளிப்படுத்துதல்
  rationale: இந்த வசனத்தில் அடையாளம் இன்னும் நேரடியாகக் கூறப்படவில்லை; ஆகவே உரையாடலின் வளர்ச்சியையும் இறையியல் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டது. ‘தந்தை’ என்ற ஒரே சொல்லை இரு கூறுகளிலும் பேணி, யோவானின் உறவு மற்றும் தோற்றுவாய் சார்ந்த சொல் விளையாட்டு காக்கப்பட்டது.
