  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: ta
  text: ஆனால் நான் உண்மையைச் சொல்வதால்[a], நீங்கள் என்னை நம்புவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் நான் உண்மையைச் சொல்கிறேன் என்று நீங்கள் என்னை நம்புவதில்லை.” கிரேக்கச் சொல் இங்கு “என்று” என்ற உள்ளடக்கப் பொருளிலும் எடுத்துக்கொள்ளப்படலாம்; ஆனால் சூழலில் “சொல்வதால்” என்ற காரணப் பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: நான்
  rationale: வெளிப்படையாக உள்ள முதலாம் நபர் சுட்டுப்பெயரைத் தக்கவைத்து, கேட்போருடன் உள்ள வலியுறுத்தப்பட்ட முரண்பாட்டைக் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலோடு உள்ள எதிர்மறைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: சொல்வதால்
  rationale: இங்கு ὅτι காரணப் பொருளில் வருவது உரையாடலின் தர்க்கத்தையும் கூர்மையான முரணையும் சிறப்பாகக் காட்டுகிறது; தமிழில் காரண வினையெச்சம் இயல்பானது.
- source_word: τὴν ἀλήθειαν
  choice: உண்மையை
  rationale: ἀλήθεια என்பதற்கான நேரடியான, சூழலுக்கு ஏற்ற நவீனத் தமிழ் இணை.
- source_word: λέγω
  choice: சொல்கிறேன்
  rationale: நிகழ்காலத்தைத் தக்கவைக்கிறது; ‘உண்மையைச் சொல்’ என்பது தமிழில் இயல்பான சொற்சேர்க்கை.
- source_word: οὐ πιστεύετέ μοι
  choice: நீங்கள் என்னை நம்புவதில்லை
  rationale: πιστεύω என்பதுடன் வரும் மை என்ற வேற்றுமைப் பொருளை தனிப்பட்ட இலக்காகத் தக்கவைத்து, இயேசுவை நம்ப மறுப்பதை நேரடியாகச் சொல்கிறது.
theological_decisions:
- issue: ὅτι என்பது இயேசு உண்மை பேசுவதற்கும் கேட்போரின் நம்பாமைக்கும் இடையே காட்டும் உறவு
  choice: 'காரணப் பொருள்: ‘நான் உண்மையைச் சொல்வதால்’'
  alternative: 'உள்ளடக்கப் பொருள்/அதிக முறையான வடிவம்: ‘நான் உண்மையைச் சொல்கிறேன் என்று’'
  rationale: 'உடனுள்ள உரையாடல் சூழலில் காரணப் பொருள் வலுவானது: இயேசு உண்மையைச் சொல்வதாலேயே அவர்கள் அவரை நம்பவில்லை என்ற கூர்மையான முரண் வெளிப்படுகிறது. இருப்பினும் இலக்கண ரீதியாக சாத்தியமான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.'
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, தெளிவான, கண்ணியமான நடை. ‘விசுவாசிப்பதில்லை’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘நம்புவதில்லை’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் தனிப்பட்ட ‘என்னை’ தக்கவைக்கப்பட்டுள்ளது.
