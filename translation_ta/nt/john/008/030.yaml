source:
  edition: SBLGNT
  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: ta
  text: அவர் இவற்றைப் பேசிக்கொண்டிருந்தபோது[a], பலர் அவர்மேல் நம்பிக்கை வைத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இவற்றைப் பேசும்போது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பலர் அவரை நம்பினார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயராக இருந்து, இயேசு முன்பு கூறியவற்றின் உள்ளடக்கத்தைச் சுட்டுகிறது; மூலத்தின் பன்மையையும் உரையோட்டத் தொடர்பையும் காக்கிறது.
- source_word: αὐτοῦ λαλοῦντος
  choice: அவர் … பேசிக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையுடன் அமைந்த genitive absolute, அதே நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் அவர் பேசிக்கொண்டிருக்கும்போதே அவர்கள் நம்பிக்கை வைத்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை; கூடுதல் விளக்கமின்றி மக்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐπίστευσαν
  choice: நம்பிக்கை வைத்தார்கள்
  rationale: Aorist வினையை முழுமையான நிகழ்வாகக் காட்டுகிறது; தமிழில் தனிப்பட்ட நம்பிக்கையையும் சார்ந்திருத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς αὐτόν
  choice: அவர்மேல்
  rationale: யோவானின் πιστεύω + εἰς அமைப்பில் இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையைக் குறிக்கிறது. ‘அவர்மேல் நம்பிக்கை வைத்தார்கள்’ என்பது வெறுமனே அவரது கூற்றை உண்மை என ஏற்றுக்கொண்டார்கள் என்பதைக் காட்டிலும் இந்த நோக்குநிலை மற்றும் உறவுசார் பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: யோவானின் பயன்பாட்டில் πιστεύω εἰς αὐτόν என்பதன் மொழிபெயர்ப்பு
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  alternative: அவரை நம்பினார்கள்
  rationale: εἰς உடன் வரும் πιστεύω பொதுவாக ஒருவர் சொன்னதை மட்டும் நம்புவதைக் காட்டாமல், அந்த நபரை நோக்கிய நம்பிக்கையைக் குறிக்கிறது. தேர்ந்த வடிவம் அந்தத் திசைநோக்கிய, உறவுசார் வலிமையைக் காக்கிறது; அடுத்தடுத்த வசனங்கள் எழுப்பும் அவர்களின் நம்பிக்கையின் தன்மை குறித்த பதற்றத்தை முன்கூட்டியே தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. தொடர்ச்சியான பேச்சைக் காட்ட ‘பேசிக்கொண்டிருந்தபோது’ பயன்படுத்தப்பட்டுள்ளது. ‘அவர்மேல் நம்பிக்கை வைத்தார்கள்’ என்பது மூலத்தின் πιστεύω εἰς அமைப்பைத் தெளிவாகக் காட்டுகிறது; மாற்று இயல்பான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
