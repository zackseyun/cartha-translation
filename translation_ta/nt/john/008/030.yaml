  verdict: approve
  source_fidelity: மூலத்தின் ταῦτα (இவற்றை), αὐτοῦ λαλοῦντος என்ற ஒரேநேரத் தொடர்ச்சிச் செயல் (அவர் ... பேசிக்கொண்டிருந்தபோது), πολλοὶ (பலர்), மற்றும் ἐπίστευσαν εἰς αὐτόν (அவர்மேல் நம்பிக்கை வைத்தார்கள்) ஆகிய அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘பேசிக்கொண்டிருந்தபோது’ நிகழ்காலப் பங்கேற்பின் தொடர்ச்சியையும் சமகாலத்தன்மையையும் இயல்பாகக் காக்கிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அவர்மேல் நம்பிக்கை வைத்தார்கள்’ என்பது இச்சூழலில் இயல்பானது; வெறுமனே அவர் சொன்னதை நம்புதல் என்ற குறுகிய பொருளுக்கு மொழிபெயர்ப்பைச் சுருக்கவில்லை.
  terminology: யோவானில் πιστεύω + εἰς அமைப்புக்குரிய நபரை நோக்கிய நம்பிக்கையை ‘அவர்மேல் நம்பிக்கை வைத்தார்கள்’ பொருத்தமாக வெளிப்படுத்துகிறது. மாற்று அடிக்குறிப்பு ‘அவரை நம்பினார்கள்’ வாசிக்கத்தக்க இயல்பான மாற்றை வழங்குகிறது; முதன்மை உரையின் வலிமையை மாற்றுவதில்லை.
