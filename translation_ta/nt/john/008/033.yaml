source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: ta
  text: 'அவர்கள் அவருக்குப் பதிலளித்தனர்: “நாங்கள் ஆபிரகாமின் வழித்தோன்றல்கள்[a]. நாங்கள் ஒருபோதும் யாருக்கும் அடிமைகளாக இருந்ததில்லை[b]. அப்படியிருக்க, ‘நீங்கள் சுதந்திரமானவர்களாக ஆவீர்கள்’[c] என்று நீர் எப்படிச் சொல்கிறீர்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபிரகாமின் வித்து.” கிரேக்கச் சொல் ஒருமை வடிவில் இருந்து, உடல்வழி வந்த அனைவரையும் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாருக்கும் பணிசெய்ததில்லை.” இங்கு சுதந்திரத்துக்கு எதிரான அடிமைத்தனமே முதன்மையான பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நீங்கள் சுதந்திரமானவர்களாக இருப்பீர்கள்.” கிரேக்கத்தில் இன்னும் நேரடியாக, “சுதந்திரமானவர்களாக ஆவீர்கள்” என்று நிலைமாற்றம் குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: அவர்கள் அவருக்குப் பதிலளித்தார்கள்
  rationale: πρὸς αὐτόν இயேசுவை நோக்கிச் சொல்லப்பட்ட நேரடியான பதிலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதற்காக ‘அவருக்குப் பதிலளித்தார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Σπέρμα Ἀβραάμ
  choice: ஆபிரகாமின் வழித்தோன்றல்கள்
  rationale: σπέρμα ஒருமை வடிவிலுள்ள கூட்டுப்பெயராக இருந்து உடல்வழி வம்சத்தைச் சுட்டுகிறது. ‘வழித்தோன்றல்கள்’ அந்த வம்ச உரிமைக் கூற்றை இன்றைய தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘வித்து’ என்ற நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐδενὶ
  choice: யாருக்கும்
  rationale: மறுப்பு வினையுடன் வரும் οὐδενὶ என்பதை ‘யாருக்கும் ... இருந்ததில்லை’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பான மறுப்பு அமைப்பாகும்.
- source_word: δεδουλεύκαμεν
  choice: அடிமைகளாக இருந்ததில்லை
  rationale: δουλεύω என்பதன் அடிமைத்தனப் பொருள், இங்கு சுதந்திரம்–அடிமைத்தனம் என்ற உடனடிச் சூழலில் முதன்மையானது. நிறைவுநிலையைக் காட்டும் கிரேக்க வினை வடிவத்தின் தாக்கத்தை ‘இருந்ததில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πώποτε
  choice: ஒருபோதும்
  rationale: எந்தக் காலத்திலும் நிகழவில்லை என்ற வலுவான மறுப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πῶς σὺ λέγεις
  choice: நீர் எப்படிச் சொல்கிறீர்?
  rationale: σὺ என்ற வெளிப்படையான எழுவாயின் வலியுறுத்தலை ‘நீர்’ தக்கவைக்கிறது. கேள்வியின் நம்பமுடியாத எதிர்வினையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘எப்படிச் சொல்கிறீர்?’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: நீங்கள் சுதந்திரமானவர்களாவீர்கள்
  rationale: ἐλεύθεροι என்பது ‘சுதந்திரமானவர்கள்’ என்றும் γενήσεσθε என்பது வெறுமனே ஒரு நிலையில் இருப்பதைவிட அந்த நிலைக்கு ‘ஆவீர்கள்’ என்றும் பொருள்படுகிறது. ஆகவே நிலைமாற்றம் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: சுதந்திரம்–அடிமைத்தனம் என்ற சூழலில் δουλεύω என்பதன் பொருள்
  choice: அடிமைகளாக இருந்ததில்லை
  alternative: பணிசெய்ததில்லை
  rationale: யோவான் 8:34–36-இன் உடனடிச் சூழல் அடிமைத்தனத்தையும் சுதந்திரத்தையும் நேரடியாக எதிரெதிராக நிறுத்துகிறது. ‘பணிசெய்தல்’ என்பது இங்குள்ள கட்டுண்ட நிலையின் சமூக மற்றும் இறையியல் வலிமையைத் தளர்த்திவிடும்.
- issue: Σπέρμα Ἀβραάμ குறிக்கும் வம்ச உறவு
  choice: ஆபிரகாமின் வழித்தோன்றல்கள்
  alternative: ஆபிரகாமின் வித்து
  rationale: இது உடல்வழி வம்சத்தைப் பற்றிய பேச்சாளர்களின் கூற்றைக் குறிக்கிறது. வேறு நூல்களின் இறையியல் நுணுக்கங்களை இங்கு புகுத்தாமல், ஒருமை வடிவிலுள்ள கூட்டுப்பொருளை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை முன்னிலையைப் பன்மையிலிருந்து வேறுபடுத்த ‘நீர்/சொல்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் வரும் ‘நீங்கள்’ சீடர்களைக் குறிக்கும் பன்மையாகும்.
