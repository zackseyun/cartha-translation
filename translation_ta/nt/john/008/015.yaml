  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: ta
  text: நீங்கள் மாம்சத்தின்படி தீர்ப்பிடுகிறீர்கள்[a]; நானோ யாரையும் தீர்ப்பிடுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, «மனித அளவுகோலின்படி» அல்லது «வெளித்தோற்றத்தின்படி».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: வெளிப்படையாக இடம்பெறும் இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லை இயல்பாகத் தருகிறது; பின்னுள்ள «நானோ» என்பதுடன் உள்ள எதிர்மறை ஒப்பீடும் தெளிவாகிறது.
- source_word: κατὰ τὴν σάρκα
  choice: மாம்சத்தின்படி
  rationale: யோவானின் சொல் அமைப்பையும் பொருள்சார் இறுக்கத்தையும் காக்கிறது. இதை «மனித அளவுகோலின்படி» அல்லது «வெளித்தோற்றத்தின்படி» என்று மட்டும் விளக்கி அதன் பொருளைச் சுருக்காமல், சாத்தியமான விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
- source_word: κρίνετε
  choice: தீர்ப்பிடுகிறீர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் நேரடியான பொருளை நவீனத் தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: ἐγὼ
  choice: நானோ
  rationale: ἐγὼ என்பதன் வெளிப்படையான வலியுறுத்தலையும் ὑμεῖς என்பதுடனான எதிர்நிலையையும் «-ஓ» விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ κρίνω οὐδένα
  choice: யாரையும் தீர்ப்பிடுவதில்லை
  rationale: மூலத்தின் முழுமையான மறுப்பை இயல்பான தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: κατὰ τὴν σάρκα என்ற தொடரில் σάρξ என்பதன் பொருள்
  choice: முதன்மை உரையில் «மாம்சத்தின்படி» என்று வைக்கப்பட்டது.
  alternative: «மனித அளவுகோலின்படி» அல்லது «வெளித்தோற்றத்தின்படி».
  rationale: இச்சூழலில் இந்தத் தொடர் மனித அல்லது மேலோட்டமான அளவுகோல்களின்படி தீர்ப்பிடுவதைக் குறிக்கலாம். இருப்பினும், அதை ஒரே விளக்கமாகத் தீர்மானிக்காமல் மூலமொழியின் உருவகத்தையும் யோவானிய இறுக்கத்தையும் காக்க «மாம்சம்» வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. «மாம்சத்தின்படி» என்பது இயல்பில் சற்றே மூலமொழிச் சாயல் கொண்டிருந்தாலும், மூலத்தின் திட்டமிட்ட சொல் அமைப்பையும் தெளிவுறாத பொருள் விரிவையும் காக்கிறது; அடிக்குறிப்பு அதன் சூழல்சார் பொருளை விளக்குகிறது.
