  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: ta
  text: மேலும், உங்கள் சட்டத்தில்கூட ‘இரண்டு மனிதர்களின் சாட்சி உண்மையானது’ என்று எழுதப்பட்டுள்ளது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு நபர்களின் சாட்சி உண்மையானது.” கிரேக்கத்தில் “இரண்டு மனிதர்கள்” என்று உள்ளது; இது மனிதச் சாட்சிகளைக் குறிக்கும் மரபான சட்டச் சொற்றொடராகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: சட்டம்
  rationale: இங்கு யூதர்களின் வேதப்பூர்வமான சட்டத் தொகுப்பைச் சுட்டுகிறது. ‘உங்கள் சட்டம்’ என்ற விவாதச் சூழலுக்கு இயல்பாகவும், குறிப்பாக ஐந்தாகமத்தை மட்டுமே குறிக்கும் தலைப்பாகச் சுருக்காமலும் ‘சட்டம்’ அமைகிறது.
- source_word: ὑμετέρῳ
  choice: உங்கள்
  rationale: இரண்டாம் நபர் உடைமைச் சொல்லையும் இயேசுவின் சொல்லில் உள்ள சொல்லாட்சிசார் இடைவெளியையும் மிகைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: வேத மேற்கோட்டை அறிமுகப்படுத்தும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் தொடரும் செல்லுபடியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δύο ἀνθρώπων
  choice: இரண்டு மனிதர்களின்
  rationale: ἄνθρωπος என்பதன் மனித நபர் என்ற பொதுவான பொருளைத் தக்கவைக்கிறது; அதேவேளை சட்டச் சூழலில் சாட்சிகளைக் குறிக்கும் மரபான பயன்பாட்டையும் அடிக்குறிப்பு விளக்குகிறது.
- source_word: μαρτυρία
  choice: சாட்சி
  rationale: நீதிசார் சூழலில் ஒருவர் அளிக்கும் சான்றுரை அல்லது சாட்சியத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: ἀληθής
  choice: உண்மையானது
  rationale: சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; சட்டப்படி செல்லுபடியாகும் என்ற சூழல்சார் நுண்பொருளை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: καὶ ... δὲ
  choice: மேலும்
  rationale: இணைப்பையும் மிதமான வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது; ‘கூட’ என்று சேர்த்து தேவைக்கு அதிகமான வலியுறுத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘உங்கள் சட்டம்’ என்பதன் சொல்லாட்சிசார் வலிமை
  choice: ‘உங்கள் சட்டம்’ என்பதை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘சட்டம்’ அல்லது ‘உங்களுடைய சொந்தச் சட்டம்’
  rationale: ὑμετέρῳ என்பதை விடாமல் வைத்திருப்பது உரையாடலின் பதற்றத்தைப் பாதுகாக்கிறது; ஆனால் இயேசு சட்டத்தை நிராகரிக்கிறார் என்ற முடிவையோ, ‘சொந்த’ எனும் கூடுதல் கூர்மையையோ புகுத்துவதில்லை.
- issue: சட்ட மொழியில் ἀνθρώπων என்பதன் பொருள்
  choice: ‘மனிதர்களின்’
  alternative: ‘ஆண்களின்’ அல்லது ‘நபர்களின்’
  rationale: கிரேக்க ἄνθρωπος மனிதரைப் பொதுவாகக் குறிக்க முடியும். தமிழில் ‘மனிதர்கள்’ மூலத்தின் மனிதச் சாட்சிகள் என்ற பொருளை இயல்பாகத் தருகிறது; ஆண் பாலுக்கே வரையறுப்பதைத் தவிர்த்து, மரபான சட்டப் பயன்பாட்டை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானவும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியவுமான நடை. நீதிசார் தொனியைத் தக்கவைக்க ‘சட்டம்’, ‘சாட்சி’, ‘உண்மையானது’ பயன்படுத்தப்பட்டுள்ளன.
