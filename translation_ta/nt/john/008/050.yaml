  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: ta
  text: ஆனால் நான் எனக்குரிய மகிமையைத் தேடுவதில்லை; அதைத் தேடுகிறவரும் நியாயந்தீர்க்கிறவருமான ஒருவர் இருக்கிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “தேடுகிறவரும் நியாயந்தீர்க்கிறவருமானவர் இருக்கிறார்.” ‘தேடுகிறார்’ என்பதன் மறைமுகச் செயப்படுபொருள் முந்தைய கூறிலுள்ள இயேசுவுக்குரிய மகிமை.'
    reason: lexical_alternative
  - marker: b
    text: பெயர் குறிப்பிடப்படாத இவர் சூழலின் அடிப்படையில் பிதாவைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறார்; எனினும் கிரேக்க மூலத்தில் இவ்வசனம் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: ஆனால் நான்
  rationale: δέ-யின் எதிர்மறை மாறுபாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; வெளிப்படையாக உள்ள ἐγώ, ‘நான்’ என்பதற்கு வலியுறுத்தல் அளிக்கிறது.
- source_word: οὐ ζητῶ
  choice: தேடுவதில்லை
  rationale: நிகழ்கால மறுப்பை இயல்பான தமிழில் தருகிறது; பின்னர் வரும் ζητῶν உடனான சொல் தொடர்பையும் ‘தேடு’ என்பதன் மூலம் காக்கிறது.
- source_word: τὴν δόξαν μου
  choice: எனக்குரிய மகிமையை
  rationale: δόξα இங்கு ஒருவருக்குரிய மகிமை அல்லது கௌரவத்தைக் குறிக்கிறது. ‘என் சொந்த மகிமை’ என்பதைவிட ‘எனக்குரிய மகிமை’ இயல்பாகவும், இயேசு தனக்காக மகிமையை நாடவில்லை என்ற கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: ἔστιν ὁ ζητῶν
  choice: அதைத் தேடுகிறவர் ஒருவர் இருக்கிறார்
  rationale: பெயர் குறிப்பிடப்படாத substantival participle-ஐ இயல்பான தமிழில் வழங்குகிறது. ‘அதை’ என்பது முந்தைய ‘மகிமையை’ நோக்கி உள்ளடக்கமாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: καὶ κρίνων
  choice: நியாயந்தீர்க்கிறவரும்
  rationale: κρίνω-வின் நீதித்துறைச் சார்ந்த பொருளை இச்சூழலில் வெளிப்படுத்துகிறது; ζητῶν உடன் இணைந்த நிகழ்கால பங்கேற்புவினையின் இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: தேடுகிறவரும் நியாயந்தீர்க்கிறவருமான பெயர் குறிப்பிடப்படாதவரின் அடையாளம்
  choice: மூலவசனத்தைப் போல முதன்மை உரையில் அவரது அடையாளம் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
  alternative: ‘பிதா அதைத் தேடி நியாயந்தீர்க்கிறார்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: சூழலில் இவர் பிதாவைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்பட்டாலும், கிரேக்க வசனம் இங்கே ‘பிதா’ என்று சொல்லவில்லை. ஆகவே உரையின் கட்டுப்பாடும் உண்மையான மறைபொருள் நிலையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நடை. ‘மகிமை’, ‘நியாயந்தீர்க்கிறவர்’ ஆகியவை யோவான் நற்செய்தியின் இறையியல் மற்றும் நீதித்துறைத் தொனியைத் தக்கவைக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
