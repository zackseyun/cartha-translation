    text: விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்வின் தொடர்ச்சி (யோவான் 7:53–8:11). யோவான் 7:53-இன் குறிப்பைப் பார்க்கவும்.
