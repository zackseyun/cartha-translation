lexical_decisions:
- source_word: λέγουσιν
  choice: என்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் தமிழின் இயல்பான கதைநடைக்கேற்ப இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: ஒருவரை நேரடியாக விளிக்கும் மரியாதை வடிவில், கற்பிப்பவரைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: κατείληπται
  choice: பிடிபட்டிருக்கிறாள்
  rationale: நிறைவுற்ற செயலும் அதன் தற்போதைய தொடர்பும் வெளிப்படும் வகையில் கிரேக்க நிறைவுக்காலச் செயல்பாட்டு வடிவம் மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπαυτοφώρῳ
  choice: செய்துகொண்டிருந்தபோதே
  rationale: குற்றம் நிகழ்ந்துகொண்டிருந்த அதே வேளையில் கையும் களவுமாகப் பிடிக்கப்பட்டாள் என்ற சொல்லிடையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: μοιχευομένη
  choice: விபசாரம் செய்துகொண்டிருந்த
  rationale: அவள் பிடிக்கப்பட்டபோது செயல் நடந்துகொண்டிருந்ததை நிகழ்காலப் பங்கேற்புவினை உணர்த்துவதால் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
