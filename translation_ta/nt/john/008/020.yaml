source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: ta
  text: அவர் தேவாலயத்தில்[a] போதித்துக்கொண்டிருந்தபோது, கருவூலப் பகுதியில் இந்த வார்த்தைகளைப் பேசினார். யாரும் அவரைப் பிடிக்கவில்லை; ஏனெனில் அவருடைய வேளை[b] இன்னும் வந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவாலய வளாகத்தில்”; கிரேக்கச் சொல் உள் திருத்தலத்தை மட்டும் அல்லாமல் முழுத் தேவாலய வளாகத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: யோவான் நற்செய்தியில் “அவருடைய வேளை” என்பது இயேசுவின் உச்சக்கட்டப் பாடுகளும் மகிமைப்படுதலும் நிகழ நியமிக்கப்பட்ட காலத்தைச் சுட்டுகிறது. மாற்றாக, “அவருக்குக் குறிக்கப்பட்ட வேளை.”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: இந்த வார்த்தைகளை
  rationale: ῥήματα என்பது இங்கு உடனடியாக முன்பு கூறப்பட்ட சொற்களைக் குறிக்கிறது; “இந்த வார்த்தைகளை” என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: λαλέω-வின் பேசுதல் அல்லது உரைத்தல் என்ற அடிப்படைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: கருவூலப் பகுதியில்
  rationale: γαζοφυλάκιον என்பது ஒரு தனிப்பெட்டியை மட்டும் அல்லாமல் தேவாலயக் காணிக்கைகள் வைக்கப்பட்ட கருவூலப் பகுதியையும் குறிக்கலாம்; “பகுதியில்” என்பது இடப்பொருளைத் தெளிவாக்குகிறது.
- source_word: διδάσκων
  choice: போதித்துக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினை முதன்மை வினையுடன் ஒரே நேரத்தில் நடந்த செயலைக் காட்டுகிறது; தமிழில் இவ்வடிவம் அந்த நேர ஒத்திசைவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: தேவாலயத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்ல, முழுத் தேவாலய வளாகத்தையும் குறிக்கிறது; வழக்கமான சுருக்கமான சொல்லை முதன்மை உரையில் வைத்து, பரந்த பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: யாரும் அவரைப் பிடிக்கவில்லை
  rationale: πιάζω-வின் பகைமையோடு கைப்பற்றுதல் என்ற பொருளைத் தக்கவைக்கிறது; “கைதுசெய்தல்” என்று மொழிபெயர்த்து சட்டரீதியான நுணுக்கத்தைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ὅτι οὔπω ἐληλύθει
  choice: ஏனெனில் … இன்னும் வந்திருக்கவில்லை
  rationale: ὅτι காரணத்தை அறிமுகப்படுத்துகிறது; இறந்தகால நிறைவுவினையின் முன்னிலைத் தன்மையை “வந்திருக்கவில்லை” இயல்பாகக் காட்டுகிறது.
- source_word: ἡ ὥρα αὐτοῦ
  choice: அவருடைய வேளை
  rationale: யோவான் நற்செய்தியில் ὥρα சுமக்கும் கருத்துச் செறிவை “வேளை” தக்கவைக்கிறது; அதை வெறும் பொதுவான “நேரம்” என்று தளர்த்தவோ, முதன்மை உரையிலேயே “நியமிக்கப்பட்ட” என்று விளக்கவோ இல்லை.
theological_decisions:
- issue: யோவான் நற்செய்தியில் “அவருடைய வேளை” என்பதன் கருத்துச் செறிவு
  choice: முதன்மை உரையில் “அவருடைய வேளை” என்று வைத்தல்
  alternative: “அவருக்குக் குறிக்கப்பட்ட வேளை” அல்லது “அவருடைய நேரம்”
  rationale: இந்தச் சொற்றொடர் இயேசுவின் உச்சக்கட்டப் பாடுகளும் மகிமைப்படுதலும் நிகழும் வேளையை யோவானில் படிப்படியாகச் சுட்டுகிறது. நேரடியான வடிவம் அந்த இறையியல் அழுத்தத்தையும் இன்னும் நிறைவேறாத எதிர்பார்ப்பையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. “கருவூலப் பகுதி” வரலாற்று இடத்தைக் குறிப்பதோடு ஒரு தனிப்பெட்டி என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது; “வேளை” யோவானின் மீளும் கருத்துமொழியைத் தக்கவைக்கிறது.
