  text: Καὶ πάλιν κάτω κύψας ἔγραφεν εἰς τὴν γῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/008.yaml
  text: And again[a], he stooped down and wrote on the ground.
translation:
  language: ta
  text: அவர் மீண்டும்[a] கீழே குனிந்து, தரையில் எழுதிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: விபசாரத்தில் பிடிபட்ட பெண்ணைப் பற்றிய நிகழ்ச்சியின் தொடர்ச்சி (யோவான் 7:53–8:11). யோவான் 7:53-இன் குறிப்பைப் பார்க்கவும்.
    reason: textual_critical
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய செயல் மறுபடியும் நிகழ்வதை இயல்பாகக் குறிக்கிறது.
- source_word: κάτω κύψας
  choice: குனிந்து
  rationale: κάτω உடன் வரும் κύψας, உடலை முன்புறமாகக் கீழே வளைத்த செயலைக் குறிக்கிறது; தமிழில் ‘குனிந்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἔγραφεν
  choice: எழுதிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவமான ἔγραφεν செயல் நடந்துகொண்டிருந்த அம்சத்தை வெளிப்படுத்துகிறது; தமிழ் தொடர்நிலை வினை இதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: εἰς τὴν γῆν
  choice: தரையில்
  rationale: இச்சூழலில் γῆ என்பது அவருக்கு முன்பிருந்த நிலப்பரப்பைக் குறிக்கிறது; ‘தரையில்’ என்பது நவீனத் தமிழில் இயல்பான இடவியல் மொழிபெயர்ப்பு.
theological_decisions:
- issue: இயேசு தரையில் என்ன எழுதினார் என்பதன் பொருள்
  choice: எழுதியவற்றின் உள்ளடக்கத்தையோ நோக்கத்தையோ குறிப்பிடாமல் விடப்பட்டது.
  alternative: அவர் குறிப்பிட்ட பாவங்களையோ நியாயப்பிரமாணத்தையோ எழுதினார் என்று விளக்குவது.
  rationale: கிரேக்க மூலவசனம் எழுதப்பட்டவற்றின் உள்ளடக்கத்தைத் தெரிவிக்கவில்லை; ஆகவே ஊகமான விளக்கத்தை உரையில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க இறந்தகாலத் தொடர்நிலையின் அம்சத்தை ‘எழுதிக்கொண்டிருந்தார்’ எனப் பாதுகாத்து, சொற்சொல் இறுக்கத்தைத் தவிர்த்த optimal-equivalence நடை.
