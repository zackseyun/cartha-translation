lexical_decisions:
- source_word: ἐπορεύθη (πορεύομαι)
  choice: சென்றார்
  rationale: இங்கு இறந்தகால வடிவம் செயப்பாட்டு வடிவில் இருந்தாலும் செய்பாட்டு பொருளில், ஓர் இடத்தை நோக்கிச் சென்ற எளிய இயக்கத்தைக் குறிக்கிறது.
- source_word: ὄρος
  choice: மலை
  rationale: τῶν Ἐλαιῶν என்பதோடு சேர்ந்து நன்கு அறியப்பட்ட புவியியல் பெயரான ‘ஒலிவ மலை’ என்பதைக் குறிக்கிறது.
- source_word: Ἐλαιῶν (ἐλαία)
  choice: ஒலிவ
  rationale: மரபாகவும் இயல்பாகவும் அறியப்படும் ‘ஒலிவ மலை’ என்ற இடப்பெயரை வழங்குகிறது; கிரேக்கப் பன்மை மரங்களைக் குறித்தாலும் தமிழில் இடப்பெயராக ஒருமை வடிவம் இயல்பானது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் ‘ஒவ்வொருவரும் தங்கள் வீட்டிற்குச் சென்றார்கள்’ என்பதற்கு மாறாக இயேசு ஒலிவ மலைக்குச் சென்றதை இணைத்துக் காட்டுகிறது.
