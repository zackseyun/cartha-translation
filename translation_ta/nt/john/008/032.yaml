  text: நீங்கள் சத்தியத்தை அறிவீர்கள்[a], சத்தியம் உங்களை விடுதலையாக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சத்தியத்தை அறிந்துகொள்வீர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: இந்த வசனத்தின் சொற்கள் விடுதலையின் வகையைத் தனியே குறிப்பிடவில்லை; சுற்றியுள்ள பகுதி அதை பாவத்திலிருந்து கிடைக்கும் விடுதலையுடன் தொடர்புபடுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: அறிந்துகொள்வீர்கள்
  rationale: γινώσκω என்பதன் எதிர்கால வடிவம். ‘அறிந்துகொள்வீர்கள்’ என்பது நேரடியான எதிர்காலப் பொருளையும், அறிவைப் பெறுதல் அல்லது உணர்ந்தறிதல் என்ற சூழல்சார் நுணுக்கத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: சத்தியத்தை / சத்தியம்
  rationale: கிரேக்கத்தில் இரு இடங்களிலும் குறிப்புச் சுட்டு இருப்பதால், ஒரே சொல்லை மீண்டும் பயன்படுத்தி அதன் குறிப்புத்தன்மையையும் வாக்கியத்தின் சொல்லாட்சித் திருப்பத்தையும் தக்கவைக்கிறது.
- source_word: ἐλευθερώσει
  choice: விடுதலையாக்கும்
  rationale: ἐλευθερόω என்பதன் காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; விடுதலையின் வகையை மொழிபெயர்ப்பிலேயே குறுக்கிவிடவில்லை.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இது இரண்டாம் நபர் பன்மை வேற்றுமை வடிவம்; மரியாதை/பன்மை இரண்டுக்கும் பொருந்தும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: καὶ ... καὶ
  choice: …; …
  rationale: தமிழில் இரண்டு இணை எதிர்காலக் கூற்றுகளின் முன்னேற்றத்தை அரைப்புள்ளி இயல்பாகக் காட்டுகிறது. ஒவ்வொரு καί-க்கும் ‘மற்றும்’ என இயந்திரமாக மொழிபெயர்ப்பதைத் தவிர்த்து, மூலத்தின் ஒருங்கிணைந்த அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘சத்தியம் உங்களை விடுதலையாக்கும்’ என்பதில் விடுதலையின் தன்மை
  choice: முதன்மை உரையில் விடுதலையின் வகையை வரையறுக்காமல் விடுதல்
  alternative: ‘சத்தியம் பாவத்திலிருந்து உங்களை விடுதலையாக்கும்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இந்த வசனத்தின் சொற்கள் விடுதலையின் வகையைத் தனியே குறிப்பிடவில்லை. அடுத்தடுத்த வசனங்கள் அதை பாவத்துடன் தொடர்புபடுத்தினாலும், அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் வசனத்தின் சுருக்கத்தையும் இறையியல் இழுவிசையையும் தக்கவைக்கிறோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான நடை. ‘சத்தியம்’ என்பது யோவான் நூலின் இறையியல் சொல்லாட்சியையும் ἀλήθεια என்ற சொல்லின் மீளுரைப்பையும் தக்கவைக்கத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
