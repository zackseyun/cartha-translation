source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: ta
  text: உங்கள் தந்தையாகிய ஆபிரகாம் என் நாளைக் காண பேருவகை கொண்டார்[a][b]; அதைக் கண்டார்; மகிழ்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நாளைக் காணும்படி பேருவகை கொண்டார்,” அல்லது “என் நாளைக் காண வேண்டும் என்று பேருவகை கொண்டார்.” கிரேக்கத்திலுள்ள ἵνα கூறை நெருக்கமாகத் தொடர்புடைய பல விதங்களில் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் நாள்” என்பது இயேசுவின் மேசியா சார்ந்த நாளையோ நிறைவேற்றத்தையோ பொதுவாகக் குறிக்கலாம்; எந்தச் சம்பவம் அல்லது காலம் கருத்தில் உள்ளது என்பதை இந்த வசனமே துல்லியமாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: வேதாகமத் தமிழ் வழக்கில் நிலைபெற்றுள்ள முறையில் முற்பிதாவின் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: ὁ πατὴρ ὑμῶν
  choice: உங்கள் தந்தையாகிய
  rationale: உரையாடப்படுவோருடன் ஆபிரகாமுக்குள்ள உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἠγαλλιάσατο
  choice: பேருவகை கொண்டார்
  rationale: வலிமையான மகிழ்ச்சியையும் களிப்பையும் குறிக்கும் வினையின் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: ἵνα ἴδῃ
  choice: காண வேண்டும் என்ற எதிர்பார்ப்பில்
  rationale: ἵνα கூறின் நோக்கம்/எதிர்நோக்கம் சார்ந்த நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதன் பிற சாத்தியமான தொடர்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: என் நாளை
  rationale: இயேசு எந்தச் சம்பவத்தையோ காலத்தையோ குறிப்பிட்டார் என்று மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல், கிரேக்கத்தின் செறிவான சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: καὶ εἶδεν
  choice: அதைக் கண்டு
  rationale: தமிழில் இயல்பாக அமைய, முன் கூறப்பட்ட ‘என் நாள்’ என்பதைக் குறிக்கும் சுட்டுப்பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: καὶ ἐχάρη
  choice: மகிழ்ந்தார்
  rationale: முந்தைய வலிமையான ἀγαλλιάω என்பதிலிருந்து χαίρωவின் பொதுவான மகிழ்ச்சிப் பொருளை வேறுபடுத்திக் காட்டுகிறது.
theological_decisions:
- issue: ‘என் நாள்’ என்பதன் குறிப்பு
  choice: ‘என் நாள்’ என்று சொல்லாட்சியைத் திறந்த நிலையில் வைத்தல்
  alternative: இயேசுவின் பிறப்பு, பூமிக்குரிய ஊழியம், சிலுவை மற்றும் உயிர்த்தெழுதல், மேசியாவின் நிறைவேற்றம், அல்லது இறுதி வெளிப்பாட்டின் நாள் என்று குறிப்பாக்குதல்
  rationale: இந்த வசனம் எந்த நிகழ்வையோ காலத்தையோ தனியாக வரையறுக்கவில்லை; ஆகவே அதன் இறையியல் செறிவும் விளக்கத் திறந்த தன்மையும் பாதுகாக்கப்படுகின்றன.
- issue: ἵνα ἴδῃ என்பதன் தொடர்பு
  choice: எதிர்நோக்கிய எதிர்பார்ப்பாக மொழிபெயர்த்தல்
  alternative: ‘காணும்படி’ என்ற நோக்கமாகவோ ‘காண’ என்ற வினைநிரப்பியாகவோ மொழிபெயர்த்தல்
  rationale: கிரேக்கக் கூறு நெருக்கமாகத் தொடர்புடைய ஒன்றுக்கு மேற்பட்ட முறைகளில் புரிந்துகொள்ளப்படலாம். முதன்மை உரை எதிர்நோக்கத்தைத் தெளிவாக்குகிறது; அடிக்குறிப்பு உண்மையான இலக்கண நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பேருவகை’ மூலத்தின் தீவிர மகிழ்ச்சியை எடுத்துக்காட்டுகிறது; ‘என் நாள்’ விளக்கத் திறந்த நிலையிலேயே வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடருக்குப் பின் [a][b] என அமைக்கப்பட்டுள்ளன.
