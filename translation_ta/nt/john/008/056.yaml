- from: உங்கள் தந்தையாகிய ஆபிரகாம் என் நாளைக் காண வேண்டும் என்ற எதிர்பார்ப்பில் பேருவகை கொண்டார்[a][b]; அதைக் கண்டு மகிழ்ந்தார்.
  to: உங்கள் தந்தையாகிய ஆபிரகாம் என் நாளைக் காண பேருவகை கொண்டார்[a][b]; அதைக் கண்டார்; மகிழ்ந்தார்.
  rationale: The revision removes the interpretively stronger phrase “எதிர்பார்ப்பில்” and uses the natural Tamil infinitival construction “காண பேருவகை கொண்டார்,” which can carry the closely related Greek purpose/content senses without deciding between them. It also represents καὶ εἶδεν καὶ ἐχάρη as two explicit Tamil assertions. Footnote anchors remain attached to “என் நாளைக் காண,” the phrase addressed by both notes.
