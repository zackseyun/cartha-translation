  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “உறுதியாக, உறுதியாக உங்களுக்குச் சொல்கிறேன்: பாவம் செய்கிற ஒவ்வொருவரும் பாவத்தின் அடிமையாக இருக்கிறார்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாவம் செய்துவருகிற ஒவ்வொருவரும் பாவத்தின் அடிமையாக இருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிகழ்காலப் பெயரெச்சம் தொடர்ச்சியான அல்லது வழக்கமான செயலை உணர்த்தக்கூடும்; “பாவம் செய்கிற” என்பது இதை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: இயேசு அவர்களுக்குப் பதிலளித்தார்
  rationale: உரையாடலில் வந்த பதிலை இயல்பான நவீனத் தமிழில் காட்டுகிறது; மூலத்தின் வாக்கிய உறவையும் காக்கிறது.
- source_word: Ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: யோவான் நற்செய்தியில் தனித்துவமாக வரும் இரட்டிப்பு வலியுறுத்தலைத் தக்கவைத்து, சாதாரண வாசகருக்கும் உடனடியாகப் புரியும் தமிழைப் பயன்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் நேரடியான, ஆணித்தரமான அறிவிப்பை நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: பாவம் செய்துவருகிற ஒவ்வொருவரும்
  rationale: ποιῶν என்ற நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான அல்லது வழக்கமான செயல் நிழலை, ஒரே தனிப்பட்ட செயல் என்று மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: δοῦλός ἐστιν τῆς ἁμαρτίας
  choice: பாவத்திற்கு அடிமையாக இருக்கிறார்
  rationale: δοῦλος என்பதிலுள்ள கட்டுப்பாடு மற்றும் உரிமைக்குட்பட்ட நிலையின் வலிமையை ‘அடிமை’ காக்கிறது; தமிழில் ‘பாவத்திற்கு அடிமை’ என்பது இயல்பான தொடர்பாகும்.
theological_decisions:
- issue: பாவம் செய்வதைப் பற்றிய கூற்றின் தன்மை
  choice: தொடர்ச்சியான அல்லது குணவியல்பான செயலை உணர்த்தும் ‘பாவம் செய்துவருகிற’ என்று மொழிபெயர்த்தல்
  alternative: ‘பாவம் செய்கிற’ அல்லது ‘பாவத்தைச் செய்கிற’
  rationale: நிகழ்காலப் பெயரெச்சமான ποιῶν ஒரு தனித்த நிகழ்வை மட்டும் குறிக்காமல் தொடரும் அல்லது வழக்கமான செயலைச் சுட்டக்கூடும். அதேவேளை, மூலத்தில் இல்லாத முழுமையான முறையியல் இறையியல் முடிவை மொழிபெயர்ப்பில் சேர்க்காமல் இருக்கிறது.
- issue: δοῦλος என்ற உருவகத்தின் வலிமை
  choice: ‘அடிமை’
  alternative: ‘ஊழியன்’ அல்லது ‘பணியாள்’
  rationale: இங்கு இயேசுவின் கருத்தின் மையம் பாவத்தின் கட்டுப்பாட்டில் இருப்பதே; எனவே சுதந்திரமின்மையைத் தெளிவாகக் காட்டும் ‘அடிமை’ பொருத்தமானது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. இரட்டிப்பு Ἀμὴν Ἀμὴν என்பதன் வலியுறுத்தல் மீண்டும் கூறுவதன் மூலம் காக்கப்பட்டுள்ளது. ‘அடிமை’ என்ற சொல் உருவகத்தின் கடுமையைக் குறைக்காமல் நேரடியாக வழங்குகிறது.
