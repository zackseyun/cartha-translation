source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: ta
  text: அவர்கள் அவருக்குப் பதிலளித்து, “ஆபிரகாமே எங்கள் தந்தை” என்றார்கள். இயேசு அவர்களிடம், “நீங்கள் ஆபிரகாமின் பிள்ளைகளாக இருந்தால், ஆபிரகாமின் செயல்களைச் செய்துகொண்டிருப்பீர்கள்[a]” என்று கூறுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஆபிரகாமின் பிள்ளைகளாக இருந்திருந்தால், ஆபிரகாமின் செயல்களைச் செய்திருப்பீர்கள்.” கிரேக்க முற்றுப்பெறாத இறந்தகால வினை, உண்மைக்கு மாறான நிபந்தனையைக் குறிப்பதாகப் புரிந்துகொள்ளலாம்.
    reason: நிபந்தனை அமைப்பிலுள்ள கிரேக்க வினையின் காலமும் பொருள் நுணுக்கமும் மாற்று மொழிபெயர்ப்பை அனுமதிக்கின்றன.
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: அவர்கள் அவருக்குப் பதிலளித்து … என்றார்கள்
  rationale: பதில் அளித்தல், கூறுதல் என்ற யோவானின் இரட்டை வினை அமைப்பைத் தமிழில் இயல்பான தொடராகப் பாதுகாக்கிறது.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: ஆபிரகாமே எங்கள் தந்தை
  rationale: ஆபிரகாமை முன்வைத்து வலியுறுத்தும் மூலமொழியின் கூற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தை நிகழ்கால வடிவில் பாதுகாக்கிறது.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: பாலினத்தை வரையறுக்காமல், குடும்ப உறவையும் வழித்தோன்றல் உரிமைக்கான கூற்றையும் இயல்பாகக் குறிக்கிறது.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: ஆபிரகாமின் செயல்கள்
  rationale: ἔργα என்பதன் நடைமுறைச் செயல்கள் அல்லது நடத்தைகள் என்ற பொருளை, சமயச் சிறப்புச்சொல்லைத் திணிக்காமல் தெரிவிக்கிறது.
- source_word: ἐποιεῖτε
  choice: செய்துகொண்டிருப்பீர்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவின் தொடர்ச்சியான செயல் நுணுக்கத்தையும், நிபந்தனைச் சூழலில் எதிர்மறை உண்மையைச் சுட்டக்கூடிய வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆபிரகாமின் பிள்ளைகள் என்பதன் இயல்பு
  choice: வழித்தோன்றல் அல்லது உறவைக் குறிக்கும் மொழியை நேரடியாக வைத்து, அந்தக் கூற்றுக்கும் செயல்களுக்கும் இடையிலான முரண்பாட்டைப் பாதுகாத்தல்
  alternative: இது உடல் வழித்தோன்றலை முற்றிலும் மறுக்கிறது அல்லது ஆன்மீகப் பிள்ளைத்தன்மையை மட்டுமே குறிக்கிறது என்று வெளிப்படையாக விளக்குதல்
  rationale: இந்த வசனம் தந்தைமைக்கான அவர்களுடைய கூற்றை ஆபிரகாமின் செயல்களோடு ஒப்பிடுகிறது; அதற்கும் அப்பாற்பட்ட இறையியல் முடிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: நிபந்தனை வாக்கியத்தின் உண்மைநிலை
  choice: “இருந்தால் … செய்துகொண்டிருப்பீர்கள்” என்று வைத்து, தற்போதைய கூற்றுக்கும் எதிர்பார்க்கப்படும் நடத்தைக்கும் உள்ள பதற்றத்தைப் பாதுகாத்தல்
  alternative: “இருந்திருந்தால் … செய்திருப்பீர்கள்” என்று முழுமையாக எதிர்மறை-உண்மை நிபந்தனையாக வெளிப்படுத்துதல்
  rationale: ἐστε நிகழ்காலமாக இருந்தாலும் ἐποιεῖτε முற்றுப்பெறாத இறந்தகாலம்; ஆகவே முதன்மை உரையில் கலந்த காலநிலைத் தன்மையை இயன்றவரை வைத்துக் கொண்டு, தெளிவான மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. “கிரியைகள்” என்பதற்குப் பதில் பொதுவாகப் புரியும் “செயல்கள்” தேர்ந்தெடுக்கப்பட்டுள்ளது; வரலாற்று நிகழ்காலம் “கூறுகிறார்” எனப் பாதுகாக்கப்பட்டுள்ளது.
