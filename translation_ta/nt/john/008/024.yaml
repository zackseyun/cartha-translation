  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: ta
  text: ஆகவே, நீங்கள் உங்கள் பாவங்களில் இறப்பீர்கள் என்று உங்களிடம் சொன்னேன். ஏனெனில், ‘நான் இருக்கிறேன்’[a] என்று நீங்கள் நம்பாவிட்டால், உங்கள் பாவங்களில் இறப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘நான் இருக்கிறேன்’ என்பதற்குப் பின் வெளிப்படையான பயனிலை இல்லை. சூழலுக்கு ஏற்ப இதை ‘நானே அவர்’ என்றும் புரிந்துகொள்ளலாம்; யோவான் நற்செய்தியில் இந்தச் சொற்றொடர் ஆழமான ஒலிநயத்தையும் கொண்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: ஆகவே ... உங்களிடம் சொன்னேன்
  rationale: οὖν முந்தைய உரையுடன் முடிவுறுத்தும் தொடர்பை ஏற்படுத்துவதால் ‘ஆகவே’ எனவும், εἶπον மற்றும் ὑμῖν இயல்பான தமிழில் ‘உங்களிடம் சொன்னேன்’ எனவும் மொழிபெயர்க்கப்பட்டன.
- source_word: ἀποθανεῖσθε
  choice: சாவீர்கள்
  rationale: எதிர்கால வடிவத்தின் நேரடியான பொருள் ‘சாவீர்கள்’; ‘அழிந்துபோவீர்கள்’ என்பது மூல வினைச்சொல்லில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: உங்கள் பாவங்களிலேயே
  rationale: ἁμαρτίαις என்பதன் பன்மை ‘பாவங்கள்’ என்று காக்கப்பட்டது. ἐν குறிக்கும் நிலை அல்லது சூழலை ‘-இல்’ வெளிப்படுத்துகிறது; ‘-ஏ’ அவர்கள் அந்தப் பாவநிலையிலேயே சாவார்கள் என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ἐὰν γὰρ μὴ
  choice: ஏனெனில் ... நம்பாவிட்டால்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ἐὰν μή எதிர்மறை நிபந்தனையைத் தருகிறது. இவை தமிழில் ‘ஏனெனில் ... -விட்டால்’ என்ற அமைப்பில் தெளிவாக வெளிப்படுகின்றன.
- source_word: πιστεύσητε
  choice: நீங்கள் நம்பாவிட்டால்
  rationale: πιστεύω என்பதன் யோவானிய பயன்பாட்டில் நம்பிக்கையும் சார்ந்திருத்தலும் உள்ளன; இங்கு நிலையான, இயல்பான தமிழ் ‘நம்புதல்’ பொருத்தமானது.
- source_word: ὅτι ἐγώ εἰμι
  choice: ‘நானே அவர்’ என்று
  rationale: கிரேக்கத்தில் ἐγώ εἰμι என்பதற்குப் பின் வெளிப்படையான பயனிலை இல்லை. சூழல்சார்ந்த சுயஅடையாளத்தை தமிழில் இயல்பாகக் காட்ட ‘நானே அவர்’ பயன்படுத்தப்பட்டது; சொல்லுக்கு நெருக்கமான, இறையியல் ஒலிநயத்தைக் கொண்டிருக்கக்கூடிய ‘நான் இருக்கிறேன்’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: பயனிலை வெளிப்படையாக இல்லாத ἐγώ εἰμι என்ற யோவானிய சொற்றொடரின் மொழிபெயர்ப்பு
  choice: ‘நானே அவர்’ என்று
  alternative: ‘நான் இருக்கிறேன்’ என்று
  rationale: இச்சொற்றொடர் சூழலில் ‘நானே அவர்’ என்ற சுயஅடையாளமாகப் புரிந்துகொள்ளப்படலாம்; அதேவேளை, அதன் முழுமையற்ற வெளிப்படை அமைப்பு ஆழமான இறை வெளிப்பாட்டு ஒலிநயத்தையும் கொண்டிருக்கலாம். வாசிக்க இயல்பான அடையாளப் பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடியான வடிவம் அடிக்குறிப்பில் வைக்கப்படுவதால் அந்த இறையியல் பதற்றம் தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘பாவங்களிலேயே’ என்பது மூலத்தின் பன்மையையும் அந்த நிலையிலேயே சாவதன் வலியுறுத்தலையும் காக்கிறது; மேற்கோள் குறிகள் ἐγώ εἰμι என்ற நம்பிக்கையின் உள்ளடக்கத்தைத் தெளிவாக்குகின்றன.
