source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: ta
  text: 'இயேசு பதிலளித்தார்: “எனக்குப் பேய் பிடித்திருக்கவில்லை[a]. மாறாக, நான் என் தந்தையை மதிக்கிறேன்; நீங்களோ என்னை அவமதிக்கிறீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லமைப்புக்கு நெருக்கமாக, “என்னிடம் பேய் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: மறுமொழியாக ... என்றார்
  rationale: யோவானின் உரையாடல் நடையில் வரும் வழக்கமான பதிலுரையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: எனக்குப் பேய் பிடிக்கவில்லை
  rationale: கிரேக்கத்தில் நேரடியாக ‘பேய் எனக்கு இல்லை’ என்ற அமைப்பு இருந்தாலும், அது குறிக்கும் பேய் ஆட்கொண்ட நிலையை ‘பேய் பிடித்தல்’ என்பது இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது. மூல உருவத்துக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: இயேசுவின் மறுப்புக்கும் தந்தையை மதிப்பதற்கும் இடையிலுள்ள தெளிவான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: τιμῶ
  choice: மதிக்கிறேன்
  rationale: τιμάω என்பதன் ‘மதிப்பு/மரியாதை அளித்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; தொடர்ந்து வரும் ἀτιμάζω உடனான எதிர்மறை இணைப்பையும் காக்கிறது.
- source_word: τὸν πατέρα μου
  choice: என் தந்தையை
  rationale: இங்கு இயேசு கடவுளைக் குறிப்பிட்டுத் தமது தந்தை என்று கூறுகிறார். தமிழ் எழுத்துமுறையில் தனிப்பெயர் அல்லாத உறவுமுறைச் சொல்லுக்கு தேவையற்ற தலைப்பெழுத்து வேறுபாடு இல்லை.
- source_word: ἀτιμάζετέ με
  choice: என்னை அவமதிக்கிறீர்கள்
  rationale: ἀτιμάζω என்பதன் மதிப்பைக் குறைத்தல் அல்லது மரியாதையின்றி நடத்துதல் என்ற பொருளைத் தருவதோடு, ‘மதிக்கிறேன்’ என்பதற்கு இயல்பான எதிர்ச்சொல்லாக அமைகிறது.
- source_word: Ἐγώ / ὑμεῖς
  choice: நான் / நீங்களோ
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள வலியுறுத்தப்பட்ட எழுவாய்களின் எதிர்நிலையை ‘நான்’ மற்றும் எதிர்மறைத் துகள் சேர்ந்த ‘நீங்களோ’ என்பவை காக்கின்றன.
theological_decisions:
- issue: ‘என் தந்தை’ என்பவர் யார்
  choice: யோவான் நற்செய்தியின் சூழலின்படி, இயேசு கடவுளைத் தமது தந்தை என்று குறிப்பிடுவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பொதுவான குடும்பப் பொருளில் இயேசுவின் மனிதத் தந்தை
  rationale: உடனடியான யோவானியச் சூழலில் ‘என் தந்தை’ என்பது கடவுளையே குறிக்கிறது; இருப்பினும் மொழிபெயர்ப்பு மூலத்தின் உறவுமுறைச் சொல்லையே வைத்து கூடுதல் விளக்கத்தை வசனத்திற்குள் சேர்க்கவில்லை.
- issue: δαιμόνιον ἔχω என்ற சொற்றொடரின் பொருள்
  choice: இயல்பான தமிழில் ‘பேய் பிடிக்கவில்லை’ என முதன்மைப் பாடத்தில் தரப்பட்டுள்ளது.
  alternative: சொல்லமைப்புக்கு நெருக்கமாக ‘என்னிடம் பேய் இல்லை’
  rationale: கிரேக்க மரபுத்தொடர் ஒருவர்மீது பேயின் ஆதிக்கம் இருப்பதாகக் குறிக்கிறது. தமிழில் ‘என்னிடம் பேய் இல்லை’ என்பது உடைமை அல்லது அருகாமை என்ற தவறான எண்ணத்தை ஏற்படுத்தலாம்; எனவே பொருளைத் தெளிவாகத் தரும் தமிழ் மரபுத்தொடர் தேர்ந்தெடுக்கப்பட்டு, நேரடி உருவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் உரையாடல் நடை. ‘மதிக்கிறேன் / அவமதிக்கிறீர்கள்’ என்ற எதிரிணை மூலத்தின் மரியாதை–அவமரியாதை வேறுபாட்டைக் காக்கிறது. ‘நீங்களோ’ கிரேக்க எழுவாயின் வலியுறுத்தலையும் எதிர்நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
