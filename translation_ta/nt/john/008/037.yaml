source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: ta
  text: நீங்கள் ஆபிரகாமின் சந்ததியார்[a] என்பது எனக்குத் தெரியும். ஆனால் நீங்கள் என்னைக் கொல்ல முயல்கிறீர்கள்; ஏனெனில் என் வார்த்தைக்கு உங்களுக்குள் இடமில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆபிரகாமின் வித்து’ அல்லது ‘ஆபிரகாமின் வழிவந்தவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் வார்த்தை உங்களுக்குள் இடம் பெறுவதில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: ஆபிரகாமின் சந்ததியார்
  rationale: σπέρμα இங்கு ஒருமை வடிவிலுள்ள கூட்டுப்பெயராக, ஆபிரகாமிடமிருந்து வந்த உடல்சார்ந்த வம்சத்தைக் குறிக்கிறது. ‘சந்ததியார்’ என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘வித்து’ என்ற சொல் தமிழில் இச்சூழலில் செயற்கையாக ஒலிக்கும்.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: நீங்கள் என்னைக் கொல்ல முயல்கிறீர்கள்
  rationale: ζητέω + infinitive ஒரு செயலை நாடுதல் அல்லது முயலுதல் என்ற பொருளைக் கொள்ளலாம். நிகழ்காலத் தொடர்ச்சியையும் நோக்கத்தையும் இயல்பான தமிழில் ‘முயல்கிறீர்கள்’ வெளிப்படுத்துகிறது.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: என் வார்த்தை
  rationale: λόγος என்பதன் நேரடியான பொருளையும் யோவான் நூலில் காணப்படும் சொல்லிணைப்பையும் ‘வார்த்தை’ காக்கிறது; ‘செய்தி’ என்பது சாத்தியமானதாயினும் பொருளைச் சற்றுக் குறுக்குகிறது.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: உங்களுக்குள் இடமில்லை
  rationale: χωρέω-வில் உள்ள இடமளித்தல்/ஏற்றுக்கொள்ளுதல் என்ற உருவகத்தை இது காக்கிறது; அவர்களுடைய உள்ளார்ந்த ஏற்றுக்கொள்ளாமையை அளவுக்கு மீறி விளக்காமல் இயல்பாகச் சொல்கிறது.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: ஆபிரகாமின் உடல்சார்ந்த சந்ததியினர் என்பதற்கும் இயேசுவைக் கொல்ல அவர்கள் முயல்வதற்கும் இடையிலான வலுவான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἶδα ὅτι
  choice: என்பது எனக்குத் தெரியும்
  rationale: கிரேக்க உள்ளடக்கக் கூற்றை இயல்பான தமிழ் வாக்கிய அமைப்பில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: ஆபிரகாமின் உடல்சார்ந்த வம்சத்துக்கும் ஆபிரகாமோடு உண்மையாக ஒத்துநடப்பதற்கும் உள்ள தொடர்பு
  choice: ‘ஆபிரகாமின் சந்ததியார்’ என்று வம்சவழிப் பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆபிரகாமின் பிள்ளைகள்’
  rationale: இச்சூழலில் இயேசு அவர்களுடைய உடல்சார்ந்த வம்சத்தை ஏற்றுக்கொள்கிறார்; அதேவேளையில் அவர்களின் செயல்களை எதிர்கொள்கிறார். பின்னுள்ள வசனங்களில் விரிவாகும் உடல்சார்ந்த சந்ததி/உண்மையான பிள்ளைத்தன்மை என்ற வேறுபாட்டை இவ்வசனத்திலேயே தீர்மானித்து விடாமல் ‘சந்ததியார்’ பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘என் வார்த்தை’ என்ற யோவானியச் சொல்லாட்சியும் ‘இடம்’ என்ற உருவகமும் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
