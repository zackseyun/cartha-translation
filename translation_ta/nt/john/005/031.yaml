  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: ta
  text: நான் என்னைக் குறித்து சாட்சி சொன்னால், என் சாட்சி உண்மையானது அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சாட்சி செல்லத்தக்கது அல்ல”; சாட்சியத்தை உறுதிப்படுத்த வேண்டிய சட்டச் சூழலை இது பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: -ஆல் (சொன்னால்)
  rationale: நிபந்தனை வாக்கியத்தை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள எழுவாயைத் தக்கவைத்து, இயேசுவின்மேல் உள்ள மிதமான வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: μαρτυρῶ
  choice: சாட்சி சொன்னால்
  rationale: சாட்சி அளித்தல் என்ற சட்ட மற்றும் சான்றளிப்பு சார்ந்த பொருளை, சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: περὶ ἐμαυτοῦ
  choice: என்னைக் குறித்து
  rationale: περί + genitive என்பதன் நேரடியான ‘என்னைப் பற்றி/என்னைக் குறித்து’ என்ற பொருளைத் தருகிறது; ‘எனக்குச் சாதகமாக’ என்ற கூடுதல் சட்ட நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἡ μαρτυρία μου
  choice: என் சாட்சி
  rationale: μαρτυρῶ என்பதுடனான சொல் தொடர்பைத் தக்கவைத்து, தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: οὐκ ἔστιν ἀληθής
  choice: உண்மையானது அல்ல
  rationale: ἀληθής என்பதன் நேரடியான பொருளைப் பாதுகாத்து, ‘செல்லத்தக்கது அல்ல’ என்று மட்டும் விளக்கி இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் விடுகிறது.
theological_decisions:
- issue: இயேசு தமது சாட்சி ‘உண்மையானது அல்ல’ என்று கூறுவதன் பொருள்
  choice: முதன்மை உரையில் ‘என் சாட்சி உண்மையானது அல்ல’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘என் சாட்சி செல்லத்தக்கது அல்ல’
  rationale: ἀληθής என்பதன் அடிப்படைச் சொற்பொருள் ‘உண்மையானது.’ சாட்சியை உறுதிப்படுத்தும் சட்டச் சூழலில் ‘செல்லத்தக்கது’ என்பது சாத்தியமான பொருளாக இருந்தாலும், அதை முதன்மை உரையில் வைத்தால் யோவான் 8:14 உட்பட உரையில் உள்ள உண்மையான விளக்கப் பதற்றம் முன்கூட்டியே தீர்க்கப்படும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகருக்குப் புரியும், கண்ணியமான நடை. ‘சாட்சி சொல்’ என்பது நீதிமன்ற மற்றும் பொதுப் பயன்பாட்டில் இயல்பானது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
