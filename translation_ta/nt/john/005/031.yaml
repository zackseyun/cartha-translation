  source_fidelity: மூலக் கிரேக்கத்தின் நிபந்தனை அமைப்பு (Ἐὰν), வெளிப்படையான ‘நான்’ என்ற வலியுறுத்தல் (ἐγώ), ‘என்னைக் குறித்து’ (περὶ ἐμαυτοῦ), சாட்சி/சான்றளிப்பு மொழி (μαρτυρῶ, μαρτυρία), மற்றும் ἀληθής என்பதன் நேரடியான ‘உண்மையானது அல்ல’ என்ற பொருள் அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: “நான் என்னைக் குறித்து சாட்சி சொன்னால், என் சாட்சி உண்மையானது அல்ல” என்பது நவீனத் தரத் தமிழில் தெளிவானதும் கண்ணியமானதுமான நடை. ‘சாட்சி சொன்னால்’ மற்றும் ‘என் சாட்சி’ ஆகியவை இயல்பாக அமைந்துள்ளன.
  terminology: ‘சாட்சி’ என்பது இவ்வசனத்தின் சான்றளிப்பு/சட்டப் பின்னணிக்கும் யோவான் நூலில் மீளும் μαρτυρία சொற்களுக்கும் பொருத்தமான, நிலையான தமிழ் சொல்லாகும். முதன்மை உரை ‘உண்மையானது அல்ல’ என்று ἀληθής-ஐ நேரடியாகத் தருகிறது; அடிக்குறிப்பு ‘செல்லத்தக்கது அல்ல’ என்ற சட்டச் சூழல் சார்ந்த மாற்றை சரியாகக் குறிக்கிறது.
