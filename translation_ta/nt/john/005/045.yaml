source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: ta
  text: நான் உங்களைத் தந்தையின் முன்னிலையில் குற்றஞ்சாட்டுவேன் என்று நினைக்காதீர்கள்[a]. உங்கள்மீது குற்றஞ்சாட்டுகிறவர் ஒருவர் இருக்கிறார்—அவர் மோசே[b]; அவர்மீதே நீங்கள் நம்பிக்கை வைத்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களுக்கு எதிராகத் தந்தையிடம் குற்றச்சாட்டுகளைக் கொண்டுவருவேன் என்று எண்ணாதீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்கள் நம்பிக்கை வைத்திருந்த மோசேயே—குறிப்பாகத் திருச்சட்டத்தின் நடுவராகவும் சாட்சியாகவும் கருதப்பட்ட அவர்—அவர்கள்மீது குற்றஞ்சாட்டுகிறவராக இருப்பார்.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: நினைக்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவம் தடைச்சொல்லாக உள்ளது. ‘நினைக்காதீர்கள்’ என்பது இயல்பான, நேரடியான நவீனத் தமிழ்.
- source_word: κατηγορήσω
  choice: குற்றஞ்சாட்டுவேன்
  rationale: κατηγορέω என்பது சட்டரீதியாகக் குற்றம் சாட்டுவதைக் குறிக்கிறது; ‘தண்டனைத் தீர்ப்பளிப்பேன்’ என்று மொழிபெயர்ப்பது மூலத்தின் பொருளை மீறிவிடும்.
- source_word: πρὸς τὸν πατέρα
  choice: தந்தையின் முன்னிலையில்
  rationale: குற்றஞ்சாட்டுதல் என்ற சட்டச் சூழலில் πρός குற்றச்சாட்டு யாருக்கு முன்பாக முன்வைக்கப்படுகிறது என்பதைக் குறிக்கிறது. ‘தந்தையின் முன்னிலையில்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: உங்கள்மீது குற்றஞ்சாட்டுகிறவர் ஒருவர் இருக்கிறார்
  rationale: இந்த அமைப்பு இயேசுவுக்கு மாறாக வேறோர் குற்றஞ்சாட்டுபவரை அறிமுகப்படுத்துகிறது; நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் செயற்பாட்டையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: εἰς ὃν
  choice: அவர்மீதே
  rationale: ἐλπίζω உடன் εἰς ஒருவர்மீது நம்பிக்கை வைப்பதைக் குறிக்கிறது. வலியுறுத்தும் ‘-ஏ’ கிரேக்கத்தில் வெளிப்படையாக உள்ள ὑμεῖς மற்றும் வாக்கியத்தின் எதிர்மறைத் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἠλπίκατε
  choice: நீங்கள் நம்பிக்கை வைத்திருக்கிறீர்கள்
  rationale: நிறைவுக் கால வடிவம் கடந்தகாலத்தில் நிலைநிறுத்தப்பட்டு இப்போதும் தொடரும் நம்பிக்கையைக் காட்டுகிறது; ‘வைத்திருக்கிறீர்கள்’ அந்த நீடித்த விளைவைத் தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றிலுள்ள சட்டரீதியான பொருள்
  choice: ‘குற்றஞ்சாட்டுவேன்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கண்டனம் செய்வேன்’ அல்லது ‘தண்டனைத் தீர்ப்பளிப்பேன்’
  rationale: κατηγορέω குற்றச்சாட்டைக் குறிக்கிறது; இறுதித் தீர்ப்பையோ தண்டனையையோ அல்ல. ஆகவே மூலத்தில் இல்லாத வலுவான நீதித்தீர்ப்புக் கருத்து சேர்க்கப்படவில்லை.
- issue: மோசேமீது வைக்கப்பட்ட நம்பிக்கையின் குறிப்பு
  choice: மூலத்தைப் போலவே ‘அவர்மீதே’ என்று மோசேயை நேரடியாகக் குறிக்கிறது.
  alternative: ‘மோசேயின் சட்டத்தின்மீது’ அல்லது ‘மோசேயின் எழுத்துகள்மீது’
  rationale: சுற்றியுள்ள வசனங்கள் மோசேயின் எழுத்துகளோடு தொடர்பை விளக்கினாலும், இவ்வசனத்தின் கிரேக்கம் மோசேயையே நேரடியாகக் குறிப்பிடுகிறது. விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அந்தத் தெளிவையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டரீதியான உருவகம் ‘குற்றஞ்சாட்டு’ என்பதன் மூலம் தொடர்ச்சியாகக் காக்கப்பட்டுள்ளது. ‘தந்தை’ யோவான் நற்செய்தியின் இறையியல் பட்டப்பெயராக அப்படியே வைக்கப்பட்டுள்ளது; ‘மோசே’ வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
