  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: ta
  text: நான் என் தந்தையின் பெயரில்[a] வந்திருக்கிறேன்; நீங்கள் என்னை ஏற்றுக்கொள்வதில்லை. வேறொருவன் தன் சொந்தப் பெயரில்[b] வந்தால், அவனை ஏற்றுக்கொள்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் தந்தையின் அதிகாரத்துடன்.’ ‘பெயரில்’ என்ற கிரேக்க மொழிவழக்கு ஒருவரைப் பிரதிநிதித்துவப்படுத்துவதையோ அவருடைய அதிகாரத்துடன் வருவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன் சொந்த அதிகாரத்தில்.’ இச்சொற்றொடர், இயேசு தமது தந்தையின் பெயரில் வந்ததற்கு நேர்மாறாக அமைகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: வந்திருக்கிறேன்
  rationale: ἔρχομαι என்பதன் நிறைவேற்றுக்கால வடிவம், முன்பு நிகழ்ந்த வருகையின் தற்போதைய விளைவை உணர்த்துகிறது; ‘வந்திருக்கிறேன்’ இதை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: என் தந்தையின் பெயரில்
  rationale: ‘பெயரில்’ என்ற மூலமொழி வழக்கு பிரதிநிதித்துவத்தையும் அதிகாரத்தையும் குறிக்கலாம். நேரடியான இம்மொழிபெயர்ப்பு அந்தப் பொருள் விரிவையும் இரு கூற்றுகளுக்கிடையிலான இணை அமைப்பையும் காக்கிறது.
- source_word: οὐ λαμβάνετέ με
  choice: நீங்கள் என்னை ஏற்றுக்கொள்வதில்லை
  rationale: இங்கு λαμβάνω என்பது உடலளவில் எடுத்துக்கொள்வதை அல்ல, ஒருவரை ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘ஏற்றுக்கொள்வதில்லை’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: ἄλλος
  choice: வேறொருவன்
  rationale: இயேசுவுக்கு மாறாக வரும் மற்றொரு நபரை எந்தக் கூடுதல் அடையாளமும் சேர்க்காமல் குறிக்கிறது.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: தன் சொந்தப் பெயரில்
  rationale: தந்தையின் பெயரில் வருவதற்கும் தன் பெயரில் வருவதற்கும் இடையிலான கூர்மையான முரண்பாட்டை வெளிப்படையான விளக்கமின்றி காக்கிறது.
- source_word: ἐκεῖνον λήμψεσθε
  choice: அவனை ஏற்றுக்கொள்வீர்கள்
  rationale: முன்னைய λαμβάνω வினையுடன் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது வசனத்தின் சொல்லாட்சிசார் முரண்பாட்டைக் காக்கிறது.
- source_word: πατρός μου
  choice: என் தந்தையின்
  rationale: சூழலில் இது கடவுளைக் குறித்தாலும், தமிழில் மரியாதையையும் உறவையும் இயல்பாகத் தரும் ‘தந்தை’ பயன்படுத்தப்படுகிறது; எழுத்து வடிவில் தனிப்பட்ட பெரிய எழுத்து வேறுபாடு தமிழில் இல்லை.
theological_decisions:
- issue: ‘என் தந்தை’ என்பது கடவுளாகிய தந்தையைக் குறிக்கிறது என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘என் தந்தை’ என்று மட்டும் மொழிபெயர்த்து, சூழல் குறிக்கும் அடையாளத்தை அப்படியே விடுதல்
  alternative: ‘கடவுளாகிய என் தந்தை’ என்று விரிவாக்குதல்
  rationale: யோவான் நற்செய்தியின் சூழலில் குறிப்பு தெளிவாக இருந்தாலும், கிரேக்க மூலத்தில் ‘கடவுள்’ என்ற சொல் இவ்வசனத்தில் இல்லை; அதைச் சேர்ப்பது தேவையற்ற விளக்கமாகிவிடும்.
- issue: ‘பெயரில்’ என்ற வழக்கை நேரடியாக அதிகார மொழியாக மாற்றுவதா
  choice: இரு இடங்களிலும் ‘பெயரில்’ என்ற இணை அமைப்பைக் காத்து, அதிகாரம்/பிரதிநிதித்துவம் என்ற பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘என் தந்தையின் அதிகாரத்தோடு’ / ‘தன் சொந்த அதிகாரத்தில்’ என்று மொழிபெயர்த்தல்
  rationale: ἐν τῷ ὀνόματι அதிகாரத்தையும் பிரதிநிதித்துவத்தையும் உணர்த்தலாம்; ஆனால் அதற்கு மட்டும் பொருளைக் குறுக்காமல், இயேசுவுக்கும் வேறொருவனுக்கும் இடையிலான திட்டமிட்ட இணை முரண்பாட்டை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வந்திருக்கிறேன்’ நிறைவேற்றுக்காலத்தின் தற்போதைய விளைவை இயல்பாக வெளிப்படுத்துகிறது. ‘ஆனால்’ என்பது கிரேக்க καί இங்கு இணைக்கும் எதிர்மறைத் தொடரை தமிழில் தெளிவாக்குகிறது. ‘பெயரில்’ என்ற மறுமொழியும் ‘ஏற்றுக்கொள்’ என்ற வினையின் மறுமொழியும் மூலத்தின் இணை அமைப்பையும் சொல்லாட்சிசார் முரண்பாட்டையும் காக்கின்றன.
