source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: ta
  text: இதன் காரணமாக, யூதர்கள் இயேசுவைத் துன்புறுத்திக்கொண்டிருந்தார்கள்[a]; ஏனெனில் அவர் ஓய்வுநாளில் இவற்றைச் செய்துகொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதேயர்கள்’; சூழலின்படி, ‘யூதத் தலைவர்கள்.’ யோவான் நூலில் இச்சொல் பல இடங்களில் இயேசுவை எதிர்த்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கிறது; வேறுபாடின்றி எல்லா யூத மக்களையும் குறிக்காது.
    reason: மாற்று மொழிபெயர்ப்புகளையும் சூழல்சார் குறிப்பையும் வழங்கி, இனமுழுவதையும் பொதுமைப்படுத்தும் தவறான வாசிப்பைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து ஏற்பட்ட பகைமைக்கான காரணத்தைத் தெளிவாகச் சுட்டுகிறது; வெறும் முடிவைக் குறிக்கும் ‘ஆகவே’ என்பதைவிட கிரேக்கத்தின் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐδίωκον
  choice: துன்புறுத்திக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பகைமைச் செயலை வெளிப்படுத்துகிறது; வசனம் 18-இல் வரும் கொலை நோக்கத்தை முன்கூட்டியே இங்கே சேர்ப்பதில்லை.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்க இன-சமயப் பெயரின் நேரடி மொழிபெயர்ப்பு. சூழலில் குறிக்கப்படும் குழுவை ‘யூதத் தலைவர்கள்’ என்று மூலத்தில் இல்லாத அளவுக்கு முதன்மை உரையிலேயே குறுக்காமல், தேவையான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முன்னர் விவரிக்கப்பட்ட செயல்களைச் சுட்டும் பன்மைச் சுட்டுப்பெயரின் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐποίει
  choice: செய்துகொண்டிருந்தார்
  rationale: நிறைவுறா வினையின் தொடரும் செயற்பாட்டுத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: சபாத்தைக் குறிக்கும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாகப் புரிந்துகொள்ளப்படும் இயல்பான சொல்லாட்சி; அந்த நாளில் நிகழ்ந்த செயலைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு மற்றும் மொழிபெயர்ப்பு
  choice: யூதர்கள்
  alternative: யூதேயர்கள்; சூழலின்படி யூதத் தலைவர்கள்
  rationale: முதன்மை உரை மூலத்தின் நேரடி இன-சமயப் பெயரைப் பாதுகாக்கிறது. அதேவேளை, யோவானின் சூழலில் இது இயேசுவை எதிர்த்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கக்கூடும் என்பதையும் எல்லா யூத மக்களையும் வேறுபாடின்றிக் குறிக்காது என்பதையும் அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இரு நிறைவுறா வினைகளின் தொடர்ச்சித் தன்மை ‘-க்கொண்டிருந்த-’ வடிவங்களால் பாதுகாக்கப்படுகிறது; ‘ஏனெனில்’ காரண உறவைத் தெளிவாக வைத்திருக்கிறது.
