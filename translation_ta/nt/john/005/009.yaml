source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: ta
  text: உடனே அந்த மனிதர் நலமடைந்தார். அவர் தமது படுக்கைப் பாயை[a] எடுத்துக்கொண்டு நடக்கத் தொடங்கினார்.[b] அந்த நாள் ஓய்வுநாளாக இருந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படுக்கையை.’ κράβαττον என்பது பொதுவாக எடுத்துச் செல்லக்கூடிய எளிய படுக்கும் பாய், மெத்தை அல்லது படுக்கையைக் குறிக்கிறது; பெரிய கட்டில் என்ற பொருள் அவசியமில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நடந்துகொண்டிருந்தார்.’ கிரேக்க இறந்தகாலத் தொடர்வினை தொடர்ந்து நடந்த செயலை வலியுறுத்தலாம்; இச்சூழலில் அவர் குணமடைந்தபின் நடக்கத் தொடங்கியதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘அந்த நாளில் ஓய்வுநாளாக இருந்தது’; ‘அந்த நாள் ஓர் ஓய்வுநாளாக இருந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: குணமடைதல் தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐγένετο ὑγιὴς
  choice: நலமடைந்தார்
  rationale: ‘நலமுள்ளவரானார்’ என்ற மாற்றத்தைக் குறிக்கும் கிரேக்கக் கட்டமைப்பை இயல்பாகத் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்பாட்டு முகமையைச் சேர்க்கவில்லை.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதர்
  rationale: கதையில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட ஆண் நபரைக் குறிக்கிறது; ‘மனிதர்’ என்பது இயல்பும் கண்ணியமும் உடைய நடை.
- source_word: ἦρε
  choice: எடுத்துக்கொண்டு
  rationale: பாயைத் தூக்கி எடுத்துச் செல்லும் செயலைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: κράβαττον
  choice: படுக்கைப் பாய்
  rationale: பெரிய கட்டிலைக் காட்டிலும் எடுத்துச் செல்லக்கூடிய எளிய படுக்கும் பாய் அல்லது மெத்தையையே இச்சொல் குறிக்கிறது.
- source_word: περιεπάτει
  choice: நடக்கத் தொடங்கினார்
  rationale: இறந்தகாலத் தொடர்வினை வடிவம் தொடர்ந்த செயலைக் குறிக்கலாம்; குணமாக்கப்பட்ட சூழலில் மீண்டும் நடக்க ஆரம்பித்ததையும் இயல்பாக உணர்த்த முடியும். மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: Ἦν δὲ
  choice: இருந்தது
  rationale: δέ இங்கு வலுவான முரண்பாட்டைவிட அடுத்த நிகழ்வை அமைக்கும் விளக்கக் குறிப்பை அறிமுகப்படுத்துகிறது; தமிழில் தனி இணைப்புச்சொல் இல்லாமலேயே இயல்பாக அமைகிறது.
- source_word: σάββατον
  choice: ஓய்வுநாள்
  rationale: யூதர்களின் சபத் நாளைக் குறிக்கும் வழக்கமான, புரியத்தக்க தமிழ்ச் சொல்.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாள்
  rationale: ‘அந்த நாளில்’ என்ற கிரேக்கச் சொல்லமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: σάββατον என்பதிலுள்ள உருபின்மையைத் தமிழில் வெளிப்படுத்துதல்
  choice: அந்த நாள் ஓய்வுநாளாக இருந்தது
  alternative: அந்த நாள் ஓர் ஓய்வுநாளாக இருந்தது
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு உருபு இல்லை. ஆனால் தமிழில் ‘ஓர் ஓய்வுநாள்’ என்பது பல ஓய்வுநாட்களில் ஒன்றென தேவையின்றி வலியுறுத்தக்கூடும். உருபில்லாத இயல்பான தமிழ், நாளின் தன்மையைச் சொல்லும் மூலத்தின் விளக்கக் குறிப்பைப் பாதுகாக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமை, கண்ணியம், வாசிப்புத் தெளிவு ஆகியவை பேணப்பட்டுள்ளன. ‘படுக்கைப் பாய்’ பொதுவாசகர் பொருளைத் தவறாகப் பெரிய கட்டிலாகக் கற்பனை செய்வதைத் தவிர்க்கிறது. கிரேக்க வினையம்சம் மற்றும் σάββατον என்பதின் உருபின்மை தொடர்பான உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
