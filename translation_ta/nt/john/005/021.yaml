  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: ta
  text: ஏனெனில், தந்தை இறந்தவர்களை எழுப்பி உயிரளிப்பதுபோலவே, மகனும் தாம் விரும்புகிறவர்களுக்கு உயிரளிக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிருள்ளவர்களாக்குகிறார்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் இரண்டு இடங்களிலும் ஒரே வினைச்சொல் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், … போலவே
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், ὥσπερ என்பதன் ஒப்பீட்டை ‘போலவே’ என்பதும் இயல்பான தமிழில் காக்கின்றன.
- source_word: ὁ πατὴρ
  choice: தந்தை
  rationale: யோவான் நற்செய்தியின் சூழலில் கடவுளைக் குறிக்கும் உறவுமுறைப் பட்டமாக இயல்பாக அமைகிறது.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: இறந்தவர்களை எழுப்பி
  rationale: உயிர்த்தெழுதல் சார்ந்த சூழலில் ἐγείρει என்பதன் ‘எழுப்புதல்’ என்ற பொருளையும், τοὺς νεκρούς என்பதன் மனிதக் கூட்டுக் குறிப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ζῳοποιεῖ
  choice: உயிரளிக்கிறார்
  rationale: ‘உயிருள்ளவர்களாக்குகிறார்’ என்ற அடிப்படைப் பொருளை நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் தருகிறது; இரண்டு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது தந்தை–மகன் இணைத்தன்மையைப் பாதுகாக்கிறது.
- source_word: οὕτως καὶ
  choice: போலவே, … மகனும்
  rationale: இரு செயல்களுக்கிடையிலான வலுவான ஒப்புமையையும் ‘மகனும்’ என்ற இணைப்பையும் தமிழின் இயல்பான வாக்கிய அமைப்பில் தருகிறது.
- source_word: ὁ υἱὸς
  choice: மகன்
  rationale: இச்சூழலில் இயேசுவைக் குறிக்கும் உறவுமுறைப் பட்டத்தைத் தந்தை–மகன் இணைப்புடன் நேரடியாகக் காக்கிறது.
- source_word: οὓς θέλει
  choice: தாம் விரும்புகிறவர்களுக்கு
  rationale: θέλει என்பதன் உண்மையான விருப்பம் அல்லது சித்தம் சார்ந்த வலிமையை இயல்பான நவீன தமிழில் தருகிறது. மரியாதை ஒருமையைச் சுட்ட ‘தாம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: உயிரளிப்பதில் தந்தை–மகன் இணைத்தன்மை
  choice: தந்தை உயிரளிப்பதுபோலவே மகனும் உயிரளிக்கிறார்
  alternative: ஒப்புமையின் வலிமையைக் குறைக்கும் தளர்வான மொழிபெயர்ப்பு
  rationale: கிரேக்க உரை தந்தையின் செயலுக்கும் மகனின் செயலுக்கும் நேரடியான ஒப்புமையை அமைக்கிறது. அந்தக் கிறிஸ்துவியல் வலிமையைச் சேர்த்தும் குறைத்தும் விடாமல் மொழிபெயர்ப்பு காக்கிறது.
- issue: θέλει என்பதில் மகனின் விருப்பம் அல்லது சித்தம்
  choice: தாம் விரும்புகிறவர்களுக்கு
  alternative: தாம் சித்தங்கொள்ளுகிறவர்களுக்கு
  rationale: ‘விரும்புகிறார்’ என்பது நவீன வாசகர்களுக்குப் புரியும் இயல்பான சொல்; அதே நேரத்தில் மகனின் தேர்வு சார்ந்த செயற்பாட்டை மங்கச் செய்யாது. ‘சித்தங்கொள்கிறார்’ என்பது சாத்தியமானதாயினும் அதிகமாகச் சமயநடை கொண்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தெய்வீக நபர்களைக் குறிக்கும் வினைமுற்றுகளில் மரியாதை ஒருமையும், மகனைக் குறிக்கும் இடத்தில் ‘தாம்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
