source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: ta
  text: இயேசு இந்த மனிதர் அங்கே படுத்திருப்பதைக் கண்டு, அவர் ஏற்கெனவே நீண்ட காலமாக இந்நிலையில் இருந்ததை[a] அறிந்து, அவரிடம், “நலம்பெற விரும்புகிறாயா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஏற்கெனவே நீண்ட காலமாக அங்கே இருந்ததை.”
    reason: πολὺν ἤδη χρόνον ἔχει என்ற கிரேக்கச் சொற்றொடர் எது நீண்ட காலமாக இருந்தது என்பதை வெளிப்படையாகக் குறிப்பிடவில்லை. சூழல் அவரது நீடித்த நிலையைக் குறிக்கிறது; ஆனால் நிகழ்விடத்தில் அவர் நீண்ட காலம் இருந்தார் என்ற வாசிப்பும் சாத்தியமாகும்.
lexical_decisions:
- source_word: τοῦτον
  choice: அந்த மனிதர்
  rationale: சூழலில் குறிப்பிட்ட நோயுற்ற மனிதரைச் சுட்டுகிறது; தமிழில் வெறும் ‘இவரை’ என்பதைக் காட்டிலும் ‘அந்த மனிதர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἰδὼν
  choice: கண்டு
  rationale: முதன்மை வினைக்கு முன்னர் நிகழ்ந்த செயலைத் தமிழ் வினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατακείμενον
  choice: அங்கே படுத்திருப்பதை
  rationale: அவரது படுத்த நிலையையும் குளத்தருகிலுள்ள நிகழ்விடத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γνοὺς
  choice: அறிந்து
  rationale: இயேசுவுக்கு அந்த நீண்டகால நிலை தெரிந்திருந்ததைச் சொல்கிறது; அவர் அதை எவ்வாறு அறிந்தார் என்பதை வரையறுக்கவில்லை.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: அவர் ஏற்கெனவே நீண்ட காலமாக அங்கே இருந்ததை
  rationale: மூலத்தில் ‘நீண்ட காலமாக இருக்கிறார்’ என்ற முழுமையற்ற சொற்றொடர் உள்ளது. முதன்மை உரை நிகழ்விடத்தில் நீண்ட காலம் இருந்தார் என்ற சூழல்சார் பொருளைத் தருகிறது; அவரது உடல்நிலை நீண்ட காலம் நீடித்தது என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: λέγει αὐτῷ
  choice: அவரிடம் … என்று கேட்டார்
  rationale: வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடை இறந்தகாலமாக வழங்குகிறது; நேரடி வினா என்பதால் ‘கேட்டார்’ பொருத்தமானது.
- source_word: Θέλεις
  choice: விரும்புகிறாயா
  rationale: விருப்பம் அல்லது மனவிருப்பத்தை நேரடியாகவும் நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ὑγιὴς γενέσθαι
  choice: நலம்பெற
  rationale: ஆரோக்கியமான புதிய நிலையை அடைவது என்ற γίνομαι வினையின் மாறுதல் சார்ந்த பொருளையும் ὑγιής என்பதன் உடல்நலப் பொருளையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: γνοὺς என்பதில் இயேசுவின் அறிவின் தன்மை
  choice: இயேசு அறிந்தார் என்று மட்டும் மொழிபெயர்த்து, அவர் அறிந்த முறையைச் சொல்லாமல் விடுதல்
  alternative: அவர் இயற்கைக்கு அப்பாற்பட்ட முறையில் அறிந்தார் அல்லது கவனிப்பு/தகவல் மூலம் தெரிந்துகொண்டார் என்று வெளிப்படையாகக் கூறுதல்
  rationale: இயேசு அறிந்திருந்தார் என்று வசனம் கூறினாலும், அந்த அறிவு கிடைத்த முறையை விளக்கவில்லை; மொழிபெயர்ப்பு எந்த ஒரு இறையியல் முடிவையும் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவின் நேரடி கேள்வியில் ஒருமை நெருக்க உருபு இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற மருத்துவ அல்லது சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
