revisions:
- from: ஏனெனில், தந்தை ஒருவரையும் நியாயந்தீர்ப்பதில்லை; மாறாக, நியாயந்தீர்க்கும் பொறுப்பு முழுவதையும் மகனுக்குக் கொடுத்திருக்கிறார்.
  to: ஏனெனில், தந்தை ஒருவரையும் நியாயந்தீர்ப்பதில்லை; மாறாக, நியாயத்தீர்ப்பு முழுவதையும் மகனுக்குக் கொடுத்திருக்கிறார்.
  rationale: The revision removes the added interpretive term ‘பொறுப்பு’ and uses ‘நியாயத்தீர்ப்பு’ to represent κρίσις directly, while preserving the explicit contrast and the completed action with continuing result expressed by δέδωκεν. No footnote is required.
