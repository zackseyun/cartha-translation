  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ta
  text: ஏனெனில், தந்தை ஒருவரையும் நியாயந்தீர்ப்பதில்லை; மாறாக, நியாயத்தீர்ப்பு முழுவதையும் மகனுக்குக் கொடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கருத்தை விளக்கும் இணைப்பாக உள்ளது. οὐδέ-யின் எதிர்மறை வலிமை தொடரும் ‘ஒருவரையும் ... இல்லை’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: ὁ πατὴρ
  choice: தந்தை
  rationale: யோவான் சூழலில் கடவுளை மகனுடனான உறவில் குறிக்கும் தனிச்சிறப்புடைய பட்டமாக இது பயன்படுகிறது.
- source_word: κρίνει οὐδένα
  choice: ஒருவரையும் நியாயந்தீர்ப்பதில்லை
  rationale: நிகழ்கால வினை பொதுவான உண்மையைச் சுட்டுகிறது. ‘நியாயந்தீர்ப்பது’ என்பது கண்டனம் செய்வது என்று பொருளைச் சுருக்காமல், தீர்ப்பிடும் செயலின் பரந்த பொருளைக் காக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: தந்தை நியாயந்தீர்ப்பதில்லை என்பதற்கும் அந்தப் பொறுப்பை மகனுக்குக் கொடுத்திருப்பதற்கும் இடையிலான வலுவான எதிர்மறை மாறுபாட்டைக் காட்டுகிறது.
- source_word: τὴν κρίσιν πᾶσαν
  choice: நியாயந்தீர்க்கும் பொறுப்பு முழுவதையும்
  rationale: கிரேக்கச் சொற்றொடர் தீர்ப்பின் முழுமையையும் குறிக்கிறது. தமிழில் வெறும் ‘தீர்ப்பு முழுவதையும்’ என்பது முடிவுகளையே குறிக்கக்கூடும்; இத்தேர்வு தீர்ப்பிடும் செயல் அல்லது பணி முழுவதையும் இயல்பாகத் தெரிவிக்கிறது, அதேவேளை ‘அதிகாரம்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: δέδωκεν
  choice: கொடுத்திருக்கிறார்
  rationale: கிரேக்க நிறைவேற்றுக் காலம் முடிந்த செயலும் அதன் தொடரும் விளைவும் காட்டுவதால், ‘கொடுத்திருக்கிறார்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: τῷ υἱῷ
  choice: மகனுக்கு
  rationale: மூலத்தில் உடைமைச் சுட்டுப்பெயர் இல்லாததால் ‘தமது மகனுக்கு’ என்று சேர்க்காமல், யோவானில் முக்கியமான ‘மகன்’ என்ற பட்டத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தந்தை நியாயந்தீர்ப்பதற்கும் மகன் நியாயந்தீர்ப்பதற்கும் உள்ள உறவு
  choice: தந்தை ஒருவரையும் நியாயந்தீர்ப்பதில்லை; நியாயந்தீர்க்கும் பொறுப்பு முழுவதையும் மகனுக்குக் கொடுத்திருக்கிறார் என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மகனைச் சாராமல் தந்தை யாரையும் நியாயந்தீர்ப்பதில்லை’ அல்லது இறுதி நியாயத்தீர்ப்பை மட்டும் குறிக்கிறது என்று விளக்குதல்.
  rationale: மூலத்தில் இல்லாத இசைவாக்கும் வரம்புகளைக் கூட்டாமல், வசனத்தின் இறையியல் இழுவிசையை அப்படியே காக்கிறது.
- issue: ‘மகன்’ என்ற கிறிஸ்தியல் பட்டம்
  choice: ‘மகன்’ என்ற பட்டம் தக்கவைக்கப்பட்டது.
  alternative: ‘அவருடைய மகன்’ என்று உடைமைத் தொடர்பை வெளிப்படையாகச் சேர்த்தல்.
  rationale: கிரேக்கத்தில் ‘மகன்’ என்பது குறிப்பிட்ட பட்டமாக வருகிறது; உடைமைச் சுட்டுப்பெயர் சேர்ப்பது தேவையற்ற விரிவாக்கமாகும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிய புரிதலும் கொண்ட நடை. ‘நியாயந்தீர்க்கும் பொறுப்பு’ என்பது மூலத்தின் κρίσις என்ற பெயர்ச்சொல்லின் செயல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. அடிக்குறிப்புகள் தேவையில்லை.
