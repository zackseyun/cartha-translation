language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ta
  text: 'நோயுற்றவர் அவருக்குப் பதிலளித்தார்: “ஆண்டவரே, தண்ணீர் கலங்கும்போது என்னைக் குளத்திற்குள் இறக்கிவிட எனக்கு யாரும் இல்லை. ஆனால் நான் குளத்திற்குச் சென்று கொண்டிருக்கும்போது, வேறொருவர் எனக்கு முன்னால் இறங்கிவிடுகிறார்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: நோயுற்றிருந்தவர்
  rationale: நோயால் பலவீனமுற்றிருந்த மனிதரைக் குறிக்கும் substantival participle; இயல்பான, மரியாதையான தமிழில் பெயர்ச்சொல் வடிவில் தரப்பட்டது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பதன் நேரடியான அழைப்புமுறைப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் மரியாதை அழைப்பாகவும் உயர்ந்த பட்டமாகவும் இருக்கக்கூடிய நுண்மையைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: என்னைக் குளத்தில் இறக்கிவிட
  rationale: βάλῃ என்பதற்கு சொற்சொல்லாக ‘போட’ என்றாலும், இயலாமையுற்ற ஒருவரை நீர்த்தேக்கத்தில் சேர்ப்பதைக் குறிக்கும் சூழலில் ‘இறக்கிவிட’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: தண்ணீர் கலக்கப்படும்போது
  rationale: இது passive வடிவம்; தண்ணீரைக் கலக்குபவர் யார் என்பதை மூலவாக்கியம் வெளிப்படையாகக் கூறாததால் passive நுண்மையைப் பாதுகாக்கிறது.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: நான் போய்க்கொண்டிருக்கும்போதே
  rationale: அவர் தாமாகக் குளத்தை நோக்கி நகரும் நேரத்திற்குள் மற்றவர் முந்துவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καταβαίνει
  choice: இறங்கிவிடுகிறார்
  rationale: குளத்துக்குள் ‘இறங்குதல்’ என்ற மூலத்தின் திசை உணர்வைத் தக்கவைக்கிறது; நிகழ்வின் வழக்கமான/மீள்மீள் தன்மையையும் தமிழ் நிகழ்காலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Κύριε என்பது மரியாதை அழைப்பா அல்லது கிறிஸ்துவியல் பட்டமா
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: மூலச்சொல்லின் பொருள் வரம்பில் இரண்டும் சாத்தியம். ‘ஆண்டவரே’ யோவான் நூலில் உள்ள கிறிஸ்துவியல் ஒலிப்பையும் மரியாதை அழைப்பின் சாத்தியத்தையும் ஒரே வடிவில் தக்கவைக்கிறது; மனிதன் இந்நேரத்தில் இயேசுவை முழுமையாக அறிந்திருந்தான் என்று உரை கட்டாயப்படுத்தவில்லை.
- issue: தண்ணீர் கலங்குவதற்கான செய்பவர்
  choice: கலக்கப்படும்போது
  alternative: கலங்கும்போது
  rationale: SBLGNT உரையின் passive வினையைப் பாதுகாக்கிறது; சில கையெழுத்துப் பிரதிகளில் விரிவாக வரும் தூதர் விளக்கத்தை இவ்வசனத்துக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. நேரடி உரையின் மரியாதைத் தொனிக்காக “ஆண்டவரே” பயன்படுத்தப்பட்டது. “குளம்” என்பது கொலும்பேத்ரா குறிக்கும் நீர்த்தேக்கம்/குளத்திற்கான எளிதில் புரியும் சொல்.
