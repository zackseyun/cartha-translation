id: JHN.5.44
reference: John 5:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: ta
  text: ஒருவரிடமிருந்து ஒருவர் மகிமையைப்[a] பெற்றுக்கொண்டு, ஒரே கடவுளிடமிருந்து[c] வரும் மகிமையைத் தேடாத நீங்கள் எப்படி நம்ப முடியும்[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘மகிமை’ என்று வரும் இரு இடங்களிலும் ‘கௌரவம்’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: δόξα).'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களால் எப்படி நம்ப இயலும்?’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஒரே ஒருவரான கடவுளிடமிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ὑμεῖς πιστεῦσαι
  choice: நீங்கள் எப்படி நம்ப முடியும்
  rationale: πῶς எழுப்பும் சொல்லாட்சிக் கேள்வியையும், δύνασθε குறிக்கும் இயலுமையையும், ὑμεῖς தரும் வெளிப்படையான எழுவாய் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: δόξαν … τὴν δόξαν
  choice: மகிமையை … மகிமையை
  rationale: இரு இடங்களிலும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்தி, மனிதர்களிடமிருந்து பெறப்படும் δόξαவுக்கும் கடவுளிடமிருந்து வரும் δόξαவுக்கும் இடையிலான திட்டமிட்ட ஒப்புமையையும் முரண்பாட்டையும் காக்கிறது.
- source_word: παρ’ ἀλλήλων
  choice: ஒருவரிடமிருந்து ஒருவர்
  rationale: மனிதர்கள் பரஸ்பரம் மகிமையைப் பெறுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λαμβάνοντες
  choice: பெற்றுக்கொண்டு
  rationale: தொடர்ந்து மனித மகிமையைப் பெறும் அவர்களுடைய நிலைப்பாட்டை வினையெச்ச வடிவில் வெளிப்படுத்துகிறது; ‘ஏற்றுக்கொண்டு’ என்பதிலுள்ள கூடுதல் ஒப்புதல் நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: καὶ … οὐ ζητεῖτε
  choice: தேடாத
  rationale: முந்தைய வினையெச்சத்துடன் இயல்பாக இணைந்து, கடவுளிடமிருந்து வரும் மகிமையை அவர்கள் நாடாத எதிர்மறை நிலையைத் தெளிவாக்குகிறது.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: ஒரே கடவுளிடமிருந்து வரும் மகிமை
  rationale: மகிமையின் மூலத்தைத் தெளிவுபடுத்தி, μόνος குறிக்கும் கடவுளின் தனித்தன்மையை விரிவாக்கமின்றி காக்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் πιστεῦσαι என்பதன் பொருள்
  choice: நம்ப
  alternative: நம்பிக்கை வைக்க
  rationale: ‘நம்ப’ என்பது πιστεύω என்பதன் பரந்த பொருளையும் யோவானியச் சூழலிலுள்ள நம்பிக்கையின் அழைப்பையும் காக்கிறது; இன்னும் குறிப்பான கோட்பாட்டுப் பொருளைத் திணிக்கவில்லை.
- issue: இரு இடங்களிலும் δόξαவை ஒரேவிதமாக மொழிபெயர்த்தல்
  choice: மகிமை
  alternative: கௌரவம்
  rationale: மனித மூலத்திலிருந்து வரும் δόξαவுக்கும் கடவுள் மூலத்திலிருந்து வரும் δόξαவுக்கும் உள்ள இறையியல் நிறைந்த முரண்பாட்டையும் சொல் மீளுருவாக்கத்தையும் பாதுகாக்கிறது.
- issue: τοῦ μόνου θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: ஒரே கடவுள்
  alternative: ஒரே ஒருவரான கடவுள்
  rationale: கடவுளின் தனித்தன்மையை நேரடியாகக் கூறுகிறது; வசனம் வெளிப்படையாகச் சொல்லாத கிறிஸ்தவியல் அல்லது வேறு கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் சொல்லாட்சிக் கேள்வியின் கூர்மையும் காக்கப்பட்டுள்ளன. ‘மகிமை’ மனிதர்களிடமிருந்து பெறப்படுவது தமிழில் சற்றே குறிப்பிடத்தக்கதாக ஒலித்தாலும், மூலத்தின் திட்டமிட்ட சொல் மீளுருவாக்கத்தையும் இறையியல் பதற்றத்தையும் பாதுகாப்பதற்காக அதே சொல் இரு இடங்களிலும் வைக்கப்பட்டுள்ளது.
