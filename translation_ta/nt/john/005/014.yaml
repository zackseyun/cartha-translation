- from: இவற்றுக்குப் பிறகு இயேசு அவனை ஆலயத்தில் கண்டு, அவனிடம், “இதோ, நீ நலமடைந்திருக்கிறாய்.[a] இனி பாவம் செய்யாதே; இதைவிட மோசமானது எதுவும் உனக்கு நேரிடாதபடி பார்த்துக்கொள்”[b] என்றார்.
  to: இவற்றுக்குப் பிறகு இயேசு அவனை ஆலயத்தில் கண்டு, அவனிடம், “இதோ, நீ நலமடைந்திருக்கிறாய்.[a] இதைக் காட்டிலும் மோசமானது ஏதாவது உனக்கு நேராமல் இருக்க, இனிப் பாவம் செய்யாதே”[b] என்றார்.
