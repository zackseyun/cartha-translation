source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு இயேசு அவனை ஆலயத்தில் கண்டு, அவனிடம், “இதோ, நீ நலமடைந்திருக்கிறாய்.[a] இதைக் காட்டிலும் மோசமானது ஏதாவது உனக்கு நேராமல் இருக்க, இனிப் பாவம் செய்யாதே”[b] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நலமடைந்திருக்கிறாய்” என்பதற்கான கிரேக்கச் சொற்றொடர், நிகழ்ந்த மாற்றத்தின் விளைவாக அவன் இப்போது நலமான நிலையில் இருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த எச்சரிக்கை, அவனுடைய முந்தைய நோய் ஒரு குறிப்பிட்ட பாவத்தால் ஏற்பட்டதா என்பதையோ, “மோசமானது” இவ்வுலகத் துன்பமா, இறுதித் தீர்ப்பா, அல்லது இரண்டுமா என்பதையோ வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரையும் யோவானின் நிகழ்வுத் தொடரையும் நெருக்கமாகப் பாதுகாக்கிறது; நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: εὑρίσκει
  choice: கண்டு
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழின் இயல்பான இறந்தகாலக் கதைநடையில் அளிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: ἱερόν என்பது உட்பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது; ‘ஆலயம்’ சுருக்கமாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: Ἴδε
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சொல்லின் வலிமையைப் பாதுகாக்கும், மரியாதையானதும் வழக்கிலுள்ளதுமான தமிழ் வடிவம்.
- source_word: ὑγιὴς γέγονας
  choice: நீ நலமடைந்திருக்கிறாய்
  rationale: γέγονας என்ற நிறைவுக் கால வடிவம், நிகழ்ந்த மாற்றத்தையும் அதன் தொடரும் விளைவான தற்போதைய நலநிலையையும் சுட்டுகிறது.
- source_word: μηκέτι ἁμάρτανε
  choice: இனி பாவம் செய்யாதே
  rationale: இப்போதிலிருந்து பாவத்தை நிறுத்த வேண்டும் என்ற கட்டளையைத் தெளிவாகச் சொல்கிறது; கிரேக்க நிகழ்காலக் கட்டளையின் கூறுமுறையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: இதைவிட மோசமானது எதுவும் உனக்கு நேரிடாதபடி பார்த்துக்கொள்
  rationale: எதிர்மறை நோக்கம் அல்லது எச்சரிக்கைத் தன்மையை இயல்பான தமிழில் தெரிவித்து, τι என்பதன் வரையறுக்கப்படாத பொருளையும் χεῖρον என்பதன் ஒப்பீட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் எச்சரிக்கையில் பாவத்துக்கும் துன்பத்துக்கும் உள்ள தொடர்பு
  choice: எதிர்காலப் பாவத்துடன் தொடர்புடைய இன்னும் மோசமான விளைவை இயேசு எச்சரிக்கிறார் என்ற அளவில் நேரடியாக மொழிபெயர்த்து, முந்தைய நோய் ஒரு குறிப்பிட்ட பாவத்தால் ஏற்பட்டது என்று கூறாமல் விடுதல்.
  alternative: முந்தைய நோய் ஒரு குறிப்பிட்ட பாவத்திற்கான நேரடித் தண்டனை என்று தீர்மானித்தல்; அல்லது ‘மோசமானது’ உலகியல் துன்பத்தை மட்டுமே அல்லது இறுதித் தீர்ப்பை மட்டுமே குறிக்கிறது என்று வரையறுத்தல்.
  rationale: கிரேக்க உரை பாவத்தை நிறுத்தும்படி எச்சரித்து, மோசமான ஒன்று நேரிடக்கூடும் என்கிறது; ஆனால் முந்தைய நோயின் காரணத்தையோ வரவிருக்கும் விளைவின் தன்மையையோ வெளிப்படையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ வேதாகம உரைக்கேற்ற கவன ஈர்ப்பைத் தக்கவைக்கிறது. ‘ஆலயம்’ என்பது ஆலய வளாகத்தைக் குறிக்கும் வகையில் பயன்படுத்தப்பட்டுள்ளது; எந்தப் பிரிவுசார் விளக்கமும் சேர்க்கப்படவில்லை.
