id: JHN.5.12
reference: John 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: ta
  text: ஆகவே அவர்கள் அவனிடம், “உன்னிடம், ‘எடுத்துக்கொண்டு நட’ என்று சொன்ன மனிதன் யார்?” என்று கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில், “எடுத்துக்கொண்டு நட” என்று மட்டுமே உள்ளது. எதை எடுத்துக்கொள்ள வேண்டும் என்பது முந்தைய சூழலிலிருந்து புரிகிறது; அது அந்த மனிதன் படுத்திருந்த படுக்கைப் பாயைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: கேட்டார்கள்
  rationale: ἐρωτάω என்பதன் இறந்தகாலக் குறிப்பு; சூழலில் பகைமையை அளவுக்கு மீறிச் சேர்க்காமல் இயல்பான விசாரணையைத் தெரிவிக்கிறது.
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய வசனத்திலிருந்து வரும் காரணவிளைவு அல்லது தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவனிடம்
  rationale: குணமடைந்த மனிதனைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்; தமிழில் ‘கேள்’ என்பதுடன் இயல்பாக இடவேற்றுமையில் வருகிறது.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: அந்த மனிதன் யார்?
  rationale: குறிப்பிட்ட ஆண் நபரை விசாரிக்கும் கேள்வியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὁ εἰπών σοι
  choice: உன்னிடம் … என்று சொன்ன
  rationale: பெயரெச்சப் பயன்பாட்டிலுள்ள இறந்தகால வினையெச்சத்தைத் தமிழின் இயல்பான தொடர்புத் தொடராக வழங்குகிறது.
- source_word: Ἆρον
  choice: எடுத்துக்கொள்
  rationale: αἴρω என்ற கட்டளையின் பொருளைப் பாதுகாக்கிறது; கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை.
- source_word: καὶ περιπάτει
  choice: நட
  rationale: நிகழ்காலக் கட்டளையின் அம்சத்தை அளவுக்கு மீறி விளக்காமல், குணமாக்கல் கட்டளையில் இயல்பான தமிழைப் பயன்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளோம். கிரேக்கத்தில் மறைமுகமாக உள்ள செயப்படுபொருளை வசனத்தில் சேர்க்காமல் அதன் தெளிவின்மையைப் பாதுகாத்து, அடிக்குறிப்பில் சூழலை விளக்கியுள்ளோம்.
