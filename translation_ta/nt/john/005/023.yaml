revisions:
- from: அனைவரும் தந்தையை மதிப்பதுபோலவே மகனையும் மதிக்க வேண்டும் என்பதற்காகவே இப்படிச் செய்தார். மகனை மதிக்காதவர், அவரை அனுப்பிய தந்தையையும் மதிப்பதில்லை.
  to: அனைவரும் தந்தையை மதிப்பதுபோலவே மகனையும் மதிக்கும்படி. மகனை மதிக்காதவர், அவரை அனுப்பிய தந்தையையும் மதிப்பதில்லை.
