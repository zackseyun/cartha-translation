source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ta
  text: அனைவரும் தந்தையை மதிப்பதுபோலவே மகனையும் மதிக்கும்படி. மகனை மதிக்காதவர், அவரை அனுப்பிய தந்தையையும் மதிப்பதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: என்பதற்காகவே
  rationale: முந்தைய வசனத்துடன் இணையும் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தனிவசனமாக வாசிக்கும்போதும் தொடர்பு தெளிவாக இருக்க ‘இப்படிச் செய்தார்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: மதிக்க / மதிக்காதவர் / மதிப்பதில்லை
  rationale: τιμάω என்பதன் மரியாதை செலுத்துதல், உரிய மதிப்பு அளித்தல் ஆகிய பொருள்களை ‘மதி’ இயல்பாகத் தருகிறது; வினைச்சொல் மீளுருவாக்கமும் முழுவதும் காக்கப்படுகிறது.
- source_word: τὸν υἱὸν
  choice: மகனை
  rationale: யோவான் சூழலில் இது இயேசுவைக் குறிக்கும் உறவுமுறைப் பட்டப்பெயர்; தமிழில் தேவையற்ற விளக்கமின்றி இயல்பாக உள்ளது.
- source_word: καθὼς
  choice: போலவே
  rationale: வெறும் ஒற்றுமையைவிட வலுவான ஒப்புமையைத் தெரிவித்து, மகனுக்குரிய மதிப்பையும் தந்தைக்குரிய மதிப்பையும் உரை இணைக்கும் வலிமையைப் பாதுகாக்கிறது.
- source_word: τὸν πατέρα
  choice: தந்தையை / தந்தையையும்
  rationale: இறைவனைத் தந்தையாகக் குறிக்கும் யோவானிய உறவுமுறைப் பட்டத்தை நவீன மரியாதைமிக்க தமிழில் தருகிறது.
- source_word: ὁ μὴ τιμῶν
  choice: மதிக்காதவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்பை பொதுவான, காலவரையற்ற கூற்றாகச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: τὸν πέμψαντα αὐτόν
  choice: அவரை அனுப்பிய
  rationale: இந்தப் பங்கேற்புத் தொடர் தந்தையை விவரிப்பதைத் தெளிவாகக் காட்டுகிறது; ‘அவரை’ என்பது மகனைக் குறிக்கும் மரியாதை ஒருமை.
- source_word: πέμψαντα
  choice: அனுப்பிய
  rationale: πέμπω என்பதன் நேரடியான பொருளைத் தருகிறது; ‘பணியமர்த்திய’ போன்ற அதிக விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: மகனை மதிப்பதையும் தந்தையை மதிப்பதையும் இணைக்கும் ஒப்புமையின் வலிமை
  choice: καθὼς என்பதற்கு ‘போலவே’ என்று மொழிபெயர்த்து வலுவான ஒப்புமை காக்கப்பட்டது.
  alternative: ‘போல்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: மூலத்தின் வலுவான இணைத்தன்மையை மெலிதாக்காமலும், பிற்கால இறையியல் சொற்களை வசனத்தில் புகுத்தாமலும் உரையிலுள்ள அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: υἱός மற்றும் πατήρ ஆகியவற்றின் பட்டப்பெயர்த் தன்மை
  choice: ‘மகன்’, ‘தந்தை’ எனச் சூழலுக்குரிய தனிப்பட்ட உறவுமுறைப் பட்டங்களாக வழங்கப்பட்டது.
  alternative: ‘குமாரன்’, ‘பிதா’ போன்ற மரபுவழிச் சொற்கள்
  rationale: மூலத்தின் கிறிஸ்துவியல் குறிப்பைத் தக்கவைத்தபடி, சாதாரண நவீனத் தமிழ் வாசகருக்கு இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டன; தனிப்பட்ட பெயர்களாகத் தவறாக மாற்றப்படவில்லை.
- issue: ἵνα தொடர் முந்தைய வசனத்தைச் சார்ந்திருப்பது
  choice: தமிழில் முழுமையான வாக்கியமாக அமைய ‘இப்படிச் செய்தார்’ என முந்தைய செயலுக்கான சுட்டு வெளிப்படையாக வழங்கப்பட்டது.
  alternative: ‘அனைவரும் … மதிக்கும்படி’ என்று சார்பு வாக்கியமாக மட்டும் விடுதல்
  rationale: ἵνα என்பதன் நோக்கப் பொருளை காக்கும் அதே நேரத்தில், வசன எண் அடிப்படையில் தனியே வாசிக்கப்படும் தமிழில் துண்டு வாக்கியத்தைத் தவிர்க்கிறது; ‘இப்படி’ என்பது குறிப்பிட்ட செயலை விளக்காமல் முந்தைய சூழலை மட்டுமே சுட்டுகிறது.
translation_notes:
  register: மரியாதைமிக்க, இயல்பான நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மதி’ என்ற ஒரே வேர்ச்சொல் மூலத்தில் மூன்று முறை வரும் τιμάω-வின் சொல்லாட்சி இணைப்பைப் பாதுகாக்கிறது. ‘போலவே’ ஒப்புமையின் அழுத்தத்தைத் தக்கவைக்கிறது. வசனத்தில் அடிக்குறிப்புகள் இல்லை; ஆகவே குறியீடுகளும் சேர்க்கப்படவில்லை.
