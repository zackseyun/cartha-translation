  naturalness: '“ஆனால் உங்களை நான் அறிவேன்: உங்களுக்குள் கடவுளின் அன்பு இல்லை” என்பது நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான, இயல்பான நடை. இரட்டைப்புள்ளி, அறிதலின் உள்ளடக்கத்தைச் சுருக்கமாகவும் பொருத்தமாகவும் அறிமுகப்படுத்துகிறது.'
  terminology: “கடவுளின் அன்பு” என்பது தெய்வீகச் சொல்லாட்சியில் நிலையானதும், மூலத்தின் genitive தெளிவின்மையைத் தக்கவைத்துக் கொள்ளக்கூடியதுமான தெரிவாகும். அடிக்குறிப்பு “கடவுள்மீதான அன்பு” என்ற சூழலுக்கு ஏற்ற மாற்றுவாசிப்பையும், கடவுளிடமிருந்து வரும் அன்பு என்ற பரந்த சாத்தியத்தையும் சரியாகப் பதிவு செய்கிறது.
