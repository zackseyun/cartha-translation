id: JHN.5.42
reference: John 5:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: ta
  text: 'ஆனால் உங்களை நான் அறிவேன்: உங்களுக்குள் கடவுளின் அன்பு இல்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வெளிப்படையாக, “உங்களுக்குள் கடவுள்மீதான அன்பு இல்லை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர், “கடவுளிடமிருந்து வரும் அன்பு” அல்லது “கடவுளுடைய அன்பு” என்ற விரிவான பொருளையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள வலுவான முரண்பாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: ἔγνωκα
  choice: நான் அறிவேன்
  rationale: நிலைத்த அறிதலைக் குறிக்கும் நிறைவுக்கால வினையின் தற்போதைய நிலைச்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இது பன்மை இரண்டாம் நபரைக் குறிக்கும் நேரடிச் செயப்படுபொருள்.
- source_word: ὅτι
  choice: ':'
  rationale: இயேசு அவர்களைப் பற்றி அறிந்திருப்பதன் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: கடவுளின் அன்பு
  rationale: τοῦ θεοῦ என்பதிலுள்ள உறவின் தெளிவின்மையைத் தீர்த்துவிடாமல், கடவுள்மீதான அன்பு அல்லது கடவுளிடமிருந்து வரும்/கடவுளுக்குரிய அன்பு ஆகிய சாத்தியங்களைத் திறந்துவைக்கிறது.
- source_word: οὐκ ἔχετε
  choice: இல்லை
  rationale: அந்த அன்பு அவர்களுக்குள் இல்லாத தற்போதைய நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν ἑαυτοῖς
  choice: உங்களுக்குள்
  rationale: அவர்களின் உள்ளார்ந்த வாழ்வில் அது இல்லையென்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: “கடவுளின் அன்பு” என்பதில் உள்ள மரபுத்தொடரின் பொருள்
  choice: முதன்மை உரையில் “கடவுளின் அன்பு” என்று தெளிவின்மையைப் பாதுகாத்தல்
  alternative: “கடவுள்மீதான அன்பு”; அல்லது “கடவுளிடமிருந்து வரும் அன்பு/கடவுளுடைய அன்பு”
  rationale: τοῦ θεοῦ என்ற கிரேக்க உருபுத்தொடர் அன்பின் இலக்கை அல்லது அதன் மூலத்தையும் இயல்பையும் குறிக்கக்கூடும். சூழல் கடவுள்மீதான அன்பை வலுவாகச் சுட்டினாலும், மூலத்தின் உண்மையான பொருள் விரிவை முதன்மை உரை தேவையின்றித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. “உங்களை நான் அறிவேன்” என்பது மூலத்தின் செயப்படுபொருளைத் தெளிவாக வைத்திருக்கிறது; இரட்டைப் புள்ளி ὅτι அறிமுகப்படுத்தும் உள்ளடக்கத்தை இயல்பாக இணைக்கிறது.
