id: JHN.5.25
reference: John 5:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: ta
  text: '“உண்மையாகவே, உண்மையாகவே[a] நான் உங்களுக்குச் சொல்கிறேன்: ஒரு வேளை[b] வருகிறது; அது இப்போதே நிகழ்கிறது. அப்போது இறந்தவர்கள்[c] கடவுளின் மகனின் குரலைக் கேட்பார்கள்; கேட்டவர்கள்[d] வாழ்வார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் முறையில், “ஆமென், ஆமென்” எனலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வேளை’ என்பதற்கு ‘மணி நேரம்’ என்றும் பொருள் உண்டு; இங்கு அது ஒரு குறிப்பிட்ட காலப்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘இறந்தவர்கள்’ என்பது இங்கு நிகழ்கால ஆன்மிகப் பொருளையும் (‘இப்போதே’), சுற்றியுள்ள வசனங்களில் வரும் உடல் உயிர்த்தெழுதலையும் உள்ளடக்கக்கூடும்.
    reason: cross_reference
  - marker: d
    text: இயல்பான, எதிர்கால நோக்குடைய மாற்றாக, “கேட்பவர்கள் வாழ்வார்கள்” எனலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: இயேசுவின் கூற்றை உறுதிப்படுத்தும் வலியுறுத்தலையும் இருமுறை கூறப்படும் அமைப்பையும் காத்து, இன்றைய தமிழ் வாசகருக்கு உடனடியாகப் புரியும் வகையில் மொழிபெயர்க்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி விளிப்பையும் யோவான் நற்செய்தியின் சீரிய நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔρχεται ὥρα
  choice: ஒரு வேளை வருகிறது
  rationale: வேளை என்பது ὥρα என்பதன் காலப்பகுதி சார்ந்த பொருளையும் யோவான் நற்செய்தியில் அதற்குள்ள முக்கியத்துவத்தையும் காக்கிறது; பொதுவான ‘காலம்’ என்று விரிவாக்கவில்லை.
- source_word: καὶ νῦν ἐστιν
  choice: அது இப்போதே வந்திருக்கிறது
  rationale: வரவிருக்கும் வேளையும் ஏற்கெனவே நிகழ்காலத்தில் இருப்பதும் ஆகிய பதற்றத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: οἱ νεκροὶ
  choice: இறந்தவர்கள்
  rationale: உடல் மரணத்தையோ ஆன்மிக மரணத்தையோ மட்டும் என்று குறுக்காமல், மூலத்தின் பரந்த சாத்தியத்தைத் திறந்தே வைக்கிறது.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: குரலைக் கேட்பார்கள்
  rationale: தனிப்பட்டவரின் φωνή என்பதற்கு ‘குரல்’ இயல்பானது; ἀκούω என்பதன் அடிப்படைப் பொருளான கேட்டலைத் தருகிறது.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: கடவுளின் மகனுடைய
  rationale: முழுமையான கிறிஸ்தியல் பட்டத்தை நவீன, பொதுவாகப் புரியும் தமிழில் நேரடியாகக் காக்கிறது.
- source_word: οἱ ἀκούσαντες
  choice: அதைக் கேட்பவர்கள்
  rationale: இறந்தவர்கள் குரலைக் கேட்பார்கள் என்ற முந்தைய வாக்கியத்தோடு இயல்பாக இணைந்து, கேட்டலுக்கும் வாழ்தலுக்கும் உள்ள தொடர்பைக் காட்டுகிறது; இறந்தகால வினையெச்ச வடிவின் முறையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ζήσουσιν
  choice: வாழ்வார்கள்
  rationale: ζάω என்பதன் நேரடிப் பொருளைக் காக்கிறது; ‘உயிர்த்தெழுவார்கள்’ என்று உடல் உயிர்த்தெழுதலை மட்டும் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘இறந்தவர்கள்’ என்பதன் குறிப்பு
  choice: ‘இறந்தவர்கள்’ என்று விளக்கச் சேர்க்கையின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆன்மிகமாக இறந்தவர்கள்’ அல்லது ‘உடலளவில் இறந்தவர்கள்’
  rationale: ‘இப்போதே’ என்பது நிகழ்கால உயிர்ப்பித்தலைச் சுட்டக்கூடும்; சுற்றியுள்ள வசனங்கள் எதிர்கால உடல் உயிர்த்தெழுதலையும் நோக்குகின்றன. எனவே இரண்டில் ஒன்றாக மட்டும் பொருளைக் குறுக்கவில்லை.
- issue: ‘கடவுளின் மகன்’ என்ற கிறிஸ்தியல் பட்டம்
  choice: மூலத்தில் உள்ள முழுப் பட்டமும் நேரடியாகத் தக்கவைக்கப்பட்டது.
  alternative: ‘இறைமகன்’ என்ற சுருக்கமான வடிவம்
  rationale: τοῦ υἱοῦ τοῦ θεοῦ என்பதன் கூறுகளை வெளிப்படையாகக் காத்து, கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ‘கேட்டவர்கள்’ என்ற இறந்தகால வடிவமும் எதிர்கால வாழ்தலும்
  choice: முதன்மை உரையில் இயல்பான தமிழுக்காக ‘கேட்பவர்கள்’ என்று தரப்பட்டது.
  alternative: ‘கேட்டவர்கள் வாழ்வார்கள்’
  rationale: கிரேக்க இறந்தகால வினையெச்சம் கேட்டல் நிறைவேறிய பின் விளையும் வாழ்வைச் சுட்டலாம். இருப்பினும் எதிர்காலச் சூழலில் தமிழ் நிகழ்காலப் பெயரெச்சம் நிபந்தனை-விளைவு உறவை இயல்பாக வெளிப்படுத்துகிறது; முறையான மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சீரிய, வாய்வழியாக வாசிக்க ஏற்ற நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘குமாரன்’, பிரிவுசார் பயன்பாட்டை உணர்த்தக்கூடிய சொற்கள், மற்றும் மூலத்தில் இல்லாத கோட்பாட்டு விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன. ‘ஒரு வேளை வருகிறது; அது இப்போதே வந்திருக்கிறது’ என்ற திட்டமிட்ட காலப் பதற்றம் மென்மையாக்கப்படாமல் காக்கப்பட்டுள்ளது.
