id: JHN.5.20
reference: John 5:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: ta
  text: ஏனெனில், தந்தை மகனை அன்புகூர்கிறார்; தாம் செய்கிற அனைத்தையும் அவருக்குக் காட்டுகிறார். இவற்றைவிடப் பெரிய செயல்களையும் அவருக்குக் காட்டுவார்; நீங்கள் வியப்படையும்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதனால் நீங்கள் வியப்படைவீர்கள்.’ கிரேக்கச் சொற்றொடர் நோக்கத்தைக் குறிக்கிறது; இச்சூழலில் இயேசுவின் கேட்போர் அடையும் வியப்பான விளைவையும் உணர்த்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: அன்புகூர்ந்து
  rationale: φιλέω என்பது பாசத்தையும் நெருக்கமான அன்பையும் குறிக்கக்கூடும்; ஆனால் யோவானில் ἀγαπάω என்பதோடு பொருள் ஒத்துவருவதால், தேவையற்ற வேறுபாட்டை உருவாக்காமல் இயல்பாக ‘அன்புகூர்ந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δείκνυσιν / δείξει
  choice: காட்டுகிறார் / காட்டுவார்
  rationale: ஒரே கிரேக்க வினையின் நிகழ்காலத்தையும் எதிர்காலத்தையும் தமிழிலும் ஒரே சொல்லால் வெளிப்படுத்தி, வசனத்தின் சொல் தொடர்பு பாதுகாக்கப்படுகிறது.
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: தாம் செய்கிற அனைத்தையும்
  rationale: πάντα என்பதன் முழுமையான பரப்பையும் αὐτός தரும் தந்தையைச் சுட்டும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது. மரியாதை ஒருமையான ‘தாம்’ இங்கு தந்தையையே குறிக்கிறது.
- source_word: μείζονα τούτων ... ἔργα
  choice: இவற்றைவிடப் பெரிய செயல்கள்
  rationale: ἔργα என்பதற்கு ‘செயல்கள்’ என்பது தெளிவான நவீனத் தமிழ்; யோவானில் இயேசுவின் வல்லமையான செயல்களை உள்ளடக்கும் பொருளையும் தக்கவைக்கிறது.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: அதனால் நீங்கள் வியப்படைவீர்கள்
  rationale: ἵνα மற்றும் subjunctive நோக்கத்தையும் எதிர்வரும் விளைவையும் சுட்டக்கூடும். இச்சூழலில் கேட்போருக்கு ஏற்படும் வியப்பை இயல்பான தமிழில் கூறுகிறது; நோக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: φιλέω குறிக்கும் தந்தையின் மகன்மீதான அன்பின் தன்மை
  choice: ‘அன்புகூர்ந்து’ என்று மொழிபெயர்த்து, குறைந்த அல்லது வெறும் மனிதப் பாசம் என்று வேறுபடுத்தவில்லை.
  alternative: ‘பாசம் வைத்திருந்து’ அல்லது ‘பிரியமாயிருந்து’
  rationale: தந்தை–மகன் உறவின் நெருக்கத்தை உரை தெரிவிக்கிறது. யோவானில் φιλέω மற்றும் ἀγαπάω பொருள் ஒத்துவரக்கூடும்; மூலவுரை கோராத இறையியல் படிநிலையை மொழிபெயர்ப்பு புகுத்தக் கூடாது.
- issue: ἵνα ὑμεῖς θαυμάζητε என்பதன் நோக்கம்/விளைவு வலிமை
  choice: முதன்மை உரையில் விளைவின் இயல்பை ‘அதனால் நீங்கள் வியப்படைவீர்கள்’ என்று வழங்கி, நோக்க வாசிப்பை அடிக்குறிப்பில் தருதல்.
  alternative: ‘நீங்கள் வியப்படையும்படி’
  rationale: ἵνα + subjunctive நோக்கத்தை வெளிப்படுத்தலாம்; சூழலில் கேட்போரின் வியப்பு விளைவாகவும் எதிர்பார்க்கப்படுகிறது. இரு நுணுக்கங்களையும் அமைதியாக ஒன்றாகச் சுருக்காமல் பாதுகாக்க அடிக்குறிப்பு தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தந்தை’, ‘மகன்’ ஆகியவை சூழலின் இறையியல் உறவைத் தெளிவாகப் பாதுகாக்கின்றன; ‘தாம்’ தந்தையை வலியுறுத்துகிறது. பன்மை ‘நீங்கள்’ வெளிப்படையாக வைக்கப்பட்டுள்ளது.
