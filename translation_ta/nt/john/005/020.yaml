revisions:
- from: ஏனெனில், தந்தை மகனிடம் அன்புகூர்ந்து, தாம் செய்கிற அனைத்தையும் அவருக்குக் காட்டுகிறார். இவற்றைவிடப் பெரிய செயல்களையும் அவருக்குக் காட்டுவார்; அதனால் நீங்கள் வியப்படைவீர்கள்.[a]
  to: ஏனெனில், தந்தை மகனை அன்புகூர்கிறார்; தாம் செய்கிற அனைத்தையும் அவருக்குக் காட்டுகிறார். இவற்றைவிடப் பெரிய செயல்களையும் அவருக்குக் காட்டுவார்; நீங்கள் வியப்படையும்படி.[a]
