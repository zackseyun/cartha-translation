  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: ta
  text: அங்கே முப்பத்தெட்டு ஆண்டுகளாக நோயுற்றிருந்த ஒரு மனிதர் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலவீனத்தில்’ அல்லது ‘உடல்நலக் குறைவில்.’ ἀσθένεια என்ற கிரேக்கச் சொல் உடல் பலவீனத்தையோ நோயையோ பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: இருந்தார்
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் தனிக் இணைப்புச்சொல் சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் இதைக் கொண்டுவரலாம்.
- source_word: τις ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: குறிப்பிட்ட பெயர் சொல்லப்படாத ஓர் ஆண் நபரை அறிமுகப்படுத்துகிறது; ‘ஒரு மனிதர்’ இயல்பாகவும் மரியாதையான நவீன தமிழிலும் உள்ளது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இடத்தில் அவர் இருந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: முப்பத்தெட்டு ஆண்டுகளாக
  rationale: காலநீட்சியைத் தமிழில் இயல்பாகக் காட்ட ‘ஆண்டுகளாக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔχων
  choice: இருந்தார்
  rationale: தொடர்ந்து நீடித்த நிலையைச் சுட்டும் பங்கேற்பு வடிவம்; கால அளவுடன் சேர்ந்து தமிழில் ‘இருந்தார்’ என இயல்பாக வருகிறது.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: தமது நோயில்
  rationale: ἀσθένεια என்பது பலவீனம், உடல்நலக் குறைவு, நோய் ஆகிய பரந்த பொருள்களைக் கொள்ளலாம். ‘நோயில்’ சூழலுக்கு ஏற்றது; நோயின் தன்மையை ஊகித்துச் சொல்லவில்லை. எழுவாயான மனிதரையே திரும்பச் சுட்டுவதால் மரியாதை ஒருமையுடன் ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
