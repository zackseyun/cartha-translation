  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: ta
  text: 'அவர்கள் வெளியே வருவார்கள்: நன்மை செய்தவர்கள் வாழ்வுக்குரிய உயிர்த்தெழுதலுக்கு; ஆனால் தீமை செய்தவர்கள் தீர்ப்புக்குரிய உயிர்த்தெழுதலுக்கு.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீர்ப்புக்குரிய உயிர்த்தெழுதல்’ என்பதற்குப் பதிலாக, ‘கண்டனத்திற்குரிய உயிர்த்தெழுதல்’ என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்கச் சொல் பொதுவாக ‘தீர்ப்பு’ என்று பொருள்படும்; ‘கண்டனம்’ என்பது அதன் பொருளை இன்னும் குறுக்கிக் கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: வெளியே வருவார்கள்
  rationale: முந்தைய வசனத்தில் கூறப்படும் கல்லறைகளிலிருந்து இறந்தவர்கள் வெளிவருவதைச் சூழல் குறிக்கிறது; நவீன தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: நன்மை செய்தவர்கள்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் பன்மை உரிச்சொல்லையும் ποιέω வினையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀνάστασιν ζωῆς
  choice: வாழ்வுக்குரிய உயிர்த்தெழுதல்
  rationale: மரபான ‘ஜீவ உயிர்த்தெழுதல்’ என்பதைக் காட்டிலும் நவீன தமிழில் தெளிவாக உள்ளது; மரபுத்தொடரின் தொடர்பைத் தீர்மானித்து மிகைப்படுத்தாமல், உயிர்த்தெழுதலுக்கும் வாழ்வுக்கும் உள்ள உறவைப் பாதுகாக்கிறது.
- source_word: τὰ φαῦλα πράξαντες
  choice: தீமையானவற்றைச் செய்தவர்கள்
  rationale: φαῦλα என்பதின் ஒழுக்கரீதியான எதிர்மறைப் பொருளைத் தக்கவைக்கிறது. πράσσω-வின் தனித்த நிழற்பொருளை ‘கடைப்பிடித்தவர்கள்’ என வலியுறுத்துவது தமிழில் செயற்கையாகவும் அளவுக்கு மீறிய விளக்கமாகவும் அமையும் என்பதால் ‘செய்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀνάστασιν κρίσεως
  choice: தீர்ப்புக்குரிய உயிர்த்தெழுதல்
  rationale: κρίσις என்பதின் பரந்த ‘தீர்ப்பு’ பொருளைத் தக்கவைத்து, அதை ‘தண்டனைத் தீர்ப்பு’ எனக் குறுக்கவில்லை.
- source_word: δὲ
  choice: மாறுபட்ட இணை அமைப்பு
  rationale: இரு குழுக்களும் ‘...க்கும் ...க்கும்’ என்ற இணையான அமைப்பில் தெளிவாக எதிர்நிறுத்தப்படுகின்றன; தனியாக ‘ஆனால்’ சேர்ப்பது தமிழ்ச் சொற்றொடரை கனமாக்கும்.
theological_decisions:
- issue: κρίσεως என்பதை ‘தீர்ப்பு’ எனவா, ‘தண்டனைத் தீர்ப்பு’ எனவா மொழிபெயர்ப்பது
  choice: தீர்ப்பு
  alternative: தண்டனைத் தீர்ப்பு
  rationale: κρίσις அடிப்படையில் பரந்த ‘தீர்ப்பு’ என்ற பொருளைக் கொண்டது. சூழலின் கடுமையை மறைக்காமல், மூலத்தில் வெளிப்படையாக இல்லாத குறுகிய இறையியல் முடிவை மொழிபெயர்ப்புக்குள் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதும் ஆன நடை. ‘உயிர்த்தெழுதல்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது. மூலத்தின் இணையான இருபகுதி அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
