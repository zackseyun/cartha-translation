  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: ta
  text: இவற்றில் நோயுற்றோர், பார்வையற்றோர், நடக்க இயலாதோர், உடல் உறுப்புகள் சூம்பியோர்[a] ஆகியோரின் பெருந்திரள் படுத்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உறுப்புகள் வற்றிப்போனோர்.” கிரேக்கச் சொல் சொல்லர்த்தமாக “உலர்ந்தோர்” அல்லது “சூம்பியோர்” என்று பொருள்படும்; சூம்பி செயலிழந்த உடல் உறுப்புகளையுடையவர்களை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: இவற்றில்
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட மண்டபங்களைக் குறிக்கிறது. மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் அந்தத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: κατέκειτο
  choice: படுத்திருந்தனர்
  rationale: κατάκειμαι என்பதன் இறந்தகாலத் தொடர்நிலை, அவர்கள் அங்கே படுத்திருந்த நிலையைச் சுட்டுகிறது. தமிழில் கூட்டத்திலுள்ள மக்களைப் பன்மையில் குறிப்பிடுவது இயல்பானது.
- source_word: πλῆθος
  choice: பெருந்திரளானோர்
  rationale: πλῆθος குறிக்கும் பெரும் எண்ணிக்கையையும் கூட்டுத் தன்மையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τῶν ἀσθενούντων
  choice: நோயுற்றவர்களான
  rationale: இங்கு ἀσθενέω உடல்நலக் குறைவுடையவர்களைக் குறிக்கிறது; பட்டியலில் வரும் வகைகளை அறிமுகப்படுத்தும் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τυφλῶν
  choice: பார்வையற்றோர்
  rationale: τυφλός என்பதன் பொருளைத் துல்லியமாகவும் இன்றைய மரியாதையான வழக்கிலும் தெரிவிக்கிறது.
- source_word: χωλῶν
  choice: நடக்க இயலாதோர்
  rationale: χωλός நடப்பதில் கடுமையான குறைபாடுடையவர்களைக் குறிக்கிறது. இச்சூழலில் இயல்பாகவும் மரியாதையாகவும் விளங்கும் மொழிபெயர்ப்பு.
- source_word: ξηρῶν
  choice: கை கால் சூம்பியோர்
  rationale: ξηρός என்பதன் அடிப்படைப் பொருள் ‘உலர்ந்த/சூம்பிய’ என்பதாகும்; உடல் சார்ந்த இச்சூழலில் சூம்பிப்போன உறுப்புகளையுடையவர்களைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது. ‘முடக்குவாதமுற்றோர்’ என்று நோய்நிலையைத் திட்டவட்டமாக்குவது மூலத்தின் பொருளை அளவுக்கு மீறி வரையறுக்கும்.
