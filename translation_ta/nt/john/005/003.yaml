revisions:
- from: இவற்றில் நோயுற்றவர்களான பார்வையற்றோர், நடக்க இயலாதோர், கை கால் சூம்பியோர்[a] எனப் பெருந்திரளானோர் படுத்திருந்தனர்.
  to: இவற்றில் நோயுற்றோர், பார்வையற்றோர், நடக்க இயலாதோர், உடல் உறுப்புகள் சூம்பியோர்[a] ஆகியோரின் பெருந்திரள் படுத்திருந்தது.
  rationale: The revision makes the collective force of πλῆθος natural in Tamil, presents the Greek genitive list as coordinated categories, and avoids adding ‘hands and feet’ while retaining the source term’s bodily sense and ambiguity in the footnote.
