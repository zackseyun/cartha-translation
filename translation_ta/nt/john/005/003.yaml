translation_notes:
  register: நவீன தரத் தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. உடல் குறைபாடுகளைக் குறிப்பிடும்போது இழிவாக ஒலிக்கக்கூடிய பழைய சொற்கள் தவிர்க்கப்பட்டுள்ளன; ξηρῶν என்பதன் உருவகத் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
