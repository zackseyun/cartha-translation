id: JHN.5.34
reference: John 5:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ta
  text: ஆனால் நான் மனிதரிடமிருந்து சாட்சியைப் பெறுவதில்லை; மாறாக, நீங்கள் மீட்கப்படும்படியாக இவற்றைச் சொல்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: மனிதரிடமிருந்து
  rationale: παρά உடன் வரும் பிறப்புவேற்றுமை மூலத்தைக் குறிக்கிறது. ஒருமை வடிவம் தமிழில் பொதுவான மனித மூலத்தைக் குறிக்கும் ‘மனிதரிடமிருந்து’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: μαρτυρίαν
  choice: சாட்சியை
  rationale: இச்சூழலில் இது சாட்சி அளிப்பவரை அல்ல, அவர் அளிக்கும் சாட்சியின் உள்ளடக்கத்தைக் குறிக்கிறது; சுற்றியுள்ள நீதிமன்ற/ஆதார நுணுக்கத்தையும் காக்கிறது.
- source_word: λαμβάνω
  choice: பெறுவதில்லை
  rationale: நிகழ்கால வினையை நேரடியாகக் காட்டுகிறது. ‘ஏற்றுக்கொள்வதில்லை’ என்பதும் சாத்தியம்; ஆனால் அது அங்கீகரித்தல் என்ற கூடுதல் நுணுக்கத்தை வலுப்படுத்தக்கூடும்.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: கிரேக்க நடுநிலைப் பன்மை வடிவத்தைத் தமிழிலும் பன்மையாகக் காக்கிறது.
- source_word: λέγω
  choice: சொல்கிறேன்
  rationale: நேரடியான நிகழ்கால வடிவம்; ταῦτα என்ற நேர்செயப்படுபொருளுடன் இயல்பான நவீனத் தமிழ்.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: நீங்கள் மீட்கப்படும்படியாக
  rationale: ἵνα என்பதன் நோக்கப் பொருளையும் σωθῆτε என்பதன் இறந்தகாலத் தோற்றமுடைய செயப்பாட்டு வாய்பாட்டு வடிவத்தையும் காக்கிறது. ‘நீங்கள் இரட்சிக்கப்படும்படியாக’ என்பதும் மரபான மாற்று; ‘மீட்கப்பட’ என்பது நவீன வாசகருக்கு இயல்பாக இருந்து பரந்த இரட்சிப்புப் பொருளைத் தக்கவைக்கிறது.
- source_word: δὲ ... ἀλλὰ
  choice: ஆனால் ... மாறாக
  rationale: மனித சாட்சியைச் சார்ந்திருப்பதை மறுப்பதற்கும், இவற்றைச் சொல்வதன் நோக்கத்தை எடுத்துரைப்பதற்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘நீங்கள் மீட்கப்படும்படியாக’ என்பதன் சூழல்சார் பொருள்
  choice: இரட்சிப்பைக் குறிக்கும் பரந்த சொல்லாட்சியை வைத்திருத்தல்
  alternative: ‘நீங்கள் விடுவிக்கப்படும்படியாக’ அல்லது ‘நீங்கள் இரட்சிப்பை அடையும்படியாக’
  rationale: σῴζω இங்கு முழுமையான இரட்சிப்புப் பொருளைக் கொண்டிருக்கலாம். ஆனால் அது எவ்வாறு நிகழ்கிறது என்பதை ஒரு குறிப்பிட்ட கோட்பாட்டு மாதிரிக்குள் மொழிபெயர்ப்பு சுருக்கக்கூடாது; செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும், மரியாதைமிக்க நடை. கிரேக்க வாக்கியத்தின் எதிர்மறை–மாறுபாட்டு அமைப்பும் பன்மைச் சுட்டும் காக்கப்பட்டுள்ளன.
