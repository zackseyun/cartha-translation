translation:
  language: ta
  text: இயேசு அவனிடம், “எழுந்திரு; உன் படுக்கைப் பாயை[a] எடுத்துக்கொள்; நட” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘படுக்கைப் பாய்’ என்பதற்கு ‘படுக்கை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொதுவாக எளிய படுக்கும் பாய் அல்லது தாழ்வான படுக்கையைக் குறிக்கிறது; அது பெரிய கட்டிலைக் கட்டாயமாகக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தமிழ் கதைநடையில் கடந்தகாலமான ‘என்றார்’ இயல்பாகவும் மரியாதையாகவும் ஒலிக்கிறது; நிகழ்வின் பொருள் மாறாது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: இது இயேசுவின் சொல் யாரை நோக்கியது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἔγειρε
  choice: எழுந்திரு
  rationale: உடனடியாக எழும்பும்படி கூறும் நேரடிக் கட்டளையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἆρον
  choice: எடுத்துக்கொண்டு
  rationale: பாயைத் தூக்கி உடன் எடுத்துச் செல்லும் செயலைத் தெளிவாகக் குறிக்கிறது; அடுத்த கட்டளையோடு இயல்பாக இணைகிறது.
- source_word: κράβαττόν
  choice: படுக்கைப் பாய்
  rationale: கனமான கட்டிலைக் காட்டிலும், படுப்பதற்குப் பயன்படும் எளிய, எடுத்துச் செல்லக்கூடிய பாய் அல்லது மெத்தையையே இச்சொல் குறிக்கிறது.
- source_word: περιπάτει
  choice: நட
  rationale: இங்கு உடலால் நடப்பதைக் குறிக்கும் நேரடியான கட்டளை; தொடர்ச்சியான நடையைத் தேவையின்றி மிகைப்படுத்தாது.
theological_decisions:
- issue: குணமாக்கும் சூழலில் இயேசுவின் கட்டளையின் தன்மை
  choice: எழுதல், பாயை எடுத்துக்கொள்ளுதல், நடத்தல் ஆகிய மூன்று உடல்சார் கட்டளைகளையும் நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘எழுந்து குணமடை’ போன்ற விளக்க விரிவாக்கம்
  rationale: குணமடைதல் சூழலால் விளங்கினாலும், இவ்வசனத்தின் கிரேக்கச் சொற்களில் அது தனிக் கட்டளையாக இடம்பெறவில்லை; ஆகவே மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கு ஏற்ற கடந்தகாலமாக இயல்பாக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி தொடர்புடைய சொல்லுக்குப் பதிலாக வசன முடிவில் வைக்கப்பட்டுள்ளது.
