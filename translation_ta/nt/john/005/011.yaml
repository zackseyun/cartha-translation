id: JHN.5.11
reference: John 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “என்னை நலமாக்கியவர்—அவரே என்னிடம், ‘உன் படுக்கைப் பாயை எடுத்துக்கொண்டு நட’ என்று சொன்னார்” எனப் பதிலளித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: யோவானின் உரையாடல் நடையில் வரும் பொதுவான பதில்வினையை இயல்பான, கண்ணியமான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: என்னை நலமாக்கியவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வடிவத்தையும், உடல்நலம் பெற்ற குணமாக்குதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑγιῆ
  choice: நலமாக
  rationale: சூழலில் உடல் குணமடைந்த நிலையைத் தெளிவாகக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத விரிவான ஆன்மிகப் பொருளைச் சேர்ப்பதில்லை.
- source_word: ἐκεῖνός
  choice: அவரே
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: Ἆρον
  choice: எடுத்துக்கொண்டு
  rationale: பாயைத் தூக்கி எடுத்துச் செல்லும்படி கூறும் கட்டளையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: κράβαττόν
  choice: படுக்கைப் பாய்
  rationale: பெரிய கட்டில் அல்ல, எளிய படுக்கும் பாய் அல்லது மெத்தைப்போன்ற பொருள் என்பதைத் தெளிவாகவும் பொதுவாசகருக்குப் புரியுமாறும் காட்டுகிறது.
- source_word: περιπάτει
  choice: நட
  rationale: குணமாக்கப்பட்டவருக்குக் கொடுக்கப்படும் நேரடியான கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கேள்வி அல்லது குற்றச்சாட்டுக்கு எதிர்வினையாக வரும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: குணமாக்கப்பட்ட நிலையின் பொருள்
  choice: என்னை நலமாக்கியவர்
  alternative: என்னை முழுமையாக்கியவர்
  rationale: உடல் குணமாக்குதலே உடனடிச் சூழலின் கருத்து. ‘முழுமையாக்கியவர்’ என்பது மூலவசனம் கட்டாயப்படுத்தாத விரிவான ஆன்மிகப் பொருளை ஏற்படுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான உரைநடை. கிரேக்கத்தின் வலியுறுத்தல் ‘அவரே’ என்பதால் பாதுகாக்கப்பட்டுள்ளது. இவ்வசனத்துக்குக் கொடுக்கப்பட்ட ஆங்கில அடிக்குறிப்புகள் குறியீடு-உரை ஒத்திசைவின்றி இருப்பதால் அவை இறக்குமதி செய்யப்படவில்லை; தேவையற்ற அடிக்குறிப்பு சேர்க்காமல் மூலமொழியின் பொருள் நேரடியாகத் தரப்பட்டுள்ளது.
