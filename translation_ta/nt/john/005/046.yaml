  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: ta
  text: ஏனெனில் நீங்கள் மோசேயை நம்பியிருந்தால்[a], என்னை நம்பியிருப்பீர்கள்; ஏனெனில் அவரே[b] என்னைப் பற்றி எழுதினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு உட்பிரிவுகளிலும் ‘நம்பு’ என்பதற்கான ஒரே கிரேக்க வினைச்சொல்தான் பயன்படுத்தப்பட்டுள்ளது. ‘நம்பிக்கை வைத்திருந்தால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரே’ என்பது மோசேயை வலியுறுத்திக் குறிக்கும் கிரேக்கச் சுட்டுப்பெயரைப் பிரதிபலிக்கிறது; ‘அவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில், ... இருந்தால்
  rationale: γάρ முந்தைய வாதத்துடன் இந்தக் கூற்றை இணைப்பதால் ‘ஏனெனில்’ என வெளிப்படுத்தப்படுகிறது; εἰ நிபந்தனையை அறிமுகப்படுத்துகிறது.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: நீங்கள் மோசேயை நம்பியிருந்தால்
  rationale: πιστεύω உடன் வரும் வேற்றுமை இங்கு மோசேயின் சொற்களை உண்மையென ஏற்றுக்கொள்வதைக் குறிக்கிறது. நிறைவேறாத நிபந்தனையை இயல்பான தமிழில் ‘நம்பியிருந்தால்’ எனத் தருகிறது.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: என்னையும் நம்பியிருப்பீர்கள்
  rationale: இறந்தகால வினையுடன் ἄν வருவது நிகழாத நிபந்தனையின் விளைவைக் குறிக்கிறது. இரு உட்பிரிவுகளிலும் உள்ள ஒரே கிரேக்க வினைச்சொல் தமிழிலும் ‘நம்பு’ எனத் தக்கவைக்கப்படுகிறது; εἰς இல்லாததால் ‘என்மீது விசுவாசம் வைத்திருப்பீர்கள்’ என விரிவாக்கப்படவில்லை.
- source_word: περὶ γὰρ ἐμοῦ
  choice: ஏனெனில், ... என்னைப் பற்றி
  rationale: περί + மரபுவேற்றுமை ‘என்னைப் பற்றி/என்னைக் குறித்து’ என்று பொருள்படும்; ‘என்னைப் பற்றி’ தற்போதைய தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ἐκεῖνος
  choice: அவரே
  rationale: இந்தச் சுட்டுப்பெயர் மோசேயை வலியுறுத்திக் குறிப்பிடுகிறது. மரியாதையான மனிதர் குறிப்பு மற்றும் வலியுறுத்தலை ‘அவரே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔγραψεν
  choice: எழுதினார்
  rationale: இறந்தகால நிகழ்வைக் குறிக்கும் aorist வினை தமிழில் எளிய இறந்தகாலமாகத் தரப்படுகிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய மோசேயின் சாட்சி
  choice: அவரே என்னைப் பற்றி எழுதினார்
  alternative: அவரே என்னைக் குறித்து எழுதினார்
  rationale: மோசேயின் எழுத்துகள் இயேசுவைப் பற்றிச் சாட்சி தருகின்றன என்ற கூற்றை மொழிபெயர்ப்பு அப்படியே வைக்கிறது; குறிப்பிட்ட ஒரு பகுதியையோ விரிவான கிறிஸ்தியல் விளக்கத்தையோ இதில் சேர்ப்பதில்லை.
- issue: நம்புதல் என்பதன் இலக்கணம்
  choice: மோசேயை நம்புதல்; என்னை நம்புதல்
  alternative: மோசேயில் விசுவாசம் வைத்தல்; என்னில் விசுவாசம் வைத்தல்
  rationale: இரு இடங்களிலும் πιστεύω நேரடியாக நபரைக் குறிக்கும் dative உடன் வருகிறது; εἰς இல்லை. ஆகவே ‘நம்புதல்’ என்ற நேரடி தொடர்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்பியிருந்தால் ... நம்பியிருப்பீர்கள்’ என்ற அமைப்பு நிறைவேறாத நிபந்தனையைத் தெளிவாகக் காட்டுகிறது; ‘அவரே’ மூலத்தின் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
