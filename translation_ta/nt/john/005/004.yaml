  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: ta
  text: ஏனெனில், அவ்வப்போது ஒரு தூதர் குளத்தில் இறங்கி, தண்ணீரைக் கலக்குவார். தண்ணீர் கலக்கப்பட்ட பின்பு முதலில் அதில் இறங்குகிறவர், தம்மைப் பீடித்த எந்த நோயிலிருந்தும் குணமடைவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனமும், 3ஆம் வசனத்தின் பிற்பகுதியும், மிகப் பழமையான கிரேக்கப் பப்பிரஸ் கையெழுத்துப் பிரதிகளான மூன்றாம் நூற்றாண்டைச் சேர்ந்த பப்பிரஸ் 66, பப்பிரஸ் 75 ஆகியவற்றிலும், நான்காம் நூற்றாண்டின் முக்கியக் கையெழுத்துப் பிரதிகளான சினாய்ட்டிக்கஸ், வத்திக்கானஸ் ஆகியவற்றிலும் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை உரை மரபிலும், பழமையான இலத்தீன் மற்றும் சிரியாக் மொழிபெயர்ப்புகளிலும் இவை காணப்படுகின்றன. நோயுற்றவர்கள் ஏன் அந்தக் குளத்தின் அருகே கூடியிருந்தார்கள் என்பதை விளக்குவதற்காக, இது ஆரம்பகாலத்தில் எழுத்தர்களால் சேர்க்கப்பட்ட உரையாக இருக்கலாம் என்று அறிஞர்கள் பலர் கருதுகின்றனர்.
    reason: textual_critical
lexical_decisions:
- source_word: ἄγγελος
  choice: ஒரு தூதர்
  rationale: இச்சூழலில் வானதூதரைக் குறிக்கிறது; தமிழில் இயல்பாகவும் கண்ணியமாகவும் ‘தூதர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: κατὰ καιρόν
  choice: அவ்வப்போது
  rationale: குறிப்பிட்ட கால அட்டவணையையோ பருவத்தையோ அல்லாமல், இடையிடையே நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: κατέβαινεν
  choice: இறங்கி ... கலக்குவார்
  rationale: இறந்தகாலத்தில் வழக்கமாக அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டும் imperfect வினையின் கூறைத் தமிழின் வழக்கச் செயல் வடிவில் வெளிப்படுத்துகிறது.
- source_word: ἐτάρασσεν τὸ ὕδωρ
  choice: தண்ணீரைக் கலக்குவார்
  rationale: தண்ணீரில் அசைவு அல்லது குழப்பம் ஏற்படுத்துவதை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: ὑγιὴς ἐγίνετο
  choice: குணமடைவார்
  rationale: நோயிலிருந்து நலம்பெறும் பொருளையும், imperfect குறிக்கும் வழக்கமான விளைவையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: தம்மைப் பீடித்த எந்த நோயிலிருந்தும்
  rationale: κατέχω என்பதன் ‘பிடித்திருத்தல்/ஆட்கொண்டிருத்தல்’ என்ற உருவகத்தை நோய்ச் சூழலில் இயல்பான தமிழான ‘பீடித்த’ என்பதால் வழங்குகிறது; நோய் எதுவாயினும் என்ற பரப்பையும் காக்கிறது.
theological_decisions:
- issue: வசனத்தின் உரைசார் நிலை
  choice: கொடுக்கப்பட்ட பைசாந்திய மூல உரையை முதன்மை உரையாக மொழிபெயர்த்து, [a] அடிக்குறிப்பில் முக்கியக் கையெழுத்துப் பிரதிச் சான்று வேறுபாட்டைக் குறிப்பிடுதல்
  alternative: வசனத்தை முதன்மை உரையிலிருந்து நீக்குதல் அல்லது அடைப்புக்குறிக்குள் மட்டும் இடுதல்
  rationale: பணி வழங்கிய மூலப் பதிப்பில் வசனம் உள்ளது; அதேவேளை மிகப் பழைய கிரேக்கச் சான்றுகளில் இல்லாததைக் கூறுவது வாசகர்கள் உரை வரலாற்றை அறியவும், சான்று வேறுபாட்டை மறைக்காமல் இருக்கவும் உதவுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அவ்வப்போது’, ‘கலக்குவார்’, ‘குணமடைவார்’ ஆகியவை கிரேக்க imperfect வினைகள் குறிக்கும் தொடர்ச்சியான அல்லது வழக்கமான கடந்தகால நிகழ்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகின்றன. பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல் ‘தம்மை’, ‘இறங்குகிறவர்’ எனப் பொதுமைப்படுத்தப்பட்டது.
