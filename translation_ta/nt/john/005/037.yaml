source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: ta
  text: என்னை அனுப்பிய தந்தை—அவரே என்னைக் குறித்து சாட்சி அளித்திருக்கிறார்[a]. நீங்கள் ஒருபோதும் அவருடைய குரலைக் கேட்டதுமில்லை; அவருடைய உருவத்தைக் கண்டதுமில்லை[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னை அனுப்பிய தந்தை தாமே என்னைக் குறித்து சாட்சி அளித்திருக்கிறார்.’ ‘தந்தை’ என்பதற்குப் பின் வரும் கிரேக்கச் சுட்டுப்பெயர் அவரை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருடைய தோற்றத்தைக் கண்டதுமில்லை.’ கிரேக்கச் சொல் காணத்தக்க உருவத்தையோ தோற்றத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: என்னை அனுப்பிய தந்தை
  rationale: பெயரெச்சத் தன்மையுள்ள πέμψας என்பதை இயல்பான தமிழ் சார்பு வாக்கியமாக மொழிபெயர்த்து, தந்தையை அடையாளப்படுத்தும் அதன் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐκεῖνος
  choice: அவரே
  rationale: தந்தையை மீண்டும் சுட்டிக்காட்டி வலியுறுத்தும் கிரேக்கச் சுட்டுப்பெயரின் ஆற்றலை இயல்பான தமிழில் ‘அவரே’ வெளிப்படுத்துகிறது; இடைக்கோடு அந்த வலியுறுத்தலைத் தெளிவாக்குகிறது.
- source_word: μεμαρτύρηκεν
  choice: சாட்சி அளித்திருக்கிறார்
  rationale: நிறைவேறிய சாட்சி இப்போதும் தொடர்புடையதாக இருப்பதை கிரேக்க நிறைவுக் காலம் உணர்த்துகிறது; ‘அளித்திருக்கிறார்’ அதை இயல்பாகக் காட்டுகிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமையின் ‘பற்றி/குறித்து’ என்ற பொருளை மரியாதையான நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: οὔτε ... οὔτε
  choice: கேட்டதுமில்லை; ... கண்டதுமில்லை
  rationale: இணையான இரு மறுப்புகளையும் தமிழ் நடைமுறைக்கு ஏற்ற சமச்சீர் அமைப்பில் தக்கவைக்கிறது.
- source_word: φωνὴν αὐτοῦ
  choice: அவருடைய குரலை
  rationale: கேட்பதற்குரிய φωνή என்பதன் நேரடியான பொருள் இங்கு ‘குரல்’ ஆகும்.
- source_word: πώποτε
  choice: ஒருபோதும்
  rationale: மறுப்பு அமைப்போடு சேர்ந்து ‘எந்தக் காலத்திலும் இல்லை’ என்ற பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀκηκόατε
  choice: கேட்டதுமில்லை
  rationale: முந்தைய அனுபவம் இன்றுவரை இல்லை என்ற நிறைவுக் காலத்தின் கருத்தை தமிழ் எதிர்மறை நிறைவு அமைப்பு இயல்பாகக் கடத்துகிறது.
- source_word: εἶδος αὐτοῦ
  choice: அவருடைய உருவத்தை
  rationale: εἶδος குறிக்கும் காணத்தக்க வடிவம் அல்லது தோற்றம் என்ற பொருள் விரிவை ‘உருவம்’ பெருமளவு தக்கவைக்கிறது.
- source_word: ἑωράκατε
  choice: கண்டதுமில்லை
  rationale: ἀκηκόατε என்பதோடு இணையான நிறைவுக் கால மறுப்பு அமைப்பைப் பேணுகிறது.
theological_decisions:
- issue: தந்தையைக் குறிக்கும் ἐκεῖνος என்பதன் வலியுறுத்தல்
  choice: ‘தந்தை—அவரே’ என்று வெளிப்படையாக வலியுறுத்துதல்
  alternative: ‘தந்தை தாமே’ அல்லது வலியுறுத்தலின்றி ‘தந்தை’
  rationale: இயேசுவைக் குறித்துச் சாட்சி அளிப்பவர் தந்தையே என்பதை கிரேக்கச் சுட்டுப்பெயர் வலியுறுத்துகிறது. இதைத் தக்கவைப்பது கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்காமல் மூலத்தின் கிறிஸ்துவியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: εἶδος αὐτοῦ என்பதன் பொருள்
  choice: ‘அவருடைய உருவம்’
  alternative: ‘அவருடைய தோற்றம்’
  rationale: இது நேரடியான காணத்தக்க வடிவத்தையா, வெளிப்பாட்டுத் தோற்றத்தையா, அல்லது பரந்த அறிதலையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானித்துவிடாமல், மூலத்திலுள்ள பொருள் விரிவையும் இறையியல் பதற்றத்தையும் ‘உருவம்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’ இயல்பான சமகாலச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; ‘அவரே’ மூலத்தின் வலியுறுத்தலைக் கடினமான சொற்சொல் மொழிபெயர்ப்பின்றி பாதுகாக்கிறது. மூலத்தில் வசனம் தொடர்வதைக் காட்டும் இறுதி காற்புள்ளி தக்கவைக்கப்பட்டுள்ளது.
