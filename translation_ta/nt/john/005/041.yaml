  text: I do not receive glory from men[b][a],
translation:
  language: ta
  text: மனிதர்களிடமிருந்து மகிமையை நான் பெறுவதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகிமை’ என்பதற்கு ‘மதிப்பு’ அல்லது ‘புகழ்’ என்றும் மொழிபெயர்க்கலாம்.
