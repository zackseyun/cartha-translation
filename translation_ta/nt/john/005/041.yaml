lexical_decisions:
- source_word: δόξαν
  choice: மகிமை
  rationale: இச்சூழலில் பிறர் அளிக்கும் மதிப்பு, புகழ், பெருமை ஆகிய கருத்துகளை δόξα கொண்டுள்ளது. ‘மகிமை’ என்பது யோவான் நற்செய்தி முழுவதிலும் காணப்படும் சொல்லியல் தொடர்பைப் பாதுகாக்கிறது; அடிக்குறிப்பு சூழலுக்குரிய மாற்றுச் சொற்களை விளக்குகிறது.
- source_word: παρὰ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து வரும்
  rationale: παρά + மரபுவேற்றுமை மூலத்தைக் குறிக்கிறது. ἀνθρώπων இங்கு பொதுவாக மனிதர்களைக் குறிக்கக்கூடியதால், இயல்பான நவீனத் தமிழில் பாலினத்தைத் தேவையின்றிக் கட்டுப்படுத்தாத ‘மனிதர்களிடமிருந்து’ பயன்படுத்தப்பட்டது. ‘வரும்’ என்பது தமிழில் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: οὐ λαμβάνω
  choice: நான் ஏற்றுக்கொள்வதில்லை
  rationale: λαμβάνω என்பதற்கு ‘பெறுதல்’ அல்லது ‘ஏற்றுக்கொள்ளுதல்’ என்று பொருள் கொள்ளலாம். மனிதர்களின் பாராட்டைத் தமக்கான அங்கீகாரமாக ஏற்றுக்கொள்வதில்லை என்ற சூழல்சார் நுட்பத்தை ‘ஏற்றுக்கொள்வதில்லை’ இயல்பாக வெளிப்படுத்துகிறது; ‘தேடுவதில்லை’ போன்ற விளக்கச் சொல்லை மூலவாக்கியத்தில் சேர்க்கவில்லை.
theological_decisions:
- issue: மனித அங்கீகாரத்தைப் பற்றிய இயேசுவின் கூற்றின் தன்மை
  choice: மனிதர்களிடமிருந்து வரும் மகிமையை இயேசு ஏற்றுக்கொள்வதில்லை என்ற நேரடியான கூற்றாக மொழிபெயர்த்தல்
  alternative: எந்த மனிதரிடமிருந்தும் எந்த வகையான மரியாதையையும் இயேசு ஒருபோதும் பெறுவதில்லை என்ற முழுமையான கூற்றாக விளக்குதல்
  rationale: சூழலில் அவரது பணி அல்லது அடையாளம் மனிதர்களின் பாராட்டால் உறுதிப்படுத்தப்படுவதில்லை என்ற கருத்து உள்ளது. இருப்பினும் ‘தேடுவதில்லை’ அல்லது ‘சார்ந்திருப்பதில்லை’ என விளக்கத்தை மூல உரைக்குள் சேர்க்காமல், கிரேக்கத்தின் இறுக்கத்தையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு இயல்பாகப் புரியக்கூடியதுமான நடை. கிரேக்கச் சொற்றொடரின் மூலத்தைக் குறிக்கும் அமைப்பும் யோவானின் ‘மகிமை’ சொல்லியல் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
