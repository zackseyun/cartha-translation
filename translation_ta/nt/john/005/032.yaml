id: JHN.5.32
reference: John 5:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: ta
  text: என்னைக் குறித்துச் சாட்சி அளிக்கிறவர் வேறொருவர் இருக்கிறார்; அவர் என்னைக் குறித்துச் சாட்சி அளிக்கும் அந்தச் சாட்சி உண்மையானது என்று நான் அறிவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος
  choice: வேறொருவர்
  rationale: இயேசுவின் சொந்தச் சாட்சியத்திலிருந்து வேறுபட்ட இன்னொருவரைக் குறிக்கிறது; அந்த நபர் யார் என்பதை வசனம் குறிப்பிடாததால், பொதுவான குறிப்பாகவே வைக்கப்படுகிறது.
- source_word: ὁ μαρτυρῶν
  choice: சாட்சி அளிக்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினையின் ‘சாட்சி அளிக்கிற ஒருவர்’ என்ற பொருளையும் தொடரும் செயல் நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமை இங்கு பொருள் அல்லது தொடர்பைக் குறிக்கிறது; ‘என்னைக் குறித்து’ என்பது துல்லியமான, கண்ணியமான நவீனத் தமிழ்.
- source_word: οἶδα
  choice: நான் அறிவேன்
  rationale: அறிதலை நேரடியாகக் குறிக்கிறது; இச்சூழலில் ‘அறிவேன்’ இயல்பாகவும் உறுதியாகவும் உள்ளது.
- source_word: ἀληθής
  choice: உண்மையானது
  rationale: சாட்சியின் உண்மை அல்லது நம்பகத்தன்மையைச் சொல்கிறது; ‘செல்லுபடியாகும்’ போன்ற விளக்கவுரை சார்ந்த முடிவைத் தவிர்க்கிறது.
- source_word: ἡ μαρτυρία
  choice: அந்தச் சாட்சி
  rationale: μαρτυρία என்பதன் நீதிமன்றச் சாயலையும், அதே வேர் கொண்ட வினையுடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: ἣν μαρτυρεῖ
  choice: அவர் ... சாட்சி அளிக்கும்
  rationale: உறவுப்பெயர் அமைப்பைத் தமிழில் இயல்பாகப் பெயரெச்சத் தொடராக மாற்றி, யோவானுக்குரிய பெயர்–வினை மீளுருவாக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἄλλος (‘வேறொருவர்’) என்பவரின் அடையாளம்
  choice: ‘வேறொருவர்’ என்று பொதுவாகவே மொழிபெயர்த்து, அவரின் அடையாளத்தைக் குறிப்பிடவில்லை.
  alternative: யோவான் ஸ்நானகர், பிதா, அல்லது சட்டரீதியான வேறொரு சாட்சி என வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: இந்த வசனம் அந்த நபரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. சுற்றியுள்ள பகுதி விளக்கத்திற்கு உதவினாலும், மொழிபெயர்ப்பு வசனத்தின் திட்டமிட்ட பொதுத்தன்மையையும் இறையியல் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியத்தக்கதாய் இருந்தாலும் கண்ணியமான நடை. மூலத்தில் உள்ள μαρτυρία / μαρτυρέω சொல் மீளுருவாக்கத்தை ‘சாட்சி / சாட்சி அளி’ மூலம் பாதுகாக்கிறது. ‘வேறொருவர் இருக்கிறார்’ என்பது ἄλλος ἐστίν என்ற இருப்புக் கூற்றையும் அடையாளத் தெளிவின்மையையும் காக்கிறது.
