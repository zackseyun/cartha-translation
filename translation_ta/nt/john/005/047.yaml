id: JHN.5.47
reference: John 5:47
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: ta
  text: ஆனால், அவருடைய எழுத்துக்களை நீங்கள் நம்பவில்லை என்றால், என்னுடைய வார்த்தைகளை எப்படி நம்புவீர்கள்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால் ... என்றால்
  rationale: δέ தரும் முந்தைய கருத்துடனான முரண்பாட்டையும், εἰ தரும் நிபந்தனையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: அவருடைய எழுத்துகளை
  rationale: γράμματα என்பதற்கு ‘எழுத்துகள்’ அல்லது ‘எழுதப்பட்டவை’ என்ற பொருள் உண்டு; உடனடியான சூழலில் இது மோசே எழுதியவற்றைக் குறிக்கிறது. ‘வேதவாக்கியங்கள்’ என்று மிகையாகக் குறிப்பாக்காமல் மூலத்தின் சொல்லாட்சியைப் பேணுகிறது.
- source_word: οὐ πιστεύετε
  choice: நீங்கள் நம்பவில்லை
  rationale: இங்கு πιστεύω என்பது எழுதப்பட்ட சாட்சியை உண்மையென ஏற்றுக்கொள்வதைக் குறிக்கிறது; எளிய நிகழ்காலப் பொருள் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: πῶς ... πιστεύσετε
  choice: எப்படி நம்புவீர்கள்?
  rationale: πῶς என்பதன் வினாவையும் πιστεύσετε என்பதன் எதிர்காலத்தையும் நேரடியாகப் பேணி, இயலாமை என்ற விளக்கத்தை உரையில் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: என்னுடைய வார்த்தைகளை
  rationale: ῥήματα இங்கு இயேசு கூறிய சொற்களை அல்லது உரைகளைக் குறிக்கிறது; ‘வார்த்தைகள்’ என்பது மோசேயின் ‘எழுத்துகள்’ என்பதற்கு எதிராக அமைந்துள்ள மூலத்தின் இணைப்பைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: ἐκείνου என்பதன் சுட்டுப்பொருள்
  choice: ‘அவருடைய’ என்பது உடனடியான சூழலில் மோசேயைக் குறிக்கிறது
  alternative: பெயரைக் குறிப்பிட்டு ‘மோசேயின் எழுத்துகள்’ என்று மொழிபெயர்த்தல்
  rationale: யோவான் 5:45–46 மோசேயைத் தெளிவாகக் குறிப்பிடுகிறது. இருப்பினும், மூலத்தில் பெயர் மீண்டும் வராமல் சுட்டுப்பெயர் வருவதால், உரையிணைப்பைப் பேண ‘அவருடைய’ என மொழிபெயர்க்கப்படுகிறது.
- issue: πιστεύω என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘நம்பு’
  alternative: ‘நம்பிக்கை வை’ அல்லது ‘நம்பியிரு’
  rationale: மோசேயின் எழுத்துகளையும் இயேசுவின் வார்த்தைகளையும் உண்மையான சாட்சியாக ஏற்றுக்கொள்வதே இங்கு முன்னிலையாகிறது; இரு வினைச்சொற்களுக்கும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது சொல்லிணைப்பையும் வாதத்தின் ஒப்புமையையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், இயல்பானதும் கண்ணியமானதுமான நடை. கிரேக்கத்தில் உள்ள ‘எழுத்துகள்/எழுதப்பட்டவை’ என்ற பொருள் தமிழின் ‘எழுத்துகள்’ என்பதில் போதுமான அளவு பேணப்படுவதால், தவறாகத் தனிப்பட்ட கடிதங்களை நினைவூட்டக்கூடிய மாற்றுக்குறிப்பு சேர்க்கப்படவில்லை.
