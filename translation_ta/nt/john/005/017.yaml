  source_fidelity: மூலக் கிரேக்கத்தின் δέ-இன் மென்மையான எதிர்மறைத் தொடர்பு, αὐτοῖς-க்கு உரிய ‘அவர்களிடம்,’ ἕως ἄρτι-ன் தற்போதுவரையிலான காலநீட்சி, மற்றும் தந்தை–இயேசு செயல்களின் இணையான நிகழ்கால அமைப்பு அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. κἀγώ-இன் சேர்க்கை வலியுறுத்தல் ‘நானும்’ என்பதில் இயல்பாக வெளிப்படுகிறது.
  naturalness: ‘ஆனால் அவர் அவர்களிடம் பதிலளித்தார்’ மற்றும் ‘இப்போதுவரை செயலாற்றிக்கொண்டிருக்கிறார்’ ஆகியவை நவீன தரமான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளன. ‘செயலாற்றிக்கொண்டிருக்கிறார்’ சற்றே முறையான நடை என்றாலும், இவ்வசனத்தின் மரியாதையான வேதாகமப் பதிவுக்கு ஏற்றது; உடல் உழைப்பு என்ற குறுகிய பொருளையும் தவிர்க்கிறது.
  terminology: ‘என் தந்தை’ என்பது Ὁ πατήρ μου-க்கு நவீனத் தமிழில் இயல்பான இணை; தேவையற்ற சமயச் சொற்களைச் சேர்க்காமல் தனிப்பட்ட உறவையும் கண்ணியமான பதிவையும் காக்கிறது. ‘செயலாற்று’ இரு இணை வினைகளுக்கும் ஒரே சொல் பயன்படுத்தப்பட்டதால் மூலத்தின் கருத்தியல் இணைப்பு பாதுகாக்கப்படுகிறது.
