base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: ta
  text: 'ஆனால் அவர் அவர்களிடம் பதிலளித்தார்: “என் தந்தை இப்போதுவரை செயலாற்றிக்கொண்டிருக்கிறார்; நானும் செயலாற்றிக்கொண்டிருக்கிறேன்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தந்தை இப்போதுவரை செயலாற்றுகிறார்; நானும் செயலாற்றுகிறேன்.” கிரேக்க நிகழ்கால வடிவம் தொடரும் செயலாகவோ பொதுவான நிகழ்காலக் கூற்றாகவோ மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய குற்றச்சாட்டுக்கும் இயேசுவின் பதிலுக்கும் இடையிலான மென்மையான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: அவர் அவர்களிடம் பதிலளித்தார்
  rationale: இடைநிலை வடிவிலுள்ள வினையையும் மறைமுகச் செயப்படுபொருளையும் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: Ὁ πατήρ μου
  choice: என் தந்தை
  rationale: இயேசு கடவுளைத் தமக்குத் தனிப்பட்ட உறவுடைய தந்தையாகக் குறிப்பிடும் பொருளை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἕως ἄρτι
  choice: இப்போதுவரை
  rationale: கடந்த காலத்திலிருந்து தற்போதைய தருணம்வரை நீடிப்பதைக் குறிக்கும் மூலமொழித் தொடருக்கு நேரான இணை.
- source_word: ἐργάζεται
  choice: செயலாற்றிக்கொண்டிருக்கிறார்
  rationale: தந்தையின் செயல் தற்போதும் தொடர்கிறது என்ற நிகழ்காலத்தின் நீடித்த தன்மையை வெளிப்படுத்துகிறது; ‘உழைக்கிறார்’ என மொழிபெயர்த்து உடல் உழைப்பாகக் குறுக்கவில்லை.
- source_word: κἀγὼ
  choice: நானும்
  rationale: தந்தையின் செயலோடு இயேசு தமது செயலையும் இணைத்துக் கூறும் சேர்க்கை வலியுறுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐργάζομαι
  choice: செயலாற்றிக்கொண்டிருக்கிறேன்
  rationale: தந்தையைப் பற்றிய இணையான கூற்றின் சொல் மற்றும் நீடித்த செயல் அமைப்பை அப்படியே தக்கவைக்கிறது.
theological_decisions:
- issue: ஓய்வுநாள் சூழலில் தந்தையின் செயலுக்கும் இயேசுவின் செயலுக்கும் உள்ள தொடர்பு
  choice: “என் தந்தை இப்போதுவரை செயலாற்றிக்கொண்டிருக்கிறார்; நானும் செயலாற்றிக்கொண்டிருக்கிறேன்” என்ற நேரான இணை அமைப்பு
  alternative: “என் தந்தை இப்போதுவரை செயலாற்றுகிறார்; நானும் செயலாற்றுகிறேன்”
  rationale: கிரேக்க உரை தந்தையின் செயலையும் இயேசுவின் செயலையும் திட்டமிட்ட இணை அமைப்பில் வைக்கிறது. ஓய்வுநாள், தெய்வீக உரிமை அல்லது சமத்துவம் பற்றிய விளக்கத்தை வசனத்துக்குள் சேர்க்காமல் அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. திருச்சபைச் சிறப்புச் சொல்லான ‘பிதா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ தேர்ந்தெடுக்கப்பட்டது. ‘செயலாற்றிக்கொண்டிருக்கிறார் / செயலாற்றிக்கொண்டிருக்கிறேன்’ என்ற இணையான வடிவங்கள் மூலவாக்கியத்தின் தொடர்ச்சியையும் வலியுறுத்தலையும் பாதுகாக்கின்றன.
