id: JHN.5.27
reference: John 5:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: ta
  text: மேலும், தீர்ப்பளிக்கும் அதிகாரத்தையும் அவருக்குக் கொடுத்தார்; ஏனெனில் அவர் மனிதகுமாரன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஒரு மனிதர் என்பதால்”; அதாவது, அவர் மனித இயல்பைப் பகிர்ந்துகொள்வதால். யோவான் நற்செய்தியில் இது பட்டப்பெயராகப் பயன்படுவதற்கே அதிக வாய்ப்புள்ளதால், முதன்மை உரை “மனிதகுமாரன்” என்று தருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: இச்சொல் வெறும் வல்லமையை அல்ல, தந்தையால் மகனுக்குக் கொடுக்கப்பட்ட உரிமையுள்ள நீதித்துறை அதிகாரத்தைக் குறிக்கிறது.
- source_word: ἔδωκεν
  choice: கொடுத்தார்
  rationale: δίδωμι என்பதன் இறந்தகால வினை வடிவத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; சூழலில் எழுவாய் தந்தை என்பதால் மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: சூழலில் மகனைக் குறிக்கும் வேற்றுமை உருபுடைய சுட்டுப்பெயர்; நவீனத் தமிழில் இயேசுவைக் குறிப்பிடுவதற்கு மரியாதை வடிவம் இயல்பானது.
- source_word: κρίσιν ποιεῖν
  choice: தீர்ப்பை நிறைவேற்ற
  rationale: சொல்லுக்குச் சொல் 'தீர்ப்பைச் செய்ய' என்பது இயல்பான தமிழ் அல்ல. நீதித்துறைத் தீர்ப்பை நடைமுறைப்படுத்தும் கருத்தை 'தீர்ப்பை நிறைவேற்ற' தெளிவாகக் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அதிகாரம் கொடுக்கப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளை வெளிப்படுத்துகிறது.
- source_word: υἱὸς ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: யோவான் நற்செய்தியில் இயேசுவுக்குரிய நிறுவப்பட்ட பட்டப்பெயராகவும் தானியேல் 7-ன் பின்னணியை நினைவூட்டுவதாகவும் இருப்பதால், கட்டுரையில்லாத கிரேக்க வடிவத்தையும் மீறி பட்டப்பெயரின் இயல்பைத் தமிழில் காக்கிறது.
- source_word: ἐστίν
  choice: அவர் … [ஆக இருக்கிறார் என்பதைக் குறிக்கும் பெயர்ப்பயனிலை]
  rationale: தமிழில் நிகழ்கால இணைப்புவினை பொதுவாக வெளிப்படையாகச் சொல்லப்படாமல் பெயர்ப்பயனிலையால் இயல்பாகத் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: υἱὸς ἀνθρώπου என்பது கிறிஸ்துவுக்குரிய பட்டப்பெயரா அல்லது மனித இயல்பைக் குறிக்கும் பொதுவான சொல்லாடலா?
  choice: முதன்மை உரையில் “மனிதகுமாரன்” என்ற பட்டப்பெயர்
  alternative: “ஒரு மனித மகன்” அல்லது “மனிதர்”
  rationale: யோவானின் பயன்பாடும் நீதியதிகாரத்தைப் பற்றிய இச்சூழலும் தானியேல் 7-ஐ எதிரொலிக்கும் கிறிஸ்துவுக்குரிய பட்டப்பெயரை வலுப்படுத்துகின்றன. இருப்பினும் கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு முன் கட்டுரை இல்லாததால், மனித இயல்பைப் பகிர்வது என்ற பொதுவான பொருள் முற்றிலும் அழிக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “மேலும்” என்பது καί-யின் தொடர்ச்சிப் பொருளைக் காக்கிறது. தந்தைக்கும் மகனுக்கும் மரியாதை ஒருமைச் சுட்டுப்பெயரும் அதற்கேற்ற வினை வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
