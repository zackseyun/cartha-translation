  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, யூதர்களின் பண்டிகை ஒன்று நடைபெற்றது; இயேசு எருசலேமுக்கு ஏறிச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: ταῦτα என்பதன் பன்மையை வெளிப்படையாகக் காத்து, யோவானின் கதைத் தொடரை இயல்பான நவீனத் தமிழில் இணைக்கிறது.
- source_word: ἦν ἑορτὴ
  choice: பண்டிகை ஒன்று நடைபெற்றது
  rationale: ἑορτή என்பது சமய விழாவைக் குறிக்கிறது. தமிழில் ‘பண்டிகை’ இயல்பாகவும் பரவலாகப் புரியக்கூடியதாகவும் உள்ளது; ἦν என்பதன் நிகழ்வு அறிமுகப்படுத்தும் பொருளை ‘நடைபெற்றது’ தெளிவாகத் தருகிறது.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: இங்கு இது குறிப்பாக யூதேயா பகுதி மக்களை அல்ல, யூத மக்கள் கடைப்பிடித்த பண்டிகையை அடையாளப்படுத்துகிறது.
- source_word: ἀνέβη
  choice: ஏறிச் சென்றார்
  rationale: எருசலேமுக்குச் செல்வதை ‘மேலே போதல்’ என்று சொல்லும் புவியியல் மற்றும் யாத்திரை வழக்கைத் தக்கவைக்கிறது; தமிழிலும் பயணச் சூழலில் இயல்பாக உள்ளது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: யோவான் எழுத்தில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இந்த வசனத்தில் அந்தச் சொல் ஒரு சமயப் பண்டிகையைச் சார்ந்து வருவதால், பிராந்திய அடையாளமான ‘யூதேயர்கள்’ என்பதைவிட யூத மக்களைக் குறிக்கும் ‘யூதர்கள்’ என்பதே சூழலுக்கு ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ஒரே வாக்கிய அமைப்பை அரைப்புள்ளி மூலம் தக்கவைத்துள்ளது.
