revisions:
- from: நீங்கள் யோவானிடம் ஆட்களை அனுப்பினீர்கள்; அவர் உண்மைக்குச் சாட்சி கொடுத்திருக்கிறார்.
  to: நீங்கள் யோவானிடம் அனுப்பியிருக்கிறீர்கள்; அவர் உண்மைக்குச் சாட்சியமளித்திருக்கிறார்.[a]
  rationale: Greek perfect aspect is retained in both verbs with ‘அனுப்பியிருக்கிறீர்கள்’ and ‘சாட்சியமளித்திருக்கிறார்.’ The implicit object after ‘sent’ is not supplied, avoiding an unmarked expansion beyond the verse. ‘உண்மைக்கு’ preserves the Greek dative and the article’s possible Johannine resonance without forcing a doctrinal interpretation. The footnote anchor provides the valid lexical alternative for the testimony verb.
