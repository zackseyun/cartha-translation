id: JHN.5.33
reference: John 5:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: ta
  text: நீங்கள் யோவானிடம் அனுப்பியிருக்கிறீர்கள்; அவர் உண்மைக்குச் சாட்சியமளித்திருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மைக்குச் சாட்சி கொடுத்திருக்கிறார்.”
    reason: ‘சாட்சியமளித்திருக்கிறார்’ என்பது μεμαρτύρηκε என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம்; மாற்று வடிவம் சாட்சி/தெளிவான சாட்சிமொழி நுணுக்கத்தைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: வினைச்சொல்லிலேயே இரண்டாம் நபர் பன்மை தெரிந்தாலும், வெளிப்படையான பதிலிப்பெயர் தரும் மிதமான வலியுறுத்தலை இயல்பான தமிழில் ‘நீங்கள்’ தக்கவைக்கிறது; ‘நீங்களே’ என்பது தேவைக்கு அதிகமான வலியுறுத்தலாகலாம்.
- source_word: ἀπεστάλκατε
  choice: ஆட்களை அனுப்பினீர்கள்
  rationale: இங்கு யோவானிடம் விசாரிக்கத் தூதர்களை அனுப்பியதையே சூழல் குறிக்கிறது. தமிழில் ‘யோவானிடம் அனுப்பினீர்கள்’ என்றால் யாரை அல்லது எதை அனுப்பினர் என்பது இயல்பற்ற வகையில் விடுபடும்; ஆகவே உள்ளடங்கிய பொருளை ‘ஆட்களை’ எனத் தெளிவாக்குவது இயல்பும் துல்லியமும் உடையது. இச்சொல் இறந்தகால aorist; ஆங்கில ஆலோசனை அடுக்கின் ‘have sent’ என்பதற்குக் காரணமாகக் கூறப்பட்ட perfect வகைப்பாடு கிரேக்க வடிவத்திற்குப் பொருந்தாது.
- source_word: πρὸς Ἰωάννην
  choice: யோவானிடம்
  rationale: ஒரு நபரை நோக்கி அனுப்புதல் என்ற πρός பயன்பாட்டை நவீன தமிழில் ‘யோவானிடம்’ இயல்பாகத் தருகிறது; மூலத்தில் இல்லாத ‘திருமுழுக்கு யோவான்’ என்ற அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: μεμαρτύρηκε
  choice: சாட்சி கொடுத்திருக்கிறார்
  rationale: Perfect வினைவடிவம் கடந்தகாலச் சாட்சியின் தொடரும் பொருத்தத்தை உணர்த்துகிறது. ‘சாட்சி கொடுத்திருக்கிறார்’ இதை இயல்பான தமிழிலும் சாட்சிய மொழிநடையிலும் தக்கவைக்கிறது.
- source_word: τῇ ἀληθείᾳ
  choice: உண்மைக்கு
  rationale: μαρτυρέω என்பதுடன் வரும் dative-ஐ ‘உண்மைக்குச் சாட்சி’ என்று நேரடியாகவும் இயல்பாகவும் வழங்குகிறது; ‘உண்மை’ என்ற யோவான் நூலுக்குரிய கருத்துநிறையை விளக்கிச் சுருக்கவில்லை.
theological_decisions:
- issue: யோவான் நூலில் ‘உண்மை’ என்பதன் பயன்பாடு
  choice: உண்மை
  alternative: உண்மையைக் குறித்து
  rationale: கிரேக்கத்தில் definite article இருந்தாலும் தமிழில் தனியான definite article இல்லை. ‘உண்மை’ என்பது குறிப்பிட்ட உண்மையையும் கருத்தியல் ஆழத்தையும் சூழலால் தாங்க முடியும்; அதனை ஒரு குறிப்பிட்ட கோட்பாட்டுச் சொல்லாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘ஆட்களை’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளை சூழலிலிருந்து இயல்பாக நிரப்புகிறது. அரைப்புள்ளி இரண்டு நெருக்கமாக இணைந்த கூற்றுகளின் உறவைத் தெளிவாக்குகிறது.
