    text: அல்லது, “உண்மைக்குச் சாட்சி கொடுத்திருக்கிறார்.”
    reason: ‘சாட்சியமளித்திருக்கிறார்’ என்பது μεμαρτύρηκε என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம்; மாற்று வடிவம் சாட்சி/தெளிவான சாட்சிமொழி நுணுக்கத்தைத் தக்கவைக்கிறது.
  revision_rationale: Greek perfect aspect is retained in both verbs with ‘அனுப்பியிருக்கிறீர்கள்’ and ‘சாட்சியமளித்திருக்கிறார்.’ The implicit object after ‘sent’ is not supplied, avoiding an unmarked expansion beyond the verse. ‘உண்மைக்கு’ preserves the Greek dative and the article’s possible Johannine resonance without forcing a doctrinal interpretation. The footnote anchor provides the valid lexical alternative for the testimony verb.
