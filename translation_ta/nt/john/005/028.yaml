  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: ta
  text: இதைக் குறித்து வியப்படையாதீர்கள்; ஏனெனில் ஒரு நேரம் வருகிறது. அப்போது கல்லறைகளில் உள்ள அனைவரும் அவருடைய குரலைக் கேட்பார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: வியப்படையாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் தடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; θαυμάζω என்பதன் வியப்பு சார்ந்த வலிமையையும் காக்கிறது.
- source_word: τοῦτο
  choice: இதைக் குறித்து
  rationale: முந்தைய கூற்றைச் சுட்டும் இடைச்சொல்லைத் தமிழில் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: வியப்படைய வேண்டாம் என்பதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔρχεται ὥρα
  choice: ஒரு நேரம் வருகிறது
  rationale: உருபில்லாத ὥρα என்பதைக் ‘ஒரு நேரம்’ என வழங்குகிறது. யோவானின் காலக் கருத்தைத் தக்கவைத்தபடியே தமிழில் ‘ஒரு மணி வருகிறது’ என்ற தவறான கடிகாரப் பொருளைத் தவிர்க்கிறது.
- source_word: ἐν ᾗ
  choice: அப்போது
  rationale: ‘அந்த நேரத்தில்’ என்ற உறவுநிலைப் பொருளை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: கல்லறைகளில் உள்ள அனைவரும்
  rationale: πάντες οἱ என்ற பெயர்ச்சொல் செயல்பாட்டை ‘அனைவரும்’ எனவும், μνημεῖα என்ற அடக்க இடங்களின் தெளிவான படிமத்தை ‘கல்லறைகள்’ எனவும் வழங்குகிறது.
- source_word: ἀκούσουσιν
  choice: கேட்பார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வினையின் நேரடியான பொருளைத் தமிழில் தருகிறது.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: அவருடைய குரலை
  rationale: ἀκούω உடன் வரும் கிரேக்க உருபுவேற்றுமையைத் தமிழில் இயல்பான செயப்படுபொருள் அமைப்பாக மாற்றி, φωνή என்பதை ‘குரல்’ என நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: கல்லறைகளில் இருப்பவர்கள் அவருடைய குரலைக் கேட்பதில் மறைமுகமாக உள்ள உயிர்த்தெழுதல் கருத்து
  choice: ‘கல்லறைகளில் உள்ள அனைவரும்’ என்ற மூலத்தின் தெளிவான அடக்கப் படிமத்தை மட்டும் தக்கவைத்தல்
  alternative: உயிர்த்தெழுதல் அல்லது இறந்தோர் எழுதல் என்பதை வசனத்திற்குள் வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் உயிர்த்தெழுதலை நோக்கினாலும், இவ்வசனம் தானாகச் சொல்லாத கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்காமல் அதன் சொந்த படிமத்தையும் எதிர்பார்ப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘ஒரு நேரம் வருகிறது’ என்பது யோவானிய ὥρα சொல்லின் கருத்து நிறையைப் பாதுகாத்து, கடிகார மணிநேரம் என்ற தவறான புரிதலைத் தவிர்க்கிறது. ‘கல்லறை’ தமிழில் μνημεῖον குறிக்கும் அடக்க இடத்தை இயல்பாகவும் தெளிவாகவும் தருவதால் மாற்றுக் குறிப்புரை தேவையில்லை.
