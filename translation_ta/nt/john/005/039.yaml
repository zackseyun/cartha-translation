source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: ta
  text: நீங்கள் வேதநூல்களை ஆராய்கிறீர்கள்; ஏனெனில் அவற்றில் உங்களுக்கு நித்திய வாழ்வு உண்டு என்று நினைக்கிறீர்கள்.[a] என்னைக் குறித்து சாட்சி அளிப்பவையும் அவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, Ἐραυνᾶτε என்பதை கூற்றாக அல்லாமல் கட்டளையாகக் கொண்டால்: “வேதநூல்களை ஆராயுங்கள்; ஏனெனில் அவற்றில் உங்களுக்கு நித்திய வாழ்வு உண்டு என்று நினைக்கிறீர்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: நீங்கள் ... ஆராய்கிறீர்கள்
  rationale: இவ்வினை வடிவம் நிகழ்காலக் கூற்றாகவும் கட்டளையாகவும் புரிந்துகொள்ளப்படலாம். உடனடிச் சூழலில், இயேசு கேட்போரின் தற்போதைய செயலை விவரிப்பதாகக் கொள்வது இயல்பானது; கட்டளைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τὰς γραφάς
  choice: வேதவாக்குகளை
  rationale: யோவானின் பயன்பாட்டில் இது இஸ்ரவேலின் புனித எழுத்துகளைக் குறிக்கிறது. ‘வேதவாக்குகள்’ என்பது நவீன தமிழில் தெளிவான, மரியாதைக்குரிய இணைச்சொல்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அவர்கள் வேதவாக்குகளை ஆராய்வதற்கான காரணத்தை இங்கு ὅτι அறிமுகப்படுத்துகிறது; ஆகவே காரணப் பொருள் இயல்பானது.
- source_word: δοκεῖτε
  choice: நினைக்கிறீர்கள்
  rationale: அவர்களுடைய நம்பிக்கை அல்லது அனுமானத்தைக் குறிக்கிறது; மென்மையான விமர்சனத் தொனியை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: ἐν αὐταῖς
  choice: அவற்றில்
  rationale: ἐν என்பதன் இடப்பொருளை நேரடியாகத் தக்கவைத்து, வேதவாக்குகளையே சுட்டுகிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவான் எழுத்துகளில் வரும் நிலையான கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκεῖναί
  choice: அவையே
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் முன் கூறப்பட்ட வேதவாக்குகளைச் சுட்டுகிறது. ‘அவையே’ என்பதில் கிரேக்கத்தின் வலியுறுத்தலும் தெளிவாகிறது.
- source_word: αἱ μαρτυροῦσαι
  choice: சாட்சி அளிப்பவை
  rationale: μαρτυρέω என்பதிலுள்ள சான்றளிக்கும் அல்லது சாட்சியமளிக்கும் நுட்பத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைக் குறித்து
  rationale: περί + genitive என்பதன் ‘என்னைப் பற்றி/என்னைக் குறித்து’ என்ற பொருளை dignified, natural Tamil-ல் வழங்குகிறது.
theological_decisions:
- issue: Ἐραυνᾶτε என்பதன் வினைமுறை
  choice: 'கூற்று: ‘நீங்கள் வேதவாக்குகளை ஆராய்கிறீர்கள்’'
  alternative: 'கட்டளை: ‘வேதவாக்குகளை ஆராயுங்கள்’'
  rationale: கிரேக்க வடிவம் இரு வாசிப்புகளையும் அனுமதிக்கிறது. அடுத்துவரும் காரண வாக்கியமும் சூழலும், இயேசு தம் எதிரிகளின் தற்போதைய வேத அணுகுமுறையை விவரித்து விமர்சிப்பதாகக் கொள்ள ஆதரிக்கின்றன. எனினும் உண்மையான இலக்கணத் தெளிவின்மையை மறைக்காமல் கட்டளை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வேதவாக்குகள்,’ ‘நித்திய வாழ்வு,’ ‘சாட்சி அளிப்பவை’ ஆகியவை யோவான் நூலின் கருத்தியல் சொற்களைத் தெளிவாகவும் இயல்பாகவும் காக்கின்றன.
