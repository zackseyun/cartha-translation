  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: ta
  text: ஆனாலும், வாழ்வைப் பெறும்படி என்னிடம் வர உங்களுக்கு விருப்பமில்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், வாழ்வைப் பெறும்படி என்னிடம் வர நீங்கள் விரும்புவதில்லை.” கிரேக்க இணைப்புச் சொல்லை எளிமையாக “மேலும்” என்றும், θέλετε என்பதை “விரும்புகிறீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: யோவான் நற்செய்தியில் “வாழ்வு” என்பது பெரும்பாலும் தேவனிடமிருந்து வரும் வாழ்வை, அதாவது நித்திய வாழ்வை, விரிவான பொருளில் குறிக்கிறது; எனினும் இங்கு “நித்திய” என்ற சொல் வெளிப்படையாக இடம்பெறவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: ஆனாலும்
  rationale: καί பொதுவாக ‘மேலும்/மற்றும்’ என்று பொருள்படும்; ஆனால் முந்தைய வசனத்தில் வேதவாக்குகள் இயேசுவைப் பற்றிச் சாட்சி கூறுகின்றன என்ற கருத்துக்கும் இங்குள்ள மனமின்மைக்கும் இடையிலான எதிர்மறைத் தொடர்பை ‘ஆனாலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ θέλετε
  choice: உங்களுக்கு விருப்பமில்லை
  rationale: θέλω என்பது விரும்புதல் அல்லது மனமுள்ளவராக இருத்தலைக் குறிக்கிறது. ‘உங்களுக்கு விருப்பமில்லை’ என்பது மனவிருப்பத்தின் அம்சத்தைப் பாதுகாக்கிறது; ‘மறுக்கிறீர்கள்’ என்பதுபோல் மூலத்தைவிட வலுவாக்குவதில்லை.
- source_word: ἐλθεῖν πρός με
  choice: என்னிடம் வர
  rationale: πρός + வேற்றுமை உருபுடன் ἐλθεῖν என்பது இயல்பாக ‘என்னிடம் வர’ எனப் பொருள்படும். யோவானில் இதற்கு நம்பிக்கை சார்ந்த உட்பொருள் இருந்தாலும், ‘என்னை நம்ப’ என்று விளக்கமளிக்காமல் மூல உருவகமே காக்கப்படுகிறது.
- source_word: ἵνα
  choice: பெறும்படி
  rationale: ἵνα இங்கு நோக்கத்தைக் காட்டுகிறது. தமிழில் வினையெச்ச நோக்கக் கட்டமைப்பான ‘பெறும்படி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ζωὴν
  choice: வாழ்வு
  rationale: ζωή என்பதன் நேரடியான பொருள் ‘வாழ்வு’. யோவானில் அது தேவனிடமிருந்து வரும் நித்திய வாழ்வைக் குறிக்கும் ஆழத்தைக் கொண்டிருந்தாலும், இங்கு αἰώνιος என்ற சொல் இல்லை.
- source_word: ἔχητε
  choice: பெற
  rationale: ἔχω அடிப்படையில் ‘கொண்டிரு’ என்றாலும், வாழ்வைப் பற்றிய தமிழ்ச் சொல்லாட்சியில் ‘வாழ்வைப் பெற’ என்பது இயல்பானது; ἵνα உடன் வரும் நிகழ்காலத் துணைவினையின் நோக்கப் பொருளையும் இது தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ζωὴν என்பதை ‘வாழ்வு’ என்றா ‘நித்திய வாழ்வு’ என்றா மொழிபெயர்ப்பது
  choice: வாழ்வு
  alternative: நித்திய வாழ்வு
  rationale: யோவானின் பயன்பாட்டில் இரட்சிப்பு சார்ந்த, தேவனிடமிருந்து வரும் நித்திய வாழ்வு என்ற ஆழம் உள்ளது. எனினும் இவ்வசனத்தில் ‘நித்திய’ என்பதற்கான αἰώνιος இல்லை; ஆகவே அந்தச் சொல்லை முதன்மை உரையில் சேர்க்காமல் சூழல் தரும் ஒலிப்பை நிலைநிறுத்துகிறது.
- issue: ‘என்னிடம் வர’ என்பதை நம்பிக்கையாக விளக்கி மொழிபெயர்ப்பதா
  choice: என்னிடம் வர
  alternative: என்னை நம்ப
  rationale: யோவானில் இயேசுவிடம் வருதல் நம்புதலோடு நெருக்கமாக இணைந்துள்ளது. இருப்பினும் மூலத்தில் ‘வருதல்’ என்ற உருவகம் உள்ளதால், அதை விளக்கமாக மாற்றாமல் பாதுகாப்பது இறையியல் செறிவையும் உண்மையான வெளிப்பாட்டு வடிவத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆனாலும்’ சூழலிலுள்ள முரண்பாட்டைத் தெளிவாக்குகிறது; ‘உங்களுக்கு விருப்பமில்லை’ மனவிருப்பத்தைச் சுட்டுகிறது; ‘என்னிடம் வர’ என்ற யோவானிய உருவகமும் ‘வாழ்வு’ என்ற திட்டமிட்ட சுருக்கமும் மாற்றமின்றி காக்கப்பட்டுள்ளன.
