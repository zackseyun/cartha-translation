id: JHN.5.38
reference: John 5:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: ta
  text: உங்களுக்குள் அவருடைய வார்த்தை நிலைத்திருக்கவில்லை; ஏனெனில், அவர் அனுப்பியவரை நீங்கள் நம்புவதில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: வார்த்தை
  rationale: இங்கு λόγος என்பது கடவுளுடைய வெளிப்படுத்தப்பட்ட வார்த்தையைக் குறிக்கிறது. ‘வார்த்தை’ என்பது யோவான் நூலின் சொற்பயன்பாட்டையும் அதன் விரிவான எதிரொலியையும் இயன்றவரை காக்கிறது.
- source_word: ἔχετε ... ἐν ὑμῖν μένοντα
  choice: உங்களுக்குள் நிலைத்திருப்பதும் இல்லை
  rationale: தமிழில் இயல்பாக அமையும்படி ‘உங்களிடம் இல்லை’ என்ற வினையையும் ‘நிலைத்திருக்கிற’ என்ற பங்கேற்பு வடிவையும் ஒரே தொடராக வழங்குகிறது; μένω என்பதிலுள்ள தொடர்ந்திருக்கும் பொருளையும் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் ὅτι என்பதன் காரணப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: அவர் அனுப்பியவரை
  rationale: ἐκεῖνος சூழலில் பிதாவைக் குறிக்கிறது; சார்பு வாக்கியத்தின் தனிநபர் குறிப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: அவரை நீங்கள் நம்புவதில்லை
  rationale: τούτῳ என்பது அனுப்பப்பட்ட இயேசுவை வலியுறுத்திக் குறிக்கிறது. தமிழில் சார்பு வாக்கியத்துடன் இணைந்த ‘அனுப்பியவரை’ என்பதே அந்தச் சுட்டையும் பொருளையும் தெளிவாகத் தருகிறது; πιστεύω என்பதற்கு ‘நம்பு’ நேரான நவீன இணை.
theological_decisions:
- issue: கடவுளுடைய வார்த்தை அவர்களுக்குள் நிலைத்திராததற்கும் அனுப்பப்பட்டவரை அவர்கள் நம்பாததற்கும் உள்ள தொடர்பு
  choice: அவர்கள் அனுப்பப்பட்டவரை நம்பாததே, கடவுளுடைய வார்த்தை அவர்களுக்குள் நிலைத்திருக்கவில்லை என்பதற்கான காரணமாக உரையின் காரணத் தொடர்புடன் வழங்கப்பட்டுள்ளது.
  alternative: இது வேதவார்த்தையை உள்ளத்தில் தக்கவைக்காமை அல்லது அதற்குக் கீழ்ப்படியாமை பற்றிய குறுகிய குறிப்பாகவும் புரிந்துகொள்ளப்படலாம்.
  rationale: மறுபிறப்பு, உள்ளுறைதல், நிலைத்திருத்தல் ஆகியவற்றைப் பற்றிய ஒரு குறிப்பிட்ட சமயக்கோட்பாட்டைச் சேர்க்காமல், கிரேக்க உரையின் காரணத் தொடர்பையும் யோவானிய இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு அப்படியே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பான, கண்ணியமான நடை. ‘வசனம்’ என்பதற்குப் பதிலாக இன்றைய பொதுப் பயன்பாட்டில் வெளிப்படையான ‘வார்த்தை’ தேர்ந்தெடுக்கப்பட்டது; ‘நிலைத்திரு’ என்பது μένω-வின் தொடர்ச்சிப் பொருளை காக்கிறது.
