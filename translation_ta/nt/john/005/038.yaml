revisions:
- from: அவருடைய வார்த்தை உங்களுக்குள் நிலைத்திருப்பதும் இல்லை; ஏனெனில், அவர் அனுப்பியவரை நீங்கள் நம்புவதில்லை.
  to: உங்களுக்குள் அவருடைய வார்த்தை நிலைத்திருக்கவில்லை; ஏனெனில், அவர் அனுப்பியவரை நீங்கள் நம்புவதில்லை.
  rationale: The revision removes the unmotivated “-உம்” and recasts the first clause as natural modern Tamil. It preserves the source’s present negative assertion, the durative sense of μένω, the causal connection, and the distinction between the one who sent and the one sent, without importing doctrinal conclusions.
  reviewer_model: gpt-5.6-terra
