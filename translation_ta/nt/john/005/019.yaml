source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: ta
  text: 'ஆகையால் இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “உறுதியாக, உறுதியாக உங்களுக்குச் சொல்கிறேன்: தந்தை செய்வதைப் பார்க்காமல், மகன் தாமாக எதையும் செய்ய இயலாது[a]. ஏனெனில் அவர் எவற்றையெல்லாம் செய்கிறாரோ, அவற்றையே மகனும் அதேவிதமாகச் செய்கிறார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “மகன் தம்மிடமிருந்து எதையும் செய்ய இயலாது; தந்தை எதையாவது செய்வதை அவர் பார்த்தால் மட்டுமே செய்ய இயலும்.”'
    reason: கிரேக்கத்தின் ἀφ’ ἑαυτοῦ மற்றும் ἐὰν μή τι ஆகியவற்றின் வடிவத்தை நெருக்கமாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: இக்கூற்று மகன் தந்தையைத் தவிர்த்து தனியே செயல்படுவதில்லை என்பதையும், தந்தை செய்வதையே மகனும் அதேவிதமாகச் செய்கிறார் என்பதையும் இணைத்துக் கூறுகிறது.
    reason: வசனத்தின் இரு கூறுகளுக்கிடையிலான இறையியல் பதற்றத்தையும் செயல்களின் ஒற்றுமையையும் விளக்குகிறது; மூலத்தில் இல்லாத கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: ஆகையால் இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்
  rationale: οὖν என்பதன் தொடர்ச்சி/தீர்மானச் சாயலை ‘ஆகையால்’ காட்டுகிறது. ἀπεκρίνατο καὶ ἔλεγεν என்ற இரட்டை வெளிப்பாட்டை இயல்பான தமிழில் ‘பதிலளித்துச் சொன்னார்’ என வழங்குகிறது; இறந்தகாலத் தொடர்வினை வடிவை செயற்கையாக நீட்டிக்கவில்லை.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: உறுதியாக, உறுதியாக உங்களுக்குச் சொல்கிறேன்
  rationale: இருமுறை வரும் Ἀμὴν-இன் வலியுறுத்தலையும் இயேசுவின் கூற்றின் நிகழ்கால வடிவையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: மகன் தாமாக எதையும் செய்ய இயலாது
  rationale: δύναται என்பதன் இயல்திறன் சார்ந்த பொருளை ‘இயலாது’ காக்கிறது. ἀφ’ ἑαυτοῦ என்பதற்கு மரியாதை ஒருமையுடன் ‘தாமாக’ என்பது தன்னிலிருந்து/தன்னிச்சையாக என்ற தொடர்புச் சார்பைச் சுருக்கமாகத் தருகிறது.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: தந்தை செய்வதைப் பார்க்காமல்
  rationale: விதிவிலக்கைக் குறிக்கும் ἐὰν μή அமைப்பை இயல்பான தமிழில் எதிர்மறை வினையெச்சமாக வழங்குகிறது. τι-யின் திறந்த பொருள் ‘செய்வதை’ என்பதில் சூழலோடு அடங்குகிறது.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: ஏனெனில் அவர் எவற்றையெல்லாம் செய்கிறாரோ
  rationale: ἃ ... ἂν என்பதன் பொதுப்படுத்தும் ‘எதுவாக இருந்தாலும்’ பொருளை ‘எவற்றையெல்லாம்’ காக்கிறது. ἐκεῖνος தந்தையைக் குறித்தாலும், தமிழில் ‘அவர்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: அவற்றையே மகனும் அதேவிதமாகச் செய்கிறார்
  rationale: ταῦτα-வின் சுட்டையும் καί/ὁμοίως தரும் முழுமையான ஒத்திசைவையும் ‘அவற்றையே ... அதேவிதமாக’ என்பவை வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: மகனுடைய இயலாமை மற்றும் தந்தையுடனான செயல் சார்பை எவ்வாறு மொழிபெயர்ப்பது
  choice: மகன் தாமாக எதையும் செய்ய இயலாது
  alternative: மகன் தன்னிச்சையாக எதையும் செய்வதில்லை
  rationale: மூலம் ‘செய்ய விரும்புவதில்லை’ என்று அல்ல, ‘செய்ய இயலாது’ என்று கூறுவதால் δύναται-யின் வலிமை காக்கப்படுகிறது. அதேவேளையில், வசனம் கூறாத மெய்யியல் முடிவை மொழிபெயர்ப்புக்குள் சேர்க்காமல், தந்தை–மகன் செயல்களின் பிரிக்கமுடியாத ஒற்றுமை அடுத்த கூறில் நிற்கவிடப்படுகிறது.
- issue: ὁ υἱός மற்றும் ὁ πατήρ ஆகிய உறவுப்பெயர்களின் வழங்கல்
  choice: மகன் / தந்தை
  alternative: குமாரன் / பிதா
  rationale: ‘மகன்’ மற்றும் ‘தந்தை’ என்பவை நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருந்து, யோவான் நற்செய்தியின் தனித்துவமான உறவுப்பொருளைத் தெளிவாகக் காக்கின்றன; குறிப்பிட்ட திருச்சபை மரபின் சொற்களைத் தேவையின்றி முன்னிறுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பிதா/குமாரன்’ என்பவற்றுக்குப் பதிலாக இயல்பான ‘தந்தை/மகன்’ பயன்படுத்தப்பட்டுள்ளன. இயேசுவுக்கும் தெய்வீகக் குறிப்புகளுக்கும் மரியாதை ஒருமை கடைப்பிடிக்கப்பட்டுள்ளது.
