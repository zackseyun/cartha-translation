  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: ta
  text: ஆனால் குணமாக்கப்பட்டவர் அவர் யார் என்று அறியவில்லை; ஏனெனில், அந்த இடத்தில் மக்கள் கூட்டம் இருந்ததால் இயேசு கவனிக்கப்படாமல் விலகிச் சென்றிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விலகிச் சென்றிருந்தார்” அல்லது “நழுவிச் சென்றிருந்தார்” என்றும் மொழிபெயர்க்கலாம். இயேசு பிறர் கவனத்திற்கு வராதபடி அங்கிருந்து சென்றதை கிரேக்க வினை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: குணமாக்கப்பட்டவர்
  rationale: கட்டுரையுடன் பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலச் செயலெச்சத்தின் ஆண்பால் ஒருமையையும், செயப்பாட்டு பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐκ ᾔδει
  choice: அறிந்திருக்கவில்லை
  rationale: அந்த நேரத்தில் அவருடைய அடையாளம் தெரியாமல் இருந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τίς ἐστιν
  choice: அவர் யார் என்று
  rationale: இயேசுவைக் குறிக்கும் தனிப்பட்ட மறைமுகக் கேள்வியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξένευσεν
  choice: யாரும் கவனிக்காதபடி விலகிச் சென்றிருந்தார்
  rationale: வெறுமனே சென்றார் என்பதைக் காட்டிலும், பிறர் கவனத்திற்கு வராமல் விலகிச் சென்றார் என்ற ἐκνεύω வினையின் நுட்பத்தை வெளிப்படுத்துகிறது; முன் நிகழ்ந்த செயல் என்பதையும் காலவடிவம் காட்டுகிறது.
- source_word: ὄχλου ὄντος
  choice: மக்கள் கூட்டம் இருந்ததால்
  rationale: இந்தப் பிறப்புநிலைத் தொடரை காரணமாகவோ உடனிகழ் சூழலாகவோ புரிந்துகொள்ள முடியும்; இங்கு விளக்கக் காரணமாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ἐν τῷ τόπῳ
  choice: அந்த இடத்தில்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடரை வெளிப்படையாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
