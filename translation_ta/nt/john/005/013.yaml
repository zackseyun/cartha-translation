  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ἐξένευσεν என்பதன் மறைவான அல்லது கவனிக்கப்படாத புறப்பாட்டுச் சாயல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
