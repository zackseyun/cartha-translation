id: JHN.5.30
reference: John 5:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: ta
  text: “நானாக எதையும் செய்ய என்னால் இயலாது. நான் கேட்கிறபடியே தீர்ப்பளிக்கிறேன்; என் தீர்ப்பு நீதியானது. ஏனெனில், நான் என் சொந்த விருப்பத்தை நாடாமல், என்னை அனுப்பியவரின் விருப்பத்தையே நாடுகிறேன்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: என்னால் இயலாது
  rationale: δύναμαι என்பதின் திறன் சார்ந்த பொருளையும் மறுப்பையும் இயல்பான நவீன தமிழில் தருகிறது; ἐγώ தரும் வலியுறுத்தல் வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: நானாக எதையும் செய்ய
  rationale: ἀπ’ ἐμαυτοῦ என்பது வெறுமனே தனியாகச் செய்வதை அல்ல, தன்னிலிருந்து அல்லது சுயாதீனமாகச் செயல்படுவதைச் சுட்டுகிறது. ‘நானாக’ என்பது இவ்விரு நுணுக்கங்களையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: καθὼς ἀκούω
  choice: நான் கேட்கிறபடியே
  rationale: καθὼς என்பதின் ஒத்திசைவு அல்லது ஏற்பு சார்ந்த பொருளையும் ἀκούω என்பதின் நிகழ்காலப் பொதுத்தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρίνω
  choice: தீர்ப்பளிக்கிறேன்
  rationale: யோவான் நூலில் உள்ள நீதித்துறைச் சூழலைத் தெளிவாகக் காட்டுகிறது; வெறும் ‘முடிவெடுக்கிறேன்’ என்பதைவிட κρίσις உடனான சொற்பொருள் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: என் தீர்ப்பு
  rationale: கிரேக்கச் சொற்றொடரின் இயல்பான தமிழாக்கம்; κρίνω உடனான நீதித்துறைத் தொடர்பையும் காக்கிறது.
- source_word: δικαία
  choice: நீதியானது
  rationale: தீர்ப்பு என்ற நீதித்துறைச் சூழலில் சரியானதும் பாரபட்சமற்றதுமான தீர்ப்பைக் குறிக்கும் இயல்பான தமிழ் இணை.
- source_word: ζητῶ
  choice: நாடுகிறேன்
  rationale: தேடுதல் மட்டுமல்லாமல் நோக்கமாகக் கொள்ளுதல், விரும்பிப் பின்பற்றுதல் ஆகிய விருப்பச் சார்ந்த நுணுக்கத்தை உயர்வான இயல்பான தமிழில் தருகிறது.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: என் சொந்த விருப்பத்தை
  rationale: ἐμὸν தரும் வலியுறுத்தலை ‘சொந்த’ என்பதால் வெளிப்படுத்துகிறது; ‘நான் விரும்புவதை’ என்று விளக்கமாக மாற்றாமல் θέλημα என்பதின் பெயர்ச்சொல் வடிவத்தைக் காக்கிறது.
- source_word: τοῦ πέμψαντός με
  choice: என்னை அனுப்பியவரின்
  rationale: கிரேக்கப் பெயரெச்சத் தொடரைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது; மூலத்தில் இல்லாத ‘தந்தை’ என்ற அடையாளத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ என்பதில் மகனுடைய செயலுக்கும் அவரை அனுப்பியவருக்கும் உள்ள உறவு
  choice: ‘நானாக’ என்று மொழிபெயர்த்து, சுயாதீனமான மூலத்திலிருந்து செயல்படாமையை வெளிப்படுத்துதல்
  alternative: ‘என் சொந்தமாக’ அல்லது ‘தனியாக’
  rationale: வசனம் முழுமையான ஆற்றலின்மையைத் தீர்மானித்துச் சொல்வதைவிட, கேட்டபடியே தீர்ப்பளிக்கும் உறவுசார் சார்பையும் ஒருமைப்பாட்டையும் முன்வைக்கிறது. ‘நானாக’ என்பது இந்தத் தத்துவ இறுக்கத்தை விளக்கவுரை சேர்க்காமல் தக்கவைக்கிறது.
- issue: κρίσις உடன் δικαία என்பதன் பொருள்
  choice: ‘நீதியானது’
  alternative: ‘நேர்மையானது’ அல்லது ‘சரியானது’
  rationale: நீதித்துறைச் சூழலில் தீர்ப்பின் நீதி மற்றும் நியாயத்தன்மையைத் தெளிவாகக் கூறுகிறது; ஒழுக்கத் தன்மையை மட்டும் குறிக்கும் சொல்லாகச் சுருக்குவதில்லை.
- issue: θέλημα என்பதற்கான தமிழ் சொல்
  choice: ‘விருப்பம்’
  alternative: ‘சித்தம்’
  rationale: ‘விருப்பம்’ நவீன பொதுத் தமிழில் உடனடியாகப் புரியும்; அதே நேரத்தில் இங்கு குறிக்கப்படும் நோக்கம் அல்லது மனவிருப்பத்தைச் சரியாகத் தருகிறது. ‘சித்தம்’ மரபான இறையியல் சொல்லாக இருந்தாலும் சாதாரண வாசகருக்கு குறைவாக இயல்பாக இருக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘தீர்ப்பளிக்கிறேன்’ மற்றும் ‘நீதியானது’ மூலம் நீதித்துறைச் சொற்களின் தொடர்ச்சி காக்கப்பட்டது. ‘விருப்பம்’ பொதுவாசகருக்கு ‘சித்தம்’ என்பதைக் காட்டிலும் தெளிவானது. இவ்வசனத்தில் தனிப் பதிப்புக் குறிப்பு அவசியமில்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
