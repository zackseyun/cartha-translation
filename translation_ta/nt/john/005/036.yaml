reference: John 5:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: ta
  text: ஆனால் யோவானுடைய சாட்சியைவிட மேலான சாட்சி எனக்கு உண்டு[a]. ஏனெனில், நான் நிறைவேற்றுவதற்காகத் தந்தை எனக்குக் கொடுத்துள்ள செயல்கள்—நான் செய்துவரும் இந்தச் செயல்களே—தந்தை என்னை அனுப்பியுள்ளார் என்று என்னைக் குறித்துச் சாட்சி அளிக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோவானுடைய சாட்சியைவிட வலிமையான சாட்சி எனக்கு உண்டு.”
    reason: μείζω என்பது சூழலில் ‘மேலான’ என்றும் சான்றளிக்கும் வலிமையில் ‘வலிமையான’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: சாட்சி
  rationale: யோவான் நற்செய்தியில் உள்ள சான்றளிக்கும், உண்மையை உறுதிப்படுத்தும் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: μείζω τοῦ Ἰωάννου
  choice: யோவானுடைய சாட்சியைவிட மேலான
  rationale: ஒப்பீட்டின் விடுபட்ட உறுப்பான ‘சாட்சி’ என்பதைத் தமிழில் தெளிவுக்காக வெளிப்படுத்துகிறது; μείζω என்பதன் மேன்மை/அதிக வலிமை என்ற கருத்தை ‘மேலான’ இயல்பாகக் காட்டுகிறது.
- source_word: ἔργα
  choice: செயல்கள்
  rationale: இயேசுவின் அடையாள அற்புதங்களுக்கு மட்டும் பொருளைக் குறுக்காமல், தந்தை அளித்த முழு பணிச் செயல்பாட்டையும் உள்ளடக்கக்கூடிய பரந்த சொல்லாக உள்ளது.
- source_word: δέδωκέν μοι ὁ πατήρ
  choice: தந்தை எனக்குக் கொடுத்துள்ள
  rationale: கிரேக்க நிறைவுக்காலத்தின் தொடரும் விளைவை ‘கொடுத்துள்ள’ வெளிப்படுத்துகிறது; ὁ πατήρ என்பதைக் கூடுதல் உரிமைப்பெயர் சேர்க்காமல் ‘தந்தை’ என வழங்குகிறது.
- source_word: ἵνα τελειώσω αὐτά
  choice: நான் நிறைவேற்றுவதற்காக
  rationale: ἵνα-வின் நோக்குப் பொருளையும், τελειόω-வின் ஒப்படைக்கப்பட்ட செயலை முழுமைக்கு கொண்டுவரும் கருத்தையும் காக்கிறது.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: நான் செய்துவரும் இந்தச் செயல்களே
  rationale: αὐτά தரும் வலியுறுத்தலை ‘-களே’ காட்டுகிறது; நிகழ்காலச் செயற்பாட்டை ‘செய்துவரும்’ தெரிவிக்கிறது.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: என்னைக் குறித்துச் சாட்சி அளிக்கின்றன
  rationale: சட்ட/சான்று சார்ந்த நுண்பொருளைத் தக்கவைத்து, பன்மையான ‘செயல்கள்’ என்பதோடு தமிழில் இலக்கண ஒத்திசைவை வழங்குகிறது.
- source_word: ἀπέσταλκεν
  choice: அனுப்பியுள்ளார்
  rationale: தந்தைக்குரிய மரியாதை வினைமுற்றுடன், அனுப்புதல் நிறைவேறியதும் அதன் முக்கியத்துவம் தொடர்வதும் இயல்பான தமிழில் வெளிப்படுகிறது.
theological_decisions:
- issue: இயேசுவை உறுதிப்படுத்தும் சாட்சியின் இயல்பு
  choice: தந்தை ஒப்படைத்த செயல்கள் யோவானின் சாட்சியைவிட மேலான சாட்சியாக இருந்து, தந்தையே இயேசுவை அனுப்பியுள்ளார் என்பதை உறுதிப்படுத்துகின்றன.
  alternative: ‘செயல்கள்’ என்பவற்றை அதிகாரத்தை நிரூபிக்கும் அற்புதங்கள் மட்டுமே எனக் குறுக்குவது.
  rationale: ἔργα என்பது இங்கு அற்புதங்களை உள்ளடக்கலாம்; ஆனால் சொல் இயேசுவின் தெய்வீகமாக ஒப்படைக்கப்பட்ட பணியின் முழுப் பரப்பையும் குறிக்க முடிவதால் மொழிபெயர்ப்பு அதைச் சுருக்கவில்லை.
- issue: ὁ πατήρ என்பதன் கிறிஸ்துவியல் உறவு
  choice: தந்தை
  alternative: கடவுள்; என் தந்தை
  rationale: மூலத்தில் உள்ள ὁ πατήρ என்ற பட்டப்பெயரைப் பாதுகாத்து, இல்லாத உரிமைப்பெயரையோ மாற்றுப் பெயரையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. ‘செயல்கள்’ என்பது யோவானின் ἔργα சொல்லின் பரந்த இறையியல் ஒலியைப் பாதுகாக்கிறது. இடைக்கோடுகள் கிரேக்கத்தின் வலியுறுத்தப்பட்ட மீளுரையை தெளிவாகக் காட்டுகின்றன.
