source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: ta
  text: ஏனெனில், தந்தை தம்மிலேயே வாழ்வைக் கொண்டிருப்பதுபோல, மகனும் தம்மிலேயே வாழ்வைக் கொண்டிருக்கும்படி தந்தை மகனுக்கு அளித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அளித்தார்’ என்பதற்கு ‘கொடுத்தார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இங்கு ‘கொடு’ என்பதற்கான வழக்கமான வினைச்சொல் உள்ளது; சூழலில் வழங்கப்பட்ட தனிச்சிறப்பு அல்லது உரிமையை இயல்பாக உணர்த்த ‘அளித்தார்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், ... போல
  rationale: γάρ தரும் விளக்கத் தொடர்பையும் ὥσπερ தொடங்கும் ஒப்புமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ πατὴρ
  choice: தந்தை
  rationale: யோவான் நற்செய்தியில் கடவுளைக் குறிக்கும் உறவுமுறைப் பட்டத்தை நேரடியாக வழங்குகிறது.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: தம்மிலேயே வாழ்வைக் கொண்டிருப்பது
  rationale: ἔχει என்பதன் நிகழ்காலக் கூற்றையும் ἐν ἑαυτῷ என்பதன் வலியுறுத்தலையும் காக்கிறது; ‘சுயமாக நிலவும் வாழ்வு’ போன்ற பிற்கால இறையியல் சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: οὕτως καὶ
  choice: '...போல, ...வும்'
  rationale: ὥσπερ...οὕτως καὶ என்ற ஒப்புமை அமைப்பை இயல்பான தமிழ் இணை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: τῷ υἱῷ
  choice: மகனுக்கு / அவர்
  rationale: ἔδωκεν என்பதன் மறைமுகச் செயப்படுபொருளை ‘மகன்’ என்ற கிறிஸ்துவியல் பட்டத்துடன் தருகிறது; வாக்கியத்தில் இயல்புக்காக பின்னர் ‘அவருக்கு’ எனக் குறிப்பிடப்படுகிறது.
- source_word: ἔδωκεν
  choice: அளித்தார்
  rationale: சாதாரணமாக ‘கொடுத்தார்’ என்று பொருள்படும் அஓரிஸ்ட் வினையை, இங்கு வழங்கப்பட்ட உரிமை அல்லது தனிச்சிறப்பைக் குறிக்கும் மரியாதையான இயல்பான தமிழில் தருகிறது; அதன் கொடுத்தல் என்ற அடிப்படை உணர்வை இழக்கவில்லை.
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: தம்மிலேயே வாழ்வைக் கொண்டிருக்கும்படி
  rationale: இறந்தகால முதன்மை வினையுடன் வரும் infinitive அமைப்பை நோக்கம்/விளைவு சார்ந்த இயல்பான தமிழ் வடிவில் தருகிறது; தந்தை–மகன் இணைநிலையைப் பாதுகாக்க அதே சொற்றொடர் மீண்டும் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ἐν ἑαυτῷ என்பதை தொழில்நுட்ப இறையியல் சொல்லாக விரிவாக்க வேண்டுமா
  choice: ‘தம்மிலேயே வாழ்வு’ என்ற மூலத்தின் நேரடி உருவகத்தை வைத்திருத்தல்
  alternative: ‘சுயமாக நிலவும் வாழ்வு’ அல்லது ‘தன்னிலைத்த வாழ்வு’
  rationale: வசனம் தந்தைக்கும், அவரால் அளிக்கப்பட்ட விதத்தில் மகனுக்கும், தம்மிலேயே வாழ்வு இருப்பதாகச் சொல்கிறது. ‘aseity’ போன்ற பிற்கால கோட்பாட்டுச் சுருக்கத்தை முதன்மை உரையில் புகுத்தாமல் அதன் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் காக்கிறது.
- issue: தந்தை மகனுக்கு ἔδωκεν என்பதைக் கூறும் விதம்
  choice: ‘அளித்தார்’ என்று மொழிபெயர்த்து கொடுத்தல் மொழியைப் பாதுகாத்தல்
  alternative: ‘கொடுத்தார்’
  rationale: மூலம் தந்தை மகனுக்கு அளித்தார் என்று தெளிவாகக் கூறுகிறது. மகனின் தெய்வீகத்தைத் தளர்த்தும் விளக்கமோ, மூலத்தின் கொடுத்தல் மொழியை மென்மைப்படுத்தும் சேர்க்கையோ இன்றி கூற்றை அப்படியே நிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘தம்மிலேயே’ என்பது மரியாதைப் பன்மையைப் பயன்படுத்தி தந்தை–மகன் இணை அமைப்பையும் மீளுரைப்பையும் காக்கிறது. தொழில்நுட்ப இறையியல் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
