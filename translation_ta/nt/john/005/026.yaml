revisions:
- from: ஏனெனில், தந்தை தம்மிலேயே வாழ்வைக் கொண்டிருப்பதுபோல, மகனும் தம்மிலேயே வாழ்வைக் கொண்டிருக்கும்படி அவருக்கு அளித்தார்.[a]
  to: ஏனெனில், தந்தை தம்மிலேயே வாழ்வைக் கொண்டிருப்பதுபோல, மகனும் தம்மிலேயே வாழ்வைக் கொண்டிருக்கும்படி தந்தை மகனுக்கு அளித்தார்.[a]
  rationale: The revision explicitly supplies ‘தந்தை’ as the subject of ‘அளித்தார்’ and uses ‘மகனுக்கு’ to represent the Greek dative ‘τῷ υἱῷ.’ It retains the repeated ‘தம்மிலேயே வாழ்வு’ wording and the source’s statement that the Son’s having life in himself is given by the Father. The repetition of ‘தந்தை’ and ‘மகன்’ is intentional for clarity in Tamil and does not alter the meaning.
  reviewer_model: gpt-5.6-terra
