source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: ta
  text: இதன் காரணமாகவே யூதர்கள்[a] அவரைக் கொல்ல இன்னும் அதிகமாக முயன்றுகொண்டிருந்தார்கள். ஏனெனில், அவர் ஓய்வுநாளை மீறிக்கொண்டிருந்ததோடு மட்டுமல்லாமல், கடவுளைத் தம் சொந்தத் தந்தை என்று சொல்லி, தம்மைக் கடவுளோடு சமமானவராக்கிக்கொண்டிருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோவான் நற்செய்தியில் “யூதர்கள்” என்பது சூழலுக்கேற்ப எல்லா யூத மக்களையும் வேறுபாடின்றிக் குறிக்காமல், இயேசுவை எதிர்த்த குறிப்பிட்ட யூதேயர்களையோ சில யூத அதிகாரிகளையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “தம்மைக் கடவுளுக்குச் சமமானவராக்கிக்கொண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: இதனால்தான்
  rationale: இரு தொடரிணைப்புச் சொற்களும் முந்தைய நிகழ்விலிருந்து வரும் காரணவிளைவு உறவை வலுப்படுத்துகின்றன; நவீன தமிழில் ‘இதனால்தான்’ அந்தக் கூட்டு வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: μᾶλλον
  choice: இன்னும் அதிகமாக
  rationale: முன்பிருந்த கொலைநோக்கம் இப்போது தீவிரமடைந்ததை ஒப்பீட்டு வலியுறுத்தலுடன் காட்டுகிறது.
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: கொல்ல ... முயன்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வினையான ἐζήτουν குறிக்கும் நீடித்த அல்லது தொடர்ந்த முயற்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: மூலத்தின் நேரடியான இன-சமயக் குறியீட்டை முதன்மை உரையில் பாதுகாக்கிறது; சூழலில் அதன் குறிப்பு எல்லா யூதர்களையும் அல்ல என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἔλυε τὸ σάββατον
  choice: ஓய்வுநாளை மீறியதோடு
  rationale: λύω இங்கு ஓய்வுநாள் ஒழுங்கைத் தளர்த்துதல் அல்லது மீறுதல் என்ற வழக்குச் சார்ந்த பொருளில் வருகிறது; ‘மீறுதல்’ குற்றச்சாட்டின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: கடவுளைத் தம் சொந்தத் தந்தை என்றும் சொல்லி
  rationale: ἴδιον என்பதன் வலியுறுத்தலான ‘சொந்த’ என்ற பொருளையும், ἔλεγε என்பதன் ‘சொல்லுதல்/அழைத்தல்’ கருத்தையும் பாதுகாக்கிறது.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: தம்மைக் கடவுளுக்குச் சமமாக்கிக்கொண்டார்
  rationale: சமத்துவத்தை வெளிப்படையாகக் கூறும் பங்கேற்பு வாக்கியத்தைத் தணிக்காமல், தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: கடவுளோடு சமம் என்பதன் கிறிஸ்துவியல் வலிமை
  choice: தம்மைக் கடவுளுக்குச் சமமாக்கிக்கொண்டார்
  alternative: தாம் கடவுளுக்குச் சமம் என்று உரிமைகோரினார்
  rationale: மூலத்தில் உள்ள ποιῶν (‘ஆக்குதல்/செய்தல்’) என்ற உருவகத்தைப் பாதுகாத்து, சமத்துவக் கூற்றைத் தணிக்காமல் தருகிறது; அதேவேளை பிற்காலக் கோட்பாட்டுச் சொற்களைச் சேர்க்கவில்லை.
- issue: ‘யூதர்கள்’ என்பதன் சூழல்சார் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என வைத்து அடிக்குறிப்பில் சூழலை விளக்குதல்
  alternative: யூதத் தலைவர்கள் / யூதேயர்கள்
  rationale: οἱ Ἰουδαῖοι என்ற மூலச் சொல்லை குறுகிய விளக்கமாக மாற்றாமல் பாதுகாக்கிறது; யோவான் நற்செய்தியில் இது பெரும்பாலும் குறிப்பிட்ட எதிரிகளையோ அதிகாரிகளையோ சுட்டும் சூழலுணர்வை அடிக்குறிப்பு வழங்குகிறது.
- issue: சமமாக்கியது இயேசுவின் நோக்கமா அல்லது அவரது சொல்லின் விளைவாகக் கூறப்படும் முடிவா
  choice: மூலத்தின் காரணவியல் தொடர்பைத் திறந்தவாறே வைத்தல்
  alternative: அவர்கள் கருதினபடி, தம்மைக் கடவுளுக்குச் சமமாக்கினார்
  rationale: கிரேக்க உரையில் ‘அவர்கள் கருதினபடி’ என்ற வெளிப்படையான வரையறை இல்லை. அதைச் சேர்க்காமல் இருப்பது உரையாசிரியரின் விளக்கத்துக்கும் எதிரிகளின் குற்றச்சாட்டுக்கும் இடையிலான இயல்பான பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. இயேசுவைக் குறிக்கும் மரியாதைப் பன்மை ஒருமையாகத் தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது; ‘ஓய்வுநாள்’ மற்றும் ‘கடவுள்’ ஆகியவை பொதுவாகப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
