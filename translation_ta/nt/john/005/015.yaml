id: JHN.5.15
reference: John 5:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: ta
  text: அந்த மனிதர் அங்கிருந்து சென்று, தன்னை நலமாக்கியவர் இயேசு என்று யூதர்களிடம்[a] தெரிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, யோவான் இச்சூழலில் ‘யூதர்கள்’ என்ற சொல்லைப் பயன்படுத்தியிருப்பதை எவ்வாறு புரிந்துகொள்கிறோம் என்பதைப் பொறுத்து, ‘யூதத் தலைவர்களிடம்’ அல்லது ‘யூதேயர்களிடம்’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: அங்கிருந்து சென்று
  rationale: காட்சியிடத்திலிருந்து அவர் புறப்பட்டுச் சென்றதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὁ ἄνθρωπος
  choice: அந்த மனிதர்
  rationale: முன்னர் குணமடைந்த ஆண் நபரைச் சுட்டுகிறது; மரியாதையான நவீனத் தமிழ் நடை.
- source_word: ἀνήγγειλεν
  choice: தெரிவித்தார்
  rationale: தகவலைக் கூறி அறியச் செய்தல் என்ற பொருளைத் தருகிறது; ‘அறிவித்தார்’ என்பதிலுள்ள பொதுப் பிரகடன நிழலைத் தவிர்க்கிறது.
- source_word: τοῖς Ἰουδαίοις
  choice: யூதர்களிடம்
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருளை முதன்மை உரையில் தக்கவைக்கிறது; யோவான் நற்செய்தியிலுள்ள சூழல்சார் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ὅτι
  choice: என்று
  rationale: தமிழில் தெரிவிக்கப்பட்ட செய்தியின் உள்ளடக்கத்தை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: Ἰησοῦς ἐστιν
  choice: இயேசு என்று
  rationale: ‘இயேசுவே’ என்று வலியுறுத்தாமல், இயேசுவை அந்தச் செயலைச் செய்தவராக அடையாளப்படுத்துகிறது.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: தன்னை நலமாக்கியவர்
  rationale: ποιέω + ὑγιής என்ற ‘நலமுள்ளவராக ஆக்குதல்’ அமைப்பைப் பாதுகாக்கிறது; தமிழில் பொருள் தெளிவதற்காக αὐτόν என்பதை எழுவாயோடு தொடர்புடைய ‘தன்னை’ என வழங்குகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் ‘யூதர்கள்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’ என்பதைத் தக்கவைத்து, சூழலுக்கேற்ப இருக்கக்கூடிய பொருள்களை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’
  rationale: Ἰουδαίοις என்ற மூலச்சொல்லைத் தேவையின்றி குறுகலாக விளக்காமல் பாதுகாக்கிறது; அதேவேளையில் யோவானின் பயன்பாட்டிலுள்ள உண்மையான சூழல்சார் தெளிவின்மையையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘அந்த மனிதர்’ மற்றும் மரியாதைப் பன்மை வினைமுற்றுகள் தமிழ் வேதாகம நடைக்கு ஏற்றவையாக உள்ளன; மூலத்தில் இல்லாத குற்றஞ்சாட்டும் நோக்கம் சேர்க்கப்படவில்லை.
