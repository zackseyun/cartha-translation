id: JHN.5.24
reference: John 5:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: ta
  text: '“மெய்யாகவே, மெய்யாகவே நான் உங்களுக்குச் சொல்கிறேன்: என் வார்த்தையைக் கேட்டு, என்னை அனுப்பியவரை நம்புகிறவருக்கு நித்திய வாழ்வு உண்டு. அவர் நியாயத்தீர்ப்புக்கு வருவதில்லை[a]; மாறாக, மரணத்திலிருந்து வாழ்வுக்குக் கடந்துவிட்டார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்டனைத் தீர்ப்புக்கு வருவதில்லை.” κρίσις என்ற கிரேக்கச் சொல் பொதுவாக ‘தீர்ப்பு’ என்றும், இச்சூழலில் பாதகமான அல்லது தண்டனை அளிக்கும் தீர்ப்பு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இங்குள்ள கிரேக்க நிறைவுக்கால வினை, மாற்றம் ஏற்கெனவே நிறைவேறியதையும் அதன் விளைவு தொடர்வதையும் காட்டுகிறது: மரணத்திலிருந்து வாழ்வுக்குக் ‘கடந்திருக்கிறார்’ அல்லது ‘கடந்து வந்திருக்கிறார்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: மெய்யாகவே, மெய்யாகவே
  rationale: இருமுறை கூறப்படும் வலியுறுத்தலையும் இயேசுவின் உரைக்குரிய ஆழ்ந்த உறுதிப்பாட்டையும் காக்கிறது; நவீனத் தமிழிலும் தெளிவாகப் புரிகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரைநடையை இயல்பான தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: கேட்டு ... நம்புகிறவர்
  rationale: ஆண்பால் சார்பைத் தேவையின்றி வலியுறுத்தாமல், பொதுவாக அத்தகைய எவரையும் குறிக்கும் கிரேக்கப் பங்கேற்புவினைகளின் தொடர்ச்சியான பண்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν λόγον μου
  choice: என் வார்த்தை
  rationale: இங்கு இயேசுவின் செய்தியைக் குறிக்கும் λόγος என்பதன் யோவான் நற்செய்திக்குரிய சொல் ஒலிப்பையும் பொருளையும் காக்கிறது.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: என்னை அனுப்பியவரை நம்புகிறவர்
  rationale: πιστεύω என்பதுடன் வரும் வேற்றுமை வடிவம் ஒருவரை நம்புதல் அல்லது அவர்மீது நம்பிக்கை வைத்தல் என்ற பொருளைத் தருகிறது; தமிழில் ‘அவரை நம்புதல்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு உண்டு
  rationale: ἔχει என்ற நிகழ்காலம் வாழ்வு இப்போதே உடையதாக இருப்பதைக் காட்டுகிறது; ‘உண்டு’ என்பது ‘பெற்றுக்கொள்வார்’ என்ற எதிர்காலப் பொருளைச் சேர்க்காமல் இதைத் தெளிவாக்குகிறது.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: நியாயத்தீர்ப்புக்கு வருவதில்லை
  rationale: κρίσις என்பதன் பரந்த ‘தீர்ப்பு’ பொருளைக் காத்து, அதை வெளிப்படையாகவே ‘தண்டனைத் தீர்ப்பு’ என்று குறுக்கிவிடாமல் εἰς என்பதன் இயக்கத்தையும் பிரதிபலிக்கிறது.
- source_word: μεταβέβηκεν
  choice: கடந்துவிட்டார்
  rationale: முடிவுற்ற மாற்றத்தையும் அதன் தொடரும் விளைவையும் குறிக்கும் கிரேக்க நிறைவுக்காலத்தின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: மரணத்திலிருந்து வாழ்வுக்கு
  rationale: மரணம்–வாழ்வு என்ற யோவானிய முரணையும், ஒரு நிலையிலிருந்து மற்றொரு நிலைக்குச் செல்லும் திசையையும் காக்கிறது.
theological_decisions:
- issue: இந்த மீட்புச் சூழலில் κρίσις என்பதன் பொருள்
  choice: நியாயத்தீர்ப்பு
  alternative: தண்டனைத் தீர்ப்பு
  rationale: சூழல் பாதகமான இறுதித் தீர்ப்பிலிருந்து விடுதலையைச் சுட்டினாலும், κρίσις என்ற பெயர்ச்சொல் தன்னிலேயே ‘தண்டனைத் தீர்ப்பு’ என்பதைவிடப் பரந்தது. ஆகவே இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் உரையின் பரந்த சொல்லைத் தக்கவைக்கிறது.
- issue: வாழ்வைப் பெற்றிருப்பதும் மரணத்திலிருந்து கடந்துவிட்டதும் எப்போது நிகழ்கின்றன
  choice: நித்திய வாழ்வு இப்போதைய உடைமையாகவும், மரணத்திலிருந்து வாழ்வுக்கான மாற்றம் நிறைவேறி தொடரும் விளைவுடையதாகவும் காட்டப்பட்டுள்ளது
  alternative: வாழ்வு முழுவதும் எதிர்காலத்தில் மட்டுமே பெறப்படும்; தீர்ப்பிலிருந்து விடுதலையும் எதிர்காலத்தில் மட்டுமே நிகழும்
  rationale: ἔχει என்பது நிகழ்காலம்; μεταβέβηκεν என்பது நிறைவுக்காலம். எனவே எந்தச் சமயப்பிரிவின் அமைப்பையும் சேர்க்காமல், இப்போதைய உண்மையையும் முடிவுற்ற மாற்றத்தின் தொடரும் நிலையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதேவேளையில் கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மெய்யாகவே’ மற்றும் ‘நித்திய வாழ்வு’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மரியாதை ஒருமை வடிவம் பொதுவான நபரைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறிகள் அவற்றின் விளக்கங்களோடு இடமாறியிருந்ததால், தமிழில் [a] தீர்ப்புக்குப் பின்னும் [b] நிறைவுக்கால வினைக்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
