translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், நிகழ்காலமும் தகவல் வரிசையும் காக்கப்பட்டுள்ளன. ‘தூண்மண்டபங்கள்’ என்பது தொழில்நுட்பமான ‘போர்டிகோ’ என்பதைக் காட்டிலும் தெளிவான சொல்.
