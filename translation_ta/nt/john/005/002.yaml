base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: ta
  text: எருசலேமில் ஆட்டு வாசலருகே[a] ஒரு குளம் இருக்கிறது. அது எபிரெய மொழியில்[b] “பெதஸ்தா”[c] என்று அழைக்கப்படுகிறது; அதற்கு ஐந்து தூண்மண்டபங்கள் உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘வாசல்’ என்ற சொல் வெளிப்படையாக இல்லை. இத்தொடர் ஆட்டு வாசல் இருந்த பகுதியைக் குறிப்பதாக இருக்கலாம்; நெகேமியா 3:1; 12:39-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: b
    text: ‘அரமேய மொழியில்’ என்றும் பொருள் கொள்ளலாம். யோவான் பயன்படுத்தும் ‘எபிரெய மொழியில்’ என்ற தொடர், செம்மொழி எபிரெயத்தை மட்டுமல்லாமல் யூதேயாவில் பேசப்பட்ட உள்ளூர் செமித்திய மொழியையும் சில நேரங்களில் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சில கையெழுத்துப் படிகளில் ‘பெத்சதா’ அல்லது ‘பெத்சாயிதா’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: இருக்கிறது
  rationale: நிகழ்காலமான ἔστιν என்பதைக் காக்கிறது. δέ இங்கு மென்மையான இணைப்புச் சொல்; தமிழில் தனியாக மொழிபெயர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் அதன் பணி வெளிப்படுகிறது.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: எருசலேமில்
  rationale: வடிவில் பன்மையாக இருந்தாலும் இது எருசலேம் நகரைக் குறிக்கும் வழக்கமான இடப்பெயர்.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: ஆட்டு வாசலருகே
  rationale: கிரேக்கத் தொடர் சுருக்கமாக உள்ளது; வெளிப்படையாக இல்லாத ‘வாசல்’ என்பதை எருசலேமின் நிலவியல் சூழலும் நெகேமியா 3:1; 12:39-உம் ஆதரிக்கின்றன. ‘அருகே’ என்பது ἐπί-யின் இடத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: κολυμβήθρα
  choice: ஒரு குளம்
  rationale: நீர்த்தேக்கம் அல்லது குளத்தைக் குறிக்கும் பொதுவான சொல்லுக்கு நவீனத் தமிழில் தெளிவான இணை.
- source_word: ἡ ἐπιλεγομένη
  choice: என்று அழைக்கப்படுகிறது
  rationale: குளத்தின் பெயரை அறிமுகப்படுத்தும் பெயரெச்சத் தொடரை இயல்பான தமிழ் வினை வடிவில் தருகிறது.
- source_word: Ἑβραϊστὶ
  choice: எபிரெய மொழியில்
  rationale: மூலச்சொல் நேரடியாக ‘எபிரெய மொழியில்’ என்கிறது; யோவானின் பயன்பாடு உள்ளூர் அரமேய மொழியையும் குறிக்கக்கூடும் என்பதால் அந்த நுட்பம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: Βηθεσδά
  choice: பெதஸ்தா
  rationale: வழங்கப்பட்ட SBLGNT வாசகமான Βηθεσδά-வை ஒலிபெயர்க்கிறது; வேறு கையெழுத்துப் படிகளின் பெயர் வடிவங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: πέντε στοὰς ἔχουσα
  choice: அதற்கு ஐந்து தூண்மண்டபங்கள் உள்ளன
  rationale: στοά என்பது தூண்களால் அமைந்த, கூரையுள்ள மண்டபம் அல்லது நடைவழி. ‘தூண்மண்டபங்கள்’ பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; ἔχουσα-வின் உடைமைப் பொருள் இயல்பான தமிழ் வாக்கியமாக மாற்றப்பட்டுள்ளது.
