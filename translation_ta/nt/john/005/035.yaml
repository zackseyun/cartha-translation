source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: ta
  text: அவர் எரிந்துகொண்டும் ஒளிவீசிக்கொண்டும் இருந்த விளக்காக இருந்தார்; நீங்களோ சிறிது காலம்[a] அவரது ஒளியில் மகிழ விரும்பினீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிறிது நேரம்.’ இச்சொற்றொடர் வரையறுக்கப்பட்ட ஒரு காலப்பகுதியைக் குறிக்கிறது; கட்டாயமாக ஒரு மணிநேரத்தைக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: அவர்
  rationale: சூழலில் திருமுழுக்கு யோவானைக் குறிக்கும் வலியுறுத்தலுள்ள சுட்டுப்பெயர்; இயல்பான மரியாதைத் தமிழில் ‘அவர்’ பொருத்தமானது.
- source_word: λύχνος
  choice: விளக்கு
  rationale: இது ஒளி என்ற கருத்தை அல்ல, ஒளி தரும் விளக்கைக் குறிக்கிறது; யோவான் விளக்கு, இயேசு ஒளி என்ற யோவான் நற்செய்தியின் உருவக வேறுபாட்டைக் காக்கிறது.
- source_word: καιόμενος καὶ φαίνων
  choice: எரிந்து ஒளிவீசிக்கொண்டிருந்த
  rationale: இரு நிகழ்காலப் பங்கேற்பு வடிவங்களும் விளக்கின் தொடர்ச்சியான எரிதலையும் ஒளி தருதலையும் இணைத்துக் காட்டுகின்றன.
- source_word: ἠθελήσατε
  choice: விரும்பினீர்கள்
  rationale: அவர்களுடைய மனவிருப்பத்தையும் முனைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; நீடித்த விருப்பம் என்று மிகைப்படுத்தவில்லை.
- source_word: ἀγαλλιαθῆναι
  choice: மகிழ்ந்திருக்க
  rationale: வலுவான மகிழ்ச்சியைக் குறிக்கும் வினையை வாசிக்க எளிதான நவீன தமிழில் தருகிறது.
- source_word: πρὸς ὥραν
  choice: சிறிது காலம்
  rationale: நேரடி ‘ஒரு மணிநேரம்’ என்பதற்குப் பதிலாக, இச்சூழலில் உள்ள வரையறுக்கப்பட்ட குறுகிய காலம் என்ற இடியப் பொருளைத் தருகிறது.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: அவரது ஒளியில்
  rationale: யோவானின் சாட்சியத்தால் உண்டான ஒளிக்குள் மகிழ்தல் என்ற உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவானுக்கும் இயேசுவுக்கும் இடையிலான ஒளி உருவக வேறுபாடு
  choice: யோவான் ‘விளக்கு’ என்று மொழிபெயர்க்கப்படுகிறார்; ‘ஒளி’ என்று அல்ல.
  alternative: அவர் ஒளியாக இருந்தார்
  rationale: மூலத்தில் λύχνος (‘விளக்கு’) பயன்படுத்தப்பட்டுள்ளது; φῶς (‘ஒளி’) அல்ல. இதனால் யோவான் ஒளிக்குச் சாட்சி தருபவர் என்ற வேறுபாடு காக்கப்படுகிறது; கூடுதல் கோட்பாட்டு விளக்கம் வசனத்திற்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எரிந்து ஒளிவீசிக்கொண்டிருந்த’ என்பது இரு கிரேக்கப் பங்கேற்பு வடிவங்களின் தொடர்ச்சியான செயலைப் பாதுகாக்கிறது; ‘நீங்களோ’ எதிர்மறை மாறுபாட்டைக் காட்டும் δέ-ஐ வெளிப்படுத்துகிறது.
