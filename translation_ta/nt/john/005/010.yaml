source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: ta
  text: ஆகவே, குணமடைந்த மனிதனிடம் யூதர்கள்[a], “இது ஓய்வுநாள்; உன் படுக்கைப்பாயை[c] எடுத்துச் செல்ல[b] உனக்கு அனுமதி இல்லை” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, யோவான் இச்சொல்லை இங்கு எவ்வாறு பயன்படுத்துகிறார் என்பதைப் பொறுத்து, “யூதத் தலைவர்கள்” அல்லது “யூதேயர்கள்” என்றும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “எடுத்துக்கொள்ள” அல்லது “தூக்கி எடுக்க.”
    reason: lexical_alternative
  - marker: c
    text: “படுக்கைப்பாய்” என மொழிபெயர்க்கப்பட்ட சொல், முழு அளவிலான கட்டிலைக் கட்டாயமாகக் குறிக்காமல், எடுத்துச் செல்லக்கூடிய உறங்கும் பாய் அல்லது எளிய மெத்தையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினை வடிவம் கடந்த காலத்தில் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த பேச்சைக் குறிக்கிறது; தமிழ் தொடர்வினை வடிவம் அந்த அம்சத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக வரும் கதைத் தொடர்ச்சியையும் தொடர்பையும் காட்டுகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருள் இது. உடனடிச் சூழல் இவர்களைத் தலைவர்கள் என்று வெளிப்படையாகக் குறுக்காததால் முதன்மை உரையில் பொதுவான சொல்லே வைக்கப்படுகிறது.
- source_word: τῷ τεθεραπευμένῳ
  choice: குணமாக்கப்பட்டிருந்த மனிதனிடம்
  rationale: நிறைவுற்ற செயப்பாட்டு வினையெச்சம், குணமாக்குதல் முடிந்து அதன் விளைவு தொடர்வதைக் காட்டுகிறது. சூழலில் ஆண் என்பது தெளிவாக இருப்பதால் ‘மனிதன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: Σάββατόν ἐστιν
  choice: இது ஓய்வுநாள்
  rationale: யூத ஓய்வுநாளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்; இங்கு கிரேக்கத்தில் சுட்டிடைச்சொல் இல்லாதது வரையறையற்ற பொருளைக் கட்டாயப்படுத்துவதில்லை.
- source_word: οὐκ ἔξεστίν σοι
  choice: உனக்கு அனுமதி இல்லை
  rationale: ἔξεστιν அனுமதிக்கப்பட்ட அல்லது சட்டப்படி ஏற்ற செயலைக் குறிக்கிறது. தமிழ் வாசகத்தில் இயல்பாக இருந்து, ஓய்வுநாள் ஒழுங்கைச் சார்ந்த அனுமதி நுட்பத்தையும் காக்கிறது.
- source_word: ἆραι
  choice: எடுத்துச் செல்ல
  rationale: αἴρω என்பதற்கு ‘எடுத்து உயர்த்துதல்’ என்ற பொருள் இருக்கலாம்; இச்சூழலில் பொருளை எடுத்துக் கொண்டு செல்வதே எதிர்ப்பின் நடைமுறை மையம்.
- source_word: κράβαττον
  choice: படுக்கைப்பாய்
  rationale: எளிதாக எடுத்துச் செல்லக்கூடிய உறங்கும் பாய் அல்லது மெத்தையைக் குறிக்கிறது; முழு கட்டிலெனத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: யூதர்கள்
  alternative: யூதத் தலைவர்கள்; யூதேயர்கள்
  rationale: இந்த வசனம் பேசுவோர் தலைவர்கள் அல்லது புவியியல் பொருளில் யூதேயர்கள் என்று தனிப்படக் கூறவில்லை. ஆகவே மூலத்தின் பரந்த சொல்லை முதன்மை உரை காக்கிறது; யோவானின் பயன்பாட்டிலுள்ள உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’ பரவலாகப் புரியும் வேதாகமச் சொல்; ‘படுக்கைப்பாய்’ பொருளின் எடுத்துச் செல்லத்தக்க தன்மையைத் தெளிவாக்குகிறது. கிரேக்க இறந்தகால நிறைவுறா வினையின் தொடர்ச்சித் தன்மை ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்பதில் காக்கப்பட்டுள்ளது.
