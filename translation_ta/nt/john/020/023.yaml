id: JHN.20.23
reference: John 20:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: ta
  text: நீங்கள் யாருடைய பாவங்களை மன்னிக்கிறீர்களோ, அவை அவர்களுக்கு மன்னிக்கப்பட்டிருக்கின்றன[a]; யாருடைய பாவங்களை மன்னிக்காமல் வைத்திருக்கிறீர்களோ, அவை மன்னிக்கப்படாமல் வைக்கப்பட்டிருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவை அவர்களுக்கு மன்னிக்கப்பட்டிருக்கின்றன’ என்பதற்கு, இயல்பான தமிழில் ‘அவர்களுடைய பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன’ என்றும் கூறலாம். கிரேக்கத்தில் நிறைவேறிய செயல் தொடர்ந்து விளைவுடையதாக இருப்பதைச் சுட்டக்கூடிய நிறைவுநிலைச் செயப்பாட்டு வடிவம் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியான சொல்லாட்சியில், ‘யாருடைய பாவங்களைப் பிடித்துவைக்கிறீர்களோ, அவை பிடித்துவைக்கப்பட்டிருக்கின்றன.’ இங்கு ‘பிடித்துவைத்தல்’ என்பது பாவங்களை விடுவிக்காமல், அதாவது மன்னிக்காமல் வைத்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: யாருடைய ... -கிறீர்களோ
  rationale: ἄν உடன் வரும் துணைவினை வடிவம் குறிப்பிடப்படாத நபர்களைக் குறிக்கும் நிபந்தனைப் பொருளைத் தருகிறது. தமிழில் ‘யாருடைய ... -கிறீர்களோ’ என்பது அந்தப் பொதுவான நிபந்தனைத் தன்மையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀφῆτε
  choice: மன்னிக்கிறீர்களோ
  rationale: பாவங்களைப் பற்றிய இச்சூழலில் ἀφίημι என்பதன் இயல்பான பொருள் ‘மன்னித்தல்’. ‘விடுவித்தல்’ என்பது இங்கு அளவுக்கு மீறிய பொதுப்பொருளாக இருக்கும்.
- source_word: τὰς ἁμαρτίας
  choice: பாவங்களை
  rationale: கிரேக்கச் சொல்லின் நேரடியான பன்மைப் பொருள் காக்கப்படுகிறது; தமிழில் குறிப்புச் சுட்டை தனியே சேர்க்க வேண்டியதில்லை.
- source_word: ἀφέωνται αὐτοῖς
  choice: அவை அவர்களுக்கு மன்னிக்கப்பட்டிருக்கின்றன
  rationale: நிறைவேறிய செயலும் தொடரும் விளைவும் கொண்ட perfect passive வடிவத்தை ‘மன்னிக்கப்பட்டிருக்கின்றன’ பிரதிபலிக்கிறது. αὐτοῖς என்பதற்கு ‘அவர்களுக்கு’ எனத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κρατῆτε
  choice: மன்னிக்காமல் வைத்திருக்கிறீர்களோ
  rationale: κρατέω என்பதன் அடிப்படை எண்ணம் பிடித்து அல்லது விடாமல் வைத்திருப்பது. பாவமன்னிப்புடன் நேர்மாறாக வரும் இச்சூழலில் ‘மன்னிக்காமல் வைத்திருத்தல்’ என்பது பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பிடித்துவைத்தல்’ என்ற சொல்லாட்சி செயற்கையாக ஒலிக்கும்.
- source_word: κεκράτηνται
  choice: மன்னிக்கப்படாமல் வைக்கப்பட்டிருக்கின்றன
  rationale: முதல் கூற்றைப் போலவே perfect passive வடிவத்தின் நிறைவு மற்றும் தொடரும் நிலை பாதுகாக்கப்படுகிறது. கிரேக்கத்தின் இணை அமைப்பைத் தமிழிலும் இயன்றவரை ஒத்ததாக வைத்திருக்கிறது.
theological_decisions:
- issue: சீடர்களின் செயல் தன்னிச்சையாகப் பாவமன்னிப்பை ஏற்படுத்துகிறதா, அல்லது அது ஏற்கெனவே உள்ள இறைநிலையோடு ஒத்துப்போகிறதா என்பதைக் மொழிபெயர்ப்பில் தீர்மானிப்பது
  choice: ‘மன்னிக்கப்பட்டிருக்கின்றன’ / ‘மன்னிக்கப்படாமல் வைக்கப்பட்டிருக்கின்றன’ என்ற செயப்பாட்டு, நிறைவுநிலை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
  alternative: ‘கடவுள் அவற்றை மன்னித்திருக்கிறார்’ / ‘கடவுள் அவற்றை மன்னிக்காமல் வைத்திருக்கிறார்’ என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்க மூலத்தில் செய்பவர் பெயரிடப்படவில்லை. செயப்பாட்டு வடிவம் கடவுளைச் செய்பவராக உணர இடமளித்தாலும், அதை மொழிபெயர்ப்பே வெளிப்படையாகத் தீர்மானிக்கக் கூடாது. ஆகவே சீடர்களின் செயலுக்கும் இறைமன்னிப்புக்கும் இடையிலான உறவைப் பற்றிய மூலத்தின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு கூற்றுகளிலும் மூலத்தின் செயப்பாட்டு வடிவமும் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன; ‘மன்னிக்காமல் வைத்திருத்தல்’ என்பது நேரடியான ‘பிடித்துவைத்தல்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பான தமிழாகத் தேர்ந்தெடுக்கப்பட்டது.
