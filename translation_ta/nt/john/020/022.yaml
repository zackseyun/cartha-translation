  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: ta
  text: இதைச் சொன்னபின், அவர் அவர்கள்மேல் ஊதி[a], அவர்களிடம், “தூய ஆவியைப் பெற்றுக்கொள்ளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுக்குள் ஊதினார்’ என்றும் மொழிபெயர்க்கலாம். இந்த வினைச்சொல் ஆதியாகமம் 2:7 மற்றும் எசேக்கியேல் 37 ஆகியவற்றிலுள்ள படைப்பு, புதுப்படைப்பு உருவகங்களையும் நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: இதைச் சொன்னபின்
  rationale: இறந்தகாலப் பெயரெச்சம் பிரதான வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது; இத்தமிழாக்கம் காலவரிசையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐνεφύσησεν
  choice: அவர்கள்மேல் ஊதி
  rationale: வினைச்சொல் ‘மேல் ஊதுதல்’ அல்லது ‘உள்ளே ஊதுதல்’ என்ற நுண்பொருளை ஏற்கக்கூடும். முதன்மை உரையில் இடத்தைக் கூடுதலாக நிர்ணயிக்காமல் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது; மாற்று வாய்ப்பும் படைப்பு/புதுப்படைப்பு எதிரொலியும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: λέγει αὐτοῖς
  choice: அவர்களிடம் … என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக இருப்பதால் அவ்வாறு வழங்கப்பட்டது.
- source_word: Λάβετε
  choice: பெற்றுக்கொள்ளுங்கள்
  rationale: இங்கு கட்டளை வடிவம் ஆவியை ஏற்றுப் பெறுவதைக் குறிக்கிறது. ‘எடுத்துக்கொள்ளுங்கள்’ என்பதைவிட ‘பெற்றுக்கொள்ளுங்கள்’ சூழலுக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: πνεῦμα ἅγιον
  choice: தூய ஆவி
  rationale: யோவான் நற்செய்தியின் சூழலில் இது பொதுவான ஓர் ஆவியை அல்ல, இறைவனுடைய தூய ஆவியைக் குறிக்கிறது. கிரேக்கத்தில் சுட்டுப்பெயர் இல்லாததை மதித்து தமிழில் இயல்பான நிலையான பெயராக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: πνεῦμα ἅγιον என்பது பண்புமட்டும் கொண்ட ‘தூய ஆவி’யையா, இறைவனுடைய தனிப்பட்ட தூய ஆவியையா குறிக்கிறது?
  choice: இறைவனுடைய தூய ஆவியைக் குறிக்கும் ‘தூய ஆவி’
  alternative: பொதுவான அல்லது வரையறுக்கப்படாத ‘ஒரு தூய ஆவி’
  rationale: யோவான் நற்செய்தியிலும் புதிய ஏற்பாட்டின் பரந்த பயன்பாட்டிலும் இச்சொற்றொடர் தூய ஆவியையே இயல்பாகக் குறிக்கிறது. அதேவேளையில், மூலத்தில் இல்லாத விளக்கச் சொற்கள் பிரதான உரையில் சேர்க்கப்படவில்லை.
- issue: ἐνεφύσησεν என்பதின் திசையும் படைப்பு/புதுப்படைப்பு எதிரொலியும்
  choice: முதன்மை உரையில் ‘அவர்கள்மேல் ஊதி’; மாற்று ‘அவர்களுக்குள் ஊதினார்’ மற்றும் இலக்கிய எதிரொலி அடிக்குறிப்பில்
  alternative: ‘அவர்களுக்குள் ஊதினார்’ என்பதை மட்டும் முதன்மை உரையில் கொடுத்தல்
  rationale: கிரேக்க வினை படைப்பு மற்றும் புதுப்படைப்பு மொழியை நினைவூட்டினாலும், திசையை ஒரே வகையில் கட்டாயப்படுத்தாது. ஆகவே மெய்யான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தூய ஆவி’ என்பது தமிழ் வேதாகம வழக்குடன் ஒத்த, இயல்பான தெய்வீகப் பெயர். மூலத்தின் வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கேற்ப இறந்தகாலமாகச் சீராக்கப்பட்டுள்ளது.
