source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ta
  text: எட்டு நாட்களுக்குப் பிறகு, அவருடைய சீடர்கள் மீண்டும் உள்ளே இருந்தனர்; தோமாவும் அவர்களுடன் இருந்தார். கதவுகள் பூட்டப்பட்டிருந்த நிலையில், இயேசு வந்து அவர்கள் நடுவில் நின்று, “உங்களுக்குச் சமாதானம்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: எட்டு நாட்களுக்குப் பிறகு
  rationale: கிரேக்கச் சொற்றொடரின் வடிவத்தையும் இயல்பான நவீனத் தமிழ் வழக்கையும் காக்கிறது; பண்டைய உள்ளடக்கிய நாள் கணக்கீட்டை உரைக்குள் விளக்கமாகச் சேர்க்கவில்லை.
- source_word: ἔσω
  choice: வீட்டுக்குள்
  rationale: ‘உள்ளே’ என்பதே நேரடி பொருள்; முந்தைய நிகழ்வின் சூழலில் சீடர்கள் கூடியிருந்த இடத்தின் உட்புறத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: கதவுகள் பூட்டப்பட்டிருந்தபோதிலும்
  rationale: மூடப்பட்டு பாதுகாக்கப்பட்டிருந்த கதவுகள் என்ற நிலையைத் தெரிவிக்கிறது; இயேசு எவ்வாறு உள்ளே வந்தார் என்று உரை கூறாததால் அதற்கு மேலான விளக்கத்தைத் தவிர்க்கிறது.
- source_word: ἔρχεται
  choice: வந்து
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் நிகழ்வை உயிரோட்டமாக்குகிறது; தமிழில் அடுத்துள்ள இறந்தகால வினைகளுடன் இயல்பாக இணையும் வினையெச்சம் அந்த வருகையை முன்னிறுத்துகிறது.
- source_word: Εἰρήνη ὑμῖν
  choice: உங்களுக்குச் சமாதானம் உண்டாகட்டும்
  rationale: யூத வாழ்த்தின் வாழ்த்துரைக் கூறையும் ‘சமாதானம்’ என்ற முக்கிய இறையியல் சொல்லையும் காக்கிறது.
theological_decisions:
- issue: பூட்டப்பட்ட கதவுகளுக்கும் இயேசுவின் வருகைக்கும் உள்ள தொடர்பு
  choice: “பூட்டப்பட்டிருந்தபோதிலும்” என்று மட்டும் மொழிபெயர்த்து, அவர் வந்த முறையை விளக்காமல் விடுதல்
  alternative: இயேசு கதவுகளின் வழியாக ஊடுருவி வந்தார் என்று வெளிப்படையாகக் கூறுதல்
  rationale: மூலவுரை கதவுகளின் நிலையையும் இயேசுவின் வருகையையும் கூறுகிறது; அதன் இயற்பியல் முறையை வரையறுக்கவில்லை.
- issue: “உங்களுக்குச் சமாதானம்” என்பதன் தன்மை
  choice: வாழ்த்தும் அருளுரையும் திறந்தவாறு “உண்டாகட்டும்” என வழங்குதல்
  alternative: வெறும் வழக்கமான “வணக்கம்” எனச் சுருக்குதல்
  rationale: சொற்றொடரின் அன்றாட வாழ்த்து இயல்பையும் யோவான் சூழலில் உள்ள ஆழமான சமாதானப் பொருளையும் ஒருசேர காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடையைக் கொண்டுள்ளது. ‘தோமா’ என்ற பரவலாக அறியப்பட்ட வேதாகமப் பெயர்வடிவமும் ‘சமாதானம்’ என்ற நிலைபெற்ற சொல்லும் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற கோட்பாட்டு விளக்கங்கள் சேர்க்கப்படவில்லை.
