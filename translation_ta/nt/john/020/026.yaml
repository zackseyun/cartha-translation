  verdict: revise
  source_fidelity: ‘வீட்டுக்குள்’ என்பது ἔσω (‘உள்ளே’) என்பதைக் காட்டிலும் குறிப்பான இடத்தைச் சேர்க்கிறது; மூலத்தில் அது வீடு என்று சொல்லப்படவில்லை. மேலும் τῶν θυρῶν κεκλεισμένων என்பது கதவுகளின் நிலையைச் சொல்லும் genitive absolute; ‘போதிலும்’ என்ற வெளிப்படையான எதிர்மறை இணைப்பை விட ‘பூட்டப்பட்டிருந்த நிலையில்/போது’ என்பது மூலத்தின் தொடர்பைத் திறந்தவாறு காக்கிறது.
  naturalness: திருத்திய உரை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘மீண்டும் உள்ளே இருந்தனர்’ மற்றும் ‘அவர்கள் நடுவில் நின்றார்’ ஆகியவை தெளிவான இயல்பான நடை.
  terminology: ‘தோமா,’ ‘இயேசு,’ மற்றும் ‘சமாதானம்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. வாழ்த்துச் சொற்றொடர் மூலத்தின் சுருக்கத்தையும் அர்த்தத்தையும் காக்க ‘உங்களுக்குச் சமாதானம்’ என வழங்கப்பட்டுள்ளது.
  issues:
