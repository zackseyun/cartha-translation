id: JHN.20.13
reference: John 20:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: ta
  text: அவர்கள் அவளிடம், “அம்மையே, ஏன் அழுகிறீர்கள்?[a]” என்று சொன்னார்கள். அவள் அவர்களிடம், “என் ஆண்டவரை[b] எடுத்துக்கொண்டு போய்விட்டார்கள்; அவரை எங்கே வைத்தார்கள் என்று எனக்குத் தெரியவில்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக ‘என்ன’ என்ற வினாச்சொல் உள்ளது; இங்கு அதன் பொருள், “எதற்காக அழுகிறீர்கள்?” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: “என் எஜமானை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் κύριος சூழலுக்கேற்ப ‘ஆண்டவர்’ என்றும் மரியாதைக்குரிய ‘எஜமான்’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: பெண்ணே
  rationale: γυνή என்பதன் அழைப்புவேற்றுமையை நேரடியாகவும் கண்ணியமாகவும் தருகிறது. இச்சூழலில் இது மரியாதையற்ற அழைப்பு அல்ல; யோவான் நூலின் சொல்லாட்சி ஒற்றுமையையும் காக்கிறது.
- source_word: τί
  choice: ஏன்
  rationale: τί என்பதன் அடிப்படைப் பொருள் ‘என்ன’ என்றாலும், τί κλαίεις என்ற கிரேக்க வினா இயல்பாகக் காரணத்தைக் கேட்பதால் நவீன தமிழில் ‘ஏன் அழுகிறாய்?’ என்பது பொருத்தமானது.
- source_word: κλαίεις
  choice: அழுகிறாய்
  rationale: நிகழ்கால வடிவம் தொடர்ந்து நடந்துகொண்டிருக்கும் அழுகையைக் குறிக்கிறது; ‘அழுகிறாய்’ என்பது இயல்பான, தெளிவான நவீன தமிழ்.
- source_word: Ἦραν
  choice: எடுத்துக்கொண்டு போய்விட்டார்கள்
  rationale: கல்லறையிலிருந்து அகற்றப்பட்டதாக மரியா கருதுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; முடிந்த செயலின் தற்போதைய விளைவையும் ‘போய்விட்டார்கள்’ உணர்த்துகிறது.
- source_word: τὸν κύριόν μου
  choice: என் ஆண்டவரை
  rationale: κύριος என்பதிலுள்ள மரியாதைத் தலைப்பு மற்றும் கிறிஸ்துவியல் ஒலிப்பு ஆகிய இரண்டையும் குறுக்காமல் ‘ஆண்டவர்’ காக்கிறது; ‘என்’ என்பது மரியாவின் தனிப்பட்ட உறவைப் பாதுகாக்கிறது.
- source_word: οὐκ οἶδα
  choice: எனக்குத் தெரியவில்லை
  rationale: οἶδα வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்நிலை அறிவைக் குறிக்கிறது; தமிழில் ‘எனக்குத் தெரியவில்லை’ என்பது இயல்பான சமமான வெளிப்பாடு.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: அவரை எங்கே வைத்தார்கள்
  rationale: τίθημι என்பதன் பொதுவான ‘வை/இடம் செய்’ பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; ‘அவரை’ என்பது தமிழில் மரியாதையான சுட்டுப்பெயராகச் சூழலுக்கு ஏற்றது.
- source_word: ἐκεῖνοι
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரு தூதர்களையே சுட்டுகிறது; தமிழில் ‘அவர்கள்’ என்ற சுட்டல் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: மரியாவின் பேச்சில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: என் ஆண்டவர்
  alternative: என் எஜமான்
  rationale: இச்சொல் மரியாதைக்குரிய தலைவரையும் கிறிஸ்துவியல் பட்டத்தையும் குறிக்கக்கூடியது. ‘ஆண்டவர்’ இந்த இரட்டைச் சாத்தியத்தையும் பாதுகாக்கிறது; வெறும் சமூக உறவாக மட்டும் முடிவுசெய்யவில்லை.
- issue: Γύναι என்பதன் தொனி
  choice: பெண்ணே
  alternative: அம்மா / அன்புப் பெண்ணே
  rationale: கிரேக்க அழைப்பு மரியாதையானது, ஆனால் ‘அன்பு’ போன்ற உணர்ச்சிசார் கூறை வெளிப்படையாகச் சேர்ப்பதில்லை. ‘பெண்ணே’ மூலத்தின் நேர்மையையும் கண்ணியத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான உரையாடல் ஓட்டத்துடன், வேதாகம உரைக்குரிய கண்ணியமான நடை பேணப்பட்டுள்ளது. ‘அழுகிறாய்,’ ‘எடுத்துக்கொண்டு போய்விட்டார்கள்,’ ‘வைத்தார்கள்’ ஆகியவை சாதாரண வாசகருக்குத் தெளிவானவை; ‘ஆண்டவர்’ மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
