  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: ta
  text: பன்னிருவரில் ஒருவனான திதிமு[a] என்று அழைக்கப்பட்ட தோமா, இயேசு வந்தபோது அவர்களோடு இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திதிமு’ என்ற கிரேக்கப் பெயரின் பொருள் ‘இரட்டையன்.’
    reason: பெயரின் மூலமொழிப் பொருளைத் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறையைக் காட்டாமல், தோமாவை நோக்கிக் கதையின் கவனத்தை மாற்றுகிறது. தமிழில் வாக்கிய அமைப்பே இந்த மாற்றத்தை இயல்பாகக் காட்டுவதால், ‘ஆனால்’ என்று சேர்த்து தேவையற்ற வலுவான முரண்பாட்டை உருவாக்கவில்லை.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவனான
  rationale: ‘பன்னிருவர்’ என்பது இயேசுவால் தேர்ந்தெடுக்கப்பட்ட அறியப்பட்ட சீடர் குழுவின் பெயராக இங்கு செயல்படுகிறது; மூலத்தின் சுருக்கத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: திதிமு[a] என்று அழைக்கப்பட்ட
  rationale: Δίδυμος இங்கு தோமாவுக்கான கிரேக்கப் பெயர் அல்லது அடைபெயராக வருகிறது. அதை ‘திதிமு’ என ஒலிபெயர்த்து, அதன் ‘இரட்டையர்’ என்ற பொருளை அடிக்குறிப்பில் தருவது பெயரின் வடிவத்தையும் பொருளையும் காக்கிறது.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: அவர்களோடு இருக்கவில்லை
  rationale: தோமா அந்நேரத்தில் மற்ற சீடர்களுடன் இல்லாதிருந்ததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: இயேசு வந்தபோது
  rationale: ἦλθεν என்பதன் எளிய, சூழலுக்கேற்ற பொருள் ‘வந்தார்’; காலத் தொடர்பை ‘வந்தபோது’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: Δίδυμος என்பதின் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘திதிமு’ என ஒலிபெயர்த்து, பொருளை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையில் ‘இரட்டையர்’ என்று பொருள்பெயர்த்தல்
  rationale: இது கோட்பாட்டுச் சர்ச்சைக்குரிய சொல் அல்ல. ஆயினும், யோவான் பயன்படுத்தும் கிரேக்கப் பெயர் வடிவத்தை முதன்மை உரையில் காத்து, அதன் வெளிப்படையான lexical பொருளையும் வாசகரிடமிருந்து மறைக்காமல் அடிக்குறிப்பில் தருவது பெயரும் பொருளும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், எளிமையானதும் கண்ணியமானதுமான நடை. ‘பன்னிருவர்’ என்பது அறியப்பட்ட குழுப் பெயராகப் பயன்படுத்தப்பட்டுள்ளது; δέ-யின் மென்மையான கதைமாற்றம் தமிழின் வாக்கிய அமைப்பில் இயல்பாக விடப்பட்டுள்ளது.
