reference: John 20:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: ta
  text: பின்பு அவர் தோமாவிடம், “உன் விரலை இங்கே கொண்டுவந்து என் கைகளைப் பார்; உன் கையைக் கொண்டுவந்து என் விலாப்பகுதிக்குள் வை. நம்பாதவனாக ஆகாதே; நம்புகிறவனாக இரு[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசமற்றவனாக ஆகாதே; உண்மையுள்ளவனாக இரு.” கிரேக்கப் பெயரடைகள் நம்பாமை/நம்பிக்கை என்ற பொருளையோ, விசுவாசமின்மை/உண்மையுடைமை என்ற பொருளையோ தரக்கூடும். இச்சூழலில் உயிர்த்தெழுந்த இயேசுவைத் தோமா நம்புவதுதான் முதன்மையாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: பின்பு
  rationale: நிகழ்வுகளின் காலத் தொடர்ச்சியை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: λέγει
  choice: அவர் ... என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகால வடிவம் இயல்பாக இருப்பதால் அவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Φέρε
  choice: கொண்டுவந்து
  rationale: ‘கொண்டுவா’ என்ற அடிப்படைப் பொருளையும் இரு கட்டளைகளில் வரும் வினைச்சொல் மீளுரைப்பையும் காக்கிறது.
- source_word: δάκτυλόν σου ὧδε
  choice: உன் விரலை இங்கே
  rationale: ὧδε என்பதன் இடச்சுட்டுப் பொருளை ‘இங்கே’ தெளிவாகத் தருகிறது.
- source_word: ἴδε
  choice: பார்
  rationale: கட்டளை வடிவின் நேரடித் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰς χεῖράς μου
  choice: என் கைகளை
  rationale: மூலத்தின் பன்மையை நேரடியாகக் காக்கிறது.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: என் விலாவுக்குள் வை
  rationale: εἰς என்பதன் ‘உள்ளே/உள்நோக்கி’ என்ற இயக்கத்தையும், இயேசுவின் குத்தப்பட்ட விலாப்பகுதியைக் குறிக்கும் πλευρά என்பதையும் காக்கிறது.
- source_word: μὴ γίνου
  choice: ஆகாமல்
  rationale: γίνομαι என்பதிலுள்ள நிலைமாற்ற அல்லது வளர்ச்சிக் கருத்தை வெறும் ‘இராதே’ என்று நிலையானதாக மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: ἄπιστος
  choice: நம்பாதவனாக
  rationale: உயிர்த்தெழுந்த இயேசுவைப் பற்றிய தோமாவின் நம்பாமையே உடனடிச் சூழலின் மையமாக இருப்பதால் இத்தேர்வு செய்யப்பட்டுள்ளது.
- source_word: πιστός
  choice: நம்புகிறவனாக
  rationale: ἄπιστος என்பதற்கு எதிரிணையாகவும், உயிர்த்தெழுதலை நம்புதல் என்ற சூழலுக்கு ஏற்றவாறும் உள்ளது; அதேவேளை மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ἄπιστος / πιστός என்ற எதிரிணையை எவ்வாறு மொழிபெயர்ப்பது
  choice: நம்பாதவன் / நம்புகிறவன்
  alternative: விசுவாசமற்றவன் / உண்மையுள்ளவன்
  rationale: தோமா இயேசுவின் உயிர்த்தெழுதலைப் பற்றிய சாட்சியை நம்ப மறுத்ததே உடனடிச் சூழல். ஆகவே நம்புதல் சார்ந்த பொருள் முதன்மை பெறுகிறது; இருப்பினும் கிரேக்கப் பெயரடைகள் உண்மையின்மை/உண்மையுடைமை என்ற பொருளையும் ஏற்கக்கூடியதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும் கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விலா’ என்பது இச்சூழலில் இயேசுவின் குத்தப்பட்ட பக்கவாட்டைக் குறிக்கும் நிலைபெற்ற, சுருக்கமான சொல். மூலத்தில் Φέρε இருமுறை வருவதால் ‘கொண்டுவந்து’ என்பதும் இருமுறை வைக்கப்பட்டுள்ளது.
