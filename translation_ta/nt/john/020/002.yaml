reference: John 20:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: ta
  text: எனவே அவள் ஓடிச் சீமோன் பேதுருவிடமும், இயேசு நேசித்த மற்ற சீடரிடமும்[a] வந்து, அவர்களிடம், “ஆண்டவரைக் கல்லறையிலிருந்து எடுத்துச் சென்றுவிட்டார்கள்; அவரை எங்கே வைத்தார்கள் என்று எங்களுக்குத் தெரியவில்லை[b]” என்று சொல்கிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு நேசித்த மற்ற சீடர்’ என்று கிரேக்க மூலத்தில் உள்ளது. இங்கு ‘நேசித்த’ என்பதற்குப் பயன்படுத்தப்பட்ட φιλέω என்ற வினைச்சொல் பாசத்தையும் வலியுறுத்தக்கூடும்; ‘இயேசு பாசம் வைத்திருந்த’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மரியாள், ‘எங்களுக்குத் தெரியவில்லை’ என்று கூறுகிறாள்; கிரேக்க மூலத்திலுள்ள முதலாம் நபர் பன்மை இங்கு பாதுகாக்கப்பட்டுள்ளது. அவளுடன் வேறு பெண்களும் இருந்ததை இது உள்ளடக்குவதாகச் சிலர் புரிந்துகொள்கிறார்கள்; ஆனால் இவ்விடத்தில் அந்தப் பன்மைக்கான காரணத்தை உரை விளக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: எனவே அவள் ஓடி… வந்து
  rationale: οὖν முந்தைய நிகழ்வின் விளைவைக் குறிக்கிறது; τρέχει, ἔρχεται ஆகிய வரலாற்று நிகழ்கால வினைகள் காட்சியின் உடனடித் தன்மையைத் தக்கவைக்கின்றன. தமிழில் ‘ஓடி… வந்து’ என்பது இயக்கத் தொடரை இயல்பாக வழங்குகிறது.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: சீமோன் பேதுருவிடமும்… மற்ற சீடரிடமும்
  rationale: πρός நபர்களை நோக்கிய இயக்கத்தைக் குறிக்கிறது; μαθητής என்பதற்கு நற்செய்தி நூல்களின் சூழலில் நிலையான ‘சீடர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: இயேசு நேசித்த
  rationale: φιλέω அன்பு அல்லது பாசத்தை வெளிப்படுத்துகிறது. ‘நேசித்த’ என்பது தமிழில் இயல்பாகவும் வலுவைக் குறைக்காமலும் உள்ளது; இறந்தகாலத் தொடர்ச்சியை செயற்கையாக வெளிப்படுத்தவில்லை.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: ஆண்டவரைக் கல்லறையிலிருந்து எடுத்துச் சென்றுவிட்டார்கள்
  rationale: μνημεῖον இச்சூழலில் அடக்கக் கல்லறையைக் குறிக்கிறது. Ἦραν முடிந்த செயலின் தற்போதைய விளைவை உணர்த்துவதால் ‘எடுத்துச் சென்றுவிட்டார்கள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: οὐκ οἴδαμεν
  choice: எங்களுக்குத் தெரியவில்லை
  rationale: மூலத்தில் உள்ள முதலாம் நபர் பன்மை அப்படியே பாதுகாக்கப்படுகிறது; மரியாள் தனியாகப் பேசுவதால் இதை ஒருமையாக்கவில்லை.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: அவரை எங்கே வைத்தார்கள்
  rationale: τίθημι இங்கு ஒருவரை ஓர் இடத்தில் வைப்பதைக் குறிக்கிறது. ‘வைத்தார்கள்’ என்பது தமிழில் நேரடியும் இயல்புமான சொல்லாக்கம்.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: உயிர்த்தெழுதல் நிகழ்வின் சூழலில் κύριος இயேசுவுக்கான மரியாதைமிக்க கிறிஸ்துவியல் பட்டமாகச் செயல்படுகிறது; ஆகவே தமிழில் நிலையான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- issue: οἴδαμεν என்ற முதலாம் நபர் பன்மை
  choice: எங்களுக்குத் தெரியவில்லை
  alternative: எனக்குத் தெரியவில்லை
  rationale: மரியாளுடன் வேறு பெண்கள் இருந்தார்களா என்பதை இவ்வசனம் விளக்கவில்லை. மூலத்தின் பன்மையை ஒருமையாக்காமல் வைத்திருப்பது உரையின் தீர்க்கப்படாத பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலத்தின் காட்சி நெருக்கத்தை இறுதியிலுள்ள ‘சொல்கிறாள்’ தக்கவைக்கிறது; தமிழின் இயல்புக்காக முன்னிலை வினைகள் வினையெச்ச வடிவில் அமைக்கப்பட்டுள்ளன.
