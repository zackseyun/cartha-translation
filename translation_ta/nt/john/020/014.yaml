  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: ta
  text: இவற்றைச் சொன்ன பின்பு, அவள் தனக்குப் பின்னால் திரும்பி, நின்றுகொண்டிருந்த இயேசுவைக் கண்டாள். அவர் இயேசு என்று அவள் அறியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இயேசு என்பதை அவள் அடையாளம் கண்டுகொள்ளவில்லை.” கிரேக்கத்தில் நேரடியாக, “அவர் இயேசு என்று அவள் அறியவில்லை” என்று உள்ளது; இது அவருடைய அடையாளத்தை அவள் உணராததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரின் எண்ணிக்கையைப் பேணி, மரியா முன்பு சொன்னவற்றைக் குறிக்கிறது.
- source_word: εἰποῦσα
  choice: சொன்ன பின்பு
  rationale: பெண்பால் ஒருமை இறந்தகாலப் பங்கேற்புவினையின் முன்நிகழ்வுத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: அவள் பின்னால் திரும்பி
  rationale: தனக்குப் பின்னிருந்த திசையை நோக்கித் திரும்பிய செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: θεωρεῖ
  choice: கண்டாள்
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலத்தில் வழங்கி, நேரடியான பார்வையைப் பேணுகிறது.
- source_word: ἑστῶτα
  choice: அங்கே நிற்பதை
  rationale: இயேசு நின்றுகொண்டிருந்த நிலையை இயல்பாகக் காட்டுகிறது; ‘அங்கே’ என்பது காட்சியின் இடச்சூழலைத் தெளிவாக்குகிறது.
- source_word: οὐκ ᾔδει
  choice: அவள் அறியவில்லை
  rationale: οἶδα என்பதன் அடிப்படை ‘அறிதல்’ பொருளைப் பேணுகிறது; ‘அடையாளம் கண்டுகொள்ளவில்லை’ என்ற சூழல்சார் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: அவர் இயேசு என்று
  rationale: அங்கே நின்றவரின் அடையாளமே அவளுக்குத் தெரியவில்லை என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவை மரியா அடையாளம் காணாதது
  choice: அவர் இயேசு என்று அவள் அறியவில்லை
  alternative: அவர் இயேசு என்பதை அவள் அடையாளம் கண்டுகொள்ளவில்லை
  rationale: மரியா அவருடைய அடையாளத்தை அறியாதிருந்ததாக வசனம் கூறுகிறது; அதற்கான காரணத்தை விளக்காமல், மூலத்தின் இறையியல் பதற்றத்தையும் தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறியவில்லை’ என்பது மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டு, ‘அடையாளம் கண்டுகொள்ளவில்லை’ என்ற இயல்பான சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
