source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: ta
  text: இயேசு சீடர்களின் முன்னிலையில் வேறு பல அடையாளங்களையும்[a] செய்தார். அவை இந்தப் புத்தகத்தில் எழுதப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அற்புதங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘அடையாளங்கள்’; இயேசு யார் என்பதைச் சுட்டிக்காட்டும் செயல்கள் என்ற கருத்து இதில் வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: வேறு பல
  rationale: இந்தச் சொற்றொடர் முன் நிகழ்ந்தவற்றைத் தொடர்ந்து, இங்கே எழுதப்பட்டவற்றுக்கு அப்பால் இன்னும் பல இருந்தன என்பதை வலியுறுத்துகிறது. μέν...δέ அமைப்பு அடுத்த வசனத்தில் நிறைவுபெறுகிறது; தமிழில் ஒவ்வொரு இடைச்சொல்லையும் தனித்தனியாக மொழிபெயர்த்தால் இயல்பற்றதாகிவிடும் என்பதால் சுருக்கமாக ‘வேறு பல’ என வழங்கப்பட்டது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: யோவான் நற்செய்தியில் இந்தச் சொல் வெறும் வல்ல செயல்களை மட்டும் அல்லாமல், இயேசு யார் என்பதைச் சுட்டிக்காட்டும் செயல்களைக் குறிக்கிறது. ‘அற்புதங்கள்’ என்பதைக் காட்டிலும் ‘அடையாளங்கள்’ அந்தக் கருத்தை நன்றாகக் காக்கிறது.
- source_word: ἐποίησεν
  choice: செய்தார்
  rationale: ποιέω என்பதன் இயல்பான, நேரடியான தமிழ் இணை; இங்கு அடையாளச் செயல்களை நிகழ்த்தியதைக் குறிக்கிறது.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: சீடர்களின் முன்னிலையில்
  rationale: அந்தச் செயல்களுக்குச் சீடர்கள் நேரில் சாட்சிகளாக இருந்ததைத் தெளிவாகக் காட்டுகிறது. கிரேக்கத்தில் உடைமைப்பெயர் இல்லாததால் ‘தமது சீடர்கள்’ என்று சேர்க்கப்படவில்லை.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: அவை ... எழுதப்படவில்லை
  rationale: எழுதப்படாத நிலையில் அவை இருப்பதை வலியுறுத்தும் கிரேக்க நிறைவு வினையின் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: இந்தப் புத்தகத்தில்
  rationale: βιβλίον இங்கு எழுதப்பட்ட நற்செய்தி நூலைக் குறிக்கிறது; ‘புத்தகம்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: யோவான் நற்செய்தியில் σημεῖα என்பதன் பயன்பாடு
  choice: ‘அடையாளங்கள்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அற்புதங்கள்’
  rationale: இயேசுவின் செயல்கள் அவருடைய அடையாளத்தையும் பணியையும் வெளிப்படுத்திச் சுட்டுகின்றன என்ற யோவானின் கருத்தை இது காக்கிறது; அவற்றை வெறும் வல்லமைச் செயல்களாக மட்டும் குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அடையாளங்கள்’ என்ற யோவானுக்கே உரிய இறையியல் நிறை கொண்ட சொல் முதன்மை உரையில் காக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
