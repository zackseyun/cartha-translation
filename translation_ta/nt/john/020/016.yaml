id: JHN.20.16
reference: John 20:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: ta
  text: இயேசு அவளிடம், “மரியாளே!” என்று கூறுகிறார். அவள் திரும்பி, அவரிடம் எபிரெய மொழியில்[a], “ரப்பூனி!” என்று கூறுகிறாள். (இதற்குப் “போதகரே” என்று பொருள்.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரமேய மொழியில்.” யோவான் பயன்படுத்தும் “எபிரெய மொழியில்” என்ற சொற்றொடர், யூதேயாவில் பேசப்பட்ட செமித்திய மொழியைப் பொதுவாகக் குறிக்கவும் கூடும்.
    reason: மூலச் சொல்லின் நேரடிப் பொருளையும் அதன் சாத்தியமான பரந்த பயன்பாட்டையும் வேறுபடுத்திக் காட்டும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: λέγει
  choice: கூறுகிறார் / கூறுகிறாள்
  rationale: யோவானின் உயிரோட்டமான வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்கால வினையால் பாதுகாக்கிறது; பேச்சுச் சூழலில் இயல்பாகவும் உள்ளது.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: பெண்பால் ஒருமை வேற்றுமைப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Μαριάμ
  choice: மரியாளே
  rationale: தமிழில் வழக்கமான பெயர்வடிவத்துடன் அழைப்புப் பொருளைக் காட்டும் ‘ஏ’ சேர்க்கப்பட்டுள்ளது.
- source_word: στραφεῖσα
  choice: திரும்பி
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκείνη
  choice: அவள்
  rationale: சூழலில் எழுவாயாகச் செயல்படும் சுட்டுப்பெயரை இயல்பான தமிழ்ப் பதிலிடுபெயராக வழங்குகிறது.
- source_word: Ἑβραϊστί
  choice: எபிரெய மொழியில்
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருளைப் பிரதான உரையில் காக்கிறது; அரமேய மொழியைக் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ραββουνι
  choice: ரப்பூனி
  rationale: நற்செய்தி நூலே உடனடியாகப் பொருள் விளக்குவதால் செமித்திய அழைப்புச் சொல்லை ஒலிபெயர்த்து, அதன் பண்பாட்டு மற்றும் உணர்ச்சிசார் வலிமையைப் பாதுகாக்கிறது.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: இதற்குப் “போதகரே” என்று பொருள்
  rationale: λέγεται அறிமுகப்படுத்தும் பொருள் விளக்கத்தை நவீனத் தமிழில் இயல்பாகத் தருகிறது; Διδάσκαλε என்பதன் அழைப்புநிலை வடிவத்தையும் ‘போதகரே’ பாதுகாக்கிறது.
theological_decisions:
- issue: யோவான் பயன்படுத்தும் Ἑβραϊστί என்பதன் மொழிக் குறிப்பு
  choice: எபிரெய மொழியில்
  alternative: அரமேய மொழியில்
  rationale: மூல கிரேக்கத்தின் வெளிப்படையான சொல்லாட்சியைப் பிரதான உரையில் பின்பற்றுகிறது. அது யூதேயாவின் அரமேயப் பேச்சையும் பரந்த பொருளில் குறிக்கலாம் என்பதால், அந்த உண்மையான விளக்கச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. யோவானின் வரலாற்று நிகழ்காலம் பாதுகாக்கப்பட்டுள்ளது; ‘ரப்பூனி’ ஒலிபெயர்க்கப்பட்டு, ஆசிரியரின் சொந்த விளக்கம் அடைப்புக்குறிக்குள் வைக்கப்பட்டுள்ளது.
