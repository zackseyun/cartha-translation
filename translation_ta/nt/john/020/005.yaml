  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: ta
  text: அவர் குனிந்து உள்ளே நோக்கி,[a] துணித்துணிகள் கிடப்பதைக் காண்கிறார்; ஆனாலும், உள்ளே செல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் குனிந்து நோக்கி, துணித்துணிகள் கிடப்பதைக் காண்கிறார்”; கிரேக்கத்தில் “உள்ளே” என்பது வெளிப்படையாக இல்லை; கல்லறை வாயிலின் சூழலால் அது உணரப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: குனிந்து உள்ளே பார்த்தபோது
  rationale: கல்லறையின் வாயிலில் உடலைக் குனிந்து உள்ளே நோக்கும் செயலை இறந்தகாலப் பின்னணியில் இயல்பான தமிழ் வினையெச்சத் தொடராகத் தருகிறது.
- source_word: βλέπει
  choice: காண்கிறார்
  rationale: யோவானின் நிகழ்காலக் கதைநடையின் உயிரோட்டத்தைப் பாதுகாக்க வரலாற்று நிகழ்காலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κείμενα
  choice: கிடப்பதை
  rationale: κεῖμαι குறிக்கும், துணிகள் ஒரு நிலையில் கிடந்த காட்சியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்கத்தில் இல்லாத ‘அங்கே’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τὰ ὀθόνια
  choice: துணித்துணிகள்
  rationale: அடக்கச் சூழலில் பயன்படுத்தப்பட்ட சிறிய துணிகள் அல்லது துணிப்பட்டைகளைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது; சூழலிலேயே அடக்கப் பயன்பாடு தெளிவாக இருப்பதால் அதைச் சொல்லில் விரிவுபடுத்தவில்லை.
- source_word: οὐ μέντοι
  choice: ஆனாலும்
  rationale: கண்டதற்கும் உள்ளே செல்லாததற்கும் இடையிலான மிதமான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσῆλθεν
  choice: அவர் உள்ளே செல்லவில்லை
  rationale: கல்லறைக்குள் நுழையாத செயலைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
