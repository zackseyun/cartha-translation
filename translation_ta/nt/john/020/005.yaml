revisions:
- from: அவர் குனிந்து உள்ளே பார்த்தபோது,[a] துணித்துணிகள் கிடப்பதைக் காண்கிறார்; ஆனாலும் அவர் உள்ளே செல்லவில்லை.
  to: அவர் குனிந்து உள்ளே நோக்கி,[a] துணித்துணிகள் கிடப்பதைக் காண்கிறார்; ஆனாலும், உள்ளே செல்லவில்லை.
