revisions:
- from: அப்போது, அவரைப் பின்தொடர்ந்து வந்த சீமோன் பேதுருவும் வந்து, கல்லறைக்குள் நுழைந்தார். அங்கே கிடந்த மெல்லிய துணிகளைக் காண்கிறார்.[a]
  to: அப்போது, அவரைப் பின்தொடர்ந்து சீமோன் பேதுருவும் வந்தார்; அவர் கல்லறைக்குள் நுழைந்து, கிடந்த துணிச்சீலைகளைப் பார்க்கிறார்.[a]
