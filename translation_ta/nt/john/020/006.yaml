source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: ta
  text: அப்போது, அவரைப் பின்தொடர்ந்து சீமோன் பேதுருவும் வந்தார்; அவர் கல்லறைக்குள் நுழைந்து, கிடந்த துணிச்சீலைகளைப் பார்க்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வந்தார்’ என்பதற்கும் ‘பார்க்கிறார்’ என்பதற்கும் கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது. இயல்பான தமிழ் கதைநடைக்காக முதலாவது இறந்தகாலத்தில் வழங்கப்பட்டு, காட்சியின் உயிரோட்டத்திற்காக இரண்டாவது நிகழ்காலத்தில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்து
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் நிகழ்வை உயிரோட்டமாக்குகிறது. தமிழில் தொடர்ச்சியான இறந்தகாலக் கதைநடையுடன் இயல்பாக அமைய, ‘வந்த ... வந்து’ என்ற வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய வசனத்திலிருந்து நிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கிறது; இங்கு வாத முடிவைக் காட்டும் ‘ஆகையால்’ என்பதைக் காட்டிலும் ‘அப்போது’ இயல்பானது.
- source_word: καὶ Σίμων Πέτρος
  choice: சீமோன் பேதுருவும்
  rationale: 'καί என்பதன் சேர்க்கைப் பொருளை ‘-உம்’ தெளிவாக வெளிப்படுத்துகிறது: மற்ற சீடருடன் சேர்ந்து சீமோன் பேதுருவும் வந்தார்.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்து வந்த
  rationale: நிகழ்வுடன் ஒரே நேரத்தில் நடந்த சூழ்நிலையை இயல்பான தமிழ் பெயரெச்சத் தொடரால் தருகிறது.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: கல்லறைக்குள் நுழைந்தார்
  rationale: εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தை ‘-க்குள்’ வெளிப்படுத்துகிறது; μνημεῖον இச்சூழலில் அடக்கக் கல்லறையைக் குறிக்கிறது.
- source_word: θεωρεῖ
  choice: காண்கிறார்
  rationale: மூலத்தின் வரலாற்று நிகழ்காலத்தை இங்கு தக்கவைத்து காட்சியின் உயிரோட்டத்தைப் பாதுகாக்கிறது. θεωρέω வெறும் தற்செயலான பார்வையைவிட கவனத்துடன் காண்பதையும் குறிக்கலாம்; ‘காண்கிறார்’ அதை மிகையாக விளக்காமல் இயல்பாகத் தருகிறது.
- source_word: τὰ ὀθόνια
  choice: மெல்லிய துணிகள்
  rationale: ὀθόνια என்பது மெல்லிய நார்த் துணிகளைக் குறிக்கிறது. அடக்கச் சூழல் தெளிவாக இருந்தாலும், ‘அடக்கத் துணிகள்’ என்று விளக்கத்தை மூலச்சொல்லுக்குள் சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: κείμενα
  choice: அங்கே கிடந்த
  rationale: துணிகள் ஒரு இடத்தில் கிடந்த நிலையை இயல்பான தமிழில் காட்டுகிறது; ‘அங்கே’ காட்சியின் இடச்சார்பை தெளிவாக்குகிறது.
