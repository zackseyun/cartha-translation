  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: ta
  text: இயேசு அவனிடம், “நீ என்னைக் கண்டதால் நம்பினாயா?[a] காணாதிருந்தும் நம்பியவர்கள் பேறுபெற்றவர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ என்னைக் கண்டதால் நம்பினாய்.” கிரேக்க வாசகத்தை ஒரு கேள்வியாகவோ ஓர் உறுதிக்கூற்றாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் ... என்றார்
  rationale: கிரேக்கத்தில் நிகழ்கால வரலாற்றுக் கூற்று இருந்தாலும், இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலம் பயன்படுத்தப்பட்டது; αὐτῷ என்பது தோமாவைக் குறிக்கும் ‘அவனிடம்’ எனத் தக்கவைக்கப்பட்டது.
- source_word: Ὅτι
  choice: கண்டதால்
  rationale: இங்கு ὅτι காரணத்தைக் குறிக்கிறது; தமிழில் ‘-தால்’ என்ற விகுதி காரண உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἑώρακάς με πεπίστευκας
  choice: நீ என்னைக் கண்டதால் நம்பினாயா?
  rationale: இரு கிரேக்க வினைகளும் நிறைவுற்ற செயலைத் தற்போதைய விளைவோடு காட்டும் perfect வடிவங்கள். தமிழில் இயல்பான இறந்தகால வினைகள் இதைத் தெளிவாகச் சொல்கின்றன; கேள்வி வடிவம் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: ‘மகிழ்ச்சியானவர்கள்’ என்ற மனநிலை சார்ந்த பொருளைவிட, தேவனுடைய நற்பேற்றைப் பெற்ற நிலையை dignified modern Tamil-ல் ‘பேறுபெற்றவர்கள்’ வெளிப்படுத்துகிறது.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: காணாமலேயே நம்பியவர்கள்
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவங்கள் இயல்பான தமிழில் ‘நம்பியவர்கள்’ என வழங்கப்பட்டன. ‘-ஆமலேயே’ பாராதிருத்தலுக்கும் நம்புதலுக்கும் இடையிலான தெளிவான முரணை வெளிப்படுத்துகிறது; தனியாக ‘இருந்தும்’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இயேசுவின் முதல் கூற்றின் வினா அல்லது உறுதிக்கூற்று தன்மை
  choice: “நீ என்னைக் கண்டதால் நம்பினாயா?” என்ற கேள்வி
  alternative: “நீ என்னைக் கண்டதால் நம்பினாய்.” என்ற உறுதிக்கூற்று
  rationale: SBLGNT நிறுத்தற்குறியும் சூழலும் வினாவாக வாசிப்பதை ஆதரிக்கின்றன. ஆனால் பண்டைய கிரேக்க கையெழுத்துப் பிரதிகளில் நவீன நிறுத்தற்குறிகள் இல்லாததால் உறுதிக்கூற்றாகவும் வாசிக்க முடியும்; அந்த மெய்யியல் மற்றும் உரைநடைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பேறுபெற்றவர்கள்’ என்பது வாழ்த்துரைச் சூழலுக்கேற்ற சொல். முதன்மை உரையின் கேள்வி/கூற்று தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
