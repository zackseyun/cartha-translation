source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: ta
  text: ஆனால், இயேசு மேசியாவும் கடவுளின் மகனுமாக இருக்கிறார் என்று நீங்கள் நம்புவதற்காகவும்[a], நம்புவதன் மூலம் அவருடைய பெயரில் வாழ்வைப் பெறுவதற்காகவும் இவை எழுதப்பட்டிருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘நீங்கள் நம்பத் தொடங்குவதற்காக’ என்று பொருள்படக்கூடிய ஏரிஸ்ட் துணைவினை உள்ளது; மற்ற பிரதிகள், தொடர்ந்து நம்புவதைக் குறிக்கக்கூடிய நிகழ்காலத் துணைவினையை ஆதரிக்கின்றன. முதன்மை உரை இரு சாத்தியங்களையும் உள்ளடக்கும் வகையில் பொதுவாக ‘நீங்கள் நம்புவதற்காக’ என்று மொழிபெயர்க்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: இவை
  rationale: முன்னர் விவரிக்கப்பட்ட அடையாளங்களையும் எழுதப்பட்ட செய்திகளையும் சுட்டுகிறது; தேவையற்ற விளக்கச் சொல்லைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலிருந்து வரும் மென்மையான எதிர்மறைத் திருப்பை வெளிப்படுத்துகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கின்றன
  rationale: எழுதப்பட்ட செயல் நிறைவுற்றிருந்தாலும் அதன் விளைவு தொடர்வதைக் குறிக்கும் கிரேக்க நிறைவுக்காலச் செயல்பாட்டு வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἵνα πιστεύητε
  choice: நீங்கள் நம்புவதற்காக
  rationale: நோக்கத்தைக் காட்டுகிறது. நிகழ்கால துணைவினையின் தொடர்ச்சியான நம்பிக்கை என்ற சாத்தியத்தை முதன்மை உரையில் மிகைப்படுத்தாமல் பொதுவாக மொழிபெயர்க்கிறது.
- source_word: Ἰησοῦς ἐστιν ὁ χριστός
  choice: இயேசுவே மேசியா
  rationale: Χριστός இங்கு பெயராக அல்ல, இயேசுவின் அடையாளத்தை அறிவிக்கும் பட்டமாக வருகிறது; வலியுறுத்தும் ‘-ஏ’ தமிழ் வாக்கியத்தை இயல்பாக்குகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: கிறிஸ்துவைப் பற்றிய இந்தப் பட்டத்தைச் சுருக்காமலும் விளக்கிச் சேர்க்காமலும் நேரடியாக வழங்குகிறது.
- source_word: πιστεύοντες
  choice: நம்புவதன் மூலம்
  rationale: வாழ்வைப் பெறுவதோடு நம்பிக்கைக்கு உள்ள வழிமுறைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; கூடுதல் இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ
  choice: அவருடைய பெயரில் வாழ்வைப் பெறுவதற்காக
  rationale: ζωή என்பதில் மூலத்தில் இல்லாத ‘நித்திய’ என்ற பெயரடையைச் சேர்க்காமல், ‘அவருடைய பெயரில்’ என்ற யோவானிய சொற்றொடரையும் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்தச் சொல் இங்கு இயேசுவின் மெசியானிய அடையாளத்தைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது; ஒலிபெயர்ப்பதைவிட அதன் பட்டத் தன்மையை ‘மேசியா’ தெளிவாகப் பாதுகாக்கிறது.
- issue: πιστεύητε என்பதிலுள்ள பாடவேறுபாடும் வினைநோக்கும்
  choice: நீங்கள் நம்புவதற்காக
  alternative: நீங்கள் தொடர்ந்து நம்புவதற்காக / நீங்கள் நம்பிக்கை கொள்ளுவதற்காக
  rationale: SBLGNT உரை நிகழ்காலத் துணைவினையான πιστεύητε என்பதை வழங்குகிறது; சில சுவடிகளின் இறந்தகாலத் துணைவினை πιστεύσητε நம்பிக்கை கொள்ளத் தொடங்குவதைச் சுட்டக்கூடும். முதன்மை உரை இரண்டையும் தேவையின்றி தீர்மானிக்காமல் பொதுவாகக் கூறுகிறது; வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ζωή என்பதன் இறையியல் பரப்பு
  choice: வாழ்வு
  alternative: நித்திய வாழ்வு
  rationale: யோவான் நூலில் இச்சொல்லுக்கு ஆழமான இறையியல் பொருள் இருந்தாலும், இவ்வசனத்தின் கிரேக்கத்தில் ‘நித்திய’ என்ற பெயரடை இல்லை; ஆகவே அது சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நோக்கத்தைக் காட்டும் இரு ἵνα கூறுகளின் இணை அமைப்பு ‘-வதற்காகவும் ... -வதற்காகவும்’ எனப் பாதுகாக்கப்பட்டுள்ளது. ‘அவருடைய பெயரில்’ என்ற மூலத்தின் சுருக்கமான இறையியல் மொழி விளக்கிச் சிதைக்கப்படாமல் வைக்கப்பட்டுள்ளது.
