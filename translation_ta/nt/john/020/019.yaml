source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: ta
  text: அந்த வாரத்தின் முதல் நாளான அன்று மாலையில், யூதர்களுக்குப்[a] பயந்து சீடர்கள் இருந்த இடத்தின் கதவுகள் பூட்டப்பட்டிருந்தன. அப்போது இயேசு வந்து அவர்கள் நடுவில் நின்று, “உங்களுக்கு அமைதி!”[b] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “யூதர்கள்” என்பது சூழலைப் பொறுத்து “யூதத் தலைவர்கள்” அல்லது “யூதேயர்கள்” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “அமைதி உங்களோடு இருப்பதாக!” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்குச் சொல், “உங்களுக்கு அமைதி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: அன்று மாலையானபோது … அப்போது
  rationale: மரபுத்தொடரின் காலப் பின்னணியை இயல்பான தமிழ்க் கால வாக்கியமாகத் தருகிறது; οὖν காட்டும் மென்மையான கதைத் தொடர்ச்சியை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: அந்த வாரத்தின் முதல் நாளாகிய அன்று
  rationale: யோவானின் வழக்குச் சொல்லான ‘வாரத்தின் முதல் நாள்’ என்ற பொருளைத் தெளிவாகவும், ‘அந்த நாள்’ என்ற குறிப்பையும் விடாமலும் தருகிறது.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: கதவுகளைப் பூட்டியிருந்தார்கள்
  rationale: முன்னரே பூட்டப்பட்டு அந்நிலையில் இருந்ததை perfect participle குறிக்கிறது; பாதுகாப்பு சார்ந்த சூழலில் ‘பூட்டியிருந்தார்கள்’ என்பது வெறுமனே ‘மூடியிருந்தார்கள்’ என்பதைவிடத் துல்லியமானது.
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: சீடர்கள் … தாங்கள் இருந்த இடத்தின்
  rationale: கிரேக்கம் கூறும் இடத்தைக் கூடுதல் கருத்து சேர்க்காமல் இயல்பான தமிழில் இணைக்கிறது.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: யூதர்களுக்குப் பயந்து
  rationale: διά உடன் வரும் காரணப் பொருளை இயல்பான தமிழில் தருகிறது; Ἰουδαῖοι என்பதைக் குறிப்பாக ‘தலைவர்கள்’ என்று முதன்மை உரையிலேயே குறுக்கவில்லை.
- source_word: ἔστη εἰς τὸ μέσον
  choice: அவர்கள் நடுவில் நின்று
  rationale: இயேசு அவர்களின் மத்தியில் நின்றார் என்ற தெளிவான இடப் பொருளைப் பாதுகாக்கிறது.
- source_word: λέγει αὐτοῖς
  choice: என்றார்
  rationale: கதைநடையில் உள்ள வரலாற்று நிகழ்காலத்தை இயல்பான தமிழிறந்தகாலமாக வழங்குகிறது.
- source_word: Εἰρήνη ὑμῖν
  choice: உங்களுக்கு அமைதி!
  rationale: வினைச்சொல் இல்லாத கிரேக்க வாழ்த்தின் சுருக்கத்தையும் நேரடியான பொருளையும் காக்கிறது; ‘அமைதி’ என்பது தற்போதைய பொதுத் தமிழில் தெளிவானது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் τῶν Ἰουδαίων என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’; சூழலுக்குரிய மாற்றுப் பொருள்கள் அடிக்குறிப்பில்
  alternative: ‘யூதத் தலைவர்கள்’ அல்லது ‘யூதேயர்கள்’
  rationale: கிரேக்கச் சொல் இவ்விடத்தில் எதிர்ப்பாளர்களை, குறிப்பாகத் தலைவர்களைச் சுட்டக்கூடும்; எனினும் மூல உரை ‘தலைவர்கள்’ என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே குறிப்பைத் தேவையின்றிக் குறுக்காமல், இனமெங்கும் குற்றஞ்சாட்டுவதாகத் தவறாகப் புரிந்துகொள்ளாதவாறு மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: Εἰρήνη ὑμῖν என்ற வாழ்த்தின் வடிவம்
  choice: ‘உங்களுக்கு அமைதி!’
  alternative: ‘அமைதி உங்களோடு இருப்பதாக!’
  rationale: மூலத்தின் வினைச்சொல் இல்லாத சுருக்கமான வடிவத்தை முதன்மை உரை காக்கிறது; வாழ்த்து அல்லது ஆசிவாக்கியமாக விரித்துப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சீடர்கள்,’ ‘அமைதி’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘கூடியிருந்தார்கள்’ போன்ற விவரங்கள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
