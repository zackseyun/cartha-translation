source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: ta
  text: தோமா அவருக்குப் பதிலளித்து, “என் ஆண்டவரே, என் கடவுளே!” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று விளக்கம் (சாத்தியம் குறைவு): தோமா, “என் ஆண்டவரே, என் கடவுளே!” என்று ஒரு வியப்புச் சொல்லாகக் கூறியதாக எடுத்துக்கொள்ளலாம். எனினும், அவர் இதை ‘அவருக்கு’ சொன்னார் என்று கிரேக்கம் கூறுவதால், இவை இயேசுவை நேரடியாக அழைத்த சொற்கள் என்பதே ஆதரிக்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்து
  rationale: கதைநடையில் ‘பதில் கூறினார்’ என்ற இயல்பான பொருளைத் தருகிறது; தொடர்ந்து வரும் ‘என்றார்’ என்பதுடன் தமிழில் சரளமாக அமைகிறது.
- source_word: Θωμᾶς
  choice: தோமா
  rationale: தனிப்பெயர் நவீனத் தமிழ் வேதாகம வழக்கிற்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: εἶπεν αὐτῷ
  choice: அவருக்கு … என்றார்
  rationale: αὐτῷ என்ற மறைமுகச் செயப்படுபொருளைத் தெளிவாகக் காத்து, மூலத்தில் இல்லாத ‘இயேசு’ என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: Ὁ κύριός μου
  choice: என் ஆண்டவரே
  rationale: κύριος என்பதன் மரியாதை, அதிகாரம், இறையியல் நிறை ஆகியவற்றைக் காக்க ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது; நேரடி விளிக்காக ‘-ஏ’ சேர்க்கப்பட்டது.
- source_word: ὁ θεός μου
  choice: என் கடவுளே
  rationale: θεός என்பதற்கு இயல்பான நவீனத் தமிழ் இணையான ‘கடவுள்’ பயன்படுத்தப்பட்டு, μου என்பதன் தனிப்பட்ட உரிமைத் தொடர்பும் நேரடி விளியும் காக்கப்பட்டன.
- source_word: καὶ
  choice: (காற்புள்ளியால் இணைப்பு)
  rationale: தமிழில் ஒரே நபரை நோக்கிய இணையான இரு விளிப்புகளை ‘என் ஆண்டவரே, என் கடவுளே’ என்று அமைப்பது இயல்பானதும் வலிமையானதும் ஆகும்; கிரேக்கத்தின் ஒருங்கிணைந்த அறிக்கைப் பொருள் காக்கப்படுகிறது.
theological_decisions:
- issue: தோமாவின் சொற்கள் இயேசுவை நோக்கிய நேரடி அறிக்கையா, அல்லது கடவுளை நோக்கிய தனியான வியப்புச் சொல்லா?
  choice: 'இயேசுவை நோக்கிய நேரடி அறிக்கை: “என் ஆண்டவரே, என் கடவுளே!”'
  alternative: இயேசுவை அடையாளப்படுத்தாத ஒரு வியப்புச் சொல்லாக எடுத்தல்
  rationale: கிரேக்கம் தோமா ‘அவருக்கு’ (αὐτῷ) சொன்னதாக வெளிப்படையாகக் கூறுகிறது. கட்டுரையுடன் கூடிய பெயரெச்ச வடிவங்கள் இங்கு விளியாகச் செயல்படுகின்றன. ஆகவே கிறிஸ்துவைப் பற்றிய உரையின் வலிமையைத் தணிக்காமல் நேரடி அழைப்பாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அவருக்கு’ என்பது சூழலுக்கேற்ற மரியாதைச் சுட்டுப்பெயர். நேரடி விளியைத் தெளிவாக்க ‘ஆண்டவரே… கடவுளே’ என்ற வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன; இறையியல் வலிமையோ மூலத்தின் பதற்றமோ தணிக்கப்படவில்லை.
