  source_fidelity: மூல கிரேக்கத்தின் காலவரிசை, ‘கைகள்,’ ‘பக்கம்,’ சீடர்களின் மகிழ்ச்சி, மற்றும் ‘ஆண்டவர்’ என்ற அடையாளப்படுத்தல் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘விலாப்பக்கம்’ πλευράν என்பதற்குப் பொருத்தமான உடற்கூறு-சூழல் மொழியாகும்; காயம் என்று மூலத்தில் வெளிப்படையாக இல்லாததைச் சேர்ப்பதில்லை.
