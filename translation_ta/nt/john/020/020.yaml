id: JHN.20.20
reference: John 20:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ta
  text: இதைச் சொன்ன பின்பு, அவர் தமது கைகளையும் விலாப்பக்கத்தையும் அவர்களுக்குக் காட்டினார். அப்போது சீடர்கள் ஆண்டவரைக் கண்டு மகிழ்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: இதைச் சொன்ன பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; இந்தத் தமிழாக்கம் கால வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔδειξεν
  choice: காட்டினார்
  rationale: பார்க்கும்படி காண்பித்தல் என்ற நேரடியான பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: τὰς χεῖρας
  choice: தமது கைகளை
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் வெளிப்படையாக இல்லாவிட்டாலும், இவை இயேசுவின் சொந்தக் கைகள் என்பதால் தமிழ் வழக்கில் மரியாதைமிக்க தற்சுட்டு உடைமைப்பெயர் இயல்பாக உள்ளது.
- source_word: τὴν πλευράν
  choice: விலாப்பக்கத்தை
  rationale: πλευρά உடலின் பக்கப்பகுதியைக் குறிக்கிறது. ‘விலாப்பக்கம்’ என்பது காயத்தை வெளிப்படையாகச் சேர்க்காமல் உடற்கூறுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: காட்டப்பட்டவர்கள் சீடர்கள் என்பதைச் சுட்டும் மறைமுகச் செயப்படுபொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἐχάρησαν
  choice: மகிழ்ந்தார்கள்
  rationale: χαίρω என்பதன் மகிழ்ச்சி அடைதல் அல்லது களிகூருதல் என்ற பொருளை நவீன பொதுத்தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: அப்போது
  rationale: முந்திய நிகழ்வின் விளைவாக அடுத்து ஏற்பட்ட எதிர்வினையை கதையோட்டத்தில் இயல்பாக இணைக்கிறது; கடுமையான காரணவியல் விளக்கத்தைத் திணிக்கவில்லை.
- source_word: οἱ μαθηταί
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் μαθηταί என்பதற்கான நிலையான, பரவலாகப் புரியப்படும் தமிழ் இணைச்சொல்.
- source_word: ἰδόντες
  choice: கண்டு
  rationale: அவர்கள் மகிழ்ந்ததற்கான சந்தர்ப்பத்தையும் காரணத் தொடர்பையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: κύριος என்பதன் கிறிஸ்துவியல் கனத்தையும் உயிர்த்தெழுந்த இயேசுவைச் சீடர்கள் அடையாளம் கண்ட சூழலையும் பாதுகாக்கும் நிலையான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: உயிர்த்தெழுதல் காட்சியின் சூழலில் இது வெறும் மரியாதை அழைப்பாக இல்லாமல் இயேசுவைக் குறிக்கும் கிறிஸ்துவியல் பட்டமாகச் செயல்படுகிறது; ‘ஆண்டவர்’ அந்தப் பொருள் கனத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் வினை மற்றும் உடைமை வடிவங்களில் மரியாதைப் பன்மை பேணப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
