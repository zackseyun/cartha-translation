source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: ta
  text: ஆனால் மரியா கல்லறைக்கு வெளியே நின்று அழுதுகொண்டிருந்தாள். அவள் அழுதுகொண்டிருக்கையில், கல்லறைக்குள் பார்க்கக் குனிந்தாள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குனிந்து கல்லறைக்குள் பார்த்தாள்.” கிரேக்க வினைச்சொல், பார்ப்பதற்காகக் குனிவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய காட்சியிலிருந்து மரியாவிடம் கவனத்தைத் திருப்பும் மெல்லிய கதைநடை வேறுபாட்டைக் காட்டுகிறது.
- source_word: εἱστήκει
  choice: நின்றுகொண்டு ... இருந்தாள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நீடித்த நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: கல்லறைக்கு வெளியே
  rationale: மரியா கல்லறைக்கு வெளியில் இருந்த இடநிலையைத் தெளிவாகக் காட்டி, பின்னர் அவள் உள்ளே பார்ப்பதுடன் உள்ள எதிர்வை பாதுகாக்கிறது.
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: இச்சூழலில் அடக்கம் செய்யப்பட்ட இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: κλαίουσα / ἔκλαιεν
  choice: அழுதுகொண்டிருந்தாள் / அழுதுகொண்டே
  rationale: இரு வடிவங்களிலும் உள்ள தொடர்ச்சியான அழுகையைத் தமிழ் கதைநடையில் இயல்பாகவும் மீளுரைப்பை ஓரளவு பாதுகாத்தும் தெரிவிக்கிறது.
- source_word: ὡς οὖν
  choice: அவள் அழுதுகொண்டே
  rationale: அழுகை தொடர்ந்தபோதே அடுத்த செயல் நிகழ்ந்ததை வெளிப்படுத்துகிறது; கிரேக்க இணைப்புச் சொற்களின் கதைநடை முன்னேற்றம் தமிழில் இயல்பாக உட்பொருளாக்கப்பட்டுள்ளது.
- source_word: παρέκυψεν
  choice: பார்க்கக் குனிந்தாள்
  rationale: குனிந்து உள்ளே நோக்கும் உடல் அசைவையும் அதன் நோக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς τὸ μνημεῖον
  choice: கல்லறைக்குள்
  rationale: பார்வை கல்லறையின் உட்புறத்தை நோக்கிய திசையை நேரடியாகக் காட்டுகிறது.
