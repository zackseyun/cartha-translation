translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான வேதாகமக் கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான செயலைக் காட்ட “கொண்டிருந்தாள்/கொண்டே” பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
