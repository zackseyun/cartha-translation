- from: ஆனால் மரியா கல்லறைக்கு வெளியே நின்றுகொண்டு அழுதுகொண்டிருந்தாள். அவள் அழுதுகொண்டே, கல்லறைக்குள் பார்க்கக் குனிந்தாள்[a].
  to: ஆனால் மரியா கல்லறைக்கு வெளியே நின்று அழுதுகொண்டிருந்தாள். அவள் அழுதுகொண்டிருக்கையில், கல்லறைக்குள் பார்க்கக் குனிந்தாள்[a].
