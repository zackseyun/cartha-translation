  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: ta
  text: அவர்கள் இருவரும் ஒன்றாக ஓடிக்கொண்டிருந்தார்கள்; மற்ற சீடர் பேதுருவைவிட வேகமாக ஓடி முன்னே சென்று, கல்லறைக்கு முதலில் வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: ஓடிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கும் குறைநிலை இறந்தகால வினை வடிவத்தின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ;
  rationale: δέ இங்கு மென்மையான தொடர்ச்சியையும் அடுத்த நிகழ்வுக்கான நகர்வையும் குறிக்கிறது; தேவையற்ற எதிர்மறை முரணைச் சேர்க்காமல் தமிழ் வாக்கியப் பிரிப்பு இதை இயல்பாகத் தருகிறது.
- source_word: οἱ δύο ὁμοῦ
  choice: அவர்கள் இருவரும் ஒன்றாக
  rationale: இருவர் என்பதையும் அவர்கள் இணைந்து ஓடியதையும் மூலத்துக்கு நெருக்கமாகத் தெளிவுபடுத்துகிறது.
- source_word: ὁ ἄλλος μαθητής
  choice: மற்ற சீடர்
  rationale: யோவான் நற்செய்தியின் வழக்கமான μαθητής சொல்லாட்சிக்கு ஏற்ற, மரியாதையும் இயல்பும் கொண்ட தமிழாக்கம்.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: பேதுருவைவிட வேகமாக முன்னால் ஓடி
  rationale: முன்னால் ஓடுதல் என்ற கூட்டு வினையின் படிமத்தையும் பேதுருவுடன் செய்யப்படும் வேக ஒப்பீட்டையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: ἦλθεν πρῶτος
  choice: முதலில் வந்து சேர்ந்தார்
  rationale: வருகையும் முதன்மையான அடைவும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: εἰς τὸ μνημεῖον
  choice: கல்லறைக்கு
  rationale: அடுத்த வசனத்தின்படி அவர் இன்னும் உள்ளே நுழையவில்லை; ஆகவே இலக்கை நோக்கிய வருகையைச் சுட்டும் ‘கல்லறைக்கு’ என்பது சூழலுக்கு ஏற்றது.
