source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: ta
  text: அவருடைய தலையின்மேல் இருந்த முகத்துணியும், லினன் துணிகளோடு கிடக்காமல், தனியாக ஓரிடத்தில் சுருட்டப்பட்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுற்றப்பட்டிருந்தது” அல்லது “மடித்து வைக்கப்பட்டிருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: ἐντετυλιγμένον என்பதன் பொருள் துணி சுற்றப்பட்ட அல்லது மடிக்கப்பட்ட நிலையில் இருந்ததைக் குறிக்கலாம்; துல்லியமான வடிவத்தை மூல உரை குறிப்பிடவில்லை.
lexical_decisions:
- source_word: σουδάριον
  choice: முகத்துணி
  rationale: அடக்கச் சூழலில் இயேசுவின் தலை அல்லது முகத்தோடு தொடர்புடைய துணியைக் குறிக்கிறது. அடுத்துவரும் விளக்கத்துடன் இணைந்து, நவீன வாசகருக்கு இயல்பாகப் புரியும் சொல்.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: அவருடைய தலையின்மேல் இருந்த
  rationale: துணி எவ்வாறு சுற்றப்பட்டிருந்தது என்று கூடுதலாகத் தீர்மானிக்காமல், கிரேக்கச் சொற்றொடரின் இடப்பொருளை நேரடியாகக் காக்கிறது.
- source_word: ὀθονίων
  choice: மெல்லிய துணிகள்
  rationale: கல்லறையில் காணப்பட்ட அடக்கத் துணிகளைக் குறிக்கும் பன்மை வடிவம். தமிழில் இயல்பாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: κείμενον
  choice: கிடக்காமல்
  rationale: κεῖμαι என்பதன் நிலை அல்லது இடத்தைச் சுட்டும் பொருளைத் தெளிவாகக் காத்து, முந்தைய துணிகளுடன் இருந்த நிலையை மறுக்கும் அமைப்பை இயல்பாக வழங்குகிறது.
- source_word: χωρὶς
  choice: தனியாக
  rationale: மற்ற துணிகளிலிருந்து இடரீதியாகப் பிரிந்திருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐντετυλιγμένον
  choice: சுருட்டப்பட்டிருந்தது
  rationale: துணி சுற்றப்பட்ட, மடிக்கப்பட்ட அல்லது சுருட்டப்பட்ட நிலையில் இருந்ததைச் சுட்டும் நிறைவேற்றப்பட்ட நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; துல்லியமான வடிவம் உறுதியல்ல என்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: εἰς ἕνα τόπον
  choice: ஓரிடத்தில்
  rationale: துணி மற்றவற்றிலிருந்து பிரிந்து ஒரு குறிப்பிட்ட இடத்தில் இருந்ததை, தேவையற்ற விளக்கம் சேர்க்காமல் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: அடக்கத் துணிகள் அமைந்திருந்த விதம் ஏதேனும் சிறப்பான இறையியல் அல்லது குறியீட்டுப் பொருளைக் கட்டாயமாக உணர்த்துகிறதா
  choice: துணியின் தனித்த இடத்தையும் நிலையையும் மட்டும் விவரிக்கும் காட்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: மடிக்கப்பட்ட துணி திட்டமிட்ட ஒழுங்கையோ உயிர்த்தெழுதலின் குறிப்பிட்ட நிகழ்வமைப்பையோ நிரூபிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை துணியின் இடத்தையும் நிலையையும் விவரிக்கிறது; அதன் குறியீட்டுப் பொருளையோ நிகழ்வின் விரிவான மறுகட்டமைப்பையோ வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கல்லறைக் காட்சியின் சுருக்கமான, பார்வைசார்ந்த தன்மை காக்கப்பட்டுள்ளது.
