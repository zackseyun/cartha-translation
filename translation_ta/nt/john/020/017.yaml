source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: ta
  text: இயேசு அவளிடம், “என்னைப் பிடித்துக்கொண்டிருக்காதே[a]; ஏனெனில் நான் இன்னும் பிதாவிடம் ஏறிச் செல்லவில்லை. ஆனால் நீ என் சகோதரர்களிடம்[b] போய், ‘நான் என் பிதாவிடமும் உங்கள் பிதாவிடமும், என் தேவனிடமும் உங்கள் தேவனிடமும் ஏறிச் செல்கிறேன்’ என்று அவர்களிடம் சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்னைத் தொடாதே” அல்லது “என்னைப் பற்றிக்கொள்ளாதே” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வெறுமனே தொடுவதைக் காட்டிலும், அவரைப் பற்றிக்கொள்வதையோ தொடர்ந்து பிடித்திருப்பதையோ இங்கு குறிக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது கிரேக்கத்தின் ஆண்பால் பன்மைச் சொல்லை மொழிபெயர்க்கிறது. இங்கு அது இயேசுவின் சீடர்களைக் குறிக்கிறது; ஆண்களை மட்டும் அல்லாமல் இன்னும் பரந்த பிரதிநிதிக் குழுவையும் உள்ளடக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: பற்றிக்கொண்டிருக்காதே
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை, தொடுதலை மட்டும் தடைசெய்வதைவிட தொடர்ந்து பற்றிக்கொண்டிருப்பதை நிறுத்தும் நுணுக்கத்தை இச்சூழலில் தருகிறது.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: ஏனெனில் நான் இன்னும் ... ஏறிச் செல்லவில்லை
  rationale: நிறைவுற்ற காலத்தின் ‘இன்னும் நிகழவில்லை’ என்ற பொருளையும், பிதாவை நோக்கிய ஏற்றத்தின் யோவானியச் சூழலையும் காக்கிறது.
- source_word: πρὸς τὸν πατέρα
  choice: பிதாவிடம்
  rationale: முதல் இடத்தில் மூலத்தில் உடைமைச் சொல் இல்லாததால் ‘என் பிதா’ என்று சேர்க்காமல், பின்னருள்ள வெளிப்படையான இணை அமைப்பிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: πορεύου
  choice: போய்
  rationale: இயக்கத்தைக் குறிக்கும் கட்டளைக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἀδελφούς
  choice: சகோதரர்கள்
  rationale: ஆண்பால் பன்மை வடிவத்தை நேரடியாகக் காக்கிறது; இச்சூழலில் சீடர்களைக் குறிக்கும் பரப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: εἰπὲ αὐτοῖς
  choice: அவர்களிடம் சொல்
  rationale: அறிவிக்கும்படி கொடுக்கப்படும் கட்டளையை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: Ἀναβαίνω
  choice: ஏறிச் செல்கிறேன்
  rationale: நிகழ்காலத்தின் முன்னோக்கிய, அண்மையில் நிகழவிருக்கும் இயக்க நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: என் பிதாவிடமும் உங்கள் பிதாவிடமும்
  rationale: இயேசுவின் உறவையும் சீடர்களின் உறவையும் ஒன்றாக்காமல், இணையான அமைப்பில் பக்கப்பக்கமாகக் காக்கிறது.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: என் தேவனிடமும் உங்கள் தேவனிடமும்
  rationale: மூலத்தின் இணை அமைப்பையும் இறையியல் அழுத்தத்தையும் மென்மைப்படுத்தாமல் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: Μή μου ἅπτου என்பதன் பொருள்
  choice: தொடர்ந்து பற்றிக்கொண்டிருப்பதை நிறுத்தும்படியான கட்டளை
  alternative: என்னைத் தொடாதே
  rationale: வினையின் நிகழ்கால வடிவமும் சூழலும் வெறும் தொடுதலைவிட நீடித்துப் பிடித்திருப்பதைச் சுட்டக்கூடும்; இந்த நுணுக்கம் உறுதியானதைவிட அதிகமாக விளக்கப்படவில்லை.
- issue: முதல் πρὸς τὸν πατέρα என்பதன் மொழிபெயர்ப்பு
  choice: பிதாவிடம்
  alternative: என் பிதாவிடம்
  rationale: இந்த முதல் தொடரில் μου இல்லை; பின்னர் வரும் ‘என் பிதா, உங்கள் பிதா’ என்ற வெளிப்படையான வேறுபாட்டை மூலப்படியே விடுகிறது.
- issue: ‘என் தேவன், உங்கள் தேவன்’ என்பதன் கிறிஸ்துவியல் அழுத்தம்
  choice: என் தேவனிடமும் உங்கள் தேவனிடமும் என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘என் தேவன்’ என்பதன் வலிமையைத் தணிக்கும் விளக்கவுரை
  rationale: வசனத்தின் இறையியல் பதற்றத்தை எந்தக் கோட்பாட்டிற்காகவும் மென்மைப்படுத்தாமல், யோவானின் சொற்களை அப்படியே நிறுத்துகிறது.
translation_notes:
  register: இயல்பான, நவீன, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’, ‘தேவன்’ ஆகியவை வேதாகமச் சூழலில் பரவலாகப் புரியப்படும் dignified சொற்களாக வைக்கப்பட்டுள்ளன. இரண்டு அடிக்குறிப்பு குறிகளும் அவை சார்ந்த சொற்றொடர்களுக்கு அருகில் முதன்மை உரையில் இடம்பெற்றுள்ளன.
