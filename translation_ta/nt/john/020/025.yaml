  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: ta
  text: எனவே மற்ற சீடர்கள் அவரிடம், “நாங்கள் ஆண்டவரைக் கண்டிருக்கிறோம்” என்று சொல்லிக்கொண்டிருந்தார்கள். ஆனால் அவர் அவர்களிடம், “அவருடைய கைகளில் ஆணிகளின் தடத்தை நான் கண்டு, ஆணிகளின் அந்தத் தடத்தில் என் விரலைச் செலுத்தி, அவருடைய பக்கத்தில் என் கையைச் செலுத்தினாலொழிய, நான் நிச்சயமாக நம்பமாட்டேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் ஒருபோதும் நம்பமாட்டேன்.” கிரேக்க மொழியில் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால நிறைவுறா வினை தொடர்ந்து அல்லது மீண்டும் மீண்டும் சொல்லப்பட்டதைச் சுட்டுகிறது; தமிழ் தொடர்வினை அந்த இயல்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள கதைத் தொடர்பையும் அதன் விளைவையும் தக்கவைக்கிறது.
- source_word: οἱ ἄλλοι μαθηταί
  choice: மற்ற சீடர்கள்
  rationale: தோமாவுக்கு மாறாக இருந்த பிற சீடர்களை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: Ἑωράκαμεν
  choice: நாங்கள் ஆண்டவரைக் கண்டிருக்கிறோம்
  rationale: நிகழ்ந்து முடிந்த செயல் தற்போதும் பொருத்தமுடையது என்ற கிரேக்க நிறைவுநிலையின் வலிமையை ‘கண்டிருக்கிறோம்’ தக்கவைக்கிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: இங்கு உயிர்த்தெழுந்த இயேசுவைக் குறிக்கும் பட்டப்பெயராக இருப்பதால் ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἐὰν μὴ ἴδω
  choice: நான் கண்டு … வைத்தாலொழிய
  rationale: எதிர்மறை நிபந்தனையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: அவருடைய கைகளில்
  rationale: கைகளில் காணப்படும் காயத் தடங்களைக் குறிக்கும் கிரேக்கச் சொல்லமைப்பை நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: τύπον τῶν ἥλων
  choice: ஆணிகளின் தடம்
  rationale: ஆணிகள் விட்டுச் சென்ற கண்கூடான சுவடு அல்லது பதிப்பை ‘தடம்’ தெளிவாகவும் மிகையின்றியும் தெரிவிக்கிறது.
- source_word: βάλω τὸν δάκτυλόν μου εἰς
  choice: என் விரலை வைத்து
  rationale: விரலை அந்தத் தடத்திற்குள் செலுத்தும் இயக்கம் சூழலால் தெளிவாக இருப்பதால், இயல்பான தமிழில் ‘வைத்து’ என வழங்கப்பட்டுள்ளது.
- source_word: εἰς τὴν πλευρὰν αὐτοῦ
  choice: அவருடைய விலாவில்
  rationale: πλευρά இங்கு ஈட்டியால் குத்தப்பட்ட உடலின் பக்கப்பகுதி அல்லது விலாவைக் குறிக்கிறது; யோவான் நூலின் சூழலில் ‘விலா’ தெளிவான உடற்கூறு சொல்லாகும்.
theological_decisions:
- issue: οὐ μὴ πιστεύσω என்பதில் தோமாவின் மறுப்பின் வலிமை
  choice: நான் நிச்சயமாக நம்பமாட்டேன்
  alternative: நான் ஒருபோதும் நம்பமாட்டேன்
  rationale: οὐ μή வலியுறுத்தப்பட்ட மறுப்பைத் தருகிறது. ஆனால் இது முன்வைக்கப்பட்ட நிபந்தனை நிறைவேறாதவரை கூறப்படும் மறுப்பு; காலமெல்லாம் நீடிக்கும் முழுமையான மறுப்பாக மிகைப்படுத்தாமல் அதன் வலிமையை ‘நிச்சயமாக’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘சொல்லிக்கொண்டிருந்தார்கள்’ என்பது மீண்டும் மீண்டும் வலியுறுத்திய சீடர்களின் செயலைக் காட்டுகிறது; தோமாவின் நிபந்தனை மற்றும் வலுவான மறுப்பு மென்மையாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு அது விளக்கும் மறுப்பின் இடத்திலேயே வைக்கப்பட்டுள்ளது.
