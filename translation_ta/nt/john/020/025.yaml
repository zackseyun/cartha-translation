review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the disciples’ repeated report, the perfect sense of ‘We have seen,’ Thomas’s conditional demand, and the emphatic negation. However, ‘வைத்து’ (‘placing’) weakens the directional force of εἰς (‘into’) in both of Thomas’s requested actions. ‘விலா’ normally denotes a rib, whereas πλευρά denotes Jesus’ side.
  naturalness: The prose is fluent modern Tamil. ‘என் விரலைச் செலுத்தி’ and ‘என் கையைச் செலுத்தி’ are natural enough in this explicit conditional context and better communicate the intended movement.
  terminology: ‘ஆண்டவர்,’ ‘சீடர்கள்,’ ‘ஆணிகள்,’ and ‘தடம்’ are suitable modern standard Tamil choices. ‘அவருடைய பக்கம்’ is preferable to ‘விலா’ here because it represents the broader bodily term πλευρά without adding a specific anatomical referent.
  issues:
  - severity: medium
    issue: The directional force of εἰς is not represented in the two phrases translated with ‘வைத்து.’
    rationale: Thomas says that he must put his finger into the nail-mark and his hand into Jesus’ side. Tamil ‘வைத்து’ can mean merely place on; ‘செலுத்தி’ preserves the movement into without adding an explicit noun such as ‘wound,’ which the Greek does not state.
  - severity: low
    issue: ‘விலா’ is narrower than πλευρά.
    rationale: ‘விலா’ commonly means ‘rib’; πλευρά means ‘side.’ ‘பக்கம்’ is semantically broader and more source-faithful.
