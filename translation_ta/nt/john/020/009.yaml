reference: John 20:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: ta
  text: ஏனெனில், அவர் இறந்தோரிலிருந்து உயிர்த்தெழ வேண்டும் என்று வேதவசனம் கூறுவதை அவர்கள் அதுவரை புரிந்துகொள்ளவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: அதுவரை ... இல்லை
  rationale: அந்த நேரம்வரை புரிதல் ஏற்படவில்லை என்ற காலப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: ᾔδεισαν
  choice: புரிந்துகொள்ளவில்லை
  rationale: வேதவசனத்தின் இருப்பை அறியாமை அல்லாமல் அதன் பொருளை உணராததையே சூழல் குறிக்கிறது.
- source_word: τὴν γραφὴν
  choice: வேதவசனம்
  rationale: ஒருமையான γραφή-ஐப் பாதுகாத்து, குறிப்பிட்ட வேதச்சாட்சி அல்லது வேதப்பகுதியைக் குறிக்கக்கூடிய இயல்பான தமிழ் சொல்லை பயன்படுத்துகிறது.
- source_word: ὅτι
  choice: என்று ... கூறுவதை
  rationale: அவர்கள் புரிந்துகொள்ளாத வேதவசனத்தின் உள்ளடக்கத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; ‘கூறுவதை’ என்பது தமிழில் தொடர்பைத் தெளிவாக்கும் மறைமுக விரிவாக்கம்.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவத் திட்டத்தின்படியான அவசியத்தைத் தக்கவைக்கிறது.
- source_word: αὐτὸν
  choice: அவர்
  rationale: இயேசுவைக் குறிக்கும் மரியாதையான மூன்றாம் நபர் ஒருமை வடிவம்.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: νεκρῶν என்பதன் பன்மை நபர்சார்ந்த பொருளையும் ἐκ என்பதன் ‘இலிருந்து’ உணர்வையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀναστῆναι
  choice: உயிர்த்தெழ
  rationale: செய்வினை வடிவத்தைப் பாதுகாக்கும், உயிர்த்தெழுதலைக் குறிக்கும் இயல்பான தமிழ் சொல்; ‘உயிர்த்தெழுப்பப்பட’ என்ற செயப்பாட்டு வடிவத்தை இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதலின் வினைவடிவமும் செயலாற்றுபவரும்
  choice: அவர் ... உயிர்த்தெழ வேண்டும்
  alternative: அவர் ... உயிர்த்தெழுப்பப்பட வேண்டும்
  rationale: ἀναστῆναι என்பது செய்வினை இறந்தகால இன்ஃபினிட்டிவ் என்பதால் மூலத்தின் செய்வினைச் சொல்லாக்கம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது. செயப்பாட்டு மாற்று புதிய ஏற்பாட்டின் பிற இடங்களோடு ஒத்திருந்தாலும், இவ்வசனத்தின் இலக்கணத்தை அதற்கேற்ப மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க ஒருமை ‘வேதவசனம்’ என்றும், active resurrection expression ‘உயிர்த்தெழ’ என்றும் தக்கவைக்கப்பட்டுள்ளன. தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை; ஆங்கில அடிக்குறிப்பிலுள்ள செயப்பாட்டு மாற்று கிரேக்க வடிவத்தைவிடத் துல்லியமற்றது.
