  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: ta
  text: மகதலேனா மரியா சீடர்களிடம் வந்து, “நான் ஆண்டவரைக் கண்டேன்; அவர் என்னிடம் இவற்றைக் கூறினார்” என்று அறிவித்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மகதலேனா மரியா சீடர்களிடம் வந்து, ‘நான் ஆண்டவரைக் கண்டேன்’ என்று அறிவித்தாள்; அவர் அவளிடம் இவற்றைக் கூறினார்.” இறுதிக் கூற்றை மரியா அறிவித்த செய்தியின் ஒரு பகுதியாகவோ, கதைசொல்லியின் குறிப்பாகவோ புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்து
  rationale: இது கதைநடையில் கடந்த நிகழ்வைக் குறிக்கும் வரலாற்று நிகழ்காலம். தமிழில் வினையெச்சத்துடன் கடந்தகால முதன்மை வினையைப் பயன்படுத்துவது இயல்பான கதைநடையை அளிக்கிறது.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: மகதலேனா மரியா
  rationale: மரியாவின் பெயரையும் மகதலா ஊரைச் சுட்டும் அடைமொழியையும் தமிழில் நிலைபெற்ற வேதாகம வழக்குக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: ἀγγέλλουσα
  choice: அறிவித்தாள்
  rationale: சீடர்களிடம் ஒரு செய்தியை எடுத்துரைத்தாள் என்ற வினையின் செய்தியறிவிக்கும் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களிடம்
  rationale: μαθητής என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் சொல் ‘சீடர்’; மூலத்தில் இல்லாத ‘அவருடைய’ என்பது சேர்க்கப்படவில்லை.
- source_word: Ἑώρακα
  choice: நான் ... கண்டேன்
  rationale: கிரேக்க நிறைவுக்காலம் முடிந்த காணுதலின் தற்போதைய முக்கியத்துவத்தைக் கொண்டுள்ளது. தமிழில் இயல்பான நேரடி உரையாக ‘கண்டேன்’ இதைச் சூழலுடன் தெரிவிக்கிறது.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: உயிர்த்தெழுதல் சூழலில் இயேசுவைக் குறிக்கும் κύριος என்ற பட்டத்தின் இறையியல் கனத்தை ‘ஆண்டவர்’ இயல்பாகக் காக்கிறது.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: அவர் தன்னிடம் இவற்றைக் கூறினார் என்றும்
  rationale: மரியா அறிவித்த செய்தியின் தொடர்ச்சியாக இந்தக் கூற்றை முதன்மை உரை எடுத்துக்கொள்கிறது. ‘இவற்றை’ என்பது ταῦτα என்பதையும், ‘தன்னிடம்’ என்பது மரியாவையே αὐτῇ சுட்டுவதையும் தெளிவாகக் காக்கின்றன.
theological_decisions:
- issue: உயிர்த்தெழுதல் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு இயேசுவைக் குறிக்கும் பட்டத்தின் கிறிஸ்தியல் கனத்தைத் தளர்த்தாமல், புதிய ஏற்பாட்டுத் தமிழ் வழக்கில் இயல்பாக வழங்குகிறது.
- issue: καὶ ταῦτα εἶπεν αὐτῇ என்பது மரியாவின் அறிவிப்புடன் கொண்டுள்ள தொடர்பு
  choice: 'மரியா அறிவித்த செய்தியின் ஒரு பகுதியாக: ‘அவர் தன்னிடம் இவற்றைக் கூறினார் என்றும்’'
  alternative: 'கதைசொல்லியின் தனிக் குறிப்பாக: ‘அவர் அவளிடம் இவற்றைக் கூறினார்’'
  rationale: இரண்டாவது ὅτι வெளிப்படையாக இல்லாவிட்டாலும், இக்கூற்று ἀγγέλλουσα என்பதன் செய்திப் பொருளைத் தொடர்ந்து வரலாம். அதேவேளை, கிரேக்கத்தின் அமைப்பு கதைசொல்லியின் குறிப்பாகவும் புரிந்துகொள்ள இடமளிப்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘என்றும் ... என்றும்’ என்ற அமைப்பு மரியா அறிவித்த இரு செய்திக் கூறுகளையும் இணைக்கிறது; மூலமொழியின் உண்மையான தொடரியல் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
