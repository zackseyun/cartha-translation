source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: ta
  text: அப்போது இயேசு மீண்டும் அவர்களிடம், “உங்களுக்குச் சமாதானம்.[a] தந்தை என்னை அனுப்பியதுபோலவே, நானும் உங்களை அனுப்புகிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வழக்கமான மொழிபெயர்ப்பின்படி, “உங்களுக்குச் சமாதானம் உண்டாவதாக.”
    reason: வினைச்சொல் இல்லாத கிரேக்க வாழ்த்தைத் தமிழில் சுருக்கமாகவும், விருப்பவாக்கியமாகவும் மொழிபெயர்க்க முடியும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வுடன் உள்ள தொடர்ச்சியையும் அதிலிருந்து வரும் முன்னேற்றத்தையும் குறிக்கிறது; காரணத்தை அளவுக்கு மீறி வலியுறுத்தாமல் இணைப்புச் சக்தியைத் தக்கவைக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய வசனத்தில் இயேசு கூறிய வாழ்த்தை இங்கு மறுபடியும் கூறுவதை நேரடியாகக் காட்டுகிறது.
- source_word: Εἰρήνη ὑμῖν
  choice: உங்களுக்குச் சமாதானம்
  rationale: வினைச்சொல் இல்லாத கிரேக்க வாழ்த்தின் சுருக்கமான வடிவத்தையும் செமித்திய மொழிநடையையும் தக்கவைக்கிறது. ‘சமாதானம்’ என்பது வெறும் அமைதியை மட்டுமல்லாமல் நலவாழ்வையும் உறவுச் சீர்மையையும் உள்ளடக்கக்கூடிய சொல்லாகும்.
- source_word: καθὼς
  choice: அனுப்பியிருப்பதுபோலவே
  rationale: தந்தை இயேசுவை அனுப்பியதற்கும் இயேசு சீடர்களை அனுப்புவதற்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπέσταλκέν
  choice: அனுப்பியிருக்கிறார்
  rationale: நிறைவேறியிருந்தும் தொடர்ந்து பொருத்தமுள்ள அனுப்புதலைக் குறிக்கும் கிரேக்க நிறைவுக்காலத்தின் கூறைத் தமிழில் பிரதிபலிக்கிறது.
- source_word: ὁ πατήρ
  choice: தந்தை
  rationale: மூலத்தில் தனிப்பட்ட உடைமைச்சொல் இல்லாததால் ‘என் தந்தை’ என்று விரிவாக்காமல் யோவானின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: ‘καὶ ἐγώ’ என்பதன் இணைப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது; முன்னுள்ள ‘போலவே’ என்பதுடன் சேர்ந்து இரு அனுப்புதல்களுக்கிடையிலான ஒப்புமையை வெளிப்படுத்துகிறது.
- source_word: πέμπω
  choice: அனுப்புகிறேன்
  rationale: நிகழ்காலத்தில் இயேசு அளிக்கும் உடனடியான பணியனுப்புதலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தந்தை இயேசுவை அனுப்பியதற்கும் இயேசு சீடர்களை அனுப்புவதற்கும் உள்ள உறவு
  choice: “தந்தை என்னை அனுப்பியிருப்பதுபோலவே, நானும் உங்களை அனுப்புகிறேன்” என்று ஒப்புமையை மட்டும் வெளிப்படுத்துதல்
  alternative: இரு அனுப்புதல்களும் அதிகாரம், முறை, பதவி ஆகிய அனைத்திலும் முற்றிலும் சமமானவை என விளக்கி விரிவாக்குதல்
  rationale: கிரேக்க உரை பணிக்கும் அனுப்புதலுக்கும் இடையிலான ஆழமான ஒப்புமையை நிறுவுகிறது; ஆனால் அந்த ஒப்புமையின் எல்லைகளை இவ்வசனம் விளக்கவில்லை. ஆகவே கூடுதல் கோட்பாட்டுத் தீர்மானங்களை மொழிபெயர்ப்பில் சேர்க்காமல் உள்ள இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்களுக்குச் சமாதானம்’ என்ற சுருக்கமான வாழ்த்து மூலத்தின் வினையற்ற அமைப்பைப் பாதுகாக்கிறது; பாரம்பரியமாக விரிவாக்கப்பட்ட வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
