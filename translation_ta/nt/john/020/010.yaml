  text: So the disciples went away again to their own homes[a].
translation:
  language: ta
  text: ஆகவே, சீடர்கள் தாங்கள் தங்கியிருந்த இடத்திற்குத் திரும்பிப் போனார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘தங்களிடமே.’ இக்கிரேக்கச் சொற்றொடர் அவர்கள் தங்களுக்குரிய இடத்துக்கு, ஒருவேளை தாங்கள் தங்கியிருந்த இடத்துக்குத் திரும்பியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: போனார்கள்
  rationale: ἀπέρχομαι இன் இறந்தகால வடிவம் அந்த இடத்தைவிட்டு அகன்று செல்வதைக் குறிக்கிறது. தமிழில் ‘போனார்கள்’ இயல்பாக இதை வெளிப்படுத்துகிறது; ‘திரும்பி’ என்பதுடன் சேர்ந்து புறப்பட்டுச் சென்ற கருத்தும் தெளிவாகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக அடுத்த நிகழ்வை இணைக்கும் οὖν என்பதன் தொடர்பை ‘ஆகவே’ இயல்பாகக் காட்டுகிறது.
- source_word: πάλιν
  choice: திரும்பி
  rationale: πάλιν இங்கு மீண்டும் முன்பு இருந்த இடத்திற்குச் செல்வதைக் குறிக்கிறது. இயக்கம் சார்ந்த இந்தச் சூழலில் ‘திரும்பி’ என்பது இயல்பான தமிழ்.
- source_word: πρὸς αὑτούς
  choice: தாங்கள் தங்கியிருந்த இடத்திற்கு
  rationale: நேரடியாக ‘தங்களிடமே’ என்று பொருள்படும் கிரேக்கச் சொற்றொடர், இச்சூழலில் அவர்கள் தமக்குரிய இடத்துக்கு அல்லது தங்கியிருந்த இடத்துக்குத் திரும்பியதைக் குறிக்கும் வழக்குச் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது. ‘வீடுகளுக்கு’ என்று குறிப்பிட்டுச் சொல்வதைவிட இந்தத் தேர்வு மூலத்தின் தெளிவின்மையைச் சிறப்பாகப் பாதுகாக்கிறது.
- source_word: οἱ μαθηταί
  choice: சீடர்கள்
  rationale: μαθηταί என்பதற்கு இயேசுவைப் பின்பற்றிக் கற்றவர்களைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் வேதாகமச் சொல் ‘சீடர்கள்’.
