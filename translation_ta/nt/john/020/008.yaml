  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: ta
  text: அப்போது, கல்லறைக்கு முதலில் வந்திருந்த மற்ற சீடரும் உள்ளே சென்றார்[a]; அவர் பார்த்தார்; நம்பினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உள்ளே நுழைந்தார்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூலத்தில் அவர் எதை நம்பினார் என்பது வெளிப்படையாகக் கூறப்படவில்லை. அவர் இயேசுவின் உயிர்த்தெழுதலை நம்பினாரா, தம் முன்னிருந்த சான்றை நம்பினாரா, அல்லது முன்பு தெரிவிக்கப்பட்ட செய்தியை நம்பினாரா என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: அப்போது
  rationale: இந்தச் சொற்சேர்க்கை நிகழ்வின் அடுத்த கட்டத்தைக் காட்டுவதோடு மெலிதான முடிவுறுத்தும் நுணுக்கத்தையும் கொண்டுள்ளது. இயல்பான தமிழ் நடையில் ‘அப்போது’ கதை நகர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰσῆλθεν
  choice: உள்ளே சென்றார்
  rationale: வினைச்சொல் ‘உள்ளே சென்றார்/நுழைந்தார்’ என்று பொருள்படும். இங்கு ‘உள்ளே சென்றார்’ என்பது இடத்திற்குள் செல்லும் செயலையும் இயல்பான நவீன தமிழ் நடையையும் காக்கிறது.
- source_word: ὁ ἄλλος μαθητής
  choice: மற்ற சீடர்
  rationale: யோவான் நற்செய்தியில் வரும் வழக்கமான அடையாளப்படுத்தல் இது. μαθητής என்பதற்கு இச்சூழலில் ‘சீடர்’ துல்லியமானதும் நிலைபெற்றதுமான சொல்.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: கல்லறைக்கு முதலில் வந்திருந்த
  rationale: பேதுருவுக்கு முன்பே அந்தச் சீடர் கல்லறையை அடைந்திருந்ததை இந்தப் பெயரெச்சத் தொடர் குறிப்பிடுகிறது. முதன்மை வினைக்கு முந்திய செயலை ‘வந்திருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μνημεῖον
  choice: கல்லறை
  rationale: இந்த உயிர்த்தெழுதல் நிகழ்வில், அடக்கம் செய்யப்பட்ட இடத்தையே இச்சொல் குறிக்கிறது; அதற்குத் துல்லியமான இயல்பான தமிழ்ச் சொல் ‘கல்லறை’.
- source_word: καὶ εἶδεν
  choice: அவர் பார்த்து
  rationale: εἶδεν என்பதன் நேரடியான பொருளை ‘பார்த்தார்’ வெளிப்படுத்துகிறது. அடுத்த வினையுடன் இயல்பாக இணைக்க ‘பார்த்து’ பயன்படுத்தப்பட்டுள்ளது; யார் பார்த்தார் என்பதைக் குழப்பமின்றிக் காட்ட ‘அவர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐπίστευσεν
  choice: நம்பினார்
  rationale: மூலத்தில் நம்பிக்கையின் பொருள் வெளிப்படையாகக் கூறப்படவில்லை. எனவே எதை நம்பினார் என்பதைச் சேர்க்காமல், வினையைத் தனிநிலையில் ‘நம்பினார்’ என்று மொழிபெயர்ப்பது மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: சீடர் எதை நம்பினார்?
  choice: ‘நம்பினார்’ என்று மட்டும் கூறி, நம்பிக்கையின் பொருளைக் குறிப்பிடாமல் விடுதல்.
  alternative: இயேசு உயிர்த்தெழுந்தார் என்று நம்பினார்; மரியாளின் செய்தியை நம்பினார்; அல்லது உயிர்த்தெழுதலின் ஆதாரத்தை நம்பினார் என்று குறிப்பாக்குதல்.
  rationale: கிரேக்க மூலத்தில் ἐπίστευσεν என்பதற்கான பொருள் குறிப்பிடப்படவில்லை. குறிப்பாக அடுத்த வசனத்தின் வெளிச்சத்தில் இதன் பொருள் குறித்து வேறுபட்ட விளக்கங்கள் உள்ளன. குறிப்பிட்ட ஒரு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பது, மூல உரை திறந்துவைத்துள்ள கதைசார் மற்றும் இறையியல் பதற்றத்தைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மற்ற சீடரும்’ என்பதிலுள்ள ‘-உம்’ καί என்பதன் ‘அவரும்’ என்ற சேர்க்கை நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் குறிப்பிடப்படாத நம்பிக்கையின் பொருள் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
