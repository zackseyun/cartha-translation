- from: 'அவள் வெண்ணிற ஆடைகளை அணிந்து[a] அமர்ந்திருந்த இரண்டு தேவதூதர்களைக் காண்கிறாள்: இயேசுவின் உடல் கிடந்திருந்த[b] இடத்தில், ஒருவர் தலைமாட்டிலும் மற்றவர் கால்மாட்டிலும் அமர்ந்திருந்தார்கள்.'
  to: அவள் வெண்ணிற ஆடை அணிந்த[a] இரண்டு தேவதூதர்கள் அமர்ந்திருப்பதைக் காண்கிறாள்; இயேசுவின் உடல் கிடந்திருந்த[b] இடத்தில் ஒருவர் தலைப்பக்கத்திலும் மற்றொருவர் கால்பக்கத்திலும் இருந்தனர்.
