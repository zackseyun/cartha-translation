  source_fidelity: 'கருத்து முழுவதும் கிரேக்க மூலத்துக்கு இணங்குகிறது: மரியா காண்கிறாள், வெண்ணிற உடையிலுள்ள இரு தேவதூதர்கள் அமர்ந்துள்ளனர்; ஒருவர் தலைப்புறமும் ஒருவர் கால்ப்புறமும் உள்ளனர். ஆனால் நடப்பு வாக்கியத்தில் «அமர்ந்திருந்த» இரண்டு முறை வருவதாலும், இறுதி பன்மை வினை வடிவத்தாலும் காட்சி அமைப்பு இயல்பாக வெளிப்படவில்லை.'
