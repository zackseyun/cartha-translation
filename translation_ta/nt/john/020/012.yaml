  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: ta
  text: அவள் வெண்ணிற ஆடை அணிந்த[a] இரண்டு தேவதூதர்கள் அமர்ந்திருப்பதைக் காண்கிறாள்; இயேசுவின் உடல் கிடந்திருந்த[b] இடத்தில் ஒருவர் தலைப்பக்கத்திலும் மற்றொருவர் கால்பக்கத்திலும் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெண்ணிறத்தில்” அல்லது “வெண்ணிற உடையில்.” கிரேக்கத்தில் சொற்சொல்லாக “வெள்ளையில்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இயேசுவின் உடல் கிடந்த இடத்தில்.” கிரேக்க இறந்தகால வடிவத்தை இவ்வாறு எளிமையாகவும் மொழிபெயர்க்கலாம்; “கிடந்திருந்த” என்பது அந்த உடல் அங்கே முன்பு இருந்த நிலையைச் சூழலுக்கேற்பத் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: காண்கிறாள்
  rationale: நிகழ்கால வடிவத்தின் காட்சித் தெளிவைப் பேணுகிறது. முந்தைய சூழலிலிருந்து எழுவாய் மகதலேனா மரியா என்பதால், தமிழில் இயல்பாகப் பெண்பால் ஒருமை பயன்படுத்தப்பட்டது.
- source_word: ἀγγέλους
  choice: தேவதூதர்களை
  rationale: வெறுமையான கல்லறை மற்றும் வெண்ணிற ஆடை குறித்த சூழல், பொதுவான தூதர்களை அல்லாமல் விண்ணுலகத் தூதர்களையே குறிக்கிறது.
- source_word: ἐν λευκοῖς
  choice: வெண்ணிற ஆடைகளை அணிந்து
  rationale: கிரேக்கத்தில் சொற்சொல்லாக ‘வெள்ளையில்’ என்று இருந்தாலும், ஆடையைக் குறிக்கும் பொருளை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: καθεζομένους
  choice: அமர்ந்திருந்த
  rationale: தேவதூதர்களின் உடல் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத இடச்சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: ஒருவர் தலைமாட்டிலும் மற்றவர் கால்மாட்டிலும்
  rationale: உடல் வைக்கப்பட்டிருந்த இடத்தின் தலைப்புறத்தையும் கால்ப்புறத்தையும் குறிக்கும் கிரேக்க அமைப்பைத் தெளிவான தமிழ் வழக்கில் தருகிறது.
- source_word: ἔκειτο
  choice: கிடந்திருந்த
  rationale: முன்பு தொடர்ந்திருந்த நிலையைக் குறிக்கும் கிரேக்க இறந்தகால வடிவத்தின் சூழல்சார் காலத் தன்மையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: இயேசுவின் உடல்
  rationale: மரியாதையானதும் நேரடியானதும் நவீனத் தமிழில் இயல்பானதுமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: உயிர்த்தெழுதல் நிகழ்வின் சூழலில் ἀγγέλους என்பதன் இயல்பு
  choice: விண்ணுலகத் தூதர்களைக் குறிக்கும் ‘தேவதூதர்கள்’
  alternative: செய்தியைக் கொண்டுவரும் பொதுவான ‘தூதர்கள்’
  rationale: வெறுமையான கல்லறை, வெண்ணிற ஆடை ஆகிய உடனடிச் சூழல் விண்ணுலக உயிர்களைக் குறிக்கிறது; இது சூழல்சார் சொற்பொருள் முடிவு மட்டுமே.
- issue: ἔκειτο என்பதன் காலத் தன்மை
  choice: முன்பு உடல் அங்கே இருந்த நிலையை ‘கிடந்திருந்த’ என்று வெளிப்படுத்துதல்
  alternative: எளிய இறந்தகாலமாக ‘கிடந்த’
  rationale: மரியா காணும் நேரத்திற்கு முன்பாக இயேசுவின் உடல் அங்கே இருந்தது என்பதைக் கிரேக்க உரையின் குறைநிறை இறந்தகாலமும் கதையின் சூழலும் உணர்த்துகின்றன; மாற்று வாசிப்பும் அடிக்குறிப்பில் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘தலைமாட்டில்/கால்மாட்டில்’ என்பது உடல் வைக்கப்பட்டிருந்த இடத்தின் இரு முனைகளையும் சாதாரண வாசகர்களுக்குத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வழக்கு. கிரேக்க மூலத்தில் இல்லாத ‘அங்கே’ போன்ற சொல்லைச் சேர்க்காமல், காட்சியின் அமைப்பு பேணப்பட்டுள்ளது.
