id: JHN.20.1
reference: John 20:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: ta
  text: வாரத்தின் முதல் நாளில்[a], இன்னும் இருட்டாக இருந்தபோதே மகதலேனா மரியா அதிகாலையில் கல்லறைக்கு வருகிறார்; கல்லறையிலிருந்து கல் அகற்றப்பட்டிருப்பதைக் காண்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “ஓய்வுநாட்களில் ஒன்றில்”; இது “வாரத்தின் முதல் நாளில்” என்பதைக் குறிக்கும் ஒரு வழக்குச் சொற்றொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: வாரத்தின் முதல் நாளில்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘ஓய்வுநாட்களில் ஒன்றில்’ என இருந்தாலும், கொய்னே கிரேக்க வழக்கில் இது வாரத்தின் முதல் நாளைக் குறிக்கிறது. δέ-யைத் தனியாக ‘இப்போது’ என்று மொழிபெயர்க்காமல் இயல்பான தமிழ் தொடரில் விடப்பட்டுள்ளது.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: மகதலேனா மரியா
  rationale: பெயரையும் ஊரடையாளத்தையும் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, விவரிப்பின் உடனடித் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρωῒ
  choice: அதிகாலையில்
  rationale: நாளின் முற்பகுதியைக் குறிக்கிறது; அடுத்துள்ள ‘இன்னும் இருட்டாக இருந்தபோதே’ என்பது நேரத்தை மேலும் தெளிவுபடுத்துவதால் ‘விடியற்காலையில்’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: σκοτίας ἔτι οὔσης
  choice: இன்னும் இருட்டாக இருந்தபோதே
  rationale: தொடர்ந்து நிலவிய காலச் சூழலை இயல்பான தமிழ் காலவாக்கியமாக அளிக்கிறது.
- source_word: εἰς τὸ μνημεῖον
  choice: கல்லறைக்கு
  rationale: இச்சூழலில் μνημεῖον அடக்கம் செய்யப்பட்ட கல்லறையைக் குறிக்கிறது; நவீன தமிழில் தெளிவான இயல்பான சொல்.
- source_word: βλέπει
  choice: காண்கிறார்
  rationale: வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, கிரேக்க விவரிப்பின் உடனடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: τὸν λίθον ἠρμένον
  choice: கல் அகற்றப்பட்டிருப்பதை
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவு நிலையும் கொண்ட perfect passive participle-ஐ ‘அகற்றப்பட்டிருப்பதை’ என்பது நன்கு வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ μνημείου
  choice: கல்லறையிலிருந்து
  rationale: ἐκ குறிக்கும் கல்லறையிலிருந்து விலகிய நிலையை நேரடியாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வாசல்’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் நிகழ்வின் விவரிப்பில் வரலாற்று நிகழ்காலம்
  choice: ‘வருகிறார்’, ‘காண்கிறார்’ என நிகழ்காலத்தைத் தக்கவைத்தல்
  alternative: தமிழில் வழக்கமான இறந்தகாலமாக ‘வந்தார்’, ‘கண்டார்’ என மாற்றுதல்
  rationale: ἔρχεται, βλέπει ஆகிய நிகழ்கால வடிவங்கள் கிரேக்கக் கதையாடலின் உயிரோட்டமுள்ள வரலாற்று நிகழ்காலங்கள். அவற்றைத் தமிழிலும் தெளிவாகத் தக்கவைக்க முடிவதால், இறந்தகாலமாகச் சமப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலமும், அகற்றப்பட்ட கல்லின் விளைவு நிலையும் பாதுகாக்கப்பட்டுள்ளன.
