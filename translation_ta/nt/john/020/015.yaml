id: JHN.20.15
reference: John 20:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: ta
  text: இயேசு அவளிடம், “பெண்ணே, ஏன் அழுகிறாய்? யாரைத் தேடுகிறாய்?” என்றார். அவரைத் தோட்டக்காரர் என்று நினைத்த அவள் அவரிடம், “ஐயா,[a] நீர்தான் அவரை எடுத்துச் சென்றிருந்தால், அவரை எங்கே வைத்தீர் என்று எனக்குச் சொல்லும்; நான் அவரை எடுத்துச் செல்வேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கில்: “ஆண்டவரே” (κύριε). மரியாள் தோட்டக்காரரிடம் பேசுவதாக நினைப்பதால், இங்கு இது மரியாதையான “ஐயா” என்ற பொருளில் பயன்படுத்தப்பட்டிருக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: பெண்ணே
  rationale: மரியாதையுடனான நேரடி விளிப்பை இயல்பான தமிழில் தருகிறது; இழிவான அழைப்பு அல்ல, மேலும் மூலத்தின் நேரடித்தன்மையைப் பேணுகிறது.
- source_word: τί κλαίεις
  choice: ஏன் அழுகிறாய்
  rationale: τί இங்கு காரணத்தைக் கேட்கும் ‘ஏன்’ என்ற பொருளில் வருகிறது; κλαίω என்பதற்கு இயல்பான நவீனத் தமிழ் ‘அழு’.
- source_word: τίνα ζητεῖς
  choice: யாரைத் தேடுகிறாய்
  rationale: தனிநபரைக் குறிக்கும் τίνα என்ற நேரடி செயப்படுபொருளையும் ζητέωவின் ‘தேடு’ என்ற பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: δοκοῦσα
  choice: என்று நினைத்த
  rationale: மரியாளின் தவறான எண்ணத்தை மிகைப்படுத்தாமல் இயல்பான கதைநடைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ κηπουρός
  choice: தோட்டக்காரர்
  rationale: κηπουρός என்பதன் நேரான பொருள்; சூழலுக்கு ஏற்ற மரியாதைப் பன்மையுடன் வழங்கப்பட்டுள்ளது.
- source_word: Κύριε
  choice: ஐயா
  rationale: அவர் தோட்டக்காரர் என்று மரியாள் நினைப்பதால், இங்கு κύριε என்பது கிறிஸ்துவைப் பற்றிய அறிக்கையாக அல்லாமல் மரியாதையான அழைப்பாகப் பயன்படுவது அதிக சாத்தியம்.
- source_word: ἐβάστασας αὐτόν
  choice: அவரை எடுத்துச் சென்றிருந்தால்
  rationale: உடலை ஓரிடத்திலிருந்து எடுத்துச் சென்ற செயலை இயல்பாகத் தெரிவிக்கிறது; βαστάζωவின் சுமந்து/எடுத்துச் செல்லும் பொருளைச் சூழலுக்கேற்ப தருகிறது.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: அவரை எங்கே வைத்தீர்
  rationale: τίθημι என்பதன் ‘வை/இடு’ பொருளை நவீனத் தமிழில் நேரடியாகவும் மரியாதை நடையிலும் தருகிறது.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: நான் அவரை எடுத்துச் செல்வேன்
  rationale: αἴρωவின் எடுத்தல் அல்லது அகற்றுதல் என்ற பொருளையும் எதிர்கால வினையையும் இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவை இன்னும் அடையாளம் காணாத மரியாள் பயன்படுத்தும் κύριε என்பதன் மொழிபெயர்ப்பு
  choice: ஐயா
  alternative: ஆண்டவரே
  rationale: மரியாள் பேசுபவரைத் தோட்டக்காரர் என்று கருதுகிறாள். எனவே மரியாதையான விளிப்பான ‘ஐயா’ என்பதே சூழலுக்கு அதிகம் பொருந்துகிறது; இருந்தாலும் கிரேக்கச் சொல் பொதுவாக ‘ஆண்டவர்’ என்றும் மொழிபெயர்க்கப்படுவதால் அந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசு மரியாளை ஒருமையில் அழைப்பதும், மரியாள் தோட்டக்காரர் என நினைக்கும் நபரிடம் மரியாதைப் பன்மையில் பேசுவதும் தமிழின் இயல்பான சமூக நடைக்கேற்ப வேறுபடுத்தப்பட்டுள்ளது.
