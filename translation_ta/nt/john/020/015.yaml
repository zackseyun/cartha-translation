review_pass:
  verdict: revise
  source_fidelity: The translation accurately conveys the two questions, Mary's mistaken identification of Jesus as the gardener, the conditional request, and her future intention to remove the body. ‘ஐயா’ is contextually appropriate for Κύριε, with the lexical alternative retained in a footnote. However, ‘என்று கேட்டார்’ renders Jesus as ‘asked,’ whereas λέγει is simply ‘says’; ‘என்றார்’ preserves the source's speech attribution without adding that verbal nuance.
  naturalness: The revised wording is clear, dignified, and natural in modern standard Tamil. The singular address to Mary and the respectful plural forms in Mary's address remain idiomatic. The footnote is adjusted to avoid the slightly awkward and unnecessary ‘மரியாள் தாம்.’
  terminology: ‘பெண்ணே,’ ‘தோட்டக்காரர்,’ and ‘ஐயா’ are suitable choices. The footnote properly preserves ‘ஆண்டவரே’ as the literal/common lexical rendering of κύριε while explaining why the contextual rendering is ‘ஐயா.’
  issues:
  - severity: low
    issue: ‘என்று கேட்டார்’ adds the sense ‘asked’ for λέγει.
    rationale: Although the quoted words are questions, the Greek narration uses λέγει (‘says’), not ἐρωτᾷ (‘asks’). ‘என்றார்’ is both natural Tamil narration and closer to the source.
  - severity: low
    issue: The footnote’s ‘மரியாள் தாம்’ is stylistically awkward in this explanatory prose.
    rationale: The point is simply that Mary thinks she is addressing the gardener. ‘மரியாள் தோட்டக்காரரிடம் பேசுவதாக நினைப்பதால்’ states this naturally without an unnecessary honorific/emphatic pronoun.
