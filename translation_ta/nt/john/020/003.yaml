  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: ta
  text: எனவே பேதுருவும் மற்ற சீடரும் வெளியே புறப்பட்டு, கல்லறையை நோக்கிச் சென்றுகொண்டிருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறைக்குச் சென்றார்கள்.’ கிரேக்க மொழியிலுள்ள இறந்தகாலத் தொடர்வினையை இவ்வாறு எளிமையாகவும் மொழிபெயர்க்கலாம்; ‘சென்றுகொண்டிருந்தார்கள்’ என்பது செயல் தொடர்ந்து நடந்துகொண்டிருந்ததை இன்னும் வெளிப்படையாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: வெளியே புறப்பட்டு
  rationale: ἐξέρχομαι இங்கு ஓர் இடத்திலிருந்து வெளியேறுவதைச் சுட்டுகிறது. தமிழில் தொடர்ச்சியான இரு செயல்களை இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய வசனத்தில் மரியாள் அறிவித்த செய்தியின் விளைவாக இச்செயல் நிகழ்ந்ததைச் சுட்டும் கதைத் தொடர்பை இது காக்கிறது.
- source_word: ὁ Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ὁ ἄλλος μαθητής
  choice: மற்ற சீடர்
  rationale: முன்னரே குறிப்பிடப்பட்ட, பேதுருவிலிருந்து வேறுபட்ட சீடரைக் குறிக்கிறது; μαθητής என்பதற்கு நற்செய்தி நூல்களின் சூழலில் ‘சீடர்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: ἤρχοντο
  choice: சென்றுகொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடைபெற்ற பயணத்தை கிரேக்க imperfect வடிவம் காட்டுவதால், அதன் நிகழ்நிலைத் தொடர்ச்சியை இவ்வடிவம் வெளிப்படையாகக் காக்கிறது.
- source_word: εἰς τὸ μνημεῖον
  choice: கல்லறையை நோக்கி
  rationale: இங்கு இயேசு அடக்கம் செய்யப்பட்ட கல்லறையே μνημεῖον. εἰς இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது; அவர்கள் அப்போதே கல்லறைக்குள் நுழைந்ததாகக் கூறாமல் இருப்பதற்காக ‘நோக்கி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
