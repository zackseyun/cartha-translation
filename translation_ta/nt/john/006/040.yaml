source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: ta
  text: ஏனெனில், மகனைக் கண்டு[a] அவர்மீது நம்பிக்கை வைக்கும் ஒவ்வொருவரும் நித்திய வாழ்வைப் பெறுவதும், கடைசி நாளில் நானே[b] அவரை உயிர்த்தெழச் செய்வதும் என் தந்தையின் விருப்பம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகனை உற்றுநோக்குகிற.” இங்கு பயன்படுத்தப்பட்டுள்ள வினைச்சொல் வெறுமனே கண்ணால் பார்ப்பதை மட்டுமல்லாமல், கவனமாகப் பார்ப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் அவரை உயிர்த்தெழச் செய்வேன்.” கிரேக்கத்தில் “நான்” என்பது வெளிப்படையாகச் சேர்க்கப்பட்டு வலியுறுத்தப்பட்டுள்ளது; அதனால் முதன்மை உரையில் “நானே” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: ஏனெனில் ... என்பதே
  rationale: γάρ முந்தைய கூற்றை விளக்கும் இணைப்பாக இருப்பதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது; தமிழ் வாக்கியத்தின் இயல்புக்காக τοῦτο ἐστιν என்பது ‘என்பதே’ என்ற அமைப்பில் தரப்பட்டுள்ளது.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: என் தந்தையின் விருப்பம்
  rationale: θέλημα என்பது இங்கு ஒருவரின் சித்தம் அல்லது விருப்பத்தைக் குறிக்கிறது. பொதுவான நவீன தமிழில் தெளிவாக இருக்க ‘விருப்பம்’ பயன்படுத்தப்பட்டுள்ளது; ‘என் தந்தை’ என்ற உறவுமுறையும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: மகனைக் காண்கிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புச் சொற்றொடரின் பொதுவான பொருளை ‘ஒவ்வொருவரும்’ பாதுகாக்கிறது. θεωρέω வெறும் உடல் பார்வையைவிட கவனித்துக் காணும் நுணுக்கத்தையும் கொண்டிருக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: மற்றும் அவர்மீது நம்பிக்கை வைக்கிற
  rationale: πιστεύω εἰς என்பது ஒருவரை நோக்கிய தனிப்பட்ட நம்பிக்கையை வெளிப்படுத்துகிறது. ‘அவர்மீது நம்பிக்கை வைக்கிற’ என்பது அதனை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: நித்திய வாழ்வைப் பெற வேண்டும்
  rationale: ἵνα உடன் வரும் நிகழ்கால subjunctive வடிவத்தை, தந்தையின் விருப்பத்தின் உள்ளடக்கமாகத் தமிழில் இயல்பாகக் காட்ட ‘பெற வேண்டும்’ என வழங்கப்பட்டுள்ளது. ζωὴ αἰώνιος என்பதற்கான பரவலாக அறியப்பட்ட, இறையியல் நுணுக்கத்தைக் காக்கும் சொற்றொடராக ‘நித்திய வாழ்வு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: நானே அவரை உயிர்த்தெழச் செய்வேன்
  rationale: ἐγώ வெளிப்படையாகச் சேர்க்கப்பட்டிருப்பதால் அதன் வலியுறுத்தல் ‘நானே’ என்பதில் பாதுகாக்கப்படுகிறது. ἀναστήσω இங்கு இறுதி நாளில் இறந்தவரை எழுப்புவதைக் குறிப்பதால் ‘உயிர்த்தெழச் செய்வேன்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: கடைசி நாளில்
  rationale: காலத்தைக் குறிக்கும் dative சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம் இது.
theological_decisions:
- issue: πᾶς ὁ θεωρῶν ... καὶ πιστεύων என்பதன் பரப்பும் நிபந்தனையும்
  choice: மகனைக் காண்கிற மற்றும் அவர்மீது நம்பிக்கை வைக்கிற ஒவ்வொருவரும் நித்திய வாழ்வைப் பெற வேண்டும்
  alternative: மகனை நோக்கிப் பார்த்து அவர்மீது நம்பிக்கை வைக்கும் எவரும் நித்திய வாழ்வைப் பெறுவார்
  rationale: மூலத்தின் பொதுவான பங்கேற்புச் சொற்றொடரும் ἵνα + subjunctive அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. தெரிந்துகொள்ளுதல், தேர்ந்தெடுக்கப்படுதல், மனித சுதந்திரம் போன்ற எந்தக் கோட்பாட்டு அமைப்பும் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: ἐγώ என்பதன் வலியுறுத்தல்
  choice: நானே அவரை உயிர்த்தெழச் செய்வேன்
  alternative: நான் அவரை உயிர்த்தெழச் செய்வேன்
  rationale: இயேசுவின் தனிப்பட்ட செயற்பாட்டை மூல கிரேக்கம் வெளிப்படையாக வலியுறுத்துகிறது. ‘நானே’ அந்த வலியுறுத்தலைக் காக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்து எதையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. வழக்கில் குறைவாகப் புரியக்கூடிய ‘சித்தம்’, ‘விசுவாசம்’ போன்ற சமயப் பதிவுச் சொற்களுக்கு பதிலாக ‘விருப்பம்’, ‘நம்பிக்கை வைக்கிற’ என்பவை பயன்படுத்தப்பட்டுள்ளன; அதே நேரத்தில் ‘மகன்’, ‘நித்திய வாழ்வு’, ‘உயிர்த்தெழச் செய்வேன்’ ஆகிய யோவான் நற்செய்தியின் முக்கிய இறையியல் சொற்கள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
