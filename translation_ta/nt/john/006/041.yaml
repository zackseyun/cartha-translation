id: JHN.6.41
reference: John 6:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: ta
  text: ஆகவே, “வானத்திலிருந்து இறங்கி வந்த அப்பம் நானே” என்று அவர் சொன்னதால், யூதர்கள்[a] அவரைக் குறித்து முணுமுணுத்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதேயர்கள்” என்றும், சில சூழல்களில் “யூதத் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம். யோவான் பயன்படுத்தும் “யூதர்கள்” என்ற சொற்றொடர், யூத மக்கள் அனைவரையும் அல்லாமல், இயேசுவை எதிர்த்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: முணுமுணுத்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வடிவையும், அதிருப்தியுடன் மெல்லக் குறைகூறும் γογγύζω என்பதன் நயத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் கதைசார் மற்றும் காரணத் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; இவ்வசனம் தலைவர்களை மட்டும் என்று வெளிப்படையாக வரையறுக்காததால் அதை முதன்மை உரையில் குறுக்கவில்லை. யோவானின் சூழலில் இது எல்லா யூத மக்களையும் அல்ல, இயேசுவை எதிர்த்த ஒரு குறிப்பிட்ட குழுவைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: περὶ αὐτοῦ
  choice: அவரைக் குறித்து
  rationale: περί + genitive என்பதன் இயல்பான பொருளான ‘அவரைப் பற்றி/அவரைக் குறித்து’ என்பதைத் தருகிறது; ‘அவருக்கு எதிராக’ என்று பகைமையை மிகைப்படுத்தவில்லை.
- source_word: ὅτι εἶπεν
  choice: என்று அவர் சொன்னதால்
  rationale: ὅτι இங்கு முணுமுணுப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழ் வாக்கிய அமைப்பில் மேற்கோளைத் தொடர்ந்து ‘சொன்னதால்’ என்பது காரண உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வலியுறுத்தப்பட்ட Ἐγώ என்பதையும் copular அடையாளப்படுத்தலையும் இயல்பான தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὁ ἄρτος
  choice: அப்பம்
  rationale: வேதாகமச் சூழலில் பரவலாகவும் புரிந்துகொள்ளத்தக்கவாறும் உள்ள சொல்; இயேசுவை குறிப்பிட்ட ‘அப்பம்’ என அடையாளப்படுத்தும் கட்டமைப்பு முழு மேற்கோளால் தெளிவாகிறது.
- source_word: ὁ καταβὰς
  choice: இறங்கி வந்த
  rationale: அப்பத்தை விவரிக்கும் articular aorist participle-ஐ இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்கி, நிகழ்ந்த இறக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: தோற்றுவாயைச் சுட்டும் ἐκ + genitive கட்டமைப்புக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: யோவான் நூலில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘யூதர்கள்’
  alternative: ‘யூதேயர்கள்’ அல்லது சில சூழல்களில் ‘யூதத் தலைவர்கள்’
  rationale: இந்த வசனம் குறிப்பிட்ட குழுவைத் தலைவர்கள் என வெளிப்படையாகக் குறுக்காததால் மூலத்தின் பொதுவான சொல்லாக்கம் பாதுகாக்கப்படுகிறது. அதேவேளை, இதை யூத மக்கள் அனைவரையும் பற்றிய பொதுப்படுத்தலாகப் புரிந்துகொள்ளக் கூடாது என்பதையும் யோவானின் சூழல்சார் பயன்பாட்டையும் அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. தொடர்ச்சியான முணுமுணுப்பை ‘முணுமுணுத்துக்கொண்டிருந்தார்கள்’ என்றும், வலியுறுத்தப்பட்ட Ἐγώ εἰμι என்பதை இயல்பான ‘நானே’ என்றும் வழங்குகிறது.
