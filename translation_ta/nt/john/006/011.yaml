reference: John 6:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: ta
  text: ஆகவே இயேசு அப்பங்களை எடுத்து, நன்றி செலுத்திய பின்பு, உணவுக்காகச் சாய்ந்திருந்தவர்களுக்கு[a] அவற்றைப் பகிர்ந்தளித்தார். அதேபோல், மீன்களிலிருந்தும்[b] அவரவர் விரும்பிய அளவுக்குப் பகிர்ந்தளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமர்ந்திருந்தவர்களுக்கு.’ உணவின்போது வழக்கமாக இருந்த உடல்நிலையைக் குறிக்கும் கிரேக்கச் சொல், சொல்லுக்குச் சொல் ‘சாய்ந்திருந்தவர்களுக்கு’ எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சிறிய மீன்களிலிருந்தும்.’ இந்தக் கிரேக்கச் சொல் அப்பத்துடன் உண்ணப்பட்ட மீன்களை, ஒருவேளை சிறிய மீன்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: இது முன் நிகழ்ந்தவற்றிலிருந்து தொடரும் கதைநடைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοὺς ἄρτους
  choice: அப்பங்களை
  rationale: பன்மையில் உள்ள ἄρτους, இந்தச் சூழலில் தனித்தனி அப்பங்களைக் குறிக்கிறது; ‘அப்பங்களை’ என்பது தெளிவான, வழக்கமான தமிழ்.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்திய பின்பு
  rationale: முதன்மை வினைக்கு முன் நிறைவேறிய செயலைத் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் சொல்லப்படாத ‘கடவுளுக்கு’ என்ற செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: διέδωκεν
  choice: பகிர்ந்தளித்தார்
  rationale: கூட்டத்தினரிடையே வழங்குதல் என்ற διαδίδωμι வினையின் பகிர்வு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: τοῖς ἀνακειμένοις
  choice: உணவுக்காகச் சாய்ந்திருந்தவர்களுக்கு
  rationale: ἀνάκειμαι என்பது உணவு உண்ணும் வழக்கமான நிலையில் சாய்ந்திருப்பதைக் குறிக்கிறது; தமிழில் சூழலைத் தெளிவாக்க ‘உணவுக்காக’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὁμοίως καὶ
  choice: அதேபோல் ... -யும்
  rationale: அப்பங்களுக்கும் மீன்களுக்கும் இடையிலான இணையான செயலைத் தமிழின் இயல்பான தொடரமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν ὀψαρίων
  choice: மீன்களையும்
  rationale: ὀψάριον சிறிய மீனையோ அப்பத்துடன் உண்ணும் மீனையோ குறிக்கலாம்; முதன்மை உரையில் அளவைத் தேவையின்றி குறிப்பாக்காமல் ‘மீன்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὅσον ἤθελον
  choice: அவரவர் விரும்பிய அளவுக்கு
  rationale: ஒவ்வொருவரும் விரும்பிய அளவு பெற்றனர் என்ற கட்டுப்பாடற்ற அளவுப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: உணவளிப்பு நிகழ்வில் εὐχαριστήσας என்பதன் சாத்தியமான நற்கருணைத் தொடர்பு
  choice: ‘நன்றி செலுத்திய’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘ஆசீர்வதித்தார்’ என மொழிபெயர்த்தல் அல்லது நற்கருணைப் பொருளை உரையிலேயே வெளிப்படுத்தல்
  rationale: இந்த வினை நேரடியாக ‘நன்றி செலுத்துதல்’ என்று பொருள்படுகிறது. யோவானின் விரிந்த சூழலில் நற்கருணை எதிரொலி இருக்கக்கூடும் என்றாலும், அதை மொழிபெயர்ப்பு உரைக்குள் சேர்ப்பது மூலத்தில் உள்ள திறந்த நிலையைக் குறைக்கும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘சாய்ந்திருந்தவர்கள்’ என்ற வரலாற்று உணவுமுறைச் சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
