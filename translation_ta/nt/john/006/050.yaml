  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: ta
  text: ஒருவர் இதை உண்டு சாகாமல் இருக்கும்படி வானத்திலிருந்து இறங்கி வருகிற அப்பம் இதுவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός
  choice: இதுவே
  rationale: அப்பத்தைச் சுட்டிக்காட்டி அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄρτος
  choice: அப்பம்
  rationale: சொல்லின் நேரடியான பொருளையும் யோவான் 6-இல் உள்ள உருவக வலிமையையும் விளக்கவுரையின்றிப் பாதுகாக்கிறது.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: வானத்திலிருந்து இறங்கி வருகிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது உயிரோட்டமான செயற்பாங்கை இயல்பான தமிழில் காக்கிறது.
- source_word: ἵνα
  choice: இருக்கவே
  rationale: நோக்கத்தையும் விளைவையும் குறிக்கும் கிரேக்கத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τις
  choice: ஒருவர்
  rationale: குறிப்பிடப்படாத எந்த நபருக்கும் பொருந்தும் பொதுவான ஒருமை உணர்வைப் பாதுகாக்கிறது.
- source_word: ἐξ αὐτοῦ φάγῃ
  choice: அதை உண்டு
  rationale: சொல்லுக்குச் சொல் ‘அதிலிருந்து உண்டு’ என்பது தமிழில் இயல்பற்றது; ‘அதை உண்டு’ என்பதே அப்பத்தை உண்பதைக் குறிக்கும் இயல்பான சமமான நடை.
- source_word: μὴ ἀποθάνῃ
  choice: சாகாமல் இருக்க
  rationale: மரணத்தின் தன்மையை விளக்கிச் சுருக்காமல், வினையின் நேரடியான மற்றும் விரிவான பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘சாகாமல்’ என்பதில் குறிக்கப்படும் மரணத்தின் தன்மை
  choice: உடல், ஆன்மீகம் அல்லது இறுதிக்கால அழிவு என்று வரையறுக்காமல் ‘சாகாமல்’ எனவே வைத்தல்
  alternative: ‘ஆன்மீகமாகச் சாகாமல்’ அல்லது ‘நித்தியமாக அழியாமல்’ என்று விளக்குதல்
  rationale: இந்த வசனம் மரணத்தின் தன்மையைத் தானாகக் குறுக்கி வரையறுக்கவில்லை; அதன் யோவானிய இறையியல் ஆழத்தையும் பதற்றத்தையும் திறந்தவாறே வைத்தல் சிறந்தது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘புசித்து’ போன்ற பழைய வழிபாட்டு நடையைத் தவிர்த்து, இயல்பாகவும் மரியாதையாகவும் ஒலிக்கும் ‘உண்டு’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்க நோக்கத் தொடரைத் தமிழில் தெளிவாக்க ‘அது இறங்கி வருகிறது’ என்பது மீண்டும் சொல்லப்பட்டுள்ளது.
