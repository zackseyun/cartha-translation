base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: ta
  text: ஆனால் இயேசு, தம்முடைய சீடர்கள் இதைக் குறித்து முணுமுணுப்பதைத் தமக்குள் அறிந்து, அவர்களிடம், “இது உங்களுக்கு இடறலை உண்டாக்குகிறதா?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது உங்களைத் தடுமாறச் செய்கிறதா?”
    reason: σκανδαλίζει என்பதில் உள்ள ஒருவரை இடறவைத்து நம்பிக்கையில் தடுமாறச் செய்யும் செயற்பாட்டு நுணுக்கத்தை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்து
  rationale: நிகழும் சூழலில் இயேசு அறிந்திருந்ததை இயல்பான தமிழில் வினையெச்சமாகத் தருகிறது.
- source_word: ἐν ἑαυτῷ
  choice: தமக்குள்
  rationale: வெளிப்புறத் தகவலால் அல்லாமல், இயேசு தமக்குள்ளேயே அறிந்தார் என்ற நுணுக்கத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: γογγύζουσιν
  choice: முணுமுணுப்பதை
  rationale: அதிருப்தியுடன் தாழ்ந்த குரலில் குறைகூறுவதைச் சுட்டும் கிரேக்க வினையின் நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περὶ τούτου
  choice: இதைக் குறித்து
  rationale: முந்தைய உரையைச் சுட்டும் சொற்றொடரை விளக்கச் சொல் சேர்க்காமல் தெளிவாகத் தருகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: தம்முடைய சீடர்கள்
  rationale: இயேசுவைக் குறிக்கும் மரியாதைத் தற்சுட்டுப் பெயருடன், பன்னிருவரை மட்டும் அல்லாத விரிந்த சீடர் குழுவையும் உரை கூறியபடியே வைக்கிறது.
- source_word: Τοῦτο
  choice: இது
  rationale: கிரேக்கத்தின் சுருக்கமான சுட்டுப்பெயரை, ‘போதனை’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: σκανδαλίζει
  choice: இடறலாக இருக்கிறதா
  rationale: மனவருத்தம் அல்லது எதிர்ப்பை மட்டும் அல்லாமல், நம்பிக்கையில் தடுமாறச் செய்யும் உருவக நுணுக்கத்தையும் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் உரையை நிராகரிக்கத் தூண்டும் சூழலில் σκανδαλίζει என்பதன் பொருள்
  choice: இது உங்களுக்கு இடறலாக இருக்கிறதா?
  alternative: இது உங்களைத் தடுமாறச் செய்கிறதா?
  rationale: கிரேக்கச் சொல் மனத்தில் புண்படுதல்/எதிர்ப்பு கொள்வதையும், நம்பிக்கையில் தடுமாறி விலகுவதையும் குறிக்கலாம். ‘இடறல்’ என்ற உருவகத்தை முதன்மை உரையில் வைத்ததால் இந்த இறையியல் அழுத்தம் தீர்த்துவிடப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முணுமுணுப்பு’ பொதுவாசகர்களுக்குப் புரியக்கூடியதாகவும் மூலத்தின் அதிருப்தி நுணுக்கத்தைப் பாதுகாப்பதாகவும் உள்ளது; ‘இடறல்’ வேதாகம உருவகத்தை கண்ணியமான நடையில் தக்கவைக்கிறது.
