id: JHN.6.32
reference: John 6:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: ta
  text: 'ஆகவே இயேசு அவர்களிடம் கூறினார்: “உறுதியாக, உறுதியாக உங்களுக்குச் சொல்கிறேன்: வானத்திலிருந்து அப்பத்தை உங்களுக்குக் கொடுத்தவர் மோசே அல்ல[a]; என் தந்தையே வானத்திலிருந்து உண்மையான[b] அப்பத்தை உங்களுக்குக் கொடுக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோசே உங்களுக்கு வானத்திலிருந்து அப்பத்தைக் கொடுக்கவில்லை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் மறுப்பு “மோசே” என்பதற்கு முன் வருவதால், கொடுத்தவர் யார் என்ற எதிர்மறை ஒப்பீடு சிறப்பாக வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “உண்மையான” என்பது “மெய்யான” அல்லது “உண்மையில் உள்ள” என்றும் பொருள்படலாம். இது முந்தைய மன்னாவுடன் ஒப்பிடுகையில், வானத்திலிருந்து வரும் அப்பத்தின் தனித்தன்மையைச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து தொடரும் முடிவுறுத்தல் அல்லது தொடர்பைக் காட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: யோவான் நற்செய்தியில் வரும் இரட்டிப்பு கொண்ட வலியுறுத்தும் அறிவிப்பைத் தமிழிலும் இரட்டிப்பைத் தக்கவைத்துப் பதிவு செய்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: மூலத்தின் நேரடியான பொருளையும் அறிவிப்பின் கம்பீரமான தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: மோசே உங்களுக்கு ... கொடுக்கவில்லை
  rationale: மோசே அல்ல என்பதில் உள்ள செய்பவர் சார்ந்த முரண்பாட்டை அடிக்குறிப்பில் வெளிப்படுத்தியபடி, முதன்மை உரையில் இயல்பான தமிழ்ச் சொற்றொடரைப் பயன்படுத்துகிறது.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து வந்த அப்பம்
  rationale: ἐκ என்பதன் மூலத்தைக் குறிக்கும் பொருளையும் அப்பத்தின் வானகத் தோற்றத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: என் தந்தையே ... உங்களுக்குக் கொடுக்கிறார்
  rationale: நிகழ்கால δίδωσιν-ஐ நிகழ்காலமாகக் காத்து, மோசேயுடன் உள்ள செய்பவர் சார்ந்த முரண்பாட்டை ‘-ஏ’ வலியுறுத்துகிறது.
- source_word: τὸν ἀληθινόν
  choice: உண்மையான
  rationale: ἀληθινός என்பதில் உள்ள மெய்யான, அசலான, நிறைவான என்ற யோவானியப் பொருள் வளத்தை ஒரே விளக்கமாகக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: மோசேயின் கொடுத்தலுக்கும் தந்தையின் கொடுத்தலுக்கும் இடையிலான கால மற்றும் செய்பவர் வேறுபாடு
  choice: ‘கொடுக்கவில்லை ... கொடுக்கிறார்’ என்று இறந்தகாலம்–நிகழ்கால வேறுபாட்டையும், ‘என் தந்தையே’ என்று செய்பவர் சார்ந்த எதிர்மறை ஒப்பீட்டையும் காத்தல்
  alternative: ‘மோசே கொடுக்கவில்லை; என் தந்தை கொடுக்கிறார்’ என்று வலியுறுத்தும் ‘-ஏ’ இன்றி மொழிபெயர்த்தல்
  rationale: δέδωκεν மற்றும் δίδωσιν இடையிலான காலநிலை வேறுபாட்டைத் தமிழில் தெளிவாகக் காட்டுகிறது; அதேவேளையில் οὐ Μωϋσῆς ... ἀλλ’ ὁ πατήρ μου என்ற செய்பவர் சார்ந்த எதிர்மறை ஒப்பீட்டையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- issue: ‘உண்மையான அப்பம்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உண்மையான அப்பம்’ என்பதை வைத்திருத்தல்
  alternative: ‘மெய்யான அப்பம்’, ‘நிஜமான அப்பம்’ அல்லது ‘நிறைவான அப்பம்’
  rationale: யோவானில் ἀληθινός முந்தைய அடையாளத்துடன் ஒப்பிடப்படும் இறுதியான அல்லது அசலான நிஜத்தைக் குறிக்கக்கூடும்; ‘உண்மையான’ என்பது அந்த இறையியல் அழுத்தத்தை விளக்கவுரையால் முன்கூட்டியே தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், இயேசுவின் அறிவிப்புக்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது. ‘அப்பம்’, ‘வானம்’, ‘என் தந்தை’ ஆகிய பழக்கமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
