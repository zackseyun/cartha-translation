source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ta
  text: அவர்கள், “இவர் யோசேப்பின் மகன் இயேசு அல்லவா? இவருடைய தந்தையையும் தாயையும் நமக்குத் தெரியுமே! அப்படியிருக்க, ‘நான் வானத்திலிருந்து இறங்கி வந்தேன்’ என்று இப்போது இவர் எப்படிச் சொல்கிறார்?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத் தொடர்வினையான imperfect வடிவம், அவர்கள் தொடர்ந்து அல்லது திரும்பத் திரும்பப் பேசியதை உணர்த்துகிறது.
- source_word: Οὐχ οὗτός ἐστιν
  choice: இவர் ... அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: யோசேப்பின் மகன்
  rationale: மூலத்தின் உறவுமுறை அமைப்பைத் தெளிவாகக் காட்டி, இயேசுவின் அறியப்பட்ட மனிதக் குடும்பப் பின்னணியின்மீது பேசுவோர் வைக்கும் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: இவருடைய தந்தையையும் தாயையும் நமக்குத் தெரியுமே
  rationale: ἡμεῖς என்பதிலுள்ள ‘நாம்’ என்ற வலியுறுத்தலையும், அவர்கள் உரிமைகோரும் குடும்ப அறிமுகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πῶς νῦν λέγει
  choice: இப்போது இவர் எப்படிச் சொல்கிறார்?
  rationale: πῶς என்பதன் அடிப்படைப் பொருளான ‘எப்படி’ என்பதையும், λέγει என்பதன் நிகழ்காலத்தையும் காக்கிறது; ‘எப்படிச் சொல்ல முடியும்?’ என்ற கூடுதல் இயலாமை நுணுக்கத்தைப் புகுத்தவில்லை.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: தோற்றுவாய் அல்லது புறப்படும் இடத்தைக் குறிக்கும் ἐκ + genitive அமைப்பை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: καταβέβηκα
  choice: இறங்கி வந்தேன்
  rationale: முடிவுற்ற இறங்குதலைத் தற்போதைய உரிமைக்கூற்றுடன் இணைக்கும் perfect வடிவத்தை இயல்பான தமிழில் தருகிறது; ‘இறங்கினேன்’ என்பதைக் காட்டிலும் இயக்கத்தின் முழுமையைத் தெளிவாக உணர்த்துகிறது.
theological_decisions:
- issue: இயேசு வானத்திலிருந்து வந்ததாகக் கூறுவதற்கு மக்கள் தெரிவிக்கும் எதிர்ப்பு
  choice: “நான் வானத்திலிருந்து இறங்கி வந்தேன்” என்ற நேரடியான கூற்றை அப்படியே வைத்தல்
  alternative: “நான் வானத்திலிருந்து வந்தேன்” அல்லது உருவக விளக்கமாக மென்மைப்படுத்துதல்
  rationale: மக்களின் அதிருப்திக்கு மையமான வானுலகத் தோற்றக் கூற்றை வசனம் நேரடியாக முன்வைக்கிறது. அதன் பொருளை விளக்கித் தீர்மானிக்காமலும் மென்மைப்படுத்தாமலும், மூலத்தில் உள்ள இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைச் சுட்டான ‘இவர்’ பேசுவோரின் அடையாளக் கேள்வியை இயல்பாகக் காட்டுகிறது. ‘அப்படியிருக்க’ என்பது இரண்டு கேள்விகளுக்கிடையிலான எதிர்மறைத் தர்க்கத் தொடர்பை வெளிப்படுத்தும் இயல்பான இணைப்பு; புதிய கருத்தைச் சேர்ப்பதில்லை. பொதுவாசகர்களுக்குப் புரியும் வகையில் மொழிநடை தற்போதையதாகவும், வேதாகம வாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் வைக்கப்பட்டுள்ளது.
