  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: ἔλεγεν என்பதன் தொடர்நிலையை ‘தொடர்ந்து கூறினார்’ தெரிவிக்கிறது; Διὰ τοῦτο, εἴρηκα, οὐδεὶς δύναται, ἐλθεῖν πρός με, மற்றும் ἐκ τοῦ πατρός ஆகியவை பொருளிழப்பின்றி மொழிபெயர்க்கப்பட்டுள்ளன. ‘அது’ என்பது δεδομένον-ன் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத பொருளை விளக்காமல் பாதுகாக்கிறது. ‘தந்தையிடமிருந்து’ என்பது ἐκ-இன் மூல/தோற்ற நுணுக்கத்தை உரியவாறு காக்கிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிக்க இயல்பாகவும் உள்ளது. ‘மேலும் அவர் தொடர்ந்து கூறினார்’ மற்றும் ‘இதனால்தான் நான் உங்களிடம் ... சொல்லியிருக்கிறேன்’ ஆகியவை உரையாடல் சூழலுக்குப் பொருத்தமானவை. நிபந்தனை அமைப்பான ‘கொடுக்கப்பட்டிருந்தாலொழிய’ சற்றே முறையான நடையாயினும் வேதாகமப் பதிவின் மரியாதையான பதிவுமுறைக்கு ஏற்றதும் தெளிவானதுமாகும்.
