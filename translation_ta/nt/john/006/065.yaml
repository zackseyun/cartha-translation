id: JHN.6.65
reference: John 6:65
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: ta
  text: 'மேலும் அவர் தொடர்ந்து கூறினார்: “இதனால்தான் நான் உங்களிடம், தந்தையிடமிருந்து ஒருவருக்கு[b] அது கொடுக்கப்பட்டிருந்தாலொழிய[a], யாராலும் என்னிடம் வர முடியாது என்று சொல்லியிருக்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது அவருக்கு தந்தையிடமிருந்து அருளப்பட்டிருந்தாலொழிய.”
    reason: ‘கொடுக்கப்பட்டிருத்தல்’ என்பதற்கு ‘அருளப்பட்டிருத்தல்’ என்பது சூழலுக்கு ஏற்ற மாற்று மொழிபெயர்ப்பு; ஆனால் அது ‘வழங்குதல்’ என்ற கருத்தைச் சற்றுத் தெளிவாக்குகிறது.
  - marker: b
    text: கிரேக்கத்தில் இங்கு ஆண்பால் ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது; அது பொதுவாக எந்த ஒருவரையும் குறிக்கிறது.
    reason: மூலமொழியின் இலக்கண வடிவத்தையும் அதன் பொதுப்பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: ἔλεγεν
  choice: தொடர்ந்து கூறினார்
  rationale: இறந்தகால imperfect வடிவம் உரையாடல் சூழலில் தொடர்ந்த செயலைக் காட்டுவதால், இயல்பான தமிழில் அதன் aspect-ஐ முடிந்தவரை காக்கிறது.
- source_word: Διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய உரையைச் சுட்டி அதற்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἴρηκα
  choice: சொல்லியிருக்கிறேன்
  rationale: முன்பு சொல்லப்பட்டு இப்போதும் பொருந்தும் கருத்தை perfect வடிவத்திற்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: οὐδεὶς δύναται
  choice: யாராலும் ... முடியாது
  rationale: அனுமதியின்மையை அல்ல, இயலாமையைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: ἐλθεῖν πρός με
  choice: என்னிடம் வர
  rationale: யோவான் நற்செய்தியின் சூழலில் உள்ள உறவு மற்றும் நம்பிக்கை சார்ந்த பொருளை விரித்துரைக்காமல் நேரடியாகக் காக்கிறது.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: அது கொடுக்கப்பட்டிருந்தாலொழிய
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருளான ‘கொடுக்கப்படுதல்’ என்பதையும், perfect passive நிபந்தனையையும் காக்கிறது; கொடுக்கப்பட்ட ‘அது’ என்ன என்பதை உரை விளக்காதபடியே விடுகிறது.
- source_word: αὐτῷ
  choice: ஒருவருக்கு
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் பொதுப்பொருளில் வருகிறது; பாலின வேறுபாடு காட்டாத இயல்பான தமிழ் பொதுப்பெயர் ஒருமையையும் பொதுப்பொருளையும் காக்கிறது.
- source_word: ἐκ τοῦ πατρός
  choice: தந்தையிடமிருந்து
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தை, செய்பவரைக் குறிக்கும் ‘தந்தையால்’ என்று மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: இயேசுவிடம் வருவதில் இறைவன் அளிப்பதும் மனிதரின் இயலுமையும்
  choice: தந்தையிடமிருந்து கொடுக்கப்பட்டிருப்பது இயேசுவிடம் வருவதற்கான அவசியமான நிபந்தனை என நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அது தவறாது செயல்படும் தெய்வீக அருளளிப்பு என்றோ, அனைவருக்கும் முன்கூட்டியே வழங்கப்படும் உதவி என்றோ விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை அவசியமான நிபந்தனையைத் தெளிவாகக் கூறுகிறது; ஆனால் அந்த அளிப்பின் இயல்பையோ பரப்பையோ குறித்த பிற்கால இறையியல் விவாதங்களை இவ்வசனம் தீர்மானிப்பதில்லை.
- issue: αὐτῷ என்ற பொதுப்பொருளுள்ள ஆண்பால் ஒருமை
  choice: தமிழில் ‘ஒருவருக்கு’ என ஒருமைப் பொதுப்பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவனுக்கு’ என இலக்கண ஆண்பாலை வெளிப்படையாகக் காட்டுதல்.
  rationale: தமிழில் ‘ஒருவர்’ இயல்பாகவே ஒருமையையும் பொதுப்பொருளையும் தருகிறது; கிரேக்கத்தின் இலக்கணப் பாலினத்தை இயல்பற்ற விதத்தில் திணிக்காமல் அதன் குறிப்பு விசாலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’ என்பது யோவான் நற்செய்தியின் இறையியல் சூழலில் கடவுளைக் குறிக்கும் பெயராகக் காக்கப்பட்டுள்ளது; ‘தந்தையிடமிருந்து’ மூலம் என்ற நுணுக்கத்தையும், ‘கொடுக்கப்பட்டிருந்தாலொழிய’ தீர்க்கப்படாத இறையியல் இறுக்கத்தையும் பாதுகாக்கிறது.
