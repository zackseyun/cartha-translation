source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: ta
  text: அவர்கள் ஏறக்குறைய இருபத்தைந்து அல்லது முப்பது ஸ்தாதியோன் தூரம் துடுப்புப் போட்டுச் சென்றபின், இயேசு கடலின்மேல் நடந்து படகின் அருகே வருவதைக் கண்டார்கள்; அவர்கள் பயந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐληλακότες
  choice: துடுப்புப்போட்டுச் சென்றபோது
  rationale: கடற்பயணச் சூழலில் ἐλαύνω படகைத் துடுப்பால் செலுத்துவதைக் குறிக்கிறது. முற்செயலைத் தமிழில் இயல்பாகக் காட்டும் வகையில் ‘சென்றபோது’ என அமைக்கப்பட்டது.
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதை நகர்வை இயல்பான தமிழில் காட்டுகிறது; தனியே தொடக்க இணைப்புச் சொல் சேர்ப்பதைவிட வாக்கியத்தின் இறுதிப் பகுதியில் இது சரளமாக உள்ளது.
- source_word: ὡς
  choice: ஏறக்குறைய
  rationale: தூர அளவுடன் வரும் ὡς தோராயத்தைக் குறிக்கிறது.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: இருபத்தைந்து அல்லது முப்பது ஸ்தாதியோன் தூரம்
  rationale: மூலத்தின் பழங்கால அளவலகை முதன்மை உரையில் பாதுகாத்து, இன்றைய அளவுக்கு இணையான மதிப்பை அடிக்குறிப்பில் தருகிறது.
- source_word: θεωροῦσιν
  choice: கண்டார்கள்
  rationale: இச்சூழலில் நேரடியான காட்சியுணர்வைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: கடலின்மேல் நடந்து
  rationale: θάλασσα என்பதன் ‘கடல்’ என்ற சொல்லையும், ἐπί இங்கு வெளிப்படுத்தும் ‘மேல்’ என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: படகின் அருகே வருவதை
  rationale: γίνομαι உடன் ἐγγύς வருவது நிலையான அருகாமையை மட்டுமல்ல, அருகே வந்துகொண்டிருக்கும் நகர்வையும் வெளிப்படுத்துகிறது.
- source_word: πλοίου
  choice: படகு
  rationale: கலிலேயக் கடல் சூழலில் பெரிய கப்பலைவிட சிறிய நீரூர்தியைக் குறிக்கும் ‘படகு’ பொருத்தமானது.
- source_word: ἐφοβήθησαν
  choice: பயந்தார்கள்
  rationale: அவர்கள் அடைந்த பயப் பிரதிசெயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: அற்புத நிகழ்வை அதன் நேரடிப் பொருளை மெலிவாக்காமல் மொழிபெயர்த்தல்
  choice: கடலின்மேல் நடந்து
  alternative: கடலோரமாக நடந்து / தண்ணீரின்மேல் நடந்து
  rationale: சீடர்கள் கரையிலிருந்து தூரத்தில் இருக்கும் சூழலில் ‘கடலோரமாக’ என்பது பொருந்தாது. மூலத்தில் θάλασσα ‘கடல்’ என்றே இருப்பதால் ‘தண்ணீர்’ என மாற்றாமல், உரையின் வெளிப்படையானதாயினும் வியப்பூட்டும் பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பழங்கால அளவலகான ‘ஸ்தாதியோன்’ ஒலிபெயர்க்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ‘கடலின்மேல்’ என்ற மூலத்தின் திடுக்கிடும் நேரடித்தன்மை பாதுகாக்கப்பட்டுள்ளது.
