source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: ta
  text: எனவே, அவரைப் படகுக்குள் ஏற்றிக்கொள்ள அவர்கள் மனமாயிருந்தார்கள்; உடனே படகு அவர்கள் சென்றுகொண்டிருந்த கரையை அடைந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடனே படகு அவர்கள் சென்றுகொண்டிருந்த கரையில் இருந்தது.”
    reason: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς என்பதன் இடநிலையை நெருக்கமாகக் காட்டும் மாற்று. ‘கரையை அடைந்தது’ என்ற முதன்மை வாசகத்தில் உள்ள வருகை-நுணுக்கத்திற்குப் பதிலாக, படகு உடனே இலக்குக் கரையில் இருந்தது என்ற சுருக்கமான கிரேக்கச் சொல்லாக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἤθελον
  choice: விரும்பினார்கள்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் அவரை ஏற்றிக்கொள்ள அவர்கள் கொண்டிருந்த விருப்பத்தையோ மனப்பாங்கையையோ காட்டுகிறது. இயல்பான தமிழில் ‘விரும்பினார்கள்’ என்பது இதைத் தெளிவாகச் சொல்கிறது.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய நிகழ்வின் விளைவாக சீடர்களின் எதிர்வினை வந்ததை இணைக்கிறது.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: அவரைப் படகில் ஏற்றிக்கொள்ள
  rationale: படகுக்குள் இயேசுவை ஏற்றுக்கொள்வதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: πλοῖον
  choice: படகு
  rationale: கலிலேயக் கடல் சூழலுக்கு அளவிலும் பயன்பாட்டிலும் இயல்பான சொல்.
- source_word: εὐθέως
  choice: உடனே
  rationale: நிகழ்வின் திடீர் உடனடித்தன்மையை இயல்பான தமிழில் வலுவாகக் காக்கிறது.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: படகு … கரையை அடைந்தது
  rationale: இலக்கிடமான நிலப்பகுதிக்கு படகு வந்துசேர்ந்ததைத் தமிழில் தெளிவாகக் கூறுகிறது; படகு தரையின்மேல் ஏறிவிட்டது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. கிரேக்கத்தின் சொற்சார்ந்த ‘நிலத்தருகே இருந்தது’ என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: γῆς
  choice: கரை
  rationale: நீர்ப்பயணத்தின் இலக்கிடத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் குறிக்கிறது; அடிப்படைப் பொருளான ‘நிலம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς ἣν ὑπῆγον
  choice: அவர்கள் சென்றுகொண்டிருந்த
  rationale: அவர்கள் ஏற்கெனவே அந்த இலக்கை நோக்கிப் பயணித்துக்கொண்டிருந்த தொடர்நிலையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரண்டாம் வாக்கியத்தின் உடனடித்தன்மை அற்புத நிகழ்வைக் குறிக்கிறதா, அல்லது சாதாரணமாக விரைவில் கரையை அடைந்ததைக் குறிக்கிறதா
  choice: ‘உடனே’ என்பதைத் தக்கவைத்து, படகு இலக்குக் கரையை அடைந்ததாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘விரைவில் படகு கரையை அடைந்தது’ அல்லது ‘உடனே படகு அந்த நிலத்தருகே இருந்தது’
  rationale: εὐθέως கூறும் தீவிரமான உடனடித்தன்மையை மென்மையாக்காமல் வைத்திருக்கிறது; அதேவேளையில் நிகழ்வின் இயல்பை விளக்கிச் சேர்க்காமல் உரையின் இறையியல் பதற்றத்தையும் சுருக்கத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அடைந்தது’ இயல்பான தமிழுக்காக முதன்மை உரையில் பயன்படுத்தப்பட்டாலும், கிரேக்கத்தின் இடநிலைச் சொல்லாக்கமும் அதன் சாத்தியமான அற்புத உடனடித்தன்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
