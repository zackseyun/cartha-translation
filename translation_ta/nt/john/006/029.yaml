source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “இதுவே கடவுளின் செயல்[b]: அவர் அனுப்பியவர்மேல் நீங்கள் நம்பிக்கை வைப்பது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அனுப்பியவரை நீங்கள் விசுவாசிப்பது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள் கோரும் செயல்” அல்லது “கடவுள் செய்யும் செயல்.” “கடவுளின் செயல்” என்ற கிரேக்கத் தொடர் ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்படலாம்; இங்குள்ள மொழியாக்கம் அந்தப் பொருள் தெளிவின்மையைத் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: மூலத்தின் இரு வினைச்சொல் அமைப்பையும் இயல்பான தமிழ் உரையாடல் நடையில் தக்கவைக்கிறது.
- source_word: Τοῦτό ἐστιν
  choice: … வைப்பதே
  rationale: தமிழில் வலியுறுத்தும் ‘-ஏ’ அமைப்பு, ‘இதுவே’ என்ற சுட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: கடவுளின் செயல்
  rationale: மரபுத்தொடரின் உறவைத் தீர்மானிக்காமல், ‘கடவுள் கோரும் செயல்’ அல்லது ‘கடவுள் செய்யும் செயல்’ என்ற இரு சாத்தியங்களையும் தக்கவைக்கிறது.
- source_word: πιστεύητε εἰς
  choice: …மேல் நம்பிக்கை வைப்பது
  rationale: யோவான் நூலில் வரும் தனிப்பட்ட நம்பிக்கை மற்றும் சார்ந்திருத்தல் உணர்வை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: அவர் அனுப்பியவர்
  rationale: ἐκεῖνος கடவுளைக் குறிப்பதையும், அனுப்பப்பட்டவர் இயேசு என்பதையும் தேவையற்ற விளக்கமின்றித் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: τοῦ θεοῦ என்ற மரபுத்தொடரின் பொருள்
  choice: முதன்மை உரையில் ‘கடவுளின் செயல்’ என்று தெளிவுபடுத்தாமல் வைத்தல்
  alternative: ‘கடவுள் கோரும் செயல்’ அல்லது ‘கடவுள் செய்யும் செயல்’
  rationale: கிரேக்க மரபுத்தொடர் objective genitive அல்லது subjective genitive என இருவிதமாகப் புரிந்துகொள்ளப்படலாம்; ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல் மூலத்தின் பதற்றத்தைத் தக்கவைக்க வேண்டும்.
- issue: πιστεύητε εἰς என்பதன் மொழியாக்கம்
  choice: ‘…மேல் நம்பிக்கை வைப்பது’
  alternative: ‘…ஐ விசுவாசிப்பது’
  rationale: இது கருத்தை உண்மையென ஏற்றுக்கொள்வதை மட்டும் அல்லாமல், அனுப்பப்பட்டவரை நம்பிச் சார்ந்திருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பதிலளித்துச் சொன்னார்’ என்பது மூலத்தின் இரட்டை வினை அமைப்பைத் தக்கவைக்கிறது; ‘கடவுளின் செயல்’ என்பது திட்டமிட்டே விளக்கப்படாமல் வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
