lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: உண்மையாகவே, உண்மையாகவே
  rationale: யோவானில் வலியுறுத்தப்பட்ட உறுதியான அறிவிப்பை அறிமுகப்படுத்தும் இரட்டிப்பு வடிவத்தை இயல்பான, கண்ணியமான தமிழில் மீளுரைப்புடன் பாதுகாக்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நிகழ்கால வினையையும் பன்மை இரண்டாம் நபர் சுட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὁ πιστεύων
  choice: நம்புகிறவர்
  rationale: உருபுடன் வரும் நிகழ்காலப் பங்கேற்புவினை நம்புதலால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது; தமிழ் உறவுப்பெயர் வடிவம் இதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔχει
  choice: பெற்றிருக்கிறார்
  rationale: முடிவில்லா வாழ்வு இப்போதே அவருக்குரியதாக உள்ளது என்ற கிரேக்க நிகழ்காலக் கூற்றைப் பாதுகாக்கிறது; எதிர்காலமாக மாற்றுவதில்லை.
- source_word: ζωὴν αἰώνιον
  choice: முடிவில்லா வாழ்வு
  rationale: αἰώνιος என்பதன் நீடித்த தன்மையைத் தெளிவாகக் கூறும் இயல்பான நவீனத் தமிழ்; ‘நித்திய ஜீவன்’ என்ற மரபுவழிச் சொற்றொடரைவிட பொதுவாசகருக்கு உடனடியாகப் புரியும்.
theological_decisions:
- issue: முடிவில்லா வாழ்வு இப்போதே உடையதாக இருப்பது
  choice: பெற்றிருக்கிறார்
  alternative: பெறுவார்
  rationale: ἔχει என்பது நிகழ்காலம். ஆகவே வாழ்வை எதிர்கால வாக்குறுதியாக மட்டும் மாற்றாமல், தற்போதைய உடைமையைக் குறிக்கும் மூலமொழிக் கூற்றைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான உரைநடை. யோவானுக்குரிய இரட்டிப்பு வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது. மரபுவழி இறையியல் சொற்களை அவசியமின்றி இறக்குமதி செய்யாமல், மூலத்தின் நிகழ்காலக் கூற்றும் αἰώνιος என்பதன் பொருள் பரப்பும் குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
