    text: அல்லது, “நம்பும் எவரும்.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “நம்புகிறவர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முடிவில்லா வாழ்வு”; சொல்லுக்குச் சொல்லுக்கு இன்னும் நெருக்கமாக, “யுகத்திற்குரிய வாழ்வு.”
