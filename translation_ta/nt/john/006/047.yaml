  text: '“உண்மையாக, உண்மையாக, உங்களுக்குச் சொல்கிறேன்: நம்புகிறவர்[a] நித்திய வாழ்வை[b] உடையவராக இருக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
