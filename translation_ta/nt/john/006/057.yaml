id: JHN.6.57
reference: John 6:57
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: ta
  text: உயிருள்ள தந்தை என்னை அனுப்பினார்; நான் தந்தையால் வாழ்கிறேன்[a]. அதுபோல, என்னை உண்பவரும் என்னால் வாழ்வார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் தந்தையின் காரணமாக வாழ்கிறேன்’ அல்லது ‘தந்தையின் வழியாக வாழ்கிறேன்’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘என் காரணமாக வாழ்வார்’ அல்லது ‘என் வழியாக வாழ்வார்’ என்றும் பொருள் கொள்ளலாம். ‘உண்பவர்’ என்பதற்கான கிரேக்க வினைச்சொல் தெளிவான, உயிரோட்டமுள்ள உண்ணும் செயலைக் குறிக்கிறது.
    reason: lexical_and_semantic_alternative
lexical_decisions:
- source_word: καθὼς
  choice: அதுபோல
  rationale: ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்க வாக்கியத்தின் இரு பகுதிகளுக்கிடையிலான ஒப்புமையைத் தெளிவாக்க தமிழில் இரண்டாம் பகுதிக்குத் தொடக்கமாக அமைக்கப்பட்டுள்ளது.
- source_word: ὁ ζῶν πατὴρ
  choice: உயிருள்ள தந்தை
  rationale: ζῶν என்பதன் பண்புப்பெயர்ச்சொல் வலிமையை நேரடியாகக் காக்கிறது; ‘உயிரளிக்கும் தந்தை’ என்று பொருளை விரிவுபடுத்தவில்லை.
- source_word: ἀπέστειλέν
  choice: அனுப்பினார்
  rationale: இறந்தகால நிகழ்வை எளிமையாகவும் மரியாதை ஒருமையுடனும் தருகிறது.
- source_word: ζῶ
  choice: வாழ்கிறேன்
  rationale: நிகழ்காலத்தையும் வசனத்தின் ‘வாழ்வு’ மையக்கருத்தையும் காக்கிறது.
- source_word: διὰ τὸν πατέρα
  choice: தந்தையால்
  rationale: διά + accusative இங்கு காரணம் அல்லது வழிமூலம் ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிக்கலாம். ‘தந்தையால்’ என்பது தமிழில் காரணம்/அடிப்படை மற்றும் வழிமூலம் ஆகியவற்றின் இயல்பான தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: ὁ τρώγων με
  choice: என்னை உண்பவர்
  rationale: τρώγω என்பதன் உறுதியான, உடல்சார்ந்த ‘உண்ணுதல்’ உருவகத்தைப் பாதுகாக்கிறது; திருவிருந்து சார்ந்த அல்லது உருவகமான விளக்கங்களில் ஒன்றை மட்டும் திணிக்கவில்லை.
- source_word: κἀκεῖνος
  choice: உண்பவரும்
  rationale: கிரேக்கத்தின் வலியுறுத்தும் ‘அவரும்/அந்த ஒருவரும்’ என்ற பொருளை தமிழின் ‘-உம்’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ζήσει
  choice: வாழ்வார்
  rationale: எதிர்காலத்தைத் தெளிவாகக் காத்து, ‘வாழ்கிறேன்’ என்பதுடனான சொல் இணைப்பையும் பேணுகிறது.
- source_word: δι’ ἐμέ
  choice: என்னால்
  rationale: முதல் διά சொற்றொடருடன் இணையான வடிவத்தைப் பேணுகிறது; காரணம் மற்றும் வழிமூலம் ஆகிய சாத்தியங்களைத் திறந்தவையாக வைக்கிறது.
theological_decisions:
- issue: διὰ τὸν πατέρα / δι’ ἐμέ என்பவற்றின் காரண அல்லது வழிமூலப் பொருள்
  choice: ‘தந்தையால்’ மற்றும் ‘என்னால்’ என்று இணையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தந்தையின் காரணமாக’ / ‘என் காரணமாக’ அல்லது ‘தந்தையின் வழியாக’ / ‘என் வழியாக’
  rationale: கிரேக்க διά + accusative பொதுவாகக் காரணத்தைச் சுட்டினாலும், இச்சூழலில் வழிமூல நுணுக்கமும் விவாதிக்கப்படுகிறது. தமிழ் ‘-ஆல்’ இரண்டையும் இயல்பாகத் தாங்கி, தந்தை–மகன் மற்றும் மகன்–விசுவாசி ஒப்புமையைப் பேணுகிறது; கிறிஸ்துவின் இயல்பைப் பற்றிய மேலதிக கோட்பாட்டு முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
- issue: ὁ τρώγων με என்பதன் திருவிருந்து சார்ந்த அல்லது விரிவான உருவகப் பொருள்
  choice: ‘என்னை உண்பவர்’ என்ற நேரடியான உருவம் காக்கப்பட்டது.
  alternative: ‘என்னை உட்கொள்பவர்’ அல்லது ‘என்னைச் சார்ந்து வாழ்பவர்’
  rationale: ‘உண்பவர்’ மூலத்தின் தெளிவான உணவுச் செயலைக் காக்கிறது; அதை முற்றிலும் திருவிருந்து சார்ந்ததாகவோ முற்றிலும் உருவகமாகவோ தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தந்தை மற்றும் இயேசுவைக் குறிக்கும் வினைகளில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. இணையான ‘தந்தையால் / என்னால்’ அமைப்பு மூலத்தின் ஒப்புமையையும் உண்மையான பொருள் நுணுக்கத்தையும் காக்கிறது.
