translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொற்றொடரின் பொதுவான தடையைப் பேணி, ‘முணுமுணுப்பதை நிறுத்துங்கள்’ என்று செயல் ஏற்கெனவே நடந்துகொண்டிருப்பதாகத் திட்டவட்டமாக்கவில்லை.
