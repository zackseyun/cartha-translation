  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்: “உங்களுக்குள் முணுமுணுக்காதீர்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவரோடொருவர் முணுமுணுக்காதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: கிரேக்க மொழியின் இரட்டை உரையாடல் வடிவத்தைத் தமிழில் இயல்பாகவும், இரு வினைகளின் பொருளையும் காக்கும் வகையிலும் வழங்குகிறது.
- source_word: Μὴ γογγύζετε
  choice: முணுமுணுக்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளையின் பொதுவான தடைப் பொருளை அதிகமாகத் தீர்மானிக்காமல் காக்கிறது; γογγύζω என்பதிலுள்ள அதிருப்தியைத் தாழ்ந்த குரலில் வெளிப்படுத்தும் நுண்ணுணர்வையும் வேதாகமப் பின்னொலியையும் தருகிறது.
- source_word: μετ’ ἀλλήλων
  choice: உங்களுக்குள்
  rationale: குழுவினரிடையே நிகழும் பரஸ்பரச் செயலை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
