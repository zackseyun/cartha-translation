  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: ta
  text: அதனால் அவர்கள் அவரிடம், “அப்படியானால், நாங்கள் அதைக் கண்டு உம்மை நம்பும்படி[a], நீர் என்ன அடையாளத்தை நிகழ்த்துகிறீர்? என்ன செயலைப் புரிகிறீர்?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் சொல்வதை நம்பும்படி” அல்லது “உம்மேல் நம்பிக்கை வைக்கும்படி.” கிரேக்கத்தில் பொதுவாக யோவான் பயன்படுத்தும் “அவரில் நம்பிக்கை வைப்பது” என்ற அமைப்புக்குப் பதிலாக, ‘உமக்கு/உம்மிடம்’ என்ற பொருளுடைய தத்திவப் பெயர்ப்பதிலி பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: அதனால் அவர்கள் அவரிடம் ... என்று கேட்டார்கள்
  rationale: οὖν முந்தைய உரையுடன் உள்ள விளைவு/தொடர்பு உணர்வைத் தருவதால் ‘அதனால்’ என மொழிபெயர்க்கப்பட்டது. கேள்விகள் தொடர்வதால் εἶπον என்பதற்கு இயல்பான தமிழில் ‘என்று கேட்டார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: Τί οὖν
  choice: அப்படியானால்
  rationale: இரண்டாவது οὖν-ன் வினாவை அழுத்தும் தர்க்கத் தொடர்ச்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: ποιεῖς σὺ σημεῖον
  choice: நீர் என்ன அடையாளத்தை நிகழ்த்துகிறீர்?
  rationale: σημεῖον என்பதன் யோவானிய முக்கியச் சொல்லாட்சியை ‘அடையாளம்’ காக்கிறது; ‘அற்புதம்’ என்று விளக்கமாக விரிவாக்கவில்லை. ‘நிகழ்த்துகிறீர்’ என்பது அடையாளத்தைச் செய்வது என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: நாங்கள் அதைக் கண்டு உம்மை நம்பும்படி
  rationale: ἵνα உடன் வரும் துணைவினைகள் நோக்கத்தை வெளிப்படுத்துகின்றன. ‘உம்மை நம்ப’ என்பது σοι என்ற வேற்றுமை அமைப்பை இயல்பான தமிழில் பிரதிபலித்து, அவர் சொல்வதை நம்புதல் அல்லது அவர்மேல் நம்பிக்கை வைத்தல் என்ற சாத்தியமான நுணுக்கங்களைத் திறந்தே வைக்கிறது.
- source_word: τί ἐργάζῃ
  choice: என்ன செயலைச் செய்கிறீர்?
  rationale: ἐργάζῃ-இன் ‘செயல் புரிதல்/வேலை செய்தல்’ உணர்வை ‘செயல்’ என்பதன் மூலம் வெளிப்படுத்தி, முதல் கேள்வியின் ‘அடையாளம்’ என்பதிலிருந்து வேறுபடுத்துகிறது; மூலத்தின் வலியுறுத்தும் மறுபடியுரைத்தலையும் காக்கிறது.
theological_decisions:
- issue: πιστεύω என்பதுடன் σοι என்ற தத்திவ வேற்றுமையின் பொருள்
  choice: உம்மை நம்பும்படி
  alternative: நீர் சொல்வதை நம்பும்படி; உம்மேல் நம்பிக்கை வைக்கும்படி
  rationale: கிரேக்கத்தில் யோவான் வழக்கமாகப் பயன்படுத்தும் εἰς + வேற்றுமை அமைப்புக்குப் பதிலாகத் தத்திவப் பெயர்ப்பதிலி உள்ளது. ஆகவே ‘நீர் சொல்வதை நம்புதல்’ மற்றும் ‘உம்மை நம்பி சார்ந்திருத்தல்’ ஆகியவற்றில் ஒன்றை மட்டும் இறையியல் ரீதியாகத் தீர்மானிக்காமல், தமிழின் இயல்பான ‘உம்மை நம்ப’ என்ற வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டது. இயேசுவை நோக்கிய உரையில் ‘நீர்/உம்மை’ பயன்படுத்தப்பட்டுள்ளது. ‘அடையாளம்’ என்ற யோவானிய சொல்லாட்சி விளக்கமாக ‘அற்புத அடையாளம்’ என விரிவாக்கப்படவில்லை.
