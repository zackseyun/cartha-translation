  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நான்தான்[a]; பயப்படாதீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “நான் இருக்கிறேன்.” யோவான் நற்செய்தியில் இந்தச் சொற்றொடர் எளிய சுயஅடையாளக் கூற்றாகவும், பரந்த இறையியல் கருப்பொருள்களையும் எதிரொலிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால் அவர்
  rationale: δέ இங்கு நிகழ்வின் திருப்பத்தையோ மென்மையான எதிர்மறைத் தொடர்பையோ குறிக்கிறது; ὁ என்பது இயேசுவைக் குறிக்கும் பதிலிப்பெயர் தன்மையுடைய பயன்பாடு.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், நவீன தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பன்மைத் தத்திவேற்றுமைச் சுட்டுப்பெயரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; யாரைக் குறிக்கிறது என்பதைச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: Ἐγώ εἰμι
  choice: நான்தான்
  rationale: உடனடிச் சூழலில் இயேசு தம்மை அடையாளம் காட்டி சீடர்களுக்கு உறுதியளிக்கிறார். ‘நான்தான்’ என்பது நவீன தமிழில் இயல்பான சுயஅடையாளக் கூற்று; ‘நான் இருக்கிறேன்’ என்ற சொல்லுக்குச் சொல் வடிவமும் அதன் சாத்தியமான யோவானிய இறையியல் எதிரொலியும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் தடைப் பொருளை இயல்பான, மரியாதைப் பன்மையிலான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: Ἐγώ εἰμι என்பதை எளிய சுயஅடையாளமாக மொழிபெயர்ப்பதா, அல்லது இறையியல் எதிரொலி இருக்கக்கூடிய சொல்லுக்குச் சொல் வடிவத்தை முதன்மைப்படுத்துவதா
  choice: 'முதன்மை உரை: ‘நான்தான்’'
  alternative: ‘நான் இருக்கிறேன்’
  rationale: இந்த நிகழ்ச்சிச் சூழலில் இயேசு அஞ்சிய சீடர்களிடம் தம்மை அடையாளம் காட்டுவதே உடனடிப் பணி. அதேவேளை, யோவான் நற்செய்தியில் ἐγώ εἰμι என்பதற்கு விரிவான இறையியல் எதிரொலி இருக்கக்கூடும் என்பதால், அந்தத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையில் சீடர்கள் பலராய் இருப்பதால் மரியாதை/பன்மை வடிவமான ‘பயப்படாதீர்கள்’ தேர்ந்தெடுக்கப்பட்டது; கிரேக்கத்தின் வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலமாக மாற்றப்பட்டது.
