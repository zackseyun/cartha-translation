source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: ta
  text: அழிந்துபோகும் உணவுக்காக உழைக்காதீர்கள்; மாறாக, நித்திய வாழ்வுக்காக நிலைத்திருக்கும் உணவுக்காக உழையுங்கள். அந்த உணவை மனிதகுமாரன் உங்களுக்குக் கொடுப்பார். ஏனெனில், தந்தையாகிய கடவுள் அவர்மேல் தமது முத்திரையைப் பதித்துள்ளார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முத்திரையைப் பதித்துள்ளார்” என்பது இங்கு அதிகாரமளித்தல் அல்லது உண்மையானவர் என்று உறுதிப்படுத்துதல் என்ற கருத்தை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: உழைக்காதீர்கள் … உழையுங்கள்
  rationale: கட்டளை வினையின் வலிமையையும், μὴ … ἀλλὰ என்ற எதிர்மறை–நேர்மறை முரணையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடரும் ‘உணவுக்காக’ என்பதால் ‘அதற்காக உழைத்தல்’ என்ற பொருள் தெளிவாகிறது.
- source_word: βρῶσιν
  choice: உணவு
  rationale: இச்சூழலில் இது உண்ணும் செயலை அல்ல, உண்ணப்படும் உணவைச் சுட்டுகிறது.
- source_word: ἀπολλυμένην
  choice: அழிந்துபோகும்
  rationale: கெட்டுப்போதல் என்பதைக் காட்டிலும் பரந்த, நிலையற்றுப் போகும் பொருளைத் தக்கவைக்கிறது.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: நித்திய வாழ்வுக்காக நிலைத்திருக்கும்
  rationale: μένω என்பதன் ‘நிலைத்திரு’ என்ற பொருளையும், εἰς என்பதிலுள்ள நோக்கம் அல்லது முடிவைத் திறந்தவாறும் வைத்திருக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: சுயகுறிப்புப் பட்டத்தின் சொல் வடிவத்தையும் அதன் வேதாகம எதிரொலியையும் பாதுகாக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: ὑμῖν δώσει
  choice: உங்களுக்குக் கொடுப்பார்
  rationale: எதிர்கால வினையையும் வெளிப்படையான மறைமுகப் பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐσφράγισεν
  choice: தமது முத்திரையைப் பதித்துள்ளார்
  rationale: அங்கீகாரம் அல்லது உறுதிப்படுத்தல் என்ற உட்பொருளை மட்டும் கூறிவிடாமல், கிரேக்க மூலத்தின் முத்திரை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ὁ πατὴρ … ὁ θεός
  choice: தந்தையாம் கடவுள்
  rationale: ‘தந்தை’ மற்றும் ‘கடவுள்’ ஆகியவை ஒரே நபரைக் குறிக்கும் கிரேக்க இடைச்சேர்க்கையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὁ πατὴρ … ὁ θεός என்ற இடைச்சேர்க்கையின் பொருள்
  choice: தந்தையாம் கடவுள்
  alternative: தந்தை, அதாவது கடவுள்
  rationale: தந்தையைக் கடவுளாக அடையாளப்படுத்தும் மூலத்தின் இலக்கணத்தைத் தக்கவைத்து, அதற்கு அப்பாற்பட்ட கோட்பாட்டு விரிவாக்கத்தைத் தவிர்க்கிறது.
- issue: மனிதகுமாரன்மேல் ἐσφράγισεν என்பதன் பொருள்
  choice: அவர்மேல் தமது முத்திரையைப் பதித்துள்ளார்
  alternative: அவரை அதிகாரப்பூர்வமாக அங்கீகரித்துள்ளார்
  rationale: தெய்வீக அங்கீகாரம் அல்லது அதிகாரமளித்தல் என்ற கருத்தை உள்ளடக்கிய உருவகத்தை மொழிபெயர்ப்பிலேயே பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பயன்பாட்டை விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற பட்டமும் ‘முத்திரை’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன; εἰς ζωὴν αἰώνιον என்பதின் நோக்கம்/முடிவு சார்ந்த நெகிழ்வை அளவுக்கு மீறித் தீர்மானிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
