source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: ta
  text: என் மாம்சத்தை உண்பவனும் என் இரத்தத்தைக் குடிப்பவனும் என்னில் நிலைத்திருக்கிறான்[a]; நானும் அவனில் நிலைத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மென்று உண்பவன்’ அல்லது ‘உணவாக உட்கொள்பவன்’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்க வினைச்சொல் பொதுவான ‘உண்’ என்பதைவிட உயிரோட்டமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: உண்பவனும்
  rationale: இடைச்சொல்லுடன் கூடிய நிகழ்காலப் பெயரெச்சம், இந்தச் செயலைத் தொடர்ந்து செய்பவனைக் குறிக்கும் பெயர்ச்சொல் தன்மையில் உள்ளது. ‘உண்பவன்’ ஒருமையையும் தொடர்ச்சியான பண்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τρώγων
  choice: உண்பவன்
  rationale: τρώγω என்பது சாதாரணமாக ‘உண்’ என்பதைக் காட்டிலும் உயிரோட்டமான ‘மென்று உண்’ என்ற நிழற்பொருளைக் கொள்ளலாம். இருப்பினும், முதன்மை உரையில் ‘உண்பவன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; அதிக உயிரோட்டமுள்ள மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μου τὴν σάρκα
  choice: என் மாம்சத்தை
  rationale: σάρξ இங்கு இயேசுவின் மாம்சத்தைக் குறிக்கும் தெளிவான, உடல்சார்ந்த சொல்லாக உள்ளது. ‘மாம்சம்’ யோவான் உரையின் அதிர்ச்சியூட்டும் பலி மற்றும் மனிதவுருவேற்பு உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: என் இரத்தத்தைக் குடிப்பவனும்
  rationale: இணையான நிகழ்காலப் பெயரெச்ச அமைப்பு தமிழில் ‘உண்பவனும் ... குடிப்பவனும்’ என இயல்பாகக் காக்கப்படுகிறது. αἷμα நேரடியாக ‘இரத்தம்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐν ἐμοὶ μένει
  choice: என்னில் நிலைத்திருக்கிறான்
  rationale: μένω யோவான் நூலில் முக்கியமான வினைச்சொல். ‘நிலைத்திரு’ என்பது உறவின் தொடர்ச்சியையும் நிலைப்பையும் காக்கும் தற்போதைய, கண்ணியமான தமிழ் நடை.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: நானும் அவனில் நிலைத்திருக்கிறேன்
  rationale: கிரேக்கத்தில் இரண்டாம் கூறில் வினைச்சொல் விடுபட்டிருந்தாலும், தமிழில் தெளிவும் இயல்பும் பெற இணையான வினைச்சொல் நிரப்பப்பட்டுள்ளது. κἀγώ என்பதன் ‘நானும்’ என்ற வலியுறுத்தல் காக்கப்படுகிறது.
- source_word: αὐτῷ
  choice: அவனில்
  rationale: இது முன்வரும் ஆண்பால் ஒருமைப் பெயரெச்சத்தைக் குறிக்கும் ஆண்பால் ஒருமைப் பிரதிப்பெயர்; அதற்கேற்ப ‘அவன்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: மாம்சத்தை உண்டு இரத்தத்தைக் குடிப்பது திருவிருந்து சார்ந்ததா அல்லது உருவகமாக நம்புவதைக் குறிக்கிறதா
  choice: கிரேக்கத்தின் நேரடியான சொல்லாட்சியை விளக்கச் சேர்க்கையின்றி வைத்தல்
  alternative: இதை வெளிப்படையாகத் திருவிருந்து சார்ந்ததாகவோ, நம்புவதற்கான உருவகமாகவோ விளக்குதல்
  rationale: இந்த வசனத்தின் விளக்கம் கிறிஸ்தவ மரபுகளில் மாறுபடுகிறது. மூலவுரை விவாதத்தை இங்கே தீர்க்காததால், மொழிபெயர்ப்பும் ‘மாம்சத்தை உண்பது’, ‘இரத்தத்தைக் குடிப்பது’ என்ற பதற்றமுள்ள சொல்லாட்சியை அப்படியே காக்கிறது.
- issue: யோவான் நூலின் பரஸ்பர உள்ளுறைதல் மொழி
  choice: μένει என்பதை ‘நிலைத்திருக்கிறான்’ என்றும், விடுபட்ட வினையை இரண்டாம் கூறில் வெளிப்படையாக நிரப்பியும் மொழிபெயர்த்தல்
  alternative: ‘வாசமாயிருக்கிறான்’ அல்லது ‘ஒன்றாயிருக்கிறான்’ என்று மொழிபெயர்த்தல்
  rationale: ‘நிலைத்திரு’ உறவின் தொடர்ச்சியைப் பாதுகாக்கிறது; ‘ஒன்றாயிரு’ போன்ற விளக்கமொழி குறிப்பிட்ட இறையியல் அமைப்பை உரைக்குள் கொண்டுவரக்கூடும். தமிழின் இயல்புக்காக இரண்டாம் கூறில் வினை மீண்டும் சொல்லப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’, ‘இரத்தம்’, ‘நிலைத்திரு’ ஆகியவை யோவான் உரையின் சொற்பொருள், உருவகப் பதற்றம், தொடர்ச்சியான உறவு ஆகியவற்றைக் காக்கின்றன. முதன்மை உரையில் உள்ள [a] குறியீடு அடிக்குறிப்புடன் நேரடியாகப் பொருந்துகிறது.
