  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: ta
  text: ஆனால், அவர் இதை அவரைச் சோதிப்பதற்காகச் சொன்னார்; ஏனெனில், அவர் என்ன செய்யப்போகிறார் என்பதை அவரே அறிந்திருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: இதை
  rationale: முந்தைய வசனத்தில் இயேசு கேட்ட கேள்வியைக் குறிக்கும் சுட்டுப்பெயர்; தமிழில் இயல்பாக ‘இதை’ என வருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கேள்விக்கும் இப்போது தரப்படும் விளக்கத்திற்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ἔλεγεν
  choice: சொன்னார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை அம்சத்தைத் தமிழில் ‘சொல்லிக்கொண்டிருந்தார்’ என மிகைப்படுத்துவது இயல்பற்றதாக இருக்கும்; நிகழ்வுரையில் ‘சொன்னார்’ அதன் பொருளை இயல்பாக வழங்குகிறது.
- source_word: πειράζων
  choice: சோதிப்பதற்காகவே
  rationale: இங்கு பிலிப்பைத் தீமைக்கு இழுப்பது அல்ல, அவருடைய புரிதல் அல்லது நம்பிக்கையைச் சோதிப்பதே சூழல்சார் பொருள். நோக்கத்தைக் காட்டும் பங்கேற்புவினை தமிழில் நோக்கவினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αὐτόν
  choice: அவரை
  rationale: உடனடி சூழலில் பிலிப்பைக் குறிக்கிறது; மரியாதை ஒருமை தமிழின் வேதாகம உரைநடைக்கு ஏற்றது.
- source_word: αὐτὸς
  choice: தாம் … அவரே
  rationale: வெளிப்படையாக உள்ள வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; இது இயேசுவைக் குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: இயேசு ஏன் இப்படிச் சொன்னார் என்பதற்கான காரணவிளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: ᾔδει
  choice: அறிந்திருந்தார்
  rationale: οἶδα என்பதன் இறந்தகால நிலைப்பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τί
  choice: என்ன
  rationale: இயேசு அறிந்திருந்த செயலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: ἔμελλεν ποιεῖν
  choice: செய்யப்போகிறார்
  rationale: வரவிருக்கும் அல்லது நோக்கமிட்ட செயலைக் குறிக்கும் μέλλω + வினையெச்சத்தின் பொருளை, இவ்விரண்டில் ஒன்றைத் தேவையின்றி தீர்மானிக்காமல் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பிலிப்பிடம் இயேசு செய்த செயலுடன் தொடர்புடைய πειράζων என்பதன் பொருள்
  choice: சோதிப்பதற்காக
  alternative: சோதனைக்குள்ளாக்குவதற்காக / தூண்டுவதற்காக
  rationale: உடனடி சூழலில் பிலிப்பைத் தீமைக்கு இழுப்பது அல்ல, அவருடைய புரிதல் அல்லது நம்பிக்கையைச் சோதிப்பதே பொருள். எனினும் கிரேக்க வினையின் விரிந்த பொருள்வீச்சை அடிக்குறிப்பு சுட்டுகிறது.
- issue: இயேசுவின் முன் அறிவைப் பற்றிய வலியுறுத்தல்
  choice: ‘தாம் என்ன செய்யப்போகிறார் என்பதை அவரே அறிந்திருந்தார்’ என்று வலியுறுத்தலைத் தக்கவைத்தல்
  alternative: ‘அவர் என்ன செய்யப்போகிறார் என்பதை அறிந்திருந்தார்’
  rationale: αὐτός என்ற வெளிப்படையான சுட்டுப்பெயர் இயேசுவின் அறிவையும் நோக்கமுள்ள செயலையும் வலியுறுத்துகிறது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டைச் சேர்க்காமல் அந்த அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நிகழ்வுரை. இயேசுவையும் பிலிப்பையும் குறிக்க மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘செய்யப்போகிறார்’ என்பது அண்மையில் நடைபெறவிருக்கும் செயலும் நோக்கமிட்ட செயலும் ஆகிய இரு நுணுக்கங்களையும் திறந்தவையாக வைத்திருக்கிறது.
