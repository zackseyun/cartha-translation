id: JHN.6.36
reference: John 6:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: ta
  text: ஆனால், நீங்கள் என்னைக் கண்டிருக்கிறீர்கள்[a]; ஆனாலும் நம்புவதில்லை என்று நான் உங்களிடம் சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்றாக, வலியுறுத்தலுடன்: “ஆனால், நீங்கள் உண்மையாகவே என்னைக் கண்டிருக்கிறீர்கள்; ஆனாலும் நம்புவதில்லை என்று நான் உங்களிடம் சொன்னேன்.”'
    reason: முதல் καί-யை வலியுறுத்தலாகவும், இரண்டாவது καί-யை முரண்பாடாகவும் வெளிப்படையாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் தெளிவான முரண்பாட்டைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: εἶπον ὑμῖν
  choice: உங்களிடம் சொன்னேன்
  rationale: கடந்த காலத்தில் இயேசு அவர்களிடம் கூறியதை இயல்பாகவும், மூலத்தின் ‘உங்களிடம்’ என்ற மறைமுகச் செயப்படுபொருளைப் பாதுகாத்தும் தருகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: கூறப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் மேற்கோள் உருபு.
- source_word: καὶ ἑωράκατέ με
  choice: நீங்கள் என்னைக் கண்டிருக்கிறீர்கள்
  rationale: ἑωράκατέ என்ற நிறைவுற்ற வினையின் கடந்த செயலும் தற்போதைய தொடர்பும் ‘கண்டிருக்கிறீர்கள்’ என்பதில் காக்கப்படுகின்றன. முதல் καί-யின் வலியுறுத்தல் அடுத்த முரண்பாட்டுடன் சேர்த்து இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: καὶ οὐ πιστεύετε
  choice: அப்படியிருந்தும் நம்புவதில்லை
  rationale: இரண்டாவது καί இணைக்கும் எதிர்பாராத முரண்பாட்டை தமிழில் தெளிவாகக் காட்டுகிறது; நிகழ்கால நம்பாமையை ‘நம்புவதில்லை’ காக்கிறது.
theological_decisions:
- issue: καὶ ... καὶ என்ற தொடரின் சொல்லாட்சிசார் வலிமை
  choice: ‘நீங்கள் என்னைக் கண்டிருக்கிறீர்கள்; அப்படியிருந்தும் நம்புவதில்லை’ என முரண்பாட்டை இயல்பாக வெளிப்படுத்துதல்
  alternative: ‘நீங்கள் உண்மையாகவே என்னைக் கண்டிருக்கிறீர்கள்; ஆனாலும் நம்புவதில்லை’ என இரு καί சொற்களையும் வெளிப்படையாகக் காட்டுதல்
  rationale: அவர்களுடைய காணுதலுக்கும் தொடரும் நம்பாமைக்கும் இடையிலுள்ள சொல்லாட்சிசார் முரண்பாட்டை இது காக்கிறது; அதேவேளை முதல் καί-க்கு ‘உண்மையாகவே’ என்ற ஒரே பொருளை கட்டாயப்படுத்துவதில்லை.
- issue: πιστεύετε என்பதன் மொழிபெயர்ப்பு
  choice: நம்புவதில்லை
  alternative: விசுவாசிப்பதில்லை / நம்பிக்கை வைப்பதில்லை
  rationale: யோவான் நூலில் πιστεύω என்பதற்கான நேரடியான, பொதுமக்களுக்கு எளிதில் புரியும் வினைச்சொல் ‘நம்பு’; இது வெறும் அறிவுசார் ஒப்புதல் அல்லது குறிப்பிட்ட சமய மரபுச் சொல்லாட்சியைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட உரை. ‘கண்டிருக்கிறீர்கள்’ நிறைவுற்ற கிரேக்க வினையின் தற்போதைய தொடர்பைக் காக்கிறது; ‘அப்படியிருந்தும்’ மூலத்தில் உள்ள சொல்லாட்சிசார் பதற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
