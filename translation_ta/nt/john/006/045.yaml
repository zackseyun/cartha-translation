id: JHN.6.45
reference: John 6:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: ta
  text: '“இறைவாக்கினர்களின் நூல்களில் இவ்வாறு எழுதப்பட்டிருக்கிறது: ‘அவர்கள் எல்லாரும் கடவுளால் கற்பிக்கப்படுவார்கள்.’[a] தந்தையிடமிருந்து கேட்டு, கற்றுக்கொண்ட ஒவ்வொருவரும் என்னிடம் வருகிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எல்லாரும் கடவுளால் கற்பிக்கப்பட்டவர்களாய் இருப்பார்கள்.”
    reason: διδακτοὶ θεοῦ என்ற பெயரடைத் தொடரின் இன்னும் நேரடியான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: எழுதப்பட்டிருக்கிறது
  rationale: நிறைவேற்றப்பட்ட எழுத்துச் செயலும் அதன் நிலைத்திருக்கும் பொருத்தமும் வெளிப்படும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐν τοῖς προφήταις
  choice: இறைவாக்கினர்களின் நூல்களில்
  rationale: தனிநபர்களை மட்டும் அல்லாமல் தீர்க்கதரிசன வேதநூல்களின் தொகுதியைக் குறிக்கும் மேற்கோள் அறிமுகத்தைத் தெளிவுபடுத்துகிறது.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: அவர்கள் எல்லாரும் கடவுளால் கற்பிக்கப்படுவார்கள்
  rationale: எதிர்காலப் பொருளையும் கடவுள் கற்பிப்பவராக இருப்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πᾶς ὁ ἀκούσας
  choice: கேட்ட ஒவ்வொருவரும்
  rationale: தனிப்பட்ட ஒருமையுடன் பொதுவான எல்லைக்குட்பட்ட பொருளைத் தருகிறது; இறுதித் தொடரில் முன்நிகழ்வைக் காட்ட ‘கேட்டு’ என அமைக்கப்பட்டுள்ளது.
- source_word: παρὰ τοῦ πατρὸς
  choice: தந்தையிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமையின் மூலத்தைக் குறிக்கும் பொருளையும் யோவான் நூலுக்குரிய உறவுமுறைப் பெயரையும் காக்கிறது.
- source_word: καὶ μαθὼν
  choice: கற்றுக்கொண்ட
  rationale: கேட்டதுடன் இணைந்த கற்றல், இயேசுவிடம் வருவதற்கு முன்னதாக நிகழ்ந்திருப்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: என்னிடம் வருகிறார்
  rationale: நிகழ்காலத்தையும் இயேசுவை நோக்கிய தனிப்பட்ட அணுகுதலையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: கடவுளின் கற்பித்தலுக்கும் இயேசுவிடம் வருவதற்கும் உள்ள உறவு
  choice: தந்தையிடமிருந்து கேட்டு கற்றுக்கொண்ட ஒவ்வொருவரும் இயேசுவிடம் வருகிறார் என்ற உரையின் தொடர்ச்சி மட்டும் காக்கப்பட்டுள்ளது.
  alternative: இதை முற்றிலும் நிர்ணயவாதமாகவோ, மனிதப் பங்களிப்பை வலியுறுத்தும் கூட்டுச்செயலாகவோ விரித்துரைத்தல்.
  rationale: கிரேக்க உரை உறவைத் தெரிவிக்கிறது; ஆனால் அதன் மறைஇயல் செயல்முறையை விளக்கவில்லை. ஆகவே அந்த இறையியல் அழுத்தமும் தெளிவுபடுத்தப்படாத தன்மையும் பாதுகாக்கப்படுகின்றன.
- issue: ‘தந்தை’க்கும் இயேசுவுக்கும் உள்ள தொடர்பு
  choice: ‘தந்தையிடமிருந்து’ மற்றும் ‘என்னிடம்’ என்பவை நேரடியாகக் காக்கப்பட்டுள்ளன.
  alternative: இயேசுவின் அதிகாரத்தைப் பற்றி வசனம் வெளிப்படையாகச் சொல்லாத கூடுதல் விளக்கத்தைச் சேர்த்தல்.
  rationale: தந்தையிடமிருந்து உண்மையாகக் கேட்டு கற்றல் இயேசுவிடம் வருவதோடு தொடர்புடையது என்ற யோவானிய கிறிஸ்துவியல் வலிமையை விரிவாக்கமின்றிக் காக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியக்கூடிய, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்களின் நூல்கள்’ என்பது வேதத்தின் தீர்க்கதரிசனப் பகுதியை இயல்பாகக் குறிக்கிறது; ‘தந்தை’ என்பது அரிய அல்லது பழமையான ‘பிதா’ என்பதற்குப் பதிலான தெளிவான உறவுமுறைச் சொல்.
