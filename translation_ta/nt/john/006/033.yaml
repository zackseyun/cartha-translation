  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: ta
  text: ஏனெனில், கடவுளின் அப்பம் என்பது வானத்திலிருந்து இறங்கி உலகுக்கு வாழ்வு அளிப்பவரே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்திலிருந்து இறங்கி உலகுக்கு வாழ்வு அளிப்பது.” கிரேக்கச் சொற்றொடரைத் தனிநபரல்லாத பொருளில் இவ்வாறும் புரிந்துகொள்ளலாம்; ஆனால் ஆண்பால் வினையெச்ச வடிவங்கள் தனிநபரைக் குறிக்கும் வாசிப்பை ஆதரிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: அப்பம்
  rationale: உருவகத்தின் அடிப்படையான உணவுப் பொருளைக் குறிக்கும் தெளிவான சொல்லாகவும், யோவான் 6-இன் தொடர்ச்சியைப் பேணுவதாகவும் உள்ளது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: உடைமை அல்லது மூலாதாரம் ஆகிய இரு தொடர்புகளுக்கும் இடமளிக்கும் இயல்பான தமிழ் வேற்றுமைத்தொகை.
- source_word: ὁ καταβαίνων
  choice: இறங்கி வருகிறவர்
  rationale: ஆண்பால் ஒருமைச் சுட்டுடனான வினையெச்சத்தின் தனிநபர் குறிப்பைப் பேணுகிறது; நிகழும்/பண்பியலான செயல் நுணுக்கமும் வெளிப்படுகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: மூலத்தையும் தோற்றத்தையும் குறிக்கும் ἐκ + பிறப்புவேற்றுமையின் இயல்பான தமிழ் வடிவம்.
- source_word: ζωὴν
  choice: வாழ்வு
  rationale: யோவான் எழுத்துகளில் மையமான சொல்லின் எளிமையையும் இறையியல் நிறைவையும் பேணுகிறது.
- source_word: διδοὺς
  choice: கொடுக்கிறவர்
  rationale: முந்தைய வினையெச்சத்துடன் இணைந்த, தொடர்ச்சியான பண்பியலான செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῷ κόσμῳ
  choice: உலகுக்கு
  rationale: κόσμος என்பதன் பரந்த யோவானியப் பயன்பாட்டைப் பேணி, அதை ‘மனிதகுலம்’ அல்லது ‘அனைவரும்’ என்று குறுக்கவில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘கடவுளின் அப்பம்’ என்பதற்குப் பின்வரும் ὁ καταβαίνων ... διδοὺς என்பது தனிநபரைக் குறிக்கிறதா அல்லது பொருளைக் குறிக்கிறதா?
  choice: 'தனிநபர் மொழி: ‘இறங்கி வந்து ... கொடுக்கிறவரே’'
  alternative: ‘வானத்திலிருந்து இறங்கி வந்து உலகுக்கு வாழ்வைக் கொடுப்பதே’
  rationale: கிரேக்கத்தில் பெயர்ச்சுட்டுடன் வரும் வினையெச்சங்கள் ஆண்பால் ஒருமையில் இருப்பதால் தனிநபர் குறிப்பு இயல்பானது; அதேவேளை வேறு இலக்கணப் புரிதலை அடிக்குறிப்பில் வெளிப்படையாகப் பேணுகிறது.
- issue: κόσμος என்பதன் வரம்பு
  choice: ‘உலகம்’ என்ற பரந்த சொல்லைப் பேணுதல்
  alternative: ‘மனிதகுலம்’ அல்லது ‘எல்லா மக்களும்’
  rationale: வசனத்தின் பரந்த சொல்லாட்சியைப் பேணி, வாழ்வு வழங்கப்படுவதன் வரம்பு அல்லது செயல்பாட்டைப் பற்றிய பிந்தைய இறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அப்பம்’, ‘வாழ்வு’, ‘உலகம்’ ஆகிய முக்கிய யோவானியச் சொற்கள் சுருக்கமின்றிப் பேணப்பட்டுள்ளன; ‘வருகிறவர்’ என்பதன் தனிநபர் வலிமையை ‘வருகிறவரே’ என்ற பயனிலை அமைப்பு தெளிவாக்குகிறது.
