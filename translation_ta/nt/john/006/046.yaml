id: JHN.6.46
reference: John 6:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: ta
  text: யாரும் தந்தையைக் கண்டிருக்கிறார்கள் என்பதல்ல; கடவுளிடமிருந்து[a] வந்தவரே தந்தையைக் கண்டிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் முன்னிலையிலிருந்து வந்தவர்” அல்லது “கடவுளோடு இருப்பவர்.” கிரேக்கச் சொற்றொடர் மூலத்துடன் சேர்த்து தனிப்பட்ட அருகாமையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: என்பதல்ல
  rationale: முந்தைய கூற்றை மறுப்பதற்குப் பதிலாக அதற்குத் தெளிவூட்டும் திருத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν πατέρα
  choice: தந்தையை
  rationale: யோவான் நூலில் கடவுளைக் குறிக்கும் உறவுமுறைப் பெயரை நேரடியாகவும் மரியாதையுடனும் வழங்குகிறது.
- source_word: ἑώρακέν τις
  choice: யாரும் ... கண்டிருக்கிறார்கள்
  rationale: எதிர்மறைச் சூழலில் τις என்பதற்கு ‘யாரும்’ இயல்பானது; நிறைவேற்றப்பட்டு தற்போதும் பொருத்தமுள்ள செயலை கிரேக்க perfect குறிப்பிடுவதால் ‘கண்டிருக்கிறார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: இங்கு நிபந்தனையைக் காட்டாமல் ஒரே விதிவிலக்கைக் குறிக்கிறது; தமிழில் ‘மட்டுமே’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὁ ὢν
  choice: வந்தவர்
  rationale: அடுத்துள்ள παρὰ τοῦ θεοῦ உடன் சேர்ந்து ஒருவரின் கடவுளோடான மூல உறவை இயல்பான தமிழில் தெரிவிக்கிறது; தனியே சொற்சொல்லாக ‘இருக்கிறவர்’ என்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: παρὰ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: παρά + genitive இங்கு மூலத்தையோ புறப்பட்டு வருதலையோ குறிக்கலாம். ‘கடவுளிடமிருந்து’ அந்த முதன்மைப் பொருளைக் காக்கிறது; தனிப்பட்ட அருகாமை நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὗτος
  choice: அவரே
  rationale: முன்னர் அடையாளப்படுத்தப்பட்ட ஒருவரை வலியுறுத்திச் சுட்டுகிறது; மரியாதை ஒருமையுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: ἑώρακεν
  choice: கண்டிருக்கிறார்
  rationale: கிரேக்க perfect-இன் நிறைவு மற்றும் நீடிக்கும் பொருத்தத்தைத் தமிழ் நிறைவு வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: παρὰ τοῦ θεοῦ என்பதில் மகனுக்கும் கடவுளுக்கும் உள்ள உறவு
  choice: கடவுளிடமிருந்து வந்தவர்
  alternative: கடவுளின் முன்னிலையிலிருந்து வந்தவர் / கடவுளோடு இருப்பவர்
  rationale: முதன்மை உரை தனித்துவமான தெய்வீக மூலத்தைத் தெரிவிக்கிறது; ஆனால் அந்தச் சொற்றொடருக்கு அப்பாற்பட்ட மேன்மெய்யியல் விளக்கத்தைச் சேர்க்கவில்லை. தனிப்பட்ட அருகாமை அல்லது முன்னிலை என்ற சாத்திய நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தந்தை’ மற்றும் ‘கடவுள்’ வழக்கமான இறையியல் சொற்களாக வைக்கப்பட்டன. முதல் பகுதியில் பொதுப்பொருள் மரியாதைப் பன்மையும், தனித்துவமான நபரைக் குறிக்கும் இரண்டாம் பகுதியில் மரியாதை ஒருமையும் பயன்படுத்தப்பட்டன. அடிக்குறிப்பு குறியீடு தொடர்புடைய இறுதிக் கூற்றுக்குப் பின் இடப்பட்டது.
