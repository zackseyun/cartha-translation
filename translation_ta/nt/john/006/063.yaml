reference: John 6:63
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: ta
  text: உயிரளிப்பவர் ஆவியானவரே[a]; மாம்சம் ஒன்றுக்கும் உதவாது[b]. நான் உங்களிடம் பேசியிருக்கிற வார்த்தைகள் ஆவியும் உயிரும் ஆகும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிரளிப்பது ஆவியே.” கிரேக்கச் சொல் பரிசுத்த ஆவியையோ பொதுவாக ‘ஆவி’யையோ குறிக்கலாம்; இங்கு சூழல் பரிசுத்த ஆவியைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: alternative_reading
  - marker: b
    text: “மாம்சம்” என்பது வெறும் மனித இயல்பு அல்லது மனித ஆற்றலை விரிவாகக் குறிக்கலாம். இங்கு அதை “பாவ இயல்பு” என்று மொழிபெயர்ப்பது கிரேக்கம் தெளிவாகக் கூறுவதைவிட அதிக விளக்கத்தைச் சேர்க்கும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஆவியானவரும் உயிரும் ஆகும்,” அல்லது “ஆவிக்குரியவையும் உயிரளிப்பவையும் ஆகும்.” கிரேக்கச் சொல்லாட்சி செறிவானதும் பண்புசார் பொருளுடையதுமாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: யோவான் நற்செய்தியின் சூழலும் definite article-உம் இங்கு பரிசுத்த ஆவியைக் குறிக்கும் வாய்ப்பை வலுப்படுத்துகின்றன. தமிழில் ஆள்தன்மையை இயல்பாக வெளிப்படுத்த ‘ஆவியானவர்’ பயன்படுத்தப்பட்டது; பொதுவான ‘ஆவி’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: ζῳοποιοῦν
  choice: உயிரளிப்பவர்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் உயிரூட்டும் அல்லது உயிரளிக்கும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἡ σὰρξ
  choice: மாம்சம்
  rationale: உடல், வெறும் மனித இயல்பு அல்லது மனித ஆற்றல் போன்ற பல நிழற்பொருள்களை முன்கூட்டியே ஒன்றாகத் தீர்மானிக்காமல், மூலத்தின் விரிந்த உருவகத் தன்மையையும் ஆவி–மாம்சம் எதிர்மறையையும் காக்கிறது.
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: ஒன்றுக்கும் உதவாது
  rationale: முழுமையான மறுப்பைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ ῥήματα
  choice: வார்த்தைகள்
  rationale: பேசப்பட்ட கூற்றுகளைக் குறிக்கும் இயல்பான நேரடி தமிழ் இணை.
- source_word: λελάληκα
  choice: பேசியிருக்கிற
  rationale: கிரேக்க நிறைவுக் காலத்தின் கடந்த செயலும் தொடரும் பொருத்தமும் தமிழின் நிறைவு வடிவில் காக்கப்படுகின்றன.
- source_word: πνεῦμά ἐστιν
  choice: ஆவியாயும் ... இருக்கின்றன
  rationale: article இல்லாத predicate-இன் பண்புசார், செறிவான சொல்லாட்சியை ‘ஆவிக்குரியவை’ அல்லது ‘ஆவியானவர்’ என விளக்கித் தீர்க்காமல் காக்கிறது.
- source_word: ζωή
  choice: வாழ்வு
  rationale: யோவானின் சொற்பயன்பாட்டில் ஆழமுள்ள ‘life’ கருத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: முதல் வாக்கியத்திலுள்ள πνεῦμα என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: பொதுவான ‘ஆவி’ அல்லது மனித ஆவி
  rationale: யோவான் நற்செய்தியின் உயிரளிக்கும் ஆவி பற்றிய சூழலும் definite article-உம் பரிசுத்த ஆவியைக் குறிப்பதாக வலியுறுத்துகின்றன; இருப்பினும் சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: ஆவிக்கு எதிராக வரும் σὰρξ என்பதன் பொருள்
  choice: விரிந்த பொருளைத் தக்கவைக்கும் ‘மாம்சம்’
  alternative: பாவ இயல்பு, வெறும் மனித ஆற்றல், அல்லது உடல்
  rationale: ஒரு குறிப்பிட்ட மனிதவியல் அல்லது சமயவியல் விளக்கத்தை வசனத்தில் சேர்க்காமல், மூல உரையின் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: இறுதி வாக்கியத்திலுள்ள πνεῦμά ἐστιν என்பதன் predicate force
  choice: 'பண்புசார் வாசிப்பு: ‘ஆவியாயும் வாழ்வாயும் இருக்கின்றன’'
  alternative: ‘ஆவியானவரும் வாழ்வும் ஆகும்’ என்ற அடையாளப்படுத்தும் வாசிப்பு அல்லது ‘ஆவிக்குரியவையும் உயிரளிப்பவையும்’ என்ற விளக்க வாசிப்பு
  rationale: article இல்லாத predicate பண்புசார் பொருளுக்கு ஏற்றது. மொழிபெயர்ப்பு கிரேக்கத்தின் செறிவைத் தக்கவைத்து மிகை விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘மாம்சம்’ மற்றும் இறுதி ‘ஆவி/வாழ்வு’ இணைப்பு திட்டமிட்டு விளக்கித் தீர்க்கப்படாமல் வைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
