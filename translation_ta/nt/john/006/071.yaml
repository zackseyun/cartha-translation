source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: ta
  text: அவர் இஸ்காரியோத் சீமோனின் மகன் யூதாஸைப் பற்றிப் பேசிக்கொண்டிருந்தார்; ஏனெனில், பன்னிருவரில் ஒருவனான அவனே அவரைக் காட்டிக்கொடுக்கவிருந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்ந்தபடி, “அவரை ஒப்படைக்க.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: அவர் … யூதாசைப் பற்றிப் பேசிக்கொண்டிருந்தார்
  rationale: ἔλεγεν என்ற இறந்தகாலத் தொடர்வினையின் விளக்கத் தன்மையை “பேசிக்கொண்டிருந்தார்” இயல்பாக வெளிப்படுத்துகிறது. δὲ இங்கு வலுவான எதிர்மறையைச் சுட்டாததால் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: இஸ்காரியோத் சீமோனின் மகன்
  rationale: இரண்டு பிறப்புப்பெயர் வடிவங்களும் யூதாசைத் தந்தைவழி அடையாளப்படுத்துகின்றன; “இஸ்காரியோத்” என்பதை சீமோனோடு இணைக்கும் கிரேக்க இலக்கண உறவு காக்கப்பட்டுள்ளது.
- source_word: οὗτος γὰρ
  choice: ஏனெனில் … அவனே
  rationale: γὰρ தரும் விளக்கக் காரணத்தை “ஏனெனில்” வெளிப்படுத்துகிறது; οὗτος என்பதன் சுட்டும் வலியுறுத்தலை “அவனே” இயல்பான தமிழில் காக்கிறது.
- source_word: ἔμελλεν
  choice: …விருந்தான்
  rationale: நடக்கவிருந்த எதிர்காலச் செயலைக் குறிக்கிறது; விதிநியமம் அல்லது உள்ளார்ந்த நோக்கம் என்ற கூடுதல் கருத்தை ஏற்றவில்லை.
- source_word: παραδιδόναι αὐτόν
  choice: அவரைக் காட்டிக்கொடுக்க
  rationale: யோவானின் பாடுபாட்டு நிகழ்வுச் சூழலில் இச்சொல் யூதாசின் துரோகச் செயலைக் குறிக்கிறது. அதேவேளை, “ஒப்புக்கொடுக்க” என்ற சொற்சார்ந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவனான
  rationale: துரோகம் செய்யவிருந்தவன் பன்னிருவரில் ஒருவன் என்ற அதிர்ச்சியூட்டும் அடையாளத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: யூதாசின் செயலைக் குறிக்கும் παραδιδόναι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுக்க
  alternative: ஒப்புக்கொடுக்க
  rationale: சூழலில் இச்செயல் துரோகமாக அமைகிறது என்பதைக் “காட்டிக்கொடுக்க” தெளிவாக்குகிறது; ஆனால் மூலவினையின் நேரடியான ‘ஒப்படைத்தல்’ பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மையான “அவர்” என்றும், யூதாசைக் குறிக்கும் இடத்தில் “அவன்” என்றும் வைத்து பிரதிப்பெயர் குழப்பம் தவிர்க்கப்பட்டுள்ளது.
