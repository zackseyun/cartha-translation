id: JHN.6.25
reference: John 6:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: ta
  text: அவர்கள் அவரைக் கடலின் மறுகரையில் கண்டபோது, அவரிடம், “ரபீ, நீங்கள் எப்போது இங்கு வந்தீர்கள்?” என்று சொன்னார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “நீங்கள் எப்போது இங்கு வந்துள்ளீர்கள்?” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நிறைவுக்கால வினை பயன்படுத்தப்பட்டுள்ளது; இச்சூழலில் அதன் இயல்பான பொருள் இங்கு வந்து சேர்ந்த நேரத்தைப் பற்றிய கேள்வியாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: கண்டபோது
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையை, தமிழில் இயல்பான காலத் தொடர்புடன் தெரிவிக்கிறது.
- source_word: πέραν τῆς θαλάσσης
  choice: கடலின் மறுகரையில்
  rationale: கடலுக்கு அப்பால் உள்ள இடத்தைக் குறிக்கும் கிரேக்கத் தொடரை, முந்தைய நிகழ்வுகளின் புவியியல் எதிர்மறையைத் தெளிவாகக் காக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: யூதச் சூழலையும் நேரடி அழைப்பில் வரும் குறிப்பிட்ட மரியாதைப் பட்டத்தையும் காக்க ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; ‘போதகரே’ என்பது விளக்கமான மொழிபெயர்ப்பாகிவிடும்.
- source_word: πότε
  choice: எப்போது
  rationale: காலத்தை விசாரிக்கும் சொல்லின் நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: ὧδε
  choice: இங்கு
  rationale: இடத்தைக் குறிக்கும் வினையடையின் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: γέγονας
  choice: வந்தீர்கள்
  rationale: γίνομαι என்பதன் நிறைவுக்கால வடிவம் இச்சூழலில் ஓர் இடத்துக்கு வந்து சேர்ந்திருப்பதைக் குறிக்கிறது; தமிழில் ‘வந்தீர்கள்’ என்பது இயல்பாக அந்த வருகைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: Καὶ
  choice: —
  rationale: தமிழ் கதைநடையில் வசனத் தொடக்க இணைப்பைத் தனியே ‘மேலும்’ அல்லது ‘அப்போது’ எனச் சேர்ப்பது தேவையற்ற பொருள் நிழலை உண்டாக்கலாம்; நிகழ்வுகளின் தொடர்ச்சி ‘கண்டபோது’ என்ற அமைப்பிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: εἶπον αὐτῷ
  choice: அவரிடம் … என்று கேட்டார்கள்
  rationale: கிரேக்கத்தில் பொதுவான ‘சொன்னார்கள்’ என்ற வினை இருந்தாலும், அதன் உள்ளடக்கம் நேரடியான கேள்வி என்பதால் நவீன தமிழில் ‘கேட்டார்கள்’ என்பது இயல்பான உரையாடல் வடிவம்; பேசப்பட்ட சொற்கள் மாற்றமின்றி காக்கப்படுகின்றன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மையான ‘நீங்கள்/வந்தீர்கள்’ நேரடி அழைப்பின் மரியாதைத் தன்மையை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் கேள்விக்குப் பின் வைக்கப்பட்டுள்ளது.
