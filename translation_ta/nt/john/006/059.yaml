base_translation:
  language: en
  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: ta
  text: அவர் கப்பர்நகூமில் உள்ள ஜெபக்கூடத்தில் போதித்தபோது இவற்றைக் கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: இவற்றை
  rationale: நடுநிலைப் பன்மைச் சுட்டுப்பெயர் முந்தைய உரையில் கூறப்பட்ட பல கருத்துகளைக் குறிக்கிறது; பன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἶπεν
  choice: அவர் கூறினார்
  rationale: λέγω என்பதன் இறந்தகால வடிவத்துக்கு இயல்பான நேரடி மொழிபெயர்ப்பு. கிரேக்கத்தில் எழுவாய் மறைமுகமாகவும் சூழலில் இயேசுவாகவும் இருப்பதால் பெயரைச் சேர்க்காமல் ‘அவர்’ என வழங்கப்படுகிறது.
- source_word: ἐν συναγωγῇ
  choice: உள்ள ஜெபக்கூடத்தில்
  rationale: கப்பர்நகூமில் அமைந்த குறிப்பிட்ட ஜெபக்கூடத்தைச் சூழல் சுட்டுகிறது. தமிழில் இடத்தொடரை இயல்பாக்க ‘கப்பர்நகூமில் உள்ள’ என இணைக்கப்பட்டுள்ளது.
- source_word: διδάσκων
  choice: போதித்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினை முதன்மை வினையுடன் ஒரே நேரத்தில் நடந்த செயலைக் குறிக்கிறது; ‘போதித்தபோது’ அந்த காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν Καφαρναούμ
  choice: கப்பர்நகூமில்
  rationale: இடப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டு, ‘இல்’ வேற்றுமை உருபால் இடப்பொருள் காட்டப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் தகவல் வரிசையைத் தமிழுக்கு இயல்பாக மாற்றி, இடத்தொடர் ஜெபக்கூடத்துடன் இணைக்கப்பட்டது.
