source:
  edition: SBLGNT
  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: ta
  text: ஆகவே, அவர்கள் அவற்றைச் சேகரித்து, சாப்பிட்ட பின் மீதமிருந்த ஐந்து வாற்கோதுமை அப்பங்களின் துண்டுகளால் பன்னிரண்டு கூடைகளை நிரப்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “சாப்பிட்டவர்களுக்கு மிகுதியாக இருந்தவை.” கிரேக்கத் தொடரின் பொருள், அவர்கள் சாப்பிட்ட பின் மீதமிருந்த துண்டுகள் என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: ஆகவே, அவர்கள் அவற்றைச் சேகரித்து
  rationale: οὖν முந்தைய கட்டளையின் விளைவைக் குறிக்கிறது; ‘ஆகவே’ அந்தத் தொடர்பைப் பேணுகிறது. வினையின் சூழலால் உணரப்படும் பொருள் தமிழில் இயல்புக்காக ‘அவற்றை’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: பன்னிரண்டு கூடைகளை நிரப்பினார்கள்
  rationale: வினை மற்றும் எண்ணிக்கையை நேரடியாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தருகிறது; κοφίνους என்பதற்கு பொதுவான ‘கூடைகள்’ போதுமானது.
- source_word: κλασμάτων
  choice: துண்டுகளால்
  rationale: உடைக்கப்பட்ட அப்பத்தின் மீதித் துண்டுகளை இயல்பாகக் குறிக்கிறது; ‘சிதறல்கள்’ போன்ற சொற்களைவிட உணவுச் சூழலில் தெளிவானது.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: ஐந்து வாற்கோதுமை அப்பங்களின்
  rationale: ἐκ இங்கு துண்டுகளின் மூலத்தைச் சுட்டுகிறது. κριθίνων என்பதன் குறிப்பிட்ட தானியப் பொருளை ‘வாற்கோதுமை’ என்றும் ἄρτων என்பதை இச்சூழலில் ‘அப்பங்கள்’ என்றும் வழங்குகிறது.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: சாப்பிட்டவர்களுக்கு எஞ்சியிருந்த
  rationale: கிரேக்கத்தில் உள்ள ‘சாப்பிட்டவர்களுக்கு மிகுதியாக/எஞ்சியிருந்தவை’ என்ற உறவைப் பேணுகிறது. ‘அவர்கள் விட்டுச்சென்ற’ என்று காரணத்தை மிகையாகத் தீர்மானிக்காமல், எஞ்சிய நிலையை மட்டும் கூறுகிறது.
theological_decisions:
- issue: மீதியான துண்டுகளுக்கும் சாப்பிட்டவர்களுக்கும் இடையிலான உறவு
  choice: சாப்பிட்டவர்களுக்கு எஞ்சியிருந்த
  alternative: சாப்பிட்டவர்கள் விட்டுச்சென்ற
  rationale: τοῖς βεβρωκόσιν என்பது இலக்கணரீதியாக ‘சாப்பிட்டவர்களுக்கு’ எனும் தொடர்பைத் தருகிறது; அவர்கள் வேண்டுமென்றே விட்டனர் என்ற பொருளை மூலவசனம் வெளிப்படையாகக் கூறாததால் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘பார்லி’ என்ற கடன்சொல்லுக்குப் பதிலாகத் துல்லியமான தமிழ் தானியப்பெயரான ‘வாற்கோதுமை’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
