  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: ta
  text: நானே வாழ்வின் அப்பம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: நானே
  rationale: தமிழில் பெயர்ப்பயனிலையுடன் வரும் நிகழ்கால அடையாள வாக்கியத்தில் ‘இருக்கிறேன்’ என்ற இணைப்புவினை இயல்பாக விடுபடும். தனியாக இடம்பெற்ற ἐγώ என்பதன் வெளிப்படையான, வலியுறுத்தும் தன்மையை ‘நானே’ இயல்பாகக் கொண்டுவருகிறது.
- source_word: ὁ ἄρτος
  choice: அப்பம்
  rationale: ἄρτος என்பதற்கான இயல்பான, மரியாதைநடையிலான வேதாகமத் தமிழ் சொல் ‘அப்பம்.’ கிரேக்க வரையறைச் சுட்டின் அடையாளப்படுத்தும் வலிமை, தமிழில் தனிச் சுட்டுச் சொல்லால் அல்லாமல் ‘நானே … அப்பம்’ என்ற வாக்கிய அமைப்பால் வெளிப்படுகிறது.
- source_word: τῆς ζωῆς
  choice: வாழ்வின்
  rationale: மூலத்தின் சுருக்கமான உரிமை/தொடர்பு வேற்றுமை அமைப்பைப் பாதுகாக்கிறது. ‘வாழ்வை அளிக்கும்’ என்பது சாத்தியமான பொருளை விளக்கினாலும், மூலத்தில் உள்ள இறுக்கமான தொடர்பை விரித்துரைக்கும்.
theological_decisions:
- issue: யோவான் நற்செய்தியின் ‘நான்’ அடையாளக் கூற்றின் வலிமை
  choice: ‘நானே வாழ்வின் அப்பம்’ என்று நேரடியான அடையாளக் கூற்றாக மொழிபெயர்த்தல்
  alternative: ‘நான் வாழ்வின் அப்பமாக இருக்கிறேன்’
  rationale: இங்கு ἐγώ εἰμι தனித்து நிற்காமல் ‘அப்பம்’ என்ற பயனிலையுடன் வருகிறது. ‘நானே’ இயேசுவின் வலுவான சுயஅடையாளத்தைப் பேணுகிறது; அதேவேளை மூலத்தில் இல்லாத கூடுதல் இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ‘வாழ்வு’ மற்றும் ‘அப்பம்’ இடையிலான தொடர்பு
  choice: ‘வாழ்வின் அப்பம்’ என்ற தெளிவுபடுத்தப்படாத தொடர்பைப் பேணுதல்
  alternative: ‘வாழ்வை அளிக்கும் அப்பம்’
  rationale: τῆς ζωῆς என்ற பிறப்புவேற்றுமை வாழ்வை அளித்தல், வாழ்வுக்குரியதாக இருத்தல், அல்லது வாழ்வுடன் அடையாளத் தொடர்பு ஆகிய நுண்மைகளைத் தாங்கலாம். மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் மூலத்தின் இறையியல் செறிவைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. ‘ஜீவ அப்பம்’ என்ற மரபுவழிப் பதத்திற்கு மாற்றாக, இன்றைய பொதுவாசகருக்கு இயல்பாகப் புரியும் ‘வாழ்வின் அப்பம்’ பயன்படுத்தப்பட்டுள்ளது.
