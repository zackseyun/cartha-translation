source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: ta
  text: ஆகவே யூதர்கள்[a], “நாம் உண்பதற்காக இந்த மனிதன் தன் சதையை[b] நமக்கு எப்படிக் கொடுக்க முடியும்?” என்று தங்களுக்குள் வாதாடிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யூதேயர்கள்”; சூழலின்படி “யூதத் தலைவர்கள்.” கிரேக்க மூலத்தில் பொதுவாக “யூதர்கள்” என்றே உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது “உடல்.” கிரேக்கச் சொல் σάρξ என்பதன் நேரடிப் பொருள் “சதை”; இப்பகுதியின் திட்டவட்டமான சொல்லாட்சியையும் பதற்றத்தையும் காக்க அது இங்கே பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: வாக்குவாதம் செய்து
  rationale: முற்றுப்பெறாத இறந்தகால வினை நீடித்த மோதலைக் குறிக்கிறது. இங்கு உடல் ரீதியான சண்டையைவிடச் சொல் மோதலே பொருத்தமானதால் ‘வாக்குவாதம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து விளைந்த அடுத்த நிகழ்வை இணைக்கும் காரண/தொடர்ச்சி வலிமையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πρὸς ἀλλήλους
  choice: தங்களுக்குள்
  rationale: ஒருவரோடு ஒருவர் மோதிக்கொண்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ Ἰουδαῖοι
  choice: யூதர்கள்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைக்கிறது; சூழல்சார்ந்த குறுகிய பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: அவர்களின் வாக்குவாதத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பங்கேற்பு வினையை இயல்பான தமிழ் நேரடி உரை அமைப்பில் வழங்குகிறது.
- source_word: Πῶς δύναται
  choice: எப்படிக் கொடுக்க முடியும்
  rationale: சாத்தியம் அல்லது ஆற்றலைக் கேள்விக்குள்ளாக்கும் கிரேக்கக் கேள்வியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὗτος
  choice: இவன்
  rationale: ‘இந்த மனிதன்’ என்பதைக் காட்டிலும் இயல்பான தமிழில் பேசுபவர்களின் விலகிய, சற்றே இகழ்ச்சியான தொனியைத் தக்கவைக்கிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: ‘கொடுக்க’ என்ற வினையின் மறைமுகச் செயப்படுபொருளை வெளிப்படையாகக் காட்டுகிறது.
- source_word: δοῦναι
  choice: கொடுக்க
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: τὴν σάρκα αὐτοῦ
  choice: தன் சதை
  rationale: σάρξ என்பதன் உடல்சார்ந்த, திட்டவட்டமான சொல்லாட்சியையும் இப்பகுதியின் அதிர்ச்சியூட்டும் பதற்றத்தையும் ‘உடல்’ என்று விளக்கிவிடாமல் தக்கவைக்கிறது.
- source_word: φαγεῖν
  choice: உண்பதற்கு
  rationale: ‘கொடுக்க’ என்பதுடன் இணையும் நோக்க/நிறைவு வினையெச்சத்தை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: இறையியல் பதற்றம் நிறைந்த சூழலில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: சதை
  alternative: உடல்
  rationale: கேட்பவர்கள் இயேசுவின் வார்த்தைகளைத் திட்டவட்டமான உடல்சார்ந்த பொருளில் எதிர்கொள்கிறார்கள். ‘சதை’ என்பது கிரேக்கச் சொல்லின் உருவகத்தையும் பகுதியின் பதற்றத்தையும் காக்கிறது; குறிப்பிட்ட திருவிருந்து விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்துவதில்லை.
- issue: யோவானில் οἱ Ἰουδαῖοι என்பதன் குறிப்பு எல்லை
  choice: யூதர்கள்
  alternative: யூதேயர்கள்; யூதத் தலைவர்கள்
  rationale: வசனம் பயன்படுத்தும் பொதுவான கிரேக்கச் சொல்லை முதன்மை உரை குறுக்காமல் வழங்குகிறது. சூழலால் சாத்தியமான குறுகிய குறிப்புகள் வெளிப்படைத்தன்மைக்காக அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இவன்’ என்பது οὗτος-இன் விலகிய தொனியை இயல்பாகக் காட்டுகிறது; ‘சதை’ மூலத்தின் திட்டவட்டத்தைக் காக்கிறது.
