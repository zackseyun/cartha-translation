id: JHN.6.15
reference: John 6:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: ta
  text: ஆகவே, அவர்கள் வந்து அவரை வலுக்கட்டாயமாகப் பிடித்து அரசராக்கப் போகிறார்கள் என்பதை இயேசு அறிந்து, மீண்டும் தனியாக மலைக்கு விலகிச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் தொடர்ச்சியையும் அதிலிருந்து எழும் விளைவையும் இயல்பாகக் குறிக்கிறது.
- source_word: γνοὺς
  choice: அறிந்து
  rationale: இயேசுவின் அடுத்த செயலைத் தூண்டிய சூழ்நிலையை இறந்தகால வினையெச்சமாக நேரடியாக வெளிப்படுத்துகிறது.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: அவர்கள் வந்து … போகிறார்கள்
  rationale: உடனடியாக நிகழவிருந்த செயலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἁρπάζειν
  choice: வலுக்கட்டாயமாகப் பிடித்து
  rationale: வினைச்சொல்லில் உள்ள பலவந்தமான, கட்டாயப்படுத்தும் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: அரசராக்க
  rationale: அவர்கள் அவரைப் பிடிக்க நினைத்த நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: அந்தச் சூழலிலிருந்து அகன்று சென்றார் என்ற உடல் இயக்கத்தையும் தவிர்த்துச் சென்ற நுண்ணுணர்வையும் காக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: மறுபடியும் நிகழ்ந்த இயக்கத்தை நேரடியாகக் குறிக்கிறது.
- source_word: εἰς τὸ ὄρος
  choice: மலைக்கு
  rationale: கிரேக்கத்தின் பொதுவான இடக் குறிப்பை மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: αὐτὸς μόνος
  choice: தனியாக
  rationale: இயேசு வேறு யாருமின்றித் தாமே சென்றார் என்ற வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவை அரசராக்க மக்கள் மேற்கொள்ள நினைத்த செயலின் தன்மை
  choice: அவரை வலுக்கட்டாயமாகப் பிடித்து அரசராக்க முயன்றதாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவரைக் கொண்டுபோய் அரசராக்க
  rationale: ἁρπάζειν என்பது வெறும் அழைப்பையோ விருப்பத்தையோ அல்ல, பலவந்தமான பிடித்தலைக் குறிக்கிறது; எனவே அரசியல் சார்ந்த கட்டாய நடவடிக்கையை மென்மையாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தம்மை’ என்பது இயேசுவை மரியாதையுடன் சுட்டுகிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
