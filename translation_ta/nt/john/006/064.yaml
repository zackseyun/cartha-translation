source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: ta
  text: “ஆனால் உங்களில் சிலர் நம்புவதில்லை.” ஏனெனில், நம்பாதவர்கள் யார் என்றும், அவரைக் காட்டிக்கொடுக்கப் போகிறவன்[a] யார் என்றும் இயேசு தொடக்கத்திலிருந்தே அறிந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காட்டிக்கொடுக்கப் போகிறவன்” என்பதற்கு இன்னும் நேரடியாக, “அவரை ஒப்படைக்கப் போகிறவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுக்கு எதிர்மாறான கருத்தை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ἐξ ὑμῶν
  choice: உங்களில்
  rationale: பேசப்படுகிற குழுவுக்குள் உள்ள சிலரைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: τινες
  choice: சிலர்
  rationale: கேட்போரில் குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கிறது.
- source_word: οἳ οὐ πιστεύουσιν
  choice: நம்புவதில்லை
  rationale: நிகழ்காலத்தில் தொடரும் நம்பாமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ᾔδει
  choice: அறிந்திருந்தார்
  rationale: கடந்தகாலத்தில் நிலைத்திருந்த அறிவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξ ἀρχῆς
  choice: தொடக்கத்திலிருந்தே
  rationale: எந்தத் தொடக்கம் என்று தேவையின்றி வரையறுக்காமல் மூலத்தின் காலப் பொருளையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: οἱ μὴ πιστεύοντες
  choice: நம்பாதவர்கள்
  rationale: நம்பாமையால் அடையாளப்படுத்தப்படும் நபர்களைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்பு வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: παραδώσων
  choice: காட்டிக்கொடுக்கப்போகிறவன்
  rationale: எதிர்காலச் செயலைக் காக்கிறது; யூதாசின் துரோகச் செயலைச் சூழலுக்கேற்ற தமிழில் தெரிவிக்கிறது. நேரடியான ‘ஒப்படைக்க’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτόν
  choice: தம்மை
  rationale: வாக்கியத்தின் எழுவாயான இயேசுவையே சுட்டுவதால், தமிழின் இயல்பான தற்சுட்டுப் பெயர்ச்சொல் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: சீடர்கள் இயேசுவுக்கு அளிக்கும் பதிலின் சூழலில் πιστεύω என்பதன் மொழிபெயர்ப்பு
  choice: நம்பு
  alternative: நம்பிக்கை வை
  rationale: யோவான் நூலில் அறிவுசார் ஏற்றுக்கொள்ளுதலையும் உறவுசார் நம்பிக்கையையும் உள்ளடக்கக்கூடிய பரந்த, நிலையான தமிழ் சொல் ‘நம்பு’; பொருளை ஒரு கோணத்திற்கு மட்டும் சுருக்கவில்லை.
- issue: யூதாசைக் குறிக்கும் παραδίδωμι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடு
  alternative: ஒப்படை
  rationale: இச்சூழலில் இயேசுவைத் துரோகமாக எதிரிகளிடம் ஒப்படைக்கும் செயலை ‘காட்டிக்கொடு’ இயல்பாகத் தெரிவிக்கிறது; மூலச்சொல்லின் நேரடியான ‘ஒப்படை’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘தொடக்கத்திலிருந்தே’ என்பது தொடக்கத்தின் குறிப்பிட்ட எல்லையை விளக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது. அடிக்குறி [a] தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
