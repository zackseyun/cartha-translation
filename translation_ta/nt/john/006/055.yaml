base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: ta
  text: ஏனெனில், என் மாம்சம் மெய்யான உணவும், என் இரத்தம் மெய்யான பானமும் ஆகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிஜமான உணவு” மற்றும் “நிஜமான பானம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றை விளக்கும் γάρ என்பதன் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: இரத்தம் என்பதுடன் இணையாக வரும் சொல்லை விளக்கவுரையாக ‘உடல்’ என்று மாற்றாமல், மூலத்தின் நேரடித் தன்மையைக் காக்கிறது.
- source_word: ἀληθής
  choice: மெய்யான
  rationale: யோவானின் சொற்பயன்பாட்டிலுள்ள ‘உண்மையான/நிஜமான’ என்ற நுண்பொருள் பரப்பையும் இறையியல் அழுத்தத்தையும், ஒரு குறிப்பிட்ட திருவிருந்து விளக்கத்திற்குள் சுருக்காமல் காக்கிறது.
- source_word: βρῶσις
  choice: உணவு
  rationale: இச்சூழலில் செயலைக் குறிக்கும் ‘உண்ணுதல்’ என்பதைவிட, πόσις உடனான இணை அமைப்பில் உண்ணப்படுவதைக் குறிக்கும் ‘உணவு’ இயல்பாகிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: மூலத்தின் மாம்சம்–இரத்தம் இணை அமைப்பை நேரடியாகக் காக்கிறது.
- source_word: πόσις
  choice: பானம்
  rationale: குடிக்கும் செயலைவிட குடிக்கப்படுவதைக் குறிக்கும் பெயர்ச்சொல் இங்கு பொருத்தம்; ‘உணவு’ என்பதற்கு இயல்பான இணையாகவும் அமைகிறது.
theological_decisions:
- issue: திருவிருந்து சார்ந்த சூழலில் ἀληθής என்பதை எவ்வாறு மொழிபெயர்ப்பது
  choice: மெய்யான
  alternative: நிஜமான
  rationale: ‘மெய்யான’ என்பது கிரேக்கச் சொல்லின் நேரடி அழுத்தத்தைக் காத்து, வசனத்தின் திருவிருந்து சார்ந்த இறையியல் விளைவுகளை மொழிபெயர்ப்பிலேயே ஒரு குறிப்பிட்ட கோட்பாடாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய dignified நடையைப் பயன்படுத்துகிறது. ‘மாம்சம்’ என்பது இங்கு சற்றே உயர்நடைச் சொல்லாக இருந்தாலும் σάρξ–αἷμα இணைப்பையும் பாரம்பரிய இறையியல் ஒலியையும் துல்லியமாகக் காக்கிறது; ‘பானம்’ என்பது πόσις-ஐ பெயர்ச்சொல் பொருளில் இயல்பாக வழங்குகிறது.
