language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “பன்னிருவராகிய உங்களைத் தேர்ந்தெடுத்தது நான் அல்லவா? ஆனாலும் உங்களில் ஒருவன் பிசாசாக இருக்கிறான்[a]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவதூறு பேசுகிறவனாக இருக்கிறான்.” கிரேக்கச் சொல் பொய்க்குற்றம் சாட்டுகிறவனைக் குறிக்கலாம்; பல சூழல்களில் பிசாசையும் குறிக்கிறது. இங்கு இது சாத்தானோடு நேரடியாக அடையாளப்படுத்துவதைவிடப் பண்பை விவரிக்கும் சொல்லாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்தார்
  rationale: யோவானின் உரையாடல் நடையில் வரும் வழக்கமான பதிலுரைக்கும் வினைச்சொல்லை இயல்பான, கண்ணியமான நவீனத் தமிழில் தருகிறது.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: தேர்ந்தெடுத்தது நான் அல்லவா?
  rationale: οὐκ கொண்ட வினா ஆம் என்ற பதிலை எதிர்பார்க்கும் வலியுறுத்தலையும், ἐγώ என்பதன் ‘நான்’ என்ற அழுத்தத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: பன்னிருவராகிய உங்களை
  rationale: τοὺς δώδεκα என்பது அங்கீகரிக்கப்பட்ட சீடர் குழுவைக் குறிக்கிறது; தமிழில் அடைமொழித் தொடராக வழங்குவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: καὶ
  choice: ஆனாலும்
  rationale: இணைப்புச் சொல்லின் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், தேர்ந்தெடுக்கப்பட்ட பன்னிருவரில் ஒருவன் எதிர்மறையாக இருப்பதைச் சுட்டும் சூழல்சார் முரண்பாட்டை ‘ஆனாலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξ ὑμῶν
  choice: உங்களில்
  rationale: பகுதிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διάβολός
  choice: பிசாசாக
  rationale: பெயர்ச்சொல் குறிப்பிட்ட சாத்தானை நேரடியாக அடையாளப்படுத்தாமல் பண்புரீதியாக நிற்பதை ‘பிசாசாக இருக்கிறான்’ காக்கிறது; அதேவேளை கிரேக்கச் சொல்லின் கடுமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: διάβολός என்பது சாத்தானோடு நேரடி அடையாளப்படுத்தலா அல்லது பண்புரீதியான விவரிப்பா?
  choice: பிசாசாக இருக்கிறான்
  alternative: அவதூறு பேசுகிறவனாக இருக்கிறான்; பிசாசே அவன்
  rationale: διάβολος இங்கு சுட்டுருபின்றிப் பயனிலைப் பெயராக வருவதால், குறிப்பிட்ட ‘பிசாசு/சாத்தான்’ என்ற நேரடி அடையாளத்தைவிட பண்புரீதியான வலிமை உள்ளது. தமிழ் மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பன்னிருவராகிய’ என்பது குழுவின் அடையாளத்தைத் தெளிவாக்குகிறது; ‘பிசாசாக இருக்கிறான்’ என்பது மூலத்தின் அதிர்ச்சியூட்டும் வலிமையையும் பண்புரீதியான தெளிவின்மையையும் காக்கிறது.
