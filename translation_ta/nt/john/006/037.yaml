  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: ta
  text: தந்தை எனக்குக் கொடுப்பதெல்லாம் என்னிடம் வரும்; என்னிடம் வருபவரை நான் ஒருபோதும் வெளியே தள்ளிவிட மாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக வெளியே தள்ளிவிட மாட்டேன்.” கிரேக்கத்தில் இங்கு வலியுறுத்தப்பட்ட மறுப்பு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: கொடுப்பதெல்லாம்
  rationale: நடுநிலை ஒருமை வடிவிலுள்ள கூட்டுப்பொருளைப் பாதுகாக்கிறது; அதை நேரடியாக ‘ஒவ்வொருவரும்’ என்று தனிநபர்களாக்குவதில்லை.
- source_word: δίδωσίν μοι
  choice: எனக்குக் கொடுப்பது
  rationale: நிகழ்கால வினையின் எளிய தன்மையைப் பேணுகிறது; தொடர்ந்து கொடுக்கிறார் அல்லது ஏற்கெனவே கொடுத்துவிட்டார் என்று மேலதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: ὁ πατήρ
  choice: தந்தை
  rationale: கிரேக்கத்தில் வெளிப்படையான ‘என்’ இல்லை; யோவான் நற்செய்தியின் பயன்பாட்டுக்கு ஏற்ப ‘தந்தை’ என வழங்கப்படுகிறது.
- source_word: πρὸς ἐμὲ ἥξει
  choice: என்னிடம் வரும்
  rationale: தமிழில் இயல்பாகவும், இயேசுவிடம் வருதல் என்ற யோவானிய கருத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: τὸν ἐρχόμενον πρός με
  choice: என்னிடம் வருகிறவரை
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: நான் ஒருபோதும் வெளியே தள்ளிவிட மாட்டேன்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும், ἐκβάλω ἔξω என்பதன் வெளியேற்றும் பொருளையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πᾶν ὃ என்ற நடுநிலை ஒருமைக் கூட்டுத்தொடரும், தெய்வீகக் கொடுத்தலும் மனிதர் வருதலும்
  choice: ‘தந்தை எனக்குக் கொடுப்பதெல்லாம்’ என்று கூட்டுப்பொருளாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தந்தை எனக்குக் கொடுக்கிற ஒவ்வொருவரும்’
  rationale: மூலத்தின் நடுநிலை ஒருமைக் கூட்டுவடிவத்தைப் பேணி, அது குழுவை மொத்தமாகக் குறிக்கிறதா அல்லது தனிநபர்களை வலியுறுத்துகிறதா என்ற இறையியல் விவாதத்தை மொழிபெயர்ப்பே தீர்மானிக்காமல் விடுகிறது.
- issue: οὐ μὴ ἐκβάλω ἔξω என்பதில் இயேசுவின் வாக்குறுதியின் வலிமை
  choice: ‘ஒருபோதும் வெளியே தள்ளிவிட மாட்டேன்’ என்ற வலியுறுத்தப்பட்ட உறுதிமொழி.
  alternative: ‘நிச்சயமாக வெளியே தள்ள மாட்டேன்’
  rationale: வலியுறுத்தப்பட்ட மறுப்பைப் பேணுகிறது; நிலைத்திருத்தல் அல்லது விசுவாசத்திலிருந்து விலகுதல் குறித்த பிற்காலக் கோட்பாடுகளை வசனத்தில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘கொடுப்பதெல்லாம்’ மூலம் கிரேக்கத்தின் நடுநிலை ஒருமைக் கூட்டுப்பொருள் பாதுகாக்கப்பட்டுள்ளது; ‘ஒருபோதும்’ மூலம் வலியுறுத்தப்பட்ட மறுப்பு வாசகருக்குத் தெளிவாக்கப்பட்டுள்ளது.
