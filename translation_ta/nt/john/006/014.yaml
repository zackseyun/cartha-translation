source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: ta
  text: ஆகவே, அவர் செய்த அடையாளத்தை[a] மக்கள் கண்டபோது, “உலகத்திற்கு வருகிற அந்தத் தீர்க்கதரிசி[b] உண்மையாகவே இவர்தான்” என்று கூறிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் செய்த அற்புதத்தை.’ இயேசுவின் செயல்கள் அற்புதமானவை என்பதோடு, அவை அவரை வெளிப்படுத்தும் பொருளுடையவை என்பதை வலியுறுத்த யோவான் ‘அடையாளம்’ (σημεῖον) என்ற சொல்லைத் தொடர்ந்து பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்தத் தீர்க்கதரிசி’ என்பது மோசேயைப் போன்றவராக வருவார் என்று எதிர்பார்க்கப்பட்ட தீர்க்கதரிசியைக் குறிக்கலாம் (உபாகமம் 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: ஆகவே ... மக்கள்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் குறிக்காமல் அங்கிருந்த மக்களைக் பொதுவாகக் குறிக்கிறது; οὖν கதையின் விளைவு அல்லது தொடர்ச்சியைச் சுட்டுவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முன்னிகழ்வையும், அதற்குப் பின்வரும் மக்களின் எதிர்வினையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: அவர் செய்த அடையாளத்தை
  rationale: σημεῖον என்பதன் யோவானிய வெளிப்படுத்தும் பொருளைத் தக்கவைக்க ‘அடையாளம்’ தேர்ந்தெடுக்கப்பட்டது; அதை வெறுமனே ‘அற்புதம்’ என்று குறுக்கவில்லை.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் நீடித்த அல்லது பலரிடையே தொடர்ந்த பேச்சைக் காட்டுவதால் இந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἀληθῶς
  choice: உண்மையாகவே
  rationale: அவர்களின் உறுதியான அடையாளங்காணுதலை இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
- source_word: ὁ προφήτης
  choice: தீர்க்கதரிசி
  rationale: குறிப்பிட்ட எதிர்பார்க்கப்பட்ட தீர்க்கதரிசியைக் குறிக்கும் விதமாக, தமிழில் திட்டவட்டமான எழுவாயான ‘இவர்தான்’ உடன் வழங்கப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘மோசேயைப் போன்ற’ என்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: உலகத்திற்கு வருகிற
  rationale: பெயரடைத் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினையை அதன் திறந்த காலநுணுக்கத்துடன் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘ὁ προφήτης’ என்பவரின் அடையாளம்
  choice: மொழிபெயர்ப்பில் ‘தீர்க்கதரிசி’ என்று மட்டும் வைத்து, குறிப்பிட்ட எதிர்பார்க்கப்பட்ட நபர் என்பதை வாக்கிய அமைப்பால் உணர்த்துதல்
  alternative: ‘மோசேயைப் போன்ற தீர்க்கதரிசி’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: உபாகமம் 18:15–18 பற்றிய எதிர்பார்ப்பு பின்னணியாக இருக்கலாம்; ஆனால் கிரேக்க வசனம் ‘தீர்க்கதரிசி’ என்று மட்டுமே கூறுவதால், விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் இறையியல் நெருக்கடியும் மறைமுகமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு தெளிவான, மரியாதைமிக்க நடை. ‘அடையாளம்’ என்ற யோவானிய முக்கியச் சொல் பாதுகாக்கப்பட்டுள்ளது. Footnote [b] வாக்கியத்தின் முடிவில் வைக்கப்பட்டு முழுக் கூற்றின் தலைப்புச் சொல்லான ‘தீர்க்கதரிசி’யை விளக்குகிறது.
