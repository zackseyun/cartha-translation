source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: ta
  text: 'சீமோன் பேதுரு அவருக்குப் பதிலளித்தார்: “ஆண்டவரே[a], நாங்கள் யாரிடம் செல்வோம்? நித்திய வாழ்வின் வார்த்தைகள் உம்மிடம் உள்ளன.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் மரியாதையான அழைப்பாகவும் பயன்படலாம்; இங்கு “ஆண்டவரே” என்பது யோவான் நற்செய்தியின் பயன்பாட்டுக்கும் சொல்லின் இறையியல் எதிரொலிக்கும் ஏற்றது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: அவருக்குப் பதிலளித்தார்
  rationale: உரையாடலில் ஒருவருக்குப் பதிலளிப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; αὐτῷ இயேசுவைக் குறிக்கிறது.
- source_word: Σίμων Πέτρος
  choice: சீமோன் பேதுரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் அழைப்புவேற்றுமையை இயல்பாகக் காட்டி, மரியாதையையும் யோவான் நற்செய்தியிலுள்ள கிறிஸ்துவியல் எதிரொலியையும் பாதுகாக்கிறது.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: நாங்கள் யாரிடம் செல்வோம்?
  rationale: πρός உடன் வரும் நபர்நோக்கிய இயக்கத்தையும் எதிர்கால வினாவின் வலிமையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ῥήματα
  choice: வார்த்தைகள்
  rationale: பேசப்பட்ட சொற்கள் அல்லது உரைகளைச் சுட்டும் பன்மையைப் பாதுகாக்கும் பொதுவான, கண்ணியமான தமிழ்.
- source_word: ζωῆς αἰωνίου
  choice: நிலைவாழ்வின்
  rationale: யோவான் நூல்களில் முக்கியமான αἰώνιος ζωή என்ற கருத்தை இயல்பான கூட்டுச்சொல்லாக அளிக்கிறது; முடிவில்லா கால அளவை மட்டும் அல்லாமல் நிலைத்த வாழ்வையும் உணர்த்துகிறது.
- source_word: ἔχεις
  choice: உம்மிடம் உள்ளன
  rationale: தமிழில் வார்த்தைகள் ஒருவரிடம் இருப்பதை இயல்பாகச் சொல்லும் அமைப்பு; மரியாதை ஒருமையைத் தொடர்ந்து காக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய Κύριε என்ற அழைப்பின் பொருள்
  choice: ஆண்டவரே
  alternative: போதகரே / தலைவரே
  rationale: இச்சொல் மரியாதை அழைப்பாகவும் அதிகாரப் பட்டமாகவும் ஒலிக்க முடியும். “ஆண்டவரே” இரு சாத்தியங்களையும் ஓரளவு தக்கவைத்து, யோவானின் கிறிஸ்துவியல் சூழலுக்கு ஏற்றதாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ζωῆς αἰωνίου என்பதன் உறவு
  choice: நிலைவாழ்வின் வார்த்தைகள்
  alternative: நிலைவாழ்வை அளிக்கும் வார்த்தைகள்
  rationale: கிரேக்கத்தில் உள்ள பிறப்புவேற்றுமை உறவு துல்லியமாக வரையறுக்கப்படவில்லை. காரண அல்லது விளைவுப் பொருளைச் சேர்க்காமல் அதன் சுருக்கத்தையும் இறையியல் செறிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதை ஒருமையான “உம்மிடம்” பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சுருக்கமான வினாவும் பிறப்புவேற்றுமைத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
