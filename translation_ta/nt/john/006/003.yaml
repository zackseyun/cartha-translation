base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: ta
  text: பின்பு, இயேசு மலையின்மேல் ஏறிச் சென்று, அங்கே தம் சீடர்களோடு அமர்ந்திருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: ஏறிச் சென்று
  rationale: ἀνέρχομαι என்பதன் இறந்தகால வடிவம் இங்கு நிலப்பரப்பில் மேல்நோக்கிச் செல்வதைக் குறிக்கிறது. ‘ஏறிச் சென்று’ என்பது இயல்பான தமிழில் அந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: பின்பு
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் நிகழ்ச்சியின் அடுத்த கட்டத்தைக் குறிக்கிறது; ‘பின்பு’ கதை நகர்வை இயல்பாகத் தருகிறது.
- source_word: εἰς τὸ ὄρος
  choice: மலையின்மேல்
  rationale: ἀνῆλθεν உடன் வரும் இச்சொற்றொடர் மலையின்மேல் அல்லது மலைச்சரிவில் ஏறிச் செல்வதைக் குறிக்கிறது. குறிப்பிட்ட மலைப்பகுதியைச் சுட்டும் பொருளைத் தமிழ் சூழலில் ‘மலையின்மேல்’ இயல்பாகக் காக்கிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவம்.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; ‘அங்கே’ இயல்பான நிகர்.
- source_word: ἐκάθητο
  choice: அமர்ந்தார்
  rationale: κάθημαι இங்கு அமர்ந்திருத்தல் அல்லது அமருதல் என்ற காட்சியை அமைக்கிறது. மரியாதைமிக்க நவீன தமிழில் ‘அமர்ந்தார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: தம் சீடர்களோடு
  rationale: μετά + genitive உடனிருப்பைக் குறிக்கிறது. μαθητής என்பதற்கு ஆசிரியரைப் பின்பற்றிக் கற்கும் உறவைத் தக்கவைக்கும் ‘சீடர்’ பொருத்தமானது. எழுவாய் இயேசுவையே சுட்டுவதால் ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
