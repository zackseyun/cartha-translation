  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: ta
  text: யூதர்களின் பண்டிகையான பஸ்கா[a] நெருங்கியிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின் பண்டிகையான பஸ்கா.” கிரேக்கச் சொல் சூழலைப் பொறுத்து யூதர்களைப் பொதுவாகவோ, குறிப்பாக யூதேயர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்பை மட்டுமே குறிக்கிறது; தமிழில் இயல்பான வாக்கிய ஓட்டமே அதன் பணியைச் செய்கிறது. வெளிப்படையான ‘இப்போது’ என்ற காலப்பொருளைச் சேர்க்கவில்லை.
- source_word: ἐγγὺς
  choice: நெருங்கியிருந்தது
  rationale: ἦν என்பதுடன் சேர்ந்து பண்டிகையின் கால நெருக்கத்தைக் குறிக்கிறது; இத்தமிழ் வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πάσχα
  choice: பஸ்கா
  rationale: யூதர்களின் பஸ்கா பண்டிகையைக் குறிக்கும் நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல்.
- source_word: ἑορτὴ
  choice: பண்டிகை
  rationale: விழாக்காலக் கொண்டாட்டத்தைக் குறிக்கும் ἑορτή என்பதற்கு நவீனத் தமிழில் தெளிவான, இயல்பான இணை.
- source_word: τῶν Ἰουδαίων
  choice: யூதர்களின்
  rationale: இச்சூழலில் பஸ்கா யூத மக்களின் சமயப் பண்டிகை என்பதே பொருத்தமான குறிப்பு; இருப்பினும் Ἰουδαῖοι என்பதன் ‘யூதேயர்கள்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியில் Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: இவ்வசனத்தில் ஒரு பகுதி மக்களை அல்லது அதிகாரிகளை மட்டும் அல்லாமல், பஸ்காவை யூத மக்களுடன் தொடர்புபடுத்தும் பொதுவான பொருள் இயல்பாக உள்ளது. மூலச்சொல்லின் சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. கிரேக்க வாக்கியத்தின் இணைப்புப் பெயரெச்ச அமைப்பை இயல்பான தமிழில் ‘யூதர்களின் பண்டிகையான’ என்று வழங்குகிறது; தேவையற்ற காலக் குறிப்பு சேர்க்கப்படவில்லை.
