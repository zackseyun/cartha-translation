source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: ta
  text: அவரைப் பின்தொடர்ந்து ஒரு பெருந்திரளான மக்கள் கூட்டம் சென்றுகொண்டிருந்தது; ஏனெனில், நோயுற்றவர்களுக்காக அவர் செய்த அடையாளங்களை[a] அவர்கள் பார்த்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்புதங்கள்” அல்லது “அற்புத அடையாளங்கள்”; யோவான் பயன்படுத்தும் “அடையாளங்கள்” என்ற சொல், இந்தச் செயல்கள் இயேசுவைப் பற்றி வெளிப்படுத்துவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: தொடர்ந்து சென்றது
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல் இன்றி)
  rationale: இங்கு δέ வலுவான எதிர்மறையைக் காட்டாமல் கதையை முன்னெடுக்கும் மென்மையான இணைப்பு; தமிழில் வாக்கிய ஓட்டமே அதை இயல்பாகக் காட்டுகிறது.
- source_word: ὄχλος πολύς
  choice: ஒரு பெரிய மக்கள் கூட்டம்
  rationale: கூட்டத்தின் பெருமளவைத் தெளிவாகவும் நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: ἐθεώρουν
  choice: பார்த்துவந்தார்கள்
  rationale: தொடர்ந்து அல்லது மீண்டும் மீண்டும் கவனித்துப் பார்த்ததைச் சுட்டும் முற்றுப்பெறாத இறந்தகால அம்சத்தைப் பாதுகாக்கிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: யோவானில் இயேசுவின் செயல்கள் அவரைப் பற்றி வெளிப்படுத்தும் பொருளைச் சுட்டும் முக்கிய சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐποίει
  choice: செய்துவந்த
  rationale: இயேசு தொடர்ந்து செய்த செயல்களைச் சுட்டும் முற்றுப்பெறாத இறந்தகால அம்சத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: நோயுற்றவர்கள்மீது
  rationale: ἐπί மற்றும் genitive இங்கு அந்தச் செயல்கள் நோயுற்றவர்கள்மீது நிகழ்த்தப்பட்ட உறவை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἀσθενούντων
  choice: நோயுற்றவர்கள்
  rationale: சூழலில் உடல்நலக் குறைவால் பாதிக்கப்பட்டவர்களைக் குறிக்கிறது; தெளிவான பொதுநடைத் தமிழ்.
theological_decisions:
- issue: யோவான் பயன்படுத்தும் σημεῖα என்ற சொல்
  choice: அடையாளங்கள்
  alternative: அற்புதங்கள் / அற்புத அடையாளங்கள்
  rationale: இந்தச் செயல்களின் வல்லமையை மட்டும் அல்லாமல், அவை இயேசுவைப் பற்றி வெளிப்படுத்துவதைச் சுட்டும் யோவானின் சொல்லாட்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். “அவர் பின்னே” என்பது சீடத்துவப் பொருளை மிகைப்படுத்தாமல் இயக்கத்தையும் பின்தொடர்தலையும் வெளிப்படுத்துகிறது; தொடர்ச்சியான கிரேக்க இறந்தகால வினைகள் “தொடர்ந்து சென்றது,” “பார்த்துவந்தார்கள்,” “செய்துவந்த” எனப் பாதுகாக்கப்பட்டுள்ளன.
