  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: ta
  text: எனவே இயேசு பன்னிருவரிடம், “நீங்களும்கூடப் போய்விட விரும்பவில்லை, அல்லவா?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்களும்கூடப் புறப்பட்டுச் செல்ல விரும்புகிறீர்களா?” கிரேக்கக் கேள்வியில் வரும் μή பெரும்பாலும் எதிர்மறையான பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் பல சீடர்கள் விலகிச் சென்றதைத் தொடர்ந்து நிகழும் உரையாடலை இயல்பாக இணைக்கிறது; இங்கு தர்க்க முடிவைவிட நிகழ்வுத் தொடர்ச்சி முன்னிலையில் உள்ளது.
- source_word: τοῖς δώδεκα
  choice: பன்னிருவரிடம்
  rationale: இயேசுவின் நெருங்கிய சீடர் குழுவுக்கான நிலைபெற்ற அடையாளப் பெயரின் சுருக்கத்தையும் குறிப்புத்தன்மையையும் காக்கிறது.
- source_word: Μὴ καὶ ὑμεῖς
  choice: நீங்களும்கூட ... விரும்பவில்லை, அல்லவா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வி நயத்தைக் காட்டுகிறது; καί மற்றும் வலியுறுத்தப்பட்ட ὑμεῖς ஆகியவற்றை ‘நீங்களும்கூட’ வெளிப்படுத்துகிறது.
- source_word: θέλετε
  choice: விரும்பவில்லை
  rationale: θέλω இங்கு விருப்பம் அல்லது மனநிலையைக் குறிக்கிறது; நவீனத் தமிழில் ‘விரும்பு’ நேரடியும் இயல்புமான இணைச்சொல்.
- source_word: ὑπάγειν
  choice: போய்விட
  rationale: இயேசுவிடமிருந்து மற்ற சீடர்கள் விலகிச் சென்ற உடனடிச் சூழலில், நகர்ந்து அகல்வதையும் பிரிந்து செல்வதையும் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: μή என்பதால் உருவாகும் இயேசுவின் கேள்வியின் எதிர்பார்ப்பு
  choice: ‘விரும்பவில்லை, அல்லவா?’ என்ற எதிர்மறைப் பதிலை எதிர்பார்க்கும் கேள்வி வடிவம்
  alternative: ‘நீங்களும்கூடப் போய்விட விரும்புகிறீர்களா?’ என்ற நடுநிலையான கேள்வி
  rationale: கிரேக்க மொழியில் μή கொண்டு தொடங்கும் இத்தகைய கேள்வி பொதுவாக ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது. அதேவேளையில், அது பதிலை நிர்ணயிக்கும் உறுதியான கூற்றாக மாற்றப்படாமல் கேள்வியாகவே வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நேரடி உரையாடல் நடை. ‘பன்னிருவர்’ என்பது அடையாளப் பெயராகச் செயல்படுவதால் ‘சீடர்கள்’ என்று விளக்கிச் சேர்க்கப்படவில்லை.
