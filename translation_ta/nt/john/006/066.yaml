language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: ta
  text: அப்போதுமுதல், அவருடைய சீடர்களில் பலர் பின்வாங்கிச் சென்றனர்; அதன்பின் அவர்கள் அவரோடு நடக்கவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதன் காரணமாக, அவருடைய சீடர்களில் பலர் விலகிச் சென்றனர்.” கிரேக்கத் தொடக்கச் சொற்றொடரை காரணப்பொருளிலும் எடுத்துக்கொள்ளலாம்; ஆனால் இச்சூழலில் “அப்போதுமுதல்” என்பது திருப்புமுனையைக் காட்டும் காலப்பொருளைச் சிறப்பாக வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: அப்போதுமுதல்
  rationale: இச்சூழலில் இது இயேசுவின் கடினமான உரைக்குப் பிந்தைய ஒரு திருப்புமுனையைக் கால அடிப்படையில் குறிக்கிறது. அதேவேளையில் காரணப் பொருளும் இலக்கணரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் பலர்
  rationale: ἐκ என்பதன் பகுதிப்பொருளை இயல்பான தமிழில் காக்கிறது; சீடர்களாகிய பெரிய குழுவிலிருந்து பலர் என்பதே கருத்து.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: பின்வாங்கிச் சென்றனர்
  rationale: வெறுமனே அங்கிருந்து சென்றார்கள் என்பதைக் காட்டிலும், முந்தைய தொடர்பிலிருந்து விலகிப் பின்னோக்கிச் சென்றதைக் கிரேக்கச் சொற்றொடர் உணர்த்துகிறது.
- source_word: οὐκέτι
  choice: அதன்பின் ... இல்லை
  rationale: அந்தத் திருப்புமுனையிலிருந்து ஒரு செயல் தொடராமல் நின்றுவிட்டதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: அவர்கள் அவரோடு நடக்கவில்லை
  rationale: ‘அவரோடு நடப்பது’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; இதனை ‘பின்பற்றவில்லை’ என்று மட்டும் விளக்கி அதன் பொருள் பரப்பைக் குறைக்கவில்லை.
theological_decisions:
- issue: μαθηταί என்பது பன்னிருவரையோ அல்லது உண்மையான விசுவாசிகளையோ குறிப்பதாக மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிப்பதா
  choice: சீடர்கள்
  alternative: பின்பற்றியவர்கள்
  rationale: இங்கு பலர் இயேசுவின் சீடர்கள் என்ற கதைசார் அடையாளத்திலேயே குறிப்பிடப்படுகிறார்கள். அவர்கள் பன்னிருவரா, மேலோட்டமான சீடர்களா, உண்மையான விசுவாசிகளா என்பதைக் மொழிபெயர்ப்பு தனியே தீர்மானிக்காமல், உரையின் இறையியல் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பின்வாங்கிச் சென்றனர்’ விலகுதலின் திசையை இயல்பாகக் காட்டுகிறது; ‘அவரோடு நடக்கவில்லை’ மூலத்தின் உருவகத்தையும் தொடர்ந்த உறவின் முடிவையும் பாதுகாக்கிறது.
