  source_fidelity: மூலத்தின் காலப்பொருளான Ἐκ τούτου-வை “அப்போதுமுதல்” துல்லியமாகக் காட்டுகிறது. “அவருடைய சீடர்களில் பலர்” என்பது பகுதிப்பொருளான ἐκ τῶν μαθητῶν αὐτοῦ-ஐக் காக்கிறது. “பின்வாங்கிச் சென்றனர்” ἀπῆλθον εἰς τὰ ὀπίσω-வின் விலகிச் செல்லும் கருத்தை இயல்பாகத் தருகிறது; “அதன்பின் அவர்கள் அவரோடு நடக்கவில்லை” οὐκέτι μετ’ αὐτοῦ περιεπάτουν-இன் தொடர்ச்சியான உறவு முடிவடைந்த பொருளைச் சரியாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. அரைப்புள்ளி இரண்டு தொடர்புடைய வினைச்செயல்களை நன்றாகப் பிரிக்கிறது. “அவரோடு நடக்கவில்லை” நேரடியான உடல் நடையை மட்டுமல்லாமல், மூலத்தில் உள்ள தொடர்ந்த சீடத்துவ/உடனிருப்பு உருவகத்தையும் திறந்தவாறே வைத்திருக்கிறது.
  terminology: “சீடர்கள்” என்பது μαθηταί என்பதற்கு நிலையான, நடுநிலையான சொல்லாகும்; பன்னிருவரையோ ஒரு குறிப்பிட்ட இறையியல் வகையையோ முன்கூட்டியே சுட்டவில்லை. அடிக்குறிப்பு Ἐκ τούτου-வின் சாத்தியமான காரணப்பொருளை முறையாகக் குறிக்கிறது; முதன்மை உரையில் சூழலுக்கு ஏற்ற காலப்பொருளைத் தக்கவைத்துள்ளது.
