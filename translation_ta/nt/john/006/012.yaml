base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: ta
  text: அவர்கள் வயிறார உண்டபின்[a], அவர் தம் சீடர்களிடம், “மீதியான துண்டுகளைச் சேகரியுங்கள்; எதுவும் இழந்துபோகாதபடி[b]” என்று சொல்கிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அவர்கள் நிறைவடைந்தபின்” அல்லது “அவர்கள் திருப்தியாக உண்டபின்.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “எதுவும் வீணாகாமல்.”'
    reason: lexical_alternative
  - marker: c
    text: 'கிரேக்க மூலத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது: “சொல்கிறார்.” சில மொழிபெயர்ப்புகள் இதை “சொன்னார்” என வழங்குகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐνεπλήσθησαν
  choice: அவர்கள் வயிறார உண்டபின்
  rationale: உணவால் நிறைவடைந்தார்கள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறுமனே ‘நிறைந்தார்கள்’ என்பதில் ஏற்படும் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: யோவான் பயன்படுத்தும் வரலாற்று நிகழ்காலத்தைத் தமிழிலும் நிகழ்கால வடிவில் காக்கிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: μαθηταί என்பதற்கான துல்லியமான, வழக்கமான நற்செய்தி நூல் பதம் ‘சீடர்கள்’; αὐτοῦ என்பதைக் ‘தம்’ இயல்பாகச் சுட்டுகிறது.
- source_word: Συναγάγετε
  choice: சேகரியுங்கள்
  rationale: நேரடியான பன்மை கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: மீதியான துண்டுகளை
  rationale: περισσεύσαντα என்பது மீதியானவற்றையும் κλάσματα என்பது உடைக்கப்பட்ட துண்டுகளையும் குறிக்கிறது; சூழலில் அப்பத் துண்டுகள் என்பது தெளிவாக இருப்பதால் இயல்பான சுருக்கமான வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: ἵνα μή τι ἀπόληται
  choice: எதுவும் வீணாகாமல்
  rationale: இங்கு மீதியான உணவு இழக்கப்படாதிருக்க வேண்டும் என்ற நடைமுறைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அழிந்துபோகாமல்’ என்பது இச்சூழலில் தேவையற்ற வலிமையையும் வேறொரு இறையியல் சாயலையும் தரலாம்.
theological_decisions:
- issue: அடையாள நிகழ்வின் சூழலில் ἀπόληται என்பதற்கு இரட்சிப்பியல் பொருள் ஏற்றுதல்
  choice: உடனடிச் சூழலுக்கேற்ப ‘வீணாகாமல்’
  alternative: ‘எதுவும் இழந்துபோகாமல்’ அல்லது ‘அழிந்துபோகாமல்’
  rationale: இயேசு இங்கு மீதியான உணவுத் துண்டுகளைச் சேகரிப்பதைப் பற்றிப் பேசுகிறார். யோவான் நூலில் இச்சொல் வேறு இடங்களில் இறையியல் ஒலிப்பைக் கொண்டிருந்தாலும், இவ்வசனத்தில் அதை வெளிப்படையான இரட்சிப்பியல் கூற்றாக மாற்றாமல் பொருட்சார்ந்த உடனடிப் பொருள் முன்னிறுத்தப்படுகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வயிறார உண்டபின்’ என்பது உணவுச் சூழலைத் தெளிவாக்கும் இயல்பான சொற்றொடர். கிரேக்க வரலாற்று நிகழ்காலம் திட்டமிட்டு காக்கப்பட்டுள்ளது.
