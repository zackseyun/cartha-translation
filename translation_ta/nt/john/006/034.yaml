id: JHN.6.34
reference: John 6:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: ta
  text: அதனால் அவர்கள் அவரிடம், “ஆண்டவரே[a], இந்த அப்பத்தை எப்போதும் எங்களுக்குத் தாரும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் மரியாதையான அழைப்பாகவும் “ஆண்டவர்” என்ற பொருளிலும் பயன்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: என்றார்கள்
  rationale: λέγω என்பதன் இறந்தகாலப் பன்மை வடிவத்தை உரையாடலின் இயல்பான தமிழ் நிறைவாக “என்றார்கள்” வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: அதனால்
  rationale: முந்தைய உரையாடலிலிருந்து எழும் முடிவு அல்லது தொடர்ச்சியை οὖν குறிக்கிறது; “அதனால்” அந்தத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: பேசுதல் வினையுடன் πρός + வேற்றுமை உருபு உரையாடல் யாரை நோக்கியது என்பதைக் குறிக்கிறது; தமிழில் “அவரிடம்” இயல்பானது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பது இயேசுவை நோக்கிய மரியாதை அழைப்பாகவும் ஆழமான ஆண்டவர் பொருளுடனும் அமையக்கூடும்; “ஆண்டவரே” அந்தப் பொருள் விரிவைக் காக்கிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: πάντοτε என்பதன் நேரான பொருள் “எப்போதும்”; தொடர்ந்து கிடைக்க வேண்டுமென்ற கோரிக்கையையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὸς
  choice: தாரும்
  rationale: δίδωμι என்பதன் கட்டளை வடிவம் நேரடியான வேண்டுகோள். நவீன, கண்ணியமான தமிழ் உரையாடலில் மரியாதையுடன் கூறப்படும் “தாரும்” பொருத்தமானது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: கொடுப்பதன் மறைமுகச் செயப்படுபொருளான ἡμῖν என்பதற்கு “எங்களுக்கு” நேரான இணை.
- source_word: τὸν ἄρτον τοῦτον
  choice: இந்த அப்பத்தை
  rationale: ἄρτος என்பதற்கு “அப்பம்” என்றும் τοῦτον என்பதற்கு “இந்த” என்றும் மொழிபெயர்ப்பது முன்பு பேசப்பட்ட அதே அப்பத்துடனான தொடர்பைக் காக்கிறது.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும் κύριε என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இங்கு பேசுவோரின் புரிதல் முழுமையான கிறிஸ்தியல் அறிக்கையாக இருக்க வேண்டியதில்லை. எனினும் κύριε மரியாதை அழைப்பாகவும் “ஆண்டவர்” என்ற ஆழமான பொருளுடனும் ஒலிக்க முடிவதால், முதன்மை உரையில் “ஆண்டவரே” என்றும் மாற்றுச் சாத்தியத்தை அடிக்குறிப்பிலும் தருவது மூலத்தின் திறந்த பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. “அப்பம்” யோவான் 6-இன் மைய உருவகத் தொடரைத் தக்கவைக்கிறது; “தாரும்” வேண்டுகோளின் நேர்மையையும் மரியாதையையும் இணைக்கிறது.
