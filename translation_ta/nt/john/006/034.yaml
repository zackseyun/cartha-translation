  terminology: “ஆண்டவரே” appropriately preserves the possible fuller force of Κύριε, and the footnote responsibly supplies “ஐயா” as the respectful-address alternative without deciding the speakers’ theological understanding. “அப்பம்” is established, natural biblical Tamil terminology and preserves the bread motif in John 6.
