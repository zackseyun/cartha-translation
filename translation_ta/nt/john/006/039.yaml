source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: ta
  text: 'என்னை அனுப்பினவருடைய சித்தம் இதுவே: அவர் எனக்குக் கொடுத்துள்ள அனைத்திலும் எதையும் நான் இழந்துவிடாமல், கடைசி நாளில் அதை உயிர்த்தெழுப்ப வேண்டும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நபர்களை இன்னும் நேரடியாகக் குறிக்கும் வகையில்: “அவர் எனக்குக் கொடுத்தவர்கள் அனைவரிலும் ஒருவரையும் நான் இழந்துவிடாமல், கடைசி நாளில் அவர்களை உயிர்த்தெழுப்ப வேண்டும்.” கிரேக்கத்தில் கூட்டொருமை வடிவில், சொல்லுக்கு சொல், “அவர் கொடுத்துள்ள அனைத்தும் … அதை” என்று உள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: விருப்பம்
  rationale: இங்கு அனுப்பினவரின் சித்தம் அல்லது நோக்கத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; வெறும் ஆசை என்ற பொருளில் மட்டும் சுருக்குவதில்லை.
- source_word: τοῦ πέμψαντός με
  choice: என்னை அனுப்பினவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினையின் தொடர்பு மற்றும் வினைநிலையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἵνα
  choice: வேண்டும்
  rationale: அனுப்பினவருடைய விருப்பத்தின் உள்ளடக்கத்தையும் நோக்கத்தையும் தமிழ் வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: அவர் எனக்குக் கொடுத்துள்ள அனைத்தும்
  rationale: நடுநிலை ஒருமை வடிவங்களின் கூட்டுத்தொகைப் பொருளைப் பாதுகாக்கிறது; குறிப்பாக நபர்களாக முன்கூட்டியே விளக்குவதில்லை.
- source_word: δέδωκέν
  choice: கொடுத்துள்ள
  rationale: முடிவுற்ற செயலின் தொடரும் விளைவை கிரேக்க நிறைவுக்காலத்துக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: அனைத்திலும் எதையும் நான் இழந்துவிடாமல்
  rationale: ἀπόλλυμι என்பதன் இச்சூழலுக்குரிய ‘இழத்தல்’ பொருளையும் ἐξ αὐτοῦ என்பதன் பகுதியெடுக்கும் நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀναστήσω αὐτὸ
  choice: அதை உயிரோடு எழுப்ப வேண்டும்
  rationale: கடைசி நாளின் உயிர்த்தெழுதலைத் தெளிவுபடுத்துவதோடு, αὐτό என்ற நடுநிலை ஒருமைச் சுட்டுப்பெயரின் கூட்டொருமையை ‘அதை’ எனப் பாதுகாக்கிறது.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: கடைசி நாளில்
  rationale: யோவானில் காணப்படும் இறுதிக்காலக் குறிப்பை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
theological_decisions:
- issue: கிரேக்க கூட்டொருமையை பொருள் சார்ந்த வடிவிலா அல்லது நபர் சார்ந்த பன்மையிலா மொழிபெயர்ப்பது
  choice: அவர் எனக்குக் கொடுத்துள்ள அனைத்தும் ... அதை உயிரோடு எழுப்ப
  alternative: அவர் எனக்குக் கொடுத்தவர்கள் அனைவரும் ... அவர்களை உயிரோடு எழுப்ப
  rationale: πᾶν, ὃ, αὐτό ஆகியவை நடுநிலை ஒருமை வடிவங்கள். சூழலில் நபர்கள் குறிக்கப்படலாம் என்றாலும், மூலத்தின் கூட்டொருமை அமைப்பைப் பிரதான உரையில் பாதுகாத்து, தனிநபர் சார்ந்த இயல்பான மாற்றை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘அனைத்தும்/அதை’ என்ற கூட்டொருமை திட்டமிட்டு வைக்கப்பட்டு, நபர் சார்ந்த வாசிப்பு அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
