id: JHN.6.51
reference: John 6:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: ta
  text: வானத்திலிருந்து இறங்கி வந்த உயிருள்ள அப்பம் நானே. இந்த அப்பத்தை யாராவது சாப்பிட்டால், அவர் என்றென்றும் வாழ்வார். உலகம் வாழ்வு பெறுவதற்காக நான் கொடுக்கப்போகும் அப்பம் என் சதையே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: உயிருள்ள அப்பம்
  rationale: ζῶν என்பதை பெயரடையாக நேரடியாகக் காட்டுகிறது; அருகிலுள்ள ‘வாழ்வின் அப்பம்’ என்ற வேறு சொற்றொடரை இங்கு புகுத்தவில்லை.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: வானத்திலிருந்து இறங்கி வந்த
  rationale: முடிவுற்ற இறங்கிவருதலை இயல்பான தமிழ் பெயரெச்சத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: இந்த அப்பத்தை யாராவது சாப்பிட்டால்
  rationale: ἐάν உடன் வரும் பொதுவான நிபந்தனையையும் τις என்பதன் எவரையும் உள்ளடக்கும் பொருளையும் இயல்பான தமிழில் தருகிறது. ἐκ என்பதைக் கூறுசார் தமிழில் தனியே மொழிபெயர்ப்பது செயற்கையாக இருப்பதால், ‘அப்பத்தைச் சாப்பிடுதல்’ என வழங்கப்பட்டுள்ளது.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: அவர் என்றென்றும் வாழ்வார்
  rationale: யோவானின் பயன்பாட்டில் εἰς τὸν αἰῶνα குறிக்கும் நீடித்த, முடிவில்லாத வாழ்வைத் தெளிவாகக் காட்டுகிறது; ‘அவர்’ என்பது பாலினத்தால் வரையறுக்காத மரியாதை ஒருமை.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: நான் கொடுக்கப்போகும் அப்பம்
  rationale: எதிர்காலத் தற்கொடையை இயல்பான தமிழில் காட்டுகிறது. δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாததால் தனி இணைப்புச்சொல் அவசியமில்லை.
- source_word: ἡ σάρξ μού ἐστιν
  choice: என் சதையே
  rationale: σάρξ என்பதன் திட்டவட்டமான, உடல்சார் வலிமையை ‘உடல்’ என்று மென்மைப்படுத்தாமல் பாதுகாக்கிறது; ‘-ஏ’ கிரேக்க வாக்கியத்தின் அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: உலகம் வாழ்வு பெறுவதற்காக
  rationale: ὑπέρ என்பதன் பயன்/நோக்குப் பொருளையும் ζωῆς என்பதன் ‘வாழ்வு’ கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவான் நூலின் சொற்பிணைப்பையும் பரந்த நோக்கையும் பாதுகாத்து, அதை ‘மனிதகுலம்’ போன்ற விளக்கச் சொல்லாகக் குறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் தன்னுரையில் σάρξ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘சதை’
  alternative: ‘உடல்’
  rationale: இங்கு சொல் திட்டவட்டமாகவும் உடல்சார்ந்ததாகவும் உள்ளது. ‘உடல்’ என்பது அதன் கூர்மையை மழுங்கச் செய்து ஒரு விளக்கத்தை முன்கூட்டியே தீர்மானிக்கக்கூடும்.
- issue: ‘உலகம்’ என்பதன் நோக்கெல்லை
  choice: எந்தக் குறுக்கமும் இன்றி ‘உலகம்’ என்று வைத்தல்
  alternative: ‘மனிதகுலம்’ அல்லது ஒரு குறிப்பிட்ட குழு
  rationale: κόσμος என்பதன் பரந்த யோவானிய சொல்லாட்சியைப் பாதுகாத்து, ஒரு குறிப்பிட்ட இறையியல் அமைப்பின்படி அதன் எல்லையைச் சுருக்கவில்லை.
- issue: ‘வானத்திலிருந்து இறங்கி வந்த’ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: உண்மையான இறங்கிவருதலை நேரடியாக மொழிபெயர்த்தல்
  alternative: வெறும் தெய்வீக அனுப்புதலுக்கான உருவகமாக விளக்குதல்
  rationale: கிரேக்கத்தின் நேரடியான கூற்றையும் யோவானிய சூழலின் அவதாரப் பொருளையும் நீர்த்துப்போகாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடை. ‘அப்பம்’, ‘வானம்’, ‘சதை’, ‘உலகம்’, ‘வாழ்வு’ ஆகிய முக்கியச் சொற்கள் மூலத்தின் சொற்பிணைப்பைத் தக்கவைக்கின்றன. விளக்கத்திற்குத் தேவையான உண்மையான மாற்று வாசிப்பு இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
