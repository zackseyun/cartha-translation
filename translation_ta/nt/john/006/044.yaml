  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: ta
  text: என்னை அனுப்பிய தந்தை ஒருவரை ஈர்த்தாலொழிய[a], எவராலும் என்னிடம் வர இயலாது. நானும் அவரை[b] கடைசி நாளில் உயிர்த்தெழுப்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஈர்த்தால்” என்பதற்கு “இழுத்தால்” அல்லது “இழுத்துக்கொண்டால்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வலிமையாக இழுத்தல் என்ற பொருளையும் தரக்கூடும். தந்தை ஒருவரை மகனிடம் எவ்வாறு கொண்டுவருகிறார் என்பதற்கான குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிக்காமல் இருக்க முதன்மை உரையில் “ஈர்த்தால்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இங்கே ஆண்பால் ஒருமைப் பிரதிப்பெயர் உள்ளது; ஆனால் அது பொதுவாக மனிதரைக் குறிக்கிறது, ஆண்களை மட்டும் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: எவராலும் ... இயலாது
  rationale: உலகளாவிய மறுப்பையும் திறனின்மையையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐλθεῖν πρός με
  choice: என்னிடம் வர
  rationale: இயேசுவை நோக்கி வருதல் என்ற இயக்கத்தையும் யோவான் நற்செய்தியில் உள்ள உறவுசார் பொருளையும் மிகையாக விளக்காமல் காக்கிறது.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: என்னை அனுப்பிய தந்தை
  rationale: கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான தமிழ் உறவுத்தொடராக வழங்குகிறது; இயேசு பயன்படுத்தும் தனிப்பட்ட அழைப்பைத் தக்கவைக்கிறது.
- source_word: ἑλκύσῃ
  choice: ஈர்த்தாலொழிய
  rationale: ஒருவரைத் தன்னிடம் வரச் செய்யும் வினையின் பொருளைத் தருகிறது; அதேவேளையில் வலுக்கட்டாயம் அல்லது செயல்முறை குறித்த குறிப்பிட்ட இறையியல் விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: αὐτόν
  choice: ஒருவரை / அவரை
  rationale: தமிழில் இயல்பான பொதுமைப் பயன்பாட்டை கொண்டு, கிரேக்க ஒருமையையும் முந்தைய குறிப்புடனான தொடர்பையும் காக்கிறது; இது ஆண்களை மட்டும் குறிக்காது.
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: நானும் அவரை ... உயிர்த்தெழுப்புவேன்
  rationale: καί + ἐγώ என்பதன் இணைப்பையும் வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும் காக்கிறது; ἀναστήσω என்பதன் உயிர்த்தெழுதல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: கடைசி நாளில்
  rationale: எதிர்கால இறுதி நாளைக் குறிக்கும் சொற்றொடரை இயல்பான, வழக்கிலுள்ள தமிழில் வழங்குகிறது.
theological_decisions:
- issue: இரட்சிப்பு சார்ந்த விவாதத்தில் ἑλκύσῃ என்பதன் வலிமை
  choice: ஈர்த்தாலொழிய
  alternative: இழுத்தாலொழிய / தம்மிடம் இழுத்துக்கொண்டாலொழிய
  rationale: ‘ஈர்த்தல்’ இயக்கத்தை ஏற்படுத்தும் பொருளைக் காக்கிறது; ஆனால் தந்தை ஒருவரை மகனிடம் கொண்டுவரும் விதம் குறித்து உரை வெளிப்படையாகச் சொல்லாத ஒரு சமயப்பிரிவுச் சார்ந்த முடிவைத் திணிக்காது. வலிமையான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: αὐτόν என்ற ஆண்பால் ஒருமைப் பிரதிப்பெயரின் பொதுமைப் பயன்பாடு
  choice: ஒருவரை ... அவரை
  alternative: அவனை
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை இருந்தாலும் அது பொதுவான பிரதிநிதித்துவப் பயன்பாடு. தமிழ் ‘ஒருவர்/அவர்’ ஒருமையையும் மனித நபரைக் குறிக்கும் பொதுமையையும் இயல்பாகக் காக்கிறது; ஆண்களுக்கு மட்டும் வரம்பிடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘எவராலும் ... இயலாது’ என்பது திறனின்மையைத் தெளிவுபடுத்துகிறது. ‘தந்தை’ என்பது யோவான் நற்செய்தியின் உறவுசார் அழைப்பை இயல்பாகக் காக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் கூறுகளுக்குப் பின் வசன முடிவில் இணைக்கப்பட்டுள்ளன.
