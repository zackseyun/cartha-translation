  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: ta
  text: “நம் முற்பிதாக்கள்[a] வனாந்தரத்தில்[b] மன்னாவைச் சாப்பிட்டார்கள்; ‘வானத்திலிருந்து அப்பத்தை அவர்களுக்கு உண்ணக் கொடுத்தார்’ என்று எழுதப்பட்டிருக்கிறபடியே.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் முன்னோர்கள்.” கிரேக்கில் சொல்லுக்கு சொல் “நம் தந்தையர்.”
    reason: lexical_alternative
  - marker: b
    text: “வனாந்தரத்தில்” என்பதை “பாலைவனத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: நம் முற்பிதாக்கள்
  rationale: πατέρες என்பதன் ஆண்பால் வடிவையும், இஸ்ரவேலின் முந்தைய தலைமுறையினரைக் குறிக்கும் வேதாகம வழக்கையும் காக்கிறது. இயல்பான மாற்றாக ‘நம் முன்னோர்கள்’ என்பதும் சாத்தியம்.
- source_word: τὸ μάννα
  choice: மன்னாவை
  rationale: வனாந்தரத்தில் வழங்கப்பட்ட தனிப்பட்ட உணவுக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்.
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: இறந்தகாலச் செயலை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: யாத்திராகமப் பின்னணியுடன் தொடர்புடைய நிலைபெற்ற வேதாகமச் சொல்; ‘பாலைவனத்தில்’ என்பதும் மூலச்சொல்லின் சாத்தியமான பொருள்.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: என்று எழுதப்பட்டுள்ளதே
  rationale: நின்றுநிலைக்கும் எழுத்துச் சாட்சியைக் குறிக்கும் perfect passive கருத்தை ‘எழுதப்பட்டுள்ளதே’ வெளிப்படுத்துகிறது; மேற்கோள் அவர்களின் வாதத்திற்கு ஆதாரம் என்பதையும் இயல்பாக உணர்த்துகிறது.
- source_word: Ἄρτον
  choice: அப்பத்தை
  rationale: ἄρτος என்பதற்கான இயல்பான வேதாகமத் தமிழ்; இங்கு தனி அப்பத் துண்டை அல்ல, தேவனால் வழங்கப்பட்ட உணவைச் சுட்டுகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: தெய்வீகத் தோற்றத்தைச் சுட்டும் வேதாகம மொழிநடையைத் தெளிவாகக் காக்கிறது.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: அவர்கள் சாப்பிடுவதற்காக ... அவர்களுக்குக் கொடுத்தார்
  rationale: δίδωμι + dative + infinitive அமைப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: மன்னாவைப் பற்றிய மேற்கோளுக்குள் பின்னர் வெளிப்படும் யோவானிய கிறிஸ்துவியல் பொருளை முன்கூட்டியே புகுத்தாதிருத்தல்
  choice: வானத்திலிருந்து அப்பம் கொடுக்கப்பட்டதாக வரலாற்று/வேதவாக்கியக் கூற்றாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அப்பம்’ என்ற சொல்லைத் தனிப்படுத்தியோ விரிவுபடுத்தியோ இயேசுவே உண்மையான அப்பம் என்ற பிந்தைய விளக்கத்தை இங்கே முன்கூட்டியே சுட்டுதல்.
  rationale: இச்சூழலில் பேசுகிறவர்கள் வனாந்தர மன்னாவைப் பற்றிய வேதவாக்கியத்தை மேற்கோளிடுகிறார்கள். உரையாடலில் பின்னர் வெளிப்படும் கிறிஸ்துவியல் கருத்து இவ்வசனத்துக்குள் சேர்க்கப்படாமல், கதையின் போக்கிலேயே வெளிவர வேண்டும்.
- issue: ἔδωκεν என்பதன் எழுவாய் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாதது
  choice: தமிழிலும் ‘கொடுத்தார்’ என்ற மரியாதை ஒருமை வினைமுற்றால் மறைமுக எழுவாய் பாதுகாக்கப்பட்டது.
  alternative: ‘தேவன் கொடுத்தார்’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்.
  rationale: சூழலில் கொடுத்தவர் தேவன் என்பது தெளிவாக இருந்தாலும், கிரேக்க மேற்கோள் பெயரை வெளிப்படையாகக் கூறவில்லை; ஆகவே அதைச் சேர்க்காமல் இருப்பது மூலத்திற்கு நெருக்கமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘முற்பிதாக்கள்,’ ‘வனாந்தரம்,’ ‘மன்னா,’ ‘அப்பம்’ ஆகியவை இடைவேதாகமத் தொடர்பைத் தக்கவைக்கும் நிலைபெற்ற சொற்கள்; மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
