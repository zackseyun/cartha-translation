  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: ta
  text: அவர்கள் ஒரு படகில் ஏறி, கடலைக் கடந்து கப்பர்நகூமை நோக்கிச் சென்றுகொண்டிருந்தார்கள்.[a] ஏற்கெனவே இருட்டிவிட்டிருந்தது; மேலும் இயேசு இன்னும் அவர்களிடம் வந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடலின் மறுகரையிலுள்ள கப்பர்நகூமை நோக்கி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: ஒரு படகில் ஏறி
  rationale: இறந்தகால வினையெச்சம், முதன்மை வினைக்கு முன் நடந்த செயலை இயல்பான தமிழில் காட்டுகிறது. πλοῖον சூழலுக்கேற்றவாறு ‘படகு’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἤρχοντο
  choice: சென்றுகொண்டிருந்தார்கள்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் பயணம் நடந்துகொண்டிருந்ததைச் சுட்டுகிறது; தமிழ் தொடர்நிலை இதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πέραν τῆς θαλάσσης εἰς Καφαρναούμ
  choice: கடலின் மறுகரையிலுள்ள கப்பர்நகூமை நோக்கி
  rationale: πέραν என்பது கடலைக் கடந்து மறுபுறம் செல்வதைக் குறிக்கிறது; εἰς Καφαρναούμ இலக்கைத் தெரிவிக்கிறது. இரண்டையும் இணைத்த இந்தத் தமிழ் வடிவம் இலக்கையும் கடத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: ஏற்கெனவே இருட்டிவிட்டிருந்தது
  rationale: முன்னரே இருள் ஏற்பட்டதால் உண்டான நிலையை கிரேக்க முற்கடந்தகாலம் காட்டுகிறது; ‘இருட்டிவிட்டிருந்தது’ அந்த விளைவு நிலையைக் காக்கிறது.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: இன்னும் அவர்களிடம் வந்திருக்கவில்லை
  rationale: οὔπω என்பதன் ‘இன்னும் இல்லை’ என்ற காலநிலையும், πρὸς αὐτούς என்பதன் நேரடியான ‘அவர்களிடம்’ என்ற பொருளும் பாதுகாக்கப்படுகின்றன.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் வழக்கமாக நிலைபெற்ற பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: நிகழ்வுகளின் காலவரிசையும் தொடர்நிலையும்
  choice: படகில் ஏறிய பின் அவர்கள் சென்றுகொண்டிருந்தார்கள்; அப்போது ஏற்கெனவே இருட்டிவிட்டிருந்தது, இயேசு இன்னும் அவர்களிடம் வந்திருக்கவில்லை என வரிசையும் காலநிலையும் பாதுகாக்கப்பட்டுள்ளன.
  alternative: ‘அவர்கள் சென்றார்கள்’, ‘அப்போது இருட்டாக இருந்தது’ என்று எளிய இறந்தகாலத்தில் மொழிபெயர்த்தல்.
  rationale: கிரேக்க வினை வடிவங்களின் தொடர்நிலையும், முன்னரே ஏற்பட்ட இருளின் விளைவு நிலையும் அடுத்த நிகழ்வுக்கான கதையோட்டப் பதற்றத்தை உருவாக்குகின்றன; உரைக்கு அப்பாற்பட்ட கோட்பாடு எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘கடல்’ என்பது θάλασσα என்ற மூலச்சொல்லையும் யோவானின் வழக்கையும் பின்பற்றுகிறது.
