revisions:
- from: அவர்கள் ஒரு படகில் ஏறி, கடலின் மறுகரையிலுள்ள கப்பர்நகூமை நோக்கிச் சென்றுகொண்டிருந்தார்கள்.[a] ஏற்கெனவே இருட்டிவிட்டிருந்தது; இயேசுவும் இன்னும் அவர்களிடம் வந்திருக்கவில்லை.
  to: அவர்கள் ஒரு படகில் ஏறி, கடலைக் கடந்து கப்பர்நகூமை நோக்கிச் சென்றுகொண்டிருந்தார்கள்.[a] ஏற்கெனவே இருட்டிவிட்டிருந்தது; மேலும் இயேசு இன்னும் அவர்களிடம் வந்திருக்கவில்லை.
  rationale: The revision renders πέραν τῆς θαλάσσης directly as travel across the sea, retaining the imperfective ongoing journey and the destination. The temporal force of “ஏற்கெனவே இருட்டிவிட்டிருந்தது” and “இன்னும் ... வந்திருக்கவில்லை” is retained. The footnote now gives the locative/far-shore alternative rather than repeating the main rendering.
