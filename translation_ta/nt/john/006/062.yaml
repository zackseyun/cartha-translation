  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: ta
  text: அப்படியானால், மனிதகுமாரன் முன்பு இருந்த இடத்திற்கு ஏறிச் செல்வதை நீங்கள் காண்பீர்களானால் என்ன?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அப்படியானால், மனிதகுமாரன் முன்பு இருந்த இடத்திற்கு ஏறிச் செல்வதை நீங்கள் கண்டால்?” கிரேக்கத்தில் இது தொடர்கருத்து வெளிப்படையாகக் கூறப்படாத நிபந்தனை வினா.'
    reason: மூலத்தின் நிபந்தனை வினா அமைப்பையும் சொல்லப்படாத தொடர்கருத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: அப்படியானால், … கண்டால் என்ன சொல்வீர்கள்?
  rationale: οὖν என்பதன் முன்னுள்ள கருத்திலிருந்து வரும் தொடர்ச்சியையும் ἐὰν என்பதன் நிபந்தனைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. மூலத்தில் விடுபட்டுள்ள பிரதான வாக்கியத்தை ‘என்ன சொல்வீர்கள்?’ எனக் குறைந்த அளவில் நிறைவு செய்து, இதை வினாவாகவே வைத்திருக்கிறது.
- source_word: θεωρῆτε
  choice: நீங்கள் கண்டால்
  rationale: இங்கு எதிர்நோக்கப்படும் காட்சியைக் காண்பதைக் குறிக்கிறது; ‘உற்றுப் பார்த்தால்’ என்பது தேவையற்ற செயற்பாட்டு நுணுக்கத்தைச் சேர்க்கக்கூடும் என்பதால் இயல்பான ‘கண்டால்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: நற்செய்திகளில் இயேசு பயன்படுத்தும் நிலைபெற்ற சுயக்குறிப்புப் பட்டத்தைப் பாதுகாக்கிறது; அதன் வேதாகம மற்றும் மேசியா சார்ந்த ஒலிப்புகளையும் தக்கவைக்கிறது.
- source_word: ἀναβαίνοντα
  choice: ஏறிச் செல்வதை
  rationale: மேல்நோக்கிய நகர்வைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; ‘மேலே போவதை’ என்பதைக் காட்டிலும் dignified biblical register-ஐப் பேணுகிறது, ஆனால் ‘பரலோகத்திற்கு’ என்று மூலத்தில் இல்லாத இலக்கைச் சேர்ப்பதில்லை.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: முன்பு இருந்த இடத்திற்கு
  rationale: முன்னைய இருப்பிடத்தையோ நிலைத்திருப்பையோ சுட்டும் கிரேக்கச் சொற்றொடரின் இட மற்றும் காலக் கூறுகளைப் பாதுகாக்கிறது; ‘பரலோகம்’ அல்லது ‘பிதாவிடம்’ என்று விளக்கிச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் ஏற்றத்தை முன்இருப்பு மற்றும் பரலோகத் தோற்றம் குறித்த வெளிப்படையான கூற்றாக விரிவாக்க வேண்டுமா?
  choice: ‘முன்பு இருந்த இடத்திற்கு’ என்ற மூலத்துக்கு நெருக்கமான மொழியை மட்டும் வைத்தல்
  alternative: ‘முன்பு இருந்த பரலோகத்திற்கு’ அல்லது ‘முன்பு பிதாவோடு இருந்த இடத்திற்கு’
  rationale: வசனம் முன்இருப்பையும் ஏற்றத்தையும் வலுவாக உணர்த்தினாலும், பரலோகத்தையோ பிதாவையோ வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே அதன் கிறிஸ்துவியல் வலிமையைத் தக்கவைத்து, உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்கவில்லை.
- issue: மூலத்தின் பிரதான வாக்கியம் விடுபட்டுள்ள நிபந்தனை வினாவை தமிழில் எவ்வாறு வழங்குவது?
  choice: ‘கண்டால் என்ன சொல்வீர்கள்?’ என இயல்பான வினாவாக வழங்கல்
  alternative: ‘அப்படியானால், … ஏறிச் செல்வதை நீங்கள் கண்டால்?’ என விடுபட்ட வாக்கிய அமைப்பையே நேரடியாக வைத்தல்
  rationale: கிரேக்கத்தில் நிபந்தனைப் பகுதி மட்டுமே கேள்வியாக நிற்கிறது. தமிழில் அது முற்றாததாகத் தோன்றுவதால், சூழலுக்கு ஏற்ற குறைந்தபட்ச நிறைவை முதன்மை உரையில் கொடுத்து, அடிக்குறிப்பில் நேரடியான மாற்றைத் தருகிறது; இயேசுவின் நோக்கத்தை மேலும் விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற பட்டம் தக்கவைக்கப்பட்டுள்ளது. முதன்மை உரையின் ‘என்ன சொல்வீர்கள்?’ வாசிப்புத் தெளிவுக்கான குறைந்தபட்ச நிறைவு; நேரடியான, முற்றாத நிபந்தனை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
