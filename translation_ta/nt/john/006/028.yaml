revisions:
- from: ஆகவே அவர்கள் அவரிடம், “கடவுளின் செயல்களைச் செய்வதற்கு நாங்கள் என்ன செய்ய வேண்டும்?” என்று கேட்டார்கள்.[a]
  to: அப்போது அவர்கள் அவரிடம், “கடவுளின் செயல்களை நாம் செய்வதற்கு என்ன செய்ய வேண்டும்?” என்று சொன்னார்கள்.[a]
  rationale: The revision follows the Greek narrative verb more closely, moderates the connective to a natural narrative continuation, and retains the deliberately open expression ‘கடவுளின் செயல்கள்.’ The footnote now identifies the actual interpretive alternative in the Greek genitive without imposing it on the main text.
  reviewer_model: gpt-5.6-terra
