id: JHN.6.28
reference: John 6:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: ta
  text: அப்போது அவர்கள் அவரிடம், “கடவுளின் செயல்களை நாம் செய்வதற்கு என்ன செய்ய வேண்டும்?” என்று சொன்னார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளின் செயல்கள்” என்பதை “கடவுள் கோரும் செயல்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: என்று கேட்டார்கள்
  rationale: λέγω என்பதன் இறந்தகாலக் கதைவடிவம் அடிப்படையில் ‘சொன்னார்கள்’ எனப் பொருள்படும்; ஆனால் இங்கு நேரடியான வினா வருவதால், இயல்பான தமிழில் ‘என்று கேட்டார்கள்’ என்பது பேச்சின் உள்ளடக்கத்தை மிகையின்றித் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையுடன் உள்ள தொடர்ச்சியையும் அதிலிருந்து எழும் விளைவையும் οὖν குறிக்கிறது; ‘ஆகவே’ அந்த உறவை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: பேசுதல் அல்லது கேட்டல் குறிக்கும் வினையுடன் πρός + வேற்றுமை வடிவம் யாரிடம் உரையாடப்பட்டது என்பதைக் குறிக்கிறது; தமிழில் ‘அவரிடம்’ இயல்பான இணை.
- source_word: Τί ποιῶμεν
  choice: நாங்கள் என்ன செய்ய வேண்டும்
  rationale: இது செய்ய வேண்டிய செயலைப் பற்றிய ஆலோசனைத் தன்மையுள்ள வினா. ‘என்ன செய்ய வேண்டும்’ தேவையையும் நடைமுறை நோக்கத்தையும் தெளிவாகத் தருகிறது.
- source_word: ἵνα
  choice: செய்வதற்கு
  rationale: ἵνα நோக்கத்தை அறிமுகப்படுத்துகிறது; தமிழின் நோக்கவியல் வினையெச்சமான ‘செய்வதற்கு’ இயல்பாக அந்தப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: செயல்களைச் செய்வதற்கு
  rationale: ἐργάζομαι மற்றும் ἔργα இடையிலுள்ள சொல் தொடர்பை, தமிழில் ‘செயல்கள்—செய்வது’ என்ற தொடர்பால் முடிந்தவரை காக்கிறது; அதேவேளை வாக்கியம் சாதாரண வாசகருக்கு இயல்பாக உள்ளது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: உடைமை வேற்றுமையை நேரடியாக வைத்திருப்பதால், இவை கடவுள் கோரும் செயல்களா, அவருக்குரிய செயல்களா, அல்லது அவர் செய்யும் செயல்களா என்ற கிரேக்கத்தின் பொருள் திறந்தநிலை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ என்பதில் உள்ள உடைமை வேற்றுமையின் பொருள்
  choice: முதன்மை உரையில் ‘கடவுளின் செயல்கள்’ என்று பொருளைத் தீர்மானிக்காமல் வைத்தல்
  alternative: ‘கடவுள் கோரும் செயல்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உடைமைத் தொடர் பலவித உறவுகளை அனுமதிக்கிறது; அடுத்த வசனம் இந்தத் திறந்தநிலையைப் பயன்படுத்துகிறது. ஆகவே முதன்மை உரை எந்த ஓர் விளக்கத்தையும் மட்டும் கட்டாயப்படுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘கடவுளின் செயல்கள்’ என்ற தொடர் மூலமொழியின் திட்டமிட்ட பொருள் திறந்தநிலையைத் தக்கவைக்கிறது.
