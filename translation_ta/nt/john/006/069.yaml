  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: ta
  text: நீர்தாம் கடவுளின் பரிசுத்தர் என்று நாங்கள் நம்பியிருக்கிறோம்; அறிந்திருக்கிறோம்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “மேசியா, உயிருள்ள கடவுளின் மகன்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “கடவுளிடமிருந்து வந்த பரிசுத்தர்.” கிரேக்க உடைமை வேற்றுமை உறவையோ தோற்றுவாயையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: நாங்களோ
  rationale: வெளிப்படையாக இடம்பெறும் பன்மைத் தன்மைப் பெயரின் வலியுறுத்தலை ‘-ஓ’ என்னும் இடைச்சொல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πεπιστεύκαμεν
  choice: நம்பியிருக்கிறோம்
  rationale: நம்பிய செயலும் அதன் தொடரும் நிலையும் சேர்ந்த கிரேக்க நிறைவுக் காலத்தின் பொருளை இது காக்கிறது.
- source_word: ἐγνώκαμεν
  choice: அறிந்தும் இருக்கிறோம்
  rationale: அறிந்தடைந்ததன் தற்போதைய விளைவைத் தெரிவிப்பதுடன், πεπιστεύκαμεν என்பதிலிருந்து வேறுபட்ட இரண்டாவது வினையாகவும் இயல்பாக அமைகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: நம்பிக்கைக்கும் அறிவுக்கும் உரிய உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சார்புருபு.
- source_word: σὺ εἶ
  choice: நீர்தாம்
  rationale: σὺ என்பதன் வெளிப்படையான வலியுறுத்தலை ‘-தாம்’ காக்கிறது; இயேசுவை நோக்கிய மரியாதையான ஒருமையையும் ‘நீர்’ வெளிப்படுத்துகிறது.
- source_word: ὁ ἅγιος
  choice: பரிசுத்தர்
  rationale: தனித்துவமாகக் கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்டவரைக் குறிக்கும் கிறிஸ்துவியல் பட்டத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: உறவு, உரிமை அல்லது தோற்றுவாய் ஆகியவற்றைக் குறிக்கக்கூடிய கிரேக்க உடைமை வேற்றுமையின் பரந்த பொருளைத் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: யோவான் 6:69-இல் உள்ள கிறிஸ்துவியல் பட்டம்
  choice: கடவுளின் பரிசுத்தர்
  alternative: கடவுளிடமிருந்து வந்த பரிசுத்தர்; மேசியா, உயிருள்ள கடவுளின் மகன்
  rationale: SBLGNT மூலவாசகம் ὁ ἅγιος τοῦ θεοῦ என்று உள்ளது. இதை மத்தேயு 16:16 உடனோ பிற்கால விரிவான வாசகங்களுடனோ ஒத்திசைக்காமல் நேரடியாக மொழிபெயர்க்க வேண்டும். ‘கடவுளின்’ என்பது கிரேக்க உடைமை வேற்றுமையைத் திறந்த நிலையில் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாங்களோ’ மற்றும் ‘நீர்தாம்’ ஆகியவை கிரேக்கத்தில் இரு பெயர்ச்சுட்டுகளுக்கும் உள்ள வலியுறுத்தலை இயல்பாகக் காக்கின்றன; வாக்கியத்தின் இரண்டு நிறைவுக் கால வினைகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
