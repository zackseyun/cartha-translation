  source_fidelity: மூல கிரேக்கத்தின் இரண்டு நிறைவுக்கால வினைகளான πεπιστεύκαμεν, ἐγνώκαμεν ஆகியவற்றைத் தனித்தனியாகக் காப்பது அவசியம். வரைவில் உள்ள ‘அறிந்தும் இருக்கிறோம்’ இணைப்பு வடிவம் இரண்டாவது சுயாதீன நிறைவுக்கால வினையின் வலிமையைத் தளர்த்துகிறது. ‘நாங்களோ’ என்பதும் καὶ ἡμεῖς என்பதிலில்லாத எதிர்மறை/முரண்பாட்டு நிழலைச் சேர்க்கிறது.
