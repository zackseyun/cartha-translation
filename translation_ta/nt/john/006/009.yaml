translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எம்மாத்திரம்’ என்பது சற்றே உயர்ந்தாலும் பரவலாகப் புரியும் வேதாகமச் சொல்லாட்சி; மூலத்தின் மதிப்பீட்டு வினாவைச் சுருக்கமாகத் தக்கவைக்கிறது.
