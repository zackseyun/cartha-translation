id: JHN.6.9
reference: John 6:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: ta
  text: “இங்கே ஒரு சிறுவன் இருக்கிறான். அவனிடம் ஐந்து வாற்கோதுமை அப்பங்களும் இரண்டு மீன்களும் இருக்கின்றன. ஆனால் இவ்வளவு பேருக்கு இவை எம்மாத்திரம்?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: சிறுவன்
  rationale: குழந்தை அல்லது இளம் பையனைக் குறிக்கும் சொல்லை இயல்பான நவீனத் தமிழில் ‘சிறுவன்’ என்று வழங்குகிறது; வயதை அளவுக்கு மீறித் துல்லியப்படுத்தவில்லை.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் வினையடையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ὃς ἔχει
  choice: அவனிடம் ... இருக்கின்றன
  rationale: தமிழின் இயல்பான உடைமைத் தொடரைப் பயன்படுத்தி, சிறுவனை அவனிடமுள்ள உணவால் அடையாளப்படுத்தும் சார்புத்தொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: ἄρτους κριθίνους
  choice: வாற்கோதுமை அப்பங்கள்
  rationale: ἄρτους என்பதன் அப்பம்/ரொட்டி என்ற பொருளையும் κριθίνους குறிப்பிடும் barley தானியத்தையும் தெளிவாக வழங்குகிறது.
- source_word: ὀψάρια
  choice: மீன்கள்
  rationale: இந்தச் சூழலில் அப்பத்துடன் உண்ணப்படும் மீன்களைக் குறிக்கிறது; ‘சிறிய மீன்கள்’ என்பது மூலத்தில் உறுதியாகத் தெரிவிக்கப்படாத அளவைச் சேர்த்துவிடும்.
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: கிடைத்துள்ள உணவுக்கும் பெருந்திரளின் தேவைக்கும் இடையிலான முரண்பாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: ταῦτα τί ἐστιν
  choice: இவை எம்மாத்திரம்?
  rationale: சொற்சொல் வடிவான ‘இவை என்ன?’ என்பதைக் காட்டிலும், இவை போதாதவை என்ற மதிப்பீட்டு வினாவின் இயல்பான தமிழ்ப் பொருளையும் சொல்லாட்சியின் சுருக்கமான வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: εἰς τοσούτους
  choice: இவ்வளவு பேருக்கு
  rationale: அந்தப் பெரிய எண்ணிக்கையினருக்கான உணவின் போதாமையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
