source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “உண்மையாகவே, உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: நீங்கள் அடையாளங்களைக் கண்டதால் அல்ல, அப்பங்களை உண்டு நிறைவடைந்ததால்[a] என்னைத் தேடுகிறீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில் இன்னும் சொற்சொல்லாக, “அப்பங்களிலிருந்து உண்டு நிறைவடைந்ததால்” என்று உள்ளது. கடைசி வினைச்சொல்லை “திருப்தியடைந்ததால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: இயேசு அவர்களுக்குப் பதிலளித்தார்
  rationale: கிரேக்க மொழியில் இயல்பான இரட்டை பேச்சு அறிமுகமாக உள்ள ‘பதிலளித்து, சொன்னார்’ என்பதன் முழுப் பொருளையும், நவீன தமிழில் தேவையற்ற மறுபடியும் கூறுதலைத் தவிர்த்து இயல்பாகத் தருகிறது.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே, உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: யோவான் நற்செய்தியின் சிறப்பான இரட்டிப்பு முறையையும் அதன் வலியுறுத்தலையும் காத்து, ‘ஆமென்’ என்ற ஒலிபெயர்ப்பைவிடப் பொதுவான தமிழ் வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: ζητεῖτέ με
  choice: என்னைத் தேடுகிறீர்கள்
  rationale: நிகழ்காலத்தில் தொடரும் தேடுதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘என்னைத் தேடிக்கொண்டிருக்கிறீர்கள்’ என்பது தேவைக்கு அதிகமாக நீளும்.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: …கண்டதால் அல்ல, …நிறைவடைந்ததால்
  rationale: அவர்களின் தேடுதலுக்கான காரணங்களை எதிரெதிராக நிறுத்தும் கிரேக்கக் கட்டமைப்பைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἴδετε σημεῖα
  choice: அடையாளங்களைக் கண்டதால்
  rationale: σημεῖα என்பதற்கு ‘அற்புதங்கள்’ என்று மட்டும் மொழிபெயர்க்காமல், இயேசுவின் செயல்கள் தம்மைத் தாண்டிய உண்மையைச் சுட்டுகின்றன என்ற யோவானின் சொற்பயன்பாட்டைப் பாதுகாக்கிறது; εἴδετε என்பதற்கு ஆன்மிகப் புரிதலைக் கட்டாயப்படுத்தாமல் ‘கண்டதால்’ எனத் தருகிறது.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: அப்பங்களை உண்டு
  rationale: ἄρτων என்பதன் பன்மையைப் பாதுகாக்கிறது. ἐκ என்பதன் சொற்சொல்லான ‘அப்பங்களிலிருந்து’ என்பது தமிழில் இயல்பற்றதால், அதன் பகுதிப்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἐχορτάσθητε
  choice: நிறைவடைந்ததால்
  rationale: உணவு உண்டு முழுமையாகத் திருப்தியடைந்த நிலையைக் குறிக்கும் வினையின் செயப்பாட்டு உணர்வைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது; ‘வயிறு நிறைந்ததால்’ என்பது பொருளை வெளிப்படையாக உடல்சார்ந்ததாக மாற்றும்.
theological_decisions:
- issue: யோவான் நற்செய்தியில் σημεῖα என்பதன் பொருள்
  choice: ‘அடையாளங்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அற்புதங்கள்’ அல்லது ‘அற்புத அடையாளங்கள்’
  rationale: இயேசுவின் செயல்கள் வெறும் வல்லமையான நிகழ்வுகள் மட்டுமல்லாமல் அவரைப் பற்றிய உண்மையைச் சுட்டும் செயல்கள் என்ற யோவானின் கருத்தை ‘அடையாளங்கள்’ பாதுகாக்கிறது; விளக்கச் சொல்லை மூலவசனத்தில் சேர்ப்பதையும் தவிர்க்கிறது.
- issue: கூட்டத்தார் தேடியதற்கான காரணத்தைச் சொல்லும் எதிர்மறை–நேர்மறை முரண்
  choice: ‘கண்டதால் அல்ல … நிறைவடைந்ததால்’ என்ற முரண் அப்படியே காக்கப்பட்டது.
  alternative: அடையாளங்களின் பொருளைப் புரிந்துகொள்ளாததால் அவர்கள் தேடினார்கள் என்று விளக்கமாக விரிவுபடுத்துதல்
  rationale: வசனம் அவர்கள் அடையாளங்களைக் ‘கண்டதை’ மறுப்பதுபோலப் பேசினாலும், அதன் உட்குறிப்பை மொழிபெயர்ப்பிலேயே ‘புரிந்துகொள்ளவில்லை’ என்று தீர்மானிக்காமல், மூலத்தின் இறையியல் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. யோவானின் இரட்டிப்பு வலியுறுத்தல், ‘அடையாளங்கள்’ என்ற முக்கியச் சொல், அப்பங்களைக் குறிக்கும் பன்மை ஆகியவை காக்கப்பட்டுள்ளன.
