id: JHN.6.38
reference: John 6:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ta
  text: ஏனெனில், என் சொந்த விருப்பத்தைச் செய்வதற்காக அல்ல, என்னை அனுப்பியவரின் விருப்பத்தைச் செய்வதற்காகவே நான் வானத்திலிருந்து இறங்கி வந்திருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்; தமிழில் காரணத் தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: καταβέβηκα
  choice: இறங்கி வந்திருக்கிறேன்
  rationale: நிறைவேறிய செயலும் அதன் நிகழ்காலப் பொருத்தமும் உள்ள கிரேக்க perfect வடிவின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: இடஞ்சார்ந்த மூலத்தையும் யோவான் நற்செய்தியின் வானுலகத் தோற்றப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὐχ ἵνα ... ἀλλὰ
  choice: செய்வதற்காக அல்ல ... செய்வதற்காகவே
  rationale: எதிர்மறை நோக்கத்தையும் அதற்கு மாறான உண்மையான நோக்கத்தையும் தமிழில் தெளிவான இணை அமைப்புடன் வெளிப்படுத்துகிறது.
- source_word: ποιῶ
  choice: செய்வதற்கு
  rationale: செயல்படுத்துதல் என்ற அடிப்படைப் பொருளை அதிக விளக்கமின்றி நேரடியாக வழங்குகிறது.
- source_word: τὸ θέλημα
  choice: விருப்பம்
  rationale: ஒருவரின் நோக்கம் அல்லது சித்தத்தை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: τὸ ἐμὸν
  choice: என் சொந்த
  rationale: ἐμὸν என்பதிலுள்ள வலியுறுத்தலைக் காத்து, அனுப்பியவரின் விருப்பத்துடனான வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: τοῦ πέμψαντός με
  choice: என்னை அனுப்பியவரின்
  rationale: கிரேக்க articular participle-ஐ இயல்பான தமிழ்ப் பெயரெச்சத் தொடராகத் தருகிறது; அந்த நபரை இவ்வசனம் கூறுவதைவிட மேலாக அடையாளப்படுத்தவில்லை.
theological_decisions:
- issue: இயேசு வானத்திலிருந்து இறங்கி வந்தார் என்ற கூற்றின் பொருள்
  choice: வானத்திலிருந்து இறங்கி வந்திருக்கிறேன் என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: தெய்வீகப் பணியளிப்பை மட்டும் குறிக்கும் உருவகமாக மெலிதாக்குதல்
  rationale: வசனம் வானத்தை இயேசுவின் வருகையின் மூலமாக நேரடியாகக் கூறுகிறது; கூடுதல் கோட்பாட்டு விளக்கமின்றி அந்தக் கூற்றைக் காக்க வேண்டும்.
- issue: மகனின் விருப்பத்துக்கும் அவரை அனுப்பியவரின் விருப்பத்துக்கும் உள்ள தொடர்பு
  choice: இரண்டிற்கும் ‘விருப்பம்’ என்ற ஒரே சொல்லைப் பயன்படுத்தி எதிர்நிலையைப் பாதுகாத்தல்
  alternative: ‘நான் விரும்புவது / அவர் விரும்புவது’ என்று விரிவாகவும் எளிமைப்படுத்தியும் மொழிபெயர்த்தல்
  rationale: மூலத்தின் சமச்சீர் அமைப்பையும் பணி மற்றும் கீழ்ப்படிதலில் வெளிப்படும் உண்மையான வேறுபாட்டையும் காக்கிறது; அந்தத் தத்துவப் பதற்றத்தை விளக்கி நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘சித்தம்’ என்பதைக் காட்டிலும் தற்போதைய பொதுப் பயன்பாட்டில் தெளிவான ‘விருப்பம்’ தேர்ந்தெடுக்கப்பட்டது; இருமுறை அதையே பயன்படுத்தி மூலத்தின் இணை அமைப்பு காக்கப்பட்டது.
