source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: ta
  text: 'பிலிப்பு அவருக்குப் பதிலளித்தார்: “ஒவ்வொருவரும் சிறிதளவாவது பெறுவதற்கு, இருநூறு தினாரி மதிப்புள்ள அப்பங்கள் அவர்களுக்குப் போதாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: இருநூறு தினாரி மதிப்புள்ள
  rationale: தொகையை நவீன நாணயமாக ஊகித்து மாற்றாமல், மூலத்தின் பண்டைய நாணய அலகையும் மதிப்பு சார்ந்த கட்டமைப்பையும் காக்கிறது.
- source_word: ἄρτοι
  choice: அப்பங்கள்
  rationale: யோவான் 6-ன் சூழலில் பகிரப்படும் அப்பத் துண்டுகள்/அப்பங்கள் என்பதைக் குறிக்கும் இயல்பான தமிழ் பன்மை.
- source_word: οὐκ ἀρκοῦσιν
  choice: போதாது
  rationale: மூலத்தின் போதாமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἕκαστος βραχύ τι λάβῃ
  choice: ஒவ்வொருவரும் சிறிதளவாவது பெறுவதற்கு
  rationale: ἕκαστος என்பதன் தனிநபர் வலியுறுத்தலையும் βραχύ τι என்பதன் மிகச் சிறிய அளவையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ἵνα கூறின் பொருள் தொடர்பு
  choice: “பெறுவதற்கு” என்று நோக்கம்/விளைவு சார்ந்த தொடர்பைத் திறந்தவாறு வைத்தல்
  alternative: “பெற்றால்கூட” அல்லது “ஒவ்வொருவருக்கும் கொஞ்சம் கொடுக்க வேண்டுமென்றாலும்”
  rationale: ἵνα-வின் இலக்கணத் தொடர்பை நேரடியாகக் காக்கிறது; பிலிப்பின் கணக்கீட்டை விளக்கிக் கூறினாலும், மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான உரையாடல் நடை. ‘தினாரி’ ஒலிபெயர்க்கப்பட்டு, அதன் பொருளாதார மதிப்பு குறித்து உறுதியற்ற நவீன சமமதிப்பு சேர்க்கப்படவில்லை. வசனத்தில் அடிக்குறிப்புகள் தேவையில்லை.
