base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: ta
  text: ஆகவே, இயேசுவும் அவருடைய சீடர்களும் அங்கே இல்லை என்று மக்கள் கூட்டத்தினர் கண்டபோது, அவர்களே படகுகளில்[a] ஏறி, இயேசுவைத் தேடி கப்பர்நகூமுக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறு படகுகளில்”; “படகுகள்” என்பதற்கான கிரேக்கச் சொல் சிறுமையைக் குறிக்கும் வடிவில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ஆகவே ... கண்டபோது
  rationale: ὅτε என்பதன் காலத் தொடர்பையும் οὖν என்பதன் தொடர்ச்சி/விளைவுத் தொடர்பையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ὁ ὄχλος
  choice: மக்கள் கூட்டம்
  rationale: கூடியிருந்த திரளான மக்களைக் குறிக்கும் ὄχλος என்பதற்குத் தெளிவான, இயல்பான தமிழ்.
- source_word: εἶδεν
  choice: கண்டபோது
  rationale: மூலத்தின் நேரடியான ‘கண்டது’ என்ற பொருளைத் தக்கவைக்கிறது; ‘உணர்ந்தபோது’ எனக் கருத்துணர்வை மிகைப்படுத்தவில்லை.
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: இயேசுவும் அவருடைய சீடர்களும் அங்கே இல்லை
  rationale: இருவரின் இல்லாமையையும் தமிழின் இயல்பான இணை எதிர்மறை அமைப்பில் தெரிவிக்கிறது.
- source_word: ἐνέβησαν αὐτοὶ
  choice: அவர்களே ... ஏறி
  rationale: ἐνέβησαν என்பதன் படகில் ஏறுதல் என்ற பொருளையும் αὐτοὶ என்பதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: τὰ πλοιάρια
  choice: படகுகளில்
  rationale: முதன்மை உரையில் இயல்பான பொதுச் சொல்லைப் பயன்படுத்துகிறது; சிறுபடகு என்ற diminutive நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: கப்பர்நகூமுக்கு வந்தார்கள்
  rationale: ἦλθον என்பதன் அடிப்படை ‘வந்தார்கள்’ என்ற பொருளையும் இடப்பெயரையும் நேரடியாக வழங்குகிறது.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: இயேசுவைத் தேடிக்கொண்டு
  rationale: உடனடி நிகழ்ச்சிச் சூழலில் அவரைக் கண்டுபிடிக்கத் தேடிய செயலை எளிய நவீனத் தமிழில் தெரிவிக்கிறது; தேவையற்ற ஆன்மிக நுண்பொருளைச் சேர்க்கவில்லை.
