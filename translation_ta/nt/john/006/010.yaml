source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: ta
  text: இயேசு, “மக்களை அமரச் செய்யுங்கள்” என்றார். அந்த இடத்தில் புல் நிறைய இருந்தது. எனவே ஆண்கள் அமர்ந்தார்கள்; அவர்களுடைய எண்ணிக்கை ஏறக்குறைய ஐயாயிரம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதலில் வரும் கிரேக்கச் சொல் ‘மக்கள்’ (ἀνθρώπους) என்று பொதுவாகக் குறிக்கிறது; பின்னர் வரும் சொல் ‘ஆண்கள்’ (ἄνδρες) என்று குறிப்பாகக் குறிக்கிறது. ஆகவே ஏறக்குறைய ஐயாயிரம் என்ற எண்ணிக்கை ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: மக்களை அமரச் செய்யுங்கள்
  rationale: ποιέω + infinitive என்ற காரணவினை அமைப்பின் கட்டளைத் தன்மையை இயல்பான தமிழில் தருகிறது. ἀνθρώπους என்பது இங்கு கூட்டத்திலுள்ள மக்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: அமரச் செய்யுங்கள் / அமர்ந்தார்கள்
  rationale: ἀναπίπτω உணவுக்காகச் சாய்ந்து அமர்வதையும் குறிக்கலாம்; வெளிப்புறத்தில் கூட்டத்தை ஒழுங்காக அமர்த்தும் இச்சூழலில் ‘அமர்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: χόρτος πολὺς
  choice: புல் நிறைய
  rationale: χόρτος இங்கு புல்லையும் πολὺς அதன் மிகுதியையும் குறிக்கின்றன; ‘புல் நிறைய இருந்தது’ என்பது நவீனத் தமிழில் இயல்பான சொற்றொடர்.
- source_word: ἐν τῷ τόπῳ
  choice: அந்த இடத்தில்
  rationale: கதையில் ஏற்கெனவே குறிப்பிடப்பட்ட இடத்தைக் குறிக்கும் இயல்பான தமிழ் இடவுரை.
- source_word: οἱ ἄνδρες
  choice: ஆண்கள்
  rationale: ἀνήρ ஆண்களைச் சிறப்பாகக் குறிக்கிறது; முன் வரும் பொதுப்பொருளுடைய ἀνθρώπους என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: அவர்களுடைய எண்ணிக்கை ஏறக்குறைய ஐயாயிரம்
  rationale: ὡς குறிக்கும் தோராயத்தையும் τὸν ἀριθμόν என்ற வெளிப்படையான எண்ணிக்கைச் சொல்லையும் தெளிவான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: உணவளிப்பு நிகழ்வில் பாலினம் சார்ந்த எண்ணிக்கை
  choice: ἀνθρώπους என்பதை ‘மக்கள்’ என்றும், எண்ணப்பட்ட οἱ ἄνδρες என்பதை ‘ஆண்கள்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘மக்கள்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை கூட்டத்தைக் குறிக்கும் பொதுச் சொல்லிலிருந்து எண்ணிக்கைக்குரிய ஆண்களைக் குறிக்கும் சொல்லுக்கு மாறுகிறது. இந்தச் சொல் வேறுபாட்டை மொழிபெயர்ப்பு பாதுகாக்கிறது; பெண்கள் அல்லது குழந்தைகள் இருந்தார்களா என்பதை வசனம் தானாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்க உரையின் ‘மக்கள்/ஆண்கள்’ வேறுபாடும் தோராய எண்ணிக்கையும் பாதுகாக்கப்பட்டுள்ளன.
