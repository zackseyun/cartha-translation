id: JHN.6.53
reference: John 6:53
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: ta
  text: 'ஆகவே இயேசு அவர்களிடம், “மெய்யாகவே, மெய்யாகவே உங்களுக்குச் சொல்கிறேன்: நீங்கள் மனிதகுமாரனுடைய சதையை[a] உண்டு, அவருடைய இரத்தத்தைக் குடித்தாலொழிய, உங்களுக்குள் வாழ்வு[b] இல்லை” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சதை’ என்பதற்கு ‘உடல்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் σάρξ (‘சதை’) என்று இருப்பதால், இக்கூற்றின் உறுதியான உடல்சார்ந்த வலிமை இங்கே காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனம் ‘வாழ்வு’ என்றே கூறுகிறது; ‘நித்திய வாழ்வு’ என்று கூறவில்லை. எனினும், யோவான் நற்செய்தியின் பரந்த சூழலில் இந்த வாழ்வு பெரும்பாலும் நித்திய வாழ்வோடு தொடர்புபடுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையுடன் உள்ள விளைவு அல்லது முடிவுத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ἀμὴν ἀμὴν
  choice: மெய்யாகவே, மெய்யாகவே
  rationale: யோவான் நற்செய்தியில் வரும் இரட்டிப்பு வலியுறுத்தலையும் கூற்றின் solemn force-ஐயும் காக்கிறது.
- source_word: ἐὰν μὴ
  choice: …த்தாலொழிய
  rationale: ‘அப்படிச் செய்தால் மட்டுமே’ என்ற நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்தும் ‘unless’ கட்டமைப்பு.
- source_word: φάγητε
  choice: உண்டு
  rationale: உண்ணுதல் என்ற நேரடியான பொருளையும் இரத்தத்தைக் குடித்தல் என்பதோடு உள்ள தெளிவான இணைப்பையும் காக்கிறது.
- source_word: σάρκα
  choice: சதை
  rationale: σάρξ என்பதன் உறுதியான, உடல்சார்ந்த, அதிர்வூட்டும் பொருளை நவீன தமிழில் நேரடியாகக் காக்கிறது; ‘உடல்’ என மென்மையாக்கவில்லை.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரனுடைய
  rationale: இயேசுவின் நிலைபெற்ற சுயகுறிப்பையும் அதன் வேதாகம எதிரொலிகளையும் காக்கிறது.
- source_word: πίητε
  choice: குடித்து
  rationale: πίνω என்பதன் நேரடிப் பொருளையும் ‘உண்டு’ என்பதோடு உள்ள இணையான உருவகத்தையும் காக்கிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: மூலத்தின் கூர்மையான உருவகத்தையும் இறையியல் கனத்தையும் விளக்கமின்றிக் காக்கிறது.
- source_word: ζωὴν
  choice: வாழ்வு
  rationale: மூலத்தில் ‘நித்திய’ என்ற பெயரடை இல்லாததால் ζωὴν என்பதை மட்டும் மொழிபெயர்க்கிறது.
- source_word: ἐν ἑαυτοῖς
  choice: உங்களுக்குள்
  rationale: வாழ்வு அவர்களுக்குள் இருப்பதைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சதையை உண்டு இரத்தத்தைக் குடிக்கும் மொழியைத் திருவிருந்து சார்ந்ததாகவோ உருவகமாகவோ விளக்க வேண்டுமா?
  choice: ‘சதையை உண்டு, அவருடைய இரத்தத்தைக் குடித்து’ என்ற நேரடி மொழியை வைத்திருத்தல்
  alternative: ‘அவரில் பங்குபெற்று’ அல்லது ‘அவரை ஏற்றுக்கொண்டு’ போன்ற விளக்க மொழியைப் பயன்படுத்துதல்
  rationale: மூலவாக்கின் திட்டமிட்ட கூர்மையையும், இது திருவிருந்து சார்ந்ததா, உருவகமா, அல்லது இரண்டுமா என்ற இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
- issue: ζωὴν என்பதைச் சூழலின் அடிப்படையில் ‘நித்திய வாழ்வு’ என்று விரிவாக்க வேண்டுமா?
  choice: ‘வாழ்வு’ என்று மட்டும் தருதல்
  alternative: ‘நித்திய வாழ்வு’
  rationale: யோவானின் பரந்த சூழல் நித்திய வாழ்வோடு தொடர்புடையதாக இருந்தாலும், இவ்வசனத்தில் αἰώνιον இல்லை; ஆகவே இல்லாத பெயரடை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கிற்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘சதை’ என்ற சொல் மூலத்தின் திட்டமிட்ட நேரடித்தன்மையைக் காக்கிறது; ‘மெய்யாகவே’ என்ற இரட்டிப்பு யோவானிய வலியுறுத்தலைத் தக்கவைக்கிறது.
