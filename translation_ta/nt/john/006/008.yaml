base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: ta
  text: 'அவருடைய சீடர்களில் ஒருவரான, சீமோன் பேதுருவின் சகோதரர் அந்திரேயா அவரிடம் சொன்னார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: சொன்னார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘சொன்னார்’ இயல்பாகவும் நிகழ்வின் பொருளைத் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: பேச்சின் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; சூழலில் இது இயேசுவைக் குறிக்கிறது. தமிழில் ‘அவரிடம் சொன்னார்’ என்பது இயல்பான அமைப்பு.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில் ஒருவர்
  rationale: εἷς ἐκ என்ற பகுதிப்பொருள் அமைப்பை இயல்பான நவீனத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: μαθητῶν
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் கற்றுக்கொள்வதோடு ஆசிரியரைப் பின்பற்றும் உறவையும் குறிக்கும் நிலைபெற்ற தமிழ் சொல்.
- source_word: Ἀνδρέας
  choice: அந்திரேயா
  rationale: கிரேக்கப் பெயரின் ஒலிப்பைத் தமிழில் அண்மையாகப் பெயர்த்தெழுதுகிறது; தமிழ் வேதாகமப் பயன்பாட்டிலும் அறியப்பட்ட வடிவம்.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: சீமோன் பேதுருவின் சகோதரருமான
  rationale: அந்திரேயாவை அடையாளப்படுத்தும் உடன்பிறப்பு உறவைத் தெளிவாகக் காட்டி, முந்தைய கூறுடன் இயல்பாக இணைக்கிறது.
- source_word: Σίμωνος Πέτρου
  choice: சீமோன் பேதுரு
  rationale: இரு பெயர்களும் ஒரே நபருக்கான இணைந்த அடையாளமாக இருப்பதைப் பாதுகாக்கும் வழக்கமான தமிழ் வடிவம்.
