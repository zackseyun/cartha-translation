source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: ta
  text: வானத்திலிருந்து இறங்கிவந்த அப்பம் இதுவே. முன்னோர்கள் சாப்பிட்டு இறந்ததுபோல் இது அல்ல; இந்த அப்பத்தைச் சாப்பிடுகிறவர் என்றென்றும் வாழ்வார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சொற்படியாக, “யுகத்திற்குள் வாழ்வார்”; இது நிலைத்த, முடிவில்லாத வாழ்வைக் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: அப்பம் இதுவே
  rationale: கிரேக்க மொழியின் சுட்டுப்பெயர்–வினையிணைப்பை இயல்பான தமிழில் வலியுறுத்தலுடன் தருகிறது; உரையாடலில் ஏற்கெனவே அடையாளப்படுத்தப்பட்ட அப்பத்தைக் குறிக்கிறது.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: வானத்திலிருந்து இறங்கிவந்த
  rationale: இறந்தகால வினையெச்சத்தின் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ἐξ என்பதன் ‘இலிருந்து’ பொருளைப் பேணுகிறது.
- source_word: οὐ καθὼς
  choice: போல் இது அல்ல
  rationale: ஒப்பீட்டையும் மறுப்பையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οἱ πατέρες
  choice: உங்கள் முன்னோர்கள்
  rationale: இங்கு வனாந்தரத்தில் மன்னாவை உண்ட இஸ்ரவேலரின் முற்பிதாக்களைக் குறிக்கும் சூழல்பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது. சில கிரேக்கச் சாட்சிகளில் உள்ள ὑμῶν (‘உங்கள்’) வாசகத்தையும் அடிக்குறிப்பில் குறிப்பிடாமல் முதன்மை உரையில் வெளிப்படுத்துகிறது; SBLGNT குறியிட்டுள்ள உரைமாற்றம் காரணமாக மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἔφαγον ... καὶ ἀπέθανον
  choice: சாப்பிட்டும் இறந்துபோன
  rationale: இரு இறந்தகாலச் செயல்களையும் அவற்றின் எதிர்மறை விளைவுறவையும் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: இந்த அப்பத்தைச் சாப்பிடுகிறவர்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் பொதுவான அல்லது தொடர்ச்சியான வலிமையைப் பேணுகிறது; ‘மெல்லுகிறவர்’ என மிகைப்படுத்தாமலும் சடங்குசார் விளக்கத்தைப் புகுத்தாமலும் உள்ளது.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: என்றென்றும் வாழ்வார்
  rationale: ‘யுகத்திற்குள்/யுகம்வரை வாழ்வார்’ என்ற சொற்படியான அமைப்பின் நிலையான யோவானியப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: οἱ πατέρες என்பதன் குறிப்பு
  choice: முன்னோர்கள்
  alternative: தந்தையர் / முற்பிதாக்கள்
  rationale: வனாந்தரத்தில் மன்னாவை உண்ட இஸ்ரவேலின் முந்தைய தலைமுறையைக் குறிக்கிறது. ‘முன்னோர்கள்’ என்பது பாலினத்தைத் தேவையின்றி விரிவுபடுத்தும் நோக்கில் அல்ல, தமிழில் தலைமுறை முன்னோர்களைக் குறிக்கும் இயல்பான கூட்டுப்பெயராகத் தேர்ந்தெடுக்கப்பட்டது; ‘முற்பிதாக்கள்’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τρώγων என்பதன் இறையியல் வலிமை
  choice: சாப்பிடுகிறவர்
  alternative: உட்கொள்கிறவர் / மெல்லுகிறவர்
  rationale: அப்பத்தை உண்ணுதல் பற்றிய உருவக, விசுவாச, திருவிருந்து சார்ந்த வாசிப்புகளில் எதையும் மொழிபெயர்ப்பு தனியாகத் தீர்மானிக்கவில்லை. அடிப்படை வினைச்சொல் பொருளை மட்டும் இயல்பாகப் பேணுகிறது.
- issue: ζήσει εἰς τὸν αἰῶνα என்பதன் காலவியல் பொருள்
  choice: என்றென்றும் வாழ்வார்
  alternative: யுகத்திற்குள் வாழ்வார்
  rationale: இது நிலைத்த வாழ்வைக் குறிக்கும் நிலையான சொற்றொடர். சொற்படியான ‘யுகத்திற்குள்’ தமிழில் தவறாக அல்லது தெளிவின்றி புரியக்கூடும் என்பதால் வழக்குப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்பம்,’ ‘சாப்பிடுகிறவர்,’ ‘என்றென்றும்’ ஆகியவை இயல்பான சொற்கள்; இறையியல் விவாதத்தை முன்கூட்டியே தீர்க்கும் சடங்குசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
