source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: ta
  text: மறுநாள், கடலின் மறுகரையில் நின்றுகொண்டிருந்த மக்கள் கூட்டம், அங்கே ஒரு சிறுபடகைத் தவிர வேறு சிறுபடகு எதுவும் இல்லை என்றும், இயேசு தம் சீடர்களுடன் அந்தப் படகுக்குள் செல்லவில்லை என்றும்,[a] அவருடைய சீடர்கள் மட்டுமே புறப்பட்டுச் சென்றார்கள் என்றும் கண்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் சில கையெழுத்துப் பிரதிகளும் பதிப்புகளும் ‘சிறுபடகு’ (πλοιάριον), ‘படகு’ (πλοῖον) ஆகிய சொற்களை வெவ்வேறு இடங்களில் கொண்டுள்ளன; இம்மொழிபெயர்ப்பு அச்சிடப்பட்ட கிரேக்க உரையின் ஒவ்வொரு கூற்றிலும் உள்ள சொல்லைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: மறுநாள்
  rationale: அடுத்த நாள் நிகழ்வுகளுக்கு மாறுவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: இருந்த மக்கள் கூட்டம்
  rationale: நின்றிருந்தது அல்லது அங்கே தங்கியிருந்தது என்ற நிலைநீடிப்பு நுணுக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: πέραν τῆς θαλάσσης
  choice: கடலின் மறுகரையில்
  rationale: கடலுக்கு அப்பாலுள்ள கரையில் இருந்த இடத்தைக் தெளிவாகக் குறிக்கிறது.
- source_word: εἶδον
  choice: கண்டது
  rationale: ὅτι எனத் தொடங்கும் அடுத்தடுத்த உட்பொருள் வாக்கியங்கள் மக்கள் கூட்டம் அறிந்துகொண்டவற்றை விளக்குவதால், அடிப்படைப் புலனுணர்வு பொருளைத் தக்கவைக்கிறது; கிரேக்கத்தில் எழுவாய் ஒருமையிலும் வினை பன்மையிலும் இருப்பதைத் தமிழில் இயல்பாக ஒத்திசைக்கிறது.
- source_word: πλοιάριον
  choice: சிறுபடகு
  rationale: இச்சொல்லின் சிறுமையைக் குறிக்கும் வடிவ நுணுக்கத்தைத் தமிழில் நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: அங்கே ஒரே ஒரு சிறுபடகைத் தவிர வேறு சிறுபடகு எதுவும் இருக்கவில்லை
  rationale: அங்கே இருந்தது ஒன்றே ஒன்று என்ற விலக்குத்தன்மையையும் வலியுறுத்தலையும் தெளிவாகக் காட்டுகிறது.
- source_word: συνεισῆλθεν
  choice: தம் சீடர்களுடன் ... ஏறவில்லை
  rationale: சீடர்களோடு சேர்ந்து படகுக்குள் செல்லவில்லை என்ற பொருளை படகுப் பயணச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ πλοῖον
  choice: அந்தப் படகில்
  rationale: இக்கூற்றில் உள்ள பொதுவான πλοῖον என்பதைக் ‘படகு’ என்று வேறுபடுத்தி, குறிப்பிட்ட படகைக் குறிக்கும் உருபையும் வெளிப்படுத்துகிறது.
- source_word: μόνοι
  choice: மட்டுமே
  rationale: இயேசு அவர்களுடன் இல்லை; சீடர்கள் மட்டும் சென்றார்கள் என்ற விலக்கைத் தெளிவாக்குகிறது.
- source_word: ἀπῆλθον
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: அங்கிருந்து நீங்கிச் சென்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
