translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் இரண்டு ὅτι உட்பொருள் கூற்றுகளும் ‘என்றும்’ என்ற இணைப்பால் பாதுகாக்கப்பட்டுள்ளன. πλοιάριον மற்றும் πλοῖον இடையிலான வேறுபாடு முறையே ‘சிறுபடகு’, ‘படகு’ எனக் காட்டப்பட்டுள்ளது.
