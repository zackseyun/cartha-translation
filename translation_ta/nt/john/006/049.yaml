base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: ta
  text: உங்கள் முற்பிதாக்கள் வனாந்தரத்தில் மன்னாவை உண்டார்கள்; அவர்கள் இறந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் முன்னோர்கள்.” கிரேக்கத்தில் நேரடியாக “உங்கள் தந்தையர்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: உங்கள் முற்பிதாக்கள்
  rationale: πατέρες என்பதன் நேரடிப் பொருளான ‘தந்தையர்’ என்ற வடிவத்தையும், இங்கு குறிக்கப்படும் இஸ்ரவேலின் முந்தைய தலைமுறையினரையும் இயல்பாகச் சுட்டுகிறது.
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: ἐσθίω என்பதன் இறந்தகால நிகழ்வை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: யாத்திராகமப் பின்னணியிலுள்ள ἔρημος என்பதற்கு வேதாகம இடையிணைப்பைத் தக்கவைக்கும் பரவலாக அறியப்பட்ட தமிழ்ச் சொல்.
- source_word: τὸ μάννα
  choice: மன்னாவை
  rationale: வனாந்தரத்தில் வழங்கப்பட்ட நன்கு அறியப்பட்ட உணவையே குறிப்பிட்டுச் சுட்டுகிறது; தமிழில் வேற்றுமை உருபு பொருத்தமாக இணைக்கப்பட்டுள்ளது.
- source_word: καὶ ἀπέθανον
  choice: ஆனாலும் இறந்தார்கள்
  rationale: καί இங்கு மன்னாவை உண்டபோதிலும் அவர்கள் இறந்தார்கள் என்ற சூழல் சார்ந்த முரண்பாட்டை இணைக்கிறது; ἀπέθανον உண்மையான மரணத்தைக் குறிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் வனாந்தரத் தலைமுறையைக் குறித்தல்
  choice: உங்கள் முற்பிதாக்கள்
  alternative: உங்கள் முன்னோர்கள்
  rationale: ‘முற்பிதாக்கள்’ என்பது மூலத்தின் ஆண்பால் வடிவத்தையும், இயேசு தம் கேட்போருடன் தொடர்புபடுத்திக் கூறும் இஸ்ரவேலின் முந்தைய தலைமுறையையும் பாதுகாக்கிறது; ‘முன்னோர்கள்’ என்பது சாத்தியமான இயல்பான மாற்று.
- issue: மன்னாவை உண்டதற்கும் இறந்ததற்கும் இடையிலான தொடர்பு
  choice: ஆனாலும் இறந்தார்கள்
  alternative: இறந்தார்கள்
  rationale: சூழலில் பரலோகத்திலிருந்து வந்த அப்பத்தை உண்ட வனாந்தரத் தலைமுறையும் இறந்தது என்ற முரண்பாடு வலியுறுத்தப்படுகிறது. இது புதிய இறையியல் விளக்கத்தைச் சேர்க்காமல் உரையின் வாத ஓட்டத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும் கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘மன்னா’, ‘முற்பிதாக்கள்’ ஆகியவை வேதாகமப் பின்னணியைத் தக்கவைக்கின்றன; இறுதிக் குறிப்பு மாற்றுச் சொல்லாக்கத்தையும் மூலத்தின் நேரடி வடிவத்தையும் விளக்குகிறது.
