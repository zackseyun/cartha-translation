revisions:
- from: உங்கள் முற்பிதாக்கள் வனாந்தரத்தில் மன்னாவைச் சாப்பிட்டார்கள்; ஆனாலும் இறந்தார்கள்.[a]
  to: உங்கள் முற்பிதாக்கள் வனாந்தரத்தில் மன்னாவை உண்டார்கள்; அவர்கள் இறந்தார்கள்.[a]
