lexical_decisions:
- source_word: Ὡς δὲ
  choice: வந்தபோது
  rationale: ὡς இங்கு காலச் சூழலை அறிமுகப்படுத்துகிறது; δέ மென்மையான தொடர்ச்சி/மாற்றத்தைக் குறிக்கிறது. தமிழில் தனியான இணைப்புச் சொல்லைச் சேர்க்காமல் காலத் துணைவாக்கியம் இயல்பாக அந்த மாற்றத்தை எடுத்துரைக்கிறது.
- source_word: ὀψία ἐγένετο
  choice: மாலை வந்தபோது
  rationale: மாலை நேரம் தொடங்கியதைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατέβησαν
  choice: சென்றார்கள்
  rationale: மூல வினை கீழ்நோக்கிய இயக்கத்தைக் குறித்தாலும், தமிழில் கடலை நோக்கிச் செல்வதை ‘கடலுக்குச் சென்றார்கள்’ என்று கூறுவது இயல்பானது. ‘இறங்கிச் சென்றார்கள்’ என்பது மூலத்தின் கீழ்நோக்கிய நுணுக்கத்தைத் தெளிவாகக் காட்டும் மாற்று.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: கிரேக்க உரையின் உரிமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: கடலுக்குச்
  rationale: இயக்க வினையுடன் வரும் ἐπί + accusative நீர்நிலையை நோக்கிய/அதன் அருகிலான இயக்கத்தைக் குறிக்கிறது. θάλασσα என்பதன் நேரடி பொருள் ‘கடல்’; கலிலேயக் கடல் தொழில்நுட்ப ரீதியில் ஏரியாக இருந்தாலும் மூலச் சொல்லை முதன்மைப்படுத்துகிறது.
