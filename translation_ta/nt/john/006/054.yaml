id: JHN.6.54
reference: John 6:54
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: ta
  text: என் சதையை உண்பவனும்[a] என் இரத்தத்தைக் குடிப்பவனும் நித்திய வாழ்வைப் பெற்றிருக்கிறான்; நானும் அவனைக் கடைசி நாளில் உயிர்த்தெழுப்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடர்ந்து உண்பவன்’ என்றும், இன்னும் உயிரோட்டமாக ‘மென்று தின்பவன்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் τρώγω, பொதுவான ‘சாப்பிடுதல்’ என்பதைக் காட்டிலும் குறிப்பானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: உண்பவன்
  rationale: பெயர்ச்சொல் போன்று செயல்படும் நிகழ்காலப் பங்கேற்புவினை, அந்தச் செயலில் தொடர்ந்து ஈடுபடுகிற ஒரே நபரைச் சுட்டுகிறது. தமிழில் ‘உண்பவன்’ என்பது ஒருமையையும் செயலைக் கொண்டு வருணிக்கப்படும் நபரையும் இயல்பாகக் காட்டுகிறது.
- source_word: τρώγων
  choice: உண்பவன்
  rationale: τρώγω என்பது பொதுவான ‘சாப்பிடுதல்’ என்பதைவிடத் தெளிவான, சில வேளைகளில் ‘மென்று தின்னுதல்’ என்ற உயிரோட்டமான பொருளைக் கொண்டிருக்கலாம். முதன்மை உரையில் ‘உண்பவன்’ தெளிவும் கண்ணியமும் கொண்டது; வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μου τὴν σάρκα
  choice: என் சதை
  rationale: இங்கு σάρξ உறுதியான உடல் சார்ந்த ‘சதை’ என்பதைக் குறிக்கிறது. நவீன தமிழில் ‘சதை’ நேரடியும் இயல்பானதும்; ‘உடல்’ என்று மென்மைப்படுத்துவதையும் வேறு இடங்களில் வரும் பாவ இயல்பு போன்ற விளக்கத்தைப் புகுத்துவதையும் தவிர்க்கிறது.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: என் இரத்தத்தைக் குடிப்பவனும்
  rationale: இணையான நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயலும், ‘இரத்தம்’ என்ற நேரடிப் பொருளும் மாற்றமின்றிப் பாதுகாக்கப்படுகின்றன.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: நித்திய வாழ்வைப் பெற்றிருக்கிறான்
  rationale: ἔχει நிகழ்காலத்தில் இப்போதே உடையிருப்பதைக் குறிக்கிறது. ‘பெற்றிருக்கிறான்’ என்பது அந்த நிகழ்கால உடைமையை இயல்பான தமிழில் தெரிவிக்கிறது; அதை எதிர்கால வாக்குறுதியாக மாற்றவில்லை.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καὶ ἐγώ என்பதன் இணைந்த வடிவம் தரும் இணைப்பையும் வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும் ‘நானும்’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀναστήσω αὐτόν
  choice: அவனை உயிர்த்தெழச் செய்வேன்
  rationale: உயிர்த்தெழுதல் சூழலில் ἀνίστημι என்பதன் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது. αὐτόν என்பதன் ஆண்பால் ஒருமைச் சுட்டு ‘அவனை’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: கடைசி நாளில்
  rationale: யோவான் நூலில் வரும் இறுதிக்காலச் சொற்றொடரை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: உண்பது, குடிப்பது என்பவற்றைத் திருவருட்சாதனமாகவோ நம்புவதற்கான உருவகமாகவோ விளக்க வேண்டுமா?
  choice: சதை, இரத்தம், உண்பது, குடிப்பது ஆகிய நேரடி மொழி விளக்கச் சேர்க்கையின்றித் தக்கவைக்கப்பட்டது.
  alternative: இதைத் திருவிருந்து பற்றிய வெளிப்படையான குறிப்பாகவோ, நம்புவதற்கான உருவகமாகவோ முதன்மை உரையிலேயே விளக்குதல்.
  rationale: கிரேக்க மூலமே உறுதியான உடல் சார்ந்த சொற்களைப் பயன்படுத்துகிறது. எந்தச் சமயப் பிரிவின் விளக்கத்தையும் உரைக்குள் புகுத்தாமல், மூலத்தின் இறையியல் இழுவிசையும் பலவகை விளக்கத்திற்கான இடமும் பாதுகாக்கப்படுகின்றன.
- issue: αὐτόν என்பதன் பாலினமும் எண்ணும்
  choice: அவனை
  alternative: அந்த நபரை அல்லது அவர்களை
  rationale: இச்சுட்டுப்பெயர் ஆண்பால் ஒருமையில் இருந்து, முன் வரும் ஒருமை நபரைக் குறிக்கிறது; தமிழிலும் அந்த ஒருமைத் தொடர்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்பிற்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘மாம்சம்’ என்பதற்குப் பதில் இச்சூழலில் நேரடியான ‘சதை’ பயன்படுத்தப்பட்டது; வாக்கியத்தின் உறுதியான உண்பது/குடிப்பது மொழி மென்மைப்படுத்தப்படவில்லை.
