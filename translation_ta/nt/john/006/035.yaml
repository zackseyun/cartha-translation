  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “வாழ்வின் அப்பம் நானே. என்னிடம் வருகிறவர் ஒருபோதும் பசியடைய மாட்டார்; என்னை நம்புகிறவர் எக்காலத்திலும் தாகமடைய மாட்டார்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருபோதும் தாகமடையவே மாட்டார்.” கிரேக்க மொழியில் வலியுறுத்தப்பட்ட மறுப்புடன் ‘எக்காலத்திலும்’ என்ற பொருளுள்ள சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வெளிப்படையாக வரும் Ἐγώ தரும் வலியுறுத்தலை இயல்பான தமிழில் ‘நானே’ காக்கிறது; அதற்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: வாழ்வின் அப்பம்
  rationale: மூலத்தின் உருபுசார் அமைப்பையும் உருவகத்தையும் காக்கும் இயல்பான, மரியாதையான தமிழ். ‘வாழ்வளிக்கும் அப்பம்’ என்பது விளக்கமளிக்கும் மொழிபெயர்ப்பாகிவிடும்.
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: என்னிடம் வருகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் பொதுவான, தொடர்ச்சியான தன்மையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ πεινάσῃ
  choice: ஒருபோதும் பசியடைய மாட்டார்
  rationale: οὐ μή என்ற வலுவான மறுப்பைத் தெளிவான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: என்னை நம்புகிறவர்
  rationale: πιστεύω εἰς என்பதன் யோவானிய உறவுசார் பொருளை ‘என்னை நம்புகிறவர்’ இயல்பாகக் காட்டுகிறது; வெறும் ஒரு கருத்தை உண்மையென ஏற்றுக்கொள்வதாகக் குறுக்கவில்லை.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: எக்காலத்திலும் தாகமடைய மாட்டார்
  rationale: οὐ μή மற்றும் πώποτε இணைந்து தரும் வலுவான, எல்லாக் காலத்தையும் உள்ளடக்கும் மறுப்பைக் காக்கிறது; மூலத்தில் இல்லாத ‘மீண்டும்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: ‘சொன்னார்’ என்பதோடு இயல்பாக அமையும் மறைமுகப் பெறுநர் வடிவம்.
theological_decisions:
- issue: πιστεύων εἰς ἐμέ என்பதன் மொழிபெயர்ப்பு
  choice: என்னை நம்புகிறவர்
  alternative: என்மீது நம்பிக்கை வைக்கிறவர்
  rationale: முதன்மைத் தேர்வு சுருக்கமாகவும் இயல்பாகவும் இருந்து, இயேசுவை நோக்கிய தனிப்பட்ட நம்பிக்கையை வெளிப்படுத்துகிறது; மாற்று வாசகம் சாத்தியமானதாயினும் சற்றே விளக்கவுரையாக உள்ளது.
- issue: Ἐγώ εἰμι என்ற சுய அடையாளப்படுத்தலின் வலிமை
  choice: நானே
  alternative: நான்
  rationale: ‘நானே’ என்பது வெளிப்படையான Ἐγώ தரும் வலியுறுத்தலைக் காக்கிறது; யோவானின் ‘நான்’ கூற்றுகளுக்கான மேலதிக இறையியல் விளக்கத்தை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: πώποτε என்பதன் காலவியல் வலிமை
  choice: எக்காலத்திலும்
  alternative: ஒருபோதும்
  rationale: πώποτε என்பது ‘எப்போதாவது/எக்காலத்திலும்’ என்ற பரப்பைக் கொண்டது. ஆகவே ‘மீண்டும்’ என்று மொழிபெயர்த்து முன்னைய தாகத்திற்குப் பிந்தைய நிகழ்வாகக் கட்டுப்படுத்தாமல், மூலத்தின் முழுமையான மறுப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘அப்பம்’ என்ற வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொல்லை உருவகத் தொடர்ச்சிக்காகப் பயன்படுத்துகிறது. இரு இணை வாக்கியங்களின் அமைப்பும் வலுவான மறுப்பும் காக்கப்பட்டுள்ளன.
