reference: John 6:60
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: ta
  text: ஆகவே, அவருடைய சீடர்களில் பலர் இதைக் கேட்டபோது, “இந்தப் போதனை[a] கடினமானது; இதற்கு யார் செவிகொடுக்க முடியும்[b]?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்தக் கூற்று கடினமானது,” “இந்தச் செய்தி கடினமானது” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கச் சொல் ‘சொல்,’ ‘கூற்று,’ ‘செய்தி,’ அல்லது ‘போதனை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இதை யாரால் கேட்க முடியும்?” அல்லது “இதற்கு யாரால் செவிகொடுக்க முடியும்?” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் சூழலுக்கேற்ப கேட்டல், செவிகொடுத்தல், அல்லது ஏற்றுக்கொள்ளுதல் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: பலர்
  rationale: சீடர்களின் பெரிய குழுவுக்குள் கணிசமான எண்ணிக்கையினரைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உரையிலிருந்து எழும் விளைவு அல்லது தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀκούσαντες
  choice: இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலச்சார்பை இயல்பான தமிழில் தருகிறது; ‘இதை’ என்பது முன் கூறப்பட்ட இயேசுவின் உரையைச் சுட்டுகிறது.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: அவருடைய சீடர்களில்
  rationale: பேசியவர்கள் அவருடைய சீடர்களாகிய பெரிய குழுவிலிருந்து வந்தவர்கள் என்ற பகுதி-முழுமை உறவைத் துல்லியமாகக் காட்டுகிறது.
- source_word: Σκληρός
  choice: கடினமானது
  rationale: புரிந்துகொள்வதற்கு மட்டுமல்ல, ஏற்றுக்கொள்வதற்கும் தாங்கிக்கொள்வதற்கும் கடினம் என்ற பரந்த பொருள் நிழலைக் காக்கிறது.
- source_word: ὁ λόγος οὗτος
  choice: இந்தப் போதனை
  rationale: இங்கு λόγος முன்பு கேட்ட உரை அல்லது போதனையைக் குறிக்கிறது; நவீன தமிழில் ‘போதனை’ இயல்பாகவும் தெளிவாகவும் உள்ளது, மாற்றுப் பொருட்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τίς δύναται
  choice: யாரால் ... முடியும்
  rationale: திறன் அல்லது இயலுமையை வினவும் கிரேக்கக் கேள்வியின் இயல்பான தமிழ் அமைப்பு.
- source_word: αὐτοῦ ἀκούειν
  choice: இதை ... ஏற்றுக் கேட்க
  rationale: ἀκούω என்பதிலுள்ள கேட்டல், செவிகொடுத்தல், ஏற்றுக்கொள்ளுதல் ஆகிய பொருள் நிழல்களை அளவுக்கு மீறித் தீர்மானிக்காமல் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் உரைப் பற்றிய சீடர்களின் எதிர்ப்பின் தன்மை
  choice: அந்தப் போதனை கடுமையானதாகவோ ஏற்றுக்கொள்ளக் கடினமானதாகவோ இருப்பதாக அவர்கள் கூறுகின்றனர்; சிக்கல் அறிவுசார், ஒழுக்கவியல் அல்லது மனத்தடையாக இருந்ததா என்பதை மொழிபெயர்ப்பு முடிவுசெய்யவில்லை.
  alternative: அது புரிந்துகொள்வதற்கு மட்டும் கடினம்; அல்லது அது சகிக்க முடியாத அளவு புண்படுத்தும் போதனை.
  rationale: σκληρός என்பது கடினம், கடுமை, ஏற்றுக்கொள்ள இயலாமை போன்ற பொருள் நிழல்களைக் கொண்டிருக்கலாம். ‘கடினமானது’ அவற்றைச் சுருக்கி ஒரே விளக்கமாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘ஏற்றுக் கேட்க’ என்பது சாதாரண செவிப்புலக் கேட்டலைவிட உள்ளார்ந்த செவிகொடுத்தலைக் குறிக்கிறது; இருப்பினும் மூலத்தின் பொருள் விரிவு அடிக்குறிப்பில் காக்கப்படுகிறது.
