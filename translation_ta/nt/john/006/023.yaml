source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: ta
  text: ஆனால், ஆண்டவர் நன்றி செலுத்திய பிறகு அவர்கள் அப்பத்தைச் சாப்பிட்ட இடத்தின் அருகே திபேரியாவிலிருந்து படகுகள் வந்து சேர்ந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “சிறு படகுகள் திபேரியாவிலிருந்து வந்து சேர்ந்தன.” கிரேக்கச் சொல் πλοιάρια சிறுமையைக் குறிக்கும் வடிவத்தில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்நிலையுடன் உள்ள முரண்பாட்டைக் காட்டும் இயல்பான எதிர்மறை இணைப்புச்சொல்.
- source_word: ἦλθεν
  choice: வந்து சேர்ந்தன
  rationale: படகுகள் அங்கு வந்தடைந்ததை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ஒருமை வினைச்சொல் நடுநிலைப் பன்மை எழுவாயுடன் வரும் கிரேக்க வழக்கைத் தமிழில் பொருளுக்கேற்ற பன்மையாக வழங்குகிறது.
- source_word: πλοιάρια
  choice: படகுகள்
  rationale: சொல் வடிவத்தில் சிறுமையைக் குறிக்கும் நுட்பம் இருந்தாலும், இங்கு பொதுவாகப் படகுகளைக் குறிக்கலாம்; வாசிப்பின் இயல்புக்காக முதன்மை உரையில் ‘படகுகள்’ என வழங்கப்பட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκ Τιβεριάδος
  choice: திபேரியாவிலிருந்து
  rationale: தோன்றிய இடத்தைச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐγγὺς τοῦ τόπου ὅπου
  choice: இடத்திற்கு அருகே
  rationale: இடத்தின் அண்மையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; தொடர்பு வாக்கியம் முழு தொடரில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: ἔφαγον τὸν ἄρτον
  choice: அவர்கள் அப்பத்தைச் சாப்பிட்ட
  rationale: முன்னர் குறிப்பிடப்பட்ட குறிப்பிட்ட அப்பத்தையும் நடந்த நிகழ்வையும் இயல்பான தமிழ் இறந்தகால உறவெச்சமாகக் காட்டுகிறது.
- source_word: εὐχαριστήσαντος
  choice: நன்றி செலுத்தியபின்
  rationale: ஆண்டவர் நன்றி செலுத்தியது அவர்கள் சாப்பிட்டதற்கு முன்னதாக நிகழ்ந்தது என்ற கால உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவர்
  rationale: இயேசுவைக் குறிக்கும் மரியாதைமிக்க κύριος பட்டத்திற்கு பொதுவாக ஏற்ற, கிறிஸ்தவத் தமிழில் நிலைபெற்ற சொல்.
theological_decisions:
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு இயேசுவே குறிக்கப்படுகிறார். ‘ஆண்டவர்’ என்பது மரியாதையையும் கிறிஸ்துவியல் ஒலிப்பையும் காக்கிறது; ‘எஜமான்’ என்பது இச்சூழலில் அளவுக்கு மீறி மனித உரிமையாளர் அல்லது தலைவர் என்ற பொருளுக்குச் சுருங்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் மரியாதைமிக்க வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் மைய ஓட்டம் காக்கப்பட்டாலும், காலத் தொடர்பும் இடத் தொடர்பும் தமிழில் இயல்பாக அமைய சொற்களின் வரிசை மாற்றப்பட்டுள்ளது.
