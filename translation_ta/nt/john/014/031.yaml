source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: ta
  text: ஆனால், நான் தந்தையை நேசிக்கிறேன் என்பதை உலகம் அறியும்படி, தந்தை எனக்குக் கட்டளையிட்டபடியே செய்கிறேன்.[a] எழுந்திருங்கள்; இங்கிருந்து போவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் தந்தையை நேசிக்கிறேன் என்பதையும், தந்தை எனக்குக் கட்டளையிட்டபடியே நான் செய்கிறேன் என்பதையும் உலகம் அறியும்படி.”
    reason: 'தொடரியல் மாற்றுவாசிப்பு: καί என்பதற்குப் பின்வரும் கூறையும் ‘உலகம் அறிய’ வேண்டிய இரண்டாவது உள்ளடக்கமாகப் புரிந்துகொள்ளலாம்.'
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ἵνα γνῷ
  choice: அறியும்படி
  rationale: ἵνα உடன் வரும் இறந்தகாலத் துணைவினை வடிவத்தின் நோக்கப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: யோவான் நற்செய்தியில் κόσμος என்பதற்குள்ள மனிதகுலம் சார்ந்த விரிந்த பொருளையும் இலக்கிய எதிரொலியையும் பாதுகாக்கிறது.
- source_word: ἀγαπῶ τὸν πατέρα
  choice: நான் தந்தையிடம் அன்புகூருகிறேன்
  rationale: நிகழ்கால வினையின் நேரான பொருளைத் தருகிறது; கிரேக்கத்தில் இல்லாத ‘என்’ என்ற உடைமைச் சொல்லைச் சேர்க்காமல், தமிழில் உறவுநோக்கிய அன்பை இயல்பாகச் சொல்கிறது.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: தந்தை எனக்குக் கட்டளையிட்டபடியே செய்கிறேன்
  rationale: καθώς–οὕτως காட்டும் துல்லியமான ஒத்திசைவையும், ἐντέλλομαι என்பதின் வலுவான ‘கட்டளையிடுதல்’ பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἐγείρεσθε
  choice: எழுந்திருங்கள்
  rationale: பலரிடம் கூறப்படும் கட்டளை வடிவத்தைத் தெளிவாகவும் மரியாதைமிக்க நவீன தமிழிலும் தருகிறது.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: இங்கிருந்து போவோம்
  rationale: முதல் நபர் பன்மை ஊக்கத் துணைவினையின் ‘போவோம்’ என்ற அழைப்பையும், புறப்படும் இடத்தைக் குறிக்கும் ἐντεῦθεν என்பதையும் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோவான் கிறிஸ்தியலில் πατήρ என்னும் உறவுப் பட்டம்
  choice: தந்தை
  alternative: என் தந்தை
  rationale: கிரேக்க மூலத்தில் வெளிப்படையான உடைமைப் பெயர் இல்லை. ஆகவே அதைச் சேர்க்காமல், தந்தை–மகன் உறவை மூலத்தின் சொற்களிலேயே வைத்திருக்கிறது.
- issue: தந்தை மகனுக்குக் கொடுத்த கட்டளையைச் சுட்டும் ἐντέλλομαι என்பதின் வலிமை
  choice: கட்டளையிட்டார்
  alternative: அறிவுறுத்தினார்
  rationale: மூல வினை கட்டளை அல்லது பொறுப்பு ஒப்படைத்தல் என்ற வலுவான பொருளைக் கொண்டது. கிறிஸ்தியல் காரணங்களுக்காக அதன் வலிமையை மென்மையாக்காமல் காக்கப்படுகிறது.
- issue: καθώς–οὕτως அமைப்பின் தொடரியல்
  choice: தந்தை எனக்குக் கட்டளையிட்டபடியே செய்கிறேன்
  alternative: ‘தந்தை எனக்குக் கட்டளையிட்டபடியே நான் செய்கிறேன்’ என்பதையும் உலகம் அறியும்படி
  rationale: முதன்மை உரை இச்சொற்றொடரை இயேசு என்ன செய்கிறார் என்பதைக் கூறும் பிரதான வாக்கியமாகப் படிக்கிறது. அதேவேளை, ‘உலகம் அறியும்படி’ என்பதுடன் இரண்டாவது அறிதல் உள்ளடக்கமாக இணைக்கும் சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குத் தெளிவானதாயும் வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியமுடையதாயும் அமைக்கப்பட்டுள்ளது. ‘அன்புகூருகிறேன்’, ‘கட்டளையிட்டபடியே’, ‘எழுந்திருங்கள்’ ஆகியவை மூலத்தின் உறவு, கட்டளை, அழைப்பு ஆகிய நுணுக்கங்களை இயல்பாகத் தக்கவைக்கின்றன.
