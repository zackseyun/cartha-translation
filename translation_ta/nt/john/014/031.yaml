  to: ஆனால், நான் தந்தையை நேசிக்கிறேன் என்பதை உலகம் அறியும்படி, தந்தை எனக்குக் கட்டளையிட்டபடியே செய்கிறேன்.[a] எழுந்திருங்கள்; இங்கிருந்து போவோம்.
  rationale: முதன்மை வாக்கியத்தின் பொருளும் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. நேரடிக் கருமத்தை இயல்பாக வெளிப்படுத்த ‘தந்தையை நேசிக்கிறேன்’ எனச் சிறு நடையியல் திருத்தம் செய்யப்பட்டது. அடிக்குறிப்பு முழுமையாக மறுவடிவமைக்கப்பட்டு, மாற்றுத் தொடரியல் வாசிப்பு தெளிவாகவும் முறையான மேற்கோள் குறிகளுடனும் தரப்பட்டுள்ளது; இது ஆங்கில POB audit trail-இல் குறிக்கப்பட்ட மாற்று சாத்தியத்தின் பொருளைத் தக்கவைக்கிறது.
