reference: John 14:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: ta
  text: 'இயேசு அவரிடம் கூறினார்[a]: “வழியும் சத்தியமும் வாழ்வும் நானே. என் மூலமாக அல்லாமல் யாரும் தந்தையிடம் வருவதில்லை.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “இயேசு அவரிடம் கூறுகிறார்.” கடந்த நிகழ்வை உயிரோட்டமாக விவரிக்கும் வரலாற்று நிகழ்காலத்தை கிரேக்கம் இங்கு பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் மூலமாக இல்லாவிட்டால் யாரும் தந்தையிடம் வருவதில்லை.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: கூறினார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், கடந்த நிகழ்வை விவரிக்கும் நவீனத் தமிழில் இறந்தகால வினை இயல்பாக உள்ளது; மூலத்தின் நிகழ்கால வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: இது இயேசுவின் பேச்சைப் பெறுபவரைக் குறிக்கும் வேற்றுமை உருபுடைய பிரதிப்பெயர். தமிழின் மரியாதையான ஒருமை நடை சூழலுக்கு இயல்பாக உள்ளது.
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வெளிப்படையாக இடப்பட்ட ἐγώ தரும் அழுத்தத்தைத் தமிழின் ஏகார வலியுறுத்தல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ ὁδός
  choice: வழி
  rationale: ὁδός என்பதன் நேரடியான மற்றும் உருவகமான பொருட்களையும் ‘வழி’ தக்கவைக்கிறது; இங்கு தந்தையிடம் செல்லும் அணுகுமுறையையும் குறிக்கிறது.
- source_word: ἡ ἀλήθεια
  choice: சத்தியம்
  rationale: ἀλήθεια என்பதன் அடிப்படைப் பொருளான உண்மை அல்லது சத்தியத்தை இச்சொல் வெளிப்படுத்துகிறது; யோவான் நற்செய்தியின் உயர்ந்த நடைக்கு ‘சத்தியம்’ பொருந்துகிறது.
- source_word: ἡ ζωή
  choice: வாழ்வு
  rationale: ζωή குறிக்கும் உயிர் மற்றும் நிறைவான வாழ்வு ஆகிய பரப்பை ‘வாழ்வு’ தக்கவைக்கிறது; ‘நித்திய வாழ்வு’ என விளக்கிச் சேர்க்கப்படவில்லை.
- source_word: οὐδεὶς
  choice: யாரும் … வருவதில்லை
  rationale: முழுமையான மறுப்பைக் குறிக்கும் கிரேக்க வடிவம் தமிழில் இயல்பான எதிர்மறை வாக்கிய அமைப்பாக வழங்கப்படுகிறது.
- source_word: ἔρχεται
  choice: வருவதில்லை
  rationale: இங்கு நிகழ்காலம் பொதுவான, காலவரம்பற்ற உண்மையைச் சொல்கிறது; தமிழ் வழக்கில் பெயரெச்ச வினை அமைப்புடன் எதிர்மறை வடிவம் இதை இயல்பாகக் கூறுகிறது.
- source_word: πρὸς τὸν πατέρα
  choice: தந்தையிடம்
  rationale: πρός உடன் வரும் குற்றுவேற்றுமை தந்தையை நோக்கிய இயக்கத்தைச் சுட்டுகிறது. இங்கு ‘தந்தை’ தேவனுக்கான தனிப்பட்ட அழைப்பாகப் பயன்படுகிறது.
- source_word: εἰ μὴ
  choice: அல்லாமல்
  rationale: இச்சேர்க்கை விதிவிலக்கைக் குறிக்கிறது. ‘அல்லாமல்’ என்பது ‘தவிர’ அல்லது ‘இருந்தாலன்றி’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: δι’ ἐμοῦ
  choice: என் மூலமாக
  rationale: διά உடன் வரும் உருபு வழிமுறை அல்லது இடைமுகத்தைக் குறிக்கிறது. ‘என் மூலமாக’ என்பது அந்த வலிமையைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் மூலமாக மட்டுமே தந்தையிடம் வர முடியும் என்ற தனித்துவக் கூற்று
  choice: “என் மூலமாக அல்லாமல் யாரும் தந்தையிடம் வருவதில்லை” என்று நேரடியாகத் தக்கவைக்கப்பட்டது.
  alternative: “என் வழியாக இருந்தாலன்றி யாரும் தந்தையிடம் வருவதில்லை.”
  rationale: கிரேக்க வாசகம் இயேசுவின் மூலமாகத் தந்தையிடம் வருதல் பற்றிய விதிவிலக்கற்ற கூற்றைத் தெளிவாகச் சொல்கிறது. அதை மென்மைப்படுத்தாமலும் வசனம் சொல்வதைத் தாண்டி விரிவுபடுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: வழி, சத்தியம், வாழ்வு என்ற மூன்று பயனிலைப் பெயர்களின் அமைப்பு
  choice: “வழியும் சத்தியமும் வாழ்வும் நானே” என ஒவ்வொன்றும் தனித்த வலியுறுத்தலுடன் இணைக்கப்பட்டது.
  alternative: “நானே வழி, சத்தியம், வாழ்வு.”
  rationale: கிரேக்கத்தில் ஒவ்வொரு பெயருக்கும் தனித்த வரையறைச் சுட்டு மீண்டும் வருகிறது. தமிழில் ‘-உம்’ இணைப்பை ஒவ்வொரு பெயருடனும் மீண்டும் இடுவது அந்த மும்மை அமைப்பையும் சொல்லாட்சியின் எடையையும் இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘நானே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘வழியும் சத்தியமும் வாழ்வும்’ என்ற அமைப்பு கிரேக்க மும்மையின் தனித்தன்மையையும் ஓசையையும் பிரதிபலிக்கிறது. ‘தந்தை’ என்பது இச்சூழலில் தேவனைச் சுட்டும் தனிப்பட்ட அழைப்பாக உள்ளது.
