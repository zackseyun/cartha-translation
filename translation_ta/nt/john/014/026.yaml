source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: ta
  text: ஆனால், என் பெயரில் தந்தை அனுப்பப்போகிற துணைநிற்பவராகிய[a] பரிசுத்த ஆவியானவர்—அவரே உங்களுக்கு எல்லாவற்றையும் கற்றுக்கொடுப்பார்; நான் உங்களிடம் சொன்ன அனைத்தையும் உங்களுக்கு நினைவூட்டுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துணைநிற்பவர்’ என்பதற்கான கிரேக்கச் சொல் paraklētos. இதை ‘பரிந்துபேசுபவர்,’ ‘உதவியாளர்,’ ‘ஆலோசகர்,’ அல்லது ‘ஆறுதலளிப்பவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: துணைநிற்பவர்
  rationale: சட்டரீதியான பரிந்துபேசுதல், பிரதிநிதித்துவம், உதவி, ஆறுதல் ஆகிய பல நுணுக்கங்களைக் கொண்ட இச்சொல்லுக்கு, ஒருவருக்காகச் செயல்பட்டு அவரோடு நிற்கும் தனிப்பட்ட பங்கை இயல்பான நவீன தமிழில் ‘துணைநிற்பவர்’ வெளிப்படுத்துகிறது. ஒரே தமிழ்ச்சொல் முழுப் பொருள் வரம்பையும் தாங்காததால் மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: தமிழ் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற, கண்ணியமான சமகாலப் பெயர்; இவ்வசனத்தில் காணப்படும் தனிப்பட்ட செயல்பாட்டையும் மரியாதை விகுதியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὃ πέμψει ὁ πατὴρ
  choice: தந்தை அனுப்பப்போகிற
  rationale: எதிர்கால அனுப்புதலைத் தெளிவாகவும் தமிழின் உறவெச்ச அமைப்பில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: மூலத்தின் உருவகத்தைப் பாதுகாத்து, அதிகாரம், பிரதிநிதித்துவம், சார்பாகச் செயல்படுதல் ஆகிய நுணுக்கங்களில் ஒன்றை மட்டும் கட்டாயமாகத் தேர்ந்தெடுக்காமல் விடுகிறது.
- source_word: ἐκεῖνος
  choice: அவரே
  rationale: வலியுறுத்தும் சுட்டுப்பெயரின் தனிப்பட்ட மற்றும் emphatic தன்மையை ‘அவரே’ இயல்பாகக் காக்கிறது.
- source_word: διδάξει ὑμᾶς πάντα
  choice: உங்களுக்கு எல்லாவற்றையும் கற்றுக்கொடுப்பார்
  rationale: வினையின் நேரடியான பொருளையும் πάντα என்பதன் பரப்பையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: ὑπομνήσει ὑμᾶς
  choice: உங்களுக்கு நினைவூட்டுவார்
  rationale: ஒருவரை நினைவுகூரச் செய்யும் காரணவினைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: நான் உங்களிடம் சொன்ன அனைத்தையும்
  rationale: உறவுத்தொடரின் அமைப்பையும் இயேசுவின் நேரடிக் கூற்றையும் பொருள் மாறாமல் காக்கிறது.
theological_decisions:
- issue: பரிசுத்த ஆவியானவரைக் குறிக்கும் தனிப்பட்ட மொழி
  choice: ‘ஆவியானவர்’, ‘அவரே’, ‘கற்றுக்கொடுப்பார்’, ‘நினைவூட்டுவார்’ என்ற தனிப்பட்ட, மரியாதையான வடிவங்கள்
  alternative: இலக்கணப் பாலினத்தை அடிப்படையாகக் கொண்ட ஆளற்ற அல்லது நடுநிலைச் சுட்டல்
  rationale: πνεῦμα இலக்கணரீதியாக நடுநிலை என்றாலும், παράκλητος மற்றும் வலியுறுத்தும் ἐκεῖνος ஆகியவற்றோடு கற்பித்தல், நினைவூட்டுதல் போன்ற தனிப்பட்ட செயல்கள் இணைக்கப்படுகின்றன. ஆகவே தமிழில் தனிப்பட்ட மரியாதை வடிவம் மூலத்தின் உரையாடல் வலிமையைச் சரியாக வெளிப்படுத்துகிறது.
- issue: παράκλητος என்பதன் மொழிபெயர்ப்பு
  choice: துணைநிற்பவர்
  alternative: பரிந்துபேசுபவர்; உதவியாளர்; ஆலோசகர்; ஆறுதலளிப்பவர்
  rationale: சொல்லின் சட்ட, பிரதிநிதித்துவ, ஆதரவு, ஆறுதல் சார்ந்த பல்வேறு நுணுக்கங்களை ஒரே குறுகிய பொருளாகச் சுருக்காமல், செயலில் ஒருவரோடு நின்று உதவும் பங்கை முதன்மைப்படுத்துகிறது; மற்ற உண்மையான சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேற்றரவாளன்’ போன்ற தற்போது அரிதாகவும் பழமையாகவும் ஒலிக்கும் வடிவம் தவிர்க்கப்பட்டது. ‘என் பெயரில்’ என்ற சொற்றொடர் அதன் அதிகாரம்/பிரதிநிதித்துவம் சார்ந்த இயல்பான பொருள் விரிவைத் திறந்தவாறே வைத்துள்ளது.
