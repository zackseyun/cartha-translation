source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: ta
  text: நான் போய் உங்களுக்காக ஓர் இடத்தை ஆயத்தப்படுத்தினால், மீண்டும் வருகிறேன்[a][b]; நான் இருக்கும் இடத்தில் நீங்களும் இருக்கும்படி, உங்களை என்னிடமே அழைத்துக்கொள்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் வருவேன்.” கிரேக்கத்தில் நிகழ்கால வடிவிலுள்ள வினைச்சொல் (“வருகிறேன்”) எதிர்காலப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “மீண்டும் வருகிறேன்” என்பது இயேசுவின் இறுதி மறுவருகையை மட்டும் குறிக்கிறதா, உயிர்த்தெழுதலுக்குப் பிந்தைய அவரது காட்சிகளைக் குறிக்கிறதா, பரிசுத்த ஆவியின் வருகையைக் குறிக்கிறதா, அல்லது இவற்றில் ஒன்றுக்கு மேற்பட்டவற்றை உள்ளடக்கிய அடுக்குள்ள வாக்குறுதியா என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: நான் போய் ... என்றால்
  rationale: ἐάν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்கால நிபந்தனையைத் தெரிவிக்கிறது. இயேசுவின் புறப்படுதலை நேரடியாகவும் இயல்பாகவும் கூற ‘போய் ... என்றால்’ பயன்படுத்தப்பட்டது.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: உங்களுக்காக ஓர் இடத்தை ஆயத்தப்படுத்தினால்
  rationale: ἑτοιμάζω என்பதன் ‘ஆயத்தப்படுத்து’ என்ற பொருளையும் τόπος என்பதன் பொதுவான ‘இடம்’ என்ற பொருளையும் விரிவாக்கமின்றி காக்கிறது.
- source_word: πάλιν ἔρχομαι
  choice: மீண்டும் வருகிறேன்
  rationale: ἔρχομαι நிகழ்கால வடிவத்தில் இருந்தாலும் சூழலில் எதிர்கால நோக்கைக் கொண்டிருக்கிறது. ‘வருகிறேன்’ என்பது கிரேக்கத்தின் உயிரோட்டமான நிகழ்கால வடிவத்தைத் தமிழிலும் காக்கிறது.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: உங்களை என்னிடமே சேர்த்துக்கொள்வேன்
  rationale: παραλαμβάνω இங்கு சீடர்களை இயேசு தமது சொந்த முன்னிலைக்குள் ஏற்றுக்கொள்வதைக் குறிக்கிறது. ‘என்னிடமே’ என்பது πρὸς ἐμαυτόν என்பதன் உறவுசார் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: '... இருக்கும்படி'
  rationale: ἵνα குறிக்கும் நோக்கத்தைத் தமிழில் இயல்பான நோக்க வினையெச்ச அமைப்பான ‘இருக்கும்படி’ தெரிவிக்கிறது.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: நான் இருக்கும் இடத்தில்
  rationale: வெளிப்படையான ἐγώ தரும் வலியுறுத்தலை இயல்பான தமிழ்ச் சொல் வரிசையில் ‘நான்’ போதுமான அளவு தாங்குகிறது; தேவையற்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: καὶ ὑμεῖς ἦτε
  choice: நீங்களும் இருக்கும்படி
  rationale: καί என்பதற்கு ‘உம்’ பொருந்துகிறது; ἵνα-வுடன் வரும் ἦτε-ன் நோக்கநிலையை ‘இருக்கும்படி’ காக்கிறது, அதை வெறும் எதிர்காலக் கூற்றாக மாற்றவில்லை.
theological_decisions:
- issue: πάλιν ἔρχομαι என்பதில் வாக்குறுதி அளிக்கப்படும் இயேசுவின் வருகையின் தன்மை
  choice: குறிப்பிட்ட விதத்தையோ காலத்தையோ நிர்ணயிக்காமல், எதிர்காலத்தை நோக்கிய வாக்குறுதியாக ‘மீண்டும் வருகிறேன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இதை உயிர்த்தெழுதலுக்குப் பிந்தைய காட்சிகள், தூய ஆவியின் வருகை, இறுதிக்கால மறுவருகை, அல்லது ஒன்றுக்கு மேற்பட்ட நிறைவேறுதல்களைக் கொண்ட வாக்குறுதி என்று புரிந்துகொள்ளலாம்.
  rationale: வசனம் இயேசுவின் புதுப்பிக்கப்பட்ட முன்னிலையையும் சீடர்களைத் தம்மிடம் சேர்த்துக்கொள்வதையும் தெளிவாக வாக்களிக்கிறது; ஆனால் அதன் துல்லியமான நிறைவேறும் முறையை மொழிபெயர்ப்பு தனியாக முடிவுசெய்யக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயத்தப்படுத்து’ வேதாகம வாசகர்களுக்கு பரிச்சயமானதாயிருந்தாலும் இன்றைய தமிழிலும் தெளிவாக உள்ளது. நிகழ்கால வடிவத்தின் உயிரோட்டத்தையும் வருகை குறித்த இறையியல் தெளிவின்மையையும் அடிக்குறிப்புகளுடன் காக்கிறது.
