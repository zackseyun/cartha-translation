  to: நான் போய் உங்களுக்காக ஓர் இடத்தை ஆயத்தப்படுத்தினால், மீண்டும் வருகிறேன்[a][b]; நான் இருக்கும் இடத்தில் நீங்களும் இருக்கும்படி, உங்களை என்னிடமே அழைத்துக்கொள்வேன்.
