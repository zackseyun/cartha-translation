id: JHN.14.13
reference: John 14:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: ta
  text: நீங்கள் என் பெயரில் எதைக் கேட்டாலும், அதை நான் செய்வேன்; தந்தை மகனில் மகிமைப்படும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: எதைக் கேட்டாலும்
  rationale: உறவுப்பெயருடன் ἄν சேர்ந்துள்ள அமைப்பு வரையறுக்கப்படாத விரிந்த பொருளைத் தருகிறது; ‘எதைக்...ஆலும்’ என்பது இதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αἰτήσητε
  choice: நீங்கள் ... கேட்டாலும்
  rationale: இது இரண்டாம் நபர் பன்மை வினை; ‘கேட்பது’ வேண்டுதல் அல்லது கோருதல் என்ற பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இந்த யோவான் வழக்குச் சொற்றொடரில் அதிகாரம், பிரதிநிதித்துவம், இயேசுவோடு ஒத்திசைவு ஆகிய பல அடுக்குகள் இருக்கலாம்; ஒரே விளக்கமாகக் குறுக்காமல் சொற்றொடரைத் தக்கவைக்கிறது.
- source_word: τοῦτο
  choice: அதை
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள சுட்டுப்பெயரை இயல்பான தமிழ் தொடர்புக்கு ஏற்றவாறு தக்கவைக்கிறது.
- source_word: ποιήσω
  choice: நான் செய்வேன்
  rationale: ποιέω என்பதன் விரிந்த, நேரடியான பொருளை கூடுதல் விளக்கமின்றி வழங்குகிறது.
- source_word: ἵνα
  choice: இதனால்
  rationale: இங்கு வரும் நோக்கத்தைத் தமிழில் இயல்பாக இணைக்கிறது; இயேசு செய்வதன் விளைவாகவும் நோக்கமாகவும் தந்தை மகிமைப்படுவதைச் சுட்டுகிறது.
- source_word: δοξασθῇ
  choice: மகிமைப்படுவார்
  rationale: செயப்பாட்டு வடிவத்தையும் வேதாகமத்தின் ‘மகிமை’ சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: ὁ πατὴρ
  choice: தந்தை
  rationale: மூலத்தில் ‘என் தந்தை’ என்று இல்லாமல் தனித்துவமான இறை அழைப்பாக ‘தந்தை’ என்றே உள்ளது.
- source_word: ἐν τῷ υἱῷ
  choice: மகனில்
  rationale: ἐν என்பதைக் ‘மூலமாக’ என்று ஒரே பொருளில் முடிவு செய்யாமல், தந்தை மகிமைப்படும் தளம் அல்லது வழிமுறை ஆகிய இரு சாத்தியங்களையும் திறந்தவாறு தக்கவைக்கிறது.
theological_decisions:
- issue: ‘என் பெயரில்’ கேட்பதன் பொருள்
  choice: ‘என் பெயரில்’ என்று விளக்க விரிவாக்கமின்றி தக்கவைக்கப்பட்டது.
  alternative: ‘என் அதிகாரத்தின் அடிப்படையில்’; ‘என்னோடு ஒன்றித்து’; ‘என் குணத்திற்கும் சித்தத்திற்கும் ஏற்ப’
  rationale: இந்தச் சொற்றொடர் யோவான் சூழலில் பல அடுக்குகளைக் கொண்டது; ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மட்டும் முதன்மை உரையில் புகுத்தாமல் அதன் செறிவைத் தக்கவைக்கிறது.
- issue: ἐν τῷ υἱῷ என்பதன் பொருள்
  choice: ‘மகனில்’
  alternative: ‘மகன் மூலமாக’
  rationale: ἐν இங்கு தளம் அல்லது வழிமுறை சார்ந்த பொருளைக் கொண்டிருக்கலாம். கிரேக்கம் ஒரே குறுகிய பொருளை கட்டாயப்படுத்தாததால் நேரடியான வடிவம் முதன்மை உரையில் வைக்கப்பட்டு மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் காரண–நோக்கத் தொடர்பும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி, அது விளக்கும் ‘மகனில்’ என்ற சொற்றொடருடன் இணைக்கப்பட்டுள்ளது.
