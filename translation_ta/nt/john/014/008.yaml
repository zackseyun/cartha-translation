  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: ta
  text: பிலிப்பு அவரிடம், “ஆண்டவரே[a], தந்தையை எங்களுக்குக் காட்டுங்கள்; அதுவே எங்களுக்குப் போதும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா, தந்தையை எங்களுக்குக் காட்டுங்கள்; அதுவே எங்களுக்குப் போதும்.”
    reason: κύριε என்பது சூழலைப் பொறுத்து மரியாதை அழைப்பான ‘ஐயா’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: Λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், நவீனத் தமிழ் கதைநடையில் உரையாடலை அறிமுகப்படுத்த இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: பேச்சின் மறைமுகச் செயப்படுபொருளைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத ‘இயேசு’ என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: Φίλιππος
  choice: பிலிப்பு
  rationale: பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் விளிவேற்றுமை அழைப்பை மரியாதையுடனும் யோவான் நற்செய்தியின் கிறிஸ்துவியல் நிறையுடனும் வெளிப்படுத்துகிறது.
- source_word: δεῖξον
  choice: காட்டும்
  rationale: நேரடியான வேண்டுகோளைக் குறிக்கும் இறந்தகால ஏவல் வடிவத்தின் பொருளை, மரியாதை கலந்த இயல்பான தமிழ் வேண்டுகோளாகத் தருகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: ‘காட்டு’ என்ற வினையுடன் வரும் பன்மைத் தன்மைச் சுட்டுப்பெயரின் இயல்பான தமிழ் வடிவம்.
- source_word: τὸν πατέρα
  choice: தந்தையை
  rationale: இங்கு இயேசுவின் தந்தையாகிய கடவுளைக் குறிக்கிறது. ‘தந்தை’ என்பது நவீன வாசகர்களுக்குத் தெளிவானதும் இயல்பானதும் ஆகும்; உறவுச் சொல்லின் பொருளையும் காக்கிறது.
- source_word: καὶ
  choice: ;
  rationale: கிரேக்க இணைப்புச் சொல் வேண்டுகோளையும் அதன் விளைவாகக் கருதப்படும் போதுமான நிலையையும் இணைக்கிறது. தமிழில் அரைப்புள்ளி இந்த நெருங்கிய தொடர்பை இயல்பாகக் காட்டுகிறது; இணைப்பின் பொருள் நீக்கப்படவில்லை.
- source_word: ἀρκεῖ
  choice: போதும்
  rationale: ‘போதுமானதாக இருத்தல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: ἀρκεῖ என்பதோடு வரும் பன்மைத் தன்மைச் சுட்டுப்பெயரை ‘எங்களுக்குப் போதும்’ என இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கி κύριος என்று அழைத்தல்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சூழலில் வெறும் மரியாதை அழைப்பைவிட அதிக நிறை இருக்கக்கூடும். ‘ஆண்டவரே’ என்பது அந்தக் கிறிஸ்துவியல் சாத்தியத்தைப் பாதுகாக்கிறது; அதேவேளை ‘ஐயா’ என்ற மொழிபெயர்ப்புச் சாத்தியத்தை அடிக்குறிப்பில் வெளிப்படையாக வைக்கிறது.
- issue: τὸν πατέρα என்பதன் குறிப்பு
  choice: தந்தையை
  alternative: பிதாவை
  rationale: யோவான் நற்செய்தியின் சூழலில் இது கடவுளாகிய தந்தையைக் குறிக்கிறது. ‘தந்தை’ மூல உறவுச் சொல்லைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது; குறிப்பிட்ட திருச்சபை மரபின் சொல்வழக்கைத் தேவையின்றி திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘காட்டும்’ என்பது மரியாதை கலந்த வேண்டுகோளாகவும், ‘போதும்’ என்பது ἀρκεῖ என்பதன் இயல்பான சுருக்கமான இணையாகவும் உள்ளது.
