review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys all principal source elements: Philip addresses Jesus, asks that the Father be shown to the group, and says this will be sufficient for them. ‘ஆண்டவரே’ appropriately preserves the primary Johannine force of κύριε, while the footnote responsibly records the less weighty polite-address alternative.'
  naturalness: ‘காட்டும்’ is an older elevated polite imperative and is not the clearest choice for modern standard Tamil; it can also be misread outside a traditional biblical register. ‘காட்டுங்கள்’ is the natural respectful imperative. The rest of the sentence is clear and dignified.
  terminology: ‘பிலிப்பு,’ ‘ஆண்டவரே,’ and ‘தந்தை’ are suitable. ‘தந்தை’ preserves the relational wording of τὸν πατέρα without imposing a denominationally marked term. The alternative ‘ஐயா’ in the note is lexically legitimate, though contextually less likely than ‘ஆண்டவரே.’
  issues:
  - severity: medium
    issue: The imperative ‘காட்டும்’ is not preferred modern standard Tamil usage.
    rationale: δεῖξον is a direct singular imperative addressed respectfully to Jesus. ‘காட்டுங்கள்’ clearly expresses a respectful request in contemporary Tamil, whereas ‘காட்டும்’ is archaic/literary and may be unclear to modern readers.
