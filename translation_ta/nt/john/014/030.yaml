  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: ta
  text: இனி நான் உங்களோடு அதிகம் பேசமாட்டேன்; ஏனெனில் உலகத்தின் ஆட்சியாளர்[a] வந்துகொண்டிருக்கிறான். என்னில் அவனுக்கு எதுவுமில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த உலகத்தின் ஆட்சியாளர்’ என்றும் மொழிபெயர்க்கலாம். யோவான் நூலிலுள்ள ஒத்த சொற்றொடர்களை முன்னிட்டு சில மொழிபெயர்ப்புகள் ‘இந்த’ என்பதைச் சேர்க்கின்றன; ஆனால் இங்கு கிரேக்க உரை ‘உலகத்தின்’ என்று மட்டுமே கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘என்மீது அவனுக்கு உரிமை ஏதுமில்லை’ அல்லது ‘என்மீது அவனுக்குப் பிடி ஏதுமில்லை’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொற்றொடர் நேரடியாக, ‘என்னில் அவனுக்கு எதுவுமில்லை’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω
  choice: இனி நான் அதிகமாகப் பேசமாட்டேன்
  rationale: οὐκέτι காலநிலையின் மாற்றத்தைச் சுட்டுவதால் ‘இனி ... மாட்டேன்’ என இயல்பாகத் தரப்பட்டுள்ளது. πολλὰ இங்கு வினையடைப் பொருளில் ‘அதிகமாக’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μεθ’ ὑμῶν
  choice: உங்களுடன்
  rationale: μετά + வேற்றுமை உருபு சீடர்களுடனான நேரடி உரையாடல் அல்லது உடனிருப்பைச் சுட்டுகிறது; ‘உங்களுடன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἔρχεται
  choice: வந்துகொண்டிருக்கிறான்
  rationale: நிகழ்கால வடிவம் நெருங்கிவரும் நிகழ்வைக் காட்டுகிறது; தொடர்நிலை வடிவம் அதன் உடனடி அணுகுதலை வெளிப்படுத்துகிறது.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: உலகத்தின் ஆளுநன்
  rationale: ἄρχων என்பது அதிகாரம் செலுத்துபவனைச் சுட்டுகிறது. ‘ஆளுநன்’ என்பது நவீன தமிழில் தெளிவானது; கிரேக்கத்தில் இல்லாத ‘இந்த’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: என்னில் அவனுக்கு ஒன்றுமில்லை
  rationale: கிரேக்கத்தின் சுருக்கமான, பலவிதமாகப் புரிந்துகொள்ளக்கூடிய சொற்றொடரை நெருக்கமாகப் பாதுகாக்கிறது. ‘உரிமை இல்லை,’ ‘பிடி இல்லை,’ அல்லது ‘அதிகாரம் இல்லை’ என்ற ஒரே விளக்கத்துக்குள் பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: ‘உலகத்தின் ஆளுநன்’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் கிரேக்கப் பட்டப்பெயரான ‘உலகத்தின் ஆளுநன்’ என்பதையே வைத்தல்
  alternative: ‘சாத்தான்’ என்று நேரடியாக அடையாளப்படுத்துதல்; அல்லது உலகத் தீய சக்திகளின் பொதுவான உருவகமாகக் கொள்ளுதல்
  rationale: யோவான் நூலின் சூழலில் இச்சொல் பொதுவாக சாத்தானைக் குறித்தாலும், மூலவாக்கியம் பெயரைச் சொல்லாமல் பட்டப்பெயரை மட்டுமே பயன்படுத்துகிறது. ஆகவே மறைமுக அடையாளமும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
- issue: ‘என்னில் அவனுக்கு ஒன்றுமில்லை’ என்பதன் பொருள்
  choice: சொற்றொடரின் நேரடியான, திறந்த பொருளைத் தக்கவைத்தல்
  alternative: ‘என்மீது அவனுக்கு உரிமை இல்லை,’ ‘என்மீது அவனுக்குப் பிடி இல்லை,’ அல்லது ‘என்மீது அவனுக்கு அதிகாரம் இல்லை’
  rationale: இச்சொற்றொடர் உரிமை, பிடி, குற்றச்சாட்டு அல்லது பொதுவான ஆதாரம் இல்லாமை போன்ற தொடர்புடைய பொருள்களைத் தாங்கக்கூடும். அவற்றில் ஒன்றை மட்டும் முதன்மை உரையில் நிர்ணயிக்காமல் இறையியல் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. ‘ஆளுநன்’ அதிகாரமுள்ள ஆள்பவரைத் தெளிவாகக் காட்டுகிறது; ‘என்னில் அவனுக்கு ஒன்றுமில்லை’ என்ற செறிவான வடிவம் மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
