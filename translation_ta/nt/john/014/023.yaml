source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: ta
  text: 'இயேசு அவருக்குப் பதிலளித்துச் சொன்னார்: “யாராவது என்னை நேசித்தால், அவர் என் வார்த்தையைக்[a] கடைப்பிடிப்பார்; என் தந்தை அவரை நேசிப்பார்; நாங்கள் அவரிடம் வந்து, அவரிடம் எங்கள் உறைவிடத்தை ஏற்படுத்துவோம்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் போதனையை” அல்லது “நான் சொல்வதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவருடன் குடியிருப்போம்” அல்லது “அவரிடம் நம் இல்லத்தை அமைப்போம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: கிரேக்கத்தின் இரண்டு வினைச்சொல் அமைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Ἐάν τις
  choice: யாராவது … என்றால்
  rationale: பொதுவான, எவருக்கும் பொருந்தும் நிபந்தனையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀγαπᾷ με
  choice: என்னிடம் அன்புகூர்ந்தால்
  rationale: ἀγαπάω என்பதன் உறவுசார் அன்பைத் தெளிவாகக் காட்டுகிறது; வெறும் விருப்பம் என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: τὸν λόγον μου
  choice: என் வார்த்தையை
  rationale: யோவான் நூலின் λόγος சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது; இங்கு இயேசுவின் செய்தி அல்லது போதனை என்ற பொருளையும் ஏற்கிறது.
- source_word: τηρήσει
  choice: கடைப்பிடிப்பார்
  rationale: τηρέω என்பதில் உள்ள காத்தல் மற்றும் கீழ்ப்படிதல் சார்ந்த பொருளை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὁ πατήρ μου
  choice: என் தந்தை
  rationale: இயேசு கடவுளைக் குறித்துப் பயன்படுத்தும் உறவுப் பெயரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: நாங்களும் அவரிடம் வந்து
  rationale: இயேசுவும் தந்தையும் சேர்ந்து அந்த நபரை நோக்கி வருவதாகக் கூறும் பன்மை வினையை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: அவருடன் எங்கள் உறைவிடத்தை அமைத்துக்கொள்வோம்
  rationale: μονή என்பதன் தங்குமிடம் அல்லது உறைவிடம் என்ற பொருளையும் ποιέω கொண்டுள்ள ‘அமைத்துக்கொள்ளுதல்’ என்ற சொற்றொடரையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ἐλευσόμεθα, ποιησόμεθα ஆகியவற்றின் முதலாம் நபர் பன்மை
  choice: “நாங்களும் … வந்து … அமைத்துக்கொள்வோம்” என்று இயேசுவும் தந்தையும் இணைந்து செயல்படுவதைத் தெளிவாக மொழிபெயர்த்தல்
  alternative: பன்மையைத் தெளிவற்ற முறையில் ஒருமைப்படுத்துதல் அல்லது வெறும் தெய்வீக இருப்பாகப் பொதுமைப்படுத்துதல்
  rationale: மூலத்தில் இயேசுவும் தந்தையும் வேறுபட்டவர்களாகக் குறிப்பிடப்பட்டபோதும், வருவதிலும் உறைவிடம் அமைப்பதிலும் இணைந்த பன்மை எழுவாயாக உள்ளனர்; இதை விளக்கவுரை சேர்க்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: பொதுப்பொருள் கொண்ட ஒருமை τις மற்றும் அதைத் தொடரும் ஆண்பால் சுட்டுப்பெயர்கள்
  choice: “யாராவது … அவர்” என்ற பொதுவான ஒருமை அமைப்பு
  alternative: “ஒருவன் … அவன்” என்று வெளிப்படையான ஆண்பால் வடிவைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தின் ஒருமையைத் தக்கவைத்தபடி, பாலினத்தைத் தேவையின்றிக் கட்டுப்படுத்தாத மரியாதையான நவீன தமிழை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “வார்த்தை,” “கடைப்பிடித்தல்,” “உறைவிடம்” ஆகியவை யோவான் உரையின் கருத்துச் செறிவைத் தக்கவைக்கும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் அருகில் வைக்கப்பட்டுள்ளன.
