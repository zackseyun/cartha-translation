revisions:
- from: 'இயேசு அவருக்குப் பதிலளித்துச் சொன்னார்: “யாராவது என்னிடம் அன்புகூர்ந்தால், அவர் என் வார்த்தையைக்[a] கடைப்பிடிப்பார். என் தந்தையும் அவரிடம் அன்புகூருவார். நாங்களும் அவரிடம் வந்து, அவருடன் எங்கள் உறைவிடத்தை அமைத்துக்கொள்வோம்[b].”'
  to: 'இயேசு அவருக்குப் பதிலளித்துச் சொன்னார்: “யாராவது என்னை நேசித்தால், அவர் என் வார்த்தையைக்[a] கடைப்பிடிப்பார்; என் தந்தை அவரை நேசிப்பார்; நாங்கள் அவரிடம் வந்து, அவரிடம் எங்கள் உறைவிடத்தை ஏற்படுத்துவோம்[b].”'
  rationale: The revision corrects the Tamil complementation of the verb ‘love,’ thereby restoring the direct-object relationships expressed by με and αὐτόν. It also renders the dwelling location as “அவரிடம்,” while retaining the Greek plural verbs and the implied shared dwelling of Jesus and the Father. Both footnote anchors remain immediately attached to the relevant expressions.
