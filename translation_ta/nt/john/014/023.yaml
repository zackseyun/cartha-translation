review_pass:
  verdict: revise
  source_fidelity: The conditional structure, the future consequences, and the first-person plural actions of Jesus and the Father are retained. However, the draft's repeated use of “அவரிடம் அன்புகூருவார்” does not naturally express αγαπάω with a direct object in Tamil; it can suggest showing affection toward/at someone rather than plainly loving that person. This should be corrected to “அவரை நேசிப்பார்.”
  naturalness: “என்னிடம் அன்புகூர்ந்தால்” and especially “அவரிடம் அன்புகூருவார்” are not idiomatic modern-standard Tamil for loving a person. “என்னை நேசித்தால்” / “அவரை நேசிப்பார்” is clear, natural, and preserves the relational sense. “அவருடன்” is possible for παρ’ αὐτῷ, but “அவரிடம்” better retains the locative sense in the dwelling expression.
  terminology: “என் வார்த்தை” appropriately preserves Johannine λόγος diction in this context, and “கடைப்பிடிப்பார்” adequately represents τηρήσει. “என் தந்தை” is understandable modern Tamil for ὁ πατήρ μου. The plural “நாங்கள்” and “எங்கள்” properly retain the explicit joint action of Jesus and the Father without doctrinal expansion.
  issues:
  - severity: medium
    issue: The object/construction for ‘love’ is inaccurate or unnatural in two clauses.
    rationale: The draft says “என்னிடம் அன்புகூர்ந்தால்” and “அவரிடம் அன்புகூருவார்.” For ἀγαπᾷ με and ἀγαπήσει αὐτόν, modern Tamil naturally requires “என்னை நேசித்தால்” and “அவரை நேசிப்பார்” (or an equivalent construction with “மேல்”). The correction directly represents the Greek accusative objects.
  - severity: low
    issue: The location of the divine dwelling is better expressed as “அவரிடம்” than “அவருடன்.”
    rationale: παρ’ αὐτῷ denotes dwelling with/at the person. “அவரிடம்” preserves the location while avoiding an unnecessary shift to simple accompaniment; the footnote can retain “அவருடன் குடியிருப்போம்” as a valid idiomatic alternative.
  revised_text: 'இயேசு அவருக்குப் பதிலளித்துச் சொன்னார்: “யாராவது என்னை நேசித்தால், அவர் என் வார்த்தையைக்[a] கடைப்பிடிப்பார்; என் தந்தை அவரை நேசிப்பார்; நாங்கள் அவரிடம் வந்து, அவரிடம் எங்கள் உறைவிடத்தை ஏற்படுத்துவோம்[b].”'
