  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: ta
  text: 'இப்போது நான் உங்களிடம் இதைச் சொல்லியிருக்கிறேன்: அது நிகழ்வதற்கு முன்பே[a], அது நிகழும்போது[b] நீங்கள் நம்பும்படியாக[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அது நடைபெறுவதற்கு முன்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அது நடந்தேறும்போது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இவ்வினைச்சொல் ‘நம்பிக்கை வைப்பது’ என்ற பொருளையும் தரலாம்; இங்கே யோவான் எழுத்துகளில் வழக்கமாகப் பயன்படுத்தப்படும் ‘நம்பு’ என்பது தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: இப்போது
  rationale: νῦν என்பதன் காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது. καί முந்தைய உரையோட்டத்துடனான தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் அந்தத் தொடர்ச்சி வாக்கிய அமைப்பிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: εἴρηκα ὑμῖν
  choice: நான் உங்களிடம் சொல்லியிருக்கிறேன்
  rationale: εἴρηκα என்பதின் நிறைவுற்ற செயலால் தற்போது நிலைக்கும் விளைவை ‘சொல்லியிருக்கிறேன்’ வெளிப்படுத்துகிறது; ὑμῖν என்பதற்கு ‘உங்களிடம்’ இயல்பான இணை.
- source_word: πρὶν γενέσθαι
  choice: அது நிகழ்வதற்கு முன்பே
  rationale: πρίν உடன் வரும் γενέσθαι, மறைமுகமாகக் குறிப்பிடப்பட்ட நிகழ்வு நடைபெறுவதற்கு முந்திய காலத்தைச் சுட்டுகிறது. ‘முன்பே’ முன்கூட்டியே சொல்லப்பட்டதைக் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἵνα
  choice: நம்புவதற்காக
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅταν γένηται
  choice: அது நிகழும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலைக் குறிக்கும் ὅταν + subjunctive அமைப்பைத் தருகிறது; முன்னர் வந்த γίνομαι வினையின் மீளுரைப்பையும் ‘நிகழ்’ என்பதன் மூலம் காக்கிறது.
- source_word: πιστεύσητε
  choice: நீங்கள் நம்புவதற்காக
  rationale: யோவான் நூலில் πιστεύω என்பதற்கான இயல்பான, நிலையான தமிழ் இணை ‘நம்பு’. இது முதன்முறையாக நம்புவதா அல்லது ஏற்கெனவே உள்ள நம்பிக்கை உறுதிப்படுவதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: இச்சூழலில் πιστεύσητε என்பதன் பொருள் வலிமை
  choice: நீங்கள் நம்புவதற்காக
  alternative: நீங்கள் தொடர்ந்து நம்புவதற்காக; நீங்கள் நம்பிக்கை வைப்பதற்காக
  rationale: இயேசுவின் முன்னறிவிப்பு, நிகழ்வு நடந்தபோது நம்பிக்கையை உருவாக்கவோ உறுதிப்படுத்தவோ நோக்கமுடையதாக இருக்கலாம். கிரேக்க வினை இங்கே தொடக்க நம்பிக்கையையும் தொடரும் நம்பிக்கையையும் வெளிப்படையாக வேறுபடுத்தாததால், மொழிபெயர்ப்பு அந்தத் திறந்த பொருளை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ஒரே மூலவினையான γίνομαι இருமுறை வருவது ‘நிகழ்’ என இரு இடங்களிலும் ஒரேபோல் தரப்பட்டுள்ளது; நம்பிக்கை தொடங்குகிறதா அல்லது வலுப்படுகிறதா என்ற இறையியல் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
