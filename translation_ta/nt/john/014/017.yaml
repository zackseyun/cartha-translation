id: JHN.14.17
reference: John 14:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: ta
  text: சத்தியத்தின் ஆவியானவரை[a] உலகம் பெற்றுக்கொள்ள முடியாது; ஏனெனில் அது அவரைக் காணவுமில்லை, அறியவுமில்லை. நீங்கள் அவரை அறிகிறீர்கள்; ஏனெனில் அவர் உங்களோடு தங்கியிருக்கிறார், உங்களுக்குள் இருப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கிரேக்கத்தின் இலக்கண நடுநிலைப் பாலைப் பின்பற்றி, ‘சத்தியத்தின் ஆவியை.’ கிரேக்கத்தில் ‘ஆவி’ (πνεῦμα) நடுநிலைப் பாலானது; ஆனால் இங்கு அதன் குறிப்பு தனிப்பட்டது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களிடையே இருப்பார்.’ ‘நீங்கள்’ என்பது பன்மை என்பதால் கிரேக்கத்தை இவ்வாறும் புரிந்துகொள்ளலாம்; ஆனால் ‘உங்களோடு’ என்பதற்கு எதிராக ‘உங்களுக்குள்’ என்பது வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα τῆς ἀληθείας
  choice: சத்தியத்தின் ஆவியானவர்
  rationale: கிரேக்கத்தின் உடைமைவேற்றுமைத் தொடரை ‘சத்தியத்தின்’ என்று பாதுகாக்கிறது. யோவான் சூழலில் பரிசுத்த ஆவியானவரே குறிக்கப்படுவதால், தமிழில் தனிப்பட்டவரைக் குறிக்கும் ‘ஆவியானவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவான் எழுத்துகளில் உள்ள κόσμος என்பதன் பரந்த பொருளை ஒரு குறிப்பிட்ட மனிதக் குழுவாகவோ உலக அமைப்பாகவோ சுருக்காமல் பாதுகாக்கிறது.
- source_word: οὐ δύναται λαβεῖν
  choice: பெற்றுக்கொள்ள முடியாது
  rationale: δύναται என்பதிலுள்ள இயலாமையையும் λαβεῖν என்பதிலுள்ள பெறுதல் என்ற பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: θεωρεῖ
  choice: காண்பது
  rationale: உணர்தல் என்று கூடுதல் விளக்கம் சேர்க்காமல், கிரேக்க வினையின் பார்வை சார்ந்த அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: γινώσκει / γινώσκετε
  choice: அறிந்திருப்பது / அறிந்திருக்கிறீர்கள்
  rationale: உலகத்தின் அறியாமைக்கும் சீடர்களின் அறிவுக்கும் இடையிலுள்ள ஒரே வினைச்சொல் சார்ந்த எதிர்மறையைத் தமிழிலும் நிலைநிறுத்துகிறது.
- source_word: παρ’ ὑμῖν μένει
  choice: உங்களோடு தங்கியிருக்கிறார்
  rationale: παρά என்பதைக் ‘உங்களோடு’ என்றும் μένει என்பதைக் தொடரும் இருப்பைக் குறிக்கும் ‘தங்கியிருக்கிறார்’ என்றும் வழங்குகிறது.
- source_word: ἐν ὑμῖν ἔσται
  choice: உங்களுக்குள் இருப்பார்
  rationale: ἐν என்பதன் இயல்பான ‘உள்ளே’ என்ற பொருளையும் ἔσται என்பதன் எதிர்கால காலத்தையும் பாதுகாக்கிறது; ‘உங்களோடு’ என்பதிலிருந்து உள்ள வேறுபாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இலக்கண ரீதியாக நடுநிலைப் பாலில் உள்ள πνεῦμα என்பதற்கான தனிப்பட்ட குறிப்பு
  choice: ஆவியானவரை ‘அவர்’ என்று தனிப்பட்டவராகக் குறிப்பிடுதல்
  alternative: ‘அது’ என்று இலக்கண நடுநிலை வடிவில் குறிப்பிடுதல்
  rationale: கிரேக்கத்தில் πνεῦμα நடுநிலைப் பால் என்றாலும், உடனடிச் சூழல் ஆவியானவரைத் தனிப்பட்ட செயலாளராகக் காட்டுகிறது. தமிழில் ‘அவர்’ என்பது அந்தக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது; இலக்கணப் பாலையே தெய்விய இயல்புக்கான தீர்ப்பாக மாற்றுவதில்லை.
- issue: ஆவியானவருக்கும் சீடர்களுக்கும் உள்ள உறவில் παρά மற்றும் ἐν ஆகியவற்றின் வேறுபாடு
  choice: ‘உங்களோடு’ மற்றும் ‘உங்களுக்குள்’ என்ற இரு வேறுபட்ட சொற்றொடர்களையும் பாதுகாத்தல்
  alternative: இரண்டையும் பொதுவாக ‘உங்களோடு’ அல்லது ‘உங்களிடையே’ என்று சமப்படுத்துதல்
  rationale: மூலத்தில் இரு வேறுபட்ட முன்னிடைச்சொற்கள் உள்ளன. அவற்றின் இடவியல் மற்றும் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவியானவர்’, ‘அவர்’ ஆகிய மரியாதைத் தனிப்பட்ட வடிவங்கள் தமிழ் வழக்கில் இயல்பானவை. உலகத்தைக் குறிக்க ‘அது’ என்றும் ஆவியானவரைக் குறிக்க ‘அவர்’ என்றும் பயன்படுத்தி குறிப்புகள் தெளிவாக்கப்பட்டுள்ளன.
