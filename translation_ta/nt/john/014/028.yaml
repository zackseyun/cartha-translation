reference: John 14:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: ta
  text: “நான் போகிறேன்; உங்களிடம் வருகிறேன்” என்று நான் உங்களிடம் சொன்னதை நீங்கள் கேட்டீர்கள். நீங்கள் என்னை நேசித்திருந்தால், நான் தந்தையிடம் போகிறேன் என்பதற்காக மகிழ்ந்திருப்பீர்கள்[a]; ஏனெனில் தந்தை என்னைவிடப் பெரியவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகிழ்வீர்கள்” என்றும் மொழிபெயர்க்கலாம். எனினும், இங்குள்ள கிரேக்க நிபந்தனை அமைப்புக்கு “மகிழ்ந்திருப்பீர்கள்” என்பது சூழலில் சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தந்தை என்னைவிடப் பெரியவர்” என்பது மூலத்தில் உள்ளபடியே மொழிபெயர்க்கப்பட்டுள்ளது; “பங்கில்” அல்லது “நிலையில்” போன்ற விளக்கத் தகுதிகள் சேர்க்கப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: கேட்டீர்கள்
  rationale: இறந்தகால வினை வடிவம், இயேசு முன்பு கூறியதைச் சீடர்கள் கேட்ட முடிவுற்ற நிகழ்வைக் குறிக்கிறது.
- source_word: Ὑπάγω
  choice: நான் போகிறேன்
  rationale: சீடர்களிடமிருந்து புறப்படுவதைக் குறிக்கும் நிகழ்கால வடிவத்தின் அண்மைக்கால எதிர்காலத் தன்மையையும் உயிரோட்டத்தையும் காக்கிறது.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: உங்களிடம் வருகிறேன்
  rationale: மூலத்தின் நிகழ்கால வடிவத்தையும் எதிர்நோக்கிய வருகையையும் காக்கிறது; மூலத்தில் இல்லாத ‘மீண்டும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: εἰ ἠγαπᾶτέ με
  choice: நீங்கள் என்னை நேசித்திருந்தால்
  rationale: நிறைவேறாத நிபந்தனையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐχάρητε ἄν
  choice: மகிழ்ந்திருப்பீர்கள்
  rationale: ἄν உடன் வரும் இறந்தகால வடிவம், நிகழ்ந்திருக்கும் ஆனால் நிகழவில்லை எனக் கருதப்படும் எதிர்வினையைச் சுட்டுகிறது.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: நான் தந்தையிடம் போவதால்
  rationale: தந்தையை நோக்கிய பயணத்தையும், இவ்விடத்தில் ὅτι தரும் காரணப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πατέρα / πατὴρ
  choice: தந்தை
  rationale: வெளிப்படையான உடைமைச் சொல்லைச் சேர்க்காமல், யோவான் நூலில் வரும் பட்டப்பெயரின் தன்மையைப் பாதுகாக்கிறது.
- source_word: μείζων μού
  choice: என்னைவிடப் பெரியவர்
  rationale: ஒப்பீட்டை நேரடியாகத் தருகிறது; ‘பங்கு’, ‘நிலை’ போன்ற விளக்கச் சொற்களை வசனத்தில் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘தந்தை என்னைவிடப் பெரியவர்’ என்ற கூற்றின் கிறிஸ்துவியல் பொருள்
  choice: ஒப்பீட்டை எந்த விளக்கத் தகுதியும் சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘பங்கில் பெரியவர்’ அல்லது ‘மனித அவதார நிலையில் என்னைவிடப் பெரியவர்’ என்று விளக்கிச் சேர்த்தல்
  rationale: கிரேக்க வாசகம் ஒப்பீட்டைத் தெளிவாகக் கூறினாலும், அது எந்தக் குறிப்பிட்ட வகையில் பொருந்துகிறது என்பதை இவ்வசனத்தில் விளக்கவில்லை. ஆகவே அதன் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இயேசுவின் நேரடி உரையில் உள்ள நிகழ்கால இயக்க வினைகள் காக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத விளக்கச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
