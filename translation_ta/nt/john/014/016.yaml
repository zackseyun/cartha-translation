id: JHN.14.16
reference: John 14:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: ta
  text: நானும் தந்தையிடம் கேட்பேன்; அவர் என்றென்றும் உங்களோடு இருக்கும்படி மற்றொரு துணைநிற்பவரை[a] உங்களுக்குத் தருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உதவியாளர்,” “உங்களுக்காகப் பரிந்துபேசுபவர்,” “ஆலோசகர்,” அல்லது பாரம்பரியமாக “ஆறுதலளிப்பவர்.” கிரேக்கச் சொல் παράκλητος இப்பொருள் நுணுக்கங்களைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: நானும்
  rationale: καί + ἐγώ என்பதிலுள்ள தொடர்ச்சியையும் மென்மையான வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது; அளவுக்கு மீறிய எதிர்மறை அழுத்தத்தைச் சேர்க்கவில்லை.
- source_word: ἐρωτήσω
  choice: கேட்பேன்
  rationale: ἐρωτάω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘மன்றாடுவேன்’ போன்ற தேவையற்ற சமயச் சாயலைச் சேர்க்கவில்லை.
- source_word: τὸν πατέρα
  choice: தந்தையிடம்
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் இல்லாததால் ‘என் தந்தை’ என்று சேர்க்காமல், யோவான் வழக்குக்கு ஏற்ப ‘தந்தை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἄλλον
  choice: வேறொரு
  rationale: ஏற்கெனவே உள்ள ஒருவரிலிருந்து வேறுபட்ட இன்னொருவரைக் குறிக்கும் ἄλλος என்பதன் எளிய பொருளைப் பாதுகாக்கிறது.
- source_word: παράκλητον
  choice: துணையாளரை
  rationale: παράκλητος என்பதன் உதவி, ஆதரவு, ஒருவருக்காகப் பேசுதல் ஆகிய பரந்த பொருள் வளையத்தை வாசிக்க எளிய, ஆள்தன்மையைப் பாதுகாக்கும் தமிழ்ச் சொல்லால் தருகிறது; பிற முக்கிய பொருள் வாய்ப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: δώσει ὑμῖν
  choice: உங்களுக்குத் தருவார்
  rationale: எதிர்கால வினையையும் மறைமுகப் பெறுபொருளையும் இயல்பான தமிழ் சொல் வரிசையில் தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα ᾖ
  choice: இருக்கும்படி
  rationale: ἵνα உடன் வரும் நிகழ்கால ஏவல் வடிவத்தின் நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு
  rationale: μετά + உடைமை வேற்றுமையின் ‘உடன்’ என்ற நேரடியான உறவுப் பொருளைக் காட்டுகிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: யோவான் சூழலில் நிலையான நீடிப்பைக் குறிக்கும் இந்த மரபுத்தொடரைத் தெளிவான நவீன தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: திரித்துவச் சூழலில் παράκλητος என்பதன் மொழிபெயர்ப்பு
  choice: துணையாளர்
  alternative: பரிந்துபேசுபவர்; ஆலோசகர்; ஆறுதலளிப்பவர்
  rationale: ‘வேறொரு παράκλητος’ என்பது ஆள்தன்மையுள்ள ஒருவரையும் உதவி, ஆதரவு, பிரதிநிதித்துவம் போன்ற பல செயல்களையும் குறிக்கக்கூடும். ‘துணையாளர்’ இவற்றில் ஒன்றை மட்டும் மிகையாக நிர்ணயிக்காமல் இயல்பாக வாசிக்க உதவுகிறது; சொல்லின் சட்ட, ஆலோசனை, ஆறுதல் சார்ந்த பிற நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இணைப்பும் நோக்க உறவும் காக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக நோக்கத் தொடர் பிரதான வினைக்கு முன் வைக்கப்பட்டுள்ளது.
