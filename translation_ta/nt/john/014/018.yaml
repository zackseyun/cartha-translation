review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the future negation (Οὐκ ἀφήσω), the predicate image ὀρφανούς, and the present-form ‘I am coming’ (ἔρχομαι) with its unresolved referent. A small revision makes the concrete Greek image more direct without adding ‘children,’ which is already inherent in ‘orphans.’
  naturalness: ‘பெற்றோரற்ற பிள்ளைகளாக’ is understandable but somewhat explanatory and heavier than natural modern Tamil in this short saying. ‘அனாதைகளாக’ is concise, idiomatic, and preserves the familial image. The explanatory nuance belongs well in the footnote.
  terminology: ‘அனாதைகள்’ is an established modern Tamil equivalent for ὀρφανούς. ‘பரிசுத்த ஆவி’ is the more customary standard Tamil biblical term in the explanatory note. The wording retains ambiguity about the manner and timing of Jesus’ coming.
  issues:
