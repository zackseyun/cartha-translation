revisions:
- from: நான் உங்களைப் பெற்றோரற்ற பிள்ளைகளாக விட்டுவிடமாட்டேன்;[a] நான் உங்களிடம் வருகிறேன்.[b]
  to: நான் உங்களை அனாதைகளாக விட்டுவிடமாட்டேன்;[a] நான் உங்களிடம் வருகிறேன்.[b]
  rationale: The revision improves idiomatic modern Tamil while maintaining the Greek’s concrete orphan image and the present-form immediacy of ‘வருகிறேன்.’ The footnote continues to explain, rather than resolve, the possible referent of Jesus’ coming.
