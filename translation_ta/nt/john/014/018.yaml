    rationale: Although faithful in sense, it is less idiomatic than ‘அனாதைகளாக’ and redundantly spells out the child element already conveyed by ‘orphans.’
  - severity: low
    issue: Footnote b says ‘உயிர்த்தெழுந்த பின் வந்ததை,’ which is slightly awkward in this list of possible referents.
    rationale: ‘உயிர்த்தெழுதலுக்குப் பிந்தைய வருகையை’ is smoother and more parallel with the other noun phrases.
