  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: ta
  text: நான் உங்களை அனாதைகளாக விட்டுவிடமாட்டேன்;[a] நான் உங்களிடம் வருகிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் உங்களைப் பெற்றோரின் பராமரிப்பின்றி விடப்பட்டவர்களாக விட்டுவிடமாட்டேன்.’ கிரேக்க உருவகம், பெற்றோரின் பராமரிப்பின்றி விடப்படும் பிள்ளைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நான் உங்களிடம் வருகிறேன்’ என்பது இயேசுவின் உயிர்த்தெழுதலுக்குப் பிந்தைய வருகையை, பரிசுத்த ஆவியின் மூலம் அவர் வருவதை, அல்லது அவரது எதிர்கால மறுவருகையைச் சுட்டலாம்; கிரேக்க வாசகம் இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: விட்டுவிடமாட்டேன்
  rationale: இங்கு ἀφίημι என்பது ‘விட்டுச் செல்லுதல்’ என்ற பொருளில் வருகிறது. எதிர்கால மறுப்பைத் தமிழில் இயல்பாகவும் உறுதியாகவும் ‘விட்டுவிடமாட்டேன்’ வெளிப்படுத்துகிறது.
- source_word: ὀρφανούς
  choice: பெற்றோரற்ற பிள்ளைகளாக
  rationale: ὀρφανός குறிக்கும் பெற்றோரின் பராமரிப்பை இழந்த பிள்ளைகள் என்ற குடும்ப உருவகத்தை இது தெளிவாகப் பாதுகாக்கிறது. ‘அனாதைகள்’ என்பதைக் காட்டிலும் இச்சொற்றொடர் உருவகத்தின் பொருளை நேரடியாக உணர்த்துகிறது.
- source_word: ἔρχομαι
  choice: வருகிறேன்
  rationale: கிரேக்க நிகழ்கால வடிவத்தின் உடனடித் தன்மையையும், நெருங்கிய எதிர்காலத்தைக் குறிக்கக்கூடிய வலிமையையும் ‘வருகிறேன்’ பாதுகாக்கிறது; அதை எளிய எதிர்காலமாக மாற்றவில்லை.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: ஒருவரை நோக்கிய வருகையைத் தமிழில் இயல்பாகக் குறிக்கும் வடிவம் ‘உங்களிடம்’.
- source_word: Οὐκ
  choice: மாட்டேன்
  rationale: எதிர்கால வினையுடன் சேர்ந்த கிரேக்க மறுப்பு தமிழில் ‘விட்டுவிடமாட்டேன்’ என்ற எதிர்மறை எதிர்கால வடிவால் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: ‘நான் உங்களிடம் வருகிறேன்’ என்பதன் குறிப்பு மற்றும் காலம்
  choice: இயேசுவின் வருகை எதைக் குறிப்பதாகும் என்பதை முதன்மை உரையில் குறிப்பிட்டுத் தீர்மானிக்காமல் வைத்தல்
  alternative: உயிர்த்தெழுதலுக்குப் பிந்தைய தோற்றங்கள், தூய ஆவியின் வழியான வருகை, அல்லது எதிர்கால இறுதி வருகை என்று ஒன்றை மட்டும் குறிப்பிடுதல்
  rationale: சூழல் தூய ஆவியைப் பற்றிய வாக்குறுதியையும் இயேசு சீடர்களிடம் திரும்பி வருவதையும் உள்ளடக்குகிறது. கிரேக்க வாசகம் ஒரே குறிப்பை கட்டாயப்படுத்தாததால் அதன் உண்மையான இறையியல் விரிவும் பதற்றமும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. குடும்ப உருவகம் தெளிவாகப் பாதுகாக்கப்பட்டு, வருகையின் குறிப்பைப் பற்றிய மூலமொழியின் தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
