id: JHN.14.22
reference: John 14:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: ta
  text: இஸ்காரியோத்து அல்லாத யூதாஸ் அவரிடம், “ஆண்டவரே, நீங்கள் உலகத்துக்கு அல்லாமல் எங்களுக்கு உங்களை வெளிப்படுத்த[a]ப் போகிறீர்களே—என்ன நடந்தது?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை எங்களுக்கு அறியச் செய்யப் போகிறீர்களே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்று கேட்டார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடை இறந்தகாலத்தில் தருகிறது; வாக்கியம் கேள்வியாக இருப்பதால் ‘சொன்னார்’ என்பதற்குப் பதிலாக ‘கேட்டார்’ என்பது சூழலுக்கு இயல்பானது.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: இஸ்காரியோத்து அல்லாத யூதாஸ்
  rationale: இவர் யூதாஸ் இஸ்காரியோத்து அல்ல என்பதை மூலத்தின் அடையாள வேறுபாட்டுடன் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும் κύριος என்ற பட்டத்தின் இறையியல் எடையையும் காக்கிறது.
- source_word: τί γέγονεν
  choice: என்ன நடந்தது?
  rationale: γίνομαι என்பதன் நிறைவுக்கால வடிவம், நிகழ்ந்த ஒன்றால் உருவான தற்போதைய நிலையைச் சுட்டுகிறது. கேள்வியை இறுதியில் வைப்பது இயல்பான தமிழில் இந்த வலியுறுத்தலைக் காக்கிறது.
- source_word: ὅτι
  choice: …போகிறீர்களே—
  rationale: ὅτι இங்கு கேள்விக்கான சூழல் அல்லது விளக்க உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழ் ‘-கிறீர்களே’ அமைப்பு அந்த தொடர்பை காரணமாக மட்டும் கட்டுப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: தன்னை வெளிப்படுத்திக்கொள்ளும் செயலைப் பெறுபவர்களைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: μέλλεις
  choice: வெளிப்படுத்தப் போகிறீர்கள்
  rationale: வரவிருக்கும் செயல் அல்லது நோக்கம் என்ற இரு நிழற்பொருள்களுக்கும் இடமளிக்கும் இயல்பான நவீன தமிழ் வடிவம்.
- source_word: ἐμφανίζειν σεαυτόν
  choice: உங்களை வெளிப்படுத்த
  rationale: தன்னைத் தானே காணத்தக்கதாக அல்லது அறியத்தக்கதாகச் செய்தல் என்ற பரப்பை ‘வெளிப்படுத்த’ இயல்பாகத் தருகிறது; reflexive பொருளை ‘உங்களை’ காக்கிறது.
- source_word: κόσμῳ
  choice: உலகத்துக்கு
  rationale: யோவானின் κόσμος சொல்லாட்சியிலுள்ள விரிந்த இறையியல் நிழல்களை விளக்கி முடிவுசெய்யாமல் ‘உலகம்’ என்ற சொல்லையே காக்கிறது.
theological_decisions:
- issue: யோவான் நூலில் κόσμος என்பதன் பொருள்
  choice: உலகம்
  alternative: மனிதகுலம் பொதுவாக / நம்பாத உலக ஒழுங்கு
  rationale: இந்த வசனம் κόσμος என்பதன் எல்லா நிழற்பொருள்களையும் தீர்மானிக்கவில்லை. ‘உலகம்’ என்பது யோவானின் சொல்லாட்சியையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ἐμφανίζειν என்பதன் வெளிப்பாடு
  choice: வெளிப்படுத்த
  alternative: அறியச் செய்ய
  rationale: இச்சொல் காணத்தக்கதாகச் செய்தல் மற்றும் அறியத்தக்கதாகச் செய்தல் ஆகிய இரண்டையும் உள்ளடக்கக்கூடும். முதன்மை உரை பொதுவான ‘வெளிப்படுத்த’ என்பதைப் பயன்படுத்தி, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் மரியாதைமிக்க நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘-கிறீர்களே—என்ன நடந்தது?’ என்ற அமைப்பு கிரேக்கக் கேள்வியின் வியப்பையும் மாறிய சூழ்நிலையைப் பற்றிய விசாரணையையும் இயல்பாகக் காக்கிறது.
