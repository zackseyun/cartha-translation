  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: ta
  text: தோமா அவரிடம், “ஆண்டவரே, நீங்கள் எங்கே போகிறீர்கள் என்று எங்களுக்குத் தெரியாது. வழியை நாங்கள் எப்படி அறிய முடியும்?[a]” என்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழியை அறிய எங்களால் எப்படி முடியும்?”
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்கத்தில் ‘தெரியும்’ என்பதற்குரிய ஒரே வினைச்சொல் இவ்வசனத்தில் இருமுறை வருகிறது: முதலில் ‘எங்களுக்குத் தெரியாது’ என்பதிலும், பின்னர் ‘வழியை அறிய’ என்பதிலும்.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: தோமா அவரிடம் ... என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலமான λέγει, இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டது. αὐτῷ என்பது மரியாதை ஒருமையான ‘அவரிடம்’ என வழங்கப்பட்டது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதை, சீடத்துவ அங்கீகாரம் ஆகிய இரண்டையும் தக்கவைக்கும் இயல்பான வேற்றுமை அழைப்பு வடிவம்.
- source_word: οὐκ οἴδαμεν
  choice: எங்களுக்குத் தெரியாது
  rationale: இங்கு οἶδα புரிந்துகொள்வதை மட்டும் அல்லாமல் அறிந்திருப்பதைக் குறிக்கிறது. இலக்கைத் தெரியாத நிலையை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: ποῦ ὑπάγεις
  choice: நீங்கள் எங்கே போகிறீர்கள்
  rationale: ὑπάγω யோவானில் ஆழமான பிரிவுச் சார்ந்த எதிரொலியைக் கொண்டிருக்கலாம்; ஆயினும் இங்கு அந்தப் பொருளை விளக்கிச் சேர்க்காமல் இலக்கைப் பற்றிய கேள்வியை நடுநிலையாகத் தருகிறது.
- source_word: πῶς
  choice: அப்படியிருக்க, ... எப்படி
  rationale: πῶς எழுப்பும் தர்க்கரீதியான சிக்கலை தமிழில் தெளிவாக இணைக்க ‘அப்படியிருக்க’ சேர்க்கப்பட்டது; அது புதிய கருத்தைச் சேர்க்காமல் சூழலிலுள்ள தொடர்பை வெளிப்படுத்துகிறது.
- source_word: δυνάμεθα
  choice: முடியும்
  rationale: δύναμαι குறிப்பிடும் இயலுமையை இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: τὴν ὁδὸν
  choice: வழியை
  rationale: ὁδός என்பதன் அடிப்படை மற்றும் உருவகப் பொருட்களைத் தக்கவைத்து, அடுத்த வசனத்துடனான கருப்பொருள் தொடர்பை முன்கூட்டியே விளக்காமல் பாதுகாக்கிறது.
- source_word: εἰδέναι
  choice: அறிந்துகொள்ள
  rationale: οἴδαμεν / εἰδέναι என்ற ஒரே கிரேக்க வேர்ச்சொல்லின் மீள்பயன்பாட்டை ‘தெரியாது / அறிந்துகொள்ள’ என்ற இயல்பான தமிழ் அறிவுசார் சொற்களால் தெரிவிக்கிறது; செயற்கையான சொல்லடுக்கைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோவான் நற்செய்தியின் சூழலில் ὑπάγεις என்பதற்குள்ள இறையியல் நுணுக்கம்
  choice: ‘நீங்கள் எங்கே போகிறீர்கள்’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் எங்கே புறப்பட்டுப் போகிறீர்கள்’
  rationale: இயேசுவின் இலக்கு யோவானில் இறையியல் முக்கியத்துவம் உடையது. ஆனால் தோமாவின் கூற்று அந்த இலக்கை விளக்காமல், அதைப் பற்றிய அறியாமையை வெளிப்படுத்துகிறது; நடுநிலை மொழிபெயர்ப்பு அந்தக் கதை மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையைப் பயன்படுத்திய கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. ‘ஆண்டவரே’ யோவானின் சூழலில் உள்ள மரியாதையையும் சீடத்துவ அங்கீகாரத்தையும் தக்கவைக்கிறது. மூலத்தின் அறிவுசார் சொல்லிசை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
