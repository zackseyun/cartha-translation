source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: ta
  text: இயேசு அவரிடம், “பிலிப்பே, இவ்வளவு காலமாக[a] நான் உங்களோடு இருக்கிறேன்; இருந்தும் நீ இன்னும் என்னை அறிந்துகொள்ளவில்லையா? என்னைக் கண்டவர் தந்தையைக் கண்டிருக்கிறார். ‘தந்தையை எங்களுக்குக் காட்டுங்கள்’ என்று நீ எப்படிச் சொல்கிறாய்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இத்தனை காலமாக.”
    reason: Τοσούτῳ χρόνῳ என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: இவ்வளவு காலமாக
  rationale: காலத்தின் நீட்சியைக் குறிக்கும் இந்த மரபுத்தொடரின் பொருளையும் இயேசுவின் வினாவில் உள்ள வலியுறுத்தலையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: நான் உங்களோடு இருக்கிறேன்
  rationale: நிகழ்கால வினை, கடந்த காலத்திலிருந்து இப்போதுவரை தொடரும் உடனிருப்பைக் குறிக்கிறது. தமிழ் நிகழ்கால வடிவம் அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; பன்மை ‘உங்களோடு’ சீடர் குழுவைக் குறிக்கிறது.
- source_word: οὐκ ἔγνωκάς με
  choice: நீ இன்னும் என்னை அறிந்துகொள்ளவில்லையா?
  rationale: முற்றுவினையின் விளைவுநிலையையும், நீண்ட வாய்ப்பு இருந்தும் பிலிப்பு இயேசுவை உணர்ந்து அறியாதிருப்பதையும் ‘அறிந்துகொள்ளவில்லையா’ வெளிப்படுத்துகிறது. ‘இன்னும்’ சூழலிலுள்ள கண்டிப்பின் வலிமையைத் தருகிறது.
- source_word: Φίλιππε
  choice: பிலிப்பே
  rationale: விளிவேற்றுமையை இயல்பான தமிழ் அழைப்புமுறையுடன் பாதுகாக்கிறது.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: என்னைக் கண்டவர்
  rationale: பெயர்ச்சொல் தன்மையுடைய முற்றுப் பெயரெச்சத்தைச் சுருக்கமாகவும் அனைவருக்கும் பொருந்தும் வகையிலும் தருகிறது.
- source_word: ἑώρακεν τὸν πατέρα
  choice: தந்தையைக் கண்டிருக்கிறார்
  rationale: கிரேக்க முற்றுவினையின் நிறைவுற்ற, தொடரும் விளைவை ‘கண்டிருக்கிறார்’ பாதுகாக்கிறது; கிரேக்கத்தில் உள்ளபடியே ‘தந்தை’ என்று மொழிபெயர்க்கப்படுகிறது, ‘என் தந்தை’ என்று விரிவுபடுத்தப்படவில்லை.
- source_word: πῶς σὺ λέγεις
  choice: அப்படியிருக்க, … என்று நீ எப்படிச் சொல்கிறாய்?
  rationale: πῶς என்பதன் வியப்பும் கண்டிப்பும் கலந்த வினாவை இயல்பான தமிழில் தருகிறது. ‘அப்படியிருக்க’ முந்தைய கூற்றுடனான தர்க்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: தந்தையை எங்களுக்குக் காட்டும்
  rationale: நேரடியான கட்டளையின் வலிமையைப் பாதுகாத்து, முந்தைய வசனத்தில் பிலிப்பு கூறிய வேண்டுகோளை இயல்பான தமிழ் மேற்கோளாக மீளுரைக்கிறது.
theological_decisions:
- issue: இயேசுவைக் காண்பதற்கும் தந்தையைக் காண்பதற்கும் உள்ள உறவு
  choice: “என்னைக் கண்டவர் தந்தையைக் கண்டிருக்கிறார்” என்ற வலுவான நேரடிக் கூற்றாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: “தந்தை எப்படிப்பட்டவர் என்பதை அறிந்திருக்கிறார்” என்று பிரதிநிதித்துவப் பொருளை மட்டும் தருதல், அல்லது பிற்கால இறையியல் சொற்களைச் சேர்த்து விரிவுபடுத்துதல்.
  rationale: மூலவாக்கின் வலுவான கிறிஸ்துவியல் கூற்றைத் தளர்த்தாமலும், அதே நேரத்தில் கிரேக்கத்தில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் அதன் இறையியல் இறுக்கத்தையும் உண்மையான பொருள் பரப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. பிலிப்பை நோக்கிய ஒருமை ‘நீ’ என்பதும், சீடர் குழுவைக் குறிக்கும் பன்மை ‘உங்களோடு/எங்களுக்குக்’ என்பதும் மூலத்தின் எண் வேறுபாட்டைப் பாதுகாக்கின்றன.
