review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the duration expression, the plural ‘with you’ followed by singular address to Philip, the perfect force of knowing/seeing, and the unexpanded statement that seeing Jesus is seeing the Father. ‘அப்படியிருக்க’ makes the rhetorical inference more explicit than the Greek’s πῶς alone and is not needed.
  naturalness: The overall Tamil is clear and dignified. In modern standard Tamil, ‘காட்டுங்கள்’ is more natural than ‘காட்டும்’ as a respectful direct request addressed to Jesus. Removing ‘அப்படியிருக்க’ also makes the final question more direct and idiomatic.
  terminology: ‘தந்தை’ appropriately retains the Greek’s ‘the Father’ without adding ‘my.’ ‘பிலிப்பே,’ ‘என்னைக் கண்டவர்,’ and ‘கண்டிருக்கிறார்’ are suitable and preserve the verse’s register and theological force.
  issues:
  - severity: low
    issue: ‘அப்படியிருக்க’ is an added connective.
    rationale: The Greek has a rhetorical ‘How do/can you say?’ but no explicit inferential connective. Tamil can convey the rhetorical force directly without adding one.
  - severity: low
    issue: ‘காட்டும்’ is less natural for modern standard Tamil in this direct respectful request.
    rationale: ‘காட்டுங்கள்’ is the more current and broadly natural respectful imperative, while retaining the force of the Greek singular imperative in Tamil’s honorific address.
  revised_text: இயேசு அவரிடம், “பிலிப்பே, இவ்வளவு காலமாக[a] நான் உங்களோடு இருக்கிறேன்; இருந்தும் நீ இன்னும் என்னை அறிந்துகொள்ளவில்லையா? என்னைக் கண்டவர் தந்தையைக் கண்டிருக்கிறார். ‘தந்தையை எங்களுக்குக் காட்டுங்கள்’ என்று நீ எப்படிச் சொல்கிறாய்?” என்றார்.
