  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: ta
  text: நான் உங்களோடு தங்கியிருக்கும்போது இவற்றை உங்களிடம் பேசியிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களோடு இருக்கும்போது.” கிரேக்கத்தில் ‘நிலைத்திரு/தங்கியிரு’ என்று பொருள்படும் μένω என்ற வினைச்சொல்லின் பெயரெச்ச வடிவம் உள்ளது; இச்சொல் யோவான் நூலில் மீண்டும் மீண்டும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: முந்தைய போதனைகளைக் குறிக்கும் நடுநிலைப் பன்மைச் சுட்டுப்பெயரைப் பன்மையாகவே இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λελάληκα
  choice: பேசியிருக்கிறேன்
  rationale: λαλέω என்பதன் நிறைவுநிலை வினை வடிவத்தையும், பேசப்பட்ட வார்த்தைகளின் தொடரும் பொருத்தத்தையும் தமிழில் காக்கிறது.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: சீடர்களாகிய பலரிடம் பேசப்படுவதைக் காட்டும் இயல்பான பன்மை வடிவம்.
- source_word: παρ’ ὑμῖν
  choice: உங்களோடு
  rationale: παρά + வேற்றுமை உருபு தரும் அருகிருத்தல் அல்லது உடனிருத்தல் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: μένων
  choice: தங்கியிருக்கும்போதே
  rationale: μένω என்பதன் நிகழ்காலப் பெயரெச்சப் பொருளான தொடர்ந்து உடனிருத்தலைக் காட்டுகிறது; ‘-போதே’ அந்த நிலையில் இருக்கும்போது இயேசு இவற்றைப் பேசியதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: யோவான் நூலில் மீண்டும் வரும் μένω என்ற சொல்லின் கருத்துத் தொடர்ச்சியைப் பாதுகாத்தல்
  choice: உங்களோடு தங்கியிருக்கும்போதே
  alternative: உங்களோடு இருக்கும்போது
  rationale: ‘தங்கியிருக்க’ என்பது μένω-வின் நீடித்திருத்தல் நுணுக்கத்தை ஓரளவு காக்கிறது; அதேவேளையில் குறிப்பிட்ட ஓர் இறையியல் விளக்கத்தை வசனத்தில் திணிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘பேசியிருக்கிறேன்’ கிரேக்க நிறைவுநிலையைப் பாதுகாக்கிறது; ‘தங்கியிருக்கும்போதே’ என்பது μένω என்ற முக்கிய யோவானியச் சொல்லின் நீடித்திருத்தல் நுணுக்கத்தை வாசிக்கக்கூடிய தமிழில் தருகிறது.
