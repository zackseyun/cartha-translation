source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: ta
  text: என் தந்தையின் வீட்டில் பல வசிப்பிடங்கள் உள்ளன.[a] அப்படி இல்லையென்றால், உங்களுக்காக ஓர் இடத்தை ஆயத்தப்படுத்த நான் போகிறேன் என்று உங்களிடம் சொல்லியிருப்பேனா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பல அறைகள்.’ கிரேக்கச் சொல் தங்கும் அல்லது வசிக்கும் இடங்களைக் குறிக்கலாம். ‘வசிப்பிடங்கள்’ என்பது பரந்த பொருளைத் தக்கவைக்கிறது; இவ்வதிகாரத்தில் வரும் தங்கியிருத்தல் என்ற கருத்துடனான தொடர்பையும் பாதுகாக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அப்படி இல்லையென்றால், உங்களிடம் சொல்லியிருப்பேன்; ஏனெனில் உங்களுக்காக ஓர் இடத்தை ஆயத்தப்படுத்த நான் போகிறேன்.’ கிரேக்கத் தொடரைச் சொல்லாட்சிக் கேள்வியாக அல்லாமல் ஒரு கூற்றாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: வீட்டில்
  rationale: இங்கு οἰκία என்பதன் இயல்பான பொருள் ‘வீடு’. இது வசிப்பிடத்தின் தெளிவான உருவகத்தைத் தக்கவைக்கிறது; ‘குடும்பம்’ எனப் பொருளை விரிவுபடுத்துவதில்லை.
- source_word: πατρός μου
  choice: என் தந்தையின்
  rationale: இயேசு கடவுளைக் குறித்துப் பேசும் சூழலில், இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μοναὶ πολλαί
  choice: தங்குமிடங்கள் பல
  rationale: μονή என்பது தங்கும் அல்லது வசிக்கும் இடத்தைக் குறிக்கிறது. ‘அறைகள்’ என்பது கிரேக்கத்தில் இல்லாத கட்டடப் பிரிவைத் தேவையின்றி குறிப்பாக்கலாம்; ‘தங்குமிடங்கள்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: εἰ δὲ μή
  choice: அப்படி இல்லையென்றால்
  rationale: முன் கூறிய நிலை உண்மையல்ல என்ற நிபந்தனையை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἶπον ἂν ὑμῖν
  choice: உங்களிடம் சொல்லியிருப்பேனா?
  rationale: ἄν உடன் வரும் இறந்தகால வினை வடிவத்தின் எதிர்நிலைச் சாத்தியத்தையும், தேர்ந்தெடுக்கப்பட்ட வினாவாக்க வாசிப்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: சொல்லப்பட்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் உருபாக எடுத்துக்கொள்ளப்பட்டுள்ளது; எனினும் ‘ஏனெனில்’ என்ற காரணவிளக்க வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πορεύομαι
  choice: நான் போகிறேன்
  rationale: நிகழ்கால வடிவத்தின் உடனடி, முன்னோக்கிய இயக்கத்தை எளிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἑτοιμάσαι
  choice: ஆயத்தப்படுத்த
  rationale: இறுதியெச்சத்தின் நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது; dignified biblical Tamil usage while remaining understandable.
- source_word: τόπον
  choice: ஓர் இடத்தை
  rationale: τόπος என்பதன் பரந்த பொருளைத் தக்கவைத்து, அதை ‘அறை’ எனக் குறுக்குவதைக் தவிர்க்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்காக
  rationale: பன்மை இரண்டாம் நபருக்கான பயனுறு வேற்றுமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: μονή என்பதையும் மறுமைக்குரிய வசிப்பிட உருவகத்தையும் மொழிபெயர்த்தல்
  choice: தங்குமிடங்கள் பல
  alternative: அறைகள் பல; மாளிகைகள் பல
  rationale: ‘மாளிகைகள்’ என்பது இன்றைய தமிழில் மூலச்சொல்லைவிட மிகைப்படுத்தப்பட்ட ஆடம்பரப் பொருளைத் தரும்; ‘அறைகள்’ என்பது கட்டடத்தின் உட்பிரிவுகளைத் தேவையின்றி குறிப்பாக்கும். ‘தங்குமிடங்கள்’ மூலத்தின் பரந்த வசிப்பு/தங்குதல் பொருளைப் பாதுகாக்கிறது.
- issue: εἰ δὲ μή ... εἶπον ἂν ὑμῖν ὅτι என்ற தொடரின் நிறுத்தக்குறியும் வாக்கிய வலிமையும்
  choice: சொல்லியிருப்பேனா? என்ற சொல்லாட்சிக் கேள்வி
  alternative: ‘அப்படி இல்லையென்றால், உங்களிடம் சொல்லியிருப்பேன்; ஏனெனில் உங்களுக்காக ஓர் இடத்தை ஆயத்தப்படுத்த நான் போகிறேன்’ என்ற கூற்று
  rationale: மூலக் கிரேக்கத்தின் சொற்தொடரும் பண்டைய பிரதிகளில் அசல் நிறுத்தக்குறிகள் இல்லாததும் இரு வாசிப்புகளுக்கும் இடமளிக்கின்றன. சொல்லாட்சிக் கேள்வி சூழலோட்டத்துக்கு ஏற்றதாக இருப்பதால் முதன்மை உரையில் கொள்ளப்பட்டது; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டுள்ளது. ‘ஆயத்தப்படுத்த’ என்ற சொல் கண்ணியமான வழக்கைத் தக்கவைக்கிறது; மற்ற வாக்கிய அமைப்பு இயல்பான தற்போதைய தமிழில் உள்ளது. ‘நீங்கள்’ என்பதன் பன்மை ‘உங்களுக்காக/உங்களிடம்’ மூலம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
