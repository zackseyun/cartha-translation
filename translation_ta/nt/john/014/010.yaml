id: JHN.14.10
reference: John 14:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: ta
  text: நான் தந்தையிலும், தந்தை என்னிலும் இருக்கிறார் என்பதை நீ நம்பவில்லையா? நான் உங்களுக்குச் சொல்லும் வார்த்தைகளை நானாகப் பேசுவதில்லை[a]. மாறாக, என்னில் நிலைத்திருக்கும்[b] தந்தையே தமது செயல்களைச் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னிடமிருந்து பேசுவதில்லை.’ இச்சொற்றொடர் ‘என் சொந்த முனைப்பிலோ அதிகாரத்திலோ பேசுவதில்லை’ என்ற நுட்பத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னில் தங்கியிருக்கும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: நம்பவில்லையா
  rationale: யோவான் நற்செய்தியில் திரும்பத் திரும்ப வரும் πιστεύω என்பதன் ‘நம்பு’ என்ற பொருளையும், கிரேக்கத்தில் உள்ள ஒருமை முன்னிலையையும் காக்கிறது.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: தந்தையிலும் ... என்னிலும்
  rationale: பரஸ்பர உள்ளிருப்பைக் குறிக்கும் ἐν என்ற சொல்லை விளக்கவுரையாக ‘ஒன்றாயிருக்கிறோம்’ என்று மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ῥήματα
  choice: வார்த்தைகள்
  rationale: இங்கு இயேசு கூறும் மொழியுரைகளை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: λέγω ... λαλῶ
  choice: சொல்லும் ... பேசுவதில்லை
  rationale: கிரேக்கத்தில் உள்ள இரண்டு வேறுபட்ட பேச்சு வினைகளின் நுட்பமான வேறுபாட்டைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: நானாக
  rationale: தன்னிடமிருந்து, தன் முனைப்பில் அல்லது தன் அதிகாரத்தின் பேரில் பேசுதல் ஆகிய சாத்தியமான நுட்பங்களை ஒரு குறிப்பிட்ட விளக்கத்திற்குள் சுருக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: μένων
  choice: நிலைத்திருக்கும்
  rationale: μένω என்பதன் தொடர்ச்சியையும் யோவானின் முக்கியமான ‘நிலைத்திருத்தல்’ சொற்பயன்பாட்டையும் காக்கிறது.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: தமது செயல்களைச் செய்கிறார்
  rationale: செயலின் உரிமையாளராகத் தந்தையைச் சுட்டும் αὐτοῦ என்பதை வெளிப்படுத்தி, ποιεῖ என்பதையும் இயல்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: தந்தையும் மகனும் பரஸ்பரம் உள்ளிருத்தல்
  choice: ‘நான் தந்தையிலும், தந்தை என்னிலும்’ என்ற உறவுசார் மொழியை அப்படியே வைத்தல்
  alternative: ‘நானும் தந்தையும் ஒன்றாயிருக்கிறோம்’ அல்லது ‘தந்தையுடன் ஒன்றிப்பில் இருக்கிறேன்’
  rationale: இவ்வசனத்தின் தனித்துவமான சொற்றொடரை வேறு யோவானிய உரைகளோடு கலந்து விடாமலும், பிற்கால இறையியல் சொற்களைப் புகுத்தாமலும் அதன் கிறிஸ்துவியல் அழுத்தத்தையும் மர்மத்தையும் காக்கிறது.
- issue: இயேசுவின் பேச்சிலும் செயல்களிலும் தந்தையின் செயற்பாடு
  choice: ‘நானாகப் பேசுவதில்லை’ என்றும் ‘தந்தையே தமது செயல்களைச் செய்கிறார்’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘என் சொந்த அதிகாரத்தின்படி பேசுவதில்லை’ அல்லது ‘தந்தை என் மூலமாகச் செயல்படுகிறார்’
  rationale: தந்தை–மகன் வேறுபாட்டையும் அவர்களுடைய பிரிக்க முடியாத பணி ஒற்றுமையையும் காக்கிறது; மகனின் சொற்களை வெறும் மனித முகவரின் பேச்சாக விளக்குவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. πατήρ என்பதற்கு இன்றைய இயல்பான ‘தந்தை’ பயன்படுத்தப்பட்டுள்ளது. ஒருமை πιστεύεις என்பதற்கு ‘நீ’ என்றும், பன்மை ὑμῖν என்பதற்கு ‘உங்களுக்கு’ என்றும் எண்ணிக்கை வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
