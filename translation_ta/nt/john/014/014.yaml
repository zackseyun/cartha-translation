  source_fidelity: மூல கிரேக்கத்தின் ἐάν τι αἰτήσητέ με ἐν τῷ ὀνόματί μου, ἐγὼ ποιήσω என்ற அமைப்பின் பொருளை உரை துல்லியமாகக் காக்கிறது. με என்பதன் நேரடி வேண்டுதல்-பெறுநர் பொருளை நவீனத் தமிழில் இயல்பாக ‘என்னிடம்’ எனத் தருகிறது; ‘எதைக் கேட்டாலும்’ திறந்த நிபந்தனையையும், ‘நான் அதைச் செய்வேன்’ எதிர்கால வாக்குறுதியையும் சரியாக வெளிப்படுத்துகின்றன.
