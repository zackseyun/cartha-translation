  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: ta
  text: நீங்கள் என் பெயரில் என்னிடம் எதைக் கேட்டாலும்[a], நான் அதைச் செய்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘என்னிடம்’ என்பது இல்லை; அவற்றில், ‘நீங்கள் என் பெயரில் எதைக் கேட்டாலும், நான் அதைச் செய்வேன்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: -ஆல் / கேட்டாலும்
  rationale: நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் ‘எதைக் கேட்டாலும்’ என்ற அமைப்பு நிபந்தனையையும் திறந்த வரம்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τι
  choice: எதை
  rationale: குறிப்பிடப்படாத எந்த வேண்டுகோளையும் குறிக்கும். αἰτήσητέ உடன் சேர்ந்து ‘எதைக் கேட்டாலும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: αἰτήσητέ
  choice: கேட்டாலும்
  rationale: ἐάν ஆளும் இறந்தகால நிறைவுவினை வாய்ப்பாட்டு வடிவம்; தமிழில் நிபந்தனைப் பொருளை இயல்பாகத் தர ‘கேட்டாலும்’ பயன்படுத்தப்பட்டுள்ளது. இது வேண்டுதல் அல்லது கோருதல் என்ற பொருளை மிகையாக விளக்காமல் காக்கிறது.
- source_word: με
  choice: என்னிடம்
  rationale: SBLGNT உரையில் உள்ள நேரடிப் பொருள் சுட்டுப்பெயரைத் தெளிவாக மொழிபெயர்க்கிறது. தமிழில் ஒருவரிடம் வேண்டுதல் செய்வதற்கு ‘என்னிடம் கேட்பது’ இயல்பான வழக்கு.
- source_word: ἐν τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயர், அதிகாரம், நபர் ஆகியவற்றுடன் தொடர்புடைய யோவானியச் சொற்றொடரை விளக்கவுரை சேர்க்காமல் துல்லியமாகக் காக்கிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் எழுவாயைத் தமிழிலும் வைத்துள்ளது; தேவையற்ற ‘நானே’ என்ற கூடுதல் வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: ποιήσω
  choice: அதைச் செய்வேன்
  rationale: எதிர்கால வினையைத் தெளிவாகத் தருகிறது. முன் குறிப்பிடப்பட்ட வேண்டுகோளைச் சுட்ட ‘அதை’ சேர்ப்பது தமிழில் இயல்பானது.
theological_decisions:
- issue: யோவான் 14:14-இல் με (‘என்னை/என்னிடம்’) இருப்பதும், வேண்டுதல் நேரடியாக இயேசுவிடம் செய்யப்படுவதாக அது காட்டுவதும்
  choice: முதன்மை உரையில் ‘என்னிடம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நீங்கள் என் பெயரில் எதைக் கேட்டாலும், நான் அதைச் செய்வேன்.’
  rationale: கொடுக்கப்பட்ட SBLGNT மூல உரையில் με உள்ளது. ஆகவே அதை ஒத்திசைவுக்காக நீக்காமல் முதன்மை உரையில் வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது. வேண்டுதல் நேரடியாக யாரிடம் செய்யப்படுகிறது என்பதில் இந்த வாசகம் தாக்கம் ஏற்படுத்துவதால், με இல்லாத படிவம் பாடவேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; உரைக்கு அப்பாற்பட்ட கோட்பாட்டு முடிவு திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘என் பெயரில்’ என்ற செறிவான மூலச் சொற்றொடரின் திட்டமிட்ட பொருள் விரிவாக்கப்படவில்லை; με உள்ள வாசகமும் அதில்லாத பாடவேறுபாடும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
