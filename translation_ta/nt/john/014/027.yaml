source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: ta
  text: அமைதியை உங்களிடம் விட்டுச் செல்கிறேன்; என் அமைதியை உங்களுக்குக் கொடுக்கிறேன். உலகம் கொடுப்பதுபோல் நான் உங்களுக்குக் கொடுப்பதில்லை. உங்கள் உள்ளம் கலங்கவோ அஞ்சவோ வேண்டாம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அச்சப்படவோ வேண்டாம்’ அல்லது ‘மனந்தளரவோ வேண்டாம்.’ கிரேக்க வினை பயப்படுதல் அல்லது துணிவிழத்தல் என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: அமைதி
  rationale: மோதல் இல்லாமையைத் தாண்டிய முழுமையான நலத்தையும் இச்சொல் சுட்டக்கூடும்; எனினும் அதன் பரந்த பொருளைச் சுருக்காமல் காக்கும் இயல்பான தமிழ் இணைச்சொல் ‘அமைதி’.
- source_word: ἀφίημι
  choice: விட்டுச் செல்கிறேன்
  rationale: இயேசு பிரியவிருக்கும் சூழலில், ‘விட்டுவைக்கிறேன்’ என்பதைக் காட்டிலும் ‘விட்டுச் செல்கிறேன்’ என்பது இயல்பாகவும், அளவுக்கு மீறிய உயில் சார்ந்த விளக்கத்தைச் சேர்க்காமலும் மூலத்தின் கருத்தைத் தெரிவிக்கிறது.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: என் அமைதியை
  rationale: இயேசுவுக்குரிய அமைதி உலகம் தருவதிலிருந்து வேறுபட்டது என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: δίδωμι
  choice: கொடுக்கிறேன்
  rationale: மூலத்தில் திரும்பத் திரும்ப வரும் நிகழ்கால வினையையும், இயேசுவின் கொடுத்தலுக்கும் உலகத்தின் கொடுத்தலுக்கும் இடையிலான எதிர்மறை ஒப்பீட்டையும் காக்கிறது.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: உலகம் கொடுப்பதுபோல் நான் உங்களுக்குக் கொடுப்பதில்லை
  rationale: கிரேக்கத்தின் ஒப்பீட்டையும் வலியுறுத்தப்பட்ட ‘நான்’ என்ற எதிர்நிலையையும் இயல்பான தமிழ் சொல் வரிசையில் வெளிப்படுத்துகிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: யோவான் நூலில் இச்சொல்லுக்கு இருக்கும் பரந்த இறையியல் ஒலிப்புகளை ஒரு குறிப்பிட்ட விளக்கமாகச் சுருக்காமல் காக்கிறது.
- source_word: μὴ ταρασσέσθω
  choice: கலங்க வேண்டாம்
  rationale: தொந்தரவுறுதல், மனக்குழப்பமடைதல் ஆகிய உணர்வுகளை இயல்பாக வெளிப்படுத்துவதோடு யோவான் 14:1-இன் சொல்லாட்சியுடனும் ஒத்திசையக்கூடியது.
- source_word: ὑμῶν ἡ καρδία
  choice: உங்கள் உள்ளம்
  rationale: பன்மை உடைமைப்பெயருடன் வரும் மூலத்தின் ஒருமை ‘இதயம்’ என்பதை கூட்டொருமையாகக் காக்கிறது; தமிழில் மனம், சிந்தனை, உள்ளுணர்வு ஆகியவற்றை உள்ளடக்கும் ‘உள்ளம்’ இச்சூழலில் இயல்பானது.
- source_word: μηδὲ δειλιάτω
  choice: அஞ்சவும் வேண்டாம்
  rationale: பயப்படுதல் அல்லது துணிவிழத்தல் என்ற வினையின் மையப் பொருளை எளிய, தற்போதைய தமிழில் தருகிறது; ‘கோழைத்தனப்படுதல்’ என்ற தேவையற்ற கடுமையான அறநெறிச் சாயலைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசு கொடுக்கும் அமைதியின் இயல்பு
  choice: ‘அமைதி’ என்றும் ‘என் அமைதி’ என்றும் மட்டும் மொழிபெயர்த்து அதன் பொருளை விரிவாக்காமல் வைத்தல்
  alternative: அக அமைதி, இறைவனோடு ஒப்புரவு, அல்லது இறுதிக்கால முழுநலம் என்று வெளிப்படையாக விளக்குதல்
  rationale: இந்த வசனம் அமைதியின் இயல்பை ஒரே பொருளுக்குள் வரையறுக்கவில்லை. பொதுவான சொல்லை வைத்திருப்பது அதன் உட்புற, உறவுசார், இறுதிக்கால இறையியல் பரப்பைத் திறந்த நிலையில் காக்கிறது.
- issue: ஒருமை ‘உள்ளம்’ மற்றும் பன்மை சீடர்கள்
  choice: ‘உங்கள் உள்ளம்’ என்ற கூட்டொருமையைப் பயன்படுத்துதல்
  alternative: ‘உங்கள் உள்ளங்கள்’ என்று தனிநபர் பன்மையாக மாற்றுதல்
  rationale: மூலத்தில் பன்மை உடைமையுடன் ஒருமை பெயர்ச்சொல் உள்ளது. அதனால் சீடர்களை ஒருங்கிணைந்த குழுவாகக் குறிக்கும் சாத்தியத்தைத் தீர்க்காமல் ‘உங்கள் உள்ளம்’ என வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதேவேளையில் கண்ணியமான நடை. ‘சமாதானம்’ என்பதற்குப் பதிலாக அன்றாட வாசகருக்கு உடனடியாகப் புரியும் ‘அமைதி’ பயன்படுத்தப்பட்டது. மூலத்தின் மூன்று குறுங்கூற்றுகளும், இயேசுவின் கொடுத்தலுக்கும் உலகத்தின் கொடுத்தலுக்கும் இடையிலான மாறுபாடும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
