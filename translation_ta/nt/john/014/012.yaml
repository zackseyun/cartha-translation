  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும், இயேசுவின் வாக்கின் மாண்பும் வலியுறுத்தலும் குன்றாதவாறும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையை ‘நம்புகிறவர் ... தாமும் செய்வார்’ என இயல்பாகக் காத்துள்ளது.
