source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: ta
  text: '“உறுதியாக, உறுதியாக நான் உங்களுக்குச் சொல்கிறேன்: என்னை நம்புகிறவர் நான் செய்கிற செயல்களைத் தாமும் செய்வார்; இவற்றைவிடப் பெரிய செயல்களையும் செய்வார்[a]. ஏனெனில், நான் தந்தையிடம் செல்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவற்றைவிடப் பெரியவற்றையும் செய்வார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “செயல்கள்” என்ற சொல் முந்தைய கூறிலிருந்து இங்கே பொருளில் நிரப்பப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: உறுதியாக, உறுதியாக
  rationale: இரட்டிக்கப்பட்ட வலியுறுத்தலையும் இயேசுவின் கூற்றின் solemn force-ஐயும் இயல்பான நவீன தமிழில் காக்கிறது; ‘ஆமென்’ என மொழிபெயர்க்காமல் விடுவதைவிடப் பொருள் வெளிப்படையாக உள்ளது.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: என்னை நம்புகிறவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புச் சொல்லை பொதுவாக எந்த விசுவாசியையும் குறிக்கும் ஒருமையாக இயல்பாக வழங்குகிறது; யோவானின் பயன்பாட்டில் πιστεύω εἰς என்பதற்கு ‘நம்பு’ பொருத்தமானது.
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: நான் செய்கிற செயல்கள்
  rationale: ἔργα என்ற யோவானிய சொல்வழக்கை ‘செயல்கள்’ எனக் காத்து, ποιῶ உடனான வினைத் தொடர்பையும் தெளிவாக்குகிறது.
- source_word: κἀκεῖνος ποιήσει
  choice: தாமும் செய்வார்
  rationale: κἀκεῖνος-இன் ‘அவரும்/அந்த நபரும்’ என்ற வலியுறுத்தலை மரியாதை ஒருமையான ‘தாமும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: இவற்றைவிடப் பெரிய செயல்களையும் செய்வார்
  rationale: முந்தைய உட்பிரிவிலுள்ள ἔργα என்பதை இயல்பான தமிழுக்காக வெளிப்படையாக நிரப்புகிறது; ‘பெரிய’ என்பதன் சரியான விதம் என்ன என்பதை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இயேசு தந்தையிடம் செல்வது முந்தைய வாக்குறுதிக்கான காரணமாகக் கொடுக்கப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: நான் தந்தையிடம் செல்கிறேன்
  rationale: சூழலில் நெருங்கிய எதிர்காலத்தைக் குறிக்கும் நிகழ்காலத்தை இயல்பாகக் காக்கிறது; கிரேக்கத்தில் உள்ள ‘தந்தை’ என்பதையே வழங்குகிறது, ‘என் தந்தை’ என்று சேர்க்கவில்லை.
theological_decisions:
- issue: ‘இவற்றைவிடப் பெரிய செயல்கள்’ என்பதன் பொருள்
  choice: விசுவாசி இயேசுவின் செயல்களைவிட ஏதோ ஓர் அர்த்தத்தில் பெரிய செயல்களைச் செய்வார் என்ற விரிவான கூற்றை அப்படியே வைத்திருக்கிறது; அது இயேசு தந்தையிடம் செல்வதோடு தொடர்புபடுத்தப்படுகிறது.
  alternative: பணியின் பரவலில் பெரியவை; மீட்பு வரலாற்று முக்கியத்துவத்தில் பெரியவை; அல்லது ஆவியால் வல்லமையூட்டப்பட்ட திருச்சபைப் பணியால் நிகழும் பெரிய செயல்கள்.
  rationale: ‘பெரிய’ என்பதன் துல்லியமான பரிமாணத்தை இவ்வசனம் குறிப்பிடவில்லை. ஆகவே மொழிபெயர்ப்பு எந்த ஒரு இறையியல் விளக்கத்தையும் உரைக்குள் சேர்க்காமல் அதன் பதற்றத்தையும் விரிவையும் காக்கிறது.
