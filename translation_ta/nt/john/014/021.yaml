source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: ta
  text: என் கட்டளைகளை உடையவனும் அவற்றைக் கடைப்பிடிக்கிறவனுமே என்னை அன்புகூருகிறவன்.[a] என்னை அன்புகூருகிறவனை என் தந்தை அன்புகூருவார்; நானும் அவனை அன்புகூருவேன்; என்னை அவனுக்கு வெளிப்படுத்துவேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ஒருமை ஆண்பால் வடிவம் பயன்படுத்தப்பட்டிருந்தாலும், இயேசுவின் கட்டளைகளை உடையிருந்து கடைப்பிடிக்கும் எவரையும் இது பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னை அவனுக்குக் காட்டுவேன்.’ கிரேக்க வினை தன்னை அறியச்செய்வதையோ காணும்படி செய்வதையோ குறிக்கலாம்; இங்கு தனிப்பட்ட சுயவெளிப்பாடு முதன்மையாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων τὰς ἐντολάς μου
  choice: என் கட்டளைகளைப் பெற்றிருந்து
  rationale: கட்டளைகளைத் தன்னிடம் கொண்டிருப்பதைக் குறிக்கும் ἔχων என்பதையும், தமிழில் இயல்பான தொடரையும் இணைக்கிறது; வெறுமனே அவற்றை அறிந்திருப்பதாகப் பொருளைக் குறுக்கவில்லை.
- source_word: τηρῶν αὐτὰς
  choice: அவற்றைக் கடைப்பிடிக்கிறவன்
  rationale: யோவானின் பயன்பாட்டில் உள்ள தொடர்ந்து காத்து நடக்கும் பொருளை ‘கடைப்பிடி’ இயல்பாக வெளிப்படுத்துகிறது; வெறும் ஒருமுறை கீழ்ப்படிதலாகக் குறுக்கவில்லை.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: அவனே என்னிடம் அன்புகூருகிறவன்
  rationale: ἐκεῖνος தரும் வலியுறுத்தப்பட்ட அடையாளப்படுத்தலை ‘அவனே’ காக்கிறது.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: அன்புகூருகிற / அன்புகூருவார் / அன்புகூர்ந்து
  rationale: ἀγαπάω வினையின் திட்டமிட்ட மறுபயன்பாட்டை ஒரே தமிழ் சொற்குடும்பத்தால் காக்கிறது. இரண்டாவது இடத்தில் இயல்பான தமிழுக்காக கிரேக்கச் செயப்பாட்டு அமைப்பு செயப்பாட்டு எழுவாய் அமைப்பாக மாற்றப்பட்டுள்ளது.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: என் தந்தை
  rationale: மூலத்தின் ‘என் தந்தை’ என்ற உறவுமொழியை அப்படியே காக்கிறது; தமிழில் இயல்பில்லாத ‘என் தந்தையால் அன்புகூரப்படுவான்’ என்பதற்குப் பதிலாக இயல்பான செய்பாட்டு வாக்கியம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καὶ ἐγώ என்பதன் சேர்க்கை மற்றும் வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: என்னை அவனுக்கு வெளிப்படுத்துவேன்
  rationale: இயேசு தம்மையே தனிப்பட்ட முறையில் அறியச்செய்வதை வெளிப்படுத்துகிறது; வெறும் கண்கூடான தோற்றமாகப் பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: அன்புக்கும் கட்டளைகளைக் கடைப்பிடிப்பதற்கும் உள்ள உறவு
  choice: கட்டளைகளைப் பெற்றிருந்து கடைப்பிடிப்பவனே இயேசுவிடம் அன்புகூருகிறவன் என்று அடையாளப்படுத்தப்பட்டது.
  alternative: கீழ்ப்படிதல் அன்பை நிரூபிக்கிறது அல்லது இறை அன்பைச் சம்பாதிக்கிறது என்று விளக்குவது.
  rationale: கிரேக்கம் அடையாள உறவை வலியுறுத்துகிறது; காரணம், தகுதி அல்லது சம்பாதித்த பலன் என்ற கூடுதல் கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: தந்தையின் அன்பு குறித்த செயப்பாட்டு வாக்கியம்
  choice: ‘என் தந்தை அன்புகூருவார்’ என்ற இயல்பான தமிழ் செய்பாட்டு அமைப்பு.
  alternative: ‘என் தந்தையால் அன்புகூரப்படுவான்’ என்ற வடிவ ரீதியான செயப்பாட்டு அமைப்பு.
  rationale: ἀγαπηθήσεται என்ற எதிர்காலச் செயப்பாட்டின் பொருள் முழுமையாகக் காக்கப்படுகிறது; அதே நேரத்தில் தமிழில் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்படுகிறது.
- issue: இயேசுவின் சுயவெளிப்பாட்டின் இயல்பு
  choice: ‘என்னை அவனுக்கு வெளிப்படுத்துவேன்’.
  alternative: ‘என்னை அவனுக்குக் காட்டுவேன்’.
  rationale: ἐμφανίζω காணக்கூடிய தோற்றத்தையும் தன்னை அறியச்செய்யும் வெளிப்பாட்டையும் குறிக்கக்கூடும். இச்சூழலில் தனிப்பட்ட சுயவெளிப்பாட்டை முன்னிறுத்தினாலும், குறிப்பிட்ட காட்சி நிகழ்வாக மட்டும் பொருளைக் குறுக்காத சொல் தேர்ந்தெடுக்கப்பட்டது.
- issue: பிரதிநிதித்துவ ஒருமை ஆண்பால்
  choice: முதன்மை உரையில் ‘அவன்’ சார்ந்த ஒருமை வடிவங்கள் வைக்கப்பட்டு, அதன் பொதுவான பிரதிநிதித்துவப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
  alternative: பன்மை அல்லது முற்றிலும் பாலினமற்ற வடிவத்துக்கு மாற்றுவது.
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமை இலக்கண வடிவத்தை காக்கிறது; அது ஆண்களை மட்டும் குறிக்கவில்லை என்பதையும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அன்புகூர்’, ‘கடைப்பிடி’, ‘வெளிப்படுத்து’ ஆகியவை யோவான் உரையின் கருத்துச் செறிவையும் சொல் மறுபயன்பாட்டையும் காக்கின்றன; அளவுக்கு மீறிய சமயத் தொழில்நுட்ப மொழி தவிர்க்கப்பட்டுள்ளது.
