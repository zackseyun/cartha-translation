  source_fidelity: மூல கிரேக்கத்தின் காலக் குறிப்பு (ἔτι μικρόν), உலகத்துக்கும் சீடர்களுக்கும் இடையிலான எதிர்மறை வேறுபாடு (δέ), ‘இனி இல்லை’ (οὐκέτι), மற்றும் ‘வாழ்கிறேன்/வாழ்வீர்கள்’ என்ற நிகழ்கால–எதிர்கால அமைப்பு ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அதன்பின்’ என்பது உடன்வரும் கால மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் பொருளைத் தேவையற்ற வகையில் விரிவுபடுத்தவில்லை.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘உலகம் என்னை இனி காணாது; ஆனால் நீங்கள் என்னைக் காண்பீர்கள்’ என்ற இணைநிலை இயல்பாக உள்ளது. ‘நான் வாழ்கிறேன் என்பதால், நீங்களும் வாழ்வீர்கள்’ என்பதும் காரணத் தொடர்பைச் சீராகத் தருகிறது.
  terminology: ‘உலகம்’, ‘காண்’, ‘வாழ்’ ஆகிய சொற்கள் யோவானின் சொற்தொடர் மற்றும் திட்டமிட்ட மீளுரையைப் பாதுகாக்கின்றன. ‘காண்’ என்பதை உடல்சார் அல்லது ஆவிக்குரிய ஒரு பொருளாகக் குறுக்காமல் வைத்திருப்பதும், ‘வாழ்வீர்கள்’ என்பதை உயிர்த்தெழுதல் அல்லது ஆவிக்குரிய வாழ்வு எனத் தீர்மானிக்காமல் வைத்திருப்பதும் பொருத்தமானது. அடிக்குறிப்புகள் ஆங்கில POB ஆய்வுத் தடத்தோடு ஒத்துள்ளன; [a] இரு ‘காண்’ நிகழ்வுகளுக்கும் பொருந்துவதைத் தெளிவாகச் சொல்கிறது.
