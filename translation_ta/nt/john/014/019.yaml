id: JHN.14.19
reference: John 14:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: ta
  text: இன்னும் சிறிது காலமே; அதன்பின் உலகம் என்னை இனி காணாது. ஆனால் நீங்கள் என்னைக் காண்பீர்கள்.[a] நான் வாழ்கிறேன் என்பதால், நீங்களும் வாழ்வீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காண்’ என்பதற்கான கிரேக்க வினை வெறுமனே ஒரு கணம் பார்ப்பதைவிட, உற்றுநோக்குவதையோ உணர்ந்து காண்பதையோ குறிக்கக்கூடும்; இவ்வசனத்தில் வரும் இரு இடங்களுக்கும் இது பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீங்களும் வாழ்வீர்கள்’ என்பது இயேசுவின் உயிர்த்தெழுதல் வாழ்வில் சீடர்கள் பங்குபெறுவதையோ, அவரோடு இணைந்த ஆவிக்குரிய வாழ்வையோ, அல்லது இரண்டையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: இன்னும் சிறிது காலமே
  rationale: மீதமுள்ள காலம் மிகக் குறுகியது என்ற காலக் குறிப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: யோவான் நூலில் காணப்படும் விரிவான பொருளைச் சுருக்காமல், மனித உலகைக் குறிக்கும் வழக்கமான சொல்லையே தக்கவைக்கிறது.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: காணாது / காண்பீர்கள்
  rationale: θεωρέω கவனித்துப் பார்ப்பதையோ உணர்ந்து காண்பதையோ குறிக்கக்கூடும்; இருப்பினும் இரு இடங்களிலும் இயல்பாகப் பொருந்தும் ‘காண்’ என்ற சொல்லைத் தேர்ந்தெடுத்து, குறுகிய காலத்துக்குப் பின் ஏற்படும் மாற்றத்தைத் தமிழில் எதிர்கால வடிவில் வெளிப்படுத்துகிறது.
- source_word: οὐκέτι
  choice: இனி காணாது
  rationale: விரைவில் தொடங்கவிருக்கும் ‘அதற்குமேல் இல்லை’ என்ற நிறுத்தப் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: உலகத்துக்கும் சீடர்களுக்கும் இயேசுவைக் காண்பதில் உள்ள எதிர்மறை வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: என்பதால்
  rationale: இயேசு வாழ்வதே சீடர்களும் வாழ்வதற்கான அடிப்படை என்ற காரணத் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐγὼ ζῶ
  choice: நான் வாழ்கிறேன்
  rationale: மூலத்தின் நிகழ்காலத்தையும் ‘வாழ்’ என்ற வினையின் இறையியல் செறிவையும் தக்கவைக்கிறது.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: நீங்களும் வாழ்வீர்கள்
  rationale: καί என்பதன் இணைப்பை ‘உம்’ வழியாகவும், ζήσετε என்பதன் எதிர்காலப் பொருளைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீடர்கள் இயேசுவைக் ‘காண்பது’ எதைக் குறிக்கிறது?
  choice: ‘காண்பீர்கள்’ என்று பொதுவாகவே மொழிபெயர்த்து, அதன் குறிப்பிட்ட விதத்தை நிர்ணயிக்காமல் விடப்பட்டுள்ளது.
  alternative: உயிர்த்தெழுதலுக்குப் பிந்தைய உடல்சார் காட்சிகள் மட்டும்; விசுவாசத்தின் வழியான ஆவிக்குரிய உணர்வு மட்டும்; அல்லது இரண்டும் அடங்கிய பல அடுக்குப் பொருள்.
  rationale: கிரேக்க வாசகம் காணுதலின் விதத்தை இங்கே வரையறுக்கவில்லை; ஆகவே உயிர்த்தெழுதல் காட்சிகள், ஆவிக்குரிய உணர்வு, இறுதிக்கால நிறைவு ஆகியவற்றில் ஒன்றை மட்டும் திணிக்காமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ‘நீங்களும் வாழ்வீர்கள்’ என்பதன் பரப்பு
  choice: உயிர்த்தெழுதல் அல்லது ஆவிக்குரிய வாழ்வு என்று குறுக்காமல், ‘வாழ்வீர்கள்’ என்ற விரிவான சொல்லே பயன்படுத்தப்பட்டுள்ளது.
  alternative: உயிர்த்தெழுதல் வாழ்வு மட்டும்; கிறிஸ்துவோடு இணைந்த தற்போதைய ஆவிக்குரிய வாழ்வு மட்டும்; அல்லது நித்திய வாழ்வின் முழுப் பங்கு.
  rationale: ζήσετε என்ற எதிர்கால வடிவம் தற்போதைய ஆவிக்குரிய வாழ்வையும் வருங்கால உயிர்த்தெழுதல் வாழ்வையும் ஒலிக்கச் செய்யக்கூடும்; மொழிபெயர்ப்பு இந்தப் பரப்பைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘காண்’ மற்றும் ‘வாழ்’ ஆகிய எளிய சொற்கள் மூலத்தின் திட்டமிட்ட மறுபயன்பாட்டையும் பொருள் திறப்பையும் காக்கின்றன.
