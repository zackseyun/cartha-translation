revisions:
- from: “நான் தந்தைக்குள் இருக்கிறேன், தந்தை எனக்குள் இருக்கிறார் என்று என்னை நம்புங்கள். இல்லையென்றால், அந்தச் செயல்களையே ஆதாரமாகக் கொண்டாவது நம்புங்கள்.[a]”
  to: “நான் தந்தைக்குள் இருக்கிறேன், தந்தை எனக்குள் இருக்கிறார் என்று என்னை நம்புங்கள். இல்லையென்றால், அந்தச் செயல்களினாலேயே நம்புங்கள்.[a]”
  rationale: The sole revision removes the added ‘at least’ implication while preserving the Greek’s concise, objectless final imperative. ‘அந்தச் செயல்களினாலேயே’ naturally expresses belief because of the works themselves and retains their emphatic evidential role.
