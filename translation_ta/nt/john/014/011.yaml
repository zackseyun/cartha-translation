source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: ta
  text: “நான் தந்தைக்குள் இருக்கிறேன், தந்தை எனக்குள் இருக்கிறார் என்று என்னை நம்புங்கள். இல்லையென்றால், அந்தச் செயல்களினாலேயே நம்புங்கள்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதியில் வரும் ‘நம்புங்கள்’ என்பதற்கு கிரேக்கத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை. ‘அந்தச் செயல்களின் காரணமாக நம்புங்கள்’ என்றும் மொழிபெயர்க்கலாம்; அந்தச் செயல்களே நம்புவதற்குப் போதுமான அடிப்படையாக முன்வைக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: என்னை நம்புங்கள்
  rationale: πιστεύω என்பதுடன் வரும் μοι, ஒருவரின் கூற்றை உண்மையென ஏற்கும்படி செய்யும் நேரடியான வேண்டுகோளைத் தருகிறது. ‘என்னை நம்புங்கள்’ என்பது அந்தத் தனிப்பட்ட வேண்டுகோளையும் கிரேக்க அமைப்பையும் இயல்பாகக் காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: இது நம்ப வேண்டிய கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கவில்லை. தமிழில் மேற்கோள் உள்ளடக்கத்தை இயல்பாக இணைக்கும் ‘என்று’ பொருத்தமானது.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: தந்தைக்குள் ... எனக்குள்
  rationale: இருமுறை வரும் ἐν-ஐ ‘-க்குள்’ என மொழிபெயர்ப்பது பரஸ்பர உள்ளிருப்பை நேரடியாகக் காக்கிறது; ‘ஒன்றாயிருக்கிறோம்’ போன்ற விளக்க உரையாக மாற்றவில்லை.
- source_word: εἰ δὲ μή
  choice: இல்லையென்றால்
  rationale: முந்தைய நேரடி வேண்டுகோள் ஏற்கப்படாவிட்டால், நம்புவதற்கான வேறொரு ஆதாரத்தைச் சுட்டும் நிபந்தனைமிக்க எதிர்மாற்றைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: அந்தச் செயல்களையே ஆதாரமாகக் கொண்டாவது
  rationale: διά நம்பிக்கைக்கான காரணம் அல்லது அடிப்படையைக் குறிக்கிறது. αὐτά தரும் வலியுறுத்தலை ‘செயல்களையே’ காக்கிறது; ‘ஆதாரமாகக் கொண்டு’ என்பது தமிழில் அந்தத் தர்க்க உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πιστεύετε
  choice: நம்புங்கள்
  rationale: இறுதி கட்டளைச்சொல்லுக்கு கிரேக்கத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை. தமிழிலும் அதைச் சேர்க்காமல் ‘நம்புங்கள்’ என்று விடுவது மூலத்தின் சுருக்கத்தையும் பொருள் திறந்த நிலையையும் காக்கிறது.
theological_decisions:
- issue: மகனும் தந்தையும் ஒருவருக்குள் ஒருவர் இருப்பது
  choice: ‘நான் தந்தைக்குள் இருக்கிறேன், தந்தை எனக்குள் இருக்கிறார்’ என்ற பரஸ்பர உள்ளிருப்பு மொழியை அப்படியே காத்தல்
  alternative: ‘நானும் தந்தையும் ஒன்றாயிருக்கிறோம்’ என்று விளக்கிக் கூறுதல்
  rationale: யோவானின் ஆழமான உறவு மொழியை வலுவிழக்கச் செய்யாமலும், அதற்குப் பதிலாக வேறொரு இறையியல் சூத்திரத்தை நுழைக்காமலும் மூலத்தின் தனித்துவமான சொல்லாட்சியைத் தக்கவைக்கிறது.
- issue: செயல்கள் நம்பிக்கைக்கு ஆதாரமாவது
  choice: இறுதி ‘நம்புங்கள்’ என்பதற்கு வெளிப்படையான செயப்படுபொருளைச் சேர்க்காமல், செயல்களையே நம்புவதற்கான ஆதாரமாகக் காட்டுதல்
  alternative: ‘செயல்களின் காரணமாக என்னை நம்புங்கள்’ அல்லது ‘என்னில் நம்பிக்கை வையுங்கள்’ என்று செயப்படுபொருளைச் சேர்த்தல்
  rationale: சூழலில் இயேசுவின் கூற்றே கருத்தாக இருந்தாலும், இரண்டாவது πιστεύετε-க்கு கிரேக்கத்தில் வெளிப்படையான செயப்படுபொருள் இல்லை. அதைத் தமிழிலும் நிரப்பாமல் இருப்பது உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. ‘பிதா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ பயன்படுத்தப்பட்டது. ‘தந்தைக்குள்/எனக்குள்’ என்ற இணையான அமைப்பு பரஸ்பர உள்ளிருப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
