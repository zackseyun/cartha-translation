translation:
  language: ta
  text: மேலும், நான் எங்கே போகிறேனோ, அங்கே செல்லும் வழி உங்களுக்குத் தெரியும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “நான் எங்கே போகிறேன் என்பதும் உங்களுக்குத் தெரியும்; வழியும் உங்களுக்குத் தெரியும்” என்று உள்ளது.
