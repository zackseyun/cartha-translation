  source_fidelity: 'முதன்மை உரை SBLGNT-இன் குறுகிய வாசகத்தைச் சரியாகப் பின்பற்றுகிறது: இயேசு செல்லும் இடத்திற்கான ‘வழி’ சீடர்களுக்குத் தெரியும் என்பதே பொருள். ஆயினும் தொடக்கக் καὶ (‘and’) தமிழில் முற்றிலும் விடப்பட்டுள்ளதால், அந்த எளிய இணைப்பை ‘மேலும்’ எனக் கொடுப்பது பாதுகாப்பானது. ‘அங்கே செல்லும் வழி’ என்பது ὅπου மற்றும் τὴν ὁδόν ஆகியவற்றின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; கூடுதல் இறையியல் விளக்கம் அல்ல.'
  naturalness: ‘நான் எங்கே போகிறேனோ, அங்கே செல்லும் வழி உங்களுக்குத் தெரியும்’ என்பது நவீன பொதுத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. தொடக்கத்தில் ‘மேலும்,’ சேர்த்தாலும் நடை செயற்கையாவதில்லை; முந்தைய வாக்கியத்துடனான தொடர்ச்சியும் தெளிவாகும்.
