lexical_decisions:
- source_word: καὶ
  choice: தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: முந்தைய வாக்கியத்துடன் இணைக்கும் எளிய இடைச்சொல். இவ்வசனத்தைத் தனியே வாசிக்கும்போது தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அதோடு’ சேர்ப்பது தமிழில் தேவையற்றதாகவும் சற்றுச் செயற்கையாகவும் இருக்கும்; வாக்கியத் தொடர்ச்சி இயல்பான அமைப்பால் வெளிப்படுகிறது.
- source_word: ὅπου
  choice: எங்கே ... அங்கே
  rationale: இடத்தைக் குறிக்கும் உறவுத் தொடரை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘அங்கே’ என்பது வழிக்கும் இயேசு போகும் இடத்திற்கும் உள்ள தொடர்பைத் தெளிவாக்குகிறது; ஆனால் அந்த இடம் எது என்பதை விளக்கிச் சொல்லவில்லை.
- source_word: ἐγὼ
  choice: நான்
  rationale: வினையின் வெளிப்படையான எழுவாயைத் தக்கவைக்கிறது.
- source_word: ὑπάγω
  choice: போகிறேனோ
  rationale: நிகழ்கால இயக்கத்தையும் சூழலில் உள்ள விரைவில் நிகழவிருக்கும் புறப்படுதலையும் இயல்பாக வெளிப்படுத்துகிறது. ‘புறப்படுகிறேன்’ என்பது விடைபெறும் சூழலை அளவுக்கு மீறி விளக்கக்கூடும்.
- source_word: οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα என்பதன் நிகழ்காலப் பொருளை வழக்கமான தமிழில் தருகிறது. பன்மை இரண்டாம் நபர் ‘உங்களுக்கு’ என்பதில் வெளிப்படுகிறது.
- source_word: τὴν ὁδόν
  choice: செல்லும் வழி
  rationale: ὁδός என்பதற்கு இச்சூழலில் ‘வழி’ இயல்பானது. ‘பாதை’ என்பது உடல்சார்ந்த நடைபாதையை அதிகம் உணர்த்தலாம். ‘செல்லும்’ என்பது வழிக்கும் முன் குறிப்பிடப்பட்ட இடத்திற்கும் உள்ள தொடர்பை தமிழில் இயல்பாக அமைக்கிறது.
theological_decisions:
- issue: ‘நான் எங்கே போகிறேனோ’ என்ற தொடருக்கும் ‘வழி’ என்பதற்கும் உள்ள இலக்கணத் தொடர்பு
  choice: நான் எங்கே போகிறேனோ, அங்கே செல்லும் வழி உங்களுக்குத் தெரியும்.
  alternative: நான் எங்கே போகிறேனோ, அந்த வழி உங்களுக்குத் தெரியும்.
  rationale: மூலத்தின் சொற்றொடர் வரிசையையும் தொடர்பையும் மதித்தபடி, நவீனத் தமிழில் புரியக்கூடிய அமைப்பைத் தேர்ந்தெடுக்கிறது. ‘அங்கே செல்லும்’ என்பது இலக்கை அடையும் வழி என்ற இயல்பான தொடர்பை வெளிப்படுத்துகிறது; அந்த ‘வழி’ யார் அல்லது என்ன என்பதை யோவான் 14:6-இலிருந்து முன்கூட்டியே இவ்வசனத்துக்குள் கொண்டுவரவில்லை.
- issue: வேறுபட்ட கையெழுத்துப் பிரதிகளின் நீளமான வாசகம்
  choice: SBLGNT வாசகம் முதன்மை உரையில் மொழிபெயர்க்கப்பட்டு, நீளமான வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
  alternative: ‘நான் எங்கே போகிறேன் என்பதும் உங்களுக்குத் தெரியும்; வழியும் உங்களுக்குத் தெரியும்’ என்பதை முதன்மை உரையாகக் கொடுத்தல்.
  rationale: கொடுக்கப்பட்ட மூலப் பதிப்பின் குறுகிய வாசகமே முதன்மை உரைக்கு அடிப்படை. வேறு பிரதிகளில் காணப்படும் இரு அறிவுக் கூற்றுகளையும் மூல உரைக்குள் கலக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை. ‘உங்களுக்குத் தெரியும்’ என்பது சீடர்கள் பலரிடம் சொல்லப்படும் உரையைத் தெளிவாகக் காட்டுகிறது. சொற்சொற் கட்டமைப்பின் செயற்கைத்தன்மையைத் தவிர்த்தாலும், இலக்கு, வழி ஆகியவற்றைப் பற்றிய மூலத்தின் சுருக்கத்தையும் அடுத்த வசனத்தில் வெளிப்படும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் வைத்திருக்கிறது.
