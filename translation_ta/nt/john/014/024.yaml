  source_fidelity: 'மூலக் கிரேக்கத்தின் அமைப்பும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: பொதுப்படையான நிகழ்காலப் பங்கேற்பு (‘என்னை நேசிக்காதவர்’), பன்மை λόγους (‘என் வார்த்தைகள்’), ஒருமை λόγος (‘வார்த்தை’), மற்றும் ‘என்னுடையது அல்ல; ... தந்தைக்குரியது’ என்ற முரண்பாட்டு அமைப்பு அனைத்தும் பொருத்தமாக உள்ளன. ‘நீங்கள் கேட்கிற’ என்பது ἀκούετε என்ற நிகழ்காலத்தையும், தந்தை ‘என்னை அனுப்பியவர்’ என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.'
  naturalness: நவீன பொதுத்தமிழில் நடை தெளிவாகவும் கண்ணியமாகவும் இயல்பாகவும் உள்ளது. ‘கடைப்பிடிப்பதில்லை’ இச்சூழலில் τηρεῖ என்பதன் போதனையைக் காத்து அதன்படி நடப்பது என்ற விரிந்த பொருளைச் சரியாகத் தருகிறது. ‘அது என்னை அனுப்பிய தந்தைக்குரியது’ என்பதில் தொடர்புவாக்கியம் ‘தந்தை’யைத் தெளிவாகத் தழுவுகிறது.
