id: JHN.14.24
reference: John 14:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: ta
  text: என்னை நேசிக்காதவர் என் வார்த்தைகளைக் கடைப்பிடிப்பதில்லை. நீங்கள் கேட்கிற வார்த்தை என்னுடையது அல்ல; அது என்னை அனுப்பிய தந்தைக்குரியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது என்னை அனுப்பிய தந்தையிடமிருந்து வந்தது.”
    reason: τοῦ … πατρός என்ற பிறப்புவேற்றுமை அமைப்பு உடைமையையோ மூலாதாரத்தையோ குறிக்கலாம்; முதன்மை உரை உடைமைப் பொருளையும், மாற்று மொழிபெயர்ப்பு மூலாதாரப் பொருளையும் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: என்னை நேசிக்காதவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவம், இயேசுவை நேசிக்காத ஒருவரைப் பொதுவாகக் குறிக்கிறது. இந்தத் தேர்வு தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: τοὺς λόγους μου
  choice: என் வார்த்தைகளை
  rationale: λόγους என்பதன் பன்மையைப் பாதுகாத்து, இயேசுவின் கூறப்பட்ட போதனைகளைச் சுட்டுகிறது.
- source_word: τηρεῖ
  choice: கடைப்பிடிப்பதில்லை
  rationale: யோவானின் பயன்பாட்டில் τηρέω என்பது போதனையை உண்மையுடன் காத்து அதன்படி நடப்பதை உள்ளடக்குகிறது. ‘கீழ்ப்படிவதில்லை’ என்பதைவிட ‘கடைப்பிடிப்பதில்லை’ இந்த விரிந்த பொருளை நன்றாகத் தக்கவைக்கிறது.
- source_word: ὁ λόγος
  choice: வார்த்தை
  rationale: ஒருமை வடிவத்தைப் பாதுகாப்பதோடு, இயேசுவின் போதனையை ஒருங்கிணைந்த வார்த்தையாகக் காட்டும் யோவானியச் சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: ὃν ἀκούετε
  choice: நீங்கள் கேட்கிற
  rationale: நிகழ்கால வினையை இயல்பான தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என்னிடமிருந்து’ என்பதைச் சேர்க்கவில்லை.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: என்னுடையது அல்ல
  rationale: ἐμός என்பதன் நேரடியான உடைமைப் பொருளையும், மூலத்தின் சுருக்கமான முரண்பாட்டு அமைப்பையும் பாதுகாக்கிறது.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: அது என்னை அனுப்பிய தந்தைக்குரியது
  rationale: கிரேக்க மரபுத்தொடரின் உடைமை அல்லது மூலாதாரப் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, ‘என்னை அனுப்பிய’ என்பது ‘தந்தை’ என்பதையே தெளிவாக விளக்குமாறு அமைக்கிறது.
theological_decisions:
- issue: இயேசுவின் போதனைக்கும் தந்தையின் போதனைக்கும் உள்ள உறவு
  choice: ‘என்னுடையது அல்ல; அது என்னை அனுப்பிய தந்தைக்குரியது’
  alternative: ‘என்னிடமிருந்து வந்தது அல்ல; என்னை அனுப்பிய தந்தையிடமிருந்து வந்தது’
  rationale: மொழிபெயர்ப்பு தந்தையையும் மகனையும் வேறுபடுத்திக் காட்டுவதோடு, கேட்கப்படும் வார்த்தையின் மூலத்தைத் தந்தையோடு இணைக்கிறது. இயேசு தம் போதனையை மறுப்பதாகவோ, உரை வெளிப்படையாகச் சொல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதாகவோ ஆக்காமல், மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நேசிக்காதவர்’ பாலினம் சுட்டாத பொதுப்படையான நபரைக் குறிக்கிறது. ‘வார்த்தைகள்/வார்த்தை’ என்ற ஒரே சொல் குடும்பம், மூலத்திலுள்ள λόγους/λόγος தொடர்பை வெளிப்படையாக வைத்திருக்கிறது.
