source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: ta
  text: அந்த நாளில், நான் என் தந்தையில் இருக்கிறேன் என்பதையும், நீங்கள் என்னில் இருக்கிறீர்கள் என்பதையும், நான் உங்களில் இருக்கிறேன் என்பதையும் நீங்கள் அறிவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு மீண்டும் வரும் ‘-இல்’ வடிவு, மூலமொழியில் மீண்டும் வரும் ஒரே முன்னிடைச்சொல்லைப் பிரதிபலிக்கிறது. இதை ‘ஒன்றிப்பில்’ என்று விளக்கலாம்; ஆனால் அவ்வாறு செய்வது மூலத்தின் உருவகத்தை ஒரு குறிப்பிட்ட விளக்கமாகக் குறுக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் தொடரை இயல்பான தமிழில் வழங்குகிறது; ἐκείνῃ என்பதன் குறிப்புத்தன்மையையும் காக்கிறது.
- source_word: γνώσεσθε ὑμεῖς
  choice: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: எதிர்காலத்தில் ஏற்படும் அறிதல் அல்லது உணர்தலை இயல்பாகத் தெரிவிக்கிறது. வெளிப்படையான ὑμεῖς தரும் வலியுறுத்தல் தமிழின் எழுவாய் மற்றும் வாக்கிய அமைப்பில் போதுமான அளவு வெளிப்படுகிறது.
- source_word: ὅτι
  choice: என்றும் … என்றும் … என்றும்
  rationale: அவர்கள் எதை அறிந்துகொள்வார்கள் என்பதைக் குறிக்கும் உள்ளடக்க வாக்கியங்களைத் தமிழில் தெளிவாக இணைக்கிறது; காரணப் பொருளைத் தரவில்லை.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: நான் என் தந்தைக்குள் இருக்கிறேன்
  rationale: யோவானின் ἐν மொழியை விளக்கவுரையாக மாற்றாமல், ‘உள்ளே/உள்நிலை’ என்ற உருவக மற்றும் இறையியல் செறிவுடன் காக்கிறது.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: நீங்கள் எனக்குள் இருக்கிறீர்கள்
  rationale: வினையற்ற கிரேக்கக் கூறில் தமிழுக்குத் தேவையான ‘இருக்கிறீர்கள்’ சேர்க்கப்பட்டு, மீண்டும் வரும் ἐν ‘-க்குள்’ என ஒரே சீராகப் பாதுகாக்கப்படுகிறது.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: நான் உங்களுக்குள் இருக்கிறேன்
  rationale: κἀγώ என்பதன் ‘நானும்/நான்’ என்ற இணைப்பை தொடரமைப்பு வெளிப்படுத்துகிறது; பரஸ்பர உள்ளிருப்பின் மொழி விளக்கமாகச் சுருக்கப்படவில்லை.
theological_decisions:
- issue: யோவானின் பரஸ்பர உள்ளிருப்பு மொழி (ἐν … ἐν … ἐν)
  choice: மூன்று இடங்களிலும் ‘-க்குள்’ என்ற வடிவைப் பாதுகாத்தல்
  alternative: ‘ஒன்றுபட்டிருக்கிறேன் / இணைந்திருக்கிறீர்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் உருவகத்தையும் பல அடுக்குகளைக் கொண்ட இறையியல் பதற்றத்தையும் காக்கிறது; அதை வெறும் உறவு, ஒன்றிப்பு அல்லது சாராம்ச அடையாளம் என்ற ஒரே விளக்கமாகக் குறுக்கவில்லை.
- issue: இயேசுவுக்கும் தந்தைக்கும் இடையிலான உறவு
  choice: ‘நான் என் தந்தைக்குள் இருக்கிறேன்’
  alternative: ‘நானும் என் தந்தையும் சாராம்சத்தில் ஒன்று’ அல்லது ‘நான் என் தந்தையோடு இருக்கிறேன்’
  rationale: மூலத்தின் வலிமையைத் தளர்த்தாமலும், பிற்காலக் கோட்பாட்டு சொற்களை வசனத்துக்குள் சேர்க்காமலும் நேரடியாக வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை. ‘பிதா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தொடர்ச்சியாக வரும் ἐν என்பதைக் காக்க ‘எனக்குள் / உங்களுக்குள் / தந்தைக்குள்’ என்ற ஒரே சீரான அமைப்பு தேர்ந்தெடுக்கப்பட்டது.
