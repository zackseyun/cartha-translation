revisions:
- from: நீங்கள் என்னில் அன்புகூர்ந்தால், என் கட்டளைகளைக் கைக்கொள்வீர்கள்.[a]
  to: நீங்கள் என்னை அன்புகூர்ந்தால், என் கட்டளைகளைக் கைக்கொள்வீர்கள்.[a]
  rationale: The sole revision changes “என்னில்” to “என்னை” in order to render the Greek direct object με faithfully and idiomatically. The conditional relationship, second-person plural address, possessive emphasis, and future statement remain intact. The footnote is retained with only punctuation smoothing.
  reviewer_model: gpt-5.6-terra
