  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: ta
  text: நீங்கள் என்னை அன்புகூர்ந்தால், என் கட்டளைகளைக் கைக்கொள்வீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கட்டளைகளுக்குக் கீழ்ப்படிவீர்கள்.” இங்குள்ள வினைச்சொல் கைக்கொள்ளுதல், கடைப்பிடித்தல், காத்தல், அல்லது கீழ்ப்படிதல் என்று பொருள்படலாம்; “கைக்கொள்வீர்கள்” அதன் விரிந்த பொருளைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: -ஆல் (நிபந்தனை வடிவம்)
  rationale: ἐάν நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க, வினையுடன் இணையும் ‘அன்புகூர்ந்தால்’ என்ற வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἀγαπᾶτέ
  choice: நீங்கள் அன்புகூர்ந்தால்
  rationale: நிகழ்கால செயப்பாட்டு துணைவினை வடிவத்தை நிபந்தனைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது. பன்மை இரண்டாம் நபர் ‘நீங்கள்’ என்பதும் பாதுகாக்கப்படுகிறது.
- source_word: με
  choice: என்னில்
  rationale: தமிழில் ‘ஒருவரில் அன்புகூருதல்’ என்பது கண்ணியமான, புரிந்துகொள்ளத்தக்க நடை. இது இயேசுவை நோக்கிய அன்பைத் தெரிவிக்கிறது.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: என் கட்டளைகளை
  rationale: ἐντολάς என்பதன் அதிகாரமும் யோவானிய சொல்லாட்சியும் ‘கட்டளைகள்’ என்பதில் நிலைக்கின்றன; வலியுறுத்தப்பட்ட உடைமைக் கட்டமைப்பு இயல்பான தமிழில் ‘என்’ என வழங்கப்படுகிறது.
- source_word: τηρήσετε
  choice: கைக்கொள்வீர்கள்
  rationale: இது எதிர்காலச் சுட்டுவினை; ஆகவே கட்டளையாக மாற்றாமல் ‘கைக்கொள்வீர்கள்’ என்று வழங்கப்பட்டது. ‘கைக்கொள்’ என்பது கடைப்பிடித்தல், பாதுகாத்தல், உறுதியாகப் பற்றிக்கொள்ளுதல் ஆகிய விரிந்த பொருள் நிழல்களை ஓரளவு தக்கவைக்கிறது.
theological_decisions:
- issue: τηρήσετε என்பதை நேரடிக் கட்டளையாகவா, எதிர்காலக் கூற்றாகவா வழங்குவது
  choice: 'எதிர்காலக் கூற்று: ‘கைக்கொள்வீர்கள்’'
  alternative: 'கட்டளைப் பொருள்: ‘என் கட்டளைகளைக் கைக்கொள்ளுங்கள்’'
  rationale: கிரேக்க வடிவம் எதிர்காலச் சுட்டுவினை; கட்டளை வினை அல்ல. எனவே இயேசுவின்மேலுள்ள அன்புக்கும் அவருடைய கட்டளைகளைக் கைக்கொள்வதற்கும் இடையிலான இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல், இலக்கண வடிவம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் எளிய புரிதலும் இணைக்கப்பட்டுள்ளன. ‘கைக்கொள்வீர்கள்’ என்பது எதிர்கால வடிவத்தையும் τηρέω என்பதன் விரிந்த பொருளையும் பாதுகாக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளான கீழ்ப்படிதலைக் குறிப்பிடுகிறது.
