  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: ta
  text: நீங்கள் என்னை அறிந்திருந்தால், என் தந்தையையும் அறிந்திருப்பீர்கள். இப்போதுமுதல் நீங்கள் அவரை அறிந்திருக்கிறீர்கள்; அவரைக் கண்டிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε
  choice: அறிந்திருந்தால் / அறிந்திருப்பீர்கள்
  rationale: இரண்டு வேறுபட்ட கிரேக்க வினைச்சொற்களும் இங்கு ஒருவரை உறவுசார் முறையில் அறிதலைக் குறிக்கின்றன; இயல்பான தமிழுக்காக ஒரே ‘அறி’ வேரால் மொழிபெயர்க்கப்பட்டன.
- source_word: ἀπ’ ἄρτι
  choice: இப்போதுமுதல்
  rationale: தற்போதிலிருந்து தொடங்கும் காலநிலையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γινώσκετε
  choice: அறிந்திருக்கிறீர்கள்
  rationale: நிகழ்காலத்தில் உண்மையாக நிலவும் அறிவை வலியுறுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது; ஆங்கில consultation layer-இன் emphatic ‘do know’ என்பதையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: ἑωράκατε
  choice: கண்டும் இருக்கிறீர்கள்
  rationale: Perfect tense-இன் முந்தைய காண்தலும் அதன் தொடரும் விளைவும் தமிழில் வெளிப்படுகிறது.
theological_decisions:
- issue: சீடர்கள் தந்தையை அறிந்ததும் கண்டதும் பற்றிய கூற்றின் வலிமை
  choice: ‘அறிந்திருக்கிறீர்கள்; அவரைக் கண்டும் இருக்கிறீர்கள்’ என்று உறுதிப்படுத்தும் கூற்றாக வைத்தல்
  alternative: ‘அறிந்துகொள்வீர்கள்; காண்பீர்கள்’ என்று எதிர்காலமாக்குதல்
  rationale: SBLGNT உரையில் γινώσκετε நிகழ்காலத்திலும் ἑωράκατε perfect காலத்திலும் உள்ளன; ஆகவே உரையின் தத்துவச் சிக்கலை எதிர்கால வாக்குறுதியாக மாற்றாமல் பாதுகாக்கிறது.
- issue: முதல் நிபந்தனை வாக்கியத்தின் உரைமாறுபாடு
  choice: SBLGNT முதன்மை உரையைப் பின்பற்றி ‘அறிந்திருந்தால் ... அறிந்திருப்பீர்கள்’
  alternative: சில சாட்சிகளின்படி ‘என்னை அறிந்திருந்தால், என் தந்தையையும் அறிவீர்கள்’ போன்ற வடிவம்
  rationale: கொடுக்கப்பட்ட SBLGNT உரையின் εἰ ἐγνώκειτέ ... ἂν ᾔδειτε என்ற எதிர்நிலை நிபந்தனை அமைப்பு நேரடியாகப் பிரதிபலிக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் எளிமையும் கொண்ட நடை. ‘தந்தை’ என்பது யோவான் நற்செய்தியின் உறவுசார் மற்றும் இறையியல் சொல்லாட்சியை இயல்பாகப் பாதுகாக்கிறது. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டன.
