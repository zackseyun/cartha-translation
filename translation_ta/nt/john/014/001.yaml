  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: ta
  text: உங்கள் உள்ளம் கலங்க வேண்டாம். கடவுளை நம்புங்கள்[a]; என்னையும் நம்புங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் கடவுளை நம்புகிறீர்கள்; என்னையும் நம்புங்கள்.” πιστεύετε என்ற கிரேக்க வடிவம் “நம்புகிறீர்கள்” என்ற கூற்றாகவும் “நம்புங்கள்” என்ற கட்டளையாகவும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “நம்புங்கள்” என்பதை “நம்பிக்கை வையுங்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள வினைச்சொல் ஒன்றை உண்மையென ஏற்றுக்கொள்வதோடு, ஒருவர்மீது நம்பிக்கை வைத்து அவரைச் சார்ந்திருக்கும் பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: கலங்க வேண்டாம்
  rationale: μή உடன் வரும் நிகழ்காலச் செயப்பாட்டு மூன்றாம் நபர் கட்டளை வடிவத்தின் தடைப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. ‘கலங்கு’ என்பது மனக்குழப்பம், துயரம், அச்சம் ஆகியவற்றை உள்ளடக்கக்கூடியதாக இருப்பதால் பொருளைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: ὑμῶν ἡ καρδία
  choice: உங்கள் உள்ளம்
  rationale: பன்மை உடைமைப்பெயருடன் ஒருமையில் வரும் கிரேக்கச் சொற்றொடரின் கூட்டுப் பொருளைத் தக்கவைக்கிறது. தமிழில் ‘உள்ளம்’ என்பது இங்கு உணர்ச்சி, சிந்தனை, மனநிலை ஆகியவற்றின் மையத்தைக் குறிக்கும் இயல்பான சொல்.
- source_word: πιστεύετε
  choice: நம்புங்கள்
  rationale: πιστεύω என்பதிலுள்ள நம்புதல் மற்றும் சார்ந்திருத்தல் ஆகிய தொடர்புப்பொருள்களை ‘நம்பு’ இயல்பாகத் தாங்குகிறது. கிரேக்க வடிவம் கூற்றாகவும் கட்டளையாகவும் அமையக்கூடியதால் அந்த இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: εἰς τὸν θεόν
  choice: கடவுளை
  rationale: πιστεύω + εἰς என்பதன் இலக்கை நோக்கிய நம்பிக்கையைத் தமிழில் ‘கடவுளை நம்புங்கள்’ என்று இயல்பாகச் சொல்கிறோம்; கிரேக்க முன்னிடைச்சொல்லைச் சொல்லுக்குச் சொல் மொழிபெயர்ப்பது தமிழில் இயல்பற்றதாகும்.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: என்னையும் நம்புங்கள்
  rationale: ‘-யும்’ என்பது καί என்பதன் சேர்க்கைப் பொருளைக் காட்டி, கடவுள்மீதும் இயேசுவின்மீதும் வைக்கப்படும் நம்பிக்கையின் இணை அமைப்பைப் பாதுகாக்கிறது. வினைச்சொல்லும் மீண்டும் தரப்பட்டுள்ளது.
theological_decisions:
- issue: πιστεύετε என்ற இரு வடிவங்களும் கூற்றா அல்லது கட்டளையா என்பது
  choice: 'இரண்டையும் கட்டளையாக மொழிபெயர்த்தல்: ‘கடவுளை நம்புங்கள்; என்னையும் நம்புங்கள்.’'
  alternative: ‘நீங்கள் கடவுளை நம்புகிறீர்கள்; என்னையும் நம்புங்கள்.’ இரண்டையும் கூற்றாகவோ, ஒன்றைக் கூற்றாகவும் மற்றொன்றைக் கட்டளையாகவோ புரிந்துகொள்ளவும் இலக்கண வாய்ப்பு உண்டு.
  rationale: கிரேக்கத்தில் நிகழ்காலச் செய்பாட்டு இரண்டாம் நபர் பன்மையின் கூற்று வடிவமும் கட்டளை வடிவமும் ஒரே எழுத்துவடிவமான πιστεύετε ஆகும். தொடக்கத் தடை மற்றும் ஆறுதலூட்டும் சூழல் காரணமாக இரண்டு கட்டளைகள் முதன்மை உரையில் இயல்பாக அமைகின்றன; எனினும் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள் உள்ளம்’ என்ற ஒருமை வடிவம் சீடர்களை ஒரு குழுவாக நோக்கும் மூலத்தின் கூட்டுப் பயன்பாட்டைப் பாதுகாக்கிறது. சமயப்பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
