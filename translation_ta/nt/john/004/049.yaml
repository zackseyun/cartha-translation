source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: ta
  text: அரசவையைச் சேர்ந்த அதிகாரி அவரிடம், “ஆண்டவரே[a], என் குழந்தை இறப்பதற்கு முன் கீழே வாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.” கிரேக்கச் சொல் κύριε மரியாதையான அழைப்பாகவும் “ஆண்டவரே” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: அரச அதிகாரி
  rationale: βασιλικός பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு அரசருடனோ அரசவையுடனோ தொடர்புடைய ஒருவரைக் குறிக்கிறது. ‘அரச அதிகாரி’ என்பது நவீன தமிழில் தெளிவாக இருந்து, ‘பிரபு’ போன்ற சமூகப் படிநிலை சார்ந்த கூடுதல் பொருளைத் தவிர்க்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριε என்பது மரியாதையான அழைப்பாகவும் ‘ஆண்டவர்’ என்ற ஆழமான பொருளுடனும் ஒலிக்கக்கூடும். யோவான் நற்செய்தியில் உள்ள இந்தப் பொருள் அடுக்கைத் தக்கவைக்க ‘ஆண்டவரே’ என மொழிபெயர்க்கப்படுகிறது; உடனடிச் சூழலில் சாத்தியமான ‘ஐயா’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατάβηθι
  choice: கீழே வாரும்
  rationale: καταβαίνω என்பதன் கட்டளை வடிவம் கீழ்நோக்கிய பயணத்தை வெளிப்படையாகக் குறிக்கிறது. பேச்சாளர் இயேசுவைத் தம்முடன் வருமாறு வேண்டுவதால் ‘வாரும்’ இயல்பாகவும், ‘கீழே’ நில அமைப்பைக் காக்கும் வகையிலும் உள்ளது.
- source_word: πρὶν ἀποθανεῖν
  choice: இறந்துபோவதற்கு முன்
  rationale: πρίν உடன் வரும் வினையெச்சம் முன்னதாக நிகழும் காலத்தை, ‘இறப்பதற்கு முன்’ என்ற பொருளில் குறிக்கிறது. தமிழில் வேண்டுகோளின் அவசரத்தை இயல்பாக வெளிப்படுத்த ‘இறந்துபோவதற்கு முன்’ பயன்படுத்தப்படுகிறது.
- source_word: τὸ παιδίον μου
  choice: என் குழந்தை
  rationale: παιδίον என்பது குழந்தை அல்லது சிறு குழந்தையைக் குறிக்கிறது. இந்த வசனத்தில் பாலினத்தைத் தனியாகக் குறிப்பிடாததால் ‘என் குழந்தை’ மூலத்தின் சொற்பொருளையும் தெளிவின்மையையும் காக்கிறது.
- source_word: λέγει πρὸς αὐτόν
  choice: அவரிடம் ... என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலமான λέγει, இயல்பான தமிழ் கதைநடையில் இறந்தகாலமாக வழங்கப்படுகிறது. πρὸς αὐτόν என்பதற்கு ‘அவரிடம்’ நேரடியான, இயல்பான இணையாகும்.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος அழைப்பின் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இந்தச் சூழலில் κύριε வெறும் மரியாதை அழைப்பாக இருக்கக்கூடும்; அதேவேளையில் யோவான் நற்செய்தியின் பரந்த சூழலில் ‘ஆண்டவர்’ என்ற ஆழமான ஒலிப்பையும் கொண்டிருக்க முடியும். அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல், ‘ஆண்டவரே’ என்பதை முதன்மை உரையிலும் ‘ஐயா’ என்பதை அடிக்குறிப்பிலும் தருகிறோம்.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசவையுடனான தொடர்பு ‘அரச அதிகாரி’ என்பதால் தெளிவாகிறது. வேண்டுகோளின் அவசரத்தையும் நில அமைப்பைக் குறிக்கும் ‘கீழே’ என்பதையும் உரை தக்கவைக்கிறது; ‘வாரும்’ என்பது மரியாதையான வேண்டுகோள் நடையை அளிக்கிறது.
