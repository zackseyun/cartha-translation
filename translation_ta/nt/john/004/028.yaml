  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: ta
  text: 'ஆகவே, அந்தப் பெண் தன் தண்ணீர்க் குடத்தை விட்டுவிட்டு, ஊருக்குள் சென்று, மக்களிடம் சொல்கிறாள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρίαν
  choice: தண்ணீர்க் குடம்
  rationale: தண்ணீர் எடுத்து வரப் பயன்படுத்தப்பட்ட பாத்திரம் என்பதை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: πόλιν
  choice: ஊர்
  rationale: சமாரியா போன்ற குடியிருப்பைக் குறிப்பிடும் இச்சூழலில், ‘நகரம்’ என்பதைவிட ‘ஊர்’ இயல்பாகவும் அளவை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: τοῖς ἀνθρώποις
  choice: அங்கிருந்த மக்கள்
  rationale: பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல், ஊரில் இருந்த மக்களையே சுட்டுகிறது.
- source_word: λέγει
  choice: சொல்கிறாள்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, அடுத்துவரும் நேரடி உரைக்கு இயல்பாக வழிவகுக்கிறது.
