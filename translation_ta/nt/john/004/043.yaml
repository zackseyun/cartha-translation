  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: ta
  text: அந்த இரண்டு நாட்களுக்குப் பிறகு, அவர் அங்கிருந்து கலிலேயாவுக்குப் புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: அந்த இரண்டு நாட்களுக்குப் பிறகு
  rationale: μετά + வேற்றுமை வடிவம் காலவரிசையில் ‘பிறகு’ என்பதைக் குறிக்கிறது. τὰς என்ற சுட்டுத்தன்மையுள்ள கட்டுரை, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரண்டு நாள் தங்குதலைத் திரும்பச் சுட்டுவதால் ‘அந்த இரண்டு நாட்கள்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது. δέ மென்மையான தொடரிணைப்பு; தமிழில் தனியாகச் சொல்லத் தேவையில்லை.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: ἐξέρχομαι என்பதன் இறந்தகால வடிவம் அடிப்படையில் ‘வெளியே சென்றார்’ என்று பொருள்பட்டாலும், இடம்பெயர்வுப் பின்னணியில் முந்தைய இடத்தை விட்டுப் பயணமானதை ‘புறப்பட்டுச் சென்றார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்திலிருந்து நகர்வதைக் குறிக்கும் இடவினையடை; தமிழில் ‘அங்கிருந்து’ துல்லியமும் இயல்பும் உடையது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: εἰς இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது. இங்கு தமிழில் ‘கலிலேயாவுக்கு’ என்பது இயல்பாக இலக்கை வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. முந்தைய சூழலில் குறிப்பிடப்பட்ட இரண்டு நாட்களை ‘அந்த’ என்று தெளிவாகத் திரும்பச் சுட்டுகிறது. ஆங்கிலத்தில் உள்ள ‘for/to Galilee’ வேறுபாடு தமிழில் ‘கலிலேயாவுக்கு’ என்பதிலேயே இயல்பாக அடங்குவதால் அடிக்குறிப்பு தேவையில்லை.
