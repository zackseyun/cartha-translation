  source_fidelity: மூலத்தின் காலத் தொடர்ச்சி (Μετὰ δὲ τὰς δύο ἡμέρας), முன்சூழலைச் சுட்டும் தன்மை, அங்கிருந்து புறப்படுதல், கலிலேயாவை நோக்கிய இயக்கம் ஆகியவை அனைத்தும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. δέ-யின் மென்மையான இணைப்பு தமிழில் விடப்பட்டிருப்பது இயல்பானது.
  naturalness: “அந்த இரண்டு நாட்களுக்குப் பிறகு, அவர் அங்கிருந்து கலிலேயாவுக்குப் புறப்பட்டுச் சென்றார்” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “புறப்பட்டுச் சென்றார்” சிறிது விரிவான நடை என்றாலும் பயணச் சூழலில் இயல்பானது.
  terminology: “கலிலேயா” என்ற இடப்பெயர் நிலையான தமிழ்ப் பயன்பாட்டுக்கு ஏற்றது. சிறப்புத் தெய்வீகச் சொற்கள் இவ்வசனத்தில் இல்லை. அடிக்குறிப்பு தேவையில்லை; இலக்கைச் சுட்டும் εἰς-இன் இயல்பான தமிழ் வெளிப்பாடு “கலிலேயாவுக்கு” ஆகும்.
