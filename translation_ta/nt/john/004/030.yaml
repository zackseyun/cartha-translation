lexical_decisions:
- source_word: ἐξῆλθον
  choice: புறப்பட்டு
  rationale: ἐξέρχομαι என்பதன் இறந்தகால வடிவம், வரையறுக்கப்பட்ட ஓர் இடத்தின் உள்ளிருந்து வெளியேறுவதைக் குறிக்கிறது. அடுத்த வினையுடன் இயல்பாக இணைவதற்காகத் தமிழில் வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἐκ τῆς πόλεως
  choice: நகரத்திலிருந்து
  rationale: ἐκ என்பது உள்ளிருந்து வெளியே செல்லும் இயக்கத்தையும், πόλις நகரம் அல்லது பட்டணம் என்பதையும் குறிக்கிறது. ‘நகரத்திலிருந்து’ என்பது இவ்விரண்டையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἤρχοντο
  choice: வந்துகொண்டிருந்தார்கள்
  rationale: ἔρχομαι என்பதன் இறந்தகால நிறைவுறா வடிவம், அப்போது தொடர்ந்துகொண்டிருந்த அணுகுதலைக் காட்டுகிறது. ‘வந்துகொண்டிருந்தார்கள்’ அந்த நிறைவுறாத தன்மையைப் பாதுகாக்கிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: πρός + வேற்றுமை உருபு ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘அவரிடம்’ தமிழில் இயல்பாகவும் மரியாதையான சுட்டுப்பெயருடனும் இயேசுவை நோக்கிய அணுகுதலைத் தெரிவிக்கிறது.
