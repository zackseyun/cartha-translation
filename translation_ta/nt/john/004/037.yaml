source:
  edition: SBLGNT
  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: ta
  text: ஏனெனில், இதில், “விதைக்கிறவர் ஒருவர்; அறுவடை செய்கிறவர் வேறொருவர்” என்ற கூற்று உண்மையானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இதில் இந்தக் கூற்று உண்மையானது: ஒருவர் விதைக்கிறார்; வேறொருவர் அறுவடை செய்கிறார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: ஏனெனில் ... இதில்
  rationale: γὰρ முந்தைய கருத்துக்கு விளக்கம் அளிப்பதை ‘ஏனெனில்’ காட்டுகிறது; ἐν τούτῳ என்பதன் சுட்டும் தன்மையை ‘இதில்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὁ λόγος
  choice: சொல்
  rationale: இங்கு λόγος என்பது தெய்வீகப் பட்டப்பெயர் அல்ல; தொடர்ந்து வரும் பொதுவான கூற்றைக் குறிக்கிறது. ‘சொல்’ சுருக்கமாகவும், ‘பழமொழி’ என்று மிகக் குறிப்பாக வரையறுக்காமலும் உள்ளது.
- source_word: ἐστὶν ἀληθινός
  choice: உண்மையாகிறது
  rationale: சூழலில் இந்தக் கூற்று தற்போதைய நிகழ்வில் மெய்ப்படுகிறது என்ற இயல்பான தமிழ்ப் பொருளைத் தருகிறது; வெறுமனே ‘உண்மையானது’ என்பதைக் காட்டிலும் ἐν τούτῳ உடன் நன்றாக இணைகிறது.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: ஒருவர் ... வேறொருவர்
  rationale: இரு வேறுபட்ட தரப்பினருக்கிடையிலான எதிர்மறை இணைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ὁ σπείρων
  choice: விதைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புவினையை இயல்பான தமிழில் வினைச்செயல் தன்மையுடன் வழங்குகிறது.
- source_word: ὁ θερίζων
  choice: அறுவடை செய்கிறவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புவினையைப் பாதுகாத்து, வேளாண்மைச் செயலை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: வேளாண்மைக் கூற்றில் விதைப்பவர் மற்றும் அறுவடை செய்கிறவர் யாரைக் குறிக்கின்றனர்
  choice: அவர்களை வசனத்திலேயே குறிப்பிட்ட நபர்கள் அல்லது குழுக்களாக அடையாளப்படுத்தாமல், பொதுவான உண்மைக் கூற்றாக வைத்தல்
  alternative: விதைப்பவரைத் தீர்க்கதரிசிகள், யோவான் அல்லது இயேசு என்றும், அறுவடை செய்கிறவரைச் சீடர்கள் என்றும் மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: கிரேக்க வசனம் இங்கு அந்த நபர்களை அடையாளப்படுத்தவில்லை; அதன் பயன்பாட்டைச் சூழல் விளக்குகிறது. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. மேற்கோள் வடிவம் கூற்றின் பழமொழித் தன்மையை வெளிப்படுத்துகிறது; ‘விதைப்பவர்/அறுவடை செய்கிறவர்’ என்ற பெயராக்கத்தைவிட கிரேக்கப் பங்கேற்புவினைகளின் செயற்பாட்டுத் தன்மையை ‘விதைக்கிறவர்/அறுவடை செய்கிறவர்’ காக்கிறது.
