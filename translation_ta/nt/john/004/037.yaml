revisions:
- from: ஏனெனில், “விதைக்கிறவர் ஒருவர், அறுவடை செய்கிறவர் வேறொருவர்” என்ற சொல் இதில் உண்மையாகிறது.[a]
  to: ஏனெனில், இதில், “விதைக்கிறவர் ஒருவர்; அறுவடை செய்கிறவர் வேறொருவர்” என்ற கூற்று உண்மையானது.[a]
  rationale: The revision renders ἐστὶν ἀληθινός as a present assertion of the saying’s truth, retains ‘இதில்’ for ἐν τούτῳ, and uses ‘கூற்று’ for λόγος in its contextual sense of a recognized saying. The agricultural contrast remains general, with no interpretive identification of the sower or reaper.
