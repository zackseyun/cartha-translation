base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: ta
  text: 'இயேசு அவளுக்குப் பதிலளித்துச் சொன்னார்: “இந்தத் தண்ணீரைக் குடிக்கும் ஒவ்வொருவரும் மீண்டும் தாகமடைவார்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் தாகப்படுவார்.”
    reason: διψήσει என்பதன் வினை வடிவத்தை இன்னும் நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதிலளித்துச்
  rationale: ஒருவரின் பேச்சுக்குப் பதிலாக இயேசு பேசுவதைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: εἶπεν
  choice: சொன்னார்
  rationale: பொதுவான கதைநடை வினைச்சொல்; ἀπεκρίθη என்பதுடன் சேர்த்து மொழிபெயர்ப்பதால் மூலத்தின் இரட்டை பேச்சுச் சூத்திரம் காக்கப்படுகிறது.
- source_word: αὐτῇ
  choice: அவளுக்கு
  rationale: சமாரியப் பெண்ணைக் குறிக்கும் மறைமுகச் செயப்படுபொருளைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: Πᾶς ὁ πίνων
  choice: குடிக்கும் ஒவ்வொருவரும்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் பொதுவான, வழக்கத்தைக் குறிக்கும் தன்மையையும் அனைவரையும் உள்ளடக்கும் பரப்பையும் இயல்பாகத் தருகிறது.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: இந்தத் தண்ணீரைக்
  rationale: பேச்சில் குறிப்பிடப்பட்டுள்ள உடல்சார்ந்த தண்ணீரை demonstrative வலிமையுடன் நேரடியாகக் குறிக்கிறது; தமிழில் ‘தண்ணீரைக் குடித்தல்’ என்பது இயல்பான தொடராகும்.
- source_word: διψήσει
  choice: தாகமடைவார்
  rationale: எதிர்காலத்தில் மீண்டும் தாகம் ஏற்படும் என்பதைச் சுருக்கமாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: தாகம் மறுபடியும் ஏற்படுவதைக் குறிக்கும் πάλιν என்பதற்கான நேரான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: ἀπεκρίθη ... καὶ εἶπεν என்ற இரட்டை பேச்சுச் சூத்திரத்தைத் தக்கவைத்தல்
  choice: ‘பதிலளித்துச் சொன்னார்’ என்று இரண்டு வினைகளையும் வெளிப்படுத்துதல்
  alternative: ‘பதிலளித்தார்’ அல்லது ‘சொன்னார்’ என்று ஒன்றாகச் சுருக்குதல்
  rationale: யோவானின் கதைநடையில் உள்ள மூலமொழிச் சூத்திரத்தின் வடிவத்தைத் தேவையின்றி ஒழிக்காமல், தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- issue: Πᾶς ὁ πίνων என்பதன் இலக்கண ஆண்பால் வடிவமும் பொதுப்பொருளும்
  choice: பாலின வேறுபாடின்றி ‘குடிக்கும் ஒவ்வொருவரும்’ என்று மொழிபெயர்த்தல்
  alternative: ஆண்களை மட்டும் குறிப்பதுபோல் மொழிபெயர்த்தல் அல்லது ‘குடிக்கிறவர் எவரோ’ என அமைத்தல்
  rationale: இங்கு இலக்கண ஆண்பால் குறிப்பிட்ட பாலினத்தை அல்ல, தண்ணீரைக் குடிக்கும் யாரையும் பொதுவாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளித்துச் சொன்னார்’ மூலத்தின் இரட்டை வினை அமைப்பைக் காக்கிறது; ‘தாகமடைவார்’ இயல்பான முதன்மை வாசகமாகவும் ‘தாகப்படுவார்’ நேரடி மாற்றாகவும் தரப்பட்டுள்ளது.
