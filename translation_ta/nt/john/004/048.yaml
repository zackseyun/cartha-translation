id: JHN.4.48
reference: John 4:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: ta
  text: எனவே இயேசு அவரிடம்[a], “நீங்கள் அடையாளங்களையும் அற்புதங்களையும் காணாவிட்டால், நம்பவே மாட்டீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காணுதல்’, ‘நம்புதல்’ என்பவற்றுக்கான கிரேக்க வினைகள் பன்மையில் உள்ளன. எனவே இயேசுவின் சொற்கள் அந்த அதிகாரியை மட்டும் அல்லாமல், பரந்த ஒரு குழுவையும் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: அப்போது
  rationale: முந்தைய வேண்டுகோளைத் தொடர்ந்து இயேசு கூறிய பதிலை இயல்பான நவீன தமிழில் இணைக்கிறது; இங்கு உள்ள தொடர்/விளைவு உறவை அளவுக்கு மீறி வலுப்படுத்துவதில்லை.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: ஒரே மனிதரிடம் இயேசு பேசுகிறார் என்ற கதைச்சூழலை மரியாதையான, இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: Ἐὰν μὴ
  choice: காணாவிட்டால்
  rationale: எதிர்மறை நிபந்தனையை தமிழில் இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: யோவான் நற்செய்தியில் செயலைத் தாண்டி அதன் பொருளைச் சுட்டும் σημεῖον என்ற சொல்லின் தனித்துவத்தைப் பாதுகாக்கிறது.
- source_word: τέρατα
  choice: அற்புதங்கள்
  rationale: வியப்பூட்டும் அசாதாரண நிகழ்வுகளைக் குறிக்கும் சொல்லை பொதுவாகப் புரியும் தமிழில் வழங்குகிறது; ‘அடையாளங்களும் அற்புதங்களும்’ என்ற இணைச்சொல்லையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἴδητε
  choice: நீங்கள் ... காணாவிட்டால்
  rationale: கிரேக்கப் பன்மை வினை வடிவத்தை ‘நீங்கள்’ மூலம் தக்கவைக்கிறது; நிபந்தனைத் தொடரில் இறந்தகால ஒருமுறைச் செயலைத் தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: οὐ μὴ πιστεύσητε
  choice: நம்பவே மாட்டீர்கள்
  rationale: οὐ μὴ என்ற வலியுறுத்தப்பட்ட மறுப்பை ‘-வே மாட்டீர்கள்’ என்ற இயல்பான தமிழ் அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: πιστεύσητε
  choice: நம்ப
  rationale: யோவானில் πιστεύω பொதுவாகக் கொண்டுள்ள நம்புதல்/சார்ந்திருத்தல் சார்ந்த பொருளை தேவையற்ற விளக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: பேசப்படுபவரின் எண் மற்றும் கூற்றின் நோக்கெல்லை
  choice: அறிமுகத்தில் ஒரே மனிதரை ‘அவரிடம்’ என்று குறிப்பிட்டு, இயேசுவின் கூற்றில் ‘நீங்கள்’ என்ற வடிவத்தைப் பயன்படுத்துதல்.
  alternative: இயேசுவின் சொற்கள் அந்த அதிகாரியை மட்டுமே குறிக்கின்றன என்று ஒருமையாக மொழிபெயர்த்தல்; அல்லது ‘நீங்களெல்லாம்’ என்று பன்மையை வெளிப்படையாக விரித்துக் கூறுதல்.
  rationale: கதைச்சூழலில் இயேசு ஒரே மனிதரிடம் பேசினாலும், ἴδητε மற்றும் πιστεύσητε ஆகிய இரு கிரேக்க வினைகளும் பன்மையில் உள்ளன. ஆகவே அந்த மனிதரைத் தாண்டிய ஒரு பரந்த குழு அல்லது மனப்பாங்கும் நோக்கில் இருக்கலாம். ‘நீங்கள்’ அந்தப் பன்மையைத் தக்கவைத்தாலும், தமிழில் அது மரியாதை ஒருமையாகவும் அமையக்கூடியதால் அடிக்குறிப்பு தேவையான தெளிவை வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘நீங்கள்’ என்பதன் தமிழ் மரியாதை-ஒருமை/பன்மை இரட்டைப் பயன்பாட்டால் மூலத்தின் பன்மை பிரதான உரையில் முழுமையாகத் தெளிவாகாததால் [a] அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
