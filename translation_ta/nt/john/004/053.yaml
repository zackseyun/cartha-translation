  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: ta
  text: ஆகவே, இயேசு அவரிடம், “உன் மகன் உயிருடன் இருக்கிறான்” என்று சொன்ன அந்த நேரத்திலேயே தன் மகன் குணமடைந்ததைத் தந்தை அறிந்துகொண்டார். அவரே நம்பினார்[a]; அவருடைய வீட்டார் அனைவரும் நம்பினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம்பினார்” என்பது இயேசுவின் வார்த்தையை நம்பியதையோ, இயேசுவின்மீது இன்னும் ஆழமான நம்பிக்கைக்கு வந்ததையோ குறிக்கலாம்; கிரேக்க வாசகம் நம்பிக்கையின் பரப்பை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: அறிந்துகொண்டார்
  rationale: வேலைக்காரர்கள் தெரிவித்த நேரமும் இயேசு சொன்ன நேரமும் ஒன்றே என்பதைத் தந்தை உணர்ந்து அறிந்துகொண்ட நிகழ்வை இறந்தகால வினை இயல்பாகக் குறிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் வேலைக்காரர்கள் கூறிய நேரத்திலிருந்து தந்தை செய்த முடிவைச் சுட்டும் தர்க்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: அதே நேரத்தில்தான்
  rationale: குறிப்பிட்ட அந்த நேரத்துடனான துல்லியமான ஒத்திசைவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தான்’ கிரேக்கத்தின் சுட்டும் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ὁ υἱός σου ζῇ
  choice: உன் மகன் உயிரோடு இருக்கிறான்
  rationale: ζῇ என்பதை எதிர்காலமாக மாற்றாமல், மகன் தற்போது உயிருடன் இருக்கும் நிலையைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐπίστευσεν
  choice: நம்பினார்கள்
  rationale: πιστεύω என்பதன் பொருளை விரிவான கோட்பாட்டு விளக்கமின்றி வைத்திருக்கிறது. கூட்டு எழுவாயான தந்தையும் வீட்டாரும் தமிழில் இயல்பாகப் பன்மை வினை பெறுகின்றனர்.
- source_word: αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη
  choice: அவரும் அவருடைய வீட்டார் அனைவரும்
  rationale: αὐτός-இன் வெளிப்படையான தனிப்பட்ட வலியுறுத்தலையும், οἰκία என்பது கட்டிடத்தை அல்ல வீட்டாரைக் குறிப்பதையும், ὅλη என்பது அனைவரையும் உள்ளடக்குவதையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தந்தையும் வீட்டாரும் ‘நம்பியது’ எதைக் குறிக்கிறது
  choice: ‘நம்பினார்கள்’ என்று மட்டும் மொழிபெயர்த்து, நம்பிக்கையின் பரப்பை அடிக்குறிப்பில் திறந்துவைத்தல்
  alternative: அவர்கள் இயேசுவின் குணமாக்கும் வார்த்தையை மட்டும் நம்பினார்கள்; அல்லது இந்நேரத்தில் இயேசுவின்மீது முழுமையான விசுவாசத்திற்கு வந்தார்கள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க வினை நம்பிக்கையின் இலக்கையோ முழு பரப்பையோ இங்கே வெளிப்படையாகக் குறிப்பிடவில்லை. யோவான் சூழலில் இயேசுவும் அவரது வார்த்தையும் உட்பொருளாக இருந்தாலும், மொழிபெயர்ப்பு அதற்கு மேலான கோட்பாட்டு முடிவைச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். நேரடி கிரேக்க அமைப்பின் பொருளைப் பாதுகாத்தபடி, தமிழில் இயல்பற்ற நீண்ட தொடர்பெயர் தொடரைத் தவிர்க்க வாக்கியம் ‘இது நடந்தது’ எனத் தெளிவாக்கப்பட்டுள்ளது. இயேசு தந்தையை நோக்கிப் பேசியதால் ‘உன்’ பயன்படுத்தப்பட்டுள்ளது; இது அவமரியாதையைக் குறிக்காது.
