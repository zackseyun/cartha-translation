  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: ta
  text: அவருடைய வார்த்தையின் காரணமாக இன்னும் மிகப் பலர் நம்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய செய்தியின் காரணமாக இன்னும் மிகப் பலர் நம்பினார்கள்.”
    reason: λόγος இங்கு இயேசு கூறிய செய்தியைக் குறிக்கவும் முடியும்; 'செய்தி' என்பது பொருளைத் தெளிவுபடுத்தும் இயல்பான மாற்று.
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: இன்னும் மிகப் பலர்
  rationale: πολλῷ என்பது πλείους என்ற ஒப்பீட்டை வலுப்படுத்துகிறது. ஆகவே முந்தைய வசனத்துடன் ஒப்பிடுகையில் எண்ணிக்கை பெரிதும் அதிகரித்ததை இந்தச் சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπίστευσαν
  choice: நம்பினார்கள்
  rationale: πιστεύω என்ற வினையின் இறந்தகாலச் செயலை நேரடியாகக் காட்டுகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ஒரு செயப்படுபொருளையோ விரிவான கோட்பாட்டு விளக்கத்தையோ சேர்க்கவில்லை.
- source_word: διὰ
  choice: காரணமாக
  rationale: வேற்றுமை உருபுடன் வரும் διά இங்கு காரணத்தைக் குறிக்கிறது; அவர்கள் நம்பியதற்குக் காரணம் அவர் கூறிய வார்த்தை என்பதைக் காட்டுகிறது.
- source_word: λόγον
  choice: வார்த்தை
  rationale: இங்கு இயேசு கூறியவற்றை இது குறிக்கிறது. 'வார்த்தை' என்பது யோவான் நற்செய்தியில் λόγος என்பதன் சொற்பயன்பாட்டு ஒலியையும் காக்கிறது; சூழலில் இயல்பாகவும் புரிகிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: உடனடிச் சூழலில் இந்தப் பதிலிப்பெயர் இயேசுவைக் குறிக்கிறது; மரியாதைமிக்க நவீனத் தமிழில் 'அவருடைய' என்பது தெளிவான இணை.
theological_decisions:
- issue: இரட்சிப்பு சார்ந்த கதைச் சூழலில் πιστεύω என்பதை மொழிபெயர்த்தல்
  choice: நம்பினார்கள்
  alternative: அவர்மேல் விசுவாசம் வைத்தார்கள்
  rationale: கிரேக்க வசனம் செயப்படுபொருளை வெளிப்படையாகச் சேர்க்காமல் அவர்கள் 'நம்பினார்கள்' என்று மட்டுமே கூறுகிறது. யாரை நம்பினார்கள் என்பதை யோவானின் சூழல் உணர்த்த அனுமதித்து, மூலத்தில் இல்லாத விரிவான கோட்பாட்டு வடிவத்தைச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. πολλῷ πλείους என்பதன் வலுப்படுத்தப்பட்ட ஒப்பீடு 'இன்னும் மிகப் பலர்' எனக் காக்கப்பட்டுள்ளது; λόγος என்பதன் யோவானிய சொல் ஒலி முதன்மை உரையில் 'வார்த்தை' எனப் பாதுகாக்கப்பட்டுள்ளது.
