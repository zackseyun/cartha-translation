  source_fidelity: 'மூலத்தின் கூறுகள் அனைத்தும் காக்கப்பட்டுள்ளன: καὶ என்பதன் தொடர்ச்சி இயல்பாகத் தமிழில் உட்பொதிந்துள்ளது; πολλῷ πλείους என்பதன் வலுப்படுத்தப்பட்ட ஒப்பீடு “இன்னும் மிகப் பலர்” எனத் தெரிவிக்கப்படுகிறது; ἐπίστευσαν என்பதற்கு மூலத்தில் இல்லாத செயப்படுபொருளைச் சேர்க்காமல் “நம்பினார்கள்” என உள்ளது; διὰ τὸν λόγον αὐτοῦ என்பதற்கு “அவருடைய வார்த்தையின் காரணமாக” என்பது காரணப் பொருளைத் துல்லியமாகத் தருகிறது.'
