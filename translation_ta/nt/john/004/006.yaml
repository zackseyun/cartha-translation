base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: ta
  text: யாக்கோபின் கிணறு அங்கே இருந்தது.[a] எனவே, பயணத்தால் களைப்படைந்திருந்த இயேசு அந்தக் கிணற்றருகே அப்படியே அமர்ந்திருந்தார்.[b] ஏறக்குறைய ஆறாம் மணி இருந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊற்று’ என்றும் மொழிபெயர்க்கலாம்; πηγή என்ற கிரேக்கச் சொல் ஊற்றையோ கிணற்றையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த விதமாக அமர்ந்திருந்தார்’ அல்லது ‘இருந்த நிலையிலேயே அமர்ந்திருந்தார்’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: யூதர்களின் பகல்நேரக் கணக்கின்படி இது ஏறக்குறைய நண்பகலைக் குறிக்கும். கிரேக்க உரை நவீன நேர மதிப்பை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: யாக்கோபின் கிணறு
  rationale: πηγή என்பது ஊற்று அல்லது கிணறு எனப் பொருள்படலாம். இச்சூழலில் தண்ணீர் மொள்ளப்படும் நிலையான இடத்தைக் குறிக்கும் பின்னணி காரணமாக ‘கிணறு’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: பயணத்தால் களைப்படைந்திருந்த
  rationale: Perfect participle பயண உழைப்பால் ஏற்பட்டுத் தொடரும் களைப்புநிலையைச் சுட்டுகிறது. ‘களைப்படைந்திருந்த’ அந்த நிலைநீடிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκαθέζετο
  choice: அமர்ந்திருந்தார்
  rationale: Imperfect வடிவத்தின் தொடர்நிலை அல்லது காட்சிவருணனைத் தன்மையை ‘அமர்ந்திருந்தார்’ வெளிப்படுத்துகிறது.
- source_word: οὕτως
  choice: அப்படியே
  rationale: சொல்லை முற்றிலும் விடாமல், இயேசு இருந்த நிலையிலேயே அல்லது அந்த விதமாக அமர்ந்திருந்தார் என்ற தெளிவுபடுத்தப்படாத நுண்பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπὶ τῇ πηγῇ
  choice: அந்தக் கிணற்றருகே
  rationale: ἐπί + dative இங்கு இடத்தைக் குறிக்கிறது; கிணற்றின் அருகில் அமர்ந்திருப்பதை நவீன தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: ஏறக்குறைய ஆறாம் மணி நேரம் ஆகியிருந்தது
  rationale: ὡς என்பதன் தோராயத்தையும் ‘ஆறாம் மணி’ என்ற மூலச் சொற்றொடரையும் தக்கவைத்து, நவீன நேரக் கணக்கை முதன்மை உரையில் முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: δὲ / οὖν
  choice: வாக்கியத் தொடர்பின் வழியாக வெளிப்படுத்தப்பட்டது
  rationale: இவை கதை நகர்வையும் விளைவுத் தொடர்பையும் குறிக்கும் மென்மையான discourse particles. தமிழில் தனித்தனி இணைப்புச் சொற்களைச் சேர்ப்பது தேவையற்ற கனத்தை உண்டாக்குவதால், வாக்கிய வரிசை மற்றும் சூழல் மூலம் தொடர்பு வெளிப்படுகிறது.
theological_decisions:
- issue: ‘ஆறாம் மணி’ என்பதற்கான நவீன நேர மதிப்பு
  choice: முதன்மை உரையில் ‘ஏறக்குறைய ஆறாம் மணி நேரம்’ என்று மூல வெளிப்பாட்டைத் தக்கவைத்தல்
  alternative: யூத பகல்நேரக் கணக்கின்படி ஏறக்குறைய நண்பகல்; ரோம நேரக் கணக்கு என்ற கருதுகோளின்படி ஏறக்குறைய மாலை 6 மணி
  rationale: கிரேக்க உரை எந்த நேரக் கணக்குமுறையைப் பயன்படுத்துகிறது என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே விவாதிக்கப்படும் யோவானிய காலக்கணக்கை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், பொதுவான விளக்கத்தை அடிக்குறிப்பில் அளிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘அப்படியே’ என்பது οὕτως-இன் தெளிவுபடுத்தப்படாத நுண்பொருளை ஓரளவு தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை சார்ந்த சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
