  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க இறந்தகால நிறைவுவினையின் முன்னிகழ்வு ‘போயிருந்தார்கள்’ எனக் காக்கப்பட்டுள்ளது; ‘உணவுப் பொருட்கள்’ என்ற சாத்தியத்தை உரை இயல்புக்காக ‘உணவு’ உள்ளடக்குகிறது.
