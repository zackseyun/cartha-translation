  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: ta
  text: ஏனெனில் அவருடைய சீடர்கள் உணவு வாங்குவதற்காக ஊருக்குப் போயிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்துக்குப் போயிருந்தார்கள்.” πόλις என்பதற்கு “ஊர்” அல்லது “நகரம்” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை γάρ அறிமுகப்படுத்துகிறது; தமிழில் ‘ஏனெனில்’ அதன் இணைப்புச் செயல்பாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: உடைமை உறவையும் μαθηταί என்பதன் யோவான் நற்செய்திக்குரிய நிலையான பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀπεληλύθεισαν
  choice: போயிருந்தார்கள்
  rationale: ἀπέρχομαι என்பதன் இறந்தகால நிறைவுவினை வடிவம், நிகழ்காட்சிக்கு முன்பே சென்றிருந்த செயலைக் குறிக்கிறது; ‘போயிருந்தார்கள்’ அந்த முன்னிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν πόλιν
  choice: ஊருக்கு
  rationale: εἰς இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது. இச்சூழலில் πόλις என்பதற்கு நவீனத் தமிழில் இயல்பான ‘ஊர்’ தேர்ந்தெடுக்கப்பட்டது; ‘நகரம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ἵνα
  choice: வாங்குவதற்காக
  rationale: ἵνα இங்கு நோக்கத்தை அறிமுகப்படுத்துகிறது; ‘-வதற்காக’ என்ற அமைப்பு அதைப் பொருள் இழப்பின்றி இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τροφὰς
  choice: உணவு
  rationale: τροφάς உணவு அல்லது உணவுப் பொருட்களைக் குறிக்கிறது; இங்கு ஒருமைத் தொகுப்புப்பெயரான ‘உணவு’ இயல்பான சமமான சொல்.
- source_word: ἀγοράσωσιν
  choice: வாங்க
  rationale: ἵνα-வுக்குப் பின் வரும் இவ்வினை நோக்கப்பட்ட செயலைக் குறிக்கிறது; ‘வாங்க’ என்பது எளிய, துல்லியமான நவீனத் தமிழ்.
