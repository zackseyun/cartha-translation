  terminology: “இயேசு,” “யோவான்,” “பரிசேயர்கள்,” “சீடராக்குதல்,” “திருமுழுக்கு” ஆகியவை நிலையான, புரிந்துகொள்ளத்தக்க சமயச் சொற்களாக உள்ளன. எந்தக் குறிப்பிட்ட பிரிவின் விளக்கத்தையும் உரைக்குள் திணிக்கவில்லை.
