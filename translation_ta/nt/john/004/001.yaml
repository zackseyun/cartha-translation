source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: ta
  text: எனவே, இயேசு யோவானைவிட அதிகமானவர்களைச் சீடராக்கி அவர்களுக்குத் திருமுழுக்குக் கொடுக்கிறார்[a] என்று பரிசேயர்கள் கேள்விப்பட்டதை அவர் அறிந்தபோது—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு யோவானைவிட அதிகமான சீடர்களை ஏற்படுத்துகிறார்; மேலும் திருமுழுக்குக் கொடுக்கிறார்.” கிரேக்கத் தொடரை, எண்ணிக்கை ஒப்பீடு சீடராக்குதலுக்கு மட்டும் பொருந்துவதாகவோ, சீடராக்குதல் மற்றும் திருமுழுக்குக் கொடுத்தல் ஆகிய இணைந்த செயலுக்குப் பொருந்துவதாகவோ வாசிக்கலாம்.
    reason: தொடரமைப்பு சார்ந்த மாற்று வாசிப்பு
lexical_decisions:
- source_word: Ὡς οὖν
  choice: எனவே, ... அறிந்தபோது
  rationale: ὡς என்பதன் காலத் தொடர்பையும் οὖν என்பதன் முடிவு அல்லது கதைத் தொடர்ச்சி உணர்வையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔγνω
  choice: அறிந்தபோது
  rationale: இங்கு இயேசு அந்தச் செய்தியை அறிந்தார் அல்லது அது அவருக்குத் தெரியவந்தது என்பதே பொருள்; தொடரும் முதன்மை வாக்கியத்திற்கான காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான வழக்கமான தமிழ் வடிவம்.
- source_word: ἤκουσαν
  choice: கேள்விப்பட்டதை
  rationale: பரிசேயர்கள் ஏற்கெனவே அந்தச் செய்தியைக் கேட்டிருந்தனர் என்ற நிகழ்வுகளின் வரிசையைத் தமிழ் சூழல் தெளிவாக்குகிறது.
- source_word: πλείονας μαθητὰς ποιεῖ
  choice: அதிகமானவர்களைச் சீடராக்கி
  rationale: தமிழில் ‘சீடர்களை உருவாக்கி’ என்பதைவிட ‘மக்களைச் சீடராக்குதல்’ இயல்பாகவும், ‘சீடர்களை உண்டாக்குதல்’ என்ற கிரேக்கச் சொல்லாக்கத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: βαπτίζει
  choice: அவர்களுக்குத் திருமுழுக்குக் கொடுக்கிறார்
  rationale: βαπτίζω என்பதற்கான தெளிவான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் திருச்சொல்லை பயன்படுத்துகிறது; பகிரப்பட்ட கருமத்தைத் தெளிவாக்க ‘அவர்களுக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἢ Ἰωάννης
  choice: யோவானைவிட
  rationale: கிரேக்க ஒப்பீட்டுக் கட்டமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவே தனிப்பட்ட முறையில் திருமுழுக்குக் கொடுத்தார் என்ற தோற்றம்
  choice: 4:1-இன் வெளிப்படையான சொற்றொடரை மாற்றாமல், இயேசு திருமுழுக்குக் கொடுக்கிறார் எனக் கூறுதல்
  alternative: 4:2-ஐ முன்கூட்டியே இணைத்து, ‘இயேசுவின் சீடர்கள் திருமுழுக்குக் கொடுக்கிறார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: அடுத்த வசனமே இயேசு தாமே திருமுழுக்குக் கொடுக்கவில்லை என்று விளக்குகிறது. அந்த விளக்கத்தை இவ்வசனத்திற்குள் முன்கூட்டியே கொண்டுவராமல், மூல உரையின் பதற்றத்தையும் கதை நகர்வையும் காக்க வேண்டும்.
- issue: ஒப்பீடு ‘சீடராக்குதல்’ என்பதற்கு மட்டும் பொருந்துகிறதா, அல்லது சீடராக்குதல் மற்றும் திருமுழுக்குக் கொடுத்தல் ஆகிய இணைந்த செயலுக்குப் பொருந்துகிறதா
  choice: முதன்மை உரையில் அதிகமானவர்களைச் சீடராக்கி அவர்களுக்குத் திருமுழுக்குக் கொடுக்கும் இணைந்த செயலோடு ஒப்பீட்டை வாசித்தல்
  alternative: ‘யோவானைவிட அதிகமான சீடர்களை ஏற்படுத்துகிறார்; மேலும் திருமுழுக்குக் கொடுக்கிறார்’ என்று, எண்ணிக்கை ஒப்பீட்டை முதற்செயலோடு மட்டும் இணைத்தல்
  rationale: πλείονας μαθητάς என்பது இணைக்கப்பட்ட ποιεῖ καὶ βαπτίζει ஆகிய வினைகளுக்குப் பகிரப்பட்ட கருமமாக இயல்பாகப் புரிகிறது; இருப்பினும் தொடரமைப்பு மற்ற வாசிப்பிற்கும் இடமளிப்பதால் அடிக்குறிப்பில் அது குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சீடராக்குதல்’ இயல்பான சமயச் சொல்வழக்கு; ‘திருமுழுக்கு’ என்பது βαπτίζω என்பதற்கான தெளிவான தமிழ் வடிவம். கிரேக்கத்தில் தொடரும் வாக்கியம் என்பதைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
