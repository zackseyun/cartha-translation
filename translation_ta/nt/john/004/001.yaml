  source_fidelity: மூல கிரேக்கத்தின் காலத் துணைவாக்கியம் (ὡς), கதைத் தொடர்ச்சி/தீர்மான உணர்வு (οὖν), பரிசேயர்கள் ஏற்கெனவே கேட்டிருந்த செய்தி, மற்றும் நிகழ்காலச் செயல்கள் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. “அதிகமானவர்களைச் சீடராக்கி அவர்களுக்குத் திருமுழுக்குக் கொடுக்கிறார்” என்பது πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει என்பதன் இயல்பான தமிழ் வெளிப்பாடாகும். 4:2-இன் விளக்கத்தை முன்கூட்டியே சேர்க்காமல் விட்டிருப்பதும் சரியானது.
