revisions:
- from: அவர் ஏற்கெனவே இறங்கிச் சென்றுகொண்டிருந்தபோது, அவருடைய பணியாளர்கள் அவரை எதிர்கொண்டு, “உம்முடைய பிள்ளை[a] உயிரோடிருக்கிறான்” என்று சொன்னார்கள்.
  to: அவர் ஏற்கெனவே கீழே இறங்கிக்கொண்டிருக்கையில், அவருடைய பணியாளர்கள் அவரைச் சந்தித்து, “உம்முடைய பிள்ளை[a] உயிரோடு இருக்கிறது” என்று சொன்னார்கள்.
  rationale: The revision preserves the ongoing descent and the servants’ report while using more natural Tamil for the meeting. It removes the masculine predicate that conflicted with the intentionally non-gender-specific “பிள்ளை,” and it makes the lexical footnote consistent with the stated alternative and the range of παῖς.
