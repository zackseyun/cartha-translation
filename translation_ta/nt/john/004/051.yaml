id: JHN.4.51
reference: John 4:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: ta
  text: அவர் ஏற்கெனவே கீழே இறங்கிக்கொண்டிருக்கையில், அவருடைய பணியாளர்கள் அவரைச் சந்தித்து, “உம்முடைய பிள்ளை[a] உயிரோடு இருக்கிறது” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகன்.” கிரேக்கச் சொல் குழந்தை, சிறுவன், மகன் அல்லது சில சூழல்களில் பணியாள் என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: சந்திப்பு நிகழ்வதற்கு முன்பே பயணம் தொடங்கி நடந்துகொண்டிருந்ததை இயல்பாகக் குறிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது கதையை மெதுவாக முன்ன நகர்த்தும் இணைப்புச்சொல்; தமிழில் காலநிலைத் தொடரே அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταβαίνοντος
  choice: இறங்கிச் சென்றுகொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த சமகாலச் செயலைக் காட்டும் நிகழ்காலப் பெயரெச்சத்தையும், கானாவிலிருந்து கீழ்நோக்கிய பயணத்தையும் வெளிப்படுத்துகிறது.
- source_word: δοῦλοι
  choice: பணியாளர்கள்
  rationale: இங்கு அதிகாரியின் வீட்டாரில் அவருக்குக் கீழ்ப்பட்டுப் பணிபுரிவோரைக் குறிக்கிறது. ‘அடிமைகள்’ சமூக நிலையை நேரடியாகக் காட்டினாலும், இச்சூழலில் நவீனத் தமிழில் ‘பணியாளர்கள்’ இயல்பாகவும் தேவையற்ற வேறுபொருளைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: ὑπήντησαν
  choice: எதிர்கொண்டு
  rationale: அவரைச் சந்திக்க எதிரே வந்தனர் என்ற வினையின் நுணுக்கத்தைச் சுருக்கமாகத் தருகிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: கிரேக்கப் பெயரெச்சச் செயலை இயல்பான தமிழ் நேர்வாக்கியமாக மாற்றுகிறது.
- source_word: παῖς
  choice: பிள்ளை
  rationale: குழந்தை, சிறுவன், மகன் அல்லது சில சூழல்களில் பணியாள் எனப் பொருள்படக்கூடிய சொல்லின் குடும்பச் சார்பை வயது அல்லது பாலினத்தை மிகையாகக் குறிக்காமல் காக்கிறது.
- source_word: ζῇ
  choice: உயிரோடிருக்கிறான்
  rationale: கிரேக்க நிகழ்காலத்தின் நேரடியான உயிர்வாழும் நிலையைப் பேச்சுக்குள் காக்கிறது; ‘குணமடைந்துவிட்டான்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: παῖς யாரைக் குறிக்கிறது
  choice: உம்முடைய பிள்ளை
  alternative: உம்முடைய மகன்; உம்முடைய பணியாள்
  rationale: யோவான் 4-ன் விரிவான சூழல் மகன் என்ற புரிதலை ஆதரித்தாலும், இவ்வசனத்தின் παῖς அதைவிடப் பரந்த பொருளுடையது. ‘பிள்ளை’ குடும்ப உறவை இயல்பாகக் காத்து, சொல்லில் இல்லாத அளவுக்கு பாலினத்தையோ வயதையோ குறிப்பதில்லை; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. பணியாளர்கள் அதிகாரியிடம் நேரடியாகப் பேசுவதால் ‘உம்முடைய’ என்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டது; ζῇ என்பதன் நிகழ்காலம் நேரடிப் பேச்சில் காக்கப்பட்டது.
