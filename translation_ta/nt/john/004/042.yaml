source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: ta
  text: அவர்கள் அந்தப் பெண்ணிடம், “இனி நீங்கள் சொன்னதன் காரணமாக நாங்கள் நம்பவில்லை; ஏனெனில் நாங்களே கேட்டு, இவரே உண்மையிலேயே உலகத்தின் இரட்சகர் என்று அறிந்திருக்கிறோம்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: அவர்கள் அந்தப் பெண்ணிடம் ... என்று சொல்லிக்கொண்டிருந்தார்கள்
  rationale: பெண்ணை மறைமுகச் செயப்படுபொருளாகக் காட்டுகிறது; இறந்தகால imperfect வினையின் தொடர்ச்சி அல்லது மீள்நிகழ்வை ‘சொல்லிக்கொண்டிருந்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது. τε-யின் மெலிந்த இணைப்புப் பொருள் தமிழில் தனியே சொல்லப்படவில்லை.
- source_word: Οὐκέτι
  choice: இனி ... இல்லை
  rationale: முன்பு இருந்த நம்பிக்கையின் அடிப்படை இப்போது மாறிவிட்டதைத் தெரிவிக்கும் கால மறுப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: διὰ τὴν σὴν λαλιὰν
  choice: நீ சொன்னதை அடிப்படையாகக் கொண்டு
  rationale: διά + accusative காரணம் அல்லது அடிப்படையைக் குறிக்கிறது; λαλιά இங்கு பெண்ணின் வாய்மொழிச் சாட்சியின் உள்ளடக்கத்தைக் குறிக்கிறது. ‘பேச்சு’ என்பதைவிட இவ்வடிவம் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: πιστεύομεν
  choice: நாங்கள் நம்பவில்லை
  rationale: தற்போதைய நம்பிக்கை நிலையை இயல்பான தமிழ் நிகழ்காலத்தில் தருகிறது; மறுப்பு Οὐκέτι-யுடன் இணைகிறது.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: நாங்களே கேட்டிருக்கிறோம்
  rationale: αὐτοί தரும் வலியுறுத்தலை ‘நாங்களே’ காக்கிறது; perfect வினையின் முடிந்த செயலும் தற்போதைய விளைவும் ‘கேட்டிருக்கிறோம்’ என்பதில் வெளிப்படுகின்றன. γάρ-இன் விளக்கத் தொடர்பு வாக்கிய அமைப்பால் தெளிவாகிறது.
- source_word: καὶ οἴδαμεν
  choice: என்று அறிந்திருக்கிறோம்
  rationale: οἶδα குறிக்கும் தற்போதைய உறுதியான அறிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὗτός
  choice: இவரே
  rationale: இயேசுவைச் சுட்டும் demonstrative-ன் வலியுறுத்தலை ‘இவரே’ இயல்பாகத் தக்கவைக்கிறது; வெறும் ‘அவர்’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: ἀληθῶς
  choice: உண்மையாக
  rationale: அறிக்கையின் உண்மைத் தன்மையை வலியுறுத்தும் மரியாதையான, நேரான இணைச்சொல்.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: உலகத்தின் மீட்பர்
  rationale: σωτήρ என்பதன் மீட்பு சார்ந்த பொருளையும், κόσμος என்பதன் விரிந்த உலகளாவிய குறிப்பையும் கூடுதல் விளக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: சமாரியர்களின் அறிக்கையில் ‘உலகம்’ என்பதன் பரப்பு
  choice: உலகத்தின் மீட்பர்
  alternative: எல்லா மக்களுடைய மீட்பர்; உலகிலுள்ள தேர்ந்தெடுக்கப்பட்டோரின் மீட்பர்
  rationale: κόσμος என்ற மூலச்சொல்லின் விரிந்த குறிப்பை அப்படியே வைத்திருக்கிறது; அதை ஒரு குறிப்பிட்ட குழுவாகக் குறுக்கவோ, ‘எல்லா மனிதர்களும்’ என்று விளக்கி விரிவாக்கவோ இல்லை.
- issue: οὗτός என்பதன் கிறிஸ்துவைப் பற்றிய வலியுறுத்தல்
  choice: இவரே
  alternative: அவர்தான்; இந்த மனிதரே
  rationale: இயேசுவை மரியாதையுடன் சுட்டிக்காட்டி, அவரே மீட்பர் என்ற வலியுறுத்தலைக் காக்கிறது; மூலத்தில் இல்லாத இழிவான அல்லது மிக விளக்கமான நுணுக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மூலத்தின் imperfect மற்றும் perfect அம்சங்கள் இயன்ற அளவு பாதுகாக்கப்பட்டுள்ளன. பதிப்பிக்க வேண்டிய வசனத்தில் அடிக்குறிப்புகள் தேவையில்லை.
