revisions:
- from: அவர்கள் அந்தப் பெண்ணிடம், “இனி நீ சொன்னதை அடிப்படையாகக் கொண்டு நாங்கள் நம்பவில்லை; நாங்களே கேட்டிருக்கிறோம். இவரே உண்மையாக உலகத்தின் மீட்பர் என்று அறிந்திருக்கிறோம்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  to: அவர்கள் அந்தப் பெண்ணிடம், “இனி நீங்கள் சொன்னதன் காரணமாக நாங்கள் நம்பவில்லை; ஏனெனில் நாங்களே கேட்டு, இவரே உண்மையிலேயே உலகத்தின் இரட்சகர் என்று அறிந்திருக்கிறோம்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  rationale: The revision retains the imperfect force of ἔλεγον with சொல்லிக்கொண்டிருந்தார்கள், the temporal negation of οὐκέτι with இனி, the intensive αὐτοί with நாங்களே, and the perfect ἀκηκόαμεν with கேட்டு/அறிந்திருக்கிறோம். It restores the explicit explanatory force of γάρ, uses an idiomatic emphatic equivalent for ἀληθῶς, and employs the established biblical title இரட்சகர் for σωτήρ. No footnotes are required.
  reviewer_model: gpt-5.6-terra
