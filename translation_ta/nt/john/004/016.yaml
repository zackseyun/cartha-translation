  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: ta
  text: அவர் அவளிடம், “போய் உன் கணவனை அழை; பிறகு இங்கே வா” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவளிடம் கூறுகிறார்.” கிரேக்கத்தில் இங்கு கதையாடல் நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது; இயல்பான தமிழ் நடையில் அது இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: என்றார்
  rationale: கிரேக்கக் கதையாடலில் நிகழ்கால வடிவம் வரலாற்று நிகழ்காலமாகப் பயன்படுத்தப்பட்டுள்ளது; இயல்பான தமிழ் கதையாடலில் இதனை இறந்தகாலமாக வழங்குவது பொருத்தமானது.
- source_word: αὐτῇ
  choice: அவளிடம்
  rationale: பேச்சின் மறைமுகச் செயப்படுபொருளைக் குறிக்கும் பெண்பால் ஒருமை வேற்றுமை வடிவம்; தமிழில் ‘அவளிடம்’ இயல்பானது.
- source_word: Ὕπαγε
  choice: நீ போய்
  rationale: புறப்பட்டுச் சென்று அடுத்த செயலைச் செய்யும்படி கூறும் கட்டளை. தொடர்வினை அமைப்பில் ‘போய்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: φώνησον
  choice: அழைத்துக்கொண்டு
  rationale: φωνέω இச்சூழலில் ஒருவரை அழைப்பது அல்லது வரவழைப்பது என்று பொருள். பின்னர் ‘இங்கே வா’ என்பதால், கணவனைத் தன்னுடன் அழைத்து வருதல் சூழலில் உட்பொருளாகிறது; தமிழில் ‘அழைத்துக்கொண்டு வா’ இயல்பான கட்டளைத் தொடர்.
- source_word: τὸν ἄνδρα σου
  choice: உன் கணவனை
  rationale: ἀνήρ என்பதற்கு ‘ஆண்/மனிதன்’ அல்லது ‘கணவன்’ என்று பொருள் வரலாம்; உடைமைச் சுட்டும் அடுத்த வசனத்தின் மணவாழ்க்கைச் சூழலும் இங்கு ‘கணவன்’ என்பதைத் தெளிவாக்குகின்றன.
- source_word: καὶ
  choice: —
  rationale: கிரேக்கத்தில் இரண்டு கட்டளைகளை இணைக்கும் καὶ, தமிழில் ‘போய்… அழைத்துக்கொண்டு… வா’ என்ற இயல்பான தொடர்வினை அமைப்பால் வெளிப்படுகிறது; தனியே ‘மற்றும்’ சேர்ப்பது இயல்பற்றதாகும்.
- source_word: ἐλθὲ
  choice: வா
  rationale: இரண்டாம் நபர் ஒருமைக் கட்டளை; இயேசு இருக்கும் இடத்தை நோக்கி வரும்படி கூறுவதால் ‘வா’ நேரடியான இணை.
- source_word: ἐνθάδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் வினையடை; ‘இங்கே’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
