translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் விதத்திலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான உரையாடலை ‘பேசிக்கொண்டிருந்தார்கள்’ என்பதும், இயேசுவைக் குறிக்கும் மரியாதை வடிவத்தை ‘அவருக்கு’ என்பதும் பாதுகாக்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய கேள்விக்குப் பின் வைக்கப்பட்டுள்ளது.
