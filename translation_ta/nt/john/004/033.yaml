  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: ta
  text: ஆகவே, சீடர்கள் ஒருவரோடு ஒருவர், “யாராவது அவருக்குச் சாப்பிட ஏதாவது கொண்டுவந்திருக்க முடியுமா?” என்று பேசிக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரும் அவருக்குச் சாப்பிட ஏதாவது கொண்டுவந்திருக்க மாட்டார்களே?” கிரேக்கத்தில் μή கொண்டு தொடங்கும் இக்கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம், அந்த நேரத்தில் தொடர்ந்து நடந்த உரையாடலைக் காட்டுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் இயேசு கூறியதற்கான சீடர்களின் எதிர்வினையையும் தர்க்கத் தொடர்பையும் குறிக்கிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: யோவான் நற்செய்தியில் μαθηταί என்பதற்கான நிலையான, சூழலுக்குப் பொருத்தமான தமிழ் சொல்.
- source_word: πρὸς ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: குழுவினரிடையே நிகழ்ந்த பரஸ்பர உரையாடலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Μή τις
  choice: யாராவது ... கொண்டுவந்தார்களா?
  rationale: தமிழில் இயல்பான கேள்வி வடிவத்தைப் பயன்படுத்துகிறது; μή காரணமாக எதிர்மறை பதில் எதிர்பார்க்கப்படுவது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἤνεγκεν
  choice: கொண்டுவந்தார்களா
  rationale: இங்கு இயேசுவிடம் உணவைக் கொண்டு வருதல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: இயேசுவைக் குறிக்கும் மறைமுகச் செயப்படுபொருளை மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: φαγεῖν
  choice: சாப்பிட ஏதாவது
  rationale: ‘சாப்பிடுவதற்கு’ என்ற நோக்கப் பொருளை இயல்பான பேச்சுத் தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத பொருள் தமிழில் வாக்கிய நிறைவுக்காக மட்டும் சேர்க்கப்படுகிறது.
