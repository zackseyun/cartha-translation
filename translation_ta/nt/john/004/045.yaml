  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: ta
  text: ஆகவே, அவர் கலிலேயாவுக்கு வந்தபோது, கலிலேயர்கள் அவரை வரவேற்றார்கள்[a]. ஏனெனில், எருசலேமில் பண்டிகையின்போது அவர் செய்த அனைத்தையும் அவர்கள் பார்த்திருந்தார்கள்; அவர்களும் அந்தப் பண்டிகைக்குச் சென்றிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை ஏற்றுக்கொண்டார்கள்.” கிரேக்க வினைச்சொல் ஏற்றுக்கொள்வதையோ வரவேற்பதையோ குறிக்கலாம்; இங்கு சூழல் சாதகமான வரவேற்பைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பண்டிகை” என்பது ஒரு சமய விழாவைக் குறிக்கிறது; சுற்றியுள்ள சூழலின்படி, எருசலேமில் கொண்டாடப்பட்ட யாத்திரைப் பண்டிகை இங்கு கருத்தில் இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ஆகவே, ... வந்தபோது
  rationale: οὖν என்பதன் கதைத் தொடர்ச்சி மற்றும் முந்தைய நிகழ்வுடன் உள்ள தொடர்பை ‘ஆகவே’ இயல்பாக வெளிப்படுத்துகிறது; ὅτε என்பதற்கு ‘வந்தபோது’ பொருந்துகிறது.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: அவர் கலிலேயாவுக்கு வந்தபோது
  rationale: εἰς குறிக்கும் ஒரு பகுதிக்குள் செல்லும் திசையை, நவீன தமிழில் இயல்பான ‘கலிலேயாவுக்கு வந்தார்’ என்ற அமைப்பு தருகிறது.
- source_word: ἐδέξαντο αὐτὸν
  choice: அவரை வரவேற்றார்கள்
  rationale: δέχομαι இங்கு வெறுமனே ஏற்றுக்கொள்வதைவிட சாதகமான வரவேற்பைக் குறிக்கிறது; சூழலுக்கேற்ற சமூகப் பொருளை ‘வரவேற்றார்கள்’ தெளிவாகத் தருகிறது.
- source_word: οἱ Γαλιλαῖοι
  choice: கலிலேயர்கள்
  rationale: கலிலேயா பகுதியைச் சேர்ந்த மக்களைக் குறிக்கும் சுருக்கமான, இயல்பான இன-புவியியல் பெயர்.
- source_word: πάντα ἑωρακότες ὅσα ἐποίησεν
  choice: அவர் செய்த அனைத்தையும் அவர்கள் பார்த்திருந்தார்கள்
  rationale: முன்னரே நிகழ்ந்து, இப்போதைய வரவேற்புக்குப் பின்னணியாக நிற்கும் பார்வையை perfect participle குறிக்கிறது; ‘பார்த்திருந்தார்கள்’ அந்தக் காலத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ
  choice: எருசலேமில் பண்டிகையின்போது
  rationale: இடத்தையும் பண்டிகைக் காலச் சூழலையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: καὶ αὐτοὶ γὰρ
  choice: ஏனெனில் ... அவர்களும்
  rationale: γάρ தரும் விளக்கத்தைக் ‘ஏனெனில்’ என்றும், αὐτοὶ καὶ தரும் உட்படுத்தல்/வலியுறுத்தலை ‘அவர்களும்’ என்றும் பாதுகாக்கிறது.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: அந்தப் பண்டிகைக்குச் சென்றிருந்தார்கள்
  rationale: எருசலேமில் நடந்த முந்தைய பண்டிகைப் பங்கேற்பைத் தமிழில் இயல்பாகவும் காலவரிசை தெளிவாகவும் தெரிவிக்கிறது.
