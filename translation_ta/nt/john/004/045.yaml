translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் விளக்கத் தொடர்பு ‘ஏனெனில்’ மூலம் தெளிவாக்கப்பட்டுள்ளது; நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
