source:
  edition: SBLGNT
  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: ta
  text: ஏனெனில், உனக்கு ஐந்து கணவர்கள் இருந்தார்கள்[a]; இப்போது உனக்கிருப்பவர் உன் கணவர் அல்ல. இதில் நீ உண்மையையே சொன்னாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக: “உனக்கு ஐந்து ஆண்கள் இருந்தார்கள்; இப்போது உனக்கிருப்பவர் உன் ஆண்/கணவர் அல்ல.” கிரேக்க ἀνήρ என்ற சொல் ‘ஆண்’ அல்லது ‘கணவர்’ என்று பொருள்படலாம்; இங்கு சூழல் ‘கணவர்’ என்ற பொருளை ஆதரிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε
  choice: ஐந்து
  rationale: ἄνδρας என்பதைக் குறிப்பிடும் நேரடியான எண்ணுப்பெயர்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: அவள் உண்மையாகச் சொன்னதாக இயேசு கூறியதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἄνδρας
  choice: கணவர்கள்
  rationale: ἀνήρ என்பதற்கு ‘ஆண்’ என்றும் ‘கணவர்’ என்றும் பொருள் வரலாம்; ஆனால் முந்தைய திருமண உறவுகளையும் தற்போதைய திருமணமற்ற உறவையும் வேறுபடுத்தும் சூழலில் ‘கணவர்கள்’ என்பதே இயல்பான பொருள்.
- source_word: ἔσχες
  choice: உனக்கு ... இருந்தார்கள்
  rationale: இறந்தகால திருமண வரலாற்றைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: தற்போதைய நிலையைச் சுட்டும் எளிய கால வினையடை.
- source_word: ὃν ἔχεις
  choice: உன்னுடன் இருப்பவர்
  rationale: சொல்லுக்குச் சொல் ‘நீ கொண்டிருப்பவர்’ என்பது தமிழில் உடைமைத் தொனியுடன் இயற்கையற்றதாக இருக்கும்; இங்கு குறிக்கப்படும் தற்போதைய உறவை ‘உன்னுடன் இருப்பவர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: உன் கணவர் அல்ல
  rationale: σου உடன் வரும் ἀνήρ திருமண உறவைக் குறிக்கிறது; முந்தைய ‘கணவர்கள்’ என்பதுடனான முரண்பாட்டையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: இதை நீ உண்மையாகவே சொன்னாய்
  rationale: τοῦτο என்பதை ‘இதை’ என்றும், ἀληθὲς என்பதன் உண்மைத்தன்மையை வினைசார்ந்த முறையில் ‘உண்மையாகவே’ என்றும் வழங்கி, கிரேக்கச் சொற்றொடரின் அமைப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ἀνήρ என்ற சொல்லின் இரு இடங்களிலுமான பொருள்
  choice: முதல் இடத்தில் ‘கணவர்கள்’ என்றும் இரண்டாவது இடத்தில் ‘கணவர்’ என்றும் மொழிபெயர்த்தல்.
  alternative: இரண்டையும் இன்னும் சொல்லுக்குச் சொல்லாக ‘ஆண்கள்/ஆண்’ என்று மொழிபெயர்த்தல்.
  rationale: உடனடி சூழல் அந்தப் பெண்ணின் திருமண வரலாற்றையும் தற்போது அவளுடன் இருப்பவர் அவளுடைய கணவர் அல்ல என்பதையும் எடுத்துரைக்கிறது. ஆகவே ‘கணவர்’ என்ற பொருள் சூழலால் ஆதரிக்கப்படுகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் இருமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உன்னுடன் இருப்பவர்’ என்பது ὃν ἔχεις என்பதன் உறவுசார் பொருளை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் நேரடியான ‘கொண்டிருத்தல்’ உருவகம் அடிக்குறிப்பில் ஓரளவு பிரதிபலிக்கப்படுகிறது.
