  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: ta
  text: அறுவடை செய்கிறவர் கூலியை[a]ப் பெறுகிறார்; நித்திய வாழ்வுக்காக[b]க் கனியைச் சேகரிக்கிறார்; விதைக்கிறவரும் அறுவடை செய்கிறவரும் ஒன்றாக மகிழும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெகுமதி.” கிரேக்கச் சொல் உழைப்புக்கான கூலியையோ கைம்மாறையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நித்திய வாழ்வை அடையும்படி.” இந்தச் சொற்றொடர் இலக்கையோ விளைவையோ குறிக்கலாம்.
    reason: lexical_alternative
