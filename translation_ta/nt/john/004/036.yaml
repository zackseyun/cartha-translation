theological_decisions:
- issue: ἵνα கூறைத் தெளிவான நோக்கமாகவா அல்லது விளைவாகவா மொழிபெயர்ப்பது
  choice: ‘இவ்வாறு ... மகிழ்கிறார்கள்’ என்று நோக்கம் மற்றும் விளைவு இரண்டுக்கும் இடமளித்தல்
  alternative: ‘... ஒன்றாக மகிழும்படியாக’
  rationale: ἵνα பொதுவாக நோக்கத்தைக் குறித்தாலும் இச்சூழலில் விளைவு நுணுக்கமும் இருக்கலாம்; முதன்மை உரை ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் இயல்பான தமிழை வழங்குகிறது.
- issue: வசனத்தின் தொடக்கத்தில் ‘ஏற்கெனவே’ என்பதைச் சேர்ப்பது
  choice: சேர்க்கவில்லை
  alternative: ‘ஏற்கெனவே அறுவடை செய்கிறவர்...’
  rationale: உடனடியான சூழல் அறுவடை இப்போதே நடைபெறுவதை வலியுறுத்தினாலும், இக்கூற்றில் அதற்கெனத் தனியான கிரேக்கச் சொல் இல்லை; எனவே விளக்கச் சேர்க்கை தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கூலி’ அறுவடைத் தொழில் உருவகத்தைத் தெளிவாக வைத்திருக்கிறது; ‘நித்திய வாழ்வு’ பரவலாகப் புரிந்துகொள்ளப்படும் சொற்றொடராகப் பயன்படுத்தப்பட்டுள்ளது. விதைப்பவர்–அறுவடை செய்பவர் என்ற இணைநிலை வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
