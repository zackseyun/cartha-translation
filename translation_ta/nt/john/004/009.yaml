source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: ta
  text: அதற்கு அந்தச் சமாரியப் பெண் அவரிடம், “நீர் யூதராய் இருக்க, சமாரியப் பெண்ணான என்னிடம் குடிக்கத் தண்ணீர் கேட்பது எப்படி?” என்று கேட்டாள். (ஏனெனில் யூதர்கள் சமாரியர்களோடு பழகுவதில்லை.[a])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்கள் சமாரியர்களோடு எந்தத் தொடர்பும் வைத்துக்கொள்வதில்லை.” இச்சொல், குடிக்கும் பாத்திரங்கள் போன்றவற்றை அவர்கள் பொதுவாகப் பகிர்ந்து பயன்படுத்துவதில்லை என்ற குறிப்பான பொருளையும் கொண்டிருக்கலாம்.
    reason: συγχρῶνται என்பதற்குள்ள பொதுவான சமூகத் தொடர்பு மற்றும் பொருட்களைப் பகிர்ந்து பயன்படுத்துதல் ஆகிய இரு சாத்தியப் பொருள்களையும் பேணுதல்.
lexical_decisions:
- source_word: λέγει οὖν
  choice: அப்போது ... கேட்டாள்
  rationale: οὖν இங்கு கதை நகர்வைக் குறிக்கிறது; ‘அப்போது’ இயல்பான தமிழில் அந்தத் தொடர்பைப் பேணுகிறது. நேரடிக் கேள்வியைத் தொடர்ந்து வருவதால் λέγει என்பதற்கு ‘கேட்டாள்’ என்பது சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: அந்தச் சமாரியப் பெண்
  rationale: மீண்டும் வரும் கிரேக்கச் சுட்டுரை குறிப்பிட்ட அந்தப் பெண்ணை அடையாளப்படுத்துகிறது; ‘அந்தச் சமாரியப் பெண்’ பாலினத்தையும் சமூக அடையாளத்தையும் இயல்பாகப் பேணுகிறது.
- source_word: Πῶς
  choice: எப்படி?
  rationale: சமூக வழக்கத்திற்கு மாறான கோரிக்கையைப் பற்றிய வியப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘ஏன்’ என்று காரணக் கேள்வியாக மட்டும் சுருக்கவில்லை.
- source_word: Ἰουδαῖος ὢν
  choice: ஒரு யூதராக இருந்தும்
  rationale: இங்கு யூதர்–சமாரியர் சமூக, சமய அடையாளங்களின் வேறுபாடே முன்னிலையாகிறது. ‘இருந்தும்’ பேச்சாளரின் வியப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: என்னிடம் குடிக்கத் தண்ணீர் கேட்பது
  rationale: குடிப்பதற்கான கோரிக்கையைத் தெளிவாக்குகிறது; முந்தைய வசனத்தில் கிணற்றுத் தண்ணீர் சூழல் இருப்பதால் தமிழில் ‘தண்ணீர்’ இயல்பான வெளிப்பாடு.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: சமாரியப் பெண்ணான என்னிடம்
  rationale: முதல் நபர் குறிப்பையும் அவளுடைய பாலினம் மற்றும் சமூக அடையாளத்தையும் பேணி, வியப்பிற்கான பின்னணியை இயல்பான தமிழில் தருகிறது.
- source_word: συγχρῶνται
  choice: பழகுவதில்லை
  rationale: சொல் பொதுவான சமூக உறவையும், பொருட்களைப் பகிர்ந்து பயன்படுத்துதல் என்ற குறுகிய நுண்பொருளையும் கொண்டிருக்கலாம். முதன்மை உரையில் பரந்த சமூகப் பிரிவினையை இயல்பாகக் காட்டி, குறுகிய சாத்தியத்தை அடிக்குறிப்பில் பேணுகிறது.
theological_decisions:
- issue: Ἰουδαῖος என்பதன் யோவான் நற்செய்திசார் பொருள்
  choice: யூதர்
  alternative: யூதேயர்
  rationale: இவ்வசனத்தில் நிலப்பகுதி சார்ந்த அடையாளத்தைவிட யூதர்–சமாரியர் சமூக, சமயக் குழுக்களின் வேறுபாடே கருத்தாக உள்ளது.
- issue: συγχρῶνται என்பதன் பொருள் வரம்பு
  choice: பொதுவாகப் பழகுதல் அல்லது தொடர்புகொள்ளுதல்
  alternative: பாத்திரங்கள் போன்ற பொருட்களைப் பகிர்ந்து பயன்படுத்துதல்
  rationale: விளக்க வாக்கியம் இரு சமூகங்களுக்கிடையேயான பரந்த ஒதுக்கத்தைச் சுட்டுவது இயல்பானது; ஆனால் குடிக்கும் பாத்திரத்தைப் பகிர்வது என்ற உடனடிச் சூழலுக்குரிய குறுகிய பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமை ‘நீர்’ இயேசுவை நோக்கிய நேரடிப் பேச்சில் இயல்பாக அமைக்கப்பட்டுள்ளது. ஆசிரியரின் விளக்கக் குறிப்பு அடைப்புக்குறிக்குள் வைக்கப்பட்டுள்ளது.
