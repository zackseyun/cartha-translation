id: JHN.4.35
reference: John 4:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: ta
  text: '“‘அறுவடை வர இன்னும் நான்கு மாதங்கள் இருக்கின்றன’ என்று நீங்கள் சொல்வதில்லையா? இதோ, நான் உங்களுக்குச் சொல்கிறேன்: உங்கள் கண்களை உயர்த்தி, வயல்களைப் பாருங்கள்; அவை அறுவடைக்காக ஏற்கெனவே வெண்மையாக இருக்கின்றன.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: என்று நீங்கள் சொல்வதில்லையா?
  rationale: எதிர்மறைக் கேள்வியின் இயல்பான தமிழ்நடையைப் பேணுகிறது; ὑμεῖς என்பதன் வலியுறுத்தல் ‘நீங்கள்’ என்பதில் போதுமான அளவு வெளிப்படுகிறது.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: இன்னும் நான்கு மாதங்கள் இருக்கின்றன
  rationale: அறுவடைக்கு முன் மீதமுள்ள காலத்தை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: அறுவடை வர
  rationale: மேற்கோள் வாக்கியத்துக்குள் தமிழில் இயல்பான காலத் தொடர்பை அளிக்கிறது; அறுவடை இன்னும் வரவிருப்பதையும் தக்கவைக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியைச் சுருக்கமாகவும் கண்ணியமாகவும் பிரதிபலிக்கிறது.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: உங்கள் கண்களை உயர்த்தி
  rationale: ‘மேலே பாருங்கள்’ என்று சுருக்காமல், மூலத்தின் உயிரோட்டமான சொல்லோவியத்தைப் பேணுகிறது.
- source_word: θεάσασθε
  choice: பாருங்கள்
  rationale: கவனமாக நோக்குமாறு அழைக்கும் கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: τὰς χώρας
  choice: வயல்களை
  rationale: அறுவடைச் சூழலில் χώρας என்பது பயிரிடப்பட்ட வயல்களைக் குறிப்பதே இயல்பானது.
- source_word: λευκαί εἰσιν
  choice: வெண்மையாக இருக்கின்றன
  rationale: ‘முற்றியிருக்கின்றன’ என்று விளக்கமாக மாற்றாமல், மூலத்தில் உள்ள காட்சிப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: πρὸς θερισμόν
  choice: அறுவடைக்காக
  rationale: அறுவடை உருவகத்தைச் சுருக்கமாகப் பேணுகிறது; ஆயத்தநிலையைத் தனியே உரையில் சேர்க்கவில்லை.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: நான்கு மாதங்கள் காத்திருப்பது பற்றிய சொல்லுக்கு மாறாக, அறுவடை நிலை இப்போதே வந்துவிட்டது என்ற உச்சக்கட்ட வலியுறுத்தலைத் தருகிறது.
theological_decisions:
- issue: அறுவடைச் சொல்லை நேரடியான வேளாண் காட்சியாகவா அல்லது மக்களைச் சேகரிக்கும் ஆன்மீக உருவகமாகவா மொழிபெயர்ப்பது
  choice: வேளாண் உருவகத்தை முதன்மை உரையில் அப்படியே பேணுதல்
  alternative: ‘மக்கள் சேகரிக்கப்பட ஆயத்தமாக உள்ளனர்’ என்று பொருளை வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழலில் பணி மற்றும் மக்களின் ஆயத்தநிலை குறிக்கப்படலாம்; ஆனால் கிரேக்க உரை அறுவடை உருவகத்தையே பயன்படுத்துவதால், அதன் பொருளை மொழிபெயர்ப்பில் வெளிப்படையாகத் தீர்மானிக்காமல் பதற்றத்தையும் உருவகத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன, பொதுத் தரத் தமிழ்; வாசிக்க எளிதானதாய் இருந்தாலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. ‘இதோ’, ‘கண்களை உயர்த்தி’ போன்ற மூலப் படிமங்கள் இயல்பான அளவில் பேணப்பட்டுள்ளன.
