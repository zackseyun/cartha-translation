  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: ta
  text: அந்த ஊரைச் சேர்ந்த சமாரியர்களில் பலர், “நான் செய்த எல்லாவற்றையும் அவர் என்னிடம் சொன்னார்” என்று சாட்சி சொல்லிக்கொண்டிருந்த அந்தப் பெண்ணின் செய்தியினால்[a] அவர்மேல் நம்பிக்கை வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் பெண்ணின் வார்த்தையினால்.” λόγος என்ற கிரேக்கச் சொல் “வார்த்தை,” “செய்தி,” அல்லது “அறிக்கை” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: அந்த ஊரைச் சேர்ந்த
  rationale: ἐκ குறிக்கும் தோற்ற இடத்தை இயல்பான தமிழில் ‘சேர்ந்த’ என வெளிப்படுத்துகிறது. இச்சமாரியக் குடியிருப்புக்கு πόλις என்பதை ‘ஊர்’ என மொழிபெயர்ப்பது நவீன தமிழில் இயல்பாக உள்ளது; δέ இங்கு மென்மையான தொடரிணைப்பு என்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: சமாரியர்களில் பலர்
  rationale: பகுதிப்பொருள் தரும் மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  rationale: εἰς உடன் வரும் πιστεύω, ஒருவரை நோக்கிய தனிப்பட்ட நம்பிக்கையைச் சுட்டுகிறது. ‘அவரை நம்பினார்கள்’ என்பதைக் காட்டிலும் இத்தொடர் அந்த திசைநோக்கிய உறவுப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: διὰ τὸν λόγον τῆς γυναικός
  choice: அந்தப் பெண்ணின் செய்தியினால்
  rationale: διά காரணத்தையும் λόγος இங்கு பெண் கூறிய செய்தி அல்லது சாட்சியையும் குறிக்கிறது. ‘செய்தியினால்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘வார்த்தையினால்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μαρτυρούσης
  choice: சாட்சி சொல்லிக்கொண்டிருந்த
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான செயற்பாட்டை ‘சொல்லிக்கொண்டிருந்த’ காக்கிறது; μαρτυρέω என்பதின் சாட்சிப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: நான் செய்த எல்லாவற்றையும் அவர் என்னிடம் சொன்னார்
  rationale: λέγω உடன் வரும் மறைமுக வேற்றுமையை ‘என்னிடம் சொன்னார்’ எனவும், அஓரிஸ்ட் ἐποίησα-வை சூழலுக்கேற்ற எளிய இறந்தகாலமான ‘செய்த’ எனவும் வழங்குகிறது.
theological_decisions:
- issue: யோவான் நூலில் πιστεύω εἰς என்பதன் தன்மை
  choice: அவர்மேல் நம்பிக்கை வைத்தார்கள்
  alternative: அவரை நம்பினார்கள்
  rationale: இவ்வசனம் இயேசுவை நோக்கிய உண்மையான நம்பிக்கையை அறிவிக்கிறது; ஆனால் அதற்கு அப்பாற்பட்ட ஒரு குறிப்பிட்ட கோட்பாட்டு வகையை மொழிபெயர்ப்பில் சேர்க்கவில்லை. திசைநோக்கிய உறவுப்பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சமாரியர்களில் பலர்’ பகுதிப்பொருளையும், ‘சாட்சி சொல்லிக்கொண்டிருந்த’ நிகழ்ந்துகொண்டிருந்த சாட்சிச் செயலையும் காக்கின்றன. அடிக்குறி [a] அது விளக்கும் ‘செய்தியினால்’ என்பதன் உடனேயே வைக்கப்பட்டுள்ளது.
