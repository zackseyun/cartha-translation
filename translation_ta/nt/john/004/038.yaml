source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: ta
  text: நீங்கள் உழைக்காததை அறுவடை செய்ய நான் உங்களை அனுப்பினேன்[a]. மற்றவர்கள் உழைத்திருக்கிறார்கள்; நீங்களோ அவர்களுடைய உழைப்புக்குள் நுழைந்திருக்கிறீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறுக்கும்படி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய உழைப்பின் பயனில் பங்குபெற்றிருக்கிறீர்கள்’ அல்லது ‘அவர்களுடைய பணியில் பங்குகொண்டிருக்கிறீர்கள்.’ கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘அவர்களுடைய உழைப்புக்குள் நுழைந்திருக்கிறீர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: அனுப்பினேன்
  rationale: இறந்தகால வினை வடிவத்தை இயல்பாகக் காட்டுகிறது; தேவையின்றி ‘பணித்தேன்’ என்று விரிவுபடுத்தாமல் அனுப்புதலின் பொருளைப் பாதுகாக்கிறது.
- source_word: θερίζειν
  choice: அறுவடை செய்ய
  rationale: சூழலில் தொடரும் வேளாண்மை உருவகத்தை நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: நீங்கள் உழைக்காததை
  rationale: ὃ என்பதன் பொருளை ‘அதை’ என்ற ஒருமைப் பொதுப்பெயரால் இயல்பாகத் தருவதோடு, மூலத்தில் இல்லாத ‘அதற்காக’ என்பதைச் சேர்க்காமல் இருக்கிறது.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: மற்றவர்கள் உழைத்திருக்கிறார்கள்
  rationale: நடந்து முடிந்த உழைப்பின் தற்போதைய தொடர்பைக் கிரேக்க நிறைவுக் காலத்துக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: அவர்களுடைய உழைப்புக்குள் நுழைந்திருக்கிறீர்கள்
  rationale: ‘அவர்களுடைய உழைப்புக்குள்’ என்ற மூலத்தின் துணிவான உருவகத்தையும், εἰσεληλύθατε என்பதன் நிறைவுக் கால நுட்பத்தையும் பாதுகாக்கிறது.
- source_word: ἐγὼ ... ὑμεῖς
  choice: நான் ... நீங்களோ
  rationale: வெளிப்படையாக வரும் கிரேக்கப் பிரதிப்பெயர்களின் வலியுறுத்தலையும், மற்றவர்களுக்கும் சீடர்களுக்கும் இடையிலான வேறுபாட்டையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: κόπον
  choice: உழைப்பு
  rationale: κοπιάω என்ற தொடர்புடைய வினையுடன் சொல்லியல் இணைப்பைப் பேணுகிறது.
theological_decisions:
- issue: அறுவடை உருவகமும் ‘மற்றவர்கள்’ என்பவர்களின் அடையாளமும்
  choice: வேளாண்மை உருவகத்தையும் ‘மற்றவர்கள்’ என்ற பொதுவான குறிப்பையும் அப்படியே வைத்தல்
  alternative: ‘மற்றவர்கள்’ என்பது தீர்க்கதரிசிகள், யோவான் ஸ்நானகர், இயேசு அல்லது முந்தைய சாட்சிகள் என்று குறிப்பாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் அவர்களைத் தனிப்பட அடையாளம் காட்டவில்லை; ஆகவே அதன் உண்மையான விளக்கத் திறப்பை மொழிபெயர்ப்பு குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க பன்மை இரண்டாம் நபரைப் பயன்படுத்தி, வேளாண்மை உருவகமும் ‘உழைப்பு’ என்ற சொல்லியல் தொடர்ச்சியும் பேணப்பட்டுள்ளன. ‘உழைப்புக்குள் நுழைதல்’ தமிழில் சற்றுத் துணிவான உருவகமாக இருந்தாலும், மூலத்தின் திட்டமிட்ட வெளிப்பாட்டைப் பாதுகாக்க முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
