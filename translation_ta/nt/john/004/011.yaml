id: JHN.4.11
reference: John 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: ta
  text: அந்தப் பெண் அவரிடம், “ஐயா,[a] உம்மிடம் தண்ணீர் எடுப்பதற்குப் பாத்திரம்கூட இல்லை; கிணறும் ஆழமாக இருக்கிறது. அப்படியானால் உயிருள்ள தண்ணீர்[b] உமக்கு எங்கிருந்து கிடைக்கும்?” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்டவரே” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலுக்கேற்ப மரியாதையான “ஐயா” என்ற அழைப்பாகவோ “ஆண்டவரே” என்ற அழைப்பாகவோ பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஓடும் தண்ணீர்” என்றும் பொருள்படலாம்; அதாவது தேங்கி நிற்கும் தண்ணீருக்கு மாறாகப் புதியதாக ஓடும் தண்ணீர். இயேசுவின் சொல்லிலுள்ள ஆழமான பொருளையும் “உயிருள்ள தண்ணீர்” என்ற மொழிபெயர்ப்பு பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: அவரிடம் … என்றாள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றாள்’ இயல்பாக உள்ளது; αὐτῷ என்பதையும் ‘அவரிடம்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: சூழலில் முன்பே அறிமுகமான சமாரியப் பெண்ணைக் குறிக்கிறது; ‘அந்தப் பெண்’ என்பது நவீன தமிழில் இயல்பான குறிப்பாகும்.
- source_word: Κύριε
  choice: ஐயா
  rationale: இந்த உரையாடலின் இக்கட்டத்தில் இது மரியாதையான விளிப்பாகப் புரிந்துகொள்ளப்படுவது இயல்பு. ‘ஆண்டவரே’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: οὔτε ἄντλημα ἔχεις
  choice: உம்மிடம் தண்ணீர் எடுப்பதற்குப் பாத்திரம்கூட இல்லை
  rationale: ἄντλημα என்பது தண்ணீர் எடுக்கப் பயன்படும் கருவி அல்லது பாத்திரம். οὔτε இங்கு ‘கூட இல்லை’ என்ற அழுத்தத்துடன் இயல்பாக வெளிப்படுகிறது.
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: கிணறும் ஆழமாக இருக்கிறது
  rationale: φρέαρ இச்சூழலில் கிணற்றையும் βαθύ அதன் ஆழத்தையும் நேரடியாகக் குறிக்கின்றன. கிரேக்கத்தில் இக்கூற்று நேர்மறையானது; எனவே இதை எதிர்மறை இணைப்பாக மாற்றவில்லை.
- source_word: πόθεν οὖν ἔχεις
  choice: அப்படியானால் … உமக்கு எங்கிருந்து கிடைக்கும்?
  rationale: οὖν காட்டும் முடிவுறுத்தும் தொடர்பை ‘அப்படியானால்’ வெளிப்படுத்துகிறது; πόθεν மூலத்தைப் பற்றி கேட்பதால் ‘எங்கிருந்து’ பயன்படுத்தப்படுகிறது.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: உயிருள்ள தண்ணீர்
  rationale: இந்தச் சொற்றொடர் சாதாரண பயன்பாட்டில் ஓடும் புதிய தண்ணீரைக் குறிக்கலாம்; யோவான் உரையில் ஆழமான உருவகப் பொருளும் உள்ளது. ‘உயிருள்ள தண்ணீர்’ இரு பொருள் வாய்ப்பையும் முடிந்தவரை திறந்துவைக்கிறது.
theological_decisions:
- issue: சமாரியப் பெண் இயேசுவை Κύριε என்று அழைப்பது
  choice: ஐயா
  alternative: ஆண்டவரே
  rationale: உரையாடலின் இந்த ஆரம்ப நிலையில் மரியாதையான அழைப்பே உடனடிச் சூழலுக்கு ஏற்றது; இருப்பினும் கிரேக்கச் சொல் ‘ஆண்டவரே’ என்றும் பொருள்படக்கூடியதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது. இதனால் பெண்ணின் நம்பிக்கைப் புரிதலை வசனம் கூறுவதைவிட அதிகமாக முன்கூட்டியே தீர்மானிப்பது தவிர்க்கப்படுகிறது.
- issue: ὕδωρ τὸ ζῶν என்பதிலுள்ள இரட்டைப் பொருள்
  choice: உயிருள்ள தண்ணீர்
  alternative: ஓடும் தண்ணீர்
  rationale: பெண் இதை இயல்பான ஓடும் தண்ணீராகப் புரிந்துகொள்ளலாம்; இயேசுவின் சொல்லில் ஆழமான ஆன்மிகப் பொருளும் உள்ளது. முதன்மை மொழிபெயர்ப்பு அந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவிடம் பேசுவதால் மரியாதைப் பன்மை வடிவங்களான ‘உம்மிடம்’, ‘உமக்கு’ வைக்கப்பட்டுள்ளன. மூலத்தின் தொடரமைப்பு ‘பாத்திரம்கூட இல்லை; கிணறும் ஆழமாக இருக்கிறது’ என்று சரியாகப் பாதுகாக்கப்பட்டுள்ளது.
