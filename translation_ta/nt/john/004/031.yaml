translation:
  language: ta
  text: இதற்கிடையில், சீடர்கள் அவரிடம், “ரபீ[a], சாப்பிடுங்கள்” என்று வற்புறுத்திக்கொண்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ரபீ” என்பது யூதர்களின் மரியாதைமிக்க அழைப்புப் பட்டம்; இதற்கு “போதகரே” என்றும் பொருள்.
    reason: cultural_note
  - marker: b
    text: “வற்புறுத்திக்கொண்டிருந்தார்கள்” என்பதற்கான கிரேக்க வினைச்சொல்லை “கேட்டுக்கொண்டிருந்தார்கள்” அல்லது “வேண்டிக்கொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்கு இயேசுவைச் சாப்பிடும்படி தொடர்ந்து வலியுறுத்தும் பொருள் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: இதற்கிடையில்
  rationale: பெண் புறப்பட்டுச் சென்றதற்கும் அடுத்த உரையாடலுக்கும் இடைப்பட்ட நேரத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἠρώτων
  choice: வற்புறுத்திக்கொண்டிருந்தார்கள்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ந்த அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுகோளைக் காட்டுகிறது; இச்சூழலில் இயேசுவைச் சாப்பிடும்படி சீடர்கள் வலியுறுத்திய பொருளை வெளிப்படுத்துகிறது.
- source_word: αὐτὸν
  choice: அவரிடம்
  rationale: இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்; தமிழில் வேண்டுகோள் விடுக்கப்படும் நபரை ‘அவரிடம்’ எனக் குறிப்பது இயல்பானது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட சீடர் குழுவைக் குறிக்கிறது; தமிழில் தனித்த நிர்ணயச் சுட்டு தேவையில்லை.
- source_word: λέγοντες
  choice: என்று
  rationale: அவர்கள் விடுத்த வேண்டுகோளின் நேரடி உரையை முதன்மை வினையுடன் இயல்பாக இணைக்கிறது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: யூத மரியாதைமிக்க அழைப்புப் பட்டத்தை மொழிபெயர்த்து மறைக்காமல் ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது.
- source_word: φάγε
  choice: சாப்பிடுங்கள்
  rationale: ஒருமை கட்டளை வடிவத்தின் நேரடியான பொருளை, இயேசுவிடம் சீடர்கள் பேசுவதற்கேற்ற மரியாதை வினைமுற்றில் தருகிறது.
