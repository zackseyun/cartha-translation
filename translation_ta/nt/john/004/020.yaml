source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: ta
  text: “எங்கள் முன்னோர்கள்[a] இந்த மலையில் வழிபட்டார்கள்; நீங்களோ, வழிபட வேண்டிய[b] இடம் எருசலேமில் இருக்கிறது என்று சொல்கிறீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “எங்கள் தந்தையர்”; இங்கு முன்னோர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வழிபடுவது அவசியமான”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: எங்கள் முன்னோர்கள்
  rationale: πατέρες என்பதன் நேரடிப் பொருள் ‘தந்தையர்’ என்றாலும், இங்கு ஒரு சமூகத்தின் முந்தைய தலைமுறையினரைக் குறிக்கிறது. நவீன தமிழில் ‘முன்னோர்கள்’ அந்த வரலாற்று மரபுக் கோரிக்கையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: இந்த மலையில்
  rationale: வழிபாடு நடைபெற்ற இடத்தைக் குறிக்கும் ἐν என்ற இடப்பொருளைத் தமிழில் இயல்பாக ‘இந்த மலையில்’ என்று வழங்குகிறது.
- source_word: προσεκύνησαν
  choice: வழிபட்டார்கள்
  rationale: προσκυνέω வணங்கி விழுதல் அல்லது பக்தியுடன் வழிபடுதல் ஆகிய பொருள்களைக் கொண்டது; சரியான வழிபாட்டு இடத்தைப் பற்றிய இச்சூழலில் ‘வழிபட்டார்கள்’ பொருத்தமானது.
- source_word: ὑμεῖς
  choice: நீங்களோ
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் ஒப்பீட்டு அழுத்தத்துடனும் உள்ள பன்மை முன்னிலையை, தமிழில் ‘நீங்களோ’ இயல்பாகப் பாதுகாக்கிறது; யூதர்கள் என்று வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἐν Ἱεροσολύμοις
  choice: எருசலேமில்தான்
  rationale: ‘எருசலேமில்’ என்பது இடப்பொருளைத் தருகிறது. ‘தான்’ என்பது ὁ τόπος என்ற குறிப்பிட்ட இடத்தையும் வாக்கியத்தின் சூழலிலுள்ள இட வேறுபாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வேறு அடையாளங்களைச் சேர்ப்பதில்லை.
- source_word: ὁ τόπος ὅπου προσκυνεῖν δεῖ
  choice: வழிபட வேண்டிய இடம்
  rationale: δεῖ தரும் பொதுவான அவசியத்தையும் கடப்பாட்டையும் ‘வேண்டிய’ பாதுகாக்கிறது; ὁ τόπος மற்றும் ὅπου இணைந்த அமைப்பை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: καὶ
  choice: ; நீங்களோ
  rationale: καί அடிப்படையில் இணைப்புச் சொல். தமிழில் அரைப்புள்ளியும் ‘நீங்களோ’ என்பதும் ‘எங்கள் முன்னோர்கள்’ என்பதுடனான மாறுபாட்டை வெளிப்படுத்துகின்றன; ‘ஆனால்’ என்று அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: சமாரியர்–யூதர் என்ற அடையாள வேறுபாட்டை மூலத்தில் இருப்பதைவிட வெளிப்படையாக்க வேண்டுமா
  choice: ‘எங்கள் முன்னோர்கள் … நீங்களோ’ என்ற பிரதிப்பெயர் வேறுபாட்டிலேயே வைத்தல்
  alternative: ‘எங்கள் சமாரிய முன்னோர்கள் … யூதர்களாகிய நீங்கள்’ என்று விரித்துரைத்தல்
  rationale: இந்த வசனத்தின் கிரேக்க உரை சமாரியர் அல்லது யூதர் என்ற பெயர்களை வெளிப்படையாகக் கூறவில்லை. சூழலில் தெரியும் அடையாளங்களை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூலத்தின் இறுக்கத்தையும் உரையாடல் மாறுபாட்டையும் பாதுகாக்கிறது.
- issue: προσκυνεῖν δεῖ என்பதில் உள்ள ஆளற்ற அவசியத்தை எவ்வாறு வழங்குவது
  choice: ‘வழிபட வேண்டிய இடம்’
  alternative: ‘வழிபடுவது அவசியமான இடம்’
  rationale: இது ஒரு குறிப்பிட்ட நபருக்கான கட்டளையாக இல்லாமல், வழிபாட்டின் உரிய இடத்தைப் பற்றிய பொதுவான அவசியக் கூற்றாக உள்ளது. ‘வேண்டிய’ அதன் நெறிசார் அவசியத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- issue: எருசலேம் மட்டுமே உரிய இடம் என்ற உட்பொருளை எவ்வளவு வெளிப்படுத்துவது
  choice: ‘எருசலேமில்தான்’
  alternative: ‘எருசலேமில் இருக்கிறது’
  rationale: ὁ τόπος என்ற குறிப்பிட்ட பெயர்ச்சொல்லும் மலையுடன் அமைந்துள்ள வெளிப்படையான மாறுபாடும் ஒரே உரிய இடம் என்ற கூற்றைச் சுட்டுகின்றன. தமிழின் ‘தான்’ இதை இயல்பாகத் தெரிவிக்கிறது; அந்தக் கூற்றை மொழிபெயர்ப்பாளர் உண்மை எனத் தீர்மானிப்பதில்லை, பேசுபவரின் விளக்கமாகவே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்றதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டது. ‘முன்னோர்கள்’ பொதுவாசகருக்கு இயல்பானது; ‘நீங்களோ’ மூலத்தின் சமூக மாறுபாட்டைப் பெயரிட்டு விரிவாக்காமல் காக்கிறது. வசனத்திலுள்ள இரண்டு அடிக்குறிப்பு குறிகளும் உரிய சொற்றொடர்களோடு முதன்மை உரையில் இடம்பெற்றுள்ளன.
