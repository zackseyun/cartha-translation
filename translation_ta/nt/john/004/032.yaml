  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: ta
  text: ஆனால் அவர் அவர்களிடம், “நான் உண்பதற்கு நீங்கள் அறியாத உணவு எனக்கு உண்டு” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: சீடர்களின் முந்தைய வேண்டுகோளுக்கும் இயேசுவின் எதிர்பாராத பதிலுக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: கிரேக்கச் சொல்லாக்கத்தின் இயல்பான தமிழ் கதைநடை வடிவம்.
- source_word: Ἐγὼ
  choice: என்னிடம்
  rationale: வெளிப்படையான முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை, இயல்பான தமிழில் உடைமை அமைப்பின் மூலம் காட்டுகிறது.
- source_word: βρῶσιν
  choice: உணவு
  rationale: இங்கு உண்ணும் செயலை அல்ல, உணவையே குறிக்கிறது; உருவகப் பொருளை முன்கூட்டியே விளக்காமல் நேரடிச் சொல்லைப் பாதுகாக்கிறது.
- source_word: ἔχω φαγεῖν
  choice: என்னிடம் உள்ளது; அதை நான் உண்ண வேண்டும்
  rationale: உண்பதற்கான உணவு தம்மிடம் இருப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்க இறந்தகால வினையெச்சத்தின் நோக்கு/செயற்பாட்டு உறவை வெளிப்படுத்துகிறது.
- source_word: ἣν ὑμεῖς οὐκ οἴδατε
  choice: நீங்கள் அறியாத
  rationale: உணவைச் சார்ந்த தொடர்புப்பெயர் அமைப்பையும், வெளிப்படையான ὑμεῖς தரும் ‘நீங்கள்’ என்ற எதிர்மறை ஒப்புமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் ‘உணவு’ என்ற உருவகம்
  choice: முதன்மை உரையில் ‘உணவு’ என்ற நேரடிச் சொல்லையே வைத்தல்
  alternative: ‘நீங்கள் அறியாத ஒன்று என்னிடம் உண்பதற்கு உள்ளது’
  rationale: அடுத்த சூழல் தந்தையின் சித்தத்தைச் செய்வதைக் குறிக்கும் உருவகத்தை விளக்கினாலும், இவ்வசனம் உருவகத்தையும் சீடர்களின் புரியாமைக்கான வாய்ப்பையும் நோக்கத்துடன் நிலைநிறுத்துகிறது; மொழிபெயர்ப்பு அதை முன்கூட்டியே தீர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் எளிமையும் கொண்ட கதைநடை. மூலத்தின் உருவகத் தெளிவின்மையை விளக்கவுரை இன்றி பாதுகாக்கிறது.
