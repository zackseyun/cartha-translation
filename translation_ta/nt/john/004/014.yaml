  verdict: approve
  source_fidelity: The Tamil accurately conveys the indefinite subject, the water Jesus gives, the emphatic permanent negation of thirst (οὐ μὴ ... εἰς τὸν αἰῶνα), and the water becoming within the recipient a spring welling up toward eternal life. “நித்திய வாழ்வை நோக்கிப்” appropriately preserves the directional force of εἰς without over-identifying the spring with eternal life.
  naturalness: The rendering is fluent modern standard Tamil and retains the dignified metaphorical register of the discourse. “தாகமே எடுக்காது” is idiomatic and supplies suitable emphasis.
  terminology: “நீரூற்று,” “பொங்கியெழும்,” and “நித்திய வாழ்வு” are clear, natural, and suitable for this Johannine context. No doctrinally narrowing terminology has been introduced.
