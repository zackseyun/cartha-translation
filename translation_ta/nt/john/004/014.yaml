id: JHN.4.14
reference: John 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ta
  text: ஆனால் நான் கொடுக்கும் தண்ணீரைக் குடிக்கிறவனுக்கு என்றென்றும் தாகமே எடுக்காது. மாறாக, நான் அவனுக்குக் கொடுக்கும் தண்ணீர் அவனுக்குள் நித்திய வாழ்வை நோக்கிப் பொங்கியெழும் நீரூற்றாக மாறும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: என்றென்றும் தாகமே எடுக்காது
  rationale: οὐ μή என்ற வலுவான மறுப்பையும் εἰς τὸν αἰῶνα என்ற கால நீட்சியையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: πηγὴ ὕδατος
  choice: நீரூற்று
  rationale: தொடர்ந்து ஊறும் நீரின் மூலத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἁλλομένου
  choice: பொங்கியெழும்
  rationale: நீர் துடிப்புடன் மேலெழுதல் அல்லது பாய்தல் என்ற செயற்படிமத்தைத் தக்கவைக்கிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: யோவான் நற்செய்தியின் முக்கியச் சொல்லாட்சியை dignified, widely understood Tamil-இல் வழங்குகிறது.
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον என்பதன் உறவு
  choice: நித்திய வாழ்வை நோக்கிப் பொங்கியெழும்
  alternative: நித்திய வாழ்வாகப் பொங்கியெழும்
  rationale: εἰς என்பதன் இலக்கு அல்லது முடிவு நோக்கிய பொருளைத் தக்கவைத்து, தண்ணீரையும் நித்திய வாழ்வையும் முற்றிலும் ஒன்றாக்கி விளக்குவதைத் தவிர்க்கிறது.
- issue: தாகமின்மையின் கால வலிமை
  choice: என்றென்றும் தாகமே எடுக்காது
  alternative: ஒருபோதும் தாகம் எடுக்காது
  rationale: εἰς τὸν αἰῶνα என்பதை வெளிப்படையாகக் காட்டுவதோடு, οὐ μή தரும் உறுதியான மறுப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், இயேசுவின் உருவக மொழியின் கண்ணியத்தையும் வலிமையையும் காக்கும் வகையிலும் வடிவமைக்கப்பட்டது.
