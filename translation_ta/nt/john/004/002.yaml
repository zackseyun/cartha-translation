translation:
  language: ta
  text: இயேசு தாமே திருமுழுக்குக் கொடுத்துக்கொண்டிருக்கவில்லை என்றாலும், அவருடைய சீடர்களே கொடுத்துக்கொண்டிருந்தார்கள்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: ஆனால்
  rationale: முந்தைய கூற்றைத் திருத்தித் தெளிவுபடுத்தும் விட்டுக்கொடுப்பு-முரண்பாட்டுத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς αὐτὸς
  choice: இயேசுவே
  rationale: αὐτός தரும் வலியுறுத்தலை ‘-வே’ துகள் இயல்பாகப் பேணி, இயேசு தனிப்பட்ட முறையில் இதைச் செய்யவில்லை என்பதைத் தெரிவிக்கிறது.
- source_word: οὐκ ἐβάπτιζεν
  choice: திருமுழுக்குக் கொடுத்துக்கொண்டிருக்கவில்லை
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது வழக்கமான செயல் நுணுக்கத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλ’
  choice: அவருடைய சீடர்கள்தான்
  rationale: ἀλλά குறிக்கும் முரண்பாட்டை ‘-தான்’ வலியுறுத்தலுடன் இயல்பாக வெளிப்படுத்துகிறது; தனியே ‘ஆனால்’ என்பதை மீண்டும் இடாமல் தமிழ்ச் சொல்லோட்டத்தைப் பேணுகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்தான் கொடுத்துக்கொண்டிருந்தார்கள்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ἐβάπτιζον என்ற வினைக் கருத்தைத் தமிழில் வெளிப்படையாக நிரப்பி, செயலைச் செய்தவர்கள் சீடர்களே என்ற எதிர்மறை ஒப்புமையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: இயேசுவின் ஊழியத்தில் திருமுழுக்குக் கொடுத்தவர்கள் யார் என்ற விளக்கம்
  choice: இயேசு தாமே திருமுழுக்குக் கொடுக்கவில்லை; அவருடைய சீடர்களே கொடுத்துக்கொண்டிருந்தார்கள்.
  alternative: இயேசு திருமுழுக்குக் கொடுக்கவில்லை; அவருடைய சீடர்கள் கொடுத்தார்கள்.
  rationale: தனிப்பட்ட செய்பவரைப் பற்றிய αὐτός வலியுறுத்தலையும், imperfect வினையின் தொடர்ச்சி அல்லது வழக்கமான செயல் நுணுக்கத்தையும் காக்கிறது; உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுழுக்கு’ என்பது βαπτίζω என்பதற்கான பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல். முந்தைய வசனத்துடன் வாக்கியம் தொடர்வதை இறுதி நீண்ட கோடு பேணுகிறது.
