  source_fidelity: திருத்தம் தேவை. ὁ λεγόμενος χριστός (‘கிறிஸ்து என்று அழைக்கப்படுகிறவர்’) என்பது மூல முதன்மை உரையின் விளக்க இணைப்பாக உள்ளது; வரைவு அதை அடிக்குறிப்புக்கு மட்டும் மாற்றுவதால் அந்த வெளிப்படையான உரைப்பகுதி முதன்மை உரையில் விடுபடுகிறது. மற்ற முக்கிய கூறுகள்—பெண், ‘எனக்குத் தெரியும்,’ வருகை, ‘வரும்போது,’ ‘நமக்கு,’ மற்றும் ἅπαντα-வின் முழுமை—சரியாக உள்ளன.
  naturalness: ‘மேசியா—“கிறிஸ்து” என்று அழைக்கப்படுகிறவர்—வருகிறார்’ என்பது நவீன நிலையான தமிழில் வாசிக்கத்தக்கது; கோடிடைச் செருகல் கிரேக்கத்தின் விளக்க இணைப்பைத் தெளிவாகக் காக்கிறது. ‘எல்லாவற்றையும் நமக்கு அறிவிப்பார்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
  terminology: மேசியா மற்றும் கிறிஸ்து ஆகிய இரு பட்டப்பெயர்களையும் முதன்மை உரையிலேயே வைத்தல், மூலத்தின் செமித்தியப் பெயர்–கிரேக்க விளக்க உறவைப் பாதுகாக்கிறது. அடிக்குறிப்பு அவற்றின் சொற்பொருள் உறவை விளக்குகிறது; தனிப்பட்ட கோட்பாட்டு விளக்கம் ஒன்றையும் சேர்ப்பதில்லை.
